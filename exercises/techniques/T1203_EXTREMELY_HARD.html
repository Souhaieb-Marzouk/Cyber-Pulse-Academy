var META={"topicId":"t1203","mitreId":"T1203","name":"Exploitation for Client Execution","mitreName":"Exploitation for Client Execution","objectType":"technique","title":"T1203 Exploitation for Client Execution — EXTREMELY HARD","difficulty":"extremely-hard","severity":"extremely-hard","severityLabel":"EXTREMELY HARD","batch":4,"questionCount":15,"estimatedMinutes":28,"passMark":70,"protocol":"cpa-staged-v1"};
var INTRO={"learnHtml":"<p><b>Welcome to the top level of this exam.<\/b> T1203 — Exploitation for Client Execution is a <b>Technique<\/b> in the MITRE ATT&amp;CK framework: attackers exploit bugs in client applications — browsers, Office programs, PDF readers, common third-party software — to make their own code run. This is not classroom material. You will use it every week in real work.<\/p><p>In the <b>SOC<\/b>, you will read EDR timelines where a browser or Word crashes, drops a file, spawns an unexpected child and calls out — and you must decide in minutes what is real. In <b>incident response<\/b>, you will fight pressure: a CISO who wants to reimage everything now, a month-end close, a tender deadline. You will learn the difference between containing a host and destroying the evidence that wins the case. In <b>vulnerability management<\/b>, you will judge zero-days against n-days, plan patch rings, and pick compensating controls that hold the line while patches roll. In <b>detection engineering<\/b>, you will build a compound triage pipeline from the four-signal chain — crash, drop, child, egress inside a short window. In <b>cyber threat intelligence<\/b>, you will map real campaigns to real exploits: 3CX's trojanised signed update beside a Chrome drive-by, APT29's Word, Exchange and Reader bugs, APT28's Office exploit, admin@338's old Word bug, Andariel's ActiveX zero-days.<\/p><p>Nothing here arrives as one clean signal. Every exercise gives you noise, gaps and two colleagues who disagree. Your job is to resolve the conflict out loud, choose the least aggressive action that still works, and know which best practice is wrong today.<\/p>","themes":[{"name":"The post-exploit EDR chain","concepts":["compound triage pipeline","client app crash or abnormal exit","file drop in user-writable path","unexpected child process","C2-like egress","short correlation window","renderer crash vs broker child"]},{"name":"Mitigation and patching basics","concepts":["legacy CVE on unpatched estate","M1048/M1050/M1051 mitigation mapping"]},{"name":"Real campaigns and attribution","concepts":["3CX supply chain with Chrome CVE-2022-0609 drive-by","APT29 Word and Reader exploits","APT28 Office exploit","admin@338 Word exploit","Andariel ActiveX zero-days"]},{"name":"Judgement under ambiguity","concepts":["zero-day vs n-day judgement","incomplete telemetry","conflicting egress attribution","sandbox detonation vs production truth","campaign-wide scope","evidence preservation vs containment cost","patch-window trade-off","least aggressive / safe-vs-destructive response"]}]};
var EXERCISES=[{"id":"EX-01","type":"qcm-single","summary":"Board brief: why the 3CX combo hit harder","concepts":["3CX supply chain with Chrome CVE-2022-0609 drive-by","zero-day vs n-day judgement","campaign-wide scope"],"scenario":"<p>The board asks why the <b>3CX campaign<\/b> caused more damage than \"a normal Chrome exploit\". You hold four sources: the CTI campaign note, the exec question ticket, the proxy tally and the ATT&amp;CK excerpt. The EU proxy rollup is still pending, so the tally is one region only.<\/p><pre class=\"art mono\">CAMPAIGN NOTE (CTI, verified)\n- vector 1: trojanised 3CXDesktopApp update — validly signed, pushed through the vendor's own update channel\n- vector 2: Chrome drive-by, CVE-2022-0609, on lure sites; exploited in the wild before any fix existed\n- the two vectors are separate entry routes into the same operation (AppleJeus-linked infrastructure)<\/pre><div class=\"ticket\"><span class=\"k\">Exec question<\/span> #EXB-114: \"If none of our people visited a lure page, why did we still need the Chrome patch?\"<\/div><pre class=\"art mono\">PROXY TALLY (region NA only — EU rollup pending)\nlure-site visits: 31 hosts | trojanised-update beacons: 412 hosts | both: 26 hosts<\/pre><pre class=\"art mono att\">TA0002 Execution — T1203 procedure example: 3CX Supply Chain Attack (C0057) — Chrome CVE-2022-0609 with drive-by site<\/pre>","question":"<p>Which answer gives the board the correct reason the combination was worse than either part alone?<\/p>","options":["The Chrome bug spread itself from host to host across the network, so one visit infected whole buildings","Both parts needed a user to open an email attachment, so it was ordinary phishing at larger scale","The signed update channel carried the implant to hundreds of hosts at once, while the drive-by needed only a visit","The drive-by exploited the update server itself, which is why the vendor channel was trojanised"],"correct":2,"hint":"Restated constraint from the note: the two vectors are separate entry routes — each one must be explained by itself.","explanation":"<p>The correct answer names both halves: a <b>trust channel<\/b> (a signed vendor update) delivered the implant to hundreds of hosts with no user action at all, and the <b>drive-by<\/b> added a second route that needed nothing beyond visiting a lure page. The other options fail on the evidence: nothing in the note says the Chrome bug self-propagated; a drive-by needs no opened attachment and the update needed none either; and the drive-by hit client browsers, not the update server — the server-side abuse was the trojanised update itself. This is also why the Chrome patch mattered even for hosts that never visited a lure page: closing one of two entry routes still shrinks the attack surface.<\/p>","study":"ATT&CK T1203 procedure example C0057; contrast the updater side with T1195.002 Compromise Software Supply Chain."},{"id":"EX-02","type":"line-select","summary":"Four chain lines across two hosts in the campaign view","concepts":["3CX supply chain with Chrome CVE-2022-0609 drive-by","compound triage pipeline","client app crash or abnormal exit","renderer crash vs broker child","unexpected child process","C2-like egress"],"scenario":"<p>Day 1, campaign triage window for the 3CX-style operation. The merged EDR view holds two suspected execution chains — a browser drive-by on <b>WORKST9-1<\/b> and a trojanised signed MSI on <b>SRV-APP3<\/b> — plus a renderer crash that never went further. The pipeline owner's rule stands: counts and chains first, actions after the bridge.<\/p><div class=\"ticket\"><span class=\"k\">INC-6641<\/span> SEV-2 · 3CX-style campaign · candidate chains on WORKST9-1 and SRV-APP3 · WORKST9-1 network sensor gap 09:41:50–09:43:20 (agent upgrade)<\/div><pre class=\"art mono\">PIPELINE RULES (runbook §4)\n- counts and correlated chains first; actions only after the bridge\n- a signature on an installer is not a verdict<\/pre><pre class=\"art mono\">SENSOR STATUS  WORKST9-1: net sensor gap 09:41:50–09:43:20 · proc and file sensors healthy · SRV-APP3: all healthy<\/pre>","question":"<p>Click the <b>four<\/b> lines that together evidence the two execution chains.<\/p>","logLines":["WORKST9-1  08:12:40  EID1   chrome.exe --type=renderer exit=0xC0000005  (reopened OK; no drop, no child, no egress)","WORKST9-1  09:41:09  EID1/11 chrome.exe renderer exit=0xC0000005 + file written C:\\Users\\mv\\AppData\\Local\\Temp\\upd[.]hta","WORKST9-1  09:41:13  EID1   chrome.exe -&gt; mshta.exe  C:\\Users\\mv\\AppData\\Local\\Temp\\upd[.]hta","SRV-APP3   09:44:31  EID1   msiexec.exe /i 3CXDesktopApp-18.12.407.msi  (Authenticode: 3CX Ltd, valid)","SRV-APP3   09:45:02  EID1   msiexec.exe -&gt; dllhost.exe /ProcessID:{e60f9a10-2c44-4f17}","SRV-APP3   09:45:20  EID3   dllhost.exe -&gt; 107[.]189[.]9[.]175:443  (bare IP, no SNI)","SRV-APP3   09:51:44  EID3   msiexec.exe -&gt; download[.]3cx[.]com:443  (vendor mirror, cert valid)","WORKST7-2  09:46:12  EID3   OneDriveUpdater.exe -&gt; gds[.]office[.]com:443  (vendor signed)"],"badLines":[1,2,4,5],"filterable":true,"hint":"Restated constraint: a valid signature is not a verdict on this view — you are counting correlated cause and effect, not trust labels.","explanation":"<p>Lines 2–3 are the <b>WORKST9-1 drive-by chain<\/b>: the renderer died with 0xC0000005 and a file landed in a user-writable Temp path two seconds later, then the browser spawned <span class=\"mono\">mshta.exe<\/span> to run the dropped file — a broker-level child, not a renderer helper. Its egress falls inside the sensor gap, so the chain stands on process evidence alone; the gap is logged as incomplete telemetry, not as absence of egress. Lines 5–6 are the <b>SRV-APP3 chain<\/b>: the installer spawning <span class=\"mono\">dllhost.exe<\/span> mid-install, then a bare-IP session with no SNI. The MSI's signature is valid and still trojanised — exactly why behaviour, not Authenticode, decides. Line 1 is a crash-only event with a clean window around it (weak alone); line 4 is the install event itself, context but not execution proof; lines 7–8 are the vendor's own mirror and a signed updater — same company name as the trojanised product, which is the trap, and still benign.<\/p>","study":"Correlating crash → drop → child → egress across hosts; signature trust versus behaviour for installers."},{"id":"EX-03","type":"fill-blank","summary":"Classify two exploits for the board note","concepts":["zero-day vs n-day judgement","legacy CVE on unpatched estate","patch-window trade-off"],"scenario":"<p>Board pack, two exploits, one paragraph. The CISO has already asked which one is \"the emergency\". Your sources disagree about the first one, and the second one has a fix that never landed.<\/p><pre class=\"art mono\">ADVISORY (vendor, verified): \"Chrome CVE-2022-0609 — exploited in the wild before a fix was available.\"<\/pre><div class=\"ticket\"><span class=\"k\">Ticket<\/span> #VLN-2210: legacy finance PC TP-PC07 runs Word 2010 SP2 — public exploit code exists for its 2012-era parsing bug, a fix has existed for years, and this build never received it.<\/div><pre class=\"art mono\">SCANNING VENDOR (unverified): \"no evidence of exploitation of CVE-2022-0609 in your telemetry\" — their sensor covers region NA only; the EU rollup is pending.<\/pre><pre class=\"art mono att\">Judgement rule: exploited before a fix exists = zero-day · a fix exists but the estate has not taken it = n-day<\/pre>","question":"<p>Complete the board note with the classification the evidence supports.<\/p>","template":"Board note: Chrome CVE-<input1> was exploited in the wild before any fix existed, so it is judged a zero-day and handled with emergency response plus compensating controls. The legacy PC's Word bug has had a public fix for years that this build never took, so it is judged an <input2> and handled by patch rings, not emergency response.","blanks":[{"answer":"2022-0609","alts":["2022 0609"],"placeholder":"year-number","width":10},{"answer":"n-day","alts":["n day","nday"],"placeholder":"class","width":7}],"hint":"Restated constraint: the scanner's \"no evidence\" covers one region with the rollup still pending — absence there is not a verdict.","explanation":"<p>Blank one: the vendor-verified advisory states the Chrome bug was <b>exploited in the wild before a fix existed<\/b> — that is the zero-day test, and the scanner's regional \"no evidence\" is incomplete telemetry, not negative proof. Blank two: the Word bug has a <b>long-available fix the build never took<\/b>, which is exactly an n-day — a vulnerability-management problem driven by the unpatched estate. The handling differs because of the judgement: the zero-day gets compensating controls (proxy, exploit-protection rules) while the fix ships under pressure; the n-day gets scheduled rings with the exposed legacy hosts prioritised, because nobody is burning a zero-day budget on a bug you can patch on a plan.<\/p>","study":"Zero-day versus n-day handling in vulnerability management; exploited-in-the-wild signals versus scanner visibility."},{"id":"EX-04","type":"terminal","summary":"Build the read-only per-host child-event pipeline","concepts":["compound triage pipeline","unexpected child process","short correlation window","evidence preservation vs containment cost"],"scenario":"<p>Day 2, 09:55. The incident commander wants a per-host count of child-process events from the fleet export — highest first — to ring-fence the worst hosts before the 10:00 bridge. The storage owner has threatened to purge the export share at noon, and one teammate has already suggested \"just clean the file up in place with sed -i\". Standard GNU text tools are installed on the hunt host.<\/p><pre class=\"art mono\">$ head fleet-children.log\n2024-05-14T09:02:11Z WORKST5-11 parent=WINWORD.EXE child=powershell.exe\n2024-05-14T09:02:15Z WORKST5-11 parent=WINWORD.EXE child=powershell.exe\n2024-05-14T09:41:13Z WORKST9-1  parent=chrome.exe  child=mshta.exe\n2024-05-14T09:41:20Z WORKST9-1  parent=chrome.exe  child=mshta.exe\n2024-05-14T09:45:02Z SRV-APP3   parent=msiexec.exe child=dllhost.exe\n2024-05-14T09:07:44Z FIN-WS33   parent=WINWORD.EXE child=splwow64.exe\n2024-05-14T09:07:45Z FIN-WS33   parent=WINWORD.EXE child=splwow64.exe\n2024-05-14T09:07:46Z FIN-WS33   parent=WINWORD.EXE child=splwow64.exe\n2024-05-14T09:58:02Z WORKST7-2  parent=OneDriveUpdater.exe child=OneDriveStandaloneUpdater.exe\n2024-05-14T10:12:55Z HR-WS07    parent=OUTLOOK.EXE child=(sensor gap — line truncated<\/pre><div class=\"ticket\"><span class=\"k\">IC request<\/span> #IC-881: one line, per-host counts, highest first, from /var/edr/fleet-children.log — the host is the second whitespace-separated field<\/div><pre class=\"art mono\">PIPELINE RULES (runbook §4): every triage stage is read-only; evidence files are never edited in place.<\/pre><pre class=\"art mono\">STORAGE NOTE: export share purge scheduled 12:00 — copy first, analyse read-only.<\/pre>","question":"<p>Type the one-line pipeline that prints each host's child-event count, highest count first.<\/p>","shellPrompt":"analyst@SRV-HUNT-02:~$","expected":"awk '{print $2}' /var/edr/fleet-children.log | sort | uniq -c | sort -rn","elements":[{"any":["awk"],"label":"the awk field extractor"},{"any":["sort"],"label":"a sort stage"},{"any":["uniq"],"label":"the uniq -c counter"},{"any":["-rn"],"label":"the reverse-numeric final sort"}],"hint":"Restated constraints: the host is the second whitespace-separated field, and the runbook forbids editing the export in place.","explanation":"<p>The pipeline reads: <span class=\"mono\">awk '{print $2}'<\/span> pulls the host field (second column) from every line; <span class=\"mono\">sort<\/span> groups equal hosts so the next stage can collapse them; <span class=\"mono\">uniq -c<\/span> prefixes each host with its count; <span class=\"mono\">sort -rn<\/span> orders highest count first. Read the output like a senior: WORKST5-11 (2), WORKST9-1 (2) and SRV-APP3 (1) are the chain hosts and go to the top of the bridge list; FIN-WS33's three <span class=\"mono\">splwow64.exe<\/span> children are the Word print helper — benign noise that inflates counts, which is why a human reads the top of the list before any action. The truncated HR-WS07 line marks the sensor gap — incomplete telemetry, noted for the bridge. And the <span class=\"mono\">sed -i<\/span> suggestion is refused: editing evidence in place destroys its integrity, and with the noon purge pending the export must be copied, then analysed read-only.<\/p>","study":"awk/sort/uniq pipelines for log triage; evidence integrity — never modify originals."},{"id":"EX-05","type":"qcm-multi","summary":"Pick the two change-board actions without a reboot storm","concepts":["campaign-wide scope","patch-window trade-off","M1048/M1050/M1051 mitigation mapping"],"scenario":"<p>Month-end close, day 1, 14:00. The n-day Word exploit is public and the KB is published. The CISO wants \"everything patched tonight\". The change board needs two actions that hold the line without a reboot storm.<\/p><pre class=\"art mono\">MAIL GATEWAY EXPORT — quarterly-report[.]doc recipients: 47 hosts, all in finance\nbuild overlap: 39 on the vulnerable build | 8 already patched in the last ring<\/pre><div class=\"ticket\"><span class=\"k\">Change board<\/span> #CHG-3391: ring capacity 260 endpoints/night · close ends 20:00 daily · freeze exceptions need CISO signature<\/div><div class=\"ticket\"><span class=\"k\">CISO message<\/span> \"Patch the whole estate tonight — I don't want a second case like last quarter.\"<\/div><pre class=\"art mono\">EPP CONSOLE — rule available: \"block Office child processes (WINWORD/EXCEL → cmd/powershell/mshta)\"\ndeployable fleet-wide in 6 minutes · no reboot · reversible<\/pre>","question":"<p>Select the <b>two<\/b> actions the change board should take tonight.<\/p>","options":["Force one estate-wide reboot at 18:00 so every endpoint takes the KB at the same time","Start ring patching tonight with the 47 recipients first, then the rest of finance, on the normal cadence","Reimage all 47 recipient hosts before close to guarantee every copy of the payload is gone","Deploy the Office-child-block rule fleet-wide tonight as the compensating control until the rings finish","Wait for the vendor's next monthly bulletin so the change freeze stays completely clean"],"correct":[1,3],"hint":"Restated constraint: the board gave one hard number — 260 endpoints per night — and the close ends at 20:00.","explanation":"<p>Correct: <b>ring patching scoped by recipient overlap<\/b> puts the 47 exposed finance hosts first within the 260-per-night capacity, then widens — no storm, no broken close. And the <b>Office-child-block rule<\/b> is the compensating control that bridges the patch window: it is an exploit-protection measure (the M1050 side of the M1048/M1050/M1051 toolkit), reversible, fleet-wide in six minutes, and it breaks the exact chain link the exploit needs. Wrong: a single 18:00 estate-wide reboot violates the ring design mid-close and buys nothing the staged rings don't; reimaging 47 hosts destroys evidence and halts the close for hosts that only need the KB; and waiting for the next bulletin widens the window on a bug whose fix is already published.<\/p>","study":"Patch rings scoped by exposure; compensating controls during patch windows; M1050 exploit protection."},{"id":"EX-06","type":"drag-drop","summary":"Split the sandbox report: transfer vs misleading","concepts":["sandbox detonation vs production truth","client app crash or abnormal exit","unexpected child process","C2-like egress"],"scenario":"<p>The vendor's detonation report for quarterly-report[.]doc ends with the verdict \"benign — no C2 observed\". Production proxy logs disagree. Before the detection team transfers anything, you must split the report's findings.<\/p><pre class=\"art mono\">DETONATION REPORT (vendor) — verdict: \"benign — no C2 observed\"\nobserved: WINWORD 0xC0000005 crash → %TEMP% drop → mshta child → (no egress logged)\nappendix: lab VM egress restricted by allow-list · one step ran on the macOS harness image\nappendix: VBoxService.exe children logged in the process tree<\/pre><pre class=\"art mono\">PRODUCTION (fleet, later the same day)\n- mshta egress to 45[.]61[.]187[.]30:443, URI /api/v2/gate — same dropped-file name, same URI pattern\n- three hosts show the same chain inside 90 seconds; two recipients show it on open with no macro prompt<\/pre><div class=\"ticket\"><span class=\"k\">Ticket<\/span> #DET-772: detection team requests transfer of report findings to production rules — analyst splits transferable vs misleading first.<\/div><pre class=\"art mono\">ANALYST NOTE (conflict, explicit): the report's \"no C2\" verdict came from a lab VM whose\nallow-list blocked egress — the sandbox never had the chance to see the beacon production saw.<\/pre>","question":"<p>Place each finding in the right bucket.<\/p>","bank":["Chain order: WINWORD 0xC0000005 crash, %TEMP% drop, mshta child — all inside 90 seconds","The report's verdict \"no C2 observed\", stated as a fact about the payload","The dropped-file name and the /api/v2/gate URI pattern, both seen again in production","The macOS harness step — the estate is Windows-only","VBoxService.exe children read as payload behaviour","The \"fires on open with no macro prompt\" finding, matching every production report so far"],"slots":[{"label":"Transfer to production detections","accept":[0,2,5]},{"label":"Misleading — do not transfer","accept":[1,3,4]}],"hint":"Restated constraint: the appendix says the lab allow-list blocked egress — judge the \"no C2\" verdict with that in hand.","explanation":"<p><b>Transfer:<\/b> the chain order matches production exactly (crash → drop → mshta child inside 90 seconds); the dropped-file name and the <span class=\"mono\">/api/v2/gate<\/span> URI pattern are corroborated in production proxy logs; and the no-macro-prompt finding agrees with every production report — all three describe behaviour the fleet actually shows. <b>Do not transfer:<\/b> the \"no C2\" verdict is an artefact of the lab allow-list, not a fact about the payload — sandbox silence about egress is not payload truth; the macOS harness step cannot become a Windows rule on a Windows-only estate; and the <span class=\"mono\">VBoxService.exe<\/span> children belong to the lab image's own tooling, not to the payload. The rule the split teaches: when a sandbox verdict and production telemetry conflict, the production chain wins and the verdict gets rewritten with the reason.<\/p>","study":"Sandbox detonation pitfalls: egress allow-lists, harness artefacts, platform mismatch."},{"id":"EX-07","type":"multi-step","summary":"Command decision on the finance campaign, four calls","concepts":["campaign-wide scope","evidence preservation vs containment cost","incomplete telemetry","patch-window trade-off"],"scenario":"<p>Month-end close, day 2. Four calls sit with you on the bridge; each one costs something whichever way you go.<\/p><div class=\"ticket\"><span class=\"k\">Case state<\/span> 47 recipients of quarterly-report[.]doc · chains confirmed on WORKST5-11, WORKST9-1 and SRV-APP3 · AV cloud verdict \"Exploit.Win32.Generic\" on WORKST6-9 with no EDR chain · close ends 20:00 · 12 legacy treasury devices need a reboot for the KB<\/div><pre class=\"art mono\">WORKST5-11 chain (confirmed): WINWORD 0xC0000005 09:02:09 → %TEMP%\\upd[.]dll 09:02:11 → powershell child 09:02:13 → egress 45[.]61[.]187[.]30:443 09:02:56<\/pre><pre class=\"art mono\">WORKST6-9 (AV flag only): WINWORD opened the doc 09:04 · no crash · no drop · no child · no egress · AV verdict fired at upload time in the cloud console<\/pre><div class=\"ticket\"><span class=\"k\">CISO<\/span> \"Reimage all 47 tonight. Certainty.\" · <span class=\"k\">CFO<\/span> \"Clean close.\" · <span class=\"k\">IR lead<\/span> \"Not before the captures leave those hosts.\"<\/div>","question":"<p>Work through the four command decisions.<\/p>","steps":[{"prompt":"10:12 — first command of the day?","options":["Trust the AV cloud verdict: treat WORKST6-9 as the primary victim and isolate it first","Isolate the three chain-confirmed hosts, keep them powered on, and start memory captures while pulling the mail trail","Declare fleet compromise and start reimaging all 47 recipients immediately"],"correct":1,"outcome":"Right — execution is proven by chains, not by an upload-time AV verdict; contain what is proven, preserve what is volatile."},{"prompt":"10:40 — the AV vendor confirms the WORKST6-9 verdict was a generic cloud classification on the file at upload; no execution evidence exists there. The CISO repeats: reimage all 47 before close. Full reimage halts the close for about six hours and erases volatile evidence. Decision?","options":["Hold reimage to the three chain-confirmed hosts, and only after memory and disk capture to the evidence share; the other 44 stay on watch behind the Office-child rule","Reimage all 47 tonight — certainty beats evidence and accounting","Do nothing anywhere until the AV vendor publishes a deeper report"],"correct":0,"outcome":"Right — reimage the proven, after capture; watch the exposed. \"Reimage immediately\" would cost both the close and the case."},{"prompt":"11:05 — treasury: the 12 legacy close devices need a reboot for the KB; a mid-close reboot loses the consolidated sheets and three hours. Call?","options":["Force the reboot on all 12 now — patching cannot wait for accounting","Defer the 12 devices to next quarter and rely on luck","Patch the 12 immediately after close tonight; until then hold them behind the Office-child rule and the proxy rule"],"correct":2,"outcome":"Right — the patch window is bridged by reversible controls; the reboot lands hours after close, not in the middle of it."},{"prompt":"13:30 — which scope check closes the campaign review tonight?","options":["Assume every host without an alert is clean and close the case","Match the mail-trail recipients against the build inventory: any recipient still on the vulnerable build with heavy attachment traffic goes into tomorrow's first ring","Reimage every recipient next weekend as a formality"],"correct":1,"outcome":"Right — scope by recipient-plus-build overlap; silence is not evidence of safety while telemetry stays incomplete."}],"hint":"Restated constraint: the only proven execution is on the three hosts with chains — the AV verdict fired at upload time, not at run time.","explanation":"<p>Step 1: the conflicting signals — an AV flag on WORKST6-9 versus full chains on three other hosts — are resolved by what proves execution: the chain, not an upload-time classification. Contain the proven, preserve the volatile. Step 2: the common best practice \"reimage immediately\" is wrong while volatile evidence exists; reimage only the three proven hosts, after capture, and watch the 44 exposed recipients behind a reversible rule. Step 3: the patch-window trade-off is settled with compensating controls instead of mid-close downtime — the 12 treasury devices get the KB hours after close, protected meanwhile by the Office-child and proxy rules. Step 4: close the review by scoping on recipient-plus-build overlap, because alert silence is not evidence of safety with incomplete telemetry.<\/p>","study":"Incident command under executive pressure; evidence-first containment; compensating controls across patch windows."},{"id":"EX-08","type":"qcm-single","summary":"Resolve the shared-IP beacon conflict for the bridge","concepts":["conflicting egress attribution","C2-like egress","Andariel ActiveX zero-days"],"scenario":"<p>Day 2, 09:03. One proxy line, two feeds that disagree, and an exec bridge in twenty minutes.<\/p><pre class=\"art mono\">PROXY 09:02:56  WORKST9-1 → 45[.]61[.]187[.]30:443  TLS, no domain, URI pattern /api/v2/gate<\/pre><pre class=\"art mono\">FEED A (threat intel): 45[.]61[.]187[.]30 — \"C2 infrastructure, Andariel-linked campaigns\"\nFEED B (CDN vendor):   45[.]61[.]187[.]30 — \"shared hosting range used by our CDN partner\"<\/pre><pre class=\"art mono\">EDR LINEAGE  WORKST9-1: chrome.exe renderer exit=0xC0000005 09:02:41 → file write %TEMP%\\upd[.]hta 09:02:43 → mshta.exe child 09:02:47 → mshta connect 45[.]61[.]187[.]30:443 09:02:56<\/pre><div class=\"ticket\"><span class=\"k\">Exec question<\/span> #EXB-117: \"Is this the Andariel actor or a broken CDN? You have 20 minutes.\"<\/div><p>Both feeds have been right before on shared ranges — IP reputation alone cannot settle this one.<\/p>","question":"<p>How do you resolve the attribution conflict for the bridge?<\/p>","options":["Average the two conflicting feeds into a medium-confidence verdict and close the ticket tonight","Treat the session as benign, because a CDN partner also uses the same shared hosting range","Block the IP fleet-wide, reimage WORKST9-1 now, and let forensics catch up afterwards","Resolve at process level: the lineage runs to the exploit chain's child, which outranks reputation here"],"correct":3,"hint":"Restated constraint: the EDR line gives the full parent chain with second-level timestamps — neither feed has anything like that.","explanation":"<p>The correct answer resolves the conflict at the level where the evidence actually lives: the session's <b>process lineage<\/b> runs from the crashed browser through the dropped file to the mshta child, and that child made this exact connection 15 seconds after the crash. On a shared hosting range, reputation feeds will legitimately disagree — the process linkage breaks the tie. Averaging feeds into \"medium confidence\" is not analysis and closing the ticket loses the case; declaring it benign because a CDN shares the range ignores that the CDN claim and the beacon can both be true; and reimage-before-capture destroys the volatile evidence that would confirm the payload. On the bridge, say exactly this: <b>execution is confirmed by the chain; the \"Andariel-linked\" actor tag stays caveated<\/b> until payload analysis corroborates it — the feed's Andariel label is plausible, not proven.<\/p>","study":"Attribution discipline — process-level linkage before IP reputation; confidence language for exec briefings."}];

EXERCISES.push({"id":"EX-09","type":"ordering","summary":"Rank four response moves so nothing is destroyed","concepts":["evidence preservation vs containment cost","patch-window trade-off","least aggressive / safe-vs-destructive response","campaign-wide scope"],"scenario":"<p>Day 2, 16:55, exec bridge. The CFO opens with: \"Reimage the three hosts tonight so the close is clean.\" The IR lead answers: \"Not before the evidence leaves those hosts.\" You hold the ladder — rank the four moves on the screen.<\/p><div class=\"ticket\"><span class=\"k\">Bridge minutes<\/span> D2-16:55 · CFO: reimage first · CISO: patch everything now · IR lead: evidence first · decision: analyst ranks the moves<\/div><pre class=\"art mono\">EVIDENCE SHARE \\\\EVIDSRV\\t1203 — 1.2 TB free · capacity for exactly three captures · retention 90 days (legal hold)<\/pre><pre class=\"art mono\">PATCH RINGS — capacity 260 endpoints/night · the KB for the exploited build requires a reboot · close ends 20:00<\/pre><div class=\"ticket\"><span class=\"k\">Proxy<\/span> reversible URI-pattern rule approved by the change manager — deployable in 4 minutes, no downtime<\/div>","question":"<p>Order the four moves from first to last so nothing is destroyed out of order and the window is not wasted.<\/p>","items":["Capture volatile memory and the process tree from the three chain-confirmed hosts to the evidence share","Deploy the reversible proxy rule blocking the C2 URI pattern across the fleet","Patch the exploited build in rings after close, recipients first, legacy close devices last","Reimage the three confirmed hosts once scope and evidence sign-off are complete"],"hint":"Restated constraints from the bridge: the captures fit the share, the proxy rule is reversible — and the reimage is not.","explanation":"<p>The ladder runs cheapest-and-most-reversible first. <b>First<\/b>, the memory and process-tree captures: they are only possible while the hosts run, and a reimage erases them in the first 90 seconds — the only move with a hard deadline. <b>Second<\/b>, the reversible proxy rule: minutes to deploy, no downtime, and it blunts any further chain fleet-wide while nothing is destroyed. <b>Third<\/b>, the patch rings after close — recipients first, legacy close devices last — the trade-off made explicit: the reboot lands when it costs least, with the proxy and Office-child rules bridging the gap. <b>Last<\/b>, the reimage, and only after scope and evidence sign-off: it destroys the droppers, the chain state and the memory artefacts, so it goes at the end of the ladder, not the start. Every earlier move is reversible; every later move costs more or destroys something.<\/p>","study":"The containment ladder: preserve, blunt, patch, rebuild; volatility order and change-window arithmetic."},
{"id":"EX-10","type":"fill-blank","summary":"Complete the attribution paragraph from the verified table","concepts":["APT29 Word and Reader exploits","APT28 Office exploit","campaign-wide scope"],"scenario":"<p>CTI handover, cluster triage. Two clusters of client-exploit activity in the fleet; the trainee's draft card mixes them up, and the exec readout is in an hour.<\/p><pre class=\"art mono\">CLUSTER ONE: Word exploit chain · Exchange exploitation observed on the mail path · Adobe Reader exploit in the same toolkit\nCLUSTER TWO: Office parser bug CVE-2017-0262 in spearphishing attachments · no Reader or Exchange tooling<\/pre><pre class=\"art mono att\">ATT&amp;CK T1203 procedure table (verified): APT29 (G0016) — Word, Exchange and Adobe Reader exploits · APT28 (G0007) — Office CVE-2017-0262<\/pre><pre class=\"art mono\">DRAFT CARD (trainee, from memory): \"CVE-2017-0262 = APT29\" · \"Reader/Exchange toolkit = APT28\"<\/pre><div class=\"ticket\"><span class=\"k\">Handover ticket<\/span> #CTI-557: fix the attribution paragraph before the readout — the draft was written from memory. Scope note: cluster one hit 12 hosts, cluster two 3 hosts; scope each cluster separately.<\/div>","question":"<p>Complete the attribution paragraph.<\/p>","template":"Cluster one chained Word, <input1> and Adobe Reader exploits — consistent with APT29 (G0016). Cluster two delivered the Office parser bug CVE-2017-0262 in attachments — consistent with APT<input2> (G0007), despite the draft card.","blanks":[{"answer":"Exchange","alts":["exchange"],"placeholder":"product","width":10},{"answer":"28","alts":["28"],"placeholder":"number","width":4}],"hint":"Restated constraint: the procedure table is the verified source and the ticket says the draft was written from memory — check which cluster's products the table actually lists.","explanation":"<p>Blank one: cluster one's trio — <b>Word, Exchange, Adobe Reader<\/b> — matches APT29's documented client-exploit set (G0016) exactly, product for product. Blank two: CVE-2017-0262 is <b>APT28's<\/b> documented Office exploit (G0007), so the number is 28 — not APT29, whatever the draft card says. The draft card had both pairs swapped, which is the classic memory error when two campaigns share a year and a technique; quoting it in the readout would put an attribution error on the record. The resolution rule is boring and absolute: verified procedure tables over memory. The scope note matters too — the toolkits and recipient overlaps do not mix (12 hosts versus 3), so each cluster is scoped and reported on its own.<\/p>","study":"ATT&CK procedure examples G0016 and G0007; attribution hygiene — verified sources, separate scoping."},
{"id":"EX-11","type":"multi-step","summary":"One Reader crash must not trigger a fleet response","concepts":["incomplete telemetry","client app crash or abnormal exit","file drop in user-writable path","unexpected child process","evidence preservation vs containment cost","least aggressive / safe-vs-destructive response"],"scenario":"<p>Night shift, 02:10. The tender analyst's workstation, WORKST2-7, reports one Adobe Reader crash. The deal closes at 09:00 and the assistant VP is awake in the bridge channel. Four calls, each with a cost.<\/p><div class=\"ticket\"><span class=\"k\">Case state<\/span> WORKST2-7: reader.exe exit=0xC0000005 on tender-v4[.]pdf · no drop · no child · no egress · host telemetry otherwise complete · tender submission deadline 09:00 · fleet of 260 endpoints<\/div><div class=\"ticket\"><span class=\"k\">AVP (bridge channel)<\/span> \"Declare a fleet incident NOW and cut the VPN. I am not losing this deal to a PDF.\"<\/div><pre class=\"art mono\">SENSOR STATUS  WORKST2-7: proc, file and net sensors healthy, no gaps in the last 24 h · fleet: healthy<\/pre><pre class=\"art mono\">LOANER POOL: 4 clean machines imaged this morning · issue SLA 15 minutes · tender files re-sendable from the mail gateway copy<\/pre>","question":"<p>Work through the four night-shift calls.<\/p>","steps":[{"prompt":"02:10 — one crash, nothing else. First command?","options":["Declare the fleet incident and cut the VPN as the AVP demands","Wipe %TEMP% on WORKST2-7 as a precaution and move on","Do nothing yet: log it, keep the host on watch, and query the last 24 hours for a real chain — a lone crash is not execution"],"correct":2,"outcome":"Right — gather more evidence first; with telemetry complete and no other link, a single crash is not an incident."},{"prompt":"02:40 — WORKST2-7 again: a second reader.exe crash on tender-v5[.]pdf, a file write to %TEMP%\\upd[.]js, and a wscript.exe child spawned by reader.exe. No egress visible yet. Command?","options":["Keep watching — two crashes in one night are still noise","Isolate WORKST2-7 only, keep it powered on, capture memory and the dropped file, and pull the mail trail for the tender PDFs","Declare the fleet incident now and cut the VPN fleet-wide"],"correct":1,"outcome":"Right — crash plus drop plus child is the chain: contain the one proven host, preserve the evidence, scope by the mail trail."},{"prompt":"02:55 — the on-call colleague proposes deleting %TEMP% on all 260 endpoints \"to remove the payload before the deadline\".","options":["Reject the wipe: it destroys chain evidence and blinds the fleet-wide hash hunt; run a read-only hash sweep instead","Approve the wipe — cleanliness first before the deadline","Delete %TEMP% only on WORKST2-7, then de-isolate it for the submission"],"correct":0,"outcome":"Right — a fleet %TEMP% wipe is the destructive shortcut: it erases droppers, kills scoping, and clears nothing from running memory."},{"prompt":"03:20 — the tender analyst must submit by 09:00 from the isolated host. What do you do?","options":["De-isolate WORKST2-7 \"just for the submission\" without controls","Issue a clean loaner from the pool, re-send the tender files from the mail gateway copy to the loaner, keep WORKST2-7 isolated for forensics, and give the deal team a 15-minute ETA","Cancel the tender submission until forensics finishes"],"correct":1,"outcome":"Right — the deadline is met on a clean host, the evidence host stays isolated, and nobody pays the whole-deal cost for one workstation."}],"hint":"Restated constraint: at 02:10 the host's telemetry is complete and shows nothing but the crash — silence elsewhere on that host is real silence.","explanation":"<p>Step 1: the incomplete-telemetry trap runs in both directions — here telemetry is <b>complete<\/b>, so a lone crash is genuinely weak; the right call is to gather more evidence, not to declare a fleet incident that costs sleep and credibility. Step 2: the chain completes (crash → %TEMP% drop → wscript child), which is exactly the least-aggressive escalation: contain one host, keep it powered on, preserve memory and the dropped file, scope by the mail trail. Step 3: the fleet %TEMP% wipe is the common best practice that is wrong here — it destroys the very artefacts that hash hunting and scoping need and clears nothing from running memory; the read-only hash sweep gets the same coverage at zero evidence cost. Step 4: the real cost — the 09:00 deadline — is handled by separating work from evidence: a clean loaner meets the deadline while the compromised host stays isolated for forensics.<\/p>","study":"Crash-only versus chain events; destructive versus read-only sweeps; deadline management in incident response."},
{"id":"EX-12","type":"terminal","summary":"Capture memory to the evidence share before any reimage","concepts":["evidence preservation vs containment cost","least aggressive / safe-vs-destructive response","unexpected child process","C2-like egress"],"scenario":"<p>Day 2, 17:20. CISO on the bridge: \"Reimage WORKST5-11 in the next 15 minutes — the close cannot wait.\" The incident commander countermands once: volatile memory first, and nothing written to the compromised host's own disk. The capture tool <b>winpmem.exe<\/b> is staged in <b>C:\\Tools<\/b> on the host; the evidence share <b>\\\\EVIDSRV\\t1203<\/b> has 1.2 TB free and a legal hold.<\/p><div class=\"ticket\"><span class=\"k\">IC order<\/span> #IC-884: capture raw memory of WORKST5-11 → file name ws511.mem → write to \\\\EVIDSRV\\t1203 → hash after capture → only then discuss reimage<\/div><pre class=\"art mono\">EVIDENCE SHARE \\\\EVIDSRV\\t1203 — 1.2 TB free · legal hold 90 days · write access: IR group only<\/pre><pre class=\"art mono\">WHY MEMORY, IN ONE SCREEN\n- WORKST5-11 chain: WINWORD 0xC0000005 → %TEMP% drop → powershell child → egress 45[.]61[.]187[.]30:443\n- memory holds: the injected code, the child's full command line, the C2 configuration, keys in use\n- a reimage destroys all of it in the first 90 seconds of the rebuild<\/pre><div class=\"ticket\"><span class=\"k\">CISO message<\/span> \"Best practice is a clean build. Do the capture later from backups if you must.\"<\/div><p>The last message is the trap: there are no \"later\" captures from backups — volatile memory is now or never.<\/p>","question":"<p>Type the command that captures the host's raw memory into the case folder on the evidence share, with the ordered file name.<\/p>","shellPrompt":"PS C:\\Tools&gt;","expected":"winpmem.exe \\\\EVIDSRV\\t1203\\ws511.mem","elements":[{"any":["winpmem"],"label":"the memory-capture tool"},{"any":["evidsrv"],"label":"the evidence share host"},{"any":["t1203"],"label":"the case folder in the path"},{"any":["ws511"],"label":"the host tag in the output file name"}],"hint":"Restated constraint: the IC order names the share, the case folder and the file name — and forbids writing anything to the compromised host's own disk.","explanation":"<p><span class=\"mono\">winpmem.exe \\\\EVIDSRV\\t1203\\ws511.mem<\/span> runs the capture tool from C:\\Tools and writes the raw memory image straight to the case folder on the evidence share under the host-tagged name — exactly what IC order #IC-884 specifies. The CISO's \"reimage immediately\" is the best practice that is wrong here: the rebuild destroys the injected code, the powershell child's command line and the C2 configuration in its first 90 seconds, and there is no backup of RAM. Capturing to a local path like C:\\Temp fails the same test — it is attacker-writable, it dies with the rebuild, and it breaks the chain of custody. After the capture: hash the image, log the handler, and only then put the reimage back on the table with the evidence safely off-host.<\/p>","study":"Memory acquisition with winpmem; chain of custody; sequencing volatile capture before destructive response."},
{"id":"EX-13","type":"matching","summary":"Fix the campaign-to-vector card before the readout","concepts":["3CX supply chain with Chrome CVE-2022-0609 drive-by","APT28 Office exploit","admin@338 Word exploit","Andariel ActiveX zero-days"],"scenario":"<p>CTI handover, thirty minutes before the exec readout. The trainee's draft card is already on the wall, written from memory, and at least one pair looks swapped.<\/p><div class=\"ticket\"><span class=\"k\">Handover ticket<\/span> #CTI-556: verify the campaign-to-vector card against the ATT&amp;CK procedure table for T1203 before the readout.<\/div><pre class=\"art mono\">DRAFT CARD (trainee, from memory — verify before use)\n- 3CX supply chain (C0057)  → Office CVE-2017-0262 in attachments\n- APT28 (G0007)             → ActiveX zero-days\n- admin@338 (G0018)         → Word CVE-2012-0158 in attachments\n- Andariel (G0138)          → trojanised update plus Chrome drive-by<\/pre><pre class=\"art mono att\">ATT&amp;CK T1203 procedure table (verified)\n- 3CX Supply Chain Attack (C0057): Chrome CVE-2022-0609 with drive-by site\n- APT28 (G0007): Office CVE-2017-0262\n- admin@338 (G0018): Word CVE-2012-0158 in attachments\n- Andariel (G0138): ActiveX zero-days<\/pre><pre class=\"art mono\">FEED NOTE: Andariel activity concentrates on South Korean targets; the group's documented T1203 vector is ActiveX zero-days used for code execution.<\/pre>","question":"<p>Click an item on the left, then its verified match on the right.<\/p>","pairs":[{"left":"3CX supply chain (C0057)","right":"trojanised signed desktop-app update plus a Chrome drive-by that needed only a visit"},{"left":"APT28 (G0007)","right":"Office parser exploit CVE-2017-0262 in spearphishing attachments"},{"left":"admin@338 (G0018)","right":"email attachments exploiting the old Word bug CVE-2012-0158"},{"left":"Andariel (G0138)","right":"ActiveX zero-days fired for code execution against South Korean targets"}],"hint":"Restated constraint: the ticket says the draft was written from memory and must be verified against the table — the table, not the draft, decides.","explanation":"<p>The verified pairs: <b>3CX<\/b> is the supply-chain case — a trojanised, validly signed desktop-app update plus the Chrome CVE-2022-0609 drive-by on lure sites; <b>APT28<\/b> used the Office parser bug CVE-2017-0262 in spearphishing attachments; <b>admin@338<\/b> carried the 2012 Word bug CVE-2012-0158 in email attachments; <b>Andariel<\/b> fired ActiveX zero-days for code execution, concentrated on South Korean targets. The draft card had 3CX, APT28 and Andariel rotated among each other — the classic memory error when three campaigns share a technique; only the admin@338 pair survived. Reading the draft aloud to the executives would have put three wrong attributions on the record in one slide, which is why the ticket demands verification against the table first.<\/p>","study":"ATT&CK T1203 procedure examples: C0057, G0007, G0018, G0138."},
{"id":"EX-14","type":"line-select","summary":"Production chain vs sandbox proof on the filterable log","concepts":["conflicting egress attribution","sandbox detonation vs production truth","C2-like egress","client app crash or abnormal exit"],"scenario":"<p>Day 3, campaign review. The vendor report still says \"no C2 observed\". The fleet log for WORKST9-1 disagrees — and the merged view mixes three hosts, so the filter box earns its keep.<\/p><pre class=\"art mono\">VENDOR REPORT (unchanged): \"verdict: benign — no C2 observed\" (lab VM egress allow-listed)<\/pre><pre class=\"art mono\">PROXY EXCERPT 09:02:56  WORKST9-1 → 45[.]61[.]187[.]30:443  URI /api/v2/gate<\/pre><div class=\"ticket\"><span class=\"k\">Review ticket<\/span> #REV-311: click the four WORKST9-1 lines that prove the production chain the report denied; ignore the sandbox echo and the tender host's noise.<\/div>","question":"<p>Click the <b>four<\/b> WORKST9-1 lines that prove the production execution chain.<\/p>","logLines":["SRV-APP3   09:12:40  EID3   OneDriveUpdater.exe -&gt; gds[.]office[.]com:443  (vendor signed)","WORKST9-1  09:02:41  fault  chrome.exe --type=renderer exit=0xC0000005","WORKST2-7  09:10:02  EID1   reader.exe exit=0xC0000005 (tender PDF; no drop, no child)","WORKST9-1  09:02:43  EID11  chrome.exe  TargetFilename=C:\\Users\\mv\\AppData\\Local\\Temp\\upd[.]hta","WORKST9-1  09:14:05  EID1   WINWORD.EXE -&gt; splwow64.exe  (print helper)","WORKST9-1  09:02:47  EID1   chrome.exe -&gt; mshta.exe  C:\\Users\\mv\\AppData\\Local\\Temp\\upd[.]hta","WORKST2-7  09:11:19  EID1   reader.exe -&gt; VBoxService.exe  (lab harness artefact per report appendix)","WORKST9-1  09:02:56  EID3   mshta.exe -&gt; 45[.]61[.]187[.]30:443  (bare IP, URI /api/v2/gate)"],"badLines":[1,3,5,7],"filterable":true,"hint":"Restated constraint: the report's lab VM could never emit egress — its silence about C2 is a lab artefact, not production truth.","explanation":"<p>The four WORKST9-1 lines are the complete chain, 15 seconds end to end: the renderer <b>crash<\/b> (0xC0000005), the <b>drop<\/b> of <span class=\"mono\">upd[.]hta<\/span> into a user-writable Temp path, the <b>child<\/b> (chrome spawning mshta on the dropped file), and the <b>egress<\/b> (mshta to a bare IP on the gate URI). Together they refute the sandbox verdict: production telemetry outranks a lab VM whose allow-list blocked the very beacon the report denies — and the proxy excerpt on the bridge corroborates the egress independently. Everything else is noise with a reason: the WORKST2-7 reader crashes are crash-only (no drop, no child) and the VBoxService child is the lab harness artefact echoed into the fleet view; the signed updater, the print helper and so on are routine. The IP's shared-range reputation conflict stays caveated — process linkage, not reputation, carries this verdict.<\/p>","study":"Production versus sandbox truth; filterable dual-host triage; crash-only versus full-chain events."},

  function widgetFor(ex, box, wstate) {

      un.addEventListener('click', function () { if (S.answers[S.current].status === 'checked') return; wstate.assign = {}; wstate.activeLeft = null; drawMatch(); });
      box.appendChild(un);
    } else if (ex.type === 'terminal') {
      wstate.cmd = wstate.cmd || '';
      var term = el('div', 'term');
      term.appendChild(el('div', 't-bar',
        '<span class="t-dot d-r"></span><span class="t-dot d-a"></span><span class="t-dot d-g"></span><span class="t-title">' + esc(ex.shellPrompt || 'shell') + ' — type the command, then press Enter or Check</span>'));
      var body = el('div', 't-body');
      var hist = el('div', 't-hist'); hist.textContent = wstate.cmd ? wstate.cmd : '';
      var inrow = el('div', 't-in');
      var pr = el('span', 'pr', esc(ex.shellPrompt || '$'));
      var inp = document.createElement('input');
      inp.type = 'text'; inp.value = wstate.cmd; inp.setAttribute('aria-label', 'Terminal command input'); inp.autocomplete = 'off'; inp.spellcheck = false;
      inp.addEventListener('input', function () { wstate.cmd = inp.value; hist.textContent = ''; });
      inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); doCheck(); } });
      inrow.appendChild(pr); inrow.appendChild(inp);
      body.appendChild(hist); body.appendChild(inrow); term.appendChild(body);
      box.appendChild(term);
      if (ex.syntaxPanel) box.appendChild(el('div', 'syntax', ex.syntaxPanel));
      setTimeout(function () { try { inp.focus(); } catch (e) { } }, 60);
    } else if (ex.type === 'line-select') {
      wstate.sel = wstate.sel || [];
      var lv = el('div', 'logview');
      var bar = el('div', 'lv-bar', '<span class="lv-tag">FILTER</span>');
      var finp = document.createElement('input');
      finp.type = 'text'; finp.placeholder = ex.filterable ? 'filter lines… (visual aid only)' : 'visual filter…';
      finp.setAttribute('aria-label', 'Filter log lines');
      bar.appendChild(finp); lv.appendChild(bar);
      var lines = el('div', 'lv-lines');
      function drawLines(f) {
        lines.innerHTML = '';
        ex.logLines.forEach(function (l, i) {
          if (f && l.toLowerCase().indexOf(f.toLowerCase()) < 0) return;
          var row = el('div', 'logline' + (wstate.sel.indexOf(i) >= 0 ? ' sel' : ''));
          row.setAttribute('role', 'button'); row.tabIndex = 0;
          row.setAttribute('aria-label', 'Log line ' + (i + 1) + (wstate.sel.indexOf(i) >= 0 ? ', selected' : ''));
          row.appendChild(el('span', 'ln', String(i + 1)));
          row.appendChild(el('span', null, esc(l)));
          row.addEventListener('click', function () {
            if (S.answers[S.current].status === 'checked') return;
            var p = wstate.sel.indexOf(i); if (p >= 0) { wstate.sel.splice(p, 1); row.classList.remove('sel'); row.setAttribute('aria-label', 'Log line ' + (i + 1)); }
            else { wstate.sel.push(i); row.classList.add('sel'); }
          });
          row.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); row.click(); } });
          lines.appendChild(row);
        });
      }
      drawLines('');
      finp.addEventListener('input', function () { drawLines(finp.value.trim()); });
      lv.appendChild(lines); box.appendChild(lv);
      box.appendChild(el('div', 'dd-hint', 'Click the line(s) that answer the question. The filter box is a visual aid only — filtering does not change your selection.'));
    } else if (ex.type === 'multi-step') {
      wstate.step = wstate.step === undefined ? 0 : wstate.step;
      wstate.picks = wstate.picks || {};
      wstate.stepSel = wstate.stepSel === undefined ? null : wstate.stepSel;
      drawStep();
    }
    function drawStep() {
      var sw = el('div', null, '');
      /* outcomes of already-confirmed intermediate steps */
      for (var done = 0; done < wstate.step; done++) {
        var pk = wstate.picks[done];
        var okv = pk === ex.steps[done].correct;
        sw.appendChild(el('div', 'outcome', (okv ? '✓ ' : '✗ ') + 'Step ' + (done + 1) + ' confirmed — the scenario continues. ' + esc(ex.steps[done].outcome || '') + (done === wstate.step - 1 ? ' <b>Intermediate step: the timer keeps running.</b>' : '')));
      }
      var st = ex.steps[wstate.step];
      sw.appendChild(el('span', 'step-h', '⎘ STEP ' + (wstate.step + 1) + ' OF ' + ex.steps.length));
      sw.appendChild(el('div', 'block-b', st.prompt));
      var confirmBtn = null;
      st.options.forEach(function (o, i) {
        var r = optRow(i, o);
        if (wstate.stepSel === i) r.classList.add('sel');
        r.addEventListener('click', function () {
          if (wstate.picks[wstate.step] !== undefined) return;
          wstate.stepSel = i;
          sw.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); });
          r.classList.add('sel');
          if (confirmBtn) confirmBtn.disabled = false;
        });
        sw.appendChild(r);
      });
      confirmBtn = el('button', 'btn btn-blue', (wstate.step === ex.steps.length - 1 ? '✓ Confirm final step & check' : '→ Confirm step'));
      confirmBtn.type = 'button'; confirmBtn.disabled = wstate.stepSel === null;
      confirmBtn.setAttribute('aria-label', 'Confirm step ' + (wstate.step + 1));
      confirmBtn.addEventListener('click', function () {
        if (wstate.stepSel === null || wstate.picks[wstate.step] !== undefined) return;
        wstate.picks[wstate.step] = wstate.stepSel;
        wstate.stepSel = null;
        if (wstate.step < ex.steps.length - 1) {
          wstate.step++;
          drawStep(); /* intermediate: no auto-pause, timer keeps running */
        } else {
          doCheck(); /* final confirm = final Check: triggers the auto-pause */
        }
      });
      sw.appendChild(confirmBtn);
      box.innerHTML = '';
      box.appendChild(sw);
    }
  }

  /* ---------------- scoring ---------------- */
  function scoreExercise(ex, wstate) {
    var items = [], N = 0, H = 0, W = 0, canon = null;
    function item(state, label) { items.push({ state: state, label: label }); }
    if (ex.type === 'qcm-single') {
      N = 1;
      var sel = wstate.sel && wstate.sel[0];
      if (sel === undefined) { item('mi', 'No option selected'); }
      else if (sel === ex.correct) { H = 1; item('ok', '✓ Correct — ' + strip(ex.options[ex.correct])); }
      else { W = 1; item('no', '✗ You chose: ' + strip(ex.options[sel])); }
      canon = ex.options[ex.correct];
    } else if (ex.type === 'qcm-multi') {
      N = ex.correct.length;
      var selset = wstate.sel || [];
      ex.correct.forEach(function (ci) {
        if (selset.indexOf(ci) >= 0) { H++; item('ok', '✓ Correct: ' + strip(ex.options[ci])); }
        else { item('mi', '○ Missed: ' + strip(ex.options[ci])); }
      });
      selset.forEach(function (si) { if (ex.correct.indexOf(si) < 0) { W++; item('no', '✗ Wrong: ' + strip(ex.options[si])); } });
      canon = ex.correct.map(function (ci) { return strip(ex.options[ci]); }).join(' · ');
    } else if (ex.type === 'fill-blank') {
      N = ex.blanks.length;
      ex.blanks.forEach(function (bl, bi) {
        var v = norm(wstate.vals && wstate.vals[bi]);
        var accept = [norm(bl.answer)].concat((bl.alts || []).map(norm));
        if (!v) { item('mi', '○ Missed blank ' + (bi + 1) + ' — expected: ' + esc(bl.answer)); }
        else if (accept.indexOf(v) >= 0) { H++; item('ok', '✓ Blank ' + (bi + 1) + ': ' + esc(bl.answer)); }
        else { W++; item('no', '✗ Blank ' + (bi + 1) + ' — you typed "' + esc(v) + '", expected: ' + esc(bl.answer)); }
      });
      canon = ex.blanks.map(function (bl) { return bl.answer; }).join(' | ');
    } else if (ex.type === 'drag-drop') {
      N = ex.bank.length;
      Object.keys(wstate.place || {}).forEach(function (k) {
        var bi = parseInt(k, 10), si = wstate.place[k];
        if (ex.slots[si] && ex.slots[si].accept.indexOf(bi) >= 0) { H++; item('ok', '✓ "' + strip(ex.bank[bi]) + '" → ' + esc(ex.slots[si].label)); }
        else { W++; item('no', '✗ "' + strip(ex.bank[bi]) + '" does not belong in ' + esc(ex.slots[si] ? ex.slots[si].label : '?')); }
      });
      ex.bank.forEach(function (t, bi) { if (wstate.place[bi] === undefined) item('mi', '○ Missed: "' + strip(t) + '" → ' + esc(slotLabelFor(ex, bi))); });
      canon = ex.slots.map(function (sl) { return sl.label + ': ' + sl.accept.map(function (bi) { return strip(ex.bank[bi]); }).join(', '); }).join(' | ');
    } else if (ex.type === 'ordering') {
      N = ex.items.length;
      var order = wstate.order || [];
      order.forEach(function (bi, pos) {
        if (bi === pos) { H++; item('ok', '✓ Position ' + (pos + 1) + ': ' + strip(ex.items[pos])); }
        else { W++; item('no', '✗ Position ' + (pos + 1) + ' — you put "' + strip(ex.items[bi]) + '", expected "' + strip(ex.items[pos]) + '"'); }
      });
      canon = ex.items.map(function (t, i) { return (i + 1) + '. ' + strip(t); }).join(' ');
    } else if (ex.type === 'matching') {
      N = ex.pairs.length;
      ex.pairs.forEach(function (p, li) {
        var a = (wstate.assign || {})[li];
        if (a === undefined) item('mi', '○ Missed: "' + strip(p.left) + '" → ' + esc(p.right));
        else if (a === li) { H++; item('ok', '✓ "' + strip(p.left) + '" → ' + esc(p.right)); }
        else { W++; item('no', '✗ "' + strip(p.left) + '" you matched to "' + strip(ex.pairs[a].right) + '", expected "' + esc(p.right) + '"'); }
      });
      canon = ex.pairs.map(function (p) { return strip(p.left) + ' = ' + strip(p.right); }).join(' | ');
    } else if (ex.type === 'terminal') {
      N = ex.elements.length;
      var cmd = norm(wstate.cmd || '');
      ex.elements.forEach(function (el2) {
        var hit = (el2.any || []).some(function (a) { return cmd.indexOf(String(a).toLowerCase()) >= 0; });
        if (hit) { H++; item('ok', '✓ ' + esc(el2.label)); }
        else { item('mi', '○ Missing: ' + esc(el2.label)); }
      });
      if (!cmd) item('mi', '○ Nothing typed — expected: ' + esc(ex.expected));
      canon = ex.expected;
    } else if (ex.type === 'line-select') {
      N = ex.badLines.length;
      var sel2 = wstate.sel || [];
      ex.badLines.forEach(function (li) {
        if (sel2.indexOf(li) >= 0) { H++; item('ok', '✓ Line ' + (li + 1) + ' is indeed the one to flag'); }
        else { item('mi', '○ Missed line ' + (li + 1) + ': ' + esc(shorten(ex.logLines[li], 90))); }
      });
      sel2.forEach(function (li) {
        if (ex.badLines.indexOf(li) < 0) { W++; item('no', '✗ Line ' + (li + 1) + ' is benign: ' + esc(shorten(ex.logLines[li], 80))); }
      });
      canon = ex.badLines.map(function (li) { return 'line ' + (li + 1); }).join(', ');
    } else if (ex.type === 'multi-step') {
      N = ex.steps.length;
      ex.steps.forEach(function (st, si) {
        var p = (wstate.picks || {})[si];
        if (p === undefined) item('mi', '○ Missed step ' + (si + 1) + ' — expected: ' + strip(st.options[st.correct]));
        else if (p === st.correct) { H++; item('ok', '✓ Step ' + (si + 1) + ': ' + strip(st.options[st.correct])); }
        else { W++; item('no', '✗ Step ' + (si + 1) + ' — you chose "' + strip(st.options[p]) + '", expected "' + strip(st.options[st.correct]) + '"'); }
      });
      canon = ex.steps.map(function (st, si) { return (si + 1) + '. ' + strip(st.options[st.correct]); }).join(' ');
    }
    var credit = N > 0 ? Math.max(0, (H - W) / N) : 0;
    if (N === 1) credit = H === 1 ? 1 : 0; /* single-answer: binary */
    if (S.answers[S.current].hintUsed) credit = Math.max(0, credit - 0.10);
    credit = Math.round(credit * 100) / 100;
    return { credit: credit, items: items, N: N, H: H, W: W, canon: canon };
  }
  function strip(s) { return esc(String(s).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim()); }
  function shorten(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function slotLabelFor(ex, bi) { var lbl = ''; ex.slots.forEach(function (sl) { if (sl.accept.indexOf(bi) >= 0) lbl = sl.label; }); return lbl; }

  /* ---------------- exercise screen ---------------- */
  function renderExercise(i) {
    var ex = EXERCISES[i];
    S.current = i;
    var a = S.answers[i];
    var area = $('exerciseArea'); area.innerHTML = '';
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    $('progressBar').style.width = Math.round(((i + 1) / EXERCISES.length) * 100) + '%';
    var tpEl = $('tbPart'); if (tpEl) { tpEl.textContent = 'Exercise ' + (i + 1) + ' of ' + EXERCISES.length; }

    var card = el('div', 'card');
    /* SCENARIO */
    var sc = el('div', 'block blk-scenario');
    var longSc = ex.scenario.length > 380;
    sc.innerHTML = '<div class="block-h"><span aria-hidden="true">📄</span> SCENARIO' + (longSc ? '<button type="button" class="sc-toggle" aria-expanded="true">⇅ collapse</button>' : '') + '</div>' +
      '<div class="block-b" id="scBody">' + ex.scenario + (ex.artifactNote ? '<div class="dd-hint">' + esc(ex.artifactNote) + '</div>' : '') + '</div>';
    card.appendChild(sc);
    if (longSc) {
      var tbtn = sc.querySelector('.sc-toggle'), body = sc.querySelector('#scBody');
      tbtn.addEventListener('click', function () {
        var open = tbtn.getAttribute('aria-expanded') === 'true';
        tbtn.setAttribute('aria-expanded', String(!open));
        tbtn.textContent = open ? '⇅ expand' : '⇅ collapse';
        body.classList.toggle('hidden', open);
      });
    }
    /* QUESTION */
    card.appendChild(el('div', 'block blk-question',
      '<div class="block-h"><span aria-hidden="true">❓</span> QUESTION</div><div class="block-b">' + ex.question + '</div>'));
    /* YOUR ANSWER */
    var answ = el('div', 'block blk-answer', '<div class="block-h"><span aria-hidden="true">✍</span> YOUR ANSWER</div>');
    var abody = el('div', 'block-b'); answ.appendChild(abody); card.appendChild(answ);

    var wstate = a.wstate;
    widgetFor(ex, abody, wstate);

    /* action row */
    var actions = el('div', 'actions');
    var checkBtn = el('button', 'btn btn-primary', '✓ Check');
    checkBtn.type = 'button'; checkBtn.id = 'checkBtn'; checkBtn.setAttribute('aria-label', 'Check your answer');
    checkBtn.addEventListener('click', doCheck);
    var nextBtn = el('button', 'btn btn-blue hidden', (i === EXERCISES.length - 1 || S.reviewMode) ? (S.reviewMode ? '⏭ Back to review' : '⏭ Final submit') : '⏭ Next');
    nextBtn.type = 'button'; nextBtn.id = 'nextBtn';
    nextBtn.addEventListener('click', goNext);
    var hintBtn = el('button', 'btn btn-amber', '💡 Hint (−10%)');
    hintBtn.type = 'button'; hintBtn.setAttribute('aria-label', 'Show hint, costs 10 percent of this exercise credit');
    hintBtn.disabled = a.hintUsed || a.status === 'checked';
    hintBtn.addEventListener('click', function () {
      if (a.hintUsed || a.status === 'checked') return;
      a.hintUsed = true; hintBtn.disabled = true;
      var hb = el('div', 'hintbox', '<div class="hb-h">💡 Hint — this exercise\'s credit is now reduced by 10%</div>' + esc(ex.hint));
      card.insertBefore(hb, actions);
    });
    var skipBtn = el('button', 'btn btn-ghost', '⚠ Skip');
    skipBtn.type = 'button'; skipBtn.setAttribute('aria-label', 'Skip this exercise'); skipBtn.disabled = a.status === 'checked';
    skipBtn.addEventListener('click', doSkip);
    actions.appendChild(checkBtn); actions.appendChild(nextBtn); actions.appendChild(el('span', 'spacer'));
    actions.appendChild(hintBtn); actions.appendChild(skipBtn);
    card.appendChild(actions);
    area.appendChild(card);

    /* manual pause veil (hidden by default) */
    if (S.timerState === 'PAUSED_MANUAL') showPauseVeil();

    /* restore feedback if already checked (should not normally happen) */
    if (a.status === 'checked') { renderFeedback(card, ex, a, true); checkBtn.disabled = true; nextBtn.classList.remove('hidden'); }

    updateScoreBar();
    /* pause button lives in topbar */
    renderTopbarButtons();
  }
  function renderTopbarButtons() {
    var bar = $('topbar');
    var old = document.getElementById('pauseBtn');
    if (old) old.remove();
    if (S.screen !== 'exam') return;
    var b = el('button', 'btn btn-ghost', '⏸ Pause');
    b.type = 'button'; b.id = 'pauseBtn'; b.setAttribute('aria-label', 'Pause the exam (manual pause)');
    b.addEventListener('click', function () {
      if (S.timerState === 'RUNNING' || S.timerState === 'PAUSED_AUTO_CHECK') {
        S.priorState = S.timerState;
        setTimerState('PAUSED_MANUAL'); showPauseVeil();
      } else if (S.timerState === 'PAUSED_MANUAL') {
        hidePauseVeil(); setTimerState(S.priorState || 'RUNNING');
      }
    });
    bar.appendChild(b);
    var oldF = document.getElementById('finishBtn');
    if (oldF) oldF.remove();
    var f = el('button', 'btn btn-ghost', '⏹ Finish');
    f.type = 'button'; f.id = 'finishBtn'; f.setAttribute('aria-label', 'Finish the exam early');
    f.addEventListener('click', function () { finishExam(false); });
    bar.appendChild(f);
  }
  function showPauseVeil() {
    var stage = document.querySelector('.exam-stage');
    var old = stage.querySelector('.pause-veil'); if (old) old.remove();
    var veil = el('div', 'pause-veil',
      '<div class="pv-ic" aria-hidden="true">⏸</div><div class="pv-word">PAUSED — manual</div>' +
      '<div style="color:var(--text-secondary);max-width:420px">The exercise is hidden while you are on a break. The timer is stopped.</div>');
    var r = el('button', 'btn btn-primary', '▶ Resume');
    r.type = 'button'; r.setAttribute('aria-label', 'Resume the exam');
    r.addEventListener('click', function () {
      hidePauseVeil();
      setTimerState(S.priorState === 'PAUSED_AUTO_CHECK' ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
    });
    veil.appendChild(r);
    stage.appendChild(veil);
    $('exerciseArea').querySelector('.card').style.visibility = 'hidden';
  }
  function hidePauseVeil() {
    var v = document.querySelector('.pause-veil'); if (v) v.remove();
    var c = $('exerciseArea').querySelector('.card'); if (c) c.style.visibility = 'visible';
  }

  function doCheck() {
    var i = S.current, ex = EXERCISES[i], a = S.answers[i];
    if (a.status === 'checked') return;
    var res = scoreExercise(ex, a.wstate);
    a.status = 'checked';
    a.credit = res.credit;
    a.result = res;
    a.label = res.credit >= 1 ? 'correct' : (res.credit > 0 ? 'partial' : 'incorrect');
    setTimerState('PAUSED_AUTO_CHECK'); /* check-triggered auto-pause */
    var card = $('exerciseArea').querySelector('.card');
    renderFeedback(card, ex, a, false);
    var cb = document.getElementById('checkBtn'); if (cb) cb.disabled = true;
    var sb = document.querySelector('#exerciseArea .btn-ghost'); /* skip button */ if (sb) sb.disabled = true;
    var hb = document.querySelector('#exerciseArea .btn-amber'); if (hb) hb.disabled = true;
    var nb = document.getElementById('nextBtn'); if (nb) nb.classList.remove('hidden');
    lockWidgets(card);
    updateScoreBar();
  }
  function lockWidgets(card) {
    var abody = card.querySelector('.blk-answer');
    if (!abody) return;
    abody.querySelectorAll('button, input').forEach(function (x) {
      x.disabled = true; x.style.pointerEvents = 'none'; x.readOnly = true;
      if (x.classList.contains('chip')) x.draggable = false;
    });
  }
  function renderFeedback(card, ex, a, restoring) {
    var old = card.querySelector('.fb'); if (old) old.remove();
    var res = a.result;
    var cls = a.label === 'correct' ? 'fb-correct' : (a.label === 'partial' ? 'fb-partial' : 'fb-incorrect');
    var word = a.label === 'correct' ? '✓ CORRECT' : (a.label === 'partial' ? '✓ PARTIALLY CORRECT' : '✗ INCORRECT');
    var fb = el('div', 'fb ' + cls);
    var hh = '<span>' + word + '</span>';
    if (res.N > 1) hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + ' — ' + res.H + '/' + res.N + ' items</span>';
    else hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + '</span>';
    if (a.hintUsed) hh += '<span class="fb-credit">💡 hint −0.10 applied</span>';
    fb.appendChild(el('div', 'fb-h', hh));
    var it = el('div', 'fb-items');
    res.items.forEach(function (im) { it.appendChild(el('div', 'fb-item ' + im.state, '<span class="fi-ic">' + (im.state === 'ok' ? '✓' : im.state === 'no' ? '✗' : '○') + '</span><span>' + im.label + '</span>')); });
    fb.appendChild(it);
    if (res.canon) {
      var c = el('div', 'canon');
      c.appendChild(el('div', 'dd-hint', 'Correct answer:'));
      c.appendChild(el('pre', 'art', esc(res.canon)));
      fb.appendChild(c);
    }
    fb.appendChild(el('div', 'exp', ex.explanation));
    if (a.label !== 'correct' && ex.study) fb.appendChild(el('div', 'study', '📚 What to study: ' + esc(ex.study)));
    var acts = card.querySelector('.actions');
    card.insertBefore(fb, acts);
    fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function doSkip() {
    var i = S.current, a = S.answers[i];
    if (a.status === 'checked') return;
    a.status = 'skipped';
    if (S.skipped.indexOf(i) < 0) S.skipped.push(i);
    /* no auto-pause: timer keeps running */
    advance();
  }
  function goNext() {
    if (S.timerState === 'PAUSED_AUTO_CHECK') setTimerState('RUNNING'); /* resume on Next */
    if (S.reviewMode) { S.reviewMode = false; renderReview(); showScreen('review'); return; }
    advance();
  }
  function advance() {
    var nxt = -1;
    for (var j = S.current + 1; j < EXERCISES.length; j++) { if (S.answers[j].status === 'unanswered') { nxt = j; break; } }
    if (nxt < 0) { /* none forward: go to review or results */
      for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered') { nxt = k; break; } }
    }
    if (nxt >= 0) renderExercise(nxt);
    else finishExam(false);
  }

  /* ---------------- review-skipped screen ---------------- */
  function renderReview() {
    var root = $('screen-review'); root.innerHTML = '';
    var c = el('div', 'card');
    c.appendChild(el('h2', null, '⚠ Review skipped exercises'));
    var open = S.skipped.filter(function (i) { return S.answers[i].status === 'skipped'; });
    if (open.length === 0) {
      c.appendChild(el('p', null, 'No skipped exercises left — everything was answered.'));
    } else {
      c.appendChild(el('p', 'dd-hint', 'You can return to any skipped exercise and answer it while the timer has not ended. Skipped-and-never-answered exercises are excluded from your score.'));
      open.forEach(function (i) {
        var row = el('div', 'rev-item');
        row.appendChild(el('span', 'ri-id', esc(EXERCISES[i].id)));
        row.appendChild(el('span', 'ri-sum', esc(EXERCISES[i].summary)));
        var b = el('button', 'btn btn-blue', '↩ Return to it');
        b.type = 'button'; b.setAttribute('aria-label', 'Return to ' + EXERCISES[i].id);
        b.addEventListener('click', function () { S.reviewMode = true; S.reviewFrom = 'review'; showScreen('exam'); renderExercise(i); });
        row.appendChild(b);
        c.appendChild(row);
      });
    }
    var acts = el('div', 'actions');
    var back = el('button', 'btn btn-ghost', '← Keep working (unanswered exercises)');
    back.type = 'button';
    back.addEventListener('click', function () {
      var u = -1; for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered' && S.skipped.indexOf(k) < 0) { u = k; break; } }
      if (u < 0) u = -1;
      if (u >= 0) { showScreen('exam'); renderExercise(u); } else { finishExam(false); }
    });
    var fin = el('button', 'btn btn-primary', '⏹ Final submit');
    fin.type = 'button'; fin.setAttribute('aria-label', 'Final submit and show results');
    fin.addEventListener('click', function () { finishExam(false); });
    acts.appendChild(back); acts.appendChild(el('span', 'spacer')); acts.appendChild(fin);
    c.appendChild(acts);
    root.appendChild(c);
  }

  /* ---------------- results ---------------- */
  function finishExam(timeout) {
    var anySkippedOpen = S.skipped.some(function (i) { return S.answers[i].status === 'skipped'; });
    if (!timeout && anySkippedOpen && S.timerState !== 'ENDED' && S.screen !== 'review') { renderReview(); showScreen('review'); return; }
    setTimerState('ENDED');
    var r = creditSum();
    var answered = r.n;
    var percent = answered > 0 ? Math.round((r.sum / answered) * 100) : 0;
    var passed = percent >= (META.passMark || 70);
    /* counts */
    var full = 0, part = 0, zero = 0, skipped = 0, partSum = 0;
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status;
      if (st === 'checked') {
        var cr = S.answers[i].credit;
        if (cr >= 1) full++;
        else if (cr > 0) { part++; partSum += cr; }
        else zero++;
      } else if (st === 'skipped') skipped++;
      else skipped++; /* unanswered at submit = excluded */
    });
    var root = $('screen-results'); root.innerHTML = '';
    var hero = el('div', 'card');
    var verdictTxt = passed ? '✓ PASS' : '✗ FAIL';
    hero.appendChild(el('div', 'res-hero',
      '<div><div class="res-score">' + percent + '%<small> · ' + r.sum.toFixed(1) + ' / ' + answered + ' credits</small></div>' +
      '<div class="dd-hint">scored over answered exercises only — skipped and never-answered are excluded</div></div>' +
      '<div class="verdict ' + (passed ? 'pass' : 'fail') + '">' + verdictTxt + '</div>'));
    root.appendChild(hero);
    var grid = el('div', 'res-grid');
    function cell(n, l, cls, ic) { return '<div class="res-cell"><div class="rc-n ' + (cls || '') + '">' + n + '</div><div class="rc-l"><span>' + ic + '</span><span>' + l + '</span></div></div>'; }
    grid.innerHTML =
      cell(full, 'Fully correct', 'ok-c', '✓') +
      cell(part + (part > 0 ? ' <small style="font-size:.8rem;color:var(--text-secondary)">(avg ' + (partSum / part).toFixed(2) + ')</small>' : ''), 'Partially correct', 'no-c', '✓') +
      cell(zero, 'Fully incorrect', 'no-c', '✗') +
      cell(skipped, 'Skipped — excluded', 'mi-c', '⚠');
    var gcard = el('div', 'card'); gcard.appendChild(grid);
    gcard.appendChild(el('div', 'dd-hint', '⏸ Time paused manually: ' + fmtTime(Math.round(S.manualPauseMs / 1000)) + ' · ⏸ Time reviewing feedback (auto-pause): ' + fmtTime(Math.round(S.autoPauseMs / 1000)) + ' · ⏱ Time used: ' + fmtTime((META.estimatedMinutes * 60) - S.remaining) + (timeout ? ' (timer ran out)' : '')));
    /* per-exercise strip */
    var strip = el('div', 'strip');
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status, cr = S.answers[i].credit;
      var cls = st === 'checked' ? (cr >= 1 ? 'st-ok' : cr > 0 ? 'st-pa' : 'st-no') : 'st-sk';
      var ic = st === 'checked' ? (cr >= 1 ? '✓' : cr > 0 ? '±' : '✗') : '⚠';
      var chip = el('span', 'st-chip ' + cls, ic);
      chip.title = ex.id + (st === 'checked' ? ' — credit ' + cr.toFixed(2) : ' — skipped/excluded');
      chip.setAttribute('aria-label', chip.title);
      strip.appendChild(chip);
    });
    gcard.appendChild(strip);
    root.appendChild(gcard);
    var acts = el('div', 'actions');
    var rt = el('button', 'btn btn-primary', '↺ Retake the exam');
    rt.type = 'button'; rt.setAttribute('aria-label', 'Retake the exam');
    rt.addEventListener('click', retake);
    acts.appendChild(rt);
    root.appendChild(el('div', 'card', '')).appendChild(acts);
    showScreen('results');
    /* report exactly once per attempt */
    if (!S.reported) {
      S.reported = true;
      reportScore(r.sum, answered);
    }
  }
  function retake() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    S.skipped = []; S.current = 0; S.reviewMode = false; S.reported = false; S.attempt++;
    S.manualPauseMs = 0; S.autoPauseMs = 0; S.priorState = null;
    buildShuffles();
    setTimerState('RUNNING'); S.remaining = (META.estimatedMinutes || 15) * 60;
    showScreen('exam'); renderExercise(0);
  }
  function reportScore(creditSumV, answeredCount) {
    var percent = answeredCount > 0 ? Math.round((creditSumV / answeredCount) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: META.topicId,
        batch: META.batch,
        score: Math.round(creditSumV),
        total: answeredCount,
        percent: percent,
        passed: percent >= 70
      }, location.origin);
    } catch (e) { /* opened directly rather than inside the site — nothing to report to */ }
  }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) return;
    var type = event.data.type;
    if (type !== 'CYBERPULSE_INIT' && type !== 'CYBERMASTERY_INIT') return;
    try {
      if (event.data.username) {
        var c = $('tbCandidate');
        c.textContent = '👤 ' + String(event.data.username).slice(0, 24);
        c.classList.remove('hidden');
      }
      /* country, locale, topicId, batch are consumed; theme is always 'dark' — this file is dark-only by contract */
    } catch (e) { }
  });

  /* ---------------- boot ---------------- */
  function boot() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    buildShuffles();
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    renderIntro();
    showScreen('intro');
  }
  window.__CP_BOOT__ = boot;
})();

</script>
