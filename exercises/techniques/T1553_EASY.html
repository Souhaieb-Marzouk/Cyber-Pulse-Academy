function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){var x=a.slice();for(var i=x.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=x[i];x[i]=x[j];x[j]=t;}return x;}
function norm(s){return String(s).replace(/\s+/g,' ').trim().toLowerCase();}
function fmt(sec){sec=Math.max(0,sec);var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
/* scoreExercise — mandatory formula: max(0,(H-W)/N) */
function scoreExercise(H,W,N){if(N<=0)return 0;return Math.max(0,(H-W)/N);}
function hl(line){
  var s=esc(line);
  s=s.replace(/^(\s*\[?[0-9]{4}-[0-9]{2}-[0-9]{2}[T ][0-9:.]+Z?\]?)/,'<span class="d">$1</span>');

var META = {"topicId":"t1553","batch":1,"objectId":"T1553","objectName":"Subvert Trust Controls","objectType":"Technique","title":"T1553 Subvert Trust Controls — EASY","difficulty":"easy","estimatedMinutes":35,"passMark":70,"keywords":[["Technique & tactic",["<b>T1553<\/b>","<b>Defense Evasion (TA0005)<\/b>","trust controls","warning prompts"]],["Sub-techniques",["<b>T1553.001<\/b> Gatekeeper Bypass","<b>T1553.002<\/b> Code Signing","<b>T1553.003<\/b> SIP &amp; Trust Provider Hijacking","<b>T1553.004<\/b> Install Root Certificate","<b>T1553.005<\/b> Mark-of-the-Web Bypass","<b>T1553.006<\/b> Code Signing Policy Modification"]],["Platforms",["Windows","macOS"]],["Trust tags &amp; prompts",["quarantine flag","<code>com.apple.quarantine<\/code>","Gatekeeper","Mark-of-the-Web (MotW)","<code>Zone.Identifier<\/code>","SmartScreen","Protected View"]],["Commands you will see",["<code>xattr -d<\/code>","<code>certutil -addstore<\/code>","<code>bcdedit /set testsigning<\/code>"]]]};
var EXAMS = [{"id":"e01","type":"qcm","title":"What T1553 describes","note":"Reading the ATT&CK entry for the first time.","scenario":"<p>Your team lead shows you the ATT&amp;CK page for <b>T1553 — Subvert Trust Controls<\/b> and asks what it covers.<\/p>","question":"What does T1553 describe?","options":[["Attackers weakening the checks that warn users or block untrusted programs",true],["Attackers encrypting files to demand a ransom payment",false],["Attackers guessing weak passwords on internet-facing logins",false],["Attackers flooding a network to take a website offline",false]],"hint":"Think about the warnings your computer shows before you run a downloaded program.","explain":"<p>T1553 is about <b>trust<\/b>. Your computer trusts some programs (they are signed), warns about others (they came from the Internet), and blocks some (unsigned). Attackers break these trust checks so their tools run without warnings. Ransomware, password guessing, and denial of service are different techniques, not T1553.<\/p>","study":"Read the description at the top of the T1553 ATT&amp;CK page."},{"id":"e02","type":"qcm","title":"Which tactic?","note":"Placing the technique in the ATT&CK matrix.","scenario":"<p>In your ATT&amp;CK training, you must place T1553 in the correct tactic column of the matrix.<\/p>","question":"Which tactic does T1553 belong to?","options":[["Defense Evasion (TA0005)",true],["Initial Access (TA0001)",false],["Collection (TA0009)",false],["Command and Control (TA0011)",false]],"hint":"The goal is to stay hidden by turning off warnings — which tactic is about not getting caught?","explain":"<p>T1553 lives in <b>Defense Evasion<\/b>. The attacker already has a foothold and wants to <b>avoid detection<\/b>. Removing a warning or faking trust does not give access and does not steal data — it hides the attacker's activity. That is exactly what Defense Evasion means.<\/p>","study":"Open the ATT&amp;CK matrix and look at the Defense Evasion column."},{"id":"e03","type":"tf","fixed":true,"title":"The hidden tag on downloads","note":"A coffee-chat question from a new colleague.","scenario":"<p>A colleague asks: \"I heard that when you download a file on Windows, the file carries a hidden tag. Office files with that tag open in Protected View, and programs get checked by SmartScreen.\"<\/p>","question":"Is your colleague's statement true or false?","options":[["TRUE",true],["FALSE",false]],"hint":"This hidden tag is called Mark-of-the-Web and it lives in a stream named Zone.Identifier.","explain":"<p><b>TRUE.<\/b> Windows adds a hidden tag called <b>Mark-of-the-Web (MotW)<\/b> to downloaded files. It is stored in a hidden NTFS stream named <code>Zone.Identifier<\/code>. Office files with this tag open in <b>Protected View<\/b>. Programs with this tag are checked by <b>SmartScreen<\/b>. This is the trust system that sub-technique T1553.005 attacks.<\/p>","study":"Sub-technique T1553.005 — Mark-of-the-Web Bypass."},{"id":"e04","type":"match","title":"Match the sub-techniques","note":"Flashcard drill for the six sub-techniques.","scenario":"<p>Match each sub-technique ID to its name. These are the six sub-techniques under T1553.<\/p>","question":"Match every sub-technique ID with the correct name.","left":["T1553.001","T1553.002","T1553.003","T1553.004","T1553.005","T1553.006"],"right":["Gatekeeper Bypass","Code Signing","SIP and Trust Provider Hijacking","Install Root Certificate","Mark-of-the-Web Bypass","Code Signing Policy Modification"],"hint":"Gatekeeper is the macOS one; SIP is the Windows signature-checking component.","explain":"<p>The six sub-techniques: <b>T1553.001 Gatekeeper Bypass<\/b> (macOS app checks), <b>T1553.002 Code Signing<\/b> (fake or stolen certificates), <b>T1553.003 SIP and Trust Provider Hijacking<\/b> (Windows signature-check components), <b>T1553.004 Install Root Certificate<\/b> (add a trusted root CA), <b>T1553.005 Mark-of-the-Web Bypass<\/b> (avoid the download tag), <b>T1553.006 Code Signing Policy Modification<\/b> (turn off signature enforcement).<\/p>","study":"The sub-technique table on the T1553 ATT&amp;CK page."},{"id":"e05","type":"dragdrop","title":"Sort the attacker actions","note":"Sorting four simple attacker actions.","scenario":"<p>Four attacker actions were seen in lab exercises. Each one matches one T1553 sub-technique.<\/p>","question":"Drag each action to the sub-technique it belongs to.","instr":"Drag each action onto the correct sub-technique card. You can also click an action, then click a card.","items":["Run xattr -d com.apple.quarantine on a downloaded app","Sign malware with a stolen company certificate","Run certutil -addstore -f -user ROOT cert.der","Run bcdedit /set testsigning on"],"targets":["T1553.001 Gatekeeper Bypass","T1553.002 Code Signing","T1553.004 Install Root Certificate","T1553.006 Code Signing Policy Modification"],"sol":[0,1,2,3],"hint":"xattr touches the macOS quarantine flag; bcdedit changes a Windows boot setting.","explain":"<p><b>xattr -d com.apple.quarantine<\/b> removes the macOS quarantine flag — that is <b>Gatekeeper Bypass (T1553.001)<\/b>. <b>Signing malware with a stolen certificate<\/b> is <b>Code Signing (T1553.002)<\/b>. <b>certutil -addstore ROOT<\/b> installs a root certificate — <b>T1553.004<\/b>. <b>bcdedit /set testsigning on<\/b> lets unsigned code load — <b>Code Signing Policy Modification (T1553.006)<\/b>.<\/p>","study":"The example commands in each sub-technique page."},{"id":"e06","type":"fill","title":"Complete the MotW sentences","note":"Two small blanks about Mark-of-the-Web.","scenario":"<p>Complete these two sentences about Mark-of-the-Web on Windows.<\/p>","question":"Fill in both blanks.","segments":["Windows stores the download mark in a hidden NTFS stream named Zone.",{"a":"Identifier","alts":["identifier"]},". Office files that carry this mark open in ",{"a":"Protected","alts":["protected"]}," View."],"hint":"The stream name starts with 'Zone.' and Protected View is an Office feature.","explain":"<p>The hidden stream is <code>Zone.Identifier<\/code>, and the mark it holds is called <b>Mark-of-the-Web<\/b>. Office opens marked files in <b>Protected View<\/b> so macros and content cannot run right away. Attackers who remove or avoid this tag (T1553.005) make files open without these safety steps.<\/p>","study":"Sub-technique T1553.005 — Mark-of-the-Web Bypass."},{"id":"e07","type":"terminal","title":"Terminal: remove the quarantine flag","note":"macOS host — SOC training lab.","scenario":"<p>You are on a macOS training laptop. A downloaded app called <b>FinanceUpdate.app<\/b> sits in /Applications. Your instructor asks you to run the exact command that removes the quarantine flag, so you can see what attackers do.<\/p>","question":"Type the command that removes the com.apple.quarantine attribute from /Applications/FinanceUpdate.app.","prompt":"student@mac-lab:~$ ","panel":["<span class='s'># syntax reminder<\/span>","<span class='t'>xattr<\/span> <span class='k'>-d<\/span> &lt;attribute-name&gt; &lt;file&gt;","<span class='s'># -d deletes ONE extended attribute from the file<\/span>","<span class='s'># example on a different file:<\/span>  xattr -d com.apple.quarantine ~/Downloads/tool.zip"],"canonical":"xattr -d com.apple.quarantine /Applications/FinanceUpdate.app","sample":["# attribute removed (no output means success)","FinanceUpdate.app will no longer show the 'downloaded from the Internet' prompt on next launch."],"hint":"The command starts with xattr -d and ends with the full app path.","explain":"<p>The canonical command is <code>xattr -d com.apple.quarantine /Applications/FinanceUpdate.app<\/code>. Parts: <b>xattr<\/b> is the macOS tool for extended attributes, <b>-d<\/b> deletes one attribute, <b>com.apple.quarantine<\/b> is the flag that marks a file as downloaded, and the last part is the target file. <b>Attacker view:<\/b> this makes the app run without the Gatekeeper prompt (T1553.001). <b>Defender view:<\/b> macOS unified logs and EDR can alert when the quarantine attribute of a downloaded file is deleted.<\/p>","study":"T1553.001 procedure examples: OSX_OCEANLOTUS.D and Cuckoo Stealer use exactly this command."},{"id":"e08","type":"multi","title":"Which platforms?","note":"A quick scope check.","scenario":"<p>Before building detections, you check which platforms T1553 applies to. Select every platform that ATT&amp;CK lists for T1553.<\/p>","question":"Select all platforms listed for T1553.","options":[["Windows",true],["macOS",true],["Linux",false],["iOS",false],["Android",false]],"hint":"Think of the two operating systems where Gatekeeper, SmartScreen and certutil exist.","explain":"<p>ATT&amp;CK lists <b>Windows<\/b> and <b>macOS<\/b> for T1553. Gatekeeper (macOS) and certutil/SmartScreen (Windows) only exist there. Code signing itself works on Windows and macOS and is not used on Linux, because Linux has no single central signing system.<\/p>","study":"The Platforms row on the T1553 ATT&amp;CK page."},{"id":"e09","type":"qcm","title":"Root certificate effect","note":"What installing a root CA really changes.","scenario":"<p>An attacker installs their own root certificate on a victim laptop (sub-technique T1553.004).<\/p>","question":"What is the main effect of installing a root certificate?","options":[["The system now trusts every certificate signed by that root",true],["The system deletes all saved browser passwords",false],["The system disables the firewall completely",false],["The system stops installing security updates",false]],"hint":"A root certificate is the top of a chain of trust — everything under it becomes trusted.","explain":"<p>A root certificate is the top of a <b>chain of trust<\/b>. Once the attacker's root is installed, any certificate <b>signed by that root<\/b> is trusted automatically. That is why the attacker can run fake HTTPS websites without warnings — the browser trusts the attacker's certificate. This is used for tricks where the attacker sits between the user and a real website to steal logins.<\/p>","study":"Sub-technique T1553.004 — Install Root Certificate."},{"id":"e10","type":"order","title":"Order: Gatekeeper first run","note":"How the macOS first-run check works.","scenario":"<p>Put the four steps of the macOS Gatekeeper first-run check in the correct order.<\/p>","question":"Order the steps from first (top) to last (bottom).","items":["A file is downloaded and the quarantine flag is set on it","The app is opened for the first time and starts in a suspended state","Gatekeeper checks the quarantine flag and the system security policy","The user sees the allow or deny prompt"],"hint":"The flag must exist before the first launch can be checked.","explain":"<p>First the download sets the <b>quarantine flag<\/b> (the <code>com.apple.quarantine<\/code> attribute). On <b>first launch<\/b>, Launch Services starts the app <b>suspended<\/b>. <b>Gatekeeper<\/b> then checks the flag and the security policy. Last, the user sees the <b>allow / deny prompt<\/b>. Attackers break step 1 — if they delete the flag with <code>xattr -d<\/code>, the prompt never appears (T1553.001).<\/p>","study":"The description of T1553.001 — Gatekeeper Bypass."},{"id":"e11","type":"qcm","title":"What a signature proves","note":"Basic code signing idea.","scenario":"<p>A colleague asks why attackers bother to sign their malware with real certificates (sub-technique T1553.002).<\/p>","question":"What does a valid code signature prove to the system?","options":[["Who published the program and that it was not changed after signing",true],["That the program cannot do anything harmful",false],["That the program was checked by the antivirus vendor",false],["That the program was downloaded from the Apple or Microsoft store",false]],"hint":"Code signing is about identity and integrity — not about safety.","explain":"<p>A valid signature proves two things: <b>who<\/b> made the file (identity) and that the file was <b>not modified<\/b> after signing (integrity). It does <b>not<\/b> prove the program is safe. That is why a stolen certificate is so useful to an attacker: their malware gets the 'trusted publisher' look for free.<\/p>","study":"Sub-technique T1553.002 — Code Signing."},{"id":"e12","type":"multi","title":"Spot the T1553 events","note":"Read four EDR events.","scenario":"<p>Your EDR recorded four events on the fleet. Select the events that are T1553 trust-subversion behaviour.<\/p>","artefacts":[{"label":"ARTEFACT 1 — EDR process events (today)","filter":true,"lines":["2026-10-22T09:14:03Z  proc  xattr -d com.apple.quarantine  /Users/kim/Downloads/InvoiceTool.app","2026-10-22T09:20:41Z  proc  control panel --set desktop wallpaper sunset.jpg","2026-10-22T10:02:17Z  proc  certutil -addstore -f -user ROOT %TEMP%\\cert812.der","2026-10-22T10:30:55Z  proc  fwutil --add-rule allow tcp 443 outbound"]}],"question":"Select the TWO events that match T1553 behaviour.","options":[["xattr -d com.apple.quarantine on a downloaded app",true],["certutil -addstore -f -user ROOT on a certificate file",true],["Changing the desktop wallpaper",false],["Adding an outbound firewall rule for port 443",false]],"hint":"One event touches a macOS trust flag, one touches the Windows trusted root store.","explain":"<p>The <b>xattr<\/b> event removes the macOS quarantine flag (T1553.001). The <b>certutil -addstore ROOT<\/b> event installs a root certificate (T1553.004). Wallpaper changes and normal firewall rules do not touch any trust system, so they are not T1553.<\/p>","study":"Compare each event against the six sub-technique names."},{"id":"e13","type":"tf","fixed":true,"title":"True or false: Gatekeeper","note":"One-line check.","scenario":"<p>Statement: \"Gatekeeper is a macOS security feature that checks apps before they run for the first time.\"<\/p>","question":"Is this statement true or false?","options":[["TRUE",true],["FALSE",false]],"hint":"Gatekeeper is the Apple-side cousin of the Windows SmartScreen idea.","explain":"<p><b>TRUE.<\/b> Gatekeeper is Apple's security layer. When an app runs <b>for the first time<\/b>, Gatekeeper checks its signature, notarization and quarantine flag, and asks the user. Bypassing it is sub-technique <b>T1553.001<\/b>.<\/p>","study":"Sub-technique T1553.001 — Gatekeeper Bypass."},{"id":"e14","type":"match","title":"Match component to platform","note":"Know where each trust component lives.","scenario":"<p>Each trust component belongs to one operating system. Match them.<\/p>","question":"Match each trust component with its platform.","left":["Gatekeeper","SmartScreen","File Quarantine flag","Driver Signature Enforcement"],"right":["macOS","Windows","macOS","Windows"],"hint":"Two components are Apple, two are Microsoft.","explain":"<p><b>Gatekeeper<\/b> and the <b>quarantine flag<\/b> (com.apple.quarantine) are <b>macOS<\/b>. <b>SmartScreen<\/b> and <b>Driver Signature Enforcement (DSE)<\/b> are <b>Windows<\/b>. DSE is the Windows policy that only loads signed drivers — turning it off is sub-technique T1553.006.<\/p>","study":"Read the platform notes of T1553.001 and T1553.006."},{"id":"e15","type":"qcm","title":"Why remove the flag?","note":"Attacker goal in one sentence.","scenario":"<p>An attacker downloaded a fake update app to a macOS laptop and runs <code>xattr -d com.apple.quarantine<\/code> on it before the user opens it.<\/p>","question":"What does the attacker achieve by removing the quarantine flag?","options":[["The app runs without the 'downloaded from the Internet' warning and check",true],["The app becomes invisible in the Applications folder",false],["The app gains the same rights as the system administrator",false],["The app is automatically added to the login password store",false]],"hint":"The flag is what triggers the Gatekeeper prompt on first run.","explain":"<p>The quarantine flag is the trigger for the <b>Gatekeeper prompt<\/b>. No flag means no prompt and no check on first run — the app just opens. It does <b>not<\/b> give admin rights and does not hide the app. <b>Attacker view:<\/b> fewer warnings, higher chance the user clicks 'Open'. <b>Defender view:<\/b> watch for processes deleting this attribute.<\/p>","study":"T1553.001 — Gatekeeper Bypass, attacker and defender view."},{"id":"e16","type":"triage","title":"Mini SOC queue","note":"Three alerts, one decision each.","scenario":"<p>You are on SOC shift. Three alerts arrived. Choose the correct action for each.<\/p>","question":"Pick the correct action for every alert.","alerts":[{"name":"ALT-31","src":"EDR — finance workstation FIN-PC-7","log":["proc: certutil -addstore -f -user ROOT %TEMP%\\cert771.der","user: j.meyer   ticket: none"],"options":[["Escalate — a root certificate was installed from a temp folder with no ticket",true],["Close as normal — certutil runs every day",false],["Restart the workstation and ignore",false]]},{"name":"ALT-32","src":"Antivirus — daily scan","log":["scan: full system scan finished","findings: none","host: FIN-PC-7"],"options":[["Close as normal — a completed scan with no findings is routine",true],["Escalate as T1553 subversion",false],["Isolate the host immediately",false]]},{"name":"ALT-33","src":"Mail gateway + EDR — host ACC-PC-2","log":["user opened invoice_2026.iso from mail attachment","payload ran with no SmartScreen warning","ticket: none"],"options":[["Escalate — an ISO with an unprotected payload suggests Mark-of-the-Web bypass (T1553.005)",true],["Close as normal — ISO files are always safe",false],["Ask the user to delete the email and close",false]]}],"hint":"One alert is routine, two touch a trust system.","explain":"<p><b>ALT-31<\/b>: installing a root certificate from <code>%TEMP%<\/code> with no change ticket is classic <b>T1553.004<\/b> behaviour — escalate. <b>ALT-32<\/b>: a clean daily scan is routine — close. <b>ALT-33<\/b>: an ISO payload that runs without the SmartScreen warning is the <b>T1553.005<\/b> container trick — escalate. <b>Attacker view:<\/b> each trick removes one warning. <b>Defender view:<\/b> alerts that touch trust systems deserve a ticket check before closing.<\/p>","study":"T1553.004 and T1553.005 — and always check the change ticket first."}];
var S = {
  phase:'intro', order:[], cur:0, reviewMode:false,
  st:{},            /* id -> {status:pending|checked|skipped, credit, hint, answer} */
  tm:{state:'IDLE', left:0, last:null, pausedManual:0, pausedAuto:0, iv:null},

};

/* ===================== timer state machine ===================== */
/* states: IDLE -> RUNNING <-> PAUSED_MANUAL / PAUSED_AUTO_CHECK -> ENDED */
function tmSet(state){
  S.tm.state=state; renderHeader();
}
function tmRunning(){return S.tm.state==='RUNNING';}
function tmTick(){
  if(S.tm.state!=='RUNNING')return;
  S.tm.left-=1;
  if(S.tm.left<=0){S.tm.left=0; endByTimeout(); return;}
  renderHeader();
}
function tmStart(){
  S.tm.left=META.estimatedMinutes*60;
  if(S.tm.iv)clearInterval(S.tm.iv);
  S.tm.iv=setInterval(tmTick,1000);
  tmSet('RUNNING');
}
function tmStopAll(){if(S.tm.iv)clearInterval(S.tm.iv);S.tm.iv=null;}
function endByTimeout(){
  tmStopAll(); tmSet('ENDED');
  /* current unanswered exercise becomes skipped */
  var ex=curEx();
  if(ex && S.st[ex.id] && S.st[ex.id].status==='pending'){S.st[ex.id].status='skipped';}
  showResults(true);
}

/* ===================== header ===================== */
function sevClass(){return {easy:'sev-easy',medium:'sev-medium',hard:'sev-hard','extremely-hard':'sev-extreme'}[META.difficulty];}
function sevWord(){return {easy:'EASY',medium:'MEDIUM',hard:'HARD','extremely-hard':'EXTREMELY HARD'}[META.difficulty];}
function sevVar(){return {easy:'var(--sev-easy)',medium:'var(--sev-medium)',hard:'var(--sev-hard)','extremely-hard':'var(--sev-extreme)'}[META.difficulty];}
function buildHeader(){
  var h=el('header','hdr');h.id='hdr';
  h.innerHTML=
   '<div class="hdr-row">'+
     '<span class="hdr-id">'+esc(META.objectId)+'</span>'+
     '<span class="hdr-name">'+esc(META.objectName)+'</span>'+
     '<span class="badge '+sevClass()+'" role="img" aria-label="Severity '+sevWord()+'"><span class="dot"></span>'+sevWord()+'</span>'+
     '<span class="hdr-spacer"></span>'+
     '<span class="hdr-pill" id="h-counter"></span>'+
     '<span class="hdr-pill"><span class="timer" id="h-timer">00:00</span><span class="state-word st-run" id="h-tstate">&#9654; RUNNING</span></span>'+
     '<span class="hdr-pill score-pill" id="h-score" aria-label="live score"><b>0.0 / 0</b>&nbsp;<span class="m">0%</span></span>'+
     '<button class="hdr-btn warn" id="b-hint">&#9432; Hint</button>'+
     '<button class="hdr-btn" id="b-skip">&#9888; Skip</button>'+
     '<button class="hdr-btn pause" id="b-pause">&#10074;&#10074; Pause</button>'+
   '</div>'+
   '<div class="progress" role="progressbar" aria-label="exam progress"><i id="h-bar"></i></div>';
  document.body.prepend(h);
  $('#b-hint').addEventListener('click',useHint);
  $('#b-skip').addEventListener('click',skipCurrent);
  $('#b-pause').addEventListener('click',toggleManualPause);
}
function renderHeader(){
  var ex=curEx();
  var total=S.order.length||EXAMS.length;
  var idx=(S.phase==='exam')?(S.cur+1):total;
  $('#h-counter').innerHTML=S.phase==='intro'?'&mdash;':('Exercise '+idx+' of '+total);
  $('#h-timer').textContent=fmt(S.tm.left);
  var st=$('#h-tstate'),pc=$('#b-pause');
  if(S.tm.state==='RUNNING'){st.className='state-word st-run';st.innerHTML='&#9654; RUNNING';pc.innerHTML='&#10074;&#10074; Pause';pc.disabled=false;}
  else if(S.tm.state==='PAUSED_MANUAL'){st.className='state-word st-pause';st.innerHTML='&#10074;&#10074; PAUSED &mdash; manual (press Resume)';pc.innerHTML='&#9654; Resume';pc.disabled=false;}
  else if(S.tm.state==='PAUSED_AUTO_CHECK'){st.className='state-word st-pause';st.innerHTML='&#10074;&#10074; PAUSED &mdash; reviewing feedback (resumes on Next)';pc.innerHTML='&#10074;&#10074; Pause';pc.disabled=false;}
  else if(S.tm.state==='ENDED'){st.className='state-word st-end';st.innerHTML='&#9632; ENDED';pc.disabled=true;}
  else {st.className='state-word st-run';st.innerHTML='&#9654; READY';pc.disabled=true;}
  var pct=S.answered>0?Math.round((S.sum/S.answered)*100):0;
  $('#h-score').innerHTML='<b>'+S.sum.toFixed(1)+' / '+S.answered+'</b>&nbsp;<span class="m">'+pct+'%</span>';
  var prog=S.phase==='intro'?0:(S.phase==='results'?100:Math.round(((S.cur)/Math.max(1,total))*100+(100/Math.max(1,total))*(S.phase==='review'?1:0)));
  if(S.phase==='review')prog=100;
  var bar=$('#h-bar');if(bar){bar.style.width=prog+'%';bar.style.setProperty('--sev-col',sevVar());bar.style.background='linear-gradient(90deg,'+sevVar()+',var(--accent-blue))';}
  var hintB=$('#b-hint'),skipB=$('#b-skip');
  var interactive=(S.phase==='exam')&&ex&&S.st[ex.id].status==='pending'&&S.tm.state==='RUNNING';
  hintB.disabled=!interactive||S.st[ex.id].hint;
  skipB.disabled=!interactive;
}

  c.appendChild(h);
  var learn=el('div','card');
  learn.innerHTML='<h2>&#128218; What you will learn here</h2>'+"\n<p><b>This is part of the MITRE ATT&amp;CK framework.<\/b> ATT&amp;CK is a big catalogue that describes what real attackers do. <b>T1553 — Subvert Trust Controls<\/b> is a <b>Technique<\/b>. A technique describes <i>how<\/i> an attacker does something. T1553 is about <b>breaking or bypassing the trust system of a computer<\/b>.<\/p>\n<p>Imagine you download a program. Your computer checks: \"Was this made by someone I trust? Does it have a warning? Should I ask the user first?\" Attackers do not like these checks. So they <b>remove the warning tags<\/b>, <b>add their own trusted certificates<\/b>, or <b>sign their malware with certificates they stole<\/b>. After that, their bad program looks safe, and the user never sees a warning. This trick belongs to the tactic <b>Defense Evasion (TA0005)<\/b> — the attacker's goal of staying hidden.<\/p>\n<p>T1553 has <b>six sub-techniques<\/b>, one for each trust system: Gatekeeper on macOS (T1553.001), code signing (T1553.002), SIP and trust providers on Windows (T1553.003), installing root certificates (T1553.004), Mark-of-the-Web bypass (T1553.005), and changing code signing policy (T1553.006). Both <b>Windows<\/b> and <b>macOS<\/b> are affected.<\/p>\n<p><b>You will use this knowledge in real work:<\/b><\/p>\n<ul>\n<li>A <b>SOC analyst<\/b> sees alerts like \"a root certificate was installed\" or \"a file lost its quarantine tag\" and must decide if this is an attack. T1553 gives the alert a name.<\/li>\n<li>A <b>threat hunter<\/b> searches laptops and servers for the commands attackers use, like <code>xattr -d com.apple.quarantine<\/code> on macOS.<\/li>\n<li>An <b>incident responder<\/b> uses T1553 to write reports: \"the attacker bypassed Gatekeeper (T1553.001) to run their tool.\"<\/li>\n<li>A <b>threat intel analyst<\/b> reads reports about groups like APT29 or QakBot and maps what they did to T1553 sub-techniques.<\/li>\n<li>A <b>detection engineer<\/b> builds rules that watch trust stores, certificates, and quarantine flags. The ATT&amp;CK page lists detection ideas for each sub-technique.<\/li>\n<li>A <b>GRC analyst or control owner<\/b> picks mitigations — like Execution Prevention (M1038) or Restrict Registry Permissions (M1024) — and explains why they help.<\/li>\n<li>A <b>red teamer<\/b> uses the same knowledge to test if the blue team can see a trust bypass during an exercise.<\/li>\n<\/ul>\n<p>In this EASY exam you learn the <b>foundations<\/b>: what each sub-technique is called, what it does, and which simple commands belong to it. Everything is broken into small steps, and each exercise teaches one idea.<\/p>\n";
  c.appendChild(learn);
  var kw=el('div','card');
  var th='';
  for(var i=0;i<META.keywords.length;i++){
    var t=META.keywords[i];
    th+='<div class="theme"><div class="th">'+esc(t[0])+'</div>';
    for(var j=0;j<t[1].length;j++){th+='<span class="kw">'+t[1][j]+'</span>';}
    th+='</div>';
  }
  kw.innerHTML='<h2>&#128273; Keywords covered in this exam</h2>'+th;
  c.appendChild(kw);
  var how=el('div','card');
  how.innerHTML='<h2>&#9881;&#65039; How this exam works</h2>'+"\n<ul class=\"rules\">\n<li><b>Passing score.<\/b> You need <b>70%<\/b> or more to pass. PASS means you master the basics of T1553. FAIL means you should read the explanations again and retake the exam.<\/li>\n<li><b>Exercise types in this file.<\/b> Multiple choice, true/false, multi-select, matching pairs, drag &amp; drop, fill in the blank, ordering steps, one fake terminal task, and a small SOC triage queue.<\/li>\n<li><b>Partial credit.<\/b> Exercises with more than one right item give <b>partial credit<\/b>: right items add points, wrong items take points away. The formula is <code>credit = (H &minus; W) / N<\/code>, never below zero. So selecting everything \"to be safe\" gives you zero, not full marks.<\/li>\n<li><b>Timer.<\/b> A 35-minute countdown runs in the header. There are <b>two kinds of pause<\/b>:\n  <br>&nbsp;&nbsp;<span class=\"ic\">&#10074;&#10074;<\/span> <b>Manual Pause<\/b> — you press Pause. The exercise is hidden and the timer stops. Press Resume to continue. This is a real break.\n  <br>&nbsp;&nbsp;<span class=\"ic\">&#10074;&#10074;<\/span> <b>Auto-pause on Check<\/b> — the moment you press <b>Check<\/b>, the timer stops by itself. The feedback stays visible as long as you want. The timer starts again only when you press <b>Next<\/b>. Use this time to read and learn.<\/li>\n<li><b>Hints.<\/b> You can open <b>one hint<\/b> per exercise with the Hint button. A hint costs <b>&minus;10% of that exercise's credit<\/b>.<\/li>\n<li><b>Skipping.<\/b> Press <b>Skip<\/b> to park an exercise without answering. Skipping is free, and the timer keeps running. Before you finish, a <b>Review skipped<\/b> screen lets you answer every skipped exercise. If you submit while some are still skipped, they are <b>excluded from your score<\/b> — they count neither for you nor against you.<\/li>\n<li><b>Start.<\/b> When you press Start, the exercise order and all answer choices are shuffled. Good luck!<\/li>\n<\/ul>\n"+
    '<div class="acts"><button class="btn primary big" id="b-start">&#9654; Start the exam</button></div>';
  c.appendChild(how);
  w.appendChild(c);
  $('#b-start').addEventListener('click',startExam);
  renderHeader();
}

/* ===================== flow ===================== */
function curEx(){return S.phase==='exam'?EXAMS[S.order[S.cur]]:null;}
function stOf(id){if(!S.st[id])S.st[id]={status:'pending',credit:0,hint:false};return S.st[id];}
function startExam(){
  S.order=shuffle(EXAMS.map(function(e,i){return i;}));
  S.st={};S.sum=0;S.answered=0;S.reported=false;S.reviewMode=false;S.cur=0;S.tmPrev='RUNNING';
  EXAMS.forEach(function(e){S.st[e.id]={status:'pending',credit:0,hint:false};});
  S.phase='exam';
  tmStart();
  showExercise(0,false);
}
function labelFor(i,total){
  if(total===1)return '';
  return 'Exercise '+(i+1)+' of '+total;
}
function showExercise(i,fromReview){
  if(i>=S.order.length){showReview();return;}
  S.cur=i;S.reviewMode=!!fromReview;S.phase='exam';
  var ex=EXAMS[S.order[i]];
  renderCard(ex);
  renderHeader();
}
function renderCard(ex){
  var app=$('#app');app.innerHTML='';
  var w=el('div','wrap');w.id='ex-wrap';
  var st=stOf(ex.id);
  var pos=el('div','kicker mono');pos.style.letterSpacing='1px';
  pos.innerHTML=labelFor(S.cur,S.order.length)+' &mdash; '+esc(ex.title);
  w.appendChild(pos);
  /* SCENARIO */
  var sc=el('div','blk blk-s');
  var scH=el('div','blk-h');
  scH.innerHTML='<span class="ic">&#128209;</span> SCENARIO';
  var colBtn=el('button','hdr-btn');colBtn.style.marginLeft='auto';colBtn.style.minHeight='28px';colBtn.style.padding='2px 10px';
  colBtn.textContent='Collapse';colBtn.setAttribute('aria-expanded','true');
  scH.appendChild(colBtn);
  sc.appendChild(scH);
  var scBody=el('div');scBody.innerHTML=(ex.note?'<p class="m">'+esc(ex.note)+'</p>':'')+ex.scenario;
  sc.appendChild(scBody);
  var summary=el('p','m');summary.style.display='none';summary.innerHTML='<b>Collapsed:</b> '+esc(ex.collapsible||ex.title);
  sc.appendChild(summary);
  colBtn.addEventListener('click',function(){
    var open=scBody.style.display!=='none';
    scBody.style.display=open?'none':'';summary.style.display=open?'':'none';
    colBtn.textContent=open?'Expand':'Collapse';
    colBtn.setAttribute('aria-expanded',String(!open));
  });
  (ex.artefacts||[]).forEach(function(a){sc.appendChild(buildArtefact(a));});
  w.appendChild(sc);
  /* QUESTION */
  var q=el('div','blk blk-q');
  q.innerHTML='<div class="blk-h"><span class="ic">&#10067;</span> QUESTION</div><div class="qtext">'+ex.question+'</div>';
  w.appendChild(q);
  /* YOUR ANSWER */
  var an=el('div','blk blk-a');
  an.innerHTML='<div class="blk-h"><span class="ic">&#9997;&#65039;</span> YOUR ANSWER</div>';
  var box=el('div');box.id='ansbox';
  an.appendChild(box);
  if(st.hint){box.appendChild(buildHint(ex));}
  w.appendChild(an);
  var fb=el('div');fb.id='fb';
  w.appendChild(fb);
  /* actions */
  var acts=el('div','acts');
  var bCheck=el('button','btn primary');bCheck.id='b-check';bCheck.innerHTML='&#10003; Check answer';
  var bNext=el('button','btn');bNext.id='b-next';bNext.disabled=true;
  acts.appendChild(bCheck);acts.appendChild(bNext);
  w.appendChild(acts);
  app.appendChild(w);
  buildWidget(ex,box);
  bCheck.addEventListener('click',function(){checkCurrent();});
  bNext.addEventListener('click',nextAction);
  updateActions(ex);
}
function buildArtefact(a){
  var d=el('div','art');
  var h=el('div','art-h');
  h.innerHTML='<span>'+esc(a.label)+'</span><span class="grow"></span>';
  d.appendChild(h);
  var pre=el('pre','code');
  var lines=a.lines||String(a.code||'').split('\n');
  if(a.filter){
    var fi=document.createElement('input');fi.className='art-filter';fi.placeholder='filter lines&hellip;';fi.setAttribute('aria-label','filter log lines');
    h.appendChild(fi);
    var body=el('div');body.style.padding='6px 0';
    var render=function(f){
      body.innerHTML='';
      lines.forEach(function(l){
        if(!f||l.toLowerCase().indexOf(f.toLowerCase())>=0){
          var ln=el('div');ln.style.padding='1px 12px';ln.innerHTML=hl(l)||'&nbsp;';body.appendChild(ln);
        }
      });
    };
    fi.addEventListener('input',function(){render(fi.value.trim());});
    render('');
    d.appendChild(body);
  }else{
    pre.innerHTML=lines.map(function(l){return hl(l)||'&nbsp;';}).join('\n');
    d.appendChild(pre);
  }
  return d;
}
function buildHint(ex){
  return el('div','hintbox','<div class="hh">&#9432; Hint used &mdash; credit &minus;0.10 for this exercise</div>'+esc(ex.hint||''));
}
function updateActions(ex){
  var st=stOf(ex.id);
  var bCheck=$('#b-check'),bNext=$('#b-next');
  if(!bCheck)return;
  if(st.status==='checked'){
    bCheck.disabled=true;
    var skippedLeft=S.order.some(function(idx,k){return S.st[EXAMS[idx].id].status!=='checked';});
    var isLast=S.cur>=S.order.length-1;
    if(S.reviewMode){bNext.disabled=false;bNext.innerHTML='&#9664; Back to review';}
    else if(isLast){bNext.disabled=false;bNext.innerHTML=skippedLeft?'&#9888; Review skipped ('+(S.order.length-S.answered)+')':'&#9632; Final Submit';}
    else{bNext.disabled=false;bNext.innerHTML='Next &#9654;';}
  }else{
    bCheck.disabled=false;bNext.disabled=true;bNext.innerHTML='Next &#9654;';
  }
}
function checkCurrent(){
  var ex=curEx();if(!ex)return;
  var st=stOf(ex.id);
  if((st.status!=='pending'&&st.status!=='skipped')||S.tm.state==='ENDED')return;
  /* FIRST ACTION: auto-pause (mandatory) */
  if(S.tm.state==='RUNNING'){S.tmPrev='RUNNING';tmSet('PAUSED_AUTO_CHECK');}
  var res=gradeEx(ex,$('#ansbox'));
  var raw=scoreExercise(res.H,res.W,res.N);
  var credit=raw;
  if(st.hint)credit=Math.max(0,+(credit-0.10).toFixed(2));
  st.status='checked';st.credit=credit;
  S.sum+=credit;S.answered=S.order.map(function(i){return EXAMS[i].id;}).filter(function(id){return S.st[id].status==='checked';}).length;
  renderFeedback(ex,res,credit,raw);
  updateActions(ex);renderHeader();
}
function renderFeedback(ex,res,credit,raw){
  var fb=$('#fb');fb.innerHTML='';
  var cls=credit===1?'fb-correct':(credit>0?'fb-partial':'fb-incorrect');
  var label=credit===1?'&#10003; CORRECT':(credit>0?'&#10003; PARTIALLY CORRECT':'&#10007; INCORRECT');
  var col=credit===1?'var(--state-correct)':(credit>0?'var(--state-partial)':'var(--state-incorrect)');
  var d=el('div','fb '+cls);
  var creditTxt='';
  if(res.N>1||res.type==='terminal'){
    creditTxt='<span class="fb-credit">credit '+credit.toFixed(2)+' &mdash; '+res.H+'/'+res.N+' items'+(res.W?' &middot; '+res.W+' wrong':'')+'</span>';
  }else{creditTxt='<span class="fb-credit">credit '+credit.toFixed(2)+'</span>';}
  d.innerHTML='<div class="fb-label" style="color:'+col+'"><span>'+label+'</span>'+creditTxt+
    (stOf(ex.id).hint?'<span class="fb-credit">&#9432; hint used &minus;0.10</span>':'')+
    (res.danger?'<span class="fb-credit" style="color:var(--state-incorrect);border-color:var(--state-incorrect)">&#10071; DANGEROUS &mdash; NEAR MISS</span>':'')+
    '</div>';
  if(res.rows&&res.rows.length){
    res.rows.forEach(function(r){
      var ic=r.s==='ok'?['&#10003; Correct','ri-ok']:(r.s==='bad'?['&#10007; Wrong','ri-bad']:['&#9675; Missed','ri-miss']);
      var row=el('div','rowitem');
      row.innerHTML='<span class="'+ic[1]+'">'+ic[0]+'</span><span>'+r.t+'</span>';
      d.appendChild(row);
    });
  }
  if(res.correct){d.appendChild(el('p','explain','<b>Correct answer:</b> '+res.correct));}
  d.appendChild(el('div','explain',ex.explain||''));
  if(ex.study){d.appendChild(el('div','study','<b>What to study:</b> '+esc(ex.study)));}
  fb.appendChild(d);
  try{d.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}
}
function nextAction(){
  var ex=curEx();
  if(S.tm.state==='PAUSED_AUTO_CHECK'){tmSet(S.reviewMode?'RUNNING':'RUNNING');}
  if(S.reviewMode){showReview();return;}
  if(S.cur>=S.order.length-1){
    var pending=S.order.filter(function(i){return S.st[EXAMS[i].id].status!=='checked';}).length;
    if(pending>0){showReview();}
    else{showResults(false);}
  }else{showExercise(S.cur+1,false);}
}
function skipCurrent(){
  var ex=curEx();if(!ex)return;
  var st=stOf(ex.id);
  if(st.status!=='pending'||S.tm.state!=='RUNNING')return;
  st.status='skipped';
  fbSkipNote(ex);
  if(S.reviewMode||S.cur>=S.order.length-1){showReview();}
  else{showExercise(S.cur+1,false);}
  renderHeader();
}
function fbSkipNote(ex){
  var fb=$('#fb');fb.innerHTML='';
  fb.appendChild(el('div','fb fb-skipped','<div class="fb-label" style="color:var(--state-skipped)"><span>&#9888; SKIPPED &mdash; MOVED TO REVIEW POOL</span></div><p class="explain m">This exercise was skipped without revealing the answer. You can answer it later from the review screen. If it is never answered, it is excluded from your score.</p>'));
  var bCheck=$('#b-check');if(bCheck)bCheck.disabled=true;
}
function useHint(){
  var ex=curEx();if(!ex)return;
  var st=stOf(ex.id);
  if((st.status!=='pending'&&st.status!=='skipped')||st.hint||S.tm.state!=='RUNNING')return;
  st.hint=true;
  var box=$('#ansbox');
  if(box&&!box.querySelector('.hintbox'))box.insertBefore(buildHint(ex),box.firstChild);
  renderHeader();
}
/* ===================== manual pause ===================== */
function toggleManualPause(){
  var exWrap=$('#ex-wrap');
  if(S.tm.state==='RUNNING'||S.tm.state==='PAUSED_AUTO_CHECK'){
    S.tmPrev=S.tm.state;
    S.tm._runningAt=Date.now();
    tmSet('PAUSED_MANUAL');
    if(exWrap)exWrap.style.display='none';
    showPauseOverlay();
  }else if(S.tm.state==='PAUSED_MANUAL'){
    if(S.tm._runningAt){var dt=Math.round((Date.now()-S.tm._runningAt)/1000);S.tm.pausedManual+=dt;S.tm._runningAt=null;}
    tmSet(S.tmPrev||'RUNNING');
    hidePauseOverlay();
    if(exWrap)exWrap.style.display='';
  }
  renderHeader();
}
function showPauseOverlay(){
  var app=$('#app');
  if(!app.querySelector('.pause-ov')){
    var ov=el('div','pause-ov','&#10074;&#10074; PAUSED &mdash; manual break<br><span class="m" style="font-size:14px;color:var(--text-secondary)">The exercise is hidden and the timer is stopped. Press Resume in the header to continue.</span>');
    ov.id='pause-ov';app.appendChild(ov);
  }else{$('#pause-ov').style.display='';}
}
function hidePauseOverlay(){var ov=$('#pause-ov');if(ov)ov.style.display='none';}

/* ===================== review skipped ===================== */
function showReview(){
  S.phase='review';renderHeader();
  if(S.tm.state==='PAUSED_AUTO_CHECK')tmSet('RUNNING');
  var app=$('#app');app.innerHTML='';
  var w=el('div','wrap');
  w.appendChild(el('div','card','<div class="kicker">Before you finish</div><h1>&#9888; Review skipped exercises</h1>'+
    '<p class="m">These exercises were skipped and never answered. You can return to each one and answer it as many times as you need while the timer is running. If you submit while some are still unanswered, they are <b>excluded from your score</b> &mdash; they count neither for you nor against you.</p>'));
  var pending=[];
  S.order.forEach(function(idx,k){var ex=EXAMS[idx];if(S.st[ex.id].status!=='checked')pending.push({ex:ex,k:k});});
  if(pending.length===0){
    w.appendChild(el('div','card','<p>&#10003; Nothing skipped &mdash; every exercise was answered.</p>'));
  }else{
    var c=el('div','card');
    pending.forEach(function(p){
      var row=el('div','rev-row');
      var wasSkipped=S.st[p.ex.id].status==='skipped';
      row.innerHTML='<span class="warn">&#9888; '+(wasSkipped?'Skipped':'Not answered yet')+'</span><span class="t">'+esc(p.ex.title)+'</span>';
      var b=el('button','btn');b.innerHTML='Answer &#9654;';
      b.addEventListener('click',function(){showExercise(p.k,true);});
      row.appendChild(b);c.appendChild(row);
    });
    w.appendChild(c);
  }
  var c2=el('div','card');
  c2.innerHTML='<div class="acts"><button class="btn primary big" id="b-final">&#9632; Final Submit</button></div>'+
    '<p class="m" style="margin-top:10px">Answered so far: <b>'+S.answered+' of '+S.order.length+'</b> &middot; live score <b>'+S.sum.toFixed(1)+' / '+S.answered+'</b></p>';
  w.appendChild(c2);
  app.appendChild(w);
  $('#b-final').addEventListener('click',function(){showResults(false);});
  renderHeader();
}

/* ===================== results ===================== */
function showResults(byTimeout){
  if(S.tm.state!=='ENDED'){tmStopAll();tmSet('ENDED');}
  if(S.tm._runningAt){var dt=Math.round((Date.now()-S.tm._runningAt)/1000);S.tm.pausedManual+=dt;S.tm._runningAt=null;}
  S.phase='results';
  var full=0,part=0,zero=0,skipped=0,partSum=0;
  S.order.forEach(function(idx){var st=S.st[EXAMS[idx].id];
    if(st.status!=='checked'){skipped++;return;}
    if(st.credit>=1)full++;else if(st.credit>0){part++;partSum+=st.credit;}else zero++;});
  var percent=S.answered>0?Math.round((S.sum/S.answered)*100):0;
  var passed=percent>=META.passMark;
  renderHeader();
  var app=$('#app');app.innerHTML='';
  var w=el('div','wrap');
  var v=el('div','verdict '+(passed?'pass':'fail'));
  v.innerHTML='<div class="v-word">'+(passed?'&#10003; PASS':'&#10007; FAIL')+'</div>'+
    '<div class="v-sub">'+(passed?'Certification-style result: you reached the pass mark.':'You did not reach the pass mark this time. Review the explanations and retake the exam.')+'</div>'+
    '<div class="v-sub"><b style="color:var(--text-primary);font-family:var(--font-mono)">'+S.sum.toFixed(1)+' / '+S.answered+'</b> answered &middot; <b style="color:var(--text-primary);font-family:var(--font-mono)">'+percent+'%</b> (pass mark '+META.passMark+'%)'+
    (byTimeout?' &middot; <span style="color:var(--state-paused)">&#10074;&#10074; time ran out &mdash; timer ended</span>':'')+'</div>';
  w.appendChild(v);
  var g=el('div','res-grid');
  var avg=part>0?(partSum/part).toFixed(2):'&mdash;';
  g.innerHTML=
    '<div class="res-cell"><div class="num c-correct">'+full+'</div><div class="lab">&#10003; Fully correct</div></div>'+
    '<div class="res-cell"><div class="num c-partial">'+part+'</div><div class="lab">&#10003; Partially correct'+(part>0?' &middot; avg '+avg:'')+'</div></div>'+
    '<div class="res-cell"><div class="num c-incorrect">'+zero+'</div><div class="lab">&#10007; Fully incorrect</div></div>'+
    '<div class="res-cell"><div class="num c-skipped">'+skipped+'</div><div class="lab">&#9888; Skipped &mdash; excluded</div></div>';
  w.appendChild(g);
  var time=el('div','card');
  time.innerHTML='<h2>&#9201; Time &amp; pauses</h2><div class="res-grid">'+
    '<div class="res-cell"><div class="num">'+fmt(META.estimatedMinutes*60-S.tm.left)+'</div><div class="lab">time used of '+META.estimatedMinutes+':00 budget</div></div>'+
    '<div class="res-cell"><div class="num">'+fmt(S.tm.pausedManual)+'</div><div class="lab">&#10074;&#10074; paused manually (break)</div></div>'+
    '<div class="res-cell"><div class="num">'+fmt(S.tm.pausedAuto)+'</div><div class="lab">&#10074;&#10074; paused reviewing feedback</div></div></div>';
  w.appendChild(time);
  var rec=el('div','card');rec.innerHTML='<h2>&#128203; Exercise recap</h2>';
  var rc=el('div','recap');
  S.order.forEach(function(idx){
    var ex=EXAMS[idx],st=S.st[ex.id];
    var ic,cl,cr;
    if(st.status!=='checked'){ic='&#9888; Skipped &mdash; excluded';cl='c-skipped';cr='&mdash;';}
    else if(st.credit>=1){ic='&#10003; Fully correct';cl='c-correct';cr=st.credit.toFixed(2);}
    else if(st.credit>0){ic='&#10003; Partially correct';cl='c-partial';cr=st.credit.toFixed(2);}
    else{ic='&#10007; Fully incorrect';cl='c-incorrect';cr='0.00';}
    var row=el('div','recap-row');
    row.innerHTML='<span class="id">'+esc(ex.id)+'</span><span class="'+cl+'">'+ic+'</span><span>'+esc(ex.title)+'</span><span class="cr">'+cr+'</span>';
    rc.appendChild(row);
  });
  rec.appendChild(rc);w.appendChild(rec);
  var again=el('div','card');
  again.innerHTML='<div class="acts"><button class="btn primary big" id="b-retake">&#8635; Retake exam</button></div>'+
    '<p class="m" style="margin-top:8px">Retaking reshuffles the exercise order and all answer choices, resets the timer and clears your score.</p>';
  w.appendChild(again);
  app.appendChild(w);
  $('#b-retake').addEventListener('click',retake);
  reportScore(S.sum,S.answered);
}
function retake(){
  startExam();
  window.scrollTo(0,0);
}

/* ===================== site integration ===================== */
function reportScore(creditSum,answeredCount){
  if(S.reported)return;S.reported=true;
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:META.topicId,batch:META.batch,
      score:Math.round(creditSum),total:answeredCount,
      percent:percent,passed:percent>=META.passMark
    },location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  S.user={name:event.data.username||'',country:event.data.country||'',locale:event.data.locale||''};
  /* theme field is always 'dark' — the file is dark-only, nothing to toggle */
  if(S.phase==='intro'){var k=$('#app .meta-grid');if(k&&S.user.name)renderIntro();}
});

/* ===================== widgets & grading ===================== */
function letters(i){return String.fromCharCode(65+i)+'. ';}
function lockBox(box){box.style.pointerEvents='none';}

function buildWidget(ex,box){
  var t=ex.type;
  if(t==='qcm'||t==='tf'||t==='multi')buildChoice(ex,box);
  else if(t==='match')buildMatch(ex,box);
  else if(t==='dragdrop')buildDD(ex,box);
  else if(t==='fill')buildFill(ex,box);
  else if(t==='order')buildOrder(ex,box);
  else if(t==='terminal')buildTerm(ex,box);
  else if(t==='triage')buildTriage(ex,box);
  else if(t==='branch')buildBranch(ex,box);
}

/* ---------- choice: qcm / tf / multi ---------- */
function buildChoice(ex,box){
  var opts=ex.options.map(function(o,i){return {t:o[0],ok:!!o[1],i:i};});
  if(ex.fixed!==true)opts=shuffle(opts);
  box._w={opts:opts,sel:{},multi:ex.type==='multi'};
  if(ex.instr)box.appendChild(el('p','m',esc(ex.instr)));
  opts.forEach(function(o,k){
    var b=el('button','opt');b.type='button';
    b.innerHTML='<span class="lab">'+letters(k)+'</span><span>'+esc(o.t)+'</span><span class="mark">&#10003;</span>';
    b.addEventListener('click',function(){
      if(box._w.multi){box._w.sel[o.i]=!box._w.sel[o.i];b.classList.toggle('sel',!!box._w.sel[o.i]);}
      else{
        box._w.sel={};box.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel');});
        box._w.sel[o.i]=true;b.classList.add('sel');
      }
    });
    b.dataset.oi=o.i;box.appendChild(b);
  });
}
function gradeChoice(ex,box){
  var w=box._w,res={type:ex.type,N:0,H:0,W:0,rows:[],correct:''};
  var okOpts=w.opts.filter(function(o){return o.ok;});
  if(w.multi){
    res.N=okOpts.length;
    w.opts.forEach(function(o){
      var s=!!w.sel[o.i];
      if(o.ok&&s){res.H++;res.rows.push({s:'ok',t:esc(o.t)});}
      else if(o.ok&&!s){res.rows.push({s:'miss',t:esc(o.t)});}
      else if(!o.ok&&s){res.W++;res.rows.push({s:'bad',t:esc(o.t)});}
    });
    res.correct=okOpts.map(function(o){return esc(o.t);}).join(' &middot; ');
    w.opts.forEach(function(o){
      var b=box.querySelector('.opt[data-oi="'+o.i+'"]');
      if(b){if(o.ok)b.classList.add('good');else if(w.sel[o.i])b.classList.add('bad');b.disabled=true;}
    });
  }else{
    res.N=1;
    var chosen=w.opts.filter(function(o){return w.sel[o.i];})[0];
    var okO=okOpts[0];
    if(chosen&&chosen.ok){res.H=1;res.rows.push({s:'ok',t:esc(chosen.t)});}
    else if(chosen&&!chosen.ok){res.W=1;res.rows.push({s:'bad',t:esc(chosen.t)});}
    else{res.rows.push({s:'miss',t:'no answer selected'});}
    res.correct=esc(okO.t);
    w.opts.forEach(function(o){
      var b=box.querySelector('.opt[data-oi="'+o.i+'"]');
      if(b){if(o.ok)b.classList.add('good');else if(w.sel[o.i])b.classList.add('bad');b.disabled=true;}
    });
  }
  return res;
}

/* ---------- match ---------- */
function buildMatch(ex,box){
  var right=ex.right.map(function(t,i){return {t:t,i:i};});
  var rSh=shuffle(right);
  box._w={matchOf:ex.left.map(function(){return null;}),rSh:rSh,pick:null};
  var grid=el('div','match-row');
  var lc=el('div'),rc=el('div');
  lc.appendChild(el('div','mcol-h','Items'));
  rc.appendChild(el('div','mcol-h','Matches'));
  ex.left.forEach(function(t,i){
    var d=el('div','mitem');d.innerHTML='<span class="lab mono">'+letters(i)+'</span>'+esc(t);
    d.dataset.li=i;d.setAttribute('role','button');d.tabIndex=0;
    d.addEventListener('click',function(){selectLeft(i,box);});
    lc.appendChild(d);
  });
  rSh.forEach(function(r,k){
    var d=el('div','mitem');d.innerHTML=esc(r.t)+'<br><span class="pair-tag" data-rt="'+r.i+'">&nbsp;</span>';
    d.dataset.ri=r.i;d.setAttribute('role','button');d.tabIndex=0;
    d.addEventListener('click',function(){pickRight(r.i,box);});
    rc.appendChild(d);
  });
  grid.appendChild(lc);grid.appendChild(rc);
  box.appendChild(grid);
  var rst=el('button','btn');rst.innerHTML='&#8635; Reset pairs';
  rst.addEventListener('click',function(){
    box._w.matchOf=ex.left.map(function(){return null;});box._w.pick=null;
    box.querySelectorAll('.mitem').forEach(function(m){m.classList.remove('pick');});
    box.querySelectorAll('.pair-tag').forEach(function(p){p.innerHTML='&nbsp;';});
  });
  box.appendChild(rst);
}
function selectLeft(i,box){
  box._w.pick=(box._w.pick===i)?null:i;
  box.querySelectorAll('.mitem').forEach(function(m){if(m.dataset.li!==undefined)m.classList.toggle('pick',Number(m.dataset.li)===box._w.pick);});
}
function pickRight(ri,box){
  if(box._w.pick===null)return;
  var prev=box._w.matchOf.indexOf(ri);
  if(prev>=0)box._w.matchOf[prev]=null;
  box._w.matchOf[box._w.pick]=ri;box._w.pick=null;
  box.querySelectorAll('.mitem').forEach(function(m){m.classList.remove('pick');});
  box._w.matchOf.forEach(function(r,li){
    var tag=box.querySelector('.pair-tag[data-rt="'+r+'"]');
    box.querySelectorAll('.pair-tag').forEach(function(p){if(Number(p.dataset.rt)===r)p.innerHTML='&nbsp;';});
    if(tag!==null&&tag){var lt=box.querySelector('.mitem[data-li="'+li+'"] .lab');if(lt)tag.innerHTML='&#8592; '+esc(lt.textContent);}
  });
}
function gradeMatch(ex,box){
  var w=box._w,res={type:'match',N:ex.left.length,H:0,W:0,rows:[],correct:''};
  ex.left.forEach(function(t,i){
    var j=w.matchOf[i];
    var rightText=j===null?'not matched':esc(ex.right[j]);
    if(j===i){res.H++;res.rows.push({s:'ok',t:esc(t)+' &rarr; '+rightText});}
    else if(j===null){res.rows.push({s:'miss',t:esc(t)+' &rarr; correct match: '+esc(ex.right[i])});}
    else{res.W++;res.rows.push({s:'bad',t:esc(t)+' &rarr; '+rightText+' (correct: '+esc(ex.right[i])+')'});}
  });
  res.correct=ex.left.map(function(t,i){return esc(t)+' &rarr; '+esc(ex.right[i]);}).join(' &middot; ');
  lockBox(box);
  return res;
}

/* ---------- drag & drop ---------- */
function buildDD(ex,box){
  var order=shuffle(ex.items.map(function(t,i){return i;}));
  box._w={placed:ex.items.map(function(){return null;}),picked:null,order:order,ex:ex};
  box.appendChild(el('p','m',esc(ex.instr||'Drag each item to the right target, or click an item and then click a target.')));
  var bank=el('div','bank');bank.id='dd-bank';
  box.appendChild(bank);
  var zonesWrap=el('div');
  ex.targets.forEach(function(t,zi){
    var z=el('div','zone');z.dataset.zi=zi;
    z.innerHTML='<div class="z-label">'+esc(t)+'</div><div class="z-body"></div>';
    z.addEventListener('click',function(){dropTo(zi,box);});
    z.addEventListener('dragover',function(ev){ev.preventDefault();z.classList.add('over');});
    z.addEventListener('dragleave',function(){z.classList.remove('over');});
    z.addEventListener('drop',function(ev){ev.preventDefault();z.classList.remove('over');dropTo(zi,box);});
    zonesWrap.appendChild(z);
  });
  box.appendChild(zonesWrap);
  var rst=el('button','btn');rst.innerHTML='&#8635; Reset placements';
  rst.addEventListener('click',function(){
    box._w.placed=ex.items.map(function(){return null;});box._w.picked=null;redrawDD(ex,box);
  });
  box.appendChild(rst);
  redrawDD(ex,box);
}
function redrawDD(ex,box){
  var bank=$('#dd-bank');if(!bank)return;bank.innerHTML='';
  var zbs=box.querySelectorAll('.z-body');zbs.forEach(function(z){z.innerHTML='';});
  box._w.order.forEach(function(ii){
    var chip=el('span','chip');chip.textContent=ex.items[ii];chip.draggable=true;chip.dataset.ii=ii;
    chip.addEventListener('dragstart',function(ev){ev.dataTransfer.setData('text/plain',String(ii));box._w.picked=ii;});
    chip.addEventListener('click',function(){box._w.picked=(box._w.picked===ii)?null:ii;redrawDD(ex,box);});
    if(box._w.placed[ii]===null)bank.appendChild(chip);
    else{
      var zi=box._w.placed[ii];
      chip.className='chip mine';
      box.querySelectorAll('.z-body')[zi].appendChild(chip);
    }
  });
  box.querySelectorAll('.chip').forEach(function(c){
    c.classList.toggle('picked',Number(c.dataset.ii)===box._w.picked);
  });
}
function dropTo(zi,box){
  var p=box._w.picked;
  if(p===null)return;
  var from=box._w.placed.indexOf(zi);
  if(from>=0)box._w.placed[from]=null;
  box._w.placed[p]=zi;box._w.picked=null;
  redrawDD(box._w.ex,box);
}
function gradeDD(ex,box){
  box._w.ex=ex;
  var w=box._w,res={type:'dragdrop',N:ex.items.length,H:0,W:0,rows:[],correct:''};
  ex.items.forEach(function(t,i){
    var p=w.placed[i];
    if(p===null)res.rows.push({s:'miss',t:esc(t)+' &rarr; not placed (correct: '+esc(ex.targets[ex.sol[i]])+')'});
    else if(p===ex.sol[i]){res.H++;res.rows.push({s:'ok',t:esc(t)+' &rarr; '+esc(ex.targets[p])});}
    else{res.W++;res.rows.push({s:'bad',t:esc(t)+' &rarr; '+esc(ex.targets[p])+' (correct: '+esc(ex.targets[ex.sol[i]])+')'});}
  });
  res.correct=ex.items.map(function(t,i){return esc(t)+' &rarr; '+esc(ex.targets[ex.sol[i]]);}).join(' &middot; ');
  lockBox(box);
  return res;
}

/* ---------- fill in the blank ---------- */
function buildFill(ex,box){
  box._w={inputs:[]};
  var wrap=el('div');wrap.style.lineHeight='2.1';wrap.style.fontSize='15.5px';
  ex.segments.forEach(function(seg){
    if(typeof seg==='string'){wrap.appendChild(document.createTextNode(seg));}
    else{
      var inp=document.createElement('input');inp.className='fill-input';inp.spellcheck=false;
      inp.style.width=Math.max(120,(seg.a.length+6)*9)+'px';inp.setAttribute('aria-label','blank');
      wrap.appendChild(inp);box._w.inputs.push({el:inp,a:seg.a,alts:seg.alts||[]});
    }
  });
  box.appendChild(wrap);
}
function gradeFill(ex,box){
  var w=box._w,res={type:'fill',N:w.inputs.length,H:0,W:0,rows:[],correct:''};
  w.inputs.forEach(function(b,k){
    var v=norm(b.el.value);
    if(v===''){res.rows.push({s:'miss',t:'blank '+(k+1)+' &mdash; correct: <code>'+esc(b.a)+'</code>'});}
    else if(v===norm(b.a)||b.alts.map(norm).indexOf(v)>=0){res.H++;b.el.classList.add('good');res.rows.push({s:'ok',t:'blank '+(k+1)+': <code>'+esc(b.el.value.trim())+'</code>'});}
    else{res.W++;b.el.classList.add('bad');res.rows.push({s:'bad',t:'blank '+(k+1)+': <code>'+esc(b.el.value.trim())+'</code> &mdash; correct: <code>'+esc(b.a)+'</code>'});}
    b.el.disabled=true;
  });
  res.correct=w.inputs.map(function(b){return '<code>'+esc(b.a)+'</code>';}).join(' &middot; ');
  return res;
}

/* ---------- ordering ---------- */
function buildOrder(ex,box){
  var idx=shuffle(ex.items.map(function(t,i){return i;}));
  box._w={seq:idx};
  box.appendChild(el('p','m',esc(ex.instr||'Put the steps in the correct order. Use the arrow buttons or drag to reorder.')));
  var list=el('div');list.id='ord-list';box.appendChild(list);
  redrawOrder(ex,box);
}
function redrawOrder(ex,box){
  var list=$('#ord-list');list.innerHTML='';
  box._w.seq.forEach(function(ii,pos){
    var row=el('div','ord-item');
    row.innerHTML='<span class="n">'+(pos+1)+'.</span><span class="txt">'+esc(ex.items[ii])+'</span>';
    var up=el('button');up.type='button';up.innerHTML='&uarr;';up.setAttribute('aria-label','move up');
    up.addEventListener('click',function(){if(pos>0){var s=box._w.seq;var t=s[pos];s[pos]=s[pos-1];s[pos-1]=t;redrawOrder(ex,box);}});
    var dn=el('button');dn.type='button';dn.innerHTML='&darr;';dn.setAttribute('aria-label','move down');
    dn.addEventListener('click',function(){var s=box._w.seq;if(pos<s.length-1){var t=s[pos];s[pos]=s[pos+1];s[pos+1]=t;redrawOrder(ex,box);}});
    row.appendChild(up);row.appendChild(dn);
    row.draggable=true;
    row.addEventListener('dragstart',function(ev){ev.dataTransfer.setData('text/plain',String(pos));});
    row.addEventListener('dragover',function(ev){ev.preventDefault();});
    row.addEventListener('drop',function(ev){
      ev.preventDefault();
      var from=Number(ev.dataTransfer.getData('text/plain'));
      if(isNaN(from))return;
      var s=box._w.seq;var item=s.splice(from,1)[0];s.splice(pos,0,item);redrawOrder(ex,box);
    });
    list.appendChild(row);
  });
}
function gradeOrder(ex,box){
  var w=box._w,res={type:'order',N:ex.items.length,H:0,W:0,rows:[],correct:''};
  w.seq.forEach(function(ii,pos){
    if(ii===pos){res.H++;res.rows.push({s:'ok',t:'position '+(pos+1)+': '+esc(ex.items[ii])});}
    else{res.W++;res.rows.push({s:'bad',t:'position '+(pos+1)+': '+esc(ex.items[ii])+' (correct: '+esc(ex.items[pos])+')'});}
  });
  res.correct=ex.items.map(function(t,i){return (i+1)+'. '+esc(t);}).join(' &nbsp;&rarr;&nbsp; ');
  lockBox(box);
  return res;
}

/* ---------- terminal ---------- */
function buildTerm(ex,box){
  box._w={};
  if(ex.panel){
    var p=el('div','panel');
    p.innerHTML=ex.panel.map(function(l){return hl(l);}).join('<br>');
    box.appendChild(p);
  }
  var sh=el('div','shell');
  var out=el('div','shell-out');out.id='term-out';
  out.innerHTML=ex.banner?ex.banner.map(function(l){return hl(l);}).join('\n'):'<span class="s"># session ready &mdash; type your command and press Enter. Grading happens when you press Check.</span>';
  var inl=el('div','shell-in');
  inl.innerHTML='<span class="prompt">'+esc(ex.prompt||'analyst@soc-lab:~$')+'</span>';
  var inp=document.createElement('input');inp.id='term-in';inp.spellcheck=false;inp.autocomplete='off';
  inp.setAttribute('aria-label','terminal input');
  inl.appendChild(inp);sh.appendChild(out);sh.appendChild(inl);
  box.appendChild(sh);
  box._w.input=inp;
  box._w.lastCmd='';
  inp.addEventListener('keydown',function(ev){
    if(ev.key!=='Enter')return;
    var cmd=inp.value;box._w.lastCmd=cmd;inp.value='';
    var o=$('#term-out');
    var echo=el('div');echo.innerHTML='<span class="g">'+esc(ex.prompt||'analyst@soc-lab:~$')+'</span> '+esc(cmd);
    o.appendChild(echo);
    var resp=el('div');
    if(norm(cmd)===norm(ex.canonical)){resp.innerHTML=(ex.sample||['# command accepted']).map(function(l){return hl(l);}).join('\n');}
    else{
      var first=norm(cmd).split(' ')[0];var firstC=norm(ex.canonical).split(' ')[0];
      if(first===firstC){resp.innerHTML='<span class="r">'+esc('incorrect usage — check the tool options and the target')+'</span>';}
      else{resp.innerHTML='<span class="r">'+esc('command not found: '+first)+'</span>';}
    }
    o.appendChild(resp);o.scrollTop=o.scrollHeight;
  });
}
function gradeTerm(ex,box){
  var w=box._w,res={type:'terminal',N:0,H:0,W:0,rows:[],correct:'<code>'+esc(ex.canonical)+'</code>',danger:false};
  var typed=norm(w.lastCmd||w.input.value);
  var ct=norm(ex.canonical).split(' ').filter(Boolean);
  var ut=typed.split(' ').filter(Boolean);
  res.N=ct.length;
  ct.forEach(function(tok){
    var k=ut.indexOf(tok);
    if(k>=0){res.H++;res.rows.push({s:'ok',t:'<code>'+esc(tok)+'</code>'});ut.splice(k,1);}
    else{res.rows.push({s:'miss',t:'missing element: <code>'+esc(tok)+'</code>'});}
  });
  ut.forEach(function(tok){res.W++;res.rows.push({s:'bad',t:'unexpected element: <code>'+esc(tok)+'</code>'});});
  (ex.danger||[]).forEach(function(d){if(typed.indexOf(norm(d))>=0)res.danger=true;});
  var out=$('#term-out');
  var can=el('div');can.style.marginTop='8px';
  can.innerHTML='<span class="s"># canonical command:</span>\n<span class="g">'+esc(ex.canonical)+'</span>';
  out.appendChild(can);
  w.input.disabled=true;
  return res;
}

/* ---------- triage ---------- */
function buildTriage(ex,box){
  box._w={sel:{}};
  ex.alerts.forEach(function(a,ai){
    var card=el('div','alert');
    card.innerHTML='<div class="alert-h"><span class="alert-id">'+esc(a.name)+'</span><span class="m">'+esc(a.src||'')+'</span></div>';
    if(a.log){var pre=el('div','alert-pre');pre.innerHTML=a.log.map(function(l){return hl(l);}).join('\n');card.appendChild(pre);}
    var opts=shuffle(a.options.map(function(o,i){return {t:o[0],ok:!!o[1],i:i};}));
    box._w.sel[ai]=null;
    var wrap=el('div');
    opts.forEach(function(o,k){
      var b=el('button','opt');b.type='button';
      b.innerHTML='<span class="lab">'+letters(k)+'</span><span>'+esc(o.t)+'</span><span class="mark">&#10003;</span>';
      b.addEventListener('click',function(){
        box._w.sel[ai]=o.i;
        wrap.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel');});
        b.classList.add('sel');
      });
      b.dataset.gi=o.i;wrap.appendChild(b);
    });
    card.appendChild(wrap);box.appendChild(card);
    a._opts=opts;
  });
}
function gradeTriage(ex,box){
  var res={type:'triage',N:ex.alerts.length,H:0,W:0,rows:[],correct:''};
  ex.alerts.forEach(function(a,ai){
    var gi=box._w.sel[ai];
    var okOpt=a._opts.filter(function(o){return o.ok;})[0];
    var chosen=(gi===null)?null:a._opts.filter(function(o){return o.i===gi;})[0];
    if(chosen&&chosen.ok){res.H++;res.rows.push({s:'ok',t:esc(a.name)+': '+esc(chosen.t)});}
    else if(chosen){res.W++;res.rows.push({s:'bad',t:esc(a.name)+': '+esc(chosen.t)+' (correct: '+esc(okOpt.t)+')'});}
    else{res.rows.push({s:'miss',t:esc(a.name)+': not answered (correct: '+esc(okOpt.t)+')'});}
  });
  res.correct=ex.alerts.map(function(a){var o=a._opts.filter(function(x){return x.ok;})[0];return esc(a.name)+' &rarr; '+esc(o.t);}).join(' &middot; ');
  box.querySelectorAll('.opt').forEach(function(b){b.disabled=true;});
  return res;
}

/* ---------- branching ---------- */
function buildBranch(ex,box){
  box._w={sel:{},n:ex.steps.length};
  ex.steps.forEach(function(s,si){
    var card=el('div','step-card');card.id='step-'+si;
    card.innerHTML='<span class="step-tag">STEP '+(si+1)+' OF '+ex.steps.length+'</span><p style="margin:6px 0">'+s.prompt+'</p>';
    var opts=shuffle(s.options.map(function(o,i){return {t:o[0],ok:!!o[1],i:i};}));
    s._opts=opts;
    var wrap=el('div');
    opts.forEach(function(o,k){
      var b=el('button','opt');b.type='button';
      b.innerHTML='<span class="lab">'+letters(k)+'</span><span>'+esc(o.t)+'</span><span class="mark">&#10003;</span>';
      b.addEventListener('click',function(){
        box._w.sel[si]=o.i;
        wrap.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel');});
        b.classList.add('sel');
        var next=$('#step-'+(si+1));
        if(next)next.classList.remove('hidden');
      });
      b.dataset.gi=o.i;wrap.appendChild(b);
    });
    card.appendChild(wrap);
    if(si>0)card.classList.add('hidden');
    box.appendChild(card);
  });
}
function gradeBranch(ex,box){
  var res={type:'branch',N:ex.steps.length,H:0,W:0,rows:[],correct:''};
  ex.steps.forEach(function(s,si){
    var gi=box._w.sel[si];
    var okOpt=s._opts.filter(function(o){return o.ok;})[0];
    var chosen=(gi===null||gi===undefined)?null:s._opts.filter(function(o){return o.i===gi;})[0];
    if(chosen&&chosen.ok){res.H++;res.rows.push({s:'ok',t:'step '+(si+1)+': '+esc(chosen.t)});}
    else if(chosen){res.W++;res.rows.push({s:'bad',t:'step '+(si+1)+': '+esc(chosen.t)+' (better: '+esc(okOpt.t)+')'});}
    else{res.rows.push({s:'miss',t:'step '+(si+1)+': not answered (better: '+esc(okOpt.t)+')'});}
  });
  res.correct=ex.steps.map(function(s,si){var o=s._opts.filter(function(x){return x.ok;})[0];return 'step '+(si+1)+' &rarr; '+esc(o.t);}).join(' &middot; ');
  box.querySelectorAll('.opt').forEach(function(b){b.disabled=true;});
  return res;
}

/* ---------- dispatcher ---------- */
function gradeEx(ex,box){
  var t=ex.type,r;
  if(t==='qcm'||t==='tf'||t==='multi')r=gradeChoice(ex,box);
  else if(t==='match')r=gradeMatch(ex,box);
  else if(t==='dragdrop')r=gradeDD(ex,box);
  else if(t==='fill')r=gradeFill(ex,box);
  else if(t==='order')r=gradeOrder(ex,box);
  else if(t==='terminal')r=gradeTerm(ex,box);
  else if(t==='triage')r=gradeTriage(ex,box);
  else if(t==='branch')r=gradeBranch(ex,box);
  return r;
}
