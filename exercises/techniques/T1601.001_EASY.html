<style>

}
@keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* ---------- three exercise blocks ---------- */
.blk { border-left: 4px solid var(--accent-blue); margin-top: 16px; }
.blk-q { border-left-color: var(--accent-amber); }
.blk-a { border-left-color: var(--accent-green); }
.blk-h {

  margin-bottom: 8px;
}
.blk-s .blk-h { color: var(--accent-blue); }
.blk-q .blk-h { color: var(--accent-amber); }
.blk-a .blk-h { color: var(--accent-green); }
.blk-s { background: linear-gradient(180deg, rgba(90,169,255,0.06), transparent 60%), var(--bg-surface); }
.blk-q { background: linear-gradient(180deg, rgba(255,180,84,0.06), transparent 60%), var(--bg-surface); }
.blk-a { background: linear-gradient(180deg, rgba(87,211,140,0.05), transparent 60%), var(--bg-surface); }

}

}

}
.log .c { color: #7f93b8; }        /* comment / quiet */
.log .k { color: var(--accent-blue); }  /* keyword */
.log .n { color: #9d7bff; }        /* number */

.log .g { color: var(--accent-green); }
.logview-tools { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg-surface-2); }

}

.pool-box, .bank-box {

}
.bank { flex: 1 1 240px; min-width: 220px; }
.bank-box { border-style: dashed; }
.bank-box.over, .pool-box.over, .slot.over { border-color: var(--accent-green); background: rgba(87,211,140,0.07); }

  color: var(--text-primary); text-align: left; font-size: 14.5px;
}
.chip.picked { border-color: var(--accent-amber); box-shadow: 0 0 0 1px var(--accent-amber); }
.pick-tag { margin-left: auto; color: var(--accent-amber); font-weight: 700; font-size: 12px; white-space: nowrap; }

  padding: 10px 12px; min-height: 130px; max-height: 260px; overflow-y: auto;

.outcome { border-left: 3px solid var(--accent-blue); background: var(--bg-surface-2); padding: 8px 12px; border-radius: 0 8px 8px 0; margin-top: 10px; }

/* ---------- review / results ---------- */
.review-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--bg-surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px; margin: 8px 0;
}
.result-grid { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
.result-cell {
  flex: 1 1 200px; background: var(--bg-surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px;

.result-cell b { display: block; font-size: 22px; }
.banner { border-radius: 10px; padding: 16px 18px; font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; }

.xtable th, .xtable td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.xtable th { color: var(--text-secondary); font-size: 12.5px; letter-spacing: 0.5px; }

/* ---------- pause overlay ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 100;

  display: flex; align-items: center; justify-content: center; text-align: center;

.overlay-card { max-width: 480px; padding: 26px; }
.overlay-card .big { font-size: 24px; font-weight: 800; color: var(--state-paused); margin: 10px 0; }

@media (max-width: 760px) {
  .wrap { padding: 12px 10px 48px; }
  .xhead-in { gap: 6px 8px; }
  .facts div { min-width: 120px; }
  .dnd { flex-direction: column; }
  .filltext input { width: 130px; }
}
@media (prefers-reduced-motion: reduce) {
  .progress i { transition: none; }
  .progress i::after { animation: none; display: none; }
  * { transition: none !important; }
}

<script type="application/json" id="exam-data">{"meta": {"id": "T1601.001", "name": "Patch System Image", "parent": "T1601 Modify System Image", "domain": "Enterprise", "tactic": "Defense Impairment", "platform": "Network Devices", "topicId": "t1601.001", "version": "2.0", "updated": "12 May 2026", "estMin": 30, "budgetSec": 1800, "siteTitle": "T1601.001 Patch System Image — EASY", "title_tag": "T1601.001 — EASY practice exam", "sev": "EASY", "sevClass": "sev-easy", "sevVar": "var(--sev-easy)", "difficulty": "easy", "batch": 1, "passMark": 70}, "learn": "\n<p>You will learn about <b>T1601.001 — Patch System Image<\/b>. This is a <b>sub-technique<\/b> in the MITRE ATT&amp;CK framework. A sub-technique is one specific way an attacker can carry out a bigger goal. Here, the bigger goal is the parent technique <b>T1601 — Modify System Image<\/b>. This one is about changing the operating system image of a <b>network device<\/b>, like a router, a switch, or a firewall.<\/p>\n<p>Imagine a router in your office. Its whole operating system lives in one file on the device. An attacker who gets admin access can replace or edit that file. They can weaken the device's defenses, or add hidden features for themselves, such as watching traffic.<\/p>\n<p>In real work, many people use this knowledge. A <b>SOC analyst<\/b> looks for alerts about image changes. A <b>network security engineer<\/b> checks that devices run vendor-signed images. An <b>incident responder<\/b> decides how to clean a device safely. A <b>GRC analyst<\/b> maps this technique to controls like boot integrity. The tools are simple: device logs, file hashes, and backup copies of trusted images. The risk is big: a patched device sits in the middle of your traffic and is hard to see into.<\/p>\n", "keywords": [{"theme": "The object in ATT&CK", "items": ["T1601.001 Patch System Image", "Sub-technique of T1601 Modify System Image", "Sibling: T1601.002 Downgrade System Image", "Tactic: Defense Impairment", "Platform: Network Devices", "ATT&CK v2.0 of this technique"]}, {"theme": "How the technique works", "items": ["Monolithic OS in one file", "Patching in storage (flash)", "Patching in memory (running OS)", "Protocols: TFTP, SCP, FTP, console", "Boot variable change", "Reload / reboot", "Storage patch survives reboot", "Memory patch is lost on reboot"]}, {"theme": "What attackers gain", "items": ["Weaken existing defenses", "Add new capabilities: Keylogging, Port Knocking", "Stay hidden inside a device the SOC cannot see into"]}, {"theme": "Procedure example on the page", "items": ["S0519 SYNful Knock — malware inserted by patching a router's OS image"]}, {"theme": "Mitigations on the page", "items": ["M1046 Boot Integrity", "M1045 Code Signing", "M1043 Credential Access Protection", "M1032 Multi-factor Authentication (TACACS+ / RADIUS)", "M1027 Password Policies", "M1026 Privileged Account Management"]}], "howExtra": "<li><b>Beginner friendly:<\/b> every exercise here tests one idea at a time, and hints point you at the concept itself, so you can recover even if you are new.<\/li>", "exercises": [{"id": "E01", "type": "qcm", "persp": "def", "summary": "What T1601.001 describes", "scenario": "<p>Your team lead asks you to read the ATT&amp;CK page for <b>T1601.001 — Patch System Image<\/b> before the Monday meeting. She wants you to be able to say, in one sentence, what behaviour this sub-technique describes.<\/p>", "question": "Which sentence best describes what T1601.001 — Patch System Image means?", "options": [{"t": "An adversary changes a network device's OS image to add features or weaken defenses", "ok": true, "why": "The ATT&CK page says adversaries modify the operating system of a network device to introduce new capabilities or weaken existing defenses."}, {"t": "An adversary guesses passwords on a company web login page", "ok": false, "why": "Password guessing is a different technique (Brute Force). T1601.001 is about changing the device's OS image."}, {"t": "An adversary floods a server with emails until it stops working", "ok": false, "why": "Flooding a server is a denial-of-service behaviour. T1601.001 is about silently changing the OS image."}, {"t": "An adversary encrypts user files and demands a payment", "ok": false, "why": "Encrypting files for money is ransomware behaviour. T1601.001 is about the device's own operating system image."}], "hint": "This is about the software image that a router, switch, or firewall runs — not about user accounts or email.", "explain": "T1601.001 — Patch System Image describes an adversary modifying the operating system of a network device. The goal is to add new capabilities or to weaken the defenses that the device provides. From the attacker side, the device is a powerful place to hide because traffic passes through it. From the defender side, this is why image integrity checks matter so much.", "study": "Read the intro paragraph of the T1601.001 page and the parent technique T1601 — Modify System Image."}, {"id": "E02", "type": "qcm", "persp": "def", "summary": "Which platform the technique applies to", "scenario": "<p>A teammate says: “T1601.001 is just for laptops, right?” You open the ATT&amp;CK page. Under the ID it shows a field called <b>Platforms<\/b>. You want to answer with the exact value from the page.<\/p>", "question": "Which platform does the ATT&CK page list for T1601.001?", "options": [{"t": "Network Devices", "ok": true, "why": "The page lists Platforms: Network Devices. Routers, switches, and firewalls are network devices."}, {"t": "Windows laptops", "ok": false, "why": "Windows endpoints are a different platform. T1601.001 targets network devices such as routers and switches."}, {"t": "Android phones", "ok": false, "why": "Mobile phones belong to the Mobile ATT&CK matrix. This sub-technique lives in the Enterprise matrix under Network Devices."}, {"t": "Cloud storage buckets", "ok": false, "why": "Cloud storage is not a device operating system. T1601.001 is about the OS image inside network devices."}], "hint": "Look at the word 'network' in the object's name and think about where the OS image sits.", "explain": "The ATT&CK page for T1601.001 lists exactly one platform: Network Devices. That means routers, switches, firewalls, and similar embedded boxes. Knowing the platform tells you which team owns the risk — in this case the network team, not the desktop team.", "study": "The header fields of the T1601.001 page: ID, sub-technique of, Tactic, Platforms."}, {"id": "E03", "type": "multi", "persp": "att", "summary": "Protocols used to download a new image", "scenario": "<p>The ATT&amp;CK description says an attacker who wants to change the OS <b>in storage<\/b> typically uses the standard procedures available to device operators. This may involve downloading a new file with protocols used on network devices.<\/p>", "question": "Select the TWO protocols that the ATT&CK page names for downloading a new image file.", "options": [{"t": "TFTP", "ok": true, "why": "TFTP is named on the page. It is a simple file-transfer protocol common on network devices."}, {"t": "SCP", "ok": true, "why": "SCP is named on the page. It copies files over an encrypted SSH connection."}, {"t": "Bluetooth file exchange", "ok": false, "why": "Bluetooth is not a protocol used to move OS images onto network devices."}, {"t": "Printer sharing protocol", "ok": false, "why": "Printer sharing has nothing to do with copying an OS image to a router or switch."}], "hint": "Think about the ways a network admin moves files to a router: one is very old and simple, one runs over SSH.", "explain": "The description names TFTP, FTP, SCP, and a console connection as typical ways to bring a new image file onto the device. An attacker uses the same paths as an admin, because normal paths blend in. A defender cares because image transfers to a device should be rare and always tied to a change ticket.", "study": "The second paragraph of the T1601.001 description (changing the OS in storage)."}, {"id": "E04", "type": "match", "persp": "def", "summary": "Match ATT&CK IDs to object names", "scenario": "<p>In a threat-intel meeting you hear four ATT&amp;CK IDs. You build a small cheat sheet so you can read reports faster. Match each ID to its correct name.<\/p>", "question": "Match each ATT&CK ID on the left to its correct name on the right.", "left": ["T1601.001", "T1601.002", "T1542.004", "T1542.005"], "right": ["Patch System Image", "Downgrade System Image", "ROMMONkit", "TFTP Boot"], "hint": "T1601.x is the Modify System Image family; T1542.x is the Pre-OS Boot family (things that run before the OS).", "explain": "T1601.001 is Patch System Image and T1601.002 is its sibling Downgrade System Image — both children of T1601 Modify System Image. T1542.004 ROMMONkit and T1542.005 TFTP Boot belong to Pre-OS Boot. ROMMONkit implants code in the boot loader, which can give a memory patch a way to survive. TFTP Boot means the device loads its image over the network. Attackers chain these: patch plus boot control equals persistence. Defenders counter with M1046 Boot Integrity and vendor-signed images.", "study": "The sub-technique tables of T1601 and T1542."}, {"id": "E05", "type": "dnd", "persp": "att", "summary": "Sort facts: patching in storage vs in memory", "scenario": "<p>The ATT&amp;CK description says an attacker may change the OS file <b>in storage, to be loaded at a future boot<\/b>, or <b>in memory during runtime<\/b>. These two paths behave differently. Sort the facts.<\/p>", "question": "Drag each fact into the bucket it belongs to.", "banks": [{"label": "Patching in STORAGE (flash)"}, {"label": "Patching in MEMORY (running OS)"}], "items": [{"t": "The change survives a reboot", "bank": 0, "why": "A storage patch lives in the flash file that loads at every boot."}, {"t": "The change is lost when the device reboots", "bank": 1, "why": "The ATT&CK page says memory patching does not survive across reboots."}, {"t": "A new image file is written to flash", "bank": 0, "why": "Storage patching means the image file itself is replaced or written."}, {"t": "Done with debug commands that edit the running OS", "bank": 1, "why": "The page describes native debug commands that directly modify memory addresses of the running OS."}], "hint": "Ask for each fact: does it live in a file on flash, or only in the running system?", "explain": "Storage patching changes the image file in flash, so it comes back at every boot. Memory patching only edits the running OS, so a reboot wipes it. Attackers choose storage for persistence and memory for speed or stealth. Defenders use this difference when they respond: a reboot clears a memory patch but activates a storage patch — so never reboot before checking the boot variable and the flash file.", "study": "The description paragraphs on changing the OS in storage vs in memory."}, {"id": "E06", "type": "fill", "persp": "att", "summary": "Complete two sentences about flash and memory", "scenario": "<p>Write two key facts into your notebook. Use the word bank; two words are decoys.<\/p>", "question": "Fill both blanks with words from the bank — two words are decoys.", "text": "A network device keeps its OS image in {0} memory, which is non-volatile. A patch made only to the running system in {1} is lost when the device reboots.", "bank": ["flash", "memory", "console", "reboot", "TFTP", "webcam"], "blanks": [{"ok": "flash", "accept": ["^flash"], "why": "Flash is the non-volatile resident storage where the image file sits."}, {"ok": "memory", "accept": ["^memory$|^ram$"], "why": "Memory (RAM) holds the running OS; it is cleared at reboot."}], "hint": "Blank 1 is a type of storage chip; blank 2 is where the running system lives.", "explain": "Flash memory keeps its content when power is off, so the image file lives there. The running OS lives in memory, and the ATT&CK page is explicit: a patch done only in memory will not survive across reboots. This single fact drives both attacker choices and responder steps.", "study": "The words 'flash' and 'reboot' in the T1601.001 description."}, {"id": "E07", "type": "match", "persp": "def", "summary": "Match two key terms to their meanings", "scenario": "<p>Two terms from the ATT&amp;CK page confuse new analysts: <b>monolithic architecture<\/b> and <b>flash memory<\/b>. Match each term to its plain meaning. Two meanings are decoys.<\/p>", "question": "Match each term to its correct meaning.", "left": ["Monolithic architecture", "Flash memory"], "right": ["The whole OS lives inside one single file", "Non-volatile storage that keeps files when power is off", "A type of wireless encryption", "The device's list of user passwords"], "hint": "Mono- means 'one'. Flash is where photos used to be stored on cameras — it keeps data without power.", "explain": "The ATT&CK description says some network devices are built with a monolithic architecture: the entire OS and most functionality sit in one file, so changing that one file changes the whole device. Flash memory is the non-volatile storage that holds that file. Attackers love this design because one edit gives them full control. Defenders respond by hashing the file and comparing it to the vendor's published value.", "study": "The first paragraph of the T1601.001 description."}, {"id": "E08", "type": "terminal", "persp": "def", "summary": "Type the command that shows the running OS version", "scenario": "<p>You are a junior admin on <b>edge-rtr-01<\/b>. Your mentor says: “Before we trust anything, check what OS the device says it is running. The command is <b>show version<\/b>.” You have a privileged CLI session open.<\/p>", "question": "Type the command that shows the currently running OS version, then press Enter.", "term": {"prompt": "edge-rtr-01#", "shellName": "network device CLI", "syntax": "<b>show version<\/b> — prints the OS version the device is currently running.<br>Shape: <b>show version<\/b> (no options needed).<br>Example on a different switch: <b>sw-floor3# show version<\/b>", "sample": "Cisco IOS Software, Version 17.9.5a\nedge-rtr-01 uptime is 41 days", "canonical": "show version", "canonicalWhy": "'show' is the tool that prints state; 'version' selects the OS version line.", "outputs": [{"re": "show.*version", "out": "Cisco IOS Software, Version 17.9.5a\nedge-rtr-01 uptime is 41 days"}], "requires": [{"re": "show\\s+version", "label": "show version"}], "forbid": []}, "hint": "The mentor already named the two words. Order them correctly: first the action word, then what to show.", "explain": "You typed the command a defender uses first on any device: show version. Attackers know this too — later you will learn they can patch the OS so this very command prints a false version. That is why a defender never trusts it alone and confirms with a hash check. Attacker perspective: the same output tells an attacker which image is running, which helps them pick a matching implant. Defender perspective: version baselines are the cheapest early check.", "study": "Basic device CLI: the 'show' command family."}, {"id": "E09", "type": "qcm", "persp": "def", "summary": "Which tactic T1601.001 belongs to", "scenario": "<p>You are filling a small ATT&amp;CK matrix poster for the team room. For T1601.001 you need the <b>tactic<\/b> — the attacker goal this technique serves. The ATT&amp;CK page shows it under the ID.<\/p>", "question": "Which tactic does T1601.001 sit under?", "options": [{"t": "Defense Impairment", "ok": true, "why": "The page lists Tactic: Defense Impairment. The patch weakens or impairs the device's defenses."}, {"t": "Initial Access", "ok": false, "why": "Initial Access is the first way into an environment. Patching an image happens after the attacker already has deep access."}, {"t": "Discovery", "ok": false, "why": "Discovery is about learning the environment. T1601.001 changes the device instead of just looking at it."}, {"t": "Reconnaissance", "ok": false, "why": "Reconnaissance happens outside the target network. This technique needs privileged access inside a device."}], "hint": "Ask: what does the attacker gain? They damage or weaken a defense — which goal word matches that?", "explain": "T1601.001 belongs to the Defense Impairment tactic (this tactic family was long known as Defense Evasion). The attacker's goal is to weaken or impair defenses: the device itself becomes the blind spot. Knowing the tactic helps you place detections: impairment techniques usually need access-level mitigations first, like M1032 multi-factor authentication and M1026 privileged account management.", "study": "The Tactic field on the T1601.001 page and the tactic's meaning in the ATT&CK matrix."}, {"id": "E10", "type": "multi", "persp": "def", "summary": "Pick two mitigations listed on the page", "scenario": "<p>Your manager asks: “Pick one quick win to propose from the ATT&amp;CK mitigation list for T1601.001.” You first memorise which controls the page actually lists, so you do not propose something invented.<\/p>", "question": "Select the TWO mitigations that the ATT&CK page really lists for T1601.001.", "options": [{"t": "M1046 Boot Integrity", "ok": true, "why": "The page lists M1046: vendors can cryptographically sign images so their integrity is checked at boot time."}, {"t": "M1045 Code Signing", "ok": true, "why": "The page lists M1045: use vendor-signed OS images to prevent or detect image compromise."}, {"t": "Set a BIOS screensaver password", "ok": false, "why": "A screensaver password is not on the ATT&CK mitigation list and does not protect the image file."}, {"t": "Ask users to click fewer links", "ok": false, "why": "User awareness is useful elsewhere, but it is not a listed mitigation for patching a device image."}], "hint": "Both correct answers contain the word 'sign' in their explanation: signatures at boot, and signed images.", "explain": "The page lists six mitigations: M1046 Boot Integrity, M1045 Code Signing, M1043 Credential Access Protection, M1032 Multi-factor Authentication, M1027 Password Policies, and M1026 Privileged Account Management. The two signature-based ones attack the technique directly: a patched (unsigned) image should fail verification. The other four make it harder for an attacker to get the privileged access the technique needs.", "study": "The Mitigations table of the T1601.001 page."}, {"id": "E11", "type": "qcm", "persp": "dual", "summary": "Identify the real-world procedure example", "scenario": "<p>The Procedure Examples table on the ATT&amp;CK page has exactly one entry. Your lead asks you to name it and say what it did, in plain words.<\/p>", "question": "Which statement correctly describes the procedure example S0519?", "options": [{"t": "SYNful Knock is malware inserted into a network device by patching the OS image", "ok": true, "why": "That is the exact wording of the table entry: the malware gets in by patching the device's operating system image."}, {"t": "SYNful Knock is a phishing kit that steals webmail passwords", "ok": false, "why": "It is not about email at all. It lives inside a network device by patching the OS image."}, {"t": "SYNful Knock is a Windows screensaver that mines coins", "ok": false, "why": "It does not run on Windows endpoints. It patches the image of a network device."}, {"t": "SYNful Knock is a phone app that records calls", "ok": false, "why": "It has nothing to do with phones. It is router malware delivered through an image patch."}], "hint": "The name contains 'Knock' — think of a hidden door knock on a big network box.", "explain": "S0519 SYNful Knock is the page's real-world proof that T1601.001 works outside the lab: attackers patched a Cisco IOS router image and the implant lived inside the device. Attacker perspective: patching the image gave the implant a home that most tools never inspect. Defender perspective: responders found it by comparing the image against the vendor's known-good values — exactly what M1045 and M1046 push you to do before an incident.", "study": "The Procedure Examples table on the T1601.001 page."}, {"id": "E12", "type": "order", "persp": "att", "summary": "Order the attacker chain for a storage patch", "scenario": "<p>The detection strategy for this technique describes a <b>suspicious sequence<\/b>. Put its three steps in the order an attacker performs them.<\/p>", "question": "Drag the three steps into the correct order (first step on top).", "steps": ["Upload a new (patched) image file onto the device", "Change the boot variable so the device loads that file at startup", "Reload the device so the patched image takes over"], "hint": "Think like the attacker: the file must exist before the device can be pointed to it, and pointed to it before a restart helps.", "explain": "The analytic for this technique calls the chain 'uploading a new image, modifying boot parameters, and subsequent reload/reboot of the device'. Each step depends on the previous one: no file to boot, no boot change; no boot change, no activation. Defenders detect exactly this chain: an image transfer followed by a boot variable change followed by a reload is almost never normal maintenance without a ticket.", "study": "The Detection Strategy text (analytic AN1293) on the T1601.001 page."}, {"id": "E13", "type": "logview", "persp": "def", "summary": "Find the image download line in a log", "scenario": "<p>You are on shift as a SOC analyst. Device <b>edge-rtr-01<\/b> sent the log excerpt below to the SIEM. Try the filter box: type <code>TFTP<\/code> to narrow the lines.<\/p>", "artefacts": [{"label": "Log — edge-rtr-01 syslog excerpt", "filter": true, "code": "Mar 14 02:31:07 edge-rtr-01 %SYS-5-CONFIG_I: Configured from console by admin on vty0 (10[.]20[.]9[.]44)\nMar 14 02:33:41 edge-rtr-01 %IPACCESSLOGP: list INBOUND denied udp 10[.]20[.]4[.]9(138) -> 10[.]20[.]0[.]1(138), 1 packet\nMar 14 02:40:12 edge-rtr-01 %SYS-6-LOGOUT: User admin has exited tty session 5(10[.]20[.]9[.]44)\n!!Mar 14 02:44:05 edge-rtr-01 %TFTP-6-FILE-TRANSFER: Transfer of file ios-image.bin from 10[.]20[.]9[.]44 to flash: completed\nMar 14 02:47:26 edge-rtr-01 %LINK-3-UPDOWN: Interface GigabitEthernet0/2, changed state to up"}], "question": "Which log line shows a new OS image file being copied onto the device?", "options": [{"t": "The TFTP-6-FILE-TRANSFER line about ios-image.bin", "ok": true, "why": "This line says a file named ios-image.bin was transferred into flash: — that is the OS image arriving."}, {"t": "The denied UDP packet line at 02:33:41", "ok": false, "why": "That is one blocked broadcast packet. No file moved onto the device there."}, {"t": "The CONFIG_I line at 02:31:07", "ok": false, "why": "That shows a configuration change from a console session, not an image file transfer."}, {"t": "The interface up/down line at 02:47:26", "ok": false, "why": "An interface changing state is a network event, not a file transfer."}], "hint": "Look for a line that names a file and the word flash.", "explain": "The TFTP-6-FILE-TRANSFER line is the image arriving in flash — the first step of a storage patch. A good SOC rule alerts on image-file transfers to network devices, because legit ones are rare and ticketed. As a defender you would now check who owns the session and whether the file hash matches the vendor value. Attacker perspective: this step is unavoidable noise for a storage patch, which is why attackers prefer maintenance windows.", "study": "Reading device syslog: TFTP file transfer messages and flash: references."}, {"id": "E14", "type": "qcm", "persp": "att", "summary": "Access level needed for in-memory patching", "scenario": "<p>The description says an attacker who patches the OS <b>in memory<\/b> uses native debug commands that directly modify memory addresses of the running system. A colleague asks what kind of access that needs.<\/p>", "question": "What access level does this in-memory method typically require?", "options": [{"t": "Administrative (privileged) level access", "ok": true, "why": "The page says this method typically requires administrative level access to the device."}, {"t": "No access at all", "ok": false, "why": "Nobody edits a running OS from outside without access to the device."}, {"t": "Read-only monitoring access", "ok": false, "why": "Read-only accounts can look, but debug commands that change memory need privileged rights."}, {"t": "Guest Wi-Fi access", "ok": false, "why": "Guest Wi-Fi is network connectivity, not control of the device's OS."}], "hint": "Debug commands can rewrite the running system — who is allowed to run such commands?", "explain": "In-memory patching uses powerful debug commands, and the ATT&CK page states it typically requires administrative level access. This is why the page's mitigation list leans so heavily on access control: M1032 multi-factor authentication, M1026 privileged account management, M1043 encrypting local credentials, and M1027 password policies. Fewer privileged accounts means fewer paths to this technique.", "study": "The description paragraph about debug commands, plus the mitigation list."}, {"id": "E15", "type": "multi", "persp": "att", "summary": "Which capabilities can a patch add", "scenario": "<p>The description says that by patching the image, an adversary can provision <b>new capabilities<\/b> the device did not have before, and it names examples.<\/p>", "question": "Select the TWO capabilities the ATT&CK page names as things a patch can add.", "options": [{"t": "Keylogging", "ok": true, "why": "Keylogging is named: a patched image can watch what admins type on the device."}, {"t": "Port Knocking", "ok": true, "why": "Port Knocking is named: hidden triggers can open secret access to the implant."}, {"t": "Faster CPU clock speed", "ok": false, "why": "A patch changes behaviour, not hardware speed. This is not on the page."}, {"t": "An extra guest VLAN", "ok": false, "why": "Guest networks are a design choice, not a hidden attacker capability named on the page."}], "hint": "Both correct answers let the attacker watch or quietly reach the device — not fix hardware.", "explain": "The page names Keylogging, Multi-hop Proxy, and Port Knocking as capabilities a patch can add. These turn a trusted device into an attacker tool. Defender takeaway: a compromised core device can capture credentials and relay attacker traffic, so image integrity protects far more than the box itself.", "study": "The description sentence listing new capabilities."}, {"id": "E16", "type": "match", "persp": "att", "summary": "Match method to persistence outcome", "scenario": "<p>The nightly reboot is coming. An attacker has two possible patch methods. Match each method to what happens after the reboot. Two outcomes are decoys.<\/p>", "question": "Match each method to its outcome after the device reboots.", "left": ["Patched image file in storage (flash)", "Patched only the OS in memory"], "right": ["The patch loads again after the reboot", "The patch is gone after the reboot", "The patch moves to the SOC's SIEM", "The patch asks users for permission"], "hint": "Ask again: does the change live in a file on flash, or only in the running system?", "explain": "A storage patch is read from flash at every boot, so it comes back — that is persistence. A memory-only patch dies with the running system. The page adds one more attacker trick: memory patching can be combined with ROMMONkit (boot-loader code) to regain persistence. Defenders should treat any reboot of a suspect device as an action with consequences, not a harmless refresh.", "study": "The description sentences about reboots and ROMMONkit."}]}</script>
<script>

(function () {
  'use strict';
  var EXAM = JSON.parse(document.getElementById('exam-data').textContent);
  var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
  var EXS = EXAM.exercises;
  var LETTERS = 'ABCDEFGHIJ';

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function shuffle(arr) {
    var a = arr.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1));
      t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(s) { s = Math.max(0, s | 0); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
  function normCmd(s) {
    return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/[?]+$/, '');
  }

  /* ---------- state ---------- */
  var S = {
    view: 'intro', order: [], i: 0,
    shuffle: {}, answers: {}, results: {}, checked: {}, hintUsed: {},
    collapsed: {}, skipped: [], phase: 'main',
    pauseManualSec: 0, pauseAutoSec: 0,
    reported: false, finalPercent: 0, handshake: null,
    focusTerm: false
  };
  var T = { state: 'IDLE', remaining: EXAM.meta.budgetSec, resumeTo: null };

  /* ---------- scoring (spec contract) ---------- */
  function scoreExercise(selectedItems, correctItems) {
    var ok = {}, i, H = 0, W = 0;
    for (i = 0; i < correctItems.length; i++) ok[correctItems[i]] = true;
    for (i = 0; i < selectedItems.length; i++) { if (ok[selectedItems[i]]) H++; else W++; }
    var N = correctItems.length;
    return { credit: (N ? Math.max(0, (H - W) / N) : 0), H: H, W: W, N: N };
  }

  /* ---------- timer state machine: RUNNING / PAUSED_MANUAL / PAUSED_AUTO_CHECK / ENDED ---------- */
  function setTimer(st) { T.state = st; renderTimerChip(); }
  function tick() {
    if (T.state === 'RUNNING') {
      T.remaining -= 1;
      renderTimerChip();
      if (T.remaining <= 0) { T.remaining = 0; endExam('timeout'); return; }

  /* ---------- per-exercise presentation shuffles ---------- */
  function initExerciseState(key) {
    var ex = EXS[key], sh = {}, i;
    if (ex.type === 'qcm' || ex.type === 'multi' || ex.type === 'logview') {
      sh.opts = [];
      for (i = 0; i < ex.options.length; i++) sh.opts.push(i);
      sh.opts = shuffle(sh.opts);
    } else if (ex.type === 'match') {
      sh.rights = shuffle(ex.right.map(function (w, i) { return i; }));
    } else if (ex.type === 'dnd') {
      sh.chips = shuffle(ex.items.map(function (w, i) { return i; }));
    } else if (ex.type === 'order') {
      sh.chips = shuffle(ex.steps.map(function (w, i) { return i; }));
    } else if (ex.type === 'fill') {
      sh.bank = shuffle(ex.bank.map(function (w, i) { return i; }));
    } else if (ex.type === 'tree') {
      sh.opts = ex.steps.map(function (st) { return shuffle(st.options.map(function (o, i) { return i; })); });
    } else if (ex.type === 'triage') {
      sh.alerts = ex.alerts.map(function (a) { return shuffle(a.options.map(function (o, i) { return i; })); });
    }
    S.shuffle[key] = sh;
    resetAnswer(key);
  }
  function resetAnswer(key) {
    var ex = EXS[key], i, a = {};
    if (ex.type === 'qcm' || ex.type === 'logview') { a = { sel: [] }; }
    else if (ex.type === 'multi') { a = { sel: [] }; }
    else if (ex.type === 'match') { a = { map: {}, picked: null }; }
    else if (ex.type === 'dnd') { a = { place: {}, picked: null }; }
    else if (ex.type === 'order') { a = { slots: [], picked: null }; }
    else if (ex.type === 'fill') { a = { vals: [] }; for (i = 0; i < ex.blanks.length; i++) a.vals.push(''); }
    else if (ex.type === 'terminal') { a = { lines: [] }; }
    else if (ex.type === 'tree') { a = { step: 0, choices: [] }; }
    else if (ex.type === 'triage') { a = { pick: {} }; }
    S.answers[key] = a;
  }
  function canCheck(ex, a) {
    var i;
    if (ex.type === 'qcm' || ex.type === 'multi' || ex.type === 'logview') return a.sel && a.sel.length > 0;
    if (ex.type === 'match') { for (i in a.map) { return true; } return false; }
    if (ex.type === 'dnd') { for (i in a.place) { if (a.place[i].length) return true; } return false; }
    if (ex.type === 'order') { for (i = 0; i < a.slots.length; i++) { if (a.slots[i] != null) return true; } return false; }
    if (ex.type === 'fill') { for (i = 0; i < a.vals.length; i++) { if (a.vals[i].trim()) return true; } return false; }
    if (ex.type === 'terminal') return a.lines && a.lines.length > 0;
    if (ex.type === 'tree') return a.choices.length === ex.steps.length;
    if (ex.type === 'triage') { for (i in a.pick) { return true; } return false; }
    return false;
  }

  /* ---------- log highlighter ---------- */
  var KWX = /\b(copy|tftp|scp|ftp|boot system|boot|debug|verify|reload|show|version|flash|running-config|startup-config|md5|rommon|firmware|image|deny|permit|audit|tacacs|radius|enable|secret|username|snmp|syslog|port|shutdown)\b/g;
  function hlLine(ln) {
    var e = esc(ln);
    if (/^!!/.test(ln)) return '<span class="b">' + esc(ln.replace(/^!!/, '').replace(/^\s/, '')) + '</span>';
    if (/^\s*[!#]/.test(ln)) return '<span class="c">' + e + '</span>';
    e = e.replace(/&quot;[^&]*?&quot;/g, function (m) { return '<span class="s">' + m + '</span>'; });
    e = e.replace(KWX, function (m) { return '<span class="k">' + m + '</span>'; });
    e = e.replace(/\b\d[\d[\].:]*\b/g, function (m) { return '<span class="n">' + m + '</span>'; });
    return e;
  }
  function hl(code) {
    return String(code || '').split('\n').map(hlLine).join('\n');
  }

        '<pre class="log" id="' + id + '">' + rows.map(function (ln) {

        }).join('') + '</pre>';
    } else {

    }
    return '<div class="artefact"><span class="artefact-label">' + esc(a.label) + '</span>' + inner + '</div>';
  }

    ex.alerts.forEach(function (A, ai) {
      h += '<div class="alert-card"><div class="alert-title">🛰 Alert ' + (ai + 1) + ' — ' + esc(A.title) + '</div>' +
        '<div class="alert-meta">' + esc(A.meta) + '</div><div class="opts" style="margin-top:8px">';
      S.shuffle[key].alerts[ai].forEach(function (uid, k) {
        var o = A.options[uid];
        var sel = a.pick[ai] === uid;
        h += '<button type="button" class="opt' + (sel ? ' sel' : '') + '" aria-pressed="' + sel + '" onclick="Z.triagePick(' + ai + ',' + uid + ')">' +
          '<span class="opt-letter">' + LETTERS[k] + '.</span><span>' + o.t + '</span>' +
          (sel ? '<span class="sel-tag">✓ Selected</span>' : '') + '</button>';
      });
      h += '</div></div>';
    });
    return h;
  }

  function answerHTML(ex, key, a) {
    switch (ex.type) {
      case 'qcm': case 'multi': case 'logview': return optsHTML(ex, key, a);
      case 'match': return matchHTML(ex, key, a);
      case 'dnd': return dndHTML(ex, key, a);
      case 'order': return orderHTML(ex, key, a);
      case 'fill': return fillHTML(ex, key, a);
      case 'terminal': return termHTML(ex, key, a);
      case 'tree': return treeHTML(ex, key, a);
      case 'triage': return triageHTML(ex, key, a);
    }
    return '';
  }

  /* ---------- grading ---------- */
  function grade(ex, a) {
    var sel = [], cor = [], rows = [], forbidHit = false, i, j;
    var isMultiPick = (ex.type === 'multi' || (ex.type === 'logview' && ex.multi));
    if (ex.type === 'qcm' || (ex.type === 'logview' && !ex.multi)) {
      var okIdx = -1;
      for (i = 0; i < ex.options.length; i++) { if (ex.options[i].ok) okIdx = i; }
      cor = [String(okIdx)];
      (a.sel || []).forEach(function (u) { sel.push(String(u)); });
      var ch = a.sel && a.sel.length ? a.sel[0] : null;
      if (ch === okIdx) rows.push(['ok', '✓ Correct', '<b>' + esc(ex.options[okIdx].t) + '</b> — ' + esc(ex.options[okIdx].why)]);
      else {
        if (ch != null) rows.push(['bad', '✗ Wrong', 'You chose “' + esc(ex.options[ch].t) + '” — ' + esc(ex.options[ch].why)]);
        rows.push(['miss', '○ Missed', 'Correct answer: <b>' + esc(ex.options[okIdx].t) + '</b> — ' + esc(ex.options[okIdx].why)]);
      }
    } else if (isMultiPick) {
      for (i = 0; i < ex.options.length; i++) {
        var o = ex.options[i], picked = a.sel.indexOf(i) >= 0;
        if (o.ok) {
          cor.push(String(i));
          if (picked) { sel.push(String(i)); rows.push(['ok', '✓ Correct', '<b>' + esc(o.t) + '</b> — ' + esc(o.why)]); }
          else rows.push(['miss', '○ Missed', '<b>' + esc(o.t) + '</b> — ' + esc(o.why)]);
        } else if (picked) {
          sel.push(String(i));
          rows.push(['bad', '✗ Wrong', '“' + esc(o.t) + '” — ' + esc(o.why)]);
        }
      }
    } else if (ex.type === 'match') {
      for (i = 0; i < ex.left.length; i++) {
        cor.push(i + ':' + i);
        var p = a.map[i];
        if (p === i) { sel.push(i + ':' + p); rows.push(['ok', '✓ Correct', esc(ex.left[i]) + ' → <b>' + esc(ex.right[i]) + '</b>']); }
        else if (p != null) { sel.push(i + ':' + p); rows.push(['bad', '✗ Wrong', esc(ex.left[i]) + ' → you placed “' + esc(ex.right[p]) + '”; correct: <b>' + esc(ex.right[i]) + '</b>']); }
        else rows.push(['miss', '○ Missed', esc(ex.left[i]) + ' → correct: <b>' + esc(ex.right[i]) + '</b>']);
      }
    } else if (ex.type === 'dnd') {
      var placedMap = {};
      for (j in a.place) { (a.place[j] || []).forEach(function (it) { placedMap[it] = +j; }); }
      for (i = 0; i < ex.items.length; i++) {
        cor.push(i + ':' + ex.items[i].bank);
        var b = placedMap[i];
        if (b === ex.items[i].bank) { sel.push(i + ':' + b); rows.push(['ok', '✓ Correct', '“' + esc(ex.items[i].t) + '” → ' + esc(ex.banks[b].label)]); }
        else if (b != null) { sel.push(i + ':' + b); rows.push(['bad', '✗ Wrong', '“' + esc(ex.items[i].t) + '” belongs in <b>' + esc(ex.banks[ex.items[i].bank].label) + '</b>, not ' + esc(ex.banks[b].label) + '. ' + esc(ex.items[i].why || '')]); }
        else rows.push(['miss', '○ Missed', '“' + esc(ex.items[i].t) + '” belongs in <b>' + esc(ex.banks[ex.items[i].bank].label) + '</b>. ' + esc(ex.items[i].why || '')]);
      }
    } else if (ex.type === 'order') {
      for (i = 0; i < ex.steps.length; i++) {
        cor.push(i + ':' + i);
        var s = a.slots[i];
        if (s === i) { sel.push(i + ':' + s); rows.push(['ok', '✓ Correct', 'Position ' + (i + 1) + ': ' + esc(ex.steps[i])]); }
        else if (s != null) { sel.push(i + ':' + s); rows.push(['bad', '✗ Wrong', 'Position ' + (i + 1) + ': you put “' + esc(ex.steps[s]) + '”; correct: <b>' + esc(ex.steps[i]) + '</b>']); }
        else rows.push(['miss', '○ Missed', 'Position ' + (i + 1) + ': correct: <b>' + esc(ex.steps[i]) + '</b>']);
      }
    } else if (ex.type === 'fill') {
      for (i = 0; i < ex.blanks.length; i++) {
        cor.push(String(i));
        var v = (a.vals[i] || '').trim().toLowerCase();
        var hit = false;
        for (j = 0; j < ex.blanks[i].accept.length; j++) { if (new RegExp(ex.blanks[i].accept[j], 'i').test(v)) { hit = true; break; } }
        if (hit) { sel.push(String(i)); rows.push(['ok', '✓ Correct', 'Blank ' + (i + 1) + ': “' + esc(a.vals[i]) + '” — ' + esc(ex.blanks[i].why)]); }
        else if (v) { sel.push('BAD:' + i); rows.push(['bad', '✗ Wrong', 'Blank ' + (i + 1) + ': “' + esc(a.vals[i]) + '” — correct: <b>' + esc(ex.blanks[i].ok) + '</b>. ' + esc(ex.blanks[i].why)]); }
        else rows.push(['miss', '○ Missed', 'Blank ' + (i + 1) + ': correct: <b>' + esc(ex.blanks[i].ok) + '</b>. ' + esc(ex.blanks[i].why)]);
      }
    } else if (ex.type === 'terminal') {
      var joined = normCmd(a.lines.join('\n'));
      var els = ex.term.requires;
      for (i = 0; i < els.length; i++) {
        cor.push(els[i].label);
        if (new RegExp(els[i].re, 'i').test(joined)) {
          sel.push(els[i].label);
          rows.push(['ok', '✓ Correct', 'Element: <code>' + esc(els[i].label) + '</code>' + (els[i].why ? ' — ' + esc(els[i].why) : '')]);
        } else {
          rows.push(['miss', '○ Missed', 'Element: <code>' + esc(els[i].label) + '</code>' + (els[i].why ? ' — ' + esc(els[i].why) : '')]);
        }
      }
      var forbids = ex.term.forbid || [];
      for (i = 0; i < forbids.length; i++) {
        if (new RegExp(forbids[i].re, 'i').test(joined)) {
          sel.push('FORBID:' + forbids[i].label);
          forbidHit = true;
          rows.push(['bad', '✗ DANGEROUS — NEAR MISS', '<code>' + esc(forbids[i].label) + '</code> — ' + esc(forbids[i].why)]);
        }
      }
    } else if (ex.type === 'tree') {
      for (i = 0; i < ex.steps.length; i++) {
        var okI = -1, k;
        for (k = 0; k < ex.steps[i].options.length; k++) { if (ex.steps[i].options[k].ok) okI = k; }
        cor.push(i + ':' + okI);
        var c = a.choices[i];
        if (c === okI) { sel.push(i + ':' + c); rows.push(['ok', '✓ Correct', 'Step ' + (i + 1) + ' — ' + esc(ex.steps[i].options[c].why)]); }
        else if (c != null) { sel.push(i + ':' + c); rows.push(['bad', '✗ Wrong', 'Step ' + (i + 1) + ': ' + esc(ex.steps[i].options[c].why) + ' Correct: <b>' + esc(ex.steps[i].options[okI].t) + '</b> — ' + esc(ex.steps[i].options[okI].why)]); }
        else rows.push(['miss', '○ Missed', 'Step ' + (i + 1) + ' correct: <b>' + esc(ex.steps[i].options[okI].t) + '</b> — ' + esc(ex.steps[i].options[okI].why)]);
      }
    } else if (ex.type === 'triage') {
      for (i = 0; i < ex.alerts.length; i++) {
        var okA = -1, k2;
        for (k2 = 0; k2 < ex.alerts[i].options.length; k2++) { if (ex.alerts[i].options[k2].ok) okA = k2; }
        cor.push(i + ':' + okA);
        var pc = a.pick[i];
        if (pc === okA) { sel.push(i + ':' + pc); rows.push(['ok', '✓ Correct', 'Alert ' + (i + 1) + ' (“' + esc(ex.alerts[i].title) + '”) — ' + esc(ex.alerts[i].options[pc].why)]); }
        else if (pc != null) { sel.push(i + ':' + pc); rows.push(['bad', '✗ Wrong', 'Alert ' + (i + 1) + ' (“' + esc(ex.alerts[i].title) + '”): ' + esc(ex.alerts[i].options[pc].why) + ' Correct: <b>' + esc(ex.alerts[i].options[okA].t) + '</b>.']); }
        else rows.push(['miss', '○ Missed', 'Alert ' + (i + 1) + ' (“' + esc(ex.alerts[i].title) + '”): correct: <b>' + esc(ex.alerts[i].options[okA].t) + '</b>. ' + esc(ex.alerts[i].options[okA].why)]);
      }
    }
    var g = scoreExercise(sel, cor);
    g.rows = rows; g.forbidHit = forbidHit;
    return g;
  }

  /* ---------- exam view ---------- */
  function blockScenario(ex, key) {
    var col = S.collapsed[key];
    var h = '<div class="card blk blk-s"><div class="blk-h"><span aria-hidden="true">🧭</span> SCENARIO' +
      '<button class="pin" onclick="Z.toggleScenario()" aria-label="collapse or expand scenario">' + (col ? '⤓ Expand' : '⤒ Collapse') + '</button></div>' +
      '<div class="small dim" style="margin-bottom:6px">' + esc(ex.summary) + '</div>';
    if (!col) h += '<div>' + ex.scenario + '</div>' + artefactsHTML(ex);
    return h + '</div>';
  }
  function viewExam() {
    var key = curKey(), ex = curEx(), a = S.answers[key];
    if (T.state === 'PAUSED_MANUAL') {
      return headerHTML() + '<div class="wrap"><div class="overlay" style="position:fixed"><div class="overlay-card card">' +
        '<div style="font-size:40px" aria-hidden="true">⏸</div><div class="big">PAUSED — manual</div>' +
        '<p class="dim">The exercise is hidden and the timer is stopped. Press Resume when you are ready to continue.</p>' +
        '<button class="btn btn-primary" onclick="Z.onResume()">▶ Resume</button></div></div></div>';
    }
    var checked = S.checked[key];
    var h = headerHTML() + '<div class="wrap">';
    h += blockScenario(ex, key);
    h += '<div class="card blk blk-q"><div class="blk-h"><span aria-hidden="true">❓</span> QUESTION</div>' +
      '<div class="qtext">' + ex.question + '</div></div>';
    h += '<div class="card blk blk-a"><div class="blk-h"><span aria-hidden="true">✍</span> YOUR ANSWER</div>' +
      '<div' + (checked ? ' style="opacity:0.75"' : '') + '>' + answerHTML(ex, key, a) + '</div>';
    if (S.hintUsed[key]) h += '<div class="hintbox" aria-label="hint shown"><b>💡 Hint</b> (this exercise loses 10% of its credit): ' + esc(ex.hint) + '</div>';
    h += '<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">';
    if (!checked) {
      var dis = canCheck(ex, a) ? '' : ' disabled title="Give an answer first"';
      h += '<button class="btn btn-go" onclick="Z.onCheck()"' + dis + '>✓ Check</button>';
      if (S.phase === 'main') h += '<button class="btn btn-ghost" onclick="Z.onSkip()">⚠ Skip</button>';
      else h += '<button class="btn btn-ghost" onclick="Z.leaveSkipped()">↩ Leave it skipped</button>';
    } else {
      var last = (S.phase === 'main' && S.i === S.order.length - 1);
      if (last) h += '<button class="btn btn-primary" onclick="Z.onFinal()">🏁 Final Submit — see results</button>';
      else if (S.phase === 'review') h += '<button class="btn btn-primary" onclick="Z.onNext()">↩ Back to review list (timer resumes)</button>';
      else h += '<button class="btn btn-primary" onclick="Z.onNext()">Next ▶ (timer resumes)</button>';
    }
    h += '</div>';
    if (checked) h += feedbackHTML(ex, key);
    h += '</div></div>';
    return h;
  }

  function feedbackHTML(ex, key) {
    var g = S.results[key];
    var cls, lab;
    if (g.credit >= 1) { cls = 'fb-correct'; lab = '<span class="ok-c">✓ CORRECT</span> <span class="fb-credit">· Credit ' + g.credit.toFixed(2) + '</span>'; }
    else if (g.credit > 0) { cls = 'fb-partial'; lab = '<span class="ok-p">✓ PARTIALLY CORRECT — credit ' + g.credit.toFixed(2) + ' (' + g.H + '/' + g.N + ' items)</span>'; }
    else { cls = 'fb-incorrect'; lab = '<span class="ok-x">✗ INCORRECT</span> <span class="fb-credit">· Credit ' + g.credit.toFixed(2) + '</span>'; }
    var h = '<div class="fb ' + cls + '" tabindex="-1" aria-label="feedback"><div class="fb-h">' + lab + '</div>';
    if (g.N > 1) h += '<div class="fb-formula">Partial-credit formula: max(0, (H − W) / N) = max(0, (' + g.H + ' − ' + g.W + ') / ' + g.N + ')' +
      (S.hintUsed[key] ? ' · includes the −0.10 hint deduction' : '') + '</div>';
    else if (S.hintUsed[key] && g.credit > 0) h += '<div class="fb-formula">Includes the −0.10 hint deduction.</div>';
    if (g.forbidHit) h += '<div class="fb-items"><li class="bad">✗ <span class="ok-x"><b>DANGEROUS — NEAR MISS:</b> your command would have altered or destroyed state. In real response work that can destroy evidence or extend the outage.</span></li></div>';
    if (ex.type === 'terminal') h += '<div><b>Canonical command</b><div class="canon">' + esc(ex.term.canonical) + '</div>' +
      '<p class="small dim">' + esc(ex.term.canonicalWhy || '') + '</p></div>';
    h += '<ul class="fb-items">';
    g.rows.forEach(function (r) { h += '<li class="' + r[0] + '"><span>' + r[1] + '</span><span>' + r[2] + '</span></li>'; });
    h += '</ul>';
    h += '<div class="fb-why"><b>Why:</b> ' + ex.explain + '</div>';
    if (g.credit < 1 && ex.study) h += '<div class="fb-study"><b>What to study:</b> ' + esc(ex.study) + '</div>';
    return h + '</div>';
  }

  /* ---------- review-skipped view ---------- */
  function viewReview() {
    var h = headerHTML() + '<div class="wrap"><div class="card">' +
      '<h2>⚠ Review skipped exercises</h2>' +
      '<p class="dim">You skipped ' + S.skipped.length + ' exercise' + (S.skipped.length === 1 ? '' : 's') +
      '. You can return to any of them now and answer it, as many times as you need, while the timer runs. ' +
      'If you finish with exercises still unanswered, they are excluded from the score — they count neither for you nor against you.</p>';
    var any = false;
    S.skipped.forEach(function (k) {
      if (S.checked[k]) return;
      any = true;
      var ex = EXS[k];
      h += '<div class="review-row"><span class="chipstate ok-s" aria-label="Skipped">⚠ Skipped</span>' +
        '<b>Exercise ' + (S.order.indexOf(k) + 1) + '</b><span class="dim">' + esc(ex.summary) + '</span>' +
        '<button class="btn" style="margin-left:auto" onclick="Z.reviewAnswer(' + k + ')">Answer now ▶</button></div>';
    });
    if (!any) h += '<p class="ok-c">✓ All skipped exercises have been answered.</p>';
    h += '<div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">' +
      '<button class="btn btn-primary" onclick="Z.reviewFinish()">🏁 Finish exam — see results</button></div></div></div>';
    return h;
  }

  /* ---------- results view ---------- */
  function viewResults() {
    var m = EXAM.meta;
    var sum = 0, answered = 0, full = 0, part = 0, partSum = 0, wrong = 0, left = 0, k;
    for (k in S.results) {
      if (!S.checked[k]) continue;
      answered++;
      var c = S.results[k].credit;
      sum += c;
      if (c >= 1) full++;
      else if (c > 0) { part++; partSum += c; }
      else wrong++;
    }
    left = S.order.length - answered;
    var percent = answered ? Math.round((sum / answered) * 100) : 0;
    var passed = percent >= m.passMark;
    S.finalPercent = percent;
    if (!S.reported) { S.reported = true; reportScore(sum, answered); }
    var rows = '';
    S.order.forEach(function (kk, i) {
      var ex = EXS[kk];
      var res, col;
      if (S.checked[kk]) {
        var c = S.results[kk].credit;
        if (c >= 1) { res = '✓ Fully correct'; col = 'ok-c'; }
        else if (c > 0) { res = '✓ Partially correct (' + c.toFixed(2) + ')'; col = 'ok-p'; }
        else { res = '✗ Fully incorrect'; col = 'ok-x'; }
      } else if (S.skipped.indexOf(kk) >= 0) { res = '⚠ Skipped — excluded'; col = 'ok-s'; }
      else { res = '⚠ Not answered — excluded'; col = 'ok-s'; }
      rows += '<tr><td>' + (i + 1) + '</td><td>' + esc(ex.summary) + '</td><td class="' + col + '">' + res + '</td>' +
        '<td>' + (S.checked[kk] ? S.results[kk].credit.toFixed(2) : '—') + '</td></tr>';
    });
    var used = m.budgetSec - T.remaining;
    var h = '<div class="wrap">' +
      '<div class="banner ' + (passed ? 'banner-pass' : 'banner-fail') + '">' + (passed ? '✓ PASS' : '✗ FAIL') +
      '<span style="font-size:16px;font-weight:600;color:var(--text-primary)">Final score: ' + sum.toFixed(1) + ' / ' + answered +
      ' answered — ' + percent + '% (pass mark ' + m.passMark + '%)</span></div>' +
      '<div class="result-grid">' +
      '<div class="result-cell" style="border-color:var(--state-correct)"><span class="ok-c">✓ Fully correct</span><b class="ok-c">' + full + '</b></div>' +
      '<div class="result-cell" style="border-color:var(--state-partial)"><span class="ok-p">✓ Partially correct</span><b class="ok-p">' + part +
      (part ? '<span class="small dim" style="font-size:13px"> avg ' + (partSum / part).toFixed(2) + '</span>' : '') + '</b></div>' +
      '<div class="result-cell" style="border-color:var(--state-incorrect)"><span class="ok-x">✗ Fully incorrect</span><b class="ok-x">' + wrong + '</b></div>' +
      '<div class="result-cell"><span class="ok-s">⚠ Skipped — excluded</span><b class="ok-s">' + left + '</b></div>' +
      '</div>' +
      '<div class="card"><h2>⏱ Time report</h2>' +
      '<p class="dim">Time used: <b>' + fmt(used) + '</b> of ' + fmt(m.budgetSec) + ' · Manual pause total: <b>' + fmt(S.pauseManualSec) + '</b> · Feedback-review pause total: <b>' + fmt(S.pauseAutoSec) + '</b></p></div>' +
      '<div class="card"><h2>Exercise report</h2><table class="xtable"><tr><th>#</th><th>Exercise</th><th>Result</th><th>Credit</th></tr>' + rows + '</table></div>' +
      '<div class="card" style="text-align:center">' +
      (passed ? '<p><b>Well done.</b> You passed the ' + esc(m.sev) + ' exam for ' + esc(m.id) + '.</p>' :
        '<p><b>You must retake this exam.</b> Study the exercise report above, then try again — the questions and answer choices will be shuffled.</p>') +
      '<button class="btn btn-primary" style="min-width:200px;min-height:48px" onclick="Z.onRetake()">↻ Retake exam</button></div>' +
      '</div>';
    return h;
  }

  /* ---------- score report to the site ---------- */
  function reportScore(creditSum, answeredCount) {
    if (!(window.parent && window.parent !== window)) return;  /* opened directly: nothing to report to */
    var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: EXAM.meta.topicId,
        batch: META.batch,
        score: Math.round(creditSum),
        total: answeredCount,
        percent: percent,
        passed: percent >= META.passMark
      }, location.origin);
    } catch (e) { /* cross-origin parent; the site receives it via its own listener */ }
  }

  /* ---------- flow transitions ---------- */
  function onStart() {
    S.order = shuffle(EXS.map(function (e, i) { return i; }));
    S.order.forEach(function (k) { initExerciseState(k); });
    S.i = 0; S.results = {}; S.checked = {}; S.hintUsed = {}; S.collapsed = {};
    S.skipped = []; S.phase = 'main'; S.reported = false; S.view = 'exam';
    T.remaining = EXAM.meta.budgetSec; setTimer('RUNNING');
    render();
  }
  function onCheck() {
    var key = curKey(), ex = curEx(), a = S.answers[key];
    if (S.checked[key] || !canCheck(ex, a)) return;
    var g = grade(ex, a);
    if (S.hintUsed[key]) g.credit = Math.max(0, g.credit - 0.10);
    S.results[key] = g;
    S.checked[key] = true;
    setTimer('PAUSED_AUTO_CHECK');   /* auto-pause first, then feedback renders */
    render();
  }
  function onNext() {
    if (T.state === 'PAUSED_AUTO_CHECK') setTimer('RUNNING');
    if (S.phase === 'review') { S.view = 'review'; render(); return; }
    if (S.i < S.order.length - 1) { S.i += 1; render(); }
    else toReviewOrResults();
  }
  function onFinal() { toReviewOrResults(); }  /* pending skips still get their review screen */
  function onSkip() {
    if (S.phase === 'review') return;
    var key = curKey();
    if (S.skipped.indexOf(key) < 0) S.skipped.push(key);
    if (S.i < S.order.length - 1) { S.i += 1; render(); }
    else toReviewOrResults();
  }
  function toReviewOrResults() {
    var open = S.skipped.filter(function (k) { return !S.checked[k]; });
    if (open.length) { S.view = 'review'; render(); }
    else endExam('submitted');
  }
  function onHint() {
    var key = curKey();
    if (S.checked[key] || S.hintUsed[key]) return;
    S.hintUsed[key] = true;
    render();
  }
  function onPause() {
    if (S.view !== 'exam') return;
    if (T.state === 'RUNNING' || T.state === 'PAUSED_AUTO_CHECK') { T.resumeTo = T.state; setTimer('PAUSED_MANUAL'); }
    render();
  }
  function onResume() { setTimer(T.resumeTo || 'RUNNING'); T.resumeTo = null; render(); }
  function onRetake() {
    S.view = 'intro'; S.phase = 'main'; S.results = {}; S.checked = {}; S.hintUsed = {};
    S.skipped = []; S.reported = false;
    T.remaining = EXAM.meta.budgetSec; setTimer('IDLE');
    render();
  }
  function endExam(reason) {
    setTimer('ENDED');
    S.view = 'results';
    render();
  }
  function reviewAnswer(k) { S.phase = 'review'; S.i = S.order.indexOf(k); S.view = 'exam'; render(); }
  function reviewFinish() { endExam('submitted'); }
  function leaveSkipped() { S.view = 'review'; setTimer('RUNNING'); render(); }

  /* ---------- render dispatch (restores keyboard focus across re-render) ---------- */
  function render() {
    var root = $('app');
    var af = document.activeElement;
    var sig = (af && af !== document.body && af.getAttribute) ? af.getAttribute('onclick') : null;
    if (S.view === 'intro') root.innerHTML = viewIntro();
    else if (S.view === 'exam') root.innerHTML = viewExam();
    else if (S.view === 'review') root.innerHTML = viewReview();
    else root.innerHTML = viewResults();
    var restored = false;
    if (sig) {
      try {
        var q = '[onclick="' + sig.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"]';
        var el = root.querySelector(q);
        if (el) { el.focus(); restored = true; }
      } catch (e) { /* selector edge case: focus falls back below */ }
    }
    if (!restored && S.view === 'exam' && S.checked[curKey()]) {
      var fbEl = document.querySelector('.fb');
      if (fbEl) { try { fbEl.focus(); } catch (e2) {} }
    }
    var tin = $('termIn');
    if (tin) {
      tin.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { Z.termSubmit(tin); }
      });
      if (S.focusTerm) { tin.focus(); S.focusTerm = false; }
    }
  }

  /* ---------- Z: inline event handlers ---------- */
  var Z = {
    onStart: onStart, onCheck: onCheck, onNext: onNext, onSkip: onSkip, onHint: onHint,
    onPause: onPause, onResume: onResume, onRetake: onRetake, onFinal: onFinal,
    reviewAnswer: reviewAnswer, reviewFinish: reviewFinish, leaveSkipped: leaveSkipped,
    toggleScenario: function () { var k = curKey(); S.collapsed[k] = !S.collapsed[k]; render(); },
    slotKey: function (ev, fn, arg) {
      /* keyboard activation for role=button drop zones (Enter / Space) */
      if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') {
        ev.preventDefault();
        Z[fn](arg);
      }
    },
    optSel: function (uid) {
      var k = curKey(), ex = curEx(), a = S.answers[k];
      if (S.checked[k]) return;
      if (ex.type === 'multi' || (ex.type === 'logview' && ex.multi)) { var p = a.sel.indexOf(uid); if (p >= 0) a.sel.splice(p, 1); else a.sel.push(uid); }
      else a.sel = [uid];
      render();
    },
    dragStart: function (ev, i) { ev.dataTransfer.setData('text/plain', String(i)); },
    dragOver: function (ev) { ev.preventDefault(); ev.currentTarget.classList.add('over'); },
    dragLeave: function (ev) { ev.currentTarget.classList.remove('over'); },
    dragEnd: function (ev) { },
    matchPick: function (r) { var a = S.answers[curKey()]; a.picked = (a.picked === r ? null : r); render(); },
    matchSlot: function (li) {
      var k = curKey(), a = S.answers[k];
      if (S.checked[k] || a.picked == null) return;
      for (var x in a.map) { if (a.map[x] === a.picked) delete a.map[x]; }
      a.map[li] = a.picked; a.picked = null; render();
    },
    matchReturn: function (li) { var k = curKey(), a = S.answers[k]; if (S.checked[k] || a.picked != null) return; delete a.map[li]; render(); },
    matchDrop: function (ev, li) {
      ev.preventDefault(); ev.stopPropagation();
      var k = curKey(), a = S.answers[k];
      if (S.checked[k]) return;
      var r = +ev.dataTransfer.getData('text/plain');
      if (li < 0) { for (var x in a.map) { if (a.map[x] === r) delete a.map[x]; } }
      else { for (var y in a.map) { if (a.map[y] === r) delete a.map[y]; } a.map[li] = r; }
      a.picked = null; render();
    },
    dndPick: function (it) { var a = S.answers[curKey()]; a.picked = (a.picked === it ? null : it); render(); },
    dndBank: function (bi) {
      var k = curKey(), a = S.answers[k];
      if (S.checked[k] || a.picked == null) return;
      for (var b in a.place) { a.place[b] = (a.place[b] || []).filter(function (x) { return x !== a.picked; }); }
      a.place[bi] = (a.place[bi] || []).concat([a.picked]);
      a.picked = null; render();
    },
    dndReturn: function (it) {
      var k = curKey(), a = S.answers[k];
      if (S.checked[k] || a.picked != null) return;  /* a placement is in progress: let the bank handler run */
      for (var b in a.place) { a.place[b] = (a.place[b] || []).filter(function (x) { return x !== it; }); }
      render();
    },
    dndDrop: function (ev, bi) {
      ev.preventDefault(); ev.stopPropagation();
      var k = curKey(), a = S.answers[k];
      if (S.checked[k]) return;
      var it = +ev.dataTransfer.getData('text/plain');
      for (var b in a.place) { a.place[b] = (a.place[b] || []).filter(function (x) { return x !== it; }); }
      if (bi >= 0) a.place[bi] = (a.place[bi] || []).concat([it]);
      a.picked = null; render();
    },
    orderPick: function (it) { var a = S.answers[curKey()]; a.picked = (a.picked === it ? null : it); render(); },
    orderSlot: function (pi) {
      var k = curKey(), a = S.answers[k];
      if (S.checked[k] || a.picked == null) { return; }
      var holder = -1;
      for (var q = 0; q < a.slots.length; q++) { if (a.slots[q] === a.picked) holder = q; }
      if (holder >= 0) a.slots[holder] = a.slots[pi];
      a.slots[pi] = a.picked; a.picked = null; render();
    },
    orderReturn: function (pi) { var k = curKey(), a = S.answers[k]; if (S.checked[k] || a.picked != null) return; a.slots[pi] = null; render(); },
    orderDrop: function (ev, pi) {
      ev.preventDefault(); ev.stopPropagation();
      var k = curKey(), a = S.answers[k];
      if (S.checked[k]) return;
      var it = +ev.dataTransfer.getData('text/plain');
      if (pi < 0) { for (var q = 0; q < a.slots.length; q++) { if (a.slots[q] === it) a.slots[q] = null; } }
      else {
        for (var w = 0; w < a.slots.length; w++) { if (a.slots[w] === it) a.slots[w] = null; }
        if (a.slots[pi] != null) { for (var e2 = 0; e2 < a.slots.length; e2++) { if (a.slots[e2] == null) { a.slots[e2] = a.slots[pi]; break; } } }
        a.slots[pi] = it;
      }
      a.picked = null; render();
    },
    orderMove: function (pi, dir) {
      var k = curKey(), a = S.answers[k];
      if (S.checked[k]) return;
      var q = pi + dir;
      if (q < 0 || q >= a.slots.length) return;
      var t = a.slots[pi]; a.slots[pi] = a.slots[q]; a.slots[q] = t;
      render();
    },
    fillSet: function (i, v) {
      var k = curKey(), a = S.answers[k];
      if (S.checked[k]) return;
      a.vals[i] = v;
      /* no re-render: keeps the caret alive — but the Check button must reflect canCheck now */
      var btn = document.querySelector('.btn-go');
      if (btn) {
        if (canCheck(curEx(), a)) btn.removeAttribute('disabled');
        else { btn.setAttribute('disabled', ''); btn.setAttribute('title', 'Give an answer first'); }
      }
    },
    fillChip: function (w) {
      var k = curKey(), a = S.answers[k];
      if (S.checked[k]) return;
      for (var i = 0; i < a.vals.length; i++) { if (!a.vals[i]) { a.vals[i] = w; break; } }
      render();
    },
    termSubmit: function (input) {
      var k = curKey(), a = S.answers[k];
      if (S.checked[k]) return;
      var v = input.value;
      if (!v.trim()) return;
      a.lines.push(v);
      input.value = '';
      S.focusTerm = true;
      render();
    },
    treeChoice: function (uid) {
      var k = curKey(), a = S.answers[k];
      if (S.checked[k]) return;
      a.choices[a.step] = uid;
      render();
    },
    treeNext: function () { var a = S.answers[curKey()]; if (a.step < curEx().steps.length - 1) { a.step += 1; render(); } },
    treeBack: function () { var a = S.answers[curKey()]; if (a.step > 0) { a.step -= 1; a.choices = a.choices.slice(0, a.step); render(); } },
    triagePick: function (ai, uid) {
      var k = curKey(), a = S.answers[k];
      if (S.checked[k]) return;
      a.pick[ai] = uid; render();
    },
    logFilter: function (v, id) {
      var pre = $(id), cnt = $(id + 'c');
      if (!pre) return;
      var q = v.toLowerCase(), n = 0;
      pre.querySelectorAll('.lg-row').forEach(function (r) {
        var show = !q || r.getAttribute('data-t').indexOf(q) >= 0;
        r.style.display = show ? '' : 'none';
        if (show) n++;
      });
      if (cnt) cnt.textContent = n + ' lines shown';
    }
  };
  window.Z = Z;

  /* ---------- QA sandbox hooks (no UI impact; used by the automated test harness only) ---------- */
  window.CM_DEBUG = {
    setRemaining: function (s) { T.remaining = Math.max(0, s | 0); renderTimerChip(); },
    state: function () { return T.state; },
    tickOnce: function () { tick(); }
  };

  /* ---------- site handshake (dark-only contract: theme field consumed, ignored) ---------- */
  window.addEventListener('message', function (event) {
    if (!event.data) return;
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
    S.handshake = {
      username: event.data.username || '',
      country: event.data.country || '',
      locale: event.data.locale || ''
    };
    render();
  });

  render();
})();

</script>
</body>
</html>
