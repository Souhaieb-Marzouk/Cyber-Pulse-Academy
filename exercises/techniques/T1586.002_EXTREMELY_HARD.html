<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1586.002 Compromise Accounts: Email Accounts — EXTREMELY HARD exam v3.0</title>
<style>

:root{
  --bg:#0b0f14;
  --bg-surface:#111823;
  --bg-surface-2:#0d1420;
  --bg-elev:#161f2e;
  --bg-elev-2:#1b2637;
  --border:#223048;
  --border-soft:#1a2740;
  --text:#d7e3f2;
  --text-bright:#f2f7fd;
  --text-muted:#9fb0c3;
  --blue:#4da3ff;
  --blue-dim:#132f4d;
  --amber:#e8b339;
  --amber-dim:#38300f;
  --green:#46c26e;
  --green-dim:#11321e;
  --orange:#f08a3e;
  --orange-dim:#3a2412;
  --red:#f0554d;
  --red-dim:#3a1614;
  --focus:#4da3ff;
  --blue-hover:#1a3d63;
  --green-hover:#17462a;
  --accent-scen:#4da3ff;
  --accent-quest:#e8b339;
  --accent-ans:#46c26e;
  --sans:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono","Roboto Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --radius:10px;
  --radius-sm:7px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{color:var(--text-bright);line-height:1.25;}
code,.mono{font-family:var(--mono);}
code{
  background:var(--bg-surface-2);
  border:1px solid var(--border-soft);
  color:var(--text-bright);
  padding:1px 5px;border-radius:5px;font-size:.92em;
}
a{color:var(--blue);}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px;}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 64px;}
/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--bg-surface);
  border-bottom:1px solid var(--border);
}
.topbar-in{
  max-width:980px;margin:0 auto;padding:8px 16px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.tb-title{
  color:var(--text-bright);font-weight:700;font-size:.95rem;
  margin-right:auto;display:flex;align-items:center;gap:8px;min-height:32px;
}
.tb-title .mono{color:var(--blue);}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--bg-elev);border:1px solid var(--border);
  color:var(--text);border-radius:999px;
  padding:6px 12px;font-size:.85rem;min-height:32px;white-space:nowrap;
}
.chip .mono{font-variant-numeric:tabular-nums;}
.chip-score{border-color:var(--border);}
.chip-state-running{border-color:var(--border);color:var(--text-muted);}
.chip-state-paused{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);}
.chip-state-auto{border-color:var(--blue);color:var(--blue);background:var(--blue-dim);}
.chip-state-ended{border-color:var(--red);color:var(--red);background:var(--red-dim);}
/* ---------- badges ---------- */
.badge{
  display:inline-flex;align-items:center;gap:6px;
  border-radius:6px;padding:5px 11px;
  font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid;min-height:32px;
}
.badge-easy{color:var(--green);border-color:var(--green);background:var(--green-dim);}
.badge-medium{color:var(--amber);border-color:var(--amber);background:var(--amber-dim);}
.badge-hard{color:var(--orange);border-color:var(--orange);background:var(--orange-dim);}
.badge-extremely-hard{color:var(--red);border-color:var(--red);background:var(--red-dim);}
/* ---------- buttons ---------- */
.btn{
  font-family:var(--sans);font-size:.95rem;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;min-width:44px;padding:8px 18px;
  border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--bg-elev);color:var(--text-bright);
  cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .05s ease;
}
.btn:hover{background:var(--bg-elev-2);}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--blue-dim);border-color:var(--blue);color:var(--text-bright);}
.btn-primary:hover{background:var(--blue-hover);}
.btn-green{background:var(--green-dim);border-color:var(--green);color:var(--text-bright);}
.btn-green:hover{background:var(--green-hover);}
.btn-danger{background:var(--red-dim);border-color:var(--red);color:var(--text-bright);}
.btn-ghost{background:transparent;}
.btn-small{min-height:36px;padding:4px 12px;font-size:.85rem;}
/* ---------- intro screen ---------- */
.intro-card{
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:18px;overflow:hidden;
}
.intro-head{
  padding:22px 22px 18px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,var(--bg-elev),var(--bg-surface));
}
.intro-kicker{
  color:var(--blue);font-weight:700;font-size:.8rem;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:6px;display:flex;gap:8px;align-items:center;
}
.intro-head h1{margin:0 0 4px;font-size:1.5rem;}
.intro-sub{color:var(--text-muted);font-size:.95rem;}
.intro-facts{
  display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;
}
.intro-sec{padding:18px 22px;border-bottom:1px solid var(--border-soft);}
.intro-sec:last-child{border-bottom:none;}
.intro-sec h2{font-size:1.08rem;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
.intro-sec h2 .ic{color:var(--blue);}
.intro-sec p{margin:0 0 10px;}
.intro-sec ul{margin:0 0 10px;padding-left:22px;}
.intro-sec li{margin-bottom:6px;}
.kw-cloud{display:flex;flex-wrap:wrap;gap:8px;}
.kw{
  background:var(--bg-elev);border:1px solid var(--border);
  color:var(--text);border-radius:999px;padding:6px 13px;font-size:.86rem;
  display:inline-flex;align-items:center;gap:7px;
}
.kw::before{content:"◆";color:var(--blue);font-size:.72em;}
.how-grid{display:grid;grid-template-columns:1fr;gap:8px;}
.how-row{display:flex;gap:10px;align-items:flex-start;}
.how-ic{
  flex:0 0 auto;width:26px;height:26px;border-radius:7px;margin-top:1px;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--blue-dim);color:var(--blue);font-size:.85rem;font-weight:700;
}
.start-row{padding:18px 22px 24px;}
.start-btn{width:100%;font-size:1.05rem;}
/* ---------- exercise card ---------- */
.card{
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}
.card-body{padding:16px;}
.blk{
  border:1px solid var(--border-soft);
  border-left:4px solid var(--border);
  border-radius:var(--radius-sm);
  background:var(--bg-surface-2);
  margin-bottom:14px;overflow:hidden;
}
.blk-scen{border-left-color:var(--accent-scen);}
.blk-quest{border-left-color:var(--accent-quest);}
.blk-ans{border-left-color:var(--accent-ans);}
.blk-tag{
  font-size:.72rem;font-weight:800;letter-spacing:.16em;
  padding:7px 12px 0;color:var(--text-muted);
  display:flex;align-items:center;gap:7px;
}
.blk-scen .blk-tag{color:var(--accent-scen);}
.blk-quest .blk-tag{color:var(--accent-quest);}
.blk-ans .blk-tag{color:var(--accent-ans);}
.blk-body{padding:10px 14px 14px;}
.scen-toggle{
  margin:0 0 8px;background:transparent;border:none;color:var(--blue);
  font:inherit;font-size:.85rem;cursor:pointer;padding:6px 2px;min-height:32px;
  display:inline-flex;align-items:center;gap:6px;
}
.scen-clamp{overflow:hidden;}
.persp-tag{
  display:inline-flex;align-items:center;gap:6px;margin-left:auto;
  font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);border:1px solid var(--border-soft);
  border-radius:999px;padding:2px 9px;
}
/* options */
.opt{
  display:flex;align-items:flex-start;gap:11px;
  background:var(--bg-elev);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:10px 12px;margin-bottom:9px;cursor:pointer;
  min-height:44px;transition:border-color .12s ease,background .12s ease;
}
.opt:hover{border-color:var(--blue);background:var(--bg-elev-2);}
.opt input{margin-top:3px;accent-color:var(--blue);width:17px;height:17px;flex:0 0 auto;}
.opt-letter{
  flex:0 0 auto;width:24px;height:24px;border-radius:6px;margin-top:1px;
  background:var(--bg-surface-2);border:1px solid var(--border);
  color:var(--text-muted);font-size:.78rem;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;
}
.opt.sel{border-color:var(--blue);background:var(--blue-dim);}
.opt.sel .opt-letter{background:var(--blue-dim);color:var(--blue);border-color:var(--blue);}
.opt-note{
  margin:-3px 0 10px;font-size:.85rem;color:var(--text-muted);
  border-left:3px solid var(--border);padding:2px 0 2px 11px;
}
.sel-count{font-size:.85rem;color:var(--text-muted);margin:2px 0 10px;}
/* matching */
.match-row{
  display:grid;grid-template-columns:1fr 260px;gap:10px;align-items:center;
  background:var(--bg-elev);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:9px;min-height:44px;
}
.match-row select{
  width:100%;min-height:44px;background:var(--bg-surface-2);color:var(--text-bright);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  font:inherit;font-size:.92rem;padding:6px 8px;
}
/* order */
.order-row{
  display:flex;align-items:center;gap:10px;
  background:var(--bg-elev);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:9px;min-height:48px;
  cursor:grab;
}
.order-row.dragging{opacity:.4;}
.order-idx{
  flex:0 0 28px;height:28px;border-radius:7px;text-align:center;line-height:26px;
  background:var(--bg-surface-2);border:1px solid var(--border);
  color:var(--amber);font-weight:700;font-size:.85rem;
}
.order-row .grow{flex:1 1 auto;}
.mini-btn{
  flex:0 0 auto;width:38px;height:38px;border-radius:7px;
  background:var(--bg-surface-2);border:1px solid var(--border);
  color:var(--text-bright);cursor:pointer;font-size:.9rem;
  display:inline-flex;align-items:center;justify-content:center;
}
.mini-btn:hover{border-color:var(--blue);}
/* drag & drop */
.dnd-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.dnd-bankcol{grid-column:1 / -1;}
.zone{
  border:1.5px dashed var(--border);border-radius:var(--radius-sm);
  background:var(--bg-surface-2);padding:10px;min-height:96px;
  transition:border-color .12s ease;
}
.zone.over{border-color:var(--blue);}
.zone-h{font-size:.85rem;font-weight:700;color:var(--text-bright);margin:0 0 8px;
  display:flex;gap:8px;align-items:center;}
.zone-h .zi{color:var(--ans);}
.pill{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--bg-elev);border:1px solid var(--border);
  border-radius:999px;padding:7px 13px;margin:0 7px 7px 0;
  cursor:pointer;font-size:.9rem;min-height:40px;color:var(--text);
  transition:border-color .12s ease,background .12s ease;
}
.pill:hover{border-color:var(--blue);}
.pill.sel{border-color:var(--blue);background:var(--blue-dim);color:var(--text-bright);}
.pill .pi{color:var(--text-muted);font-size:.8rem;}
.dnd-hint{font-size:.83rem;color:var(--text-muted);margin:0 0 10px;}
/* fill */
.fill-input{
  background:var(--bg-surface-2);border:1px solid var(--border);
  border-radius:7px;color:var(--text-bright);font-family:var(--mono);
  font-size:.95rem;padding:8px 10px;min-height:44px;width:170px;margin:2px 4px;
}
.fill-input:focus{border-color:var(--blue);}
.fill-line{margin-bottom:10px;}
/* branch */
.step-tag{
  font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-muted);margin:0 0 6px;
}
.branch-opt{
  width:100%;text-align:left;margin-bottom:9px;justify-content:flex-start;
  padding:11px 14px;white-space:normal;
}
.branch-note{
  background:var(--bg-elev);border:1px solid var(--border-soft);
  border-left:3px solid var(--amber);border-radius:var(--radius-sm);
  padding:10px 13px;margin:0 0 12px;font-size:.93rem;color:var(--text);
}
/* terminal */
.term{
  background:var(--bg-surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:12px 14px;
}
.term-out{
  white-space:pre-wrap;word-break:break-word;
  font-size:.88rem;line-height:1.5;color:var(--text);
  max-height:280px;overflow-y:auto;margin:0 0 10px;
}
.term-line{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.term-prompt{color:var(--green);font-weight:700;font-size:.88rem;white-space:nowrap;}
.term-in{
  flex:1 1 220px;min-height:40px;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:7px;color:var(--text-bright);
  font-family:var(--mono);font-size:.92rem;padding:7px 10px;
}
.term-in:focus{border-color:var(--blue);}
.term-clar{
  background:var(--bg-elev);border:1px solid var(--border-soft);
  border-left:3px solid var(--blue);border-radius:var(--radius-sm);
  padding:9px 13px;font-size:.9rem;margin:0 0 12px;color:var(--text);
}
.tok-cmd{color:var(--blue);font-weight:600;}
.tok-flag{color:var(--amber);}
.tok-str{color:var(--green);}
.tok-dim{color:var(--text-muted);}
.term-err{color:var(--red);}
/* feedback */
.fb{
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:13px 15px;margin:4px 0 14px;background:var(--bg-elev);
}
.fb-good{border-color:var(--green);background:var(--green-dim);}
.fb-part{border-color:var(--amber);background:var(--amber-dim);}
.fb-bad{border-color:var(--red);background:var(--red-dim);}
.fb-danger{border-color:var(--red);background:var(--red-dim);box-shadow:inset 0 0 0 1px var(--red);}
.fb-head{font-weight:800;font-size:1rem;display:flex;align-items:center;gap:9px;color:var(--text-bright);}
.fb-good .fb-head{color:var(--green);}
.fb-part .fb-head{color:var(--amber);}
.fb-bad .fb-head,.fb-danger .fb-head{color:var(--red);}
.fb-credit{font-size:.88rem;color:var(--text-muted);margin:5px 0 8px;}
.fb-items{list-style:none;margin:0 0 9px;padding:0;}
.fb-items li{
  padding:5px 0 5px 2px;font-size:.9rem;
  border-bottom:1px dashed var(--border-soft);
}
.fb-items li:last-child{border-bottom:none;}
.it-c{color:var(--green);}
.it-w{color:var(--red);}
.it-m{color:var(--text-muted);}
.fb-explain{font-size:.93rem;color:var(--text);}
.fb-explain code{word-break:break-word;}
.fb-canonical{
  background:var(--bg-surface-2);border:1px solid var(--border);
  border-radius:7px;padding:9px 12px;margin:8px 0;font-size:.9rem;
  font-family:var(--mono);color:var(--text-bright);word-break:break-word;
}
/* action row */
.action-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.skip-warn{
  color:var(--amber);font-size:.85rem;display:inline-flex;gap:6px;align-items:center;
}
/* pause overlay */
.pause-ov{
  margin-top:14px;border:1px solid var(--amber);border-radius:var(--radius-sm);
  background:var(--amber-dim);padding:22px;text-align:center;
}
.pause-ov .big{font-size:1.15rem;font-weight:800;color:var(--amber);display:flex;gap:9px;align-items:center;justify-content:center;}
.pause-ov p{color:var(--text);margin:8px 0 14px;}
/* review hub */
.rev-item{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--bg-elev);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:10px;min-height:52px;
}
.rev-item .grow{flex:1 1 auto;min-width:200px;}
.rev-st{color:var(--amber);font-weight:700;display:inline-flex;gap:6px;align-items:center;font-size:.88rem;}
/* results */
.res-banner{
  border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;text-align:center;background:var(--bg-surface);
  margin-bottom:16px;
}
.res-banner.pass{border-color:var(--green);background:linear-gradient(180deg,var(--green-dim),var(--bg-surface));}
.res-banner.fail{border-color:var(--red);background:linear-gradient(180deg,var(--red-dim),var(--bg-surface));}
.res-pct{font-size:3rem;font-weight:800;color:var(--text-bright);font-variant-numeric:tabular-nums;}
.res-word{font-size:1.1rem;font-weight:800;display:inline-flex;gap:9px;align-items:center;}
.res-banner.pass .res-word{color:var(--green);}
.res-banner.fail .res-word{color:var(--red);}
.res-sub{color:var(--text-muted);margin-top:6px;font-size:.92rem;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px;}
.stat{
  background:var(--bg-surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:14px 16px;
}
.stat .k{color:var(--text-muted);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:7px;align-items:center;}
.stat .v{font-size:1.45rem;font-weight:800;color:var(--text-bright);margin-top:4px;font-variant-numeric:tabular-nums;}
.stat .s{font-size:.83rem;color:var(--text-muted);margin-top:2px;}
.stat-green .v{color:var(--green);}
.stat-amber .v{color:var(--amber);}
.stat-red .v{color:var(--red);}
.stat-blue .v{color:var(--blue);}
.res-table{width:100%;border-collapse:collapse;font-size:.9rem;}
.res-table th,.res-table td{border-bottom:1px solid var(--border-soft);padding:8px 10px;text-align:left;}
.res-table th{color:var(--text-muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;}
.res-table td .mono{font-variant-numeric:tabular-nums;}
/* toast */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--bg-elev-2);border:1px solid var(--blue);
  color:var(--text-bright);border-radius:999px;padding:10px 20px;
  font-size:.9rem;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.5);
}
/* responsive */
@media (max-width:760px){
  .match-row{grid-template-columns:1fr;}
  .dnd-grid{grid-template-columns:1fr;}
  .tb-title{width:100%;margin-right:0;}
  .intro-head h1{font-size:1.25rem;}
  .res-pct{font-size:2.3rem;}
  .blk-body{padding:9px 11px 12px;}
}
/* motion */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;}
}
@keyframes pulse-ok{0%{box-shadow:0 0 0 0 rgba(70,194,110,.35);}100%{box-shadow:0 0 0 12px rgba(70,194,110,0);}}
@keyframes fade-up{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.anim-fade{animation:fade-up .18s ease-out;}
.pulse-ok{animation:pulse-ok .5s ease-out;}

</style>
</head>
<body>
<div class="topbar" id="topbar" style="display:none">
  <div class="topbar-in">
    <div class="tb-title"><span class="mono">T1586.002</span><span>Compromise Accounts: Email Accounts</span></div>
    <span class="badge badge-extremely-hard" id="tb-sev" data-sev-badge>EXTREMELY HARD</span>
    <span class="chip" id="tb-count">Exercise 1 of 15</span>
    <span class="chip" id="tb-timer" aria-label="Timer">⏱ --:--</span>
    <span class="chip chip-state-running" id="tb-state">▶ Running</span>
    <span class="chip chip-score" id="tb-score">Score: 0.00</span>
    <button class="btn btn-small" id="tb-hint" title="One hint per exercise (−0.10 credit)">△ Hint</button>
    <button class="btn btn-small" id="tb-skip" title="Move to the review list">⏭ Skip</button>
    <button class="btn btn-small" id="tb-pause" title="Stop the clock by hand">⏸ Pause</button>
  </div>
</div>
<main class="wrap">
  <div id="view-intro"></div>
  <div id="view-exam" style="display:none"><div id="exam-inner"></div><div id="pause-slot"></div></div>
  <div id="view-review" style="display:none"></div>

var EX = [{"id":"X01","type":"qcm","persp":"def","scenario":"CFO <code>e.duval<\/code>: a sign-in arrives through an anonymising VPN whose ASN matches the “privacy VPN” app she installed last month. No new inbox rules. One <strong>external forward<\/strong> was enabled three weeks ago; the helpdesk ticket says “configured by IT during migration”, but no migration change record exists for that mailbox.","question":"What is the least-wrong next action?","options":["Verify the forward against change-management records and conditional-access logs, and keep monitoring — do not close yet","Close as false positive: the VPN explains the geography, and the helpdesk ticket explains the forward","Wipe the mailbox immediately — better safe than sorry","Disable every executive account until each one is “proven clean”"],"correct":0,"notes":["Right. The VPN makes the geography <em>plausible<\/em>; the missing change record makes the forward <em>unverified<\/em>. Verification is cheap; both extremes (close now / wipe now) are expensive mistakes.","The ticket is the contradiction: IT claims a migration the change system never recorded. Closing on an unverified story is how BEC lives for months.","Wiping destroys evidence and business data on an unconfirmed case — the most destructive option.","Collective punishment of the executive team is disproportionate and teaches the business to route around the SOC."],"hint":"Two explanations are “almost” satisfying. Ask which one you can <em>prove<\/em> with a record you actually possess.","explain":"Senior triage separates <em>plausible<\/em> from <em>verified<\/em>. The privacy-VPN explains the ASN but not the unrecorded forward; the helpdesk claim needs a change record to be evidence. Verify first (change management, conditional access, who approved the forward), keep the case open, and expand monitoring meanwhile. Contradiction handled — without overreaction."},{"id":"X02","type":"multi","persp":"def","scenario":"Campaign frame: over six days, 40 lure emails were sent to your finance staff from a partner’s <strong>compromised mailbox<\/strong> (T1586.002). Each lure carried a link; during the same window a forwarding rule silently copied replies out. Five recipients opened; one submitted credentials.","question":"Select <strong>all<\/strong> techniques that this adversary activity set actually used.","options":["T1586.002 · Compromise Accounts: Email Accounts (the partner mailbox as the prepared resource)","T1566.002 · Spearphishing Link (the lures carried links)","T1114.003 · Email Forwarding Rule (silent collection during the window)","T1486 · Data Encrypted for Impact (ransomware)","T1561 · Disk Wipe"],"correct":[0,1,2],"notes":["Yes — the campaign’s trust engine is the compromised mailbox resource.","Yes — the delivery is a linked lure, so Spearphishing Link.","Yes — the forwarding rule is stated in the frame.","No — nothing in the frame encrypts anything; do not import techniques without evidence.","No — no destruction happened; same discipline."],"hint":"Map only what the frame states: a mailbox resource, links, and a forwarding rule. Nothing more.","explain":"Disciplined mapping: resource (T1586.002), delivery (T1566.002), collection (T1114.003). Adding dramatic techniques without evidence (ransomware, wipe) corrupts metrics and misdirects hunting — precision is a senior analyst’s habit."},{"id":"X03","type":"order","persp":"def","scenario":"Reconstruct the incident timeline from logs (logs are reliable; only the order is lost).","question":"Order the six events chronologically.","items":["Credential-phishing mail reaches the finance team","A victim submits credentials on the clone site","An impossible-travel sign-in opens the mailbox","A hidden inbox rule starts marking invoice mail as read","Lures are sent internally from the compromised mailbox","Credentials are reset and sessions revoked by the SOC"],"itemNotes":["The supply step: the lure that starts everything.","The harvest: credentials change hands (proxy kit captures the session too).","The takeover becomes access — the T1586.002 resource exists from here.","Persistence + collection: the mailbox starts serving the attacker quietly.","The resource is spent against the internal contact network.","Containment ends the window — the metric that matters is the gap between events 3 and 6."],"hint":"Nobody can sign in before credentials are submitted, and the SOC reset comes last by definition.","explain":"Timeline: lure → harvest → access → persistence → abuse → containment. Two lessons: the attacker’s longest phase sits between access and containment (so tune detection toward events 3–5), and each phase leaves telemetry in a different log — mail gateway, clone site (if visible), identity, rules, mail flow, SOC actions."},{"id":"X04","type":"fill","persp":"def","scenario":"Memory round: three technique IDs every mailbox-takeover report uses. Letter T optional.","question":"Fill in all three ATT&CK IDs.","segments":["The MFA push-flooding technique is "," ; the stolen-cookie replay into a webmail session is "," ; the silent forwarding rule is "," ."],"blanks":[{"accept":["t1621","1621"],"note":"Multi-Factor Authentication Request Generation."},{"accept":["t1550.004","1550.004","t1550 004","1550 004"],"note":"Use Alternate Authentication Material: Web Session Cookie."},{"accept":["t1114.003","1114.003","t1114 003","1114 003"],"note":"Email Collection: Email Forwarding Rule."}],"hint":"Pressure (short ID) → replay (1550.x) → forwarding (1114.x).","explain":"<code>T1621<\/code> MFA Request Generation, <code>T1550.004<\/code> Web Session Cookie, <code>T1114.003<\/code> Email Forwarding Rule — the pressure, the replay and the persistence that bracket a modern mailbox takeover."},{"id":"X05","type":"term","persp":"def","scenario":"Forensic console. Query the Unified Audit Log for CFO <code>e.duval<\/code>: last <strong>7 days<\/strong>, and only the operations that matter for a takeover case: <code>New-InboxRule<\/code> and <code>MailItemsAccessed<\/code>.","question":"Run the audit-log query.","shell":{"promptStr":"examiner@soc-lab:~/cases/duval$","banner":"Forensic console (simulated) — type <span class='tok-dim'>help<\/span>.","helpText":"Tools:\n  search-ual [--user U] [--days N] [--ops OP1,OP2]   query the Unified Audit Log\n  export-mail ...                                     see: export-mail --help\n  help                                                this text","tools":[{"re":"search-ual","out":"== UAL export: user=e.duval  days=7  ops=New-InboxRule,MailItemsAccessed ==\n2026-09-14T03:02Z New-InboxRule      actor=e.duval rule='RSS Feeds' actions=MarkAsRead,MoveTo:rss\n2026-09-14T03:07Z MailItemsAccessed  actor=e.duval src=asn20473-newholland.example count=38\n2026-09-14T03:09Z MailItemsAccessed  actor=e.duval src=asn20473-newholland.example count=112\n2026-09-15T09:44Z MailItemsAccessed  actor=e.duval src=corp-vpn-eu.example count=25 (baseline)"},{"re":"export-mail\\s*$","out":"usage: export-mail --user <upn> --from <YYYY-MM-DD> --to <YYYY-MM-DD> --out <path>.pst"},{"re":"search-ual\\s*$","out":"usage: search-ual --user <upn> [--days N] [--ops OP1,OP2]"},{"re":"^ls","out":"ual-readonly.mount  notes.txt"},{"re":"^cat notes","out":"case 2026-09-duval: possible takeover; audit mount is READ-ONLY."}]},"elements":[{"re":"search-ual","label":"Uses search-ual (the audit query tool)","note":"Reading the UAL is the correct forensic move."},{"re":"--user\\s+e\\.duval","label":"Scopes to the subject mailbox (e.duval)","note":"Case scope: the CFO’s account."},{"re":"--days\\s+7|--last\\s+7","label":"Bounds the window to 7 days","note":"The case window keeps the export reviewable."},{"re":"--ops(?=.*New-InboxRule)(?=.*MailItemsAccessed)","label":"Filters ops to New-InboxRule + MailItemsAccessed","note":"Persistence + reading behaviour — the takeover-relevant pair."}],"nearMiss":[{"re":"purge-ual|clear-ual|reset-ual|delete.{0,14}log|remove.{0,14}log|wipe\\s","label":"audit-trail destruction","why":"Purging audit logs destroys the investigation’s ground truth — and log tampering is its own serious incident. DANGEROUS near miss: forensic consoles query logs; they never erase them."}],"canonical":"search-ual --user e.duval --days 7 --ops New-InboxRule,MailItemsAccessed","dangerousExample":"purge-ual --user e.duval","expected":"Expected finding: the “RSS Feeds” rule at 03:02 followed by MailItemsAccessed bursts from an unfamiliar ASN — persistence and collection in one page.","clarification":"Forensic console — tools: <code>search-ual<\/code>, <code>export-mail --help<\/code>, <code>help<\/code>. The grader checks the <strong>last<\/strong> command. Choose what a forensic examiner would defend in court: read-only, scoped, reproducible.","hint":"Tool, subject, window, operations — the four things a defensible audit query states.","explain":"<code>search-ual --user e.duval --days 7 --ops New-InboxRule,MailItemsAccessed<\/code> is the defensible query: scoped subject, bounded window, filtered to the operations that answer the case question. Notice what the output gives you: a rule created minutes before reading bursts from infrastructure the CFO never uses — sequence is evidence."},{"id":"X06","type":"qcm","persp":"att","scenario":"Attacker-doctrine question. You hold a heavily monitored executive mailbox. Every rule change, consent grant and external forward lands in a SOC dashboard within minutes.","question":"Which persistence posture is the <em>least aggressive<\/em> and survives longest?","options":["Stay passive: read, learn, and occasionally act exactly as the owner would","Add a forwarding rule to your collection domain","Register your own OAuth application through a consent grant","Delete security-alert emails weekly to cover your traces"],"correct":0,"notes":["Right: reading leaves only audit traces that blend with the owner’s baseline; no configuration change exists to alert on. It is the hardest posture to detect and the one real operators use against monitored executives.","A forwarding rule is a configuration change — exactly what the dashboard watches; lifespan measured in minutes.","Consent grants are loudly audited and routinely swept.","Deleting alerts creates gaps that “no new alerts” rules and digest summaries notice."],"hint":"What does the SOC actually see: the mail that arrives, or the mail that is merely read?","explain":"Against mature monitoring, the quietest action is configuration <em>silence<\/em>: pure reading plus occasional owner-shaped activity. This is why defenders must alert on reading behaviour (MailItemsAccessed anomalies) and user reporting, not only on configuration changes — and why “nothing changed” is never the same as “nothing happened”."},{"id":"X07","type":"dnd","persp":"def","scenario":"Queue triage with four open cases and limited time. Sort by the action each case deserves.","question":"Drag each case into the right zone.","bank":["Case A: executive mailbox with a hidden rule auto-deleting security alerts","Case B: impossible travel fully explained by corporate VPN egress on a compliant device","Case C: a single TOR sign-in that conditional access BLOCKED; no success","Case D: external forward on a service account created by the sanctioned migration tool"],"zones":["Act now","Monitor","Close as false positive"],"zoneOf":[0,2,1,1],"itemNotes":["Act now: silent deletion of security mail is attacker-shaped behaviour already in effect.","Close as FP: sanctioned egress + compliant device explains the geography; tune the rule instead.","Monitor: the block worked; raise conditional-access verbosity and watch for retries.","Monitor: sanctioned tooling with a plausible story — verify the change record and watch the volume."],"hint":"One case is behaviour, one is explained geography, one was blocked, one is sanctioned-but-unverified.","explain":"Triage sorts by <em>harm in progress<\/em>: A acts (behaviour live), C/D monitor (blocked or sanctioned-but-unverified), B closes (fully explained). Note that “monitor” is a real decision with a review date — not a euphemism for ignoring."},{"id":"X08","type":"qcm","persp":"def","scenario":"Cost-of-action decision. One of your 200 partner mailboxes is confirmed compromised; the partner is a supplier with automated EDI mail flows into your ERP.","question":"Which response is proportionate and effective?","options":["Targeted: the partner resets the affected mailbox, notifies their other customers, and both sides add conditional-access monitoring on that relationship","Disable all 200 partner mailboxes until each is “cleared”","Treat it as the partner’s private problem and change nothing","Send a generic warning email to all 200 partners’ staff and move on"],"correct":0,"notes":["Right: the harm is specific, so the containment is specific — plus one process improvement (monitoring) that scales.","Disabling 200 mailboxes halts EDI and invoice flows — massive self-inflicted cost for one confirmed compromise.","Ignoring ignores that the mailbox was aimed at <em>you<\/em>; the same actor may hold sibling mailboxes.","Awareness alone without containment leaves the compromised mailbox in production."],"hint":"Weigh the cost of each option against the confirmed blast radius: one mailbox.","explain":"Proportionality: match response cost to confirmed harm. Targeted containment + partner cooperation + monitoring on the relationship is effective and survivable. Overbroad shutdowns convert an incident into a business outage — attackers win that exchange without sending another email."},{"id":"X09","type":"branch","persp":"def","scenario":"Full BEC investigation. Thread: vendor “Payex” sends “updated bank details”; DMARC passes; Payex was acquired last month (credentials churn plausible). Your finance team already paid €48,000 before anyone called you.","question":"Work the investigation to its evidence plan.","steps":[{"prompt":"Step 1 — First action?","options":[{"text":"Call Payex on the contract phone number to verify the bank change","note":"Correct: out-of-band verification through a known channel — the email thread itself belongs to the attacker right now."},{"text":"Reply in the email thread asking whether the change is legitimate","note":"You would be asking the compromise itself; it will answer “yes” — and you will have tipped your hand."},{"text":"Block Payex’s domain at the mail gateway","note":"Overkill that breaks a live business relationship; the problem is one mailbox, not a domain."}]},{"prompt":"Step 2 — Payex confirms their mailbox was compromised. The €48,000 payment is already gone. Next?","options":[{"text":"Contact the bank for recall + fraud report, and freeze evidence preservation on your side","note":"Recall windows close in hours; evidence ages every minute. Both tracks start now."},{"text":"Delete the fraudulent emails from your own mailbox to “stop the confusion”","note":"Destroying the fraud record while the bank investigates — the worst possible move."},{"text":"Wait for month-end reconciliation to quantify the loss","note":"Recall is a race against settlement; month-end is after the money is gone for good."}]},{"final":true,"multi":true,"prompt":"Final — Select <strong>ALL<\/strong> items you will preserve for the insurer and law enforcement.","options":["The original .eml files with full headers (lure and replies)","Message trace records for the lure and the internal replies","Mailbox audit + UAL exports covering the incident window","Payment records and bank correspondence for the €48,000","A sticky note from the finance desk summarising the case from memory","Your personal opinion about which criminal group was responsible"],"correct":[0,1,2,3],"notes":["Yes — headers carry the authentication results and origin path.","Yes — message trace proves what left, when, to whom.","Yes — audit evidence shows access, rules and reads.","Yes — the financial trail ties the incident to the loss.","No — informal recollections are not evidence; statements get taken properly later.","No — opinions are not artefacts; attribution belongs to the intelligence process, not the evidence bag."]}],"hint":"Verify out-of-band, race the recall window, and preserve what a court would weigh — records, not recollections.","explain":"The senior pattern: out-of-band verification (never through the attacker’s channel), immediate recall+fraud action (hours matter), and disciplined evidence preservation (eml+headers, message trace, audit/UAL, financial records). Note the two rejections: destroying mail and mixing opinion into evidence — both are irreversible errors."},{"id":"X10","type":"qcm","persp":"def","scenario":"Intel note: the same lure-domain naming pattern appears in campaigns attributed by two vendors to <em>different<\/em> actors. Both campaigns used mailboxes compromised from the same access-broker channel.","question":"What is the analytically sound position?","options":["Shared infrastructure (likely broker resale) — attribute cautiously and track the activity as separate clusters until other evidence aligns","Both campaigns are definitely the same actor","Attribution is impossible, so stop tracking the infrastructure entirely","Rename the campaign after the lure domain and treat it as one actor’s fingerprint"],"correct":0,"notes":["Right: T1586.002 resources are traded; a broker’s mailbox can serve several customers. Infrastructure overlap across broker-fed campaigns is weak attribution evidence.","“Definitely” overstates what shared broker infrastructure proves.","The infrastructure stays valuable for detection regardless of attribution limits.","A rented domain is the opposite of a fingerprint — it is inventory."],"hint":"Who owned the mailbox when it was used — and who owned it a week later?","explain":"Broker-supplied resources are deliberately laundered: the same mailbox may be rented to multiple operators weeks apart. Senior analysts separate <em>clusters<\/em> (behaviour, tooling, timing) from <em>attribution<\/em> (organisational identity) and never let shared infrastructure collapse the distinction — especially for a technique whose whole point is acquiring tradable accounts."},{"id":"X11","type":"term","persp":"def","scenario":"Court-prep phase. Everything about mailbox <code>e.duval<\/code> for September must be exported as a single evidence archive for the insurer’s forensic reviewer.","question":"Run the export.","shell":{"promptStr":"examiner@soc-lab:~/cases/duval$","banner":"Forensic console (simulated) — evidence phase. Type <span class='tok-dim'>help<\/span>.","helpText":"Tools:\n  export-mail   export a mailbox range to an archive (--help for usage)\n  search-ual    query the Unified Audit Log\n  ls            list files\n  help          this text","tools":[{"re":"export-mail\\s*--help","out":"usage: export-mail --user <upn> --from <YYYY-MM-DD> --to <YYYY-MM-DD> --out <path>.pst\nExports the mailbox range as a forensically labelled archive."},{"re":"export-mail","out":"Export started: user=e.duval range=2026-09-01..2026-09-30 → /evidence/duval-2026-09.pst\nExported 4,182 items (2.1 GB)  sha256=9f2c11…a7  status=COMPLETE"},{"re":"search-ual\\s*--help","out":"usage: search-ual --user <upn> [--days N] [--ops OP1,OP2]"},{"re":"search-ual","out":"== UAL export: user=e.duval  days=7  ops=New-InboxRule,MailItemsAccessed ==\n2026-09-14T03:02Z New-InboxRule      actor=e.duval rule='RSS Feeds'\n2026-09-14T03:07Z MailItemsAccessed  actor=e.duval src=asn20473-newholland.example count=38"},{"re":"^ls","out":"ual-readonly.mount  notes.txt"}]},"elements":[{"re":"export-mail","label":"Uses export-mail (the evidence export tool)","note":"Export preserves; purge destroys."},{"re":"--user\\s+e\\.duval","label":"Targets the subject mailbox (e.duval)","note":"Court scope: one mailbox, one case."},{"re":"--from\\s+2026-09-01","label":"Window start 2026-09-01","note":"Covers the month of the incident."},{"re":"--to\\s+2026-09-30","label":"Window end 2026-09-30","note":"Closes the month."},{"re":"--out\\s+\\S*\\.pst","label":"Writes an archive to /evidence (.pst)","note":"The deliverable the reviewer opens."}],"nearMiss":[{"re":"purge-mail|remove-mailbox|hard-delete|wipe-mailbox|shred|rm\\s+-rf\\s+/evidence","label":"mailbox purge / evidence destruction","why":"That command deletes mailbox items instead of exporting them — the evidence the insurer’s reviewer needs would be gone, and the action itself would be indefensible. DANGEROUS near miss: export, never purge."}],"canonical":"export-mail --user e.duval --from 2026-09-01 --to 2026-09-30 --out /evidence/duval-2026-09.pst","dangerousExample":"purge-mail --user e.duval","expected":"Expected result: a complete, hash-labelled archive of the month — the artefact chain-of-custody hangs on.","clarification":"Forensic console — run <code>export-mail --help<\/code> for usage. The grader checks the <strong>last<\/strong> command. Ask before submitting: would this command survive cross-examination?","hint":"Four flags: subject, from, to, out. The dates bracket the incident month.","explain":"<code>export-mail --user e.duval --from 2026-09-01 --to 2026-09-30 --out /evidence/duval-2026-09.pst<\/code> produces the hash-labelled archive a third-party reviewer can verify. Every element (subject, bounds, destination) is part of the defensibility story — which is why the grader scores them separately."},{"id":"X12","type":"multi","persp":"def","scenario":"Architecture review: reduce T1586.002 risk for the whole company <em>without breaking mail flow or the helpdesk<\/em>. Keep only measures that pass that test.","question":"Select <strong>all<\/strong> measures that reduce risk without breaking operations.","options":["Phishing-resistant MFA (FIDO2 keys) for executives and finance","Conditional access that requires compliant devices for mail access","Number matching and extra context in MFA approval prompts","Mailbox auditing plus alerts on new rules and external forwarding","Disabling all external email permanently","Rotating every password company-wide every week","Allowing less-secure mail apps to make life easier"],"correct":[0,1,2,3],"notes":["Yes — hardware keys cannot be proxied or fatigue-tapped; targeted at the highest-risk roles first.","Yes — a stolen password plus a stolen cookie still fails on an unknown device.","Yes — directly kills the push-bombing (T1621) path while keeping usability.","Yes — detection for the persistence/collection phase; cost is alert tuning, not outages.","No — the business dies with it; this fails the ‘without breaking mail flow’ test by definition.","No — weekly rotation is an NIST-discouraged burden that nudges users to write passwords down; it does not address session theft at all.","No — legacy/less-secure auth is how takeover gets <em>easier<\/em>; this raises risk."],"hint":"Four measures make the attacker’s job harder while users keep working; three options either break the business or help the attacker.","explain":"The survivable bundle: phishing-resistant MFA where risk concentrates, device-trust conditional access, number matching, and rule/forwarding auditing. M1056 Pre-compromise admits prevention is imperfect — so the design goal is <em>layered friction<\/em>: make the takeover rare (MFA, devices) and its use visible (auditing), while operations continue."},{"id":"X13","type":"order","persp":"def","scenario":"Active BEC on a finance mailbox: attacker possibly online right now. Order the response into the sequence you would run it.","question":"Put the five response steps in order.","items":["Revoke all sessions and reset credentials in one containment action","Remove hidden inbox rules, external forwarding and rogue OAuth grants","Hunt for lures already sent from the mailbox and warn internal recipients","Out-of-band verify recent payment requests with finance and affected vendors","Export mailbox audit and UAL evidence for the incident record"],"itemNotes":["First: stop the live access — sessions+credentials together, because cookies survive a password-only reset.","Second: remove the persistence you know about before it re-collects.","Third: bound the blast radius — anyone who received a lure must know before they act on it.","Fourth: protect the money path while the trail is fresh.","Fifth: with the fire out, preserve the record properly — evidence benefits from calm hands."],"hint":"Live access first, persistence second, blast radius third, money fourth, paperwork fifth.","explain":"Sequence logic: cut access → cut persistence → bound the blast → protect payments → preserve evidence. Each step blocks what the previous one reveals: revocation stops collection, rule removal stops re-collection, hunting warns recipients, verification stops the transfer, and the export closes the loop for review and insurance."},{"id":"X14","type":"qcm","persp":"def","scenario":"Coverage-honesty question. Your alerting covers <code>New-InboxRule<\/code> fully, but <code>MailItemsAccessed<\/code> is sampled and batched by the platform, and delivery to your SIEM can lag.","question":"Why might a real attacker reading the mailbox still not trigger any alert?","options":["Audit events can be sampled, batched and delayed — absence of an alert is not proof of absence of access","The audit system only records administrator actions","MFA prevents read events from being logged","Mailbox auditing covers only desktop Outlook clients"],"correct":0,"notes":["Right: platform sampling/batching and SIEM lag create blind windows. Mature programs state coverage limits explicitly and compensate (reading-volume anomalies, honeypots, user reporting).","Audit scopes cover user mailbox operations too — that is exactly what MailItemsAccessed is.","MFA has no effect on whether reads are logged.","Auditing is per-mailbox, not per-client; client type is a field, not a limit."],"hint":"The premise already names the mechanism: sampled and batched. What does that do to your coverage claim?","explain":"Coverage honesty: some platforms sample high-volume audit streams (MailItemsAccessed is a known example) and batch delivery. Therefore “no alert” means “no alert yet/at this sampling”, not “no access”. Senior programs document this in the monitoring strategy and layer compensating signals — volume baselines, decoy mailboxes, and easy user reporting."},{"id":"X15","type":"qcm","persp":"att","scenario":"Adversary-perspective question. An overeager responder proposes: “Just wipe the CFO’s mailbox — that removes the attacker for sure.” As the adversary, this proposal is…","question":"Why would the attacker <em>welcome<\/em> the wipe?","options":["It destroys evidence and business data while leaving stolen tokens, grants or sibling access unverified — the attacker keeps the upside","The wipe restores the attacker’s password to a known default","The wipe frees mailbox quota for the attacker’s next campaign","Providers require a wipe before any attacker can return"],"correct":0,"notes":["Right: the wipe is the attacker’s preferred ‘response’ — it burns the crime scene, costs the victim data, and does nothing about root cause (stolen credentials, live tokens, unrevoked grants).","Wipes do not change passwords.","Quota is irrelevant to the attacker’s position.","No such requirement exists — and if root cause is unaddressed, returning is trivial."],"hint":"Ask what the wipe destroys (and for whom), and what it leaves untouched.","explain":"Destructive “decisiveness” is the attacker’s ally: it erases evidence, destroys business value, and typically fails to revoke the actual access (tokens, OAuth grants, sibling credentials). This is why response doctrine ranks containment-with-preservation above destruction — and why “wipe it” is the answer you argue against in every post-incident review."}];
var INTRO = {"objectType":"MITRE ATT&CK sub-technique","subtitle":"EXTREMELY HARD exam · contradictory evidence, cost-of-action trade-offs and forensic discipline","learn":"\n<p>This is the senior tier for <strong>T1586.002 (Compromise Accounts: Email Accounts)<\/strong>, the\nsub-technique of <strong>Compromise Accounts (T1586)<\/strong> under <strong>Resource Development\n(TA0042)<\/strong>. Every exercise behaves like real casework: evidence conflicts, every action costs\nsomething, and the wrong “decisive” move can be worse than patience.<\/p>\n<ul>\n<li><strong>Contradictory signals:<\/strong> plausible explanations that almost fit — and the one detail that does not.<\/li>\n<li><strong>Least-aggressive action:<\/strong> contain without burning evidence, business flow, or partner trust.<\/li>\n<li><strong>Cost-of-action reasoning:<\/strong> proportionality across one mailbox, an executive team, or 200 partner mailboxes.<\/li>\n<li><strong>Attribution humility:<\/strong> shared broker infrastructure means your lure domain is not a fingerprint.<\/li>\n<li><strong>Coverage honesty:<\/strong> audit sampling and batching mean no alert does not mean no access.<\/li>\n<li><strong>Terminal forensics:<\/strong> two simulated-shell exercises — audit-log querying and evidence export. Destructive commands are graded as dangerous near misses.<\/li>\n<\/ul>\n","keywords":["T1586.002","Contradictory signals","Least-aggressive response","Cost of action","Evidence preservation","Chain of custody","Attribution caution","Access brokers","Audit sampling (MailItemsAccessed)","Conditional access","MFA Request Generation (T1621)","Web Session Cookie (T1550.004)","Email Forwarding Rule (T1114.003)","search-ual / export-mail discipline"],"how":"<div class=\"how-row\"><span class=\"how-ic\">◎<\/span><span><strong>Goal.<\/strong> There are __NCOUNT__ exercises. You need at least <strong>70%<\/strong> to pass. Partial credit is possible: if an exercise has several correct parts, you get the fraction you earned, computed as (hits − wrong) ÷ correct parts, never below 0. A fully right answer gives 1.00.<\/span><\/div><div class=\"how-row\"><span class=\"how-ic\">⚙<\/span><span><strong>Exercise types in this exam:<\/strong> <strong>Decision path.<\/strong> You walk through scenario steps. Intermediate choices are not scored — only the final choice is, after you press Check. <strong>Sorting cards.<\/strong> You drag cards into zones (or click a card, then click a zone). Each card in the right zone counts. <strong>Fill in the blanks.<\/strong> You type short answers. Spelling has small freedom (for example letter case does not matter), and each blank counts. <strong>Multiple choice (several answers).<\/strong> You pick every option that applies. If you get some but not all, you keep part of the credit. Picking a wrong option loses credit. <strong>Ordering.<\/strong> You put steps in the right order by dragging rows or using the ▲ / ▼ buttons. Each step in the right place counts. <strong>Multiple choice (one answer).<\/strong> You pick one option. A right answer gives full credit, a wrong answer gives 0. <strong>Simulated terminal.<\/strong> You type commands in a fake shell. A grader checks the last command you ran. Dangerous commands are flagged as near misses.<\/span><\/div><div class=\"how-row\"><span class=\"how-ic\">⏱<\/span><span><strong>The clock.<\/strong> The timer budget is <strong>__BUDGET__<\/strong> for the whole exam (estimated time 55 min). When you press <em>Check<\/em>, the clock <strong>auto-pauses<\/strong> (the header shows “⏸ Auto-paused”) while you read the feedback; pressing <em>Next<\/em> starts it again. The <em>Pause<\/em> button stops the clock by hand (the header shows “⏸ Paused”) and hides the exercise; <em>Resume<\/em> brings it back exactly as it was. <em>Hint<\/em> and <em>Skip<\/em> do <strong>not<\/strong> stop the clock.<\/span><\/div><div class=\"how-row\"><span class=\"how-ic\">△<\/span><span><strong>Hints.<\/strong> Each exercise has one hint. A hint costs <strong>0.10<\/strong> of that exercise’s credit (the credit never goes below 0). The second hint never appears — one hint per exercise.<\/span><\/div><div class=\"how-row\"><span class=\"how-ic\">⚠<\/span><span><strong>Skipping.<\/strong> <em>Skip<\/em> moves an exercise to a review list without scoring it. After the last exercise you get the <em>Review skipped exercises<\/em> screen, where you can answer them. A skipped exercise only counts when you answer it; if you never answer it, it is excluded from both your score and the total. The clock keeps running during the review until you press <em>Finish exam<\/em>.<\/span><\/div><div class=\"how-row\"><span class=\"how-ic\">✓<\/span><span><strong>Results.<\/strong> At the end you see fully correct, partially correct (with your average partial credit), fully incorrect, and skipped-and-never-answered counts, plus the time spent paused. Your final score is sent once to the training website.<\/span><\/div><div class=\"how-row\"><span class=\"how-ic\">↻<\/span><span><strong>Retake.<\/strong> You can retake the exam at any time from the results screen. A retake starts fresh: empty score, full clock, empty skip list.<\/span><\/div>","title":"T1586.002 · Compromise Accounts: Email Accounts"};
var BUDGET = META.estimatedMinutes * 60;

/* ===== helpers ===== */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hashStr(s){ var h=2166136261; s=String(s); for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; var t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function shuffled(n, seed){ var r=mulberry32(hashStr(seed)); var a=[]; for(var i=0;i<n;i++)a.push(i);
  for(var j=n-1;j>0;j--){ var k=Math.floor(r()*(j+1)); var t=a[j];a[j]=a[k];a[k]=t; } return a; }
function norm(s){ return String(s==null?'':s).toLowerCase().replace(/^[\s.,;:!?"'`()\[\]]+|[\s.,;:!?"'`()\[\]]+$/g,'').replace(/\s+/g,' ').trim(); }
function fmt(sec){ sec=Math.max(0,sec); var m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function fmtDur(sec){ sec=Math.round(sec); var m=Math.floor(sec/60), s=sec%60; return m+' min '+(s<10?'0':'')+s+' s'; }
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  skipped:[],            /* exercise indexes skipped & never answered */

  posted:false, finished:false, timeExpired:false, handshake:false,
  wallStart:0, wallEnd:0, score:0
};
var T = { state:'RUNNING', remaining:BUDGET, tick:null, enterTs:0,
  accum:{'PAUSED_MANUAL':0,'PAUSED_AUTO_CHECK':0}, counts:{'PAUSED_MANUAL':0,'PAUSED_AUTO_CHECK':0} };
var UI = {};

/* ===== timer state machine ===== */
function setTState(ns){
  if(T.state===ns) return;
  var now=Date.now();
  if((T.state==='PAUSED_MANUAL'||T.state==='PAUSED_AUTO_CHECK') && T.enterTs){
    T.accum[T.state]+=(now-T.enterTs)/1000;
  }
  if(ns==='PAUSED_MANUAL'||ns==='PAUSED_AUTO_CHECK'){ T.enterTs=now; T.counts[ns]++; }
  var was=T.state; T.state=ns;
  if(ns==='RUNNING'){ startTick(); } else { stopTick(); }
  if(was==='PAUSED_MANUAL'||ns==='PAUSED_MANUAL'||was==='PAUSED_AUTO_CHECK'||ns==='PAUSED_AUTO_CHECK'||ns==='ENDED'){ renderTimer(); }
}
function startTick(){ if(T.tick||T.state!=='RUNNING') return; T.tick=setInterval(onTick,1000); }
function stopTick(){ if(T.tick){ clearInterval(T.tick); T.tick=null; } }
function onTick(){
  if(T.state!=='RUNNING') return;          /* no tick while any pause is active */
  T.remaining--; renderTimer();
  if(T.remaining<=0){ T.remaining=0; timeUp(); }
}
function renderTimer(){
  var t=$('tb-timer'), st=$('tb-state');
  if(!t) return;
  t.textContent='\u23F1 '+fmt(T.remaining);
  t.setAttribute('aria-label','Timer '+fmt(T.remaining));
  var m={'RUNNING':['\u25B6 Running','chip chip-state-running','Timer running'],
         'PAUSED_MANUAL':['\u23F8 Paused','chip chip-state-paused','Timer paused manually'],
         'PAUSED_AUTO_CHECK':['\u23F8 Auto-paused (checking)','chip chip-state-auto','Timer auto-paused while checking'],
         'ENDED':['\u25A0 Ended','chip chip-state-ended','Timer ended']};
  var c=m[T.state]; st.textContent=c[0]; st.className=c[1]; st.setAttribute('aria-label',c[2]);
  var pb=$('tb-pause');
  if(pb){ pb.disabled=(S.view!=='exam'&&S.view!=='review-ex')||T.state==='ENDED';
    pb.innerHTML=(T.state==='PAUSED_MANUAL')?'\u25B6 Resume':'\u23F8 Pause'; }
  var sk=$('tb-skip'), hi=$('tb-hint');
  var inEx=(S.view==='exam'||S.view==='review-ex');
  if(sk) sk.disabled=!inEx||S.checked||S.reviewMode;
  if(hi) hi.disabled=!inEx||S.checked||!!S.hintUsed[S.idx];
}

/* ===== scoring ===== */
function rawToCredit(raw, idx){
  var c=raw - (S.hintUsed[idx]?0.10:0);
  return Math.max(0, Math.min(1, c));
}
function clampRaw(h,w,n){ return Math.max(0, Math.min(1, (h-w)/n)); }
function labelFor(h,w,n){
  var raw=clampRaw(h,w,n);
  if(h===n&&w===0) return 'correct';
  return raw>0?'partial':'incorrect';   /* zero credit is never labelled partial */
}
function setStatus(idx, label, credit, g){
  S.answers[idx]={status:label, credit:credit, answered:true, g:g};
  S.score=(S.score||0)+credit;
  S.skipped=S.skipped.filter(function(x){return x!==idx;});  /* answered: leaves the skipped list */
}

function blockHTML(cls, tag, body, icon, extra){

       + '<div class="blk-body">'+body+'</div></section>';
}

function answerHTML(ex){

    case 'qcm':

          +'<span class="opt-letter">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span></label>';
      }).join('')+'</div>';
    case 'multi':
      return '<div class="sel-count">Select all answers that apply. Partial credit is possible.</div>'
        + ex.options.map(function(o,i){
        return '<label class="opt" data-opt="'+i+'"><input type="checkbox" name="ans-'+ex.id+'" value="'+i+'" aria-label="Option '+String.fromCharCode(65+i)+'">'
          +'<span class="opt-letter">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span></label>';
      }).join('')+'</div>';
    case 'match':
      UI.picks=ex.left.map(function(){return null;});
      var ro=shuffled(ex.right.length, ex.id+'-right');
      return ex.left.map(function(l,i){

        return '<div class="match-row"><div>'+l+'</div><select data-match="'+i+'" aria-label="Match for item '+esc(l)+'">'+opts+'</select></div>';
      }).join('');
    case 'order':

      return '<div class="dnd-hint">Put the steps in the right order. Drag a row, or use the \u25B2 / \u25BC buttons.</div><div id="order-list">'
        + UI.arr.map(function(itemIdx,pos){ return orderRowHTML(ex,itemIdx,pos); }).join('')+'</div>';
    case 'dnd':
      UI.place=ex.bank.map(function(){return null;});
      return '<div class="dnd-hint">Drag each card into a zone, or click a card and then click a zone. Click a placed card to send it back.</div>'
        +'<div class="dnd-grid"><div class="dnd-bankcol"><p class="zone-h"><span class="zi">\u25A0</span> Cards to sort</p><div id="dnd-bank" ondragover="return false"></div></div>'
        + ex.zones.map(function(z,zi){ return '<div class="zone" data-zone="'+zi+'"><p class="zone-h"><span class="zi">\u25AC</span> '+esc(z)+'</p><div class="zone-items" data-zone-items="'+zi+'"></div></div>'; }).join('')
        +'</div>';
    case 'fill':
      var parts='';
      for(var k=0;k<ex.segments.length;k++){
        if(k>0){ var bi=(k-1)/1;
          parts+='<input class="fill-input" type="text" data-fill="'+(k-1)+'" aria-label="Blank '+(k)+'" autocomplete="off" spellcheck="false">';
        }

        +'<div class="term mono"><div class="term-out" id="term-out">'+ex.shell.banner+'</div>'

function displayOrder(ex){
  var n=ex.items.length, ord=shuffled(n, ex.id+'-ord'), tries=0;
  while(isCorrectOrder(ord)&&tries<9){ ord=shuffled(n, ex.id+'-ord-'+(++tries)); }
  return ord;
}
function isCorrectOrder(arr){ for(var i=0;i<arr.length;i++){ if(arr[i]!==i) return false; } return true; }
function orderRowHTML(ex,itemIdx,pos){
  return '<div class="order-row" draggable="true" data-pos="'+pos+'" data-item="'+itemIdx+'">'
    +'<span class="order-idx">'+(pos+1)+'</span><span class="grow">'+ex.items[itemIdx]+'</span>'
    +'<button class="mini-btn" data-up="'+pos+'" aria-label="Move up">\u25B2</button>'
    +'<button class="mini-btn" data-down="'+pos+'" aria-label="Move down">\u25BC</button></div>';
}
function rerenderOrder(ex){
  var list=$('order-list'); if(!list) return;
  list.innerHTML=UI.arr.map(function(itemIdx,pos){ return orderRowHTML(ex,itemIdx,pos); }).join('');
  wireOrder(ex);
}
function wireOrder(ex){
  var list=$('order-list'); if(!list) return;
  list.querySelectorAll('[data-up]').forEach(function(b){
    b.addEventListener('click',function(){ var p=+b.getAttribute('data-up');
      if(p>0){ var t=UI.arr[p-1];UI.arr[p-1]=UI.arr[p];UI.arr[p]=t; rerenderOrder(ex);} });
  });
  list.querySelectorAll('[data-down]').forEach(function(b){
    b.addEventListener('click',function(){ var p=+b.getAttribute('data-down');
      if(p<UI.arr.length-1){ var t=UI.arr[p+1];UI.arr[p+1]=UI.arr[p];UI.arr[p]=t; rerenderOrder(ex);} });
  });
  var dragPos=null;
  list.querySelectorAll('.order-row').forEach(function(row){
    row.addEventListener('dragstart',function(){ dragPos=+row.getAttribute('data-pos'); row.classList.add('dragging'); });
    row.addEventListener('dragend',function(){ row.classList.remove('dragging'); dragPos=null; });
    row.addEventListener('dragover',function(e){ e.preventDefault(); });
    row.addEventListener('drop',function(e){ e.preventDefault();
      if(dragPos===null) return; var to=+row.getAttribute('data-pos');
      var it=UI.arr.splice(dragPos,1)[0]; UI.arr.splice(to,0,it); rerenderOrder(ex); });
  });
}

function wireAnswer(ex){
  if(ex.type==='qcm'||ex.type==='multi'){
    $('view-exam').querySelectorAll('.opt').forEach(function(lb){
      var inp=lb.querySelector('input');
      inp.addEventListener('change',function(){
        if(ex.type==='qcm'){ UI.sel=+inp.value;
          $('view-exam').querySelectorAll('.opt').forEach(function(o){ o.classList.remove('sel'); });
          lb.classList.add('sel');
        } else {
          if(inp.checked){ UI.set[inp.value]=1; lb.classList.add('sel'); }
          else { delete UI.set[inp.value]; lb.classList.remove('sel'); }
        }
      });
    });
  } else if(ex.type==='match'){
    $('view-exam').querySelectorAll('[data-match]').forEach(function(s){

function runTerm(ex, cmd){
  var out=$('term-out'); if(!out) return;
  var p=ex.shell.promptStr;
  if(cmd.trim()===''){ out.textContent+='\n'+p+' (type a command)'; out.scrollTop=out.scrollHeight; return; }
  var res=simShell(ex, cmd.trim());
  UI.last=cmd.trim();
  out.textContent+='\n'+p+' '+cmd.trim()+'\n'+res;
  out.scrollTop=out.scrollHeight;
}
function simShell(ex, cmdline){
  if(/^clear$/i.test(cmdline)){ $('term-out').textContent=''; return ''; }
  if(/^help$/i.test(cmdline)){ return ex.shell.helpText; }
  var stages=cmdline.split('|').map(function(s){return s.trim();});
  var res=simOne(ex, stages[0]);
  for(var i=1;i<stages.length;i++){
    var m=stages[i].match(/^grep\s+(?:-c\s+)?["']?(\S+?)["']?$/i);
    if(!m){ return 'grep: unsupported usage in this simulated shell'; }
    var pat=m[1]; var lines=res.split('\n');
    if(/grep\s+-c/i.test(stages[i])){ return String(lines.filter(function(l){return l.indexOf(pat)>=0;}).length); }
    res=lines.filter(function(l){return l.indexOf(pat)>=0;}).join('\n');
  }
  return res;
}
function simOne(ex, cmd){
  var tools=ex.shell.tools;
  for(var i=0;i<tools.length;i++){
    if(new RegExp(tools[i].re,'i').test(cmd)) return tools[i].out;
  }
  var name=cmd.split(/\s+/)[0];
  return 'bash: '+name+': command not found (simulated shell \u2014 type help)';
}

/* ---------- grading ---------- */
function grade(ex){
  switch(ex.type){
    case 'qcm': {
      if(UI.sel===null) { $('fb-slot').innerHTML='<div class="fb fb-part" role="status">Choose an answer first.</div>'; return null; }
      var ok=UI.sel===ex.correct;
      return {label: ok?'correct':'incorrect', raw: ok?1:0, items:null, chosen:UI.sel};
    }
    case 'multi': {
      var sel=Object.keys(UI.set).map(Number);
      var H=0,W=0,N=ex.correct.length;
      var items=ex.options.map(function(o,i){
        var inc=sel.indexOf(i)>=0, isc=ex.correct.indexOf(i)>=0;
        if(isc&&inc){H++; return {st:'c',i:i};}
        if(!isc&&inc){W++; return {st:'w',i:i};}
        if(isc&&!inc){ return {st:'m',i:i};}
        return {st:'x',i:i};
      });
      return {label:labelFor(H,W,N), raw:clampRaw(H,W,N), items:items};
    }
    case 'match': {
      var H=0,W=0,N=ex.pairs.length;
      var items=ex.left.map(function(l,i){
        if(UI.picks[i]===null) return {st:'m',i:i};
        if(UI.picks[i]===ex.pairs[i]){H++; return {st:'c',i:i};}
        W++; return {st:'w',i:i};
      });
      return {label:labelFor(H,W,N), raw:clampRaw(H,W,N), items:items};
    }
    case 'order': {
      var H=0,W=0,N=ex.items.length;
      var items=UI.arr.map(function(itemIdx,pos){
        if(itemIdx===pos){H++; return {st:'c',i:pos};}
        W++; return {st:'w',i:pos};
      });
      return {label:labelFor(H,W,N), raw:clampRaw(H,W,N), items:items};
    }
    case 'dnd': {
      var H=0,W=0,N=ex.bank.length;
      var items=ex.bank.map(function(b,i){
        var z=UI.place[i];
        if(z===null||z===undefined) return {st:'m',i:i};
        if(z===ex.zoneOf[i]){H++; return {st:'c',i:i};}
        W++; return {st:'w',i:i};
      });
      return {label:labelFor(H,W,N), raw:clampRaw(H,W,N), items:items};
    }
    case 'fill': {
      var H=0,W=0,N=ex.blanks.length;
      var inputs=$('view-exam').querySelectorAll('[data-fill]');
      var items=[];
      inputs.forEach(function(inp,i){
        var v=norm(inp.value);
        if(v===''){ items.push({st:'m',i:i}); return; }
        var ok=ex.blanks[i].accept.indexOf(v)>=0;
        if(ok){H++; items.push({st:'c',i:i});} else {W++; items.push({st:'w',i:i});}
      });
      return {label:labelFor(H,W,N), raw:clampRaw(H,W,N), items:items};
    }
    case 'branch': {
      var f=ex.steps[ex.steps.length-1];
      if(f.multi){
        var sel=Object.keys(UI.set).map(Number);
        var H=0,W=0,N=f.correct.length;
        var items=f.options.map(function(o,i){
          var inc=sel.indexOf(i)>=0, isc=f.correct.indexOf(i)>=0;
          if(isc&&inc){H++; return {st:'c',i:i};}
          if(!isc&&inc){W++; return {st:'w',i:i};}
          if(isc&&!inc){ return {st:'m',i:i};}
          return {st:'x',i:i};
        });
        return {label:labelFor(H,W,N), raw:clampRaw(H,W,N), items:items};
      } else {
        if(UI.sel===null){ $('fb-slot').innerHTML='<div class="fb fb-part" role="status">Choose a final answer first.</div>'; return null; }
        var ok=UI.sel===f.correct;
        return {label: ok?'correct':'incorrect', raw: ok?1:0, items:null, chosen:UI.sel};
      }
    }
    case 'term': {
      var cmd=UI.last;
      if(!cmd){ return null; }
      var nm=null;
      for(var i=0;i<ex.nearMiss.length;i++){
        if(new RegExp(ex.nearMiss[i].re,'i').test(cmd)){ nm=ex.nearMiss[i]; break; }
      }
      if(nm){
        return {label:'danger', raw:0, items:null, nearMiss:nm, cmd:cmd};
      }
      var H=0,N=ex.elements.length; var items=[];
      for(var j=0;j<N;j++){
        var hit=new RegExp(ex.elements[j].re,'i').test(cmd);
        if(hit){H++; items.push({st:'c',i:j});} else {items.push({st:'m',i:j});}
      }
      var label=(H===N)?'correct':(H>0?'partial':'incorrect');
      return {label:label, raw:clampRaw(H,0,N), items:items, cmd:cmd};
    }
  }
  return null;
}

/* ---------- feedback ---------- */
var FB_WORD={correct:['\u2713 Correct','fb-good'], partial:['\u2713 Partially correct','fb-part'],
  incorrect:['\u2717 Incorrect','fb-bad'], danger:['\u26A0 DANGEROUS \u2014 NEAR MISS','fb-danger']};
var ITEM_MARK={c:['\u2713 Correct','it-c'], w:['\u2717 Wrong','it-w'], m:['\u25CB Missed','it-m']};

function itemText(ex, g, it){
  var i=it.i;
  switch(ex.type){
    case 'multi': return {label:ex.options[i], note:ex.notes[i]};
    case 'branch': return {label:ex.steps[ex.steps.length-1].options[i], note:ex.steps[ex.steps.length-1].notes[i]};
    case 'match': return {label:'\u201C'+ex.left[i]+'\u201D', note:ex.pairNotes[i]};
    case 'order': return {label:'Position '+(i+1)+': '+ex.items[i], note:ex.itemNotes[i]};
    case 'dnd': return {label:ex.bank[i], note:ex.itemNotes[i]};
    case 'fill': return {label:'Blank '+(i+1), note:ex.blanks[i].note};
    case 'term': return {label:ex.elements[i].label, note:ex.elements[i].note};
  }
  return {label:'',note:''};
}
function renderFeedback(idx){
  var ex=EX[idx], a=S.answers[idx];
  var g=a.g; /* the grade captured at Check time (stable across re-opens) */
  var credit=a.credit;
  var fb=FB_WORD[a.status]||FB_WORD.incorrect;

  h+='<div class="fb-credit">Credit: '+credit.toFixed(2)+' / 1.00'+(S.hintUsed[idx]?' (includes \u22120.10 hint penalty)':'')+'</div>';

    h+='<div class="fb-canonical">Canonical command: <span class="tok-cmd">'+esc(ex.canonical)+'</span></div>';
  } else {
    if(g&&g.items&&g.items.length){
      h+='<ul class="fb-items">';
      g.items.forEach(function(it){
        if(it.st==='x') return;
        var mk=ITEM_MARK[it.st]; var t=itemText(ex,g,it);
        var extra=(it.st==='m'&&ex.type==='match')?' \u2192 correct partner: '+esc(ex.right[ex.pairs[it.i]]):'';
        if(it.st==='m'&&ex.type==='order') extra=' \u2192 this position belongs to: '+ex.items[it.i];
        h+='<li class="'+mk[1]+'"><span>'+mk[0]+'</span> '+t.label+extra+(t.note?' \u2014 '+t.note:'')+'</li>';
      });
      h+='</ul>';
    }
    if(a.status==='incorrect'&&ex.type==='qcm'&&g){
      h+='<div class="fb-explain">You chose: '+String.fromCharCode(65+g.chosen)+'. '+ex.notes[g.chosen]+'</div>';
    }
    if(a.status==='incorrect'&&ex.type==='term'&&g){
      h+='<div class="fb-explain"><strong>Your command:</strong> <code>'+esc(g.cmd)+'</code></div>';
    }

      h+='<div class="fb-explain">'+ex.expected+'</div>';

    h+='<div class="fb-explain">'+ex.explain+'</div>';

  h+='</div>';
  var slot=$('fb-slot');

/* ---------- results ---------- */
function roundedReport(sumFloat, answeredCount){
  var scoreR=Math.round(sumFloat*100)/100;
  var percent=answeredCount>0?Math.round(scoreR/answeredCount*100):0;
  return {score:scoreR, percent:percent, passed:percent>=META.passMark};
}

/* ---------- results ---------- */
function collectResults(){
  var fully=0,partly=0,zero=0,skippedNA=0,sum=0,answered=0,partSum=0;
  EX.forEach(function(ex,i){
    var a=S.answers[i];
    if(a&&a.answered){ answered++; sum+=a.credit;
      if(a.credit>=0.999) fully++;
      else if(a.credit>0){ partly++; partSum+=a.credit; }
      else zero++;
    } else { skippedNA++; }
  });
  return {fully:fully,partly:partly,zero:zero,skippedNA:skippedNA,sum:sum,answered:answered,avgPart:partly?partSum/partly:0};
}
function reportScore(sumFloat, answeredCount){
  var r=roundedReport(sumFloat, answeredCount);
  try{
    if(window.parent&&window.parent!==window){
      window.parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,
        score:r.score,total:answeredCount,percent:r.percent,passed:r.passed}, location.origin);
    }
  }catch(e){/* standalone open: posting is a no-op */}
  return r;
}
function finish(){
  if(S.finished) return;
  S.finished=true;
  if(S.wallEnd===0){ S.wallEnd=Date.now(); }
  setTState('ENDED');
  var R=collectResults();
  var posted=roundedReport(R.sum, R.answered);   /* on-screen values == posted values */
  renderResults(R, posted);
  /* the score message is posted exactly once, after the score animation settles */
  setTimeout(function(){ if(!S.posted){ S.posted=true; reportScore(R.sum, R.answered); } }, REDUCED?80:780);
}
function timeUp(){
  if((S.view==='exam'||S.view==='review-ex')&&!S.checked){ S.skipped.push(S.idx); }
  S.timeExpired=true;
  finish();
}
function renderResults(R, posted){
  gotoView('results');
  var word=posted.passed?['\u2713 Passed','pass']:['\u2717 Not passed','fail'];
  var h='<div class="res-banner '+word[1]+'" data-results="1">';
  h+='<div class="res-word"><span>'+word[0].split(' ')[0]+'</span> '+word[0].substring(word[0].indexOf(' ')+1)+'</div>';
  h+='<div class="res-pct" id="res-pct">0%</div>';
  h+='<div class="res-sub">Final score '+posted.score.toFixed(2)+' of '+R.answered+' answered \u00B7 pass mark '+META.passMark+'%'
    +(S.timeExpired?' \u00B7 \u23F1 time ran out: unanswered exercises were skipped':'')+'</div></div>';
  h+='<div class="stat-grid">';
  h+='<div class="stat stat-green"><div class="k"><span>\u2713</span> Fully correct</div><div class="v">'+R.fully+'</div><div class="s">credit 1.00 each</div></div>';
  h+='<div class="stat stat-amber"><div class="k"><span>\u25D0</span> Partially correct</div><div class="v">'+R.partly+'</div><div class="s">average partial credit '+R.avgPart.toFixed(2)+'</div></div>';
  h+='<div class="stat stat-red"><div class="k"><span>\u2717</span> Fully incorrect</div><div class="v">'+R.zero+'</div><div class="s">credit 0.00 each</div></div>';
  h+='<div class="stat"><div class="k"><span>\u26A0</span> Skipped, never answered</div><div class="v">'+R.skippedNA+'</div><div class="s">excluded from score and total</div></div>';
  h+='<div class="stat stat-blue"><div class="k"><span>\u23F8</span> Time paused manually</div><div class="v">'+fmtDur(T.accum.PAUSED_MANUAL)+'</div><div class="s">'+T.counts.PAUSED_MANUAL+' pause'+(T.counts.PAUSED_MANUAL===1?'':'s')+'</div></div>';
  h+='<div class="stat stat-blue"><div class="k"><span>\u23F8</span> Time auto-paused (Check)</div><div class="v">'+fmtDur(T.accum.PAUSED_AUTO_CHECK)+'</div><div class="s">'+T.counts.PAUSED_AUTO_CHECK+' auto-pause'+(T.counts.PAUSED_AUTO_CHECK===1?'':'s')+'</div></div>';
  h+='</div>';
  h+='<div class="card" style="margin-bottom:16px;"><div class="card-body" style="overflow-x:auto;"><table class="res-table"><thead><tr><th>#</th><th>Exercise</th><th>Type</th><th>Result</th><th>Credit</th></tr></thead><tbody>';
  EX.forEach(function(ex,i){
    var a=S.answers[i]; var chip,cls;
    if(a&&a.answered){
      if(a.credit>=0.999){chip='\u2713 Correct';cls='it-c';}
      else if(a.credit>0){chip='\u2713 Partially correct';cls='it-m';}
      else {chip='\u2717 Incorrect';cls='it-w';}
    } else {chip='\u26A0 Skipped';cls='';}
    h+='<tr><td>'+(i+1)+'</td><td class="mono">'+esc(ex.id)+'</td><td>'+ex.type.toUpperCase()+'</td><td class="'+cls+'">'+chip+'</td><td class="mono">'+(a&&a.answered?a.credit.toFixed(2):'\u2014')+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  h+='<div class="action-row"><button class="btn btn-primary" id="btn-retake">\u21BB Retake exam</button></div>';
  $('view-results').innerHTML=h;
  var pctEl=$('res-pct'); var target=posted.percent;
  if(REDUCED){ pctEl.textContent=target+'%'; }
  else{
    var t0=performance.now(), dur=700;
    var step=function(ts){ var p=Math.min(1,(ts-t0)/dur);
      pctEl.textContent=Math.round(target*(0.5-0.5*Math.cos(Math.PI*p)))+'%';
      if(p<1) requestAnimationFrame(step); else pctEl.textContent=target+'%'; };
    requestAnimationFrame(step);
  }
  $('btn-retake').addEventListener('click', retake);
  var banner=document.querySelector('.res-banner'); if(banner&&!REDUCED) banner.classList.add('pulse-ok');
}
function retake(){
  S={view:'intro',idx:0,checked:false,reviewMode:false,reviewFrom:null,answers:{},skipped:[],hintUsed:{},
     posted:false,finished:false,timeExpired:false,handshake:S.handshake,wallStart:0,wallEnd:0,score:0};
  T.remaining=BUDGET; T.state='RUNNING'; T.enterTs=0;
  T.accum={'PAUSED_MANUAL':0,'PAUSED_AUTO_CHECK':0}; T.counts={'PAUSED_MANUAL':0,'PAUSED_AUTO_CHECK':0};
  stopTick(); gotoView('intro');
}

  renderIntro(); show('view-intro');
  $('tb-sev').outerHTML='<span class="badge badge-'+META.difficulty+'" id="tb-sev" data-sev-badge>'+esc(META.severityLabel)+'</span>';

});
/* integration handshake: CYBERPULSE_INIT / CYBERMASTERY_INIT are accepted; the file stays dark-only */
window.addEventListener('message', function(ev){
  var d=ev&&ev.data;
  if(d&&typeof d==='object'&&(d.type==='CYBERPULSE_INIT'||d.type==='CYBERMASTERY_INIT')){
    S.handshake=true; /* theme field intentionally ignored: this file is dark-only */
  }
});

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
