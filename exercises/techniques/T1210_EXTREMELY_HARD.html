WIDGETS['branching']={
  render:function(ex){
    return ansBox(ex,'<div id="br-'+ex.id+'"></div>');
  },
  bind:function(ex,root){
    renderBranchStep(ex,root);
  },
  lock:function(ex,root){root.querySelectorAll('#br-'+ex.id+' button, #br-'+ex.id+' .opt').forEach(function(b){b.disabled=true;});}
};
function renderBranchStep(ex,root){
  var a=ex.steps[ex._step];
  var holder=$('br-'+ex.id);
  var h='';
  h+='<div class="opts">';
  a._disp.forEach(function(o,i){
    h+='<button type="button" class="opt" data-i="'+i+'" aria-pressed="false"><span class="letter">'+String.fromCharCode(65+i)+'.</span><span>'+md(o.text)+'</span><span class="sel-mark"></span></button>';
  });
  h+='</div><div id="br-verdict-'+ex.id+'"></div><div class="step-actions">';
  h+='<button type="button" class="btn btn-amber" id="br-check-'+ex.id+'">'+(ex._step===ex.steps.length-1?'Check — final':'Check step')+'</button>';
  h+='<button type="button" class="btn hidden" id="br-cont-'+ex.id+'">Continue &#8594;</button></div>';
  holder.innerHTML=h;
  holder.querySelectorAll('.opt').forEach(function(btn){
    btn.addEventListener('click',function(){
      if(a._done)return;
      ex.steps[ex._step]._choice=parseInt(btn.getAttribute('data-i'),10);
      holder.querySelectorAll('.opt').forEach(function(b2){b2.classList.remove('selected');b2.setAttribute('aria-pressed','false');b2.querySelector('.sel-mark').textContent='';});
      btn.classList.add('selected');btn.setAttribute('aria-pressed','true');btn.querySelector('.sel-mark').textContent='✓ selected';
    });
  });
  $('br-check-'+ex.id).addEventListener('click',function(){
    if(ex.steps[ex._step]._choice===null)return;
    checkBranchStep(ex,root);
  });
  $('br-cont-'+ex.id).addEventListener('click',function(){
    ex._step++;
    var qb=$('q-block-'+ex.id);
    if(qb)qb.outerHTML=questionBlock(ex).replace('<section class="block bl-question"','<section id="q-block-'+ex.id+'" class="block bl-question"');
    renderBranchStep(ex,root);
    window.scrollTo({top:0,behavior:scrollBehavior()});
  });
}
function checkBranchStep(ex,root){
  var st=ex.steps[ex._step];
  st._done=true;
  var ok=(st._choice===st._corr);
  var v=$('br-verdict-'+ex.id);
  v.innerHTML='<div class="step-verdict" style="border-color:'+(ok?'var(--state-correct)':'var(--state-incorrect)')+'"><span style="font-weight:800;color:'+(ok?'var(--state-correct)':'var(--state-incorrect)')+'">'+(ok?'&#10004; Correct':'&#10007; Incorrect')+'</span><span class="muted small">'+md(st.options[st.correct])+'</span></div>';
  $('br-check-'+ex.id).disabled=true;
  root.querySelectorAll('#br-'+ex.id+' .opt').forEach(function(b){b.disabled=true;});
  if(ex._step<ex.steps.length-1){
    $('br-cont-'+ex.id).classList.remove('hidden');
  }else{
    doCheck(false);
  }
}

}

function renderHeaderTimer(){
  var el=$('hd-timer');if(!el)return;

  if(timer.state===STATE_RUN)txt='&#9654; RUNNING <span class="t">'+fmtClock(timer.remain)+'</span>';
  else if(timer.state===STATE_MAN){txt='&#9208; PAUSED — manual (press Resume) <span class="t">'+fmtClock(timer.remain)+'</span>';cls='st-paused';}
  else if(timer.state===STATE_AUTO){txt='&#9208; PAUSED — reviewing feedback (resumes on Next) <span class="t">'+fmtClock(timer.remain)+'</span>';cls='st-paused';}
  else if(timer.state===STATE_END)txt='&#9632; ENDED <span class="t">'+fmtClock(timer.remain)+'</span>';
  else txt='&#9679; READY <span class="t">'+fmtClock(timer.remain)+'</span>';

    var pct=exam.graded>0?Math.round(exam.creditSum/exam.graded*100):0;
    sc.innerHTML='Score <span class="s">'+fmt1(exam.creditSum)+' / '+exam.graded+'</span> &nbsp;'+pct+'%';
  }

}
function updateSegments(){
  exam.list.forEach(function(ex,i){
    var s=$('seg-'+i);if(!s)return;
    s.className='seg';
    var r=exam.results[i];
    if(r&&r.credit>=1)s.classList.add('ok');
    else if(r&&r.credit>0)s.classList.add('partial');
    else if(r)s.classList.add('bad');
    else if(exam.skipped[i])s.classList.add('skipped');
    else if(i===exam.current)s.classList.add('cur');
  });
}
function renderExercise(i){
  exam.current=i;
  var ex=exam.list[i];
  if(ex.type!=='terminal'){timer.perLimit=0;timer.perRemain=0;}
  var area=$('ex-area');
  var metaRow='<div class="ex-meta-row"><span class="hd-count">Exercise '+(i+1)+' of '+exam.list.length+'</span>'+sevBadge()+'</div>';
  var html=metaRow+scenarioBlock(ex)+'<section class="block bl-question" id="q-block-'+ex.id+'" aria-label="Question">'+questionBlock(ex).replace(/^<section[^>]*>|<\/section>$/g,'')+'</section>';
  html+=WIDGETS[ex.type].render(ex);
  html+='<div class="step-actions" style="margin:16px 0 30px">'+
    '<button type="button" class="btn btn-amber" id="btn-check">&#9989; Check answer</button>'+
    '<button type="button" class="btn btn-primary hidden" id="btn-next">Next &#8594;</button>'+
    '<button type="button" class="btn btn-primary hidden" id="btn-final">Final Submit &#9632;</button>'+
  '</div>'+
  '<div id="fb-slot"></div>';
  area.innerHTML=html;
  var hc=$('hd-count');if(hc)hc.textContent='Exercise '+(i+1)+' of '+exam.list.length;
  $('btn-check').addEventListener('click',function(){
    var a=ex.answer;
    var hasAnswer=false;
    if(ex.type==='qcm-single'||(ex.type==='log-qcm'&&!ex.answer._multi))hasAnswer=a._choice!==null&&a._choice!==undefined;
    else if(ex.type==='qcm-multi'||ex.type==='log-qcm')hasAnswer=ex.answer._sel&&ex.answer._sel.length>0;
    else if(ex.type==='dragdrop')hasAnswer=Object.keys(a._placed).some(function(k){return a._placed[k]!==null&&a._placed[k]!==undefined;});
    else if(ex.type==='order')hasAnswer=true;
    else if(ex.type==='match')hasAnswer=a._pairs.length>0;
    else if(ex.type==='fillblank')hasAnswer=a._filled.some(function(f){return f!==null;});
    else if(ex.type==='terminal')hasAnswer=ex._cmd.trim().length>0;
    else if(ex.type==='branching')hasAnswer=ex.steps.every(function(st){return st._done;});
    if(!hasAnswer)return;
    doCheck(false);
  });
  WIDGETS[ex.type].bind(ex,area);
  var lf=$('lf-'+ex.id);
  if(lf){
    lf.addEventListener('input',function(){
      var q=lf.value.toLowerCase().trim();
      var body=$('lb-'+ex.id);var shown=0;
      body.querySelectorAll('.log-line').forEach(function(l){
        var hit=!q||l.getAttribute('data-lc').indexOf(q)>=0;
        l.style.display=hit?'':'none';
        if(hit)shown++;
      });
      var cnt=$('lc-'+ex.id);if(cnt)cnt.textContent=shown+' / '+exam.list[exam.current].log.lines.length+' lines';
    });
  }
  updateSegments();
  renderHeaderTimer();
  $('btn-hint').disabled=!!hintUsed[ex.id]||!!ex.result;
  $('btn-skip').disabled=false;
  window.scrollTo({top:0,behavior:scrollBehavior()});
}
function showHint(){
  var ex=exam.list[exam.current];
  if(!ex||ex.result||hintUsed[ex.id])return;
  hintUsed[ex.id]=true;
  $('btn-hint').disabled=true;
  var slot=$('fb-slot');
  var d=document.createElement('div');
  d.className='notice';
  d.innerHTML='&#128161; <b>Hint (−10% of this exercise&#39;s credit):</b> '+md(ex.hint||'No hint available for this exercise.');
  slot.appendChild(d);
}
function doManualPause(){
  if(exam.current<0)return;
  if(timer.state===STATE_RUN||timer.state===STATE_AUTO){
    exam.prevState=timer.state;
    setState(STATE_MAN);
    var ov=document.createElement('div');
    ov.className='paused-overlay';ov.id='pause-ov';
    ov.innerHTML='<div class="card paused-card"><div class="big">&#9208;</div><h2 style="margin:6px 0">PAUSED — manual</h2><p class="muted">The exercise is hidden and the timer is stopped. Press Resume to continue where you were.</p><button type="button" class="btn btn-primary" id="btn-resume">&#9654; Resume</button></div>';
    document.body.appendChild(ov);
    $('btn-resume').addEventListener('click',resumeManual);
    $('btn-resume').focus();
  }
}
function resumeManual(){
  var ov=$('pause-ov');if(ov)ov.remove();
  setState(exam.prevState===STATE_AUTO?STATE_AUTO:STATE_RUN);
}function doSkip(){
  var i=exam.current,ex=exam.list[i];
  if(ex.result)return;
  exam.skipped[i]=true;
  var nxt=nextMain(i);
  if(nxt>=0){renderExercise(nxt);}
  else if(Object.keys(exam.skipped).length>0){goReview();}
  else{goResults();}
}
function nextMain(from){
  for(var j=Math.max(0,from+1);j<exam.list.length;j++){
    if(!exam.list[j].result&&!exam.skipped[j])return j;
  }
  return -1;
}
function doCheck(expired){
  var i=exam.current,ex=exam.list[i];
  if(ex.result)return;
  if(ex.type==='terminal'){
    var ti=$('tin-'+ex.id);
    if(ti&&ti.value.trim())ex._cmd=ti.value;
  }
  setState(STATE_AUTO);
  timer.perLimit=0;
  var res=gradeExercise(ex);
  ex.result=res;
  exam.results[i]=res;
  exam.graded++;
  exam.creditSum+=res.credit;
  var fb=feedbackBlock(ex,res);
  $('fb-slot').innerHTML=fb;
  if(WIDGETS[ex.type].lock)WIDGETS[ex.type].lock(ex,document);
  $('btn-check').classList.add('hidden');
  var moreMain=(nextMain(i)>=0);
  var nSkipped=Object.keys(exam.skipped).length;
  var nextBtn=$('btn-next'),finBtn=$('btn-final');
  if(!moreMain&&nSkipped===0){finBtn.classList.remove('hidden');}
  else{
    nextBtn.classList.remove('hidden');
    nextBtn.innerHTML=moreMain?'Next &#8594;':'Review skipped &#9888; &#8594;';
  }
  $('btn-hint').disabled=true;$('btn-skip').disabled=true;
  nextBtn.addEventListener('click',function(){onNext();});
  finBtn.addEventListener('click',function(){goResults();});
  updateSegments();renderHeaderTimer();
  var fbEl=document.querySelector('.bl-feedback');if(fbEl)fbEl.scrollIntoView({behavior:scrollBehavior(),block:'start'});
}
function onNext(){
  var i=exam.current;
  delete exam.skipped[i];
  if(exam.fromReview){exam.fromReview=false;goReview();return;}
  var nxt=nextMain(i);
  if(nxt>=0){setState(STATE_RUN);renderExercise(nxt);}
  else if(Object.keys(exam.skipped).length>0){goReview();}
  else{goResults();}
}

/* ---------- review ---------- */
function goReview(){
  view='review';
  setState(STATE_RUN);
  if(!$('ex-area'))renderExamShell();
  var keys=Object.keys(exam.skipped).map(Number).sort(function(a,b){return a-b;});
  var rows=keys.map(function(i){
    var ex=exam.list[i];
    return '<div class="card review-row"><span class="state-chip st-skipped">&#9888; Skipped</span><span class="q">'+md(ex.question)+'</span><button type="button" class="btn btn-slim btn-amber" data-go="'+i+'">Answer &#8594;</button></div>';
  }).join('');
  var hasMain=(nextMain(-1)>=0);
  var html='<div class="ex-meta-row"><span class="hd-count" style="font-size:18px">Review skipped exercises</span>'+sevBadge()+'</div>'+
    '<p class="muted" style="margin:6px 0 14px">The timer is still running. You can answer as many skipped exercises as you like before you submit. Anything never answered is excluded from the score.</p>';
  if(keys.length){html+='<div class="review-list">'+rows+'</div>';}
  else{html+='<div class="notice">&#10004; No skipped exercises remain — everything has been answered or excluded.</div>';}
  html+='<div class="step-actions" style="margin:18px 0 40px">';
  if(hasMain)html+='<button type="button" class="btn" id="rv-back">&#8592; Back to exam</button>';
  html+='<button type="button" class="btn btn-primary" id="rv-final">Final Submit &#9632;</button></div>';
  $('ex-area').innerHTML=html;
  document.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click',function(){
      exam.fromReview=true;
      setState(STATE_RUN);
      renderExercise(parseInt(b.getAttribute('data-go'),10));
      view='exam';
    });
  });
  var bb=$('rv-back');
  if(bb)bb.addEventListener('click',function(){
    var nxt=nextMain(-1);
    view='exam';
    if(nxt>=0){setState(STATE_RUN);renderExercise(nxt);}else goResults();
  });
  $('rv-final').addEventListener('click',goResults);
  window.scrollTo({top:0,behavior:scrollBehavior()});
}

/* ---------- results ---------- */
function goResults(){
  view='results';
  setState(STATE_END);
  var answered=exam.graded;
  var total=exam.list.length;
  var skippedExcluded=total-answered;
  var creditSum=exam.creditSum;
  var percent=answered>0?Math.round(creditSum/answered*100):0;
  var passed=percent>=PASS_MARK&&answered>0;
  var fully=0,partial=0,incorrect=0,partSum=0;
  exam.results.forEach(function(r){if(!r)return;if(r.credit>=1)fully++;else if(r.credit>0){partial++;partSum+=r.credit;}else incorrect++;});
  var breakdown=
    '<div class="res-break">'+
    '<div class="res-cell" style="border-color:var(--state-correct)"><span class="mk mk-c">&#10004;</span><span><b>'+fully+'</b> &nbsp;Fully correct</span></div>'+
    '<div class="res-cell" style="border-color:var(--state-partial)"><span class="mk" style="color:var(--state-partial)">&#10004;</span><span><b>'+partial+'</b> &nbsp;Partially correct'+(partial>0?' — avg credit '+ (partSum/partial).toFixed(2):'')+'</span></div>'+
    '<div class="res-cell" style="border-color:var(--state-incorrect)"><span class="mk mk-w">&#10007;</span><span><b>'+incorrect+'</b> &nbsp;Fully incorrect</span></div>'+
    '<div class="res-cell"><span class="mk mk-m">&#9888;</span><span><b>'+skippedExcluded+'</b> &nbsp;Skipped — excluded from score</span></div>'+
    '</div>';
  var html='<div class="wrap">'+
    '<div class="card result-hero '+(passed?'pass-panel':'fail-panel')+'">'+
      '<div style="font-size:30px;font-weight:900;margin-bottom:4px;color:'+(passed?'var(--state-correct)':'var(--state-incorrect)')+'">'+(passed?'&#10004; PASS':'&#10007; FAIL')+'</div>'+
      '<div class="result-pct" style="color:'+(passed?'var(--state-correct)':'var(--state-incorrect)')+'">'+percent+'%</div>'+
      '<p class="muted" style="margin-top:8px">Final score: <b style="color:var(--text-primary)">'+fmt1(creditSum)+' / '+answered+'</b> answered · pass mark '+PASS_MARK+'% · '+esc(M.mitreId)+' — '+esc(SEV_WORD[M.difficulty])+'</p>'+
      (passed?'<p style="color:var(--state-correct);font-weight:700">&#127942; Certification-style result achieved. Well done.</p>':'<p style="color:var(--state-incorrect);font-weight:700">You must retake this exam to reach the pass mark.</p>')+
    '</div>'+
    '<div class="card section-body">'+breakdown+
      '<p class="muted small" style="margin-top:14px">&#9208; Time paused manually: '+fmtClock(timer.manualSec)+' · &#9208; Time paused reviewing feedback: '+fmtClock(timer.autoSec)+' · &#9632; Timer ended with '+fmtClock(timer.remain)+' left.</p>'+
    '</div>'+
    '<div class="start-row"><button type="button" class="btn btn-primary start-btn" id="retake-btn">&#8635; Retake Exam</button></div>'+
  '</div>';
  $('app').innerHTML=html;
  $('retake-btn').addEventListener('click',function(){
    view='intro';renderIntro();window.scrollTo({top:0,behavior:scrollBehavior()});
  });
  if(!reported){
    reported=true;
    reportScore(creditSum,answered);
  }
  window.scrollTo({top:0,behavior:scrollBehavior()});
}
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:M.topicId,
      batch:M.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=PASS_MARK
    },location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  learner.name=event.data.username||'';
  learner.country=event.data.country||'';
  learner.locale=event.data.locale||'en';
});

/* ---------- shell ---------- */
window.EXAMUI={
  toggleScenario:function(id){
    var body=$('scn-body-'+id),sum=$('scn-sum-'+id),btn=$('scn-toggle-'+id);
    if(!body)return;
    var hidden=body.classList.toggle('hidden');
    if(sum)sum.style.display=hidden?'block':'none';
    if(btn){btn.textContent=hidden?'Expand':'Collapse';btn.setAttribute('aria-expanded',hidden?'false':'true');}
  }
};
/* Read-only test/diagnostics accessor (used by the site's QA harness; makes no network calls) */
window.CM_DEBUG=function(){
  return {
    view:view,
    timer:{state:timer.state,remain:timer.remain,manualSec:timer.manualSec,autoSec:timer.autoSec,perLimit:timer.perLimit,perRemain:timer.perRemain},
    current:exam.current,graded:exam.graded,creditSum:exam.creditSum,attempt:exam.attempt,
    skipped:Object.keys(exam.skipped).map(Number),
    results:exam.results,
    list:exam.list
  };
};
document.body.style.background='var(--bg-page)';
document.body.style.color='var(--text-primary)';
renderIntro();
})();
</script>
</body>
</html>
