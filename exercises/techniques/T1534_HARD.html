<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>T1534 — HARD practice exam</title>
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<script type="application/json" id="cm-exercise-meta">
{
  "topicId": "t1534",
  "batch": 3,
  "title": "T1534 Internal Spearphishing — HARD",
  "difficulty": "hard",
  "questionCount": 15,
  "estimatedMinutes": 38,
  "passMark": 70
}
</script>
<style>
:root{
  --bg-page:#0b1020;
  --bg-surface:#121a2e;
  --bg-surface-2:#0f1729;
  --border:#243049;
  --border-strong:#33415f;
  --border-faint:#3a4a6e;
  --text-primary:#e6ecff;
  --text-secondary:#a9b4d0;
  --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff;
  --accent-amber:#ffb454;
  --accent-green:#57d38c;
  --accent-green-hover:#6fdda0;
  --accent-amber-hover:#ffc477;
  --state-correct:#57d38c;
  --state-partial:#ffb454;
  --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0;
  --state-paused:#9d7bff;
  --sev-easy:#57d38c;
  --sev-medium:#ffb454;
  --sev-hard:#ff8a3d;
  --sev-extreme:#ff6b6b;
  /* derived tints — every derived colour is defined here, once */
  --bg-inset:#0c1222;
  --bg-option:#0e1628;
  --bg-option-hover:#141d33;
  --bg-option-selected:#102419;
  --bg-btn-hover:#182238;
  --bg-seg:#1a2440;
  --bg-terminal:#080d1a;
  --bg-term-row:#0a1020;
  --bg-header-veil:rgba(11,16,32,.96);
  --overlay:rgba(11,16,32,.97);
  --accent-blue-tint:rgba(90,169,255,.08);
  --accent-blue-tint-soft:rgba(90,169,255,.05);
  --accent-amber-tint:rgba(255,180,84,.08);
  --accent-green-tint:rgba(87,211,140,.08);
  --correct-tint:rgba(87,211,140,.07);
  --incorrect-tint:rgba(255,107,107,.06);
  --correct-glow:rgba(87,211,140,.18);
  --veil-strong:rgba(255,255,255,.14);
  --veil-faint:rgba(255,255,255,.02);
  --shadow-card:0 6px 18px rgba(0,0,0,.35);
  --hl-time:#9fb6e8;
  --on-easy:#08120b;
  --on-medium:#1d1204;
  --on-hard:#190b03;
  --on-extreme:#1d0505;
  --on-green:#08120b;
  --on-amber:#1d1204;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{color-scheme:dark;background:var(--bg-page);}
body{
  background:var(--bg-page);
  color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.55;
  min-height:100vh;
}
.mono,.mono-inline,code,kbd,pre,.log-line,.term-input,.term-line{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;
}
.mono-inline{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:4px;padding:0 5px;color:var(--text-mono);font-size:.92em;}
button{font:inherit;color:inherit;cursor:pointer;}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:6px;}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px;}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-card);}
.muted{color:var(--text-secondary);}
.small{font-size:13.5px;}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;letter-spacing:.4px;border:1px solid transparent;min-height:28px;}
.sev-easy{color:var(--on-easy);background:var(--sev-easy);border-color:var(--sev-easy);}
.sev-medium{color:var(--on-medium);background:var(--sev-medium);border-color:var(--sev-medium);}
.sev-hard{color:var(--on-hard);background:var(--sev-hard);border-color:var(--sev-hard);}
.sev-extreme{color:var(--on-extreme);background:var(--sev-extreme);border-color:var(--sev-extreme);}
.state-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;border:1px solid var(--border);background:var(--bg-surface-2);}
.st-correct{color:var(--state-correct);border-color:var(--state-correct);}
.st-partial{color:var(--state-partial);border-color:var(--state-partial);}
.st-incorrect{color:var(--state-incorrect);border-color:var(--state-incorrect);}
.st-skipped{color:var(--state-skipped);}
.st-paused{color:var(--state-paused);border-color:var(--state-paused);}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-primary);padding:10px 18px;min-height:44px;font-weight:600;transition:background .15s ease,border-color .15s ease,transform .05s ease;}
.btn:hover{background:var(--bg-btn-hover);border-color:var(--border-strong);}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn-primary{background:var(--accent-green);border-color:var(--accent-green);color:var(--on-green);}
.btn-primary:hover{background:var(--accent-green-hover);border-color:var(--accent-green-hover);}
.btn-amber{background:var(--accent-amber);border-color:var(--accent-amber);color:var(--on-amber);}
.btn-amber:hover{background:var(--accent-amber-hover);border-color:var(--accent-amber-hover);}
.btn-ghost{background:transparent;}
.btn-danger{border-color:var(--state-incorrect);color:var(--state-incorrect);background:transparent;}

/* ---------- intro ---------- */
.intro-hero{padding:22px 22px 18px;}
.intro-hero h1{margin:0 0 6px;font-size:24px;line-height:1.25;}
.intro-facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.fact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13.5px;color:var(--text-secondary);}
.fact b{color:var(--text-primary);}
.section-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin:26px 0 10px;color:var(--text-primary);}
.section-title .dot{width:10px;height:10px;border-radius:3px;background:var(--accent-blue);display:inline-block;}
.section-body{padding:18px 20px;}
.section-body p{margin:0 0 12px;}
.theme-panel{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin-bottom:12px;}
.theme-panel h4{margin:0 0 8px;font-size:14px;color:var(--accent-blue);text-transform:uppercase;letter-spacing:.6px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:var(--bg-inset);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--text-primary);}
.rules{margin:0;padding-left:20px;}
.rules li{margin-bottom:9px;}
.type-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px;}
.start-row{display:flex;justify-content:center;padding:6px 0 20px;}
.start-btn{font-size:18px;padding:14px 44px;border-radius:10px;}

/* ---------- sticky header ---------- */
.exam-header{position:sticky;top:0;z-index:50;background:var(--bg-header-veil);border-bottom:1px solid var(--border);backdrop-filter:blur(6px);}
.exam-header-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
.hd-count{font-weight:800;font-size:15px;white-space:nowrap;}
.hd-timer{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:6px 12px;font-weight:700;}
.hd-timer .t{font-variant-numeric:tabular-nums;letter-spacing:1px;}
.hd-score{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:6px 12px;font-weight:700;}
.hd-score .s{color:var(--accent-green);font-variant-numeric:tabular-nums;}
.spacer{flex:1 1 auto;}
.hd-btns{display:flex;gap:8px;flex-wrap:wrap;}
.btn-slim{padding:6px 12px;min-height:44px;font-size:13.5px;}

/* ---------- progress ---------- */
.progress{max-width:980px;margin:0 auto;padding:0 16px 8px;}
.progress-bar{display:flex;gap:3px;height:8px;border-radius:6px;overflow:hidden;background:var(--bg-surface-2);position:relative;}
.seg{flex:1 1 0;background:var(--bg-seg);border-radius:2px;min-width:6px;transition:background .3s ease;}
.seg.ok{background:var(--state-correct);}
.seg.partial{background:var(--state-partial);}
.seg.bad{background:var(--state-incorrect);}
.seg.skipped{background:var(--state-skipped);opacity:.55;}
.seg.cur{background:var(--sev-color,var(--accent-blue));box-shadow:0 0 8px var(--sev-color,var(--accent-blue));}
.progress-bar::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,var(--veil-strong) 50%,transparent 80%);transform:translateX(-100%);animation:sheen 3.2s ease-in-out infinite;pointer-events:none;}
@keyframes sheen{0%{transform:translateX(-100%);}55%{transform:translateX(100%);}100%{transform:translateX(100%);}}

/* ---------- exercise blocks ---------- */
.ex-meta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 4px;}
.block{margin-top:16px;border:1px solid var(--border);border-radius:10px;background:var(--bg-surface);overflow:hidden;}
.block-h{display:flex;align-items:center;gap:10px;padding:9px 14px;font-weight:800;font-size:13.5px;letter-spacing:1.2px;border-bottom:1px solid var(--border);}
.block-h .ic{font-size:15px;}
.bl-scenario .block-h{color:var(--accent-blue);background:var(--accent-blue-tint);}
.bl-question .block-h{color:var(--accent-amber);background:var(--accent-amber-tint);}
.bl-answer .block-h{color:var(--accent-green);background:var(--accent-green-tint);}
.bl-feedback .block-h{background:var(--veil-faint);}
.block-b{padding:14px 16px;}
.block-b p{margin:0 0 10px;}
.collapse-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text-secondary);border-radius:6px;padding:3px 10px;font-size:12px;min-height:36px;}
.summary-line{padding:9px 14px;font-size:13px;color:var(--text-secondary);border-bottom:1px dashed var(--border);}
.artefact{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);margin:10px 0;overflow:hidden;}
.artefact-h{padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--accent-blue);border-bottom:1px solid var(--border);background:var(--accent-blue-tint-soft);}
.artefact .prose{padding:10px 14px;font-size:14.5px;}
.codeblock{margin:0;padding:10px 12px;overflow-x:auto;white-space:pre;}
.log-line{font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--text-mono);}
.hl-t{color:var(--hl-time);}
.hl-ioc{color:var(--accent-amber);}
.hl-bad{color:var(--state-incorrect);font-weight:700;}
.hl-warn{color:var(--state-partial);}
.hl-cmd{color:var(--accent-green);font-weight:700;}
.hl-flag{color:var(--state-paused);}
.hl-str{color:var(--text-mono);}
.hl-path{color:var(--accent-blue);}
.log-toolbar{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg-surface-2);}
.log-filter{flex:1;background:var(--bg-inset);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);padding:7px 10px;font-size:13.5px;min-height:44px;}
.log-count{font-size:12px;color:var(--text-secondary);white-space:nowrap;}
.log-body{max-height:340px;overflow-y:auto;padding:8px 12px;}
.log-body::-webkit-scrollbar{width:10px;}
.log-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
.log-body::-webkit-scrollbar-track{background:var(--bg-surface-2);}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--bg-option);border:1px solid var(--border);border-radius:8px;padding:12px 14px;min-height:48px;color:var(--text-primary);transition:background .12s ease,border-color .12s ease;}
.opt:hover{background:var(--bg-option-hover);}
.opt .letter{font-weight:800;color:var(--text-secondary);flex:0 0 auto;}
.opt.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset,0 0 10px var(--correct-glow);background:var(--bg-option-selected);}
.opt.selected .sel-mark{color:var(--accent-green);}
.opt.disabled{opacity:.75;cursor:default;}
.sel-mark{margin-left:auto;font-size:12px;font-weight:800;color:var(--text-secondary);white-space:nowrap;}

/* ---------- drag & drop ---------- */
.dd-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:720px){.dd-grid{grid-template-columns:1fr 1fr;}}
.bank{border:1px dashed var(--border-strong);border-radius:8px;padding:10px;min-height:56px;display:flex;flex-wrap:wrap;gap:8px;background:var(--bg-inset);}
.dchip{background:var(--bg-option-hover);border:1px solid var(--border-strong);border-radius:8px;padding:8px 12px;font-size:13.5px;min-height:44px;color:var(--text-primary);}
.dchip.grab{cursor:grab;}
.dchip.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.zone{border:1px solid var(--border);border-radius:8px;background:var(--bg-option);padding:10px;min-height:96px;}
.zone.over{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.zone h5{margin:0 0 8px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-secondary);}
.zone-items{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;}
.bank-label{font-size:12.5px;font-weight:700;letter-spacing:.6px;color:var(--text-secondary);margin:0 0 6px;text-transform:uppercase;}

/* ---------- order ---------- */
.ord-list{display:flex;flex-direction:column;gap:8px;}
.ord-row{display:flex;align-items:center;gap:10px;background:var(--bg-option);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
.ord-pos{flex:0 0 30px;text-align:center;font-weight:800;color:var(--text-secondary);}
.ord-text{flex:1;font-size:14.5px;}
.ord-btns{display:flex;gap:4px;}
.ord-btns button{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;width:44px;height:44px;font-size:14px;}
.ord-row.dragging{opacity:.4;}
.ord-row .handle{cursor:grab;color:var(--text-secondary);font-size:15px;}

/* ---------- match ---------- */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:620px){.match-grid{grid-template-columns:1fr;}}
.match-col{display:flex;flex-direction:column;gap:8px;}
.mitem{background:var(--bg-option);border:1px solid var(--border);border-radius:8px;padding:10px 12px;text-align:left;min-height:46px;color:var(--text-primary);}
.mitem.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.mitem.used{opacity:.4;pointer-events:none;}
.pairs-list{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
.pair-row{display:flex;align-items:center;gap:8px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13.5px;}
.pair-row .x{margin-left:auto;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--state-incorrect);width:44px;height:44px;min-width:44px;}

/* ---------- fill blank ---------- */
.fb-sentence{font-size:16px;line-height:2;word-break:break-word;}
.blank-btn{display:inline-block;min-width:90px;min-height:44px;background:var(--bg-inset);border:1px dashed var(--border-faint);border-radius:6px;color:var(--text-mono);padding:2px 10px;text-align:center;}
.blank-btn.filled{border-style:solid;border-color:var(--accent-green);color:var(--accent-green);}
.blank-btn.selected{border-color:var(--accent-amber);box-shadow:0 0 0 1px var(--accent-amber) inset;}

/* ---------- terminal ---------- */
.term{background:var(--bg-terminal);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.term-bar{display:flex;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--border);background:var(--bg-surface-2);font-size:12px;color:var(--text-secondary);}
.term-dot{width:10px;height:10px;border-radius:50%;background:var(--border);display:inline-block;}
.term-scroll{max-height:260px;overflow-y:auto;padding:10px 12px;font-size:13.5px;}
.term-line{white-space:pre-wrap;word-break:break-word;color:var(--text-mono);line-height:1.6;}
.term-prompt{color:var(--accent-green);font-weight:700;}
.term-err{color:var(--state-incorrect);}
.term-ok{color:var(--state-correct);}
.term-input-row{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);padding:9px 12px;background:var(--bg-term-row);}
.term-input{flex:1;background:transparent;border:none;color:var(--text-mono);font-size:14px;min-height:44px;}
.term-input:focus{outline:none;}
.syntax-panel{border:1px solid var(--border);border-left:3px solid var(--accent-blue);border-radius:8px;background:var(--bg-surface-2);padding:10px 14px;margin-top:10px;font-size:13.5px;}
.syntax-panel h6{margin:0 0 6px;color:var(--accent-blue);font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;}

/* ---------- branching ---------- */
.step-badge{display:inline-flex;align-items:center;gap:8px;background:var(--bg-surface-2);border:1px solid var(--border);color:var(--accent-amber);border-radius:999px;padding:3px 12px;font-weight:800;font-size:12.5px;letter-spacing:.8px;margin-bottom:10px;}
.step-verdict{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);font-size:14px;}
.step-actions{display:flex;gap:10px;margin-top:12px;}

/* ---------- feedback ---------- */
.fb-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;}
.fb-title{font-size:16px;font-weight:800;}
.fb-credit{font-size:14px;font-weight:700;color:var(--state-partial);}
.item-rows{margin:12px 0;display:flex;flex-direction:column;gap:6px;}
.item-row{display:flex;align-items:flex-start;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;}
.item-row .mk{flex:0 0 auto;font-weight:800;}
.mk-c{color:var(--state-correct);}
.mk-w{color:var(--state-incorrect);}
.mk-m{color:var(--state-skipped);}
.persp{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px;}
@media(min-width:720px){.persp{grid-template-columns:1fr 1fr;}}
.persp .p-card{border:1px solid var(--border);border-radius:8px;padding:10px 14px;background:var(--bg-surface-2);font-size:14px;}
.persp .p-card h6{margin:0 0 6px;font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;}
.p-card.red h6{color:var(--state-incorrect);}
.p-card.blue h6{color:var(--accent-blue);}
.study-tip{margin-top:12px;border:1px solid var(--border);border-left:3px solid var(--accent-amber);border-radius:8px;background:var(--bg-surface-2);padding:9px 12px;font-size:14px;color:var(--text-primary);}
.canon{margin-top:12px;}
.canon h6{margin:0 0 6px;font-size:12.5px;letter-spacing:.8px;color:var(--accent-green);text-transform:uppercase;}
.canon pre{background:var(--bg-terminal);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text-mono);font-size:14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;}
.canon ul{margin:6px 0 0;padding-left:20px;color:var(--text-secondary);font-size:13.5px;}
.canon li{margin-bottom:4px;}

/* ---------- review / results ---------- */
.review-list{display:flex;flex-direction:column;gap:10px;}
.review-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 14px;}
.review-row .q{flex:1;min-width:200px;font-size:14.5px;}
.result-hero{padding:26px 22px;text-align:center;}
.result-pct{font-size:52px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
.pass-panel{border:2px solid var(--state-correct);background:var(--correct-tint);}
.fail-panel{border:2px solid var(--state-incorrect);background:var(--incorrect-tint);}
.res-break{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px;}
@media(min-width:640px){.res-break{grid-template-columns:1fr 1fr;}}
.res-cell{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;font-size:14.5px;}
.res-cell b{font-size:22px;font-variant-numeric:tabular-nums;}
.paused-overlay{position:fixed;inset:0;z-index:100;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:20px;}
.paused-card{max-width:460px;width:100%;text-align:center;padding:30px 24px;border-color:var(--state-paused);}
.paused-card .big{font-size:44px;color:var(--state-paused);}
.hidden{display:none !important;}

<script>
"use strict";
var EXAM = {"meta":{"topicId":"t1534","batch":3,"title":"T1534 Internal Spearphishing — HARD","difficulty":"hard","questionCount":15,"estimatedMinutes":38,"passMark":70,"mitreId":"T1534","mitreName":"Internal Spearphishing","objectType":"Technique","severityLabel":"HARD","partLabel":null},"intro":{"learn":["You will learn how **T1534 Internal Spearphishing** works. This is an ATT&CK **Technique** in the Lateral Movement tactic. The adversary takes over a mailbox or chat account inside the company and then uses that trusted account to phish other staff.","You will practise the two hard parts of this technique. First, detection: internal mail never crosses the gateway, so analysts must work with mail-flow analytics (volume baselines, first-time sender-recipient pairs, link and attachment density), message tracking, and O365 audit events such as **New-InboxRule** and **MailItemsAccessed**. Second, response: disabling a mailbox has a real business cost, and purging delivered lures can destroy evidence.","The exercises use the fictional company Atlas Aerospace during a supplier-audit week. Every address and domain is defanged, for example `atlas-aero[.]example`. Work each exercise like a real shift: read the artefacts, justify the choice, and expect some loud alerts to be benign."],"keywords":[{"theme":"Mail-flow analytic design","items":["first-time internal sender-recipient pair","trailing 30-day volume baseline","link and attachment density","bulk-mail exemption for payslips and all-hands"]},{"theme":"O365/Exchange audit analysis","items":["New-InboxRule as persistence","MailItemsAccessed as collection","message tracking as blast-radius map","intra-org mail bypasses the gateway"]},{"theme":"Response trade-offs","items":["disable mailbox vs alert-and-watch","purge delivered lures vs preserve evidence","recovery: sessions, app passwords, inbox rules","least aggressive effective action"]},{"theme":"False-positive discipline","items":["alarming-but-benign bulk sends","benign-but-alarming low-volume lures","analytic precision vs recall","user-report triage"]}],"types":["Multiple choice","Log analysis","Drag & drop","Timeline ordering","Matching","Fill in the blank","Terminal (fake shell)","Branching scenario"]},"exercises":[{"id":"e01","type":"qcm-multi","scenario":{"text":["Atlas Aerospace, supplier-audit week. Ticket AT-7734: the shared `it-helpdesk@atlas-aero[.]example` mailbox was compromised and used to mail other staff.","The detection engineering lead asks you to review the draft T1534 mail-flow analytic before it ships to the SIEM.","The gateway anti-phish policy is scoped to external mail only, so intra-org delivery is a blind spot the new analytic must close.","During audit week the helpdesk mailbox is the busiest shared sender in the tenant, and payslip morning is four days away.","Anything shipped now must survive that noise without an exemption that blinds it."],"artefacts":[{"label":"Draft analytic spec — data sources","code":"source: intra-org SEND events from message tracking (atl-mx-02)\nsource: per-sender volume vs trailing 30-day baseline\nsource: O365 audit — New-InboxRule, MailItemsAccessed, UserLoggedIn\nnot collected: chat platform audit (planned Q3)\nowner note: gateway AntiPhish policy is scoped external-only"}]},"question":"Select every signal that belongs in the internal-spearphishing mail-flow analytic.","hint":"The gateway already owns external mail — this analytic only sees what moves inside the org.","explanation":["A **first-time internal sender-recipient pair** catches the quiet lure that volume never sees. A **per-sender volume jump over the trailing 30-day baseline** catches takeover blasts like the 24-recipient audit-pack mail. **Link or attachment density** from a service mailbox catches payload delivery between the two.","Inbound external mail failing SPF/DKIM is a gateway problem for external phishing — it is a different technique and it never reaches this analytic, which only reads intra-org events.","Database free-space trend on atl-mx-02 is a capacity metric. It correlates with nothing the attacker does, so it only adds noise to the rule."],"study":"Read the ATT&CK T1534 detection section: email metadata and user-account data components.","perspectives":{"attacker":"A trusted internal sender needs no infrastructure and no gateway bypass — your own mail flow is the weapon.","defender":"Baseline per-sender volume intra-org and treat shared service mailboxes as high-risk senders, because nobody watches them the way they watch the edge."},"answer":{"options":["A first-time internal sender-recipient pair alert.","A per-sender volume jump over the trailing 30-day baseline.","Link or attachment density from a service mailbox.","Inbound external mail failing SPF or DKIM checks.","The database free-space trend on the mail server."],"correct":[0,1,2]}},{"id":"e02","type":"dragdrop","scenario":{"text":["09:04, month-end payslip day at Atlas Aerospace. The volume analytic fired repeatedly overnight and the queue is noisy.","The on-call lead wants every firing sorted before the 09:30 stand-up: expected bulk versus possible T1534.","Remember the constraint from the spec review: the gateway never scanned any of this, because it all stayed intra-org."],"artefacts":[{"label":"Mail-flow volume alerts","code":"07:58:02 SEND hr-payslips@atlas-aero[.]example rcpt=1402 subject=\"March payslip\" volume=10x-BASELINE\n08:03:44 SEND comms-team@atlas-aero[.]example rcpt=809 subject=\"All-hands replay + deck\" volume=8x-BASELINE\n08:12:04 SEND it-helpdesk@atlas-aero[.]example rcpt=1 (v.reyes) subject=\"Audit portal access reset\" links=1 volume=OK\n08:14:55 SEND it-helpdesk@atlas-aero[.]example rcpt=24 subject=\"Supplier audit pack — re-verify\" volume=2x-BASELINE\n08:20:31 SEND marketing-tool@atlas-aero[.]example rcpt=845 subject=\"Product launch\" links=6 volume=6x-BASELINE\n08:31:09 SEND it-helpdesk@atlas-aero[.]example rcpt=1 (t.nguyen) subject=\"Shared drive quota\" volume=OK"},{"label":"Registered bulk senders — connector registry","code":"hr-payslips@atlas-aero[.]example    connector=HR-BULK  cadence=month-end  registered=yes\ncomms-team@atlas-aero[.]example     connector=COMMS    cadence=event      registered=yes\nmarketing-tool@atlas-aero[.]example connector=MK-04    cadence=campaign   registered=yes\nit-helpdesk@atlas-aero[.]example    connector=none (shared mailbox, no bulk registration)"}]},"question":"Drag each firing into the correct triage zone.","answer":{"zones":[{"name":"Expected bulk — tune out"},{"name":"Possible T1534 — investigate"}],"items":[{"text":"hr-payslips: 1,402 payslips at 07:58, month-end routine from the HR-BULK connector","zone":0},{"text":"comms-team: all-hands replay to 809 staff, registered COMMS connector","zone":0},{"text":"marketing-tool: launch mail to 845 with six tracked links, registered MK-04 connector","zone":0},{"text":"it-helpdesk: 24 staff sent a 'supplier audit pack' the service desk never distributes","zone":1},{"text":"it-helpdesk: one-to-one 'audit portal access reset' link to v.reyes","zone":1}]},"hint":"Ask who normally sends this content and at what volume — not which alert line is loudest.","explanation":["The payslip, all-hands and marketing sends come from registered bulk senders on their normal cadence. They look alarming because they break the volume baseline, but they are expected — tune them out by connector identity, not by keyword.","The two it-helpdesk sends break role, not volume. The service desk does not distribute supplier-audit packs, and a one-to-one reset link to v.reyes stays under every volume threshold.","This is the classic HARD trap: the loudest lines are benign and the quiet lines are the incident. Low volume is exactly why the first-time-pair analytic exists."],"study":"Practise sorting analytic firings by sender role and cadence before you look at the volume number.","perspectives":{"attacker":"Riding a loud month-end blast is free cover — my low-volume lure hides inside the FIRE noise.","defender":"Exempt bulk by connector identity, not by keyword, and alert on role-violating sends from shared mailboxes."}},{"id":"e03","type":"qcm-single","scenario":{"text":["10:15. The SOC queue at Atlas Aerospace is almost green — every volume analytic on atl-mx-02 stayed silent overnight.","One line did fire: the first-time-pair analytic caught a single intra-org mail from `it-helpdesk@atlas-aero[.]example` to the chief-engineer mailbox.","The helpdesk roster confirms nobody worked on VPN certificates this week, and the chief-engineer mailbox carries the privileged-review tag.","The mail is one-to-one, one link, no attachment — nothing about it would ever move a volume counter.","The lead wants the root cause named before the 10:30 sync, because the same gap will still be open during payslip morning."],"artefacts":[{"label":"Pair-analytic alert","code":"10:14:58 FIRESIG rule=PT-1534-PAIR first-time-pair it-helpdesk@atlas-aero[.]example -> chief-engineer@atlas-aero[.]example links=1 attach=0 sends24h=1\n10:15:00 CONTEXT chief-engineer@atlas-aero[.]example tag=privileged-review"}]},"question":"Which gap let this quiet lure reach a privileged mailbox with no volume alert?","hint":"Volume stayed silent by design — ask which signal would still fire on one mail to one recipient.","explanation":["The gap is that the volume analytic has no first-time-pair check for low-volume intra-org mail. Nothing about this lure is loud: one sender, one recipient, one link. The pair signal was the only possible catch, and it worked.","The gateway-sandbox answer is the near miss: the gateway never evaluated this mail at all, because the anti-phish policy is scoped external-only. Fixing gateway sandboxing would change nothing here.","A daily tracking-log query is a latency problem, not a blind spot, and the privileged-review tag proves the mailbox is audited — the lure was simply never seen by a volume check."],"study":"Compare volume-based and relationship-based (first-time pair) analytics for T1534.","perspectives":{"attacker":"One mail, one recipient, a topic only IT would raise — the quiet lure is the one that reaches admins.","defender":"Privileged mailboxes need pair-based alerting even when every volume analytic is green."},"answer":{"options":["The volume analytic has no first-time-pair check for low-volume intra-org mail.","The gateway sandbox skipped the mail because the anti-phish policy is external-only.","The daily tracking-log query runs too late to see a mail sent minutes earlier.","The privileged-review tag on the mailbox is not shared with the mail-flow tooling."],"correct":0}},{"id":"e04","type":"log-qcm","scenario":{"text":["Ticket AT-7734, hour two. You have the Unified Audit Log slice for the `it-helpdesk` account from atl-mx-02.","The attacker held the mailbox for at least 40 minutes before the lure wave went out, and the real helpdesk agent started their shift inside the same window.","The IR lead wants the persistence claim separated from everything else before the timeline goes to the steering group.","Use the filter box to isolate what the account did before the Send burst."]},"log":{"title":"Unified Audit Log — it-helpdesk account — atlas-aero[.]example","lines":["07:41:12 UserLoggedIn it-helpdesk logon=10[.]8[.]44[.]19 client=IMAP4 result=success","07:44:55 MailItemsAccessed it-helpdesk folder=Inbox client=Client=OWA count=38","07:59:03 MailItemsAccessed it-helpdesk folder=Inbox client=Client=OWA count=12","08:05:41 New-InboxRule it-helpdesk name=\"cleanup\" condition=\"subject contains invoice OR security OR phish\" action=MoveToFolder target=\"Deleted Items\" markAsRead=true","08:11:37 Send it-helpdesk recipients=24 subject=\"Supplier audit pack — re-verify\"","08:12:04 MailItemsAccessed it-helpdesk folder=Sent Items client=Client=OWA count=2","08:26:10 UserLoginFailed it-helpdesk logon=10[.]8[.]44[.]19 result=failure","08:58:41 UserLoggedIn it-helpdesk logon=10[.]8[.]20[.]5 client=Client=OWA result=success"]},"question":"Which line proves the attacker planted persistence that also hides security notices from the mailbox owner?","answer":{"options":["07:41 UserLoggedIn from an unmanaged IMAP client","08:05 New-InboxRule hiding invoice, security and phish mail as read in Deleted Items","08:11 Send to 24 internal recipients","08:58 UserLoggedIn from the OWA jump host"],"correct":1},"hint":"Look for an action that survives the session and changes what the owner sees.","explanation":["The 08:05 **New-InboxRule** does two jobs at once: it persists after the attacker leaves, and it auto-files invoice, security and phish mail to Deleted Items as read, so the owner stays blind to any follow-up warning.","The 07:41 logon is initial access evidence, not persistence. The 08:11 Send is the T1534 action itself — lateral movement, not a foothold.","The 08:58 logon from the OWA jump host is the real helpdesk agent starting their shift. That is the noise line that should never be escalated."],"study":"Review how Set-InboxRule and New-InboxRule events are used as T1534-adjacent persistence evidence.","perspectives":{"attacker":"A quiet rule named 'cleanup' keeps the owner blind while I keep the mailbox.","defender":"Alert on New-InboxRule and Set-InboxRule on shared and privileged mailboxes, and test rules for security-keyword conditions."}},{"id":"e05","type":"match","scenario":{"text":["The IR lead wants the AT-7734 timeline annotated correctly before the 16:00 update to the audit-week steering group.","Each audit artefact below needs its correct reading, because two of them will be quoted in the regulator letter and one must not appear in it at all.","One artefact is owner noise — do not let it inflate the incident."],"artefacts":[{"label":"Unified Audit Log — selected AT-7734 events","code":"07:44:55 MailItemsAccessed it-helpdesk folder=Inbox client=Client=OWA count=38 (owner)\n08:05:41 New-InboxRule it-helpdesk name=\"cleanup\" hides invoice|security|phish -> Deleted Items markAsRead=true\n08:09:12 Add app password it-helpdesk result=success\n08:11:37 Send it-helpdesk recipients=24 ; 08:19:55 Send recipients=31\n09:14:08 MailItemsAccessed v.reyes client=Client=REST logon=10[.]8[.]44[.]19"}]},"question":"Match each artefact to its correct IR reading.","answer":{"pairs":[{"left":"New-InboxRule 'cleanup' at 08:05","right":"persistence plus owner-blindness"},{"left":"App password added at 08:09","right":"MFA-bypass foothold kept for later"},{"left":"Send burst: 24 + 31 recipients, 08:11–08:20","right":"the lure wave — anchor of the blast radius"},{"left":"MailItemsAccessed v.reyes via REST from 10[.]8[.]44[.]19","right":"attacker-session collection of the second victim"},{"left":"Owner OWA read of own Inbox at 07:44","right":"routine activity — noise, do not inflate the case"}]},"hint":"Two artefacts help the attacker twice; one only proves the owner reads their own mail.","explanation":["The inbox rule is **persistence plus owner-blindness**: it survives the session and hides security wording. The app password is an **MFA-bypass foothold** the attacker kept for later sessions.","The Send burst is the lure wave itself — the anchor from which every recipient-state check starts. The REST read of v.reyes from the attacker's IP is **collection**: the second victim's mailbox was programmatically read.","The owner's own OWA read of their own Inbox is routine work. Annotating it as hostile would inflate the case and waste response time during audit week."],"study":"Practise reading O365 audit operations as attacker actions versus owner actions."},{"id":"e06","type":"fillblank","scenario":{"text":["Detection engineering writes the tuning note for the T1534 analytic after the payslip-morning false positives.","The note must hold three decisions that the payslip blast forced: how pairs are built, how bulk is exempted, and how privileged mailboxes are treated.","The payslip experience already showed what a keyword exemption would have cost — the one-to-one helpdesk lure carried ordinary service-desk wording."],"artefacts":[{"label":"Draft analytic spec v0.9","code":"rule PT-1534-PAIR — first-time intra-org (sender, recipient) pair\nrule PT-1534-VOL — fires at 10x trailing-30d per-sender baseline\ndraft exemption — registered bulk senders: hr-payslips, comms-team, marketing-tool (MK-04)\nopen item — privileged mailboxes: exempt or never exempt?"}]},"question":"Complete the tuning note from the word bank.","answer":{"template":"The first-time-pair analytic joins the ___ of every SEND event to its recipient history; the bulk exemption binds to the registered ___ of the sender, never to a keyword; and privileged mailboxes such as the chief-engineer are never ___, so one-to-one mail from a service account still pages.","blanks":["sender","connector","exempt"],"bank":["sender","recipient","connector","keyword","exempt","external","hidden"]},"hint":"The exemption must be tied to how bulk mail is technically sent, not to who reads it.","explanation":["The pair rule is built on the **sender** field joined to recipient history — that is what makes a pair a pair.","The bulk exemption binds to the registered **connector**, because connector identity is technically verifiable. A keyword exemption would be trivial for an attacker to imitate.","Privileged mailboxes such as the chief-engineer are **never exempt**. Exempting them would reopen exactly the quiet-lure gap from the 10:14 alert."],"study":"Learn how connector-bound exemptions differ from keyword or sender-name exemptions."},{"id":"e07","type":"log-qcm","scenario":{"text":["13:00. A steering-group member asks why the gateway 'did nothing' during the AT-7734 lure wave.","You pull the atl-mx-02 transport agent log for the window in which the compromised helpdesk mailbox was sending.","The same window contains external partner mail, so the log shows both paths through the same agent.","Follow one message through the filtering path and find where the anti-phish control stops applying."]},"log":{"title":"atl-mx-02 transport agent log — 08:11–08:20","lines":["08:11:37 SMTP RECEIVE conn=52 from=10[.]8[.]44[.]19 sender=it-helpdesk@atlas-aero[.]example rcpt=24 spf=none(intra-org) tls=INTERNAL","08:11:38 AGENT AntiPhish policy=ExternalPhish scope=external skipped=intra-org","08:11:39 SMTP SEND conn=52 to=3 hubs result=250 2.1.5 queued","08:12:04 SMTP RECEIVE conn=57 sender=it-helpdesk@atlas-aero[.]example rcpt=v.reyes@atlas-aero[.]example spf=none(intra-org) tls=INTERNAL","08:12:05 SMTP DELIVER mailbox=v.reyes@atlas-aero[.]example msgid=AT-7734-118 result=250","08:14:55 SMTP RECEIVE conn=61 sender=payroll-svc@payroll-partner[.]example rcpt=hr-payslips@atlas-aero[.]example spf=pass tls=EXTERNAL","08:14:56 AGENT AntiPhish policy=ExternalPhish scope=external verdict=clean action=deliver","08:19:55 SMTP RECEIVE conn=63 sender=it-helpdesk@atlas-aero[.]example rcpt=31 spf=none(intra-org) tls=INTERNAL","08:20:01 AGENT TransportRule Audit-Supplier-Mail stamp=audited action=tag"]},"question":"Which line proves the external anti-phish policy never evaluated the internal lure?","answer":{"options":["08:11:38 AGENT AntiPhish scope=external skipped=intra-org","08:12:05 SMTP DELIVER mailbox=v.reyes result=250","08:14:56 AGENT AntiPhish verdict=clean action=deliver","08:20:01 AGENT TransportRule stamp=audited action=tag"],"correct":0},"hint":"Follow the policy path for one message — where does the external policy stop applying?","explanation":["The 08:11:38 line records the anti-phish agent explicitly skipping the message because the policy is scoped external-only. That single line answers the stakeholder: the trusted internal sender is the bypass.","The 08:12:05 DELIVER only proves v.reyes received the message; it says nothing about which controls ran. The 08:14:56 verdict shows the same policy working correctly on external partner mail — the contrast that proves the gap.","The transport rule that stamps audit mail is a compliance tag, not an anti-phishing control."],"study":"Trace one message through transport agents to see which policies apply intra-org.","perspectives":{"attacker":"I never needed to defeat the gateway — I sent from inside it.","defender":"Internal-parity scanning exists precisely because the external policy stops at the org boundary."}},{"id":"e08","type":"dragdrop","scenario":{"text":["16:40. The CISO wants the AT-7734 blast radius sized before the audit-week steering call: 24 lure recipients plus the one-to-one sends.","Three views are in the case file: delivery, mailbox reads, and host telemetry.","Correlate all three and place each user in their true state — delivered is not compromised."],"artefacts":[{"label":"Message tracking — delivered","code":"08:11 wave: 24 recipients delivered, subject \"Supplier audit pack — re-verify\"\n08:12 delivered: v.reyes@atlas-aero[.]example subject \"Audit portal access reset\""},{"label":"Unified audit — recipient mailbox reads","code":"08:33 MailItemsAccessed owner=j.okafor read lure, no link event\n08:40 (t.nguyen: no owner-read event logged at all)\n08:47 MailItemsAccessed owner=c.morgan read lure\n09:02 MailItemsAccessed owner=v.reyes read lure"},{"label":"Proxy + EDR","code":"09:03 proxy c.morgan GET hxxps://portal-audit[.]example/auth status=200\n09:07 proxy v.reyes GET hxxps://portal-audit[.]example/reset status=200\n09:21 edr atl-proc-ws-11 v.reyes audit-portal[.]xlsm spawned winword -> powershell\n09:22 edr atl-proc-ws-11 beacon 185[.]219[.]82[.]44:443"}]},"question":"Place each recipient's state in the correct zone.","answer":{"zones":[{"name":"Executed — host compromise"},{"name":"Clicked or opened — mailbox-level"},{"name":"Delivered, no engagement"}],"items":[{"text":"v.reyes — the xlsm spawned powershell on atl-proc-ws-11","zone":0},{"text":"atl-proc-ws-11 beaconed to 185[.]219[.]82[.]44 after v.reyes's open","zone":0},{"text":"c.morgan — proxy shows a successful fetch of the lure link","zone":1},{"text":"j.okafor — read the lure in OWA; proxy shows no fetch","zone":1},{"text":"t.nguyen — lure delivered, no owner-read event logged","zone":2}]},"hint":"Delivery proves nothing; read, click and execution are three different proofs.","explanation":["v.reyes is the only **execution**: the EDR chain shows the xlsm spawning powershell and the host beaconing to 185[.]219[.]82[.]44. That upgrades v.reyes to a host-compromise case on atl-proc-ws-11.","c.morgan **clicked** — proxy shows a successful fetch of the lure link. j.okafor **opened** the lure but never fetched anything, which is mailbox-level exposure only.","t.nguyen has no owner-read event: the mail sat unread. Declaring t.nguyen compromised would overstate the incident; declaring j.okafor executed would do the same."],"study":"Drill the delivered / opened / clicked / executed ladder until you can size an incident from it.","perspectives":{"attacker":"Every recipient tier is a different prize — clicks for credentials, execution for footholds.","defender":"Correlate tracking, audit, proxy and EDR before you declare scope, because 'delivered' is the weakest claim you can make."}},{"id":"e09","type":"order","scenario":{"text":["21:30. The phishing IR playbook is approved and the it-helpdesk account is confirmed compromised.","The on-call engineer must execute recovery tonight, before the next audit-week shift starts at 07:00.","Order matters: a wrong step either leaves the attacker a working path or destroys evidence the regulator letter will need.","The mailbox audit and rule definitions are not yet exported, and lures still sit unread in two recipient mailboxes.","The on-call has one hour of approved change window — every step must land in the right sequence."]},"question":"Order the recovery steps from first to last.","answer":{"mode":"timeline","items":["Reset the it-helpdesk password and revoke all active sessions","Delete the attacker's app password and re-register MFA","Export the malicious inbox rules, then remove them","Export lure samples, then purge the delivered lures from recipient mailboxes","Keep the mailbox under 48-hour watch to confirm no rule recreation"]},"hint":"Cut access first, take back control second, and only then touch message content — samples must survive.","explanation":["Access is cut first: reset the password and revoke all active sessions, or every later step runs while the attacker still holds a live token path.","The attacker-added second factor goes next — the app password and any MFA re-registration — because a reset password alone does not remove it.","Mailbox control comes third: export the malicious inbox rules, then remove them. Content comes fourth: export lure samples, then purge from recipient mailboxes. A 48-hour watch closes recovery by confirming no rule recreation."],"study":"Memorise the access-then-control-then-content ordering used by compromised-mailbox playbooks."},{"id":"e10","type":"branching","scenario":{"text":["Day 2, 08:50. Evidence so far on AT-7734: the it-helpdesk mailbox sent 24 lures plus three one-to-one mails; one confirmed click (c.morgan, no execution); one user report from j.okafor.","The service desk is the coordination point for supplier-audit support all week — the business runs through this mailbox.","No password reset has been performed yet, and the attacker's session may still be live.","The CISO asks the on-call lead for the first move. Work the response one decision at a time."]},"question":"Work the AT-7734 response one decision at a time.","steps":[{"continuation":"Password reset and session revocation are not yet done — the mailbox is still owned. Audit-week support continues all week from this mailbox.","question":"What is the correct first move?","options":["Disable the shared mailbox for the week and route all tickets to a new queue","Force a password reset, revoke the attacker's sessions, block the lure URLs, keep the mailbox up under pair-analytic watch","Purge the delivered lures from all recipients before touching the account","Send an all-staff mail warning that the helpdesk mailbox is compromised"],"correct":1},{"continuation":"By 09:20 the pair analytic fires again: the attacker retained an app password. Access is cut once more, but three further one-to-one lures have gone out.","question":"What is the correct next move?","options":["Keep the mailbox enabled; the volume analytic will catch any further sends","Ask staff by reply-all to report any further lures themselves","Disable the mailbox, export rule definitions and audit context, then plan reopening under 48-hour watch","Run a tenant-wide purge of every message the sender ever sent"],"correct":2},{"continuation":"Legal wants every delivered lure preserved for the works-council review; the service-desk lead wants them gone before someone clicks. The CISO wants one defensible instruction.","question":"Which instruction resolves the conflict defensibly?","options":["Export full lure samples with tracking context under legal hold, then purge from recipient mailboxes","Preserve everything in place until legal closes the review","Purge immediately; screenshots of three samples are enough","Forward the lures to a shared evidence mailbox for storage"],"correct":0}],"hint":"Match the response strength to the evidence at each step — a wrong move costs either the attacker's freedom or the audit week.","explanation":["Step 1 is the least-aggressive-action decision: a reset, session revocation and URL blocks cut the attacker's access while the mailbox keeps serving audit week. Disabling the shared mailbox is defensible in a bigger compromise, but here it pays a business cost the evidence does not yet demand.","Step 2 escalates because the attacker demonstrated persistence — a retained app password. Once persistence is proven, disabling the mailbox and exporting rule and audit context is proportionate; a tenant-wide purge is overreach that destroys evidence.","Step 3 resolves purge versus preserve: export full samples with tracking context under legal hold, then purge from recipient mailboxes. Preserving live lures leaves staff exposed, and screenshots are not evidence quality."],"study":"Read a phishing-response playbook and mark where each step's trigger condition sits.","perspectives":{"attacker":"Every hour the mailbox stays up is another distribution window I do not have to earn.","defender":"Escalate on demonstrated persistence, not on alert count — and never let legal preservation leave live lures in inboxes."}},{"id":"e11","type":"fillblank","scenario":{"text":["Post-incident review, Atlas Aerospace. Fourteen volume firings on payslip morning, two true helpdesk sends.","The SOC lead wants the note to show how the team kept precision without blinding the analytic for the next audit week.","The review will be quoted when somebody proposes keyword exemptions again, so the final sentence has to be honest about that trade."],"artefacts":[{"label":"Post-incident note (draft)","code":"NOTE-AT-7734-09 — false-positive review, payslip morning\nfirings: 14 volume, 0 pair; true positives: 2 helpdesk sends\ndecision: no keyword exemptions; annotation-only triage"}]},"question":"Complete the note from the word bank.","answer":{"template":"The payslip blast tripped the volume analytic because 1,402 sends in minutes broke the baseline, but the ___ field showed a single registered HR sender on a month-end cadence, so the on-call ___ it as expected bulk and left an annotation; the note warns that keyword exemptions would have ___ the one-to-one helpdesk lure too.","blanks":["sender","triaged","hidden"],"bank":["sender","recipient","subject","triaged","escalated","hidden","improved"]},"hint":"The note must end honestly: any rule loose enough to silence the payslips would have silenced the real lure too.","explanation":["The **sender** field is what revealed the payslip blast as a single registered HR sender on a month-end cadence — the analytic fired, the context cleared it.","The on-call **triaged** the firing as expected bulk and annotated the alert. Deleting or suppressing the alert would have erased the audit trail the review needs.","Keyword exemptions would have **hidden** the one-to-one helpdesk lure too, because its subject contained ordinary service-desk wording. Precision came from reading fields, not from loosening rules."],"study":"Practise writing false-positive annotations that keep the analytic unchanged."},{"id":"e12","type":"qcm-multi","scenario":{"text":["The Atlas Aerospace hardening board meets after AT-7734 with budget for three changes this quarter.","The CISO wants options that blunt T1534 specifically — the trusted-sender bypass, the takeover path, and the quiet delivery — not generic mail hygiene.","The board also notes the constraint that finance is occupied with the earnings release and the plant network is change-frozen.","Two proposals on the table sound professional but would not have touched a single step of the AT-7734 chain."],"artefacts":[{"label":"Board agenda (extract)","code":"item 4 — fund 3 controls, T1534-focused\nconstraint — no business disruption during release week\nscope — intra-org mail path and shared-mailbox takeover"}]},"question":"Select every control the board should fund for T1534 coverage.","hint":"Each answer must touch the intra-org path or the account-takeover path.","explanation":["Internal-parity scanning gives intra-org mail the same anti-phish scoring and link warnings as external — it closes the trusted-sender bypass shown in the transport log.","MFA plus device compliance on shared and privileged mailboxes attacks the takeover path that started AT-7734. The first-time-pair mail-flow rule flags delivery even when volume stays quiet, which is how the 10:14 lure should have been paged.","Exempting internal mail from link rewriting widens the exact gap that was exploited. Extending external-gateway retention is a reasonable project, but those logs never see intra-org mail, so it funds the wrong half of the problem."],"study":"Map each candidate control to the T1534 kill-chain step it blunts before costing it.","perspectives":{"attacker":"Unscored internal links and MFA-free shared mailboxes are the two doors I look for first.","defender":"Fund controls on the path the attacker actually walked — internal parity, account hardening, pair alerting."},"answer":{"options":["Internal-parity anti-phish scanning for intra-org mail.","MFA plus device compliance on shared and privileged mailboxes.","A first-time-pair mail-flow rule that pages on quiet delivery.","Exempting internal mail from link rewriting.","Extending external-gateway log retention only."],"correct":[0,1,2]}},{"id":"e13","type":"order","scenario":{"text":["The CTI slide for the audit-week steering group needs the AT-7734 chain as four ordered stages, each mapped to ATT&CK.","The mapping is contested in the room: one stakeholder calls the whole thing 'a phishing attack', another insists it is all lateral movement.","The slide author has one rule: the internal hop keeps its own name, or the debate never ends.","The evidence file supports four stages: an external credential phish that harvested a helpdesk agent's O365 session, a takeover with a hiding inbox rule, the 24-recipient internal lure wave from the trusted helpdesk mailbox, and v.reyes opening the xlsm on atl-proc-ws-11 before the host beaconed out.","The slide must name the internal hop correctly — that stage is T1534, not the external one."]},"question":"Order the four chain stages from first to last.","answer":{"mode":"timeline","items":["External credential phish harvests a helpdesk agent's O365 session","Attacker signs in to it-helpdesk and plants a hiding inbox rule","Compromised helpdesk mailbox mails 24 staff the audit-portal lure","v.reyes opens the xlsm on atl-proc-ws-11; the host beacons out"]},"hint":"Two stages happen inside one mailbox before any second user is touched.","explanation":["Stage one is the external credential phish — that is T1566 territory and it is where the gateway lives. Stage two is the takeover itself: sign-in plus the hiding rule on the helpdesk mailbox.","Stage three is the internal lure wave — the T1534 hop, where the trusted sender replaces attacker infrastructure. Stage four is execution on the second victim, confirmed by the atl-proc-ws-11 beacon.","The slide argument lands because each stage names a different technique: the debate dissolves once the chain is ordered."],"study":"Practise mapping a multi-stage phishing chain onto Initial Access, Lateral Movement and Execution.","perspectives":{"attacker":"One stolen session becomes a trusted distribution channel — that asymmetry is why T1534 is chosen over more external infrastructure.","defender":"Anchor each stage to its own telemetry so the chain, not a single alert, tells the story."}},{"id":"e14","type":"match","scenario":{"text":["The SOC writes the triage matrix for T1534 signals during audit week, so the night shift stops escalating payslips and stops sleeping through quiet lures.","Each signal below needs the action the matrix should prescribe, and every action must be one a night-shift analyst can execute without a call-back.","Volume decides nothing on its own."],"artefacts":[{"label":"Triage matrix — candidate rows","code":"row A — volume analytic, registered bulk sender, month-end cadence\nrow B — first-time pair, shared service mailbox, one-to-one, one link\nrow C — registered marketing connector blast with tracked links\nrow D — after-hours one-to-one mail to a privileged mailbox\nrow E — user report of a lure appearing to come from a colleague"}]},"question":"Match each signal to the correct triage action.","answer":{"pairs":[{"left":"Volume analytic: 1,402 sends, hr-payslips sender, month-end cadence","right":"annotate as expected bulk, leave the analytic unchanged"},{"left":"First-time pair: it-helpdesk -> finance lead, one-to-one, one link","right":"page the phishing IR queue"},{"left":"Marketing connector blast to 845 with six tracked links","right":"exempt by connector identity, never by keyword"},{"left":"23:40 single 'VPN certificate' mail to the chief-engineer","right":"treat as high priority despite zero volume"},{"left":"User report: lure mail appears to come from a colleague","right":"preserve the reported mail, open the IR ticket"}]},"hint":"Volume decides nothing on its own — sender role and recipient value do.","explanation":["Registered bulk on cadence is annotated as expected bulk and left alone; the marketing blast gets a connector-identity exemption, never a keyword one.","The one-to-one pair from a service mailbox to a finance lead pages phishing IR immediately — that is the shape of the real lure. The 23:40 mail to the chief-engineer is high priority despite zero volume, because recipient value, not count, drives the risk.","A user report is preserved in place and ticketed: the reported mail is evidence, and deleting it 'to help the user' destroys the sample."],"study":"Write triage rows from sender role, recipient value and cadence — not from alert volume."},{"id":"e15","type":"terminal","scenario":{"text":["23:05, day 2 of AT-7734. The IR lead needs the full send list of the compromised helpdesk mailbox since 08:00 to feed the purge job and the regulator letter.","You are on the Exchange Management Shell jump host with the Exchange tooling available.","The mailbox address in evidence is `it-helpdesk@atlas-aero[.]example`.","Destructive cmdlets are logged and reviewed — run reads only.","The output feeds two consumers: the purge job and the regulator letter, so the read must be complete, not sampled."],"artefacts":[{"label":"Evidence note — AT-7734","code":"mailbox: it-helpdesk@atlas-aero[.]example (compromised, day 2)\nneed: full SEND list since 08:00 for purge job + regulator letter\nguardrail: destructive cmdlets are logged and reviewed; run reads only"}]},"question":"Type the command that lists all messages sent by that mailbox since 08:00, then press Check.","hint":"You want a read-only tracking query — three filters: who sent, since when, which event class.","explanation":["**Get-MessageTrackingLog** is the read-only query surface for Exchange message flow. **-Sender** pins the result to the compromised it-helpdesk address, **-Start 08:00** bounds it to the takeover window, and **-EventId SEND** keeps successful sends only, not deliveries the mailbox received.","The dangerous near misses are real commands that would appear to 'clean up': Remove-Message deletes the messages the regulator letter needs, and Remove-Mailbox (or Get-Mailbox piped into Remove-Mailbox) destroys the mailbox itself. Both would be flagged as DANGEROUS — NEAR MISS in a live SOC.","Search-Mailbox with -DeleteContent is also a purge, not a query. When the objective is evidence, the read must come first — the purge job consumes this output later, after samples are exported."],"study":"Practise Get-MessageTrackingLog filters (Sender, Start, EventId) in a lab tenant.","answer":{"shellTitle":"analyst@soc-jmp-01 — simulated Exchange Management Shell","prompt":"analyst@soc-jmp-01:~$","shellIntro":["Simulated Exchange Management Shell. Type the command and press Enter.","Nothing is executed; this is a training simulation."],"elements":[{"desc":"runs the message-tracking cmdlet","pattern":"\\bget-messagetrackinglog\\b"},{"desc":"filters on -Sender with the defanged it-helpdesk address","pattern":"-sender\\s+[\"']?it-helpdesk@atlas-aero(\\[?\\.?\\]?)?example"},{"desc":"narrows to send events with -EventId SEND","pattern":"-eventid\\s+[\"']?send\\b"}],"wrongPatterns":[{"desc":"Remove-Message destroys the evidence the lead asked for","pattern":"\\bremove-message\\b"},{"desc":"Remove-Mailbox deletes the mailbox itself","pattern":"\\bremove-mailbox\\b"},{"desc":"Search-Mailbox -DeleteContent is a purge, not a query","pattern":"\\bdeletecontent\\b"}],"canonical":"Get-MessageTrackingLog -Sender \"it-helpdesk@atlas-aero[.]example\" -Start \"08:00\" -EventId SEND","canonicalParts":["Get-MessageTrackingLog — read-only Exchange message-tracking query","-Sender it-helpdesk@atlas-aero[.]example — only mail from the compromised mailbox","-Start 08:00 — only since the takeover window opened","-EventId SEND — only successful send events, not received deliveries"],"expectedOutput":["08:11:37  SEND  it-helpdesk@atlas-aero[.]example  24 recipients  \"Supplier audit pack — re-verify\"","08:12:04  SEND  it-helpdesk@atlas-aero[.]example  v.reyes@atlas-aero[.]example  \"Audit portal access reset\"","08:19:55  SEND  it-helpdesk@atlas-aero[.]example  31 recipients  \"IT service desk — mailbox verification\""]}}]};

/* ---------- timer state machine ----------

------------------------------------------------- */

    if(prev===STATE_MAN)timer.manualSec+=spent;else timer.autoSec+=spent;

  if(s===STATE_RUN&&!tickHandle){tickHandle=setInterval(tick,1000);}

function prepareExercise(ex){
  if(ex.type==='qcm-single'||ex.type==='qcm-multi'||ex.type==='log-qcm'){
    var a=ex.answer;
    if(ex.type==='log-qcm'&&typeof a.correct==='number')a.correct=[a.correct];
    var multi=(ex.type==='qcm-multi')||(ex.type==='log-qcm'&&Array.isArray(a.correct)&&a.correct.length>1);
    var order=shuffle(a.options.map(function(_,i){return i;}));
    a._disp=a.options.map(function(o,i){return {text:a.options[order[i]],orig:order[i]};});
    if(!multi){var c0=Array.isArray(a.correct)?a.correct[0]:a.correct;a._corr=order.indexOf(c0);a._multi=false;}
    else{a._corr=a.correct.map(function(c){return order.indexOf(c);});a._multi=true;}
  }
  if(ex.type==='dragdrop'){ex.answer._bank=shuffle(ex.answer.items.map(function(_,i){return i;}));ex.answer._placed={};}
  if(ex.type==='order'){ex.answer._disp=shuffle(ex.answer.items.map(function(_,i){return i;}));}
  if(ex.type==='match'){ex.answer._right=shuffle(ex.answer.pairs.map(function(_,i){return i;}));ex.answer._pairs=[];ex.answer._selLeft=null;}
  if(ex.type==='fillblank'){
    var fa=ex.answer;
    var distr=(fa.bank||[]).filter(function(w){return fa.blanks.indexOf(w)<0;});
    var words=fa.blanks.map(function(w,i){return {t:w,slot:i};}).concat(distr.map(function(w){return {t:w,slot:-1};}));
    fa._words=shuffle(words);
    fa._bank=fa._words.map(function(_,i){return i;});
    fa._filled=fa.blanks.map(function(){return null;});
    fa._selChip=null;
  }
  if(ex.type==='branching'){
    ex._step=0;
    ex.steps.forEach(function(st){
      var order=shuffle(st.options.map(function(_,i){return i;}));
      st._disp=st.options.map(function(o,i){return {text:st.options[order[i]],orig:order[i]};});
      st._corr=order.indexOf(st.correct);
      st._choice=null;
      st._done=false;
    });
  }
  if(ex.type==='terminal'){ex._cmd='';}
}

function scoreExercise(H,W,N){N=Math.max(1,N);return Math.max(0,(H-W)/N);}
function gradeExercise(ex){

    a.items.forEach(function(it,i){

      else{W3++;items3.push({status:'wrong',text:it.text+' → placed in "'+a.zones[z].name+'", correct zone: "'+a.zones[it.zone].name+'"'});}

  }else if(ex.type==='order'){
    var H4=0,W4=0,items4=[];
    for(var k=0;k<a._disp.length;k++){
      var ok=(a._disp[k]===k);
      if(ok)H4++;else W4++;
      items4.push({status:ok?'correct':'wrong',text:'Position '+(k+1)+': expected "'+a.items[k]+'", you placed "'+a.items[a._disp[k]]+'"'});

      }
    });
    r={H:H6,W:W6,N:a.blanks.length,items:items6};
  }else if(ex.type==='terminal'){
    var norm=normalizeCmd(ex._cmd);
    var H7=0,W7=0,items7=[],danger=false;
    a.elements.forEach(function(el){
      var ok=new RegExp(el.pattern,'i').test(norm);
      if(ok){H7++;items7.push({status:'correct',text:el.desc});}
      else{items7.push({status:'missed',text:el.desc});}
    });
    (a.wrongPatterns||[]).forEach(function(wp){
      if(new RegExp(wp.pattern,'i').test(norm)){W7++;danger=true;items7.push({status:'wrong',text:wp.desc});}
    });
    if(!norm){W7++;items7.push({status:'wrong',text:'No command was entered.'});}
    r={H:H7,W:W7,N:a.elements.length,items:items7,terminal:true,danger:danger};
  }else if(ex.type==='branching'){
    var H8=0,W8=0,items8=[];
    ex.steps.forEach(function(st,i){
      var ok=(st._choice===st._corr);
      if(ok)H8++;else W8++;
      items8.push({status:ok?'correct':'wrong',text:'Step '+(i+1)+' — '+st.options[st.correct]});
    });
    r={H:H8,W:W8,N:ex.steps.length,items:items8,branching:true};
  }else{r={H:0,W:0,N:1,items:[]};}
  var credit=scoreExercise(r.H,r.W,r.N);
  if(hintUsed[ex.id])credit=Math.max(0,credit-0.10);
  r.credit=credit;
  return r;
}
function normalizeCmd(c){
  return String(c||'').toLowerCase().replace(/\s+/g,' ').trim().replace(/;$/,'').replace(/\/$/,'');
}

function scenarioBlock(ex){

function questionBlock(ex){

function feedbackBlock(ex,res){
  var label,color,icon,headColor;
  var fullRaw=(res.W===0&&res.H>=res.N);
  if(res.terminal&&res.danger&&res.credit<1){
    label='DANGEROUS — NEAR MISS';color='st-incorrect';icon='&#10007;';headColor='var(--state-incorrect)';
  }
  else if(res.credit>=1){label='CORRECT';color='st-correct';icon='&#10004;';headColor='var(--state-correct)';}
  else if(res.single&&fullRaw){label='CORRECT';color='st-correct';icon='&#10004;';headColor='var(--state-correct)';}
  else if(res.credit>0){label='PARTIALLY CORRECT';color='st-partial';icon='&#10004;';headColor='var(--state-partial)';}
  else{label='INCORRECT';color='st-incorrect';icon='&#10007;';headColor='var(--state-incorrect)';}
  var h='<div class="block-h"><span class="ic">'+icon+'</span><span class="fb-title" style="color:'+headColor+'">'+label+'</span>';
  if(res.N>1||!res.single||hintUsed[ex.id])h+='<span class="fb-credit">credit '+res.credit.toFixed(2)+' — '+res.H+'/'+res.N+' items'+(res.W>0?' · '+res.W+' wrong':'')+(hintUsed[ex.id]?' · hint −0.10':'')+'</span>';
  h+='</div>';
  var b='<div class="block-b">';
  if(res.terminal&&res.danger)b+='<p style="color:var(--state-incorrect);font-weight:700">&#9888; Your command was close — and destructive. Read the warning below before running anything similar on a real host.</p>';
  b+='<div class="item-rows">';
  res.items.forEach(function(it){
    var mk=it.status==='correct'?'<span class="mk mk-c">&#10004; Correct</span>':it.status==='wrong'?'<span class="mk mk-w">&#10007; Wrong</span>':'<span class="mk mk-m">&#9675; Missed</span>';
    b+='<div class="item-row">'+mk+'<span>'+md(it.text)+'</span></div>';
  });
  b+='</div>';
  (ex.explanation||[]).forEach(function(p){b+='<p>'+md(p)+'</p>';});
  if(ex.perspectives&&(ex.perspectives.attacker||ex.perspectives.defender)){
    b+='<div class="persp">';
    if(ex.perspectives.attacker)b+='<div class="p-card red"><h6>&#9876; Attacker perspective</h6>'+md(ex.perspectives.attacker)+'</div>';
    if(ex.perspectives.defender)b+='<div class="p-card blue"><h6>&#128737; Defender perspective</h6>'+md(ex.perspectives.defender)+'</div>';
    b+='</div>';
  }
  if(res.terminal&&ex.answer.canonical){
    b+='<div class="canon"><h6>Canonical command (copyable)</h6><pre id="canon-cmd">'+esc(ex.answer.canonical)+'</pre>';
    if(ex.answer.canonicalParts&&ex.answer.canonicalParts.length){b+='<ul>';ex.answer.canonicalParts.forEach(function(p){b+='<li>'+md(p)+'</li>';});b+='</ul>';}
    if(ex.answer.expectedOutput)b+='<h6 style="margin-top:10px;color:var(--text-secondary)">Expected output shape</h6><pre>'+esc(ex.answer.expectedOutput)+'</pre>';
    b+='</div>';
  }
  if(res.credit<1&&ex.study)b+='<div class="study-tip">&#128161; <b>What to study:</b> '+md(ex.study)+'</div>';
  b+='</div>';
  return '<section class="block bl-feedback" aria-label="Feedback" aria-live="polite">'+h+b+'</section>';
}

        if(!c.trim())return;
        (a.expectedOutput&&a.expectedOutput.length?a.expectedOutput:['(simulated) command accepted — output suppressed until you press Check.']).forEach(function(l){line(l);});
      }
    });
    if(a.perExerciseTimeLimit){timer.perLimit=a.perExerciseTimeLimit;timer.perRemain=a.perExerciseTimeLimit;}
    else{timer.perLimit=0;timer.perRemain=0;}
  },
  lock:function(ex,root){var i=$('tin-'+ex.id);if(i)i.disabled=true;timer.perLimit=0;}
};
function perExExpired(){
  var ex=exam.list[exam.current];
  if(!ex||ex.result)return;
  var inp=$('tin-'+ex.id);if(inp)inp.disabled=true;
  doCheck(true);
}

WIDGETS['branching']={
  render:function(ex){
    return ansBox(ex,'<div id="br-'+ex.id+'"></div>');
  },
  bind:function(ex,root){
    renderBranchStep(ex,root);
  },
  lock:function(ex,root){root.querySelectorAll('#br-'+ex.id+' button, #br-'+ex.id+' .opt').forEach(function(b){b.disabled=true;});}
};
function renderBranchStep(ex,root){
  var a=ex.steps[ex._step];
  var holder=$('br-'+ex.id);
  var h='';
  h+='<div class="opts">';
  a._disp.forEach(function(o,i){
    h+='<button type="button" class="opt" data-i="'+i+'" aria-pressed="false"><span class="letter">'+String.fromCharCode(65+i)+'.</span><span>'+md(o.text)+'</span><span class="sel-mark"></span></button>';
  });
  h+='</div><div id="br-verdict-'+ex.id+'"></div><div class="step-actions">';
  h+='<button type="button" class="btn btn-amber" id="br-check-'+ex.id+'">'+(ex._step===ex.steps.length-1?'Check — final':'Check step')+'</button>';
  h+='<button type="button" class="btn hidden" id="br-cont-'+ex.id+'">Continue &#8594;</button></div>';
  holder.innerHTML=h;
  holder.querySelectorAll('.opt').forEach(function(btn){
    btn.addEventListener('click',function(){
      if(a._done)return;
      ex.steps[ex._step]._choice=parseInt(btn.getAttribute('data-i'),10);
      holder.querySelectorAll('.opt').forEach(function(b2){b2.classList.remove('selected');b2.setAttribute('aria-pressed','false');b2.querySelector('.sel-mark').textContent='';});
      btn.classList.add('selected');btn.setAttribute('aria-pressed','true');btn.querySelector('.sel-mark').textContent='✓ selected';
    });
  });
  $('br-check-'+ex.id).addEventListener('click',function(){
    if(ex.steps[ex._step]._choice===null)return;
    checkBranchStep(ex,root);
  });
  $('br-cont-'+ex.id).addEventListener('click',function(){
    ex._step++;
    var qb=$('q-block-'+ex.id);
    if(qb)qb.outerHTML=questionBlock(ex).replace('<section class="block bl-question"','<section id="q-block-'+ex.id+'" class="block bl-question"');
    renderBranchStep(ex,root);
    window.scrollTo({top:0,behavior:scrollBehavior()});
  });
}
function checkBranchStep(ex,root){
  var st=ex.steps[ex._step];
  st._done=true;
  var ok=(st._choice===st._corr);
  var v=$('br-verdict-'+ex.id);
  v.innerHTML='<div class="step-verdict" style="border-color:'+(ok?'var(--state-correct)':'var(--state-incorrect)')+'"><span style="font-weight:800;color:'+(ok?'var(--state-correct)':'var(--state-incorrect)')+'">'+(ok?'&#10004; Correct':'&#10007; Incorrect')+'</span><span class="muted small">'+md(st.options[st.correct])+'</span></div>';
  $('br-check-'+ex.id).disabled=true;
  root.querySelectorAll('#br-'+ex.id+' .opt').forEach(function(b){b.disabled=true;});
  if(ex._step<ex.steps.length-1){
    $('br-cont-'+ex.id).classList.remove('hidden');
  }else{
    doCheck(false);
  }
}

function renderHeaderTimer(){
  var el=$('hd-timer');if(!el)return;
  var txt,cls='';
  if(timer.state===STATE_RUN)txt='&#9654; RUNNING <span class="t">'+fmtClock(timer.remain)+'</span>';
  else if(timer.state===STATE_MAN){txt='&#9208; PAUSED — manual (press Resume) <span class="t">'+fmtClock(timer.remain)+'</span>';cls='st-paused';}
  else if(timer.state===STATE_AUTO){txt='&#9208; PAUSED — reviewing feedback (resumes on Next) <span class="t">'+fmtClock(timer.remain)+'</span>';cls='st-paused';}
  else if(timer.state===STATE_END)txt='&#9632; ENDED <span class="t">'+fmtClock(timer.remain)+'</span>';
  else txt='&#9679; READY <span class="t">'+fmtClock(timer.remain)+'</span>';
  el.className='hd-timer '+cls;
  el.innerHTML=txt;
  var pt=$('per-timer-'+(exam.list[exam.current]||{}).id);
  if(pt&&timer.perLimit>0)pt.textContent=fmtClock(timer.perRemain);
  var sc=$('hd-score');
  if(sc){
    var answered=Math.max(1,exam.graded);
    var pct=exam.graded>0?Math.round(exam.creditSum/exam.graded*100):0;
    sc.innerHTML='Score <span class="s">'+fmt1(exam.creditSum)+' / '+exam.graded+'</span> &nbsp;'+pct+'%';
  }
