<script>
/* T1586 exam engine — widgets: qcm, multi, match, order, sort, fill, terminal, branch.
   All widgets store their state on the runtime exercise object (ex._sel etc.) and
   expose grade(ex) -> {credit, breakdown, extraHTML} plus lock(ex). */
(function () {
  'use strict';
  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt !== undefined && txt !== null) n.textContent = txt;
    return n;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function scoreSet(sel, correct) {
    var cs = {}; correct.forEach(function (c) { cs[c] = 1; });
    var H = 0, W = 0, seen = {};
    (sel || []).forEach(function (k) {
      if (seen[k]) return; seen[k] = 1;
      if (cs[k]) H++; else W++;
    });
    var N = correct.length;
    var credit = N ? Math.max(0, (H - W) / N) : 0;
    return { credit: credit, H: H, W: W, N: N, formula: 'H=' + H + ' correct \u00B7 W=' + W + ' wrong \u00B7 N=' + N + ' \u2192 (' + H + ' \u2212 ' + W + ') \u00F7 ' + N + ' = ' + credit.toFixed(2) };
  }
  function mkMark(status) {
    var m = el('span', 'mark ' + (status === 'ok' ? 'ok' : status === 'bad' ? 'bad' : 'miss'));
    m.textContent = status === 'ok' ? '\u2713 Correct' : status === 'bad' ? '\u2717 Wrong' : '\u25CB Missed';
    return m;
  }

  var W = {};

  /* ---------------- QCM (single answer) + MULTI (multi-select) ---------------- */
  function buildChoice(ex, box) {
    var wrap = el('div', 'opts');
    var multi = ex.type === 'multi';
    if (multi) wrap.appendChild(el('p', 'mini', 'Select all that apply. Wrong selections subtract from correct ones (partial credit).'));
    ex._sel = ex._sel || [];
    var rows = [];
    ex._sh.forEach(function (oi, pos) {
      var o = ex.options[oi];
      var b = el('button', 'opt'); b.type = 'button';
      b.setAttribute('aria-pressed', ex._sel.indexOf(oi) >= 0 ? 'true' : 'false');
      b.appendChild(el('span', 'lab', String.fromCharCode(65 + pos) + '.'));
      b.appendChild(el('span', null, o.t));
      b.dataset.oi = String(oi);
      b.addEventListener('click', function () {
        if (ex._answered) return;
        if (!multi) { ex._sel = [oi]; }
        else {
          var i = ex._sel.indexOf(oi);
          if (i >= 0) ex._sel.splice(i, 1); else ex._sel.push(oi);
        }
        rows.forEach(function (r) {
          r.setAttribute('aria-pressed', ex._sel.indexOf(parseInt(r.dataset.oi, 10)) >= 0 ? 'true' : 'false');
        });
      });
      rows.push(b);
      wrap.appendChild(b);
    });
    box.appendChild(wrap);
    return {
      grade: function () {
        var correctKeys = [];
        ex.options.forEach(function (o, i) { if (o.c) correctKeys.push(i); });
        var r = scoreSet(ex._sel, correctKeys);
        var bd = [];
        ex.options.forEach(function (o, i) {
          var picked = ex._sel.indexOf(i) >= 0;
          if (o.c && picked) bd.push({ status: 'ok', text: o.t + ' ' + (o.why || '') });
          else if (o.c && !picked) bd.push({ status: 'miss', text: o.t + ' ' + (o.why || '') });
          else if (!o.c && picked) bd.push({ status: 'bad', text: o.t + ' ' + (o.why || '') });
        });
        return { credit: r.credit, breakdown: bd, formula: r.formula, explanation: ex.explanation };
      },
      lock: function () {
        rows.forEach(function (b) {
          b.disabled = true;
          var oi = parseInt(b.dataset.oi, 10);
          var o = ex.options[oi];
          var picked = ex._sel.indexOf(oi) >= 0;
          if (o.c) b.appendChild(mkMark(picked ? 'ok' : 'miss'));
          else if (picked) b.appendChild(mkMark('bad'));
        });
      }
    };
  }
  W.qcm = buildChoice; W.multi = buildChoice;

  /* ---------------- MATCH ---------------- */
  W.match = function (ex, box) {
    var grid = el('div', 'match-grid');
    var lc = el('div'), rc = el('div');
    lc.appendChild(el('div', 'mcol-h', 'ITEMS (fixed)'));
    rc.appendChild(el('div', 'mcol-h', 'MATCHES (shuffled \u2014 click an item, then its match)'));
    grid.appendChild(lc); grid.appendChild(rc);
    box.appendChild(grid);
    ex._assign = ex._assign || {};
    ex._selLeft = (ex._selLeft === undefined) ? null : ex._selLeft;
    var lrows = {}, rrows = {};
    function refresh() {
      Object.keys(lrows).forEach(function (k) {
        var i = parseInt(k, 10);
        lrows[k].classList.toggle('sel', ex._selLeft === i);
      });
      Object.keys(rrows).forEach(function (k) {
        var ri = parseInt(k, 10);
        var holder = rrows[k].querySelector('.pairtag');
        if (holder) holder.parentNode.removeChild(holder);
        var owner = null;
        Object.keys(ex._assign).forEach(function (lk) { if (ex._assign[lk] === ri) owner = parseInt(lk, 10); });
        if (owner !== null) {
          var pt = el('span', 'pairtag', '\u2192 ' + ex.pairs[owner].l);
          rrows[k].appendChild(pt);
        }
      });
    }
    ex.pairs.forEach(function (p, i) {
      var b = el('button', 'mrow'); b.type = 'button';
      b.appendChild(el('span', null, p.l));
      b.addEventListener('click', function () {
        if (ex._answered) return;
        ex._selLeft = (ex._selLeft === i) ? null : i;
        refresh();
      });
      lrows[i] = b; lc.appendChild(b);
    });
    ex._shR.forEach(function (ri) {
      var p = ex.pairs[ri];
      var b = el('button', 'mrow'); b.type = 'button';
      b.appendChild(el('span', null, p.r));
      b.addEventListener('click', function () {
        if (ex._answered) return;
        if (ex._selLeft === null) return;
        var cur = ex._assign[ex._selLeft];
        if (cur === ri) { delete ex._assign[ex._selLeft]; }
        else {
          Object.keys(ex._assign).forEach(function (lk) { if (ex._assign[lk] === ri) delete ex._assign[lk]; });
          ex._assign[ex._selLeft] = ri;
        }
        refresh();
      });
      rrows[ri] = b; rc.appendChild(b);
    });
    refresh();
    return {
      grade: function () {
        var H = 0, Wc = 0, bd = [];
        ex.pairs.forEach(function (p, i) {
          var a = ex._assign[i];
          if (a === undefined) bd.push({ status: 'miss', text: p.l + ' \u2014 not matched. Correct match: \u201C' + p.r + '\u201D. ' + (p.why || '') });
          else if (a === i) { H++; bd.push({ status: 'ok', text: p.l + ' \u2192 ' + p.r + ' ' + (p.why || '') }); }
          else { Wc++; bd.push({ status: 'bad', text: p.l + ' \u2192 ' + ex.pairs[a].r + ' is wrong. Correct: \u201C' + p.r + '\u201D. ' + (p.why || '') }); }
        });
        var N = ex.pairs.length;
        var credit = N ? Math.max(0, (H - Wc) / N) : 0;
        return { credit: credit, breakdown: bd, formula: 'H=' + H + ' correct \u00B7 W=' + Wc + ' wrong \u00B7 N=' + N + ' \u2192 (' + H + ' \u2212 ' + Wc + ') \u00F7 ' + N + ' = ' + credit.toFixed(2), explanation: ex.explanation };
      },
      lock: function () {
        ex.pairs.forEach(function (p, i) {
          var a = ex._assign[i];
          lrows[i].disabled = true;
          lrows[i].appendChild(mkMark(a === undefined ? 'miss' : (a === i ? 'ok' : 'bad')));
        });
        Object.keys(rrows).forEach(function (k) { rrows[k].disabled = true; });
      }
    };
  };

  /* ---------------- ORDER (timeline / ranking) ---------------- */
  W.order = function (ex, box) {
    var list = el('div', 'ordlist');
    box.appendChild(el('p', 'mini', 'Put the steps in the right order. Use the arrows (or drag \u2261). Each step in its correct position earns credit; a wrong position subtracts.'));
    ex._ord = ex._ord || ex._shI.slice();
    var rows = {};
    function redraw() {
      list.innerHTML = '';
      ex._ord.forEach(function (ii, pos) {
        var it = ex.items[ii];
        var r = el('div', 'ordrow'); r.dataset.oi = String(ii);
        r.appendChild(el('span', 'pos', (pos + 1) + '.'));
        var grip = el('span', 'grip', '\u2261'); grip.title = 'Drag to move';
        r.appendChild(grip);
        r.appendChild(el('span', 'txt', it.t));
        var up = el('button', 'obtn'); up.type = 'button'; up.textContent = '\u2191'; up.setAttribute('aria-label', 'move up');
        up.addEventListener('click', function () {
          if (ex._answered) return;
          var p = ex._ord.indexOf(ii);
          if (p > 0) { var t = ex._ord[p - 1]; ex._ord[p - 1] = ex._ord[p]; ex._ord[p] = t; redraw(); }
        });
        var dn = el('button', 'obtn'); dn.type = 'button'; dn.textContent = '\u2193'; dn.setAttribute('aria-label', 'move down');
        dn.addEventListener('click', function () {
          if (ex._answered) return;
          var p = ex._ord.indexOf(ii);
          if (p < ex._ord.length - 1) { var t = ex._ord[p + 1]; ex._ord[p + 1] = ex._ord[p]; ex._ord[p] = t; redraw(); }
        });
        r.appendChild(up); r.appendChild(dn);
        grip.addEventListener('pointerdown', function (ev) {
          if (ex._answered) return;
          ev.preventDefault();
          r.classList.add('dragging');
          function move(e2) {
            var tgt = document.elementFromPoint(e2.clientX, e2.clientY);
            var row = tgt && tgt.closest ? tgt.closest('.ordrow') : null;
            if (row && row.parentNode === list) {
              var from = ex._ord.indexOf(ii);
              var to = ex._ord.indexOf(parseInt(row.dataset.oi, 10));
              if (to >= 0 && to !== from) { ex._ord.splice(from, 1); ex._ord.splice(to, 0, ii); redraw(); }
            }
          }
          function up2() {
            r.classList.remove('dragging');

            window.removeEventListener('pointerup', up2);
          }
          window.addEventListener('pointermove', move);
          window.addEventListener('pointerup', up2);
        });
        rows[ii] = r;
        list.appendChild(r);
      });
    }
    redraw();
    box.appendChild(list);
    return {
      grade: function () {
        var H = 0, Wc = 0, bd = [];
        ex._ord.forEach(function (ii, pos) {
          var it = ex.items[ii];
          if (ii === pos) { H++; bd.push({ status: 'ok', text: 'Position ' + (pos + 1) + ': ' + it.t + ' ' + (it.why || '') }); }
          else { Wc++; bd.push({ status: 'bad', text: 'You put \u201C' + it.t + '\u201D at position ' + (pos + 1) + ', but it belongs at position ' + (ii + 1) + '. ' + (it.why || '') }); }
        });
        var N = ex.items.length;
        var credit = N ? Math.max(0, (H - Wc) / N) : 0;
        return { credit: credit, breakdown: bd, formula: 'H=' + H + ' in place \u00B7 W=' + Wc + ' out of place \u00B7 N=' + N + ' \u2192 (' + H + ' \u2212 ' + Wc + ') \u00F7 ' + N + ' = ' + credit.toFixed(2), explanation: ex.explanation };
      },
      lock: function () {
        ex._ord.forEach(function (ii, pos) {
          var r = rows[ii];
          r.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
          if (ii === pos) r.appendChild(mkMark('ok'));
          else {
            r.appendChild(mkMark('bad'));
            r.classList.add('reveal-pos');
            r.appendChild(el('span', 'mini', ' belongs at #' + (ii + 1)));
          }
        });
      }
    };
  };

  /* ---------------- SORT (drag into buckets) ---------------- */
  W.sort = function (ex, box) {
    var wrap = el('div', 'sort-wrap');
    var bankWrap = el('div');
    bankWrap.appendChild(el('div', 'mcol-h', 'ITEM BANK (shuffled \u2014 drag a chip into a bucket, or click chip then bucket)'));
    var bank = el('div', 'bank'); bankWrap.appendChild(bank);
    var bucketsW = el('div', 'buckets');

    }

    bucketEls.forEach(function (b, si) {
      b.addEventListener('dragover', function (ev) { ev.preventDefault(); });
      b.addEventListener('drop', function (ev) {
        ev.preventDefault();

    });
    redraw();
    return {
      grade: function () {
        var H = 0, Wc = 0, bd = [];
        ex.bank.forEach(function (it, bi) {
          var a = ex._assign[bi];
          var sn = ex.slots[a] ? ex.slots[a].name : '(not placed)';
          if (a === undefined) bd.push({ status: 'miss', text: '\u201C' + it.t + '\u201D not placed. Belongs in: ' + ex.slots[it.s].name + '. ' + (it.why || '') });
          else if (a === it.s) { H++; bd.push({ status: 'ok', text: '\u201C' + it.t + '\u201D \u2192 ' + sn + ' ' + (it.why || '') }); }
          else { Wc++; bd.push({ status: 'bad', text: '\u201C' + it.t + '\u201D placed in ' + sn + ', but belongs in ' + ex.slots[it.s].name + '. ' + (it.why || '') }); }
        });
        var N = ex.bank.length;
        var credit = N ? Math.max(0, (H - Wc) / N) : 0;
        return { credit: credit, breakdown: bd, formula: 'H=' + H + ' correct \u00B7 W=' + Wc + ' wrong \u00B7 N=' + N + ' \u2192 (' + H + ' \u2212 ' + Wc + ') \u00F7 ' + N + ' = ' + credit.toFixed(2), explanation: ex.explanation };
      },
      lock: function () {
        ex.bank.forEach(function (it, bi) {

          if (a === undefined || a !== it.s) {

  /* ---------------- FILL (word bank, shuffled) ---------------- */
  W.fill = function (ex, box) {
    var sent = el('div', 'fill-sentence');
    box.appendChild(sent);
    ex._blankSel = ex._blankSel || ex.blanks.map(function () { return -1; });
    var sels = [];

      grade: function () {

          else if (chosen === bl.a) { H++; bd.push({ status: 'ok', text: 'Blank ' + (i + 1) + ': \u201C' + chosen + '\u201D ' + (bl.why || '') }); }
          else { Wc++; bd.push({ status: 'bad', text: 'Blank ' + (i + 1) + ': \u201C' + chosen + '\u201D is wrong. Correct: \u201C' + bl.a + '\u201D. ' + (bl.why || '') }); }
        });
        var N = ex.blanks.length;
        var credit = N ? Math.max(0, (H - Wc) / N) : 0;
        return { credit: credit, breakdown: bd, formula: 'H=' + H + ' correct \u00B7 W=' + Wc + ' wrong \u00B7 N=' + N + ' \u2192 (' + H + ' \u2212 ' + Wc + ') \u00F7 ' + N + ' = ' + credit.toFixed(2), explanation: ex.explanation };
      },
      lock: function () {
        sels.forEach(function (s, i) {
          s.disabled = true;
          var v = ex._blankSel[i];

  /* ---------------- TERMINAL (fake shell) ---------------- */
  function normCmd(s) {
    /* Spec normaliser: trim, collapse spaces, ignore case for the COMMAND NAME only.
       Arguments keep their case so case-sensitive pieces (grep patterns, last -F vs -f)
       grade on real semantics. Per-exercise element regexes decide case sensitivity. */
    var t = String(s || '').trim().replace(/\s+/g, ' ');
    var sp = t.indexOf(' ');
    if (sp < 0) return t.toLowerCase();
    return t.slice(0, sp).toLowerCase() + t.slice(sp);
  }
  W.terminal = function (ex, box) {
    var t = ex.term;
    var term = el('div', 'term');
    var scr = el('div', 'scr');
    scr.textContent = (t.banner || []).join('\n') + '\n';
    term.appendChild(scr);
    var inline = el('div', 'inline');
    inline.appendChild(el('span', 'ps1', t.shell + ' '));
    var inp = el('input'); inp.type = 'text'; inp.autocomplete = 'off'; inp.spellcheck = false;
    inp.setAttribute('aria-label', 'terminal input');
    inline.appendChild(inp);
    term.appendChild(inline);
    var btns = el('div', 'tbtns');
    var clr = el('button', 'tbtn'); clr.type = 'button'; clr.textContent = 'Clear screen';
    clr.addEventListener('click', function () { scr.textContent = (t.banner || []).join('\n') + '\n'; inp.focus(); });
    btns.appendChild(clr);
    term.appendChild(btns);
    box.appendChild(term);
    if (t.syntax) {
      var sp = el('div', 'syntaxpanel');
      sp.appendChild(el('h4', null, 'SYNTAX REMINDER (this is an EASY exercise \u2014 the command shape is given)'));
      var pre = el('pre', 'code-alt'); pre.textContent = t.syntax; sp.appendChild(pre);
      if (t.sampleOut) {
        sp.appendChild(el('h4', null, 'EXPECTED OUTPUT SHAPE (example on a different target)'));
        var pre2 = el('pre', 'code-alt'); pre2.textContent = t.sampleOut; sp.appendChild(pre2);
      }
      box.appendChild(sp);
    }
    ex._termVal = '';
    function run() {
      var raw = inp.value;
      ex._termVal = raw;
      var line = t.shell + ' ' + raw;
      scr.textContent += line + '\n';
      if (normCmd(raw) === '') { inp.value = ''; return; }
      var n = normCmd(raw);
      var canonical = normCmd(t.canonical);
      var destructive = (t.dangerous || []).some(function (d) { return d.re.test(n); });
      /* output-visualisation only: case-insensitive where the exercise opts in
         (grading itself always uses the per-element regexes) */
      var exact = t.caseInsensitiveOutput
        ? (n.toLowerCase() === canonical.toLowerCase())
        : (n === canonical);
      if (destructive) {
        scr.textContent += 'SIMULATION HALTED: this command would change or destroy state. Nothing was run.\n';
      } else if (exact) {
        scr.textContent += (t.outputSample || 'ok') + '\n';
      } else {
        scr.textContent += 'simulated shell: no canned output for this exact input \u2014 press Check to grade it.\n';
      }
      inp.value = '';
      scr.scrollTop = scr.scrollHeight;
    }
    inp.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); run(); }
    });
    return {
      grade: function () {
        var n = normCmd(ex._termVal || inp.value);
        var bd = [];
        var H = 0, Wc = 0;
        var destructiveHit = null;
        (t.dangerous || []).forEach(function (d) {
          if (d.re.test(n)) destructiveHit = d;
        });
        t.elements.forEach(function (e) {
          if (e.re.test(n)) { H++; bd.push({ status: 'ok', text: e.name + ': present. ' + (e.why || '') }); }
          else bd.push({ status: 'miss', text: e.name + ': missing or different. ' + (e.why || '') });
        });
        (t.wrong || []).forEach(function (w) {
          if (w.re.test(n)) { Wc++; bd.push({ status: 'bad', text: w.name + ': used. ' + (w.why || '') }); }
        });
        var N = t.elements.length;
        var credit = destructiveHit ? 0 : (N ? Math.max(0, (H - Wc) / N) : 0);
        if (destructiveHit) {
          bd.unshift({ status: 'bad', text: 'DANGEROUS COMMAND: ' + destructiveHit.why });
        }
        var formula = 'H=' + H + ' required elements present \u00B7 W=' + Wc + ' wrong elements \u00B7 N=' + N + ' \u2192 (' + H + ' \u2212 ' + Wc + ') \u00F7 ' + N + ' = ' + credit.toFixed(2) + (destructiveHit ? ' (forced to 0: destructive command \u2014 nothing was run)' : '');
        var extra =
          '<div class="canon"><b>Canonical command (copyable):</b>' +
          '<pre class="code" id="canon-cmd">' + esc(t.canonical) + '</pre>' +
          '<button class="copybtn" type="button" data-copy="canon-cmd">Copy command</button>' +
          '<p class="mini">' + esc(t.canonicalWhy || '') + '</p></div>';
        if (t.nearMiss) extra += '<p class="mini">' + esc(t.nearMiss) + '</p>';
        return { credit: credit, breakdown: bd, formula: formula, extraHTML: extra, explanation: ex.explanation };
      },
      lock: function () {
        inp.disabled = true;
        clr.disabled = true;
      }
    };
  };

  /* ---------------- BRANCH (decision tree) ---------------- */
  W.branch = function (ex, box) {
    ex._stepAns = ex._stepAns || [];
    var holder = el('div');
    box.appendChild(holder);
    /* Answered (or re-visited after answering): render every step read-only with marks. */
    function drawAnswered() {
      holder.innerHTML = '';
      ex.steps.forEach(function (st, i) {
        var d = el('div', 'branch-step');
        d.appendChild(el('div', 'step-tag', 'STEP ' + (i + 1) + ' OF ' + ex.steps.length + ' \u2014 answered'));
        if (st.ctx) d.appendChild(el('p', 'mini', st.ctx));
        d.appendChild(el('p', 'stepq', st.q));
        var opts = el('div', 'opts');
        var chosen = ex._stepAns[i];
        ex._shSteps[i].forEach(function (oi, pos) {
          var o = st.options[oi];
          var b = el('button', 'opt'); b.type = 'button'; b.disabled = true;
          b.setAttribute('aria-pressed', chosen === oi ? 'true' : 'false');
          b.appendChild(el('span', 'lab', String.fromCharCode(65 + pos) + '.'));
          b.appendChild(el('span', null, o.t));
          if (o.c) b.appendChild(mkMark(chosen === oi ? 'ok' : 'miss'));
          else if (chosen === oi) b.appendChild(mkMark('bad'));
          opts.appendChild(b);
        });
        d.appendChild(opts);
        holder.appendChild(d);
      });
      var chips = el('div');
      ex.steps.forEach(function (s2, j) {
        var done = ex._stepAns[j] !== undefined;
        chips.appendChild(el('span', 'stepchip', 'Step ' + (j + 1) + (done ? ' \u2713 answered' : ' \u25CB not answered')));
      });
      holder.appendChild(chips);
    }
    function drawStep() {
      if (ex._answered) { drawAnswered(); return; }
      holder.innerHTML = '';
      var i = ex._stepIdx;
      var st = ex.steps[i];
      var d = el('div', 'branch-step');
      d.appendChild(el('div', 'step-tag', 'STEP ' + (i + 1) + ' OF ' + ex.steps.length));
      if (st.ctx) d.appendChild(el('p', 'mini', st.ctx));
      d.appendChild(el('p', 'stepq', st.q));
      var opts = el('div', 'opts');
      var selIdx = ex._stepSel;
      var rows = [];
      ex._shSteps[i].forEach(function (oi, pos) {
        var o = st.options[oi];
        var b = el('button', 'opt'); b.type = 'button';
        b.setAttribute('aria-pressed', ex._stepSel === oi ? 'true' : 'false');
        b.appendChild(el('span', 'lab', String.fromCharCode(65 + pos) + '.'));
        b.appendChild(el('span', null, o.t));
        b.addEventListener('click', function () {
          if (ex._answered) return;
          ex._stepSel = oi;
          rows.forEach(function (r) { r.setAttribute('aria-pressed', 'false'); });
          b.setAttribute('aria-pressed', 'true');
          confirmBtn.disabled = false;
        });
        rows.push(b);
        opts.appendChild(b);
      });
      d.appendChild(opts);
      var bar = el('div', 'controls');
      var confirmBtn = el('button', 'cbtn'); confirmBtn.type = 'button';
      confirmBtn.disabled = (ex._stepSel === undefined || ex._stepSel === null);
      confirmBtn.textContent = (i === ex.steps.length - 1) ? 'Confirm & run final Check' : 'Confirm & continue (timer keeps running)';
      confirmBtn.addEventListener('click', function () {
        if (ex._answered || ex._stepSel === undefined) return;
        ex._stepAns[i] = ex._stepSel;
        ex._stepSel = undefined;
        if (i < ex.steps.length - 1) {
          ex._stepIdx = i + 1;
          drawStep();
        } else {
          var btn = document.getElementById('btn-check');
          if (btn) btn.click();
        }
      });
      bar.appendChild(confirmBtn);
      if (i > 0 && !ex._answered) {
        var back = el('button', 'cbtn ghost'); back.type = 'button'; back.textContent = '\u2190 Previous step';
        back.addEventListener('click', function () {
          if (ex._answered) return;
          ex._stepIdx = i - 1;
          ex._stepSel = ex._stepAns[i - 1];
          drawStep();
        });
        bar.appendChild(back);
      }
      d.appendChild(bar);
      holder.appendChild(d);
      /* progress chips */
      var chips = el('div');
      ex.steps.forEach(function (s2, j) {
        var lab = 'Step ' + (j + 1) + (j < ex._stepAns.length && ex._stepAns[j] !== undefined ? ' \u2713 answered' : (j === ex._stepIdx ? ' \u25B6 current' : ' \u00B7 pending'));
        chips.appendChild(el('span', 'stepchip', lab));
      });
      holder.appendChild(chips);
    }
    ex._stepSel = undefined;
    drawStep();
    return {
      grade: function () {
        var H = 0, Wc = 0, bd = [];
        ex.steps.forEach(function (st, i) {
          var chosen = ex._stepAns[i];
          if (chosen === undefined) { bd.push({ status: 'miss', text: 'Step ' + (i + 1) + ' not answered. Correct: \u201C' + st.options.filter(function (o) { return o.c; })[0].t + '\u201D. ' + (st.options.filter(function (o) { return o.c; })[0].why || '') }); return; }
          var o = st.options[chosen];
          if (o.c) { H++; bd.push({ status: 'ok', text: 'Step ' + (i + 1) + ': ' + o.t + ' ' + (o.why || '') }); }
          else {
            Wc++;
            var correctOpt = st.options.filter(function (oo) { return oo.c; })[0];
            bd.push({ status: 'bad', text: 'Step ' + (i + 1) + ': you chose \u201C' + o.t + '\u201D. Correct: \u201C' + correctOpt.t + '\u201D. ' + (correctOpt.why || '') });
          }
        });
        var N = ex.steps.length;
        var credit = N ? Math.max(0, (H - Wc) / N) : 0;
        return { credit: credit, breakdown: bd, formula: 'H=' + H + ' steps correct \u00B7 W=' + Wc + ' wrong \u00B7 N=' + N + ' \u2192 (' + H + ' \u2212 ' + Wc + ') \u00F7 ' + N + ' = ' + credit.toFixed(2), explanation: ex.explanation };
      },
      lock: function () {
        ex._answered = true;
        drawAnswered(); /* re-render all steps read-only with per-step marks */
      }
    };
  };

  W.build = function (ex, box) {
    ex._stepSel = undefined;
    return W[ex.type](ex, box);
  };
  W.lock = function (ex) {
    /* lock happens inside each widget via its own closure on grade(); noop here */
  };
  window.ExWidgets = W;
})();

</script>
<script>
/* T1586 exam engine — core: state, timer state machine, flow, scoring, results.
   All vanilla JS, no external requests. */
(function () {
  'use strict';
  var DATA = window.EXAM;
  var APP, HDR;
  var S = null;
  var TICK = null;

  /* ---------- small helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt !== undefined && txt !== null) n.textContent = txt;
    return n;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function sh(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }
  function fmtTime(sec) {
    sec = Math.max(0, sec);
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function clone(o) {
    /* JSON round-trip destroys RegExp (term patterns) \u2014 use a structure-aware deep clone */
    if (o === null || typeof o !== 'object') return o;
    if (typeof RegExp !== 'undefined' && o instanceof RegExp) return new RegExp(o.source, o.flags);
    if (Array.isArray(o)) return o.map(clone);
    var r = {};
    Object.keys(o).forEach(function (k) { r[k] = clone(o[k]); });
    return r;
  }

  /* Partial-credit scoring: max(0, (H - W) / N) */
  function scoreSet(sel, correct) {
    var cs = {}; correct.forEach(function (c) { cs[c] = 1; });
    var H = 0, W = 0, seen = {};
    (sel || []).forEach(function (k) {
      if (seen[k]) return; seen[k] = 1;
      if (cs[k]) H++; else W++;
    });
    var N = correct.length;
    return { credit: N ? Math.max(0, (H - W) / N) : 0, H: H, W: W, N: N };
  }

  /* ---------- fresh state ---------- */
  function freshState() {
    var exs = DATA.exercises.map(function (e) { return clone(e); });
    exs.forEach(function (e) {
      e._hintUsed = false;
      e._answered = false;
      e._res = null;
      if (e.type === 'qcm' || e.type === 'multi') e._sh = sh(e.options.map(function (o, i) { return i; }));
      if (e.type === 'match') e._shR = sh(e.pairs.map(function (p, i) { return i; }));
      if (e.type === 'order') e._shI = sh(e.items.map(function (it, i) { return i; }));
      if (e.type === 'sort') { e._shB = sh(e.bank.map(function (b, i) { return i; })); e._assign = {}; }

      if (e.type === 'branch') { e._shSteps = e.steps.map(function (st) { return sh(st.options.map(function (o, i) { return i; })); }); e._stepIdx = 0; e._stepAns = []; }
    });

    return {

  /* ---------- timer state machine ---------- */
  function setTState(st) {

  function startTimer() { setTState('RUNNING'); }
  function tick() {

      S.remain--;
      if (S.remain <= 0) { S.remain = 0; renderHeader(); timeUp(); return; }
      var ex = curEx();
      if (ex && ex._exDeadline && !ex._answered && S.screen === 'exam') {
        var left = Math.ceil((ex._exDeadline - Date.now()) / 1000);
        var chip = $('ex-timer');
        if (chip) chip.textContent = '\u23F1 ' + Math.max(0, left) + ' s left for this exercise';
        if (left <= 0) { doCheck(); }
      }
    } else if (S.tState === 'PAUSED_MANUAL') {
      S.pauseSec.manual++;
    } else if (S.tState === 'PAUSED_AUTO_CHECK') {

  function timeUp() {

  /* ---------- boot ---------- */

    renderIntro();
    if (TICK) clearInterval(TICK);
    TICK = setInterval(tick, 1000);
    renderHeader();
    document.addEventListener('click', function (ev) {
      var t = ev.target;
      if (t && t.getAttribute && t.getAttribute('data-copy')) {
        var src = $(t.getAttribute('data-copy'));
        if (!src) return;
        var txt = src.textContent;
        var done = function () {
          var old = t.textContent; t.textContent = 'Copied!';
          setTimeout(function () { t.textContent = old; }, 1200);
        };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt, done); });
          } else fallbackCopy(txt, done);
        } catch (e) { fallbackCopy(txt, done); }
      }
    });
  }
  function fallbackCopy(txt, done) {
    try {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta); done();
    } catch (e) { /* clipboard unavailable */ }
  }

  /* ---------- header rendering ---------- */
  var TSTATE_TXT = {

  /* ---------- exam rendering ---------- */

  function buildLogView(cfg) {

  /* ---------- actions ---------- */
  function onHint() {

  function onPauseToggle() {
    if (S.tState === 'PAUSED_MANUAL') { resumeFromManual(); return; }
    if (S.tState === 'RUNNING' || S.tState === 'PAUSED_AUTO_CHECK') {
      setTState('PAUSED_MANUAL');
      var veil = el('div', 'pauseveil'); veil.id = 'pause-veil';
      veil.appendChild(el('h2', null, '\u23F8 Paused \u2014 manual break'));

      var b = el('button', 'cbtn'); b.type = 'button'; b.textContent = '\u25B6 Resume';
      b.addEventListener('click', onPauseToggle);
      veil.appendChild(b);
      document.body.appendChild(veil);
      renderHeader();
    }

  function resumeFromManual() {
    removeVeil();

  function removeVeil() {

  }
  function onSkip() {

    ex._skipped = true;
    advance();
  }
  function doCheck() {
    var ex = curEx();
    if (!ex || ex._answered) return;
    if (ex.type === 'branch' && ex._stepAns.filter(function (a) { return a !== undefined; }).length < ex.steps.length) {
      var nn = $('check-note');
      if (nn) nn.textContent = 'Answer every step first, then press the step button to run the final Check.';
      return;
    }
    if (!ex._gradeFn) return;
    var res = ex._gradeFn();
    if (res === null) return; /* widget says not ready */
    if (ex._hintUsed) res.credit = Math.max(0, res.credit - 0.10);
    res.credit = Math.max(0, Math.min(1, res.credit));
    ex._answered = true;
    ex._res = res;
    S.creditSum += res.credit;
    S.answeredCount++;
    setTState('PAUSED_AUTO_CHECK'); /* Check-triggered auto-pause, before rendering feedback */
    renderFeedback(res, ex);
    if (ex._lockFn) ex._lockFn();
    renderHeader();
    var btn = $('btn-check'); if (btn) btn.disabled = true;

  }
  function renderFeedback(res, ex) {
    var old = $('feedback-block'); if (old) old.parentNode.removeChild(old);
    var oldN = $('btn-next'); if (oldN) oldN.parentNode.removeChild(oldN);
    var fb = el('div', 'feedback'); fb.id = 'feedback-block';
    var lbl, cls;
    if (res.credit >= 0.999) { lbl = '\u2713 CORRECT'; cls = 'fb-ok'; }
    else if (res.credit > 0) { lbl = '\u2713 PARTIALLY CORRECT \u2014 credit ' + res.credit.toFixed(2); cls = 'fb-part'; }
    else { lbl = '\u2717 INCORRECT'; cls = 'fb-bad'; }
    fb.className = 'feedback ' + cls;
    fb.setAttribute('role', 'status');
    var h = el('h3'); h.textContent = lbl; fb.appendChild(h);
    if (res.formula) fb.appendChild(el('p', 'mini', 'Credit computation: ' + res.formula));
    if (ex._hintUsed) fb.appendChild(el('p', 'mini', 'A hint was used: \u22120.10 applied to this exercise\u2019s credit.'));
    if (res.breakdown && res.breakdown.length) {
      var ul = el('ul', 'fbreak');
      res.breakdown.forEach(function (b) {
        var li = el('li');
        var st = el('b');
        st.textContent = (b.status === 'ok' ? '\u2713 Correct \u2014 ' : b.status === 'bad' ? '\u2717 Wrong \u2014 ' : '\u25CB Missed \u2014 ');
        li.appendChild(st);
        li.appendChild(document.createTextNode(b.text));
        ul.appendChild(li);
      });
      fb.appendChild(ul);
    }
    if (res.extraHTML) { var d = el('div'); d.innerHTML = res.extraHTML; fb.appendChild(d); }
    var ex1 = el('div', 'expl');
    ex1.appendChild(el('h4', null, 'Why (plain words)'));
    String(res.explanation || ex.explanation || '').split('\n').forEach(function (t) {

    });
    if (ex.study) { ex1.appendChild(el('h4', null, 'What to study')); ex1.appendChild(el('p', null, ex.study)); }
    fb.appendChild(ex1);
    var scr = $('scr-exam');
    var ctl = $('btn-check');
    if (ctl && ctl.parentNode) ctl.parentNode.insertBefore(fb, ctl.nextSibling);
    else scr.appendChild(fb);
    /* Next / Final Submit */
    var nxt = el('button', 'cbtn'); nxt.type = 'button'; nxt.id = 'btn-next';
    var isLast = (S.ptr >= S.order.length - 1);
    var anySkipped = S.exs.some(function (e2) { return e2._skipped && !e2._answered; });
    nxt.textContent = isLast ? (anySkipped ? 'Review skipped exercises' : 'Final Submit') : 'Next \u2192';
    nxt.style.marginLeft = '10px';
    ctl.parentNode.insertBefore(nxt, fb.nextSibling);
    nxt.addEventListener('click', onNext);
    nxt.focus();
  }
  function onNext() {
    removeVeil();
    if (S.fromReview) { goReview(); return; }
    if (S.ptr >= S.order.length - 1) { goAfterLast(); return; }
    S.ptr++;
    if (S.tState === 'PAUSED_AUTO_CHECK') startTimer();
    renderCurrent();
  }
  function advance() {
    if (S.fromReview) { goReview(); return; }
    if (S.ptr >= S.order.length - 1) { goAfterLast(); return; }
    S.ptr++;
    renderCurrent();
  }
  function goAfterLast() {
    var anySkipped = S.exs.some(function (e2) { return e2._skipped && !e2._answered; });
    if (anySkipped) { if (S.tState !== 'ENDED') startTimer(); goReview(); }
    else showResults();
  }
  function goReview() {
    S.fromReview = false;
    if (S.tState === 'PAUSED_AUTO_CHECK') startTimer();
    showScreen('review');
    var scr = $('scr-review');
    scr.innerHTML = '';
    var p = el('div', 'panel');
    p.appendChild(el('h2', null, 'Review skipped exercises'));
    p.appendChild(el('p', null, 'These exercises were skipped and never answered. You can return to each one and answer it as many times as you need, as long as the timer has not ended. If you submit while one is still unanswered, it is excluded from your score (it is not counted as right or wrong).'));
    var ul = el('ul', 'sklist');
    var any = false;
    S.order.forEach(function (idx) {
      var e = S.exs[idx];
      if (e._skipped && !e._answered) {
        any = true;
        var li = el('li');
        li.appendChild(el('span', 't', 'Exercise \u201C' + (e.title || e.id) + '\u201D \u2014 ' + (e.summary || '')));
        var b = el('button', 'cbtn'); b.type = 'button'; b.textContent = 'Answer it';
        b.addEventListener('click', function () {
          S.fromReview = true;
          S.ptr = S.order.indexOf(idx);
          if (S.tState === 'PAUSED_AUTO_CHECK' || S.tState === 'IDLE') startTimer();
          showScreen('exam');
          renderCurrent();
        });
        li.appendChild(b);
        ul.appendChild(li);
      }
    });
    if (!any) {
      p.appendChild(el('p', null, 'Nothing is left unanswered. You can submit.'));
    }
    p.appendChild(ul);
    var fs = el('button', 'cbtn'); fs.type = 'button'; fs.textContent = 'Final Submit';
    fs.style.marginTop = '14px';
    fs.addEventListener('click', function () { showResults(); });
    p.appendChild(fs);
    scr.appendChild(p);
    renderHeader();
  }

  /* ---------- results ---------- */
  function showResults() {
    removeVeil();
    if (S.tState !== 'ENDED') setTState('ENDED');
    var full = 0, part = 0, zero = 0, skipped = 0, partSum = 0;
    S.exs.forEach(function (e) {
      if (e._answered) {
        if (e._res.credit >= 0.999) full++;
        else if (e._res.credit > 0) { part++; partSum += e._res.credit; }
        else zero++;
      } else {
        skipped++;
      }
    });
    var answered = full + part + zero;
    var percent = answered > 0 ? Math.round((S.creditSum / answered) * 100) : 0;
    var passed = percent >= DATA.meta.passMark;
    showScreen('results');
    var scr = $('scr-results');
    scr.innerHTML = '';
    var p = el('div', 'panel');
    p.appendChild(el('h2', null, 'Results \u2014 ' + DATA.intro.objectTitle + ' (' + DATA.meta.severityLabel + ')'));
    p.appendChild(el('div', 'res-big', S.creditSum.toFixed(1) + ' / ' + answered + '  (' + percent + '%)'));
    p.appendChild(el('p', 'mini', 'Skipped-and-never-answered exercises are excluded from both the score and the total. The final percentage is computed only over answered exercises.'));
    var grid = el('div', 'res-grid');
    function rc(lab, val) { var c = el('div', 'res-card'); c.appendChild(el('b', null, val)); c.appendChild(el('span', null, lab)); grid.appendChild(c); }
    rc('fully correct (credit 1.0)', String(full));
    rc('partially correct (avg ' + (part ? (partSum / part).toFixed(2) : 'n/a') + ')', String(part));
    rc('fully incorrect (credit 0.0)', String(zero));
    rc('skipped \u2014 excluded', String(skipped));
    p.appendChild(grid);
    var cert = el('div', 'cert' + (passed ? '' : ' fail'));
    if (passed) {
      cert.appendChild(el('h2', null, '\u2713 PASS'));
      cert.appendChild(el('p', null, 'Congratulations' + (S.username ? ', ' + S.username : '') + '! You reached ' + percent + '%, above the ' + DATA.meta.passMark + '% pass mark for the ' + DATA.meta.severityLabel + ' tier of T1586 Compromise Accounts.'));
      cert.appendChild(el('p', 'mini', 'CyberPulseAcademy \u00B7 T1586 \u00B7 ' + DATA.meta.severityLabel + ' tier \u00B7 certificate-style record'));
    } else {
      cert.appendChild(el('h2', null, '\u2717 FAIL \u2014 retake needed'));
      cert.appendChild(el('p', null, 'You reached ' + percent + '%, below the ' + DATA.meta.passMark + '% pass mark. Review the feedback, study the missed items, then retake the exam. Questions and answer choices are shuffled again on every attempt.'));
    }
    var rt = el('button', 'cbtn'); rt.type = 'button'; rt.textContent = 'Retake Exam';
    rt.style.marginTop = '12px';
    rt.addEventListener('click', function () { boot(); });
    cert.appendChild(rt);
    p.appendChild(cert);
    var pauseInfo = el('p', 'mini', 'Time spent paused: manual ' + fmtTime(S.pauseSec.manual) + ' \u00B7 reviewing feedback (auto-pause) ' + fmtTime(S.pauseSec.auto) + ' \u00B7 time left on the clock: ' + fmtTime(S.remain) + '.');
    p.appendChild(pauseInfo);
    var ul = el('ul', 'perex');
    S.order.forEach(function (idx, n) {
      var e = S.exs[idx];
      var li = el('li');
      var st;
      if (e._answered) {
        var c = e._res.credit;
        st = c >= 0.999 ? '\u2713 CORRECT (1.00)' : (c > 0 ? '\u2713 PARTIALLY CORRECT (' + c.toFixed(2) + ')' : '\u2717 INCORRECT (0.00)');
      } else {
        st = '\u26A0 NOT ANSWERED \u2014 EXCLUDED';
      }
      li.appendChild(el('b', null, (n + 1) + '.'));
      li.appendChild(el('span', null, (e.title || e.id)));
      li.appendChild(el('span', 'typechip', st));
      ul.appendChild(li);
    });
    p.appendChild(ul);
    scr.appendChild(p);
    reportScore(S.creditSum, answered);
  }

  /* ---------- website integration ---------- */
  function reportScore(creditSum, answeredCount) {
    if (S.reported) return;
    S.reported = true;
    var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: DATA.meta.topicId,
        batch: DATA.meta.batch,
        score: Math.round(creditSum),
        total: answeredCount,
        percent: percent,
        passed: percent >= DATA.meta.passMark
      }, location.origin);
    } catch (e) { /* opened directly; nothing to report to */ }
  }
  window.addEventListener('message', function (event) {
    if (!event.data) return;
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
    try {
      if (event.data.username) {
        window.__cm_username = String(event.data.username).slice(0, 40);
        if (S) { S.username = window.__cm_username; if (S.screen === 'intro') renderIntro(); }
      }
    } catch (e) { /* ignore malformed init */ }
  });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
