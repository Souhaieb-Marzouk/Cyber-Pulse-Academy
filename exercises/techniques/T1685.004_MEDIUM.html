window.CM_META = {"topicId": "t1685.004", "batch": 2, "title": "T1685.004 Disable or Modify Linux Audit System Log — MEDIUM", "difficulty": "medium", "questionCount": 16, "estimatedMinutes": 36, "passMark": 70, "sev": "medium", "sevName": "MEDIUM", "sevColor": "#ffb454", "objId": "T1685.004", "objName": "Disable or Modify Linux Audit System Log", "objLine": "T1685.004 — Disable or Modify Linux Audit System Log", "objType": "Sub-Technique", "timerMinutes": 36, "timerSeconds": 2160, "partLabel": null, "keywords": [{"theme": "Components & configuration (deeper)", "items": ["auditd daemon lifecycle", "auditctl live rule management", "/etc/audit/audit.rules vs audit.conf", "/var/log/audit/audit.log", "systemd unit states (active / enabled)"]}, {"theme": "Attacker execution paths", "items": ["systemctl stop / disable auditd", "auditctl -D and auditctl -e 0", "Editing rules or config files", "Killing the auditd process", "Why attackers pick one path over another"]}, {"theme": "Telemetry & data sources", "items": ["Command: Command Execution", "Process: Process Termination", "File: File Modification", "Service: Service Metadata", "EDR and SIEM log-source health"]}, {"theme": "Detection logic basics & false positives", "items": ["Alert on auditctl invocations", "Alert on service stop/disable", "FIM on /etc/audit/*", "Change-window and automation false positives", "Log-source heartbeat alerting"]}, {"theme": "Neighbour techniques (do not confuse)", "items": ["T1070.002 — Clear Linux or Mac System Logs", "T1685 — Disable or Modify Tools (parent)", "Clearing files vs disabling the logging system", "Benign admin activity vs tampering"]}], "types": ["Log analysis with a filter box (Kibana-style viewer)", "Multiple-choice questions (pick one answer)", "Multi-select questions (partial credit)", "Matching (link events to techniques or controls)", "Fill-in-the-blank from a shuffled word bank", "Sort events into bins (click or drag & drop)", "Order the response steps", "Branching decisions (step-by-step, graded at the end)", "One terminal exercise (type a read-only auditctl query)"], "learnTitle": "What you will learn here", "learnBody": "<p><b>You already know the basics</b> — now we connect two ideas at a time. This exam is about <b>T1685.004 — Disable or Modify Linux Audit System Log</b>, a <b>Sub-Technique</b> in MITRE ATT&CK. Its parent is <b>T1685 — Disable or Modify Tools</b> and its tactic is <b>TA0005 — Defense Evasion</b>. Here you will not just name the technique — you will decide <i>what happened</i>, <i>which telemetry proves it</i>, and <i>which control belongs where</i>.</p><p>Picture your working day: your SIEM shows a log source going quiet. You check the host: the auditd service was stopped at 03:11 by a deploy account. Was that a change window? An attacker? A misfired automation job? Answering that needs two steps: first understand the mechanism (auditctl, systemctl, the rules files, process kills), then map what you see to ATT&CK data sources and controls.</p><p>You will also learn to separate this technique from its neighbours: clearing already-written log files (T1070.002) is different from disabling the logging system itself (T1685.004), and touching rsyslog is the broader parent T1685 territory. SOC analysts, detection engineers, incident responders and GRC analysts all use these distinctions daily when they triage alerts, build detections, scope incidents, and document controls.</p>"};
window.CM_EXERCISES = [{"id": "med-01-journal-two", "type": "multi", "tag": "Journal triage", "summary": "Pick the two journal events consistent with audit tampering", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Context", "text": "You cover the night shift for a fintech company. At 06:00 the SIEM raises one alert: \"auditd host ci-runner-05 silent for 40 minutes\". You pull the systemd journal for the window. Decide which lines actually match T1685.004 behaviour — the rest is routine noise."}, {"k": "log", "label": "ARTEFACT 2 — journalctl -u auditd + auth excerpt, ci-runner-05", "lines": ["Oct 14 02:31:01 ci-runner-05 CROND[8811]: (root) CMD (/usr/local/bin/fleet-update.sh)", "Oct 14 02:33:10 ci-runner-05 sudo: jenkins : TTY=unknown ; USER=root ; COMMAND=/usr/bin/systemctl stop auditd", "Oct 14 02:33:11 ci-runner-05 systemd[1]: Stopped Audit Service.", "Oct 14 02:33:30 ci-runner-05 packagekit[2210]: new package audit-2.8.5 queued for install", "Oct 14 02:34:02 ci-runner-05 sudo: jenkins : TTY=unknown ; USER=root ; COMMAND=/usr/sbin/auditctl -D", "Oct 14 02:34:05 ci-runner-05 systemd[1]: Reloading.", "Oct 14 02:41:19 ci-runner-05 sshd[9123]: Accepted publickey for buildbot from 10[.]31[.]7[.]12 port 49322"]}], "question": "Which TWO events are consistent with disabling or modifying the Linux Audit system?", "hint": "One event changed the service state, one emptied the kernel rule set. Package install and the SSH login are routine.", "explain": "The systemctl stop auditd command (Stopped Audit Service) matches the service-disabling path, and auditctl -D matches the rule-flushing path — together they explain the silent log source. The package line is ordinary package activity, the reload line is generic, and the SSH login is context, not tampering.", "study": "When a log source goes silent, look for a service-state change plus a rule change in the minutes before.", "options": [{"t": "systemd reports \"Stopped Audit Service\" after a jenkins sudo command", "correct": true}, {"t": "sudo runs /usr/sbin/auditctl -D as root", "correct": true}, {"t": "packagekit queues a new audit package for install", "correct": false}, {"t": "sshd accepts a public key for buildbot", "correct": false}, {"t": "systemd logs a generic \"Reloading.\"", "correct": false}]}, {"id": "med-02-why-e0", "type": "mcq", "tag": "Attacker trade-offs", "summary": "Explain why an attacker prefers auditctl -e 0 over deleting log files", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Red-team debrief question", "text": "Your purple-team partner asks why, in their playbook, the \"disable audit\" step uses auditctl -e 0 instead of deleting /var/log/audit/audit.log. Both stop you from reading audit data. What is the real difference that makes the -e 0 route attractive to an attacker?"}], "question": "Why would an attacker choose auditctl -e 0 over deleting the audit log file?", "hint": "Think about what each action leaves behind: one changes a kernel switch, the other destroys files that already exist.", "explain": "auditctl -e 0 turns the kernel audit subsystem off — nothing new gets recorded, and no files vanish, so file-integrity or log-deletion alarms stay quiet. Deleting /var/log/audit/audit.log is the T1070.002 clearing behaviour: it is louder, destroys evidence already written, and often triggers FIM or space-change alerts. Attackers pick the quieter, reversible-in-appearance switch.", "dual": {"red": "From the red side: -e 0 gives a clean future with a quiet past — no file hashes change, no log files go missing.", "blue": "From the blue side: that is exactly why service-state and command telemetry matter more than file watching alone."}, "study": "Compare T1685.004 (disable the system) with T1070.002 (clear the files) — they leave different traces.", "options": [{"t": "It silences future logging without changing or deleting any files", "correct": true}, {"t": "It removes evidence of everything that already happened", "correct": false}, {"t": "It also stops rsyslog and journald at the same time", "correct": false}, {"t": "It survives a reboot without any persistence step", "correct": false}]}, {"id": "med-03-dual-persp", "type": "branch", "tag": "Dual perspective", "summary": "Red then blue: choose the evasion step, then the detection that catches it", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Purple-team exercise card", "text": "A purple-team exercise targets lab host lab-lin-03. Red side: you already hold root through a lab-only account. Blue side: you own the detection stack (EDR agent + file-integrity monitoring + SIEM). The exercise has two steps — one answered from each side. The final Check grades both steps together."}], "question": "Answer both steps: the red choice first, then the blue detection.", "hint": "Step 1: which action keeps future sessions unlogged every time it runs, not just once? Step 2: which telemetry sees the enabling change?", "explain": "Step 1 (red): hooking the audit library so logging is disabled for the malicious program is the stealthier play — it survives service restarts for that program, whereas a one-off auditctl command is easily spotted and undone. Step 2 (blue): a hook has to be installed — typically via a file like /etc/ld.so.preload or a modified library — so file-integrity monitoring plus EDR process and module telemetry is what catches it, not waiting for auditd itself.", "dual": {"red": "Red wins by making the evasion durable: aim at the logging mechanism, not at single log entries.", "blue": "Blue wins by watching the mechanism’s parts — config files, preload paths, library loads — not only the log output."}, "study": "ATT&CK lists library hooking as an audit-tampering path — know which files it touches.", "steps": [{"text": "STEP 1 — RED SIDE. You want your lab backdoor sessions to stop being written to audit logs. You may touch anything as root. Which action do you pick?", "options": [{"t": "Hook the audit library so your program logs nothing"}, {"t": "Delete /var/log/audit/audit.log once"}, {"t": "Reboot the host so logs reset"}, {"t": "Rename the audit.log folder"}], "correct": 0, "outcome": "The exercise notes: hooking the logging library is the durable, stealthy route."}, {"text": "STEP 2 — BLUE SIDE. The red team took a hook-style action. Which telemetry pair is most likely to catch the installation step?", "options": [{"t": "File-integrity change on /etc/ld.so.preload plus EDR library-load telemetry"}, {"t": "Waiting for auditd to report its own shutdown"}, {"t": "Watching only CPU usage graphs"}, {"t": "Checking the tape backup schedule"}], "correct": 0, "outcome": "Correct — hooks must be installed somewhere on disk, and that writes files."}]}, {"id": "med-04-technique-match", "type": "match", "tag": "Neighbour techniques", "summary": "Match four log lines to the right technique or to hardening", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Morning triage queue", "text": "Four alerts landed overnight on fin-app-07. Your lead asks you to label each one before the 09:00 stand-up. Options: T1685.004 (audit system tampering), T1070.002 (clearing Linux log files), T1685 (tampering with other security tools), and Defensive hardening (no attacker technique)."}, {"k": "code", "label": "ARTEFACT 2 — The four alert payloads", "text": "A. sudo: root : COMMAND=/usr/sbin/auditctl -e 0\nB. bash: rm -f /var/log/audit/audit.log.1\nC. systemd: Stopping LSB: System Logging Service (rsyslog)\nD. ansible-run: audit rules hardening applied (change CHG-8891 approved)"}], "question": "Match each alert to its ATT&CK label.", "hint": "A touches the audit subsystem, B destroys a log file, C stops a different logging tool, D is an approved change.", "explain": "A is auditctl -e 0 — disabling the Linux Audit system itself, T1685.004. B deletes an audit log file, which is clearing logs — T1070.002. C stops rsyslog, a different defensive tool, which belongs to the broader parent T1685 (Disable or Modify Tools), not the audit-specific sub-technique. D is an approved hardening change — defensive work, not an attacker technique.", "study": "Draw the family tree: T1685 parent, T1685.004 audit-specific, T1070.002 clearing.", "items": [{"l": "A — auditctl -e 0 run as root", "r": "T1685.004 — Disable or Modify Linux Audit System Log"}, {"l": "B — rm of /var/log/audit/audit.log.1", "r": "T1070.002 — Clear Linux or Mac System Logs"}, {"l": "C — rsyslog service stopped", "r": "T1685 — Disable or Modify Tools (other security tool)"}, {"l": "D — approved audit rules hardening run", "r": "Defensive hardening — no attacker technique"}]}, {"id": "med-05-coverage-fill", "type": "fill", "tag": "Coverage sentence", "summary": "Complete the data-component coverage sentence for a detection plan", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Detection plan draft", "text": "You are drafting the coverage line for the T1685.004 detection plan. The bank is shuffled — pick one data component per blank."}], "question": "Fill the four blanks with the correct data components.", "hint": "The four ATT&CK data components for this technique: a command one, a process one, a file one, a service one.", "explain": "The sentence should read: \"Command Execution catches auditctl use; Process Termination catches auditd being killed; File Modification catches rules and config edits; Service Metadata catches stop and disable actions.\" Together the four components cover every execution path of T1685.004 — leave one out and that path becomes a gap.", "study": "Write the four data components as a checklist for every new Linux technique you cover.", "segs": [{"b": 0}, " catches attackers running auditctl; ", {"b": 1}, " catches auditd being killed; ", {"b": 2}, " catches edits to audit.rules or audit.conf; ", {"b": 3}, " catches systemctl stop or disable of the audit service."], "blanks": ["Command Execution", "Process Termination", "File Modification", "Service Metadata"], "bank": ["Command Execution", "Process Termination", "File Modification", "Service Metadata", "Log Content", "Driver Load", "WMI"]}, {"id": "med-06-bin-events", "type": "assign", "tag": "Event sorting", "summary": "Sort five events into audit-tampering, other-technique and not-relevant bins", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Enriched SIEM events (backup-lin-01)", "text": "Five enriched events from one Linux backup server. Two bins collect audit tampering evidence paths (Service metadata / Process termination) — one bin collects events that do NOT match T1685.004."}, {"k": "table", "label": "ARTEFACT 2 — Event list", "head": ["#", "Event"], "rows": [["1", "systemctl disable auditd (sudo, root)"], ["2", "kill -9 of the auditd process"], ["3", "systemctl stop rsyslog"], ["4", "cron rotates audit.log with logrotate (normal)"], ["5", "user opens audit.log in less (read-only)"]]}], "question": "Place each event into the correct bin.", "hint": "Two events belong to the service bin, one to the process bin — the rsyslog stop, the rotation and the read are not T1685.004.", "explain": "systemctl disable auditd is Service metadata evidence; the kill of auditd is Process termination evidence. Stopping rsyslog touches a different tool (parent T1685 territory, not the audit sub-technique); logrotate rotating audit logs is routine maintenance; reading audit.log in less changes nothing. Sorting first, alarm second — that is how analysts keep signal-to-noise high.", "study": "Bin events by mechanism before you decide on severity.", "buckets": [{"id": "svc", "label": "Service: Service Metadata evidence"}, {"id": "proc", "label": "Process: Process Termination evidence"}, {"id": "no", "label": "Not T1685.004 evidence"}], "items": [{"id": "b1", "t": "systemctl disable auditd", "bucket": "svc"}, {"id": "b2", "t": "kill -9 of auditd process", "bucket": "proc"}, {"id": "b3", "t": "systemctl stop rsyslog", "bucket": "no"}, {"id": "b4", "t": "logrotate rotates audit.log", "bucket": "no"}, {"id": "b5", "t": "user reads audit.log in less", "bucket": "no"}]}, {"id": "med-07-control-gap", "type": "mcq", "tag": "Control selection", "summary": "Pick the control that catches audit rule file edits", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Gap analysis note", "text": "After a table-top exercise your team writes: \"We would notice auditd stopping (service telemetry exists), but an attacker who quietly edits /etc/audit/audit.rules to add a never,task rule would go unseen.\" The lead asks which control closes exactly this gap for this technique."}], "question": "Which control best closes the silent rule-file-edit gap?", "hint": "The gap is a file changing — so the control has to watch that file, not the service.", "explain": "File-integrity monitoring (FIM) on /etc/audit/audit.rules and audit.conf catches silent edits, which is exactly the gap — and it is the practical implementation of the M1047 Audit mitigation for this technique. A second firewall does not watch files, more RAM does nothing, and an antivirus scan for Windows malware will not flag a sed command on a rules file.", "study": "Map each gap to a control that watches the same object: service gap → service telemetry, file gap → FIM.", "options": [{"t": "File-integrity monitoring on /etc/audit/audit.rules and audit.conf", "correct": true}, {"t": "A second firewall in front of the host", "correct": false}, {"t": "Adding more RAM to the server", "correct": false}, {"t": "A weekly antivirus full scan", "correct": false}]}, {"id": "med-08-signal-set", "type": "multi", "tag": "Tampering signals", "summary": "Select the three signals that together point to tampering", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Shift handover note", "text": "Handover: \"Something on app-lin-09 smells wrong, but I cannot say what.\" You have three observations. Which THREE together support the tampering hypothesis rather than routine work?"}, {"k": "table", "label": "ARTEFACT 2 — Observations", "head": ["#", "Observation"], "rows": [["1", "auditctl -D ran at 02:47 — no change ticket exists"], ["2", "the command came from a shell whose parent is a web-server process"], ["3", "the rules file on app-lin-09 differs from the golden image"], ["4", "a scheduled rule reload ran in the maintenance window"], ["5", "CPU graph shows the nightly backup spike at 01:00"]]}], "question": "Which THREE observations support the tampering hypothesis?", "hint": "Time without approval, an odd parent process, and drift from the golden image — the other two lines are routine.", "explain": "An auditctl -D with no ticket at an odd hour is unexplained admin-like action; a web-server process as the command’s parent suggests script execution from the web tier — not a human admin session; and drift from the golden image confirms the rule set was really changed. The scheduled reload in the maintenance window and the backup CPU spike are normal weekly noise.", "study": "Correlate approval data, process ancestry and configuration baseline before judging.", "options": [{"t": "auditctl -D at 02:47 with no change ticket", "correct": true}, {"t": "command parent is a web-server process", "correct": true}, {"t": "rules file differs from the golden image", "correct": true}, {"t": "scheduled rule reload in the maintenance window", "correct": false}, {"t": "CPU spike from the nightly backup", "correct": false}]}, {"id": "med-09-triage-order", "type": "order", "tag": "Response workflow", "summary": "Order the five triage steps after a log-gap alert", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Runbook card", "text": "Your runbook card lists five triage steps for \"Linux audit log source silent\" alerts, but the new printable version shuffled them. Put them back in working order: top = first. Principle: confirm the gap, understand the mechanism, keep evidence, then coordinate."}, {"k": "code", "label": "ARTEFACT 2 — The five steps", "text": "A. Check the auditd service state and loaded rules on the host\nB. Confirm in the SIEM that the log source is really aded in the kernel — exactly what the ticket asked for. auditctl -s prints status counters (enabled flag, backlog, lost events) which is not the rule list. auditctl -D would delete every rule — destructive and opposite of the goal. One lowercase letter separates read from ruin, which is why copy-paste plus review matters.", "study": "auditctl options: -l list rules, -s status, -D delete all, -e set enabled level.", "terminal": {"title": "analyst@fin-app-07: ~", "prompt": "analyst@fin-app-07:~$", "canonical": "auditctl -l", "out": "-w /etc/passwd -p wa -k identity\n-a always,exit -F arch=b64 -S execve -k audit-exec\n-w /etc/audit/ -p wa -k audit-config", "banner": ["Connected to fin-app-07 (admin shell).", "The audit service is running. Type your command, then press Check."], "elements": [{"re": "\\bauditctl\\b", "label": "auditctl (the audit rule tool)", "why": "It is the only tool that talks to the kernel audit rule set."}, {"re": "(^|\\s)-l(\\s|$)", "label": "-l (list rules)", "why": "-l prints the rules loaded in the kernel right now."}], "forbidden": [{"re": "\\s-D(\\s|$)", "label": "-D (delete all rules)", "why": "This would wipe the rule set — the exact damage we are investigating."}, {"re": "(^|\\s)-s(\\s|$)", "label": "-s (status counters only)", "why": "The ticket wants the rule list; -s shows counters, not rules."}]}}, {"id": "med-11-journal-who", "type": "mcq", "tag": "Read the unit journal", "summary": "Decide the best first verification step from the journal excerpt", "scenario": [{"k": "log", "label": "ARTEFACT 1 — journalctl -u auditd on app-lin-09", "lines": ["Oct 15 04:12:58 app-lin-09 systemd[1]: Stopping Audit Service...", "Oct 15 04:12:58 app-lin-09 auditd[1204]: The audit daemon is exiting.", "Oct 15 04:12:59 app-lin-09 systemd[1]: Stopped Audit Service.", "Oct 15 04:13:10 app-lin-09 sudo: svc_backup : TTY=pts/1 ; USER=root ; COMMAND=/bin/systemctl stop auditd"]}], "question": "Based on the journal, what is the best next verification step?", "hi /* ---------------- terminal ---------------- */
function normCmd(s) { return String(s).replace(/\s+/g, ' ').trim().toLowerCase(); }
function sameCmd(a, b) {
  if (a === b) return true;
  var ta = a.split(' ').filter(Boolean), tb = b.split(' ').filter(Boolean);
  if (ta.length !== tb.length) return false;
  var oa = ta.filter(function (t) { return t.charAt(0) === '-'; }).sort();
  var ob = tb.filter(function (t) { return t.charAt(0) === '-'; }).sort();
  var pa = ta.filter(function (t) { return t.charAt(0) !== '-'; });
  var pb = tb.filter(function (t) { return t.charAt(0) !== '-'; });
  return oa.join(' ') === ob.join(' ') && pa.join(' ') === pb.join(' ');
}
function termPrint(ex, html, cls) {

}

  area.appendChild(box);

    sp.innerHTML = '<h4>\u2139 Syntax reminder</h4><p><code>' + esc(t.syntax.shape) + '</code></p>' +
      '<ul>' + t.syntax.notes.map(function (n) { return '<li>' + md(n).replace(/^<p>|<\/p>$/g, '') + '</li>'; }).join('') + '</ul>' +
      '<div class="sample">Example on a different unit: <code>' + esc(t.syntax.example) + '</code>' +
      (t.syntax.sample ? '<br>Output looks like:<br><code>' + esc(t.syntax.sample).replace(/\n/g, '<br>') + '</code>' : '') + '</div>';
    area.appendChild(sp);

  (t.banner || []).forEach(function (l) { termPrint(ex, esc(l), 't-info'); });

    else if (n) { termPrint(ex, 'command accepted for review \u2014 press Check to grade your answer.', 't-info'); }
  });
  if (t.perEx) { perExStart(t.perEx); var el = $('perex-chip'); if (el) el.textContent = '\u23F1 ' + mmss(t.perEx) + ' left for this exercise'; }
  inp.focus();

/* ---------------- grading ---------------- */
function scoreExercise(H, W, N) { return Math.max(0, (H - W) / N); }
function grade(ex) {
  var I = S.inter, H, W, N, rows = [], i;
  if (ex.type === 'mcq') {
    N = 1;
    var picked = I.sel.length ? I.disp[I.sel[0]] : -1;
    var ok = picked >= 0 && ex.options[picked].correct;
    H = ok ? 1 : 0; W = ok ? 0 : (picked >= 0 ? 1 : 0);
    if (ok) rows.push({ st: 'ok', text: 'You picked the correct option.' });
    else if (picked >= 0) rows.push({ st: 'bad', text: 'You picked: \u201C' + ex.options[picked].t + '\u201D \u2014 not correct here.' });
    else rows.push({ st: 'bad', text: 'You did not pick any option.' });
    var co = ex.options.filter(function (o) { return o.correct; })[0];
    if (!ok) rows.push({ st: 'miss', text: 'Correct answer: \u201C' + co.t + '\u201D' });
    return { credit: scoreExercise(H, W, N), rows: rows };
  }
  if (ex.type === 'multi') {
    var corr = ex.options.map(function (o, oi) { return o.correct ? oi : -1; }).filter(function (x) { return x >= 0; });
    N = corr.length; H = 0; W = 0;
    ex.options.forEach(function (o, oi) {
      var sel = I.sel.indexOf(I.disp.indexOf(oi)) !== -1;
      if (o.correct && sel) { H++; rows.push({ st: 'ok', text: '\u201C' + o.t + '\u201D \u2014 correct, you selected it.' }); }
      else if (!o.correct && sel) { W++; rows.push({ st: 'bad', text: '\u201C' + o.t + '\u201D \u2014 you selected it, but it does not belong.' }); }
      else if (o.correct && !sel) { rows.push({ st: 'miss', text: '\u201C' + o.t + '\u201D \u2014 you missed this correct item.' }); }
    });
    return { credit: scoreExercise(H, W, N), rows: rows };
  }
  if (ex.type === 'match') {
    N = ex.items.length; H = 0; W = 0;
    ex.items.forEach(function (it, li) {
      var c = I.choices[li];
      if (c === it.r) { H++; rows.push({ st: 'ok', text: '\u201C' + it.l + '\u201D \u2192 \u201C' + it.r + '\u201D \u2014 correct.' }); }
      else if (c) { W++; rows.push({ st: 'bad', text: '\u201C' + it.l + '\u201D \u2192 you chose \u201C' + c + '\u201D. Correct: \u201C' + it.r + '\u201D.' }); }
      else { rows.push({ st: 'miss', text: '\u201C' + it.l + '\u201D \u2014 left unmatched. Correct: \u201C' + it.r + '\u201D.' }); }
    });
    return { credit: scoreExercise(H, W, N), rows: rows };
  }
  if (ex.type === 'fill') {
    N = ex.blanks.length; H = 0; W = 0;
    ex.blanks.forEach(function (b, bi) {
      var p = I.picks[bi];
      if (p === b) { H++; rows.push({ st: 'ok', text: 'Blank ' + (bi + 1) + ': \u201C' + b + '\u201D \u2014 correct.' }); }
      else if (p) { W++; rows.push({ st: 'bad', text: 'Blank ' + (bi + 1) + ': you wrote \u201C' + p + '\u201D. Correct: \u201C' + b + '\u201D.' }); }
      else { rows.push({ st: 'miss', text: 'Blank ' + (bi + 1) + ' left empty. Correct: \u201C' + b + '\u201D.' }); }
    });
    return { credit: scoreExercise(H, W, N), rows: rows };
  }
  if (ex.type === 'assign') {
    N = ex.items.length; H = 0; W = 0;
    ex.items.forEach(function (it) {
      var b = I.place[it.id];
      if (b === it.bucket) { H++; rows.push({ st: 'ok', text: '\u201C' + it.t + '\u201D \u2192 \u201C' + bucketLabel(ex, it.bucket) + '\u201D \u2014 correct.' }); }
      else if (b) { W++; rows.push({ st: 'bad', text: '\u201C' + it.t + '\u201D \u2192 \u201C' + bucketLabel(ex, b) + '\u201D. Correct bin: \u201C' + bucketLabel(ex, it.bucket) + '\u201D.' }); }
      else { rows.push({ st: 'miss', text: '\u201C' + it.t + '\u201D \u2014 left in the bank. Correct bin: \u201C' + bucketLabel(ex, it.bucket) + '\u201D.' }); }
    });
    return { credit: scoreExercise(H, W, N), rows: rows };
  }
  if (ex.type === 'order') {
    N = ex.items.length; H = 0; W = 0; var marks = [];
    for (i = 0; i < N; i++) {
      var okp = I.seq[i] === ex.items[i].id;
      marks.push(okp);
      if (okp) { H++; rows.push({ st: 'ok', text: 'Position ' + (i + 1) + ': \u201C' + itemText(ex, ex.items[i].id) + '\u201D \u2014 correct.' }); }
      else { W++; rows.push({ st: 'bad', text: 'Position ' + (i + 1) + ': you placed \u201C' + itemText(ex, I.seq[i]) + '\u201D. Correct: \u201C' + itemText(ex, ex.items[i].id) + '\u201D.' }); }
    }
    return { credit: scoreExercise(H, W, N), rows: rows, marks: marks };
  }
  if (ex.type === 'branch') {
    N = ex.steps.length; H = 0; W = 0;
    ex.steps.forEach(function (s, si) {
      var di = I.choices[si];
      var oi = (di !== undefined && I.dispStep && I.dispStep[si]) ? I.dispStep[si][di] : -1;
      if (oi === s.correct) { H++; rows.push({ st: 'ok', text: 'Step ' + (si + 1) + ' \u2014 good decision.' }); }
      else { W++; rows.push({ st: 'bad', text: 'Step ' + (si + 1) + ' \u2014 you chose \u201C' + (s.options[oi] ? s.options[oi].t : '(no choice)') + '\u201D. Better: \u201C' + s.options[s.correct].t + '\u201D.' }); }
    });
    return { credit: scoreExercise(H, W, N), rows: rows };
  }
  if (ex.type === 'terminal') {
    var t = ex.terminal;
    var n = normCmd(I.cmd || '');
    N = t.elements.length; H = 0; W = 0;
    t.elements.forEach(function (el) {
      if (el.re.test(n)) { H++; rows.push({ st: 'ok', text: el.label + ' \u2014 found. ' + el.why }); }
      else { rows.push({ st: 'miss', text: el.label + ' \u2014 missing. ' + el.why }); }
    });
    var danger = false;
    (t.forbidden || []).forEach(function (f) {
      if (f.re.test(n)) { W++; danger = true; rows.push({ st: 'bad', text: '\u2717 DANGEROUS \u2014 NEAR MISS: ' + f.label + ' ' + f.why }); }
    });
    if (!n) rows.unshift({ st: 'bad', text: 'You submitted an empty command line.' });
    return { credit: scoreExercise(H, W, N), rows: rows, danger: danger, typed: n };
  }
  return { credit: 0, rows: [] };
}
function bucketLabel(ex, id) {
  var b = ex.buckets.filter(function (x) { return x.id === id; })[0];
  return b ? b.label : id;
}
function itemText(ex, id) {
  if (id === undefined) return '(nothing)';
  var it = ex.items.filter(function (x) { return x.id === id; })[0];
  return it ? it.t : '(nothing)';
}
/* ---------------- check / feedback / flow ---------------- */
function setCheckVisible(v) {
  var c = $('btn-check');
  if (c) c.classList.toggle('hidden', !v);
}
function onCheck() {
  if (S.checked[S.idx]) return;
  var ex = curEx();
  if (ex.type === 'branch') {
    var done = ex.steps.every(function (_, si) { return S.inter.choices[si] !== undefined; });
    if (!done) return; /* final Check only exists once every step is confirmed */
  }
  if (ex.type === 'terminal') { var ti = $('term-input'); if (ti && String(ti.value).trim()) S.inter.cmd = ti.value; }
  setState('PAUSED_AUTO_CHECK');   /* first action, before feedback renders */
  perExStop();
  var g = grade(ex);
  var pen = S.hintUsed[S.idx] ? 0.10 : 0;
  var credit = Math.max(0, g.credit - pen);
  S.checked[S.idx] = true;
  S.answered[S.idx] = credit;
  S.creditsSum += credit;
  S.skipped = S.skipped.filter(function (p) { return p !== S.idx; });
  S.curGraded = { g: g, credit: credit };
  S.locked = true;
  lockUI(ex, g);
  renderFeedback(ex, g, credit);
  var br = $('btn-row');
  br.innerHTML = '';
  var nb = document.createElement('button');
  nb.className = 'btn btn-green'; nb.id = 'btn-next';
  nb.textContent = S.returnTo === 'review' ? '\u21B9 Back to review \u25B6'
    : (S.idx + 1 === EXS.length) ? 'Final Submit \u25B6' : 'Next \u25B6';
  nb.addEventListener('click', onNext);
  br.appendChild(nb);
  var hb = $('btn-hint'); if (hb) hb.disabled = true;
  var sb = $('btn-skip'); if (sb) sb.disabled = true;
  renderHeader();
}
function lockUI(ex, g) {
  var I = S.inter;
  if (ex.type === 'mcq' || ex.type === 'multi') {
    document.querySelectorAll('#blk-ans .opt').forEach(function (b) {
      var di = parseInt(b.getAttribute('data-di'), 10);
      var oi = I.disp[di];
      var sel = I.sel.indexOf(di) !== -1;
      var corr = ex.options[oi].correct;
      b.classList.add('locked');
      var v = document.createElement('span'); v.className = 'verdict';
      if (sel && corr) { b.classList.add('correct'); v.className += ' v-ok'; v.textContent = '\u2713 Correct'; }
      else if (sel && !corr) { b.classList.add('wrong'); v.className += ' v-bad'; v.textContent = '\u2717 Wrong'; }
      else if (!sel && corr && ex.type === 'multi') { b.classList.add('missed'); v.className += ' v-miss'; v.textContent = '\u25CB Missed'; }
      else if (!sel && corr && ex.type === 'mcq') { b.classList.add('missed'); v.className += ' v-miss'; v.textContent = '\u25CB Missed \u2014 this was correct'; }
      b.appendChild(v);
    });
  } else if (ex.type === 'match') {
    document.querySelectorAll('#blk-ans .match-row').forEach(function (row, li) {
      var mk = row.querySelector('.pair-mark');
      var ok = I.choices[li] === ex.items[li].r;
      mk.style.display = '';
      mk.className = 'pair-mark ' + (ok ? 'ok' : (I.choices[li] ? 'bad' : 'miss'));
      mk.textContent = ok ? '\u2713 Correct' : (I.choices[li] ? '\u2717 Wrong' : '\u25CB Missed');
      row.querySelector('select').disabled = true;
    });
  } else if (ex.type === 'fill') {
    var slots = 0;
    document.querySelectorAll('#blk-ans .blank-sel').forEach(function (sel) {
      var bi = slots++;
      var mk = sel.parentElement.querySelector('.pair-mark');
      var ok = I.picks[bi] === ex.blanks[bi];
      mk.style.display = '';
      mk.className = 'pair-mark ' + (ok ? 'ok' : (I.picks[bi] ? 'bad' : 'miss'));
      mk.textContent = ok ? '\u2713' : (I.picks[bi] ? '\u2717' : '\u25CB');
      sel.disabled = true;
    });
  } else if (ex.type === 'assign') {
    document.querySelectorAll('#blk-ans .chip').forEach(function (chip) {
      var iid = chip.getAttribute('data-iid');
      var it = ex.items.filter(function (x) { return x.id === iid; })[0];
      var placed = I.place[iid];
      var v = document.createElement('span');
      if (placed === it.bucket) { v.className = 'chip-verdict v-ok'; v.textContent = '\u2713'; }
      else if (placed) { v.className = 'chip-verdict v-bad'; v.textContent = '\u2717'; }
      else { v.className = 'chip-verdict v-miss'; v.textContent = '\u25CB missed'; }
      chip.appendChild(v);
      var x = chip.querySelector('.x'); if (x) x.remove();
      chip.setAttribute('draggable', 'false');
    });
  } else if (ex.type === 'order') {
    drawOrder(ex, g.marks);
  } else if (ex.type === 'branch') {
    document.querySelectorAll('#blk-ans .step-box').forEach(function (box) {
      var si = parseInt(box.getAttribute('data-step'), 10);
      box.querySelectorAll('.opt').forEach(function (b) {
        var di = parseInt(b.getAttribute('data-di'), 10);
        var oi = I.dispStep[si][di];
        var chosen = I.choices[si] === di;
        var v = document.createElement('span'); v.className = 'verdict';
        if (chosen && oi === ex.steps[si].correct) { b.classList.add('correct'); v.className += ' v-ok'; v.textContent = '\u2713 Correct'; }
        else if (chosen) { b.classList.add('wrong'); v.className += ' v-bad'; v.textContent = '\u2717 Wrong'; }
        else if (oi === ex.steps[si].correct) { b.classList.add('missed'); v.className += ' v-miss'; v.textContent = '\u25CB Missed'; }
        b.appendChild(v);
      });
    });
  } else if (ex.type === 'terminal') {
    var inp = $('term-input'); if (inp) { inp.disabled = true; }
    var t = ex.terminal;
    termPrint(ex, '\u2500 simulator output \u2500', 't-info');
    termPrint(ex, esc(t.out));
  }
}
function renderFeedback(ex, g, credit) {
  var lab, cls, icon;
  if (credit >= 0.9999) { lab = 'CORRECT'; cls = 'f-correct'; icon = '\u2713'; }
  else if (credit <= 0.0001) { lab = 'INCORRECT'; cls = 'f-incorrect'; icon = '\u2717'; }
  else { lab = 'PARTIALLY CORRECT'; cls = 'f-partial'; icon = '\u2713'; }
  var multi = ['multi', 'match', 'fill', 'assign', 'order', 'branch'].indexOf(ex.type) !== -1 || ex.type === 'terminal';
  var creditLine = multi ? '<span class="fb-credit">credit ' + (Math.round(credit * 100) / 100).toFixed(2) + (credit > 0 ? ' \u2014 ' + countPicked(ex, g) : '') + '</span>' : '';
  var h = '<div class="fb-head ' + cls + '"><span aria-hidden="true">' + icon + '</span> ' + lab + creditLine + '</div>';
  var body = '<div class="fb-body"><h4>Why</h4>' + md(ex.explain);
  body += '<h4>Item by item</h4><div class="fb-items">' + g.rows.map(function (r) {
    var mark = r.st === 'ok' ? '<span class="i-mark">\u2713 Correct</span>' : r.st === 'bad' ? '<span class="i-mark">\u2717 Wrong</span>' : '<span class="i-mark">\u25CB Missed</span>';
    return '<div class="fb-item i-' + (r.st === 'ok' ? 'ok' : r.st === 'bad' ? 'bad' : 'miss') + '">' + mark + '<p>' + md(r.text).replace(/^<p>|<\/p>$/g, '') + '</p></div>';
  }).join('') + '</div>';
  if (g.danger) body += '<div class="study-tip danger"><b>\u2717 DANGEROUS \u2014 NEAR MISS:</b> your command would have changed the state of the host or destroyed evidence. In real work, that is a serious mistake even when the goal is right. Read the canonical command below.</div>';
  if (ex.type === 'terminal') {
    var t = ex.terminal;
    body += '<h4>Canonical command</h4><div class="canon-cmd"><button type="button" class="copy-btn" id="btn-copy">\u29C9 Copy</button><pre>' + esc(t.canonical) + '</pre></div>' +
      '<div class="fb-items">' + t.elements.map(function (el) {
        return '<div class="fb-item i-ok"><span class="i-mark">\u2713 Element</span><p><code>' + esc(el.label) + '</code> \u2014 ' + md(el.why).replace(/^<p>|<\/p>$/g, '') + '</p></div>';
      }).join('') + '</div>';
    if ((t.forbidden || []).length) {
      body += '<div class="fb-items">' + t.forbidden.map(function (f) {
        return '<div class="fb-item i-bad"><span class="i-mark">\u2717 Avoid</span><p><code>' + esc(f.label) + '</code> \u2014 ' + md(f.why).replace(/^<p>|<\/p>$/g, '') + '</p></div>';
      }).join('') + '</div>';
    }
  }
  if (ex.dual) {
    body += '<div class="dual-persp"><div class="dp red"><h5>\u25CF Attacker perspective</h5><p>' + md(ex.dual.red).replace(/^<p>|<\/p>$/g, '') + '</p></div>' +
      '<div class="dp blue"><h5>\u25CF Defender perspective</h5><p>' + md(ex.dual.blue).replace(/^<p>|<\/p>$/g, '') + '</p></div></div>';
  }
  if (ex.study) body += '<div class="study-tip"><b>What to study next:</b> ' + md(ex.study).replace(/^<p>|<\/p>$/g, '') + '</div>';
  body += '</div>';
  $('fb-area').innerHTML = h + body;
  var cp = $('btn-copy');
  if (cp) cp.addEventListener('click', function () {
    try {
      navigator.clipboard.writeText(ex.terminal.canonical).then(function () { cp.textContent = '\u2713 Copied'; }, function () { cp.textContent = 'Select & copy manually'; });
    } catch (e) { cp.textContent = 'Select & copy manually'; }
  });
  $('fb-area').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function countPicked(ex, g) {
  var ok = g.rows.filter(function (r) { return r.st === 'ok'; }).length;
  var bad = g.rows.filter(function (r) { return r.st === 'bad' && r.text.indexOf('DANGEROUS') === -1; }).length;
  var miss = g.rows.filter(function (r) { return r.st === 'miss'; }).length;
  var n = ok + bad + miss;
  return ok + '/' + n + ' items';
}
function onNext() {
  if (S.tState === 'PAUSED_AUTO_CHECK') setState('RUNNING');
  if (S.returnTo === 'review') { showReview(); return; }
  if (S.idx + 1 < EXS.length) { S.idx++; renderExercise(); }
  else { maybeReview(); }
}
function onSkip() {
  if (S.locked || S.checked[S.idx]) return;
  if (S.skipped.indexOf(S.idx) === -1) S.skipped.push(S.idx);
  renderHeader();
  if (S.returnTo === 'review') { S.returnTo = null; showReview(); return; }
  if (S.idx + 1 < EXS.length) { S.idx++; renderExercise(); }
  else { maybeReview(); }
}
function onHint() {
  if (S.locked || S.hintUsed[S.idx]) return;
  S.hintUsed[S.idx] = true;
  $('hint-slot').innerHTML = '<div class="hint-panel"><div class="h-head">\u2600 Hint \u2014 costs 10% of this exercise\u2019s credit</div>' + md(curEx().hint) + '</div>';
  $('btn-hint').disabled = true;
}
function onPause() {
  if (S.phase !== 'exam' && S.phase !== 'review') return;
  if (S.tState !== 'RUNNING' && S.tState !== 'PAUSED_AUTO_CHECK') return;
  S.resumeState = S.tState;
  setState('PAUSED_MANUAL');
  $('pause-veil').classList.remove('hidden');
}
function onResume() {
  $('pause-veil').classList.add('hidden');
  setState(S.resumeState === 'PAUSED_AUTO_CHECK' ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
}
function maybeReview() {
  if (S.skipped.length > 0) showReview();
  else showResults();
}
function showReview() {
  S.phase = 'review';
  if (S.tState === 'PAUSED_AUTO_CHECK') setState('RUNNING');
  $('view-exam').classList.add('hidden');
  $('view-results').classList.add('hidden');
  $('view-review').classList.remove('hidden');
  var list = '<div class="rev-item"><span class="r-mark">\u26A0 Skipped</span><span class="r-text">All exercises have been shown. Submit when ready.</span></div>';
  if (S.skipped.length) {
    list = S.skipped.map(function (p) {
      return '<div class="rev-item"><span class="r-mark">\u26A0 Skipped</span><span class="r-text">' + md(EXS[p].summary).replace(/^<p>|<\/p>$/g, '') + '</span>' +
        '<button type="button" class="btn btn-amber" data-pos="' + p + '">\u270E Answer now</button></div>';
    }).join('');
  }
  $('view-review').innerHTML = '<div class="card"><h2>Review skipped exercises</h2>' +
    '<p class="note" style="color:var(--text-secondary)">Exercises you skip and never answer are excluded from your score \u2014 they count neither for you nor against you. You can return to them as many times as you need until the timer ends.</p>' +
    list +
    '<div style="display:flex;gap:12px;justify-content:flex-end;margin-top:16px">' +
    '<button type="button" class="btn btn-green" id="btn-final">\u2713 Submit exam now</button></div></div>';
  $('view-review').querySelectorAll('[data-pos]').forEach(function (b) {
    b.addEventListener('click', function () {
      S.phase = 'exam'; S.idx = parseInt(b.getAttribute('data-pos'), 10); S.returnTo = 'review';
      $('view-review').classList.add('hidden');
      $('view-exam').classList.remove('hidden');
      renderExercise();
    });
  });
  $('btn-final').addEventListener('click', showResults);
  renderHeader();
}
function showResults() {
  S.phase = 'results';
  setState('ENDED');
  $('view-exam').classList.add('hidden');
  $('view-review').classList.add('hidden');
  $('view-results').classList.remove('hidden');
  var answered = Object.keys(S.answered).length;
  var full = 0, part = 0, partSum = 0, wrong = 0;
  Object.keys(S.answered).forEach(function (k) {
    var c = S.answered[k];
    if (c >= 0.9999) full++;
    else if (c > 0.0001) { part++; partSum += c; }
    else wrong++;
  });
  var skippedN = S.skipped.length;
  var pct = answered > 0 ? Math.round((S.creditsSum / answered) * 100) : 0;
  var pass = pct >= META.passMark;
  var avg = part > 0 ? (Math.round(partSum / part * 100) / 100).toFixed(2) : '\u2014';
  $('view-results').innerHTML =
    '<div class="card"><div class="res-hero">' +
    '<div class="res-pct">' + pct + '%</div>' +
    '<div class="res-verdict ' + (pass ? 'pass' : 'fail') + '">' + (pass ? '\u2713 PASS' : '\u2717 FAIL') + '</div>' +
    '<div style="color:var(--text-secondary)">Final score ' + fmt1(S.creditsSum) + ' / ' + answered + ' answered \u00B7 pass mark ' + META.passMark + '%</div>' +
    '</div><div class="res-grid">' +
    '<div class="res-cell ok"><div class="c-k">\u2713 Fully correct</div><div class="c-v">' + full + '</div></div>' +
    '<div class="res-cell part"><div class="c-k">\u2713 Partially correct (avg ' + avg + ')</div><div class="c-v">' + part + '</div></div>' +
    '<div class="res-cell bad"><div class="c-k">\u2717 Fully incorrect</div><div class="c-v">' + wrong + '</div></div>' +
    '<div class="res-cell skip"><div class="c-k">\u26A0 Skipped \u2014 excluded</div><div class="c-v">' + skippedN + '</div></div>' +
    '</div>' +
    (pass ? '<div class="certificate"><h3>\u2713 Certification-style result</h3><p>You reached ' + pct + '%, above the ' + META.passMark + '% pass mark. You have demonstrated a working command of ' + esc(META.objId + ' \u2014 ' + META.objName) + ' at ' + META.sevName + ' level.</p></div>'
      : '<div class="certificate fail"><h3 style="color:var(--state-incorrect)">\u2717 Not passed this time</h3><p>You reached ' + pct + '%, below the ' + META.passMark + '% pass mark. Review the feedback above, study the listed concepts, and retake the exam \u2014 questions and options will be reshuffled.</p></div>') +
    '<div class="pause-log">Time spent paused manually: ' + mmss(S.pauseManualMs / 1000) +
    ' \u00B7 time spent reviewing feedback (auto-pause): ' + mmss(S.pauseAutoMs / 1000) + '</div>' +
    '<div style="display:flex;justify-content:flex-end;margin-top:16px">' +
    '<button type="button" class="btn btn-primary" id="btn-retake">\u21BA Retake exam</button></div></div>';
  $('btn-retake').addEventListener('click', startExam);
  renderHeader();
  if (!S.reported) { S.reported = true; reportScore(S.creditsSum, answered); }
}
function finishAttempt() {
  if (S.phase === 'intro' || S.phase === 'results') return;
  showResults();
}

/* ---------------- site integration ---------------- */
function reportScore(creditSum, answeredCount) {
  var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent >= META.passMark
    }, location.origin);
  } catch (e) { /* opened directly, nothing to report to */ }
}
window.addEventListener('message', function (event) {
  if (!event.data) return;
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  S.hs = {
    username: event.data.username || '',
    country: event.data.country || '',
    locale: event.data.locale || 'en',
    topicId: event.data.topicId || '',
    batch: event.data.batch
  };
});

/* ---------------- boot ---------------- */
document.documentElement.style.setProperty('--sev-current', META.sevColor);
renderIntro();
document.addEventListener('DOMContentLoaded', function () {
  var b = $('btn-pause'); if (b) b.addEventListener('click', onPause);
  var r = $('btn-resume'); if (r) r.addEventListener('click', onResume);
  var h = $('btn-hint'); if (h) h.addEventListener('click', onHint);
  var s = $('btn-skip'); if (s) s.addEventListener('click', onSkip);
  var c = $('btn-check'); if (c) c.addEventListener('click', onCheck);
});
})();



</script>
