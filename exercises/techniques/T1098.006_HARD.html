window.__EXAM__={"meta": {"topicId": "t1098.006", "batch": 3, "title": "T1098.006 Account Manipulation: Additional Container Cluster Roles — HARD", "difficulty": "hard", "questionCount": 15, "estimatedMinutes": 45, "passMark": 70}, "sevKey": "hard", "sevWord": "HARD", "objId": "T1098.006", "objName": "Account Manipulation: Additional Container Cluster Roles", "timerMinutes": 45, "estimatedMinutes": 45, "typeList": ["Single-choice questions with near-miss distractors", "Multi-select with partial credit", "Matching pairs", "Drag & drop (incl. spot-the-mistake review)", "Ranking / ordering with per-position credit", "One terminal command — tool not named, objective and environment only"], "intro": {"title": "T1098.006 — HARD practice exam", "subtitle": "Account Manipulation: Additional Container Cluster Roles — near-miss discrimination for senior analysts", "objType": "Sub-Technique (child of T1098 — Account Manipulation)", "learn": "\n<p>This is the <b>HARD<\/b> tier for <b>T1098.006 — Additional Container Cluster Roles<\/b> (sub-technique of <b>T1098 — Account Manipulation<\/b>; tactics <b>Persistence<\/b> and <b>Privilege Escalation<\/b>). The easy questions are behind you: here, two answers always look defensible, and one of the 'obvious' choices is wrong on purpose. The behaviour you are discriminating: an adversary with sufficient permissions creates a <b>RoleBinding<\/b> or <b>ClusterRoleBinding<\/b> in Kubernetes to attach a Role or ClusterRole to an account they control — or modifies an <b>ABAC<\/b> policy where ABAC is in use — to keep persistent access to the cluster.<\/p>\n<p>The scenarios mirror senior work: <b>IR leads<\/b> sequencing evidence-first containment, <b>detection engineers<\/b> finding coverage gaps between three analytics, <b>SOC shifts<\/b> judging 'looks benign but is not' versus 'looks alarming but is fine' in audit telemetry, <b>CTI analysts<\/b> keeping attribution honest (the ATT&CK page documents a 2023 campaign that used Kubernetes RBAC to backdoor clusters — and names no group), and <b>red teamers<\/b> who must know precisely what a one-line binding command grants. Expect audit logs with noise, YAML with subtle mistakes, ranking decisions, and one terminal task where the tool is not named.<\/p>\n<p>Everything is still anchored to the official objects: <b>DET0572 / AN1579<\/b> (high-privilege bindings outside CI/CD automation or from unknown IPs), mitigations <b>M1018<\/b> and <b>M1032<\/b>, and the managed-cloud note (<b>GKE / EKS / AKS<\/b>, where the technique may pair with <b>T1098.003<\/b>).<\/p>\n", "keywords": "\n<div class=\"kwtheme\"><h4>🗂 Near-miss discrimination<\/h4><ul>\n<li><span class=\"mono\">RoleBinding<\/span> + <span class=\"mono\">ClusterRole<\/span> (namespaced reach) vs <span class=\"mono\">ClusterRoleBinding<\/span> (cluster-wide reach)<\/li>\n<li><span class=\"mono\">--role<\/span> vs <span class=\"mono\">--clusterrole<\/span>; built-in roles <span class=\"mono\">view<\/span> / <span class=\"mono\">cluster-admin<\/span><\/li>\n<li>Binding creation vs binding <b>patch<\/b>; compromised <b>automation identities<\/b> as creators<\/li>\n<\/ul><\/div>\n<div class=\"kwtheme\"><h4>📡 Evidence &amp; telemetry<\/h4><ul>\n<li>Multi-line audit logs with noise; requestObject parsing; <span class=\"mono\">system:masters<\/span> group abuse<\/li>\n<li>ABAC clusters: evidence lives in control-plane file/process telemetry, not API audit<\/li>\n<li>Permission probing via subject access reviews before a binding is added<\/li>\n<\/ul><\/div>\n<div class=\"kwtheme\"><h4>🔍 Detection &amp; gaps<\/h4><ul>\n<li>DET0572 / AN1579 clauses and their blind spots (non-prod namespaces, patch verbs, automation identities)<\/li>\n<li>Coverage-gap analysis across existing analytics and cloud-IAM detections (T1098.003)<\/li>\n<\/ul><\/div>\n<div class=\"kwtheme\"><h4>🛡 Response &amp; attribution discipline<\/h4><ul>\n<li>Evidence-first ordering; least-aggressive containment; token rotation scope<\/li>\n<li>2023 documented K8s RBAC backdoor campaign (no named group); TTP overlap vs attribution<\/li>\n<li>RBAC YAML review: roleRef kind mismatches, missing apiGroup, wrong subject kinds<\/li>\n<\/ul><\/div>\n", "how": "\n<p><b>Goal:<\/b> reach at least <b>70%<\/b> — that is a PASS. Below it, retake; order and answer positions reshuffle.<\/p>\n<p><b>Exercise types in this file:<\/b><\/p>\n<ul class=\"howlist\">\n<li>Single-choice questions where at least two options are technically defensible somewhere else.<\/li>\n<li>Multi-select with <b>partial credit<\/b> — wrong picks subtract.<\/li>\n<li>Matching pairs and drag &amp; drop, including a spot-the-mistake YAML review.<\/li>\n<li>Ranking and ordering with per-position partial credit.<\/li>\n<li>One terminal exercise: you get the objective and the environment only — <b>the tool is not named<\/b>.<\/li>\n<\/ul>\n<p><b>Scoring:<\/b> one point maximum per exercise; multi-part exercises score <code>(H − W) / N<\/code>; one hint per exercise costs 10% of that exercise.<\/p>\n<p><b>Timer:<\/b> <b>45 minutes<\/b>. <b>Check<\/b> auto-pauses the clock for unlimited feedback review; <b>Next<\/b> resumes. <b>Pause<\/b> hides the exercise for a manual break. <b>Skip<\/b> parks an exercise for later review; never-answered skipped exercises are excluded from the score.<\/p>\n"}, "exercises": [{"id": "h01", "type": "qcm", "scen": [{"k": "p", "t": "Two audit lines, same five minutes, same actor. Platform-bot bound the built-in <b>cluster-admin<\/b> ClusterRole to ServiceAccount <span class=\"mono\">svc-relay<\/span> — twice, with two different objects. Your lead asks the difference in reach."}, {"k": "art", "label": "ARTEFACT 1 — Two audit lines", "kind": "log", "lines": ["L1 {\"user\":{\"username\":\"platform-bot\"},\"verb\":\"create\",\"objectRef\":{\"resource\":\"rolebindings\",\"namespace\":\"kube-system\",\"name\":\"relay-ns\"},\"requestObject\":{\"roleRef\":{\"kind\":\"ClusterRole\",\"name\":\"cluster-admin\"},\"subjects\":[{\"kind\":\"ServiceAccount\",\"name\":\"svc-relay\",\"namespace\":\"ops\"}]}}", "L2 {\"user\":{\"username\":\"platform-bot\"},\"verb\":\"create\",\"objectRef\":{\"resource\":\"clusterrolebindings\",\"name\":\"relay-all\"},\"requestObject\":{\"roleRef\":{\"kind\":\"ClusterRole\",\"name\":\"cluster-admin\"},\"subjects\":[{\"kind\":\"ServiceAccount\",\"name\":\"svc-relay\",\"namespace\":\"ops\"}]}}"]}], "scenSum": "RoleBinding vs ClusterRoleBinding — which grants cluster-wide power?", "q": "Both lines bind cluster-admin to svc-relay. Which one gives rights across EVERY namespace, and why?", "options": [{"t": "Line 2 — the ClusterRoleBinding applies the role cluster-wide", "ok": true}, {"t": "Line 1 — kube-system is the most privileged namespace", "ok": false}, {"t": "Both — any binding to cluster-admin is automatically cluster-wide", "ok": false}, {"t": "Neither — a roleRef alone grants nothing until a pod restarts", "ok": false}], "hint": "It is the BINDING object type, not the namespace where the binding was created, that decides the reach.", "expl": "The near-miss is real: a RoleBinding CAN reference a ClusterRole — but it then projects that role only into its own namespace. So Line 1 gives svc-relay cluster-admin powers inside kube-system only. Line 2, a ClusterRoleBinding, projects the role across every namespace. The 'kube-system is privileged' shortcut and the 'any binding is cluster-wide' shortcut both fail here; the roleRef alone grants nothing until bound, but both lines are bindings.", "study": "Kubernetes RBAC projection rule: RoleBinding + ClusterRole = namespaced; ClusterRoleBinding + ClusterRole = cluster-wide."}, {"id": "h02", "type": "multi", "scen": [{"k": "p", "t": "03:11. deploy-bot created a ClusterRoleBinding granting <b>cluster-admin<\/b> to a ServiceAccount nobody recognises. Decide what makes this anomalous — and reject the two over-general claims that even senior responders get wrong."}, {"k": "art", "label": "ARTEFACT 1 — Audit line + context", "kind": "log", "lines": ["{\"sourceIPs\":[\"203[.]0[.]113[.]90\"],\"user\":{\"username\":\"system:serviceaccount:ci:deploy-bot\",\"groups\":[\"system:serviceaccounts:ci\"]},\"userAgent\":\"curl/8.1\",\"verb\":\"create\",\"objectRef\":{\"resource\":\"clusterrolebindings\",\"name\":\"kube-admin2\"},\"requestObject\":{\"roleRef\":{\"kind\":\"ClusterRole\",\"name\":\"cluster-admin\"},\"subjects\":[{\"kind\":\"ServiceAccount\",\"name\":\"kube-admin-sa\",\"namespace\":\"default\",\"creationTimestamp\":\"03:09\"}]}}"]}, {"k": "art", "label": "ARTEFACT 2 — Baseline", "kind": "code", "lines": ["deploy-bot normal window : 09:00-18:00 UTC from 10[.]201[.]4[.]0/24", "deploy-bot normal objects: rolebindings (deploy-reader), deployments", "kube-admin-sa            : created 03:09, two minutes before the binding"]}], "scenSum": "Select the four true anomaly signals", "q": "Select every statement that is a genuine anomaly signal here.", "options": [{"t": "The creation happened far outside the automation baseline window", "ok": true}, {"t": "The source IP is not in the CI subnet", "ok": true}, {"t": "The granted role is cluster-admin — far above deploy-bot's normal objects", "ok": true}, {"t": "The bound ServiceAccount was created two minutes earlier", "ok": true}, {"t": "The verb is create, and CI pipelines never use create", "ok": false}, {"t": "The user agent contains curl, and curl is always malicious", "ok": false}], "hint": "Four facts make this anomalous. Two statements are over-general rules that break against your own baseline.", "expl": "The four real signals: wrong time versus baseline, wrong source network, a role far above the identity's normal objects, and a freshly minted subject — together they reconstruct the classic backdoor chain (create account, then bind power to it). The two over-general claims fail because your own artefacts contradict them: deploy-bot legitimately uses create for its normal rolebindings, and curl appears in plenty of sanctioned automation. Signals must be judged against the baseline, not against slogans.", "study": "Baseline per identity: window, subnet, objects, verbs. Anomaly = deviation from that, not from folklore."}, {"id": "h03", "type": "dnd", "scen": [{"k": "p", "t": "Six events from one night, one queue. The change ticket CR-2291 covers GitOps sync and the 01:00–03:00 deploy window. Sort the events: covered by automation or change, versus anomalous."}, {"k": "art", "label": "ARTEFACT 1 — Event list", "kind": "code", "lines": ["1. argocd-sync   create rolebinding  app-ns    from 10[.]201[.]9[.]5   (GitOps)", "2. deploy-bot    create clusterrolebinding kb-drain  cluster-admin  01:40 CI subnet (window)", "3. deploy-bot    create clusterrolebinding kube-admin2 cluster-admin 03:11 from 203[.]0[.]113[.]90", "4. deploy-bot    create serviceaccount kube-admin-sa 03:09 from 203[.]0[.]113[.]90", "5. mbell (human) create rolebinding  dev-ns    from VPN 09:14 (on-call fix)", "6. mbell (human) create clusterrolebinding mb-admin cluster-admin from VPN 03:14"]}], "scenSum": "Expected vs anomalous across one night of events", "q": "Drag each event to the correct queue.", "zones": [{"id": "z1", "label": "Expected — automation or approved change"}, {"id": "z2", "label": "Anomalous — investigate now"}], "items": [{"t": "1. GitOps sync creates a rolebinding in app-ns", "zone": "z1", "why": "GitOps tools reconcile RBAC constantly — trusted identity, trusted pattern."}, {"t": "2. deploy-bot creates a clusterrolebinding during the window from the CI subnet", "zone": "z1", "why": "In-window, in-subnet, trusted identity — the change ticket covers it."}, {"t": "3. deploy-bot creates a cluster-admin binding at 03:11 from an external IP", "zone": "z2", "why": "Outside the window, wrong subnet, highest privilege — the same identity was abused."}, {"t": "4. deploy-bot creates an unknown ServiceAccount at 03:09", "zone": "z2", "why": "The subject materialises two minutes before the binding — the chain's first step."}, {"t": "5. mbell creates a rolebinding in dev-ns during on-call hours", "zone": "z1", "why": "Human, plausible namespace, on-call context — consistent with a fix."}, {"t": "6. mbell creates a cluster-admin ClusterRoleBinding from VPN at 03:14", "zone": "z2", "why": "Same night, same anomaly cluster as events 3-4 — correlated human+bot activity is worse, not better."}], "hint": "Judge each row on privilege × automation context × source — and watch which events cluster together in time.", "expl": "Two benign patterns anchor the queues: GitOps reconciliation and the in-window, in-subnet change. Everything tied to 03:09–03:14 from the external IP (or using its new ServiceAccount) forms one correlated anomaly — including the human who touched cluster-admin at 03:14, which is either collaboration or a second foothold. Events 2 and 3 are the same object type from the same identity: only context separates expected from alarming, which is exactly the HARD skill this file trains.", "study": "Correlate by time-and-identity clusters; never judge one audit line in isolation."}, {"id": "h04", "type": "qcm", "scen": [{"k": "p", "t": "Legacy cluster 'kube-old' authorises with an ABAC policy file on the control plane. An account suddenly has wider permissions, but the API server audit log for that hour shows no RBAC or ABAC API objects being written. Where is the evidence?"}, {"k": "art", "label": "ARTEFACT 1 — ATT&CK excerpt", "kind": "code", "lines": ["Where attribute-based access control (ABAC) is in use, an", "adversary with sufficient permissions may modify a Kubernetes", "ABAC policy to give the target account additional permissions."]}], "scenSum": "Where does ABAC policy modification leave evidence?", "q": "Where is the evidence most likely to be?", "options": [{"t": "Control-plane file-integrity and process telemetry around the policy file", "ok": true}, {"t": "In the kube-scheduler's scheduling decisions", "ok": false}, {"t": "In the email gateway logs", "ok": false}, {"t": "Nowhere — ABAC edits are unprovable in any telemetry", "ok": false}], "hint": "The API audit log records API objects. A policy FILE edit happens below that layer — which telemetry sees files and processes?", "expl": "ABAC policies live in a file read by the API server, so their modification is not an API call and never enters the API audit stream. The evidence sits one layer down: file-integrity monitoring, shell history and process auditing on the control-plane node (plus the restart that loads the new policy). The wrong options name unrelated components; 'unprovable' is false — you just need the right layer, which is the coverage gap many ABAC estates still have.", "study": "For ABAC clusters, add control-plane file/process telemetry — DET0572 alone cannot see this variant."}, {"id": "h05", "type": "term", "scen": [{"k": "p", "t": "Mid-incident on <span class=\"mono\">prod-eu<\/span>. Legal requires read-only actions only. You need to know exactly what the compromised identity could do: ServiceAccount <span class=\"mono\">jenkins-sa<\/span> in namespace <span class=\"mono\">ci<\/span>. Show its effective permissions by impersonating it."}, {"k": "art", "label": "ARTEFACT 1 — Environment", "kind": "code", "lines": ["cluster : prod-eu   (live, audit export running)", "your user: incident-lead, cluster-admin (but read-only mandated)", "target  : ServiceAccount ci/jenkins-sa", "rule    : nothing may change cluster state"]}], "scenSum": "Read-only permission check for a ServiceAccount (tool not named)", "q": "Type the read-only command that lists the effective permissions of that ServiceAccount, then run it and press Check.", "term": {"prompt": "incident-lead@prod-eu:~$", "canonical": "kubectl auth can-i --list --as=system:serviceaccount:ci:jenkins-sa -n ci", "setup": "context: prod-eu · impersonation permitted for incident-lead · audit export running", "elements": [{"re": "\\bkubectl\\b", "desc": "the cluster CLI (kubectl)"}, {"re": "\\bauth\\b", "desc": "the auth subcommand group"}, {"re": "\\bcan-i\\b", "desc": "the authorisation check: can-i"}, {"re": "--list\\b", "desc": "--list to enumerate all permissions instead of one"}, {"re": "--as=system:serviceaccount:ci:jenkins-sa\\b", "desc": "impersonates the ServiceAccount jenkins-sa in ci (full SA username)"}, {"re": "(-n\\s+ci\\b|--namespace=ci\\b|--namespace\\s+ci\\b)", "desc": "scopes the check to namespace ci"}], "danger": ["delete", "remove", "drain", "cordon", "patch", "apply", "create"], "out": ["Resources       Non-Resource URLs   Resource Names   Verbs", "*.*             []                  []               [*]", "selfsubjectaccessreviews.authorization.k8s.io [] [] [create]", "                 ... impersonated view of ci/jenkins-sa ..."], "err": "error: --as requires the full ServiceAccount username: system:serviceaccount:<ns>:<name>"}, "hint": "Do not describe or get the ServiceAccount — you need an authorisation check that impersonates it; --list enumerates instead of testing one verb.", "expl": "Canonical command: kubectl auth can-i --list --as=system:serviceaccount:ci:jenkins-sa -n ci. The wrong-looking shortcut — describe serviceaccount — shows metadata, not permissions. The near-miss without --list answers a single verb question. The full SA username system:serviceaccount:ci:jenkins-sa is required; --as=jenkins-sa alone means a human user name. Everything here is read-only: can-i never changes state, so legal's constraint holds. The output '*.*  [*]' tells you the identity was cluster-admin equivalent — confirming why the backdoor worked.", "study": "kubectl auth can-i --list --as=… is the safe, evidence-preserving way to answer 'what could this identity do?'"}, {"id": "h06", "type": "match", "scen": [{"k": "p", "t": "Detection-engineering review. Four analytics guard the cluster. Match each to the precise threat story it catches — two of the descriptions are deliberately near-miss."}, {"k": "art", "label": "ARTEFACT 1 — The four analytics", "kind": "code", "lines": ["A1: create/patch clusterrolebindings where roleRef.name=cluster-admin", "A2: create rolebindings (any ns) where roleRef.name matches *-admin", "A3: subjects include group system:masters, or group memberships escalate", "A4: bursts of subjectaccessreviews / selfsubjectaccessreviews"]}], "scenSum": "Match each analytic to the story it catches", "q": "Match each analytic to what it actually catches.", "lefts": [{"t": "A1 — cluster-admin clusterrolebindings (create/patch)", "why": "The flagship backdoor: cluster-wide admin granted to an account."}, {"t": "A2 — *-admin RoleBindings in any namespace", "why": "Namespaced admin grants — including preparation for namespace-scoped persistence."}, {"t": "A3 — system:masters group abuse", "why": "Joining the bootstrap superuser group bypasses ordinary RBAC objects entirely."}, {"t": "A4 — bursts of (self)subjectaccessreviews", "why": "Permission probing: the adversary asks 'what may I do?' before binding."}], "rights": ["Catches cluster-wide admin binding backdoors", "Catches namespaced admin grants, incl. prep for scoped persistence", "Catches attempts to join the bootstrap superuser group", "Catches permission probing that usually precedes a binding"], "pairs": [[0, 0], [1, 1], [2, 2], [3, 3]], "hint": "Match the filter to the privilege story: object type, role name pattern, group, or probing behaviour.", "expl": "A1 and A2 differ by object type and scope — cluster-wide versus namespaced. A3 is not about bindings at all: system:masters membership grants power outside the RBAC object model. A4 catches the reconnaissance step that typically precedes T1098.006. The near-miss trap is swapping A1 and A2's scope descriptions, or reading A4 as a persistence signal — probing is pre-stage behaviour.", "study": "Write one sentence per analytic: object + role + scope. If two sentences are interchangeable, your coverage is fuzzy."}, {"id": "h07", "type": "order", "scen": [{"k": "p", "t": "Incident bridge, minute 12. A rogue ClusterRoleBinding is confirmed on the payments cluster. Legal is on the call: 'Nothing that destroys evidence. The attacker may still be active.' Six runbook actions are on the table."}, {"k": "art", "label": "ARTEFACT 1 — Candidate actions", "kind": "code", "lines": ["A. Remove the rogue binding", "B. Export the API audit log slice around the event", "C. Capture the rogue binding YAML + the ServiceAccount/token list", "D. Confirm blast radius: roles, subjects, namespaces", "E. Rotate the affected ServiceAccount tokens and credentials", "F. Sweep other clusters and the cloud IAM layer for the same pattern"]}], "scenSum": "Sequence six actions under legal constraint", "q": "Put the response actions in the correct order.", "order": [{"t": "Export the API audit log slice around the event", "why": "First irreversible-risk reduction: the timeline leaves volatile retention."}, {"t": "Capture the rogue binding YAML + the ServiceAccount/token list", "why": "Freeze the objects exactly as the adversary left them."}, {"t": "Confirm blast radius: roles, subjects, namespaces", "why": "Know what revocation will and will not cover before acting."}, {"t": "Remove the rogue binding", "why": "Cut the persistence path — the access is now understood and documented."}, {"t": "Rotate the affected ServiceAccount tokens and credentials", "why": "Evict the identity from any cached tokens the binding legitimised."}, {"t": "Sweep other clusters and the cloud IAM layer for the same pattern", "why": "The estate-wide hunt — including the T1098.003 pairing the ATT&CK page warns about."}], "hint": "The least aggressive first step is copying evidence, not deleting things — and eviction without understanding misses caches.", "expl": "Legal's constraint forces evidence-first: export and capture are read-only. Blast-radius confirmation tells you which tokens matter. Removing the binding then kills the persistence mechanism; rotating tokens afterwards evicts stolen credentials that survive binding removal; the estate sweep closes the incident. Deleting first (A early) would have destroyed the subject list and roleRef context that the whole response depends on.", "study": "Order your own runbook under the constraint 'legal is always on the call'."}, {"id": "h08", "type": "qcm", "scen": [{"k": "p", "t": "The bridge gets tense. The payments platform is live, the attacker may still be inside, and three aggressive proposals hit the chat. Choose the action set that stops the adversary without destroying evidence or availability."}, {"k": "art", "label": "ARTEFACT 1 — The three proposals", "kind": "code", "lines": ["P1: delete the namespace, rebuild the cluster from scratch", "P2: restart the API server with audit logging disabled 'to stop the bleed'", "P3: remove the binding, keep workloads running, preserve logs, rotate the bound account's tokens"]}], "scenSum": "Choose the least-destructive effective response", "q": "Which action set is the correct, least-destructive next step?", "options": [{"t": "P3 — remove the binding, keep workloads running, preserve logs, rotate the bound account's tokens", "ok": true}, {"t": "P1 — delete the namespace and rebuild the cluster from scratch", "ok": false}, {"t": "P2 — restart the API server with audit logging disabled", "ok": false}, {"t": "None — wait for the weekly change window before acting", "ok": false}], "hint": "You must stop the access path without destroying evidence or availability — and one proposal actively silences your own telemetry.", "expl": "P3 threads the needle: the binding is the persistence mechanism, so removing it revokes the access path; keeping workloads running preserves the business; preserved logs and rotated tokens close the incident properly. P1 destroys evidence on a massive scale for a problem that one object removal solves. P2 is the alarming one — disabling audit logging during an active incident blinds you while the attacker watches. Waiting leaves an active cluster-admin compromise in place for days.", "study": "In RBAC backdoor response, the least-aggressive effective option usually exists — find it before the aggressive ones."}, {"id": "h09", "type": "dnd", "scen": [{"k": "p", "t": "A pull-request renames half the RBAC manifest. Review the six lines like a platform reviewer: three break Kubernetes rules, three are correct."}, {"k": "art", "label": "ARTEFACT 1 — RBAC manifest lines under review", "kind": "code", "lines": ["1. kind: RoleBinding", "   roleRef: {kind: ClusterRole, name: ci-deployer, apiGroup: rbac.authorization.k8s.io}", "2. kind: ClusterRole", "   roleRef: {kind: Role, name: cluster-admin}", "3. subjects: [{kind: ServiceAccount, name: system:admin}]", "   (used inside a RoleBinding in namespace 'ops')", "4. roleRef: {kind: ClusterRole, name: cluster-admin, apiGroup: rbac.authorization.k8s.io}", "5. subjects: [{kind: User, name: system:serviceaccount:ci:jenkins-sa}]", "6. rules: [{apiGroups: [\"*\"], resources: [\"*\"], verbs: [\"*\"]}]  # ClusterRole ci-deployer"]}], "scenSum": "Spot the mistake in six RBAC manifest lines", "q": "Drag each line to the correct verdict.", "zones": [{"id": "z1", "label": "Mistake — will misbehave or violates practice"}, {"id": "z2", "label": "Correct — valid Kubernetes RBAC"}], "items": [{"t": "1. RoleBinding references a ClusterRole", "zone": "z2", "why": "Valid and often surprising: a RoleBinding may project a ClusterRole into its namespace."}, {"t": "2. roleRef kind: Role pointing at cluster-admin", "zone": "z1", "why": "cluster-admin is a ClusterRole, not a namespaced Role — the kind is wrong and the binding will not work."}, {"t": "3. ServiceAccount subject without a namespace in a namespaced binding", "zone": "z1", "why": "A ServiceAccount lives in a namespace; omitting it makes the subject unresolvable."}, {"t": "4. roleRef with kind, name and apiGroup set", "zone": "z2", "why": "The canonical form — apiGroup rbac.authorization.k8s.io belongs on every RBAC roleRef."}, {"t": "5. ServiceAccount written as kind: User", "zone": "z1", "why": "ServiceAccounts must use kind: ServiceAccount with a namespace; the User form does not match the identity."}, {"t": "6. ClusterRole granting * / * / *", "zone": "z1", "why": "Technically valid YAML, but a least-privilege violation — the exact over-grant T1098.006 thrives on."}], "hint": "Three rows break type or identity rules; three follow the API spec. Read kind, name, apiGroup and namespace on every row.", "expl": "Line 1 is the famous projection rule (RoleBinding + ClusterRole = namespaced). Line 4 is textbook. The mistakes: a Role-kind roleRef cannot name a ClusterRole; a namespaced ServiceAccount subject needs its namespace; a ServiceAccount must not be written as kind: User; and a wildcard ClusterRole is the over-privileged pattern that turns any future compromise into a cluster take-over — the practice guidance the ATT&CK page references exists precisely to prevent line 6.", "study": "Kubernetes 'Role Based Access Control Good Practices' (reference 1 on the ATT&CK page) — read it once, then review PRs with it."}, {"id": "h10", "type": "multi", "scen": [{"k": "p", "t": "Coverage review. Three analytics are live (A1, A2, A3 below). The CISO asks: which T1098.006 variants would still slip through? Select the uncovered ones."}, {"k": "art", "label": "ARTEFACT 1 — Live analytics", "kind": "code", "lines": ["A1: create clusterrolebindings where roleRef=cluster-admin,", "    user is NOT an automation identity", "A2: create rolebindings in namespace=prod", "A3: cloud IAM role changes (covers T1098.003)"]}], "scenSum": "Which variants remain uncovered?", "q": "Select every variant that remains UNCOVERED by the three live analytics.", "options": [{"t": "Bindings created by a compromised CI/CD identity", "ok": true}, {"t": "Binding creation in non-prod namespaces, later promoted", "ok": true}, {"t": "Patch/update operations on existing clusterrolebindings", "ok": true}, {"t": "ClusterRoleBinding creation by humans to cluster-admin", "ok": false}, ege × automation context × source reputation — cluster-wide and untrusted beats namespaced and trusted.", "expl": "The ranking is privilege first, then trust of the actor and source. AL-1 is a live, cluster-wide backdoor with a freshly minted subject from an unknown network. AL-2 shares the night and the privilege name but is namespaced and from a known human — urgent to correlate, not to lead with. AL-3 and AL-4 sit inside expected patterns; they belong in daily review, not the incident queue. Note how AL-1 vs AL-2 repeats the scope near-miss from earlier — reach decides severity.", "study": "Triage formula for RBAC alerts: privilege of role × scope of binding × trust of identity × trust of source."}, {"id": "h13", "type": "qcm", "scen": [{"k": "p", "t": "A ticket says this command was 'just a small monitoring change'. Read it like an attacker would."}, {"k": "art", "label": "ARTEFACT 1 — The command from the ticket", "kind": "code", "lines": ["kubectl create clusterrolebinding read-all \\", "  --clusterrole=view \\", "  --serviceaccount=ops:monitor-sa"]}], "scenSum": "What does --clusterrole=view actually grant?", "q": "What did this command actually give monitor-sa?", "options": [{"t": "Cluster-wide read-only permissions, in every namespace", "ok": true}, {"t": "cluster-admin rights limited to the ops namespace", "ok": false}, {"t": "No permissions — view is only a placeholder name", "ok": false}, {"t": "Edit rights limited to the ops namespace", "ok": false}], "hint": "Read what the flag says, then remember which object type makes it cluster-wide — the binding name and the absence of -n are both red herrings.", "expl": "Two facts decide it: the flag references the built-in ClusterRole named view (read-only, non-resource and resource reads), and the object created is a ClusterRoleBinding — which projects that role across all namespaces. The binding's name read-all is irrelevant; the missing -n does not scope a ClusterRoleBinding because it has no namespace. The ' function highlight(l){

/* ===================== ANSWER <-> SCORING ===================== */
function haveAnswer(ex,idx){
  var a=S.answers[idx];
  if(!a) return false;
  switch(ex.type){
    case 'qcm': return a.sel!==undefined;
    case 'multi': return a.sel&&Object.keys(a.sel).length>0;
    case 'match': return a.assign&&Object.keys(a.assign).length>0;
    case 'dnd': return a.place&&Object.keys(a.place).some(function(k){ return a.place[k]; });
    case 'order': return true;
    case 'fill': return a.fills&&Object.keys(a.fills).length>0;
    case 'term': return !!(a.cmd&&a.cmd.trim());
    case 'branch': return Object.keys(a.choices).length===ex.steps.length;
  }
  return false;
}
function grade(ex,idx){
  var a=S.answers[idx]||{};
  var items=[]; var H=0,W=0,N=0;
  switch(ex.type){
    case 'qcm': {
      N=1;
      var pick=a.sel, ok=false;
      if(pick!==undefined){ ok=!!ex.options[pick].ok; H=ok?1:0; }
      items.push({st:pick===undefined?'○ Missed — nothing selected':(ok?'✓ Correct — you picked the right option':'✗ Wrong — that option is not correct'),cls:pick===undefined?'miss':(ok?'ok':'bad')});
      break; }
    case 'multi': {
      var sel=a.sel||{};
      N=ex.options.filter(function(o){return o.ok;}).length;
      ex.options.forEach(function(o,oi){
        var s=!!sel[oi];
        if(o.ok&&s){H++; items.push({st:'✓ Correct — selected: '+o.t,cls:'ok'});}
        else if(!o.ok&&s){W++; items.push({st:'✗ Wrong — selected: '+o.t,cls:'bad'});}
        else if(o.ok&&!s){items.push({st:'○ Missed — correct option not selected: '+o.t,cls:'miss'});}
      });
      break; }
    case 'match': {
      var as=a.assign||{};
      N=ex.pairs.length;
      ex.pairs.forEach(function(pr){
        var li=pr[0], want=pr[1], got=as[li];
        var ltxt=ex.lefts[li].t;
        if(got===undefined){ items.push({st:'○ Missed — '+ltxt+' left unmatched (correct: '+ex.rights[want]+')',cls:'miss',why:ex.lefts[li].why}); }
        else if(got===want){ H++; items.push({st:'✓ Correct — '+ltxt+' → '+ex.rights[want],cls:'ok',why:ex.lefts[li].why}); }
        else { W++; items.push({st:'✗ Wrong — '+ltxt+' → '+ex.rights[got]+' (correct: '+ex.rights[want]+')',cls:'bad',why:ex.lefts[li].why}); }
      });
      break; }
    case 'dnd': {
      var pl=a.place||{};
      N=ex.items.length;
      ex.items.forEach(function(it,ii){
        var want=it.zone, got=pl[ii];
        var zoneName=function(zid){ var z=ex.zones.filter(function(z){return z.id===zid;})[0]; return z?z.label:zid; };
        if(got===undefined||got===null){ items.push({st:'○ Missed — "'+it.t+'" left in the bank (correct zone: '+zoneName(want)+')',cls:'miss',why:it.why}); }
        else if(got===want){ H++; items.push({st:'✓ Correct — "'+it.t+'" in '+zoneName(want),cls:'ok',why:it.why}); }
        else { W++; items.push({st:'✗ Wrong — "'+it.t+'" placed in '+zoneName(got)+' (correct: '+zoneName(want)+')',cls:'bad',why:it.why}); }
      });
      break; }
    case 'order': {
      var seq=a.seq||[];
      N=ex.order.length;
      seq.forEach(function(ii,pos){
        var want=ii, got=pos;
        if(got===want){H++; items.push({st:'✓ Correct at position '+(pos+1)+' — '+ex.order[ii].t,cls:'ok',why:ex.order[ii].why});}
        else {W++; items.push({st:'✗ Wrong position '+(got+1)+' — '+ex.order[ii].t+' belongs at position '+(want+1),cls:'bad',why:ex.order[ii].why});}
      });
      break; }
    case 'fill': {
      var fs=a.fills||{};
      N=ex.blanks.length;
      ex.blanks.forEach(function(want,b){
        var raw=fs[b];
        var got=(raw===undefined||raw===null)?'':String(raw).replace(/\s+/g,' ').trim().toLowerCase();
        var w=String(want).toLowerCase();
        if(got===''){ items.push({st:'○ Missed — blank '+(b+1)+' empty (correct: '+want+')',cls:'miss'}); }
        else if(got===w){ H++; items.push({st:'✓ Correct — blank '+(b+1)+': '+got,cls:'ok'}); }
        else { W++; items.push({st:'✗ Wrong — blank '+(b+1)+': you used "'+got+'", correct is "'+want+'"',cls:'bad'}); }
      });
      break; }
    case 'term': {
      var t=ex.term; var cmd=normCmd(a.cmd||'');
      N=t.elements.length;
      var dangerHit=false;
      t.danger.forEach(function(d){ if(cmd.indexOf(d)>-1) dangerHit=true; });
      t.elements.forEach(function(el){
        var re=new RegExp(el.re,'i');
        if(re.test(cmd)){ H++; items.push({st:'✓ Correct element — '+el.desc,cls:'ok'}); }
        else { items.push({st:'○ Missed element — '+el.desc,cls:'miss'}); }
      });
      var extras=extraTokens(cmd,t);
      extras.forEach(function(x){ W++; items.push({st:'✗ Wrong/extra element — '+x,cls:'bad'}); });
      if(dangerHit) items.push({st:'✗ DANGEROUS — NEAR MISS: your command changes cluster state or destroys evidence. In a real incident this would be the wrong move.',cls:'bad'});
      break; }
    case 'branch': {
      var ch=a.choices||{};
      N=ex.steps.length;
      ex.steps.forEach(function(st,si){
        var got=ch[si], okIdx=st.options.map(function(o,i){return o.ok?i:-1;}).filter(function(x){return x>-1;})[0];
        var okT=st.options[okIdx].t;
        if(got===undefined){ items.push({st:'○ Missed — step '+(si+1)+' never confirmed',cls:'miss',why:st.options[okIdx].why}); }
        else if(got===okIdx){ H++; items.push({st:'✓ Correct at step '+(si+1)+' — '+okT,cls:'ok',why:st.options[okIdx].why}); }
        else { W++; items.push({st:'✗ Wrong at step '+(si+1)+' — you chose: '+st.options[got].t+' | best: '+okT,cls:'bad',why:st.options[got].why+' Best choice: '+st.options[okIdx].why}); }
      });
      break; }
  }
  var credit=scoreExercise(H,W,N);
  if(S.hintUsed[idx]) credit=Math.max(0,credit-0.10);
  return {credit:credit,items:items,N:N,H:H,W:W};
}
function normCmd(c){ return c.replace(/\s+/g,' ').trim().toLowerCase(); }
function extraTokens(cmd,t){
  var out=[];
  var tokens=cmd.split(' ');
  var matchedStr='';
  t.elements.forEach(function(el){
    try{ var m=new RegExp(el.re,'i').exec(cmd); if(m&&m[0]) matchedStr+=' '+m[0]; }catch(e){}
  });
  tokens.forEach(function(tok){
    if(tok.indexOf('-')===0){
      var base=tok.replace(/=.*$/,'');
      var inCanon=t.canonical.toLowerCase().indexOf(base)>-1;
      var inMatched=matchedStr.indexOf(tok)>-1||matchedStr.indexOf(base)>-1;
      if(!inCanon&&!inMatched&&tok!=='-') out.push('unexpected option "'+tok+'"');
    }
  });
  ['delete','remove','drain','cordon','patch','apply','replace','taint'].forEach(function(d){
    if(tokens.indexOf(d)>-1 && t.canonical.toLowerCase().indexOf(d)===-1) out.push('state-changing word "'+d+'" is not part of this read-only task');
  });
  return out.filter(function(v,i,a){ return a.indexOf(v)===i; });
}

/* ===================== FEEDBACK ===================== */
function feedbackHtml(ex,idx){
  var g=S.credits[idx]; if(!g) return '';
  var c=g.credit;
  var label,cls,icon;
  if(c>=0.999){ label='CORRECT'; cls='f-ok'; icon='✓'; }
  else if(c>0){ label='PARTIALLY CORRECT'; cls='f-part'; icon='✓'; }
  else { label='INCORRECT'; cls='f-bad'; icon='✗'; }
  var creditLine='credit '+c.toFixed(2)+' of 1.00'+(g.N>1?(' — '+Math.round(c*g.N)+' of '+g.N+' items, (H−W)/N'):' — single-answer (binary)')+(S.hintUsed[idx]?' · hint penalty applied (−0.10)':' · no hint used');
  var h='<div class="fb '+cls+'" role="region" aria-live="polite" aria-label="Feedback: '+label+'">'+
    '<div class="fbh">'+icon+' '+label+'<span class="credit">'+creditLine+'</span></div><div class="fbb">';
  if(g.N>1){ h+='<div class="items">'+g.items.map(function(it){ return '<div class="item '+it.cls+'"><span class="ic" aria-hidden="true">'+it.st.charAt(0)+'</span><span>'+esc(it.st.slice(2))+(it.why?' — <span class="muted">'+esc(it.why)+'</span>':'')+'</span></div>'; }).join('')+'</div>'; }
  else { h+='<div class="items">'+g.items.map(function(it){ return '<div class="item '+it.cls+'"><span class="ic" aria-hidden="true">'+it.st.charAt(0)+'</span><span>'+esc(it.st.slice(2))+'</span></div>'; }).join('')+'</div>'; }
  if(ex.type==='term'){
    h+='<h5>Canonical command</h5><div class="canon"><code>'+esc(ex.term.canonical)+'</code></div>';
    if(ex.term.canonExpl) h+='<p class="expl">'+ex.term.canonExpl+'</p>';
  }
  h+='<h5>Why</h5><p class="expl">'+ex.expl+'</p>';
  h+='<h5>What to study</h5><p class="study">'+esc(ex.study)+'</p></div></div>';
  return h;
}

/* ===================== NAV / ACTIONS ===================== */
function nextExercise(first){
  S.cur++;
  if(S.cur<TOTAL){ S.idx=S.order[S.cur]; S.fromReview=false; renderExam(); }
  else { S.fromReview=false; afterLast(); }
}
function afterLast(){
  if(S.skipped.length>0&&S.timer.state!=='ENDED'){ renderReview(); }
  else { endTime(); }
}
function doCheck(){
  if(S.inFeedback[S.idx]) return;
  var ex=EX.exercises[S.idx];
  if(!haveAnswer(ex,S.idx)){
    S.notice='⚠ Choose or place at least one answer first — or use Skip if you want to answer later.';
    renderExam();
    return;
  }
  S.notice='';
  setTimerState('PAUSED_AUTO_CHECK');
  var g=grade(ex,S.idx);
  S.credits[S.idx]=g; S.inFeedback[S.idx]=true;
  S.answered++; S.sum+=g.credit;
  renderExam();
}
function doNext(){
  S.notice='';
  setTimerState('RUNNING');
  if(S.fromReview){ S.fromReview=false; renderReview(); return; }
  nextExercise();
}
function doSkip(){
  if(S.inFeedback[S.idx]) return;
  S.notice='';
  if(S.skipped.indexOf(S.idx)===-1) S.skipped.push(S.idx);
  setTimerState('RUNNING');
  if(S.fromReview){ S.fromReview=false; S.skipped=S.skipped.filter(function(i){return i!==S.idx;}); S.skipped.push(S.idx); renderReview(); return; }
  S.cur++;
  if(S.cur<TOTAL){ S.idx=S.order[S.cur]; renderExam(); }
  else { afterLast(); }
}
function doHint(){
  if(S.inFeedback[S.idx]||S.hintUsed[S.idx]) return;
  S.hintUsed[S.idx]=true;
  renderExam();          /* the renderer emits the hint panel for hint-used exercises */
  updateHdr();
}
function doPause(){
  if(S.timer.state==='PAUSED_MANUAL'){ setTimerState(S.prevRunningState==='PAUSED_AUTO_CHECK'?'PAUSED_AUTO_CHECK':'RUNNING'); renderExam(); }
  else if(S.timer.state==='RUNNING'||S.timer.state==='PAUSED_AUTO_CHECK'){ S.prevRunningState=S.timer.state; setTimerState('PAUSED_MANUAL'); renderExam(); }
}
function endTime(auto){
  setTimerState('ENDED');
  renderResults();
}
/* ===================== REVIEW VIEW ===================== */
function renderReview(){
  S.view='review';
  var h='<h2 class="sec" style="color:var(--state-skipped)">⚠ Review skipped exercises</h2>'+
  '<div class="card prose"><p>You skipped '+S.skipped.length+' exercise'+(S.skipped.length===1?'':'s')+'. They are not graded yet. You can answer as many as you want while the timer still runs.</p>'+
  '<p class="muted">If you finish now, skipped exercises stay unanswered and are <b>excluded from the score</b> — they count neither for nor against you.</p></div>';
  S.skipped.forEach(function(idx){
    var ex=EX.exercises[idx];
    var answered=S.inFeedback[idx]!==undefined;
    h+='<div class="revrow"><span style="color:var(--state-skipped);font-weight:800" aria-hidden="true">⚠</span>'+
      '<span class="badge-sev '+SEVCLS+'" role="img" aria-label="Severity '+SEVWORD+'"><span class="dot" aria-hidden="true"></span>'+SEVWORD+'</span>'+
      '<span class="t"><b>Exercise '+(S.order.indexOf(idx)+1)+'</b> — '+esc(ex.scenSum)+'</span>'+
      (answered?'<span class="chip">✓ answered</span>':'<button class="btn sm" data-act="rev" data-i="'+idx+'" aria-label="Answer this skipped exercise">Answer →</button>')+
      '</div>';
  });
  h+='<div class="navrow"><button class="btn primary" data-act="finish" aria-label="Finish exam and see results">Finish exam →</button>'+
    '<span class="note">Timer keeps running during review.</span></div>';
  $('view').innerHTML=h;
  updateHdr();
  window.scrollTo(0,0);
}
/* ===================== RESULTS VIEW ===================== */
function renderResults(){
  S.view='results';
  var full=0,part=0,zero=0,partSum=0;
  Object.keys(S.credits).forEach(function(k){
    var c=S.credits[k].credit;
    if(c>=0.999) full++;
    else if(c>0){ part++; partSum+=c; }
    else zero++;
  });
  var skippedNever=TOTAL-S.answered;   /* exercises never answered (skipped or timeout) — excluded from score */
  var pct=(S.answered>0)?Math.round((S.sum/S.answered)*100):0;
  var passed=pct>=70;
  var h='<div class="card res-hero '+(passed?'pass':'fail')+'">'+
    '<div class="pct" aria-label="Final score '+pct+' percent">'+pct+'%</div>'+
    '<div class="verdict" role="status">'+(passed?'✓ PASS':'✗ FAIL')+'</div>'+
    '<div class="muted" style="margin-top:8px">Final score <b class="mono">'+S.sum.toFixed(1)+' / '+S.answered+'</b> over answered exercises · pass mark 70% · '+SEVWORD+' exam</div>'+
  '</div>';
  h+='<div class="resgrid">'+
    '<div class="rescard ok"><div class="num" aria-label="Fully correct count">'+full+'</div><div class="lab">✓ Fully correct</div></div>'+
    '<div class="rescard part"><div class="num">'+part+'</div><div class="lab">✓ Partially correct'+(part?' — avg '+(partSum/part).toFixed(2):'')+'</div></div>'+
    '<div class="rescard bad"><div class="num">'+zero+'</div><div class="lab">✗ Fully incorrect</div></div>'+
    '<div class="rescard skip"><div class="num">'+(TOTAL-S.answered)+'</div><div class="lab">⚠ Skipped — excluded</div></div>'+
  '</div>';
  h+='<div class="card prose">'+
    '<h3 style="margin-top:0">'+(passed?'🎓 Certificate-style result':'📌 Keep going')+'</h3>'+
    (passed?'<div class="certline">This result shows working knowledge of <b>'+esc(EX.objId)+' — '+esc(EX.objName)+'</b> at <b>'+SEVWORD+'</b> level. You can download or screenshot this panel as your record for this attempt.</div>'
           :'<p>You did not reach the 70% pass mark this time. Review the explanations you saw, then press <b>Retake Exam</b> — the exercise order and answer positions are shuffled again.</p>')+
    '<div class="pauselog" aria-label="Pause accounting">'+
      '<span>⏸ Manual pause time: <b class="mono">'+fmt(S.timer.manualMs/1000)+'</b></span>'+
      '<span>⏸ Feedback review time (auto-pause): <b class="mono">'+fmt(S.timer.autoMs/1000)+'</b></span>'+
      '<span>⏱ Time left at submit: <b class="mono">'+fmt(S.timer.remain)+'</b></span>'+
    '</div>'+
  '</div>';
  h+='<div class="navrow"><button class="btn primary" data-act="retake" aria-label="Retake the exam">↺ Retake Exam</button></div>';
  $('view').innerHTML=h;
  updateHdr();
  window.scrollTo(0,0);
  if(!S.reported){
    S.reported=true;
    reportScore(S.sum,S.answered);
  }
}
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:METACFG.topicId,
      batch:METACFG.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=70
    },location.origin);
  }catch(e){ /* opened directly — nothing to report to */ }
}
/* ===================== EVENTS ===================== */
document.addEventListener('click',function(ev){
  var btn=ev.target.closest('[data-act]');
  if(!btn) return;
  var act=btn.getAttribute('data-act');
  var ex=EX.exercises[S.idx];
  switch(act){
    case 'start': startExam(); break;
    case 'collapse': S.collapsed[S.idx]=!S.collapsed[S.idx]; renderExam(); break;
    case 'check': doCheck(); break;
    case 'next': doNext(); break;
    case 'skip': doSkip(); break;
    case 'hint': doHint(); break;
    case 'pause': doPause(); break;
    case 'retake': startExam(); break;
    case 'finish': endTime(); break;
    case 'rev': {
      var i=parseInt(btn.getAttribute('data-i'),10);
      S.idx=i; S.fromReview=true; setTimerState('RUNNING'); S.view='exam'; renderExam(); break;
    }
    case 'opt': {
      var oi=parseInt(btn.getAttribute('data-i'),10);
      if(!ex) break;
      var a=S.answers[S.idx]||(S.answers[S.idx]={});
      if(ex.type==='qcm'){ a.sel=oi; }
      else { a.sel=a.sel||{}; if(a.sel[oi]) delete a.sel[oi]; else a.sel[oi]=1; }
      renderExam(); break;
    }
    case 'mleft': S.selLeft=parseInt(btn.getAttribute('data-i'),10); S.selRight=null; renderExam(); break;
    case 'mright': {
      if(S.selLeft===null||S.selLeft===undefined) { S.notice='⚠ Pick an item on the left first, then pick its match.'; renderExam(); break; }
      var ri=parseInt(btn.getAttribute('data-i'),10);
      var am=S.answers[S.idx]||(S.answers[S.idx]={assign:{}});
      am.assign[S.selLeft]=ri; S.selRight=ri; S.notice=''; renderExam(); break;
    }
    case 'ditem': S.selItem=parseInt(btn.getAttribute('data-i'),10); renderExam(); break;
    case 'dzone': {
      if(S.selItem===null||S.selItem===undefined){ break; }
      var zid=btn.getAttribute('data-i');
      var ad=S.answers[S.idx]||(S.answers[S.idx]={place:{}});
      ad.place[S.selItem]=zid; S.selItem=null; renderExam(); break;
    }
    case 'dunplace': {
      var ii=parseInt(btn.getAttribute('data-i'),10);
      var ad2=S.answers[S.idx]||(S.answers[S.idx]={place:{}});
      if(S.selItem!==null&&S.selItem!==undefined){
        var zhost=btn.closest('.zone');
        if(zhost) ad2.place[S.selItem]=zhost.getAttribute('data-zone');
        S.selItem=null;
      } else {
        ad2.place[ii]=null;
      }
      renderExam(); break;
    }
    case 'oup': case 'odown': {
      var jj=parseInt(btn.getAttribute('data-i'),10);
      var ao=S.answers[S.idx]||(S.answers[S.idx]={seq:S.perms[S.idx].order.slice()});
      var pos=ao.seq.indexOf(jj);
      var to=act==='oup'?pos-1:pos+1;
      if(to<0||to>=ao.seq.length) break;
      var tmp=ao.seq[pos]; ao.seq[pos]=ao.seq[to]; ao.seq[to]=tmp;
      renderExam(); break;
    }
    case 'wbank': {
      S.selWord=btn.getAttribute('data-w');
      var exf=EX.exercises[S.idx];
      var af=S.answers[S.idx]||(S.answers[S.idx]={fills:{}});
      var target=-1;
      exf.text.forEach(function(seg){ if(typeof seg!=='string'&&target===-1){ var bb=seg.b; if(!af.fills[bb]) target=bb; } });
      if(target>-1){ af.fills[target]=S.selWord; S.selWord=null; }
      renderExam(); break;
    }
    case 'trun': runTerm(); break;
    case 'bopt': {
      var si=parseInt(btn.getAttribute('data-s'),10), boi=parseInt(btn.getAttribute('data-i'),10);
      var ab=S.answers[S.idx]||(S.answers[S.idx]={choices:{},step:0});
      ab.choices[si]=boi; renderExam(); break;
    }
    case 'bconfirm': {
      var ab2=S.answers[S.idx]||(S.answers[S.idx]={choices:{},step:0});
      if(ab2.choices[ab2.step]===undefined){ S.notice='⚠ Choose one option for this step, then confirm.'; renderExam(); break; }
      S.notice='';
      if(ab2.step<ex.steps.length-1){ ab2.step++; renderExam(); }
      else { doCheck(); }
      break;
    }
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t&&t.classList&&t.classList.contains('blankin')){
    var b=parseInt(t.getAttribute('data-b'),10);
    var a=S.answers[S.idx]||(S.answers[S.idx]={fills:{}});
    a.fills[b]=t.value;
    t.classList.toggle('filled', !!t.value);
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.target&&ev.target.id==='termin'&&ev.key==='Enter'){ ev.preventDefault(); runTerm(); }
});
document.addEventListener('dragstart',function(ev){
  var el=ev.target.closest('[draggable="true"]');
  if(!el) return;
  ev.dataTransfer.setData('text/plain',el.getAttribute('data-i')||'');
  el.classList.add('dragging');
});
document.addEventListener('dragend',function(ev){
  var el=ev.target.closest('.dragging'); if(el) el.classList.remove('dragging');
});
document.addEventListener('dragover',function(ev){
  var z=ev.target.closest('.zone');
  if(z){ ev.preventDefault(); z.classList.add('over'); }
});
document.addEventListener('dragleave',function(ev){
  var z=ev.target.closest('.zone'); if(z) z.classList.remove('over');
});
document.addEventListener('drop',function(ev){
  var z=ev.target.closest('.zone');
  if(!z) return;
  ev.preventDefault(); z.classList.remove('over');
  var di=ev.dataTransfer.getData('text/plain');
  if(di==='') return;
  S.selItem=parseInt(di,10);
  var ex=EX.exercises[S.idx];
  var ad=S.answers[S.idx]||(S.answers[S.idx]={place:{}});
  ad.place[S.selItem]=z.getAttribute('data-zone');
  S.selItem=null; renderExam();
});
document.addEventListener('dragstart',function(ev){
  var row=ev.target.closest('.orow');
  if(!row) return;
  ev.dataTransfer.setData('text/orow',row.getAttribute('data-i'));
});
document.addEventListener('dragover',function(ev){
  var row=ev.target.closest('.orow');
  if(row&&ev.dataTransfer.types.indexOf('text/orow')>-1){ ev.preventDefault(); }
});
document.addEventListener('drop',function(ev){
  var row=ev.target.closest('.orow');
  if(!row) return;
  var src=ev.dataTransfer.getData('text/orow');
  if(src==='') return;
  ev.preventDefault();
  var ex=EX.exercises[S.idx];
  var ao=S.answers[S.idx]||(S.answers[S.idx]={seq:S.perms[S.idx].order.slice()});
  var si=parseInt(src,10), ti=parseInt(row.getAttribute('data-i'),10);
  var a=ao.seq.indexOf(si), b=ao.seq.indexOf(ti);
  if(a<0||b<0) return;
  ao.seq.splice(b,0,ao.seq.splice(a,1)[0]);
  renderExam();
});
/* ===================== TERMINAL ===================== */
function runTerm(){
  var ex=EX.exercises[S.idx];
  if(!ex||ex.type!=='term') return;
  var t=ex.term;
  var inp=$('termin'); if(!inp) return;
  var cmd=inp.value;
  if(!cmd.trim()) return;
  var hist=S.termHist[S.idx];
  var a=S.answers[S.idx]||(S.answers[S.idx]={cmd:cmd});
  a.cmd=cmd;
  var n=normCmd(cmd);
  var cls='echo', txt=t.prompt+' '+cmd;
  hist.push({cls:'echo',t:txt});
  var dangerHit=false;
  (t.danger||[]).forEach(function(d){ if(n.indexOf(d)>-1) dangerHit=true; });
  var allOk=t.elements.every(function(el){ return new RegExp(el.re,'i').test(n); });
  if(dangerHit){
    hist.push({cls:'err',t:'error: this would change cluster state or destroy evidence — simulation blocked the real effect'});
  } else if(allOk){
    (t.out||['(ok)']).forEach(function(l){ hist.push({cls:'good',t:l}); });
  } else {
    var toolOk=new RegExp('^kubectl(\\s|$)','i').test(n);
    if(!toolOk){ hist.push({cls:'err',t:'command not found: '+cmd.split(' ')[0]}); }
    else { hist.push({cls:'err',t:(t.err||'error: wrong arguments — the goal needs different options')}); }
  }
  renderExam();
  var sc=$('scr-'+S.idx); if(sc) sc.scrollTop=sc.scrollHeight;
  var ti=$('termin'); if(ti&&!S.inFeedback[S.idx]) ti.focus();
}
/* ===================== HANDSHAKE ===================== */
window.addEventListener('message',function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT') return;
  S.user.name=event.data.username||'';
  S.user.country=event.data.country||'';
  S.user.locale=event.data.locale||'en';
  /* theme is always 'dark'; this file is dark-only by contract — nothing to switch */
  updateHdr();
});
/* ===================== BOOT ===================== */
function boot(){
  var app=document.getElementById('app');
  app.innerHTML='<div id="hdr" class="hdr"></div><div id="view"></div>';
  renderIntro();
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',boot); } else { boot(); }
})();
