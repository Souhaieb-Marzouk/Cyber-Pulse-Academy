var EXAM = {"topicId":"t1553.006","mitreId":"T1553.006","objectName":"Code Signing Policy Modification","objectType":"Sub-Technique","severity":"HARD","timerMinutes":40,"estimatedMinutes":40,"passMark":70,"learnIntro":["This exam is about T1553.006, Code Signing Policy Modification, a sub-technique of T1553 (Subvert Trust Controls) in the Defense Evasion tactic, TA0005. Instead of faking a signature, the adversary switches off or relaxes the signing enforcement itself, so unsigned or self-signed code becomes acceptable. On Windows that enforcement is Driver Signature Enforcement (DSE) with options such as TESTSIGNING; on macOS it is System Integrity Protection (SIP). You will learn to recognise every modification path and the controls that limit them.","You will work as a SOC analyst, threat hunter, IR lead and detection engineer at Kestrel Aero Components, an aerospace parts maker with a legitimate kernel-driver team. You will read SIEM event feeds, judge whether test-signing states are approved or alarming, and run read-only inspection commands such as bcdedit /enum and csrutil status in a simulated shell. You will also build DET0523-style correlations with analytics AN1446 and AN1447 and bridge the reboot gap between a command at time T and its effect at T+n after a restart.","The risk is a host that stays durably weaker until the policy is reverted: unsigned kernel drivers, blue screens and hidden persistence. You will meet the Pandora BYOVD chain that abuses CVE-2017-15303 to flip g_CiOptions in kernel memory with no command line at all, learn why removing the Test Mode watermark is itself a signal, and see why Secure Boot (M1046) is only partial prevention that needs M1026 and M1024 beside it."],"keywords":[{"theme":"Detection strategy","items":["DET0523","AN1446","AN1447","reboot gap","correlation","driver-load telemetry","boot configuration state"]},{"theme":"Commands and mechanisms","items":["bcdedit.exe -set TESTSIGNING ON","bcdedit /enum","csrutil disable","csrutil status","TESTSIGNING","Test Mode watermark","g_CiOptions","Driver Signature Enforcement (DSE)","System Integrity Protection (SIP)"]},{"theme":"Attacker paths","items":["BYOVD","CVE-2017-15303","S0664 Pandora","G0010 Turla","T1068","unsigned driver load","kernel memory"]},{"theme":"Controls","items":["M1046 Secure Boot","M1026 Privileged Account Management","M1024 Restrict Registry Permissions","RequireSigned","registry permissions","change records"]},{"theme":"Judgement calls","items":["policy modification vs signature abuse","benign developer test signing","artifact removal","least-aggressive response","production server flip"]}]};
var EXERCISES = [{"id":"e01","type":"match","perspective":"defender","scenario":{"title":"DET0523 build — map each problem to its component","blocks":[{"kind":"text","body":"You are detection engineer e.tanaka at Kestrel Aero Components, an aerospace parts maker. After INC-41288 you must implement DET0523, 'Detect Code Signing Policy Modification (Windows & macOS)'. DET0523 ships two analytics. AN1446 works the Windows side: it correlates execution of administrative utilities such as bcdedit.exe and registry modifications that disable Driver Signature Enforcement (DSE) or enable Test Signing, together with later process executions that bypass signing enforcement. AN1447 works the macOS side: it correlates csrutil disable with subsequent SIP state changes and anomalous unsigned process executions. Both analytics must expect the reboot gap: the command lands at time T, but TESTSIGNING and recovery-mode changes only take effect at T+n after a restart. A rule that only looks inside one hour will miss the whole technique. Match each problem to the DET0523 component or scope note that owns it."},{"kind":"code","label":"ARTEFACT 1 — DET0523 strategy note","lines":["DET0523 — Detect Code Signing Policy Modification (Windows & macOS)","AN1446: admin utilities (bcdedit.exe) + registry policy changes + later unsigned executions","AN1447: csrutil / SIP state changes + anomalous unsigned process executions","Shared rule: bridge the reboot gap between command at T and effect at T+n","Kernel-memory path (g_CiOptions): no command line — use driver-load telemetry"]}]},"question":"Match each detection problem to the DET0523 component or scope note that owns it.","answer":{"left":[{"id":"l1","text":"bcdedit.exe -set TESTSIGNING ON appears in process telemetry"},{"id":"l2","text":"csrutil disable is executed from recoveryOS on a Mac"},{"id":"l3","text":"Registry keys holding signing policy are tampered with (Hikit-style)"},{"id":"l4","text":"Command lands at 21:14; testsigning=Yes appears only after the 03:02 reboot"},{"id":"l5","text":"Unsigned driver loads with no bcdedit or registry policy event before it"},{"id":"l6","text":"An installer signed with a bought reseller certificate runs untouched"}],"right":[{"id":"r1","text":"AN1446 — Windows admin-utility and registry correlation"},{"id":"r2","text":"AN1447 — macOS csrutil and SIP state correlation"},{"id":"r3","text":"Reboot-gap bridging — correlate the command with the post-restart effect"},{"id":"r4","text":"Driver-load telemetry — the kernel path leaves no command line"},{"id":"r5","text":"Outside DET0523 — signature abuse (T1553.002); the policy was never modified"},{"id":"r6","text":"M1046 Secure Boot — a partial prevention control, not an analytic"}],"correct":{"l1":"r1","l2":"r2","l3":"r1","l4":"r3","l5":"r4","l6":"r5"}},"explanation":"AN1446 owns the Windows rows: bcdedit-style utility runs and registry tampering (the Hikit pattern) that disable DSE or enable Test Signing. AN1447 owns the csrutil and SIP row. The timing row is the reboot-gap bridge both analytics need. A silent unsigned driver load only shows in driver-load telemetry, because the kernel path types nothing. The reseller-signed installer is signature abuse (T1553.002): no policy changed, so DET0523 does not fire for it.","study":"What to study: DET0523, AN1446, AN1447 and the reboot-gap correlation rule.","hint":"One row never modified a policy, so it belongs outside this detection strategy."},{"id":"e02","type":"multi","perspective":"defender","scenario":{"title":"Ticket INC-41288 — bridging the reboot gap on FIN-APP-07","blocks":[{"kind":"text","body":"You are SOC analyst n.farid on the overnight shift at Kestrel Aero Components. Ticket INC-41288 opened because the settlement application on FIN-APP-07 started behaving oddly. The SIEM feed below covers the evening and the next morning. A reboot alone proves nothing: unattended restarts also happen during patch windows. What proves policy modification is the chain — a state-changing command before the restart, a changed boot state after it, and unsigned code that only runs because enforcement is off. That chain is exactly what a DET0523-style correlation must bridge across the reboot gap. Select the three facts that together let the rule confirm policy modification rather than a random reboot. Facts that are true but irrelevant must stay unselected."},{"kind":"log","label":"ARTEFACT 1 — Kestrel SIEM event feed (host FIN-APP-07)","lines":["2026-03-02T18:55:02Z  PROC  chrome.exe  routine update check  user=svc_web","2026-03-02T21:14:09Z  PROC  cmd.exe → bcdedit.exe -set TESTSIGNING ON  user=svc_batch","2026-03-02T21:14:12Z  REG   write to code-signing policy key under HKLM\\SYSTEM\\CurrentControlSet","2026-03-02T23:40:19Z  PROC  backup snapshot job svchost.exe started  (noise)","2026-03-03T03:02:55Z  BOOT  reboot initiated  event 1074  reason=Unattended","2026-03-03T03:06:31Z  BOOT  boot configuration state read: testsigning=Yes","2026-03-03T03:41:12Z  LOAD  unsigned driver gpio_sw.sys loaded into kernel","2026-03-03T09:12:40Z  DESK  EDR capture: Test Mode watermark visible bottom-right"]}]},"question":"Select the three facts that together bridge the reboot gap and confirm policy modification.","answer":{"options":["bcdedit.exe -set TESTSIGNING ON executed at 21:14 under svc_batch","Boot configuration state read after the 03:02 reboot shows testsigning=Yes","Unsigned driver gpio_sw.sys loaded after the reboot","The reboot used the Unattended reason code, seen on patched servers too","chrome.exe ran a routine update check at 18:55"],"correct":[0,1,2]},"explanation":"The correlation needs the before-state (the bcdedit command), the after-state (testsigning=Yes read from boot configuration) and the consequence (an unsigned kernel driver that only loads because enforcement is off). The Unattended reason code also appears during routine patching, so it cannot carry the verdict on its own. The browser update check is plain noise.","hint":"The unattended reboot reason also appears during patching — it cannot be one of your three facts."},{"id":"e03","type":"terminal","perspective":"defender","scenario":{"title":"Ticket INC-41288 — capture FIN-APP-07 boot state read-only","blocks":[{"kind":"text","body":"You are the IR operator on FIN-APP-07 for INC-41288 at Kestrel Aero Components. Earlier telemetry showed bcdedit.exe -set TESTSIGNING ON run under the service account svc_batch, followed by a reboot and an unsigned driver load. Before any remediation you must capture the CURRENT boot configuration state as evidence. The bcdedit.exe utility has two families of switches: enumeration views that only read the boot store, and write switches that change state — on this evidence shell, writes are forbidden. A read-only capture shows whether testsigning is currently Yes or No without touching anything. Type the bcdedit command that prints the boot configuration. Anything that writes or deletes boot store entries will be blocked and logged. Work from the prompt below; nothing real is executed."},{"kind":"artefact","label":"ARTEFACT 1 — INC-41288 context","body":"host: FIN-APP-07 (Windows Server, settlement application)\nobserved: bcdedit.exe -set TESTSIGNING ON at 2026-03-02T21:14:09Z (svc_batch)\nafter reboot: testsigning=Yes; unsigned driver gpio_sw.sys active\noperator shell: read-only evidence capture — state-changing switches forbidden"}]},"question":"Type the bcdedit command that prints the current boot configuration without changing anything.","answer":{"prompt":"ir-op@fin-app-07:~$","termTitle":"simulated evidence shell — read-only, nothing real is executed","required":[{"desc":"uses the bcdedit tool","re":"^bcdedit"},{"desc":"uses the read-only /enum view","re":"/enum"}],"forbidden":[{"desc":"writes boot state with -set (the T1553.006 modification itself)","re":"\\-set|/set","danger":true,"note":"bcdedit.exe -set TESTSIGNING ON is exactly the policy modification under investigation; never run it during evidence capture."},{"desc":"deletes boot configuration entries","re":"/delete|/deletevalue","danger":true,"note":"Deleting BCD entries can leave the server unbootable and destroys state."}],"canonical":"bcdedit /enum","output":["Windows Boot Manager","--------------------","identifier              {bootmgr}","device                  partition=\\Device\\HarddiskVolume1","Windows Boot Loader","-------------------","identifier              {current}","device                  partition=C:","path                    \\Windows\\system32\\winload.exe","testsigning             Yes","nointegritychecks       No"]},"explanation":"bcdedit is the boot configuration tool, and /enum is the view that only reads the store, so the current testsigning=Yes state is captured without altering it. The -set family is the near-miss: it is the very command that performed the T1553.006 modification, and running it here would change live evidence. The /delete switches would damage the boot store itself.","hint":"One switch family changes the boot store — rule that family out entirely."},{"id":"e04","type":"dragdrop","perspective":"dual","scenario":{"title":"Hunt HUNT-4131 — benign or alarming test-signing states","blocks":[{"kind":"text","body":"You are classifying HUNT-4131 results at Kestrel Aero Components. The company builds a signed kernel driver for its CNC controllers, so the kernel-driver team legitimately tests unsigned builds. Change record CHG-41211 approves TESTSIGNING ON on DEV-LT-201 and DEV-LT-202 only, and those laptops show the Test Mode watermark in every baseline capture. Change record CHG-41260 approved a time-boxed SIP-disabled rebuild of KES-MAC-03. Security policy SEC-114 says production servers must never run in test signing. Some hunt hits look alarming but match an approved change; others look quiet but are the real incident. When a state matches a live change record, it is benign even if it looks scary. Sort each observation."},{"kind":"artefact","label":"ARTEFACT 1 — fleet policy extract","body":"CHG-41211: TESTSIGNING ON approved on DEV-LT-201 / DEV-LT-202 (kernel-driver team; watermark expected)\nCHG-41260: SIP disabled on KES-MAC-03 for lab rebuild; window ended 2026-02-20\nSEC-114: production servers must never be test-signed\nKernel-path note: BYOVD chains need no bcdedit event at all"}]},"question":"Drag each observation into the correct bucket.","answer":{"buckets":[{"id":"b1","label":"Benign — matches an approved change"},{"id":"b2","label":"Alarming — investigate now"}],"items":[{"id":"i1","text":"DEV-LT-201 shows the Test Mode watermark; CHG-41211 approved TESTSIGNING ON for the driver team"},{"id":"i2","text":"FIN-APP-07 flipped to testsigning=Yes at 02:47 with no matching change record"},{"id":"i3","text":"DEV-LT-201's watermark disappeared last week, but its boot config still says testsigning Yes"},{"id":"i4","text":"KES-MAC-03 has SIP disabled during an approved lab rebuild window per CHG-41260"},{"id":"i5","text":"OPS-WKS-63, a payment-batch host, shows an unsigned driver load with no bcdedit command line"},{"id":"i6","text":"DEV-LT-202 has TESTSIGNING ON and a kernel-driver team user signed in"}],"correct":{"i1":"b1","i2":"b2","i3":"b2","i4":"b1","i5":"b2","i6":"b1"}},"explanation":"The two developer laptops and the approved SIP window match live change records, so the scary-looking watermark and disabled SIP are benign there. FIN-APP-07 is a production server with no change record — the sudden flip is the incident. The vanished watermark on DEV-LT-201 is artifact removal while the state stays test-signed, which is adversary behaviour. The unsigned driver with no command line is the kernel path: quiet on the surface and exactly what a hunter must not dismiss.","hint":"Check each row against CHG-41211, CHG-41260 and SEC-114 before judging how it looks."},{"id":"e05","type":"qcm","perspective":"defender","scenario":{"title":"Ticket INC-41322 — name the technique on OPS-WKS-63","blocks":[{"kind":"text","body":"Ticket INC-41322 involves OPS-WKS-63, a payment-batch workstation at Kestrel Aero Components. An unsigned kernel driver is loaded and a small service keeps it alive. Your checks show no bcdedit run, no registry policy change, and Secure Boot enabled since build. Kernel telemetry, however, shows the g_CiOptions variable was altered in memory and Driver Signature Enforcement is off right now. Last month a different host ran an installer signed with a certificate bought from a reseller, and another host had a rogue root certificate installed. Those were different failures of trust with different fixes. Name the technique that explains OPS-WKS-63."},{"kind":"artefact","label":"ARTEFACT 1 — INC-41322 evidence","body":"bcdedit /enum: testsigning No (unchanged)\nregistry policy keys: no modification events\nkernel telemetry: g_CiOptions altered in memory; DSE currently off\nloaded module: unsigned gpio_sw.sys kept alive by service 'GpioSvc'"},{"kind":"artefact","label":"ARTEFACT 2 — earlier fleet incidents (for contrast)","body":"INC-40977: installer signed with a reseller-bought certificate executed — signature valid, software malicious\nINC-41002: rogue root certificate added to the local trust store"}]},"question":"Which technique correctly describes what happened on OPS-WKS-63?","answer":{"options":["T1553.002 — the driver carried a valid signature from a bought certificate","T1553.004 — a rogue root certificate was installed to trust the driver","T1553.006 — signing enforcement was modified in kernel memory, not on disk","T1112 — a plain registry change; no trust control was touched"],"correctIndex":2},"explanation":"The boot store and registry were untouched, but the enforcement variable g_CiOptions was changed in kernel memory — that is exactly the kernel-memory path of T1553.006, reached through a signed vulnerable driver. T1553.002 abuses a valid signature and leaves policy alone, and the signature here is not valid anyway. T1553.004 installs a root certificate, and no certificate was added. T1112 is wrong because no registry value was modified.","hint":"The registry and boot store were both untouched — that rules out two of the four options."},{"id":"e06","type":"branch","perspective":"defender","scenario":{"title":"Bridge INC-41288 — respond to a flipped production server","blocks":[{"kind":"text","body":"You lead the IR bridge for INC-41288 on FIN-APP-07, Kestrel Aero Components' settlement server. Facts: testsigning=Yes since 02:47, unsigned driver gpio_sw.sys active in kernel, no change record, EDR evidence partially collected. The settlement run finishes at 18:00 and the business wants minimum disruption. Your director wants the server 'just fixed now'. You must pick the proportionate action at each decision point: aggressive options destroy evidence or availability, and passive options leave the host durably weaker. Remember that a policy change stays weak until it is actually reverted and the path is closed. Decide step by step."},{"kind":"artefact","label":"ARTEFACT 1 — bridge facts","body":"host: FIN-APP-07 (settlement, production)\nstate: testsigning=Yes since 02:47; unsigned driver gpio_sw.sys active\nchange records: none match this host or window\napproved change window: 22:00–23:30 tonight\nevidence so far: process, registry and driver-load events exported read-only"}]},"question":"Work through the three decision steps.","answer":{"steps":[{"text":"Evidence is still partial and the server is live. First move?","options":["Capture the remaining evidence read-only, including bcdedit /enum output","Re-image FIN-APP-07 immediately","Run bcdedit.exe -set TESTSIGNING OFF right now without recording anything","Disable the EDR agent to remove the driver by hand"],"correctIndex":0},{"text":"Evidence confirms no change record and kernel access from an unsigned driver. Contain?","options":["Keep FIN-APP-07 online and watch the attacker work","Re-image the settlement tier during the 18:00 settlement run","Isolate FIN-APP-07 from the network now and revert policy in tonight's approved window","Ask svc_batch's owner to reset the password and close the ticket"],"correctIndex":2},{"text":"Containment held. Durable fix within the change window?","options":["Rotate passwords only; the policy state will time out on its own","Revert testsigning to OFF via the approved change and enforce Secure Boot (M1046) on the host","Delete gpio_sw.sys and leave testsigning Yes","Do nothing; policy changes revert automatically"],"correctIndex":1}]},"explanation":"The least aggressive option that still works wins at every step. An instant unrecorded -set OFF write destroys the very state the bridge needs as evidence, and re-imaging mid-settlement costs availability for no evidential gain. Isolation plus a controlled revert in the approved window contains without waste. The durable fix reverts the state and closes the path with Secure Boot; a policy change never reverts on its own, and deleting the driver while testsigning stays Yes leaves the host open.","hint":"An instant unrecorded write destroys exactly what the bridge still needs."},{"id":"e07","type":"fill","perspective":"defender","scenario":{"title":"Ticket INC-41307 — the watermark that disappeared","blocks":[{"kind":"text","body":"Ticket INC-41307 at Kestrel Aero Components: a desktop capture shows the Test Mode watermark on DEV-LT-201 has disappeared. A colleague closed the ticket as 'user fixed the desktop background'. You pull the current boot state: bcdedit /enum still reports testsigning Yes. CHG-41211 still approves test signing on this laptop, so the state itself is not new. What changed is the visible artifact — and the T1553.006 behaviour notes say adversaries may remove such artifacts. A hidden state is not a reverted state. Finish the incident note with the right words."},{"kind":"artefact","label":"ARTEFACT 1 — INC-41307 facts","body":"host: DEV-LT-201 (CHG-41211 approves TESTSIGNING ON)\nday 1: Test Mode watermark present in baseline captures\ntoday: watermark absent from desktop capture\nbcdedit /enum: testsigning Yes (unchanged)\ncolleague's note: 'closed — user fixed the desktop background'"}]},"question":"Complete the two blanks using the word bank.","answer":{"segments":["INC-41307 note: the Test Mode watermark is gone from DEV-LT-201, but bcdedit /enum still reports testsigning Yes. The desktop looks clean, yet the host remains ",", and the vanishing watermark reads as artifact "," by the operator, not as proof that the policy was reverted."],"blanks":[{"accept":["weakened"],"note":"The policy still allows self-signed drivers; nothing about the state changed."},{"accept":["removal"],"note":"Removing the visible watermark is itself adversary behaviour on this technique."}],"bank":["weakened","remediated","removal","reboot","unsigned","secure"],"mode":"select"},"explanation":"The state is the ground truth: testsigning Yes means the host still accepts self-signed drivers, so it remains weakened even though the desktop looks clean. The watermark is only a visible artifact of that state, and making it disappear is artifact removal — a detection opportunity, not a fix. 'Remediated' is the tempting opposite of what the evidence shows.","hint":"The policy state was never reverted — one blank describes the host, the other the operator's behaviour."},{"id":"e08","type":"multi","perspective":"defender","scenario":{"title":"Hunt HUNT-4131 — the Pandora BYOVD pattern","blocks":[{"kind":"text","body":"Detection engineer e.tanaka briefs hunt HUNT-4131 on the Pandora pattern (S0664). Pandora disabled Windows Driver Signature Enforcement and loaded its driver by exploiting CVE-2017-15303 — a signed but vulnerable driver is the entry ticket, the BYOVD pattern. Nothing in that chain runs bcdedit or touches the registry policy keys. The flip happens in kernel memory and takes effect immediately, so there is no reboot gap to bridge on this path — but also no boot-config event to alert on. Your hunt must therefore lean on driver and system file load telemetry. Select every statement the briefing should make. Statements that mix the bcdedit path into the kernel path are the ones that mislead responders."},{"kind":"artefact","label":"ARTEFACT 1 — hunt note","body":"actor: S0664 Pandora\nlever: CVE-2017-15303 (signed vulnerable driver, BYOVD pattern)\neffect: Driver Signature Enforcement disabled via kernel memory\nresult: unsigned driver loads; no bcdedit event, no reboot needed\ndetection lean: driver/system file load telemetry"}]},"question":"Select every statement the briefing should make.","answer":{"options":["Pandora loaded a signed but vulnerable driver to reach the kernel (BYOVD)","CVE-2017-15303 exploitation provided the kernel write that turned DSE off","After the kernel flip, the unsigned driver loads with no bcdedit command line to alert on","Pandora first enabled Test Signing with bcdedit.exe -set TESTSIGNING ON","The kernel-memory flip only takes effect after a reboot"],"correct":[0,1,2]},"explanation":"The BYOVD entry, the CVE-2017-15303 kernel write and the silent unsigned load are all in the Pandora record. Enabling Test Signing with bcdedit is the boot-configuration path — the BlackEnergy pattern — and Pandora did not use it. Kernel-memory writes take effect immediately; the reboot gap belongs to TESTSIGNING and recovery-mode changes, not to this path.","study":"What to study: S0664 Pandora, CVE-2017-15303, BYOVD and the g_CiOptions flip.","hint":"Pandora never touched the boot configuration, so drop any statement about bcdedit or a reboot."},{"id":"e09","type":"order","perspective":"attacker","scenario":{"title":"Red-team debrief — order the kernel path to DSE","blocks":[{"kind":"text","body":"You are the red-team lead in the debrief after a Kestrel Aero Components engagement. Your objective was to load an unsigned kernel driver on OPS-WKS-63 without leaving the usual bcdedit trace. You chose the kernel-memory path that Pandora used with CVE-2017-15303 and that Turla used after exploiting for kernel privileges. Order the steps as you actually executed them. The first step needs elevated rights but no exploit. The exploit step is where Exploitation for Privilege Escalation (T1068) happens, through the signed vulnerable driver. Only after the enforcement variable flips can the unsigned driver enter the kernel. Remember this path needs no reboot, which is exactly why command-line detections miss it."},{"kind":"artefact","label":"ARTEFACT 1 — target facts","body":"host: OPS-WKS-63 (local admin available)\nentry: signed but vulnerable driver (BYOVD)\nexploit: CVE-2017-15303 → kernel-mode write (T1068)\ntarget variable: g_CiOptions\npayload: unsigned kernel driver"}]},"question":"Order the kernel-path steps from first to last.","answer":{"items":[{"id":"o1","text":"Load a signed but vulnerable driver (BYOVD) using local admin rights"},{"id":"o2","text":"Exploit CVE-2017-15303 through the vulnerable driver to gain kernel-mode write (T1068)"},{"id":"o3","text":"Alter g_CiOptions in kernel memory to switch off Driver Signature Enforcement"},{"id":"o4","text":"Load the unsigned driver immediately — no reboot is needed on this path"},{"id":"o5","text":"Accept that the only reliable telemetry is driver/system file load, since no command line was ever typed"}],"correctOrder":["o1","o2","o3","o4","o5"]},"explanation":"You cannot exploit a driver you have not loaded, so BYOVD comes first and only needs admin rights. The exploit through the vulnerable driver is the privilege escalation that reaches kernel memory. Flipping g_CiOptions is what turns enforcement off, which is what lets the unsigned driver in immediately — no reboot, no bcdedit, no command line. The final step is the honest detection picture: driver-load telemetry is the only signal left.","hint":"Admin rights load the driver; only the exploit reaches the kernel variable."},{"id":"e10","type":"terminal","perspective":"defender","scenario":{"title":"Hunt HUNT-4131 — read SIP state on KES-MAC-03","blocks":[{"kind":"text","body":"Hunt HUNT-4131 now covers the Mac fleet at Kestrel Aero Components. KES-MAC-03 controls the hardware test rig and had SIP disabled for an approved rebuild under CHG-41260; that change window expired three days ago. You must check the live SIP state before deciding whether the Mac is still in its approved posture. The csrutil tool has read and state-changing verbs: the status verb only reports, while disable and enable rewrite the platform's core integrity policy and belong in recoveryOS under change control. Your console session is read-only. Type the csrutil command that reports the current SIP state. Do not 'just re-enable it now' — remediation goes through the change process."},{"kind":"artefact","label":"ARTEFACT 1 — hunt context","body":"host: KES-MAC-03 (macOS, hardware test rig controller)\nCHG-41260: SIP disabled for lab rebuild; approved window ended 2026-02-20\nneed: current SIP state, read-only\nstate-changing verbs (disable / enable) require recoveryOS + change approval"}]},"question":"Type the csrutil command that reports the current SIP state without modifying anything.","answer":{"prompt":"hunter@kes-mac-03:~$","termTitle":"simulated macOS shell — read-only, nothing real is executed","required":[{"desc":"uses the csrutil tool","re":"^csrutil"},{"desc":"uses the read-only status verb","re":"\\sstatus(\\s|$)"}],"forbidden":[{"desc":"disables SIP — the T1553.006 modification itself","re":"disable","danger":true,"note":"csrutil disable is exactly the policy modification this technique describes; never run it to 'check what happens'."},{"desc":"enables SIP from this shell","re":"enable","danger":true,"note":"enable is also a state change; remediation must go through the change process."}],"canonical":"csrutil status","output":["System Integrity Protection status: disabled."]},"explanation":"csrutil is the SIP tool and the status verb is the only one that purely reads, so the live state is confirmed as disabled without touching the platform. The near-misses are the two state-changing verbs: disable is the T1553.006 modification itself, and enable is also a policy write that belongs in recoveryOS under change control, not in a hunt session.","hint":"One verb only reads; the two that change state are both forbidden here."},{"id":"e11","type":"triage","perspective":"defender","scenario":{"title":"Shift queue — DET0523 alerts to triage","blocks":[{"kind":"text","body":"You are on the morning shift at Kestrel Aero Components. Five DET0523-flavoured alerts wait in the queue. Your policy memory: CHG-41211 approves TESTSIGNING ON on DEV-LT-201 and DEV-LT-202 with a watermark expected; SEC-114 says production servers must never be test-signed; CHG-41260's SIP window on KES-MAC-03 has expired; and the kernel path leaves no bcdedit event at all. Watermark absence is a state question, not a style question: verify boot state before closing anything. Close requires a recorded benign reason; escalate means hand to IR with evidence. Match each alert to the action whose strength fits its signal."},{"kind":"artefact","label":"ARTEFACT 1 — standing context","body":"CHG-41211: TESTSIGNING ON on DEV-LT-201 / DEV-LT-202 (watermark expected)\nSEC-114: production servers never test-signed\nCHG-41260: KES-MAC-03 SIP window expired 2026-02-20\nBYOVD note: the kernel flip leaves no command-line event"}]},"question":"Give each alert the action you would really take.","answer":{"alerts":[{"id":"a1","title":"FIN-APP-07: testsigning flipped to Yes","detail":"Boot config changed at 02:47, no change record, settlement host. bcdedit /enum confirms testsigning Yes.","actions":["Escalate to IR and isolate the host","Close — test signing is normal on servers","Email the service account owner","Reboot to clear the flag"]},{"id":"a2","title":"DEV-LT-201: Test Mode watermark present","detail":"Watermark visible; CHG-41211 approves TESTSIGNING ON for the kernel-driver team; state matches the build baseline.","actions":["Escalate to IR","Close as approved developer configuration","Re-image the laptop","Disable test signing now"]},{"id":"a3","title":"DEV-LT-201: watermark vanished, testsigning still Yes","detail":"Desktop capture no longer shows the watermark, but boot state is unchanged. The approved state stayed, the visible artifact did not.","actions":["Close as a desktop theme change","Close — the warning is gone so the risk is gone","Escalate: likely artifact removal on an approved-but-tampered host","Reboot the host"]},{"id":"a4","title":"KES-MAC-03: SIP reports disabled","detail":"csrutil status reports disabled; CHG-41260 approved the lab rebuild but its window ended three days ago.","actions":["Close as an approved change","Verify whether SIP was re-enabled after the window; escalate if still disabled","Run csrutil disable again","Remove the Mac from inventory"]},{"id":"a5","title":"OPS-WKS-63: unsigned driver, no command line","detail":"A signed vulnerable driver loaded, then an unsigned driver; no bcdedit or registry policy event; contact to 203[.]0[.]113[.]86 observed.","actions":["Close — no policy command was executed","Escalate: suspected BYOVD kernel path (Pandora pattern)","Ask the user to restart the workstation","Block the IP and close"]}],"correct":{"a1":0,"a2":1,"a3":2,"a4":1,"a5":1}},"explanation":"The production flip with no change record is the incident and goes straight to IR. The dev-laptop watermark matches an approved change, so it closes. The vanished watermark with state unchanged is artifact removal — escalate even though the baseline state was approved. The expired SIP window needs verification, not instant trust or instant reversion. The quiet unsigned driver load is the kernel path: the absence of a command line is the point, not comfort.","hint":"On the dev laptops the approved state is not the problem — the changed artifact is."},{"id":"e12","type":"match","perspective":"defender","scenario":{"title":"Detection review — route each observation to its data source","blocks":[{"kind":"text","body":"Detection review after INC-41288 and INC-41322 at Kestrel Aero Components. e.tanaka must show responders where each observation actually lives, because DET0523-style analytics are only as good as the data sources feeding them. Process creation with command line, Windows registry modification, driver/system file loads, boot configuration state and the macOS unified log / SIP state each catch a different step. Reboot-gap bridging decides which pair of sources must be joined. One row is a deliberate trap: it never modified any policy, so it has no data source in this strategy. Route each observation."},{"kind":"artefact","label":"ARTEFACT 1 — scope card","body":"DET0523 scope: policy modification (T1553.006)\nnot in scope: valid-signature abuse (T1553.002)\nnot in scope: rogue root certificate install (T1553.004)\nkernel path: no command line — driver/system file loads only"}]},"question":"Match each observation to the data source that carries it.","answer":{"left":[{"id":"l1","text":"bcdedit.exe -set TESTSIGNING ON under svc_batch"},{"id":"l2","text":"Registry policy keys tampered with (Hikit-style)"},{"id":"l3","text":"g_CiOptions flipped; only a new unsigned module appears"},{"id":"l4","text":"testsigning Yes confirmed after the 03:02 restart"},{"id":"l5","text":"csrutil disable and later anomalous unsigned processes"},{"id":"l6","text":"Bought-certificate installer ran; no policy event exists"}],"right":[{"id":"r1","text":"Process creation with command line"},{"id":"r2","text":"Windows registry modification"},{"id":"r3","text":"Driver/system file loads"},{"id":"r4","text":"Boot configuration state"},{"id":"r5","text":"macOS unified log / SIP state"},{"id":"r6","text":"None here — that is signature abuse (T1553.002), outside this strategy"}],"correct":{"l1":"r1","l2":"r2","l3":"r3","l4":"r4","l5":"r5","l6":"r6"}},"explanation":"Each step of the technique leaves its trace in a different source: the Options in kernel memory through a signed vulnerable driver","bcdedit.exe -set TESTSIGNING ON from an admin shell","None — Secure Boot blocks every modification path"],"correctIndex":1},"explanation":"Secure Boot guards the boot-configuration paths: test signing and debug boot both change the boot store, which Secure Boot limits. The kernel path never touches the boot store — a legitimately signed vulnerable driver is loaded in the running system, the exploit flips g_CiOptions in memory, and Secure Boot sees nothing. That is why M1046 is partial prevention and needs M1026 and M1024 beside it.","study":"What to study: M1046 Boot Integrity and the word 'some' in its scope.","hint":"Boot configuration is what Secure Boot protects; think about what never touches it."},{"id":"e14","type":"dragdrop","perspective":"defender","scenario":{"title":"Control mapping — Secure Boot and its blind spots","blocks":[{"kind":"text","body":"After the GRC memo, e.tanaka builds a one-slide control map for the SOC. Secure Boot (M1046) is the only control on the slide that touches boot-configuration paths. Everything that happens inside a running kernel, or abuses over-broad privileges and permissive registry permissions, sails past it and needs M1026 or M1024 instead. The slide must stop responders from over-trusting Secure Boot. A control that blocks some paths is partial prevention, not immunity. Two rows describe boot-configuration paths; four rows survive Secure Boot. Sort each row into the bucket where it belongs."},{"kind":"artefact","label":"ARTEFACT 1 — slide draft","body":"title: What Secure Boot (M1046) does and does not stop\nbucket A: boot-configuration paths limited by Secure Boot\nbucket B: paths needing another control (M1026 / M1024 / driver control)\nrows: bcdedit TESTSIGNING; debug boot; g_CiOptions via BYOVD; unsigned load after the flip; shared admin account; writable policy registry keys"}]},"question":"Drag each row into the correct bucket.","answer":{"buckets":[{"id":"b1","label":"Limited by Secure Boot (M1046)"},{"id":"b2","label":"Survives Secure Boot — needs another control"}],"items":[{"id":"i1","text":"bcdedit.exe -set TESTSIGNING ON"},{"id":"i2","text":"Reboot into a debug/recovery mode to modify the signing policy"},{"id":"i3","text":"Kernel write to g_CiOptions after exploiting a signed vulnerable driver (CVE-2017-15303 pattern)"},{"id":"i4","text":"Unsigned driver load that follows the kernel flip"},{"id":"i5","text":"One shared admin account used for daily work launches the whole chain"},{"id":"i6","text":"Registry keys holding the signing policy are writable by non-admins"}],"correct":{"i1":"b1","i2":"b1","i3":"b2","i4":"b2","i5":"b2","i6":"b2"}},"explanation":"Only the two boot-configuration paths — test signing and debug/recovery boot — are limited by Secure Boot, because both change the boot store. The kernel write and the unsigned load it enables happen inside the running system and bypass the boot store entirely. The shared admin account is a privilege management failure for M1026, and writable policy registry keys are a permissions failure for M1024; neither is a boot problem.","study":"What to study: M1046 vs M1026 and M1024 — which control owns which path.","hint":"Only two rows change boot configuration; the other four live inside the running system or in permissions."},{"id":"e15","type":"triage","perspective":"defender","scenario":{"title":"Calibration review — least aggressive action that works","blocks":[{"kind":"text","body":"SOC lead c.voss reviews response choices after INC-41288 and two near-miss cases at Kestrel Aero Components. The rule for this review: choose the least aggressive action that actually removes the weakness. Overreaction destroys evidence or business function; underreaction leaves the host durably weaker. For the confirmed production flip, containment plus a controlled revert in the approved window beats an instant unrecorded write. For the dev laptop, verifying state read-only beats flipping an approved configuration off. For the account findings, segregation of duties beats fleet-wide surgery. Pick one action per case."},{"kind":"artefact","label":"ARTEFACT 1 — review card","body":"case 1: FIN-APP-07 confirmed flip; evidence captured; change window 22:00 tonight\ncase 2: DEV-LT-201 watermark gone (CHG-41211 still approves the state itself)\ncase 3: 30 servers share one admin account for daily work — the pattern behind svc_batch"}]},"question":"Pick the least aggressive action that still closes each gap.","answer":{"alerts":[{"id":"a1","title":"Case 1 — FIN-APP-07 confirmed flip","detail":"testsigning Yes, unsigned driver active, evidence exported, change window 22:00 tonight.","actions":["Re-image immediately during the settlement run","Run bcdedit.exe -set TESTSIGNING OFF now, unrecorded","Isolate the host and revert policy in the approved window","Keep serving traffic and review next month"]},{"id":"a2","title":"Case 2 — DEV-LT-201 watermark gone","detail":"CHG-41211 still approves test signing here; only the visible artifact changed; no telemetry beyond the capture.","actions":["Check the live boot state read-only before any action","Re-image the laptop at once","Flip test signing off immediately","Archive the ticket with no check"]},{"id":"a3","title":"Case 3 — shared admin account on 30 servers","detail":"The shared daily-use admin account is the pattern that let svc_batch flip FIN-APP-07 without notice.","actions":["Re-image all 30 servers","Remove every admin right permanently","Split daily work from admin duties into named accounts (M1026)","Send a warning email and close"]}],"correct":{"a1":2,"a2":0,"a3":2}},"explanation":"Proportionality means the smallest action that actually closes the gap. An unrecorded -set OFF write destroys evidence and an out-of-window re-image costs the settlement run; isolation plus a controlled revert does neither. On the dev laptop a read-only state check costs nothing and decides everything — flipping an approved configuration would break driver testing. Named accounts with separated duties (M1026) fix the account pattern; wiping 30 servers or stripping all rights destroys more than the risk justifies.","hint":"Aggressive picks destroy evidence or business function; the right row preserves both."},{"id":"e16","type":"multi","perspective":"attacker","scenario":{"title":"Purple-team debrief — what the exercise proved","blocks":[{"kind":"text","body":"Purple-team debrief at Kestrel Aero Components, after the red team reproduced both T1553.006 paths and the blue team matched detections. The red team used the bcdedit route on a lab host and the Pandora-style kernel route on OPS-WKS-63. The blue team caught the bcdedit route quickly and missed the kernel route for hours. Both sides must now agree on what the exercise actually proved. The record will drive next quarter's detection work. Select every statement the debrief should record. Statements that overstate a control or confuse the sibling technique must be rejected."},{"kind":"artefact","label":"ARTEFACT 1 — debrief agenda","body":"path A: bcdedit.exe -set TESTSIGNING ON → reboot → testsigning=Yes (caught by AN1446-style correlation)\npath B: BYOVD CVE-2017-15303 → g_CiOptions flip → unsigned driver (missed; driver-load telemetry only)\nalso tested: bought-certificate implant (no policy change)\nwatermark cleanup attempted on the lab host"}]},"question":"Select every statement the debrief should record.","answer":{"options":["bcdedit.exe -set TESTSIGNING ON leaves command-line telemetry that AN1446 correlates","The g_CiOptions kernel flip leaves no command line; driver-load telemetry is the signal","Secure Boot blocks every T1553.006 path, including the kernel route","Removing the Test Mode watermark reverts the policy to signed-only","The Pandora-style kernel path needs a reboot before the unsigned driver loads","A bought-certificate implant needs no policy change — that is signature abuse (T1553.002), not T1553.006"],"correct":[0,1,5]},"explanation":"The recorded facts: path A correlates through AN1446, path B is silent on the command line and only visible in driver-load telemetry, and the bought-certificate implant belongs to signature abuse (T1553.002) because no policy changed. The rejected claims each hide a trap: Secure Boot is only partial prevention, artifact removal hides the state instead of reverting it, and the reboot gap belongs to boot-config paths — kernel writes act immediately.","hint":"One statement claims total protection — the control note says only 'some implementations'."}];

/* ================= tiny utilities ================= */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffleArr(arr, rng){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(rng() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function range(n){ var a = []; for(var i = 0; i < n; i++){ a.push(i); } return a; }
function fmtClock(sec){
  sec = Math.max(0, Math.floor(sec));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  var mm = (m < 10 ? "0" : "") + m, ss = (s < 10 ? "0" : "") + s;
  return h > 0 ? h + ":" + mm + ":" + ss : mm + ":" + ss;
}
function shortTxt(s, n){ s = String(s); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
var LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

var SEV_CLASS = {"EASY":"sev-easy","MEDIUM":"sev-medium","HARD":"sev-hard","EXTREMELY HARD":"sev-extreme"};
var SEV_VAR = {"EASY":"var(--sev-easy)","MEDIUM":"var(--sev-medium)","HARD":"var(--sev-hard)","EXTREMELY HARD":"var(--sev-extreme)"};
