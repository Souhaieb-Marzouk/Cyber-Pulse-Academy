var META=JSON.parse(document.getElementById('cm-exercise-meta').textContent);var INTRO={"learn":["This exam is about <b>T1686.001 — Cloud Firewall<\/b>. In MITRE ATT&CK it is a <b>sub-technique<\/b>, which means it is one part of the bigger technique <b>T1686 — Disable or Modify System Firewall<\/b>. It belongs to the tactic <b>Defense Impairment<\/b> (this tactic was called Defense Evasion in older ATT&CK versions). The technique applies to <b>IaaS<\/b> — infrastructure cloud services such as AWS, Azure, and Google Cloud.","In real work, this sub-technique describes what an attacker does when they <b>disable or modify a firewall inside a cloud environment<\/b>. Cloud platforms use security groups and firewall rules to decide which traffic can reach cloud resources. An attacker who has the right cloud permissions can add new rules, create new open security groups, or delete blocking rules. This lets them send traffic in, reach instances they should not reach, or move from the cloud control plane to the data plane.","You will also look at <b>how attackers do this in practice<\/b>. The ATT&CK page lists a real procedure example: <b>Pacu<\/b> (software S1091), an open-source AWS attack framework, which can allowlist IP addresses in AWS GuardDuty. You will learn what attackers need first — cloud IAM permissions — and why they open rules such as “allow TCP from 0.0.0.0/0”.","Finally, you will see the <b>defender side<\/b>. Defenders watch cloud control-plane logs for security groups and firewall rules that change beyond what is normal. Two ATT&CK mitigations help here: <b>M1018 — User Account Management<\/b> (least-privilege IAM) and <b>M1047 — Audit<\/b> (routinely check who may modify cloud firewalls)."],"keywords":["Cloud Firewall","Sub-technique","T1686","Defense Impairment","IaaS","Security group","Ingress rule","0.0.0.0/0","Control plane","IAM permission","Least privilege (M1018)","Audit (M1047)","Control-plane logs","Pacu (S1091)","GuardDuty"],"how":["<b>Goal.<\/b> You need <b>70%<\/b> to pass. The exam has 15 exercises, and your final score is shown as a percent.","<b>Exercise types.<\/b> You will see four kinds of exercises: single-choice, multi-select, drag-and-drop (matching or ordering), and a simulated terminal where you type one simple command. Multi-select and matching exercises give <b>partial credit<\/b> when you get part of the answer right.","<b>Timer.<\/b> The timer budget is 20 minutes and it counts down while you work. When you press <b>Check<\/b>, the timer pauses itself while the feedback is on the screen (you will see “⏳ Feedback pause”), and it continues when you press <b>Next<\/b>. You can also pause the timer yourself with the <b>⏸ Pause<\/b> button; <b>Resume<\/b> brings you back to where you were.","<b>Hints and scoring.<\/b> Every exercise can give you full credit of 1.00. Partly correct answers give part of the credit, so your score can have decimals. Every hint you open takes 25% off that exercise’s credit, so use hints only when you really need them.","<b>Skip rules.<\/b> You may press <b>Skip<\/b> to move on without answering. Skipped exercises come back on a review screen before your results, where you can answer them or leave them out. Exercises you never answer do not count in your score at all."]};
var EX=[{"id":"e01","type":"single","persp":"both","concept":"Identity","scenario":"A teammate says: “I found a new ATT&CK ID in a report: T1686.001.”","question":"What exactly is T1686.001 in MITRE ATT&CK?","options":[["A sub-technique named Cloud Firewall, part of T1686 — Disable or Modify System Firewall",true],["A threat group that attacks cloud platforms",false],["A mitigation that removes cloud firewalls",false],["A tactic that contains all firewall techniques",false]],"explanation":"<b>A is correct.<\/b> T1686.001 is the sub-technique <b>Cloud Firewall<\/b>, a child of T1686 — Disable or Modify System Firewall. <b>B is wrong:<\/b> threat groups get IDs like G1234, not T-IDs. <b>C is wrong:<\/b> mitigations get M-IDs such as M1018, and a mitigation would not remove a control. <b>D is wrong:<\/b> tactics are tactic objects like TA0112 — Defense Impairment; T1686.001 is one technique inside that tactic, not a tactic itself.","hints":["The T-number format (T plus dots) marks a technique or sub-technique, never a group or a mitigation.","Its name talks about firewalls that live in the cloud."]},{"id":"e02","type":"single","persp":"both","concept":"Identity","scenario":"You open the ATT&CK page for T1686.001 and look at the top line “Sub-technique of: …”.","question":"Which technique is T1686.001 a sub-technique of?","options":[["T1686 — Disable or Modify System Firewall",true],["T1685 — Disable or Modify Tools",false],["T1685.002 — Disable or Modify Cloud Log",false],["TA0112 — Defense Impairment",false]],"explanation":"<b>A is correct.<\/b> The page shows “Sub-technique of: T1686 — Disable or Modify System Firewall”. <b>B is wrong:<\/b> T1685 is a different, sibling technique about security tools in general, not the parent. <b>C is wrong:<\/b> T1685.002 is about cloud logging, a separate sub-technique under T1685. <b>D is wrong:<\/b> TA0112 is the tactic ID that contains T1686; it is not a technique and cannot be a parent technique.","hints":["The parent number shares the first four characters with the child: T1686.001 belongs to T1686.","The parent name ends with “…System Firewall”."]},{"id":"e03","type":"single","persp":"both","concept":"Identity","scenario":"You are filing a detection ticket and must pick the correct tactic for T1686.001.","question":"Which tactic does T1686.001 belong to?","options":[["Defense Impairment (TA0112)",true],["Discovery",false],["Lateral Movement",false],["Credential Access",false]],"explanation":"<b>A is correct.<\/b> The sub-technique sits in the <b>Defense Impairment<\/b> tactic (TA0112), which covers attackers breaking security controls and monitoring. In older ATT&CK versions this area was called Defense Evasion. <b>B is wrong:<\/b> Discovery is about learning the environment, and although attackers often discover before they change rules, the technique itself is filed under Defense Impairment. <b>C is wrong:<\/b> Lateral Movement describes moving between systems; opening a firewall can enable it later, but the technique is not filed there. <b>D is wrong:<\/b> Credential Access is about stealing secrets like passwords and keys.","hints":["The attacker is not looking around or stealing passwords — they are breaking a defense.","Since ATT&CK v19 the old Defense Evasion tactic was split, and this technique landed in the “breaking defenses” half."]},{"id":"e04","type":"single","persp":"both","concept":"Identity","scenario":"Your team is building a coverage map and asks on which platforms this sub-technique can happen.","question":"Which platform does T1686.001 apply to?","options":[["IaaS — cloud infrastructure services",true],["Windows workstations only",false],["macOS laptops only",false],["On-premises network routers",false]],"explanation":"<b>A is correct.<\/b> The ATT&CK page lists the platform as <b>IaaS<\/b>: the firewall being changed is a cloud object such as a security group. <b>B is wrong:<\/b> Windows host firewalls are covered by the sibling sub-technique T1686.003 — Windows Host Firewall, not by .001. <b>C is wrong:<\/b> macOS is not the platform for this cloud technique. <b>D is wrong:<\/b> on-premises network device firewalls are the sibling sub-technique T1686.002 — Network Device Firewall.","hints":["Think about where security groups exist.","The sibling sub-techniques cover Windows and network devices; this one covers the cloud."]},{"id":"e05","type":"single","persp":"attacker","concept":"Behavior","scenario":"A new SOC trainee asks: “Why would an attacker bother changing a cloud firewall at all?”","question":"What is the attacker’s main reason to modify a cloud firewall?","options":[["To let their own traffic reach cloud resources that were blocked before",true],["To delete user accounts in the cloud account",false],["To make the applications run faster",false],["To pay less for cloud services",false]],"explanation":"<b>A is correct.<\/b> The ATT&CK description says attackers bypass controls that limit access: new or modified rules open a path to cloud resources. <b>B is wrong:<\/b> deleting accounts is account manipulation, a different behavior with no firewall needed. <b>C is wrong:<\/b> firewall rules change who can connect; they do not speed up applications. <b>D is wrong:<\/b> cloud costs are not touched by security group rules.","hints":["Firewalls decide who may connect and who may not.","The attacker wants a door where there was a wall."]},{"id":"e06","type":"single","persp":"both","concept":"Concepts","scenario":"A manager asks you to explain the object an attacker changes in this technique.","question":"What is a security group in a cloud platform?","options":[["A virtual firewall that controls inbound and outbound traffic for cloud resources",true],["A group of IAM users who share permissions",false],["A backup copy of virtual machines",false],["A log file that stores API activity",false]],"explanation":"<b>A is correct.<\/b> A security group acts as a virtual firewall around instances: its rules say which traffic may come in and go out — exactly what T1686.001 tampers with. <b>B is wrong:<\/b> groups of users are IAM user groups, a different object. <b>C is wrong:<\/b> backups are snapshots, not firewalls. <b>D is wrong:<\/b> API activity is stored in control-plane logs such as CloudTrail, not in security groups.","hints":["The word “firewall” is already in the right answer’s idea.","It sits around an instance like a fence around a house."]},{"id":"e07","type":"single","persp":"attacker","concept":"Behavior","scenario":"You review four rule changes made to one security group in a training lab.","question":"Which change opens a cloud instance to connection attempts from anywhere?","options":[["Adding an ingress rule that allows TCP from address 0.0.0.0/0",true],["Adding an ingress rule that allows TCP from one trusted admin address only",false],["Removing an ingress rule for a port nobody uses",false],["Renaming the security group from web-sg to web-sg-old",false]],"explanation":"<b>A is correct.<\/b> An ingress rule that allows TCP from <b>0.0.0.0/0<\/b> means “from every address”, so anyone on the internet can try to connect to that port — the classic open door in this technique. <b>B is wrong:<\/b> one trusted admin address is a narrow rule; it does not open the instance to everyone. <b>C is wrong:<\/b> removing an unused port rule does not create a new path in. <b>D is wrong:<\/b> renaming changes only the label, not the traffic rules.","hints":["Look for the rule that accepts traffic from the whole internet.","0.0.0.0/0 is the address range that means “everywhere”."]},{"id":"e08","type":"multi","persp":"attacker","concept":"Behavior","scenario":"You must sort five reported actions into “matches T1686.001” and “does not match”.","question":"Select every action that fits T1686.001 — Cloud Firewall. (Pick all that apply.)","options":[["Adding a new ingress rule that allows TCP from 0.0.0.0/0 to a security group",true],["Creating a brand-new security group with wide-open rules and attaching it to an instance",true],["Deleting a security group rule that blocked an unused port the attacker wants",true],["Stopping the Windows firewall service on a laptop",false],["Emptying the Linux audit log on a server",false]],"explanation":"<b>A, B and C are correct:<\/b> all three change cloud firewall objects — rules are added, a new open group is created, or a blocking rule is deleted. This matches the ATT&CK wording “introduce new firewall rules or policies”. <b>D is wrong:<\/b> stopping the Windows firewall service touches a <b>host<\/b> firewall (sibling sub-technique T1686.003 — Windows Host Firewall), not a cloud firewall. <b>E is wrong:<\/b> emptying an audit log is clearing logging data; it belongs with techniques that disable or clear logs (like T1685.004), not with firewall modification.","hints":["Two of the five options happen on single machines, not in the cloud console.","Ask for each option: was a cloud security group or firewall rule actually changed?"]},{"id":"e09","type":"single","persp":"attacker","concept":"Prerequisites","scenario":"An attacker already has a stolen cloud API key and wants to change security group rules.","question":"What does the attacker need for T1686.001 to work?","options":[["Cloud IAM permissions that allow modifying security groups or firewall rules",true],["Physical access to the data-center building",false],["The phone number of a cloud support agent",false],["A special paid license for the cloud account",false]],"explanation":"<b>A is correct.<\/b> The ATT&CK description says “an adversary <b>with appropriate permissions<\/b> may introduce new firewall rules” — cloud IAM permissions are the requirement. <b>B is wrong:<\/b> everything is done through the cloud API, so no building access is needed. <b>C is wrong:<\/b> support agents are not part of this technique. <b>D is wrong:<\/b> no extra license is involved; permissions decide what the key can do.","hints":["The API key only works if the identity behind it is allowed to make the change.","The answer is about permissions, not hardware or money."]},{"id":"e10","type":"single","persp":"defender","concept":"Detection","scenario":"Your manager asks: “If an attacker opens a security group tomorrow, where would we see it?”","question":"Which data source shows changes to security groups and firewall rules?","options":[["Cloud control-plane logs, such as AWS CloudTrail API logs",true],["The office printer queue",false],["The public company website",false],["A sticky note on the cloud engineer’s desk",false]],"explanation":"<b>A is correct.<\/b> Every security group change is an API call, and the ATT&CK detection strategy (DET0424) watches cloud <b>control-plane logs<\/b> for the creation, deletion, or modification of security groups and firewall rules. <b>B, C and D are wrong:<\/b> printers, websites, and paper notes record nothing about cloud API calls.","hints":["Security groups are changed through the cloud API.","The service that records API calls in AWS starts with “Cloud”."]},{"id":"e11","type":"terminal","persp":"defender","concept":"Defender skills","scenario":"Training lab: a teammate says security group <code>sg-0abc123<\/code> looks strange, and asks you to list its current rules.","question":"In the simulated shell, type the read-only AWS CLI command that shows the rules of security group sg-0abc123.","shell":{"banner":"CYBERPULSE TRAINING LAB — read-only sandbox · account 111122223333 · no real cloud is touched","goal":"Show the rules of security group sg-0abc123.","syntax":"aws ec2 describe-security-groups --group-ids &lt;group-id&gt;","expected":"{\n  \"SecurityGroups\": [{\n    \"GroupId\": \"sg-0abc123\",\n    \"IpPermissions\": [\n      { \"IpProtocol\": \"tcp\", \"FromPort\": 443, \"ToPort\": 443,\n        \"IpRanges\": [{ \"CidrIp\": \"10.0.0.0/8\" }] }\n    ]\n  }]\n}","prompt":"trainee@cyberpulse-lab","path":"~/aws-lab","placeholder":"aws ec2 describe-security-groups …"},"checks":[{"re":"^aws\\s+ec2\\s+describe-security-groups\\b","label":"uses the read-only command describe-security-groups"},{"re":"--group-ids?\\s+sg-0abc123\\b","label":"targets the requested group sg-0abc123"}],"nearMiss":[{"re":"authorize-security-group-ingress|revoke-security-group-ingress|delete-security-group","msg":"Those commands change or delete rules. The task asks you to look, not to change anything."}],"destructive":null,"canonical":"aws ec2 describe-security-groups --group-ids sg-0abc123","explanation":"The task only asks to <b>look<\/b> at the rules, so the right tool is the read-only command <code>aws ec2 describe-security-groups<\/code> (check 1) pointed at the exact group with <code>--group-ids sg-0abc123<\/code> (check 2). Leaving out <code>--group-ids<\/code> would list every group in the account, and naming a different group would answer the wrong question. Change-making commands such as <code>authorize-security-group-ingress<\/code> would modify the lab, which is never the right first step for a look-up task.","hints":["The command skeleton is shown above the prompt — copy it and replace the placeholder.","The group id must appear exactly as sg-0abc123."]},{"id":"e12","type":"dnd","mode":"match","persp":"both","concept":"Concepts","scenario":"You are preparing a short glossary card for new SOC joiners.","question":"Drag each term onto the box that describes it.","bank":["Security group","Ingress rule","0.0.0.0/0","Control plane"],"zones":[{"label":"A virtual firewall around cloud instances","accepts":[0]},{"label":"A rule that allows traffic to come IN","accepts":[1]},{"label":"Means “every IP address” — the whole internet","accepts":[2]},{"label":"The API service used to manage the cloud","accepts":[3]}],"explanation":"<b>Security group<\/b> is the virtual firewall object that T1686.001 tampers with. <b>Ingress rule<\/b> is the rule type that admits incoming traffic — the thing attackers add. <b>0.0.0.0/0<\/b> is the CIDR range that matches every address, so “allow from 0.0.0.0/0” means “allow from anywhere”. <b>Control plane<\/b> is the management API layer where those rules are created and changed, and it is where defenders see the evidence. Mixing them up usually comes from treating 0.0.0.0/0 as a special port or treating the control plane as a network device — it is neither; it is the management layer of the cloud.","hints":["Two terms describe objects, one describes a range of addresses, one describes a management layer.","“Ingress” always means traffic going in, not out."]},{"id":"e13","type":"single","persp":"defender","concept":"Mitigation","scenario":"After a tabletop exercise, the team asks which control makes T1686.001 hardest to perform.","question":"Which mitigation directly limits who is able to change cloud firewall rules?","options":[["M1018 — User Account Management: apply least privilege to IAM policies",true],["M1054 — Software Configuration",false],["Turning off all cloud logging to save costs",false],["Giving every developer full administrator rights",false]],"explanation":"<b>A is correct.<\/b> The ATT&CK mitigation M1018 — User Account Management says least-privilege IAM policies should be ensured, so only the few roles that really need <code>ec2:AuthorizeSecurityGroupIngress<\/code> and similar actions hold them. <b>B is wrong:<\/b> software configuration is about application settings, not IAM rights. <b>C is wrong:<\/b> turning off logging does not restrict anything — it actually removes the defender’s view. <b>D is wrong:<\/b> giving everyone admin rights is the opposite of least privilege and makes this technique easier, not harder.","hints":["The technique needs permissions; the strongest fix removes those permissions from most identities.","The mitigation name mentions user accounts and how they are managed."]},{"id":"e14","type":"single","persp":"defender","concept":"Mitigation","scenario":"You are writing the audit item for cloud firewalls in the quarterly review.","question":"Which sentence matches the ATT&CK mitigation M1047 — Audit for this technique?","options":[["Routinely check account role permissions so only expected users and roles can modify cloud firewalls",true],["Delete every security group at the end of each week",false],["Review cloud firewall permissions once every three years",false],["Give all service accounts the same broad rights to keep audits simple",false]],"explanation":"<b>A is correct.<\/b> The ATT&CK description for M1047 — Audit applied here is exactly this: routinely check account role permissions so that only expected users and roles hold permission to modify cloud firewalls. <b>B is wrong:<\/b> deleting security groups would break production systems and has nothing to do with auditing. <b>C is wrong:<\/b> “routinely” means on a regular schedule, not once in three years. <b>D is wrong:<\/b> equal broad rights for everyone removes accountability and defeats the purpose of the audit.","hints":["The mitigation is about checking, not about destroying things.","Two wrong options describe the opposite of least privilege."]},{"id":"e15","type":"multi","persp":"attacker","concept":"Impact","scenario":"A colleague found an unexpected “allow TCP 22 from 0.0.0.0/0” rule on an internet-facing instance and asks why it matters.","question":"Select every reason why this unexpected rule is dangerous. (Pick all that apply.)","options":[["Anyone on the internet can try to connect to that port",true],["It can give attackers a door for remote access such as SSH",true],["It can support unwanted traffic such as cryptomining activity",true],["It makes the application respond faster to users",false],["It lowers the monthly cloud bill",false]],"explanation":"<b>A, B and C are correct.<\/b> A rule that admits TCP from 0.0.0.0/0 lets <b>anyone<\/b> attempt a connection (A), which is exactly the door attackers want for remote access protocols like SSH (B), and the ATT&CK description notes attackers may remove networking limits to support malicious traffic such as <b>cryptomining<\/b> (C). <b>D is wrong:<\/b> a firewall rule does not change application performance. <b>E is wrong:<\/b> firewall rules do not reduce costs — the danger is access, not money.","hints":["Think about who can now send traffic to the instance.","The ATT&CK description names one specific kind of abusive traffic — it starts with “crypto”."]}];
var HINT_PEN=0.25;
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(s){s=Math.max(0,Math.floor(s));var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function norm(s){return String(s||'').replace(/\[\.\]/g,'.').replace(/\[:\]/g,':').replace(/["']/g,'')
  .replace(/\s+/g,' ').trim()}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
var LETTERS='ABCDEFGH';

/* ---------- timer state machine: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED ---------- */
var T={state:'IDLE',remaining:META.timerMinutes*60,tRun:0,tMan:0,tAuto:0,iv:null,enteredAt:0,resumeTo:'RUNNING'};
function tAccount(){
  var now=Date.now();
  if(T.state==='PAUSED_MANUAL'){T.tMan+=Math.max(0,Math.round((now-T.enteredAt)/1000))}
  else if(T.state==='PAUSED_AUTO_CHECK'){T.tAuto+=Math.max(0,Math.round((now-T.enteredAt)/1000))}
}
function timerTick(){
  if(T.state!=='RUNNING')return;
  T.remaining--;T.tRun++;renderTimer();
  if(T.remaining<=0){forceFinish()}
}
function tEnter(st){
  tAccount();T.state=st;T.enteredAt=Date.now();
  if(st==='RUNNING'){if(!T.iv)T.iv=setInterval(timerTick,1000)}
  else if(T.iv){clearInterval(T.iv);T.iv=null}
  renderTimer();
}
function tStart(){T.state='RUNNING';T.enteredAt=Date.now();if(!T.iv)T.iv=setInterval(timerTick,1000);renderTimer()}
function tPauseManual(){if(T.state==='ENDED'||T.state==='PAUSED_MANUAL')return;
  T.resumeTo=(T.state==='PAUSED_AUTO_CHECK')?'PAUSED_AUTO_CHECK':'RUNNING';
  tEnter('PAUSED_MANUAL');$('pause-ov').classList.add('show');document.body.classList.add('blurred')}
function tResumeManual(){if(T.state!=='PAUSED_MANUAL')return;
  tEnter(T.resumeTo||'RUNNING');$('pause-ov').classList.remove('show');document.body.classList.remove('blurred')}
function tAutoPause(){if(T.state==='RUNNING'){tEnter('PAUSED_AUTO_CHECK')}}
function tAutoResume(){if(T.state==='PAUSED_AUTO_CHECK'){tEnter('RUNNING')}}
function tEnd(){tAccount();if(T.iv){clearInterval(T.iv);T.iv=null}T.state='ENDED';renderTimer()}
function renderTimer(){var c=$('timerchip');if(!c)return;var cls='chip timer-run',txt='';
  if(T.state==='RUNNING'){cls='chip timer-run';txt='▶ Running · '+fmt(T.remaining)}
  else if(T.state==='PAUSED_MANUAL'){cls='chip timer-man';txt='⏸ Paused'}
  else if(T.state==='PAUSED_AUTO_CHECK'){cls='chip timer-auto';txt='⏳ Feedback pause'}
  else if(T.state==='ENDED'){cls='chip timer-end';txt='⏱ Ended'}
  c.className=cls;c.textContent=txt;
  c.title=T.state==='PAUSED_MANUAL'?'Paused by you: the countdown is frozen. Resume continues the exam.'
    :(T.state==='PAUSED_AUTO_CHECK'?'Auto-paused while feedback is shown: the countdown is frozen until you press Next.'
    :(T.state==='ENDED'?'The exam has ended.':'Countdown is running.'))}

   +'<button type="button" class="btn" data-act="hint" '+((S.checked||S.curHints>=(e.hints?e.hints.length:0))?'disabled':'')+'>ⓘ Hint</button>'
   +(inReview?'<button type="button" class="btn btn-danger" data-act="review-leave">⚠ Leave unanswered</button>'
             :'<button type="button" class="btn btn-danger" data-act="skip" '+(S.checked?'disabled':'')+'>⚠ Skip →</button>')
   +'<span class="warnline" id="warnline">⚠ Select an answer first.</span></div>';
  h+='<div class="hint-panel" id="hint-panel"></div>';
  h+='<div class="feedback" id="feedback"></div>';
  h+='</main>';
  return h;
}
function barHTML(){
  return '<header class="bar"><div class="brand"><span class="t">'+esc(META.objectName)+'</span>'
   +'<span class="badge '+META.sevClass+'">'+esc(META.sevWord)+'</span></div>'
   +'<div class="tools"><span class="chip" id="counter"></span>'
   +'<span class="chip timer-run" id="timerchip">▶ Running</span>'
   +'<span class="chip scorechip" id="scorechip" title="Points earned so far (partial credit included)">★ '+S.score.toFixed(2)+' pts</span>'
   +'<button type="button" class="btn" data-act="hint">ⓘ Hint</button>'
   +'<button type="button" class="btn" data-act="pause">⏸ Pause</button>'
   +'<button type="button" class="btn btn-danger" data-act="skip">⚠ Skip →</button></div></header>';
}

/* ---------- grading ---------- */
function gradeCurrent(){
  var e=cur();
  if(e.type==='single'||e.type==='multi'){
    if(!S.sel.length)return null;
    var N=0,H=0,W=0,items=[];
    e.options.forEach(function(o){if(o[1])N++});
    e.options.forEach(function(o,i){
      var picked=(S.sel.indexOf(i)>=0);
      if(o[1]&&picked){H++;items.push([i,'ok','✓ Correct'])}
      else if(o[1]&&!picked){items.push([i,'miss','○ Missed'])}
      else if(!o[1]&&picked){W++;items.push([i,'bad','✗ Wrong'])}
      else{items.push([i,'',''])}});
    var base=(e.type==='single')?((H===1&&W===0)?1:0):Math.max(0,(H-W)/N);
    return {base:base,items:items,N:N};
  }
  if(e.type==='dnd'){
    var N2=e.bank.length,H2=0,W2=0,items2=[],cmap=correctMap(e);
    for(var i=0;i<e.bank.length;i++){
      var z=S.dndAssign[i];
      if(z===undefined||z===null||z<0){items2.push([i,'miss','○ Missed — not placed'])}
      else if(z===cmap[i]){H2++;items2.push([i,'ok','✓ Correct'])}
      else{W2++;items2.push([i,'bad','✗ Wrong — '+(e.mode==='order'?('correct position is '+(cmap[i]+1)):('belongs to “'+e.zones[cmap[i]].label+'”'))])}
    }
    return {base:Math.max(0,(H2-W2)/N2),items:items2,N:N2};
  }
  if(e.type==='terminal'){
    var raw=($('term-in')||{}).value||'';
    var inp=norm(raw);
    if(!inp)return null;
    var items3=[],H3=0,W3=0,trap=null,nm=[];
    if(e.destructive&&e.destructive.re&&new RegExp(e.destructive.re,'i').test(inp)){
      trap=e.destructive.msg;
    }
    if(!trap&&e.nearMiss){e.nearMiss.forEach(function(m){
      if(new RegExp(m.re,'i').test(inp))nm.push(m.msg)})}
    e.checks.forEach(function(c){
      var ok=new RegExp(c.re,'i').test(inp);
      if(ok)H3++;
      items3.push([null,ok?'ok':'miss',(ok?'✓ Passed — ':'○ Not met — ')+c.label])});
    W3=nm.length;
    var N3=e.checks.length;
    return {base:trap?0:Math.max(0,(H3-W3)/N3),items:items3,N:N3,trap:trap,nm:nm,inp:inp};
  }
  return null;
}
function correctMap(e){
  var m=[];
  if(e.mode==='order'){for(var i=0;i<e.bank.length;i++)m[i]=i}
  else{for(var i2=0;i2<e.bank.length;i2++)m[i2]=-1;
    e.zones.forEach(function(z,zi){(z.accepts||[]).forEach(function(ii){m[ii]=zi})})}
  return m;
}

/* ---------- feedback ---------- */
function showFeedback(g,credit,status){
  var e=cur(),fb=$('feedback');if(!fb)return;
  var cls=status==='full'?'fb-full':(status==='partial'?'fb-partial':'fb-zero');
  var head=status==='full'?'✓ Correct':(status==='partial'?'✓ Partially correct':'✗ Incorrect');
  var h='<div class="fb-head"><span>'+head+'</span><span class="credit">Credit: '+credit.toFixed(2)+' / 1.00'
   +(S.curHints>0?(' · −'+(HINT_PEN*S.curHints).toFixed(2)+' hint penalty ('+S.curHints+' hint'+(S.curHints>1?'s':'')+' used)'):'')+'</span></div>';
  h+='<ul class="peritem">';
  if(e.type==='single'||e.type==='multi'){
    g.items.forEach(function(it){
      if(it[2])h+='<li><span class="mark-tag '+(it[1]==='ok'?'':it[1])+'" style="color:'+(it[1]==='ok'?'var(--ok)':(it[1]==='bad'?'var(--bad)':'var(--miss)'))+'">'+it[2]+'</span><span><b>'+LETTERS[it[0]]+'.</b> '+e.options[it[0]][0]+'</span></li>'});
  }else if(e.type==='dnd'){
    g.items.forEach(function(it){
      h+='<li><span class="mark-tag" style="color:'+(it[1]==='ok'?'var(--ok)':(it[1]==='bad'?'var(--bad)':'var(--miss)'))+'">'+it[2]+'</span><span>'+e.bank[it[0]]+'</span></li>'});
  }else if(e.type==='terminal'){
    if(g.trap)h+='<li><span class="mark-tag" style="color:var(--bad)">✗ Unsafe action blocked</span><span>'+g.trap+'</span></li>';
    g.nm.forEach(function(m){h+='<li><span class="mark-tag" style="color:var(--warn)">⚠ Near miss</span><span>'+m+'</span></li>'});
    g.items.forEach(function(it){h+='<li><span class="mark-tag" style="color:'+(it[1]==='ok'?'var(--ok)':'var(--miss)')+'">'+it[2]+'</span></li>'});
  }
  h+='</ul><div class="expl"><span class="why">Why</span>'+e.explanation+'</div>';
  fb.className='feedback show '+cls;fb.innerHTML=h;
  var last=(S.phase==='review')?(S.reviewP===S.reviewQ.length-1):(S.idx===EX.length-1);
  var row=document.createElement('div');row.className='actrow';
  var lbl=S.phase==='review'?(last?'Finish review →':'Next skipped →'):(last?'Final Submit →':'Next →');
  row.innerHTML='<button type="button" class="btn btn-green" data-act="next">'+lbl+'</button>';
  fb.parentNode.insertBefore(row,fb.nextSibling);
  document.querySelectorAll('[data-act="check"],[data-act="skip"],[data-act="hint"]').forEach(function(b){b.disabled=true});
  var ti=$('term-in');if(ti)ti.disabled=true;
  markOptions(e,g);
  termOut(e,g);
}
function markOptions(e,g){
  if(!g||!g.items)return;
  if(e.type==='single'||e.type==='multi'){
    g.items.forEach(function(it){var el=document.querySelector('.opt[data-i="'+it[0]+'"]');if(!el)return;
      if(it[1]==='ok')el.classList.add('state-ok');
      else if(it[1]==='bad')el.classList.add('state-bad');
      else if(it[1]==='miss')el.classList.add('state-miss');
      var tag=it[2]?('<span class="mark-tag" style="color:'+(it[1]==='ok'?'var(--ok)':(it[1]==='bad'?'var(--bad)':'var(--miss)'))+'">'+it[2]+'</span>'):'';
      el.insertAdjacentHTML('beforeend',tag)});
  }else if(e.type==='dnd'){
    document.querySelectorAll('.dnd-chip').forEach(function(c){
      var i=parseInt(c.getAttribute('data-i'),10),it=g.items[i];if(!it)return;
      if(it[1]==='ok')c.classList.add('ok');else if(it[1]==='bad')c.classList.add('bad');else if(it[1]==='miss')c.classList.add('miss')});
  }
}
function termOut(e,g){
  if(e.type!=='terminal'||!g)return;
  var out=$('term-out');if(!out)return;
  if(g.trap){out.innerHTML='<span class="out-err">✗ '+esc(g.trap)+'</span>';return}
  if(g.base>=0.999&&e.shell.expected){out.innerHTML='<span class="out-ok">'+e.shell.expected+'</span>';return}
  out.innerHTML='<span class="out-dim">Simulated shell: no output matched the expected action. Check the per-item notes below.</span>';
}

/* ---------- flow ---------- */
function startExam(){S.phase='exam';S.idx=0;prepExercise();renderExam();tStart()}
function prepExercise(){
  S.sel=[];S.dndAssign={};S.dndPick=null;S.checked=false;S.curHints=0;
  var e=cur();
  if(e.type==='dnd'){S.dndDisp=shuffle(e.bank.map(function(_,i){return i}))}
}
function renderExam(){
  var app=$('app');
  app.innerHTML=barHTML()+examHTML();
  $('counter').textContent='Exercise '+(S.idx+1)+' / '+EX.length;
  renderTimer();updateScore();
  var inp=$('term-in');
  if(inp)inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();doCheck()}});
}
function updateScore(){var c=$('scorechip');if(c)c.textContent='★ '+S.score.toFixed(2)+' pts'}
function warn(msg){var w=$('warnline');if(w){w.textContent='⚠ '+msg;w.classList.add('show');
  setTimeout(function(){w.classList.remove('show')},2200)}}
function doCheck(){
  if(S.checked)return;
  var g=gradeCurrent();if(g===null){warn('Select an answer first.');return}
  tAutoPause();
  S.checked=true;
  var credit=Math.max(0,g.base-HINT_PEN*S.curHints);
  S.score+=credit;
  var status=(credit>=0.999)?'full':(credit>0?'partial':'zero');
  var qi=(S.phase==='review')?S.reviewQ[S.reviewP]:S.idx;
  S.results[qi]={status:status,credit:credit,hints:S.curHints};
  updateScore();
  renderExamFeedbackOnly(g,credit,status);
}
function renderExamFeedbackOnly(g,credit,status){
  var fb=$('feedback');
  if(!fb){renderExam();var fb2=$('feedback');paint(g,credit,status,fb2);return}
  paint(g,credit,status,fb);
}
function paint(g,credit,status,fb){showFeedback(g,credit,status)}
function doHint(){
  if(S.checked)return;var e=cur();
  if(!e.hints||S.curHints>=e.hints.length)return;
  S.curHints++;var p=$('hint-panel');
  if(p){p.classList.add('show');p.innerHTML='ⓘ Hint '+S.curHints+' / '+e.hints.length+': '+e.hints[S.curHints-1]}
}
function doNext(){
  if(!S.checked)return;
  tAutoResume();
  if(S.phase==='review'){
    S.reviewP++;
    if(S.reviewP<S.reviewQ.length){prepExercise();renderReview()}
    else showResults();
    return;
  }
  if(S.idx<EX.length-1){S.idx++;prepExercise();renderExam()}
  else finalSubmit();
}
function doSkip(){
  if(S.checked)return;
  var qi=(S.phase==='review')?S.reviewQ[S.reviewP]:S.idx;
  S.results[qi]={status:'skipped',credit:0,hints:0};
  if(S.phase==='review'){
    if(S.skipped.indexOf(qi)<0)S.skipped.push(qi);
    S.reviewP++;
    if(S.reviewP<S.reviewQ.length){prepExercise();renderReview()}
    else showResults();
    return;
  }
  if(S.skipped.indexOf(S.idx)<0)S.skipped.push(S.idx);
  if(S.idx<EX.length-1){S.idx++;prepExercise();renderExam()}
  else finalSubmit();
}
function finalSubmit(){
  S.reviewQ=S.skipped.filter(function(i){return S.results[i]&&S.results[i].status==='skipped'});
  S.reviewP=0;
  if(S.reviewQ.length){S.phase='review';prepExercise();renderReview()}
  else showResults();
}
function renderReview(){
  var app=$('app');app.innerHTML=barHTML()+examHTML();
  $('counter').textContent='Review skipped '+(S.reviewP+1)+' / '+S.reviewQ.length;
  renderTimer();updateScore();
  var inp=$('term-in');
  if(inp)inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();doCheck()}});
}
function forceFinish(){
  if(S.phase==='exam'&&!S.checked){S.results[S.idx]={status:'skipped',credit:0,hints:0};
    if(S.skipped.indexOf(S.idx)<0)S.skipped.push(S.idx)}
  showResults();
}

/* ---------- results + reporting ---------- */
function showResults(){
  S.phase='results';tEnd();
  $('pause-ov').classList.remove('show');document.body.classList.remove('blurred');
  var answered=0,full=0,part=0,zero=0,skipN=0,partSum=0;
  for(var i=0;i<EX.length;i++){var r=S.results[i]||{status:'skipped',credit:0};
    if(r.status==='skipped'){skipN++;continue}
    answered++;
    if(r.status==='full')full++;else if(r.status==='partial'){part++;partSum+=r.credit}else zero++}
  var rounded=Math.round(S.score);
  var percent=answered>0?Math.round(rounded/answered*100):0;
  var passed=percent>=META.passMark;
  var partAvg=part>0?(partSum/part):0;
  var h='<main class="wrap"><section class="card"><h2>Results — '+esc(META.objectName)+'</h2>'
   +'<div class="res-hero"><div class="res-pct '+(passed?'pass':'fail')+'" id="final-pct">0%</div>'
   +'<div><span class="badge '+(passed?'sev-easy':'sev-xhard')+'">'+(passed?'✓ Passed':'✗ Not passed')+'</span>'
   +'<p class="muted">Pass mark: '+META.passMark+'% · Points: '+rounded+' of '+answered+' answered exercise'+(answered===1?'':'s')+' · Skipped-and-never-answered exercises are excluded.</p></div></div>'
   +'<div class="res-grid">'
   +'<div class="res-box b-full"><div class="n">'+full+'</div><div class="t">✓ Fully correct</div></div>'
   +'<div class="res-box b-part"><div class="n">'+part+'</div><div class="t">✓ Partially correct — average partial credit '+partAvg.toFixed(2)+'</div></div>'
   +'<div class="res-box b-zero"><div class="n">'+zero+'</div><div class="t">✗ Fully incorrect</div></div>'
   +'<div class="res-box b-skip"><div class="n">'+skipN+'</div><div class="t">⚠ Skipped &amp; never answered (excluded)</div></div>'
   +'</div>'
   +'<div class="res-time"><span class="chip">▶ Running: '+fmt(T.tRun)+'</span>'
   +'<span class="chip">⏸ Paused by you: '+fmt(T.tMan)+'</span>'
   +'<span class="chip">⏳ Paused for feedback: '+fmt(T.tAuto)+'</span>'
   +'<span class="chip">⏱ Total: '+fmt(T.tRun+T.tMan+T.tAuto)+'</span></div>'
   +'<div class="actrow"><button type="button" class="btn btn-primary" data-act="retake">↻ Retake</button></div>'
   +'</section></main>';
  $('app').innerHTML=h;
  var done=false;
  function settle(){if(done)return;done=true;postReport(rounded,answered,percent,passed)}
  var reduced=false;
  try{reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(err){}
  var el=$('final-pct');
  if(reduced||!el){if(el)el.textContent=percent+'%';settle();return}
  var t0=null,dur=1100;
  requestAnimationFrame(function step(ts){
    if(t0===null)t0=ts;var k=Math.min(1,(ts-t0)/dur);
    el.textContent=Math.round(percent*(1-Math.pow(1-k,3)))+'%';
    if(k<1)requestAnimationFrame(step);else settle();
  });
}
function postReport(score,total,percent,passed){
  if(S.postSent)return;S.postSent=true;
  try{(window.parent===window?window:window.parent).postMessage(
    {type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,difficulty:META.difficulty,
     score:score,total:total,percent:percent,passed:passed},
    S.hostOrigin||location.origin)}catch(e){}
}
function doRetake(){
  S.phase='intro';S.idx=0;S.score=0;S.results=[];S.skipped=[];S.reviewQ=[];S.reviewP=0;
  S.postSent=false;S.sel=[];S.dndAssign={};S.dndPick=null;S.checked=false;S.curHints=0;
  if(T.iv){clearInterval(T.iv);T.iv=null}
  T.state='IDLE';T.remaining=META.timerMinutes*60;T.tRun=0;T.tMan=0;T.tAuto=0;T.resumeTo='RUNNING';
  renderIntro();
}

/* ---------- app ---------- */
function renderIntro(){
  $('app').innerHTML='<main class="wrap">'+introHTML()+'</main>';
  window.scrollTo(0,0);
}
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act');
  if(act==='start'){startExam();window.scrollTo(0,0)}
  else if(act==='sc-toggle'){var b=document.querySelector('.sc-body');
    var open=b.classList.toggle('sc-open');el.textContent=open?'Hide scenario ▴':'Show full scenario ▾'}
  else if(act==='opt'){if(S.checked)return;var i=parseInt(el.getAttribute('data-i'),10);
    var e=cur();
    if(e.type==='single'){S.sel=[i]}
    else{var p=S.sel.indexOf(i);if(p>=0)S.sel.splice(p,1);else S.sel.push(i)}
    document.querySelectorAll('.opt').forEach(function(o){
      var oi=parseInt(o.getAttribute('data-i'),10);
      o.classList.toggle('picked',S.sel.indexOf(oi)>=0);
      o.setAttribute('aria-pressed',S.sel.indexOf(oi)>=0)})}
  else if(act==='check'){doCheck()}
  else if(act==='hint'){doHint()}
  else if(act==='pause'){tPauseManual()}
  else if(act==='resume'){tResumeManual()}
  else if(act==='skip'){doSkip()}
  else if(act==='next'){doNext()}
  else if(act==='review-leave'){doSkip()}
  else if(act==='retake'){doRetake();window.scrollTo(0,0)}
  else if(act==='dnd-pick'){
    if(S.checked)return;
    var di=parseInt(el.getAttribute('data-i'),10);
    if(S.dndAssign[di]!==undefined&&S.dndAssign[di]!==null&&S.dndAssign[di]>=0){
      S.dndAssign[di]=null;S.dndPick=null}
    else{S.dndPick=(S.dndPick===di?null:di)}
    reRenderDnd()}
  else if(act==='dnd-zone'){
    if(S.checked)return;
    var z=parseInt(el.getAttribute('data-zone')||el.closest('[data-zone]').getAttribute('data-zone'),10);
    if(S.dndPick===null){warn('Pick an item first, then click a box.')}
    else{S.dndAssign[S.dndPick]=z;S.dndPick=null;reRenderDnd()}}
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&T.state==='PAUSED_MANUAL'){tResumeManual()}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target&&ev.target.closest&&ev.target.closest('[data-act="dnd-zone"]')){
    ev.preventDefault();
    if(S.checked)return;
    var z=parseInt(ev.target.closest('[data-act="dnd-zone"]').getAttribute('data-zone'),10);
    if(S.dndPick===null){warn('Pick an item first, then click a box.')}
    else{S.dndAssign[S.dndPick]=z;S.dndPick=null;reRenderDnd()}
  }
});
function reRenderDnd(){var e=cur();
  var holder=document.querySelector('.blk-answer');if(!holder)return;
  holder.innerHTML='<div class="lbl">◈ YOUR ANSWER</div>'+dndHTML(e)}
/* drag-and-drop native events */
document.addEventListener('dragstart',function(ev){
  var t=ev.target.closest&&ev.target.closest('.dnd-chip');
  if(t){ev.dataTransfer.setData('text/plain',t.getAttribute('data-i'))}});
document.addEventListener('dragover',function(ev){
  var z=ev.target.closest&&ev.target.closest('.dnd-zone');
  if(z){ev.preventDefault();z.classList.add('over')}});
document.addEventListener('dragleave',function(ev){
  var z=ev.target.closest&&ev.target.closest('.dnd-zone');
  if(z){z.classList.remove('over')}});
document.addEventListener('drop',function(ev){
  var z=ev.target.closest&&ev.target.closest('.dnd-zone');
  if(z){ev.preventDefault();z.classList.remove('over');
    if(S.checked)return;
    var i=parseInt(ev.dataTransfer.getData('text/plain'),10);
    if(!isNaN(i)){S.dndAssign[i]=parseInt(z.getAttribute('data-zone'),10);S.dndPick=null;reRenderDnd()}}});
/* host handshake: CYBERPULSE_INIT and CYBERMASTERY_INIT are both accepted; theme is ignored (dark-only file) */
window.addEventListener('message',function(ev){
  var d=ev.data||{};
  if(d.type==='CYBERPULSE_INIT'||d.type==='CYBERMASTERY_INIT'){
    S.hostOrigin=ev.origin||null;
    try{(window.parent===window?window:window.parent).postMessage(
      {type:'CYBERPULSE_READY',topicId:META.topicId,batch:META.batch,difficulty:META.difficulty},
      S.hostOrigin||location.origin)}catch(e){}
  }
});
document.addEventListener('DOMContentLoaded',function(){renderIntro()});
})();

</script>
