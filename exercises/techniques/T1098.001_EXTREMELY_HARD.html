    + "<p>Imagine an attacker steals one cloud password. Reset it, and the attacker is out. But if the attacker first used that session to <em>mint a new access key or secret</em>, they walk straight back in after your reset. That is the whole idea. You will meet it as new access keys, console passwords, SSH key pairs, and temporary federation tokens in AWS; as secrets and certificates on applications and service principals, and legacy app passwords, in Entra ID; and as service-account and os-login keys in GCP. It can even raise privileges: a credential added to a more powerful identity inherits that power.</p>"

  { id:"X05", type:"tree", concept:"Costly Decisions &amp; Escalation", perspective:"attacker",
    summary:"Prod payment SP minted its own credential; costly revoke call",
    scenario:"<p>23:58 UTC. Alert: service principal <strong>payments-gateway</strong> — the identity behind the production payment-initiation API — added a <strong>password credential to itself</strong>. The acting identity in the audit event is the SP itself, not a human. Working theory: a long-lived CI token for that SP leaked from a build agent last month (T1528), and the holder came back to make their access permanent (T1098.001). Finance is mid-closing; the payment pipeline cannot tolerate blind revocations — and cannot tolerate a stranger with payment initiation either.</p>"
      + "<div class='art'><div class='art-h'>ARTEFACT 1 — Entra audit event</div><pre>\n<span class='t'>2026-03-12T23:58:04Z</span> <span class='k'>Update service principal — Certificates and secrets management</span>\n  SP: <span class='s'>payments-gateway</span> (appId <span class='i'>7c31aa02-5d14-4f0a-9e04-b1c77f10aa17</span>)\n  change: <span class='bad'>passwordCredential added</span> — keyId <span class='s'>b41d9e02...0a9f</span>\n  initiated by: <span class='bad'>the SP itself</span> (app-only context) — src <span class='i'>203[.]0[.]113[.]88</span>\n</pre></div>"
      + "<div class='art'><div class='art-h'>ARTEFACT 2 — payments-gateway app roles (production)</div><pre>\n<span class='bad'>Payments.API.Initiate</span> — production payment initiation\n<span class='bad'>Payments.API.Read</span> · Directory.Read.All\n</pre></div>"
      + "<div class='art'><div class='art-h'>ARTEFACT 3 — Token issuance, the next hour</div><pre>\n<span class='t'>2026-03-13T00:04:51Z</span> app-only token issued to payments-gateway\n  authenticated with keyId <span class='bad'>b41d9e02...0a9f</span> <span class='k'>(the NEW credential)</span>\n  source: <span class='i'>198[.]51[.]100[.]77</span> (hosting ASN, new for this SP)\n  calls: <span class='n'>3</span> × POST /payments/initiate — <span class='bad'>EUR 2,900 total</span>, beneficiaries new\n</pre></div>",
    question:"Work the three decision points in order; at each, choose the single best senior action.",
    hint:"Three payments already cleared with the new keyId — weigh capacity that is demonstrated, not hypothetical.",
    steps:[
      { title:"Validate before you act",
        addendum:"<p><strong>23:59 — bridge opens.</strong> The app owner is asleep. The CI platform team confirms the build-agent token leak from February and says the leaked token was never rotated. Decide what this event actually establishes. <strong>What does the evidence prove right now?</strong></p>",
        question:"What does the evidence prove right now?",
        options:[
          { id:"a", html:"The SP's own identity added a credential, and that credential has already authenticated once — treat the SP as attacker-controlled." },
          { id:"b", html:"It is the platform's own credential-rotation job — this SP rotates itself monthly." },
          { id:"c", html:"It is a duplicate log line from the February leak investigation — no new activity." }
        ],
        correct:["a"],
        why:"The actor is the SP itself in an app-only context no rotation job here uses, and Artefact 3 shows the new keyId authenticating from a brand-new ASN. Two facts, one conclusion." },
      { title:"Establish the blast radius",
        addendum:"<p><strong>00:11 —</strong> finance confirms the three payment-initiation calls are non-standard: new beneficiaries, sub-threshold amounts designed to blend in. The on-call asks what the attacker can actually reach with this credential. <strong>What does the new credential give its holder?</strong></p>",
        question:"What does the new credential give its holder?",
        options:[
          { id:"a", html:"App-only access with the SP's full role set — production payment initiation included; no human account is involved at all." },
          { id:"b", html:"Only the interactive rights of the sleeping on-call engineer." },
          { id:"c", html:"Read-only directory metadata — the payment roles require a human sign-in." }
        ],
        correct:["a"],
        why:"App credentials carry the app's roles, not a person's. With Payments.API.Initiate on the SP, the credential is a payment capability — and the calls prove it is being used as one." },
      { title:"Make the costly call",
        addendum:"<p><strong>00:26 —</strong> the finance director on the bridge: if you kill that SP mid-closing we lose the batch window — can it wait until Saturday? The attacker has demonstrated capacity and intent. <strong>Make the call.</strong></p>",
        question:"Make the call.",
        options:[
          { id:"a", html:"Revoke the added credential now and force re-issuance, accepting that the payment pipeline is down until re-deploy." },
          { id:"b", html:"Wait for Saturday's maintenance window to protect the closing cycle." },
          { id:"c", html:"Export logs for the morning review first; revoke after finance signs off." }
        ],
        correct:["a"],
        why:"The cost is real — downtime during closing — and it is still the right call: an attacker-controlled credential with demonstrated payment capacity grows losses every hour it lives. Downtime is recoverable; irreversible transfers are not." }
    ],
    explanation:"<p>The chain is credential-minting (T1098.001) riding on a stolen token (T1528), and each answer depended on the one before it: once step 1 establishes attacker control, step 2 fixes the blast radius at payment initiation, and step 3 has only one defensible outcome. The genuine conflict — finance's closing cycle versus demonstrated attacker capacity — resolves on <strong>demonstrated use</strong>: three initiation calls with the new keyId from a new ASN turn suspicion into incident. <strong>The correct action accepts the business cost, and you must say so on the record:</strong> the pipeline goes down, the batch window slips, and that price is documented because the alternative is unbounded fraud. Waiting for a window or for sign-off is defensible only in a world where the credential is unused — here it has been used. File the cost decision with the CISO in the incident record so the downtime has a named author.</p><p class='study'><strong>Study:</strong> T1098.001 privilege-escalation framing (the SP's roles define the blast radius) and T1528 (Steal Application Access Token) for the path in.</p>"
  },

  { id:"X06", type:"qcm", concept:"Costly Decisions &amp; Escalation", perspective:"defender",
    summary:"MFA-on-API best practice vs a 24/7 CI fleet — wrong fit here",
    scenario:"<p>Architecture review board, Thursday. A control owner proposes the M1032 pattern from the T1098.001 page: <strong>enforce MFA on CreateKeyPair and ImportKeyPair, tenant-wide</strong>, to stop attackers minting their own key pairs. Sound practice — until you look at the tenant: account <code>775410992310</code> runs a 24/7 CI fleet, <span class='n'>312</span> pipeline principals provisioning instances around the clock with API keys and zero human sign-ins. An MFA prompt on an API call has no human to answer it.</p>"
      + "<div class='art'><div class='art-h'>ARTEFACT 1 — Principal census (account 775410992310)</div><pre>\nhuman IAM users (console): <span class='n'>0</span>\npipeline principals (API only): <span class='n'>312</span> — CreateKeyPair/ImportKeyPair daily\nfederated humans via SSO: <span class='n'>40</span> (different account, same proposal scope)\nkey-creation events, last 30 d: <span class='n'>4,117</span> — <span class='ok'>100% from pipeline principals</span>\n</pre></div>"
      + "<div class='art'><div class='art-h'>ARTEFACT 2 — Proposal PROJ-2214 (excerpt)</div><pre>\ncontrol: enforce MFA on iam:CreateKeyPair and iam:ImportKeyPair\nscope: tenant-wide, all principals, effective Friday\nrationale: M1032 lists MFA for key creation — industry best practice\n</pre></div>",
    question:"What is the correct senior call on PROJ-2214?",
    hint:"Friday 00:01, 312 unattended principals meet a prompt with no human behind the wheel — scope for the principal you actually have.",
    options:[
      { id:"a", html:"Enforce tenant-wide on Friday — best practice survives breakage, and teams adapt." },
      { id:"b", html:"Reject the proposal outright — M1032 has nothing to do with key-pair creation." },
      { id:"c", html:"Grant the CI fleet broader admin rights so MFA becomes irrelevant to it." },
      { id:"d", html:"Inventory principals first: enforce MFA only where humans authenticate, and constrain the CI fleet with scoped policies instead." },
      { id:"e", html:"Park the proposal until next year's audit cycle decides it." }
    ],
    correct:["d"],
    optWhy:{
      a:"Right in a world of human operators; here it hard-fails 312 unattended principals at 00:01 Friday — the control would be emergency-disabled by Monday, discrediting the whole program.",
      b:"Wrong on the page itself — M1032 explicitly contemplates enforcing MFA on CreateKeyPair/ImportKeyPair. The control is sound; the blanket scope is what fails.",
      c:"Adds standing privilege to solve a control-fit problem — the exact behaviour T1098.001 rewards an attacker for finding.",
      e:"A deferral is defensible when a design is merely imperfect; here it is provably incompatible with the tenant, and attackers do not wait for audit cycles."
    },
    explanation:"<p>The widely-cited best practice is wrong <strong>here</strong>, and the reason is structural: <strong>unattended API callers cannot satisfy an MFA prompt</strong>. The intent behind M1032 — make credential minting require a second factor — still stands, so you achieve it where a human exists and substitute a machine-appropriate control where one does not: scoped policies and SCP conditions (allowed networks, session tags, creation quotas) that keep the fleet working while an attacker riding any other principal cannot quietly mint key pairs. The census comes first because you cannot scope a control to principals you have not counted — and the count is what turns a slogan into a fit-for-tenant design. This is the review-board version of the costly decision: applying the control as written would have cost the business its provisioning pipeline, and that cost was avoided by design work, not by luck.</p><p class='study'><strong>Study:</strong> T1098.001 mitigations M1032 (MFA on key creation) and M1018 (low-privilege principals must not hold credential-creation rights) — controls fit principals, not slogans.</p>"
  },

  { id:"X07", type:"fill", concept:"Detection Coverage Gaps", perspective:"defender",
    summary:"Draft the Azure Activity Log analytic for app credential adds",
    scenario:"<p>You own the AN1469 tuning backlog. The SOC wants an Azure Activity Log analytic that fires on <strong>certificate and secret additions to app registrations</strong>, excludes the documented automation identity, and returns the fields triage needs. The service-principal twin (Update service principal) is a separate analytic — this one covers app registrations only. The artefact shows the exact strings Azure writes.</p>"
      + "<div class='art log'><div class='art-h'>ARTEFACT 1 — Azure Activity Log sample (raw lines)</div><pre>\n<span class='log-line'><span class='t'>2026-03-09T01:02:11Z</span> <span class='k'>OperationNameValue:</span> <span class='s'>Update application — Certificates and secrets management</span> <span class='k'>Caller:</span> <span class='s'>svc-automation@corp[.]example</span></span>\n<span class='log-line'><span class='t'>2026-03-09T03:41:56Z</span> <span class='k'>OperationNameValue:</span> <span class='s'>Update application — Certificates and secrets management</span> <span class='k'>Caller:</span> <span class='bad'>a.winters@corp[.]example</span> <span class='k'>Properties:</span> key description <span class='bad'>(empty)</span></span>\n<span class='log-line'><span class='t'>2026-03-09T04:10:02Z</span> <span class='k'>OperationNameValue:</span> <span class='s'>Add owner to application</span> <span class='k'>Caller:</span> <span class='s'>svc-automation@corp[.]example</span></span>\n</pre></div>"
      + "<p>The automation identity is <code>svc-automation@corp[.]example</code> (ticket CHG-90488, weekly rotation); everything else should page.</p>",
    question:"Complete the analytic so only app-registration credential additions from non-automation identities page.",
    hint:"The operation string is whatever Azure writes into OperationNameValue — and the exclusion list takes an identity, not a role.",
    cloze:"AzureActivity | where OperationNameValue has \"{{b1}}\" | where Properties contains \"Key\" | where Caller !in~ (\"{{b2}}\") | {{b3}} TimeGenerated, Caller, Properties_d",
    blanks:{
      b1:{ kind:"text", accept:["update application","update application — certificates and secrets management","update application - certificates and secrets management"], label:"the app-credential operation", size:26,
        why:"Azure writes the operation as Update application — Certificates and secrets management; has() keeps the match resilient. Update service principal is the twin analytic — the near-miss that pages on the wrong object family." },
      b2:{ kind:"text", accept:["svc-automation@corp.example","svc-automation@corp[.]example","svc-automation"], label:"the automation identity to exclude", size:28,
        why:"The exclusion is the enumerated UPN the change ticket owns — everyone else pages. Broad role-based exclusions would blind the analytic to anyone automation-shaped, which is what an attacker pretends to be." },
      b3:{ kind:"select", choices:["project","extend","summarize","where"], accept:["project"], label:"the projection verb",
        why:"project returns exactly the columns triage needs. summarize would collapse the rows you need for a timeline; extend adds columns; where filters rows." }
    },
    bank:["Update application","Update service principal","svc-automation@corp[.]example","svc-backup@corp[.]example","project","summarize","where","extend"],
    explanation:"<p>Three decisions, each a coverage decision. <strong>b1 — Update application:</strong> the artefact shows the exact operation string; the SP twin is a separate analytic, which is why the near-miss Update service principal pages on the wrong object family. <strong>b2 — the automation UPN:</strong> exclusions are identities you have counted, never broad shapes — otherwise the analytic blinds itself to exactly the disguise an attacker would wear. <strong>b3 — project:</strong> triage needs time, caller and the changed properties in that shape; summarize would destroy the row-level timeline. The incomplete third field in line two (empty key description) is your reminder that the Properties filter is doing real work, and the Add owner line is noise for this analytic — different operation, different rule. Missing any blank costs a third of the credit under (H − W) / N.</p><p class='study'><strong>Study:</strong> DET0531 AN1469 (credential additions by non-standard identities) — tune by enumerated identity, never by operation-wide suppression.</p>"
  },
  { id:"X08", type:"multi", concept:"Advanced Credential Mechanics", perspective:"attacker",
    summary:"SP secret vs Golden SAML: stored object vs forged artefact",
    scenario:"<p>Tenant review before the CTI briefing. Two intrusions, two credential outcomes. In <strong>tenant A</strong> the actor added a secret to a service principal and used it for 11 days. In <strong>tenant B</strong> the actor stole the ADFS token-signing certificate and minted SAML assertions for any user they liked — no directory change was ever made. The CISO will ask whether these are the same thing with different badges. Answer with precision, because the two playbooks diverge at containment.</p>"
      + "<div class='art'><div class='art-h'>ARTEFACT 1 — Tenant A (Entra audit)</div><pre>\n<span class='t'>2026-02-03T04:22:10Z</span> <span class='k'>Update service principal — Certificates and secrets management</span>\n  SP: <span class='s'>data-sync-prod</span> — <span class='bad'>passwordCredential added</span>\n  usage: <span class='n'>11</span> days of app-only calls — <span class='n'>214</span> rows to clean up\n  containment: <span class='ok'>credential object revoked</span> — access ended at revocation\n</pre></div>"
      + "<div class='art'><div class='art-h'>ARTEFACT 2 — Tenant B (federation infrastructure)</div><pre>\nactor exported the <span class='bad'>ADFS token-signing certificate</span> (private key)\nminted SAML assertions for arbitrary users — <span class='bad'>no credential row exists anywhere</span>\nsign-ins looked native: valid assertions, valid issuer\ncontainment: <span class='ok'>signing trust rotated</span> — every forged assertion died at once\n</pre></div>",
    question:"Select every statement that is precisely true for the briefing.",
    hint:"Ask what an auditor could enumerate afterwards in each tenant — one leaves a row, the other leaves silence.",
    options:[
      { id:"a", html:"Tenant A's move is T1098.001 (additional cloud credentials); tenant B's is T1550.001 — using alternate authentication material." },
      { id:"b", html:"Tenant A leaves a credential object in the directory that can be listed, audited and revoked; tenant B leaves nothing to revoke." },
      { id:"c", html:"Tenant B's forged assertions keep working until the signing trust changes, so remediation is the certificate — not a credentials list." },
      { id:"d", html:"Same technique, two vendors — both moves mint credentials into the directory." },
      { id:"e", html:"Golden SAML requires adding a new signing key to the federation service before minting begins." },
      { id:"f", html:"Remediation is identical in both tenants: force a password reset on every user." }
    ],
    correct:["a","b","c"],
    whys:{
      a:"The taxonomy is operational, not cosmetic: one behaviour adds a stored credential (T1098.001); the other abuses existing trust material (T1550.001, child of Use Alternate Authentication Material). Different ATT&CK entries, different telemetry, different containment.",
      b:"The credential object is the defender's gift in tenant A — enumerable, attributable, revocable. That asymmetry drives the whole playbook.",
      c:"In tenant B the artefact to attack is the signing trust. Rotate it and every forged assertion fails validation at once — no per-user cleanup, no credential list to sweep.",
      d:"Only tenant A mints anything into the directory. In tenant B nothing is stored — the forgery happens outside the directory, which is why nobody ever finds a row. The shared-outcome reading is what the CISO will bring; it is wrong.",
      e:"Backwards: the actor uses the existing signing certificate. Adding keys to a federation service is the T1098.001-style move, and it is not required to forge assertions.",
      f:"Password resets fix neither tenant's root cause — tenant A's fix is object-level revocation, tenant B's is trust-level rotation. The identical-remediation reflex burns hours and misses the certificate entirely."
    },
    explanation:"<p><strong>a, b, c</strong> survive scrutiny; the briefing line is: tenant A leaves an object, tenant B leaves an artefact. The CISO's same-thing question collapses on the containment test — in tenant A you revoke a row and the access dies; in tenant B there is no row, so you rotate the signing trust and every forgery dies at once. <strong>Attacker view:</strong> the two options trade stealth against durability — a new SP secret is one loud audit event but a durable key; a stolen signing certificate is silent on credential logs but catastrophic in blast radius once found. <strong>Defender view:</strong> enumerate credential objects for the first, watch the trust fabric for the second. The ambiguity to resolve explicitly: identical outcomes (authenticated access) do not imply identical objects, and containment design must follow the object, not the outcome.</p><p class='study'><strong>Study:</strong> T1550.001 (Use Alternate Authentication Material: Web Tokens — the Golden SAML pattern) versus T1098.001, and why no-row-to-revoke changes containment design.</p>"
  },

  { id:"X09", type:"qcm", concept:"Senior Triage Under Pressure", perspective:"defender",
    summary:"Creation event beyond retention: gather evidence, hold state",
    scenario:"<p>Day 9 of a suspected app-credential incident in a tenant on Entra ID Free: <strong>audit log retention is 7 days</strong>. A password credential on app <code>contractor-portal</code> is confirmed present (live directory read), but the creation event has rolled out of retention — no caller, no IP, no timestamp beyond the keyId's own creation date. The CISO, live on the bridge: I want a name in the next 15 minutes. Legal is cc'd. Deleting the app tonight is one click away, and everyone on the bridge knows it.</p>"
      + "<div class='art'><div class='art-h'>ARTEFACT 1 — What you actually hold (source census)</div><pre>\ndirectory read (live): SP <span class='s'>contractor-portal</span> — passwordCredential keyId <span class='s'>e77a...31c0</span>, created <span class='t'>2026-03-05</span>\nEntra audit log: <span class='bad'>retention 7 days — 2026-03-05 is out of window</span>\nsign-in logs (workspace): <span class='ok'>available 30 days</span>\nM365 unified audit log: <span class='ok'>available 180 days</span>\nGraph activity and consent history: <span class='ok'>queryable</span>\napp owner: contractor vendor contact — unresponsive (weekend)\n</pre></div>"
      + "<div class='art'><div class='art-h'>ARTEFACT 2 — Bridge pressure</div><pre>\nCISO: no name, no update — legal wants a suspect for the notice\nSOC lead (private): one click deletes the app. tempting.\n</pre></div>",
    question:"What is the correct senior move in the next 15 minutes?",
    hint:"Three other sources reach past the seven-day wall — count what you still hold before spending any of it.",
    options:[
      { id:"a", html:"Delete the app registration now so the attacker's access ends tonight." },
      { id:"b", html:"Name the actor now: TTP overlap with a public report is enough for the legal notice." },
      { id:"c", html:"Reconstruct the timeline from the sources that do reach back — sign-in logs, unified audit log, Graph and consent history — and hold state changes until the picture is in." },
      { id:"d", html:"Close the investigation — with the creation event gone, attribution is impossible." },
      { id:"e", html:"Rotate every credential in the tenant tonight; speed beats precision." }
    ],
    correct:["c"],
    optWhy:{
      a:"Right in a world where containment is urgent and the evidence lives elsewhere. Here the credential object itself is the best surviving evidence — keyId, creation date, usage — and deletion also breaks a live vendor portal mid-contract while yielding no name.",
      b:"TTP overlap supports a working hypothesis at a stated confidence — it is not a name for a legal notice, and a wrong public attribution is unrecoverable.",
      d:"The missing event narrows your source list; it does not end the case. Three other sources reach past the 7-day wall and none has been queried yet.",
      e:"Tenant-wide rotation destroys the same trail you need, breaks every service principal at once, and still produces no attribution. Proportionality fails on every axis."
    },
    explanation:"<p>The defensible move is <strong>collect before you act</strong> — the gather-more-evidence answer, which under pressure is the hardest one to give. The retention gap removes one source; sign-in logs (30 days), the unified audit log (180 days) and Graph activity all reach past the gap, and the live credential object — keyId, creation date, usage — is evidence you have not spent. <strong>The ambiguity resolves this way:</strong> a missing creation event reads either as case-dead (option d's world) or as act-blind (a and e); it actually means triangulate. Deleting the app is a one-click, irreversible state change that destroys the object, breaks a production integration, and produces no name — the CISO's 15-minute demand is answered with an evidence plan and a stated confidence, not a guess.</p><p class='study'><strong>Study:</strong> the IR evidence-priority rule — never trade the last surviving artefact for the appearance of action — and the T1098.001 data-source list for sources that outlive short audit retention.</p>"
  },

  { id:"X10", type:"order", concept:"Senior Triage Under Pressure", perspective:"defender",
    summary:"Rank the senior IR sequence for a credential-add incident",
    scenario:"<p>The containment call is made: an unexplained keyCredential on SP <code>ops-automation</code> is attacker-controlled — used twice from a hosting ASN, owner silent. You lead the response. Rank the five actions from first (1) to last (5). Two of them change state; the ordering decides whether the evidence survives the response.</p>",
    question:"Rank the five response actions from first to last.",
    hint:"Two of these change state — sequence them so the first one does not erase what the second needs.",
    steps:[
      { id:"s1", html:"Confirm scope read-only — event search for every credential-add and use; no state changes" },
      { id:"s2", html:"Agree the containment plan with the business owner — window, downtime, fallback, named approver" },
      { id:"s3", html:"Revoke or disable the added credentials — the keyCredential and any sibling secrets" },
      { id:"s4", html:"Sweep for other persistence — additional keys, consents, role assignments, MFA methods" },
      { id:"s5", html:"Report with timeline, ownership and residual risk to the CISO" }
    ],
    correctOrder:["s1","s2","s3","s4","s5"],
    whys:{
      s1:"Read-only confirmation fixes the blast radius and captures attribution evidence before anything mutates the scene.",
      s2:"The costly decision needs a named business owner and window — agreed before the outage, not during it.",
      s3:"Revocation is the first state change, and it happens only once scope and window exist; revoking earlier, without scope, misses siblings.",
      s4:"With the known channel dead, sweep for what the actor planted besides it — credential persistence is rarely single.",
      s5:"The report closes the loop with the decision record: timeline, owner, residual risk, lessons."
    },
    explanation:"<p>The ranking encodes one principle: <strong>evidence and authority come before state change</strong>. Read-only scoping first — it is the only step that cannot be redone once something mutates. Business agreement second: revoking a working automation SP has cost, and cost needs a named owner (the same lesson as the payments case, applied calmly). Revocation third — delayed until scope and window exist, then executed without further delay. The sibling sweep fourth: with the added credential dead, fresh log lines belong to clean traffic, and persistence is rarely single. Reporting last, because it depends on all the others being real. If you ranked revocation first, ask what you would have missed: the sibling key created forty minutes later in the same intruder session — unrevoked, undocumented, and still live during your victory lap.</p><p class='study'><strong>Study:</strong> the standard containment sequence (scope &rarr; authorise &rarr; contain &rarr; verify &rarr; report) applied to cloud credential objects on the T1098.001 page.</p>"
  },

  { id:"X11", type:"match", concept:"Attribution &amp; Real-World Operations", perspective:"general",
    summary:"Map five real cases to the right ATT&CK objects",
    scenario:"<p>The CISO briefing needs one slide: five real-world entries mapped to the right ATT&amp;CK object — because a briefing that mislabels an on-prem kernel patch as a cloud-credential technique loses the room. The cases are condensed from the T1098.001 page and its family; the near-misses are the point.</p>",
    question:"Match each condensed case to the correct ATT&CK object.",
    hint:"One case never leaves the on-prem directory — check the platform line before the name.",
    lefts:[
      { id:"l1", html:"Minted temporary federated credentials for FAKE users with aws_consoler, pivoting CLI access to console access without MFA" },
      { id:"l2", html:"Added credentials to OAuth applications and service principals to persist inside a software supply chain" },
      { id:"l3", html:"Open-source AWS exploitation framework that generates new SSH and API keys for the users it reaches" },
      { id:"l4", html:"Reset the passwords of admin accounts that lacked MFA and registered its own MFA methods" },
      { id:"l5", html:"Kernel patch on a domain controller so any account authenticates with a magic password" }
    ],
    rights:[
      { id:"r1", html:"C0027 — Scattered Spider" },
      { id:"r2", html:"C0024 — SolarWinds (APT29)" },
      { id:"r3", html:"S1091 — Pacu" },
      { id:"r4", html:"G1053 — Storm-0501" },
      { id:"r5", html:"T1098 parent — Skeleton Key" }
    ],
    pairs:{ l1:"r1", l2:"r2", l3:"r3", l4:"r4", l5:"r5" },
    whys:{
      l1:"C0027 — the aws_consoler fake-federation pattern is Scattered Spider's documented T1098.001 procedure: temporary credentials for invented users, obfuscating which credential was compromised.",
      l2:"C0024 — APT29 added credentials to OAuth applications and service principals during the SolarWinds compromise; the classic app-credential persistence case.",
      l3:"S1091 Pacu is software, not a campaign — its key generation is tooling that implements the behaviour, so it maps to the software object.",
      l4:"G1053 Storm-0501 appears on the T1098.001 page for the admin-password-reset plus own-MFA-registration pattern.",
      l5:"Skeleton Key never touches a cloud control plane — it belongs to the parent technique T1098. Mapping it to additional cloud credentials is the room-losing error."
    },
    explanation:"<p>Object precision is the discipline the CTI lead signs. Two cases are genuinely T1098.001 (C0027's federated fake users; C0024's app and service-principal credentials); one is software implementing the behaviour (Pacu, S1091); one is the page's identity-abuse procedure example (Storm-0501, G1053); and one — Skeleton Key — belongs to the parent T1098 and never touches cloud credentials at all. <strong>The tension worth naming:</strong> Storm-0501's password resets look like valid-account territory, but the page records the pattern under T1098.001 because the added MFA method is the persistence object — when the page and your instinct disagree, the page wins and the slide says so with the citation. Wrong-object mappings survive in no serious briefing, and this slide is where that discipline gets audited.</p><p class='study'><strong>Study:</strong> the procedure-examples table on attack.mitre.org/techniques/T1098/001/ — campaigns, software and groups are separate object types, and each maps to its own row.</p>"

function $(s,r){return (r||document).querySelector(s);}
function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function h(tag,cls,html){var e=document.createElement(tag);if(cls){e.className=cls;}if(html!==undefined&&html!==null){e.innerHTML=html;}return e;}
function fmtClock(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s=sec%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function fmtMin(sec){return Math.round(sec/60);}
function shuffle(arr){var a=arr.slice(),i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}return a;}
function norm(s){return String(s||"").toLowerCase().replace(/[\s]+/g," ").replace(/["'.,;:!?\u00b4`]/g,"").trim();}
/* Spec-mandated scoring function name */
function scoreExercise(selectedItems, correctItems){
  var N=correctItems.length,H=0,W=0,i,seen={};
  for(i=0;i<correctItems.length;i++){seen[correctItems[i]]=1;}
  for(i=0;i<selectedItems.length;i++){if(seen[selectedItems[i]]){H++;}else{W++;}}
  return Math.max(0,(H-W)/Math.max(1,N));
}
function scoreHW(H,W,N){return Math.max(0,(H-W)/Math.max(1,N));}

var T_RUN="RUNNING",T_MAN="PAUSED_MANUAL",T_AUTO="PAUSED_AUTO_CHECK",T_END="ENDED";
var S={
  phase:"intro",          /* intro | exam | review | results */
  timer:T_RUN,            /* the single timer state machine */
  resumeTo:T_RUN,         /* state to return to after a manual pause */
  started:false,
  order:[],               /* shuffled exercise ids for this attempt */
  idx:0,
  cur:null,
  checked:false,
  answered:{},            /* id -> credit (float) */
  skipped:{},             /* id -> 1 */
  hinted:{},              /* id -> 1 */
  breakdown:{},           /* id -> grade object (for results table) */
  remain:0,
  runTotal:0,manualMs:0,autoMs:0,
  exLeft:0,exLimit:false, /* per-exercise timer (EXTREMELY HARD terminal only) */
  reported:false,
  user:null,country:null
};

function setState(t){
  if(t===T_MAN){S.resumeTo=(S.timer===T_MAN?S.resumeTo:S.timer);S.timer=T_MAN;}
  else if(t===T_RUN){S.timer=(S.resumeTo===T_AUTO?T_AUTO:T_RUN);S.resumeTo=T_RUN;}
  else{S.timer=t;}
  updateTimerUI();
}
function updateTimerUI(){
  var st=$("#hTState"),ind=$("#hInd"),clock=$("#hClock");
  if(!st){return;}
  clock.textContent=fmtClock(S.remain);
  if(S.timer===T_RUN){st.className="tstate st-run";st.innerHTML="&#9654; RUNNING";ind.hidden=true;}
  else if(S.timer===T_MAN){st.className="tstate st-pause";st.innerHTML="&#9208; PAUSED_MANUAL";
    ind.hidden=false;ind.innerHTML="&#9208; PAUSED &mdash; manual (press Resume)";}
  else if(S.timer===T_AUTO){st.className="tstate st-pause";st.innerHTML="&#9208; PAUSED_AUTO_CHECK";
    ind.hidden=false;ind.innerHTML="&#9208; PAUSED &mdash; reviewing feedback (resumes on Next)";}
  else{st.className="tstate st-end";st.innerHTML="&#9632; ENDED";ind.hidden=true;}
}
setInterval(function(){
  if(!S.started||S.timer===T_END){return;}
  if(S.timer===T_RUN){
    S.remain-=0.5;
    if(S.phase==="exam"&&S.exLimit&&!S.checked){
      S.exLeft-=0.5;
      var ec=$("#exClock");if(ec){ec.textContent=fmtClock(S.exLeft);}
      if(S.exLeft<=0){autoCheck();}
    }
    if(S.remain<=0){S.remain=0;updateTimerUI();finishExam(true);return;}
  }else if(S.timer===T_MAN){S.manualMs+=0.5;}
  else if(S.timer===T_AUTO){S.autoMs+=0.5;}
  updateTimerUI();
},500);

  $("#hObj").textContent=META.objId;
  $("#hSev").className="badge sev-"+META.sevClass;
  $("#hSev").textContent=META.sevWord;
  $("#hCount").hidden=!onExam;
  $("#hScore").hidden=!onExam;
  $("#bPause").hidden=!onExam;
  $("#bHint").hidden=!onExam;
  $("#bSkip").hidden=!onExam;
  updateTimerUI();
}
function updateHeaderEx(){
  $("#hCount").textContent="Exercise "+(S.idx+1)+" of "+S.order.length;
  updateScoreChip();
}
function updateScoreChip(){
  var sum=0,count=0,k;
  for(k in S.answered){if(S.answered.hasOwnProperty(k)){sum+=S.answered[k];count++;}}
  $("#hScoreSum").textContent=(Math.round(sum*10)/10).toFixed(1);
  $("#hScoreMax").textContent=count;
  $("#hScorePct").textContent=(count>0?Math.round(sum/count*100):0)+"%";
}
function answeredCount(){var n=0,k;for(k in S.answered){if(S.answered.hasOwnProperty(k)){n++;}}return n;}

/* ================= intro ================= */
var TYPE_LABELS={qcm:"Multiple choice (one answer)",multi:"Multi-select with partial credit",
  dnd:"Drag &amp; drop sorting",match:"Matching pairs",fill:"Fill in the blanks",
  order:"Ordering / ranking",terminal:"Fake shell command work",tree:"Branching scenario steps"};

function typesUsed(){
  var set={},i,ex;
  for(i=0;i<EXAM_EXERCISES.length;i++){set[EXAM_EXERCISES[i].type]=1;}
  var out=[],order=["tree","terminal","dnd","order","match","fill","multi","qcm"],t;
  for(i=0;i<order.length;i++){t=order[i];if(set[t]){out.push(TYPE_LABELS[t]||t);delete set[t];}}
  for(t in set){if(set.hasOwnProperty(t)){out.push(TYPE_LABELS[t]||t);}}
  return out;
}

/* ================= exam flow ================= */
function startExam(){
  S.started=true;S.phase="exam";
  resetAttempt();
  S.order=shuffle(exIds());
  S.idx=0;
  $("#vIntro").hidden=true;
  $("#vResults").hidden=true;
  $("#vReview").hidden=true;
  $("#vExam").hidden=false;
  hdrShow(true);
  showExercise();
}
function resetAttempt(){
  S.answered={};S.skipped={};S.hinted={};S.breakdown={};
  S.checked=false;S.reported=false;S.idx=0;S.cur=null;
  S.remain=META.budgetSeconds;S.resumeTo=T_RUN;S.timer=T_RUN;
  S.manualMs=0;S.autoMs=0;S.runTotal=0;S.exLimit=false;S.exLeft=0;
  updateTimerUI();updateScoreChip();
}
function retake(){
  S.phase="exam";
  resetAttempt();
  S.order=shuffle(exIds());
  S.idx=0;
  $("#vResults").hidden=true;
  $("#vReview").hidden=true;
  $("#vExam").hidden=false;
  showExercise();
}
function exIds(){var o=[],i;for(i=0;i<EXAM_EXERCISES.length;i++){o.push(EXAM_EXERCISES[i].id);}return o;}
function exById(id){var i;for(i=0;i<EXAM_EXERCISES.length;i++){if(EXAM_EXERCISES[i].id===id){return EXAM_EXERCISES[i];}}return null;}

function showExercise(){
  S.cur=exById(S.order[S.idx]);
  S.checked=false;
  var ex=S.cur;
  updateHeaderEx();
  updateProgress();
  renderExerciseCard(ex);
  var nav=$("#navRow");nav.innerHTML="";
  var bCheck=h("button","btn primary","&#10003; Check");
  bCheck.type="button";bCheck.id="bCheck";
  bCheck.addEventListener("click",function(){checkCurrent(false);});
  nav.appendChild(bCheck);
  $("#bHint").disabled=false;$("#bSkip").disabled=false;
  $("#bHint").hidden=false;$("#bSkip").hidden=false;
  var first=$(".opt input,.ditem,.orow .obtn,.term-in input,#exCard select,#exCard input",$("#exCard"));
  if(first){try{first.focus({preventScroll:true});}catch(e){first.focus();}}
}
function updateProgress(){
  var pct=answeredCount()/S.order.length*100;
  $("#progFill").style.width=pct+"%";
  $(".progress").setAttribute("aria-valuenow",Math.round(pct));
}

/* ---- scenario / question / answer shell ---- */
function renderExerciseCard(ex){
  var card=$("#exCard");card.innerHTML="";
  /* scenario block */
  var sB=h("div","blk b-scen");
  var sh=h("div","blk-h","<span class=\"ic\">&#9635;</span> SCENARIO");
  var tgl=h("button","sc-toggle","Hide scenario");tgl.type="button";
  tgl.addEventListener("click",function(){
    sB.classList.toggle("collapsed");
    tgl.textContent=sB.classList.contains("collapsed")?"Show scenario":"Hide scenario";
  });
  sh.appendChild(tgl);sB.appendChild(sh);
  var sum=h("div","sc-sum",ex.summary||"");
  sB.appendChild(sum);
  var body=h("div","sc-body",ex.scenario);
  sB.appendChild(body);
  var words=(ex.scenario||"").replace(/<[^>]*>/g," ").length;
  if(words>2400){sB.classList.add("collapsed");tgl.textContent="Show scenario";}
  card.appendChild(sB);
  /* question block */
  var qB=h("div","blk b-ques");
  qB.appendChild(h("div","blk-h","<span class=\"ic\">&#10022;</span> QUESTION"));
  qB.appendChild(h("div","blk-b","<div class=\"qtext\">"+ex.question+"</div>"));
  card.appendChild(qB);
  /* hint slot */
  var hintSlot=h("div","", "");hintSlot.id="hintSlot";card.appendChild(hintSlot);
  /* answer block */
  var aB=h("div","blk b-ans");
  aB.appendChild(h("div","blk-h","<span class=\"ic\">&#9998;</span> YOUR ANSWER"));
  var ab=h("div","blk-b");aB.appendChild(ab);
  card.appendChild(aB);
  /* per-exercise timer notice */
  if(ex.timeLimit){
    S.exLimit=true;S.exLeft=ex.timeLimit;
    card.insertBefore(h("div","","<span class=\"exlimit\">&#9201; Reduced time limit for this exercise: <b id=\"exClock\">"+fmtClock(ex.timeLimit)+"</b> (visible before you start answering) &mdash; it stops with the exam timer.</span>"),aB);
  }else{S.exLimit=false;}
  buildWidget(ex,ab);
  /* feedback slot */
  var fb=h("div","fb");fb.id="fbSlot";fb.hidden=true;
  card.appendChild(fb);
  wireLogFilters(card);
}
/* log-viewer filter boxes on .art.log panels */
function wireLogFilters(root){
  $all(".art.log",root).forEach(function(art){
    var hd=$(".art-h",art);
    if(!hd){return;}
    var inp=document.createElement("input");
    inp.className="filter";inp.type="search";inp.placeholder="filter lines... (e.g. CreateAccessKey)";
    inp.setAttribute("aria-label","Filter log lines");
    hd.appendChild(inp);
    inp.addEventListener("input",function(){
      var q=inp.value.toLowerCase();
      $all(".log-line",art).forEach(function(ln){
        ln.classList.toggle("hl-off",q.length>0&&ln.textContent.toLowerCase().indexOf(q)===-1);
      });
    });
  });
}

var LETTERS="ABCDEFGH";
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];});}
function optText(html){var d=h("div","",html);return d.textContent;}

/* ================= widget builders ================= */
function buildWidget(ex,box){
  S.collectFn=null;S.disableFn=null;
  if(ex.type==="qcm"){buildChoice(ex,box,false);}
  else if(ex.type==="multi"){buildChoice(ex,box,true);}
  else if(ex.type==="dnd"){buildDND(ex,box);}
  else if(ex.type==="match"){buildMatch(ex,box);}
  else if(ex.type==="fill"){buildFill(ex,box);}
  else if(ex.type==="order"){buildOrder(ex,box);}
  else if(ex.type==="terminal"){buildTerminal(ex,box);}
  else if(ex.type==="tree"){buildTree(ex,box);}
  else{box.appendChild(h("p","bad","Unsupported exercise type."));}
}
function buildChoice(ex,box,multi){
  var list=h("div","anslist");
  var opts=shuffle(ex.options);
  opts.forEach(function(o,i){
    var lab=h("label","opt");
    var inp=document.createElement("input");
    inp.type=multi?"checkbox":"radio";inp.name="ans_"+ex.id;inp.value=o.id;
    lab.appendChild(inp);
    lab.appendChild(h("span","olab",LETTERS[i]+"."));
    lab.appendChild(h("span","ohtml",o.html));
    lab.appendChild(h("span","sel-tag","&#9679; Selected"));
    inp.addEventListener("change",function(){
      if(multi){lab.classList.toggle("sel",inp.checked);}
      else{$all(".opt",list).forEach(function(x){x.classList.remove("sel");});lab.classList.add("sel");}
    });
    list.appendChild(lab);
  });
  box.appendChild(list);
  S.collectFn=function(){return $all("input:checked",list).map(function(i){return i.value;});};
  S.disableFn=function(){$all("input",list).forEach(function(i){i.disabled=true;});list.style.pointerEvents="none";};
}
function buildDND(ex,box){
  var picked=null;
  box.appendChild(h("div","bank-label","Item bank &mdash; drag each item into a zone, or click an item and then click a zone. Click an item inside a zone to send it back."));
  var bank=h("div","bank");box.appendChild(bank);
  var zw=h("div","dzwrap"+(ex.matrix?" matrix":""));box.appendChild(zw);
  function itemEl(id){return $all(".ditem",box).filter(function(e){return e.dataset.id===id;})[0]||null;}
  function zoneBody(zid){var dz=$all(".dz",box).filter(function(e){return e.dataset.zone===zid;})[0];return dz?$(".dz-body",dz):null;}
  function moveItem(id,zid){
    var el=itemEl(id);if(!el){return;}
    if(zid===null){bank.appendChild(el);}
    else{var b=zoneBody(zid);if(b){b.appendChild(el);}}
    el.classList.remove("picked");if(picked===id){picked=null;}
  }
  function togglePick(id){
    var el=itemEl(id);if(!el){return;}
    if(picked===id){picked=null;el.classList.remove("picked");return;}
    if(picked){var pe=itemEl(picked);if(pe){pe.classList.remove("picked");}}
    picked=id;el.classList.add("picked");
  }
  shuffle(ex.items).forEach(function(it){
    var el=h("div","ditem","<span class=\"grip\">&#8942;&#8942;</span><span>"+it.html+"</span>");
    el.draggable=true;el.dataset.id=it.id;el.setAttribute("tabindex","0");
    el.setAttribute("role","button");el.setAttribute("aria-label","Move item: "+optText(it.html));
    el.addEventListener("dragstart",function(ev){try{ev.dataTransfer.setData("text/plain",it.id);}catch(e){}el.classList.add("picked");});
    el.addEventListener("dragend",function(){el.classList.remove("picked");});
    el.addEventListener("click",function(ev){ev.stopPropagation();togglePick(it.id);});
    el.addEventListener("keydown",function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();togglePick(it.id);}});
    bank.appendChild(el);
  });
  bank.addEventListener("click",function(ev){if(ev.target===bank&&picked){moveItem(picked,null);}});
  ex.zones.forEach(function(z){
    var dz=h("div","dz");dz.dataset.zone=z.id;dz.setAttribute("tabindex","0");
    dz.appendChild(h("div","dz-h",z.label));
    dz.appendChild(h("div","dz-body"));
    dz.addEventListener("click",function(ev){if(ev.target.closest(".ditem")){return;}if(picked){moveItem(picked,z.id);}});
    dz.addEventListener("keydown",function(ev){if((ev.key==="Enter"||ev.key===" ")&&picked){ev.preventDefault();moveItem(picked,z.id);}});
    dz.addEventListener("dragover",function(ev){ev.preventDefault();dz.classList.add("over");});
    dz.addEventListener("dragleave",function(){dz.classList.remove("over");});
    dz.addEventListener("drop",function(ev){ev.preventDefault();dz.classList.remove("over");var id="";try{id=ev.dataTransfer.getData("text/plain");}catch(e){}if(id){moveItem(id,z.id);}});
    zw.appendChild(dz);
  });
  S.collectFn=function(){
    var m={};
    ex.items.forEach(function(it){var el=itemEl(it.id);var dz=el?el.closest(".dz"):null;m[it.id]=dz?dz.dataset.zone:"";});
    return m;
  };
  S.disableFn=function(){$all(".ditem,.dz",box).forEach(function(e){e.style.pointerEvents="none";e.setAttribute("tabindex","-1");});};
}
function buildMatch(ex,box){
  box.appendChild(h("div","bank-label","For each item on the left, choose the correct match from the list."));
  ex.lefts.forEach(function(l){
    var row=h("div","mrow");
    row.appendChild(h("div","mlab",l.html));
    var sel=document.createElement("select");sel.className="inline";sel.dataset.left=l.id;
    sel.setAttribute("aria-label","Match for: "+optText(l.html));
    sel.appendChild(new Option("&mdash; choose &mdash;",""));
    shuffle(ex.rights).forEach(function(r){var d=h("div","",r.html);sel.appendChild(new Option(d.textContent,r.id));});
    row.appendChild(sel);box.appendChild(row);
  });
  S.collectFn=function(){var m={};$all("select",box).forEach(function(s){m[s.dataset.left]=s.value;});return m;};
  S.disableFn=function(){$all("select",box).forEach(function(s){s.disabled=true;});};
}
function buildFill(ex,box){
  var div=h("div");
  div.innerHTML=String(ex.cloze).replace(/\{\{(\w+)\}\}/g,'<span data-tok="$1"></span>');
  box.appendChild(div);
  $all("[data-tok]",div).forEach(function(sp){
    var tok=sp.getAttribute("data-tok"),b=ex.blanks[tok];
    if(!b){return;}
    if(b.kind==="select"){
      var sel=document.createElement("select");sel.className="inline fblank";sel.dataset.tok=tok;
      sel.setAttribute("aria-label","Blank "+tok);
      sel.appendChild(new Option("&mdash; choose &mdash;",""));
      shuffle(b.choices).forEach(function(c){sel.appendChild(new Option(c,c));});
      sp.parentNode.replaceChild(sel,sp);
    }else{
      var inp=document.createElement("input");
      inp.type="text";inp.className="inline fblank";inp.dataset.tok=tok;inp.autocomplete="off";
      inp.setAttribute("aria-label","Blank "+tok);
      if(b.size){inp.size=Math.min(60,b.size);}else{inp.style.width="180px";}
      sp.parentNode.replaceChild(inp,sp);
    }
  });
  if(ex.bank&&ex.bank.length){
    var bw=h("div","bankw");
    shuffle(ex.bank).forEach(function(w){bw.appendChild(h("span","chipw",w));});
    box.appendChild(bw);
  }
  S.collectFn=function(){
    var m={};
    Object.keys(ex.blanks).forEach(function(tok){
      var el=$all("[data-tok]",box).filter(function(e){return e.getAttribute("data-tok")===tok;})[0];
      m[tok]=el?(el.tagName==="SELECT"?el.value:norm(el.value)):"";
    });
    return m;
  };
  S.disableFn=function(){$all("input,select",box).forEach(function(e){e.disabled=true;});};
}
function buildOrder(ex,box){
  box.appendChild(h("div","bank-label",(ex.mode==="rank"?"Rank the items: the most urgent / most important goes to position 1. Use the arrows.":"Put the steps in the correct order. Use the arrows.")));
  var list=h("div");box.appendChild(list);
  shuffle(ex.steps).forEach(function(st){
    var row=h("div","orow");row.dataset.id=st.id;
    row.appendChild(h("span","onum","&minus;"));
    row.appendChild(h("div","ohtml",st.html));
    var btns=h("div","obtns");
    var up=h("button","obtn","&uarr;");up.type="button";up.setAttribute("aria-label","Move up");
    var dn=h("button","obtn","&darr;");dn.type="button";dn.setAttribute("aria-label","Move down");
    up.addEventListener("click",function(){if(row.previousSibling){list.insertBefore(row,row.previousSibling);renum();}});
    dn.addEventListener("click",function(){if(row.nextSibling){list.insertBefore(row,row.nextSibling.nextSibling);renum();}});
    btns.appendChild(up);btns.appendChild(dn);row.appendChild(btns);
    list.appendChild(row);
  });
  function renum(){$all(".orow",list).forEach(function(r,i){$(".onum",r).textContent=(i+1);});}
  renum();
  S.collectFn=function(){return $all(".orow",list).map(function(r){return r.dataset.id;});};
  S.disableFn=function(){$all("button",box).forEach(function(b){b.disabled=true;});};
}
function buildTerminal(ex,box){
  var term=h("div","term");
  term.appendChild(h("div","term-h","<span class=\"dot\" style=\"background:var(--state-incorrect)\"></span><span class=\"dot\" style=\"background:var(--accent-amber)\"></span><span class=\"dot\" style=\"background:var(--state-correct)\"></span><span style=\"margin-left:8px\">"+(ex.termTitle||"soc-workstation &mdash; bash")+"</span>"));
  var hist=h("div","term-hist");hist.setAttribute("aria-live","polite");
  (ex.motd||[]).forEach(function(l){hist.appendChild(h("div","",l));});
  term.appendChild(hist);
  var inrow=h("div","term-in");
  var pr=h("span","tprompt",(ex.prompt||"analyst@soc:~$")+" ");
  var inp=document.createElement("input");
  inp.type="text";inp.autocomplete="off";inp.spellcheck=false;
  inp.setAttribute("aria-label","Type your command");
  inrow.appendChild(pr);inrow.appendChild(inp);term.appendChild(inrow);
  box.appendChild(term);
  var typed=[];
  inp.addEventListener("keydown",function(ev){
    if(ev.key!=="Enter"){return;}
    var cmd=inp.value;
    if(!cmd.trim()){return;}
    typed.push(cmd);
    hist.appendChild(h("div","", esc((ex.prompt||"analyst@soc:~$"))+" <span class=\"s\">"+esc(cmd)+"</span>"));
    var first=cmd.trim().split(/\s+/)[0].toLowerCase();
    if((ex.known||[]).indexOf(first)===-1){
      hist.appendChild(h("div","c","bash: "+first+": command not found"));
    }
    inp.value="";
    hist.scrollTop=hist.scrollHeight;
  });
  S.collectFn=function(){return typed.join("\n");};
  S.disableFn=function(){inp.disabled=true;};
}
function buildTree(ex,box){
  var stepIdx=0,answers=[];
  function renderStep(){
    box.innerHTML="";
    var st=ex.steps[stepIdx];
    box.appendChild(h("div","step-chip","STEP "+(stepIdx+1)+" OF "+ex.steps.length));
    if(st.addendum){
      box.appendChild(h("div","art addendum","<div class=\"art-h\">UPDATE "+(stepIdx+1)+"</div><div style=\"padding:10px 14px\">"+st.addendum+"</div>"));
    }
    var list=h("div","anslist");
    shuffle(st.options).forEach(function(o,i){
      var lab=h("label","opt");
      var inp=document.createElement("input");inp.type="radio";inp.name="tree_"+stepIdx;inp.value=o.id;
      lab.appendChild(inp);lab.appendChild(h("span","olab",LETTERS[i]+"."));
      lab.appendChild(h("span","ohtml",o.html));lab.appendChild(h("span","sel-tag","&#9679; Selected"));
      inp.addEventListener("change",function(){$all(".opt",list).forEach(function(x){x.classList.remove("sel");});lab.classList.add("sel");});
      list.appendChild(lab);
    });
    box.appendChild(list);
    var btn=h("button","btn "+(stepIdx===ex.steps.length-1?"primary":"blue"));
    btn.type="button";
    btn.innerHTML=stepIdx===ex.steps.length-1?"&#10003; Check &mdash; submit all steps":"Confirm step "+(stepIdx+1)+" &middot; &#9654;";
    btn.addEventListener("click",function(){
      var sel=$all("input:checked",list).map(function(x){return x.value;});
      if(sel.length!==1){var w=$(".dangerbanner",box);if(!w){box.insertBefore(h("div","dangerbanner","&#9888; Choose one option before confirming this step."),list);}return;}
      answers.push(sel[0]);
      if(stepIdx===ex.steps.length-1){S.collectFn=function(){return answers.slice();};checkCurrent(false);}
      else{stepIdx++;renderStep();}
    });
    box.appendChild(btn);
  }
  renderStep();
  S.collectFn=function(){return answers.slice();};
  S.disableFn=function(){$all("input,button",box).forEach(function(e){e.disabled=true;});};
}
function autoCheck(){checkCurrent(true);}

/* ================= grading ================= */
function gradeEx(ex,ans){
  var g={credit0:0,items:[],answerHtml:"",danger:null,N:1,auto:false};
  var H=0,W=0,i,optBy={},stepBy={},rightBy={},zn={},itemBy={};
  if(ex.type==="qcm"){
    ex.options.forEach(function(o){optBy[o.id]=o;});
    var sel=ans[0]||null,corr=ex.correct[0],ok=sel===corr;
    g.credit0=ok?1:0;g.N=1;
    g.answerHtml=optBy[corr].html;
    if(ok){
      g.items.push({label:optBy[corr].html,state:"ok",why:(ex.optWhy&&ex.optWhy[corr])||""});
    }else{
      g.items.push({label:sel?optBy[sel].html:"(no answer given)",state:"wrong",
        why:sel?((ex.optWhy&&ex.optWhy[sel])||""):"Choose the correct option next time."});
      g.items.push({label:optBy[corr].html,state:"missed",why:"This was the correct option."});
    }
  }else if(ex.type==="multi"){
    ex.options.forEach(function(o){optBy[o.id]=o;});
    var selset={};ans.forEach(function(a){selset[a]=1;});
    ex.correct.forEach(function(cid){g.items.push({label:optBy[cid].html,state:selset[cid]?"ok":"missed",why:(ex.whys&&ex.whys[cid])||""});});
    ans.forEach(function(sid){if(ex.correct.indexOf(sid)===-1){g.items.push({label:optBy[sid].html,state:"wrong",why:(ex.whys&&ex.whys[sid])||"Not part of the correct answer."});}});
    g.credit0=scoreExercise(ans,ex.correct);g.N=ex.correct.length;
    g.answerHtml=ex.correct.map(function(cid){return optBy[cid].html;}).join(" <strong>&middot;</strong> ");
  }else if(ex.type==="dnd"){
    ex.items.forEach(function(it){itemBy[it.id]=it;});
    ex.zones.forEach(function(z){zn[z.id]=z;});
    ex.items.forEach(function(it){
      var placed=ans[it.id]||"";
      if(placed===it.zone){H++;g.items.push({label:it.html+" &rarr; "+zn[it.zone].label,state:"ok",why:it.why||""});}
      else if(!placed){g.items.push({label:it.html,state:"missed",why:"You did not place this item. Correct zone: "+zn[it.zone].label+". "+(it.why||"")});}
      else{W++;g.items.push({label:it.html+" &rarr; "+zn[placed].label,state:"wrong",why:"Correct zone: "+zn[it.zone].label+". "+(it.why||"")});}
    });
    g.credit0=scoreHW(H,W,ex.items.length);g.N=ex.items.length;
    g.answerHtml=ex.items.map(function(it){return it.html+" &rarr; <strong>"+zn[it.zone].label+"</strong>";}).join("<br>");
  }else if(ex.type==="match"){
    ex.rights.forEach(function(r){rightBy[r.id]=r;});
    ex.lefts.forEach(function(l){
      var v=ans[l.id]||"",want=ex.pairs[l.id];
      if(v===want){H++;g.items.push({label:l.html+" &rarr; "+rightBy[want].html,state:"ok",why:(ex.whys&&ex.whys[l.id])||""});}
      else if(!v){g.items.push({label:l.html,state:"missed",why:"You left this unmatched. Correct match: "+rightBy[want].html+". "+((ex.whys&&ex.whys[l.id])||"")});}
      else{W++;g.items.push({label:l.html+" &rarr; "+rightBy[v].html,state:"wrong",why:"Correct match: "+rightBy[want].html+". "+((ex.whys&&ex.whys[l.id])||"")});}
    });
    g.credit0=scoreHW(H,W,ex.lefts.length);g.N=ex.lefts.length;
    g.answerHtml=ex.lefts.map(function(l){return l.html+" &rarr; <strong>"+rightBy[ex.pairs[l.id]].html+"</strong>";}).join("<br>");
  }else if(ex.type==="fill"){
    Object.keys(ex.blanks).forEach(function(tok){
      var b=ex.blanks[tok],vRaw=ans[tok]||"",v=norm(vRaw);
      var acc=(b.accept||[]).map(norm);
      var label=(b.label||tok);
      if(!vRaw){g.items.push({label:"Blank &ldquo;"+label+"&rdquo;",state:"missed",why:"You left this blank empty. Accepted: "+b.accept.join(" / ")+". "+(b.why||"")});}
      else if(acc.indexOf(v)>-1){H++;g.items.push({label:"Blank &ldquo;"+label+"&rdquo; = "+esc(vRaw),state:"ok",why:b.why||""});}
      else{W++;g.items.push({label:"Blank &ldquo;"+label+"&rdquo; = "+esc(vRaw),state:"wrong",why:"Accepted: "+b.accept.join(" / ")+". "+(b.why||"")});}
    });
    g.credit0=scoreHW(H,W,Object.keys(ex.blanks).length);g.N=Object.keys(ex.blanks).length;
    g.answerHtml=Object.keys(ex.blanks).map(function(tok){return "<strong>"+(ex.blanks[tok].label||tok)+"</strong> = "+ex.blanks[tok].accept.join(" / ");}).join("<br>");
  }else if(ex.type==="order"){
    ex.steps.forEach(function(st){stepBy[st.id]=st;});
    for(i=0;i<ex.steps.length;i++){
      var got=ans[i],want=ex.correctOrder[i];
      if(got===want){H++;g.items.push({label:"Position "+(i+1)+": "+stepBy[got].html,state:"ok",why:(ex.whys&&ex.whys[got])||""});}
      else{W++;g.items.push({label:"Position "+(i+1)+": "+(got?stepBy[got].html:"(empty)"),state:"wrong",why:"Correct position "+(i+1)+": "+stepBy[want].html+". "+((ex.whys&&ex.whys[want])||"")});}
    }
    g.credit0=scoreHW(H,W,ex.steps.length);g.N=ex.steps.length;
    g.answerHtml=ex.correctOrder.map(function(id,k){return "<strong>"+(k+1)+".</strong> "+stepBy[id].html;}).join("<br>");
  }else if(ex.type==="terminal"){
    var blob=Array.isArray(ans)?ans.join("\n"):String(ans||"");
    (ex.checks||[]).forEach(function(c){
      var re=new RegExp(c.re,"i");
      var pass=c.negative?!re.test(blob):re.test(blob);
      if(pass){H++;g.items.push({label:c.label,state:"ok",why:c.why||""});}
      else{g.items.push({label:c.label,state:"missed",why:(c.why||"")+" Missing from your command."});}
    });
    if(ex.danger&&ex.danger.re&&new RegExp(ex.danger.re,"i").test(blob)){g.danger={why:ex.danger.why};}
    if(g.danger){H=0;} /* a dangerous near-miss command forfeits all credit */
    g.credit0=scoreHW(H,0,(ex.checks||[]).length);g.N=(ex.checks||[]).length;
    g.answerHtml="";
  }else if(ex.type==="tree"){
    ex.steps.forEach(function(st){stepBy[st.id]=st;});
    for(i=0;i<ex.steps.length;i++){
      var st=ex.steps[i],got=ans[i],want=st.correct[0];
      var gotHtml="",optBy2={};
      st.options.forEach(function(o){optBy2[o.id]=o;});
      gotHtml=got?optBy2[got].html:"(no answer)";
      if(got===want){H++;g.items.push({label:"<strong>Step "+(i+1)+":</strong> "+gotHtml,state:"ok",why:st.why||""});}
      else{W++;g.items.push({label:"<strong>Step "+(i+1)+":</strong> "+gotHtml,state:"wrong",why:"Correct: "+optBy2[want].html+" — "+(st.why||"")});}
    }
    g.credit0=scoreHW(H,W,ex.steps.length);g.N=ex.steps.length;
    g.answerHtml=ex.steps.map(function(st,k){var o2={};st.options.forEach(function(o){o2[o.id]=o;});return "<strong>Step "+(k+1)+":</strong> "+o2[st.correct[0]].html;}).join("<br>");
  }
  return g;
}

/* ================= check / feedback ================= */
function checkCurrent(auto){
  if(S.checked||!S.cur||S.phase!=="exam"){return;}
  var ex=S.cur,ans=S.collectFn?S.collectFn():[];
  S.checked=true;
  /* FIRST ACTION: stop the timer for unlimited feedback review */
  if(S.timer===T_RUN){S.timer=T_AUTO;S.resumeTo=T_RUN;}
  updateTimerUI();
  var g=gradeEx(ex,ans);
  g.auto=!!auto;
  var credit=g.credit0;
  if(S.hinted[ex.id]){credit=Math.max(0,credit-0.10);}
  S.answered[ex.id]=credit;
  S.breakdown[ex.id]={credit:credit};
  if(S.disableFn){S.disableFn();}
  S.collectFn=null;
  $("#bHint").disabled=true;$("#bSkip").disabled=true;
  renderFeedback(ex,g,credit);
  updateScoreChip();updateProgress();
  var nav=$("#navRow");nav.innerHTML="";
  var last=(S.idx===S.order.length-1),pool=skippedPool();
  if(!last){
    var b=h("button","btn blue","Next &#9654;");b.type="button";b.addEventListener("click",advance);nav.appendChild(b);
  }else if(pool.length>0){
    var b2=h("button","btn blue","Review skipped exercises ("+pool.length+") &#9654;");b2.type="button";b2.addEventListener("click",showReview);nav.appendChild(b2);
  }else{
    var b3=h("button","btn primary","Final Submit &#9632;");b3.type="button";b3.addEventListener("click",function(){finishExam(false);});nav.appendChild(b3);
  }
}
function renderFeedback(ex,g,credit){
  var fb=$("#fbSlot");fb.hidden=false;fb.innerHTML="";
  var okN=0,wrongN=0,i;
  for(i=0;i<g.items.length;i++){if(g.items[i].state==="ok"){okN++;}else if(g.items[i].state==="wrong"){wrongN++;}}
  var cls,head;
  if(credit>=0.999){cls="st-ok";head="&#10003; CORRECT";}
  else if(credit<=0.001){cls="st-bad";head="&#10007; INCORRECT";}
  else{cls="st-part";head="&#10003; PARTIALLY CORRECT";}
  fb.appendChild(h("div","fb-h "+cls,head+(g.N>1?" &mdash; credit "+credit.toFixed(2)+" ("+okN+"/"+g.N+" items)":"")));
  if(g.auto){fb.appendChild(h("div","credline","&#9201; The time limit for this exercise ran out &mdash; your answer was submitted automatically."));}
  fb.appendChild(h("div","credline","exercise credit: "+credit.toFixed(2)+(S.hinted[ex.id]?" &middot; includes &minus;0.10 hint penalty":"")+(g.danger?" &middot; dangerous commands score 0":"")+(g.N>1?" &middot; scored as (H &minus; W) / N = ("+okN+" &minus; "+wrongN+") / "+g.N:"")));
  if(g.danger){fb.appendChild(h("div","dangerbanner","&#10007; DANGEROUS &mdash; NEAR MISS: "+g.danger.why));}
  if(g.answerHtml){fb.appendChild(h("div","","<p><strong>Correct answer:</strong> "+g.answerHtml+"</p>"));}
  if(g.items.length){
    var ul=h("ul","items");
    g.items.forEach(function(it){
      var li=h("li","item it-"+it.state);
      var ic=it.state==="ok"?"&#10003; Correct":(it.state==="wrong"?"&#10007; Wrong":"&#9675; Missed");
      li.appendChild(h("span","it-ic",ic));
      li.appendChild(h("span","it-lab","<span>"+it.label+"</span>"+(it.why?" <span class=\"it-why\">&mdash; "+it.why+"</span>":"")));
      ul.appendChild(li);
    });
    fb.appendChild(ul);
  }
  if(ex.type==="terminal"){
    var c=h("div","canon");
    c.appendChild(h("div","bank-label","Canonical command (select to copy):"));
    c.appendChild(h("pre","",ex.canonical||""));
    if(ex.canonicalParts&&ex.canonicalParts.length){
      var pl="<ul class=\"rules\">";
      ex.canonicalParts.forEach(function(p){pl+="<li>"+p+"</li>";});
      c.appendChild(h("div","cp",pl+"</ul>"));
    }
    fb.appendChild(c);
  }
  fb.appendChild(h("div","fb-expl",ex.explanation));
  var red=false;try{red=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
  try{fb.scrollIntoView({block:"nearest",behavior:red?"auto":"smooth"});}catch(e){}
}

/* ================= hint / skip / advance / review ================= */
function hintCurrent(){
  if(!S.cur||S.checked||S.hinted[S.cur.id]){return;}
  S.hinted[S.cur.id]=1;
  var slot=$("#hintSlot");slot.innerHTML="";
  slot.appendChild(h("div","hintbox","<div class=\"h-h\">&#9878; HINT &mdash; using it costs &minus;10% of this exercise's credit</div>"+(S.cur.hint||"No hint available.")));
  $("#bHint").disabled=true;
}
function skipCurrent(){
  if(!S.cur||S.checked){return;}
  S.skipped[S.cur.id]=1;
  advance();
}
function advance(){
  if(S.timer===T_AUTO){S.timer=T_RUN;S.resumeTo=T_RUN;updateTimerUI();}
  var i=S.idx+1;
  while(i<S.order.length&&S.answered[S.order[i]]){i++;}
  if(i<S.order.length){S.idx=i;showExercise();}
  else{showReview();}
}
function skippedPool(){
  return S.order.filter(function(id){return S.skipped[id]&&!S.answered.hasOwnProperty(id);});
}
function showReview(){
  S.phase="review";
  /* leaving feedback for the review screen ends the free auto-pause: the clock runs again */
  if(S.timer===T_AUTO){S.timer=T_RUN;S.resumeTo=T_RUN;}
  updateTimerUI();
  $("#vExam").hidden=true;$("#vResults").hidden=true;
  var v=$("#vReview");v.hidden=false;v.innerHTML="";
  var card=h("div","card");
  card.appendChild(h("h2","i-title","&#9888; Review skipped exercises"));
  card.appendChild(h("p","i-sub","These exercises were skipped without an answer. You can return to each one as often as you need while the timer is still running. Anything left unanswered is excluded from the score."));
  var pool=skippedPool();
  if(pool.length===0){
    card.appendChild(h("p","","<strong>&#10003; Nothing skipped.</strong> You answered every exercise in this exam. Submit when you are ready."));
  }
  pool.forEach(function(id){
    var ex=exById(id);
    var row=h("div","rev-row");
    row.appendChild(h("span","r-ic","&#9888; Skipped"));
    row.appendChild(h("div","r-t","<strong>"+id+"</strong> &mdash; "+(ex.summary||"")));
    row.appendChild(h("span","r-c",(ex.concept||"")));
    var b=h("button","btn blue","Answer");b.type="button";
    b.addEventListener("click",function(){jumpTo(id);});
    row.appendChild(b);
    card.appendChild(row);
  });
  var nav=h("div","navrow");
  var sub=h("button","btn primary","Final Submit &#9632;");sub.type="button";
  sub.addEventListener("click",function(){finishExam(false);});
  nav.appendChild(sub);
  nav.appendChild(h("span","note","Final score counts only the exercises you actually answered."));
  card.appendChild(nav);
  v.appendChild(card);
  $("#bHint").hidden=true;$("#bSkip").hidden=true;$("#bPause").hidden=false;
  $("#hCount").textContent="Review &middot; "+pool.length+" skipped";
}
function jumpTo(id){
  S.phase="exam";
  $("#vReview").hidden=true;$("#vExam").hidden=false;
  S.idx=S.order.indexOf(id);
  showExercise();
}

/* ================= results & report ================= */
function finishExam(byTimeout){
  if(S.timer!==T_END){S.timer=T_END;updateTimerUI();}
  if(S.cur&&!S.checked&&S.phase==="exam"){S.skipped[S.cur.id]=1;}
  S.phase="results";
  $("#vExam").hidden=true;$("#vReview").hidden=true;$("#pauseCover").hidden=true;
  $("#bHint").hidden=true;$("#bSkip").hidden=true;$("#bPause").hidden=true;
  var v=$("#vResults");v.hidden=false;v.innerHTML="";
  renderResults(v,byTimeout);
  reportScore();
}
function renderResults(v,byTimeout){
  var full=0,part=0,bad=0,skip=0,sum=0,ans=0,partSum=0;
  S.order.forEach(function(id){
    if(S.answered.hasOwnProperty(id)){
      var c=S.answered[id];ans++;sum+=c;
      if(c>=0.999){full++;}else if(c<=0.001){bad++;}else{part++;partSum+=c;}
    }else{skip++;}
  });
  var rounded=Math.round(sum); /* one rounding, at reporting time */
  var percent=ans>0?Math.round(rounded/ans*100):0;
  var passed=ans>0&&percent>=META.passMark;
  var head=h("div","res-head "+(passed?"pass":"fail"));
  head.appendChild(h("div","rh-big",passed?"&#10003; PASS":"&#10007; FAIL"));
  head.appendChild(h("div","rh-pct",percent+"%"));
  head.appendChild(h("div","i-sub","Final score: <strong>"+(Math.round(sum*10)/10).toFixed(1)+"</strong> over <strong>"+ans+"</strong> answered exercise(s) &middot; pass mark "+META.passMark+"% &middot; "+(passed?"Certification exam passed. Well done.":"You must retake this exam.")));
  if(byTimeout){head.appendChild(h("div","credline","&#9201; Time ran out &mdash; the exam was submitted automatically."));}
  v.appendChild(head);
  var avgP=part>0?(partSum/part).toFixed(2):"&mdash;";
  var stats=h("div","stats");
  function stat(cls,icon,vv,lb){var s=h("div","stat "+cls);s.appendChild(h("div","st-v",icon+" "+vv));s.appendChild(h("div","st-l",lb));stats.appendChild(s);}
  stat("c-ok","&#10003;",full,"Fully correct");
  stat("c-part","&#10003;",part+(part>0?" (avg "+avgP+")":""),"Partially correct");
  stat("c-bad","&#10007;",bad,"Fully incorrect");
  stat("c-skip","&#9888;",skip,"Skipped &mdash; excluded from score");
  stat("c-pause","&#9208;",fmtMin(S.manualMs)+" min","Time paused manually");
  stat("c-pause","&#9208;",fmtMin(S.autoMs)+" min","Time spent reviewing feedback");
  v.appendChild(stats);
  var tbl=h("table","res-table");
  var thead=h("thead");var tr=h("tr");
  ["#","Exercise","Concept","Credit","Result"].forEach(function(t){tr.appendChild(h("th","",t));});
  thead.appendChild(tr);tbl.appendChild(thead);
  var tb=h("tbody");
  S.order.forEach(function(id,i){
    var ex=exById(id);var trr=h("tr");
    trr.appendChild(h("td","",(i+1)));
    trr.appendChild(h("td","",id+" &mdash; "+(ex.summary||"")));
    trr.appendChild(h("td","",(ex.concept||"")));
    if(S.answered.hasOwnProperty(id)){
      var c=S.answered[id];
      trr.appendChild(h("td","",c.toFixed(2)));
      var lab,cls;
      if(c>=0.999){lab="&#10003; Correct";cls="ok";}
      else if(c<=0.001){lab="&#10007; Incorrect";cls="bad";}
      else{lab="&#10003; Partially correct ("+c.toFixed(2)+")";cls="part";}
      if(S.hinted[id]){lab+=" <span class=\"chipw\">hint</span>";}
      trr.appendChild(h("td","","<span class=\"st-lbl "+cls+"\">"+lab+"</span>"));
    }else{
      trr.appendChild(h("td","","&mdash;"));
      trr.appendChild(h("td","","<span class=\"st-lbl skip\">&#9888; Not answered &mdash; excluded</span>"));
    }
    tb.appendChild(trr);
  });
  tbl.appendChild(tb);v.appendChild(tbl);
  var nav=h("div","navrow");
  var rt=h("button","btn primary","&#8635; Retake Exam");rt.type="button";rt.addEventListener("click",retake);
  nav.appendChild(rt);
  nav.appendChild(h("span","note","Retaking shuffles the exercise order and the answer choices again."));
  v.appendChild(nav);
}
function reportScore(){
  if(S.reported){return;}
  var sum=0,count=0,k;
  for(k in S.answered){if(S.answered.hasOwnProperty(k)){sum+=S.answered[k];count++;}}
  var rounded=Math.round(sum); /* rounds only at the moment of posting */
  var percent=count>0?Math.round(rounded/count*100):0;
  S.reported=true;
  try{
    parent.postMessage({type:"CYBERPULSE_SCORE",topicId:META.topicId,batch:META.batch,
      score:rounded,total:count,percent:percent,passed:percent>=META.passMark},location.origin);
  }catch(e){/* opened directly - nothing to report to */}
}
window.addEventListener("message",function(event){
  var d=event.data;
  if(!d){return;}
  if(d.type!=="CYBERPULSE_INIT"&&d.type!=="CYBERMASTERY_INIT"){return;}
  if(d.username){S.user=String(d.username);var c=$("#hUser");c.hidden=false;c.textContent="user: "+S.user;var iu=$("#iUser");if(iu){iu.textContent=S.user;}}
  if(d.country){S.country=d.country;}
  /* theme field is always 'dark' - the file is dark-only by contract, nothing to switch */
});

/* ================= boot ================= */
function boot(){
  renderIntro();
  hdrShow(false);
  $("#bPause").addEventListener("click",function(){
    if(!S.started||S.phase==="results"||S.timer===T_END||S.timer===T_MAN){return;}
    setState(T_MAN);
    $("#pauseCover").hidden=false;
  });
  $("#bResume").addEventListener("click",function(){
    $("#pauseCover").hidden=true;
    S.timer=S.resumeTo||T_RUN;
    updateTimerUI();
  });
  $("#bHint").addEventListener("click",hintCurrent);
  $("#bSkip").addEventListener("click",skipCurrent);
}
boot();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
