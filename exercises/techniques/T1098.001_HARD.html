<script>
"use strict";
const META={objId:"T1098.001",objName:"Account Manipulation: Additional Cloud Credentials",objType:"Sub-Technique",sevWord:"HARD",sevClass:"hard",topicId:"t1098.001",batch:3,passMark:70,difficulty:"hard",estMinutes:45,budgetSeconds:3600,attackPath:"attack.mitre.org/techniques/T1098/001/",docTitle:"T1098.001 \u2014 HARD practice exam"};
const EXAM_INTRO = {
  learn: "<p>Welcome to the HARD batch. This exam drills one precise attacker behaviour: <strong>adding extra cloud credentials</strong> to accounts, apps and service principals the attacker does not own. In MITRE ATT&amp;CK it is the sub-technique <strong>T1098.001 — Account Manipulation: Additional Cloud Credentials</strong>. A sub-technique is a narrow behaviour under a broader technique — here T1098, Account Manipulation — so defenders can write one exact detection instead of chasing a vague family of actions.</p><p>Why add a credential instead of reusing a stolen password? Because passwords get reset and sessions expire. A new access key, console password, SSH key or app secret is a door key of the attacker's own: it keeps working after the original password is changed, and app or federation credentials often skip MFA entirely. That is why this behaviour sits under the Persistence and Privilege Escalation tactics, and why it is one of the most common ways attackers stay inside cloud estates.</p><p>You will practise from five real work seats. As a SOC analyst you will correlate CloudTrail, Entra ID and GCP audit events with change tickets and decide whether a new key is expected automation or an intruder. As an incident responder you will choose containment that stops the attacker without destroying the evidence you still need. As a detection engineer you will tune the DET0531 analytics (AN1469, AN1470, AN1471) so real pipelines stop burying real alerts. As a CTI analyst you will connect real cases — SolarWinds (APT29), Scattered Spider, Storm-0501 — to this technique. As a red teamer emulating APT29 or Scattered Spider you will see why a quietly added credential is their favourite cloud persistence.</p><p>The 16 exercises ahead are deliberately tricky: artefacts argue with each other, the obvious answer is sometimes wrong, and the aggressive option is sometimes the trap. Read every artefact, defend every choice, and work like it is a real shift — the stakeholder wants a verdict before the 09:00 standup.</p>",
  keywords: [
    { theme: "Correlating Cloud Evidence", items: ["CloudTrail CreateAccessKey and CreateLoginProfile events", "Entra ID audit: Certificates and secrets management", "change tickets, windows and approval records", "userIdentity, sourceIPAddress and user-agent baselines", "follow-up on a new accessKeyId after creation", "correlating logs, tickets and timelines into a verdict"] },
    { theme: "Real Adversary Operations", items: ["C0027 — Scattered Spider: aws_consoler and fake federated users", "C0024 — SolarWinds: APT29 credentials on OAuth apps and service principals", "S1091 Pacu: SSH and API key generation", "G1053 Storm-0501: admin password resets and MFA registration", "sts:GetFederationToken: temporary credentials that outlive deactivation", "secret on a privileged service principal = privilege escalation"] },
    { theme: "Response Decisions", items: ["least-aggressive containment under business pressure", "disable the added key, not the whole identity", "preserve logs before revoking credentials", "hunting every use of a leaked accessKeyId", "defensible verdicts before the morning standup"] },
    { theme: "Detection Engineering &amp; Tuning", items: ["DET0531 — Additional Cloud Credentials in IaaS, IdP and SaaS", "AN1469 — additions by non-standard identities or IP ranges", "AN1470 — key and profile APIs from unusual principals", "AN1471 — productivity-app credential changes", "jq triage of JSON event captures", "allow-listing documented automation without blinding the analytic"] },
    { theme: "Control Trade-offs", items: ["SCP denying iam:CreateAccessKey outside admin roles", "disabling Entra ID app passwords (M1042)", "PIM just-in-time elevation vs standing privilege", "M1032 MFA on key-creation APIs", "why network segmentation does not stop control-plane API abuse"] }

const EXAM_EXERCISES = [
  {
    id: "H01", type: "multi", concept: "Correlating Cloud Evidence", perspective: "defender",
    summary: "02:14 key creation for svc-etl vs change ticket CHG-88412",
    scenario: "<p>On-call handover, 06:40 UTC. One alert survived the night queue, and the floor lead wants a defensible read before standup.</p><div class='art log'><div class='art-h'>ARTEFACT 1 — AWS CloudTrail (filterable)</div><pre><span class='log-line'>{<span class='k'>\"eventTime\"</span>:<span class='t'>\"2026-03-04T02:14:07Z\"</span>,<span class='k'>\"eventName\"</span>:<span class='s'>\"CreateAccessKey\"</span>,<span class='k'>\"userIdentity\"</span>:{<span class='k'>\"type\"</span>:<span class='s'>\"AssumedRole\"</span>,<span class='k'>\"arn\"</span>:<span class='i'>\"arn:aws:sts::123456789012:assumed-role/quarterly-key-rotation/i-0a41c9\"</span>},<span class='k'>\"sourceIPAddress\"</span>:<span class='i'>\"198[.]51[.]100[.]23\"</span>,<span class='k'>\"userAgent\"</span>:<span class='s'>\"Boto3/1.34.120\"</span>,<span class='k'>\"requestParameters\"</span>:{<span class='k'>\"userName\"</span>:<span class='s'>\"svc-etl\"</span>},<span class='k'>\"responseElements\"</span>:{<span class='k'>\"accessKey\"</span>:{<span class='k'>\"accessKeyId\"</span>:<span class='s'>\"AKIAQ2XK7V4TEXAMPLE\"</span>,<span class='k'>\"status\"</span>:<span class='s'>\"Active\"</span>}}}</span></pre></div><div class='art'><div class='art-h'>ARTEFACT 2 — change record</div><pre><span class='log-line'><span class='k'>CHG-88412</span> — <span class='s'>\"Quarterly access-key rotation, svc-etl\"</span></span><span class='log-line'>window <span class='t'>2026-03-04 02:00-03:00 UTC</span> · owner: data-platform on-call · <span class='ok'>approved</span></span></pre></div><div class='art'><div class='art-h'>ARTEFACT 3 — timeline (as of 06:40)</div><pre><span class='log-line'><span class='t'>02:14Z</span> key <span class='s'>AKIAQ2XK7V4TEXAMPLE</span> created</span><span class='log-line'><span class='t'>06:40Z</span> <span class='ok'>no use of the new key recorded in any log source</span></span></pre></div>",
    question: "Select ALL statements you can defend from the artefacts.",
    hint: "One wrong path: the confirmed-intrusion verdict. The caller, the window and the ticket agree with each other — ask what is still unverified.",
    explanation: "<p>The defensible reading holds two truths at once. The create matches documented automation — caller role, execution window and ticket all agree — and it is still unverified, because nothing yet shows whether the new key was used. That second truth is why the usage check belongs in the answer: hijacked rotation pipelines are a real pattern, and a ticket is exactly what a careful abuser would wear as camouflage. The other options fail here, not everywhere: an intrusion verdict contradicts the record you hold; halting the settlement pipeline punishes the business for a documented change; and closing with no follow-up throws away the only check that could still surprise you. </p><p class='study'><strong>Study:</strong> a correlation verdict is two-sided — does the evidence explain the event, and what would the evidence still need to show before you stand down?</p>",

  {
    id: "H02", type: "qcm", concept: "Correlating Cloud Evidence", perspective: "defender",
    summary: "After-hours secret change on HR Portal — alarm or ticketed rotation?",
    scenario: "<p>The platform alert fired at 22:44 on a watchlisted application, and the CISO's office is already asking. Two artefacts, thirty seconds.</p><div class='art'><div class='art-h'>ARTEFACT 1 — Entra ID audit log (2026-02-17 22:40 UTC)</div><pre><span class='log-line'>activity: <span class='s'>\"Update application — Certificates and secrets management\"</span></span><span class='log-line'>target: app <span class='s'>HR Portal Self-Service</span> (appId <span class='i'>4c2e9d31-77aa-4c1e-9b0d-2f6a58c41d02</span>) — new secret added</span><span class='log-line'>actor: <span class='i'>g.okonkwo@arrowsmith.example</span> · <span class='k'>app owner</span> · MFA satisfied · corp VPN <span class='i'>198[.]51[.]100[.]77</span></span></pre></div><div class='art'><div class='art-h'>ARTEFACT 2 — change record</div><pre><span class='log-line'><span class='k'>CHG-90117</span> — <span class='s'>\"HR Portal secret rotation, Q1\"</span> · window <span class='t'>2026-02-17 22:00-23:00 UTC</span></span><span class='log-line'>approver: IAM platform team · implementer: g.okonkwo · <span class='ok'>executed inside the window</span></span></pre></div>",
    question: "What is the most defensible verdict?",
    hint: "One wrong path: treating the clock as the anomaly. The record itself explains the hour.",
    explanation: "<p>The record is self-consistent: the app owner executed a ticketed rotation inside its approved window, from the corporate VPN, with MFA — the alert fired because the hour was late, and late hours are what maintenance windows are for. This is the looks-alarming-is-benign trap the HARD band warns about. Declaring an incident here spends the CISO's attention on a change record; escalating to a tenant-wide hunt answers a question the artefacts already answered; and tuning the app out of the analytic permanently blinds coverage on a watchlisted asset — the opposite of what AN1469 wants, which is alerting on <em>unexpected</em> identities, not deleting the alert. Verify CHG-90117's approval chain, note the window match, close. </p><p class='study'><strong>Study:</strong> alarming-looking credential changes collapse quickly when owner, ticket, window and source all agree — check those four before escalating.</p>",
    options: [
      { id: "a", html: "Ticketed owner rotation executed inside the approved window — verify CHG-90117 and close as expected." },
      { id: "b", html: "Declare an incident and revoke the new secret: a watchlisted app changed after hours." },
      { id: "c", html: "Escalate to CTI to hunt APT29-style OAuth persistence across the whole tenant." },
      { id: "d", html: "Tune the analytic to ignore this app so the alert never fires again." }

    correct: ["a"],
    optWhy: {
      b: "After hours is only alarming when nothing explains it. Owner, MFA, source, window and ticket all align — an incident here burns trust and time.",
      c: "Defensible when a change is unexplained or the actor unknown. Here the record answers the first question any hunt would ask.",
      d: "Never silence a watchlisted app's credential alerts. Tuning narrows identities and sources; it does not delete coverage."

  {
    id: "H03", type: "tree", concept: "Real Adversary Operations", perspective: "dual",
    summary: "New certificate on the Health Sync app owned by an offboarded admin",
    scenario: "<p>Triage escalation, Tuesday 07:20. The IAM team punted this to you: a certificate credential appeared on an app nobody remembers owning, and the actor's name is on the offboarding list.</p><div class='art'><div class='art-h'>ARTEFACT 1 — Entra ID audit log (2026-01-09 03:12 UTC)</div><pre><span class='log-line'>activity: <span class='s'>\"Update application — Certificates and secrets management\"</span></span><span class='log-line'>target: app <span class='s'>Health Sync</span> (appId <span class='i'>8f2d1c44-3a91-4e6b-9c22-7f5a10d3e8b1</span>)</span><span class='log-line'>change: new <span class='bad'>asymmetric key credential</span> added (keyId 7b1e44a0)</span><span class='log-line'>actor: <span class='i'>dana.kovacs@northbridge.example</span> · MFA satisfied</span></pre></div><div class='art'><div class='art-h'>ARTEFACT 2 — Health Sync app registration</div><pre><span class='log-line'>permissions: <span class='k'>Directory.Read.All</span> (application, admin-consented <span class='t'>2024-06-12</span>)</span><span class='log-line'>owner: dana.kovacs — <span class='bad'>offboarded 2025-11-28</span></span><span class='log-line'>conditional access: <span class='c'>none applies to app-only tokens</span></span></pre></div>",
    question: "Answer each step; each Confirm reveals the next artefact, and the final Check grades all three.",
    hint: "One wrong path: reading this as a broken user account. One object here was changed, and it is not a user.",
    explanation: "<p><strong>Attacker view:</strong> an app credential is near-perfect cloud persistence. It is not tied to a person, so offboarding, password resets and MFA re-enrolment never touch it; app-only tokens bypass user MFA and conditional access entirely; and it can read the directory quietly at chosen hours. This is the C0024 pattern — APT29 added credentials to OAuth applications and service principals to survive inside Azure AD after the implant was gone. <strong>Defender view:</strong> the detection anchor is the audit operation 'Update application — Certificates and secrets management' acting from an unexpected identity, and the control anchor is ownership hygiene — every app needs a current owner and a periodic consent review. The surgical response removes the added credential object and reviews the app's roles and consent history; deleting the app destroys evidence and may break a legitimate integration, and chasing the offboarded user's account fixes an object the attacker no longer needs. </p><p class='study'><strong>Study:</strong> re-read the C0024 procedure example and the AN1469 logic on the T1098.001 page — both treat the unexpected credential-writer as the signal, not the credential itself.</p>",
    steps: [
      {
        title: "What was achieved",
        addendum: "<p>Offboarding review: dana.kovacs's account was disabled on 2025-11-28. The 2026-01-09 change was made with a still-valid session token from before her offboarding — and the new certificate does not depend on that session at all. It stays valid on its own until someone removes it.</p>",
        question: "What has the actor achieved at this point?",
        options: [
          { id: "a", html: "Nothing yet — a certificate on an app is only a configuration change." },

          { id: "d", html: "Reconnaissance only — the app cannot read anything yet." }

        correct: ["b"],
        why: "A credential added to the app outlives the session that created it — durable persistence, not a harmless config edit. The actor already had access; this change keeps it."
      },
      {
        title: "What the credential gives",
        addendum: "<p>Sign-in logs: app-only tokens for Health Sync have read directory objects daily between 03:00 and 04:00 UTC since 2026-01-10. dana.kovacs's user account is blocked and shows no sign-ins since offboarding.</p>",
        question: "What does the added credential actually give the actor?",
        options: [
          { id: "a", html: "Dana's interactive rights, including her MFA prompt and role assignments." },
          { id: "b", html: "Tenant-wide Global Administrator rights, because the actor controls the app." },

        addendum: "<p>Consent and role history: Directory.Read.All was consented by a Global Administrator in June 2024 and never changed. No other app or service principal was modified in the surrounding window.</p>",

        options: [

          { id: "b", html: "Remove the added certificate credential, review the app's roles and consent history, and audit what it read." },
          { id: "c", html: "Reset dana.kovacs's password and disable her account — she is the risk." },
          { id: "d", html: "Leave it in place — Directory.Read.All is read-only, so there is no real impact." }
        ],
        correct: ["b"],

  },
  {
    id: "H04", type: "fill", concept: "Detection Engineering &amp; Tuning", perspective: "defender",
    summary: "Harden AN1470: fill the exclusions so CI noise stops",
    scenario: "<p>The AN1470 draft fires on every documented pipeline — 52 alerts last week, 14 of them pure rotation noise. You have one shift to harden it without blinding it.</p><div class='art'><div class='art-h'>ARTEFACT 1 — last week's noise (all ticketed)</div><pre><span class='log-line'><span class='t'>04-02</span> caller=<span class='i'>role/ci-deploy</span> event=<span class='s'>CreateAccessKey</span> target=<span class='s'>svc-build</span> <span class='c'># CHG-90231</span></span><span class='log-line'><span class='t'>04-03</span> caller=<span class='i'>role/quarterly-key-rotation</span> event=<span class='s'>CreateAccessKey</span> target=<span class='s'>svc-etl</span> <span class='c'># CHG-90258</span></span><span class='log-line'><span class='t'>04-05</span> caller=<span class='i'>role/backup-auditor</span> event=<span class='s'>ImportKeyPair</span> <span class='c'># CHG-90290</span></span></pre></div><div class='art'><div class='art-h'>ARTEFACT 2 — detection review note</div><pre><span class='log-line'>goal: keep the three credential APIs, drop <span class='ok'>documented pipelines only</span></span><span class='log-line'>never exclude: human admin roles, wildcard scopes, non-pipeline ranges</span></pre></div>",
    question: "Fill the three gaps to finish the hardened analytic.",
    hint: "One wrong path: excluding the human admin roles. The noise sample names pipelines, not people.",
    explanation: "<p>The three exclusions make AN1470 humane without blinding it. <code>CreateAccessKey</code> is the API that starts the chain, alongside ImportKeyPair and CreateLoginProfile. The first exclusion list must name the <em>documented automation principals</em> — the rotation, CI deploy and backup auditor roles straight from the noise panel — because those are the only legitimate creators. Excluding the human admin roles, or using <code>*</code>, would hide exactly the actor this analytic exists to catch: an unexpected principal minting credentials. The second exclusion is the CI NAT pair, the only sources the pipelines ever speak from; excluding the guest Wi-Fi range or the whole internet blinds the rule entirely. The one real event last month — off-window, off-NAT, unticketed — still fires on the hardened version. </p><p class='study'><strong>Study:</strong> DET0531 tuning is allow-listing: exclude the documented, alert on everything else.</p>",
    cloze: "<p><code>index=cloudtrail eventName IN ({{b1}}, ImportKeyPair, CreateLoginProfile) AND NOT userIdentity.sessionContext.sessionIssuer.arn IN ({{b2}}) AND NOT sourceIPAddress IN ({{b3}}) | stats count by userIdentity.userName, eventName</code></p>",
    blanks: {
      b1: { kind: "text", accept: ["CreateAccessKey"], label: "the key-creation API", size: 18, why: "CreateAccessKey is the API that mints a new key; the other two names are already in the draft." },
      b2: { kind: "select", choices: ["role/quarterly-key-rotation role/ci-deploy role/backup-auditor", "role/cfo role/finance-prod role/board-admin", "*"], label: "the known automation principals", accept: ["role/quarterly-key-rotation role/ci-deploy role/backup-auditor"], why: "Only documented automation may be excluded — the three roles in the noise panel. Admin roles or a wildcard would hide the unexpected principal the analytic exists to catch." },
      b3: { kind: "select", choices: ["ci-nat-a + ci-nat-b", "guest-wifi-range", "0/0 (whole internet)"], label: "the automation source set", accept: ["ci-nat-a + ci-nat-b"], why: "The pipelines speak only from the CI NAT pair; any other exclusion set either blinds the rule or excludes the wrong range." }
    },
    bank: ["CreateAccessKey", "DeleteAccessKey", "UpdateAccessKey", "CreateRole"]
  },
  {
    id: "H05", type: "dnd", concept: "Correlating Cloud Evidence", perspective: "defender", matrix: true,
    summary: "Six queue items to sort: benign, suspicious, or not this technique",
    scenario: "<p>Tuesday queue, 08:10. Six items are waiting and the floor lead wants each one binned before the daily standup. The raw lines are below — bin by what the event actually is, not by how loud it looks.</p><div class='art log'><div class='art-h'>ARTEFACT — overnight queue, raw lines (filterable)</div><pre><span class='log-line'><span class='t'>04:12Z</span> <span class='k'>entra</span> op=<span class='s'>\"Update application — Certificates and secrets management\"</span> app=<span class='s'>Benefits-Portal</span> actor=<span class='i'>svc-vendor-sync</span> ip=<span class='i'>185[.]220[.]101[.]44</span></span><span class='log-line'><span class='t'>04:40Z</span> <span class='k'>cloudtrail</span> <span class='s'>CreateAccessKey</span> caller=<span class='i'>role/ci-deploy</span> src=<span class='i'>198[.]51[.]100[.]8</span> <span class='c'># CHG-90661</span></span><span class='log-line'><span class='t'>05:02Z</span> <span class='k'>cloudtrail</span> <span class='s'>ConsoleLogin</span> user=<span class='i'>j.alvarez</span> country=<span class='s'>first-seen: PT</span></span><span class='log-line'><span class='t'>05:31Z</span> <span class='k'>cloudtrail</span> <span class='s'>CreateLoginProfile</span> user=<span class='s'>svc-report</span> caller=<span class='i'>role/human-temp</span> <span class='c'># no ticket</span></span><span class='log-line'><span class='t'>06:10Z</span> <span class='k'>guardduty</span> finding <span class='s'>CredentialAccess:IAMUser/AnomalousBehavior</span> resource=<span class='i'>svc-etl</span></span><span class='log-line'><span class='t'>06:15Z</span> <span class='k'>resolver</span> query <span class='s'>updates[.]harvest-cdn[.]example</span> client=<span class='i'>10[.]16[.]4[.]51</span></span></pre></div>",
    question: "Sort all six items into the correct verdict zone.",
    hint: "One wrong path: treating a detector's finding or a DNS line as the credential event itself. Sort by what actually created an object.",
    explanation: "<p>Both investigative bins hinge on the same question: did this event <em>create a credential object</em>, and does the record explain it? The Tor-source secret and the unticketed CreateLoginProfile both create objects with nothing explaining them — investigate now; the first is the AN1469 case in the wild, the second is a console-password path onto a service account. The CI rotation creates an object too, but every field agrees with its ticket — benign. The other three never create a credential: a console sign-in is authentication telemetry, a GuardDuty finding is a detector pointing at possible activity (pivot to the backing API call before judging it), and a resolver query is network noise. The wrong-bin shortcut is severity-thinking: alarming-looking lines are not automatically credential events, and quiet lines are not automatically safe. </p><p class='study'><strong>Study:</strong> bin by what the event does to a credential object first, then by whether the record explains it.</p>",
    zones: [
      { id: "z1", label: "Benign — likely expected" },
      { id: "z2", label: "Suspicious — investigate now" },
      { id: "z3", label: "Not a credential-addition event" }

      { id: "i1", html: "Entra ID: new secret on Benefits-Portal added from 185[.]220[.]101[.]44 (Tor exit)", zone: "z2", why: "An anonymised, unfamiliar source adding a credential object to an app is the AN1469 signature — treat as suspicious until the owner explains it." },

    summary: "Shell work: count CreateAccessKey events in trail.json (read-only)",
    scenario: "<div class='art'><div class='art-h'>ARTEFACT 1 — case handover note (IR-2340)</div><pre><span class='log-line'>evidence: <span class='s'>/cases/2026-04-11-IAM/trail.json</span> — <span class='n'>48,112</span> CloudTrail events, one JSON event per line</span><span class='log-line'>mount: <span class='ok'>read-only</span> working copy · chain-of-custody original sealed</span></pre></div><div class='art'><div class='art-h'>ARTEFACT 2 — lead's ask, 07:31</div><pre><span class='log-line'>Standup is at <span class='t'>09:00</span>. I need the <span class='ok'>total count of CreateAccessKey events</span>.</span><span class='log-line'>Filtered events must stay <span class='s'>one per line</span> — no pretty multi-line blobs —</span><span class='log-line'>so anyone can re-derive the number. Do not write to the file.</span></pre></div><p>Environment: hardened forensic workstation, bash, offline. Installed tooling: jq 1.6, GNU coreutils 9.4, Python 3.12. Your account reads the case mount and nothing else.</p>",
    question: "Type the one-line command that filters the CreateAccessKey events compactly, one per line, and produces the total count.",
    hint: "Drop the text-search path first: the capture is structured JSON, one event per line, and the number must survive scrutiny.",
    explanation: "<p>Why this shape: <code>jq</code> parses the JSON structure, so <code>select(.eventName==\"CreateAccessKey\")</code> keeps only events whose <code>eventName</code> field is exactly right, and <code>-c</code> keeps each survivor on one line so <code>wc -l</code> counts events, not formatting. The near-misses: <code>grep -c CreateAccessKey trail.json</code> also prints a number, but it counts any line mentioning the string — error messages, other events' fields, pretty-printed fragments — so it is not a defensible count; <code>jq 'select(...)'</code> without <code>-c</code> pretty-prints each event across many lines, so the same <code>wc -l</code> over-counts; and <code>grep ... | wc -l</code> inherits the text problem. The negative check matters: the mount is read-only, and any redirect like <code>&gt; filtered.json</code> or an in-place edit would write to evidence — the number could never be re-derived and the chain of custody breaks. </p><p class='study'><strong>Study:</strong> control-plane triage starts with structure-aware parsing — jq for JSON, not text grep — because every DET0531 analytic assumes clean event parsing underneath.</p>",
    known: ["jq", "grep", "cat", "wc", "awk", "sed", "cut", "sort", "uniq", "head", "tail", "less", "rg", "python", "python3", "perl", "find", "xargs"],
    prompt: "analyst@ir-forensics-03:~$",
    termTitle: "ir-forensics-03 — bash",
    motd: [
      "<span class='c'># ir-forensics-03 — read-only evidence mount · case 2026-04-11-IAM</span>",
      "<span class='c'># trail.json: 48,112 CloudTrail events, one JSON event per line</span>",
      "<span class='c'># tooling: bash 5.2, jq 1.6, GNU coreutils 9.4 — no network</span>"

      { label: "selects on eventName == CreateAccessKey", re: "select\\s*\\(\\s*\\.eventName\\s*==\\s*[\"']?CreateAccessKey", why: "The filter must key on the eventName field being exactly CreateAccessKey." },
      { label: "counts the filtered stream with wc -l", re: "wc\\s+-l", why: "wc -l turns the filtered stream into the number the lead can defend." },
      { label: "does NOT modify, overwrite or delete trail.json", re: "\\brm\\b|\\bmv\\b|\\bshred\\b|\\btruncate\\b|\\bsed\\s+-i\\b|>>?\\s*\\S+\\.(json|log|txt)", negative: true, why: "The mount is read-only and the copy must stay byte-identical; nothing you run may write, rename or remove it." },
      { label: "keeps one event per line (jq compact output: -c)", re: "jq[^\\n|]*\\s-c\\b", why: "Without compact output, jq pretty-prints each event onto many lines and the count stops being a count of events." }
    ],
    canonical: "jq -c 'select(.eventName==\"CreateAccessKey\")' trail.json | wc -l",
    canonicalParts: [
      "<code>jq</code> — a structured JSON tool: it reads field values, not raw text",
      "<code>-c</code> — compact output, so every matching event stays on exactly one line",
      "<code>select(.eventName==\\\"CreateAccessKey\\\")</code> — keeps only events whose eventName field is exactly CreateAccessKey",

    summary: "Unexplained key on finance-prod, unused, keynote at 09:00 — decide",
    scenario: "<p>06:55 UTC, and the duty manager wants one decision before the 08:00 business call. The CFO's investor keynote is at 09:00, and finance-prod runs the nightly settlement.</p><div class='art log'><div class='art-h'>ARTEFACT 1 — CloudTrail (filterable)</div><pre><span class='log-line'>{<span class='k'>\"eventTime\"</span>:<span class='t'>\"2026-03-18T06:41:12Z\"</span>,<span class='k'>\"eventName\"</span>:<span class='s'>\"CreateAccessKey\"</span>,<span class='k'>\"userIdentity\"</span>:{<span class='k'>\"arn\"</span>:<span class='i'>\"arn:aws:sts::123456789012:assumed-role/vendor-onboarding-session/vs-01\"</span>},<span class='k'>\"sourceIPAddress\"</span>:<span class='i'>\"203[.]0[.]113[.]88\"</span>,<span class='k'>\"requestParameters\"</span>:{<span class='k'>\"userName\"</span>:<span class='s'>\"finance-prod\"</span>},<span class='k'>\"responseElements\"</span>:{<span class='k'>\"accessKey\"</span>:{<span class='k'>\"accessKeyId\"</span>:<span class='s'>\"AKIAQ2XK7V4TQ7KE\"</span>}}}</span></pre></div><div class='art'><div class='art-h'>ARTEFACT 2 — status at 06:55</div><pre><span class='log-line'>key <span class='s'>AKIAQ2XK7V4TQ7KE</span>: created <span class='t'>06:41Z</span> — <span class='ok'>no use recorded anywhere</span></span><span class='log-line'>tickets: <span class='bad'>none</span> for finance-prod key work · vendor-onboarding-session: <span class='bad'>not a documented principal</span></span><span class='log-line'>rotation: quarterly, CI runner, ticketed — next due <span class='t'>2026-06</span></span></pre></div>",

function $(s,r){return (r||document).querySelector(s);}
function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function h(tag,cls,html){var e=document.createElement(tag);if(cls){e.className=cls;}if(html!==undefined&&html!==null){e.innerHTML=html;}return e;}
function fmtClock(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s=sec%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function fmtMin(sec){return Math.round(sec/60);}
function shuffle(arr){var a=arr.slice(),i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}return a;}
function norm(s){return String(s||"").toLowerCase().replace(/[\s]+/g," ").replace(/["'.,;:!?\u00b4`]/g,"").trim();}
/* Spec-mandated scoring function name */
function scoreExercise(selectedItems, correctItems){
  var N=correctItems.length,H=0,W=0,i,seen={};
  for(i=0;i<correctItems.length;i++){seen[correctItems[i]]=1;}
  for(i=0;i<selectedItems.length;i++){if(seen[selectedItems[i]]){H++;}else{W++;}}
  return Math.max(0,(H-W)/Math.max(1,N));
}
function scoreHW(H,W,N){return Math.max(0,(H-W)/Math.max(1,N));}

var T_RUN="RUNNING",T_MAN="PAUSED_MANUAL",T_AUTO="PAUSED_AUTO_CHECK",T_END="ENDED";
var S={
  phase:"intro",          /* intro | exam | review | results */
  timer:T_RUN,            /* the single timer state machine */
  resumeTo:T_RUN,         /* state to return to after a manual pause */
  started:false,
  order:[],               /* shuffled exercise ids for this attempt */
  idx:0,
  cur:null,
  checked:false,
  answered:{},            /* id -> credit (float) */
  skipped:{},             /* id -> 1 */
  hinted:{},              /* id -> 1 */
  breakdown:{},           /* id -> grade object (for results table) */
  remain:0,
  runTotal:0,manualMs:0,autoMs:0,
  exLeft:0,exLimit:false, /* per-exercise timer (EXTREMELY HARD terminal only) */
  reported:false,
  user:null,country:null
};

function setState(t){
  if(t===T_MAN){S.resumeTo=(S.timer===T_MAN?S.resumeTo:S.timer);S.timer=T_MAN;}
  else if(t===T_RUN){S.timer=(S.resumeTo===T_AUTO?T_AUTO:T_RUN);S.resumeTo=T_RUN;}
  else{S.timer=t;}
  updateTimerUI();
}
function updateTimerUI(){
  var st=$("#hTState"),ind=$("#hInd"),clock=$("#hClock");
  if(!st){return;}
  clock.textContent=fmtClock(S.remain);
  if(S.timer===T_RUN){st.className="tstate st-run";st.innerHTML="&#9654; RUNNING";ind.hidden=true;}
  else if(S.timer===T_MAN){st.className="tstate st-pause";st.innerHTML="&#9208; PAUSED_MANUAL";
    ind.hidden=false;ind.innerHTML="&#9208; PAUSED &mdash; manual (press Resume)";}
  else if(S.timer===T_AUTO){st.className="tstate st-pause";st.innerHTML="&#9208; PAUSED_AUTO_CHECK";
    ind.hidden=false;ind.innerHTML="&#9208; PAUSED &mdash; reviewing feedback (resumes on Next)";}
  else{st.className="tstate st-end";st.innerHTML="&#9632; ENDED";ind.hidden=true;}
}
setInterval(function(){
  if(!S.started||S.timer===T_END){return;}
  if(S.timer===T_RUN){
    S.remain-=0.5;
    if(S.phase==="exam"&&S.exLimit&&!S.checked){
      S.exLeft-=0.5;
      var ec=$("#exClock");if(ec){ec.textContent=fmtClock(S.exLeft);}
      if(S.exLeft<=0){autoCheck();}
    }
    if(S.remain<=0){S.remain=0;updateTimerUI();finishExam(true);return;}
  }else if(S.timer===T_MAN){S.manualMs+=0.5;}
  else if(S.timer===T_AUTO){S.autoMs+=0.5;}
  updateTimerUI();
},500);

function updateScoreChip(){
  var sum=0,count=0,k;
  for(k in S.answered){if(S.answered.hasOwnProperty(k)){sum+=S.answered[k];count++;}}
  $("#hScoreSum").textContent=(Math.round(sum*10)/10).toFixed(1);

}
function answeredCount(){var n=0,k;for(k in S.answered){if(S.answered.hasOwnProperty(k)){n++;}}return n;}

  S.started=true;S.phase="exam";
  resetAttempt();
  S.order=shuffle(exIds());
  S.idx=0;
  $("#vIntro").hidden=true;
  $("#vResults").hidden=true;
  $("#vReview").hidden=true;
  $("#vExam").hidden=false;

}
function resetAttempt(){
  S.answered={};S.skipped={};S.hinted={};S.breakdown={};
  S.checked=false;S.reported=false;S.idx=0;S.cur=null;
  S.remain=META.budgetSeconds;S.resumeTo=T_RUN;S.timer=T_RUN;
  S.manualMs=0;S.autoMs=0;S.runTotal=0;S.exLimit=false;S.exLeft=0;

}
function retake(){
  S.phase="exam";

var LETTERS="ABCDEFGH";
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];});}
function optText(html){var d=h("div","",html);return d.textContent;}

/* ================= widget builders ================= */
function buildWidget(ex,box){
  S.collectFn=null;S.disableFn=null;
  if(ex.type==="qcm"){buildChoice(ex,box,false);}
  else if(ex.type==="multi"){buildChoice(ex,box,true);}
  else if(ex.type==="dnd"){buildDND(ex,box);}
  else if(ex.type==="match"){buildMatch(ex,box);}
  else if(ex.type==="fill"){buildFill(ex,box);}
  else if(ex.type==="order"){buildOrder(ex,box);}
  else if(ex.type==="terminal"){buildTerminal(ex,box);}
  else if(ex.type==="tree"){buildTree(ex,box);}
  else{box.appendChild(h("p","bad","Unsupported exercise type."));}

function buildChoice(ex,box,multi){
  var list=h("div","anslist");
  var opts=shuffle(ex.options);
  opts.forEach(function(o,i){
    var lab=h("label","opt");
    var inp=document.createElement("input");
    inp.type=multi?"checkbox":"radio";inp.name="ans_"+ex.id;inp.value=o.id;
    lab.appendChild(inp);
    lab.appendChild(h("span","olab",LETTERS[i]+"."));
    lab.appendChild(h("span","ohtml",o.html));
    lab.appendChild(h("span","sel-tag","&#9679; Selected"));
    inp.addEventListener("change",function(){
      if(multi){lab.classList.toggle("sel",inp.checked);}
      else{$all(".opt",list).forEach(function(x){x.classList.remove("sel");});lab.classList.add("sel");}
    });
    list.appendChild(lab);
  });
  box.appendChild(list);
  S.collectFn=function(){return $all("input:checked",list).map(function(i){return i.value;});};
  S.disableFn=function(){$all("input",list).forEach(function(i){i.disabled=true;});list.style.pointerEvents="none";};
}
function buildDND(ex,box){
  var picked=null;
  box.appendChild(h("div","bank-label","Item bank &mdash; drag each item into a zone, or click an item and then click a zone. Click an item inside a zone to send it back."));
  var bank=h("div","bank");box.appendChild(bank);
  var zw=h("div","dzwrap"+(ex.matrix?" matrix":""));box.appendChild(zw);
  function itemEl(id){return $all(".ditem",box).filter(function(e){return e.dataset.id===id;})[0]||null;}
  function zoneBody(zid){var dz=$all(".dz",box).filter(function(e){return e.dataset.zone===zid;})[0];return dz?$(".dz-body",dz):null;}
  function moveItem(id,zid){
    var el=itemEl(id);if(!el){return;}
    if(zid===null){bank.appendChild(el);}
    else{var b=zoneBody(zid);if(b){b.appendChild(el);}}
    el.classList.remove("picked");if(picked===id){picked=null;}
  }
  function togglePick(id){
    var el=itemEl(id);if(!el){return;}
    if(picked===id){picked=null;el.classList.remove("picked");return;}
    if(picked){var pe=itemEl(picked);if(pe){pe.classList.remove("picked");}}
    picked=id;el.classList.add("picked");
  }
  shuffle(ex.items).forEach(function(it){
    var el=h("div","ditem","<span class=\"grip\">&#8942;&#8942;</span><span>"+it.html+"</span>");
    el.draggable=true;el.dataset.id=it.id;el.setAttribute("tabindex","0");
    el.setAttribute("role","button");el.setAttribute("aria-label","Move item: "+optText(it.html));
    el.addEventListener("dragstart",function(ev){try{ev.dataTransfer.setData("text/plain",it.id);}catch(e){}el.classList.add("picked");});
    el.addEventListener("dragend",function(){el.classList.remove("picked");});
    el.addEventListener("click",function(ev){ev.stopPropagation();togglePick(it.id);});
    el.addEventListener("keydown",function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();togglePick(it.id);}});
    bank.appendChild(el);
  });
  bank.addEventListener("click",function(ev){if(ev.target===bank&&picked){moveItem(picked,null);}});
  ex.zones.forEach(function(z){
    var dz=h("div","dz");dz.dataset.zone=z.id;dz.setAttribute("tabindex","0");
    dz.appendChild(h("div","dz-h",z.label));
    dz.appendChild(h("div","dz-body"));
    dz.addEventListener("click",function(ev){if(ev.target.closest(".ditem")){return;}if(picked){moveItem(picked,z.id);}});
    dz.addEventListener("keydown",function(ev){if((ev.key==="Enter"||ev.key===" ")&&picked){ev.preventDefault();moveItem(picked,z.id);}});
    dz.addEventListener("dragover",function(ev){ev.preventDefault();dz.classList.add("over");});
    dz.addEventListener("dragleave",function(){dz.classList.remove("over");});
    dz.addEventListener("drop",function(ev){ev.preventDefault();dz.classList.remove("over");var id="";try{id=ev.dataTransfer.getData("text/plain");}catch(e){}if(id){moveItem(id,z.id);}});
    zw.appendChild(dz);
  });
  S.collectFn=function(){
    var m={};
    ex.items.forEach(function(it){var el=itemEl(it.id);var dz=el?el.closest(".dz"):null;m[it.id]=dz?dz.dataset.zone:"";});
    return m;
  };
  S.disableFn=function(){$all(".ditem,.dz",box).forEach(function(e){e.style.pointerEvents="none";e.setAttribute("tabindex","-1");});};
}

function buildOrder(ex,box){

function buildTerminal(ex,box){

function buildTree(ex,box){
  var stepIdx=0,answers=[];
  function renderStep(){
    box.innerHTML="";
    var st=ex.steps[stepIdx];
    box.appendChild(h("div","step-chip","STEP "+(stepIdx+1)+" OF "+ex.steps.length));
    if(st.addendum){
      box.appendChild(h("div","art addendum","<div class=\"art-h\">UPDATE "+(stepIdx+1)+"</div><div style=\"padding:10px 14px\">"+st.addendum+"</div>"));
    }
    var list=h("div","anslist");
    shuffle(st.options).forEach(function(o,i){
      var lab=h("label","opt");
      var inp=document.createElement("input");inp.type="radio";inp.name="tree_"+stepIdx;inp.value=o.id;
      lab.appendChild(inp);lab.appendChild(h("span","olab",LETTERS[i]+"."));
      lab.appendChild(h("span","ohtml",o.html));lab.appendChild(h("span","sel-tag","&#9679; Selected"));
      inp.addEventListener("change",function(){$all(".opt",list).forEach(function(x){x.classList.remove("sel");});lab.classList.add("sel");});
      list.appendChild(lab);
    });
    box.appendChild(list);
    var btn=h("button","btn "+(stepIdx===ex.steps.length-1?"primary":"blue"));
    btn.type="button";
    btn.innerHTML=stepIdx===ex.steps.length-1?"&#10003; Check &mdash; submit all steps":"Confirm step "+(stepIdx+1)+" &middot; &#9654;";
    btn.addEventListener("click",function(){
      var sel=$all("input:checked",list).map(function(x){return x.value;});
      if(sel.length!==1){var w=$(".dangerbanner",box);if(!w){box.insertBefore(h("div","dangerbanner","&#9888; Choose one option before confirming this step."),list);}return;}
      answers.push(sel[0]);
      if(stepIdx===ex.steps.length-1){S.collectFn=function(){return answers.slice();};checkCurrent(false);}
      else{stepIdx++;renderStep();}
    });
    box.appendChild(btn);
  }
  renderStep();
  S.collectFn=function(){return answers.slice();};
  S.disableFn=function(){$all("input,button",box).forEach(function(e){e.disabled=true;});};
}
function autoCheck(){checkCurrent(true);}

/* ================= grading ================= */
function gradeEx(ex,ans){
  var g={credit0:0,items:[],answerHtml:"",danger:null,N:1,auto:false};
  var H=0,W=0,i,optBy={},stepBy={},rightBy={},zn={},itemBy={};
  if(ex.type==="qcm"){
    ex.options.forEach(function(o){optBy[o.id]=o;});
    var sel=ans[0]||null,corr=ex.correct[0],ok=sel===corr;
    g.credit0=ok?1:0;g.N=1;
    g.answerHtml=optBy[corr].html;
    if(ok){
      g.items.push({label:optBy[corr].html,state:"ok",why:(ex.optWhy&&ex.optWhy[corr])||""});
    }else{
      g.items.push({label:sel?optBy[sel].html:"(no answer given)",state:"wrong",
        why:sel?((ex.optWhy&&ex.optWhy[sel])||""):"Choose the correct option next time."});
      g.items.push({label:optBy[corr].html,state:"missed",why:"This was the correct option."});
    }
  }else if(ex.type==="multi"){
    ex.options.forEach(function(o){optBy[o.id]=o;});
    var selset={};ans.forEach(function(a){selset[a]=1;});
    ex.correct.forEach(function(cid){g.items.push({label:optBy[cid].html,state:selset[cid]?"ok":"missed",why:(ex.whys&&ex.whys[cid])||""});});
    ans.forEach(function(sid){if(ex.correct.indexOf(sid)===-1){g.items.push({label:optBy[sid].html,state:"wrong",why:(ex.whys&&ex.whys[sid])||"Not part of the correct answer."});}});
    g.credit0=scoreExercise(ans,ex.correct);g.N=ex.correct.length;
    g.answerHtml=ex.correct.map(function(cid){return optBy[cid].html;}).join(" <strong>&middot;</strong> ");
  }else if(ex.type==="dnd"){
    ex.items.forEach(function(it){itemBy[it.id]=it;});
    ex.zones.forEach(function(z){zn[z.id]=z;});
    ex.items.forEach(function(it){
      var placed=ans[it.id]||"";
      if(placed===it.zone){H++;g.items.push({label:it.html+" &rarr; "+zn[it.zone].label,state:"ok",why:it.why||""});}
      else if(!placed){g.items.push({label:it.html,state:"missed",why:"You did not place this item. Correct zone: "+zn[it.zone].label+". "+(it.why||"")});}
      else{W++;g.items.push({label:it.html+" &rarr; "+zn[placed].label,state:"wrong",why:"Correct zone: "+zn[it.zone].label+". "+(it.why||"")});}
    });
    g.credit0=scoreHW(H,W,ex.items.length);g.N=ex.items.length;
    g.answerHtml=ex.items.map(function(it){return it.html+" &rarr; <strong>"+zn[it.zone].label+"</strong>";}).join("<br>");
  }else if(ex.type==="match"){
    ex.rights.forEach(function(r){rightBy[r.id]=r;});
    ex.lefts.forEach(function(l){
      var v=ans[l.id]||"",want=ex.pairs[l.id];
      if(v===want){H++;g.items.push({label:l.html+" &rarr; "+rightBy[want].html,state:"ok",why:(ex.whys&&ex.whys[l.id])||""});}
      else if(!v){g.items.push({label:l.html,state:"missed",why:"You left this unmatched. Correct match: "+rightBy[want].html+". "+((ex.whys&&ex.whys[l.id])||"")});}
      else{W++;g.items.push({label:l.html+" &rarr; "+rightBy[v].html,state:"wrong",why:"Correct match: "+rightBy[want].html+". "+((ex.whys&&ex.whys[l.id])||"")});}
    });
    g.credit0=scoreHW(H,W,ex.lefts.length);g.N=ex.lefts.length;
    g.answerHtml=ex.lefts.map(function(l){return l.html+" &rarr; <strong>"+rightBy[ex.pairs[l.id]].html+"</strong>";}).join("<br>");
  }else if(ex.type==="fill"){
    Object.keys(ex.blanks).forEach(function(tok){
      var b=ex.blanks[tok],vRaw=ans[tok]||"",v=norm(vRaw);
      var acc=(b.accept||[]).map(norm);
      var label=(b.label||tok);
      if(!vRaw){g.items.push({label:"Blank &ldquo;"+label+"&rdquo;",state:"missed",why:"You left this blank empty. Accepted: "+b.accept.join(" / ")+". "+(b.why||"")});}
      else if(acc.indexOf(v)>-1){H++;g.items.push({label:"Blank &ldquo;"+label+"&rdquo; = "+esc(vRaw),state:"ok",why:b.why||""});}
      else{W++;g.items.push({label:"Blank &ldquo;"+label+"&rdquo; = "+esc(vRaw),state:"wrong",why:"Accepted: "+b.accept.join(" / ")+". "+(b.why||"")});}
    });
    g.credit0=scoreHW(H,W,Object.keys(ex.blanks).length);g.N=Object.keys(ex.blanks).length;
    g.answerHtml=Object.keys(ex.blanks).map(function(tok){return "<strong>"+(ex.blanks[tok].label||tok)+"</strong> = "+ex.blanks[tok].accept.join(" / ");}).join("<br>");
  }else if(ex.type==="order"){
    ex.steps.forEach(function(st){stepBy[st.id]=st;});
    for(i=0;i<ex.steps.length;i++){
      var got=ans[i],want=ex.correctOrder[i];
      if(got===want){H++;g.items.push({label:"Position "+(i+1)+": "+stepBy[got].html,state:"ok",why:(ex.whys&&ex.whys[got])||""});}
      else{W++;g.items.push({label:"Position "+(i+1)+": "+(got?stepBy[got].html:"(empty)"),state:"wrong",why:"Correct position "+(i+1)+": "+stepBy[want].html+". "+((ex.whys&&ex.whys[want])||"")});}
    }
    g.credit0=scoreHW(H,W,ex.steps.length);g.N=ex.steps.length;
    g.answerHtml=ex.correctOrder.map(function(id,k){return "<strong>"+(k+1)+".</strong> "+stepBy[id].html;}).join("<br>");
  }else if(ex.type==="terminal"){
    var blob=Array.isArray(ans)?ans.join("\n"):String(ans||"");
    (ex.checks||[]).forEach(function(c){
      var re=new RegExp(c.re,"i");
      var pass=c.negative?!re.test(blob):re.test(blob);
      if(pass){H++;g.items.push({label:c.label,state:"ok",why:c.why||""});}
      else{g.items.push({label:c.label,state:"missed",why:(c.why||"")+" Missing from your command."});}
    });
    if(ex.danger&&ex.danger.re&&new RegExp(ex.danger.re,"i").test(blob)){g.danger={why:ex.danger.why};}
    if(g.danger){H=0;} /* a dangerous near-miss command forfeits all credit */
    g.credit0=scoreHW(H,0,(ex.checks||[]).length);g.N=(ex.checks||[]).length;
    g.answerHtml="";
  }else if(ex.type==="tree"){
    ex.steps.forEach(function(st){stepBy[st.id]=st;});
    for(i=0;i<ex.steps.length;i++){
      var st=ex.steps[i],got=ans[i],want=st.correct[0];
      var gotHtml="",optBy2={};
      st.options.forEach(function(o){optBy2[o.id]=o;});
      gotHtml=got?optBy2[got].html:"(no answer)";
      if(got===want){H++;g.items.push({label:"<strong>Step "+(i+1)+":</strong> "+gotHtml,state:"ok",why:st.why||""});}
      else{W++;g.items.push({label:"<strong>Step "+(i+1)+":</strong> "+gotHtml,state:"wrong",why:"Correct: "+optBy2[want].html+" — "+(st.why||"")});}
    }
    g.credit0=scoreHW(H,W,ex.steps.length);g.N=ex.steps.length;
    g.answerHtml=ex.steps.map(function(st,k){var o2={};st.options.forEach(function(o){o2[o.id]=o;});return "<strong>Step "+(k+1)+":</strong> "+o2[st.correct[0]].html;}).join("<br>");
  }
  return g;
}

/* ================= check / feedback ================= */
function checkCurrent(auto){
  if(S.checked||!S.cur||S.phase!=="exam"){return;}
  var ex=S.cur,ans=S.collectFn?S.collectFn():[];
  S.checked=true;
  /* FIRST ACTION: stop the timer for unlimited feedback review */
  if(S.timer===T_RUN){S.timer=T_AUTO;S.resumeTo=T_RUN;}
  updateTimerUI();
  var g=gradeEx(ex,ans);
  g.auto=!!auto;
  var credit=g.credit0;
  if(S.hinted[ex.id]){credit=Math.max(0,credit-0.10);}
  S.answered[ex.id]=credit;
  S.breakdown[ex.id]={credit:credit};
  if(S.disableFn){S.disableFn();}
  S.collectFn=null;
  $("#bHint").disabled=true;$("#bSkip").disabled=true;
  renderFeedback(ex,g,credit);
  updateScoreChip();updateProgress();
  var nav=$("#navRow");nav.innerHTML="";
  var last=(S.idx===S.order.length-1),pool=skippedPool();
  if(!last){
    var b=h("button","btn blue","Next &#9654;");b.type="button";b.addEventListener("click",advance);nav.appendChild(b);
  }else if(pool.length>0){
    var b2=h("button","btn blue","Review skipped exercises ("+pool.length+") &#9654;");b2.type="button";b2.addEventListener("click",showReview);nav.appendChild(b2);
  }else{
    var b3=h("button","btn primary","Final Submit &#9632;");b3.type="button";b3.addEventListener("click",function(){finishExam(false);});nav.appendChild(b3);
  }
}
function renderFeedback(ex,g,credit){
  var fb=$("#fbSlot");fb.hidden=false;fb.innerHTML="";
  var okN=0,wrongN=0,i;
  for(i=0;i<g.items.length;i++){if(g.items[i].state==="ok"){okN++;}else if(g.items[i].state==="wrong"){wrongN++;}}
  var cls,head;
  if(credit>=0.999){cls="st-ok";head="&#10003; CORRECT";}
  else if(credit<=0.001){cls="st-bad";head="&#10007; INCORRECT";}
  else{cls="st-part";head="&#10003; PARTIALLY CORRECT";}
  fb.appendChild(h("div","fb-h "+cls,head+(g.N>1?" &mdash; credit "+credit.toFixed(2)+" ("+okN+"/"+g.N+" items)":"")));
  if(g.auto){fb.appendChild(h("div","credline","&#9201; The time limit for this exercise ran out &mdash; your answer was submitted automatically."));}
  fb.appendChild(h("div","credline","exercise credit: "+credit.toFixed(2)+(S.hinted[ex.id]?" &middot; includes &minus;0.10 hint penalty":"")+(g.danger?" &middot; dangerous commands score 0":"")+(g.N>1?" &middot; scored as (H &minus; W) / N = ("+okN+" &minus; "+wrongN+") / "+g.N:"")));
  if(g.danger){fb.appendChild(h("div","dangerbanner","&#10007; DANGEROUS &mdash; NEAR MISS: "+g.danger.why));}
  if(g.answerHtml){fb.appendChild(h("div","","<p><strong>Correct answer:</strong> "+g.answerHtml+"</p>"));}
  if(g.items.length){
    var ul=h("ul","items");
    g.items.forEach(function(it){
      var li=h("li","item it-"+it.state);
      var ic=it.state==="ok"?"&#10003; Correct":(it.state==="wrong"?"&#10007; Wrong":"&#9675; Missed");
      li.appendChild(h("span","it-ic",ic));
      li.appendChild(h("span","it-lab","<span>"+it.label+"</span>"+(it.why?" <span class=\"it-why\">&mdash; "+it.why+"</span>":"")));
      ul.appendChild(li);
    });
    fb.appendChild(ul);
  }
  if(ex.type==="terminal"){
    var c=h("div","canon");
    c.appendChild(h("div","bank-label","Canonical command (select to copy):"));
    c.appendChild(h("pre","",ex.canonical||""));
    if(ex.canonicalParts&&ex.canonicalParts.length){
      var pl="<ul class=\"rules\">";
      ex.canonicalParts.forEach(function(p){pl+="<li>"+p+"</li>";});
      c.appendChild(h("div","cp",pl+"</ul>"));
    }
    fb.appendChild(c);
  }
  fb.appendChild(h("div","fb-expl",ex.explanation));
  var red=false;try{red=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
  try{fb.scrollIntoView({block:"nearest",behavior:red?"auto":"smooth"});}catch(e){}
}

/* ================= hint / skip / advance / review ================= */
function hintCurrent(){
  if(!S.cur||S.checked||S.hinted[S.cur.id]){return;}
  S.hinted[S.cur.id]=1;
  var slot=$("#hintSlot");slot.innerHTML="";
  slot.appendChild(h("div","hintbox","<div class=\"h-h\">&#9878; HINT &mdash; using it costs &minus;10% of this exercise's credit</div>"+(S.cur.hint||"No hint available.")));
  $("#bHint").disabled=true;
}
function skipCurrent(){
  if(!S.cur||S.checked){return;}
  S.skipped[S.cur.id]=1;
  advance();
}
function advance(){
  if(S.timer===T_AUTO){S.timer=T_RUN;S.resumeTo=T_RUN;updateTimerUI();}
  var i=S.idx+1;
  while(i<S.order.length&&S.answered[S.order[i]]){i++;}
  if(i<S.order.length){S.idx=i;showExercise();}
  else{showReview();}
}
function skippedPool(){
  return S.order.filter(function(id){return S.skipped[id]&&!S.answered.hasOwnProperty(id);});
}
function showReview(){
  S.phase="review";
  /* leaving feedback for the review screen ends the free auto-pause: the clock runs again */
  if(S.timer===T_AUTO){S.timer=T_RUN;S.resumeTo=T_RUN;}
  updateTimerUI();
  $("#vExam").hidden=true;$("#vResults").hidden=true;
  var v=$("#vReview");v.hidden=false;v.innerHTML="";
  var card=h("div","card");
  card.appendChild(h("h2","i-title","&#9888; Review skipped exercises"));
  card.appendChild(h("p","i-sub","These exercises were skipped without an answer. You can return to each one as often as you need while the timer is still running. Anything left unanswered is excluded from the score."));
  var pool=skippedPool();
  if(pool.length===0){
    card.appendChild(h("p","","<strong>&#10003; Nothing skipped.</strong> You answered every exercise in this exam. Submit when you are ready."));
  }
  pool.forEach(function(id){
    var ex=exById(id);
    var row=h("div","rev-row");
    row.appendChild(h("span","r-ic","&#9888; Skipped"));
    row.appendChild(h("div","r-t","<strong>"+id+"</strong> &mdash; "+(ex.summary||"")));
    row.appendChild(h("span","r-c",(ex.concept||"")));
    var b=h("button","btn blue","Answer");b.type="button";
    b.addEventListener("click",function(){jumpTo(id);});
    row.appendChild(b);
    card.appendChild(row);
  });
  var nav=h("div","navrow");
  var sub=h("button","btn primary","Final Submit &#9632;");sub.type="button";
  sub.addEventListener("click",function(){finishExam(false);});
  nav.appendChild(sub);
  nav.appendChild(h("span","note","Final score counts only the exercises you actually answered."));
  card.appendChild(nav);
  v.appendChild(card);
  $("#bHint").hidden=true;$("#bSkip").hidden=true;$("#bPause").hidden=false;
  $("#hCount").textContent="Review &middot; "+pool.length+" skipped";
}
function jumpTo(id){
  S.phase="exam";
  $("#vReview").hidden=true;$("#vExam").hidden=false;
  S.idx=S.order.indexOf(id);
  showExercise();
}

/* ================= results & report ================= */
function finishExam(byTimeout){
  if(S.timer!==T_END){S.timer=T_END;updateTimerUI();}
  if(S.cur&&!S.checked&&S.phase==="exam"){S.skipped[S.cur.id]=1;}
  S.phase="results";
  $("#vExam").hidden=true;$("#vReview").hidden=true;$("#pauseCover").hidden=true;
  $("#bHint").hidden=true;$("#bSkip").hidden=true;$("#bPause").hidden=true;
  var v=$("#vResults");v.hidden=false;v.innerHTML="";
  renderResults(v,byTimeout);
  reportScore();
}
function renderResults(v,byTimeout){
  var full=0,part=0,bad=0,skip=0,sum=0,ans=0,partSum=0;
  S.order.forEach(function(id){
    if(S.answered.hasOwnProperty(id)){
      var c=S.answered[id];ans++;sum+=c;
      if(c>=0.999){full++;}else if(c<=0.001){bad++;}else{part++;partSum+=c;}
    }else{skip++;}
  });
  var rounded=Math.round(sum); /* one rounding, at reporting time */
  var percent=ans>0?Math.round(rounded/ans*100):0;
  var passed=ans>0&&percent>=META.passMark;
  var head=h("div","res-head "+(passed?"pass":"fail"));
  head.appendChild(h("div","rh-big",passed?"&#10003; PASS":"&#10007; FAIL"));
  head.appendChild(h("div","rh-pct",percent+"%"));
  head.appendChild(h("div","i-sub","Final score: <strong>"+(Math.round(sum*10)/10).toFixed(1)+"</strong> over <strong>"+ans+"</strong> answered exercise(s) &middot; pass mark "+META.passMark+"% &middot; "+(passed?"Certification exam passed. Well done.":"You must retake this exam.")));
  if(byTimeout){head.appendChild(h("div","credline","&#9201; Time ran out &mdash; the exam was submitted automatically."));}
  v.appendChild(head);
  var avgP=part>0?(partSum/part).toFixed(2):"&mdash;";
  var stats=h("div","stats");
  function stat(cls,icon,vv,lb){var s=h("div","stat "+cls);s.appendChild(h("div","st-v",icon+" "+vv));s.appendChild(h("div","st-l",lb));stats.appendChild(s);}
  stat("c-ok","&#10003;",full,"Fully correct");
  stat("c-part","&#10003;",part+(part>0?" (avg "+avgP+")":""),"Partially correct");
  stat("c-bad","&#10007;",bad,"Fully incorrect");
  stat("c-skip","&#9888;",skip,"Skipped &mdash; excluded from score");
  stat("c-pause","&#9208;",fmtMin(S.manualMs)+" min","Time paused manually");
  stat("c-pause","&#9208;",fmtMin(S.autoMs)+" min","Time spent reviewing feedback");
  v.appendChild(stats);
  var tbl=h("table","res-table");
  var thead=h("thead");var tr=h("tr");
  ["#","Exercise","Concept","Credit","Result"].forEach(function(t){tr.appendChild(h("th","",t));});
  thead.appendChild(tr);tbl.appendChild(thead);
  var tb=h("tbody");
  S.order.forEach(function(id,i){
    var ex=exById(id);var trr=h("tr");
    trr.appendChild(h("td","",(i+1)));
    trr.appendChild(h("td","",id+" &mdash; "+(ex.summary||"")));
    trr.appendChild(h("td","",(ex.concept||"")));
    if(S.answered.hasOwnProperty(id)){
      var c=S.answered[id];
      trr.appendChild(h("td","",c.toFixed(2)));
      var lab,cls;
      if(c>=0.999){lab="&#10003; Correct";cls="ok";}
      else if(c<=0.001){lab="&#10007; Incorrect";cls="bad";}
      else{lab="&#10003; Partially correct ("+c.toFixed(2)+")";cls="part";}
      if(S.hinted[id]){lab+=" <span class=\"chipw\">hint</span>";}
      trr.appendChild(h("td","","<span class=\"st-lbl "+cls+"\">"+lab+"</span>"));
    }else{
      trr.appendChild(h("td","","&mdash;"));
      trr.appendChild(h("td","","<span class=\"st-lbl skip\">&#9888; Not answered &mdash; excluded</span>"));
    }
    tb.appendChild(trr);
  });
  tbl.appendChild(tb);v.appendChild(tbl);
  var nav=h("div","navrow");
  var rt=h("button","btn primary","&#8635; Retake Exam");rt.type="button";rt.addEventListener("click",retake);
  nav.appendChild(rt);
  nav.appendChild(h("span","note","Retaking shuffles the exercise order and the answer choices again."));
  v.appendChild(nav);
}
function reportScore(){
  if(S.reported){return;}
  var sum=0,count=0,k;
  for(k in S.answered){if(S.answered.hasOwnProperty(k)){sum+=S.answered[k];count++;}}
  var rounded=Math.round(sum); /* rounds only at the moment of posting */
  var percent=count>0?Math.round(rounded/count*100):0;
  S.reported=true;
  try{
    parent.postMessage({type:"CYBERPULSE_SCORE",topicId:META.topicId,batch:META.batch,
      score:rounded,total:count,percent:percent,passed:percent>=META.passMark},location.origin);
  }catch(e){/* opened directly - nothing to report to */}
}
window.addEventListener("message",function(event){
  var d=event.data;
  if(!d){return;}
  if(d.type!=="CYBERPULSE_INIT"&&d.type!=="CYBERMASTERY_INIT"){return;}
  if(d.username){S.user=String(d.username);var c=$("#hUser");c.hidden=false;c.textContent="user: "+S.user;var iu=$("#iUser");if(iu){iu.textContent=S.user;}}
  if(d.country){S.country=d.country;}
  /* theme field is always 'dark' - the file is dark-only by contract, nothing to switch */
});

/* ================= boot ================= */
function boot(){
  renderIntro();
  hdrShow(false);
  $("#bPause").addEventListener("click",function(){
    if(!S.started||S.phase==="results"||S.timer===T_END||S.timer===T_MAN){return;}
    setState(T_MAN);
    $("#pauseCover").hidden=false;
  });
  $("#bResume").addEventListener("click",function(){
    $("#pauseCover").hidden=true;
    S.timer=S.resumeTo||T_RUN;
    updateTimerUI();
  });
  $("#bHint").addEventListener("click",hintCurrent);
  $("#bSkip").addEventListener("click",skipCurrent);
}
boot();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
