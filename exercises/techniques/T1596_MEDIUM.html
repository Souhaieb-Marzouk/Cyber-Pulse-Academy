  /* ---------------- syntax highlighting (defang-aware) ---------------- */
  var HL_RX = new RegExp(

  /* ---------------- widgets ---------------- */

  function optionRows(ex, A) {

  function wChoice(ex, A, area) {

    area.innerHTML = '<div class="opts" role="group" aria-label="Answer options">' + optionRows(ex, A) + '</div>' +
      (ex.type === 'multi' ? '<p style="color:var(--text-secondary);font-size:.82rem;margin:8px 0 0">☑ Multi-select — select all that apply. Wrong picks subtract from correct ones (partial credit).</p>' : '');
    $all('.opt', area).forEach(function (b) {
      b.onclick = function () {

  function wMatch(ex, A, area) {
    if (!A.leftOrder) A.leftOrder = ex.pairs.map(function (_, i) { return i; });

    if (!A.pairs) A.pairs = {}; /* leftIdx -> rightIdx */
    var rights = A.rightOrder.map(function (ri) {
      var usedBy = null;

      return '<button type="button" class="mitem right' + (usedBy !== null ? ' paired' : '') + '" data-ri="' + ri + '"' +
        (usedBy !== null ? ' disabled' : '') + '>' + (usedBy !== null ? '<span class="pairnum">' + (usedBy + 1) + '</span>' : '') +
        esc(ex.pairs[ri].right) + '</button>';

        (pairedTo !== undefined ? ' paired' : '') + '" data-li="' + li + '">' +

    }).join('');
    area.innerHTML = '<div class="matchgrid"><div role="group" aria-label="Items to match">' + lefts + '</div>' +
      '<div role="group" aria-label="Matches">' + rights + '</div></div>' +
      '<p style="color:var(--text-secondary);font-size:.82rem;margin:8px 0 0">Click one item on the left, then its match on the right. Click a paired left item to undo that pair. Each correct pair scores; each wrong pair subtracts.</p>';
    $all('.mitem.left', area).forEach(function (b) {
      b.onclick = function () {

        A.armed = (A.armed === li) ? null : li;

  function wOrder(ex, A, area) {
    if (!A.arr) {
      A.arr = shuffle(ex.items.map(function (_, i) { return i; }));
      /* never hand the learner a pre-solved ordering */
      var guard = 0;
      while (A.arr.every(function (v, p) { return v === p; }) && guard < 9) { A.arr = shuffle(A.arr); guard++; }
      if (A.arr.every(function (v, p) { return v === p; })) A.arr.reverse();

          '<span class="ordtext">' + esc(ex.items[ii].text) + '</span>' +
          '<span class="mv"><button type="button" data-mv="up" data-pos="' + pos + '" aria-label="Move item ' + (pos + 1) + ' up">▲</button>' +
          '<button type="button" data-mv="down" data-pos="' + pos + '" aria-label="Move item ' + (pos + 1) + ' down">▼</button></span></div>';
      }).join('') + '</div>' +
      '<p style="color:var(--text-secondary);font-size:.82rem;margin:8px 0 0">Put the rows in the correct order. Each row in its correct position scores; each wrong position subtracts.</p>';
    $all('.ordrow .mv button', area).forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        if (S.checked[ex.id]) return;
        var pos = parseInt(this.getAttribute('data-pos'), 10);
        var to = this.getAttribute('data-mv') === 'up' ? pos - 1 : pos + 1;
        if (to < 0 || to >= A.arr.length) return;
        var t = A.arr[pos]; A.arr[pos] = A.arr[to]; A.arr[to] = t;
        wOrder(ex, A, area);
      };
    });
    var dragFrom = null;
    $all('.ordrow', area).forEach(function (row) {
      row.addEventListener('dragstart', function () { dragFrom = parseInt(this.getAttribute('data-pos'), 10); });
      row.addEventListener('dragover', function (e) { e.preventDefault(); this.classList.add('dragover'); });
      row.addEventListener('dragleave', function () { this.classList.remove('dragover'); });
      row.addEventListener('drop', function (e) {
        e.preventDefault(); this.classList.remove('dragover');
        if (S.checked[ex.id] || dragFrom === null) return;
        var to = parseInt(this.getAttribute('data-pos'), 10);
        var it = A.arr.splice(dragFrom, 1)[0]; A.arr.splice(to, 0, it); dragFrom = null;
        wOrder(ex, A, area);
      });
    });
  }

  function wBlank(ex, A, area) {
    if (!A.bank) A.bank = shuffle(ex.blanks.map(function (b, i) { return b.answer; }).concat(ex.bankExtra || []));
    if (!A.fill) A.fill = {};
    var bankHTML = '<div class="bank"><div class="bank-title">Word bank — click a word, then click a blank</div>' +
      A.bank.map(function (w, wi) {
        var used = Object.keys(A.fill).some(function (k) { return A.fill[k] === w; });
        return '<button type="button" class="chip' + (A.armedWord === w ? ' armed' : '') + (used ? ' used' : '') +
          '" data-w="' + esc(w) + '"' + (used ? ' disabled' : '') + '>◻ ' + esc(w) + '</button>';
      }).join('') + '</div>';
    var bodyHTML = ex.blanks.map(function (b, si) {
      var v = A.fill[si];
      return '<div class="slotline"><span>' + b.before + '</span>' +
        '<button type="button" class="slot' + (v ? ' filled' : '') + (A.armedWord && !v ? ' armed' : '') + '" data-slot="' + si + '">' +
        (v ? esc(v) : '␣␣␣') + '</button>' +
        '<span>' + b.after + '</span></div>';
    }).join('');
    area.innerHTML = bankHTML + '<div class="slots" role="group" aria-label="Blanks to fill">' + bodyHTML + '</div>' +
      '<p style="color:var(--text-secondary);font-size:.82rem;margin:8px 0 0">Each correctly filled blank scores; each wrongly filled blank subtracts. Extra bank words are decoys.</p>';
    $all('.chip', area).forEach(function (c) {
      c.onclick = function () {
        if (S.checked[ex.id]) return;
        A.armedWord = (A.armedWord === this.getAttribute('data-w')) ? null : this.getAttribute('data-w');
        wBlank(ex, A, area);
      };
    });
    $all('.slot', area).forEach(function (sl) {
      sl.onclick = function () {
        if (S.checked[ex.id]) return;
        var si = parseInt(this.getAttribute('data-slot'), 10);
        if (A.fill[si] !== undefined) { delete A.fill[si]; wBlank(ex, A, area); return; }
        if (!A.armedWord) return;
        A.fill[si] = A.armedWord; A.armedWord = null;
        wBlank(ex, A, area);
      };
    });
  }

  function wDD(ex, A, area) {
    if (!A.itemOrder) A.itemOrder = shuffle(ex.ddItems.map(function (_, i) { return i; }));
    if (!A.place) A.place = {};
    var bankItems = A.itemOrder.filter(function (i) { return A.place[i] === undefined; });
    var bankHTML = '<div class="bank" id="dd-bank"><div class="bank-title">Item bank — drag an item onto a zone, or click item then zone</div>' +
      bankItems.map(function (i) {
        return '<button type="button" class="chip" draggable="true" data-i="' + i + '"' + (A.armed === i ? ' armed' : '') +
          '><span class="drag-dot">⠿</span> ' + esc(ex.ddItems[i].text) + '</button>';
      }).join('') + '</div>';
    var zonesHTML = '<div class="zones" role="group" aria-label="Drop zones">' + ex.zones.map(function (z, zi) {
      var inZone = A.itemOrder.filter(function (i) { return A.place[i] === zi; });
      return '<div class="zone" data-z="' + zi + '" tabindex="0" role="button" aria-label="Drop zone: ' + esc(z.name) + ' — press Enter to place the armed item"><h4>' + esc(z.name) + '</h4><div class="zdesc">' + esc(z.desc) + '</div>' +
        inZone.map(function (i) {
          return '<button type="button" class="zitem" data-i="' + i + '">' + esc(ex.ddItems[i].text) + '</button>';
        }).join('') + '</div>';
    }).join('') + '</div>';
    area.innerHTML = bankHTML + zonesHTML +
      '<p style="color:var(--text-secondary);font-size:.82rem;margin:8px 0 0">Each item placed in its correct zone scores; each wrong placement subtracts. Click an item inside a zone to send it back.</p>';
    $all('.chip', area).forEach(function (c) {
      c.onclick = function () {
        if (S.checked[ex.id]) return;
        A.armed = (A.armed === parseInt(this.getAttribute('data-i'), 10)) ? null : parseInt(this.getAttribute('data-i'), 10);
        wDD(ex, A, area);
      };
      c.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', this.getAttribute('data-i')); });
    });
    $all('.zone', area).forEach(function (z) {
      z.addEventListener('dragover', function (e) { e.preventDefault(); this.classList.add('dropok'); });
      z.addEventListener('dragleave', function () { this.classList.remove('dropok'); });
      z.addEventListener('drop', function (e) {
        e.preventDefault(); this.classList.remove('dropok');
        if (S.checked[ex.id]) return;
        var i = parseInt(e.dataTransfer.getData('text/plain'), 10);
        if (isNaN(i)) return;
        A.place[i] = parseInt(this.getAttribute('data-z'), 10);
        wDD(ex, A, area);
      });
      z.onclick = function (e) {
        if (S.checked[ex.id]) return;
        if (e.target.classList && e.target.classList.contains('zitem')) {
          var i = parseInt(e.target.getAttribute('data-i'), 10);
          delete A.place[i]; wDD(ex, A, area); return;
        }
        if (A.armed === null || A.armed === undefined) return;
        A.place[A.armed] = parseInt(this.getAttribute('data-z'), 10); A.armed = null;
        wDD(ex, A, area);
      };
      z.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        if (S.checked[ex.id] || A.armed === null || A.armed === undefined) return;
        A.place[A.armed] = parseInt(this.getAttribute('data-z'), 10); A.armed = null;
        wDD(ex, A, area);
      });
    });
  }

  function wTerminal(ex, A, area) {
    if (!A.out) A.out = [ex.shell.banner || ''];
    area.innerHTML = '<div class="term" role="group" aria-label="Simulated terminal">' +
      '<div class="term-out" id="term-out">' + A.out.map(function (l) { return hlLine(l); }).join('\n') + '</div>' +
      '<div class="term-line"><span class="ps1">' + esc(ex.shell.prompt + ':~$') + '</span>' +
      '<input id="term-in" type="text" autocomplete="off" spellcheck="false" aria-label="Type the command"></div></div>' +
      (ex.syntaxPanel ? '<div class="syntaxpanel">' + hlLine(ex.syntaxPanel) + '</div>' : '') +
      '<p style="color:var(--text-secondary);font-size:.82rem;margin:8px 0 0">Simulation only — nothing is really executed. Type the command, press Enter to see the simulated output, then press ✓ Check.</p>';
    var inp = $('#term-in');
    inp.value = A.input || '';
    inp.focus();
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var v = this.value;
        if (!v.trim()) return;
        A.input = v;
        A.out.push(ex.shell.prompt + ':~$ ' + v);
        var norm = normCmd(v);
        var ok = ex.required.every(function (r) { return new RegExp(r.re, 'i').test(norm); }) &&
                 !(ex.dangerous || []).some(function (d) { return new RegExp(d.re, 'i').test(norm); });
        (ok ? (ex.shell.exampleOutput || ['(simulated output)']) : ['command not available in this simulation — check the tool name and options'])
          .forEach(function (l) { A.out.push(l); });
        $('#term-out').innerHTML = A.out.map(function (l) { return hlLine(l); }).join('\n');
        this.value = '';
      }
    });
  }
  function normCmd(v) {
    return String(v).trim().toLowerCase().replace(/\s+/g, ' ').replace(/[;]+$/, '');
  }

  function wBranch(ex, A, area) {
    if (typeof A.step === 'undefined') A.step = 0;
    var st = ex.steps[A.step];
    if (!A.picks) A.picks = [];
    if (!A.stepOrder) A.stepOrder = ex.steps.map(function (stp) { return shuffle(stp.options.map(function (_, j) { return j; })); });
    var opts = A.stepOrder[A.step].map(function (oi, i) {
      return '<button type="button" class="opt" data-oi="' + oi + '"><span class="opt-label">' + String.fromCharCode(65 + i) + '.</span>' +
        '<span>' + esc(st.options[oi].text) + '</span><span class="selword hidden">● SELECTED</span></button>';
    }).join('');
    area.innerHTML = '<div class="opts" role="group" aria-label="Branch step options">' + opts + '</div>' +
      '<div style="margin-top:12px"><button class="btn" id="btn-stepconfirm" disabled>' +
      (A.step < ex.steps.length - 1 ? 'Confirm step ▸' : '✓ Check answers') + '</button>' +
      '<span style="color:var(--text-secondary);font-size:.82rem;margin-left:10px">The timer keeps running between steps; grading happens on the final Check.</span></div>';
    var chosen = null;
    $all('.opt', area).forEach(function (b) {
      b.onclick = function () {
        if (S.checked[ex.id]) return;
        chosen = parseInt(this.getAttribute('data-oi'), 10);
        $all('.opt', area).forEach(function (x) {
          var on = parseInt(x.getAttribute('data-oi'), 10) === chosen;
          x.classList.toggle('selected', on);
          $('.selword', x).classList.toggle('hidden', !on);
        });
        $('#btn-stepconfirm').disabled = false;
      };
    });
    $('#btn-stepconfirm').onclick = function () {
      if (S.checked[ex.id] || chosen === null) return;
      A.picks[A.step] = chosen;
      if (A.step < ex.steps.length - 1) {
        A.step += 1;
        /* intermediate confirmations advance the scenario; timer keeps running */
        var chips = $('#stepchips');
        if (chips) {
          $all('.stepchip', chips).forEach(function (c, i) {
            c.className = 'stepchip ' + (i < A.step ? 'done' : (i === A.step ? 'on' : ''));
          });
        }
        var qh = $('.blk.q .blk-head');
        if (qh) qh.innerHTML = '<span aria-hidden="true">❓</span> QUESTION — STEP ' + (A.step + 1) + ' OF ' + ex.steps.length;
        var nst = ex.steps[A.step];
        $('#qtext').innerHTML = (nst.context || '') + nst.question;
        wBranch(ex, A, area);
      } else {
        onCheck();
      }
    };
  }

  /* ---------------- grading ---------------- */
  function collect(ex, A) {
    /* returns {selected:[keys], correct:[keys], items:[{status,label,why}]} */
    var sel = [], cor = [], items = [], i, j;
    if (ex.type === 'single') {
      ex.options.forEach(function (o, i2) {
        var k = 'o' + i2;
        if (o.correct) cor.push(k);
      });
      if (A.sel !== null && A.sel !== undefined) sel.push('o' + A.sel);
      ex.options.forEach(function (o, i2) {
        var chosen = (A.sel === i2);
        if (o.correct) items.push({ status: chosen ? 'ok' : 'miss', label: o.text, why: o.why });
        else if (chosen) items.push({ status: 'bad', label: o.text, why: o.why });
      });
    } else if (ex.type === 'multi') {
      ex.options.forEach(function (o, i2) { if (o.correct) cor.push('o' + i2); });
      (A.sel || []).forEach(function (i2) { sel.push('o' + i2); });
      ex.options.forEach(function (o, i2) {
        var chosen = (A.sel || []).indexOf(i2) !== -1;
        if (o.correct) items.push({ status: chosen ? 'ok' : 'miss', label: o.text, why: o.why });
        else if (chosen) items.push({ status: 'bad', label: o.text, why: o.why });
      });
    } else if (ex.type === 'match') {
      ex.pairs.forEach(function (p, i2) {
        cor.push('p' + i2 + ':r' + i2);
        var got = A.pairs[i2];
        if (got === undefined) items.push({ status: 'miss', label: p.left + ' → ' + p.right, why: p.why });
        else if (got === i2) { sel.push('p' + i2 + ':r' + got); items.push({ status: 'ok', label: p.left + ' → ' + p.right, why: p.why }); }
        else { sel.push('p' + i2 + ':r' + got); items.push({ status: 'bad', label: p.left + ' → ' + ex.pairs[got].right, why: p.why + ' (correct match: ' + p.right + ')' }); }
      });
    } else if (ex.type === 'order') {
      ex.items.forEach(function (it2, i2) { cor.push('pos' + i2 + ':it' + i2); });
      A.arr.forEach(function (ii, pos) {
        sel.push('pos' + pos + ':it' + ii);
        items.push({ status: ii === pos ? 'ok' : 'bad', label: (pos + 1) + '. ' + ex.items[ii].text, why: ex.items[ii].why });
      });
    } else if (ex.type === 'blank') {
      ex.blanks.forEach(function (b, i2) {
        cor.push('s' + i2 + ':' + b.answer);
        var v = A.fill[i2];
        if (v === undefined) items.push({ status: 'miss', label: b.answer, why: b.why });
        else { sel.push('s' + i2 + ':' + v); items.push({ status: v === b.answer ? 'ok' : 'bad', label: v, why: b.why }); }
      });
    } else if (ex.type === 'dd') {
      ex.ddItems.forEach(function (d, i2) { cor.push('it' + i2 + ':z' + d.zone); });
      ex.ddItems.forEach(function (d, i2) {
        var z = A.place[i2];
        if (z === undefined) items.push({ status: 'miss', label: d.text + ' → ' + ex.zones[d.zone].name, why: d.why });
        else { sel.push('it' + i2 + ':z' + z); items.push({ status: z === d.zone ? 'ok' : 'bad', label: d.text + ' → ' + ex.zones[z].name, why: d.why }); }
      });
    } else if (ex.type === 'terminal') {
      var norm = normCmd(A.input || '');
      ex.required.forEach(function (r) {
        cor.push(r.label);
        var hit = new RegExp(r.re, 'i').test(norm);
        if (hit) sel.push(r.label);
        items.push({ status: hit ? 'ok' : 'miss', label: r.label, why: r.why });
      });
      (ex.dangerous || []).forEach(function (d) {
        if (new RegExp(d.re, 'i').test(norm)) {
          sel.push(d.label);
          items.push({ status: 'bad', label: d.label, why: d.why });
        }
      });
    } else if (ex.type === 'branch') {
      ex.steps.forEach(function (st, i2) {
        var ck = st.options.reduce(function (acc, o, j2) { return o.correct ? j2 : acc; }, -1);
        cor.push('st' + i2 + ':o' + ck);
        var pick = A.picks[i2];
        if (pick === undefined) items.push({ status: 'miss', label: 'Step ' + (i2 + 1) + ': ' + st.options[ck].text, why: st.options[ck].why });
        else {
          sel.push('st' + i2 + ':o' + pick);
          items.push({ status: pick === ck ? 'ok' : 'bad', label: 'Step ' + (i2 + 1) + ': ' + st.options[pick].text, why: st.options[pick].why });
        }
      });
    }
    return { sel: sel, cor: cor, items: items };
  }

  function onCheck() {
    var ex = currentEx();
    if (!ex || S.checked[ex.id]) return;
    var A = S.answers[ex.id];
    if (ex.type === 'terminal') { var ti = $('#term-in'); if (ti && ti.value.trim()) { A.input = ti.value; } }
    /* mandatory: first action of Check is the auto-pause state transition */
    if (S.timer.state === 'RUNNING') setState('PAUSED_AUTO_CHECK');
    var c = collect(ex, A);
    var credit = scoreExercise(c.sel, c.cor);
    if (A.hintUsed) credit = Math.max(0, credit - 0.10);
    var dangerous = (ex.type === 'terminal') && (ex.dangerous || []).some(function (d) { return new RegExp(d.re, 'i').test(normCmd(A.input || '')); });
    var status = dangerous ? 'dangerous' : (credit >= 1 ? 'correct' : (credit > 0 ? 'partial' : 'incorrect'));
    if (S.mode === 'review-return') {
      var si = S.skipped.indexOf(S.returnIdx);
      if (si !== -1) S.skipped.splice(si, 1);
    }
    S.checked[ex.id] = true;
    S.results[ex.id] = { credit: credit, hintUsed: A.hintUsed, status: status };
    S.score.sum += credit; S.score.answered += 1;
    renderFeedback(ex, A, c, credit, status);
    refreshHeader();
    syncHeaderButtons();
  }

  function fbItemRow(it) {
    var ic = it.status === 'ok' ? '<span class="ic">✓</span>' : it.status === 'bad' ? '<span class="ic">✗</span>' : '<span class="ic">○</span>';
    var w = it.status === 'ok' ? 'Correct' : it.status === 'bad' ? 'Wrong' : 'Missed';
    return '<div class="fb-item ' + (it.status === 'ok' ? 'ok' : it.status === 'bad' ? 'bad' : 'miss') + '">' + ic +
      '<span><b>' + w + '</b> — ' + esc(it.label) + '. ' + esc(it.why || '') + '</span></div>';
  }
  function renderFeedback(ex, A, c, credit, status) {
    var head, cls;
    if (status === 'correct') { head = '✓ CORRECT'; cls = 'correct'; }
    else if (status === 'partial') { head = '✓ PARTIALLY CORRECT'; cls = 'partial'; }
    else if (status === 'dangerous') { head = '✗ DANGEROUS — NEAR MISS'; cls = 'dangerous'; }
    else { head = '✗ INCORRECT'; cls = 'incorrect'; }
    var N = c.cor.length, H = 0, W = 0;
    c.sel.forEach(function (k) { if (c.cor.indexOf(k) !== -1) H++; else W++; });
    var creditLine = (N > 1 || ex.type === 'terminal')
      ? '<div class="fb-credit">credit ' + credit.toFixed(2) + ' — ' + H + '/' + N + ' items correct' + (W ? ', ' + W + ' wrong item' + (W > 1 ? 's' : '') + ' selected' : '') + ((A.hintUsed) ? ' · hint used (−0.10)' : '') + '</div>'
      : '<div class="fb-credit">credit ' + credit.toFixed(2) + ((A.hintUsed) ? ' · hint used (−0.10)' : '') + '</div>';
    var rows = (N > 1 || ex.type === 'terminal' || status === 'incorrect' || status === 'partial')
      ? '<div class="fb-items">' + c.items.map(fbItemRow).join('') + '</div>' : '';
    var canon = (ex.type === 'terminal')
      ? '<div class="art-label" style="font-family:var(--font-mono);font-size:.72rem;color:var(--text-secondary);text-transform:uppercase;margin-top:8px">Canonical command (copyable)</div>' +
        '<div class="canon">' + esc(ex.canonical) + '</div>' : '';
    var study = (status !== 'correct' && ex.study) ? '<div class="fb-study">📚 <b>What to study:</b> ' + esc(ex.study) + '</div>' : '';
    var hintPanel = A.hintShown ? '<div class="fb-hint">💡 <b>Hint used:</b> ' + esc(ex.hint) + '</div>' : '';
    $('#fbzone').innerHTML = '<div class="fb ' + cls + '" role="alert" aria-live="polite">' +
      '<div class="fb-head">' + head + '</div><div class="fb-body">' + creditLine + rows + canon +
      '<p>' + ex.explanation + '</p>' + study + hintPanel + '</div></div>';
    var bn = $('#btn-next');
    bn.classList.remove('hidden');
    var last = (S.mode !== 'review-return') && (S.cur >= S.order.length - 1);
    bn.textContent = last ? 'Final Submit →' : 'Next ▸';
    $('#btn-check').disabled = true;
    /* lock widgets */
    $all('#answerArea button, #answerArea input').forEach(function (b) { b.disabled = true; });
    var note = $('#checknote');
    if (note) note.textContent = '⏸ Timer paused while you review this feedback — it resumes when you press ' + (last ? 'Final Submit' : 'Next') + '.';
  }

  function onHint() {
    var ex = currentEx();
    if (!ex || S.checked[ex.id]) return;
    var A = S.answers[ex.id];
    if (A.hintUsed) return;
    A.hintUsed = true; A.hintShown = true;
    var old = $('#fb-hint-box'); if (old) old.remove();
    var d = document.createElement('div');
    d.className = 'fb-hint'; d.id = 'fb-hint-box';
    d.setAttribute('role', 'note');
    d.innerHTML = '💡 <b>Hint (−10% of this exercise credit):</b> ' + esc(ex.hint);
    $('#answerArea').parentNode.appendChild(d);
    syncHeaderButtons();
  }

  function onNext() {
    var wasReview = (S.mode === 'review-return');
    if (S.timer.state === 'PAUSED_AUTO_CHECK') S.timer.state = 'RUNNING';
    if (S.mode === 'exam' && S.cur >= S.order.length - 1) { goReview(false); return; }
    if (wasReview) { goReview(false); return; }
    nextExercise();
  }

  function onSkip() {
    var ex = currentEx();
    if (!ex || S.checked[ex.id]) return;
    if (S.mode === 'exam' && S.skipped.indexOf(S.cur) === -1) S.skipped.push(S.cur);
    if (S.mode === 'review-return') { goReview(false); return; }
    if (S.cur >= S.order.length - 1) { goReview(false); return; }
    S.cur += 1; /* timer keeps running through a skip */
    renderExercise();
  }

  /* ---------------- review skipped ---------------- */
  function goReview(fromTimeUp) {
    S.mode = 'review';
    var rows = S.skipped.map(function (qi) {
      var ex = S.exercises[S.order[qi]];
      return '<div class="rv-item"><span class="rv-ic">⚠</span><span class="rv-title">' + esc(ex.summary) + '</span>' +
        '<span class="badge part">Skipped</span>' +
        (fromTimeUp ? '' : '<button class="btn small next" data-rv="' + qi + '">Answer now ▸</button>') + '</div>';
    }).join('');
    var notice = fromTimeUp
      ? '<p style="color:var(--state-incorrect)"><b>⏱ Time is over.</b> You can no longer answer. Skipped exercises are excluded from the score.</p>'
      : '<p style="color:var(--text-secondary)">You can return to any skipped exercise as many times as you need, until the timer ends or you submit. Skipped-and-never-answered exercises are excluded from the score (they count neither for you nor against you).</p>';
    setView(headerHTML('Review skipped exercises') +
      '<div class="card"><h2>⚠ Review skipped exercises</h2>' + notice +
      (S.skipped.length ? rows : '<p class="rv-empty">No skipped exercises in this attempt.</p>') +
      '<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">' +
      '<button class="btn primary" id="btn-finish">▶ Finish &amp; see results</button></div></div>');
    bindHeaderButtons();
    $('#btn-finish').onclick = renderResults;

<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
