<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>T1563 — EXTREMELY HARD practice exam</title>
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<script type="application/json" id="cm-exercise-meta">
{
  "topicId": "t1563",
  "batch": 4,
  "title": "T1563 Remote Service Session Hijacking — EXTREMELY HARD",
  "difficulty": "extremely-hard",
  "questionCount": 15,
  "estimatedMinutes": 48,
  "passMark": 70
}
</script>
<style>
:root{
  --bg-page:#0b1020;
  --bg-surface:#121a2e;
  --bg-surface-2:#0f1729;
  --border:#243049;
  --border-strong:#33415f;
  --border-faint:#3a4a6e;
  --text-primary:#e6ecff;
  --text-secondary:#a9b4d0;
  --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff;
  --accent-amber:#ffb454;
  --accent-green:#57d38c;
  --accent-green-hover:#6fdda0;
  --accent-amber-hover:#ffc477;
  --state-correct:#57d38c;
  --state-partial:#ffb454;
  --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0;
  --state-paused:#9d7bff;
  --sev-easy:#57d38c;
  --sev-medium:#ffb454;
  --sev-hard:#ff8a3d;
  --sev-extreme:#ff6b6b;
  /* derived tints — every derived colour is defined here, once */
  --bg-inset:#0c1222;
  --bg-option:#0e1628;
  --bg-option-hover:#141d33;
  --bg-option-selected:#102419;
  --bg-btn-hover:#182238;
  --bg-seg:#1a2440;
  --bg-terminal:#080d1a;
  --bg-term-row:#0a1020;
  --bg-header-veil:rgba(11,16,32,.96);
  --overlay:rgba(11,16,32,.97);
  --accent-blue-tint:rgba(90,169,255,.08);
  --accent-blue-tint-soft:rgba(90,169,255,.05);
  --accent-amber-tint:rgba(255,180,84,.08);
  --accent-green-tint:rgba(87,211,140,.08);
  --correct-tint:rgba(87,211,140,.07);
  --incorrect-tint:rgba(255,107,107,.06);
  --correct-glow:rgba(87,211,140,.18);
  --veil-strong:rgba(255,255,255,.14);
  --veil-faint:rgba(255,255,255,.02);
  --shadow-card:0 6px 18px rgba(0,0,0,.35);
  --hl-time:#9fb6e8;
  --on-easy:#08120b;
  --on-medium:#1d1204;
  --on-hard:#190b03;
  --on-extreme:#1d0505;
  --on-green:#08120b;
  --on-amber:#1d1204;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{color-scheme:dark;background:var(--bg-page);}
body{
  background:var(--bg-page);
  color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.55;
  min-height:100vh;
}
.mono,.mono-inline,code,kbd,pre,.log-line,.term-input,.term-line{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;
}
.mono-inline{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:4px;padding:0 5px;color:var(--text-mono);font-size:.92em;}
button{font:inherit;color:inherit;cursor:pointer;}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:6px;}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px;}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-card);}
.muted{color:var(--text-secondary);}
.small{font-size:13.5px;}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;letter-spacing:.4px;border:1px solid transparent;min-height:28px;}
.sev-easy{color:var(--on-easy);background:var(--sev-easy);border-color:var(--sev-easy);}
.sev-medium{color:var(--on-medium);background:var(--sev-medium);border-color:var(--sev-medium);}
.sev-hard{color:var(--on-hard);background:var(--sev-hard);border-color:var(--sev-hard);}
.sev-extreme{color:var(--on-extreme);background:var(--sev-extreme);border-color:var(--sev-extreme);}
.state-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;border:1px solid var(--border);background:var(--bg-surface-2);}
.st-correct{color:var(--state-correct);border-color:var(--state-correct);}
.st-partial{color:var(--state-partial);border-color:var(--state-partial);}
.st-incorrect{color:var(--state-incorrect);border-color:var(--state-incorrect);}
.st-skipped{color:var(--state-skipped);}
.st-paused{color:var(--state-paused);border-color:var(--state-paused);}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-primary);padding:10px 18px;min-height:44px;font-weight:600;transition:background .15s ease,border-color .15s ease,transform .05s ease;}
.btn:hover{background:var(--bg-btn-hover);border-color:var(--border-strong);}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn-primary{background:var(--accent-green);border-color:var(--accent-green);color:var(--on-green);}
.btn-primary:hover{background:var(--accent-green-hover);border-color:var(--accent-green-hover);}
.btn-amber{background:var(--accent-amber);border-color:var(--accent-amber);color:var(--on-amber);}
.btn-amber:hover{background:var(--accent-amber-hover);border-color:var(--accent-amber-hover);}
.btn-ghost{background:transparent;}
.btn-danger{border-color:var(--state-incorrect);color:var(--state-incorrect);background:transparent;}

/* ---------- intro ---------- */
.intro-hero{padding:22px 22px 18px;}
.intro-hero h1{margin:0 0 6px;font-size:24px;line-height:1.25;}
.intro-facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.fact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13.5px;color:var(--text-secondary);}
.fact b{color:var(--text-primary);}
.section-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin:26px 0 10px;color:var(--text-primary);}
.section-title .dot{width:10px;height:10px;border-radius:3px;background:var(--accent-blue);display:inline-block;}
.section-body{padding:18px 20px;}
.section-body p{margin:0 0 12px;}
.theme-panel{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin-bottom:12px;}
.theme-panel h4{margin:0 0 8px;font-size:14px;color:var(--accent-blue);text-transform:uppercase;letter-spacing:.6px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:var(--bg-inset);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--text-primary);}
.rules{margin:0;padding-left:20px;}
.rules li{margin-bottom:9px;}
.type-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px;}
.start-row{display:flex;justify-content:center;padding:6px 0 20px;}
.start-btn{font-size:18px;padding:14px 44px;border-radius:10px;}

/* ---------- sticky header ---------- */
.exam-header{position:sticky;top:0;z-index:50;background:var(--bg-header-veil);border-bottom:1px solid var(--border);backdrop-filter:blur(6px);}
.exam-header-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
.hd-count{font-weight:800;font-size:15px;white-space:nowrap;}
.hd-timer{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:6px 12px;font-weight:700;}
.hd-timer .t{font-variant-numeric:tabular-nums;letter-spacing:1px;}
.hd-score{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:6px 12px;font-weight:700;}
.hd-score .s{color:var(--accent-green);font-variant-numeric:tabular-nums;}
.spacer{flex:1 1 auto;}
.hd-btns{display:flex;gap:8px;flex-wrap:wrap;}
.btn-slim{padding:6px 12px;min-height:44px;font-size:13.5px;}

/* ---------- progress ---------- */
.progress{max-width:980px;margin:0 auto;padding:0 16px 8px;}
.progress-bar{display:flex;gap:3px;height:8px;border-radius:6px;overflow:hidden;background:var(--bg-surface-2);position:relative;}
.seg{flex:1 1 0;background:var(--bg-seg);border-radius:2px;min-width:6px;transition:background .3s ease;}
.seg.ok{background:var(--state-correct);}
.seg.partial{background:var(--state-partial);}
.seg.bad{background:var(--state-incorrect);}
.seg.skipped{background:var(--state-skipped);opacity:.55;}
.seg.cur{background:var(--sev-color,var(--accent-blue));box-shadow:0 0 8px var(--sev-color,var(--accent-blue));}
.progress-bar::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,var(--veil-strong) 50%,transparent 80%);transform:translateX(-100%);animation:sheen 3.2s ease-in-out infinite;pointer-events:none;}
@keyframes sheen{0%{transform:translateX(-100%);}55%{transform:translateX(100%);}100%{transform:translateX(100%);}}

/* ---------- exercise blocks ---------- */
.ex-meta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 4px;}
.block{margin-top:16px;border:1px solid var(--border);border-radius:10px;background:var(--bg-surface);overflow:hidden;}
.block-h{display:flex;align-items:center;gap:10px;padding:9px 14px;font-weight:800;font-size:13.5px;letter-spacing:1.2px;border-bottom:1px solid var(--border);}
.block-h .ic{font-size:15px;}
.bl-scenario .block-h{color:var(--accent-blue);background:var(--accent-blue-tint);}
.bl-question .block-h{color:var(--accent-amber);background:var(--accent-amber-tint);}
.bl-answer .block-h{color:var(--accent-green);background:var(--accent-green-tint);}
.bl-feedback .block-h{background:var(--veil-faint);}
.block-b{padding:14px 16px;}
.block-b p{margin:0 0 10px;}
.collapse-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text-secondary);border-radius:6px;padding:3px 10px;font-size:12px;min-height:36px;}
.summary-line{padding:9px 14px;font-size:13px;color:var(--text-secondary);border-bottom:1px dashed var(--border);}
.artefact{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);margin:10px 0;overflow:hidden;}
.artefact-h{padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--accent-blue);border-bottom:1px solid var(--border);background:var(--accent-blue-tint-soft);}
.artefact .prose{padding:10px 14px;font-size:14.5px;}
.codeblock{margin:0;padding:10px 12px;overflow-x:auto;white-space:pre;}
.log-line{font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--text-mono);}
.hl-t{color:var(--hl-time);}
.hl-ioc{color:var(--accent-amber);}
.hl-bad{color:var(--state-incorrect);font-weight:700;}
.hl-warn{color:var(--state-partial);}
.hl-cmd{color:var(--accent-green);font-weight:700;}
.hl-flag{color:var(--state-paused);}
.hl-str{color:var(--text-mono);}
.hl-path{color:var(--accent-blue);}
.log-toolbar{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg-surface-2);}
.log-filter{flex:1;background:var(--bg-inset);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);padding:7px 10px;font-size:13.5px;min-height:44px;}
.log-count{font-size:12px;color:var(--text-secondary);white-space:nowrap;}
.log-body{max-height:340px;overflow-y:auto;padding:8px 12px;}
.log-body::-webkit-scrollbar{width:10px;}
.log-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
.log-body::-webkit-scrollbar-track{background:var(--bg-surface-2);}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--bg-option);border:1px solid var(--border);border-radius:8px;padding:12px 14px;min-height:48px;color:var(--text-primary);transition:background .12s ease,border-color .12s ease;}
.opt:hover{background:var(--bg-option-hover);}
.opt .letter{font-weight:800;color:var(--text-secondary);flex:0 0 auto;}
.opt.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset,0 0 10px var(--correct-glow);background:var(--bg-option-selected);}
.opt.selected .sel-mark{color:var(--accent-green);}
.opt.disabled{opacity:.75;cursor:default;}
.sel-mark{margin-left:auto;font-size:12px;font-weight:800;color:var(--text-secondary);white-space:nowrap;}

/* ---------- drag & drop ---------- */
.dd-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:720px){.dd-grid{grid-template-columns:1fr 1fr;}}
.bank{border:1px dashed var(--border-strong);border-radius:8px;padding:10px;min-height:56px;display:flex;flex-wrap:wrap;gap:8px;background:var(--bg-inset);}
.dchip{background:var(--bg-option-hover);border:1px solid var(--border-strong);border-radius:8px;padding:8px 12px;font-size:13.5px;min-height:44px;color:var(--text-primary);}
.dchip.grab{cursor:grab;}
.dchip.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.zone{border:1px solid var(--border);border-radius:8px;background:var(--bg-option);padding:10px;min-height:96px;}
.zone.over{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.zone h5{margin:0 0 8px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-secondary);}
.zone-items{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;}
.bank-label{font-size:12.5px;font-weight:700;letter-spacing:.6px;color:var(--text-secondary);margin:0 0 6px;text-transform:uppercase;}

/* ---------- order ---------- */
.ord-list{display:flex;flex-direction:column;gap:8px;}
.ord-row{display:flex;align-items:center;gap:10px;background:var(--bg-option);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
.ord-pos{flex:0 0 30px;text-align:center;font-weight:800;color:var(--text-secondary);}
.ord-text{flex:1;font-size:14.5px;}
.ord-btns{display:flex;gap:4px;}
.ord-btns button{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;width:44px;height:44px;font-size:14px;}
.ord-row.dragging{opacity:.4;}
.ord-row .handle{cursor:grab;color:var(--text-secondary);font-size:15px;}

/* ---------- match ---------- */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:620px){.match-grid{grid-template-columns:1fr;}}
.match-col{display:flex;flex-direction:column;gap:8px;}
.mitem{background:var(--bg-option);border:1px solid var(--border);border-radius:8px;padding:10px 12px;text-align:left;min-height:46px;color:var(--text-primary);}
.mitem.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.mitem.used{opacity:.4;pointer-events:none;}
.pairs-list{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
.pair-row{display:flex;align-items:center;gap:8px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13.5px;}
.pair-row .x{margin-left:auto;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--state-incorrect);width:44px;height:44px;min-width:44px;}

/* ---------- fill blank ---------- */
.fb-sentence{font-size:16px;line-height:2;word-break:break-word;}
.blank-btn{display:inline-block;min-width:90px;min-height:44px;background:var(--bg-inset);border:1px dashed var(--border-faint);border-radius:6px;color:var(--text-mono);padding:2px 10px;text-align:center;}
.blank-btn.filled{border-style:solid;border-color:var(--accent-green);color:var(--accent-green);}
.blank-btn.selected{border-color:var(--accent-amber);box-shadow:0 0 0 1px var(--accent-amber) inset;}

/* ---------- terminal ---------- */
.term{background:var(--bg-terminal);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.term-bar{display:flex;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--border);background:var(--bg-surface-2);font-size:12px;color:var(--text-secondary);}
.term-dot{width:10px;height:10px;border-radius:50%;background:var(--border);display:inline-block;}
.term-scroll{max-height:260px;overflow-y:auto;padding:10px 12px;font-size:13.5px;}
.term-line{white-space:pre-wrap;word-break:break-word;color:var(--text-mono);line-height:1.6;}
.term-prompt{color:var(--accent-green);font-weight:700;}
.term-err{color:var(--state-incorrect);}
.term-ok{color:var(--state-correct);}
.term-input-row{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);padding:9px 12px;background:var(--bg-term-row);}
.term-input{flex:1;background:transparent;border:none;color:var(--text-mono);font-size:14px;min-height:44px;}
.term-input:focus{outline:none;}
.syntax-panel{border:1px solid var(--border);border-left:3px solid var(--accent-blue);border-radius:8px;background:var(--bg-surface-2);padding:10px 14px;margin-top:10px;font-size:13.5px;}
.syntax-panel h6{margin:0 0 6px;color:var(--accent-blue);font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;}

/* ---------- branching ---------- */
.step-badge{display:inline-flex;align-items:center;gap:8px;background:var(--bg-surface-2);border:1px solid var(--border);color:var(--accent-amber);border-radius:999px;padding:3px 12px;font-weight:800;font-size:12.5px;letter-spacing:.8px;margin-bottom:10px;}
.step-verdict{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);font-size:14px;}
.step-actions{display:flex;gap:10px;margin-top:12px;}

/* ---------- feedback ---------- */
.fb-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;}
.fb-title{font-size:16px;font-weight:800;}
.fb-credit{font-size:14px;font-weight:700;color:var(--state-partial);}
.item-rows{margin:12px 0;display:flex;flex-direction:column;gap:6px;}
.item-row{display:flex;align-items:flex-start;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;}
.item-row .mk{flex:0 0 auto;font-weight:800;}
.mk-c{color:var(--state-correct);}
.mk-w{color:var(--state-incorrect);}
.mk-m{color:var(--state-skipped);}
.persp{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px;}
@media(min-width:720px){.persp{grid-template-columns:1fr 1fr;}}
.persp .p-card{border:1px solid var(--border);border-radius:8px;padding:10px 14px;background:var(--bg-surface-2);font-size:14px;}
.persp .p-card h6{margin:0 0 6px;font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;}
.p-card.red h6{color:var(--state-incorrect);}
.p-card.blue h6{color:var(--accent-blue);}
.study-tip{margin-top:12px;border:1px solid var(--border);border-left:3px solid var(--accent-amber);border-radius:8px;background:var(--bg-surface-2);padding:9px 12px;font-size:14px;color:var(--text-primary);}
.canon{margin-top:12px;}
.canon h6{margin:0 0 6px;font-size:12.5px;letter-spacing:.8px;color:var(--accent-green);text-transform:uppercase;}
.canon pre{background:var(--bg-terminal);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text-mono);font-size:14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;}
.canon ul{margin:6px 0 0;padding-left:20px;color:var(--text-secondary);font-size:13.5px;}
.canon li{margin-bottom:4px;}

/* ---------- review / results ---------- */
.review-list{display:flex;flex-direction:column;gap:10px;}
.review-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 14px;}
.review-row .q{flex:1;min-width:200px;font-size:14.5px;}
.result-hero{padding:26px 22px;text-align:center;}
.result-pct{font-size:52px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
.pass-panel{border:2px solid var(--state-correct);background:var(--correct-tint);}
.fail-panel{border:2px solid var(--state-incorrect);background:var(--incorrect-tint);}
.res-break{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px;}
@media(min-width:640px){.res-break{grid-template-columns:1fr 1fr;}}
.res-cell{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;font-size:14.5px;}
.res-cell b{font-size:22px;font-variant-numeric:tabular-nums;}
.paused-overlay{position:fixed;inset:0;z-index:100;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:20px;}
.paused-card{max-width:460px;width:100%;text-align:center;padding:30px 24px;border-color:var(--state-paused);}
.paused-card .big{font-size:44px;color:var(--state-paused);}

"use strict";
var EXAM = {"meta":{"topicId":"t1563","batch":4,"title":"T1563 Remote Service Session Hijacking — EXTREMELY HARD","difficulty":"extremely-hard","questionCount":15,"estimatedMinutes":48,"passMark":70,"mitreId":"T1563","mitreName":"Remote Service Session Hijacking","objectType":"Technique","severityLabel":"EXTREMELY HARD","partLabel":null},"intro":{"learn":["This is the expert tier for T1563 Remote Service Session Hijacking. Exercises chain three or more concepts and include **conflicting signals**: artefacts that point in different directions, and you must state which one wins and why.","The scenario spans two weeks at Northgate Energy: task-force case NG-2941, a session-hijacking intrusion that reached from the jump host ngc-jmp-01 toward ngc-fs-07 and ngc-dc-02. Expect noise, gaps in telemetry, and stakeholders who demand actions that would destroy volatile evidence.","In several exercises the correct answer is **restraint**: gather more evidence, or take the surgical action instead of the destructive one. Confidence language in your answers matters as much as the technical call."],"keywords":[{"theme":"Pivot chains","items":["bastion to internal hosts via inherited sessions","hijacked user's tokens and mapped drives","two-week task-force scope discipline"]},{"theme":"Detection engineering","items":["auditd watches on agent sockets","Sysmon EID 1 with tscon command line","logon-session churn correlation"]},{"theme":"Conflict resolution","items":["consent record vs destination mismatch","which signal wins and why","reasoning around missing telemetry"]},{"theme":"Costly decisions","items":["killing sessions destroys volatile evidence","session time limits vs usability","agent forwarding vs developer workflow"]},{"theme":"Reporting discipline","items":["T1563.001 and T1563.002 wording","T1021 contrast in report language","confidence and scope statements"]}],"types":["Multiple choice","Log analysis","Drag & drop","Timeline ordering","Matching","Fill in the blank","Terminal (fake shell)","Branching scenario"]},"exercises":[{"id":"e01","type":"branching","scenario":{"text":["Tuesday, 07:15. The Northgate Energy task force (case NG-2941) hands you overnight findings from the shared jump host ngc-jmp-01. The CISO joins the 08:00 bridge and expects a working hypothesis, a scope statement, and a decision on the live sessions."],"artefacts":[{"label":"Session table — ngc-jmp-01","code":" SESSIONNAME   USERNAME    ID  STATE   TYPE     DEVICE\n services                  0  Disc\n console       d.okafor    3  Active\n>rdp-tcp#0     svc-sync    5  Active\n rdp-tcp                65536  Listen"},{"label":"sshd log — ngc-jmp-01","code":"23:41:02 sshd[4311]: Accepted publickey for svc-deploy from 10[.]20[.]7[.]19 port 51422\n23:44:55 sshd[4311]: agent forwarding enabled (socket /tmp/ssh-Zk9p/agent.6104)\n23:52:10 ssh[6104]: connect to ngc-fs-07 (10[.]20[.]8[.]30) port 22 as svc-deploy"},{"label":"auditd — ngc-jmp-01","code":"23:52:04 auditd: open /tmp/ssh-Zk9p/agent.6104 pid=6104 uid=svc-sync owner-uid=1012(svc-deploy)\n23:52:09 auditd: sendmsg on agent.6104 pid=6104 result=granted"},{"label":"EDR alert — ngc-jmp-01","code":"23:52:11 MED pid=6104 parent=sshd-session user=svc-sync note=socket-mismatch agent=agent.6104"}]},"question":"Work the bridge one decision at a time.","steps":[{"continuation":"Four artefacts, one pid recurring across three of them: 6104. The session table shows svc-sync holding an active RDP session on the same jump host.","question":"Which hypothesis do you take into the 08:00 bridge?","options":["svc-sync brute-forced the svc-deploy account overnight","The actor reused svc-deploy's live session through its forwarded agent to reach ngc-fs-07","A backup script misconfiguration copied files to ngc-fs-07","The VPN gateway was exploited with a zero-day"],"correct":1},{"continuation":"The bridge accepts the reuse hypothesis and asks: how far did the chain reach? Your artefacts end at ngc-fs-07. ngc-dc-02 appears in an unrelated laptop alert from last week.","question":"What scope statement do you give?","options":["Only ngc-jmp-01 — close the investigation there","All of Northgate Energy must be treated as compromised","ngc-jmp-01 and ngc-fs-07 are confirmed; ngc-dc-02 stays unconfirmed until host-side artefacts exist","Scope cannot be stated at all"],"correct":2},{"continuation":"The CISO wants every session killed now. The svc-deploy session on ngc-jmp-01 is still live and authenticated to the build infrastructure.","question":"Which action do you take on the jump host?","options":["Freeze-and-capture first: export the process tree, socket handles and session table, then kill only pid 6104 and rotate what the agent could reach","Kill every SSH session and stop sshd on ngc-jmp-01","Reimage ngc-jmp-01 and ngc-fs-07 tonight","Do nothing at all until the two-week report is due"],"correct":0}],"hint":"Three artefacts name the same pid; the fourth names a host. Let the evidence set the scope, not the anxiety.","explanation":["Step 1: the cross-uid socket open (23:52:04), the granted signing request (23:52:09) and the agent-authenticated connect to ngc-fs-07 (23:52:10) form one chain by pid 6104 — reuse of svc-deploy's live session, not a brute force, a backup quirk, or a gateway exploit nobody has artefacts for.","Step 2: scope discipline survives scrutiny only if you claim exactly what the artefacts show: jmp-01 and fs-07 confirmed, dc-02 unconfirmed. Overclaiming ('all compromised') or refusing to state scope both fail the bridge.","Step 3: freeze-and-capture before any kill. Killing pid 6104 alone stops the signing; rotating keys and revoking the agent session closes the path. Killing every session or reimaging destroys the volatile evidence the two-week case still needs, and doing nothing concedes the pivot."],"perspectives":{"attacker":"The forwarded agent on a shared jump host is a standing pivot: one socket read, and the whole build network signs for you.","defender":"Correlate by pid across auditd, sshd and EDR before the bridge — the chain, not any single line, is the case."},"study":"Study pivot-chain analysis across bastion telemetry: auditd, sshd, session tables."},{"id":"e02","type":"log-qcm","scenario":{"text":["Legal asks the task force to prove the ngc-fs-07 access came from the hijacked agent rather than a stolen key. The ngc-jmp-01 stream for 23:40–00:15 is below; the 02:00 backup job also runs as svc-sync and hits sockets fleet-wide at that hour only."]},"log":{"title":"auth + auditd — ngc-jmp-01","lines":["23:40:59 sshd[4311]: Accepted publickey for svc-deploy from 10[.]20[.]7[.]19 port 51422","23:41:00 auditd: socket /tmp/ssh-Zk9p/agent.6104 owned by uid=1012 (svc-deploy)","23:44:55 sshd[4311]: agent forwarding enabled for svc-deploy","23:47:31 cron: /opt/ngc/bin/backup-sync started as svc-sync","23:52:04 auditd: open /tmp/ssh-Zk9p/agent.6104 pid=6104 uid=990(svc-sync) owner-uid=1012","23:52:09 auditd: sendmsg on agent.6104 pid=6104 uid=990 result=granted","23:52:11 auditd: execve /usr/bin/ssh pid=6104 uid=990","23:52:12 ssh[6104]: connect to ngc-fs-07 (10[.]20[.]8[.]30) port 22 as svc-deploy","00:03:17 ssh[6104]: session opened on ngc-fs-07 as svc-deploy","00:14:02 sudo: svc-sync : command not allowed ; TTY=pts/3"]},"question":"Which pair of lines, together, proves agent-assisted access rather than a stolen key?","answer":{"options":["The 23:40:59 publickey accept and the 23:44:55 forwarding line","The 23:47:31 cron start and the 00:14:02 sudo denial","The 23:52:04 cross-uid socket open and the 23:52:12 connect by the same pid 6104","The 23:41:00 ownership line and the 00:03:17 session open"],"correct":2},"hint":"A stolen key would authenticate on its own; you are looking for proof the agent did the signing — and for whom.","explanation":["The 23:52:04 open shows the wrong uid (svc-sync) touching a socket owned by svc-deploy; the 23:52:12 connect shows the **same pid 6104** then authenticating to ngc-fs-07. Cross-uid read plus immediate agent-borne connect by one pid is the proof chain.","The publickey accept and forwarding lines are the legitimate session being abused — necessary context, not proof. The cron line explains the 02:00 benign pattern, not a 23:52 one, and the sudo denial is noise.","The ownership-plus-session-open pair spans two different processes and proves possession of the target, not the path."],"study":"Practise building proof chains that pair a mismatch event with the same-pid action that follows it."},{"id":"e03","type":"qcm-single","scenario":{"text":["The vendor's lawyer-ready position: the 22:05 tscon on ngc-fs-07 was helpdesk shadowing. Three artefacts are in front of you: the helpdesk tool log (shadow console opened for m.hartley with consent at 22:01, closed 22:03), the Sysmon line (22:05:40 tscon.exe 4 /dest:rdp-tcp#1, parent services.exe, user SYSTEM), and the change calendar (nothing scheduled for ngc-fs-07 that night)."],"artefacts":[{"label":"Shadow tool log — ngc-fs-07","code":"22:01:12 shadow start target=m.hartley consent=granted\n22:03:44 shadow end target=m.hartley"},{"label":"Sysmon EID 1 — ngc-fs-07","code":"22:05:40 proc=tscon.exe parent=services.exe user=NT AUTHORITY\\SYSTEM cmd=tscon 4 /dest:rdp-tcp#1"}]},"question":"Which signal wins, and why?","answer":{"options":["The shadow log wins — a shadow session close in time explains the alert","The change calendar wins — an empty calendar proves nothing happened at all","The Sysmon line wins — the shadow tool produces its own consented ancestry, not services.exe, and /dest has no consent record","Neither wins — the signals cannot be reconciled without the vendor's internal logs"],"correct":2},"hint":"Ask what the shadow tool's own process tree would have looked like if the shadowing explanation were true.","explanation":["The Sysmon line wins: a consented shadow leaves its own process ancestry and its own consent record, and it ended at 22:03 — two minutes before a services.exe-parented tscon redirected session 4. Nothing in the consent log covers a /dest redirect.","Proximity in time is the weak signal; mechanism is the strong one. An empty change calendar cannot prove a negative, and waiting for vendor logs surrenders the timeline you already hold.","This is the conflicting-signal discipline: when two explanations compete, the one that matches the mechanism and the record wins; the one that matches only the clock loses."],"study":"Study shadow-protocol mechanics versus tscon redirects: consent, ancestry, and session naming."},{"id":"e04","type":"dragdrop","scenario":{"text":["The two-week report needs clean separation before legal review: which artefacts show session REUSE (T1563) and which show FRESH AUTHENTICATION (T1021)?"]},"question":"Drag each artefact into the correct zone.","answer":{"zones":[{"name":"Session reuse (T1563)"},{"name":"Fresh authentication (T1021)"}],"items":[{"text":"tscon 4 /dest:rdp-tcp#1 run as SYSTEM","zone":0},{"text":"4624 type 10 for svc.patch with a valid password from the VPN pool","zone":1},{"text":"agent.6104 read by uid svc-sync, then an agent-signed SSH session","zone":0},{"text":"sshd accepted a publickey never before seen for svc-deploy","zone":1},{"text":"4778 reconnect of m.hartley with no new 4624 for m.hartley","zone":0},{"text":"4624 type 9 with explicit credentials for the svc-patch account","zone":1}]},"hint":"Reuse inherits; fresh auth presents something new — a password, a new key, explicit credentials.","explanation":["Reuse zone: the SYSTEM-borne tscon redirect, the cross-uid agent read followed by agent-signed access, and reconnect churn with no matching logon — all inherit an existing session.","Fresh-authentication zone: a valid password over RDP from the VPN pool, a first-seen publickey, and a type-9 logon with explicit credentials all present something new to the target.","The first-seen publickey is the near-miss: it touches the same account as the agent case, but a new key is new material — T1021, not T1563."],"study":"Study the T1021-versus-T1563 boundary: what the adversary presents to the target's logon path."},{"id":"e05","type":"branching","scenario":{"text":["Friday, 16:50. Task-force war room, exec readout at 17:30. Four artefacts and one known gap: the Sysmon stream for ngc-fs-07 between 22:04 and 22:06 is missing (the collector was down), so the minutes around the tscon are dark."],"artefacts":[{"label":"EDR alert — ngc-fs-07","code":"22:05:41 HIGH proc=tscon.exe cmd=tscon 4 /dest:rdp-tcp#1 user=NT AUTHORITY\\SYSTEM"},{"label":"Helpdesk ticket NG-2941","text":"Shadow session for m.hartley on ngc-fs-07, consent granted, 22:01–22:03, analyst s.ferrand."},{"label":"Sysmon EID 1 — ngc-fs-07","code":"22:05:40 proc=tscon.exe parent=services.exe user=SYSTEM cmd=tscon 4 /dest:rdp-tcp#1"},{"label":"Vendor chat — relayed","text":"Vendor lead: 'we also reset a hung session on fileserver-01 last night' — no ticket number, no time, no account."}]},"question":"Work the readout one decision at a time.","steps":[{"continuation":"The shadow record covers 22:01–22:03. The tscon fired at 22:05:40 from a services.exe parent. The collector gap covers exactly 22:04–22:06.","question":"What do you tell the execs at 17:30?","options":["Confirmed benign — the shadow ticket explains everything on that host","Confirmed T1563.002 hijack on ngc-fs-07","Unexplained takeover event: the shadow record ends before it, the parent is unexplained, and we are gathering more evidence before we call it a hijack","Confirmed vendor breach — the chat message is a confession"],"correct":2},{"continuation":"At 18:10 you recover the missing Sysmon slice: 22:05:12 event 7045 — PSEXESVC service installed, no change record; 22:05:40 tscon as its child. The vendor's shadow tooling has its own signed binary and its own ancestry.","question":"Which signal now wins?","options":["The consent ticket — helpdesk teams use psexec legitimately all the time","The 22:01 consent event — it covers the whole evening on that host","The chat message — it proves the vendor performed the action","The service-install path with no change record — the shadow tool has its own binary and consented ancestry, so this tscon is separate and hostile"],"correct":3},{"continuation":"The execs approve 'any action necessary'. m.hartley's session on ngc-fs-07 is still live, with finance shares mapped. Legal has requested a forensically sound timeline.","question":"Which action do you take?","options":["Log off m.hartley's session immediately to cut the access path","Reboot ngc-fs-07 now and image it afterwards","Capture memory of the live session and the process tree first, then disconnect surgically — accept that finance shares stay exposed for roughly twenty minutes","Leave everything running until Monday to avoid any business impact"],"correct":2}],"hint":"The readout language is 'unexplained', not 'confirmed' — and the recovered slice changes which record is the anomaly.","explanation":["Step 1: with the collector gap exactly over the incident minute, neither 'confirmed benign' nor 'confirmed hijack' is defensible. The senior answer names the anomaly, states what is missing, and commits to gathering evidence.","Step 2: the recovered slice settles it — a PSEXESVC install with no change record, spawning the tscon, is mechanism the shadow tool cannot produce (its own signed binary, consented ancestry, tool-logged start/end). The consent ticket and the unverified chat message lose to the record.","Step 3: the costly trade-off is explicit: capture-first keeps the volatile evidence legal needs, at the price of leaving mapped shares exposed for minutes. Logging off or rebooting destroys the session state; leaving it running indefinitely concedes continued access."],"perspectives":{"attacker":"Staging the hijack two minutes after a legitimate shadow ends is deliberate cover — the consent record becomes the confusion asset.","defender":"When telemetry has a hole exactly over the event, your verdict language is 'unexplained, gathering evidence' — nothing stronger."},"study":"Study senior-triage wording: verdicts that match evidence completeness, and capture-before-contain sequencing."},{"id":"e06","type":"order","scenario":{"text":["The timeline panel needs the RDP-leg chain reconstructed for the two-week report. Each step must make the next one possible."]},"question":"Order the steps from first to last.","answer":{"mode":"timeline","items":["The actor lands on ngc-jmp-01 during the patch window","An unrecorded service install gives the actor SYSTEM","tscon /dest redirects m.hartley's live session into the actor's window","Inside the hijacked session the actor reads m.hartley's mapped shares","Using that inherited access the actor reaches ngc-fs-07 without new credentials"]},"hint":"No new credential appears at any step — each hop rides something the previous one opened.","explanation":["Foothold during the patch window (when admin sessions and changes are expected noise), SYSTEM via an unrecorded service, the tscon redirect, then the inherited environment: shares, tokens, mapped drives — and finally the reach into ngc-fs-07 that no logon ever explains.","The panel's value is the absence: at no point does a 4624 for m.hartley appear at the moment of access. Chains like this are why the T1021 explanation fails in the report."],"study":"Study lateral-movement timelines built from session inheritance rather than logon events."},{"id":"e07","type":"fillblank","scenario":{"text":["Detection engineering needs the new analytic written into the campaign notes. Complete the rule description from the bank."]},"question":"Fill every blank with a word from the bank.","answer":{"template":"The analytic fires when Sysmon Event ID 1 shows a session tool whose parent is ___ and whose command line carries ___ — and, independently, when an agent socket under /tmp/ssh-*/agent.* is opened by a uid that does not own it.","blanks":["services.exe","/dest:"],"bank":["services.exe","/dest:","explorer.exe","qwinsta.exe","/server:"]},"hint":"One blank is the impossible parent; the other is the flag that only exists when a redirect is intended.","explanation":["**services.exe** as the parent of a session utility is the service-borne path to SYSTEM; **/dest:** in the command line is the redirect intent — qwinsta never carries it, and /server: is the remote-listing flag, a read-only near-miss.","The two signals are independent: the parent catches the privilege path, the flag catches the act. Together they survive the benign admin tscon in a change window, which has neither property."],"study":"Study Sysmon EID 1 analytics for session tools: parentage and command-line flags."},{"id":"e08","type":"match","scenario":{"text":["The same telemetry produces different verdicts depending on context. Match each signal to the verdict the task force recorded."]},"question":"Click a left item, then its correct partner on the right.","answer":{"pairs":[{"left":"tscon under PSEXESVC inside an approved change window","right":"benign — verify the change ticket, then close"},{"left":"agent socket hits by svc-sync on 12 hosts at 02:00","right":"benign — matches the backup job pattern; verify the job id"},{"left":"agent socket read by an interactive user shell at 14:33","right":"likely hijack — no job explains a human-hours cross-uid read"},{"left":"type-10 logon from a new country, then 4778 reconnect of another user","right":"likely hijack — churn without a matching logon for that user"}]},"hint":"Two verdicts are benign and two are hostile — the time of day and the record behind each event decide.","explanation":["The change window and the 02:00 fleet-wide pattern both have records that explain them; verify once, then close. Verification, not trust, is what makes them benign.","The 14:33 cross-uid read has no job window to hide in, and the country-change logon followed by another user's reconnect is churn without a matching logon — both remain hijack verdicts.","The same three telemetry sources (tscon lineage, agent socket, churn) produce opposite verdicts — which is why keyword alerting alone fails at this tier."],"study":"Study verdict language: benign-with-verification versus likely-hijack, and what each requires."},{"id":"e09","type":"log-qcm","scenario":{"text":["Sysmon stream from ngc-fs-07, 01:10–01:20, three nights after the first event. The collector is healthy. The night team flagged nothing, but the task force asked for a second pass."]},"log":{"title":"Sysmon-like process events — ngc-fs-07","lines":["01:11:02 EID1 proc=dllhost.exe parent=svchost.exe user=SYSTEM (COM surrogate)","01:12:44 EID1 proc=wuauclt.exe parent=services.exe user=SYSTEM cmd=update scan","01:14:52 EID1 proc=C:\\Windows\\Temp\\tsc.exe parent=services.exe user=SYSTEM cmd=tsc 3 /dest:rdp-tcp#2","01:14:53 EID15 hash of C:\\Windows\\Temp\\tsc.exe matches tscon.exe SHA256 9f2c…","01:15:01 EID5 proc=tsc.exe terminated exit=0","01:16:20 EID1 proc=notepad.exe parent=explorer.exe user=NGC\\d.okafor","01:17:33 EID1 proc=qwinsta.exe parent=cmd.exe user=NGC\\svc.patch cmd=qwinsta","01:18:10 EID3 netconn proc=mstsc.exe dst=10[.]20[.]9[.]14:3389","01:19:41 EID1 proc=sc.exe parent=cmd.exe user=NGC\\svc.patch cmd=sc query wuauserv"]},"question":"Which line is the strongest evidence of a deliberately disguised session-tool execution?","answer":{"options":["The 01:14:53 hash match tying Temp\\tsc.exe to tscon.exe","The 01:17:33 qwinsta run by svc.patch","The 01:12:44 wuauclt update scan","The 01:18:10 RDP connection from mstsc"],"correct":0},"hint":"The night team saw nothing because nothing carried the name they alert on. Look for the name that should not exist.","explanation":["A binary in Temp whose hash matches tscon.exe, run as SYSTEM from services.exe with a /dest: flag, is a renamed session tool — the disguise only works against name-based alerting, and the hash defeats it.","The qwinsta listing is read-only and matches the patch account's documented behaviour. The update scan and the mstsc connection are routine for this host.","This is the 'looks benign but is alarming' pattern at expert level: the hostile line hides behind an ordinary-looking process name, so detection must key on hash, parentage and flags — not the file name."],"perspectives":{"attacker":"Renaming the utility and dropping it in Temp defeats every name-based rule while changing nothing about the technique.","defender":"Hash-match renamed binaries against your known-good catalogue; alert on /dest: wherever the file name is."},"study":"Study hash-based detection of renamed binaries and command-line analytics over file-name analytics."},{"id":"e10","type":"dragdrop","scenario":{"text":["Route each artefact to the host it implicates on the scope chart. One artefact implicates neither host."]},"question":"Drag each artefact to the host it implicates.","answer":{"zones":[{"name":"ngc-jmp-01"},{"name":"ngc-fs-07"},{"name":"Neither — noise"}],"items":[{"text":"auditd cross-uid open on agent.6104","zone":0},{"text":"PSEXESVC install with no change record","zone":1},{"text":"wuauclt update spawn at 01:12","zone":2},{"text":"4778 reconnect of m.hartley with no 4624","zone":0},{"text":"tsc.exe (hash matches tscon.exe) executed as SYSTEM","zone":1},{"text":"shadow consent for d.okafor on ngc-dc-02, ticket NG-2938","zone":2}]},"hint":"Two artefacts belong to a different host and ticket entirely — that is what noise looks like in scope work.","explanation":["ngc-jmp-01: the agent-socket mismatch and the m.hartley reconnect churn — both live on the jump host's session layer.","ngc-fs-07: the unrecorded PSEXESVC install and the renamed tscon execution — both are the Windows-side takeover path on the file server.","The update spawn is host noise, and the d.okafor shadow sits on ngc-dc-02 under a different ticket — realistic noise that belongs on neither host's chart."],"study":"Practise scope charting: artefact to host, with an explicit noise bucket."},{"id":"e11","type":"qcm-multi","scenario":{"text":["The steering group will only accept controls that survive the developer council and the finance close season (batch jobs run for hours on tier-1 servers; the patch group needs service installation). Select every control package the task force can defend."]},"question":"Select all control packages that are defensible under these constraints.","answer":{"options":["Restrict agent forwarding to per-host isolated agents; keep developer keys off shared hosts","Apply session time limits to tier-1 servers first, with a break-glass extension for close-season batch jobs","Ban all remote sessions from the jump host — the council will accept the workflow loss","Put EDR sensors and alerting on session tools (tscon, ssh-add, ssh-agent) rather than excluding them as noise","Block service installation by all administrators permanently, including the patch group"],"correct":[0,1,3]},"hint":"Two packages trade a real usability cost for real risk reduction; two ignore the stated constraints entirely.","explanation":["Per-host isolated agents keep the forwarding workflow while removing the shared-socket prize. Tier-1-first time limits with break-glass protect the longest-lived sessions without breaking batch work. Sensor coverage on session tools converts your strongest signals into alerts instead of noise.","Banning all remote sessions from the jump host fails the council by design, and a blanket service-installation ban breaks the patch group's documented need — both are the 'widely used best practice that is wrong here' trap.","Each accepted package names its trade-off: that is what makes it defensible to the steering group."],"study":"Study mitigation trade-off analysis: agent forwarding, session limits, service-creation policy, EDR coverage."},{"id":"e12","type":"fillblank","scenario":{"text":["Draft the classification sentence for the two-week report. Your lead will not accept a wrong sub-technique ID."]},"question":"Fill every blank with a word from the bank.","answer":{"template":"We assess with high confidence that the actor took over a preexisting RDP session on the jump host (___) and separately reused a forwarded SSH agent for the file-server leg (___); both fall under T1563 rather than fresh-authentication T1021.","blanks":["T1563.002","T1563.001"],"bank":["T1563.002","T1563.001","T1021.002","T1550.003","T1563"]},"hint":"RDP is the .002 leg and SSH is the .001 leg — the bank also holds the parent ID and two wrong families.","explanation":["The RDP takeover is **T1563.002**; the forwarded-agent reuse is **T1563.001**. The sentence then anchors both under the parent T1563 in contrast to T1021.","**T1021.002** is SMB over fresh authentication, **T1550.003** is pass-the-ticket — neither matches either leg. Leaving the blank as the bare parent ID **T1563** would lose the sub-technique precision the report requires."],"study":"Drill sub-technique IDs for session hijacking legs: .001 SSH agent, .002 RDP tscon."},{"id":"e13","type":"terminal","scenario":{"text":["Saturday, 03:20. The vendor lead pings the on-call bridge: 'a session on the legacy box is hung — just reset it and clear the queue.' Legal has frozen fileserver-01 (the pre-rename asset, outside the ngc- naming) for imaging at 06:00.","Your job first: show the on-call lead what sessions exist on fileserver-01 from your workstation without changing any state. Nothing you run may end, redirect or reset a session — anything that touches session state destroys the volatile data the 06:00 image is supposed to capture. You hold domain credentials and the RSAT tools. You have 90 seconds on the clock for this decision."]},"question":"Type the read-only command that lists the sessions on fileserver-01 from your workstation, then press Check.","answer":{"shellTitle":"soc-analyst@ngc-ws-14 — simulated Windows shell","prompt":"C:\\>","shellIntro":["Simulated shell. Type your command and press Enter.","Nothing is executed; this is a training simulation."],"perExerciseTimeLimit":90,"elements":[{"desc":"uses qwinsta, the read-only session lister","pattern":"\\bqwinsta\\b"},{"desc":"targets fileserver-01 remotely with /server:","pattern":"server:fileserver-01"}],"wrongPatterns":[{"desc":"logoff, rwinsta or reset session would end or disconnect a session — the 06:00 image loses its volatile data","pattern":"\\blogoff\\b|\\brwinsta\\b|reset\\s+session\\b"},{"desc":"tscon redirects a session — a state change, not a read","pattern":"\\btscon\\b"},{"desc":"shutdown takes the box down and kills the imaging window","pattern":"\\bshutdown\\b"}],"canonical":"qwinsta /server:fileserver-01","canonicalParts":["qwinsta — queries session information without changing state","/server:fileserver-01 — queries the remote host over its admin interfaces instead of logging on"],"expectedOutput":[" SESSIONNAME   USERNAME      ID  STATE   TYPE     DEVICE"," console       svc-ftp        1  Active"," rdp-tcp#5     a.lindqvist    4  Disc"," rdp-tcp                  65536  Listen"]},"hint":"The vendor's verb is 'reset' — your verb must only ever be 'query'.","explanation":["**qwinsta /server:fileserver-01** answers the question remotely and changes nothing: sessions, owners, IDs and states, without a logon session of your own on the target.","The vendor's 'reset the hung session' is the tempting destructive option — `logoff`, `rwinsta`, `reset session` or `tscon` would all alter session state and destroy exactly what legal needs captured at 06:00. `shutdown` ends the entire imaging window.","This is the decision under pressure: the command is easy, but choosing the read-only verb while a stakeholder pushes the destructive one is the test."],"perspectives":{"attacker":"Operators count on responders' reflex to 'fix' things fast — every state change erodes the record.","defender":"Under legal hold, only read-only verbs are permitted; even 'helpful' resets are evidence destruction."},"study":"Practise remote session enumeration with read-only tooling durin function setState(s){
  var prev=timer.state;
  if((prev===STATE_MAN||prev===STATE_AUTO)&&s!==prev){

    if(prev===STATE_MAN)timer.manualSec+=spent;else timer.autoSec+=spent;
  }
  if(s===STATE_MAN||s===STATE_AUTO)pauseEnteredAt=Date.now();
  timer.state=s;
  if(s!==STATE_RUN&&prev===STATE_RUN&&tickHandle){clearInterval(tickHandle);tickHandle=null;}
  if(s===STATE_RUN&&!tickHandle){tickHandle=setInterval(tick,1000);}
  renderHeaderTimer();
}
function tick(){
  if(timer.state===STATE_MAN)timer.manualSec++;
  if(timer.state===STATE_AUTO)timer.autoSec++;
  if(timer.state===STATE_RUN){
    timer.remain--;
    if(timer.perLimit>0&&exam.current>=0&&!exam.list[exam.current].result){
      timer.perRemain--;
      if(timer.perRemain<=0){perExExpired();}

function prepareExercise(ex){

    var multi=(ex.type==='qcm-multi')||(ex.type==='log-qcm'&&Array.isArray(a.correct)&&a.correct.length>1);
    var order=shuffle(a.options.map(function(_,i){return i;}));
    a._disp=a.options.map(function(o,i){return {text:a.options[order[i]],orig:order[i]};});
    if(!multi){var c0=Array.isArray(a.correct)?a.correct[0]:a.correct;a._corr=order.indexOf(c0);a._multi=false;}
    else{a._corr=a.correct.map(function(c){return order.indexOf(c);});a._multi=true;}
  }
  if(ex.type==='dragdrop'){ex.answer._bank=shuffle(ex.answer.items.map(function(_,i){return i;}));ex.answer._placed={};}
  if(ex.type==='order'){ex.answer._disp=shuffle(ex.answer.items.map(function(_,i){return i;}));}
  if(ex.type==='match'){ex.answer._right=shuffle(ex.answer.pairs.map(function(_,i){return i;}));ex.answer._pairs=[];ex.answer._selLeft=null;}
  if(ex.type==='fillblank'){

    var words=fa.blanks.map(function(w,i){return {t:w,slot:i};}).concat(distr.map(function(w){return {t:w,slot:-1};}));
    fa._words=shuffle(words);
    fa._bank=fa._words.map(function(_,i){return i;});
    fa._filled=fa.blanks.map(function(){return null;});
    fa._selChip=null;
  }
  if(ex.type==='branching'){
    ex._step=0;
    ex.steps.forEach(function(st){
      var order=shuffle(st.options.map(function(_,i){return i;}));
      st._disp=st.options.map(function(o,i){return {text:st.options[order[i]],orig:order[i]};});
      st._corr=order.indexOf(st.correct);
      st._choice=null;
      st._done=false;

function feedbackBlock(ex,res){
  var label,color,icon,headColor;
  var fullRaw=(res.W===0&&res.H>=res.N);
  if(res.terminal&&res.danger&&res.credit<1){
    label='DANGEROUS — NEAR MISS';color='st-incorrect';icon='&#10007;';headColor='var(--state-incorrect)';
  }
  else if(res.credit>=1){label='CORRECT';color='st-correct';icon='&#10004;';headColor='var(--state-correct)';}
  else if(res.single&&fullRaw){label='CORRECT';color='st-correct';icon='&#10004;';headColor='var(--state-correct)';}
  else if(res.credit>0){label='PARTIALLY CORRECT';color='st-partial';icon='&#10004;';headColor='var(--state-partial)';}
  else{label='INCORRECT';color='st-incorrect';icon='&#10007;';headColor='var(--state-incorrect)';}
  var h='<div class="block-h"><span class="ic">'+icon+'</span><span class="fb-title" style="color:'+headColor+'">'+label+'</span>';
  if(res.N>1||!res.single||hintUsed[ex.id])h+='<span class="fb-credit">credit '+res.credit.toFixed(2)+' — '+res.H+'/'+res.N+' items'+(res.W>0?' · '+res.W+' wrong':'')+(hintUsed[ex.id]?' · hint −0.10':'')+'</span>';
  h+='</div>';
  var b='<div class="block-b">';
  if(res.terminal&&res.danger)b+='<p style="color:var(--state-incorrect);font-weight:700">&#9888; Your command was close — and destructive. Read the warning below before running anything similar on a real host.</p>';
  b+='<div class="item-rows">';
  res.items.forEach(function(it){
    var mk=it.status==='correct'?'<span class="mk mk-c">&#10004; Correct</span>':it.status==='wrong'?'<span class="mk mk-w">&#10007; Wrong</span>':'<span class="mk mk-m">&#9675; Missed</span>';
    b+='<div class="item-row">'+mk+'<span>'+md(it.text)+'</span></div>';
  });
  b+='</div>';
  (ex.explanation||[]).forEach(function(p){b+='<p>'+md(p)+'</p>';});
  if(ex.perspectives&&(ex.perspectives.attacker||ex.perspectives.defender)){
    b+='<div class="persp">';
    if(ex.perspectives.attacker)b+='<div class="p-card red"><h6>&#9876; Attacker perspective</h6>'+md(ex.perspectives.attacker)+'</div>';
    if(ex.perspectives.defender)b+='<div class="p-card blue"><h6>&#128737; Defender perspective</h6>'+md(ex.perspectives.defender)+'</div>';
    b+='</div>';
  }
  if(res.terminal&&ex.answer.canonical){
    b+='<div class="canon"><h6>Canonical command (copyable)</h6><pre id="canon-cmd">'+esc(ex.answer.canonical)+'</pre>';
    if(ex.answer.canonicalParts&&ex.answer.canonicalParts.length){b+='<ul>';ex.answer.canonicalParts.forEach(function(p){b+='<li>'+md(p)+'</li>';});b+='</ul>';}
    if(ex.answer.expectedOutput)b+='<h6 style="margin-top:10px;color:var(--text-secondary)">Expected output shape</h6><pre>'+esc(ex.answer.expectedOutput)+'</pre>';
    b+='</div>';
  }
  if(res.credit<1&&ex.study)b+='<div class="study-tip">&#128161; <b>What to study:</b> '+md(ex.study)+'</div>';
  b+='</div>';
  return '<section class="block bl-feedback" aria-label="Feedback" aria-live="polite">'+h+b+'</section>';
}

    '<div class="fact"><b>Timer budget:</b> '+(M.estimatedMinutes||25)+' min ('+budget+' s)</div>'+
    '<div class="fact"><b>Pass mark:</b> '+PASS_MARK+'%</div>'+
    (learner.name?'<div class="fact"><b>Analyst:</b> '+esc(learner.name)+(learner.country&&learner.country!=='ZZ'?' · '+esc(learner.country):'')+'</div>':'');
  var html=
  '<div class="wrap">'+
    '<div class="card intro-hero">'+
      '<h1>'+esc(M.title)+'</h1>'+
      '<p class="muted" style="margin:0">A certification-style practice exam on one MITRE ATT&CK object. Dark SOC-console theme · runs fully offline.</p>'+
      '<div class="intro-facts">'+facts+'</div>'+
    '</div>'+
    '<h2 class="section-title"><span class="dot"></span>What you will learn here</h2>'+
    '<div class="card section-body">'+EXAM.intro.learn.map(function(p){return '<p>'+md(p)+'</p>';}).join('')+'</div>'+
    '<h2 class="section-title"><span class="dot"></span>Keywords covered in this exam</h2>'+
    '<div class="card section-body">'+kws+'</div>'+
    '<h2 class="section-title"><span class="dot"></span>How this exam works</h2>'+
    '<div class="card section-body">'+
      '<ul class="rules">'+
        '<li><b>Pass mark '+PASS_MARK+'%.</b> Your score is computed only over the exercises you actually answered. Skipped-and-never-answered exercises are excluded from both points.</li>'+
        '<li><b>Partial credit.</b> Multi-answer exercises score item by item: <code class="mono-inline">(correct − wrong) / total correct</code>. Selecting everything scores zero.</li>'+
        '<li><b>One hint per exercise</b> costs −10% of that exercise&#39;s credit — never −10% of the whole exam.</li>'+
        '<li><b>Check buys you time.</b> Pressing Check stops the timer automatically so you can read the feedback without pressure. The timer resumes only when you press Next.</li>'+
        '<li><b>Manual Pause</b> hides the exercise and stops the timer for a genuine break. Resume brings it back exactly as it was.</li>'+
        '<li><b>Skip is free.</b> Skipped exercises go to a review pool. Before you can finish, you can return to them as often as you like while the timer runs; anything never answered is excluded from the score.</li>'+
        '<li><b>Retake reshuffles.</b> On a retake, the question order and answer choices are shuffled again.</li>'+
      '</ul>'+
      '<p style="margin-top:12px"><b>Exercise types used in this file:</b></p>'+
      '<div class="type-chips">'+types.map(function(t){return '<span class="chip">'+esc(t)+'</span>';}).join('')+'</div>'+
    '</div>'+
    '<div class="start-row"><button type="button" class="btn btn-primary start-btn" id="start-btn">&#9654; Start the exam</button></div>'+
  '</div>';
  $('app').innerHTML=html;
  $('start-btn').addEventListener('click',startExam);
}
function startExam(){
  exam.attempt++;
  exam.list=buildAttempt(exam.attempt>1);
  exam.current=0;exam.skipped={};exam.graded=0;exam.creditSum=0;exam.results=[];exam.fromReview=false;exam.prevState=null;
  hintUsed={};reported=false;
  timer.state='IDLE';timer.remain=budget;timer.manualSec=0;timer.autoSec=0;timer.perLimit=0;timer.perRemain=0;pauseEnteredAt=0;
  view='exam';
  setState(STATE_RUN);
  renderExamShell();
  renderExercise(0);
}
function renderExamShell(){
  var segs=exam.list.map(function(_,i){return '<div class="seg" id="seg-'+i+'"></div>';}).join('');
  $('app').innerHTML=
    '<header class="exam-header" role="banner"><div class="exam-header-in">'+
      '<span class="hd-count" id="hd-count">Exercise 1 of '+exam.list.length+'</span>'+
      sevBadge()+
      '<span class="hd-timer" id="hd-timer" role="status"></span>'+
      '<span class="hd-score" id="hd-score"></span>'+
      '<span class="spacer"></span>'+
      '<span class="hd-btns">'+
        '<button type="button" class="btn btn-slim" id="btn-hint">&#128161; Hint</button>'+
        '<button type="button" class="btn btn-slim" id="btn-skip">&#9197; Skip</button>'+
        '<button type="button" class="btn btn-slim" id="btn-pause">&#9208; Pause</button>'+
        '<button type="button" class="btn btn-slim btn-ghost hidden" id="btn-review">&#9888; Skipped: 0</button>'+
      '</span>'+
    '</div></header>'+
    '<div class="progress"><div class="progress-bar" role="progressbar" aria-label="Exam progress">'+segs+'</div></div>'+
    '<main class="wrap" id="ex-area"></main>';
  $('btn-hint').addEventListener('click',function(){showHint();});
  $('btn-skip').addEventListener('click',function(){doSkip();});
  $('btn-pause').addEventListener('click',function(){doManualPause();});
  $('btn-review').addEventListener('click',function(){goReview();});
}
function renderHeaderTimer(){
  var el=$('hd-timer');if(!el)return;
  var txt,cls='';
  if(timer.state===STATE_RUN)txt='&#9654; RUNNING <span class="t">'+fmtClock(timer.remain)+'</span>';
  else if(timer.state===STATE_MAN){txt='&#9208; PAUSED — manual (press Resume) <span class="t">'+fmtClock(timer.remain)+'</span>';cls='st-paused';}
  else if(timer.state===STATE_AUTO){txt='&#9208; PAUSED — reviewing feedback (resumes on Next) <span class="t">'+fmtClock(timer.remain)+'</span>';cls='st-paused';}
  else if(timer.state===STATE_END)txt='&#9632; ENDED <span class="t">'+fmtClock(timer.remain)+'</span>';
  else txt='&#9679; READY <span class="t">'+fmtClock(timer.remain)+'</span>';
  el.className='hd-timer '+cls;
  el.innerHTML=txt;
  var pt=$('per-timer-'+(exam.list[exam.current]||{}).id);
  if(pt&&timer.perLimit>0)pt.textContent=fmtClock(timer.perRemain);
  var sc=$('hd-score');
  if(sc){
    var answered=Math.max(1,exam.graded);
    var pct=exam.graded>0?Math.round(exam.creditSum/exam.graded*100):0;
    sc.innerHTML='Score <span class="s">'+fmt1(exam.creditSum)+' / '+exam.graded+'</span> &nbsp;'+pct+'%';
  }
  var rb=$('btn-review');
  if(rb){
    var n=Object.keys(exam.skipped).length;
    rb.classList.toggle('hidden',n===0);
    rb.innerHTML='&#9888; Skipped: '+n;
  }
}
function updateSegments(){
  exam.list.forEach(function(ex,i){
    var s=$('seg-'+i);if(!s)return;
    s.className='seg';
    var r=exam.results[i];
    if(r&&r.credit>=1)s.classList.add('ok');
    else if(r&&r.credit>0)s.classList.add('partial');
    else if(r)s.classList.add('bad');
    else if(exam.skipped[i])s.classList.add('skipped');
    else if(i===exam.current)s.classList.add('cur');
  });
}
function renderExercise(i){
  exam.current=i;
  var ex=exam.list[i];
  if(ex.type!=='terminal'){timer.perLimit=0;timer.perRemain=0;}
  var area=$('ex-area');
  var metaRow='<div class="ex-meta-row"><span class="hd-count">Exercise '+(i+1)+' of '+exam.list.length+'</span>'+sevBadge()+'</div>';
  var html=metaRow+scenarioBlock(ex)+'<section class="block bl-question" id="q-block-'+ex.id+'" aria-label="Question">'+questionBlock(ex).replace(/^<section[^>]*>|<\/section>$/g,'')+'</section>';
  html+=WIDGETS[ex.type].render(ex);
  html+='<div class="step-actions" style="margin:16px 0 30px">'+
    '<button type="button" class="btn btn-amber" id="btn-check">&#9989; Check answer</button>'+
    '<button type="button" class="btn btn-primary hidden" id="btn-next">Next &#8594;</button>'+
    '<button type="button" class="btn btn-primary hidden" id="btn-final">Final Submit &#9632;</button>'+
  '</div>'+
  '<div id="fb-slot"></div>';
  area.innerHTML=html;
  var hc=$('hd-count');if(hc)hc.textContent='Exercise '+(i+1)+' of '+exam.list.length;
  $('btn-check').addEventListener('click',function(){
    var a=ex.answer;
    var hasAnswer=false;
    if(ex.type==='qcm-single'||(ex.type==='log-qcm'&&!ex.answer._multi))hasAnswer=a._choice!==null&&a._choice!==undefined;
    else if(ex.type==='qcm-multi'||ex.type==='log-qcm')hasAnswer=ex.answer._sel&&ex.answer._sel.length>0;
    else if(ex.type==='dragdrop')hasAnswer=Object.keys(a._placed).some(function(k){return a._placed[k]!==null&&a._placed[k]!==undefined;});
    else if(ex.type==='order')hasAnswer=true;
    else if(ex.type==='match')hasAnswer=a._pairs.length>0;
    else if(ex.type==='fillblank')hasAnswer=a._filled.some(function(f){return f!==null;});
    else if(ex.type==='terminal')hasAnswer=ex._cmd.trim().length>0;
    else if(ex.type==='branching')hasAnswer=ex.steps.every(function(st){return st._done;});
    if(!hasAnswer)return;
    doCheck(false);
  });
  WIDGETS[ex.type].bind(ex,area);
  var lf=$('lf-'+ex.id);
  if(lf){
    lf.addEventListener('input',function(){
      var q=lf.value.toLowerCase().trim();
      var body=$('lb-'+ex.id);var shown=0;
      body.querySelectorAll('.log-line').forEach(function(l){
        var hit=!q||l.getAttribute('data-lc').indexOf(q)>=0;
        l.style.display=hit?'':'none';
        if(hit)shown++;
      });
      var cnt=$('lc-'+ex.id);if(cnt)cnt.textContent=shown+' / '+exam.list[exam.current].log.lines.length+' lines';
    });
  }
  updateSegments();
  renderHeaderTimer();
  $('btn-hint').disabled=!!hintUsed[ex.id]||!!ex.result;
  $('btn-skip').disabled=false;
  window.scrollTo({top:0,behavior:scrollBehavior()});
}
function showHint(){
  var ex=exam.list[exam.current];
  if(!ex||ex.result||hintUsed[ex.id])return;
  hintUsed[ex.id]=true;
  $('btn-hint').disabled=true;
  var slot=$('fb-slot');
  var d=document.createElement('div');
  d.className='notice';
  d.innerHTML='&#128161; <b>Hint (−10% of this exercise&#39;s credit):</b> '+md(ex.hint||'No hint available for this exercise.');
  slot.appendChild(d);
}
function doManualPause(){
  if(exam.current<0)return;
  if(timer.state===STATE_RUN||timer.state===STATE_AUTO){
    exam.prevState=timer.state;
    setState(STATE_MAN);
    var ov=document.createElement('div');
    ov.className='paused-overlay';ov.id='pause-ov';
    ov.innerHTML='<div class="card paused-card"><div class="big">&#9208;</div><h2 style="margin:6px 0">PAUSED — manual</h2><p class="muted">The exercise is hidden and the timer is stopped. Press Resume to continue where you were.</p><button type="button" class="btn btn-primary" id="btn-resume">&#9654; Resume</button></div>';
    document.body.appendChild(ov);
    $('btn-resume').addEventListener('click',resumeManual);
    $('btn-resume').focus();
  }
}
function resumeManual(){
  var ov=$('pause-ov');if(ov)ov.remove();
  setState(exam.prevState===STATE_AUTO?STATE_AUTO:STATE_RUN);
}function doSkip(){
  var i=exam.current,ex=exam.list[i];
  if(ex.result)return;
  exam.skipped[i]=true;
  var nxt=nextMain(i);
  if(nxt>=0){renderExercise(nxt);}
  else if(Object.keys(exam.skipped).length>0){goReview();}
  else{goResults();}
}
function nextMain(from){
  for(var j=Math.max(0,from+1);j<exam.list.length;j++){
    if(!exam.list[j].result&&!exam.skipped[j])return j;
  }
  return -1;
}
function doCheck(expired){
  var i=exam.current,ex=exam.list[i];
  if(ex.result)return;
  if(ex.type==='terminal'){
    var ti=$('tin-'+ex.id);
    if(ti&&ti.value.trim())ex._cmd=ti.value;
  }
  setState(STATE_AUTO);
  timer.perLimit=0;
  var res=gradeExercise(ex);
  ex.result=res;
  exam.results[i]=res;
  exam.graded++;
  exam.creditSum+=res.credit;
  var fb=feedbackBlock(ex,res);
  $('fb-slot').innerHTML=fb;
  if(WIDGETS[ex.type].lock)WIDGETS[ex.type].lock(ex,document);
  $('btn-check').classList.add('hidden');
  var moreMain=(nextMain(i)>=0);
  var nSkipped=Object.keys(exam.skipped).length;
  var nextBtn=$('btn-next'),finBtn=$('btn-final');
  if(!moreMain&&nSkipped===0){finBtn.classList.remove('hidden');}
  else{
    nextBtn.classList.remove('hidden');
    nextBtn.innerHTML=moreMain?'Next &#8594;':'Review skipped &#9888; &#8594;';
  }
  $('btn-hint').disabled=true;$('btn-skip').disabled=true;
  nextBtn.addEventListener('click',function(){onNext();});
  finBtn.addEventListener('click',function(){goResults();});
  updateSegments();renderHeaderTimer();
  var fbEl=document.querySelector('.bl-feedback');if(fbEl)fbEl.scrollIntoView({behavior:scrollBehavior(),block:'start'});
}
function onNext(){
  var i=exam.current;
  delete exam.skipped[i];
  if(exam.fromReview){exam.fromReview=false;goReview();return;}
  var nxt=nextMain(i);
  if(nxt>=0){setState(STATE_RUN);renderExercise(nxt);}
  else if(Object.keys(exam.skipped).length>0){goReview();}
  else{goResults();}
}

/* ---------- review ---------- */
function goReview(){
  view='review';
  setState(STATE_RUN);
  if(!$('ex-area'))renderExamShell();
  var keys=Object.keys(exam.skipped).map(Number).sort(function(a,b){return a-b;});
  var rows=keys.map(function(i){
    var ex=exam.list[i];
    return '<div class="card review-row"><span class="state-chip st-skipped">&#9888; Skipped</span><span class="q">'+md(ex.question)+'</span><button type="button" class="btn btn-slim btn-amber" data-go="'+i+'">Answer &#8594;</button></div>';
  }).join('');
  var hasMain=(nextMain(-1)>=0);
  var html='<div class="ex-meta-row"><span class="hd-count" style="font-size:18px">Review skipped exercises</span>'+sevBadge()+'</div>'+
    '<p class="muted" style="margin:6px 0 14px">The timer is still running. You can answer as many skipped exercises as you like before you submit. Anything never answered is excluded from the score.</p>';
  if(keys.length){html+='<div class="review-list">'+rows+'</div>';}
  else{html+='<div class="notice">&#10004; No skipped exercises remain — everything has been answered or excluded.</div>';}
  html+='<div class="step-actions" style="margin:18px 0 40px">';
  if(hasMain)html+='<button type="button" class="btn" id="rv-back">&#8592; Back to exam</button>';
  html+='<button type="button" class="btn btn-primary" id="rv-final">Final Submit &#9632;</button></div>';
  $('ex-area').innerHTML=html;
  document.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click',function(){
      exam.fromReview=true;
      setState(STATE_RUN);
      renderExercise(parseInt(b.getAttribute('data-go'),10));
      view='exam';
    });
  });
  var bb=$('rv-back');
  if(bb)bb.addEventListener('click',function(){
    var nxt=nextMain(-1);
    view='exam';
    if(nxt>=0){setState(STATE_RUN);renderExercise(nxt);}else goResults();
  });
  $('rv-final').addEventListener('click',goResults);
  window.scrollTo({top:0,behavior:scrollBehavior()});
}

/* ---------- results ---------- */
function goResults(){
  view='results';
  setState(STATE_END);
  var answered=exam.graded;
  var total=exam.list.length;
  var skippedExcluded=total-answered;
  var creditSum=exam.creditSum;
  var percent=answered>0?Math.round(creditSum/answered*100):0;
  var passed=percent>=PASS_MARK&&answered>0;
  var fully=0,partial=0,incorrect=0,partSum=0;
  exam.results.forEach(function(r){if(!r)return;if(r.credit>=1)fully++;else if(r.credit>0){partial++;partSum+=r.credit;}else incorrect++;});
  var breakdown=
    '<div class="res-break">'+
    '<div class="res-cell" style="border-color:var(--state-correct)"><span class="mk mk-c">&#10004;</span><span><b>'+fully+'</b> &nbsp;Fully correct</span></div>'+
    '<div class="res-cell" style="border-color:var(--state-partial)"><span class="mk" style="color:var(--state-partial)">&#10004;</span><span><b>'+partial+'</b> &nbsp;Partially correct'+(partial>0?' — avg credit '+ (partSum/partial).toFixed(2):'')+'</span></div>'+
    '<div class="res-cell" style="border-color:var(--state-incorrect)"><span class="mk mk-w">&#10007;</span><span><b>'+incorrect+'</b> &nbsp;Fully incorrect</span></div>'+
    '<div class="res-cell"><span class="mk mk-m">&#9888;</span><span><b>'+skippedExcluded+'</b> &nbsp;Skipped — excluded from score</span></div>'+
    '</div>';
  var html='<div class="wrap">'+
    '<div class="card result-hero '+(passed?'pass-panel':'fail-panel')+'">'+
      '<div style="font-size:30px;font-weight:900;margin-bottom:4px;color:'+(passed?'var(--state-correct)':'var(--state-incorrect)')+'">'+(passed?'&#10004; PASS':'&#10007; FAIL')+'</div>'+
      '<div class="result-pct" style="color:'+(passed?'var(--state-correct)':'var(--state-incorrect)')+'">'+percent+'%</div>'+
      '<p class="muted" style="margin-top:8px">Final score: <b style="color:var(--text-primary)">'+fmt1(creditSum)+' / '+answered+'</b> answered · pass mark '+PASS_MARK+'% · '+esc(M.mitreId)+' — '+esc(SEV_WORD[M.difficulty])+'</p>'+
      (passed?'<p style="color:var(--state-correct);font-weight:700">&#127942; Certification-style result achieved. Well done.</p>':'<p style="color:var(--state-incorrect);font-weight:700">You must retake this exam to reach the pass mark.</p>')+
    '</div>'+
    '<div class="card section-body">'+breakdown+
      '<p class="muted small" style="margin-top:14px">&#9208; Time paused manually: '+fmtClock(timer.manualSec)+' · &#9208; Time paused reviewing feedback: '+fmtClock(timer.autoSec)+' · &#9632; Timer ended with '+fmtClock(timer.remain)+' left.</p>'+
    '</div>'+
    '<div class="start-row"><button type="button" class="btn btn-primary start-btn" id="retake-btn">&#8635; Retake Exam</button></div>'+
  '</div>';
  $('app').innerHTML=html;
  $('retake-btn').addEventListener('click',function(){
    view='intro';renderIntro();window.scrollTo({top:0,behavior:scrollBehavior()});
  });
  if(!reported){
    reported=true;
    reportScore(creditSum,answered);
  }
  window.scrollTo({top:0,behavior:scrollBehavior()});
}
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:M.topicId,
      batch:M.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=PASS_MARK
    },location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  learner.name=event.data.username||'';
  learner.country=event.data.country||'';
  learner.locale=event.data.locale||'en';
});

/* ---------- shell ---------- */
window.EXAMUI={
  toggleScenario:function(id){
    var body=$('scn-body-'+id),sum=$('scn-sum-'+id),btn=$('scn-toggle-'+id);
    if(!body)return;
    var hidden=body.classList.toggle('hidden');
    if(sum)sum.style.display=hidden?'block':'none';
    if(btn){btn.textContent=hidden?'Expand':'Collapse';btn.setAttribute('aria-expanded',hidden?'false':'true');}
  }
};
/* Read-only test/diagnostics accessor (used by the site's QA harness; makes no network calls) */
window.CM_DEBUG=function(){
  return {
    view:view,
    timer:{state:timer.state,remain:timer.remain,manualSec:timer.manualSec,autoSec:timer.autoSec,perLimit:timer.perLimit,perRemain:timer.perRemain},
    current:exam.current,graded:exam.graded,creditSum:exam.creditSum,attempt:exam.attempt,
    skipped:Object.keys(exam.skipped).map(Number),
    results:exam.results,
    list:exam.list
  };
};
document.body.style.background='var(--bg-page)';
document.body.style.color='var(--text-primary)';
renderIntro();
})();
</script>
</body>
</html>
