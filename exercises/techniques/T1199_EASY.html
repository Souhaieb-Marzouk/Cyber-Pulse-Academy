var INTRO={"learnHtml":"<p><b>Welcome to the Security Operations Centre.<\/b> This exam teaches you <b>T1199 — Trusted Relationship<\/b>, a <b>Technique<\/b> in the MITRE ATT&amp;CK framework, tactic <b>TA0001 Initial Access<\/b>. It is about how attackers get in through a partner you already trust.<\/p><p>Many organisations let other companies connect to their systems: a <b>managed service provider (MSP)<\/b> that runs the IT, a reseller with <b>delegated admin rights<\/b> in Microsoft 365, or contractors that service <b>building systems<\/b> like heating and elevators. These connections exist for good business reasons. But if an attacker steals a partner's account, they can simply walk in through the door that is already open — and trusted doors get <b>less scrutiny<\/b> than strange ones.<\/p><p>In these 15 exercises you will learn the basic vocabulary of third-party trust, how a <b>partner account compromise<\/b> works, and how to tell vendor access apart from a stolen employee account. You will read logs, sort events, and order the attacker's workflow — the same first tasks a junior SOC analyst does every day.<\/p>","themes":[{"name":"Third-party trust fundamentals","concepts":["pre-existing trusted relationship","managed service provider (MSP)","less scrutiny of trusted connections","Initial Access tactic (TA0001)","Valid Accounts as the vehicle","infrastructure contractors (HVAC, elevator, physical security)"]},{"name":"Partner attack paths","concepts":["delegated administrator permissions (DAP)","third-party vs employee account access","MSP remote management tooling","partner account compromise"]}]};
var EXERCISES=[{"id":"EX-01","type":"qcm-single","summary":"Which tactic does T1199 Trusted Relationship belong to?","concepts":["Initial Access tactic (TA0001)"],"scenario":"<p>Your SOC mentor opens the ATT&amp;CK page for T1199 Trusted Relationship. She asks you which column of the matrix it sits in — the tactic, meaning the attacker's goal at that step.<\/p>","question":"<p>Which tactic does abusing a trusted third party to get into a network belong to?<\/p>","options":["Command and Control","Initial Access","Credential Access","Defense Evasion"],"correct":1,"hint":"It is the tactic where the attacker first sets foot inside the victim environment.","explanation":"<p>T1199 sits in <b>Initial Access<\/b> (TA0001): the attacker gets in by abusing a partner's existing trusted access instead of breaking in directly. Command and Control, Credential Access, and Defense Evasion all happen later in an attack.<\/p>","study":"Read the ATT&CK T1199 page header: tactic TA0001 Initial Access."},{"id":"EX-02","type":"fill-blank","summary":"Name the IT partner that manages customer systems remotely.","concepts":["managed service provider (MSP)"],"scenario":"<p>Finish the sentence for your team's induction notes about third parties.<\/p>","question":"<p>Fill the blank: an IT partner that remotely manages a customer's computers and networks under a support contract is called a <input1>.<\/p>","template":"Fill the blank: an IT partner that remotely manages a customer's computers and networks under a support contract is called a <input1>.","blanks":[{"answer":"managed service provider","alts":["msp","managed service provider (msp)","managed service provider,"],"placeholder":"two or three words","width":26}],"hint":"The abbreviation is MSP.","explanation":"<p>That partner is a <b>managed service provider (MSP)<\/b>. Many companies hire one MSP to run their IT. If an attacker captures the MSP's accounts, they can reach every customer the MSP serves — that is exactly why T1199 targets them.<\/p>","study":"ATT&CK T1199 'Description': managed service providers and other trusted third parties."},{"id":"EX-03","type":"qcm-single","summary":"Why is a partner's existing access attractive to attackers?","concepts":["pre-existing trusted relationship"],"scenario":"<p>In the SOC stand-up, an analyst asks: \"Why do attackers bother with a vendor instead of just phishing our staff?\" The lead points at the ATT&amp;CK description of T1199.<\/p>","question":"<p>What makes a third party's existing connection attractive as an entry path?<\/p>","options":["Partner accounts never use multi-factor authentication","Vendors give their passwords to customers by contract","The connection already exists and is trusted, so it draws less scrutiny","The vendor's network always lacks security tooling"],"correct":2,"hint":"Think about the words 'pre-existing': the path is already open before the attack starts.","explanation":"<p>The <b>pre-existing trusted relationship<\/b> is the attraction: the connection already exists, it is normally allowed, and it draws less scrutiny than unknown logins. Vendors do use MFA, partners are usually well defended, and nobody shares passwords by contract.<\/p>","study":"ATT&CK T1199 'Description', first sentences about pre-existing trust."},{"id":"EX-04","type":"matching","summary":"Match the three core T1199 trust roles to what each one is.","concepts":["managed service provider (MSP)","infrastructure contractors (HVAC, elevator, physical security)","Valid Accounts as the vehicle"],"scenario":"<p>Your mentor quizzed you with three index cards about the kinds of trusted parties in T1199. Match each term with its meaning.<\/p>","question":"<p>Click an item on the left, then its match on the right.<\/p>","pairs":[{"left":"Managed service provider (MSP)","right":"remotely runs a customer's day-to-day IT under contract"},{"left":"Infrastructure contractor (HVAC, elevator)","right":"services building systems and may hold remote access to them"},{"left":"Valid Accounts (T1078)","right":"the compromised-account technique that usually carries the trusted-relationship abuse"}],"hint":"One runs the IT, one services the building, one is the account technique.","explanation":"<p>An <b>MSP<\/b> remotely manages customer IT. <b>Infrastructure contractors<\/b> such as HVAC, elevator, or physical security firms service building systems and often keep remote access to those systems. T1199 usually rides <b>Valid Accounts (T1078)<\/b> — the partner's real, working credentials.<\/p>","study":"ATT&CK T1199 'Description': MSPs, IT contractors, infrastructure contractors, and Valid Accounts."},{"id":"EX-05","type":"line-select","summary":"Spot the MSP remote-management agent running a script.","concepts":["MSP remote management tooling"],"scenario":"<p>Here is a process-creation log from a Northwind Traders workstation. The CoreVantage IT remote-management agent runs there. One line shows the agent launching an encoded script outside working hours.<\/p>","question":"<p>Click the <b>one<\/b> line where the MSP agent launches an encoded PowerShell script outside working hours.<\/p>","logLines":["EvtID=1  09:12:44  Image=C:\\Program Files\\CoreVantage\\rmmagent.exe --heartbeat   User=NT AUTHORITY\\SYSTEM","EvtID=1  09:15:02  Image=C:\\Windows\\System32\\svchost.exe -k netsvcs -p -s wuauserv","EvtID=1  21:30:11  Image=C:\\Windows\\System32\\cmd.exe /c ipconfig /all   Parent=C:\\Windows\\explorer.exe   User=nwright","EvtID=1  23:58:07  Image=C:\\Windows\\System32\\conhost.exe 0x4","EvtID=1  03:12:55  Image=C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -enc JABzAD0A...  Parent=C:\\Program Files\\CoreVantage\\rmmagent.exe   User=svc-rmmadmin","EvtID=1  08:02:19  Image=C:\\Program Files\\Browser\\chrome.exe --new-window"],"badLines":[4],"artifactNote":"Sysmon-style Event ID 1 process creation lines.","hint":"Look for the rmmagent parent that is not a simple heartbeat, and check the hour.","explanation":"<p>Line 5 shows the MSP remote-management agent spawning an encoded PowerShell at 03:12 as the vendor service account — a classic way a partner's tooling becomes an entry path. The heartbeat, the Windows Update service, and the ordinary cmd, conhost, and browser lines are routine.<\/p>","study":"Baseline your MSP agent: what child processes and which hours are normal for it."},{"id":"EX-06","type":"qcm-single","summary":"What do Microsoft partners receive to manage customer tenants?","concepts":["delegated administrator permissions (DAP)"],"scenario":"<p>A reseller support technician says: \"We can open our customers' Microsoft 365 tenants and fix settings without asking for their admin passwords every time.\"<\/p>","question":"<p>What is this partner capability called?<\/p>","options":["Delegated administrator permissions (DAP)","Shared mailbox ownership","Tenant-to-tenant migration rights","Global admin password escrow"],"correct":0,"hint":"The abbreviation is DAP, and 'delegated' means 'handed over'.","explanation":"<p>Microsoft partners and resellers can hold <b>delegated administrator permissions (DAP)<\/b> over customer tenants. Attackers who capture a partner account inherit these rights — or send new DAP offers to trick customers into granting access.<\/p>","study":"ATT&CK T1199 'Description': Office 365 partners, resellers, delegated administrator permissions."},{"id":"EX-07","type":"drag-drop","summary":"Sort sign-ins: partner context vs stolen employee account.","concepts":["third-party vs employee account access"],"scenario":"<p>Four sign-in events from this morning are on your triage board. Sort them before the shift briefing.<\/p>","question":"<p>Place each event into the right bucket.<\/p>","bank":["Sign-in from the MSP's partner tenant admin account","Sign-in with the finance director's user name and a new MFA device","Delegated admin session opening the customer tenant console","Password spray hits against staff mailboxes from a fresh IP range"],"slots":[{"label":"Third-party (partner) access","accept":[0,2]},{"label":"Compromised employee account","accept":[1,3]}],"hint":"Ask first: does the identity belong to your company or to a vendor?","explanation":"<p>The MSP admin account and the delegated admin session are <b>third-party access<\/b> — the identity belongs to a vendor. The director's user name with a new MFA device, and password spray against staff, are <b>employee account<\/b> attacks, not trusted-relationship abuse.<\/p>","study":"Keep two queues in your head: your own identities, and every external identity with rights."},{"id":"EX-08","type":"qcm-single","summary":"Why do trusted connections often go unwatched?","concepts":["less scrutiny of trusted connections"],"scenario":"<p>A detection engineer reviews the monitoring roadmap. Vendor VPN ranges and the MSP agent channel appear on no dashboard. She asks why attackers would care about that gap.<\/p>","question":"<p>What is the monitoring lesson from T1199?<\/p>","options":["Vendors always announce their maintenance to the SOC in advance","Partner sessions are logged automatically in every product","Only insider threats ever use vendor accounts","Trusted partner connections receive less scrutiny, so they make quiet entry paths"],"correct":3,"hint":"The ATT&CK description says the existing connection 'receives less scrutiny'.","explanation":"<p>T1199 works because trusted connections <b>receive less scrutiny<\/b>: they are normal, so nobody alerts on them. The lesson is to baseline partner activity and log it like any other access. Vendors do not always announce work, logging is not automatic everywhere, and this is not only an insider problem.<\/p>","study":"Check which vendor log sources are missing from your SIEM onboarding list."}];

  }

  }
  function widgetFor(ex, box, wstate) {
    if (ex.type === 'qcm-single' || ex.type === 'qcm-multi') {
      var wrap = el('div', null, '');
      wstate.sel = wstate.sel || [];
      ex.options.forEach(function (o, i) {
        var r = optRow(i, o);
        if (wstate.sel.indexOf(i) >= 0) r.classList.add('sel');
        r.addEventListener('click', function () {
          if (S.answers[S.current].status === 'checked') return;
          if (ex.type === 'qcm-single') { wstate.sel = [i]; wrap.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); }); r.classList.add('sel'); }
          else { var p = wstate.sel.indexOf(i); if (p >= 0) { wstate.sel.splice(p, 1); r.classList.remove('sel'); } else { wstate.sel.push(i); r.classList.add('sel'); } }
        });

    } else if (ex.type === 'fill-blank') {
      wstate.vals = wstate.vals || {};

        var m = /^<input(\d+)>$/.exec(p);

          var inp = document.createElement('input');

          inp.setAttribute('aria-label', 'Blank ' + (bi + 1));

    } else if (ex.type === 'drag-drop') {
      wstate.place = wstate.place || {}; // bankIdx -> slotIdx
      wstate.active = wstate.active === undefined ? null : wstate.active;
      var dd = el('div', 'ddwrap');
      var bank = el('div', 'ddbank'); bank.dataset.bank = '1';
      bank.setAttribute('aria-label', 'Item bank');

      function chipEl(bi, inSlot) {

        c.addEventListener('dragstart', function (ev) { try { ev.dataTransfer.setData('text/plain', String(bi)); } catch (e) { } });

      }
      function rerender() {
        bankList.innerHTML = '';
        S.shuffles[S.current].bank.forEach(function (bi) { if (wstate.place[bi] === undefined) bankList.appendChild(chipEl(bi, false)); });
        dd.querySelectorAll('.sl-body').forEach(function (b) { b.innerHTML = ''; });
        ex.slots.forEach(function (sl, si) {
          var body = dd.querySelector('[data-slot="' + si + '"]');
          Object.keys(wstate.place).forEach(function (k) { if (wstate.place[k] === si) body.appendChild(chipEl(parseInt(k, 10), true)); });
        });
      }
      bank.appendChild(bankH); bank.appendChild(bankList); dd.appendChild(bank);
      var slotsBox = el('div', 'ddslots');
      ex.slots.forEach(function (sl, si) {
        var sd = el('div', 'ddslot');
        sd.appendChild(el('div', 'sl-h', esc(sl.label)));
        var body = el('div', 'sl-body'); body.dataset.slot = si; body.tabIndex = 0;
        body.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); body.click(); } });
        body.setAttribute('aria-label', 'Slot: ' + sl.label);
        body.addEventListener('click', function () {
          if (S.answers[S.current].status === 'checked' || wstate.active === null) return;

    } else if (ex.type === 'ordering') {
      wstate.order = wstate.order || S.shuffles[S.current].ord.slice();
      var ol = el('ul', 'ordlist'); ol.setAttribute('aria-label', 'Ordering list — use the arrows to reorder');
      function drawOrd() {
        ol.innerHTML = '';
        wstate.order.forEach(function (bi, pos) {
          var li = el('li');
          li.appendChild(el('span', 'ord-idx', String(pos + 1)));
          li.appendChild(el('span', 'ord-txt', esc(ex.items[bi])));
          var btns = el('span', 'ord-btns');
          var up = el('button', null, '↑'); up.type = 'button'; up.setAttribute('aria-label', 'Move item ' + (pos + 1) + ' up');
          up.disabled = pos === 0;
          up.addEventListener('click', function () { var o = wstate.order, t = o[pos]; o[pos] = o[pos - 1]; o[pos - 1] = t; drawOrd(); });
          var dn = el('button', null, '↓'); dn.type = 'button'; dn.setAttribute('aria-label', 'Move item ' + (pos + 1) + ' down');
          dn.disabled = pos === wstate.order.length - 1;
          dn.addEventListener('click', function () { var o = wstate.order, t = o[pos]; o[pos] = o[pos + 1]; o[pos + 1] = t; drawOrd(); });
          btns.appendChild(up); btns.appendChild(dn); li.appendChild(btns); ol.appendChild(li);
        });

      drawOrd(); box.appendChild(ol);
    } else if (ex.type === 'matching') {
      wstate.assign = wstate.assign || {}; // leftIdx -> rightIdx
      wstate.activeLeft = wstate.activeLeft === undefined ? null : wstate.activeLeft;
      var mw = el('div', 'matchwrap');
      var lcol = el('div', 'matchcol'), rcol = el('div', 'matchcol');

      function drawMatch() {
        lcol.querySelectorAll('.mchip').forEach(function (x) { x.remove(); });
        rcol.querySelectorAll('.mchip').forEach(function (x) { x.remove(); });
        ex.pairs.forEach(function (p, li) {
          var b = el('button', 'mchip', (wstate.assign[li] !== undefined ? '<span class="pairno">' + (wstate.assign[li] + 1) + '</span>' : '') + esc(p.left));
          b.type = 'button';

          b.addEventListener('click', function () {

            if (wstate.assign[li] !== undefined) { delete wstate.assign[li]; wstate.activeLeft = null; drawMatch(); return; }
            wstate.activeLeft = (wstate.activeLeft === li ? null : li); drawMatch();
          });
          lcol.appendChild(b);
        });
        S.shuffles[S.current].right.forEach(function (ri, pos) {
          var usedBy = -1; Object.keys(wstate.assign).forEach(function (k) { if (wstate.assign[k] === ri) usedBy = parseInt(k, 10); });
          var b = el('button', 'mchip', (usedBy >= 0 ? '<span class="pairno">' + (usedBy + 1) + '</span>' : '') + esc(ex.pairs[ri].right));
          b.type = 'button';
          if (usedBy >= 0) b.classList.add('paired');
          b.addEventListener('click', function () {
            if (S.answers[S.current].status === 'checked') return;
            if (usedBy >= 0) { delete wstate.assign[usedBy]; drawMatch(); return; }
            if (wstate.activeLeft === null) return;
            wstate.assign[wstate.activeLeft] = ri; wstate.activeLeft = null; drawMatch();
          });
          rcol.appendChild(b);
        });
      }
      drawMatch();
      mw.appendChild(lcol); mw.appendChild(rcol); box.appendChild(mw);
      var un = el('button', 'btn btn-ghost matchundo', '↺ Undo all pairs');
      un.type = 'button';
      un.addEventListener('click', function () { if (S.answers[S.current].status === 'checked') return; wstate.assign = {}; wstate.activeLeft = null; drawMatch(); });
      box.appendChild(un);
    } else if (ex.type === 'terminal') {
      wstate.cmd = wstate.cmd || '';
      var term = el('div', 'term');
      term.appendChild(el('div', 't-bar',
        '<span class="t-dot d-r"></span><span class="t-dot d-a"></span><span class="t-dot d-g"></span><span class="t-title">' + esc(ex.shellPrompt || 'shell') + ' — type the command, then press Enter or Check</span>'));
      var body = el('div', 't-body');
      var hist = el('div', 't-hist'); hist.textContent = wstate.cmd ? wstate.cmd : '';
      var inrow = el('div', 't-in');
      var pr = el('span', 'pr', esc(ex.shellPrompt || '$'));
      var inp = document.createElement('input');
      inp.type = 'text'; inp.value = wstate.cmd; inp.setAttribute('aria-label', 'Terminal command input'); inp.autocomplete = 'off'; inp.spellcheck = false;
      inp.addEventListener('input', function () { wstate.cmd = inp.value; hist.textContent = ''; });
      inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); doCheck(); } });
      inrow.appendChild(pr); inrow.appendChild(inp);
      body.appendChild(hist); body.appendChild(inrow); term.appendChild(body);
      box.appendChild(term);
      if (ex.syntaxPanel) box.appendChild(el('div', 'syntax', ex.syntaxPanel));
      setTimeout(function () { try { inp.focus(); } catch (e) { } }, 60);
    } else if (ex.type === 'line-select') {
      wstate.sel = wstate.sel || [];
      var lv = el('div', 'logview');
      var bar = el('div', 'lv-bar', '<span class="lv-tag">FILTER</span>');
      var finp = document.createElement('input');
      finp.type = 'text'; finp.placeholder = ex.filterable ? 'filter lines… (visual aid only)' : 'visual filter…';
      finp.setAttribute('aria-label', 'Filter log lines');
      bar.appendChild(finp); lv.appendChild(bar);
      var lines = el('div', 'lv-lines');
      function drawLines(f) {

          row.setAttribute('role', 'button'); row.tabIndex = 0;
          row.setAttribute('aria-label', 'Log line ' + (i + 1) + (wstate.sel.indexOf(i) >= 0 ? ', selected' : ''));
          row.appendChild(el('span', 'ln', String(i + 1)));
          row.appendChild(el('span', null, esc(l)));
          row.addEventListener('click', function () {
            if (S.answers[S.current].status === 'checked') return;
            var p = wstate.sel.indexOf(i); if (p >= 0) { wstate.sel.splice(p, 1); row.classList.remove('sel'); row.setAttribute('aria-label', 'Log line ' + (i + 1)); }
            else { wstate.sel.push(i); row.classList.add('sel'); }
          });
          row.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); row.click(); } });
          lines.appendChild(row);
        });
      }
      drawLines('');
      finp.addEventListener('input', function () { drawLines(finp.value.trim()); });
      lv.appendChild(lines); box.appendChild(lv);
      box.appendChild(el('div', 'dd-hint', 'Click the line(s) that answer the question. The filter box is a visual aid only — filtering does not change your selection.'));
    } else if (ex.type === 'multi-step') {
      wstate.step = wstate.step === undefined ? 0 : wstate.step;
      wstate.picks = wstate.picks || {};
      wstate.stepSel = wstate.stepSel === undefined ? null : wstate.stepSel;
      drawStep();
    }
    function drawStep() {
      var sw = el('div', null, '');
      /* outcomes of already-confirmed intermediate steps */
      for (var done = 0; done < wstate.step; done++) {

      }
      var st = ex.steps[wstate.step];

        } else {

        }
      });
      sw.appendChild(confirmBtn);
      box.innerHTML = '';
      box.appendChild(sw);
    }
  }

  /* ---------------- scoring ---------------- */
  function scoreExercise(ex, wstate) {
    var items = [], N = 0, H = 0, W = 0, canon = null;
    function item(state, label) { items.push({ state: state, label: label }); }
    if (ex.type === 'qcm-single') {
      N = 1;
      var sel = wstate.sel && wstate.sel[0];
      if (sel === undefined) { item('mi', 'No option selected'); }
      else if (sel === ex.correct) { H = 1; item('ok', '✓ Correct — ' + strip(ex.options[ex.correct])); }
      else { W = 1; item('no', '✗ You chose: ' + strip(ex.options[sel])); }
      canon = ex.options[ex.correct];
    } else if (ex.type === 'qcm-multi') {
      N = ex.correct.length;
      var selset = wstate.sel || [];
      ex.correct.forEach(function (ci) {
        if (selset.indexOf(ci) >= 0) { H++; item('ok', '✓ Correct: ' + strip(ex.options[ci])); }
        else { item('mi', '○ Missed: ' + strip(ex.options[ci])); }
      });
      selset.forEach(function (si) { if (ex.correct.indexOf(si) < 0) { W++; item('no', '✗ Wrong: ' + strip(ex.options[si])); } });
      canon = ex.correct.map(function (ci) { return strip(ex.options[ci]); }).join(' · ');
    } else if (ex.type === 'fill-blank') {
      N = ex.blanks.length;
      ex.blanks.forEach(function (bl, bi) {
        var v = norm(wstate.vals && wstate.vals[bi]);
        var accept = [norm(bl.answer)].concat((bl.alts || []).map(norm));
        if (!v) { item('mi', '○ Missed blank ' + (bi + 1) + ' — expected: ' + esc(bl.answer)); }
        else if (accept.indexOf(v) >= 0) { H++; item('ok', '✓ Blank ' + (bi + 1) + ': ' + esc(bl.answer)); }
        else { W++; item('no', '✗ Blank ' + (bi + 1) + ' — you typed "' + esc(v) + '", expected: ' + esc(bl.answer)); }
      });
      canon = ex.blanks.map(function (bl) { return bl.answer; }).join(' | ');
    } else if (ex.type === 'drag-drop') {
      N = ex.bank.length;
      Object.keys(wstate.place || {}).forEach(function (k) {
        var bi = parseInt(k, 10), si = wstate.place[k];
        if (ex.slots[si] && ex.slots[si].accept.indexOf(bi) >= 0) { H++; item('ok', '✓ "' + strip(ex.bank[bi]) + '" → ' + esc(ex.slots[si].label)); }
        else { W++; item('no', '✗ "' + strip(ex.bank[bi]) + '" does not belong in ' + esc(ex.slots[si] ? ex.slots[si].label : '?')); }
      });
      ex.bank.forEach(function (t, bi) { if (wstate.place[bi] === undefined) item('mi', '○ Missed: "' + strip(t) + '" → ' + esc(slotLabelFor(ex, bi))); });
      canon = ex.slots.map(function (sl) { return sl.label + ': ' + sl.accept.map(function (bi) { return strip(ex.bank[bi]); }).join(', '); }).join(' | ');
    } else if (ex.type === 'ordering') {
      N = ex.items.length;
      var order = wstate.order || [];
      order.forEach(function (bi, pos) {
        if (bi === pos) { H++; item('ok', '✓ Position ' + (pos + 1) + ': ' + strip(ex.items[pos])); }
        else { W++; item('no', '✗ Position ' + (pos + 1) + ' — you put "' + strip(ex.items[bi]) + '", expected "' + strip(ex.items[pos]) + '"'); }
      });
      canon = ex.items.map(function (t, i) { return (i + 1) + '. ' + strip(t); }).join(' ');
    } else if (ex.type === 'matching') {
      N = ex.pairs.length;
      ex.pairs.forEach(function (p, li) {
        var a = (wstate.assign || {})[li];
        if (a === undefined) item('mi', '○ Missed: "' + strip(p.left) + '" → ' + esc(p.right));
        else if (a === li) { H++; item('ok', '✓ "' + strip(p.left) + '" → ' + esc(p.right)); }
        else { W++; item('no', '✗ "' + strip(p.left) + '" you matched to "' + strip(ex.pairs[a].right) + '", expected "' + esc(p.right) + '"'); }
      });
      canon = ex.pairs.map(function (p) { return strip(p.left) + ' = ' + strip(p.right); }).join(' | ');
    } else if (ex.type === 'terminal') {
      N = ex.elements.length;
      var cmd = norm(wstate.cmd || '');
      ex.elements.forEach(function (el2) {
        var hit = (el2.any || []).some(function (a) { return cmd.indexOf(String(a).toLowerCase()) >= 0; });
        if (hit) { H++; item('ok', '✓ ' + esc(el2.label)); }
        else { item('mi', '○ Missing: ' + esc(el2.label)); }
      });
      if (!cmd) item('mi', '○ Nothing typed — expected: ' + esc(ex.expected));
      canon = ex.expected;
    } else if (ex.type === 'line-select') {
      N = ex.badLines.length;
      var sel2 = wstate.sel || [];
      ex.badLines.forEach(function (li) {
        if (sel2.indexOf(li) >= 0) { H++; item('ok', '✓ Line ' + (li + 1) + ' is indeed the one to flag'); }
        else { item('mi', '○ Missed line ' + (li + 1) + ': ' + esc(shorten(ex.logLines[li], 90))); }
      });
      sel2.forEach(function (li) {
        if (ex.badLines.indexOf(li) < 0) { W++; item('no', '✗ Line ' + (li + 1) + ' is benign: ' + esc(shorten(ex.logLines[li], 80))); }
      });
      canon = ex.badLines.map(function (li) { return 'line ' + (li + 1); }).join(', ');
    } else if (ex.type === 'multi-step') {
      N = ex.steps.length;
      ex.steps.forEach(function (st, si) {

        if (p === undefined) item('mi', '○ Missed step ' + (si + 1) + ' — expected: ' + strip(st.options[st.correct]));
        else if (p === st.correct) { H++; item('ok', '✓ Step ' + (si + 1) + ': ' + strip(st.options[st.correct])); }
        else { W++; item('no', '✗ Step ' + (si + 1) + ' — you chose "' + strip(st.options[p]) + '", expected "' + strip(st.options[st.correct]) + '"'); }
      });
      canon = ex.steps.map(function (st, si) { return (si + 1) + '. ' + strip(st.options[st.correct]); }).join(' ');
    }
    var credit = N > 0 ? Math.max(0, (H - W) / N) : 0;
    if (N === 1) credit = H === 1 ? 1 : 0; /* single-answer: binary */
    if (S.answers[S.current].hintUsed) credit = Math.max(0, credit - 0.10);
    credit = Math.round(credit * 100) / 100;
    return { credit: credit, items: items, N: N, H: H, W: W, canon: canon };
  }
  function strip(s) { return esc(String(s).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim()); }
  function shorten(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function slotLabelFor(ex, bi) { var lbl = ''; ex.slots.forEach(function (sl) { if (sl.accept.indexOf(bi) >= 0) lbl = sl.label; }); return lbl; }

  /* ---------------- exercise screen ---------------- */
  function renderExercise(i) {
    var ex = EXERCISES[i];
    S.current = i;
    var a = S.answers[i];
    var area = $('exerciseArea'); area.innerHTML = '';

    $('tbSevWord').textContent = META.severityLabel;
    $('progressBar').style.width = Math.round(((i + 1) / EXERCISES.length) * 100) + '%';
    var tpEl = $('tbPart'); if (tpEl) { tpEl.textContent = 'Exercise ' + (i + 1) + ' of ' + EXERCISES.length; }

    var card = el('div', 'card');
    /* SCENARIO */
    var sc = el('div', 'block blk-scenario');
    var longSc = ex.scenario.length > 380;
    sc.innerHTML = '<div class="block-h"><span aria-hidden="true">📄</span> SCENARIO' + (longSc ? '<button type="button" class="sc-toggle" aria-expanded="true">⇅ collapse</button>' : '') + '</div>' +
      '<div class="block-b" id="scBody">' + ex.scenario + (ex.artifactNote ? '<div class="dd-hint">' + esc(ex.artifactNote) + '</div>' : '') + '</div>';
    card.appendChild(sc);
    if (longSc) {

    /* YOUR ANSWER */

    var abody = el('div', 'block-b'); answ.appendChild(abody); card.appendChild(answ);

    var wstate = a.wstate;

    /* action row */
    var actions = el('div', 'actions');

    checkBtn.addEventListener('click', doCheck);
    var nextBtn = el('button', 'btn btn-blue hidden', (i === EXERCISES.length - 1 || S.reviewMode) ? (S.reviewMode ? '⏭ Back to review' : '⏭ Final submit') : '⏭ Next');
    nextBtn.type = 'button'; nextBtn.id = 'nextBtn';
    nextBtn.addEventListener('click', goNext);
    var hintBtn = el('button', 'btn btn-amber', '💡 Hint (−10%)');
    hintBtn.type = 'button'; hintBtn.setAttribute('aria-label', 'Show hint, costs 10 percent of this exercise credit');
    hintBtn.disabled = a.hintUsed || a.status === 'checked';

    actions.appendChild(hintBtn); actions.appendChild(skipBtn);

  function renderTopbarButtons() {

  function doCheck() {
