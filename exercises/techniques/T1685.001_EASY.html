.cert.fail{background:linear-gradient(160deg,var(--tint-red),var(--tint-orange));border-color:var(--state-incorrect)}
.cert .clogo{font-size:34px}
.cert.pass .clogo{color:var(--state-correct)} .cert.fail .clogo{color:var(--state-incorrect)}
.cert h3{margin:6px 0 4px;font-size:22px;letter-spacing:2px}
.cert.pass h3{color:var(--state-correct)} .cert.fail h3{color:var(--state-incorrect)}
.cert p{margin:4px 0;color:var(--text-secondary);font-size:14px}
.timesum{margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);color:var(--text-secondary);font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 22px}
.hidden{display:none!important}
@media (max-width:640px){
  .matchgrid,.dndarea{grid-template-columns:1fr}
  .topbar-in{gap:6px 10px}
  .blk{padding:13px 14px}
  .feedback{margin:0 14px 16px}
}
@media (prefers-reduced-motion: reduce){
  .progress-fill{transition:none}
  .progress-fill::after{animation:none}
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

<script>
var EXAM = {"meta": {"title": "T1685.001 Disable or Modify Windows Event Log — EASY", "objectId": "T1685.001", "objectName": "Disable or Modify Windows Event Log", "objectType": "Sub-Technique", "tactic": "Defense Impairment (TA0112)", "platform": "Windows", "sevClass": "sev-easy", "sevIcon": "🟢", "sevWord": "EASY", "estimatedMinutes": 30, "timerSeconds": 1800, "passMark": 70, "topicId": "t1685.001", "batch": 1}, "intro": {"learn": "\n<p class=\"lead\">Welcome! In this exam you will learn about one exact attack behaviour from the MITRE ATT&amp;CK framework: <b>T1685.001 — Disable or Modify Windows Event Log<\/b>.<\/p>\n<p>First, what is ATT&amp;CK? It is a free, public knowledge base that describes what real attackers do, step by step. Each behaviour has an ID. This one is a <b>Sub-Technique<\/b>: a specific behaviour that belongs to a bigger technique, <b>T1685 — Disable or Modify Tools<\/b>, which sits inside the <b>Defense Impairment<\/b> tactic (ID <b>TA0112<\/b>). A tactic is the attacker's goal; a technique is how they reach it.<\/p>\n<p>Imagine you are a new analyst in a <b>SOC<\/b> (Security Operations Center — the team that watches alerts all day). Windows computers write down what happens on them: who logged in, which programs started, which settings changed. These notes are the <b>Windows Event Logs<\/b>. Your alerts, your dashboards and your searches all read those notes. Now imagine an attacker quietly turns that note-taking off. Suddenly your screen shows nothing — not because the network is safe, but because the notes stopped. That is exactly what this technique is: an attacker <b>disabling or modifying<\/b> the Windows Event Log so defenders see less.<\/p>\n<p>You will meet this object in many real work tasks. A <b>SOC analyst<\/b> triages alerts about the EventLog service stopping. A <b>threat hunter<\/b> searches for the commands and registry keys that turn logging off. An <b>incident responder<\/b> finds out how long the attacker was invisible. A <b>CTI analyst<\/b> (Cyber Threat Intelligence — the person who studies attacker groups) reports which groups used this trick. A <b>detection engineer<\/b> builds alerts from detection strategy <b>DET0187<\/b>. A <b>control owner<\/b> applies mitigations such as <b>M1024 Restrict Registry Permissions<\/b>. The tools involved are plain Windows tools: <code>sc<\/code>, <code>wevtutil<\/code>, <code>auditpol<\/code>, PowerShell, and the registry.<\/p>\n<p>By the end you will recognise the technique, name its tactic, read the simple commands it uses, and know the first safe steps a defender takes. A <b>red teamer<\/b> also studies this page to plan authorised tests, and a <b>GRC analyst<\/b> (governance, risk and compliance) maps it to the company's control checklist. No prior expert knowledge is needed — every term is explained in plain words.<\/p>\n", "keywords": [{"theme": "The technique and its ATT&amp;CK family", "items": ["<b>T1685.001<\/b> — Disable or Modify Windows Event Log (the Sub-Technique you are studying)", "<b>T1685<\/b> — Disable or Modify Tools (its parent technique)", "<b>TA0112<\/b> — Defense Impairment (the tactic: the attacker's goal is to weaken defences)", "<b>DET0187<\/b> — Detect Disabled Windows Event Log (the detection strategy defenders build alerts from)"]}, {"theme": "How logging gets turned off", "items": ["The <b>EventLog<\/b> service — the Windows component that writes the event logs", "<code>sc config eventlog start=disabled<\/code> — stops the service from starting again", "<code>wevtutil sl Security /e:false<\/code> — turns off one log channel (Security)", "<code>auditpol /set ... /success:disable /failure:disable<\/code> — switches auditing off for a category", "The registry <b>Start value<\/b> under <code>Services\\EventLog<\/code> — changed, then a reboot makes it work"]}, {"theme": "Commands that only look (read-only)", "items": ["<code>sc query eventlog<\/code> — shows the service state", "<code>wevtutil el<\/code> — lists the log channels", "<code>auditpol /get /category:*<\/code> — shows the current audit policy"]}, {"theme": "What defenders see (telemetry)", "items": ["<b>System channel, event 7035<\/b> — a service entered the stopped state", "<b>Security channel, event 1102<\/b> — the audit log was cleared", "<b>Sysmon event 1<\/b> — a process was created; <b>Sysmon event 13<\/b> — a registry value was set"]}, {"theme": "Controls that make it harder", "items": ["<b>M1024<\/b> Restrict Registry Permissions · <b>M1018<\/b> User Account Management · <b>M1047<\/b> Audit", "<b>Administrator<\/b> privileges — the usual requirement to disable logging"]}, {"theme": "Disable is not clear", "items": ["<b>T1685.005<\/b> Clear Windows Event Logs — a different sub-technique (deleting past records, e.g. <code>wevtutil cl security<\/code>)"]}], "how": "\n<ul class=\"howlist\">\n<li><b>Goal:<\/b> reach at least <b>70%<\/b>. That is a <span class=\"ok-i\">✓ PASS<\/span>. Below it is a <span class=\"err-i\">✗ FAIL<\/span>, and you can retake the exam.<\/li>\n<li><b>16 exercises.<\/b> You will see many types: multiple choice, matching pairs, drag-and-drop, fill-in-the-blank, ordering steps, a log viewer where you click lines, and one small SOC decision. Each exercise has three blocks, always in the same order: <b style=\"color:var(--accent-blue)\">SCENARIO<\/b> (the situation), <b style=\"color:var(--accent-amber)\">QUESTION<\/b> (what to do), <b style=\"color:var(--accent-green)\">YOUR ANSWER<\/b> (where you answer).<\/li>\n<li><b>Timer:<\/b> this exam gives you <b>30 minutes<\/b>. Two things can stop the timer. Press <b>⏸ Pause<\/b> for a real break — the exercise hides until you press Resume. And when you press <b>✓ Check<\/b>, the timer stops by itself so you can read the feedback without pressure; it starts again only when you press <b>Next ▶<\/b>. The header always shows which pause is active.<\/li>\n<li><b>Partial credit:<\/b> exercises with several correct items give you a fair share. Get 3 of 5 items right → credit 0.60. Selecting wrong items lowers your credit, so do not guess everything. One-choice exercises are simply right or wrong.<\/li>\n<li><b>Hint:<\/b> the 💡 Hint button gives you one nudge per exercise and costs 10% of that exercise's credit.<\/li>\n<li><b>Skip:<\/b> every exercise has a ⚠ Skip button. Skipped exercises wait in a pool. Before the exam ends you can return to them as often as you like, while the timer runs. Ones you never answer are left out of your score — they help you and they do not hurt you.<\/li>\n<li>Press <b>Start<\/b> when you are ready. Good luck!<\/li>\n<\/ul>\n"}, "exercises": [{"id": "e01", "type": "qcm", "tag": "What is T1685.001?", "summary": "ATT&amp;CK excerpt T1685.001 — recognise the behaviour", "scenario": [{"label": "ARTEFACT 1 — ATT&amp;CK excerpt (T1685.001)", "html": "<p>“Adversaries may <b>disable or modify the Windows Event Log<\/b> to limit data that can be leveraged for detections and audits. Windows Event Log records user and system activity such as login attempts and process creation.”<\/p><p class='hl-dim'>Source: MITRE ATT&amp;CK, technique T1685.001.<\/p>"}], "question": "Which sentence describes this technique correctly?", "hint": "The key words in the excerpt are <i>disable<\/i> and <i>modify<\/i>. The attacker wants less data in the logs, not more.", "qcm": {"options": [{"k": "A", "t": "Attackers write fake events into the logs so analysts read wrong information."}, {"k": "B", "t": "Attackers copy the event logs to another server to study the system later."}, {"k": "C", "t": "Attackers turn logging off or change its settings so less evidence is written."}, {"k": "D", "t": "Attackers delete the log files that already exist to erase old evidence."}], "correct": "C"}, "explain": "The excerpt says attackers <b>disable or modify<\/b> logging so there is <b>less data for detections<\/b>. Option C says exactly this. B is reading and copying logs — that is collection, not this technique. D is deleting existing records, which is a different sub-technique called Clear Windows Event Logs (T1685.005). A is writing fake events, which is not what this page describes. <b>Attacker view:<\/b> a dark log means fewer alerts during the next steps. <b>Defender view:<\/b> when logging stops, treat it as a signal in itself.", "study": "Read the T1685.001 description again and compare it with T1685.005 (clearing logs)."}, {"id": "e02", "type": "match", "tag": "The ATT&amp;CK family of T1685.001", "summary": "Match ATT&amp;CK IDs to their object roles", "scenario": [{"prose": "A senior analyst sends you this short note: “Every ATT&amp;CK ID has a role. T1685.001 is the exact behaviour. T1685 is the bigger family it belongs to. TA0112 names the attacker's goal. DET0187 is how we detect it.”"}], "question": "Match each ATT&amp;CK ID to its correct role.", "hint": "Think about the family: the technique, the parent it sits under, the tactic (the goal), and the detection strategy (the alert logic).", "left": [], "match": {"left": [{"k": "L1", "t": "T1685.001"}, {"k": "L2", "t": "T1685"}, {"k": "L3", "t": "TA0112"}, {"k": "L4", "t": "DET0187"}], "right": [{"k": "R3", "t": "The tactic — Defense Impairment (the attacker goal)"}, {"k": "R1", "t": "The Sub-Technique — Disable or Modify Windows Event Log"}, {"k": "R4", "t": "The detection strategy — Detect Disabled Windows Event Log"}, {"k": "R2", "t": "The parent technique — Disable or Modify Tools"}], "pairs": {"L1": "R1", "L2": "R2", "L3": "R3", "L4": "R4"}}, "explain": "T1685.001 is the <b>Sub-Technique<\/b> — one exact behaviour. T1685 is its <b>parent technique<\/b>, Disable or Modify Tools, which covers many ways to weaken security tools. TA0112 is the <b>tactic<\/b>, Defense Impairment — the goal of weakening defences. DET0187 is the <b>detection strategy<\/b> that tells defenders which data to watch. Knowing the role of each ID helps you read any ATT&amp;CK page fast.", "study": "Open the T1685 page and look at how its sub-techniques are listed under one parent."}, {"id": "e03", "type": "qcm", "tag": "Which tactic?", "summary": "T1685.001 belongs to the Defense Impairment tactic", "scenario": [{"prose": "Your team lead asks: “T1685.001 weakens the records defenders rely on. In the current ATT&amp;CK matrix, which tactic does it sit in?”"}], "question": "Which tactic does T1685.001 belong to?", "hint": "The excerpt says the attacker wants to <i>weaken<\/i> something defenders rely on. Which tactic name matches that goal?", "options": [{"k": "A", "t": "Defense Impairment — the attacker's goal is to weaken defences"}, {"k": "B", "t": "Collection — the attacker's goal is to gather information"}, {"k": "C", "t": "Credential Access — the attacker's goal is to steal passwords"}, {"k": "D", "t": "Reconnaissance — the attacker's goal is to learn about the target"}], "correct": "A", "explain": "T1685.001 sits in the <b>Defense Impairment<\/b> tactic (TA0112). A tactic is the attacker's <b>goal<\/b>. Here the goal is to weaken a defence — the logging that defenders depend on. Collection is about taking data; Credential Access is about stealing passwords; Reconnaissance is about watching the target before touching it. Older ATT&amp;CK versions kept this behaviour inside Defense Evasion, which is why you may still see that name in older reports.", "study": "Look at tactic TA0112 and name three techniques that live there."}, {"id": "e04", "type": "match", "tag": "Three commands, three meanings", "summary": "Match the disabling commands to what they do", "scenario": [{"prose": "A SOC (Security Operations Center) alert shows three commands that ran on one computer. Your lead says: “Match each command to what it actually does.”"}, {"label": "ARTEFACT 1 — Process creation excerpt (Sysmon event 1)", "html": "<div class=\"codeblock\"><span class=\"hl-dim\">08:14:02<\/span>  <span class=\"hl-cmd\">sc<\/span> <span class=\"hl-arg\">config<\/span> <span class=\"hl-pth\">eventlog<\/span> <span class=\"hl-arg\">start=disabled<\/span>\n<span class=\"hl-dim\">08:14:37<\/span>  <span class=\"hl-cmd\">wevtutil<\/span> <span class=\"hl-arg\">sl<\/span> <span class=\"hl-pth\">Security<\/span> <span class=\"hl-arg\">/e:false<\/span>\n<span class=\"hl-dim\">08:15:10<\/span>  <span class=\"hl-cmd\">auditpol<\/span> <span class=\"hl-arg\">/set<\/span> <span class=\"hl-arg\">/category:\"Account Logon\"<\/span> <span class=\"hl-flag\">/success:disable /failure:disable<\/span><\/div>"}], "question": "Match each command to its plain meaning.", "hint": "Read each command slowly: one changes a service, one turns a log channel off, one changes the audit policy.", "match": {"left": [{"k": "L1", "t": "<code>sc config eventlog start=disabled<\/code>"}, {"k": "L2", "t": "<code>wevtutil sl Security /e:false<\/code>"}, {"k": "L3", "t": "<code>auditpol /set /category:\"Account Logon\" ...disable<\/code>"}], "right": [{"k": "R2", "t": "Turns off the Security log channel, so it records nothing"}, {"k": "R3", "t": "Switches auditing off for the Account Logon category"}, {"k": "R1", "t": "Sets the EventLog service so it will not start again"}], "pairs": {"L1": "R1", "L2": "R2", "L3": "R3"}}, "explain": "<code>sc config eventlog start=disabled<\/code> changes the <b>service configuration<\/b> so the EventLog service no longer starts with Windows. <code>wevtutil sl Security /e:false<\/code> changes one <b>log channel<\/b> — the Security log — and switches it off. The <code>auditpol /set<\/code> command changes the <b>audit policy<\/b>: it stops recording success and failure events for one category. All three are ways to reach the same goal: less recorded data. The ATT&amp;CK page lists all three as examples of this technique.", "study": "Type <code>auditpol /get /category:*<\/code> on a test machine (read-only) and compare it with the excerpt."}, {"id": "e05", "type": "dnd", "tag": "Change or just look?", "summary": "Sort six commands: change logging vs read logging state", "scenario": [{"prose": "Sorting commands is a daily SOC habit: commands that <b>change<\/b> things are dangerous, commands that only <b>look<\/b> are usually safe. Sort these six commands."}], "question": "Drag each command into the correct bucket.", "hint": "Words like <i>config<\/i>, <i>set<\/i>, and <i>/e:false<\/i> change settings. Words like <i>query<\/i>, <i>el<\/i> (enumerate logs) and <i>/get<\/i> only show information.", "dnd": {"buckets": [{"k": "B1", "t": "Changes logging (off state)"}, {"k": "B2", "t": "Only looks at logging (read-only)"}], "items": [{"k": "I1", "t": "sc config eventlog start=disabled", "b": "B1"}, {"k": "I2", "t": "wevtutil sl Security /e:false", "b": "B1"}, {"k": "I3", "t": "auditpol /set /success:disable", "b": "B1"}, {"k": "I4", "t": "sc query eventlog", "b": "B2"}, {"k": "I5", "t": "wevtutil el", "b": "B2"}, {"k": "I6", "t": "auditpol /get /category:*", "b": "B2"}]}, "explain": "<b>Change commands:<\/b> <code>sc config<\/code> edits the service configuration, <code>wevtutil sl ... /e:false<\/code> disables a channel, <code>auditpol /set<\/code> edits the audit policy. <b>Read-only commands:<\/b> <code>sc query<\/code> shows a service state, <code>wevtutil el<\/code> lists channels, <code>auditpol /get<\/code> shows the policy. When you investigate, read-only commands are safe to run yourself; change commands in a log are the <b>evidence<\/b>. <b>Defender view:<\/b> alert on the change commands, allow the read-only ones in your tuning.", "study": "Run the three read-only commands on a Windows test machine and read their output."}, {"id": "e06", "type": "fill", "tag": "Two facts every analyst knows", "summary": "Complete two sentences about the EventLog service and the reboot", "scenario": [{"prose": "Fill the two gaps in this training card. The word bank below is shuffled — type your answers or click the words."}], "question": "Complete the two sentences with the words from the bank.", "hint": "One gap is the name of the Windows service that writes the logs. The other gap is what must happen after a registry change for it to take effect.", "fill": {"sentence": "The ___ service writes the Windows event logs. An attacker who edits the registry Start value must ___ the system before the logs stay silent.", "blanks": [{"accept": ["eventlog", "event log", "windows event log"], "size": 12}, {"accept": ["reboot", "rebooted", "restart", "restarted", "rebooted/restart"], "size": 10}], "bank": ["EventLog", "rebooted", "Sysmon", "signed"]}, "explain": "The <b>EventLog service<\/b> is the component that maintains the logs, and it starts automatically when Windows starts. A registry change is only <b>read at boot<\/b>, so the attacker must <b>reboot<\/b> for the disabled logging to take effect. That reboot is useful for defenders: a strange reboot right after a registry change is a pattern worth alerting on.", "study": "Read the T1685.001 description paragraph about the registry Start value."}, {"id": "e07", "type": "qcm", "tag": "Event 1102", "summary": "One Security log line — what does event 1102 mean?", "scenario": [{"label": "ARTEFACT 1 — Security event log line", "html": "<div class=\"codeblock\"><span class=\"hl-dim\">2026-10-14 03:12:44<\/span>  <span class=\"hl-pth\">WinEventLog:Security<\/span>  <span class=\"hl-num\">EventCode=1102<\/span>  <span class=\"hl-warn\">MESSAGE: The audit log was cleared.<\/span>  <span class=\"hl-dim\">AccountName=SVC_BACKUP<\/span><\/div>"}], "question": "What does Windows event ID 1102 tell you?", "hint": "Read the message text in the line itself — it names exactly what happened to the audit log.", "options": [{"k": "A", "t": "A user logged on successfully with a password"}, {"k": "B", "t": "The audit log was cleared — the records were wiped"}, {"k": "C", "t": "The EventLog service started after a reboot"}, {"k": "D", "t": "A new program was installed on the computer"}], "correct": "B", "explain": "Event <b>1102<\/b> in the Security channel means <b>the audit log was cleared<\/b>. Notice the account in the line: it claims a service account did it, which is a strong warning sign — service accounts rarely clear logs. Note the difference: 1102 appears when records are <b>cleared<\/b>; when logging is merely <b>disabled<\/b>, there is often no such event at all — the log just goes quiet. That “going quiet” is exactly what T1685.001 causes.", "study": "Search your SIEM (Security Information and Event Management system — the log database) for event 1102 in the last 30 days."}, {"id": "e08", "type": "match", "tag": "Read the telemetry", "summary": "Match three event IDs to their plain meaning", "scenario": [{"prose": "The detection strategy DET0187 watches a few simple signals. Here are three of them. Match each signal to what it means."}], "question": "Match each event signal to its meaning.", "hint": "7035 is about services, Sysmon 1 is about processes starting, Sysmon 13 is about registry values changing.", "match": {"left": [{"k": "L1", "t": "System channel · event 7035"}, {"k": "L2", "t": "Sysmon · event 1"}, {"k": "L3", "t": "Sysmon · event 13"}], "right": [{"k": "R2", "t": "A process was created — a program started running"}, {"k": "R3", "t": "A registry value was set or changed"}, {"k": "R1", "t": "A service entered the stopped or running state"}], "pairs": {"L1": "R1", "L2": "R2", "L3": "R3"}}, "explain": "<b>7035<\/b> (System channel) tells you a service changed state — for example EventLog entered the <i>stopped<\/i> state. <b>Sysmon 1<\/b> records every process that starts, with its full command line — this is where you see <code>auditpol<\/code> or <code>wevtutil<\/code> being run. <b>Sysmon 13<\/b> records registry value changes — this is where you see the logging keys being edited. Together these three signals cover the main ways T1685.001 is performed, which is why the analytic AN0535 uses them.", "study": "Read the analytic AN0535 section of detection strategy DET0187 and list its log sources."}, {"id": "e09", "type": "logs", "tag": "Find the stop", "summary": "Log viewer — click the one line that shows the EventLog service stopping", "scenario": [{"prose": "This is a small slice of a host's telemetry from one morning. Use the filter box if you need it, then click the one line that shows the EventLog service stopping."}], "question": "Click the ONE line that shows the EventLog service entered the stopped state.", "hint": "You are looking for a 7035 event about the EventLog service — and it must say <i>stopped<\/i>, not <i>running<\/i>.", "logs": {"prompt": "Click the line that shows the EventLog service stopping, then press Check.", "lines": [{"h": "<span class='hl-dim'>08:02:11<\/span> <span class='hl-pth'>Sysmon EV:1<\/span> Process Create: svchost.exe -k netsvcs -p -s EventLog (normal service host start)"}, {"h": "<span class='hl-dim'>08:05:40<\/span> <span class='hl-pth'>Sysmon EV:1<\/span> Process Create: chrome.exe -profile HR-WS-22 (user opens browser)"}, {"h": "<span class='hl-dim'>08:11:02<\/span> <span class='hl-pth'>System EV:7035<\/span> Service Control Manager: the <span class='hl-warn'>EventLog service entered the stopped state<\/span>"}, {"h": "<span class='hl-dim'>08:11:03<\/span> <span class='hl-pth'>System EV:7045<\/span> A new service was installed: name=WinRMSvcHelper (unusual, but not a state change)"}, {"h": "<span class='hl-dim'>08:12:19<\/span> <span class='hl-pth'>Security EV:4624<\/span> An account successfully logged on: SVC_SQLAgent (type 3, network)"}, {"h": "<span class='hl-dim'>08:14:56<\/span> <span class='hl-pth'>Sysmon EV:3<\/span> Network connection: HR-WS-22 → update-server:443 (allowed)"}, {"h": "<span class='hl-dim'>08:17:31<\/span> <span class='hl-pth'>System EV:7036<\/span> The EventLog service entered the <span class='hl-dim'>running<\/span> state"}, {"h": "<span class='hl-dim'>08:19:02<\/span> <span class='hl-pth'>Security EV:4688<\/span> A new process was created: notepad.exe"}], "needles": [2]}, "explain": "Line 3 is <b>event 7035<\/b> and says the EventLog service entered the <b>stopped<\/b> state — that is the signal. Line 7 is the trap: it is also a 7035-style state change, but it says <i>running<\/i>, which is the healthy state. Line 4 (a new service) is interesting but is not a service state change. <b>Defender view:<\/b> this single line is worth an alert, because the EventLog service should not stop on a normal workstation.", "study": "Practise reading state events: 7035 (state change) versus 7036 (state) versus 7045 (new service)."}, {"id": "e10", "type": "qcm", "tag": "Who may turn it off?", "summary": "Which privilege is normally needed to disable the EventLog service?", "scenario": [{"prose": "A trainee asks: “Could any ordinary user on the office laptops just switch the event logging off?”"}], "question": "Which privilege does disabling the EventLog service normally require?", "hint": "Think about who may change service settings and protected registry keys on a normal work computer.", "options": [{"k": "A", "t": "Administrator rights — full control over the system"}, {"k": "B", "t": "Normal everyday user rights are enough"}, {"k": "C", "t": "Only rights to read the Security log"}, {"k": "D", "t": "No rights at all — anyone can do it from the login screen"}], "correct": "A", "explain": "Changing the EventLog service configuration or its protected registry keys requires <b>Administrator<\/b> rights. That is good news for defenders: it means an attacker needs a privileged account first, which is why the mitigation <b>M1018 User Account Management<\/b> (fewer admins, well-managed admins) matters. One honest nuance from the ATT&amp;CK page: a special registry location (<code>...\\WMI\\Autologger\\EventLog-Security<\/code>) has been abused without admin rights — you will meet it in a harder exam.", "study": "Compare the privileges of your own accounts: who in your company is admin on workstations?"}, {"id": "e11", "type": "qcm", "tag": "One key, one log", "summary": "Which log does the Autologger EventLog-Security key control?", "scenario": [{"label": "ARTEFACT 1 — Registry change (Sysmon event 13)", "html": "<div class=\"codeblock\">EventType: <span class=\"hl-kw\">SetValue<\/span>\nTargetObject: <span class=\"hl-pth\">HKLM\\SYSTEM\\CurrentControlSet\\Control\\WMI\\Autologger\\EventLog-Security<\/span>\\<span class=\"hl-flag\">Start<\/span>\nDetails: <span class=\"hl-err\">0<\/span>   <span class=\"hl-dim\">(was 1 — auto-start)<\/span>   User: DESKTOP\\svc_print<\/div>"}], "question": "After a reboot, which log does this registry change silence?", "hint": "The key's own name ends with the channel it controls — read the last word before \\Start.", "options": [{"k": "A", "t": "No log — this key only stores display names"}, {"k": "B", "t": "Every event log on the whole system"}, {"k": "C", "t": "Only the Application log"}, {"k": "D", "t": "Only the Security log"}], "correct": "D", "explain": "The key name tells you the answer: <code>Autologger\\EventLog-<b>Security<\/b><\/code> controls the <b>Security<\/b> channel. Setting its <code>Start<\/code> value to 0 and rebooting silences exactly that log. The ATT&amp;CK page notes this key has been abused even <b>without Administrator rights<\/b>. Only the sibling keys <code>EventLog-System<\/code> and <code>EventLog-Application<\/code> control the other channels. <b>Defender view:<\/b> alert on any <code>SetValue<\/code> under <code>...\\WMI\\Autologger\\<\/code> — normal admins rarely touch it.", "study": "On a test machine, open <code>...\\Control\\WMI\\Autologger<\/code> and read the Start values (read-only)."}, {"id": "e12", "type": "order", "tag": "The quiet-reboot method", "summary": "Order the three steps of disabling logging via the registry", "scenario": [{"prose": "An attacker chose the registry method. Put the three steps in the order they happen."}], "question": "Drag the steps into the correct order (first step on top).", "hint": "First the change is written, then the computer must restart, and only then does the attacker enjoy the silence.", "order": {"items": [{"k": "S1", "t": "Edit the Start value under Services\\EventLog (or an Autologger key)"}, {"k": "S2", "t": "Reboot the system so Windows reads the new value"}, {"k": "S3", "t": "Operate while the log no longer records anything"}]}, "explain": "The registry is read <b>at boot<\/b>: write the value → reboot → silence. This order matters for detection: on a healthy host, a registry write to a logging key followed by a reboot is rare enough to alert on. It also explains why attackers love maintenance windows — a reboot then looks normal.", "study": "Compare this with the service method: which one needs a reboot and which one does not?"}, {"id": "e13", "type": "dnd", "tag": "Disable or clear?", "summary": "Sort four commands: T1685.001 (disable) vs T1685.005 (clear)", "scenario": [{"prose": "These two sub-techniques look similar but are different. <b>Disabling<\/b> stops new records being written. <b>Clearing<\/b> erases records that already exist. Sort the commands."}], "question": "Drag each command to the sub-technique it belongs to.", "hint": "<i>cl<\/i> in <code>wevtutil cl<\/code> means <i>clear<\/i>. <i>sl<\/i> with <i>/e:false<\/i> means set-log and disable. <i>Remove-EventLog<\/i> removes a log.", "dnd": {"buckets": [{"k": "B1", "t": "T1685.001 — disable or modify logging"}, {"k": "B2", "t": "T1685.005 — clear the logs"}], "items": [{"k": "I1", "t": "wevtutil sl Security /e:false", "b": "B1"}, {"k": "I2", "t": "sc config eventlog start=disabled", "b": "B1"}, {"k": "I3", "t": "wevtutil cl security", "b": "B2"}, {"k": "I4", "t": "Remove-EventLog -LogName Security", "b": "B2"}]}, "explain": "Disabling changes <b>future<\/b> logging: <code>sl ... /e:false<\/code> switches the channel off, <code>sc config ... start=disabled<\/code> stops the service from starting. Clearing destroys <b>past<\/b> records: <code>wevtutil cl security<\/code> wipes the log, and <code>Remove-EventLog<\/code> deletes the log itself. A careful attacker may do both — first clear the history, then disable the future. For your reports: clearing maps to <b>T1685.005<\/b>, disabling maps to <b>T1685.001<\/b>.", "study": "Re-read the T1685.005 description and note its three main commands."}, {"id": "e14", "type": "match", "tag": "Mitigations in plain words", "summary": "Match three mitigations to what they actually do here", "scenario": [{"prose": "The T1685.001 page lists mitigations — controls that make the attack harder. Match each one to its plain purpose."}], "question": "Match each mitigation to its plain purpose.", "hint": "One is about the registry keys, one is about who holds admin rights, one is about checking settings regularly.", "match": {"left": [{"k": "L1", "t": "M1024 Restrict Registry Permissions"}, {"k": "L2", "t": "M1018 User Account Management"}, {"k": "L3", "t": "M1047 Audit"}], "right": [{"k": "R2", "t": "Fewer people hold admin rights, so fewer can stop logging"}, {"k": "R3", "t": "Check logging settings often, so changes get noticed fast"}, {"k": "R1", "t": "Only trusted admins may change the logging registry keys"}], "pairs": {"L1": "R1", "L2": "R2", "L3": "R3"}}, "explain": "<b>M1024<\/b> locks the registry keys that control logging (for example <code>Services\\EventLog<\/code> and the Autologger keys) so that only chosen admins can write them. <b>M1018<\/b> reduces and manages admin accounts — an attacker with no admin cannot disable the service the normal way. <b>M1047<\/b> means regular checks: compare the audit policy and service config against a known-good baseline. The three work together: fewer admins, locked keys, regular checks.", "study": "Pick one mitigation and write two sentences on how your team would implement it."}, {"id": "e15", "type": "fill", "tag": "One word for the report", "summary": "Complete the CTI report sentence with the right keyword", "scenario": [{"prose": "You are drafting your first threat-intel note. Your lead asks for the precise verb that matches T1685.001."}, {"label": "ARTEFACT 1 — Draft note", "html": "<div class=\"codeblock\"><span class=\"hl-dim\">TLP:CLEAR — internal note, draft 2<\/span>\n“Threat actors may <span class=\"hl-err\">______<\/span> the Windows Event Log to limit the data\ndefenders can use for detections (MITRE ATT&amp;CK T1685.001).”<\/div>"}], "question": "Fill the gap with the keyword that matches T1685.001.", "hint": "The technique name starts with “Disable or …”. The verb must describe stopping or changing the logging, not improving it.", "fill": {"sentence": "Threat actors may ___ the Windows Event Log to limit the data defenders can use for detections (MITRE ATT&amp;CK T1685.001).", "blanks": [{"accept": ["disable", "turn off", "modify", "tamper with", "switch off"], "size": 12}], "bank": ["disable", "enrich", "forward", "sign"]}, "explain": "The honest verb here is <b>disable<\/b> (or <i>modify<\/i> / <i>turn off<\/i>). “Enrich” would mean making logs better, “forward” means sending them elsewhere, “sign” means cryptographically marking them. In a CTI note the verb must match the ATT&amp;CK technique exactly — your reader will map the sentence straight to T1685.001, so loose wording creates wrong mapping.", "study": "Rewrite the sentence using “modify” and check it still matches the technique name."}, {"id": "e16", "type": "branch", "tag": "Your first SOC decision", "summary": "An alert says the EventLog service stopped — choose the correct first step", "scenario": [{"label": "ARTEFACT 1 — SOC alert queue", "html": "<div class=\"codeblock\"><span class=\"hl-num\">Ticket #4187<\/span>  <span class=\"hl-warn\">SEV: HIGH<\/span>  Host: FIN-WS-04\n<span class=\"hl-dim\">03:12:07<\/span> System EV:7035 — the EventLog service entered the <span class=\"hl-err\">stopped<\/span> state\n<span class=\"hl-dim\">03:12:08<\/span> Security channel: no new records since 03:12:07\nOwner: <i>(unassigned)<\/i>   Change window: <i>none scheduled<\/i><\/div>"}], "question": "What is the correct first simple step for the on-call analyst?", "hint": "This is about the tactic Defense Impairment: the first duty is to understand and report, not to hide the problem or reboot it away.", "branch": {"steps": [{"label": "STEP 1 OF 1 — Triage decision", "scen": [], "question": "Pick the correct first step.", "options": [{"k": "A", "t": "Close the alert — services sometimes stop on their own"}, {"k": "B", "t": "Reboot FIN-WS-04 so the service starts again, then close"}, {"k": "C", "t": "Check which account and program stopped the service, and raise it to the IR lead"}, {"k": "D", "t": "Disable the audit policy so the host stops generating alerts"}], "correct": "C"}]}, "explain": "C is right: first <b>gather the facts<\/b> (which account, which program, when) and <b>tell the incident response lead<\/b> — a stopped EventLog service outside a change window is a classic Defense Impairment signal. A and B are dangerous: closing or rebooting destroys the very state you need to investigate, and the reboot may even be what the attacker wants. D is literally helping the attacker — disabling auditing is the attack goal itself. <b>Defender view:<\/b> preserve, verify, escalate. <b>Attacker view:<\/b> they hope you choose A or B.", "study": "Write the first three checklist lines your team would follow for a 7035 alert on EventLog."}]};

'use strict';
/* ============================ helpers ============================ */
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function norm(s){ return String(s).replace(/\s+/g,' ').trim().toLowerCase(); }
function scoreExercise(H, W, N){ if (N <= 0) return 0; return Math.max(0, (H - W) / N); }
function fmtTime(sec){ sec = Math.max(0, sec); var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }

/* ============================ state ============================ */
var TSTATE = { RUNNING:'RUNNING', PAUSED_MANUAL:'PAUSED_MANUAL', PAUSED_AUTO_CHECK:'PAUSED_AUTO_CHECK', ENDED:'ENDED' };
var S = {
  screen: 'intro', order: [], idx: 0,
  credits: {}, checked: {}, hintUsed: {}, skipped: [],
  mode: 'normal', reviewFrom: null,
  timeRemain: EXAM.meta.timerSeconds, timerState: TSTATE.RUNNING, prevTimerState: null,
  manualSec: 0, autoSec: 0, reported: false,
  rt: {}, handshake: { username:'', country:'', locale:'en' }
};
var ticker = null;

function total(){ return EXAM.exercises.length; }
function cur(){ return EXAM.exercises[S.order[S.idx]]; }
function answeredCount(){ var n = 0; for (var k in S.checked){ if (S.checked[k]) n++; } return n; }
function creditSum(){ var s = 0; for (var k in S.credits){ s += S.credits[k]; } return s; }

/* ============================ timer FSM ============================ */
function setTimerState(st){
  S.prevTimerState = S.timerState; S.timerState = st; renderTimer();
}
function resumeTimer(){
  if (S.timerState === TSTATE.ENDED) return;
  setTimerState(S.prevTimerState === TSTATE.PAUSED_AUTO_CHECK ? TSTATE.PAUSED_AUTO_CHECK : TSTATE.RUNNING);
}
function startTicker(){
  if (ticker) return;
  ticker = setInterval(function(){
    if (S.screen === 'intro') return;
    if (S.timerState === TSTATE.RUNNING){
      if (S.timeRemain > 0){ S.timeRemain--; renderTimer(); if (S.timeRemain === 0) timeUp(); }
    } else if (S.timerState === TSTATE.PAUSED_MANUAL){ S.manualSec++; }
    else if (S.timerState === TSTATE.PAUSED_AUTO_CHECK){ S.autoSec++; }
  }, 1000);
}
function timeUp(){
  setTimerState(TSTATE.ENDED);
  if (S.screen === 'exam' && !S.checked[S.idx]) { S.skipped.push(S.idx); }
  finishExam();
}
function renderTimer(){
  var tv = $('#tval'); if (tv) tv.textContent = fmtTime(S.timeRemain);
  var ts = $('#tstate'); if (!ts) return;
  var map = {
    RUNNING: ['▶','RUNNING',''],
    PAUSED_MANUAL: ['⏸','PAUSED — manual (press Resume)','paused'],
    PAUSED_AUTO_CHECK: ['⏸','PAUSED — reviewing feedback (resumes on Next)','paused'],
    ENDED: ['⏹','ENDED','ended']
  };
  var m = map[S.timerState] || map.RUNNING;
  ts.innerHTML = m[0] + ' ' + esc(m[1]);
  ts.className = 'tstate ' + m[2];
  var pb = $('#pausebtn');
  if (pb) pb.textContent = (S.timerState === TSTATE.PAUSED_MANUAL) ? '▶ Resume' : '⏸ Pause';
}
function renderScore(){
  var n = answeredCount(), s = creditSum();
  var pct = n > 0 ? Math.round((s / n) * 100) : 0;
  var e = $('#tbscore');
  if (e) e.innerHTML = 'Score <b>' + s.toFixed(1) + '</b> / ' + n + ' · ' + pct + '%';
}

/* ============================ build runtime ============================ */
/* schema normalisation: accept legacy flat qcm shape (options/correct at top level) */
function normalizeEx(ex){
  if (ex.type === 'qcm' && !ex.qcm && ex.options){
    ex.qcm = { options: ex.options, correct: ex.correct };
  }
  return ex;
}
function buildRt(exRaw){
  var ex = normalizeEx(exRaw);
  var rt = { ex: ex };
  if (ex.type === 'qcm'){ rt.opts = shuffle(ex.qcm.options.map(function(o){ return o.k; })); rt.sel = null; }
  if (ex.type === 'multi'){ rt.opts = shuffle(ex.multi.options.map(function(o){ return o.k; })); rt.sel = []; }
  if (ex.type === 'match'){ rt.right = shuffle(ex.match.right.map(function(r){ return r.k; })); rt.pairs = {}; rt.selL = null; }
  if (ex.type === 'dnd'){ rt.items = shuffle(ex.dnd.items.map(function(i){ return i.k; })); rt.place = {}; rt.selChip = null; }
  if (ex.type === 'fill'){ rt.bank = shuffle(ex.fill.bank.slice()); rt.vals = []; }
  if (ex.type === 'order'){ rt.orderKeys = shuffle(ex.order.items.map(function(i){ return i.k; })); rt.selIdx = null; }
  if (ex.type === 'logs'){ rt.sel = []; }
  if (ex.type === 'term'){ rt.ran = false; rt.lastCmd = ''; rt.lastKind = ''; rt.hist = []; }
  if (ex.type === 'branch'){ rt.step = 0; rt.choices = []; rt.optOrders = ex.branch.steps.map(function(st){ return shuffle(st.options.map(function(o){ return o.k; })); }); }
  return rt;
}

/* ============================ intro ============================ */

  S.screen = 'intro';
  var m = EXAM.meta, I = EXAM.intro;
  var h = '';
  h += '<div class="wrap">';
  h += '<section class="card intro-head" aria-label="Exam facts">';

  h += '<span class="ifact">Object type: <b>' + esc(m.objectType) + '</b></span>';
  h += '<span class="ifact">Exercises in this file: <b>' + total() + '</b></span>';
