<script>
window.EXAM = {"meta": {"topicId": "t1566.001", "batch": 2, "title": "T1566.001 Phishing: Spearphishing Attachment — MEDIUM", "difficulty": "medium", "questionCount": 12, "estimatedMinutes": 30, "passMark": 70}, "timerSec": 1800, "difficultyLabel": "MEDIUM", "subtitle": "CyberPulseAcademy practice exam — batch 2 of 4 • everything loads from this one file", "themes": [{"name": "Technique Identity & Family", "chips": ["T1566.001 Spearphishing Attachment", "Parent T1566 Phishing", "T1566.002 Spearphishing Link", "T1566.003 Spearphishing via Service", "T1566.004 Spearphishing Voice", "Initial Access TA0001", "ATT&CK Enterprise v2.2"]}, {"name": "Adversary Behaviour & Lure Craft", "chips": ["Plausible pretext", "Enable-content prompt", "ZIP password in email body", "Extension & icon manipulation", "Exploit or direct execution", "Archive types ZIP / RAR / ISO / CHM / HWP / LNK"]}, {"name": "Lifecycle Position & Next Steps", "chips": ["First foothold", "User Execution T1204", "Exploitation for Client Execution T1203", "PowerShell T1059.001", "Ingress Tool Transfer T1105", "Attachment vs link vs service trade-offs"]}, {"name": "Platforms & Execution Context", "chips": ["Linux", "Windows", "macOS", "User permission required", "One chosen target at a time"]}, {"name": "Data Sources & Telemetry", "chips": ["Email gateway logs", "File creation on disk", "Process execution (Office spawning shells)", "Outbound network flow", "User mail directories", "Mail.app logs (macOS)"]}, {"name": "Detection Logic & Analytics", "chips": ["DET0236 Detection Strategy", "AN0655 Windows correlation", "AN0656 Linux correlation", "AN0657 macOS correlation", "Detonation / sandboxing", "Mark-of-the-Web", "False-positive tuning"]}, {"name": "Mitigations & Controls", "chips": ["M1049 Antivirus/Antimalware", "M1047 Audit", "M1031 Network Intrusion Prevention", "M1021 Restrict Web-Based Content", "M1054 Software Configuration", "M1018 User Account Management", "M1017 User Training"]}, {"name": "Threat Actor Usage & Real-World Work", "chips": ["APT28 G0007", "APT29 G0016", "APT37 G0067", "APT-C-36 G0099", "Cobalt Group G0080", "Kimsuky G0094", "Emotet S0367", "SOC triage", "IR evidence", "CTI reporting", "Awareness training", "Red-team emulation"]}], "introExpl": "\n<h3>What you will learn<\/h3>\n<p>This exam is about one MITRE ATT&amp;CK object: <b>T1566.001 &mdash; Phishing: Spearphishing Attachment<\/b>.<\/p>\n<p><b>What kind of object is this?<\/b> T1566.001 is a <b>sub-technique<\/b>. A sub-technique is one specific way to do a bigger thing. The bigger thing here is the technique <b>T1566 &mdash; Phishing<\/b>. Phishing has four sub-techniques: a malicious file attached to an email (T1566.001), a bad link inside an email (T1566.002), phishing through a trusted service (T1566.003), and phishing by phone call (T1566.004). This exam is only about the <b>attachment<\/b> form. In the ATT&amp;CK matrix it sits in the tactic <b>Initial Access (TA0001)<\/b> &mdash; the first step of an attack.<\/p>\n<p><b>What does the attacker do?<\/b> Imagine you get an email that looks normal. It says: &ldquo;Your invoice is attached.&rdquo; A file is attached: a Word document, a PDF, an archive like ZIP or RAR, or an executable. The email gives you a believable reason to open the file. Sometimes it even tells you how to unlock it &mdash; for example, a ZIP password written in the email. That trick helps the attacker slip past email scanners, because a scanner cannot open a password-protected archive. When you open the file, hidden code runs. Sometimes the file uses a bug in the program (an exploit). Sometimes it only asks you to click &ldquo;Enable content&rdquo;. Attackers also fake file names and icons, so a program looks like a simple document.<\/p>\n<p><b>Where is this used at work?<\/b> You will meet T1566.001 in many roles. A <b>SOC analyst<\/b> triages alerts from the mail gateway and the endpoint. An <b>incident responder<\/b> collects the attachment and the evidence on the machine. A <b>detection engineer<\/b> builds analytics like ATT&amp;CK&rsquo;s <b>DET0236<\/b>: it links email delivery, file creation, and abnormal process execution &mdash; for example Word spawning PowerShell or CMD. A <b>threat-intel analyst<\/b> tracks the many groups that use it: APT28, APT29, APT37, APT-C-36, Cobalt Group, Kimsuky, and malware like Emotet. An <b>awareness trainer<\/b> teaches staff to report invoice and shipping lures. A <b>red teamer<\/b> imitates this attack to test the mail defences. A <b>GRC or control owner<\/b> maps the mitigations &mdash; M1049, M1021, M1054, M1017 and others &mdash; to this risk.<\/p>\n<p><b>Why does it matter?<\/b> The spearphishing attachment is one of the most common first steps of a real intrusion. Ransomware gangs, spies and e-crime groups all start here. If you can stop it, you stop the whole attack before it starts.<\/p>\n", "introThemes": "<div class=\"kwgroup\"><h5>Technique Identity & Family<\/h5><div class=\"themechips\"><span>T1566.001 Spearphishing Attachment<\/span><span>Parent T1566 Phishing<\/span><span>T1566.002 Spearphishing Link<\/span><span>T1566.003 Spearphishing via Service<\/span><span>T1566.004 Spearphishing Voice<\/span><span>Initial Access TA0001<\/span><span>ATT&CK Enterprise v2.2<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Adversary Behaviour & Lure Craft<\/h5><div class=\"themechips\"><span>Plausible pretext<\/span><span>Enable-content prompt<\/span><span>ZIP password in email body<\/span><span>Extension & icon manipulation<\/span><span>Exploit or direct execution<\/span><span>Archive types ZIP / RAR / ISO / CHM / HWP / LNK<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Lifecycle Position & Next Steps<\/h5><div class=\"themechips\"><span>First foothold<\/span><span>User Execution T1204<\/span><span>Exploitation for Client Execution T1203<\/span><span>PowerShell T1059.001<\/span><span>Ingress Tool Transfer T1105<\/span><span>Attachment vs link vs service trade-offs<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Platforms & Execution Context<\/h5><div class=\"themechips\"><span>Linux<\/span><span>Windows<\/span><span>macOS<\/span><span>User permission required<\/span><span>One chosen target at a time<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Data Sources & Telemetry<\/h5><div class=\"themechips\"><span>Email gateway logs<\/span><span>File creation on disk<\/span><span>Process execution (Office spawning shells)<\/span><span>Outbound network flow<\/span><span>User mail directories<\/span><span>Mail.app logs (macOS)<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Detection Logic & Analytics<\/h5><div class=\"themechips\"><span>DET0236 Detection Strategy<\/span><span>AN0655 Windows correlation<\/span><span>AN0656 Linux correlation<\/span><span>AN0657 macOS correlation<\/span><span>Detonation / sandboxing<\/span><span>Mark-of-the-Web<\/span><span>False-positive tuning<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Mitigations & Controls<\/h5><div class=\"themechips\"><span>M1049 Antivirus/Antimalware<\/span><span>M1047 Audit<\/span><span>M1031 Network Intrusion Prevention<\/span><span>M1021 Restrict Web-Based Content<\/span><span>M1054 Software Configuration<\/span><span>M1018 User Account Management<\/span><span>M1017 User Training<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Threat Actor Usage & Real-World Work<\/h5><div class=\"themechips\"><span>APT28 G0007<\/span><span>APT29 G0016<\/span><span>APT37 G0067<\/span><span>APT-C-36 G0099<\/span><span>Cobalt Group G0080<\/span><span>Kimsuky G0094<\/span><span>Emotet S0367<\/span><span>SOC triage<\/span><span>IR evidence<\/span><span>CTI reporting<\/span><span>Awareness training<\/span><span>Red-team emulation<\/span><\/div><\/div>", "introRules": "\n<p><b>Goal:<\/b> master the ATT&amp;CK sub-technique <b>T1566.001 Spearphishing Attachment<\/b> at <b>MEDIUM<\/b> level. MEDIUM means: every exercise connects <b>two ideas<\/b> (for example: recognise the technique, then pick the control or telemetry that fits it). The path is not handed to you &mdash; you decide what to look at first.<\/p>\n<p><b>Passing score:<\/b> <b>70%<\/b>. Every exercise is worth <b>10 points<\/b>, so <b>120 points<\/b> are possible in total.<\/p>\n<p><b>Exercise types you will see:<\/b> multiple choice, drag and drop, a log viewer with a filter (like Kibana or Splunk), a two-step SOC triage scenario, matching, ordering-free word blanks, and <b>one terminal task<\/b> where you must choose the right options yourself.<\/p>\n<p><b>Timer:<\/b> <b>30 minutes<\/b> for the whole exam. You can <b>pause<\/b> &mdash; the exercise is hidden while paused. If time runs out, unanswered exercises are simply not scored.<\/p>\n<p><b>Hints:<\/b> the Hint button narrows the direction and costs <b>&minus;10%<\/b> of that exercise (one point).<\/p>\n<p><b>Skip:<\/b> every exercise has a <b>Skip<\/b> button. Before you finish you may return to skipped exercises and answer them while the timer runs. Skipped-and-never-answered exercises are <b>excluded from the score<\/b>.<\/p>\n<p><b>Retake:<\/b> if you fail, retake the exam &mdash; questions and options are reshuffled.<\/p>\n", "exercises": [{"id": "M01", "type": "qcm", "theme": 4, "points": 10, "typeLabel": "Multiple choice", "title": "Pair the alert with the right technique and data source", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; EDR alert, ticket #4471<\/div><pre class=\"log\" data-hl=\"1\">10:04:02  fin-ws-22  MAIL_RECV   Invoice_8841.docm opened by k.reddy\n10:04:31  fin-ws-22  PROC_START  winword.exe (PID 4412) -&gt; powershell.exe\n                     cmd: -nop -w hidden -enc SQBFAF...<\/pre><\/div>", "scenarioSummary": "One EDR alert: Word spawned a hidden PowerShell", "question": "Which pairing of technique and data source explains this alert?", "data": {"options": ["T1566.001 delivery, caught by process-creation telemetry from the endpoint", "T1110 brute force, caught by failed-login counters on the domain controller", "T1190 exploitation, caught by firewall deny logs at the edge", "T1566.001 delivery, caught by an employee-satisfaction survey result"], "answer": 0}, "hint": "First name what happened on the host, then ask which log source records a program starting.", "explain": "<p>Two steps: <b>1)<\/b> The alert shows the classic T1566.001 result &mdash; the user opened the attachment and the macro made <b>Word spawn PowerShell<\/b>. <b>2)<\/b> The data source that records a process starting is <b>process creation / application log telemetry on the endpoint<\/b> &mdash; one of the sources behind ATT&amp;CK&rsquo;s analytic AN0655 for this technique. Brute force, edge firewalls and surveys describe different techniques or nothing at all.<\/p>", "study": "ATT&CK Data Sources for T1566.001, and analytic AN0655 (email delivery + file creation + abnormal process execution).", "persp": {"atk": "Attacker view: spawning a script host from Word is the fastest road from &ldquo;document&rdquo; to &ldquo;shell&rdquo;.", "def": "Defender view: the Word-spawns-shell parent/child pattern is one of the highest-value low-noise detections you own."}}, {"id": "M02", "type": "dragdrop", "theme": 2, "points": 10, "typeLabel": "Drag & drop", "title": "Give each technique its role in the spearphishing chain", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; What happened on fin-ws-22, in plain order<\/div><pre class=\"log\" data-hl=\"1\"> ( a )  The email carried the file in.\n ( b )  Something had to make the user run it.\n ( c )  Code had to actually execute.\n ( d )  Extra tools had to be pulled from outside.<\/pre><\/div>", "scenarioSummary": "Four chain roles waiting for their technique IDs", "question": "Drag each technique chip onto the role it plays in the chain.", "data": {"zones": [{"name": "Delivers the payload to the user", "items": [0]}, {"name": "Makes the user run the payload", "items": [1]}, {"name": "Runs the attacker's code", "items": [2]}, {"name": "Brings extra tools from outside", "items": [3]}], "items": [{"t": "T1566.001 Spearphishing Attachment"}, {"t": "T1204 User Execution"}, {"t": "T1059.001 PowerShell"}, {"t": "T1105 Ingress Tool Transfer"}]}, "hint": "Follow the timeline on the host: arrive, convince, execute, download.", "explain": "<p><b>T1566.001<\/b> moves the file into the estate. <b>T1204 User Execution<\/b> is the human click that ATT&amp;CK says T1566.001 &ldquo;usually relies upon&rdquo;. <b>T1059.001<\/b> is the interpreter that actually runs the code. <b>T1105<\/b> pulls second-stage tools from the attacker&rsquo;s server. A strong SOC report names all four, in this order.<\/p>", "study": "How T1566.001 hands over to T1204, T1059.001 and T1105 in a real intrusion."}, {"id": "M03", "type": "logview", "theme": 4, "points": 10, "typeLabel": "Log analysis", "title": "Click the line that shows the payload calling home", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; EDR timeline, fin-ws-22 (excerpt)<\/div><pre class=\"log\" data-hl=\"1\">10:04:02  FILE_CREATE  C:\\Users\\k.reddy\\Downloads\\Invoice_8841.docm   motw=1\n10:04:02  MAIL_RECV    from=billing@voyage-support[.]example  subj=\"Invoice #8841 overdue\"\n10:04:31  PROC_START   winword.exe -&gt; powershell.exe  cmd=\"-nop -w hidden -enc SQBFAF...\"\n10:05:10  FILE_CREATE  C:\\Users\\k.reddy\\AppData\\Roaming\\svchost32.exe\n10:05:12  PROC_START   outlook.exe -&gt; winword.exe  doc=\"Benefits_Policy.pdf.docx\"   (host hr-ws-07)\n10:06:44  NET_FLOW     45[.]61[.]184[.]9:443  dur=1s  proc=svchost32.exe  first_seen=yes\n10:07:03  PROC_START   winword.exe -&gt; wscript.exe  script=\"...\\\\AppData\\\\Roaming\\\\s.vbs\"\n10:12:31  NET_FLOW     52[.]96[.]11[.]4:443  dur=780s  proc=msoidc  (Microsoft 365, known)<\/pre><\/div>", "scenarioSummary": "Eight EDR lines &mdash; find the first outbound call of the dropped file", "question": "Click the log line that shows the dropped payload contacting its operator.", "data": {"logs": ["10:04:02  FILE_CREATE  C:\\Users\\k.reddy\\Downloads\\Invoice_8841.docm   motw=1", "10:04:02  MAIL_RECV    from=billing@voyage-support[.]example  subj=\"Invoice #8841 overdue\"", "10:04:31  PROC_START   winword.exe -> powershell.exe  cmd=\"-nop -w hidden -enc SQBFAF...\"", "10:05:10  FILE_CREATE  C:\\Users\\k.reddy\\AppData\\Roaming\\svchost32.exe", "10:05:12  PROC_START   outlook.exe -> winword.exe  doc=\"Benefits_Policy.pdf.docx\"   (host hr-ws-07)", "10:06:44  NET_FLOW     45[.]61[.]184[.]9:443  dur=1s  proc=svchost32.exe  first_seen=yes", "10:07:03  PROC_START   winword.exe -> wscript.exe  script=\"...\\AppData\\Roaming\\s.vbs\"", "10:12:31  NET_FLOW     52[.]96[.]11[.]4:443  dur=780s  proc=msoidc  (Microsoft 365, known)"], "targets": [5], "filterHint": "Try the filter: svchost32 or NET_FLOW"}, "hint": "Ask: what did the fake svchost32.exe do one minute after it was dropped?", "explain": "<p>Two ideas are chained here. First, the file <b>Invoice_8841.docm<\/b> (with Mark-of-the-Web) led Word to spawn PowerShell, which dropped <b>svchost32.exe<\/b> into AppData. Second, at <b>10:06:44<\/b> that exact process opened a short connection to a <b>new address<\/b> &mdash; the first call to the operator, i.e. command-and-control. The long Microsoft 365 flow is normal business traffic; the hr-ws-07 line is another story on another host.<\/p>", "study": "Correlating file creation, process execution and network flow &mdash; the behaviour chain of DET0236/AN0655."}, {"id": "M04", "type": "qcm", "theme": 0, "points": 10, "typeLabel": "Multiple choice", "title": "Wave two has no attachment — which sub-technique is it?", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Gateway note, second wave<\/div><pre class=\"log\" data-hl=\"1\">Same group as ticket #4471, new wave:\nEmail holds NO attachment.\nBody:  \"Open your secure message:\n        hxxps://share-file-portal[.]example/u/8841\"\nOne short link. The malware sits behind it.<\/pre><\/div>", "scenarioSummary": "Second wave: a link instead of a file", "question": "Which sub-technique describes wave two?", "data": {"options": ["T1566.002 Spearphishing Link", "T1566.001 Spearphishing Attachment", "T1566.003 Spearphishing via Service", "T1566.004 Spearphishing Voice"], "answer": 0}, "hint": "No file travelled with the email &mdash; the email only points somewhere.", "explain": "<p>With <b>no attachment<\/b>, T1566.001 cannot be the label. A bare URL inside the email that hosts the malware is <b>T1566.002 Spearphishing Link<\/b>. T1566.003 needs a trusted third-party service to carry the message, and T1566.004 is a phone call. Keeping .001 and .002 apart matters: gateways detonate attachments, but links are clicked later, from inside the network.<\/p>", "study": "The exact border between T1566.001 (file) and T1566.002 (link)."}, {"id": "M05", "type": "terminal", "theme": 4, "points": 10, "typeLabel": "Terminal task", "title": "Fingerprint the attachment for the CTI report", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Your analysis box (Linux)<\/div><p>The attachment copy lives at <span class=\"mono\">/cases/8841/Invoice_8841.docm<\/span>. The CTI report needs a <b>cryptographic fingerprint of this exact file<\/b>. Your team standard says: <b>never MD5<\/b>, always the strongest common hash. The tool you need is named after its algorithm &mdash; you must type it with the correct options and the correct path.<\/p><\/div>", "scenarioSummary": "Compute the SHA-256 of /cases/8841/Invoice_8841.docm", "question": "Type the command that produces the required fingerprint.", "data": {"prompt": "analyst@ir-lab:/cases/8841$", "motd": ["IR lab shell — case 8841", ""], "accepted": ["sha256sum /cases/8841/Invoice_8841.docm"], "matchMode": "exact", "caseSensitive": true, "maxAttempts": 3, "canonical": "sha256sum /cases/8841/Invoice_8841.docm", "canonicalParts": [{"p": "sha256sum", "m": "the SHA-256 hashing tool — the strongest common hash, per the team standard"}, {"p": "/cases/8841/Invoice_8841.docm", "m": "the evidence file, referenced by its exact path"}], "output": "7f3a91c04dbe5c2f6a1d8e77b09c4412a6f8e5d3c2b1a0987e6d5c4b3a291807  /cases/8841/Invoice_8841.docm", "badHint": "md5", "badMsg": "MD5 is broken for this purpose and your team standard forbids it. Use the 256-bit hash tool.", "errText": "Not the right tool or path. The tool name is its algorithm: sha + 256 + sum."}, "hint": "The tool&rsquo;s name is its algorithm: sha, 256, sum. Then give it the exact evidence path.", "explain": "<p><span class=\"mono\">sha256sum /cases/8841/Invoice_8841.docm<\/span> prints the file&rsquo;s SHA-256 fingerprint. Analysts share this hash so every team can confirm they hold the <b>same file<\/b>, and so it can be searched in threat-intel platforms. MD5 collides too easily, so the standard forbids it. Note the path is case-sensitive on Linux &mdash; <span class=\"mono\">invoice_8841<\/span> would be a different file name.<\/p>", "study": "sha256sum usage on Linux, and why hashes anchor CTI reports and sandbox lookups."}, {"id": "M06", "type": "dragdrop", "theme": 6, "points": 10, "typeLabel": "Drag & drop", "title": "Map every ATT&CK mitigation to its plain job", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; The seven mitigations listed for T1566.001<\/div><pre class=\"log\" data-hl=\"1\">M1049  Antivirus/Antimalware        M1021  Restrict Web-Based Content\nM1047  Audit                        M1054  Software Configuration\nM1031  Network Intrusion Prevention M1018  User Account Management\nM1017  User Training<\/pre><\/div>", "scenarioSummary": "Six mitigation jobs need their control IDs", "question": "Drag each job description onto the mitigation that does it.", "data": {"zones": [{"name": "M1049 Antivirus/Antimalware", "items": [0]}, {"name": "M1047 Audit", "items": [1]}, {"name": "M1031 Network Intrusion Prevention", "items": [2]}, {"name": "M1021 Restrict Web-Based Content", "items": [3]}, {"name": "M1054 Software Configuration", "items": [4]}, {"name": "M1017 User Training", "items": [5]}], "items": [{"t": "Scans and detonates attachments before or on open"}, {"t": "Reviews controls and finds weak spots before attackers do"}, {"t": "Blocks known-bad attachment traffic on the network path"}, {"t": "Strips or blocks risky attachment types at the mail gateway"}, {"t": "Filters mail by sender-domain validity and message integrity (SPF/DKIM)"}, {"t": "Teaches staff to recognise and report invoice lures"}]}, "hint": "Endpoint scanner, review process, network guard, mail filter, sender checks, people.", "explain": "<p>All six are on the T1566.001 page. <b>M1049<\/b> scans and detonates. <b>M1047<\/b> is the audit that finds gaps. <b>M1031<\/b> inspects traffic on the wire. <b>M1021<\/b> restricts what email and web content may enter. <b>M1054<\/b> is the sender-identity check: SPF validates the sending domain and DKIM validates the message itself, so a spoofed billing domain is filtered before the lure ever arrives. <b>M1017<\/b> trains the human. Together they cover delivery, execution and repeat attempts.<\/p>", "study": "The full mitigation table for T1566.001, including M1047 and M1031."}, {"id": "M07", "type": "steps", "theme": 7, "points": 10, "typeLabel": "Scenario steps", "title": "Triage ticket #4471 like a SOC analyst", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; SOC queue, ticket #4471<\/div><pre class=\"log\" data-hl=\"1\">SEV-2  fin-pc-04  user b.okafor\n10:21  winword.exe -&gt; cmd.exe  doc=\"FedEx_Notification_9123.docm\"\n       motw=1  sender external  verdict: no signature match<\/pre><\/div>", "scenarioSummary": "SEV-2 alert: Word spawned cmd after a .docm open", "question": "Work the ticket: what happened, and what do you do first?", "data": {"steps": [{"scenario": "The user says they expected a parcel and opened the delivery notice straight away.", "question": "Step 1: What most likely happened here?", "options": ["The user opened a spearphishing attachment and its macro ran", "An attacker brute-forced the workstation password", "A printer driver crashed and restarted the session", "A scheduled update installed itself silently"], "answer": 0, "explain": "MOTW plus an external sender plus a Word-spawned shell is the T1566.001 signature: delivery, open, execute."}, {"scenario": "You have one click to choose the first response. The host is still on the network.", "question": "Step 2: Pick the best first response.", "options": ["Isolate the host from the network and preserve the dropped files", "Reboot the PC and carry on with the shift", "Reply to the sender to ask if the file is safe", "Delete the mailbox message immediately"], "answer": 0, "explain": "Containment first, evidence second, never alert the sender. Rebooting and deleting both destroy what you need next."}]}, "hint": "Delivery needed a person; the response must both contain and keep evidence.", "explain": "<p>Two connected ideas: <b>recognition<\/b> (MOTW + external sender + Word spawning a shell = T1566.001 followed by execution) and <b>response<\/b> (isolate the host so nothing spreads, but keep the files &mdash; the dropped payload is your next detection lead). Deleting the email or rebooting destroys evidence; contacting the sender burns your advantage.<\/p>", "study": "SOC first-response steps for a macro alert: isolate, preserve, then collect.", "persp": {"atk": "Attacker view: every minute the host stays online is a minute to move outward.", "def": "Defender view: isolate-and-preserve keeps both the incident small and the case strong."}}, {"id": "M08", "type": "qcm", "theme": 3, "points": 10, "typeLabel": "Multiple choice", "title": "What must happen between delivery and infection?", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; ATT&amp;CK fact line, again<\/div><pre class=\"log\" data-hl=\"1\">ID:           T1566.001\nTactic:       Initial Access\nPlatforms:    Linux, Windows, macOS\nPermissions:  User\n\"..adversaries attach a file .. and usually rely\n upon User Execution to gain execution.\"<\/pre><\/div>", "scenarioSummary": "The ATT&CK fact line plus one quoted sentence", "question": "What must happen between delivery and infection for T1566.001 to succeed?", "data": {"options": ["The user must open the attachment and often enable its content", "The attacker must exploit the company VPN gateway first", "A worm must self-replicate across the internal network", "A server must run a vulnerable public-facing service"], "answer": 0}, "hint": "ATT&CK lists &lsquo;User&rsquo; as the required permission &mdash; someone has to act.", "explain": "<p>The page says the attack <b>&ldquo;usually relies upon User Execution to gain execution&rdquo;<\/b>, and the email text &ldquo;usually tries to give a plausible reason why the file should be opened&rdquo;, sometimes even explaining how to bypass protections. VPN exploitation (T1133/T1190), worms (T1010-family behaviour) and server exploits are different initial-access routes without a human open.<\/p>", "study": "The Permissions Required field and the User Execution dependency of T1566.001."}, {"id": "M09", "type": "match", "theme": 5, "points": 10, "typeLabel": "Matching pairs", "title": "Match DET0236 and its three analytics to what they watch", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; ATT&amp;CK detection table for T1566.001<\/div><pre class=\"log\" data-hl=\"1\">DET0236  Detection Strategy for Spearphishing\n         Attachment across OS Platforms\n  AN0655  (Windows)\n  AN0656  (Linux)\n  AN0657  (macOS)<\/pre><\/div>", "scenarioSummary": "One strategy, three platform analytics", "question": "Match each analytic to the behaviour it watches.", "data": {"pairs": [["AN0655 &mdash; Windows", "Correlates email delivery, file creation, and Office spawning PowerShell or CMD"], ["AN0656 &mdash; Linux", "Links mail-directory file drops to unexpected binaries and odd outbound traffic"], ["AN0657 &mdash; macOS", "Correlates Mail.app logs with file creation and Mail or Preview spawning Terminal"], ["DET0236 &mdash; the strategy", "Bundles the platform analytics into one attachment-detection plan"]]}, "hint": "One analytic per operating system &mdash; each mentions that system&rsquo;s own apps and paths.", "explain": "<p><b>DET0236<\/b> is the ATT&amp;CK Detection Strategy for this sub-technique. Its behaviour chain is: <b>inbound email &rarr; attachment stored on disk &rarr; process execution &rarr; outbound network activity<\/b>. On <b>Windows<\/b> (AN0655) the tell is Office spawning PowerShell or CMD. On <b>Linux<\/b> (AN0656) it is unexpected binaries from mail directories. On <b>macOS<\/b> (AN0657) it is Mail.app or Preview.app spawning Terminal or script tools. Same idea, three operating systems.<\/p>", "study": "DET0236 with analytics AN0655/AN0656/AN0657 on the T1566.001 page."}, {"id": "M10", "type": "fill", "theme": 7, "points": 10, "typeLabel": "Fill the blanks", "title": "Complete the CTI report sentence with real page facts", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Draft CTI report, two words missing<\/div><pre class=\"log\" data-hl=\"1\">CTI REPORT (draft) — case 8841\n\n\"APT41 (G0096) has used spearphishing emails with\nattachments such as compiled HTML (.chm) files;\nafter the open, the embedded code contacts the\n[ 1 ] server and may download a second [ 2 ].\"<\/pre><\/div>", "scenarioSummary": "CTI sentence about APT41 with two blanks", "question": "Place the two missing words into the blanks.", "data": {"parts": ["APT41 (G0096) has used spearphishing emails with attachments such as compiled HTML (.chm) files; after the open, the embedded code contacts the&nbsp;", "&nbsp;server and may download a second&nbsp;", "&nbsp;."], "answers": ["command-and-control", "stage"], "bank": ["command-and-control", "stage", "backup", "printer", "calendar", "chassis"]}, "hint": "One blank is where the operator watches the victim. The other is the next tool that arrives.", "explain": "<p>After a T1566.001 open, the payload usually <b>calls its command-and-control (C2) server<\/b> and pulls a <b>second stage<\/b> &mdash; the next tool of the intrusion. This is exactly why DET0236&rsquo;s chain ends with <b>outbound network activity<\/b>: the call home is your best network-visible moment. The page records APT41 using .chm attachments this way.<\/p>", "study": "The terms C2 server and second stage, and APT41's recorded use of .chm attachments."}, {"id": "M11", "type": "match", "theme": 7, "points": 10, "typeLabel": "Matching pairs", "title": "Match each group to its recorded attachment tradecraft", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Procedure examples from the T1566.001 page<\/div><pre class=\"log\" data-hl=\"1\">APT28    (G0007)   ?\nAPT29    (G0016)   ?\nAPT32    (G0050)   ?\nAPT37    (G0067)   ?\nAPT-C-36 (G0099)   ?<\/pre><\/div>", "scenarioSummary": "Five groups, five attachment habits", "question": "Match each group to the attachment behaviour ATT&CK records for it.", "data": {"pairs": [["APT28 (G0007)", "Malicious Microsoft Office and RAR attachments"], ["APT29 (G0016)", "Spearphishing attachments that deliver files with exploits"], ["APT32 (G0050)", "An executable disguised as a document or spreadsheet"], ["APT37 (G0067)", "Malicious HWP (Hangul Word Processor) attachments"], ["APT-C-36 (G0099)", "Password-protected RAR attachments to avoid the gateway"]]}, "hint": "HWP is the Korean word-processor &mdash; that alone settles one pair. The others differ by exploit delivery, disguise vs encryption.", "explain": "<p>These are real procedure examples from the page: <b>APT28<\/b> used Office and RAR files; <b>APT29<\/b> rode attachments that deliver <b>files with exploits<\/b> &mdash; the payload needs a software bug, not just a macro; <b>APT32<\/b> sent an <b>executable dressed as a document<\/b> &mdash; the icon-and-extension trick; <b>APT37<\/b> rode Korean <b>HWP<\/b> documents because that is what their targets open; <b>APT-C-36<\/b> used <b>password-protected RARs<\/b> so the gateway could not inspect the content. Tradecraft follows the target&rsquo;s normal software.<\/p>", "study": "Procedure examples on the T1566.001 page: APT28, APT29, APT32, APT37, APT-C-36."}, {"id": "M12", "type": "qcm", "theme": 1, "points": 10, "typeLabel": "Multiple choice", "title": "Red team: plan the attachment that survives the gateway", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; The defence you must face (same company as ticket #4471)<\/div><pre class=\"log\" data-hl=\"1\">Defences now in place:\n - Macros blocked in internet files (Office policy)\n - Every attachment is detonated in a sandbox\n - Direct .exe/.scr attachments stripped (M1021)<\/pre><\/div>", "scenarioSummary": "Your emulation target has hardened mail defences", "question": "Which attachment plan keeps you on T1566.001 with the smallest early signal?", "data": {"options": ["A password-protected ZIP whose password sits in the email body", "A bare .exe file renamed so that it ends with .txt", "A macro-free PDF that contains no code at all", "A short link instead of any attached file"], "answer": 0}, "hint": "You must stay an attachment &mdash; and the sandbox must be unable to open what arrives.", "explain": "<p>The ATT&amp;CK description records the exact trick: the email &ldquo;may also contain instructions on how to decrypt an attachment, such as a zip file password, <b>in order to evade email boundary defenses<\/b>&rdquo;. A password-protected ZIP passes the gateway unopened; the password in the body re-arms it at the human step. Option D abandons T1566.001 (that is .002), option B is stripped by type and option C carries no payload at all.<\/p>", "study": "The zip-password evasion sentence on the T1566.001 page, and how gateways fight back.", "persp": {"atk": "Red view: the archive password splits the attack into two halves the defences cannot see at once.", "def": "Blue view: detonate archives with a password extracted from the body, or block encrypted archives by policy."}}]};
</script>
<script>

(function(){
"use strict";
var E = window.EXAM;                       // {meta, themes, introHtml, exercises}
var EXS = E.exercises;
var $ = function(s, el){ return (el||document).querySelector(s); };
var app;

/* ---------- utils ---------- */
function shuffle(arr){ var a=arr.slice(),i,j,t; for(i=a.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function el(tag, cls, html){ var d=document.createElement(tag); if(cls) d.className=cls; if(html!=null) d.innerHTML=html; return d; }
var RT = {};   // per-exercise runtime widget state, keyed by exercise id
function hlPass(root){ [].forEach.call(root.querySelectorAll("pre.log[data-hl]"), function(p){ p.innerHTML=hlLog(p.textContent); }); }
function ncmd(s){ return String(s==null?"":s).replace(/[\u2018\u2019\u201c\u201d]/g,"'").replace(/"/g,"").replace(/\s+/g," ").trim().replace(/[.]+$/,""); }
function normPair(input, accepted, mode, caseSensitive){
  function base(x){ x=ncmd(x); if(!caseSensitive) x=x.toLowerCase(); return x; }
  function fmt(x){ x=base(x); if(mode==="tokens"){ var t=x.split(" "); return t.sort().join(" "); } return x; }
  var a=fmt(input);
  for(var i=0;i<accepted.length;i++){ if(fmt(accepted[i])===a) return true; }
  return false;
}
var KW = ["PASS","BLOCK","DELIVER","PROC_START","FILE_CREATE","NET_FLOW","NET","MAIL_RECV","DROP","QUAR","OPEN","EXEC"];
function hlLog(line){
  var s = esc(line);
  s = s.replace(/\b(PASS|DELIVER|OK|CLEAN)\b/g,'<span class="ok">$1</span>');
  s = s.replace(/\b(BLOCK|QUAR|DENY|DROP)\b/g,'<span class="no">$1</span>');
  KW.forEach(function(k){ s = s.replace(new RegExp("\\b"+k+"\\b","g"), '<span class="kw">'+k+'</span>'); });
  s = s.replace(/\b\d{1,3}[\[].][]\d{1,3}[\].][\d[\].]{3,}\b/g, function(m){ return '<span class="ip">'+m+'</span>'; });
  s = s.replace(/\b[\w.-]+\.(docm|docx|exe|iso|img|rar|zip|pdf|lnk|chm|hta|scr|xls|xlsx|xlsm|rtf|hwp|vbs|js|dotx|eml)\b/gi, function(m){ return '<span class="file">'+m+'</span>'; });
  return s;
}

/* ---------- state ---------- */
var S = {
  order: [], pos: 0, phase: "intro",
  ans: {},          // id -> {status, earned, your, correct, res}
  skipped: [],      // ids never answered
  timerLeft: E.timerSec, tInt: null, paused: false,
  reported: false, userName: "", hintUsed: {}, exPts: {}
};
EXS.forEach(function(ex){ S.exPts[ex.id] = ex.points || 10; });

function badgeFor(){ return E.meta.difficulty; }
function badgeText(){ return E.difficultyLabel || E.meta.difficultyLabel; }

/* ---------- scoring ---------- */
function answeredIds(){ return EXS.filter(function(ex){ var a=S.ans[ex.id]; return a && (a.status==="correct"||a.status==="incorrect"||a.status==="partial"); }); }
function earnedPts(){ var n=0; answeredIds().forEach(function(ex){ n+=S.ans[ex.id].earned; }); return n; }
function maxPts(){ var n=0; answeredIds().forEach(function(ex){ n+=S.exPts[ex.id]; }); return n; }
function pct(){ var m=maxPts(); return m>0? Math.round(earnedPts()/m*100):0; }

/* ---------- header ---------- */
function buildHeader(){
  var h = el("div","hdr");
  h.innerHTML =
    '<span id="h-count" class="muted small"></span>' +
    '<span class="badge '+badgeFor()+'">['+esc(badgeText())+']</span>' +
    '<span id="h-theme" class="muted small" style="display:none"></span>' +
    '<span class="grow"></span>' +
    '<span class="timer" id="h-timer" role="timer" aria-label="Time remaining">--:--</span>' +
    '<button class="btn" id="h-pause" aria-label="Pause timer">&#9208; Pause</button>' +
    '<span class="score" id="h-score">0 pts &middot; 0%</span>' +
    '<button class="btn" id="h-hint" aria-label="Show hint for minus 10 percent">&#9432; Hint &minus;10%</button>' +
    '<button class="btn" id="h-skip" aria-label="Skip this exercise">&#9193; Skip</button>' +
    '<button class="btn" id="h-rev" aria-label="Review skipped exercises" style="display:none">&#8635; Skipped <span id="h-revn">0</span></button>';
  $("#h-pause",h).addEventListener("click", pauseExam);
  $("#h-hint",h).addEventListener("click", useHint);
  $("#h-skip",h).addEventListener("click", skipCurrent);
  $("#h-rev",h).addEventListener("click", openReview);
  return h;
}
function updHeader(){
  var t=$("#h-timer"), m=Math.floor(S.timerLeft/60), s=S.timerLeft%60;
  if(t){ t.textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s; t.className="timer"+(S.timerLeft<300?" low":""); }
  var sc=$("#h-score"); if(sc){ var p=pct(); sc.textContent = earnedPts()+" pts \u00b7 "+p+"%"; sc.setAttribute("aria-label","Live score "+earnedPts()+" points, "+p+" percent"); }
  var rev=$("#h-rev"); if(rev){ rev.style.display = (S.skipped.length && S.phase!=="results")? "":"none"; var rn=$("#h-revn"); if(rn) rn.textContent=S.skipped.length; }
  var pa=$("#h-pause"); if(pa){ pa.disabled = (S.phase!=="exam"); }
  var hint=$("#h-hint"); if(hint){ var ex=EXS[S.order[S.pos]]; var dis = (S.phase!=="exam") || !ex || S.hintUsed[ex.id] || (S.ans[ex.id]&&S.ans[ex.id].status!=="skipped"); hint.disabled=dis; }
  var sk=$("#h-skip"); if(sk){ var cu=EXS[S.order[S.pos]]; var ca=cu? S.ans[cu.id]:null; sk.disabled = (S.phase!=="exam") || (ca && ca.status!=="skipped" && ca.status!=="skipped-never"); }
  var hc=$("#h-count"); if(hc){ hc.textContent = S.phase==="exam"? ("Exercise "+(S.pos+1)+" of "+EXS.length) : (S.phase==="review"? "Review skipped exercises" : ""); }
}

/* ---------- timer ---------- */
function tick(){
  if(S.paused) return;
  S.timerLeft--;
  if(S.timerLeft<=0){ S.timerLeft=0; stopTimer(); timeUp(); return; }
  updHeader();
}
function startTimer(){ stopTimer(); S.tInt=setInterval(tick,1000); }
function stopTimer(){ if(S.tInt){ clearInterval(S.tInt); S.tInt=null; } }
function pauseExam(){
  if(S.phase!=="exam" || S.paused) return;
  S.paused=true; stopTimer();
  var v=el("div","veil");
  v.innerHTML='<h2>&#9208; Exam paused</h2><p class="muted">The timer is stopped and the exercise is hidden,<br>so nobody can read ahead while paused.</p>';
  var b=el("button","btn primary","&#9654; Resume"); b.addEventListener("click",function(){ S.paused=false; v.remove(); startTimer(); b.focus(); });
  v.appendChild(b); document.body.appendChild(v);
}
function timeUp(){
  EXS.forEach(function(ex){
    var a=S.ans[ex.id];
    if(!a || a.status==="skipped"){ S.ans[ex.id]={status:"skipped-never", earned:0}; }
  });
  showResults(true);
}

/* ---------- hint ---------- */
function useHint(){
  if(S.phase!=="exam") return;
  var ex=EXS[S.order[S.pos]]; if(!ex || S.hintUsed[ex.id]) return;
  S.hintUsed[ex.id]=true;
  var box=$("#hint-slot");
  if(box){ box.style.display=""; box.innerHTML='<div class="hintbox"><b>HINT (&minus;10% of this exercise):</b> '+ex.hint+'</div>'; }
  updHeader();
}

/* ---------- intro ---------- */
function introView(){
  S.phase="intro";
  app.innerHTML="";
  app.appendChild(buildHeader());
  var c=el("div","card intro-expl");
  c.innerHTML =
    '<h1 class="bigtitle">'+esc(E.meta.title)+'</h1>' +
    '<p class="subtitle">'+esc(E.subtitle||"")+'</p>' +
    '<div class="meta-chips">' +
      '<span class="mchip"><b>'+E.exercises.length+'</b> exercises</span>' +
      '<span class="mchip">Timer <b>'+E.meta.estimatedMinutes+' min</b> (pausable)</span>' +
      '<span class="mchip">Pass mark <b>'+E.meta.passMark+'%</b></span>' +
      '<span class="mchip">Tier <b>'+E.meta.batch+' of 4</b></span>' +
      '<span class="mchip">Object type: <b>Sub-Technique</b></span>' +
      '<span class="mchip">ID: <b>T1566.001</b> &middot; Tactic: <b>Initial Access (TA0001)</b></span>' +
    '</div>' +
    '<div class="blk blk-scenario"><div class="blk-label">&#9432; About this ATT&amp;CK object</div>' + E.introExpl + '</div>' +
    '<div class="blk blk-answer"><div class="blk-label">&#127991; Keywords covered in this topic (all four tiers)</div>' + E.introThemes + '<p class="small muted" style="margin-bottom:0">The four tier files of this topic share these themes. Each tier exercises them at its own depth.</p></div>' +
    '<div class="blk blk-question"><div class="blk-label">&#9881; How this exam works</div>' + E.introRules + '</div>' +
    '<div class="row2"><button class="btn primary" id="start-btn" style="min-width:220px">&#9654; Start the exam</button></div>';
  $("#start-btn",c).addEventListener("click", startExam);
  app.appendChild(c);
  updHeader();
}

/* ---------- exam flow ---------- */
function startExam(){
  S.order = shuffle(EXS.map(function(e,i){ return i; }));
  S.pos=0; S.phase="exam"; S.ans={}; S.skipped=[]; S.reported=false;
  S.timerLeft = E.timerSec; S.paused=false; S.hintUsed={};
  for(var k in RT){ if(Object.prototype.hasOwnProperty.call(RT,k)) delete RT[k]; }
  examView();
}
function examView(){
  S.phase="exam";
  app.innerHTML="";
  app.appendChild(buildHeader());
  var main=el("div"); main.id="exam-main"; app.appendChild(main);
  renderCurrent();
  startTimer();
}
function renderCurrent(){
  var ex=EXS[S.order[S.pos]];
  var m=$("#exam-main"); m.innerHTML="";
  var prog=Math.round((S.pos)/EXS.length*100);
  m.appendChild(el("div","pbar",'<i style="width:'+prog+'%"></i>'));
  var wrap=el("div","card");
  wrap.appendChild(el("div",null,'<div class="meta-chips" style="margin-top:0"><span class="mchip">Exercise <b>'+(S.pos+1)+' of '+EXS.length+'</b></span><span class="mchip">Theme: <b>'+esc(E.themes[ex.theme].name)+'</b></span><span class="mchip">'+esc(ex.points)+' points</span></div>'));
  wrap.appendChild(el("h3",null,'<span class="muted small">'+esc(ex.typeLabel)+' &nbsp;&middot;&nbsp; </span>'+esc(ex.title)));

  var sc=el("div","blk blk-scenario");
  sc.innerHTML='<div class="blk-label">&#128220; SCENARIO <button type="button" class="collapse-btn" id="sc-toggle">Collapse</button></div>' +
               '<div class="sc-summary" id="sc-summary">'+esc(ex.scenarioSummary)+'</div>' +
               '<div class="sc-body" id="sc-body">'+ex.scenario+'</div>';
  wrap.appendChild(sc);
  var long = ex.scenario.length>700;
  if(long){
    var tog=$("#sc-toggle",sc), shown=true;
    tog.addEventListener("click",function(){
      shown=!shown;
      tog.textContent= shown? "Collapse":"Expand";
      $("#sc-body",sc).style.display = shown? "":"none";
      $("#sc-summary",sc).style.display = shown? "none":"";
    });
  } else { $("#sc-toggle",sc).style.display="none"; }

  wrap.appendChild(el("div","blk blk-question",'<div class="blk-label">&#10067; QUESTION</div><div class="q-text">'+esc(ex.question)+'</div>'));

  var an=el("div","blk blk-answer");
  an.innerHTML='<div class="blk-label">&#9997; YOUR ANSWER</div><div id="hint-slot" style="display:none"></div><div id="widget"></div><div id="ctl" class="row2"></div><div id="fb"></div>';
  wrap.appendChild(an);
  m.appendChild(wrap);

  hlPass(m);
  var widget = buildWidget(ex);
  $("#widget",an).appendChild(widget.el);
  var a=S.ans[ex.id];
  var isSkipped = a && (a.status==="skipped"||a.status==="skipped-never");
  var sub=el("button","btn primary", isSkipped? "&#9998; Answer this exercise" : "&#10004; Submit answer"); sub.id="sub-btn";
  if(isSkipped){
    $("#fb",an).innerHTML='<div class="fb partial"><h4>&#9888; SKIPPED &mdash; NOT ANSWERED</h4><p class="why">You skipped this exercise. It will not be scored unless you answer it now.</p></div>';
    sub.addEventListener("click", function(){ delete S.ans[ex.id]; delete RT[ex.id]; var i=S.skipped.indexOf(ex.id); if(i>=0) S.skipped.splice(i,1); renderCurrent(); });
  } else {
    sub.addEventListener("click", function(){ submitAnswer(ex, widget); });
    if(a && (a.status==="correct"||a.status==="partial"||a.status==="incorrect")){
      sub.disabled=true; widget.lock(a); showFeedback(ex,a);
    }
  }
  $("#ctl",an).appendChild(sub);
  updHeader();
  window.scrollTo(0,0);
}
function submitAnswer(ex, widget){
  var res = widget.grade();
  if(res && res.pending){
    var f0=$("#fb");
    if(f0) f0.innerHTML='<div class="fb partial"><h4>&#9888; NOT FINISHED</h4><p class="why">'+(res.pendingMsg||"Answer the exercise first, then press Submit.")+'</p></div>';
    return;
  }
  if(!res) return;
  var cost = Math.max(1, Math.round((ex.points||10)*0.1));   /* hint = minus 10% of this exercise */
  var hint = S.hintUsed[ex.id]? cost:0;
  var earned;
  if(res.ok) earned = Math.max(0,(ex.points||10)-hint);
  else if(res.ratio>0) earned = Math.max(0, Math.round((ex.points||10)*res.ratio)-hint);
  else earned = 0;
  var status = res.ok? "correct" : (res.ratio>0 && res.ratio<1? "partial":"incorrect");
  var a = S.ans[ex.id] = {status:status, earned:earned, your:res.your||"", correct:res.correct||"", res:res};
  var sub=$("#sub-btn"); if(sub) sub.disabled=true;
  widget.lock && widget.lock(a);
  showFeedback(ex,a);
  updHeader();
}
function showFeedback(ex, a){
  var fb=$("#fb"); if(!fb) return;
  var heads={
    correct:'<h4><span aria-hidden="true">&#10004;</span> <span class="fb-title">CORRECT</span></h4>',
    incorrect:'<h4><span aria-hidden="true">&#10008;</span> <span class="fb-title">INCORRECT</span></h4>',
    partial:'<h4><span aria-hidden="true">&#9680;</span> <span class="fb-title">PARTIAL &mdash; '+Math.round((a.res.ratio||0)*(ex.points||10))+' of '+(ex.points||10)+' points</span></h4>'
  };
  var h='<div class="fb '+a.status+'" role="status">'+heads[a.status];
  if(a.correct) h+='<p class="why"><b>Correct answer:</b> '+a.correct+'</p>';
  if(a.your) h+='<p class="why"><b>Your answer:</b> '+a.your+'</p>';
  h+='<p class="why">'+ex.explain+'</p>';
  if(a.status!=="correct" && ex.study) h+='<div class="study"><b>What to study:</b> '+ex.study+'</div>';
  if(ex.persp) h+='<div class="persp"><b>Attacker view:</b> '+ex.persp.atk+'<br><b>Defender view:</b> '+ex.persp.def+'</div>';
  h+='<p class="small muted" style="margin:8px 0 0">Points for this exercise: <b>'+a.earned+' / '+(ex.points||10)+'</b>'+(S.hintUsed[ex.id]?" (includes &minus;10% hint cost)":"")+'</p></div>';
  fb.innerHTML=h;
  var nx = (S.pos < EXS.length-1)? 'Next exercise':'Continue';
  var b=el("button","btn primary", nx+" &#9193;");
  b.addEventListener("click", nextEx);
  fb.appendChild(b);
}
function nextEx(){
  if(S.pos < EXS.length-1){ S.pos++; renderCurrent(); }
  else if(S.skipped.length){ openReview(); }
  else { showResults(false); }
}
function skipCurrent(){
  if(S.phase!=="exam") return;
  var ex=EXS[S.order[S.pos]];
  var a=S.ans[ex.id];
  if(a && a.status!=="skipped" && a.status!=="skipped-never") return; // already answered: Skip disabled
  S.ans[ex.id]={status:"skipped", earned:0};
  if(S.skipped.indexOf(ex.id)<0) S.skipped.push(ex.id);
  nextEx();
}

/* ---------- review skipped ---------- */
function openReview(){
  S.phase="review";
  app.innerHTML="";
  app.appendChild(buildHeader());
  var m=el("div","card");
  m.innerHTML='<h2 class="bigtitle" style="font-size:22px">&#8635; Review skipped exercises</h2>' +
    '<p class="muted">These exercises were skipped and never answered. Return to any of them and answer it while the timer still runs. If you finish the exam with skipped exercises left, they are <b>excluded from the score</b> &mdash; they count neither as correct nor as wrong.</p>';
  if(!S.skipped.length){
    m.appendChild(el("p",null,'<i class="muted">Nothing skipped &mdash; well done.</i>'));
  }
  S.skipped.forEach(function(id){
    var ex=EXS[S.order.filter(function(i){ return EXS[i].id===id; })[0]];
    var card=el("div","rev-card");
    card.innerHTML='<div><b>'+esc(ex.title)+'</b><div class="small muted">'+esc(ex.scenarioSummary)+'</div></div>';
    var b=el("button","btn","&#9998; Answer this");
    b.addEventListener("click", function(){ S.pos=S.order.indexOf(EXS.indexOf(ex)); S.phase="exam"; examViewAt(); });
    card.appendChild(b); m.appendChild(card);
  });
  var fin=el("button","btn primary","&#127937; Finish exam");
  fin.style.marginTop="10px";
  fin.addEventListener("click", function(){ showResults(false); });
  m.appendChild(fin);
  var back=el("button","btn","&#8592; Back");
  back.style.marginLeft="8px";
  back.addEventListener("click", function(){ S.pos=Math.max(0,S.pos); S.phase="exam"; examViewAt(); });
  m.appendChild(back);

/* ---------- widget: steps (decision tree) ---------- */
function wSTEPS(ex, rt){
  var st={ step: (rt&&rt.stepDone)? rt.stepDone.length:0, done:(rt&&rt.stepDone)? rt.stepDone.slice():[], picks:(rt&&rt.picks)?rt.picks:[] };
  var box=el("div");
  function renderStep(){
    box.innerHTML="";
    var n=ex.data.steps.length, i=st.step;
    var sd=ex.data.steps[i];
    var tag=el("div","steptag","STEP "+(i+1)+" OF "+n);
    box.appendChild(tag);
    if(sd.scenario) box.appendChild(el("div","artefact",'<div class="artefact-label">SCENARIO UPDATE</div>'+sd.scenario));
    var opts=el("div","opts"); var sel=-1;
    var sh=shuffle(sd.options.map(function(t,k){ return {t:t,i:k}; }));
    sh.forEach(function(o,k){
      var b=el("button","opt",' <span class="lbl">'+String.fromCharCode(65+k)+'.</span><span>'+o.t+'</span>');
      b.type="button";
      b.addEventListener("click",function(){ if(rt&&rt.locked) return; sel=o.i; [].forEach.call(opts.children,function(c){c.classList.remove("sel");}); b.classList.add("sel"); });
      opts.appendChild(b);
    });
    box.appendChild(opts);
    var ctl=el("div","row2");
    var sb=el("button","btn primary","&#10004; Submit step "+(i+1));
    sb.addEventListener("click",function(){
      if(sel<0) return;
      var good = sel===sd.answer;
      st.picks[i]=sel; st.done[i]=good; st.step=i+1;
      var mr=el("div","minires "+(good?"good":"bad"),(good?"&#10004; Correct for this step.":"&#10008; Not the best choice for this step.")+' <span class="small">'+sd.explain+'</span>');
      sb.disabled=true; [].forEach.call(opts.children,function(c){c.disabled=true;});
      box.appendChild(mr);
      var nb=el("button","btn primary",(i+1<n? "&#9193; Next step": "&#9193; Finish exercise"));
      nb.style.marginLeft="8px";
      nb.addEventListener("click", function(){ if(i+1<n) renderStep(); else finish(); });
      ctl.innerHTML=""; ctl.appendChild(nb);
    });
    ctl.appendChild(sb); box.appendChild(ctl);
  }
  function finish(){ /* handled by grade + feedback */ }
  if(st.step>=ex.data.steps.length){
    /* widget rebuilt after answering: show a compact summary instead of an empty box */
    var sum=el("div","small muted");
    var rows=ex.data.steps.map(function(s,i){
      var good=!!st.done[i];
      return '<div>'+(good? "&#10003;" : "&#10002;")+' Step '+(i+1)+': '+(good?"correct":"not the best choice")+'</div>';
    }).join("");
    sum.innerHTML='<div class="steptag">SCENARIO COMPLETED</div>'+rows;
    box.appendChild(sum);
  }
  else renderStep();
  var ratio=0;
  return {
    el:box,
    grade:function(){
      if(st.step < ex.data.steps.length) return {pending:true, pendingMsg:"Work through every step of this scenario, then press Submit."};
      var n=ex.data.steps.length, ok=0;
      for(var i=0;i<n;i++){ if(st.done[i]) ok++; }
      ratio = ok/n;
      var your = st.picks.map(function(p,i){ return "Step "+(i+1)+": "+esc(ex.data.steps[i].options[p]); }).join(" &middot; ");
      var corr = ex.data.steps.map(function(s,i){ return "Step "+(i+1)+": "+esc(s.options[s.answer]); }).join(" &middot; ");
      return { ok: ok===n, ratio:ratio, your:your, correct:corr };
    },
    lock:function(a){ rt.locked=true; }
  };
}

/* ---------- widget: drag & drop (zones) ---------- */
function wDRAG(ex, rt){
  var st={ placed:{}, sel:null, items:shuffle(ex.data.items.map(function(t,i){ return {t:t.t,i:i,tip:t.tip}; })) };
  var box=el("div");
  var bank=el("div","bank"); bank.setAttribute("aria-label","Item bank");
  var zones=el("div","zones");
  function chipFor(o, inZone, zoneIdx){
    var c=el("button","chip",esc(o.t)); c.type="button"; c.draggable=true;
    c.setAttribute("aria-label", (inZone? "In zone: move item ":"Item: place ")+o.t);
    c.addEventListener("click",function(){
      if(rt&&rt.locked) return;
      if(inZone){ // return to bank
        delete st.placed[o.i]; st.sel=null; draw();
      } else {
        if(st.sel===o.i){ st.sel=null; } else st.sel=o.i;
        draw();
      }
    });
    c.addEventListener("dragstart",function(ev){ ev.dataTransfer.setData("text/plain", String(o.i)); });
    return c;
  }
  function draw(){
    bank.innerHTML=""; zones.innerHTML="";
    st.items.forEach(function(o){
      if(st.placed[o.i]===undefined) bank.appendChild(chipFor(o,false,null));
    });
    ex.data.zones.forEach(function(z,zi){
      var zd=el("div","zone"); zd.setAttribute("data-zone",zi);
      zd.innerHTML="<h5>"+esc(z.name)+"</h5>";
      st.items.forEach(function(o){
        if(st.placed[o.i]===zi){ var holder=el("div","zitem"); holder.appendChild(chipFor(o,true,zi)); zd.appendChild(holder); }
      });
      zd.addEventListener("click",function(ev){
        if(rt&&rt.locked) return;
        if(ev.target!==zd && ev.target.parentNode!==zd && ev.target.tagName!=="H5") return;
        if(st.sel!=null){ st.placed[st.sel]=zi; st.sel=null; draw(); }
      });
      zd.addEventListener("dragover",function(ev){ ev.preventDefault(); zd.classList.add("over"); });
      zd.addEventListener("dragleave",function(){ zd.classList.remove("over"); });
      zd.addEventListener("drop",function(ev){ ev.preventDefault(); zd.classList.remove("over"); if(rt&&rt.locked) return; var id=parseInt(ev.dataTransfer.getData("text/plain"),10); if(!isNaN(id)){ st.placed[id]=zi; draw(); } });
      zones.appendChild(zd);
    });
  }
  draw();
  box.appendChild(el("p","small muted","Tap an item, then tap the zone. Drag and drop also works."));
  box.appendChild(el("div",null,'<b class="small">Items:</b>'));
  box.appendChild(bank);
  box.appendChild(el("div",null,'<b class="small">Zones:</b>'));
  box.appendChild(zones);
  function state(){ var r={}; Object.keys(st.placed).forEach(function(k){ r[k]=st.placed[k]; }); return r; }
  return {
    el:box,
    grade:function(){
      var n=ex.data.items.length;
      if(Object.keys(st.placed).length<n) return {pending:true, pendingMsg:"Place every item into a zone first."};
      var okAll=true;
      for(var i=0;i<n;i++){ var want=-1; for(var z=0;z<ex.data.zones.length;z++){ if(ex.data.zones[z].items.indexOf(i)>=0) want=z; }
        if(st.placed[i]!==want) okAll=false; }
      var your=ex.data.items.map(function(o,i){ return o.t+" &rarr; "+(st.placed[i]!==undefined? esc(ex.data.zones[st.placed[i]].name):"bank"); }).join("; ");
      var corr=ex.data.items.map(function(o,i){ var w=ex.data.zones.filter(function(z){ return z.items.indexOf(i)>=0; })[0]; return o.t+" &rarr; "+esc(w.name); }).join("; ");
      return { ok:okAll, ratio: okAll?1:0, your:your, correct:corr };
    },
    lock:function(){ rt.locked=true; draw(); [].forEach.call(box.querySelectorAll("button"),function(b){ b.disabled=true; }); }
  };
}

/* ---------- widget: order ---------- */
function wORDER(ex, rt){
  var st={ cur: shuffle(ex.data.items.map(function(t,i){ return {t:t,i:i}; })) };
  var box=el("div");
  var list=el("div","ord");
  function draw(){
    list.innerHTML="";

      var mv=el("div","mv");

      dn.addEventListener("click",function(){ if(rt&&rt.locked||k===st.cur.length-1) return; var t=st.cur[k+1]; st.cur[k+1]=st.cur[k]; st.cur[k]=t; draw(); });

/* ---------- widget: fill the blanks ---------- */
function wFILL(ex, rt){
  var st={ fill:{}, selWord:null, bank: shuffle(ex.data.bank.map(function(t,i){ return {t:t,i:i}; })) };
  var box=el("div");
  var text=el("div"); text.style.lineHeight="2.1";
  var bk=el("div","bank");
  function draw(){
    text.innerHTML="";
    ex.data.parts.forEach(function(part,i){
      text.appendChild(el("span",null,part));
      if(i<ex.data.answers.length){
        (function(bi){
          var b=el("button","slot"+(st.fill[bi]!==undefined?" filled":""), st.fill[bi]!==undefined? esc(ex.data.bank[st.fill[bi]]) : "______");
          b.type="button";

          b.addEventListener("click",function(){
            if(rt&&rt.locked) return;
            if(st.fill[bi]!==undefined){ delete st.fill[bi]; draw(); return; }
            if(st.selWord!==null){ st.fill[bi]=st.selWord; st.selWord=null; draw(); }
          });
          text.appendChild(b);
        })(i);
      }
    });
    bk.innerHTML="";
    st.bank.forEach(function(o){
      var used=Object.keys(st.fill).some(function(k){ return st.fill[k]===o.i; });
      var c=el("button","chip"+(used?" fixed":(st.selWord===o.i?" sel":"")),esc(o.t)); c.type="button"; c.style.margin="0";
      c.setAttribute("aria-pressed", st.selWord===o.i? "true":"false");

        if(rt&&rt.locked||used) return;

        draw();
      });
      bk.appendChild(c);
    });
  }
  draw();
  box.appendChild(text);
  box.appendChild(el("p","small muted","Word bank (shuffled) &mdash; tap a word to select it, then tap a blank to place it. Tap a filled blank to clear it."));
  box.appendChild(bk);
  return {
    el:box,
    grade:function(){
      if(ex.data.answers.some(function(a,i){ return st.fill[i]===undefined; })) return {pending:true, pendingMsg:"Fill every blank first."};
      var ok=true;
      for(var i=0;i<ex.data.answers.length;i++){
        var got = st.fill[i]!==undefined? ex.data.bank[st.fill[i]].toLowerCase():"";
        if(got!==ex.data.answers[i].toLowerCase()) ok=false;
      }
      return { ok:ok, your: ex.data.answers.map(function(a,i){ return st.fill[i]!==undefined? esc(ex.data.bank[st.fill[i]]):"empty"; }).join("; "), correct: ex.data.answers.map(function(a){ return esc(a); }).join("; ") };
    },
    lock:function(){ rt.locked=true; draw(); [].forEach.call(box.querySelectorAll("button"),function(b){ b.disabled=true; }); }
  };
}

/* ---------- copy helper (copyable code blocks) ---------- */
function copyCode(txt, btn){
  function done(ok){ if(!btn) return; var old=btn.getAttribute("data-old")||btn.textContent; btn.setAttribute("data-old",old); btn.textContent = ok? "\u2713 Copied":"\u2717 Copy failed"; setTimeout(function(){ btn.textContent=old; },1400); }
  function apiCopy(){
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){ done(true); }, function(){ done(false); });
        return true;
      }
    }catch(e){ /* fall through */ }
    return false;
  }
  /* 1st: synchronous execCommand inside the click gesture (works on file:// and http) */
  try{
    var ta=document.createElement("textarea"); ta.value=txt; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.top="0"; ta.style.left="0"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
    var ok=document.execCommand("copy"); ta.remove();
    if(ok){ done(true); return; }
  }catch(e){ /* fall through */ }
  if(!apiCopy()){ done(false); }
}
window.copyCode = copyCode;   /* used by inline Copy buttons in terminal feedback */

/* ---------- widget: terminal ---------- */
function wTERM(ex, rt){
  var st={ hist:[], attempts:(rt&&rt.attempts)||0, done:false };
  var d=ex.data;
  var box=el("div");
  var subIv=null;
  if(d.subTimer){
    var stl=el("span","subtimer","&#9201; Exercise limit: "+Math.floor(d.subTimer/60)+":"+((d.subTimer%60)<10?"0":"")+(d.subTimer%60));
    box.appendChild(el("div",null,'<b>Reduced time limit for this exercise.</b> ')).appendChild(stl);
    var left=d.subTimer;
    subIv=setInterval(function(){
      if(!box.isConnected){ clearInterval(subIv); return; }   /* exercise left the screen: stop the clock */
      left--; if(stl.parentNode){ stl.textContent="&#9201; Exercise limit: "+Math.floor(left/60)+":"+((left%60)<10?"0":"")+(left%60); }
      if(left<=0){ clearInterval(subIv); subIv=null; if(!st.done){ st.done=true; st.forcedFail=true; var sbx=$("#sub-btn"); if(sbx && !sbx.disabled && box.isConnected) sbx.click(); } }
    },1000);
  }
  if(d.banner) box.appendChild(el("pre","cmd",esc(d.banner)));
  if(d.syntax) box.appendChild(el("div","synt",d.syntax));
  if(d.expect) box.appendChild(el("div","synt",d.expect));
  var scr=el("div","term-scroll");
  var term=el("div","term"); term.appendChild(scr);
  var row=el("div","term-in");
  var ps=el("span","ps",esc(d.prompt||"$"));
  var inp=el("input"); inp.type="text"; inp.autocomplete="off"; inp.spellcheck=false;
  inp.setAttribute("aria-label","Type the command");
  row.appendChild(ps); row.appendChild(inp);
  var run=el("button","btn primary","&#9654; Run"); run.type="button";
  row.appendChild(run);
  term.appendChild(row);
  box.appendChild(term);
  function print(s){ var l=el("div",null,esc(s)); scr.appendChild(l); scr.scrollTop=scr.scrollHeight; }
  (d.motd||[]).forEach(print);
  function runCmd(){
    if(st.done || (rt&&rt.locked)) return;
    var v=inp.value; inp.value="";
    print((d.prompt||"$")+" "+v);
    if(!v.trim()){ print("(type a command)"); return; }
    st.attempts++;
    if(normPair(v, d.accepted, d.matchMode||"exact", !!d.caseSensitive)){
      print(d.output||"(command executed)");
      print(">> Looks right. Command accepted.");
      st.done=true;
      st.passed=true;
      if(rt) rt.passed=true;
      if(subIv){ clearInterval(subIv); subIv=null; }
      var sb0=$("#sub-btn"); if(sb0 && !sb0.disabled && box.isConnected) sb0.click();
    } else {
      if(d.danger && d.danger.some(function(x){ return ncmd(v).toLowerCase().indexOf(x.toLowerCase())>=0; })){
        print(">> STOP. This command would destroy or alter evidence. It is NOT accepted.");
      } else if(ncmd(v).indexOf(d.badHint||"@@")>=0 && d.badMsg){
        print(d.badMsg);
      } else {
        print((d.errText||"command not found or wrong syntax"));
      }
      if(st.attempts>=(d.maxAttempts||3)){
        st.done=true; print(">> Three attempts used. The canonical command is shown in the feedback below.");
        if(rt) rt.failed=true;
        var sb1=$("#sub-btn"); if(sb1 && !sb1.disabled) sb1.click();
      } else {
        print(">> Attempts used: "+st.attempts+" of "+(d.maxAttempts||3)+".");
      }
    }
  }
  run.addEventListener("click", runCmd);
  inp.addEventListener("keydown", function(ev){ if(ev.key==="Enter"){ ev.preventDefault(); runCmd(); } });
  return {
    el:box,
    grade:function(){
      if(st.attempts===0 && !st.forcedFail) return {pending:true, pendingMsg:"Run your command in the terminal first, then press Submit."};
      var ok = st.passed===true && !st.forcedFail;
      var cid="cmd-"+ex.id+"-"+Math.floor(Math.random()*1e6);
      var canon='<pre class="cmd" id="'+cid+'">'+esc(d.canonical)+'</pre>'+
        '<button type="button" class="btn copybtn" onclick="copyCode(document.getElementById(\''+cid+'\').textContent,this)">&#128203; Copy command</button>';
      var parts=d.canonicalParts.map(function(p){ return "<li><b>"+esc(p.p)+"</b> &mdash; "+esc(p.m)+"</li>"; }).join("");
      var correct=canon+"<ul class='small'>"+parts+"</ul>"+(d.dangerNote?'<p class="small" style="color:#ffb4b4">&#9888; '+d.dangerNote+'</p>':"");
      return { ok:ok, your: st.attempts? ("You ran "+st.attempts+" attempt(s). See the terminal transcript.") : "(no command run)", correct:correct };
    },
    lock:function(){ rt.locked=true; st.done=true; if(subIv){ clearInterval(subIv); subIv=null; } inp.disabled=true; run.disabled=true; }
  };
}

/* ---------- widget: log viewer ---------- */
function wLOG(ex, rt){
  var st={ sel:-1 };
  var box=el("div");
  var fl=el("input","logfilter"); fl.type="text"; fl.placeholder=ex.data.filterHint||"Filter lines (text match)"; fl.setAttribute("aria-label","Filter log lines");
  var list=el("div"); list.style.maxHeight="340px"; list.style.overflowY="auto"; list.style.border="1px solid var(--line)"; list.style.borderRadius="8px"; list.style.background="#0a0f1e"; list.style.padding="6px";
  function draw(q){
    list.innerHTML="";
    ex.data.logs.forEach(function(ln,i){
      if(q && ln.toLowerCase().indexOf(q.toLowerCase())<0) return;
      var b=el("button","logrow",hlLog(ln)); b.type="button";
      b.setAttribute("data-i",i);
      b.setAttribute("aria-label","Log line "+(i+1)+": select");
      b.addEventListener("click",function(){ if(rt&&rt.locked) return; st.sel=i; [].forEach.call(list.querySelectorAll(".logrow"),function(r){ r.classList.remove("sel"); }); b.classList.add("sel"); });
      list.appendChild(b);
    });
    if(!list.children.length) list.appendChild(el("div","muted small","No lines match the filter."));
  }
  draw("");
  fl.addEventListener("input",function(){ draw(fl.value.trim()); });
  box.appendChild(el("p","small muted","Click a line to select it. Use the filter box like in Kibana or Splunk."));
  box.appendChild(fl); box.appendChild(list);
  return {
    el:box,
    grade:function(){
      if(st.sel<0) return {pending:true, pendingMsg:"Click a log line to select it, then press Submit."};
      var ok = ex.data.targets.indexOf(st.sel)>=0;
      return { ok:ok, your: st.sel>=0? esc(ex.data.logs[st.sel]) : "(no line selected)", correct: ex.data.targets.map(function(i){ return esc(ex.data.logs[i]); }).join("<br>") };
    },
    lock:function(a){ rt.locked=true; [].forEach.call(list.querySelectorAll(".logrow"),function(b){ b.disabled=true; }); }
  };
}

/* ---------- widget factory ---------- */
function buildWidget(ex){
  var rt = RT[ex.id] || (RT[ex.id]={locked:false});
  var w;
  switch(ex.type){
    case "qcm": w=wQCM(ex,rt); break;
    case "multi": w=wMULTI(ex,rt); break;
    case "steps": w=wSTEPS(ex,rt); break;
    case "dragdrop": w=wDRAG(ex,rt); break;
    case "order": w=wORDER(ex,rt); break;
    case "match": w=wMATCH(ex,rt); break;
    case "fill": w=wFILL(ex,rt); break;
    case "terminal": w=wTERM(ex,rt); break;
    case "logview": w=wLOG(ex,rt); break;
    default: w=wQCM(ex,rt);
  }
  return w;
}

/* ---------- handshake ---------- */
window.addEventListener("message", function(event){
  if(!event.data) return;
  if(event.data.type!=="CYBERPULSE_INIT" && event.data.type!=="CYBERMASTERY_INIT") return;
  if(event.data.username) S.userName=String(event.data.username);
});

/* ---------- boot ---------- */
function boot(){
  app=$("#app");
  introView();
}
if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", boot); } else { boot(); }
})();
