<script>
window.EXAM = {"meta": {"topicId": "t1566.001", "batch": 1, "title": "T1566.001 Phishing: Spearphishing Attachment — EASY", "difficulty": "easy", "questionCount": 12, "estimatedMinutes": 20, "passMark": 70}, "timerSec": 1200, "difficultyLabel": "EASY", "subtitle": "CyberPulseAcademy practice exam — batch 1 of 4 • everything loads from this one file", "themes": [{"name": "Technique Identity & Family", "chips": ["T1566.001 Spearphishing Attachment", "Parent T1566 Phishing", "T1566.002 Spearphishing Link", "T1566.003 Spearphishing via Service", "T1566.004 Spearphishing Voice", "Initial Access TA0001", "ATT&CK Enterprise v2.2"]}, {"name": "Adversary Behaviour & Lure Craft", "chips": ["Plausible pretext", "Enable-content prompt", "ZIP password in email body", "Extension & icon manipulation", "Exploit or direct execution", "Archive types ZIP / RAR / ISO / CHM / HWP / LNK"]}, {"name": "Lifecycle Position & Next Steps", "chips": ["First foothold", "User Execution T1204", "Exploitation for Client Execution T1203", "PowerShell T1059.001", "Ingress Tool Transfer T1105", "Attachment vs link vs service trade-offs"]}, {"name": "Platforms & Execution Context", "chips": ["Linux", "Windows", "macOS", "User permission required", "One chosen target at a time"]}, {"name": "Data Sources & Telemetry", "chips": ["Email gateway logs", "File creation on disk", "Process execution (Office spawning shells)", "Outbound network flow", "User mail directories", "Mail.app logs (macOS)"]}, {"name": "Detection Logic & Analytics", "chips": ["DET0236 Detection Strategy", "AN0655 Windows correlation", "AN0656 Linux correlation", "AN0657 macOS correlation", "Detonation / sandboxing", "Mark-of-the-Web", "False-positive tuning"]}, {"name": "Mitigations & Controls", "chips": ["M1049 Antivirus/Antimalware", "M1047 Audit", "M1031 Network Intrusion Prevention", "M1021 Restrict Web-Based Content", "M1054 Software Configuration", "M1018 User Account Management", "M1017 User Training"]}, {"name": "Threat Actor Usage & Real-World Work", "chips": ["APT28 G0007", "APT29 G0016", "APT37 G0067", "APT-C-36 G0099", "Cobalt Group G0080", "Kimsuky G0094", "Emotet S0367", "SOC triage", "IR evidence", "CTI reporting", "Awareness training", "Red-team emulation"]}], "introExpl": "\n<h3>What you will learn<\/h3>\n<p>This exam is about one MITRE ATT&amp;CK object: <b>T1566.001 &mdash; Phishing: Spearphishing Attachment<\/b>.<\/p>\n<p><b>What kind of object is this?<\/b> T1566.001 is a <b>sub-technique<\/b>. A sub-technique is one specific way to do a bigger thing. The bigger thing here is the technique <b>T1566 &mdash; Phishing<\/b>. Phishing has four sub-techniques: a malicious file attached to an email (T1566.001), a bad link inside an email (T1566.002), phishing through a trusted service (T1566.003), and phishing by phone call (T1566.004). This exam is only about the <b>attachment<\/b> form. In the ATT&amp;CK matrix it sits in the tactic <b>Initial Access (TA0001)<\/b> &mdash; the first step of an attack.<\/p>\n<p><b>What does the attacker do?<\/b> Imagine you get an email that looks normal. It says: &ldquo;Your invoice is attached.&rdquo; A file is attached: a Word document, a PDF, an archive like ZIP or RAR, or an executable. The email gives you a believable reason to open the file. Sometimes it even tells you how to unlock it &mdash; for example, a ZIP password written in the email. That trick helps the attacker slip past email scanners, because a scanner cannot open a password-protected archive. When you open the file, hidden code runs. Sometimes the file uses a bug in the program (an exploit). Sometimes it only asks you to click &ldquo;Enable content&rdquo;. Attackers also fake file names and icons, so a program looks like a simple document.<\/p>\n<p><b>Where is this used at work?<\/b> You will meet T1566.001 in many roles. A <b>SOC analyst<\/b> triages alerts from the mail gateway and the endpoint. An <b>incident responder<\/b> collects the attachment and the evidence on the machine. A <b>detection engineer<\/b> builds analytics like ATT&amp;CK&rsquo;s <b>DET0236<\/b>: it links email delivery, file creation, and abnormal process execution &mdash; for example Word spawning PowerShell or CMD. A <b>threat-intel analyst<\/b> tracks the many groups that use it: APT28, APT29, APT37, APT-C-36, Cobalt Group, Kimsuky, and malware like Emotet. An <b>awareness trainer<\/b> teaches staff to report invoice and shipping lures. A <b>red teamer<\/b> imitates this attack to test the mail defences. A <b>GRC or control owner<\/b> maps the mitigations &mdash; M1049, M1021, M1054, M1017 and others &mdash; to this risk.<\/p>\n<p><b>Why does it matter?<\/b> The spearphishing attachment is one of the most common first steps of a real intrusion. Ransomware gangs, spies and e-crime groups all start here. If you can stop it, you stop the whole attack before it starts.<\/p>\n", "introThemes": "<div class=\"kwgroup\"><h5>Technique Identity & Family<\/h5><div class=\"themechips\"><span>T1566.001 Spearphishing Attachment<\/span><span>Parent T1566 Phishing<\/span><span>T1566.002 Spearphishing Link<\/span><span>T1566.003 Spearphishing via Service<\/span><span>T1566.004 Spearphishing Voice<\/span><span>Initial Access TA0001<\/span><span>ATT&CK Enterprise v2.2<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Adversary Behaviour & Lure Craft<\/h5><div class=\"themechips\"><span>Plausible pretext<\/span><span>Enable-content prompt<\/span><span>ZIP password in email body<\/span><span>Extension & icon manipulation<\/span><span>Exploit or direct execution<\/span><span>Archive types ZIP / RAR / ISO / CHM / HWP / LNK<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Lifecycle Position & Next Steps<\/h5><div class=\"themechips\"><span>First foothold<\/span><span>User Execution T1204<\/span><span>Exploitation for Client Execution T1203<\/span><span>PowerShell T1059.001<\/span><span>Ingress Tool Transfer T1105<\/span><span>Attachment vs link vs service trade-offs<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Platforms & Execution Context<\/h5><div class=\"themechips\"><span>Linux<\/span><span>Windows<\/span><span>macOS<\/span><span>User permission required<\/span><span>One chosen target at a time<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Data Sources & Telemetry<\/h5><div class=\"themechips\"><span>Email gateway logs<\/span><span>File creation on disk<\/span><span>Process execution (Office spawning shells)<\/span><span>Outbound network flow<\/span><span>User mail directories<\/span><span>Mail.app logs (macOS)<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Detection Logic & Analytics<\/h5><div class=\"themechips\"><span>DET0236 Detection Strategy<\/span><span>AN0655 Windows correlation<\/span><span>AN0656 Linux correlation<\/span><span>AN0657 macOS correlation<\/span><span>Detonation / sandboxing<\/span><span>Mark-of-the-Web<\/span><span>False-positive tuning<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Mitigations & Controls<\/h5><div class=\"themechips\"><span>M1049 Antivirus/Antimalware<\/span><span>M1047 Audit<\/span><span>M1031 Network Intrusion Prevention<\/span><span>M1021 Restrict Web-Based Content<\/span><span>M1054 Software Configuration<\/span><span>M1018 User Account Management<\/span><span>M1017 User Training<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Threat Actor Usage & Real-World Work<\/h5><div class=\"themechips\"><span>APT28 G0007<\/span><span>APT29 G0016<\/span><span>APT37 G0067<\/span><span>APT-C-36 G0099<\/span><span>Cobalt Group G0080<\/span><span>Kimsuky G0094<\/span><span>Emotet S0367<\/span><span>SOC triage<\/span><span>IR evidence<\/span><span>CTI reporting<\/span><span>Awareness training<\/span><span>Red-team emulation<\/span><\/div><\/div>", "introRules": "\n<p><b>Goal:<\/b> master the ATT&amp;CK sub-technique <b>T1566.001 Spearphishing Attachment<\/b> at <b>EASY<\/b> level. EASY means: one idea per exercise, short scenarios, clear guidance, and hints that point at the concept itself.<\/p>\n<p><b>Passing score:<\/b> <b>70%<\/b>. Every exercise is worth <b>10 points<\/b>, so <b>120 points<\/b> are possible in total.<\/p>\n<p><b>Exercise types you will see:<\/b> multiple choice, matching pairs, drag and drop into zones, ordering steps, fill the blanks, log reading with a filter box, and <b>one small terminal task<\/b> where you type a simple command (the syntax is shown next to it, and small typing differences are forgiven).<\/p>\n<p><b>Timer:<\/b> <b>20 minutes<\/b> for the whole exam. You can <b>pause<\/b> &mdash; while paused, the exercise is hidden so nobody can read ahead. If time runs out, unanswered exercises are simply not scored.<\/p>\n<p><b>Hints:<\/b> the Hint button reveals a nudge and costs <b>&minus;10%<\/b> of that exercise (one point). It never gives the answer away.<\/p>\n<p><b>Skip:<\/b> every exercise has a <b>Skip<\/b> button. Skipped exercises move to a review pool. Before you finish, you can return to them and answer them, as long as the timer still runs. If you finish with skipped exercises left, they are <b>excluded from the score<\/b> &mdash; they count neither as correct nor as wrong.<\/p>\n<p><b>Retake:<\/b> if you fail, you can retake the exam &mdash; questions and answer options are reshuffled.<\/p>\n", "exercises": [{"id": "E01", "type": "qcm", "theme": 0, "points": 10, "typeLabel": "Multiple choice", "title": "What kind of ATT&CK object is T1566.001?", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; ATT&amp;CK page excerpt<\/div><pre class=\"log\" data-hl=\"1\">ID:            T1566.001\nName:          Phishing: Spearphishing Attachment\nSub-technique of: T1566 (Phishing)\nTactic:        Initial Access\nPlatforms:     Linux, Windows, macOS<\/pre><\/div>", "scenarioSummary": "ATT&amp;CK page excerpt for T1566.001", "question": "What kind of object is T1566.001 in the ATT&CK framework?", "data": {"options": ["A sub-technique: one specific way to do the technique Phishing (T1566)", "A tactic: one goal that an adversary wants to reach in an attack", "A mitigation: one control that removes or reduces a risk", "A group: one named team of threat actors that attacks organisations"], "answer": 0}, "hint": "This object is a child of a bigger technique. The bigger technique is called Phishing (T1566).", "explain": "<p>T1566.001 is a <b>sub-technique<\/b>. The parent technique is <b>T1566 Phishing<\/b>. A sub-technique describes one specific way to do the parent. Here, the specific way is: put the malware <b>in a file attached to the email<\/b>. The ATT&amp;CK page itself says &ldquo;Sub-technique of: T1566&rdquo;. A tactic would be a goal like Initial Access. A mitigation would be a control. A group would be actors. T1566.001 is none of those.<\/p>", "study": "The ATT&CK data model: tactic vs technique vs sub-technique vs mitigation vs group.", "persp": {"atk": "For the attacker, the sub-technique is a ready-made playbook entry: attach the file, add a story, wait for the open.", "def": "For the defender, knowing the exact sub-technique ID makes detection rules and reports precise: you defend against T1566.001, not &ldquo;phishing in general&rdquo;."}}, {"id": "E02", "type": "match", "theme": 0, "points": 10, "typeLabel": "Matching pairs", "title": "Match the Phishing sub-techniques to their delivery method", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; The Phishing (T1566) family<\/div><pre class=\"log\" data-hl=\"1\">T1566    Phishing (parent technique)\nT1566.001  Spearphishing Attachment\nT1566.002  Spearphishing Link\nT1566.003  Spearphishing via Service\nT1566.004  Spearphishing Voice<\/pre><\/div>", "scenarioSummary": "The four children of technique T1566 Phishing", "question": "Match each sub-technique ID to the delivery method it describes.", "data": {"pairs": [["T1566.001", "A malicious file attached to the email"], ["T1566.002", "A malicious link placed inside the email text"], ["T1566.003", "Phishing sent through a trusted third-party service"], ["T1566.004", "A phone call that talks the victim into access"]]}, "hint": "One sibling carries a file, one carries a URL, one borrows a trusted platform, one uses a voice.", "explain": "<p>All four children belong to the same parent, <b>T1566 Phishing<\/b>. The difference is only the delivery channel. <b>T1566.001<\/b> = the malware rides <b>in an attached file<\/b>. <b>T1566.002<\/b> = the email holds a <b>link<\/b> instead of a file. <b>T1566.003<\/b> = the message arrives from a <b>trusted service<\/b> the target already uses. <b>T1566.004<\/b> = the attacker <b>calls<\/b> the victim. If a file travelled with the email, it is always .001.<\/p>", "study": "The four sub-techniques of T1566 and how their delivery channels differ."}, {"id": "E03", "type": "dragdrop", "theme": 2, "points": 10, "typeLabel": "Drag & drop", "title": "Place T1566.001 into the correct ATT&CK tactic", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; ATT&amp;CK matrix excerpt<\/div><pre class=\"log\" data-hl=\"1\"> INITIAL ACCESS      EXECUTION          PERSISTENCE        COMMAND AND CONTROL\n [empty]             [empty]            [empty]            [empty]<\/pre><\/div>", "scenarioSummary": "Four empty tactic columns from the ATT&amp;CK matrix", "question": "Drag each technique chip into the tactic column where ATT&CK puts it.", "data": {"zones": [{"name": "Initial Access (TA0001)", "items": [0]}, {"name": "Execution (TA0002)", "items": [1]}, {"name": "Persistence (TA0003)", "items": [2]}, {"name": "Command and Control (TA0011)", "items": [3]}], "items": [{"t": "T1566.001 Spearphishing Attachment"}, {"t": "T1059.005 Visual Basic"}, {"t": "T1136 Create Account"}, {"t": "T1071 Application Layer Protocol"}]}, "hint": "Ask one question per chip: what does the adversary get at that exact moment?", "explain": "<p><b>T1566.001<\/b> is how the adversary gets the <b>first foothold<\/b>, so ATT&amp;CK files it under <b>Initial Access (TA0001)<\/b>. Running code after delivery (like <b>T1059.005<\/b> Visual Basic) is <b>Execution<\/b>. Keeping access (like <b>T1136<\/b> Create Account) is <b>Persistence<\/b>. Talking to the operator&rsquo;s server (like <b>T1071<\/b>) is <b>Command and Control<\/b>.<\/p>", "study": "Where T1566.001 sits in the ATT&CK matrix, and what its neighbour tactics mean."}, {"id": "E04", "type": "qcm", "theme": 1, "points": 10, "typeLabel": "Multiple choice", "title": "Why does the attacker choose an attachment?", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; The email you intercepted<\/div><pre class=\"log\" data-hl=\"1\">From:    billing@supplier-ltd[.]example\nTo:      one chosen accountant\nSubject: Invoice #8841 overdue\nBody:    \"Please open the attached invoice and\n          enable macros to see the full amount.\"\nAttachment: Invoice_8841.docm (contains a macro)<\/pre><\/div>", "scenarioSummary": "One targeted email with a macro Word file attached", "question": "Why does the attacker attach the payload to the email instead of using another method?", "data": {"options": ["It scans the victim network for open ports without any user action", "It cracks password hashes on the server within a few seconds", "The payload travels inside the file and runs when the user opens it", "It silently changes firewall rules from outside the company"], "answer": 2}, "hint": "Think about what must happen inside the victim&rsquo;s machine for the hidden code to run.", "explain": "<p>The ATT&amp;CK description says it plainly: the adversary attaches a file and <b>relies on User Execution<\/b> &mdash; the user must open it (and often click past protections). The payload then <b>exploits a vulnerability or executes directly<\/b> on the user&rsquo;s system. The email text exists to make that click believable. Port scanning, password cracking and firewall changes are other techniques entirely.<\/p>", "study": "How T1566.001 depends on User Execution (T1204).", "persp": {"atk": "Attacker view: a targeted human is the weakest link &mdash; one opened file is enough, and the story in the email is the crowbar.", "def": "Defender view: scan attachments (M1049), filter risky mail at the boundary (M1021), and train the click-reflex away (M1017)."}}, {"id": "E05", "type": "logview", "theme": 4, "points": 10, "typeLabel": "Log analysis", "title": "Find the message that carries a macro-enabled attachment", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Mail gateway log, one morning<\/div><pre class=\"log\" data-hl=\"1\">09:12:03  gw-mail01  PASS  inbound  from=updates@partner-bank[.]example      subj=\"Q3 Portfolio Review\"       attachment=none                 size=12KB\n09:14:44  gw-mail02  PASS  inbound  from=invoice@supplier-ltd[.]example       subj=\"Invoice #8841 overdue\"     attachment=Invoice_8841.docm    size=540KB\n09:15:02  gw-mail01  PASS  inbound  from=news@industry-daily[.]example        subj=\"Morning digest\"            attachment=none                 size=88KB\n09:16:10  gw-mail02  BLOCK inbound  from=no-reply@cloud-id[.]example           subj=\"Password expires today\"    attachment=none                 rule=brand-spoof\n09:19:31  gw-mail01  PASS  inbound  from=hr@local-school[.]example            subj=\"Term dates\"                attachment=Term_Dates.pdf       size=210KB\n09:22:05  gw-mail02  PASS  inbound  from=it-notify@company[.]example          subj=\"Ticket #4471 closed\"       attachment=none                 size=6KB<\/pre><\/div>", "scenarioSummary": "Six gateway lines &mdash; one delivered file is macro-enabled", "question": "Click the one delivered message that carries a macro-enabled attachment.", "data": {"logs": ["09:12:03  gw-mail01  PASS  inbound  from=updates@partner-bank[.]example      subj=\"Q3 Portfolio Review\"       attachment=none                 size=12KB", "09:14:44  gw-mail02  PASS  inbound  from=invoice@supplier-ltd[.]example       subj=\"Invoice #8841 overdue\"     attachment=Invoice_8841.docm    size=540KB", "09:15:02  gw-mail01  PASS  inbound  from=news@industry-daily[.]example        subj=\"Morning digest\"            attachment=none                 size=88KB", "09:16:10  gw-mail02  BLOCK inbound  from=no-reply@cloud-id[.]example           subj=\"Password expires today\"    attachment=none                 rule=brand-spoof", "09:19:31  gw-mail01  PASS  inbound  from=hr@local-school[.]example            subj=\"Term dates\"                attachment=Term_Dates.pdf       size=210KB", "09:22:05  gw-mail02  PASS  inbound  from=it-notify@company[.]example          subj=\"Ticket #4471 closed\"       attachment=none                 size=6KB"], "targets": [1], "filterHint": "Filter by text, for example docm"}, "hint": "A macro-enabled Word document ends with the file extension .docm.", "explain": "<p>Look at the <b>attachment=<\/b> field of every <b>PASS<\/b> line. Only one delivered message carries <b>Invoice_8841.docm<\/b>. The <b>.docm<\/b> ending means a Word file <b>with macros<\/b> &mdash; exactly the container T1566.001 loves. The PDF is a normal file. The BLOCK line was stopped and never delivered, so it is not the answer. Attachment=none lines carry no file at all.<\/p>", "study": "Reading mail gateway logs: PASS vs BLOCK, and which attachment types are risky (.docm, .xlsm, .iso)."}, {"id": "E06", "type": "qcm", "theme": 3, "points": 10, "typeLabel": "Multiple choice", "title": "On which platforms does T1566.001 take place?", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; ATT&amp;CK page, fact line<\/div><pre class=\"log\" data-hl=\"1\">ID:         T1566.001\nTactic:     Initial Access\nPlatforms:  ?\nPermissions: User<\/pre><\/div>", "scenarioSummary": "The platforms field is missing from the fact line", "question": "Which platform list matches the ATT&CK page for T1566.001?", "data": {"options": ["Only Android phones and tablets", "Linux, Windows, and macOS", "Only cloud servers, no user devices", "Only industrial controllers in factories"], "answer": 1}, "hint": "The technique page lists three systems: two office desktops and one penguin.", "explain": "<p>The ATT&amp;CK page for T1566.001 lists <b>Linux, Windows, macOS<\/b>. That makes sense: email lands on user desktops and laptops, and all three systems read mail. The page also lists <b>Permissions Required: User<\/b> &mdash; a human must act. Phones, pure cloud servers and industrial controllers are not what this sub-technique targets.<\/p>", "study": "The Platforms and Permissions Required fields on the T1566.001 ATT&CK page."}, {"id": "E07", "type": "fill", "theme": 1, "points": 10, "typeLabel": "Fill the blanks", "title": "Complete the alert summary sentence", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; A draft alert summary, two words missing<\/div><pre class=\"log\" data-hl=\"1\">SOC ALERT DRAFT #0007\n\nThe email body gives the user a believable reason to\nopen the file. The attached Word document contains a\n[ 1 ] that runs when the user [ 2 ] it.<\/pre><\/div>", "scenarioSummary": "Alert draft with two blank words", "question": "Place the two missing words into the blanks.", "data": {"parts": ["The email body gives the user a believable reason to open the file. The attached Word document contains a&nbsp;", "&nbsp;that runs when the user&nbsp;", "&nbsp;it."], "answers": ["macro", "opens"], "bank": ["macro", "opens", "firewall", "deletes", "printer", "router"]}, "hint": "One blank is a small program hidden inside the document. The other is what the user does with the file.", "explain": "<p>The hidden program inside an Office file is a <b>macro<\/b>. T1566.001 works because the user <b>opens<\/b> the attachment &mdash; ATT&amp;CK calls this reliance on <b>User Execution<\/b>. Firewall, printer and router do not belong in this sentence; the attacker never touches them at this stage.<\/p>", "study": "Why macros inside attachments matter for T1566.001, and the term User Execution (T1204)."}, {"id": "E08", "type": "terminal", "theme": 4, "points": 10, "typeLabel": "Terminal task", "title": "List the user's Downloads folder to find the attachment", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Helpdesk ticket #4471<\/div><p>A user says a strange file appeared in their Downloads folder. You are a SOC trainee on that Windows 11 PC. Your mentor says: &ldquo;Use the <b>dir<\/b> command &mdash; it lists the files in a folder. Show me what is in the Downloads folder of this user.&rdquo;<\/p><\/div>", "scenarioSummary": "Ticket #4471 &mdash; list C:\\Users\\bward\\Downloads with dir", "question": "Type the command that lists the files in C:\\Users\\bward\\Downloads.", "data": {"prompt": "C:\\Users\\bward>", "motd": ["Microsoft Windows [Version 10.0.22631]", "(c) Microsoft Corporation. All rights reserved.", ""], "syntax": "<b>Syntax reminder:<\/b> <span class=\"mono\">dir &lt;folder path&gt;<\/span> &mdash; lists the files in that folder. Example on a <i>different<\/i> target: <span class=\"mono\">dir C:\\Users\\maria\\Documents<\/span>", "expect": "<b>Expected output shape:<\/b> a file list with dates and sizes, for example <span class=\"mono\">10/09/2026  09:14 AM  52,301 Invoice_8841.pdf.exe<\/span>", "accepted": ["dir C:\\Users\\bward\\Downloads", "dir C:\\Users\\bward\\Downloads\\"], "matchMode": "exact", "caseSensitive": false, "maxAttempts": 3, "canonical": "dir C:\\Users\\bward\\Downloads", "canonicalParts": [{"p": "dir", "m": "the Windows command that lists folder contents"}, {"p": "C:\\Users\\bward\\Downloads", "m": "the target folder &mdash; the user's Downloads, where mail attachments are saved"}], "output": " Directory of C:\\Users\\bward\\Downloads\n\n10/09/2026  09:14 AM    <DIR>          .\n10/09/2026  09:14 AM    <DIR>          ..\n10/09/2026  09:14 AM            52,301 Invoice_8841.pdf.exe\n10/08/2026  04:41 PM           184,012 Team_Calendar_2026.xlsx\n10/01/2026  11:02 AM             9,214 meeting_notes.txt", "errText": "Wrong command or wrong folder. Keep the shape: dir, one space, then the full folder path ending in Downloads."}, "hint": "Type dir, one space, then the folder path exactly as it appears in the ticket.", "explain": "<p>The command <span class=\"mono\">dir C:\\Users\\bward\\Downloads<\/span> has two parts: the tool <b>dir<\/b> and the <b>target path<\/b>. The listing shows <b>Invoice_8841.pdf.exe<\/b> &mdash; a double extension. The real program is the <b>.exe<\/b> at the end; the <b>.pdf<\/b> in the middle is decoration. This is the extension-and-icon manipulation the ATT&amp;CK description warns about. Small typing differences (capital letters, quotes, a trailing backslash) are accepted here.<\/p>", "study": "Basic Windows dir usage, and why a double extension like .pdf.exe is a red flag."}, {"id": "E09", "type": "order", "theme": 2, "points": 10, "typeLabel": "Ordering", "title": "Put the first moments of the attack in order", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Three events, order unknown<\/div><pre class=\"log\" data-hl=\"1\"> ?  The hidden code inside the attachment runs.\n ?  The email with the attachment arrives in the inbox.\n ?  The user opens the attachment.<\/pre><\/div>", "scenarioSummary": "Three attack events to put in sequence", "question": "Drag the three events into the order in which they happen.", "data": {"items": ["The email with the attachment arrives in the user's inbox", "The user opens the attachment", "The hidden code inside the attachment runs"]}, "hint": "First the file must arrive. Last, the code runs. One event sits between them.", "explain": "<p>Correct order: <b>1)<\/b> delivery &mdash; the email lands in the inbox; <b>2)<\/b> the user opens the attachment; <b>3)<\/b> the hidden code runs. Step 2 is the one the attacker cannot do alone &mdash; it needs the user, which is why ATT&amp;CK says T1566.001 relies on <b>User Execution<\/b>. Everything after step 3 belongs to later tactics like Execution and Command and Control.<\/p>", "study": "The delivery &rarr; open &rarr; execute sequence of T1566.001."}, {"id": "E10", "type": "dragdrop", "theme": 1, "points": 10, "typeLabel": "Drag & drop", "title": "Sort what belongs to a spearphishing attachment attack", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Four observations from a user workstation<\/div><pre class=\"log\" data-hl=\"1\"> 1. A Word file with a hidden macro inside\n 2. An email story that builds trust before the open\n 3. A firewall admin changing a port rule on purpose\n 4. A nightly database backup job that finished fine<\/pre><\/div>", "scenarioSummary": "Four observations &mdash; two belong, two do not", "question": "Sort the four observations into the right zones.", "data": {"zones": [{"name": "Part of a spearphishing attachment attack", "items": [0, 1]}, {"name": "Not part of it", "items": [2, 3]}], "items": [{"t": "A Word file with a hidden macro inside"}, {"t": "An email story that builds trust before the open"}, {"t": "A firewall admin changing a port rule on purpose"}, {"t": "A nightly database backup job that finished fine"}]}, "hint": "Two items are things the email attacker prepares. Two items are normal IT work.", "explain": "<p>A spearphishing attachment attack needs two things: a <b>lure<\/b> (the email story) and a <b>payload container<\/b> (the macro file). Those are observations 1 and 2. A planned firewall change and a healthy backup job are normal operations &mdash; they can appear in a SOC queue, but they are not part of this technique.<\/p>", "study": "The two ingredients of T1566.001: the lure email and the weaponised attachment."}, {"id": "E11", "type": "qcm", "theme": 6, "points": 10, "typeLabel": "Multiple choice", "title": "Which mitigation means teaching users to spot phishing?", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; ATT&amp;CK mitigation list for T1566.001<\/div><pre class=\"log\" data-hl=\"1\">M1049  Antivirus/Antimalware\nM1047  Audit\nM1031  Network Intrusion Prevention\nM1021  Restrict Web-Based Content\nM1054  Software Configuration\nM1018  User Account Management\nM1017  User Training<\/pre><\/div>", "scenarioSummary": "The seven ATT&CK mitigations listed for T1566.001", "question": "Which mitigation means teaching users to spot and report phishing?", "data": {"options": ["M1049 Antivirus/Antimalware &mdash; software that scans files", "M1054 Software Configuration &mdash; checks senders with SPF and DKIM", "M1031 Network Intrusion Prevention &mdash; a guard on the network", "M1017 User Training &mdash; teaching staff to spot and report phishing"], "answer": 3}, "hint": "This control is about people, not about software or network boxes.", "explain": "<p><b>M1017 User Training<\/b> is the human control: awareness courses, fake-phishing drills, and a simple way to report suspicious mail. It works because T1566.001 needs a person to open the file &mdash; train the person, and the attack loses its key step. The other options are real mitigations too, but they are technical: M1049 scans, M1054 checks the sender&rsquo;s domain and the message integrity, M1031 guards the network.<\/p>", "study": "The mitigation list on the T1566.001 ATT&CK page and what each ID stands for.", "persp": {"atk": "Attacker view: user training raises the failure rate of each campaign, so attackers improve their stories to sound more routine.", "def": "Defender view: pair training with an easy report button &mdash; a reported email is a free early warning for the whole company."}}, {"id": "E12", "type": "match", "theme": 6, "points": 10, "typeLabel": "Matching pairs", "title": "Match each mitigation to the simple job it does", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Plain-language control descriptions (shuffled)<\/div><pre class=\"log\" data-hl=\"1\"> a. Scans and quarantines known malicious files\n b. Filters risky email and web content at the boundary\n c. Checks the message really comes from the domain it claims\n d. Limits what a user account may do<\/pre><\/div>", "scenarioSummary": "Four plain control descriptions to match to IDs", "question": "Match each mitigation ID to the description of its job.", "data": {"pairs": [["M1049 Antivirus/Antimalware", "Scans and quarantines known malicious files"], ["M1021 Restrict Web-Based Content", "Filters risky email and web content at the boundary"], ["M1054 Software Configuration", "Checks the message really comes from the domain it claims (SPF and DKIM)"], ["M1018 User Account Management", "Limits what a user account may do"]]}, "hint": "One control lives on the endpoint, one at the mail boundary, one on the sender&rsquo;s identity, one on accounts.", "explain": "<p><b>M1049<\/b> is the scanner on the machine. <b>M1021<\/b> is the filter at the mail and web boundary &mdash; it can strip dangerous attachment types before they arrive. <b>M1054<\/b> is the sender-identity check the page describes for this technique: SPF confirms the sending domain is real, and DKIM confirms the message was not changed on the way &mdash; so a spoofed &ldquo;billing&rdquo; address is far less likely to reach the inbox. <b>M1018<\/b> limits accounts, so a successful open does less damage. All four appear on the T1566.001 page because each one breaks a different step of this attack.<\/p>", "study": "The mitigation table on the T1566.001 ATT&CK page, in plain words."}]};
</script>
<script>

(function(){
"use strict";
var E = window.EXAM;                       // {meta, themes, introHtml, exercises}
var EXS = E.exercises;
var $ = function(s, el){ return (el||document).querySelector(s); };
var app;

/* ---------- utils ---------- */
function shuffle(arr){ var a=arr.slice(),i,j,t; for(i=a.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function el(tag, cls, html){ var d=document.createElement(tag); if(cls) d.className=cls; if(html!=null) d.innerHTML=html; return d; }
var RT = {};   // per-exercise runtime widget state, keyed by exercise id
function hlPass(root){ [].forEach.call(root.querySelectorAll("pre.log[data-hl]"), function(p){ p.innerHTML=hlLog(p.textContent); }); }
function ncmd(s){ return String(s==null?"":s).replace(/[\u2018\u2019\u201c\u201d]/g,"'").replace(/"/g,"").replace(/\s+/g," ").trim().replace(/[.]+$/,""); }
function normPair(input, accepted, mode, caseSensitive){
  function base(x){ x=ncmd(x); if(!caseSensitive) x=x.toLowerCase(); return x; }
  function fmt(x){ x=base(x); if(mode==="tokens"){ var t=x.split(" "); return t.sort().join(" "); } return x; }
  var a=fmt(input);
  for(var i=0;i<accepted.length;i++){ if(fmt(accepted[i])===a) return true; }
  return false;
}
var KW = ["PASS","BLOCK","DELIVER","PROC_START","FILE_CREATE","NET_FLOW","NET","MAIL_RECV","DROP","QUAR","OPEN","EXEC"];
function hlLog(line){
  var s = esc(line);
  s = s.replace(/\b(PASS|DELIVER|OK|CLEAN)\b/g,'<span class="ok">$1</span>');
  s = s.replace(/\b(BLOCK|QUAR|DENY|DROP)\b/g,'<span class="no">$1</span>');
  KW.forEach(function(k){ s = s.replace(new RegExp("\\b"+k+"\\b","g"), '<span class="kw">'+k+'</span>'); });
  s = s.replace(/\b\d{1,3}[\[].][]\d{1,3}[\].][\d[\].]{3,}\b/g, function(m){ return '<span class="ip">'+m+'</span>'; });
  s = s.replace(/\b[\w.-]+\.(docm|docx|exe|iso|img|rar|zip|pdf|lnk|chm|hta|scr|xls|xlsx|xlsm|rtf|hwp|vbs|js|dotx|eml)\b/gi, function(m){ return '<span class="file">'+m+'</span>'; });
  return s;
}

/* ---------- state ---------- */
var S = {
  order: [], pos: 0, phase: "intro",
  ans: {},          // id -> {status, earned, your, correct, res}
  skipped: [],      // ids never answered
  timerLeft: E.timerSec, tInt: null, paused: false,
  reported: false, userName: "", hintUsed: {}, exPts: {}
};
EXS.forEach(function(ex){ S.exPts[ex.id] = ex.points || 10; });

function badgeFor(){ return E.meta.difficulty; }
function badgeText(){ return E.difficultyLabel || E.meta.difficultyLabel; }

/* ---------- scoring ---------- */
function answeredIds(){ return EXS.filter(function(ex){ var a=S.ans[ex.id]; return a && (a.status==="correct"||a.status==="incorrect"||a.status==="partial"); }); }
function earnedPts(){ var n=0; answeredIds().forEach(function(ex){ n+=S.ans[ex.id].earned; }); return n; }
function maxPts(){ var n=0; answeredIds().forEach(function(ex){ n+=S.exPts[ex.id]; }); return n; }
function pct(){ var m=maxPts(); return m>0? Math.round(earnedPts()/m*100):0; }

/* ---------- header ---------- */
function buildHeader(){
  var h = el("div","hdr");
  h.innerHTML =
    '<span id="h-count" class="muted small"></span>' +
    '<span class="badge '+badgeFor()+'">['+esc(badgeText())+']</span>' +
    '<span id="h-theme" class="muted small" style="display:none"></span>' +
    '<span class="grow"></span>' +
    '<span class="timer" id="h-timer" role="timer" aria-label="Time remaining">--:--</span>' +
    '<button class="btn" id="h-pause" aria-label="Pause timer">&#9208; Pause</button>' +
    '<span class="score" id="h-score">0 pts &middot; 0%</span>' +
    '<button class="btn" id="h-hint" aria-label="Show hint for minus 10 percent">&#9432; Hint &minus;10%</button>' +
    '<button class="btn" id="h-skip" aria-label="Skip this exercise">&#9193; Skip</button>' +
    '<button class="btn" id="h-rev" aria-label="Review skipped exercises" style="display:none">&#8635; Skipped <span id="h-revn">0</span></button>';
  $("#h-pause",h).addEventListener("click", pauseExam);
  $("#h-hint",h).addEventListener("click", useHint);
  $("#h-skip",h).addEventListener("click", skipCurrent);
  $("#h-rev",h).addEventListener("click", openReview);
  return h;
}
function updHeader(){
  var t=$("#h-timer"), m=Math.floor(S.timerLeft/60), s=S.timerLeft%60;
  if(t){ t.textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s; t.className="timer"+(S.timerLeft<300?" low":""); }
  var sc=$("#h-score"); if(sc){ var p=pct(); sc.textContent = earnedPts()+" pts \u00b7 "+p+"%"; sc.setAttribute("aria-label","Live score "+earnedPts()+" points, "+p+" percent"); }
  var rev=$("#h-rev"); if(rev){ rev.style.display = (S.skipped.length && S.phase!=="results")? "":"none"; var rn=$("#h-revn"); if(rn) rn.textContent=S.skipped.length; }
  var pa=$("#h-pause"); if(pa){ pa.disabled = (S.phase!=="exam"); }
  var hint=$("#h-hint"); if(hint){ var ex=EXS[S.order[S.pos]]; var dis = (S.phase!=="exam") || !ex || S.hintUsed[ex.id] || (S.ans[ex.id]&&S.ans[ex.id].status!=="skipped"); hint.disabled=dis; }
  var sk=$("#h-skip"); if(sk){ var cu=EXS[S.order[S.pos]]; var ca=cu? S.ans[cu.id]:null; sk.disabled = (S.phase!=="exam") || (ca && ca.status!=="skipped" && ca.status!=="skipped-never"); }
  var hc=$("#h-count"); if(hc){ hc.textContent = S.phase==="exam"? ("Exercise "+(S.pos+1)+" of "+EXS.length) : (S.phase==="review"? "Review skipped exercises" : ""); }
}

/* ---------- timer ---------- */
function tick(){
  if(S.paused) return;
  S.timerLeft--;
  if(S.timerLeft<=0){ S.timerLeft=0; stopTimer(); timeUp(); return; }
  updHeader();
}
function startTimer(){ stopTimer(); S.tInt=setInterval(tick,1000); }
function stopTimer(){ if(S.tInt){ clearInterval(S.tInt); S.tInt=null; } }
function pauseExam(){
  if(S.phase!=="exam" || S.paused) return;
  S.paused=true; stopTimer();
  var v=el("div","veil");
  v.innerHTML='<h2>&#9208; Exam paused</h2><p class="muted">The timer is stopped and the exercise is hidden,<br>so nobody can read ahead while paused.</p>';
  var b=el("button","btn primary","&#9654; Resume"); b.addEventListener("click",function(){ S.paused=false; v.remove(); startTimer(); b.focus(); });
  v.appendChild(b); document.body.appendChild(v);
}
function timeUp(){
  EXS.forEach(function(ex){
    var a=S.ans[ex.id];
    if(!a || a.status==="skipped"){ S.ans[ex.id]={status:"skipped-never", earned:0}; }
  });
  showResults(true);
}

/* ---------- hint ---------- */
function useHint(){
  if(S.phase!=="exam") return;
  var ex=EXS[S.order[S.pos]]; if(!ex || S.hintUsed[ex.id]) return;
  S.hintUsed[ex.id]=true;
  var box=$("#hint-slot");
  if(box){ box.style.display=""; box.innerHTML='<div class="hintbox"><b>HINT (&minus;10% of this exercise):</b> '+ex.hint+'</div>'; }
  updHeader();
}

/* ---------- intro ---------- */
function introView(){
  S.phase="intro";
  app.innerHTML="";
  app.appendChild(buildHeader());
  var c=el("div","card intro-expl");
  c.innerHTML =
    '<h1 class="bigtitle">'+esc(E.meta.title)+'</h1>' +
    '<p class="subtitle">'+esc(E.subtitle||"")+'</p>' +
    '<div class="meta-chips">' +
      '<span class="mchip"><b>'+E.exercises.length+'</b> exercises</span>' +
      '<span class="mchip">Timer <b>'+E.meta.estimatedMinutes+' min</b> (pausable)</span>' +
      '<span class="mchip">Pass mark <b>'+E.meta.passMark+'%</b></span>' +
      '<span class="mchip">Tier <b>'+E.meta.batch+' of 4</b></span>' +
      '<span class="mchip">Object type: <b>Sub-Technique</b></span>' +
      '<span class="mchip">ID: <b>T1566.001</b> &middot; Tactic: <b>Initial Access (TA0001)</b></span>' +
    '</div>' +
    '<div class="blk blk-scenario"><div class="blk-label">&#9432; About this ATT&amp;CK object</div>' + E.introExpl + '</div>' +
    '<div class="blk blk-answer"><div class="blk-label">&#127991; Keywords covered in this topic (all four tiers)</div>' + E.introThemes + '<p class="small muted" style="margin-bottom:0">The four tier files of this topic share these themes. Each tier exercises them at its own depth.</p></div>' +
    '<div class="blk blk-question"><div class="blk-label">&#9881; How this exam works</div>' + E.introRules + '</div>' +
    '<div class="row2"><button class="btn primary" id="start-btn" style="min-width:220px">&#9654; Start the exam</button></div>';
  $("#start-btn",c).addEventListener("click", startExam);
  app.appendChild(c);
  updHeader();
}

/* ---------- exam flow ---------- */
function startExam(){
  S.order = shuffle(EXS.map(function(e,i){ return i; }));
  S.pos=0; S.phase="exam"; S.ans={}; S.skipped=[]; S.reported=false;
  S.timerLeft = E.timerSec; S.paused=false; S.hintUsed={};
  for(var k in RT){ if(Object.prototype.hasOwnProperty.call(RT,k)) delete RT[k]; }
  examView();
}
function examView(){
  S.phase="exam";
  app.innerHTML="";
  app.appendChild(buildHeader());
  var main=el("div"); main.id="exam-main"; app.appendChild(main);
  renderCurrent();
  startTimer();
}
function renderCurrent(){
  var ex=EXS[S.order[S.pos]];
  var m=$("#exam-main"); m.innerHTML="";
  var prog=Math.round((S.pos)/EXS.length*100);
  m.appendChild(el("div","pbar",'<i style="width:'+prog+'%"></i>'));
  var wrap=el("div","card");
  wrap.appendChild(el("div",null,'<div class="meta-chips" style="margin-top:0"><span class="mchip">Exercise <b>'+(S.pos+1)+' of '+EXS.length+'</b></span><span class="mchip">Theme: <b>'+esc(E.themes[ex.theme].name)+'</b></span><span class="mchip">'+esc(ex.points)+' points</span></div>'));
  wrap.appendChild(el("h3",null,'<span class="muted small">'+esc(ex.typeLabel)+' &nbsp;&middot;&nbsp; </span>'+esc(ex.title)));

  var sc=el("div","blk blk-scenario");
  sc.innerHTML='<div class="blk-label">&#128220; SCENARIO <button type="button" class="collapse-btn" id="sc-toggle">Collapse</button></div>' +
               '<div class="sc-summary" id="sc-summary">'+esc(ex.scenarioSummary)+'</div>' +
               '<div class="sc-body" id="sc-body">'+ex.scenario+'</div>';
  wrap.appendChild(sc);
  var long = ex.scenario.length>700;
  if(long){
    var tog=$("#sc-toggle",sc), shown=true;
    tog.addEventListener("click",function(){
      shown=!shown;
      tog.textContent= shown? "Collapse":"Expand";
      $("#sc-body",sc).style.display = shown? "":"none";
      $("#sc-summary",sc).style.display = shown? "none":"";
    });
  } else { $("#sc-toggle",sc).style.display="none"; }

  wrap.appendChild(el("div","blk blk-question",'<div class="blk-label">&#10067; QUESTION</div><div class="q-text">'+esc(ex.question)+'</div>'));

  var an=el("div","blk blk-answer");
  an.innerHTML='<div class="blk-label">&#9997; YOUR ANSWER</div><div id="hint-slot" style="display:none"></div><div id="widget"></div><div id="ctl" class="row2"></div><div id="fb"></div>';
  wrap.appendChild(an);
  m.appendChild(wrap);

  hlPass(m);
  var widget = buildWidget(ex);
  $("#widget",an).appendChild(widget.el);
  var a=S.ans[ex.id];
  var isSkipped = a && (a.status==="skipped"||a.status==="skipped-never");
  var sub=el("button","btn primary", isSkipped? "&#9998; Answer this exercise" : "&#10004; Submit answer"); sub.id="sub-btn";
  if(isSkipped){
    $("#fb",an).innerHTML='<div class="fb partial"><h4>&#9888; SKIPPED &mdash; NOT ANSWERED</h4><p class="why">You skipped this exercise. It will not be scored unless you answer it now.</p></div>';
    sub.addEventListener("click", function(){ delete S.ans[ex.id]; delete RT[ex.id]; var i=S.skipped.indexOf(ex.id); if(i>=0) S.skipped.splice(i,1); renderCurrent(); });
  } else {
    sub.addEventListener("click", function(){ submitAnswer(ex, widget); });
    if(a && (a.status==="correct"||a.status==="partial"||a.status==="incorrect")){
      sub.disabled=true; widget.lock(a); showFeedback(ex,a);
    }
  }
  $("#ctl",an).appendChild(sub);
  updHeader();
  window.scrollTo(0,0);
}
function submitAnswer(ex, widget){
  var res = widget.grade();
  if(res && res.pending){
    var f0=$("#fb");
    if(f0) f0.innerHTML='<div class="fb partial"><h4>&#9888; NOT FINISHED</h4><p class="why">'+(res.pendingMsg||"Answer the exercise first, then press Submit.")+'</p></div>';
    return;
  }
  if(!res) return;
  var cost = Math.max(1, Math.round((ex.points||10)*0.1));   /* hint = minus 10% of this exercise */
  var hint = S.hintUsed[ex.id]? cost:0;
  var earned;
  if(res.ok) earned = Math.max(0,(ex.points||10)-hint);
  else if(res.ratio>0) earned = Math.max(0, Math.round((ex.points||10)*res.ratio)-hint);
  else earned = 0;
  var status = res.ok? "correct" : (res.ratio>0 && res.ratio<1? "partial":"incorrect");
  var a = S.ans[ex.id] = {status:status, earned:earned, your:res.your||"", correct:res.correct||"", res:res};
  var sub=$("#sub-btn"); if(sub) sub.disabled=true;
  widget.lock && widget.lock(a);
  showFeedback(ex,a);
  updHeader();
}
function showFeedback(ex, a){
  var fb=$("#fb"); if(!fb) return;
  var heads={
    correct:'<h4><span aria-hidden="true">&#10004;</span> <span class="fb-title">CORRECT</span></h4>',
    incorrect:'<h4><span aria-hidden="true">&#10008;</span> <span class="fb-title">INCORRECT</span></h4>',
    partial:'<h4><span aria-hidden="true">&#9680;</span> <span class="fb-title">PARTIAL &mdash; '+Math.round((a.res.ratio||0)*(ex.points||10))+' of '+(ex.points||10)+' points</span></h4>'
  };
  var h='<div class="fb '+a.status+'" role="status">'+heads[a.status];
  if(a.correct) h+='<p class="why"><b>Correct answer:</b> '+a.correct+'</p>';
  if(a.your) h+='<p class="why"><b>Your answer:</b> '+a.your+'</p>';
  h+='<p class="why">'+ex.explain+'</p>';
  if(a.status!=="correct" && ex.study) h+='<div class="study"><b>What to study:</b> '+ex.study+'</div>';
  if(ex.persp) h+='<div class="persp"><b>Attacker view:</b> '+ex.persp.atk+'<br><b>Defender view:</b> '+ex.persp.def+'</div>';
  h+='<p class="small muted" style="margin:8px 0 0">Points for this exercise: <b>'+a.earned+' / '+(ex.points||10)+'</b>'+(S.hintUsed[ex.id]?" (includes &minus;10% hint cost)":"")+'</p></div>';
  fb.innerHTML=h;
  var nx = (S.pos < EXS.length-1)? 'Next exercise':'Continue';
  var b=el("button","btn primary", nx+" &#9193;");
  b.addEventListener("click", nextEx);
  fb.appendChild(b);
}
function nextEx(){
  if(S.pos < EXS.length-1){ S.pos++; renderCurrent(); }
  else if(S.skipped.length){ openReview(); }
  else { showResults(false); }
}
function skipCurrent(){
  if(S.phase!=="exam") return;
  var ex=EXS[S.order[S.pos]];
  var a=S.ans[ex.id];
  if(a && a.status!=="skipped" && a.status!=="skipped-never") return; // already answered: Skip disabled
  S.ans[ex.id]={status:"skipped", earned:0};
  if(S.skipped.indexOf(ex.id)<0) S.skipped.push(ex.id);
  nextEx();
}

/* ---------- review skipped ---------- */
function openReview(){
  S.phase="review";
  app.innerHTML="";
  app.appendChild(buildHeader());
  var m=el("div","card");
  m.innerHTML='<h2 class="bigtitle" style="font-size:22px">&#8635; Review skipped exercises</h2>' +
    '<p class="muted">These exercises were skipped and never answered. Return to any of them and answer it while the timer still runs. If you finish the exam with skipped exercises left, they are <b>excluded from the score</b> &mdash; they count neither as correct nor as wrong.</p>';
  if(!S.skipped.length){
    m.appendChild(el("p",null,'<i class="muted">Nothing skipped &mdash; well done.</i>'));
  }
  S.skipped.forEach(function(id){
    var ex=EXS[S.order.filter(function(i){ return EXS[i].id===id; })[0]];
    var card=el("div","rev-card");
    card.innerHTML='<div><b>'+esc(ex.title)+'</b><div class="small muted">'+esc(ex.scenarioSummary)+'</div></div>';
    var b=el("button","btn","&#9998; Answer this");
    b.addEventListener("click", function(){ S.pos=S.order.indexOf(EXS.indexOf(ex)); S.phase="exam"; examViewAt(); });
    card.appendChild(b); m.appendChild(card);
  });
  var fin=el("button","btn primary","&#127937; Finish exam");
  fin.style.marginTop="10px";
  fin.addEventListener("click", function(){ showResults(false); });
  m.appendChild(fin);
  var back=el("button","btn","&#8592; Back");
  back.style.marginLeft="8px";
  back.addEventListener("click", function(){ S.pos=Math.max(0,S.pos); S.phase="exam"; examViewAt(); });
  m.appendChild(back);
  app.appendChild(m);
  updHeader();
}
function examViewAt(){ examView(); }


/* ---------- results ---------- */
function showResults(timeUpFlag){
  stopTimer(); S.phase="results";
  var answered=answeredIds(), earned=earnedPts(), maxp=maxPts();
  var percent = maxp>0? Math.round(earned/maxp*100):0;
  var passed = percent>=E.meta.passMark && maxp>0;
  var nCorrect=0,nWrong=0,nPart=0;
  answered.forEach(function(ex){ var st=S.ans[ex.id].status; if(st==="correct")nCorrect++; else if(st==="partial")nPart++; else nWrong++; });
  var nSkipNever=EXS.filter(function(ex){ var a=S.ans[ex.id]; return !a || a.status==="skipped-never" || a.status==="skipped"; }).length;

  app.innerHTML="";
  app.appendChild(buildHeader());
  var c=el("div","card");

function reportScore(correct,total){

}

/* ---------- widget: steps (decision tree) ---------- */
function wSTEPS(ex, rt){
  var st={ step: (rt&&rt.stepDone)? rt.stepDone.length:0, done:(rt&&rt.stepDone)? rt.stepDone.slice():[], picks:(rt&&rt.picks)?rt.picks:[] };
  var box=el("div");
  function renderStep(){
    box.innerHTML="";
    var n=ex.data.steps.length, i=st.step;
    var sd=ex.data.steps[i];
    var tag=el("div","steptag","STEP "+(i+1)+" OF "+n);
    box.appendChild(tag);
    if(sd.scenario) box.appendChild(el("div","artefact",'<div class="artefact-label">SCENARIO UPDATE</div>'+sd.scenario));
    var opts=el("div","opts"); var sel=-1;
    var sh=shuffle(sd.options.map(function(t,k){ return {t:t,i:k}; }));
    sh.forEach(function(o,k){
      var b=el("button","opt",' <span class="lbl">'+String.fromCharCode(65+k)+'.</span><span>'+o.t+'</span>');
      b.type="button";
      b.addEventListener("click",function(){ if(rt&&rt.locked) return; sel=o.i; [].forEach.call(opts.children,function(c){c.classList.remove("sel");}); b.classList.add("sel"); });
      opts.appendChild(b);
    });
    box.appendChild(opts);
    var ctl=el("div","row2");
    var sb=el("button","btn primary","&#10004; Submit step "+(i+1));
    sb.addEventListener("click",function(){
      if(sel<0) return;
      var good = sel===sd.answer;
      st.picks[i]=sel; st.done[i]=good; st.step=i+1;
      var mr=el("div","minires "+(good?"good":"bad"),(good?"&#10004; Correct for this step.":"&#10008; Not the best choice for this step.")+' <span class="small">'+sd.explain+'</span>');
      sb.disabled=true; [].forEach.call(opts.children,function(c){c.disabled=true;});
      box.appendChild(mr);
      var nb=el("button","btn primary",(i+1<n? "&#9193; Next step": "&#9193; Finish exercise"));
      nb.style.marginLeft="8px";
      nb.addEventListener("click", function(){ if(i+1<n) renderStep(); else finish(); });
      ctl.innerHTML=""; ctl.appendChild(nb);
    });
    ctl.appendChild(sb); box.appendChild(ctl);
  }
  function finish(){ /* handled by grade + feedback */ }
  if(st.step>=ex.data.steps.length){
    /* widget rebuilt after answering: show a compact summary instead of an empty box */
    var sum=el("div","small muted");
    var rows=ex.data.steps.map(function(s,i){
      var good=!!st.done[i];
      return '<div>'+(good? "&#10003;" : "&#10002;")+' Step '+(i+1)+': '+(good?"correct":"not the best choice")+'</div>';
    }).join("");
    sum.innerHTML='<div class="steptag">SCENARIO COMPLETED</div>'+rows;
    box.appendChild(sum);
  }
  else renderStep();
  var ratio=0;
  return {
    el:box,
    grade:function(){
      if(st.step < ex.data.steps.length) return {pending:true, pendingMsg:"Work through every step of this scenario, then press Submit."};
      var n=ex.data.steps.length, ok=0;
      for(var i=0;i<n;i++){ if(st.done[i]) ok++; }
      ratio = ok/n;
      var your = st.picks.map(function(p,i){ return "Step "+(i+1)+": "+esc(ex.data.steps[i].options[p]); }).join(" &middot; ");
      var corr = ex.data.steps.map(function(s,i){ return "Step "+(i+1)+": "+esc(s.options[s.answer]); }).join(" &middot; ");
      return { ok: ok===n, ratio:ratio, your:your, correct:corr };
    },
    lock:function(a){ rt.locked=true; }
  };
}

/* ---------- widget: drag & drop (zones) ---------- */
function wDRAG(ex, rt){
  var st={ placed:{}, sel:null, items:shuffle(ex.data.items.map(function(t,i){ return {t:t.t,i:i,tip:t.tip}; })) };
  var box=el("div");
  var bank=el("div","bank"); bank.setAttribute("aria-label","Item bank");
  var zones=el("div","zones");
  function chipFor(o, inZone, zoneIdx){
    var c=el("button","chip",esc(o.t)); c.type="button"; c.draggable=true;
    c.setAttribute("aria-label", (inZone? "In zone: move item ":"Item: place ")+o.t);
    c.addEventListener("click",function(){
      if(rt&&rt.locked) return;
      if(inZone){ // return to bank
        delete st.placed[o.i]; st.sel=null; draw();
      } else {
        if(st.sel===o.i){ st.sel=null; } else st.sel=o.i;
        draw();
      }
    });
    c.addEventListener("dragstart",function(ev){ ev.dataTransfer.setData("text/plain", String(o.i)); });
    return c;
  }
  function draw(){
    bank.innerHTML=""; zones.innerHTML="";
    st.items.forEach(function(o){
      if(st.placed[o.i]===undefined) bank.appendChild(chipFor(o,false,null));
    });
    ex.data.zones.forEach(function(z,zi){
      var zd=el("div","zone"); zd.setAttribute("data-zone",zi);
      zd.innerHTML="<h5>"+esc(z.name)+"</h5>";
      st.items.forEach(function(o){
        if(st.placed[o.i]===zi){ var holder=el("div","zitem"); holder.appendChild(chipFor(o,true,zi)); zd.appendChild(holder); }
      });
      zd.addEventListener("click",function(ev){
        if(rt&&rt.locked) return;
        if(ev.target!==zd && ev.target.parentNode!==zd && ev.target.tagName!=="H5") return;
        if(st.sel!=null){ st.placed[st.sel]=zi; st.sel=null; draw(); }
      });
      zd.addEventListener("dragover",function(ev){ ev.preventDefault(); zd.classList.add("over"); });
      zd.addEventListener("dragleave",function(){ zd.classList.remove("over"); });
      zd.addEventListener("drop",function(ev){ ev.preventDefault(); zd.classList.remove("over"); if(rt&&rt.locked) return; var id=parseInt(ev.dataTransfer.getData("text/plain"),10); if(!isNaN(id)){ st.placed[id]=zi; draw(); } });
      zones.appendChild(zd);
    });
  }
  draw();
  box.appendChild(el("p","small muted","Tap an item, then tap the zone. Drag and drop also works."));
  box.appendChild(el("div",null,'<b class="small">Items:</b>'));
  box.appendChild(bank);
  box.appendChild(el("div",null,'<b class="small">Zones:</b>'));
  box.appendChild(zones);
  function state(){ var r={}; Object.keys(st.placed).forEach(function(k){ r[k]=st.placed[k]; }); return r; }
  return {
    el:box,
    grade:function(){
      var n=ex.data.items.length;
      if(Object.keys(st.placed).length<n) return {pending:true, pendingMsg:"Place every item into a zone first."};
      var okAll=true;
      for(var i=0;i<n;i++){ var want=-1; for(var z=0;z<ex.data.zones.length;z++){ if(ex.data.zones[z].items.indexOf(i)>=0) want=z; }
        if(st.placed[i]!==want) okAll=false; }
      var your=ex.data.items.map(function(o,i){ return o.t+" &rarr; "+(st.placed[i]!==undefined? esc(ex.data.zones[st.placed[i]].name):"bank"); }).join("; ");
      var corr=ex.data.items.map(function(o,i){ var w=ex.data.zones.filter(function(z){ return z.items.indexOf(i)>=0; })[0]; return o.t+" &rarr; "+esc(w.name); }).join("; ");
      return { ok:okAll, ratio: okAll?1:0, your:your, correct:corr };
    },
    lock:function(){ rt.locked=true; draw(); [].forEach.call(box.querySelectorAll("button"),function(b){ b.disabled=true; }); }
  };
}

/* ---------- widget: fill the blanks ---------- */

  };

/* ---------- copy helper (copyable code blocks) ---------- */
function copyCode(txt, btn){
  function done(ok){ if(!btn) return; var old=btn.getAttribute("data-old")||btn.textContent; btn.setAttribute("data-old",old); btn.textContent = ok? "\u2713 Copied":"\u2717 Copy failed"; setTimeout(function(){ btn.textContent=old; },1400); }
  function apiCopy(){
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){ done(true); }, function(){ done(false); });
        return true;
      }
    }catch(e){ /* fall through */ }
    return false;
  }
  /* 1st: synchronous execCommand inside the click gesture (works on file:// and http) */
  try{
    var ta=document.createElement("textarea"); ta.value=txt; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.top="0"; ta.style.left="0"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
    var ok=document.execCommand("copy"); ta.remove();
    if(ok){ done(true); return; }
  }catch(e){ /* fall through */ }
  if(!apiCopy()){ done(false); }
}
window.copyCode = copyCode;   /* used by inline Copy buttons in terminal feedback */

/* ---------- widget: terminal ---------- */
function wTERM(ex, rt){
  var st={ hist:[], attempts:(rt&&rt.attempts)||0, done:false };
  var d=ex.data;
  var box=el("div");
  var subIv=null;
  if(d.subTimer){
    var stl=el("span","subtimer","&#9201; Exercise limit: "+Math.floor(d.subTimer/60)+":"+((d.subTimer%60)<10?"0":"")+(d.subTimer%60));
    box.appendChild(el("div",null,'<b>Reduced time limit for this exercise.</b> ')).appendChild(stl);
    var left=d.subTimer;
    subIv=setInterval(function(){
      if(!box.isConnected){ clearInterval(subIv); return; }   /* exercise left the screen: stop the clock */
      left--; if(stl.parentNode){ stl.textContent="&#9201; Exercise limit: "+Math.floor(left/60)+":"+((left%60)<10?"0":"")+(left%60); }
      if(left<=0){ clearInterval(subIv); subIv=null; if(!st.done){ st.done=true; st.forcedFail=true; var sbx=$("#sub-btn"); if(sbx && !sbx.disabled && box.isConnected) sbx.click(); } }
    },1000);
  }
  if(d.banner) box.appendChild(el("pre","cmd",esc(d.banner)));
  if(d.syntax) box.appendChild(el("div","synt",d.syntax));
  if(d.expect) box.appendChild(el("div","synt",d.expect));
  var scr=el("div","term-scroll");
  var term=el("div","term"); term.appendChild(scr);
  var row=el("div","term-in");
  var ps=el("span","ps",esc(d.prompt||"$"));
  var inp=el("input"); inp.type="text"; inp.autocomplete="off"; inp.spellcheck=false;
  inp.setAttribute("aria-label","Type the command");
  row.appendChild(ps); row.appendChild(inp);
  var run=el("button","btn primary","&#9654; Run"); run.type="button";
  row.appendChild(run);
  term.appendChild(row);
  box.appendChild(term);
  function print(s){ var l=el("div",null,esc(s)); scr.appendChild(l); scr.scrollTop=scr.scrollHeight; }
  (d.motd||[]).forEach(print);
  function runCmd(){
    if(st.done || (rt&&rt.locked)) return;
    var v=inp.value; inp.value="";
    print((d.prompt||"$")+" "+v);
    if(!v.trim()){ print("(type a command)"); return; }
    st.attempts++;
    if(normPair(v, d.accepted, d.matchMode||"exact", !!d.caseSensitive)){
      print(d.output||"(command executed)");
      print(">> Looks right. Command accepted.");
      st.done=true;
      st.passed=true;
      if(rt) rt.passed=true;
      if(subIv){ clearInterval(subIv); subIv=null; }
      var sb0=$("#sub-btn"); if(sb0 && !sb0.disabled && box.isConnected) sb0.click();
    } else {
      if(d.danger && d.danger.some(function(x){ return ncmd(v).toLowerCase().indexOf(x.toLowerCase())>=0; })){
        print(">> STOP. This command would destroy or alter evidence. It is NOT accepted.");
      } else if(ncmd(v).indexOf(d.badHint||"@@")>=0 && d.badMsg){
        print(d.badMsg);
      } else {
        print((d.errText||"command not found or wrong syntax"));
      }
      if(st.attempts>=(d.maxAttempts||3)){
        st.done=true; print(">> Three attempts used. The canonical command is shown in the feedback below.");
        if(rt) rt.failed=true;
        var sb1=$("#sub-btn"); if(sb1 && !sb1.disabled) sb1.click();
      } else {
        print(">> Attempts used: "+st.attempts+" of "+(d.maxAttempts||3)+".");
      }
    }
  }
  run.addEventListener("click", runCmd);
  inp.addEventListener("keydown", function(ev){ if(ev.key==="Enter"){ ev.preventDefault(); runCmd(); } });
  return {
    el:box,
    grade:function(){
      if(st.attempts===0 && !st.forcedFail) return {pending:true, pendingMsg:"Run your command in the terminal first, then press Submit."};
      var ok = st.passed===true && !st.forcedFail;
      var cid="cmd-"+ex.id+"-"+Math.floor(Math.random()*1e6);
      var canon='<pre class="cmd" id="'+cid+'">'+esc(d.canonical)+'</pre>'+
        '<button type="button" class="btn copybtn" onclick="copyCode(document.getElementById(\''+cid+'\').textContent,this)">&#128203; Copy command</button>';
      var parts=d.canonicalParts.map(function(p){ return "<li><b>"+esc(p.p)+"</b> &mdash; "+esc(p.m)+"</li>"; }).join("");
      var correct=canon+"<ul class='small'>"+parts+"</ul>"+(d.dangerNote?'<p class="small" style="color:#ffb4b4">&#9888; '+d.dangerNote+'</p>':"");
      return { ok:ok, your: st.attempts? ("You ran "+st.attempts+" attempt(s). See the terminal transcript.") : "(no command run)", correct:correct };
    },
    lock:function(){ rt.locked=true; st.done=true; if(subIv){ clearInterval(subIv); subIv=null; } inp.disabled=true; run.disabled=true; }
  };
}

/* ---------- widget: log viewer ---------- */
function wLOG(ex, rt){
  var st={ sel:-1 };
  var box=el("div");
  var fl=el("input","logfilter"); fl.type="text"; fl.placeholder=ex.data.filterHint||"Filter lines (text match)"; fl.setAttribute("aria-label","Filter log lines");
  var list=el("div"); list.style.maxHeight="340px"; list.style.overflowY="auto"; list.style.border="1px solid var(--line)"; list.style.borderRadius="8px"; list.style.background="#0a0f1e"; list.style.padding="6px";
  function draw(q){
    list.innerHTML="";
    ex.data.logs.forEach(function(ln,i){
      if(q && ln.toLowerCase().indexOf(q.toLowerCase())<0) return;
      var b=el("button","logrow",hlLog(ln)); b.type="button";
      b.setAttribute("data-i",i);
      b.setAttribute("aria-label","Log line "+(i+1)+": select");
      b.addEventListener("click",function(){ if(rt&&rt.locked) return; st.sel=i; [].forEach.call(list.querySelectorAll(".logrow"),function(r){ r.classList.remove("sel"); }); b.classList.add("sel"); });
      list.appendChild(b);
    });
    if(!list.children.length) list.appendChild(el("div","muted small","No lines match the filter."));
  }
  draw("");
  fl.addEventListener("input",function(){ draw(fl.value.trim()); });
  box.appendChild(el("p","small muted","Click a line to select it. Use the filter box like in Kibana or Splunk."));
  box.appendChild(fl); box.appendChild(list);
  return {
    el:box,
    grade:function(){
      if(st.sel<0) return {pending:true, pendingMsg:"Click a log line to select it, then press Submit."};
      var ok = ex.data.targets.indexOf(st.sel)>=0;
      return { ok:ok, your: st.sel>=0? esc(ex.data.logs[st.sel]) : "(no line selected)", correct: ex.data.targets.map(function(i){ return esc(ex.data.logs[i]); }).join("<br>") };
    },
    lock:function(a){ rt.locked=true; [].forEach.call(list.querySelectorAll(".logrow"),function(b){ b.disabled=true; }); }
  };
}

/* ---------- widget factory ---------- */
function buildWidget(ex){
  var rt = RT[ex.id] || (RT[ex.id]={locked:false});
  var w;
  switch(ex.type){
    case "qcm": w=wQCM(ex,rt); break;
    case "multi": w=wMULTI(ex,rt); break;
    case "steps": w=wSTEPS(ex,rt); break;
    case "dragdrop": w=wDRAG(ex,rt); break;
    case "order": w=wORDER(ex,rt); break;
    case "match": w=wMATCH(ex,rt); break;
    case "fill": w=wFILL(ex,rt); break;
    case "terminal": w=wTERM(ex,rt); break;
    case "logview": w=wLOG(ex,rt); break;
    default: w=wQCM(ex,rt);
  }
  return w;
}

/* ---------- handshake ---------- */
window.addEventListener("message", function(event){
  if(!event.data) return;
  if(event.data.type!=="CYBERPULSE_INIT" && event.data.type!=="CYBERMASTERY_INIT") return;
  if(event.data.username) S.userName=String(event.data.username);
});

/* ---------- boot ---------- */
function boot(){
  app=$("#app");
  introView();
}
if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", boot); } else { boot(); }
})();
