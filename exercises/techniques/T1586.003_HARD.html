<style>

  --accent-amber:#e8b544;
  --accent-amber-dim:rgba(232,181,68,.12);
  --accent-green:#43c06a;
  --accent-green-dim:rgba(67,192,106,.12);
  --sev-easy:#43c06a;
  --sev-easy-dim:rgba(67,192,106,.12);
  --sev-medium:#e8b544;
  --sev-medium-dim:rgba(232,181,68,.12);
  --sev-hard:#f08a4b;
  --sev-hard-dim:rgba(240,138,75,.12);
  --sev-extreme:#f2635c;
  --sev-extreme-dim:rgba(242,99,92,.12);

  --ok-dim:rgba(67,192,106,.12);
  --bad:#f2635c;
  --bad-dim:rgba(242,99,92,.12);

  --term-cmd:#79b8ff;
  --term-out:#c9d6e8;

  --sans:-apple-system,'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-base);color:var(--text-1);font-family:var(--sans);font-size:16px;line-height:1.55}
.hidden{display:none!important}
#app{max-width:980px;margin:0 auto;padding:0 16px 60px}
h1{font-size:24px;margin:0 0 10px}

p{margin:8px 0}
button{font-family:var(--sans)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- persistent exam header ---------- */
#hdr{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--bg-base);border-bottom:1px solid var(--border);padding:10px 4px;margin:0 -16px 14px;padding-left:16px;padding-right:16px}
.hdr-left,.hdr-right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-weight:700;font-size:13px;color:var(--text-2)}
.hdr-counter{font-size:13px;font-weight:700;color:var(--text-1);background:var(--bg-surface-2);border:1px solid var(--border);border-radius:999px;padding:4px 12px}
.hdr-timer{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-weight:700;font-size:14px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:999px;padding:6px 14px}
#t-time.low{color:var(--sev-extreme)}
.ts-run{color:var(--accent-green)}
.ts-pman{color:var(--accent-amber)}
.ts-pauto{color:var(--accent-blue)}
.ts-end{color:var(--neutral)}
#t-state{font-family:var(--sans);font-size:12px;font-weight:700}
.hdr-score{font-weight:700;font-size:14px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:999px;padding:6px 14px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-surface-2);color:var(--text-1);font-size:14px;font-weight:700;cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent-blue)}
.btn.primary{border-color:var(--accent-green);background:var(--accent-green-dim)}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;min-width:44px;padding:6px 12px;font-size:13px}
.btn.big{min-height:52px;padding:12px 34px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.hintbtn{border-color:var(--accent-amber)}
.btn.skipbtn{border-color:var(--border-strong)}

/* ---------- intro ---------- */
.strip{background:var(--bg-surface-1);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-top:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-surface-2);border:1px solid var(--border-strong);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:700;color:var(--text-2)}
.i-sec{background:var(--bg-surface-1);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-top:16px}
.kw{display:flex;flex-wrap:wrap;gap:8px}
.kw-chip{display:inline-block;background:var(--bg-surface-2);border:1px solid var(--border-strong);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--text-2)}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;padding:3px 12px;border:1px solid;border-radius:999px;font-weight:800;font-size:12px;letter-spacing:.08em}
.badge.sev-easy{color:var(--sev-easy);border-color:var(--sev-easy);background:var(--sev-easy-dim)}
.badge.sev-medium{color:var(--sev-medium);border-color:var(--sev-medium);background:var(--sev-medium-dim)}
.badge.sev-hard{color:var(--sev-hard);border-color:var(--sev-hard);background:var(--sev-hard-dim)}
.badge.sev-extreme{color:var(--sev-extreme);border-color:var(--sev-extreme);background:var(--sev-extreme-dim)}

/* ---------- exercise card and fixed three-block accents ---------- */
.card{background:var(--bg-surface-1);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-top:6px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.block{border:1px solid var(--border);border-left:4px solid var(--b-accent);background:var(--bg-surface-2);border-radius:10px;padding:12px 16px;margin:12px 0}
.block-scenario{--b-accent:var(--accent-blue)}
.block-question{--b-accent:var(--accent-amber)}
.block-answer{--b-accent:var(--accent-green)}
.block-label{font-size:11px;letter-spacing:.14em;color:var(--b-accent);font-weight:800;margin-bottom:6px}
.block-body{color:var(--text-1)}
.block-body.collapsed{display:none}
.log{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:13px;color:var(--term-out);white-space:pre-wrap;overflow-x:auto;margin:8px 0}
.log .hi{color:var(--accent-blue);font-weight:700}
code{font-family:var(--mono);font-size:13px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:1px 6px;color:var(--term-out)}

/* ---------- options ---------- */
.opts{margin:4px 0}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;min-height:48px;border:1px solid var(--border);border-radius:10px;margin:8px 0;cursor:pointer;background:var(--bg-surface-1)}
.opt:hover{border-color:var(--border-strong)}
.opt.sel{border-color:var(--accent-green);background:var(--accent-green-dim)}
.opt input{margin-top:4px;accent-color:var(--accent-green);width:18px;height:18px;flex:none}
.opt-txt{flex:1}
.opt-b{display:block;width:100%;text-align:left;padding:12px 14px;min-height:48px;border:1px solid var(--border);border-radius:10px;margin:8px 0;cursor:pointer;background:var(--bg-surface-1);color:var(--text-1);font-size:15px}
.opt-b:hover{border-color:var(--border-strong)}
.opt-b.sel{border-color:var(--accent-green);background:var(--accent-green-dim)}

/* ---------- matching ---------- */
.pair{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin:8px 0;background:var(--bg-surface-1);flex-wrap:wrap}
.pair-l{flex:1;min-width:180px}
select{min-height:44px;background:var(--bg-surface-2);color:var(--text-1);border:1px solid var(--border-strong);border-radius:8px;padding:6px 10px;font-size:14px;max-width:100%}
option{color:var(--text-1);background:var(--bg-surface-2)}

/* ---------- drag and drop ---------- */
.dd{margin:4px 0}
.dd-bank{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;border:1px dashed var(--border-strong);border-radius:10px;padding:8px;margin-bottom:12px;cursor:pointer}
.dd-zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.dd-zone{border:1px solid var(--border-strong);border-radius:10px;padding:8px;min-height:104px;background:var(--bg-surface-1)}
.dd-zone.over{border-color:var(--accent-blue);background:var(--accent-blue-dim)}
.dd-zl{font-weight:800;color:var(--accent-blue);font-size:13px;margin-bottom:6px}
.dd-drop{display:flex;flex-direction:column;gap:6px;min-height:58px}
.dd-chip{display:block;width:100%;text-align:left;min-height:44px;padding:9px 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--bg-surface-2);color:var(--text-1);font-size:14px;cursor:grab}
.dd-chip.picked{border-color:var(--accent-amber);background:var(--accent-amber-dim)}

/* ---------- ordering ---------- */
.ord-row{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:6px 10px;margin:8px 0;background:var(--bg-surface-1)}
.ord-n{font-family:var(--mono);color:var(--text-3);min-width:22px;text-align:right}
.ord-t{flex:1}
.ord-btns{display:flex;gap:6px}

/* ---------- fill ---------- */
.fillhost{font-size:15px;line-height:2.2}
.fill-input{background:var(--bg-surface-2);border:1px solid var(--border-strong);border-bottom:2px solid var(--accent-green);border-radius:8px;color:var(--text-1);font-family:var(--mono);padding:8px 10px;min-height:44px;width:15ch;font-size:14px}

/* ---------- branching ---------- */
.b-path{margin:0 0 8px 18px;padding:0;color:var(--text-2);font-size:14px}
.b-step{color:var(--accent-amber);font-weight:700;font-size:13px;margin:6px 0}
.b-q{font-weight:700;margin:8px 0}

/* ---------- terminal ---------- */
.term-tasks{margin:4px 0 10px}
.task{font-size:14px;padding:4px 0;color:var(--text-2)}
.task.t-hit{color:var(--ok)}
.task.t-danger{color:var(--sev-hard);font-weight:700}
.term{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-family:var(--mono)}
.term-out{max-height:230px;overflow:auto;font-size:13px}
.t-line{white-space:pre-wrap;word-break:break-word;padding:1px 0}
.t-cmd{color:var(--term-cmd)}
.t-cmd::before{content:'$ ';color:var(--term-prompt)}
.t-out{color:var(--term-out)}
.t-err{color:var(--bad)}
.t-warn{color:var(--sev-hard);font-weight:700}
.t-note{color:var(--accent-amber)}
.t-ok{color:var(--ok)}
.term-line{display:flex;align-items:center;border-top:1px solid var(--border);margin-top:8px;padding-top:8px}
.term-prompt{color:var(--term-prompt);margin-right:8px;white-space:nowrap}
.term-in{flex:1;background:transparent;border:0;color:var(--text-1);font-family:var(--mono);min-height:32px;font-size:14px}
.term-in:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

/* ---------- hint, feedback ---------- */
.hintbox{border:1px solid var(--accent-amber);background:var(--accent-amber-dim);padding:10px 14px;border-radius:10px;margin-top:12px;color:var(--text-1)}
.feedback{border:1px solid var(--neutral);border-radius:10px;padding:14px 16px;margin-top:16px}
.f-correct{border-color:var(--ok);background:var(--ok-dim)}
.f-partial{border-color:var(--warn);background:var(--warn-dim)}
.f-incorrect{border-color:var(--bad);background:var(--bad-dim)}
.f-head{font-weight:800;font-size:16px}
.f-correct .f-head{color:var(--ok)}
.f-partial .f-head{color:var(--warn)}
.f-incorrect .f-head{color:var(--bad)}
.f-credit{font-family:var(--mono);font-size:14px;margin:6px 0;color:var(--text-1)}
.f-items{list-style:none;margin:8px 0;padding:0}
.f-items li{padding:3px 0;font-size:14px}
.it-hit{color:var(--ok)}
.it-wrong{color:var(--bad)}
.it-missed{color:var(--neutral)}
.f-explain{font-size:14px;color:var(--text-1);border-top:1px solid var(--border);margin-top:10px;padding-top:10px}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* ---------- paused card ---------- */
.pausecard{max-width:460px;margin:60px auto;background:var(--bg-surface-1);border:1px solid var(--accent-amber);border-radius:14px;padding:30px;text-align:center}
.pause-ic{font-size:40px;color:var(--accent-amber)}

/* ---------- review ---------- */
.r-row{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin:8px 0;background:var(--bg-surface-1)}
.r-lab{flex:1}

/* ---------- results ---------- */
.res-hero{text-align:center;background:var(--bg-surface-1);border:1px solid var(--border);border-radius:14px;padding:26px 20px;margin-top:18px}
.res-pct{font-size:52px;font-weight:800;font-family:var(--mono)}
.res-banner{display:inline-block;margin-top:10px;padding:8px 22px;border:1px solid;border-radius:999px;font-weight:800;letter-spacing:.06em}
.res-banner.pass{color:var(--ok);border-color:var(--ok);background:var(--ok-dim)}
.res-banner.fail{color:var(--bad);border-color:var(--bad);background:var(--bad-dim)}
.res-note{color:var(--text-2);font-size:14px;margin-top:10px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:14px}
.res-box{background:var(--bg-surface-1);border:1px solid var(--border);border-radius:12px;padding:12px 16px}
.res-box b{display:block;font-size:22px}
.res-box.ok b{color:var(--ok)}
.res-box.warn b{color:var(--warn)}
.res-box.bad b{color:var(--bad)}
.res-box.neu b{color:var(--neutral)}
.res-lab{color:var(--text-2);font-size:13px}
.res-list{margin-top:14px}
.res-row{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:8px 14px;margin:6px 0;background:var(--bg-surface-1);font-size:14px;flex-wrap:wrap}
.res-state{font-weight:700;white-space:nowrap}
.res-cred{font-family:var(--mono);color:var(--text-2)}
.res-pause{margin-top:14px;font-size:13px;color:var(--text-2);background:var(--bg-surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-family:var(--mono)}

/* ---------- responsive ---------- */
@media (max-width:720px){
  #app{padding:0 10px 50px}
  .card{padding:12px}
  #hdr{margin:0 -10px 12px;padding-left:10px;padding-right:10px}
  .hdr-title{display:none}
  .res-pct{font-size:40px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

<script id="cm-exercise-meta" type="application/json">{"topicId":"t1586.003","batch":3,"difficulty":"hard","passMark":70,"questionCount":15,"estimatedMinutes":35}</script>
<script id="exam-data" type="application/json">{"config":{"title":"T1586.003 HARD exam - Compromise Accounts: Cloud Accounts","sevName":"HARD","passMark":70,"estimatedMinutes":35,"budgetSeconds":2100,"introLearn":["T1586.003 is a <b>sub-technique<\/b> in the MITRE ATT&amp;CK framework: <b>Compromise Accounts: Cloud Accounts<\/b>, in the <b>Resource Development<\/b> tactic. This HARD exam works with realistic attack and defence scenarios, so you should already know the basics: phishing, MFA fatigue, session cookies, access keys and CloudTrail.","You will work through realistic procedures: a red-team path into a SaaS company through a leaked CI service account, a SIM swap that beats SMS codes, and hands-on log work with a simulated AWS terminal (list access keys, look up CloudTrail events). On the defender side you tune impossible-travel alerts, match services to their jobs, run the triage order for a compromised admin, and pick the least aggressive attacker choice to understand cost-of-action.","New ideas appear with short definitions: number matching, OAuth refresh tokens, billing anomalies, and canonical commands (the exact command a professional would run). Everything else builds on what you practised in the EASY and MEDIUM exams."],"keywords":["MFA fatigue","SIM swap","consent phishing","OAuth refresh token","IAM user","access key ID","secret access key","CloudTrail lookup-events","GuardDuty","number matching","impossible travel tuning","billing anomaly","least-aggressive action","canonical command","CI service account"],"introHow":["<b>Passing score.<\/b> You need 70% or more to pass. Each exercise gives 1 point. Exercises with several correct parts give part marks.","<b>Exercise types.<\/b> Single-choice, multi-select, matching, drag-and-drop, ordering, fill-in-the-blank, a branching decision path, and one terminal exercise with a simulated AWS shell.","<b>Timer.<\/b> Your budget is 40 minutes. Press <b>Pause<\/b> to stop the clock at any time. When you press <b>Check<\/b>, the clock stops by itself while you read the feedback, and starts again on Next. Hint and Skip never stop the clock. In the branching exercise, the Continue buttons between steps do not stop the clock either.","<b>Scoring.<\/b> Multi-part exercises give part marks: correct parts add, wrong picks subtract, never below zero. The terminal has two tasks, so you can earn half of its point. Using the Hint costs 10% of that exercise's credit.","<b>Skip.<\/b> Skipped exercises wait in a review screen at the end. Exercises you never answer are not counted in your score.","Press Start when you are ready. Take your time on the terminal: read the task list first."]},"exercises":[{"id":"h01","type":"branch","label":"Red-team path (branching)","persp":"attacker","scenario":"<pre class='log'>Purple-team exercise. Rules: stay quiet, no client impact.\nTarget:    SaaS company, AWS + Entra ID\nKnown:     engineer password phished (works)\nBlocks:    admin console needs a hardware security key\nFound:     CI service account tokens leaked in a public repo\nCloudTrail: enabled, alerts on trail changes<\/pre>","question":"Work the decision path, then choose the actions that keep the exercise quiet for weeks.","hint":"Quiet means: existing regions, existing hours, existing tooling, and never touching the audit trail.","explain":"The quiet path: enter through the <b>CI service account<\/b> (console is blocked by the hardware key), take its <b>long-lived access keys<\/b>, and stand up a <b>small VM in a used region<\/b>. Quiet means blending in: existing regions and instance types, normal hours, no console logins. Deleting CloudTrail is loud and alerted, and mining burns money and creates a billing spike, so both are wrong. If you picked either of those, re-read the rules line: 'stay quiet, no client impact'.","data":{"nodes":[{"add":"The admin console demands a hardware key. You will not get in that way.","prompt":"Which entry point do you pick?","options":[{"html":"Brute-force the console MFA prompt"},{"html":"Use the CI service account and its API keys"},{"html":"Phone the SOC and ask for a temporary token"}]},{"add":"The CI service account has long-lived API keys baked into pipeline variables.","prompt":"What do you grab first from the CI context?","options":[{"html":"The long-lived access keys of the CI service account"},{"html":"The CEO's calendar invites"},{"html":"The office printer queue"}]},{"add":"You can now call the AWS API as the CI service account.","prompt":"Which resource do you stand up first for later use?","options":[{"html":"A small VM in a region the tenant already uses"},{"html":"Eight GPUs in a region the tenant never uses"},{"html":"Delete the CloudTrail trail"}]}],"final":{"prompt":"Final decision: select all actions that keep the exercise quiet for weeks.","options":[{"html":"Avoid console logins entirely"},{"html":"Delete the CloudTrail trail"},{"html":"Mine cryptocurrency on the account"},{"html":"Use an existing region with instance types the tenant already runs"},{"html":"Match the tenant's normal working hours for API activity"}],"answer":[3,4,0]}}},{"id":"h02","type":"qcm-multi","label":"Quiet persistence options","persp":"attacker","scenario":"An attacker holds a working session in a compromised AWS account and wants to survive a password reset and a session revocation. The tenant alerts on trail changes, new unusual roles, and cost spikes.","question":"Select the <b>quieter<\/b> persistence options in this account.","hint":"Two options are new keys or tokens; one is a quiet app grant; two are loud alarms.","explain":"Quiet persistence rides on normal activity: a <b>new IAM user key<\/b>, a <b>second key on an existing service account<\/b> (blends with real automation) and a <b>long-lived refresh token<\/b> from an app grant. Deleting the trail is one of the loudest actions in AWS and the tenant alerts on it. One hundred GPUs at 3 a.m. trips both cost and time alarms.","options":[{"html":"Get a long-lived OAuth refresh token through a fake internal app"},{"html":"Delete the CloudTrail trail"},{"html":"Start 100 GPU instances at 3 a.m."},{"html":"Create a new IAM user with an access key"},{"html":"Add a second access key to an existing service account"}],"answer":[3,4,0]},{"id":"h03","type":"terminal","label":"AWS terminal: find the rogue key","persp":"attacker","scenario":"<pre class='log'>You hold the keys of user svc-backup. CloudTrail is enabled.\nTask 1: list the access keys of user svc-backup.\nTask 2: look up CloudTrail events to find where the newest key was created from.\nType 'help' in the terminal if you need the command names.<\/pre>","question":"Complete both tasks in the terminal, then press Check answer.","hint":"The IAM command is list-access-keys. For the trail, use cloudtrail lookup-events with AttributeValue=CreateAccessKey.","explain":"Task 1 needs <code>aws iam list-access-keys --user-name svc-backup<\/code>: it shows two keys, and the one created <b>2026-10-19 at 03:14 UTC<\/b> (AKIAY7XRR3K9PL2QVTHB) is the rogue one. Task 2 needs <code>aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=CreateAccessKey<\/code>: it shows the key was created from <b>203.0.113[.]77<\/b> with the AWS CLI. If you ran <code>list-users<\/code>, that was a near miss: it lists users, not their keys.","data":{"prompt":"analyst@soc:~$","banner":"AWS CLI simulator - type 'help' for available commands","tasks":[{"label":"List the access keys of user svc-backup","accept":"^aws\\s+iam\\s+list-access-keys\\b","danger":"^$"},{"label":"Find where the newest key was created from (CloudTrail event lookup)","accept":"^aws\\s+cloudtrail\\s+lookup-events\\b","danger":"^$"}],"dangerous":[],"nearmiss":[{"match":"^aws\\s+iam\\s+list-users\\b","note":"you listed users, but the task asks for the access keys of one user - check the exact command name."}],"sim":[{"match":"^help$","out":"Available commands:\n  aws iam list-access-keys --user-name USER\n  aws iam list-users\n  aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=EVENT\n  clear"},{"match":"^aws\\s+iam\\s+list-access-keys","out":"{\n    \"AccessKeyMetadata\": [\n        {\"UserName\": \"svc-backup\", \"AccessKeyId\": \"AKIAJ4EXAMPLEOLDKEY\", \"CreateDate\": \"2024-03-02T09:14:00Z\", \"Status\": \"Active\"},\n        {\"UserName\": \"svc-backup\", \"AccessKeyId\": \"AKIAY7XRR3K9PL2QVTHB\", \"CreateDate\": \"2026-10-19T03:14:00Z\", \"Status\": \"Active\"}\n    ]\n}"},{"match":"^aws\\s+iam\\s+list-users","out":"{\n    \"Users\": [\n        {\"UserName\": \"svc-backup\", \"CreateDate\": \"2023-11-08T10:02:00Z\"},\n        {\"UserName\": \"svc-deploy\", \"CreateDate\": \"2024-01-19T08:41:00Z\"}\n    ]\n}"},{"match":"^aws\\s+cloudtrail\\s+lookup-events","out":"{\n    \"Events\": [\n        {\"EventName\": \"CreateAccessKey\", \"EventTime\": \"2026-10-19T03:14:00Z\",\n         \"Username\": \"svc-backup\",\n         \"Resources\": \"AKIAY7XRR3K9PL2QVTHB\",\n         \"SourceIPAddress\": \"203.0.113[.]77\",\n         \"UserAgent\": \"aws-cli/2.15.3 Python/3.11 Linux/5.15\"}\n    ]\n}"}]}},{"id":"h04","type":"qcm-single","label":"Tuning impossible travel","persp":"defender","scenario":"<pre class='log'>User:        sales engineer, flies every week\nAlert:       impossible travel, 3rd week in a row\nDetails:     airport layover + VPN egress, geo DB shifted city\nSo far:      analyst paged the user every time, user annoyed<\/pre>","question":"How do you tune this alert without losing real coverage?","hint":"Keep the rule, add context that says 'this looks like the real user'.","explain":"Good tuning keeps the rule but adds context: <b>managed device + travel in the calendar + usual VPN egress<\/b> means 'probably the real user', so the page becomes a low-priority review. The high-signal alerts (new keys, new OAuth grants) stay untouched. Switching the rule off or shrinking it to absurd geographies removes coverage for the real thing; stopping business travel is not a security control.","options":[{"html":"Correlate with managed-device posture and calendar travel events before paging; keep alerting on new keys and OAuth changes"},{"html":"Turn impossible-travel alerts off for everyone"},{"html":"Only alert on sign-ins from Antarctica"},{"html":"Ask the sales team to stop flying"}],"answer":0},{"id":"h05","type":"matching","label":"Service to job","persp":"defender","scenario":"A new SOC analyst keeps mixing up the cloud services. The team lead builds a matching drill.","question":"Match each service to the job it does.","hint":"One service records API calls, one records sign-ins, one raises managed threat findings, one records SaaS admin actions.","explain":"<b>CloudTrail<\/b> is the AWS API audit trail. <b>Entra ID sign-in logs<\/b> cover Microsoft cloud sign-ins. <b>GuardDuty<\/b> is the managed AWS threat-detection service that raises findings such as unusual console logins. The <b>Google Workspace admin audit log<\/b> records OAuth grants and admin actions in Google SaaS. The battery row was the distractor.","data":{"pairs":[{"left":"AWS CloudTrail","right":"Records API calls in AWS accounts"},{"left":"Entra ID sign-in logs","right":"Show user sign-ins to Microsoft cloud services"},{"left":"Amazon GuardDuty","right":"Raises managed threat findings for AWS"},{"left":"Google Workspace admin audit log","right":"Records OAuth grants and admin actions in Google SaaS"}],"rights":["Records API calls in AWS accounts","Show user sign-ins to Microsoft cloud services","Raises managed threat findings for AWS","Records OAuth grants and admin actions in Google SaaS","Shows battery health of field laptops"]}},{"id":"h06","type":"order","label":"Triage order","persp":"defender","scenario":"09:00 - the SOC confirms a cloud admin account is compromised. Four runbook steps arrive out of order.","question":"Put the response steps in the right order.","hint":"Cut the attacker off, then learn, then clean, then harden.","explain":"The order is: <b>1)<\/b> contain (disable account, revoke sessions and tokens - the attacker loses access first), <b>2)<\/b> scope (export the logs while they are fresh), <b>3)<\/b> eradicate (remove rogue keys, users and grants the attacker added), and <b>4)<\/b> harden (phishing-resistant MFA for all admins so it cannot repeat). Cleaning before scoping destroys evidence; hardening first leaves the attacker inside.","data":{"items":["Disable the account and revoke sessions and tokens","Export CloudTrail and sign-in logs for review","Remove rogue keys, users and OAuth grants","Enforce phishing-resistant MFA for all admins"],"initial":[1,0,3,2]}},{"id":"h07","type":"qcm-single","label":"SIM swap against SMS MFA","persp":"attacker","scenario":"In documented real-world campaigns, attackers bribe or trick a mobile shop employee, port the victim's phone number to a SIM in their own pocket, then trigger the cloud provider's 'forgot password' flow and read the SMS codes that arrive.","question":"Why does a SIM swap beat SMS-based MFA?","hint":"Follow the phone number, not the phone.","explain":"SMS MFA trusts the <b>phone number<\/b>, not the person. After a SIM swap the number lives in the attacker's SIM, so the provider happily sends the codes to the attacker. Code length has nothing to do with it, the provider keeps its records, and SIM cards do not hold passwords.","options":[{"html":"SIM cards store the victim's passwords"},{"html":"The attacker ports the victim's number to a SIM they hold, so the codes arrive on their phone"},{"html":"SMS codes are too short to be safe"},{"html":"The cloud provider loses the phone record during a swap"}],"answer":1},{"id":"h08","type":"qcm-multi","label":"Why one alert is weak","persp":"defender","scenario":"A manager asks why the SOC will not declare an incident based on a single impossible-travel alert. The team explains alert quality.","question":"Select <b>all<\/b> the reasons why one impossible-travel alert is weak evidence on its own.","hint":"Think VPNs, geo databases, real travel, and vendor differences.","explain":"One alert is weak because <b>VPNs and proxies<\/b> move the apparent location, <b>geo-IP data is approximate<\/b>, <b>real users travel<\/b>, and every provider computes the alert <b>differently<\/b>. The last two options are the opposite of true: impossible travel produces false positives every week, and street-level geo accuracy does not exist.","options":[{"html":"Impossible travel can never be a false positive"},{"html":"Geo-IP data is exact to the street"},{"html":"VPNs and corporate proxies make sign-ins look foreign"},{"html":"Geo-IP databases can place an address in the wrong city or country"},{"html":"The user may genuinely be travelling"},{"html":"Alert quality and thresholds differ between providers"}],"answer":[2,3,4,5]},{"id":"h09","type":"qcm-single","label":"Ninety days of quiet","persp":"attacker","scenario":"An attacker plans to use a compromised cloud account for 90 days before the main operation. The tenant bills normally, runs Linux VMs in two regions, and alerts on cost spikes and new regions.","question":"Which choice costs the attacker the least over 90 days?","hint":"The cheapest action is the one that looks like yesterday's traffic.","explain":"The cheapest long game is <b>one small VM that matches the tenant's existing pattern<\/b>: no cost spike, no new region, no new identity. GPUs in a new region trip both the billing and the region alerts, changing root email and deleting logs is loud and irreversible, and weekly foreign console logins build a pattern any anomaly rule catches.","options":[{"html":"32 GPUs in a new region paid from the victim's card"},{"html":"A second account root email plus full audit-log deletion"},{"html":"Weekly console logins from a home IP abroad"},{"html":"One small VM in an existing region with an instance type the tenant already uses"}],"answer":3},{"id":"h10","type":"fill","label":"Key parts and sessions","persp":"concept","scenario":"A study note about AWS credentials lost two words and part of a third. The sentence must teach the difference between long-term keys and short sessions.","question":"Fill all three blanks.","hint":"First blank: the public half of the key. Second blank: the secret half. Third blank: what a sign-in session holds.","explain":"The pair is the <b>Access Key ID<\/b> (public, starts like AKIA) and the <b>Secret Access Key<\/b> (the secret half). Console and federated sign-ins use short-lived <b>session tokens<\/b> (sometimes carried in a session cookie) that expire and can be revoked. This is why attackers love long-term keys: they do not expire on their own.","data":{"template":"AWS long-term API credentials come as two strings: the Access Key [[0]] (it starts with letters like AKIA) and the Secret Access [[1]]. Short-lived sign-ins instead use a session [[2]] that can expire quickly and be revoked.","blanks":[{"answers":["id"],"label":"public key half"},{"answers":["key"],"label":"secret key half"},{"answers":["token","cookie"],"label":"short-lived session object"}]}},{"id":"h11","type":"qcm-single","label":"Billing as a detector","persp":"defender","scenario":"A startup has no SOC. It does have a finance person who watches the monthly cloud bill. The finance dashboard can raise alerts on daily spend.","question":"Which billing signal most often betrays cloud-account abuse for Resource Development?","hint":"The attacker builds things. Built things cost money.","explain":"Attackers create resources, and resources cost money: a <b>sudden compute-spend jump with no matching change request<\/b> is the classic billing tell (cryptomining makes it dramatic). Coupons, PDF layouts and policy pages do not measure attacker activity.","options":[{"html":"The monthly invoice PDF changing its layout"},{"html":"A new internal expense policy page"},{"html":"A sudden jump in compute spend with no change request"},{"html":"A discount coupon email from the provider"}],"answer":2},{"id":"h12","type":"dragdrop","label":"Method to counter","persp":"defender","scenario":"A security architect maps the four most common account-takeover methods to the control that defeats each one. The mapping must be one-to-one.","question":"Drag each takeover method onto the control that defeats it.","hint":"Match the weakness of each method: typed secrets, tapped prompts, long-lived sessions, and the phone number.","explain":"A <b>phishing page<\/b> dies against phishing-resistant MFA (the fake site cannot use the key). <b>Push spam<\/b> dies against number matching (the user must type a number they never received). <b>Pass-the-cookie<\/b> dies against short session lifetimes and fast revocation (the stolen cookie expires or is killed). A <b>SIM swap<\/b> dies when SMS is replaced by an authenticator app or security key (the code no longer depends on the phone number).","data":{"zones":[{"id":"mfa-key","label":"Phishing-resistant MFA"},{"id":"nummatch","label":"Number matching"},{"id":"sessions","label":"Short sessions + revocable tokens"},{"id":"nophone","label":"Authenticator app or security key instead of SMS"}],"items":[{"id":"p1","html":"Credential phishing page","zone":"mfa-key"},{"id":"p2","html":"MFA push spam","zone":"nummatch"},{"id":"p3","html":"Pass-the-cookie with a stolen session","zone":"sessions"},{"id":"p4","html":"SIM swap against SMS codes","zone":"nophone"}]}},{"id":"h13","type":"qcm-single","label":"Malicious OAuth grant","persp":"defender","scenario":"<pre class='log'>App:     'Mail Cleaner Pro' (unknown publisher)\nGrant:   Mail.Read, Files.Read.All\nUsers:   7 approved it in 2 days\nCurrent: mails read in bulk via Graph API<\/pre>","question":"Where do you act to stop the bleeding, and what do you do first?","hint":"The grant lives in the SaaS platform, not on the laptop.","explain":"A malicious OAuth grant is a SaaS-level problem: open the <b>admin console, revoke the app's grants for all users, block the app, and report it<\/b>. The BIOS, the Wi-Fi controller and the DNS registrar have no power over an OAuth token that the platform already issued.","options":[{"html":"In the SaaS admin console: revoke the app's grants, block it, and report to the provider"},{"html":"In the laptop BIOS"},{"html":"On the office Wi-Fi controller"},{"html":"At the DNS registrar of the company"}],"answer":0},{"id":"h14","type":"qcm-multi","label":"Read CloudTrail like a pro","persp":"defender","scenario":"<pre class='log'>CloudTrail excerpt, one night, user svc-deploy:\n03:12  ConsoleLogin      198.51.100[.]24   (never used by this account)\n03:14  CreateAccessKey   198.51.100[.]24   (user never had 2 keys)\n03:20  RunInstances      198.51.100[.]24   (tenant never runs night jobs)\n03:25  DescribeInstances 10.0.0[.]5 office  (daily automation, same hour)<\/pre>","question":"Select <b>all<\/b> the lines that are suspicious for cloud-account abuse.","hint":"Three lines break the account's own pattern; one line matches normal automation.","explain":"The three suspicious lines are the <b>unknown-IP console login<\/b> (entry), the <b>second access key<\/b> (persistence) and the <b>night-time RunInstances<\/b> (Resource Development). The DescribeInstances line matches the tenant's daily automation from the office IP, so on its own it is normal - which is exactly why it was left out of the answer.","options":[{"html":"CreateAccessKey on a user that never had a second key"},{"html":"RunInstances at 03:20 although the tenant never runs instances at night"},{"html":"DescribeInstances from the office IP during the daily automation hour"},{"html":"ConsoleLogin at 03:12 from an IP the account never used before"}],"answer":[3,0,1]},{"id":"h15","type":"qcm-single","label":"Mail capability, quietly","persp":"attacker","scenario":"An attacker with a compromised company account needs mail-sending capability for a later phishing stage. The tenant already runs a newsletter tool with a modest daily quota.","question":"Which path is least likely to trip alerts?","hint":"The quietest tool is the one the company already uses every day.","explain":"Using the <b>existing newsletter tool at a modest volume<\/b> rides inside a pattern the tenant and provider already accept. Half a million messages in an hour is an instant provider-level red flag, a new mail server on GPU instances is a double anomaly (new service + odd instance family), and asking support to lift limits puts a human in the path.","options":[{"html":"Spin up a new mail server on a GPU instance family"},{"html":"Ask the provider's support chat to lift all sending limits"},{"html":"Use the tenant's existing newsletter tool with a modest daily volume"},{"html":"Send 500,000 messages in the first hour from the account"}],"answer":2}]}</script>
<script>
(function(){
'use strict';
var META=JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var RAW=JSON.parse(document.getElementById('exam-data').textContent);
var CFG=RAW.config, EXS=RAW.exercises;
window.__EXAM__={config:CFG,exercises:EXS,meta:META};
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function elt(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function stripTags(s){var d=elt('div');d.innerHTML=s;return (d.textContent||'').replace(/\s+/g,' ').trim();}
function shortLabel(o){var t=o.short?o.short:stripTags(o.html||o.text||'');return (t||'item').slice(0,52);}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtT(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function fmtD(sec){sec=Math.round(sec);var m=Math.floor(sec/60);return m+'m '+('0'+(sec%60)).slice(-2)+'s';}
function sevClass(){return {EASY:'sev-easy',MEDIUM:'sev-medium',HARD:'sev-hard','EXTREMELY HARD':'sev-extreme'}[CFG.sevName]||'sev-easy';}

/* ---------------- timer state machine ----------------
   States: IDLE, RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED.
   - Check switches to PAUSED_AUTO_CHECK before feedback is rendered.
   - Next / Final Submit switch back to RUNNING (or ENDED on the last exercise).
   - Skip and Hint never change the timer state.
   - Manual Pause works on top of any state and returns to it on Resume. */
var T={state:'IDLE',remaining:CFG.budgetSeconds,since:0,resumeTo:null,acc:{RUNNING:0,PAUSED_MANUAL:0,PAUSED_AUTO_CHECK:0}};
function accrue(){if(T.since&&T.acc[T.state]!=null){T.acc[T.state]+=(Date.now()-T.since)/1000;}T.since=Date.now();}
function setState(s){if(T.state===s){renderTimer();return;}accrue();T.state=s;if(T.acc[s]==null){T.since=0;}renderTimer();}
function hardResetTimer(){T.state='IDLE';T.since=0;T.remaining=CFG.budgetSeconds;T.resumeTo=null;T.acc={RUNNING:0,PAUSED_MANUAL:0,PAUSED_AUTO_CHECK:0};renderTimer();}
setInterval(function(){
  if(T.state!=='RUNNING'){return;}
  T.remaining-=1;
  if(T.remaining<=0){T.remaining=0;renderTimer();finishExam(true);return;}
  renderTimer();
},1000);
var TMETA={RUNNING:['\u25B6','running'],PAUSED_MANUAL:['\u23F8','Paused'],PAUSED_AUTO_CHECK:['\u23F3','Auto-paused \u00B7 checking'],ENDED:['\u25A0','ended'],IDLE:['\u25CB','ready']};
function renderTimer(){
  var ic=$('#t-icon'),tm=$('#t-time'),st=$('#t-state');
  if(!ic||!tm||!st){return;}
  var m=TMETA[T.state]||TMETA.IDLE;
  ic.textContent=m[0];st.textContent=m[1];tm.textContent=fmtT(Math.max(0,T.remaining));
  st.className={RUNNING:'ts-run',PAUSED_MANUAL:'ts-pman',PAUSED_AUTO_CHECK:'ts-pauto',ENDED:'ts-end',IDLE:'ts-end'}[T.state]||'ts-end';
  tm.classList.toggle('low',T.remaining<=60&&T.state==='RUNNING');
  $('#hdr-timer').setAttribute('aria-label','Timer, state '+m[1]+', time left '+fmtT(Math.max(0,T.remaining)));
}

/* ---------------- session state ---------------- */
var S=null;
function resetAttempt(){
  S={screen:'intro',idx:0,mode:'main',credits:{},checked:{},hint:{},skipped:[],cur:null,prevScreen:'exercise',posted:false,timeUp:false,ddSel:null};
}
resetAttempt();
function scoreSum(){var s=0,k;for(k in S.credits){s+=S.credits[k];}return s;}
function exById(id){for(var i=0;i<EXS.length;i++){if(EXS[i].id===id){return EXS[i];}}return null;}

/* ---------------- header ---------------- */
function renderHeader(){
  var hdr=$('#hdr');if(!hdr){return;}
  var inExam=(S.screen==='exercise'||S.screen==='paused'||S.screen==='review');
  hdr.classList.toggle('hidden',!inExam);
  if(!inExam){return;}
  var counter=$('#hdr-counter'),sev=$('#hdr-sev'),scoreEl=$('#hdr-score'),
      hintB=$('#btn-hint'),skipB=$('#btn-skip'),pauseB=$('#btn-pause');
  if(!counter||!sev||!scoreEl||!hintB||!skipB||!pauseB){return;}
  if(S.mode==='review'||S.screen==='review'){counter.textContent='Reviewing skipped \u00B7 '+S.skipped.length+' left';}
  else{counter.textContent='Exercise '+(S.idx+1)+' of '+EXS.length;}
  scoreEl.textContent='Score: '+(Math.round(scoreSum()*10)/10).toFixed(1);
  sev.className='badge '+sevClass();sev.textContent=CFG.sevName;
  var cur=S.cur;
  var onEx=(S.screen==='exercise');
  hintB.disabled=!onEx||!cur||!!cur.graded||!!S.hint[cur.ex.id];
  skipB.disabled=!onEx||!cur||!!cur.graded||S.mode==='review';
  pauseB.textContent=(T.state==='PAUSED_MANUAL')?'\u23F8 Resume':'\u23F8 Pause';
}

/* ---------------- screens ---------------- */
function show(sc){S.screen=sc;render();}
function render(){
  var st=$('#stage');st.innerHTML='';
  if(S.screen==='intro')renderIntro(st);
  else if(S.screen==='exercise')renderExerciseScreen(st);
  else if(S.screen==='paused')renderPaused(st);
  else if(S.screen==='review')renderReview(st);
  else if(S.screen==='results')renderResults(st);
  renderHeader();renderTimer();
}
function renderIntro(st){
  var w=elt('div','intro');
  var strip=elt('div','strip');
  strip.innerHTML='<h1>'+CFG.title+'</h1>'
    +'<div class="chips">'
    +'<span class="chip">'+EXS.length+' exercises</span>'
    +'<span class="badge '+sevClass()+'">'+CFG.sevName+'</span>'
    +'<span class="chip">Estimated time: '+CFG.estimatedMinutes+' min</span>'
    +'<span class="chip">Timer budget: '+fmtT(CFG.budgetSeconds)+'</span>'
    +'<span class="chip">Pass mark: '+CFG.passMark+'%</span>'
    +'</div>';
  w.appendChild(strip);
  var s1=elt('section','i-sec');
  s1.appendChild(elt('h2',null,'What you will learn here'));
  CFG.introLearn.forEach(function(p){s1.appendChild(elt('p',null,p));});
  w.appendChild(s1);
  var s2=elt('section','i-sec');
  s2.appendChild(elt('h2',null,'Keywords covered in this exam'));
  var kc=elt('div','kw');
  CFG.keywords.forEach(function(k){kc.appendChild(elt('span','kw-chip',k));});
  s2.appendChild(kc);
  w.appendChild(s2);
  var s3=elt('section','i-sec');
  s3.appendChild(elt('h2',null,'How this exam works'));
  CFG.introHow.forEach(function(p){s3.appendChild(elt('p',null,p));});
  var b=elt('button','btn primary big','Start');
  b.id='btn-start';b.type='button';
  b.addEventListener('click',startExam);
  s3.appendChild(b);
  w.appendChild(s3);
  st.appendChild(w);
}
function startExam(){
  resetAttempt();
  hardResetTimer();
  S.mode='main';S.idx=0;
  startExercise();
  setState('RUNNING');
}

/* ---------------- exercise flow ---------------- */
function startExercise(){
  var ex=EXS[S.idx];
  S.cur={ex:ex,sel:-1,selM:[],match:{},place:{},order:(ex.data&&ex.data.initial?ex.data.initial.slice():[]),moved:[],vals:[],
         branch:{node:0,picks:[],final:[]},term:{lastRel:{},lines:[]},graded:null};
  S.screen='exercise';
  render();
}
function onCheck(){
  var c=S.cur;if(!c||c.graded)return;
  if(c.ex.type==='branch'&&c.branch.node<c.ex.data.nodes.length)return;
  setState('PAUSED_AUTO_CHECK');       /* auto-pause happens BEFORE feedback is rendered */
  c.graded=grade(c);
  S.credits[c.ex.id]=c.graded.final;
  S.checked[c.ex.id]=true;
  render();
}
function nextLabel(){
  if(S.mode==='review')return (S.skipped.length>1)?'Back to review':'Finish exam';
  if(S.idx<EXS.length-1)return 'Next exercise';
  return S.skipped.length?('Review skipped ('+S.skipped.length+')'):'Final Submit';
}
function onNext(){
  if(S.mode==='review'){
    S.skipped=S.skipped.filter(function(id){return id!==S.cur.ex.id;});
    if(S.skipped.length){S.screen='review';setState('RUNNING');render();}
    else{finishExam(false);}
    return;
  }
  if(S.idx<EXS.length-1){S.idx++;startExercise();setState('RUNNING');}
  else if(S.skipped.length){S.screen='review';setState('RUNNING');render();}
  else{finishExam(false);}
}
function onSkip(){
  var c=S.cur;
  if(!c||c.graded||S.mode==='review'||S.screen!=='exercise')return;
  S.skipped.push(c.ex.id);           /* timer keeps running: no state change */
  if(S.idx<EXS.length-1){S.idx++;startExercise();}
  else{S.screen='review';render();}  /* skipped pool is never empty here */
}
function onHint(){
  var c=S.cur;
  if(!c||c.graded||S.hint[c.ex.id]||S.screen!=='exercise')return;
  S.hint[c.ex.id]=true;              /* timer keeps running: no state change */
  render();
}
function onPause(){
  if(T.state==='PAUSED_MANUAL'){
    var back=T.resumeTo||'RUNNING';
    T.resumeTo=null;
    setState(back);
    show(S.prevScreen);
    return;
  }
  if(T.state==='RUNNING'||T.state==='PAUSED_AUTO_CHECK'){
    T.resumeTo=T.state;
    S.prevScreen=S.screen;
    setState('PAUSED_MANUAL');
    show('paused');
  }
}
function finishExam(timeUp){
  S.timeUp=!!timeUp;
  S.screen='results';
  setState('ENDED');
  render();
  setTimeout(postScore,750);         /* post after the score animation has settled */
}
function postScore(){
  if(S.posted)return;S.posted=true;
  var sum=0,total=0;
  EXS.forEach(function(ex){if(S.checked[ex.id]){sum+=S.credits[ex.id];total++;}});
  sum=Math.round(sum*10)/10;         /* rounding happens only here */
  var percent=total?Math.round(100*sum/total):0;
  var passed=total>0&&percent>=CFG.passMark;
  var msg={type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,score:sum,total:total,percent:percent,passed:passed};
  try{parent.postMessage(msg,location.origin);}catch(e){}
}

function runCmd(c,cmd){
  var d=c.ex.data,L=c.term.lines;
  L.push({cls:'t-cmd',html:escHtml(cmd)});
  var i,dk=null;
  for(i=0;i<(d.dangerous||[]).length;i++){if(re(d.dangerous[i].match).test(cmd)){dk=d.dangerous[i];break;}}
  if(dk){
    L.push({cls:'t-warn',html:'\u26A0 DANGEROUS \u2014 NEAR MISS: '+dk.why});
    (d.tasks||[]).forEach(function(t,ti){if(t.danger&&re(t.danger).test(cmd)){c.term.lastRel[ti]='danger';}});
    render();
    return;
  }
  var sim=null;
  for(i=0;i<(d.sim||[]).length;i++){if(re(d.sim[i].match).test(cmd)){sim=d.sim[i];break;}}
  if(sim){
    String(sim.out).split('\n').forEach(function(ln){L.push({cls:'t-out',html:escHtml(ln)});});
  }else{
    L.push({cls:'t-err',html:'sh: command not found: '+escHtml(cmd)});
  }
  (d.nearmiss||[]).forEach(function(r){
    if(re(r.match).test(cmd))L.push({cls:'t-note',html:'\u26A0 Near miss: '+r.note});
  });
  (d.tasks||[]).forEach(function(t,ti){
    if(!c.term.lastRel[ti]&&re(t.accept).test(cmd)){
      c.term.lastRel[ti]='correct';
      L.push({cls:'t-ok',html:'\u2713 Task '+(ti+1)+' command accepted.'});
    }
  });
  render();
}

/* ---------------- grading ---------------- */
function grade(c){
  var ex=c.ex,type=ex.type,raw=0,items=[],N,H,W,i;
  if(type==='qcm-single'){
    var ok=(c.sel===ex.answer);
    raw=ok?1:0;
    if(ok)items.push({label:shortLabel(ex.options[ex.answer]),state:'hit'});
    else{
      if(c.sel>=0)items.push({label:shortLabel(ex.options[c.sel]),state:'wrong'});
      items.push({label:shortLabel(ex.options[ex.answer]),state:'missed'});
    }
  }else if(type==='qcm-multi'){
    var ans=ex.answer;N=ans.length;H=0;W=0;
    ex.options.forEach(function(o,oi){
      var isA=ans.indexOf(oi)>=0,sel=c.selM.indexOf(oi)>=0;
      if(isA&&sel){H++;items.push({label:shortLabel(o),state:'hit'});}
      else if(!isA&&sel){W++;items.push({label:shortLabel(o),state:'wrong'});}
      else if(isA&&!sel){items.push({label:shortLabel(o),state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='matching'){
    var rights=ex.data.rights;N=ex.data.pairs.length;H=0;W=0;
    ex.data.pairs.forEach(function(p,pi){
      var v=c.match[pi];
      if(v!=null&&rights[v]===p.right){H++;items.push({label:p.left,state:'hit'});}
      else if(v!=null){W++;items.push({label:p.left,state:'wrong'});}
      else{items.push({label:p.left,state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='dragdrop'){
    N=ex.data.items.length;H=0;W=0;
    ex.data.items.forEach(function(it){
      var z=c.place[it.id];
      if(z&&z===it.zone){H++;items.push({label:stripTags(it.html),state:'hit'});}
      else if(z){W++;items.push({label:stripTags(it.html),state:'wrong'});}
      else{items.push({label:stripTags(it.html),state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='order'){
    N=ex.data.items.length;H=0;W=0;
    for(i=0;i<N;i++){
      var itIdx=c.order[i];
      if(itIdx===i){H++;items.push({label:ex.data.items[i],state:'hit'});}
      else if(c.moved.indexOf(itIdx)>=0){W++;items.push({label:ex.data.items[itIdx],state:'wrong'});}
      else{items.push({label:ex.data.items[itIdx],state:'missed'});}
    }
    raw=Math.max(0,(H-W)/N);
  }else if(type==='fill'){
    N=ex.data.blanks.length;H=0;W=0;
    ex.data.blanks.forEach(function(b,bi){
      var v=(c.vals[bi]||'').trim().toLowerCase();
      var good=b.answers.some(function(a){return a.trim().toLowerCase()===v;});
      if(v===''){items.push({label:b.label||('Blank '+(bi+1)),state:'missed'});}
      else if(good){H++;items.push({label:b.label||('Blank '+(bi+1)),state:'hit'});}
      else{W++;items.push({label:b.label||('Blank '+(bi+1)),state:'wrong'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='branch'){
    var fans=ex.data.final.answer;N=fans.length;H=0;W=0;
    ex.data.final.options.forEach(function(o,oi){
      var isA=fans.indexOf(oi)>=0,sel=c.branch.final.indexOf(oi)>=0;
      if(isA&&sel){H++;items.push({label:shortLabel(o),state:'hit'});}
      else if(!isA&&sel){W++;items.push({label:shortLabel(o),state:'wrong'});}
      else if(isA&&!sel){items.push({label:shortLabel(o),state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='terminal'){
    N=(ex.data.tasks||[]).length;H=0;W=0;
    (ex.data.tasks||[]).forEach(function(t,ti){
      var rel=c.term.lastRel[ti];
      if(rel==='correct'){H++;items.push({label:t.label,state:'hit'});}
      else if(rel==='danger'){W++;items.push({label:t.label,state:'wrong'});}
      else{items.push({label:t.label,state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }
  var hint=!!S.hint[ex.id];
  var fin=Math.max(0,Math.round((raw-(hint?0.10:0))*100)/100);
  var verdict=(fin>=0.999)?'correct':(fin>0?'partial':'incorrect');
  return {raw:raw,final:fin,hint:hint,items:items,verdict:verdict};
}

  card.appendChild(qb);
  var ab=elt('div','block block-answer');
  ab.appendChild(elt('div','block-label','YOUR ANSWER'));
  var host=elt('div','ans');
  ab.appendChild(host);
  if(ex.type==='qcm-single')uiQCM(host,c,false);
  else if(ex.type==='qcm-multi')uiQCM(host,c,true);
  else if(ex.type==='matching')uiMatch(host,c);
  else if(ex.type==='dragdrop')uiDD(host,c);
  else if(ex.type==='order')uiOrder(host,c);
  else if(ex.type==='fill')uiFillAnswer(host,c);
  else if(ex.type==='branch')uiBranch(host,c);
  else if(ex.type==='terminal')uiTerm(host,c);
  card.appendChild(ab);
  if(S.hint[ex.id]&&!c.graded)card.appendChild(elt('div','hintbox','<b>Hint (\u221210%):</b> '+ex.hint));
  var act=elt('div','actions');
  var chk=elt('button','btn primary','Check answer');
  chk.id='btn-check';chk.type='button';
  if(c.graded)chk.disabled=true;
  if(ex.type==='branch'&&!branchDone(c))chk.disabled=true;
  chk.addEventListener('click',onCheck);
  act.appendChild(chk);
  card.appendChild(act);
  if(c.graded)renderFeedback(card,c);
  st.appendChild(card);
  if(c.graded)lockCard(card);
  if(document.activeElement===document.body){
    var tgt=c.graded?$('#btn-next'):card;
    try{tgt.focus();}catch(e){}
  }
}
function lockCard(card){
  $$('.ans input,.ans select,.ans button',card).forEach(function(x){x.disabled=true;});
  $$('.ans .dd-chip',card).forEach(function(x){x.draggable=false;});
  $$('.ans .term-in',card).forEach(function(x){x.readOnly=true;});
}
function renderFeedback(card,c){
  var g=c.graded;
  var f=elt('div','feedback f-'+g.verdict);
  f.setAttribute('aria-live','polite');
  f.appendChild(elt('div','f-head',{correct:'\u2713 Correct',partial:'\u2713 Partially correct',incorrect:'\u2717 Incorrect'}[g.verdict]));
  f.appendChild(elt('div','f-credit','Credit: '+g.final.toFixed(2)+' of 1.00'+(g.hint?' \u00B7 includes hint penalty \u22120.10':'')));
  if(g.items.length){
    var ul=elt('ul','f-items');
    g.items.forEach(function(it){
      ul.appendChild(elt('li','it-'+it.state,({hit:'\u2713 Correct',wrong:'\u2717 Wrong',missed:'\u25CB Missed'})[it.state]+' \u2014 '+it.label));
    });
    f.appendChild(ul);
  }
  f.appendChild(elt('div','f-explain',c.ex.explain));
  var nb=elt('button','btn primary',nextLabel());
  nb.id='btn-next';nb.type='button';
  nb.addEventListener('click',onNext);
  f.appendChild(nb);
  card.appendChild(f);
}

/* ---------------- results ---------------- */
function renderResults(st){
  var answered=[],unanswered=[];
  EXS.forEach(function(ex){(S.checked[ex.id]?answered:unanswered).push(ex);});
  var full=[],part=[],zero=[],sum=0;
  answered.forEach(function(ex){
    var cr=S.credits[ex.id];sum+=cr;
    if(cr>=0.999)full.push(ex);else if(cr>0)part.push(ex);else zero.push(ex);
  });
  sum=Math.round(sum*10)/10;
  var total=answered.length;
  var percent=total?Math.round(100*sum/total):0;
  var passed=total>0&&percent>=CFG.passMark;
  var avgPart=part.length?(part.reduce(function(a,e){return a+S.credits[e.id];},0)/part.length):0;
  var w=elt('div','results');
  var hero=elt('div','res-hero');
  var pct=elt('div','res-pct','0%');pct.id='res-pct';
  hero.appendChild(pct);
  hero.appendChild(elt('div',null,'You answered '+total+' of '+EXS.length+' exercises. Unanswered and skipped exercises are not counted.'));
  var ban=elt('div','res-banner '+(passed?'pass':'fail'),passed?'\u2713 Passed':'\u2717 Not passed');
  hero.appendChild(ban);
  if(S.timeUp)hero.appendChild(elt('div','res-note','\u23F1 Time is up. Exercises you never answered were not scored.'));
  hero.appendChild(elt('div','res-note','Pass mark: '+CFG.passMark+'% \u00B7 Final score: '+sum.toFixed(1)+' points'));
  w.appendChild(hero);
  var grid=elt('div','res-grid');
  function box(cls,icon,num,lab){
    var b=elt('div','res-box '+cls);
    b.appendChild(elt('b',null,icon+' '+num));
    b.appendChild(elt('div','res-lab',lab));
    return b;
  }
  grid.appendChild(box('ok','\u2713',full.length,'Fully correct'));
  grid.appendChild(box('warn','\u2713',part.length,'Partially correct'+(part.length?(' \u00B7 avg partial credit '+avgPart.toFixed(2)):'')));
  grid.appendChild(box('bad','\u2717',zero.length,'Fully incorrect'));
  grid.appendChild(box('neu','\u26A0',unanswered.length,'Skipped / never answered (not scored)'));
  w.appendChild(grid);
  var acc=T.acc;
  w.appendChild(elt('div','res-pause','Time on the clock: '+fmtD(CFG.budgetSeconds-T.remaining)
    +' \u00B7 Running: '+fmtD(acc.RUNNING)
    +' \u00B7 Manual pause: '+fmtD(acc.PAUSED_MANUAL)
    +' \u00B7 Checking pause: '+fmtD(acc.PAUSED_AUTO_CHECK)));
  var list=elt('div','res-list');
  EXS.forEach(function(ex){
    var row=elt('div','res-row');
    row.appendChild(elt('span',null,ex.label));
    if(S.checked[ex.id]){
      var cr=S.credits[ex.id];
      var st=(cr>=0.999)?['res-state','\u2713 Correct','it-hit']:(cr>0)?['res-state','\u2713 Partially correct','it-hit']:['res-state','\u2717 Incorrect','it-wrong'];
      row.appendChild(elt('span',st[0]+' '+st[2],st[1]));
      row.appendChild(elt('span','res-cred',cr.toFixed(2)+(S.hint[ex.id]?' \u00B7 hint used':'')));
    }else{
      row.appendChild(elt('span','res-state it-missed','\u26A0 Skipped \u00B7 not scored'));
      row.appendChild(elt('span','res-cred','\u2014'));
    }
    list.appendChild(row);
  });
  w.appendChild(list);
  var act=elt('div','actions');
  var rb=elt('button','btn primary big','Retake exam');
  rb.id='btn-retake';rb.type='button';
  rb.addEventListener('click',function(){
    resetAttempt();
    hardResetTimer();
    show('intro');
  });
  act.appendChild(rb);
  w.appendChild(act);
  st.appendChild(w);
  /* score animation, then the score is posted by finishExam's timer */
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce||percent===0){
    pct.textContent=percent+'%';
  }else{
    var t0=null,dur=600;
    function step(ts){
      if(t0===null)t0=ts;
      var p=Math.min(1,(ts-t0)/dur);
      pct.textContent=Math.round(percent*(p<1?(1-Math.pow(1-p,3)):1))+'%';
      if(p<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
}

/* ---------------- boot ---------------- */
$('#btn-hint').addEventListener('click',onHint);
$('#btn-skip').addEventListener('click',onSkip);
$('#btn-pause').addEventListener('click',onPause);
show('intro');
})();

</script>
