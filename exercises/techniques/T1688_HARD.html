window.__EXAM_META__={"topicId": "t1688", "batch": 3, "title": "T1688 — HARD practice exam", "sevWord": "HARD", "difficulty": "hard", "estimatedMinutes": 50, "timerSeconds": 3000, "passMark": 70, "intro": {"title": "T1688 Safe Mode Boot — HARD practice exam", "object": "MITRE ATT&CK object: Technique T1688 — Safe Mode Boot (Enterprise, Windows, tactic Defense Impairment TA0112)", "learnTitle": "What you will learn here", "learn": "<p>This is the challenging tier for <b>T1688 — Safe Mode Boot<\/b>, a MITRE ATT&CK <b>technique<\/b> on <b>Windows<\/b>: forcing a host to start in <b>safe mode<\/b> — where only a limited set of drivers and services start — so that third-party security software such as EDR (endpoint detection and response) may not start. You already know the basics; here the answers are deliberately close together, and one plausible shortcut always leads to a wrong conclusion.<\/p><p>You will correlate three and four artefacts at a time: a bcdedit process event, a SafeBoot registry write, a restart event, a change ticket, an EDR heartbeat graph. You will meet the traps this technique is famous for: helpdesk work that looks exactly like an attack, an attacker's cleanup script that looks like an admin's fix, and a decision where the correct action is the <i>least<\/i> aggressive one. You will also read the real procedure examples from the page — Snatch, MedusaLocker, Embargo, LockBit 3.0, REvil — and work one decision first from the attacker's side, then from the defender's side.<\/p><p><b>Where you use this at work:<\/b> IR leads decide between containment and evidence preservation; threat hunters tune the DET0116 analytic against false positives; CTI analysts attribute procedures to families; detection engineers close the gaps the base rule leaves open — the GUI boot path (msconfig) and tools living inside safe mode. Take your time per exercise; the clock is generous, but the distractors are patient.<\/p>", "keywords": [{"theme": "Correlation and detection", "items": ["DET0116 / AN0323::correlate boot change + SafeBoot + restart", "bcdedit.exe / bootcfg.exe::boot configuration utilities", "SafeBoot registry keys::persistence inside safe mode", "EID 1074::restart requests", "EDR heartbeat loss::after safe-mode reboot", "False-positive tuning::change tickets, patch windows"]}, {"theme": "Procedure examples (page-grounded)", "items": ["Snatch::safe mode to bypass protection (2019)", "MedusaLocker::safe mode with networking reboot", "Embargo::MDeployer DLL variant via Safe Mode", "LockBit 3.0::reboots infected host", "REvil::safe mode with networking", "Black Basta::bcdedit /set safeboot network"]}, {"theme": "Coverage gaps and compensating controls", "items": ["msconfig.exe::GUI path to the same safeboot change", "COM objects::registered to load in safe mode", "M1026::Privileged Account Management", "M1054::Software Configuration"]}, {"theme": "Response judgement", "items": ["Evidence before repair::BCD export, SafeBoot export", "Least-aggressive action::when benign is confirmed", "Cost acceptance::containment vs evidence loss"]}], "exTypes": ["<li><b>Exercise types in this file:<\/b> choice questions with near-miss answers, line-tagging triage, matching, drag-and-drop coverage analysis, fill-in-the-blank, ranking, a two-step decision branch, two terminal commands (read-only collection on a legacy host, then the sanctioned repair), and one dual-perspective scenario.<\/li>"]}};
window.__EXERCISES__=[{"id": "h01", "type": "choice", "title": "Night shift on KF-ENG-114", "summary": "Correlation — three signals at 02:00 on an engineering workstation", "perspective": "defender", "scenario": "<p>You are the IR lead at Kestrel Forge. Three signals arrived within four minutes on KF-ENG-114. The on-call manager wants an assessment now. Read all three artefacts before you answer.<\/p>", "artifacts": [{"label": "Sysmon EID 1", "code": "02:11:44  Process Create\nImage:       C:\\Windows\\System32\\bcdedit.exe\nCommandLine: bcdedit /set {current} safeboot minimal\nUser:        KESTREL\\eng_backup (Administrators)\nParent:      C:\\Windows\\System32\\wbem\\wmiprvse.exe"}, {"label": "EDR console", "code": "02:14:59  KF-ENG-114  restart requested via WMI method\n02:16:03  agent heartbeat LOST (last state: healthy)"}, {"label": "Change system", "code": "CHG-8891: 'storage driver rollout — phase 2'\nScope: 31 engineering hosts   Window: 01:00-03:00\nOwner: Infra. KF-ENG-114 listed. No bcdedit mentioned."}], "question": "Which assessment will you defend in the morning review?", "options": [{"id": "A", "text": "Suspected T1688: the safeboot change is not part of CHG-8891; pull the boot log and the EDR service start events before any repair.", "plain": "suspected T1688 — verify before repair", "why": "Correct — a safeboot change outside the ticket's stated scope is the preparation half of the technique; the missing heartbeat is its expected effect. Verify, do not repair yet."}, {"id": "B", "text": "Covered by CHG-8891: the host and window match, so this is phase 2 of the driver rollout.", "plain": "covered by the ticket", "why": "Near miss — the host and the window match, but the ticket never mentions bcdedit; a driver rollout does not need to force safe mode."}, {"id": "C", "text": "T1112 Modify Registry only: bcdedit writes to the registry, so map the alert to T1112.", "plain": "map to T1112", "why": "Near miss — bcdedit does write configuration, but the observable behaviour is forcing a safe-mode boot (T1688); the page cites T1112 only for the separate SafeBoot service registration."}, {"id": "D", "text": "EDR defect: healthy agents do not lose heartbeat, so treat as an agent bug and re-install.", "plain": "agent bug", "why": "Near miss — agent bugs happen, but a heartbeat loss four minutes after a forced safe-mode reboot is exactly what the technique predicts; reinstalling would also bury the evidence."}], "correctId": "A", "hint": "The ticket matches the host and the window — check whether it matches the action.", "explain": "Two artefacts correlate into the T1688 chain (safeboot change, then restart, then EDR silence), and the third artefact fails to explain the first: CHG-8891 names a driver rollout but no boot change. The plausible shortcut is accepting the ticket as cover — the near-miss answers each grab one artefact and ignore the rest. Your assessment keeps evidence intact: pull boot status and service-start events before anyone touches the boot store.", "study": "Correlating three artefacts instead of trusting the first plausible one."}, {"id": "h02", "type": "tag", "title": "Alert storm triage", "summary": "Triage — five hunting hits, planned or suspicious", "perspective": "defender", "scenario": "<p>Your DET0116 hunt rule fired five times this week. The manager wants each hit classified before the Monday review: PLANNED (legitimate, documented) or SUSPICIOUS (needs IR). Tag all five lines.<\/p>", "artifacts": [{"label": "Hunt rule output", "code": "1  bcdedit /set {current} safeboot network   host KF-LAB-2\n     ticket CHG-8902 'safe boot for driver install', owner Infra\n2  bcdedit /set {default} safeboot minimal     host KF-ACC-07\n     no ticket, parent winrm.exe, 02:47 local\n3  msconfig.exe boot tab changed to safeboot   host KF-HR-19\n     ticket CHG-8877 'RAM upgrade diagnostics', owner Desktop\n4  reg write SafeBoot\\Minimal\\kf_backup.sys    host KF-ENG-114\n     no ticket, writer unsigned, 02:52 local\n5  bcdedit /enum {current}                     host KF-DC-01\n     run by Windows-DS team lead, read-only, chat logged"}], "question": "Tag every line PLANNED or SUSPICIOUS.", "lines": [{"id": "n1", "text": "bcdedit safeboot network on KF-LAB-2 with change ticket CHG-8902", "short": "KF-LAB-2 with ticket", "why": "PLANNED — a documented change ticket by the infra owner covers the exact action."}, {"id": "n2", "text": "bcdedit safeboot minimal on KF-ACC-07, no ticket, remote parent, 02:47", "short": "KF-ACC-07 no ticket", "why": "SUSPICIOUS — the same command with no documentation and a remote parent is the T1688 preparation pattern."}, {"id": "n3", "text": "msconfig boot tab changed to safeboot on KF-HR-19 with ticket CHG-8877", "short": "KF-HR-19 msconfig ticket", "why": "PLANNED — the GUI path still reaches the same change, but the ticket documents the diagnostic purpose."}, {"id": "n4", "text": "SafeBoot\\Minimal write of unsigned kf_backup.sys on KF-ENG-114, no ticket", "short": "KF-ENG-114 SafeBoot write", "why": "SUSPICIOUS — registering an unsigned binary to start inside safe mode is the persistence half of the technique."}, {"id": "n5", "text": "bcdedit /enum {current} on KF-DC-01, read-only, by the DS team lead", "short": "KF-DC-01 read-only", "why": "PLANNED — /enum lists settings without changing them; a read-only check by an identified owner is routine."}], "tags": [{"id": "planned", "label": "PLANNED", "accepts": ["n1", "n3", "n5"]}, {"id": "suspicious", "label": "SUSPICIOUS", "accepts": ["n2", "n4"]}], "hint": "Three have documentation and identified owners; two have neither — and one of those two never touches bcdedit at all.", "explain": "Hits 1, 3 and 5 are planned: each has a change ticket or an identified owner, and hit 5 is read-only. Hits 2 and 4 are suspicious: undocumented, remote or unsigned, and together they are both halves of the technique (force safe mode, then persist inside it). This is the 'looks alarming but is benign' trap in reverse — documentation, ownership and read-only intent separate the benign from the malicious, not the tool name.", "study": "False-positive tuning for boot-configuration alerts: tickets, ownership, read-only operations."}, {"id": "h03", "type": "terminal", "title": "Legacy fileserver, 2003", "summary": "Terminal — pick the right boot-query tool for an old OS", "perspective": "defender", "scenario": "<p>KF-FS-01 still runs Windows Server 2003 R2 — outside every support window, kept alive for one planning system. The team suspects someone prepared a safe-mode boot on it. You have an IR shell session. Choose the correct tool <i>for this operating system<\/i> and read the boot options without changing anything.<\/p>", "artifacts": [{"label": "Asset record", "code": "Host: KF-FS-01\nOS:   Windows Server 2003 R2 (boot.ini era)\nTools present: bootcfg.exe (yes), bcdedit.exe (no)\nConstraint: read-only — evidence host"}], "question": "Type the command that reads the boot options on this legacy host without changing anything.", "canonical": "bootcfg /query", "prompt": "KF-FS-01&gt;", "banner": "IR shell on Windows Server 2003 R2. Read-only graded.", "elements": [{"re": "\\bbootcfg\\b", "label": "Tool: bootcfg", "why": "bootcfg is the boot-options tool of the boot.ini era — the page names bootcfg.exe alongside bcdedit.exe as the utilities to watch."}, {"re": "/query", "label": "Read flag: /query", "why": "bootcfg /query lists the boot.ini entries without modifying anything."}], "dangerous": [{"re": "\\bbcdedit\\b", "label": "bcdedit on a 2003 host", "why": "bcdedit does not exist on Windows Server 2003 — typing it wastes the one window you have."}, {"re": "bootcfg\\s+/raw", "label": "state-changing /raw", "why": "bootcfg /raw rewrites boot.ini entries — forbidden on an evidence host."}, {"re": "bootcfg\\s+/copy", "label": "state-changing /copy", "why": "bootcfg /copy adds a boot entry — also a change, not a read."}], "simOutput": ["(simulated) Boot Loader Settings timeout=30", "(simulated) Operating Systems: multi(0)disk(0)rdisk(0)partition(1)\\WINDOWS \"Windows Server 2003\" /fastdetect"], "correctId": null, "hint": "The asset record tells you which of the two utilities even exists here; then pick the flag that lists instead of writes.", "explain": "Canonical command: <span class=\"mono\">bootcfg /query<\/span>. The page's detection strategy names bootcfg.exe next to bcdedit.exe precisely because older Windows versions expose boot options through bootcfg. On a 2003 host bcdedit is absent, and /raw or /copy would rewrite boot configuration on an evidence host. Tool selection by OS generation is the skill this exercise tests.", "study": "bootcfg vs bcdedit across Windows generations; read-only flags on evidence hosts."}, {"id": "h04", "type": "fill", "title": "Finish the correlation rule", "summary": "Detection engineering — the three-part correlation", "perspective": "defender", "scenario": "<p>Your detection engineer is encoding detection strategy DET0116 as a correlation rule. The spec sentence has three blanks. Fill them from the word bank.<\/p>", "artifacts": [{"label": "Rule spec (draft)", "code": "HIGH severity when ALL within 15 minutes:\n  a) bcdedit/bootcfg sets safeboot\n  b) write to the ____ registry key tree\n  c) an unexpected ____ of the host\nDowngrade to INFO only when a valid ____ exists."}], "question": "Complete the three blanks of the correlation rule.", "segments": [{"t": "txt", "v": "b) write to the "}, {"t": "blank", "id": "b1", "name": "key"}, {"t": "txt", "v": " registry key tree;   c) an unexpected "}, {"t": "blank", "id": "b2", "name": "event"}, {"t": "txt", "v": " of the host.   Downgrade to INFO only when a valid "}, {"t": "blank", "id": "b3", "name": "document"}, {"t": "txt", "v": " exists."}], "bank": ["SafeBoot", "restart", "change ticket", "FirewallRules", "login"], "blanks": [{"id": "b1", "name": "key", "correct": "SafeBoot", "why": "SafeBoot persistence is the second signal of the analytic — tools registered to start inside safe mode."}, {"id": "b2", "name": "event", "correct": "restart", "why": "The restart is what activates the forced safe mode — the third signal."}, {"id": "b3", "name": "document", "correct": "change ticket", "why": "The sanctioned downgrade path is a legitimate, verifiable change record — as the planned hits in the triage showed."}], "hint": "The analytic on the page names three signals: BCD modification, boot utilities, and registry persistence under a specific key — and the restart is the activator.", "explain": "The rule correlates: safeboot being set, a write under the SafeBoot key tree, and an unexpected restart — with a valid change ticket as the only downgrade path. One signal alone is weak (an admin can run bcdedit; a reboot happens every patch day); the combination is the T1688 signature. That is exactly how the page words the analytic: boot configuration changes correlated with registry edits that enable persistence or disable defences.", "study": "The AN0323 analytic description and how multi-signal correlation reduces false positives."}, {"id": "h05", "type": "match", "title": "Five families, five procedures", "summary": "Procedure examples — page-accurate matching at depth", "perspective": "neutral", "scenario": "<p>The CTI briefing needs exact procedure-to-family mapping from the ATT&CK page and its cited research. Match each family to the behaviour reported for it. Two of the five come from the page's reference list, not its software table.<\/p>", "artifacts": [{"label": "Reference pool", "code": "S1202 LockBit 3.0    S0496 REvil    S1247 Embargo\n2019 report: Snatch   Cybereason report: MedusaLocker"}], "question": "Match each family to its reported safe-mode behaviour.", "lefts": [{"id": "l1", "label": "Snatch (2019)", "why": "The page's cited research reports Snatch rebooting PCs into Safe Mode to bypass protection."}, {"id": "l2", "label": "MedusaLocker", "why": "The Cybereason report cited on the page ties MedusaLocker to safe-mode reboots."}, {"id": "l3", "label": "Embargo", "why": "Embargo used a DLL variant of MDeployer to disable security solutions through Safe Mode."}, {"id": "l4", "label": "LockBit 3.0", "why": "LockBit 3.0 can reboot the infected host into Safe Mode."}, {"id": "l5", "label": "REvil", "why": "REvil can force a reboot in safe mode with networking."}], "rights": [{"id": "r1", "label": "MDeployer DLL variant disables security via Safe Mode"}, {"id": "r2", "label": "reboots PCs into Safe Mode to bypass protection"}, {"id": "r3", "label": "force a reboot in safe mode with networking"}, {"id": "r4", "label": "reboots the infected host into Safe Mode"}, {"id": "r5", "label": "safe-mode with networking reboot reported by Cybereason"}], "correct": {"l1": "r2", "l2": "r5", "l3": "r1", "l4": "r4", "l5": "r3"}, "hint": "Match the distinctive words: DLL variant, bypass protection, with networking, infected host, Cybereason.", "explain": "Snatch's 2019 report is the classic 'safe mode to bypass protection' case; MedusaLocker comes from the Cybereason research cited on the page; Embargo's MDeployer DLL variant is the page's own description; LockBit 3.0 reboots the infected host; REvil forces safe mode with networking. Seven families are listed on the page — knowing which wording belongs to which family is what makes a CTI briefing trustworthy.", "study": "The procedure examples table and the reference list of the T1688 page."}, {"id": "h06", "type": "choice", "title": "The ticket closes the case", "summary": "Least aggressive action — benign confirmed, what next", "perspective": "defender", "scenario": "<p>Follow-up on KF-HR-19: the msconfig safeboot change from the triage is fully explained by ticket CHG-8877 (RAM diagnostics), the desktop team confirms it, and the host has already been booted normally again. No other signals. The manager asks for your recommended action.<\/p>", "artifacts": [], "question": "What is the correct, least aggressive action?", "options": [{"id": "A", "text": "Document the hit as benign, linked to CHG-8877, and keep the hunt rule watching", "plain": "document and keep watching", "why": "Correct — with ownership, ticket and confirmation, closing the loop in the record is all that remains; the rule keeps covering future hits."}, {"id": "B", "text": "Reimage KF-HR-19 to be certain", "plain": "reimage to be certain", "why": "Wrong — there is no evidence of compromise; a reimage destroys the machine's usefulness and any residual evidence for zero benefit."}, {"id": "C", "text": "Delete the msconfig safeboot change and revoke the desktop team's admin rights", "plain": "delete change and revoke rights", "why": "Wrong — the change is already undone by the reboot, and punishing a documented action damages trust and future ticketing."}, {"id": "D", "text": "Disable the hunt rule that fired, it is clearly too noisy", "plain": "disable the rule", "why": "Wrong — the rule did its job: the hit was resolved in minutes with documentation. Silencing it removes coverage for the next undocumented case."}], "correctId": "A", "hint": "Everything is explained and confirmed. Ask what still needs doing — and what would only cause harm.", "explain": "This is the 'correct action is the least aggressive option' exercise: with a valid ticket, an identified owner and a completed diagnostic, documentation plus continued monitoring is the whole job. The aggressive options (reimage, revocation, rule deletion) each destroy value while the evidence supports none of them. Least-privilege thinking applies to response actions too.", "study": "Response proportionality: match the action to the evidence, not to the alarm level."}, {"id": "h07", "type": "dnd", "title": "Coverage audit of AN0323", "summary": "Coverage analysis — what the analytic covers vs what it misses", "perspective": "defender", "scenario": "<p>Your team audits detection coverage against the page's analytic AN0323, which watches: BCD modification, boot configuration utilities (bcdedit.exe, bootcfg.exe), and registry persistence under SafeBoot keys. Sort the four candidate behaviours.<\/p>", "artifacts": [{"label": "Behaviours to classify", "code": "C1: bcdedit /set {default} safeboot network\nC2: bootcfg /raw safeboot on a 2003 host\nC3: msconfig.exe GUI: safe boot selected, BCD updated\nC4: COM object registered to load only in safe mode"}], "question": "Drag each behaviour onto COVERED or GAP for the current analytic.", "items": [{"id": "c1", "label": "C1: bcdedit /set safeboot network", "why": "Covered — the analytic keys on boot-configuration utilities and BCD modification."}, {"id": "c2", "label": "C2: bootcfg /raw on 2003", "why": "Covered — the page names bootcfg.exe explicitly alongside bcdedit.exe."}, {"id": "c3", "label": "C3: msconfig GUI change", "why": "Gap — a GUI change may never produce a bcdedit/bootcfg process event; only the BCD store itself reveals it."}, {"id": "c4", "label": "C4: COM object for safe mode", "why": "Gap — the analytic text watches the SafeBoot keys; a COM registration outside them is the description's other load path."}], "buckets": [{"id": "cov", "label": "COVERED by AN0323", "hint": "Named in the analytic text.", "accepts": ["c1", "c2"]}, {"id": "gap", "label": "GAP — needs a compensating check", "hint": "Not process events on the named utilities.", "accepts": ["c3", "c4"]}], "hint": "The analytic watches utilities and the SafeBoot keys. Ask which behaviours bypass both.", "explain": "C1 and C2 are the analytic's named targets. C3 (the msconfig GUI path) and C4 (COM objects registered for safe mode) can slip past process-and-key watching — the GUI writes the BCD without launching bcdedit, and COM registration is the description's separate load path. Closing these gaps is why you also watch the BCD store itself and the safe-mode service tree, not only process creation.", "study": "Detection coverage reasoning: named utilities vs alternative paths to the same change."}, {"id": "h08", "type": "choice", "title": "The cleanup script", "summary": "Looks benign but is alarming — interpreting /deletevalue", "perspective": "attacker", "scenario": "<p>On KF-ENG-114 (the host from exercise 1, now confirmed suspicious), scheduled-task telemetry shows a two-line script that ran at 02:58, <i>after<\/i> the safe-mode session had already done its work and after files changed in bulk. Read the script and choose the best interpretation.<\/p>", "artifacts": [{"label": "scheduled task output", "code": "02:58:01  cmd.exe /c cleanup.bat\n  line1: bcdedit /deletevalue {current} safeboot\n  line2: shutdown /r /t 0"}, {"label": "context", "code": "02:16  host rebooted into safe mode (forced)\n02:41  bulk file modification started\n02:58  cleanup.bat ran; host restarted again\nNo admin user was logged in during 02:00-03:00."}], "question": "Which interpretation best fits both artefacts?", "options": [{"id": "A", "text": "Attacker cleanup: remove the safeboot value so the next boot looks and behaves normal again", "plain": "attacker cleanup step", "why": "Correct — after the damage is done in safe mode, removing the safeboot value hides the mechanism and restores normal-looking operation; the bulk changes and the absent admin support this."}, {"id": "B", "text": "An admin fixing a boot problem", "plain": "admin fix", "why": "Near miss — the command is exactly what a legitimate fix looks like, but no admin was logged in and the timing follows bulk file changes, not a helpdesk request."}, {"id": "C", "text": "Windows Update finishing its own reboot", "plain": "update reboot", "why": "Near miss — update reboots do occur at night, but they do not run bcdedit /deletevalue through a scheduled cmd script."}, {"id": "D", "text": "Antivirus repairing the boot configuration", "plain": "AV repair", "why": "Near miss — plausible in isolation, yet the EDR was still down and no AV product writes such a task; the bulk modifications point elsewhere."}], "correctId": "A", "hint": "The command looks helpful. Ask who benefits from the boot being normal again — and when.", "explain": "This is the 'looks benign but is alarming' case: bcdedit /deletevalue is the textbook repair command, but here it runs unattended, immediately after bulk file changes, inside a window with no admin present. Attackers clean the safeboot switch to hide the mechanism (the technique's own ecosystem — e.g. ransomware families — reboots twice: once in, once out). Defender lesson: cleanup commands after suspicious safe-mode sessions are themselves signals, and the boot configuration should be captured as evidence before anyone 'fixes' it.", "study": "Post-attack cleanup behaviour and why the second reboot matters in the timeline."}, {"id": "h09", "type": "branch", "title": "CISO pressure on KF-FIN-07", "summary": "Decision branch — reimage demand vs evidence first", "perspective": "defender", "scenario": "<p>KF-FIN-07 (finance fileserver) shows confirmed T1688 behaviour: safeboot set, restart, EDR down, staging directory with encryptor-looking files. The CISO calls: 'Reimage it now, I want zero risk.' Two decisions — choose well; they are scored together.<\/p>", "artifacts": [{"label": "State snapshot", "code": "KF-FIN-07  boot config: safeboot set, EDR down\n volatile: RAM pages, scheduled tasks, registry SafeBoot\n business: finance shares, month-end close in 3 days"}], "question": "Make the two decisions.", "steps": [{"id": "s1", "label": "Decision 1 — the demand", "prompt": "The CISO wants an immediate reimage. What do you do?", "options": [{"id": "s1_o1", "text": "Agree to preserve-first: capture volatile evidence and boot configuration, then rebuild", "why": "Correct — a reimage destroys the RAM, tasks and SafeBoot evidence you need for scoping and any legal follow-up; capture is minutes, the cost is small, the loss is permanent."}, {"id": "s1_o2", "text": "Reimage immediately as demanded", "why": "Wrong — it satisfies the demand but destroys evidence and scope knowledge; 'zero risk' becomes unknown risk."}, {"id": "s1_o3", "text": "Refuse outright and do nothing on the host", "why": "Wrong — refusing everything leaves the host compromised; the answer is sequencing, not refusal."}], "correctId": "s1_o1"}, {"id": "s2", "label": "Decision 2 — the action with a real cost", "prompt": "Capture takes ~20 minutes during which the host stays powered on. What do you accept?", "options": [{"id": "s2_o1", "text": "Accept 20 minutes of exposure: isolate the network port first, then capture on live RAM", "why": "Correct — isolation removes the attacker's channel while you accept a bounded, logged risk; you get the evidence and the business keeps its data."}, {"id": "s2_o2", "text": "Pull the power cord first to be safe, capture nothing volatile", "why": "Wrong — power loss destroys RAM evidence; it is the costly mistake disguised as caution."}, {"id": "s2_o3", "text": "Capture with the network still connected to avoid downtime", "why": "Wrong — keeping the channel open for 20 minutes risks the attacker wiping the host; isolation is the cost you accept."}], "correctId": "s2_o1"}], "hint": "Evidence lost on a reimage never comes back; volatility lost on a power pull never comes back either. Sequence around both losses.", "explain": "The correct path is: isolate (accept the bounded downtime), capture volatile evidence and the boot configuration, then rebuild. Both wrong choices destroy something unrecoverable — evidence by reimage, RAM by power pull — while the right choice accepts a small, visible cost instead. Senior IR is the art of choosing which cost to accept, and being able to say why to the CISO.", "study": "Evidence preservation order and how to answer a reimage-now demand."}, {"id": "h10", "type": "choice", "title": "Red side: your next move", "summary": "Dual perspective (1 of 2) — attacker's operational choice", "perspective": "attacker", "scenario": "<p>Now the red side of the same story. You are the operator behind the KF-FIN-07 intrusion. Your payload is staged, you hold admin via a VPN session, and the EDR is healthy and watching. Your goal: drop the watcher with the least noise before the final stage. What is your T1688 move?<\/p>", "artifacts": [{"label": "Your options board (red)", "code": "A  kill the EDR service and its processes now\nB  uninstall the EDR agent from Settings\nC  set safeboot, reboot, operate without the watcher\nD  encrypt the EDR's own folders"}], "question": "Which option is the T1688 move, and why does it beat the others for noise?", "options": [{"id": "A", "text": "C — the safe-mode reboot removes the watcher without touching its files or services", "plain": "C — safe-mode reboot", "why": "Correct — T1688 changes the boot path; the EDR install stays intact and silent while it simply does not start."}, {"id": "B", "text": "A — killing the service is fastest and leaves no trace", "plain": "A — kill service", "why": "Near miss — killing processes is loud: alerts fire, the service can restart, and tampering is logged by the agent itself."}, {"id": "C", "text": "B — a clean uninstall leaves the least evidence", "plain": "B — clean uninstall", "why": "Near miss — uninstalls generate agent events and often need a password or tamper approval; 'clean' is the trap word."}, {"id": "D", "text": "D — encrypting the agent's folders blinds it permanently", "plain": "D — encrypt folders", "why": "Near miss — file tampering triggers self-protection and is exactly the noise a pre-encryption stage wants to avoid."}], "correctId": "A", "hint": "The technique's page says it plainly: security software 'may not start' after the boot — no crash, no uninstall, no file change.", "explain": "Attacker view: the safe-mode reboot is the quiet option — nothing is deleted, nothing crashes, nothing uninstalls; the watcher is simply not loaded next boot, which is the definition of T1688. Defender view (next exercise): the flip side is that the preparation must be visible somewhere — in process or boot telemetry — which is exactly where you will look.", "study": "Why attackers prefer boot-based defence impairment over noisy process tampering."}, {"id": "h11", "type": "click", "title": "Blue side: catch it earliest", "summary": "Dual perspective (2 of 2) — pick the earliest telemetry", "perspective": "defender", "scenario": "<p>Same intrusion, blue side. Four telemetry streams are available. Click the stream that gives the <b>earliest reliable warning<\/b> that the T1688 reboot is being prepared — before the host restarts.<\/p>", "artifacts": [], "paragraphs": [{"tokens": [{"v": "1.", "id": "s1"}, {"v": "Process-creation events with command lines", "id": "s2"}, {"v": "(bcdedit /set safeboot) — fires at preparation time", "id": "s3"}]}, {"tokens": [{"v": "2.", "id": "s4"}, {"v": "EDR heartbeat loss alerts", "id": "s5"}, {"v": "(fires after the reboot)", "id": "s6"}]}, {"tokens": [{"v": "3.", "id": "s7"}, {"v": "Bulk file-change alerts from the encryption stage", "id": "s8"}, {"v": "(fires at damage time)", "id": "s9"}]}, {"tokens": [{"v": "4.", "id": "s10"}, {"v": "Helpdesk ticket feed", "id": "s11"}, {"v": "(fires when someone files paperwork)", "id": "s12"}]}], "clickInstruction": "Click the ONE stream that warns earliest and reliably. Click again to unselect.", "correctTokens": ["s2"], "tokenInfo": {"s2": {"label": "Stream 1 — process-creation events with command lines", "why": "Correct — the bcdedit /set safeboot command is visible at preparation time, minutes before the reboot; that is the earliest reliable signal."}, "s5": {"label": "Stream 2 — EDR heartbeat loss", "why": "It is a strong signal but fires only after the reboot — too late to prevent the safe-mode session."}, "s8": {"label": "Stream 3 — bulk file changes", "why": "That is the damage stage, the last moment possible — detection there is failure, not success."}, "s11": {"label": "Stream 4 — ticket feed", "why": "Tickets explain hits; they do not detect attacks, and attackers file none."}}, "correctId": null, "question": "Click the telemetry stream that gives the earliest reliable warning.", "hint": "Early means before the reboot. Which artefact exists before the host ever restarts?", "explain": "Defender view: the preparation command (bcdedit /set safeboot) is the earliest reliable artefact — exactly why process-creation telemetry with command lines is the backbone of the page's analytic AN0323. Heartbeat loss proves the reboot already happened; bulk changes prove the damage started. Ordering signals by attack-clock position is the hunting instinct this technique rewards.", "study": "Signal ordering: preparation telemetry before activation symptoms before damage symptoms."}, {"id": "h12", "type": "order", "title": "Rank the three hosts", "summary": "Prioritisation — which host do you triage first", "perspective": "defender", "scenario": "<p>Three hosts appear in the same hunt window. You have one senior responder for the next hour. Rank the hosts by investigation urgency, most urgent first.<\/p>", "artifacts": [{"label": "Host summary", "code": "H1  KF-ENG-114: bcdedit safeboot + SafeBoot write + EDR heartbeat lost\nH2  KF-RND-22: bcdedit /enum only, admin logged, ticket pending\nH3  KF-HR-19: msconfig safeboot, ticket CHG-8877, confirmed diagnostic"}], "question": "Rank the three hosts from most urgent to least urgent.", "items": [{"id": "r1", "label": "H1 — full T1688 chain, EDR down", "why": "Two state changes plus EDR silence: an active, prepared host — first."}, {"id": "r2", "label": "H2 — read-only bcdedit, undocumented", "why": "Unexplained but read-only: worth a check, no state changed — second."}, {"id": "r3", "label": "H3 — ticketed diagnostic, already normal", "why": "Documented, confirmed and already resolved — last."}], "hint": "Rank by how much of the attack chain already happened and how much evidence of harm exists.", "explain": "H1 first: the chain is complete (change, persistence, EDR down) — every minute matters before the damage stage. H2 second: unexplained but read-only (/enum lists, it does not set). H3 last: documented and resolved. Prioritisation by chain completion is how one responder beats three alerts; a keyword-only reading would chase H2's scary-looking bcdedit string first and waste the hour.", "study": "Prioritising hunt hits by chain completeness, not by tool name."}, {"id": "h13", "type": "match", "title": "Tuning the analytics", "summary": "False-positive profiles — analytic to tuning approach", "perspective": "defender", "scenario": "<p>Four T1688 analytics, four false-positive profiles. Match each analytic to the tuning that keeps it alive without drowning the queue.<\/p>", "artifacts": [], "question": "Match each analytic to its best tuning approach.", "lefts": [{"id": "l1", "label": "Alert: bcdedit /set safeboot", "why": "State-changing boot edits: the noise is admin work, so tickets are the filter."}, {"id": "l2", "label": "Alert: write under SafeBoot keys", "why": "Legitimate installers (drivers, AV) also register safe-mode services — known-good signatures are the filter."}, {"id": "l3", "label": "Alert: EID 1074 restart requests", "why": "Restarts happen on every patch cycle — patch windows are the filter."}, {"id": "l4", "label": "Alert: bootcfg use", "why": "bootcfg exists on legacy hosts only — scope the alert to the legacy fleet."}], "rights": [{"id": "r1", "label": "Correlate with patch and maintenance windows"}, {"id": "r2", "label": "Whitelist signed installer signatures; alert on unsigned writers"}, {"id": "r3", "label": "Downgrade on a valid change ticket; escalate without one"}, {"id": "r4", "label": "Scope the alert to legacy boot.ini-era hosts only"}], "correct": {"l1": "r3", "l2": "r2", "l3": "r1", "l4": "r4"}, "hint": "Each tuning answers the question: what legitimate activity looks like this, and where does it come from?", "explain": "bcdedit alerts are filtered by tickets; SafeBoot writes by installer signatures (unsigned writers are the point); EID 1074 restarts by patch windows; bootcfg by legacy-fleet scoping. Tuning is not rule-weakening — each analytic stays sharp by describing its own legitimate look-alike, which is what keeps the two suspicious hits of the week visible.", "study": "False-positive profiles for boot-configuration analytics and their standard tunings."}, {"id": "h14", "type": "terminal", "title": "Sanctioned repair step", "summary": "Terminal — undo the forced safeboot after evidence capture", "perspective": "defender", "scenario": "<p>KF-ENG-114: evidence is captured (RAM image done, BCD exported to the evidence share, SafeBoot tree exported). The host is isolated. The change board authorises restoring normal boot. Type the command that removes the forced safe-mode setting.<\/p>", "artifacts": [{"label": "Runbook excerpt", "code": "PREREQUISITES (all done): RAM captured; BCD exported;\n               SafeBoot tree exported; host isolated\nAUTHORISED ACTION: remove the safeboot boot value\nTool available: bcdedit"}], "question": "Type the bcdedit command that removes the safeboot value from the boot configuration.", "canonical": "bcdedit /deletevalue {current} safeboot", "prompt": "KF-ENG-114&gt;", "banner": "Isolated host, evidence captured, action authorised by the change board.", "elements": [{"re": "\\bbcdedit\\b", "label": "Tool: bcdedit", "why": "bcdedit manages the boot store on this modern host."}, {"re": "/deletevalue", "label": "Operation: /deletevalue", "why": "Removing a boot value is /deletevalue — the inverse of /set."}, {"re": "safeboot", "label": "Target: safeboot", "why": "safeboot is the value that forces safe mode; removing it restores normal boot."}], "dangerous": [{"re": "/set", "label": "state-changing /set", "why": "/set would re-apply a safe-mode boot — the opposite of the authorised repair."}, {"re": "\\bformat\\b|\\bdiskpart\\b", "label": "destructive disk command", "why": "Any disk-wiping command here is catastrophic — the evidence share and the host data are still live."}], "simOutput": ["(simulated) The operation completed successfully.", "(simulated) next boot: normal startup"], "correctId": null, "hint": "You are undoing a setting, not setting one. The store argument {current} is optional.", "explain": "Canonical command: <span class=\"mono\">bcdedit /deletevalue {current} safeboot<\/span>. The prerequisite list is the teaching point: this command is only legitimate once evidence is captured and the host isolated — the same command in exercise 8 was attacker cleanup because no one authorised it and no evidence existed yet. Same command, opposite meaning: authorisation and sequence decide.", "study": "The repair command for a forced safeboot, and the prerequisites that make it legitimate."}, {"id": "h15", "type": "multi", "title": "Residual risk after M1054", "summary": "Multi-select — what M1054 does not fix", "perspective": "defender", "scenario": "<p>Your organisation has implemented M1054 (Software Configuration): the EDR now starts in safe mode on all modern hosts. The board asks what risk remains. Select the two residual risks that are genuinely still open.<\/p>", "artifacts": [], "question": "Select the two residual risks that remain open after M1054.", "options": [{"id": "o1", "text": "Legacy hosts where the old antivirus cannot run in safe mode", "plain": "legacy host gap", "why": "Correct — M1054 was applied to modern hosts; boot.ini-era systems (like KF-FS-01) keep the classic gap."}, {"id": "o2", "text": "Attackers can still register tools to run inside safe mode via SafeBoot services or COM objects", "plain": "in-safe-mode tooling", "why": "Correct — M1054 keeps the guard alive but does not stop the attacker from loading their own code alongside it."}, {"id": "o3", "text": "M1054 makes admin accounts unnecessary, so M1026 is obsolete", "plain": "M1026 obsolete", "why": "Wrong — the two mitigations address different halves; limiting admins (M1026) is still required."}, {"id": "o4", "text": "Safe mode now deletes the BCD store, so attacks fail entirely", "plain": "BCD deletion", "why": "Wrong — nothing deletes the BCD store; the forced safeboot mechanism still works as described."}, {"id": "o5", "text": "Attackers can no longer force a reboot at all", "plain": "no forced reboot", "why": "Wrong — with admin rights (which is why M1026 still matters) the reboot can still be forced; only the blindness is fixed."}], "correctIds": ["o1", "o2"], "hint": "Ask, for each option: does M1054's sentence ('endpoint defenses run in safe mode') actually address it?", "explain": "M1054 fixes one thing: the guard runs in safe mode. Two gaps survive it — hosts too old to run the guard at all, and the attacker's own tooling loaded through SafeBoot services or COM objects. This is why control reviews pair M1054 with M1026 and with the legacy-fleet retirement plan: each control covers one half of one technique, never the whole story.", "study": "What a single mitigation does and does not cover; pairing M1054 with M1026."}, {"id": "h16", "type": "choice", "title": "Why 'network'?", "summary": "Tradecraft — the networking variant's operational value", "perspective": "attacker", "scenario": "<p>REvil and Black Basta both forced safe mode <i>with networking<\/i>. Your red-team debrief asks why an operator would keep networking alive while dropping the defences. Pick the operationally correct reason.<\/p>", "artifacts": [], "question": "Why do operators choose Safe Mode with Networking for this technique?", "options": [{"id": "A", "text": "Their tooling keeps its command channel while the security software still does not start", "plain": "C2 stays alive, guard stays down", "why": "Correct — the variant keeps network drivers loading, so remote control continues, while third-party defences remain absent."}, {"id": "B", "text": "Networking mode starts more services, which hides the malware better", "plain": "more services hide malware", "why": "Near miss — more services do start, but the reason operators pick it is their own connectivity, not blending in."}, {"id": "C", "text": "Only the networking variant can read the encrypted payload from a share", "plain": "share access requirement", "why": "Near miss — share access is a side benefit some stages need, but the stated page-observable is safe mode with networking for the reboot itself; the operational driver is control, not one read."}, {"id": "D", "text": "The minimal variant cannot run the encryption stage at all", "plain": "minimal cannot encrypt", "why": "Near miss — encryption does not need the network, and ransomware stages have run in minimal safe mode (AvosLocker uses minimal in some variants); the differentiator is remote control."}], "correctId": "A", "hint": "Think about what the operator loses in minimal mode: their own channel home.", "explain": "Safe Mode with Networking trades a little stealth for capability: the attacker keeps command and control (and any share-based staging) while the EDR stays unloaded — that is why REvil and Black Basta used it, while other families accept minimal mode when they run self-contained. Trade-off reasoning, not definition recall, is what separates senior operators and senior defenders here.", "study": "The two safe-mode variants as an attacker trade-off, not just a menu choice."}, {"id": "h17", "type": "dnd", "title": "Close the two gaps", "summary": "Compensating analytics — gap to fix", "perspective": "defender", "scenario": "<p>The audit from exercise 7 found two gaps. Match each gap to the compensating analytic that closes it.<\/p>", "artifacts": [{"label": "Gaps", "code": "G1: msconfig GUI path changes the BCD without a bcdedit process\nG2: COM object registered to load in safe mode, outside watched keys"}], "question": "Drag each gap onto the analytic that compensates for it.", "items": [{"id": "g1", "label": "G1: msconfig GUI path", "why": "The GUI path still writes the BCD store — watching the store closes the gap regardless of tool."}, {"id": "g2", "label": "G2: COM object for safe mode", "why": "Watching the full safe-mode service/COM tree (and what loads in safe mode) catches registrations outside the keys the base rule reads."}], "buckets": [{"id": "a1", "label": "Watch the BCD store itself (file/registry view), not just processes", "hint": "One source of truth for every boot change.", "accepts": ["g1"]}, {"id": "a2", "label": "Monitor the safe-mode service and COM tree at boot", "hint": "Everything that starts or loads in safe mode, not only Minimal service keys.", "accepts": ["g2"]}], "hint": "For each gap ask: what artefact MUST exist even when no tool runs — and watch that.", "explain": "Every boot change ends up in the BCD store no matter which tool wrote it, so watching the store covers the GUI path. Every safe-mode load path ends in the safe-mode service/COM tree, so watching that tree covers registrations the base keys miss. Compensating analytics work by following the invariant artefact, not by listing more process names.", "study": "Compensating detection design: watch the destination state, not only the known tools."}, {"id": "h18", "type": "fill", "title": "Briefing sentence, precise", "summary": "CTI precision — Embargo's procedure mapped correctly", "perspective": "defender", "scenario": "<p>Your CTI briefing must map Embargo's procedure to ATT&CK without loose wording. Fill the three blanks from the word bank.<\/p>", "artifacts": [{"label": "Briefing draft", "code": "Embargo has used a DLL variant of ____ to ____\nsecurity solutions through ____ — behaviour tracked as\ntechnique ____ under tactic ____."}], "question": "Complete the three blanks so the mapping is exact.", "segments": [{"t": "txt", "v": "Embargo has used a DLL variant of "}, {"t": "blank", "id": "b1", "name": "tool"}, {"t": "txt", "v": " to "}, {"t": "blank", "id": "b2", "name": "action"}, {"t": "txt", "v": " security solutions through "}, {"t": "blank", "id": "b3", "name": "mode"}, {"t": "txt", "v": " — behaviour tracked as technique T1688 under tactic TA0112."}], "bank": ["MDeployer", "disable", "Safe Mode", "encrypt", "audit"], "blanks": [{"id": "b1", "name": "tool", "correct": "MDeployer", "why": "The page's procedure entry names Embargo's DLL variant of MDeployer."}, {"id": "b2", "name": "action", "correct": "disable", "why": "The reported action is disabling security solutions, not encrypting them."}, {"id": "b3", "name": "mode", "correct": "Safe Mode", "why": "The disabling is done through Safe Mode — the T1688 context."}], "hint": "All three answers are in the page's procedure table row for Embargo (S1247).", "explain": "The exact briefing reads: 'Embargo has used a DLL variant of MDeployer to disable security solutions through Safe Mode — behaviour tracked as technique T1688 under tactic TA0112.' Precision matters in briefings: 'disable' (not 'encrypt') tells the board this is a defence-weakening step, and the technique and tactic IDs let other teams pull the same mitigations and detections you use.", "study": "The Embargo S1247 procedure row and mapping procedure language to ATT&CK IDs."}];

(function(){
'use strict';
var M = window.__EXAM_META__;
var EXS = window.__EXERCISES__;
var app = document.getElementById('app');

/* ---------- helpers ---------- */
function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmtTime(s){ s=Math.max(0,s); var m=Math.floor(s/60), r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
function letters(i){ return String.fromCharCode(65+i); }
function scoreExercise(h,w,n){ if(n<=0) return 0; return Math.max(0,(h-w)/n); }
function normText(v){ return String(v).toLowerCase().replace(/\s+/g,' ').trim(); }
function fmtDur(ms){ var s=Math.round(ms/1000); var m=Math.floor(s/60); s=s%60; return (m>0? m+'m ':'')+s+'s'; }
function scrollNow(node){ var rm=false; try{ rm=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(err){}
  node.scrollIntoView({behavior:rm?'auto':'smooth',block:'start'}); }
function shuffledOrder(){
  var ids=EXS.map(function(e){ return e.id; });
  var isTerm={}; EXS.forEach(function(e){ isTerm[e.id]=(e.type==='terminal'); });
  for(var tries=0;tries<80;tries++){
    var o=shuffle(ids), ok=true;
    for(var i=1;i<o.length;i++){ if(isTerm[o[i]]&&isTerm[o[i-1]]){ ok=false; break; } }
    if(ok) return o;
  }
  return shuffle(ids);
}

/* ---------- state ---------- */
var S = {
  screen:'intro', order:[], idx:0, mode:'exam', reviewFrom:null,
  credits:{}, answered:{}, skipped:[], hintUsed:{}, feedbackShown:{},
  answers:{}, lastRes:{},
  timer:{ budget:M.timerSeconds, remaining:M.timerSeconds, state:'IDLE' },
  pauseLog:{ manualMs:0, autoMs:0, pauseStart:0, autoStart:0 },
  prevTimerState:null, reported:false, endedBy:'unfinished'
};

function exById(id){ for(var i=0;i<EXS.length;i++){ if(EXS[i].id===id) return EXS[i]; } return null; }
function curEx(){ return exById(S.order[S.idx]); }

/* ---------- timer state machine ---------- */
var T = {
  tick:null,
  start:function(){ this.stopTick(); var self=this; this.tick=setInterval(function(){ self.onTick(); },1000); },
  stopTick:function(){ if(this.tick){ clearInterval(this.tick); this.tick=null; } },
  onTick:function(){
    if(S.timer.state!=='RUNNING') return;
    S.timer.remaining--;
    if(S.timer.remaining<=0){ S.timer.remaining=0; S.timer.state='ENDED'; this.stopTick(); onTimeout(); }
    renderHeader();
  },
  setState:function(st){
    var prev=S.timer.state;
    if(prev===st) return;
    /* close any open pause interval logs */
    var now=Date.now();
    if(prev==='PAUSED_MANUAL'){ S.pauseLog.manualMs+=now-S.pauseLog.pauseStart; }
    if(prev==='PAUSED_AUTO_CHECK'){ S.pauseLog.autoMs+=now-S.pauseLog.autoStart; }
    if(st==='PAUSED_MANUAL'){ S.pauseLog.pauseStart=now; }
    if(st==='PAUSED_AUTO_CHECK'){ S.pauseLog.autoStart=now; }
    S.timer.state=st;
    if(st==='RUNNING'){ T.start(); } else { T.stopTick(); }
    if(st==='ENDED'){ T.stopTick(); }
    renderHeader();
  }
};

function onTimeout(){
  S.screen='results'; render();
}

/* ---------- score report ---------- */
function reportScore(){
  var answeredIds=S.order.filter(function(id){ return S.answered[id]; });
  var creditSum=0; answeredIds.forEach(function(id){ creditSum+=S.credits[id]||0; });
  var count=answeredIds.length;
  var percent=count>0?Math.round((creditSum/count)*100):0;
  S.reported=true;
  try{
    /* opened directly: there is no integrator to report to (self-post would be a no-op
       and would log an origin warning in some engines), so stay silent. */
    if(window.parent && window.parent!==window){
      /* Strict targeting on the real site (https: parent origin === location.origin).
         On opaque/file origins (sandbox, offline preview) strict targeting cannot match,
         so fall back to '*' — there is no cross-origin boundary to protect there. */
      var org=String(location.origin||'');
      var safe=(org && org!=='null' && org.indexOf('file://')!==0)?org:'*';
      parent.postMessage({
        type:'CYBERPULSE_SCORE', topicId:M.topicId, batch:M.batch,
        score:Math.round(creditSum), total:count, percent:percent, passed:percent>=M.passMark
      }, safe);
    }
  }catch(e){ /* opened directly; nothing to report to */ }
}

/* ---------- handshake ---------- */
var OPERATOR='';
window.addEventListener('message',function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  OPERATOR = event.data.username || '';
  var hi=document.getElementById('operator-hello');
  if(hi && OPERATOR){ hi.innerHTML='Operator signed in: <b>'+esc(OPERATOR)+'</b>'; }
});

/* ---------- header ---------- */
function timerStateLabel(){
  switch(S.timer.state){
    case 'RUNNING': return '<span class="tstate-running">&#9654; RUNNING</span>';
    case 'PAUSED_MANUAL': return '<span class="tstate-paused">&#9208; PAUSED &mdash; manual (press Resume)</span>';
    case 'PAUSED_AUTO_CHECK': return '<span class="tstate-paused">&#9203; AUTO-PAUSED &mdash; reading feedback (Next resumes)</span>';
    case 'ENDED': return '<span class="tstate-ended">&#9632; ENDED</span>';
    default: return '<span class="muted">&#9679; STANDBY</span>';
  }
}
function renderHeader(){
  var h=document.getElementById('examhead'); if(!h) return;
  var liveSum=0, liveCount=0;
  S.order.forEach(function(id){ if(S.answered[id]){ liveSum+=S.credits[id]||0; liveCount++; } });
  var pct=liveCount>0?Math.round((liveSum/liveCount)*100):0;
  var cur=curEx();
  var hintOff=(!cur)||S.hintUsed[cur.id]||S.feedbackShown[cur.id]||S.screen==='review';
  var reviewMode=(S.screen==='review');
  h.innerHTML =
    '<div class="left">'+
      '<div class="hstat"><span class="k">Exercise</span><span class="v">'+Math.min(S.idx+1,S.order.length)+' of '+S.order.length+'</span></div>'+
      '<span class="badge sev-badge" aria-label="Severity '+esc(M.sevWord)+'"><span class="dot"></span>'+esc(M.sevWord)+'</span>'+
      '<div class="hstat"><span class="k">Timer</span><span class="v mono">'+fmtTime(S.timer.remaining)+'</span></div>'+
      '<div class="hstat"><span class="k">Clock state</span><span class="v">'+timerStateLabel()+'</span></div>'+
      '<div class="hstat"><span class="k">Live score</span><span class="v"><span class="score-em">'+liveSum.toFixed(1)+'</span> / '+liveCount+' &nbsp;('+pct+'%)</span></div>'+
    '</div>'+
    '<div class="right">'+
      '<button class="btn ghost" id="btn-hint"'+(hintOff?' disabled':'')+' aria-label="Hint costs 10 percent of this exercise credit">&#128161; Hint (&minus;10%)</button>'+
      '<button class="btn ghost" id="btn-pause"'+(reviewMode?' disabled':'')+' aria-label="Pause exam manually">&#9208; Pause</button>'+
      '<button class="btn ghost" id="btn-skip"'+(reviewMode?' disabled':'')+' aria-label="Skip exercise">&#9888; Skip</button>'+
    '</div>';
  document.getElementById('btn-hint').onclick=onHint;
  document.getElementById('btn-pause').onclick=onManualPause;
  document.getElementById('btn-skip').onclick=onSkip;
  updateProgress();
}
function updateProgress(){
  var p=document.getElementById('progressbar'); if(!p) return;
  var done=0; S.order.forEach(function(id){ if(S.answered[id]||S.skipped.indexOf(id)>=0) done++; });
  p.style.width=Math.round((done/S.order.length)*100)+'%';
}

/* ---------- screens ---------- */
function render(){
  if(S.screen==='intro') renderIntro();
  else if(S.screen==='exam') renderExam();
  else if(S.screen==='review') renderReview();
  else if(S.screen==='results') renderResults();
}

/* ----- intro ----- */
function renderIntro(){
  var I=M.intro;
  var kw='';
  I.keywords.forEach(function(g){
    kw+='<div class="kwgroup"><h4>'+esc(g.theme)+'</h4>'+g.items.map(function(c){ return '<span class="chip"><b>'+esc(c.split('::')[0])+'</b>'+esc(c.indexOf('::')>=0?' :: '+c.split('::')[1]:'')+'</span>'; }).join('')+'</div>';
  });
  var types=I.exTypes.map(function(t){ return t; }).join('');
  app.innerHTML =
  '<div class="card">'+
    '<div class="intro-head">'+
      '<div><h1>'+esc(I.title)+'</h1><div class="sub">'+esc(I.object)+'</div>'+
      (OPERATOR?'<div class="small muted" id="operator-hello" style="margin-top:6px">Operator signed in: <b>'+esc(OPERATOR)+'</b></div>':'<div id="operator-hello"></div>')+
      '</div>'+
      '<span class="badge sev-badge" aria-label="Severity '+esc(M.sevWord)+'"><span class="dot"></span>'+esc(M.sevWord)+'</span>'+
    '</div>'+
    '<div class="fact-grid">'+
      '<div class="fact"><div class="k">Exercises</div><div class="v">'+EXS.length+'</div></div>'+
      '<div class="fact"><div class="k">Estimated time</div><div class="v">'+M.estimatedMinutes+' min</div></div>'+
      '<div class="fact"><div class="k">Timer budget</div><div class="v mono">'+fmtTime(M.timerSeconds)+'</div></div>'+
      '<div class="fact"><div class="k">Pass mark</div><div class="v">70%</div></div>'+
    '</div>'+
  '</div>'+
  '<div class="card"><h2>'+esc(I.learnTitle)+'</h2>'+I.learn+'</div>'+
  '<div class="card"><h2>Keywords covered in this exam</h2>'+kw+'</div>'+
  '<div class="card"><h2>How this exam works</h2>'+
    '<ul class="rules">'+
      '<li><b>Pass mark: 70%.</b> PASS means you scored at least 70% of the credit over the exercises you answered. FAIL means you should retake this exam after restudying.</li>'+
      types+
      '<li><b>Timer.</b> A countdown runs from '+fmtTime(M.timerSeconds)+'. Press <b>Pause</b> for a real break: the timer stops and the exercise is hidden. Press <b>Check</b> and the timer stops automatically so you can read the feedback without pressure; it starts again only when you press <b>Next</b>.</li>'+
      '<li><b>Partial credit.</b> Exercises with two or more correct items give partial credit: <span class="mono">credit = max(0, (H &minus; W) / N)</span>. Selecting extra wrong items cancels correct ones. One hint per exercise costs 10% of that exercise\'s credit.</li>'+
      '<li><b>Skips.</b> Every exercise has Skip. Skipped exercises wait in a review pool; you can return to them until the timer ends. A skipped exercise that is never answered is excluded from the score &mdash; it does not count for or against you.</li>'+
    '</ul>'+
    '<div class="btnrow center"><button class="btn primary" id="btn-start">&#9654; Start the exam</button></div>'+
  '</div>';
  document.getElementById('btn-start').onclick=function(){ startExam(); };
}

function startExam(){
  S.order=shuffledOrder();
  S.idx=0; S.credits={}; S.answered={}; S.skipped=[]; S.hintUsed={};
  S.feedbackShown={};
  S.answers={}; S.lastRes={}; S.pauseLog={manualMs:0,autoMs:0,pauseStart:0,autoStart:0};
  S.timer.budget=M.timerSeconds; S.timer.remaining=M.timerSeconds;
  S.prevTimerState=null; S.endedBy='unfinished';
  S.reported=false; S.screen='exam'; S.mode='exam';
  T.setState('RUNNING');
  render();
}

/* ----- exam ----- */
function renderExam(){
  var e=curEx(); if(!e){ nextAfterLast(); return; }
  var head='<div class="exam-head" id="examhead"></div>'+
    '<div class="progress" role="progressbar" aria-label="Exam progress"><div class="bar" id="progressbar"></div></div>';
  if(S.timer.state==='PAUSED_MANUAL'){
    /* MANUAL PAUSE: the exercise is removed from the DOM, not just veiled */
    app.innerHTML=head+'<div id="exzone" class="pausedveil">'+
      '<div class="veil"><div class="big">&#9208; PAUSED &mdash; manual</div><div class="muted">Press Resume to continue.</div><button class="btn primary" id="btn-resume">&#9654; Resume</button></div>'+
      '</div>';
    renderHeader();
    var rr=document.getElementById('btn-resume'); if(rr) rr.onclick=onManualResume;
    return;
  }
  app.innerHTML=head+'<div id="exzone"><div id="exbody"></div></div>';
  renderHeader();
  renderExercise(e);
  /* feedback persists across Pause/Resume and re-entry into an answered exercise */
  if(S.feedbackShown[e.id] && S.lastRes[e.id]){
    renderFeedback(e, S.credits[e.id]||0, S.lastRes[e.id]);
  }
  var zone=document.getElementById('exzone');
  scrollNow(zone);
}

function onManualPause(){
  if(S.timer.state!=='RUNNING' && S.timer.state!=='PAUSED_AUTO_CHECK') return;
  S.prevTimerState=S.timer.state;
  T.setState('PAUSED_MANUAL');
  renderExam();
}
function onManualResume(){
  T.setState(S.prevTimerState==='PAUSED_AUTO_CHECK'?'PAUSED_AUTO_CHECK':'RUNNING');
  renderExam();
}

function onHint(){
  var e=curEx(); if(!e) return;
  if(S.hintUsed[e.id]) return;
  if(S.feedbackShown[e.id]) return;
  S.hintUsed[e.id]=true;
  var hp=document.getElementById('hintpanel');
  if(hp){ hp.classList.remove('hidden'); hp.setAttribute('aria-hidden','false'); }
  var b=document.getElementById('btn-hint'); if(b){ b.disabled=true; }
}

function onSkip(){
  var e=curEx(); if(!e) return;
  if(S.feedbackShown[e.id]){ /* already graded: Skip acts as Next */
    if(S.timer.state==='PAUSED_AUTO_CHECK'){ T.setState('RUNNING'); }
    var last=(S.idx===S.order.length-1);
    if(last){ if(S.skipped.length>0){ S.screen='review'; render(); } else finishExam(); }
    else advance(true);
    return;
  }
  if(S.skipped.indexOf(e.id)<0){ S.skipped.push(e.id); }
  advance(false);
}

/* advance: from Next or Skip. checked=true when moving past a checked exercise */
function advance(checked){
  var e=curEx();
  if(checked && e){
    var p=S.skipped.indexOf(e.id);
    if(p>=0){ S.skipped.splice(p,1); }
  }
  S.idx++;
  if(S.idx>=S.order.length){
    if(S.skipped.length>0){ S.screen='review'; render(); }
    else { nextAfterLast(); }
    return;
  }
  render();
}
function nextAfterLast(){
  /* safety net: anything never visited and unanswered joins the review pool */
  S.order.forEach(function(id){
    if(!S.answered[id] && S.skipped.indexOf(id)<0){ S.skipped.push(id); }
  });
  if(S.skipped.length>0){ S.screen='review'; render(); }
  else finishExam();
}
function finishExam(){
  S.timer.state='ENDED'; T.stopTick();
  S.screen='results'; render();
}

/* ---------- exercise renderers ---------- */
function renderExercise(e){
  var body=document.getElementById('exbody');
  body.innerHTML='';
  var card=el('div','card');
  card.setAttribute('data-ex',e.id);
  var already = S.feedbackShown[e.id];
  var sumline=e.summary||e.title;
  var scen='<div class="collhead"><div><h2 style="font-size:16px;letter-spacing:.4px">SCENARIO</h2>'+
    '<div class="sumline">'+esc(sumline)+(already?' &mdash; collapsed':'')+'</div></div>'+
    '<button class="ct" id="colltoggle" aria-expanded="true">Collapse</button></div>'+
    '<div class="collbody" id="collbody">'+e.scenario;
  (e.artifacts||[]).forEach(function(a,i){
    scen+='<div class="artefact"><div class="alabel"><span>ARTEFACT '+(i+1)+' &mdash; '+esc(a.label)+'</span></div><pre class="code">'+a.code+'</pre></div>';
  });
  scen+='</div>';
  card.innerHTML=scen;

  var ab=el('div','block block-question');
  ab.innerHTML='<div class="bh">&#10067; QUESTION</div><div class="qtext">'+e.question+'</div>';
  if(e.hint){
    ab.appendChild(el('div','hintpanel hidden','<div class="hh">&#128161; Hint (one only &mdash; 10% of this exercise credit)</div><div>'+e.hint+'</div>'));
    ab.lastChild.id='hintpanel'; ab.lastChild.setAttribute('aria-hidden','true');
  }
  card.appendChild(ab);

  var answ=el('div','block block-answer');
  answ.innerHTML='<div class="bh">&#9999; YOUR ANSWER</div>';
  var widget=el('div'); widget.id='widget'; answ.appendChild(widget);
  card.appendChild(answ);
  body.appendChild(card);

  /* collapsible behaviour */
  var ctog=card.querySelector('#colltoggle'), cbody=card.querySelector('#collbody');
  ctog.onclick=function(){
    var hid=cbody.classList.toggle('hidden');
    ctog.textContent=hid?'Expand':'Collapse';
    ctog.setAttribute('aria-expanded',hid?'false':'true');
  };

  RENDER[e.type](e,widget);

  /* nav row */
  var nav=el('div','btnrow');
  if(already){
    nav.innerHTML='<button class="btn primary" id="btn-next">'+(S.idx===S.order.length-1?'Final Submit &#10140;':'Next &#10140;')+'</button>';
  }else{
    nav.innerHTML='<button class="btn primary" id="btn-check">&#10003; Check</button>';
  }
  body.appendChild(nav);
  if(already){ bindNext(); } else { document.getElementById('btn-check').onclick=function(){ onCheck(e); }; }
}
function bindNext(){
  var b=document.getElementById('btn-next'); if(!b) return;
  b.onclick=function(){
    if(S.timer.state==='PAUSED_AUTO_CHECK'){ T.setState('RUNNING'); }
    if(S.mode==='review'){
      /* returning from a review answer: back to the review list */
      var cur=curEx();
      if(cur){ var pp=S.skipped.indexOf(cur.id); if(pp>=0){ S.skipped.splice(pp,1); } }
      if(S.skipped.length>0){ S.screen='review'; render(); }
      else finishExam();
      return;
    }
    var last=(S.idx===S.order.length-1);
    if(last){
      if(S.skipped.length>0){ S.screen='review'; render(); }
      else finishExam();
    } else {
      advance(true);
    }
  };
}

function onCheck(e){
  var res=GRADER[e.type](e);
  if(res===null){ /* nothing answered yet: nudge */
    var w=document.getElementById('widget');
    var nudge=w.querySelector('.nudge');
    if(!nudge){ nudge=el('div','small','<span style="color:var(--state-partial)">&#9888;</span> Choose an answer first, then press Check.'); w.insertBefore(nudge,w.firstChild); }
    return;
  }
  var credit=res.credit;
  if(S.hintUsed[e.id]) credit=Math.max(0,credit-0.10);
  credit=Math.round(credit*10000)/10000;
  S.credits[e.id]=credit; S.answered[e.id]=true; S.feedbackShown[e.id]=true;
  S.lastRes[e.id]=res;
  /* CHECK-TRIGGERED AUTO-PAUSE: first action, before rendering feedback */
  if(S.timer.state==='RUNNING'){ T.setState('PAUSED_AUTO_CHECK'); }
  renderHeader();
  renderExercise(e);
  renderFeedback(e,credit,res);
  var zone=document.getElementById('exzone'); if(zone) scrollNow(zone);
}

function renderFeedback(e,credit,res){
  var old=document.getElementById('fbzone'); if(old) old.remove();
  var zone=document.getElementById('exbody');
  var cls,lab,icon;
  if(credit>=0.999){ cls='fb-correct'; lab='CORRECT'; icon='&#10003;'; }
  else if(credit>0){ cls='fb-partial'; lab='PARTIALLY CORRECT'; icon='&#10003;'; }
  else { cls='fb-incorrect'; lab='INCORRECT'; icon='&#10007;'; }
  var fb=el('div','fb '+cls); fb.id='fbzone';
  var head='<div class="fbh"><span>'+icon+'</span> '+lab;
  if(res.n>1) head+=' <span class="credit">credit '+credit.toFixed(2)+' &mdash; '+res.h+' / '+res.n+' items</span>';
  if(res.dangerous) head+=' <span class="pill" style="color:var(--state-incorrect);border-color:var(--state-incorrect)">&#10007; DANGEROUS &mdash; NEAR MISS</span>';
  head+='</div>';
  var rows='';
  (res.rows||[]).forEach(function(r){
    var ic,cl;
    if(r.state==='ok'){ ic='&#10003; Correct'; cl='ic-ok'; }
    else if(r.state==='bad'){ ic='&#10007; Wrong'; cl='ic-bad'; }
    else if(r.state==='miss'){ ic='&#9675; Missed'; cl='ic-miss'; }
    else { ic='&#9679; Info'; cl='ic-part'; }
    rows+='<div class="itemrow"><span class="ic '+cl+'">'+ic+'</span><span><b>'+r.label+'</b>'+(r.why?' &mdash; '+r.why:'')+'</span></div>';
  });
  var study='';
  if(credit<0.999 && e.study) study='<div class="study"><b>What to study:</b> '+e.study+'</div>';
  var canon='';
  if(e.type==='terminal' && e.canonical){
    canon='<div class="artefact"><div class="alabel"><span>CANONICAL COMMAND &mdash; copyable</span>'+
      '<button type="button" class="ct" id="copycanon" aria-label="Copy canonical command">Copy</button></div>'+
      '<pre class="code" id="cmdcanon">'+esc(e.canonical)+'</pre></div>';
  }
  fb.innerHTML=head+canon+rows+'<div class="explain">'+e.explain+'</div>'+study;
  var copyBtn=fb.querySelector('#copycanon');
  if(copyBtn){ copyBtn.onclick=function(){
    var txt=e.canonical;
    try{ navigator.clipboard.writeText(txt); copyBtn.textContent='Copied'; }catch(err){ copyBtn.textContent='Select & copy'; }
    setTimeout(function(){ copyBtn.textContent='Copy'; },1500);
  }; }
  var navzone=zone.querySelector('.btnrow');
  zone.insertBefore(fb,navzone);
}

/* ----- render + grade per type ----- */
var RENDER={}; var GRADER={};

/* choice */
RENDER.choice=function(e,w){
  var order=shuffle(e.options.map(function(o){return o.id;}));
  S.answers[e.id+'_order']=order;
  var wrap=el('div','opts');
  order.forEach(function(oid,i){
    var o=e.options.filter(function(x){return x.id===oid;})[0];
    var b=el('button','opt'); b.type='button'; b.setAttribute('data-oid',oid);
    b.innerHTML='<span class="olabel">'+letters(i)+'.</span><span>'+o.text+' <span class="selmark">&#9679; selected</span></span>';
    b.onclick=function(){
      if(S.feedbackShown[e.id]) return;
      wrap.querySelectorAll('.opt').forEach(function(x){ x.classList.remove('selected'); });
      b.classList.add('selected'); b.setAttribute('aria-pressed','true');
      S.answers[e.id]=oid;
      var n=w.querySelector('.nudge'); if(n) n.remove();
    };
    wrap.appendChild(b);
  });
  w.appendChild(wrap);
};
GRADER.choice=function(e){
  var pick=S.answers[e.id];
  if(!pick) return null;
  var ok=(pick===e.correctId);
  var rows=e.options.map(function(o){
    if(o.id===e.correctId) return {label:o.plain,state:ok&&pick===o.id?'ok':'miss',why:o.why};
    if(o.id===pick) return {label:o.plain,state:'bad',why:o.why};
    return null;
  }).filter(Boolean);
  return {credit:ok?1:0,h:ok?1:0,n:1,rows:rows};
};

/* multi */
RENDER.multi=function(e,w){
  var order=shuffle(e.options.map(function(o){return o.id;}));
  S.answers[e.id+'_order']=order;
  var wrap=el('div','opts');
  order.forEach(function(oid,i){
    var o=e.options.filter(function(x){return x.id===oid;})[0];
    var b=el('button','opt'); b.type='button'; b.setAttribute('data-oid',oid);
    b.innerHTML='<span class="olabel">'+letters(i)+'.</span><span>'+o.text+' <span class="selmark">&#9679; selected</span></span>';
    b.onclick=function(){
      if(S.feedbackShown[e.id]) return;
      var on=b.classList.toggle('selected');
      b.setAttribute('aria-pressed',on?'true':'false');
      var set=S.answers[e.id]||[]; set=on?set.concat([oid]):set.filter(function(x){return x!==oid;});
      S.answers[e.id]=set;
      var n=w.querySelector('.nudge'); if(n&&set.length) n.remove();
    };
    wrap.appendChild(b);
  });
  w.appendChild(wrap);
};
GRADER.multi=function(e){
  var pick=S.answers[e.id]; if(!pick||!pick.length) return null;
  var h=0,wr=0,rows=[];
  e.options.forEach(function(o){
    var sel=pick.indexOf(o.id)>=0, corr=e.correctIds.indexOf(o.id)>=0;
    if(sel&&corr){ h++; rows.push({label:o.plain,state:'ok',why:o.why}); }
    else if(sel&&!corr){ wr++; rows.push({label:o.plain,state:'bad',why:o.why}); }
    else if(!sel&&corr){ rows.push({label:o.plain,state:'miss',why:o.why}); }
  });
  return {credit:scoreExercise(h,wr,e.correctIds.length),h:h,n:e.correctIds.length,rows:rows};
};

/* dnd (click-to-place + HTML5 drag) */
RENDER.dnd=function(e,w){
  var items=shuffle(e.items.map(function(x){return x.id;}));
  S.answers[e.id]={placed:{},sel:null};
  var bank=el('div','bank'); bank.id='bank_'+e.id;
  items.forEach(function(iid){
    var it=e.items.filter(function(x){return x.id===iid;})[0];
    var d=el('button','ditem'); d.type='button'; d.draggable=true; d.setAttribute('data-iid',iid);
    d.innerHTML='&#8942;&#8942; '+it.label;
    d.onclick=function(){ if(S.feedbackShown[e.id])return;
      bank.querySelectorAll('.ditem').forEach(function(x){x.classList.remove('sel');});
      d.classList.add('sel'); S.answers[e.id].sel=iid; };
    d.ondragstart=function(ev){ ev.dataTransfer.setData('text/plain',iid); d.classList.add('dragging'); };
    d.ondragend=function(){ d.classList.remove('dragging'); };
    bank.appendChild(d);
  });
  w.appendChild(el('div','small muted','Click an item, then click the right panel. You can also drag the items. Return an item with its &times; button.'));
  w.appendChild(bank);
  var bwrap=el('div','buckets');
  e.buckets.forEach(function(b){
    var bd=el('div','bucket'); bd.setAttribute('data-bid',b.id);
    bd.innerHTML='<h5>'+b.label+'</h5>'+(b.hint?'<div class="bhint">'+b.hint+'</div>':'')+'<div class="chips"></div>';
    bd.onclick=function(){
      var sel=S.answers[e.id].sel; if(!sel||S.feedbackShown[e.id]) return;
      place(e,sel,bd); S.answers[e.id].sel=null;
      bank.querySelectorAll('.ditem').forEach(function(x){x.classList.remove('sel');});
    };
    bd.ondragover=function(ev){ ev.preventDefault(); bd.classList.add('over'); };
    bd.ondragleave=function(){ bd.classList.remove('over'); };
    bd.ondrop=function(ev){ ev.preventDefault(); bd.classList.remove('over');
      if(S.feedbackShown[e.id])return; place(e,ev.dataTransfer.getData('text/plain'),bd); };
    bwrap.appendChild(bd);
  });
  w.appendChild(bwrap);
  function place(e2,iid,bd){
    if(!iid) return;
    var it=e2.items.filter(function(x){return x.id===iid;})[0];
    var src=document.getElementById('bank_'+e2.id).querySelector('[data-iid="'+iid+'"]');
    if(!src) return; /* already placed: move back to bank first */
    src.remove();
    var chip=el('div','chipx'); chip.setAttribute('data-iid',iid);
    chip.innerHTML='<span>'+it.label+'</span>';
    var x=el('button','','&times;'); x.setAttribute('aria-label','Return item '+iid);
    x.onclick=function(ev){ ev.stopPropagation();
      if(S.feedbackShown[e2.id])return;
      chip.remove(); delete S.answers[e2.id].placed[iid];
      document.getElementById('bank_'+e2.id).appendChild(src);
    };
    chip.appendChild(x); bd.querySelector('.chips').appendChild(chip);
    S.answers[e2.id].placed[iid]=bd.getAttribute('data-bid');
  }
};
GRADER.dnd=function(e){
  var a=S.answers[e.id]||{placed:{}};
  var placedCount=Object.keys(a.placed).length;
  if(placedCount===0) return null;
  var h=0,wr=0,rows=[];
  e.items.forEach(function(it){
    var got=a.placed[it.id];
    var good=e.buckets.filter(function(b){return b.id===got;})[0];
    var goodBucket=good&&good.accepts.indexOf(it.id)>=0;
    if(got&&goodBucket){ h++; rows.push({label:it.label+' &rarr; '+good.label,state:'ok',why:it.why}); }
    else if(got){ wr++; var g2=e.buckets.filter(function(b){return b.id===got;})[0];
      rows.push({label:it.label+' &rarr; '+(g2?g2.label:'?'),state:'bad',why:it.why}); }
    else { rows.push({label:it.label+' (not placed)',state:'miss',why:it.why}); }
  });
  return {credit:scoreExercise(h,wr,e.items.length),h:h,n:e.items.length,rows:rows};
};

/* match */
RENDER.match=function(e,w){
  var rights=shuffle(e.rights.map(function(x){return x.id;}));
  S.answers[e.id]={pairs:{},selLeft:null};
  w.appendChild(el('div','small muted','Click one card on the left, then its partner on the right. Click a made pair to undo it.'));
  var wrap=el('div','matchwrap');
  var lcol=el('div','mcol'), rcol=el('div','mcol');
  e.lefts.forEach(function(l){
    var b=el('button','ditem'); b.type='button'; b.setAttribute('data-lid',l.id);
    b.innerHTML='&#9635; '+l.label;
    b.onclick=function(){
      if(S.feedbackShown[e.id])return;
      lcol.querySelectorAll('.ditem').forEach(function(x){x.classList.remove('sel');});
      b.classList.add('sel'); S.answers[e.id].selLeft=l.id;
    };
    lcol.appendChild(b);
  });
  rights.forEach(function(rid){
    var r=e.rights.filter(function(x){return x.id===rid;})[0];
    var b=el('button','ditem'); b.type='button'; b.setAttribute('data-rid',rid);
    b.innerHTML=r.label;
    b.onclick=function(){
      if(S.feedbackShown[e.id])return;
      var lid=S.answers[e.id].selLeft; if(!lid) return;
      var lb=lcol.querySelector('[data-lid="'+lid+'"]');
      lb.classList.remove('sel'); S.answers[e.id].selLeft=null;
      /* if this right card already paired, unpair it */
      var prev=Object.keys(S.answers[e.id].pairs).filter(function(k){return S.answers[e.id].pairs[k]===rid;})[0];
      if(prev!==undefined){ delete S.answers[e.id].pairs[prev]; unpairLine(e,prev); }
      if(S.answers[e.id].pairs[lid]){ unpairLine(e,lid); }
      S.answers[e.id].pairs[lid]=rid;
      var pl=document.getElementById('pairs_'+e.id);
      var line=el('div','pairline'); line.id='pair_'+lid;
      var lt=e.lefts.filter(function(x){return x.id===lid;})[0];
      line.innerHTML='&#8594; <b>'+lt.label+'</b> matched with <b>'+r.label+'</b> <button type="button" style="background:none;border:none;color:var(--text-secondary);cursor:pointer" aria-label="Undo pair">&times;</button>';
      line.querySelector('button').onclick=function(){ if(S.feedbackShown[e.id])return; unpair(e,lid); };
      pl.appendChild(line);
      var n=w.querySelector('.nudge'); if(n&&Object.keys(S.answers[e.id].pairs).length) n.remove();
    };
    rcol.appendChild(b);
  });
  wrap.appendChild(lcol); wrap.appendChild(rcol); w.appendChild(wrap);
  w.appendChild(el('div','','<div id="pairs_'+e.id+'" style="margin-top:10px"></div>'));
  function unpairLine(e2,lid){ var ln=document.getElementById('pair_'+lid); if(ln) ln.remove(); }
  function unpair(e2,lid){ delete S.answers[e2.id].pairs[lid]; unpairLine(e2,lid); }
};
GRADER.match=function(e){
  var a=S.answers[e.id]||{pairs:{}};
  if(Object.keys(a.pairs).length===0) return null;
  var h=0,wr=0,rows=[];
  e.lefts.forEach(function(l){
    var got=a.pairs[l.id];
    var r=got?e.rights.filter(function(x){return x.id===got;})[0]:null;
    if(got&&got===e.correct[l.id]){ h++; rows.push({label:l.label+' &rarr; '+r.label,state:'ok',why:l.why}); }
    else if(got){ wr++; rows.push({label:l.label+' &rarr; '+r.label,state:'bad',why:l.why}); }
    else { rows.push({label:l.label+' (unpaired)',state:'miss',why:l.why}); }
  });
  return {credit:scoreExercise(h,wr,e.lefts.length),h:h,n:e.lefts.length,rows:rows};
};

/* order / rank */
RENDER.order=function(e,w){
  var items=shuffle(e.items.map(function(x){return x.id;}));
  S.answers[e.id]=items;
  w.appendChild(el('div','small muted','Put the items in the right order. Use the arrows or drag an item onto another item.'));
  var list=el('div','orderlist'); list.id='olist_'+e.id;
  w.appendChild(list);
  function draw(){
    list.innerHTML='';
    S.answers[e.id].forEach(function(iid,i){
      var it=e.items.filter(function(x){return x.id===iid;})[0];
      var row=el('div','oitem'); row.draggable=true; row.setAttribute('data-iid',iid);
      row.innerHTML='<span class="onum">'+(i+1)+'</span><span class="otxt">'+it.label+'</span>'+
        '<span class="mv"><button type="button" data-d="-1" aria-label="Move up">&#9650;</button><button type="button" data-d="1" aria-label="Move down">&#9660;</button></span>';
      row.querySelector('[data-d="-1"]').onclick=function(){ if(S.feedbackShown[e.id])return; move(i,-1); };
      row.querySelector('[data-d="1"]').onclick=function(){ if(S.feedbackShown[e.id])return; move(i,1); };
      row.ondragstart=function(ev){ ev.dataTransfer.setData('text/plain',String(i)); };
      row.ondragover=function(ev){ ev.preventDefault(); };
      row.ondrop=function(ev){ ev.preventDefault(); if(S.feedbackShown[e.id])return;
        var from=parseInt(ev.dataTransfer.getData('text/plain'),10); if(isNaN(from))return;
        var arr=S.answers[e.id]; var m=arr.splice(from,1)[0]; arr.splice(i,0,m); draw(); };
      list.appendChild(row);
    });
  }
  function move(i,d){
    var arr=S.answers[e.id]; var j=i+d; if(j<0||j>=arr.length) return;
    var t=arr[i]; arr[i]=arr[j]; arr[j]=t; draw();
  }
  draw();
};
GRADER.order=function(e){
  var a=S.answers[e.id]; if(!a||!a.length) return null;
  var h=0,wr=0,rows=[];
  a.forEach(function(iid,pos){
    var it=e.items.filter(function(x){return x.id===iid;})[0];
    if(e.items[pos].id===iid){ h++; rows.push({label:'Position '+(pos+1)+': '+it.label,state:'ok',why:it.why}); }
    else { wr++; rows.push({label:'Position '+(pos+1)+': '+it.label,state:'bad',why:it.why+' (correct here: '+e.items[pos].label+')'}); }
  });
  return {credit:scoreExercise(h,wr,e.items.length),h:h,n:e.items.length,rows:rows};
};

/* fill (typed blanks; graded case-insensitive with whitespace normalised) */
RENDER.fill=function(e,w){
  S.answers[e.id]={};
  var line=el('div','fillline');
  e.segments.forEach(function(seg){
    if(seg.t==='txt'){ line.appendChild(document.createTextNode(seg.v)); }
    else {
      var s=el('input','fillblank'); s.type='text'; s.setAttribute('data-bid',seg.id);
      s.setAttribute('aria-label','Blank '+seg.id+' ('+seg.name+')');
      s.placeholder='type here'; s.autocomplete='off'; s.spellcheck=false;
      s.oninput=function(){ S.answers[e.id][seg.id]=s.value; var n=w.querySelector('.nudge'); if(n&&s.value)n.remove(); };
      line.appendChild(s);
    }
  });
  w.appendChild(line);
  if(e.bank&&e.bank.length){
    w.appendChild(el('div','small muted','Word bank for reference (some entries are decoys): '+e.bank.map(esc).join(' &middot; ')));
  }
};
GRADER.fill=function(e){
  var a=S.answers[e.id]||{};
  var any=e.blanks.some(function(b){ return a[b.id]&&String(a[b.id]).trim()!==''; });
  if(!any) return null;
  var h=0,wr=0,rows=[];
  e.blanks.forEach(function(b){
    var raw=(a[b.id]!==undefined)?String(a[b.id]):'';
    if(raw.trim()&&normText(raw)===normText(b.correct)){ h++; rows.push({label:'Blank "'+b.name+'": '+esc(raw),state:'ok',why:b.why}); }
    else if(raw.trim()){ wr++; rows.push({label:'Blank "'+b.name+'": '+esc(raw),state:'bad',why:b.why+' (correct: '+esc(b.correct)+')'}); }
