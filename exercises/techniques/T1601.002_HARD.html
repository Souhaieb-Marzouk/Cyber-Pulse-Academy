<script>
window.EXAM_DATA = {"topicId":"t1601.002","batch":3,"objectID":"T1601.002 — Downgrade System Image (Sub-Technique of T1601 — Modify System Image)","passMark":70,"timerSeconds":3840,"estimatedMinutes":64,"sev":{"key":"hard","label":"HARD"},"intro":{"title":"T1601.002 — HARD practice exam","object":"T1601.002 — Downgrade System Image · Sub-Technique of T1601 — Modify System Image · Tactic: Defense Impairment · Platform: Network Devices · ATT&CK Enterprise, v2.0","learn":"<p>This is the discrimination level. Here the artefacts look almost identical for an attack and for legitimate work, and your job is to tell them apart <b>with justification<\/b>. Imagine you are the senior analyst on shift: the queue says “old image booted on the edge firewall”, the room wants to escalate, and you are the one who must be right — in both directions.<\/p><p>The object stays the same <b>Sub-Technique<\/b>: T1601.002, Downgrade System Image, child of T1601 (Modify System Image), tactic Defense Impairment, platform Network Devices — an adversary with privileged access installs an older device OS to weaken security, and the change lands at the next reload. What changes at this level is the <b>quality of your reasoning<\/b>: two to four artefacts per case, near-miss options that are defensible somewhere else but wrong here, and at least one moment where the obvious answer is the wrong one.<\/p><p>You will work the tasks that senior roles actually own. A <b>detection engineer<\/b> tunes the AN1570 analytic so it pages on the correlated chain instead of every transfer, and learns why alerting on skipped checksum jobs is a coverage hole. An <b>incident responder<\/b> sequences evidence, containment, recovery and closure under a downtime budget. A <b>CTI analyst<\/b> maps observed behaviours to T1601.002, its sibling T1601.001, and the enabled behaviour T1600. A <b>control owner<\/b> defends why M1046 Boot Integrity, M1045 Code Signing, M1043 credential encryption and M1032 MFA blunt different steps. And everyone learns the two golden validation rules: <b>checksums beat version strings<\/b>, and validation must be <b>independent of the device CLI<\/b>, because actors with admin rights can alter what the device prints.<\/p>","themes":[{"name":"Analytic engineering (AN1570)","items":["Chain: transfer → boot-var → reload","Checksum mismatch as the paging condition","CLI-output tampering → independent validation","FP tuning: model baselines, allow-lists"]},{"name":"Evidence discrimination","items":["Ticket scope vs observed direction","Version string vs checksum conflict","Time-zone normalisation","Observation vs over-claiming"]},{"name":"Response sequencing","items":["Evidence before state change","Least-aggressive containment","Recovery in approved windows","Closure on verified clean boots"]},{"name":"Frame & mitigations","items":["T1601.002 + T1601.001 + T1600 mapping","M1045/M1046 integrity controls","M1043 credential protection","M1032 MFA on admin paths"]}],"how":"<p>This is a <b>certification-style practice exam<\/b>. You need <b>70%<\/b> to pass. Every exercise keeps the same three blocks: <b>SCENARIO<\/b> (blue, with labelled artefact sub-panels and a filter box on log viewers), <b>QUESTION<\/b> (amber) and <b>YOUR ANSWER<\/b> (green). Expect near-miss options: at least two choices are defensible in a different context — only one is correct here, and the feedback explains why.<\/p><p><b>Exercise types in this file:<\/b> single and multi-select choice with near-miss distractors, artefact-to-analytic matching, drag &amp; drop mitigation mapping, timestamp-trap ordering, alert ranking, an analytic flaw hunt, tuning fill-ins, an incident simulation across four stages, branching decisions with real business cost, a red/blue dual-perspective case, and one terminal exercise where the tool is <b>not<\/b> named — you choose it.<\/p><p><b>Timer:<\/b> the countdown runs while you work. <b>Manual Pause<\/b> hides the exercise for a break and stops the clock. <b>Check auto-pause<\/b> stops it the instant you press Check so you can study the item-by-item feedback; it resumes only on Next. Skip and Hint never stop the clock.<\/p><p><b>Scoring:<\/b> multi-item exercises use partial credit — credit = max(0, (H − W) / N); wrong picks subtract, and selecting everything scores zero. One hint per exercise costs 10% of that exercise's credit. <b>Skipping:<\/b> skipped exercises go to a review pool you can revisit while the timer runs; anything unanswered at submit is excluded from the score. Press Start when ready.<\/p>","types":[]},"exercises":[{"id":"h01","type":"mc","summary":"Log viewer — the contractor transfer that looks terrible","scen":{"lead":"Northwind Port Authority, Tuesday 09:40. The SIEM queue holds an alarming-looking case. Use the filter box in the log if you need it, and check every artefact before you answer.","arts":[{"label":"ARTEFACT 1 — TACACS+ command log (core-rtr-01)","body":"<span class=\"ln\"><b class=\"t\">01:58:11<\/b> user=ext-contractor-2 priv=15 cmd=copy scp://10[.]77[.]3[.]8/fw-edge-k9-2024.bin flash:<\/span>\n<span class=\"ln\"><b class=\"t\">02:03:47<\/b> user=ext-contractor-2 priv=15 cmd=boot system flash:fw-edge-k9-2024.bin<\/span>\n<span class=\"ln\"><b class=\"t\">02:10:03<\/b> user=ext-contractor-2 priv=15 cmd=<b class=\"s\">reload<\/b><\/span>\n<span class=\"ln\"><b class=\"t\">02:12:29<\/b> user=ext-contractor-2 priv=15 cmd=exit<\/span>","filter":true},{"label":"ARTEFACT 2 — Change CHG-3308 (approved)","body":"Vendor firmware refresh, window 02:00-04:00.\nScope: \"fleet-wide image refresh to vendor-recommended releases\"\nImplementer: ext-contractor-2 (vetted, MFA-enforced)."},{"label":"ARTEFACT 3 — Image registry","body":"fw-edge-k9-2024.bin = release 9.18(4) — vendor-recommended\nPreviously installed on core-rtr-01: release 9.22(2) — newer"}]},"question":"The transfer of an older release (9.18 vs 9.22) looks like a downgrade. What is the correct next action?","hint":"The window, the ticket and the identity all fit. What does NOT fit yet is the direction — so what do you do before raising any alarm?","correct":"<b>Verify the ticket scope before escalating<\/b>: ask the change owner whether the fleet-wide refresh deliberately includes a rollback to 9.18 for this router, and freeze the device meanwhile.","expl":"Everything matches except one fact: the release moved backwards while the ticket says a refresh to vendor-recommended releases. Occasionally a vendor DOES recommend an older branch for a device with a compatibility fault, so this can still be legitimate — which makes it a change-review question, not an incident page yet. The least aggressive correct action is to verify scope with the change owner and keep the device under watch; wiping, reloading or wiping the image would destroy evidence and possibly break a justified change. What to study: verifying change scope before escalation.","items":[{"label":"The next action","note":"Scope check with the change owner, device kept under watch — the least aggressive action that still addresses the direction mismatch."}],"data":{"options":["Escalate to incident immediately — any older image is an attack","Verify with the change owner whether the rollback is in scope, keep the device under watch","Close as benign — the window, ticket and contractor all match","Delete the transferred image from flash right away"],"correct":1}},{"id":"h02","type":"mcs","summary":"Which conclusions does the evidence actually support?","scen":{"lead":"You inherit an evidence package from the night shift. Seven claims circulate in chat. Select the three that the artefacts genuinely support — the other four sound right but are not backed.","arts":[{"label":"ARTEFACT 1 — transfer log (TFTP 10[.]77[.]3[.]8)","body":"23:41 GET /dist-sw-05-rescue.bin — requester dist-sw-05\n23:44 PUT /dist-sw-05-config-2026.cfg — requester dist-sw-05"},{"label":"ARTEFACT 2 — dist-sw-05 console, after 23:52 reload","body":"System image file: \"flash:dist-sw-05-rescue.bin\"\nVersion string: rescue image 15.2(7)E3 (2021, recovery branch)"},{"label":"ARTEFACT 3 — baseline record","body":"Approved image for dist-sw-05: 15.2(7)E4b (production branch)\nrescue images are NOT approved as production boot images"}]},"question":"Select the three fully supported conclusions.","hint":"Support means: the artefacts show it, not that it feels likely. Check each claim against a specific line.","correct":"(1) dist-sw-05 booted a rescue-branch image; (2) the running image differs from the approved production baseline; (3) a config file was written OUT of the device during the window (the PUT). Claims about who did it or why are not in the evidence.","expl":"Claim by claim: the console capture shows a rescue-branch image booted — supported. The baseline record names a different approved production image — supported. The TFTP log shows a PUT of a config archive from the device — supported. Nothing identifies the actor (no user in the TFTP log), nothing proves theft of data (a config PUT is not exfiltration evidence yet), and nothing shows the boot variable was changed by attacker tooling rather than a typed command. Over-claiming is how incidents get mis-scoped. What to study: separating observation from interpretation.","items":[{"label":"Claim: device booted a rescue image","note":"Supported by the post-reload console capture (version string 15.2(7)E3 rescue)."},{"label":"Claim: running image differs from baseline","note":"Supported: baseline says 15.2(7)E4b production; device runs 15.2(7)E3 rescue."},{"label":"Claim: a config file left the device in the window","note":"Supported by the TFTP PUT line at 23:44."},{"label":"Claim: a stolen admin account did this","note":"Not in evidence: the TFTP log names no user account."},{"label":"Claim: data was exfiltrated to a competitor","note":"Not in evidence: the PUT went to the internal TFTP server."},{"label":"Claim: the boot variable was changed by a script","note":"Not in evidence: no command log in the package shows how the change was made."},{"label":"Claim: the device is fully compromised","note":"Not in evidence: one artefact set cannot establish full compromise."}],"data":{"options":["The device booted a rescue-branch image","The running image differs from the approved baseline","A config file was written out of the device in the window","A stolen admin account performed the change","Data was exfiltrated to a competitor","The boot variable was changed by an automated script","The device is fully compromised"],"correct":[0,1,2]}},{"id":"h03","type":"term","summary":"Terminal — prove integrity without trusting the CLI","scen":{"lead":"Terminal exercise: the tool is NOT named. You are on the console of dist-sw-05 with privilege 15. The stakeholder wants proof that the image in flash matches the vendor-published checksum. Remember the analytic's warning: actors with admin rights can alter what the device prints, so your choice of command matters.","arts":[{"label":"ARTEFACT — environment","body":"Device console, privilege 15. File in flash: dist-sw-05-rescue.bin\nVendor bulletin publishes the MD5 for this file.\nGoal: compute the file's checksum ON the device."}]},"question":"Type the command that computes the file checksum, and nothing that changes the device.","hint":"You need the IOS command that hashes a file, with the hashing method the vendor bulletin uses, pointed at the file in flash. Commands that begin with \"show\" only repeat what the device wants to tell you.","correct":"<b>verify /md5 flash:dist-sw-05-rescue.bin<\/b> — computes the MD5 on the device so you can compare it with the vendor bulletin.","expl":"<b>verify /md5<\/b> is the correct choice: it recomputes the file hash from flash bytes, so a tampered image cannot match the vendor value even if the version string has been made to look right. <span class=\"mono\">show version<\/span> is the near-miss: it prints what the running system claims about itself, which the analytic explicitly flags as tamperable. Nothing state-changing belongs in an evidence step. What to study: independent integrity validation versus trusting CLI output.","items":[{"label":"Checksum command used (not a show command)","note":"verify recomputes the hash from the file bytes on disk."},{"label":"MD5 method selected","note":"The vendor bulletin publishes MD5 values, so /md5 matches the reference."},{"label":"Flash file targeted","note":"The target is flash: followed by the image file name."},{"label":"Nothing state-changing executed","note":"The evidence step must not alter the device."}],"data":{"mode":"free","banner":"dist-sw-05 con0 — privilege 15 — evidence collection — training simulator","prompt":"dist-sw-05#","runOut":"..........................................................Done!\nverify /md5 (flash:dist-sw-05-rescue.bin) = a3f9 11c0 8b47 de22 !","elements":[{"kind":"need","re":"\\bverify\\b","label":"Checksum command used (not a show command)"},{"kind":"need","re":"\\/md5","label":"MD5 method selected"},{"kind":"need","re":"flash\\s*:\\s*\\S+","label":"Flash file targeted"},{"kind":"forbid","re":"\\b(reload|erase|format|write|copy|conf\\w*)\\b","label":"Nothing state-changing executed"}],"dangerRe":"\\bshow\\s+version\\b","dangerNote":"\"show version\" alone would have been a dangerous near-miss here: it only reads back what the running system claims, and this analytic specifically warns that CLI output can be tampered with. It cannot prove file integrity.","canonical":"verify /md5 flash:dist-sw-05-rescue.bin"}},{"id":"h04","type":"match","summary":"Artefacts to analytic conditions","scen":{"lead":"The detection engineering team wants the AN1570 conditions labelled with the artefacts that satisfy them. Two artefacts are decoys that satisfy nothing. Match all five.","arts":[{"label":"ARTEFACT — the conditions (from the ATT&CK page)","body":"C1 anomalous transfer of an OS image file\nC2 config change pointing boot variables at older images\nC3 unexpected OS version string after reboot\nC4 checksum mismatch against the approved baseline\nC5 CLI-output tampering requiring independent validation"}]},"question":"Match each artefact to the condition it satisfies.","hint":"Two decoys exist. A nightly backup and a healthy upgrade do not map to any downgrade condition.","correct":"1→C1, 2→C2, 3→C3, 4→C4, 5→C5. The backup job and the approved upgrade satisfy no condition.","expl":"Each mapping follows the analytic wording: the TFTP GET of an image file is condition 1; the boot-variable line is condition 2; the odd post-reboot version string is condition 3; the failed comparison is condition 4; and the doctored <span class=\"mono\">show<\/span> output is condition 5 — the reason the analytic demands independent validation. The nightly backup moves configuration, not OS images, and the approved upgrade moves the version <i>forward<\/i>; neither is a downgrade signal. What to study: turning analytic conditions into concrete log matching.","items":[{"label":"TFTP GET of an OS image at 03:03","note":"C1 — anomalous file transfer of an OS image."},{"label":"boot system flash:&lt;older&gt; diff line","note":"C2 — boot configuration altered toward an older image."},{"label":"Post-reboot string shows 2021 release","note":"C3 — unexpected OS version string after reboot."},{"label":"Flash checksum fails against baseline","note":"C4 — checksum mismatch against the approved baseline."},{"label":"show version output disagrees with console","note":"C5 — CLI output tampering; validate independently."}],"data":{"lefts":["TFTP GET of an OS image at 03:03","boot system flash:&lt;older&gt; diff line","Post-reboot string shows a 2021 release","Flash checksum fails against baseline","show version output disagrees with the console capture"],"rights":["C1 anomalous image transfer","C2 boot-variable alteration","C3 unexpected version string after reboot","C4 checksum mismatch vs baseline","C5 CLI-output tampering","Not a condition — routine backup activity","Not a condition — approved upgrade"],"correct":[0,1,2,3,4]}},{"id":"h05","type":"order","summary":"Timeline with a poisoned timestamp","scen":{"lead":"Six events, but one device reports in UTC while the SIEM stores local time (UTC+2 in summer). Reorder the events into the TRUE chronology; the log line marked UTC is the trap.","arts":[{"label":"ARTEFACT — events (note the TZ marker)","body":"• 02:31 LOCAL — boot variable change on lb-fw-01\n• 00:40 UTC — TFTP GET of fw-old-branch.bin from 10[.]77[.]3[.]8\n• 02:44 LOCAL — %SYS-5-RELOAD on lb-fw-01\n• 02:50 LOCAL — post-reboot version string captured\n• 02:35 LOCAL — SIEM alert raised on the transfer\n• 02:20 LOCAL — security ticket INC-8841 opened by duty analyst"}]},"question":"Order the six events by when they truly happened.","hint":"Convert the UTC line to local time first (UTC+2 in summer): 00:40 UTC is 02:40 local — it lands BETWEEN the boot-variable change and the reload.","correct":"<b>True order:<\/b> INC-8841 opened 02:20 local → boot-variable change 02:31 → SIEM alert 02:35 → TFTP transfer 00:40 UTC (= 02:40 local) → reload 02:44 → version capture 02:50.","expl":"The UTC line converts to 02:40 local (UTC+2), so the transfer actually happened after the boot-variable change and after the alert — a strong sign the transfer log's clock or the reporting path is skewed, which is itself worth a finding. The INC ticket at 02:20 opens the sequence, then the boot-variable change at 02:31, the alert at 02:35, the transfer at 02:40, the reload at 02:44 and the version capture at 02:50. Time-zone handling is a classic timeline trap: without conversion you would read the chain backwards. What to study: normalising timestamps before timeline work.","items":[{"label":"INC-8841 opened (02:20 local)","note":"Earliest: the analyst opened the ticket before the visible device events."},{"label":"Boot-variable change (02:31 local)","note":"Second: the config change precedes the alert about it."},{"label":"SIEM alert (02:35 local)","note":"Third: monitoring reacted to the config change."},{"label":"TFTP GET (00:40 UTC = 02:40 local)","note":"Fourth after conversion: the poisoned timestamp must be normalised."},{"label":"Reload (02:44 local)","note":"Fifth: the device restarted after the transfer."},{"label":"Version string captured (02:50 local)","note":"Last: observed after the reload completed."}],"data":{"entries":["INC-8841 opened 02:20 LOCAL","Boot variable changed 02:31 LOCAL","SIEM alert raised 02:35 LOCAL","TFTP GET 00:40 UTC (= 02:40 local)","%SYS-5-RELOAD 02:44 LOCAL","Version string captured 02:50 LOCAL"],"mode":"timeline"}},{"id":"h06","type":"selects","summary":"Spot the flaw in the draft analytic","scen":{"lead":"Spot-the-mistake: a junior engineer drafted a SIEM analytic for image downgrades. Exactly ONE line of the draft is the flaw that breaks coverage. Pick it.","arts":[{"label":"ARTEFACT — draft analytic v0.3","body":"Line 1: alert when the TFTP/SCP/FTP log shows any OS image file transfer\nLine 2: alert when a boot variable changes to an image marked older than approved\nLine 3: alert when a post-reboot version string is OLDER than the approved baseline\nLine 4: alert when checksum verification is skipped for speed\nLine 5: baseline the fleet per device model to cut noise"}]},"question":"Which line is the coverage-breaking flaw?","hint":"One line watches a scheduler event instead of device state. Ask which condition from the page's guidance becomes unreachable as drafted.","correct":"<b>Line 4 is the coverage-breaking flaw.<\/b> It alerts when a checksum job is SKIPPED, but it never alerts on a checksum MISMATCH — so the strongest tamper signal in the whole analytic has no trigger.","expl":"Line 4 as drafted watches a scheduler event, not device state: if a tampered image is verified and MISMATCHES, no line in the analytic ever fires — the core condition from the page's guidance (checksum mismatch against the approved baseline) is unreachable. The fix is one word: alert on mismatches, not on skips. Lines 2, 3 and 5 are sound; Line 1 is noisy but not blind — noise wastes time, a missing condition loses the case. What to study: alert on state mismatches, not on process conveniences.","items":[{"label":"The coverage-breaking line","note":"Line 4 — alerting on skipped verification instead of checksum mismatches leaves the core condition of the analytic uncovered."}],"data":{"text":"The coverage-breaking flaw is {{0}}.","slots":[{"opts":["Line 4 — it alerts on skipped checksum jobs instead of on checksum mismatches","Line 2 — boot-variable alerts are too noisy to ever tune","Line 5 — baselining per model is never useful"],"correct":0}]}},{"id":"h07","type":"dnd","summary":"Mitigation mapping — and the bucket that does not apply","scen":{"lead":"Mapping exercise with near-misses. Five proposed actions from the hardening workshop: four map cleanly to a T1601.002 mitigation; one does NOT address this technique at all.","arts":[{"label":"ARTEFACT — workshop proposals","body":"P1 accept only vendor-signed images (M1045)\nP2 verify image integrity cryptographically at boot (M1046)\nP3 enforce MFA on all device admin paths (M1032)\nP4 encrypt locally stored device passwords (M1043)\nP5 monthly phishing awareness training"}]},"question":"Drag each proposal to the right bucket.","hint":"Two proposals are identity controls, two are image-integrity controls, and one is a good idea that has nothing to do with image downgrades.","correct":"P1 and P2 are image-integrity controls (M1045, M1046); P3 and P4 are identity/credential controls (M1032, M1043); P5 does not address this technique.","expl":"<b>P1/P2<\/b> strike the image itself: signing refuses attacker images at install, boot verification refuses tampered images at load. <b>P3/P4<\/b> strike the access the attacker needs: MFA on admin paths, and encrypted local credential storage so a harvested config file does not yield reusable passwords (M1043 — Credential Access Protection). <b>P5<\/b> is a worthwhile programme, but phishing training addresses email-borne compromise, not a privileged actor replacing a device image — it lands in the does-not-apply bucket. What to study: matching controls to the step they actually blunt.","items":[{"label":"P1 vendor-signed images only","note":"M1045 Code Signing — refuses unsigned images at install."},{"label":"P2 cryptographic boot verification","note":"M1046 Boot Integrity — refuses tampered images at boot."},{"label":"P3 MFA on device admin paths","note":"M1032 — blocks password-only privileged logins."},{"label":"P4 encrypt local device passwords","note":"M1043 Credential Access Protection — keeps harvested configs from yielding passwords."},{"label":"P5 phishing awareness training","note":"Good programme, wrong technique: it does not stop a privileged image replacement."}],"data":{"items":["P1 vendor-signed images only","P2 cryptographic boot verification","P3 MFA on device admin paths","P4 encrypt local device passwords","P5 phishing awareness training"],"zones":[{"name":"Image-integrity controls","icon":"⚓"},{"name":"Identity & credential controls","icon":"⚿"},{"name":"Does not address T1601.002","icon":"✗"}],"correct":[0,0,1,1,2]}},{"id":"h08","type":"mc","summary":"The calm version string that lies","scen":{"lead":"Looks-benign-but-is-not. Two weeks after the fleet refresh, the weekly compliance report shows dist-sw-05 as fully GREEN: version string matches the approved baseline exactly. An intern suggests closing the case. Then you open the raw integrity export.","arts":[{"label":"ARTEFACT 1 — compliance report","body":"dist-sw-05  version 15.2(7)E4b  MATCHES baseline  ✓ GREEN"},{"label":"ARTEFACT 2 — integrity export (same scan)","body":"flash file: dist-sw-05-prod.bin\ncomputed MD5: 77ac 41b0 9d32 e5f1\nbaseline MD5: 08be 77d2 c011 4a36\nresult: <b class=\"s\">MISMATCH<\/b>"}]},"question":"Version matches, checksum does not. What is the correct reading?","hint":"One signal observes the software's self-description; the other observes the actual bytes. When they disagree, which one can an attacker with admin rights edit?","correct":"<b>The checksum wins — treat the device as running tampered code<\/b>: the version string is a self-report the running system can be made to print, while the mismatch means the bytes on flash differ from the approved image.","expl":"A matching version string with a failing checksum is the signature of a doctored image — the classic combination the framework describes when a downgrade is paired with the sibling technique Patch System Image (T1601.001): the attacker rebuilds or patches an image so it reports the expected version while carrying altered code. The version string is generated by the very code under suspicion; the checksum is computed from the file bytes. The intern's green report is exactly the blind spot this pairing creates. What to study: version strings versus checksums, and T1601.002 + T1601.001 combined use.","items":[{"label":"The correct reading","note":"Bytes beat self-reports: a checksum mismatch with a clean version string indicates a patched/doctored image (possible T1601.001 + T1601.002 combination)."}],"data":{"options":["Close the case — the version string is authoritative","Treat as tampered: the checksum mismatch outweighs the version string","Reboot the device and hope the version fixes itself","Trust the compliance report because it is automated"],"correct":1}},{"id":"h09","type":"flow","summary":"IR simulation — the edge firewall case, four stages","scen":{"lead":"Incident-response simulation on lb-fw-01, Northwind's edge firewall. A confirmed tampered image sits in flash; the device is still passing production traffic. Choose the response at each of four stages — the least aggressive sufficient action is what the scenario rewards.","arts":[{"label":"ARTEFACT — situation board","body":"lb-fw-01: production edge firewall, sole path to the internet.\nFlash holds an image whose checksum fails the baseline.\nBoot variable already points at the tampered file.\nVendor image + checksum available on the offline repository.\nBusiness constraint: maximum 15 minutes downtime, change window tonight."}]},"question":"Pick the best action for each of the four stages.","hint":"Preserve evidence before you touch state; schedule the disruptive step instead of improvising it; and never trust the sick device to describe itself.","correct":"Stage 1: archive config and image hash records BEFORE touching the device. Stage 2: do not reload mid-day — contain by monitoring and restrict management access. Stage 3: tonight's window: reload from the vendor image, then re-verify. Stage 4: compare against the baseline and close only after two clean cycles.","expl":"Stage 1: evidence first — configuration, image hash, transfer logs — because a reload overwrites much of the picture. Stage 2 is the least-aggressive trap: reloading now would drop the edge path for hours before the change window and destroy running state; enhanced monitoring plus management-access restriction contains the risk. Stage 3 uses the approved window and the vendor image, not a quick wipe. Stage 4 closes on verification, not on hope: checksums matching the baseline across two boot cycles. What to study: response sequencing under downtime constraints.","items":[{"label":"Stage 1 — first move","note":"Archive config, hash the image, secure the logs — evidence before state changes."},{"label":"Stage 2 — mid-day containment","note":"Keep the device serving under enhanced monitoring; restrict management access. No reload yet."},{"label":"Stage 3 — the fix","note":"In the approved window: boot the vendor image from the offline repository, then re-verify."},{"label":"Stage 4 — closure","note":"Close only after clean checksum verification across two boot cycles."}],"data":{"steps":[{"scen":"<b>STEP 1 OF 4<\/b> — The tampered image is confirmed. Nothing has been touched yet.","question":"First action?","opts":["Archive config, hash the flash image, secure TFTP and AAA logs","Reload the firewall immediately from the vendor image","Erase flash to remove the tampered file"],"correct":0},{"scen":"<b>STEP 2 OF 4<\/b> — Evidence is secured. It is 10:30, production traffic is flowing, the change window opens tonight.","question":"Containment decision?","opts":["Keep serving under enhanced monitoring; restrict management access until the window","Force a reload now — the risk is unacceptable","Unplug the firewall — the edge must be isolated"],"correct":0},{"scen":"<b>STEP 3 OF 4<\/b> — The change window opens tonight.","question":"Recovery action?","opts":["Boot the vendor image from the offline repository, then verify the checksum","Boot the existing flash file after ‘cleaning’ it","Reload and hope the device picks the right file"],"correct":0},{"scen":"<b>STEP 4 OF 4<\/b> — The firewall rebooted into the vendor image.","question":"Closure criterion?","opts":["Two consecutive boot cycles with checksums matching the baseline","One clean version string","The ticket owner says it is fine"],"correct":0}]}},{"id":"h10","type":"fill","summary":"Tune the analytic — three blanks","scen":{"lead":"The detection engineer's tuning note has three gaps. Fill them with the words that make the analytic both quieter and sharper.","arts":[{"label":"ARTEFACT — tuning note v1.0","body":"\"Base the approved image list on device ______ so each model compares\nagainst its own reference. Alert on checksum ______, never on skipped jobs.\nBoot-variable alerts must ______ with a reload signal before paging —\ntransfers alone stay informational.\""}]},"question":"Type the three missing words.","hint":"Blank 1: what you group devices by. Blank 2: the condition that fires. Blank 3: what two signals must do before a page goes out.","correct":"per device <b>model<\/b> · alert on checksum <b>mismatch<\/b> · signals must <b>correlate<\/b> (boot-var change AND reload) before paging.","expl":"Grouping by <b>model<\/b> kills the false positives that come from comparing a switch against a router reference. Alerting on <b>mismatch<\/b> covers the tamper condition that skipped-job alerting misses entirely. Correlating the boot-variable change with a <b>reload<\/b> turns three low-quality signals into one high-quality page — the suspicious chain from the analytic is exactly this sequence. What to study: FP reduction without coverage loss.","items":[{"label":"Blank 1 — grouping key","note":"Baselines are per device model, so comparisons hit the right reference image."},{"label":"Blank 2 — alert condition","note":"Mismatch is the condition; skipped jobs carry no signal about the bytes."},{"label":"Blank 3 — paging rule","note":"The chain (transfer → boot-var → reload) is what deserves a page, not any single line."}],"data":{"text":"Base the list on device ⟦0⟧. Alert on checksum ⟦1⟧, never on skipped jobs. Boot-variable alerts must ⟦2⟧ with a reload signal before paging.","blanks":[["model","type","platform"],["mismatch","mismatches","difference","failure"],["correlate","correlation","pair","chain"]],"bank":["mismatch","correlate","model"]}},{"id":"h11","type":"mcs","summary":"FP reduction without coverage loss — pick three","scen":{"lead":"The analytic pages too often. Six tuning proposals are on the table. Select the THREE that reduce false positives without losing coverage of T1601.002 — the others each cut coverage somewhere.","arts":[{"label":"ARTEFACT — proposals","body":"T1: baseline per device model; store references off-device\nT2: drop the version-string condition entirely (checksums exist)\nT3: allow-list transfers only from the patch repository, only inside approved windows — still log them\nT4: ignore boot-variable changes when a change ticket exists\nT5: require the chain (transfer + boot-var + reload) for a page; keep single signals informational\nT6: checksum only one device per site per week (sampling)"}]},"question":"Select the three sound tuning changes.","hint":"One proposal drops a condition the analytic explicitly needs; one trusts paperwork instead of telemetry; one samples away most of the coverage.","correct":"T1, T3 and T5. T2 discards a tamper-detectable condition; T4 lets a ticket legitimise hostile changes; T6 samples away most of the fleet's coverage.","expl":"<b>T1<\/b> removes wrong-reference comparisons; storing references off-device also survives admin-level tampering. <b>T3<\/b> narrows transfer alerting to the paths legitimate work actually uses, while keeping the telemetry flowing for the chain logic. <b>T5<\/b> pages on the correlated chain, which is the analytic's own definition of suspicious. <b>T2<\/b> is the subtle one: the version-string condition is what catches a doctored image whose version lies — dropping it loses the T1601.001-pairing detection. <b>T4<\/b> teaches attackers to bring tickets. <b>T6<\/b> turns continuous control into a lottery. What to study: tuning as precision engineering, not volume reduction.","items":[{"label":"T1 model baselines off-device","note":"Sound: kills wrong-reference FPs and resists baseline tampering."},{"label":"T2 drop version-string condition","note":"Unsound: loses detection of doctored images that report a clean version."},{"label":"T3 repository + window allow-list","note":"Sound: legitimate paths become quiet; everything else stays visible."},{"label":"T4 trust any ticketed boot-var change","note":"Unsound: paperwork is not telemetry — attackers exploit exactly this."},{"label":"T5 page on the full chain","note":"Sound: the correlated chain is the high-signal event."},{"label":"T6 weekly sampling","note":"Unsound: coverage drops from continuous to sparse — defeats the control."}],"data":{"options":["T1 baseline per model, references off-device","T2 drop the version-string condition","T3 allow-list repository transfers in approved windows","T4 ignore ticketed boot-variable changes","T5 page on transfer + boot-var + reload chain","T6 checksum one device per site per week"],"correct":[0,2,4]}},{"id":"h12","type":"flow","summary":"Dual perspective — defeating the checksum baseline","scen":{"lead":"Dual-perspective exercise, two steps. Northwind has now deployed everything from the workshop: signed images where the platform supports it, model baselines stored off-device, chain-based paging. STEP 1 is red, STEP 2 is blue.","arts":[{"label":"ARTEFACT — current defences","body":"• Boot integrity: image signature checked at boot (where supported)\n• Baselines: per-model, stored on the hardened mgmt-vault host\n• Paging: transfer + boot-var + reload chain, SIEM-correlated\n• MFA on all device admin paths"}]},"question":"Red first, then blue.","hint":"Red: when the device refuses unsigned code and the reference lives elsewhere, what asset becomes the target? Blue: which control decides the contest even then?","correct":"Red: attack the baseline store (mgmt-vault) — a doctored image fails on-device signing, so the viable path is poisoning the reference data. Blue: independent, out-of-band validation against vendor-published hashes still exposes it.","expl":"Red view: with boot signing on and per-model baselines off-device, replacing the flash file is a losing move — the device itself refuses it at boot. The red shift therefore targets the <i>comparison data<\/i>: compromise mgmt-vault and make the lie official. Blue view: this is why the analytic demands validation against <b>vendor-published<\/b> hashes through an independent channel — a poisoned internal baseline loses to the vendor's signed bulletin. Defence lesson: the integrity of the reference store is now part of the technique's control set. What to study: where the trust anchor lives.","items":[{"label":"Red decision — viable path","note":"Poison the baseline store: on-device tampering now fails signature checks."},{"label":"Blue decision — the decider","note":"Independent validation against vendor-published hashes defeats a poisoned internal baseline."}],"data":{"steps":[{"scen":"<b>STEP 1 OF 2<\/b> — RED. Boot signing refuses unsigned images; baselines sit on mgmt-vault; the chain pages on any reload anomaly. Which path keeps a downgraded-feeling foothold viable?","question":"Which red path do you take?","opts":["Target mgmt-vault — poison the per-model baseline data","Flash an older image anyway — the device will accept it eventually","Spam the SIEM with fake transfers to hide in noise"],"correct":0},{"scen":"<b>STEP 2 OF 2<\/b> — BLUE. Suspicion: the internal baseline may already be poisoned. Which validation decides the contest?","question":"Which blue control decides it?","opts":["Out-of-band comparison against vendor-published hashes","Re-reading the internal baseline and trusting mgmt-vault","Asking the device to confirm its own version"],"correct":0}]}},{"id":"h13","type":"flow","summary":"Decision tree — the mismatch that costs money","scen":{"lead":"Branching scenario with a real cost. Friday, 11:00. Payment-gateway firewall pay-fw-01 fails checksum validation. A reload forces a 12-15 minute outage of card payments; the business loses roughly 40k per hour of downtime. Every option has a price; pick the sequence you can defend.","arts":[{"label":"ARTEFACT — decision board","body":"pay-fw-01: sole payment-path firewall. Checksum: MISMATCH (confirmed,\nindependent vendor hash comparison). Boot var: points at the mismatching file.\nChange window: tonight 22:00. CISO needs a decision now."}]},"question":"Work the three decisions in order.","hint":"The question is never ‘can we fix it’ but ‘what risk do we carry until tonight, and can we watch it tightly enough’.","correct":"1) Accept interim risk under compensated monitoring (do NOT reload mid-day); 2) prepare the vendor image and rollback plan before the window; 3) reload in the window and validate against the vendor hash — accepting the known 15-minute cost.","expl":"Decision 1: the confirmed mismatch means the device cannot be trusted, but an immediate reload costs the business 8-10k — the defensible call is enhanced, compensated monitoring (out-of-band config diffs, transfer watch, management-path lock) until tonight, explicitly accepted by the CISO. Decision 2: the window work is prepared in advance — image, vendor hash, rollback — so the outage is minutes, not hours. Decision 3: the reload happens with the known, agreed cost; that is what ‘accepting a real cost’ looks like in practice. What to study: risk acceptance with compensating controls.","items":[{"label":"Decision 1 — mid-day posture","note":"Interim risk accepted with compensating monitoring; no revenue-losing panic reload."},{"label":"Decision 2 — window preparation","note":"Vendor image, vendor hash and rollback plan staged before the window opens."},{"label":"Decision 3 — the fix and its cost","note":"Reload inside the window; the agreed downtime is the accepted price of a trusted boot."}],"data":{"steps":[{"scen":"<b>STEP 1 OF 3<\/b> — 11:00 Friday. Mismatch confirmed. Reload now costs ~8-10k in card-payment downtime.","question":"What is the defensible posture until tonight?","opts":["Compensated monitoring: out-of-band diffs, management lock, transfer watch — reload tonight","Reload immediately — security beats revenue","Switch the firewall off until the window — safest of all"],"correct":0},{"scen":"<b>STEP 2 OF 3<\/b> — The window is confirmed for 22:00.","question":"What must be ready BEFORE 22:00?","opts":["Vendor image, vendor hash, rollback plan, change record","Nothing — improvise live to keep the plan flexible","A press release about the outage"],"correct":0},{"scen":"<b>STEP 3 OF 3<\/b> — 22:00. The window opens.","question":"Execute — and accept which cost?","opts":["The 12-15 minute payment outage, then validate against the vendor hash","No cost — a hot-swap with zero downtime","Infinite cost — leave the old image running"],"correct":0}]}},{"id":"h14","type":"match","summary":"Campaign behaviours to ATT&CK objects","scen":{"lead":"The CTI team summarises Northwind's quarter: one campaign, six behaviours. Map each behaviour to the ATT&CK object it belongs to. All objects come from the technique page's own frame.","arts":[{"label":"ARTEFACT — campaign summary (behaviours 1-6)","body":"B1 a 2021 rescue image was booted on dist-sw-05\nB2 the booted image had been rebuilt: version lied, bytes differed\nB3 after the downgrade, sessions negotiated weak legacy ciphers\nB4 signed-image enforcement was bypassed via a rebuilt image\nB5 every observed behaviour sat in the Defense Impairment column\nB6 the actor moved within the image pipeline of a network device"}]},"question":"Match each behaviour to its ATT&CK object.","hint":"Only two behaviours are techniques by ID; one names the tactic; the mapping objects come from the mitigation frame.","correct":"B1 → T1601.002 (the downgrade itself); B2 → T1601.001 (patching/rebuilding the image); B3 → T1600 (Weaken Encryption enabled); B4 → M1045/M1046 bypass discussion — frame it against the Code Signing/Boot Integrity controls; B5 → the Defense Impairment tactic; B6 → the parent technique T1601.","expl":"<b>B1<\/b> is the downgrade behaviour itself — T1601.002. <b>B2<\/b> describes modifying/rebuilding the image the device runs, which is the sibling Patch System Image (T1601.001) in combination with the downgrade — the pairing that beats naive version checks. <b>B3<\/b> is the downstream payoff the page names: enabling Weaken Encryption (T1600). <b>B4<\/b> is expressed against the two integrity mitigations (M1045 Code Signing, M1046 Boot Integrity) — a rebuilt-but-resigned image is exactly what those controls exist to catch. <b>B5<\/b> names the tactic, and <b>B6<\/b> describes the parent technique T1601, Modify System Image. What to study: mapping observed behaviour onto the ATT&CK frame around one technique.","items":[{"label":"B1 older image booted","note":"T1601.002 — Downgrade System Image, the core behaviour."},{"label":"B2 image rebuilt, version lied","note":"T1601.001 — Patch System Image, used in combination with the downgrade."},{"label":"B3 weak legacy ciphers negotiated","note":"T1600 — Weaken Encryption, the enabled behaviour the page names."},{"label":"B4 signature bypass via rebuild","note":"Framed against M1045/M1046 — the integrity mitigations the rebuild defeats."},{"label":"B5 all behaviours in one column","note":"The Defense Impairment tactic — the goal every behaviour serves."}],"data":{"lefts":["B1 a 2021 image was booted","B2 the image was rebuilt; version lied","B3 weak legacy ciphers negotiated","B4 signature bypass via rebuilt image","B5 one column holds them all"],"rights":["T1601.002 Downgrade System Image","T1601.001 Patch System Image","T1600 Weaken Encryption","M1045 / M1046 integrity mitigations","Defense Impairment tactic","T1078 Valid Accounts"],"correct":[0,1,2,3,4]}},{"id":"h15","type":"order","summary":"Rank five SIEM alerts","scen":{"lead":"Five alerts, one analyst, Friday afternoon. Rank them 1 (work first) to 5. Ranking is about the chain: correlated, high-confidence, production-edge first.","arts":[{"label":"ARTEFACT — the five alerts","body":"A1 lb-fw-01: checksum MISMATCH + boot-var points at the file (chain complete)\nA2 dist-sw-05: single image transfer from the patch repository inside an approved window\nA3 lab-sw-09: version-string alert — lab device, ticketed experiment\nA4 core-rtr-01: boot-var change, no reload observed in 6 days\nA5 br-sw-19: scheduled compliance scan failed to run (coverage gap)"}]},"question":"Drag the alerts into work order.","hint":"A completed chain on a production edge device outranks everything. A coverage gap is urgent next. Then judge partial chains by staleness.","correct":"A1 first (complete chain, production edge), A5 second (detection blind spot), A4 third (partial chain, stale), A2 fourth (benign pattern), A3 last (lab, ticketed).","expl":"<b>A1<\/b> is the analytic's page condition firing on a production edge device — drop everything. <b>A5<\/b> is a blind spot: while the compliance scan is down, none of the other conditions are being evaluated on that site — fix the sensor before the next signal. <b>A4<\/b> is a partial chain gone stale: worth a look today, not a page. <b>A2<\/b> matches the allow-listed benign pattern (repository, approved window) — it stays logged, not worked. <b>A3<\/b> is a ticketed lab experiment. What to study: ranking by chain completeness and asset criticality.","items":[{"label":"A1 complete chain on lb-fw-01","note":"Rank 1: the full chain, production edge — the analytic's page condition."},{"label":"A5 compliance scan down","note":"Rank 2: a coverage gap — fix the sensor before trusting the quiet."},{"label":"A4 boot-var change, no reload","note":"Rank 3: partial chain, stale for days — investigate today."},{"label":"A2 repository transfer in window","note":"Rank 4: matches the allow-listed benign pattern."},{"label":"A3 lab version alert","note":"Rank 5: lab device, ticketed experiment — last."}],"data":{"entries":["A1 checksum mismatch + boot var on lb-fw-01 (chain)","A5 compliance scan failed to run (coverage gap)","A4 boot-var change, no reload for 6 days","A2 repository transfer inside approved window","A3 lab device version alert, ticketed"],"mode":"rank"}},{"id":"h16","type":"mc","summary":"The obvious answer is wrong — closing the loop","scen":{"lead":"Final near-miss. Monday's review of last week's lb-fw-01 alarm shows: transfer at 02:40 from the patch repository, boot-var change, reload, post-reboot version OLDER than baseline. Three signals of the chain fired. The room wants incident escalation. You check the last artefacts.","arts":[{"label":"ARTEFACT 1 — change record CHG-3311","body":"\"Rollback of lb-fw-01 to vendor-recommended branch 9.18(4) due to\nvendor advisory VA-2291 (compatibility fault on 9.22). Approved Friday.\nImplementer: netops-svc (MFA). Repository transfer expected.\""},{"label":"ARTEFACT 2 — integrity check","body":"flash checksum of booted image: MATCHES vendor bulletin for 9.18(4)"},{"label":"ARTEFACT 3 — clock note","body":"Transfer log source clock runs +9 minutes fast (known defect DEV-117)"}]},"question":"Chain fired, version older — yet what is the correct final assessment?","hint":"Three signals fire, but the analytic's page condition requires the signals to be UNEXPLAINED. Check the ticket's verb, the checksum, and the clock defect before you vote.","correct":"<b>Benign — a documented, approved rollback:<\/b> the ticket covers exactly this downgrade to the vendor-recommended branch, the checksum matches the vendor bulletin, and the transfer-time oddity is the known clock defect.","expl":"The chain fired because the mechanics of an approved rollback and an attack are identical — that is why the analytic demands the signals be <i>unexplained<\/i> before paging. Here the change record describes the same device, direction and window; the booted image's checksum matches the <b>vendor bulletin<\/b> (not just an internal baseline); and the 9-minute offset explains the timeline wobble. Note what made this dangerous-looking: an older version string is normally the alarm — the ticket's explicit rollback verb is what flips it. What to study: the word ‘unexplained’ in analytic conditions, and validating against vendor hashes.","items":[{"label":"The final assessment","note":"Benign: approved rollback to a vendor-recommended branch, checksum matches the vendor bulletin, clock defect explains the timing."}],"data":{"options":["Escalate — three chain signals is enough on its own","Benign — approved rollback, vendor-matching checksum, known clock defect","Escalate — rollbacks are never legitimate","Close silently — no documentation needed for matches"],"correct":1}}]};

'use strict';
var EXAM = window.EXAM_DATA;
function $(s){ return document.querySelector(s); }
function mk(tag, cls, html){ var e=document.createElement(tag); if(cls){e.className=cls;} if(html!==undefined){e.innerHTML=html;} return e; }
function shuffle(a){ var x=a.slice(); for(var i=x.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=x[i]; x[i]=x[j]; x[j]=t; } return x; }
function pad2(n){ return (n<10?'0':'')+n; }
function fmtClock(sec){ var m=Math.floor(Math.max(0,sec)/60), s=Math.max(0,sec)%60; return pad2(m)+':'+pad2(s); }
function norm(s){ return (''+s).toLowerCase().replace(/\s+/g,' ').replace(/[.,;:]+$/,'').trim(); }
function smoothOK(){ return !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
/* generic partial-credit scoring: H = selected correct, W = selected wrong, N = total correct */
function scoreExercise(sel, corr){
  var corrSet = {}; for(var i=0;i<corr.length;i++){ corrSet[corr[i]] = true; }
  var H=0, W=0;
  for(var j=0;j<sel.length;j++){ if(corrSet[sel[j]]){ H++; } else { W++; } }
  var N = corr.length; var c = Math.max(0,(H-W)/N);
  return {H:H,W:W,N:N,credit:c};
}
/* ---------------- global state ---------------- */
var S = {
  phase:'intro', order:[], idx:0, credits:{}, answered:{}, checked:{}, hintUsed:{},
  skippedPool:[], returnTo:null, flowState:{}, perExLeft:0,
  manualTotal:0, reviewTotal:0, reported:false, user:'', country:'', locale:'en'
};
var T = { state:'IDLE', remain:EXAM.timerSeconds, lastTick:0, iv:null };
var TIMER_LABELS = {
  RUNNING:'\u25B6 RUNNING', PAUSED_MANUAL:'\u23F8 PAUSED \u2014 manual (press Resume)',
  PAUSED_AUTO_CHECK:'\u23F3 AUTO-PAUSED \u2014 reviewing feedback (resumes on Next)', ENDED:'\u23F9 ENDED', IDLE:'\u25B6 READY'
};
function setState(st){ T.state = st; renderHeader(); }
function tTick(){
  var now = Date.now(); var dt = Math.floor((now - T.lastTick)/1000);
  if(dt <= 0){ return; }
  T.lastTick = now;
  if(T.state==='PAUSED_MANUAL'){ S.manualTotal += dt; return; }
  if(T.state==='PAUSED_AUTO_CHECK'){ S.reviewTotal += dt; return; }
  if(T.state!=='RUNNING'){ return; }
  if(S.phase==='review'){ /* timer keeps running in review by design */ }
  T.remain -= dt;
  var cur = curEx();
  if(cur && cur.perEx && !S.checked[cur.id] && (S.phase==='exam')){
    S.perExLeft -= dt;
    if(S.perExLeft <= 0){ S.perExLeft = 0; doCheck(true); }
  }
  if(T.remain <= 0){ T.remain = 0; setState('ENDED'); finishExam(); return; }
  renderHeader();
}
function startTimer(){ T.lastTick = Date.now(); if(!T.iv){ T.iv = setInterval(tTick, 500); } setState('RUNNING'); }
function curEx(){ return S.order[S.idx] || null; }
/* ---------------- header ---------------- */
function renderHeader(){
  var t = $('#hdr'); if(!t){ return; }
  $('#clock').textContent = fmtClock(T.remain);
  $('#tstate').textContent = TIMER_LABELS[T.state] || '';
  $('#tstate').className = 'tstate ' + (T.state==='RUNNING'?'running':(T.state==='PAUSED_MANUAL'?'paused-manual':(T.state==='PAUSED_AUTO_CHECK'?'paused-check':'ended')));
  $('#tstate').setAttribute('aria-label','Timer state: '+(TIMER_LABELS[T.state]||''));
  var sum=0, cnt=0;
  for(var k in S.answered){ if(S.answered[k]){ sum += S.credits[k]; cnt++; } }
  var pct = cnt>0 ? Math.round((sum/cnt)*100) : 0;
  $('#lscore').innerHTML = '<b>'+sum.toFixed(1)+'</b> <span>/ '+cnt+' answered ('+pct+'%)</span>';
  var prog = Math.round((Object.keys(S.answered).length / S.order.length)*100);
  $('#pbarfill').style.width = (isFinite(prog)?prog:0) + '%';
  var px = $('#perex');
  if(px){ px.textContent = '\u23F1 Per-exercise timer: ' + fmtClock(S.perExLeft); }
}
function greetNote(){
  var g = '';
  if(S.user){ g += '<span class="cell"><span class="lbl">Analyst</span><span class="val">'+S.user.replace(/[<>&]/g,'')+'</span></span>'; }
  return g;
}
function buildHeader(){
  var h = mk('header','hdr'); h.id='hdr';
  h.innerHTML =
    '<span class="cell"><span class="lbl">Exercise</span><span class="val" id="excount">'+(S.phase==='exam'?(S.idx+1)+' of '+S.order.length:'\u2014')+'</span></span>'+
    '<span class="cell"><span class="badge '+EXAM.sev.key+'" role="img" aria-label="Severity '+EXAM.sev.label+'">'+EXAM.sev.label+'</span></span>'+
    '<span class="cell"><span class="lbl" aria-hidden="true">Time</span><span class="clock" id="clock" role="timer" aria-label="Time remaining">'+fmtClock(T.remain)+'</span>'+
    '<span class="tstate running" id="tstate" role="status">RUNNING</span></span>'+
    '<span class="cell"><span class="lbl">Score</span><span class="livescore" id="lscore" role="status" aria-label="Live score"><b>0.0</b> <span>/ 0 answered (0%)</span></span></span>'+
    '<span class="spacer cell"></span>'+
    '<button class="ghost hidden" id="hbtnHint" aria-label="Show one hint for the current exercise; costs 10 percent of its credit">\u25C6 Hint</button>'+
    '<button class="ghost hidden" id="hbtnSkip" aria-label="Skip the current exercise; it goes to the skipped pool">\u26A0 Skip</button>'+
    '<button class="ghost" id="btnPause" aria-label="Pause exam (manual break)">\u23F8 Pause</button>'+
    '<button class="ghost hidden" id="btnResume" aria-label="Resume exam">\u25B6 Resume</button>'+
    greetNote();
  var p = mk('div','pbar'); var f = mk('i'); f.id='pbarfill'; p.appendChild(f); p.id='pbar';
  var root = $('#app');
  root.insertBefore(p, root.firstChild);
  root.insertBefore(h, root.firstChild);
  $('#btnPause').addEventListener('click', manualPause);
  $('#btnResume').addEventListener('click', manualResume);
  $('#hbtnHint').addEventListener('click', function(){ var e = curEx(); if(e && !S.checked[e.id]){ doHint(e); } });
  $('#hbtnSkip').addEventListener('click', function(){ var e = curEx(); if(e && !S.checked[e.id]){ skipEx(); } });
}
function manualPause(){
  if(S.phase!=='exam' && S.phase!=='review'){ return; }
  if(T.state==='RUNNING' || T.state==='PAUSED_AUTO_CHECK'){
    setState('PAUSED_MANUAL');
    $('#btnPause').classList.add('hidden'); $('#btnResume').classList.remove('hidden');
    var m = mk('div','pausedmask'); m.id='pmask';
    m.innerHTML = '<div class="card"><div class="pl">\u23F8 PAUSED \u2014 manual (press Resume)</div>'+
      '<p>The exercise is hidden while you are on this break. The countdown is stopped.</p>'+
      '<button class="primary" id="btnResume2">\u25B6 Resume</button></div>';
    document.body.appendChild(m);
    m.querySelector('#btnResume2').addEventListener('click', manualResume);
    $('#exammain').classList.add('hidden');
  }
}
function manualResume(){
  var m = $('#pmask'); if(m){ m.remove(); }
  $('#exammain').classList.remove('hidden');
  $('#btnResume').classList.add('hidden'); $('#btnPause').classList.remove('hidden');
  T.lastTick = Date.now();
  if(S.checked[curEx() ? curEx().id : null]){ setState('PAUSED_AUTO_CHECK'); } else { setState('RUNNING'); }
}
/* ---------------- intro screen ---------------- */
function renderIntro(){
  var I = EXAM.intro;
  var w = mk('div','wrap intro');
  var c1 = mk('div','card');
  c1.innerHTML = '<h1>'+I.title+'<span class="sev badge '+EXAM.sev.key+'" role="img" aria-label="Severity '+EXAM.sev.label+'">'+EXAM.sev.label+'</span></h1>'+
    '<p class="sub mono">'+I.object+'</p>'+
    '<div class="facts">'+
      '<span class="fact"><span class="lbl">Exercises</span><span class="val">'+EXAM.exercises.length+'</span></span>'+
      '<span class="fact"><span class="lbl">Estimated time</span><span class="val">'+EXAM.estimatedMinutes+' min</span></span>'+
      '<span class="fact"><span class="lbl">Timer budget</span><span class="val">'+EXAM.estimatedMinutes+' min countdown</span></span>'+
      '<span class="fact"><span class="lbl">Pass mark</span><span class="val">70%</span></span>'+
      '<span class="fact"><span class="lbl">Object type</span><span class="val">Sub-Technique</span></span>'+
    '</div>';
  var c2 = mk('div','card');
  c2.innerHTML = '<h2>\u25C8 What you will learn here</h2>'+I.learn;
  var c3 = mk('div','card');
  var th = '';
  for(var i=0;i<I.themes.length;i++){
    var t = I.themes[i];

    for(var j=0;j<t.items.length;j++){ th += '<li class="kw">'+t.items[j]+'</li>'; }
    th += '</ul></div>';
  }
  c3.innerHTML = '<h2>\u25C8 Keywords covered in this exam</h2><div class="themegrid">'+th+'</div>';
  var c4 = mk('div','card');
  var types = '';

    types = '<ul class="howlist">';
    for(var k=0;k<I.types.length;k++){ types += '<li>'+I.types[k]+'</li>'; }

  }

    '<div class="actions"><button class="primary" id="btnStart" aria-label="Start the exam">\u25B6 Start the exam</button></div>';
  w.appendChild(c1); w.appendChild(c2); w.appendChild(c3); w.appendChild(c4);
  $('#app').appendChild(w);
  $('#btnStart').addEventListener('click', function(){ startExam(); });

/* ---------------- exam frame ---------------- */
function startExam(){
  S.phase = 'exam';
  S.order = shuffle(EXAM.exercises);
  $('.intro').remove();
  buildHeader();
  var main = mk('main','wrap'); main.id = 'exammain'; $('#app').appendChild(main);
  startTimer();
  renderEx();
}
function toReviewOrResults(){
  if(S.skippedPool.length > 0 && T.remain > 0){ renderReview(); }
  else { finishExam(); }
}

/* ---------------- exercise rendering ---------------- */
function doHint(ex){
  if(S.hintUsed[ex.id] || S.checked[ex.id]){ return; }
  S.hintUsed[ex.id] = true;
  var main = $('#exammain'); var acts = main ? main.querySelector('.actions') : null;
  if(!acts){ return; }
  var hb = mk('div','hintbox');
  hb.innerHTML = '<div class="hlabel">\u25C6 Hint \u2014 one per exercise (\u22120.10 credit)</div><p>'+ex.hint+'</p>';
  main.insertBefore(hb, acts);
  var b1 = $('#btnHint'); if(b1){ b1.disabled = true; }
  var b2 = $('#hbtnHint'); if(b2){ b2.disabled = true; }
}
function scenBlock(ex){
  var b = mk('section','blk scenario');
  var h = mk('header',null,'<span aria-hidden="true">\u25C8</span> SCENARIO');
  b.appendChild(h);
  var body = mk('div','body');
  if(ex.scen.lead){ body.appendChild(mk('p',null,ex.scen.lead)); }
  for(var i=0;i<ex.scen.arts.length;i++){
    var a = ex.scen.arts[i];
    var d = mk('div','artefact');
    var lbl = '<label>ARTEFACT '+(i+1)+' \u2014 '+a.label.replace(/^ARTEFACT\s*[\u2014-]\s*/,'')+'</label>';
    d.innerHTML = lbl;
    if(a.filter){
      var fb = mk('div','fbox');
      fb.innerHTML = '<span class="flbl">Filter lines</span>';
      var inp = document.createElement('input'); inp.type='search'; inp.setAttribute('aria-label','Filter log lines');
      inp.addEventListener('input', function(){
        var q = this.value.toLowerCase();
        var lns = d.querySelectorAll('.ln');

function doCheck(auto){
  var ex = curEx();
  if(!ex || S.checked[ex.id]){ return; }
  var res = gradeEx(ex);
  var credit = res.credit;
  if(S.hintUsed[ex.id]){ credit = Math.max(0, credit - 0.10); }
  S.credits[ex.id] = credit; S.answered[ex.id] = true; S.checked[ex.id] = true; S.gradeDetail = res;
  S.autoChecked = !!auto;
  var p = S.skippedPool.indexOf(ex.id);
  if(p !== -1){ S.skippedPool.splice(p,1); }
  renderFeedback(ex, res, credit);
  $('#btnCheck').classList.add('hidden');
  $('#btnNext').classList.remove('hidden');
  var hs = $('#hbtnSkip'); if(hs){ hs.classList.add('hidden'); }
  var hh = $('#hbtnHint'); if(hh){ hh.disabled = true; }
  var bn = $('#btnNext');
  bn.textContent = (S.returnTo==='review') ? 'Back to review \u25B6' : ((S.idx === S.order.length-1) ? 'Continue \u25B6' : 'Next \u25B6');
  if(T.state !== 'ENDED'){ setState('PAUSED_AUTO_CHECK'); }
  renderHeader();
}
function skipEx(){
  var ex = curEx(); if(!ex || S.checked[ex.id]){ return; }
  if(S.skippedPool.indexOf(ex.id) === -1){ S.skippedPool.push(ex.id); }
  if(S.returnTo === 'review'){ S.returnTo = null; if(T.state==='PAUSED_AUTO_CHECK'){ setState('RUNNING'); } renderReview(); return; }
  if(S.idx >= S.order.length-1){ toReviewOrResults(); }
  else { S.idx++; renderEx(); }
}
function nextEx(){
  var ex = curEx();
  if(T.state === 'PAUSED_AUTO_CHECK'){ setState('RUNNING'); }
  if(S.returnTo === 'review'){ S.returnTo = null; renderReview(); return; }
  if(S.idx >= S.order.length-1){ toReviewOrResults(); }
  else { S.idx++; renderEx(); }
}
/* ---------------- grading per type ---------------- */
function gradeEx(ex){
  var D = ex.data, c = S.widget.collect(), out = {H:0,W:0,N:0,items:[],dangerous:false};
  function mkItems(states){ for(var i=0;i<ex.items.length;i++){ out.items.push({label:ex.items[i].label, note:ex.items[i].note||'', state:states[i]||'miss'}); } }
  if(ex.type==='mc'){
    out.N = 1;
    if(c.sel === D.correct){ out.H = 1; mkItems(['ok']); } else if(c.sel === -1){ mkItems(['miss']); } else { mkItems(['bad']); }
  } else if(ex.type==='mcs'){
    var corr = D.correct; out.N = corr.length;
    var sel = c.sel || [];
    var states = [];
    for(var i=0;i<ex.items.length;i++){
      var wasSel = sel.indexOf(i) !== -1;
      var isCorr = corr.indexOf(i) !== -1;
      if(wasSel && isCorr){ out.H++; states.push('ok'); }
      else if(wasSel && !isCorr){ out.W++; states.push('bad'); }
      else if(!wasSel && isCorr){ states.push('miss'); }
      else { states.push('miss'); }
    }
    mkItems(states);
  } else if(ex.type==='order'){
    out.N = D.entries.length;
    var st2 = [];
    for(var p=0; p<out.N; p++){
      if(p < c.placed.length){
        if(c.placed[p] === p){ out.H++; st2.push('ok'); } else { out.W++; st2.push('bad'); }
      } else { st2.push('miss'); }
    }
    mkItems(st2);
  } else if(ex.type==='match'){
    out.N = D.lefts.length;
    var st3 = [];
    for(var l=0; l<out.N; l++){
      if(c.picks[l] === null){ st3.push('miss'); }
      else if(c.picks[l] === D.correct[l]){ out.H++; st3.push('ok'); }
      else { out.W++; st3.push('bad'); }
    }
    mkItems(st3);
  } else if(ex.type==='fill'){
    out.N = D.blanks.length;
    var st4 = [];
    for(var b=0; b<out.N; b++){
      var v = (c.vals[b]||'');
      if(v.trim()===''){ st4.push('miss'); }
      else {
        var nv = norm(v); var ok = false;
        for(var a=0; a<D.blanks[b].length; a++){ if(nv === norm(D.blanks[b][a])){ ok = true; break; } }
        if(ok){ out.H++; st4.push('ok'); } else { out.W++; st4.push('bad'); }
      }
    }
    mkItems(st4);
  } else if(ex.type==='dnd'){
    out.N = D.items.length;
    var zoneOf = {};
    for(var z=0; z<c.inzone.length; z++){ zoneOf[c.inzone[z].oi] = c.inzone[z].zi; }
    var st5 = [];
    for(var oi=0; oi<out.N; oi++){
      if(zoneOf[oi] === undefined){ st5.push('miss'); }
      else if(zoneOf[oi] === D.correct[oi]){ out.H++; st5.push('ok'); }
      else { out.W++; st5.push('bad'); }
    }
    mkItems(st5);
  } else if(ex.type==='term'){
    var needs = D.elements.filter(function(e){ return e.kind==='need'; });
    var forbids = D.elements.filter(function(e){ return e.kind==='forbid'; });
    out.N = needs.length;
    var txts;
    if(D.mode==='seq'){ txts = c.answers || []; }
    else { txts = [c.input || ''].concat(c.transcript || []); }
    var joined = norm(txts.join(' \u00A6 '));
    var st6 = [];
    for(var nI=0; nI<needs.length; nI++){
      var re = new RegExp(needs[nI].re, 'i');
      var anyHit = false;
      if(D.mode==='seq'){
        /* grade each seq element against its own answer line */
        if(txts[nI] !== undefined && re.test(norm(txts[nI]))){ anyHit = true; }
      } else {
        for(var tI=0; tI<txts.length; tI++){ if(re.test(norm(txts[tI]))){ anyHit = true; break; } }
      }
      if(anyHit){ out.H++; st6.push('ok'); } else { st6.push('miss'); }
    }
    var nI2 = 0, fI2 = 0;
    for(var i7=0; i7<ex.items.length; i7++){
      var itm = ex.items[i7];
      if(itm.kind === 'forbid'){
        var fEl = D.elements.filter(function(e){ return e.kind==='forbid' && e.label===itm.label; })[0];
        var bad = fEl ? new RegExp(fEl.re,'i').test(joined) : false;
        if(bad){ out.W++; }
        out.items.push({label:itm.label, note:itm.note||'', state: bad?'bad':'ok'});
      } else {
        out.items.push({label:itm.label, note:itm.note||'', state: st6[nI2]||'miss'}); nI2++;
      }
    }
    if(D.dangerRe && new RegExp(D.dangerRe.re,'i').test(joined)){ out.dangerous = true; }
  } else if(ex.type==='flow'){
    out.N = D.steps.length;
    var st7 = [];
    for(var sI=0; sI<out.N; sI++){
      var pick = c.picks[sI];
      if(pick === undefined || pick === null){ st7.push('miss'); }
      else if(pick === D.steps[sI].correct){ out.H++; st7.push('ok'); }
      else { out.W++; st7.push('bad'); }
    }
    mkItems(st7);
  } else if(ex.type==='selects'){
    out.N = D.slots.length;
    var st8 = [];
    for(var q=0; q<out.N; q++){
      var pk = c.picks[q];
      if(pk === null || pk === undefined){ st8.push('miss'); }
      else if(pk === D.slots[q].correct){ out.H++; st8.push('ok'); }
      else { out.W++; st8.push('bad'); }
    }
    mkItems(st8);
  }
  var credit = out.N > 0 ? Math.max(0,(out.H-out.W)/out.N) : 0;
  out.credit = credit;
  return out;
}
/* ---------------- feedback ---------------- */
function renderFeedback(ex, res, credit){
  var host = $('#fbhost'); if(!host){ return; }
  host.innerHTML='';
  var cls = credit >= 0.999 ? 'correct' : (credit > 0 ? 'partial' : 'incorrect');
  var icon = credit >= 0.999 ? '\u2713' : (credit > 0 ? '\u2713' : '\u2717');
  var word = credit >= 0.999 ? 'CORRECT' : (credit > 0 ? 'PARTIALLY CORRECT' : 'INCORRECT');
  var fb = mk('section','feedback '+cls);
  var sub = credit >= 0.999 ? '' : (credit > 0 ? ' \u2014 credit '+credit.toFixed(2)+' \u2014 '+res.H+'/'+res.N+' items' : '');
  var fhd = mk('header',null,'');
  fhd.innerHTML = '<span aria-hidden="true">'+icon+'</span> '+word+sub+
    (S.autoChecked ? ' <span class="exTimerNote">(auto-checked: the per-exercise timer reached zero)</span>' : '');
  fb.appendChild(fhd);
  fb.setAttribute('role','status');
  fb.setAttribute('aria-label', word);
  var body = mk('div','fbody');
  body.appendChild(mk('p','credline','Scoring formula: credit = max(0, (H \u2212 W) / N) = max(0, ('+res.H+' \u2212 '+res.W+') / '+res.N+') = '+credit.toFixed(2)+
    (S.hintUsed[ex.id] ? ' \u00B7 hint used: \u22120.10 applied' : '')));
  if(res.items.length > 0){
    var it = mk('div','items');
    for(var i=0;i<res.items.length;i++){
      var it_ = res.items[i];
      var stTxt = it_.state==='ok' ? '<span class="st">\u2713 Correct</span>' : (it_.state==='bad' ? '<span class="st">\u2717 Wrong</span>' : '<span class="st">\u25CB Missed</span>');
      var row = mk('div','itemrow '+(it_.state==='ok'?'ok':(it_.state==='bad'?'bad':'miss')));
      row.innerHTML = stTxt + '<span><b>'+it_.label+'</b> \u2014 '+it_.note+'</span>';
      it.appendChild(row);
    }
    body.appendChild(it);
  }
  if(res.dangerous){
    var dw = mk('div','itemrow bad');
    dw.innerHTML = '<span class="st">\u2717 DANGEROUS \u2014 NEAR MISS</span><span>'+ex.data.dangerNote+'</span>';
    body.appendChild(dw);
  }
  body.appendChild(mk('div','canon','<span class="clabel">Correct answer</span>'+(ex.correct||'')));
  body.appendChild(mk('p',null,ex.expl));
  fb.appendChild(body);
  host.appendChild(fb);
  fb.scrollIntoView({behavior:(smoothOK()?'smooth':'auto'), block:'nearest'});
}
/* ---------------- review skipped ---------------- */
function renderReview(){
  S.phase = 'review';
  var main = $('#exammain'); main.innerHTML='';
  $('#excount').textContent = 'Review skipped exercises';
  var hbR = $('#hbtnHint'); if(hbR){ hbR.classList.add('hidden'); }
  var sbR = $('#hbtnSkip'); if(sbR){ sbR.classList.add('hidden'); }
  main.appendChild(mk('section','blk scenario')).innerHTML = '';
  var sb = main.querySelector('section');
  sb.innerHTML = '<header><span aria-hidden="true">\u26A0</span> REVIEW SKIPPED EXERCISES</header><div class="body">'+
    '<p>You skipped '+S.skippedPool.length+' exercise(s). You can return to any of them and answer it, as many times as you need, while the timer is still running ('+fmtClock(T.remain)+' left).</p>'+
    '<p>If you submit now, every skipped-and-never-answered exercise is excluded from the score: it counts as neither correct nor wrong, and its points are not added to the total possible points.</p></div>';
  S.skippedPool.forEach(function(id, i){
    var ex = EXAM.exercises.filter(function(x){ return x.id===id; })[0];
    var row = mk('div','skipitem');
    row.innerHTML = '<span class="t">\u26A0 Skipped</span><span>'+ex.summary+'</span>';
    var b = mk('button','primary','Answer now');
    b.type='button';
    b.addEventListener('click', function(){
      S.returnTo = 'review';
      S.idx = S.order.map(function(x){return x.id;}).indexOf(id);
      S.phase = 'exam';
      renderEx();
    });
    row.appendChild(b);
    main.appendChild(row);
  });
  var acts = mk('div','actions');
  var sub2 = mk('button','primary','\u2713 Submit exam (final results)');
  sub2.type='button'; sub2.setAttribute('aria-label','Submit exam and show final results');
  sub2.addEventListener('click', function(){ finishExam(); });
  acts.appendChild(sub2);
  main.appendChild(acts);
  renderHeader();
}
/* ---------------- results ---------------- */
function finishExam(){
  S.phase = 'results';
  setState('ENDED');
  var hpF = $('#btnPause'); if(hpF){ hpF.classList.add('hidden'); }
  var hbF = $('#hbtnHint'); if(hbF){ hbF.classList.add('hidden'); }
  var sbF = $('#hbtnSkip'); if(sbF){ sbF.classList.add('hidden'); }
  var main = $('#exammain'); if(main){ main.remove(); }
  var sum = 0, cnt = 0, full = 0, part = 0, partSum = 0, zero = 0, skipped = 0;
  S.order.forEach(function(ex){
    if(S.answered[ex.id]){
      cnt++; sum += S.credits[ex.id];
      var cr = S.credits[ex.id];
      if(cr >= 0.999){ full++; } else if(cr > 0){ part++; partSum += cr; } else { zero++; }
    } else if(S.skippedPool.indexOf(ex.id) !== -1 || S.checked[ex.id] !== true){ skipped++; }
  });
  var pct = cnt > 0 ? Math.round((sum/cnt)*100) : 0;
  var passed = pct >= EXAM.passMark;
  var used = EXAM.timerSeconds - T.remain;
  var wrap = mk('main','wrap results'); wrap.id='resmain';
  var v = mk('div','verdict '+(passed?'pass':'fail'));
  v.innerHTML = (passed ? '\u2713 PASS' : '\u2717 FAIL') + ' \u2014 final score '+sum.toFixed(1)+' / '+cnt+' answered \u2014 <span class="big">'+pct+'%</span>';
  var grid = mk('div','resgrid');
  grid.innerHTML =
    '<div class="rescard ok"><div class="n">'+full+'</div><div>\u2713 Fully correct</div></div>'+
    '<div class="rescard part"><div class="n">'+part+'</div><div>\u2713 Partially correct'+(part>0?' (avg '+(partSum/part).toFixed(2)+')':'')+'</div></div>'+
    '<div class="rescard bad"><div class="n">'+zero+'</div><div>\u2717 Fully incorrect</div></div>'+
    '<div class="rescard skip"><div class="n">'+skipped+'</div><div>\u26A0 Skipped \u2014 excluded</div></div>';
  var info = mk('div','card');
  info.innerHTML = '<p><b>Time used:</b> '+fmtClock(used)+' of '+fmtClock(EXAM.timerSeconds)+' budget \u00B7 <b>Paused manually:</b> '+fmtClock(S.manualTotal)+
    ' \u00B7 <b>Paused for feedback review:</b> '+fmtClock(S.reviewTotal)+'</p>'+
    '<p>Percentage computed over answered exercises only. Pass mark: '+EXAM.passMark+'%. '+(passed ?
    'Well done \u2014 you demonstrated a working command of '+EXAM.objectID+' at this severity.' :
    'You must retake this exam to reach the pass mark. Study the explanations you saw after each Check, then press Retake Exam.')+'</p>';
  var acts = mk('div','actions');
  var rb = mk('button','primary','\u21BA Retake Exam');
  rb.type='button'; rb.setAttribute('aria-label','Retake the exam with reshuffled questions');
  rb.addEventListener('click', retake);
  acts.appendChild(rb);
  wrap.appendChild(v); wrap.appendChild(grid); wrap.appendChild(info); wrap.appendChild(acts);
  $('#app').appendChild(wrap);
  window.scrollTo({top:0, behavior:(smoothOK()?'smooth':'auto')});
  if(!S.reported){ S.reported = true; reportScore(sum, cnt); }
}
/* ---------------- site integration ---------------- */
function reportScore(creditSum, answeredCount){
  var percent = answeredCount > 0 ? Math.round((creditSum/answeredCount)*100) : 0;
  try {
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId: EXAM.topicId,
      batch: EXAM.batch,
      score: Math.round(creditSum*10)/10,
      total: answeredCount,
      percent: percent,
      passed: percent >= EXAM.passMark
    }, location.origin);
  } catch(e) { /* opened directly, not inside the site */ }
}
window.addEventListener('message', function(event){
  if(!event.data){ return; }
  if(event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT'){ return; }
  S.user = event.data.username || '';
  S.country = event.data.country || '';
  S.locale = event.data.locale || 'en';
  /* theme field is always 'dark'; the file is dark-only by contract, nothing to toggle */
});
/* ---------------- retake ---------------- */
function retake(){
  var hpR = $('#btnPause'); if(hpR){ hpR.classList.remove('hidden'); }
  S.idx = 0; S.credits = {}; S.answered = {}; S.checked = {}; S.hintUsed = {};
  S.skippedPool = []; S.returnTo = null; S.flowState = {}; S.manualTotal = 0; S.reviewTotal = 0;
  S.reported = false; S.autoChecked = false;
  T.remain = EXAM.timerSeconds; T.state = 'IDLE';
  S.order = shuffle(EXAM.exercises);
  var rm = $('#resmain'); if(rm){ rm.remove(); }
  var em = $('#exammain');
  if(!em){ em = mk('main','wrap'); em.id='exammain'; $('#app').appendChild(em); }
  else { em.innerHTML=''; }
  startTimer();
  renderEx();
}
/* ---------------- boot ---------------- */
document.addEventListener('DOMContentLoaded', function(){ renderIntro(); });

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
