running malicious content that collects client configuration information from visitors.\nATT&CK warns this activity has a very high occurrence and false-positive rate and often happens\noutside the target's visibility — so detection efforts focus on related stages, such as Initial\nAccess. The mitigation is M1056 Pre-compromise: minimize the amount and sensitivity of data\navailable to external parties.</p>\n<p><b>Where will you meet this at work?</b> You are the senior voice in the room: duty SOC lead,\nsenior IR, senior detection engineer, CTI lead briefing the CISO, red-team lead, GRC lead owning\nthe control set. Your outputs: defensible assessments, decisions with accepted costs, tuning\nchoices, and exposure-reduction programmes anchored in CIS / NIST CSF / ISO 27001.</p>\n<p><b>This tier:</b> expect chains, ambiguity, irrelevant noise, missing information, and options\nwhere three of four are defensible somewhere — but only one is defensible HERE.</p>\n", "themesHtml": "<div class=\"theme-grid\"><div class=\"theme-card\"><h3>Technique identity and family</h3><div class=\"theme-tags\"><span class=\"tag\">T1592.004</span><span class=\"tag\">Sub-technique of T1592</span><span class=\"tag\">Tactic TA0043 Reconnaissance</span><span class=\"tag\">Siblings: .001 Hardware / .002 Software / .003 Firmware</span><span class=\"tag\">Platforms: PRE</span></div></div><div class=\"theme-card\"><h3>What counts as client configurations</h3><div class=\"theme-tags\"><span class=\"tag\">OS and version</span><span class=\"tag\">Virtualization</span><span class=\"tag\">Architecture 32/64-bit</span><span class=\"tag\">Language</span><span class=\"tag\">Time zone</span></div></div><div class=\"theme-card\"><h3>Collection methods</h3><div class=\"theme-tags\"><span class=\"tag\">Active Scanning (T1595): listening ports, server banners, user agent strings</span><span class=\"tag\">Phishing for Information (T1598)</span><span class=\"tag\">Compromised websites with fingerprinting content</span><span class=\"tag\">Open data sets: job postings, network maps, assessment reports, resumes, purchase invoices</span></div></div><div class=\"theme-card\"><h3>What recon unlocks next</h3><div class=\"theme-tags\"><span class=\"tag\">Search Open Websites/Domains (T1593)</span><span class=\"tag\">Search Open Technical Databases (T1597)</span><span class=\"tag\">Develop Capabilities (T1587)</span><span class=\"tag\">Obtain Capabilities (T1588)</span><span class=\"tag\">Supply Chain Compromise (T1195)</span><span class=\"tag\">External Remote Services (T1133)</span></div></div><div class=\"theme-card\"><h3>Telemetry and detection</h3><div class=\"theme-tags\"><span class=\"tag\">Detection Strategy DET0820 / analytic AN1952</span><span class=\"tag\">High false-positive rate for internet scanners</span><span class=\"tag\">Off-perimeter blind spots</span><span class=\"tag\">Watch the Initial Access stages</span></div></div><div class=\"theme-card\"><h3>Mitigation and controls</h3><div class=\"theme-tags\"><span class=\"tag\">M1056 Pre-compromise</span><span class=\"tag\">Minimize data available to external parties</span><span class=\"tag\">Version banner hygiene</span><span class=\"tag\">Public document hygiene</span><span class=\"tag\">Framework mappings: NIST CSF, CIS Controls, ISO 27001</span></div></div><div class=\"theme-card\"><h3>Real-world procedures</h3><div class=\"theme-tags\"><span class=\"tag\">C0064 AI-Assisted Breach of Mexico's Government Infrastructure</span><span class=\"tag\">C0062 Anthropic AI-orchestrated Campaign</span><span class=\"tag\">G0125 HAFNIUM — Office 365 tenant environment details</span></div></div><div class=\"theme-card\"><h3>Tools and work roles</h3><div class=\"theme-tags\"><span class=\"tag\">curl / banner grabbing</span><span class=\"tag\">Scanner tools</span><span class=\"tag\">SOC analyst</span><span class=\"tag\">CTI analyst</span><span class=\"tag\">Red teamer</span><span class=\"tag\">Detection engineer</span><span class=\"tag\">GRC analyst / control owner</span></div></div></div>", "exercises": [{"id": "x01", "type": "qcm", "kindLabel": "Senior assessment", "title": "Ten-minute CISO decision", "summary": "Six artefacts, incomplete telemetry, one defensible assessment.", "scenario": [{"label": "Artefact 1 — web access log excerpt (last 24 h)", "html": "<pre class=\"code\">203[.]0[.]113[.]44 - 14x \"HEAD / HTTP/1.1\" 200 \"Mozilla/5.0 (Windows NT 10.0; Win64; x64)\"\n203[.]0[.]113[.]44 -  6x \"HEAD / HTTP/1.1\" 200 \"curl/8.4.0\"\n203[.]0[.]113[.]44 -  2x \"GET /?p=1 HTTP/1.1\" 200 \"curl/8.4.0\"</pre>"}, {"label": "Artefact 2 — CTI bulletin (this morning)", "html": "<p>Scanner fleet X hits thousands of organizations weekly with identical UA patterns; assessed as opportunistic mass scanning.</p>"}, {"label": "Artefact 3 — reverse-proxy config (verified yesterday)", "html": "<pre class=\"code\">server_tokens off;\nproxy_hide_header X-Powered-By;</pre>"}, {"label": "Artefact 4 — careers page (posted last week)", "html": "<p>Job ad names 'our legacy 32-bit laptop fleet' and 'en-GB default language pack'.</p>"}, {"label": "Artefact 5 — state of telemetry", "html": "<p>No internal telemetry available for this window; no EDR alerts; asset inventory incomplete (CMDB sync failed in March).</p>"}, {"label": "Artefact 6 — facilities broadcast (irrelevant noise)", "html": "<p>Cafeteria menu changes on Monday; visitor parking resurfaced next week.</p>"}], "question": "The CISO needs a decision in 10 minutes. Which assessment is most defensible?", "options": ["Pure mass-scan noise: the fleet context explains every request, so close the ticket and move on with no further action", "Definitive targeted espionage by HAFNIUM: one scan pattern matches their documented playbook, so invoke crisis IR immediately", "Mixed but real exposure: banners are clean, but the job ad leaks client-configuration detail — cut public data, watch Initial Access", "Change nothing at all: reconnaissance can be neither detected nor reduced, so any further effort is wasted budget"], "answerIdx": 2, "hint": "Re-read artefact 3 and artefact 4 together — one shows what you fixed, the other what you still publish. Artefact 2 sets context, not conclusions.", "explain": "The most defensible assessment integrates every artefact: banners are verified clean (artefact 3), so the scanning yields little; the job ad still publishes T1592.004-scope detail (artefact 4 — open data collection); the mass-scan context (artefact 2) neither confirms targeting nor neutralizes exposure; and incomplete telemetry (artefact 5) argues for watching Initial Access rather than declaring victory. The mass-scan reading ignores real exposure. The HAFNIUM reading over-claims attribution — HAFNIUM is a documented example of this technique, but one scan pattern is not attribution. And the 'change nothing' claim is false: recon can be reduced (M1056) even when it cannot be fully detected.", "study": "Defensible assessments name what is clean, what is exposed, and what remains unknown."}, {"id": "x02", "type": "branch", "kindLabel": "Decision chain", "title": "Mass scan or pinpoint watch?", "summary": "Two signals contradict. Three decisions, with a cost to accept.", "scenario": [{"label": "Signal A — fleet pattern", "html": "<p>The same IP mass-HEADs your site and 40 other organizations. Identical UA, metronomic cadence. CTI: known scanner fleet, opportunistic.</p>"}, {"label": "Signal B — pinpoint timing", "html": "<p>Three minutes after your team deployed a new response-header configuration, the SAME IP sent GET requests to exactly the two endpoints that expose version strings. Then stopped.</p>"}, {"label": "Signal C — timing and network", "html": "<p>Activity ran outside your business hours, from a residential-VPN ASN.</p>"}], "question": "Resolve the conflict in three decisions.", "steps": [{"question": "Step 1: The two signals conflict (opportunistic fleet vs pinpoint follow-up). Which reading wins?", "options": ["Targeted follow-up wins: watching your config changes and probing the version endpoints shows intent on YOUR stack", "Fleet pattern wins: an identical UA across 40 orgs proves pure automation with no target intent", "Neither wins: logs cannot resolve intent, so treat both readings as equally actionable"], "answerIdx": 0, "hint": "One reading explains signal B; the other cannot. Which one survives the contradiction?", "ack": "Assessment locked. Next decision."}, {"question": "Step 2: Would blocking that /24 at the edge fix the root problem?", "options": ["No — the root problem is the exposed version endpoints; blocking only shifts recon to another address", "Yes — a blocklist removes the recon entirely", "No — because blocking public scanners is not technically possible"], "answerIdx": 0, "hint": "Ask what the attacker still gets AFTER the block, from any other address.", "ack": "Root cause named. Last decision."}, {"question": "Step 3: Choose tonight's action, with its real cost stated.", "options": ["Strip the version endpoints' output and rate-limit the /24 — accepting a small false-positive risk for users behind shared NAT", "Do nothing tonight and review next week", "Emergency maintenance window now — full network downtime"], "answerIdx": 0, "hint": "One option fixes the root cause at a small, stateable cost. One ignores it. One costs far too much.", "ack": ""}], "hint": "The contradiction resolves in favour of the signal that explains BOTH patterns; the fix targets the exposure, not the address.", "explain": "Step 1: the fleet pattern explains the HEAD noise, but ONLY the targeted reading explains a pinpoint probe of version endpoints minutes after your config change — intent on your stack. Step 2: blocking shifts the source; the endpoints stay leaky for the next scanner — the root cause is the exposed data, not the address. Step 3: stripping the endpoints' output plus a narrow rate-limit accepts a small, nameable cost (shared-NAT false positives) and removes the root cause tonight; doing nothing leaves the exposure, and an emergency window costs the business far more than the risk it removes.", "study": "When signals conflict, choose the reading that explains the most; fix causes, not addresses."}, {"id": "x03", "type": "terminal", "kindLabel": "Pressure terminal", "title": "Capture the fingerprint without touching anything", "summary": "Evidence-grade, minimal noise, reduced per-exercise timer.", "scenario": "22:40. Your SOC believes the public portal is being fingerprinted for client configurations. The CISO wants PROOF of exactly what an external scanner sees — evidence that survives scrutiny. Legal has hash-locked the disk images; nothing on disk may be created or modified. The monitoring team is on standby and jumpy.", "question": "Capture exactly the response headers an external scanner would see, with minimal noise and zero changes.", "briefing": "<b>Objective:</b> evidence-grade capture of the portal's response headers.<br><b>Environment:</b> you are on jump01 (same segment as the portal); HTTP reach to <span class=\"mono\">hxxp://web01[.]victim[.]internal</span>; standard client tools available.<br><b>Constraints:</b> modify nothing; write no files (disks are evidence); keep network noise minimal; one clean capture.<br><b>Per-exercise timer:</b> 150 seconds (advisory) — it pauses with the main timer.<br><b>Defang note:</b> hxxp:// and [.] stand for http:// and dots.", "advisorySec": 150, "prompt": "ir@jump01:~$", "motd": "evidence shell — every command here is part of the record", "elements": [{"name": "tool: curl", "re": "(^| )curl( |$)", "show": "curl"}, {"name": "headers-only option", "re": "(^| )(-s?i|-s -i|--head)( |$)", "show": "-sI / --head (headers only)"}, {"name": "target address", "re": "web01\\.victim\\.internal", "show": "hxxp://web01[.]victim[.]internal"}], "wrong": [{"name": "-o / --output (writes a file)", "re": "(^| )(-o|--output|-O)( |$)", "show": "-o creates a file on an evidence host"}, {"name": "-v verbose", "re": "(^| )-v( |$)", "show": "-v pulls the body too — more noise than the goal needs"}], "danger": [{"re": "(^| )nmap( |$)", "note": "nmap -A would be an invasive scan: noisy on a jumpy monitoring window and invasive on the evidence timeline."}, {"re": "(wget\\s+(-O|[^-]))", "note": "wget downloads and writes a file — evidence contamination."}], "canonical": "curl -sI hxxp://web01[.]victim[.]internal", "sim": "HTTP/1.1 200 OK\nServer: nginx/1.24.0 (Ubuntu)\nX-Powered-By: PHP/8.1.2\nContent-Type: text/html; charset=UTF-8", "canonExpl": ["<span class=\"mono\">curl</span> — one clean request, nothing installed, nothing changed.", "<span class=\"mono\">-s</span> — silent; the terminal record stays clean.", "<span class=\"mono\">-I</span> — headers only; exactly what the external scanner saw.", "<span class=\"mono\">hxxp://web01[.]victim[.]internal</span> — the portal, from the same segment."], "hint": "Restating the constraint: no files may be created, and the capture must be a single quiet request.", "explain": "The safe capture is <b>curl -sI hxxp://web01[.]victim[.]internal</b>: one request, headers only, no writes, minimal noise — evidence that survives scrutiny. The destructive-looking alternatives were traps: nmap -A is invasive and could trip monitoring controls; wget -O and curl -o both write files onto an evidence host; -v adds body traffic beyond the goal. The captured banner (Server, X-Powered-By) is the T1592.004 data an external scanner collects.", "study": "Evidence discipline: single clean capture, no writes, noise matched to the goal."}, {"id": "x04", "type": "qcm-multi", "kindLabel": "Multi-select", "title": "Which statements survive scrutiny?", "summary": "Six analytic statements. Select the defensible ones.", "scenario": "Your draft assessment goes to legal and the CISO. Every line must survive hostile questioning. Mark the statements that hold.", "question": "Select every analytically DEFENSIBLE statement.", "options": ["The HEAD/GET pattern with banner-targeted endpoints is consistent with T1592.004 collection via server banners and user agent strings", "This activity confirms HAFNIUM attribution", "Internet-wide scanners have a very high occurrence and false-positive rate, so correlate before acting on any single signal", "Blocking the scanner IP alone leaves the underlying exposure intact", "The captured headers prove the actor will exploit a specific CVE next", "A Googlebot user agent arriving from a non-Google address is suspicious"], "answerIdxs": [0, 2, 3, 5], "hint": "Two statements over-claim — one names an actor, one names a future action. Consistency language and hedged negatives survive; proof language does not.", "explain": "Defensible: 'consistent with' ties behaviour to the documented collection examples without over-claiming; the false-positive warning mirrors ATT&CK's own DET0820 note; the blocking statement is the M1056 root-cause point; the spoofed-Googlebot observation checks against a public fact. NOT defensible: attribution to HAFNIUM from one pattern (HAFNIUM is a documented example of the technique — that is not attribution), and prediction of a specific CVE from headers alone.", "study": "Say 'consistent with', not 'proves'. Check bot identities against published ranges."}, {"id": "x05", "type": "qcm", "kindLabel": "Senior assessment", "title": "The best practice that was not enough", "summary": "Banners verified clean — yet the actor still knows the fleet. Which vector explains it?", "scenario": "Your org stripped every version banner and verified it with two external scans. Three weeks later, incident response finds the actor holds the exact OS, architecture and language profile of the executives' laptops.", "question": "Which vector best explains the leak despite verified banner hygiene?", "options": ["The banner removal was quietly misconfigured again right after both verification scans", "A search engine indexed and kept serving the old banners from before the change", "The actor brute-forced their way into the internal asset database for profiles", "A compromised partner site fingerprinted every visitor's client configurations directly"], "answerIdx": 3, "hint": "Re-read the ATT&CK description: one collection vector never touches your servers at all.", "explain": "The T1592.004 description names compromised websites running 'malicious content designed to collect host information from visitors'. Banner hygiene only covers ONE vector; a partner site's fingerprint script collects every visitor's OS, architecture and language directly from the browser. The other options contradict the verified scans or require access there is no evidence for. Widely-used best practices cover their OWN vector — enumerate your vectors before you trust a control.", "study": "Controls are vector-specific. List the vectors, then map controls to each."}, {"id": "x06", "type": "qcm", "kindLabel": "Senior decision", "title": "The block that has a price", "summary": "Stopping the recon tonight costs PartnerX its monitoring. Decide.", "scenario": [{"label": "Artefact — network context", "html": "<p>The scanning traffic and PartnerX's legitimate monitoring share the 198[.]51[.]100[.]0/24 NAT range. The CISO says: 'I want this recon stopped tonight.'</p>"}, {"label": "Artefact — exposure state", "html": "<p>Version endpoints on the portal are still answerable; banners were only partially stripped last quarter.</p>"}], "question": "Which decision is correct?", "options": ["Block the whole 198[.]51[.]100[.]0/16 range to be safe tonight and review any fallout with partners later", "Scoped /24 block plus rate-limit, notify PartnerX of degraded monitoring, strip the exposed endpoints", "File an abuse report with the upstream ASN only and revisit the whole decision again next week", "Do nothing tonight — recon activity is invisible to defenders anyway, so no action can help"], "answerIdx": 1, "hint": "One option names its cost honestly and fixes the root cause tonight. Check the CIDR math on the wide-range option.", "explain": "A scoped /24 block plus rate-limit, with PartnerX notified, stops tonight's noise at a known, communicated cost — and stripping the endpoints removes what the recon was after. Blocking /16 is disproportionate collateral (65,536 addresses). Abuse-report-only ignores the CISO's deadline and leaves the exposure. 'Invisible anyway' is false: collection is visible in logs and reducible at the source (M1056).", "study": "Senior decisions state the cost, the notification, and the root-cause fix in one breath."}, {"id": "x07", "type": "order", "kindLabel": "Ordering", "title": "From profiles to infrastructure", "summary": "Five steps — the resource-building chain with IDs.", "scenario": "Audit committee follow-up: 'We accepted the recon finding. Now show the attacker's infrastructure-building path AFTER client-config profiling — with technique IDs.'", "question": "Put the infrastructure chain in order (top = first).", "items": ["Fingerprint client configurations (T1592.004)", "Obtain a capability that matches the profile (T1588.001)", "Acquire a look-alike domain for the lure (T1583.001)", "Compromise web services to host the decoy (T1584.006)", "Deliver a localized spearphishing link (T1566.002)"], "correctSeq": [0, 1, 2, 3, 4], "hint": "The ATT&CK description orders it: collection, then operational resources, then access. You cannot arm a decoy you have not acquired.", "explain": "T1592.004 output (OS, architecture, language, time zone) decides WHAT to obtain: T1588.001 (Obtain Capabilities: Malware) matches the 32-bit, en-GB profile. T1583.001 (Acquire Infrastructure: Domains) registers the look-alike domain the lure needs. T1584.006 (Compromise Infrastructure: Web Services) arms the decoy pages. T1566.002 (Spearphishing Link) delivers the localized lure. This is the 'establishing operational resources' chain the T1592.004 description names — profile, obtain, acquire, arm, deliver. The audit committee hears one message: today's public detail is tomorrow's intrusion.", "study": "Resource chains have an order: profile, obtain, acquire, arm, deliver."}, {"id": "x08", "type": "match", "kindLabel": "Matching", "title": "What each detection investment buys", "summary": "Four investments mapped to the visibility they add.", "scenario": "Your detection roadmap has four candidate investments. The CISO asks what visibility each one actually adds against T1592.004-style recon.", "question": "Match each investment to the visibility it adds.", "left": ["External attack-surface scanning", "Perimeter log analytics for HEAD/banner-grab patterns", "Canary pages that answer with fingerprint traps", "Internet-scanner pattern analytic (DET0820 / AN1952)"], "right": ["Alerts when malicious content tries to collect client configuration information from visitors", "Shows what attackers see: exposed banners and public data", "Alerts when someone probes YOUR endpoints for version strings", "Catches T1595-style collection attempts against your services"], "pairs": [1, 3, 2, 0], "hint": "One investment is about YOUR attack surface, two are about THEIR probing, one is ATT&CK's own analytic for malicious fingerprinting content.", "explain": "External scanning is your ground truth — it shows what attackers see. Perimeter analytics catch T1595-style probing of your services. Canary pages alert when someone specifically hunts version strings. DET0820/AN1952 is ATT&CK's own detection strategy: internet scanners looking for patterns of malicious content designed to collect client configuration information from visitors. Note the honest limits: off-perimeter collection (open data, partner sites) stays blind — that is why ATT&CK focuses detection on related stages such as Initial Access.", "study": "Match every investment to a visibility statement; reject investments you cannot describe that way."}, {"id": "x09", "type": "dnd", "kindLabel": "Evidence sorting", "title": "Targeted or opportunistic?", "summary": "Six factors. Sort: supports a targeted assessment vs opposes or stays neutral.", "scenario": "Legal asks you to justify the word 'targeted' in yesterday's assessment. Six factors are on the table — some support, some oppose, some are neutral noise.", "question": "Sort each factor by whether it SUPPORTS a targeted-collection assessment.", "zones": ["Supports 'targeted'", "Opposes / neutral"], "items": ["The probes hit only the two endpoints that expose version strings", "The same user agent appears in scans of 40 unrelated organizations", "Probes started within minutes of your header config change", "Requests ran at a steady 14/hour cadence typical of scanner fleets", "No capabilities or lures have been observed yet", "Probes repeated for three nights from the same residential-VPN ASN, avoiding business hours"], "map": [0, 1, 0, 1, 1, 0], "hint": "Support means: this actor paid attention to YOU specifically. Cadence, breadth and absence-of-evidence do not show attention.", "explain": "Supporting: endpoint selectivity (only version endpoints), reaction timing (minutes after YOUR config change), and the three-night, off-hours, same-ASN pattern (deliberate tradecraft). Opposing or neutral: a UA shared across 40 orgs, a fleet-typical cadence, and absence of capabilities (absence is not evidence of targeting). Weighing factors — not counting them — is the analytic job.", "study": "Targeting shows as attention: selectivity, reaction, repetition."}, {"id": "x10", "type": "logview", "kindLabel": "Log deep-read", "title": "Separate recon from routine", "summary": "Twelve log lines with noise and one decoy. Select the recon indicators.", "scenario": [{"label": "Artefact — portal access log (night window, combined format)", "html": "<pre class=\"code\">198[.]51[.]100[.]7 - \"GET /style.css HTTP/1.1\" 200 \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0\"\n203[.]0[.]113[.]44 - \"HEAD / HTTP/1.1\" 200 \"curl/8.4.0\"\n198[.]51[.]100[.]7 - \"GET /favicon.ico HTTP/1.1\" 200 \"Mozilla/5.0 (iPhone; CPU iPhone OS 17_2 like Mac OS X)\"\n198[.]51[.]100[.]7 - \"GET /wp-cron.php?doing_wp_cron HTTP/1.1\" 200 \"WordPress/6.4; hxxp://www[.]victim[.]example\"\n203[.]0[.]113[.]44 - \"GET /CHANGELOG.txt HTTP/1.1\" 200 \"Mozilla/5.0 (compatible; Nmap Scripting Engine)\"\n198[.]51[.]100[.]7 - \"GET /assets/hero.jpg HTTP/1.1\" 200 \"Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)\"\n198[.]51[.]100[.]99 - \"GET / HTTP/1.1\" 200 \"Googlebot/2.1 (+hxxp://www.google[.]com/bot.html)\"\n198[.]51[.]100[.]7 - \"GET /blog HTTP/1.1\" 200 \"Mozilla/5.0 (X11; Linux x86_64; rv:121.0) Firefox/121.0\"\n203[.]0[.]113[.]51 - \"POST /wp-login.php HTTP/1.1\" 403 \"Mozilla/5.0 (Windows NT 6.1; Win64; x64)\"\n203[.]0[.]113[.]44 - \"GET /server-status HTTP/1.1\" 403 \"curl/8.4.0\"\n198[.]51[.]100[.]7 - \"GET /rss HTTP/1.1\" 200 \"FeedFetcher-Google; (+hxxp://www.google[.]com/fetcher)\"\n198[.]51[.]100[.]7 - \"GET /assets/app.js.map HTTP/1.1\" 200 \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0\"</pre>"}, {"label": "Context", "html": "<p>Google publishes crawler ranges (198[.]51[.]100[.]99 is NOT one). The WordPress site self-cronjobs at this hour. 203[.]0[.]113[.]51 is a new, unregistered source.</p>"}], "question": "Select every line that is a client-configuration or version-fingerprinting indicator.", "lines": ["198[.]51[.]100[.]7 - \"GET /style.css HTTP/1.1\" 200 \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0\"", "203[.]0[.]113[.]44 - \"HEAD / HTTP/1.1\" 200 \"curl/8.4.0\"", "198[.]51[.]100[.]7 - \"GET /favicon.ico HTTP/1.1\" 200 \"Mozilla/5.0 (iPhone; CPU iPhone OS 17_2 like Mac OS X)\"", "198[.]51[.]100[.]7 - \"GET /wp-cron.php?doing_wp_cron HTTP/1.1\" 200 \"WordPress/6.4; hxxp://www[.]victim[.]example\"", "203[.]0[.]113[.]44 - \"GET /CHANGELOG.txt HTTP/1.1\" 200 \"Mozilla/5.0 (compatible; Nmap Scripting Engine)\"", "198[.]51[.]100[.]7 - \"GET /assets/hero.jpg HTTP/1.1\" 200 \"Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)\"", "198[.]51[.]100[.]99 - \"GET / HTTP/1.1\" 200 \"Googlebot/2.1 (+hxxp://www.google[.]com/bot.html)\"", "198[.]51[.]100[.]7 - \"GET /blog HTTP/1.1\" 200 \"Mozilla/5.0 (X11; Linux x86_64; rv:121.0) Firefox/121.0\"", "203[.]0[.]113[.]51 - \"POST /wp-login.php HTTP/1.1\" 403 \"Mozilla/5.0 (Windows NT 6.1; Win64; x64)\"", "203[.]0[.]113[.]44 - \"GET /server-status HTTP/1.1\" 403 \"curl/8.4.0\"", "198[.]51[.]100[.]7 - \"GET /rss HTTP/1.1\" 200 \"FeedFetcher-Google; (+hxxp://www.google[.]com/fetcher)\"", "198[.]51[.]100[.]7 - \"GET /assets/app.js.map HTTP/1.1\" 200 \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0\""], "correctLines": [1, 4, 6, 9], "hint": "Four lines carry version-hunting intent. One alarming-looking POST is a different problem entirely — and not recon.", "explain": "Recon indicators: the HEAD from curl (headers/banners), CHANGELOG.txt via a scripting engine (version file), the spoofed Googlebot from a non-Google range (identity disguise for fingerprinting), and /server-status via curl (server state and versions). The wp-login POST with 403s looks alarming but is a different technique class (authentication probing) — clicking it subtracts. wp-cron is the site's own scheduler; rss/fetcher and image/style requests are routine.", "study": "Classify intent per line; do not let a loud different-problem steal the click."}, {"id": "x11", "type": "order", "kindLabel": "Risk ranking", "title": "One fix before the board call", "summary": "Four exposures — rank by remediation urgency.", "scenario": "Board call in 30 minutes. The morning crew can fix exactly ONE exposure today. Rank the four findings by REMEDIATION URGENCY so the crew starts with the right one.", "question": "Rank from most to least urgent (top = fix first).", "items": ["Public staging site still serving a full phpinfo() page", "Versioned Server banner on the internet-facing mail gateway", "Old CV PDF of a sysadmin still downloadable from the careers subdomain", "Generic 'nginx' banner with no version on the marketing blog"], "correctSeq": [0, 1, 2, 3], "hint": "Urgency tracks attacker value AND how fast the fix lands. A page that prints the whole profile is minutes from fixed — and minutes from crawled.", "explain": "The phpinfo() page prints OS, versions and configuration to every visitor — maximal T1592.004-relevant exposure, and the fix is deleting one file. The mail gateway banner is live on a high-value service and one config change away from fixed. The CV PDF needs a takedown and is already cached somewhere, but it is one person's stack, not the fleet. The generic banner confirms a product but gives no version to match. Urgency = attacker value times speed-of-fix; that is why the phpinfo page outranks everything.", "study": "Rank exposures by value times velocity-of-fix, then assign the crew."}, {"id": "x12", "type": "fill", "kindLabel": "Gap fill", "title": "Executive brief, five gaps", "summary": "Senior vocabulary under pressure — five gaps.", "scenario": "The CISO's morning brief has five gaps. Every word choice will be quoted upwards. Choose like a senior analyst.", "question": "Fill the five gaps of the executive brief.", "template": "We assess the actor performed {0} (T1592.004) against our client fleet. Most collection happens {1} our perimeter, so our SIEM cannot see it directly. We prioritise {2} reduction over IP blocking because scanner addresses are {3}. The block of the shared /24 carries a {4} impact for PartnerX monitoring.", "answers": ["client-config profiling", "outside", "attack-surface", "ephemeral", "partner"], "bank": ["client-config profiling", "outside", "attack-surface", "ephemeral", "partner", "T1059 execution", "inside", "log-volume", "static", "zero"], "hint": "Technique first (not an execution technique). Where does recon happen? What do you actually reduce? How long does a scanner keep one address? Whose impact?", "explain": "<b>Client-config profiling</b> names the technique (T1059 is an execution technique — wrong stage). Collection happens <b>outside</b> the perimeter, hence SIEM blindness. You reduce the <b>attack surface</b>, not log volume. Scanner addresses are <b>ephemeral</b>, which is why blocking is a palliative. A shared /24 block has <b>partner</b> impact — the cost you state upfront in a defensible brief.", "study": "Executive language: name the technique, the blind spot, the real lever, the churn, and the cost."}, {"id": "x13", "type": "branch", "kindLabel": "Decision chain", "title": "The marketing pixel vs the headers", "summary": "Three decisions to satisfy security AND the business.", "scenario": [{"label": "Ticket MKT-8821 (marketing)", "html": "<p>'Our analytics pixel validates against the exact X-Powered-By value from the vendor demo. Request: do not strip response headers — the pixel breaks and the campaign reporting dies.'</p>"}, {"label": "Ticket SEC-4410 (security)", "html": "<p>'External scans show framework + version disclosure on the campaign landing pages for six months. This is T1592.004 collection data. Fix required.'</p>"}, {"label": "Context", "html": "<p>The pixel reads page content, not response headers. The vendor demo was captured against an unhardened staging site.</p>"}], "question": "Take the three decisions on the stakeholder conflict.", "steps": [{"question": "Step 1: What is the technically correct risk position?", "options": ["Version disclosure is real recon value (T1592.004); it must be fixed regardless of the pixel's convenience", "The pixel matters more; keep the headers until the campaign ends", "The risk is zero because no exploit has been observed"], "answerIdx": 0, "hint": "Six months of published versions is collected data, not a hypothetical.", "ack": "Position recorded. Next."}, {"question": "Step 2: Which action satisfies security AND marketing?", "options": ["Strip or genericize version headers at the reverse proxy — the pixel, which reads page content, keeps working", "Tell marketing to rebuild the campaign site from zero", "Kee ECIDE this, or does it happen on its own?", "explain": "Staging indicators: a fresh .hta in the webroot (a deliverable payload), a webshell-style POST (capabilities being placed), and a new scheduled task (someone decided). Routine: log rotation, the weekly health check, and an old backup file nobody touched since March. When recon is followed by staging, your assessment upgrades from T1592.004 collection to pre-exploitation activity — the ATT&CK note about watching Initial Access stages in action.", "study": "Decided-vs-automatic is the sorting question for staging assessment."}, {"id": "x16", "type": "order", "kindLabel": "Ordering", "title": "Detection roadmap sequencing", "summary": "Four investments — order them so each enables the next.", "scenario": "Your detection-engineering roadmap for recon visibility has four investments. The board asks why this order and not another.", "question": "Put the roadmap in the right order (top = first).", "items": ["Baseline the external fingerprint with an attack-surface scan", "Instrument perimeter logs for banner-grab and HEAD-probe patterns", "Deploy canary pages that trap fingerprinting content (DET0820-style)", "Feed verified indicators to watchlists and focus on Initial Access stages"], "correctSeq": [0, 1, 2, 3], "hint": "You cannot tune analytics on unmeasured data, and watchlists are only as good as the verified indicators feeding them.", "explain": "Baseline first: you need to know what attackers see before you can detect their interest in it. Then perimeter analytics, tuned against that baseline, catch probing patterns with fewer false positives. Then canaries give high-fidelity alerts on fingerprinting content — the DET0820 idea. Finally, verified indicators feed watchlists while analysis focuses on Initial Access, exactly where ATT&CK says the detection effort pays off. Each step feeds the next; reordering breaks the data flow.", "study": "Sequenced detection: measure, tune, trap, share."}]};

<script>
/* ============================================================
   CyberPulseAcademy exam engine — vanilla JS, no dependencies.
   One instance per file. Config arrives via window.EXAM.
   Implements: timer state machine (RUNNING / PAUSED_MANUAL /
   PAUSED_AUTO_CHECK / ENDED), partial-credit scoring
   max(0,(H-W)/N), hint penalty -0.10, skip + review pool,
   retake with reshuffle, CYBERPULSE score report, handshake.
   ============================================================ */
(function () {
  'use strict';
  var CFG = window.EXAM;
  var $ = function (id) { return document.getElementById(id); };

  /* ---------------- helpers ---------------- */
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function shuffle(arr) {
    var a = arr.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1));
      t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function fmtTime(sec) {
    if (sec < 0) { sec = 0; }
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function scoreExercise(H, W, N) {
    if (N <= 0) { return 0; }
    return Math.max(0, (H - W) / N);
  }
  function normCmd(cmd) {
    return String(cmd || '').trim().replace(/\s+/g, ' ').toLowerCase()
      .replace(/\[/g, '').replace(/\]/g, '').replace(/\/+$/, '');
  }

  /* ---------------- state ---------------- */
  var S = {
    phase: 'intro',            /* intro | exam | review | results */
    idx: 0,
    order: [],                 /* shuffled exercise indexes */
    rt: [],                    /* runtime per exercise */
    timerState: 'IDLE',
    remaining: 0,
    tickHandle: null,
    stateSince: 0,
    pausedManualTotal: 0,
    pausedAutoTotal: 0,
    score: 0,
    answered: 0,
    reported: false,
    reviewReturn: false,
    userInfo: null
  };
  var ADV = { active: false, left: 0, handle: null }; /* advisory per-exercise timer (EXTREMELY HARD terminal) */

  function rt(i) { return S.rt[S.order[i]]; }

  /* ---------------- timer state machine ---------------- */
  var STATE_LABEL = {
    IDLE: ['\u23F8', 'Idle'],
    RUNNING: ['\u25B6', 'Running'],
    PAUSED_MANUAL: ['\u23F8', 'PAUSED — manual (press Resume)'],
    PAUSED_AUTO_CHECK: ['\u23F8', 'PAUSED — reviewing feedback (resumes on Next)'],
    ENDED: ['\u23F9', 'Ended']
  };
  function setState(next) {
    var now = Date.now();
    if (S.timerState === 'PAUSED_MANUAL') { S.pausedManualTotal += (now - S.stateSince); }
    if (S.timerState === 'PAUSED_AUTO_CHECK') { S.pausedAutoTotal += (now - S.stateSince); }
    S.timerState = next;
    S.stateSince = now;
    renderTimerChip();
  }
  function startExamTimer() {
    S.remaining = CFG.minutes * 60;
    setState('RUNNING');
    if (S.tickHandle) { clearInterval(S.tickHandle); }
    S.tickHandle = setInterval(function () {
      if (S.timerState === 'RUNNING') {
        S.remaining -= 1;
        if (ADV.active && ADV.left > 0) {
          ADV.left -= 1;
          renderAdvisory();
          if (ADV.left === 0) { advisoryExpired(); }
        }
        if (S.remaining <= 0) {
          S.remaining = 0;
          setState('ENDED');
          finishExam(true);
        }
        renderTimerChip();
      }
    }, 1000);
    renderTimerChip();
  }
  function renderTimerChip() {
    var chip = $('timer-chip');
    var lab = STATE_LABEL[S.timerState] || STATE_LABEL.IDLE;
    chip.innerHTML = '<span class="t-ico">' + lab[0] + '</span> ' + fmtTime(S.remaining) +
      ' <span class="t-state">' + esc(lab[1]) + '</span>';
    chip.className = 'chip timer-chip state-' + S.timerState;
  }
  function renderAdvisory() {
    var box = $('advisory-chip');
    if (!box) { return; }
    if (!ADV.active) { box.innerHTML = ''; return; }
    var cls = ADV.left <= 30 ? 'adv-crit' : 'adv-warn';
    box.innerHTML = 'Per-exercise timer: <b>' + fmtTime(ADV.left) + '</b>';
    box.className = 'advisory ' + cls;
  }
  function advisoryExpired() {
    var box = $('advisory-chip');
    if (box) {
      box.innerHTML = 'Per-exercise timer expired.';
      box.className = 'advisory adv-crit';
    }
    var cmd = lastTerminalCommand();
    if (cmd && cmd.trim() !== '') { doCheck(); }
  }
  function startAdvisory(sec) {
    ADV.active = true; ADV.left = sec;
    renderAdvisory();
  }
  function stopAdvisory() {
    ADV.active = false; ADV.left = 0;
    renderAdvisory();
  }

  /* ---------------- header / score ---------------- */
  function updateHeader() {
    $('ex-counter').textContent = 'Exercise ' + (S.idx + 1) + ' of ' + S.order.length;
    var pct = S.answered > 0 ? Math.round((S.score / S.answered) * 100) : 0;
    $('score-chip').textContent = 'Score ' + S.score.toFixed(1) + ' / ' + S.answered + ' (' + pct + '%)';
  }
  function renderTimerStateAlways() { renderTimerChip(); }

  /* ---------------- screens ---------------- */
  function show(screen) {
    ['intro', 'exam', 'review', 'results'].forEach(function (s) {
      $('screen-' + s).style.display = (s === screen) ? 'block' : 'none';
    });
    S.phase = screen;
    window.scrollTo(0, 0);
  }

  /* ---------------- intro ---------------- */
  function renderIntro() {
    var greet = '';
    if (S.userInfo && S.userInfo.username) {
      greet = '<p class="greet">Welcome, <b>' + esc(S.userInfo.username) + '</b>. Good luck!</p>';
    }
    var h = '<div class="intro-wrap">' + greet +
      '<h1 class="intro-title">' + esc(CFG.title) + '</h1>' +
      '<div class="meta-row">' +
      '<span class="badge sev-' + CFG.sev + '">' + esc(CFG.sevName) + '</span>' +
      '<span class="chip">' + CFG.exCount + ' exercises</span>' +
      '<span class="chip">' + CFG.minutes + ' minutes</span>' +
      '<span class="chip">Pass mark: 70%</span>' +
      '<span class="chip">Hint: \u221210% of one exercise</span>' +
      '</div>' +
      '<div class="intro-grid">' +
      '<section class="intro-card"><h2>About this practice exam</h2>' + CFG.introHtml + '</section>' +
      '<section class="intro-card"><h2>How this exam works</h2>' +
      '<ul class="rules">' +
      '<li><b>Goal:</b> reach at least <b>70%</b>. Each exercise gives at most 1 point of credit.</li>' +
      '<li><b>Partial credit:</b> exercises with several correct items are scored per item. Wrong items subtract from correct ones (credit = (correct \u2212 wrong) \u00F7 total). A partly right answer still earns part of the point. Selecting everything is never a good idea.</li>' +
      '<li><b>Check = free thinking time:</b> when you press <b>Check</b>, the timer stops by itself. Read the feedback as long as you like. The timer starts again only when you press <b>Next</b>.</li>' +
      '<li><b>Manual pause:</b> the <b>Pause</b> button stops the timer and hides the exercise. Press <b>Resume</b> to continue.</li>' +
      '<li><b>Hints:</b> one hint per exercise. A hint costs 10% of that exercise\u2019s credit.</li>' +
      '<li><b>Skip:</b> every exercise has a <b>Skip</b> button. Skipped exercises go to a review pool. You may return to them until the timer ends. Before you finish, a review screen lists them. Skipped-and-never-answered exercises are excluded from your score \u2014 they count as neither right nor wrong.</li>' +
      '<li><b>Severity:</b> this file is the <b>' + esc(CFG.sevName) + '</b> tier. ' + esc(CFG.sevMeaning) + '</li>' +
      '<li><b>Exercise types:</b> ' + esc(CFG.typeList) + '.</li>' +
      '</ul></section>' +
      '</div>' +
      '<section class="intro-card themes"><h2>Keywords covered \u2014 T1592.004 concept map</h2>' + CFG.themesHtml + '</section>' +
      '<div class="start-row"><button id="btn-start" class="btn primary big">Start the exam</button></div>' +
      '</div>';
    $('screen-intro').innerHTML = h;
    $('btn-start').addEventListener('click', startExam);
  }

  /* ---------------- exam flow ---------------- */
  function startExam() {
    S.order = shuffle(S.order);
    resetRuntime();
    S.idx = 0; S.score = 0; S.answered = 0; S.reported = false;
    S.reviewReturn = false; S.prevAuto = false;
    S.pausedManualTotal = 0; S.pausedAutoTotal = 0;
    startExamTimer();
    show('exam');
    renderExercise();
    updateHeader();
  }
  function resetRuntime() {
    S.rt = [];
    CFG.exercises.forEach(function (ex, i) {
      /* clear per-attempt shuffle caches so retakes reshuffle answer choices */
      delete ex._shufOpts; delete ex._shufRight; delete ex._shufItems;
      delete ex._shufSeq; delete ex._shufBank;
      if (ex.type === 'branch' && Array.isArray(ex.steps)) {
        ex.steps.forEach(function (st) { delete st._shufOpts; });
      }
      S.rt.push({
        def: ex, n: i, done: false, skipped: false, credit: null,
        hintUsed: false, hintShown: false, answer: null, lastCmd: ''
      });
    });
  }

  function scenarioHtml(r) {
    var def = r.def;
    var out = '<div class="blk blk-scenario"><div class="blk-head" id="sc-toggle" role="button" tabindex="0" aria-expanded="true">' +
      '<span class="blk-ico">\u{1F4CB}</span> SCENARIO <span class="blk-toggle" id="sc-state">(collapse)</span></div>';
    out += '<div class="blk-body" id="sc-body">';
    if (def.summary) { out += '<p class="sc-summary">' + esc(def.summary) + '</p>'; }
    if (Array.isArray(def.scenario)) {
      def.scenario.forEach(function (a) {
        out += '<div class="artefact"><div class="artefact-label">' + esc(a.label) + '</div>' +
          '<div class="artefact-body">' + a.html + '</div></div>';
      });
    } else if (def.scenario) {
      out += '<p>' + def.scenario + '</p>';
    }
    out += '</div></div>';
    return out;
  }

  function renderExercise() {
    stopAdvisory();
    var r = rt(S.idx);
    var def = r.def;
    var hb = $('hint-box');
    if (hb) { hb.style.display = 'none'; hb.innerHTML = ''; }
    $('btn-hint').disabled = !!(r.hintShown || r.done);
    var wrap = $('exercise-area');
    var head = '<div class="blk blk-question"><div class="blk-head"><span class="blk-ico">\u2753</span> QUESTION</div>' +
      '<div class="blk-body"><p class="q-text">' + esc(def.question) + '</p></div></div>';
    wrap.innerHTML =
      '<div class="ex-topline"><span class="badge sev-' + CFG.sev + '">' + esc(CFG.sevName) + '</span>' +
      '<span class="ex-title">' + esc(def.title) + '</span>' +
      '<span class="ex-kind">' + esc(def.kindLabel) + '</span></div>' +
      scenarioHtml(r) +
      head +
      '<div class="blk blk-answer"><div class="blk-head"><span class="blk-ico">\u270D</span> YOUR ANSWER</div>' +
      '<div class="blk-body" id="answer-area"></div></div>' +
      '<div id="advisory-chip" class="advisory"></div>' +
      '<div class="action-row">' +
      '<button id="btn-check" class="btn primary">Check</button>' +
      '<button id="btn-next" class="btn" style="display:none">Next</button>' +
      '</div>' +
      '<div id="nudge-msg" class="nudge" role="status"></div>' +
      '<div id="feedback" class="feedback" aria-live="polite"></div>';
    $('sc-toggle').addEventListener('click', toggleScenario);
    $('sc-toggle').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleScenario(); }
    });
    renderers[def.type](r, $('answer-area'));
    $('btn-check').addEventListener('click', doCheck);
    $('btn-next').addEventListener('click', doNext);
    var isLast = (S.idx === S.order.length - 1);
    $('btn-next').textContent = isLast ? 'Final Submit' : 'Next';
    if (def.advisorySec && !r.done) {
      $('advisory-chip').className = 'advisory adv-warn';
      $('advisory-chip').innerHTML = 'This terminal exercise has a reduced per-exercise timer of ' + def.advisorySec + ' seconds. It pauses together with the main timer.';
      if (S.timerState === 'RUNNING') { startAdvisory(def.advisorySec); }
    }
    if (r.done) {
      $('btn-check').style.display = 'none';
      $('btn-next').style.display = '';
      $('btn-skip').disabled = true;
      renderFeedback(r, $('feedback'));
      lockAnswerArea();
    } else {
      $('btn-next').style.display = 'none';
      $('btn-check').style.display = '';
      $('btn-skip').disabled = false;
      $('feedback').innerHTML = '';
    }
    updateHeader();
    window.scrollTo(0, 0);
  }
  function toggleScenario() {
    var body = $('sc-body'), st = $('sc-state'), t = $('sc-toggle');
    var open = body.style.display !== 'none';
    body.style.display = open ? 'none' : 'block';
    t.setAttribute('aria-expanded', open ? 'false' : 'true');
    st.textContent = open ? '(expand \u2014 collapsed: ' + (rt(S.idx).def.summary || '') + ')' : '(collapse)';
  }

  /* ---------------- renderers per type ---------------- */
  var renderers = {
    qcm: function (r, area) {
      var def = r.def;
      var opts = def._shufOpts || (def._shufOpts = shuffle(def.options.map(function (o, i) { return { t: o, i: i }; })));
      var a = r.answer || (r.answer = { sel: -1 });
      var h = '<div class="opt-list" role="radiogroup" aria-label="Answer options">';
      opts.forEach(function (o, k) {
        var letter = String.fromCharCode(65 + k);
        h += '<button type="button" class="opt' + (a.sel === o.i ? ' selected' : '') + '" data-oi="' + o.i + '" role="radio" aria-checked="' + (a.sel === o.i) + '">' +
          '<span class="opt-letter">' + letter + '.</span> <span class="opt-text">' + esc(o.t) + '</span></button>';
      });
      h += '</div>';
      area.innerHTML = h;
      Array.prototype.forEach.call(area.querySelectorAll('.opt'), function (b) {
        b.addEventListener('click', function () {
          a.sel = parseInt(b.getAttribute('data-oi'), 10);
          Array.prototype.forEach.call(area.querySelectorAll('.opt'), function (x) { x.classList.remove('selected'); x.setAttribute('aria-checked', 'false'); });
          b.classList.add('selected'); b.setAttribute('aria-checked', 'true');
        });
      });
    },
    'qcm-multi': function (r, area) {
      var def = r.def;
      var opts = def._shufOpts || (def._shufOpts = shuffle(def.options.map(function (o, i) { return { t: o, i: i }; })));
      var a = r.answer || (r.answer = { sel: {} });
      var h = '<p class="mut">Select all options that apply. Wrong choices subtract.</p><div class="opt-list">';

    dnd: function (r, area) {
      var def = r.def;

      var a = r.answer || (r.answer = { placed: {} });
      var single = (def.zones.length === 1);

      var h = '<p class="mut">' + (single ?
        'Select the one item that belongs in the target, then press the target. A placed item can be sent back.' :
        'Select an item, then press the zone where it belongs. You can also drag items. Selecting everything hurts your score.') + '</p>';
      h += '<div class="dnd-wrap"><div class="dnd-bank"><h4>Items</h4><div id="dnd-bank-list" class="dnd-list"></div></div>';
      def.zones.forEach(function (z, zi) {
        h += '<div class="dnd-zone" data-zi="' + zi + '" tabindex="0" role="button" aria-label="Drop zone: ' + esc(z) + '"><h4>' + esc(z) + '</h4><div class="dnd-list" data-zi="' + zi + '"></div></div>';
      });

      function draw() {
        var bank = area.querySelector('#dnd-bank-list');

        def._shufItems.forEach(function (o) {

        Array.prototype.forEach.call(area.querySelectorAll('.dnd-list[data-zi]'), function (zl) {

        /* keyboard: keep focus on the same item after a re-render */
        if (lastFocusOi !== null) {

          lastFocusOi = o.i;

          } else if (single) {

    order: function (r, area) {
      var def = r.def;

      var a = r.answer || (r.answer = { seq: def._shufSeq.slice() });
      var focusReq = null;

    fill: function (r, area) {

    terminal: function (r, area) {
      var def = r.def;

      var h = '<div class="term-wrap">' +
        (def.briefing ? '<div class="term-brief">' + def.briefing + '</div>' : '') +
        '<div class="term-screen" id="term-screen" aria-live="polite"><div class="term-line term-sys">' + esc(def.motd || 'simulation shell \u2014 nothing here runs for real') + '</div></div>' +
        '<div class="term-input-row"><span class="term-prompt">' + esc(def.prompt || 'analyst@box:~$') + '</span>' +
        '<input id="term-input" class="term-input" type="text" autocomplete="off" spellcheck="false" aria-label="Type your command" placeholder="type a command and press Enter"></div>' +
        '</div>';

      function run() {

    branch: function (r, area) {

        h += '<p class="q-text">' + esc(st.question) + '</p><div class="opt-list" role="radiogroup">';

            '<span class="opt-letter">' + letter + '.</span> <span class="opt-text">' + esc(o.t) + '</span></button>';

    logview: function (r, area) {

  function lastTerminalCommand() {
    var r = rt(S.idx);
    return r && r.lastCmd ? r.lastCmd : '';
  }

  /* ---------------- grading ---------------- */
  function grade(r) {
    var def = r.def, N, H = 0, W = 0, rows = [];
    function row(ok, state, text) { rows.push({ ok: ok, state: state, text: text }); }
    if (def.type === 'qcm') {
      N = 1;
      var sel = r.answer.sel;
      if (sel === def.answerIdx) { H = 1; }
      else if (sel >= 0) { W = 1; }
      def.options.forEach(function (o, i) {
        if (i === def.answerIdx) { row(true, sel === i ? 'correct' : 'missed', 'Correct answer: ' + o); }
        else if (sel === i) { row(false, 'wrong', 'You chose: ' + o); }
      });
    } else if (def.type === 'qcm-multi') {
      N = def.answerIdxs.length;
      def.options.forEach(function (o, i) {
        var isC = def.answerIdxs.indexOf(i) >= 0;
        var isS = !!r.answer.sel[i];
        if (isC && isS) { H++; row(true, 'correct', o); }
        else if (!isC && isS) { W++; row(false, 'wrong', o); }
        else if (isC && !isS) { row(true, 'missed', o); }
      });
    } else if (def.type === 'match') {
      N = def.left.length;
      def.left.forEach(function (L, i) {
        var pick = r.answer.picks[i];
        var rightTxt = def.right[def.pairs[i]];
        if (pick === def.pairs[i]) { H++; row(true, 'correct', L + ' \u2192 ' + rightTxt); }
        else if (pick === undefined) { row(true, 'missed', L + ' \u2192 ' + rightTxt); }
        else { W++; row(false, 'wrong', L + ' \u2192 ' + rightTxt); }
      });
    } else if (def.type === 'dnd') {
      var singleZone = (def.zones.length === 1);
      if (singleZone) {
        N = 1;
        def.items.forEach(function (t, i) {
          var placed = r.answer.placed[i];
          var isTarget = (def.map[i] === 0);
          if (isTarget && placed === 0) { H++; row(true, 'correct', t + ' \u2192 ' + def.zones[0]); }
          else if (isTarget && placed === undefined) { row(true, 'missed', t + ' \u2192 ' + def.zones[0]); }
          else if (!isTarget && placed === 0) { W++; row(false, 'wrong', t + ' (should NOT be placed in the target)'); }
        });
      } else {
        N = def.items.length;
        def.items.forEach(function (t, i) {
          var placed = r.answer.placed[i];
          if (placed === def.map[i]) { H++; row(true, 'correct', t + ' \u2192 ' + def.zones[def.map[i]]); }
          else if (placed === undefined) { row(true, 'missed', t + ' \u2192 ' + def.zones[def.map[i]]); }
          else { W++; row(false, 'wrong', t + ' \u2192 ' + def.zones[placed] + ' (should be: ' + def.zones[def.map[i]] + ')'); }
        });
      }
    } else if (def.type === 'order') {
      N = def.items.length;
      def.items.forEach(function (t, itemIdx) {
        var pos = r.answer.seq.indexOf(itemIdx);
        var want = def.correctSeq.indexOf(itemIdx);
        if (pos === want) { H++; row(true, 'correct', 'Position ' + (want + 1) + ': ' + t); }
        else { W++; row(false, 'wrong', 'Position ' + (want + 1) + ': ' + t + ' (you placed it at ' + (pos + 1) + ')'); }
      });
    } else if (def.type === 'fill') {
      N = def.answers.length;
      def.answers.forEach(function (ans, i) {
        var pick = r.answer.picks[i];
        if (pick === ans) { H++; row(true, 'correct', 'Gap ' + (i + 1) + ': ' + ans); }
        else if (pick === undefined) { row(true, 'missed', 'Gap ' + (i + 1) + ': ' + ans); }
        else { W++; row(false, 'wrong', 'Gap ' + (i + 1) + ': ' + ans + ' (you chose: ' + pick + ')'); }
      });
    } else if (def.type === 'terminal') {
      N = def.elements.length;
      var norm = normCmd(r.lastCmd);
      def.elements.forEach(function (e) {
        var re = new RegExp(e.re, 'i');
        if (re.test(norm)) { H++; row(true, 'correct', e.name + ': ' + (e.show || e.re)); }
        else { row(true, 'missed', e.name + ': ' + (e.show || e.re)); }
      });
      (def.wrong || []).forEach(function (e) {
        var re = new RegExp(e.re, 'i');
        if (re.test(norm)) { W++; row(false, 'wrong', e.name + ': ' + (e.show || e.re)); }
      });
      if (norm === '') { W = N; }
      var dangerHit = null;
      (def.danger || []).forEach(function (d) {
        var re = new RegExp(d.re, 'i');
        if (re.test(norm)) { dangerHit = d; }
      });
      if (dangerHit) { rows.unshift({ ok: false, state: 'danger', text: dangerHit.note }); }
    } else if (def.type === 'branch') {
      N = def.steps.length;
      def.steps.forEach(function (st, i) {
        var pick = r.answer.picks[i];
        if (pick === st.answerIdx) { H++; row(true, 'correct', 'Step ' + (i + 1) + ': ' + st.options[st.answerIdx]); }
        else if (pick === undefined) { row(true, 'missed', 'Step ' + (i + 1) + ': ' + st.options[st.answerIdx]); }
        else { W++; row(false, 'wrong', 'Step ' + (i + 1) + ': ' + st.options[st.answerIdx]); }
      });
    } else if (def.type === 'logview') {
      N = def.correctLines.length;
      def.lines.forEach(function (ln, i) {
        var isC = def.correctLines.indexOf(i) >= 0;
        var isS = !!r.answer.sel[i];
        if (isC && isS) { H++; row(true, 'correct', 'Line ' + (i + 1) + ': ' + ln); }
        else if (!isC && isS) { W++; row(false, 'wrong', 'Line ' + (i + 1) + ': ' + ln); }
        else if (isC && !isS) { row(true, 'missed', 'Line ' + (i + 1) + ': ' + ln); }
      });
    } else {
      N = 1;
    }
    var credit = scoreExercise(H, W, N);
    if (r.hintUsed) { credit = Math.max(0, credit - 0.10); }
    return { credit: credit, rows: rows, H: H, W: W, N: N };
  }

  /* ---------------- feedback ---------------- */
  function labelFor(credit) {
    if (credit >= 1) { return ['\u2714', 'CORRECT', 'ok']; }
    if (credit > 0) { return ['\u2714', 'PARTIALLY CORRECT', 'part']; }
    return ['\u2718', 'INCORRECT', 'bad'];
  }
  function renderFeedback(r, box) {
    var g = grade(r);
    var def = r.def;
    var lab = labelFor(g.credit);
    var h = '<div class="fb-head fb-' + lab[2] + '"><span class="fb-ico">' + lab[0] + '</span> ' + lab[1];
    if (g.N > 1 || g.credit !== Math.round(g.credit)) {
      h += ' \u2014 credit ' + g.credit.toFixed(2) + ' (' + g.H + '/' + g.N + ' items';
      if (g.W > 0) { h += ', ' + g.W + ' wrong'; }
      h += ')';
    }
    if (r.hintUsed) { h += ' <span class="fb-hintnote">(includes \u22120.10 hint cost)</span>'; }
    h += '</div>';
    if (g.rows.length > 1 || (def.type !== 'qcm')) {
      h += '<div class="fb-rows">';
      g.rows.forEach(function (rw) {
        var icon = rw.state === 'correct' ? '\u2714 Correct' : rw.state === 'wrong' ? '\u2718 Wrong' : '\u25CB Missed';
        if (rw.state === 'danger') { icon = '\u26A0 Warning'; }
        h += '<div class="fb-row"><span class="fb-state fb-' + rw.state + '">' + icon + '</span> <span>' + rw.text + '</span></div>';
      });
      h += '</div>';
    }
    h += '<div class="fb-explain"><b>Why:</b> ' + def.explain + '</div>';
    if (def.type === 'terminal') {
      h += '<div class="fb-canonical"><b>Expected command (copyable):</b><pre class="code" id="canon-cmd">' + esc(def.canonical) +
        '</pre><button class="btn mini" id="copy-canon" type="button">Copy</button></div>';
      if (def.canonExpl) {
        h += '<div class="fb-canon-expl"><b>Command parts:</b><ul>' + def.canonExpl.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div>';
      }
    }
    h += '<div class="fb-study"><b>What to study next:</b> ' + (def.study || 'Review the intro panel section about this concept, then retake the exam.') + '</div>';
    box.innerHTML = h;
    var copyBtn = box.querySelector('#copy-canon');
    if (copyBtn) {
      copyBtn.addEventListener('click', function () {
        var txt = def.canonical;
        function copyOk() {
          copyBtn.textContent = 'Copied \u2714';
          setTimeout(function () { copyBtn.textContent = 'Copy'; }, 2500);
        }
        function copyFallback() {
          try {
            var ta = document.createElement('textarea');
            ta.value = txt;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { ta.setSelectionRange(0, txt.length); } catch (e2) {}
            var done = false;
            try { done = document.execCommand('copy'); } catch (e3) {}
            document.body.removeChild(ta);
            copyBtn.textContent = done ? 'Copied \u2714' : 'Select and copy manually';
          } catch (e4) {
            copyBtn.textContent = 'Select and copy manually';
          }
        }
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt).then(copyOk, copyFallback);
          } else {
            copyFallback();
          }
        } catch (e) {
          copyFallback();
        }
      });
    }
  }

  /* ---------------- actions ---------------- */
  function nudgeMsg(msg) {
    var n = $('nudge-msg');
    if (n) { n.textContent = msg || ''; }
  }
  function doCheck() {
    var r = rt(S.idx);
    if (r.done) { return; }
    var def = r.def;
    /* guard: answer present — say so instead of failing silently */
    var a = r.answer || {};
    var empty = false;
    if (def.type === 'qcm') { empty = (a.sel === undefined || a.sel < 0); }
    else if (def.type === 'qcm-multi') { empty = (Object.keys(a.sel || {}).length === 0); }
    else if (def.type === 'match') { empty = (Object.keys(a.picks || {}).length === 0); }
    else if (def.type === 'dnd') { empty = (Object.keys(a.placed || {}).length === 0); }
    else if (def.type === 'fill') { empty = (Object.keys(a.picks || {}).length === 0); }
    else if (def.type === 'logview') { empty = (Object.keys(a.sel || {}).length === 0); }
    else if (def.type === 'terminal') { empty = (!r.lastCmd || r.lastCmd.trim() === ''); }
    else if (def.type === 'branch') { empty = (a.picks === undefined || Object.keys(a.picks).length < def.steps.length); }
    if (empty) {
      nudgeMsg(def.type === 'terminal'
        ? 'Run a command in the terminal first, then press Check.'
        : 'Choose an answer first, then press Check.');
      return;
    }
    nudgeMsg('');

    setState('PAUSED_AUTO_CHECK');
    stopAdvisory();
    var g = grade(r);
    r.done = true;
    r.credit = g.credit;
    S.score += g.credit;
    S.answered += 1;
    $('btn-check').style.display = 'none';
    $('btn-next').style.display = '';
    renderFeedback(r, $('feedback'));
    lockAnswerArea();
    updateHeader();
    var fb = $('feedback');
    fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function lockAnswerArea() {
    var aa = $('answer-area');
    Array.prototype.forEach.call(aa.querySelectorAll('button, select, input'), function (b) {
      b.disabled = true;
    });
  }
  function doNext() {
    if (S.timerState === 'PAUSED_AUTO_CHECK') { setState('RUNNING'); }
    var r = rt(S.idx);
    var isLast = (S.idx === S.order.length - 1);
    if (S.reviewReturn) {
      /* returning from the review-skipped screen: go back to it so the
         student explicitly chooses Final Submit (or keeps reviewing) */
      if (S.timerState === 'ENDED') {
        finishExam(false);
      } else {
        renderReview();
        show('review');
      }
      return;
    }
    if (isLast) {
      var pool = skippedIndexes();
      if (pool.length > 0 && S.timerState !== 'ENDED') {
        S.reviewReturn = true;
        renderReview();
        show('review');
        return;
      }
      finishExam(false);
      return;
    }
    S.idx += 1;
    renderExercise();
  }
  function skippedIndexes() {
    var out = [];
    S.rt.forEach(function (r, i) {
      if (r.skipped && !r.done) { out.push(i); }
    });
    return out;
  }
  function doSkip() {
    var r = rt(S.idx);
    if (r.done) { return; }
    r.skipped = true;
    if (S.reviewReturn) {
      renderReview();
      show('review');
      return;
    }
    var isLast = (S.idx === S.order.length - 1);
    if (isLast) {
      var pool = skippedIndexes();
      if (pool.length > 0 && S.timerState !== 'ENDED') {
        S.reviewReturn = true;
        renderReview();
        show('review');
      } else {
        finishExam(false);
      }
      return;
    }
    S.idx += 1;
    renderExercise();
  }
  function doPause() {
    if (S.timerState === 'RUNNING' || S.timerState === 'PAUSED_AUTO_CHECK') {
      S.prevAuto = (S.timerState === 'PAUSED_AUTO_CHECK');
      setState('PAUSED_MANUAL');
      $('pause-overlay').style.display = 'flex';
    }
  }
  function doResume() {
    if (S.timerState === 'PAUSED_MANUAL') {
      setState(S.prevAuto ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
      $('pause-overlay').style.display = 'none';
    }
  }
  function showHint() {
    var r = rt(S.idx);
    if (r.hintShown || r.done) { return; }
    r.hintShown = true; r.hintUsed = true;
    var box = $('hint-box');
    box.innerHTML = '<b>Hint (this exercise loses 10% of its credit):</b> ' + esc(r.def.hint);
    box.style.display = 'block';
    $('btn-hint').disabled = true;
  }

  /* ---------------- review skipped ---------------- */
  function renderReview() {
    var pool = skippedIndexes();
    var h = '<div class="intro-wrap"><h1 class="intro-title">Review skipped exercises</h1>' +
      '<p class="mut">You have ' + pool.length + ' skipped exercise(s) without an answer. You can answer them now, as many times as you like, until the timer ends. If you submit while some are still unanswered, they are excluded from your score.</p>';
    if (pool.length === 0) {
      h += '<p>All skipped exercises have been answered.</p>';
    } else {
      h += '<div class="review-list">';
      pool.forEach(function (i) {
        var r = S.rt[i];
        h += '<div class="review-row"><span class="review-title">' + esc(r.def.title) + '</span>' +
          '<button class="btn" data-i="' + i + '">Answer this exercise</button></div>';
      });
      h += '</div>';
    }
    h += '<div class="start-row"><button id="btn-final" class="btn primary big">Final Submit</button></div></div>';
    $('screen-review').innerHTML = h;
    Array.prototype.forEach.call($('screen-review').querySelectorAll('button[data-i]'), function (b) {
      b.addEventListener('click', function () {
        if (S.timerState === 'ENDED') {
          /* time is over: no more answering, go straight to results */
          finishExam(false);
          return;
        }
        var i = parseInt(b.getAttribute('data-i'), 10);
        S.idx = S.order.indexOf(i);
        if (S.idx < 0) { S.idx = i; S.order = S.rt.map(function (_, k) { return k; }); S.idx = S.order.indexOf(i); }
        renderExercise();
        show('exam');
      });
    });
    $('btn-final').addEventListener('click', function () { finishExam(false); });
  }

  /* ---------------- results ---------------- */
  function finishExam(fromTimeout) {
    if (S.tickHandle) { clearInterval(S.tickHandle); S.tickHandle = null; }
    setState('ENDED');
    stopAdvisory();
    var full = 0, part = 0, partSum = 0, wrong = 0, skipped = 0;
    S.rt.forEach(function (r) {
      if (r.done) {
        if (r.credit >= 1) { full++; }
        else if (r.credit > 0) { part++; partSum += r.credit; }
        else { wrong++; }
      } else if (r.skipped) {
        skipped++;
      }
    });
    var answered = S.answered;
    var pct = answered > 0 ? Math.round((S.score / answered) * 100) : 0;
    var pass = pct >= 70;
    var h = '<div class="intro-wrap"><h1 class="intro-title">Results \u2014 ' + esc(CFG.title) + '</h1>';
    h += '<div class="result-panel ' + (pass ? 'pass' : 'fail') + '">' +
      (pass ? '<div class="res-ico">\u{1F3C5}</div><h2>PASS \u2014 well done!</h2>' :
        '<div class="res-ico">\u2718</div><h2>Not passed yet</h2><p>You must retake this exam.</p>') +
      '<div class="res-score">' + S.score.toFixed(1) + ' / ' + answered + ' \u2014 ' + pct + '%</div>' +
      '<div class="res-passmark">Pass mark: 70%</div></div>';
    if (fromTimeout) { h += '<p class="mut">\u23F9 Time ended. Unanswered and skipped exercises were excluded from the score.</p>'; }
    h += '<div class="res-grid">' +
      '<div class="res-cell"><b>' + full + '</b> fully correct</div>' +
      '<div class="res-cell"><b>' + part + '</b> partially correct' + (part > 0 ? ' (avg credit ' + (partSum / part).toFixed(2) + ')' : '') + '</div>' +
      '<div class="res-cell"><b>' + wrong + '</b> fully incorrect</div>' +
      '<div class="res-cell"><b>' + skipped + '</b> skipped, not answered (excluded)</div>' +
      '</div>';
    var man = Math.round(S.pausedManualTotal / 1000);
    var auto = Math.round(S.pausedAutoTotal / 1000);
    h += '<div class="res-grid">' +
      '<div class="res-cell">Time paused manually: <b>' + fmtTime(man) + '</b></div>' +
      '<div class="res-cell">Time reviewing feedback: <b>' + fmtTime(auto) + '</b></div>' +
      '</div>';
    h += '<div class="start-row"><button id="btn-retake" class="btn primary big">Retake Exam</button></div></div>';
    $('screen-results').innerHTML = h;
    show('results');
    reportScore(S.score, answered, pct, pass);
    $('btn-retake').addEventListener('click', function () {
      S.reported = false;
      S.idx = 0; S.score = 0; S.answered = 0;
      startExam();
    });
  }
  function reportScore(creditSum, answeredCount, percent, passed) {
    if (S.reported) { return; }
    S.reported = true;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: CFG.topicId,
        batch: CFG.batch,
        score: Math.round(creditSum),
        total: answeredCount,
        percent: percent,
        passed: passed
      }, location.origin);
    } catch (e) {
      /* opened directly, nothing to report to */
    }
  }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) { return; }
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
    S.userInfo = event.data;
    renderIntro();
  });

  /* ---------------- boot ---------------- */
  function boot() {
    S.order = CFG.exercises.map(function (_, i) { return i; });
    S.rt = [];
    CFG.exercises.forEach(function (ex) {
      S.rt.push({ def: ex, done: false, skipped: false, credit: null, hintUsed: false, hintShown: false, answer: null, lastCmd: '' });
    });
    $('sev-badge').textContent = CFG.sevName;
    $('sev-badge').className = 'badge sev-' + CFG.sev;
    $('btn-hint').addEventListener('click', showHint);
    $('btn-pause').addEventListener('click', doPause);
    $('btn-resume').addEventListener('click', doResume);
    $('btn-skip').addEventListener('click', doSkip);
    renderIntro();
    show('intro');
    renderTimerChip();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
