var EX = [
{id:'ext-01',type:'multi',
 sc:[{t:'ARTEFACT 1 — Router peer table (rtr-tele-edge-01)',code:['peer 198[.]51[.]100[.]77   up  uptime 41d  (established, in inventory, partner AS65010)','peer 203[.]0[.]113[.]44    up  uptime 3d   (NOT in inventory extract)']},
     {t:'ARTEFACT 2 — Flow sample (72 hours)',code:['10[.]60[.]8[.]44 -> 198[.]51[.]100[.]77:443   sustained 72h  41GB  (partner link, known pattern)','10[.]60[.]8[.]44 -> 198[.]51[.]100[.]77:443   mirrored copy also observed to 203[.]0[.]113[.]44:8443']},
     {t:'ARTEFACT 3 — CTI advisory (excerpt)',x:'<p class="sc-p">"State-sponsored actors have compromised telecom edge devices worldwide; on the T1599 page, Salt Typhoon is documented abusing peer connections to exfiltrate data."</p>'},
     {t:'ARTEFACT 4 — Change and inventory records',x:'<p class="sc-p">No approved change on rtr-tele-edge-01 in 90 days. Inventory lookup for peer 203[.]0[.]113[.]44: <b>RECORD NOT FOUND</b> (the inventory tool had a migration gap last month).</p>'},
     {t:'ARTEFACT 5 — Facilities feed (noise)',x:'<p class="sc-p">HVAC unit 3 in the data hall raised a temperature warning. No physical-access badges were issued for the telecom cage.</p>'}],
 sum:'Sustained mirrored flows to an unknown peer; records incomplete; one noisy facility feed',
 q:'Which TWO conclusions are defensible from these artefacts?',
 o:['A 72-hour inside-originated stream ran out, mirrored to an unknown peer — bridged exfiltration','Peer 203[.]0[.]113[.]44 is unexplained: no ticket, no inventory record — treat it as suspected','The HVAC temperature alarm in the data hall proves someone entered the telecom cage physically','The 41GB flow volume proves that ransomware was deployed somewhere in the network','MFA is enforced on the device admin plane, so no compromise of this device is possible','The 41-day-old peer is the attacker, because old peerings are always malicious','The whole case can be closed as a routine nightly partner backup transfer pattern'],
 c:[0,1],
 why:'Two conclusions hold. First, the <b>behaviour</b>: an inside host sustained a 72-hour stream to the legitimate partner, with a <b>mirrored copy to an unknown peer</b> — duplication plus an unexplained peer matches the Salt Typhoon example (peer-connection abuse) and T1020.001-style duplication. Second, the <b>discipline</b>: 203[.]0[.]113[.]44 is unexplained; the inventory migration gap is a data-quality limitation, not an innocent verdict, so "suspected until proven" is the defensible state. The HVAC line is noise; nothing evidences ransomware; MFA does not make compromise impossible (sessions and credentials can still be abused); peer age alone proves nothing; and a mirrored stream to an unknown destination is not a backup pattern.',
 study:'reasoning with noise and missing records: what is evidenced, what is suspected, what is overclaimed.',
 hint:'One artefact is deliberately irrelevant, and one record is missing. Age alone, MFA alone, and backup patterns each fail a different test.'},
{id:'ext-02',type:'tree',
 sc:[{t:'ARTEFACT 1 — War-room summary (10:00, day 1)',x:'<p class="sc-p">rtr-tele-edge-01 config shows attacker-added NAT and peer lines. The compromised device still carries partner production traffic. Malicious streams to 203[.]0[.]113[.]44 are LIVE now. Partner SLA penalises daytime disruption. Legal wants evidence preserved. The CISO needs a decision in 10 minutes.</p>'}],
 sum:'The CISO decision chain for an active telecom edge bridge',
 q:'You are the incident commander. Five steps.',
 steps:[
  {text:'Step 1 — First decision: where does blocking happen?',
   o:['On the compromised device itself, to "cut the problem at the root"','On an unaffected upstream device in path (M1037), leaving the compromised device untouched','Nowhere yet: turn off monitoring to avoid noise'],c:1},
  {text:'Step 2 — Legal asks for evidence before any change. What order do you give the team?',
   o:['Block first, export later: stopping the attacker beats paperwork','Export config, flow and syslog evidence first, then block upstream','Ask the attacker to wait'],c:1},
  {text:'Step 3 — The partner SLA punishes daytime disruption, but the malicious streams are live NOW. What do you accept?',
   o:['Block only the confirmed malicious streams immediately and accept the partner-visible impact; schedule the wider access revocation for the agreed night window','Block all partner traffic now for maximum safety and accept the SLA penalty','Wait for the night window even though the attacker is live'],c:0},
  {text:'Step 4 — During the night window, which action keeps the operator out of your device?',
   o:['Rotate device admin credentials, revoke unrecognised peer sessions, and require MFA (M1032) for all admin access','Change the office Wi-Fi password','Postpone rotation until "after the investigation"'],c:0},
  {text:'Step 5 — The CISO asks: "Are we done?" What is the honest answer?',
   o:['Yes: the router shows up/up, so the case can close','No: M1037 requires continued monitoring, and the case stays open until telemetry proves the bridge is gone','Yes, if the partner stops complaining'],c:1}],
 why:'Step 1: the compromised device cannot be trusted to block itself — the block lands on an <b>unaffected upstream device</b> (M1037). Step 2: evidence first, action second; blocking destroys the state you would be reporting on. Step 3: this is the cost decision — surgical blocking of live malicious streams, with the wider disruption scheduled into the agreed window, balances harm against SLA in a defensible way; both extremes (burn everything, or wait while the attacker is live) fail. Step 4: rotation plus MFA closes the access the attacker used. Step 5: "done" is defined by telemetry, not by link state or complaints — monitoring continues until the bridge is demonstrably gone.',
 study:'incident command for boundary bridging: blocking point, evidence order, cost acceptance, rotation, and monitoring.',
 hint:'Each step has one answer that a senior commander would defend in writing afterwards. The two extremes in step 3 both fail a different stakeholder.'},
{id:'ext-03',type:'term',
 sc:[{t:'ARTEFACT 1 — Legal and technical constraints',x:'<p class="sc-p">Legal: "We need to know what is live versus what was saved, without altering anything, and without tipping the operator." You have admin SSH on rtr-tele-edge-01 (IOS, config archive enabled). The command is yours to choose.</p>'}],
 sum:'Compare live versus saved config under legal constraints (reduced timer announced)',
 q:'Type the command, press Enter to run it, then press Check.',
 prompt:'rtr-tele-edge-01#',
 banner:['rtr-tele-edge-01, case TL-77. Legal hold active. Evidence mode: read-only expected.','Per-exercise timer: 150 seconds, announced in advance.'],
 goal:'Show the differences between the saved startup configuration and the live running configuration. Nothing may change. Evidence must survive scrutiny.',
 sec:150,
 simOut:[{re:'^show\\s+archive\\s+config\\s+differences',out:['!Diff of startup-config vs running-config','+ ip nat inside source static tcp 10[.]60[.]8[.]44 3389 interface Gi0/0 3390','+ peer 203[.]0[.]113[.]44 remote-as 65534','--- 2 lines exist only in the RUNNING config (live, unsaved) ---']},{re:'^write|^(copy|erase|reload)',out:['% This simulation refuses to execute state-changing commands in evidence mode.']}],
 correctElems:[{s:'show',name:'read-only verb "show"'},{s:'archive config differences',name:'the archive config comparison (startup vs running)',accept:['archive config differences','archive config']}],
 wrongElems:[{s:'write erase',name:'"write erase" deletes the startup configuration — evidence destruction',dangerous:true,msg:'"write erase" wipes the saved configuration. Under legal hold that destroys evidence and hands the operator a clean slate. Never run destructive commands in evidence mode.'},{s:'copy running-config startup-config',name:'saving would freeze the attacker\'s lines as the new baseline',dangerous:true,msg:'Saving the config would make the attacker\'s bridge lines permanent and overwrite the last known-good saved state — exactly what legal needs intact.'},{s:'reload',name:'"reload" reboots the device and destroys live state',dangerous:true,msg:'"reload" reboots the router: live translations and sessions vanish, and the operator notices immediately.'}],
 canon:'show archive config differences',
 canonWhy:'<p style="margin:6px 0 0"><b>show archive config differences</b> compares the saved startup configuration with the live running configuration and prints the lines that exist only live — here, the attacker\'s NAT and peer lines. It is read-only, silent, and produces the artifact legal asked for: proof of what is live versus what was saved.</p>',
 why:'The legal question is precisely "live versus saved", and the read-only answer is <code>show archive config differences</code>. Saving ("copy running-config startup-config") would freeze the attacker\'s lines into the baseline; "write erase" destroys the saved evidence; "reload" destroys live state and alerts the operator. The command is the easy part — choosing the read-only path under pressure is the test.',
 study:'config archive comparisons on IOS, and evidence mode discipline.',
 hint:'The constraint to respect: read-only. The command word that compares archived configurations starts with "show".'},
{id:'ext-04',type:'order',
 sc:[{t:'ARTEFACT 1 — Case reconstruction (post-incident)',x:'<p class="sc-p">The post-incident review reconstructs the attacker chain that ended in bridged exfiltration. Place the six stages in the order they happened.</p>'}],
 sum:'The six-stage chain from access to duplicated exfiltration',
 q:'Order the six stages from first (top) to last (bottom).',
 items:['Obtain device admin access (stolen credentials or an exploit)','Persist on the device (extra local user or key)','Modify NAT and ACL lines so prohibited traffic crosses the boundary','Place an internal proxy on a segmentation device inside the network','Route command and control through the bridged path (multi-hop)','Exfiltrate with duplicated streams to two destinations'],
 why:'The chain mirrors the technique text and its linked objects: access first (nothing works without sufficient rights), then <b>persistence</b> so a reboot does not evict the attacker, then the <b>boundary change</b> itself (T1599), then <b>internal proxying</b> (T1090.001) to steer traffic inside, then <b>multi-hop command and control</b> (T1090.003) over the bridged path, and finally <b>duplicated exfiltration</b> (T1020.001) once C2 is stable. Reading incidents as chains — not as isolated events — is what lets you cut the right link.',
 study:'the full T1599 chain from admin access to duplicated exfiltration.',
 hint:'Access before persistence, the bridge before the traffic that uses it, C2 before data leaves.'},
{id:'ext-05',type:'qcm',
 sc:[{t:'ARTEFACT 1 — Organisational standard (extract)',x:'<p class="sc-p">Company standard CS-114: "Any compromised device is to be isolated immediately by powering it off." Case TL-77 involves the border router carrying partner production traffic, with live NAT sessions as evidence.</p>'}],
 sum:'A widely used best practice applied to the wrong case',
 q:'Why is the "power it off immediately" standard the WRONG action in this specific case?',
 o:['It wipes the live NAT state and drops partner traffic at once; preserve first, then block upstream','Because CS-114 was written for laptops and desktops, not for network devices','Because powering off is always fine if it is done quickly and announced to the team','Because the router model in this case has no software power switch at all'],
 c:[0],
 why:'The standard was written for endpoints: on a host, off means safe. On a <b>network device</b>, powering off destroys the volatile state — the live NAT table, the sessions, the running-config-only changes — that proves how the boundary was bridged, and it drops partner production at the same instant. The defensible sequence is: preserve evidence, block the specific streams on an unaffected upstream device (M1037), rotate access, and only then consider taking the device out of path in a controlled window. Standards need a device-class exception — that nuance is exactly what this case tests.',
 study:'why endpoint isolation doctrine does not transfer to network devices.',
 hint:'Ask what is volatile on a router and what the partner experiences in the same second.'},
{id:'ext-06',type:'multi',
 sc:[{t:'ARTEFACT 1 — Evidence checklist (case TL-77, legal review)',x:'<p class="sc-p">Legal asks: "Which items will still be defensible in six months?" Select the THREE that qualify.</p>'}],
 sum:'Which evidence items survive scrutiny?',
 q:'Select the THREE evidence items that survive scrutiny.',
 o:['The exported configuration archive with device timestamps, hashed on collection','Flow records covering the cross-boundary streams, exported from the flow collector','The device syslog messages recording the configuration-change events','A screenshot of the router rack taken months earlier for a facilities audit','Endpoint antivirus alerts from user laptops','A rumour about "the telecom thing" in the ops chat channel','The weather report from the week of the incident'],
 c:[0,1,2],
 why:'Defensible evidence is <b>device-generated, timestamped, and independently collected</b>: the hashed config archive, the flow records for the streams, and the syslog config-change events. Each one comes from a system that does not depend on human memory, and together they reconstruct the bridge. The screenshot predates the incident; endpoint antivirus on laptops cannot see a router-level bridge at all; chat rumours and weather reports are noise. When legal challenges the case, only the first three hold the line.',
 study:'evidence quality: device-generated, timestamped, hashed, and relevant to the boundary.',
 hint:'One item is real but from the wrong time, three are from the wrong layer or no layer at all.'},
{id:'ext-07',type:'tree',
 sc:[{t:'ARTEFACT 1 — Two readings of one night (case TL-77, later)',x:'<p class="sc-p">Reading A: the 03:14 config change matches an APPROVED emergency change by the MSP (EM-918, on-call approval). The new traffic goes to the partner org, whose ticket B-77 declares a nightly batch window 02:00–05:00. Reading B: ONE peer connection to an unknown address persists past every window, and no ticket mentions it.</p>'}],
 sum:'Most events are explained; one persistent peer is not',
 q:'Four steps. Sometimes the correct action is to not act yet.',
 steps:[
  {text:'Step 1 — Two readings pull in opposite directions. What rules?',
   o:['The approved change explains everything; close the case','Most events are explained by EM-918 and B-77; the unexplained persistent peer still requires a case','The scary-sounding unknown address wins; block everything'],c:1},
  {text:'Step 2 — The partner demands "block nothing, we have an SLA". The SOC lead says "block now". What is the correct move?',
   o:['Escalate to the incident manager with both readings, capture peer metadata, and ask the partner to confirm the peer — do not block yet','Block immediately against the partner\'s written SLA','Do nothing at all and delete the alert'],c:0},
  {text:'Step 3 — What single fact would flip the case to blocking?',
   o:['A senior manager says it feels wrong','The partner confirms in writing that the persistent peer is not theirs','A new email arrives from anyone'],c:1},
  {text:'Step 4 — While you wait, what stays in place?',
   o:['Nothing; alerts are noisy anyway','Monitoring on the persistent peer, with the upstream filter in log-only (monitor) mode','A full daytime block of the partner link'],c:1}],
 why:'Step 1: correlation works both ways — the approved change and the partner batch window legitimately explain most events, but an approved window never covers an <b>unexplained persistent peer</b>; "close everything" and "block everything" both skip the middle truth. Step 2: with two defensible readings and a business SLA at stake, the senior move is to <b>escalate with both readings and gather more evidence</b> — blocking now risks a costly false alarm, deleting the alert risks the real one. Step 3: the flip condition must be evidentiary — the partner\'s written denial of the peer makes it unambiguously hostile. Step 4: waiting is not idling: monitoring continues and the upstream filter runs in monitor mode, so the moment the flip fact arrives, enforcement is one change away.',
 study:'escalation under ambiguity, flip conditions, and monitoring while you wait.',
 hint:'Step 2 asks for process, not for heroics. Step 3 asks for a fact, not a feeling.'},
{id:'ext-08',type:'match',
 sc:[{t:'ARTEFACT 1 — Five lines from case TL-77',code:['L1  02:14:07 CONFIG_I: acl edit + new peer line, flow from unusual source 90 seconds later','L2  CONFIG_I: ip nat inside source static tcp 10[.]60[.]8[.]44 3389 ... (no ticket)','L3  upstream-01: deny tcp 203[.]0[.]113[.]44 -> any (applied 22:00 after case TL-77 opened)','L4  CHG-2263: syslog server added on fw-core-01, approved, window honoured','L5  flow: 10[.]60[.]8[.]44 -> 198[.]51[.]100[.]77:443 AND 10[.]60[.]8[.]44 -> 203[.]0[.]113[.]44:8443, same second']}],
 sum:'Five lines, five different labels',
 q:'Match each line to its correct label.',
 left:['L1 — ACL edit plus an unusual-source flow 90 seconds later','L2 — A static NAT line added with no ticket','L3 — Upstream deny of the malicious peer after the case opened','L4 — Approved syslog server change on fw-core-01','L5 — The same stream leaving to two destinations in the same second'],
 right:['DET0006 correlation hit: change plus following unusual flow','T1599.001 evidence: a NAT configuration modification','M1037 response action: filtering on an unaffected device','Routine change: ticketed, approved, window honoured','T1020.001 evidence: duplicated exfiltration streams'],
 correct:[0,1,2,3,4],
 why:'Each line demonstrates one concept from this topic. L1 is the <b>analytic</b> firing: change correlated with unusual flow (DET0006). L2 is the <b>sub-technique</b> behaviour: NAT configuration modification (T1599.001) — and it has no ticket. L3 is the <b>mitigation in action</b>: blocking on an unaffected device (M1037). L4 is the <b>routine baseline</b> that must not alarm anyone. L5 is the <b>follow-on technique</b>: duplication (T1020.001). Mislabelling any of these sends the report — and the response — in the wrong direction.',
 study:'labelling evidence lines with the right ATT&CK object, mitigation, or analytic.',
 hint:'One line is a detection, one is a behaviour, one is a response, one is routine, one is exfiltration.'},
{id:'ext-09',type:'match',
 sc:[{t:'ARTEFACT 1 — Clock audit (case TL-77)',x:'<p class="sc-p">Device rtr-tele-edge-01 local clock: verified 18 minutes FAST. The SIEM collector and the partner firewall are both NTP-synced to the same source. Three event records exist.</p>'}],
 sum:'Timestamp discipline when one clock drifts',
 q:'Match each record to the correct treatment in the report.',
 left:['Device local log: "03:14 config change" (clock 18 min fast, verified)','SIEM event: "02:56 config change seen" (NTP-synced collector)','Partner firewall: "01:56Z matching flow" (UTC, NTP-synced)'],
 right:['Record with an explicit drift note: clock was 18 min fast; never average it away silently','Use as the canonical event time for the joint timeline','Convert and record as 01:56Z with the source and timezone noted'],
 correct:[0,1,2],
 why:'Timestamp discipline keeps a joint timeline credible. The device log still gets recorded — it is evidence — but with an <b>explicit drift note</b>; silently normalising it would hide a checkable fact. The <b>NTP-synced SIEM event</b> becomes the canonical time that everything else aligns to. The partner\'s UTC record is stored as <b>01:56Z with its source noted</b>, so reviewers never have to guess which timezone produced which line. Mixing these treatments is how joint investigations end up arguing about clocks instead of attackers.',
 study:'recording clock drift, choosing the canonical source, and normalising timezones.',
 hint:'Nothing is deleted: one line gets a warning label, one becomes the reference, one keeps its timezone.'},
{id:'ext-10',type:'order',
 sc:[{t:'ARTEFACT 1 — Containment plan (case TL-77, legal hold active)',x:'<p class="sc-p">Order the five containment stages so that evidence survives, the attacker loses access, and the business impact stays justified.</p>'}],
 sum:'Containment stages under legal hold',
 q:'Order the five stages from first (top) to last (bottom).',
 items:['Place the case under legal hold and freeze the evidence window','Export and hash device configs, flow records and syslog','Block the confirmed malicious streams upstream in the agreed window','Rotate device admin credentials and revoke unknown peers','Rebuild the device from a known-good image and restore with review'],
 why:'Legal hold comes first because it defines what may be touched at all. Exporting and <b>hashing</b> follows, so every later action can be checked against captured evidence. Only then the upstream block executes — in the agreed window, on an unaffected device. Credential rotation and peer revocation close the attacker\'s administrative path. The rebuild is last: it is destructive by definition, it requires a controlled change window, and it only makes sense once nothing on the device is needed as evidence. Skipping straight to the rebuild is the classic mistake that erases the case.',
 study:'legal hold, hashed exports, surgical blocking, rotation, rebuild.',
 hint:'Ask each stage: what does it preserve, and what does it destroy? Destruction goes last.'},
{id:'ext-11',type:'dnd',
 sc:[{t:'ARTEFACT 1 — Coverage-gap workshop (after case TL-77)',x:'<p class="sc-p">Your team lists candidate controls. Drag each into the right column: does it actually cover the T1599 bridging path, or not?</p>'}],
 sum:'Coverage gap: which controls actually cover the bridging path?',
 q:'Drag each control to the correct column.',
 slots:['Covers the T1599 bridging path','Does NOT cover it (wrong layer or wrong asset)'],
 items:['TACACS+ command authorization for device administrators','Endpoint EDR on user laptops','Monitoring the NAT translation table against a baseline','Hardening the office printers','Upstream flow filtering on an unaffected in-path device','Web proxy category filtering for user browsing'],
 correct:[0,1,0,1,0,1],
 why:'Coverage follows the asset and the layer. <b>Device-level</b> controls cover the bridge: command authorization on TACACS+ stops unauthorised config lines, NAT table baselining exposes translations the config cannot explain, and upstream flow filtering (M1037) blocks bridged streams even while the device is compromised. <b>Endpoint</b> and user-layer tools — EDR on laptops, printer hardening, web proxy categories — see none of it, because the boundary device, not an endpoint, is the compromised asset. This gap analysis is what the next budget conversation should be built on.',
 study:'coverage reasoning: the control must sit on the path the technique uses.',
 hint:'The bridge lives on a network device. Controls that live on endpoints or unrelated assets cannot see it.'},
{id:'ext-12',type:'spot',
 sc:[{t:'ARTEFACT 1 — Incident report timeline (draft, case TL-77)',lines:['02:14  Config change on the border router — no approved change found','02:15  New permitted flow from outside to internal host 10[.]60[.]8[.]44','02:56  SIEM logs the same flow (NTP-synced collector)','03:10  Analyst note: "No bridge exists because the device enforces MFA on admin logins"','04:00  Second stream mirrors the first to a different destination']}],
 sum:'One line in the report draws a conclusion the evidence does not support',
 q:'Click the timeline line whose inference is WRONG.',
 lines:['02:14  Config change on the border router — no approved change found','02:15  New permitted flow from outside to internal host 10[.]60[.]8[.]44','02:56  SIEM logs the same flow (NTP-synced collector)','03:10  Analyst note: "No bridge exists because the device enforces MFA on admin logins"','04:00  Second stream mirrors the first to a different destination'],
 c:[3],
 why:'The 03:10 note is a non sequitur: <b>MFA on admin logins does not preclude bridging</b>. The attacker may have hijacked an already-MFA-authenticated session, abused a service or MSP account path, or exploited the device directly — and the timeline itself shows a config change plus cross-boundary flows, which is the bridge. The other lines are observations, not conclusions, and the 04:00 duplication line actually strengthens the case. Reports must separate what is observed from what is claimed.',
 study:'keeping observations and inferences separate in incident reports.',
 hint:'Three lines describe events. One line claims a safety guarantee the events themselves contradict.'},
{id:'ext-13',type:'tree',
 sc:[{t:'ARTEFACT 1 — Evidence gap (case TL-77)',x:'<p class="sc-p">rtr-tele-edge-01 predates config archiving. The startup configuration was last saved 8 months ago. The running config is live evidence, but no historical config snapshots exist.</p>'}],
 sum:'No config archive: what remains, and how confident can the report be?',
 q:'Two steps.',
 steps:[
  {text:'Step 1 — With no archive and a stale startup config, what evidence remains for the config-change history?',
   o:['Nothing is possible without an archive','Historical syslog config-change events, the live NAT table, and flow records','Ask the attacker for their changelog'],c:1},
  {text:'Step 2 — How must the report phrase its confidence?',
   o:['Claim a full reconstruction of every change ever made','State what is evidenced (recorded change events, flows, live state) and mark the missing config history as a limitation','Claim nothing happened because the archive is empty'],c:1}],
 why:'Step 1: the absence of an archive is a gap in one evidence type, not in all of them — syslog records change events as they happen, flow records show the traffic, and the live NAT table shows current state. Step 2: senior reporting separates the evidenced from the missing: you state exactly what the remaining artefacts support and name the archive gap as a limitation. Overclaiming ("full reconstruction") and underclaiming ("nothing happened") both mislead the reader; the limitation note is what survives review.',
 study:'reasoning around incomplete evidence and writing honest confidence statements.',
 hint:'One evidence type is missing. Step 1 asks which other types still exist; step 2 asks how honest reports handle gaps.'},
{id:'ext-14',type:'multi',
 sc:[{t:'ARTEFACT 1 — MSP decision memo (C0043 pattern)',x:'<p class="sc-p">A compromised MSP support subnet reached your VPN concentrator with valid tunnel credentials (the C0043 pattern: VPN tunnels via a potentially compromised MSP entity). The MSP also serves 40 other clients from the same platform. Pick the TWO actions that reduce risk without breaking MSP service for all clients.</p>'}],
 sum:'MSP trust abuse: surgical response without breaking the partnership',
 q:'Select the TWO correct actions.',
 o:['Revoke and re-issue the specific tunnel credentials used from the compromised support subnet','Enforce MFA on the VPN concentrator admin plane (M1032)','Terminate the entire MSP partnership today','Disable RADIUS and fall back to local device passwords','Wipe all concentrator configurations during business hours'],
 c:[0,1],
 why:'The surgical pair: revoke the <b>specific compromised credentials</b> so the attacker\'s path dies while every other client keeps working, and enforce <b>MFA on the admin plane</b> (M1032) so a repeated credential theft does not repeat the intrusion. The other three are the traps: terminating the partnership is a business decision, not an emergency control; disabling RADIUS <i>weakens</i> central authentication — the opposite of M1043/M1032; and wiping configs in business hours destroys evidence and causes an uncontrolled outage.',
 study:'surgical containment for third-party trust abuse, with the M1032 hardening that prevents a repeat.',
 hint:'Both correct actions narrow the attacker\'s path. The others widen damage or weaken authentication.'},
{id:'ext-15',type:'fib',
 sc:[{t:'ARTEFACT 1 — Executive brief (draft, four gaps)',x:'<p class="sc-p">The CISO one-pager needs exact language. Four keywords are missing.</p>'}],
 sum:'Complete the executive brief with four keywords',
 q:'Complete the brief from the word bank.',
 text:'The attacker {{0}} a perimeter device and changed its {{1}} so forbidden traffic crossed the trust {{2}}; data then left in {{3}} streams to two destinations.',
 bank:['compromised','configuration','boundary','duplicated','renamed'],
 blanks:[{accept:['compromised']},{accept:['configuration','config','NAT configuration']},{accept:['boundary']},{accept:['duplicated','mirrored','copied']}],
 why:'The brief tracks the technique exactly: the attacker <b>compromised</b> the device, changed its <b>configuration</b> (the NAT/peer lines), so forbidden traffic crossed the trust <b>boundary</b>, and data left in <b>duplicated</b> streams — the T1599 plus T1020.001 chain in plain words. "Renamed" belongs nowhere in this sentence. Executive language works when every word maps to an artefact your teams can show.',
 study:'writing T1599 findings in one precise sentence.',
 hint:'The four gaps in order: what happened to the device, what was changed, what was crossed, and how the data left.'},
{id:'ext-16',type:'qcm',
 sc:[{t:'ARTEFACT 1 — Review comments on the one-pager',x:'<p class="sc-p">Four candidate closing sentences for the CISO report. Three of them would be torn apart in review.</p>'}],
 sum:'Which closing sentence survives review?',
 q:'Which single sentence belongs in the CISO one-pager?',

  sel.forEach(function(si){if(corr.indexOf(si)>=0)g.H++;else g.W++;});
  g.credit=scoreExercise(sel,corr);
  ex.c.forEach(function(ci){g.items.push({name:plainText(ex.o[ci]),state:sel.indexOf(String(ci))>=0?'ok':'miss'});});
  sel.forEach(function(si){var i2=parseInt(si,10);if(ex.c.indexOf(i2)<0)g.items.push({name:plainText(ex.o[i2]),state:'bad'});});
 }else if(ex.type==='spot'){
  g.N=1;var s0=(w.sel||[])[0];
  if(s0===ex.c[0])g.H=1;else g.W=1;
  g.items=[];
  if(s0==null)g.items.push({name:'No line was clicked',state:'miss'});
  else if(s0!==ex.c[0])g.items.push({name:'Line '+(s0+1)+': '+ex.lines[s0],state:'bad'});
  g.items.push({name:'Line '+(ex.c[0]+1)+': '+ex.lines[ex.c[0]],state:s0===ex.c[0]?'ok':'miss'});
 }else if(ex.type==='dnd'){
  g.N=ex.items.length;
  ex.items.forEach(function(_,i){
   var si=-1;w.slots.forEach(function(arr,ix){if(arr.indexOf(i)>=0)si=ix;});
   if(si<0)g.items.push({name:plainText(dndLabel(ex,i))+' — left unsorted',state:'miss'});
   else if(si===ex.correct[i]){g.H++;g.items.push({name:plainText(dndLabel(ex,i))+' → '+plainText(ex.slots[si]),state:'ok'});}
   else{g.W++;g.items.push({name:plainText(dndLabel(ex,i))+' → placed in "'+plainText(ex.slots[si])+'"',state:'bad'});}
  });
  (ex.extra||[]).forEach(function(_,k){
   var i=100+k,si=-1;w.slots.forEach(function(arr,ix){if(arr.indexOf(i)>=0)si=ix;});
   if(si>=0){g.W++;g.items.push({name:'Distractor placed: '+plainText(dndLabel(ex,i)),state:'bad'});}
  });
 }else if(ex.type==='order'){
  g.N=ex.items.length;
  w.ord.forEach(function(i,pos){
   if(i===pos){g.H++;g.items.push({name:'Position '+(pos+1)+': '+plainText(ex.items[i]),state:'ok'});}
   else{g.W++;g.items.push({name:'Position '+(pos+1)+': you placed "'+plainText(ex.items[i])+'"; correct: "'+plainText(ex.items[pos])+'"',state:'bad'});}
  });
 }else if(ex.type==='match'){
  g.N=ex.left.length;
  document.querySelectorAll('#answ select[data-mrow]').forEach(function(sl){
   var li=parseInt(sl.getAttribute('data-mrow'),10),v=parseInt(sl.value,10);
   if(v<0)g.items.push({name:ex.left[li]+' — no answer',state:'miss'});
   else if(v===ex.correct[li]){g.H++;g.items.push({name:plainText(ex.left[li])+' → '+plainText(ex.right[v]),state:'ok'});}
   else{g.W++;g.items.push({name:plainText(ex.left[li])+' → '+plainText(ex.right[v]),state:'bad'});}
  });
 }else if(ex.type==='fib'){
  g.N=ex.blanks.length;
  document.querySelectorAll('#answ input[data-b]').forEach(function(inp){
   var bi=parseInt(inp.getAttribute('data-b'),10),v=nrmIP(inp.value);
   var ok=ex.blanks[bi].accept.some(function(a){return nrmIP(a)===v;});
   if(!v)g.items.push({name:'Blank '+(bi+1)+' — left empty',state:'miss'});
   else if(ok){g.H++;g.items.push({name:'Blank '+(bi+1)+': "'+inp.value+'"',state:'ok'});}
   else{g.W++;g.items.push({name:'Blank '+(bi+1)+': "'+inp.value+'" — not a fit',state:'bad'});}
  });
 }else if(ex.type==='term'){
  var cmd=(w.cmd&&w.ran)?w.cmd:($('#tcmd')?$('#tcmd').value:'');
  g.N=ex.correctElems.length;g.canon=ex.canon;
  if(!cmd||!cmd.replace(/\s/g,'')){
   g.items=[{name:'You did not type a command',state:'miss'}];
  }else{
   var n=nrmIP(cmd);
   ex.correctElems.forEach(function(ce){
    var found=(ce.accept||[ce.s]).some(function(a){return n.indexOf(nrmIP(a))>=0;});
    if(found){g.H++;g.items.push({name:'Element: '+ce.name,state:'ok'});}
    else g.items.push({name:'Element: '+ce.name,state:'miss'});
   });
   (ex.wrongElems||[]).forEach(function(we){
    if(n.indexOf(nrmIP(we.s))>=0){g.W++;g.items.push({name:'Used: '+we.s+' — '+we.name,state:'bad'});if(we.dangerous)g.danger=we;}
   });
  }
 }else if(ex.type==='tree'){
  g.N=ex.steps.length;
  ex.steps.forEach(function(st,si){
   var v=w.chosen?w.chosen[si]:null;
   if(v==null)g.items.push({name:'Step '+(si+1)+' — no answer',state:'miss'});
   else if(v===st.c){g.H++;g.items.push({name:'Step '+(si+1)+': '+plainText(st.o[v]),state:'ok'});}
   else{g.W++;g.items.push({name:'Step '+(si+1)+': you chose "'+plainText(st.o[v])+'"',state:'bad'});}
  });
 }
 if(g.credit==null)g.credit=Math.max(0,(g.H-g.W)/Math.max(1,g.N));
 return g;
}
/* ---------- check / feedback / navigation ---------- */
function onCheck(){
 var i=S.order[S.cur],ex=curEx(),r=curRec();
 if(r&&r.checked)return;
 if(S.timer.state!=='RUNNING')return;
 var g=grade(ex);
 var credit=g.credit;
 if(r&&r.usedHint)credit=Math.max(0,credit-0.10);
 credit=Math.round(credit*100)/100;
 r=r||{};r.credit=credit;r.checked=true;r.usedHint=!!r.usedHint;r.skipped=false;r.g=g;
 S.rec[i]=r;S.sum+=credit;S.answered++;
 S.skipped=S.skipped.filter(function(x){return x!==i;});
 renderFeedback(ex,r,g);
 var an=$('#answ');if(an)an.classList.add('locked');
 var last=S.cur===EX.length-1;
 $('#navrow').innerHTML=last
  ?'<button class="btn primary" data-act="final">⏹ Final Submit — see results</button>'
  :'<button class="btn primary" data-act="next">Next exercise ▶</button>';
 S.timer.prev=S.timer.state;S.timer.state='PAUSED_AUTO_CHECK';S.timer.fbStart=Date.now();
 renderHdr();renderBar();
}
function itemsFraction(g){var ok=0;g.items.forEach(function(it){if(it.state==='ok')ok++;});return ok+'/'+g.N+' items correct';}
function renderFeedback(ex,r,g){
 var lbl,cls;
 if(r.credit>=0.999){lbl='✓ CORRECT';cls='ok';}
 else if(r.credit>0){lbl='✓ PARTIALLY CORRECT';cls='part';}
 else{lbl='✗ INCORRECT';cls='bad';}
 var h='<div class="fb '+cls+'"><div class="fb-h">'+lbl
  +(r.credit>0&&r.credit<0.999?' <span class="cred">— '+itemsFraction(g)+', credit '+r.credit.toFixed(2)+'</span>':'')
  +(r.usedHint?' <span class="cred">(−0.10 hint applied)</span>':'')+'</div><div class="fb-b">';
 if(g.N>1)h+='<p style="margin:0 0 8px">Partial credit: (correct − wrong) ÷ '+g.N+' = <b class="cred">'+r.credit.toFixed(2)+'</b>. '+itemsFraction(g)+'.</p>';
 h+=g.items.map(function(it){
  return '<div class="itrow '+(it.state==='ok'?'it-ok':(it.state==='bad'?'it-bad':'it-miss'))+'"><span style="white-space:nowrap;font-weight:700">'+(it.state==='ok'?'✓ Correct':(it.state==='bad'?'✗ Wrong':'○ Missed'))+'</span><span class="in">'+esc(it.name)+'</span></div>';
 }).join('');
 h+='<p style="margin:12px 0 0"><b>Why this is the right answer:</b></p><p style="margin:4px 0 0">'+ex.why+'</p>';
 if(ex.dual)h+='<p style="margin:8px 0 0">'+ex.dual+'</p>';
 if(g.canon)h+='<p style="margin:12px 0 4px"><b>Canonical command (copyable):</b></p><pre class="code copy" tabindex="0">'+esc(g.canon)+'</pre>';
 if(ex.canonWhy)h+='<div>'+ex.canonWhy+'</div>';
 if(g.danger)h+='<div class="danger"><span class="d-t">✗ DANGEROUS — NEAR MISS</span><p style="margin:6px 0 0">'+esc(g.danger.msg)+'</p></div>';
 if(ex.study)h+='<div class="study"><b>What to study:</b> '+ex.study+'</div>';
 h+='</div></div>';
 $('#fbwrap').innerHTML=h;
}
function onNext(){
 if(S.timer.state==='PAUSED_AUTO_CHECK'){S.timer.fbSec+=Math.max(0,Math.round((Date.now()-S.timer.fbStart)/1000));S.timer.state='RUNNING';renderHdr();}
 if(S.reviewMode){S.reviewMode=false;openReview();return;}
 if(S.cur<EX.length-1){S.cur++;renderEx();window.scrollTo({top:0,behavior:(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)?'auto':'smooth'});}
}
function onSkip(){
 var i=S.order[S.cur],r=curRec();
 if(r&&r.checked)return;
 S.rec[i]=S.rec[i]||{};S.rec[i].skipped=true;S.rec[i].checked=false;
 if(S.skipped.indexOf(i)<0)S.skipped.push(i);
 if(S.reviewMode){S.reviewMode=false;openReview();return;}
 if(S.cur<EX.length-1){S.cur++;renderEx();}
 else if(S.skipped.length)openReview();
 else finishExam(false);
 window.scrollTo(0,0);
}
function onHint(){
 var i=S.order[S.cur],ex=curEx(),r=curRec();
 if(r&&r.checked)return;
 if(r&&r.usedHint)return;
 r=r||{};r.usedHint=true;S.rec[i]=r;
 $('#hintwrap').innerHTML='<div class="hintbox" role="status"><span class="h-t">💡 Hint — costs 10% of this exercise\'s credit</span><p style="margin:6px 0 0">'+ex.hint+'</p></div>';
 renderHdr();
}
function onPause(){
 if(S.timer.state==='RUNNING'||S.timer.state==='PAUSED_AUTO_CHECK'){
  S.timer.prev=S.timer.state;S.timer.state='PAUSED_MANUAL';S.timer.pauseStart=Date.now();
  document.body.classList.add('pman');renderHdr();
 }
}
function onResume(){
 document.body.classList.remove('pman');
 S.timer.manualSec+=Math.max(0,Math.round((Date.now()-S.timer.pauseStart)/1000));
 if(S.timer.prev==='RUNNING')S.timer.state='RUNNING';
 else S.timer.state='PAUSED_AUTO_CHECK';
 renderHdr();
}
function onFinal(){
 if(S.timer.state==='PAUSED_AUTO_CHECK'){S.timer.fbSec+=Math.max(0,Math.round((Date.now()-S.timer.fbStart)/1000));S.timer.state='RUNNING';renderHdr();}
 if(S.skipped.length)openReview();else finishExam(false);
}
/* ---------- review & results ---------- */
function openReview(){S.view='review';renderReview();window.scrollTo(0,0);}
function renderReview(){
 var h='<div class="pbar"><div class="pfill" style="width:100%"></div></div>';
 h+='<div class="card"><h1 style="margin:0 0 6px;font-size:22px">⚠ Review skipped exercises</h1>';
 h+='<p style="color:var(--text-secondary);margin:6px 0 14px">You have '+S.skipped.length+' skipped exercise(s). You may answer them now, as long as the timer has not ended ('+fmtT(S.timer.left)+' left). Skipped exercises that stay unanswered are excluded from your score — they count neither for nor against you.</p>';
 if(S.timer.state==='ENDED')h+='<div class="danger"><span class="d-t">■ TIME ENDED</span><p style="margin:6px 0 0">The exam time is over. Submit to see your results.</p></div>';
 if(!S.skipped.length)h+='<p>Nothing left in the skipped pool. Press Submit exam to finish.</p>';
 S.skipped.forEach(function(i){
  var ex=EX[i];
  h+='<div class="rvitem"><span class="rt">⚠ Skipped</span><span class="rq">'+esc(plainText(ex.q).slice(0,140))+'…</span><button class="btn" data-act="rv-answer" data-i="'+i+'">✎ Answer now</button></div>';
 });
 var pending=false;
 EX.forEach(function(_,i){var r=S.rec[i];if(!r||(!r.checked&&!r.skipped))pending=true;});
 h+='<div class="navrow">'+(pending&&!S.reviewMode?'<button class="btn" data-act="rv-back">◀ Back to exam</button>':'')+'<span class="spacer"></span><button class="btn primary" data-act="rv-submit">⏹ Submit exam</button></div></div>';
 $('#exwrap').innerHTML=h;renderHdr();
}
function answerSkipped(i){S.view='exam';S.reviewMode=true;S.cur=S.order.indexOf(i);renderEx();window.scrollTo(0,0);}
function renderBar(){var done=0;EX.forEach(function(_,i){var r=S.rec[i];if(r&&r.checked)done++;});var el=document.querySelector('#exwrap .pfill');if(el)el.style.width=Math.round(done/EX.length*100)+'%';}
function finishExam(timeout){
 clearInterval(S.timer.tick);S.timer.state='ENDED';S.view='results';
 renderResults(timeout);reportOnce();window.scrollTo(0,0);
}
function renderResults(timeout){
 var full=0,part=0,zero=0,partSum=0;
 EX.forEach(function(_,i){var r=S.rec[i];if(r&&r.checked){if(r.credit>=0.999)full++;else if(r.credit>0){part++;partSum+=r.credit;}else zero++;}});
 var skippedLeft=EX.length-S.answered;
 var pct=S.answered>0?Math.round(S.sum/S.answered*100):0;
 var pass=pct>=CFG.passMark;
 var used=CFG.minutes*60-S.timer.left;
 var h='<div class="card res">';
 h+='<h1 class="'+(pass?'pass':'fail')+'">'+(pass?'✓ PASS':'✗ FAIL')+'</h1>';
 h+='<div class="bignum" style="color:'+(pass?'var(--state-correct)':'var(--state-incorrect)')+'">'+pct+'%</div>';
 h+='<p style="color:var(--text-secondary)">'+(timeout?'⏱ Time ended. ':'')+'Final score over answered exercises: <b>'+S.sum.toFixed(1)+' / '+S.answered+'</b>. Skipped-and-unanswered exercises are excluded. Pass mark: '+CFG.passMark+'%.</p>';
 h+='<div class="stats">';
 h+='<div class="stat ok"><div class="num">'+full+'</div><div class="lab">✓ Fully correct</div></div>';
 h+='<div class="stat part"><div class="num">'+part+'</div><div class="lab">✓ Partially correct'+(part?' — avg credit '+(partSum/part).toFixed(2):'')+'</div></div>';
 h+='<div class="stat bad"><div class="num">'+zero+'</div><div class="lab">✗ Fully incorrect</div></div>';
 h+='<div class="stat skip"><div class="num">'+skippedLeft+'</div><div class="lab">⚠ Skipped — excluded</div></div>';
 h+='</div>';
 h+='<p style="color:var(--text-secondary);font-size:14px">⏱ Time used: '+fmtT(used)+' of '+fmtT(CFG.minutes*60)+' · ⏸ Paused manually: '+fmtT(S.timer.manualSec)+' · ⏸ Reviewing feedback: '+fmtT(S.timer.fbSec)+'</p>';
 if(pass)h+='<div class="fb ok"><div class="fb-h">✓ PASS — certificate panel</div><div class="fb-b"><p style="margin:0">Well done! You reached '+pct+'%, above the '+CFG.passMark+'% pass mark. You have shown a solid understanding of '+esc(CFG.objId)+' — '+esc(CFG.objName)+' at '+CFG.sev+' level. Keep this knowledge: next time a boundary device changes configuration and new traffic appears, you will know what to ask for.</p></div></div>';
 else h+='<div class="fb bad"><div class="fb-h">✗ FAIL — retake required</div><div class="fb-b"><p style="margin:0 0 10px">You scored '+pct+'%, below the '+CFG.passMark+'% pass mark. Reread the intro screen, review the feedback you received during the exam, and try again. You can retake the exam as many times as you want.</p></div></div>';
 h+='<div class="navrow"><span class="spacer"></span><button class="btn primary" data-act="retake" style="min-width:220px;min-height:52px">↻ Retake exam</button></div>';
 h+='</div>';
 $('#exwrap').innerHTML=h;
 $('#b-hint').disabled=true;$('#b-skip').disabled=true;
}
function reportOnce(){
 if(S.reported)return;S.reported=true;
 var percent=S.answered>0?Math.round((S.sum/S.answered)*100):0;
 if(window.parent&&window.parent!==window){
  try{
   parent.postMessage({type:'CYBERPULSE_SCORE',topicId:CFG.topicId,batch:CFG.batch,
    score:Math.round(S.sum),total:S.answered,percent:percent,passed:percent>=CFG.passMark},location.origin);
  }catch(e){/* parent origin mismatch (e.g. file:// sandbox); nothing to report to */}
 }
}
function retake(){
 document.body.classList.remove('pman');
 startExam();window.scrollTo(0,0);
}
/* ---------- header ---------- */
function renderHdr(){
 $('#h-count').textContent='Exercise '+(S.cur+1)+' of '+EX.length;
 var sev=$('#h-sev');sev.textContent=CFG.sev;sev.className='badge '+CFG.sevClass;
 $('#h-time').textContent=fmtT(S.timer.left);
 var st=$('#h-tstate');
 if(S.timer.state==='RUNNING'){st.textContent='▶ RUNNING';st.className='tstate run';}
 else if(S.timer.state==='PAUSED_MANUAL'){st.textContent='⏸ PAUSED — manual (press Resume)';st.className='tstate pm';}
 else if(S.timer.state==='PAUSED_AUTO_CHECK'){st.textContent='⏸ PAUSED — reviewing feedback (resumes on Next)';st.className='tstate pa';}
 else{st.textContent='■ ENDED';st.className='tstate end';}
 $('#h-score').textContent=S.sum.toFixed(1)+' / '+S.answered;
 $('#h-pct').textContent=(S.answered>0?Math.round(S.sum/S.answered*100)+'%':'—');
 var r=curRec();
 $('#b-hint').disabled=!!(r&&(r.checked||r.usedHint));
 $('#b-skip').disabled=!!(r&&r.checked);
 renderWho();
}
function renderWho(){$('#h-who').textContent=S.user?'👤 '+S.user:'';}
/* ---------- events ---------- */
function bind(){
 document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act');
  if(act==='start')startExam();
  else if(act==='check')onCheck();
  else if(act==='next')onNext();
  else if(act==='final')onFinal();
  else if(act==='skip')onSkip();
  else if(act==='hint')onHint();
  else if(act==='pause')onPause();
  else if(act==='resume')onResume();
  else if(act==='finishearly')onFinal();
  else if(act==='retake')retake();
  else if(act==='collapse'){var b=document.querySelector(el.getAttribute('data-t'));if(b){b.classList.toggle('collapsed');el.textContent=b.classList.contains('collapsed')?'+ expand':'— collapse';}}
  else if(act==='opt')onOpt(el);
  else if(act==='spot')onSpot(el);
  else if(act==='chip')onChip(el);
  else if(act==='dnd-item')onDndItem(el);
  else if(act==='dnd-slot')onDndSlot(el);
  else if(act==='dnd-clear')onDndClear(el);
  else if(act==='ord-up')onOrdMove(el,-1);
  else if(act==='ord-dn')onOrdMove(el,1);
  else if(act==='tree-opt')onTreeOpt(el);
  else if(act==='tree-back')onTreeBack();
  else if(act==='rv-answer')answerSkipped(parseInt(el.getAttribute('data-i'),10));
  else if(act==='rv-back'){S.view='exam';S.reviewMode=false;renderEx();}
  else if(act==='rv-submit')finishExam(false);
 });
 document.addEventListener('keydown',function(e){
  var t=e.target;
  if(t&&t.id==='tcmd'&&e.key==='Enter'){runTerm(t.value);return;}
  if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'){e.preventDefault();t.click();}
 });
 document.addEventListener('dragstart',function(e){
  var el=e.target.closest('[draggable="true"]');if(!el)return;
  S.drag={kind:el.getAttribute('data-drag'),i:parseInt(el.getAttribute('data-i'),10)};
  try{e.dataTransfer.setData('text/plain',String(S.drag.i));}catch(x){}
 });
 document.addEventListener('dragover',function(e){
  var t=e.target.closest('.slot,.orow');if(!t)return;e.preventDefault();t.classList.add('over');
 });
 document.addEventListener('dragleave',function(e){
  var t=e.target.closest('.slot,.orow');if(t)t.classList.remove('over');
 });
 document.addEventListener('drop',function(e){
  var t=e.target.closest('.slot,.orow');if(!t)return;e.preventDefault();t.classList.remove('over');
  if(!S.drag)return;
  if(t.classList.contains('slot')&&S.drag.kind==='dnd')placeDnd(S.drag.i,parseInt(t.getAttribute('data-s'),10));
  else if(t.classList.contains('orow')&&S.drag.kind==='ord')moveOrdTo(S.drag.i,parseInt(t.getAttribute('data-i'),10));
  S.drag=null;
 });
 window.addEventListener('message',function(ev){
  var d=ev.data;if(!d)return;
  if(d.type!=='CYBERPULSE_INIT'&&d.type!=='CYBERMASTERY_INIT')return;
  S.user=d.username||'';renderWho();
 });
}
document.addEventListener('DOMContentLoaded',function(){
 S.order=EX.map(function(_,i){return i;});
 bind();renderIntro();
});
</script>
