<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1589.003 — HARD practice exam</title>
<script type="application/json" id="cm-exercise-meta">
{

  "batch": 3,

  "difficulty": "hard",

  "passMark": 70
}
</script>
<style>
:root{
  --bg-page:#0b1020; --bg-surface:#121a2e; --bg-surface-2:#0f1729; --border:#243049;
  --text-primary:#e6ecff; --text-secondary:#a9b4d0; --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff; --accent-amber:#ffb454; --accent-green:#57d38c;
  --state-correct:#57d38c; --state-partial:#ffb454; --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0; --state-paused:#9d7bff;
  --sev-easy:#57d38c; --sev-medium:#ffb454; --sev-hard:#ff8a3d; --sev-extreme:#ff6b6b;
  --sev:var(--sev-easy);
  --shadow:0 6px 18px rgba(3,8,20,.45);
  --r:8px;
}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:dark}
html,body{margin:0;padding:0}
body{
  background:var(--bg-page); color:var(--text-primary);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono,.code,pre.code,input.term-in,.log-line,.term-out{
  font-family:ui-monospace,SFMono-Regular,"Cascadia Mono","JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace;
}
.wrap{max-width:980px;margin:0 auto;padding:20px 18px 64px}
h1,h2,h3{line-height:1.25;margin:0 0 10px}
h1{font-size:1.45rem} h2{font-size:1.15rem} h3{font-size:1.02rem}
p{margin:.45em 0}
a{color:var(--accent-blue)}
small,.small{font-size:.86rem;color:var(--text-secondary)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}
::selection{background:#2b3f66}

/* ---------- cards & panels ---------- */
.panel{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px 18px;margin:14px 0}
.panel.tight{padding:12px 14px}
.sub{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:10px 0}
.sub-label{font-size:.78rem;letter-spacing:.06em;color:var(--text-secondary);text-transform:uppercase;
  font-family:ui-monospace,Consolas,monospace;margin:0 0 6px}
.hr{border:none;border-top:1px solid var(--border);margin:14px 0}

/* ---------- intro ---------- */
.intro-head{border-left:4px solid var(--sev);padding-left:16px;margin:6px 0 4px}
.factrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;
  padding:7px 12px;font-size:.88rem;color:var(--text-secondary)}
.fact b{color:var(--text-primary);font-weight:600}
.kw-theme{margin:10px 0}
.kw-theme h3{color:var(--accent-blue);font-size:.95rem}
.kw-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.kw{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:20px;
  padding:4px 12px;font-size:.84rem;color:var(--text-primary)}
.rules{list-style:none;margin:8px 0;padding:0}
.rules li{padding:7px 0 7px 30px;position:relative;border-bottom:1px dashed var(--border);color:var(--text-primary)}
.rules li:last-child{border-bottom:none}
.rules li::before{content:"\25B8";position:absolute;left:8px;color:var(--accent-amber)}

/* ---------- chips / badges ---------- */
.badge{display:inline-flex;align-items:center;gap:7px;border-radius:20px;padding:4px 13px;
  font-size:.82rem;font-weight:700;letter-spacing:.05em;border:1px solid}
.badge .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
.b-easy{color:var(--sev-easy);border-color:var(--sev-easy);background:rgba(87,211,140,.09)}
.b-medium{color:var(--sev-medium);border-color:var(--sev-medium);background:rgba(255,180,84,.09)}
.b-hard{color:var(--sev-hard);border-color:var(--sev-hard);background:rgba(255,138,61,.10)}
.b-extreme{color:var(--sev-extreme);border-color:var(--sev-extreme);background:rgba(255,107,107,.10)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:6px;
  background:var(--bg-surface-2);padding:6px 11px;font-size:.84rem;color:var(--text-primary)}
.chip.ok{color:var(--state-correct);border-color:var(--state-correct)}
.chip.warn{color:var(--state-partial);border-color:var(--state-partial)}
.chip.bad{color:var(--state-incorrect);border-color:var(--state-incorrect)}
.chip.skip{color:var(--state-skipped);border-color:var(--border)}
.chip.pause{color:var(--state-paused);border-color:var(--state-paused)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(11,16,32,.96);border-bottom:1px solid var(--border);
  box-shadow:0 4px 14px rgba(3,8,20,.5)}
.topbar-in{max-width:980px;margin:0 auto;padding:9px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:9px}
.tb-count{font-weight:700;font-size:.92rem;white-space:nowrap}
.tb-user{font-size:.8rem;color:var(--text-secondary);white-space:nowrap}
.tb-spacer{flex:1}
.tb-timer{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;font-weight:700;
  font-size:.95rem;color:var(--text-primary)}
.tb-state{font-size:.74rem;letter-spacing:.03em}
.tb-score{font-family:ui-monospace,Consolas,monospace;font-size:.92rem;color:var(--text-primary)}
.tb-score b{color:var(--accent-green)}
.tb-score .pct{color:var(--text-secondary);font-size:.82rem}

/* ---------- progress ---------- */
.pbar{height:8px;background:var(--bg-surface-2);border-bottom:1px solid var(--border);overflow:hidden}
.pbar-in{height:100%;width:0%;
  background:linear-gradient(90deg,var(--sev),var(--accent-blue));
  transition:width .5s ease;position:relative}
.pbar-in::after{content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(230,236,255,.25) 50%,transparent 70%);
  animation:sheen 2.8s linear infinite}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;
  padding:9px 18px;border-radius:6px;border:1px solid var(--border);background:var(--bg-surface-2);
  color:var(--text-primary);cursor:pointer;font-weight:600;font-size:.92rem;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:#1a2440;border-color:#33507e}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn-primary{background:var(--sev);border-color:var(--sev);color:#08101f}
.btn-primary:hover:not(:disabled){background:var(--sev);filter:brightness(1.12)}
.btn-blue{background:#173154;border-color:var(--accent-blue);color:var(--accent-blue)}
.btn-ghost{background:transparent}
.btn-danger{border-color:var(--state-incorrect);color:var(--state-incorrect)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn-lg{font-size:1.02rem;padding:12px 30px}

/* ---------- exercise blocks ---------- */
.ex-head{display:flex;align-items:center;gap:10px;margin:16px 0 8px;flex-wrap:wrap}
.ex-title{font-size:.95rem;color:var(--text-secondary);font-weight:600}
.blk{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
.blk-h{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:.82rem;font-weight:800;
  letter-spacing:.09em;border-bottom:1px solid var(--border);text-transform:uppercase}
.blk-h .ic{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;
  border-radius:5px;font-size:.85rem;background:rgba(90,169,255,.14);color:var(--accent-blue)}
.blk-h .tag{margin-left:auto;font-weight:600;letter-spacing:.02em;font-size:.72rem;color:var(--text-secondary)}
.blk-scenario{border-left:4px solid var(--accent-blue)}
.blk-scenario .blk-h{color:var(--accent-blue)}
.blk-question{border-left:4px solid var(--accent-amber)}
.blk-question .blk-h{color:var(--accent-amber)}
.blk-question .ic{background:rgba(255,180,84,.14);color:var(--accent-amber)}
.blk-answer{border-left:4px solid var(--accent-green)}
.blk-answer .blk-h{color:var(--accent-green)}
.blk-answer .ic{background:rgba(87,211,140,.14);color:var(--accent-green)}
.blk-b{padding:14px 16px}
.scen-p{margin:.5em 0;color:var(--text-primary)}
.q-text{font-weight:700;font-size:1.02rem;margin:0}

/* collapsible scenario */
.collapse-btn{margin-left:auto;background:none;border:1px solid var(--border);border-radius:5px;
  color:var(--text-secondary);cursor:pointer;padding:3px 10px;font-size:.74rem;min-height:44px}
.collapsed .blk-b{display:none}
.collapsum{display:none;padding:8px 14px;font-size:.82rem;color:var(--text-secondary);border-top:1px solid var(--border)}
.collapsed .collapsum{display:block}

/* artefacts & code */
.artefact{margin:12px 0}
pre.code{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;
  color:var(--text-mono);font-size:.86rem;line-height:1.55;padding:11px 13px;margin:6px 0 0;
  overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.tok-k{color:var(--accent-blue);font-weight:700}
.tok-s{color:var(--accent-amber)}
.tok-n{color:var(--sev-hard)}
.tok-c{color:var(--text-secondary);font-style:italic}
.tok-f{color:var(--state-incorrect)}

/* log viewer */
.logview{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.logview-top{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border)}
.logview input{flex:1;background:var(--bg-page);border:1px solid var(--border);border-radius:5px;
  color:var(--text-primary);padding:8px 10px;font-size:.86rem;min-height:38px}
.log-count{font-size:.74rem;color:var(--text-secondary);font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
.log-lines{max-height:300px;overflow:auto;padding:6px 0}
.log-line{padding:3px 12px;font-size:.82rem;color:var(--text-mono);white-space:pre-wrap;word-break:break-word}
.log-line .ts{color:var(--text-secondary)}
.log-line .src{color:var(--accent-blue);font-weight:700}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:6px;padding:11px 13px;cursor:pointer;min-height:44px;
  color:var(--text-primary);transition:background .12s,border-color .12s}
.opt:hover:not(:disabled){background:#182238}
.opt-k{flex:0 0 auto;font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--text-secondary)}
.opt-t{flex:1}
.opt-sel{border-left:4px solid var(--accent-green);box-shadow:0 0 0 1px var(--accent-green),0 0 12px rgba(87,211,140,.25)}
.opt.sel-tag::after{content:"\25CF selected";margin-left:auto;color:var(--accent-green);font-size:.76rem;font-weight:700;white-space:nowrap}
.opt:disabled{cursor:default;opacity:.85}
.opt-correct{border-left:4px solid var(--state-correct)}
.opt-wrong{border-left:4px solid var(--state-incorrect)}

/* fill-in */
.fill-wrap{line-height:2.3;color:var(--text-primary)}
.fill-in{background:var(--bg-page);border:1px solid var(--border);border-bottom:2px solid var(--accent-green);
  border-radius:5px;color:var(--text-mono);padding:6px 10px;font-size:.9rem;min-height:44px;min-width:120px;margin:0 3px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)}
.bank-l{font-size:.78rem;color:var(--text-secondary);width:100%}
.bk{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:16px;padding:3px 11px;
  font-size:.84rem;color:var(--text-mono);font-family:ui-monospace,Consolas,monospace}

/* match */
.match-row{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.match-row:last-child{border-bottom:none}
.match-l{flex:1 1 240px;font-size:.92rem}
.match-row select{flex:1 1 200px;background:var(--bg-page);border:1px solid var(--border);border-radius:5px;
  color:var(--text-primary);padding:9px 10px;font-size:.88rem;min-height:44px}

/* order */
.ord-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.ord-item{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);
  border-radius:6px;padding:8px 11px}
.ord-pos{flex:0 0 30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:5px;
  background:var(--bg-page);border:1px solid var(--border);font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:.85rem}
.ord-t{flex:1}
.ord-btns{display:flex;gap:5px}
.ord-btns button{width:44px;height:44px;border-radius:5px;border:1px solid var(--border);background:var(--bg-page);
  color:var(--text-primary);cursor:pointer;font-size:1rem}
.ord-btns button:hover:not(:disabled){border-color:var(--accent-blue);color:var(--accent-blue)}

/* drag & drop */
.drag-zone{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:9px;border:1px dashed var(--border);
  border-radius:6px;background:var(--bg-page);margin-top:8px}
.drag-zone.over{border-color:var(--accent-green);box-shadow:inset 0 0 0 1px var(--accent-green)}
.chipd{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;
  font-size:.88rem;cursor:grab;color:var(--text-primary);min-height:44px;display:inline-flex;align-items:center;gap:7px}
.chipd.picked{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green)}
.chipd .pick-mark{color:var(--accent-green);font-weight:700;font-size:.78rem}
.buckets{display:grid;gap:10px;margin-top:12px}
.bucket{border:1px solid var(--border);border-radius:6px;background:var(--bg-surface-2);padding:10px}
.bucket-h{font-size:.84rem;font-weight:700;color:var(--accent-blue);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.bucket .drag-zone{margin-top:0;min-height:64px}
.drag-hintline{font-size:.8rem;color:var(--text-secondary);margin-top:8px}

/* terminal */
.term{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.term-bar{display:flex;gap:6px;align-items:center;padding:7px 11px;border-bottom:1px solid var(--border);background:var(--bg-page)}
.term-dot{width:10px;height:10px;border-radius:50%;background:var(--border)}
.term-dot.r{background:var(--state-incorrect)}.term-dot.y{background:var(--state-partial)}.term-dot.g{background:var(--state-correct)}
.term-name{margin-left:6px;font-size:.76rem;color:var(--text-secondary);font-family:ui-monospace,Consolas,monospace}
.term-out{padding:10px 12px;max-height:220px;overflow:auto;font-size:.84rem;color:var(--text-mono);line-height:1.55}
.term-line{white-space:pre-wrap;word-break:break-word}
.term-line .p{color:var(--accent-green);font-weight:700}
.term-in-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--border)}
.term-pr{color:var(--accent-green);font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:.86rem;white-space:nowrap}
input.term-in{flex:1;background:transparent;border:none;color:var(--text-mono);font-size:.88rem;min-height:44px}
.per-timer{display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,Consolas,monospace;
  font-size:.8rem;color:var(--state-partial);border:1px solid var(--state-partial);border-radius:5px;padding:3px 9px}

/* decision tree */
.step-tag{display:inline-flex;align-items:center;gap:7px;background:rgba(90,169,255,.12);border:1px solid var(--accent-blue);
  color:var(--accent-blue);border-radius:5px;padding:4px 11px;font-size:.78rem;font-weight:700;letter-spacing:.05em;margin-bottom:8px}
.step-outcome{border-left:3px solid var(--accent-blue);background:var(--bg-surface-2);border-radius:4px;
  padding:8px 12px;margin:8px 0;font-size:.88rem;color:var(--text-primary)}
.step-outcome.ok{border-left-color:var(--state-correct)}
.step-outcome.bad{border-left-color:var(--state-incorrect)}
.done-steps{margin-bottom:6px}

/* feedback */
.fb{border:1px solid var(--border);border-radius:var(--r);margin:12px 0;overflow:hidden;background:var(--bg-surface);
  box-shadow:var(--shadow)}
.fb-h{display:flex;align-items:center;gap:10px;padding:11px 15px;font-weight:800;letter-spacing:.05em;font-size:.95rem;
  border-bottom:1px solid var(--border)}
.fb-h.ok{color:var(--state-correct);background:rgba(87,211,140,.08)}
.fb-h.part{color:var(--state-partial);background:rgba(255,180,84,.08)}
.fb-h.bad{color:var(--state-incorrect);background:rgba(255,107,107,.08)}
.fb-credit{font-family:ui-monospace,Consolas,monospace;font-size:.88rem;margin-left:auto;white-space:nowrap}
.fb-b{padding:13px 16px}
.fb-correct{background:var(--bg-surface-2);border:1px solid var(--border);border-left:3px solid var(--state-correct);
  border-radius:5px;padding:9px 12px;margin:8px 0;font-size:.9rem}
.fb-correct .mono{color:var(--text-mono)}
.items{margin:10px 0;display:flex;flex-direction:column;gap:6px}
.item-row{display:flex;gap:9px;align-items:flex-start;font-size:.88rem;padding:6px 9px;border-radius:5px;
  background:var(--bg-surface-2);border:1px solid var(--border)}
.item-ic{flex:0 0 auto;font-weight:700}
.item-row.ok .item-ic{color:var(--state-correct)}
.item-row.bad .item-ic{color:var(--state-incorrect)}
.item-row.miss .item-ic{color:var(--state-skipped)}
.fb-exp{color:var(--text-primary);font-size:.92rem;margin-top:8px}
.fb-study{color:var(--accent-amber);font-size:.88rem;margin-top:8px;border-left:3px solid var(--accent-amber);padding-left:10px}
.fb-persp{display:grid;gap:8px;margin-top:10px}
.persp{border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:.88rem;background:var(--bg-surface-2)}
.persp b{color:var(--accent-blue)}
.persp.d b{color:var(--accent-green)}
.fb-note{font-size:.8rem;color:var(--text-secondary);margin-top:9px}

/* review & results */
.rv-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.rv-row:last-child{border-bottom:none}
.rv-t{flex:1;min-width:200px}
.res-sum{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0}
.res-big{font-family:ui-monospace,Consolas,monospace;font-size:2rem;font-weight:800}
.res-pct{font-size:1.2rem;font-weight:700;color:var(--text-secondary)}
.verdict{border-radius:var(--r);border:1px solid;padding:16px 18px;margin:14px 0;font-size:1.05rem;font-weight:700}
.verdict.ok{color:var(--state-correct);border-color:var(--state-correct);background:rgba(87,211,140,.07)}
.verdict.bad{color:var(--state-incorrect);border-color:var(--state-incorrect);background:rgba(255,107,107,.07)}
.res-break{display:grid;gap:8px;margin:12px 0}
.res-row{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);
  border-radius:6px;padding:9px 13px;font-size:.92rem}
.res-row b{margin-left:auto;font-family:ui-monospace,Consolas,monospace}
.pause-stats{font-size:.86rem;color:var(--text-secondary);margin-top:10px;display:grid;gap:4px}

/* overlay for manual pause */
.overlay{position:fixed;inset:0;background:rgba(5,8,18,.9);backdrop-filter:blur(5px);z-index:90;
  display:flex;align-items:center;justify-content:center;padding:20px}
.overlay-card{max-width:440px;width:100%;text-align:center;background:var(--bg-surface);border:1px solid var(--state-paused);
  border-radius:10px;padding:30px 26px;box-shadow:0 0 40px rgba(157,123,255,.25)}
.overlay-card .big{font-size:2.2rem;color:var(--state-paused);margin-bottom:8px}
.hidden{display:none!important}

/* misc */
.notice{border:1px solid var(--border);border-left:4px solid var(--accent-amber);background:var(--bg-surface-2);
  border-radius:5px;padding:9px 12px;font-size:.86rem;margin:10px 0;color:var(--text-primary)}
.tiny-note{font-size:.78rem;color:var(--text-secondary)}

@media (max-width:640px){
  .wrap{padding:14px 10px 50px}
  .blk-b{padding:12px}
  .topbar-in{padding:8px 10px;gap:6px}
  .tb-state{display:none}
  .buckets{grid-template-columns:1fr!important}
}

<script>
window.__EXAM__ = {"meta":{"topicId":"t1589.003","batch":3,"title":"T1589.003 Employee Names — HARD","difficulty":"hard","sevWord":"HARD","objId":"T1589.003","objName":"Employee Names","questionCount":16,"estimatedMinutes":55,"timerSeconds":3300,"passMark":70,"pageTitle":"T1589.003 — HARD practice exam"},"intro":{"h1":"T1589.003 — HARD practice exam","objType":"Sub-technique of T1589 — an ATT&CK 'how they do it' entry inside the Reconnaissance tactic","learnTitle":"What you will learn here","learn":["This is the HARD tier for <b>T1589.003 — Employee Names<\/b> (sub-technique of <b>T1589 Gather Victim Identity Information<\/b>, tactic <b>Reconnaissance<\/b>, platform <b>PRE<\/b>). You already know what the object is. Here you must <b>discriminate<\/b>: near-identical behaviours that map to different techniques, benign traffic that looks alarming, alarming evidence that looks benign, and the discipline of claiming only what artefacts prove.","The pages' key texts are your grounding. The <b>description<\/b>: names are gathered to derive email addresses, guide other reconnaissance and craft believable lures — exposed via <b>Social Media (T1593.001)<\/b> and <b>Search Victim-Owned Websites (T1594)<\/b>, and feeding <b>Phishing for Information (T1598)<\/b>, <b>Compromise Accounts (T1586)<\/b>, <b>Phishing (T1566)<\/b> and <b>Valid Accounts (T1078)<\/b>. The <b>detection analytic AN1989<\/b>: very high occurrence, very high false-positive rate, mostly outside victim visibility — so aim detection at related stages such as <b>Initial Access<\/b>. The <b>mitigation M1056<\/b>: minimise the amount and sensitivity of staff data available to external parties.","Real actors anchor the scenarios. The ATT&amp;CK page documents <b>Kimsuky (G0094)<\/b> collecting victim employee name information (its reference is KISA's Operation Muzabi analysis), <b>Sandworm Team (G0034)<\/b> researching victim organisations including employee information (US v. Andrienko indictment), and <b>Silent Librarian (G0122)<\/b> collecting lists of names from targeted organisations (US v. Rafatnejad). You will practise attribution with the uncertainty a senior analyst must keep.","Expect multi-artefact cases (logs, tickets, ATT&amp;CK excerpts) where two answers are always defensible somewhere but only one is correct here. One exercise is a <b>hunt-query console<\/b>: you will type a real query shape, element by element. Wrong 'obvious' answers are common in this tier by design — justify everything."],"themes":[{"name":"Discrimination & near-misses","items":["scraper vs declared crawler vs vuln scanner","T1566 Phishing vs T1598 Phishing for Information","channel (T1593.001/T1594) vs goal (T1589.003)","T1586 Compromise Accounts vs T1583 acquisition"]},{"name":"Evidence discipline","items":["over-claiming from one artefact","correlation is not causation","attempted vs confirmed Initial Access","attribution needs more than TTP overlap"]},{"name":"Attribution & procedure examples","items":["Kimsuky (G0094) — KISA Operation Muzabi","Sandworm Team (G0034) — US v. Andrienko","Silent Librarian (G0122) — US v. Rafatnejad","targeting pattern as a discriminator"]},{"name":"Detection engineering","items":["AN1989 false-positive profile","act vs tune-out decisions","greeting-pattern analytics","query elements and normalisation"]},{"name":"Response under constraints","items":["least-aggressive correct action","preserve before purge","legal publishing constraints on minimisation","scope, block, brief"]},{"name":"Query craft","items":["EmailEvents-style hunt query","table, window, filters, projection","read-only vs state-changing commands"]}],"how":["You need <b>70%<\/b> to pass. Score counts only exercises answered with Check; skipped-and-never-answered exercises are excluded from points and total.","This file has <b>16 exercises<\/b>: multi-select, drag-and-drop, matching, ordering, fill-in-the-blank, a log panel with filter, branching decisions, single-choice questions, and <b>one hunt-query console<\/b> where you type a query (graded per element, partial credit).","Scenarios are dense and multi-artefact. Near-miss options are <b>defensible elsewhere but wrong here<\/b> — always justify. In roughly a third of the exercises the obvious answer is wrong on purpose.","The timer starts at <b>55:00<\/b>. <b>Check<\/b> stops the timer for unlimited feedback study; <b>Next<\/b> restarts it. <b>Pause<\/b> hides the exercise for a manual break. One <b>hint<\/b> per exercise costs 10% of that exercise's credit.","<b>Skip<\/b> files an exercise into the review pool; return to skipped exercises any time before the timer ends. Unanswered skipped exercises are excluded from the score."]},"exercises":[{"id":"H01","title":"Two artefacts, one story?","type":"multi","summary":"Select only the conclusions the evidence supports","scen":[{"label":"CONTEXT","kind":"prose","body":"Tuesday, 07:55. The SOC opens two unrelated-looking tickets. Ticket A: web-team reports bursts of requests against /about/team on the careers site. Ticket B: an employee reports a paste-site post listing 40 staff emails. The shift lead wants your defensible read before any executive summary is written."},{"label":"ARTEFACT 1 — careers-site access log (excerpt)","kind":"code","body":"02:11:04  GET /about/team  200  \"python-requests/2.31\"\n02:11:05  GET /about/team  200  \"python-requests/2.31\"\n02:11:06  GET /about/team  200  \"python-requests/2.31\"  ref=/about/team\n02:11:07  GET /about/team  200  \"python-requests/2.31\""},{"label":"ARTEFACT 2 — paste-site post (defanged excerpt)","kind":"code","body":"meridian staff list (40):\n  j.hartley@meridian-logistics[.]example\n  p.okafor@meridian-logistics[.]example\n  ... (38 more)"}],"q":"Select every conclusion that the evidence actually supports.","opts":[{"t":"The paste dump supports T1589.002 — collected email addresses","correct":true,"why":"The dump is address data without names — the exact scope of T1589.002."},{"t":"The scraper supports T1589.003 with T1594 as the source","correct":true,"why":"Scripted bulk reads of the victim's own team pages are name collection from a victim-owned website."},{"t":"The scraper alone justifies an M1056 exposure review of the staff pages","correct":true,"why":"M1056 work is triggered by exactly this discovery: staff data is leaving to external parties."},{"t":"Together the artefacts prove an active T1566 phishing campaign","correct":false,"why":"No phishing message exists in the evidence — preparation is not delivery."},{"t":"The dump proves the scraper exfiltrated the data it read","correct":false,"why":"Correlation is not causation; the addresses could have leaked from anywhere."},{"t":"Blocking the scraper's IP would have prevented the paste dump","correct":false,"why":"One blocked IP does not govern data already public, nor collection on third-party platforms."}],"explain":"Each artefact carries its own tag: scripted reads of the victim's team pages are employee-name collection via a victim-owned website, and the dump is address data. The exposure review follows directly from M1056. What the evidence does not show is the bridge between them — no phish, no proven pipeline from scraper to dump. Senior judgement here is refusing the satisfying story the two tickets seem to tell together.","persp":{"a":"From the red side, this pair of artefacts is exactly the noise an operation likes: the victim sees scraping but cannot tie it to the later use of the data.","d":"From the blue side, each artefact gets its own tag and its own action — an exposure fix for the pages, monitoring for the addresses resurfacing in mail — and no invented link."},"study":"Practise tagging each artefact separately before writing any combined conclusion.","hint":"Ticket B is not names at all — check which sub-technique covers addresses without names, and look for any artefact that proves the bridge."},{"id":"H02","title":"From click to containment","type":"decision","summary":"Four-step IR call on a personalised lure that worked","scen":[{"label":"CONTEXT","kind":"prose","body":"10:20, IR bridge. Three finance staff clicked a lure that greeted each by name and quoted the exact title each held — titles that were only published on the careers page and in a March press release. Two of the three entered credentials on a lookalike portal. The CISO wants a containment decision on the call."},{"label":"ARTEFACT 1 — lure reconstruction","kind":"code","body":"To: m.reyes@meridian-logistics[.]example (Payroll Manager)\n     j.hartley@meridian-logistics[.]example (AP Lead)\n     s.farid@meridian-logistics[.]example (AP Clerk)\nBody: \"Hi Marta — as Payroll Manager you'll recognise\n      this vendor invoice...\"\nLink: hxxps://meridian-vendor-portal[.]example/login"},{"label":"ARTEFACT 2 — public source check","kind":"code","body":"careers page: lists name + role for all staff\npress release (March): quotes M. Reyes, Payroll Manager\nnames in lure match both sources"}],"q":"Make all four calls in order.","steps":[{"q":"Step 1 — What does the evidence establish about the adversary's preparation?","opts":[{"t":"Employee-name recon from the careers page and press release (T1589.003), then address derivation and lure crafting","correct":true,"outcome":"Right: names, roles and address patterns all trace to the two public sources."},{"t":"A database breach of the HR system","correct":false,"outcome":"No HR-side artefact exists; the public sources explain every personalised field."},{"t":"An insider supplying the recipient list","correct":false,"outcome":"The insider adds nothing the public pages do not — the simpler explanation stands."},{"t":"A purchased marketing list with no recon","correct":false,"outcome":"Marketing lists do not carry same-week role changes and press-release phrasing."}]},{"q":"Step 2 — Two users entered credentials. What proves whether Initial Access actually succeeded (T1078 use), rather than just being attempted?","opts":[{"t":"Portal and identity logs showing a successful authentication with the submitted credentials","correct":true,"outcome":"Correct: T1078 is about USE of valid accounts — only an auth event proves use."},{"t":"The lure's link resolving correctly","correct":false,"outcome":"A live page proves hosting, not a login."},{"t":"The users admitting they typed the password","correct":false,"outcome":"Helpful context, but system evidence decides — memory is not telemetry."},{"t":"The domain being newly registered","correct":false,"outcome":"That supports staging; it says nothing about whether credentials were used."}]},{"q":"Step 3 — Choose the containment that is proportionate and evidence-safe.","opts":[{"t":"Reset the three targeted users' passwords and revoke their active sessions","correct":true,"outcome":"Right: covers the exposed credentials, preserves evidence, keeps the business running."},{"t":"Force a password reset for all 40 staff named on the careers page","correct":false,"outcome":"Over-broad: 37 of them received nothing; the blast radius is political, not technical."},{"t":"Purge the three mailboxes and rebuild the mailboxes fresh","correct":false,"outcome":"Destructive before scoping — you would lose the messages needed for the report."},{"t":"Take no action until the portal owner confirms compromise","correct":false,"outcome":"Waiting surrenders the containment window while credentials may already be replayed."}]},{"q":"Step 4 — Which follow-up closes the loop on the recon stage of this case?","opts":[{"t":"File an M1056 action item: trim named roles from public pages and monitor the addresses in mail","correct":true,"outcome":"Right: the source of the personalisation gets fixed, and the addresses get watched."},{"t":"Close the case once passwords are reset","correct":false,"outcome":"The exposure that built the lure remains untouched — the next wave writes itself."},{"t":"Demand the careers site be taken offline permanently","correct":false,"outcome":"Disproportionate; minimisation, not elimination, is what M1056 prescribes."},{"t":"Add the three users to a watchlist only","correct":false,"outcome":"Watching users treats symptom people, not the public data that selected them."}]}],"explain":"The chain is the exam in miniature: public names built the lure (T1589.003), the lure delivered Initial Access (T1566), and only authentication logs can convert a click into confirmed account use (T1078). Containment follows the least-aggressive effective rule — reset exactly the exposed credentials. The follow-up returns to the start of the chain: the public pages that enabled personalisation are the M1056 work item, and the case is not closed until the source is reduced and the addresses watched.","study":"Rehearse the four calls: preparation, confirmation, proportionate containment, source-side follow-up.","hint":"Step 2 needs an event, not an artefact. Step 3: match the action's blast radius to the exposure's blast radius."},{"id":"H03","title":"Channel, trick, or goal?","type":"drag","summary":"Sort six actions across three ATT&CK techniques","scen":[{"label":"CONTEXT","kind":"prose","body":"A case file lists six adversary actions in one operation against Meridian Logistics. Your team keeps mis-tagging them because the operation mixes collection channels, social tricks and the collected goal. The three tags available: T1589.003 (the collected names), T1598 (phishing used to obtain information), T1586 (compromise of accounts)."}],"q":"Drag each action to the technique it belongs to.","buckets":[{"id":"names","t":"T1589.003 — Employee Names (the goal)"},{"id":"ask","t":"T1598 — Phishing for Information (the trick)"},{"id":"acct","t":"T1586 — Compromise Accounts (the resource)"}],"chips":[{"id":"c1","t":"Bulk-download of the public staff page","b":"names","why":"Collecting the names themselves is the goal — T1589.003."},{"id":"c2","t":"Screenshot of a conference speaker list naming your staff","b":"names","why":"Names harvested from an open list — again the goal, from a different channel."},{"id":"c3","t":"Using the collected names to pick which two employees to impersonate","b":"names","why":"The description says names guide further targeting — still within T1589.003's use."},{"id":"c4","t":"Fake-recruiter chat on LinkedIn asking HR for the team structure","b":"ask","why":"The platform is social media, but the action is a deception to obtain information — T1598."},{"id":"c5","t":"Email to helpdesk asking how many admin seats the M365 licence includes","b":"ask","why":"Asking under pretext for organisational facts is phishing for information — T1598."},{"id":"c6","t":"Taking over a departed employee's unused SaaS account to read the internal directory","b":"acct","why":"An account was compromised and used as a resource — T1586."}],"explain":"The discrimination rule: ask what each sentence is fundamentally about. Sentences about holding or using names map to T1589.003 even when the channel differs. Sentences about a deceptive request map to T1598 even when the platform is LinkedIn. The account takeover is not collection at all — it is establishing a resource, T1586. Note the LinkedIn card: the channel (T1593.001) would also be true, but the tag that changes your response is the trick, T1598.","study":"When two tags both fit, tag the one that changes what the defender would do next.","hint":"One bucket is about deception to extract answers, one about an owned account, one about the people-data itself."},{"id":"H04","title":"The board's one-liner","type":"qcm","summary":"Answer the 'just block the IP' demand","scen":[{"label":"CONTEXT","kind":"prose","body":"The board read ticket A (the scraper) and demands closure: 'Block the IP, case closed, T1589.003 mitigated.' You have AN1989 and the log excerpt on your screen. You must answer in one technically defensible sentence."},{"label":"ARTEFACT 1 — AN1989 (excerpt)","kind":"code","body":"\"...very high occurrence and associated false positive rate,\nas well as potentially taking place outside the visibility of\nthe target organization, making detection difficult...\""}],"q":"Which response to the board is technically correct?","opts":[{"t":"Blocking one visible symptom does not cover the same data on third-party platforms, where no block exists","correct":true,"why":"The public pages and social profiles remain readable regardless of one IP — the technique is un-blockable at the edge."},{"t":"Block the IP and record T1589.003 as mitigated","correct":false,"why":"The obvious board-favourite — and wrong: M1056 explicitly says preventive controls cannot cover this behaviour."},{"t":"Do nothing at all; nothing can be done","correct":false,"why":"Defeatist and wrong — M1056 minimisation work and Initial Access monitoring both remain."},{"t":"Block the whole /24 and all cloud-hosted traffic to be safe","correct":false,"why":"Indiscriminate blocking breaks crawlers, partners and staff while the data stays public."}],"explain":"The obvious answer — block and close — is wrong for a structural reason: the behaviour happens on machines the defender does not own, and the same staff data sits on platforms that will never route through your firewall. The correct answer reframes the ask: edge controls address one symptom; the technique-level response is minimisation (M1056) plus watching the stage where consequences appear. Saying this to a board is a skill worth rehearsing.","study":"Prepare your own one-liner that moves a stakeholder from 'block it' to 'minimise it'.","hint":"Ask where the reader of the page is sitting — inside a network you can block, or anywhere on the internet?"},{"id":"H05","title":"Reconstruct the operation","type":"order","summary":"Order five stages including a return to recon","scen":[{"label":"CONTEXT","kind":"prose","body":"Forensic reconstruction of an operation against a mid-size firm produced five stage cards. Two cards are pure reconnaissance, one is resource setup, one is delivery, one is use. The reconstruction is wrong in the folder's order — rebuild it. ATT&CK's chaining logic (T1589.003 into T1598, T1583, T1566, T1078) is your guide."}],"q":"Order the five stages from earliest to latest.","items":["Collect staff names from public pages (T1589.003)","Verify decision-maker roles via a fake-recruiter approach to HR (T1598)","Register lookalike portal infrastructure (T1583)","Send the personalised lure to the verified targets (T1566)","Use the harvested credentials to log in (T1078)"],"why":["Names first — no other stage has anything to work with before them.","The fake-recruiter approach sharpens the name data into verified targets before money is spent.","Infrastructure is staged once targets are chosen — building a portal before knowing whom to phish wastes the setup.","Delivery follows staging; the lure needs both targets and a portal.","Credential use is the payoff and must come last."],"explain":"The order shows why recon discipline matters to attackers: names are free, verification is cheap, and staging is where an operation becomes visible and costly. A shortcut — registering the portal first, phishing broadly — is exactly what lower-sophistication spam looks like. The verified-target step (T1598) is the pivot that turns a name list into a chosen victim set, and it happens before a single artefact touches your estate.","persp":{"a":"For the operator, each stage de-risks the next: verification prevents wasted infrastructure, and the personalised lure converts recon into access.","d":"For the defender, every stage before delivery is invisible — which is why the delivery moment is where detection is aimed, and why the earlier stages get attacked through exposure reduction instead."},"study":"Practise reconstructing operations backwards from the point of first visibility.","hint":"One stage costs money and creates artefacts; it goes after the target set is fixed, not before."},{"id":"H06","title":"Who did what, and where it is written","type":"match","summary":"Match actors and techniques to their documented evidence","scen":[{"label":"CONTEXT","kind":"prose","body":"You are preparing a CTI briefing and must attach the right evidence to every claim. The T1589.003 page gives three actor rows and two source techniques. Pair each claim with the evidence that documents it — and note where each actor's reference comes from."},{"label":"ARTEFACT 1 — ATT&CK rows and references","kind":"code","body":"G0094 Kimsuky          has collected victim employee\n                         name information        [KISA 2021]\nG0034 Sandworm Team    victim-org research included\n                         employee information    [US v. Andrienko 2020]\nG0122 Silent Librarian has collected lists of names\n                         from targeted orgs      [US v. Rafatnajad 2018]\nT1593.001 Social Media      — name source\nT1594     Victim-Owned Web  — name source"}],"q":"Match each item to its documented evidence or role.","left":["Kimsuky (G0094)","Sandworm Team (G0034)","Silent Librarian (G0122)","T1593.001 — Social Media","T1594 — Search Victim-Owned Websites"],"right":["collected victim employee name information — documented via KISA's Operation Muzabi analysis","victim-organisation research included identification and collection of employee information — documented via the US v. Andrienko indictment","collected lists of names for individuals from targeted organisations — documented via the US v. Rafatnajad indictment","a channel where staff names sit exposed for collection","the technique for reading the victim's own sites, where staff pages expose names"],"correct":[0,1,2,3,4],"why":["Kimsuky's row carries the KISA Operation Muzabi reference.","Sandworm's row frames employee information inside broader victim research, per the indictment.","Silent Librarian's row describes bulk name lists, per the DOJ reference.","T1593.001 is the social-media channel for name exposure.","T1594 is the victim-owned-website channel — the careers-page source."],"explain":"A briefing that pairs claims with evidence survives scrutiny. The three actor rows differ in scope — Kimsuky's is plain collection, Sandworm's folds names into victim research, Silent Librarian's is bulk lists — and each rests on a different public source: a national CERT analysis or an indictment. The two technique rows are not actors at all; they are the channels the names come from, and they anchor the defensive conversation about where to reduce exposure.","study":"Never present an actor row without its reference — the reference is what makes the claim checkable.","hint":"Two of the five items are channels, not actors; send them to the descriptions that talk about places, not people."},{"id":"H07","title":"Write the hunt query","type":"terminal","summary":"Type the personalised-greeting hunt query","scen":[{"label":"CONTEXT","kind":"prose","body":"You are the detection engineer on the hunt for personalised lures — the Initial Access footprint of employee-name recon. The hunt console accepts one query per submission. Your analytic: mails whose body greets the recipient ('Hi ') and references a senior job title, arriving from external senders, projected to the fields the triage queue needs. Build it from the schema card — the console normalises case and spacing, and it does not tolerate wrong fields."},{"label":"ARTEFACT 1 — schema card","kind":"code","body":"table:   EmailEvents\nfields:  Timestamp, RecipientEmailAddress, SenderFromDomain,\n         Subject, BodyText\nwindow:  last 7 days   (use ago(7d))\nfilters: BodyText contains \"Hi \"\n         BodyText contains \"Director\"  (or \"Payroll\")\noutput:  project Timestamp, RecipientEmailAddress, SenderFromDomain"}],"q":"Type the complete hunt query, then press Check.","terminal":true,"termName":"DE-hunt-console","prompt":"DE-ops>>","placeholder":"EmailEvents | ...","motd":["Meridian SOC — hunt console (read-only)","schema: EmailEvents(Timestamp, RecipientEmailAddress, SenderFromDomain, Subject, BodyText)","tip: the console grades elements — table, window, greeting filter, title filter, projection"],"runOutput":"query parsed OK — plan: scan EmailEvents (7d) -> filter -> project\nest. rows: 214 matches on yesterday's replay","elements":[{"label":"uses the EmailEvents table","any":["emailevents"],"why":"The mail telemetry table is EmailEvents."},{"label":"applies the 7-day window (ago(7d))","any":["ago\\s*7d","ago"],"why":"AN1989-style hunts need a bounded window; ago(7d) is the schema's stated form."},{"label":"greeting filter on the body ('Hi ')","any":["bodytext contains hi","bodytext has hi","contains.*\\bhi\\b.*bodytext","bodytext.*contains.*hi"],"why":"The personalised-greeting pattern is 'Hi ' in the body."},{"label":"senior-title filter (Director or Payroll)","any":["director","payroll"],"why":"A title keyword separates personalisation from generic 'Hi' spam."},{"label":"projects the triage fields (Timestamp, RecipientEmailAddress, SenderFromDomain)","any":["project[^|]*recipientemailaddress"],"why":"The queue needs when, who, and from where — the schema's required projection."}],"forbidden":[{"re":"\\b(delete|purge|drop|update|remove)\\b|\\bset\\b ","label":"a state-changing operation in a read-only hunt console","why":"Hunt consoles are read-only; a mutating clause would be refused — and on a live system it would destroy evidence."}],"canonical":"EmailEvents\n| where Timestamp > ago(7d)\n    and BodyText contains \"Hi \"\n    and (BodyText contains \"Director\" or BodyText contains \"Payroll\")\n| project Timestamp, RecipientEmailAddress, SenderFromDomain","canonicalNote":"Five elements graded: table, window, greeting filter, title filter, projection.","explain":"The query is the AN1989 guidance turned into practice: instead of alerting on invisible collection, hunt the personalised footprint at Initial Access. Each element matters — the table scopes the data, the window bounds cost, the greeting plus title pair separates personalisation from bulk mail, and the projection gives the triage queue what it needs. A state-changing clause would be refused here and is evidence-destroying anywhere, which is why the console flags it.","study":"Rehearse the five-element skeleton for any greeting-pattern analytic: table, window, greeting, discriminator, projection.","hint":"Work down the schema card in order: table, window, then the two body filters, then the output list."},{"id":"H08","title":"Escalate or tune out","type":"drag","summary":"Apply the AN1989 false-positive profile to five alerts","scen":[{"label":"CONTEXT","kind":"prose","body":"Your greeting-pattern analytic (from the console exercise) fired five matches overnight. AN1989 warned about a very high false-positive rate — but some matches are real. The morning call needs each match sorted: escalate to the phishing queue, or tune out with documentation."},{"label":"ARTEFACT 1 — analytic matches (overnight)","kind":"code","body":"G-1  to 12 finance staff; body greets each by first name;\n     sender domain registered 36 hours ago\nG-2  to 800 recipients; body: \"Hi everyone, our newsletter...\"\nG-3  to 40 staff; body greets each by first name; sender is the\n     internal HR survey system (expected weekly digest)\nG-4  slow scraper: 2 requests/min on /about/team, rotating IPs\nG-5  to the CFO; body greets her by name and quotes her keynote\n     title; sender domain 3 years old, DKIM pass, known vendor"}],"q":"Sort the five matches.","buckets":[{"id":"act","t":"Escalate — matches the threat pattern"},{"id":"tune","t":"Tune out — document and suppress"}],"chips":[{"id":"c1","t":"G-1 named finance wave, 36-hour-old domain","b":"act","why":"Personalisation plus fresh infrastructure is the classic named-lure signature."},{"id":"c2","t":"G-2 'Hi everyone' newsletter to 800","b":"tune","why":"Bulk greeting with no names — exactly the noise AN1989 predicts."},{"id":"c3","t":"G-3 internal HR digest greeting each by name","b":"tune","why":"Expected internal sender with a known schedule — a false positive by design, not a threat."},{"id":"c4","t":"G-4 slow, rotating-IP scraper on /about/team","b":"tune","why":"Real recon, but per AN1989 it is high-noise and outside reliable control — route to the exposure review, not the phishing queue."},{"id":"c5","t":"G-5 CFO greeted by name from an established, DKIM-passing vendor","b":"tune","why":"Alarming-looking (named greeting, external), but sender history, DKIM and a known relationship make it benign."}],"explain":"The discriminator is never the greeting alone — it is greeting plus sender context plus infrastructure age. G-1 pairs personalisation with a fresh domain: escalate. G-3 is the trap twin: the same greeting from an expected internal system is a false positive to document. G-5 looks targeted but carries the strongest benign signals available — an aged domain, a passing DKIM signature, a known relationship. G-4 is genuinely recon, yet the AN1989 profile says it belongs in the exposure-review lane, not the phishing queue.","study":"Write your own two-line rule: what makes a named greeting escalate, and what makes it suppressible.","hint":"Two cards carry the same greeting as the real threat — what differs is who sent it and how old their infrastructure is."},{"id":"H09","title":"Review the draft report","type":"drag","summary":"Sort four draft sentences into accurate and inaccurate","scen":[{"label":"CONTEXT","kind":"prose","body":"An IR draft lands in your review queue before it goes to the CISO. Four sentences summarise the employee-name recon findings. Your review standard: every sentence must survive a check against the ATT&CK page for T1589.003 — its mitigation, its detection note, and its procedure examples."},{"label":"ARTEFACT 1 — the four draft sentences","kind":"code","body":"S1  \"T1589.003 was mitigated once we enabled MFA.\"\nS2  \"The lure's correct name and title greeting is consistent\n     with employee-name reconnaissance.\"\nS3  \"We attribute this to Sandworm Team based on the greeting.\"\nS4  \"AN1989 recommends focusing detection on Initial Access.\""}],"q":"Sort the four sentences.","buckets":[{"id":"ok","t":"Accurate — survives the check"},{"id":"bad","t":"Inaccurate — must be rewritten"}],"chips":[{"id":"c1","t":"S1 — MFA mitigated T1589.003","b":"bad","why":"MFA acts at login; the collection is pre-compromise and outside the estate — M1056 says preventive controls do not cover it."},{"id":"c2","t":"S2 — greeting consistent with employee-name recon","b":"ok","why":"Correct greeting plus derived address is exactly the documented use of collected names."},{"id":"c3","t":"S3 — attribution to Sandworm from the greeting","b":"bad","why":"Name collection is documented for Kimsuky, Sandworm Team and Silent Librarian alike — a greeting attributes nothing."},{"id":"c4","t":"S4 — AN1989 points detection at Initial Access","b":"ok","why":"That is the analytic's literal recommendation."}],"explain":"Two sentences fail for classic reasons: S1 confuses a control for the next stage with a control for the technique itself, and S3 commits the attribution fallacy — a behaviour documented for three separate actors identifies none of them. S2 and S4 hold because they restate what the page actually claims. A report with even one S1 or S3 invites the CISO to distrust the rest, which is why the review gate exists.","study":"Check every draft sentence against one of the three anchors: M1056, AN1989, or the procedure table.","hint":"One sentence grants prevention where the page grants none; another grants attribution where the page grants three candidates."},{"id":"H10","title":"Finish the briefing text","type":"fill","summary":"Four blanks: two channels, one stage, one mitigation","scen":[{"label":"CONTEXT","kind":"prose","body":"Your half-written briefing must be finished before the 16:00 review. The style guide demands the exact ATT&CK ID for every behaviour and the exact mitigation ID for the response. Fill all four blanks."},{"label":"ARTEFACT 1 — timeline (condensed)","kind":"code","body":"d1  bulk reads of the victim's own staff pages\n d2  pretext email to HR asking for the org chart\n d9  personalised lures to verified targets\nd14  exposure work agreed with web and comms teams"}],"q":"Complete the briefing with the four correct IDs.","text":"The actor collected names from the victim's own website ({0}), obtained the org chart by pretext ({1}), and delivered lures as {2}. Our exposure response implements mitigation {3}.","blanks":[{"accept":["t1594"],"why":"The victim's own website is T1594, Search Victim-Owned Websites."},{"accept":["t1598"],"why":"A pretext request for information is T1598, Phishing for Information."},{"accept":["t1566","initial access t1566","phishing t1566"],"why":"Delivery of the lure is T1566, the Initial Access technique."},{"accept":["m1056"],"why":"Minimising external staff data is M1056, Pre-compromise."}],"bank":["T1594","T1598","T1566","M1056","T1589.003","T1059"],"explain":"Each blank is a different ATT&CK object type: two channel techniques (T1594 for the victim's site, T1598 for the pretext), one initial-access technique (T1566), and one mitigation (M1056). The bank's traps are the family name (T1589.003 — the collected goal, not the channels) and an unrelated technique (T1059). Briefings that keep object types straight are the ones that survive review.","study":"Practise the object-type check: technique, sub-technique, mitigation, tactic — each has its own ID space.","hint":"Blank 2 is a trick, not a haul; blank 4 is the only M-number in the bank."},{"id":"H11","title":"Attribution call","type":"qcm","summary":"Which documented actor fits this targeting pattern","scen":[{"label":"CONTEXT","kind":"prose","body":"A campaign against university libraries ran for months: lists of staff names were collected from faculty pages and department sites, then carefully written spear-phishes followed, each greeting the recipient by name and department. Your director asks which documented actor profile fits — and wants the reasoning, not a hunch."},{"label":"ARTEFACT 1 — ATT&CK procedure rows (T1589.003)","kind":"code","body":"G0094 Kimsuky          collected victim employee name\n                         information\nG0034 Sandworm Team    victim-org research included\n                         employee information\nG0122 Silent Librarian collected lists of names for\n                         individuals from targeted\n                         organizations"}],"q":"Which attribution call is best supported?","opts":[{"t":"Silent Librarian — bulk name lists from targeted organisations matches the university-focused pattern","correct":true,"why":"The targeting pattern (universities, bulk staff lists, patient spear-phishing) aligns with Silent Librarian's documented row and its public indictment context."},{"t":"Kimsuky — it is the best-known name-collecting actor","correct":false,"why":"Fame is not evidence; Kimsuky's documented activity is plain name collection without the university bulk-list pattern."},{"t":"Sandworm Team — it also researched victim organisations","correct":false,"why":"Defensible in the abstract, but Sandworm's row frames employee data inside broad victim-org research, not sustained university campaigns."},{"t":"No attribution is possible from these facts","correct":false,"why":"Tempting in general — names alone would indeed prove nothing — but the targeting pattern plus the bulk-list method is exactly the documented discriminator here."}],"explain":"Attribution with real uncertainty: the name-collection behaviour alone is shared by three actors, so the discriminator must be the targeting pattern and method — universities, bulk lists, patient spear-phishing — which matches Silent Librarian's documented row. The 'no attribution' option is the right instinct in most cases and wrong in this one, because the pattern is the evidence. The best answer also keeps its confidence calibrated: 'consistent with', not 'is'.","study":"Practise naming the discriminator out loud before you commit to any actor.","hint":"Ask which actor's row mentions lists and targeted organisations — then let the targeting pattern, not fame, decide."},{"id":"H12","title":"What does the evidence prove?","type":"drag","summary":"Six tags: supported by evidence, or over-claim","scen":[{"label":"CONTEXT","kind":"prose","body":"Friday, 17:40. Three artefacts arrive in the case folder and the duty manager wants the ATT&CK tags before the weekend. The rule stands: tag what is proven, and mark what is merely suggested. One artefact is a log, one is a dump, one is a message."},{"label":"ARTEFACT 1 — web log (excerpt)","kind":"code","body":"03:40:11  GET /about/team  200  \"python-requests/2.31\"\n03:40:12  GET /about/team  200  \"python-requests/2.31\"\n03:40:13  GET /about/team  200  \"python-requests/2.31\""},{"label":"ARTEFACT 2 — paste-site dump","kind":"code","body":"meridian accounts (18):\n  user: p.okafor  pass: ########\n  user: j.hartley pass: ########\n  ... (16 more)"},{"label":"ARTEFACT 3 — captured message (no names)","kind":"code","body":"From: services@maillots-supply[.]example\nSubj: Invoice reminder\nBody: \"Please review the attached invoice.\"\n(no recipient names, no titles in body)"}],"q":"Drag each tag to the bucket its evidence supports.","buckets":[{"id":"yes","t":"Supported by the artefacts"},{"id":"no","t":"Not supported — over-claim"}],"chips":[{"id":"c1","t":"T1589.003 — scripted team-page reads","b":"yes","why":"Bulk scripted reads of staff pages are employee-name collection."},{"id":"c2","t":"T1589.001 — the credentials dump","b":"yes","why":"User-password pairs are credential data — the scope of T1589.001."},{"id":"c3","t":"T1594 — victim-owned site as the source","b":"yes","why":"The team pages are the victim's own website — the T1594 source."},{"id":"c4","t":"T1566 — the invoice message as delivery","b":"yes","why":"A message pressing the recipient toward an attachment or link is phishing delivery, even without personalisation."},{"id":"c5","t":"T1078 — confirmed, because credentials were dumped","b":"no","why":"A dump is possession; T1078 needs evidence of a successful login using them."},{"id":"c6","t":"The paste dump came from the web scraper","b":"no","why":"No artefact links the two — different data types, no timestamps in common, no provenance."}],"explain":"Three artefacts, three honest tags, and two refused bridges. The log gives T1589.003 via T1594, the dump gives T1589.001, the message gives T1566. What nobody can tag yet is T1078 — possession of credentials is not their use — and the pipeline claim (scraper to dump) fails on provenance. The discipline matters because every unsupported tag in the folder becomes an unsupported claim in the boardroom.","persp":{"a":"From the attacker's side, separating collection of names from collection of credentials lets the two workstreams run independently — which is exactly why defenders must tag them independently.","d":"From the defender's side, three honest tags set three different next steps: exposure work for the pages, resets and monitoring for the dumped credentials, and mail controls for the phish."},"study":"Separate possession from use — the classic T1589.001 versus T1078 line.","hint":"Two chips claim events that no artefact shows — a login, and a pipeline."},{"id":"H13","title":"Six mails, one decision","type":"multi","summary":"Escalate only the mails that match the threat pattern","scen":[{"label":"CONTEXT","kind":"prose","body":"Your greeting-pattern analytic fired on six mails. It is 08:15, the phishing queue is watching, and a wrong call in either direction costs something: escalate everything and the queue drowns; tune everything and a real wave slips. Use the full sender context on each line."},{"label":"ARTEFACT 1 — gateway matches (06:00-08:00)","kind":"log","body":[{"t":"06:12","src":"mail","m":"to 3 faculty; body \"Hi Dr. Vance, ...\"; sender domain registered yesterday; no DKIM"},{"t":"06:31","src":"mail","m":"to 800 recipients; body \"Hi team, our monthly update...\"; bulk sender, known list host"},{"t":"06:44","src":"mail","m":"to 40 staff; body greets each by first name; sender = internal HR survey system (weekly digest)"},{"t":"07:03","src":"mail","m":"to 6 payroll staff; body \"Hi Anna, ... your payroll schedule\"; sender domain registered 2 days ago"},{"t":"07:21","src":"mail","m":"to the CFO; body \"Hi Elena — about your keynote...\"; sender domain 3 years old; DKIM pass; established vendor relationship"},{"t":"07:58","src":"mail","m":"to 12 IT staff; body \"Hi team...\"; sender domain registered 3 days ago; credential-reset lure"}]}],"q":"Select every mail that warrants escalation to the phishing queue.","opts":[{"t":"06:12 — named faculty, yesterday's domain, no DKIM","correct":true,"why":"Personalisation plus fresh anonymous infrastructure is the named-lure signature."},{"t":"07:03 — named payroll staff, two-day-old domain","correct":true,"why":"The same signature against a high-value team — escalate."},{"t":"07:58 — 'Hi team' credential-reset lure, three-day-old domain","correct":true,"why":"No names, but a fresh domain pushing credential capture is an active lure wave."},{"t":"06:31 — 'Hi team' bulk newsletter","correct":false,"why":"Generic greeting from a known list host — the noise AN1989 predicts."},{"t":"06:44 — internal HR digest greeting each by name","correct":false,"why":"The trap twin of 07:03: same greeting, but an expected internal system on a known schedule."},{"t":"07:21 — CFO greeted by name from an established vendor","correct":false,"why":"Alarming-looking, but sender age, DKIM pass and a known relationship make it a benign vendor follow-up."}],"explain":"Three escalations, three tune-outs, and the reasoning is visible on each line. The escalated set shares one property: personalisation or credential pressure carried by anonymous, freshly registered infrastructure. The refused set shows the two false-positive shapes: the internal twin (06:44) that proves a greeting alone is not a signal, and the alarming-looking but fully attested vendor mail (07:21). That is the AN1989 false-positive profile applied line by line.","study":"Write the two-column card: what escalates a greeting, what suppresses it.","hint":"Sender age and attestation decide the named greetings; infrastructure age decides the credential lures."},{"id":"H14","title":"The legal constraint","type":"decision","summary":"Minimise exposure without breaking a publishing duty","scen":[{"label":"CONTEXT","kind":"prose","body":"Compliance, security and communications meet to reduce public staff exposure after a named-phish wave. Then legal adds the constraint: a listing rule requires the firm to publish its executive officers' names and roles on the corporate site. Several proposals are on the table, and the group needs the plan that survives both the constraint and the threat model."},{"label":"ARTEFACT 1 — the constraint and the current exposure","kind":"code","body":"constraint: executive officers' names + roles must stay published\nexposure:   careers page lists name+role+photo+direct dial\n            for 60 staff; exec bios with career history online"}],"q":"Make the three calls in order.","steps":[{"q":"Step 1 — How does the legal constraint change the plan?","opts":[{"t":"Full removal is off the table for the exec set; minimisation must target what is not legally required","correct":true,"outcome":"Right: the constraint scopes the M1056 work to the non-required details."},{"t":"The constraint makes M1056 impossible","correct":false,"outcome":"M1056 says minimise, not eliminate — the constraint changes scope, not validity."},{"t":"The constraint only applies to social media","correct":false,"outcome":"The publishing duty is on the corporate site; social profiles remain fully addressable."},{"t":"Security should override legal and remove everything","correct":false,"outcome":"Security does not get to break the listing rule — the plan must work within it."}]},{"q":"Step 2 — Which action set is both lawful and effective for the careers page?","opts":[{"t":"Keep legally required details; drop photos and direct dials; move remaining named contacts to role-based aliases","correct":true,"outcome":"Correct: the required core stays, the enrichment that feeds lures goes."},{"t":"Remove all names from all pages, exec set included","correct":false,"outcome":"Breaches the listing duty — a non-starter legal would veto within the hour."},{"t":"Leave everything as is; the constraint ends the discussion","correct":false,"outcome":"The constraint covers a handful of execs, not 60 staff pages of photos and dials."},{"t":"Gate the staff page behind a login form","correct":false,"outcome":"It hides the page from candidates too and drives the data to third-party platforms you control even less."}]},{"q":"Step 3 — How do you verify the plan worked?","opts":[{"t":"Re-scan the public sources (site, social profiles, lists) and diff the name data before and after","correct":true,"outcome":"Right: minimisation is a measurable change; measure it the way the adversary would see it."},{"t":"Assume it worked once the tickets are closed","correct":false,"outcome":"Ticket closure is not evidence; cached pages and old posts persist."},{"t":"Wait to see whether phishing stops","correct":false,"outcome":"Lure volume is a noisy signal; the measurable signal is the data pool."},{"t":"Ask staff to report whether they feel safer","correct":false,"outcome":"Feelings are not a metric for an exposure programme."}]}],"explain":"The exercise teaches M1056 as a programme, not a slogan: constraints first, then the largest lawful reduction, then verification by measurement. The legal duty scopes what may be touched — exec names stay, but photos, dials and enrichment do not, and role-based aliases break the name-to-address derivation. The verification step matters most in hard reviews: you measure the pool the way an adversary reads it, not by how busy the tickets were.","study":"Turn M1056 into a three-line programme: constraints, reduction, re-measurement.","hint":"The constraint removes one option entirely — and the correct plan is the largest reduction that remains lawful."},{"id":"H15","title":"Playbook order under pressure","type":"order","summary":"Order four response steps when a named wave lands","scen":[{"label":"CONTEXT","kind":"prose","body":"08:30. A wave of personalised mails hit 14 finance staff overnight; four clicks are confirmed. The on-call analyst has one shot at ordering the playbook and one card that tempts everyone: 'purge the inbox rule and delete the messages everywhere' — fast, satisfying, and destructive if done first. Order the cards the way the evidence survives."},{"label":"ARTEFACT 1 — the four playbook cards","kind":"code","body":"P1  preserve: export messages + headers + auth results\nP2  scope: pull the recipient set and the personalisation\n     pattern (who was named, from which source)\nP3  block: sender domain, URLs, and the delivered rule\nP4  brief: warn the named group; feed the exposure review"}],"q":"Order the four steps from first to last.","items":["P1 — preserve: export messages, headers and auth results","P2 — scope: recipient set and personalisation pattern","P3 — block: sender domain, URLs, and the delivered rule","P4 — brief: warn the named group and feed the exposure review"],"why":["Preservation first — every later step needs the artefacts intact.","Scoping second — blocking before you know the full recipient set leaves copies landing all morning.","Blocking third — now it stops the bleeding without having destroyed what taught you the pattern.","Briefing last — the named group and the exposure review close both ends of the chain."],"explain":"The order encodes the evidence rule: preserve, scope, block, brief. Doing P3 first — the tempting purge — destroys the messages that P2 needs to find the other eleven recipients, and an incomplete block chases copies all day. The briefing step closes the loop the way this whole file has argued: the named group gets warned today, and the public source that personalised the wave becomes an M1056 work item for next week.","study":"Drill the four-word order: preserve, scope, block, brief — and name what each protects.","hint":"One card cannot be undone once done — it goes last among the technical steps, not first."},{"id":"H16","title":"Procedure-table exam","type":"multi","summary":"Select the statements the ATT&CK page actually supports","scen":[{"label":"CONTEXT","kind":"prose","body":"A partner firm sent a one-page summary of T1589.003 for your review before a joint client report. Check each statement against the page's procedure examples and references — three are right, three are embellishments."},{"label":"ARTEFACT 1 — the partner's statements","kind":"code","body":"A  \"Kimsuky has collected victim employee name information.\"\nB  \"Sandworm Team's research of potential victim organizations\n    included identification and collection of employee\n    information.\"\nC  \"Silent Librarian has collected lists of names for\n    individuals from targeted organizations.\"\nD  \"All three groups used the same custom tooling for the\n    name collection.\"\nE  \"Sandworm used the collected employee names to deploy\n    NotPetya.\"\nF  \"The page's Kimsuky row cites KISA's Operation Muzabi\n    analysis.\""}],"q":"Select every statement the ATT&CK page supports.","opts":[{"t":"A — Kimsuky collected victim employee name information","correct":true,"why":"Verbatim from the procedure table."},{"t":"B — Sandworm's victim-org research included employee information","correct":true,"why":"Verbatim from the procedure table."},{"t":"C — Silent Librarian collected lists of names from targeted organisations","correct":true,"why":"Verbatim from the procedure table."},{"t":"F — the Kimsuky row cites KISA's Operation Muzabi analysis","correct":true,"why":"The row's reference is KISA's 2021 Operation Muzabi analysis."},{"t":"D — all three groups used the same custom tooling","correct":false,"why":"The page makes no tooling claim at all — three rows, three descriptions, no shared tool."},{"t":"E — Sandworm used the names to deploy NotPetya","correct":false,"why":"The page links the row to victim research and an indictment — a NotPetya claim appears nowhere in it."}],"explain":"The four correct statements are the page's own words plus its own reference — nothing more. The two failures are the two classic CTI embellishments: inventing shared tooling across three unrelated rows, and chaining a row into a famous operation it never mentions. When a partner summary is this close to the source, the review skill is checking each sentence against the exact row it claims to summarise.","study":"Re-read the procedure table and its references; note what each row does and does not claim.","hint":"Two statements add hardware, software and history that the rows never mention."}]};
</script>
<script>

(function(){
'use strict';
var D = window.__EXAM__;
var $ = function(s,r){return (r||document).querySelector(s);};
var EL = document.createElement('div');

function esc(s){ EL.textContent = String(s==null?'':s); return EL.innerHTML; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function fmtT(sec){ sec=Math.max(0,Math.round(sec)); var m=Math.floor(sec/60),s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function scoreExercise(h,w,n){ if(n<=0){return 0;} return Math.max(0,(h-w)/n); }
function normalize(s){ return String(s||'').toLowerCase().replace(/[.,;:!?"'`()\[\]]/g,' ').replace(/\s+/g,' ').trim(); }

/* ---------------- app state ---------------- */
var S = {
  view:'intro', order:[], idx:0,
  checked:{}, skipped:{}, credit:{}, rows:{}, canonical:{}, dangerous:{},
  hintUsed:{}, inReview:false,
  timer:{ state:'IDLE', remaining:0, per:{ active:false, rem:0 } },
  acc:{ manual:0, auto:0 }, sinceManual:null, sinceAuto:null,
  reported:false, user:null
};
var widget = null; /* current exercise widget controller */

/* ---------------- topbar ---------------- */
function sevClass(){ return {easy:'b-easy',medium:'b-medium',hard:'b-hard','extremely-hard':'b-extreme'}[D.meta.difficulty]; }
function topbarHTML(){
  return '<div class="topbar-in">'
   +'<span class="tb-count" id="tb-count"></span>'
   +'<span class="badge '+sevClass()+'"><span class="dot"></span>'+esc(D.meta.sevWord)+'</span>'
   +'<span class="tb-timer" id="tb-timer" aria-label="exam timer">--:--</span>'
   +'<span class="tb-state" id="tb-state"></span>'
   +'<span class="tb-spacer"></span>'
   +'<span class="tb-user" id="tb-user"></span>'
   +'<span class="tb-score" id="tb-score" aria-label="live score"></span>'
   +'<button class="btn btn-ghost" id="bt-hint" title="Reveal one hint (costs 10 percent of this exercise credit)">\u25C9 Hint</button>'
   +'<button class="btn btn-ghost" id="bt-pause" title="Manual pause: hides the exercise and stops the timer">\u23F8 Pause</button>'
   +'<button class="btn btn-ghost" id="bt-skip" title="Skip: move this exercise to the skipped pool">\u26A0 Skip</button>'
   +'</div><div class="pbar"><div class="pbar-in" id="pbar-in"></div></div>';
}
function renderUser(){
  var el = $('#tb-user'); if(!el){return;}
  if(S.user && S.user.username){ el.textContent = 'Analyst: '+S.user.username+(S.user.country && S.user.country!=='ZZ' ? ' ('+S.user.country+')' : ''); }
}
function updateTopbar(){
  var ex = curEx();
  $('#tb-count').textContent = S.view==='exam' ? ('Exercise '+(S.order.indexOf(S.idx)+1)+' of '+S.order.length) : '';
  var t = $('#tb-timer'); var st = $('#tb-state');
  t.textContent = fmtT(S.timer.remaining);
  var btp = $('#bt-pause');
  if(S.timer.state==='RUNNING'){ t.style.color='var(--state-correct)'; st.textContent='\u25B6 RUNNING'; st.style.color='var(--state-correct)'; btp.disabled=false; }
  else if(S.timer.state==='PAUSED_MANUAL'){ t.style.color='var(--state-paused)'; st.textContent='\u23F8 PAUSED \u2014 manual (press Resume)'; st.style.color='var(--state-paused)'; }
  else if(S.timer.state==='PAUSED_AUTO_CHECK'){ t.style.color='var(--state-paused)'; st.textContent='\u23F8 PAUSED \u2014 reviewing feedback (resumes on Next)'; st.style.color='var(--state-paused)'; }
  else if(S.timer.state==='ENDED'){ t.style.color='var(--state-skipped)'; st.textContent='\u25A0 ENDED'; st.style.color='var(--state-skipped)'; }
  else { st.textContent=''; }
  var sum=0, cnt=0;
  for(var k in S.credit){ sum+=S.credit[k]; cnt++; }
  var sc=$('#tb-score');
  if(cnt>0){ var pct=Math.round((sum/cnt)*100); sc.innerHTML='<b>'+sum.toFixed(1)+'</b> / '+cnt+' <span class="pct">\u00B7 '+pct+'%</span>'; }
  else { sc.innerHTML='<b>0.0</b> / 0 <span class="pct">\u00B7 start answering</span>'; }
  var p = S.view==='exam' ? ((S.order.indexOf(S.idx)+1)/S.order.length*100) : (S.view==='results'?100:0);
  $('#pbar-in').style.width = p+'%';
  document.body.setAttribute('data-exact-score', String(sum));
  renderUser();
}

/* ---------------- timer ---------------- */
var lastTick = null;
setInterval(function(){
  var now = Date.now();
  if(lastTick===null){ lastTick=now; return; }
  var dt = now-lastTick; lastTick=now;
  if(S.timer.state==='RUNNING'){
    S.timer.remaining -= dt/1000;
    if(S.timer.per.active){ S.timer.per.rem -= dt/1000;
      var pe=$('#per-timer-v'); if(pe){ pe.textContent = fmtT(S.timer.per.rem);
        if(S.timer.per.rem<=30){ pe.style.color='var(--state-incorrect)'; } }
      if(S.timer.per.rem<=0){ S.timer.per.active=false; if(widget&&widget.autoSubmit){ widget.autoSubmit(); } }
    }
    if(S.timer.remaining<=0){ S.timer.remaining=0; S.timer.state='ENDED'; endExam('timeout'); }
    if(S.view==='exam'||S.view==='review'){ updateTopbar(); }
  }
},250);
function setTimerState(st){
  if(st==='PAUSED_MANUAL'){ S.sinceManual=Date.now(); }
  if(st==='RUNNING'){ if(S.sinceManual){ S.acc.manual+=(Date.now()-S.sinceManual)/1000; S.sinceManual=null; } }
  if(st==='PAUSED_AUTO_CHECK'){ if(!S.sinceAuto){ S.sinceAuto=Date.now(); } }
}
function leaveAuto(){ if(S.sinceAuto){ S.acc.auto+=(Date.now()-S.sinceAuto)/1000; S.sinceAuto=null; } }

/* manual pause (can also be pressed on top of the Check auto-pause) */
function togglePause(){
  var t=S.timer;
  if(t.state==='RUNNING'||t.state==='PAUSED_AUTO_CHECK'){
    if(t.state==='PAUSED_AUTO_CHECK'){
      S.pendingAuto=true;
      if(S.sinceAuto){ S.acc.auto+=(Date.now()-S.sinceAuto)/1000; S.sinceAuto=null; }
    }
    t.state='PAUSED_MANUAL'; S.sinceManual=Date.now(); showPauseOverlay();
  }
  else if(t.state==='PAUSED_MANUAL'){
    hidePauseOverlay();
    if(S.sinceManual){ S.acc.manual+=(Date.now()-S.sinceManual)/1000; S.sinceManual=null; }
    if(S.pendingAuto){ t.state='PAUSED_AUTO_CHECK'; if(!S.sinceAuto){ S.sinceAuto=Date.now(); } }
    else { t.state='RUNNING'; }
  }
  updateTopbar();
}
function showPauseOverlay(){
  var o=document.createElement('div'); o.className='overlay'; o.id='pause-overlay';
  o.innerHTML='<div class="overlay-card"><div class="big">\u23F8</div><h2>PAUSED \u2014 manual break</h2>'
   +'<p>The timer is stopped and the exercise is hidden. Press Resume when you are ready to continue.</p>'
   +'<button class="btn btn-primary btn-lg" id="bt-resume">Resume exam</button></div>';
  document.body.appendChild(o);
  $('#bt-resume').addEventListener('click', togglePause);
}
function hidePauseOverlay(){ var o=$('#pause-overlay'); if(o){ o.remove(); } }

/* ---------------- views ---------------- */
function show(id){ ['view-intro','view-exam','view-review','view-results'].forEach(function(v){ var el=$('#'+v); if(el){ el.classList.add('hidden'); } }); $('#'+id).classList.remove('hidden'); window.scrollTo(0,0); }

function renderIntro(){
  var I=D.intro, m=D.meta;
  var h='<div class="intro-head"><h1>'+esc(I.h1)+'</h1>'
   +'<p class="small">'+esc(m.objId+' \u2014 '+m.objName)+' \u00B7 '+esc(I.objType)+'</p>'
   +'<div class="factrow">'
   +'<span class="badge '+sevClass()+'"><span class="dot"></span>'+esc(m.sevWord)+'</span>'
   +'<span class="fact"><b>'+D.exercises.length+'</b> exercises</span>'
   +'<span class="fact">estimated <b>'+m.estimatedMinutes+' min</b> \u00B7 timer budget <b>'+fmtT(m.timerSeconds)+'</b></span>'
   +'<span class="fact">pass mark <b>'+m.passMark+'%</b></span>'
   +'</div></div>';
  h+='<div class="panel"><h2>'+esc(I.learnTitle)+'</h2>'+I.learn.map(function(p){return '<p>'+p+'</p>';}).join('')+'</div>';
  h+='<div class="panel"><h2>Keywords covered in this exam</h2>';
  I.themes.forEach(function(t){ h+='<div class="kw-theme"><h3>'+esc(t.name)+'</h3><div class="kw-list">'
    +t.items.map(function(x){return '<span class="kw">'+esc(x)+'</span>';}).join('')+'</div></div>'; });
  h+='</div>';
  h+='<div class="panel"><h2>How this exam works</h2><ul class="rules">';
  I.how.forEach(function(r){ h+='<li>'+r+'</li>'; });
  h+='</ul><div class="btn-row"><button class="btn btn-primary btn-lg" id="bt-start">\u25B6 Start the exam</button></div></div>';
  $('#view-intro').innerHTML=h;
  $('#bt-start').addEventListener('click', startExam);
}

/* ---------------- exam flow ---------------- */
function startExam(){
  S.order = shuffle(D.exercises.map(function(e,i){return i;}));
  S.idx = S.order[0]; S.checked={}; S.skipped={}; S.credit={}; S.rows={}; S.canonical={}; S.dangerous={};
  S.hintUsed={}; S.inReview=false; S.pendingAuto=false; S.reported=false; S.postedNow=false;
  S.acc={manual:0,auto:0}; S.sinceManual=null; S.sinceAuto=null;
  S.timer.remaining=D.meta.timerSeconds; S.timer.per={active:false,rem:0};
  S.timer.state='RUNNING';
  S.view='exam'; S.inReview=false; S.pendingReview=false;
  show('view-exam'); renderExercise(S.idx); updateTopbar();
}
function curEx(){ return D.exercises[S.idx]; }
function posOf(i){ return S.order.indexOf(i); }
function nextUnchecked(from){
