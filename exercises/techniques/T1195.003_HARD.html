<script>
var DATA = {"meta":{"topicId":"t1195.003","batch":3,"title":"T1195.003 Compromise Hardware Supply Chain — HARD","difficulty":"hard","questionCount":15,"estimatedMinutes":45,"passMark":70},"severity":"HARD","timerBudget":2700,"intro":{"learn":["This is the <b>HARD</b> exam for <b>T1195.003 &mdash; Compromise Hardware Supply Chain</b>. The technique stays the same &mdash; hardware or firmware tampered with <b>before</b> the buyer receives it, mapped to <b>Initial Access</b> on <b>Linux, Windows and macOS</b> &mdash; but now the answers are not clean. Two options will often both look defensible; only one survives the specifics of the artefacts.","You will correlate intake tickets, vendor advisories, boot attestations, HBOM records (the hardware cousin of a Software Bill of Materials) and gateway logs, the way an incident responder does on a real case. Detection content follows ATT&amp;CK&rsquo;s strategy <b>DET0368</b>; controls follow <b>M1046 Boot Integrity</b>; classification exercises force you to separate T1195.003 from <b>T1195.002</b> (software supply chain), <b>T1195.001</b> (dependencies and dev tools), <b>T1542 Pre-OS Boot</b> and <b>T1200 Hardware Additions</b>.","You will also meet the public record. Reported cases include an alleged malicious-chip implant on server boards (&ldquo;The Big Hack&rdquo; &mdash; disputed by the companies named), and documented government shipment-interdiction tooling. Real hardware supply chain stories come with uncertainty; the exam rewards language that keeps that uncertainty visible.","Two exercises are terminal-based: one verifies an image against a vendor advisory on a forensic image, one enumerates live USB hardware on an appliance. They test different skills, and the scenario tells you everything about the environment but nothing about which tool to use. The correct action in several exercises is the <b>least aggressive</b> one &mdash; resist the urge to wipe, reflash or reset before evidence is preserved."],"themes":[{"name":"Correlation & evidence","items":["intake ticket vs vendor advisory","firmware hash baselines","TPM attestation failures","HBOM validation","chain of custody"]},{"name":"Classification discipline","items":["T1195.003 vs T1195.002 vs T1195.001","T1542 Pre-OS Boot (after access)","T1200 Hardware Additions (on site)","benign vendor operations"]},{"name":"Real-world record","items":["alleged server-board chip implants (disputed)","government shipment-interdiction tooling","uncertainty in attribution"]},{"name":"Incident workflow","items":["preserve telemetry read-only","compare vs vendor baseline","isolate single device","engage vendor & procurement","replace hardware"]},{"name":"Detection engineering","items":["signature-failure + unsigned-driver pairing","secure boot state analytics","vendor baseline drift","beacon patterns from management interfaces"]},{"name":"GRC & contracts","items":["chain-of-custody requirements","firmware hash at intake","supplier attestation","SOC 2 limits"]}],"types":"multi-artefact correlation, near-miss single choice, multi-select, matching, ordering, word blanks, a filterable gateway log, HBOM validation, two terminal commands (integrity verification and device enumeration), a 3-step incident scenario, and an ATT&CK placement match"},"exercises":[{"id":"h1","type":"multi","title":"Two facts that change the case","summary":"Correlate intake ticket, inventory and vendor notice","scen":[{"t":"p","x":"Three artefacts from the same switch batch sit in the queue. Most lines are routine. Select the <b>two</b> facts that, together, move this from &lsquo;intake noise&rsquo; to &lsquo;supply-chain case&rsquo;."},{"t":"mono","label":"ARTEFACT 1 — INTAKE TICKET #4471","x":"batch NX-2200, 12 units, dock 2\nunit 07: fw build 3.2.1, hash 9f2c..e81a\nunit 08: fw build 3.2.1, hash 9f2c..e81a\nunit 09: fw build 3.2.1, hash <span class='er'>d41b..0c7e</span>  (differs from siblings)"},{"t":"mono","label":"ARTEFACT 2 — VENDOR NOTICE (same morning)","x":"&ldquo;All build 3.2.1 images for NX-2200 ship with hash 9f2c..e81a.\nPlant 7 produced no NX-2200 units this quarter.&rdquo;"},{"t":"mono","label":"ARTEFACT 3 — NOISE (for contrast)","x":"unit 09 port stats: normal throughput\nunit 09 label: &lsquo;Property of IT&rsquo;, correct asset tag"}],"q":"Select the two facts that together justify opening a supply-chain case.","options":[{"id":"a","x":"Unit 09&rsquo;s firmware hash differs from both its siblings and the vendor-published value","why":"Correct: a one-unit hash deviation is the classic single-target interdiction pattern &mdash; tamper one box, leave the rest clean."},{"id":"b","x":"The vendor states no NX-2200 units came from plant 7 this quarter","why":"Correct: a provenance statement that contradicts the delivery record removes the innocent explanation &mdash; the two facts correlate."},{"id":"c","x":"Unit 09&rsquo;s port statistics look normal","why":"Not correct: normal port stats are expected &mdash; a well-made implant does not saturate links. This is the artefact that looks alarming only if you expect obvious misbehaviour."},{"id":"d","x":"Unit 09 carries the correct IT asset label","why":"Not correct: the label was applied by your own intake team; it says nothing about the factory."},{"id":"e","x":"Units 07 and 08 have identical hashes","why":"Not correct: sibling consistency alone is the <i>healthy</i> pattern &mdash; it only becomes evidence when contrasted with unit 09&rsquo;s deviation."}],"correct":["a","b"],"hint":"One fact is about the unit, one is about the factory. Together they close the innocent explanations; each alone leaves a loophole.","expl":"Credit formula: <span class='mono'>max(0, (H &minus; W) / 2)</span>. The case exists because <b>hash deviation</b> (unit-level tamper evidence) and <b>provenance contradiction</b> (batch-level lie) correlate. Either alone is arguable: a deviant hash could be a flashing error; a plant statement could be an out-of-date record. Together they are a case. Note the traps: the <i>benign-looking</i> port stats and label are exactly what a quiet implant would look like.","study":"Add &lsquo;per-unit firmware hash + vendor provenance statement&rsquo; as a required intake pair for network gear."},{"id":"h2","type":"mcq","title":"Bootkit after phishing","summary":"Firmware rootkit found post-compromise &mdash; which technique?","scen":[{"t":"p","x":"An admin was phished and mounted a malicious ISO on a <b>production</b> server. A week later, the re-installer notices a UEFI bootkit persisting below the OS. The server was delivered 18 months ago and passed intake cleanly."},{"t":"mono","label":"ARTEFACT 1 — TIMELINE","x":"T-18 months: server delivered, intake clean (hashes match)\nT-7 days:  admin mounts ISO &lsquo;patch_bundle.iso&rsquo; from phishing mail\nT-6 days:  server reboots twice overnight\nT-0:      UEFI bootkit discovered persisting across OS reinstalls"}],"q":"Which ATT&CK technique best describes the <b>bootkit placement</b>?","options":[{"id":"a","x":"T1195.003 &mdash; Compromise Hardware Supply Chain","why":"Near miss &mdash; this is the tempting answer because the artefact is firmware. But the tampering happened <b>after delivery</b>, by an actor who was already inside via phishing. Nothing in the chain was touched."},{"id":"b","x":"T1542.001 &mdash; Pre-OS Boot: System Firmware","why":"Correct: the bootkit was installed on an already-deployed host&rsquo;s system firmware, persisting below the OS &mdash; the definition of Pre-OS Boot / System Firmware."},{"id":"c","x":"T1195.002 &mdash; Compromise Software Supply Chain","why":"Near miss &mdash; a malicious &lsquo;patch bundle&rsquo; sounds like a distribution channel, but the ISO was not the vendor&rsquo;s channel; it was attacker-delivered to one admin."},{"id":"d","x":"T1078 &mdash; Valid Accounts","why":"Valid Accounts describes the phishing-to-login step, not the bootkit&rsquo;s placement in system firmware."}],"correct":"b","hint":"Ask when the tampering happened relative to delivery: 18 months after clean intake, through an already-phished admin.","expl":"The discriminator is <b>who had access when</b>. T1195.003 requires the tamper to precede receipt &mdash; here intake was clean 18 months prior. The actor was inside the estate and wrote the system firmware directly: that is <b>T1542.001</b>. <b>Attacker view:</b> firmware persistence after access buys survivability across reinstalls. <b>Defender view:</b> the same M1046 controls (Secure Boot, TPM attestation) detect both scenarios &mdash; which is why they appear under both techniques&rsquo; mitigations.","study":"Read T1542 Pre-OS Boot and its three sub-techniques; compare their data sources with T1195.003&rsquo;s."},{"id":"h3","type":"terminal","title":"Verify image against the advisory","summary":"Forensic image of an appliance: verify the firmware hash exactly as the advisory prescribes","scen":[{"t":"p","x":"You are on a <b>forensic image</b> of a suspected appliance&rsquo;s service shell (read-only mounts; the vendor advisory is on the bench sheet). No tool is named for you. The image to verify is <b>fw-cluster-9.1.0.img</b> and the advisory ships a sidecar <b>fw-cluster-9.1.0.img.sha256</b>."},{"t":"mono","label":"ARTEFACT 1 — VENDOR ADVISORY SA-2026-114 (excerpt)","x":"Affected: fw-cluster 9.1.0\nintegrity: verify with SHA-256 against the attached sidecar\nnote: builds with deviating hashes must NOT be flashed or run"}],"q":"Verify the image against the sidecar exactly as the advisory prescribes. Type the command, press Enter, then Check.","canonical":"sha256sum -c fw-cluster-9.1.0.img.sha256","canonWhy":"<span class='kw'>sha256sum</span> (or openssl/shasum in SHA-256 mode) is the integrity tool; <b>-c</b> performs the automated comparison the advisory asks for; <b>fw-cluster-9.1.0.img.sha256</b> is the sidecar that carries the expected digest. A verdict of OK/FAILED is the artefact the case needs.","parts":[{"name":"hash tool (SHA-256 capable)","ok":"^sha256sum$|^shasum$|^openssl$","bad":"^md5sum$|^sha1sum$","why":"The advisory prescribes SHA-256. md5sum or sha1sum are different, weaker digests &mdash; the comparison would be meaningless against the sidecar."},{"name":"SHA-256 selection / check mode","ok":"^-c$|^-a$|^sha256sum$|^dgst$","bad":"^md5|^sha1","why":"The command must select SHA-256 semantics, and ideally the -c check mode that produces a verdict instead of a bare hash."},{"name":"target: the sidecar file","ok":"^fw-cluster-9\\.1\\.0\\.img\\.sha256$","bad":"^fw-cluster-9\\.1\\.0\\.img$|\\.iso$|\\.bak$|\\.tar$","why":"The argument must be the exact sidecar for build 9.1.0. A copy with another extension is not the artefact the advisory attests."}],"dangerous":["flashrom","dd\\s","rm\\s+-rf","mkfs"],"outputs":[{"m":"sha256sum\\s+-c\\s+fw-cluster-9\\.1\\.0\\.img\\.sha256","x":"fw-cluster-9.1.0.img: <span class='er'>FAILED</span>\nsha256sum: WARNING: 1 computed checksum did NOT match"},{"m":"^(shasum\\s+-a\\s*256|openssl\\s+dgst\\s+-sha256)\\s+.*fw-cluster-9\\.1\\.0\\.img$","x":"d41b86e30c7e55119f2c41d0aa7be8813f6c22d5a4b7e0f19c8d3a6251bb4c7e  fw-cluster-9.1.0.img  <span class='dm'>(differs from the advisory &mdash; do not flash)</span>"},{"m":"^(shasum|openssl)","x":"usage in this simulation: shasum -a 256 &lt;file&gt;  |  openssl dgst -sha256 &lt;file&gt;"},{"m":"^sha256sum","x":"sha256sum: cannot open: no such file in this simulation"}],"hint":"The advisory&rsquo;s wording is the requirement: an automated SHA-256 verdict, not an eyeball comparison &mdash; and on a forensic image, nothing you type may write anything.","expl":"<b>Near-miss map:</b> <span class='mono'>md5sum</span> produces a hash &mdash; but the wrong digest class, so the verdict is worthless; <span class='mono'>sha256sum fw-cluster-9.1.0.img</span> prints the right hash &mdash; but leaves the comparison to a human, which is what the advisory tried to remove; <span class='mono'>sha1sum</span> is both wrong-class and weaker. The canonical command yields <b>FAILED</b> here &mdash; the simulated appliance carries a deviating image, matching the suspected interdiction. <b>Forensic discipline:</b> every command in this exercise is read-only; on a live appliance the same rule applies until the flash is dumped.","study":"Run a sha256sum -c check on a real sidecar file and read the FAILED warning format."},{"id":"h4","type":"categorize","title":"Four findings, four verdicts","summary":"Sort findings into T1195.003, benign, T1542, T1200","scen":[{"t":"p","x":"Four findings from one week. Each bucket takes exactly one finding. Two of these findings will look similar at first glance &mdash; the timing and the actor&rsquo;s position decide."}],"q":"Drag each finding to its verdict.","slots":[{"id":"s1","label":"T1195.003 — tampered before delivery","why":"Correct: a replaced tamper seal plus a deviating firmware hash, both observed <b>at intake</b>, point to interference in the delivery chain."},{"id":"s2","label":"Benign — normal vendor operation","why":"Correct: a signed image from the vendor portal whose hash matches is the update channel working as designed &mdash; alarming-looking, but routine."},{"id":"s3","label":"T1542 — Pre-OS Boot (after access)","why":"Correct: a bootkit installed via a malicious ISO on a running server is post-access firmware persistence."},{"id":"s4","label":"T1200 — Hardware Additions (on site)","why":"Correct: a rogue switch physically installed inside your closet is on-site hardware, not chain tampering."}],"items":[{"id":"i1","x":"Intake: tamper seal replaced with a look-alike; firmware hash deviates from the vendor build"},{"id":"i2","x":"Admin reflashes a switch with the signed vendor image from the official portal; hash matches"},{"id":"i3","x":"Bootkit appears in UEFI after an admin mounted a malicious ISO on the running host"},{"id":"i4","x":"Rogue switch found patched into an IDF closet after a night-badge misuse"}],"correct":{"i1":"s1","i2":"s2","i3":"s3","i4":"s4"},"hint":"Two findings involve firmware writes. Ask who wrote, from where, and whether the hash chain ends at the vendor.","expl":"<b>Looks alarming but benign:</b> the reflash (i2) &mdash; firmware writes are scary words until the signature chain ends at the vendor portal. <b>Looks benign but alarming:</b> the replaced seal (i1) &mdash; cosmetic detail, devastating meaning. <b>Attacker view:</b> the four findings are four different actors with four different positions: logistics, your own ops team, a phished admin, a building intruder. <b>Defender view:</b> each verdict routes to a different playbook &mdash; supply-chain case, no action, IR, physical security.","study":"Write the four verdicts as decision-tree branches: who / when / which hash chain."},{"id":"h5","type":"mcq","title":"Least aggressive correct action","summary":"Suspected implant on the production firewall &mdash; choose the proportionate response","scen":[{"t":"p","x":"The production edge firewall shows a firmware hash deviation and a failed secure-boot attestation. The CISO wants the site protected; the operations lead wants zero downtime. Four proposals are on the table."},{"t":"mono","label":"ARTEFACT 1 — PROPOSALS","x":"A. Factory reset the device immediately, then restore config\nB. Preserve boot/firmware telemetry read-only, isolate the device, run on the backup link\nC. Re-image the disk, keep the device in production\nD. Keep it in production and watch for odd traffic"}],"q":"Which proposal is the correct, least aggressive action that still stops the exposure?","options":[{"id":"a","x":"A &mdash; factory reset immediately","why":"Aggressive and wrong: a reset destroys evidence, and firmware-level implants can persist in flash across resets &mdash; exposure continues without proof."},{"id":"b","x":"B &mdash; preserve read-only, isolate, fail over to the backup link","why":"Correct: evidence survives, the implant loses its network route, and the site keeps running on the backup &mdash; the minimum action that removes the exposure."},{"id":"c","x":"C &mdash; re-image the disk and continue","why":"The trap: re-imaging <i>feels</i> thorough but the implant lives below the OS &mdash; the device returns to production still compromised."},{"id":"d","x":"D &mdash; keep in production and watch","why":"Watching is not containment; the suspected implant keeps its position at your boundary while you observe."}],"correct":"b","hint":"Two proposals do not touch the implant&rsquo;s home at all; one destroys the evidence you are about to need. The correct one removes exposure while keeping proof.","expl":"<b>Looks alarming but is right:</b> failing over is disruptive, yet it is the only option that both preserves evidence and stops the exposure. <b>Looks thorough but is wrong:</b> re-imaging (C) &mdash; the classic below-the-OS mistake. <b>Least-aggressive principle:</b> in T1195.003 response, the escalation ladder is preserve &rarr; isolate &rarr; compare with vendor &rarr; replace hardware; every rung skips only with evidence in hand.","study":"Draft the escalation ladder for your own edge devices, with the evidence artefact named at each rung."},{"id":"h6","type":"match","title":"Public record, right shelf","summary":"Place five real-world cases on the correct ATT&CK shelf","scen":[{"t":"p","x":"The CTI team&rsquo;s reading list mixes five cases. Place each on the right ATT&amp;CK shelf. Note where public reporting is <b>disputed</b> &mdash; the shelf choice should reflect what the case claims, and the explanation keeps the doubt."}],"q":"Match each case to its shelf.","lefts":[{"id":"l1","x":"Alleged malicious chips added to server boards before sale (&ldquo;The Big Hack&rdquo;, disputed)","short":"Big Hack (disputed)"},{"id":"l2","x":"Documented government tooling for intercepting and modifying shipments","short":"Interdiction tooling"},{"id":"l3","x":"Backdoored code injected into a vendor&rsquo;s own update utility","short":"Update utility backdoor"},{"id":"l4","x":"Maintainer handover puts a malicious package into app dependency trees","short":"Hijacked dependency"},{"id":"l5","x":"UEFI bootkit installed via infected removable media on an already-running host","short":"UEFI bootkit on host"}],"rights":[{"id":"r1","x":"T1195.003 &mdash; tampering before delivery (hardware)"},{"id":"r2","x":"T1195.002 &mdash; compromise of the software product/update channel"},{"id":"r3","x":"T1195.001 &mdash; compromise of dependencies and dev tools"},{"id":"r4","x":"T1542 &mdash; Pre-OS Boot persistence after access"}],"correct":{"l1":"r1","l2":"r1","l3":"r2","l4":"r3","l5":"r4"},"why":{"l1":"Correct shelf: the claim is precisely pre-sale hardware tampering &mdash; T1195.003. Public reporting was disputed by the named companies, so treat it as an <i>alleged</i> T1195.003 case; the claim&rsquo;s shape still teaches the pattern.","l2":"Correct shelf: interdiction tooling exists to modify devices in transit &mdash; the same pre-delivery shelf, T1195.003, with stronger documentation.","l3":"Correct shelf: the vendor&rsquo;s own distribution utility was backdoored &mdash; that is the software product/update channel, T1195.002 (the SolarWinds/ASUS pattern).","l4":"Correct shelf: the dependency tree is the software ingredient layer &mdash; T1195.001 (the event-stream pattern).","l5":"Correct shelf: the host was already running and infected via media &mdash; nothing in the delivery chain was touched; T1542, not any T1195 sibling."},"hint":"Ask of each case: was the tamper point in the factory/logistics chain, in the software product, in code ingredients &mdash; or inside an already-running host?","expl":"Both l1 and l2 land on the T1195.003 shelf with very different confidence levels &mdash; and that contrast is the lesson: <b>classification and attribution confidence are separate judgements</b>. <b>Real-world discipline:</b> a CTI report that says &lsquo;consistent with T1195.003, publicly disputed&rsquo; is more professional than one that flattens the doubt. The other three cases show the full family: product channel (.002), ingredients (.001), and post-access persistence (T1542).","study":"Write one sentence per case naming what evidence would move its confidence up or down."},{"id":"h7","type":"order","title":"Device-level IR workflow","summary":"Order the five response steps for a suspected implant","scen":[{"t":"p","x":"A suspected hardware implant sits on the bench. The five response steps are shuffled; some orders destroy evidence, others leak time."}],"q":"Order the five steps from first to last.","items":[{"id":"o1","x":"Preserve boot and firmware telemetry read-only (logs, attestation, hash inventory)"},{"id":"o2","x":"Compare the collected hashes and versions against the vendor baseline and advisory"},{"id":"o3","x":"Isolate the device while keeping its evidence intact"},{"id":"o4","x":"Engage the vendor and procurement with the chain-of-custody record"},{"id":"o5","x":"Replace the hardware and file the report"}],"correctOrder":["o1","o2","o3","o4","o5"],"why":{"o1":"Correct first: everything downstream needs the artefacts; collection is read-only so it cannot make things worse.","o2":"Correct second: the vendor comparison turns raw hashes into a verdict &mdash; this decides whether a case exists.","o3":"Correct third: containment follows the verdict, not the panic; isolation without collection would have burned the window.","o4":"Correct fourth: the vendor and procurement conversation needs the evidence pack and custody record from steps 1&ndash;3.","o5":"Correct last: replacement is a business action taken once the case is proven and documented."},"hint":"Evidence is perishable: collect, then judge, then contain, then escalate, then fix.","expl":"The order encodes the discipline: <b>collect before you conclude, conclude before you contain, contain before you escalate, escalate before you replace</b>. Reordering any pair causes a specific failure: contain-first destroys the bench evidence; replace-first loses the device the vendor must inspect. <b>Defender view:</b> this ladder is the HARD-level answer to &lsquo;what do we do?&rsquo; &mdash; the EASY answer &lsquo;unplug everything&rsquo; fails here.","study":"Turn the five steps into checklist cards and slot them into your IR plan&rsquo;s hardware annex."},{"id":"h8","type":"fill","title":"Draft the analytic description","summary":"Complete the detection analytic&rsquo;s description with four keywords","scen":[{"t":"p","x":"You are writing the internal analytic description, modelled on DET0368&rsquo;s behavioural chain. The four trigger keywords are missing; the bank is shuffled and includes two decoys."}],"q":"Fill the four blanks with words from the bank.","parts":[{"t":"x","x":"Alert when "},{"t":"b","id":"b1"},{"t":"x","x":" boot reports a signature failure, when the "},{"t":"b","id":"b2"},{"t":"x","x":" version drifts from the vendor "},{"t":"b","id":"b3"},{"t":"x","x":", or when an "},{"t":"b","id":"b4"},{"t":"x","x":" driver loads right after boot."}],"bank":["secure","firmware","baseline","unsigned","encrypted","wireless"],"answers":{"b1":"secure","b2":"firmware","b3":"baseline","b4":"unsigned"},"blankNames":{"b1":"boot feature","b2":"what drifts","b3":"trusted reference","b4":"driver property"},"why":{"b1":"Correct: <b>secure</b> boot signature failures are the first chain step &mdash; the platform refused (or failed to check) a signature.","b2":"Correct: <b>firmware</b> is the layer that drifts &mdash; the artefact the attacker changed and the one you can version.","b3":"Correct: the vendor <b>baseline</b> is the only trusted reference; drift is meaningless without it.","b4":"Correct: an <b>unsigned</b> driver loading right after boot is the chain&rsquo;s follow-on execution step."},"hint":"The four keywords are: the boot feature, the layer that drifts, the trusted reference, and the driver property.","expl":"The sentence is DET0368&rsquo;s chain compressed: secure-boot signature failure &rarr; firmware version drift against the vendor baseline &rarr; unsigned driver loading after boot. <b>Detection-engineering note:</b> each keyword is also a mutable element to baseline per model &mdash; AN1035 calls them BaselineFirmwareVersion and BaselineDriverList. The decoys (&lsquo;encrypted&rsquo;, &lsquo;wireless&rsquo;) sound technical but name no part of the chain.","study":"Implement this sentence as one correlation rule in your SIEM and list its mutable fields."},{"id":"h9","type":"multi","title":"Signals that survive the doubt","summary":"Conflicting explanations &mdash; which two facts keep the implant hypothesis alive?","scen":[{"t":"p","x":"A batch of new firewalls shows three units failing TPM attestation. The room splits into two theories: <b>interdiction</b> or <b>bad flashing at the integrator</b>. Six facts are on the table. Select the two that keep the interdiction hypothesis alive."},{"t":"mono","label":"ARTEFACT 1 — FACTS ON THE TABLE","x":"F1. Three units of the same batch fail TPM attestation\nF2. The batch shipped from a new contract manufacturer\nF3. Lab units of the same model pass attestation\nF4. Release notes mention a UI refactor\nF5. The batch arrived two days early\nF6. The integrator confirms using the correct image"}],"q":"Select the two facts that support the interdiction hypothesis over the integrator theory.","options":[{"id":"a","x":"F2 &mdash; the batch shipped from a new contract manufacturer","why":"Correct: a new node in the manufacturing chain is a new interdiction opportunity &mdash; the fact points at the <b>chain</b>, not at the flashing bench."},{"id":"b","x":"F6 &mdash; the integrator confirms the correct image was used","why":"Correct: if the flashing bench did everything right, the corrupt-image explanation weakens and the chain explanation survives."},{"id":"c","x":"F3 &mdash; lab units of the same model pass","why":"Not correct: lab units never entered the suspect batch&rsquo;s chain, so their health is compatible with both theories."},{"id":"d","x":"F4 &mdash; release notes mention a UI refactor","why":"Not correct: irrelevant noise &mdash; UI work says nothing about attestation failures."},{"id":"e","x":"F5 &mdash; the batch arrived two days early","why":"Not correct: early arrival is compatible with both theories; logistics noise, not evidence."}],"correct":["a","b"],"hint":"One fact widens the attacker&rsquo;s opportunity; the other closes the rival explanation. The rest are noise that fits any story.","expl":"Credit formula: <span class='mono'>max(0, (H &minus; W) / 2)</span>. Hypothesis testing survives on facts that <b>discriminate</b>: F2 adds a new chain node (opportunity), F6 removes the rival cause. F3, F4 and F5 are realistic noise &mdash; each fits both stories equally, which is exactly why they must not sway the case. <b>Analyst discipline:</b> write down which theory each fact discriminates before you brief anyone.","study":"Re-run this test on one of your own open cases: which facts discriminate, which merely decorate?"},{"id":"h10","type":"sim","title":"CISO needs an answer","summary":"Three decisions under pressure on the suspected edge firewall","scen":[{"t":"p","x":"The suspected edge firewall is still in production. The CISO wants a decision in ten minutes; the VP of sales wants no downtime; the vendor&rsquo;s first-line support says &lsquo;looks fine to us&rsquo;. Three decisions follow. Intermediate steps keep the timer running; the final check pauses it."}],"q":"(shown per step)","steps":[{"id":"s1","label":"Step 1","q":"The CISO asks: is this device compromised? What is your answer?","options":[{"id":"o1","x":"&ldquo;Suspected, not proven &mdash; the hash deviation and attestation failure justify containment while the vendor verifies&rdquo;","correct":true,"outcome":"The CISO accepts the calibrated language and funds the containment window.","why":"Correct: senior leaders need calibrated confidence &mdash; &lsquo;suspected, not proven&rsquo; is the professionally defensible answer."},{"id":"o2","x":"&ldquo;It is confirmed compromised &mdash; the vendor said so&rdquo;","correct":false,"outcome":"The vendor&rsquo;s first-line note becomes your case file; the claim collapses under review.","why":"Not correct: first-line support is not a forensic verdict; overstating burns your credibility."},{"id":"o3","x":"&ldquo;No evidence of compromise &mdash; hashes sometimes differ&rdquo;","correct":false,"outcome":"The device stays at the boundary on a feel-good sentence.","why":"Not correct: a deviating hash plus a failed attestation is evidence &mdash; understating it is as wrong as overstating."}]},{"id":"s2","label":"Step 2","q":"The VP demands the firewall stay online through the sales close. What do you do?","options":[{"id":"o1","x":"Fail over to the backup link and isolate the suspect device now","correct":true,"outcome":"The site runs on the backup link; the suspect device is off the wire with its evidence intact.","why":"Correct: the least aggressive action that removes exposure &mdash; and the business keeps running, which answers the VP."},{"id":"o2","x":"Factory reset during the lunch lull and restore config","correct":false,"outcome":"Evidence gone; if the implant sits in flash, the &lsquo;clean&rsquo; device returns compromised.","why":"Not correct: destructive and possibly ineffective &mdash; the worst of both worlds."},{"id":"o3","x":"Accept the demand; keep it online until the close","correct":false,"outcome":"A suspected implant keeps its route out of your boundary for business hours.","why":"Not correct: schedule pressure is real, but boundary integrity outranks it."}]},{"id":"s3","label":"Step 3","q":"With the device isolated, what is the closing action of your shift?","options":[{"id":"o1","x":"Hand the vendor and procurement a packaged case: hashes, attestations, custody record","correct":true,"outcome":"The vendor opens an engineering ticket; procurement starts a batch hold with facts attached.","why":"Correct: escalation with evidence converts suspicion into a trackable external process."},{"id":"o2","x":"Close the internal ticket after the reboot looked normal","correct":false,"outcome":"The reboot&rsquo;s &lsquo;normal&rsquo; is logged nowhere and the case dies quietly.","why":"Not correct: nothing about this case is resolved; closing it just relocates the risk."},{"id":"o3","x":"Post the serial number to a public forum for help","correct":false,"outcome":"You have leaked your edge device&rsquo;s identity publicly, mid-case.","why":"Not correct: public disclosure is not yours to make unilaterally and helps no investigation."}]}],"hint":"The pattern repeats: calibrated language, least aggressive containment, evidence-backed escalation.","expl":"<b>Attacker view:</b> the attacker wins each hour the device stays at the boundary &mdash; and wins again if panic destroys the evidence. <b>Defender view:</b> the three answers share one skeleton: calibrated confidence, proportionate containment, documented escalation. That skeleton survives pressure; improvised variants do not. This exercise&rsquo;s explanation doubles as your briefing template.","study":"Rehearse the three answers out loud as if the CISO were in the room."},{"id":"h11","type":"match","title":"Place the techniques","summary":"Match four techniques to their matrix positions","scen":[{"t":"p","x":"A matrix excerpt is being rebuilt after a training lab. Match each technique to where it truly lives &mdash; tactic placement and one-line purpose included."}],"q":"Match each technique to its correct matrix placement.","lefts":[{"id":"l1","x":"T1195.003 Compromise Hardware Supply Chain","short":"T1195.003"},{"id":"l2","x":"T1542 Pre-OS Boot","short":"T1542"},{"id":"l3","x":"T1200 Hardware Additions","short":"T1200"},{"id":"l4","x":"T1583 Acquire Infrastructure","short":"T1583"}],"rights":[{"id":"r1","x":"Initial Access &mdash; victim receives tampered product"},{"id":"r2","x":"Persistence &amp; Defense Evasion &mdash; below-OS firmware foothold after access"},{"id":"r3","x":"Initial Access &mdash; attacker brings hardware in during an operation"},{"id":"r4","x":"Resource Development &mdash; attacker buys or rents its own kit first"}],"correct":{"l1":"r1","l2":"r2","l3":"r3","l4":"r4"},"why":{"l1":"Correct: T1195.003 sits in Initial Access &mdash; the compromise rides in with the product the victim bought.","l2":"Correct: T1542 lives under Persistence and Defense Evasion &mdash; it is a below-OS foothold an attacker plants <i>after</i> reaching the host.","l3":"Correct: T1200 is Initial Access too &mdash; but the attacker brings the hardware in during an operation, the mirror image of the supply chain.","l4":"Correct: T1583 belongs to Resource Development &mdash; the attacker acquires its own infrastructure before ever touching a victim."},"hint":"Two of these are Initial Access but for opposite reasons; one never touches the victim&rsquo;s estate at all.","expl":"<b>T1195.003</b> = the victim&rsquo;s own purchase is the weapon (Initial Access). <b>T1200</b> = the attacker carries the hardware in (Initial Access, opposite direction). <b>T1542</b> = firmware foothold <i>after</i> entry (Persistence/Defense Evasion). <b>T1583</b> = the attacker&rsquo;s own procurement (Resource Development) &mdash; the matrix position most beginners misplace. Mapping positions force you to answer &lsquo;whose asset, whose phase&rsquo; for each technique.","study":"Reproduce this four-cell map from memory, then add T1195.001 and T1195.002 with their positions."},{"id":"h12","type":"terminal","title":"Enumerate the USB tree","summary":"Live appliance shell: spot the unexpected controller","scen":[{"t":"p","x":"You are on the <b>live</b> management shell of a minimal Linux appliance (no package manager, no X). An intake photo shows a small extra component on the main board that could be a USB-attached controller. No tool is named for you; the shell ships the standard procps/iproute2/usbutils set. Nothing you run here may change state."},{"t":"mono","label":"ARTEFACT 1 — INTAKE PHOTO NOTE","x":"bench photo: unlabelled 8-pin component near the USB header\nquery needed: USB device tree with bus/port topology"}],"q":"Show the USB device <b>tree with bus/port topology</b> so the extra controller&rsquo;s position is visible. Type the command, press Enter, then Check.","canonical":"lsusb -t","canonWhy":"<span class='kw'>lsusb</span> is the USB enumeration tool in usbutils; <b>-t</b> renders the <b>tree view</b> &mdash; busses, ports and speeds &mdash; which is what makes an unlabelled controller&rsquo;s attachment point visible. Plain <span class='mono'>lsusb</span> lists devices but flattens the topology; <span class='mono'>lspci</span> walks the PCI bus, not the USB ports.","parts":[{"name":"USB enumeration tool","ok":"^lsusb$","bad":"^lspci$|^lshw$|^dmidecode$","why":"The evidence is a USB-attached component, so the USB bus tool is required. lspci/lshw/dmidecode inspect other buses &mdash; defensible commands for other questions, wrong for this one."},{"name":"tree/topology flag","ok":"^-t$|^-v$|^--tree$","bad":"^-s$","why":"-t prints the bus/port tree (the photo note asks for topology); -v dumps verbose descriptors, also acceptable here. Filtering to one device (-s) would hide the topology."}],"dangerous":["flashrom","dd\\s","rm\\s+-rf","reboot","modprobe\\s+-r"],"outputs":[{"m":"\\blsusb\\b.*-t","x":"/:  Bus 01.Port 1: Dev 1, Class=root_hub, Driver=xhci_hcd/4p, 480M\n    |__ Port 2: Dev 2, If 0, Class=Hub, 480M\n        |__ Port 1: Dev 3, If 0, Class=Mass Storage, 480M\n        |__ Port 2: Dev 4, If 0, Class=Vendor Specific, 12M  <span class='er'>&lt;- unexpected controller</span>"},{"m":"\\blsusb\\b","x":"Bus 001 Device 002: ID 1a40:0101 hub\nBus 001 Device 003: ID 0e8d:0001 mass storage\nBus 001 Device 004: ID 2341:8d3e vendor-specific  <span class='dm'>(flat list &mdash; topology hidden)</span>"},{"m":"^(lspci|lshw|dmidecode)","x":"(lists PCI/SMBus devices &mdash; the USB header component does not appear here)"}],"hint":"The photo note asks for topology, not a flat list &mdash; and the component sits on the USB header, not the PCI bus.","expl":"<b>Near-miss map:</b> <span class='mono'>lsusb</span> without -t answers &lsquo;what is attached&rsquo; but hides &lsquo;where&rsquo; &mdash; the topology is the evidence here; <span class='mono'>lspci</span> is the wrong bus. This exercise&rsquo;s skill (hardware enumeration) deliberately differs from the earlier hash-verification exercise. <b>Forensic discipline:</b> both commands are read-only &mdash; on a live suspected-implant device, that is the rule; the flash dump itself belongs to the evidence step, never to improvisation.","study":"Run lsusb and lsusb -t on a Linux box you own and note the difference in what you learn."},{"id":"h13","type":"logsel","title":"Gateway log hunt","summary":"Filter 26 lines of gateway syslog and select the three damning ones","scen":[{"t":"p","x":"The management gateway&rsquo;s syslog is merged from several sources. The case note says: an implant on a switch would (a) resolve an external name, (b) receive commands via DNS TXT outside any change window, and/or (c) write its own flash. Find and select those artefacts (three lines)."}],"q":"Select the three lines that match the case note&rsquo;s pattern.","lines":[{"id":1,"x":"jun 12 03:14:01 mgw dhcpd: lease 10[.]22.8.41 assigned to switch-09-mgmt"},{"id":2,"x":"jun 12 03:14:05 switch-09 snmpd: Connection from monitoring, accepted"},{"id":3,"x":"jun 12 03:15:00 mgw named: queries: switch-09-mgmt A ntp-server-lan CORRECT"},{"id":4,"x":"jun 12 03:15:22 switch-09 cli: admin ran 'show version' (change window CHG-88)"},{"id":5,"x":"jun 12 03:31:07 mgw named: queries: switch-09-mgmt TXT verify-sync.fw-sync[.]example"},{"id":6,"x":"jun 12 03:31:09 mgw named: response: TXT 'k8=3f9c..' to switch-09-mgmt"},{"id":7,"x":"jun 12 03:33:40 mgw named: queries: printer-03 A print-server-lan CORRECT"},{"id":8,"x":"jun 12 04:02:11 mgw named: queries: switch-09-mgmt TXT verify-sync.fw-sync[.]example"},{"id":9,"x":"jun 12 04:02:13 mgw named: response: TXT 'dl=none' to switch-09-mgmt"},{"id":10,"x":"jun 12 04:10:00 mgw ntpd: clock sync ok"},{"id":11,"x":"jun 12 04:44:02 mgw named: queries: switch-09-mgmt TXT verify-sync.fw-sync[.]example"},{"id":12,"x":"jun 12 04:44:03 mgw named: response: TXT 'cmd=slot2' to switch-09-mgmt"},{"id":13,"x":"jun 12 04:45:19 switch-09 kernel: SPI flash write at 0x003f0000 (no maintenance window)"},{"id":14,"x":"jun 12 04:45:20 switch-09 cli: user 'svc-backup' login ok"},{"id":15,"x":"jun 12 04:52:00 mgw named: queries: laptop-14 A software-repo-lan CORRECT"},{"id":16,"x":"jun 12 05:01:33 mgw dhcpd: lease renewals batch processed"},{"id":17,"x":"jun 12 05:15:00 switch-09 snmpd: CPU 7% mem 31% (healthy)"},{"id":18,"x":"jun 12 05:30:00 mgw backup: config archive job completed"},{"id":19,"x":"jun 12 05:31:10 mgw named: queries: switch-09-mgmt A ntp-server-lan CORRECT"},{"id":20,"x":"jun 12 05:33:41 mgw named: queries: printer-03 A print-server-lan CORRECT"},{"id":21,"x":"jun 12 06:02:00 mgw ntpd: clock sync ok"},{"id":22,"x":"jun 12 06:10:12 mgw named: queries: ap-07 A controller-lan CORRECT"},{"id":23,"x":"jun 12 06:31:00 switch-09 cli: 'write memory' by svc-backup (no window)"},{"id":24,"x":"jun 12 06:31:02 switch-09 cli: user 'svc-backup' logout"},{"id":25,"x":"jun 12 06:44:00 mgw named: queries: printer-03 A print-server-lan CORRECT"},{"id":26,"x":"jun 12 07:00:00 mgw daily: stats report generated"}],"correct":[5,13,23],"filter":true,"why":{"5":"Correct: first external TXT query to the look-alike firmware-sync domain, outside any change window &mdash; the implant&rsquo;s channel opening.","13":"Correct: an SPI flash write at 04:45 with no maintenance window &mdash; firmware does not rewrite itself; something on the device decided to persist.","23":"Correct: &lsquo;write memory&rsquo; by a backup service account with no change window &mdash; config persistence by a principal that should never do it.","1":"Noise: a DHCP lease for a management interface is normal daily traffic.","2":"Noise: SNMP polling from the monitoring system is expected.","3":"Noise: an internal A-record lookup to the NTP server is part of the healthy baseline.","4":"Noise: an admin CLI read during change window CHG-88 is documented activity.","6":"Context only: the TXT response to the beacon &mdash; damning when paired with line 5, but the query line is the artefact; selecting only the response misses the channel-opening event.","7":"Noise: printer lookups are baseline traffic.","8":"Second beacon &mdash; same channel as line 5; selecting it adds no new artefact class. The case note asks for the pattern&rsquo;s distinct artefacts.","9":"Context only: beacon response payload.","10":"Noise: NTP sync is healthy.","11":"Third beacon &mdash; same artefact class again; regularity (every ~31 min) is itself a finding, but it duplicates lines 5 and 8.","12":"Context only: the &lsquo;cmd=slot2&rsquo; response &mdash; a command payload arriving over DNS TXT.","14":"Noise: the backup service logging in is normal until it does something abnormal &mdash; which is line 23.","15":"Noise: laptop reaching the software repo is baseline.","16":"Noise: lease renewals are routine.","17":"Looks benign &mdash; and is benign: healthy CPU stats say nothing about firmware integrity; a quiet implant wants you to read exactly this line.","18":"Noise: the config archive job is scheduled work.","19":"Noise: another internal NTP lookup.","20":"Noise: printer baseline traffic.","21":"Noise: NTP sync again.","22":"Noise: AP-to-controller lookup is expected.","24":"Noise: logout of the backup account after its (abnormal) write.","25":"Noise: printer traffic.","26":"Noise: the daily stats report."},"hint":"Filter on &lsquo;TXT&rsquo; and on &lsquo;flash&rsquo;. Then ask of each candidate: was there a change window? The CLI line that saves config without one matters too.","expl":"Credit formula: <span class='mono'>max(0, (H &minus; W) / 3)</span>. The three artefacts are the beacon (TXT to the look-alike domain), the flash write outside a window, and the unauthorised config save. The healthy A-record lookups to internal names are the noise that makes filtering necessary &mdash; a real SOC queue looks exactly like this. <b>Detection-engineering note:</b> baseline the management VLAN&rsquo;s DNS: only NTP/repo/print names are normal; an external TXT sequence is a one-rule alert.","study":"Baseline your management VLAN&rsquo;s DNS names and write the &lsquo;TXT to outside&rsquo; alert."},{"id":"h14","type":"logsel","title":"HBOM validation","summary":"Vendor HBOM versus received unit &mdash; select the real mismatch lines","scen":[{"t":"p","x":"The vendor&rsquo;s HBOM (Hardware Bill of Materials) describes what each unit should contain. The received unit was imaged and inspected; the comparison lines are interleaved below. <b>Select the two lines</b> that are real HBOM mismatches."},{"t":"mono","label":"ARTEFACT 1 — COMPARISON SHEET (HBOM vs received unit)","x":"<span class='dm'>(interleaved below in the log viewer; HBOM lines marked, unit lines marked)</span>"}],"q":"Select the two lines that show a real mismatch between the HBOM and the received unit.","lines":[{"id":1,"x":"HBOM  flash   : 1x SPI 128 Mbit (winbond)"},{"id":2,"x":"unit  flash   : 2x SPI 128 Mbit (winbond + generic)"},{"id":3,"x":"HBOM  build   : fw 3.2.1 build id B-77401"},{"id":4,"x":"unit  build   : fw 3.2.1 build id B-77419"},{"id":5,"x":"HBOM  ports   : 24x SFP+"},{"id":6,"x":"unit  ports   : 24x SFP+ confirmed"},{"id":7,"x":"HBOM  psu     : 2x 650W"},{"id":8,"x":"unit  psu     : 2x 650W confirmed"},{"id":9,"x":"HBOM  mac oui : vendor range 0C:9A"},{"id":10,"x":"unit  mac oui : 0C:9A range confirmed"}],"correct":[2,4],"why":{"2":"Correct: an extra SPI flash chip is exactly where an implant&rsquo;s storage lives &mdash; the strongest physical mismatch.","4":"Correct: a build id the HBOM never lists means the firmware was not built by the documented line &mdash; it pairs with the extra chip into one tamper picture.","1":"This is the HBOM reference line itself &mdash; it defines what should be there; the mismatch lives on the unit&rsquo;s line.","3":"This is the HBOM reference build id &mdash; the reference, not the deviation.","5":"Reference line: 24x SFP+ is what the HBOM promises.","6":"Confirmation line: the unit matches the HBOM ports &mdash; healthy.","7":"Reference line: 2x 650W is what the HBOM promises.","8":"Confirmation line: PSU matches &mdash; healthy.","9":"Reference line: the vendor&rsquo;s own MAC range.","10":"Confirmation line: MACs in the vendor range &mdash; a healthy sign, not a mismatch."},"hint":"Two lines describe what <i>is</i> where the HBOM says something else should be &mdash; one is storage, one is identity of the code.","expl":"Credit formula: <span class='mono'>max(0, (H &minus; W) / 2)</span>. The extra SPI chip (where code hides) and the undocumented build id (what the code claims to be) form one coherent tamper picture; the port, PSU and MAC lines are the HBOM working as intended. <b>Real-world task:</b> HBOM-vs-unit diffing is a growing GRC practice &mdash; US Executive Order 14028 pushed SBOMs into contracts, and hardware cousins follow.","study":"Ask your top hardware vendor whether they can produce an HBOM at all &mdash; the answer is a risk datum."},{"id":"h15","type":"mcq","title":"The contract clause that bites","summary":"Which procurement artefact actually reduces T1195.003 risk?","scen":[{"t":"p","x":"Legal asks which assurance artefact should be <b>contractually required</b> from the hardware supplier to reduce T1195.003 risk specifically. Four candidates are on the table."}],"q":"Which artefact addresses the technique most directly?","options":[{"id":"a","x":"Chain-of-custody records per shipment plus firmware hash baselines at intake","why":"Correct: it attacks the technique&rsquo;s two preconditions &mdash; unknown custody and unverifiable firmware &mdash; and is checkable at every delivery."},{"id":"b","x":"The supplier&rsquo;s annual SOC 2 report","why":"Near miss: SOC 2 attests the supplier&rsquo;s internal controls over services &mdash; useful hygiene, but it does not verify individual shipments or firmware builds."},{"id":"c","x":"A yearly penetration test of the supplier&rsquo;s web portal","why":"The portal is not the delivery chain; a clean portal says nothing about what is inside the boxes."},{"id":"d","x":"A cyber-insurance certificate covering supply chain events","why":"Insurance transfers cost after the fact; it changes no tampering probability at all."}],"correct":"a","hint":"The technique lives in two specific gaps: who held the box, and what code is on it. Which artefact closes exactly those two?","expl":"<b>Mapping reasoning:</b> T1195.003&rsquo;s preconditions are custody visibility and firmware verifiability; the winning clause makes both contractual and verifiable per shipment. SOC 2, pen tests and insurance are real GRC artefacts &mdash; each defensible for other risks, each beside the point here. <b>Real-world task:</b> this is a GRC analyst&rsquo;s contract-review question, and the wrong options are exactly what vendors offer first.","study":"Pull one hardware contract you own and search for the two clauses: custody, firmware baseline."}]};

'use strict';
/* ================= utilities ================= */
function $(s){return document.querySelector(s);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function fmtTime(s){var m=Math.floor(s/60),ss=s%60;return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;}
function fmt1(x){return (Math.round(x*10)/10).toFixed(1);}

/* ================= state ================= */
var S={
  screen:'intro', pos:0, order:[],
  credit:{}, answered:{}, status:{}, hintUsed:{}, skipped:[],
  secondsLeft:0, timerState:'IDLE', tick:null,
  manualPauseSec:0, feedbackPauseSec:0, ovStart:0, ovAccum:0, fbStart:0,
  reported:false, attempt:1,
  user:{name:'',country:'',locale:'en',topicId:'',batch:null,theme:'dark'}
};
var R=null; /* runtime state of the exercise on screen */

/* ================= scoring (partial credit) ================= */
function scoreExercise(selected,correct){
  var N=correct.length; if(N===0)return 0;
  var H=0,W=0,cs={};
  correct.forEach(function(c){cs[c]=1;});
  selected.forEach(function(x){ if(cs[x])H++; else W++; });
  return Math.max(0,(H-W)/N);
}

/* ================= timer state machine =================
   States: IDLE, RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED */
function tSet(next){
  var prev=S.timerState;
  if(prev==='PAUSED_MANUAL' && next!=='PAUSED_MANUAL'){S.manualPauseSec+=(Date.now()-S.ovStart)/1000;}
  if(prev==='PAUSED_AUTO_CHECK' && next!=='PAUSED_AUTO_CHECK'){S.feedbackPauseSec+=(Date.now()-S.fbStart-S.ovAccum)/1000;S.ovAccum=0;}
  if(next==='PAUSED_MANUAL' && prev!=='PAUSED_MANUAL'){S.ovStart=Date.now();}
  if(next==='PAUSED_AUTO_CHECK' && prev!=='PAUSED_AUTO_CHECK'){S.fbStart=Date.now();}
  S.timerState=next; updateHeader();
}
function startTimer(){
  if(S.tick)clearInterval(S.tick);
  S.tick=setInterval(function(){
    if(S.timerState!=='RUNNING')return;
    S.secondsLeft--;
    if(S.secondsLeft<=0){S.secondsLeft=0;updateHeader();timerEnd();return;}
    updateHeader();
  },1000);
  tSet('RUNNING');
}
function timerEnd(){
  if(S.tick)clearInterval(S.tick);
  tSet('ENDED');
  if(S.screen==='exam'||S.screen==='review'){showResults();}
}

/* ================= flow ================= */
function startExam(){
  document.body.setAttribute('data-sev',sevClass());
  S.pos=0;S.credit={};S.answered={};S.status={};S.hintUsed={};S.skipped=[];
  S.secondsLeft=DATA.timerBudget;S.reported=false;
  S.manualPauseSec=0;S.feedbackPauseSec=0;S.ovAccum=0;
  /* clear per-attempt shuffle caches so retakes reshuffle answers too */
  DATA.exercises.forEach(function(e){
    delete e._shuf;delete e._shufR;delete e._shufB;
    if(e.steps)e.steps.forEach(function(st){delete st._shuf;});
  });
  S.order=shuffle(DATA.exercises.map(function(_,i){return i;}));
  /* keep terminal exercises non-adjacent after shuffle */
  for(var i=1;i<S.order.length-1;i++){
    if(isTerm(S.order[i])&&isTerm(S.order[i-1])){var j=i+1;while(j<S.order.length&&(isTerm(S.order[j])&&isTerm(S.order[j-1])))j++;if(j<S.order.length){var t=S.order[i];S.order[i]=S.order[j];S.order[j]=t;}}
  }
  S.screen='exam';startTimer();renderExercise();
}
function isTerm(i){return DATA.exercises[i].type==='terminal';}
function curEx(){return DATA.exercises[S.order[S.pos]];}
function advanceOrFinish(){
  S.pos++;
  if(S.pos>=S.order.length){ if(S.skipped.length>0){renderReview();if(S.timerState!=='ENDED')tSet('RUNNING');} else {showResults();} return;}
  renderExercise();
}
function showChrome(){var h=$('#hdr');if(h)h.classList.remove('hidden');var p=$('#prog');if(p)p.classList.remove('hidden');}
function hideChrome(){var h=$('#hdr');if(h)h.classList.add('hidden');var p=$('#prog');if(p)p.classList.add('hidden');}
function onCheck(){
  if(!R||R.checked)return;
  var res=collect(R);
  var credit=scoreExercise(res.selected,res.correct);
  if(S.hintUsed[R.ex.id])credit=Math.max(0,credit-0.10);
  R.checked=true;R.credit=credit;R.res=res;
  S.credit[R.ex.id]=credit;S.answered[R.ex.id]=true;
  S.status[R.ex.id]=credit>=0.999?'correct':(credit>0?'partial':'incorrect');
  /* an answered exercise never belongs in the skipped pool, whatever path answered it */
  var k=S.skipped.indexOf(R.ex.id);if(k>-1)S.skipped.splice(k,1);
  tSet('PAUSED_AUTO_CHECK');
  lockWidget();renderFeedback();updateHeader();
}
function onNext(){
  if(!R||!R.checked)return;
  if(R.fromReview){renderReview();tSet('RUNNING');return;}
  advanceOrFinish();
  if(S.screen==='exam'&&S.timerState!=='ENDED')tSet('RUNNING');
}
function onSkip(){
  if(S.screen!=='exam'||!R||R.checked)return;
  S.status[R.ex.id]='skipped';
  if(S.skipped.indexOf(R.ex.id)<0)S.skipped.push(R.ex.id);
  advanceOrFinish();
}
function onHint(){
  if(S.screen!=='exam'||!R||R.checked||S.hintUsed[R.ex.id])return;
  S.hintUsed[R.ex.id]=true;
  var hb=$('#hintpanel');if(hb)hb.classList.remove('hidden');
  var b=$('#hintbtn');if(b)b.disabled=true;
}
function onPauseToggle(){
  if(S.screen!=='exam'&&S.screen!=='review')return;
  var ov=$('#pauseov');
  if(ov){ov.remove();if(R&&R._pausedOnAuto){R._pausedOnAuto=false;tSet('PAUSED_AUTO_CHECK');}else{tSet('RUNNING');}return;}
  var keep=R?R.stateName:null;
  if(R&&R.checked&&S.timerState==='PAUSED_AUTO_CHECK'){R._pausedOnAuto=true;}
  var o=el('div','paused-overlay');
  o.id='pauseov';
  o.innerHTML='<div class="p1">&#9208; PAUSED &mdash; manual (press Resume)</div>'+
    '<div class="p2">The exercise is hidden while you take a break. The timer is stopped.</div>';
  var b=el('button','btn primary','&#9654; Resume');
  b.addEventListener('click',function(){o.remove();if(R&&R._pausedOnAuto&&S.timerState==='PAUSED_MANUAL'){R._pausedOnAuto=false;tSet('PAUSED_AUTO_CHECK');}else{tSet('RUNNING');}});
  o.appendChild(b);
  document.body.appendChild(o);
  tSet('PAUSED_MANUAL');
}

/* ================= site report ================= */
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:DATA.meta.topicId,
      batch:DATA.meta.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=DATA.meta.passMark
    },location.origin);
  }catch(e){/* opened directly; nothing to report to */}
}

window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  S.user.name=event.data.username||'';
  S.user.country=event.data.country||'';

});

function sevClass(){return {EASY:'easy',MEDIUM:'medium',HARD:'hard','EXTREMELY HARD':'extreme'}[DATA.severity];}
function scoreSummary(){
  var sum=0,n=0;

  var pct=n>0?Math.round((sum/n)*100):0;
  return {sum:sum,n:n,pct:pct};
}
function answeredOrSkipped(){var c=0;DATA.exercises.forEach(function(e){if(S.answered[e.id]||S.status[e.id]==='skipped')c++;});return c;}

function toggleScen(){

  else{b.classList.add('hidden');}

function optRow(o,letter){
  return '<button class="opt" data-oid="'+o.id+'" onclick="pickOpt(\''+o.id+'\')" aria-pressed="false">'+
    '<span class="olid">'+letter+'.</span><span>'+o.x+'</span><span class="selmark">&#10003; selected</span></button>';
}
function lettersOf(n){var L='ABCDEFGHIJ';return L[n]||String(n+1);}

/* ---------- mcq / multi ---------- */
function buildMCQ(ex){
  var opts=ex._shuf||(ex._shuf=shuffle(ex.options));
  var html=opts.map(function(o,i){return optRow(o,lettersOf(i));}).join('');
  if(ex.type==='multi')html='<p class="smallnote">Select all options that apply. Wrong selections subtract.</p>'+html;
  $('#answ').innerHTML=html;
  R.sel=(ex.type==='multi')?{}:null;
}
/* ---------- categorize (drag & drop) ---------- */
function buildCategorize(ex){
  var items=ex._shuf||(ex._shuf=shuffle(ex.items));
  R.place={};R.picked=null;
  var bank='<div class="bank" id="bank" ondragover="ddOver(event)" ondrop="ddDrop(event,\'__bank\')">'+
    '<div class="slot-title">ITEMS TO PLACE <span class="drag-tag">drag &middot; or tap item then tap a slot</span></div><div id="banklist"></div></div>';
  var slots='<div class="slots">'+ex.slots.map(function(s){
    return '<div class="slot" id="slot-'+s.id+'" data-sid="'+s.id+'" tabindex="0" role="button" '+
      'ondragover="ddOver(event)" ondragleave="ddLeave(event)" ondrop="ddDrop(event,\''+s.id+'\')" '+
      'onclick="slotClick(\''+s.id+'\')" onkeydown="slotKey(event,\''+s.id+'\')">'+
      '<div class="slot-title">'+esc(s.label)+'</div><div class="inbank" id="slotlist-'+s.id+'"></div></div>';
  }).join('')+'</div>';
  $('#answ').innerHTML='<div class="ddwrap">'+bank+slots+'</div>';
  drawDD();
}
function drawDD(){
  var ex=R.ex;
  var bankItems=ex._shuf.filter(function(it){return !R.place[it.id];});
  $('#banklist').innerHTML=bankItems.map(function(it){
    return '<button class="bankitem'+(R.picked===it.id?' picked':'')+'" data-iid="'+it.id+'" draggable="true" ondragstart="ddStart(event,\''+it.id+'\')" onclick="itemClick(\''+it.id+'\')">'+(R.picked===it.id?'&#10003; ':'')+esc(it.x)+'</button>';
  }).join('')||'<span class="smallnote">All items placed.</span>';
  ex.slots.forEach(function(s){
    var inv=Object.keys(R.place).filter(function(iid){return R.place[iid]===s.id;});
    $('#slotlist-'+s.id).innerHTML=inv.map(function(iid){
      var it=ex.items.filter(function(x){return x.id===iid;})[0];
      return '<button class="bankitem" data-iid="'+iid+'" draggable="true" ondragstart="ddStart(event,\''+iid+'\')" onclick="itemClick(\''+iid+'\')" title="Click to return to the bank">&#128465; '+esc(it.x)+'</button>';
    }).join('');
  });
}
function itemClick(iid){
  if(!R||R.checked)return;
  if(R.place[iid]){delete R.place[iid];R.picked=null;drawDD();return;}
  R.picked=(R.picked===iid)?null:iid;drawDD();
}
function slotClick(sid){
  if(!R||R.checked)return;
  if(R.picked){
    var ex=R.ex,cur=Object.keys(R.place).filter(function(i){return R.place[i]===sid;})[0];
    if(cur)delete R.place[cur];
    R.place[R.picked]=sid;R.picked=null;drawDD();
  }
}
function slotKey(ev,sid){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();slotClick(sid);}}
function ddStart(ev,iid){ev.dataTransfer.setData('text/plain',iid);}
function ddOver(ev){if(R&&R.checked)return;ev.preventDefault();ev.currentTarget.classList.add('over');}
function ddLeave(ev){ev.currentTarget.classList.remove('over');}
function ddDrop(ev,where){
  if(!R||R.checked)return;
  ev.preventDefault();ev.currentTarget.classList.remove('over');
  var iid=ev.dataTransfer.getData('text/plain');if(!iid)return;
  if(where==='__bank'){delete R.place[iid];}
  else{var ex=R.ex,cur=Object.keys(R.place).filter(function(i){return R.place[i]===where;})[0];if(cur)delete R.place[cur];R.place[iid]=where;}
  R.picked=null;drawDD();
}
/* ---------- match ---------- */
function buildMatch(ex){
  var rights=ex._shufR||(ex._shufR=shuffle(ex.rights));
  R.pair={};R.pickedLeft=null;
  var L='<div><div class="slot-title">LEFT COLUMN &mdash; tap one</div>'+ex.lefts.map(function(l){
    return '<button class="pairopt" id="pl-'+l.id+'" onclick="pickLeft(\''+l.id+'\')">'+esc(l.x)+'</button>';
  }).join('')+'</div>';
  var Rt='<div><div class="slot-title">RIGHT COLUMN &mdash; then tap its match</div>'+rights.map(function(r){
    return '<button class="pairopt" id="pr-'+r.id+'" onclick="pickRight(\''+r.id+'\')">'+esc(r.x)+'</button>';
  }).join('')+'</div>';
  $('#answ').innerHTML='<div class="pairwrap">'+L+Rt+'</div><div id="pairchips"></div>';
  drawPairs();
}
function pickLeft(id){if(!R||R.checked)return;R.pickedLeft=(R.pickedLeft===id)?null:id;drawPairs();}
function pickRight(id){
  if(!R||R.checked)return;
  if(!R.pickedLeft)return;
  /* several lefts may legitimately map to the same right (many-to-one matching):
     reassigning pickedLeft's pair only, never stealing other lefts' pairs */
  R.pair[R.pickedLeft]=id;R.pickedLeft=null;drawPairs();
}
function unpair(l){if(!R||R.checked)return;delete R.pair[l];drawPairs();}
function drawPairs(){
  var ex=R.ex;
  ex.lefts.forEach(function(l){var p=$('#pl-'+l.id);if(p)p.classList.toggle('picked',R.pickedLeft===l.id);});
  ex.rights.forEach(function(r){var p=$('#pr-'+r.id);if(p)p.classList.remove('picked');});
  $('#pairchips').innerHTML=ex.lefts.filter(function(l){return R.pair[l.id];}).map(function(l){
    var r=ex.rights.filter(function(x){return x.id===R.pair[l.id];})[0];
    return '<div class="pairchip">&#128279; <b>'+esc(l.x)+'</b> &#8594; '+esc(r.x)+
      '<button class="x" onclick="unpair(\''+l.id+'\')" aria-label="Remove pair">&#10007;</button></div>';
  }).join('')||'<div class="smallnote">No pairs yet.</div>';
}
/* ---------- order / rank ---------- */
function buildOrder(ex){
  R.seq=ex._shuf||(ex._shuf=shuffle(ex.items.map(function(i){return i.id;})));
  drawOrder();
}
function drawOrder(){
  var ex=R.ex;
  $('#answ').innerHTML='<div class="ordlist">'+R.seq.map(function(id,i){
    var it=ex.items.filter(function(x){return x.id===id;})[0];
    return '<div class="orditem" draggable="true" ondragstart="ordStart(event,'+i+')" data-i="'+i+'">'+
      '<span class="pos">'+(i+1)+'.</span><span>'+esc(it.x)+'</span>'+
      '<span class="updown"><button onclick="ordMove('+i+',-1)" aria-label="Move up">&#9650;</button>'+
      '<button onclick="ordMove('+i+',1)" aria-label="Move down">&#9660;</button></span></div>';
  }).join('')+'</div><p class="smallnote">Drag rows or use the arrows. Position 1 = first / most important.</p>';
}
function ordMove(i,d){
  if(!R||R.checked)return;
  var j=i+d;if(j<0||j>=R.seq.length)return;
  var t=R.seq[i];R.seq[i]=R.seq[j];R.seq[j]=t;drawOrder();
}
function ordStart(ev,i){ev.dataTransfer.setData('text/plain',String(i));R._dragI=i;
  var n=ev.currentTarget;n.classList.add('dragging');}
document.addEventListener('dragend',function(ev){if(ev.currentTarget&&ev.currentTarget.classList)ev.currentTarget.classList.remove('dragging');});
document.addEventListener('dragover',function(ev){
  if(!R||R.checked||R._dragI===undefined)return;
  var t=ev.target.closest?ev.target.closest('.orditem'):null;if(!t)return;
  ev.preventDefault();
  var j=parseInt(t.getAttribute('data-i'),10);
  if(j===R._dragI)return;
  var seq=R.seq,id=R.seq[R._dragI];
  seq.splice(R._dragI,1);seq.splice(j,0,id);
  R._dragI=j;drawOrder();
});
/* ---------- fill ---------- */
function buildFill(ex){
  R.blank={};R.selBlank=null;
  var line=ex.parts.map(function(p){
    if(p.t==='x')return '<span>'+p.x+'</span>';
    return ' <button class="blank" id="bl-'+p.id+'" data-bid="'+p.id+'" onclick="blankClick(\''+p.id+'\')">&#8230;</button> ';
  }).join('');
  var bank=ex._shufB||(ex._shufB=shuffle(ex.bank));
  $('#answ').innerHTML='<div class="fillline">'+line+'</div>'+
    '<div class="bankrow">'+bank.map(function(t){return '<button class="chip" id="ch-'+b32(t)+'" onclick="chipClick(\''+esc(t)+'\')">'+esc(t)+'</button>';}).join('')+'</div>'+
    '<p class="smallnote">Tap a word, then tap a blank. Tap a filled blank to empty it again.</p>';
}
function b32(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))&0xfffff;}return h.toString(32);}
function blankClick(bid){
  if(!R||R.checked)return;
  if(R.blank[bid]){delete R.blank[bid];drawBlanks();return;}
  R.selBlank=bid;
  document.querySelectorAll('.blank').forEach(function(b){b.classList.toggle('picked',b.getAttribute('data-bid')===bid);});
}
function chipClick(tok){
  if(!R||R.checked)return;
  var ex=R.ex;
  var bid=R.selBlank||Object.keys(ex.answers).filter(function(k){return !R.blank[k];})[0];
  if(!bid)return;
  R.blank[bid]=tok;R.selBlank=null;drawBlanks();
}
function drawBlanks(){
  var ex=R.ex;
  Object.keys(ex.answers).forEach(function(bid){
    var b=$('#bl-'+bid);if(!b)return;
    var v=R.blank[bid];
    b.innerHTML=v?esc(v):'&#8230;';
    b.classList.toggle('filled',!!v);
    b.classList.toggle('picked',R.selBlank===bid);
  });
  ex.bank.forEach(function(t){
    var c=$('#ch-'+b32(t));if(!c)return;
    var used=Object.keys(R.blank).some(function(k){return R.blank[k]===t;});
    c.classList.toggle('used',used);
  });
}
/* ---------- terminal ---------- */
function buildTerminal(ex){
  R.lines=[];R.lastCmd='';
  var syn='';
  if(ex.syntax){
    syn='<div class="synpanel"><h5>SYNTAX REMINDER</h5><div class="mono">'+ex.syntax.shape+'</div>'+
      '<ul class="rules" style="margin:8px 0 4px">'+ex.syntax.notes.map(function(n){return '<li>'+n+'</li>';}).join('')+'</ul>'+
      '<p class="smallnote">Example on a different file: <span class="mono" style="padding:2px 6px">'+ex.syntax.example+'</span></p>'+
      '<p class="smallnote">Expected output shape: <span class="mono" style="padding:2px 6px">'+ex.syntax.outshape+'</span></p></div>';
  }
  $('#answ').innerHTML=syn+
    '<div class="term"><div class="term-scroll" id="tscroll"></div>'+
    '<div class="term-inrow"><span class="pr">analyst@lab:~$</span>'+
    '<input class="term-input" id="tin" autocomplete="off" spellcheck="false" placeholder="type a command and press Enter" aria-label="terminal input"></div></div>'+
    '<p class="smallnote">Type the command, press Enter, then press Check. Nothing real is executed &mdash; this is a simulation.</p>';
  $('#tin').addEventListener('keydown',function(ev){
    if(ev.key==='Enter'){var v=this.value;this.value='';runCmd(v);}
  });
  termOut('<span class="dm">simulation shell &mdash; only the commands relevant to this exercise are available</span>');
}
function normCmd(c){return c.trim().replace(/\s+/g,' ').toLowerCase();}
function runCmd(raw){
  var ex=R.ex,c=normCmd(raw);
  R.lines.push({in:raw});
  if(c===''){drawTerm();return;}
  R.lastCmd=raw;
  var out=null;
  if(ex.outputs){ex.outputs.forEach(function(o){if(out===null&&new RegExp(o.m).test(c))out=o.x;});}
  if(out===null){
    if(/^(clear|cls)$/.test(c)){R.lines=[];drawTerm();return;}
    var bin=c.split(' ')[0];
    out='sh: command not found: '+bin+'  <span class="dm">(this simulation only knows the commands needed here)</span>';
  }
  R.lines.push({out:out});
  drawTerm();
}
function termOut(html){R.lines.push({out:html});drawTerm();}
function drawTerm(){
  var t=$('#tscroll');if(!t)return;
  t.innerHTML=R.lines.map(function(l){
    if(l.in!==undefined)return '<div class="term-line"><span class="pr">analyst@lab:~$</span> <span class="in">'+esc(l.in)+'</span></div>';
    return '<div class="term-line"><span class="out">'+l.out+'</span></div>';
  }).join('')+'\n';
  t.scrollTop=t.scrollHeight;
}
/* ---------- logsel ---------- */
function buildLogsel(ex){
  R.sel={};
  var filt=ex.filter?'<input class="logfilter" id="logf" placeholder="filter lines (text match)..." aria-label="filter log lines">':'';
  $('#answ').innerHTML=filt+'<div class="logbox" id="logbox"></div>'+
    '<p class="smallnote">Click a line to select it. Click again to deselect.'+(ex.filter?' The filter box only narrows the view &mdash; it does not change your selection.':'')+'</p>';
  drawLog();
  if(ex.filter){$('#logf').addEventListener('input',function(){drawLog(this.value);});}
}
function drawLog(f){
  var ex=R.ex;
  f=(f||'').toLowerCase();
  $('#logbox').innerHTML=ex.lines.map(function(l){
    var show=!f||l.x.toLowerCase().indexOf(f)>-1;
    return '<div class="logline'+(R.sel[l.id]?' sel':'')+(show?'':' off')+'" data-lid="'+l.id+'" role="checkbox" aria-checked="'+(!!R.sel[l.id])+'" tabindex="0" onclick="lineSel(\''+l.id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();lineSel(\''+l.id+'\');}">'+
      '<span class="lnum">'+l.id+'</span><span class="selmark" style="display:'+(R.sel[l.id]?'inline':'none')+'">&#10003;</span><span class="mono" style="background:none;border:none;padding:0;white-space:pre-wrap">'+esc(l.x)+'</span></div>';
  }).join('');
}
function lineSel(id){
  if(!R||R.checked)return;
  if(R.sel[id]){delete R.sel[id];}else{R.sel[id]=1;}
  var n=document.querySelector('.logline[data-lid="'+id+'"]');
  if(n){n.classList.toggle('sel',!!R.sel[id]);n.setAttribute('aria-checked',!!R.sel[id]);
    var m=n.querySelector('.selmark');if(m)m.style.display=R.sel[id]?'inline':'none';}
}
/* ---------- sim (multi-step) ---------- */
function buildSim(ex){
  R.stepIdx=0;R.choices={};R.log=[];
  drawStep();
}
function drawStep(){
  var ex=R.ex,st=ex.steps[R.stepIdx];
  $('#scenbody').innerHTML=ex.scen.map(artefactHtml).join('')+
    (R.log.length?'<div class="caselog">'+R.log.map(function(l){return '<div class="cl">'+l+'</div>';}).join('')+'</div>':'');
  var qblock=document.querySelector('.block.amb .bc');
  qblock.innerHTML='<span class="steps-tag">STEP '+(R.stepIdx+1)+' OF '+ex.steps.length+'</span><br><b>'+st.q+'</b>';
  var opts=st._shuf||(st._shuf=shuffle(st.options));
  $('#answ').innerHTML=opts.map(function(o,i){return optRow(o,lettersOf(i));}).join('');
  document.querySelector('#actrow .smallnote').textContent='Intermediate steps do not stop the timer. The timer pauses only on the final Check.';
  var cb=$('#checkbtn');cb.disabled=true;cb.title='Available on the final step';
  document.getElementById('scenh').querySelector('.sub').textContent=ex.summary;
  window.scrollTo(0,0);
}
function pickSim(id){
  if(!R||R.checked)return;
  R._curChoice=id;
  document.querySelectorAll('#answ .opt').forEach(function(n){
    var on=n.getAttribute('data-oid')===id;
    n.classList.toggle('sel',on);n.setAttribute('aria-pressed',on?'true':'false');
  });
  var cb=$('#checkbtn');
  if(R.stepIdx===R.ex.steps.length-1){cb.disabled=false;cb.innerHTML='&#10003; Check final answers';cb.title='';}
  else{cb.disabled=false;cb.innerHTML='&#10145; Confirm &amp; continue';cb.title='';}
}
function simConfirm(){
  var ex=R.ex,st=ex.steps[R.stepIdx];
  var opt=st.options.filter(function(o){return o.id===R._curChoice;})[0];
  if(!opt)return;
  R.choices[st.id]=R._curChoice;
  R.log.push('<b>Step '+(R.stepIdx+1)+':</b> '+opt.outcome);
  if(R.stepIdx<ex.steps.length-1){
    R.stepIdx++;drawStep();
    var cb=$('#checkbtn');cb.innerHTML='&#10003; Check';cb.disabled=true;
  }else{
    onCheck();
  }
}
function pickOpt(id){
  if(!R||R.checked)return;
  if(R.ex.type==='sim'){pickSim(id);return;}
  var ex=R.ex;
  if(ex.type==='mcq'){
    R.sel=id;
    document.querySelectorAll('#answ .opt').forEach(function(n){
      var on=n.getAttribute('data-oid')===id;
      n.classList.toggle('sel',on);n.setAttribute('aria-pressed',on?'true':'false');
    });
  }else{
    if(R.sel[id]){delete R.sel[id];}else{R.sel[id]=1;}
    document.querySelectorAll('#answ .opt').forEach(function(n){
      var on=!!R.sel[n.getAttribute('data-oid')];
      n.classList.toggle('sel',on);n.setAttribute('aria-pressed',on?'true':'false');
    });
  }
}

/* ================= widget builder ================= */
function buildWidget(ex){
  if(ex.type==='mcq'||ex.type==='multi')buildMCQ(ex);
  else if(ex.type==='categorize')buildCategorize(ex);
  else if(ex.type==='match')buildMatch(ex);
  else if(ex.type==='order')buildOrder(ex);
  else if(ex.type==='fill')buildFill(ex);
  else if(ex.type==='terminal')buildTerminal(ex);
  else if(ex.type==='logsel')buildLogsel(ex);
  else if(ex.type==='sim'){buildSim(ex);document.getElementById('checkbtn').onclick=function(){if(R&&!R.checked)simConfirm();};}
}

/* ================= collectors ================= */
function collect(R){
  var ex=R.ex,res={selected:[],correct:[],items:[]};
  if(ex.type==='mcq'){
    res.selected=R.sel?[R.sel]:[];
    res.correct=[ex.correct];
    var co=ex.options.filter(function(o){return o.id===ex.correct;})[0];
    if(R.sel===ex.correct){res.items.push({name:'Answer',state:'ok',note:co.why});}
    else{
      var wo=R.sel?ex.options.filter(function(o){return o.id===R.sel;})[0]:null;
      if(wo)res.items.push({name:'Your pick',state:'wrong',note:wo.why});
      res.items.push({name:'Correct',state:'missed',note:co.why});
    }
  }else if(ex.type==='multi'){
    res.selected=Object.keys(R.sel);
    res.correct=ex.correct;
    ex.options.forEach(function(o){
      var isC=ex.correct.indexOf(o.id)>-1,isS=!!R.sel[o.id];
      if(isC&&isS)res.items.push({name:o.id.toUpperCase(),state:'ok',note:o.why});
      else if(isC&&!isS)res.items.push({name:o.id.toUpperCase(),state:'missed',note:o.why});
      else if(!isC&&isS)res.items.push({name:o.id.toUpperCase(),state:'wrong',note:o.why});
    });
  }else if(ex.type==='categorize'){
    ex.slots.forEach(function(s){
      var iid=Object.keys(R.place).filter(function(i){return R.place[i]===s.id;})[0];
      var good=Object.keys(ex.correct).filter(function(i){return ex.correct[i]===s.id;})[0];
      if(!iid){res.items.push({name:s.label,state:'missed',note:s.why});}
      else if(iid===good){
        res.items.push({name:s.label,state:'ok',note:s.why});
        res.selected.push(s.id+'='+iid);res.correct.push(s.id+'='+good);
      }else{
        res.items.push({name:s.label,state:'wrong',note:s.why+' The item you placed there belongs elsewhere.'});
        res.selected.push(s.id+'='+iid);
      }
      if(good)res.correct.push(s.id+'='+good);
    });
    res.correct=ex.slots.map(function(s){var g=Object.keys(ex.correct).filter(function(i){return ex.correct[i]===s.id;})[0];return g?s.id+'='+g:null;}).filter(Boolean);
    res.selected=ex.slots.map(function(s){var iid=Object.keys(R.place).filter(function(i){return R.place[i]===s.id;})[0];return iid?s.id+'='+iid:null;}).filter(Boolean);
  }else if(ex.type==='match'){
    ex.lefts.forEach(function(l){
      var p=R.pair[l.id];
      var corr=ex.correct[l.id];
      if(!p){res.items.push({name:l.short,state:'missed',note:ex.why[l.id]});}
      else{
        res.selected.push(l.id+'='+p);
        if(p===corr){res.items.push({name:l.short,state:'ok',note:ex.why[l.id]});}
        else{res.items.push({name:l.short,state:'wrong',note:ex.why[l.id]});}
      }
      res.correct.push(l.id+'='+corr);
    });
  }else if(ex.type==='order'){
    ex.correctOrder.forEach(function(id,i){
      var placed=R.seq[i];
      res.selected.push(i+'='+placed);res.correct.push(i+'='+id);
      if(placed===id)res.items.push({name:'Position '+(i+1),state:'ok',note:ex.why[id]});
      else res.items.push({name:'Position '+(i+1),state:'wrong',note:ex.why[id]});
    });
  }else if(ex.type==='fill'){
    Object.keys(ex.answers).forEach(function(bid){
      var raw=R.blank[bid]||'';
      var v=raw.trim().toLowerCase();
      var a=ex.answers[bid].trim().toLowerCase();
      res.correct.push(bid+'='+a);
      var nm='Blank: '+(ex.blankNames&&ex.blankNames[bid]||bid);
      if(raw.trim()!==''){
        res.selected.push(bid+'='+v);
        res.items.push({name:nm,state:v===a?'ok':'wrong',note:ex.why[bid]});
      }else{
        /* an untouched blank was never answered: it is missed, never wrong */
        res.items.push({name:nm,state:'missed',note:ex.why[bid]});
      }
    });
  }else if(ex.type==='terminal'){
    var c=normCmd(R.lastCmd||'');
    var toks=c?c.split(' '):[];
    function tokTest(rx){var re=new RegExp(rx);return toks.some(function(t){return re.test(t);});}
    function fullTest(rx){var re=new RegExp(rx);return re.test(c);}
    var danger=(ex.dangerous||[]).some(function(d){return new RegExp(d).test(c);});
    R._danger=danger;
    ex.parts.forEach(function(p,i){
      var test=(p.mode==='full')?fullTest:tokTest;
      var ok=c&&test(p.ok)&&!(p.bad&&test(p.bad));
      var bad=c&&p.bad&&test(p.bad);
      if(ok){res.selected.push('e'+i);res.items.push({name:p.name,state:'ok',note:p.why});}
      else if(bad){res.selected.push('w'+i);res.items.push({name:p.name,state:'wrong',note:p.why+' What you typed fails this part.'});}
      else{res.items.push({name:p.name,state:'missed',note:p.why});}
      res.correct.push('e'+i);
    });
    if(!c){res.items=res.items.map(function(it){return {name:it.name,state:'missed',note:it.note};});}
  }else if(ex.type==='logsel'){
    res.selected=Object.keys(R.sel);res.correct=ex.correct;
    ex.lines.forEach(function(l){
      if(ex.correct.indexOf(l.id)>-1){
        var st=R.sel[l.id]?'ok':'missed';
        res.items.push({name:'Line '+l.id,state:st,note:ex.why[l.id]});
      }else if(R.sel[l.id]){
        res.items.push({name:'Line '+l.id,state:'wrong',note:ex.why[l.id]});
      }
    });
  }else if(ex.type==='sim'){
    ex.steps.forEach(function(st){
      var ch=R.choices[st.id];
      var corr=st.options.filter(function(o){return o.correct;})[0];
      res.correct.push(st.id+'='+corr.id);
      if(!ch){res.items.push({name:st.label,state:'missed',note:corr.why});}
      else{
        res.selected.push(st.id+'='+ch);
        var o=st.options.filter(function(x){return x.id===ch;})[0];
        res.items.push({name:st.label,state:ch===corr.id?'ok':'wrong',note:ch===corr.id?o.why:(corr.why+' '+o.why)});
      }
    });
  }
  return res;
}

/* ================= lock & feedback ================= */
function lockWidget(){
  var a=$('#answ');if(a)a.classList.add('locked');
  a.querySelectorAll('button,input').forEach(function(n){n.disabled=true;});
  var cb=$('#checkbtn');if(cb){cb.disabled=true;}
}
function renderFeedback(){
  var ex=R.ex,res=R.res,credit=R.credit;
  var label,state,cls;
  if(credit>=0.999){label='&#10003; CORRECT';state='Correct';cls='correct';}
  else if(credit>0){label='&#10003; PARTIALLY CORRECT';state='Partially correct';cls='partial';}
  else{label='&#10007; INCORRECT';state='Incorrect';cls='incorrect';}
  var multi=ex.type!=='mcq';
  var html='<div class="fb '+cls+'" role="status">'+
    '<div class="fb-title '+cls+'">'+label+
    '<span class="fb-credit">credit '+credit.toFixed(2)+(multi?' &middot; '+Math.round(credit*res.correct.length)+'/'+res.correct.length+' items':'')+'</span></div>';
  if(R._danger)html+='<div class="fb-title incorrect" style="margin-top:8px;font-size:14px">&#10007; DANGEROUS &mdash; NEAR MISS: this command would have destroyed or altered evidence. Always preserve before you clean.</div>';
  if(multi){
    html+=res.items.map(function(it){
      var ic=it.state==='ok'?'&#10003;':(it.state==='wrong'?'&#10007;':'&#9675;');
      var st=it.state==='ok'?'Correct':(it.state==='wrong'?'Wrong':'Missed');
      return '<div class="fb-item '+it.state+'"><span class="ic">'+ic+'</span><span class="nm">'+esc(it.name)+' &mdash; '+st+'</span><span class="nt">'+it.note+'</span></div>';
    }).join('');
  }else{
    var co=ex.options.filter(function(o){return o.id===ex.correct;})[0];
    html+='<div class="fb-item ok"><span class="ic">&#10003;</span><span class="nm">Correct answer</span><span class="nt">'+co.x+'</span></div>';
  }
  if(ex.type==='terminal'){
    html+='<div style="margin-top:10px"><div class="arte-label" style="border-radius:6px 6px 0 0">CANONICAL COMMAND</div><div class="mono">'+esc(ex.canonical)+'</div></div>';
    html+='<p class="smallnote" style="margin-top:6px">'+ex.canonWhy+'</p>';
  }
  html+='<div class="fb-exp"><b>Why:</b> '+ex.expl+'</div>';
  if(credit<0.999)html+='<div class="fb-study"><b>What to study:</b> '+ex.study+'</div>';
  html+='</div>';
  var last=(S.pos>=S.order.length-1);
  var nextLbl=R.fromReview?'&#8617; Return to skipped list':(last?'&#10003; Final Submit':'Next &#10145;');
  html+='<div class="startrow"><button class="btn primary" onclick="onNext()">'+nextLbl+'</button></div>';
  $('#fbzone').innerHTML=html;
  var ab=$('#actrow');if(ab)ab.classList.add('hidden');
}

renderIntro();
</script>
