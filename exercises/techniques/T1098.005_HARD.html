var META = {"topicId":"t1098.005","batch":3,"title":"T1098.005 Device Registration — HARD","difficulty":"hard","questionCount":15,"estimatedMinutes":45,"passMark":70,"sevName":"HARD","page_title":"T1098.005 — HARD practice exam"};
var INTRO = {"title":"T1098.005 — HARD practice exam","object":"ATT&CK object: T1098.005 — Account Manipulation: Device Registration (a Sub-Technique)","partLabel":"","learn":["This is the <b>HARD</b> level for <b>T1098.005 — Account Manipulation: Device Registration</b> (a Sub-Technique of T1098). By now you know the story: an attacker adds their own device to an MFA system (Duo, Okta) or to <b>Microsoft Entra ID</b> / <b>Microsoft Intune</b>, and the device starts to look trusted. Hard means the answers now <b>look almost identical</b> — you will need reasons, not vibes.","Expect <b>near-miss answers</b>: a command that only <i>reads</i> state instead of changing it, an audit event that <i>touches</i> a device instead of creating one, a sign-in that is device-trusted but perfectly normal. At least one option in every exercise is technically defensible in another context — your job is to say why it fails <i>here</i>. You will also meet real procedures: APT29 registering devices during the SolarWinds compromise, and Scattered Spider enrolling MFA devices to persist through VPN.","The work scenarios match the harder end of real jobs: an <b>incident responder</b> choosing containment with the least collateral damage, a <b>detection engineer</b> catching faked compliance states, a <b>SOC lead</b> ranking containment options, and a <b>threat intelligence analyst</b> reading procedure examples correctly. Everything is drawn from the ATT&amp;CK page for T1098.005: its detection strategy <b>DET0036</b>, its mitigation <b>M1032</b>, and its real-world examples.","The tactic frame stays <b>Persistence</b> (and Privilege Escalation), the platforms stay <b>Identity Provider, Windows</b>, and the danger stays: bypassing MFA and conditional access, keeping a durable foothold, and even <b>internal spearphishing</b> from a device your own rules trust."],"keywords":[{"theme":"Detection & evasion detail","items":["DET0036 / AN0103 / AN0104","faked device compliance states","device-based Conditional Access bypass","PRT (Primary Refresh Token) value"]},{"theme":"Device states in conflict","items":["registered vs joined vs enrolled","compliance source of truth","unmanaged MDM updates","service principal enrollments"]},{"theme":"Host & cloud telemetry","items":["dsregcmd with enrollment flags vs /status","parent-process context","'Register device' audit event","'Add registered owner' pattern"]},{"theme":"Containment & trade-offs","items":["disable device object","revoke sessions vs reset password","delete device object costs","least-aggressive response"]},{"theme":"Real-world procedures","items":["APT29 (G0016) — dormant-account MFA enrollment","SolarWinds C0024 — Set-CASMailbox syncing","Scattered Spider — C0027 MFA devices through VPN","AADInternals (S0677) tooling"]}],"how":["<b>Pass mark: 70%</b> over the exercises you answered; skipped-and-never-answered exercises are excluded from both sides of the fraction.","<b>15 exercises, two-to-three interacting concepts each.</b> Types: log viewers with evidence clicking, near-miss single and multi-select questions, matching, drag &amp; drop, a triage queue with conflicting context, an IR decision tree with branching steps, a report-drafting fill-in, priority ranking, and <b>one terminal</b> where you choose the right dsregcmd mode yourself.","<b>Timer:</b> 45 minutes. <b>⏸ Pause</b> hides the exercise for a real break; <b>✓ Check</b> stops the timer automatically so you can study the feedback without pressure ('⏸ PAUSED — reviewing feedback', resumes on Next).","<b>Partial credit:</b> multi-item exercises score every item: credit = max(0, (H − W) ÷ N). Wrong items subtract — near-misses are designed to be tempting, so commit only to what you can defend.","<b>Hints:</b> one per exercise, −10% of that exercise's credit. A HARD hint removes one wrong path; it never names the answer.","<b>Skip and review:</b> skipped exercises wait in a review pool until the timer ends; you can return to them as often as you like before submitting."]};
var EXERCISES = [{"type":"logview","summary":"Pick the three EDR lines that evidence an enrollment execution","short":"EDR chain vs maintenance noise","scenario":"An EDR process timeline from host FIN-WS-07 (16 lines trimmed to 7) spans 20 minutes. Your lead wants proof that <b>T1098.005 execution telemetry</b> exists on this host. Three lines carry it. The rest are maintenance or unrelated.","question":"Click the three lines that evidence a device-enrollment execution chain.","lines":[{"id":"p1","text":"14:02:11 proc  winword.exe → powershell.exe -enc SQBFAFgA...  user=r.vance","related":false,"why":"An encoded PowerShell drop from Word is a real concern — but it is loader behaviour, not device enrollment."},{"id":"p2","text":"14:05:40 proc  powershell.exe → dsregcmd.exe /register  user=r.vance  parent-chain: winword","related":true,"why":"dsregcmd with the /register flag, spawned from the suspicious chain — the enrollment execution itself."},{"id":"p3","text":"14:06:02 reg  CloudAP device state written  key=deviceRegistration  host=FIN-WS-07","related":true,"why":"The registration state was written on the host — the endpoint-side confirmation of enrollment."},{"id":"p4","text":"14:09:55 proc  IntuneManagementExtension.exe -enroll  user=SYSTEM  sign=Microsoft-signed","related":false,"why":"The signed Intune pipeline enrolling a managed machine is the legitimate flow — near-miss with the same goal."},{"id":"p5","text":"14:12:18 proc  dsregcmd.exe /status  parent=cmd.exe (IT support session)  user=r.vance","related":false,"why":"Reading status changes nothing — the classic /status vs /register near-miss."},{"id":"p6","text":"14:15:30 net  tls  FIN-WS-07 → login.microsoftonline[.]com:443  process=dsregcmd.exe","related":true,"why":"The enrollment process talking to the identity endpoint — the network leg of the same chain."},{"id":"p7","text":"14:19:44 proc  chrome.exe → outlook.office[.]com  user=r.vance","related":false,"why":"A user browsing webmail — noise."}],"hint":"Enrollment proof = the tool WITH an enrollment flag, the state it writes, and its network leg. A signed management agent is not the attacker.","explain":"<p>The chain is P2 → P3 → P6: <code class=\"inline\">dsregcmd /register</code> spawned from a suspicious Office-parent chain, the local registration state being written, and the same process reaching the identity endpoint. P4 is the <b>legitimate</b> enrollment pipeline (signed Intune agent) — same goal, trusted actor, so it is not attacker evidence. P5 only reads state. If you picked P4 or P5, you matched keywords instead of actors: in HARD, the tool alone is never the answer — the <b>context</b> is.</p>","study":"dsregcmd execution telemetry and parent-process context."},{"type":"qcm","summary":"How does the registered device defeat a 'compliant device' rule — or does it?","short":"Device rule vs registered device","scenario":"Your conditional access policy says: access to mail requires a <b>compliant device</b>. Last night a device was registered for p.novak, and this morning mail was read from it. The device shows compliance state 'compliant', but the compliance source is a management tenant nobody in IT recognises.","question":"Which statement is the correct reading of how the rule was defeated?","options":[{"id":"a","label":"Registration alone never beats a compliant-device rule — the compliance state was faked via the rogue MDM enrollment"},{"id":"b","label":"Any registered device automatically counts as compliant, so the rule was defeated by registration itself"},{"id":"c","label":"Compliance states cannot be set by a management tenant — the sign-in log must be wrong"},{"id":"d","label":"The rule was defeated because the user's password was reset"}],"correct":["a"],"itemWhy":{"b":"Registration creates trust and can carry a PRT — but 'compliant' must come from a management source. That is exactly what the attacker faked.","c":"Compliance is reported by the MDM that manages the device — an attacker-controlled MDM path can report 'compliant'.","d":"A password reset has no bearing on device compliance evaluation."},"hint":"Split the two checks: who admits the device, and who vouches for its compliance?","explain":"<p><b>Red view:</b> registering the device gets it into the tenant and gives it a PRT — but a <b>compliant-device</b> rule needs a compliance claim. The documented evasion is to push the device through an <b>Intune-style enrollment the attacker controls</b> (or a fake MDM path) so the compliance state reads 'compliant'. <b>Blue view:</b> this is why you must watch <b>who reports compliance</b> (the management tenant) and not only that a device is registered — the ATT&amp;CK references for T1098.005 describe exactly this compliance-faking bypass.</p>","study":"how faked device compliance bypasses conditional access."},{"type":"match","summary":"Map four raw artefact lines to their ATT&CK sub-technique","short":"Artefact lines → T1098.x","scenario":"You are normalising a case file for ATT&CK mapping. Four raw artefact lines must each carry a sub-technique tag before the report ships.","question":"Match each artefact line to the sub-technique it evidences.","pairs":[{"left":"audit: activityDisplayName='Register device' deviceId=d-4410","right":"T1098.005 — Device Registration","why":"The audit event that a device object was created — the signature artefact of .005."},{"left":"audit: 'Add delegated mailbox permission' target=fin-shared","right":"T1098.002 — Additional Email Delegate Permissions","why":"Mailbox delegation is the email-delegate sub-technique."},{"left":"cloud: new application password created for svc-report@corp","right":"T1098.001 — Additional Cloud Credentials","why":"Creating an additional cloud credential is .001 — a new secret, not a device."},{"left":"host: authorized_keys modified, new 'ssh-rsa AAAA…' line appended","right":"T1098.004 — SSH Authorized Keys","why":"An appended SSH key in authorized_keys is .004."}],"hint":"Tag the OBJECT each line changes: device, mailbox, credential secret, key file.","explain":"<p>Mapping discipline: name the object the artefact changes. A <b>device object</b> event maps to .005; a <b>mailbox permission</b> to .002; a <b>new credential secret</b> to .001; a <b>key line</b> to .004. The same intrusion often touches several — tagging each artefact separately is what keeps detection coverage honest later.</p>","study":"ATT&CK mapping discipline for Account Manipulation artefacts."},{"type":"dnd","summary":"Drag each control onto the exact enrollment behaviour it prevents","short":"Controls vs behaviours","scenario":"A tabletop exercise lists four hardening controls and four attack behaviours. Match them precisely — a control placed on the wrong behaviour is scored as a wrong item.","question":"Drag each control to the behaviour it prevents.","itemsPool":[{"id":"k1","label":"Require MFA (or a temporary access pass) at registration"},{"id":"k2","label":"Allow enrollment only from trusted locations or devices"},{"id":"k3","label":"Keep a strict allow-list of who may register devices"},{"id":"k4","label":"Block new-device enrollment for inactive accounts"}],"slots":[{"label":"Attacker with a stolen password enrolls a device in one step","accept":["k1"],"why":"M1032: the second factor (or a TAP) is exactly what the password thief lacks at enrollment time."},{"label":"Attacker enrolls from an anonymous hosting network","accept":["k2"],"why":"Trusted-location/device restrictions refuse first enrollment from untrusted networks."},{"label":"Attacker abuses a standard user's self-service right","accept":["k3"],"why":"If only an allow-listed group can register devices, a stolen standard account is not enough."},{"label":"Attacker wakes a dormant account by enrolling a device","accept":["k4"],"why":"The page's guidance: disallow enrolling new devices for inactive accounts — dormant doors get closed."}],"hint":"Each control kills ONE condition: no second factor, wrong place, wrong person, wrong account state.","explain":"<p>The four controls map one-to-one onto the four doors: <b>MFA/TAP</b> (no second factor), <b>trusted locations</b> (wrong place), <b>registrar allow-list</b> (wrong person), <b>inactive-account block</b> (wrong account state). All four come from mitigation <b>M1032</b> on the T1098.005 page. Note the design lesson: each control is cheap alone and decisive only against its own door — layered, they close the whole enrollment surface.</p>","study":"M1032 controls mapped to the behaviours they stop."},{"type":"triage","summary":"Four containment decisions with conflicting signals","short":"Triage: 4 conflicting-context alerts","scenario":"You hold the shift-lead phone tonight. Four registration cases, each with a signal pulling one way and a fact pulling the other. Choose the proportionate decision for each — the least aggressive sufficient action is expected where it fits.","question":"Choose the correct decision for each case.","alerts":[{"title":"Registration on the Autopilot staging VM","meta":"new device registered for svc-autopilot-staging · 22:40 · office IP · staging window ticketed","options":[{"id":"o1","label":"Close as expected — ticketed staging window on the office network"},{"id":"o2","label":"Block the staging service principal tenant-wide immediately"},{"id":"o3","label":"Escalate to IR and isolate the staging VLAN"}],"correct":"o1","why":"Ticketed window, office IP, dedicated service account — looks alarming only because it is automated. Blocking tenant-wide would break onboarding."},{"title":"Registration for p.novak from a VPS, device sign-in 4 minutes later","meta":"user on sick leave · registration AND use from hosting IP · PRT issued","options":[{"id":"o1","label":"Contain: disable the device, revoke sessions, then verify out-of-band"},{"id":"o2","label":"Wait for p.novak to return from sick leave"},{"id":"o3","label":"Reset the password only and monitor"}],"correct":"o1","why":"The foothold is live and in use. Password reset alone leaves the device trust intact — contain first, verify after."},{"title":"Registration for a contractor whose contract ended last week","meta":"office IP (VPN concentrator range) · account shows 'disabled pending offboarding' in HR data but is enabled in the tenant","options":[{"id":"o1","label":"Escalate: offboarding gap — disable the account and audit what else it touched"},{"id":"o2","label":"Close — contractors often finish paperwork after their last day"},{"id":"o3","label":"Only rename the device to mark it"}],"correct":"o1","why":"The alarming part is not the device — it is that a departing account is still enabled and active. That is an identity-lifecycle incident."},{"title":"Registration for c.diallo, signals conflict","meta":"new device · corporate IP per VPN log · but the device has never been seen before and no ticket exists · user does not answer the phone","options":[{"id":"o1","label":"Escalate to IR for a scoped decision — do not block unilaterally yet, do not close"},{"id":"o2","label":"Close as benign — corporate IP is sufficient proof"},{"id":"o3","label":"Disable every device c.diallo has ever had"}],"correct":"o1","why":"Two signals genuinely conflict (trusted network vs unknown device and silence). Escalation with the evidence is the defensible middle path."}],"hint":"Weigh automation tickets, live use, lifecycle gaps and genuine ambiguity — each has its own right-sized answer.","explain":"<p>HARD triage is proportionality: <b>ticketed automation</b> closes (case 1), <b>live misuse</b> contains immediately (case 2), <b>lifecycle gaps</b> escalate to the identity owner (case 3), and <b>true ambiguity</b> escalates without unilateral action (case 4). Notice case 2's distractor — resetting the password feels strong but leaves the registered device (and its PRT path) working; the least-aggressive <i>insufficient</i> action is the trap.</p>","study":"proportionate response and the least-aggressive-sufficient principle."},{"type":"blank","summary":"Complete the IR report's key technical sentences","short":"IR report blanks","scenario":"The draft report for the FIN-WS-07 case needs its three key technical terms filled in before the CISO reads it. Use the word bank; spell items exactly as the word bank shows.","question":"Complete the three gaps in the report text.","text":"At 14:05:40 UTC the host FIN-WS-07 executed [[0]] with the /register enrollment flag from a suspicious Office-parent chain. Ninety seconds later the tenant audit log recorded activityDisplayName 'Register device'. The registered device then obtained a [[1]], enabling silent single sign-on for the attacker. We assess the behaviour as T1098.005 under the [[2]] tactic, and we note the actor also had mailbox-delegate access — a separate sub-technique to track in parallel.","blanks":[{"accept":["dsregcmd"],"why":"The Windows command-line tool whose enrollment flags perform registration."},{"accept":["PRT","Primary Refresh Token","primary refresh token"],"why":"The token a registered/joined device holds for silent SSO."},{"accept":["Persistence","persistence","TA0003"],"why":"A durable foothold is the Persistence tactic (T1098.005 also carries Privilege Escalation)."}],"hint":"One tool, one token, one tactic — all three appear on the ATT&CK page for this technique.","explain":"<p>The report's spine is: <b>dsregcmd /register</b> on the host → <b>'Register device'</b> in the audit log → <b>PRT</b> enabling silent sign-on → mapped to T1098.005 under <b>Persistence</b>. Keeping the three layers (host, tenant, tactic) in one sentence is what makes an IR report verifiable by any reader.</p>","study":"writing verifiable IR findings with host, tenant and tactic layers."},{"type":"order","summary":"Order the five phases of the observed intrusion","short":"Order the intrusion phases","scenario":"From the case file: five phases of one intrusion need sequencing for the executive timeline. The registered device was used both to read mail and to send a payroll-themed email to 40 colleagues from inside the tenant.","question":"Click the five phases in the order they occurred (first click = earliest).","steps":[{"id":"x1","label":"Credential phishing harvests the user's password","why":"Initial access: the phishing page collects factor one."},{"id":"x2","label":"Attacker signs in and satisfies MFA via an adversary-in-the-middle page","why":"The AiTM proxy relays the MFA push — now the session is fully valid."},{"id":"x3","label":"Attacker registers their own device to the tenant","why":"T1098.005: the foothold becomes independent of the stolen password."},{"id":"x4","label":"The registered device satisfies device-based rules on every new sign-in","why":"The device now carries trust (and a PRT) — persistence pays off daily."},{"id":"x5","label":"Internal spearphishing mail is sent from the trusted device","why":"The page's noted abuse: intra-organisational mail from a registered device is less suspicious."}],"hint":"Password → session → device → daily trust → abuse of trust.","explain":"<p>The sequence shows <b>why</b> registration matters: it converts a fragile credential into a durable, trusted position, and then <b>monetises</b> that trust — here with internal spearphishing that lands with far less suspicion because it comes from inside. Breaking the chain at x3 (blocking or detecting the registration) kills everything after it.</p>","study":"where device registration sits in a full intrusion narrative."},{"type":"qcm","summary":"A routine-looking registration that should alarm you","short":"Benign-looking, actually alarming","scenario":"Saturday 03:00: device 'LAP-HR-DOCK-02' is registered for user hr-director@corp from the office IP range. Device naming matches your standard. No ticket exists. The account's last successful sign-in before tonight was 12 days ago — two days after HR systems show the user's termination date.","question":"Which reading and action are correct?","options":[{"id":"a","label":"Alarming: a post-termination account reactivated and registered a device — treat as account compromise"},{"id":"b","label":"Benign: the office IP and standard naming prove an IT rebuild"},{"id":"c","label":"Benign: HR devices register automatically on Saturday nights"},{"id":"d","label":"Alarming, but act only on the device: rename it and move on"}],"correct":["a"],"itemWhy":{"b":"Office IP and naming are trivially copyable — they are the disguise, not the proof.","c":"No such automation exists in this tenant, and no ticket was raised.","d":"The device is the smaller problem: the ACCOUNT itself should not be active post-termination."},"hint":"Ask what the corporate-looking facts actually prove — and what the account lifecycle says.","explain":"<p>This is the 'looks benign but is alarming' case: every surface signal (naming, IP) mimics routine, but the <b>account lifecycle</b> contradicts the activity — the user was terminated, the account still works, and now it grew a <b>trusted device</b>. Post-termination enrollment is a classic insider/compromise exit path. The correct escalation targets the account first, the device second.</p>","study":"registration events on dormant or terminated accounts."},{"type":"term","summary":"Choose the dsregcmd mode that reports state without changing it","short":"Terminal: pick the safe dsregcmd mode","scenario":"Live incident, host FIN-WS-07. You are local admin in an IR session. The case needs the device's registration state (joined? which tenant? PRT present?) captured for the report. The host is live evidence: nothing you run may change the device's registration state. Choose the tool and mode yourself — no syntax help this time.","question":"Type the exact command that reports the registration state read-only, then run it and press Check.","term":{"prompt":"C:\\IR\\FIN-WS-07>","banner":["IR session — FIN-WS-07 (local admin) — EDR recording","Goal: capture device registration state. Constraint: read-only.","Near-miss modes exist; think about what each flag changes."],"canonical":"dsregcmd /status","elements":[{"reSrc":"dsregcmd","label":"tool: dsregcmd","why":"The built-in Windows tool for device registration state."},{"reSrc":"/status","label":"mode: /status (read-only report)","why":"/status prints the full registration state — AzureAdJoined, DeviceId, TenantName, AzureAdPrt — and changes nothing."}],"penalties":[{"reSrc":"/debug","label":"wrong mode: /debug","why":"/debug turns on verbose diagnostic logging — different output, not the state report."},{"reSrc":"/leave","label":"DESTRUCTIVE: /leave","why":"/leave removes the device's registration — evidence destroyed."},{"reSrc":"/join","label":"state-changing: /join","why":"/join (re)joins the device to Entra ID — it mutates registration state on live evidence."}],"danger":[{"reSrc":"/leave","msg":"dsregcmd /leave would have destroyed the very evidence you were sent to capture — the device would be un-registered and its registration artefacts wiped from the tenant-side view as well."}],"parts":[{"k":"dsregcmd","v":"built-in Windows device-registration tool"},{"k":"/status","v":"prints the full registration state; strictly read-only — safe on live evidence"}]},"hint":"You need the mode that PRINTS. At least one plausible flag here does the opposite of printing.","explain":"<p>The canonical command is <code class=\"inline\">dsregcmd /status</code>. Its output gives the case everything: AzureAdJoined, DeviceId, TenantName and AzureAdPrt — while changing nothing. <b>/join</b> and <b>/leave</b> mutate registration state on live evidence (/leave destroys it outright — that near-miss is flagged DANGEROUS, not just wrong), and <b>/debug</b> only flips on verbose logging. On a live host, the read-only mode is the only defensible choice.</p>","study":"dsregcmd modes and their effect on device state."},{"type":"logview","summary":"Click the two lines showing a compliance state set outside the corporate MDM","short":"Faked compliance states","scenario":"Your CA policy trusts compliance states. The corporate MDM tenant is 'MDM-CORP'. Two of these device-management log lines show compliance being asserted by something else — the pattern that defeats device rules.","question":"Click the two lines where a compliance state is asserted outside the corporate MDM.","lines":[{"id":"f1","text":"mdm  compliance evaluated device=d-4410  tenant=MDM-CORP  state=noncompliant → remediation pushed","related":false,"why":"Corporate MDM doing its job — a noncompliant verdict with remediation is the healthy path."},{"id":"f2","text":"mdm  compliance evaluated device=d-77aa  tenant='MDM-TRUST-LLC'  state=compliant","related":true,"why":"An unrecognised management tenant asserts compliance — the faked-state pattern."},{"id":"f3","text":"audit  'Update device' device=d-77aa  attribute=complianceState  value=compliant  actor=svc-mdm-unknown","related":true,"why":"A control-plane update flips complianceState, driven by an unknown service principal."},{"id":"f4","text":"mdm  compliance evaluated device=d-9c02  tenant=MDM-CORP  state=compliant","related":false,"why":"Corporate tenant, compliant verdict — normal."},{"id":"f5","text":"signin  device=d-77aa  ca='Require compliant device'  result=satisfied  prt=yes","related":false,"why":"This is the DOWNSTREAM effect (the rule passing) — it belongs to the sign-in story, not the compliance assertion."},{"id":"f6","text":"mdm  device=d-4410  sync inventory  tenant=MDM-CORP","related":false,"why":"Routine inventory sync — noise."}],"hint":"Who is allowed to SAY 'compliant'? Only the tenant your policy trusts.","explain":"<p>F2 and F3 are the kill-chain of a device rule: an <b>unknown management tenant</b> asserts 'compliant' (F2), and the control-plane <b>Update device</b> event writes that state via an unknown service principal (F3). F5 shows the rule passing afterwards — real, but it is the consequence, not the assertion. Watching <b>who reports compliance</b> closes the bypass described in the ATT&amp;CK references for this technique.</p>","study":"monitoring the compliance source of truth for managed devices."},{"type":"tree","summary":"Three-step containment decision with branching","short":"IR decision tree: rogue device","scenario":"Alert: a device was registered for u.okafor, who is on parental leave. You are the on-call senior. Work the tree — each step's outcome depends on your previous choice.","question":"Work through the three decision steps; your final Check grades the whole path.","tree":{"steps":[{"prompt":"STEP 1. The audit event shows the registration came from a hosting-provider IP at 02:11. u.okafor is unreachable. What is your first move?","options":[{"id":"t1a","label":"Correlate: pull the account's sign-ins, risk state and the new device's activity"},{"id":"t1b","label":"Delete the device object immediately — fastest containment"},{"id":"t1c","label":"Email u.okafor and wait for a reply before touching anything"}],"correct":"t1a","why":"Scope before surgery: correlation tells you whether this is one device or an ongoing intrusion — and deletion destroys evidence you will want."},{"prompt":"STEP 2. Correlation: two sign-ins from the new device in the last hour, both device-trusted, one reading the executive mailbox. User still unreachable; the manager confirms no new laptop was issued. Containment decision?","options":[{"id":"t2a","label":"Disable the device object and revoke u.okafor's sessions"},{"id":"t2b","label":"Reset u.okafor's password only"},{"id":"t2c","label":"Wait — parental leave ends in four days"}],"correct":"t2a","why":"Disable the device (kills its trust and PRT path) and revoke sessions (drops stolen tokens). Password-only leaves the device trust alive; waiting leaves the executive mailbox open to the attacker."},{"prompt":"STEP 3. Business pushback: disabling the device also blocks u.okafor's legitimate phone re-enrollment when they return. Choose the proportionate final action set.","options":[{"id":"t3a","label":"Keep the device disabled; document re-enrollment steps for the user's return"},{"id":"t3b","label":"Re-enable the device to avoid user friction, monitor instead"},{"id":"t3c","label":"Delete the user account entirely to be safe"}],"correct":"t3a","why":"The attacker path must stay closed; the user's friction is a documented, reversible cost. Re-enabling for convenience reopens the exact foothold you just killed; deleting the account destroys far more than it protects."}]},"hint":"At each step: scope before surgery; kill trust, not users; keep the reversible choice that still closes the door.","explain":"<p>The path that survives contact with reality: <b>correlate → disable device + revoke sessions → keep it disabled with documented re-enrollment</b>. Branch lessons: deleting the device early (step 1) would have destroyed audit context; password-only (step 2) is the classic insufficient action because the device's trust survives the reset; re-enabling for convenience (step 3) undoes containment for a four-day-old problem.</p>","study":"containment decisions and their collateral costs."},{"type":"qcm","multi":true,"summary":"Select the THREE true statements about device states","short":"Three true statements","scenario":"Five statements about device registration states circulate in your team's wiki. Exactly three are true.","question":"Select the THREE true statements.","options":[{"id":"a","label":"Both registered and joined devices can receive a Primary Refresh Token"},{"id":"b","label":"Only devices joined to an on-premises domain can be registered"},{"id":"c","label":"Registration can attach a personal device through self-service"},{"id":"d","label":"Enrollment into the device management system adds compliance evaluation"},{"id":"e","label":"A registered device is always physically owned by the organisation"}],"correct":["a","c","d"],"itemWhy":{"b":"Entra registration/join runs against the cloud tenant — on-premises domain join is not a prerequisite.","e":"The whole point of the self-service path is that personal devices can be registered — by users, and by attackers using their accounts."},"hint":"One false statement invents an on-premises prerequisite; the other denies the personal-device path.","explain":"<p>True: <b>a</b> — PRTs are issued to registered and joined devices alike, which is why both states matter for T1098.005; <b>c</b> — self-service attaches personal devices (the exact door self-enrollment abuse walks through); <b>d</b> — the management-system enrollment is where compliance evaluation comes from. False: <b>b</b> (no on-prem prerequisite) and <b>e</b> (personal devices are precisely the registered case).</p>","study":"device states: registered, joined, enrolled — and what each can hold."},{"type":"dnd","summary":"Drag each finding to the action it calls for","short":"Findings → next actions","scenario":"Four findings from tonight's sweep need owners and actions in the handover note. Match each finding to the action it actually calls for — each action is used exactly once.","question":"Drag each finding to its matching action.","itemsPool":[{"id":"n1","label":"Rogue registration confirmed: device used from hosting IP, PRT active"},{"id":"n2","label":"Registration performed by an unexpected service principal"},{"id":"n3","label":"Registration matches a ticketed onboarding wave"},{"id":"n4","label":"Registration for a user unreachable for 48h with high risk state"}],"slots":[{"label":"Disable device object + revoke user sessions","accept":["n1"],"why":"Confirmed, in-use foothold: kill the device trust and the tokens first."},{"label":"Audit the service principal's rights and app registrations","accept":["n2"],"why":"The anomaly is the AUTOMATION — audit what that principal could and did touch."},{"label":"Close as expected with the ticket reference","accept":["n3"],"why":"Documented, expected onboarding — closing with the reference keeps the baseline clean."},{"label":"Escalate to IR for an out-of-band verification plan","accept":["n4"],"why":"Unreachable user + high risk is a people-problem on top of a technical one — IR owns the verification."}],"hint":"Match the ACTION to the nature of the anomaly: live misuse, rogue automation, documented normality, human ambiguity.","explain":"<p>Four findings, four different natures: <b>live misuse</b> → containment; <b>rogue automation</b> → audit the automation's rights; <b>documented normality</b> → close with reference; <b>human ambiguity with risk</b> → escalate to IR. The discipline that matters: containment actions are for confirmed footholds — spending them on ambiguity or closing over confirmed misuse are both failures, just in opposite directions.</p>","study":"matching response actions to finding types."},{"type":"order","rankMode":true,"summary":"Rank four containment actions by how completely they kill this foothold","short":"Rank containment effectiveness","scenario":"One rogue registered device, PRT active, attacker signed in twice. Rank the four candidate actions by how completely each one removes THIS foothold (first click = most effective).","question":"Click the four actions in order of effectiveness (first click = kills the foothold best).","steps":[{"id":"w1","label":"Disable the device object","why":"Disabling revokes the device's trusted path and blocks its PRT — the direct kill for THIS foothold."},{"id":"w2","label":"Revoke the user's refresh tokens / sessions","why":"Strong second: drops stolen tokens, but a compliant stolen password can re-auth — and the device object remains."},{"id":"w3","label":"Reset the user's password","why":"Necessary hygiene, weak against THIS foothold: the registered device's trust does not depend on the old password."},{"id":"w4","label":"Delete the device object","why":"Effective but costly: it also destroys the audit object you will need, and the attacker can re-register if the account is still theirs."}],"hint":"Which action removes the device's trust itself? Which ones leave the device exactly as trusted as before?","explain":"<p>The ranking teaches the PRT lesson: a <b>password reset does not kill a device foothold</b> — the device's trust is independent of the password, so W3 lands third. <b>Disabling the device</b> is the precise kill; <b>revoking sessions</b> complements it by dropping live tokens; <b>deleting</b> works but costs you evidence and invites re-registration. In practice: disable + revoke, then reset — never reset alone.</p>","study":"why password resets alone fail against registered-device persistence."},{"type":"qcm","summary":"Design the compensating detection when self-service cannot be disabled","short":"Compensating detection design","scenario":"Field operations need self-service enrollment, so the strongest preventive control is off the table. In the briefing you cite the ATT&CK procedure examples: APT29 enrolled devices into MFA after password-guessing a dormant account during the SolarWinds compromise, and Scattered Spider registered MFA devices to persist through VPN access in campaign C0027. The CISO asks: what compensating posture do you actually deploy?","question":"Which compensating posture best fits this constraint?","options":[{"id":"a","label":"MFA/TAP at enrollment, trusted-location limits, dormant-account block, plus DET0036-style alerting on every remaining registration"},{"id":"b","label":"Disable all device trust features so nothing can be registered"},{"id":"c","label":"Trust the office IP ranges as the only control and alert on nothing else"},{"id":"d","label":"Alert only when a user registers their fifth device"}],"correct":["a"],"itemWhy":{"b":"Killing device trust breaks every managed-workflow the business runs on — disproportionate and rarely survivable politically.","c":"Office IPs did not stop Scattered Spider's VPN-persistence pattern — network trust alone is the wrong anchor.","d":"Count thresholds let the first four registrations — including APT29's one-device pattern — straight through."},"hint":"When prevention is partial, you layer the remaining preventives and make the detective control carry the rest — what did the two cited procedures abuse that your analytics must watch?","explain":"<p>With self-service retained, the posture is <b>layered prevention + detection</b>: MFA or a temporary access pass at enrollment, trusted-location limits, the dormant-account block, and DET0036-style analytics over every registration that remains. The two procedure examples show why: <b>APT29</b> came through a dormant account (the inactive-account block and risk-weighted alerting target exactly that), and <b>Scattered Spider</b> persisted through VPN (so network trust alone must never be the only gate). This is the coverage-gap discipline: name what prevention cannot stop, then assign a detection to each gap.</p>","study":"compensating controls and coverage-gap analysis for T1098.005."}];
'use strict';
/* CyberPulseAcademy exam engine — shared across all T1098.005 severity files.
 * Expects globals: META, INTRO, EXERCISES (injected before this script). */
(function () {
  var $id = function (i) { return document.getElementById(i); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function shuffle(a) {
    var x = a.slice();
    for (var i = x.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = x[i]; x[i] = x[j]; x[j] = t;
    }
    return x;
  }
  function norm(s) { return String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ' ').trim(); }
  function pct(n) { return Math.round(n * 100); }
  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60, h = Math.floor(m / 60);
    m = m % 60;
    var mm = (h > 0 ? String(m).padStart(2, '0') : String(m));
    var out = (h > 0 ? h + ':' : '') + mm + ':' + String(s).padStart(2, '0');
    return out;
  }
  function scoreHW(H, W, N) { return Math.max(0, (H - W) / N); }

  var SEV_CLASS = { 'easy': 'badge-easy', 'medium': 'badge-medium', 'hard': 'badge-hard', 'extremely-hard': 'badge-extreme' };

  var state = {
    screen: 'intro', mode: 'exam', pos: 0, queue: [],
    answered: {}, credits: {}, results: {}, skipped: [], currentIdx: -1,
    usedHint: {}, hintShown: {},
    shuffles: {}, trans: {},
    timer: { state: 'IDLE', remain: 0, total: 0, lastTs: 0, manualMs: 0, autoMs: 0, autoStart: 0, pauseStart: 0 },
    pauseReturn: 'RUNNING', reported: false, user: { name: '', country: '', locale: '' }
  };
  var tickHandle = null;

  /* ---------------- timer state machine ---------------- */
  // States: IDLE -> RUNNING <-> PAUSED_MANUAL / PAUSED_AUTO_CHECK -> ENDED
  function setTimerState(s) {
    state.timer.state = s;
    if (s === 'RUNNING') { state.timer.lastTs = Date.now(); }
    renderTimerBar();
  }
  function startTimer() {
    state.timer.total = META.estimatedMinutes * 60;
    state.timer.remain = state.timer.total;
    state.timer.manualMs = 0; state.timer.autoMs = 0; state.timer.autoStart = 0;
    setTimerState('RUNNING');
    if (tickHandle) { clearInterval(tickHandle); }
    tickHandle = setInterval(tick, 250);
  }
  function tick() {
    var t = state.timer;
    if (t.state === 'ENDED') { return; }
    var now = Date.now();
    if (t.state !== 'RUNNING') { t.lastTs = now; return; }
    var dt = (now - t.lastTs) / 1000;
    t.lastTs = now;
    t.remain -= dt;
    if (t.remain <= 0) { t.remain = 0; renderTimerBar(); finishExam(true); return; }
    renderTimerBar();
  }
  function renderTimerBar() {
    var t = state.timer;
    $id('timerVal').textContent = fmtTime(t.remain);
    var st = $id('timerState'), box = $id('timerBox');
    var banner = $id('pauseBanner');
    if (t.state === 'RUNNING') {
      st.textContent = '▶ RUNNING'; st.className = 'ts-running';
      box.setAttribute('aria-label', 'Timer running');
      banner.style.display = 'none';
      $id('pauseBtn').innerHTML = '<span class="b-ic">⏸</span> Pause';
      document.body.classList.remove('manually-paused');
    } else if (t.state === 'PAUSED_MANUAL') {
      st.textContent = '⏸ PAUSED_MANUAL'; st.className = 'ts-paused';
      box.setAttribute('aria-label', 'Timer paused manually');
      banner.innerHTML = '<span class="ic">⏸</span> PAUSED — manual (press Resume)';
      banner.style.display = 'block';
      $id('pauseBtn').innerHTML = '<span class="b-ic">▶</span> Resume';
    } else if (t.state === 'PAUSED_AUTO_CHECK') {
      st.textContent = '⏸ PAUSED_AUTO_CHECK'; st.className = 'ts-paused';
      box.setAttribute('aria-label', 'Timer paused while reviewing feedback');
      banner.innerHTML = '<span class="ic">⏸</span> PAUSED — reviewing feedback (resumes on Next)';
      banner.style.display = 'block';
      $id('pauseBtn').innerHTML = '<span class="b-ic">⏸</span> Pause';
    } else if (t.state === 'ENDED') {
      st.textContent = '■ ENDED'; st.className = 'ts-ended';
      banner.style.display = 'none';
    } else {
      st.textContent = '— READY'; st.className = 'ts-running';
      banner.style.display = 'none';
    }
  }
  function onPauseBtn() {
    if (state.screen !== 'exam') { return; }
    if (state.timer.state === 'PAUSED_MANUAL') { onResumeBtn(); return; }
    var t = state.timer;
    if (t.state === 'RUNNING') {
      t.pauseStart = Date.now(); state.pauseReturn = 'RUNNING';
      setTimerState('PAUSED_MANUAL');
      document.body.classList.add('manually-paused');
      showPauseCover(true);
    } else if (t.state === 'PAUSED_AUTO_CHECK') {
      t.autoMs += Date.now() - t.autoStart; t.autoStart = 0;
      t.pauseStart = Date.now(); state.pauseReturn = 'PAUSED_AUTO_CHECK';
      setTimerState('PAUSED_MANUAL');
      document.body.classList.add('manually-paused');
      showPauseCover(true);
    }
  }
  function onResumeBtn() {
    var t = state.timer;
    if (t.state !== 'PAUSED_MANUAL') { return; }
    t.manualMs += Date.now() - t.pauseStart; t.pauseStart = 0;
    showPauseCover(false);
    setTimerState(state.pauseReturn || 'RUNNING');
    if ((state.pauseReturn || 'RUNNING') === 'PAUSED_AUTO_CHECK' && !t.autoStart) { t.autoStart = Date.now(); }
    document.body.classList.remove('manually-paused');
  }
  function showPauseCover(on) {
    var c = $id('pauseCover');
    if (!c) { return; }
    if (on) {
      c.classList.remove('hidden');
      c.innerHTML = '<div class="card" style="max-width:520px;margin:60px auto;text-align:center">' +
        '<h2>⏸ PAUSED — manual</h2><p style="color:var(--text-secondary)">The exercise is hidden while you take a break.' +
        ' The countdown is stopped. Press Resume to continue.</p>' +
        '<button class="btn btn-primary" id="resumeBtn2">▶ Resume</button></div>';
      $id('resumeBtn2').addEventListener('click', onResumeBtn);
    } else { c.classList.add('hidden'); c.innerHTML = ''; }
  }

  /* ---------------- scoring core ---------------- */
  function scoreExercise(selectedItems, correctItems) {
    // Mandatory formula: credit = max(0, (H - W) / N)
    var N = correctItems.length, H = 0, W = 0;
    selectedItems.forEach(function (s) { if (correctItems.indexOf(s) >= 0) { H++; } else { W++; } });
    return { N: N, H: H, W: W, credit: scoreHW(H, W, N) };
  }

  /* ---------------- flow ---------------- */
  function startExam() {
    state.screen = 'exam'; state.mode = 'exam';
    state.pos = 0; state.queue = shuffle(EXERCISES.map(function (e, i) { return i; }));
    state.answered = {}; state.credits = {}; state.results = {}; state.skipped = [];
    state.usedHint = {}; state.hintShown = {}; state.shuffles = {}; state.trans = {};
    state.reported = false;
    $id('screen-intro').classList.add('hidden');
    $id('screen-results').classList.add('hidden');
    $id('screen-exam').classList.remove('hidden');
    $id('sevBadge2').className = 'badge ' + SEV_CLASS[META.difficulty];
    $id('sevBadge2').innerHTML = '<span class="b-ic">' + sevIcon() + '</span> ' + esc(META.sevName);
    $id('partLabel').textContent = INTRO.partLabel || '';
    startTimer();
    showExercise();
  }
  function sevIcon() { return META.difficulty === 'extremely-hard' ? '◉' : '◆'; }
  function curEx() { return EXERCISES[state.currentIdx]; }
  function processedCount() {
    var a = 0; Object.keys(state.answered).forEach(function (k) { if (state.answered[k]) { a++; } });
    return a + state.skipped.length;
  }
  function updateProgress() {
    var f = $id('progressFill');
    f.style.width = Math.min(100, (processedCount() / EXERCISES.length) * 100) + '%';
  }
  function updateLiveScore() {
    var sum = 0, n = 0;
    Object.keys(state.answered).forEach(function (k) {
      if (state.answered[k]) { sum += state.credits[k]; n++; }
    });
    $id('scoreVal').textContent = (n > 0 ? (Math.round(sum * 10) / 10) + ' / ' + n + ' (' + pct(sum / n) + '%)' : '0 / 0 (—%)');
  }
  function showExercise() {
    var idx = state.queue[state.pos];
    state.currentIdx = idx;
    $id('exCounter').textContent = 'Exercise ' + (state.pos + 1) + ' of ' + EXERCISES.length;
    renderExercise(idx, state.mode === 'review-item');
    updateProgress(); updateLiveScore();
    $id('checkBtn').classList.remove('hidden');
    $id('checkBtn').disabled = true;
    $id('checkBtn').textContent = '✓ Check';
    $id('nextBtn').classList.add('hidden');
    $id('skipBtn').classList.remove('hidden');
    $id('hintBtn').classList.remove('hidden');
    $id('hintBtn').disabled = false;
    document.getElementById('exerciseArea').scrollTop = 0;
    window.scrollTo(0, 0);
  }
  function onSkip() {
    if (state.screen !== 'exam' || state.currentIdx < 0 || state.answered[state.currentIdx]) { return; }
    var idx = state.currentIdx;
    if (state.skipped.indexOf(idx) < 0) { state.skipped.push(idx); }
    state.currentIdx = -1;
    if (state.mode === 'review-item') { showReview(); return; }
    state.pos++;
    proceedOrFinish(false);
    updateProgress();
  }
  function proceedOrFinish(cameFromCheck) {
    if (state.mode === 'review-item') { showReview(); return; }
    if (state.pos < state.queue.length) {
      showExercise();
    } else {
      var un = state.skipped.filter(function (i) { return !state.answered[i]; });
      if (un.length > 0) { showReview(); } else { finishExam(false); }
    }
  }
  function onCheck() {
    // FIRST action: stop the timer (Check-triggered auto-pause), then grade.
    var t = state.timer;
    if (t.state === 'RUNNING') { t.autoStart = Date.now(); setTimerState('PAUSED_AUTO_CHECK'); }
    var idx = state.currentIdx;
    var res = gradeExercise(curEx(), idx);
    if (state.usedHint[idx]) { res.credit = Math.max(0, res.credit - 0.10); }
    state.answered[idx] = true;
    state.credits[idx] = res.credit;
    state.results[idx] = res;
    var si = state.skipped.indexOf(idx);
    if (si >= 0) { state.skipped.splice(si, 1); }
    renderFeedback(curEx(), idx, res);
    updateLiveScore(); updateProgress();
    $id('checkBtn').classList.add('hidden');
    $id('skipBtn').classList.add('hidden');
    $id('hintBtn').disabled = true;
    var nb = $id('nextBtn');
    nb.classList.remove('hidden');
    if (state.mode === 'review-item') {
      nb.textContent = '⟲ Back to review (timer resumes)';
    } else if (state.pos >= state.queue.length - 1) {
      var un = state.skipped.filter(function (i) { return !state.answered[i]; });
      nb.textContent = un.length > 0 ? '⟲ Review skipped exercises' : '⏹ Final Submit';
    } else {
      nb.textContent = 'Next ▶';
    }
  }
  function onNext() {
    var t = state.timer;
    if (t.state === 'PAUSED_AUTO_CHECK' && t.autoStart) {
      t.autoMs += Date.now() - t.autoStart; t.autoStart = 0;
    }
    if (state.mode === 'review-item') {
      setTimerState('RUNNING');
      showReview(); return;
    }
    if (state.pos >= state.queue.length - 1) {
      var un = state.skipped.filter(function (i) { return !state.answered[i]; });
      if (un.length > 0) { showReview(); } else { finishExam(false); }
      return;
    }
    setTimerState('RUNNING');
    state.pos++;
    showExercise();
  }
  function onHint() {
    var idx = state.currentIdx;
    if (state.usedHint[idx] || state.answered[idx]) { return; }
    state.usedHint[idx] = true;
    state.hintShown[idx] = true;
    var ex = EXERCISES[idx];
    var hp = $id('hintPanel');
    hp.innerHTML = '<span class="ic">💡 Hint</span> ' + esc(ex.hint);
    hp.classList.remove('hidden');
    $id('hintBtn').disabled = true;
  }
  function showReview() {
    state.mode = 'review';
    state.screen = 'exam';
    state.currentIdx = -1;
    setTimerState('RUNNING'); // timer keeps running in review-skipped mode
    $id('exCounter').textContent = 'Review skipped exercises';
    var area = $id('exerciseArea');
    var un = state.skipped.filter(function (i) { return !state.answered[i]; });
    var done = state.skipped.filter(function (i) { return state.answered[i]; });
    var h = '<div class="block"><div class="block-h block-scen" style="color:var(--state-skipped)"><span class="b-ic">⚠</span> REVIEW SKIPPED EXERCISES</div>' +
      '<div class="block-b"><p class="scen-text">You skipped ' + state.skipped.length +
      ' exercise(s). You can return to any of them and answer it now, as long as the timer has not ended.' +
      ' Skipped exercises that stay unanswered are excluded from the score.</p>';
    if (un.length === 0) {
      h += '<p class="scen-text" style="color:var(--state-correct)">✓ All skipped exercises have been answered. You can submit.</p>';
    }
    un.forEach(function (i, k) {
      h += '<div class="review-item"><span class="word">⚠ Skipped</span><span class="sum">Exercise ' +
        (state.queue.indexOf(i) + 1) + ': ' + esc(EXERCISES[i].summary) + '</span>' +
        '<button class="btn btn-amber" data-ans="' + i + '">↩ Answer</button></div>';
    });
    done.forEach(function (i) {
      h += '<div class="review-item"><span class="word" style="color:var(--state-correct)">✓ Answered</span><span class="sum">Exercise ' +
        (state.queue.indexOf(i) + 1) + ': ' + esc(EXERCISES[i].summary) + '</span></div>';
    });
    h += '</div></div>';
    area.innerHTML = h;
    Array.prototype.forEach.call(area.querySelectorAll('[data-ans]'), function (b) {
      b.addEventListener('click', function () {
        state.mode = 'review-item';
        var i = parseInt(b.getAttribute('data-ans'), 10);
        state.pos = state.queue.indexOf(i);
        showExercise();
      });
    });
    $id('checkBtn').classList.add('hidden');
    $id('nextBtn').classList.add('hidden');
    $id('skipBtn').classList.add('hidden');
    $id('hintBtn').classList.add('hidden');
    $id('finalSubmitBtn').classList.remove('hidden');
    updateProgress(); updateLiveScore();

        if (!tr.picks[st]) { return; }
        var isLast = st === ex.tree.steps.length - 1;
        if (!isLast) {
          tr.step = st + 1;
          renderExercise(idx, state.mode === 'review-item');
          enableCheck(); // final Check becomes enabled once last step is selected
          $id('checkBtn').disabled = true;
        }
        // On the last step, the outer Check button grades the whole tree (auto-pause applies there only).
      });
    }
  }
  function hasAnyPlacement(ex, tr) {
    return ex.slots.some(function (s, si) { return (tr.slots[si] || []).length > 0; });
  }
  /* ---------------- grading ---------------- */
  function gradeExercise(ex, idx) {
    var tr = state.trans[idx] || { sel: {}, seq: [], picked: null, step: 0, picks: [], slots: [], cmd: '' };
    var t = ex.type, r = { N: 0, H: 0, W: 0, credit: 0, items: [], answerHtml: '', extraHtml: '' };
    if (t === 'qcm') {
      var correctIds = ex.correct;
      var selIds = Object.keys(tr.sel).filter(function (k) { return tr.sel[k]; });
      var s = scoreExercise(selIds, correctIds);
      r.N = s.N; r.H = s.H; r.W = s.W; r.credit = s.credit;
      ex.options.forEach(function (o) {
        var isC = correctIds.indexOf(o.id) >= 0, sel = !!tr.sel[o.id];
        if (isC) {
          r.items.push({ st: sel ? 'c' : 'm', label: o.label, why: ex.itemWhy && ex.itemWhy[o.id] ? ex.itemWhy[o.id] : 'This is part of the correct answer.' });
        } else if (sel) {
          r.items.push({ st: 'w', label: o.label, why: ex.itemWhy && ex.itemWhy[o.id] ? ex.itemWhy[o.id] : 'This option is not part of the correct answer.' });
        }
      });
      r.answerHtml = correctIds.map(function (cid) {
        return '<b>' + (ex.options.filter(function (o) { return o.id === cid; })[0] || {}).label + '</b>';
      }).join(' and ');
    } else if (t === 'match') {
      r.N = ex.pairs.length; var H = 0, W = 0;
      ex.pairs.forEach(function (p, i) {
        var sel = tr.sel['m' + i];
        if (!sel) { r.items.push({ st: 'm', label: strip(p.left) + ' → ' + p.right, why: p.why }); }
        else if (norm(sel) === norm(p.right)) { H++; r.items.push({ st: 'c', label: strip(p.left) + ' → ' + p.right, why: p.why }); }
        else { W++; r.items.push({ st: 'w', label: strip(p.left) + ' → ' + sel, why: p.why }); }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = ex.pairs.map(function (p) { return strip(p.left) + ' → <b>' + esc(p.right) + '</b>'; }).join('; ');
    } else if (t === 'blank') {
      r.N = ex.blanks.length; H = 0; W = 0;
      ex.blanks.forEach(function (b, i) {
        var val = norm(tr.sel['b' + i]);
        var ok = b.accept.some(function (a) { return norm(a) === val; });
        if (val === '') { r.items.push({ st: 'm', label: 'Blank ' + (i + 1), why: 'Correct: ' + b.accept[0] + '. ' + b.why }); }
        else if (ok) { H++; r.items.push({ st: 'c', label: 'Blank ' + (i + 1) + ' = ' + val, why: b.why }); }
        else { W++; r.items.push({ st: 'w', label: 'Blank ' + (i + 1) + ' = "' + val + '"', why: b.why + ' Correct: ' + b.accept[0] + '.' }); }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = ex.blanks.map(function (b, i) { return 'Blank ' + (i + 1) + ': <b>' + esc(b.accept[0]) + '</b>'; }).join('; ');
    } else if (t === 'dnd') {
      r.N = ex.slots.length; H = 0; W = 0;
      ex.slots.forEach(function (s, si) {
        var placed = tr.slots[si] || [];
        if (placed.length === 0) { r.items.push({ st: 'm', label: 'Slot: ' + s.label, why: s.why }); return; }
        placed.forEach(function (iid, k) {
          var it = ex.itemsPool.filter(function (x) { return x.id === iid; })[0];
          var lab = it ? it.label : iid;
          if (k === 0 && s.accept.indexOf(iid) >= 0) { H++; r.items.push({ st: 'c', label: 'Slot "' + s.label + '" ← ' + lab, why: s.why }); }
          else { W++; r.items.push({ st: 'w', label: 'Slot "' + s.label + '" ← ' + lab, why: (s.acceptWrong && s.acceptWrong[iid]) ? s.acceptWrong[iid] : 'This item does not belong in this slot. ' + s.why }); }
        });
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = ex.slots.map(function (s) {
        var labels = s.accept.map(function (aid) {
          var it = ex.itemsPool.filter(function (x) { return x.id === aid; })[0];
          return it ? it.label : aid;
        });
        return '"' + esc(s.label) + '" ← <b>' + esc(labels.join(' / ')) + '</b>';
      }).join('; ');
    } else if (t === 'order') {
      r.N = ex.steps.length; H = 0; W = 0;
      ex.steps.forEach(function (s, i) {
        var got = tr.seq[i];
        if (!got) { r.items.push({ st: 'm', label: 'Position ' + (i + 1) + ': ' + s.label, why: s.why }); }
        else if (got === s.id) { H++; r.items.push({ st: 'c', label: 'Position ' + (i + 1) + ': ' + s.label, why: s.why }); }
        else {
          W++;
          var it = ex.steps.filter(function (x) { return x.id === got; })[0];
          r.items.push({ st: 'w', label: 'Position ' + (i + 1) + ': you placed "' + (it ? it.label : got) + '"', why: s.why });
        }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = '<ol style="margin:4px 0 0 18px;padding:0">' + ex.steps.map(function (s) { return '<li>' + esc(s.label) + '</li>'; }).join('') + '</ol>';
    } else if (t === 'term') {
      var cmd = norm(tr.cmd || '');
      r.N = ex.term.elements.length; H = 0; W = 0;
      var rc = termRC(ex);
      if (cmd === '') {
        ex.term.elements.forEach(function (el) { r.items.push({ st: 'm', label: el.label, why: el.why }); });
      } else {
        rc.els.forEach(function (pair) {
          if (pair.re.test(cmd)) { H++; r.items.push({ st: 'c', label: pair.e.label, why: pair.e.why }); }
          else { r.items.push({ st: 'm', label: pair.e.label, why: pair.e.why }); }
        });
        rc.pens.forEach(function (pair) {
          if (pair.re.test(cmd)) { W++; r.items.push({ st: 'w', label: pair.p.label, why: pair.p.why }); }
        });
      }
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = '<div class="codeblock mono" style="background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text-mono);font-size:14.5px">' +
        '<span style="color:#7f8db3"># canonical command (copyable)</span>\n' + esc(ex.term.canonical) + '</div>';
      r.extraHtml = '<p style="margin:8px 0 0;color:var(--text-secondary)"><b style="color:var(--text-primary)">Part by part:</b></p><ul style="margin:6px 0 0 18px;padding:0">' +
        ex.term.parts.map(function (p) { return '<li style="margin-bottom:4px"><code class="inline">' + esc(p.k) + '</code> — ' + p.v + '</li>'; }).join('') + '</ul>';
      var dangerHit = null;
      rc.dan.forEach(function (pair) { if (pair.re.test(cmd)) { dangerHit = pair.d; } });
      if (dangerHit) {
        r.extraHtml = '<div class="fb-danger">✗ DANGEROUS — NEAR MISS: ' + dangerHit.msg + '</div>' + r.extraHtml;
      }
    } else if (t === 'triage') {
      r.N = ex.alerts.length; H = 0; W = 0;
      ex.alerts.forEach(function (a, i) {
        var sel = tr.sel['a' + i];
        var corr = a.options.filter(function (o) { return o.id === a.correct; })[0];
        if (!sel) { r.items.push({ st: 'm', label: 'Alert ' + (i + 1) + ' — correct: ' + corr.label, why: a.why }); }
        else if (sel === a.correct) { H++; r.items.push({ st: 'c', label: 'Alert ' + (i + 1) + ' — ' + corr.label, why: a.why }); }
        else {
          W++;
          var picked = a.options.filter(function (o) { return o.id === sel; })[0];
          r.items.push({ st: 'w', label: 'Alert ' + (i + 1) + ' — you chose "' + picked.label + '"', why: a.why });
        }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = ex.alerts.map(function (a, i) {
        var corr = a.options.filter(function (o) { return o.id === a.correct; })[0];
        return 'Alert ' + (i + 1) + ': <b>' + esc(corr.label) + '</b>';
      }).join('; ');
    } else if (t === 'logview') {
      var rel = ex.lines.filter(function (l) { return l.related; });
      r.N = rel.length; H = 0; W = 0;
      rel.forEach(function (l, i) {
        var sel = !!tr.sel[l.id];
        if (sel) { H++; r.items.push({ st: 'c', label: 'Line L' + (ex.lines.indexOf(l) + 1), why: l.why }); }
        else { r.items.push({ st: 'm', label: 'Line L' + (ex.lines.indexOf(l) + 1), why: l.why }); }
      });
      ex.lines.forEach(function (l) {
        if (!l.related && tr.sel[l.id]) {
          W++; r.items.push({ st: 'w', label: 'Line L' + (ex.lines.indexOf(l) + 1) + ' (not evidence)', why: l.why });
        }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = 'Evidence lines: <b>' + rel.map(function (l) { return 'L' + (ex.lines.indexOf(l) + 1); }).join(', ') + '</b>';
    } else if (t === 'tree') {
      r.N = ex.tree.steps.length; H = 0; W = 0;
      ex.tree.steps.forEach(function (st, i) {
        var got = tr.picks[i];
        var corr = st.options.filter(function (o) { return o.id === st.correct; })[0];
        if (!got) { r.items.push({ st: 'm', label: 'Step ' + (i + 1) + ' — correct: ' + corr.label, why: st.why }); }
        else if (got === st.correct) { H++; r.items.push({ st: 'c', label: 'Step ' + (i + 1) + ' — ' + corr.label, why: st.why }); }
        else {
          W++;
          var picked = st.options.filter(function (o) { return o.id === got; })[0];
          r.items.push({ st: 'w', label: 'Step ' + (i + 1) + ' — you chose "' + picked.label + '"', why: st.why });
        }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = ex.tree.steps.map(function (st, i) {
        var corr = st.options.filter(function (o) { return o.id === st.correct; })[0];
        return 'Step ' + (i + 1) + ': <b>' + esc(corr.label) + '</b>';
      }).join('; ');
    }
    return r;
  }
  function strip(html) { var d = document.createElement('div'); d.innerHTML = html; return d.textContent || d.innerText || ''; }
  function termRC(ex) {
    if (!ex._rc) {
      ex._rc = {
        els: (ex.term.elements || []).map(function (e) { return { e: e, re: new RegExp(e.reSrc, 'i') }; }),
        pens: (ex.term.penalties || []).map(function (p) { return { p: p, re: new RegExp(p.reSrc, 'i') }; }),
        dan: (ex.term.danger || []).map(function (d) { return { d: d, re: new RegExp(d.reSrc, 'i') }; })
      };
    }
    return ex._rc;
  }

  /* ---------------- feedback ---------------- */
  function renderFeedback(ex, idx, res) {
    var multi = res.N > 1;
    var cls, word, ic;
    if (res.credit >= 1) { cls = 'fb-correct'; word = 'CORRECT'; ic = '✓'; }
    else if (res.credit > 0) { cls = 'fb-partial'; word = 'PARTIALLY CORRECT'; ic = '✓'; }
    else { cls = 'fb-incorrect'; word = 'INCORRECT'; ic = '✗'; }
    var h = '<div class="feedback" id="feedbackBlock"><div class="fb-head ' + cls + '">' +
      '<span aria-hidden="true" style="font-size:20px">' + ic + '</span> <span>' + word + '</span>' +
      (multi || res.credit < 1 ? '<span class="fb-credit">✓ ' + res.H + '/' + res.N + ' items · credit ' + res.credit.toFixed(2) + '</span>' : '') +
      '</div><div class="fb-b">' +
      '<div class="fb-answer"><b>Correct answer:</b> ' + res.answerHtml + '</div>';
    if (multi) {
      h += '<p style="margin:6px 0 10px;color:var(--text-secondary);font-size:14px">Item-by-item breakdown — credit formula: max(0, (H − W) ÷ N) = max(0, (' + res.H + ' − ' + res.W + ') ÷ ' + res.N + ') = ' + res.credit.toFixed(2) + '</p>';
      h += res.items.map(function (it) {
        var stc = it.st === 'c' ? 'fi-correct' : (it.st === 'w' ? 'fi-wrong' : 'fi-missed');
        var w = it.st === 'c' ? ['✓', 'Correct'] : (it.st === 'w' ? ['✗', 'Wrong'] : ['○', 'Missed']);
        return '<div class="fb-item ' + stc + '"><span class="ic" aria-hidden="true">' + w[0] + '</span>' +
          '<span><span class="word">' + w[1] + '</span> — ' + esc(it.label) + '<span class="why">' + esc(it.why) + '</span></span></div>';
      }).join('');
    }
    h += '<div class="fb-explain">' + ex.explain +
      (res.credit < 1 && ex.study ? '<p class="study">📖 What to study: ' + esc(ex.study) + '</p>' : '') +
      '</div>' + (res.extraHtml || '') + '</div></div>';
    var area = $id('exerciseArea');
    area.insertAdjacentHTML('beforeend', h);
    // disable inputs
    Array.prototype.forEach.call(area.querySelectorAll('.opt, .chip, .slot-drop, [data-seq], [data-unseq], .match-row select, .blank-in, .log-line, .filter-in, [data-treeopt], #treeConfirm, #termRun, .shell-in'), function (el) {
      el.disabled = true;
      el.classList.add('disabled');
      el.style.pointerEvents = 'none';
    });
  }

  /* ---------------- intro ---------------- */
  function renderIntro() {
    $id('introTitle').textContent = INTRO.title;
    $id('introObject').textContent = INTRO.object;
    var b = $id('sevBadge');
    b.className = 'badge ' + SEV_CLASS[META.difficulty];
    b.innerHTML = '<span class="b-ic">' + sevIcon() + '</span> ' + esc(META.sevName);
    $id('introFacts').innerHTML =
      fact('Exercises in this file', String(EXERCISES.length)) +
      fact('Estimated time', META.estimatedMinutes + ' minutes') +
      fact('Timer budget', META.estimatedMinutes + ' min countdown') +
      fact('Pass mark', META.passMark + '%') +
      (INTRO.partLabel ? fact('Batch', INTRO.partLabel) : '');
    $id('learnBody').innerHTML = INTRO.learn.map(function (p) { return '<p>' + p + '</p>'; }).join('');
    $id('kwBody').innerHTML = INTRO.keywords.map(function (k) {
      return '<div class="kw-theme"><h3>' + esc(k.theme) + '</h3><ul class="kw-list">' +
        k.items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    $id('howBody').innerHTML = '<ul class="how-list">' + INTRO.how.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul>';
  }
  function fact(k, v) { return '<span class="fact"><b>' + esc(k) + ':</b> ' + esc(v) + '</span>'; }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) { return; }
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
    // theme field is always 'dark' — the file is dark-only, so appearance does not change.
    state.user.name = event.data.username || '';
    state.user.country = event.data.country || '';
    state.user.locale = event.data.locale || 'en';
  });

  /* ---------------- init ---------------- */
  function init() {
    renderIntro();
    renderTimerBar();
    $id('startBtn').addEventListener('click', startExam);
    $id('checkBtn').addEventListener('click', function () {
      if (state.currentIdx < 0 || state.answered[state.currentIdx]) { return; }
      onCheck();
    });
    $id('nextBtn').addEventListener('click', onNext);
    $id('skipBtn').addEventListener('click', onSkip);
    $id('hintBtn').addEventListener('click', onHint);
    $id('pauseBtn').addEventListener('click', onPauseBtn);
    $id('retakeBtn').addEventListener('click', onRetake);
    $id('finalSubmitBtn').addEventListener('click', onFinishBtn);
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); }
  else { init(); }
})();

</script>
</body>
