<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1021.002 SMB/Windows Admin Shares — EXTREMELY_HARD</title>
<style>
:root{
  --bg-page:#070c12;
  --bg-panel:#0d141d;
  --bg-surface:#111a26;
  --bg-surface-2:#0a111a;
  --bg-elev:#172335;
  --ink:#e9eff7;
  --ink-dim:#a9b9cb;
  --ink-faint:#8497ab;
  --line:#1f2b3c;
  --line-soft:#182331;
  --blue:#4aa8e8;   --blue-soft:rgba(74,168,232,.13);
  --amber:#e6aa3c;  --amber-soft:rgba(230,170,60,.13);
  --green:#41c07f;  --green-soft:rgba(65,192,127,.13);
  --red:#ef5a6a;    --red-soft:rgba(239,90,106,.15);
  --sev-easy:#41c07f;
  --sev-medium:#e6aa3c;
  --sev-hard:#f0813c;
  --sev-extreme:#ef5a6a;
  --focus:#4aa8e8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1 0 auto;width:100%;max-width:980px;margin:0 auto;padding:20px 16px 40px}
.foot{flex-shrink:0;margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:12.5px;background:var(--bg-panel)}
.foot b{color:var(--ink-dim);letter-spacing:.08em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-surface-2)}
::-webkit-scrollbar-thumb{background:#24344b;border-radius:6px;border:2px solid var(--bg-surface-2)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(8,13,20,.94);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.14em;font-size:12.5px;color:var(--green)}
.brand small{color:var(--ink-faint);letter-spacing:.05em;font-weight:600}
.tb-sep{width:1px;height:22px;background:var(--line)}
.tb-title{font-weight:700;font-size:13.5px;color:var(--ink-dim);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stat{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;font-weight:600;background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:32px}
.tb-stat .ic{font-size:13px}
.tb-stat.timer{font-family:var(--mono);color:var(--ink)}
.tb-state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px;border:1px solid}
.tb-state.manual{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.tb-state.autocheck{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.tb-btn:hover:not(:disabled){border-color:var(--blue)}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}
.tb-btn.hint{color:var(--amber)}
.tb-btn.skip{color:var(--ink-dim)}
.prog{height:3px;background:var(--line-soft)}
.prog i{display:block;height:100%;background:var(--green);width:0%;transition:width .25s}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 12px;color:#08110b}
.badge::before{content:"●";font-size:9px}
.sev-EASY{background:var(--sev-easy)}
.sev-MEDIUM{background:var(--sev-medium)}
.sev-HARD{background:var(--sev-hard)}
.sev-EXTREMELY_HARD{background:var(--sev-extreme);color:#160407}
.otype{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg-surface)}
/* ---------- intro ---------- */
.intro-head{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--bg-panel),var(--bg-surface-2));padding:26px 26px 20px;margin-bottom:16px}
.intro-head h1{margin:8px 0 4px;font-size:26px;line-height:1.25}
.intro-head .sub{color:var(--ink-dim);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-dim);background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:34px}
.chip .ic{color:var(--ink-faint)}
.cand{margin-top:12px;font-size:13px;color:var(--ink-faint)}
.intro-sec{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;background:var(--bg-panel);padding:18px 22px;margin-bottom:14px}
.intro-sec.learn{border-left-color:var(--blue)}
.intro-sec.keys{border-left-color:var(--amber)}
.intro-sec.how{border-left-color:var(--green)}
.intro-sec h2{margin:0 0 10px;font-size:15px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.intro-sec.learn p{color:var(--ink-dim);margin:0 0 10px}
.intro-sec.learn p:last-child{margin-bottom:0}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kw-card{background:var(--bg-surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 14px}
.kw-card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.kw-card ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:13.5px}
.kw-card li{margin:2px 0}
.rules{margin:0;padding:0;list-style:none}
.rules li{position:relative;padding:7px 0 7px 26px;color:var(--ink-dim);font-size:14px}
.rules li::before{content:"▸";position:absolute;left:4px;color:var(--green)}
.rules li .dim{color:var(--ink-faint)}
/* ---------- exercise card ---------- */
.excard{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--bg-panel);border:1px solid var(--line);border-left:4px solid var(--blk,var(--blue));border-radius:12px;padding:16px 20px}
.blk-scenario{--blk:var(--blue)}
.blk-question{--blk:var(--amber)}
.blk-answer{--blk:var(--green)}
.blk-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--blk,var(--ink));margin-bottom:10px}
.blk-label .dot{width:8px;height:8px;border-radius:50%;background:var(--blk,var(--ink))}
.ex-title{margin:0 0 8px;font-size:16.5px}
.summary{color:var(--ink-faint);font-size:13.5px;font-style:italic;margin:0 0 8px}
.showfull{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;min-height:32px}
.scen-body p{margin:0 0 10px;color:var(--ink-dim)}
.scen-body p:last-child{margin-bottom:0}
details.artef{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin:10px 0 0}
details.artef summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--blue);user-select:none;min-height:40px;display:flex;align-items:center}
details.artef .artbody{padding:0 14px 12px}
.mono{font-family:var(--mono);font-size:13px;line-height:1.5;color:#c8d8e6;background:var(--bg-surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:0}
table.attable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:0}
table.attable th{background:var(--bg-elev);color:var(--ink);text-align:left}
table.attable th,table.attable td{border:1px solid var(--line-soft);padding:6px 10px;color:var(--ink-dim)}
.q-text{margin:0;font-weight:700;font-size:16px;color:var(--ink)}
/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-height:44px;cursor:pointer;color:var(--ink);font-size:14.5px;font-family:var(--sans);margin:0 0 8px}
.opt:last-child{margin-bottom:0}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}
.opt .mark{font-weight:800;flex-shrink:0}
/* ---------- match ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol h4,.obank h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mleft{flex:1;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;min-height:44px;display:flex;align-items:center}
.mzone{flex:1;background:var(--bg-surface-2);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;min-height:44px;color:var(--ink-faint);font-size:13.5px;cursor:pointer;text-align:left;font-family:var(--sans)}
.mzone.filled{border-style:solid;border-color:var(--blue);color:var(--ink)}
.mzone.dragover{border-color:var(--green)}
.mzone.correct{border-color:var(--green);background:var(--green-soft)}
.mzone.wrong{border-color:var(--red);background:var(--red-soft)}
.mbank{display:flex;flex-direction:column}
.mchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;margin-bottom:8px;cursor:grab;color:var(--ink);font-size:13.5px;text-align:left;font-family:var(--sans)}
.mchip:disabled{cursor:default;opacity:.5}
.mchip.selchip{border-color:var(--amber);background:var(--amber-soft)}
.mchip.used{opacity:.35}
.mhintline{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- order ---------- */
.ordlist{list-style:none;margin:0;padding:0;counter-reset:ord}
.orditem{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.orditem.dragover{border-color:var(--green)}
.orditem .num{font-family:var(--mono);color:var(--amber);font-weight:700;min-width:22px;text-align:center}
.orditem .txt{flex:1;font-size:14px}
.orditem.correct{border-color:var(--green)}
.orditem.wrong{border-color:var(--red)}
.ordbtns{display:flex;gap:4px}
.ordbtns button{min-width:34px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);cursor:pointer;font-size:14px}
.ordbtns button:hover{border-color:var(--blue)}
/* ---------- fill ---------- */
.fillwrap{font-size:15.5px;color:var(--ink-dim);line-height:2.1;white-space:pre-wrap}
.fillin{font-family:var(--mono);font-size:13.5px;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 10px;min-height:38px;width:170px;margin:0 3px}
.fillin:focus{border-color:var(--blue);outline:none}
.fillin.correct{border-color:var(--green)}
.fillin.wrong{border-color:var(--red)}
.fbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:38px;font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer}
.fchip:hover{border-color:var(--amber)}
/* ---------- terminal ---------- */
.term{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:8px;background:var(--bg-elev);padding:8px 12px;font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.term-bar .dots{letter-spacing:3px;color:var(--red)}
.term-out{font-family:var(--mono);font-size:13px;line-height:1.55;color:#c8d8e6;padding:12px 14px;min-height:130px;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term-out .tl-dim{color:var(--ink-faint)}
.term-out .tl-danger{color:var(--red);font-weight:700}
.term-out .tl-echo{color:var(--ink)}
.term-line{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding:10px 14px}
.term-prompt{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--mono);font-size:13px;min-height:34px}
.term-in:focus{outline:none}
details.syntax{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin-top:10px}
details.syntax summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--amber);min-height:40px;display:flex;align-items:center}
details.syntax .artbody{padding:0 14px 12px}
/* ---------- logview ---------- */
.logpanel{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log-tools{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-elev);border-bottom:1px solid var(--line-soft)}
.logfilter{flex:1;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 12px;min-height:38px}
.logfilter:focus{border-color:var(--blue);outline:none}
.log-count{font-size:12px;color:var(--ink-faint);font-family:var(--mono);white-space:nowrap}
.loglines{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#bccfe0;padding:12px 14px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.loglines mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}
.wtitle{font-weight:700;margin:14px 0 10px;color:var(--ink)}
/* ---------- decision ---------- */
.dstep{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.dstep.locked{opacity:.9}
.dlabel{display:inline-flex;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue);border-radius:6px;padding:3px 9px;margin-bottom:8px}
.dprompt{font-family:var(--mono);font-size:13px;color:var(--ink-dim);background:var(--bg-surface-2);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 10px;white-space:pre-wrap}
.dq{font-weight:700;margin:0 0 10px}
.drecorded{color:var(--ink-faint);font-size:13px;margin-top:8px}
.dwhy{font-size:13.5px;color:var(--ink-dim);background:var(--bg-surface-2);border-radius:8px;padding:9px 12px;margin-top:8px}
/* ---------- hint ---------- */
.hintbox{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin-top:12px;color:var(--ink-dim)}
.hintbox .hb{color:var(--amber);font-weight:800;font-size:12px;letter-spacing:.1em;display:block;margin-bottom:4px}
.penaltynote{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- feedback ---------- */
.fb{border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.fb.ok{border-color:var(--green)}
.fb.bad{border-color:var(--red)}
.fb.part{border-color:var(--amber)}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 18px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb.ok .fb-head{background:var(--green-soft);color:var(--green)}
.fb.bad .fb-head{background:var(--red-soft);color:var(--red)}
.fb.part .fb-head{background:var(--amber-soft);color:var(--amber)}
.fb-credit{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim);font-weight:600}
.fb-body{padding:14px 18px;background:var(--bg-panel)}
.fi{display:flex;gap:9px;padding:4px 0;font-size:14px;color:var(--ink-dim)}
.fi .ic{flex-shrink:0;font-weight:800}
.fi.ok .ic{color:var(--green)}
.fi.bad .ic{color:var(--red)}
.fi.miss .ic{color:var(--ink-faint)}
.fi.warn .ic{color:var(--red)}
.fi.warn{color:var(--red);font-weight:600}
.fi.note{color:var(--ink-faint)}
.fb-explain{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:12px;color:var(--ink-dim);font-size:14px}
.fb-explain p{margin:0 0 10px}
.fb-explain p:last-child{margin-bottom:0}
.fb-study{margin-top:10px;font-size:13px;color:var(--blue)}
.fb .mono{margin-top:10px}
/* ---------- actions ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:10px 20px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-family:var(--sans)}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:transparent;color:#04120a}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-amber{background:var(--amber);border-color:transparent;color:#1c1204}
.ghost-note{color:var(--ink-faint);font-size:13px}
/* ---------- review ---------- */
.revlist{display:flex;flex-direction:column;gap:10px}
.revrow{display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex-wrap:wrap}
.revrow .rn{font-family:var(--mono);color:var(--amber);font-weight:700}
.revrow .rt{flex:1;color:var(--ink-dim);font-size:14px;min-width:200px}
.revrow .badge-skip{color:var(--ink-faint);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* ---------- results ---------- */
.res-head{border:1px solid var(--line);border-radius:14px;background:var(--bg-panel);padding:26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ring{width:172px;height:172px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--pct)*1%),var(--bg-elev) 0);display:grid;place-items:center;flex-shrink:0}
.ring .rin{width:134px;height:134px;border-radius:50%;background:var(--bg-panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:34px;font-weight:800;font-family:var(--mono)}
.ring .of{font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
.res-verdict{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.res-verdict.pass{color:var(--green)}
.res-verdict.fail{color:var(--red)}
.res-sub{color:var(--ink-dim);font-size:14px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.statcard{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.statcard .sv{font-size:22px;font-weight:800;font-family:var(--mono)}
.statcard .sv.ok{color:var(--green)}
.statcard .sv.part{color:var(--amber)}
.statcard .sv.bad{color:var(--red)}
.statcard .sv.skip{color:var(--ink-faint)}
.statcard .sl{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.pausereport{border:1px solid var(--line);border-radius:10px;background:var(--bg-panel);padding:12px 16px;color:var(--ink-dim);font-size:13.5px;margin-bottom:14px}
.restable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.restable th{background:var(--bg-elev);text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase}
.restable td{padding:8px 12px;border-top:1px solid var(--line-soft);color:var(--ink-dim)}
.restable td.num{font-family:var(--mono)}
.st-ok{color:var(--green);font-weight:700}
.st-part{color:var(--amber);font-weight:700}
.st-bad{color:var(--red);font-weight:700}
.st-skip{color:var(--ink-faint);font-weight:700}
/* ---------- overlay ---------- */

<script type="application/json" id="cm-exercise-meta">{"attackId":"T1021.002","attackName":"SMB/Windows Admin Shares","objectType":"sub-technique","severity":"EXTREMELY_HARD","topicId":"t1021.002","batch":4,"title":"T1021.002 SMB/Windows Admin Shares — EXTREMELY_HARD","difficulty":"extremely-hard","estimatedMinutes":60,"timerMinutes":60,"questionCount":18,"passMark":70,"learn":["You will learn the hardest end of T1021.002 — SMB/Windows Admin Shares: NTLM relay into admin shares, the artefacts different execution styles leave behind, and the detection engineering that separates intrusions from a hospital estate's noisy baseline.","This is a sub-technique of T1021 in the Lateral Movement tactic. In a healthcare network, admin shares are everywhere, service accounts are chatty, and a relay that looks like a care-system sync can hide inside the noise — exactly what you will drill here.","Threat hunters chase coercion and relay chains (wpad-style poisoning, bursts of failed logons, type 3 logons without sessions), incident responders sweep for PSEXESVC-style artefacts, and detection engineers write correlation rules with allowlists that stay honest.","Your daily tasks: judge conflicting signals, decide when to hold and when to escalate, harden unsigned hosts with SMB signing, and keep the artefact record clean enough for a regulator to read.","The risks are real: public reporting documents ransomware crews spreading over SMB through hospital networks. One unsigned subnet plus one relayed credential is the chain this exam teaches you to break first."],"keywords":[{"theme":"NTLM Relay & Coercion","items":["NTLM relay into SMB sessions","wpad/LLMNR-style coercion staging","4625 burst followed by type 3 logon","SMB signing required blocks relay","Extended Protection and channel binding"]},{"theme":"Artefact Forensics & Noise","items":["PSEXESVC-<hash> service names","7045/7036/4688 artefact triad","Fileless smbexec-style runs","Backup and SCCM baseline noise","Preserve-then-contain evidence order"]},{"theme":"Detection Engineering","items":["Multi-event correlation windows","Allowlists that stay honest","Cross-host repeat detection","Holding versus escalating decisions","Reporting with artefact references"]}]}</script>

var META = {"attackId":"T1021.002","attackName":"SMB/Windows Admin Shares","objectType":"sub-technique","severity":"EXTREMELY_HARD","topicId":"t1021.002","batch":4,"title":"T1021.002 SMB/Windows Admin Shares — EXTREMELY_HARD","difficulty":"extremely-hard","estimatedMinutes":60,"timerMinutes":60,"questionCount":18,"passMark":70,"learn":["You will learn the hardest end of T1021.002 — SMB/Windows Admin Shares: NTLM relay into admin shares, the artefacts different execution styles leave behind, and the detection engineering that separates intrusions from a hospital estate's noisy baseline.","This is a sub-technique of T1021 in the Lateral Movement tactic. In a healthcare network, admin shares are everywhere, service accounts are chatty, and a relay that looks like a care-system sync can hide inside the noise — exactly what you will drill here.","Threat hunters chase coercion and relay chains (wpad-style poisoning, bursts of failed logons, type 3 logons without sessions), incident responders sweep for PSEXESVC-style artefacts, and detection engineers write correlation rules with allowlists that stay honest.","Your daily tasks: judge conflicting signals, decide when to hold and when to escalate, harden unsigned hosts with SMB signing, and keep the artefact record clean enough for a regulator to read.","The risks are real: public reporting documents ransomware crews spreading over SMB through hospital networks. One unsigned subnet plus one relayed credential is the chain this exam teaches you to break first."],"keywords":[{"theme":"NTLM Relay & Coercion","items":["NTLM relay into SMB sessions","wpad/LLMNR-style coercion staging","4625 burst followed by type 3 logon","SMB signing required blocks relay","Extended Protection and channel binding"]},{"theme":"Artefact Forensics & Noise","items":["PSEXESVC-<hash> service names","7045/7036/4688 artefact triad","Fileless smbexec-style runs","Backup and SCCM baseline noise","Preserve-then-contain evidence order"]},{"theme":"Detection Engineering","items":["Multi-event correlation windows","Allowlists that stay honest","Cross-host repeat detection","Holding versus escalating decisions","Reporting with artefact references"]}]};
var EXAMS = [{"id":"e01","type":"mcq","title":"Relay preconditions","summary":"Name the combination that lets relay land.","scenario":"Corvale Health Partners' architecture review debates why one ward subnet keeps appearing in relay exercises year after year. You must state, for the record, the exact combination of conditions that lets an NTLM relay into SMB succeed on at least one target.","question":"Which combination allows an NTLM relay against SMB to succeed?","hint":"Two ingredients: something to steal and somewhere unsigned.","explanation":"A relay needs a victim's authentication (usually coerced) and a target that does not demand signatures — with signing off, the forwarded response is accepted. Kerberos-only designs, signing-plus-encryption and channel binding with EPA each remove one of those ingredients, which is why they are the recommended fixes.","study":"Study the relay triangle: coerce, capture, forward — and which control breaks each leg.","options":["Signing off plus a coerced client","Kerberos-only with AES enforced everywhere","SMB encryption with signing required together","Channel binding plus EPA on all services"],"correct":0},{"id":"e02","type":"logview","title":"DC-SITEB03 mixed export","summary":"Find the relay-shaped signal among routine lines.","scenario":"An overnight export from DC-SITEB03 mixes the 02:00 archive account, an SCCM client push, and one short burst that does not fit either. Filter for the failure-then-success pair and read what is missing from it.","question":"Compare the blocks and answer the widget question:","hint":"Relayed sessions log on but never get rights or a session shell.","explanation":"The 05:03 burst of 4625 failures followed seconds later by a type 3 success that carries no 4672 and no follow-on session is the relay shape — the account name even changes between failures. The archive account and SCCM push are documented baselines, and the 09:15 print line is routine.","study":"Study 4625 failure codes and how relay bursts pair failures with one success.","filterable":true,"log":{"header":["time","event","detail"],"lines":["02:00:00  4624  Logon Type 3  user=svc_archive  src=10[.]77[.]140[.]9   host=DC-SITEB03","02:00:00  5140  share=\\\\DC-SITEB03\\IPC$  user=svc_archive","03:10:22  4624  Logon Type 3  user=CM-PUSH$    src=10[.]77[.]140[.]41  host=DC-SITEB03","05:03:58  4625  Logon failed  user=p.vance  src=10[.]77[.]140[.]66  code=0xC0000064","05:03:59  4625  Logon failed  user=care.admin  src=10[.]77[.]140[.]66  code=0xC0000064","05:04:02  4624  Logon Type 3  user=p.vance  src=10[.]77[.]140[.]66  host=DC-SITEB03","05:04:03  5140  share=\\\\DC-SITEB03\\IPC$  user=p.vance","09:15:11  5140  share=\\\\DC-SITEB03\\PRINT$  user=l.grant"]},"widget":{"type":"mcq","question":"Which signal most strongly suggests relay rather than a tool?","options":["Type 3 logon with no 4672 and no session","The 02:00 nightly archive connection","A printer share access at 09:15","The SCCM push from CM-SRV01"],"correct":0}},{"id":"e03","type":"match","title":"Match the defence to the door","summary":"Give each control the relay path it closes.","scenario":"Corvale's hardening matrix lists four controls against relay attacks. The audit committee sits on Friday, and each row of the matrix needs the specific relay path it shuts written beside it before the pack is defended line by line.","question":"Assign each control to the relay path it closes:","hint":"One control is a firewall move, the rest are authentication hardening.","explanation":"Signing kills SMB relay, LDAP signing with channel binding kills relay into directory changes, EPA protects web endpoints that accept NTLM, and blocking outbound 445 from ward subnets contains where a relayed session can even point. Each control maps to one door; together they close the corridor.","study":"Study Microsoft's advanced NTLM mitigation guidance, including EPA and channel binding.","pairs":[{"left":"SMB signing required","right":"Relay into SMB sessions"},{"left":"LDAP signing plus channel binding","right":"Relay into directory writes"},{"left":"Extended Protection for Authentication","right":"Relay into web endpoints"},{"left":"Blocking outbound 445 from wards","right":"Workstations reaching outside SMB"}]},{"id":"e04","type":"fill","title":"Which style left this trace?","summary":"Complete the artefact comparison sentence.","scenario":"The Corvale forensics runbook opens with one paragraph that tells responders how to tell the three execution styles apart from artefacts alone, so no one waits for memory forensics to say the obvious. The paragraph was tightened after the RND-WS31 triage ran long.","question":"Complete the runbook paragraph with the correct terms:","hint":"One blank is a word, two are share names.","explanation":"PsExec's service names carry a hash suffix and its helper sits in ADMIN$; smbexec-style tooling rides the service-control pipe through IPC$ and stays fileless. C$ and PRINT$ are real shares but wrong roles here, and SYSVOL$ is a domain controller content share, not an execution staging point.","study":"Study the artefact triads: file-plus-service, service-only, and task-only styles.","text":"A PsExec-style run names its service with a hash ___ such as PSEXESVC-9C31 and leaves a helper in ___, while smbexec-style tools install short-lived services through ___ and drop no binary at all.","blanks":["suffix","ADMIN$","IPC$"],"bank":["suffix","ADMIN$","IPC$","C$","PRINT$","SYSVOL$"]},{"id":"e05","type":"decision","title":"Decision tree — finance server as source","summary":"Hold, verify, then escalate with evidence.","scenario":"05:12 — MED-FS08 logs 4624 type 3 from FIN-SRV19, a finance server that never logs on anywhere in the estate. IPC$ opens, nothing else. Six seconds later 7045 records PSEXESVC-D44E2, and no change ticket covers that window. You take the triage call.","question":"Work through the three decision steps and choose the best action at each:","hint":"The first service event is the hinge — verify before you move.","explanation":"The impossible source makes the alert stand out, but the first move is still verification: hold containment, pull the file and process evidence. Once 4688 shows the command and the output share, the case escalates with artefacts preserved. The 'do nothing yet' pattern is deliberate — premature isolation can destroy volatile evidence.","study":"Study hold-and-verify playbooks for tier-0 adjacent servers.","steps":[{"label":"STEP 1 OF 3 — hold or isolate?","prompt":"4624 type 3 from FIN-SRV19 to MED-FS08, 5140 IPC$ only, then 7045 PSEXESVC-D44E2 six seconds later.","question":"What is the proportionate first move?","options":["Hold containment and pull 5145 and 4688 first","Isolate the whole ward imaging network at once","Close it as scheduled maintenance"],"correct":0,"why":"A service install from an impossible source is serious but unconfirmed; the file and process lines decide whether this is a live intrusion or a misfiring agent, and they take seconds to pull."},{"label":"STEP 2 OF 3 — the pull lands","prompt":"4688 shows cmd.exe under PSEXESVC-D44E2 writing output back to \\\\FIN-SRV19\\C$\\temp\\out.txt.","question":"What does the evidence now support?","options":["Escalate to IR: remote execution through admin shares, confirmed","Wait for the next nightly window to recheck","Disable file sharing on the finance server for a week"],"correct":0,"why":"A command run through a hash-named service with output shipped back over an admin share is the technique executed end to end; waiting or half-measures only extend dwell time."},{"label":"STEP 3 OF 3 — preserve for IR","prompt":"IR accepts the escalation and asks what survives on MED-FS08 right now.","question":"Which move preserves the case?","options":["Snapshot memory and collect the PSEXESVC artefacts before any cleanup","Delete the PSEXESVC service to tidy the host","Reboot MED-FS08 to clear the sessions"],"correct":0,"why":"Memory, the service record and the helper binary are the case; deleting the service or rebooting erases exactly what IR needs to attribute the run."}]},{"id":"e06","type":"multi","title":"Relay claims audit","summary":"Select every statement about relay that holds.","scenario":"A Corvale Health Partners tabletop exercise produces five claims about NTLM relay to SMB. Two of them survive technical scrutiny; the other three came from a vendor webinar and must be corrected before the minutes go to the security committee.","question":"Select every statement about NTLM relay that is true:","hint":"Relay reuses material; it never learns secrets.","explanation":"Relay forwards authentication material the client produced, so signing on the target kills it and no clear-text password is ever needed. Kerberos tickets are bound to the service they were requested for, so they do not relay the same way, and SMB relay happily uses 445 — the port 139 claim is legacy folklore.","study":"Study why Kerberos binding defeats relay while unsigned NTLM invites it.","options":["Signing required on the target blocks it","The attacker forwards the client's response","Relay needs the clear-text password in hand","Kerberos tickets relay in the same way","Relay only works against legacy port 139"],"correct":[0,1]},{"id":"e07","type":"mcq","title":"PSEXESVC events: signal or noise?","summary":"Pick the only finding worth a page.","scenario":"Over one week, Corvale's rule collects PSEXESVC-style 7045 events from the patch server during its documented Thursday window on nine hosts, plus one event from QA-WS31 at 07:41 on a Saturday. The queue wants one page.","question":"Which finding is the one worth paging on?","hint":"Nine repeats inside a documented window are a baseline; one outlier is not.","explanation":"Nine identical service installs from the patch server inside its published window are a documented baseline — noisy but expected. The Saturday 07:41 event from QA-WS31 matches nothing in the change record, so it is the page. The absolutist answers either page on everything (fatigue) or nothing (dwell time).","study":"Study allowlist design: source, account, time window and name pattern all at once.","options":["Patch events inside its window","The lone 7045 from QA-WS31 at 07:41","All events from both sources at once","None: every single 7045 is an incident"],"correct":0},{"id":"e08","type":"order","title":"Anatomy of a relay run","summary":"Order the coercion-to-relay attack chain.","scenario":"Public reporting documents ransomware crews chaining name-resolution poisoning with NTLM relay into admin shares before encryption starts anywhere. In the Corvale Health Partners red-team debrief you reconstruct the operator's exact order so defenders can map each step to a control.","question":"Arrange the operator's steps into the performed order:","hint":"Coercion creates the credentials; the target must accept them unsigned.","explanation":"Attacker view: poisoning brings the client to the attacker, coercion makes it authenticate, the relay forwards what was captured, the admin share session does the work, and rotation outpaces detection. Each step has a control — name-resolution hardening, signing, egress filtering, correlation speed — which is why defenders chain fixes.","study":"Study coercion protocols (wpad/LLMNR-style) and their first-line defences.","items":["Poison name resolution so clients reach the attacker host","Coerce a client machine into authenticating with NTLM","Forward the captured response to a signing-disabled SMB target","Read or write files through the relayed admin-share session","Rotate to the next unsigned target before correlations land"]},{"id":"e09","type":"fill","title":"Rule with an honest allowlist","summary":"Complete the detection-engineering sentence.","scenario":"The Corvale detection engineering guild documents its admin-share correlation rule in one wiki sentence, so every analyst on a night shift knows the join condition, the allowlist mechanism and the escalation threshold without ever opening the rule editor itself.","question":"Complete the rule sentence with the correct terms:","hint":"One word per blank; the list type matters for honesty.","explanation":"The join lives in a correlation window, the honest mechanism for expected noise is an allowlist scoped to account and source, and the escalation trigger is repetition across hosts. A blocklist would silence everything else, retention describes storage, and pipes are the IPC$ layer, not the trigger.","study":"Study allowlist versus blocklist trade-offs in high-fidelity rules.","text":"The rule joins a 5140 hit on ADMIN$ with a 7045 event inside a short ___ window, suppresses the nightly backup account through an ___, and pages when the pair repeats across several ___ in one hour.","blanks":["correlation","allowlist","hosts"],"bank":["correlation","allowlist","hosts","retention","blocklist","pipes"]},{"id":"e10","type":"mcq","title":"One page, one finding","summary":"Pick the high-confidence item from the queue.","scenario":"The morning Corvale triage lists three candidate findings from the overnight admin-share rule. The lead allows exactly one page before the 09:00 stand-up and asks the queue to justify the pick against the change record, the allowlist and the estate baseline.","question":"Which candidate is the high-confidence finding?","hint":"Matched to a change record? Then it matched the allowlist.","explanation":"A hash-suffixed PSEXESVC service with no matching ticket or window is the classic high-confidence finding. The patch-server event sits inside its documented window, monitoring IPC$ chatter is baseline, and SYSVOL reads from a DC are ordinary domain behaviour — all three are allowlist territory, not pages.","study":"Study finding confidence: match artefact, window, account and ticket before paging.","options":["PSEXESVC-9C31 with no matching ticket","PSEXESVC-11A0 from the patch server in its window","IPC$ chatter from the monitoring cluster","SYSVOL access from a domain controller"],"correct":0},{"id":"e11","type":"decision","title":"Decision tree — relay across two wards","summary":"Four steps from coercion to hardening.","scenario":"05:03 — RND-WS31 resolves wpad to an unknown internal address, then shows a 4625 burst and a type 3 logon without rights. The relayed session opens IPC$ on RND-WS31 but the ADMIN$ write is refused — signing is enforced there. Minutes later MED-FS08, unsigned, accepts the same session. Work the four steps.","question":"Work through the four decision steps and choose the best action at each:","hint":"The blocked relay is a clue to where the next one will land.","explanation":"The chain is coercion, blocked relay (a control win), successful relay on the unsigned host, then the root-cause fix. Scoring the block as 'nothing happened' ignores a live operator, and studying an attacker live with controls off destroys the environment's safety. The final fix pairs signing with coercion hardening because either half alone leaves a leg open.","study":"Study defence-in-depth for relay: signing, EPA, coercion hardening, egress.","steps":[{"label":"STEP 1 OF 4 — read the staging","prompt":"wpad resolves to 10[.]77[.]140[.]66, then a 4625 burst and one type 3 success from the same address.","question":"What does this opening pattern represent?","options":["Coercion staging: name poisoning plus a forced authentication","Daily password typos from one nurse station","A broken SCCM client reinstalling"],"correct":0,"why":"A wpad record pointing at an unknown host followed by failures-then-success is coercion plus capture; typos do not come with wpad changes, and SCCM does not fail-logon in bursts."},{"label":"STEP 2 OF 4 — judge the blocked relay","prompt":"The relayed session opens IPC$ on RND-WS31 but the ADMIN$ write is refused — signing is enforced there.","question":"How do you score the signing block?","options":["A control win — report it and keep hunting for unsigned targets","Nothing happened, so close the case entirely","Disable signing so the session can be studied live"],"correct":0,"why":"The block proves the control works but the operator is live; the hunt moves to unsigned hosts. Disabling a control to watch an attacker is self-sabotage."},{"label":"STEP 3 OF 4 — the unsigned target","prompt":"MED-FS08, still unsigned, accepts the relayed session and logs 7045 PSEXESVC-D44E2.","question":"What does the acceptance change?","options":["Escalate: successful SMB relay through admin shares on an unsigned host","Note it and review the subnet next quarter","Blame the ward user and reset Windows only"],"correct":0,"why":"A relay that lands and installs a service is a confirmed intrusion path; quarterly reviews and device resets leave the signing gap — the actual cause — open."},{"label":"STEP 4 OF 4 — fix the cause","prompt":"IR lists both hosts and asks which change removes the root cause first.","question":"Which change comes first?","options":["Enforce SMB signing on the unsigned segment and block the coercion protocols","Order a new firewall platform and revisit signing later","Turn off NTLM audit logging to cut the noise"],"correct":0,"why":"Signing on the target plus killing coercion closes the chain at two points; a new firewall does not sign anything, and silencing the logging that found the case is how repeats go unseen."}]},{"id":"e12","type":"terminal","title":"Close the relay door on MED-FS08","summary":"Force signing locally while the GPO catches up.","scenario":"The GPO enforcing SMB signing reaches ward servers next week, but IR wants MED-FS08 hardened now, during the live case. From an elevated shell on the host you apply the server configuration that demands signatures for new sessions.","question":"Run the configuration command that requires SMB signing immediately on this host:","hint":"One cmdlet, one parameter, and the confirm flag that stops the prompt.","explanation":"Set-SmbServerConfiguration with -RequireSecuritySignature $true makes the host demand signatures, breaking any relay aimed at it, and -Confirm:$false applies the change without a prompt. Defender view: the forbidden variants undo the hardening — SMB1 back on reopens legacy unsigned dialects, and signing $false is the vulnerability itself.","study":"Study Get-SmbServerConfiguration output and which values a hardened server shows.","prompt":"admin@med-fs08>","skill":"smb-signature-hardening","knownTools":["Set-SmbServerConfiguration","Get-SmbServerConfiguration","sc.exe","wevtutil","Set-SmbShare"],"expected":"Set-SmbServerConfiguration -RequireSecuritySignature $true -Confirm:$false","elements":[{"label":"the SMB server configuration cmdlet","any":["set-smbserverconfiguration"]},{"label":"the signing parameter set to true","any":["-RequireSecuritySignature $true"]},{"label":"the non-interactive confirm flag","any":["-confirm:$false"]}],"forbidden":[{"any":["-EnableSMB1Protocol $true","-RequireSecuritySignature $false"],"why":"re-enabling SMB1 or turning signing back off would reintroduce the exact weakness this change exists to remove"}],"output":["SMB signing is now required for new sessions.","Existing unsigned sessions persist until they close.","Verify with Get-SmbServerConfiguration | Select RequireSecuritySignature."]},{"id":"e13","type":"logview","title":"RND-WS31 relay start","summary":"Name the address, account and first share.","scenario":"The merged export from RND-WS31 covers the relay's opening minute, including the poisoned name lookup and the forwarded authentication. Everything the IR ticket needs sits inside these lines, and the widget sentence wants the three values verbatim.","question":"Use the export to complete the widget sentence:","hint":"Read the first, fourth and fifth lines in order.","explanation":"The DNS line names 10[.]77[.]140[.]66 as the poisoned endpoint, the 05:04:03 logon names p.vance, and the first 5140 names IPC$ — the ADMIN$ attempt right after was denied by signing. RND-WS31 is the victim host and svc_sql is a later failure, so both are wrong for these blanks.","study":"Study writing IR tickets: address, account, first artefact — verbatim from logs.","filterable":true,"log":{"header":["time","source","detail"],"lines":["05:03:11  DNS     wpad lookup resolved to 10[.]77[.]140[.]66 host=RND-WS31","05:03:40  Sys3    netconn dst=10[.]77[.]140[.]66:80 user=-","05:04:02  Sys3    netconn dst=10[.]77[.]140[.]66:445 user=corp\\p.vance","05:04:03  4624    Logon Type 3 user=p.vance src=10[.]77[.]140[.]66 host=RND-WS31","05:04:04  5140    share=\\\\RND-WS31\\IPC$ user=p.vance","05:04:05  5140    share=\\\\RND-WS31\\ADMIN$ user=p.vance access=denied","05:04:06  4625    Logon failed user=svc_sql src=10[.]77[.]140[.]66 code=0xC000006A"]},"widget":{"type":"fill","question":"Complete the IR-ticket sentence with exact values:","text":"The wpad record pointed at ___, the relayed account was ___, and the first share the relayed session opened was ___.","blanks":["10[.]77[.]140[.]66","p.vance","IPC$"],"bank":["10[.]77[.]140[.]66","p.vance","IPC$","RND-WS31","ADMIN$","svc_sql"]}},{"id":"e14","type":"terminal","title":"Sweep the terminal server","summary":"Enumerate ADMIN$ for stray helper binaries.","scenario":"IR suspects a leftover PsExec helper on terminal server SVR-TERM02 after the 05:38 relayed run. From workstation ws-ir4 you need a recursive, bare listing of ADMIN$ so the artefact hunt can quote full paths into the ticket — read-only, nothing deleted.","question":"Run the command that produces a recursive bare listing of the ADMIN$ share on SVR-TERM02:","hint":"Two switches: recurse, then bare paths.","explanation":"dir with /s /b walks ADMIN$ recursively and prints full paths, perfect for quoting artefacts into the IR ticket. The delete-family variants are the trap: the sweep exists to preserve evidence, and wiping entries from the Windows folder would destroy the case and break the server.","study":"Study dir switches (/s, /b, /a) and quoting full arte /* ==== utils ==== */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function norm(s){
  return String(s == null ? "" : s).toLowerCase().replace(/\s+/g," ").replace(/[.,;:!]+$/,"").trim();
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function fmt1(n){ return (Math.round(n * 100) / 100).toFixed(1); }
function wordCount(s){ return String(s || "").split(/\s+/).filter(Boolean).length; }
function $(id){ return document.getElementById(id); }
function byClass(root, cls){ return root.getElementsByClassName(cls); }

/* ==== timer ==== */
function setTimerState(next){
  var now = Date.now();
  if(S.tStateAt != null){
    var dt = (now - S.tStateAt) / 1000;
    if(S.tState === "PAUSED_MANUAL") S.pauseManual += dt;
    if(S.tState === "PAUSED_AUTO_CHECK") S.pauseAutoCheck += dt;
  }
  S.tState = next;
  S.tStateAt = now;
  updateHeader();
}
setInterval(function(){
  if(S.tState === "RUNNING"){
    S.remaining -= 1;
    S.elapsed += 1;
    if(S.remaining <= 0){
      S.remaining = 0;
      updateClock();
      finish();
      return;
    }
    updateClock();
  }
}, 1000);
function updateClock(){ var c = $("tb-clock"); if(c) c.textContent = fmtClock(S.remaining); }

function sevClass(){ return "sev-" + META.severity; }
function curPos(){ return S.order[S.idx]; }
function answeredCount(){
  var n = 0;
  for(var k in S.checked){ if(Object.prototype.hasOwnProperty.call(S.checked, k)) n++; }
  return n;
}
function pendingSkips(){
  return S.skipList.filter(function(i){ return !S.checked[i]; });

  var counter = $("tb-counter"), stateEl = $("tb-state");
  var total = EXAMS.length, done = answeredCount();
  if(S.screen === "exam" || S.screen === "review"){
    counter.textContent = (S.phase === "review" && S.reviewPos >= 0)
      ? ("Review " + (S.reviewPos + 1) + " / " + (S.reviewTotal || pendingSkips().length))
      : ((S.phase === "review") ? ("Review pool: " + pendingSkips().length)
      : ("Exercise " + (S.idx + 1) + " / " + total));
  } else {
    counter.textContent = "Exercises " + done + " / " + total;
  }
  var sev = $("tb-sev");
  sev.className = "badge " + sevClass();
  sev.textContent = META.severity.replace("_", " ");
  updateClock();
  $("tb-scoreval").textContent = fmt1(S.score);
  $("progbar").style.width = (total ? (done / total * 100) : 0) + "%";

  if(S.tState === "PAUSED_MANUAL"){
    stateEl.hidden = false;
    stateEl.className = "tb-state manual";
    stateEl.innerHTML = '<span aria-hidden="true">⏸</span> Paused (manual)';

    stateEl.hidden = false;
    stateEl.className = "tb-state autocheck";
    stateEl.innerHTML = '<span aria-hidden="true">⏸</span> Auto-paused — checking';
  } else {
    stateEl.hidden = true;
  }
  /* buttons */
  var ex = curPos();
  var inExercise = (S.screen === "exam" || S.screen === "review") && ex != null && S.tState !== "ENDED";
  $("btn-hint").disabled = !inExercise || S.checked[ex] != null || S.hintsUsed[ex] === true;
  $("btn-skip").disabled = !inExercise || S.checked[ex] != null || S.phase === "review";
  $("btn-pause").disabled = !(S.tState === "RUNNING" || S.tState === "PAUSED_AUTO_CHECK");
}

/* ==== postMessage integration ==== */
window.addEventListener("message", function(ev){
  var d = ev.data;
  if(!d || typeof d !== "object") return;
  if(d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT"){
    S.init = d;
    var slot = $("candline");
    if(slot && d.username){
      slot.textContent = "Candidate: " + d.username + (d.country ? " · " + d.country : "");
      slot.style.display = "block";
    }
  }
});
function postScore(){
  if(S.scorePosted) return;
  S.scorePosted = true;
  var rounded = Math.round(S.score);
  var total = 0, i;
  for(i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null) total++;
  }
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var msg = {
    type: "CYBERPULSE_SCORE",
    topicId: META.topicId,
    batch: META.batch,
    score: rounded,
    total: total,
    percent: percent,
    passed: passed
  };
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage(msg, location.origin);
    }
  }catch(e){ /* standalone file:// — no parent handshake */ }
}

/* ==== answer defaults ==== */
function defaultAnswer(ex){
  var i, d;
  switch(ex.type){
    case "mcq": return { sel: -1 };
    case "multi": return { sel: [] };
    case "match":
      d = []; for(i = 0; i < ex.pairs.length; i++) d.push(-1); return { assign: d };
    case "order":
      d = []; for(i = 0; i < ex.items.length; i++) d.push(i);
      return { seq: shuffle(d) };
    case "fill":
      d = []; for(i = 0; i < ex.blanks.length; i++) d.push(""); return { vals: d };
    case "terminal": return { cmd: "" };
    case "logview": return { w: defaultAnswer(ex.widget) };
    case "decision":
      d = []; for(i = 0; i < ex.steps.length; i++) d.push(-1); return { steps: d, cursor: 0 };
  }
  return {};
}
function ensureAnswer(ex, i){
  if(S.answers[i] == null) S.answers[i] = defaultAnswer(ex);
  return S.answers[i];
}

/* ==== render exercise ==== */

  S.screen = "exam";

  } else {
    if(collapsed) html += '<p class="summary">' + esc(ex.summary) + "</p>";

  /* question block */

      (S.phase === "review" ? "Back to review list" : (lastMain ? "Final submit &amp; results" : "Next exercise")) +
    "</button>" +
