<style>
:root{

  --accent-amber:#ffb454;
  --accent-green:#57d38c;

  --state-partial:#ffb454;
  --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0;
  --state-paused:#9d7bff;
  --sev-easy:#57d38c;
  --sev-medium:#ffb454;
  --sev-hard:#ff8a3d;
  --sev-extreme:#ff6b6b;
  --sev-easy-bg:rgba(87,211,140,.13);
  --sev-medium-bg:rgba(255,180,84,.13);
  --sev-hard-bg:rgba(255,138,61,.13);
  --sev-extreme-bg:rgba(255,107,107,.13);
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"Cascadia Code",Consolas,"SF Mono",Menlo,"Liberation Mono","Courier New",monospace;
  /* derived surface + tint tokens (all colour literals live here, once) */
  --btn-bg:#182238;
  --btn-bg-hover:#1c2a48;
  --accent-blue-strong:#7abcff;
  --accent-green-strong:#7ce3ab;
  --on-primary:#06121f;
  --on-green:#05130b;
  --opt-bg-hover:#132038;
  --input-bg:#0b1322;
  --term-bg:#070d1a;
  --hdr-bg:rgba(13,19,36,.97);
  --progress-track:#0d1428;
  --kw-blue:#7fd0ff;
  --tint-green:rgba(87,211,140,.08);
  --tint-green-2:rgba(87,211,140,.09);
  --tint-green-3:rgba(87,211,140,.1);
  --tint-amber:rgba(255,180,84,.08);
  --tint-amber-2:rgba(255,180,84,.06);
  --tint-amber-border:rgba(255,180,84,.45);
  --tint-red:rgba(255,107,107,.1);
  --tint-blue:rgba(90,169,255,.05);
  --tint-overlay:rgba(7,10,22,.88);
  --sheen:rgba(255,255,255,.35);
  --tint-overlay:rgba(7,10,22,.88);
  --sheen:rgba(255,255,255,.35);
  --tint-overlay:rgba(7,10,22,.88);
  --sheen:rgba(255,255,255,.35);
  --shadow-a:0 8px 22px rgba(0,0,0,.28);
  --shadow-b:0 6px 18px rgba(0,0,0,.35);
  --shadow-c:0 6px 16px rgba(0,0,0,.25);
  --shadow-d:0 10px 26px rgba(0,0,0,.4);
}
html,body{margin:0;padding:0;}
html{color-scheme:dark;}
body{
  background:var(--bg-page);
  color:var(--text-primary);
  font-family:var(--font-ui);
  font-size:16px;
  line-height:1.55;
  min-height:100vh;
}
body.sev-easy{--sev:var(--sev-easy);--sev-bg:var(--sev-easy-bg);}
body.sev-medium{--sev:var(--sev-medium);--sev-bg:var(--sev-medium-bg);}
body.sev-hard{--sev:var(--sev-hard);--sev-bg:var(--sev-hard-bg);}
body.sev-extreme{--sev:var(--sev-extreme);--sev-bg:var(--sev-extreme-bg);}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 60px;}
.hidden{display:none !important;}
button{font-family:var(--font-ui);}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px;}
.ic{font-style:normal;font-weight:700;}

/* ---------- sticky exam header ---------- */
#hdr{
  position:sticky;top:0;z-index:40;
  background:var(--hdr-bg);
  border-bottom:1px solid var(--border);
  box-shadow:var(--shadow-b);
}
#hdrIn{
  max-width:1000px;margin:0 auto;padding:10px 16px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
}
.hdr-title{font-weight:700;font-size:15px;color:var(--text-primary);margin-right:4px;}
.hdr-title .mono{font-family:var(--font-mono);}
.sev-badge{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--sev);color:var(--sev);background:var(--sev-bg);
  border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800;letter-spacing:.07em;
  min-height:30px;
}
.sev-badge .dot{width:9px;height:9px;border-radius:50%;background:var(--sev);}
.chipstat{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--border);border-radius:999px;
  background:var(--bg-surface);padding:6px 12px;font-size:13.5px;color:var(--text-primary);
  min-height:34px;
}
.chipstat .lbl{color:var(--text-secondary);}
.chipstat .mono{font-family:var(--font-mono);font-weight:700;}
.chipstat.ts-run{color:var(--text-primary);}
.chipstat.ts-paused{color:var(--state-paused);border-color:var(--state-paused);}
.chipstat.ts-ended{color:var(--state-incorrect);border-color:var(--state-incorrect);}
.score-sum{font-weight:800;}
.hdr-spacer{flex:1;}
.btn{
  min-height:44px;padding:9px 18px;border-radius:6px;cursor:pointer;
  border:1px solid var(--border);background:var(--btn-bg);color:var(--text-primary);
  font-weight:600;font-size:14.5px;transition:background .15s,border-color .15s;
}
.btn:hover{border-color:var(--accent-blue);background:var(--btn-bg-hover);}
.btn.primary{background:var(--accent-blue);border-color:var(--accent-blue);color:var(--on-primary);font-weight:800;}
.btn.primary:hover{background:var(--accent-blue-strong);}
.btn.green{background:var(--accent-green);border-color:var(--accent-green);color:var(--on-green);font-weight:800;}
.btn.green:hover{background:var(--accent-green-strong);}
.btn.ghost{background:transparent;}
.btn.danger{background:transparent;border-color:var(--state-incorrect);color:var(--state-incorrect);}
.btn.danger:hover{background:var(--tint-red);}
.btn.small{min-height:44px;padding:6px 13px;font-size:13.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn .ic{margin-right:4px;}

/* ---------- progress bar ---------- */
#progressWrap{position:sticky;top:57px;z-index:39;height:6px;background:var(--progress-track);border-bottom:1px solid var(--border);}
#progressBar{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--sev),var(--accent-blue));
  border-radius:0 3px 3px 0;position:relative;overflow:hidden;
  transition:width .4s ease;
}
#progressBar::after{
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,var(--sheen),transparent);
  animation:sheen 2.8s linear infinite;
}
@keyframes sheen{to{left:110%;}}

/* ---------- cards / blocks ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-a);}
.blk{background:var(--bg-surface);border:1px solid var(--border);border-left:4px solid var(--accent-blue);border-radius:8px;margin:16px 0;box-shadow:var(--shadow-c);}
.blk.b-q{border-left-color:var(--accent-amber);}
.blk.b-ans{border-left-color:var(--accent-green);}
.blk-head{
  display:flex;align-items:center;gap:9px;padding:10px 14px;
  border-bottom:1px solid var(--border);font-weight:800;font-size:13.5px;letter-spacing:.09em;
}
.b-scen>.blk-head{color:var(--accent-blue);}
.b-q>.blk-head{color:var(--accent-amber);}
.b-ans>.blk-head{color:var(--accent-green);}
.blk-head .ic{font-size:15px;}
.blk-body{padding:14px 16px;}
.ex-meta{color:var(--text-secondary);font-size:13.5px;margin:12px 2px 0;}
.ex-type{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
  border-radius:999px;padding:3px 11px;font-size:12px;color:var(--text-secondary);
  background:var(--bg-surface);letter-spacing:.05em;
}

/* ---------- scenario / artefacts ---------- */
.sc-toggle{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:transparent;border:none;color:var(--text-secondary);
  padding:10px 14px;cursor:pointer;font-size:13.5px;min-height:44px;
}
.sc-toggle:hover{color:var(--text-primary);}
.sc-toggle .sum{flex:1;}
.sc-toggle .state-word{font-size:12px;letter-spacing:.06em;border:1px solid var(--border);border-radius:999px;padding:2px 10px;color:var(--text-secondary);}
.sc-panels{padding:2px 14px 14px;}
.art{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;margin:10px 0;overflow:hidden;}
.art-label{
  font-family:var(--font-mono);font-size:12px;color:var(--accent-blue);
  padding:8px 12px 2px;letter-spacing:.07em;font-weight:700;
}
.art-body{padding:8px 12px 12px;font-size:15px;}
.art-body p{margin:6px 0;}
.prose p{margin:8px 0;}
.mono{font-family:var(--font-mono);}
code.inline{
  font-family:var(--font-mono);font-size:14px;color:var(--text-mono);
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;
}

/* ---------- log viewer ---------- */
.log-tools{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px dashed var(--border);}
.log-filter{
  flex:1;max-width:340px;min-height:44px;background:var(--input-bg);border:1px solid var(--border);
  color:var(--text-mono);font-family:var(--font-mono);font-size:13.5px;border-radius:4px;padding:6px 10px;
}
.log-count{font-size:12.5px;color:var(--text-secondary);font-family:var(--font-mono);}
.log{font-family:var(--font-mono);font-size:13.8px;line-height:1.6;padding:10px 12px;overflow-x:auto;white-space:pre;color:var(--text-mono);}
.logline{display:block;}
.logline.off{display:none;}
.lg-t{color:var(--text-secondary);}
.lg-ev{color:var(--accent-blue);font-weight:700;}
.lg-val{color:var(--accent-amber);}
.lg-str{color:var(--accent-green);}
.lg-kw{color:var(--kw-blue);font-weight:700;}
.lg-warn{color:var(--state-incorrect);font-weight:700;}
.lg-dim{color:var(--text-secondary);}

/* ---------- answer widgets ---------- */
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;
  padding:12px 14px;margin:9px 0;min-height:44px;color:var(--text-primary);
  cursor:pointer;font-size:15.5px;line-height:1.5;transition:border-color .15s,background .15s;
}
.opt:hover{border-color:var(--accent-blue);background:var(--opt-bg-hover);}
.opt .opx{color:var(--text-secondary);font-weight:800;flex:0 0 auto;}
.opt.sel{
  border-color:var(--accent-green);box-shadow:inset 4px 0 0 var(--accent-green);
  background:var(--tint-green);
}
.opt.sel .selmark{margin-left:auto;color:var(--accent-green);font-weight:700;font-size:13px;white-space:nowrap;}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;min-height:52px;}
.chip{
  display:inline-flex;align-items:center;gap:8px;min-height:44px;
  background:var(--bg-surface-2);border:1px dashed var(--border);border-radius:6px;
  padding:8px 14px;color:var(--text-primary);font-size:14.5px;cursor:grab;user-select:none;
}
.chip.sel{border-color:var(--accent-amber);box-shadow:0 0 0 1px var(--accent-amber);}
.chip.dragging{opacity:.45;}
.chip .rm{border:none;background:transparent;color:var(--state-incorrect);cursor:pointer;font-size:15px;padding:2px 4px;min-height:44px;min-width:44px;}
.slots{display:grid;gap:12px;margin-top:6px;}
.slot{
  border:1px dashed var(--border);border-radius:8px;background:var(--tint-blue);
  padding:10px 12px;min-height:60px;transition:border-color .15s,background .15s;
}
.slot.over{border-color:var(--accent-green);background:var(--tint-green-2);border-style:solid;}
.slot-label{font-family:var(--font-mono);font-size:12.5px;color:var(--accent-blue);letter-spacing:.06em;font-weight:700;margin-bottom:6px;display:flex;gap:8px;align-items:center;}
.slot-label .cap{color:var(--text-secondary);font-weight:400;}
.slot .bank{margin:4px 0 0;}
.selrow{
  display:grid;grid-template-columns:1fr minmax(220px,340px);gap:12px;align-items:center;
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;
  padding:10px 12px;margin:9px 0;
}
.selrow .left{font-size:15px;}
.selrow .left .sub{display:block;color:var(--text-secondary);font-size:13px;margin-top:2px;}
select,input[type=text].fillin{
  min-height:44px;background:var(--input-bg);border:1px solid var(--border);color:var(--text-primary);
  border-radius:4px;padding:8px 10px;font-size:14.5px;font-family:var(--font-ui);width:100%;
}
select:focus,input[type=text]:focus{border-color:var(--accent-blue);}
input[type=text].fillin{font-family:var(--font-mono);}
.fill-sent{font-size:16px;line-height:2;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:12px 14px;}
.fill-sent input{width:200px;margin:0 4px;display:inline-block;}
.ord-list{margin:6px 0;}
.ord-item{
  display:flex;gap:10px;align-items:center;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:9px 0;
  min-height:48px;cursor:grab;font-size:15px;
}
.ord-item.dragging{opacity:.4;}
.ord-item.over{border-color:var(--accent-green);border-style:solid;}
.ord-handle{color:var(--text-secondary);font-size:15px;letter-spacing:2px;}
.ord-btns{display:flex;gap:6px;margin-left:auto;}
.ord-btns .btn{min-height:44px;min-width:44px;padding:4px 10px;font-size:14px;}
.step-tag{
  display:inline-flex;gap:6px;align-items:center;border:1px solid var(--accent-amber);
  color:var(--accent-amber);border-radius:999px;font-size:12px;font-weight:800;
  padding:2px 10px;letter-spacing:.07em;margin:4px 0 8px;
}
.branch-step{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:12px 0;background:var(--bg-surface-2);}
.branch-step.done{opacity:.92;border-style:dashed;}
.branch-step .bq{font-weight:700;margin-bottom:8px;}
.alert-card{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:10px 0;}
.alert-card .a-title{display:flex;gap:10px;align-items:center;font-weight:700;}
.alert-card .a-id{font-family:var(--font-mono);color:var(--accent-blue);font-size:13px;}
.alert-card .a-meta{color:var(--text-secondary);font-size:13.5px;margin:6px 0;}
.prio-wrap{display:flex;flex-direction:column;gap:0;}
.rank-badge{
  flex:0 0 30px;height:30px;border-radius:50%;border:1px solid var(--sev);color:var(--sev);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--font-mono);font-size:14px;
}

/* ---------- terminal ---------- */
.term{background:var(--term-bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:10px 0;}
.term-head{
  display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--input-bg);
  border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:12.5px;color:var(--text-secondary);
}
.term-dot{width:10px;height:10px;border-radius:50%;background:var(--border);}
.term-dot.g{background:var(--accent-green);}
.term-scroll{max-height:230px;overflow-y:auto;padding:10px 12px;font-family:var(--font-mono);font-size:14px;color:var(--text-mono);white-space:pre-wrap;word-break:break-word;}
.term-line .p{color:var(--accent-green);font-weight:700;}
.term-line.err{color:var(--state-incorrect);}
.term-line.ok{color:var(--accent-green);}
.term-in{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--border);align-items:center;}
.term-in .p{font-family:var(--font-mono);color:var(--accent-green);font-weight:700;font-size:14px;white-space:nowrap;}
.term-in input{
  flex:1;min-height:44px;background:var(--input-bg);border:1px solid var(--border);color:var(--text-mono);
  font-family:var(--font-mono);font-size:14px;border-radius:4px;padding:8px 10px;
}
.syntax-panel{
  background:var(--bg-surface-2);border:1px solid var(--border);border-left:4px solid var(--accent-blue);
  border-radius:6px;padding:10px 14px;margin:10px 0;font-size:14px;
}
.syntax-panel .sp-title{font-family:var(--font-mono);font-size:12px;color:var(--accent-blue);font-weight:700;letter-spacing:.07em;margin-bottom:6px;}
.syntax-panel code{font-family:var(--font-mono);color:var(--text-mono);font-size:13.5px;display:block;margin:3px 0;}
.syntax-panel .cm{color:var(--text-secondary);}
.codeblock{position:relative;background:var(--term-bg);border:1px solid var(--border);border-radius:6px;margin:10px 0;}
.codeblock code{display:block;font-family:var(--font-mono);font-size:14px;color:var(--text-mono);padding:12px 14px;white-space:pre-wrap;word-break:break-word;}
.codeblock .copy{
  position:absolute;top:6px;right:6px;min-height:44px;min-width:44px;padding:2px 12px;font-size:12px;
  background:var(--bg-surface);border:1px solid var(--border);border-radius:4px;color:var(--text-secondary);cursor:pointer;
}
.codeblock .copy:hover{color:var(--text-primary);border-color:var(--accent-blue);}

/* ---------- hint / feedback ---------- */
.hint-panel{
  border:1px solid var(--tint-amber-border);background:var(--tint-amber);
  border-radius:6px;padding:10px 14px;margin:12px 0;color:var(--text-primary);font-size:15px;
}
.hint-panel .hp-head{color:var(--accent-amber);font-weight:800;font-size:13px;letter-spacing:.07em;display:flex;gap:7px;align-items:center;margin-bottom:4px;}
.fb{border:1px solid var(--border);border-left:5px solid var(--state-correct);border-radius:8px;background:var(--bg-surface);margin:16px 0 0;box-shadow:var(--shadow-c);}
.fb.correct{border-left-color:var(--state-correct);}
.fb.partial{border-left-color:var(--state-partial);}
.fb.incorrect{border-left-color:var(--state-incorrect);}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:800;letter-spacing:.06em;font-size:15px;flex-wrap:wrap;}
.fb.correct .fb-head{color:var(--state-correct);}
.fb.partial .fb-head{color:var(--state-partial);}
.fb.incorrect .fb-head{color:var(--state-incorrect);}
.fb-credit{
  font-family:var(--font-mono);font-size:12.5px;border:1px solid var(--border);
  border-radius:999px;padding:2px 10px;color:var(--text-secondary);font-weight:400;letter-spacing:0;
}
.fb-body{padding:4px 16px 16px;color:var(--text-primary);font-size:15px;}
.fb-body h4{margin:12px 0 6px;font-size:14px;color:var(--text-secondary);letter-spacing:.05em;font-weight:700;}
.itemrow{
  display:flex;gap:10px;align-items:flex-start;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:6px;padding:9px 12px;margin:7px 0;font-size:14.5px;
}
.itemrow .ic{flex:0 0 auto;margin-top:1px;}
.ic-ok{color:var(--state-correct);}
.ic-bad{color:var(--state-incorrect);}
.ic-miss{color:var(--state-skipped);}
.ic-part{color:var(--state-partial);}
.ic-pause{color:var(--state-paused);}
.study{border:1px dashed var(--accent-amber);border-radius:6px;background:var(--tint-amber-2);padding:10px 12px;margin-top:10px;font-size:14.5px;}
.study b{color:var(--accent-amber);}
.actionbar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center;}

/* ---------- pause overlay ---------- */
#pauseOverlay{
  position:fixed;inset:0;z-index:60;background:var(--tint-overlay);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.pauseBox{max-width:460px;width:100%;padding:26px;text-align:center;}
body.paused-blur #exam,body.paused-blur #review{filter:blur(16px);}
body.paused-blur #hdr{filter:blur(4px);}
.pauseBox .big{font-size:40px;color:var(--state-paused);}
.pauseBox h2{margin:8px 0 6px;color:var(--state-paused);letter-spacing:.06em;}
.pauseBox p{color:var(--text-secondary);}

/* ---------- intro screen ---------- */
.intro-hero{padding:22px 24px;margin-top:24px;}
.ih-title{font-size:26px;font-weight:800;margin:0 0 4px;letter-spacing:.01em;}
.ih-obj{color:var(--text-secondary);font-size:15px;margin:0 0 14px;}
.ih-obj .mono{color:var(--accent-blue);}
.facts{display:flex;flex-wrap:wrap;gap:10px;}
.fact{
  border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);
  padding:10px 14px;min-width:130px;
}
.fact .fl{font-size:12px;color:var(--text-secondary);letter-spacing:.07em;font-weight:700;}
.fact .fv{font-size:16.5px;font-weight:800;margin-top:3px;}
.fact .fv .mono{font-size:15.5px;}
.intro-sec{margin-top:18px;padding:20px 24px;}
.sec-h{
  display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;
  color:var(--text-primary);margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--border);
}
.sec-h .ic{color:var(--accent-blue);}
.prose{font-size:15.5px;color:var(--text-primary);}
.prose p{margin:10px 0;}
.kw-theme{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 16px;margin:12px 0;}
.kw-theme h4{margin:0 0 8px;font-size:14px;color:var(--accent-blue);letter-spacing:.06em;display:flex;gap:8px;align-items:center;}
.kw-list{display:flex;flex-wrap:wrap;gap:8px;}
.kw{
  border:1px solid var(--border);border-radius:999px;background:var(--bg-surface);
  color:var(--text-primary);font-size:13.5px;padding:4px 12px;
}
.how-list{margin:8px 0 0;padding:0 0 0 2px;list-style:none;}
.how-list li{
  display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--border);
  font-size:15px;
}
.how-list li:last-child{border-bottom:none;}
.how-list .ic{flex:0 0 auto;margin-top:1px;}
.startrow{margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.startrow .note{color:var(--text-secondary);font-size:13.5px;}

/* ---------- review screen ---------- */
.rev-item{
  display:flex;gap:12px;align-items:center;justify-content:space-between;
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;
  padding:12px 16px;margin:10px 0;flex-wrap:wrap;
}
.rev-item .r-l{display:flex;gap:10px;align-items:center;font-size:15px;}
.rev-item .sk{
  color:var(--state-skipped);font-weight:700;font-size:13px;border:1px solid var(--border);
  border-radius:999px;padding:2px 10px;display:inline-flex;gap:6px;align-items:center;
}

/* ---------- results ---------- */
.res-hero{padding:24px;margin-top:24px;text-align:left;}
.res-pct{font-size:44px;font-weight:800;}
.res-pct .mono{font-size:30px;}
.verdict{
  display:inline-flex;align-items:center;gap:10px;border-radius:10px;padding:10px 20px;
  font-size:22px;font-weight:800;letter-spacing:.08em;margin-top:6px;
}
.verdict.pass{border:1px solid var(--state-correct);color:var(--state-correct);background:var(--tint-green-3);}
.verdict.fail{border:1px solid var(--state-incorrect);color:var(--state-incorrect);background:var(--tint-red);}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:18px;}
.res-cell{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;}
.res-cell .rl{font-size:12.5px;color:var(--text-secondary);font-weight:700;letter-spacing:.06em;display:flex;gap:7px;align-items:center;}
.res-cell .rv{font-size:24px;font-weight:800;margin-top:4px;}
.res-cell .rv small{font-size:13px;color:var(--text-secondary);font-weight:600;}
.res-list{margin-top:14px;}
.res-row{
  display:flex;gap:10px;align-items:center;justify-content:space-between;
  border:1px solid var(--border);border-radius:6px;background:var(--bg-surface-2);
  padding:8px 12px;margin:7px 0;font-size:14px;flex-wrap:wrap;
}
.res-row .rr-cred{font-family:var(--font-mono);font-weight:700;}
.timer-stats{margin-top:16px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 16px;font-size:14.5px;}
.timer-stats .ts-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;flex-wrap:wrap;}
.timer-stats .ts-row .k{color:var(--text-secondary);}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--bg-surface);border:1px solid var(--accent-amber);color:var(--text-primary);
  border-radius:8px;padding:10px 18px;font-size:14.5px;z-index:80;box-shadow:var(--shadow-d);
}

/* ---------- responsive ---------- */
@media (max-width:780px){
  .selrow{grid-template-columns:1fr;}
  select{max-width:100%;}
  .hdr-title{width:100%;}
  #hdrIn{gap:8px;}
  .ih-title{font-size:21px;}
  .blk-body,.intro-sec,.intro-hero{padding:14px;}
}
@media (prefers-reduced-motion:reduce){
  #progressBar{transition:none;}
  #progressBar::after{animation:none;display:none;}
  *{transition:none !important;}
}
</style>

</main>

<script>

/* =====================================================================

var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var PAYLOAD = {"docTitle": "T1547.014 — MEDIUM practice exam", "sevCls": "sev-medium", "sevName": "MEDIUM", "objId": "T1547.014", "objName": "Boot or Logon Autostart Execution: Active Setup", "objShort": "Active Setup", "budgetSec": 2100, "exercises": [{"id": "M-01", "type": "match", "extype": "Matching (4 pairs)", "scenario": {"summary": "Component anatomy — one artefact, four registry values, four jobs", "prose": "<p>You export one Installed Component during a health check. It contains four values. Match each value to the job it does inside Active Setup.<\/p>", "arts": [{"label": "ARTEFACT 1 — Component {F3C1A9D2-7B44-4E0F-9A18-5C2D60E8B7A1}", "kind": "log", "lines": ["Key:    HKLM\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components\\{F3C1A9D2-7B44-4E0F-9A18-5C2D60E8B7A1}", "(Default)     REG_SZ      Contoso Suite First-Run", "StubPath      REG_SZ      msiexec /Fpums {90160000-0011-0000-0000-0000000FF1CE} /Qn", "Version       REG_SZ      4,2,0,1", "IsInstalled   REG_DWORD   0x00000001"]}]}, "prompt": "Match each value to its job.", "hint": "One value holds the command, one controls version comparison, one is an on/off switch, one is just a display name.", "exp": "<p><b>StubPath<\/b> holds the command line executed at logon — the value every attacker needs. <b>Version<\/b> is four comma-separated numbers; Windows compares it with the user part to decide whether to run. <b>IsInstalled<\/b> is the switch: 0 means the command will not run. <b>(Default)<\/b> is only a display name shown in the old Active Setup dialog — handy for Masquerading, harmless otherwise.<\/p>", "study": "Version format is commas, never dots — a dotted string does not compare correctly.", "pairs": [["StubPath", "The command line that Windows executes at logon", "StubPath is the value an attacker must set — its data is the executed command.", "executes the command"], ["Version", "Four comma-separated numbers compared against the user part to decide a re-run", "If the machine part's Version is higher than the user's stored copy, the command runs again.", "controls re-runs"], ["IsInstalled", "A switch: 0 stops the component's command from running", "IsInstalled = 0 disables the component; 1 (or absent) allows the once-per-user run.", "on/off switch"], ["(Default)", "A friendly component name shown in the Active Setup dialog", "The (Default) value is cosmetic — which is why attackers give it a legitimate-looking name.", "display name"]]}, {"id": "M-02", "type": "qcm", "extype": "Multiple choice", "scenario": {"summary": "Version arithmetic — machine part 7,0,0,0 against user part 6,0,0,0", "prose": "<p>An existing component has Version <span class='mono'>7,0,0,0<\/span> in HKLM. One user's HKCU copy still stores <span class='mono'>6,0,0,0<\/span>. The user logs on tomorrow morning.<\/p>", "arts": [{"label": "ARTEFACT 1 — Version state", "kind": "log", "lines": ["HKLM  ...\\Installed Components\\{GUID}\\Version = 7,0,0,0", "HKCU  ...\\Installed Components\\{GUID}\\Version = 6,0,0,0   (stored from the last run)"]}]}, "prompt": "What happens at that user's next logon?", "hint": "Compare the two numbers first. Then remember what Windows does after running the command.", "exp": "<p>The machine version is <b>higher<\/b> than the user's stored copy, so Active Setup runs the StubPath command again and then copies <span class='mono'>7,0,0,0<\/span> into the user part. This is the documented re-run rule — and the exact lever attackers pull: raise the machine Version, and every existing user re-executes the payload at their next logon. No new key is created, which is why &ldquo;alert on new keys only&rdquo; misses it.<\/p>", "study": "Machine Version &gt; user Version means: run again, then copy the version down to the user part.", "opts": [{"t": "The StubPath command runs again, then the user part is updated to 7,0,0,0", "ok": true, "why": "Correct. Higher machine version means re-run; afterwards the version is copied to the user part."}, {"t": "Nothing runs — both parts keep their values", "ok": false, "why": "Wrong. A higher machine version is precisely the trigger to run again."}, {"t": "Windows sets IsInstalled to 0 automatically", "ok": false, "why": "Wrong. IsInstalled is an independent switch; version comparison never changes it."}, {"t": "Windows deletes the component key", "ok": false, "why": "Wrong. Running a component never deletes its own key."}]}, {"id": "M-03", "type": "dnd", "extype": "Drag & drop (event buckets)", "scenario": {"summary": "Four events, two fates — first run for a new user vs re-run for an existing user", "prose": "<p>You are reviewing a hunting dashboard with four Active Setup-related observations. Decide for each: does it fire only for a <b>brand-new user profile<\/b>, or does it <b>re-run for users who already exist<\/b>?<\/p>"}, "prompt": "Drag each event to the bucket that describes who it affects.", "hint": "New keys without a user-part marker wait for fresh profiles. Version increases and deleted markers hit existing profiles.", "exp": "<p>A <b>new GUID key<\/b> with no HKCU marker has never run for anyone — but it executes once per profile, so on a shared host it is mainly a <i>new-user<\/i> trigger (existing users also run it once on their next logon, but the classic replay lever is different). A <b>Version increase<\/b> and a <b>deleted HKCU marker<\/b> both target profiles that already exist — those are the re-arm moves. A <b>fresh profile logging on<\/b> always collects every once-per-user component. This distinction is what tells you how widely a planted component will execute.<\/p>", "slots": ["Affects brand-new user profiles", "Re-runs for users who already exist"], "cap": "rack", "bank": [{"t": "A new user profile is created and logs on", "slot": 0, "why": "A fresh profile has no markers, so every once-per-user component runs for it at first logon."}, {"t": "A new GUID key appears; no HKCU marker exists yet", "slot": 0, "why": "With no user-part record, the component behaves like a fresh one — each profile gets its first run."}, {"t": "HKLM Version is raised above the HKCU copies", "slot": 1, "why": "Raising the machine Version above stored user versions forces existing profiles to re-run the command."}, {"t": "An attacker deletes the component's HKCU marker", "slot": 1, "why": "Without the user-part record, Active Setup believes the profile never ran it — so it runs again."}]}, {"id": "M-04", "type": "fill", "extype": "Fill in the blank (2 blanks)", "scenario": {"summary": "The user part — where finished components are recorded", "prose": "<p>You are writing the team wiki page for Active Setup basics. Complete the two blanks so the next analyst understands the machine/user split.<\/p>"}, "prompt": "Complete the wiki sentence with both missing words.", "hint": "Blank 1 is the hive of the per-user mirror. Blank 2 is the value whose number gets copied down after a run.", "exp": "<p>The user part lives under <b>HKCU<\/b> at <span class='mono'>HKCU\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components<\/span>. After a component runs, Windows copies the <b>Version<\/b> value there. That copy is the profile's memory: the same version again means &ldquo;already done&rdquo;. Deleting the marker, or raising the machine version, resets that memory — which is exactly the abuse.<\/p>", "text": "Active Setup has a machine part under HKLM and a per-user mirror under ____ , which records what this profile already ran. After the StubPath command executes, Windows copies the ____ value into that mirror.", "blanks": [{"a": ["hkcu", "hkey_current_user"], "disp": "HKCU", "why": "The user part mirrors the machine part under HKEY_CURRENT_USER."}, {"a": ["version"], "disp": "Version", "why": "The Version value is copied to the user part after a run; comparing the two decides future runs."}]}, {"id": "M-05", "type": "multi", "extype": "Multi-select (4 of 6)", "scenario": {"summary": "True facts about when and how Active Setup executes", "prose": "<p>A junior colleague collected six statements about Active Setup execution and asks you to check them before they go into the runbook. Select every <b>true<\/b> statement.<\/p>"}, "prompt": "Select all statements that are true.", "hint": "Check each statement against the logon order: what runs before the shell, in whose context, and how often.", "exp": "<p>True: Active Setup runs <b>before the desktop shell appears<\/b>; <b>before Run/RunOnce<\/b> entries (those are handled by Explorer, which starts later); it runs <b>synchronously<\/b>, so a hanging command delays logon; and it runs <b>once per user<\/b> unless the Version value forces a repeat. False: it does <b>not<\/b> run as SYSTEM — the command inherits the logged-on user's context and permissions; and it is not a boot-time machine event — it is per-user logon work.<\/p>", "study": "Logon order: logon &rarr; Active Setup &rarr; shell &rarr; Run/RunOnce.", "opts": [{"t": "It runs before the desktop (shell) appears", "ok": true, "why": "True. Active Setup is processed during logon, before Explorer draws the desktop."}, {"t": "It runs before Run / RunOnce registry entries are processed", "ok": true, "why": "True. Run and RunOnce are handled by the shell, which starts after Active Setup."}, {"t": "It runs synchronously and a hanging command can delay the logon", "ok": true, "why": "True. Active Setup waits for the command; there is no timeout mechanism."}, {"t": "It runs once per user unless the Version value forces a repeat", "ok": true, "why": "True. The per-user marker normally prevents repeats; a higher machine Version forces one."}, {"t": "The command runs as the SYSTEM account", "ok": false, "why": "False. The command runs as the logged-on user, with that account's permissions."}, {"t": "It runs once when the machine boots, before anyone logs in", "ok": false, "why": "False. Active Setup is processed at user logon, not at boot and not before a user exists."}]}, {"id": "M-06", "type": "qcm", "extype": "Multiple choice", "scenario": {"summary": "Detection engineering — choose the Sysmon event ID for a StubPath write", "prose": "<p>You are building telemetry for the Active Setup tree. Sysmon is deployed. Your first rule wants to know when a registry <b>value<\/b> such as StubPath is set or modified.<\/p>"}, "prompt": "Which Sysmon event ID records a registry value being set or modified?", "hint": "Sysmon splits registry events: one ID for object add/delete, another for value set. You want value set.", "exp": "<p><b>Sysmon Event ID 13<\/b> fires when a registry <b>value<\/b> is set — exactly what a StubPath or Version write produces. Event ID 12 records object add/delete (a brand-new key), Event ID 11 is file creation, and Event ID 3 is a network connection. A complete Active Setup detection stack uses 12 (new keys), 13 (value writes), and 14 (value renames) — but the StubPath write itself is 13.<\/p>", "study": "Sysmon: EID 12 = key add/delete, 13 = value set, 14 = value rename.", "opts": [{"t": "Event ID 13 — Registry value set", "ok": true, "why": "Correct. EID 13 records registry value sets, including StubPath writes."}, {"t": "Event ID 12 — Registry object add/delete", "ok": false, "why": "Wrong level: EID 12 is for keys being created or deleted, not values being written."}, {"t": "Event ID 11 — File create", "ok": false, "why": "Wrong. EID 11 is for files created on disk, not registry values."}, {"t": "Event ID 3 — Network connection", "ok": false, "why": "Wrong. EID 3 tracks network connections; it cannot see registry writes."}]}, {"id": "M-07", "type": "multi", "extype": "Log analysis (3 of 8 lines)", "scenario": {"summary": "Endpoint timeline WS-77 — separate Active Setup persistence signals from ordinary noise", "prose": "<p>Eight lines from one morning on workstation WS-77. Some are Active Setup persistence evidence; the rest are routine. Select every line that is <b>evidence of Active Setup persistence<\/b> (arming the component or executing the stub at logon).<\/p>", "arts": [{"label": "ARTEFACT 1 — WS-77 telemetry, 08:00–09:10", "kind": "log", "lines": ["L1 08:59:41 EID 12 Registry key create: HKLM\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components\\{D41D8C2F-6E30-4C77-9B15-3A8F02C5E4D9}  Image: powershell.exe", "L2 08:59:42 EID 13 Registry value set: ...\\{D41D8C2F-...}\\StubPath = cmd.exe /c powershell -w hidden -enc SQBFAFIA", "L3 09:00:12 EID 1 Process create: powershell.exe -enc SQBFAFIA  Parent: mobsync.exe /logon", "L4 08:12:10 EID 13 Registry value set: ...\\Installed Components\\{A9C1D4E2-...}\\StubPath = msiexec /Fpums {90160000-0011-0000-0000-0000000FF1CE} /Qn  Image: msiexec.exe (change #2231)", "L5 09:01:00 EID 1 Process create: Teams.exe  Parent: explorer.exe", "L6 08:59:41 EID 12 Registry key create: HKCU\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\\OneDriveStandalone", "L7 09:00:14 EID 5 Process terminate: powershell.exe", "L8 09:05:33 EID 3 Network connection: chrome.exe -> 10[.]20[.]30[.]40:443"]}]}, "prompt": "Select the lines that show Active Setup persistence.", "hint": "You are looking for three moments: the key being armed, the StubPath write, and the stub actually executing at logon.", "exp": "<p><b>L1<\/b> is the arming: a new component key created by powershell.exe — suspicious creator. <b>L2<\/b> is the StubPath write with an encoded command — the payload. <b>L3<\/b> is the execution: at logon, the stub's exact command line runs as a child of the logon-time Active Setup helper (<span class='mono'>mobsync.exe /logon<\/span> on current builds; some builds show the parent as userinit). L4 is an installer writing StubPath under an approved change; L5, L7 and L8 are routine activity; L6 belongs to a different persistence technique (Run key).<\/p>", "study": "Correlate three stages: key created &rarr; StubPath written &rarr; stub executed at logon.", "opts": [{"t": "L1 — new component key created under Active Setup by powershell.exe", "ok": true, "why": "Arming stage: a random GUID component created by a scripting host is a classic plant."}, {"t": "L2 — StubPath set to an encoded PowerShell command", "ok": true, "why": "The payload write: StubPath now carries the command that will run at logon."}, {"t": "L3 — logon-time process whose parent is the Active Setup helper", "ok": true, "why": "Execution stage: the stub's command line runs right after logon, from the logon chain."}, {"t": "L4 — msiexec writes StubPath during approved change #2231", "ok": false, "why": "Benign: installers legitimately create components during approved software changes."}, {"t": "L5 — Teams.exe starts from explorer.exe", "ok": false, "why": "Routine user-session activity — nothing to do with Active Setup."}, {"t": "L6 — a new value under CurrentVersion\\Run", "ok": false, "why": "That is a Run key (T1547.001), a different autostart mechanism — not Active Setup."}, {"t": "L7 — powershell.exe terminates", "ok": false, "why": "A process exiting adds nothing by itself; the create events carry the evidence."}, {"t": "L8 — chrome.exe connects out to 10[.]20[.]30[.]40:443", "ok": false, "why": "Outbound browsing traffic; it neither arms nor executes any Active Setup component."}]}, {"id": "M-08", "type": "triage", "extype": "SOC alert triage (4 alerts)", "scenario": {"summary": "Queue shift — four Active Setup alerts on two hosts, one approved rollout in progress", "prose": "<p>Four alerts arrived during the night shift. Context: Contoso Suite 12.3 is rolling out this week under change #3001; its installer creates a component with a signed updater. Decide each alert. A wrong pick cancels a correct one.<\/p>"}, "prompt": "Set a disposition for each alert.", "hint": "Two alerts have a documented approved change behind them. The other two change existing state or come from unknown creators.", "exp": "<p>Q1 is the plant: unsigned payload in ProgramData from an unknown creator — escalate. Q2 matches the approved rollout (signed updater, change #3001) — close as installer behaviour. Q3 is <b>version replay<\/b>: an existing component's Version was raised by an admin account that is not on the call rota — escalate. Q4 is a print driver service, not Active Setup — close as unrelated. Reading creator, signature and change tickets together separates all four.<\/p>", "study": "Triage trio: who created it (creator), what the command is, and which change covers it.", "disps": [{"id": "d0", "label": "Close — covered by approved change / installer"}, {"id": "d1", "label": "Escalate — persistence plant or version replay"}, {"id": "d2", "label": "Close — unrelated to Active Setup"}], "alerts": [{"id": "Q1", "title": "New component on WS-31", "meta": "StubPath = <span class='mono'>cmd.exe /c copy \\\\10[.]0[.]0[.]5\\s\\p.exe %APPDATA% &amp;&amp; %APPDATA%\\p.exe<\/span>, creator unknown, 22:41", "ok": "d1", "why": "Unknown creator, copy-from-share payload — a persistence plant. Escalate."}, {"id": "Q2", "title": "New component on WS-88 during Contoso Suite 12.3 install", "meta": "StubPath = signed <span class='mono'>csupdater.exe<\/span>, creator msiexec.exe, change #3001 approved", "ok": "d0", "why": "Signed binary created by the installer of an approved change — normal software behaviour."}, {"id": "Q3", "title": "Version raised on existing component on RDS-01", "meta": "Version 1,0,0,0 to 9,0,0,0; creator: local admin account not on the on-call rota", "ok": "d1", "why": "A Version raise re-arms the component for every profile — classic replay by a suspicious account. Escalate."}, {"id": "Q4", "title": "New print driver service on PRN-07", "meta": "Service installed for a documented printer model", "ok": "d2", "why": "A printer service is not an Active Setup component — different area entirely."}]}, {"id": "M-09", "type": "qcm", "extype": "Multiple choice", "scenario": {"summary": "Red-team reasoning — choosing persistence for a shared Remote Desktop host", "prose": "<p>In an authorised test you hold admin rights on a Windows Remote Desktop Session Host used by 80 employees, and new accounts are added monthly. You want a logon command that reaches as many profiles as possible with one change, including future users.<\/p>"}, "prompt": "Why does Active Setup fit this goal better than a per-user Run key?", "hint": "Think about how many writes each option needs, and who gets covered automatically.", "exp": "<p><b>Attacker perspective:<\/b> one HKLM component runs once for every profile that logs on — including users created after the plant — with a single write. A Run key under HKCU would need one write <i>per user<\/i> and would miss future profiles. <b>Defender perspective:<\/b> that is why RDS hosts are high-value hunting targets: a single planted component there can cover the whole workforce, so the Active Setup tree on terminal servers deserves priority monitoring.<\/p>", "study": "Multi-user hosts multiply the blast radius of one Active Setup entry.", "opts": [{"t": "One HKLM entry runs once for every user, including users created later", "ok": true, "why": "Correct. The machine part applies to each profile at its logon — present and future."}, {"t": "Run keys only work on workstations, never on servers", "ok": false, "why": "Wrong. Run keys work on servers too; the issue is per-user coverage, not platform."}, {"t": "Active Setup needs no registry write at all", "ok": false, "why": "Wrong. Planting requires creating or editing the component in HKLM."}, {"t": "Run keys cannot survive a reboot", "ok": false, "why": "Wrong. Run keys persist and run at every logon — the difference is per-user coverage and noise."}]}, {"id": "M-10", "type": "match", "extype": "Matching (4 pairs)", "scenario": {"summary": "Telemetry mapping — which data source answers which investigation question", "prose": "<p>Your detection engineer asks which data source proves which fact about an Active Setup incident. Match each source to the question it answers.<\/p>"}, "prompt": "Match each data source to what it proves.", "hint": "Registry events prove writes. Process events prove execution. Command lines prove what was launched. File events prove staging.", "exp": "<p><b>Windows Registry events<\/b> show that the key/value was created or changed — the arming. <b>Process creation at logon<\/b> shows the StubPath command actually executed — the run. <b>Command execution (command line)<\/b> shows what the stub launched, for example an encoded PowerShell downloader. <b>File creation events<\/b> show the payload staged on disk before the logon run. Strong coverage needs all of them; any one alone leaves a blind spot.<\/p>", "pairs": [["Windows Registry events", "The component key and StubPath value were created or changed", "Registry telemetry proves arming: who wrote what into the Active Setup tree, and when."], ["Process creation at logon", "The StubPath command really executed in a user session", "Only process telemetry proves execution; a planted key alone proves intent, not a run."], ["Command execution (command line)", "What the stub launched, e.g. an encoded PowerShell downloader", "The command line reveals the payload's behaviour — downloaders, copies, script interpreters."], ["File creation events", "A payload was staged on disk before the logon run", "File writes often precede the logon run: the dropper stages the binary the stub will execute."]]}, {"id": "M-11", "type": "fill", "extype": "Fill in the blank (2 blanks)", "scenario": {"summary": "64-bit reality — where a 32-bit installer's component lands", "prose": "<p>A vendor ships a 32-bit installer. On your 64-bit Windows fleet it writes its Active Setup component into the redirected registry view. Your hunters must know where to look, and your hardening team must know who can write there at all.<\/p>"}, "prompt": "Supply the two missing technical terms.", "hint": "Blank 1 is the registry redirection node for 32-bit writers. Blank 2 is the class of rights needed to write under HKLM.", "exp": "<p>A 32-bit writer lands under <b>Wow6432Node<\/b>: <span class='mono'>HKLM\\SOFTWARE\\Wow6432Node\\Microsoft\\Active Setup\\Installed Components<\/span>. Monitoring only the 64-bit view leaves a real blind spot. And writing anywhere under HKLM requires <b>administrator<\/b> rights — so privileged account management is your first preventive lever, even though ATT&amp;CK lists no easy preventive mitigation for the technique itself.<\/p>", "text": "A 32-bit installer on 64-bit Windows writes its component under HKLM\\SOFTWARE\\____\\Microsoft\\Active Setup\\Installed Components, and creating any key under HKLM requires ____ rights.", "blanks": [{"a": ["wow6432node"], "disp": "Wow6432Node", "why": "Wow6432Node is the redirected view where 32-bit processes write their machine-wide settings."}, {"a": ["administrator", "admin", "elevated", "local administrator"], "disp": "administrator", "why": "HKLM writes require elevation; a standard user cannot plant machine-wide components."}]}, {"id": "M-12", "type": "qcm", "extype": "Multiple choice", "scenario": {"summary": "Controls reality — what the ATT&CK page says about mitigation", "prose": "<p>During a control review a GRC analyst asks what ATT&amp;CK itself says about mitigating T1547.014. You quote the page honestly.<\/p>"}, "prompt": "Which statement matches the ATT&amp;CK page?", "hint": "The page's mitigation section is unusually short — because the technique abuses a normal system feature.", "exp": "<p>The ATT&amp;CK page states that this technique <b>cannot easily be mitigated with preventive controls because it abuses system features<\/b>. In practice defenders lean on hardening that is not a silver bullet: limit who has admin rights, restrict registry ACLs on the Active Setup tree, keep a baseline of expected components, and detect writes. Pretending a single product setting blocks the technique is the classic wrong answer.<\/p>", "study": "Abuse-of-feature techniques: prevention is partial; detection and least privilege carry the load.", "opts": [{"t": "It cannot easily be prevented because it abuses a normal system feature", "ok": true, "why": "Correct — this is the page's own conclusion about mitigation."}, {"t": "Windows blocks all writes to the Active Setup path by default", "ok": false, "why": "Wrong. Administrators can write there normally; nothing blocks it out of the box."}, {"t": "Antivirus products cannot read this registry path", "ok": false, "why": "Wrong. EDR/AV read the registry routinely — that is how the detections exist."}, {"t": "A firewall rule on the host stops this technique", "ok": false, "why": "Wrong. Firewalls filter network traffic; the stub can run without any network access."}]}, {"id": "M-13", "type": "order", "extype": "Timeline ordering (5 steps)", "scenario": {"summary": "Response runbook — put the five actions in the order that protects evidence and users", "prose": "<p>A planted component is confirmed on WS-114. You lead the response. Order the five actions: the early ones protect evidence and understanding, the later ones spread the fix.<\/p>"}, "prompt": "Order the response actions from first to last.", "hint": "You cannot analyse what you deleted. Evidence first, removal only after the state is captured, then hunting.", "exp": "<p>The safe order is: export the key and values <b>before<\/b> touching anything; record the GUID, StubPath and Version (your hunt keys); check the HKCU marker to learn which users already executed the stub; only then remove the malicious HKLM entry; finally hunt the estate for the same GUID and command string. Deleting first destroys exactly the evidence you need for scoping and reporting.<\/p>", "items": ["Export the suspicious key and its values as evidence", "Record the GUID, the StubPath command and the Version values", "Check the HKCU marker to see which users already ran it", "Remove the malicious HKLM entry", "Search other endpoints for the same GUID and StubPath string"], "why": ["Evidence first: the export preserves the attacker's configuration exactly as planted.", "The GUID, command and versions are your hunt anchors across the estate.", "The user part tells you how many profiles already executed the stub.", "Only after capture: remove the machine part so no further logon executes the stub.", "Finally, spread the search — the same component may be planted on other hosts."]}, {"id": "M-14", "type": "terminal", "extype": "Terminal command (choose your flags)", "scenario": {"summary": "Hunt prep — dump every StubPath value under the Active Setup tree, including sub-keys", "prose": "<p>You are on a hunting jump box (approved exercise). Using the built-in <span class='mono'>reg<\/span> tool, list <i>every<\/i> StubPath value in the Active Setup tree: you need all sub-keys searched recursively, filtered to the value name StubPath. No syntax panel this time — choose the flags yourself. A hint of intent: you want only StubPath, not every value.<\/p>"}, "prompt": "Type the reg command that recursively lists StubPath values under the Active Setup key.", "hint": "You need recursion across sub-keys and a filter on the value name — two distinct flags after the key path.", "exp": "<p><span class='mono'>/s<\/span> makes reg query walk all sub-keys recursively; without it you would see only the direct values of the top key. <span class='mono'>/f StubPath<\/span> filters matches to the value name you hunt. Together they produce a clean inventory of every logon command on the machine — the single most useful Active Setup hunting query.<\/p>", "study": "reg query /s /f &lt;name&gt; — recursive value hunting in one line.", "shell": {"caption": "cmd.exe — hunting jump box HV-2 (simulation)", "banner": "Microsoft Windows [Version 10,0,19045,3803]\n(c) simulation only — no real command runs here", "prompt": "C:\\Users\\hunter>", "elements": [{"label": "Tool: reg query", "re": "^\\s*reg\\s+query\\b", "why": "The read-only registry tool is the right instrument for an inventory."}, {"label": "Targets the Active Setup components key", "re": "hklm(\\\\|/)software(\\\\|/)microsoft(\\\\|/)active\\s+setup(\\\\|/)installed\\s+components", "why": "Start from HKLM\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components."}, {"label": "Recurses into sub-keys (/s)", "re": "(^|\\s)/s(\\s|$)", "why": "Each component is its own sub-key; /s is required to reach every StubPath."}, {"label": "Filters on the value name StubPath (/f StubPath)", "re": "/f\\s+\\\"?stubpath\\\"?(\\s|$)", "why": "/f narrows output to the value you care about instead of every value in the tree."}], "danger": [{"re": "reg\\s+(add|delete|copy|restore|save|load|unload)|(^|\\s)(del|erase|rd|rmdir|format)\\s", "label": "state-changing command"}], "dangerNote": "Your command changes or destroys registry state. A hunt must stay read-only — mutating the tree destroys the evidence you came to collect.", "out": "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components\\{A9C1D4E2-51B7-4C38-9E0F-2D6A83B7C451}\n    StubPath    REG_SZ    msiexec /Fpums {90160000-0011-0000-0000-0000000FF1CE} /Qn\nHKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components\\{C4D9F0A7-2E61-4B05-8A33-9C1E5F70B2D8}\n    StubPath    REG_SZ    cmd.exe /c powershell -w hidden -enc SQBFAFIA\nSearch completed: 2 matches in 37 sub-keys.", "canonical": "reg query \"HKLM\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components\" /s /f StubPath", "explain": ["<b>reg query<\/b> — the read-only tool.", "<b>\"HKLM\\...\\Installed Components\"<\/b> — the root of the component tree.", "<b>/s<\/b> — recurse into every component sub-key.", "<b>/f StubPath<\/b> — filter output to the value name StubPath."]}}, {"id": "M-15", "type": "multi", "extype": "Multi-select (2 of 6)", "scenario": {"summary": "Matrix discipline — the tactics field for T1547.014", "prose": "<p>Your CTI platform lets you tag techniques with tactics. For T1547.014 you must tag exactly the tactics that the ATT&amp;CK page lists. Select the two correct tags.<\/p>"}, "prompt": "Select the two tactics of T1547.014.", "hint": "One tag is about keeping access, the other about gaining stronger rights. The page lists no others.", "exp": "<p>The page lists <b>Persistence<\/b> and <b>Privilege Escalation<\/b>. Persistence is the core use: the command re-runs at logon. Privilege Escalation applies when a component planted by an admin executes in another, more privileged user's session. Defense Evasion, Discovery, Lateral Movement and Command and Control are behaviours around the persistence, not tactics of this sub-technique.<\/p>", "study": "One technique can serve several tactics — check the page header, do not guess.", "opts": [{"t": "Persistence", "ok": true, "why": "Correct: logon autostart keeps the attacker's access alive."}, {"t": "Privilege Escalation", "ok": true, "why": "Correct: execution can occur inside another (possibly more privileged) user's session."}, {"t": "Defense Evasion", "ok": false, "why": "Wrong: hiding the entry would be Masquerading; the technique itself is not tagged Defense Evasion."}, {"t": "Discovery", "ok": false, "why": "Wrong: Discovery covers information gathering — not this behaviour."}, {"t": "Lateral Movement", "ok": false, "why": "Wrong: Lateral Movement is reaching other systems; planting happens on a system already reached."}, {"t": "Command and Control", "ok": false, "why": "Wrong: C2 is about channel maintenance; the stub may start C2 tools, but that is not this technique's tag."}]}, {"id": "M-16", "type": "match", "extype": "Matching (4 pairs)", "scenario": {"summary": "Sibling radar — telling T1547.014 apart from its neighbours", "prose": "<p>An alert just says &ldquo;T1547 — logon autostart activity&rdquo;. You must map each sub-technique to the artefact that identifies it, so the ticket lands on the right playbook.<\/p>"}, "prompt": "Match each sub-technique to its identifying artefact.", "hint": "Each artefact names a distinct registry location — Run, Winlogon, W32Time, Installed Components.", "exp": "<p><b>Registry Run Keys / Startup Folder<\/b> shows up as values under <span class='mono'>...\\CurrentVersion\\Run<\/span>. <b>Winlogon Helper DLL<\/b> hides in the <span class='mono'>Userinit<\/span> / <span class='mono'>Shell<\/span> values under the Winlogon key. <b>Time Providers<\/b> registers DLLs under the W32Time service key. <b>Active Setup<\/b> alone uses StubPath under Installed Components, executed once per user. Knowing the artefact tells you which detection and which removal steps apply.<\/p>", "pairs": [["T1547.001 Registry Run Keys / Startup Folder", "Values under ...\\CurrentVersion\\Run processed by the shell", "Run key entries are simple values under the Run key — different tree from Active Setup."], ["T1547.004 Winlogon Helper DLL", "Userinit / Shell values under the Winlogon key", "Winlogon helpers hijack the logon chain values themselves — a privileged, high-impact spot."], ["T1547.014 Active Setup", "StubPath under Installed Components, executed once per user", "The GUID component plus StubPath combination is unique to Active Setup."], ["T1547.003 Time Providers", "DLLs registered under the W32Time service key", "Time provider DLLs load with the time service — nothing to do with per-user logon runs."]]}], "intro": {"title": "T1547.014 — MEDIUM practice exam", "learn": "<p>This exam deepens your grasp of <b>T1547.014 &mdash; Boot or Logon Autostart Execution: Active Setup<\/b>, a Windows <b>sub-technique<\/b> for logon persistence in MITRE ATT&amp;CK. You already know the basics: a component under <span class='mono'>HKLM\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components<\/span> can carry a <span class='mono'>StubPath<\/span> command that runs once per user at logon. Now we connect the ideas in pairs: <i>which value stores what<\/i> and <i>what that value does to execution<\/i>; <i>which event ID to collect<\/i> and <i>which question it answers<\/i>; <i>which hardening step helps<\/i> and <i>what it cannot do<\/i>.<\/p><p>Two registry ideas do the heavy lifting. First, Active Setup has a <b>machine part<\/b> (HKLM) and a <b>user part<\/b> (HKCU). The user part remembers what your profile already ran. Second, the <b>Version<\/b> value compares the two parts: if the machine copy is higher, the command runs again and the new version is copied down. Attackers abuse exactly this comparison to re-arm an old component. On 64-bit Windows, 32-bit installers write under <span class='mono'>Wow6432Node<\/span>, so defenders must watch both views.<\/p><p>In your daily work this material sits everywhere. A <b>detection engineer<\/b> chooses Sysmon event IDs 12 and 13 and decides what &ldquo;suspicious&rdquo; means for the Active Setup tree. An <b>incident responder<\/b> walks a fixed order: preserve, check the user part, remove the machine part, then hunt. A <b>threat hunter<\/b> compares HKLM and HKCU versions across hosts to find pending replays. A <b>GRC or platform owner<\/b> accepts an uncomfortable fact from the ATT&amp;CK page: this technique cannot easily be stopped with preventive controls, because it abuses a normal system feature &mdash; so limiting admin rights and monitoring carry the weight.<\/p><p>Expect exercises where one registry fact changes what a second fact means. Take your time; the explanations will fill the gaps.<\/p><p>Who uses this in real work? A <b>SOC analyst<\/b> tunes the alert that fires when the Active Setup tree is written; a <b>threat hunter<\/b> sweeps both registry views for odd StubPath values; an <b>incident responder<\/b> checks which user profiles already ran a planted component; a <b>detection engineer<\/b> writes and tunes the rule; a <b>red teamer<\/b> proves the persistence works during an authorised test; a <b>CTI analyst<\/b> maps incidents to T1547.014 in reports; and a <b>GRC or control owner<\/b> checks that registry auditing over this key is really switched on. Your tools are the same ones these roles use: Sysmon or EDR telemetry, a SIEM, <span class='mono'>reg query<\/span>, and Sysinternals Autoruns.<\/p>", "themes": [{"name": "Registry Anatomy Deep-Dive", "items": ["Version value (four comma-separated numbers)", "IsInstalled flag (0 stops the run)", "(Default) component name", "HKCU user-part mirror", "Wow6432Node (32-bit on 64-bit Windows)"]}, {"name": "Execution Rules &amp; Timing", "items": ["Runs before the desktop shell", "Runs before Run / RunOnce entries", "Synchronous — can delay logon", "Once per user unless Version is raised", "Machine-vs-user version comparison"]}, {"name": "Data Sources &amp; Telemetry", "items": ["Windows Registry events (Sysmon EID 12/13)", "Process creation at logon", "Command execution (command line)", "HKLM vs HKCU version diff"]}, {"name": "Defender Work &amp; Controls", "items": ["No easy preventive mitigation (abuse of system features)", "Restrict administrator rights", "Registry ACL hardening", "Response step order", "RDS / multi-user amplifier", "Sibling sub-techniques (Run Keys, Winlogon Helper DLL, Time Providers)"]}], "how": "<ul class='how-list'><li><span class='ic ic-ok'>&#10003;<\/span><span><b>Goal:<\/b> reach at least <b>70%<\/b> over the exercises you answer. Skipped-and-never-answered exercises are excluded from both the points and the total.<\/span><\/li><li><span class='ic ic-part'>&#10003;<\/span><span><b>Exercise types in this file:<\/b> multiple choice, multi-select, matching, drag &amp; drop into event buckets, fill in the blank, a filtered log viewer, SOC alert triage, timeline ordering, and one terminal command where you choose the flags yourself.<\/span><\/li><li><span class='ic ic-pause'>&#9208;<\/span><span><b>Timer:<\/b> 35:00 countdown. Manual <b>Pause<\/b> hides the exercise. Pressing <b>Check<\/b> stops the clock automatically for feedback reading and resumes on <b>Next<\/b>.<\/span><\/li><li><span class='ic ic-part'>&#10003;<\/span><span><b>Partial credit:<\/b> multi-item exercises give credit per correct item; wrong items cancel correct ones: credit = max(0, (H &minus; W) / N). One hint per exercise costs 10% of that exercise's credit.<\/span><\/li><li><span class='ic ic-miss'>&#9888;<\/span><span><b>Skips:<\/b> skipped exercises go to a review pool you can revisit before the final submit. Nothing you never answer is counted as wrong.<\/span><\/li><\/ul>"}};

/* ---------------- small utilities ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function shuffle(a){
  var r=a.slice();
  for(var i=r.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=r[i]; r[i]=r[j]; r[j]=t;
  }
  return r;
}
function norm(s){ return String(s).replace(/\s+/g,' ').trim().toLowerCase(); }
function el(tag,cls,html){
  var e=document.createElement(tag);
  if(cls) e.className=cls;
  if(html!==undefined) e.innerHTML=html;
  return e;
}
/* Mandatory scoring formula: credit = max(0,(H-W)/N) */
function scoreExercise(H,W,N){ return Math.max(0,(H-W)/N); }
function fmtClock(ms){
  var s=Math.max(0,Math.floor(ms/1000));
  var m=Math.floor(s/60); s=s%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function fmt1(x){ return (Math.round(x*10)/10).toFixed(1); }
/* Motion helper: honour prefers-reduced-motion for JS-driven scrolling too */
function reducedMotion(){
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}
function scrollToTop(){
  try{ window.scrollTo({top:0,behavior:reducedMotion()?'auto':'smooth'}); }
  catch(e){ window.scrollTo(0,0); }
}
function scrollNearest(elm){
  if(!elm) return;
  try{ elm.scrollIntoView({behavior:reducedMotion()?'auto':'smooth',block:'nearest'}); }
  catch(e){ /* older browsers: no-op */ }
}

/* ---------------- toast ---------------- */
var toastT=null;
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.remove('hidden');
  if(toastT) clearTimeout(toastT);
  toastT=setTimeout(function(){ t.classList.add('hidden'); },2200);
}

/* ---------------- timer state machine ----------------
   States: IDLE -> RUNNING <-> PAUSED_MANUAL / PAUSED_AUTO_CHECK -> ENDED
   Check sets PAUSED_AUTO_CHECK BEFORE feedback is rendered.
   Next / Final Submit / Return-to-review resume the clock.        */
var Timer={
  state:'IDLE', remain:0, iv:null, last:0, mark:0,
  manualMs:0, feedbackMs:0, fromAuto:false,
  begin:function(sec){
    this.remain=sec*1000; this.state='RUNNING'; this.last=Date.now();
    this.manualMs=0; this.feedbackMs=0; this.fromAuto=false;
    if(this.iv) clearInterval(this.iv);
    this.iv=setInterval(function(){ Timer.tick(); },250);
    this.render();
  },
  tick:function(){
    var now=Date.now(), dt=now-this.last; this.last=now;
    if(this.state!=='RUNNING') return;
    this.remain-=dt;
    if(this.remain<=0){ this.remain=0; this.render(); this.end(); return; }
    this.render();
  },
  render:function(){
    var c=$('timerChip');
    if(!c) return;
    var t=fmtClock(this.remain);
    var txt='', cls='chipstat';
    if(this.state==='RUNNING'){ txt='<span class="ic">&#9654;</span> RUNNING <span class="mono">'+t+'</span>'; }
    else if(this.state==='PAUSED_MANUAL'){ cls+=' ts-paused'; txt='<span class="ic">&#9208;</span> PAUSED &mdash; manual (press Resume) <span class="mono">'+t+'</span>'; }
    else if(this.state==='PAUSED_AUTO_CHECK'){ cls+=' ts-paused'; txt='<span class="ic">&#9208;</span> PAUSED &mdash; reviewing feedback (resumes on Next) <span class="mono">'+t+'</span>'; }
    else if(this.state==='ENDED'){ cls+=' ts-ended'; txt='<span class="ic">&#9632;</span> ENDED <span class="mono">'+t+'</span>'; }
    else { txt='<span class="ic">&#9679;</span> READY <span class="mono">'+t+'</span>'; }
    c.className=cls; c.innerHTML=txt;
  },
  pauseManual:function(){
    if(this.state!=='RUNNING' && this.state!=='PAUSED_AUTO_CHECK') return;
    this.fromAuto=(this.state==='PAUSED_AUTO_CHECK');
    this.mark=Date.now(); this.state='PAUSED_MANUAL';
    if(this.iv){ clearInterval(this.iv); this.iv=null; }
    this.render();
  },
  resumeManual:function(){
    if(this.state!=='PAUSED_MANUAL') return;
    this.manualMs+=Date.now()-this.mark;
    if(this.fromAuto){ this.fromAuto=false; this.state='PAUSED_AUTO_CHECK'; }
    else{ this.state='RUNNING'; this.last=Date.now(); if(this.iv)clearInterval(this.iv); this.iv=setInterval(function(){ Timer.tick(); },250); }
    this.render();
  },
  pauseAuto:function(){
    if(this.state==='RUNNING'){ this.mark=Date.now(); this.state='PAUSED_AUTO_CHECK'; }
    if(this.iv){ clearInterval(this.iv); this.iv=null; }
    this.render();
  },
  resumeFromAuto:function(){
    if(this.state!=='PAUSED_AUTO_CHECK') return;
    this.feedbackMs+=Date.now()-this.mark;
    this.state='RUNNING'; this.last=Date.now();
    if(this.iv) clearInterval(this.iv);
    this.iv=setInterval(function(){ Timer.tick(); },250);
    this.render();
  },
  end:function(silent){
    if(this.state==='ENDED') return;
    this.state='ENDED';
    if(this.iv){ clearInterval(this.iv); this.iv=null; }
    this.render();
    if(silent!==true && typeof App!=='undefined' && App.finishByTimeout) App.finishByTimeout();
  }
};

/* ---------------- app state ---------------- */
var App={
  order:[], status:{}, credits:{}, hintUsed:{},
  curIdx:-1, visited:0, reported:false, reviewing:false, lockInputs:false,
  attempt:0, answers:{},

  exById:function(i){ return PAYLOAD.exercises[i]; },
  isTerm:function(ex){ return ex && ex.type==='terminal'; },
  buildOrder:function(){
    var n=PAYLOAD.exercises.length, idxs=[], i, tries=0, ord, bad, j;
    for(i=0;i<n;i++) idxs.push(i);
    for(;;){
      ord=shuffle(idxs); tries++; bad=false;
      for(j=1;j<ord.length;j++){
        if(this.isTerm(this.exById(ord[j])) && this.isTerm(this.exById(ord[j-1]))){ bad=true; break; }
      }
      if(!bad || tries>80) break;
    }
    return ord;
  },
  reset:function(){
    this.status={}; this.credits={}; this.hintUsed={}; this.answers={};
    this.curIdx=-1; this.visited=0; this.reported=false; this.reviewing=false; this.lockInputs=false;
    this.finishing=false; this.attempt++;
    this.order=this.buildOrder();
    for(var i=0;i<this.order.length;i++){ this.status[this.order[i]]='pending'; }
  },
  start:function(){
    this.reset();
    $('intro').classList.add('hidden');
    $('hdr').classList.remove('hidden');
    $('progressWrap').classList.remove('hidden');
    $('exam').classList.remove('hidden');
    Timer.begin(PAYLOAD.budgetSec);
    this.showNext();
  },
  nextPending:function(){
    for(var i=0;i<this.order.length;i++){
      if(this.status[this.order[i]]==='pending') return i;
    }
    return -1;
  },
  skippedIdxs:function(){
    var out=[],i;
    for(i=0;i<this.order.length;i++){ if(this.status[this.order[i]]==='skipped') out.push(this.order[i]); }
    return out;
  },
  pendingCount:function(){ return this.nextPending()===-1 ? 0 : 1; },
  answeredCount:function(){
    var c=0;
    for(var k in this.status){ if(this.status[k]==='answered') c++; }
    return c;
  },
  creditSum:function(){
    var s=0;
    for(var k in this.credits){ s+=this.credits[k]; }
    return s;
  },
  anySkipped:function(){ return this.skippedIdxs().length>0; },
  showNext:function(){
    this.reviewing=false;
    var i=this.nextPending();
    if(i<0){
      if(this.anySkipped()) this.showReview();
      else finishExam(false);
      return;
    }
    renderExercise(i);
  },
  progress:function(){
    var n=PAYLOAD.exercises.length;
    $('progressBar').style.width=Math.round(100*this.visited/Math.max(1,n))+'%';
  },
  updateScoreChip:function(){
    var a=this.answeredCount(), s=this.creditSum();
    var pct=a>0?Math.round(100*s/a):0;
    $('scoreChip').innerHTML='<span class="lbl">Score</span> <span class="score-sum mono">'+fmt1(s)+'</span><span class="mono"> / '+a+'</span> <span class="mono">('+pct+'%)</span>';
  }
};

/* ---------------- site handshake (STEP 6.3) ----------------
   Accepts CYBERPULSE_INIT / CYBERMASTERY_INIT. The theme field is
   always 'dark'; this file is dark-only, so appearance never changes. */
window.addEventListener('message',function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  try{
    if(event.data.username){
      var chip=$('whoChip');
      chip.classList.remove('hidden');
      chip.innerHTML='<span class="lbl">Analyst</span> '+esc(event.data.username);
    }
  }catch(e){ /* handshake is optional */ }
});

/* ---------------- score report (STEP 6.2) ---------------- */
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0 ? Math.round((creditSum/answeredCount)*100) : 0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:META.topicId,
      batch:META.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=70
    },location.origin);
  }catch(e){
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}
