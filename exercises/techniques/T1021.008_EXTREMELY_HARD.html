<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1021.008 Direct Cloud VM Connections — EXTREMELY_HARD</title>
<style>
:root{
  --bg-page:#070c12;
  --bg-panel:#0d141d;
  --bg-surface:#111a26;
  --bg-surface-2:#0a111a;
  --bg-elev:#172335;
  --ink:#e9eff7;
  --ink-dim:#a9b9cb;
  --ink-faint:#8497ab;
  --line:#1f2b3c;
  --line-soft:#182331;
  --blue:#4aa8e8;   --blue-soft:rgba(74,168,232,.13);
  --amber:#e6aa3c;  --amber-soft:rgba(230,170,60,.13);
  --green:#41c07f;  --green-soft:rgba(65,192,127,.13);
  --red:#ef5a6a;    --red-soft:rgba(239,90,106,.15);
  --sev-easy:#41c07f;
  --sev-medium:#e6aa3c;
  --sev-hard:#f0813c;
  --sev-extreme:#ef5a6a;
  --focus:#4aa8e8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1 0 auto;width:100%;max-width:980px;margin:0 auto;padding:20px 16px 40px}
.foot{flex-shrink:0;margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:12.5px;background:var(--bg-panel)}
.foot b{color:var(--ink-dim);letter-spacing:.08em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-surface-2)}
::-webkit-scrollbar-thumb{background:#24344b;border-radius:6px;border:2px solid var(--bg-surface-2)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(8,13,20,.94);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.14em;font-size:12.5px;color:var(--green)}
.brand small{color:var(--ink-faint);letter-spacing:.05em;font-weight:600}
.tb-sep{width:1px;height:22px;background:var(--line)}
.tb-title{font-weight:700;font-size:13.5px;color:var(--ink-dim);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stat{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;font-weight:600;background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:32px}
.tb-stat .ic{font-size:13px}
.tb-stat.timer{font-family:var(--mono);color:var(--ink)}
.tb-state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px;border:1px solid}
.tb-state.manual{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.tb-state.autocheck{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.tb-btn:hover:not(:disabled){border-color:var(--blue)}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}
.tb-btn.hint{color:var(--amber)}
.tb-btn.skip{color:var(--ink-dim)}
.prog{height:3px;background:var(--line-soft)}
.prog i{display:block;height:100%;background:var(--green);width:0%;transition:width .25s}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 12px;color:#08110b}
.badge::before{content:"●";font-size:9px}
.sev-EASY{background:var(--sev-easy)}
.sev-MEDIUM{background:var(--sev-medium)}
.sev-HARD{background:var(--sev-hard)}
.sev-EXTREMELY_HARD{background:var(--sev-extreme);color:#160407}
.otype{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg-surface)}
/* ---------- intro ---------- */
.intro-head{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--bg-panel),var(--bg-surface-2));padding:26px 26px 20px;margin-bottom:16px}
.intro-head h1{margin:8px 0 4px;font-size:26px;line-height:1.25}
.intro-head .sub{color:var(--ink-dim);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-dim);background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:34px}
.chip .ic{color:var(--ink-faint)}
.cand{margin-top:12px;font-size:13px;color:var(--ink-faint)}
.intro-sec{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;background:var(--bg-panel);padding:18px 22px;margin-bottom:14px}
.intro-sec.learn{border-left-color:var(--blue)}
.intro-sec.keys{border-left-color:var(--amber)}
.intro-sec.how{border-left-color:var(--green)}
.intro-sec h2{margin:0 0 10px;font-size:15px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.intro-sec.learn p{color:var(--ink-dim);margin:0 0 10px}
.intro-sec.learn p:last-child{margin-bottom:0}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kw-card{background:var(--bg-surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 14px}
.kw-card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.kw-card ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:13.5px}
.kw-card li{margin:2px 0}
.rules{margin:0;padding:0;list-style:none}
.rules li{position:relative;padding:7px 0 7px 26px;color:var(--ink-dim);font-size:14px}
.rules li::before{content:"▸";position:absolute;left:4px;color:var(--green)}
.rules li .dim{color:var(--ink-faint)}
/* ---------- exercise card ---------- */
.excard{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--bg-panel);border:1px solid var(--line);border-left:4px solid var(--blk,var(--blue));border-radius:12px;padding:16px 20px}
.blk-scenario{--blk:var(--blue)}
.blk-question{--blk:var(--amber)}
.blk-answer{--blk:var(--green)}
.blk-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--blk,var(--ink));margin-bottom:10px}
.blk-label .dot{width:8px;height:8px;border-radius:50%;background:var(--blk,var(--ink))}
.ex-title{margin:0 0 8px;font-size:16.5px}
.summary{color:var(--ink-faint);font-size:13.5px;font-style:italic;margin:0 0 8px}
.showfull{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;min-height:32px}
.scen-body p{margin:0 0 10px;color:var(--ink-dim)}
.scen-body p:last-child{margin-bottom:0}
details.artef{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin:10px 0 0}
details.artef summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--blue);user-select:none;min-height:40px;display:flex;align-items:center}
details.artef .artbody{padding:0 14px 12px}
.mono{font-family:var(--mono);font-size:13px;line-height:1.5;color:#c8d8e6;background:var(--bg-surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:0}
table.attable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:0}
table.attable th{background:var(--bg-elev);color:var(--ink);text-align:left}
table.attable th,table.attable td{border:1px solid var(--line-soft);padding:6px 10px;color:var(--ink-dim)}
.q-text{margin:0;font-weight:700;font-size:16px;color:var(--ink)}
/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-height:44px;cursor:pointer;color:var(--ink);font-size:14.5px;font-family:var(--sans);margin:0 0 8px}
.opt:last-child{margin-bottom:0}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}
.opt .mark{font-weight:800;flex-shrink:0}
/* ---------- match ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol h4,.obank h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mleft{flex:1;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;min-height:44px;display:flex;align-items:center}
.mzone{flex:1;background:var(--bg-surface-2);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;min-height:44px;color:var(--ink-faint);font-size:13.5px;cursor:pointer;text-align:left;font-family:var(--sans)}
.mzone.filled{border-style:solid;border-color:var(--blue);color:var(--ink)}
.mzone.dragover{border-color:var(--green)}
.mzone.correct{border-color:var(--green);background:var(--green-soft)}
.mzone.wrong{border-color:var(--red);background:var(--red-soft)}
.mbank{display:flex;flex-direction:column}
.mchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;margin-bottom:8px;cursor:grab;color:var(--ink);font-size:13.5px;text-align:left;font-family:var(--sans)}
.mchip:disabled{cursor:default;opacity:.5}
.mchip.selchip{border-color:var(--amber);background:var(--amber-soft)}
.mchip.used{opacity:.35}
.mhintline{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- order ---------- */
.ordlist{list-style:none;margin:0;padding:0;counter-reset:ord}
.orditem{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.orditem.dragover{border-color:var(--green)}
.orditem .num{font-family:var(--mono);color:var(--amber);font-weight:700;min-width:22px;text-align:center}
.orditem .txt{flex:1;font-size:14px}
.orditem.correct{border-color:var(--green)}
.orditem.wrong{border-color:var(--red)}
.ordbtns{display:flex;gap:4px}
.ordbtns button{min-width:34px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);cursor:pointer;font-size:14px}
.ordbtns button:hover{border-color:var(--blue)}
/* ---------- fill ---------- */
.fillwrap{font-size:15.5px;color:var(--ink-dim);line-height:2.1;white-space:pre-wrap}
.fillin{font-family:var(--mono);font-size:13.5px;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 10px;min-height:38px;width:170px;margin:0 3px}
.fillin:focus{border-color:var(--blue);outline:none}
.fillin.correct{border-color:var(--green)}
.fillin.wrong{border-color:var(--red)}
.fbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:38px;font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer}
.fchip:hover{border-color:var(--amber)}
/* ---------- terminal ---------- */
.term{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:8px;background:var(--bg-elev);padding:8px 12px;font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.term-bar .dots{letter-spacing:3px;color:var(--red)}
.term-out{font-family:var(--mono);font-size:13px;line-height:1.55;color:#c8d8e6;padding:12px 14px;min-height:130px;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term-out .tl-dim{color:var(--ink-faint)}
.term-out .tl-danger{color:var(--red);font-weight:700}
.term-out .tl-echo{color:var(--ink)}
.term-line{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding:10px 14px}
.term-prompt{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--mono);font-size:13px;min-height:34px}
.term-in:focus{outline:none}
details.syntax{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin-top:10px}
details.syntax summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--amber);min-height:40px;display:flex;align-items:center}
details.syntax .artbody{padding:0 14px 12px}
/* ---------- logview ---------- */
.logpanel{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log-tools{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-elev);border-bottom:1px solid var(--line-soft)}
.logfilter{flex:1;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 12px;min-height:38px}
.logfilter:focus{border-color:var(--blue);outline:none}
.log-count{font-size:12px;color:var(--ink-faint);font-family:var(--mono);white-space:nowrap}
.loglines{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#bccfe0;padding:12px 14px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.loglines mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}
.wtitle{font-weight:700;margin:14px 0 10px;color:var(--ink)}
/* ---------- decision ---------- */
.dstep{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.dstep.locked{opacity:.9}
.dlabel{display:inline-flex;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue);border-radius:6px;padding:3px 9px;margin-bottom:8px}
.dprompt{font-family:var(--mono);font-size:13px;color:var(--ink-dim);background:var(--bg-surface-2);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 10px;white-space:pre-wrap}
.dq{font-weight:700;margin:0 0 10px}
.drecorded{color:var(--ink-faint);font-size:13px;margin-top:8px}
.dwhy{font-size:13.5px;color:var(--ink-dim);background:var(--bg-surface-2);border-radius:8px;padding:9px 12px;margin-top:8px}
/* ---------- hint ---------- */
.hintbox{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin-top:12px;color:var(--ink-dim)}
.hintbox .hb{color:var(--amber);font-weight:800;font-size:12px;letter-spacing:.1em;display:block;margin-bottom:4px}
.penaltynote{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- feedback ---------- */
.fb{border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.fb.ok{border-color:var(--green)}
.fb.bad{border-color:var(--red)}
.fb.part{border-color:var(--amber)}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 18px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb.ok .fb-head{background:var(--green-soft);color:var(--green)}
.fb.bad .fb-head{background:var(--red-soft);color:var(--red)}
.fb.part .fb-head{background:var(--amber-soft);color:var(--amber)}
.fb-credit{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim);font-weight:600}
.fb-body{padding:14px 18px;background:var(--bg-panel)}
.fi{display:flex;gap:9px;padding:4px 0;font-size:14px;color:var(--ink-dim)}
.fi .ic{flex-shrink:0;font-weight:800}
.fi.ok .ic{color:var(--green)}
.fi.bad .ic{color:var(--red)}
.fi.miss .ic{color:var(--ink-faint)}
.fi.warn .ic{color:var(--red)}
.fi.warn{color:var(--red);font-weight:600}
.fi.note{color:var(--ink-faint)}
.fb-explain{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:12px;color:var(--ink-dim);font-size:14px}
.fb-explain p{margin:0 0 10px}
.fb-explain p:last-child{margin-bottom:0}
.fb-study{margin-top:10px;font-size:13px;color:var(--blue)}
.fb .mono{margin-top:10px}
/* ---------- actions ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:10px 20px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-family:var(--sans)}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:transparent;color:#04120a}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-amber{background:var(--amber);border-color:transparent;color:#1c1204}
.ghost-note{color:var(--ink-faint);font-size:13px}
/* ---------- review ---------- */
.revlist{display:flex;flex-direction:column;gap:10px}
.revrow{display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex-wrap:wrap}
.revrow .rn{font-family:var(--mono);color:var(--amber);font-weight:700}
.revrow .rt{flex:1;color:var(--ink-dim);font-size:14px;min-width:200px}
.revrow .badge-skip{color:var(--ink-faint);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* ---------- results ---------- */
.res-head{border:1px solid var(--line);border-radius:14px;background:var(--bg-panel);padding:26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ring{width:172px;height:172px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--pct)*1%),var(--bg-elev) 0);display:grid;place-items:center;flex-shrink:0}
.ring .rin{width:134px;height:134px;border-radius:50%;background:var(--bg-panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:34px;font-weight:800;font-family:var(--mono)}
.ring .of{font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
.res-verdict{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.res-verdict.pass{color:var(--green)}
.res-verdict.fail{color:var(--red)}
.res-sub{color:var(--ink-dim);font-size:14px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.statcard{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.statcard .sv{font-size:22px;font-weight:800;font-family:var(--mono)}
.statcard .sv.ok{color:var(--green)}
.statcard .sv.part{color:var(--amber)}
.statcard .sv.bad{color:var(--red)}
.statcard .sv.skip{color:var(--ink-faint)}
.statcard .sl{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.pausereport{border:1px solid var(--line);border-radius:10px;background:var(--bg-panel);padding:12px 16px;color:var(--ink-dim);font-size:13.5px;margin-bottom:14px}
.restable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.restable th{background:var(--bg-elev);text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase}
.restable td{padding:8px 12px;border-top:1px solid var(--line-soft);color:var(--ink-dim)}
.restable td.num{font-family:var(--mono)}
.st-ok{color:var(--green);font-weight:700}
.st-part{color:var(--amber);font-weight:700}
.st-bad{color:var(--red);font-weight:700}
.st-skip{color:var(--ink-faint);font-weight:700}
/* ---------- overlay ---------- */

<script type="application/json" id="cm-exercise-meta">{"attackId":"T1021.008","attackName":"Direct Cloud VM Connections","objectType":"sub-technique","severity":"EXTREMELY_HARD","topicId":"t1021.008","batch":4,"title":"T1021.008 Direct Cloud VM Connections — EXTREMELY_HARD","difficulty":"extremely-hard","estimatedMinutes":60,"timerMinutes":60,"questionCount":17,"passMark":70,"learn":["T1021.008 is a sub-technique of T1021 (Remote Services) in the MITRE ATT&CK Lateral Movement tactic. At this level it chains with other techniques: a stolen or SIM-swap-reset cloud identity, an enablement change on serial console features, a provider-brokered session, a console password reset, and a pivot to fresh credentials — across AWS, Google Cloud and Azure in one story.","This exam trains broker-versus-guest log divergence forensics. The provider trail names the human and the path; the guest sees a broker address, a console device, or nothing at all until a shell runs. Collectors add lag, automation adds noise, and clock skew moves timestamps, so the timeline only holds if you join the sources with discipline.","Detection engineers build the programme you practise here: inventory every console path, baseline standing automation noise, write timestamp-window joins between provider pushes and guest logins, and page only on out-of-window enablement or new-principal pushes. The MITRE detection strategy DET0211 anchors the analytic wording.","Incident responders and threat hunters weigh conflicting signals: a key push that never became a login, a serial root login with no network trace, a VP's account suddenly speaking CLI. GRC and IR must contain without breaching customer SLAs, and every containment choice either preserves or destroys evidence.","The risks at this level are compound: one cloud identity can become persistent guest access through a console-created account, and cross-tenant overlaps hint at shared infrastructure. The defence is layered — M1042-style feature removal, M1018-style account management, MFA, logging everywhere, and rehearsed escalation paths."],"keywords":[{"theme":"Broker-vs-Guest Log Divergence","items":["broker IP vs operator IP","preauth closed connections","ttyS0 logins with zero netflow","collector lag vs event time","SSM session-data rows"]},{"theme":"Detection Engineering","items":["timestamp-window joins","baseline of automation noise","out-of-window enablement paging","new-principal key push rules","DET0211 analytic wording"]},{"theme":"Multi-Cloud Chaining","items":["SIM-swap cloud identity reset","serial root password reset","IAP tunnel pivots","cross-tenant IP overlap","SLA-aware containment"]},{"theme":"Evidence Handling","items":["hash before interpret","export whole windows","join within two minutes","label session paths","escalate with written hypotheses"]}]}</script>

var EXAMS = [{"id":"e01","type":"logview","title":"Divergence night across two VMs","summary":"Join trail, guest and serial records under noise.","scenario":"The panel below shows one night across two Kestrel Aerospace instances: CloudTrail rows, guest auth lines, an SSM session record and a serial console root login that no netflow saw. Standing automation adds noise — ops-audit-bot fetches console output hourly and the spend-sweeper stops untagged idle VMs on schedule. The IR lead wants the divergence note finished before the 09:00 review, so count carefully which key pushes actually became accepted guest logins.","question":"Complete the divergence note with the two values from the log:","hint":"Three SSH pushes appear; check which one produced an accepted login, and read the console device name.","explanation":"Three SendSSHPublicKey pushes appear, but only the 00:07:52 push produced an accepted guest login at 00:08:03; the 00:58:29 push died in a preauth close and the 01:44:52 push failed outright, so the count is one. The serial root login landed on ttyS0, the console device the network stack never touches. The SSM StartSession at 00:19 is a third broker path on the same instance, ops-audit-bot and spend-sweeper rows are scheduled noise, and the preauth close matters because a trail success with no guest login is a session that never happened — the classic divergence this note exists to explain.","study":"Study counting completed sessions versus pushes and labelling console devices.","filterable":true,"log":{"header":["time","source","detail"],"lines":["00:04:11Z  trail  DescribeInstances  principal=user/m-orion","00:07:52Z  trail  SendSSHPublicKey  principal=user/m-orion  instance=i-0aa11bb22cc33dd44  result=success","00:08:03Z  guest  auth.log  Accepted publickey for deploy from 18[.]206[.]107[.]24 port 40022","00:19:36Z  trail  StartSession  principal=user/m-orion  target=i-0aa11bb22cc33dd44","00:27:14Z  ssm  session-data  document=SSM-SessionManagerRunShell  runtime=shell","00:41:03Z  trail  GetConsoleOutput  principal=ops-audit-bot  instance=i-0aa11bb22cc33dd44","00:58:29Z  trail  SendSSHPublicKey  principal=svc-jenkins  instance=i-0cc22dd33ee44ff55  result=success","00:58:41Z  guest  auth.log  Connection closed by 18[.]206[.]107[.]24 port 51022 [preauth]","01:12:07Z  trail  SendSerialConsoleSSHPublicKey  principal=user/m-orion  instance=i-0aa11bb22cc33dd44  result=success","01:12:55Z  guest  login[9902]: ROOT LOGIN on 'ttyS0'","01:31:40Z  guest  useradd: new user: name=svc-maint, UID=1088","01:32:12Z  guest  visudo: svc-maint added to sudo group","01:44:52Z  trail  SendSSHPublicKey  principal=svc-jenkins  instance=i-0cc22dd33ee44ff55  result=failed","02:03:19Z  trail  StopInstances  principal=spend-sweeper  instance=i-0dd44ee55ff66aa77"]},"widget":{"type":"fill","question":"Only ___ of the three SSH key pushes ended in an accepted guest login, and the serial root login landed on device ___.","text":"Only ___ of the three SSH key pushes ended in an accepted guest login, and the serial root login landed on device ___.","blanks":["1","ttyS0"],"bank":["1","ttyS0","2","3","pts/0","console"]}},{"id":"e02","type":"decision","title":"Three clouds, twenty minutes","summary":"Chain signals across providers and choose escalation.","scenario":"03:00 UTC — three signals land within twenty minutes at Kestrel Aerospace. A SendSSHPublicKey fires from a VP's account that has never touched the CLI. The guest accepts a key login for a deploy user seconds later. In a different GCP project, an unknown actor flips serial-port-enable in project metadata during the same window. The three clouds, one identity question, and an aviation customer SLA all press on the same decision.","question":"Work through the four decision steps for the cross-cloud case:","hint":"Destructive choices destroy evidence; closing choices lose the cross-tenant link.","explanation":"The AWS pair proves a brokered SSH path exists but not who drove the shell, so identity work precedes blame. The VP's admission of pasting a command from a support link reframes the event as social engineering — the trail around that session becomes primary evidence, so it is captured, not accepted and closed. The GCP metadata flip by an unknown actor only means something when correlated for shared identity or source with the AWS side; treating separate projects as separate worlds is how cross-tenant campaigns hide. Freezing the credentials involved while keeping VMs online preserves both the SLA and the evidence, which is why fleet-wide shutdowns and week-long waits both fail.\n\nAttacker view: from the operator's chair, a pasted support-link command and a rented identity are cheap; the value comes from chaining providers before defenders correlate them, so speed of correlation is the real defence.","study":"Study cross-cloud correlation, social-engineering vectors and SLA-aware containment.","steps":[{"label":"STEP 1 OF 4 — read the pair","prompt":"Trail: SendSSHPublicKey from a VP's dormant account; guest: accepted key login for deploy.","question":"What do the AWS signals actually prove?","options":["A brokered SSH path, but not yet who drove the shell","Proof the VP is compromised","Proof of nothing, the events are forged"],"correct":0,"why":"The push and the accepted login prove a path; the human behind it is still open."},{"label":"STEP 2 OF 4 — the admission","prompt":"The VP says: I clicked a support link and pasted the command it showed me.","question":"How does the team treat the admission?","options":["Treat as a social-engineering vector, capture the session trail","Accept the story and close the case","Suspend the VP without recording anything"],"correct":0,"why":"A support-link paste is a real vector; the trail around it is now primary evidence."},{"label":"STEP 3 OF 4 — the second cloud","prompt":"GCP metadata shows serial-port-enable flipped in another project by an unknown actor.","question":"What makes the GCP flip meaningful?","options":["Correlate both tenants for shared identity or source","Ignore it — a different project cannot be linked","Disable every GCP project in the org instantly"],"correct":0,"why":"Shared identities or sources turn two oddities into one campaign."},{"label":"STEP 4 OF 4 — act now","prompt":"Correlation finds the same source address in both tenants; the SLA forbids a fleet stop.","question":"Which action fits right now?","options":["Freeze credentials involved, keep VMs online, escalate to IR","Stop every VM in both clouds","Wait a week for more signals"],"correct":0,"why":"Freezing kills the access while escalation preserves the SLA and the evidence."}]},{"id":"e03","type":"terminal","title":"Read the instance metadata","summary":"Confirm serial-port-enable without changing it.","scenario":"For the Kestrel GCP case you must confirm whether vm-gnc-01 carries instance-level serial-port-enable metadata, using one read-only gcloud call. The lab shell knows the standard cloud CLIs; deleting instances, adding metadata or removing keys would rewrite the state you are documenting and drop hardening that others rely on.","question":"Run the command that reads the instance's metadata items:","hint":"instances describe with a format filter prints metadata items for one VM.","explanation":"gcloud compute instances describe with the VM name, --zone and a --format filter on metadata.items prints the instance metadata, including any serial-port-enable entry, without changing anything. instances delete destroys the machine, and add-metadata or remove-metadata for the serial-port-enable key edits the very setting under review — evidence work reads, it never writes. describe-style calls are safe precisely because they leave no operational side effects.","study":"Study read-only gcloud instances describe with metadata format filters.","prompt":"responder@ir-bridge:~$","skill":"gcp-serial-audit","knownTools":["gcloud","jq"],"expected":"gcloud compute instances describe vm-gnc-01 --zone europe-west4-a --format='value(metadata.items)'","elements":[{"label":"the instances describe command","any":["instances describe"]},{"label":"the VM name","any":["vm-gnc-01"]},{"label":"the zone flag","any":["--zone"]},{"label":"the metadata format filter","any":["--format"]}],"forbidden":[{"any":["instances delete","add-metadata","remove-metadata"],"why":"Writing or deleting metadata during review rewrites the evidence and can drop hardening defaults."}],"output":["metadata.items:","serial-port-enable: TRUE","ssh-keys: user2:ssh-rsa AAAAB3Nza...qL1","block-project-ssh-keys: FALSE"]},{"id":"e04","type":"match","title":"Grade the night's patterns","summary":"Classify five telemetry patterns for the board.","scenario":"The war-room board at Kestrel Aerospace carries five unlabelled patterns from the night window. Before the 09:00 review you pin each one to its classification, because the reviewers will challenge any label they cannot defend from the raw rows.","question":"Match each pattern to its classification:","hint":"Two rows hinge on which address the guest recorded; one hinges on the device name.","explanation":"A trail push with a guest preauth close means the key was pushed but the login never completed. A ttyS0 login with no flow record is an out-of-band serial entry, because the console device needs no network. An accepted publickey from the IAP range means the session arrived through an IAP-forwarded tunnel. StartSession plus session-data rows are an SSM-brokered shell. A setMetadata change on serial-port-enable by a brand-new actor means the console path was being opened — the pattern that most often precedes everything else on this board.","study":"Study classification fingerprints for push, tunnel, SSM and serial paths.","pairs":[{"left":"trail push, guest closed preauth","right":"key pushed, login never completed"},{"left":"ttyS0 login with no flow record","right":"out-of-band serial entry"},{"left":"Accepted publickey from the IAP range","right":"IAP-forwarded SSH session"},{"left":"StartSession plus session-data rows","right":"SSM-brokered shell"},{"left":"setMetadata serial-port-enable by new actor","right":"console path being opened"}]},{"id":"e05","type":"mcq","title":"End-to-end attribution chain","summary":"Pick the artefact chain that attributes a serial login.","scenario":"The Kestrel IR lead asks for the artefact chain that attributes the 01:12 serial root login to a named human end-to-end, not just the strongest single row. Retention limits matter: the serial websocket flow itself is not kept, guest rows survive, and the full trail export is already hashed.","question":"Which artefact chain attributes the serial login end-to-end?","hint":"Three rows, three layers: push, session, console login.","explanation":"The push event, the serial session row and the console root login together cover identity, path and result — a chain that survives the missing websocket record. Netflow records from two subnets earlier that night are context, not attribution. A failed login attempt plus a CPU graph proves motion, not a person, and the VM's uptime plus a DescribeInstances row prove only that the machine existed. Chains beat single rows whenever one layer is not retained.","study":"Study building attribution chains across provider, broker and guest layers.","options":["Push event, serial session row, console root login","Netflow records from two subnets earlier that night","A failed login attempt and a CPU usage graph","The VM's uptime plus a DescribeInstances row"],"correct":0},{"id":"e06","type":"fill","title":"Why the guest is blind","summary":"Complete the forensic gap explanation.","scenario":"You draft the forensic gap paragraph for the Kestrel report, the one that explains why the guest contributed almost nothing for the serial portion of the night. Two terms carry the paragraph, and the review board will quote them verbatim.","question":"Complete the forensic gap paragraph with the two values:","hint":"One term names the console hardware path; the other names the provider record.","explanation":"A serial console writes to the machine's serial port, a path the network stack never sees, so the guest contributes no network record at all; only the provider's audit entry names the human who connected. The loopback interface still belongs to the guest network stack, the firewall sees nothing to block, and SSH and billing describe other planes entirely. Review boards quote this paragraph whenever someone asks why the guest logs look quiet.","study":"Study the out-of-band property of serial ports and provider-side attribution.","text":"A serial console writes to the machine's ___ , a path the network stack never sees, so only the provider's ___ entry names the human who connected.","blanks":["serial port","audit"],"bank":["serial port","audit","loopback","firewall","SSH","billing"]},{"id":"e07","type":"order","title":"Reconstruction with conflicts","summary":"Order the reconstruction steps for mixed artefacts.","scenario":"You lead the reconstruction of Kestrel's mixed-cloud night: trail exports, guest logs, an SSM session record and a serial login with no flow. Artefacts conflict on timestamps and sources, and the aviation customer expects a defensible method statement, so preserve first and interpret second.","question":"Arrange the reconstruction steps in order:","hint":"Export and hash before any joining; divergence flags close the work.","explanation":"Exporting the trail rows for the whole window comes first so no later query depends on live retention. Hashing and storing both provider and guest sets freezes the evidence before interpretation. Joining by timestamp within a two-minute window then absorbs normal clock skew between sources. Labelling each session path — SSH, IAP, SSM or serial — turns the join into a readable story, and flagging the divergence points for the IR lead comes last because every flag must cite the frozen, hashed evidence.","study":"Study conflict-aware reconstruction: export, hash, join, label, flag.","items":["Export the trail rows for the whole window first","Hash and store both provider and guest log sets","Join events by timestamp within a two-minute window","Label each session path: SSH, IAP, SSM or serial","Flag the divergence points for the IR lead"]},{"id":"e08","type":"multi","title":"Defend the divergence table","summary":"Pick the three true explanations of divergence.","scenario":"A reviewer challenges the Kestrel divergence table with one question: why does the guest disagree with the provider at all? Three of the five answers below are true and defensible from the raw rows; two are the myths that keep resurfacing in every postmortem. Mark the three true ones.","question":"Select the three statements that explain the divergence:","hint":"The two myths both make the guest look more informative than it is.","explanation":"True: the guest records the broker's IP rather than the human's, because the session arrives from provider infrastructure. True: serial sessions leave no guest network trace at all, since the console path bypasses the network stack. True: a failed key push still writes a trail row, so provider records exist for sessions that never happened. Myth: the guest always logs the operator's real home IP address — it cannot, the operator never connects directly. Myth: trail rows appear only after successful logins — pushes and failures are recorded too, which is exactly why counts differ between layers.","study":"Study the three divergence mechanisms: broker source, out-of-band path, push-only rows.","options":["The guest records the broker's IP, not the human's","Serial sessions leave no guest network trace at all","A failed key push still writes a trail row","The guest always logs the operator's real home IP address","Trail rows appear only after successful logins"],"correct":[0,1,2]},{"id":"e09","type":"logview","title":"Bastion, serial and one service account","summary":"Join Azure sign-ins, Bastion and serial rows.","scenario":"The Azure excerpt below covers vm-gnc-01 and vm-gnc-02 for one early morning at Kestrel: sign-in rows, Bastion audit records, Activity Log console connects and one Defender note that is expected schedule noise. Two identities appear, and one of them should never open a serial console. Filter the sources and finish the note for the review board.","question":"Complete the Azure triage note with the two values from the log:","hint":"Count the connects for vm-gnc-01 only, then read the SYSTEM-context channel name.","explanation":"vm-gnc-01 saw two serial console connects, both by t.iyer, whose MFA-satisfied sign-ins bracket them. The SYSTEM-context command channel is a feature of the SAC console, which is why a console session on a Windows VM is more powerful than it looks. svc-report's Bastion RDP session to vm-gnc-02 is expected schedule noise, matching the Defender note about the report collection task. The dangerous read is assuming every connect is routine: the pair of t.iyer connects at 03:11 and 03:29 around a SYSTEM-context channel is the row-pair the board must see.","study":"Study SAC SYSTEM-context channels and pairing sign-ins with console connects.","filterable":true,"log":{"header":["time","source","detail"],"lines":["03:02:11  SignIn  user=t.iyer@kestrel-aero[.]example  MFA=satisfied  ip=203[.]0[.]113[.]7  result=success","03:02:48  BastionAuditLogs  ConnectViaBastion  user=t.iyer  vm=vm-gnc-01  protocol=SSH","03:03:15  guest  sshd[7012]: Accepted publickey for t.iyer from 10[.]30[.]7[.]4 port 41220","03:05:40  guest  sudo: t.iyer : TTY=pts/2 ; COMMAND=/bin/journalctl -u gnc","03:11:26  ActivityLog  Microsoft.SerialConsole/serialPorts/connect/action  caller=t.iyer@kestrel-aero[.]example  vm=vm-gnc-01  result=Accepted","03:12:02  SAC  cmd channel opened (SYSTEM context)","03:13:44  guest  Security 4688 NewProcess=cmd.exe CreatorSubject=SYSTEM","03:18:09  SignIn  user=svc-report@kestrel-aero[.]example  MFA=none  ip=203[.]0[.]113[.]19  result=success","03:19:51  BastionAuditLogs  ConnectViaBastion  user=svc-report  vm=vm-gnc-02  protocol=RDP","03:24:33  Defender  ReportCollection task on vm-gnc-02 — expected schedule","03:29:02  ActivityLog  Microsoft.SerialConsole/serialPorts/connect/action  caller=t.iyer@kestrel-aero[.]example  vm=vm-gnc-01  result=Accepted","03:31:47  guest  Security 4634 Logoff user=t.iyer"]},"widget":{"type":"fill","question":"vm-gnc-01 saw ___ serial console connects, and the SYSTEM-context command channel is a feature of the ___ console.","text":"vm-gnc-01 saw ___ serial console connects, and the SYSTEM-context command channel is a feature of the ___ console.","blanks":["2","SAC"],"bank":["2","SAC","3","RDP","SSH","Bastion"]}},{"id":"e10","type":"decision","title":"Noise with one buried needle","summary":"Baseline automation and escalate the thin case.","scenario":"The Kestrel estate carries standing automation: ops-audit-bot calls GetConsoleOutput hourly and the spend-sweeper stops untagged idle VMs nightly. Buried in the same window, a one-off SendSSHPublicKey by the CFO's long-dormant account at 02:02 never produced a guest login. Paging on the automation is already fatiguing the team, and the CFO's row has no story yet.","question":"Work through the three decision steps for the noise case:","hint":"Noise is managed, not deleted; thin facts get a hypothesis, not a shutdown.","explanation":"The audit-bot and spend-sweeper traffic is standing automation noise: baseline it and suppress it from paging, because deleting the automations would also delete their audit value. The CFO key push with no completed login needs identity-team confirmation of whether a session was attempted — ignoring it because nothing succeeded is how quiet probes get missed, and stopping the CFO's VM punishes an account nobody has connected to. Keeping the evidence export running and escalating with a written hypothesis is the disciplined middle: force-resetting every account creates an outage, and closing the case as a false positive destroys the record of a push that really happened.","study":"Study noise baselining, probe handling and hypothesis-driven escalation.","steps":[{"label":"STEP 1 OF 3 — classify noise","prompt":"Hourly GetConsoleOutput by ops-audit-bot; nightly StopInstances by spend-sweeper.","question":"How is the automation traffic handled?","options":["Standing automation noise — baseline and suppress from paging","Malicious — hunt the bot owners now","Delete both automations"],"correct":0,"why":"Baselining keeps the automation's audit value while stopping the fatigue."},{"label":"STEP 2 OF 3 — the dormant push","prompt":"02:02: SendSSHPublicKey by the CFO's dormant account; no guest login followed.","question":"What is the sound next step?","options":["Confirm with the identity team whether a session was attempted","Ignore it — no login means harmless","Stop the CFO's VM"],"correct":0,"why":"A push without a login can still be a probe; the identity team resolves intent."},{"label":"STEP 3 OF 3 — case posture","prompt":"Facts are thin: one unexplained push, no session, no complaint.","question":"How is the case handled meanwhile?","options":["Keep evidence export running and escalate with a written hypothesis","Force a password reset on every account now","Close as false positive"],"correct":0,"why":"A written hypothesis keeps the case auditable while the facts mature."}]},{"id":"e11","type":"mcq","title":"What the console route adds","summary":"Explain the attacker's console preference.","scenario":"After the 01:12 serial root login, the crew reset root's password at the console. The Kestrel IR lead asks the team to explain — in attacker terms — why the console route was worth the extra enablement step when SSH keys already worked on the same machine.","question":"What does the console route add to an attacker's position?","hint":"Think about what kills a network login and what the console ignores.","explanation":"The console route adds a login path that survives network and key changes: firewalls can be fixed, SSH keys rotated, agents restarted, and the console still opens, because it depends on the provider channel and local credentials instead of the guest network. Bulk file transfer is not the console's strength — it is a text channel. Access still needs the cloud identity to reach the provider, so the identity is never bypassed, and billing meters are irrelevant to the technique.","study":"Study console persistence versus network-path dependencies.","options":["A login path that survives network and key changes","A faster bulk file transfer channel than the network","Access that never needs a cloud identity again","A route around the provider's billing meters"],"correct":0},{"id":"e12","type":"terminal","title":"Pull the console connects","summary":"Query the Activity Log for serialPorts/connect rows.","scenario":"For the Azure side of the Kestrel case you must export every serialPorts/connect row for one caller from the Activity Log using one read-only az command. The lab shell knows the standard cloud CLIs; running commands on VMs or opening new consoles would blur the line between evidence collection and live response.","question":"Run the Activity Log query for the caller's serial console connects:","hint":"activity-log list takes a start time and a caller filter.","explanation":"az monitor activity-log list with --start-time and --caller exports the caller's Activity Log rows, including the serialPorts/connect entries, without touching the estate. az vm run-command invoke executes commands inside a VM and az serial-console connect opens a new console — both cross from evidence collection into live response, which contaminates the record you are building. Read-only list queries keep the boundary clean.","study":"Study az monitor activity-log list filters for caller and time windows.","prompt":"responder@ir-bridge:~$","skill":"az-activity-audit","knownTools":["az","jq"],"expected":"az monitor activity-log list --start-time 2026-03-02T00:00:00Z --caller t.iyer@kestrel-aero[.]example","elements":[{"label":"the activity log query command","any":["az monitor activity-log list"]},{"label":"the start time flag","any":["--start-time"]},{"label":"the caller filter flag","any":["--caller"]},{"label":"the caller value","any":["t.iyer"]}],"forbidden":[{"any":["az vm run-command invoke","az serial-console connect"],"why":"Running commands or opening consoles during evidence collection contaminates the record."}],"output":["[","  { \"caller\": \"t.iyer@kestrel-aero[.]example\",","    \"operationName\": \"Microsoft.SerialConsole/serialPorts/connect/action\",","    \"vm\": \"vm-gnc-01\", \"result\": \"Accepted\", \"time\": \"03:11:26Z\" },","  { \"caller\": \"t.iyer@kestrel-aero[.]example\",","    \"operationName\": \"Microsoft.SerialConsole/serialPorts/connect/action\",","    \"vm\": \"vm-gnc-01\", \"result\": \"Accepted\", \"time\": \"03:29:02Z\" }","]"]},{"id":"e13","type":"fill","title":"The rule's join keys","summary":"Name the event and the shared join value.","scenario":"You spec the high-fidelity rule that joins provider pushes to guest logins for Kestrel's fleet, so the SOC trusts one rule instead of three noisy ones. The spec names the provider event and the value both records share, inside a two-minute window.","question":"Complete the rule spec with the two values:","hint":"The event name starts with SendSSH; the shared value is the address both records carry.","explanation":"The rule pairs the provider's SendSSHPublicKey push event with the guest's accepted-key line, joining on a two-minute timestamp window and the broker address both records share. DescribeInstances only lists machines, the attacker's address never appears in guest rows, and DNS and billing carry nothing about the session. Broker-address joins are what make the rule high-fidelity: a push and a login on the same broker address inside the window is one session, not two coincidences.","study":"Study broker-address and timestamp-window joins for high-fidelity session rules.","text":"A high-fidelity rule pairs the provider's ___ push event with the guest's accepted-key line, joining on a two-minute window and the ___ address both records share.","blanks":["SendSSHPublicKey","broker"],"bank":["SendSSHPublicKey","broker","DescribeInstances","attacker","billing","DNS"]},{"id":"e14","type":"match","title":"Estate hardening matrix","summary":"Match hardening rows to providers and ATT&CK anchors.","scenario":"The Kestrel hardening matrix has six rows and two columns: which provider the row applies to, and which ATT&CK anchor justifies it. You fill the matrix so the aerospace customer audit can trace each control to a published anchor.","question":"Match each hardening row to its provider or ATT&CK anchor:","hint":"Three rows are provider baselines; three are published identifiers.","explanation":"A serial-port-enable FALSE baseline is GCP hardening, because that metadata key gates the GCP serial console. Serial console off at account level is the AWS equivalent. Serial Console RBAC limited to named users is the Azure equivalent. M1018 is User Account Management, M1042 is Disable or Remove Feature or Program, and DET0211 is the detection strategy for direct VM console access. Tracing each row to a published anchor is what survives an audit.","study":"Study per-provider console baselines and their ATT&CK anchor identifiers.","pairs":[{"left":"serial-port-enable FALSE baseline","right":"GCP hardening"},{"left":"serial console off at account level","right":"AWS hardening"},{"left":"Serial Console RBAC to named users","right":"Azure hardening"},{"left":"M1018","right":"User Account Management"},{"left":"M1042","right":"Disable or Remove Feature or Program"},{"left":"DET0211","right":"Direct VM console access detection"}]},{"id":"e15","type":"mcq","title":"The timeline that moved","summary":"Explain ingestion lag versus event time.","scenario":"The guest log shows an accepted key login at 00:08:03 UTC and the trail shows the push at 00:07:52 UTC, but the SIEM ingested the guest line forty minutes later because a collector backlog drained late. Legal asks why the timeline in the first draft of the Kestrel report appeared to move overnight.","question":"What explains the apparent timeline shift?","hint":"Separate when an event happened from when a pipe delivered it.","explanation":"Ingestion lag moved the SIEM time, not the event time: a collector backlog changes when a record arrives, never when it occurred, so event-time joins are the fix. Someone editing logs between collectors is a serious claim with no supporting artefact here. CloudTrail stores UTC, not local time zones, and the guest clock jumping backwards is unnecessary when a plain backlog explains the forty minutes. Reports that cite ingestion time instead of event time drift whenever backlogs occur.","study":"Study event time versus ingestion time and normalised UTC joins.","options":["Ingestion lag moved the SIEM time, not event time","Someone edited the guest logs between the collectors","The trail stores timestamps in local time zones","The guest clock jumped backwards during login"],"correct":0},{"id":"e16","type":"order","title":"Detection programme rollout","summary":"Order the programme across three clouds.","scenario":"You design the detection programme for brokered VM sessions across Kestrel's three clouds. The estate's audit bots and janitors generate known noise, the SOC rejects rules that page on routine work, and the aerospace customer requires quarterly validation. Sequence the programme so each stage feeds the next.","question":"Arrange the detection programme steps in order:","hint":"Inventory first; noise second; drills last.","explanation":"The inventory of every console-access path per provider comes first, because rules written against an unknown estate page on fiction. Baseline the standing automation noise second, so joins can exclude the audit bots and janitors deliberately rather than by luck. The timestamp-window rules joining provider events to guest logins come third. Paging only on out-of-window enablement and new-principal pushes fourth keeps the on-call trust. Quarterly purple-team drills for the console path come last, validating the whole chain against real operator behaviour.\n\nDefender view: the programme's strength is the order — teams that write rules before baselining noise burn on-call trust, and teams that skip drills discover their join windows are wrong during a real incident instead of a rehearsal.","study":"Study detection programme ordering: inventory, baseline, join, page, drill.","items":["Inventory every console-access path per provider","Baseline standing automation noise (audit bots, janitors)","Write rules joining provider events to guest logins","Page only on out-of-window enablement and new-principal pushes","Run purple-team drills for the console path quarterly"]},{"id":"e17","type":"decision","title":"Capstone: persistent account, live SLA","summary":"Contain a console-created account without breaching SLAs.","scenario":"Two weeks later at Kestrel Aerospace: the svc-maint account created through the serial console at 01:31 logs in nightly through an IAP tunnel, and its source range also touched a partner tenant. GRC demands containment tonight; the platform team warns that stopping the fleet breaches the aviation customer's SLA. Four steps decide whether the night ends clean.","question":"Work through the four decision steps for the capstone case:","hint":"Containment can preserve availability; evidence must survive the report.","explanation":"Revoking svc-maint and its keys removes the persistence while the fleet keeps flying, so it is the containment that respects the SLA; deallocating the fleet or rotating every root password creates exactly the outage the SLA forbids. The partner-tenant IP overlap is a cross-tenant correlation question, so threat intel gets it — partners are trusted until correlated, and blocking an ASN wholesale punishes a whole ecosystem. Freezing log exports and hashing the joined timeline gives the aviation customer evidence instead of promises, and deleting noisy rows to shrink the archive would be evidence destruction. Disabling serial console fleet-wide with an allowlisted break-glass path is the durable control that closes the road this account used.","study":"Study SLA-aware containment, cross-tenant escalation and durable console hardening.","steps":[{"label":"STEP 1 OF 4 — containment","prompt":"svc-maint logs in nightly via IAP tunnel; the fleet must stay up.","question":"Which containment keeps the SLA intact?","options":["Revoke svc-maint and its keys, keep VMs running","Deallocate the whole fleet","Change every root password fleet-wide"],"correct":0,"why":"Revoking the account kills persistence without manufacturing an outage."},{"label":"STEP 2 OF 4 — the overlap","prompt":"svc-maint's source range also touched a partner tenant this month.","question":"How is the overlap handled?","options":["Escalate to threat intel for cross-tenant correlation","Ignore it — partners are always trusted","Block the partner's ASN"],"correct":0,"why":"Correlation decides coincidence versus campaign; ASN blocks punish bystanders."},{"label":"STEP 3 OF 4 — the customer","prompt":"The aviation customer wants proof of impact and scope tonight.","question":"What does the customer receive?","options":["Frozen log exports and a hashed joined timeline","Deleted noisy rows to shrink the archive","A promise there was no impact"],"correct":0,"why":"Hashed exports survive scrutiny; promises and pruned archives do not."},{"label":"STEP 4 OF 4 — the durable fix","prompt":"Containment holds and the timeline is frozen.","question":"Which long-term control closes the road?","options":["Disable serial console fleet-wide, allowlisted break-glass only","Keep everything open for developer speed","Alert on nothing to reduce fatigue"],"correct":0,"why":"Feature removal plus an allowlisted break-glass path shrinks surface and keeps alarms sharp."}]}];

/* ==== utils ==== */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function norm(s){
  return String(s == null ? "" : s).toLowerCase().replace(/\s+/g," ").replace(/[.,;:!]+$/,"").trim();
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function fmt1(n){ return (Math.round(n * 100) / 100).toFixed(1); }
function wordCount(s){ return String(s || "").split(/\s+/).filter(Boolean).length; }
function $(id){ return document.getElementById(id); }
function byClass(root, cls){ return root.getElementsByClassName(cls); }

/* ==== timer ==== */
function setTimerState(next){
  var now = Date.now();
  if(S.tStateAt != null){
    var dt = (now - S.tStateAt) / 1000;
    if(S.tState === "PAUSED_MANUAL") S.pauseManual += dt;
    if(S.tState === "PAUSED_AUTO_CHECK") S.pauseAutoCheck += dt;
  }
  S.tState = next;
  S.tStateAt = now;
  updateHeader();
}
setInterval(function(){
  if(S.tState === "RUNNING"){
    S.remaining -= 1;
    S.elapsed += 1;
    if(S.remaining <= 0){
      S.remaining = 0;
      updateClock();
      finish();
      return;
    }
    updateClock();
  }
}, 1000);
function updateClock(){ var c = $("tb-clock"); if(c) c.textContent = fmtClock(S.remaining); }

/* ==== header ==== */
function sevClass(){ return "sev-" + META.severity; }

function answeredCount(){
  var n = 0;
  for(var k in S.checked){ if(Object.prototype.hasOwnProperty.call(S.checked, k)) n++; }

}

  return S.skipList.filter(function(i){ return !S.checked[i]; });

  var counter = $("tb-counter"), stateEl = $("tb-state");

      : ((S.phase === "review") ? ("Review pool: " + pendingSkips().length)
      : ("Exercise " + (S.idx + 1) + " / " + total));
  } else {
    counter.textContent = "Exercises " + done + " / " + total;
  }
  var sev = $("tb-sev");

  sev.textContent = META.severity.replace("_", " ");

  $("btn-pause").disabled = !(S.tState === "RUNNING" || S.tState === "PAUSED_AUTO_CHECK");
}

/* ==== postMessage integration ==== */
window.addEventListener("message", function(ev){
  var d = ev.data;
  if(!d || typeof d !== "object") return;
  if(d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT"){
    S.init = d;
    var slot = $("candline");
    if(slot && d.username){
      slot.textContent = "Candidate: " + d.username + (d.country ? " · " + d.country : "");
      slot.style.display = "block";
    }
  }
});
function postScore(){
  if(S.scorePosted) return;
  S.scorePosted = true;
  var rounded = Math.round(S.score);
  var total = 0, i;
  for(i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null) total++;
  }
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var msg = {
    type: "CYBERPULSE_SCORE",
    topicId: META.topicId,
    batch: META.batch,
    score: rounded,
    total: total,
    percent: percent,
    passed: passed
  };
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage(msg, location.origin);
    }
  }catch(e){ /* standalone file:// — no parent handshake */ }
}

/* ==== answer defaults ==== */
function defaultAnswer(ex){
  var i, d;
  switch(ex.type){
    case "mcq": return { sel: -1 };
    case "multi": return { sel: [] };
    case "match":
      d = []; for(i = 0; i < ex.pairs.length; i++) d.push(-1); return { assign: d };
    case "order":
      d = []; for(i = 0; i < ex.items.length; i++) d.push(i);
      return { seq: shuffle(d) };
    case "fill":
      d = []; for(i = 0; i < ex.blanks.length; i++) d.push(""); return { vals: d };
    case "terminal": return { cmd: "" };
    case "logview": return { w: defaultAnswer(ex.widget) };
    case "decision":
      d = []; for(i = 0; i < ex.steps.length; i++) d.push(-1); return { steps: d, cursor: 0 };
  }
  return {};
}
function ensureAnswer(ex, i){
  if(S.answers[i] == null) S.answers[i] = defaultAnswer(ex);
  return S.answers[i];
}

  S.screen = "exam";
  ensureAnswer(ex, i);
  var m = $("main");
  var res = S.checked[i];
  var lock = res != null;
  var collapsed = !lock && wordCount(ex.scenario) > 70;
  var html = '<section class="excard">';
  /* scenario block */
  html += '<div class="blk blk-scenario"><div class="blk-label"><span class="dot"></span>SCENARIO</div>' +
          '<h3 class="ex-title">' + esc(ex.title) + "</h3>";
  if(collapsed && !lock){
    html += '<p class="summary">' + esc(ex.summary) + '</p><button class="showfull" id="btn-showfull" type="button">▸ Show full scenario</button><div class="scen-body hidden" id="scen-full">' + scenInner(ex) + "</div>";
  } else {
    if(collapsed) html += '<p class="summary">' + esc(ex.summary) + "</p>";
    html += '<div class="scen-body">' + scenInner(ex) + "</div>";
  }
  html += "</div>";
  /* question block */
  html += '<div class="blk blk-question"><div class="blk-label"><span class="dot"></span>QUESTION</div><p class="q-text">' + esc(ex.question) + "</p></div>";
  /* answer block */

  /* hint + feedback slots */
  html += '<div id="hintslot"></div><div id="fbslot"></div>';
  /* actions */

function renderByType(ex, area, i, lock, res){

function renderChoice(ex, root, ans, lock, res, isMulti, path){
  var correct = isMulti ? ex.correct : [ex.correct];
  ex.options.forEach(function(opt, oi){
    var chosen = isMulti ? ans.sel.indexOf(oi) !== -1 : ans.sel === oi;
    var mark = "", cls = "";
    if(!lock){
      if(chosen){ mark = isMulti ? "☑" : "◉"; cls = "sel"; }
    } else {
      var isCorr = correct.indexOf(oi) !== -1;
      if(isCorr){ mark = "✓"; cls = "correct"; }
      else if(chosen){ mark = "✗"; cls = "wrong"; }
      else { cls = "dim"; }
    }
    root.insertAdjacentHTML("beforeend", optionRow(opt, oi, chosen, mark, cls));
  });
  var btns = byClass(root, "opt");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      btn.addEventListener("click", function(){
        if(lock) return;
        var oi = parseInt(btn.getAttribute("data-i"), 10);
        if(isMulti){
          var p = ans.sel.indexOf(oi);
          if(p === -1) ans.sel.push(oi); else ans.sel.splice(p, 1);
          btn.classList.toggle("sel");
          btn.setAttribute("aria-pressed", btn.classList.contains("sel") ? "true" : "false");
          btn.querySelector(".mark").textContent = btn.classList.contains("sel") ? "☑" : "";
        } else {
          ans.sel = oi;
          for(var z = 0; z < btns.length; z++){
            btns[z].classList.remove("sel");
            btns[z].setAttribute("aria-pressed", "false");
            var mk = btns[z].querySelector(".mark"); if(mk) mk.textContent = "";
          }
          btn.classList.add("sel");
          btn.setAttribute("aria-pressed", "true");
          btn.querySelector(".mark").textContent = "◉";
        }
      });
    })(btns[b]);
  }
}
function renderMatch(ex, root, ans, lock, res){
  var n = ex.pairs.length;
  var chipSel = -1;
  var html = '<div class="mgrid"><div class="mcol"><h4>Items</h4>';
  for(var z = 0; z < n; z++){
    html += '<div class="mrow"><div class="mleft">' + esc(ex.pairs[z].left) + '</div>' +
            '<button type="button" class="mzone" data-z="' + z + '" aria-label="Assigned value for ' + esc(ex.pairs[z].left) + '">— drop here —</button></div>';
  }
  html += '</div><div class="mbank"><h4>Answer bank</h4>';
  ex.pairs.forEach(function(pr, ri){
    html += '<button type="button" class="mchip" draggable="true" data-r="' + ri + '">' + esc(pr.right) + "</button>";
  });
  html += '</div></div><p class="mhintline">Click a bank item, then click a drop zone — or drag the item onto a zone. Click a filled zone to clear it.</p>';
  root.innerHTML = html;
  var zones = byClass(root, "mzone");
  var chips = byClass(root, "mchip");
  function paint(){
    for(var z = 0; z < n; z++){
      var zz = zones[z];
      var v = ans.assign[z];
      if(v === -1){
        zz.textContent = "— drop here —";
        zz.classList.remove("filled", "correct", "wrong");
      } else {
        zz.textContent = ex.pairs[v].right;
        zz.classList.add("filled");
        if(lock){
          zz.classList.remove("wrong", "correct");
          zz.classList.add(v === z ? "correct" : "wrong");
        }
      }
    }
    for(var c = 0; c < chips.length; c++){
      var used = ans.assign.indexOf(c) !== -1;
      chips[c].classList.toggle("used", used);
      if(used) chips[c].classList.remove("selchip");
    }
  }
  function assign(z, r){
    if(r === -1) return;
    for(var k = 0; k < n; k++){ if(ans.assign[k] === r) ans.assign[k] = -1; }
    ans.assign[z] = r;
    chipSel = -1;
    paint();
  }
  for(var zi = 0; zi < zones.length; zi++){
    (function(z){
      var zz = zones[z];
      zz.addEventListener("click", function(){
        if(lock) return;
        if(chipSel !== -1) assign(z, chipSel);
        else if(ans.assign[z] !== -1){ ans.assign[z] = -1; paint(); }
      });
      zz.addEventListener("dragover", function(e){ if(!lock){ e.preventDefault(); zz.classList.add("dragover"); } });
      zz.addEventListener("dragleave", function(){ zz.classList.remove("dragover"); });
      zz.addEventListener("drop", function(e){
        e.preventDefault(); zz.classList.remove("dragover");
        if(lock) return;
        var r = parseInt(e.dataTransfer.getData("text/plain"), 10);
        if(!isNaN(r)) assign(z, r);
      });
    })(zi);
  }
  for(var ci = 0; ci < chips.length; ci++){
    (function(c){
      var cc = chips[c];
      cc.addEventListener("click", function(){
        if(lock) return;
        if(chipSel === c){ chipSel = -1; cc.classList.remove("selchip"); }
        else {
          chipSel = c;
          for(var k = 0; k < chips.length; k++) chips[k].classList.remove("selchip");
          cc.classList.add("selchip");
        }
      });
      cc.addEventListener("dragstart", function(e){
        e.dataTransfer.setData("text/plain", String(c));
        e.dataTransfer.effectAllowed = "copy";
      });
    })(ci);
  }
  paint();
}
function renderOrder(ex, root, ans, lock, res){
  root.innerHTML = '<div class="obank"><h4>Steps — put them in the correct order</h4><ol class="ordlist"></ol>' +
    '<p class="mhintline">Drag a step onto another step, or use ▲ / ▼.</p></div>';
  var list = root.querySelector(".ordlist");
  function paint(){
    list.innerHTML = "";
    ans.seq.forEach(function(itemIdx, pos){
      var li = document.createElement("li");
      li.className = "orditem";
      li.setAttribute("draggable", "true");
      li.setAttribute("data-pos", String(pos));
      var mark = "";
      if(lock) mark = itemIdx === pos ? " ✓" : "";
      li.innerHTML = '<span class="num">' + (pos + 1) + '</span><span class="txt">' + esc(ex.items[itemIdx]) + mark + "</span>" +
        '<span class="ordbtns"><button type="button" data-mv="up" aria-label="Move up" ' + (lock ? "disabled" : "") + ">▲</button>" +
        '<button type="button" data-mv="down" aria-label="Move down" ' + (lock ? "disabled" : "") + ">▼</button></span>";
      if(lock) li.classList.add(itemIdx === pos ? "correct" : "wrong");
      list.appendChild(li);
      li.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", String(pos)); });
      li.addEventListener("dragover", function(e){ if(!lock) e.preventDefault(); });
      li.addEventListener("drop", function(e){
        e.preventDefault();
        if(lock) return;
        var from = parseInt(e.dataTransfer.getData("text/plain"), 10);
        var to = parseInt(li.getAttribute("data-pos"), 10);
        if(!isNaN(from) && !isNaN(to) && from !== to) move(from, to);
      });
    });
    var btns = list.querySelectorAll("button[data-mv]");
    for(var b = 0; b < btns.length; b++){
      (function(btn){
        btn.addEventListener("click", function(){
          if(lock) return;
          var li = btn.closest(".orditem");
          var pos = parseInt(li.getAttribute("data-pos"), 10);
          var dir = btn.getAttribute("data-mv") === "up" ? pos - 1 : pos + 1;
          if(dir < 0 || dir >= ans.seq.length) return;
          move(pos, dir);
        });
      })(btns[b]);
    }
  }
  function move(from, to){
    var it = ans.seq.splice(from, 1)[0];
    ans.seq.splice(to, 0, it);
    paint();
  }
  paint();
}

    var rec = ans.hist[ans.hist.length - 1];

    var low = cmd.toLowerCase();

    (ex.forbidden || []).forEach(function(f){
      for(var v = 0; v < f.any.length; v++){

      }

      rec.out.push({ txt: "⚠ DANGEROUS — NEAR MISS: " + danger.why, cls: "danger" });
      printLine("⚠ DANGEROUS — NEAR MISS: " + danger.why, "tl-danger");

        rec.out.push({ txt: msg, cls: "dim" });

      }
    }
    inp.value = "";
  });
