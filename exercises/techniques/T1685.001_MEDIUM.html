<script>
var EXAM = {"meta": {"title": "T1685.001 Disable or Modify Windows Event Log — MEDIUM", "objectId": "T1685.001", "objectName": "Disable or Modify Windows Event Log", "objectType": "Sub-Technique", "tactic": "Defense Impairment (TA0112)", "platform": "Windows", "sevClass": "sev-medium", "sevIcon": "🟡", "sevWord": "MEDIUM", "estimatedMinutes": 45, "timerSeconds": 2700, "passMark": 70, "topicId": "t1685.001", "batch": 2}, "intro": {"learn": "\n<p class=\"lead\">Welcome back — one level up. In this <b>MEDIUM<\/b> exam you work with <b>T1685.001 — Disable or Modify Windows Event Log<\/b>, the same behaviour you met in the EASY exam, but now every exercise asks you to connect <b>two ideas<\/b> before you answer.<\/p>\n<p>Quick reminder of what this object is. It is a <b>Sub-Technique<\/b> in the MITRE ATT&amp;CK framework — a knowledge base that describes real attacker behaviour. The parent technique is <b>T1685 — Disable or Modify Tools<\/b>, and the attacker's goal here belongs to the <b>Defense Impairment<\/b> tactic (ID <b>TA0112<\/b>). The behaviour is simple to say and hard to notice: an attacker turns off or changes the <b>Windows Event Log<\/b> — the note-taking system of a Windows computer — so that defenders see less of what is happening.<\/p>\n<p>Imagine you are an analyst at a payment company. At 02:14 one workstation stops sending Security events. Your SIEM shows nothing new from that host, there is no \"log cleared\" event anywhere, and the host looks perfectly healthy. That is the classic signature of this technique: <b>silence, not an error message<\/b>. To handle it well you must connect things: a command line like <code>wevtutil sl Security /e:false<\/code> with the channel it affects, a registry <code>Start<\/code> value of 4 with the next reboot, a service stop with event <b>7035<\/b>, and a clear action (event <b>1102<\/b>) with the different sub-technique <b>T1685.005<\/b>.<\/p>\n<p>This exam mirrors real work. A <b>SOC analyst<\/b> triages the morning queue and separates tampering from maintenance. A <b>detection engineer<\/b> documents the logic of detection strategy <b>DET0187<\/b> and its analytic <b>AN0535<\/b>, including the mutable elements <code>AuthorizedAdminAccounts<\/code>, <code>ServiceNames<\/code> and <code>TimeWindow<\/code>. An <b>incident responder<\/b> restores logging without destroying evidence. A <b>red teamer<\/b> learns which method stays quiet — and a <b>blue teamer<\/b> learns which telemetry survives anyway. A <b>threat hunter<\/b> reuses the same commands as hunt queries, a <b>CTI analyst<\/b> maps incidents to the right sub-technique IDs, and a <b>GRC analyst<\/b> or <b>control owner<\/b> turns the mitigations (M1024, M1018, M1047) into policy and audit checks. You will also meet the neighbouring sub-techniques in the T1685 family, because telling them apart is part of the job.<\/p>\n<p>Every exercise gives you a realistic situation, one clear question, and partial credit where several items are right. Take your time after each Check — the timer stops while you read the feedback.<\/p>\n", "keywords": [{"theme": "Disabling methods and their exact effects", "items": ["<code>wevtutil sl &lt;channel&gt; /e:false<\/code> — switches one channel off; <code>wevtutil sl &lt;channel&gt;<\/code> only <i>reads<\/i> its config", "<code>sc config eventlog start= disabled<\/code> and registry <code>Start=4<\/code> — the change applies at the <b>next boot<\/b>, not immediately", "<code>auditpol /set /category:&quot;Logon/Logoff&quot; /success:disable<\/code> — silences one audit category and outcome, without stopping the service", "<code>Stop-Service EventLog -Force<\/code> / <code>sc stop eventlog<\/code> — stops the service now and is loud (event 7035)"]}, {"theme": "What each tamper leaves behind", "items": ["<b>System 7035<\/b> — a service entered the stopped state (name the service!) · <b>Security 1102<\/b> — the audit log was <i>cleared<\/i>, not disabled", "<b>Sysmon 1<\/b> — process create with the full command line · <b>Sysmon 13<\/b> — a registry value was set (the <code>Start<\/code> value)", "Separate channels: Security, System, Sysmon each keep their own pipe — disabling one does not silence the others"]}, {"theme": "Detection logic you must be able to write down", "items": ["<b>DET0187<\/b> — Detect Disabled Windows Event Log · analytic <b>AN0535<\/b>", "Mutable elements: <code>AuthorizedAdminAccounts<\/code>, <code>TimeWindow<\/code>, <code>ServiceNames<\/code>"]}, {"theme": "Restore-and-verify workflow", "items": ["Confirm what was switched off → capture evidence → restore config → verify events flow again → hunt inside the blind-spot window"]}, {"theme": "Attacker vs defender trade-offs", "items": ["Disable vs clear: silence going forward vs deleting the past (and firing 1102)", "Dual perspective: the same red-team action seen from the blue-team side, with the telemetry that survives"]}, {"theme": "The T1685 family around you", "items": ["<b>T1685.005<\/b> Clear Windows Event Logs · <b>T1685.002<\/b> Disable or Modify Cloud Log · <b>T1685.004<\/b> Disable or Modify Linux Audit System Log · <b>T1685.006<\/b> Clear Linux or Mac System Logs", "<b>M1024<\/b> Restrict Registry Permissions · <b>M1018<\/b> User Account Management · <b>M1047<\/b> Audit"]}], "how": "\n<ul class=\"howlist\">\n<li><b>Goal:<\/b> reach at least <b>70%<\/b>. That is a <span class=\"ok-i\">✓ PASS<\/span>. Below it is a <span class=\"err-i\">✗ FAIL<\/span>, and you can retake the exam.<\/li>\n<li><b>16 exercises at MEDIUM level.<\/b> Every exercise connects two ideas: a command and its effect, an event and the response, an attacker move and the defender's counter. Types in this file: a log-viewer triage, matching pairs, drag-and-drop buckets, fill-in-the-blank notes, a prioritised action list, one branching decision, one terminal command, and a few choice questions. The three blocks <b style=\"color:var(--accent-blue)\">SCENARIO<\/b>, <b style=\"color:var(--accent-amber)\">QUESTION<\/b> and <b style=\"color:var(--accent-green)\">YOUR ANSWER<\/b> always appear in that order.<\/li>\n<li><b>Timer:<\/b> this exam gives you <b>45 minutes<\/b>. Press <b>⏸ Pause<\/b> for a real break — the exercise hides until you press Resume. When you press <b>✓ Check<\/b>, the timer stops by itself for feedback review and resumes only when you press <b>Next ▶<\/b>. The header always tells you which pause is active.<\/li>\n<li><b>Partial credit:<\/b> multi-item exercises are graded item by item with the formula <code>max(0, (H − W) / N)<\/code> — right items count for you, wrong items count against you. Wrong selections lower your credit, so answer precisely. One-choice exercises are simply right or wrong.<\/li>\n<li><b>Hint:<\/b> the 💡 Hint button gives one nudge per exercise and costs 10% of that exercise's credit.<\/li>\n<li><b>Skip:<\/b> every exercise has a ⚠ Skip button. Skipped exercises wait in a pool; you can return to them as often as you like while time remains. Ones you never answer are excluded from your score.<\/li>\n<li>Press <b>Start<\/b> when you are ready. Work precisely — MEDIUM rewards two clean reasoning steps over one lucky guess.<\/li>\n<\/ul>\n"}, "exercises": [{"id": "m01", "type": "logs", "tag": "Morning shift triage", "summary": "Meridian Pay SIEM stream for FIN-WKS-014 — click every line that is direct evidence of T1685.001", "scenario": [{"prose": "It is 08:05 at the Meridian Pay SOC. The night queue holds one collection-health view: every event that host <b>FIN-WKS-014<\/b> (a finance workstation) produced between 02:14 and 03:15, as captured by Sysmon and the Windows channels before they went dark. Last night was also the planned patch window, so several services stopped and started normally. Your team lead says: “Separate the tampering from the maintenance before you escalate anything.”"}, {"label": "ARTEFACT 1 — SIEM export, FIN-WKS-014, night stream", "html": "<div class='codeblock'><span class='hl-dim'>Use the filter box. Click a line to select it.<\/span><\/div>"}], "question": "Click every log line that is direct evidence of the Disable or Modify Windows Event Log technique (T1685.001).", "hint": "Service stops are normal in a patch window — read the service <i>name<\/i> in each 7035. Then look at what each command line does to logging itself.", "logs": {"prompt": "Click every line that is direct evidence of T1685.001, then press Check.", "lines": [{"h": "<span class='hl-num'>02:14:07<\/span> Sysmon 1   ProcessCreate  <span class='hl-cmd'>wevtutil.exe<\/span> <span class='hl-flag'>sl Security /e:false<\/span>  User: FIN\\m.reid"}, {"h": "<span class='hl-num'>02:14:09<\/span> Sysmon 13  RegistryEvent  <span class='hl-pth'>HKLM\\SYSTEM\\CurrentControlSet\\Services\\EventLog\\Start<\/span> → <span class='hl-num'>4<\/span>"}, {"h": "<span class='hl-num'>02:14:41<\/span> System 7035  The <span class='hl-cmd'>EventLog<\/span> service entered the stopped state."}, {"h": "<span class='hl-num'>02:20:12<\/span> System 7035  The <span class='hl-dim'>Spooler<\/span> service entered the stopped state (planned print maintenance)."}, {"h": "<span class='hl-num'>02:31:55<\/span> Sysmon 1   ProcessCreate  <span class='hl-cmd'>auditpol.exe<\/span> <span class='hl-flag'>/get /category:*<\/span>"}, {"h": "<span class='hl-num'>02:33:02<\/span> Security 4624  An account successfully logged on.  LogonType 2  User: FIN\\m.reid"}, {"h": "<span class='hl-num'>02:41:18<\/span> System 7035  The <span class='hl-dim'>wuauserv<\/span> service entered the stopped state (patch cycle)."}, {"h": "<span class='hl-num'>03:02:26<\/span> Sysmon 1   ProcessCreate  <span class='hl-cmd'>sc.exe<\/span> <span class='hl-flag'>config eventlog start= disabled<\/span>"}, {"h": "<span class='hl-num'>03:05:44<\/span> Security 4688  A new process has been created.  <span class='hl-dim'>cmd.exe<\/span>"}, {"h": "<span class='hl-num'>03:12:10<\/span> Security <span class='hl-err'>1102<\/span>  The audit log was cleared.  User: FIN\\m.reid"}], "needles": [0, 1, 2, 7]}, "explain": "Four lines are direct evidence of T1685.001. Line 1 runs <code>wevtutil sl Security /e:false<\/code>, which switches the Security channel off. Line 2 sets the EventLog service <code>Start<\/code> value to 4 (disabled) — that is the boot-time change. Line 3 is the 7035 that names the <b>EventLog<\/b> service stopping, not a normal service. Line 8 runs <code>sc config eventlog start= disabled<\/code>, which makes the disable survive reboots. The other lines are noise or different: Spooler and wuauserv 7035 events are normal patch-window maintenance; <code>auditpol /get<\/code> and 4624/4688 only read or log; and 1102 is evidence of <b>clearing<\/b>, which belongs to sub-technique <b>T1685.005<\/b>, not to this one — selecting it was the trap. <b>Attacker view:<\/b> a short chain — flip the channel, pin the service, move on. <b>Defender view:<\/b> correlate the command lines with the service-state events, and never treat a 7035 as tampering before you read the service name.", "study": "Compare 7035 lines by service name, and review the difference between T1685.001 (disable) and T1685.005 (clear)."}, {"id": "m02", "type": "match", "tag": "Which technique owns this consequence?", "summary": "Match five consequences to T1685.001, T1685.005, or both", "scenario": [{"prose": "Your CTI analyst is writing the section of the incident report that separates <b>disabling<\/b> from <b>clearing<\/b>. She sends you five consequences and asks you to assign each one to the sub-technique that produces it: <b>T1685.001<\/b> (Disable or Modify Windows Event Log), <b>T1685.005<\/b> (Clear Windows Event Logs), or <b>both together<\/b>."}], "question": "Match each consequence to the technique that produces it.", "hint": "Ask two questions per row: does the past disappear, or only the future? And which of the two fires event 1102?", "match": {"left": [{"k": "L1", "t": "A host stops producing <i>new<\/i> Security events from now on."}, {"k": "L2", "t": "Old Application-log records are gone, but new events keep arriving."}, {"k": "L3", "t": "Event 1102 appears in the Security channel."}, {"k": "L4", "t": "A dashboard shows no new alerts from a host and no 1102 anywhere."}, {"k": "L5", "t": "A host loses its live recording first and its saved history later."}], "right": [{"k": "R1", "t": "T1685.001 — Disable or Modify"}, {"k": "R2", "t": "T1685.005 — Clear"}, {"k": "R3", "t": "Both techniques together"}], "pairs": {"L1": "R1", "L2": "R2", "L3": "R2", "L4": "R1", "L5": "R3"}}, "explain": "Disabling (T1685.001) silences the <b>future<\/b>: new recording stops, no 1102 appears, saved history survives — that is row 1 and row 4. Clearing (T1685.005) destroys the <b>past<\/b>: old records vanish while new events keep flowing, and it fires 1102 in the Security channel — rows 2 and 3. Row 5 is the full combo an attacker may run: impair first, clean up later — both techniques. This distinction matters because the defences differ: a disable is caught by config and service monitoring (DET0187), while a clear is caught by 1102 itself. Getting the label right decides which hunt you run next.", "study": "Re-read the ATT&amp;CK descriptions of T1685.001 and T1685.005 side by side."}, {"id": "m03", "type": "qcm", "tag": "Start=4 seen, service still running", "summary": "Registry says disabled, service says running — what is the correct reading and the correct next step?", "scenario": [{"label": "ARTEFACT 1 — EDR detection, FIN-SQL-02, 06:40", "html": "<p>Sysmon 13: <code>HKLM\\SYSTEM\\CurrentControlSet\\Services\\EventLog\\Start<\/code> changed <span class='hl-num'>1 → 4<\/span> by <code>FIN\\svc_patch<\/code><\/p>"}, {"label": "ARTEFACT 2 — Service check, same host, 06:41", "html": "<p><code>EventLog — STATE: 4 RUNNING — START_TYPE: 2 AUTO_START<\/code><\/p>"}, {"prose": "The two artefacts seem to contradict each other, and the on-call junior wants to close the ticket because “the service is running, so nothing happened.” Before anyone touches the host you must say what the pair of artefacts really means."}], "question": "Which reading and next step are correct?", "hint": "A Start value is a setting for the service's <i>next<\/i> start, not an off switch for the running one. One reboot is missing from this picture.", "qcm": {"options": [{"k": "A", "t": "The registry edit failed, because the service still runs — close the ticket."}, {"k": "B", "t": "The disable applies at the next boot; check for a pending reboot and restore the Start value now."}, {"k": "C", "t": "The EventLog service must be stopped right now on every host to match the registry."}, {"k": "D", "t": "The attacker already cleared the Security log, so also raise a 1102 alert."}], "correct": "B"}, "explain": "A registry <code>Start<\/code> value is read when the service <b>starts<\/b>, so a running EventLog service keeps running even after the value is set to 4. The change is a <b>boot bomb<\/b>: at the next reboot the service will not come back, and the blind spot begins. That is why the correct move is to check whether a reboot is scheduled (patch windows often are) and to restore the value from a known-good session before it applies. Option A reads the two artefacts as a contradiction instead of a sequence. Option C invents a rule that does not exist. Option D confuses disabling with clearing — there is no 1102 in this picture. <b>Attacker view:<\/b> set the value, wait for the natural reboot, stay invisible. <b>Defender view:<\/b> the registry write is your earliest warning — Sysmon 13 caught it precisely because the attack has not finished yet.", "study": "Review service start types: 2 = automatic, 3 = manual, 4 = disabled."}, {"id": "m04", "type": "term", "tag": "Terminal — read the audit policy", "summary": "Ticket MER-3391: type the auditpol command that shows every category without changing anything", "scenario": [{"prose": "You are on <b>FIN-WKS-014<\/b>, an elevated PowerShell console is open, and incident ticket <b>MER-3391<\/b> needs one thing before the next shift: proof of the <b>current audit policy for every category<\/b>, captured read-only, so the auditors can compare it with the baseline. The tool is <code>auditpol<\/code> — the Windows command-line tool that reads and changes per-category audit settings. Nothing on this host may change while you work."}], "question": "Type the auditpol command that displays the audit policy for every category.", "hint": "You need the read mode, not the write mode, and the wildcard belongs to /category:.", "term": {"prompt": "PS C:\\Users\\analyst>", "solution": "auditpol /get /category:*", "output": "Audit policy information\nSystem Audit Policy\n  Category/Subcategory                Setting\n  Logon/Logoff  Logon                 Success and Failure\n  Logon/Logoff  Logoff                Success\n  Account Logon Credential Validation     Success and Failure\n...", "elements": [{"re": "auditpol", "t": "the auditpol tool"}, {"re": "/get", "t": "the read-only /get mode"}, {"re": "category:", "t": "the /category target (all categories)"}], "nearMiss": [{"re": "/set", "t": "DANGEROUS — /set rewrites the audit policy instead of reading it", "out": "Policy modified — in this simulation you just changed the audit settings you were asked to read!"}, {"re": "/clear", "t": "DANGEROUS — /clear wipes the audit policy back to defaults", "out": "Audit policy cleared — every category reset. In real life this would widen the attacker's blind spot."}, {"re": "/remove|/restore|/backup", "t": "wrong mode — /remove, /restore and /backup do not display the live policy", "out": "Wrong mode — nothing usable for ticket MER-3391 was displayed."}]}, "explain": "The canonical command is <code>auditpol /get /category:*<\/code>. <code>auditpol<\/code> is the tool, <code>/get<\/code> is the read-only mode, and <code>/category:*<\/code> asks for every category in one output — exactly what the ticket demands. The wildcard matters: <code>/get<\/code> alone prints only the default view, while the auditors need all categories. The dangerous near-misses are real-world accidents: <code>/set<\/code> would rewrite the policy (and could disable auditing by mistake), and <code>/clear<\/code> would reset the whole policy to system defaults — silently widening the very blind spot you are investigating. Note how this exercise complements the blue team: when <code>wevtutil<\/code> channels go dark, the audit policy is often the second tap an attacker closes, and <code>auditpol /get<\/code> is how you verify yours is still open.", "study": "Read the auditpol help for /get, /set and /clear, and compare with the ATT&amp;CK procedure examples that use auditpol."}, {"id": "m05", "type": "branch", "tag": "Channel down — three-step triage", "summary": "FIN-WKS-014 stops sending Security events; decide verification, local evidence and containment", "scenario": [{"prose": "You are the senior on shift at Meridian Pay. Work through the triage one step at a time — each step continues the story, intermediate steps do not reveal answers, and the timer keeps running until the final Check."}], "question": "Choose the best action at each of the three steps.", "hint": "The EDR agent still talks. That is your best window into a host whose local channel is dark.", "branch": {"steps": [{"label": "STEP 1 OF 3 — First verification", "scen": [{"label": "SIEM note — 09:12", "html": "<p>FIN-WKS-014 stopped sending <b>Security channel<\/b> events at 02:14. No other host is affected. The EDR agent on FIN-WKS-014 is still reporting normally.<\/p>"}], "options": [{"k": "A", "t": "Check whether only that host's Security channel is affected and read its host telemetry from before 02:14."}, {"k": "B", "t": "Restart the SIEM collector first — missing events usually mean collector trouble."}, {"k": "C", "t": "Declare the logs lost and schedule a rebuild of the host."}], "correct": "A"}, {"label": "STEP 2 OF 3 — Local evidence", "scen": [{"label": "EDR timeline — FIN-WKS-014", "html": "<p>02:14:07 — <code>wevtutil sl Security /e:false<\/code> executed by <code>FIN\\m.reid<\/code> (helpdesk admin). No matching change ticket exists.<\/p>"}], "options": [{"k": "A", "t": "Treat it as a confirmed disable: capture the host's config and open a scope query for the same pattern."}, {"k": "B", "t": "Close it as an agent software bug — helpdesk admins run maintenance all the time."}, {"k": "C", "t": "Delete the EDR detection to reduce alert noise while the helpdesk is checked."}], "correct": "A"}, {"label": "STEP 3 OF 3 — Containment", "scen": [{"label": "HR context", "html": "<p><code>m.reid<\/code> belongs to the helpdesk admin group and is on approved leave this week. The workstation is still in use by the finance team.<\/p>"}], "options": [{"k": "A", "t": "Suspend the account, capture volatile config from the host, then re-enable the channel from a known-good session."}, {"k": "B", "t": "Reimage the workstation immediately tonight."}, {"k": "C", "t": "Email the helpdesk channel and wait for someone to confirm before doing anything."}], "correct": "A"}]}, "explain": "Step 1: the collector is innocent — every other host flows, so you verify the host's own timeline first. Step 2: a disable command run by a named user with no ticket is confirmed tampering, not a bug — capture before you touch anything, and scope for the same pattern estate-wide. Step 3: the account is suspended and the host config captured <b>before<\/b> the channel is re-enabled, from a trusted session; reimaging tonight destroys evidence you have not collected yet, and waiting leaves an active admin account in the attacker's hands. This is the two-step logic MEDIUM trains: verify with what still works (EDR), then act in the order evidence-first, restore-second.", "study": "Rehearse the restore-and-verify workflow until the order is reflexive."}, {"id": "m06", "type": "fill", "tag": "Detection note — DET0187", "summary": "Complete the detection engineer's note about DET0187 / AN0535 and its mutable elements", "scenario": [{"prose": "Detection engineer Mira documents analytic <b>AN0535<\/b> of detection strategy <b>DET0187<\/b> (“Detect Disabled Windows Event Log”) for the team wiki. The sentence below is missing four key values. Fill each blank — you can type or click a word from the shuffled bank."}], "question": "Complete the detection note with the four missing values.", "hint": "One blank is an event ID from the System channel; two blanks are the exact names of the analytic's mutable elements.", "fill": {"sentence": "The analytic watches the ___ channel of every Windows host for event ___ (a service changing state) on the services listed in ServiceNames, groups related events inside a rolling ___ of minutes so a stop and its config change stay one case, and honours the ___ list, which names the administrator accounts allowed to touch these settings without raising an alert.", "bank": ["System", "7035", "TimeWindow", "AuthorizedAdminAccounts", "Security", "1102", "ServiceNames"], "blanks": [{"accept": ["system"], "size": 10}, {"accept": ["7035"], "size": 8}, {"accept": ["timewindow", "time window"], "size": 13}, {"accept": ["authorizedadminaccounts", "authorized admin accounts"], "size": 22}]}, "explain": "Blank 1 is the <b>System<\/b> channel: service state changes are logged there, not in Security. Blank 2 is event <b>7035<\/b>, the service-state message that AN0535 pairs with Sysmon registry and process events. Blank 3 is the <code>TimeWindow<\/code> — the rolling window that keeps a stop, a <code>Start<\/code> write and a config change in one correlation so a reboot alone does not fragment the case. Blank 4 is <code>AuthorizedAdminAccounts<\/code>, the allowlist that keeps legitimate administrators from flooding the queue. The bank's <code>Security<\/code> and <code>1102<\/code> belong to the <i>clearing<\/i> story (T1685.005), and <code>ServiceNames<\/code> is a real mutable element too — but it lists services, it does not name the channel or the accounts. Writing this logic down precisely is what lets the next engineer tune the rule instead of rewriting it.", "study": "Read the AN0535 analytic page and name its three mutable elements from memory."}, {"id": "m07", "type": "dnd", "tag": "Service, policy/channel — or normal?", "summary": "Sort six items into service tampering, policy or channel tampering, and normal activity", "scenario": [{"prose": "Your triage queue mixes three kinds of items: tampering with the <b>EventLog service itself<\/b>, tampering with <b>audit policy or channels<\/b>, and perfectly <b>normal activity<\/b> that only looks suspicious. Sort all six chips. Wrong buckets cost credit, so read each command twice."}], "question": "Drag every item into the bucket that describes it.", "hint": "Two buckets are both T1685.001 but act on different parts of the logging stack; the third bucket contains reads and routine maintenance.", "dnd": {"buckets": [{"k": "B1", "t": "EventLog service tampering"}, {"k": "B2", "t": "Audit policy / channel tampering"}, {"k": "B3", "t": "Normal activity — not this technique"}], "items": [{"k": "I1", "t": "sc stop eventlog", "b": "B1"}, {"k": "I2", "t": "Stop-Service EventLog -Force", "b": "B1"}, {"k": "I3", "t": "wevtutil sl System /e:false", "b": "B2"}, {"k": "I4", "t": "auditpol /set /category:\"Logon/Logoff\" /success:disable", "b": "B2"}, {"k": "I5", "t": "sc query eventlog (read-only check)", "b": "B3"}, {"k": "I6", "t": "wevtutil sl Security (no /e flag — prints config)", "b": "B3"}]}, "explain": "I1 and I2 act on the <b>service<\/b> — stopping EventLog kills every channel at once, which is service tampering (bucket 1). I3 acts on a <b>channel<\/b> and I4 on the <b>audit policy<\/b>; both are policy-or-channel tampering (bucket 2) — note that I4 silences one category and outcome without touching any service. I5 and I6 are reads: <code>sc query<\/code> shows state and <code>wevtutil sl<\/code> without a value flag only prints the channel's configuration — nothing changes, so bucket 3. The subtle pair is I2 versus I4: both impair logging, but an attacker who stops the service announces it with 7035, while one who flips a category flag stays much quieter. Knowing which part of the stack each command touches tells you which detection to expect.", "study": "Compare the service layer (sc, Stop-Service), the channel layer (wevtutil sl) and the policy layer (auditpol set)."}, {"id": "m08", "type": "qcm", "tag": "Red side — no 1102, please", "summary": "Dual perspective (1/2): choose the method that stops the Security channel without firing 1102", "scenario": [{"prose": "This is the <b>attacker side<\/b> of one scenario; the next exercise is the defender side of the same host. You are operator “K” in an authorised red-team engagement against Meridian Pay, working under a signed rules-of-engagement document. On host <b>FIN-ACC-07<\/b> you hold local admin. Objective: the Security channel must stop recording during your next action. Constraints from the plan: no event <b>1102<\/b> may appear, and the log history must remain intact so the blue team can replay the engagement later."}], "question": "Which method meets both constraints?", "hint": "1102 comes from clearing. Which of these commands does not clear or delete anything?", "qcm": {"options": [{"k": "A", "t": "wevtutil cl Security — wipe the channel's content quickly."}, {"k": "B", "t": "wevtutil sl Security /e:false — flip the channel off."}, {"k": "C", "t": "wevtutil el — list every channel name."}, {"k": "D", "t": "sc query eventlog — check the service state first."}], "correct": "B"}, "explain": "Flipping the channel with <code>wevtutil sl Security /e:false<\/code> stops <i>future<\/i> recording, leaves the history untouched, and produces no 1102 — both constraints met. Option A is the classic trap: <code>cl<\/code> deletes the channel's content, destroys the history the engagement plan promised to preserve, and fires 1102 the moment the audit log is cleared — a loud confession. Options C and D are read-only; they change nothing and stop nothing. <b>Attacker view:<\/b> disabling is the quiet, reversible choice; clearing is noisy and irreversible. <b>Defender view:<\/b> that silence is exactly why channel-config monitoring (DET0187) exists — the disable leaves no 1102, but it does leave a Sysmon 1 process event with the full command line, and that is what the next exercise hunts with.", "study": "Compare the 1102 story with the channel-config story on the T1685.001 page."}, {"id": "m09", "type": "multi", "tag": "Blue side — what still records?", "summary": "Dual perspective (2/2): select every telemetry source that survives a Security-channel disable", "scenario": [{"prose": "Now the <b>defender side<\/b> of the same engagement. The blue team has established that FIN-ACC-07's Security channel was off for 18 minutes during operator K's action. The IR lead asks: “Even with Security dark, what did we still capture?” Not every source died — that is the whole point of layered telemetry."}], "question": "Select every telemetry source that can still record while the Security channel is disabled.", "hint": "Channels are separate pipes: turning one off does not empty the others, and some sensors never touch Windows channels at all.", "multi": {"options": [{"k": "A", "t": "The Sysmon operational channel (separate service and channel)."}, {"k": "B", "t": "The EDR agent streaming to the vendor cloud."}, {"k": "C", "t": "The System channel — e.g. a 7035 if a service changes state."}, {"k": "D", "t": "Security event 4688 process creation from the disabled channel."}, {"k": "E", "t": "A network sensor recording SMB traffic on the wire."}], "correct": ["A", "B", "C", "E"]}, "explain": "Correct: A, B, C and E. Sysmon runs as its own service writing to its own channel, so disabling Security does not touch it (A). The EDR agent collects from the kernel and ships to the cloud without depending on any channel (B). The System channel is a different pipe — it only dies if the EventLog service itself is stopped (C). A network sensor never reads Windows logs at all; it sees SMB on the wire regardless (E). Wrong: D is the trap — event 4688 is written <b>into<\/b> the Security channel, so when that channel is off, 4688 goes nowhere. Remember what died and what did not: that decides whether your blind-spot hunt uses host logs, EDR, network data — or all three.", "study": "Map your estate's channels and sensors: which telemetry survives a channel disable, and which dies with it?"}, {"id": "m10", "type": "match", "tag": "Event ID → first analyst move", "summary": "Match four alert artefacts to the correct first move", "scenario": [{"prose": "Four alerts arrived in one hour. Each has a correct <b>first move<\/b> — the action that verifies or preserves before anything else. Your queue lead pairs them to test your reflexes."}], "question": "Match each artefact to its correct first move.", "hint": "One move is about scope, one about the account behind a clear, one about capturing a command line, and one about a pending reboot.", "match": {"left": [{"k": "L1", "t": "System 7035 — the EventLog service stopped."}, {"k": "L2", "t": "Security 1102 — the audit log was cleared."}, {"k": "L3", "t": "Sysmon 1 — wevtutil running with /e:false."}, {"k": "L4", "t": "Sysmon 13 — EventLog Start changed to 4."}], "right": [{"k": "R1", "t": "Capture the full command line, parent process and user."}, {"k": "R2", "t": "Verify how many hosts show the same stop, then read the service config."}, {"k": "R3", "t": "Identify the account and check whether the clearing was authorised."}, {"k": "R4", "t": "Check for a pending reboot and reset the value before it applies."}], "pairs": {"L1": "R2", "L2": "R3", "L3": "R1", "L4": "R4"}}, "explain": "A 7035 on EventLog is verified by <b>scope<\/b> first — one host is an incident, four hundred is something else — then by the service config (R2). A 1102 names the account that cleared the log; the first move is asking whether that account had a reason (R3). A Sysmon 1 with <code>/e:false<\/code> is a live command line: capture parent, user and the full arguments before the trail cools (R1). A Start value write to 4 is a scheduled silence: find the pending reboot and fix the value first (R4). Each artefact drives a different first move because each one answers a different question — how big, who, what exactly, and when does it bite.", "study": "Drill the four artefact families: service state, audit clear, command line, registry value."}, {"id": "m11", "type": "order", "tag": "Restore visibility safely", "summary": "Order the five responder steps from confirm to report", "scenario": [{"prose": "FIN-WKS-014 is confirmed: Security channel off, Start value set to 4, no attacker artefacts beyond the tampering itself. Your IR lead asks for the restore plan in the correct order — the wrong order either destroys evidence or leaves you blind while believing otherwise."}], "question": "Put the five responder steps in the correct order.", "hint": "You cannot fix what you have not confirmed, and you should not hunt a window you have not verified is closed.", "order": {"items": [{"k": "O1", "t": "Confirm exactly what was switched off and how (channel, service or audit policy)."}, {"k": "O2", "t": "Capture the current config and volatile evidence from the host."}, {"k": "O3", "t": "Restore: re-enable the channel or set the service Start value back."}, {"k": "O4", "t": "Verify new events are arriving in the SIEM again."}, {"k": "O5", "t": "Report the blind-spot window and hunt inside it."}]}, "explain": "The safe order is confirm → capture → restore → verify → report-and-hunt. Confirming (1) stops you from repairing the wrong layer. Capturing (2) freezes the config and volatile state while they still exist. Restoring (3) then fixes the channel or the Start value — before verification, because restoration is a change and changes come after evidence. Verifying (4) is s Linux or macOS logs, and this is a Windows host. Partial credit applies — if you selected C, D or E, each wrong pick cancelled one right pick in the credit formula. Precision in ID selection is a reporting skill: every extra unsupported ID weakens the case and misdirects the hunt.", "study": "Learn the T1685 sibling list: .001 disable Windows, .002 cloud, .004 Linux audit log, .005 clear Windows, .006 clear Linux/Mac — and use their full names in reports."}, {"id": "m13", "type": "dnd", "tag": "Where does each artefact live?", "summary": "Sort six artefacts by the component that produces or holds them", "scenario": [{"prose": "A new joiner asks you to show “where each artefact actually lives.” Sort the six chips by component: the <b>System channel<\/b>, the <b>Security channel<\/b>, the <b>Sysmon channel<\/b>, and the <b>registry<\/b>. Each component receives two items."}], "question": "Drag every artefact to its component.", "hint": "Service-state messages, an audit-clear message, Sysmon's own events, and two values under the Services and Autologger keys.", "dnd": {"buckets": [{"k": "B1", "t": "System channel"}, {"k": "B2", "t": "Security channel"}, {"k": "B3", "t": "Sysmon channel"}, {"k": "B4", "t": "Registry"}], "items": [{"k": "I1", "t": "7035 service-state message", "b": "B1"}, {"k": "I2", "t": "1102 audit log cleared", "b": "B2"}, {"k": "I3", "t": "Sysmon 1 process create", "b": "B3"}, {"k": "I4", "t": "Sysmon 13 registry SetValue", "b": "B3"}, {"k": "I5", "t": "Services\\EventLog\\Start value", "b": "B4"}, {"k": "I6", "t": "Autologger\\EventLog-System\\Start value", "b": "B4"}]}, "explain": "I1 lives in the System channel — service control manager messages are System events. I2 lives in Security — 1102 is a Security event about the Security log itself. I3 and I4 are Sysmon's own products: process creation and registry writes, written to the Sysmon channel by the Sysmon service. I5 and I6 are registry values: the service's <code>Start<\/code> type under <code>Services\\EventLog<\/code> and the AutoLogger entry under <code>Control\\WMI\\Autologger\\EventLog-System<\/code> that decides whether the channel starts with the system. Knowing the home of each artefact is what makes the two-step reasoning work: the artefact tells you the component, and the component tells you which telemetry dies when that component is tampered with.", "study": "Draw the map: channel → typical events → what an attacker writes where."}, {"id": "m14", "type": "qcm", "tag": "What did auditpol actually change?", "summary": "A backup service account ran auditpol with two outcome flags — pick the true statement", "scenario": [{"label": "ARTEFACT 1 — Sysmon 1, FIN-SQL-02, 22:00", "html": "<p><code>auditpol.exe /set /category:\"Logon/Logoff\" /success:disable /failure:enable<\/code> — User: <code>NT AUTHORITY\\SYSTEM<\/code> (backup job context)<\/p>"}, {"prose": "The database team confirms the backup suite ships a script that tunes audit outcomes before large restores. Whatever the motive, the queue needs the correct technical reading of what this one command does — the junior's four guesses are below."}], "question": "Which statement about this command is true?", "hint": "Read the flags as a pair: one outcome was turned off, the other stayed on. The log file and the service are untouched.", "qcm": {"options": [{"k": "A", "t": "Success events for Logon/Logoff stop being written; failure events keep being written."}, {"k": "B", "t": "The Security log file is deleted immediately."}, {"k": "C", "t": "The EventLog service is stopped by this command."}, {"k": "D", "t": "All auditing for every category is switched off."}], "correct": "A"}, "explain": "<code>auditpol /set<\/code> works at the level of a <b>category<\/b> and an <b>outcome<\/b>. Here it disabled <i>success<\/i> recording for Logon/Logoff while explicitly enabling <i>failure<\/i> — so successful logons stop appearing and failed logons keep appearing (A). It neither deletes files (B) nor stops services (C), and it touches one category, not every category (D — that would be the much blunter <code>auditpol /clear<\/code>). This is why audit-policy tampering is quiet: no 7035, no 1102, and the channel keeps flowing with everything <i>except<\/i> the silenced outcomes. When you see a service account doing this, check the software's documentation before you escalate — but also verify nobody abused the same job as cover.", "study": "Compare auditpol /set (category + outcome) with auditpol /clear (everything to defaults)."}, {"id": "m15", "type": "fill", "tag": "IR memo — the blind-spot window", "summary": "Complete the incident memo for ticket MER-3391 with three key values", "scenario": [{"prose": "The incident record for ticket MER-3391 needs its summary sentence finished before the 17:00 review. Fill the three blanks from the case facts you already worked with: the channel, the detection strategy, and the first control being strengthened."}], "question": "Complete the memo with the three missing values.", "hint": "Two of the three are identifiers: one names the strategy, one names the mitigation family by ID.", "fill": {"sentence": "Between 02:14 and 02:32 the ___ channel of FIN-WKS-014 produced no events; the window opens with the wevtutil disable and closes when we re-enabled the channel; for the record, detection strategy ___ covers this behaviour, and the first control we are strengthening is ___ (Restrict Registry Permissions).", "bank": ["Security", "DET0187", "M1024", "System", "DET0185", "M1047", "1102"], "blanks": [{"accept": ["security"], "size": 10}, {"accept": ["det0187"], "size": 9}, {"accept": ["m1024"], "size": 8}]}, "explain": "Blank 1 is the <b>Security<\/b> channel — that is what was switched off at 02:14 and re-enabled at 02:32. Blank 2 is <b>DET0187<\/b>, the detection strategy for disabled Windows event logs; DET0185 is a decoy ID, not this strategy. Blank 3 is <b>M1024<\/b> (Restrict Registry Permissions) — the control that would have made the <code>Start<\/code> value write hard for a non-authorised account; M1047 (Audit) is real but is about auditing, and 1102 belongs to the clearing story that this ticket does not have. A memo with the right identifiers lets the next reader pull the exact strategy and control pages instead of guessing — that is why the IDs matter as much as the times.", "study": "Practise the trio: behaviour ID (T1685.001), detection ID (DET0187), mitigation ID (M1024)."}, {"id": "m16", "type": "order", "tag": "Rank the response actions", "summary": "Rank four actions by what comes first after a confirmed single-host disable", "scenario": [{"prose": "The disable on FIN-WKS-014 is confirmed, account m.reid is suspended, and no other host shows artefacts yet. Your queue holds four proposed actions and the shift lead wants them ranked by what happens <b>first<\/b> — not by what feels most dramatic."}], "question": "Rank the four actions from first to last.", "hint": "Protect the abused identity first, then your eyes, then the estate-wide question, then the paperwork.", "order": {"items": [{"k": "P1", "t": "Suspend the abused account and preserve the host's volatile config."}, {"k": "P2", "t": "Re-enable Security channel logging on FIN-WKS-014."}, {"k": "P3", "t": "Hunt the same wevtutil pattern across all 412 hosts."}, {"k": "P4", "t": "Write the blind-spot window into the incident record."}]}, "explain": "First, the abused identity: suspending the account stops repeat access, and preserving volatile config keeps options open (P1). Second, restore logging on the affected host — you need your eyes back before anything else happens (P2). Third, the estate-wide hunt: with the pattern and the account known, sweep the other 411 hosts for the same command line and Start writes (P3). Fourth, the record: write the window down once you know when visibility actually returned (P4). Ranking is a MEDIUM skill because every item is sensible — the discipline is the order: identity and evidence, then visibility, then scope, then paperwork.", "study": "Compare this ranking with the branching triage you did earlier — the order principles match."}]};

'use strict';
/* ============================ helpers ============================ */
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function norm(s){ return String(s).replace(/\s+/g,' ').trim().toLowerCase(); }
function scoreExercise(H, W, N){ if (N <= 0) return 0; return Math.max(0, (H - W) / N); }
function fmtTime(sec){ sec = Math.max(0, sec); var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }

/* ============================ state ============================ */
var TSTATE = { RUNNING:'RUNNING', PAUSED_MANUAL:'PAUSED_MANUAL', PAUSED_AUTO_CHECK:'PAUSED_AUTO_CHECK', ENDED:'ENDED' };
var S = {
  screen: 'intro', order: [], idx: 0,
  credits: {}, checked: {}, hintUsed: {}, skipped: [],
  mode: 'normal', reviewFrom: null,
  timeRemain: EXAM.meta.timerSeconds, timerState: TSTATE.RUNNING, prevTimerState: null,
  manualSec: 0, autoSec: 0, reported: false,
  rt: {}, handshake: { username:'', country:'', locale:'en' }
};
var ticker = null;

function total(){ return EXAM.exercises.length; }
function cur(){ return EXAM.exercises[S.order[S.idx]]; }
function answeredCount(){ var n = 0; for (var k in S.checked){ if (S.checked[k]) n++; } return n; }
function creditSum(){ var s = 0; for (var k in S.credits){ s += S.credits[k]; } return s; }

/* ============================ timer FSM ============================ */
function setTimerState(st){
  S.prevTimerState = S.timerState; S.timerState = st; renderTimer();
}
function resumeTimer(){
  if (S.timerState === TSTATE.ENDED) return;
  setTimerState(S.prevTimerState === TSTATE.PAUSED_AUTO_CHECK ? TSTATE.PAUSED_AUTO_CHECK : TSTATE.RUNNING);
}
function startTicker(){
  if (ticker) return;
  ticker = setInterval(function(){
    if (S.screen === 'intro') return;
    if (S.timerState === TSTATE.RUNNING){
      if (S.timeRemain > 0){ S.timeRemain--; renderTimer(); if (S.timeRemain === 0) timeUp(); }
    } else if (S.timerState === TSTATE.PAUSED_MANUAL){ S.manualSec++; }
    else if (S.timerState === TSTATE.PAUSED_AUTO_CHECK){ S.autoSec++; }
  }, 1000);
}
function timeUp(){
  setTimerState(TSTATE.ENDED);
  if (S.screen === 'exam' && !S.checked[S.idx]) { S.skipped.push(S.idx); }
  finishExam();
}
function renderTimer(){
  var tv = $('#tval'); if (tv) tv.textContent = fmtTime(S.timeRemain);
  var ts = $('#tstate'); if (!ts) return;
  var map = {
    RUNNING: ['▶','RUNNING',''],
    PAUSED_MANUAL: ['⏸','PAUSED — manual (press Resume)','paused'],
    PAUSED_AUTO_CHECK: ['⏸','PAUSED — reviewing feedback (resumes on Next)','paused'],
    ENDED: ['⏹','ENDED','ended']
  };
  var m = map[S.timerState] || map.RUNNING;
  ts.innerHTML = m[0] + ' ' + esc(m[1]);
  ts.className = 'tstate ' + m[2];
  var pb = $('#pausebtn');
  if (pb) pb.textContent = (S.timerState === TSTATE.PAUSED_MANUAL) ? '▶ Resume' : '⏸ Pause';
}
function renderScore(){
  var n = answeredCount(), s = creditSum();
  var pct = n > 0 ? Math.round((s / n) * 100) : 0;
  var e = $('#tbscore');
  if (e) e.innerHTML = 'Score <b>' + s.toFixed(1) + '</b> / ' + n + ' · ' + pct + '%';
}

/* ============================ build runtime ============================ */
/* schema normalisation: accept legacy flat qcm shape (options/correct at top level) */
function normalizeEx(ex){
  if (ex.type === 'qcm' && !ex.qcm && ex.options){
    ex.qcm = { options: ex.options, correct: ex.correct };
  }
  return ex;
}
function buildRt(exRaw){
  var ex = normalizeEx(exRaw);
  var rt = { ex: ex };
  if (ex.type === 'qcm'){ rt.opts = shuffle(ex.qcm.options.map(function(o){ return o.k; })); rt.sel = null; }
  if (ex.type === 'multi'){ rt.opts = shuffle(ex.multi.options.map(function(o){ return o.k; })); rt.sel = []; }
  if (ex.type === 'match'){ rt.right = shuffle(ex.match.right.map(function(r){ return r.k; })); rt.pairs = {}; rt.selL = null; }
  if (ex.type === 'dnd'){ rt.items = shuffle(ex.dnd.items.map(function(i){ return i.k; })); rt.place = {}; rt.selChip = null; }
  if (ex.type === 'fill'){ rt.bank = shuffle(ex.fill.bank.slice()); rt.vals = []; }
  if (ex.type === 'order'){ rt.orderKeys = shuffle(ex.order.items.map(function(i){ return i.k; })); rt.selIdx = null; }
  if (ex.type === 'logs'){ rt.sel = []; }
  if (ex.type === 'term'){ rt.ran = false; rt.lastCmd = ''; rt.lastKind = ''; rt.hist = []; }
  if (ex.type === 'branch'){ rt.step = 0; rt.choices = []; rt.optOrders = ex.branch.steps.map(function(st){ return shuffle(st.options.map(function(o){ return o.k; })); }); }
  return rt;
}

/* ============================ intro ============================ */
function renderIntro(){
  S.screen = 'intro';
  var m = EXAM.meta, I = EXAM.intro;
  var h = '';
  h += '<div class="wrap">';
  h += '<section class="card intro-head" aria-label="Exam facts">';
  h += '<h1>' + esc(m.title) + '</h1>';
  h += '<span class="sevbadge ' + m.sevClass + '"><span aria-hidden="true">' + m.sevIcon + '</span> ' + esc(m.sevWord) + '</span>';
  h += '<span class="ifact">ATT&amp;CK object: <b>' + esc(m.objectId) + ' — ' + esc(m.objectName) + '</b></span>';
