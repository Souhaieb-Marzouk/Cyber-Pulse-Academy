<script>
window.EXAM = {"topicId": "t1592.004", "batch": 2, "exCount": 16, "title": "T1592.004 Gather Victim Host Information: Client Configurations — MEDIUM", "sev": "medium", "sevName": "MEDIUM", "sevMeaning": "Each exercise connects two ideas. You must decide what to look at first. Hints narrow the direction but do not give answers.", "minutes": 40, "typeList": "multiple choice, multi-select, matching, drag and drop, ordering, gap fill, one terminal, decision steps, spot the mistake, log analysis, prioritization", "introHtml": "\n<p><b>This exam is about one MITRE ATT&CK object:\nT1592.004 — Gather Victim Host Information: Client Configurations.</b></p>\n<p>What type of object is this? It is a <b>sub-technique</b>. Its parent technique is\n<b>T1592 — Gather Victim Host Information</b>. It sits in the <b>Reconnaissance tactic (TA0043)</b>:\nthe attacker studies the victim <i>before</i> attacking.</p>\n<p><b>What are \"client configurations\"?</b> ATT&CK lists them precisely: the operating system and\nits version, virtualization, the architecture (32-bit or 64-bit), the language, and the time zone.\nAttackers collect these through active scanning (listening ports, server banners, user agent\nstrings), phishing for information, compromised websites that fingerprint their visitors, and open\ndata sets — job postings, network maps, assessment reports, resumes, purchase invoices.</p>\n<p><b>Where will you meet this at work?</b></p>\n<ul>\n<li>A <b>SOC analyst</b> reads web logs where scanners probe banners and user agents.</li>\n<li>A <b>threat hunter</b> runs attack-surface scans to see the victim's view.</li>\n<li>An <b>incident responder</b> reconstructs what the attacker learned pre-compromise.</li>\n<li>A <b>CTI analyst</b> maps procedures like HAFNIUM's Office 365 tenant interactions to ATT&CK.</li>\n<li>A <b>red teamer</b> mirrors the same collection to test what leaks.</li>\n<li>A <b>detection engineer</b> tunes analytics like DET0820 and handles its high false-positive rate.</li>\n<li>A <b>GRC analyst / control owner</b> owns the M1056 Pre-compromise mindset: minimize exposed data,\ntrack configuration hygiene (CIS Controls, NIST CSF, ISO 27001).</li>\n</ul>\n<p><b>This tier:</b> every exercise joins two ideas — for example, identify the collection method\n<i>and</i> pick the matching response, or read an artefact <i>and</i> map it to the right sub-technique.</p>\n", "themesHtml": "<div class=\"theme-grid\"><div class=\"theme-card\"><h3>Technique identity and family</h3><div class=\"theme-tags\"><span class=\"tag\">T1592.004</span><span class=\"tag\">Sub-technique of T1592</span><span class=\"tag\">Tactic TA0043 Reconnaissance</span><span class=\"tag\">Siblings: .001 Hardware / .002 Software / .003 Firmware</span><span class=\"tag\">Platforms: PRE</span></div></div><div class=\"theme-card\"><h3>What counts as client configurations</h3><div class=\"theme-tags\"><span class=\"tag\">OS and version</span><span class=\"tag\">Virtualization</span><span class=\"tag\">Architecture 32/64-bit</span><span class=\"tag\">Language</span><span class=\"tag\">Time zone</span></div></div><div class=\"theme-card\"><h3>Collection methods</h3><div class=\"theme-tags\"><span class=\"tag\">Active Scanning (T1595): listening ports, server banners, user agent strings</span><span class=\"tag\">Phishing for Information (T1598)</span><span class=\"tag\">Compromised websites with fingerprinting content</span><span class=\"tag\">Open data sets: job postings, network maps, assessment reports, resumes, purchase invoices</span></div></div><div class=\"theme-card\"><h3>What recon unlocks next</h3><div class=\"theme-tags\"><span class=\"tag\">Search Open Websites/Domains (T1593)</span><span class=\"tag\">Search Open Technical Databases (T1597)</span><span class=\"tag\">Develop Capabilities (T1587)</span><span class=\"tag\">Obtain Capabilities (T1588)</span><span class=\"tag\">Supply Chain Compromise (T1195)</span><span class=\"tag\">External Remote Services (T1133)</span></div></div><div class=\"theme-card\"><h3>Telemetry and detection</h3><div class=\"theme-tags\"><span class=\"tag\">Detection Strategy DET0820 / analytic AN1952</span><span class=\"tag\">High false-positive rate for internet scanners</span><span class=\"tag\">Off-perimeter blind spots</span><span class=\"tag\">Watch the Initial Access stages</span></div></div><div class=\"theme-card\"><h3>Mitigation and controls</h3><div class=\"theme-tags\"><span class=\"tag\">M1056 Pre-compromise</span><span class=\"tag\">Minimize data available to external parties</span><span class=\"tag\">Version banner hygiene</span><span class=\"tag\">Public document hygiene</span><span class=\"tag\">Framework mappings: NIST CSF, CIS Controls, ISO 27001</span></div></div><div class=\"theme-card\"><h3>Real-world procedures</h3><div class=\"theme-tags\"><span class=\"tag\">C0064 AI-Assisted Breach of Mexico's Government Infrastructure</span><span class=\"tag\">C0062 Anthropic AI-orchestrated Campaign</span><span class=\"tag\">G0125 HAFNIUM — Office 365 tenant environment details</span></div></div><div class=\"theme-card\"><h3>Tools and work roles</h3><div class=\"theme-tags\"><span class=\"tag\">curl / banner grabbing</span><span class=\"tag\">Scanner tools</span><span class=\"tag\">SOC analyst</span><span class=\"tag\">CTI analyst</span><span class=\"tag\">Red teamer</span><span class=\"tag\">Detection engineer</span><span class=\"tag\">GRC analyst / control owner</span></div></div></div>", "exercises": [{"id": "m01", "type": "qcm", "kindLabel": "Multiple choice", "title": "Which sub-technique names this collection?", "summary": "A banner grab. Which sub-technique's description lists it?", "scenario": [{"label": "Artefact — response headers of the victim's public site", "html": "<pre class=\"code\">HTTP/1.1 200 OK\nServer: nginx/1.24.0 (Ubuntu)\nX-Powered-By: PHP/8.1.2</pre>"}, {"label": "Your note", "html": "<p>The attacker collected this banner with a scripted request, then used it during targeting.</p>"}], "question": "ATT&CK names this collection action explicitly in the description of which sub-technique?", "options": ["T1592.001 Hardware — its description lists device models and part numbers", "T1592.003 Firmware — its description lists router images and firmware hashes", "T1592.004 Client Configurations — server banners are named there", "T1595.002 Vulnerability Scanning — its description lists CVE checks and targets"], "answerIdx": 2, "hint": "Open the T1592.004 description in your memory: which collection examples does ATT&CK literally write there?", "explain": "The description of T1592.004 says information is gathered 'such as direct collection actions via Active Scanning (ex: listening ports, server banners, user agent strings)'. Server banners are named there — that makes T1592.004 the best fit. T1595.002 is a near-miss: scanning is the action, but the banner detail feeding targeting is what T1592.004 records.", "study": "Read technique descriptions closely — ATT&CK often names the exact collection examples."}, {"id": "m02", "type": "qcm", "kindLabel": "Multiple choice", "title": "Which pair of techniques is this?", "summary": "A survey email asks staff for system details. Name the technique pair.", "scenario": [{"label": "Artefact — email to 400 staff, no links, no attachments", "html": "<pre class=\"code\">Subject: IT refresh survey — win a voucher!\n\nWhich operating system does your work laptop run?\nIs it 32-bit or 64-bit?\nWhich language pack do you use?\n\nReply to this address. 3 winners get shopping vouchers.</pre>"}], "question": "Which pair of ATT&CK techniques best describes this email?", "options": ["Spearphishing Attachment (T1566.001) plus System Information Discovery (T1082)", "Phishing for Information (T1598) plus Search Open Technical Databases (T1597)", "Active Scanning (T1595.002) plus Email Collection from the replies (T1114)", "Phishing for Information (T1598) feeding Client Configurations (T1592.004)"], "answerIdx": 3, "hint": "No attachment, no link, no victim system touched. Someone is asking humans and collecting the answers.", "explain": "Asking staff directly is <b>Phishing for Information (T1598)</b>. The harvested details (OS, architecture, language) are exactly the data of <b>T1592.004</b>. T1566.001 is wrong (no attachment), T1082 is wrong (that is post-compromise discovery on a host), T1597 is wrong (nobody searched a technical database), T1595 is wrong (nothing was scanned).", "study": "Phishing for Information collects FROM people; Active Scanning collects FROM services."}, {"id": "m03", "type": "match", "kindLabel": "Matching", "title": "Open sources: what leaks which detail?", "summary": "Five sources. Match each to the client-configuration detail it exposes.", "scenario": "Your CTI team builds a 'what do we leak?' workshop. Each source below is real and public. Match source to leak.", "question": "Match each source to the detail it exposes.", "left": ["A job posting", "A system administrator's resume", "A compromised website", "An internet-facing server", "A leaked assessment report"], "right": ["A banner showing software and version", "A page listing time zones and languages of client systems", "'Our mixed fleet still runs some 32-bit laptops'", "A fingerprint script reading each visitor's OS and language", "'Managed Windows 10 and VMware environments'"], "pairs": [2, 4, 3, 0, 1], "hint": "Two sources are documents written by people, one is a malicious page, one is a server answer, one is a lost report.", "explain": "Job postings mention fleets (32-bit laptops). Resumes mention stacks the author managed (Windows 10, VMware). A compromised website runs fingerprinting content — an ATT&CK example. An internet-facing server answers with banners. A leaked assessment report can list time zones and languages directly. ATT&CK lists job postings, network maps, assessment reports, resumes and purchase invoices as open data sets for this technique.", "study": "Audit your own public documents the way this matching table does."}, {"id": "m04", "type": "dnd", "kindLabel": "Drag and drop", "title": "Can your telemetry see it?", "summary": "Six collection activities. Sort by defender visibility.", "scenario": "Your detection engineer asks a hard question in the backlog: 'For each T1592.004 collection method — does OUR telemetry see it at all?' Sort honestly.", "question": "Sort each activity by whether your telemetry can see it.", "zones": ["Defender can see this activity", "Off the perimeter — defender is blind"], "items": ["Scanner sends many HEAD requests to your web server (web log)", "Fake HR survey arrives in staff mailboxes (mail gateway)", "Malware on one laptop lists its OS and architecture (EDR)", "Attacker reads your job postings (their browser)", "Attacker queries an open technical database (their network)", "Attacker views staff resumes online (their network)"], "map": [0, 0, 0, 1, 1, 1], "hint": "Ask: does the activity touch MY infrastructure, or happen entirely on the attacker's side?", "explain": "Web logs, mail gateways and EDR are your telemetry: a scanner's HEAD requests, a survey email and host malware all leave traces you can collect. Reading your job postings, querying open databases and browsing resumes happen on the attacker's side — you are blind there. This is why ATT&CK says much of this activity takes place outside the visibility of the target organization.", "study": "For every recon method, ask the visibility question before promising a detection."}, {"id": "m05", "type": "fill", "kindLabel": "Gap fill", "title": "Quote the ATT&CK scope correctly", "summary": "Four gaps quoting the T1592.004 data scope and its mitigation.", "scenario": "You draft a wiki quote of the ATT&CK description. The lead reviewer demands precision: 'Quote the scope exactly, or do not quote at all.'", "question": "Fill the four gaps to match the ATT&CK description.", "template": "ATT&CK describes T1592.004 data as operating system and version, {0}, architecture such as 32 or 64 {1}, language and time {2}. The listed mitigation for this technique is {3}.", "answers": ["virtualization", "bit", "zone", "M1056 (Pre-compromise)"], "bank": ["virtualization", "bit", "zone", "M1056 (Pre-compromise)", "encryption", "byte", "season", "M1049 (Antivirus)"], "hint": "Two gaps are plain nouns from the description. One is a unit word. One is the mitigation ID that starts with M10.", "explain": "The description lists 'operating system/version, virtualization, architecture (ex: 32 or 64 bit), language, and/or time zone'. The mitigation is <b>M1056 Pre-compromise</b>, whose text says the technique 'cannot be easily mitigated with preventive controls' and efforts should focus on minimizing data available to external parties. M1049 (Antivirus) does not apply pre-compromise.", "study": "Precision matters in CTI writing: quote ATT&CK scope word by word."}, {"id": "m06", "type": "terminal", "kindLabel": "Terminal", "title": "Read the shop portal like a browser would", "summary": "Tool named, goal set — choose your own options and target.", "scenario": "Red-team prep, your own lab scope. The lead's message: 'The shop portal sometimes answers with different detail to different clients. Show me its response headers exactly the way a normal Chrome browser on Windows 10 would see them. One quiet request, headers only, nothing written to disk.'", "question": "Show the response headers of the shop portal as a Windows 10 Chrome browser would see them.", "briefing": "<b>Tool:</b> <span class=\"mono\">curl</span> (it sends web requests) — installed on your box.<br><b>Intent hint:</b> two things in one quiet request — headers only, and a client name that says 'Chrome on Windows 10' instead of 'curl'.<br><b>Scope:</b> <span class=\"mono\">hxxp://shop[.]victim[.]example</span> — authorised lab target. Defang note: hxxp:// and [.] stand for http:// and dots.", "prompt": "redteam@box:~$", "motd": "authorised lab shell — nothing runs for real", "elements": [{"name": "tool: curl", "re": "(^| )curl( |$)", "show": "curl"}, {"name": "headers-only option", "re": "(^| )(-s?i|-s -i|--head)( |$)", "show": "-sI / --head (headers only)"}, {"name": "user agent option", "re": "(^| )(-a|--user-agent)( |$|=[\"']?)", "show": "-A \"...\" (renames your client)"}, {"name": "Windows 10 Chrome user agent value", "re": "mozilla/5\\.0.*windows nt 10", "show": "Mozilla/5.0 (Windows NT 10.0; ...) Chrome/..."}, {"name": "target address", "re": "shop\\.victim\\.example", "show": "hxxp://shop[.]victim[.]example"}], "wrong": [{"name": "forced method -X POST", "re": "-x post", "show": "-X POST changes the request method — wrong goal"}, {"name": "follow redirects -L", "re": "(^| )-l( |$)", "show": "-L can fire extra requests — not one quiet request"}, {"name": "write to file", "re": "(^| )(-o|--output|-O)( |$)", "show": "-o writes to disk — the lead said no files"}], "canonical": "curl -sI -A \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36\" hxxp://shop[.]victim[.]example", "sim": "HTTP/1.1 200 OK\nServer: nginx/1.24.0 (Ubuntu)\nX-Powered-By: PHP/8.1.2\nContent-Type: text/html; charset=UTF-8", "canonExpl": ["<span class=\"mono\">curl</span> — the request tool named in the briefing.", "<span class=\"mono\">-sI</span> — quiet, and headers only.", "<span class=\"mono\">-A \"…\"</span> — replaces curl's default client name with the Chrome-on-Windows string.", "The user agent string is itself one of the client-configuration collection examples in T1592.004 — this is that example, seen from the sender's side.", "<span class=\"mono\">hxxp://shop[.]victim[.]example</span> — the in-scope target."], "hint": "Two single-letter options do it together: one asks for headers only, one renames your client. The renamed client should mention Windows NT 10 and Chrome.", "explain": "The clean command is <b>curl -sI -A \"Mozilla/5.0 (Windows NT 10.0; …) Chrome/120 …\" hxxp://shop[.]victim[.]example</b>. -sI keeps it quiet and headers only; -A renames the client so the portal answers the way a real browser would see it. User agent strings are a named collection example of T1592.004 — this exercise shows them from the other side. -X POST would change the method, -L could fire extra requests, and -o writes files the lead forbade.", "study": "Build commands from goal parts: tool + mode options + identity + target."}, {"id": "m07", "type": "order", "kindLabel": "Ordering", "title": "From client configs to initial access", "summary": "Four stages — order the attacker pipeline.", "scenario": "Your CTI analyst sketches how T1592.004 output flows into later ATT&CK stages. The whiteboard photo got scrambled.", "question": "Put the four stages in the order the attacker follows.", "items": ["Collect client configurations (banners, user agents, open data)", "Search open technical databases for related details (T1597)", "Develop or obtain matching capabilities (T1587 / T1588)", "Reach initial access through a lure or exposed service (T1133)"], "correctSeq": [0, 1, 2, 3], "hint": "ATT&CK's own sentence: gathering reveals opportunities for other recon, then establishing operational resources, then initial access.", "explain": "The T1592.004 description ends exactly this way: gathering 'may reveal opportunities for other forms of reconnaissance (ex: Search Open Websites/Domains or Search Open Technical Databases), establishing operational resources (ex: Develop Capabilities or Obtain Capabilities), and/or initial access (ex: Supply Chain Compromise or External Remote Services)'. Supply Chain Compromise (T1195) is the alternate initial-access path if the attacker corrupts a trusted update.", "study": "Learn the pipeline: collect, search, build, access."}, {"id": "m08", "type": "qcm", "kindLabel": "Multiple choice", "title": "Two public documents, one risk", "summary": "A job ad plus a resume. What is the real risk?", "scenario": [{"label": "Artefact 1 — engineering job posting (careers page)", "html": "<pre class=\"code\">'You will maintain our mixed laptop fleet\n(still some 32-bit units) with several\nlanguage packs for our EU offices.'</pre>"}, {"label": "Artefact 2 — resume of a former admin (public profile)", "html": "<pre class=\"code\">'Managed 800 Windows 10 endpoints,\nVMware virtualization estate, en-GB baseline.'</pre>"}], "question": "As the CTI analyst, what is the main risk from these two documents?", "options": ["They reveal the salary levels and internal titles of the IT team", "They let an attacker tailor capabilities and lures to real systems", "They show the company writes careless and unprofessional job ads", "They leak the company's password policy and VPN configuration"], "answerIdx": 1, "hint": "Both documents name exactly the T1592.004 scope: architecture, virtualization, OS, language.", "explain": "Together the documents expose architecture (32-bit), virtualization (VMware), OS (Windows 10) and language (en-GB) — the full T1592.004 scope, from open data. An attacker can shape a 32-bit-capable payload and a credible local lure. Salaries, ad quality and password policy are not in these artefacts.", "study": "Treat HR documents as recon surfaces, not just HR artefacts."}, {"id": "m09", "type": "qcm-multi", "kindLabel": "Multi-select", "title": "Select the ATT&CK scope", "summary": "Which details does ATT&CK list under T1592.004? Select all.", "scenario": "A vendor claims their 'client configuration scanner' covers everything. Before the demo, you check what ATT&CK actually lists under T1592.004.", "question": "Select every detail that ATT&CK lists under T1592.004 client configurations.", "options": ["Operating system and version", "Virtualization", "Architecture, such as 32 or 64 bit", "Language", "Time zone", "Browser bookmark folders"], "answerIdxs": [0, 1, 2, 3, 4], "hint": "Five of the six are in the ATT&CK description sentence. One is a decoy from a different domain.", "explain": "ATT&CK lists: operating system/version, virtualization, architecture (32 or 64 bit), language, and/or time zone. Bookmark folders are not client configurations in ATT&CK's sense — they are user data, and collecting them would be a different discussion entirely.", "study": "Anchor your tooling conversations to the ATT&CK scope, not vendor slides."}, {"id": "m10", "type": "branch", "kindLabel": "Decision steps", "title": "SOC triage: scripting engine in the logs", "summary": "Two decisions on a live scanner pattern.", "scenario": [{"label": "Artefact — web access log excerpt (10 minutes)", "html": "<pre class=\"code\">203[.]0[.]113[.]44 - \"HEAD / HTTP/1.1\" 200 \"Mozilla/5.0 (compatible; Nmap Scripting Engine)\"\n203[.]0[.]113[.]44 - \"GET /?p=1 HTTP/1.1\" 200 \"Mozilla/5.0 (compatible; Nmap Scripting Engine)\"\n203[.]0[.]113[.]44 - \"HEAD /about HTTP/1.1\" 200 \"Mozilla/5.0 (compatible; Nmap Scripting Engine)\"\n198[.]51[.]100[.]9 - \"GET /style.css HTTP/1.1\" 200 \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0\"</pre>"}], "question": "Work the triage in two steps.", "steps": [{"question": "Step 1: What is the 203[.]0[.]113[.]44 client doing?", "options": ["Active scanning that collects banner and version information", "A broken browser plugin stuck in a loop", "A search engine crawler indexing pages", "Load balancer health checks"], "answerIdx": 0, "hint": "The user agent self-declares a scripting engine, and HEAD requests ask for headers only.", "ack": "Logged. Next decision."}, {"question": "Step 2: What is the best first response?", "options": ["Minimize exposed version info and watch for follow-up access attempts", "Power off the web server until Monday", "Ignore it — reconnaissance is always harmless", "Reply to the scanner with a warning page"], "answerIdx": 0, "hint": "You cannot unsee the banner, but you can stop publishing it — and recon often precedes access.", "ack": ""}], "hint": "Name the collection first, then pick a response that reduces exposure without drama.", "explain": "Step 1: the user agent declares a scripting engine and HEAD requests pull headers — active scanning that collects banner and version information (T1592.004 collection via T1595-style scanning). Step 2: the proportionate first response is exposure reduction plus watchfulness — ATT&CK's detection note says to focus on related stages such as Initial Access, because the scanning itself is hard to stop. Powering off a server and replying to scanners are disproportionate or useless; ignoring it discards real signal.", "study": "Recon triage rule: name the collection, then reduce exposure, then watch the next stage."}, {"id": "m11", "type": "dnd", "kindLabel": "Spot the mistake", "title": "The audit scan still sees versions", "summary": "A hardened config and one forgotten page. Find what still exposes versions.", "scenario": [{"label": "Artefact 1 — /etc/apache2/conf-available/security.conf (excerpt)", "html": "<pre class=\"code\">ServerTokens Prod\nServerSignature Off\n...</pre>"}, {"label": "Artefact 2 — the web root", "html": "<pre class=\"code\">/var/www/html/index.html\n/var/www/html/contact.php\n/var/www/html/info.php   &lt;-- contains: &lt;?php phpinfo(); ?&gt;</pre>"}], "question": "Place the one item that still exposes version detail into the target box.", "zones": ["This item still exposes versions"], "items": ["info.php: phpinfo() page still reachable", "security.conf: ServerTokens Prod", "security.conf: ServerSignature Off", "apache2.conf: KeepAlive On"], "map": [0, 1, 1, 1], "hint": "One artefact shows a hardened config. The other shows a page that prints everything about PHP to anyone who opens it.", "explain": "A reachable <b>phpinfo()</b> page prints the PHP version, extensions, OS details and settings to any visitor — exactly the host/client detail T1592.004 describes, served on a plate. ServerTokens Prod and ServerSignature Off are the correct Apache hardening, and KeepAlive On changes connection behaviour, not disclosure. The admin hardened the config and forgot the debug page — remove it and re-scan from outside.", "study": "Harden configs AND remove debug pages; verify with an external scan."}, {"id": "m12", "type": "match", "kindLabel": "Matching", "title": "Controls and what they buy you", "summary": "Five controls mapped to their effect and framework anchor.", "scenario": "Your GRC review needs one line per control: what it buys, and which framework anchor it sits under. Match them.", "question": "Match each control to its effect and framework anchor.", "left": ["Remove version banners (Server, X-Powered-By)", "Keep a live inventory of OS versions", "Patch old client systems quickly", "Trim system detail from job posts and public documents", "Delete stale leaked assessment reports"], "right": ["Shrinks the open-data side of recon (ISO 27001 asset and information hygiene)", "Removes ready-made client configuration inventories", "Gives scanners less to read — secure configuration (CIS Control 4)", "You know what attackers can learn — asset management (NIST CSF ID.AM)", "Even if enumerated, fewer weak versions remain (CIS Control 7)"], "pairs": [2, 3, 4, 0, 1], "hint": "Two controls are about documents, two about the systems themselves, one about knowing your estate.", "explain": "Banner removal is secure configuration (CIS Control 4: Secure Configuration). Inventory maps to NIST CSF ID.AM (asset management). Fast patching is CIS Control 7 (Continuous Vulnerability Management). Trimming public documents and removing leaked reports shrink the open-data collection surface that T1592.004 names (job postings, assessment reports). None of these prevents recon entirely — M1056 Pre-compromise is honest about that — but each cuts the attacker's information advantage.", "study": "Map every control to a framework anchor so audits accept it."}, {"id": "m13", "type": "qcm", "kindLabel": "Multiple choice", "title": "Why 32-bit in a VM matters", "summary": "One attacker-perspective question on capability development.", "scenario": "Your red team notes: 'Victim finance laptops: 32-bit Windows 7 guests on VMware hosts, en-GB locale.' The client asks why this matters so much.", "question": "Why is this detail valuable to an attacker BEFORE any attack?", "options": ["They can develop or obtain a payload that fits the 32-bit VMs", "They can bypass the victim's mail gateway filters now", "They can reset user passwords on the victim's systems", "They can legally resell this information after the demo"], "answerIdx": 0, "hint": "ATT&CK says this information feeds Develop Capabilities and Obtain Capabilities. Nothing has been touched yet.", "explain": "The T1592.004 description says gathering this information supports 'establishing operational resources (ex: Develop Capabilities or Obtain Capabilities)'. A payload must match the architecture (32-bit) and behave predictably in the victim's environment (VMware guests). The other options all require access the attacker does not have during reconnaissance.", "study": "Connect the scope (architecture, virtualization) to the next ATT&CK stage (T1587/T1588)."}, {"id": "m14", "type": "logview", "kindLabel": "Log analysis", "title": "Click every version-probing request", "summary": "Nine log lines. Select all lines that probe for software versions.", "scenario": [{"label": "Artefact — web access log (morning window)", "html": "<pre class=\"code\">\"HEAD / HTTP/1.1\" 200 - \"Mozilla/5.0 (compatible; Nmap Scripting Engine)\"\n\"GET /style.css HTTP/1.1\" 200 - \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0\"\n\"GET /CHANGELOG.txt HTTP/1.1\" 200 - \"curl/8.4.0\"\n\"GET /favicon.ico HTTP/1.1\" 200 - \"Mozilla/5.0 (X11; Linux x86_64) Firefox/121.0\"\n\"GET /blog/2025/launch HTTP/1.1\" 200 - \"Mozilla/5.0 (iPhone; CPU iPhone OS 17_2)\"\n\"GET /readme.html HTTP/1.1\" 200 - \"curl/8.4.0\"\n\"GET /assets/team.jpg HTTP/1.1\" 200 - \"Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15)\"\n\"POST /contact HTTP/1.1\" 200 - \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Edge/119.0\"\n\"GET /?p=health HTTP/1.1\" 200 - \"kube-probe/1.28\"</pre>"}], "question": "Select every log line that is probing for software version information.", "lines": ["\"HEAD / HTTP/1.1\" 200 - \"Mozilla/5.0 (compatible; Nmap Scripting Engine)\"", "\"GET /style.css HTTP/1.1\" 200 - \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0\"", "\"GET /CHANGELOG.txt HTTP/1.1\" 200 - \"curl/8.4.0\"", "\"GET /favicon.ico HTTP/1.1\" 200 - \"Mozilla/5.0 (X11; Linux x86_64) Firefox/121.0\"", "\"GET /blog/2025/launch HTTP/1.1\" 200 - \"Mozilla/5.0 (iPhone; CPU iPhone OS 17_2)\"", "\"GET /readme.html HTTP/1.1\" 200 - \"curl/8.4.0\"", "\"GET /assets/team.jpg HTTP/1.1\" 200 - \"Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15)\"", "\"POST /contact HTTP/1.1\" 200 - \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Edge/119.0\"", "\"GET /?p=health HTTP/1.1\" 200 - \"kube-probe/1.28\""], "correctLines": [0, 2, 5], "hint": "Look for a scripting-engine user agent and non-browser clients pulling version-revealing files. One tool-looking client is actually a health probe.", "explain": "Line 1 self-declares a scripting engine and uses HEAD to read headers. Lines 3 and 6 use a non-browser client (curl) to pull CHANGELOG.txt and readme.html — classic version-revealing files. kube-probe looks like a tool but is your platform's own health check (benign trap). The browser lines are normal staff and visitor traffic.", "study": "Version-probe pattern: HEAD requests, changelog/readme/banner paths, non-browser user agents."}, {"id": "m15", "type": "fill", "kindLabel": "Gap fill", "title": "Draft the exposure note", "summary": "Three gaps in a short exposure note.", "scenario": "Your ticket EXPOSURE-2201 needs its final paragraph. Draft below, three words missing.", "question": "Fill the three gaps of the note.", "template": "An external actor read our response headers. The banner named the web server and PHP, matching T1592.004 collection through server {0}. We removed version {1} at the web tier and enabled {2} patching of client systems.", "answers": ["banners", "tokens", "automated"], "bank": ["banners", "tokens", "automated", "hashes", "colors", "manual"], "hint": "Gap 1: what the actor read. Gap 2: what nginx calls its version switch. Gap 3: the patching style that keeps fleet versions fresh.", "explain": "The actor read server <b>banners</b> — the exact example in the T1592.004 description. The nginx switch is <b>server_tokens</b>; turning it off removes version detail. <b>Automated</b> patching keeps the client fleet from staying stale after enumeration. 'Hashes' and 'colors' do nothing here, and 'manual' patching is what let versions drift in the first place.", "study": "Write exposure notes that name the technique, the fix, and the follow-up control."}, {"id": "m16", "type": "order", "kindLabel": "Prioritization", "title": "Rank the defender actions", "summary": "Four actions — rank by long-term effectiveness against this recon.", "scenario": "Your CISO asks: 'We saw banner probing this quarter. Rank these four actions by how much they help us LONG-TERM against client-configuration recon.'", "question": "Rank from most to least effective (top = most effective).", "items": ["Remove or genericize version banners and trim public documents", "Inventory and patch the client fleet", "Watch perimeter logs for scanning patterns and alert", "Block the one scanner IP you saw today"], "correctSeq": [0, 1, 2, 3], "hint": "Fixing at the source helps against every attacker; one blocked IP helps against one attacker for one day.", "explain": "Exposure reduction (banners, documents) works against every future scanner — that is the M1056 Pre-compromise mindset. Inventory and patching reduce the value of whatever is still collected. Log watching gives detection of the collection attempt itself. Blocking one IP is least effective: scanner infrastructure changes constantly, and the exposure stays.", "study": "Priority rule for recon: reduce source, then reduce value, then detect, then block."}]};
