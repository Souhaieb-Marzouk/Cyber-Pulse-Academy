.res-cell.skip { border-color: var(--state-skipped); } .res-cell.skip .rc-h { color: var(--state-skipped); }
.verdict { border-radius: 8px; padding: 18px 20px; margin: 14px 0; border: 1px solid; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 12px; }
.verdict.pass { border-color: var(--state-correct); background: var(--tint-green-10); color: var(--state-correct); }
.verdict.fail { border-color: var(--state-incorrect); background: var(--tint-red-10); color: var(--state-incorrect); }
.bigpct { font-size: 42px; font-weight: 800; font-family: var(--mono-stack); }
.pauselog { font-size: 14px; color: var(--text-secondary); }

/* ---------- manual pause overlay ---------- */
.pausemask { position: fixed; inset: 0; z-index: 60; background: var(--tint-page-96); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
.pausemask .pi { font-size: 46px; color: var(--state-paused); }
.pausemask .pt { color: var(--state-paused); font-weight: 800; font-size: 19px; letter-spacing: 0.04em; }
.pausemask .ps { color: var(--text-secondary); font-size: 15px; max-width: 520px; }

/* ---------- misc ---------- */
.collapse-btn { background: none; border: none; color: var(--accent-blue); font-size: 13px; font-weight: 700; padding: 6px 10px; min-height: 44px; }
.collapsed-summary { display: none; padding: 8px 16px; font-size: 13.5px; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
.collapsed .collapsed-summary { display: block; }
.collapsed .artefacts-wrap { display: none; }
.footrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
@media (max-width: 760px) {
  .match-grid { grid-template-columns: 1fr; }
  .persp { grid-template-columns: 1fr; }
  .topbar .cell { font-size: 13.5px; }
}
@media (prefers-reduced-motion: reduce) {
  .progress-fill::after { animation: none; }
  * { transition: none !important; }
}

<script type="application/json" id="cm-exam-data">{"meta":{"objectId":"T1647","objectLine":"T1647 — Plist File Modification (Enterprise technique, macOS, tactic Defense Impairment)","topicId":"t1647","batch":2,"title":"T1647 Plist File Modification — MEDIUM","difficulty":"medium","sevClass":"medium","questionCount":16,"estimatedMinutes":32,"passMark":70,"severity":"MEDIUM","timerBudget":1920},"intro":{"learn":"<p>This exam is level <b>MEDIUM<\/b> on technique <b>T1647 — Plist File Modification<\/b>. It is a <b>Technique<\/b> in the MITRE ATT&amp;CK <b>Enterprise<\/b> matrix for <b>macOS<\/b>. You already know what a plist file is. Now you connect <b>two ideas at a time<\/b>: you read a command or a log line, and you work out <b>what the attacker achieves<\/b> with it.<\/p><p>You will practise the real work of a <b>SOC analyst<\/b> on a Mac estate: reading the macOS unified log, spotting changes to <b>Launch Agents<\/b>, the <b>Dock plist<\/b>, and <b>Info.plist<\/b> keys like <b>LSUIElement<\/b> and <b>LSEnvironment<\/b>. You will map events to the <b>data components<\/b> that ATT&amp;CK's detection strategy <b>DET0109<\/b> uses, and you will handle a small <b>alert queue<\/b> where one alert is benign and others are not. <b>Threat hunters<\/b>, <b>incident responders<\/b> and <b>detection engineers<\/b> read the same plist telemetry when they hunt hidden apps or tune a detection like AN0306.<\/p><p>You will also step into the attacker's shoes with two real malware families from the T1647 page: <b>XCSSET (S0658)<\/b>, which used <b>plutil<\/b> and <b>dockutil<\/b> to change how it appears on screen, and <b>Cuckoo Stealer (S1153)<\/b>, which creates and fills plist files to enable execution. Each exercise stays short, but every answer needs one small chain of reasoning.<\/p>","keywords":[{"theme":"Behaviour chains","tags":["defaults write","plutil","LSUIElement","LSEnvironment","Dynamic Linker Hijacking (T1574.006)"]},{"theme":"Related techniques","tags":["Hidden Window (T1564.003)","Launch Agent (T1543.011)","Launch Daemon (T1543.004)","Re-opened Applications (T1547.007)"]},{"theme":"Telemetry & detection","tags":["DET0109","AN0306","DC0061 File Modification","DC0032 Process Creation","DC0064 Command Execution","macOS unified log"]},{"theme":"Real malware procedures","tags":["XCSSET (S0658)","dockutil abuse","Cuckoo Stealer (S1153)"]},{"theme":"Analyst judgement","tags":["false positives vs MDM changes","alert triage","IR first steps","M1013 context"]}],"how":"<ul class=\"howlist\"><li><b>Goal:<\/b> pass with at least <b>70%<\/b>. Every exercise needs <b>two connected ideas<\/b>: observe, then conclude.<\/li><li><b>16 exercises<\/b>: log analysis, multiple choice, fill-in-the-blank, drag &amp; drop, matching, one branching incident, an ordering task, one terminal task, and a four-alert triage queue.<\/li><li><b>Timer:<\/b> <b>32 minutes<\/b>. Pressing <b>Check<\/b> stops the timer (⏸ “reviewing feedback”); it resumes on <b>Next<\/b>. The <b>Pause<\/b> button hides the exercise for a real break.<\/li><li><b>Partial credit:<\/b> multi-item exercises score per item with the formula (correct − wrong) / total. Selecting everything can score zero.<\/li><li><b>Hints:<\/b> one per exercise, −10% of that exercise's credit. <b>Skip:<\/b> free, and you can answer skipped ones before final submit; never-answered ones are excluded from the score.<\/li><\/ul>"},"exercises":[{"id":"md01","type":"log","summary":"Two log lines — Dock plist write + LaunchAgent load","scenario":[{"label":"ARTEFACT 1 — macOS unified log (worker Mac FIN-42)","code":"2026-05-12 03:11:58  macos:unifiedlog  exec  /usr/bin/defaults write com.apple.dock persistent-apps -array-add '<dict><key>tile-data<\/key><dict><key>file-data<\/key><dict><key>_CFURLString<\/key><string>/Users/Shared/.upd/CleanIt.app<\/string>'  user: jdoe\n2026-05-12 03:12:20  macos:unifiedlog  exec  /bin/launchctl load /Users/jdoe/Library/LaunchAgents/com.updater.helper.plist  user: jdoe"}],"question":"Select the TWO statements that correctly describe these lines.","hint":"Read each command separately: one touches the Dock's plist, the other loads a LaunchAgent plist.","explain":"Line 1 adds a new app path (/Users/Shared/.upd/CleanIt.app) to the Dock's plist — T1647 behaviour. Line 2 loads a LaunchAgent plist — that is Launch Agent persistence (T1543.011), the 'other malicious activity' T1647 enables. Nothing in the lines shows a network login or an email.","persp":{"red":"Two quick commands give the attacker both a visible lure in the Dock and an autostart at login — one minute of work, two behaviours.","blue":"Both commands appear in the Command Execution data component (DC0064); the first also produces a File Modification event (DC0061)."},"study":"T1647 + Launch Agent (T1543.011) often appear together in the same minute of log.","lines":["2026-05-12 03:11:58  macos:unifiedlog  exec  /usr/bin/defaults write com.apple.dock persistent-apps -array-add '<dict><key>tile-data<\/key><dict><key>file-data<\/key><dict><key>_CFURLString<\/key><string>/Users/Shared/.upd/CleanIt.app<\/string>'  user: jdoe","2026-05-12 03:12:20  macos:unifiedlog  exec  /bin/launchctl load /Users/jdoe/Library/LaunchAgents/com.updater.helper.plist  user: jdoe"],"sub":{"type":"multi","options":[{"t":"A new app path was added to the Dock's plist","correct":true,"why":"defaults wrote a persistent-apps entry pointing at CleanIt.app"},{"t":"A LaunchAgent plist was loaded with launchctl","correct":true,"why":"launchctl load started the autostart plist"},{"t":"A user logged in over the network","correct":false,"why":"no login or SSH event appears in the two lines"},{"t":"A file was emailed outside the company","correct":false,"why":"nothing in the lines touches email or the network"}]}},{"id":"md02","type":"mcq","summary":"XCSSET changed three keys in Info.plist — why","scenario":[{"label":"ARTEFACT 1 — ATT&CK procedure row (T1647)","text":"XCSSET (S0658): In older versions, XCSSET uses the plutil command to modify the LSUIElement, DFBundleDisplayName, and CFBundleIdentifier keys in the /Contents/Info.plist file to change how XCSSET is visible on the system."},{"label":"ARTEFACT 2 — What each key does","text":"LSUIElement: hide the app from the Dock and App Switcher. DFBundleDisplayName: the name users see. CFBundleIdentifier: the app's unique ID that macOS tools use to refer to it."}],"question":"What was XCSSET trying to achieve by changing those three keys?","hint":"All three keys change how the app looks or appears to a user or to the system.","explain":"All three keys control visibility and identity: hide it, rename it, re-id it. XCSSET changed them so the malware displayed as something harmless (or nothing at all). That is deception plus defence evasion — exactly the 'evading and bypassing system defenses' goal T1647 describes. The other options describe unrelated attack goals that these keys cannot do.","study":"Procedure example S0658 XCSSET: plutil on LSUIElement / DFBundleDisplayName / CFBundleIdentifier.","options":[{"t":"Change how the malware appears on the system"},{"t":"Steal passwords from the login keychain"},{"t":"Encrypt the user's photo library"},{"t":"Turn off the Time Machine backups"}],"answer":0},{"id":"md03","type":"fill","summary":"Fill the blanks from analytic AN0306","scenario":[{"label":"ARTEFACT 1 — Analytic AN0306 (detection strategy DET0109)","text":"Monitor for unexpected modifications of plist files in persistence or configuration directories, and track use of utilities such as defaults, plutil, or text editors making changes to Info.plist files."}],"question":"Complete the summary of analytic AN0306 with the word bank.","hint":"Blank 1 is the per-user persistence folder that starts with ~. Blank 2 is the tool that reads and writes settings.","explain":"AN0306 watches persistence directories — the per-user one is ~/Library/LaunchAgents — and tracks the utilities defaults, plutil and text editors. It also correlates plist modifications with process launches that follow them. If you can rebuild the analytic from memory, you can also tune it.","study":"DET0109/AN0306: monitored directories + suspicious utilities + time-window correlation.","segments":["Analytic AN0306 monitors unexpected modifications of plist files in persistence folders such as ",{"blank":{"label":"per-user LaunchAgents folder","accept":["~/library/launchagents","~/library/launchagents/"]}}," and /Library/LaunchDaemons, and tracks utilities such as ",{"blank":{"label":"settings utility","accept":["defaults"]}},", plutil, or text editors."],"bank":["~/Library/LaunchAgents","defaults","fontBook","system_profiler"]},{"id":"md04","type":"dnd","summary":"Classify three events into ATT&CK data components","scenario":[{"label":"ARTEFACT 1 — Log sources table (DET0109)","code":"File Modification (DC0061)   macos:unifiedlog   write: *.plist changes in LaunchAgents, LaunchDaemons, Application Support, Preferences\nProcess Creation (DC0032)    macos:unifiedlog   exec: defaults, plutil, or editors (vim/nano) targeting plists\nCommand Execution (DC0064)   macos:unifiedlog   exec: /usr/bin/defaults write or /usr/bin/plutil modifying plist keys"}],"question":"Drag each observed event onto the data component that records it.","hint":"Ask: did bytes on disk change, did a new process start, or did a command run with arguments?","explain":"A plist rewrite is File Modification (DC0061). A new vim process opening a plist is Process Creation (DC0032). The shell invoking /usr/bin/plutil with arguments is Command Execution (DC0064). One attacker action can feed several components at once — that overlap is what makes correlation possible.","study":"DET0109 uses DC0061, DC0032 and DC0064 from the macos:unifiedlog channel.","items":[{"t":"The bytes of com.apple.dock.plist changed on disk"},{"t":"A new vim process started with Info.plist open"},{"t":"The shell ran /usr/bin/plutil with arguments"}],"slots":[{"label":"File Modification (DC0061)","accept":0},{"label":"Process Creation (DC0032)","accept":1},{"label":"Command Execution (DC0064)","accept":2}]},{"id":"md05","type":"branch","summary":"Branching incident — Dock plist write on FIN-07","scenario":[{"label":"ARTEFACT 1 — Alert PIN-8841","text":"SOC alert: defaults wrote /Users/Shared/.upd/CleanIt.app into com.apple.dock.plist on the Mac of finance user jdoe. You are the on-call analyst. Pick your move at each step."}],"question":"Work the alert through three decisions.","hint":"Good IR order: look first, correlate second, document third. Avoid destructive steps while investigating.","explain":"Step 1: read the plist and look at the referenced app — non-destructive verification. Step 2: correlate the plist write time with the first launch of the app and check the hidden Info.plist (LSUIElement) — that ties T1647 to the behaviour that followed. Step 3: write the ticket with file path, keys changed, and the app hash so responders after you can act fast. Reboots and alert-closing destroy evidence or hide a real threat.","persp":{"red":"The attacker counts on analysts either ignoring Dock noise or nuking evidence in panic — both help them stay.","blue":"Verify, correlate, document — only then contain. The plist path plus the app hash is the minimum evidence set."},"study":"Evidence first: plist path, changed keys, referenced binary, timestamps.","steps":[{"question":"Step 1 — The alert just arrived. What do you do first?","options":[{"t":"Read the Dock plist and check the app at that path","ok":true,"consequence":"You confirm the plist now lists /Users/Shared/.upd/CleanIt.app — a folder you have never seen."},{"t":"Reboot the Mac to clear memory","ok":false,"consequence":"The reboot kills volatile process state; the alert stays unverified."},{"t":"Close it — Dock changes happen every day","ok":false,"consequence":"The alert closes, but the path /Users/Shared/.upd was never checked."}],"bestNote":"read the plist and inspect the referenced app before anything else"},{"question":"Step 2 — The app exists, unsigned, in a hidden folder, and its Info.plist has LSUIElement = true. Next?","options":[{"t":"Correlate: plist write time vs first run time of the app","ok":true,"consequence":"The plist changed at 03:11:58; the app first ran 03:12:41 — the modification is followed by execution, matching AN0306's time-window logic."},{"t":"Delete the plist so the attacker loses access","ok":false,"consequence":"You destroyed the primary evidence and the LaunchAgent (if any) is still live."},{"t":"Forward the file to a colleague's personal mailbox","ok":false,"consequence":"Malware left the managed channel — no chain of custody."}],"bestNote":"correlate the write with the launch and inspect the app's Info.plist keys"},{"question":"Step 3 — What goes in your escalation?","options":[{"t":"Ticket with plist path, keys changed, and app hash","ok":true,"consequence":"IR has everything: T1647 evidence (plist, key) plus the binary to hunt for on other Macs."},{"t":"A chat message saying 'be careful with the Dock'","ok":false,"consequence":"No artefacts, no hash — nothing anyone can hunt on."},{"t":"Close as false positive, Dock edits are normal","ok":false,"consequence":"A real T1647 case is now invisible in the metrics."}],"bestNote":"document the plist path, the changed keys, and the binary hash"}]},{"id":"md06","type":"mcq","summary":"LSEnvironment enables which persistence","scenario":[{"label":"ARTEFACT 1 — ATT&CK excerpt (T1647)","text":"Adversaries can also insert key-value pairs to insert environment variables, such as LSEnvironment, to enable persistence via Dynamic Linker Hijacking."},{"label":"ARTEFACT 2 — Plain words","text":"Environment variables are small settings a program reads when it starts. Dynamic linker hijacking means making the system load a hostile library file instead of the normal one, every time the app starts."}],"question":"Per the T1647 description, inserting LSEnvironment into an app's Info.plist enables what?","hint":"The excerpt names the exact mechanism right after the key name.","explain":"The excerpt links LSEnvironment directly to persistence via Dynamic Linker Hijacking (ATT&CK T1574.006). The injected environment variable makes the app load a hostile library at every start. Faster launches, disk encryption and biometrics are unrelated to this key — those distractors sound technical but do not match the mechanism.","study":"LSEnvironment in Info.plist → Dynamic Linker Hijacking (T1574.006) → persistence.","options":[{"t":"Persistence via Dynamic Linker Hijacking"},{"t":"Faster launch times for the app"},{"t":"Full-disk encryption of the home folder"},{"t":"Bypass of the FaceID sensor"}],"answer":0},{"id":"md07","type":"match","summary":"Match related techniques to their roles","scenario":[{"label":"ARTEFACT 1 — T1647 description names four neighbouring techniques","text":"Hiding the execution of an application (Hidden Window). Running additional commands for persistence (Launch Agent / Launch Daemon). Re-opened Applications. All can be enabled by plist modification."}],"question":"Match each related technique to what it actually does.","hint":"Agent = one user at login. Daemon = whole system, as root. Re-opened = apps macOS restores at login.","explain":"Hidden Window (T1564.003) hides windows from the user. Launch Agent (T1543.011) runs per-user at login. Launch Daemon (T1543.004) runs as root at boot, before anyone logs in. Re-opened Applications (T1547.007) abuses the list of apps macOS reopens after login. T1647 is the plist-editing method that feeds all of them.","study":"T1647 enables T1564.003, T1543.011, T1543.004 and T1547.007 — learn the four pairings.","left":[{"t":"Hidden Window (T1564.003)"},{"t":"Launch Agent (T1543.011)"},{"t":"Launch Daemon (T1543.004)"},{"t":"Re-opened Applications (T1547.007)"}],"right":[{"t":"hides app windows from the user"},{"t":"runs code at login for one user"},{"t":"runs code as root at system start"},{"t":"apps macOS reopens after login"}]},{"id":"md08","type":"log","summary":"Six log lines — one plist write is the real T1647 hit","scenario":[{"label":"ARTEFACT 1 — macOS unified log (designer Mac, last 12 h)","code":"2026-05-12 09:02:11  write  /Users/kim/Library/Safari/Bookmarks.plist            process: Safari\n2026-05-12 11:40:03  write  /Library/Preferences/com.apple.TimeMachine.plist      process: backupd\n2026-05-12 14:00:55  write  /Users/kim/Library/Preferences/com.apple.dock.plist   process: Dock (user removed a tile)\n2026-05-13 03:12:09  exec   /usr/bin/defaults write com.apple.loginwindow plist ReopenedApps entry -> /Users/Shared/.upd/helper\n2026-05-13 03:12:31  exec   /usr/bin/killall Finder                                user: kim\n2026-05-13 07:55:41  write  /Users/kim/Library/Preferences/com.apple.spotlight.plist process: Spotlight"}],"question":"Which single line shows T1647 behaviour worth escalating?","hint":"Most plist writes here come from macOS's own processes at normal hours. One write happens at 03:12 to a login-related plist.","explain":"The 03:12 write by defaults to the loginwindow plist adds an entry to the apps macOS reopens at login — the Re-opened Applications trick (T1547.007) enabled by plist modification (T1647). The other writes come from system processes (Safari, backupd, Dock, Spotlight) at normal times. Time, process and target file together separate the malicious line from daily noise.","persp":{"red":"Autostart entries in the loginwindow plist survive reboots and look like a user's own app list.","blue":"Baseline the normal writers of each plist — Safari, backupd, Dock, Spotlight — so a 03:12 defaults write stands out."},"study":"Re-opened Applications (T1547.007) via the loginwindow plist is a documented T1647-enabled behaviour.","lines":["2026-05-12 09:02:11  write  /Users/kim/Library/Safari/Bookmarks.plist            process: Safari","2026-05-12 11:40:03  write  /Library/Preferences/com.apple.TimeMachine.plist      process: backupd","2026-05-12 14:00:55  write  /Users/kim/Library/Preferences/com.apple.dock.plist   process: Dock (user removed a tile)","2026-05-13 03:12:09  exec   /usr/bin/defaults write com.apple.loginwindow plist ReopenedApps entry -> /Users/Shared/.upd/helper","2026-05-13 03:12:31  exec   /usr/bin/killall Finder                                user: kim","2026-05-13 07:55:41  write  /Users/kim/Library/Preferences/com.apple.spotlight.plist process: Spotlight"],"sub":{"type":"mcq","options":[{"t":"The 03:12 defaults write to the loginwindow plist"},{"t":"The 14:00 Dock plist write by the Dock process"},{"t":"The 11:40 TimeMachine plist write by backupd"},{"t":"The 07:55 Spotlight plist write"}],"answer":0}},{"id":"md09","type":"mcq","summary":"LaunchAgents write during MDM window — verdict?","scenario":[{"label":"ARTEFACT 1 — Change context","text":"Alert: a new file /Library/LaunchAgents/com.company.cleanup.plist appeared at 11:00 on a managed Mac. The binary it points to is signed by your company's developer certificate, the change happened inside the scheduled MDM maintenance window, and change ticket CHG-2211 lists exactly this deployment."},{"label":"ARTEFACT 2 — Your runbook says","text":"Every plist modification alert needs a verdict: benign known change, suspicious unknown, or malicious."}],"question":"What is the correct verdict for this alert?","hint":"Check the three corroborating facts: signature, maintenance window, matching change ticket.","explain":"All three checks pass: the binary is signed by your own certificate, the timing matches the MDM maintenance window, and ticket CHG-2211 describes the deployment. This is a benign known change — document it and close the alert. Detection tuning (like AN0306's monitored directories) should allow-list known managed paths instead of crying wolf.","study":"Verdicts need context: signature + window + ticket. False positives cost analyst trust if left untuned.","options":[{"t":"Benign known change — document and close"},{"t":"Malicious persistence — isolate the Mac now"},{"t":"User error — ask the user to delete the file"}],"answer":0},{"id":"md10","type":"terminal","summary":"Terminal — print a binary plist read-only with plutil","scenario":[{"label":"ARTEFACT 1 — Task from your lead","text":"The file /Users/jdoe/Library/LaunchAgents/com.updater.helper.plist is in binary format. Print its contents in a human-readable form. Rule: do NOT change the file on disk — it is evidence."},{"label":"ARTEFACT 2 — What you know","text":"plutil can convert between formats, and it can also just print a plist's contents. Choose the read-only option."}],"question":"Type the command that prints the plist without modifying it.","hint":"You need plutil, the flag that only prints, and the file path. It is not -convert.","explain":"plutil -p prints a plist in human-readable form without touching the file — the safe, evidence-preserving choice. Converting with -convert would rewrite the evidence file. Printing reveals ProgramArguments and RunAtLoad so you can see exactly what will run at login.","persp":{"red":"Attackers rely on defenders rewriting or deleting the plist in a hurry — a destroyed artefact protects the campaign.","blue":"Read-only inspection (-p) keeps the hash stable so the file can still be presented as evidence."},"study":"plutil -p file.plist = print only. Never -convert on evidence.","host":"analyst@macbook-fin-07 triage","prompt":"analyst@macbook-fin-07 ~ %","introLines":["# Evidence file: /Users/jdoe/Library/LaunchAgents/com.updater.helper.plist (binary)","# Print it read-only."],"elements":[{"label":"the tool: plutil","any":["plutil"]},{"label":"the read-only print flag: -p","any":["-p"]},{"label":"the evidence file path","any":["com.updater.helper.plist"]}],"canonical":"plutil -p /Users/jdoe/Library/LaunchAgents/com.updater.helper.plist","parts":[{"label":"plutil","desc":"the plist utility"},{"label":"-p","desc":"print the plist in human-readable form — no writes"},{"label":"path","desc":"the LaunchAgent plist from the alert"}],"danger":[{"any":["-convert","defaults write"],"note":"that command would MODIFY the evidence file (or system settings) — the lead asked for read-only output."}],"dangerNote":"-convert rewrites the file on disk; on evidence you print with -p instead.","outputSample":["{","  Label = \"com.updater.helper\"","  ProgramArguments = ( \"/Users/Shared/.upd/helper\" )","  RunAtLoad = 1","}"],"timeLimit":null},{"id":"md11","type":"multi","summary":"Which behaviours does the T1647 description enable","scenario":[{"label":"ARTEFACT 1 — ATT&CK excerpt (T1647)","text":"Adversaries can modify key-value pairs in plist files to influence system behaviors, such as hiding the execution of an application (i.e. Hidden Window) or running additional commands for persistence (ex: Launch Agent / Launch Daemon or Re-opened Applications)."}],"question":"Select the TWO behaviours the excerpt names.","hint":"One behaviour is about hiding, one about starting things again automatically.","explain":"The excerpt names hiding the execution of an application (Hidden Window) and running additional commands for persistence (Launch Agents, Launch Daemons, Re-opened Applications). Wiping FileVault keys and brute-forcing iCloud are unrelated behaviours that the plist technique does not describe.","study":"T1647 = enabling technique: it flips plist keys that produce hidden execution and autostart persistence.","options":[{"t":"Hide the execution of an application","correct":true,"why":"named directly — the Hidden Window use of LSUIElement"},{"t":"Run additional commands for persistence","correct":true,"why":"named directly — Launch Agents / Daemons / Re-opened Applications"},{"t":"Wipe the FileVault recovery key","correct":false,"why":"FileVault key handling is not part of this technique"},{"t":"Brute-force iCloud passwords","correct":false,"why":"password attacks are a different technique family"}]},{"id":"md12","type":"order","summary":"Order the responder's first five actions","scenario":[{"label":"ARTEFACT 1 — Situation","text":"A LaunchAgent plist appeared in ~/Library/LaunchAgents on a developer Mac. Your lead says: 'Take the first five minutes. Order your steps before you touch anything.'"}],"question":"Put the five actions in the correct order.","hint":"Read, identify, judge, correlate, contain — in that family of order.","explain":"First read what changed (defaults read or plutil -p), then identify the binary the agent points to, then judge the binary (signature, path), then correlate the plist write with process launches in the time window, and only then contain (unload the agent, quarantine the binary). Acting in this order preserves evidence and keeps the story straight for the report.","study":"Read → identify → judge → correlate → contain. The order protects the evidence.","items":[{"t":"Read the plist contents (defaults read / plutil -p)"},{"t":"Identify the binary referenced by ProgramArguments"},{"t":"Judge the binary: signature, path, reputation"},{"t":"Correlate plist write time with process launches"},{"t":"Contain: unload the agent and quarantine the binary"}]},{"id":"md13","type":"mcq","summary":"Root code before login — which plist","scenario":[{"label":"ARTEFACT 1 — Attacker goal","text":"An attacker on a stolen Mac wants their implant to run as ROOT every time the machine starts, before anyone logs in. They can modify plist files to achieve it."}],"question":"Which plist modification achieves root execution at boot?","hint":"Ask two things: which plist type runs as root, and which runs before login.","explain":"Launch Daemons live in /Library/LaunchDaemons and run as root at system start — before any user logs in. Per-user Launch Agents run only for one user and only after that user logs in. The Dock plist and Safari's bookmarks plist change what users see, not what runs as root.","persp":{"red":"A rogue daemon survives logouts and reboots and runs with full system rights — the strongest macOS persistence a plist can give.","blue":"Writes to /Library/LaunchDaemons need admin rights; alert on any non-MDM process creating files there."},"study":"Launch Daemon (T1543.004) = root + boot. Launch Agent (T1543.011) = user + login.","options":[{"t":"A LaunchDaemon plist in /Library/LaunchDaemons"},{"t":"A LaunchAgent plist in ~/Library/LaunchAgents"},{"t":"The Dock's com.apple.dock.plist"},{"t":"Safari's Bookmarks.plist"}],"answer":0},{"id":"md14","type":"fill","summary":"Fill the blanks: plist formats and the Core Foundation DTD","scenario":[{"label":"ARTEFACT 1 — ATT&CK excerpt (T1647)","text":"Plist files are structured metadata in key-value pairs formatted in XML based on Apple's Core Foundation DTD. Plist files can be saved in text or binary format."}],"question":"Complete the two blanks about plist formats.","hint":"Blank 1: the other format besides text. Blank 2: the three-letter word for the XML structure definition Apple uses.","explain":"The description says plists can be saved in text or binary format, and the XML variant follows Apple's Core Foundation DTD — a Document Type Definition, the rulebook that says which tags are allowed. Malware prefers binary to frustrate quick text review; analysts flip files back to XML with plutil -convert xml1.","study":"text (XML, Core Foundation DTD) vs binary — both are the same key-value data.","segments":["Plist files can be saved in text or ",{"blank":{"label":"the other format","accept":["binary"]}}," format, and their XML form follows Apple's Core Foundation ",{"blank":{"label":"XML structure rulebook","accept":["dtd"]}},"."],"bank":["binary","DTD","JSON","YAML"]},{"id":"md15","type":"dnd","summary":"Drag each procedure to the malware family","scenario":[{"label":"ARTEFACT 1 — ATT&CK procedure examples (T1647)","text":"S1153 Cuckoo Stealer can create and populate plist files to enable execution. S0658 XCSSET uses plutil to change Info.plist keys and, in later versions, leverages a third-party notarized dockutil tool to repoint the Dock to a malicious application."}],"question":"Drag each observed procedure onto the family that performs it.","hint":"One family is famous for the plutil + dockutil combination; the other simply creates and fills plists.","explain":"XCSSET (S0658) owns the plutil + dockutil combination: rewriting Info.plist keys and abusing a notarized Dock-editing tool. Cuckoo Stealer (S1153) is described as creating and populating plist files to enable execution. Matching procedures to families is how CTI analysts connect new samples to known campaigns.","study":"S0658 XCSSET: plutil + notarized dockutil. S1153 Cuckoo Stealer: creates and populates plists.","items":[{"t":"Uses plutil to change LSUIElement / DFBundleDisplayName / CFBundleIdentifier"},{"t":"Abuses a notarized third-party dockutil to repoint the Dock"},{"t":"Creates and populates plist files to enable execution"}],"slots":[{"label":"XCSSET (S0658) — Info.plist key edits","accept":0},{"label":"XCSSET (S0658) — Dock repointing","accept":1},{"label":"Cuckoo Stealer (S1153) — plist enablement","accept":2}]},{"id":"md16","type":"triage","summary":"SOC alert queue — four plist alerts to handle","scenario":[{"label":"ARTEFACT 1 — Shift handover note","text":"Your queue has four plist-related alerts. Handle each one: pick the action you would actually take. One alert is benign noise; two need escalation; one needs a closer look before deciding."}],"question":"Handle all four alerts — one action per alert.","hint":"Corroborate before escalating: who wrote it, when, and is there a ticket? Never delete first.","explain":"Alert A is benign: it matches ticket CHG-2211 and the MDM window, so document and close. Alert B is a 03:12 defaults write adding a loginwindow ReopenedApps entry — classic T1647 + T1547.007, escalate. Alert C is a binary conversion of a user plist — rare enough to inspect the file read-only before deciding. Alert D is a text editor touching /Library/LaunchDaemons — a root-level autostart area; escalate for admin-account review.","persp":{"red":"Attackers love queues: bury one malicious plist change between routine noise and hope for a rushed analyst.","blue":"Corroborate (ticket, signature, writer), escalate what fails the checks, and inspect the rest read-only."},"study":"Triage = the same three questions per alert: who wrote it, does context vouch for it, what does it change.","alerts":[{"name":"ALERT A — new /Library/LaunchAgents/com.company.cleanup.plist","sev":"LOW","lines":["2026-05-12 11:00:03  write  /Library/LaunchAgents/com.company.cleanup.plist  process: mdm-agent  ticket: CHG-2211"],"question":"The plist matches change ticket CHG-2211 and the MDM window. Action?","options":[{"t":"Document as benign known change and close","ok":true,"consequence":"Alert closed with the ticket linked — metrics stay honest."},{"t":"Isolate the Mac and page the IR lead","ok":false,"consequence":"The whole floor now hunts a signed, ticketed deployment — trust erodes."},{"t":"Delete the plist on the spot","ok":false,"consequence":"You just broke a managed deployment your own company shipped."}],"bestNote":"document it against the ticket and close — signature, window and ticket all corroborate"},{"name":"ALERT B — defaults write to loginwindow plist at 03:12","sev":"HIGH","lines":["2026-05-13 03:12:09  exec  /usr/bin/defaults write com.apple.loginwindow.plist  ReopenedApps -> /Users/Shared/.upd/helper"],"question":"An unknown binary was added to the apps macOS reopens at login. Action?","options":[{"t":"Escalate to IR with the full command line and path","ok":true,"consequence":"IR collects the helper binary and hunts the path fleet-wide."},{"t":"Wait a week and see if it repeats","ok":false,"consequence":"A persistence mechanism runs unwatched for seven days."},{"t":"Ask the user by email if they installed something","ok":false,"consequence":"03:12 changes with hidden folders do not wait for office hours."}],"bestNote":"escalate immediately — a hidden binary in Re-opened Applications is T1647 + T1547.007"},{"name":"ALERT C — plutil -convert binary1 on user plist","sev":"MEDIUM","lines":["2026-05-13 04:44:10  exec  /usr/bin/plutil -convert binary1 /Users/sam/Library/Preferences/com.apple.dock.plist  user: sam"],"question":"A user-level Dock plist was converted to binary at 04:44. Action?","options":[{"t":"Inspect the file read-only (plutil -p) and check the writer","ok":true,"consequence":"The print shows the Dock still lists the usual apps — you log a low-severity observation and move on."},{"t":"Escalate to IR as confirmed malware","ok":false,"consequence":"You escalated before looking inside the file — the queue floods."},{"t":"Convert it back to XML in place","ok":false,"consequence":"You modified a file that might be evidence."}],"bestNote":"look inside read-only and identify the writer before any verdict"},{"name":"ALERT D — vim opened /Library/LaunchDaemons/com.sync.helper.plist","sev":"HIGH","lines":["2026-05-13 05:20:41  exec  vim /Library/LaunchDaemons/com.sync.helper.plist  user: svc-backup  result: file created"],"question":"A service account created a LaunchDaemon plist with a text editor. Action?","options":[{"t":"Escalate — root autostart created by a service account","ok":true,"consequence":"IR reviews svc-backup usage, the daemon plist, and every host that account touches."},{"t":"Close — text editors are normal user activity","ok":false,"consequence":"A root-level autostart lives on unchallenged."},{"t":"Rename the service account and carry on","ok":false,"consequence":"The daemon still runs as root; the account rename changes nothing."}],"bestNote":"escalate — a service account writing a LaunchDaemon plist is a root persistence attempt"}]}]}</script>
<script>
/* ============ CyberPulse exam engine — T1647 ============ */
(function () {
  "use strict";
  var META = null, DATA = null;
  var S = null; /* session state */
  var EX_STATE = {}; /* per-exercise render state */
  var TICK = null;

  /* ---------- utils ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;");
  }
  function escAttr(s) { return esc(s).replace(/'/g, "&#39;"); }
  function shuffle(a) {
    var x = a.slice(), i, j, t;
    for (i = x.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = x[i]; x[i] = x[j]; x[j] = t; }
    return x;
  }
  function fmtTime(s) {
    if (s < 0) s = 0;
    var m = Math.floor(s / 60), r = s % 60;
    return (m < 10 ? "0" + m : "" + m) + ":" + (r < 10 ? "0" + r : "" + r);
  }
  function fmtDur(s) {
    var m = Math.floor(s / 60), r = s % 60;
    if (m === 0) return r + "s";
    return m + "m " + (r < 10 ? "0" + r : r) + "s";
  }
  function r1(x) { return Math.round(x * 10) / 10; }
  function words(s) { return String(s).split(/\s+/).filter(function (w) { return w.length > 0; }).length; }
  function norm(s) {
    return String(s).toLowerCase().replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"')
      .replace(/\s+/g, " ").trim();
  }
  function codeHi(s) {
    var out = esc(s);
    out = out.replace(/(&quot;[^&]*?&quot;)/g, "<span class=\"s\">$1</span>");
    out = out.replace(/(^|\s)(\/[\w.\/~@+-]+)/g, "$1<span class=\"p\">$2</span>");
    out = out.replace(/(^|\s)((?:defaults|plutil|PlistBuddy|dockutil|launchctl|killall|osascript|file|grep|ls|cat|md5|shasum|codesign|spctl|xattr|sqlite3)(?=\s|$))/g, "$1<span class=\"k\">$2</span>");
    return out;
  }

  /* ---------- timer state machine ---------- */
  /* states: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
  function setTimerState(st) {
    S.timer.state = st;
    var el = $("hTState");
    if (st === "RUNNING") { el.textContent = "\u25B6 RUNNING"; el.className = "tstate run"; }
    else if (st === "PAUSED_MANUAL") { el.textContent = "\u23F8 PAUSED \u2014 manual (press Resume)"; el.className = "tstate"; }
    else if (st === "PAUSED_AUTO_CHECK") { el.textContent = "\u23F8 PAUSED \u2014 reviewing feedback (resumes on Next)"; el.className = "tstate"; }
    else { el.textContent = "\u23F9 ENDED"; el.className = "tstate"; }
  }
  function startTicks() {
    if (TICK) clearInterval(TICK);
    TICK = setInterval(function () {
      if (!S || S.phase === "intro" || S.phase === "results") return;
      if (S.timer.state !== "RUNNING") return;
      S.timer.remaining -= 1;
      if (S.timer.remaining <= 0) {
        S.timer.remaining = 0;
        setTimerState("ENDED");
        updateHeader();
        showResults();
        return;
      }
      updateHeader();
    }, 1000);
  }
  function autoPauseStart() {
    if (S.timer.state === "RUNNING") {
      S.timer.state = "PAUSED_AUTO_CHECK";
      S.timer._autoStart = Date.now();
      setTimerState("PAUSED_AUTO_CHECK");
    }
  }
  function autoPauseEnd() {
    if (S.timer.state === "PAUSED_AUTO_CHECK") {
      if (S.timer._autoStart) { S.timer.autoPauseSec += Math.round((Date.now() - S.timer._autoStart) / 1000); S.timer._autoStart = null; }
      S.timer.state = "RUNNING";
      setTimerState("RUNNING");
    }
  }

  /* ---------- header ---------- */
  function updateHeader() {
    $("hTimer").textContent = fmtTime(S.timer.remaining);
    $("hN").textContent = String(Math.min(S.idx + 1, S.order.length));
    $("hScore").textContent = r1(S.creditSum) + " / " + S.answeredCount;
    var pct = S.answeredCount > 0 ? Math.round((S.creditSum / S.answeredCount) * 100) : 0;
    $("hPct").textContent = "(" + pct + "%)";
    $("hProg").style.width = (S.order.length ? Math.round(((S.idx) / S.order.length) * 100) : 0) + "%";
  }
  function buildHeader() {
    var sev = META.severity, cls = "sev-badge sev-" + META.sevClass;
    var sevIcon = sev === "EASY" ? "\u25CF" : sev === "MEDIUM" ? "\u25CF" : sev === "HARD" ? "\u25B2" : "\u25B2";
    $("hdr").innerHTML =
      "<div class=\"cell\"><span class=\"tid\">" + esc(META.topicId.toUpperCase()) + "</span> Exercise <b id=\"hN\">1</b> of " + S.order.length + "</div>" +
      "<div class=\"cell\"><span class=\"" + cls + "\"><span aria-hidden=\"true\">" + sevIcon + "</span> " + esc(sev) + "</span></div>" +
      "<div class=\"cell\"><span id=\"hTState\" class=\"tstate run\">\u25B6 RUNNING</span> <span id=\"hTimer\" class=\"timer\">" + fmtTime(S.timer.remaining) + "</span></div>" +
      "<div class=\"cell\">Score <b id=\"hScore\">0.0 / 0</b> <span id=\"hPct\">(0%)</span></div>" +
      "<div class=\"spacer\"></div>" +
      "<button class=\"btn amber\" id=\"btnHint\" type=\"button\">\u25CB Hint</button>" +
      "<button class=\"btn ghost\" id=\"btnPause\" type=\"button\">\u23F8 Pause</button>" +
      "<button class=\"btn red\" id=\"btnSkip\" type=\"button\">\u26A0 Skip</button>" +
      "<div class=\"progress-track\" style=\"flex-basis:100%\"><div class=\"progress-fill\" id=\"hProg\"></div></div>";
    $("btnHint").addEventListener("click", hint);
    $("btnPause").addEventListener("click", manualPause);
    $("btnSkip").addEventListener("click", skip);
  }

  /* ---------- intro ---------- */
  function renderIntro() {
    var sev = META.severity, cls = "sev-badge sev-" + META.sevClass;
    var sevIcon = sev === "HARD" || sev === "EXTREMELY HARD" ? "\u25B2" : "\u25CF";
    var mins = META.estimatedMinutes;
    var h = "";
    h += "<div class=\"card\">";
    h += "<div class=\"intro-head\"><h1>" + esc(META.objectId) + " \u2014 " + esc(sev) + " practice exam</h1></div>";
    h += "<div style=\"color:var(--text-secondary);font-size:15.5px\">" + esc(META.objectLine) + "</div>";
    h += "<div class=\"meta-chips\">";
    h += "<span class=\"chip2\"><span aria-hidden=\"true\">\u2691</span> Severity: <b>" + esc(sev) + "</b> <span class=\"" + cls + "\"><span aria-hidden=\"true\">" + sevIcon + "</span> " + esc(sev) + "</span></span>";
    h += "<span class=\"chip2\"><span aria-hidden=\"true\">\u2261</span> Exercises in this file: <b>" + DATA.exercises.length + "</b></span>";
    h += "<span class=\"chip2\"><span aria-hidden=\"true\">\u23F1</span> Estimated time: <b>" + mins + " min</b> \u2014 timer budget <b>" + fmtTime(META.timerBudget) + "</b></span>";
    h += "<span class=\"chip2\"><span aria-hidden=\"true\">\u2713</span> Pass mark: <b>" + META.passMark + "%</b></span>";
    h += "</div></div>";

    h += "<h2 class=\"sec\"><span aria-hidden=\"true\">\u25C6</span> What you will learn here</h2>";
    h += "<div class=\"card\">" + DATA.intro.learn + "</div>";

    h += "<h2 class=\"sec\"><span aria-hidden=\"true\">\u25C6</span> Keywords covered in this exam</h2>";
    h += "<div class=\"card\">";
    for (var i = 0; i < DATA.intro.keywords.length; i++) {
      var k = DATA.intro.keywords[i];
      h += "<div class=\"kw-theme\"><div class=\"kw-h\">" + esc(k.theme) + "</div><div class=\"kw-tags\">";
      for (var j = 0; j < k.tags.length; j++) h += "<span class=\"kw-tag\">" + esc(k.tags[j]) + "</span>";
      h += "</div></div>";
    }
    h += "</div>";

    h += "<h2 class=\"sec\"><span aria-hidden=\"true\">\u25C6</span> How this exam works</h2>";
    h += "<div class=\"card\">" + DATA.intro.how;
    h += "<div class=\"startrow\"><button id=\"btnStart\" class=\"startbtn\" type=\"button\">\u25B6 Start the exam</button>";
    h += "<span class=\"mini\" style=\"color:var(--text-secondary);font-size:14px\">Pass mark " + META.passMark + "%. Good luck.</span></div></div>";
    $("intro").innerHTML = h;
    $("btnStart").addEventListener("click", startExam);
  }

  /* ---------- exam start / flow ---------- */
  function startExam() {
    S.phase = "exam";
    S.order = shuffle(DATA.exercises.map(function (o, i) { return i; }));
    S.idx = 0;
    S.answers = {};
    EX_STATE = {};
    S.answeredCount = 0;
    S.creditSum = 0;
    S.skipped = [];
    S.reviewing = null;
    S.hinted = {};
    S.reportedThisAttempt = false;
    S.timer = { remaining: META.timerBudget, state: "RUNNING", manualPauseSec: 0, autoPauseSec: 0, _autoStart: null, _manualStart: null };
    $("intro").classList.add("hidden");
    $("results").classList.add("hidden");
    $("review").classList.add("hidden");
    $("exam").classList.remove("hidden");
    buildHeader();
    setTimerState("RUNNING");
    renderCurrent();
  }
  function curEx() { return DATA.exercises[S.order[S.idx]]; }
  function renderCurrent() {
    var ex = curEx();
    renderExercise(ex, false);
    updateHeader();
    window.scrollTo(0, 0);
  }
  function allDone() { return S.idx >= S.order.length; }
  function advance() {
    S.idx += 1;
    if (allDone()) {
      if (S.skipped.length > 0) openReview();
      else showResults();
    } else renderCurrent();
  }

  /* ---------- scenario / question / answer blocks ---------- */
  function artefactHtml(a) {
    var h = "<div class=\"artefact\"><div class=\"artefact-label\">" + esc(a.label) + "</div><div class=\"artefact-body\">";
    if (a.code !== undefined && a.code !== null) h += "<pre class=\"code\">" + codeHi(a.code) + "</pre>";
    else h += "<div style=\"font-size:15px\">" + esc(a.text) + "</div>";
    h += "</div></div>";
    return h;
  }
  function renderExercise(ex, inReview) {
    var host = $("exercise");
    var st = EX_STATE[ex.id] = EX_STATE[ex.id] || {};
    st.inReview = !!inReview;
    var longScenario = words(ex.scenario.map(function (a) { return a.text || a.code || ""; }).join(" ")) > 110;
    var h = "";
    h += "<div class=\"block block-s\" id=\"blkS\">";
    h += "<div class=\"block-h\"><span class=\"ic\" aria-hidden=\"true\">\u25A3</span> SCENARIO <span style=\"margin-left:auto\"></span>";
    if (longScenario) h += "<button class=\"collapse-btn\" id=\"btnCollapse\" type=\"button\">Collapse scenario</button>";
    h += "</div>";
    if (longScenario) h += "<div class=\"collapsed-summary\">" + esc(ex.summary) + "</div>";
    h += "<div class=\"block-b artefacts-wrap\">";
    for (var i = 0; i < ex.scenario.length; i++) h += artefactHtml(ex.scenario[i]);
    h += "</div></div>";
    h += "<div class=\"block block-q\"><div class=\"block-h\"><span class=\"ic\" aria-hidden=\"true\">\u2753</span> QUESTION</div><div class=\"block-b\"><div class=\"qtext\">" + esc(ex.question) + "</div></div></div>";
    h += "<div class=\"block block-a\"><div class=\"block-h\"><span class=\"ic\" aria-hidden=\"true\">\u270E</span> YOUR ANSWER</div><div class=\"block-b\" id=\"ansArea\"></div></div>";
    h += "<div class=\"footrow\">";
    h += "<div style=\"color:var(--text-secondary);font-size:13.5px\">" + (inReview ? "\u26A0 Skipped exercise \u2014 review mode. Answer it now or return to the list." : (st.hinted ? "\u25CB Hint used on this exercise (\u221210% credit)." : "One hint allowed on this exercise (\u221210% of its credit).")) + "</div>";
    h += "<div style=\"display:flex;gap:10px\">";
    if (!inReview) h += "<button class=\"btn green\" id=\"btnCheck\" type=\"button\">\u2713 Check</button>";
    else h += "<button class=\"btn green\" id=\"btnCheck\" type=\"button\">\u2713 Check</button>";
    h += "<button class=\"btn primary hidden\" id=\"btnNext\" type=\"button\">" + (inReview ? "Next \u2192 back to list" : "Next \u2192") + "</button>";
    h += "</div></div>";
    h += "<div id=\"fbHost\"></div>";
    host.innerHTML = h;
    var ca = $("btnCollapse");
    if (ca) ca.addEventListener("click", function () {
      var blk = $("blkS");
      blk.classList.toggle("collapsed");
      ca.textContent = blk.classList.contains("collapsed") ? "Expand scenario" : "Collapse scenario";
    });
    renderWidget(ex);
    $("btnCheck").addEventListener("click", function () { doCheck(ex); });
    $("btnNext").addEventListener("click", function () { doNext(ex); });
    var hintBtn2 = $("btnHint");
    hintBtn2.disabled = !!(st.hinted || st.checked);
    $("btnSkip").disabled = !!st.checked;
    if (st.checked) { $("btnCheck").disabled = true; disableWidget(ex); }
  }

  /* ---------- widgets ---------- */
  function renderWidget(ex) {
    var host = $("ansArea");
    var st = EX_STATE[ex.id];
    if (ex.type === "mcq") host.innerHTML = optsHtml(ex, false);
    else if (ex.type === "multi") host.innerHTML = optsHtml(ex, true);
    else if (ex.type === "match") host.innerHTML = matchHtml(ex);
    else if (ex.type === "dnd") host.innerHTML = dndHtml(ex);
    else if (ex.type === "fill") host.innerHTML = fillHtml(ex);
    else if (ex.type === "order") host.innerHTML = orderHtml(ex);
    else if (ex.type === "terminal") host.innerHTML = termHtml(ex);
    else if (ex.type === "branch") host.innerHTML = branchHtml(ex);
    else if (ex.type === "triage") host.innerHTML = triageHtml(ex);
    else if (ex.type === "log") host.innerHTML = logHtml(ex);
    bindWidget(ex);
  }
  function optsHtml(ex, isMulti) {
    var st = EX_STATE[ex.id] = EX_STATE[ex.id] || {};
    if (!st.optPerm) {
      st.optPerm = shuffle(ex.options.map(function (o, i) { return i; }));
    }
    var h = "<div class=\"opts\" role=\"" + (isMulti ? "group" : "radiogroup") + "\" aria-label=\"Answer options\">";
    for (var v = 0; v < st.optPerm.length; v++) {
      var oi = st.optPerm[v];
      var o = ex.options[oi];
      var letter = String.fromCharCode(65 + v);
      var sel = st.sel && st.sel.indexOf(oi) >= 0;
      h += "<label class=\"opt" + (sel ? " sel" : "") + "\">" +
        "<input type=\"" + (isMulti ? "checkbox" : "radio") + "\" name=\"opt_" + esc(ex.id) + "\" value=\"" + oi + "\"" + (sel ? " checked" : "") + " data-oi=\"" + oi + "\">" +

  /* ---------- grading ---------- */
  /* Single reusable partial-credit scoring function (spec STEP 5).
     selectedItems / correctItems are arrays of item keys; a selected key that
     is not a correct key counts as a wrong pick. Returns a real in [0, 1]. */
  function scoreExercise(selectedItems, correctItems) {
    var N = correctItems.length, H = 0, W = 0, i, k;
    var picked = [];
    for (i = 0; i < selectedItems.length; i++) {
      if (selectedItems[i] === undefined || selectedItems[i] === null) continue;
      var dup = false;
      for (k = 0; k < picked.length; k++) { if (picked[k] === String(selectedItems[i])) { dup = true; break; } }
      if (!dup) picked.push(String(selectedItems[i]));
    }
    for (i = 0; i < picked.length; i++) {
      var inCorrect = false;
      for (k = 0; k < N; k++) { if (String(correctItems[k]) === picked[i]) { inCorrect = true; break; } }
      if (inCorrect) H++; else W++;
    }
    return Math.max(0, (H - W) / N);
  }
  function grade(ex) {
    var st = EX_STATE[ex.id];
    var g = { credit: 0, H: 0, W: 0, N: 1, items: [], label: "INCORRECT", extra: "" };
    var i, k;
    if (ex.type === "mcq") {
      g.N = 1;
      var pick = st.sel && st.sel.length ? st.sel[0] : undefined;
      if (pick === ex.answer) { g.H = 1; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 you picked the right answer." }); }
      else if (pick === undefined) { g.items.push({ s: "miss", t: "\u25CB Missed \u2014 no answer given." }); }
      else { g.W = 1; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 correct answer: " + ex.options[ex.answer].t }); }
    } else if (ex.type === "multi" || (ex.type === "log" && ex.sub.type === "multi")) {
      var opts = ex.type === "log" ? ex.sub.options : ex.options;
      var sel = ex.type === "log" ? st.sel : st.sel;
      g.N = 0;
      for (i = 0; i < opts.length; i++) {
        if (opts[i].correct) {
          g.N++;
          if (sel && sel.indexOf(i) >= 0) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 " + opts[i].t + " " + (opts[i].why ? "\u2014 " + opts[i].why : "") }); }
          else g.items.push({ s: "miss", t: "\u25CB Missed \u2014 " + opts[i].t + " " + (opts[i].why ? "\u2014 " + opts[i].why : "") });
        }
      }
      for (i = 0; i < opts.length; i++) {
        if (!opts[i].correct && sel && sel.indexOf(i) >= 0) { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 " + opts[i].t + " " + (opts[i].why ? "\u2014 " + opts[i].why : "") }); }
      }
    } else if (ex.type === "match") {
      g.N = ex.left.length;
      for (i = 0; i < ex.left.length; i++) {
        if (st.asg[i] === undefined) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 " + ex.left[i].t + " was not paired." });
        else if (st.asg[i] === i) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 " + ex.left[i].t + " \u2192 " + ex.right[i].t }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 " + ex.left[i].t + " pairs with \u201C" + ex.right[i].t + "\u201D, not \u201C" + ex.right[st.asg[i]].t + "\u201D." }); }
      }
    } else if (ex.type === "dnd") {
      g.N = ex.slots.length;
      for (i = 0; i < ex.slots.length; i++) {
        var occupant = null;
        for (k in st.placed) { if (st.placed[k] === i) occupant = parseInt(k, 10); }
        if (occupant === null) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 target \u201C" + ex.slots[i].label + "\u201D was left empty; it accepts " + ex.items[ex.slots[i].accept].t + "." });
        else if (occupant === ex.slots[i].accept) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 " + ex.items[occupant].t + " \u2192 " + ex.slots[i].label }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 " + ex.items[occupant].t + " does not belong on \u201C" + ex.slots[i].label + "\u201D; the right item is " + ex.items[ex.slots[i].accept].t + "." }); }
      }
    } else if (ex.type === "fill") {
      var blanks = [];
      for (i = 0; i < ex.segments.length; i++) if (typeof ex.segments[i] !== "string") blanks.push(ex.segments[i].blank);
      g.N = blanks.length;
      for (i = 0; i < blanks.length; i++) {
        var v = st.vals ? (st.vals[i] || "") : "";
        if (!v.trim()) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 blank " + (i + 1) + " (" + blanks[i].label + ") left empty; accepted: " + blanks[i].accept.join(" / ") + "." });
        else if (blanks[i].accept.map(norm).indexOf(norm(v)) >= 0) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 blank " + (i + 1) + " (" + blanks[i].label + "): " + v }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 blank " + (i + 1) + " (" + blanks[i].label + "): you typed \u201C" + v + "\u201D; accepted: " + blanks[i].accept.join(" / ") + "." }); }
      }
    } else if (ex.type === "order") {
      g.N = ex.items.length;
      for (i = 0; i < st.list.length; i++) {
        if (st.list[i] === i) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 position " + (i + 1) + ": " + ex.items[i].t }); }
        else g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 position " + (i + 1) + " should be: " + ex.items[i].t + " (you placed " + ex.items[st.list[i]].t + ")" });
      }
    } else if (ex.type === "terminal") {
      var cmd = st.cmd || "";
      var n = norm(cmd);
      g.N = ex.elements.length;
      if (!cmd.trim()) {
        for (i = 0; i < ex.elements.length; i++) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 " + ex.elements[i].label + " (no command entered)" });
      } else {
        for (i = 0; i < ex.elements.length; i++) {
          var el = ex.elements[i], hit = false;
          for (k = 0; k < el.any.length; k++) { if (n.indexOf(norm(el.any[k])) >= 0) { hit = true; break; } }
          if (hit) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct element \u2014 " + el.label }); }
          else g.items.push({ s: "miss", t: "\u25CB Missing element \u2014 " + el.label });
        }
      }
      if (ex.danger) {
        var dHit = false;
        for (i = 0; i < ex.danger.length; i++) {
          var ds = ex.danger[i].any;
          for (k = 0; k < ds.length; k++) { if (n.indexOf(norm(ds[k])) >= 0) { dHit = true; break; } }
          if (dHit) break;
        }
        if (dHit) g.extra = "\u2717 DANGEROUS \u2014 NEAR MISS: " + ex.dangerNote;
      }
    } else if (ex.type === "branch") {
      g.N = ex.steps.length;
      for (i = 0; i < ex.steps.length; i++) {
        var p2 = st.picks[i];
        if (p2 === undefined) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 step " + (i + 1) + " unanswered; best move: " + ex.steps[i].bestNote });
        else if (ex.steps[i].options[p2].ok) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 step " + (i + 1) + ": " + ex.steps[i].options[p2].t }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 step " + (i + 1) + ": you chose \u201C" + ex.steps[i].options[p2].t + "\u201D; better: " + ex.steps[i].bestNote }); }
      }
    } else if (ex.type === "triage") {
      g.N = ex.alerts.length;
      for (i = 0; i < ex.alerts.length; i++) {
        var p3 = st.picks[i];
        if (p3 === undefined) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 " + ex.alerts[i].name + " not handled; best move: " + ex.alerts[i].bestNote });
        else if (ex.alerts[i].options[p3].ok) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 " + ex.alerts[i].name + ": " + ex.alerts[i].options[p3].t }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 " + ex.alerts[i].name + ": you chose \u201C" + ex.alerts[i].options[p3].t + "\u201D; better: " + ex.alerts[i].bestNote }); }
      }
    } else if (ex.type === "log" && ex.sub.type === "mcq") {
      g.N = 1;
      var pick2 = st.sel && st.sel.length ? st.sel[0] : undefined;
      if (pick2 === ex.sub.answer) { g.H = 1; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 you read the log the right way." }); }
      else if (pick2 === undefined) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 no answer given." });
      else { g.W = 1; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 correct answer: " + ex.sub.options[ex.sub.answer].t }); }
    }
    /* route every exercise (multi-answer and single-answer alike) through the
       one reusable scoring function: H correct picks, W wrong picks, N correct items */
    var selKeys = [], corKeys = [], i3;
    for (i3 = 0; i3 < g.H; i3++) selKeys.push("c" + i3);
    for (i3 = 0; i3 < g.W; i3++) selKeys.push("w" + i3);
    for (i3 = 0; i3 < g.N; i3++) corKeys.push("c" + i3);
    g.credit = scoreExercise(selKeys, corKeys);
    g.label = g.credit >= 1 ? "CORRECT" : (g.credit > 0 ? "PARTIALLY CORRECT" : "INCORRECT");
    return g;
  }

  /* ---------- check / feedback / next ---------- */
  function doCheck(ex) {
    var st = EX_STATE[ex.id];
    if (st.checked) return;
    autoPauseStart(); /* FIRST action: stop the timer before rendering feedback */
    var g = grade(ex);
    st.checked = true;
    var hinted = !!st.hinted;
    var before = g.credit;
    var finalCredit = hinted ? Math.max(0, before - 0.1) : before;
    st.g = g; st.finalCredit = finalCredit; st.hinted = hinted;
    S.answers[ex.id] = { credit: finalCredit, ex: ex };
    S.answeredCount += 1;
    S.creditSum += finalCredit;
    renderFeedback(ex, g, finalCredit, hinted, before);
    $("btnCheck").disabled = true;
    $("btnSkip").disabled = true;
    $("btnHint").disabled = true;
    var nb = $("btnNext");
    nb.classList.remove("hidden");
    if (!st.inReview && S.idx === S.order.length - 1) nb.textContent = "Final Submit \u2192";
    disableWidget(ex);
    updateHeader();
  }
  function renderFeedback(ex, g, finalCredit, hinted, before) {
    var host = $("fbHost");
    var cls = g.label === "CORRECT" ? "f-correct" : (g.label === "PARTIALLY CORRECT" ? "f-partial" : "f-incorrect");
    var icon = g.label === "INCORRECT" ? "\u2717" : "\u2713";
    var h = "<div class=\"feedback " + cls + "\"><div class=\"feedback-h\"><span aria-hidden=\"true\">" + icon + "</span> " + g.label;
    if (g.N > 1) h += " <span style=\"font-weight:400\">(credit " + (Math.round(finalCredit * 100) / 100) + " \u2014 " + g.H + "/" + g.N + " items)</span>";
    h += "</div><div class=\"feedback-b\">";
    if (hinted && before > 0) h += "<div class=\"credit-line\" style=\"color:var(--state-partial)\">\u25CB Hint penalty applied: " + before + " \u2192 " + finalCredit + " (credit \u2212 0.10).</div>";
    h += "<div>" + esc(ex.explain) + "</div>";
    if (g.N > 1 || g.label === "INCORRECT") {
      h += "<div class=\"item-rows\">";
      for (var i = 0; i < g.items.length; i++) {
        var it = g.items[i];
        var c = it.s === "ok" ? "ok" : it.s === "bad" ? "bad" : "miss";
        h += "<div class=\"item-row " + c + "\"><span class=\"ic\" aria-hidden=\"true\">" + (it.s === "ok" ? "\u2713" : it.s === "bad" ? "\u2717" : "\u25CB") + "</span><span class=\"itxt\">" + esc(it.t) + "</span></div>";
      }
      h += "</div>";
    }
    if (g.extra) h += "<div class=\"item-row bad\"><span class=\"ic\" aria-hidden=\"true\">\u2717</span><span class=\"itxt\">" + esc(g.extra) + "</span></div>";
    if (ex.type === "terminal") {
      h += "<div class=\"canon\"><div class=\"artefact\"><div class=\"artefact-label\">Canonical command</div><div class=\"artefact-body\"><pre class=\"code\">" + codeHi(ex.canonical) + "</pre></div></div>";
      h += "<div class=\"item-rows\">";
      for (var p = 0; p < ex.parts.length; p++) h += "<div class=\"item-row ok\"><span class=\"ic\" aria-hidden=\"true\">\u2699</span><span class=\"itxt\"><b>" + esc(ex.parts[p].label) + "</b> \u2014 " + esc(ex.parts[p].desc) + "</span></div>";
      h += "</div></div>";
    }
    if (ex.persp) {
      h += "<div class=\"persp\"><div class=\"pcard red\"><div class=\"ph\">\u25B2 ATTACKER PERSPECTIVE</div>" + esc(ex.persp.red) + "</div>" +
        "<div class=\"pcard blue\"><div class=\"ph\">\u25CF DEFENDER PERSPECTIVE</div>" + esc(ex.persp.blue) + "</div></div>";
    }
    if (ex.study) h += "<div class=\"study\">\u25C6 What to study: " + esc(ex.study) + "</div>";
    h += "</div></div>";
    host.innerHTML = h;
  }
  function doNext(ex) {
    var st = EX_STATE[ex.id];
    autoPauseEnd();
    if (st.inReview) { openReview(); return; }
    if (S.idx === S.order.length - 1) {
      var hasOpen = false;
      for (var i = 0; i < S.skipped.length; i++) { if (!S.answers[S.skipped[i]]) { hasOpen = true; break; } }
      if (hasOpen) { openReview(); return; }
      setTimerState("ENDED");
      showResults();
      return;
    }
    advance();
  }
  function skip() {
    var ex = curEx();
    S.skipped.push(ex.id);
    advance();
  }
  function hint() {
    var ex = curEx();
    var st = EX_STATE[ex.id];
    if (st.hinted || st.checked) return;
    st.hinted = true;
    mountHint(ex);
    $("btnHint").disabled = true;
  }
  function mountHint(ex) {
    var st = EX_STATE[ex.id];
    if (!st || !st.hinted || st.checked) return;
    if ($("hintBox")) return;
    var box = document.createElement("div");
    box.className = "hintbox";
    box.id = "hintBox";
    box.innerHTML = "<div class=\"hint-h\"><span aria-hidden=\"true\">\u25CB</span> HINT (\u221210% of this exercise's credit)</div>" + esc(ex.hint);
    var host = $("ansArea");
    if (host) host.insertBefore(box, host.firstChild);
  }
  function manualPause() {
    if (S.timer.state === "ENDED") return;
    if (S.timer.state === "PAUSED_MANUAL") return;
    S.timer._manualPrev = S.timer.state;
    if (S.timer.state === "PAUSED_AUTO_CHECK" && S.timer._autoStart) { S.timer.autoPauseSec += Math.round((Date.now() - S.timer._autoStart) / 1000); S.timer._autoStart = null; }
    S.timer.state = "PAUSED_MANUAL";
    S.timer._manualStart = Date.now();
    setTimerState("PAUSED_MANUAL");
    var m = $("pausemask");
    m.classList.remove("hidden");
    m.innerHTML = "<div class=\"pi\" aria-hidden=\"true\">\u23F8</div><div class=\"pt\">\u23F8 PAUSED \u2014 manual (press Resume)</div><div class=\"ps\">The timer is stopped and the exercise is hidden so you cannot read it while on break. Press Resume to continue where you were.</div><button class=\"btn primary\" id=\"btnResume\" type=\"button\">\u25B6 Resume</button>";
    $("btnResume").addEventListener("click", resumeManual);
  }
  function resumeManual() {
    var m = $("pausemask");
    m.classList.add("hidden");
    if (S.timer._manualStart) { S.timer.manualPauseSec += Math.round((Date.now() - S.timer._manualStart) / 1000); S.timer._manualStart = null; }
    if (S.timer._manualPrev === "PAUSED_AUTO_CHECK") {
      S.timer.state = "PAUSED_AUTO_CHECK";
      S.timer._autoStart = Date.now();
      setTimerState("PAUSED_AUTO_CHECK");
    } else {
      S.timer.state = "RUNNING";
      setTimerState("RUNNING");
    }
  }

  /* ---------- review skipped ---------- */
  function openReview() {
    S.phase = "review";
    autoPauseEnd();
    setTimerState("RUNNING");
    $("exam").classList.add("hidden");
    $("review").classList.remove("hidden");
    var timeUp = S.timer.remaining <= 0 || S.timer.state === "ENDED";
    var h = "<div class=\"card\"><h2 style=\"margin:0 0 6px\"><span aria-hidden=\"true\">\u26A0</span> Review skipped exercises</h2>";
    h += "<p style=\"color:var(--text-secondary)\">These exercises were skipped. You can go back and answer as many times as you want until the timer ends. If you submit now, skipped-and-never-answered exercises are excluded from the score.</p><div class=\"rev-list\">";
    for (var i = 0; i < S.skipped.length; i++) {
      var e = null;
      for (var k = 0; k < S.order.length; k++) { if (DATA.exercises[S.order[k]].id === S.skipped[i]) { e = DATA.exercises[S.order[k]]; break; } }
      var answered = S.answers[e.id] ? true : false;
      h += "<div class=\"rev-row\"><span class=\"tag\">\u26A0 " + (answered ? "Answered" : "Skipped") + "</span><span style=\"flex:1\">" + esc(e.summary) + "</span>" +
        "<button class=\"btn green\" data-review=\"" + S.skipped[i] + "\" type=\"button\"" + (timeUp && !answered ? " disabled" : "") + ">Answer</button></div>";
    }
    h += "</div><div class=\"startrow\"><button class=\"btn primary\" id=\"btnFinalSubmit\" type=\"button\">\u2713 Final Submit \u2192 results</button></div></div>";
    $("review").innerHTML = h;
    $("review").querySelectorAll("button[data-review]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-review");
        var idx = -1;
        for (var k2 = 0; k2 < S.order.length; k2++) { if (DATA.exercises[S.order[k2]].id === id) { idx = k2; break; } }
        S.idx = idx;
        S.phase = "exam";
        $("review").classList.add("hidden");
        $("exam").classList.remove("hidden");
        var ex2 = DATA.exercises[S.order[idx]];
        var already = S.answers[ex2.id] ? true : false;
        S.answers[ex2.id] = undefined;
        S.answeredCount = 0; S.creditSum = 0;
        for (var kk = 0; kk < S.order.length; kk++) {
          var ee = DATA.exercises[S.order[kk]];
          if (S.answers[ee.id]) { S.answeredCount += 1; S.creditSum += S.answers[ee.id].credit; }
        }
        var st = EX_STATE[ex2.id];
        if (already) {
          st.checked = false; delete st.g; delete st.finalCredit;
          if (st.termTimer) { clearInterval(st.termTimer); st.termTimer = null; }
          if (ex2.timeLimit) st.termLeft = ex2.timeLimit;
        }
        renderExercise(ex2, true);
        updateHeader();
        window.scrollTo(0, 0);
      });
    });
    $("btnFinalSubmit").addEventListener("click", function () {
      setTimerState("ENDED");
      showResults();
    });
  }

  /* ---------- results ---------- */
  function showResults() {
    S.phase = "results";
    if (S.timer._manualStart) { S.timer.manualPauseSec += Math.round((Date.now() - S.timer._manualStart) / 1000); S.timer._manualStart = null; }
    if (S.timer._autoStart) { S.timer.autoPauseSec += Math.round((Date.now() - S.timer._autoStart) / 1000); S.timer._autoStart = null; }
    $("exam").classList.add("hidden");
    $("review").classList.add("hidden");
    $("pausemask").classList.add("hidden");
    var answered = [], full = 0, part = 0, zero = 0, partSum = 0;
    for (var k = 0; k < S.order.length; k++) {
      var ex = DATA.exercises[S.order[k]];
      var a = S.answers[ex.id];
      if (a) {
        answered.push(a);
        if (a.credit >= 1) full++;
        else if (a.credit > 0) { part++; partSum += a.credit; }
        else zero++;
      }
    }
    var excluded = S.order.length - answered.length;
    var percent = answered.length > 0 ? Math.round((S.creditSum / answered.length) * 100) : 0;
    var passed = percent >= META.passMark;
    var avgPart = part > 0 ? Math.round((partSum / part) * 100) / 100 : 0;
    var h = "";
    h += "<div class=\"card\" style=\"text-align:center\"><div class=\"bigpct\">" + percent + "%</div>";
    h += "<div style=\"color:var(--text-secondary)\">Total score <b style=\"color:var(--text-primary)\">" + r1(S.creditSum) + " / " + answered.length + "</b> (answered exercises only \u2014 skipped-and-never-answered are excluded) \u2014 pass mark " + META.passMark + "%</div></div>";
    h += "<div class=\"verdict " + (passed ? "pass" : "fail") + "\"><span aria-hidden=\"true\">" + (passed ? "\u2713" : "\u2717") + "</span> " + (passed ? "\u2713 PASS \u2014 certification-style result: well done." : "\u2717 FAIL \u2014 you must retake this exam to reach " + META.passMark + "%.") + "</div>";
    h += "<div class=\"res-grid\">";
    h += "<div class=\"res-cell ok\"><div class=\"rc-h\">\u2713 Fully correct</div><div class=\"rc-v\">" + full + "</div></div>";
    h += "<div class=\"res-cell part\"><div class=\"rc-h\">\u2713 Partially correct (avg " + avgPart + ")</div><div class=\"rc-v\">" + part + "</div></div>";
    h += "<div class=\"res-cell bad\"><div class=\"rc-h\">\u2717 Fully incorrect</div><div class=\"rc-v\">" + zero + "</div></div>";
    h += "<div class=\"res-cell skip\"><div class=\"rc-h\">\u26A0 Skipped \u2014 excluded</div><div class=\"rc-v\">" + excluded + "</div></div>";
    h += "</div>";
    h += "<div class=\"card\"><div class=\"pauselog\">\u23F8 Time paused manually: <b>" + fmtDur(S.timer.manualPauseSec) + "</b> \u2014 \u23F8 Time paused reviewing feedback: <b>" + fmtDur(S.timer.autoPauseSec) + "</b> \u2014 time remaining at submit: <b>" + fmtTime(S.timer.remaining) + "</b></div></div>";
    h += "<div class=\"card\"><div style=\"font-weight:700;margin-bottom:6px\">Per-exercise results</div><div class=\"item-rows\">";
    for (var k2 = 0; k2 < S.order.length; k2++) {
      var ex2 = DATA.exercises[S.order[k2]];
      var a2 = S.answers[ex2.id];
      if (!a2) h += "<div class=\"item-row miss\"><span class=\"ic\" aria-hidden=\"true\">\u26A0</span><span class=\"itxt\">\u26A0 Skipped \u2014 excluded: " + esc(ex2.summary) + "</span></div>";
      else {
        var cls2 = a2.credit >= 1 ? "ok" : (a2.credit > 0 ? "part" : "bad");
        var ic2 = a2.credit >= 1 ? "\u2713" : (a2.credit > 0 ? "\u2713" : "\u2717");
        var col = a2.credit >= 1 ? "var(--state-correct)" : (a2.credit > 0 ? "var(--state-partial)" : "var(--state-incorrect)");
        h += "<div class=\"item-row " + cls2 + "\"><span class=\"ic\" aria-hidden=\"true\" style=\"color:" + col + "\">" + ic2 + "</span><span class=\"itxt\">credit " + (Math.round(a2.credit * 100) / 100) + " \u2014 " + esc(ex2.summary) + "</span></div>";
      }
    }
    h += "</div></div>";
    h += "<div class=\"startrow\" style=\"justify-content:center\"><button class=\"startbtn\" id=\"btnRetake\" type=\"button\">\u21BA Retake Exam</button></div>";
    $("results").innerHTML = h;
    $("results").classList.remove("hidden");
    reportScore(S.creditSum, answered.length, percent, passed);
    $("btnRetake").addEventListener("click", function () {
      S.attempt += 1;
      startExam();
    });
  }
  function reportScore(creditSum, answeredCount, percent, passed) {
    if (S.reportedThisAttempt) return;
    S.reportedThisAttempt = true;
    try {
      parent.postMessage({
        type: "CYBERPULSE_SCORE",
        topicId: META.topicId,
        batch: META.batch,
        score: Math.round(creditSum),
        total: answeredCount,
        percent: percent,
        passed: passed
      }, location.origin);
    } catch (e) { /* opened directly - nothing to report to */ }
  }

  /* ---------- handshake & init ---------- */
  window.addEventListener("message", function (event) {
    if (!event.data) return;
    if (event.data.type !== "CYBERPULSE_INIT" && event.data.type !== "CYBERMASTERY_INIT") return;
    /* consumed: username, country, locale, topicId, batch. theme is always dark; the file is dark-only, no toggle. */
    S.handshake = { username: event.data.username || "", country: event.data.country || "", locale: event.data.locale || "en" };
  });
  function init() {
    var metaEl = document.getElementById("cm-exercise-meta");
    var dataEl = document.getElementById("cm-exam-data");
    META = JSON.parse(metaEl.textContent);
    DATA = JSON.parse(dataEl.textContent);
    S = { phase: "intro", attempt: 1, reportedThisAttempt: false, order: [], creditSum: 0, answeredCount: 0, answers: {}, skipped: [], timer: { remaining: META.timerBudget, state: "RUNNING", manualPauseSec: 0, autoPauseSec: 0 } };
    document.title = META.objectId + " \u2014 " + META.severity + " practice exam";
    renderIntro();
    startTicks();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
</body>
</html>
