<script>
window.EXAM_DATA = {"topicId":"t1601.002","batch":4,"objectID":"T1601.002 — Downgrade System Image (Sub-Technique of T1601 — Modify System Image)","passMark":70,"timerSeconds":4800,"estimatedMinutes":80,"sev":{"key":"extremely-hard","label":"EXTREMELY HARD"},"intro":{"title":"T1601.002 — EXTREMELY HARD practice exam","object":"T1601.002 — Downgrade System Image · Sub-Technique of T1601 — Modify System Image · Tactic: Defense Impairment · Platform: Network Devices · ATT&CK Enterprise, v2.0","learn":"<p>This is the senior level. The cases here chain three or more concepts, hand you conflicting signals on purpose, and expect you to say <b>which signal wins and why<\/b> — sometimes the senior answer is “do not touch the device yet”. Imagine the CISO needs a decision in ten minutes and every option costs something real.<\/p><p>The object is unchanged: <b>T1601.002, Downgrade System Image<\/b>, a Sub-Technique of T1601 (Modify System Image), tactic Defense Impairment, platform Network Devices — a privileged actor installs an older device OS to weaken security, and the change lands at the next reload. What this level adds is the world around the technique: rewritten baselines, holes in audit trails, time drift, shared service credentials, staged lab images on the wrong device, and the difference between what a comparison <i>proves<\/i> and what it <i>suggests<\/i>.<\/p><p>You will work the senior tasks end to end. <b>Certify only what artefacts support<\/b> for a CISO who reads exactly what you write. <b>Resolve contradicting telemetry<\/b> — a four-minute accounting gap that is either a collector fault or audit tampering, decided by window correlation. <b>Choose containment scope<\/b> when one device is proven and one is merely suspicious. <b>Rank response actions<\/b> when evidence, uptime and credentials all pull at once. <b>Reject the textbook move<\/b> when its assumption — a clean recovery source — is unproven. <b>Calibrate attribution language<\/b> so a peer CTI reviewer cannot break your adjectives. And under a four-minute terminal timer, pick the one command that <b>cannot make anything worse<\/b>.<\/p><p>Everything rests on the same frame as the lower levels — the AN1570 chain (transfer → boot-variable → reload → validation), checksums over version strings, validation independent of the device CLI, and the mitigation set M1045/M1046/M1043/M1032/M1027/M1026 — now under pressure, with incomplete information and no perfect options.<\/p>","themes":[{"name":"Chain under pressure","items":["Transfer → boot-var → reload → validation","Out-of-band, vendor-anchored validation","Audit-gap tampering vs collector fault","CLI output as untrusted input"]},{"name":"Conflicting signals","items":["Checksum vs version string vs ticket scope","Window correlation resolves contradictions","Noise separation (VPN bursts, NTP drift)","Equality is not innocence (baseline match)"]},{"name":"Senior response judgement","items":["Proven vs suspicious — containment scope","Evidence before state change","Validated recovery sources (repo checks)","Cost acceptance and compensating monitoring"]},{"name":"Reporting & language","items":["Certify only what artefacts show","Confidence calibration (high/medium/low)","Assessment adjectives that survive review","Scope statements for executives"]}],"how":"<p>This is a <b>certification-style practice exam<\/b>. You need <b>70%<\/b> to pass. Every exercise keeps the three-block layout: <b>SCENARIO<\/b> (blue, labelled artefact sub-panels, filter boxes on logs), <b>QUESTION<\/b> (amber), <b>YOUR ANSWER<\/b> (green). Expect several defensible options per case — only one is correct <i>in this world<\/i>, and the feedback explains the world.<\/p><p><b>Exercise types in this file:<\/b> evidence-certification multi-selects, a pressure terminal with a <b>reduced per-exercise timer (4:00, announced on screen — it pauses with the exam and auto-checks at zero)<\/b>, four-step branching containment decisions, a five-alert queue with a built-in contradiction, confidence matching, tuning and report fill-ins, a playbook flaw hunt, a supply-chain dual perspective, response ranking, chain-stage matching, and an epistemic-limits selection.<\/p><p><b>Timer:<\/b> the countdown runs while you work. <b>Manual Pause<\/b> hides the exercise for a break and stops the clock. <b>Check auto-pause<\/b> stops it the instant you press Check — unlimited feedback time — and resumes only on Next. The reduced terminal timer obeys both pauses. Skip and Hint never stop the clock.<\/p><p><b>Scoring:<\/b> multi-item exercises use partial credit — credit = max(0, (H − W) / N); wrong picks subtract, selecting everything scores zero, and one hint per exercise costs 10% of that exercise's credit. <b>Skipping:<\/b> skipped exercises pool up for review while the timer runs; anything unanswered at submit is excluded from the score. Press Start when ready — and read every artefact twice.<\/p>","types":[]},"exercises":[{"id":"x01","type":"mcs","summary":"Case file — supported conclusions only (3 of 8)","scen":{"lead":"Halvard Transit Authority, morning after. Seven artefacts landed in the case file overnight, including realistic noise and one stale record. Senior rule: a conclusion is only reportable if the artefacts show it. The CISO reads exactly what you certify.","arts":[{"label":"ARTEFACT 1 — TACACS+ accounting (gw-rtr-01)","body":"<b class=\"t\">22:04:55<\/b> user=svc-hvnet priv=15 login from oob-mgmt-01\n<b class=\"t\">22:12:30<\/b> user=svc-hvnet priv=15 cmd=copy scp://10[.]90[.]5[.]7/gw-hv-legacy.bin flash:\n<b class=\"t\">22:47:02<\/b> (no accounting entry — gap 22:41-22:45)\n<b class=\"t\">22:51:19<\/b> user=svc-hvnet priv=15 cmd=reload"},{"label":"ARTEFACT 2 — config diff (out-of-band collector)","body":"+ boot system flash:gw-hv-legacy.bin\n- boot system flash:gw-hv-prod-2026.bin"},{"label":"ARTEFACT 3 — post-reboot, out-of-band console","body":"System image: flash:gw-hv-legacy.bin — reports version 15.4(2)T (2019)"},{"label":"ARTEFACT 4 — integrity export","body":"flash MD5: 41be a90d 3371 c0a2\nvendor bulletin MD5 for 15.4(2)T: d0e1 77ba 90cc 41f5 → <b class=\"s\">MISMATCH<\/b>\ninternal baseline MD5 (updated 22:44 last night): 41be a90d 3371 c0a2 → match"},{"label":"ARTEFACT 5 — CMDB extract","body":"baseline record gw-rtr-01 changed 22:44 by svc-hvnet\nCMDB freshness: last full audit 14 months ago (stale)"},{"label":"ARTEFACT 6 — noise: VPN gateway log","body":"21:58 seven failed VPN logons from 10[.]90[.]9[.]200 (guest range)\n21:59-22:03 no further activity"},{"label":"ARTEFACT 7 — NTP note","body":"oob-mgmt-01 clock drifts +90s vs GPS source (documented, DEV-102)"}]},"question":"Select the THREE conclusions the artefacts fully support.","hint":"Chain across independent sources is supportable; so is the baseline being rewritten by the same account, and the vendor-hash mismatch. Identity, exfiltration and fleet scope have no artefacts.","correct":"(1) gw-rtr-01 was downgraded and rebooted into an older image (chain across TACACS, config diff, console, reload). (2) the internal baseline was rewritten in the same window by the same privileged account (CMDB + integrity export). (3) the booted image fails the vendor bulletin hash, so it is not the vendor's 15.4(2)T — consistent with a rebuilt image (T1601.001 + T1601.002 combination).","expl":"The chain (transfer → boot-var → reload → old version string) is visible across four independent sources, so the downgrade itself is certified. The baseline update at 22:44 by the same svc-hvnet account, between the transfer and the reload, shows the reference data was bent to fit the tampered image — that is why the vendor-hash comparison is the one that counts. The mismatch against the vendor bulletin means the bytes are not the vendor's release: a rebuilt or patched image, the signature move of pairing T1601.001 with the downgrade. Nothing in the file identifies a person (shared service account), shows data leaving, or implicates the VPN noise — different system, different time, no overlap — and the +90s drift is documented and cannot hide a 40-minute operation. What to study: certifying only what artefacts show.","items":[{"label":"C1: downgrade + reboot chain complete","note":"Supported: transfer (22:12), boot-var diff, reload (22:51), old version string out-of-band."},{"label":"C2: internal baseline rewritten in-window","note":"Supported: CMDB shows 22:44 change by svc-hvnet; export matches flash, not vendor."},{"label":"C3: image fails vendor hash","note":"Supported: vendor bulletin MD5 differs from flash MD5 — rebuilt image consistent with T1601.001."},{"label":"C4: a named insider did it","note":"Not supported: svc-hvnet is a shared account; no artefact binds a person."},{"label":"C5: data was exfiltrated","note":"Not supported: no outbound transfer artefact exists."},{"label":"C6: the whole fleet is compromised","note":"Not supported: evidence covers gw-rtr-01 and the mgmt path only."},{"label":"C7: VPN failures are part of this","note":"Not supported: guest-range noise, different system, no overlap with the chain."},{"label":"C8: NTP drift proves clock tampering","note":"Not supported: +90s documented drift cannot mask a 40-minute window."}],"data":{"options":["C1 chain complete on gw-rtr-01","C2 baseline rewritten in-window by same account","C3 image fails vendor bulletin hash","C4 a named insider performed the change","C5 data was exfiltrated to an external host","C6 the entire fleet is compromised","C7 the VPN failure burst is part of the attack","C8 NTP drift proves clock tampering"],"correct":[0,1,2]}},{"id":"x02","type":"term","summary":"Terminal under pressure — preserve the evidence (reduced timer)","scen":{"lead":"Pressure terminal: the tool is not named. gw-rtr-01 may hold a tampered image. The border must stay up; the CISO needs a defensible answer in ten minutes; the operator may still be on the box. Your command must export the device's current configuration to the out-of-band collector WITHOUT changing device state — one wrong verb and the volatile picture is gone.","arts":[{"label":"ARTEFACT — environment & constraints","body":"Console: gw-rtr-01, privilege 15.\nOut-of-band TFTP collector (defanged): 10[.]90[.]5[.]7\nConstraints: keep the border up; change nothing on the device;\nthe configuration must leave the device for safekeeping."}]},"question":"Type ONE command that copies the running configuration to the out-of-band TFTP collector.","hint":"The IOS copy command takes a source and a destination. The source is the live configuration; the destination is the TFTP collector. Commands that write to memory, erase storage or restart are evidence destruction.","correct":"<b>copy running-config tftp:<\/b> — exports the live configuration to the out-of-band collector; read-only for the device itself, so it preserves evidence without touching state.","expl":"<b>copy running-config tftp:<\/b> is the safe capture: the device pushes its live configuration out to the collector — nothing on the device is modified, the border stays up, and the evidence now lives outside the actor's reach. Compare that with the near-misses: <span class=\"mono\">write erase<\/span> or <span class=\"mono\">erase flash:<\/span> destroy the artefacts, and <span class=\"mono\">reload<\/span> drops the border mid-decision — under time pressure the senior skill is choosing the command that cannot make anything worse. Once captured, validate the image itself against the <b>vendor bulletin<\/b>, not the internal baseline (which this actor has shown they can rewrite). What to study: evidence-safe command selection under pressure.","items":[{"label":"Copy command chosen","note":"copy is the export verb; it reads state and ships it out."},{"label":"Source is the running configuration","note":"running-config is the live state you must preserve."},{"label":"Destination is the TFTP collector","note":"tftp: sends the evidence to the out-of-band host."},{"label":"No destructive or state-changing command","note":"erase/format/write/reload would destroy evidence or drop the border."}],"perEx":240,"data":{"mode":"free","banner":"gw-rtr-01 con0 — privilege 15 — PRESSURE MODE: border must stay up — reduced timer active","prompt":"gw-rtr-01#","runOut":"Address or name of remote host []? 10[.]90[.]5[.]7\nDestination filename [gw-rtr-01-confg]? \nWriting running-config ... [OK]","elements":[{"kind":"need","re":"\\bcopy\\b","label":"Copy command chosen"},{"kind":"need","re":"running-config|running\\s+config","label":"Source is the running configuration"},{"kind":"need","re":"\\btftp\\s*:?\\b","label":"Destination is the TFTP collector"},{"kind":"forbid","re":"\\b(erase|format|write|reload)\\b","label":"No destructive or state-changing command"}],"dangerRe":"\\b(erase|format|write\\s+(erase|mem)|reload)\\b","dangerNote":"That command would have destroyed evidence or dropped the border under CISO pressure — exactly the failure mode the scenario is built around. Evidence-out commands only, always.","canonical":"copy running-config tftp:\n  Address or name of remote host []? 10[.]90[.]5[.]7\n  Destination filename [gw-rtr-01-confg]? \n  Writing running-config ... [OK]"}},{"id":"x03","type":"flow","summary":"Containment scope — four decisions with costs","scen":{"lead":"Branching scenario, four decisions, every path costs something. Confirmed: gw-rtr-01 boots a tampered, downgraded image; the internal baseline was rewritten. aggr-sw-03 shares the svc-hvnet credential but shows a clean checksum. The fleet is 40 devices. The CISO wants scope, containment and a plan.","arts":[{"label":"ARTEFACT — decision constraints","body":"gw-rtr-01: border router, tampered image confirmed.\naggr-sw-03: same credential, clean checksum, no config diff.\nTACACS secret: shared by 9 admin accounts.\nCentral image repository: NOT yet validated against vendor hashes.\nBusiness peak: 09:00-17:00."}]},"question":"Make the four containment decisions.","hint":"Contain what is proven, preserve what is suspected, and never push an unvalidated 'cure' to 40 devices.","correct":"1) Contain gw-rtr-01 (management isolation + monitoring); do not mass-touch the fleet — one shared credential is suspicion, not proof for 40 boxes. 2) Rotate the shared TACACS secret now, out-of-band, accepting brief auth churn. 3) Do NOT reimage from the central repo yet — validate every image against vendor hashes first. 4) Schedule gw-rtr-01 recovery in the approved window with compensating monitoring, and escalate the scope statement to the IR lead.","expl":"Decision 1: isolation follows evidence — gw-rtr-01 is proven, aggr-sw-03 is only <i>shared-credential suspicious<\/i>, so it gets preservation and monitoring, not a 03:00 wipe. Decision 2 accepts a real cost deliberately: rotating a shared secret mid-day causes brief authentication churn across nine admins, and the alternative — leaving a possibly stolen secret live — costs more. Decision 3 is the best-practice trap: 'reimage everything from the central repo' is textbook response, but this repo is unvalidated and the baseline infrastructure is already proven bendable — an unvalidated cure could reinstall the disease on 40 devices. Decision 4 sequences the fix into the approved window under compensating monitoring and hands the CISO a scope statement: one confirmed device, one suspected credential, one contaminated baseline. What to study: proportionate containment and validated recovery sources.","items":[{"label":"D1 — containment scope","note":"Isolate the proven device; preserve and monitor the suspicious one. No fleet-wide action on suspicion alone."},{"label":"D2 — the shared secret","note":"Rotate now, out-of-band; accept the churn. A live stolen secret outweighs convenience."},{"label":"D3 — the recovery source","note":"Validate repository images against vendor hashes BEFORE any reimage; unvalidated cures risk reinfection."},{"label":"D4 — recovery timing & escalation","note":"Approved window with compensating monitoring; escalate the scope statement to the IR lead."}],"data":{"steps":[{"scen":"<b>STEP 1 OF 4<\/b> — Confirmed: gw-rtr-01 tampered. aggr-sw-03 shares the credential but is clean so far. The fleet is 40 devices.","question":"Containment scope?","opts":["Isolate gw-rtr-01 management plane; preserve & monitor aggr-sw-03; no fleet action yet","Reimage all 40 devices immediately — assume the worst","Touch nothing until every device is checked"],"correct":0},{"scen":"<b>STEP 2 OF 4<\/b> — The TACACS secret is shared by nine admin accounts and svc-hvnet is in attacker hands.","question":"Rotate the secret now (brief auth churn) or after hours?","opts":["Rotate now, out-of-band, accepting the churn","After hours — the secret can wait twelve hours","Never — rotation would break the monitoring integrations"],"correct":0},{"scen":"<b>STEP 3 OF 4<\/b> — Someone proposes the textbook move: reimage everything from the central repository tonight.","question":"Approve the fleet reimage from the central repo?","opts":["No — validate every repository image against vendor hashes first","Yes — a clean source by definition","Yes, but only the devices with alerts"],"correct":0},{"scen":"<b>STEP 4 OF 4<\/b> — Recovery for gw-rtr-01: business peak until 17:00, change window 22:00.","question":"Recovery timing and next governance step?","opts":["Approved window with compensating monitoring; escalate scope statement to the IR lead","Immediate reload during peak — security first","Wait for the quarterly change freeze to end"],"correct":0}]}},{"id":"x04","type":"flow","summary":"Contradictory alerts — five-decision queue","scen":{"lead":"Simulation: five alerts, one duty senior. Two of them contradict each other, and resolving the contradiction IS the exercise. Choose the handling for each alert.","arts":[{"label":"ARTEFACT — the queue","body":"AL-1 22:12 scp transfer gw-hv-legacy.bin → gw-rtr-01 (outside approved windows)\nAL-2 TACACS accounting GAP 22:41-22:45 on oob-mgmt-01 (collector-fault hypothesis attached)\nAL-3 gw-rtr-01 config change 22:47 — captured out-of-band, but NO accounting entry exists\nAL-4 failed VPN logon burst 21:58 from 10[.]90[.]9[.]200 (guest range)\nAL-5 nightly baseline job completed green 23:59"}]},"question":"Handle each alert correctly.","hint":"AL-2 and AL-3 are the contradiction: is the gap a collector fault, or is the audit trail being bent? The exact window match decides it.","correct":"AL-3 first: a config change with no accounting entry, exactly inside the AL-2 gap — the gap is not a collector fault, it is audit-path tampering; preserve oob-mgmt-01 and pull its logs. AL-2: correlate with AL-3 (same window) and open the collector-fault test. AL-1: investigate as the chain start. AL-4: route to the IAM queue as a separate incident. AL-5: close as routine — and note the bitter irony that the green job validated the rewritten baseline.","expl":"The contradiction: AL-2's attached hypothesis says 'collector fault', which would downgrade everything to a monitoring ticket. But AL-3 shows a real config change captured out-of-band inside exactly that window with no accounting entry — collectors drop entries at random, not precisely around one hostile change. The window match resolves it: deliberate audit-path tampering, so AL-3 is worked first and oob-mgmt-01 becomes evidence. AL-1 is the visible chain start — investigate. AL-4 is real but unrelated (guest range, different system, no overlap with the chain) — route it, do not let it eat the morning. AL-5 closed green is the irony of the case: the nightly job compared against the rewritten baseline, so 'green' now proves the control was bent. What to study: resolving contradicting telemetry with window correlation.","items":[{"label":"AL-3 — config change, no accounting entry","note":"Work first: out-of-band capture inside the gap window = audit tampering, not collector fault."},{"label":"AL-2 — the accounting gap","note":"Correlate with AL-3 (exact window match) and test the collector; treat as deliberate until proven otherwise."},{"label":"AL-1 — the transfer","note":"Investigate: first visible step of the chain, outside all approved windows."},{"label":"AL-4 — VPN noise","note":"Route to IAM as a separate incident; no overlap with the chain."},{"label":"AL-5 — green baseline job","note":"Close as routine — and record that it validated a rewritten reference."}],"data":{"steps":[{"scen":"<b>ALERT AL-3 of 5<\/b> — config change captured out-of-band at 22:47; no TACACS accounting entry; sits inside the AL-2 gap.","question":"Priority and action?","opts":["Highest — preserve oob-mgmt-01, treat the gap as deliberate audit tampering","Low — wait for the collector team's weekly report","Close — out-of-band captures are unreliable"],"correct":0},{"scen":"<b>ALERT AL-2 of 5<\/b> — accounting gap 22:41-22:45 on oob-mgmt-01; ticket template says 'collector fault'.","question":"How do you treat the gap?","opts":["Correlate with AL-3's exact window; test the collector but treat as deliberate until proven","Accept the template — gaps are always collector faults","Ignore — four minutes means nothing"],"correct":0},{"scen":"<b>ALERT AL-1 of 5<\/b> — scp transfer of gw-hv-legacy.bin to gw-rtr-01 at 22:12, outside every approved window.","question":"Handling?","opts":["Investigate — first visible chain step","Close — transfers happen nightly","Close — the baseline job was green"],"correct":0},{"scen":"<b>ALERT AL-4 of 5<\/b> — failed VPN logon burst at 21:58 from the guest range.","question":"Handling?","opts":["Route to the IAM queue as a separate incident — no overlap with the chain","Merge into the router case — all alerts are one incident","Ignore entirely — failed logons never matter"],"correct":0},{"scen":"<b>ALERT AL-5 of 5<\/b> — nightly baseline job reports green at 23:59.","question":"Handling?","opts":["Close as routine — but record that it validated the rewritten baseline","Escalate — green means the attack is spreading","Re-run — green results must always be re-run"],"correct":0}]}},{"id":"x05","type":"mc","summary":"Three signals disagree — which wins?","scen":{"lead":"gw-rtr-01 again, but a twist for the morning brief. Three signals are on the table and they point in different directions. The CISO needs ONE sentence: what do we do to the device right now?","arts":[{"label":"ARTEFACT 1 — version string (out-of-band)","body":"gw-rtr-01 reports version 15.4(2)T — OLD, flagged by the analytic"},{"label":"ARTEFACT 2 — integrity","body":"flash MD5 matches the approved baseline for image 'lab-staging-15.4(2)T'\n(the lab-staging baseline was legitimately approved in June for lab migration work)"},{"label":"ARTEFACT 3 — change records","body":"CHG-4471: migrate lab-sw-44 to 15.4(2)T staging image — approved\nDevice in CHG-4471: lab-sw-44. Device observed: gw-rtr-01 (production border).\nNo change record names gw-rtr-01 for any image work."}]},"question":"Which sentence goes to the CISO?","hint":"Checksum beats version string — but scope beats both: the ticket's device and the observed device are different. What action is defensible while that contradiction stands?","correct":"<b>\"We do not modify the device yet: the image is an approved lab-staging build, but it is running on a production border router with no covering change — treat as suspicious pending scope verification, and escalate now.\"<\/b>","expl":"Signal one (old version string) screams downgrade. Signal two (checksum matches an <i>approved<\/i> baseline) whispers mistake. Signal three decides: the approved work names a lab switch, not the border router — so the 'approved image' defence does not cover this device, and the old-version alarm stands unexplained. Under conflicting signals the defensible action is neither wipe (destroys evidence, maybe breaks a legitimate mistake) nor closure (an unexplained chain on the border), but preservation plus immediate scope escalation: who can move lab images, who touched gw-rtr-01, where did the baseline entry come from. What to study: which signal wins — and what ‘do nothing yet’ really means.","items":[{"label":"The CISO sentence","note":"No modification yet: suspicious pending scope verification — the ticket covers a different device, so the checksum match does not legitimise the border router."}],"data":{"options":["\"Close it — the checksum matches an approved image.\"","\"Wipe and reimage immediately — the old version string is proof.\"","\"No device changes yet: suspicious pending scope verification — escalate now.\"","\"Reboot it into the current approved image during lunch.\""],"correct":2}},{"id":"x06","type":"match","summary":"Attribution confidence — calibrated, not cinematic","scen":{"lead":"The CTI team must rate how strongly each evidence class supports 'deliberate coordinated actor' versus 'misconfiguration or fault'. Network-device incidents leave no malware artefacts, so confidence stays humble. Match each evidence class to its honest confidence.","arts":[{"label":"ARTEFACT — evidence classes","body":"E1 the same shared service credential drove the identical\n   transfer → boot-var → reload chain on two devices\nE2 a rebuilt image whose version string lies but whose bytes\n   fail the vendor hash (bytes cannot lie by accident)\nE3 one image transfer inside an approved window with a\n   matching ticket and a matching checksum\nE4 a 4-minute accounting gap on the shared management host\nE5 a documented +90s NTP drift on the same host"}]},"question":"Match each class to its confidence level.","hint":"Accident can move configs; accident does not forge bytes or repeat a three-step chain on two devices. Gaps and drift have mundane explanations.","correct":"E1 high, E2 high, E3 low, E4 medium, E5 low.","expl":"<b>E1<\/b>: the full chain repeated across two devices with one credential is coordination — a misconfiguration does not tour the fleet. <b>E2<\/b>: a version string that lies while the bytes fail the vendor hash requires deliberate rebuilding — no fault forges bytes. <b>E3<\/b>: ticket + window + checksum agree, so the honest rating is low — it looks like normal work. <b>E4<\/b>: a gap <i>correlated with a hostile change<\/i> (as in the queue) is medium — collector faults are real, so it supports but cannot alone convince. <b>E5<\/b>: documented drift is low — it explains a timestamp wobble, nothing more. Calibration note: on network devices, 'high confidence deliberate' comes from chains and forged bytes, never from a single log line. What to study: confidence language in CTI reporting.","items":[{"label":"E1 repeated chain, two devices, one credential","note":"High — coordination: the chain does not happen by accident twice."},{"label":"E2 version string lies, bytes fail vendor hash","note":"High — forged bytes and a lying self-report are deliberate acts."},{"label":"E3 transfer inside approved window, ticket matches","note":"Low — ticket, window and checksum all agree with legitimate work."},{"label":"E4 four-minute accounting gap","note":"Medium — collector faults are real; it supports only when correlated with a hostile change."},{"label":"E5 documented NTP drift","note":"Low — explains a wobble; carries no attack signal."}],"data":{"lefts":["E1 repeated chain, two devices, one credential","E2 lying version string, bytes fail vendor hash","E3 transfer in approved window, ticket matches","E4 four-minute accounting gap","E5 documented NTP drift"],"rights":["HIGH confidence — deliberate","MEDIUM confidence — deliberate","LOW confidence — deliberate","Explains an anomaly — not an attack signal"],"correct":[0,0,2,1,3]}},{"id":"x07","type":"mcs","summary":"Coverage gaps — pick the three fixes that matter","scen":{"lead":"Post-incident review maps Halvard's current controls against the technique frame. Select the THREE findings that name a real coverage gap for T1601.002 (and its enablers) AND a sound next control.","arts":[{"label":"ARTEFACT — current state","body":"Have: TACACS accounting to SIEM · nightly checksum vs internal baseline ·\nsyslog to SIEM · transfer allow-list · version-string analytic\nHave not: vendor-hash validation · boot signing · per-admin accounts"}]},"question":"Select the three valid gap-plus-control findings.","hint":"A valid finding names a hole the incident actually fell through, and a control from the mitigation frame — not a bigger haystack.","correct":"(1) No independent validation → add out-of-band comparison against vendor-published hashes. (2) Rebuilt images pass internal checks → deploy code signing / boot integrity where the platform supports it (M1045/M1046). (3) One shared secret for nine admins → per-admin identities, least privilege, MFA (M1026/M1032).","expl":"Gap one is the lesson of the whole case: every internal reference bent, so validation must anchor on <b>vendor-published hashes through an independent channel<\/b>. Gap two: the image was rebuilt, so only <b>cryptographic image integrity (M1045/M1046)<\/b> — where platforms support it — refuses forged bytes at install or boot. Gap three: nine admins behind one secret made attribution impossible and lateral reuse trivial — <b>per-admin identities with least privilege and MFA (M1026/M1032)<\/b> fix both. The other findings add noise or guard the wrong perimeter. What to study: closing the gaps an incident actually used.","items":[{"label":"F1 no vendor-hash validation → out-of-band vendor comparisons","note":"Anchors integrity where the actor cannot rewrite it."},{"label":"F2 rebuilt image passes → code signing / boot integrity (M1045/M1046)","note":"Refuses forged bytes at install or boot, where supported."},{"label":"F3 shared secret → per-admin identities, least privilege, MFA (M1026/M1032)","note":"Restores attribution and shrinks the credential blast radius."},{"label":"F4 email filtering gap → add attachment sandboxing","note":"Real control, wrong technique — no email was involved."},{"label":"F5 server vulnerability scanning gap → weekly scans","note":"Scans do not see a device boot chain; not a gap for this technique."},{"label":"F6 version-string alerting → add a second version collector","note":"Redundant: the condition exists; the incident broke the reference data, not the collector."},{"label":"F7 laptop backup gap → offsite backup rollout","note":"Unrelated to device image integrity."}],"data":{"options":["F1 vendor-hash validation out-of-band","F2 code signing / boot integrity where supported","F3 per-admin identities, least privilege, MFA","F4 email attachment sandboxing","F5 weekly server vulnerability scans","F6 second version-string collector","F7 offsite laptop backups"],"correct":[0,1,2]}},{"id":"x08","type":"order","summary":"Two-device campaign timeline (with a hole in it)","scen":{"lead":"Seven entries from two devices and the management host. One 4-minute hole is itself an entry. The VPN noise and NTP notes are NOT part of the ordering. Rebuild the sequence.","arts":[{"label":"ARTEFACT — entries (shuffled)","body":"• 22:47 boot-var change observed on gw-rtr-01 (no accounting entry)\n• 22:41-22:45 TACACS accounting gap on oob-mgmt-01\n• 22:54 old version string captured out-of-band on gw-rtr-01\n• 22:12 scp transfer of gw-hv-legacy.bin to gw-rtr-01\n• 22:04 svc-hvnet login to gw-rtr-01 from oob-mgmt-01\n• 22:58 svc-hvnet login to aggr-sw-03 from oob-mgmt-01\n• 22:51 reload of gw-rtr-01"}]},"question":"Order the seven entries by time.","hint":"Access, transfer, the silent four minutes, the change that left no trace in accounting, the reload, the proof, then the second device.","correct":"22:04 login → 22:12 transfer → 22:41-22:45 gap → 22:47 boot-var change (no accounting) → 22:51 reload → 22:54 version capture → 22:58 second device.","expl":"The sequence reads as an operation: credential use at 22:04, staging at 22:12, then the audit path goes dark for exactly the four minutes before a boot-variable change that produced no accounting entry — the hole and the change are one story. The reload at 22:51 activates it, the out-of-band capture at 22:54 proves it, and at 22:58 the same credential appears on aggr-sw-03 — scope expansion, which is why that device was preserved and monitored. The VPN burst and the NTP drift stay outside the timeline: no overlap, no signal. What to study: campaigns read across devices, and holes in telemetry are events too.","items":[{"label":"22:04 login to gw-rtr-01","note":"First: the shared credential opens the operation."},{"label":"22:12 image transfer","note":"Second: staging the older image into flash."},{"label":"22:41-22:45 accounting gap","note":"Third: the audit path goes dark just before the change."},{"label":"22:47 boot-var change, no accounting","note":"Fourth: the change the gap was for."},{"label":"22:51 reload","note":"Fifth: the tampered image takes over."},{"label":"22:54 version capture out-of-band","note":"Sixth: independent proof of what booted."},{"label":"22:58 login to aggr-sw-03","note":"Last: the same credential reaches for the second device."}],"data":{"entries":["22:04 svc-hvnet login to gw-rtr-01","22:12 scp transfer of gw-hv-legacy.bin","22:41-22:45 TACACS accounting gap","22:47 boot-var change (no accounting entry)","22:51 reload of gw-rtr-01","22:54 old version string captured","22:58 svc-hvnet login to aggr-sw-03"],"mode":"timeline"}},{"id":"x09","type":"fill","summary":"The CISO report — three precise blanks","scen":{"lead":"Your incident report goes to the CISO and the audit committee. Three blanks carry the whole argument of the validation section. Fill them exactly.","arts":[{"label":"ARTEFACT — report section 4.2 (draft)","body":"\"Because the actor held administrative rights, on-device CLI output was\ntreated as untrusted. OS version and image integrity were therefore\nvalidated through an ⟦0⟧ channel, against ⟦1⟧ hashes rather than\nthe internal baseline. Paging remains on the correlated ⟦2⟧ —\nnever on a single telemetry line.\""}]},"question":"Fill the three blanks.","hint":"Where does validation live when the device lies? Whose hash is the anchor? What pattern earns a page?","correct":"an <b>out-of-band<\/b> channel · against <b>vendor-published<\/b> hashes · paging on the correlated <b>chain<\/b> (transfer + boot-var + reload).","expl":"Each blank is a hard-won lesson from this incident. <b>Out-of-band<\/b>: the actor held admin rights, so anything the device prints — including its own version — is suspect; the console path and the OOB collector are the trusted observers. <b>Vendor-published<\/b>: the internal baseline was rewritten at 22:44 by the same account that staged the image, so only the vendor's hash is an anchor the actor did not touch. <b>Chain<\/b>: single lines all have innocent explanations (transfers happen, configs change, boxes reboot); the correlated sequence is what no accident produces. What to study: writing validation language that survives audit scrutiny.","items":[{"label":"Blank 1 — the channel","note":"Out-of-band: the trusted observer when the device itself is untrusted."},{"label":"Blank 2 — the anchor","note":"Vendor-published hashes: the reference the actor could not rewrite."},{"label":"Blank 3 — the page condition","note":"The correlated chain, because every single line has an innocent twin."}],"data":{"text":"Validated through an ⟦0⟧ channel, against ⟦1⟧ hashes rather than the internal baseline. Paging remains on the correlated ⟦2⟧.","blanks":[["out-of-band","out of band","independent","oob"],["vendor-published","vendor published","vendor","vendor bulletin"],["chain","correlated chain","signal chain"]],"bank":["chain","out-of-band","vendor-published"]}},{"id":"x10","type":"mc","summary":"The best practice that is wrong here","scen":{"lead":"Incident command proposes the standard playbook line: \"One confirmed tampered image → wipe and reimage the entire 40-device fleet tonight from the central repository.\" It is Friday 18:00. The repository has never been hash-validated. gw-rtr-01's actor demonstrated they can rewrite internal reference data.","arts":[{"label":"ARTEFACT — what the proposal assumes","body":"• the central repository is clean (never validated)\n• the baseline infrastructure is trustworthy (already bent once)\n• the fleet can absorb a mass reboot window (business peak was exempted\n  only for gw-rtr-01; no approval exists for 40 devices)"}]},"question":"What is the correct position on the proposal?","hint":"The proposal is textbook — against a textbook compromise. This actor bent reference data. Where does the textbook assumption break?","correct":"<b>Reject the fleet-wide wipe for now:<\/b> validate every repository image against vendor hashes first, keep gw-rtr-01's approved-window recovery, and schedule staged, validated reimaging by criticality — an unvalidated cure risks reinstalling the disease on 40 devices and destroying evidence everywhere at once.","expl":"'Wipe and reimage from a known-good source' is correct doctrine — when the source is known-good. Here the only image source is the central repository, never hash-validated, in an environment where the actor has demonstrated the ability to rewrite reference data; mass-reimaging from it could reinstall the tampered image on the whole fleet while erasing every device's evidence in the same night. The defensible position: validate the repository against vendor hashes first, recover gw-rtr-01 in its approved window, then reimage in stages by criticality from the now-validated source. Best practices are defaults, not decisions — this context flips this one. What to study: validating recovery sources before using them.","items":[{"label":"The position on the proposal","note":"Validate the repository first; staged recovery by criticality. A fleet-wide wipe from an unvalidated source risks fleet-wide reinfection and total evidence loss."}],"data":{"options":["Approve — fleet wipes are always the correct response","Reject for now — validate the repository against vendor hashes, recover gw-rtr-01 in its window, then stage reimaging by criticality","Approve — but only during business hours for faster rollback","Reject permanently — devices should never be reimaged"],"correct":1}},{"id":"x11","type":"selects","summary":"Find the flawed playbook step","scen":{"lead":"Senior spot-the-mistake. The response playbook survived review until you read step 3 carefully. Exactly one step is flawed. Choose it.","arts":[{"label":"ARTEFACT — playbook PB-114 ‘Device image tampering’","body":"Step 1: confirm via independent vendor-hash comparison\nStep 2: archive config, image hash, AAA and transfer logs\nStep 3: after recovery reload, accept the device's own version\n       string as final proof of integrity\nStep 4: reimage only from a repository validated against vendor hashes\nStep 5: close after two clean boot cycles pass step 1 again"}]},"question":"Which step is the flaw?","hint":"Which step lets the device grade its own homework — the exact mistake this incident was built to expose?","correct":"<b>Step 3 is the flaw:<\/b> the device's own version string must never be final proof — this actor demonstrated that a rebuilt image can lie about its version. Step 1's independent vendor-hash comparison is the only proof standard; step 5 correctly reuses it.","expl":"Step 3 reintroduces the exact trust that step 1 removes: a version string is generated by the code under suspicion, and the case file contains an image whose string lies while its bytes fail the vendor hash. A recovered device earns closure the same way a suspected one earns investigation — through independent, out-of-band, vendor-anchored verification (which is why step 5 is right and step 3 is wrong). Fix: replace step 3 with 're-run the step-1 comparison out-of-band; the device's own report is supporting context, never proof'. What to study: single standards of proof across a playbook.","items":[{"label":"The flawed step","note":"Step 3 — accepting the device's self-report as final proof contradicts the independent-validation standard the rest of the playbook enforces."}],"data":{"text":"The flawed step is {{0}}.","slots":[{"opts":["Step 3 — the device's own version string is not final proof","Step 2 — archiving evidence is overkill for one device","Step 4 — vendor validation of the repository is unnecessary"],"correct":0}]}},{"id":"x12","type":"flow","summary":"Dual perspective — after the vendor-hash control lands","scen":{"lead":"Dual-perspective finale, two steps. Halvard deployed everything: out-of-band vendor-hash validation, boot signing where supported, hardened vault, chain-based paging. STEP 1 is red, STEP 2 is blue. Both perspectives must name the surviving asset.","arts":[{"label":"ARTEFACT — the end state","body":"• Devices: boot-signature checks active (where supported)\n• Validation: out-of-band comparison against vendor-published hashes\n• Vault: hardened, MFA, change-logged\n• Paging: chain-correlated"}]},"question":"Red, then blue.","hint":"Red: every on-device path is closed, so what input still flows in from outside the fleet? Blue: what property of the vendor anchor decides the contest?","correct":"Red: the viable path moves upstream — poison the update channel so the 'vendor' image and its hash arrive already paired (supply-chain style); nothing on the fleet checks the vendor's signature of the bulletin itself. Blue: pinned, procurement-time copies of vendor hashes — an anchor captured before the adversary's access — break the poisoned pairing.","expl":"Red view: with signing on the device, the vault hardened and validation out-of-band, every path that touches fleet state is watched — so the red move stops touching the fleet and touches the <i>supply<\/i>: compromise the update channel and deliver an image whose bytes and published hash are consistent with each other and hostile. Every internal control passes because every internal control compares against data the channel itself delivered. Blue view: the counter is to hold an anchor from <i>before<\/i> the adversary's position existed — pinned vendor hashes captured at procurement, stored where the update channel cannot write — so a poisoned pairing loses to the original pair. Lesson: each control moves the contest upstream; the defender must keep at least one anchor upstream of everything the adversary can reach. What to study: trust anchors and their provenance.","items":[{"label":"Red decision — the surviving path","note":"Poison the update channel so image and published hash arrive as a hostile pair; internal comparisons all pass."},{"label":"Blue decision — the deciding anchor","note":"Pinned procurement-time vendor hashes, stored beyond the update channel's reach, defeat the poisoned pairing."}],"data":{"steps":[{"scen":"<b>STEP 1 OF 2<\/b> — RED. Fleet paths are closed: signing, hardened vault, out-of-band vendor-hash validation. Which path remains viable?","question":"Which red move do you make?","opts":["Poison the update channel — deliver image and hash as an already-paired hostile set","Flash the older image again — signing will miss it eventually","Rewrite the vault baseline — MFA cannot be bypassed"],"correct":0},{"scen":"<b>STEP 2 OF 2<\/b> — BLUE. Suspicion: the update channel may be compromised; internal validation passes everywhere.","question":"Which control decides the contest?","opts":["Pinned procurement-time vendor hashes stored beyond the update channel","Re-running the same internal validation more often","Asking the device to self-verify once more"],"correct":0}]}},{"id":"x13","type":"order","summary":"Rank six response actions (evidence vs uptime vs scope)","scen":{"lead":"You own the response sequence. Six actions, all defensible somewhere — rank them 1 (do first) to 6. The scenario's constraints: evidence is precious, the border must stay up during peak, and the actor may still hold the shared credential.","arts":[{"label":"ARTEFACT — the six actions","body":"A1 capture flash images + configs to the out-of-band collector (no downtime)\nA2 isolate gw-rtr-01 management plane from user networks (no traffic impact)\nA3 rotate the shared TACACS secret out-of-band (brief auth churn)\nA4 mass-reimage all 40 devices from the central repository tonight\nA5 validate repository images against vendor bulletin hashes\nA6 brief the CISO with a one-page scope statement"}]},"question":"Drag the actions into execution order.","hint":"Evidence before containment, containment before credentials, validation before any mass cure, and the brief lands when the scope is known.","correct":"1) A1 capture evidence out-of-band → 2) A2 isolate the management plane → 3) A3 rotate the shared secret → 4) A5 validate the repository → 5) A6 brief the CISO with the validated scope → 6) A4 staged reimage only now that the source is validated.","expl":"A1 first: the flash images and configs are the case — and A2/A3 change state, so evidence leads. A2 second: isolating the management plane contains the actor's path with zero traffic impact, unlike a reload. A3 third: with evidence secured and the path narrowed, the shared secret rotation accepts its brief churn. A5 fourth: before ANY mass recovery, the recovery source itself must be proven — this is the lesson of the unvalidated repository. A6 fifth: the CISO brief is now grounded in validated scope rather than early guesses. A4 last — and only because A5 succeeded: the fleet cure runs staged and validated, not as a Friday-night reflex. What to study: response ordering under evidence, access and scope constraints.","items":[{"label":"A1 capture images + configs OOB","note":"First: evidence before any state change."},{"label":"A2 isolate the management plane","note":"Second: contains the actor's path with no traffic downtime."},{"label":"A3 rotate the shared secret","note":"Third: accepts brief churn once evidence is safe and the path narrowed."},{"label":"A5 validate the repository","note":"Fourth: no mass recovery until the cure itself is proven."},{"label":"A6 brief the CISO","note":"Fifth: the brief carries validated scope, not first guesses."},{"label":"A4 staged fleet reimage","note":"Last: only from a validated source, by criticality — not a reflex."}],"data":{"entries":["A1 capture flash images + configs to OOB collector","A2 isolate gw-rtr-01 management plane","A3 rotate the shared TACACS secret out-of-band","A5 validate repository images against vendor hashes","A6 brief the CISO with the validated scope statement","A4 staged reimage of the fleet from the validated source"],"mode":"rank"}},{"id":"x14","type":"match","summary":"Six observations to chain stages","scen":{"lead":"The final report presents the incident as a chain of six stages. Match each observation to the stage it belongs to — including the anti-analytic stage that made this incident hard.","arts":[{"label":"ARTEFACT — the observations","body":"O1 svc-hvnet (shared) used from oob-mgmt-01 on two devices\nO2 gw-hv-legacy.bin staged into flash at 22:12\nO3 the internal baseline row for gw-rtr-01 rewritten at 22:44\nO4 the device rebooted into an image reporting 15.4(2)T\nO5 sessions after the reboot negotiated legacy cipher suites\nO6 the chosen device sits on the border; the lab ticket\n   named a different device entirely"}]},"question":"Match each observation to its chain stage.","hint":"Six stages: access, staging, anti-analytic, activation, enabled behaviour, scoping.","correct":"O1 → access (shared credential use); O2 → staging (image placed); O3 → anti-analytic (reference data bent); O4 → activation (downgrade live); O5 → enabled behaviour (weak ciphers — the T1600 payoff); O6 → scoping (deliberate device selection under ticket cover).","expl":"The chain view is how the report earns its conclusions. <b>Access<\/b>: a shared service credential from the management host, reused across devices — no attribution, maximal reach. <b>Staging<\/b>: the legacy image enters flash. <b>Anti-analytic<\/b>: the baseline rewrite at 22:44 — the stage that made internal checks lie and forced vendor anchoring. <b>Activation<\/b>: the reload into the old-version image. <b>Enabled behaviour<\/b>: legacy ciphers negotiating after the reboot — the payoff the framework describes when a downgrade enables Weaken Encryption (T1600). <b>Scoping<\/b>: a border device worked under a lab ticket — cover, not coincidence. What to study: presenting incidents as stages, not as a pile of alerts.","items":[{"label":"O1 shared credential on two devices","note":"Access — the credential is the operation's key."},{"label":"O2 image staged into flash","note":"Staging — the artefact enters the device."},{"label":"O3 baseline row rewritten at 22:44","note":"Anti-analytic — the reference data bent to fit."},{"label":"O4 reboot into the old-version image","note":"Activation — the downgrade goes live."},{"label":"O5 legacy ciphers negotiate post-reboot","note":"Enabled behaviour — the T1600 payoff of the downgrade."},{"label":"O6 border device under a lab ticket","note":"Scoping — deliberate target choice under ticket cover."}],"data":{"lefts":["O1 shared credential, two devices","O2 image staged into flash","O3 baseline row rewritten","O4 reboot into old-version image","O5 legacy ciphers negotiate","O6 border device under lab ticket"],"rights":["Stage: access","Stage: staging","Stage: anti-analytic","Stage: activation","Stage: enabled behaviour","Stage: scoping","Stage: exfiltration"],"correct":[0,1,2,3,4,5]}},{"id":"x15","type":"mcs","summary":"Incomplete information — what still holds?","scen":{"lead":"The last twist: the flash image matches the internal baseline — but the vault host was reachable by the shared credential, so the baseline FILE's own integrity is unknown. The audit committee asks what you can still state. Select the TWO statements that hold.","arts":[{"label":"ARTEFACT — the epistemic board","body":"Known-good: TACACS log, transfer log, OOB config diff, reload syslog,\nOOB console version capture (independent of the device CLI).\nUnknown: integrity of the internal baseline file itself.\nKnown: flash bytes == internal baseline bytes."}]},"question":"Select the two statements the committee may rely on.","hint":"A match to an untrusted reference proves equality, not innocence — and the chain lives in sources the actor did not control.","correct":"(1) The transfer → boot-var → reload chain occurred, because it is documented in sources independent of both the device CLI and the baseline vault. (2) The device content equals the baseline file's content — but whether that content is the vendor's code cannot be stated until the baseline is validated against the vendor-published hash.","expl":"This is the discipline of incomplete information. The chain itself is untouchable: four independent artefacts — TACACS, transfer log, out-of-band config diff, reload syslog — none of which runs through the device CLI or the vault, so the committee can rely on it. The flash-to-baseline match proves only <b>equality<\/b>: the device holds exactly what the vault holds. It cannot prove the <i>content<\/i> is the vendor's, because the vault was reachable by the shared credential — the 'match' may be two copies of the same forgery. 'No compromise' and 'wipe everything' both overreach in opposite directions; the missing step is the vendor-hash validation of the baseline file. What to study: what each comparison actually proves.","items":[{"label":"S1 the chain occurred (independent sources)","note":"Holds: TACACS, transfer log, OOB diff and reload syslog bypass both the device CLI and the vault."},{"label":"S2 content equality holds; vendor-cleanliness does not","note":"Holds with limits: flash == baseline file, but the baseline's own integrity is unproven until vendor-hash validation."},{"label":"S3 the device is clean because the checksum matches","note":"Overreach: the match may be two copies of the same forgery."},{"label":"S4 the vault was certainly compromised","note":"Overreach: reachability is not proof of compromise."},{"label":"S5 the whole fleet must be wiped tonight","note":"Overreach: no fleet-wide evidence exists; recovery follows validated sources."}],"data":{"options":["S1 the chain occurred — documented beyond the device CLI and the vault","S2 flash == baseline content, but vendor-cleanliness is unproven until validation","S3 the device is clean — the checksum matches","S4 the vault was certainly compromised","S5 the fleet must be wiped tonight"],"correct":[0,1]}},{"id":"x16","type":"selects","summary":"CTI report — keyword insertion under scrutiny","scen":{"lead":"The CTI brief goes to peer organisations. Three keyword choices carry its weight; legal will read every adjective. Choose the defensible keyword in each dropdown.","arts":[{"label":"ARTEFACT — brief draft (assessment section)","body":"\"We assess with {{0}} confidence that the downgrade was deliberate:\nthe actor used {{1}} service credentials reused across two devices and\nstaged an {{2}} image that passes the internal baseline yet fails the\nvendor bulletin hash. Confidence rests on chain repetition and forged\nbytes, not on any single log line.\""}]},"question":"Pick the three defensible keywords.","hint":"Two independent corroborations lift confidence; the credential type is a fact from the log; and only one adjective honestly describes an image that lies about its version.","correct":"<b>high<\/b> confidence (chain repeated across two devices + forged bytes = two independent corroborations) · <b>shared<\/b> service credentials (the log shows one credential behind nine admins — 'shared' is the fact; 'personal' would be false, 'guest' unsupported) · an <b>older, patched-spoofed<\/b> image (old version by design, bytes rebuilt to pass — not merely 'newer' or 'unsigned lab').","expl":"<b>High<\/b> is earned, not claimed: the framework for confidence on network devices rewards independent corroboration, and two exist — the chain's repetition across devices and the byte-level forgery against the vendor hash. <b>Shared<\/b> is the log-supported credential fact: writing 'personal' would imply attribution the artefacts cannot give, and 'guest' describes the unrelated VPN noise. <b>Older, patched-spoofed<\/b> describes exactly the observed mechanics — a deliberately old release whose bytes were rebuilt — while 'newer' contradicts the version capture and 'unsigned lab' overstates what the artefacts show. Peer reviewers reject briefs whose adjectives outrun their artefacts. What to study: assessment language that survives peer review.","items":[{"label":"Keyword 1 — confidence level","note":"High — two independent corroborations (chain repetition + forged bytes)."},{"label":"Keyword 2 — credential type","note":"Shared — the log-backed fact; nothing supports personal or guest."},{"label":"Keyword 3 — the image","note":"Older, patched-spoofed — old by design, bytes rebuilt to pass internal checks."}],"data":{"text":"We assess with {{0}} confidence that the downgrade was deliberate: the actor used {{1}} service credentials reused across two devices and staged an {{2}} image that passes the internal baseline yet fails the vendor bulletin hash.","slots":[{"opts":["high","moderate","low"],"correct":0},{"opts":["shared","personal","guest"],"correct":0},{"opts":["older, patched-spoofed","newer, vendor-signed","unsigned lab-only"],"correct":0}]}}]};

'use strict';
var EXAM = window.EXAM_DATA;
function $(s){ return document.querySelector(s); }
function mk(tag, cls, html){ var e=document.createElement(tag); if(cls){e.className=cls;} if(html!==undefined){e.innerHTML=html;} return e; }
function shuffle(a){ var x=a.slice(); for(var i=x.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=x[i]; x[i]=x[j]; x[j]=t; } return x; }
function pad2(n){ return (n<10?'0':'')+n; }
function fmtClock(sec){ var m=Math.floor(Math.max(0,sec)/60), s=Math.max(0,sec)%60; return pad2(m)+':'+pad2(s); }
function norm(s){ return (''+s).toLowerCase().replace(/\s+/g,' ').replace(/[.,;:]+$/,'').trim(); }
function smoothOK(){ return !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
/* generic partial-credit scoring: H = selected correct, W = selected wrong, N = total correct */
function scoreExercise(sel, corr){
  var corrSet = {}; for(var i=0;i<corr.length;i++){ corrSet[corr[i]] = true; }
  var H=0, W=0;
  for(var j=0;j<sel.length;j++){ if(corrSet[sel[j]]){ H++; } else { W++; } }
  var N = corr.length; var c = Math.max(0,(H-W)/N);
  return {H:H,W:W,N:N,credit:c};
}
/* ---------------- global state ---------------- */
var S = {
  phase:'intro', order:[], idx:0, credits:{}, answered:{}, checked:{}, hintUsed:{},
  skippedPool:[], returnTo:null, flowState:{}, perExLeft:0,
  manualTotal:0, reviewTotal:0, reported:false, user:'', country:'', locale:'en'
};
var T = { state:'IDLE', remain:EXAM.timerSeconds, lastTick:0, iv:null };
var TIMER_LABELS = {
  RUNNING:'\u25B6 RUNNING', PAUSED_MANUAL:'\u23F8 PAUSED \u2014 manual (press Resume)',
  PAUSED_AUTO_CHECK:'\u23F3 AUTO-PAUSED \u2014 reviewing feedback (resumes on Next)', ENDED:'\u23F9 ENDED', IDLE:'\u25B6 READY'
};
function setState(st){ T.state = st; renderHeader(); }
function tTick(){
  var now = Date.now(); var dt = Math.floor((now - T.lastTick)/1000);
  if(dt <= 0){ return; }
  T.lastTick = now;
  if(T.state==='PAUSED_MANUAL'){ S.manualTotal += dt; return; }
  if(T.state==='PAUSED_AUTO_CHECK'){ S.reviewTotal += dt; return; }
  if(T.state!=='RUNNING'){ return; }
  if(S.phase==='review'){ /* timer keeps running in review by design */ }
  T.remain -= dt;
  var cur = curEx();
  if(cur && cur.perEx && !S.checked[cur.id] && (S.phase==='exam')){
    S.perExLeft -= dt;
    if(S.perExLeft <= 0){ S.perExLeft = 0; doCheck(true); }
  }
  if(T.remain <= 0){ T.remain = 0; setState('ENDED'); finishExam(); return; }
  renderHeader();
}
function startTimer(){ T.lastTick = Date.now(); if(!T.iv){ T.iv = setInterval(tTick, 500); } setState('RUNNING'); }
function curEx(){ return S.order[S.idx] || null; }
/* ---------------- header ---------------- */
function renderHeader(){
  var t = $('#hdr'); if(!t){ return; }
  $('#clock').textContent = fmtClock(T.remain);
  $('#tstate').textContent = TIMER_LABELS[T.state] || '';
  $('#tstate').className = 'tstate ' + (T.state==='RUNNING'?'running':(T.state==='PAUSED_MANUAL'?'paused-manual':(T.state==='PAUSED_AUTO_CHECK'?'paused-check':'ended')));
  $('#tstate').setAttribute('aria-label','Timer state: '+(TIMER_LABELS[T.state]||''));
  var sum=0, cnt=0;
  for(var k in S.answered){ if(S.answered[k]){ sum += S.credits[k]; cnt++; } }
  var pct = cnt>0 ? Math.round((sum/cnt)*100) : 0;
  $('#lscore').innerHTML = '<b>'+sum.toFixed(1)+'</b> <span>/ '+cnt+' answered ('+pct+'%)</span>';
  var prog = Math.round((Object.keys(S.answered).length / S.order.length)*100);
  $('#pbarfill').style.width = (isFinite(prog)?prog:0) + '%';
  var px = $('#perex');
  if(px){ px.textContent = '\u23F1 Per-exercise timer: ' + fmtClock(S.perExLeft); }
}
function greetNote(){
  var g = '';
  if(S.user){ g += '<span class="cell"><span class="lbl">Analyst</span><span class="val">'+S.user.replace(/[<>&]/g,'')+'</span></span>'; }
  return g;
}
function buildHeader(){
  var h = mk('header','hdr'); h.id='hdr';
  h.innerHTML =
    '<span class="cell"><span class="lbl">Exercise</span><span class="val" id="excount">'+(S.phase==='exam'?(S.idx+1)+' of '+S.order.length:'\u2014')+'</span></span>'+
    '<span class="cell"><span class="badge '+EXAM.sev.key+'" role="img" aria-label="Severity '+EXAM.sev.label+'">'+EXAM.sev.label+'</span></span>'+
    '<span class="cell"><span class="lbl" aria-hidden="true">Time</span><span class="clock" id="clock" role="timer" aria-label="Time remaining">'+fmtClock(T.remain)+'</span>'+
    '<span class="tstate running" id="tstate" role="status">RUNNING</span></span>'+
    '<span class="cell"><span class="lbl">Score</span><span class="livescore" id="lscore" role="status" aria-label="Live score"><b>0.0</b> <span>/ 0 answered (0%)</span></span></span>'+
    '<span class="spacer cell"></span>'+
    '<button class="ghost hidden" id="hbtnHint" aria-label="Show one hint for the current exercise; costs 10 percent of its credit">\u25C6 Hint</button>'+
    '<button class="ghost hidden" id="hbtnSkip" aria-label="Skip the current exercise; it goes to the skipped pool">\u26A0 Skip</button>'+
    '<button class="ghost" id="btnPause" aria-label="Pause exam (manual break)">\u23F8 Pause</button>'+
    '<button class="ghost hidden" id="btnResume" aria-label="Resume exam">\u25B6 Resume</button>'+
    greetNote();
  var p = mk('div','pbar'); var f = mk('i'); f.id='pbarfill'; p.appendChild(f); p.id='pbar';
  var root = $('#app');
  root.insertBefore(p, root.firstChild);
  root.insertBefore(h, root.firstChild);
  $('#btnPause').addEventListener('click', manualPause);
  $('#btnResume').addEventListener('click', manualResume);
  $('#hbtnHint').addEventListener('click', function(){ var e = curEx(); if(e && !S.checked[e.id]){ doHint(e); } });
  $('#hbtnSkip').addEventListener('click', function(){ var e = curEx(); if(e && !S.checked[e.id]){ skipEx(); } });
}
function manualPause(){
  if(S.phase!=='exam' && S.phase!=='review'){ return; }
  if(T.state==='RUNNING' || T.state==='PAUSED_AUTO_CHECK'){
    setState('PAUSED_MANUAL');
    $('#btnPause').classList.add('hidden'); $('#btnResume').classList.remove('hidden');
    var m = mk('div','pausedmask'); m.id='pmask';
    m.innerHTML = '<div class="card"><div class="pl">\u23F8 PAUSED \u2014 manual (press Resume)</div>'+
      '<p>The exercise is hidden while you are on this break. The countdown is stopped.</p>'+
      '<button class="primary" id="btnResume2">\u25B6 Resume</button></div>';
    document.body.appendChild(m);
    m.querySelector('#btnResume2').addEventListener('click', manualResume);
    $('#exammain').classList.add('hidden');
  }
}
function manualResume(){
  var m = $('#pmask'); if(m){ m.remove(); }
  $('#exammain').classList.remove('hidden');
  $('#btnResume').classList.add('hidden'); $('#btnPause').classList.remove('hidden');
  T.lastTick = Date.now();
  if(S.checked[curEx() ? curEx().id : null]){ setState('PAUSED_AUTO_CHECK'); } else { setState('RUNNING'); }
}
/* ---------------- intro screen ---------------- */
function renderIntro(){
  var I = EXAM.intro;
  var w = mk('div','wrap intro');
  var c1 = mk('div','card');
  c1.innerHTML = '<h1>'+I.title+'<span class="sev badge '+EXAM.sev.key+'" role="img" aria-label="Severity '+EXAM.sev.label+'">'+EXAM.sev.label+'</span></h1>'+
    '<p class="sub mono">'+I.object+'</p>'+
    '<div class="facts">'+
      '<span class="fact"><span class="lbl">Exercises</span><span class="val">'+EXAM.exercises.length+'</span></span>'+
      '<span class="fact"><span class="lbl">Estimated time</span><span class="val">'+EXAM.estimatedMinutes+' min</span></span>'+
      '<span class="fact"><span class="lbl">Timer budget</span><span class="val">'+EXAM.estimatedMinutes+' min countdown</span></span>'+
      '<span class="fact"><span class="lbl">Pass mark</span><span class="val">70%</span></span>'+
      '<span class="fact"><span class="lbl">Object type</span><span class="val">Sub-Technique</span></span>'+
    '</div>';
  var c2 = mk('div','card');
  c2.innerHTML = '<h2>\u25C8 What you will learn here</h2>'+I.learn;
  var c3 = mk('div','card');
  var th = '';
  for(var i=0;i<I.themes.length;i++){
    var t = I.themes[i];
    th += '<div class="theme"><h4>'+t.name+'</h4><ul>';
    for(var j=0;j<t.items.length;j++){ th += '<li class="kw">'+t.items[j]+'</li>'; }
    th += '</ul></div>';
  }
  c3.innerHTML = '<h2>\u25C8 Keywords covered in this exam</h2><div class="themegrid">'+th+'</div>';
  var c4 = mk('div','card');
  var types = '';
  if(I.types && I.types.length){
    types = '<ul class="howlist">';
    for(var k=0;k<I.types.length;k++){ types += '<li>'+I.types[k]+'</li>'; }
    types += '</ul>';
  }
  c4.innerHTML = '<h2>\u25C8 How this exam works</h2>'+I.how+types+
    '<div class="actions"><button class="primary" id="btnStart" aria-label="Start the exam">\u25B6 Start the exam</button></div>';
  w.appendChild(c1); w.appendChild(c2); w.appendChild(c3); w.appendChild(c4);
  $('#app').appendChild(w);
  $('#btnStart').addEventListener('click', function(){ startExam(); });
}
/* ---------------- exam frame ---------------- */
function startExam(){
  S.phase = 'exam';
  S.order = shuffle(EXAM.exercises);
  $('.intro').remove();
  buildHeader();
  var main = mk('main','wrap'); main.id = 'exammain'; $('#app').appendChild(main);
  startTimer();
  renderEx();
}
function toReviewOrResults(){
  if(S.skippedPool.length > 0 && T.remain > 0){ renderReview(); }
  else { finishExam(); }
}

/* ---------------- exercise rendering ---------------- */
function doHint(ex){
  if(S.hintUsed[ex.id] || S.checked[ex.id]){ return; }
  S.hintUsed[ex.id] = true;
  var main = $('#exammain'); var acts = main ? main.querySelector('.actions') : null;
  if(!acts){ return; }
  var hb = mk('div','hintbox');
  hb.innerHTML = '<div class="hlabel">\u25C6 Hint \u2014 one per exercise (\u22120.10 credit)</div><p>'+ex.hint+'</p>';
  main.insertBefore(hb, acts);
  var b1 = $('#btnHint'); if(b1){ b1.disabled = true; }
  var b2 = $('#hbtnHint'); if(b2){ b2.disabled = true; }
}
function scenBlock(ex){
  var b = mk('section','blk scenario');
  var h = mk('header',null,'<span aria-hidden="true">\u25C8</span> SCENARIO');
  b.appendChild(h);
  var body = mk('div','body');
  if(ex.scen.lead){ body.appendChild(mk('p',null,ex.scen.lead)); }
  for(var i=0;i<ex.scen.arts.length;i++){
    var a = ex.scen.arts[i];
    var d = mk('div','artefact');
    var lbl = '<label>ARTEFACT '+(i+1)+' \u2014 '+a.label.replace(/^ARTEFACT\s*[\u2014-]\s*/,'')+'</label>';
    d.innerHTML = lbl;
    if(a.filter){
      var fb = mk('div','fbox');
      fb.innerHTML = '<span class="flbl">Filter lines</span>';
      var inp = document.createElement('input'); inp.type='search'; inp.setAttribute('aria-label','Filter log lines');
      inp.addEventListener('input', function(){
        var q = this.value.toLowerCase();
        var lns = d.querySelectorAll('.ln');
        for(var z=0; z<lns.length; z++){ lns[z].classList.toggle('hidden', q!=='' && lns[z].textContent.toLowerCase().indexOf(q)===-1); }
      });
      fb.appendChild(inp); d.appendChild(fb);
    }
    var pre = mk('pre',null,a.body);
    d.appendChild(pre); body.appendChild(d);
  }
  b.appendChild(body);
  var col = mk('button','scen-collapse'); col.type='button';
  col.setAttribute('aria-expanded','true');
  col.innerHTML = '\u25B4 Collapse scenario \u2014 <span class="zhint">'+ex.summary+'</span>';
  col.addEventListener('click', function(){
    var c = b.classList.toggle('collapsed');
    col.innerHTML = (c ? '\u25B6 Expand scenario \u2014 <span class="zhint">'+ex.summary+'</span>'
                       : '\u25B4 Collapse scenario \u2014 <span class="zhint">'+ex.summary+'</span>');
    col.setAttribute('aria-expanded', String(!c));
  });
  b.appendChild(col);
  return b;
}
function ansBlock(title){
  var b = mk('section','blk answer');
  b.appendChild(mk('header',null,'<span aria-hidden="true">\u270E</span> YOUR ANSWER'));
  var body = mk('div','body');
  if(title){ body.appendChild(mk('p','exnote',title)); }
  b.appendChild(body);
  return b;
}
function optRow(labelLetter, text, sel){
  var o = mk('button','opt'+(sel?' sel':'')); o.type='button';
  o.innerHTML = '<span class="key">'+labelLetter+'.</span><span>'+text+'</span>';
  o.setAttribute('aria-pressed', String(!!sel));
  return o;
}
function letters(i){ return 'ABCDEFGHIJ'.charAt(i); }
/* per-type widget builders; each returns {node, collect()} */
function buildWidget(ex){
  var D = ex.data, body;
  if(ex.type==='mc'){
    var idxs = shuffle(D.options.map(function(_,i){return i;}));
    var wrap = mk('div','opts'); var sel = -1;
    idxs.forEach(function(oi, pos){
      var r = optRow(letters(pos), D.options[oi], false);
      r.addEventListener('click', function(){ sel = oi;
        wrap.querySelectorAll('.opt').forEach(function(x){ x.classList.remove('sel'); x.setAttribute('aria-pressed','false'); });
        r.classList.add('sel'); r.setAttribute('aria-pressed','true'); });
      wrap.appendChild(r);
    });
    body = wrap;
    return {node:body, collect:function(){ return {sel:sel}; }};
  }
  if(ex.type==='mcs'){
    var idxs2 = shuffle(D.options.map(function(_,i){return i;}));
    var wrap2 = mk('div','opts'); var sel2 = [];
    idxs2.forEach(function(oi, pos){
      var r = optRow(letters(pos), D.options[oi], false);
      r.addEventListener('click', function(){
        var p = sel2.indexOf(oi);
        if(p===-1){ sel2.push(oi); r.classList.add('sel'); r.setAttribute('aria-pressed','true'); }
        else { sel2.splice(p,1); r.classList.remove('sel'); r.setAttribute('aria-pressed','false'); } });
      wrap2.appendChild(r);
    });
    body = wrap2;
    return {node:body, collect:function(){ return {sel:sel2.slice()}; }};
  }
  if(ex.type==='order'){
    var bank = mk('div','bank'); var seq = mk('div','seq');
    var placed = [];
    var shuffled = shuffle(D.entries.map(function(_,i){return i;}));
    var hintp = mk('p','exnote', D.mode==='rank' ? 'Click the items below from rank 1 (most urgent) to the last rank. Items move into your ranked list.' : 'Click the items below in the correct order. They move into your sequence.');
    bank.id='obank'; seq.id='oseq';
    function place(oi, rowEl){
      placed.push(oi);
      var row = mk('div','seqrow','<span class="pos">'+placed.length+'</span><span>'+D.entries[oi]+'</span>');
      row.setAttribute('data-oi', String(oi));
      seq.appendChild(row);
      if(rowEl){ rowEl.remove(); }
      if(bank.children.length===0){ bank.appendChild(mk('p','zhint','Bank empty \u2014 all items placed. Use Undo to fix mistakes.')); }
    }
    shuffled.forEach(function(oi){
      var row = mk('div','bankrow','<span>'+D.entries[oi]+'</span>');
      row.setAttribute('data-oi', String(oi));
      row.setAttribute('draggable','true'); row.setAttribute('tabindex','0'); row.setAttribute('role','button');
      row.setAttribute('aria-label','Place item: '+D.entries[oi].replace(/<[^>]+>/g,''));
      row.addEventListener('click', function(){ place(oi, row); });
      row.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); place(oi,row); } });
      row.addEventListener('dragstart', function(e){ e.dataTransfer.setData('text/plain', String(oi)); row.classList.add('dragging'); });
      row.addEventListener('dragend', function(){ row.classList.remove('dragging'); });
      bank.appendChild(row);
    });
    seq.addEventListener('dragover', function(e){ e.preventDefault(); seq.classList.add('over'); });
    seq.addEventListener('dragleave', function(){ seq.classList.remove('over'); });
    seq.addEventListener('drop', function(e){ e.preventDefault(); seq.classList.remove('over');
      var oi = parseInt(e.dataTransfer.getData('text/plain'),10);
      var target = bank.querySelector('.bankrow[data-oi="'+oi+'"]');
      place(oi, target); });
    var undo = mk('button','ghost','\u21B6 Undo last');
    undo.type='button';
    undo.addEventListener('click', function(){
      var last = seq.querySelector('.seqrow:last-child');
      if(last){ placed.pop(); last.remove();
        if(bank.querySelector('.zhint')){ bank.querySelector('.zhint').remove(); }
        bank.appendChild(last); var lb = last; lb.className='bankrow'; lb.setAttribute('draggable','true');
        var posBadge = lb.querySelector('.pos'); if(posBadge){ posBadge.remove(); } }
    });
    body = mk('div',null); body.appendChild(hintp); body.appendChild(seq); body.appendChild(bank);
    var ub = mk('div',null); ub.style.marginTop='8px'; ub.appendChild(undo); body.appendChild(ub);
    return {node:body, collect:function(){ return {placed:placed.slice()}; }};
  }
  if(ex.type==='match'){
    var w = mk('div',null);
    var rightsShuf = shuffle(D.rights.map(function(_,i){return i;}));
    var rows = [];
    D.lefts.forEach(function(L, li){
      var r = mk('div','mrow');
      r.appendChild(mk('div','lhs','<b class="mono">'+L+'</b>'));
      var s = document.createElement('select'); s.className='dd'; s.setAttribute('aria-label','Match for '+stripTags(L));
      s.appendChild(new Option('\u2014 choose \u2014',''));
      rightsShuf.forEach(function(ri){ s.appendChild(new Option(stripTags(D.rights[ri]), String(ri))); });
      r.appendChild(s); w.appendChild(r); rows.push(s);
    });
    body = w;
    return {node:body, collect:function(){ var vals = rows.map(function(s){ return s.value===''?null:parseInt(s.value,10); }); return {picks:vals}; }};
  }
  if(ex.type==='fill'){
    var wf = mk('div',null);
    var html = D.text.replace(/\u27E6(\d+)\u27E7/g, function(m, i){
      return '<span class="slot"><input type="text" class="txt" data-b="'+i+'" aria-label="Blank '+(parseInt(i,10)+1)+'" autocomplete="off" spellcheck="false"></span>';
    });
    wf.appendChild(mk('p','fillline',html));
    if(D.bank){
      var wb = mk('p','exnote','Word bank (shuffled): <span class="mono">'+shuffle(D.bank).join(' \u00B7 ')+'</span>');
      wf.appendChild(wb);
    }
    body = wf;
    return {node:body, collect:function(){
      var vals = []; var ins = wf.querySelectorAll('input.txt');
      ins.forEach(function(i2){ vals.push(i2.value); });
      return {vals:vals};
    }};
  }
  if(ex.type==='dnd'){
    var wd = mk('div',null);
    wd.appendChild(mk('p','exnote','Drag each card into the right zone (or click a card, then click a zone).'));
    var bankd = mk('div','bank'); bankd.id='dbank';
    var zones = mk('div','zones');
    var selItem = null;
    var shuffledItems = shuffle(D.items.map(function(_,i){return i;}));
    shuffledItems.forEach(function(oi){
      var row = mk('div','bankrow','<span>'+D.items[oi]+'</span>');
      row.setAttribute('draggable','true'); row.setAttribute('data-oi',String(oi));
      row.setAttribute('tabindex','0'); row.setAttribute('role','button');
      row.addEventListener('dragstart', function(e){ e.dataTransfer.setData('text/plain', String(oi)); row.classList.add('dragging'); });
      row.addEventListener('dragend', function(){ row.classList.remove('dragging'); });
      row.addEventListener('click', function(){
        if(!bankd.contains(row)){ return; }  /* card already placed: inert */
        var was = row.classList.contains('sel');
        bankd.querySelectorAll('.bankrow').forEach(function(x){ x.classList.remove('sel'); });
        zones.querySelectorAll('.bankrow').forEach(function(x){ x.classList.remove('sel'); });
        if(!was){ row.classList.add('sel'); selItem = oi; } else { selItem = null; }
      });
      bankd.appendChild(row);
    });
    bankd.addEventListener('keydown', function(e){
      var r = e.target && e.target.closest ? e.target.closest('.bankrow') : null;
      if(r && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); r.click(); }
    });
    D.zones.forEach(function(zn, zi){
      var z = mk('div','zone'); z.setAttribute('data-zi',String(zi));
      z.appendChild(mk('h4',null, zn.icon+' '+zn.name));
      z.appendChild(mk('div','placed'));
      z.appendChild(mk('p','zhint','Drop here'));
      z.addEventListener('dragover', function(e){ e.preventDefault(); z.classList.add('over'); });
      z.addEventListener('dragleave', function(){ z.classList.remove('over'); });
      z.addEventListener('drop', function(e){ e.preventDefault(); z.classList.remove('over');
        var oi = parseInt(e.dataTransfer.getData('text/plain'),10); moveToZone(oi, zi); });
      z.addEventListener('click', function(){ if(selItem!==null){ moveToZone(selItem, zi); selItem = null; } });
      z.setAttribute('tabindex','0'); z.setAttribute('role','button');
      z.setAttribute('aria-label','Drop zone '+zn.name+'. Press Enter to place the selected card here.');
      z.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(selItem!==null){ moveToZone(selItem, zi); selItem = null; } } });
      zones.appendChild(z);
    });
    function moveToZone(oi, zi){
      var src = (bankd.querySelector('[data-oi="'+oi+'"]') || document.querySelector('.zone [data-oi="'+oi+'"]'));
      if(!src){ return; }
      src.classList.remove('sel');
      var z = zones.querySelector('[data-zi="'+zi+'"]');
      z.querySelector('.zhint').classList.add('hidden');
      z.querySelector('.placed').appendChild(src);
    }
    body = wd; body.appendChild(bankd); body.appendChild(zones);
    return {node:body, collect:function(){
      var inzone = [];
      for(var zi=0; zi<D.zones.length; zi++){
        var z = zones.querySelector('[data-zi="'+zi+'"]');
        z.querySelectorAll('.bankrow').forEach(function(r){ inzone.push({oi:parseInt(r.getAttribute('data-oi'),10), zi:zi}); });
      }
      return {inzone:inzone, total:D.items.length};
    }};
  }
  if(ex.type==='term'){
    var wt = mk('div',null);
    if(ex.perEx){ wt.appendChild(mk('p','exTimerNote','\u23F8 Reduced per-exercise timer: <span id="perex">'+fmtClock(ex.perEx)+'</span> \u2014 it stops while paused, resumes with the main timer, and auto-checks your current answer at zero.')); }
    var sh = mk('div','shell'); sh.setAttribute('role','log');
    if(D.syntax){ wt.appendChild(mk('div','synpanel',D.syntax)); }
    var sc = mk('div','sc'); sc.id='shsc';
    sh.appendChild(sc);
    sc.innerHTML = '<div>'+D.banner+'</div>';
    var pl = mk('div','pline');
    pl.appendChild(mk('span','pr',D.prompt));
    var inp = document.createElement('input'); inp.type='text'; inp.autocomplete='off'; inp.spellcheck=false;
    inp.setAttribute('aria-label','Terminal input'); pl.appendChild(inp);
    sh.appendChild(pl);
    wt.appendChild(sh);
    var st = {transcript:[], answers:[]};
    if(D.mode==='seq'){
      var qi = 0;
      function echo(line, cls){ var d = mk('div', cls||'', line); sc.appendChild(d); sc.scrollTop = sc.scrollHeight; }
      echo('\u25B8 '+D.prompts[0].ask, 'exnote');
      function submitLine(){
        var v = inp.value; if(v===''){ return; }
        echo(D.prompt+' '+v.replace(/[<>&]/g,''));
        st.transcript.push(v); st.answers.push(v);
        inp.value=''; qi++;
        if(qi < D.prompts.length){ echo('\u25B8 '+D.prompts[qi].ask, 'exnote'); }
        else { echo('\u2713 All questions answered \u2014 press Check to grade.', 'exnote'); inp.disabled = true; }
      }
      inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ submitLine(); } });
      var rb = mk('button','ghost','\u21B5 Send'); rb.type='button'; rb.style.marginTop='8px';
      rb.addEventListener('click', submitLine); wt.appendChild(rb);
    } else {
      inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){
        var v = inp.value; if(v===''){ return; }
        var d = mk('div','', D.prompt+' '+v.replace(/[<>&]/g,'')); sc.appendChild(d);
        if(D.runOut){ var o = mk('div','exnote',D.runOut); sc.appendChild(o); }
        sc.scrollTop = sc.scrollHeight; inp.value=''; st.transcript.push(v);
      } });
    }
    body = wt;
    return {node:body, collect:function(){ return {input:(st.transcript[st.transcript.length-1]||''), transcript:st.transcript, answers:st.answers}; }};
  }
  if(ex.type==='flow'){
    var wfl = mk('div',null);
    if(!S.flowState[ex.id]){ S.flowState[ex.id] = {step:0, picks:[]}; }
    var fs = S.flowState[ex.id];
    body = wfl;
    function drawStep(){
      wfl.innerHTML='';
      var st_ = D.steps[fs.step];
      wfl.appendChild(mk('p','stepchip','STEP '+(fs.step+1)+' OF '+D.steps.length));
      if(st_.scen){ wfl.appendChild(mk('p',null,st_.scen)); }
      wfl.appendChild(mk('p','exnote','<b>Decision:</b> '+st_.question));
      var obox = mk('div','opts');
      st_.opts.forEach(function(O, oi){
        var r = optRow(letters(oi), O, fs.picks[fs.step]===oi);
        r.addEventListener('click', function(){
          fs.picks[fs.step] = oi;
          if(fs.step < D.steps.length-1){ fs.step++; drawStep(); }
