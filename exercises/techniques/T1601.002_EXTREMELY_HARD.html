          else { drawStep(); }
        });
        obox.appendChild(r);
      });
      wfl.appendChild(obox);
      if(fs.picks[fs.step]!==undefined && fs.step===D.steps.length-1){
        wfl.appendChild(mk('p','exnote','\u2713 All '+D.steps.length+' decisions recorded \u2014 press Check to grade.'));
      } else if(fs.picks[fs.step]!==undefined){
        wfl.appendChild(mk('p','exnote','\u2713 Choice recorded \u2014 next step loaded. The timer keeps running between steps.'));
      }
    }
    drawStep();
    return {node:body, collect:function(){ return {picks:S.flowState[ex.id].picks.slice()}; }};
  }
  if(ex.type==='selects'){
    var ws = mk('div',null);
    var htmlS = D.text.replace(/\{\{(\d+)\}\}/g, function(m, i){
      return '<span class="slot"><select class="dd" data-s="'+i+'" aria-label="Gap '+(parseInt(i,10)+1)+'"><option value="">\u2014 choose \u2014</option></select></span>';
    });
    ws.appendChild(mk('p',null,htmlS));
    var sels = ws.querySelectorAll('select');
    D.slots.forEach(function(sl, i){
      var sel = ws.querySelector('select[data-s="'+i+'"]');
      shuffle(sl.opts.map(function(_,x){return x;})).forEach(function(oi){ sel.appendChild(new Option(stripTags(sl.opts[oi]), String(oi))); });
    });
    body = ws;
    return {node:body, collect:function(){
      var picks = []; var ss = ws.querySelectorAll('select');
      ss.forEach(function(s2){ picks.push(s2.value===''?null:parseInt(s2.value,10)); });
      return {picks:picks};
    }};
  }
  return {node:mk('p',null,'Unsupported type.'), collect:function(){ return {}; }};
}
function stripTags(s){ return (''+s).replace(/<[^>]+>/g,''); }

/* ---------------- exercise lifecycle ---------------- */
function renderEx(){
  var ex = curEx(); if(!ex){ toReviewOrResults(); return; }
  S.widget = null;
  S.perExLeft = ex.perEx || 0;
  var main = $('#exammain'); main.innerHTML='';
  $('#excount').textContent = (S.returnTo==='review' ? 'Returned skipped \u00B7 ' : '') + 'Exercise '+(S.idx+1)+' of '+S.order.length;
  main.appendChild(scenBlock(ex));
  var qb = mk('section','blk question');
  qb.appendChild(mk('header',null,'<span aria-hidden="true">\u276F</span> QUESTION'));
  qb.appendChild(mk('div','body','<p>'+ex.question+'</p>'));
  main.appendChild(qb);
  var ab = ansBlock(ex.ansNote);
  var w = buildWidget(ex);
  ab.querySelector('.body').appendChild(w.node);
  main.appendChild(ab);
  S.widget = w;
  var acts = mk('div','actions');
  var bh = mk('button','ghost','\u25C6 Hint (\u221210% credit)');
  bh.id='btnHint'; bh.type='button';
  bh.disabled = !!S.hintUsed[ex.id];
  bh.setAttribute('aria-label','Show one hint; costs 10 percent of this exercise credit');
  bh.addEventListener('click', function(){ doHint(ex); });
  var bs = mk('button','ghost','\u26A0 Skip');
  bs.id='btnSkip'; bs.type='button';
  bs.setAttribute('aria-label','Skip this exercise; it goes to the skipped pool without revealing the answer');
  bs.addEventListener('click', skipEx);
  var bc = mk('button','primary','\u2713 Check answer');
  bc.id='btnCheck'; bc.type='button';
  bc.setAttribute('aria-label','Check answer; the timer pauses until you press Next');
  bc.addEventListener('click', function(){ doCheck(false); });
  var bn = mk('button','primary hidden','Next \u25B6');
  bn.id='btnNext'; bn.type='button';
  bn.setAttribute('aria-label','Next exercise; the timer resumes');
  bn.addEventListener('click', nextEx);
  acts.appendChild(bh); acts.appendChild(bs); acts.appendChild(bc); acts.appendChild(bn);
  main.appendChild(acts);
  main.appendChild(mk('div',null,'')).id='fbhost';
  var hb2 = $('#hbtnHint'); var sb2 = $('#hbtnSkip');
  if(hb2){ hb2.classList.remove('hidden'); hb2.disabled = !!S.hintUsed[ex.id]; }
  if(sb2){ sb2.classList.remove('hidden'); sb2.disabled = false; }
  renderHeader();
  window.scrollTo({top:0, behavior:(smoothOK()?'smooth':'auto')});
}
function doCheck(auto){
  var ex = curEx();
  if(!ex || S.checked[ex.id]){ return; }
  var res = gradeEx(ex);
  var credit = res.credit;
  if(S.hintUsed[ex.id]){ credit = Math.max(0, credit - 0.10); }
  S.credits[ex.id] = credit; S.answered[ex.id] = true; S.checked[ex.id] = true; S.gradeDetail = res;
  S.autoChecked = !!auto;
  var p = S.skippedPool.indexOf(ex.id);
  if(p !== -1){ S.skippedPool.splice(p,1); }
  renderFeedback(ex, res, credit);
  $('#btnCheck').classList.add('hidden');
  $('#btnNext').classList.remove('hidden');
  var hs = $('#hbtnSkip'); if(hs){ hs.classList.add('hidden'); }
  var hh = $('#hbtnHint'); if(hh){ hh.disabled = true; }
  var bn = $('#btnNext');
  bn.textContent = (S.returnTo==='review') ? 'Back to review \u25B6' : ((S.idx === S.order.length-1) ? 'Continue \u25B6' : 'Next \u25B6');
  if(T.state !== 'ENDED'){ setState('PAUSED_AUTO_CHECK'); }
  renderHeader();
}
function skipEx(){
  var ex = curEx(); if(!ex || S.checked[ex.id]){ return; }
  if(S.skippedPool.indexOf(ex.id) === -1){ S.skippedPool.push(ex.id); }
  if(S.returnTo === 'review'){ S.returnTo = null; if(T.state==='PAUSED_AUTO_CHECK'){ setState('RUNNING'); } renderReview(); return; }
  if(S.idx >= S.order.length-1){ toReviewOrResults(); }
  else { S.idx++; renderEx(); }
}
function nextEx(){
  var ex = curEx();
  if(T.state === 'PAUSED_AUTO_CHECK'){ setState('RUNNING'); }
  if(S.returnTo === 'review'){ S.returnTo = null; renderReview(); return; }
  if(S.idx >= S.order.length-1){ toReviewOrResults(); }
  else { S.idx++; renderEx(); }
}
/* ---------------- grading per type ---------------- */
function gradeEx(ex){
  var D = ex.data, c = S.widget.collect(), out = {H:0,W:0,N:0,items:[],dangerous:false};
  function mkItems(states){ for(var i=0;i<ex.items.length;i++){ out.items.push({label:ex.items[i].label, note:ex.items[i].note||'', state:states[i]||'miss'}); } }
  if(ex.type==='mc'){
    out.N = 1;
    if(c.sel === D.correct){ out.H = 1; mkItems(['ok']); } else if(c.sel === -1){ mkItems(['miss']); } else { mkItems(['bad']); }
  } else if(ex.type==='mcs'){
    var corr = D.correct; out.N = corr.length;
    var sel = c.sel || [];
    var states = [];
    for(var i=0;i<ex.items.length;i++){
      var wasSel = sel.indexOf(i) !== -1;
      var isCorr = corr.indexOf(i) !== -1;
      if(wasSel && isCorr){ out.H++; states.push('ok'); }
      else if(wasSel && !isCorr){ out.W++; states.push('bad'); }
      else if(!wasSel && isCorr){ states.push('miss'); }
      else { states.push('miss'); }
    }
    mkItems(states);
  } else if(ex.type==='order'){
    out.N = D.entries.length;
    var st2 = [];
    for(var p=0; p<out.N; p++){
      if(p < c.placed.length){
        if(c.placed[p] === p){ out.H++; st2.push('ok'); } else { out.W++; st2.push('bad'); }
      } else { st2.push('miss'); }
    }
    mkItems(st2);
  } else if(ex.type==='match'){
    out.N = D.lefts.length;
    var st3 = [];
    for(var l=0; l<out.N; l++){
      if(c.picks[l] === null){ st3.push('miss'); }
      else if(c.picks[l] === D.correct[l]){ out.H++; st3.push('ok'); }
      else { out.W++; st3.push('bad'); }
    }
    mkItems(st3);
  } else if(ex.type==='fill'){
    out.N = D.blanks.length;
    var st4 = [];
    for(var b=0; b<out.N; b++){
      var v = (c.vals[b]||'');
      if(v.trim()===''){ st4.push('miss'); }
      else {
        var nv = norm(v); var ok = false;
        for(var a=0; a<D.blanks[b].length; a++){ if(nv === norm(D.blanks[b][a])){ ok = true; break; } }
        if(ok){ out.H++; st4.push('ok'); } else { out.W++; st4.push('bad'); }
      }
    }
    mkItems(st4);
  } else if(ex.type==='dnd'){
    out.N = D.items.length;
    var zoneOf = {};
    for(var z=0; z<c.inzone.length; z++){ zoneOf[c.inzone[z].oi] = c.inzone[z].zi; }
    var st5 = [];
    for(var oi=0; oi<out.N; oi++){
      if(zoneOf[oi] === undefined){ st5.push('miss'); }
      else if(zoneOf[oi] === D.correct[oi]){ out.H++; st5.push('ok'); }
      else { out.W++; st5.push('bad'); }
    }
    mkItems(st5);
  } else if(ex.type==='term'){
    var needs = D.elements.filter(function(e){ return e.kind==='need'; });
    var forbids = D.elements.filter(function(e){ return e.kind==='forbid'; });
    out.N = needs.length;
    var txts;
    if(D.mode==='seq'){ txts = c.answers || []; }
    else { txts = [c.input || ''].concat(c.transcript || []); }
    var joined = norm(txts.join(' \u00A6 '));
    var st6 = [];
    for(var nI=0; nI<needs.length; nI++){
      var re = new RegExp(needs[nI].re, 'i');
      var anyHit = false;
      if(D.mode==='seq'){
        /* grade each seq element against its own answer line */
        if(txts[nI] !== undefined && re.test(norm(txts[nI]))){ anyHit = true; }
      } else {
        for(var tI=0; tI<txts.length; tI++){ if(re.test(norm(txts[tI]))){ anyHit = true; break; } }
      }
      if(anyHit){ out.H++; st6.push('ok'); } else { st6.push('miss'); }
    }
    var nI2 = 0, fI2 = 0;
    for(var i7=0; i7<ex.items.length; i7++){
      var itm = ex.items[i7];
      if(itm.kind === 'forbid'){
        var fEl = D.elements.filter(function(e){ return e.kind==='forbid' && e.label===itm.label; })[0];
        var bad = fEl ? new RegExp(fEl.re,'i').test(joined) : false;
        if(bad){ out.W++; }
        out.items.push({label:itm.label, note:itm.note||'', state: bad?'bad':'ok'});
      } else {
        out.items.push({label:itm.label, note:itm.note||'', state: st6[nI2]||'miss'}); nI2++;
      }
    }
    if(D.dangerRe && new RegExp(D.dangerRe.re,'i').test(joined)){ out.dangerous = true; }
  } else if(ex.type==='flow'){
    out.N = D.steps.length;
    var st7 = [];
    for(var sI=0; sI<out.N; sI++){
      var pick = c.picks[sI];
      if(pick === undefined || pick === null){ st7.push('miss'); }
      else if(pick === D.steps[sI].correct){ out.H++; st7.push('ok'); }
      else { out.W++; st7.push('bad'); }
    }
    mkItems(st7);
  } else if(ex.type==='selects'){
    out.N = D.slots.length;
    var st8 = [];
    for(var q=0; q<out.N; q++){
      var pk = c.picks[q];
      if(pk === null || pk === undefined){ st8.push('miss'); }
      else if(pk === D.slots[q].correct){ out.H++; st8.push('ok'); }
      else { out.W++; st8.push('bad'); }
    }
    mkItems(st8);
  }
  var credit = out.N > 0 ? Math.max(0,(out.H-out.W)/out.N) : 0;
  out.credit = credit;
  return out;
}
/* ---------------- feedback ---------------- */
function renderFeedback(ex, res, credit){
  var host = $('#fbhost'); if(!host){ return; }
  host.innerHTML='';
  var cls = credit >= 0.999 ? 'correct' : (credit > 0 ? 'partial' : 'incorrect');
  var icon = credit >= 0.999 ? '\u2713' : (credit > 0 ? '\u2713' : '\u2717');
  var word = credit >= 0.999 ? 'CORRECT' : (credit > 0 ? 'PARTIALLY CORRECT' : 'INCORRECT');
  var fb = mk('section','feedback '+cls);
  var sub = credit >= 0.999 ? '' : (credit > 0 ? ' \u2014 credit '+credit.toFixed(2)+' \u2014 '+res.H+'/'+res.N+' items' : '');
  var fhd = mk('header',null,'');
  fhd.innerHTML = '<span aria-hidden="true">'+icon+'</span> '+word+sub+
    (S.autoChecked ? ' <span class="exTimerNote">(auto-checked: the per-exercise timer reached zero)</span>' : '');
  fb.appendChild(fhd);
  fb.setAttribute('role','status');
  fb.setAttribute('aria-label', word);
  var body = mk('div','fbody');
  body.appendChild(mk('p','credline','Scoring formula: credit = max(0, (H \u2212 W) / N) = max(0, ('+res.H+' \u2212 '+res.W+') / '+res.N+') = '+credit.toFixed(2)+
    (S.hintUsed[ex.id] ? ' \u00B7 hint used: \u22120.10 applied' : '')));
  if(res.items.length > 0){
    var it = mk('div','items');
    for(var i=0;i<res.items.length;i++){
      var it_ = res.items[i];
      var stTxt = it_.state==='ok' ? '<span class="st">\u2713 Correct</span>' : (it_.state==='bad' ? '<span class="st">\u2717 Wrong</span>' : '<span class="st">\u25CB Missed</span>');
      var row = mk('div','itemrow '+(it_.state==='ok'?'ok':(it_.state==='bad'?'bad':'miss')));
      row.innerHTML = stTxt + '<span><b>'+it_.label+'</b> \u2014 '+it_.note+'</span>';
      it.appendChild(row);
    }
    body.appendChild(it);
  }
  if(res.dangerous){
    var dw = mk('div','itemrow bad');
    dw.innerHTML = '<span class="st">\u2717 DANGEROUS \u2014 NEAR MISS</span><span>'+ex.data.dangerNote+'</span>';
    body.appendChild(dw);
  }
  body.appendChild(mk('div','canon','<span class="clabel">Correct answer</span>'+(ex.correct||'')));
  body.appendChild(mk('p',null,ex.expl));
  fb.appendChild(body);
  host.appendChild(fb);
  fb.scrollIntoView({behavior:(smoothOK()?'smooth':'auto'), block:'nearest'});
}
/* ---------------- review skipped ---------------- */
function renderReview(){
  S.phase = 'review';
  var main = $('#exammain'); main.innerHTML='';
  $('#excount').textContent = 'Review skipped exercises';
  var hbR = $('#hbtnHint'); if(hbR){ hbR.classList.add('hidden'); }
  var sbR = $('#hbtnSkip'); if(sbR){ sbR.classList.add('hidden'); }
  main.appendChild(mk('section','blk scenario')).innerHTML = '';
  var sb = main.querySelector('section');
  sb.innerHTML = '<header><span aria-hidden="true">\u26A0</span> REVIEW SKIPPED EXERCISES</header><div class="body">'+
    '<p>You skipped '+S.skippedPool.length+' exercise(s). You can return to any of them and answer it, as many times as you need, while the timer is still running ('+fmtClock(T.remain)+' left).</p>'+
    '<p>If you submit now, every skipped-and-never-answered exercise is excluded from the score: it counts as neither correct nor wrong, and its points are not added to the total possible points.</p></div>';
  S.skippedPool.forEach(function(id, i){
    var ex = EXAM.exercises.filter(function(x){ return x.id===id; })[0];
    var row = mk('div','skipitem');
    row.innerHTML = '<span class="t">\u26A0 Skipped</span><span>'+ex.summary+'</span>';
    var b = mk('button','primary','Answer now');
    b.type='button';
    b.addEventListener('click', function(){
      S.returnTo = 'review';
      S.idx = S.order.map(function(x){return x.id;}).indexOf(id);
      S.phase = 'exam';
      renderEx();
    });
    row.appendChild(b);
    main.appendChild(row);
  });
  var acts = mk('div','actions');
  var sub2 = mk('button','primary','\u2713 Submit exam (final results)');
  sub2.type='button'; sub2.setAttribute('aria-label','Submit exam and show final results');
  sub2.addEventListener('click', function(){ finishExam(); });
  acts.appendChild(sub2);
  main.appendChild(acts);
  renderHeader();
}
/* ---------------- results ---------------- */
function finishExam(){
  S.phase = 'results';
  setState('ENDED');
  var hpF = $('#btnPause'); if(hpF){ hpF.classList.add('hidden'); }
  var hbF = $('#hbtnHint'); if(hbF){ hbF.classList.add('hidden'); }
  var sbF = $('#hbtnSkip'); if(sbF){ sbF.classList.add('hidden'); }
  var main = $('#exammain'); if(main){ main.remove(); }
  var sum = 0, cnt = 0, full = 0, part = 0, partSum = 0, zero = 0, skipped = 0;
  S.order.forEach(function(ex){
    if(S.answered[ex.id]){
      cnt++; sum += S.credits[ex.id];
      var cr = S.credits[ex.id];
      if(cr >= 0.999){ full++; } else if(cr > 0){ part++; partSum += cr; } else { zero++; }
    } else if(S.skippedPool.indexOf(ex.id) !== -1 || S.checked[ex.id] !== true){ skipped++; }
  });
  var pct = cnt > 0 ? Math.round((sum/cnt)*100) : 0;
  var passed = pct >= EXAM.passMark;
  var used = EXAM.timerSeconds - T.remain;
  var wrap = mk('main','wrap results'); wrap.id='resmain';
  var v = mk('div','verdict '+(passed?'pass':'fail'));
  v.innerHTML = (passed ? '\u2713 PASS' : '\u2717 FAIL') + ' \u2014 final score '+sum.toFixed(1)+' / '+cnt+' answered \u2014 <span class="big">'+pct+'%</span>';
  var grid = mk('div','resgrid');
  grid.innerHTML =
    '<div class="rescard ok"><div class="n">'+full+'</div><div>\u2713 Fully correct</div></div>'+
    '<div class="rescard part"><div class="n">'+part+'</div><div>\u2713 Partially correct'+(part>0?' (avg '+(partSum/part).toFixed(2)+')':'')+'</div></div>'+
    '<div class="rescard bad"><div class="n">'+zero+'</div><div>\u2717 Fully incorrect</div></div>'+
    '<div class="rescard skip"><div class="n">'+skipped+'</div><div>\u26A0 Skipped \u2014 excluded</div></div>';
  var info = mk('div','card');
  info.innerHTML = '<p><b>Time used:</b> '+fmtClock(used)+' of '+fmtClock(EXAM.timerSeconds)+' budget \u00B7 <b>Paused manually:</b> '+fmtClock(S.manualTotal)+
    ' \u00B7 <b>Paused for feedback review:</b> '+fmtClock(S.reviewTotal)+'</p>'+
    '<p>Percentage computed over answered exercises only. Pass mark: '+EXAM.passMark+'%. '+(passed ?
    'Well done \u2014 you demonstrated a working command of '+EXAM.objectID+' at this severity.' :
    'You must retake this exam to reach the pass mark. Study the explanations you saw after each Check, then press Retake Exam.')+'</p>';
  var acts = mk('div','actions');
  var rb = mk('button','primary','\u21BA Retake Exam');
  rb.type='button'; rb.setAttribute('aria-label','Retake the exam with reshuffled questions');
  rb.addEventListener('click', retake);
  acts.appendChild(rb);
  wrap.appendChild(v); wrap.appendChild(grid); wrap.appendChild(info); wrap.appendChild(acts);
  $('#app').appendChild(wrap);
  window.scrollTo({top:0, behavior:(smoothOK()?'smooth':'auto')});
  if(!S.reported){ S.reported = true; reportScore(sum, cnt); }
}
/* ---------------- site integration ---------------- */
function reportScore(creditSum, answeredCount){
  var percent = answeredCount > 0 ? Math.round((creditSum/answeredCount)*100) : 0;
  try {
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId: EXAM.topicId,
      batch: EXAM.batch,
      score: Math.round(creditSum*10)/10,
      total: answeredCount,
      percent: percent,
      passed: percent >= EXAM.passMark
    }, location.origin);
  } catch(e) { /* opened directly, not inside the site */ }
}
window.addEventListener('message', function(event){
  if(!event.data){ return; }
  if(event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT'){ return; }
  S.user = event.data.username || '';
  S.country = event.data.country || '';
  S.locale = event.data.locale || 'en';
  /* theme field is always 'dark'; the file is dark-only by contract, nothing to toggle */
});
/* ---------------- retake ---------------- */
function retake(){
  var hpR = $('#btnPause'); if(hpR){ hpR.classList.remove('hidden'); }
  S.idx = 0; S.credits = {}; S.answered = {}; S.checked = {}; S.hintUsed = {};
  S.skippedPool = []; S.returnTo = null; S.flowState = {}; S.manualTotal = 0; S.reviewTotal = 0;
  S.reported = false; S.autoChecked = false;
  T.remain = EXAM.timerSeconds; T.state = 'IDLE';
  S.order = shuffle(EXAM.exercises);
  var rm = $('#resmain'); if(rm){ rm.remove(); }
  var em = $('#exammain');
  if(!em){ em = mk('main','wrap'); em.id='exammain'; $('#app').appendChild(em); }
  else { em.innerHTML=''; }
  startTimer();
  renderEx();
}
/* ---------------- boot ---------------- */
document.addEventListener('DOMContentLoaded', function(){ renderIntro(); });

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
