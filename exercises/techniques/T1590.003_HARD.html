/* ---------- grading ---------- */
function hasAnswer(ex,at){
  var t=ex.type;
  if(t==='qcm')return at.sel!=null;
  if(t==='multi')return at.selSet&&Object.keys(at.selSet).length>0;
  if(t==='match')return at.matches&&Object.keys(at.matches).length>0;
  if(t==='order')return true;
  if(t==='blank')return at.blanks&&Object.keys(at.blanks).some(function(k){return String(at.blanks[k]||'').trim()!=='';});
  if(t==='cloze')return at.cloze&&Object.keys(at.cloze).length>0;
  if(t==='terminal')return String(at.term||'').trim()!=='';
  if(t==='dragdrop')return at.place&&Object.keys(at.place).length>0;
  if(t==='steps'){var k=at.stepIdx||0;return at['stepSel'+k]!=null;}
  return false;
}
function grade(ex,at){
  var t=ex.type,H=0,W=0,N=1,items=[],answerLine='',extra={};
  var i;
  if(t==='qcm'){
    N=1;var sel=at.sel!=null?ex.options[at.sel]:null;
    var corr=ex.options.filter(function(o){return o.correct;})[0];
    if(sel&&sel.correct){H=1;items.push({st:'ok',name:sel.t,why:sel.why||''});}
    else{W=1;
      if(sel)items.push({st:'bad',name:sel.t,why:sel.why||''});
      items.push({st:'miss',name:corr.t,why:corr.why||''});
    }
    answerLine='Correct answer: <b>'+esc(corr.t)+'</b>';
  } else if(t==='multi'){
    var rights=ex.options.filter(function(o){return o.correct;});
    N=rights.length;
    ex.options.forEach(function(o){
      var picked=at.selSet&&at.selSet[String(ex.options.indexOf(o))];
      if(o.correct&&picked){H++;items.push({st:'ok',name:o.t,why:o.why||''});}
      else if(o.correct&&!picked){items.push({st:'miss',name:o.t,why:o.why||''});}
      else if(!o.correct&&picked){W++;items.push({st:'bad',name:o.t,why:o.why||''});}
    });
    answerLine='Correct answers: <b>'+esc(rights.map(function(o){return o.t;}).join(' • '))+'</b>';
  } else if(t==='match'){
    N=ex.pairs.length;
    ex.pairs.forEach(function(p,i){
      var pick=(at.matches||{})[String(i)]||'';
      if(pick===p.r){H++;items.push({st:'ok',name:p.l+' → '+p.r,why:p.why||''});}
      else if(pick){W++;var d=(ex.decoys||[]).filter(function(x){return x.r===pick;})[0];
        items.push({st:'bad',name:p.l+' → '+pick,why:(d&&d.why)?d.why:(p.why||'')});}
      else{items.push({st:'miss',name:p.l+' → '+p.r,why:p.why||''});}
    });
    answerLine='Correct pairs: <b>'+esc(ex.pairs.map(function(p){return p.l+' → '+p.r;}).join(' • '))+'</b>';
  } else if(t==='order'){
    N=ex.items.length;
    ex.items.forEach(function(_,p){
      var placed=at.iord[p];
      if(placed===p){H++;items.push({st:'ok',name:(p+1)+'. '+ex.items[p],why:''});}
      else{W++;items.push({st:'bad',name:'Position '+(p+1)+': you placed “'+ex.items[placed]+'” — correct: “'+ex.items[p]+'”',why:ex.itemWhy?ex.itemWhy[p]||'':'Belongs in position '+(p+1)+'.'});}
    });
    answerLine='Correct order: <b>'+esc(ex.items.map(function(x,i){return (i+1)+'. '+x;}).join(' → '))+'</b>';
  } else if(t==='blank'){
    N=ex.blanks.length;
    ex.blanks.forEach(function(b,i){
      var v=norm((at.blanks||{})[String(i)]);
      var ok=b.accept.map(norm).indexOf(v)>=0;
      if(v===''){items.push({st:'miss',name:(b.label||'Blank '+(i+1))+': '+b.accept[0],why:b.why||''});}
      else if(ok){H++;items.push({st:'ok',name:(b.label||'Blank '+(i+1))+': '+v,why:b.why||''});}
      else{W++;items.push({st:'bad',name:(b.label||'Blank '+(i+1))+': you typed “'+v+'” — accepted: '+b.accept.join(' / '),why:b.why||''});}
    });
    answerLine='Accepted answers: <b>'+esc(ex.blanks.map(function(b){return (b.label||'blank')+': '+b.accept[0];}).join(' • '))+'</b>';
  } else if(t==='cloze'){
    N=ex.choices.length;
    for(i=0;i<N;i++){
      var sel2=(at.cloze||{})[String(i)];
      var cword=ex.choices[i][ex.correct[i]];
      if(sel2==null){items.push({st:'miss',name:'Blank '+(i+1)+': '+cword,why:ex.why[i]||''});}
      else if(sel2===ex.correct[i]){H++;items.push({st:'ok',name:'Blank '+(i+1)+': '+cword,why:ex.why[i]||''});}
      else{W++;items.push({st:'bad',name:'Blank '+(i+1)+': you chose “'+ex.choices[i][sel2]+'” — correct: “'+cword+'”',why:ex.why[i]||''});}
    }
    answerLine='Correct words: <b>'+esc(ex.choices.map(function(c,i){return 'blank '+(i+1)+': '+c[ex.correct[i]];}).join(' • '))+'</b>';
  } else if(t==='terminal'){
    var input=norm(at.term);
    N=ex.elements.length;
    ex.elements.forEach(function(el){
      var ok=new RegExp(el.re,'i').test(input);
      if(ok){H++;items.push({st:'ok',name:el.label,why:el.why||''});}
      else{items.push({st:'miss',name:el.label,why:(el.why||'')+' (missing from your command)'});}
    });
    (ex.bads||[]).forEach(function(b){
      if(new RegExp(b.re,'i').test(input)){
        W++;items.push({st:b.dangerous?'danger':'bad',name:b.dangerous?'DANGEROUS — NEAR MISS':'Wrong element',why:b.note});
      }
    });
    extra.canonical=ex.canonical;
    answerLine='Canonical command: <b class="mono">'+esc(ex.canonical)+'</b>';
  } else if(t==='dragdrop'){
    N=ex.slots.length;
    ex.slots.forEach(function(s,i){
      var k=(at.place||{})[String(i)],chip=k?ex.chips.filter(function(x){return x.k===k;})[0]:null;
      if(chip&&k===s.accept){H++;items.push({st:'ok',name:s.label+' ← '+chip.t,why:s.why||''});}
      else if(chip){W++;items.push({st:'bad',name:s.label+' ← '+chip.t+' — correct: '+chipName(ex,s.accept),why:(chip.why||'')+' '+(s.why||'')});}
      else{items.push({st:'miss',name:s.label+' ← '+chipName(ex,s.accept),why:s.why||''});}
    });
    answerLine='Correct placement: <b>'+esc(ex.slots.map(function(s){return s.label+' ← '+chipName(ex,s.accept);}).join(' • '))+'</b>';
  } else if(t==='steps'){
    N=ex.steps.length;
    ex.steps.forEach(function(st,k){
      var sel3=(at.stepAnswers||{})[k];
      var corr2=st.options.filter(function(o){return o.correct;})[0];
      if(sel3==null){items.push({st:'miss',name:'Step '+(k+1)+': '+corr2.t,why:corr2.why||''});}
      else if(sel3===st.options.indexOf(corr2)){H++;items.push({st:'ok',name:'Step '+(k+1)+': '+corr2.t,why:corr2.why||''});}
      else{var chosen=st.options[sel3];W++;items.push({st:'bad',name:'Step '+(k+1)+': you chose “'+chosen.t+'” — correct: “'+corr2.t+'”',why:corr2.why||''});}
    });
    answerLine='Correct choices: <b>'+esc(ex.steps.map(function(st,k){return 'Step '+(k+1)+': '+st.options.filter(function(o){return o.correct;})[0].t;}).join(' • '))+'</b>';
  }
  var credit=scoreExercise(H,W,N);
  if(at.hintUsed)credit=Math.max(0,credit-0.10);
  return {credit:credit,H:H,W:W,N:N,items:items,answerLine:answerLine,extra:extra};
}
function chipName(ex,k){var c=ex.chips.filter(function(x){return x.k===k;})[0];return c?c.t:k;}
/* ---------- check / next / skip / hint / pause ---------- */
function onCheck(){
  var ex=curEx();if(!ex)return;
  var at=atState(ex);
  if(at.checked)return;
  if(S.timer.state==='PAUSED_MANUAL')return;
  if(!hasAnswer(ex,at)){
    $('#notice').innerHTML='<div class="noticeline">✋ Select or type an answer first — or press ⚠ Skip if you want to come back later.</div>';
    return;
  }
  /* FIRST ACTION: auto-pause the timer before rendering feedback */
  if(S.timer.state==='RUNNING')setState('PAUSED_AUTO_CHECK');
  /* record a pending final-step answer before grading (steps type) */
  if(ex.type==='steps'&&!at.checked){
    var k=at.stepIdx||0;
    if(at['stepSel'+k]!=null&&at.stepAnswers[k]==null)at.stepAnswers[k]=at['stepSel'+k];
  }
  var res=grade(ex,at);
  at.checked=true;at.credit=res.credit;
  S.answered[ex.id]=true;
  delete S.skipped[ex.id];
  S.creditSum+=res.credit;S.answeredCount++;
  showFeedback(ex,at,true,res);
  updateHeader();
  var fb=$('#fb-root');if(fb)fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function fbRow(it){
  var map={ok:['✓ Correct','ok'],bad:['✗ Wrong','bad'],miss:['○ Missed','miss'],danger:['✗ DANGEROUS — NEAR MISS','danger']};
  var m=map[it.st]||map.miss;
  return '<div class="it"><span class="i '+m[1]+'" aria-label="'+(it.st==='ok'?'Correct':it.st==='miss'?'Missed':'Wrong')+'">'+m[0]+'</span><span><b>'+esc(it.name)+'</b>'+(it.why?'<span class="w"> — '+esc(it.why)+'</span>':'')+'</span></div>';
}
function showFeedback(ex,at,animate,res){
  res=res||grade(ex,at);
  var cls,icon,label;
  if(res.credit>=1){cls='fb-correct';icon='✓';label='CORRECT';}
  else if(res.credit>0){cls='fb-partial';icon='✓';label='PARTIALLY CORRECT';}
  else{cls='fb-incorrect';icon='✗';label='INCORRECT';}
  var credLine='credit '+fmt2(res.credit)+' · '+res.H+'/'+res.N+' items correct';
  if(at.hintUsed)credLine+=' · hint −0.10';
  var isLast=S.idx===S.order.length-1;
  var canonical=ex.type==='terminal'?'<div class="copyblk"><pre>'+esc(ex.canonical)+'</pre></div>':'';
  var itemsHTML='<div class="items">'+res.items.map(fbRow).join('')+'</div>';
  $('#fb-root').innerHTML='<div class="fb '+cls+'" role="status">'+
    '<div class="fb-h"><span aria-hidden="true">'+icon+'</span> '+label+'<span class="cred">'+credLine+'</span></div>'+
    '<div class="fb-b">'+
      '<p class="answer-line">'+res.answerLine+'</p>'+canonical+itemsHTML+
      '<div class="expl">'+(ex.explanation||'')+'</div>'+
    '</div></div>'+
    '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:12px">'+
      '<button class="btn btn-primary" id="b-next">'+(isLast?'Final Submit ▸':'Next ▸')+'</button></div>';
  $('#b-check').disabled=true;
  var bn=$('#b-next');bn.addEventListener('click',onNext);
  /* reveal marks on options */
  revealMarks(ex,at,res);
  /* lock widgets */
  lockWidgets();
  updateHeader();
  var fb=$('#fb-root');
  var reduceMotion=false;
  try{reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  if(fb)fb.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'nearest'});
}
function revealMarks(ex,at,res){
  var t=ex.type,i;
  if(t==='qcm'||t==='multi'){
    $$('.opt').forEach(function(b){
      var oi=parseInt(b.getAttribute('data-oi'),10);var o=ex.options[oi];
      b.classList.add('reveal');
      var mark=document.createElement('span');mark.className='mark';
      if(o.correct){mark.className+=' ok';mark.setAttribute('aria-label','Correct option');mark.innerHTML='✓ Correct';}
      else if(at.selSet&&at.selSet[String(oi)]||t==='qcm'&&at.sel===oi){mark.className+=' bad';mark.setAttribute('aria-label','Wrong option');mark.innerHTML='✗ Wrong';}
      b.appendChild(mark);
    });
  } else if(t==='match'){
    $$('.selct').forEach(function(s){
      var mi=parseInt(s.getAttribute('data-mi'),10);
      s.disabled=true;s.classList.add((at.matches||{})[String(mi)]===ex.pairs[mi].r?'ok':'bad');
    });
  } else if(t==='order'){
    $$('.ord-it').forEach(function(row,p){
      row.querySelector('.otx').getAttribute('data-oi');
      var placed=at.iord[p];
      row.classList.add(placed===p?'ok':'bad');
      $$('.mv',row).forEach(function(b){b.disabled=true;});
    });
  } else if(t==='blank'){
    $$('.blank-input').forEach(function(inp){
      var bi=inp.getAttribute('data-bi');inp.disabled=true;
      var v=norm(at.blanks&&at.blanks[bi]);
      inp.classList.add(ex.blanks[bi].accept.map(norm).indexOf(v)>=0?'ok':'bad');
    });
  } else if(t==='cloze'){
    $$('.cloze select').forEach(function(s){
      var ci=s.getAttribute('data-ci');s.disabled=true;
      s.classList.add(parseInt(s.value,10)===ex.correct[parseInt(ci,10)]?'ok':'bad');
    });
  } else if(t==='dragdrop'){
    $$('.slot').forEach(function(sl){
      var si=sl.getAttribute('data-si'),k=(at.place||{})[si];
      sl.classList.add(k===ex.slots[si].accept?'filled-ok':'filled-bad');
    });
    $$('.dchip').forEach(function(c){c.draggable=false;});
  } else if(t==='terminal'){
    var ti=$('#t-in');if(ti)ti.disabled=true;
  }
}
function lockWidgets(){
  $$('.opt').forEach(function(b){b.disabled=true;});
  $$('.dchip').forEach(function(c){c.disabled=true;});
  $$('.bchip').forEach(function(c){c.disabled=true;});
}
function onNext(){
  var ex=curEx();var at=ex?atState(ex):null;
  if(at&&!at.checked)return;
  if(S.timer.state==='PAUSED_AUTO_CHECK')setState('RUNNING');
  if(S.flow==='review-jump'){S.flow='linear';openReview(false);return;}
  if(S.idx>=S.order.length-1){
    var pend=Object.keys(S.skipped).filter(function(k){return !S.answered[k];});
    if(pend.length){openReview(false);return;}
    finish();return;
  }
  S.idx++;renderExercise();
}
function onSkip(){
  var ex=curEx();if(!ex)return;
  var at=atState(ex);
  if(at.checked)return; /* already answered */
  if(S.timer.state==='PAUSED_MANUAL')return;
  S.skipped[ex.id]=true;
  if(S.flow==='review-jump'){S.flow='linear';openReview(false);return;}
  if(S.idx>=S.order.length-1){openReview(false);return;}
  S.idx++;renderExercise();
}
function onHint(){
  var ex=curEx();if(!ex)return;
  var at=atState(ex);
  if(at.hintUsed||at.checked)return;
  if(S.timer.state==='PAUSED_MANUAL')return;
  at.hintUsed=true;
  var box=$('#notice');
  box.innerHTML='<div class="hintbox"><div class="t">? Hint — costs 10% of this exercise\'s credit</div>'+esc(ex.hint||'')+'</div>';
  updateHeader();
  var bh=$('#b-hint');if(bh){bh.disabled=true;}
}
function onPause(){
  var st=S.timer.state;
  if(st==='RUNNING'||st==='PAUSED_AUTO_CHECK'){
    S.timer.prevState=st;setState('PAUSED_MANUAL');
    var card=$('#x-card');
    if(card&&!$('#pause-veil')){
      var v=document.createElement('div');v.className='veil';v.id='pause-veil';
      v.innerHTML='<div class="veil-card"><div class="pi" aria-hidden="true">⏸</div><div class="pw">⏸ PAUSED — manual (press Resume)</div><div class="ps">The exercise is hidden and the timer is stopped.</div><div style="margin-top:14px"><button class="btn btn-primary" id="b-resume">▶ Resume</button></div></div>';
      card.appendChild(v);
      $('#b-resume').addEventListener('click',onResume);
    }
  }
}
function onResume(){
  setState(S.timer.prevState||'RUNNING');
  var v=$('#pause-veil');if(v)v.remove();
}
/* ---------- review skipped ---------- */
function openReview(fromTimeout){
  S.view='review';
  if(S.timer.state==='PAUSED_AUTO_CHECK')setState('RUNNING');
  S.flow='linear';
  var pend=S.order.filter(function(id){return S.skipped[id]&&!S.answered[id];});
  var ended=S.timer.state==='ENDED';
  app.innerHTML='<div class="wrap">'+
    '<div class="rev-clock"><span aria-hidden="true">'+(ended?'⏹':'▶')+'</span> Timer <b class="mono-num" id="t-clock">'+fmtClock(S.timer.remaining)+'</b> · '+(ended?'⏹ ENDED':'▶ RUNNING')+'</div>'+
    '<div class="card sec"><h2><span class="ic" aria-hidden="true">⚠</span> Review skipped exercises</h2>'+
    '<p class="lead">These exercises are still unanswered. '+(ended?'The timer has ended, so they can no longer be answered — they will be excluded from your score.':'You can answer them now, as many times as you like, until the timer ends.')+'</p>'+
    pend.map(function(id){
      var ex=exById(id);
      return '<div class="rev-item"><span class="badge badge-skip"><span aria-hidden="true">⚠</span> Skipped</span><div class="t"><b>'+esc(ex.title||ex.id)+'</b><span>'+esc(ex.question)+'</span></div>'+
        (ended?'':'<button class="btn btn-primary btn-sm" data-ans="'+id+'">Answer now</button>')+'</div>';
    }).join('')+
    (pend.length===0?'<p>Nothing skipped — everything was answered.</p>':'')+
    '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px">'+
    '<button class="btn btn-ghost" id="rv-back">'+(ended?'':'◂ Back to exam')+'</button>'+
    '<button class="btn btn-green" id="rv-finish">Submit exam ▸</button></div>'+
    '</div></div>';
  $$('#app [data-ans]').forEach(function(b){
    b.addEventListener('click',function(){
      var id=b.getAttribute('data-ans');
      S.idx=S.order.indexOf(id);S.flow='review-jump';S.view='exam';
      renderExercise();
      /* after Check on this exercise, Next returns to the review screen */
    });
  });
  var back=$('#rv-back');
  if(back)back.addEventListener('click',function(){
    if(Object.keys(S.skipped).some(function(k){return !S.answered[k];})&&S.idx<S.order.length){
      S.view='exam';renderExercise();
    } else {finish();}
  });
  $('#rv-finish').addEventListener('click',finish);
  updateHeader();
}
/* ---------- results ---------- */
function finish(){
  S.view='results';
  if(S.timer.state!=='ENDED')setState('ENDED');
  var full=0,part=0,partSum=0,zero=0,skippedN=0;
  S.order.forEach(function(id){
    var at=S.at[id];
    if(S.skipped[id]&&!S.answered[id]){skippedN++;return;}
    if(!at||!at.checked){skippedN++;return;}
    if(at.credit>=1)full++;
    else if(at.credit>0){part++;partSum+=at.credit;}
    else zero++;
  });
  var percent=pct(S.creditSum,S.answeredCount);
  var passed=percent>=70;
  app.innerHTML='<div class="wrap">'+
    '<div class="card res-hero '+(passed?'pass':'fail')+'">'+
      '<div class="lbl" aria-label="'+(passed?'PASS':'FAIL')+'">'+(passed?'✓ PASS':'✗ FAIL')+'</div>'+
      '<div class="big mono-num">'+percent+'%</div>'+
      '<div style="color:var(--text-secondary)">Score '+fmt1(S.creditSum)+' / '+S.answeredCount+' answered · pass mark 70% · '+esc(EXAM.attckId)+' — '+esc(SEV_WORD[SEV])+'</div>'+
      '<div style="margin-top:10px;color:'+(passed?'var(--state-correct)':'var(--state-incorrect)')+';font-weight:700">'+
        (passed?'Certificate panel: you demonstrated command of '+esc(EXAM.attckId)+' at '+SEV_WORD[SEV]+' level.':'You must retake this exam. Review the explanations, then press Retake Exam.')+'</div>'+
      '<div style="margin-top:16px;display:flex;gap:10px;justify-content:center">'+
        '<button class="btn btn-primary" id="b-retake">↻ Retake Exam</button></div>'+
    '</div>'+
    '<div class="card sec"><h2><span class="ic" aria-hidden="true">☰</span> Result breakdown</h2>'+
      '<div class="res-grid">'+
        '<div class="stat ok"><div class="v">'+full+'</div><div class="l">✓ Fully correct</div></div>'+
        '<div class="stat part"><div class="v">'+part+'</div><div class="l">✓ Partially correct'+(part?' · avg '+fmt2(partSum/part):'')+'</div></div>'+
        '<div class="stat bad"><div class="v">'+zero+'</div><div class="l">✗ Fully incorrect</div></div>'+
        '<div class="stat skip"><div class="v">'+skippedN+'</div><div class="l">⚠ Skipped — excluded</div></div>'+
        '<div class="stat pause"><div class="v">'+Math.round(S.pauseManualMs/1000)+'s</div><div class="l">⏸ Time paused manually</div></div>'+
        '<div class="stat pause"><div class="v">'+Math.round(S.pauseAutoMs/1000)+'s</div><div class="l">⏸ Time paused for feedback</div></div>'+
      '</div>'+
      '<h2 style="margin-top:18px;font-size:16px">Per-exercise results</h2>'+
      '<div class="res-list">'+S.order.map(function(id){
        var ex=exById(id),at=S.at[id]||{};
        var st,cl;
        if(S.skipped[id]&&!S.answered[id]||!at.checked){st='⚠ Skipped — excluded';cl='skip';}
        else if(at.credit>=1){st='✓ Correct';cl='ok';}
        else if(at.credit>0){st='✓ Partially correct';cl='part';}
        else{st='✗ Incorrect';cl='bad';}
        return '<div class="res-row"><span class="st '+cl+'">'+st+'</span><span>'+esc(ex.title||ex.id)+'</span><span class="cr">'+(at.checked?('credit '+fmt2(at.credit)):'—')+'</span></div>';
      }).join('')+'</div>'+
    '</div></div>';
  $('#b-retake').addEventListener('click',function(){
    S=newSession(true);resetCaches();renderIntro();
    /* retake goes straight back to intro so the learner restarts cleanly */
  });
  reportScore();
}
function reportScore(){
  if(S.fired)return;
  S.fired=true;
  var passMark=META.passMark||70;
  var percent=pct(S.creditSum,S.answeredCount);
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:META.topicId, batch:META.batch,
      score:Math.round(S.creditSum), total:S.answeredCount,
      percent:percent, passed:percent>=passMark
    },location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}
/* ---------- handshake ---------- */
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  if(S&&event.data.username)S.user=event.data.username;
  else if(event.data.username){/* intro not started yet */
    S=S||newSession(false);S.user=event.data.username;renderIntro();
  }
  /* theme is always 'dark'; files are dark-only by contract — no toggle. */
});
/* ---------- boot ---------- */
S=newSession(false);
renderIntro();


</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
