<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1586.002 Compromise Accounts: Email Accounts — HARD exam v3.0</title>
<style>

:root{
  --bg:#0b0f14;
  --bg-surface:#111823;
  --bg-surface-2:#0d1420;
  --bg-elev:#161f2e;
  --bg-elev-2:#1b2637;
  --border:#223048;
  --border-soft:#1a2740;
  --text:#d7e3f2;
  --text-bright:#f2f7fd;
  --text-muted:#9fb0c3;
  --blue:#4da3ff;
  --blue-dim:#132f4d;
  --amber:#e8b339;
  --amber-dim:#38300f;
  --green:#46c26e;
  --green-dim:#11321e;
  --orange:#f08a3e;
  --orange-dim:#3a2412;
  --red:#f0554d;
  --red-dim:#3a1614;
  --focus:#4da3ff;
  --blue-hover:#1a3d63;
  --green-hover:#17462a;
  --accent-scen:#4da3ff;
  --accent-quest:#e8b339;
  --accent-ans:#46c26e;
  --sans:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono","Roboto Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --radius:10px;
  --radius-sm:7px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{color:var(--text-bright);line-height:1.25;}
code,.mono{font-family:var(--mono);}
code{
  background:var(--bg-surface-2);
  border:1px solid var(--border-soft);
  color:var(--text-bright);
  padding:1px 5px;border-radius:5px;font-size:.92em;
}
a{color:var(--blue);}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px;}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 64px;}
/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--bg-surface);
  border-bottom:1px solid var(--border);
}
.topbar-in{
  max-width:980px;margin:0 auto;padding:8px 16px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.tb-title{
  color:var(--text-bright);font-weight:700;font-size:.95rem;
  margin-right:auto;display:flex;align-items:center;gap:8px;min-height:32px;
}
.tb-title .mono{color:var(--blue);}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--bg-elev);border:1px solid var(--border);
  color:var(--text);border-radius:999px;
  padding:6px 12px;font-size:.85rem;min-height:32px;white-space:nowrap;
}
.chip .mono{font-variant-numeric:tabular-nums;}
.chip-score{border-color:var(--border);}
.chip-state-running{border-color:var(--border);color:var(--text-muted);}
.chip-state-paused{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);}
.chip-state-auto{border-color:var(--blue);color:var(--blue);background:var(--blue-dim);}
.chip-state-ended{border-color:var(--red);color:var(--red);background:var(--red-dim);}
/* ---------- badges ---------- */
.badge{
  display:inline-flex;align-items:center;gap:6px;
  border-radius:6px;padding:5px 11px;
  font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid;min-height:32px;
}
.badge-easy{color:var(--green);border-color:var(--green);background:var(--green-dim);}
.badge-medium{color:var(--amber);border-color:var(--amber);background:var(--amber-dim);}
.badge-hard{color:var(--orange);border-color:var(--orange);background:var(--orange-dim);}
.badge-extremely-hard{color:var(--red);border-color:var(--red);background:var(--red-dim);}
/* ---------- buttons ---------- */
.btn{
  font-family:var(--sans);font-size:.95rem;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;min-width:44px;padding:8px 18px;
  border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--bg-elev);color:var(--text-bright);
  cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .05s ease;
}
.btn:hover{background:var(--bg-elev-2);}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--blue-dim);border-color:var(--blue);color:var(--text-bright);}
.btn-primary:hover{background:var(--blue-hover);}
.btn-green{background:var(--green-dim);border-color:var(--green);color:var(--text-bright);}
.btn-green:hover{background:var(--green-hover);}
.btn-danger{background:var(--red-dim);border-color:var(--red);color:var(--text-bright);}
.btn-ghost{background:transparent;}
.btn-small{min-height:36px;padding:4px 12px;font-size:.85rem;}
/* ---------- intro screen ---------- */
.intro-card{
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:18px;overflow:hidden;
}
.intro-head{
  padding:22px 22px 18px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,var(--bg-elev),var(--bg-surface));
}
.intro-kicker{
  color:var(--blue);font-weight:700;font-size:.8rem;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:6px;display:flex;gap:8px;align-items:center;
}
.intro-head h1{margin:0 0 4px;font-size:1.5rem;}
.intro-sub{color:var(--text-muted);font-size:.95rem;}
.intro-facts{
  display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;
}
.intro-sec{padding:18px 22px;border-bottom:1px solid var(--border-soft);}
.intro-sec:last-child{border-bottom:none;}
.intro-sec h2{font-size:1.08rem;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
.intro-sec h2 .ic{color:var(--blue);}
.intro-sec p{margin:0 0 10px;}
.intro-sec ul{margin:0 0 10px;padding-left:22px;}
.intro-sec li{margin-bottom:6px;}
.kw-cloud{display:flex;flex-wrap:wrap;gap:8px;}
.kw{
  background:var(--bg-elev);border:1px solid var(--border);
  color:var(--text);border-radius:999px;padding:6px 13px;font-size:.86rem;
  display:inline-flex;align-items:center;gap:7px;
}
.kw::before{content:"◆";color:var(--blue);font-size:.72em;}
.how-grid{display:grid;grid-template-columns:1fr;gap:8px;}
.how-row{display:flex;gap:10px;align-items:flex-start;}
.how-ic{
  flex:0 0 auto;width:26px;height:26px;border-radius:7px;margin-top:1px;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--blue-dim);color:var(--blue);font-size:.85rem;font-weight:700;
}
.start-row{padding:18px 22px 24px;}
.start-btn{width:100%;font-size:1.05rem;}
/* ---------- exercise card ---------- */
.card{
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}
.card-body{padding:16px;}
.blk{
  border:1px solid var(--border-soft);
  border-left:4px solid var(--border);
  border-radius:var(--radius-sm);
  background:var(--bg-surface-2);
  margin-bottom:14px;overflow:hidden;
}
.blk-scen{border-left-color:var(--accent-scen);}
.blk-quest{border-left-color:var(--accent-quest);}
.blk-ans{border-left-color:var(--accent-ans);}
.blk-tag{
  font-size:.72rem;font-weight:800;letter-spacing:.16em;
  padding:7px 12px 0;color:var(--text-muted);
  display:flex;align-items:center;gap:7px;
}
.blk-scen .blk-tag{color:var(--accent-scen);}
.blk-quest .blk-tag{color:var(--accent-quest);}
.blk-ans .blk-tag{color:var(--accent-ans);}
.blk-body{padding:10px 14px 14px;}
.scen-toggle{
  margin:0 0 8px;background:transparent;border:none;color:var(--blue);
  font:inherit;font-size:.85rem;cursor:pointer;padding:6px 2px;min-height:32px;
  display:inline-flex;align-items:center;gap:6px;
}
.scen-clamp{overflow:hidden;}
.persp-tag{
  display:inline-flex;align-items:center;gap:6px;margin-left:auto;
  font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);border:1px solid var(--border-soft);
  border-radius:999px;padding:2px 9px;
}
/* options */
.opt{
  display:flex;align-items:flex-start;gap:11px;
  background:var(--bg-elev);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:10px 12px;margin-bottom:9px;cursor:pointer;
  min-height:44px;transition:border-color .12s ease,background .12s ease;
}
.opt:hover{border-color:var(--blue);background:var(--bg-elev-2);}
.opt input{margin-top:3px;accent-color:var(--blue);width:17px;height:17px;flex:0 0 auto;}
.opt-letter{
  flex:0 0 auto;width:24px;height:24px;border-radius:6px;margin-top:1px;
  background:var(--bg-surface-2);border:1px solid var(--border);
  color:var(--text-muted);font-size:.78rem;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;
}
.opt.sel{border-color:var(--blue);background:var(--blue-dim);}
.opt.sel .opt-letter{background:var(--blue-dim);color:var(--blue);border-color:var(--blue);}
.opt-note{
  margin:-3px 0 10px;font-size:.85rem;color:var(--text-muted);
  border-left:3px solid var(--border);padding:2px 0 2px 11px;
}
.sel-count{font-size:.85rem;color:var(--text-muted);margin:2px 0 10px;}
/* matching */
.match-row{
  display:grid;grid-template-columns:1fr 260px;gap:10px;align-items:center;
  background:var(--bg-elev);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:9px;min-height:44px;
}
.match-row select{
  width:100%;min-height:44px;background:var(--bg-surface-2);color:var(--text-bright);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  font:inherit;font-size:.92rem;padding:6px 8px;
}
/* order */
.order-row{
  display:flex;align-items:center;gap:10px;
  background:var(--bg-elev);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:9px;min-height:48px;
  cursor:grab;
}
.order-row.dragging{opacity:.4;}
.order-idx{
  flex:0 0 28px;height:28px;border-radius:7px;text-align:center;line-height:26px;
  background:var(--bg-surface-2);border:1px solid var(--border);
  color:var(--amber);font-weight:700;font-size:.85rem;
}
.order-row .grow{flex:1 1 auto;}
.mini-btn{
  flex:0 0 auto;width:38px;height:38px;border-radius:7px;
  background:var(--bg-surface-2);border:1px solid var(--border);
  color:var(--text-bright);cursor:pointer;font-size:.9rem;
  display:inline-flex;align-items:center;justify-content:center;
}
.mini-btn:hover{border-color:var(--blue);}
/* drag & drop */
.dnd-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.dnd-bankcol{grid-column:1 / -1;}
.zone{
  border:1.5px dashed var(--border);border-radius:var(--radius-sm);
  background:var(--bg-surface-2);padding:10px;min-height:96px;
  transition:border-color .12s ease;
}
.zone.over{border-color:var(--blue);}
.zone-h{font-size:.85rem;font-weight:700;color:var(--text-bright);margin:0 0 8px;
  display:flex;gap:8px;align-items:center;}
.zone-h .zi{color:var(--ans);}
.pill{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--bg-elev);border:1px solid var(--border);
  border-radius:999px;padding:7px 13px;margin:0 7px 7px 0;
  cursor:pointer;font-size:.9rem;min-height:40px;color:var(--text);
  transition:border-color .12s ease,background .12s ease;
}
.pill:hover{border-color:var(--blue);}
.pill.sel{border-color:var(--blue);background:var(--blue-dim);color:var(--text-bright);}
.pill .pi{color:var(--text-muted);font-size:.8rem;}
.dnd-hint{font-size:.83rem;color:var(--text-muted);margin:0 0 10px;}
/* fill */
.fill-input{
  background:var(--bg-surface-2);border:1px solid var(--border);
  border-radius:7px;color:var(--text-bright);font-family:var(--mono);
  font-size:.95rem;padding:8px 10px;min-height:44px;width:170px;margin:2px 4px;
}
.fill-input:focus{border-color:var(--blue);}
.fill-line{margin-bottom:10px;}
/* branch */
.step-tag{
  font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-muted);margin:0 0 6px;
}
.branch-opt{
  width:100%;text-align:left;margin-bottom:9px;justify-content:flex-start;
  padding:11px 14px;white-space:normal;
}
.branch-note{
  background:var(--bg-elev);border:1px solid var(--border-soft);
  border-left:3px solid var(--amber);border-radius:var(--radius-sm);
  padding:10px 13px;margin:0 0 12px;font-size:.93rem;color:var(--text);
}
/* terminal */
.term{
  background:var(--bg-surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:12px 14px;
}
.term-out{
  white-space:pre-wrap;word-break:break-word;
  font-size:.88rem;line-height:1.5;color:var(--text);
  max-height:280px;overflow-y:auto;margin:0 0 10px;
}
.term-line{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.term-prompt{color:var(--green);font-weight:700;font-size:.88rem;white-space:nowrap;}
.term-in{
  flex:1 1 220px;min-height:40px;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:7px;color:var(--text-bright);
  font-family:var(--mono);font-size:.92rem;padding:7px 10px;
}
.term-in:focus{border-color:var(--blue);}
.term-clar{
  background:var(--bg-elev);border:1px solid var(--border-soft);
  border-left:3px solid var(--blue);border-radius:var(--radius-sm);
  padding:9px 13px;font-size:.9rem;margin:0 0 12px;color:var(--text);
}
.tok-cmd{color:var(--blue);font-weight:600;}
.tok-flag{color:var(--amber);}
.tok-str{color:var(--green);}
.tok-dim{color:var(--text-muted);}
.term-err{color:var(--red);}
/* feedback */
.fb{
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:13px 15px;margin:4px 0 14px;background:var(--bg-elev);
}
.fb-good{border-color:var(--green);background:var(--green-dim);}
.fb-part{border-color:var(--amber);background:var(--amber-dim);}
.fb-bad{border-color:var(--red);background:var(--red-dim);}
.fb-danger{border-color:var(--red);background:var(--red-dim);box-shadow:inset 0 0 0 1px var(--red);}
.fb-head{font-weight:800;font-size:1rem;display:flex;align-items:center;gap:9px;color:var(--text-bright);}
.fb-good .fb-head{color:var(--green);}
.fb-part .fb-head{color:var(--amber);}
.fb-bad .fb-head,.fb-danger .fb-head{color:var(--red);}
.fb-credit{font-size:.88rem;color:var(--text-muted);margin:5px 0 8px;}
.fb-items{list-style:none;margin:0 0 9px;padding:0;}
.fb-items li{
  padding:5px 0 5px 2px;font-size:.9rem;
  border-bottom:1px dashed var(--border-soft);
}
.fb-items li:last-child{border-bottom:none;}
.it-c{color:var(--green);}
.it-w{color:var(--red);}
.it-m{color:var(--text-muted);}
.fb-explain{font-size:.93rem;color:var(--text);}
.fb-explain code{word-break:break-word;}
.fb-canonical{
  background:var(--bg-surface-2);border:1px solid var(--border);
  border-radius:7px;padding:9px 12px;margin:8px 0;font-size:.9rem;
  font-family:var(--mono);color:var(--text-bright);word-break:break-word;
}
/* action row */
.action-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.skip-warn{
  color:var(--amber);font-size:.85rem;display:inline-flex;gap:6px;align-items:center;
}
/* pause overlay */
.pause-ov{
  margin-top:14px;border:1px solid var(--amber);border-radius:var(--radius-sm);
  background:var(--amber-dim);padding:22px;text-align:center;
}
.pause-ov .big{font-size:1.15rem;font-weight:800;color:var(--amber);display:flex;gap:9px;align-items:center;justify-content:center;}
.pause-ov p{color:var(--text);margin:8px 0 14px;}
/* review hub */
.rev-item{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--bg-elev);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:10px;min-height:52px;
}
.rev-item .grow{flex:1 1 auto;min-width:200px;}
.rev-st{color:var(--amber);font-weight:700;display:inline-flex;gap:6px;align-items:center;font-size:.88rem;}
/* results */
.res-banner{
  border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;text-align:center;background:var(--bg-surface);
  margin-bottom:16px;
}
.res-banner.pass{border-color:var(--green);background:linear-gradient(180deg,var(--green-dim),var(--bg-surface));}
.res-banner.fail{border-color:var(--red);background:linear-gradient(180deg,var(--red-dim),var(--bg-surface));}
.res-pct{font-size:3rem;font-weight:800;color:var(--text-bright);font-variant-numeric:tabular-nums;}
.res-word{font-size:1.1rem;font-weight:800;display:inline-flex;gap:9px;align-items:center;}
.res-banner.pass .res-word{color:var(--green);}
.res-banner.fail .res-word{color:var(--red);}
.res-sub{color:var(--text-muted);margin-top:6px;font-size:.92rem;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px;}
.stat{
  background:var(--bg-surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:14px 16px;
}
.stat .k{color:var(--text-muted);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:7px;align-items:center;}
.stat .v{font-size:1.45rem;font-weight:800;color:var(--text-bright);margin-top:4px;font-variant-numeric:tabular-nums;}
.stat .s{font-size:.83rem;color:var(--text-muted);margin-top:2px;}
.stat-green .v{color:var(--green);}
.stat-amber .v{color:var(--amber);}
.stat-red .v{color:var(--red);}
.stat-blue .v{color:var(--blue);}
.res-table{width:100%;border-collapse:collapse;font-size:.9rem;}
.res-table th,.res-table td{border-bottom:1px solid var(--border-soft);padding:8px 10px;text-align:left;}
.res-table th{color:var(--text-muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;}
.res-table td .mono{font-variant-numeric:tabular-nums;}
/* toast */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--bg-elev-2);border:1px solid var(--blue);
  color:var(--text-bright);border-radius:999px;padding:10px 20px;
  font-size:.9rem;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.5);
}
/* responsive */
@media (max-width:760px){
  .match-row{grid-template-columns:1fr;}
  .dnd-grid{grid-template-columns:1fr;}
  .tb-title{width:100%;margin-right:0;}
  .intro-head h1{font-size:1.25rem;}
  .res-pct{font-size:2.3rem;}
  .blk-body{padding:9px 11px 12px;}
}
/* motion */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;}
}
@keyframes pulse-ok{0%{box-shadow:0 0 0 0 rgba(70,194,110,.35);}100%{box-shadow:0 0 0 12px rgba(70,194,110,0);}}
@keyframes fade-up{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.anim-fade{animation:fade-up .18s ease-out;}
.pulse-ok{animation:pulse-ok .5s ease-out;}

</style>
</head>
<body>
<div class="topbar" id="topbar" style="display:none">
  <div class="topbar-in">
    <div class="tb-title"><span class="mono">T1586.002</span><span>Compromise Accounts: Email Accounts</span></div>
    <span class="badge badge-hard" id="tb-sev" data-sev-badge>HARD</span>
    <span class="chip" id="tb-count">Exercise 1 of 15</span>
    <span class="chip" id="tb-timer" aria-label="Timer">⏱ --:--</span>
    <span class="chip chip-state-running" id="tb-state">▶ Running</span>
    <span class="chip chip-score" id="tb-score">Score: 0.00</span>
    <button class="btn btn-small" id="tb-hint" title="One hint per exercise (−0.10 credit)">△ Hint</button>
    <button class="btn btn-small" id="tb-skip" title="Move to the review list">⏭ Skip</button>
    <button class="btn btn-small" id="tb-pause" title="Stop the clock by hand">⏸ Pause</button>
  </div>
</div>
<main class="wrap">
  <div id="view-intro"></div>
  <div id="view-exam" style="display:none"><div id="exam-inner"></div><div id="pause-slot"></div></div>
  <div id="view-review" style="display:none"></div>

var EX = [{"id":"H01","type":"qcm","persp":"def","scenario":"Finance received “updated bank details” as a reply inside a 3-week-old vendor thread. The vendor’s real mailbox sent it; <code>SPF=pass DKIM=pass DMARC=pass<\/code>; the new IBAN differs from the one on the contract.","question":"Which interpretation should drive your next action?","options":["The vendor mailbox is likely compromised (T1586.002); authentication proves the path, not the intent — verify out-of-band","SPF/DKIM passing proves the vendor’s finance team approved the change","Your own DMARC configuration must be broken","Reply-chain context makes fraud impossible here"],"correct":0,"notes":["Right. A reply inside a real thread from a real mailbox is the textbook conversation-hijacking BEC pattern. Authentication passing actually <em>supports<\/em> the compromise hypothesis.","Authentication never certifies human intent — only the sending infrastructure.","Your DMARC inbound policy is unrelated to a passing external message.","The reply-chain context is exactly what the attacker weaponised."],"hint":"Which is more likely: a vendor suddenly changing IBANs mid-thread, or a vendor mailbox quietly taken over?","explain":"Thread hijacking from a compromised mailbox is high-yield BEC: all context is real, so only the payload (bank details) is fake. Correct action: verify via a known phone number, freeze the payment, and treat the vendor mailbox as compromised — they may be sending the same lure to dozens of their customers."},{"id":"H02","type":"multi","persp":"def","scenario":"You are writing the KQL/audit queries for “post-takeover mailbox behaviour”. A junior lists candidate Unified Audit Log indicators.","question":"Select <strong>all<\/strong> indicators that belong in the queries.","options":["<code>New-InboxRule<\/code> with delete or mark-as-read actions on security- or invoice-related words","<code>MailItemsAccessed<\/code> from an unfamiliar ASN or IP range","A new app password or an OAuth consent granted to an unknown application","External forwarding enabled on the mailbox","The Outlook theme colour changing from dark to light","The calendar colour of one series changing"],"correct":[0,1,2,3],"notes":["Yes — owner-atypical silent handling of security/invoice mail is the signature BEC persistence move.","Yes — mailbox <em>reads<\/em> from new infrastructure show collection in progress.","Yes — both create durable access that survives password resets if you miss them.","Yes — external forwarding is collection with the tap wide open.","No — cosmetic, user-controlled, zero security signal.","No — same: cosmetics are not takeover indicators."],"hint":"The four good ones all change <em>who can read the mail<\/em> or <em>where the mail goes<\/em>.","explain":"The queries should catch: silent mail handling (rules), anomalous mailbox reads (audit), durable alternative access (app passwords, OAuth grants), and outbound collection (external forwarding). Cosmetic personalisation carries no signal — including it only produces alert noise."},{"id":"H03","type":"term","persp":"def","scenario":"SOC evidence shell. Account <code>j.wesley<\/code> shows odd behaviour on the mail gateway. Your job: pull the sign-in history and isolate the <strong>failed<\/strong> logins so the pattern is readable.","question":"Run the command that lists j.wesley’s failed sign-in lines.","shell":{"promptStr":"analyst@soc-lab:~/cases/wesley$","banner":"SOC evidence shell (simulated) — type <span class='tok-dim'>help<\/span> to list tools.","helpText":"Tools:\n  show-logins <user>     print raw sign-in lines for a user\n  mailbox-rules <user>   list inbox rules for a user\n  check-auth <file.eml>  SPF/DKIM/DMARC summary for a message file\n  ls [dir]               list files\n  grep may be used as a pipe filter:  <tool> | grep WORD\n  help                   this text","tools":[{"re":"show-logins","out":"2026-09-14T02:11Z imap-login auth=FAIL user=j.wesley src=tor-exit-7.tor.example\n2026-09-14T02:12Z imap-login auth=FAIL user=j.wesley src=tor-exit-7.tor.example\n2026-09-14T02:14Z imap-login auth=OK   user=j.wesley src=tor-exit-7.tor.example mfa=none\n2026-09-14T02:20Z imap-login auth=OK   user=j.wesley src=mail-gw-2.corp.example mfa=ok"},{"re":"mailbox-rules","out":"no inbox rules found for j.wesley"},{"re":"check-auth","out":"usage: check-auth <file.eml>  (no .eml files in this case folder)"},{"re":"^ls","out":"mail-auth.log  cases/"},{"re":"^cat","out":"cat: use the provided case tools in this simulated shell"}]},"elements":[{"re":"show-logins","label":"Uses the show-logins tool","note":"The gateway history lives behind show-logins."},{"re":"j\\.wesley","label":"Targets the account j.wesley","note":"The account under investigation."},{"re":"grep\\s+\"?FAIL\"?","label":"Filters down to failed logins (grep FAIL)","note":"The question asks for the failed lines specifically."}],"nearMiss":[{"re":"reset-mailbox|purge|wipe|shred|rm\\s|delete","label":"destructive mailbox command","why":"That command would reset or destroy mailbox data — it destroys evidence and changes the system under investigation. This is a DANGEROUS near miss: the safe route is read-only querying, and containment comes after you know what happened."}],"canonical":"show-logins j.wesley | grep FAIL","dangerousExample":"reset-mailbox j.wesley","expected":"Expected finding: two failed IMAP logins at 02:11–02:12 from <code>tor-exit-7.tor.example<\/code>, then a successful login from the <em>same<\/em> host at 02:14 with <code>mfa=none<\/code> — a spray-then-success takeover pattern.","clarification":"Simulated shell — tools: <code>show-logins &lt;user&gt;<\/code>, <code>mailbox-rules &lt;user&gt;<\/code>; pipe to <code>grep WORD<\/code> to filter. The grader checks the <strong>last<\/strong> command you ran. Read-only commands only: destructive commands are flagged as dangerous near misses.","hint":"Pull the history first, then pipe it: <code>&lt;tool&gt; &lt;user&gt; | grep …<\/code>.","explain":"The canonical pipeline is <code>show-logins j.wesley | grep FAIL<\/code>. Reading the full history is fine exploration, but the deliverable is the failure pattern — and the interesting story is the <em>transition<\/em> from FAIL to OK on the same anonymising host, which is why you should eyeball the unfiltered output too."},{"id":"H04","type":"qcm","persp":"att","scenario":"An adversary runs a credential-proxy phishing kit (reverse-proxy style). The victim’s MFA succeeds on the real portal, and the kit steals the resulting session cookie. The attacker then imports the cookie into their own browser.","question":"Why does the victim’s MFA not stop the attacker afterwards?","options":["MFA gates <em>authentication<\/em>; the attacker replays an already-authenticated session cookie, so no new authentication happens","MFA was disabled on the tenant","Cookies are encrypted, which forces MFA to fail silently","MFA only applies to mobile applications"],"correct":0,"notes":["Right. The factor was satisfied once — by the victim, on the attacker’s proxy. Afterwards the session cookie (T1550.004) is the passport; defenders must revoke sessions, not just reset passwords.","The premise says MFA succeeded — it exists and works; the attack goes around it.","Encryption of the cookie is irrelevant; the attacker does not need to read it, only to send it.","MFA applies to web authentication as well; that is what the victim just completed."],"hint":"Ask what MFA actually saw: a human completing a login — whose session is born from it?","explain":"Credential-proxy kits (Evilginx-style) harvest the authenticated session rather than just the password. The technique chain is T1598/T1566 → T1550.004 (Web Session Cookie). Consequence for defenders: after suspected proxy-phishing, <strong>revoke sessions/tokens<\/strong>, not only reset passwords — and favour phishing-resistant MFA, which breaks the proxy flow itself."},{"id":"H05","type":"dnd","persp":"def","scenario":"Morning case review: five artefacts from one campaign. Map each to its correct ATT&CK technique before writing the report.","question":"Drag each artefact onto the technique it belongs to.","bank":["Emails with a link to a credential-harvesting clone of the payroll portal","Dozens of unsolicited MFA approval prompts against one account","A rule silently forwarding incoming mail to an external address","A stolen browser cookie replayed into the webmail session","A real partner mailbox taken over and kept ready for the campaign"],"zones":["T1566.002 · Spearphishing Link","T1621 · MFA Request Generation","T1114.003 · Email Forwarding Rule","T1550.004 · Web Session Cookie","T1586.002 · Compromise Accounts: Email Accounts"],"zoneOf":[0,1,2,3,4],"itemNotes":["A link in email → Spearphishing Link (T1566.002).","Flooding approval requests → MFA Request Generation (T1621).","Silent forwarding → Email Forwarding Rule (T1114.003).","Replaying the session token → Web Session Cookie (T1550.004).","The takeover of the partner mailbox as a prepared resource → T1586.002 itself."],"hint":"One artefact is the <em>resource<\/em> (this exam’s technique); the others are delivery, pressure, persistence and replay.","explain":"The campaign chain: the compromised partner mailbox (T1586.002) lends trust; the link lure (T1566.002) delivers; MFA flooding (T1621) breaks the factor; the stolen cookie (T1550.004) opens the session; the forwarding rule (T1114.003) keeps it paying. Mapping artefacts to distinct techniques keeps your report ATT&CK-precise and your coverage gaps visible."},{"id":"H06","type":"fill","persp":"def","scenario":"Report-writing drill: put the correct ATT&CK IDs into the two sentences.","question":"Fill in both technique IDs (the letter T is optional).","segments":["A hidden rule that forwards incoming mail to an outside address is tracked as ",". Flooding a user with MFA approval prompts until they approve is tracked as ","."],"blanks":[{"accept":["t1114.003","1114.003","t1114 003","1114 003"],"note":"Email Forwarding Rule — sub-technique of T1114 Email Collection."},{"accept":["t1621","1621"],"note":"Multi-Factor Authentication Request Generation."}],"hint":"The forwarding rule lives under T1114 (Email Collection); the MFA flooding technique is in the Credential Access tactic with a short ID.","explain":"<code>T1114.003<\/code> Email Forwarding Rule and <code>T1621<\/code> Multi-Factor Authentication Request Generation. Both are staples of mailbox-takeover casework: one is the persistence/collection move, the other is the pressure move that defeats a weak MFA implementation."},{"id":"H07","type":"branch","persp":"def","scenario":"Executive case. CEO <code>m.reyes<\/code>: sign-in from an unusual country (unexplained), outbound volume normal, but yesterday a rule named <strong>“RSS Feeds”<\/strong> was created — it moves messages containing “invoice”, “payment” or “security alert” into that folder and marks them read.","question":"Work the triage path to the action list.","steps":[{"prompt":"Step 1 — The sign-in is odd but the volume is normal. What do you examine first?","options":[{"text":"Enumerate ALL mailbox rules, including MRM/RSS-Feeds-style and ‘junk’ rules","note":"Correct: the “RSS Feeds” rule trick is classic BEC persistence — it hides security and invoice mail from a busy executive."},{"text":"Check the CEO’s mailbox theme and calendar colours","note":"Cosmetics carry no signal; you would be stalling."},{"text":"Schedule a password reset for next week’s maintenance window","note":"Too slow by days — and a reset alone misses session cookies anyway."}]},{"prompt":"Step 2 — The rules audit shows the “RSS Feeds” rule, and MailItemsAccessed events from a new ASN appear right after its creation. How do you read this?","options":[{"text":"Read as takeover-in-progress: contain now, preserve evidence while containing","note":"Rule + fresh reading infrastructure is the post-takeover signature; act."},{"text":"Wait to see whether it happens again","note":"It already happened twice (rule + reads). Waiting only extends the attacker’s window."},{"text":"Delete the RSS Feeds folder and close the ticket","note":"Removing the symptom leaves the access (sessions, possible grants) intact."}]},{"final":true,"multi":true,"prompt":"Final — Select <strong>ALL<\/strong> actions you will take now.","options":["Revoke all sessions and refresh tokens, then reset credentials","Audit and remove the hidden rule; check for external forwarding and OAuth grants","Notify finance to verify any pending payment requests out-of-band","Delete the entire mailbox to remove the attacker","Wait 48 hours to collect more data before acting"],"correct":[0,1,2],"notes":["Yes — kills cookie/token replay and future logins.","Yes — removes the persistence/collection you found and its siblings.","Yes — process control: the fraud attempt may already be in flight to vendors.","No — destroying the mailbox destroys evidence and business data, and does not necessarily remove attacker access.","No — the window is already open; delay is the attacker’s friend."]}],"hint":"“RSS Feeds” is not a feeds feature — it is where BEC rules hide security and invoice mail. Contain, clean, and warn the payment process.","explain":"Correct set: revoke+reset, remove persistence (rule, forwarding, grants), and protect the payment process out-of-band. Avoid destruction (evidence) and delay. This is the balanced containment pattern that recurs across BEC casework."},{"id":"H08","type":"qcm","persp":"def","scenario":"Impossible-travel alert: sales director signed in from Warsaw and Dallas 40 minutes apart. Both sessions are on her corporate laptop, both arrive through the company’s two VPN egress points (EU and US).","question":"What is the correct handling of this alert?","options":["False positive caused by VPN egress geography; tune the rule to exclude corporate egress points","The director is certainly under attack; disable her account","Impossible-travel alerts should be disabled company-wide","VPN users should be locked out whenever two regions appear"],"correct":0,"notes":["Right. Geo-velocity on egress IPs measures the VPN’s geography, not the user’s. Excluding known corporate egress (or evaluating risk post-VPN) keeps the rule sharp.","The evidence points the other way: both sessions are the same corporate device through sanctioned VPNs.","Disabling outright throws away a genuinely useful signal class.","Punishing VPN usage teaches users to avoid the VPN — worse security."],"hint":"Where is the ‘travel’ really happening — the user, or the tunnel?","explain":"Impossible travel is one of the highest-noise identity alerts; its classic false positive is corporate VPN egress. Tuning is a defender’s duty: exclude sanctioned egress, require device compliance in the logic, and keep the alert for unexplained raw-IP geo jumps. A false positive handled badly is how teams learn to ignore the alert class."},{"id":"H09","type":"term","persp":"def","scenario":"Same investigation, evidence phase. The export <code>/evidence/finance.mbox<\/code> holds the finance team’s mailbox snapshot. Find every message about <strong>wire transfers<\/strong> so the fraud thread can be reconstructed.","question":"Run the search that lists matching messages in the exported mailbox.","shell":{"promptStr":"analyst@soc-lab:/evidence$","banner":"Evidence shell (simulated) — files: finance.mbox, ceo-thread.eml, ual.csv. Type <span class='tok-dim'>help<\/span>.","helpText":"Tools:\n  mboxgrep <pattern> <file>   search an mbox for messages matching a keyword\n  ls [dir]                    list files\n  cat <file>                  small text files only\n  help                        this text","tools":[{"re":"mboxgrep","out":"=1= 2026-09-12 From: m.reyes@corp[.]example Subject: Re: Q3 wire schedule\n    body contains: 'please confirm the wire transfer details today'\n=2= 2026-09-14 From: ap@payex[.]example Subject: Invoice 8841 — updated bank details\n    body contains: 'we moved the wire transfer to a new account, see below'"},{"re":"^ls","out":"ceo-thread.eml  finance.mbox  ual.csv"},{"re":"^cat ual","out":"ual.csv: 1.2 GB — too large for this shell; use search-ual in the next case"},{"re":"^cat finance\\.mbox","out":"finance.mbox: binary-ish mbox export — use mboxgrep"},{"re":"^cat","out":"cat: unsupported file for this exercise"},{"re":"^help","out":"Tools:\n  mboxgrep <pattern> <file>   search an mbox for messages matching a keyword\n  ls [dir]                    list files\n  cat <file>                  small text files only\n  help                        this text"}]},"elements":[{"re":"mboxgrep","label":"Uses mboxgrep (the mbox search tool)","note":"The exported mailbox is searched, not catted."},{"re":"wire|invoice","label":"Searches the fraud keywords (wire/invoice)","note":"The report needs the wire-fraud thread."},{"re":"finance\\.mbox","label":"Targets /evidence/finance.mbox","note":"The exported evidence file."}],"nearMiss":[{"re":"shred|rm\\s|wipe|mkfs|dd\\s+if|del /evidence","label":"evidence destruction command","why":"That command destroys the evidence file — chain-of-custody gone, and with it the case. DANGEROUS near miss: forensic work is read-only on the original; work on copies."}],"canonical":"mboxgrep \"wire transfer\" /evidence/finance.mbox","dangerousExample":"shred /evidence/finance.mbox","expected":"Expected finding: the CEO’s 2026-09-12 wire-schedule reply and the 2026-09-14 “updated bank details” vendor message — the hijacked conversation, in order.","clarification":"Tools: <code>mboxgrep &lt;pattern&gt; &lt;file&gt;<\/code>, <code>ls<\/code>. The grader checks the <strong>last<\/strong> command. This is a forensic copy folder: read-only. Destructive commands are flagged as dangerous near misses.","hint":"One tool, two arguments: the keyword and the evidence file.","explain":"<code>mboxgrep \"wire transfer\" /evidence/finance.mbox<\/code> answers the ask directly. Note the discipline: the search runs against the forensic copy; originals stay untouched so hashes and chain of custody survive review and court."},{"id":"H10","type":"multi","persp":"att","scenario":"Threat-intel briefing: where do the mailboxes that end up as T1586.002 resources actually come from at scale? Keep the realistic supply channels.","question":"Select <strong>all<\/strong> realistic channels for obtaining mailbox credentials at scale.","options":["Infostealer logs sold on criminal markets (cookies + passwords from infected machines)","Phishing kits that harvest credentials directly (often with session cookies)","Combolists from old breaches combined with password-reuse testing","Buying access from initial access brokers","Politely requesting the mailbox from the provider’s support as “the victim”","Buying a code-signing certificate for the company"],"correct":[0,1,2,3],"notes":["Yes — infostealer ecosystems are the dominant modern supply; logs often include the session cookies too.","Yes — credential phishing remains the most direct harvest (T1598-style).","Yes — ATT&CK’s description names brute forcing via reused breach credentials explicitly.","Yes — ATT&CK names “purchasing credentials from third-party sites”; access brokers industrialise it.","No — support fraud happens occasionally, but it is not a scale channel and it is not what the technique description centres on.","No — that is Obtain Capabilities: Code Signing Certificates (T1588.003); unrelated to mailbox credentials."],"hint":"Four channels trade in <em>credentials or sessions<\/em>; the two odd ones trade in something else entirely.","explain":"The realistic supply: infostealer logs, harvest kits, breach combolists with reuse, and broker purchases. This is why mitigation emphasises phishing-resistant MFA and passkeys (kills the harvest) plus credential monitoring for infostealer dumps (shortens the window between sale and abuse)."},{"id":"H11","type":"qcm","persp":"def","scenario":"Your <code>New-InboxRule<\/code> alert fires 300 times a day: a sanctioned CRM product legitimately creates processing rules for many users.","question":"Which tuning keeps the alert meaningful?","options":["Scope the alert to owner-atypical content: external forwarding, delete/mark-as-read on security- or invoice-related words, hidden-folder tricks — exclude the sanctioned product","Raise the alert threshold to 500 events per day","Disable inbox-rule auditing entirely","Alert on every rule creation including the CRM’s"],"correct":0,"notes":["Right: alert on the <em>content<\/em> that matters to attackers (silent handling of money/security mail, external forwarding) and whitelist the sanctioned product’s known patterns.","Raising thresholds turns a noisy detector into a deaf one.","Rule auditing is the primary detection for the persistence phase — disabling it is self-blinding.","That is exactly the 300-per-day noise you already have."],"hint":"Ask what distinguishes the CRM’s rules from an attacker’s rule — then alert only on the difference.","explain":"Content-aware tuning: attacker rules forward externally, silently delete/mark money-and-security mail, or use hidden folders; sanctioned automation has known, visible patterns. This preserves recall on the dangerous class while removing the noise that would bury it."},{"id":"H12","type":"branch","persp":"att","scenario":"Red-team op design. Asset: a compromised HR mailbox. Objective: harvest payroll-portal credentials from employees. Design the operation, then name the ATT&CK techniques it uses.","question":"Walk the design path to its final shape.","steps":[{"prompt":"Step 1 — Delivery choice?","options":[{"text":"Reply inside the open-enrollment thread with an “updated portal link”","note":"Right: the thread is expected mail; the link rides on HR’s trust."},{"text":"Blast from a fresh Gmail address with the same link","note":"Wastes the asset — and lands in spam with none of HR’s credibility."},{"text":"Print QR-code posters for the office lobby","note":"Off-scope for this asset; physical access is a different operation."}]},{"prompt":"Step 2 — Capture infrastructure?","options":[{"text":"Clone of the payroll portal on a newly registered look-alike domain, with HTTPS","note":"Realistic: acquisition of the domain is itself a Resource Development technique."},{"text":"Host the clone on the company’s own intranet","note":"You do not have intranet foothold — and mixing infra with the target is amateur."},{"text":"Ask victims to type their passwords into an email reply","note":"Absurd and loud; nobody does this, and it burns the mailbox instantly."}]},{"final":true,"multi":true,"prompt":"Final — Which ATT&CK techniques does this operation use? Select <strong>ALL<\/strong> that apply.","options":["T1566.002 Spearphishing Link (the lure carries a link)","T1583.001 Domains (the look-alike domain was acquired for the clone)","T1588.003 Code Signing Certificates","T1110.002 Password Cracking"],"correct":[0,1],"notes":["Yes — the delivery is a linked lure.","Yes — the clone needed the look-alike domain (Acquire Infrastructure: Domains).","No — nothing in this op signs code.","No — no offline cracking; the portal is phished, not brute-forced."]}],"hint":"The op has two legs: the lure (a link) and the stage (a domain). Nothing was cracked or signed.","explain":"The design uses the compromised HR mailbox (T1586.002, the resource) for a linked lure (T1566.002) to a clone staged on an acquired domain (T1583.001). Naming each leg precisely is what makes an ATT&CK-based report actionable — each technique maps to different detections."},{"id":"H13","type":"qcm","persp":"def","scenario":"Quarter-close day. Strong indicators that the CFO’s mailbox is compromised (odd sign-in + invoice-oriented rule), but nothing confirmed, and the finance team is mid-cutoff.","question":"Choose the least-aggressive response that still stops the harm.","options":["Force a credential reset, revoke sessions, watch rules/sign-ins closely, and tell finance to out-of-band verify payment requests","Disable the CFO mailbox immediately for the rest of the day","Observe silently until end of day","Wipe the mailbox to remove the attacker"],"correct":0,"notes":["Right: reset+revoke cuts access without a business outage; monitoring catches re-entry; finance notification protects the actual money path.","Disabling during quarter-close is heavy business impact — and heavier than needed.","Observing while the attacker is mid-operation is free rein.","Wiping destroys evidence and data — the most destructive option on the list."],"hint":"You want to cut the attacker’s access, not the CFO’s business day.","explain":"Proportionate containment = revoke access (reset+sessions), keep watching (rules, sign-ins, mail flow), and harden the fraud target (out-of-band verification). It is the same “stop the harm, keep the evidence, keep the business running” triangle from earlier — under time pressure it is the only repeatable rule."},{"id":"H14","type":"match","persp":"def","scenario":"Sources drill: match each log source with what it reveals in a mailbox-takeover investigation.","question":"Match each source to what it shows you.","left":["Unified Audit Log (UAL)","Message trace","Mailbox audit log","Inbox-rule audit"],"right":["Sign-ins, admin actions, rule and consent-grant changes across the tenant","Routing and delivery of each individual email","Who opened which mailbox items, and from where","Silent handling: forwarding, marking read, moving or deleting mail"],"pairs":[0,1,2,3],"pairNotes":["The UAL is the tenant-wide backbone: identity + configuration changes in one place.","Message trace answers “did the lure leave, to whom, through which connector?” — blast scoping.","Mailbox audit shows the reading behaviour (MailItemsAccessed) that identity logs miss.","Rule audits catch the persistence/collection class of behaviour."],"hint":"One is tenant-wide, one is per-email, one is per-item-read, one is per-mail-handling-rule.","explain":"Four complementary views: tenant configuration (UAL), per-message routing (message trace), per-item reading (mailbox audit), and mail-handling automation (rules). A takeover case usually needs all four to reconstruct access, persistence, collection and abuse."},{"id":"H15","type":"qcm","persp":"att","scenario":"Attacker-psychology question: why do operators prefer to send their lure as a <strong>reply<\/strong> inside an existing thread from the compromised mailbox, rather than as a new message?","question":"Pick the reason that matches real-world effectiveness.","options":["The reply inherits the thread’s context and trust, so no new-thread spam signals exist","Replies bypass TLS encryption","Replies cannot be traced by anyone","Replies double the mailbox storage quota"],"correct":0,"notes":["Right. The victim sees a conversation they are already part of, with expected subject and participants — maximal credibility, minimal filtering.","TLS applies to transport for both new messages and replies.","Nothing is untraceable; mail flow logs, message trace and provider records exist.","Storage quota is not part of any attacker’s calculus here."],"hint":"Compare the victim’s mental model when reading a fresh subject line versus a thread they were already answering.","explain":"Thread hijacking converts the mailbox’s trust into the message: participants, subject history, attachments and expectations are all genuine. ATT&CK lists hijacking existing email threads explicitly as a use of compromised accounts — defenders therefore treat “unexpected payload inside an ongoing thread” as a first-class suspicious pattern."}];
var INTRO = {"objectType":"MITRE ATT&CK sub-technique","subtitle":"HARD exam · realistic procedures, log triage and evidence-first judgement","learn":"\n<p>This exam assumes you know that <strong>T1586.002<\/strong> compromises real mailboxes as a\n<strong>Resource Development (TA0042)<\/strong> resource. Here you work like a practitioner: read\ntelemetry the way it arrives, judge cases with contradictory signals, and map artefacts to the right\nATT&CK techniques.<\/p>\n<ul>\n<li><strong>Realistic procedures:<\/strong> Unified Audit Log events, mailbox audit reads, message trace, hidden rule hunting (“RSS Feeds” tricks), credential-proxy kits and session-cookie replay.<\/li>\n<li><strong>Attacker economics:<\/strong> infostealer logs, access brokers, combolists — where compromised mailboxes actually come from.<\/li>\n<li><strong>False-positive craft:<\/strong> tuning impossible-travel and inbox-rule alerts without blinding yourself.<\/li>\n<li><strong>Response discipline:<\/strong> the least-aggressive action that still stops the harm and preserves evidence.<\/li>\n<li><strong>Terminal work:<\/strong> two simulated-shell exercises — sign-in log triage and mailbox evidence search. The shell grades your last command and flags dangerous ones.<\/li>\n<\/ul>\n","keywords":["T1586.002","MailItemsAccessed","New-InboxRule","RSS Feeds rule trick","OAuth consent grant","MFA Request Generation (T1621)","Web Session Cookie (T1550.004)","Spearphishing Link (T1566.002)","Domains (T1583.001)","Impossible travel false positives","Access brokers","Infostealer logs","Least-aggressive containment","Evidence preservation"],"how":"<div class=\"how-row\"><span class=\"how-ic\">◎<\/span><span><strong>Goal.<\/strong> There are __NCOUNT__ exercises. You need at least <strong>70%<\/strong> to pass. Partial credit is possible: if an exercise has several correct parts, you get the fraction you earned, computed as (hits − wrong) ÷ correct parts, never below 0. A fully right answer gives 1.00.<\/span><\/div><div class=\"how-row\"><span class=\"how-ic\">⚙<\/span><span><strong>Exercise types in this exam:<\/strong> <strong>Decision path.<\/strong> You walk through scenario steps. Intermediate choices are not scored — only the final choice is, after you press Check. <strong>Sorting cards.<\/strong> You drag cards into zones (or click a card, then click a zone). Each card in the right zone counts. <strong>Fill in the blanks.<\/strong> You type short answers. Spelling has small freedom (for example letter case does not matter), and each blank counts. <strong>Matching.<\/strong> You link each item on the left with its partner using a dropdown. Each correct link counts. <strong>Multiple choice (several answers).<\/strong> You pick every option that applies. If you get some but not all, you keep part of the credit. Picking a wrong option loses credit. <strong>Multiple choice (one answer).<\/strong> You pick one option. A right answer gives full credit, a wrong answer gives 0. <strong>Simulated terminal.<\/strong> You type commands in a fake shell. A grader checks the last command you ran. Dangerous commands are flagged as near misses.<\/span><\/div><div class=\"how-row\"><span class=\"how-ic\">⏱<\/span><span><strong>The clock.<\/strong> The timer budget is <strong>__BUDGET__<\/strong> for the whole exam (estimated time 45 min). When you press <em>Check<\/em>, the clock <strong>auto-pauses<\/strong> (the header shows “⏸ Auto-paused”) while you read the feedback; pressing <em>Next<\/em> starts it again. The <em>Pause<\/em> button stops the clock by hand (the header shows “⏸ Paused”) and hides the exercise; <em>Resume<\/em> brings it back exactly as it was. <em>Hint<\/em> and <em>Skip<\/em> do <strong>not<\/strong> stop the clock.<\/span><\/div><div class=\"how-row\"><span class=\"how-ic\">△<\/span><span><strong>Hints.<\/strong> Each exercise has one hint. A hint costs <strong>0.10<\/strong> of that exercise’s credit (the credit never goes below 0). The second hint never appears — one hint per exercise.<\/span><\/div><div class=\"how-row\"><span class=\"how-ic\">⚠<\/span><span><strong>Skipping.<\/strong> <em>Skip<\/em> moves an exercise to a review list without scoring it. After the last exercise you get the <em>Review skipped exercises<\/em> screen, where you can answer them. A skipped exercise only counts when you answer it; if you never answer it, it is excluded from both your score and the total. The clock keeps running during the review until you press <em>Finish exam<\/em>.<\/span><\/div><div class=\"how-row\"><span class=\"how-ic\">✓<\/span><span><strong>Results.<\/strong> At the end you see fully correct, partially correct (with your average partial credit), fully incorrect, and skipped-and-never-answered counts, plus the time spent paused. Your final score is sent once to the training website.<\/span><\/div><div class=\"how-row\"><span class=\"how-ic\">↻<\/span><span><strong>Retake.<\/strong> You can retake the exam at any time from the results screen. A retake starts fresh: empty score, full clock, empty skip list.<\/span><\/div>","title":"T1586.002 · Compromise Accounts: Email Accounts"};
var BUDGET = META.estimatedMinutes * 60;

/* ===== helpers ===== */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hashStr(s){ var h=2166136261; s=String(s); for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; var t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function shuffled(n, seed){ var r=mulberry32(hashStr(seed)); var a=[]; for(var i=0;i<n;i++)a.push(i);
  for(var j=n-1;j>0;j--){ var k=Math.floor(r()*(j+1)); var t=a[j];a[j]=a[k];a[k]=t; } return a; }
function norm(s){ return String(s==null?'':s).toLowerCase().replace(/^[\s.,;:!?"'`()\[\]]+|[\s.,;:!?"'`()\[\]]+$/g,'').replace(/\s+/g,' ').trim(); }
function fmt(sec){ sec=Math.max(0,sec); var m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function fmtDur(sec){ sec=Math.round(sec); var m=Math.floor(sec/60), s=sec%60; return m+' min '+(s<10?'0':'')+s+' s'; }

  posted:false, finished:false, timeExpired:false, handshake:false,
  wallStart:0, wallEnd:0, score:0
};
var T = { state:'RUNNING', remaining:BUDGET, tick:null, enterTs:0,
  accum:{'PAUSED_MANUAL':0,'PAUSED_AUTO_CHECK':0}, counts:{'PAUSED_MANUAL':0,'PAUSED_AUTO_CHECK':0} };
var UI = {};

/* ===== timer state machine ===== */
function setTState(ns){
  if(T.state===ns) return;
  var now=Date.now();
  if((T.state==='PAUSED_MANUAL'||T.state==='PAUSED_AUTO_CHECK') && T.enterTs){
    T.accum[T.state]+=(now-T.enterTs)/1000;
  }
  if(ns==='PAUSED_MANUAL'||ns==='PAUSED_AUTO_CHECK'){ T.enterTs=now; T.counts[ns]++; }
  var was=T.state; T.state=ns;
  if(ns==='RUNNING'){ startTick(); } else { stopTick(); }
  if(was==='PAUSED_MANUAL'||ns==='PAUSED_MANUAL'||was==='PAUSED_AUTO_CHECK'||ns==='PAUSED_AUTO_CHECK'||ns==='ENDED'){ renderTimer(); }
}
function startTick(){ if(T.tick||T.state!=='RUNNING') return; T.tick=setInterval(onTick,1000); }
function stopTick(){ if(T.tick){ clearInterval(T.tick); T.tick=null; } }
function onTick(){
  if(T.state!=='RUNNING') return;          /* no tick while any pause is active */
  T.remaining--; renderTimer();
  if(T.remaining<=0){ T.remaining=0; timeUp(); }
}
function renderTimer(){
  var t=$('tb-timer'), st=$('tb-state');
  if(!t) return;
  t.textContent='\u23F1 '+fmt(T.remaining);
  t.setAttribute('aria-label','Timer '+fmt(T.remaining));
  var m={'RUNNING':['\u25B6 Running','chip chip-state-running','Timer running'],
         'PAUSED_MANUAL':['\u23F8 Paused','chip chip-state-paused','Timer paused manually'],
         'PAUSED_AUTO_CHECK':['\u23F8 Auto-paused (checking)','chip chip-state-auto','Timer auto-paused while checking'],
         'ENDED':['\u25A0 Ended','chip chip-state-ended','Timer ended']};
  var c=m[T.state]; st.textContent=c[0]; st.className=c[1]; st.setAttribute('aria-label',c[2]);
  var pb=$('tb-pause');
  if(pb){ pb.disabled=(S.view!=='exam'&&S.view!=='review-ex')||T.state==='ENDED';
    pb.innerHTML=(T.state==='PAUSED_MANUAL')?'\u25B6 Resume':'\u23F8 Pause'; }
  var sk=$('tb-skip'), hi=$('tb-hint');
  var inEx=(S.view==='exam'||S.view==='review-ex');
  if(sk) sk.disabled=!inEx||S.checked||S.reviewMode;
  if(hi) hi.disabled=!inEx||S.checked||!!S.hintUsed[S.idx];
}

/* ===== scoring ===== */
function rawToCredit(raw, idx){
  var c=raw - (S.hintUsed[idx]?0.10:0);
  return Math.max(0, Math.min(1, c));
}
function clampRaw(h,w,n){ return Math.max(0, Math.min(1, (h-w)/n)); }
function labelFor(h,w,n){
  var raw=clampRaw(h,w,n);
  if(h===n&&w===0) return 'correct';
  return raw>0?'partial':'incorrect';   /* zero credit is never labelled partial */
}
function setStatus(idx, label, credit, g){
  S.answers[idx]={status:label, credit:credit, answered:true, g:g};
  S.score=(S.score||0)+credit;
  S.skipped=S.skipped.filter(function(x){return x!==idx;});  /* answered: leaves the skipped list */
}

function sevBadge(){ return '<span class="badge badge-'+META.difficulty+'" data-sev-badge>'+esc(META.severityLabel)+'</span>'; }

function blockHTML(cls, tag, body, icon, extra){

       + '<div class="blk-body">'+body+'</div></section>';
}

function answerHTML(ex){
  switch(ex.type){
    case 'qcm':
      return '<div role="radiogroup" aria-label="'+esc(ex.id)+' answers">'+ex.options.map(function(o,i){
        return '<label class="opt" data-opt="'+i+'"><input type="radio" name="ans-'+ex.id+'" value="'+i+'" aria-label="Option '+String.fromCharCode(65+i)+'">'
          +'<span class="opt-letter">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span></label>';
      }).join('')+'</div>';
    case 'multi':
      return '<div class="sel-count">Select all answers that apply. Partial credit is possible.</div>'
        + ex.options.map(function(o,i){
        return '<label class="opt" data-opt="'+i+'"><input type="checkbox" name="ans-'+ex.id+'" value="'+i+'" aria-label="Option '+String.fromCharCode(65+i)+'">'
          +'<span class="opt-letter">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span></label>';
      }).join('')+'</div>';
    case 'match':
      UI.picks=ex.left.map(function(){return null;});
      var ro=shuffled(ex.right.length, ex.id+'-right');
      return ex.left.map(function(l,i){
        var opts='<option value="">\u2014 choose \u2014</option>'+ro.map(function(ri){
          return '<option value="'+ri+'">'+esc(ex.right[ri])+'</option>'; }).join('');
        return '<div class="match-row"><div>'+l+'</div><select data-match="'+i+'" aria-label="Match for item '+esc(l)+'">'+opts+'</select></div>';
      }).join('');
    case 'order':
      UI.arr=displayOrder(ex);
      return '<div class="dnd-hint">Put the steps in the right order. Drag a row, or use the \u25B2 / \u25BC buttons.</div><div id="order-list">'
        + UI.arr.map(function(itemIdx,pos){ return orderRowHTML(ex,itemIdx,pos); }).join('')+'</div>';
    case 'dnd':
      UI.place=ex.bank.map(function(){return null;});
      return '<div class="dnd-hint">Drag each card into a zone, or click a card and then click a zone. Click a placed card to send it back.</div>'
        +'<div class="dnd-grid"><div class="dnd-bankcol"><p class="zone-h"><span class="zi">\u25A0</span> Cards to sort</p><div id="dnd-bank" ondragover="return false"></div></div>'
        + ex.zones.map(function(z,zi){ return '<div class="zone" data-zone="'+zi+'"><p class="zone-h"><span class="zi">\u25AC</span> '+esc(z)+'</p><div class="zone-items" data-zone-items="'+zi+'"></div></div>'; }).join('')
        +'</div>';
    case 'fill':
      var parts='';
      for(var k=0;k<ex.segments.length;k++){
        if(k>0){ var bi=(k-1)/1;
          parts+='<input class="fill-input" type="text" data-fill="'+(k-1)+'" aria-label="Blank '+(k)+'" autocomplete="off" spellcheck="false">';
        }
        parts+='<span class="fill-line">'+ex.segments[k]+'</span>';
      }
      return '<div>'+parts+'</div>';
    case 'branch':
      return '<div id="branch-slot"></div>';
    case 'term':
      return '<div class="term-clar">'+ex.clarification+'</div>'
        +'<div class="term mono"><div class="term-out" id="term-out">'+ex.shell.banner+'</div>'

function displayOrder(ex){
  var n=ex.items.length, ord=shuffled(n, ex.id+'-ord'), tries=0;
  while(isCorrectOrder(ord)&&tries<9){ ord=shuffled(n, ex.id+'-ord-'+(++tries)); }
  return ord;
}
function isCorrectOrder(arr){ for(var i=0;i<arr.length;i++){ if(arr[i]!==i) return false; } return true; }
function orderRowHTML(ex,itemIdx,pos){
  return '<div class="order-row" draggable="true" data-pos="'+pos+'" data-item="'+itemIdx+'">'
    +'<span class="order-idx">'+(pos+1)+'</span><span class="grow">'+ex.items[itemIdx]+'</span>'
    +'<button class="mini-btn" data-up="'+pos+'" aria-label="Move up">\u25B2</button>'
    +'<button class="mini-btn" data-down="'+pos+'" aria-label="Move down">\u25BC</button></div>';
}
function rerenderOrder(ex){
  var list=$('order-list'); if(!list) return;
  list.innerHTML=UI.arr.map(function(itemIdx,pos){ return orderRowHTML(ex,itemIdx,pos); }).join('');
  wireOrder(ex);
}
function wireOrder(ex){
  var list=$('order-list'); if(!list) return;
  list.querySelectorAll('[data-up]').forEach(function(b){
    b.addEventListener('click',function(){ var p=+b.getAttribute('data-up');
      if(p>0){ var t=UI.arr[p-1];UI.arr[p-1]=UI.arr[p];UI.arr[p]=t; rerenderOrder(ex);} });
  });
  list.querySelectorAll('[data-down]').forEach(function(b){
    b.addEventListener('click',function(){ var p=+b.getAttribute('data-down');
      if(p<UI.arr.length-1){ var t=UI.arr[p+1];UI.arr[p+1]=UI.arr[p];UI.arr[p]=t; rerenderOrder(ex);} });
  });
  var dragPos=null;
  list.querySelectorAll('.order-row').forEach(function(row){
    row.addEventListener('dragstart',function(){ dragPos=+row.getAttribute('data-pos'); row.classList.add('dragging'); });
    row.addEventListener('dragend',function(){ row.classList.remove('dragging'); dragPos=null; });
    row.addEventListener('dragover',function(e){ e.preventDefault(); });
    row.addEventListener('drop',function(e){ e.preventDefault();
      if(dragPos===null) return; var to=+row.getAttribute('data-pos');
      var it=UI.arr.splice(dragPos,1)[0]; UI.arr.splice(to,0,it); rerenderOrder(ex); });
  });
}

function wireAnswer(ex){
  if(ex.type==='qcm'||ex.type==='multi'){
    $('view-exam').querySelectorAll('.opt').forEach(function(lb){
      var inp=lb.querySelector('input');
      inp.addEventListener('change',function(){
        if(ex.type==='qcm'){ UI.sel=+inp.value;
          $('view-exam').querySelectorAll('.opt').forEach(function(o){ o.classList.remove('sel'); });
          lb.classList.add('sel');
        } else {
          if(inp.checked){ UI.set[inp.value]=1; lb.classList.add('sel'); }
          else { delete UI.set[inp.value]; lb.classList.remove('sel'); }
        }
      });
    });
  } else if(ex.type==='match'){
    $('view-exam').querySelectorAll('[data-match]').forEach(function(s){
      s.addEventListener('change',function(){ UI.picks[+s.getAttribute('data-match')]=s.value===''?null:+s.value; });
    });
  } else if(ex.type==='order'){
    wireOrder(ex);
  } else if(ex.type==='dnd'){
    renderDnD(ex);
  } else if(ex.type==='fill'){

  } else if(ex.type==='branch'){

function runTerm(ex, cmd){
  var out=$('term-out'); if(!out) return;
  var p=ex.shell.promptStr;
  if(cmd.trim()===''){ out.textContent+='\n'+p+' (type a command)'; out.scrollTop=out.scrollHeight; return; }
  var res=simShell(ex, cmd.trim());
  UI.last=cmd.trim();
  out.textContent+='\n'+p+' '+cmd.trim()+'\n'+res;
  out.scrollTop=out.scrollHeight;
}
function simShell(ex, cmdline){
  if(/^clear$/i.test(cmdline)){ $('term-out').textContent=''; return ''; }
  if(/^help$/i.test(cmdline)){ return ex.shell.helpText; }
  var stages=cmdline.split('|').map(function(s){return s.trim();});
  var res=simOne(ex, stages[0]);
  for(var i=1;i<stages.length;i++){
    var m=stages[i].match(/^grep\s+(?:-c\s+)?["']?(\S+?)["']?$/i);
    if(!m){ return 'grep: unsupported usage in this simulated shell'; }
    var pat=m[1]; var lines=res.split('\n');
    if(/grep\s+-c/i.test(stages[i])){ return String(lines.filter(function(l){return l.indexOf(pat)>=0;}).length); }
    res=lines.filter(function(l){return l.indexOf(pat)>=0;}).join('\n');
  }
  return res;
}
function simOne(ex, cmd){
  var tools=ex.shell.tools;
  for(var i=0;i<tools.length;i++){
    if(new RegExp(tools[i].re,'i').test(cmd)) return tools[i].out;
  }
  var name=cmd.split(/\s+/)[0];
  return 'bash: '+name+': command not found (simulated shell \u2014 type help)';
}

/* ---------- grading ---------- */
function grade(ex){
  switch(ex.type){
    case 'qcm': {
      if(UI.sel===null) { $('fb-slot').innerHTML='<div class="fb fb-part" role="status">Choose an answer first.</div>'; return null; }
      var ok=UI.sel===ex.correct;
      return {label: ok?'correct':'incorrect', raw: ok?1:0, items:null, chosen:UI.sel};
    }
    case 'multi': {
      var sel=Object.keys(UI.set).map(Number);
      var H=0,W=0,N=ex.correct.length;
      var items=ex.options.map(function(o,i){
        var inc=sel.indexOf(i)>=0, isc=ex.correct.indexOf(i)>=0;
        if(isc&&inc){H++; return {st:'c',i:i};}
        if(!isc&&inc){W++; return {st:'w',i:i};}
        if(isc&&!inc){ return {st:'m',i:i};}
        return {st:'x',i:i};
      });
      return {label:labelFor(H,W,N), raw:clampRaw(H,W,N), items:items};
    }
    case 'match': {
      var H=0,W=0,N=ex.pairs.length;
      var items=ex.left.map(function(l,i){
        if(UI.picks[i]===null) return {st:'m',i:i};
        if(UI.picks[i]===ex.pairs[i]){H++; return {st:'c',i:i};}
        W++; return {st:'w',i:i};
      });
      return {label:labelFor(H,W,N), raw:clampRaw(H,W,N), items:items};
    }
    case 'order': {
      var H=0,W=0,N=ex.items.length;
      var items=UI.arr.map(function(itemIdx,pos){
        if(itemIdx===pos){H++; return {st:'c',i:pos};}
        W++; return {st:'w',i:pos};
      });
      return {label:labelFor(H,W,N), raw:clampRaw(H,W,N), items:items};
    }
    case 'dnd': {
      var H=0,W=0,N=ex.bank.length;
      var items=ex.bank.map(function(b,i){
        var z=UI.place[i];
        if(z===null||z===undefined) return {st:'m',i:i};
        if(z===ex.zoneOf[i]){H++; return {st:'c',i:i};}
        W++; return {st:'w',i:i};
      });
      return {label:labelFor(H,W,N), raw:clampRaw(H,W,N), items:items};
    }
    case 'fill': {
      var H=0,W=0,N=ex.blanks.length;
      var inputs=$('view-exam').querySelectorAll('[data-fill]');
      var items=[];
      inputs.forEach(function(inp,i){
        var v=norm(inp.value);
        if(v===''){ items.push({st:'m',i:i}); return; }
        var ok=ex.blanks[i].accept.indexOf(v)>=0;
        if(ok){H++; items.push({st:'c',i:i});} else {W++; items.push({st:'w',i:i});}
      });
      return {label:labelFor(H,W,N), raw:clampRaw(H,W,N), items:items};
    }
    case 'branch': {
      var f=ex.steps[ex.steps.length-1];
      if(f.multi){
        var sel=Object.keys(UI.set).map(Number);
        var H=0,W=0,N=f.correct.length;
        var items=f.options.map(function(o,i){
          var inc=sel.indexOf(i)>=0, isc=f.correct.indexOf(i)>=0;
          if(isc&&inc){H++; return {st:'c',i:i};}
          if(!isc&&inc){W++; return {st:'w',i:i};}
          if(isc&&!inc){ return {st:'m',i:i};}
          return {st:'x',i:i};
        });
        return {label:labelFor(H,W,N), raw:clampRaw(H,W,N), items:items};
      } else {
        if(UI.sel===null){ $('fb-slot').innerHTML='<div class="fb fb-part" role="status">Choose a final answer first.</div>'; return null; }
        var ok=UI.sel===f.correct;
        return {label: ok?'correct':'incorrect', raw: ok?1:0, items:null, chosen:UI.sel};
      }
    }
    case 'term': {
      var cmd=UI.last;
      if(!cmd){ return null; }
      var nm=null;
      for(var i=0;i<ex.nearMiss.length;i++){
        if(new RegExp(ex.nearMiss[i].re,'i').test(cmd)){ nm=ex.nearMiss[i]; break; }
      }
      if(nm){
        return {label:'danger', raw:0, items:null, nearMiss:nm, cmd:cmd};
      }
      var H=0,N=ex.elements.length; var items=[];
      for(var j=0;j<N;j++){
        var hit=new RegExp(ex.elements[j].re,'i').test(cmd);
        if(hit){H++; items.push({st:'c',i:j});} else {items.push({st:'m',i:j});}
      }
      var label=(H===N)?'correct':(H>0?'partial':'incorrect');
      return {label:label, raw:clampRaw(H,0,N), items:items, cmd:cmd};
    }
  }
  return null;
}

/* ---------- feedback ---------- */
var FB_WORD={correct:['\u2713 Correct','fb-good'], partial:['\u2713 Partially correct','fb-part'],
  incorrect:['\u2717 Incorrect','fb-bad'], danger:['\u26A0 DANGEROUS \u2014 NEAR MISS','fb-danger']};
var ITEM_MARK={c:['\u2713 Correct','it-c'], w:['\u2717 Wrong','it-w'], m:['\u25CB Missed','it-m']};

function itemText(ex, g, it){
  var i=it.i;
  switch(ex.type){
    case 'multi': return {label:ex.options[i], note:ex.notes[i]};
    case 'branch': return {label:ex.steps[ex.steps.length-1].options[i], note:ex.steps[ex.steps.length-1].notes[i]};
    case 'match': return {label:'\u201C'+ex.left[i]+'\u201D', note:ex.pairNotes[i]};
    case 'order': return {label:'Position '+(i+1)+': '+ex.items[i], note:ex.itemNotes[i]};
    case 'dnd': return {label:ex.bank[i], note:ex.itemNotes[i]};
    case 'fill': return {label:'Blank '+(i+1), note:ex.blanks[i].note};
    case 'term': return {label:ex.elements[i].label, note:ex.elements[i].note};
  }
  return {label:'',note:''};
}
function renderFeedback(idx){
  var ex=EX[idx], a=S.answers[idx];
  var g=a.g; /* the grade captured at Check time (stable across re-opens) */
  var credit=a.credit;
  var fb=FB_WORD[a.status]||FB_WORD.incorrect;
  var h='<div class="fb '+fb[1]+'" role="status" aria-live="polite" data-fb="1">';
  h+='<div class="fb-head"><span>'+fb[0].split(' ')[0]+'</span> '+fb[0].substring(fb[0].indexOf(' ')+1)+'</div>';
  h+='<div class="fb-credit">Credit: '+credit.toFixed(2)+' / 1.00'+(S.hintUsed[idx]?' (includes \u22120.10 hint penalty)':'')+'</div>';
  if(a.status==='danger'){
    h+='<div class="fb-explain"><strong>Your command:</strong> <code>'+esc(g.cmd)+'</code></div>';
    h+='<div class="fb-explain">'+g.nearMiss.why+'</div>';
    h+='<div class="fb-canonical">Canonical command: <span class="tok-cmd">'+esc(ex.canonical)+'</span></div>';
  } else {
    if(g&&g.items&&g.items.length){
      h+='<ul class="fb-items">';
      g.items.forEach(function(it){
        if(it.st==='x') return;
        var mk=ITEM_MARK[it.st]; var t=itemText(ex,g,it);
        var extra=(it.st==='m'&&ex.type==='match')?' \u2192 correct partner: '+esc(ex.right[ex.pairs[it.i]]):'';
        if(it.st==='m'&&ex.type==='order') extra=' \u2192 this position belongs to: '+ex.items[it.i];
        h+='<li class="'+mk[1]+'"><span>'+mk[0]+'</span> '+t.label+extra+(t.note?' \u2014 '+t.note:'')+'</li>';
      });
      h+='</ul>';
    }
    if(a.status==='incorrect'&&ex.type==='qcm'&&g){
      h+='<div class="fb-explain">You chose: '+String.fromCharCode(65+g.chosen)+'. '+ex.notes[g.chosen]+'</div>';
    }
    if(a.status==='incorrect'&&ex.type==='term'&&g){
      h+='<div class="fb-explain"><strong>Your command:</strong> <code>'+esc(g.cmd)+'</code></div>';
    }
    if((a.status==='incorrect'||a.status==='partial')&&ex.type==='term'){
      h+='<div class="fb-canonical">Canonical command: <span class="tok-cmd">'+esc(ex.canonical)+'</span></div>';
      h+='<div class="fb-explain">'+ex.expected+'</div>';
    }
    h+='<div class="fb-explain">'+ex.explain+'</div>';
  }
  h+='</div>';
  var slot=$('fb-slot');
  var old=slot.querySelector('.fb'); if(old) old.remove();

/* ---------- results ---------- */
function roundedReport(sumFloat, answeredCount){
  var scoreR=Math.round(sumFloat*100)/100;
  var percent=answeredCount>0?Math.round(scoreR/answeredCount*100):0;
  return {score:scoreR, percent:percent, passed:percent>=META.passMark};
}

/* ---------- results ---------- */
function collectResults(){
  var fully=0,partly=0,zero=0,skippedNA=0,sum=0,answered=0,partSum=0;
  EX.forEach(function(ex,i){
    var a=S.answers[i];
    if(a&&a.answered){ answered++; sum+=a.credit;
      if(a.credit>=0.999) fully++;
      else if(a.credit>0){ partly++; partSum+=a.credit; }
      else zero++;
    } else { skippedNA++; }
  });
  return {fully:fully,partly:partly,zero:zero,skippedNA:skippedNA,sum:sum,answered:answered,avgPart:partly?partSum/partly:0};
}
function reportScore(sumFloat, answeredCount){
  var r=roundedReport(sumFloat, answeredCount);
  try{
    if(window.parent&&window.parent!==window){
      window.parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,
        score:r.score,total:answeredCount,percent:r.percent,passed:r.passed}, location.origin);
    }
  }catch(e){/* standalone open: posting is a no-op */}
  return r;
}
function finish(){
  if(S.finished) return;
  S.finished=true;
  if(S.wallEnd===0){ S.wallEnd=Date.now(); }
  setTState('ENDED');
  var R=collectResults();
  var posted=roundedReport(R.sum, R.answered);   /* on-screen values == posted values */
  renderResults(R, posted);
  /* the score message is posted exactly once, after the score animation settles */
  setTimeout(function(){ if(!S.posted){ S.posted=true; reportScore(R.sum, R.answered); } }, REDUCED?80:780);
}
function timeUp(){
  if((S.view==='exam'||S.view==='review-ex')&&!S.checked){ S.skipped.push(S.idx); }
  S.timeExpired=true;
  finish();
}
function renderResults(R, posted){
  gotoView('results');
  var word=posted.passed?['\u2713 Passed','pass']:['\u2717 Not passed','fail'];
  var h='<div class="res-banner '+word[1]+'" data-results="1">';
  h+='<div class="res-word"><span>'+word[0].split(' ')[0]+'</span> '+word[0].substring(word[0].indexOf(' ')+1)+'</div>';
  h+='<div class="res-pct" id="res-pct">0%</div>';
  h+='<div class="res-sub">Final score '+posted.score.toFixed(2)+' of '+R.answered+' answered \u00B7 pass mark '+META.passMark+'%'
    +(S.timeExpired?' \u00B7 \u23F1 time ran out: unanswered exercises were skipped':'')+'</div></div>';
  h+='<div class="stat-grid">';
  h+='<div class="stat stat-green"><div class="k"><span>\u2713</span> Fully correct</div><div class="v">'+R.fully+'</div><div class="s">credit 1.00 each</div></div>';
  h+='<div class="stat stat-amber"><div class="k"><span>\u25D0</span> Partially correct</div><div class="v">'+R.partly+'</div><div class="s">average partial credit '+R.avgPart.toFixed(2)+'</div></div>';
  h+='<div class="stat stat-red"><div class="k"><span>\u2717</span> Fully incorrect</div><div class="v">'+R.zero+'</div><div class="s">credit 0.00 each</div></div>';
  h+='<div class="stat"><div class="k"><span>\u26A0</span> Skipped, never answered</div><div class="v">'+R.skippedNA+'</div><div class="s">excluded from score and total</div></div>';
  h+='<div class="stat stat-blue"><div class="k"><span>\u23F8</span> Time paused manually</div><div class="v">'+fmtDur(T.accum.PAUSED_MANUAL)+'</div><div class="s">'+T.counts.PAUSED_MANUAL+' pause'+(T.counts.PAUSED_MANUAL===1?'':'s')+'</div></div>';
  h+='<div class="stat stat-blue"><div class="k"><span>\u23F8</span> Time auto-paused (Check)</div><div class="v">'+fmtDur(T.accum.PAUSED_AUTO_CHECK)+'</div><div class="s">'+T.counts.PAUSED_AUTO_CHECK+' auto-pause'+(T.counts.PAUSED_AUTO_CHECK===1?'':'s')+'</div></div>';
  h+='</div>';
  h+='<div class="card" style="margin-bottom:16px;"><div class="card-body" style="overflow-x:auto;"><table class="res-table"><thead><tr><th>#</th><th>Exercise</th><th>Type</th><th>Result</th><th>Credit</th></tr></thead><tbody>';
  EX.forEach(function(ex,i){
    var a=S.answers[i]; var chip,cls;
    if(a&&a.answered){
      if(a.credit>=0.999){chip='\u2713 Correct';cls='it-c';}
      else if(a.credit>0){chip='\u2713 Partially correct';cls='it-m';}
      else {chip='\u2717 Incorrect';cls='it-w';}
    } else {chip='\u26A0 Skipped';cls='';}
    h+='<tr><td>'+(i+1)+'</td><td class="mono">'+esc(ex.id)+'</td><td>'+ex.type.toUpperCase()+'</td><td class="'+cls+'">'+chip+'</td><td class="mono">'+(a&&a.answered?a.credit.toFixed(2):'\u2014')+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  h+='<div class="action-row"><button class="btn btn-primary" id="btn-retake">\u21BB Retake exam</button></div>';
  $('view-results').innerHTML=h;
  var pctEl=$('res-pct'); var target=posted.percent;
  if(REDUCED){ pctEl.textContent=target+'%'; }
  else{
    var t0=performance.now(), dur=700;
    var step=function(ts){ var p=Math.min(1,(ts-t0)/dur);
      pctEl.textContent=Math.round(target*(0.5-0.5*Math.cos(Math.PI*p)))+'%';
      if(p<1) requestAnimationFrame(step); else pctEl.textContent=target+'%'; };
    requestAnimationFrame(step);
  }
  $('btn-retake').addEventListener('click', retake);
  var banner=document.querySelector('.res-banner'); if(banner&&!REDUCED) banner.classList.add('pulse-ok');
}
function retake(){
  S={view:'intro',idx:0,checked:false,reviewMode:false,reviewFrom:null,answers:{},skipped:[],hintUsed:{},
     posted:false,finished:false,timeExpired:false,handshake:S.handshake,wallStart:0,wallEnd:0,score:0};
  T.remaining=BUDGET; T.state='RUNNING'; T.enterTs=0;
  T.accum={'PAUSED_MANUAL':0,'PAUSED_AUTO_CHECK':0}; T.counts={'PAUSED_MANUAL':0,'PAUSED_AUTO_CHECK':0};
  stopTick(); gotoView('intro');
}

/* ---------- header buttons ---------- */
document.addEventListener('DOMContentLoaded', function(){
  renderIntro(); show('view-intro');
  $('tb-sev').outerHTML='<span class="badge badge-'+META.difficulty+'" id="tb-sev" data-sev-badge>'+esc(META.severityLabel)+'</span>';
  $('tb-hint').addEventListener('click', onHint);
  $('tb-skip').addEventListener('click', onSkip);
  $('tb-pause').addEventListener('click', onPause);
  renderTimer();
});
/* integration handshake: CYBERPULSE_INIT / CYBERMASTERY_INIT are accepted; the file stays dark-only */
window.addEventListener('message', function(ev){
  var d=ev&&ev.data;
  if(d&&typeof d==='object'&&(d.type==='CYBERPULSE_INIT'||d.type==='CYBERMASTERY_INIT')){
    S.handshake=true; /* theme field intentionally ignored: this file is dark-only */
  }
});

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
