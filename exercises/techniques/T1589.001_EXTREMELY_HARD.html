        pm[pp[0]] = pp.slice(1).join(':');
      }
      var items = [];
      for (i = 0; i < ex.blanks.length; i++) {
        var id = 'b' + i;
        var st = pm[id] === undefined ? 'missed' : (pm[id] === ex.blanks[i].a ? 'ok' : 'bad');
        items.push({ state: st, label: 'Blank ' + (i + 1) + ': ' + (pm[id] === undefined ? '(empty)' : esc(pm[id])) + ' — correct word: <b>' + esc(ex.blanks[i].a) + '</b>' });
      }
      return { creditRaw: credit, items: items, correctSummary: ex.text.replace(/\{(\d+)\}/g, function (m, d) { return '<b>' + esc(ex.blanks[Number(d)].a) + '</b>'; }) };
    }
  };
}

/* ---------- Spot the wrong lines (click lines; partial credit) ---------- */
function buildSpot(ex, box){
  var sel = {};
  box.appendChild(h('p', 'logfilter-note', 'Click every line that is wrong. Click again to deselect.'));
  var rows = [];
  for (var i = 0; i < ex.lines.length; i++) {
    (function (li) {
      var r = h('div', 'spotline');
      r.setAttribute('role', 'checkbox');
      r.setAttribute('aria-checked', 'false');
      r.innerHTML = '<span class="ln">L' + (li + 1) + '</span><span>' + esc(ex.lines[li].text) + '</span>';
      r.addEventListener('click', function () {
        sel[li] = !sel[li];
        r.classList.toggle('sel', !!sel[li]);
        r.setAttribute('aria-checked', sel[li] ? 'true' : 'false');
      });
      rows.push(r); box.appendChild(r);
    })(i);
  }
  var correct = [];
  for (var j = 0; j < ex.lines.length; j++) { if (ex.lines[j].bad) { correct.push('l' + j); } }
  return {
    partial: true,
    getPicked: function () {
      var out = [];
      for (var k in sel) { if (sel.hasOwnProperty(k) && sel[k]) { out.push('l' + k); } }
      return out;
    },
    grade: function (picked) {
      var credit = scoreExercise(correct, picked);
      var ps = {};
      var i;
      for (i = 0; i < picked.length; i++) { ps[picked[i]] = 1; }
      var items = [];
      for (i = 0; i < ex.lines.length; i++) {
        var id = 'l' + i;
        if (ex.lines[i].bad && ps[id]) { items.push({ state: 'ok', label: 'Line ' + (i + 1) + ' (wrong line, you flagged it): ' + esc(ex.lines[i].text.slice(0, 70)) }); }
        else if (ex.lines[i].bad && !ps[id]) { items.push({ state: 'missed', label: 'Line ' + (i + 1) + ' (wrong line you did not flag): ' + esc(ex.lines[i].text.slice(0, 70)) }); }
        else if (!ex.lines[i].bad && ps[id]) { items.push({ state: 'bad', label: 'Line ' + (i + 1) + ' (this line was actually fine): ' + esc(ex.lines[i].text.slice(0, 70)) }); }
      }
      return { creditRaw: credit, items: items, correctSummary: 'The wrong lines were: ' + correct.map(function (c) { var n = Number(c.slice(1)); return 'Line ' + (n + 1); }).join(', ') };
    }
  };
}

/* ---------- Decision tree / branching (steps; final Check; partial credit per step) ---------- */
function buildTree(ex, box){
  var step = 0;
  var picks = {};
  var L = lettersFor(Math.max.apply(null, ex.steps.map(function (s) { return s.options.length; })));
  box.appendChild(h('p', 'logfilter-note', 'Multi-step decision exercise. You confirm each step to advance. Only the final Check reveals the grade and pauses the timer.'));
  var host = h('div');
  box.appendChild(host);
  function ensureTreesteps() {
    var blk = document.querySelector('.blk-scenario .block-body');
    if (!blk) { return null; }
    var t = blk.querySelector('.treesteps');
    if (!t) { t = h('div', 'treesteps'); blk.appendChild(t); }
    return t;
  }
  function renderStep() {
    host.innerHTML = '';
    var checkBtn = document.getElementById('btn-check');
    var s = ex.steps[step];
    var optTextOf = function (o) { return (typeof o === 'string') ? o : o.text; };
    host.appendChild(h('span', 'stepchip', 'STEP ' + (step + 1) + ' OF ' + ex.steps.length));
    host.appendChild(h('p', 'qtext', esc(s.q)));
    var opts = shuffle(s.options.map(function (_, oi) { return oi; }));
    var sel = -1;
    var btns = [];
    for (var j = 0; j < opts.length; j++) {
      (function (oi, li) {
        var b = h('button', 'opt');
        b.type = 'button';
        b.innerHTML = '<span class="olabel">' + L[li] + '</span><span>' + esc(optTextOf(s.options[oi])) + '</span>';
        b.addEventListener('click', function () {
          sel = oi;
          picks[step] = oi; /* record immediately so the final step is captured too */
          for (var k = 0; k < btns.length; k++) { btns[k].classList.remove('sel'); }
          b.classList.add('sel');
        });
        btns.push(b); host.appendChild(b);
      })(opts[j], j);
    }
    var act = h('div', null);
    act.style.marginTop = '10px';
    if (checkBtn) { checkBtn.disabled = true; }
    if (step < ex.steps.length - 1) {
      var cont = h('button', 'btn', 'Continue &#10148;');
      cont.type = 'button';
      cont.disabled = true;
      cont.addEventListener('click', function () {
        if (sel === -1) { return; }
        picks[step] = sel;
        var after = s.options[sel].after;
        if (after) {
          var t = ensureTreesteps();
          if (t) { t.appendChild(renderBlock({ t: 'code', label: 'STEP ' + (step + 1) + ' OUTCOME', code: after })); }
        }
        step++;
        renderStep();
      });
      var sync = function () {
        cont.disabled = (sel === -1);
        if (checkBtn) { checkBtn.disabled = true; } /* intermediate steps never enable Check */
      };
      for (var k2 = 0; k2 < btns.length; k2++) { btns[k2].addEventListener('click', sync); }
      act.appendChild(cont);
    } else {
      var syncLast = function () {
        if (checkBtn) { checkBtn.disabled = (sel === -1); }
      };
      for (var k3 = 0; k3 < btns.length; k3++) { btns[k3].addEventListener('click', syncLast); }
    }
    host.appendChild(act);
  }
  renderStep();
  var correct = ex.steps.map(function (s, si) { return 't' + si + ':' + s.answer; });
  return {
    partial: true,
    getPicked: function () {
      var out = [];
      for (var k in picks) { if (picks.hasOwnProperty(k)) { out.push('t' + k + ':' + picks[k]); } }
      return out;
    },
    grade: function (picked) {
      var credit = scoreExercise(correct, picked);
      var pm = {};
      var i;
      for (i = 0; i < picked.length; i++) {
        var pp = picked[i].split(':');
        pm[pp[0]] = Number(pp[1]);
      }
      var items = [];
      for (i = 0; i < ex.steps.length; i++) {
        var st = pm['t' + i] === undefined ? 'missed' : (pm['t' + i] === ex.steps[i].answer ? 'ok' : 'bad');
        items.push({ state: st, label: 'Step ' + (i + 1) + ' — ' + esc(ex.steps[i].q) });
      }
      return { creditRaw: credit, items: items,
        correctSummary: ex.steps.map(function (s, si) { var o = s.options[s.answer]; return 'Step ' + (si + 1) + ': ' + esc((typeof o === 'string') ? o : o.text); }).join(' · ') };
    }
  };
}

/* ---------- Terminal emulator (partial credit per command element) ---------- */
function buildTerminal(ex, box){
  var t = ex.term;
  var lastCmd = '';
  var scroll, input;
  box.appendChild(h('p', 'logfilter-note', 'Type the command in the fake shell, then press Check. Nothing real is executed — this is a simulation.'));
  if (t.syntaxPanel) {
    var sp = h('div', 'artefact');
    sp.appendChild(h('div', 'artefact-label', 'SYNTAX REMINDER'));
    sp.appendChild(h('pre', 'code', esc(t.syntaxPanel)));
    box.appendChild(sp);
  }
  if (t.expectedShape) {
    box.appendChild(h('p', 'logfilter-note', 'Expected output shape: <code>' + esc(t.expectedShape) + '</code>'));
  }
  var term = h('div', 'term');
  term.appendChild(h('div', 'term-head', 'FAKE SHELL — SIMULATION ONLY — no real command runs'));
  scroll = h('div', 'term-scroll');
  scroll.setAttribute('aria-live', 'polite');
  term.appendChild(scroll);
  var line = h('div', 'term-line');
  line.appendChild(h('span', 'term-prompt', esc(t.prompt) + ' '));
  input = document.createElement('input');
  input.className = 'term-in';
  input.setAttribute('aria-label', 'Shell input');
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('spellcheck', 'false');
  line.appendChild(input);
  term.appendChild(line);
  box.appendChild(term);
  function run(cmd) {
    lastCmd = cmd;
    scroll.textContent += t.prompt + ' ' + cmd + '\n';
    if (cmd.replace(/\s+/g, '') === '') { scroll.scrollTop = scroll.scrollHeight; return; }
    if (cmd === 'clear') { scroll.textContent = ''; input.value = ''; return; }
    var out = null;
    for (var i = 0; i < (t.replies || []).length; i++) {
      if (new RegExp(t.replies[i].re, 'i').test(cmd)) { out = t.replies[i].out; break; }
    }
    if (out === null) {
      var first = cmd.split(/\s+/)[0];
      out = 'bash: ' + first + ': command not found (this simulation accepts only the commands the exercise needs)';
    }
    scroll.textContent += out + '\n';
    scroll.scrollTop = scroll.scrollHeight;
  }
  input.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { run(input.value); input.value = ''; }
  });
  var boot = '';
  if (t.files) {
    for (var f = 0; f < t.files.length; f++) { boot += t.files[f].name + (t.files[f].note ? '   (' + t.files[f].note + ')' : '') + '\n'; }
  }
  boot += 'Type your command below and press Enter. Then press Check.\n';
  scroll.textContent = boot;
  var correct = t.elements.map(function (e, i) { return 'e' + i; });
  return {
    partial: true,
    getPicked: function () { return lastCmd ? ['cmd'] : []; },
    grade: function () {
      var cmd = lastCmd.trim().replace(/\s+/g, ' ');
      if (!cmd) {
        return { creditRaw: 0, items: [{ state: 'bad', label: 'No command was typed.' }],
          correctSummary: 'Expected command: <code>' + esc(t.canonical) + '</code>' };
      }
      var items = [];
      var H = 0, W = 0;
      var i;
      for (i = 0; i < t.elements.length; i++) {
        var ok = new RegExp(t.elements[i].re, 'i').test(cmd);
        if (ok) { H++; } 
        items.push({ state: ok ? 'ok' : 'missed', label: 'Element: ' + esc(t.elements[i].label) });
      }
      var dangerous = false;
      for (i = 0; i < (t.wrong || []).length; i++) {
        if (new RegExp(t.wrong[i].re, 'i').test(cmd)) {
          W++;
          dangerous = dangerous || !!t.wrong[i].danger;
          items.push({ state: 'bad', label: 'Wrong element: ' + esc(t.wrong[i].label) + ' — ' + esc(t.wrong[i].why) });
        }
      }
      var credit = Math.max(0, (H - W) / t.elements.length);
      return { creditRaw: credit, items: items, correctSummary: 'Canonical command: <code>' + esc(t.canonical) + '</code>', dangerous: dangerous };
    }
  };
}

/* ---------- Log viewer (filter box + panels in SCENARIO + embedded answer widget) ---------- */
function buildLogview(ex, box){
  var lg = (ex.scenario && ex.scenario.log) ? ex.scenario.log : ex.log;
  var scenBody = document.querySelector('#excard .blk-scenario .block-body');
  var host = scenBody || box;
  for (var i = 0; i < lg.panels.length; i++) {
    var p = lg.panels[i];
    var a = h('div', 'artefact');
    a.appendChild(h('div', 'artefact-label', esc(p.label)));
    if (p.filter) {
      var tools = h('div', 'logtools');
      var inp = document.createElement('input');
      inp.placeholder = 'Filter lines (case-insensitive)...';
      inp.setAttribute('aria-label', 'Filter log lines');
      tools.appendChild(inp);
      tools.appendChild(h('span', 'logfilter-note', 'mimics Kibana / Splunk search'));
      a.appendChild(tools);
      var pre = h('pre', 'code');
      pre.innerHTML = hl(p.code);
      a.appendChild(pre);
      var lines = p.code.split('\n');
      inp.addEventListener('input', function () {
        var q = inp.value.toLowerCase();
        var out = [];
        for (var k2 = 0; k2 < lines.length; k2++) {
          if (q === '' || lines[k2].toLowerCase().indexOf(q) !== -1) { out.push(lines[k2]); }
        }
        pre.innerHTML = hl(out.join('\n'));
      });
    } else {
      var pre2 = h('pre', 'code');
      pre2.innerHTML = hl(p.code);
      a.appendChild(pre2);
    }
    host.appendChild(a);
  }
  var embed = lg.embed;
  if (embed.kind === 'multi') {
    return buildMulti({ options: embed.options, answers: embed.answers }, box);
  }
  return buildQCM({ options: embed.options, answer: embed.answer }, box);
}

/* ---------- widget dispatcher ---------- */
function buildWidget(ex, box, hintArea){
  var w;
  if (ex.type === 'qcm') { w = buildQCM(ex, box); }
  else if (ex.type === 'multi') { w = buildMulti(ex, box); }
  else if (ex.type === 'match') { w = buildMatch(ex, box); }
  else if (ex.type === 'slot') { w = buildSlot(ex, box); }
  else if (ex.type === 'order') { w = buildOrder(ex, box); }
  else if (ex.type === 'fill') { w = buildFill(ex, box); }
  else if (ex.type === 'spot') { w = buildSpot(ex, box); }
  else if (ex.type === 'triage') { w = buildTriage(ex, box); }
  else if (ex.type === 'tree') { w = buildTree(ex, box); }
  else if (ex.type === 'terminal') { w = buildTerminal(ex, box); }
  else if (ex.type === 'logview') { w = buildLogview(ex, box); }
  else { w = buildQCM(ex, box); }
  w._hintArea = hintArea;
  return w;
}

/* ---------- feedback rendering ---------- */
Exam.renderFeedback = function (ex, idx, res, credit) {
  var fb = this._ui.fb;
  var label, cls;
  if (credit >= 0.999) { label = '&#10003; CORRECT'; cls = 'fb-ok'; }
  else if (credit > 0) { label = '&#9878; PARTIALLY CORRECT'; cls = 'fb-part'; }
  else { label = '&#10008; INCORRECT'; cls = 'fb-bad'; }
  var html = '<div class="fb-head ' + cls + '">' + label + '</div><div class="fb-body">';
  var partial = res.items.length > 1;
  if (partial) {
    var Hn = 0, Wn = 0, Mn = 0;
    for (var i = 0; i < res.items.length; i++) {
      if (res.items[i].state === 'ok') { Hn++; }
      else if (res.items[i].state === 'bad') { Wn++; }
      else { Mn++; }
    }
    /* N = correct items available (hit + missed), NOT items.length, so the
       fraction reads H/N as the scoring formula defines it */
    var Nn = Hn + Mn;
    html += '<p class="creditline">credit ' + credit.toFixed(2) + ' — ' + Hn + '/' + Nn + ' items correct' +
      (Wn ? ', ' + Wn + ' wrong item(s) subtracted' : '') + ' &nbsp;(formula: max(0, (H &minus; W) / N))</p>';
  }
  if (this.hintUsed[idx]) {
    html += '<p class="creditline" style="color:var(--amber)">&#128161; Hint used: &minus;0.10 applied to this exercise\'s credit.</p>';
  }
  if (this.answered[idx] && this.answered[idx].expired) {
    html += '<p class="err">&#9201; The per-exercise timer ended, so this exercise was graded with what you had typed.</p>';
  }
  if (partial) {
    html += '<h4>Item-by-item</h4>';
    for (var j = 0; j < res.items.length; j++) { html += itemRow(res.items[j].state, res.items[j].label); }
  }
  html += '<h4>Correct answer</h4><p>' + (res.correctSummary || '') + '</p>';
  html += '<h4>Why</h4><div class="expl">' + ex.explain + '</div>';
  if (ex.itemExplain) {
    html += '<h4>Per-item reasons</h4><ul>';
    for (var k2 = 0; k2 < ex.itemExplain.length; k2++) { html += '<li>' + ex.itemExplain[k2] + '</li>'; }
    html += '</ul>';
  }
  if (res.dangerous) {
    html += '<div class="danger">&#9888; <b>Dangerous command warning:</b> your command looked close to the right one but would have changed or destroyed evidence. In real investigations, never modify the original artefact. Work on copies.</div>';
  }
  if (ex.persp) {
    html += '<h4>Two sides of the same coin</h4><p>' + ex.persp + '</p>';
  }
  html += '<div class="study"><b>What to study next:</b> ' + ex.study + '</div>';
  html += '</div>';
  fb.innerHTML = html;
  fb.hidden = false;
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
};

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
