    '<b>Partial credit</b> applies to every multi-answer exercise; wrong selections subtract. One hint per exercise costs 10% of that exercise\'s credit — and at this level hints only remove one wrong path, they never name the answer.',
    '<b>Skipping</b> is free; review skipped exercises before you finish, while the timer still runs.',
    'At least two options in many exercises are defensible in a different context but wrong here. Justify every choice. Press <b>Start</b> when ready.'
  ]
};

var EX = [
{id:'hard-01',type:'qcm',
 sc:[{t:'ARTEFACT 1 — Firewall log (fw-edge-01, night window)',viewer:true,lines:['2026-10-19 23:02:11 fw-edge-01 %SYS-5-CONFIG_I: Configured from console by svc-netops on vty0 (10[.]20[.]9[.]140)','2026-10-19 23:02:12 fw-edge-01 %PARSER-5-CFGLOG_LOGGEDCMD: ip nat inside source static tcp 10[.]44[.]2[.]15 3389 interface Gi0/0 3390','2026-10-19 23:04:40 fw-edge-01 %SEC-6-IPACCESSLOGP: list OUTSIDE-IN permitted tcp 198[.]51[.]100[.]77(51440) -> 10[.]44[.]2[.]15 eq 3389','2026-10-19 23:05:02 fw-edge-01 %SEC-6-IPACCESSLOGP: list OUTSIDE-IN permitted tcp 198[.]51[.]100[.]77(51443) -> 10[.]44[.]2[.]15 eq 3389']},
     {t:'ARTEFACT 2 — Change database',x:'<p class="sc-p">CHG-2230 (approved, window 23:00–23:30, owner: network team): "Apply vendor QoS template." QoS commands were applied. <b>No NAT change appears in CHG-2230 or any other approved ticket.</b></p>'}],
 sum:'One config session, two different purposes inside it',
 q:'Which line is the TRUE indicator that something beyond the approved change happened?',
 o:['The CONFIG_I line at 23:02:11 — any config change during a window is suspicious','The QoS commands applied by the network team','The static NAT command that publishes internal RDP on the border address','The permitted RDP flows, because RDP should never be permitted anywhere'],
 c:[2],
 why:'The session itself is approved (CHG-2230, svc-netops, the window), so the CONFIG_I line and the QoS work are routine. The giveaway is the <b>logged command</b>: <code>ip nat inside source static tcp 10[.]44[.]2[.]15 3389 interface Gi0/0 3390</code> publishes an internal host\'s RDP on the border device\'s address — a boundary bridge no ticket covers. The RDP flows that follow are the consequence, not the cause: banning RDP everywhere would be wrong, because RDP is legitimate inside the network. The lesson: in an approved window, judge the <i>content</i> of the change, not the fact that a change happened.',
 study:'using %PARSER-5-CFGLOG_LOGGEDCMD to see WHAT changed, not just that something changed.',
 hint:'The ticket approves one kind of work. Which logged command does no ticket cover?'},
{id:'hard-02',type:'multi',
 sc:[{t:'ARTEFACT 1 — Intrusion notes (APT41 profile)',x:'<p class="sc-p">On the T1599 page, APT41 is the documented example: they used <b>NATBypass</b> to bypass firewall restrictions and reach compromised systems via RDP. Your team found the following in an intrusion. Select the THREE findings that genuinely support a link to the APT41 playbook.</p>'}],
 sum:'Which findings support the APT41 attribution?',
 q:'Select the THREE findings that support linking this intrusion to the documented APT41 behaviour.',
 o:['A NATBypass binary on a jump host, with firewall rules bent to reach internal RDP','RDP sessions from the jump host into NAT-protected internal servers, matching the tool\'s purpose','The same NATBypass tooling re-appearing in a second victim network in the same campaign','RDP was used somewhere in the environment','Some generic tunneling tool was present on a laptop','Two login timestamps fall in the UTC+8 working day'],
 c:[0,1,2],
 why:'Strong attribution evidence follows the documented pattern specifically: the <b>NATBypass tool itself</b>, its <b>purpose seen in action</b> (RDP reached through the bent firewall rules), and <b>tool re-use across victims in one campaign</b> — that chain matches the APT41 example on the T1599 page. The weak items are tempting but generic: RDP and tunneling exist in almost every intrusion, and a timezone hint supports, at best, a regional hypothesis — not a technique match. Attribution rests on specific TTP overlap, not on common tools.',
 study:'how procedure examples on ATT&CK pages are used for TTP-based attribution.',
 hint:'Two of the weak findings would appear in almost any intrusion. Keep only evidence that matches the documented playbook specifically.'},
{id:'hard-03',type:'tree',
 sc:[{t:'ARTEFACT 1 — Incident brief: MSP-managed VPN (C0043 pattern)',x:'<p class="sc-p">Your energy-sector client shares a VPN concentrator with an <b>MSP</b>. The MSP operates the device. Flow records show VPN tunnels from the MSP management range entering the OT data network directly — past the segmentation firewall. The C0043 intrusions used exactly this pattern: VPN tunnels with a potentially compromised MSP entity allowing direct access.</p>'}],
 sum:'MSP VPN tunnels reach the OT network directly',
 q:'You lead the first hour. Work through the four steps.',
 steps:[
  {text:'Step 1 — Scope: which question do you answer FIRST?',
   o:['Which tunnels entered the OT data network, from which MSP ranges, since when','Who is to blame publicly','How to announce this on social media'],c:0},
  {text:'Step 2 — The MSP is trusted infrastructure. What do you request from them, and verify on your side?',
   o:['Their admin list and session logs for the concentrator, plus your own concentrator config and AAA logs','Nothing: trust is enough','Their marketing deck'],c:0},
  {text:'Step 3 — Tunnels are confirmed from an MSP support subnet. Containment must not break the client\'s other production links. What do you do?',
   o:['Shut down the whole MSP partnership immediately','Block the specific tunnel ranges on an unaffected device in path and revoke the specific VPN accounts involved','Change every password in the company during business hours'],c:1},
  {text:'Step 4 — MSP confirms one support account was compromised. What is the follow-up that actually closes the gap?',
   o:['Ask the MSP nicely to be careful','Ban all outsourcing forever','Require MFA on the concentrator (M1032), review privileged accounts (M1026), and segment MSP access from OT networks'],c:2}],
 why:'Step 1: scoping comes first — which tunnels, which ranges, since when — or every later decision guesses. Step 2: because the MSP is trusted, you verify from both sides: their admin sessions, your config and AAA logs. Step 3: containment must be surgical — block the specific tunnel ranges upstream and revoke the specific accounts, not burn the whole partnership and production with it. Step 4: the durable fix is the mitigation set from the T1599 page: MFA for device access, strict privileged account management, and segmentation of third-party access. The C0043 intrusions showed how devastating the unsolved version of this pattern is.',
 study:'third-party (MSP) trust abuse and the M1032/M1026 mitigations.',
 hint:'Every step asks for the narrowest action that still answers the question or stops the access.'},
{id:'hard-04',type:'dnd',
 sc:[{t:'ARTEFACT 1 — Four evidence items (one incident)',x:'<p class="sc-p">Drag each evidence item to the technique it best evidences. All four come from the same investigation.</p>'}],
 sum:'Label evidence with the technique it shows',
 q:'Drag each item onto the technique label it evidences.',
 slots:['Bridging at the perimeter (T1599)','NAT traversal of a device (T1599.001)','Chained proxy C2 path (T1090.003)','Copied exfiltration streams (T1020.001)'],
 items:['A static NAT rule publishing internal RDP was added on the border firewall, then inbound RDP followed','The NAT table shows a translation for an internal host while no static rule exists in the config','Traffic to the C2 server leaves via three different compromised hosts in sequence','The same data stream is seen leaving to two outside destinations at once'],
 correct:[0,1,2,3],
 why:'Each item shows one distinct behaviour. Adding a static NAT on the border firewall (with traffic following) is the perimeter bridge. A translation with <b>no matching rule</b> points at NAT traversal — the sub-technique T1599.001. Traffic leaving through several hosts in sequence is the multi-hop chain. One data stream leaving to two destinations at once is duplication during exfiltration. Mixing these labels is the classic reporting error: the mitigation and the detection differ for each one.',
 study:'telling T1599, T1599.001, T1090.003 and T1020.001 apart in evidence.',
 hint:'Separate the four questions: what did the device allow, what did its NAT do, how did traffic route out, and where did data copies go?'},
{id:'hard-05',type:'term',
 sc:[{t:'ARTEFACT 1 — Response context',x:'<p class="sc-p">Active case BR-118. You have an admin SSH session on border router rtr-edge-01. The case owner asks: "Does the live NAT table currently contain a translation for internal host 10[.]44[.]2[.]77? Confirm, and change nothing."</p>'}],
 sum:'Confirm a live NAT translation without changing anything (no tool named)',
 q:'Type the command, press Enter to run it, then press Check.',
 prompt:'rtr-edge-01#',
 banner:['rtr-edge-01 line 1, active case BR-118. Evidence mode: read-only expected.'],
 goal:'Confirm whether the live NAT table holds a translation for 10[.]44[.]2[.]77. Nothing else. No tool is named — you choose it.',
 simOut:[{re:'^show\\s+ip\\s+nat\\s+translations(\\s*\\|\\s*include\\s+10\\.44\\.2\\.77)?',out:['Pro  Inside global        Inside local        Outside local       Outside global','tcp 203[.]0[.]113[.]9:56101 10[.]44[.]2[.]77:56101 198[.]51[.]100[.]77:8443 198[.]51[.]100[.]77:8443','--- 1 matching translation found ---']},{re:'^show\\s+ip\\s+nat\\s+statistics',out:['Total active translations: 12','Hits: 90122  Misses: 4','(statistics view only — the case asked for the translation table)']},{re:'^show\\s+ip\\s+route',out:['Gateway of last resort is 203[.]0[.]113[.]1 to network 0[.]0[.]0[.]0','C 203[.]0[.]113[.]0/24 is directly connected, GigabitEthernet0/0','(routing table — not what the case asked)']}],
 correctElems:[{s:'show',name:'read-only verb "show"'},{s:'ip nat translation',name:'the NAT translations table'},{s:'| include 10[.]44[.]2[.]77',name:'the include filter for the host (plain dots accepted; optional but expected)'}],
 wrongElems:[{s:'clear',name:'"clear" would destroy the live translation — evidence destruction',dangerous:true,msg:'"clear ip nat translation ..." removes exactly the state the case owner asked you to confirm. In an active case that is evidence destruction. Read-only "show" commands confirm without touching state.'},{s:'statistics',name:'"statistics" shows counters, not address-pair translations'},{s:'ip route',name:'"ip route" reads the routing table, not the NAT table'}],
 canon:'show ip nat translations | include 10[.]44[.]2[.]77',
 canonWhy:'<p style="margin:6px 0 0"><b>show ip nat translations</b> — the live address-pair table. <b>| include 10[.]44[.]2[.]77</b> — narrows it to the host in question. The statistics view counts sessions but never shows which inside host talks to which outside host — the near-miss that feels close but answers a different question.</p>',
 why:'The question is "does the live table contain a translation for this host", so the answer is the read-only <b>translations table</b>, narrowed with an <b>include filter</b>. The statistics view is the near-miss: it proves sessions exist but not the address pair. The routing table answers routing, not NAT. Any "clear" command is evidence destruction in an active case and would trigger the dangerous near-miss warning.',
 study:'which IOS view answers "who talks to whom right now": the NAT translations table.',
 hint:'Two views on this router start with "show ip nat". Only one of them lists address pairs.'},
{id:'hard-06',type:'order',
 sc:[{t:'ARTEFACT 1 — Response options memo (case BR-118)',x:'<p class="sc-p">The bridging is confirmed on rtr-edge-01. The war room lists four possible actions. Rank them from LEAST to MOST aggressive, so that evidence survives and the business impact stays justified.</p>'}],
 sum:'Rank response actions from least to most aggressive',
 q:'Order the four actions from least aggressive (first) to most aggressive (last).',
 items:['Export the running config, the config-change log and flow records','Block the specific malicious flows on an unaffected upstream device','Take the device out of the traffic path (planned outage)','Factory reset and rebuild the device from a known-good image'],
 why:'The correct order is by impact and reversibility. Exporting evidence costs nothing and must precede anything else. Blocking the specific flows on an <b>unaffected</b> device (M1037) stops the harm without touching the compromised device. Removing the device from path causes a real outage and is only justified if blocking is insufficient. A factory reset destroys the device\'s live state — including exactly the evidence the case needs — so it is the last resort, after evidence capture, and typically after replacement is staged. Doing the aggressive steps first is the classic error this ranking trains away.',
 study:'response escalation: evidence first, surgical block, outage, rebuild last.',
 hint:'Ask for each action: what does it cost, and is it reversible? The cheapest irreversible-loss action comes first.'},
{id:'hard-07',type:'spot',
 sc:[{t:'ARTEFACT 1 — Running config excerpt (rtr-edge-01)',lines:['ip nat inside source list NAT-ALLOW interface GigabitEthernet0/0 overload','access-list NAT-ALLOW permit ip 10[.]20[.]0[.]0 0[.]0[.]255[.]255 any','aaa authentication login default group TACACS+ local','ip nat inside source static tcp 10[.]44[.]2[.]15 3389 interface GigabitEthernet0/0 3389','ntp server 10[.]20[.]9[.]10']}],
 sum:'One config line silently publishes an internal system',
 q:'Click the line that defeats the boundary by publishing an internal service to the internet.',
 lines:['ip nat inside source list NAT-ALLOW interface GigabitEthernet0/0 overload','access-list NAT-ALLOW permit ip 10[.]20[.]0[.]0 0[.]0[.]255[.]255 any','aaa authentication login default group TACACS+ local','ip nat inside source static tcp 10[.]44[.]2[.]15 3389 interface GigabitEthernet0/0 3389','ntp server 10[.]20[.]9[.]10'],
 c:[3],
 why:'Line 4 is a <b>static NAT</b> for an internal host\'s RDP port (3389) onto the border interface address. From the internet, the internal host 10[.]44[.]2[.]15 is now directly reachable — the boundary is bridged by one line, which is why T1599 matters at config level. Line 1 with line 2 is ordinary dynamic NAT (port overload) for outbound browsing. Line 3 is the M1032/TACACS+ login check doing its job. Line 5 is time sync. The dangerous line looks as boring as the healthy ones — that is the trap.',
 study:'static NAT entries in running configs and what they publish.',
 hint:'Three lines describe normal behaviour of the device. One line makes an inside host reachable from outside.'},
{id:'hard-08',type:'qcm',
 sc:[{t:'ARTEFACT 1 — Two conflicting records',code:['Device log 02:14:11 %SYS-5-CONFIG_I: Configured from console by svc-netops (comment: "per CHG-2214")','Change DB: CHG-2214 — status: REJECTED (2026-10-15). No other change approved for tonight.']},
     {t:'ARTEFACT 2 — Clock note',x:'<p class="sc-p">The device clock is NTP-synced and was verified correct at the time of the log line.</p>'}],
 sum:'The log claims an approved change; the change database says it was rejected',
 q:'The device log claims the change was "per CHG-2214", but the change database shows CHG-2214 was REJECTED. Which conclusion is correct?',
 o:['Trust the log comment: the device wrote it, so it is authoritative','Trust the change database state: treat the change as unauthorised and verify who really logged in','Ignore both: config changes happen all the time','Treat it as an approved change because the comment mentioned a ticket number'],
 c:[1],
 why:'A log comment is free text: whoever made the change can type anything — including a plausible ticket number. The <b>change database state</b> is the record of what was actually approved, and it says REJECTED. With the clock verified, the right reading is: an unauthorised change falsely labelled as approved — a common attacker move to buy time. "Trust the comment" and "ignore both" both hand the decision to the attacker.',
 study:'why ticket numbers in log comments must be verified against the change database.',
 hint:'One side is a written claim made during the change. The other side is the approval system itself.'},
{id:'hard-09',type:'match',
 sc:[{t:'ARTEFACT 1 — Four log lines from different devices',viewer:true,lines:['02:14:07 fw-edge-01 CONFIG_I configured by svc-netops (CHG-2230, approved window)','02:15:44 fw-edge-01 permitted tcp 198[.]51[.]100[.]77(51440) -> 10[.]44[.]2[.]15 eq 3389 (right after an unapproved NAT addition)','01:13:30 fw-edge-01 permitted tcp 10[.]30[.]5[.]10(50122) -> 198[.]51[.]100[.]77 eq 8443 (same time, same hosts, every night)','03:20:12 rtr-core-01 NAT translation active for 10[.]44[.]2[.]77 with no matching static rule in config']}],
 sum:'Four similar-looking lines; four different meanings',
 q:'Match each line to its correct reading.',
 left:['Line 1 — CONFIG_I by svc-netops citing approved CHG-2230','Line 2 — permitted inbound RDP right after an unapproved NAT addition','Line 3 — permitted outbound 8443 flow, same hosts, every night at 01:13','Line 4 — live NAT translation for 10[.]44[.]2[.]77 with no matching static rule'],
 right:['Routine: an approved change inside its window','Indicator: the rule change and the traffic together form the bridging pattern','Routine: a recurring nightly flow — check the baseline and the ticket, not the alarm','Indicator: possible NAT traversal — correlate with configuration history'],
 correct:[0,1,2,3],
 why:'The same words ("permitted", "configured") carry different weight per context. Line 1 has an <b>approved ticket</b> and sits in its window: routine. Line 2 pairs an <b>unapproved rule change</b> with the traffic that immediately used it: the bridging pattern. Line 3 is a <b>recurring flow</b> — the T1599 detection idea is about NEW unexpected flows, so first check the baseline and the change record before crying wolf. Line 4 shows state that the config cannot explain: the T1599.001 signature. Line-to-meaning matching like this is the daily work of a SOC analyst.',
 study:'context decides: ticket, sequence, recurrence, and config-state mismatch.',
 hint:'Two lines are indicators, two are routine. The ticket, the timing, the recurrence and the missing rule decide which.'},
{id:'hard-10',type:'multi',
 sc:[{t:'ARTEFACT 1 — SIEM correlation builder',x:'<p class="sc-p">You are building the T1599 correlation rule. The detection strategy: "configuration changes on a router/firewall followed by unexpected traffic patterns, especially from unusual sources, is a strong indicator." Choose the TWO events the rule must join.</p>'}],
 sum:'Which two events does the correlation rule join?',
 q:'Select the TWO events the rule must join within a short time window.',
 o:['A configuration change on the firewall or router','New cross-boundary traffic from an unusual source, right after the change','A CPU spike on the same device','A 3 ms NTP drift','The nightly backup completion event'],
 c:[0,1],
 why:'The strategy is explicitly a <b>two-event correlation</b>: the config change is the action, and the following unexpected cross-boundary traffic is the effect. A CPU spike and NTP drift are device-health events; the backup job is scheduled noise. Either half alone fires all day long and drowns the analyst — joined, they are the strong indicator the strategy describes.',
 study:'building the two-sided correlation: change event + following unusual flow.',
 hint:'One half is what changed on the device. The other half is what the network did because of it.'},
{id:'hard-11',type:'tree',
 sc:[{t:'ARTEFACT 1 — Friday night (fw-edge-01)',x:'<p class="sc-p">23:00 — fw-edge-01 config changed. No SOC ticket exists. A vendor maintenance window email exists for tonight ("vendor QoS work, 22:00–00:00, engineer via vendor jump host").</p>'}],
 sum:'A scary change on a night with a vendor window',
 q:'Three steps. Some things that look alarming are benign — until one thing is not.',
 steps:[
  {text:'Step 1 — First move?',
   o:['Immediately block the vendor network everywhere','Verify the window email and match the vendor engineer\'s session in the access log against it','Wipe the device configuration'],c:1},
  {text:'Step 2 — The access log shows the vendor engineer from the documented jump host inside the window; the diff shows only the QoS template plus removal of a temporary rule from last week. Now what?',
   o:['Escalate as a confirmed intrusion','Close as routine and attach the window email to the case','Disable TACACS+ for the night'],c:1},
  {text:'Step 3 — One extra line in the same session does not fit: a new static NAT for an internal host that no email, ticket or vendor note explains. Now what?',
   o:['Assume the vendor added it for their work','Open an incident: the approved window does not explain this line, and the vendor must confirm in writing','Reboot the firewall and move on'],c:1}],
 why:'Step 1: verification is cheaper than panic — the window email and the access log either match or they do not. Step 2: when identity, timing and the diff all fit the approved work, the least aggressive correct action is to close as routine <i>with the evidence attached</i>; escalating would burn trust, and disabling TACACS+ would disable your own visibility. Step 3: the moment one line does not fit, the window stops covering the session — an unexplained static NAT is exactly the T1599 bridge line, so it opens an incident and demands written vendor confirmation. Verification resolves the benign part; it never whitewashes the unexplained part.',
 study:'verifying vendor sessions, and why one unexplained line reopens the case.',
 hint:'Each step offers one measured action and two extreme ones. Extreme first moves cost evidence and trust.'},
{id:'hard-12',type:'term',
 sc:[{t:'ARTEFACT 1 — Review request',x:'<p class="sc-p">Case BR-118 continues. The reviewer asks: "Show me only the NAT-related lines of the CURRENT running configuration on rtr-edge-01 — I want to see what is live, not what was saved. You have admin SSH. Choose your own command."</p>'}],
 sum:'View only NAT lines of the live running config (no tool named)',
 q:'Type the command, press Enter to run it, then press Check.',
 prompt:'rtr-edge-01#',
 banner:['rtr-edge-01 line 2, active case BR-118. Evidence mode: read-only expected.'],
 goal:'Show only the NAT-related lines of the current running configuration. No tool is named — choose the command and the filter.',
 simOut:[{re:'^show\\s+run(ning-config)?\\s*\\|\\s*include\\s+nat',out:['ip nat inside source list NAT-ALLOW interface GigabitEthernet0/0 overload','ip nat inside source static tcp 10[.]44[.]2[.]15 3389 interface GigabitEthernet0/0 3389','access-list NAT-ALLOW permit ip 10[.]20[.]0[.]0 0[.]0[.]255[.]255 any','--- 3 NAT-related lines (running config) ---']},{re:'^show\\s+startup-config',out:['! startup configuration (last saved 2026-10-01)','...(this is the SAVED config — the case asked for the live one)...']}],
 correctElems:[{s:'show',name:'read-only verb "show"'},{s:'running-config',name:'the live running configuration (short form "run" accepted)',accept:['running-config','running config','run ']},{s:'| include nat',name:'the filter "| include nat" (plain word match)'}],
 wrongElems:[{s:'copy running-config startup-config',name:'saving the config would freeze the attacker\'s changes as the new baseline',dangerous:true,msg:'"copy running-config startup-config" SAVES the current state. In this case that would persist the attacker\'s bridge lines and overwrite the known-good baseline. Review, never save, during evidence mode.'},{s:'write memory',name:'"write memory" also saves the config (same danger)',dangerous:true,msg:'"write memory" saves the running config — the same evidence problem as copying to startup.'},{s:'reload',name:'"reload" reboots the device and destroys live state',dangerous:true,msg:'"reload" reboots the router: translations, unsaved state and live evidence are gone.'},{s:'startup-config',name:'"startup-config" shows the SAVED config, not the live one'}],
 canon:'show running-config | include nat',
 canonWhy:'<p style="margin:6px 0 0"><b>show running-config</b> — what the device is running right now. <b>| include nat</b> — only the NAT-related lines. Saving ("write memory", "copy run start") would make the attacker\'s changes permanent, and the startup-config view would hide them — the two classic evidence mistakes on network devices.</p>',
 why:'The reviewer asked for the <b>live</b> config, filtered to NAT lines: <code>show running-config | include nat</code>. The saved (startup) config would not show what is running now — and might not show the attacker\'s change at all if it was never saved. The dangerous near-misses all WRITE: saving the config makes the attacker\'s lines permanent, reloading destroys live state. During a case, read-only commands only.',
 study:'running-config versus startup-config, and why you never save during a case.',
 hint:'One view shows what is live, one shows what was saved. And two common shortcuts would save the config instead of showing it.'},
{id:'hard-13',type:'dnd',
 sc:[{t:'ARTEFACT 1 — Control portfolio (six controls)',x:'<p class="sc-p">Sort the controls by WHEN they act against boundary bridging. Two belong to each column.</p>'}],
 sum:'Controls sorted by phase: prevent, detect, respond',
 q:'Drag each control into the phase where it acts.',
 slots:['Prevent: stops the bridge from forming','Detect: reveals a bridge in progress or past','Respond: limits or removes an active bridge'],
 items:['M1032 Multi-factor Authentication on device admin access','Config-change alerting on boundary devices','M1037: block flows on an unaffected in-path device','Encrypted local device credentials (M1043)','Correlating config changes with unusual cross-boundary flows','Admin credential rotation after a compromise'],
 correct:[0,1,2,0,1,2],
 why:'Prevention stops the attacker reaching device admin: MFA (M1032) and encrypted local credentials (M1043). Detection lives in telemetry: config-change alerting and the change-plus-flow correlation from the detection strategy. Response handles the active case: the M1037 upstream block and credential rotation so the stolen access dies. Sorting controls this way shows a portfolio: a team that only prevents is blind, a team that only responds is always late.',
 study:'the prevent/detect/respond split for T1599 controls.',
 hint:'Two controls are log-based, two are access-based, two are actions during an incident.'},
{id:'hard-14',type:'qcm',
 sc:[{t:'ARTEFACT 1 — CTI note (telecom intrusion)',x:'<p class="sc-p">"Investigators attribute the telecom intrusion to <b>Salt Typhoon (G1045)</b>. On the T1599 page, Salt Typhoon is documented as having abused peer connections to exfiltrate data. The network team must label the behaviours correctly in the report."</p>'}],
 sum:'Labelling the Salt Typhoon example correctly',
 q:'Which technique pair best labels the documented behaviours?',
 o:['T1566 phishing plus T1486 file encryption','T1599 boundary bridging plus T1020.001 traffic duplication during exfiltration','T1599 plus T1110 brute forcing','T1098 account manipulation plus T1041 exfiltration over C2'],
 c:[1],
 why:'The T1599 page documents Salt Typhoon under Network Boundary Bridging, and its exfiltration behaviour matches <b>Traffic Duplication (T1020.001)</b>, the follow-on technique the T1599 text names for sending data out in copied streams. Phishing and file encryption belong to a different intrusion shape; brute forcing is credential guessing; T1041 is exfil over an existing C2 channel without duplication. Correct labelling matters because each pair drives different detections.',
 study:'the Salt Typhoon procedure example on the T1599 page.',
 hint:'One pair is built from the two techniques this page links together.'},
{id:'hard-15',type:'fib',
 sc:[{t:'ARTEFACT 1 — Device management policy (draft, M1026)',x:'<p class="sc-p">You are drafting the network-device account policy from mitigation M1026. Three words are missing.</p>'}],
 sum:'Complete the privileged account policy',
 q:'Complete the policy sentence from the word bank.',
 text:'Keep device {{0}} accounts to as few individuals as possible, {{1}} credential overlap between network and non-network platforms, and apply the {{2}} principle everywhere.',
 bank:['administrator','prevent','least privilege','encryption','quarterly'],
 blanks:[{accept:['administrator','admin']},{accept:['prevent','block','stop','avoid']},{accept:['least privilege','least-privilege','least privilege.']}],
 why:'M1026 says it almost word for word: restrict administrator accounts to as few individuals as possible, prevent credential overlap across systems — particularly between network and non-network platforms — and follow least privilege. The reason is the T1599 chain: every overlapping password is one more path to the device admin rights an attacker needs to bridge the boundary. "Encryption" is real (M1043) but belongs to storage, not account counts; "quarterly" is a review cadence, not this principle.',
 study:'Mitigation M1026 and why credential overlap matters for network devices.',
 hint:'The first blank names the account type; the second stops reuse; the third is the famous two-word principle.'},
{id:'hard-16',type:'spot',

/* ---------- grading ---------- */
function grade(ex){
 var w=S.w,g={H:0,W:0,N:1,items:[],canon:null,danger:null,credit:null},r=curRec();
 if(ex.type==='qcm'||ex.type==='multi'){
  var sel=(w.sel||[]).map(String),corr=ex.c.map(String);
  g.N=corr.length;
  sel.forEach(function(si){if(corr.indexOf(si)>=0)g.H++;else g.W++;});
  g.credit=scoreExercise(sel,corr);
  ex.c.forEach(function(ci){g.items.push({name:plainText(ex.o[ci]),state:sel.indexOf(String(ci))>=0?'ok':'miss'});});
  sel.forEach(function(si){var i2=parseInt(si,10);if(ex.c.indexOf(i2)<0)g.items.push({name:plainText(ex.o[i2]),state:'bad'});});
 }else if(ex.type==='spot'){
  g.N=1;var s0=(w.sel||[])[0];
  if(s0===ex.c[0])g.H=1;else g.W=1;
  g.items=[];
  if(s0==null)g.items.push({name:'No line was clicked',state:'miss'});
  else if(s0!==ex.c[0])g.items.push({name:'Line '+(s0+1)+': '+ex.lines[s0],state:'bad'});
  g.items.push({name:'Line '+(ex.c[0]+1)+': '+ex.lines[ex.c[0]],state:s0===ex.c[0]?'ok':'miss'});
 }else if(ex.type==='dnd'){
  g.N=ex.items.length;
  ex.items.forEach(function(_,i){
   var si=-1;w.slots.forEach(function(arr,ix){if(arr.indexOf(i)>=0)si=ix;});
   if(si<0)g.items.push({name:plainText(dndLabel(ex,i))+' — left unsorted',state:'miss'});
   else if(si===ex.correct[i]){g.H++;g.items.push({name:plainText(dndLabel(ex,i))+' → '+plainText(ex.slots[si]),state:'ok'});}
   else{g.W++;g.items.push({name:plainText(dndLabel(ex,i))+' → placed in "'+plainText(ex.slots[si])+'"',state:'bad'});}
  });
  (ex.extra||[]).forEach(function(_,k){
   var i=100+k,si=-1;w.slots.forEach(function(arr,ix){if(arr.indexOf(i)>=0)si=ix;});
   if(si>=0){g.W++;g.items.push({name:'Distractor placed: '+plainText(dndLabel(ex,i)),state:'bad'});}
  });
 }else if(ex.type==='order'){
  g.N=ex.items.length;
  w.ord.forEach(function(i,pos){
   if(i===pos){g.H++;g.items.push({name:'Position '+(pos+1)+': '+plainText(ex.items[i]),state:'ok'});}
   else{g.W++;g.items.push({name:'Position '+(pos+1)+': you placed "'+plainText(ex.items[i])+'"; correct: "'+plainText(ex.items[pos])+'"',state:'bad'});}
  });
 }else if(ex.type==='match'){
  g.N=ex.left.length;
  document.querySelectorAll('#answ select[data-mrow]').forEach(function(sl){
   var li=parseInt(sl.getAttribute('data-mrow'),10),v=parseInt(sl.value,10);
   if(v<0)g.items.push({name:ex.left[li]+' — no answer',state:'miss'});
   else if(v===ex.correct[li]){g.H++;g.items.push({name:plainText(ex.left[li])+' → '+plainText(ex.right[v]),state:'ok'});}
   else{g.W++;g.items.push({name:plainText(ex.left[li])+' → '+plainText(ex.right[v]),state:'bad'});}
  });
 }else if(ex.type==='fib'){
  g.N=ex.blanks.length;
  document.querySelectorAll('#answ input[data-b]').forEach(function(inp){
   var bi=parseInt(inp.getAttribute('data-b'),10),v=nrmIP(inp.value);
   var ok=ex.blanks[bi].accept.some(function(a){return nrmIP(a)===v;});
   if(!v)g.items.push({name:'Blank '+(bi+1)+' — left empty',state:'miss'});
   else if(ok){g.H++;g.items.push({name:'Blank '+(bi+1)+': "'+inp.value+'"',state:'ok'});}
   else{g.W++;g.items.push({name:'Blank '+(bi+1)+': "'+inp.value+'" — not a fit',state:'bad'});}
  });
 }else if(ex.type==='term'){
  var cmd=(w.cmd&&w.ran)?w.cmd:($('#tcmd')?$('#tcmd').value:'');
  g.N=ex.correctElems.length;g.canon=ex.canon;
  if(!cmd||!cmd.replace(/\s/g,'')){
   g.items=[{name:'You did not type a command',state:'miss'}];
  }else{
   var n=nrmIP(cmd);
   ex.correctElems.forEach(function(ce){
    var found=(ce.accept||[ce.s]).some(function(a){return n.indexOf(nrmIP(a))>=0;});
    if(found){g.H++;g.items.push({name:'Element: '+ce.name,state:'ok'});}
    else g.items.push({name:'Element: '+ce.name,state:'miss'});
   });
   (ex.wrongElems||[]).forEach(function(we){
    if(n.indexOf(nrmIP(we.s))>=0){g.W++;g.items.push({name:'Used: '+we.s+' — '+we.name,state:'bad'});if(we.dangerous)g.danger=we;}
   });
  }
 }else if(ex.type==='tree'){
  g.N=ex.steps.length;
  ex.steps.forEach(function(st,si){
   var v=w.chosen?w.chosen[si]:null;
   if(v==null)g.items.push({name:'Step '+(si+1)+' — no answer',state:'miss'});
   else if(v===st.c){g.H++;g.items.push({name:'Step '+(si+1)+': '+plainText(st.o[v]),state:'ok'});}
   else{g.W++;g.items.push({name:'Step '+(si+1)+': you chose "'+plainText(st.o[v])+'"',state:'bad'});}
  });
 }
 if(g.credit==null)g.credit=Math.max(0,(g.H-g.W)/Math.max(1,g.N));
 return g;
}
/* ---------- check / feedback / navigation ---------- */
function onCheck(){
 var i=S.order[S.cur],ex=curEx(),r=curRec();
 if(r&&r.checked)return;
 if(S.timer.state!=='RUNNING')return;
 var g=grade(ex);
 var credit=g.credit;
 if(r&&r.usedHint)credit=Math.max(0,credit-0.10);
 credit=Math.round(credit*100)/100;
 r=r||{};r.credit=credit;r.checked=true;r.usedHint=!!r.usedHint;r.skipped=false;r.g=g;
 S.rec[i]=r;S.sum+=credit;S.answered++;
 S.skipped=S.skipped.filter(function(x){return x!==i;});
 renderFeedback(ex,r,g);
 var an=$('#answ');if(an)an.classList.add('locked');
 var last=S.cur===EX.length-1;
 $('#navrow').innerHTML=last
  ?'<button class="btn primary" data-act="final">⏹ Final Submit — see results</button>'
  :'<button class="btn primary" data-act="next">Next exercise ▶</button>';
 S.timer.prev=S.timer.state;S.timer.state='PAUSED_AUTO_CHECK';S.timer.fbStart=Date.now();
 renderHdr();renderBar();
}
function itemsFraction(g){var ok=0;g.items.forEach(function(it){if(it.state==='ok')ok++;});return ok+'/'+g.N+' items correct';}
function renderFeedback(ex,r,g){
 var lbl,cls;
 if(r.credit>=0.999){lbl='✓ CORRECT';cls='ok';}
 else if(r.credit>0){lbl='✓ PARTIALLY CORRECT';cls='part';}
 else{lbl='✗ INCORRECT';cls='bad';}
 var h='<div class="fb '+cls+'"><div class="fb-h">'+lbl
  +(r.credit>0&&r.credit<0.999?' <span class="cred">— '+itemsFraction(g)+', credit '+r.credit.toFixed(2)+'</span>':'')
  +(r.usedHint?' <span class="cred">(−0.10 hint applied)</span>':'')+'</div><div class="fb-b">';
 if(g.N>1)h+='<p style="margin:0 0 8px">Partial credit: (correct − wrong) ÷ '+g.N+' = <b class="cred">'+r.credit.toFixed(2)+'</b>. '+itemsFraction(g)+'.</p>';
 h+=g.items.map(function(it){
  return '<div class="itrow '+(it.state==='ok'?'it-ok':(it.state==='bad'?'it-bad':'it-miss'))+'"><span style="white-space:nowrap;font-weight:700">'+(it.state==='ok'?'✓ Correct':(it.state==='bad'?'✗ Wrong':'○ Missed'))+'</span><span class="in">'+esc(it.name)+'</span></div>';
 }).join('');
 h+='<p style="margin:12px 0 0"><b>Why this is the right answer:</b></p><p style="margin:4px 0 0">'+ex.why+'</p>';
 if(ex.dual)h+='<p style="margin:8px 0 0">'+ex.dual+'</p>';
 if(g.canon)h+='<p style="margin:12px 0 4px"><b>Canonical command (copyable):</b></p><pre class="code copy" tabindex="0">'+esc(g.canon)+'</pre>';
 if(ex.canonWhy)h+='<div>'+ex.canonWhy+'</div>';
 if(g.danger)h+='<div class="danger"><span class="d-t">✗ DANGEROUS — NEAR MISS</span><p style="margin:6px 0 0">'+esc(g.danger.msg)+'</p></div>';
 if(ex.study)h+='<div class="study"><b>What to study:</b> '+ex.study+'</div>';
 h+='</div></div>';
 $('#fbwrap').innerHTML=h;
}
function onNext(){
 if(S.timer.state==='PAUSED_AUTO_CHECK'){S.timer.fbSec+=Math.max(0,Math.round((Date.now()-S.timer.fbStart)/1000));S.timer.state='RUNNING';renderHdr();}
 if(S.reviewMode){S.reviewMode=false;openReview();return;}
 if(S.cur<EX.length-1){S.cur++;renderEx();window.scrollTo({top:0,behavior:(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)?'auto':'smooth'});}
}
function onSkip(){
 var i=S.order[S.cur],r=curRec();
 if(r&&r.checked)return;
 S.rec[i]=S.rec[i]||{};S.rec[i].skipped=true;S.rec[i].checked=false;
 if(S.skipped.indexOf(i)<0)S.skipped.push(i);
 if(S.reviewMode){S.reviewMode=false;openReview();return;}
 if(S.cur<EX.length-1){S.cur++;renderEx();}
 else if(S.skipped.length)openReview();
 else finishExam(false);
 window.scrollTo(0,0);
}
function onHint(){
 var i=S.order[S.cur],ex=curEx(),r=curRec();
 if(r&&r.checked)return;
 if(r&&r.usedHint)return;
 r=r||{};r.usedHint=true;S.rec[i]=r;
 $('#hintwrap').innerHTML='<div class="hintbox" role="status"><span class="h-t">💡 Hint — costs 10% of this exercise\'s credit</span><p style="margin:6px 0 0">'+ex.hint+'</p></div>';
 renderHdr();
}
function onPause(){
 if(S.timer.state==='RUNNING'||S.timer.state==='PAUSED_AUTO_CHECK'){
  S.timer.prev=S.timer.state;S.timer.state='PAUSED_MANUAL';S.timer.pauseStart=Date.now();
  document.body.classList.add('pman');renderHdr();
 }
}
function onResume(){
 document.body.classList.remove('pman');
 S.timer.manualSec+=Math.max(0,Math.round((Date.now()-S.timer.pauseStart)/1000));
 if(S.timer.prev==='RUNNING')S.timer.state='RUNNING';
 else S.timer.state='PAUSED_AUTO_CHECK';
 renderHdr();
}
function onFinal(){
 if(S.timer.state==='PAUSED_AUTO_CHECK'){S.timer.fbSec+=Math.max(0,Math.round((Date.now()-S.timer.fbStart)/1000));S.timer.state='RUNNING';renderHdr();}
 if(S.skipped.length)openReview();else finishExam(false);
}
/* ---------- review & results ---------- */
function openReview(){S.view='review';renderReview();window.scrollTo(0,0);}
function renderReview(){
 var h='<div class="pbar"><div class="pfill" style="width:100%"></div></div>';
 h+='<div class="card"><h1 style="margin:0 0 6px;font-size:22px">⚠ Review skipped exercises</h1>';
 h+='<p style="color:var(--text-secondary);margin:6px 0 14px">You have '+S.skipped.length+' skipped exercise(s). You may answer them now, as long as the timer has not ended ('+fmtT(S.timer.left)+' left). Skipped exercises that stay unanswered are excluded from your score — they count neither for nor against you.</p>';
 if(S.timer.state==='ENDED')h+='<div class="danger"><span class="d-t">■ TIME ENDED</span><p style="margin:6px 0 0">The exam time is over. Submit to see your results.</p></div>';
 if(!S.skipped.length)h+='<p>Nothing left in the skipped pool. Press Submit exam to finish.</p>';
 S.skipped.forEach(function(i){
  var ex=EX[i];
  h+='<div class="rvitem"><span class="rt">⚠ Skipped</span><span class="rq">'+esc(plainText(ex.q).slice(0,140))+'…</span><button class="btn" data-act="rv-answer" data-i="'+i+'">✎ Answer now</button></div>';
 });
 var pending=false;
 EX.forEach(function(_,i){var r=S.rec[i];if(!r||(!r.checked&&!r.skipped))pending=true;});
 h+='<div class="navrow">'+(pending&&!S.reviewMode?'<button class="btn" data-act="rv-back">◀ Back to exam</button>':'')+'<span class="spacer"></span><button class="btn primary" data-act="rv-submit">⏹ Submit exam</button></div></div>';
 $('#exwrap').innerHTML=h;renderHdr();
}
function answerSkipped(i){S.view='exam';S.reviewMode=true;S.cur=S.order.indexOf(i);renderEx();window.scrollTo(0,0);}
function renderBar(){var done=0;EX.forEach(function(_,i){var r=S.rec[i];if(r&&r.checked)done++;});var el=document.querySelector('#exwrap .pfill');if(el)el.style.width=Math.round(done/EX.length*100)+'%';}
function finishExam(timeout){
 clearInterval(S.timer.tick);S.timer.state='ENDED';S.view='results';
 renderResults(timeout);reportOnce();window.scrollTo(0,0);
}
function renderResults(timeout){
 var full=0,part=0,zero=0,partSum=0;
 EX.forEach(function(_,i){var r=S.rec[i];if(r&&r.checked){if(r.credit>=0.999)full++;else if(r.credit>0){part++;partSum+=r.credit;}else zero++;}});
 var skippedLeft=EX.length-S.answered;
 var pct=S.answered>0?Math.round(S.sum/S.answered*100):0;
 var pass=pct>=CFG.passMark;
 var used=CFG.minutes*60-S.timer.left;
 var h='<div class="card res">';
 h+='<h1 class="'+(pass?'pass':'fail')+'">'+(pass?'✓ PASS':'✗ FAIL')+'</h1>';
 h+='<div class="bignum" style="color:'+(pass?'var(--state-correct)':'var(--state-incorrect)')+'">'+pct+'%</div>';
 h+='<p style="color:var(--text-secondary)">'+(timeout?'⏱ Time ended. ':'')+'Final score over answered exercises: <b>'+S.sum.toFixed(1)+' / '+S.answered+'</b>. Skipped-and-unanswered exercises are excluded. Pass mark: '+CFG.passMark+'%.</p>';
 h+='<div class="stats">';
 h+='<div class="stat ok"><div class="num">'+full+'</div><div class="lab">✓ Fully correct</div></div>';
 h+='<div class="stat part"><div class="num">'+part+'</div><div class="lab">✓ Partially correct'+(part?' — avg credit '+(partSum/part).toFixed(2):'')+'</div></div>';
 h+='<div class="stat bad"><div class="num">'+zero+'</div><div class="lab">✗ Fully incorrect</div></div>';
 h+='<div class="stat skip"><div class="num">'+skippedLeft+'</div><div class="lab">⚠ Skipped — excluded</div></div>';
 h+='</div>';
 h+='<p style="color:var(--text-secondary);font-size:14px">⏱ Time used: '+fmtT(used)+' of '+fmtT(CFG.minutes*60)+' · ⏸ Paused manually: '+fmtT(S.timer.manualSec)+' · ⏸ Reviewing feedback: '+fmtT(S.timer.fbSec)+'</p>';
 if(pass)h+='<div class="fb ok"><div class="fb-h">✓ PASS — certificate panel</div><div class="fb-b"><p style="margin:0">Well done! You reached '+pct+'%, above the '+CFG.passMark+'% pass mark. You have shown a solid understanding of '+esc(CFG.objId)+' — '+esc(CFG.objName)+' at '+CFG.sev+' level. Keep this knowledge: next time a boundary device changes configuration and new traffic appears, you will know what to ask for.</p></div></div>';
 else h+='<div class="fb bad"><div class="fb-h">✗ FAIL — retake required</div><div class="fb-b"><p style="margin:0 0 10px">You scored '+pct+'%, below the '+CFG.passMark+'% pass mark. Reread the intro screen, review the feedback you received during the exam, and try again. You can retake the exam as many times as you want.</p></div></div>';
 h+='<div class="navrow"><span class="spacer"></span><button class="btn primary" data-act="retake" style="min-width:220px;min-height:52px">↻ Retake exam</button></div>';
 h+='</div>';
 $('#exwrap').innerHTML=h;
 $('#b-hint').disabled=true;$('#b-skip').disabled=true;
}
function reportOnce(){
 if(S.reported)return;S.reported=true;
 var percent=S.answered>0?Math.round((S.sum/S.answered)*100):0;
 if(window.parent&&window.parent!==window){
  try{
   parent.postMessage({type:'CYBERPULSE_SCORE',topicId:CFG.topicId,batch:CFG.batch,
    score:Math.round(S.sum),total:S.answered,percent:percent,passed:percent>=CFG.passMark},location.origin);
  }catch(e){/* parent origin mismatch (e.g. file:// sandbox); nothing to report to */}
 }
}
function retake(){
 document.body.classList.remove('pman');
 startExam();window.scrollTo(0,0);
}
/* ---------- header ---------- */
function renderHdr(){
 $('#h-count').textContent='Exercise '+(S.cur+1)+' of '+EX.length;
 var sev=$('#h-sev');sev.textContent=CFG.sev;sev.className='badge '+CFG.sevClass;
 $('#h-time').textContent=fmtT(S.timer.left);
 var st=$('#h-tstate');
 if(S.timer.state==='RUNNING'){st.textContent='▶ RUNNING';st.className='tstate run';}
 else if(S.timer.state==='PAUSED_MANUAL'){st.textContent='⏸ PAUSED — manual (press Resume)';st.className='tstate pm';}
 else if(S.timer.state==='PAUSED_AUTO_CHECK'){st.textContent='⏸ PAUSED — reviewing feedback (resumes on Next)';st.className='tstate pa';}
 else{st.textContent='■ ENDED';st.className='tstate end';}
 $('#h-score').textContent=S.sum.toFixed(1)+' / '+S.answered;
 $('#h-pct').textContent=(S.answered>0?Math.round(S.sum/S.answered*100)+'%':'—');
 var r=curRec();
 $('#b-hint').disabled=!!(r&&(r.checked||r.usedHint));
 $('#b-skip').disabled=!!(r&&r.checked);
 renderWho();
}
function renderWho(){$('#h-who').textContent=S.user?'👤 '+S.user:'';}
/* ---------- events ---------- */
function bind(){
 document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act');
  if(act==='start')startExam();
  else if(act==='check')onCheck();
  else if(act==='next')onNext();
  else if(act==='final')onFinal();
  else if(act==='skip')onSkip();
  else if(act==='hint')onHint();
  else if(act==='pause')onPause();
  else if(act==='resume')onResume();
  else if(act==='finishearly')onFinal();
  else if(act==='retake')retake();
  else if(act==='collapse'){var b=document.querySelector(el.getAttribute('data-t'));if(b){b.classList.toggle('collapsed');el.textContent=b.classList.contains('collapsed')?'+ expand':'— collapse';}}
  else if(act==='opt')onOpt(el);
  else if(act==='spot')onSpot(el);
  else if(act==='chip')onChip(el);
  else if(act==='dnd-item')onDndItem(el);
  else if(act==='dnd-slot')onDndSlot(el);
  else if(act==='dnd-clear')onDndClear(el);
  else if(act==='ord-up')onOrdMove(el,-1);
  else if(act==='ord-dn')onOrdMove(el,1);
  else if(act==='tree-opt')onTreeOpt(el);
  else if(act==='tree-back')onTreeBack();
  else if(act==='rv-answer')answerSkipped(parseInt(el.getAttribute('data-i'),10));
  else if(act==='rv-back'){S.view='exam';S.reviewMode=false;renderEx();}
  else if(act==='rv-submit')finishExam(false);
 });
 document.addEventListener('keydown',function(e){
  var t=e.target;
  if(t&&t.id==='tcmd'&&e.key==='Enter'){runTerm(t.value);return;}
  if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'){e.preventDefault();t.click();}
 });
 document.addEventListener('dragstart',function(e){
  var el=e.target.closest('[draggable="true"]');if(!el)return;
  S.drag={kind:el.getAttribute('data-drag'),i:parseInt(el.getAttribute('data-i'),10)};
  try{e.dataTransfer.setData('text/plain',String(S.drag.i));}catch(x){}
 });
 document.addEventListener('dragover',function(e){
  var t=e.target.closest('.slot,.orow');if(!t)return;e.preventDefault();t.classList.add('over');
 });
 document.addEventListener('dragleave',function(e){
  var t=e.target.closest('.slot,.orow');if(t)t.classList.remove('over');
 });
 document.addEventListener('drop',function(e){
  var t=e.target.closest('.slot,.orow');if(!t)return;e.preventDefault();t.classList.remove('over');
  if(!S.drag)return;
  if(t.classList.contains('slot')&&S.drag.kind==='dnd')placeDnd(S.drag.i,parseInt(t.getAttribute('data-s'),10));
  else if(t.classList.contains('orow')&&S.drag.kind==='ord')moveOrdTo(S.drag.i,parseInt(t.getAttribute('data-i'),10));
  S.drag=null;
 });
 window.addEventListener('message',function(ev){
  var d=ev.data;if(!d)return;
  if(d.type!=='CYBERPULSE_INIT'&&d.type!=='CYBERMASTERY_INIT')return;
  S.user=d.username||'';renderWho();
 });
}
document.addEventListener('DOMContentLoaded',function(){
 S.order=EX.map(function(_,i){return i;});
 bind();renderIntro();
});
</script>
