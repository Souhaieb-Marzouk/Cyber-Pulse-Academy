intro: {
learn: "<p>Welcome back to <b>T1599.001 — Network Address Translation Traversal</b>. This is a <b>sub-technique</b> in the MITRE ATT&amp;CK catalogue: a specific way to carry out the parent method <b>T1599 — Network Boundary Bridging</b>. You already know the basics; this exam connects two ideas at a time, like real SOC work does.</p><p>Quick refresher in plain words: networks keep parts of the company separated. A router or firewall stands at the border and performs <b>NAT</b>, rewriting the address fields of packets that pass through. If an attacker takes over that device and edits its NAT rules, two separated networks suddenly exchange traffic, or packets hide their true source. Because this breaks a security control, ATT&amp;CK lists the technique under the <b>Defense Impairment</b> tactic (TA0112).</p><p>In this exam you will work like the people who handle this technique every week. A SOC analyst reads a config-change alert and decides what it means. A network security engineer pulls the running config with one careful command. A detection engineer tunes the analytic <b>DET0163 / AN0465</b>, which correlates a NAT configuration change with later traffic between unexpected address pairs. An incident responder checks tickets and AAA logs to learn who made the change. A GRC analyst maps controls like MFA (M1032) and least privilege (M1026) to the intrusion path. A red teamer explains why the boundary device is the cheapest road in.</p><p>Every exercise combines exactly two connected ideas — for example, name the technique <i>and</i> name the real risk, or read a log <i>and</i> pick the response. Read both artefacts before you answer, and you will do well.</p>",

/* ---------- tiny DOM helpers ---------- */
function $(id){return document.getElementById(id);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function r1(x){return Math.round(x*10)/10;}
function pct(sum,n){return n>0?Math.round((sum/n)*100):0;}

/* ---------- boot data ---------- */
var D=Object.assign({},window.__EXAM_PART_A__);
D.exercises=(window.__EXAM_PART_A__.exercises||[]).concat(window.__EXAM_PART_B__?(window.__EXAM_PART_B__.exercises||[]):[]);
D.meta.questionCount=D.exercises.length;
var EX=D.exercises;

/* ---------- state ---------- */
var S=null;
function freshState(){
  return {
    phase:'intro',            /* intro | exam | review | results */
    list:[], pos:0,
    tstate:'IDLE',            /* IDLE | RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
    remaining:D.meta.timerSec, elapsed:0,
    pauseStart:0, pausedManualSec:0, pausedFbSec:0,
    ex:{},                    /* per-exercise runtime, keyed by exercise data index */
    skipped:[], answered:[], checked:{}, credit:{}, hint:{},
    reported:false, reviewReturn:false,
    user:{name:'',country:'',locale:''}
  };
}
function exIdx(){return S.list[S.pos];}
function EXR(i){if(!S.ex[i])S.ex[i]={};return S.ex[i];}

/* ---------- timer (single state machine) ---------- */
setInterval(function(){
  if(!S)return;
  if(S.tstate!=='RUNNING')return;
  S.remaining--; S.elapsed++;
  if(S.remaining<=0){
    S.remaining=0;S.tstate='ENDED';
    endExam('timeout');
    return;
  }
  if(S.phase==='exam'){
    var i=exIdx(),r=EXR(i),d=EX[i];
    if(d.timeLimit&&!r.checked&&r.limit==null)r.limit=d.timeLimit;
    if(d.timeLimit&&!r.checked&&r.limit!=null){
      r.limit--;
      if(r.limit<=0){autoSubmit(i);}
    }
  }
  paintHeader();
},1000);

function setPause(kind,on){
  /* kind: 'manual' | 'fb' ; on: start/stop pause accounting */
  if(on){S.pauseStart=Date.now();S.pauseKind=kind;}
  else if(S.pauseStart){
    var d=Math.round((Date.now()-S.pauseStart)/1000);
    if(S.pauseKind==='manual')S.pausedManualSec+=d;else S.pausedFbSec+=d;
    S.pauseStart=0;S.pauseKind='';
  }
}

/* ---------- exercise-order build (first run authored; retake shuffled, terminals never adjacent) ---------- */
function buildList(shuffled){
  var n=EX.length,base=[];
  for(var i=0;i<n;i++)base.push(i);
  if(!shuffled)return base;
  var ok=false,tries=0;
  while(!ok&&tries<40){
    tries++;var l=shuffle(base);ok=true;
    for(var k=1;k<l.length;k++){if(EX[l[k]].kind==='term'&&EX[l[k-1]].kind==='term'){ok=false;break;}}
    if(ok)base=l;
  }
  return base;
}

/* ================= VIEWS ================= */
function app(){return $('app');}
function clearApp(){app().innerHTML='';}

/* ---------- intro ---------- */
function renderIntro(){
  clearApp();
  S.phase='intro';
  var m=D.meta,it=D.intro;
  var w=el('div','wrap');
  var strip=el('div','card');
  strip.innerHTML=
    '<div class="strip"><h1 style="margin:0">'+esc(m.title)+'</h1>'+
    '<span class="badge sev-'+m.sevKey+'" aria-label="Severity '+esc(m.sevWord)+'">◆ '+esc(m.sevWord)+'</span></div>'+
    '<p class="sec" style="margin:6px 0 0">'+esc(m.objectLine)+'</p>'+
    '<div class="facts">'+
      '<span class="kv">📚 <b>'+EX.length+'</b>&nbsp;exercises</span>'+
      '<span class="kv">⏱ Estimated time <b>≈ '+m.estMin+' min</b> · timer budget <b>'+fmt(m.timerSec)+'</b></span>'+
      '<span class="kv">🎯 Pass mark <b>'+m.passMark+'%</b></span>'+
      '<span class="kv">🛡 ATT&amp;CK object type: <b>'+esc(m.objType)+'</b></span>'+
    '</div>';
  w.appendChild(strip);

  var learn=el('div','card');
  learn.innerHTML='<h2>📖 What you will learn here</h2>'+it.learn;
  w.appendChild(learn);

  var kw=el('div','card');
  kw.innerHTML='<h2>🔑 Keywords covered in this exam</h2><p class="sec small">Every concept below is exercised by the questions in this file.</p>';
  var grid=el('div','kwthemes');
  it.keywords.forEach(function(k){
    var c=el('div','kwtheme');
    c.innerHTML='<h3>'+esc(k.theme)+'</h3><ul>'+k.items.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
    grid.appendChild(c);
  });
  kw.appendChild(grid);
  w.appendChild(kw);

  var how=el('div','card');
  how.innerHTML='<h2>🧭 How this exam works</h2>'+
    '<p><b>Pass mark: '+m.passMark+'%.</b> Your score is computed only over the exercises you actually answered. If you skip an exercise and never answer it, it is excluded from the score completely. A PASS means you performed like a confident junior-to-mid analyst on this ATT&amp;CK object. A FAIL means you should review the feedback and retake the exam.</p>'+
    '<p><b>Exercise types in this file:</b> '+it.types.map(esc).join(' · ')+'.</p>'+
    '<p><b>Timer:</b> a countdown starts at <b>'+fmt(m.timerSec)+'</b> when you press Start. You can press <b>Pause</b> for a real break — the exercise is hidden until you press Resume. When you press <b>Check</b>, the timer stops automatically so you can read the feedback for as long as you want; it restarts only when you press <b>Next</b>. The header always shows the timer state: ▶ RUNNING, ⏸ PAUSED — manual, ⏸ PAUSED — reviewing feedback, or ⏹ ENDED.</p>'+
    '<p><b>Partial credit:</b> exercises with several correct items give fractional credit: <span class="mono">(H − W) / N</span> — correct items you found minus wrong items you added, over the number of correct items. Selecting everything to be safe gives zero. The final percentage is round(sum of credits / answered exercises × 100).</p>'+
    '<p><b>Hint:</b> one hint per exercise, and it costs −10% of that exercise\'s credit. It is a nudge, not the answer.</p>'+
    '<p><b>Skip:</b> every exercise has a Skip button. Skipped exercises go to a review pool. Before the exam ends you will see a “Review skipped exercises” screen where you can return to them and answer, as many times as you like, while the timer is still alive. Skipped-and-never-answered exercises are excluded from the score.</p>'+
    '<div class="btnrow"><button class="primary" id="startBtn" aria-label="Start the exam">▶ Start the exam</button></div>';
  w.appendChild(how);
  app().appendChild(w);
  $('startBtn').addEventListener('click',startExam);
}

function startExam(){
  var retake=S&&S.retake;
  var keepUser=S?S.user:null;
  S=freshState();
  S.retake=retake;
  if(keepUser)S.user=keepUser;
  if(retake){EX.forEach(function(d){delete d._shuf;delete d._bsh;delete d._items;delete d._right;});}
  S.list=buildList(!!retake);
  S.tstate='RUNNING';
  renderExam();
}

/* ---------- header + progress ---------- */
function tstateChip(){
  var map={
    IDLE:'⏸ Idle',RUNNING:'▶ RUNNING',PAUSED_MANUAL:'⏸ PAUSED — manual (press Resume)',
    PAUSED_AUTO_CHECK:'⏸ PAUSED — reviewing feedback (resumes on Next)',ENDED:'⏹ ENDED'
  };
  var cls='tstate';if(S.tstate==='RUNNING')cls+=' running';if(S.tstate==='ENDED')cls+=' ended';
  return '<span id="tchip" class="'+cls+'" role="status" aria-label="Timer state">'+map[S.tstate]+'</span>';
}
function paintHeader(){
  var t=$('tval');if(t)t.textContent=fmt(S.remaining);
  if($('tchip'))$('tchip').outerHTML=tstateChip();
  var sc=$('sbox');
  if(sc){
    var sum=0,cnt=S.answered.length;
    S.answered.forEach(function(i){sum+=S.credit[i]||0;});
    sc.innerHTML='Score <b>'+r1(sum)+' / '+cnt+'</b> ('+pct(sum,cnt)+'%)';
  }
  var pf=$('pfill');
  if(pf){var done=S.answered.length+S.skipped.length;pf.style.width=Math.round(100*done/EX.length)+'%';}
}
function headerHTML(){
  var m=D.meta;
  var sum=0,cnt=S.answered.length;
  S.answered.forEach(function(i){sum+=S.credit[i]||0;});
  var userChip=S.user.name?'<span class="chip">👤 Analyst: '+esc(S.user.name)+'</span>':'';
  return '<div class="xhead">'+
    '<div class="left">'+
      '<span class="chip">🧪 Exercise <b>'+(S.pos+1)+' of '+S.list.length+'</b></span>'+
      '<span class="badge sev-'+m.sevKey+'" aria-label="Severity '+esc(m.sevWord)+'">◆ '+esc(m.sevWord)+'</span>'+
      tstateChip()+
      '<span class="timer mono" aria-label="Time remaining">⏱ <span class="tval" id="tval">'+fmt(S.remaining)+'</span></span>'+
      '<span class="scorebox" id="sbox">Score <b>'+r1(sum)+' / '+cnt+'</b> ('+pct(sum,cnt)+'%)</span>'+
      userChip+
    '</div>'+
    '<div class="btnrow" style="margin:0">'+
      '<button id="hintBtn" class="warnb" aria-label="Show hint (costs 10 percent of this exercise)">💡 Hint</button>'+
      '<button id="skipBtn" aria-label="Skip this exercise">⚠ Skip</button>'+
      '<button id="pauseBtn" aria-label="Manual pause — hides the exercise">⏸ Pause</button>'+
    '</div>'+
    '<div style="flex-basis:100%"><div class="pbar"><div class="pfill" id="pfill"></div></div></div>'+
  '</div>';
}

/* ---------- artefact rendering + log filter ---------- */
function hi(line){
  var s=esc(line);
  s=s.replace(/(^|\s)(show|copy|clear|reload|grep|ip nat|access-list|username|aaa|tacacs|radius|enable|conf(igure)? t(erminal)?|write|interface|router|snmp-server|logging|no )/g,'$1<span class="tk-cmd">$2</span>');
  s=s.replace(/(10\[\.\]\d+\[\.\]\d+\[\.\]\d+|172\[\.](1[6-9]|2\d|3[01])\[\.]\d+\[\.]\d+|192\[\.]168\[\.]\d+\[\.]\d+)/g,'<span class="tk-ip">$1</span>');
  s=s.replace(/(\d+\/(tcp|udp)|\b\d{2,5}\b(?=[\s<]))/g,'<span class="tk-str">$1</span>');
  s=s.replace(/(^|\s)(!.*)$/,'$1<span class="tk-cmt">$2</span>');
  return s;
}
function buildArtifacts(container,blocks){
  blocks.forEach(function(b,bi){
    if(b.t==='p'){container.appendChild(el('p',null,b.h));return;}
    if(b.t==='note'){container.appendChild(el('div','hintbox','<span class="hlabel">ℹ NOTE</span>'+b.h));return;}
    var a=el('div','art log');
    var lab=el('div','alabel','<span>'+esc(b.label)+'</span>');
    a.appendChild(lab);
    if(b.filter){
      var fbox=document.createElement('input');
      fbox.className='fbox';fbox.placeholder='filter lines…';fbox.setAttribute('aria-label','Filter log lines');
      lab.appendChild(fbox);
      fbox.addEventListener('input',function(){
        var q=fbox.value.toLowerCase();
        Array.prototype.forEach.call(linesEl.children,function(d,i){
          d.style.display=(!q||b.lines[i].toLowerCase().indexOf(q)>=0)?'':'none';
        });
      });
    }
    var linesEl=el('div','alines');
    b.lines.forEach(function(ln){linesEl.appendChild(el('div',null,hi(ln)));});
    a.appendChild(linesEl);
    container.appendChild(a);
  });
}

/* ---------- exercise view ---------- */
function renderExam(){
  S.phase='exam';
  clearApp();
  var i=exIdx(),d=EX[i],r=EXR(i);
  var w=el('div','wrap');
  var head=el('div',null,headerHTML());
  w.appendChild(head);
  var card=el('div','card');
  card.id='excard';

  /* SCENARIO */
  var sc=el('div','blk b-scenario');
  sc.innerHTML='<div class="bhead" id="scHead" role="button" tabindex="0" aria-label="Toggle scenario panel"><span class="ic">🛰</span> SCENARIO</div>';
  var scb=el('div','bbody');
  buildArtifacts(scb,d.scenario.blocks);
  sc.appendChild(scb);
  sc.appendChild(el('div','sumline','📌 '+esc(d.scenario.summary)));
  card.appendChild(sc);
  sc.querySelector('#scHead').addEventListener('click',function(){sc.classList.toggle('collapsed');});
  sc.querySelector('#scHead').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();sc.classList.toggle('collapsed');}});

  /* QUESTION (or branch step) */
  var q=el('div','blk b-question');
  var stepHtml='';
  if(d.kind==='branch'){
    var st=r.branchStep||0;
    stepHtml='<span class="chip">STEP '+(st+1)+' OF '+d.steps.length+'</span> ';
  }
  q.innerHTML='<div class="bhead"><span class="ic">❓</span> QUESTION</div><div class="bbody"><div class="qtext">'+stepHtml+esc(d.kind==='branch'?d.steps[r.branchStep||0].q:d.q)+'</div></div>';
  card.appendChild(q);

  /* YOUR ANSWER */
  var an=el('div','blk b-answer');
  an.innerHTML='<div class="bhead"><span class="ic">✍</span> YOUR ANSWER</div>';
  var ab=el('div','bbody');
  an.appendChild(ab);
  card.appendChild(an);
  buildAnswer(ab,d,r,i);
  if(d.timeLimit&&!r.checked){
    an.appendChild(el('div','exlimit','⏱ <span>This exercise has its own reduced timer: <b>'+d.timeLimit+'s</b>. It runs only while the main timer is RUNNING and stops during every pause. The exam timer keeps running too.</span>'));
  }
  w.appendChild(card);

  /* action rows */
  var warn=el('div','warnline','✗ Please choose or type an answer before pressing Check.');
  w.appendChild(warn);
  var nav=el('div','btnrow');
  nav.id='navrow';
  w.appendChild(nav);
  var fbHost=el('div');fbHost.id='fbhost';w.appendChild(fbHost);
  app().appendChild(w);

  /* wire header buttons */
  $('hintBtn').addEventListener('click',function(){showHint(i,d,r);});
  $('skipBtn').addEventListener('click',function(){doSkip();});
  $('pauseBtn').addEventListener('click',function(){manualPause();});
  paintHeader();
  paintNav(d,r,warn);
}

function paintNav(d,r,warn){
  var nav=$('navrow');if(!nav)return;
  var i=exIdx();
  nav.innerHTML='';
  var last=(S.pos===S.list.length-1)&&!S.reviewReturn;
  if(!r.checked){
    var chk=el('button','primary','✓ Check');
    chk.id='checkBtn';
    chk.setAttribute('aria-label','Check your answer');
    chk.addEventListener('click',function(){
      var ok=hasAnswer(d,r);
      if(!ok){warn.style.display='block';return;}
      warn.style.display='none';
      doCheck(d,r,false);
    });
    nav.appendChild(chk);
  }else{
    var nxt=el('button','primary',S.reviewReturn?'↩ Back to skipped list':(last?'🏁 Final Submit':'Next ▶'));
    nxt.id='nextBtn';
    nxt.setAttribute('aria-label','Next');
    nxt.addEventListener('click',function(){
      if(S.tstate==='PAUSED_AUTO_CHECK'){setPause('fb',false);S.tstate='RUNNING';}
      if(S.reviewReturn){renderReview();return;}
      if(S.pos===S.list.length-1){finishAttempt();return;}
      S.pos++;renderExam();
    });
    nav.appendChild(nxt);
  }
  var hb=$('hintBtn');if(hb)hb.disabled=r.checked||!!S.hint[i];
  var sb=$('skipBtn');if(sb)sb.disabled=r.checked||S.reviewReturn;
}

/* ---------- answer widgets ---------- */
function buildAnswer(host,d,r,i){
  if(d.kind==='mcq'||d.kind==='multi')buildChoice(host,d,r,i);
  else if(d.kind==='dd')buildDD(host,d,r,i);
  else if(d.kind==='match')buildMatch(host,d,r,i);
  else if(d.kind==='order')buildOrder(host,d,r,i);
  else if(d.kind==='fill')buildFill(host,d,r,i);
  else if(d.kind==='term')buildTerm(host,d,r,i);
  else if(d.kind==='branch')buildBranch(host,d,r,i);
}
function lockAnswer(d,r){
  var host=$('anshost');if(!host)return;
  Array.prototype.forEach.call(host.querySelectorAll('button,input'),function(n){n.disabled=true;});
}
function buildChoice(host,d,r,i){
  var multi=d.kind==='multi';
  var store=multi?(r.sel||(r.sel=[])):(r.sel=(r.sel==null?-1:r.sel));
  var wrap=el('div','opts');wrap.id='anshost';
  var labels=['A','B','C','D','E','F'];
  d._shuf=d._shuf||shuffle(d.opts.map(function(o,k){return k;}));
  d._shuf.forEach(function(oi,pos){
    var b=el('button','opt');
    b.type='button';
    b.innerHTML='<span class="olabel">'+labels[pos]+'.</span><span>'+esc(d.opts[oi])+'</span><span class="selword">● selected</span>';
    b.setAttribute('role',multi?'checkbox':'radio');
    b.setAttribute('aria-checked',multi?String(store.indexOf(oi)>=0):String(store===oi));
    b.addEventListener('click',function(){
      if(r.checked)return;
      if(multi){
        var at=store.indexOf(oi);
        if(at>=0)store.splice(at,1);else store.push(oi);
        b.classList.toggle('sel');b.setAttribute('aria-checked',String(store.indexOf(oi)>=0));
      }else{
        store=oi;r.sel=oi;
        Array.prototype.forEach.call(wrap.children,function(c){c.classList.remove('sel');c.setAttribute('aria-checked','false');});
        b.classList.add('sel');b.setAttribute('aria-checked','true');
      }
    });
    if(multi?store.indexOf(oi)>=0:store===oi)b.classList.add('sel');
    wrap.appendChild(b);
  });
  host.appendChild(wrap);
}
function buildDD(host,d,r,i){
  r.placed=r.placed||{};r.pick=r.pick||null;
  var wrap=el('div','ddwrap');wrap.id='anshost';
  var bankLbl=el('div',null,'<b class="sec small">Cards — click one, then click a slot (or drag it):</b>');
  wrap.appendChild(bankLbl);
  var bank=el('div','bank');
  d._items=d._items||shuffle(d.items.slice());
  var slotsRow=el('div','slots');
  d.slots.forEach(function(s){var sl=el('div','slot');sl.dataset.slot=s.id;sl.setAttribute('tabindex','0');sl.setAttribute('role','button');sl.setAttribute('aria-label','Slot: '+s.label+' — press Enter to place the selected card here');sl.innerHTML='<div class="slabel"><span class="sic">⬇</span> '+esc(s.label)+'</div><div class="hintslot">'+esc(s.hint||'')+'</div>';
    sl.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();if(r.pick){r.placed[r.pick]=s.id;r.pick=null;draw();}}});
    slotsRow.appendChild(sl);});
  function draw(){
    bank.innerHTML='';Array.prototype.forEach.call(slotsRow.children,function(sl){
      Array.prototype.forEach.call(sl.querySelectorAll('.dditem'),function(n){n.remove();});
    });
    d._items.forEach(function(it){
      if(r.placed[it.id])return;
      var n=el('button','dditem'+(r.pick===it.id?' pick':''));
      n.type='button';n.draggable=true;
      n.innerHTML='<span class="pi">▦</span> '+esc(it.text);
      n.setAttribute('aria-label','Card: '+it.text);
      n.addEventListener('click',function(){r.pick=(r.pick===it.id?null:it.id);draw();});
      n.addEventListener('dragstart',function(e){r.pick=it.id;n.classList.add('dragging');try{e.dataTransfer.setData('text/plain',it.id);}catch(e2){}});
      n.addEventListener('dragend',function(){n.classList.remove('dragging');});
      bank.appendChild(n);
    });
    d.slots.forEach(function(s){
      var sl=slotsRow.querySelector('[data-slot="'+s.id+'"]');
      Object.keys(r.placed).forEach(function(iid){
        if(r.placed[iid]!==s.id)return;
        var it=null;d.items.forEach(function(x){if(x.id===iid)it=x;});
        var n=el('button','dditem');
        n.type='button';n.innerHTML='<span class="pi">▦</span> '+esc(it.text)+' <span class="selword">in slot</span>';
        n.setAttribute('aria-label','Card '+it.text+' in slot '+s.label+' — click to return');
        n.addEventListener('click',function(ev){ev.stopPropagation();if(r.checked)return;delete r.placed[iid];r.pick=null;draw();});
        sl.appendChild(n);
      });
    });
  }
  slotsRow.addEventListener('click',function(e){
    var sl=e.target.closest('.slot');if(!sl)return;
    if(e.target.closest('.dditem'))return; /* a click on a placed card returns that card — never places */
    if(r.pick){r.placed[r.pick]=sl.dataset.slot;r.pick=null;draw();}
  });
  slotsRow.addEventListener('dragover',function(e){
    var sl=e.target.closest('.slot');if(sl){e.preventDefault();sl.classList.add('over');}
  });
  slotsRow.addEventListener('dragleave',function(e){var sl=e.target.closest('.slot');if(sl)sl.classList.remove('over');});
  slotsRow.addEventListener('drop',function(e){
    var sl=e.target.closest('.slot');if(!sl)return;
    e.preventDefault();sl.classList.remove('over');
    var id=r.pick;if(id){r.placed[id]=sl.dataset.slot;r.pick=null;draw();}
  });
  wrap.appendChild(bank);wrap.appendChild(slotsRow);
  host.appendChild(wrap);
  draw();
}
function buildMatch(host,d,r,i){
  r.pairs=r.pairs||{};r.mpick=r.mpick||null;
  d._right=d._right||shuffle(d.right.slice());
  var wrap=el('div',null,'<p class="sec small">Click one item on the left, then its partner on the right. Click a paired left item to undo.</p><div class="mgrid" id="mgl"></div><div class="mgrid" id="mgr" style="margin-top:8px"></div>');
  wrap.id='anshost';
  host.appendChild(wrap);
  function draw(){
    var gl=wrap.querySelector('#mgl'),gr=wrap.querySelector('#mgr');
    gl.innerHTML='';gr.innerHTML='';
    d.left.forEach(function(L){
      var b=el('button','mitem'+(r.mpick===L.id?' pick':''));
      b.type='button';
      var pairTxt='';
      if(r.pairs[L.id]){var R=d.right.filter(function(x){return x.id===r.pairs[L.id];})[0];pairTxt='🔗 '+R.text;}
      b.innerHTML='<span>'+esc(L.text)+'</span>'+(pairTxt?'<span class="mpair">'+esc(pairTxt)+'</span>':'');
      b.addEventListener('click',function(){
        if(r.checked)return;
        if(r.pairs[L.id]){delete r.pairs[L.id];r.mpick=null;}
        else r.mpick=(r.mpick===L.id?null:L.id);
        draw();
      });
      gl.appendChild(b);
    });
    d._right.forEach(function(R){
      var used=Object.keys(r.pairs).some(function(k){return r.pairs[k]===R.id;});
      var b=el('button','mitem');
      b.type='button';b.disabled=used;
      b.innerHTML='<span>'+esc(R.text)+'</span>'+(used?'<span class="mpair">paired</span>':'');
      b.addEventListener('click',function(){
        if(r.checked||!r.mpick)return;
        r.pairs[r.mpick]=R.id;r.mpick=null;draw();
      });
      gr.appendChild(b);
    });
  }
  draw();
}
function buildOrder(host,d,r,i){
  if(!r.order){
    var ids=d.items.map(function(x){return x.id;});
    r.order=shuffle(ids);
    if(r.order.join('|')===ids.join('|'))r.order=ids.slice().reverse();
  }
  var wrap=el('div','olist');wrap.id='anshost';
  wrap.appendChild(el('p','sec small','Put the steps in the right order (top = first). Use the arrows.'));
  function draw(){
    wrap.innerHTML='<p class="sec small">Put the steps in the right order (top = first). Use the arrows.</p>';
    r.order.forEach(function(id,pos){
      var it=null;d.items.forEach(function(x){if(x.id===id)it=x;});
      var row=el('div','orow');
      row.innerHTML='<span class="opos">'+(pos+1)+'</span><span class="otext">'+esc(it.text)+'</span>';
      var up=el('button',null,'↑');up.setAttribute('aria-label','Move up: '+it.text);
      var dn=el('button',null,'↓');dn.setAttribute('aria-label','Move down: '+it.text);
      up.disabled=(pos===0);dn.disabled=(pos===r.order.length-1);
      up.addEventListener('click',function(){var t=r.order[pos-1];r.order[pos-1]=r.order[pos];r.order[pos]=t;draw();});
      dn.addEventListener('click',function(){var t=r.order[pos+1];r.order[pos+1]=r.order[pos];r.order[pos+1]=t;draw();});
      var btns=el('span');btns.style.display='flex';btns.style.gap='6px';btns.appendChild(up);btns.appendChild(dn);
      row.appendChild(btns);
      wrap.appendChild(row);
    });
  }

function buildFill(host,d,r,i){
  r.vals=r.vals||[];
  var wrap=el('div');wrap.id='anshost';
  var p=el('div','filltext mono');
  var parts=d.text.split(/\{(\d+)\}/);
  var html='';
  for(var k=0;k<parts.length;k++){
    if(k%2===0)html+=esc(parts[k]);
    else{var bi=parseInt(parts[k],10);html+='<input data-blank="'+bi+'" aria-label="Blank '+(bi+1)+'" size="'+(d.blanks[bi].w||12)+'" value="'+esc(r.vals[bi]||'')+'">';}
  }
  p.innerHTML=html;
  wrap.appendChild(p);
  if(d.bank){r._bank=r._bank||shuffle(d.bank);wrap.appendChild(el('p','sec small','Word bank (shuffled): <b>'+r._bank.map(esc).join(' · ')+'</b>'));}
  host.appendChild(wrap);
  Array.prototype.forEach.call(wrap.querySelectorAll('input'),function(inp){
    inp.addEventListener('input',function(){r.vals[parseInt(inp.dataset.blank,10)]=inp.value;});
  });
}
function buildTerm(host,d,r,i){
  r.log=r.log||[];r.limit=(d.timeLimit?d.timeLimit:null);
  var wrap=el('div','term');wrap.id='anshost';
  var scroll=el('div','scroll');
  scroll.setAttribute('aria-live','polite');
  r.log.forEach(function(l){scroll.appendChild(el('div',null,esc(l)));});
  var inrow=el('div','inrow');
  var pr=el('span','prompt',esc(d.prompt)+' ');
  var inp=document.createElement('input');
  inp.setAttribute('aria-label','Command line');inp.spellcheck=false;inp.autocapitalize='off';inp.autocomplete='off';
  inrow.appendChild(pr);inrow.appendChild(inp);
  wrap.appendChild(scroll);wrap.appendChild(inrow);
  host.appendChild(wrap);
  r._scroll=scroll;r._inp=inp;r._prompt=d.prompt;
  if(r.log.length===0){
    (d.banner||['% Connection to simulated device established. Read-only lab.','% Type the command you want to run, then press Enter. Check grades your last command.']).forEach(function(l){termEcho(d,r,l);});
  }
  inp.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;
    var cmd=inp.value;inp.value='';
    r.lastCmd=cmd;
    termEcho(d,r,d.prompt+' '+cmd);
    var sim=simulate(d,cmd);
    sim.forEach(function(l){termEcho(d,r,l);});
  });
  if(d.syntax){
    var sp=el('div','synpanel','<span class="st">SYNTAX REMINDER</span><pre>'+esc(d.syntax)+'</pre>');
    host.appendChild(sp);
  }
}
function termEcho(d,r,line){
  r.log.push(line);
  if(r._scroll){r._scroll.appendChild(el('div',null,esc(line)));r._scroll.scrollTop=r._scroll.scrollHeight;}
}
function simulate(d,cmd){
  var n=normCmd(cmd);
  if(!n.trim())return ['% (nothing typed)'];
  var allOk=true,forbiddenHit=null;
  d.elements.forEach(function(e2){if(!(new RegExp(e2.accept,'i')).test(n))allOk=false;});
  (d.forbidden||[]).forEach(function(f){if((new RegExp(f.match,'i')).test(n))forbiddenHit=f;});
  if(forbiddenHit)return ['% ERROR — refused in this safe lab: this command would change device state or destroy evidence.','% Nothing was executed. Think about what the scenario actually needs.'];
  if(allOk)return d.out||['% OK'];
  return ['% Invalid input or wrong command for this task.','% (Hint of behaviour: the device answers only the expected command shape.)'];
}
function buildBranch(host,d,r,i){
  r.branchStep=r.branchStep||0;r.choices=r.choices||[];
  var st=r.branchStep;
  if(st>=d.steps.length)st=d.steps.length-1;
  var step=d.steps[st];
  if(!r.choices[st]&&r.choices[st]!==0)r.choices[st]=-1;
  var wrap=el('div','opts');wrap.id='anshost';
  var labels=['A','B','C','D','E','F'];
  var shKey='sh'+st;
  d._bsh=d._bsh||{};if(!d._bsh[shKey])d._bsh[shKey]=shuffle(step.opts.map(function(o,k){return k;}));
  d._bsh[shKey].forEach(function(oi,pos){
    var b=el('button','opt'+(r.choices[st]===oi?' sel':''));
    b.type='button';
    b.innerHTML='<span class="olabel">'+labels[pos]+'.</span><span>'+esc(step.opts[oi])+'</span><span class="selword">● selected</span>';
    b.addEventListener('click',function(){
      if(r.stepLocked)return;
      r.choices[st]=oi;
      Array.prototype.forEach.call(wrap.children,function(c){c.classList.remove('sel');});
      b.classList.add('sel');
    });
    wrap.appendChild(b);
  });
  host.appendChild(wrap);
  var confirm=el('button','primary','Confirm step '+(st+1)+' →');
  confirm.style.marginTop='10px';
  confirm.addEventListener('click',function(){
    if(r.choices[st]==null||r.choices[st]<0)return;
    r.stepLocked=false;
    if(r.branchStep<d.steps.length-1){
      r.branchStep++;
      var q=$('excard').querySelector('.b-question .qtext');
      q.innerHTML='<span class="chip">STEP '+(r.branchStep+1)+' OF '+d.steps.length+'</span> '+esc(d.steps[r.branchStep].q);
      rebuildAnswer(d,r);
    }else{
      doCheck(d,r,true);
    }
  });
  host.appendChild(confirm);
}
function rebuildAnswer(d,r){
  var ab=$('anshost').parentNode;
  ab.innerHTML='';
  buildAnswer(ab,d,r,exIdx());
}

/* ---------- answer guards ---------- */
function hasAnswer(d,r){
  if(d.kind==='mcq')return r.sel!=null&&r.sel>=0;
  if(d.kind==='multi')return r.sel&&r.sel.length>0;
  if(d.kind==='dd')return Object.keys(r.placed||{}).length>0;
  if(d.kind==='match')return Object.keys(r.pairs||{}).length>0;
  if(d.kind==='order')return (r.order||[]).length>0;
  if(d.kind==='fill')return (r.vals||[]).some(function(v){return v&&v.trim();});
  if(d.kind==='term')return ((r._inp&&r._inp.value.trim())||r.lastCmd||'').trim().length>0;
  if(d.kind==='branch')return r.choices[r.branchStep]!=null&&r.choices[r.branchStep]>=0;
  return false;
}
function autoSubmit(i){
  var d=EX[i],r=EXR(i);
  if(r.checked)return;
  r.autoTimed=true;
  doCheck(d,r,false);
}

function showHint(i,d,r){

function doSkip(){

function manualPause(){

/* ================= SCORING ================= */
function normCmd(s){
  return String(s||'').toLowerCase().replace(/\s+/g,' ').replace(/\[\.\]/g,'.').replace(/;/g,' ').trim();
}
function normWord(s){
  return String(s||'').toLowerCase().replace(/\s+/g,' ').replace(/[.,;:!?"']/g,'').trim();
}
function scoreExercise(H,W,N){var c=Math.max(0,(H-W)/Math.max(1,N));return c;}
function grade(d,r){
  var rows=[],H=0,W=0,N=1;
  var labels=['A','B','C','D','E','F'];
  if(d.kind==='mcq'){
    N=1;var sel=r.sel;
    d._shuf.forEach(function(oi,pos){
      var chosen=(sel===oi);
      if(oi===d.correct){
        rows.push({ic:chosen?'✓':'○',w:chosen?'Correct':'Missed',cls:chosen?'i-correct':'i-missed',txt:'Option '+labels[pos]+' — “'+d.opts[oi]+'”'+(chosen?' — you chose it. ':' — this was the correct answer. ')+d.optWhy[oi]});
      }else if(chosen){
        W++;rows.push({ic:'✗',w:'Wrong',cls:'i-wrong',txt:'Option '+labels[pos]+' — “'+d.opts[oi]+'” — you chose it. '+d.optWhy[oi]});
      }
    });
    H=(sel===d.correct)?1:0;
  }else if(d.kind==='multi'){
    N=d.correct.length;
    var selA=r.sel||[];
    d._shuf.forEach(function(oi,pos){
      var isC=d.correct.indexOf(oi)>=0,isS=selA.indexOf(oi)>=0;
      if(isC&&isS){H++;rows.push({ic:'✓',w:'Correct',cls:'i-correct',txt:d.opts[oi]+' — you selected it. '+d.optWhy[oi]});}
      else if(!isC&&isS){W++;rows.push({ic:'✗',w:'Wrong',cls:'i-wrong',txt:d.opts[oi]+' — you selected it, but it is not correct here. '+d.optWhy[oi]});}
      else if(isC&&!isS){rows.push({ic:'○',w:'Missed',cls:'i-missed',txt:d.opts[oi]+' — you missed this correct item. '+d.optWhy[oi]});}
      else{rows.push({ic:'·',w:'Left out',cls:'i-missed',txt:d.opts[oi]+' — you left it out; that was right, it is not part of the answer. '+d.optWhy[oi]});}
    });
  }else if(d.kind==='dd'){
    N=d.items.length;
    d.items.forEach(function(it){
      var put=r.placed[it.id],sol=d.sol[it.id];
      var slotName=function(id){var s=d.slots.filter(function(x){return x.id===id;})[0];return s?s.label:id;};
      if(put===sol){H++;rows.push({ic:'✓',w:'Correct',cls:'i-correct',txt:'“'+it.text+'” → '+slotName(sol)+'. '+d.slotWhy[sol]});}
      else if(put){W++;rows.push({ic:'✗',w:'Wrong',cls:'i-wrong',txt:'“'+it.text+'” → you placed it in “'+slotName(put)+'”, but it belongs in “'+slotName(sol)+'”. '+d.slotWhy[sol]});}
      else{rows.push({ic:'○',w:'Missed',cls:'i-missed',txt:'“'+it.text+'” — you did not place it. It belongs in “'+slotName(sol)+'”. '+d.slotWhy[sol]});}
    });
  }else if(d.kind==='match'){
    N=d.left.length;
    d.left.forEach(function(L){
      var got=r.pairs[L.id],sol=d.sol[L.id];
      var rn=function(id){var x=d.right.filter(function(y){return y.id===id;})[0];return x?x.text:id;};
      if(got===sol){H++;rows.push({ic:'✓',w:'Correct',cls:'i-correct',txt:'“'+L.text+'” ↔ “'+rn(sol)+'”. '+d.pairWhy[L.id]});}
      else if(got){W++;rows.push({ic:'✗',w:'Wrong',cls:'i-wrong',txt:'“'+L.text+'” ↔ “'+rn(got)+'” — not the right pair. It pairs with “'+rn(sol)+'”. '+d.pairWhy[L.id]});}
      else{rows.push({ic:'○',w:'Missed',cls:'i-missed',txt:'“'+L.text+'” — unpaired. It pairs with “'+rn(sol)+'”. '+d.pairWhy[L.id]});}
    });
  }else if(d.kind==='order'){
    N=d.items.length;
    r.order.forEach(function(id,pos){
      var it=null;d.items.forEach(function(x){if(x.id===id)it=x;});
      var good=(d.items[pos].id===id);
      if(good){H++;rows.push({ic:'✓',w:'Correct',cls:'i-correct',txt:'Position '+(pos+1)+': “'+it.text+'” is where it belongs. '+(d.why[it.id]||'')});}
      else{W++;rows.push({ic:'✗',w:'Wrong',cls:'i-wrong',txt:'Position '+(pos+1)+': “'+it.text+'” is not right here — “'+d.items[pos].text+'” belongs there. '+(d.why[d.items[pos].id]||'')});}
    });
  }else if(d.kind==='fill'){
    N=d.blanks.length;
    d.blanks.forEach(function(B,bi){
      var v=r.vals?r.vals[bi]:undefined;
      var nv=normWord(v);
      var ok=B.accept.some(function(a){return typeof a==='string'?normWord(a)===nv:(new RegExp(a.re,'i')).test(nv);});
      if(!v||!v.trim()){rows.push({ic:'○',w:'Missed',cls:'i-missed',txt:'Blank '+(bi+1)+' — left empty. Expected: '+B.show+'. '+d.why[bi]});}
      else if(ok){H++;rows.push({ic:'✓',w:'Correct',cls:'i-correct',txt:'Blank '+(bi+1)+' = “'+v.trim()+'”. '+d.why[bi]});}
      else{W++;rows.push({ic:'✗',w:'Wrong',cls:'i-wrong',txt:'Blank '+(bi+1)+' = “'+v.trim()+'”, expected '+B.show+'. '+d.why[bi]});}
    });
  }else if(d.kind==='term'){
    N=d.elements.length;
    var typed=normCmd((r._inp&&r._inp.value.trim())||r.lastCmd||'');
    d.elements.forEach(function(e2){
      if((new RegExp(e2.accept,'i')).test(typed)){H++;rows.push({ic:'✓',w:'Correct',cls:'i-correct',txt:'Element “'+e2.label+'” found in your command. '+e2.why});}
      else{rows.push({ic:'○',w:'Missed',cls:'i-missed',txt:'Element “'+e2.label+'” missing from your command. '+e2.why});}
    });
    (d.forbidden||[]).forEach(function(f){
      if((new RegExp(f.match,'i')).test(typed)){
        W++;
        rows.push({ic:'✗',w:f.dangerous?'DANGEROUS — NEAR MISS':'Wrong',cls:'i-wrong',txt:'Your command contains “'+f.label+'”. '+f.why});
      }
    });
  }else if(d.kind==='branch'){
    N=d.steps.length;
    d.steps.forEach(function(st,k){
      var c=r.choices[k];
      if(c===st.correct){H++;rows.push({ic:'✓',w:'Correct',cls:'i-correct',txt:'Step '+(k+1)+': you chose “'+st.opts[c]+'”. '+st.why[st.correct]});}
      else if(c!=null&&c>=0){W++;rows.push({ic:'✗',w:'Wrong',cls:'i-wrong',txt:'Step '+(k+1)+': you chose “'+st.opts[c]+'”. The best choice was “'+st.opts[st.correct]+'”. '+st.why[st.correct]});}
      else{rows.push({ic:'○',w:'Missed',cls:'i-missed',txt:'Step '+(k+1)+': not answered. '+st.why[st.correct]});}
    });
  }
  var credit=scoreExercise(H,W,N);
  if(S.hint[exIdxOf(d)])credit=Math.max(0,credit-0.10);
  var label=credit>=0.999?'CORRECT':(credit>0?'PARTIALLY CORRECT':'INCORRECT');
  return {credit:credit,rows:rows,label:label,N:N,H:H,W:W,typed:d.kind==='term'?normCmd((r._inp&&r._inp.value.trim())||r.lastCmd||''):null};
}
function exIdxOf(d){for(var i=0;i<EX.length;i++)if(EX[i]===d)return i;return -1;}

/* ---------- check & feedback ---------- */
function doCheck(d,r,isFinal){
  var i=exIdx();
  if(r.checked)return;
  if(d.kind==='term'){if(r._inp&&r._inp.value.trim())r.lastCmd=r._inp.value;}
  /* mandatory: first action sets the auto-pause state */
  if(S.tstate==='RUNNING'){setPause('fb',true);S.tstate='PAUSED_AUTO_CHECK';}
  var g=grade(d,r);
  r.checked=true;r.base=g;
  S.checked[i]=true;
  if(S.skipped.indexOf(i)>=0)S.skipped=S.skipped.filter(function(x){return x!==i;});
  if(S.answered.indexOf(i)<0)S.answered.push(i);
  S.credit[i]=g.credit;
  renderFeedback(d,r,g);
  lockAnswer(d,r);
  paintHeader();
  paintNav(d,r,$('excard').parentNode.querySelector('.warnline'));
  var nb=$('nextBtn');if(nb)nb.focus();
}
function renderFeedback(d,r,g){
  var host=$('fbhost');if(!host)return;
  host.innerHTML='';
  var cls=g.label==='CORRECT'?'f-correct':(g.label==='PARTIALLY CORRECT'?'f-partial':'f-incorrect');
  var ic=g.label==='CORRECT'?'✓':(g.label==='PARTIALLY CORRECT'?'✓':'✗');
  var creditLine=(g.N>1)?('credit '+g.credit.toFixed(2)+' — '+Math.round(g.credit*g.N*100)/100+' of '+g.N+' items, formula (H − W) / N = ('+g.H+' − '+g.W+') / '+g.N):('credit '+g.credit.toFixed(2));
  if(S.hint[exIdxOf(d)])creditLine+=' (includes −0.10 hint penalty)';
  if(r.autoTimed)creditLine+=' · ⏱ exercise timer expired — answer auto-submitted';
  var f=el('div','fb '+cls);
  var h='<div class="fbhead"><span>'+ic+' '+g.label+'</span><span class="credit">'+esc(creditLine)+'</span></div>';
  if(g.rows&&g.rows.length)h+='<div class="rows">'+g.rows.map(function(row){
    return '<div class="irow"><span class="iic '+row.cls+'" aria-label="'+row.w+'">'+row.ic+'</span><span><b class="'+row.cls+'">'+esc(row.w)+'</b> — '+esc(row.txt)+'</span></div>';
  }).join('')+'</div>';
  h+='<div class="fball">'+d.fb+'</div>';
  if(d.kind==='term'){
    h+='<div class="canon"><div class="clabel">✓ CANONICAL COMMAND (copyable)</div><pre>'+esc(d.canonical)+'</pre><pre class="sec small" style="color:var(--text-secondary)">'+esc(d.canonExpl||'')+'</pre></div>';
  }
  if(d.study)h+='<div class="study"><b>What to study:</b> '+esc(d.study)+'</div>';
  f.innerHTML=h;
  host.appendChild(f);
  var cb=el('button',null,'📋 Copy canonical command');
  cb.style.marginTop='8px';
  if(d.kind==='term')cb.addEventListener('click',function(){
    try{navigator.clipboard.writeText(d.canonical);}catch(e){}
    cb.textContent='✓ Copied';
    cb.disabled=true;
  });
  if(d.kind==='term')f.appendChild(cb);
}

/* ---------- review-skipped screen ---------- */
function finishAttempt(){

}

    '<p class="sec">These exercises were skipped and not answered. You can return to each one and answer it now — as many times as you need — as long as the timer has not ended. If you submit now, every exercise in this list is <b>excluded from the score</b>: it is not counted as correct or wrong, and it does not count toward the total.</p>';
  if(!S.skipped.length){
    card.innerHTML+='<div class="revitem"><span class="rstate">✓ None skipped</span><span class="rtext">You answered every exercise. Great discipline — submit when ready.</span></div>';

/* ---------- results ---------- */
function endExam(reason){
  S.tstate='ENDED';
  if(S.pauseStart)setPause(S.pauseKind||'fb',false);
  renderResults(reason);
}
function renderResults(reason){
  S.phase='results';
  clearApp();
  var w=el('div','wrap');
  var sum=0,answered=S.answered.length;
  S.answered.forEach(function(i){sum+=S.credit[i]||0;});
  var percent=pct(sum,answered);
  var passed=percent>=D.meta.passMark;
  var full=0,part=0,zero=0;var partSum=0;
  S.answered.forEach(function(i){
    var c=S.credit[i]||0;
    if(c>=0.999)full++;else if(c>0){part++;partSum+=c;}else zero++;
  });
  var skippedN=EX.length-answered;
  /* report to site exactly once per attempt — same rounded percent as displayed */
  if(!S.reported){
    S.reported=true;
    reportScore(sum,answered);
  }
  var head=el('div',null,headerHTML());
  w.appendChild(head);
  var hero=el('div','card resHero '+(passed?'pass':'fail'));
  hero.innerHTML=
    '<div class="verdict">'+(passed?'✓ PASS':'✗ FAIL')+' <span class="chip">'+(reason==='timeout'?'⏹ timer ended':'🏁 submitted')+'</span></div>'+
    '<div class="pct">'+percent+'%</div>'+
    '<div class="sec">'+r1(sum)+' credit points over '+answered+' answered exercise'+(answered===1?'':'s')+' · pass mark '+D.meta.passMark+'%</div>'+
    (passed
      ?'<p>Certificate-style result: you demonstrated reliable mastery of <b>'+esc(D.meta.objectLine)+'</b> at <b>'+esc(D.meta.sevWord)+'</b> level. Keep the feedback of every partially correct exercise — those are your next learning steps.</p>'
      :'<p>You must retake this exam to reach the pass mark. Read the explanations below, then press <b>Retake Exam</b> — questions and answer choices will be shuffled.</p>');
  var again=el('button','primary','🔄 Retake Exam');
  again.addEventListener('click',function(){
    S.retake=true;
    S.phase='intro';
    renderIntro();
  });
  hero.appendChild(again);
  w.appendChild(hero);

  var br=el('div','card');
  br.innerHTML='<h2>📊 Score breakdown</h2><div class="statgrid">'+
    '<div class="stat s-correct"><div class="sn">✓ '+full+'</div><div class="sl">Fully correct (credit 1.00)</div></div>'+
    '<div class="stat s-partial"><div class="sn">✓ '+part+'</div><div class="sl">Partially correct'+(part?(' — avg '+(Math.round(100*partSum/part)/100).toFixed(2)):'')+'</div></div>'+
    '<div class="stat s-incorrect"><div class="sn">✗ '+zero+'</div><div class="sl">Fully incorrect (credit 0.00)</div></div>'+
    '<div class="stat s-skipped"><div class="sn">⚠ '+skippedN+'</div><div class="sl">Skipped — excluded from score</div></div>'+
  '</div>';
  var tt=el('table','timetable');
  tt.innerHTML='<tr><td>⏱ Time remaining (timer budget '+fmt(D.meta.timerSec)+')</td><td>'+fmt(S.remaining)+'</td></tr>'+
    '<tr><td>▶ Time spent with timer running</td><td>'+fmt(S.elapsed)+'</td></tr>'+
    '<tr><td>⏸ Time paused manually (breaks)</td><td>'+fmt(S.pausedManualSec)+'</td></tr>'+
    '<tr><td>⏸ Time paused reviewing feedback (auto-pause)</td><td>'+fmt(S.pausedFbSec)+'</td></tr>';
  br.appendChild(tt);
  w.appendChild(br);

  var rl=el('div','card');
  rl.innerHTML='<h2>🧾 Per-exercise results</h2><div class="reslist"></div>';
  var listEl=rl.querySelector('.reslist');
  S.list.forEach(function(i,k){
    var d=EX[i],r=EXR(i);
    var ic,w2,cl;
    if(S.skipped.indexOf(i)>=0||!S.checked[i]){ic='⚠';w2='Skipped — excluded';cl='i-missed';}
    else{
      var c=S.credit[i]||0;
      if(c>=0.999){ic='✓';w2='Fully correct';cl='i-correct';}
      else if(c>0){ic='✓';w2='Partially correct ('+(Math.round(c*100)/100).toFixed(2)+')';cl='i-partial';}
      else{ic='✗';w2='Fully incorrect';cl='i-wrong';}
    }
    var row=el('div','resrow');
    row.innerHTML='<span class="ric '+cl+'">'+ic+' '+esc(w2)+'</span><span>'+(k+1)+'. '+esc(d.scenario.summary)+'</span>';
    listEl.appendChild(row);
  });
  w.appendChild(rl);
  app().appendChild(w);
  paintHeader();
}

/* ---------- site contract: score report (STEP 6.2) ---------- */
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:D.meta.topicId,
      batch:D.meta.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=D.meta.passMark
    },location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}

/* ---------- site contract: handshake (STEP 6.3) ---------- */
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  if(!S)S=freshState();
  S.user.name=String(event.data.username||'').slice(0,40);
  S.user.country=String(event.data.country||'');
  S.user.locale=String(event.data.locale||'');
  /* theme field is always 'dark' — the file is dark-only, nothing to switch */
});

/* ---------- boot ---------- */
S=freshState();
renderIntro();
})();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
