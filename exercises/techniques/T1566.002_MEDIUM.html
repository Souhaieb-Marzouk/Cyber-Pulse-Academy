<style>
:root{
  --bg-page:#0b1020; --bg-surface:#121a2e; --bg-surface-2:#0f1729;
  --border:#243049; --border-soft:#1c2740;
  --text-primary:#e6ecff; --text-secondary:#a9b4d0; --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff; --accent-amber:#ffb454; --accent-green:#57d38c;
  --state-correct:#57d38c; --state-partial:#ffb454; --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0; --state-paused:#9d7bff;
  --bg-log:#0a0f1e; --bg-term:#070b16; --tok-mail:#9dd6ff; --tok-id:#c9a7ff;
  --sev-easy:#57d38c; --sev-medium:#ffb454; --sev-hard:#ff8a3d; --sev-extreme:#ff6b6b;
  --sev:var(--sev-easy);
  --shadow:0 10px 24px rgba(0,0,0,.35);
  --radius:8px;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
html{color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-ui);font-size:16px;line-height:1.55;}
body.sev-easy{--sev:var(--sev-easy);}
body.sev-medium{--sev:var(--sev-medium);}
body.sev-hard{--sev:var(--sev-hard);}
body.sev-extreme{--sev:var(--sev-extreme);}
.wrap{max-width:1020px;margin:0 auto;padding:18px 16px 60px;}
a{color:var(--accent-blue);}
code,.mono{font-family:var(--font-mono);}
button{font-family:var(--font-ui);}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px;}
[hidden]{display:none !important;}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.4px;border:1px solid;}
.badge .dot{width:8px;height:8px;border-radius:50%;background:currentColor;}
.badge-sev{color:var(--sev);border-color:var(--sev);background:color-mix(in srgb,var(--sev) 12%,transparent);}
.badge-correct{color:var(--state-correct);border-color:var(--state-correct);background:color-mix(in srgb,var(--state-correct) 12%,transparent);}
.badge-partial{color:var(--state-partial);border-color:var(--state-partial);background:color-mix(in srgb,var(--state-partial) 12%,transparent);}
.badge-incorrect{color:var(--state-incorrect);border-color:var(--state-incorrect);background:color-mix(in srgb,var(--state-incorrect) 12%,transparent);}
.badge-skipped{color:var(--state-skipped);border-color:var(--state-skipped);background:color-mix(in srgb,var(--state-skipped) 10%,transparent);}
.badge-paused{color:var(--state-paused);border-color:var(--state-paused);background:color-mix(in srgb,var(--state-paused) 12%,transparent);}

/* ---------- header ---------- */
#hdr{position:sticky;top:0;z-index:40;background:var(--bg-surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow);}
#hdr .hrow{max-width:1020px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;}
#hdr .brand{font-weight:800;letter-spacing:.3px;font-size:15px;display:flex;align-items:center;gap:8px;}
#hdr .brand .cid{color:var(--accent-blue);font-family:var(--font-mono);}
#hdr .hitem{display:flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:14px;}
#hdr .hitem b{color:var(--text-primary);font-family:var(--font-mono);font-weight:700;}
#hdr .hspacer{flex:1;}
.hbtn{background:var(--bg-surface-2);border:1px solid var(--border);color:var(--text-primary);padding:9px 14px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;}
.hbtn:hover{border-color:var(--accent-blue);}
.hbtn:disabled{opacity:.45;cursor:not-allowed;}
.hbtn.primary{background:linear-gradient(135deg,color-mix(in srgb,var(--accent-green) 22%,var(--bg-surface-2)),var(--bg-surface-2));border-color:var(--accent-green);color:var(--accent-green);font-weight:800;}
.hbtn.big{font-size:16px;padding:12px 22px;}
#tstate-ind{font-size:13px;font-weight:700;}
.tst-running{color:var(--state-correct);}
.tst-paused{color:var(--state-paused);}
.tst-ended{color:var(--state-incorrect);}
#timer-txt{min-width:64px;text-align:right;}

/* ---------- progress ---------- */
#pbar-wrap{height:6px;background:var(--bg-surface-2);border-bottom:1px solid var(--border);overflow:hidden;}
#pbar{height:100%;width:0%;background:linear-gradient(90deg,var(--sev),color-mix(in srgb,var(--sev) 55%,transparent));position:relative;transition:width .4s ease;}
#pbar::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 2.8s linear infinite;}
@keyframes sheen{0%{transform:translateX(-100%);}60%,100%{transform:translateX(100%);}}

/* ---------- cards & blocks ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.block{margin:16px 0;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-surface);overflow:hidden;}
.block-h{display:flex;align-items:center;gap:8px;padding:9px 14px;font-weight:800;font-size:14px;letter-spacing:1.2px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bc) 10%,var(--bg-surface));}
.block-h .bh-ico{font-size:15px;}
.block-h .bh-txt{color:var(--bc);}
.block.scenario{--bc:var(--accent-blue);}
.block.question{--bc:var(--accent-amber);}
.block.answer{--bc:var(--accent-green);}
.block.scenario .block-h{border-left:4px solid var(--accent-blue);}
.block.question .block-h{border-left:4px solid var(--accent-amber);}
.block.answer .block-h{border-left:4px solid var(--accent-green);}
.block-b{padding:14px 16px;}
.scn-intro{margin:0 0 10px;color:var(--text-primary);}
.artefact{margin:10px 0;border:1px solid var(--border-soft);border-radius:6px;background:var(--bg-surface-2);}
.art-label{font-family:var(--font-mono);font-size:12px;color:var(--accent-blue);padding:6px 10px;border-bottom:1px solid var(--border-soft);letter-spacing:.6px;}
.art-note{padding:10px 12px;color:var(--text-secondary);font-size:14px;}
pre.mono{margin:0;padding:12px;font-family:var(--font-mono);font-size:14px;line-height:1.5;color:var(--text-mono);white-space:pre-wrap;word-break:break-word;background:var(--bg-surface-2);}
.q-text{margin:0;font-size:17px;font-weight:700;color:var(--text-primary);}
.step-chip{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:12px;background:color-mix(in srgb,var(--accent-amber) 15%,transparent);color:var(--accent-amber);border:1px solid var(--accent-amber);vertical-align:middle;}

/* collapsible scenario */
.scn-sum{display:flex;align-items:center;gap:8px;padding:8px 14px;color:var(--text-secondary);font-size:14px;border-bottom:1px dashed var(--border);}
.collapse-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text-secondary);border-radius:6px;padding:6px 10px;cursor:pointer;min-height:44px;font-size:13px;}
.collapse-btn:hover{color:var(--text-primary);border-color:var(--accent-blue);}

/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:12px 14px;margin:8px 0;cursor:pointer;color:var(--text-primary);font-size:15.5px;line-height:1.5;min-height:48px;}
.opt .olab{font-family:var(--font-mono);font-weight:800;color:var(--accent-blue);flex:0 0 auto;}
.opt:hover{background:color-mix(in srgb,var(--accent-blue) 8%,var(--bg-surface-2));border-color:var(--accent-blue);}
.opt.sel{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset,0 0 0 3px color-mix(in srgb,var(--accent-green) 18%,transparent);background:color-mix(in srgb,var(--accent-green) 9%,var(--bg-surface-2));}
.opt .osel-ind{margin-left:auto;color:var(--accent-green);font-weight:800;font-size:13px;white-space:nowrap;}
.opt.lock{cursor:default;}
.opt.right{border-color:var(--state-correct);}
.opt.wrong{border-color:var(--state-incorrect);}
.opt .mini-ic{font-weight:800;font-size:13px;white-space:nowrap;}

/* ---------- word bank / fill ---------- */
.blk-text{font-size:16px;color:var(--text-primary);line-height:1.8;}
select.blank{font-family:var(--font-mono);font-size:14px;background:var(--bg-surface-2);color:var(--text-mono);border:1px solid var(--border);border-radius:5px;padding:6px 8px;margin:0 3px;min-height:44px;}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.chip{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:999px;padding:7px 13px;font-family:var(--font-mono);font-size:13.5px;color:var(--text-mono);cursor:pointer;min-height:44px;}
.chip.sel{border-color:var(--accent-green);color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}

/* ---------- drag & drop ---------- */
.dd-wrap{display:grid;grid-template-columns:1fr 1.2fr;gap:14px;}
.dd-bank,.dd-zone{border:1px dashed var(--border);border-radius:8px;padding:10px;min-height:90px;background:var(--bg-surface-2);}
.dd-zone.hlit{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.dd-zt{font-size:13.5px;font-weight:800;color:var(--accent-blue);margin-bottom:8px;letter-spacing:.4px;}
.dd-item{display:flex;align-items:center;gap:8px;background:var(--bg-surface);border:1px solid var(--border);border-radius:6px;padding:9px 11px;margin:7px 0;font-size:14.5px;cursor:grab;color:var(--text-primary);}
.dd-item .rm{margin-left:auto;border:none;background:transparent;color:var(--state-incorrect);cursor:pointer;font-weight:800;font-size:14px;min-width:44px;min-height:44px;}
.dd-item.sel{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.dd-hintline{font-size:13px;color:var(--text-secondary);margin:4px 0 8px;}

/* ---------- order / rank ---------- */
.ord-list{list-style:none;margin:0;padding:0;}
.ord-item{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:8px 0;}
.ord-item .rk{font-family:var(--font-mono);font-weight:800;color:var(--accent-amber);min-width:30px;text-align:center;}
.ord-item .ot{flex:1;}
.ord-ctrls{display:flex;gap:6px;}
.ord-btn{border:1px solid var(--border);background:var(--bg-surface);color:var(--text-primary);border-radius:5px;min-width:44px;min-height:44px;cursor:pointer;font-size:15px;}
.ord-btn:hover{border-color:var(--accent-blue);}
.ord-item.dragover{border-color:var(--accent-green);}

/* ---------- match ---------- */
.mt-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
.mt-left{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:14.5px;}
.mt-left .mt-q{font-weight:700;}
.mt-slot{margin-top:8px;display:flex;align-items:center;gap:8px;}
.mt-drop{flex:1;border:1px dashed var(--border);border-radius:5px;padding:7px 10px;font-family:var(--font-mono);font-size:13px;color:var(--text-secondary);min-height:38px;background:var(--bg-surface);}
.mt-drop.hlit{border-color:var(--accent-green);}
.mt-drop .fillv{color:var(--text-mono);}
.mt-clear{border:none;background:transparent;color:var(--state-incorrect);font-weight:800;cursor:pointer;min-width:44px;min-height:44px;}

/* ---------- log viewer ---------- */
.logv{border:1px solid var(--border-soft);border-radius:6px;background:var(--bg-log);margin:8px 0;}
.logv-head{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border-soft);}
.logv-src{font-family:var(--font-mono);font-size:12.5px;color:var(--accent-blue);}
.logv-filter{margin-left:auto;flex:0 1 240px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:5px;color:var(--text-mono);font-family:var(--font-mono);font-size:13px;padding:7px 9px;min-height:44px;}
.logv pre{max-height:300px;overflow:auto;margin:0;padding:10px 12px;font-family:var(--font-mono);font-size:13.5px;line-height:1.55;color:var(--text-mono);}
.logv .ln{display:block;white-space:pre-wrap;word-break:break-word;}
.l-ts{color:var(--accent-amber);} .l-ip{color:var(--accent-blue);} .l-url{color:var(--accent-green);} .l-kw{color:var(--state-incorrect);font-weight:700;} .l-mail{color:var(--tok-mail);} .l-id{color:var(--tok-id);} .l-warn{color:var(--state-incorrect);}

/* ---------- terminal ---------- */
.term{background:var(--bg-term);border:1px solid var(--border-soft);border-radius:8px;font-family:var(--font-mono);font-size:14px;}
.term-bar{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border-soft);align-items:center;}
.tdot{width:10px;height:10px;border-radius:50%;}
.term-title{margin-left:8px;color:var(--text-secondary);font-size:12.5px;}
.term-out{padding:10px 12px;max-height:260px;overflow:auto;color:var(--text-mono);line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.term-in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border-soft);align-items:center;}
.term-prompt{color:var(--accent-green);font-weight:700;white-space:nowrap;}
.term-in input{flex:1;background:transparent;border:none;color:var(--text-mono);font-family:var(--font-mono);font-size:14px;padding:8px 2px;min-height:40px;}
.term-in input:focus-visible{outline:1px solid var(--accent-green);}
.syn-panel{border:1px solid var(--border-soft);border-left:4px solid var(--accent-blue);border-radius:6px;background:var(--bg-surface-2);padding:10px 12px;margin:10px 0;}
.syn-panel h5{margin:0 0 6px;font-size:13px;color:var(--accent-blue);letter-spacing:.5px;}
.syn-panel pre{margin:4px 0;font-family:var(--font-mono);font-size:13px;color:var(--text-mono);white-space:pre-wrap;}
.syn-panel .ex{color:var(--text-secondary);}

/* ---------- triage ---------- */
.tri-card{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin:10px 0;}
.tri-title{font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.tri-meta{color:var(--text-secondary);font-size:13.5px;margin-top:3px;font-family:var(--font-mono);}
.tri-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.tri-act{border:1px solid var(--border);background:var(--bg-surface);color:var(--text-primary);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:13.5px;min-height:40px;}
.tri-act.sel{border-color:var(--accent-green);color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.tri-act.sel-tri{border-color:var(--accent-amber);color:var(--accent-amber);}

/* ---------- feedback ---------- */
#fbk{margin:16px 0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
#fbk .fb-h{display:flex;align-items:center;gap:10px;padding:10px 14px;font-weight:800;letter-spacing:.8px;border-bottom:1px solid var(--border);}
.fb-correct{background:color-mix(in srgb,var(--state-correct) 12%,var(--bg-surface));color:var(--state-correct);}
.fb-partial{background:color-mix(in srgb,var(--state-partial) 12%,var(--bg-surface));color:var(--state-partial);}
.fb-incorrect{background:color-mix(in srgb,var(--state-incorrect) 12%,var(--bg-surface));color:var(--state-incorrect);}
.fb-danger{background:color-mix(in srgb,var(--state-incorrect) 18%,var(--bg-surface));color:var(--state-incorrect);}
#fbk .fb-b{padding:14px 16px;}
.item-row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border-soft);border-radius:6px;margin:7px 0;background:var(--bg-surface-2);font-size:14.5px;}
.it-correct{color:var(--state-correct);} .it-wrong{color:var(--state-incorrect);} .it-missed{color:var(--state-skipped);}
.item-row .it-ic{font-weight:800;flex:0 0 auto;}
.item-row .it-tx{color:var(--text-primary);}
.credit-line{font-family:var(--font-mono);font-weight:700;margin-top:6px;}
.study-line{margin-top:10px;padding:9px 12px;border-left:4px solid var(--accent-amber);background:color-mix(in srgb,var(--accent-amber) 8%,transparent);border-radius:0 6px 6px 0;color:var(--text-primary);font-size:14.5px;}
.canon{border:1px solid var(--border-soft);border-radius:6px;background:var(--bg-surface-2);margin:10px 0;}
.canon .canon-h{display:flex;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border-soft);font-family:var(--font-mono);font-size:12.5px;color:var(--accent-green);}
.copy-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text-secondary);border-radius:5px;padding:4px 10px;cursor:pointer;font-size:12px;min-height:44px;}
.copy-btn:hover{color:var(--text-primary);border-color:var(--accent-green);}

/* ---------- nav ---------- */
.nav-row{display:flex;gap:10px;align-items:center;margin:18px 0;}
.nav-note{color:var(--text-secondary);font-size:13.5px;margin-left:auto;}

/* ---------- hint ---------- */
#hint-panel{margin:12px 0;border:1px solid var(--accent-amber);border-left:4px solid var(--accent-amber);border-radius:0 6px 6px 0;background:color-mix(in srgb,var(--accent-amber) 8%,transparent);padding:10px 14px;color:var(--text-primary);font-size:14.5px;}
#hint-panel .hp-h{color:var(--accent-amber);font-weight:800;font-size:13px;letter-spacing:.6px;margin-bottom:4px;}

/* ---------- overlay / pause ---------- */
#overlay{position:fixed;inset:0;background:rgba(5,8,18,.92);z-index:80;display:flex;align-items:center;justify-content:center;}
.ov-card{max-width:460px;margin:20px;text-align:center;padding:30px;border:1px solid var(--state-paused);border-radius:10px;background:var(--bg-surface);box-shadow:var(--shadow);}
.ov-card .ov-ic{font-size:34px;color:var(--state-paused);}
.ov-card h2{color:var(--state-paused);margin:10px 0 6px;}
.ov-card p{color:var(--text-secondary);}

/* ---------- intro ---------- */
.intro-head{padding:18px 20px;}
.intro-title{font-size:24px;font-weight:900;margin:0 0 4px;color:var(--text-primary);}
.intro-sub{color:var(--text-secondary);font-size:15px;margin:0 0 12px;}
.fact-row{display:flex;flex-wrap:wrap;gap:10px;}
.fact{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:10px 14px;min-width:150px;}
.fact .f-l{font-size:12px;color:var(--text-secondary);letter-spacing:.8px;text-transform:uppercase;}
.fact .f-v{font-size:17px;font-weight:800;color:var(--text-primary);font-family:var(--font-mono);}
.kw-theme{border:1px solid var(--border-soft);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin:10px 0;}
.kw-theme h4{margin:0 0 8px;color:var(--accent-blue);font-size:14px;letter-spacing:.5px;}
.kw-list{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none;}
.kw-list li{border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--text-mono);font-family:var(--font-mono);background:var(--bg-surface);}
.how-list{margin:8px 0 0;padding-left:20px;color:var(--text-primary);}
.how-list li{margin:8px 0;}
.learn-p{color:var(--text-primary);}
.role-tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.role-tag{border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--accent-green);background:var(--bg-surface-2);}

/* ---------- review ---------- */
.rv-list{list-style:none;margin:0;padding:0;}
.rv-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin:9px 0;background:var(--bg-surface-2);}
.rv-row .rv-t{flex:1;}
.rv-row .rv-s{font-size:13px;color:var(--text-secondary);}

/* ---------- results ---------- */
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0;}
.res-cell{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:14px;}

window.EXAM_INTRO={"title":"T1566.002 — MEDIUM practice exam","subline":"Intermediate certification exam: combine two facts per exercise on the MITRE ATT&CK sub-technique Spearphishing Link.","obj":"T1566.002 — Spearphishing Link","learn":["This exam drills <b>T1566.002 — Phishing: Spearphishing Link</b>, a <b>Sub-Technique</b> of <b>T1566 Phishing</b> inside the <b>Initial Access</b> tactic (TA0001). At the EASY level you learned to recognise it. Here every exercise joins <b>two ideas</b>: you identify the behaviour <i>and</i> act on it — pick the telemetry, choose the control, or decide the next move.","Picture your day: a user reports an email; you join the <b>mail-gateway</b> record with the <b>web-proxy</b> record to see who clicked and what the browser fetched. You decide whether the link led to <b>credential harvesting</b>, a <b>malware download</b>, or an <b>OAuth consent page</b> — the last one hands over an application token, which ATT&amp;CK tracks as T1528, and you contain it with a different control (M1018 User Account Management limits who may approve apps).","The same object matters beyond the SOC: <b>detection engineers</b> write the mail+proxy join analytics of ATT&amp;CK strategy DET0107 and tune False positives; <b>CTI analysts</b> map campaigns to groups — ATT&amp;CK documents OilRig, MuddyWater, Storm-1811 (links to EvilProxy credential pages) and Lazarus (OneDrive links in Operation Dream Job) using exactly this sub-technique; <b>GRC analysts</b> check that M1017 training, M1021 proxy filtering and M1054 email authentication (SPF, DKIM, DMARC) are actually in place.","Red teamers use the same sub-technique under engagement rules, because a link leaves no file on disk at delivery and domains rotate easily. Blue teams answer with layered controls and clean telemetry. This exam walks you through both sides."],"roles":["SOC analyst (tier 1-2)","Incident responder","Detection engineer","Threat-intel analyst","Red teamer","GRC analyst"],"kw":[{"theme":"Object identity & lifecycle","items":["T1566.002 under T1566","Initial Access TA0001","Sibling variants .001/.003/.004","User Execution T1204 after the click"]},{"theme":"Telemetry & correlation","items":["Mail gateway URL-click records","Web proxy connections","IdP sign-in logs after a click","Joining two sources by user + time"]},{"theme":"Mitigations in practice","items":["M1017 User Training","M1018 User Account Management (OAuth consent)","M1021 Restrict Web-Based Content","M1054 Software Configuration (SPF/DKIM/DMARC)"]},{"theme":"Detection logic","items":["DET0107 analytics","URL rewriting (Safe Links)","False positives from trackers","Watchlists for newly registered domains"]},{"theme":"Real-world procedures","items":["OilRig — links in spearphishing","Storm-1811 — EvilProxy credential pages","Lazarus — OneDrive links (Operation Dream Job)","Unique per-recipient tracking links (campaign C0021)"]},{"theme":"Response workflow","items":["Reset + revoke sessions","Purge campaign mail","IOC blocking","Threat-intel report drafting"]}],"how":["<b>Pass mark: 70%.</b> The percentage is computed over the exercises you answer; skipped-and-unanswered ones are excluded from both parts.","<b>Exercise types in this file:</b> log reading with choice, fill-in-the-blank, multi-select, a branching incident, matching, ordering, a terminal task, alert triage, ranking, and report drafting.","<b>Timer: 45 minutes.</b> Manual Pause hides the exercise for a real break. Pressing <b>Check</b> stops the timer automatically (state: PAUSED — reviewing feedback) until you press <b>Next</b> — use that time to study the explanation.","<b>Partial credit:</b> multi-item exercises score max(0, (correct &#8722; wrong) / items). Selecting everything &#8220;to be safe&#8221; earns zero. One hint per exercise costs 10% of that exercise&#8217;s credit.","<b>Skip and review:</b> skipped exercises go to a review pool you can revisit while the timer runs; unanswered skips are excluded from the score.","Press <b>Start</b> when you are ready."]};
window.EXAMS=[{"id":"M01","type":"logq","title":"Two logs, one story","summary":"Mail record + proxy record — name the technique and what happened","scenario":[{"label":"Mail gateway record","kind":"log","src":"mailgw.log","lines":["2026-10-22T07:58:02Z from=it-service@vendor-portal[.]example to=a.snow@corp[.]example subj=\"Mailbox full - verify now\" url=hxxps://owa-secure[.]example-id-5120[.]net/login action=deliver banner=external-sender","2026-10-22T08:01:19Z unique link inserted for recipient a.snow@corp[.]example (click tracking)"]},{"label":"Web proxy record (same morning)","kind":"log","src":"proxy.log","lines":["2026-10-22T08:04:55Z user=a.snow src_ip=10[.]0[.]44[.]17 method=GET url=hxxps://owa-secure[.]example-id-5120[.]net/login status=200","2026-10-22T08:05:02Z user=a.snow src_ip=10[.]0[.]44[.]17 method=POST url=hxxps://owa-secure[.]example-id-5120[.]net/login status=200 bytes=1204"]}],"question":"Join the two artefacts and pick the statement that is fully correct about technique and outcome.","hint":"Read the two timestamps in order: deliver, then GET, then POST. What does a POST to a login page usually mean?","expl":"The gateway delivered a link-bearing email (no attachment), inserted a per-recipient tracking link, and the proxy shows the same user later GETting and POSTing to that link's login page. That is T1566.002 — and the POST strongly suggests credentials were submitted to the fake page. T1566.001 needs an attached file (there is none), T1056 is a credential capture already on the host, and T1071 is generic web C2 — none of them fit both artefacts.","study":"Practise the two-step read: (1) delivery channel, (2) what the destination saw. Unique per-recipient links, as campaign C0021 used, tell you the sender tracked who clicked.","logs":[],"aw":{"kind":"qcm","opts":["T1566.002 — the email carried the link and the proxy shows the user reached the login page, likely submitting credentials","T1566.001 — the email carried an infected attachment that the proxy downloaded","T1056.001 — a keylogger on the host captured the password","T1071.001 — malware already inside used web protocols for command and control"],"correct":0}},{"id":"M02","type":"fill","title":"Correlate the IP to a person","summary":"DHCP + proxy — name the user and the destination domain","scenario":[{"label":"Web proxy record","kind":"log","src":"proxy.log","lines":["2026-10-22T14:22:31Z src_ip=10[.]0[.]77[.]201 method=GET url=hxxps://payroll-verify[.]example-id-6114[.]com/auth status=200 category=newly-registered"]},{"label":"DHCP lease table (same subnet)","kind":"log","src":"dhcp-leases.txt","lines":["10[.]0[.]77[.]201  lease 2026-10-22T09:00:00Z  mac=44:1a:0b:xx:xx:xx  hostname=LT-FIN-0231  last-user=m.reyes@corp[.]example","10[.]0[.]77[.]202  lease 2026-10-22T09:00:04Z  mac=44:1a:0b:xx:xx:xx  hostname=LT-FIN-0232  last-user=k.osei@corp[.]example"]}],"question":"Fill in both blanks: which user's machine contacted the phishing domain, and what is that domain?","hint":"Step 1: take the src_ip from the proxy line. Step 2: find that IP in the DHCP table.","expl":"The proxy line shows 10[.]0[.]77[.]201 reaching payroll-verify[.]example-id-6114[.]com. The DHCP table maps that IP to hostname LT-FIN-0231 with last-user m.reyes@corp[.]example. Two independent sources had to be joined — that is the daily bread of a SOC analyst, and it is why DHCP retention matters. The other lease row belongs to a different IP entirely.","study":"When a proxy line has no user=, reach for the DHCP or VPN log to map the IP to a person.","template":"The machine that contacted the phishing domain belongs to {0}, and the destination domain is {1}.","bank":["m.reyes@corp[.]example","payroll-verify[.]example-id-6114[.]com","k.osei@corp[.]example","payroll-verify[.]corp"],"correct":[0,1]},{"id":"M03","type":"multi","title":"Telemetry that proves the chain","summary":"Pick the three sources that confirm click and fall-out","scenario":["ATT&CK's detection strategy DET0107 chains events: the email carries the link, the click is recorded, and the sign-in that follows shows the damage. Your SIEM only helps if the right sources feed it."],"question":"Select the three sources that together prove the full chain from delivery to fall-out.","hint":"Delivery, click, and the thing the attacker wanted next — one source per stage.","expl":"The mail-gateway click record proves delivery and the link; the proxy connection proves the browser actually reached the domain; the IdP sign-in log proves the stolen password (or token) was then used. A printer queue logs nothing about links, and a badge system tracks doors, not emails. Chain thinking — one source per stage of the technique — is how detection engineers cover T1566.002.","study":"Re-read DET0107's chain in the intro: email link, click, then fall-out in identity logs.","opts":["Mail gateway URL-click record for the message","Web proxy connection to the linked domain","Identity-provider sign-in log for the account afterwards","Printer queue history","Badge-door records"],"correct":[0,1,2],"why":{"3":"Printers never see the email or the click; no chain stage is proven.","4":"Doors are physical telemetry; the technique is entirely digital."}},{"id":"M04","type":"branch","title":"Handle the report end to end","summary":"Branching incident: report, verify, contain","scenario":["You are the on-call SOC analyst. A user forwards an email: 'Your mailbox will be deactivated, confirm here: hxxps://mail-quota[.]example-id-7301[.]net/sso' — they say they clicked but closed the page quickly."],"question":"Work the incident: three decisions, in order.","hint":"Verify safely first; contain based on what the user admitted; then clean the environment for others.","expl":"Safe verification (sandbox/URL analyser, never clicking yourself) is always the first move — detonation showed a credential page. Because the user admitted typing the password, sessions must be revoked and the password reset even if you saw nothing else. Finally, the same message sat in 40 more mailboxes: purging and blocking stops the rest of the campaign. Waiting or polling users are delays attackers live for; isolating forty healthy hosts punishes the business without proof.","steps":[{"scn":["Step 1 — The email sits in the user's mailbox. You have a sandbox and a URL analyser available."],"opts":[{"t":"Send the link through the URL analyser / sandbox — never click it yourself","ok":true,"note":"Detonation is the safe way to learn what the page does; the sandbox reported a fake sign-in page."},{"t":"Click the link from your own workstation to see it quickly","ok":false,"note":"You would expose your own session and possibly your credentials — analysts never self-click."},{"t":"Delete the email from the user's mailbox before any check","ok":false,"note":"You would destroy the primary evidence before capturing headers and the link."}]},{"scn":["Step 2 — The sandbox says: fake SSO page, 'password accepted' behaviour. The user confirms they typed the corporate password before closing the tab."],"opts":[{"t":"Revoke the user's sessions and reset the password now","ok":true,"note":"The credential is presumed stolen; revocation + reset removes the attacker's way in."},{"t":"Wait 24 hours to see whether anything suspicious happens","ok":false,"note":"The attacker does not wait — token theft and mail-rule changes happen in minutes."},{"t":"Send a company-wide email asking who else typed their password","ok":false,"note":"It delays containment and tips off any insider; scope via telemetry instead."}]},{"scn":["Step 3 — A mail search finds the same message in 40 more mailboxes, all unopened."],"opts":[{"t":"Purge the message from mailboxes and block the domain at proxy and DNS","ok":true,"note":"Removes the bait and the road; standard campaign cleanup after a confirmed phish."},{"t":"Do nothing — only one user actually clicked","ok":false,"note":"Unopened bait is one accident away from a second incident."},{"t":"Isolate the hosts of all 40 recipients","ok":false,"note":"No evidence any of them clicked; isolation at that scale costs the business for nothing."}]}]},{"id":"M05","type":"match","title":"Incidents to controls","summary":"Five situations — pick each matching mitigation ID","scenario":["Quarterly control review. Five findings from the phishing programme are on the table, each best answered by one ATT&CK mitigation."],"question":"Match each finding to the mitigation that addresses it.","hint":"People, consent rules, network path, mail authentication, and permission reviews — one slot each.","expl":"Urgent-invoice clicks are a people problem: M1017 User Training. A user approving a rogue OAuth app is answered by M1018 User Account Management — admins limit consent to unverified apps. A newly registered phishing domain reached from the LAN is the network path: M1021 Restrict Web-Based Content. Spoofed executive domains are mail authentication: M1054 Software Configuration covers SPF/DKIM/DMARC policies. And a quarterly review of third-party app permissions is M1047 Audit. Five findings, five distinct controls — that mapping is what a GRC analyst ships as the phishing programme report.","study":"For each phishing risk ask: people (M1017), consent (M1018), network (M1021), mail auth (M1054), or review (M1047)?","left":["Users keep clicking links in urgent-invoice emails","A user approved a rogue OAuth application from a phishing link","A newly registered phishing domain was reachable from the LAN","Emails arrive spoofing the CEO's domain","Nobody has reviewed third-party app permissions for a year"],"right":["M1017 — User Training","M1018 — User Account Management","M1021 — Restrict Web-Based Content","M1054 — Software Configuration (SPF/DKIM/DMARC)","M1047 — Audit"],"correct":[0,1,2,3,4]},{"id":"M06","type":"order","title":"Response steps after a confirmed click","summary":"Order the five actions from first to last","scenario":["The proxy confirms a user submitted credentials to a fake portal. The on-call playbook lists five actions. Some orders would waste evidence or leave users exposed."],"question":"Order the five response actions from first to last.","hint":"Protect the identity first, then the environment, then the paperwork.","expl":"Sessions are revoked and the password reset first — that closes the attacker's active path. Blocking the domain follows, cutting the road for everyone. Only then do you search the proxy for other visitors, because your own blocklist now suppresses new hits and you want the historical picture. Purging the mail campaign and writing the ticket with IOCs finish the job. Ordering is the difference between containment and archaeology.","study":"Identity, road, scope, cleanup, documentation — a repeatable order for link-phish incidents.","items":["Revoke sessions and reset the user's password","Block the credential domain at proxy and DNS","Search proxy history for other visitors to the domain","Purge the phishing email from all mailboxes","Record the IOCs and actions in the incident ticket"]},{"id":"M07","type":"term","title":"Filter the proxy log","summary":"grep every hit for the phishing domain, any letter case","scenario":[{"label":"The task","kind":"note","text":"Campaign domain: invoice-portal[.]example-id-9930[.]com. The proxy log is proxy.log in your home directory. Some lines may write the domain with different letter case. You need every matching line printed to screen."}],"question":"In the shell, build the command that prints every proxy.log line containing the campaign domain, ignoring letter case.","hint":"The tool is grep. You want it to ignore case — there is a single-letter option for that.","expl":"grep searches file contents; -i makes the match case-insensitive, which matters because logs mix upper and lower case across sensors. The pattern is the campaign domain exactly as the campaign used it. This is the analyst's bread-and-butter first pass before anything fancier.","study":"grep -i 'pattern' file — the -i flag is the difference between finding the campaign and missing half of it.","termTitle":"soc-workstation — log analysis shell (simulation only)","prompt":"analyst@soc:~$","sim":{"tool":"grep","banner":"Simulation shell. Files are simulated; grep prints the matching lines.","notFound":"command not found — this shell offers: grep","out":["2026-10-22T07:58:02Z mailgw url=hxxps://Invoice-Portal[.]EXAMPLE-ID-9930[.]com/pay action=deliver","2026-10-22T08:04:55Z user=a.snow GET hxxps://invoice-portal[.]example-id-9930[.]com/login status=200","2026-10-22T08:05:02Z user=a.snow POST hxxps://invoice-portal[.]example-id-9930[.]com/login status=200"]},"elems":[{"label":"the tool grep","all":["grep"]},{"label":"the -i flag (ignore case)","all":["-i"]},{"label":"the campaign domain as the pattern","all":["invoice-portal[.]example-id-9930[.]com"]},{"label":"the target file proxy.log","all":["proxy.log"]}],"noise":["'","\""],"danger":[{"pat":"rm |shred|del |mv |> ","why":"Those would modify or destroy the log you are analysing."}],"canonical":"grep -i \"invoice-portal[.]example-id-9930[.]com\" proxy.log","parts":[{"t":"grep","d":"the text-search tool that prints matching lines"},{"t":"-i","d":"ignore letter case when matching"},{"t":"\"invoice-portal[.]example-id-9930[.]com\"","d":"the campaign domain, quoted as the pattern"},{"t":"proxy.log","d":"the file to search"}]},{"id":"M08","type":"qcm","title":"Group procedure match","summary":"Which documented group funnels links into EvilProxy pages?","scenario":["Your CTI lead asks you to name a real-world example for the awareness briefing. ATT&CK's procedure notes for T1566.002 document several groups — one of them is recorded as sending links that redirect to EvilProxy-based adversary-in-the-middle pages built to harvest credentials, with MFA prompts proxied too."],"question":"Which group's ATT&CK procedure note matches that description?","hint":"The name sounds like a weather bulletin — and it is Microsoft's naming for a consumer-focused threat actor.","expl":"ATT&CK records that Storm-1811 (G1046) distributes malicious links that redirect to EvilProxy-based phishing sites to harvest credentials — an adversary-in-the-middle setup that can also relay MFA. APT1 and Elderwood are older industrial-espionage actors with different delivery notes, and Mofang's entry does not mention credential-proxy services at all. Real procedure notes like this one are what make an awareness briefing concrete.","study":"Browse the T1566.002 procedure examples table and pick three groups your sector would care about.","opts":["Storm-1811 (G1046)","APT1 (G0006)","Elderwood (G0066)","Mofang (G0103)"],"correct":0},{"id":"M09","type":"triage","title":"Morning alert queue","summary":"Four alerts — right action for each","scenario":["It is 07:40 and four alerts wait in the queue. The mail gateway rewrites links (a Safe Links-style service) and the team has a proxy. Decide an action for each alert."],"question":"Choose the correct action for every alert.","hint":"Ask for each: does it touch the link chain — delivery, click, fall-out — or something else entirely?","expl":"The marketing tracker click is the classic False positive of URL rewriting: trackers redirect everyone, no credentials involved. The POST to a /login path on a newly registered domain after a delivery is the textbook T1566.002 chain — escalate it. A quarantined .zip attachment belongs to the sibling variant T1566.001, so it routes to the attachment playbook. The rewritten click that landed on the genuine SharePoint tenant is what Safe Links looks like when it works — no action.","study":"Queue triage rule: confirm delivery-channel and destination before touching severity.","actions":[{"t":"Escalate to IR as a phishing-link incident"},{"t":"Close as benign / False positive"},{"t":"Route out — different technique or no incident"}],"alerts":[{"t":"AL-2201 — Rewritten click flagged","meta":"url=t[.]dripemail[.]example-id-2[.]com/c/track user=b.lee time=06:58 category=marketing","ok":1,"why":"A marketing tracker click: redirector behaviour, no credential page, user signed up for the newsletter."},{"t":"AL-2202 — New domain, login POST","meta":"proxy POST hxxps://hr-benefits[.]example-id-8081[.]net/login status=200, domain registered 3 days ago, mail delivery 11 minutes earlier","ok":0,"why":"Delivery-then-POST chain on a fresh domain is the T1566.002 pattern; IR needs it now."},{"t":"AL-2203 — Attachment quarantined","meta":"mailgw attach=invoice.zip verdict=malicious action=quarantine, no URL in message","ok":2,"why":"An attached file is the T1566.001 variant — the attachment playbook owns it, not this sub-technique."},{"t":"AL-2204 — Click landed on real SharePoint","meta":"rewritten url -> sharepoint[.]corp status=200, sandbox verdict clean","ok":1,"why":"The rewrite did its job and the destination is the genuine internal tenant — expected behaviour."}]},{"id":"M10","type":"qcm","title":"Why the rule misses","summary":"Critique a young SIEM rule","scenario":[{"label":"The new SIEM rule","kind":"code","text":"alert when proxy.method=GET\n  and proxy.url contains 'login'\n  and proxy.referer contains 'mail'\nseverity: medium"},{"label":"The click it failed to catch","kind":"log","src":"proxy.log","lines":["2026-10-23T09:11:08Z user=s.kim GET hxxps://portal-sso-secure[.]example-id-77[.]net/auth status=200 referer=direct"]},"The rule author says: 'it matches logins from mail'. The real click above produced no alert."],"question":"What is the rule's real weakness?","hint":"Compare the words in the rule with the words in the log line it missed.","expl":"The rule bets on the literal word 'login' in the URL and on a mail referer. The real phish used /auth, a lookalike domain with no 'login' in it, and browsers send referer=direct on typed or redirected entries. DET0107-style detection instead joins the mail-gateway click event with the following proxy connection by user and time window — it does not depend on the page's wording. Literal keyword rules crumble against lookalikes; correlation rules do not.","study":"Rule-writing lesson: match the event chain (mail click, then proxy hit), not the page's text.","opts":["It depends on the page's wording and the referer header, both of which lookalike pages and redirects routinely break","Proxy logs cannot carry a referer field at all","The word 'login' is too common, so the rule fires constantly and was muted","The rule should watch POST only, because GET never carries credentials"],"correct":0},{"id":"M11","type":"drag","title":"Matrix placement drill","summary":"Four techniques — three tactic columns","scenario":["A junior asked you where these cards live in the ATT&CK matrix. Tactics answer 'what the attacker is trying to achieve' at that moment."],"question":"Drag each technique into its tactic column.","hint":"Phishing gets the FIRST access; PowerShell runs code; brute force guesses credentials.","expl":"Both phishing sub-techniques sit in Initial Access — the first foothold. T1059.001 PowerShell is Execution: code already runs inside. T1110 Brute Force is Credential Access: the attacker already has a way in and now hunts passwords to widen it. Reading columns this way — goal, not tool — is how the matrix stays useful under pressure.","study":"Rehearse the three columns: Initial Access (get in), Execution (run), Credential Access (unlock more).","zones":[{"t":"Initial Access — TA0001"},{"t":"Execution — TA0002"},{"t":"Credential Access — TA0006"}],"items":[{"t":"T1566.002 — Spearphishing Link","z":0},{"t":"T1566.001 — Spearphishing Attachment","z":0},{"t":"T1059.001 — PowerShell","z":1},{"t":"T1110.003 — Password Spraying","z":2}]},{"id":"M12","type":"rank","title":"Rank the follow-ups","summary":"Four actions after a confirmed credential phish — most urgent first","scenario":["Confirmed: the user typed credentials into a fake portal; the attacker has not yet used them (no odd sign-ins in the IdP log). Four follow-up actions compete for the next hour."],"question":"Rank the four actions from most urgent (rank 1) to least urgent (rank 4).","hint":"What stops the attacker's way in? What stops the road? What widens your view? What helps next month?","expl":"Revoking sessions and resetting the password is first — it disables the stolen credential while the attacker still holds it. Blocking the domain is second: it stops everyone else from reaching the same page. Searching the proxy for other visitors is third — scoping, not containment. Adding the domain to the awareness-test set is fourth: valuable, but next month's business. Ranking forces you to separate containment from scoping from improvement.","study":"Contain the identity, then the road, then scope, then improve — when everything feels urgent, order by exposure closed.","items":["Revoke the user's sessions and reset the password","Block the credential domain at proxy and DNS for everyone","Search proxy history for other visitors to the domain","Add the domain to next quarter's awareness-test set"]},{"id":"M13","type":"fill","title":"Draft the CTI report line","summary":"Three blanks — behaviour, ID, tactic","scenario":["Your CTI team's daily note is read by managers. The house style requires the ATT&CK behaviour, its exact sub-technique ID, and the tactic, in one line."],"question":"Complete the report line by choosing the right word for every blank.","hint":"The message carried a link to a fake sign-in page. Which ID belongs to that behaviour, and which tactic owns it?","expl":"The behaviour is a link to a fake sign-in page — that is T1566.002, and it belongs to the Initial Access tactic: the attacker's first step in. An attached macro document is the sibling variant .001, T1204.002 is the user-execution step that may follow a click, and Lateral Movement happens deep after the foothold — none of those belong in this sentence.","study":"House style exists because managers act on IDs: they can read T1566.002 into ATT&CK Navigator themselves.","template":"The campaign delivered {0}, tracked by ATT&CK as {1}, which sits in the {2} tactic.","bank":["a link to a fake sign-in page","an attached macro document","T1566.002","T1204.002","Initial Access","Lateral Movement"],"correct":[0,2,4]},{"id":"M14","type":"multi","title":"Red-team trade-offs","summary":"Why the link wins over the attachment in this engagement","scenario":["You are the red team operator under an authorised engagement. The goal: prove that a user's credentials can be captured without dropping a file on disk at delivery time. The client's mail gateway sandboxes attachments aggressively."],"question":"Select the two reasons a spearphishing link fits this engagement better than an attachment.","hint":"One reason is about what scanners see at delivery; the other is about what you can change once a domain burns.","expl":"With a link there is no file at delivery for the attachment sandbox to detonate, so the message looks inert to mail defences. And when the credential domain gets blocked mid-engagement you simply rotate to the next domain — attachments cannot be swapped after delivery. Links do not remove user interaction (they need the click), they do not grant rights by themselves, and gateways are quite good at blocking dangerous attachments — those options describe the world backwards.","study":"Attacker economics: a link is cheap to rotate and leaves no file at delivery — that is exactly the defence story in reverse.","opts":["No file lands on disk at delivery time for the attachment sandbox to inspect","A blocked domain can be rotated out and replaced mid-campaign","Attachments always grant immediate admin rights after opening","Links remove the need for the user to interact","Attachments cannot be blocked by mail gateways"],"correct":[0,1],"why":{"2":"Attachments grant nothing by themselves — the payload inside might, and that is not the delivery choice.","3":"The link still needs the click; nothing about it removes the human step.","4":"Attachment blocking is one of the most mature mail defences — that is why the link variant exists."}},{"id":"M15","type":"qcm","title":"Find the control gap","summary":"Three controls in place — which road remains open?","scenario":["The tenant has: M1017 training with quarterly phishing drills, M1021 proxy filtering with DNS blocking, and M1054 DMARC enforcement on all outbound domains. The CISO asks the gap question at the steering meeting."],"question":"Which remaining gap is real for the T1566.002 link variant?","hint":"Follow the path of a user who reads their personal webmail on the corporate laptop.","expl":"All three controls live on company mail and the company proxy. A user reading personal webmail on a managed laptop can click a link that never passes the mail gateway — and if the browser reaches the internet outside the proxy (or the proxy trusts a big category), the click is invisible to both gateway and proxy. DMARC only authenticates the sender domain; training lowers but never zeroes clicks. The honest gap answer wins steering meetings because it drives browser hardening and identity telemetry.","study":"Map every control to a path section; the gap is the path section with no control on it.","opts":["A link clicked from personal webmail can bypass the mail gateway entirely, and identity telemetry must catch what mail controls never see","DMARC enforcement stops links from working once enabled","Training removes the risk completely after two quarters","The proxy always sees personal webmail traffic"],"correct":0}];
</script>
<script>

'use strict';
/* ============ T1566.002 exam engine (self-contained, vanilla JS) ============ */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function letters(i){ return String.fromCharCode(65+i); }
function fmt1(x){ return (Math.round(x*10)/10).toFixed(1); }
function fmtClock(sec){ sec=Math.max(0,sec); var m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }

/* Mandatory scoring formula: exerciseCredit = max(0,(H-W)/N) */
function scoreExercise(H,W,N){ if(N<=0){ return 0; } return Math.max(0,(H-W)/N); }

var BUDGET = window.EXAM_BUDGET_MIN * 60;
var S = {
  order: [], cur: 0,
  credit: [], answered: [], skipped: [], hintUsed: [], done: [], picks: [],
  timerState: 'IDLE', prevState: null, remaining: BUDGET,
  manualSecs: 0, autoSecs: 0, _lastT: 0, _tick: null,
  reported: false, attempt: 1, mode: 'normal',
  user: { username:'', country:'', locale:'en' }
};

var EX = window.EXAMS;

/* ---------------- timer state machine ---------------- */
function setState(st){
  S.timerState = st; S._lastT = Date.now();
  renderHeader();
}
function tick(){
  var now = Date.now(); var dt = Math.round((now - S._lastT)/1000);
  if(dt<=0){ return; }
  S._lastT = now;
  if(S.timerState==='RUNNING'){
    S.remaining -= dt;
    if(S.remaining<=0){ S.remaining=0; setState('ENDED'); onTimeout(); }
  } else if(S.timerState==='PAUSED_AUTO_CHECK'){
    S.autoSecs += dt;
  } else if(S.timerState==='PAUSED_MANUAL'){
    S.manualSecs += dt;
  }
  renderTimer();
}
function startTimer(){ setState('RUNNING'); }
function timerLabel(){
  if(S.timerState==='RUNNING'){ return '<span class="tst-running">&#9654; RUNNING</span>'; }
  if(S.timerState==='PAUSED_MANUAL'){ return '<span class="tst-paused">&#9208; PAUSED &#8212; manual (press Resume)</span>'; }
  if(S.timerState==='PAUSED_AUTO_CHECK'){ return '<span class="tst-paused">&#9203; AUTO-PAUSED &#8212; reading feedback (resumes on Next)</span>'; }
  if(S.timerState==='ENDED'){ return '<span class="tst-ended">&#9632; ENDED</span>'; }
  return '';
}
function renderTimer(){
  var el=$('timer-txt'); if(el){ el.textContent = fmtClock(S.remaining); }
  var st=$('tstate-ind'); if(st){ st.innerHTML = timerLabel(); }
}

/* ---------------- header ---------------- */
function renderHeader(){
  var exN = S.order.length;
  $('h-counter').innerHTML = 'Exercise <b>'+(S.cur+1)+'</b> of <b>'+exN+'</b>';
  $('h-score').innerHTML = 'Score <b>'+fmt1(creditSum())+'</b> / '+answeredCount()+' ('+percentNow()+'%)';
  var u = $('h-user');
  if(S.user.username){ u.innerHTML = '&#128100; '+esc(S.user.username)+(S.user.country && S.user.country!=='ZZ' ? ' ('+esc(S.user.country)+')':''); }
  renderTimer();
  updateProgress();
}
function answeredCount(){ var n=0; for(var i=0;i<S.answered.length;i++){ if(S.answered[i]){ n++; } } return n; }
function creditSum(){ var s=0; for(var i=0;i<S.credit.length;i++){ if(S.answered[i]){ s+=S.credit[i]; } } return s; }
function percentNow(){ var n=answeredCount(); if(n===0){ return 0; } return Math.round((creditSum()/n)*100); }
function updateProgress(){
  var total = S.order.length;
  var done = 0;
  for(var i=0;i<S.done.length;i++){ if(S.done[i]){ done++; } }
  $('pbar').style.width = Math.round((done/total)*100)+'%';
}

/* ---------------- intro ---------------- */
function buildIntro(){
  var d = window.EXAM_INTRO;
  var h = '';
  h += '<div class="card intro-head">';
  h += '  <h1 class="intro-title">'+esc(d.title)+'</h1>';
  h += '  <p class="intro-sub">'+esc(d.subline)+'</p>';
  h += '  <div class="fact-row">';
  h += '    <div class="fact"><div class="f-l">ATT&amp;CK object</div><div class="f-v">'+esc(d.obj)+'</div></div>';
  h += '    <div class="fact"><div class="f-l">Severity</div><div class="f-v"><span class="badge badge-sev"><span class="dot"></span>'+esc(window.EXAM_SEV_WORD)+'</span></div></div>';
  h += '    <div class="fact"><div class="f-l">Exercises</div><div class="f-v">'+EX.length+'</div></div>';
  h += '    <div class="fact"><div class="f-l">Estimated time</div><div class="f-v">'+window.EXAM_EST_MIN+' min</div></div>';
  h += '    <div class="fact"><div class="f-l">Timer budget</div><div class="f-v">'+window.EXAM_BUDGET_MIN+' min</div></div>';
  h += '    <div class="fact"><div class="f-l">Pass mark</div><div class="f-v">70%</div></div>';
  h += '  </div></div>';
  h += '<div class="block scenario"><div class="block-h"><span class="bh-ico">&#128218;</span><span class="bh-txt">WHAT YOU WILL LEARN HERE</span></div><div class="block-b">';
  for(var i=0;i<d.learn.length;i++){ h += '<p class="learn-p">'+d.learn[i]+'</p>'; }
  h += '<div class="role-tags">';
  for(var j=0;j<d.roles.length;j++){ h += '<span class="role-tag">'+esc(d.roles[j])+'</span>'; }
  h += '</div></div></div>';
  h += '<div class="block question"><div class="block-h"><span class="bh-ico">&#127991;</span><span class="bh-txt">KEYWORDS COVERED IN THIS EXAM</span></div><div class="block-b">';
  for(var k=0;k<d.kw.length;k++){
    h += '<div class="kw-theme"><h4>'+esc(d.kw[k].theme)+'</h4><ul class="kw-list">';
    for(var m=0;m<d.kw[k].items.length;m++){ h += '<li>'+esc(d.kw[k].items[m])+'</li>'; }
    h += '</ul></div>';
  }
  h += '</div></div>';
  h += '<div class="block answer"><div class="block-h"><span class="bh-ico">&#9881;&#65039;</span><span class="bh-txt">HOW THIS EXAM WORKS</span></div><div class="block-b">';
  h += '<ul class="how-list">';
  for(var n2=0;n2<d.how.length;n2++){ h += '<li>'+d.how[n2]+'</li>'; }
  h += '</ul>';
  h += '<div class="nav-row" style="justify-content:center"><button id="btn-start" class="hbtn primary big">&#9654; Start</button></div>';
  h += '</div></div>';
  $('intro').innerHTML = h;
  $('btn-start').addEventListener('click', startExam);
}

/* ---------------- exam lifecycle ---------------- */
function startExam(){
  S.order = shuffle(EX.map(function(e,i){ return i; }));
  S.cur = 0;
  S.credit = EX.map(function(){ return 0; });
  S.answered = EX.map(function(){ return false; });
  S.done = EX.map(function(){ return false; });
  S.hintUsed = EX.map(function(){ return false; });
  S.picks = EX.map(function(){ return null; });
  S.skipped = [];
  S.remaining = BUDGET;
  S.manualSecs = 0; S.autoSecs = 0;
  S.reported = false; S.mode = 'normal';
  $('intro').hidden = true;
  $('results').hidden = true;
  $('review').hidden = true;
  $('exam').hidden = false;
  if(S._tick){ clearInterval(S._tick); }
  S._lastT = Date.now();
  S._tick = setInterval(tick, 1000);
  renderExercise();
  startTimer();
  $('exam').scrollIntoView();
}
function curEx(){ return EX[S.order[S.cur]]; }

function renderExercise(){
  var idx = S.order[S.cur];
  var e = EX[idx];
  if(!S.answered[idx]){ S.done[idx]=false; }
  var h = '<div class="card" style="padding:6px 18px 18px">';
  h += exerciseHTML(e, idx);
  h += '<div id="fbk" hidden></div>';
  h += '<div class="nav-row">';
  h += '  <button id="btn-check" class="hbtn primary">Check answer</button>';
  h += '  <button id="btn-next" class="hbtn" disabled>Next &#8594;</button>';
  h += '  <span class="nav-note" id="nav-note"></span>';
  h += '</div></div>';
  $('ex-area').innerHTML = h;
  $('h-sevbadge').innerHTML = '<span class="badge badge-sev"><span class="dot"></span>'+window.EXAM_SEV_WORD+'</span>';
  bindExercise(e, idx);
  $('btn-check').addEventListener('click', function(){ onCheck(); });
  $('btn-next').addEventListener('click', function(){ onNext(); });
  $('btn-hint').disabled = S.answered[idx] || S.hintUsed[idx];
  if(S.hintUsed[idx] && !S.answered[idx]){ showHintPanel(e); }
  $('btn-pause').disabled = false;
  $('btn-skip').disabled = S.answered[idx];
  renderHeader();
  var last = lastUnansweredPos();
  $('btn-check').textContent = (S.cur===S.order.length-1) ? 'Check answer' : 'Check answer';
  if(S.cur===S.order.length-1){ $('nav-note').textContent = 'This is the last exercise. After Check, use Final Submit.'; }
  updateNavForState();
  window.scrollTo(0,0);
}
function lastUnansweredPos(){
  for(var i=S.order.length-1;i>=0;i--){ var idx=S.order[i]; if(!S.answered[idx]){ return i; } }
  return S.order.length-1;
}
function isLast(){
  /* last exercise position reached AND all later ones are done/skipped */
  for(var i=S.cur+1;i<S.order.length;i++){ var idx=S.order[i]; if(!S.done[idx] && S.skipped.indexOf(idx)===-1){ return false; } }
  return true;
}
function updateNavForState(){
  var idx = S.order[S.cur];
  var checked = S.answered[idx];
  $('btn-check').disabled = checked;
  var nextBtn = $('btn-next');
  nextBtn.innerHTML = (S.mode==='review' && remainingSkipped()>1) ? 'Back to skipped list &#8594;' : (isLast() ? 'Final Submit &#8594;' : 'Next &#8594;');
  nextBtn.disabled = !checked;
}
function onCheck(){
  if(S.timerState==='RUNNING'){ setState('PAUSED_AUTO_CHECK'); }
  gradeCurrent();
}
function onNext(){
  var idx = S.order[S.cur];
  if(S.timerState==='PAUSED_AUTO_CHECK'){ startTimer(); }
  S.done[idx] = true;
  if(S.mode==='review'){
    if(remainingSkipped()>0){
      showReview();
      return;
    } else {
      S.mode='normal';
      finishFlow();
      return;
    }
  }
  if(isLast()){
    finishFlow();
    return;
  }
  var nxt = S.cur+1;
  while(nxt < S.order.length && S.skipped.indexOf(S.order[nxt])!==-1 && S.answered[S.order[nxt]]){ nxt++; }
  if(nxt >= S.order.length){ finishFlow(); return; }
  S.cur = nxt;
  renderExercise();
}
function onSkip(){
  var idx = S.order[S.cur];
  if(S.answered[idx]){ return; }
  if(S.skipped.indexOf(idx)===-1){ S.skipped.push(idx); }
  S.done[idx] = true;
  if(S.mode==='review'){ showReview(); return; }
  var nxt = S.cur+1;
  if(nxt >= S.order.length){
    finishFlow();
    return;
  }
  S.cur = nxt;
  renderExercise();
}
function remainingSkipped(){
  var n=0;
  for(var i=0;i<S.skipped.length;i++){ if(!S.answered[S.skipped[i]]){ n++; } }
  return n;
}
function finishFlow(){
  if(remainingSkipped()>0 && S.timerState!=='ENDED'){
    showReview();
  } else {
    showResults();
  }
}
function onTimeout(){
  if(S._tick){ clearInterval(S._tick); S._tick=null; }
  var open = remainingSkipped();
  if(open>0){ showReview(true); } else { showResults(); }
}
function onHint(){
  var idx = S.order[S.cur];
  if(S.answered[idx] || S.hintUsed[idx]){ return; }
  S.hintUsed[idx] = true;
  var e = EX[idx];
  showHintPanel(e);
  $('btn-hint').disabled = true;
}
function showHintPanel(e){
  var p = $('hint-panel');
  if(!p){
    p = document.createElement('div');
    p.id = 'hint-panel';
    var nav = $('ex-area').querySelector('.nav-row');
    nav.parentNode.insertBefore(p, nav);
  }
  p.innerHTML = '<div class="hp-h">&#128161; HINT (costs 10% of this exercise&#8217;s credit)</div>'+esc(e.hint);
}
function onPause(){
  if(S.timerState==='RUNNING' || S.timerState==='PAUSED_AUTO_CHECK'){
    S.prevState = S.timerState;
    setState('PAUSED_MANUAL');
    $('overlay').hidden = false;
    $('ex-area').style.visibility = 'hidden';
  }
}
function onResume(){
  $('overlay').hidden = true;
  $('ex-area').style.visibility = 'visible';
  setState(S.prevState || 'RUNNING');
  S.prevState = null;
}
function showReview(timeout){
  S.mode = 'review';
  $('exam').hidden = true;
  $('review').hidden = false;
  var list = S.skipped.filter(function(i){ return !S.answered[i]; });
  var h = '<div class="card" style="padding:18px 20px">';
  h += '<h2 style="margin-top:0">&#9888; Skipped exercises &#8212; review before you finish</h2>';
  h += '<p style="color:var(--text-secondary)">'+(timeout
    ? 'Time is over. You cannot answer these any more. They will be excluded from your score: they do not count as correct, wrong, or add to the total.'
    : 'You skipped these. You can go back and answer them now, as many times as you need, while the timer is still running. If you submit with skipped exercises, they are excluded from the score.')+'</p>';
  if(S.timerState!=='ENDED'){
    h += '<div style="margin:8px 0"><b style="color:var(--text-primary)">&#9201; Time left: '+fmtClock(S.remaining)+'</b></div>';
  }
  h += '<ul class="rv-list">';
  for(var i=0;i<list.length;i++){
    var idx=list[i]; var e=EX[idx];
    h += '<li class="rv-row"><span class="badge badge-skipped"><span class="dot"></span>&#9888; Skipped</span><span class="rv-t">'+esc(e.title)+'</span>';
    h += (S.timerState==='ENDED')
      ? '<button class="hbtn" disabled>Time is over</button>'
      : '<button class="hbtn" data-open="'+idx+'">&#8617; Open and answer</button>';
    h += '</li>';
  }
  h += '</ul>';
  h += '<div class="nav-row"><button id="rv-submit" class="hbtn primary big">'+(timeout?'Go to results':'Submit anyway')+'</button></div>';
  h += '</div>';
  $('review').innerHTML = h;
  var btns = $('review').querySelectorAll('[data-open]');
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener('click', function(ev){
      var idx = parseInt(ev.currentTarget.getAttribute('data-open'),10);
      S.cur = S.order.indexOf(idx);
      S.mode = 'review';
      $('review').hidden = true;
      $('exam').hidden = false;
      renderExercise();
    });
  }
  $('rv-submit').addEventListener('click', function(){
    if(S.timerState==='ENDED'){ showResults(); }
    else if(remainingSkipped()>0){ showResults(); }
    else { S.mode='normal'; finishFlow(); }
  });
  window.scrollTo(0,0);
}


/* ---------------- shared render helpers ---------------- */
var HL_RE = /(\d{4}-\d{2}-\d{2}[T ][\d:.]+(?:Z|[+-]\d{2}:?\d{2})?)|((?:\d{1,3}\[\.\]){3}\d{1,3})|((?:hxxps?):\/\/[^\s"',<>()]+)|([A-Za-z0-9._%+-]+@[A-Za-z0-9.\[\]-]+\.[A-Za-z]{2,})|(\b(?:GET|POST|CLICK|CLICKED|OPENED|BLOCK|BLOCKED|DENY|DENIED|ALERT|ALERTED|QUARANTINE|QUARANTINED|REWRITE|REWRITTEN|DELIVERED|DETONATED|FAILED|PASS|WATCHLIST|REPUTATION|MALICIOUS|PHISH)\b)/gi;
function hlLine(line){
  var out=''; var last=0; var m;
  HL_RE.lastIndex=0;
  while((m=HL_RE.exec(line))!==null){
    out += esc(line.slice(last, m.index));
    var t = m[0];
    if(m[1]){ out += '<span class="l-ts">'+esc(t)+'</span>'; }
    else if(m[2]){ out += '<span class="l-ip">'+esc(t)+'</span>'; }
    else if(m[3]){ out += '<span class="l-url">'+esc(t)+'</span>'; }
    else if(m[4]){ out += '<span class="l-mail">'+esc(t)+'</span>'; }
    else { out += '<span class="l-kw">'+esc(t)+'</span>'; }
    last = m.index + t.length;
  }
  out += esc(line.slice(last));
  return out;
}
function logViewerHTML(n, src, lines){
  var h = '<div class="logv" data-lv="'+n+'">';
  h += '<div class="logv-head"><span class="logv-src">&#128196; '+esc(src)+'</span><input class="logv-filter" type="text" placeholder="filter lines..." aria-label="Filter log lines for '+esc(src)+'"></div>';
  h += '<pre>';
  for(var i=0;i<lines.length;i++){ h += '<span class="ln">'+hlLine(lines[i])+'</span>'; }
  h += '</pre></div>';
  return h;
}
function artefactHTML(n, a){
  var h = '<div class="artefact"><div class="art-label">ARTEFACT '+n+' &#8212; '+esc(a.label)+'</div>';
  if(a.kind==='log'){
    h += logViewerHTML('a'+n, a.src || a.label, a.lines);
  } else if(a.kind==='note'){
    h += '<div class="art-note">'+esc(a.text)+'</div>';
  } else {
    h += '<pre class="mono">'+hlLine(a.text)+'</pre>';
  }
  h += '</div>';
  return h;
}
function scenarioHTML(e){
  var h = '<div class="block scenario"><div class="block-h"><span class="bh-ico">&#128270;</span><span class="bh-txt">SCENARIO</span>';
  h += '<button type="button" class="collapse-btn" id="scn-toggle">Collapse &#9662;</button></div>';
  h += '<div class="scn-sum" id="scn-sum" hidden>&#128204; '+esc(e.summary)+'</div>';
  h += '<div class="block-b" id="scn-body">';
  for(var i=0;i<e.scenario.length;i++){
    var p = e.scenario[i];
    if(typeof p === 'string'){ h += '<p class="scn-intro">'+esc(p)+'</p>'; }
    else { h += artefactHTML(i+1, p); }
  }
  h += '</div></div>';
  return h;

/* ---------------- grading plumbing ---------------- */
function showFeedback(idx, g){
  var e = EX[idx];
  var credit = Math.max(0, g.credit - (S.hintUsed[idx] ? 0.10 : 0));
  S.credit[idx] = credit; S.answered[idx] = true;
  var si = S.skipped.indexOf(idx);
  if(si !== -1){ S.skipped.splice(si,1); }
  var label, cls, icon;
  if(credit >= 0.999){ label='CORRECT'; cls='fb-correct'; icon='&#10004;'; }
  else if(credit > 0){ label='PARTIALLY CORRECT'; cls='fb-partial'; icon='&#10004;'; }
  else { label='INCORRECT'; cls='fb-incorrect'; icon='&#10007;'; }
  if(g.dangerous){ label='DANGEROUS &#8212; NEAR MISS'; cls='fb-danger'; icon='&#10007;'; }
  var h = '<div class="fb-h '+cls+'"><span style="font-size:18px">'+icon+'</span> '+label;
  if(credit>0 && credit<0.999){ h += ' &#8212; credit '+credit.toFixed(2); }
  h += '</div><div class="fb-b">';
  if(g.creditLine){ h += '<div class="credit-line">'+g.creditLine+'</div>'; }
  if(g.items && g.items.length){
    for(var i=0;i<g.items.length;i++){
      var it=g.items[i];
      h += '<div class="item-row"><span class="it-ic '+it.cls+'">'+it.ic+'</span><span class="it-tx">'+it.tx+'</span></div>';
    }
  }
  h += '<p style="margin:12px 0 0">'+esc(g.expl || e.expl)+'</p>';
  if(g.extraHTML){ h += g.extraHTML; }
  if(!g.dangerous && S.credit[idx] < 1 && e.study){ h += '<div class="study-line">&#128218; <b>What to study:</b> '+esc(e.study)+'</div>'; }
  if(g.dangerous && e.study){ h += '<div class="study-line">&#128218; <b>What to study:</b> '+esc(e.study)+'</div>'; }
  h += '</div>';
  var fb=$('fbk'); fb.innerHTML=h; fb.hidden=false;
  lockWidget();
  renderHeader(); updateNavForState();
  fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function lockWidget(){
  var area=$('answer-area');
  var btns=area.querySelectorAll('button, select, input');
  for(var i=0;i<btns.length;i++){ btns[i].disabled=true; }
  var opts=area.querySelectorAll('.opt');
  for(var j=0;j<opts.length;j++){ opts[j].classList.add('lock'); }
}
function canonicalBlock(cmd){
  return '<div class="canon"><div class="canon-h">&#128203; Canonical command<button class="copy-btn" data-copy="'+esc(cmd)+'">&#128203; Copy</button></div><pre class="mono">'+esc(cmd)+'</pre></div>';
}
function bindCopy(){
  var b=$('fbk').querySelector('[data-copy]');
  if(b){ b.addEventListener('click', function(){
    var txt=b.getAttribute('data-copy');
    try { navigator.clipboard.writeText(txt); b.textContent='Copied'; }
    catch(err){ b.textContent='Select manually'; }
  }); }
}
function gradeCurrent(){
  var idx = S.order[S.cur];
  var e = EX[idx];
  var g = WIDGETS[e.type].grade(e, idx);
  g.expl = g.expl || e.expl;
  if(e.type==='term' && g.extraHTML === undefined && g.canonical){ g.extraHTML = canonicalBlock(g.canonical); }
  showFeedback(idx, g);
  bindCopy();
  $('btn-skip').disabled = true;
}

/* ---------------- widgets ---------------- */
var WIDGETS = {};

/* ==== qcm ==== */
WIDGETS.qcm = {
  html: function(e){ return '<div id="w-qcm"></div>'; },
  bind: function(e, idx){
    var order = shuffle(e.opts.map(function(_,i){ return i; }));
    var st = { order: order, sel: null };
    S.picks[idx] = st;
    var h='';
    for(var i=0;i<order.length;i++){
      var oi=order[i];
      h += '<button type="button" class="opt" data-oi="'+oi+'"><span class="olab">'+letters(i)+'.</span><span>'+esc(e.opts[oi])+'</span></button>';
    }

    var btns = $('answer-area').querySelectorAll('.opt');
    for(var b=0;b<btns.length;b++){
      btns[b].addEventListener('click', function(ev){
        var el = ev.currentTarget;
        if(st.sel !== null){ return; }
        st.sel = parseInt(el.getAttribute('data-oi'),10);
        el.classList.add('sel');
        el.insertAdjacentHTML('beforeend','<span class="osel-ind">&#10003; Selected</span>');
      });
    }
  },
  grade: function(e, idx){
    var st=S.picks[idx];
    if(st.sel === null){ return { credit:0, items:[{ic:'&#9888;',cls:'it-missed',tx:'No answer selected.'}] }; }
    var ok = st.sel === e.correct;
    var rows = [];
    for(var i=0;i<e.opts.length;i++){
      var isC = i===e.correct;
      var chosen = st.sel===i;
      if(isC){ rows.push({ic: chosen?'&#10004;':'&#9675;', cls: chosen?'it-correct':'it-missed', tx:(chosen?'&#10004; Correct — ':'&#9675; Missed — ')+'The right answer was: '+e.opts[i]}); }
      else if(chosen){ rows.push({ic:'&#10007;', cls:'it-wrong', tx:'&#10007; Wrong — you chose: '+e.opts[i]}); }
    }
    return { credit: ok?1:0, items: rows };
  }
};

/* ==== multi (multi-select, partial credit) ==== */
WIDGETS.multi = {
  html: function(e){ return '<div id="w-multi"><div class="dd-hintline">Select all that apply. Wrong picks subtract from correct ones (partial credit).</div></div>'; },
  bind: function(e, idx){
    var order = shuffle(e.opts.map(function(_,i){ return i; }));
    var st = { order: order, sel: [] };
    S.picks[idx] = st;
    var h='';
    for(var i=0;i<order.length;i++){
      var oi=order[i];
      h += '<button type="button" class="opt" data-oi="'+oi+'"><span class="olab">'+letters(i)+'.</span><span>'+esc(e.opts[oi])+'</span></button>';
    }
    $('answer-area').insertAdjacentHTML('beforeend', h);
    var btns = $('answer-area').querySelectorAll('.opt');
    for(var b=0;b<btns.length;b++){
      btns[b].addEventListener('click', function(ev){
        var el = ev.currentTarget;
        var oi = parseInt(el.getAttribute('data-oi'),10);
        var at = st.sel.indexOf(oi);
        if(at === -1){ st.sel.push(oi); el.classList.add('sel'); el.insertAdjacentHTML('beforeend','<span class="osel-ind">&#10003; Selected</span>'); }
        else { st.sel.splice(at,1); el.classList.remove('sel'); var ind=el.querySelector('.osel-ind'); if(ind){ ind.remove(); } }
      });
    }
  },
  grade: function(e, idx){
    var st=S.picks[idx];
    var N=e.correct.length;
    var H=0, W=0; var rows=[];
    for(var c=0;c<e.correct.length;c++){
      var ci=e.correct[c];
      if(st.sel.indexOf(ci)!==-1){ H++; rows.push({ic:'&#10004;',cls:'it-correct',tx:'&#10004; Correct — '+e.opts[ci]+(e.why && e.why[ci] ? ' — '+e.why[ci] : '')}); }
      else { rows.push({ic:'&#9675;',cls:'it-missed',tx:'&#9675; Missed — '+e.opts[ci]+(e.why && e.why[ci] ? ' — '+e.why[ci] : '')}); }
    }
    for(var s=0;s<st.sel.length;s++){
      var si=st.sel[s];
      if(e.correct.indexOf(si)===-1){ W++; rows.push({ic:'&#10007;',cls:'it-wrong',tx:'&#10007; Wrong — '+e.opts[si]+(e.why && e.why[si] ? ' — '+e.why[si] : ' — not part of the correct answer here')}); }
    }
    if(st.sel.length===0){ return { credit:0, items:[{ic:'&#9888;',cls:'it-missed',tx:'Nothing selected.'}] }; }
    var credit = scoreExercise(H,W,N);
    return { credit: credit, creditLine: (H+W>0? ('Items: '+H+' correct / '+W+' wrong of N='+N+' &#8212; credit = max(0, ('+H+' &#8722; '+W+') / '+N+') = '+credit.toFixed(2)) : ''), items: rows };

};

/* ==== match (partial credit) ==== */
WIDGETS.match = {
  html: function(e){ return '<div id="w-match"><div class="dd-hintline">Pick a value on the right, then press the drop slot next to the item it belongs to. Press &#10005; to clear a slot.</div><div id="mt-rows"></div><div class="bank" id="mt-bank"></div></div>'; },

      });

      drops[d].addEventListener('click', function(ev){

      var cur = st.assign[li];
