<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1586.002 Compromise Accounts: Email Accounts — MEDIUM exam v3.0</title>
<style>

:root{
  --bg:#0b0f14;
  --bg-surface:#111823;
  --bg-surface-2:#0d1420;
  --bg-elev:#161f2e;
  --bg-elev-2:#1b2637;
  --border:#223048;
  --border-soft:#1a2740;
  --text:#d7e3f2;
  --text-bright:#f2f7fd;
  --text-muted:#9fb0c3;
  --blue:#4da3ff;
  --blue-dim:#132f4d;
  --amber:#e8b339;
  --amber-dim:#38300f;
  --green:#46c26e;
  --green-dim:#11321e;
  --orange:#f08a3e;
  --orange-dim:#3a2412;
  --red:#f0554d;
  --red-dim:#3a1614;
  --focus:#4da3ff;
  --blue-hover:#1a3d63;
  --green-hover:#17462a;
  --accent-scen:#4da3ff;
  --accent-quest:#e8b339;
  --accent-ans:#46c26e;
  --sans:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono","Roboto Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --radius:10px;
  --radius-sm:7px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{color:var(--text-bright);line-height:1.25;}
code,.mono{font-family:var(--mono);}
code{
  background:var(--bg-surface-2);
  border:1px solid var(--border-soft);
  color:var(--text-bright);
  padding:1px 5px;border-radius:5px;font-size:.92em;
}
a{color:var(--blue);}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px;}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 64px;}
/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--bg-surface);
  border-bottom:1px solid var(--border);
}
.topbar-in{
  max-width:980px;margin:0 auto;padding:8px 16px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.tb-title{
  color:var(--text-bright);font-weight:700;font-size:.95rem;
  margin-right:auto;display:flex;align-items:center;gap:8px;min-height:32px;
}
.tb-title .mono{color:var(--blue);}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--bg-elev);border:1px solid var(--border);
  color:var(--text);border-radius:999px;
  padding:6px 12px;font-size:.85rem;min-height:32px;white-space:nowrap;
}
.chip .mono{font-variant-numeric:tabular-nums;}
.chip-score{border-color:var(--border);}
.chip-state-running{border-color:var(--border);color:var(--text-muted);}
.chip-state-paused{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);}
.chip-state-auto{border-color:var(--blue);color:var(--blue);background:var(--blue-dim);}
.chip-state-ended{border-color:var(--red);color:var(--red);background:var(--red-dim);}
/* ---------- badges ---------- */
.badge{
  display:inline-flex;align-items:center;gap:6px;
  border-radius:6px;padding:5px 11px;
  font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid;min-height:32px;
}
.badge-easy{color:var(--green);border-color:var(--green);background:var(--green-dim);}
.badge-medium{color:var(--amber);border-color:var(--amber);background:var(--amber-dim);}
.badge-hard{color:var(--orange);border-color:var(--orange);background:var(--orange-dim);}
.badge-extremely-hard{color:var(--red);border-color:var(--red);background:var(--red-dim);}
/* ---------- buttons ---------- */
.btn{
  font-family:var(--sans);font-size:.95rem;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;min-width:44px;padding:8px 18px;
  border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--bg-elev);color:var(--text-bright);
  cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .05s ease;
}
.btn:hover{background:var(--bg-elev-2);}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--blue-dim);border-color:var(--blue);color:var(--text-bright);}
.btn-primary:hover{background:var(--blue-hover);}
.btn-green{background:var(--green-dim);border-color:var(--green);color:var(--text-bright);}
.btn-green:hover{background:var(--green-hover);}
.btn-danger{background:var(--red-dim);border-color:var(--red);color:var(--text-bright);}
.btn-ghost{background:transparent;}
.btn-small{min-height:36px;padding:4px 12px;font-size:.85rem;}
/* ---------- intro screen ---------- */
.intro-card{
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:18px;overflow:hidden;
}
.intro-head{
  padding:22px 22px 18px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,var(--bg-elev),var(--bg-surface));
}
.intro-kicker{
  color:var(--blue);font-weight:700;font-size:.8rem;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:6px;display:flex;gap:8px;align-items:center;
}
.intro-head h1{margin:0 0 4px;font-size:1.5rem;}
.intro-sub{color:var(--text-muted);font-size:.95rem;}
.intro-facts{
  display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;
}
.intro-sec{padding:18px 22px;border-bottom:1px solid var(--border-soft);}
.intro-sec:last-child{border-bottom:none;}
.intro-sec h2{font-size:1.08rem;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
.intro-sec h2 .ic{color:var(--blue);}
.intro-sec p{margin:0 0 10px;}
.intro-sec ul{margin:0 0 10px;padding-left:22px;}
.intro-sec li{margin-bottom:6px;}
.kw-cloud{display:flex;flex-wrap:wrap;gap:8px;}
.kw{
  background:var(--bg-elev);border:1px solid var(--border);
  color:var(--text);border-radius:999px;padding:6px 13px;font-size:.86rem;
  display:inline-flex;align-items:center;gap:7px;
}
.kw::before{content:"◆";color:var(--blue);font-size:.72em;}
.how-grid{display:grid;grid-template-columns:1fr;gap:8px;}
.how-row{display:flex;gap:10px;align-items:flex-start;}
.how-ic{
  flex:0 0 auto;width:26px;height:26px;border-radius:7px;margin-top:1px;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--blue-dim);color:var(--blue);font-size:.85rem;font-weight:700;
}
.start-row{padding:18px 22px 24px;}
.start-btn{width:100%;font-size:1.05rem;}
/* ---------- exercise card ---------- */
.card{
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}
.card-body{padding:16px;}
.blk{
  border:1px solid var(--border-soft);
  border-left:4px solid var(--border);
  border-radius:var(--radius-sm);
  background:var(--bg-surface-2);
  margin-bottom:14px;overflow:hidden;
}
.blk-scen{border-left-color:var(--accent-scen);}
.blk-quest{border-left-color:var(--accent-quest);}
.blk-ans{border-left-color:var(--accent-ans);}
.blk-tag{
  font-size:.72rem;font-weight:800;letter-spacing:.16em;
  padding:7px 12px 0;color:var(--text-muted);
  display:flex;align-items:center;gap:7px;
}
.blk-scen .blk-tag{color:var(--accent-scen);}
.blk-quest .blk-tag{color:var(--accent-quest);}
.blk-ans .blk-tag{color:var(--accent-ans);}
.blk-body{padding:10px 14px 14px;}
.scen-toggle{
  margin:0 0 8px;background:transparent;border:none;color:var(--blue);
  font:inherit;font-size:.85rem;cursor:pointer;padding:6px 2px;min-height:32px;
  display:inline-flex;align-items:center;gap:6px;
}
.scen-clamp{overflow:hidden;}
.persp-tag{
  display:inline-flex;align-items:center;gap:6px;margin-left:auto;
  font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);border:1px solid var(--border-soft);
  border-radius:999px;padding:2px 9px;
}
/* options */
.opt{
  display:flex;align-items:flex-start;gap:11px;
  background:var(--bg-elev);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:10px 12px;margin-bottom:9px;cursor:pointer;
  min-height:44px;transition:border-color .12s ease,background .12s ease;
}
.opt:hover{border-color:var(--blue);background:var(--bg-elev-2);}
.opt input{margin-top:3px;accent-color:var(--blue);width:17px;height:17px;flex:0 0 auto;}
.opt-letter{
  flex:0 0 auto;width:24px;height:24px;border-radius:6px;margin-top:1px;
  background:var(--bg-surface-2);border:1px solid var(--border);
  color:var(--text-muted);font-size:.78rem;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;
}
.opt.sel{border-color:var(--blue);background:var(--blue-dim);}
.opt.sel .opt-letter{background:var(--blue-dim);color:var(--blue);border-color:var(--blue);}
.opt-note{
  margin:-3px 0 10px;font-size:.85rem;color:var(--text-muted);
  border-left:3px solid var(--border);padding:2px 0 2px 11px;
}
.sel-count{font-size:.85rem;color:var(--text-muted);margin:2px 0 10px;}
/* matching */
.match-row{
  display:grid;grid-template-columns:1fr 260px;gap:10px;align-items:center;
  background:var(--bg-elev);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:9px;min-height:44px;
}
.match-row select{
  width:100%;min-height:44px;background:var(--bg-surface-2);color:var(--text-bright);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  font:inherit;font-size:.92rem;padding:6px 8px;
}
/* order */
.order-row{
  display:flex;align-items:center;gap:10px;
  background:var(--bg-elev);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:9px;min-height:48px;
  cursor:grab;
}
.order-row.dragging{opacity:.4;}
.order-idx{
  flex:0 0 28px;height:28px;border-radius:7px;text-align:center;line-height:26px;
  background:var(--bg-surface-2);border:1px solid var(--border);
  color:var(--amber);font-weight:700;font-size:.85rem;
}
.order-row .grow{flex:1 1 auto;}
.mini-btn{
  flex:0 0 auto;width:38px;height:38px;border-radius:7px;
  background:var(--bg-surface-2);border:1px solid var(--border);
  color:var(--text-bright);cursor:pointer;font-size:.9rem;
  display:inline-flex;align-items:center;justify-content:center;
}
.mini-btn:hover{border-color:var(--blue);}
/* drag & drop */
.dnd-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.dnd-bankcol{grid-column:1 / -1;}
.zone{
  border:1.5px dashed var(--border);border-radius:var(--radius-sm);
  background:var(--bg-surface-2);padding:10px;min-height:96px;
  transition:border-color .12s ease;
}
.zone.over{border-color:var(--blue);}
.zone-h{font-size:.85rem;font-weight:700;color:var(--text-bright);margin:0 0 8px;
  display:flex;gap:8px;align-items:center;}
.zone-h .zi{color:var(--ans);}
.pill{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--bg-elev);border:1px solid var(--border);
  border-radius:999px;padding:7px 13px;margin:0 7px 7px 0;
  cursor:pointer;font-size:.9rem;min-height:40px;color:var(--text);
  transition:border-color .12s ease,background .12s ease;
}
.pill:hover{border-color:var(--blue);}
.pill.sel{border-color:var(--blue);background:var(--blue-dim);color:var(--text-bright);}
.pill .pi{color:var(--text-muted);font-size:.8rem;}
.dnd-hint{font-size:.83rem;color:var(--text-muted);margin:0 0 10px;}
/* fill */
.fill-input{
  background:var(--bg-surface-2);border:1px solid var(--border);
  border-radius:7px;color:var(--text-bright);font-family:var(--mono);
  font-size:.95rem;padding:8px 10px;min-height:44px;width:170px;margin:2px 4px;
}
.fill-input:focus{border-color:var(--blue);}
.fill-line{margin-bottom:10px;}
/* branch */
.step-tag{
  font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-muted);margin:0 0 6px;
}
.branch-opt{
  width:100%;text-align:left;margin-bottom:9px;justify-content:flex-start;
  padding:11px 14px;white-space:normal;
}
.branch-note{
  background:var(--bg-elev);border:1px solid var(--border-soft);
  border-left:3px solid var(--amber);border-radius:var(--radius-sm);
  padding:10px 13px;margin:0 0 12px;font-size:.93rem;color:var(--text);
}
/* terminal */
.term{
  background:var(--bg-surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:12px 14px;
}
.term-out{
  white-space:pre-wrap;word-break:break-word;
  font-size:.88rem;line-height:1.5;color:var(--text);
  max-height:280px;overflow-y:auto;margin:0 0 10px;
}
.term-line{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.term-prompt{color:var(--green);font-weight:700;font-size:.88rem;white-space:nowrap;}
.term-in{
  flex:1 1 220px;min-height:40px;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:7px;color:var(--text-bright);
  font-family:var(--mono);font-size:.92rem;padding:7px 10px;
}
.term-in:focus{border-color:var(--blue);}
.term-clar{
  background:var(--bg-elev);border:1px solid var(--border-soft);
  border-left:3px solid var(--blue);border-radius:var(--radius-sm);
  padding:9px 13px;font-size:.9rem;margin:0 0 12px;color:var(--text);
}
.tok-cmd{color:var(--blue);font-weight:600;}
.tok-flag{color:var(--amber);}
.tok-str{color:var(--green);}
.tok-dim{color:var(--text-muted);}
.term-err{color:var(--red);}
/* feedback */
.fb{
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:13px 15px;margin:4px 0 14px;background:var(--bg-elev);
}
.fb-good{border-color:var(--green);background:var(--green-dim);}
.fb-part{border-color:var(--amber);background:var(--amber-dim);}
.fb-bad{border-color:var(--red);background:var(--red-dim);}
.fb-danger{border-color:var(--red);background:var(--red-dim);box-shadow:inset 0 0 0 1px var(--red);}
.fb-head{font-weight:800;font-size:1rem;display:flex;align-items:center;gap:9px;color:var(--text-bright);}
.fb-good .fb-head{color:var(--green);}
.fb-part .fb-head{color:var(--amber);}
.fb-bad .fb-head,.fb-danger .fb-head{color:var(--red);}
.fb-credit{font-size:.88rem;color:var(--text-muted);margin:5px 0 8px;}
.fb-items{list-style:none;margin:0 0 9px;padding:0;}
.fb-items li{
  padding:5px 0 5px 2px;font-size:.9rem;
  border-bottom:1px dashed var(--border-soft);
}
.fb-items li:last-child{border-bottom:none;}
.it-c{color:var(--green);}
.it-w{color:var(--red);}
.it-m{color:var(--text-muted);}
.fb-explain{font-size:.93rem;color:var(--text);}
.fb-explain code{word-break:break-word;}
.fb-canonical{
  background:var(--bg-surface-2);border:1px solid var(--border);
  border-radius:7px;padding:9px 12px;margin:8px 0;font-size:.9rem;
  font-family:var(--mono);color:var(--text-bright);word-break:break-word;
}
/* action row */
.action-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.skip-warn{
  color:var(--amber);font-size:.85rem;display:inline-flex;gap:6px;align-items:center;
}
/* pause overlay */
.pause-ov{
  margin-top:14px;border:1px solid var(--amber);border-radius:var(--radius-sm);
  background:var(--amber-dim);padding:22px;text-align:center;
}
.pause-ov .big{font-size:1.15rem;font-weight:800;color:var(--amber);display:flex;gap:9px;align-items:center;justify-content:center;}
.pause-ov p{color:var(--text);margin:8px 0 14px;}
/* review hub */
.rev-item{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--bg-elev);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:10px;min-height:52px;
}
.rev-item .grow{flex:1 1 auto;min-width:200px;}
.rev-st{color:var(--amber);font-weight:700;display:inline-flex;gap:6px;align-items:center;font-size:.88rem;}
/* results */
.res-banner{
  border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;text-align:center;background:var(--bg-surface);
  margin-bottom:16px;
}
.res-banner.pass{border-color:var(--green);background:linear-gradient(180deg,var(--green-dim),var(--bg-surface));}
.res-banner.fail{border-color:var(--red);background:linear-gradient(180deg,var(--red-dim),var(--bg-surface));}
.res-pct{font-size:3rem;font-weight:800;color:var(--text-bright);font-variant-numeric:tabular-nums;}
.res-word{font-size:1.1rem;font-weight:800;display:inline-flex;gap:9px;align-items:center;}
.res-banner.pass .res-word{color:var(--green);}
.res-banner.fail .res-word{color:var(--red);}
.res-sub{color:var(--text-muted);margin-top:6px;font-size:.92rem;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px;}
.stat{
  background:var(--bg-surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:14px 16px;
}
.stat .k{color:var(--text-muted);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:7px;align-items:center;}
.stat .v{font-size:1.45rem;font-weight:800;color:var(--text-bright);margin-top:4px;font-variant-numeric:tabular-nums;}
.stat .s{font-size:.83rem;color:var(--text-muted);margin-top:2px;}
.stat-green .v{color:var(--green);}
.stat-amber .v{color:var(--amber);}
.stat-red .v{color:var(--red);}
.stat-blue .v{color:var(--blue);}
.res-table{width:100%;border-collapse:collapse;font-size:.9rem;}
.res-table th,.res-table td{border-bottom:1px solid var(--border-soft);padding:8px 10px;text-align:left;}
.res-table th{color:var(--text-muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;}
.res-table td .mono{font-variant-numeric:tabular-nums;}
/* toast */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--bg-elev-2);border:1px solid var(--blue);
  color:var(--text-bright);border-radius:999px;padding:10px 20px;
  font-size:.9rem;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.5);
}
/* responsive */
@media (max-width:760px){
  .match-row{grid-template-columns:1fr;}
  .dnd-grid{grid-template-columns:1fr;}
  .tb-title{width:100%;margin-right:0;}
  .intro-head h1{font-size:1.25rem;}
  .res-pct{font-size:2.3rem;}
  .blk-body{padding:9px 11px 12px;}
}
/* motion */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;}
}
@keyframes pulse-ok{0%{box-shadow:0 0 0 0 rgba(70,194,110,.35);}100%{box-shadow:0 0 0 12px rgba(70,194,110,0);}}
@keyframes fade-up{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.anim-fade{animation:fade-up .18s ease-out;}
.pulse-ok{animation:pulse-ok .5s ease-out;}

</style>
</head>
<body>
<div class="topbar" id="topbar" style="display:none">
  <div class="topbar-in">
    <div class="tb-title"><span class="mono">T1586.002</span><span>Compromise Accounts: Email Accounts</span></div>
    <span class="badge badge-medium" id="tb-sev" data-sev-badge>MEDIUM</span>
    <span class="chip" id="tb-count">Exercise 1 of 15</span>
    <span class="chip" id="tb-timer" aria-label="Timer">⏱ --:--</span>
    <span class="chip chip-state-running" id="tb-state">▶ Running</span>
    <span class="chip chip-score" id="tb-score">Score: 0.00</span>
    <button class="btn btn-small" id="tb-hint" title="One hint per exercise (−0.10 credit)">△ Hint</button>
    <button class="btn btn-small" id="tb-skip" title="Move to the review list">⏭ Skip</button>
    <button class="btn btn-small" id="tb-pause" title="Stop the clock by hand">⏸ Pause</button>
  </div>
</div>
<main class="wrap">
  <div id="view-intro"></div>
  <div id="view-exam" style="display:none"><div id="exam-inner"></div><div id="pause-slot"></div></div>
  <div id="view-review" style="display:none"></div>

var EX = [{"id":"M01","type":"qcm","persp":"def","scenario":"Your company’s finance team received an “updated bank details” email from a controller’s genuine internal address. Your gateway shows: <code>SPF=pass, DKIM=pass, DMARC=pass<\/code>.","question":"What is the correct interpretation of these authentication results in this context?","options":["The mail left through the company’s own servers, so the checks confirm the <em>infrastructure<\/em>, not the <em>intent<\/em> — the mailbox itself may be compromised","SPF/DKIM/DMARC passing proves the controller personally approved the message","The attacker must have broken the company’s certificate authority to get these results","The results are meaningless for any internal mail"],"correct":0,"notes":["Right. Authentication proves the mail really came from the company’s legitimate mail system. When the mailbox is attacker-controlled, legitimate infrastructure delivers malicious mail — and the checks still pass.","Authentication has no concept of “the human approved it” — only that the sending path and signature were legitimate.","No CA break is needed: the legitimate signing infrastructure did all the work for the attacker.","The results are meaningful — they are exactly why this attack works so smoothly."],"hint":"SPF and DKIM answer “was this sent by the real mail system?” — not “did the real owner press Send?”","explain":"Email authentication validates the <em>sending path and signature<\/em>, never the sender’s intent. A compromised mailbox (T1586.002) sends through the legitimate tenant, so SPF and DKIM pass by design. This is why thread-hijacking and BEC from real mailboxes are so effective, and why content+context analysis matters alongside authentication."},{"id":"M02","type":"multi","persp":"att","scenario":"An adversary fully controls a finance-department mailbox and plans next quarter’s operation. They are picking follow-up actions that stay in the spirit of <code>T1586.002<\/code> (using the account) versus moves that belong to other techniques.","question":"Select <strong>all<\/strong> actions that are direct <em>use of the compromised mailbox<\/em>.","options":["Run internal spearphishing against colleagues from the trusted address","Create a forwarding rule so future mail is silently collected","Mine contacts and past threads to prepare believable lures","Impersonate the owner in invoice-fraud conversations with vendors","Register a typosquat domain that mimics the company","Rent a bulletproof VPS to host the credential-harvesting page"],"correct":[0,1,2,3],"notes":["Yes — that is T1534 Internal Spearphishing, launched from the compromised account resource.","Yes — a forwarding rule turns the mailbox into a collection device (T1114.003) and keeps the access valuable.","Yes — the mailbox as an intelligence source; ATT&CK explicitly mentions using compromised accounts to further operations.","Yes — impersonation of the real persona for fraud is the classic abuse of a compromised email identity.","No — that is Acquire Infrastructure: Domains (T1583.001), a different resource being developed.","No — that is Acquire Infrastructure (T1583.003/004). The VPS hosts the attack; it is not use of the mailbox."],"hint":"Ask: does the action <em>happen through the mailbox or because of it<\/em>? Buying and registering things are other techniques.","explain":"Using the mailbox = phishing from it, collecting through it, mining it, or speaking as its owner. Registering domains (T1583.001) and renting hosting (T1583) develop <em>different<\/em> resources and are separate ATT&CK techniques."},{"id":"M03","type":"match","persp":"con","scenario":"Mapping drill: connect each ATT&CK identifier with its correct name. These are the neighbours you will meet around T1586.002.","question":"Match each identifier to its name.","left":["T1586.002","TA0042","T1586.001","T1566","T1114.003"],"right":["Compromise Accounts: Email Accounts","Resource Development (tactic)","Compromise Accounts: Social Media Accounts","Phishing (Initial Access)","Email Forwarding Rule (Email Collection)"],"pairs":[0,1,2,3,4],"pairNotes":["The exam’s subject: taking over existing mailboxes as a resource.","The tactic that contains T1586.x — preparing resources for operations.","Sibling sub-technique: social media personas taken over for credibility.","The Initial Access technique that often consumes the compromised mailbox by sending lures.","A classic persistence/collection move after takeover: silently forward mail out."],"hint":"TA00xx = tactics; T15xx = techniques. “Email Forwarding Rule” is about collecting mail, not sending it.","explain":"These five identifiers form the local map around T1586.002: its parent family and tactic, the sibling account type, the downstream phishing technique (T1566), and the forwarding-rule collection technique (T1114.003) frequently used after takeover."},{"id":"M04","type":"order","persp":"att","scenario":"You captured an attacker’s notebook describing a mailbox-compromise operation. The pages fell on the floor and lost their order.","question":"Put the operation steps back into the attacker’s intended order.","items":["Steal the mailbox password with a credential-phishing page (T1598-style)","Log in to the mailbox from attacker infrastructure","Create a hidden forwarding rule to collect future mail (T1114.003)","Send an invoice lure from the owner’s address to their contacts","Harvest credentials from victims who answer the lure"],"itemNotes":["The compromise itself: credentials first, so the mailbox becomes a T1586.002 resource.","Access is established; note that good attackers avoid loud password changes here.","Persistence + collection: future mail flows to the attacker even if they rarely log in.","The resource is spent: trusted-sender phishing against the contact network.","The harvested credentials become resources for the next cycle — the wheel turns."],"hint":"You cannot log in before you have the password, and you cannot harvest replies before sending the lure.","explain":"The lifecycle: obtain credentials → establish access → add quiet persistence (forwarding rule) → spend the trust (lure from the owner’s address) → convert victim answers into new credentials. Note how the output of one cycle becomes the input of the next — that is why early containment matters."},{"id":"M05","type":"qcm","persp":"def","scenario":"22:40–23:05: a user receives 27 MFA push approvals in a row. At 23:05 the user taps <strong>Approve<\/strong> just to stop the noise. Two minutes later there is a successful sign-in from an unknown device.","question":"What happened, and which design change addresses it?","options":["MFA push-bombing (fatigue) succeeded; use number matching or phishing-resistant MFA","The MFA server suffered an outage and must be restarted","The user’s phone was offline, so pushes queued up overnight","MFA codes expired too quickly and need a longer timeout"],"correct":0,"notes":["Correct — this is T1621-style MFA Request Generation paired with password stuffing or a known password. Number matching forces the user to prove they see the same number the legit login shows; FIDO2 keys remove the human tap entirely.","An outage would produce errors, not 27 real prompts and a successful login.","Offline phones do not receive pushes at all — and the sign-in succeeded, so a push was approved.","Timeouts are irrelevant: the attacker needed an approval, not a code."],"hint":"Ask why the user finally tapped Approve — was it belief, or exhaustion?","explain":"MFA fatigue (push-bombing) works because a tap feels harmless. Number matching, additional context shown in the prompt, or phishing-resistant MFA (FIDO2/WebAuthn) break this pattern. For the mailbox-compromise story this matters because MFA is the main brake on T1586.002 — and this is how attackers slide past a weak version of it."},{"id":"M06","type":"dnd","persp":"def","scenario":"Triage training: eight findings from yesterday’s identity and mailbox monitoring. Sort them before the morning meeting.","question":"Drag each finding into the right zone.","bank":["Successful sign-in from a TOR exit node","Impossible travel: two countries 40 minutes apart","New inbox rule that auto-deletes security alerts","OAuth consent granted to an unknown third-party app","Sign-in from the office IP range","Sign-in from the city where the user is on booked business travel","Password change made after an HR reminder email","Calendar invite from a long-term colleague"],"zones":["Likely compromise signal","Likely normal activity"],"zoneOf":[0,0,0,0,1,1,1,1],"itemNotes":["Anonymising infrastructure + successful login = strong takeover signal.","Geo-velocity violation: the same identity cannot be in both places.","Silent deletion of security mail is a classic attacker persistence/collection habit.","Unknown app consent is a common post-takeover persistence move.","Baseline office sign-in — expected.","Travel-consistent geography — expected (verify the booking if unsure).","Coordinated, explained change — expected.","Everyday collaboration — expected."],"hint":"Four findings deviate from the owner’s normal pattern or show attacker convenience; four are everyday events.","explain":"Compromise signals share one theme: <em>deviation from the owner’s baseline in ways that benefit an outsider<\/em> (anonymisation, impossible geography, silent mail handling, new app access). The normal column is routine, explainable activity — the sort that trains you to ignore alerts if you escalate it blindly."},{"id":"M07","type":"fill","persp":"def","scenario":"You are explaining to auditors why authentication did not stop the fraudulent mail from a compromised internal mailbox.","question":"Fill in the two standard email-authentication check names.","segments":["Because the mail left through the company’s own servers, it passed "," (the IP-based sender check) and "," (the cryptographic signature check)."],"blanks":[{"accept":["spf"],"note":"SPF checks the sending IP against the domain’s authorised senders."},{"accept":["dkim"],"note":"DKIM checks the cryptographic signature produced by the legitimate server."}],"hint":"Two three-letter acronyms: one about the sending <em>IP<\/em>, one about the <em>signature<\/em>.","explain":"<strong>SPF<\/strong> (Sender Policy Framework) authorises sending IPs; <strong>DKIM<\/strong> (DomainKeys Identified Mail) validates a signature created on the legitimate path. A compromised mailbox sends on exactly that path, so both pass — the checks were never designed to read intent."},{"id":"M08","type":"branch","persp":"def","scenario":"Triage call. Alert: user <code>r.okafor<\/code> signed in successfully from a country he has never visited before. You are on the clock.","question":"Work the decision path to a conclusion.","steps":[{"prompt":"Step 1 — What do you check <strong>first<\/strong>?","options":[{"text":"Compare the sign-in with known travel, corporate VPN ranges and the user’s recent activity","note":"Good instinct. Geography alone is weak evidence; context first, action second."},{"text":"Disable the account immediately for 48 hours and ask questions later","note":"Aggressive. It may be warranted if signs mount, but as a first step it costs the business and destroys the chance to observe."},{"text":"Close the alert — one unfamiliar country is normal for travellers","note":"Risky habit: closing on the first plausible story is how real intrusions survive."}]},{"prompt":"Step 2 — Context check result: the sign-in matches a flight the user booked. BUT one hour after the sign-in, a new inbox rule started silently marking “invoice” emails as read. What is your conclusion?","options":[{"text":"Possible compromise: investigate the rule and reset credentials","note":"The rule is owner-atypical and attacker-convenient; travel does not explain it."},{"text":"Ignore — the travel explains the sign-in, so the case is closed","note":"The travel explains the <em>location<\/em>, not the <em>rule<\/em>. Closing here is a mistake."},{"text":"Email the user and wait for a reply whenever they are free","note":"Too slow: if this is takeover, the attacker works while you wait."}]},{"final":true,"multi":false,"prompt":"Final call — pick the conclusion you will write in the ticket.","options":["Likely mailbox compromise (T1586.002 in progress): reset credentials, revoke sessions, review and remove the inbox rule","False positive caused by business travel; no action needed","Inconclusive; no action until the user answers an email"],"correct":0,"notes":["Right: the combination “explained location + owner-atypical rule” still points to takeover; act on the rule, not the geography.","The travel explains the sign-in location but nothing explains the rule — this is not a clean false positive.","Waiting on user email is not a triage conclusion when post-auth behaviour already looks attacker-driven."]}],"hint":"Travel can explain <em>where<\/em>; it cannot explain <em>what the account started doing<\/em>.","explain":"Good triage weighs the full behaviour chain. A travel-consistent sign-in plus an owner-atypical inbox rule acting on “invoice” mail is a classic BEC pattern: whoever controls the mailbox is preparing invoice fraud. Response: verify scope, reset credentials, revoke sessions, and remove the rule while preserving evidence."},{"id":"M09","type":"qcm","persp":"att","scenario":"Attacker doctrine question: after logging into a stolen mailbox, why do careful attackers usually <strong>not<\/strong> change the account password?","question":"Pick the reasoning that matches real-world behaviour.","options":["A password change can lock out and alert the real owner, exposing access that is cheaper to keep quiet","Mailbox passwords cannot technically be changed by third parties","The mail provider forbids password changes on business accounts","Changing the password resets the mailbox quota"],"correct":0,"notes":["Right. Quiet access is valuable access: the owner keeps using the mailbox normally, and support tickets or “my password stopped working” reports never happen.","Technically the attacker can change it — they choose not to.","No such provider rule; the reason is operational, not policy.","Quota has nothing to do with it."],"hint":"Think like an intruder: what happens on the victim’s side the moment the password stops working?","explain":"Keeping the original password preserves stealth: the owner notices nothing, and the attacker rides along. Persistence instead comes from quieter additions — forwarding rules, app passwords, OAuth grants or stolen session cookies — which do not lock the owner out. This is also why defenders monitor rule and grant changes, not just password changes."},{"id":"M10","type":"multi","persp":"def","scenario":"You are tuning detections for mailbox takeover. A teammate lists candidate telemetry sources; you must keep only the ones that actually help.","question":"Select <strong>all<\/strong> telemetry sources useful for detecting use of a compromised mailbox.","options":["Mailbox audit events such as MailItemsAccessed from unusual IPs","Creation of new inbox rules or external forwarding on the mailbox","Sign-ins from new countries, new devices or anonymising services","A sudden rise in outbound mail volume from the account","CPU temperature of the mail server","Office badge swipes at the front door"],"correct":[0,1,2,3],"notes":["Yes — MailItemsAccessed shows the mailbox was read, and from where.","Yes — rule/forwarding creation is the signature post-takeover persistence move.","Yes — identity telemetry is usually the first and loudest signal.","Yes — volume spikes reveal the mailbox being “spent” on spam or lures.","No — thermals say nothing about who read a mailbox.","No — badges track building doors, not mailbox sessions."],"hint":"Two options measure buildings and hardware, not identity and mail behaviour.","explain":"Useful telemetry spans three layers: <em>identity<\/em> (sign-ins, MFA prompts), <em>mailbox<\/em> (audit reads, rule/forwarding changes, OAuth grants), and <em>mail flow<\/em> (volume, recipients, message trace). Hardware and physical-door data do not observe mailbox abuse."},{"id":"M11","type":"qcm","persp":"con","scenario":"ATT&CK lists the mitigation <code>M1056 Pre-compromise<\/code> for this technique with a note: “This technique cannot be easily mitigated with preventive controls since it is based on behaviors performed outside of the scope of enterprise defenses and controls.”","question":"Why is that the honest assessment for T1586.002?","options":["The credential theft and account takeover can happen entirely on other providers’ services, before any enterprise control sees anything","It means the SOC has no internet access during pre-compromise phases","Because ATT&CK forbids mitigations for Resource Development techniques","Because mail servers cannot be configured securely at all"],"correct":0,"notes":["Right: phishing the password, buying creds, or brute-forcing reused passwords typically happens on personal accounts, other platforms, or criminal markets — outside your visibility.","It is a mitigation name, not a network statement.","ATT&CK does attach mitigations to RD techniques — M1056 is itself the example here.","Unrelated claim; mail servers can be hardened, but that is not what the note says."],"hint":"The word “outside” in the note is doing the heavy lifting. Outside of <em>what<\/em>?","explain":"The compromise phase often occurs beyond enterprise telemetry — personal webmail, third-party breach dumps, criminal forums. Hence M1056 Pre-compromise: prevention is hard, so defenders invest in making compromise harder (MFA, training) and in detecting the <em>downstream use<\/em> of the account, which does happen inside their view."},{"id":"M12","type":"branch","persp":"att","scenario":"Red-team planning exercise. You hold a compromised CFO mailbox and the objective is a wire-transfer fraud that stays unnoticed for days. Design the least-detectable operation.","question":"Walk the planning path to its final shape.","steps":[{"prompt":"Step 1 — Your preparation move?","options":[{"text":"Study recent threads for tone, pending invoices and current projects","note":"Correct doctrine: context research is what makes the fake indistinguishable from the real."},{"text":"Email all staff immediately asking for urgent payments","note":"Noisy: mass mail from the CFO triggers calls, hoaxes and instant detection."},{"text":"Change the account photo and the out-of-office message","note":"Cosmetic changes that add risk without adding credibility."}]},{"prompt":"Step 2 — Your delivery?","options":[{"text":"Reply inside an existing invoice thread with “updated bank details”","note":"Thread hijacking: inherits the whole real context — vendor, invoice number, expectation."},{"text":"Send a brand-new email from an unrelated display name","note":"Wastes the asset: a fresh-looking mail has none of the owner’s trust."},{"text":"Mass-mail the entire company at once","note":"Maximum noise, minimum credibility, shortest lifespan."}]},{"final":true,"multi":false,"prompt":"Final — Which description matches the operation you built?","options":["Context-studied reply inside a real invoice thread — quiet, credible, slow to detect","Company-wide gift-card request from the CFO’s address","A public social media post asking vendors for payments"],"correct":0,"notes":["Yes — this is the textbook quiet BEC pattern that compromised mailboxes enable.","That is the loud pattern you rejected in both steps.","Off-channel and public — not a mailbox operation at all."]}],"hint":"Real BEC criminals are patient accountants of trust: read first, speak inside existing conversations.","explain":"The dangerous pattern is <em>patience + context<\/em>: read the mailbox, then act inside existing threads where every detail is already expected. Defenders counter it with out-of-band payment verification (call the vendor on a known number) and by alerting on owner-atypical mailbox behaviour rather than on single emails."},{"id":"M13","type":"qcm","persp":"def","scenario":"A user calls: “I’m locked out of my mailbox, and my recovery email was changed to an address I don’t know.” Tickets are piling up; you must choose the first response now.","question":"Which first response best preserves security <em>and<\/em> evidence?","options":["Reset credentials, revoke active sessions and tokens, then review rules and recent sign-ins","Wait a day — many lockouts resolve themselves","Delete the mailbox immediately to cut off the attacker","Forward the user’s mail to a personal IT mailbox so someone can “keep an eye on it”"],"correct":0,"notes":["Right: cut live access (reset + session revocation matters because tokens survive password changes), then review rules, grants and sign-ins for what the attacker did.","Waiting gives the attacker a free day of collection and fraud.","Deleting destroys evidence and business data, and if the attacker holds a valid session token it may not even stop them.","Shadow-forwarding mail to personal mailboxes is itself a bad practice and contaminates evidence."],"hint":"Two goals: stop the bleeding <em>without<\/em> burning the crime scene.","explain":"Standard containment: credential reset + session/token revocation (kills cookie replay such as T1550.004), then a short review of rules (T1114.003), OAuth grants and sign-in history. This is the balanced middle between “do nothing” and destructive overreaction — a pattern you will reuse at higher severities."},{"id":"M14","type":"match","persp":"def","scenario":"Detection dictionary check: four alert phrases you will meet in mailbox-compromise work.","question":"Match each phrase with what it actually means.","left":["Impossible travel","Hidden inbox rule","OAuth consent grant","Message trace"],"right":["Sign-ins from distant places within a physically impossible time frame","Mail being handled silently: marked read, moved, or auto-deleted","An application was given permission to access the mailbox","A record of how a specific mail was routed and delivered"],"pairs":[0,1,2,3],"pairNotes":["Geo-velocity anomaly — a classic identity-protection alert; tune for VPN egress before trusting it.","Rules that act on security/invoice mail are attacker-convenient; legit users create few of these.","Consent phishing leaves one of these behind; audit and revoke unknown grants.","Message trace answers “did it leave, to whom, through which connector?” — key for lure-blast scoping."],"hint":"One is about <em>logins<\/em>, one about <em>mail handling<\/em>, one about <em>app access<\/em>, one about <em>routing<\/em>.","explain":"Four pillars of mailbox-compromise detection: identity anomalies (impossible travel), silent mail handling (rules), third-party access (OAuth grants), and mail-flow forensics (message trace). Together they cover the takeover, persistence and abuse phases."},{"id":"M15","type":"multi","persp":"con","scenario":"True-or-false round for the study group — this time about the difference between <em>compromising<\/em> and <em>establishing<\/em> email accounts.","question":"Select <strong>all<\/strong> statements that are TRUE.","options":["Compromise (T1586.002) means taking over an account that already exists","Establish (T1585.002) means creating and cultivating an account yourself","Both T1586.002 and T1585.002 belong to Resource Development","Compromise means registering a new domain name in the victim’s style","T1585.002 is an Initial Access technique"],"correct":[0,1,2],"notes":["True — compromise = takeover of the existing.","True — establish = build and warm up your own persona.","True — both are Resource Development ways of obtaining an account resource.","False — that is Acquire Infrastructure: Domains (T1583.001), not account compromise.","False — T1585.002 is Resource Development, like T1586.002."],"hint":"The pair differs only in who created the account first. Both happen before the attack.","explain":"T1586.002 (take over) and T1585.002 (create) are mirror techniques inside Resource Development. The distinction matters operationally: established accounts have clean but shallow history; compromised accounts have deep, real history — and get detected through their <em>owner’s<\/em> baseline deviation."}];
var INTRO = {"objectType":"MITRE ATT&CK sub-technique","subtitle":"MEDIUM exam · apply the technique to realistic attacker and defender situations","learn":"\n<p>You already know the basics: <strong>T1586.002 (Compromise Accounts: Email Accounts)<\/strong> is a\n<strong>sub-technique<\/strong> of <strong>Compromise Accounts (T1586)<\/strong> in the tactic\n<strong>Resource Development (TA0042)<\/strong>. This exam pushes further: you decide what the technique\nlooks like in real mail flows, logs and response choices.<\/p>\n<ul>\n<li><strong>Trust mechanics:<\/strong> why mail from a compromised internal mailbox passes SPF/DKIM and inherits thread history.<\/li>\n<li><strong>Attacker playbook:<\/strong> quiet reading, hidden forwarding rules (T1114.003), thread hijacking, invoice fraud.<\/li>\n<li><strong>Account-takeover signals:<\/strong> impossible travel, MFA push-bombing (T1621), anonymising services, OAuth grants.<\/li>\n<li><strong>Defender telemetry:<\/strong> sign-in logs, mailbox audit events, message trace, rule changes.<\/li>\n<li><strong>Response judgement:<\/strong> proportionate containment that preserves evidence and business flow.<\/li>\n<li><strong>ATT&CK placement:<\/strong> telling T1586.002 apart from T1585.002 (establish) and T1566 (phishing with the mailbox).<\/li>\n<\/ul>\n","keywords":["T1586.002","Thread hijacking","SPF / DKIM","Internal spearphishing (T1534)","Email Forwarding Rule (T1114.003)","MFA fatigue / push-bombing (T1621)","Impossible travel","OAuth consent grant","Mailbox audit log","Pre-compromise (M1056)","T1585.002 Establish Accounts","Least-aggressive response"],"how":"<div class=\"how-row\"><span class=\"how-ic\">◎<\/span><span><strong>Goal.<\/strong> There are __NCOUNT__ exercises. You need at least <strong>65%<\/strong> to pass. Partial credit is possible: if an exercise has several correct parts, you get the fraction you earned, computed as (hits − wrong) ÷ correct parts, never below 0. A fully right answer gives 1.00.<\/span><\/div><div class=\"how-row\"><span class=\"how-ic\">⚙<\/span><span><strong>Exercise types in this exam:<\/strong> <strong>Decision path.<\/strong> You walk through scenario steps. Intermediate choices are not scored — only the final choice is, after you press Check. <strong>Sorting cards.<\/strong> You drag cards into zones (or click a card, then click a zone). Each card in the right zone counts. <strong>Fill in the blanks.<\/strong> You type short answers. Spelling has small freedom (for example letter case does not matter), and each blank counts. <strong>Matching.<\/strong> You link each item on the left with its partner using a dropdown. Each correct link counts. <strong>Multiple choice (several answers).<\/strong> You pick every option that applies. If you get some but not all, you keep part of the credit. Picking a wrong option loses credit. <strong>Ordering.<\/strong> You put steps in the right order by dragging rows or using the ▲ / ▼ buttons. Each step in the right place counts. <strong>Multiple choice (one answer).<\/strong> You pick one option. A right answer gives full credit, a wrong answer gives 0.<\/span><\/div><div class=\"how-row\"><span class=\"how-ic\">⏱<\/span><span><strong>The clock.<\/strong> The timer budget is <strong>__BUDGET__<\/strong> for the whole exam (estimated time 35 min). When you press <em>Check<\/em>, the clock <strong>auto-pauses<\/strong> (the header shows “⏸ Auto-paused”) while you read the feedback; pressing <em>Next<\/em> starts it again. The <em>Pause<\/em> button stops the clock by hand (the header shows “⏸ Paused”) and hides the exercise; <em>Resume<\/em> brings it back exactly as it was. <em>Hint<\/em> and <em>Skip<\/em> do <strong>not<\/strong> stop the clock.<\/span><\/div><div class=\"how-row\"><span class=\"how-ic\">△<\/span><span><strong>Hints.<\/strong> Each exercise has one hint. A hint costs <strong>0.10<\/strong> of that exercise’s credit (the credit never goes below 0). The second hint never appears — one hint per exercise.<\/span><\/div><div class=\"how-row\"><span class=\"how-ic\">⚠<\/span><span><strong>Skipping.<\/strong> <em>Skip<\/em> moves an exercise to a review list without scoring it. After the last exercise you get the <em>Review skipped exercises<\/em> screen, where you can answer them. A skipped exercise only counts when you answer it; if you never answer it, it is excluded from both your score and the total. The clock keeps running during the review until you press <em>Finish exam<\/em>.<\/span><\/div><div class=\"how-row\"><span class=\"how-ic\">✓<\/span><span><strong>Results.<\/strong> At the end you see fully correct, partially correct (with your average partial credit), fully incorrect, and skipped-and-never-answered counts, plus the time spent paused. Your final score is sent once to the training website.<\/span><\/div><div class=\"how-row\"><span class=\"how-ic\">↻<\/span><span><strong>Retake.<\/strong> You can retake the exam at any time from the results screen. A retake starts fresh: empty score, full clock, empty skip list.<\/span><\/div>","title":"T1586.002 · Compromise Accounts: Email Accounts"};

  var now=Date.now();
  if((T.state==='PAUSED_MANUAL'||T.state==='PAUSED_AUTO_CHECK') && T.enterTs){
    T.accum[T.state]+=(now-T.enterTs)/1000;
  }
  if(ns==='PAUSED_MANUAL'||ns==='PAUSED_AUTO_CHECK'){ T.enterTs=now; T.counts[ns]++; }
  var was=T.state; T.state=ns;
  if(ns==='RUNNING'){ startTick(); } else { stopTick(); }
  if(was==='PAUSED_MANUAL'||ns==='PAUSED_MANUAL'||was==='PAUSED_AUTO_CHECK'||ns==='PAUSED_AUTO_CHECK'||ns==='ENDED'){ renderTimer(); }
}
function startTick(){ if(T.tick||T.state!=='RUNNING') return; T.tick=setInterval(onTick,1000); }
function stopTick(){ if(T.tick){ clearInterval(T.tick); T.tick=null; } }
function onTick(){
  if(T.state!=='RUNNING') return;          /* no tick while any pause is active */
  T.remaining--; renderTimer();
  if(T.remaining<=0){ T.remaining=0; timeUp(); }
}
function renderTimer(){
  var t=$('tb-timer'), st=$('tb-state');
  if(!t) return;
  t.textContent='\u23F1 '+fmt(T.remaining);
  t.setAttribute('aria-label','Timer '+fmt(T.remaining));
  var m={'RUNNING':['\u25B6 Running','chip chip-state-running','Timer running'],
         'PAUSED_MANUAL':['\u23F8 Paused','chip chip-state-paused','Timer paused manually'],
         'PAUSED_AUTO_CHECK':['\u23F8 Auto-paused (checking)','chip chip-state-auto','Timer auto-paused while checking'],
         'ENDED':['\u25A0 Ended','chip chip-state-ended','Timer ended']};
  var c=m[T.state]; st.textContent=c[0]; st.className=c[1]; st.setAttribute('aria-label',c[2]);
  var pb=$('tb-pause');
  if(pb){ pb.disabled=(S.view!=='exam'&&S.view!=='review-ex')||T.state==='ENDED';
    pb.innerHTML=(T.state==='PAUSED_MANUAL')?'\u25B6 Resume':'\u23F8 Pause'; }
  var sk=$('tb-skip'), hi=$('tb-hint');
  var inEx=(S.view==='exam'||S.view==='review-ex');
  if(sk) sk.disabled=!inEx||S.checked||S.reviewMode;
  if(hi) hi.disabled=!inEx||S.checked||!!S.hintUsed[S.idx];
}

/* ===== scoring ===== */
function rawToCredit(raw, idx){
  var c=raw - (S.hintUsed[idx]?0.10:0);
  return Math.max(0, Math.min(1, c));
}
function clampRaw(h,w,n){ return Math.max(0, Math.min(1, (h-w)/n)); }
function labelFor(h,w,n){
  var raw=clampRaw(h,w,n);
  if(h===n&&w===0) return 'correct';
  return raw>0?'partial':'incorrect';   /* zero credit is never labelled partial */
}
function setStatus(idx, label, credit, g){
  S.answers[idx]={status:label, credit:credit, answered:true, g:g};
  S.score=(S.score||0)+credit;
  S.skipped=S.skipped.filter(function(x){return x!==idx;});  /* answered: leaves the skipped list */
}

function wireAnswer(ex){

    renderDnD(ex);

  } else if(ex.type==='branch'){

    var inp=$('term-in');

function runTerm(ex, cmd){
  var out=$('term-out'); if(!out) return;
  var p=ex.shell.promptStr;
  if(cmd.trim()===''){ out.textContent+='\n'+p+' (type a command)'; out.scrollTop=out.scrollHeight; return; }
  var res=simShell(ex, cmd.trim());
  UI.last=cmd.trim();
  out.textContent+='\n'+p+' '+cmd.trim()+'\n'+res;
  out.scrollTop=out.scrollHeight;
}
function simShell(ex, cmdline){
  if(/^clear$/i.test(cmdline)){ $('term-out').textContent=''; return ''; }
  if(/^help$/i.test(cmdline)){ return ex.shell.helpText; }
  var stages=cmdline.split('|').map(function(s){return s.trim();});
  var res=simOne(ex, stages[0]);
  for(var i=1;i<stages.length;i++){
    var m=stages[i].match(/^grep\s+(?:-c\s+)?["']?(\S+?)["']?$/i);
    if(!m){ return 'grep: unsupported usage in this simulated shell'; }
    var pat=m[1]; var lines=res.split('\n');
    if(/grep\s+-c/i.test(stages[i])){ return String(lines.filter(function(l){return l.indexOf(pat)>=0;}).length); }
    res=lines.filter(function(l){return l.indexOf(pat)>=0;}).join('\n');
  }
  return res;
}
function simOne(ex, cmd){
  var tools=ex.shell.tools;
  for(var i=0;i<tools.length;i++){
    if(new RegExp(tools[i].re,'i').test(cmd)) return tools[i].out;
  }
  var name=cmd.split(/\s+/)[0];
  return 'bash: '+name+': command not found (simulated shell \u2014 type help)';
}

  if(!S.checked){

    if(S.reviewMode){ /* nothing extra */ }
  } else {
    var lbl = S.reviewMode ? '\u21A9 Return to review' : (S.idx===EX.length-1 ? '\u25B6 Final submit' : 'Next exercise \u2192');
    h+='<button class="btn btn-green" id="btn-next">'+lbl+'</button>';
    h+='<span class="skip-warn">Feedback is shown below. The clock '+ (T.state==='PAUSED_AUTO_CHECK'?'is auto-paused while you read this.':'will resume when you continue.') +'</span>';
  }
  row.innerHTML=h;
  var b1=$('btn-check'); if(b1) b1.addEventListener('click', onCheck);
  var b2=$('btn-next'); if(b2) b2.addEventListener('click', onNext);
  var sk=$('tb-skip'), hi=$('tb-hint');
  if(sk) sk.disabled = S.checked || S.reviewMode;
  if(hi) hi.disabled = S.checked || !!S.hintUsed[S.idx];
}
function onCheck(){
  if(S.checked) return;
  var ex=EX[S.idx];
  var g=grade(ex);
  if(g===null){
    if(ex.type==='term'){
      $('fb-slot').innerHTML='<div class="fb fb-part" role="status">Run a command in the shell first, then press Check.</div>';
    }
    return; /* grade() already showed an inline message */
  }
  S.checked=true;
  var credit=rawToCredit(g.raw, S.idx);
  setStatus(S.idx, g.label, credit, g);
  setTState('PAUSED_AUTO_CHECK');       /* auto-pause: timer stops while feedback is open */
  renderFeedback(S.idx);
  renderHeader(); renderActions(ex);
}
function onNext(){
  if(!S.checked) return;
  if(S.reviewMode){ S.reviewMode=false; setTState('RUNNING'); gotoView('review'); renderReview(); return; }
  if(S.idx<EX.length-1){
    startExercise(S.idx+1); setTState('RUNNING');
  } else if(S.skipped.length){
    setTState('RUNNING'); gotoView('review'); renderReview();
  } else {
    finish();
  }
}
function onSkip(){
  if(S.checked||S.reviewMode) return;
  S.skipped.push(S.idx);
  if(S.idx<EX.length-1){ startExercise(S.idx+1); }
  else if(S.skipped.length){ setTState('RUNNING'); gotoView('review'); renderReview(); }
  else { finish(); }
  renderHeader();
}
function onPause(){
  if(T.state==='ENDED') return;
  if(T.state==='PAUSED_MANUAL'){ setTState(T.retTo||'RUNNING'); T.retTo=null; hidePause(); }
  else if(T.state==='RUNNING'||T.state==='PAUSED_AUTO_CHECK'){
    T.retTo=T.state;                    /* resume returns to auto-check if it was active */
    setTState('PAUSED_MANUAL'); showPause();
  }
}
function showPause(){
  /* the exercise card is hidden but NOT re-rendered: selections survive the pause */
  $('exam-inner').style.display='none';
  $('pause-slot').innerHTML='<div class="pause-ov" role="alert" aria-label="Paused">'
    +'<div class="big">\u23F8 Paused</div>'
    +'<p>The exam clock is stopped and this exercise is hidden. Your answers are safe.</p>'
    +'<button class="btn btn-primary" id="btn-resume">\u25B6 Resume</button></div>';
  $('btn-resume').addEventListener('click', onPause);
}
function hidePause(){
  $('pause-slot').innerHTML='';
  $('exam-inner').style.display='block';
}
function onHint(){
  if(S.checked||S.hintUsed[S.idx]) return;
  S.hintUsed[S.idx]=true;
  var ex=EX[S.idx];
  var slot=$('fb-slot');
  var div=document.createElement('div');
  div.className='fb fb-part';
  div.setAttribute('role','status');
  div.innerHTML='<div class="fb-head"><span>\u25B3</span> Hint revealed</div>'
    +'<div class="fb-credit">Using a hint reduces the credit for this exercise by 0.10 (the clock keeps running).</div>'
    +'<div class="fb-explain">'+ex.hint+'</div>';
  slot.parentNode.insertBefore(div, slot);
  renderActions(ex);
}

/* ---------- grading ---------- */
function grade(ex){
  switch(ex.type){
    case 'qcm': {
      if(UI.sel===null) { $('fb-slot').innerHTML='<div class="fb fb-part" role="status">Choose an answer first.</div>'; return null; }
      var ok=UI.sel===ex.correct;
      return {label: ok?'correct':'incorrect', raw: ok?1:0, items:null, chosen:UI.sel};
    }
    case 'multi': {
      var sel=Object.keys(UI.set).map(Number);
      var H=0,W=0,N=ex.correct.length;
      var items=ex.options.map(function(o,i){
        var inc=sel.indexOf(i)>=0, isc=ex.correct.indexOf(i)>=0;
        if(isc&&inc){H++; return {st:'c',i:i};}
        if(!isc&&inc){W++; return {st:'w',i:i};}
        if(isc&&!inc){ return {st:'m',i:i};}
        return {st:'x',i:i};
      });
      return {label:labelFor(H,W,N), raw:clampRaw(H,W,N), items:items};
    }
    case 'match': {
      var H=0,W=0,N=ex.pairs.length;
      var items=ex.left.map(function(l,i){
        if(UI.picks[i]===null) return {st:'m',i:i};
        if(UI.picks[i]===ex.pairs[i]){H++; return {st:'c',i:i};}
        W++; return {st:'w',i:i};
      });
      return {label:labelFor(H,W,N), raw:clampRaw(H,W,N), items:items};
    }
    case 'order': {
      var H=0,W=0,N=ex.items.length;
      var items=UI.arr.map(function(itemIdx,pos){
        if(itemIdx===pos){H++; return {st:'c',i:pos};}
        W++; return {st:'w',i:pos};
      });
      return {label:labelFor(H,W,N), raw:clampRaw(H,W,N), items:items};
    }
    case 'dnd': {
      var H=0,W=0,N=ex.bank.length;
      var items=ex.bank.map(function(b,i){
        var z=UI.place[i];
        if(z===null||z===undefined) return {st:'m',i:i};
        if(z===ex.zoneOf[i]){H++; return {st:'c',i:i};}
        W++; return {st:'w',i:i};
      });
      return {label:labelFor(H,W,N), raw:clampRaw(H,W,N), items:items};
    }
    case 'fill': {
      var H=0,W=0,N=ex.blanks.length;
      var inputs=$('view-exam').querySelectorAll('[data-fill]');
      var items=[];
      inputs.forEach(function(inp,i){
        var v=norm(inp.value);
        if(v===''){ items.push({st:'m',i:i}); return; }
        var ok=ex.blanks[i].accept.indexOf(v)>=0;
        if(ok){H++; items.push({st:'c',i:i});} else {W++; items.push({st:'w',i:i});}
      });
      return {label:labelFor(H,W,N), raw:clampRaw(H,W,N), items:items};
    }
    case 'branch': {
      var f=ex.steps[ex.steps.length-1];
      if(f.multi){
        var sel=Object.keys(UI.set).map(Number);
        var H=0,W=0,N=f.correct.length;
        var items=f.options.map(function(o,i){
          var inc=sel.indexOf(i)>=0, isc=f.correct.indexOf(i)>=0;
          if(isc&&inc){H++; return {st:'c',i:i};}
          if(!isc&&inc){W++; return {st:'w',i:i};}
          if(isc&&!inc){ return {st:'m',i:i};}
          return {st:'x',i:i};
        });
        return {label:labelFor(H,W,N), raw:clampRaw(H,W,N), items:items};
      } else {
        if(UI.sel===null){ $('fb-slot').innerHTML='<div class="fb fb-part" role="status">Choose a final answer first.</div>'; return null; }
        var ok=UI.sel===f.correct;
        return {label: ok?'correct':'incorrect', raw: ok?1:0, items:null, chosen:UI.sel};
      }
    }
    case 'term': {
      var cmd=UI.last;
      if(!cmd){ return null; }
      var nm=null;
      for(var i=0;i<ex.nearMiss.length;i++){
        if(new RegExp(ex.nearMiss[i].re,'i').test(cmd)){ nm=ex.nearMiss[i]; break; }
      }
      if(nm){
        return {label:'danger', raw:0, items:null, nearMiss:nm, cmd:cmd};
      }
      var H=0,N=ex.elements.length; var items=[];
      for(var j=0;j<N;j++){
        var hit=new RegExp(ex.elements[j].re,'i').test(cmd);
        if(hit){H++; items.push({st:'c',i:j});} else {items.push({st:'m',i:j});}
      }
      var label=(H===N)?'correct':(H>0?'partial':'incorrect');
      return {label:label, raw:clampRaw(H,0,N), items:items, cmd:cmd};
    }
  }
  return null;
}

/* ---------- feedback ---------- */
var FB_WORD={correct:['\u2713 Correct','fb-good'], partial:['\u2713 Partially correct','fb-part'],
  incorrect:['\u2717 Incorrect','fb-bad'], danger:['\u26A0 DANGEROUS \u2014 NEAR MISS','fb-danger']};
var ITEM_MARK={c:['\u2713 Correct','it-c'], w:['\u2717 Wrong','it-w'], m:['\u25CB Missed','it-m']};

function itemText(ex, g, it){
  var i=it.i;
  switch(ex.type){
    case 'multi': return {label:ex.options[i], note:ex.notes[i]};
    case 'branch': return {label:ex.steps[ex.steps.length-1].options[i], note:ex.steps[ex.steps.length-1].notes[i]};
    case 'match': return {label:'\u201C'+ex.left[i]+'\u201D', note:ex.pairNotes[i]};
    case 'order': return {label:'Position '+(i+1)+': '+ex.items[i], note:ex.itemNotes[i]};
    case 'dnd': return {label:ex.bank[i], note:ex.itemNotes[i]};
    case 'fill': return {label:'Blank '+(i+1), note:ex.blanks[i].note};
    case 'term': return {label:ex.elements[i].label, note:ex.elements[i].note};
  }
  return {label:'',note:''};
}
function renderFeedback(idx){
  var ex=EX[idx], a=S.answers[idx];
  var g=a.g; /* the grade captured at Check time (stable across re-opens) */
  var credit=a.credit;
  var fb=FB_WORD[a.status]||FB_WORD.incorrect;
  var h='<div class="fb '+fb[1]+'" role="status" aria-live="polite" data-fb="1">';
  h+='<div class="fb-head"><span>'+fb[0].split(' ')[0]+'</span> '+fb[0].substring(fb[0].indexOf(' ')+1)+'</div>';
  h+='<div class="fb-credit">Credit: '+credit.toFixed(2)+' / 1.00'+(S.hintUsed[idx]?' (includes \u22120.10 hint penalty)':'')+'</div>';
  if(a.status==='danger'){
    h+='<div class="fb-explain"><strong>Your command:</strong> <code>'+esc(g.cmd)+'</code></div>';
    h+='<div class="fb-explain">'+g.nearMiss.why+'</div>';
    h+='<div class="fb-canonical">Canonical command: <span class="tok-cmd">'+esc(ex.canonical)+'</span></div>';
  } else {
    if(g&&g.items&&g.items.length){
      h+='<ul class="fb-items">';
      g.items.forEach(function(it){
        if(it.st==='x') return;
        var mk=ITEM_MARK[it.st]; var t=itemText(ex,g,it);
        var extra=(it.st==='m'&&ex.type==='match')?' \u2192 correct partner: '+esc(ex.right[ex.pairs[it.i]]):'';
        if(it.st==='m'&&ex.type==='order') extra=' \u2192 this position belongs to: '+ex.items[it.i];
        h+='<li class="'+mk[1]+'"><span>'+mk[0]+'</span> '+t.label+extra+(t.note?' \u2014 '+t.note:'')+'</li>';
      });
      h+='</ul>';
    }
    if(a.status==='incorrect'&&ex.type==='qcm'&&g){
      h+='<div class="fb-explain">You chose: '+String.fromCharCode(65+g.chosen)+'. '+ex.notes[g.chosen]+'</div>';
    }
    if(a.status==='incorrect'&&ex.type==='term'&&g){
      h+='<div class="fb-explain"><strong>Your command:</strong> <code>'+esc(g.cmd)+'</code></div>';
    }
    if((a.status==='incorrect'||a.status==='partial')&&ex.type==='term'){
      h+='<div class="fb-canonical">Canonical command: <span class="tok-cmd">'+esc(ex.canonical)+'</span></div>';
      h+='<div class="fb-explain">'+ex.expected+'</div>';
    }
    h+='<div class="fb-explain">'+ex.explain+'</div>';
  }
  h+='</div>';
  var slot=$('fb-slot');
  var old=slot.querySelector('.fb'); if(old) old.remove();
  slot.insertAdjacentHTML('afterbegin',h);
}

/* ---------- review hub ---------- */
function renderReview(){
  var h='<div class="card anim-fade"><div class="card-body">';
  h+='<h2 style="margin:4px 0 4px;">\u26A0 Review skipped exercises</h2>';
  h+='<p class="dnd-hint">These exercises were skipped and not answered. They do not count against your score unless you answer them here. The clock is still running until you finish.</p>';
  if(!S.skipped.length){
    h+='<div class="fb fb-good"><div class="fb-head"><span>\u2713</span> Nothing left to review</div><div class="fb-explain">You answered every exercise.</div></div>';
  }
  S.skipped.forEach(function(i,k){
    var ex=EX[i];
    h+='<div class="rev-item"><span class="rev-st"><span>\u26A0</span> Skipped</span><span class="grow">'+esc(ex.id)+' \u00B7 '+ex.type.toUpperCase()+' \u00B7 '+perspLabel(ex.persp)+'</span>'
      +'<button class="btn btn-small" data-rev="'+i+'">Answer</button></div>';
  });
  h+='<div class="action-row"><button class="btn btn-primary" id="btn-finish">\u25B6 Finish exam</button></div>';
  h+='</div></div>';
  $('view-review').innerHTML=h;
  $('view-review').querySelectorAll('[data-rev]').forEach(function(b){
    b.addEventListener('click',function(){
      S.reviewMode=true; S.reviewFrom=+b.getAttribute('data-rev');
      startExercise(+b.getAttribute('data-rev')); gotoView('review-ex');
    });
  });
  $('btn-finish').addEventListener('click', finish);
}

/* ---------- results ---------- */
function roundedReport(sumFloat, answeredCount){
  var scoreR=Math.round(sumFloat*100)/100;
  var percent=answeredCount>0?Math.round(scoreR/answeredCount*100):0;
  return {score:scoreR, percent:percent, passed:percent>=META.passMark};
}

/* ---------- results ---------- */
function collectResults(){
  var fully=0,partly=0,zero=0,skippedNA=0,sum=0,answered=0,partSum=0;
  EX.forEach(function(ex,i){
    var a=S.answers[i];
    if(a&&a.answered){ answered++; sum+=a.credit;
      if(a.credit>=0.999) fully++;
      else if(a.credit>0){ partly++; partSum+=a.credit; }
      else zero++;
    } else { skippedNA++; }
  });
  return {fully:fully,partly:partly,zero:zero,skippedNA:skippedNA,sum:sum,answered:answered,avgPart:partly?partSum/partly:0};
}
function reportScore(sumFloat, answeredCount){
  var r=roundedReport(sumFloat, answeredCount);
  try{
    if(window.parent&&window.parent!==window){
      window.parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,
        score:r.score,total:answeredCount,percent:r.percent,passed:r.passed}, location.origin);
    }
  }catch(e){/* standalone open: posting is a no-op */}
  return r;
}
function finish(){
  if(S.finished) return;
  S.finished=true;
  if(S.wallEnd===0){ S.wallEnd=Date.now(); }
  setTState('ENDED');
  var R=collectResults();
  var posted=roundedReport(R.sum, R.answered);   /* on-screen values == posted values */
  renderResults(R, posted);
  /* the score message is posted exactly once, after the score animation settles */
  setTimeout(function(){ if(!S.posted){ S.posted=true; reportScore(R.sum, R.answered); } }, REDUCED?80:780);
}
function timeUp(){
  if((S.view==='exam'||S.view==='review-ex')&&!S.checked){ S.skipped.push(S.idx); }
  S.timeExpired=true;
  finish();
}
function renderResults(R, posted){
  gotoView('results');
  var word=posted.passed?['\u2713 Passed','pass']:['\u2717 Not passed','fail'];
  var h='<div class="res-banner '+word[1]+'" data-results="1">';
  h+='<div class="res-word"><span>'+word[0].split(' ')[0]+'</span> '+word[0].substring(word[0].indexOf(' ')+1)+'</div>';
  h+='<div class="res-pct" id="res-pct">0%</div>';
  h+='<div class="res-sub">Final score '+posted.score.toFixed(2)+' of '+R.answered+' answered \u00B7 pass mark '+META.passMark+'%'
    +(S.timeExpired?' \u00B7 \u23F1 time ran out: unanswered exercises were skipped':'')+'</div></div>';
  h+='<div class="stat-grid">';
  h+='<div class="stat stat-green"><div class="k"><span>\u2713</span> Fully correct</div><div class="v">'+R.fully+'</div><div class="s">credit 1.00 each</div></div>';
  h+='<div class="stat stat-amber"><div class="k"><span>\u25D0</span> Partially correct</div><div class="v">'+R.partly+'</div><div class="s">average partial credit '+R.avgPart.toFixed(2)+'</div></div>';
  h+='<div class="stat stat-red"><div class="k"><span>\u2717</span> Fully incorrect</div><div class="v">'+R.zero+'</div><div class="s">credit 0.00 each</div></div>';
  h+='<div class="stat"><div class="k"><span>\u26A0</span> Skipped, never answered</div><div class="v">'+R.skippedNA+'</div><div class="s">excluded from score and total</div></div>';
  h+='<div class="stat stat-blue"><div class="k"><span>\u23F8</span> Time paused manually</div><div class="v">'+fmtDur(T.accum.PAUSED_MANUAL)+'</div><div class="s">'+T.counts.PAUSED_MANUAL+' pause'+(T.counts.PAUSED_MANUAL===1?'':'s')+'</div></div>';
  h+='<div class="stat stat-blue"><div class="k"><span>\u23F8</span> Time auto-paused (Check)</div><div class="v">'+fmtDur(T.accum.PAUSED_AUTO_CHECK)+'</div><div class="s">'+T.counts.PAUSED_AUTO_CHECK+' auto-pause'+(T.counts.PAUSED_AUTO_CHECK===1?'':'s')+'</div></div>';
  h+='</div>';
  h+='<div class="card" style="margin-bottom:16px;"><div class="card-body" style="overflow-x:auto;"><table class="res-table"><thead><tr><th>#</th><th>Exercise</th><th>Type</th><th>Result</th><th>Credit</th></tr></thead><tbody>';
  EX.forEach(function(ex,i){
    var a=S.answers[i]; var chip,cls;
    if(a&&a.answered){
      if(a.credit>=0.999){chip='\u2713 Correct';cls='it-c';}
      else if(a.credit>0){chip='\u2713 Partially correct';cls='it-m';}
      else {chip='\u2717 Incorrect';cls='it-w';}
    } else {chip='\u26A0 Skipped';cls='';}
    h+='<tr><td>'+(i+1)+'</td><td class="mono">'+esc(ex.id)+'</td><td>'+ex.type.toUpperCase()+'</td><td class="'+cls+'">'+chip+'</td><td class="mono">'+(a&&a.answered?a.credit.toFixed(2):'\u2014')+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  h+='<div class="action-row"><button class="btn btn-primary" id="btn-retake">\u21BB Retake exam</button></div>';
  $('view-results').innerHTML=h;
  var pctEl=$('res-pct'); var target=posted.percent;
  if(REDUCED){ pctEl.textContent=target+'%'; }
  else{
    var t0=performance.now(), dur=700;
    var step=function(ts){ var p=Math.min(1,(ts-t0)/dur);
      pctEl.textContent=Math.round(target*(0.5-0.5*Math.cos(Math.PI*p)))+'%';
      if(p<1) requestAnimationFrame(step); else pctEl.textContent=target+'%'; };
    requestAnimationFrame(step);
  }
  $('btn-retake').addEventListener('click', retake);
  var banner=document.querySelector('.res-banner'); if(banner&&!REDUCED) banner.classList.add('pulse-ok');
}
function retake(){
  S={view:'intro',idx:0,checked:false,reviewMode:false,reviewFrom:null,answers:{},skipped:[],hintUsed:{},
     posted:false,finished:false,timeExpired:false,handshake:S.handshake,wallStart:0,wallEnd:0,score:0};
  T.remaining=BUDGET; T.state='RUNNING'; T.enterTs=0;
  T.accum={'PAUSED_MANUAL':0,'PAUSED_AUTO_CHECK':0}; T.counts={'PAUSED_MANUAL':0,'PAUSED_AUTO_CHECK':0};
  stopTick(); gotoView('intro');
}

/* ---------- header buttons ---------- */
document.addEventListener('DOMContentLoaded', function(){
  renderIntro(); show('view-intro');
  $('tb-sev').outerHTML='<span class="badge badge-'+META.difficulty+'" id="tb-sev" data-sev-badge>'+esc(META.severityLabel)+'</span>';
  $('tb-hint').addEventListener('click', onHint);
  $('tb-skip').addEventListener('click', onSkip);
  $('tb-pause').addEventListener('click', onPause);
  renderTimer();
});
/* integration handshake: CYBERPULSE_INIT / CYBERMASTERY_INIT are accepted; the file stays dark-only */
window.addEventListener('message', function(ev){
  var d=ev&&ev.data;
  if(d&&typeof d==='object'&&(d.type==='CYBERPULSE_INIT'||d.type==='CYBERMASTERY_INIT')){
    S.handshake=true; /* theme field intentionally ignored: this file is dark-only */
  }
});
