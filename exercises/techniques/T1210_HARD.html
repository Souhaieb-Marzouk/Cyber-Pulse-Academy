<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>T1210 — HARD practice exam</title>
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<script type="application/json" id="cm-exercise-meta">
{
  "topicId": "t1210",
  "batch": 3,
  "title": "T1210 Exploitation of Remote Services — HARD",
  "difficulty": "hard",
  "questionCount": 15,
  "estimatedMinutes": 38,
  "passMark": 70
}
</script>
<style>
:root{
  --bg-page:#0b1020;
  --bg-surface:#121a2e;
  --bg-surface-2:#0f1729;
  --border:#243049;
  --border-strong:#33415f;
  --border-faint:#3a4a6e;
  --text-primary:#e6ecff;
  --text-secondary:#a9b4d0;
  --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff;
  --accent-amber:#ffb454;
  --accent-green:#57d38c;
  --accent-green-hover:#6fdda0;
  --accent-amber-hover:#ffc477;
  --state-correct:#57d38c;
  --state-partial:#ffb454;
  --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0;
  --state-paused:#9d7bff;
  --sev-easy:#57d38c;
  --sev-medium:#ffb454;
  --sev-hard:#ff8a3d;
  --sev-extreme:#ff6b6b;
  /* derived tints — every derived colour is defined here, once */
  --bg-inset:#0c1222;
  --bg-option:#0e1628;
  --bg-option-hover:#141d33;
  --bg-option-selected:#102419;
  --bg-btn-hover:#182238;
  --bg-seg:#1a2440;
  --bg-terminal:#080d1a;
  --bg-term-row:#0a1020;
  --bg-header-veil:rgba(11,16,32,.96);
  --overlay:rgba(11,16,32,.97);
  --accent-blue-tint:rgba(90,169,255,.08);
  --accent-blue-tint-soft:rgba(90,169,255,.05);
  --accent-amber-tint:rgba(255,180,84,.08);
  --accent-green-tint:rgba(87,211,140,.08);
  --correct-tint:rgba(87,211,140,.07);
  --incorrect-tint:rgba(255,107,107,.06);
  --correct-glow:rgba(87,211,140,.18);
  --veil-strong:rgba(255,255,255,.14);
  --veil-faint:rgba(255,255,255,.02);
  --shadow-card:0 6px 18px rgba(0,0,0,.35);
  --hl-time:#9fb6e8;
  --on-easy:#08120b;
  --on-medium:#1d1204;
  --on-hard:#190b03;
  --on-extreme:#1d0505;
  --on-green:#08120b;
  --on-amber:#1d1204;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{color-scheme:dark;background:var(--bg-page);}
body{
  background:var(--bg-page);
  color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.55;
  min-height:100vh;
}
.mono,.mono-inline,code,kbd,pre,.log-line,.term-input,.term-line{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;
}
.mono-inline{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:4px;padding:0 5px;color:var(--text-mono);font-size:.92em;}
button{font:inherit;color:inherit;cursor:pointer;}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:6px;}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px;}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-card);}
.muted{color:var(--text-secondary);}
.small{font-size:13.5px;}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;letter-spacing:.4px;border:1px solid transparent;min-height:28px;}
.sev-easy{color:var(--on-easy);background:var(--sev-easy);border-color:var(--sev-easy);}
.sev-medium{color:var(--on-medium);background:var(--sev-medium);border-color:var(--sev-medium);}
.sev-hard{color:var(--on-hard);background:var(--sev-hard);border-color:var(--sev-hard);}
.sev-extreme{color:var(--on-extreme);background:var(--sev-extreme);border-color:var(--sev-extreme);}
.state-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;border:1px solid var(--border);background:var(--bg-surface-2);}
.st-correct{color:var(--state-correct);border-color:var(--state-correct);}
.st-partial{color:var(--state-partial);border-color:var(--state-partial);}
.st-incorrect{color:var(--state-incorrect);border-color:var(--state-incorrect);}
.st-skipped{color:var(--state-skipped);}
.st-paused{color:var(--state-paused);border-color:var(--state-paused);}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-primary);padding:10px 18px;min-height:44px;font-weight:600;transition:background .15s ease,border-color .15s ease,transform .05s ease;}
.btn:hover{background:var(--bg-btn-hover);border-color:var(--border-strong);}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn-primary{background:var(--accent-green);border-color:var(--accent-green);color:var(--on-green);}
.btn-primary:hover{background:var(--accent-green-hover);border-color:var(--accent-green-hover);}
.btn-amber{background:var(--accent-amber);border-color:var(--accent-amber);color:var(--on-amber);}
.btn-amber:hover{background:var(--accent-amber-hover);border-color:var(--accent-amber-hover);}
.btn-ghost{background:transparent;}
.btn-danger{border-color:var(--state-incorrect);color:var(--state-incorrect);background:transparent;}

/* ---------- intro ---------- */
.intro-hero{padding:22px 22px 18px;}
.intro-hero h1{margin:0 0 6px;font-size:24px;line-height:1.25;}
.intro-facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.fact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13.5px;color:var(--text-secondary);}
.fact b{color:var(--text-primary);}
.section-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin:26px 0 10px;color:var(--text-primary);}
.section-title .dot{width:10px;height:10px;border-radius:3px;background:var(--accent-blue);display:inline-block;}
.section-body{padding:18px 20px;}
.section-body p{margin:0 0 12px;}
.theme-panel{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin-bottom:12px;}
.theme-panel h4{margin:0 0 8px;font-size:14px;color:var(--accent-blue);text-transform:uppercase;letter-spacing:.6px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:var(--bg-inset);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--text-primary);}
.rules{margin:0;padding-left:20px;}
.rules li{margin-bottom:9px;}
.type-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px;}
.start-row{display:flex;justify-content:center;padding:6px 0 20px;}
.start-btn{font-size:18px;padding:14px 44px;border-radius:10px;}

/* ---------- sticky header ---------- */
.exam-header{position:sticky;top:0;z-index:50;background:var(--bg-header-veil);border-bottom:1px solid var(--border);backdrop-filter:blur(6px);}
.exam-header-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
.hd-count{font-weight:800;font-size:15px;white-space:nowrap;}
.hd-timer{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:6px 12px;font-weight:700;}
.hd-timer .t{font-variant-numeric:tabular-nums;letter-spacing:1px;}
.hd-score{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:6px 12px;font-weight:700;}
.hd-score .s{color:var(--accent-green);font-variant-numeric:tabular-nums;}
.spacer{flex:1 1 auto;}
.hd-btns{display:flex;gap:8px;flex-wrap:wrap;}
.btn-slim{padding:6px 12px;min-height:44px;font-size:13.5px;}

/* ---------- progress ---------- */
.progress{max-width:980px;margin:0 auto;padding:0 16px 8px;}
.progress-bar{display:flex;gap:3px;height:8px;border-radius:6px;overflow:hidden;background:var(--bg-surface-2);position:relative;}
.seg{flex:1 1 0;background:var(--bg-seg);border-radius:2px;min-width:6px;transition:background .3s ease;}
.seg.ok{background:var(--state-correct);}
.seg.partial{background:var(--state-partial);}
.seg.bad{background:var(--state-incorrect);}
.seg.skipped{background:var(--state-skipped);opacity:.55;}
.seg.cur{background:var(--sev-color,var(--accent-blue));box-shadow:0 0 8px var(--sev-color,var(--accent-blue));}
.progress-bar::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,var(--veil-strong) 50%,transparent 80%);transform:translateX(-100%);animation:sheen 3.2s ease-in-out infinite;pointer-events:none;}
@keyframes sheen{0%{transform:translateX(-100%);}55%{transform:translateX(100%);}100%{transform:translateX(100%);}}

/* ---------- exercise blocks ---------- */
.ex-meta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 4px;}
.block{margin-top:16px;border:1px solid var(--border);border-radius:10px;background:var(--bg-surface);overflow:hidden;}
.block-h{display:flex;align-items:center;gap:10px;padding:9px 14px;font-weight:800;font-size:13.5px;letter-spacing:1.2px;border-bottom:1px solid var(--border);}
.block-h .ic{font-size:15px;}
.bl-scenario .block-h{color:var(--accent-blue);background:var(--accent-blue-tint);}
.bl-question .block-h{color:var(--accent-amber);background:var(--accent-amber-tint);}
.bl-answer .block-h{color:var(--accent-green);background:var(--accent-green-tint);}
.bl-feedback .block-h{background:var(--veil-faint);}
.block-b{padding:14px 16px;}
.block-b p{margin:0 0 10px;}
.collapse-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text-secondary);border-radius:6px;padding:3px 10px;font-size:12px;min-height:36px;}
.summary-line{padding:9px 14px;font-size:13px;color:var(--text-secondary);border-bottom:1px dashed var(--border);}
.artefact{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);margin:10px 0;overflow:hidden;}
.artefact-h{padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--accent-blue);border-bottom:1px solid var(--border);background:var(--accent-blue-tint-soft);}
.artefact .prose{padding:10px 14px;font-size:14.5px;}
.codeblock{margin:0;padding:10px 12px;overflow-x:auto;white-space:pre;}
.log-line{font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--text-mono);}
.hl-t{color:var(--hl-time);}
.hl-ioc{color:var(--accent-amber);}
.hl-bad{color:var(--state-incorrect);font-weight:700;}
.hl-warn{color:var(--state-partial);}
.hl-cmd{color:var(--accent-green);font-weight:700;}
.hl-flag{color:var(--state-paused);}
.hl-str{color:var(--text-mono);}
.hl-path{color:var(--accent-blue);}
.log-toolbar{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg-surface-2);}
.log-filter{flex:1;background:var(--bg-inset);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);padding:7px 10px;font-size:13.5px;min-height:44px;}
.log-count{font-size:12px;color:var(--text-secondary);white-space:nowrap;}
.log-body{max-height:340px;overflow-y:auto;padding:8px 12px;}
.log-body::-webkit-scrollbar{width:10px;}
.log-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
.log-body::-webkit-scrollbar-track{background:var(--bg-surface-2);}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--bg-option);border:1px solid var(--border);border-radius:8px;padding:12px 14px;min-height:48px;color:var(--text-primary);transition:background .12s ease,border-color .12s ease;}
.opt:hover{background:var(--bg-option-hover);}
.opt .letter{font-weight:800;color:var(--text-secondary);flex:0 0 auto;}
.opt.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset,0 0 10px var(--correct-glow);background:var(--bg-option-selected);}
.opt.selected .sel-mark{color:var(--accent-green);}
.opt.disabled{opacity:.75;cursor:default;}
.sel-mark{margin-left:auto;font-size:12px;font-weight:800;color:var(--text-secondary);white-space:nowrap;}

/* ---------- drag & drop ---------- */
.dd-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:720px){.dd-grid{grid-template-columns:1fr 1fr;}}
.bank{border:1px dashed var(--border-strong);border-radius:8px;padding:10px;min-height:56px;display:flex;flex-wrap:wrap;gap:8px;background:var(--bg-inset);}
.dchip{background:var(--bg-option-hover);border:1px solid var(--border-strong);border-radius:8px;padding:8px 12px;font-size:13.5px;min-height:44px;color:var(--text-primary);}
.dchip.grab{cursor:grab;}
.dchip.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.zone{border:1px solid var(--border);border-radius:8px;background:var(--bg-option);padding:10px;min-height:96px;}
.zone.over{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.zone h5{margin:0 0 8px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-secondary);}
.zone-items{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;}
.bank-label{font-size:12.5px;font-weight:700;letter-spacing:.6px;color:var(--text-secondary);margin:0 0 6px;text-transform:uppercase;}

/* ---------- order ---------- */
.ord-list{display:flex;flex-direction:column;gap:8px;}
.ord-row{display:flex;align-items:center;gap:10px;background:var(--bg-option);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
.ord-pos{flex:0 0 30px;text-align:center;font-weight:800;color:var(--text-secondary);}
.ord-text{flex:1;font-size:14.5px;}
.ord-btns{display:flex;gap:4px;}
.ord-btns button{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;width:44px;height:44px;font-size:14px;}
.ord-row.dragging{opacity:.4;}
.ord-row .handle{cursor:grab;color:var(--text-secondary);font-size:15px;}

/* ---------- match ---------- */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:620px){.match-grid{grid-template-columns:1fr;}}
.match-col{display:flex;flex-direction:column;gap:8px;}
.mitem{background:var(--bg-option);border:1px solid var(--border);border-radius:8px;padding:10px 12px;text-align:left;min-height:46px;color:var(--text-primary);}
.mitem.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.mitem.used{opacity:.4;pointer-events:none;}
.pairs-list{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
.pair-row{display:flex;align-items:center;gap:8px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13.5px;}
.pair-row .x{margin-left:auto;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--state-incorrect);width:44px;height:44px;min-width:44px;}

/* ---------- fill blank ---------- */
.fb-sentence{font-size:16px;line-height:2;word-break:break-word;}
.blank-btn{display:inline-block;min-width:90px;min-height:44px;background:var(--bg-inset);border:1px dashed var(--border-faint);border-radius:6px;color:var(--text-mono);padding:2px 10px;text-align:center;}
.blank-btn.filled{border-style:solid;border-color:var(--accent-green);color:var(--accent-green);}
.blank-btn.selected{border-color:var(--accent-amber);box-shadow:0 0 0 1px var(--accent-amber) inset;}

/* ---------- terminal ---------- */
.term{background:var(--bg-terminal);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.term-bar{display:flex;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--border);background:var(--bg-surface-2);font-size:12px;color:var(--text-secondary);}
.term-dot{width:10px;height:10px;border-radius:50%;background:var(--border);display:inline-block;}
.term-scroll{max-height:260px;overflow-y:auto;padding:10px 12px;font-size:13.5px;}
.term-line{white-space:pre-wrap;word-break:break-word;color:var(--text-mono);line-height:1.6;}
.term-prompt{color:var(--accent-green);font-weight:700;}
.term-err{color:var(--state-incorrect);}
.term-ok{color:var(--state-correct);}
.term-input-row{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);padding:9px 12px;background:var(--bg-term-row);}
.term-input{flex:1;background:transparent;border:none;color:var(--text-mono);font-size:14px;min-height:44px;}
.term-input:focus{outline:none;}
.syntax-panel{border:1px solid var(--border);border-left:3px solid var(--accent-blue);border-radius:8px;background:var(--bg-surface-2);padding:10px 14px;margin-top:10px;font-size:13.5px;}
.syntax-panel h6{margin:0 0 6px;color:var(--accent-blue);font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;}

/* ---------- branching ---------- */
.step-badge{display:inline-flex;align-items:center;gap:8px;background:var(--bg-surface-2);border:1px solid var(--border);color:var(--accent-amber);border-radius:999px;padding:3px 12px;font-weight:800;font-size:12.5px;letter-spacing:.8px;margin-bottom:10px;}
.step-verdict{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);font-size:14px;}
.step-actions{display:flex;gap:10px;margin-top:12px;}

/* ---------- feedback ---------- */
.fb-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;}
.fb-title{font-size:16px;font-weight:800;}
.fb-credit{font-size:14px;font-weight:700;color:var(--state-partial);}
.item-rows{margin:12px 0;display:flex;flex-direction:column;gap:6px;}
.item-row{display:flex;align-items:flex-start;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;}
.item-row .mk{flex:0 0 auto;font-weight:800;}
.mk-c{color:var(--state-correct);}
.mk-w{color:var(--state-incorrect);}
.mk-m{color:var(--state-skipped);}
.persp{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px;}
@media(min-width:720px){.persp{grid-template-columns:1fr 1fr;}}
.persp .p-card{border:1px solid var(--border);border-radius:8px;padding:10px 14px;background:var(--bg-surface-2);font-size:14px;}
.persp .p-card h6{margin:0 0 6px;font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;}
.p-card.red h6{color:var(--state-incorrect);}
.p-card.blue h6{color:var(--accent-blue);}
.study-tip{margin-top:12px;border:1px solid var(--border);border-left:3px solid var(--accent-amber);border-radius:8px;background:var(--bg-surface-2);padding:9px 12px;font-size:14px;color:var(--text-primary);}
.canon{margin-top:12px;}
.canon h6{margin:0 0 6px;font-size:12.5px;letter-spacing:.8px;color:var(--accent-green);text-transform:uppercase;}
.canon pre{background:var(--bg-terminal);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text-mono);font-size:14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;}
.canon ul{margin:6px 0 0;padding-left:20px;color:var(--text-secondary);font-size:13.5px;}
.canon li{margin-bottom:4px;}

/* ---------- review / results ---------- */
.review-list{display:flex;flex-direction:column;gap:10px;}
.review-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 14px;}
.review-row .q{flex:1;min-width:200px;font-size:14.5px;}
.result-hero{padding:26px 22px;text-align:center;}
.result-pct{font-size:52px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
.pass-panel{border:2px solid var(--state-correct);background:var(--correct-tint);}
.fail-panel{border:2px solid var(--state-incorrect);background:var(--incorrect-tint);}
.res-break{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px;}
@media(min-width:640px){.res-break{grid-template-columns:1fr 1fr;}}
.res-cell{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;font-size:14.5px;}
.res-cell b{font-size:22px;font-variant-numeric:tabular-nums;}
.paused-overlay{position:fixed;inset:0;z-index:100;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:20px;}
.paused-card{max-width:460px;width:100%;text-align:center;padding:30px 24px;border-color:var(--state-paused);}
.paused-card .big{font-size:44px;color:var(--state-paused);}
.hidden{display:none !important;}

<script>
"use strict";
var EXAM = {"meta":{"topicId":"t1210","batch":3,"title":"T1210 Exploitation of Remote Services — HARD","difficulty":"hard","questionCount":15,"estimatedMinutes":38,"passMark":70,"mitreId":"T1210","mitreName":"Exploitation of Remote Services","objectType":"Technique","severityLabel":"HARD","partLabel":null},"intro":{"learn":["**T1210** covers adversaries who exploit a vulnerability in a network service to move between systems **without valid credentials**: the EternalBlue SMB bug that drove WannaCry and NotPetya, RDP BlueKeep, Print Spooler PrintNightmare, Exchange ProxyLogon-class bugs, and abuse of WinRM.","Both exams of this topic are set at **Solvia Bank**, a fictional retail bank in the middle of a core-network crisis: a quarter-end batch freeze, an unpatchable legacy ATM host (`slv-atm-legacy-9`) on a flat network, and a self-propagating worm-style incident under ticket **SLV-3301**.","You will learn to separate real exploitation from noisy look-alikes: crash loops caused by a buggy driver update, `psexec` runs launched through the service control manager, and quiet exploits that never crash anything and never trip a signature.","You will also weigh defender choices: subnet isolation versus a global reboot, virtual patching for hosts that cannot be patched, M1050 exploit protection versus signature-only reliance, and the M1016 scanning cadence that keeps findings fresh."],"keywords":[{"theme":"Detection engineering for T1210","items":["impossible parent-child analytic (spoolsv.exe -> cmd.exe)","parent image and process lineage fields","baseline of approved admin tooling","false-positive tuning for psexec and SCM starts"]},{"theme":"Worm-style propagation","items":["scan-then-exploit chain: probe, fingerprint, exploit, payload","self-propagating worm pattern (WannaCry/NotPetya class)","service crash and restart correlation","exploit-framework indicators (random service names, ADMIN$ drops)"]},{"theme":"Containment judgement","items":["least aggressive action first","subnet isolation versus global reboot","emergency patching trade-offs under a change freeze","alarming-but-benign versus benign-but-alarming signals"]},{"theme":"Mitigation depth","items":["M1050 exploit protection versus signature-only reliance","M1016 vulnerability scanning cadence","virtual patching (IPS) for unpatchable hosts","segmentation of flat legacy networks","coverage-gap reasoning"]}],"types":["Multiple choice","Log analysis","Drag & drop","Timeline ordering","Matching","Fill in the blank","Branching scenario"]},"exercises":[{"id":"e01","type":"log-qcm","scenario":{"text":["02:14, Saturday morning. Solvia Bank's perimeter IDS starts firing on the flat core network. Duty analyst **n.fabbri** opens ticket **SLV-3301**. The quarter-end batch freeze forbids reboots and service changes until Monday 04:00, so the team must read the chain precisely before proposing anything.","The viewer below merges core firewall sweep records with Suricata alerts from the same window. One line marks the exact moment the traffic stopped being reconnaissance and became exploitation."],"artefacts":[{"label":"Ticket SLV-3301 — opening note","text":"n.fabbri 02:20: IDS firing on the core; the source 10[.]20[.]4[.]51 is INTERNAL (slv-app-07), so a foothold already exists. Freeze until Monday 04:00. Do not reboot anything; the batch is live."}]},"log":{"title":"Core firewall + Suricata — 02:14–02:16 — ticket SLV-3301","lines":["02:14:03 fw TCP 10[.]20[.]4[.]51:51980 -> 10[.]20[.]4[.]0/24:445 SYN sweep 22 dst in 40s (17 denied)","02:14:29 suricata ET SCAN SMB negotiate probe native_os=Windows 6.1 src=10[.]20[.]4[.]51","02:15:12 suricata ET EXPLOIT MS17-010 Trans2 peeknamedpipe reply STATUS_OBJECT_NAME_NOT_FOUND dst=10[.]20[.]4[.]77","02:15:19 suricata ET EXPLOIT MS17-010 session setup with unusual trans2 secondary (eternal-class) dst=10[.]20[.]4[.]77","02:15:26 fw 10[.]20[.]4[.]51 -> 10[.]20[.]4[.]77 (slv-fs-03):445 established; ADMIN$ tree connect","02:15:31 edr slv-fs-03: SCM registered new service MSSECsvc, binary C:\\Windows\\mssecsvc.exe","02:15:47 edr slv-fs-03: mssecsvc.exe opens TCP 445 listener and starts SYN sweeps across 10[.]20[.]4[.]0/24","02:16:02 suricata ET SCAN SMB negotiate probe native_os=Windows 6.1 src=10[.]20[.]4[.]77"]},"question":"Which line proves the source moved from probing to actually exploiting the service?","answer":{"options":["SMB negotiate probe with native_os=Windows 6.1 from 10[.]20[.]4[.]51","MS17-010 session setup with unusual trans2 secondary to 10[.]20[.]4[.]77","SYN sweep of 22 hosts on port 445 in 40 seconds","ADMIN$ tree connect after the session was established"],"correct":1},"hint":"The fingerprint reply only tells the attacker the bug exists; something later proves it was used.","explanation":["The SYN sweep and the negotiate probe are **reconnaissance**: the attacker is finding live SMB services. The Trans2 peeknamedpipe reply is the **fingerprint check** — it confirms the host looks vulnerable but corrupts nothing.","The **trans2 secondary session setup** is the memory-corruption exploit itself: that is the moment T1210 happens. The ADMIN$ tree connect is post-exploit access — a real consequence and defensible in other contexts, but it is not the exploit moment.","The source is internal, so this is **Lateral Movement (T1210)**, not initial access: some earlier foothold on slv-app-07 is now propagating like a WannaCry-class worm."],"perspectives":{"attacker":"Fingerprinting picks the exploit module; the worm then reuses the same service to scan again from the victim.","defender":"Map each alert class to a chain stage — a stage-2 hit is recon, a trans2 exploit hit plus a new service is compromise."},"study":"Compare ET SCAN versus ET EXPLOIT rule classes for MS17-010 and what each one alone proves."},{"id":"e02","type":"qcm-single","scenario":{"text":["09:10, ticket SLV-3301. The service console shows `spoolsv.exe` on `slv-app-07` terminated and restarted **four times since 06:00**. The application log shows a faulting module `hpcu255u.dll` right after last night's approved printer-driver rollout (change SLV-3279). EDR shows **no child processes** from `spoolsv.exe`, no outbound connections from the service, and no IDS hits for the host.","PrintNightmare-class exploitation is on this quarter's watchlist, and the shift lead wants a triage call now."]},"question":"What is the most defensible triage call?","answer":{"options":["Confirmed PrintNightmare exploitation — isolate the host immediately","Likely driver-update regression causing the crash loop; no exploitation indicators are present","Unconfirmed — schedule a full spooler rebuild tonight to be safe","Disk corruption — escalate to the platform team"],"correct":1},"hint":"Nothing but the spooler process itself is misbehaving — ask what an exploitation would have to leave behind.","explanation":["The crash loop correlates exactly with the **approved driver change**, and the faulting module is that driver. This is the alarming-but-benign trap: a crashing service *looks* like exploitation.","Exploiting the spooler leaves a service-context child process or an altered driver/binary path — none of that exists here. Isolation would burn the freeze window for a false alarm, and a rebuild fixes nothing.","Call it a suspected regression, open a defect against change SLV-3279, and keep the parent-child analytic running in case the picture changes."],"study":"Correlate service crash events with child processes and change records before calling an exploit."},{"id":"e03","type":"dragdrop","scenario":{"text":["Detection engineering working group, SLV-3301 follow-up. Solvia's analytic `SVC-CHILD-001` alerts when a service process spawns a shell. The group must decide which evidence strengthens a true-exploitation call and which evidence supports a benign explanation, so the rule survives `psexec` and service-control-manager noise.","The analytic keys on the **parent image** field and compares against an **approval baseline** (ticketed admins, management VLAN sources, change calendar).","Last night the rule paged on a ticketed `psexec` run — exactly the noise class the baseline exists to absorb, and exactly the repeat page the SOC lead does not want."],"artefacts":[{"label":"Baseline extract — SVC-CHILD-001 tuning pack","text":"Approved: ticketed psexec from management VLAN 10[.]20[.]6[.]0/24 via bastion slv-jump-01 (s.keller, r.elbaz, svc-deploy). Approved changes this week: SLV-3279, SLV-3261. Any other spawn from a service context is unexplained."}]},"question":"Drag each observation into the correct zone.","answer":{"zones":[{"name":"Supports true exploitation"},{"name":"Supports benign admin activity"}],"items":[{"text":"spoolsv.exe spawned cmd.exe /c whoami on a host with no approved change","zone":0},{"text":"spoolsv.exe spawned powershell with -enc from a non-management subnet","zone":0},{"text":"psexec.exe -s \\\\slv-fs-03 cmd.exe run by s.keller with a valid ticket from the management VLAN","zone":1},{"text":"services.exe started spoolsv.exe at boot, matching the AUTO_START baseline","zone":1},{"text":"SCM log shows a service start by the print-management console inside a change window","zone":1},{"text":"cmd.exe child of spoolsv.exe wrote to the ADMIN$ pipe toward slv-core-db-01","zone":0}]},"hint":"Ask who is allowed to drive a service context, from where, and with what approval.","explanation":["True-exploitation evidence: a **service context spawning an interpreter** with no approved change, from a **non-management zone**, followed by lateral **ADMIN$** writes. The parent-child pair (spoolsv.exe -> cmd.exe) is 'impossible' in normal operation.","Benign evidence: ticketed `psexec` runs from the management VLAN, baseline SCM starts at boot, and starts inside change windows. `psexec` *legitimately* creates service-context processes, which is exactly the false-positive class the baseline must absorb.","Tuning rule: key the alert on parent image plus child class, then suppress only when the approval baseline matches — never suppress the parent-child pattern itself."],"study":"Read the Data Sources table on the T1210 ATT&CK page: process, service metadata, network traffic, application log."},{"id":"e04","type":"order","scenario":{"text":["For the SLV-3301 incident note, the lead wants the attacker chain written as canonical stages so junior analysts can map every alert to a stage.","The map also has to show where containment can cut the chain cheapest, because the change board will read it before approving anything."],"artefacts":[{"label":"Ticket SLV-3301 — note request","text":"n.fabbri: the board asked how one IDS hit becomes a worm overnight. Write the chain so each stage names its sensor and its cheapest containment lever."}]},"question":"Order the chain stages from first to last.","answer":{"mode":"timeline","items":["SMB port sweep across the core subnet (TCP 445)","SMB negotiate and Trans2 fingerprint of the service","Memory-corruption exploit against the SMB server","Payload service registered and ADMIN$ share used","Interpreter spawned in service context; worm scans again"]},"hint":"You cannot fingerprint a port you have not found, and no shell spawns before the payload lands.","explanation":["The canonical scan-then-exploit chain: **recon (port sweep) -> fingerprint (negotiate/Trans2) -> exploit (memory corruption) -> payload (service registration, ADMIN$) -> propagation (interpreter in service context, new scans)**.","Each stage has a different data source: network traffic for the first three, service metadata for the payload, process telemetry for the spawn. If an alert does not fit a stage, it is either noise or a second chain.","The last stage is what makes this a worm: the victim itself starts scanning on 445, so a single missed containment step multiplies the incident."],"perspectives":{"attacker":"No fingerprint means no module selection; a worm automates the whole chain host by host.","defender":"Filtering 445 between tiers breaks the chain at stage 1, which is why it is the first containment lever."},"study":"Practise mapping IDS rule names to kill-chain stages until it is reflexive."},{"id":"e05","type":"fillblank","scenario":{"text":["Write the containment paragraph for ticket SLV-3301. The worm reached the flat core segment; `slv-atm-legacy-9` runs a vendor-certified ATM OS that **cannot be patched** before the quarter-end window.","Finance has signed one constraint: the ATM service stays up while the risk is held."],"artefacts":[{"label":"Vendor letter — extract","text":"slv-atm-legacy-9 may run only the certified ATM OS build. Agents, hotfixes, or configuration changes void support. Earliest certified change window: Q3."}]},"question":"Complete the paragraph with words from the bank.","answer":{"template":"The worm scans TCP ___ to find SMB services, so the core firewall now denies that port between tiers; because the ATM host cannot be patched, the team applies an ___ rule at the segment boundary that drops the exploit pattern while the service stays online.","blanks":["445","IPS"],"bank":["445","3389","5985","IPS","EDR agent","AV quarantine"]},"hint":"One blank is the SMB port; the other term means stopping exploit traffic in the network without touching the host.","explanation":["SMB runs on **TCP 445** — that is the worm's only vector in this scenario. 3389 is RDP and 5985 is WinRM: both are T1210 paths, but not this worm's.","**Virtual patching** with an IPS rule blocks the exploit pattern at the boundary — the standard compensating control for hosts that cannot be patched. An EDR agent cannot be installed on the certified ATM OS, and AV quarantine would not stop network exploitation.","The paragraph makes the trade-off explicit: the service stays online and the business keeps running while the risk is held at the segment edge."],"study":"Review virtual patching practice and M1037 (filter network traffic) for unpatchable estates."},{"id":"e06","type":"log-qcm","scenario":{"text":["09:40. The IDS is completely silent for `slv-core-db-01` — no exploit signatures at all. But service metadata collected for SLV-3301 shows something the signature set never looks for, and the EDR agent on this host only records process events (known gap, tracked as SLV-3310).","The shift lead calls it 'the quietest host in the bank'. Decide whether that quiet is safety, using the merged SCM and EDR view below."],"artefacts":[{"label":"Ticket SLV-3301 — gap note","text":"EDR on slv-core-db-01 has no service-creation module (SLV-3310). The signature set covers known EternalBlue variants only; unknown payloads are expected to pass unseen."},{"label":"Shift log — 09:38","text":"IDS clean for this host all night. No crash events. No failed logons. n.fabbri: 'Either it is fine, or it is the one we should worry about.'"}]},"log":{"title":"slv-core-db-01 — SCM + EDR merged, 08:55–09:31","lines":["08:55:12 SCM Event 7045 service installed: name SVCH0ST-PRX, path %COMSPEC% /d /c C:\\Windows\\Temp\\win1ogon.exe","08:55:12 SCM Event 7045 start type auto, account LocalSystem","09:00:41 edr win1ogon.exe -> cmd.exe /c systeminfo && net group \"domain admins\" /domain","09:01:17 edr win1ogon.exe exited, cmd.exe exited, no errors","09:05:30 SCM spoolsv started normally (AUTO_START baseline)","09:12:44 fw 10[.]20[.]4[.]77 -> 10[.]20[.]8[.]15:445 established (slv-fs-03 -> slv-core-db-01)","09:13:02 suricata: no rules matched this flow (clean)","09:31:00 backup job on slv-vcenter completed as planned (change SLV-3261)"]},"question":"Which line is the quiet exploitation signal that the signature set missed?","answer":{"options":["Service SVCH0ST-PRX installed with a binary path in Temp, LocalSystem, auto start","spoolsv started normally per the AUTO_START baseline","The backup job completed as planned under change SLV-3261","Suricata matched no rules on the 09:12 flow"],"correct":0},"hint":"Event 7045 is written by the machine itself — no attacker noise is needed to hide it.","explanation":["This is the benign-but-alarming trap: **no crash, no signature, no failed logins** — yet SCM Event 7045 recorded a new auto-start service whose binary sits in Temp under a homoglyph name (`win1ogon.exe`, digit 1). That is the classic exploit-framework payload footprint.","The child `cmd.exe` doing domain reconnaissance confirms the payload ran. The spoolsv start, the backup job, and the 'no rules matched' line are the noise and the gap — 'clean IDS' is the **absence of a sensor answer**, not an all-clear.","Signature-only reliance fails on quiet variants; the durable detections here are service metadata (7045 with Temp/homoglyph paths) plus the process tree."],"perspectives":{"attacker":"A new auto-start LocalSystem service is a cheap foothold that survives reboots and never crashes anything.","defender":"Alert on 7045 with Temp or homoglyph binary paths regardless of IDS state — the machine tells on itself."},"study":"SCM Event 7045 hunting: new services, binary paths, and service name look-alikes."},{"id":"e07","type":"qcm-multi","scenario":{"text":["CISO **l.sandoval** asks for the SLV-3301 control-gap picture before the emergency change board. The register below is the official source; her question is what it does **not** answer.","Two near-miss statements in the options describe controls that are real and useful — they simply answer different questions than the ones she asked."],"artefacts":[{"label":"Control register — extract","text":"EDR on all servers. Perimeter IDS signatures current. Quarterly M1016 vulnerability scans. SMB signing enforced. TCP 445 denied between VLAN tiers. All servers patched except the ATM segment (virtual patch rule in front of it)."}]},"question":"Select every statement that names a real remaining T1210 gap.","answer":{"options":["WinRM 5985 is open inside every tier and uninspected — a T1210 path with no compensating control","Legacy RDP 3389 on the flat segment has no NLA enforcement and no IPS rule — a BlueKeep-class path","The quarterly scan cadence leaves months of blind time between findings","EDR on the servers closes all T1210 paths on those servers","SMB signing stops the EternalBlue-class exploit on port 445"],"correct":[0,1,2]},"hint":"For each path ask: is it filtered, inspected, scanned recently, or protected by more than a signature?","explanation":["Real gaps: **WinRM 5985** inside the tiers is an open exploitation path; **legacy 3389 without NLA** is the BlueKeep-class path on the same flat network; and **quarterly scanning** means findings are months stale exactly when a worm is active.","EDR is a detection layer, not prevention — exploitation still succeeds before an alert fires. SMB signing authenticates the hosts; it does **not** patch memory corruption, so it stops neither EternalBlue nor credential-less exploitation.","The near-misses are attractive because both controls are real and useful — they just answer different questions than the ones the CISO asked."],"study":"Map each control in your register to the exact technique step it blocks; anything unmapped is a gap."},{"id":"e08","type":"match","scenario":{"text":["Detection engineering maps T1210 alerts to the ATT&CK data sources for the Solvia rule catalogue, so every future alert names the sensor it came from.","The SLV-3301 chain touched five sources in one night; the catalogue note explains why the mapping exists at all."],"artefacts":[{"label":"Rule catalogue — header note","text":"Every T1210 rule must declare its ATT&CK data source and its sensor. Rules without a declared source were the SLV-3301 blind spot (tracked as SLV-3310)."}]},"question":"Match each data source to the T1210 evidence it carries.","answer":{"pairs":[{"left":"Application Log","right":"spooler and web service error bursts, faulting modules"},{"left":"Network Traffic","right":"445 sweeps, exploit signatures, unusual ADMIN$ binds"},{"left":"Process","right":"service binary spawning an interpreter child"},{"left":"Service","right":"new service or changed binary path in SCM events"},{"left":"Vulnerability scan","right":"inventory of unpatched services to prioritise"}]},"hint":"One source sees bytes on the wire, one sees process trees, one sees the machine's own service records.","explanation":["T1210's ATT&CK data sources are **Application Log, Network Traffic, Process, and Service**; the scan feed is the fifth, telling you which services are exposed before anyone exploits them.","Matching source to evidence decides which console you query first: crash loops live in application logs, probe bursts and ADMIN$ binds on the wire, parent-child spawns in process telemetry, payload staging in service metadata.","The SLV-3301 chain touched all five — which is why a single-sensor SOC misses half of it."],"study":"T1210 ATT&CK page, Data Sources table — memorise the four core sources."},{"id":"e09","type":"dragdrop","scenario":{"text":["02:30, ticket SLV-3301. Containment proposals are arriving faster than they can be reviewed. The quarter-end batch runs until Monday 04:00, the ATM segment must stay up, and the worm is held only while 445 stays filtered between tiers.","Six proposals are on the bridge call. Sort them before anyone's idea becomes a change request."],"artefacts":[{"label":"Bridge note — 02:31","text":"l.sandoval: reversible and targeted goes now. Anything that costs outage or destroys state needs the change board with evidence attached. The batch and the ATMs are non-negotiable."}]},"question":"Drag each proposal to the correct zone.","answer":{"zones":[{"name":"Do now — low blast radius"},{"name":"Change board only — high impact"}],"items":[{"text":"Deny TCP 445 between VLAN tiers at the core firewall","zone":0},{"text":"Add an IPS virtual patch rule for MS17-010 in front of the ATM segment","zone":0},{"text":"Enable the M1050 exploit-protection baseline on the two jump hosts","zone":0},{"text":"Reboot all 1,400 endpoints tonight during the freeze","zone":1},{"text":"Take the quarter-end batch down to patch slv-core-db-01 immediately","zone":1},{"text":"Stop the Exchange information store to break possible propagation","zone":1}]},"hint":"Ask what each action costs if the suspicion behind it turns out to be wrong.","explanation":["The three 'do now' items are **reversible and targeted**: a 445 filter, a virtual patch in front of one segment, and an exploit-protection baseline on two hosts. Each cuts a T1210 path without touching the batch or the ATMs.","The three board items carry **real cost**: 1,400 reboots destroy volatile evidence and breach the freeze, stopping the batch risks the quarter-end run, and stopping the mail store hits every bank user. None is *forbidden* — each simply needs evidence and sign-off.","This is the least-aggressive-action discipline: narrow first, widen only when the evidence forces it."],"perspectives":{"attacker":"Every hour of debate is an hour of propagation; cheap filters buy that time back.","defender":"Sort containment by blast radius and reversibility before anyone asks 'should we reboot everything'."},"study":"Write a two-tier containment list (reversible vs board-approved) for your own environment."},{"id":"e10","type":"qcm-single","scenario":{"text":["03:00, emergency change board. `slv-core-db-01` runs the vulnerable SMB build; patching takes the core banking batch offline for about three hours. An IPS virtual patch rule and the 445 tier filter are demonstrably holding — no exploit traffic has crossed the boundary for two hours.","CISO l.sandoval: 'Give me the factor that decides the timing, not the politics. One factor, defended in one sentence.'"],"artefacts":[{"label":"Change board agenda — extract","text":"Item 4: patch window for slv-core-db-01. Evidence presented: 445 tier filter active since 02:30; virtual patch rule holding; zero exploit-pattern hits in 120 minutes. Value at risk if the batch stops: the quarter-end run."}]},"question":"Which factor should drive the patch-timing decision?","answer":{"options":["Never patch outside the scheduled Patch Tuesday cycle","Match the timing to the ATM operating system's support status","In-the-wild exploit reliability for this build versus the batch-window cost, while virtual patching holds","Patch immediately; containment evidence can never be trusted"],"correct":2},"hint":"The decision weighs two clocks: the attacker's and the bank's.","explanation":["The defensible factor is the **balance**: how reliably is this build exploited in the wild, what does the batch outage cost, and is the interim control holding? Here the virtual patch and filter demonstrably hold, so a scheduled, guarded patch window is defensible.","'Patch immediately regardless' is correct **when containment is unproven** — it is the right call in a different world, which is what makes it a near-miss here. 'Never outside Patch Tuesday' fails against an active worm; the ATM OS status does not govern the database tier.","Document the balance in the minutes: exploit reliability, interim control evidence, batch cost, and the chosen window."],"study":"Emergency patching governance: risk-based windows with named interim controls."},{"id":"e11","type":"match","scenario":{"text":["The change board asks which control answers which T1210 exposure, so the minutes name a control for every risk accepted. Match them.","The rule from the SLV-3301 review: an exposure paired with a control that answers a different exposure is still an exposure."],"artefacts":[{"label":"Board minutes — request","text":"Action from the SLV-3301 review: every accepted exposure must be paired with the control that answers it. Unpaired exposures go to the risk register with an owner and a date."}]},"question":"Match each exposure to the control that answers it.","answer":{"pairs":[{"left":"Unpatchable ATM OS on the flat segment","right":"IPS virtual patching until segmentation lands"},{"left":"Payload classes that evade signatures","right":"M1050 exploit protection on endpoints"},{"left":"One tier can reach every other tier","right":"Network segmentation with inspected gateways"},{"left":"Findings stale by quarter end","right":"Monthly M1016 scanning with an asset-coverage check"},{"left":"Service admins holding domain-wide rights","right":"M1026 privileged account management"}]},"hint":"Each pair binds an exposure to the control that would have caught or blocked it.","explanation":["Virtual patching protects hosts you cannot patch; **M1050 exploit protection** blocks exploit techniques at the endpoint even when signatures miss; **segmentation** shrinks what one exploited host can reach.","A **monthly M1016 cadence** with a coverage check keeps the asset list honest — quarterly findings age badly during an active campaign. **M1026 privileged account management** limits what a service-context compromise can reach next.","The common failure is pairing an exposure with a control that is real but answers a different exposure — that is how gaps survive audits."],"study":"ATT&CK mitigation list for T1210: M1016, M1026, M1037, M1048, M1050."},{"id":"e12","type":"log-qcm","scenario":{"text":["04:20. `SVC-CHILD-001` fired nine times overnight on `slv-fs-03`, and the on-call wants **one true hit**, not nine pages. Approved admin runs come from the management VLAN through the bastion; the change calendar shows only SLV-3279 (printer driver) and SLV-3261 (backup) this week.","Read the alert context below and separate the false-positive class from the hit."],"artefacts":[{"label":"Ticket SLV-3301 — tuning request","text":"SOC lead: one true hit per page, or the rule gets muted at the next review. Approved changes this week: SLV-3279, SLV-3261. Nothing else is scheduled under the freeze."}]},"log":{"title":"slv-fs-03 — SVC-CHILD-001 alert context, 01:03–01:19","lines":["01:03:11 services.exe -> spoolsv.exe (AUTO_START boot baseline)","01:07:42 psexec.exe -s \\\\slv-fs-03 cmd.exe user=s.keller auth=Kerberos src=10[.]20[.]6[.]10 (mgmt VLAN)","01:07:58 SCM service SLV-CHK started by s.keller (psexec pattern, ticketed)","01:12:09 spoolsv.exe -> powershell.exe -enc SQBFAF (no print activity, reachable from 10[.]20[.]9[.]130, non-mgmt)","01:15:00 spoolsv.exe restart after change SLV-3279 driver install","01:19:33 winrm.exe child of svchost for an admin session from bastion 10[.]20[.]6[.]10"]},"question":"Which line is the genuine exploitation signal the rule should page on?","answer":{"options":["The ticketed psexec run by s.keller from the management VLAN","spoolsv.exe spawning an encoded PowerShell child with no print activity","The spoolsv restart after the approved driver change","The winrm admin session from the bastion host"],"correct":1},"hint":"Approval, source zone, and the parent's normal job are the three filters.","explanation":["The **encoded interpreter child in the spooler context**, outside any change window and reachable from a **non-management zone**, is the hit: the impossible parent-child pair plus two baseline violations.","The `psexec` run and the bastion WinRM session are the legitimate false-positive class — ticketed admins from the management VLAN. They are suppressed by the **baseline**, not by gut feeling. The restart after SLV-3279 is a logged change, not an event.","Tuning rule: suppress on approval + zone, never on the parent-child pattern itself — muting the pattern would have hidden the one true page."],"perspectives":{"attacker":"Spawning from the spooler hides in admin noise; encoded commands keep tired humans asleep.","defender":"Tune suppression on the approval baseline and network zone before you ever tune out service-context spawns."},"study":"Practise writing suppression rules that reference change tickets and VLAN baselines, not event IDs."},{"id":"e13","type":"fillblank","scenario":{"text":["Finish the control-upgrade note for the SLV-3301 review. The board wants the between-cycles story: what blocks exploitation **while** the scanners are not looking.","Two bank words in the bank SCM extract — slv-fs-03","text":"Four Event 7045 entries overnight: 02:20:05 BhZqXk7N; 02:26:01 SLV-BackupAgent; 03:02:44 HPDVCGuard; 03:05:12 WinRM-Config. The 02:26 entry sits inside the SLV-3261 backup window."}]},"question":"Which artefact is the strongest exploit-framework indicator?","answer":{"options":["Service BhZqXk7N with a random-looking name whose binary was copied into ADMIN$ minutes earlier","Service SLV-BackupAgent started by the backup console under change SLV-3261","Service HPDVCGuard installed with a signed HP print-driver package","Service WinRM-Config created during domain-join hardening"],"correct":0},"hint":"Public frameworks do not sign their payloads and do not book change tickets.","explanation":["The signature of a public exploit framework's service attack is a **random 8-character service name** whose payload was **staged via ADMIN$** seconds before creation — no signature, no ticket, no vendor.","The other three bind to legitimate anchors: a change ticket, a signed vendor package, and a documented hardening step. Those anchors are exactly what the framework artefact lacks.","Random service names plus Temp or ADMIN$ binary paths belong in every T1210 hunting query, even when no IDS signature fires."],"study":"Review exploit-framework artefacts: random service names, ADMIN$ drops, and named-pipe patterns."},{"id":"e15","type":"branching","scenario":{"text":["02:50, ticket SLV-3301. Recap for the console: a WannaCry-class worm crossed the flat core network — MS17-010 exploit traffic from `slv-app-07`, a payload service on `slv-fs-03`, outbound sweeps from the victim, and a second wave of probes now sourced from `slv-fs-03` itself. The batch freeze holds until Monday 04:00. **n.fabbri** drives the console; CISO **l.sandoval** is on the bridge."],"artefacts":[{"label":"Incident summary — 02:50","text":"Chain so far: MS17-010 exploit from slv-app-07 (internal); payload service MSSECsvc registered on slv-fs-03; cmd child in service context; sec ence, deleting files destroys the payload sample, and an unconditioned patch window stops the quarter-end batch.","Step 3 rejects the widely quoted 'reboot everything' best practice: after a reboot every unpatched host is **exploitable again**, the worm returns, and the freeze exists because the batch carries quarter-end value. Isolation plus virtual patching holds the line; targeted patching in the window is the durable fix."],"perspectives":{"attacker":"A worm only needs one reachable 445; rebooting without patching hands the network straight back.","defender":"Verify, narrow containment, scheduled remediation — wide destructive actions need evidence first."},"study":"Write your own three-step containment ladder for a worm scenario and pressure-test it against a freeze."}]};

function hl(line){
  var out='',last=0,mm;

/* ---------- timer state machine ----------
   States: IDLE, RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED
------------------------------------------------- */
var budget = (M.estimatedMinutes||25)*60;
var timer={state:'IDLE',remain:budget,manualSec:0,autoSec:0,perLimit:0,perRemain:0};
var tickHandle=null;
var pauseEnteredAt=0;
var STATE_RUN='RUNNING',STATE_MAN='PAUSED_MANUAL',STATE_AUTO='PAUSED_AUTO_CHECK',STATE_END='ENDED',STATE_IDLE='IDLE';
function setState(s){
  var prev=timer.state;
  if((prev===STATE_MAN||prev===STATE_AUTO)&&s!==prev){
    var spent=Math.round((Date.now()-pauseEnteredAt)/1000);
    if(prev===STATE_MAN)timer.manualSec+=spent;else timer.autoSec+=spent;
  }
  if(s===STATE_MAN||s===STATE_AUTO)pauseEnteredAt=Date.now();
  timer.state=s;
  if(s!==STATE_RUN&&prev===STATE_RUN&&tickHandle){clearInterval(tickHandle);tickHandle=null;}
  if(s===STATE_RUN&&!tickHandle){tickHandle=setInterval(tick,1000);}
  renderHeaderTimer();
}
function tick(){
  if(timer.state===STATE_MAN)timer.manualSec++;
  if(timer.state===STATE_AUTO)timer.autoSec++;
  if(timer.state===STATE_RUN){
    timer.remain--;
    if(timer.perLimit>0&&exam.current>=0&&!exam.list[exam.current].result){
      timer.perRemain--;
      if(timer.perRemain<=0){perExExpired();}
    }
    if(timer.remain<=0){timer.remain=0;renderHeaderTimer();timeUp();return;}
    if(timer.perLimit>0)renderHeaderTimer();
  }
  renderHeaderTimer();
}
function timeUp(){
  setState(STATE_END);
  if(view!=='results'){goResults();}
}

/* ---------- global exam state ---------- */

/* ---------- attempt builder ---------- */
function buildAttempt(reshuffleQuestions){
  var list=EXAM.exercises.map(function(e){return clone(e);});
  if(reshuffleQuestions)list=shuffle(list);
  for(var i=0;i<list.length;i++){prepareExercise(list[i]);}
  return list;
}
function prepareExercise(ex){
  if(ex.type==='qcm-single'||ex.type==='qcm-multi'||ex.type==='log-qcm'){
    var a=ex.answer;
    if(ex.type==='log-qcm'&&typeof a.correct==='number')a.correct=[a.correct];
    var multi=(ex.type==='qcm-multi')||(ex.type==='log-qcm'&&Array.isArray(a.correct)&&a.correct.length>1);
    var order=shuffle(a.options.map(function(_,i){return i;}));
    a._disp=a.options.map(function(o,i){return {text:a.options[order[i]],orig:order[i]};});
    if(!multi){var c0=Array.isArray(a.correct)?a.correct[0]:a.correct;a._corr=order.indexOf(c0);a._multi=false;}
    else{a._corr=a.correct.map(function(c){return order.indexOf(c);});a._multi=true;}
  }
  if(ex.type==='dragdrop'){ex.answer._bank=shuffle(ex.answer.items.map(function(_,i){return i;}));ex.answer._placed={};}
  if(ex.type==='order'){ex.answer._disp=shuffle(ex.answer.items.map(function(_,i){return i;}));}
  if(ex.type==='match'){ex.answer._right=shuffle(ex.answer.pairs.map(function(_,i){return i;}));ex.answer._pairs=[];ex.answer._selLeft=null;}
  if(ex.type==='fillblank'){
    var fa=ex.answer;
    var distr=(fa.bank||[]).filter(function(w){return fa.blanks.indexOf(w)<0;});
    var words=fa.blanks.map(function(w,i){return {t:w,slot:i};}).concat(distr.map(function(w){return {t:w,slot:-1};}));
    fa._words=shuffle(words);
    fa._bank=fa._words.map(function(_,i){return i;});
    fa._filled=fa.blanks.map(function(){return null;});
    fa._selChip=null;
  }
  if(ex.type==='branching'){
    ex._step=0;
    ex.steps.forEach(function(st){
      var order=shuffle(st.options.map(function(_,i){return i;}));
      st._disp=st.options.map(function(o,i){return {text:st.options[order[i]],orig:order[i]};});
      st._corr=order.indexOf(st.correct);
      st._choice=null;
      st._done=false;
    });
  }
  if(ex.type==='terminal'){ex._cmd='';}
}

/* ---------- scoring ---------- */
function scoreExercise(H,W,N){N=Math.max(1,N);return Math.max(0,(H-W)/N);}
function gradeExercise(ex){
  var a=ex.answer,r;
  function rows(){return [];}
  if(ex.type==='qcm-single'){
    var pick=a._choice,H=(pick===a._corr)?1:0,W=0,N=1;
    var items=[{status:H?'correct':'wrong',text:(pick!==null&&pick!==undefined)?'Your answer: '+a._disp[pick].text:'No answer selected.'}];
    if(!H)items.push({status:'missed',text:'Correct answer: '+a._disp[a._corr].text});
    r={H:H,W:W,N:N,items:items,single:true};
  }else if(ex.type==='qcm-multi'||ex.type==='log-qcm'){
    if(!a._multi){
      var pk=a._choice,H1s=(pk===a._corr)?1:0,W1s=0,N1s=1;
      var items1s=[{status:H1s?'correct':'wrong',text:(pk!==null&&pk!==undefined)?'Your answer: '+a._disp[pk].text:'No answer selected.'}];
      if(!H1s)items1s.push({status:'missed',text:'Correct answer: '+a._disp[a._corr].text});
      r={H:H1s,W:W1s,N:N1s,items:items1s,single:true};
    }else{
      var sel=a._sel||[];
      var corr=a._corr;
      var H2=0,W2=0,items2=[];
      corr.forEach(function(ci){
        var chosen=sel.indexOf(ci)>=0;
        if(chosen){H2++;items2.push({status:'correct',text:a._disp[ci].text});}
        else{items2.push({status:'missed',text:a._disp[ci].text});}
      });
      sel.forEach(function(si){
        if(corr.indexOf(si)<0){W2++;items2.push({status:'wrong',text:a._disp[si].text});}
      });
      r={H:H2,W:W2,N:corr.length,items:items2,multi:true};
    }
  }else if(ex.type==='dragdrop'){
    var H3=0,W3=0,items3=[];
    a.items.forEach(function(it,i){
      var z=a._placed[i];
      if(z===undefined||z===null){items3.push({status:'missed',text:it.text+' → correct zone: '+a.zones[it.zone].name});}
      else if(z===it.zone){H3++;items3.push({status:'correct',text:it.text+' → '+a.zones[it.zone].name});}
      else{W3++;items3.push({status:'wrong',text:it.text+' → placed in "'+a.zones[z].name+'", correct zone: "'+a.zones[it.zone].name+'"'});}
    });
    r={H:H3,W:W3,N:a.items.length,items:items3};
  }else if(ex.type==='order'){
    var H4=0,W4=0,items4=[];
    for(var k=0;k<a._disp.length;k++){
      var ok=(a._disp[k]===k);
      if(ok)H4++;else W4++;
      items4.push({status:ok?'correct':'wrong',text:'Position '+(k+1)+': expected "'+a.items[k]+'", you placed "'+a.items[a._disp[k]]+'"'});
    }
    r={H:H4,W:W4,N:a.items.length,items:items4};
  }else if(ex.type==='match'){
    var H5=0,W5=0,items5=[];
    var usedRight={};
    a._pairs.forEach(function(pr){
      var ok=(pr.right===pr.left);
      if(ok)H5++;else W5++;
      usedRight[pr.right]=1;
      items5.push({status:ok?'correct':'wrong',text:a.pairs[pr.left].left+' → you matched: '+a.pairs[pr.right].right});
    });
    a.pairs.forEach(function(p,i){
      if(!usedRight[i]){
        var made=a._pairs.some(function(pr){return pr.left===i;});
        if(!made)items5.push({status:'missed',text:p.left+' → correct match: '+p.right});
      }
    });
    r={H:H5,W:W5,N:a.pairs.length,items:items5};
  }else if(ex.type==='fillblank'){
    var H6=0,W6=0,items6=[];
    a.blanks.forEach(function(b,i){
      var f=a._filled[i];
      if(f===null){items6.push({status:'missed',text:'Blank '+(i+1)+': correct word "'+b+'"'})}
      else{
        var w=a._words[f];
        if(w.slot===i){H6++;items6.push({status:'correct',text:'Blank '+(i+1)+': "'+b+'"'});}
        else{W6++;items6.push({status:'wrong',text:'Blank '+(i+1)+': you used "'+w.t+'", correct word: "'+b+'"'});}
      }
    });
    r={H:H6,W:W6,N:a.blanks.length,items:items6};
  }else if(ex.type==='terminal'){
    var norm=normalizeCmd(ex._cmd);
    var H7=0,W7=0,items7=[],danger=false;
    a.elements.forEach(function(el){
      var ok=new RegExp(el.pattern,'i').test(norm);
      if(ok){H7++;items7.push({status:'correct',text:el.desc});}
      else{items7.push({status:'missed',text:el.desc});}
    });
    (a.wrongPatterns||[]).forEach(function(wp){
      if(new RegExp(wp.pattern,'i').test(norm)){W7++;danger=true;items7.push({status:'wrong',text:wp.desc});}
    });
    if(!norm){W7++;items7.push({status:'wrong',text:'No command was entered.'});}
    r={H:H7,W:W7,N:a.elements.length,items:items7,terminal:true,danger:danger};
  }else if(ex.type==='branching'){
    var H8=0,W8=0,items8=[];
    ex.steps.forEach(function(st,i){
      var ok=(st._choice===st._corr);
      if(ok)H8++;else W8++;
      items8.push({status:ok?'correct':'wrong',text:'Step '+(i+1)+' — '+st.options[st.correct]});
    });
    r={H:H8,W:W8,N:ex.steps.length,items:items8,branching:true};
  }else{r={H:0,W:0,N:1,items:[]};}
  var credit=scoreExercise(r.H,r.W,r.N);
  if(hintUsed[ex.id])credit=Math.max(0,credit-0.10);
  r.credit=credit;
  return r;
}
function normalizeCmd(c){

function scenarioBlock(ex){
  var sc=ex.scenario||{};

  if(ex.type==='log-qcm'&&ex.log&&ex.log.lines)body+=logViewer(ex);
  var collapsible=(sc.text&&sc.text.join(' ').length>420)||((sc.artefacts||[]).length>1)||ex.type==='log-qcm';
  (sc.artefacts||[]).forEach(function(art,i){
    var lbl='ARTEFACT '+(i+1)+' — '+art.label;
    if(art.code){body+=codeBlock(art.code.split('\n'),lbl);}
    else{body+='<div class="artefact"><div class="artefact-h">'+esc(lbl)+'</div><div class="prose">'+md(art.text||'')+'</div></div>';}
  });

  var inner='<div class="block-b">'+body+'</div>';

  var sumLine=collapsible?'<div class="summary-line" id="scn-sum-'+ex.id+'" style="display:none">'+esc(summary)+' — collapsed</div>':'';

function questionBlock(ex){

  }

function feedbackBlock(ex,res){
  var label,color,icon,headColor;
  var fullRaw=(res.W===0&&res.H>=res.N);
  if(res.terminal&&res.danger&&res.credit<1){
    label='DANGEROUS — NEAR MISS';color='st-incorrect';icon='&#10007;';headColor='var(--state-incorrect)';
  }
  else if(res.credit>=1){label='CORRECT';color='st-correct';icon='&#10004;';headColor='var(--state-correct)';}
  else if(res.single&&fullRaw){label='CORRECT';color='st-correct';icon='&#10004;';headColor='var(--state-correct)';}
  else if(res.credit>0){label='PARTIALLY CORRECT';color='st-partial';icon='&#10004;';headColor='var(--state-partial)';}
  else{label='INCORRECT';color='st-incorrect';icon='&#10007;';headColor='var(--state-incorrect)';}
  var h='<div class="block-h"><span class="ic">'+icon+'</span><span class="fb-title" style="color:'+headColor+'">'+label+'</span>';
  if(res.N>1||!res.single||hintUsed[ex.id])h+='<span class="fb-credit">credit '+res.credit.toFixed(2)+' — '+res.H+'/'+res.N+' items'+(res.W>0?' · '+res.W+' wrong':'')+(hintUsed[ex.id]?' · hint −0.10':'')+'</span>';
  h+='</div>';
  var b='<div class="block-b">';
  if(res.terminal&&res.danger)b+='<p style="color:var(--state-incorrect);font-weight:700">&#9888; Your command was close — and destructive. Read the warning below before running anything similar on a real host.</p>';
  b+='<div class="item-rows">';
  res.items.forEach(function(it){
    var mk=it.status==='correct'?'<span class="mk mk-c">&#10004; Correct</span>':it.status==='wrong'?'<span class="mk mk-w">&#10007; Wrong</span>':'<span class="mk mk-m">&#9675; Missed</span>';
    b+='<div class="item-row">'+mk+'<span>'+md(it.text)+'</span></div>';
  });
  b+='</div>';
  (ex.explanation||[]).forEach(function(p){b+='<p>'+md(p)+'</p>';});
  if(ex.perspectives&&(ex.perspectives.attacker||ex.perspectives.defender)){
    b+='<div class="persp">';
    if(ex.perspectives.attacker)b+='<div class="p-card red"><h6>&#9876; Attacker perspective</h6>'+md(ex.perspectives.attacker)+'</div>';
    if(ex.perspectives.defender)b+='<div class="p-card blue"><h6>&#128737; Defender perspective</h6>'+md(ex.perspectives.defender)+'</div>';
    b+='</div>';
  }
  if(res.terminal&&ex.answer.canonical){
    b+='<div class="canon"><h6>Canonical command (copyable)</h6><pre id="canon-cmd">'+esc(ex.answer.canonical)+'</pre>';
    if(ex.answer.canonicalParts&&ex.answer.canonicalParts.length){b+='<ul>';ex.answer.canonicalParts.forEach(function(p){b+='<li>'+md(p)+'</li>';});b+='</ul>';}
    if(ex.answer.expectedOutput)b+='<h6 style="margin-top:10px;color:var(--text-secondary)">Expected output shape</h6><pre>'+esc(ex.answer.expectedOutput)+'</pre>';
    b+='</div>';
  }
  if(res.credit<1&&ex.study)b+='<div class="study-tip">&#128161; <b>What to study:</b> '+md(ex.study)+'</div>';
  b+='</div>';
  return '<section class="block bl-feedback" aria-label="Feedback" aria-live="polite">'+h+b+'</section>';
}
