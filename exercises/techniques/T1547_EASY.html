<style>

.learn p{margin:9px 0}
.kw-theme{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:10px 0}

.howlist{margin:8px 0;padding-left:0;list-style:none}
.howlist li{margin:7px 0;padding-left:26px;position:relative;color:var(--text-primary)}

.ex-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 4px}

.blk{border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-surface);margin:14px 0;overflow:hidden}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg-surface-2);

.opt:hover{background:var(--opt-hover)}

.opt.dim{opacity:.75}
/* ---------- matching ---------- */
.matchrow{display:grid;grid-template-columns:1fr 240px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--row-dash)}

.matchrow select{width:100%;min-height:44px;background:var(--bg-surface-2);color:var(--text-primary);

.matchrow select:disabled{opacity:.8}
/* ---------- fill ---------- */
.fillwrap .sent{font-size:16px;line-height:2}
.fillwrap input{background:var(--bg-surface-2);border:1px solid var(--border);border-bottom:2px solid var(--accent-green);

.dndgrid{display:grid;gap:12px}

.zone{border:1px dashed var(--border);border-radius:6px;background:var(--bg-surface-2);min-height:70px;padding:8px}
.zone.over{border-color:var(--accent-green);background:var(--ok-glow)}

.term{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;

.term .scr{min-height:60px;max-height:230px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}

.term .pr{color:var(--accent-green);font-weight:700;white-space:nowrap}
.term input{flex:1;background:transparent;border:none;color:var(--text-mono);font-family:var(--font-mono);

.term .err{color:var(--state-incorrect)}

.synpanel{background:var(--bg-surface-2);border:1px solid var(--border);border-left:3px solid var(--accent-blue);

.stepchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--border);border-radius:999px;

.stepchip.cur{color:var(--accent-amber);border-color:var(--accent-amber);font-weight:700}

.fbk{border:1px solid var(--border);border-left:4px solid var(--text-secondary);border-radius:var(--radius);
  background:var(--bg-surface);margin:16px 0 0;padding:13px 15px}

.fbk .credit{font-family:var(--font-mono);font-size:14px;color:var(--text-secondary)}
.items{margin:10px 0 0;padding:0;list-style:none}
.items li{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;margin:4px 0;

.items .v{font-weight:700;white-space:nowrap}
.v.ok{color:var(--state-correct)}.v.bad{color:var(--state-incorrect)}.v.miss{color:var(--state-skipped)}.v.danger{color:var(--state-incorrect)}

.fbk .study{margin:9px 0 0;padding:9px 12px;border-radius:6px;background:var(--part-dim);

.hintbox{margin:12px 0 0;padding:10px 13px;border-radius:6px;background:var(--hint-dim);

.hintbox .h{color:var(--accent-amber);font-weight:700}
.exfoot{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

#pauseOverlay{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:var(--overlay);backdrop-filter:blur(3px)}
#pauseOverlay .box{text-align:center;max-width:420px;padding:30px}
#pauseOverlay .big{font-size:44px;color:var(--state-paused)}
#pauseOverlay h2{color:var(--state-paused);margin:10px 0 6px}
#pauseOverlay p{color:var(--text-secondary)}
/* ---------- review & results ---------- */
.revlist{list-style:none;margin:10px 0;padding:0}
.revlist li{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:6px;padding:10px 13px;margin:8px 0}
.revlist .t{flex:1 1 auto;font-weight:600}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:12px 14px}
.stat .n{font-size:26px;font-weight:800;font-family:var(--font-mono)}
.stat .l{color:var(--text-secondary);font-size:13px}
.stat.ok .n{color:var(--state-correct)}.stat.part .n{color:var(--state-partial)}
.stat.bad .n{color:var(--state-incorrect)}.stat.skip .n{color:var(--state-skipped)}
.verdict{border-radius:var(--radius);border:1px solid;padding:18px;margin:16px 0;text-align:center}
.verdict.pass{border-color:var(--state-correct);background:var(--ok-wash)}
.verdict.fail{border-color:var(--state-incorrect);background:var(--bad-wash)}
.verdict .big{font-size:30px;font-weight:800;letter-spacing:1px}
.verdict.pass .big{color:var(--state-correct)}
.verdict.fail .big{color:var(--state-incorrect)}
.verdict p{color:var(--text-secondary);margin:8px 0 0}
.score-line{font-family:var(--font-mono);font-size:17px}
.score-line b{color:var(--sev)}
/* ---------- responsive & motion ---------- */
@media (max-width:640px){
  .matchrow{grid-template-columns:1fr}
  .blk-h .sum{display:none}
  body{font-size:15px}
}
@media (prefers-reduced-motion: reduce){
  #prog .fill::after{animation:none;display:none}
  *{transition:none!important;animation:none!important}
}
</style>

window.EXAM = {"meta": {"topicId": "t1547", "batch": 1, "title": "T1547 Boot or Logon Autostart Execution \u2014 EASY", "difficulty": "easy", "questionCount": 16, "estimatedMinutes": 25, "passMark": 70}, "severity": {"key": "easy", "label": "EASY"}, "timer": {"budgetSeconds": 1500}, "intro": {"objectLine": "T1547 - Boot or Logon Autostart Execution - MITRE ATT&CK Technique - Tactics: Persistence, Privilege Escalation - Platforms: Windows, macOS, Linux", "learn": ["You will learn about T1547 - Boot or Logon Autostart Execution. This is a Technique in the MITRE ATT&CK framework. A technique describes one way an attacker can act. T1547 is about a simple but powerful idea: making a program start by itself when the computer boots or when a user logs on. Attackers use it so their program survives a restart.", "Imagine you are a SOC analyst. A laptop was rebooted, and the strange program is still there. Your first thought should be: 'How does it come back?' Very often the answer is an autostart location - a run key, a Startup folder file, or a system setting. In this exam you will learn the most common autostart places on Windows, macOS, and Linux, and which sub-technique ID each one has.", "This object is used across many security jobs. SOC analysts triage alerts about new run keys. Threat hunters compare autostart entries against a known-good baseline with tools like Sysinternals Autoruns and Sysmon. Incident responders remove the autostart entry so the malware stops coming back. Threat intelligence analysts map what they read in vendor reports to T1547 and its sub-techniques. Detection engineers write rules for SIEM and EDR. GRC analysts map controls that limit who may change autostart settings. Red teamers use the same locations in authorized tests.", "You will also learn why attackers like this technique: the program runs without asking the user, often with the user's rights or even higher rights, and it hides among the many normal programs that also start automatically. That is why defenders keep a baseline: they must know which autostart entries are normal before they can spot the one that is not."], "keywords": [{"t": "Technique basics", "items": ["Persistence tactic", "Boot vs logon autostart", "Survives restart without user action", "Parent technique T1547", "Why attackers need persistence"]}, {"t": "Sub-techniques touched in this exam", "items": ["T1547.001 Registry Run Keys / Startup Folder", "T1547.004 Winlogon Helper DLL", "T1547.005 Security Support Provider", "T1547.006 Kernel Modules and Extensions", "T1547.007 Re-opened Applications", "T1547.009 Shortcut Modification", "T1547.010 Port Monitors", "T1547.013 XDG Autostart Entries", "macOS Login Items (T1547.015)"]}, {"t": "Platforms, permissions and context", "items": ["Windows / macOS / Linux coverage", "Administrator rights for HKLM writes", "User-level rights for HKCU writes", "Per-user vs machine-wide scope"]}, {"t": "Telemetry, detection and reporting", "items": ["Sysmon EID 13 (registry value set)", "Run key paths under HKLM and HKCU", "Startup folder file events", "reg.exe command execution", "ATT&CK IDs in IR reports"]}], "how": ["You need 70% to pass. The score counts only the exercises you actually answered.", "This file has 16 exercises: single choice, one multi-select, matching, drag and drop, fill the blank, ordering, and one terminal task where you type a command in a fake shell.", "Exercises with several parts give partial credit: each correct part adds credit, each wrong part you select removes credit. Selecting everything is not a shortcut - wrong picks can bring your credit to zero.", "The timer counts down from 25 minutes. Press Pause to take a real break: the exercise hides and the timer stops until you press Resume.", "When you press Check, the timer stops automatically so you can read the feedback without pressure. It starts again when you press Next. Pressing Skip or Hint does not stop the timer.", "Skipped exercises go to a review pool. Before you can finish, the exam shows you the pool so you can go back and answer them. Skipped exercises you never answer are excluded from the score - they count neither for you nor against you.", "One hint per exercise is allowed. A hint costs 10% of that exercise's credit."]}, "exercises": [{"id": "E01", "type": "qcm", "title": "What T1547 is about", "summary": "Trainee question - what does Boot or Logon Autostart Execution mean?", "scenario": [{"p": "A new trainee reads the ATT&CK matrix and asks you what T1547 is for. You open the technique page titled 'Boot or Logon Autostart Execution'."}], "question": "Which sentence best describes the technique T1547?", "hint": "Think about what must happen after every restart for a malicious program to survive.", "explain": "T1547 is about configuring a system so a chosen program runs automatically at boot or at logon. The attacker does not need the user to click anything. The program comes back after every restart, so the attacker keeps access. The other options describe other kinds of attacks, not persistence.", "study": "Re-read 'What you will learn here' above, then look at the T1547 description in the ATT&CK matrix.", "options": [{"t": "Configure the system so a chosen program runs automatically at boot or logon, to stay on the machine", "why": "Correct. This is exactly what T1547 describes."}, {"t": "Send large amounts of network traffic to hide a port scan from the sensors", "why": "That describes traffic masking, not autostart persistence."}, {"t": "Lock the screen and demand a ransom payment in cryptocurrency", "why": "That describes ransomware impact, not autostart persistence."}, {"t": "Guess many passwords until one account opens", "why": "That describes password guessing, not autostart persistence."}], "correct": [0]}, {"id": "E02", "type": "dnd", "title": "Boot vs logon autostart", "summary": "Sort autostart locations: system boot or user logon", "scenario": [{"p": "T1547 has two big groups of autostart locations. Some run at system boot, before any user logs in. Others run when a user logs on. Look at each item and decide when it starts running."}], "question": "Drag each item to the moment it starts running.", "hint": "Kernel modules and print processors are loaded while Windows or Linux itself starts. Everything tied to a user profile or a desktop session waits for a logon.", "explain": "Kernel modules and print processor DLLs are loaded by the operating system or its services while the machine boots, so they run even if nobody logs in. Run keys, Startup folder files, XDG autostart entries, and login items are tied to a user session, so they run at logon. Attackers pick one or the other depending on the rights they have and the moment they want.", "study": "Re-read the T1547 description: it names 'system boot' and 'logon' as the two trigger moments.", "zones": ["Runs at system boot (no user needed)", "Runs when a user logs on"], "items": [{"txt": "Linux kernel module (.ko)", "zone": 0, "why": "The kernel loads modules while Linux boots."}, {"txt": "Print processor DLL (Windows)", "zone": 0, "why": "The spooler service loads print processors during boot."}, {"txt": "Registry Run key under HKLM", "zone": 1, "why": "Run keys are processed when a user logs on."}, {"txt": "File in a user's Startup folder", "zone": 1, "why": "Startup folder files run inside the user session at logon."}, {"txt": "XDG .desktop entry in /etc/xdg/autostart", "zone": 1, "why": "The desktop environment starts these entries at login."}, {"txt": "macOS Login Item", "zone": 1, "why": "Login items start when that user logs in."}]}, {"id": "E03", "type": "match", "title": "Sub-technique to platform", "summary": "Match five autostart sub-techniques to their platform", "scenario": [{"p": "T1547 works on Windows, macOS, and Linux, but each sub-technique belongs to one or two platforms. Match each sub-technique to where it runs."}], "question": "For each sub-technique, choose the platform where it lives.", "hint": "Winlogon and run keys are Windows words. XDG is a Linux desktop standard. Kernel modules exist on Linux, and kernel extensions on macOS.", "explain": "Registry run keys and the Winlogon key are Windows Registry features. XDG Autostart Entries are .desktop files used by Linux desktops. Kernel Modules and Extensions covers Linux loadable modules and macOS kernel extensions. Login Items are a macOS feature. Knowing the platform tells you which logs and tools to use when you hunt.", "study": "Look at the Platforms field on the T1547 page and each sub-technique page.", "pairs": {"left": ["Registry Run Keys / Startup Folder", "XDG Autostart Entries", "Kernel Modules and Extensions", "Login Items", "Winlogon Helper DLL"], "right": [{"id": "win", "label": "Windows"}, {"id": "lin", "label": "Linux"}, {"id": "lmac", "label": "Linux and macOS"}, {"id": "mac", "label": "macOS"}], "answers": ["win", "lin", "lmac", "mac", "win"], "whys": ["Run keys live in the Windows Registry.", "XDG autostart is the Linux desktop autostart standard.", "Linux uses loadable kernel modules; macOS uses kernel extensions.", "Login Items are managed by macOS at user login.", "Winlogon is a Windows logon component."]}}, {"id": "E04", "type": "fill", "title": "HKLM run keys and users", "summary": "Fill the blank: HKLM run keys start programs for all users", "scenario": [{"p": "A run key can live under two registry hives. HKLM is the Local Machine hive - it belongs to the whole computer. HKCU is the Current User hive - it belongs to one profile."}], "question": "Complete the sentence with one short word.", "hint": "The LM in HKLM stands for Local Machine - whose programs are those?", "explain": "HKLM belongs to the machine, so a program in an HKLM run key starts for all users who log on. That is also why writing to HKLM needs administrator rights. Attackers with admin rights prefer HKLM because one entry covers every user.", "study": "Compare the HKLM and HKCU paths listed on the T1547.001 page.", "blanks": [{"name": "users", "pre": "A run key under HKLM makes a program start for ", "post": " users of that machine. (The LM in HKLM means Local Machine.)", "answers": ["all", "every", "any"], "why": "HKLM is machine-wide, so every user profile triggers it.", "width": 8}]}, {"id": "E05", "type": "qcm", "title": "Recognise T1547.001 in a log", "summary": "One Sysmon process line - which sub-technique?", "scenario": [{"p": "Your EDR shows one process event from a user workstation."}, {"log": "ARTEFACT 1 - EDR process event", "lines": ["2026-10-19 08:02:11  EID 1  Process: reg.exe   Parent: cmd.exe", "Cmdline: reg add \"HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\" /v SyncAgent /d \"%APPDATA%\\SyncAgent\\sync.exe\""]}], "question": "Which sub-technique of T1547 does this log line show?", "hint": "Look at the registry path in the command line and match it to the sub-technique names.", "explain": "The command writes a new value under the CurrentVersion\\Run key. Run keys are exactly what T1547.001 - Registry Run Keys / Startup Folder - describes. Time Providers, Shortcut Modification, and Winlogon Helper DLL use completely different registry paths.", "study": "Read the T1547.001 page and compare its registry paths with the other sub-techniques.", "options": [{"t": "T1547.003 - Time Providers", "why": "Time Providers live under the W32Time service key, not CurrentVersion\\Run."}, {"t": "T1547.009 - Shortcut Modification", "why": "Shortcut Modification touches .lnk files, not registry run keys."}, {"t": "T1547.001 - Registry Run Keys / Startup Folder", "why": "Correct. The command adds a value to the HKCU Run key."}, {"t": "T1547.004 - Winlogon Helper DLL", "why": "Winlogon helpers live under the Windows NT\\CurrentVersion\\Winlogon key."}], "correct": [2]}, {"id": "E06", "type": "terminal", "title": "Query the machine-wide run key", "summary": "Type the reg query command for the HKLM Run key", "scenario": [{"p": "You are a SOC analyst on the workstation of a user who reported a strange program starting at logon. Your team lead says: 'Show me what is in the machine-wide run key.' A PowerShell window is open. You only need to read the values."}], "question": "Type the command that shows the values of the machine-wide (HKLM) run key.", "hint": "The command is reg, then the verb query, then the full HKLM run key path in double quotes.", "explain": "reg.exe with the verb query shows the values stored under a key without changing anything. The machine-wide run key is HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run. Read-only commands like this are the safe first step in persistence triage: they show the autostart entries and change nothing.", "study": "Practise reg query on the Run, RunOnce, and Policies\\Explorer\\Run keys.", "term": {"prompt": "PS C:\\Users\\a.moreau>", "canonical": "reg query \"HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\"", "out": ["", "HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\Run", "    OneDrive    REG_SZ    \"C:\\Program Files\\Microsoft OneDrive\\OneDrive.exe\" /background", "    UpdateAssist    REG_SZ    \"C:\\Program Files\\UpdateAssist\\uassist.exe\" /quiet"], "elements": [{"all": ["reg", "query"], "desc": "reg.exe with the read-only verb query", "why": "reg.exe is the Registry tool; query shows values and changes nothing."}, {"all": ["hklm\\software\\microsoft\\windows\\currentversion\\run"], "desc": "the full HKLM run key path", "why": "This is the machine-wide autostart key used by T1547.001."}], "forbid": [{"any": ["reg add", "reg delete", "reg save", "reg restore", "reg load", "reg copy"], "desc": "state-changing reg verbs (add, delete, save, restore, load, copy)", "danger": true, "why": "The task is read-only. These verbs change or export registry state and can alter or destroy evidence."}], "syntax": {"shape": "reg query \u003cregistry key> [/v value name]", "notes": ["reg.exe is a Windows tool that reads and changes the Registry.", "query = show the values stored under a key.", "Put the key path in double quotes."], "example": "reg query \"HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce\""}}}, {"id": "E07", "type": "qcm", "title": "Why attackers pick autostart", "summary": "Attacker reasoning - the value of boot or logon autostart", "scenario": [{"p": "An attacker already runs a small program on a laptop during an authorized red-team test. They know the laptop is restarted every night by policy."}], "question": "Why does the attacker add the program to a boot or logon autostart location?", "hint": "Ask what the attacker loses without it, and what happens after the nightly restart.", "explain": "Attacker view: autostart means the program comes back after every restart with no user action, so the access survives even if the attacker loses the foothold process. Defender view: that is exactly why you watch autostart locations - a new entry there is one of the highest-value persistence signals you can get.", "study": "Re-read the T1547 description: it says the goal is to 'maintain persistence'.", "options": [{"t": "So the program asks the user to click it again after every restart", "why": "Autostart removes the need for user action; this option says the opposite."}, {"t": "So the program starts again by itself after each restart, with no user action", "why": "Correct. Persistence without user interaction is the whole point."}, {"t": "So the program can hide from the browser history of the user", "why": "Browser history is unrelated to autostart persistence."}, {"t": "So the program can copy itself to other computers on its own", "why": "Autostart does not spread the program; that would be lateral movement."}], "correct": [1]}, {"id": "E08", "type": "order", "title": "Startup folder persistence timeline", "summary": "Put four persistence steps in order", "scenario": [{"p": "A simple attack uses a Startup folder file for persistence (T1547.001). Put the four steps in the order they really happen."}], "question": "Click the steps in the correct order, first step first.", "hint": "The attacker needs access first, then installs the file; the file only runs at the next logon.", "explain": "First the attacker gets in, then they drop the file into the Startup folder. Nothing visible happens until the user logs off and on again - at that logon Windows runs every file in that folder. Knowing this order tells you where each log source helps: process events for step one, file events for step two, and logon-correlated execution for step four.", "study": "Read how T1547.001 triggers execution at user logon.", "items": [{"id": "s2", "txt": "The attacker copies a small program into the user's Startup folder"}, {"id": "s4", "txt": "The program starts by itself and calls the attacker's server"}, {"id": "s1", "txt": "The attacker gets first access through a phishing attachment"}, {"id": "s3", "txt": "The user logs off in the evening and logs on again in the morning"}], "correct": ["s1", "s2", "s3", "s4"], "whyPos": ["No access, no persistence - access always comes first.", "The file must exist in the Startup folder before any logon can run it.", "The trigger for Startup folder files is the next logon.", "Only after the logon does the program execute and reach out."]}, {"id": "E09", "type": "match", "title": "Description to sub-technique", "summary": "Match four short descriptions to their sub-technique names", "scenario": [{"p": "You are reading short notes from a colleague. Each note describes one autostart behaviour. Match each note to the correct T1547 sub-technique."}], "question": "For each description, choose the sub-technique it names.", "hint": "Key words help: Winlogon, .desktop, .LNK, and the Lsa Security Packages value each belong to one sub-technique.", "explain": "Each sub-technique has a signature artefact. A DLL run by winlogon.exe at logon is T1547.004. A .desktop file started by a Linux desktop is T1547.013. A changed .LNK shortcut is T1547.009. A DLL listed under the Lsa Security Packages value and loaded by lsass.exe is T1547.005. Learning these artefacts makes alert triage fast.", "study": "Skim the sub-technique list under T1547 and note the artefact each one uses.", "pairs": {"left": ["A DLL that Windows runs when a user logs on, listed under the Winlogon registry key", "A .desktop file that a Linux desktop runs at login", "A modified .LNK shortcut that points to a hidden payload", "A DLL registered under the Lsa Security Packages value that lsass.exe loads"], "right": [{"id": "s4", "label": "T1547.004 Winlogon Helper DLL"}, {"id": "s13", "label": "T1547.013 XDG Autostart Entries"}, {"id": "s9", "label": "T1547.009 Shortcut Modification"}, {"id": "s5", "label": "T1547.005 Security Support Provider"}, {"id": "s3", "label": "T1547.003 Time Providers"}], "answers": ["s4", "s13", "s9", "s5"], "whys": ["Helper DLLs for Winlogon are the definition of T1547.004.", "Linux desktop autostart uses .desktop files - T1547.013.", "Changed shortcut targets are T1547.009.", "LSA security packages loaded by lsass.exe are T1547.005."]}}, {"id": "E10", "type": "qcm", "title": "Platform of Re-opened Applications", "summary": "Which platform does T1547.007 belong to?", "scenario": [{"p": "The sub-technique 'Re-opened Applications' (T1547.007) abuses a system feature that reopens the apps that were open before a restart or logout."}], "question": "On which platform does this feature (and T1547.007) exist?", "hint": "Think of the dialog that asks to 'reopen windows when logging back in'.", "explain": "Re-opened Applications is a macOS feature: when you restart and tick 'reopen windows', macOS relaunches the apps that were open. An attacker can add their own program to that list. Windows, Linux, and Android do not have this exact feature.", "study": "Read the T1547.007 page and note its platform field.", "options": [{"t": "Windows", "why": "Windows autostart locations are different (run keys, Startup folder, Winlogon)."}, {"t": "Linux", "why": "Linux desktops use XDG autostart entries, not this feature."}, {"t": "macOS", "why": "Correct. The reopen feature belongs to macOS."}, {"t": "Android", "why": "Android is not an ATT&CK Enterprise platform for this technique."}], "correct": [2]}, {"id": "E11", "type": "multi", "title": "Two true statements about T1547", "summary": "Select the two true statements", "scenario": [{"p": "A quiz app in your onboarding path asks one short multi-select question about T1547 before your first shift."}], "question": "Select the two statements that are true.", "hint": "One statement is about the tactic, one is about when the program runs. The two false ones contradict the intro text.", "explain": "T1547 sits in the Persistence tactic, and its defining behaviour is automatic execution at boot or logon. The two false statements contradict this: autostart programs run without the user clicking anything, and T1547 works on workstations and servers across Windows, macOS, and Linux.", "study": "Check the tactic badge and description on the T1547 page.", "options": [{"t": "T1547 belongs to the Persistence tactic", "why": "Correct. Persistence is where ATT&CK lists T1547."}, {"t": "It makes a chosen program start again by itself at boot or logon", "why": "Correct. That is the core behaviour."}, {"t": "The user must click the program after every restart for it to run", "why": "False - autostart exists precisely so no click is needed."}, {"t": "It only works on Windows Server machines", "why": "False - T1547 covers Windows, macOS, and Linux clients and servers."}], "correct": [0, 1]}, {"id": "E12", "type": "fill", "title": "HKCU run keys and users", "summary": "Fill the blank: HKCU run keys affect only that user", "scenario": [{"p": "In an authorized test, the red team wants their program to start only for the test account, so other people on the shared laptop see nothing new. They write the run key under HKCU - the Current User hive."}], "question": "Complete this sentence with the one short word that fits the blank.", "hint": "HKCU means Current User - so the program starts only for that ...?", "explain": "Attacker view: HKCU needs no admin rights and stays invisible to other users on the same machine, which is why low-privilege attackers use it. Defender view: because each profile has its own HKCU, you must collect run keys from every user hive, not just HKLM, or you will miss this persistence.", "study": "Compare HKCU and HKLM coverage in the T1547.001 registry path list.", "blanks": [{"name": "scope", "pre": "They write the run key under HKCU, so the program starts only for that ", "post": ". (No other profile on the laptop runs it.)", "answers": ["user", "account", "profile"], "why": "HKCU belongs to one profile, so only that user triggers it.", "width": 8}]}, {"id": "E13", "type": "qcm", "title": "Rights needed for HKLM", "summary": "What rights does writing an HKLM run key need?", "scenario": [{"p": "A standard user on a locked-down workstation tries to add a value under HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run. The write fails."}], "question": "Which permission does adding a value to an HKLM run key need?", "hint": "HKLM is protected: ordinary accounts cannot change it.", "explain": "HKLM is machine-wide and protected, so only administrator-level accounts can write to it by default. This is a defender advantage: limiting admin rights (least privilege) directly reduces who can add machine-wide autostart entries. HKCU keys, in contrast, need no special rights at all.", "study": "Note which T1547 sub-techniques need administrator rights and which do not.", "options": [{"t": "Any guest account on the machine", "why": "Guest accounts have the least rights, not more than standard users."}, {"t": "Read-only registry access", "why": "Reading is not writing; a read-only right cannot add values."}, {"t": "No permission at all", "why": "Windows protects HKLM; it is not writable by everyone."}, {"t": "Administrator rights on the machine", "why": "Correct. HKLM writes need admin-level rights."}], "correct": [3]}, {"id": "E14", "type": "fill", "title": "Sysmon registry event ID", "summary": "Fill the blank: Sysmon event ID 13 = registry value set", "scenario": [{"p": "Your detection team uses Sysmon to watch the Registry. Every event type has a number. Value-set events on Run keys are the main signal for T1547.001 hunting."}], "question": "Complete the sentence with the event ID number.", "hint": "The Registry value-set event in Sysmon is a low two-digit number between 10 and 15.", "explain": "Sysmon event ID 13 records a Registry value set - a write to a value like a Run key entry. Event ID 12 covers key creation and deletion, and event ID 1 records process creation. Alerting on EID 13 writes to CurrentVersion\\Run from non-installer processes is a classic, high-value analytic for T1547.001.", "study": "Read the detection notes on T1547.001 - they reference Sysmon EventCode 13.", "blanks": [{"name": "sysmon-id", "pre": "Sysmon event ID ", "post": " records when a Windows Registry value is set or changed. Hunters use it to catch run key writes.", "answers": ["13"], "why": "EID 13 is the Sysmon Registry value-set event.", "width": 6}]}, {"id": "E15", "type": "dnd", "title": "Artefact to sub-technique", "summary": "Drag four telemetry artefacts to their sub-technique", "scenario": [{"p": "Four telemetry artefacts arrived in your hunting queue. Each one points to a different T1547 sub-technique. Drag each artefact onto the sub-technique it indicates."}], "question": "Drag each artefact to the sub-technique it points to.", "hint": "Match the artefact location: CurrentVersion\\Run, the Winlogon key, Print\\Monitors, and /Library/Extensions.", "explain": "The registry path or file location names the sub-technique. CurrentVersion\\Run values belong to T1547.001. A second path appended to the Winlogon Userinit value is T1547.004. DLLs registered under Control\\Print\\Monitors are T1547.010 Port Monitors. New kernel extension files under /Library/Extensions are T1547.006 on macOS.", "study": "Memorise the four artefact locations - they cover one Windows user key, one Windows system key, and one macOS path.", "zones": ["T1547.001 Registry Run Keys / Startup Folder", "T1547.004 Winlogon Helper DLL", "T1547.010 Port Monitors", "T1547.006 Kernel Modules and Extensions"], "items": [{"txt": "New value under HKLM\\...\\CurrentVersion\\Run", "zone": 0, "why": "Run key values are the core artefact of T1547.001."}, {"txt": "Userinit value gains a second path under the Winlogon key", "zone": 1, "why": "Winlogon value abuse is T1547.004."}, {"txt": "New DLL path under ...\\Control\\Print\\Monitors", "zone": 2, "why": "Port monitor registrations are T1547.010."}, {"txt": "New .kext file under /Library/Extensions (macOS)", "zone": 3, "why": "Kernel extension files on macOS are T1547.006."}]}, {"id": "E16", "type": "fill", "title": "Complete the IR report line", "summary": "Fill the blank: the sub-technique number in the report", "scenario": [{"p": "You are writing the incident note. The attacker added a value under the user's Run key, so the behaviour maps to the Registry Run Keys / Startup Folder sub-technique. Your report style guide wants the full ATT&CK ID."}], "question": "Complete the report sentence with the sub-technique number.", "hint": "Registry Run Keys / Startup Folder is the first sub-technique under T1547.", "explain": "The full ID is T1547.001. Writing complete IDs (parent T1547 plus sub-technique 001) lets other tools, dashboards, and teams link your report to the exact ATT&CK object without guessing.", "study": "Check the ID shown on the Registry Run Keys / Startup Folder page.", "blanks": [{"name": "id", "pre": "IR note (draft): 'Persistence achieved through sub-technique T1547.", "post": " - the attacker added a value under the user's Run key (Registry Run Keys / Startup Folder).'", "answers": ["001", ".001", "1"], "why": "Registry Run Keys / Startup Folder is T1547.001.", "width": 6}]}]};

  /* ---------------- scoring ---------------- */
  function scoreExercise(selectedItems, correctItems) {

    return Math.max(0, (H - W) / correctItems.length);

  function grade(inst) {
    var ex = inst.ex, res = { credit: 0, rows: [], canonical: null, danger: [] };
    if (ex.type === 'qcm' || ex.type === 'multi') {
      var selO = (ex.type === 'multi') ? inst.sel.map(function (vi) { return inst.view[vi].oi; })
                                       : (inst.sel == null ? [] : [inst.view[inst.sel].oi]);
      var correct = ex.correct;
      res.credit = scoreExercise(selO, correct);
      ex.options.forEach(function (o, oi) {
        var v = inst.view.findIndex(function (x) { return x.oi === oi; });
        var chosen = (ex.type === 'multi') ? inst.sel.indexOf(v) !== -1 : inst.sel === v;
        var inCorrect = correct.indexOf(oi) !== -1;
        var verdict = inCorrect ? (chosen ? 'ok' : 'miss') : (chosen ? 'bad' : null);
        if (verdict) res.rows.push({ v: verdict, t: optLabel(v) + ' ' + o.t, why: o.why });
      });
    } else if (ex.type === 'match') {
      var N = ex.pairs.left.length, H = 0, W = 0;

        var gotLbl = got == null ? null : labelOf(inst.rightView, got);
        var v = (got === want) ? 'ok' : (got == null ? 'miss' : 'bad');
        if (v === 'ok') H++; else if (v === 'bad') W++;

          v: v, t: esc(lt) + ' \u2192 ' + esc(wantLbl),
          why: (ex.pairs.whys && ex.pairs.whys[i] ? ex.pairs.whys[i] : '') +
               (v === 'bad' ? ' (you chose: ' + esc(gotLbl) + ')' : '')

      ex.items.forEach(function (it, i) {
        var got = inst.place[i], want = it.zone;
        var v = (got === want) ? 'ok' : (got === -1 ? 'miss' : 'bad');
        if (v === 'ok') H2++; else if (v === 'bad') W2++;
        res.rows.push({
          v: v, t: esc(it.txt) + ' \u2192 ' + esc(ex.zones[want]),

        if (v === 'ok') H3++; else if (v === 'bad') W3++;

      });

    } else if (ex.type === 'order') {
      var N4 = ex.correct.length, H4 = 0, W4 = 0;

        var v2 = (got2 && got2 === ex.correct[i]) ? 'ok' : (got2 ? 'bad' : 'miss');
        if (v2 === 'ok') H4++; else if (v2 === 'bad') W4++;
        res.rows.push({
          v: v2, t: 'Position ' + (i + 1) + ' \u2192 ' + esc(byId[ex.correct[i]].txt),
          why: (v2 === 'ok' ? '' : (it2 ? 'You placed "' + esc(it2.txt) + '" here. ' : 'You left this position empty. ')) + (ex.whyPos && ex.whyPos[i] ? ex.whyPos[i] : '')
        });

      });

          why: (v3 === 'ok' ? '' : 'You chose: "' + esc(chosenTxt) + '". ') + (inst.stepViews[i][wantV].why || '')
        });

            inst.sel = vi;
            box.querySelectorAll('.opt').forEach(function (x) {
              x.classList.remove('sel'); x.setAttribute('aria-pressed', 'false'); x.querySelector('.tag').textContent = '';
            });
            b.classList.add('sel'); b.setAttribute('aria-pressed', 'true');
            b.querySelector('.tag').textContent = 'SELECTED';
          }
        });
        if (ex.type === 'multi' && inst.sel.indexOf(vi) !== -1) {
          b.classList.add('sel'); b.setAttribute('aria-pressed', 'true'); b.querySelector('.tag').textContent = 'SELECTED';
        } else if (ex.type === 'qcm' && inst.sel === vi) {
          b.classList.add('sel'); b.setAttribute('aria-pressed', 'true'); b.querySelector('.tag').textContent = 'SELECTED';
        }
        box.appendChild(b);
      });
      w.appendChild(box);
    } else if (ex.type === 'match') {
      ex.pairs.left.forEach(function (lt, i) {
        var row = el('div', 'matchrow');
        row.appendChild(el('span', 'lt', esc(lt)));
        var s = el('select');
        var o0 = el('option'); o0.value = ''; o0.textContent = '\u2014 choose \u2014'; s.appendChild(o0);
        inst.rightView.forEach(function (r) {
          var o = el('option'); o.value = r.id; o.textContent = r.label; s.appendChild(o);
        });
        if (inst.ans[i] != null) s.value = inst.ans[i];
        s.addEventListener('change', function () { if (!inst.graded) inst.ans[i] = s.value || null; });
        if (inst.graded) s.disabled = true;
        s.setAttribute('aria-label', 'Match for: ' + lt);
        row.appendChild(s); w.appendChild(row);
      });
    } else if (ex.type === 'fill') {
      var fw = el('div', 'fillwrap');
      ex.blanks.forEach(function (b, i) {
        var sent = el('p', 'sent');
        sent.appendChild(document.createTextNode(b.pre));
        var inp = el('input');
        inp.style.width = Math.max(110, (b.width || 12) * 10) + 'px';
        inp.setAttribute('aria-label', 'Blank ' + (i + 1));
        inp.value = inst.vals[i] || '';
        inp.addEventListener('input', function () { if (!inst.graded) inst.vals[i] = inp.value; });
        if (inst.graded) inp.disabled = true;
        sent.appendChild(inp);
        sent.appendChild(document.createTextNode(b.post || ''));
        fw.appendChild(sent);
      });
      w.appendChild(fw);
    } else if (ex.type === 'dnd') {
      var grid = el('div', 'dndgrid');
      var bank = el('div', 'bank'); bank.id = 'dndBank';
      bank.appendChild(el('div', 'b-h', 'Items \u2014 drag them, or click an item then click a zone'));
      inst.bank.forEach(function (ii) {
        if (inst.place[ii] === -1) bank.appendChild(pillFor(inst, ii));
      });
      grid.appendChild(bank);
      var zc = el('div', 'dnd-zones');
      ex.zones.forEach(function (zn, zi) {
        var z = el('div', 'zone'); z.dataset.zone = zi;
        z.appendChild(el('div', 'z-h', esc(zn)));
        z.addEventListener('click', function () { placeItem(inst, zi); });
        z.addEventListener('dragover', function (e) { e.preventDefault(); z.classList.add('over'); });
        z.addEventListener('dragleave', function () { z.classList.remove('over'); });
        z.addEventListener('drop', function (e) {
          e.preventDefault(); z.classList.remove('over');
          var id = e.dataTransfer.getData('text/plain');
          if (id !== '') { inst.selItem = parseInt(id, 10); placeItem(inst, zi); }
        });
        ex.items.forEach(function (it, ii) {
          if (inst.place[ii] === zi) z.appendChild(pillFor(inst, ii));
        });
        zc.appendChild(z);
      });
      grid.appendChild(zc);
      w.appendChild(grid);
    } else if (ex.type === 'order') {
      var wr = el('div');
      var bank2 = el('div', 'bank');
      bank2.appendChild(el('div', 'b-h', 'Remaining steps \u2014 click them in the correct order (1st click = position 1)'));
      inst.bank.forEach(function (id) {
        if (inst.seq.indexOf(id) === -1) bank2.appendChild(pillForOrder(inst, id));
      });
      wr.appendChild(bank2);
      var ol = el('ol', 'seq');
      ex.items.forEach(function (it, k) {
        var id = inst.seq[k];
        if (!id) return;
        var li = el('li');
        li.innerHTML = '<span class="n">' + (k + 1) + '.</span><span>' + esc(textOf(ex, id)) + '</span>';
        var rm = el('button', 'btn ghost'); rm.textContent = '\u2715 Remove';
        rm.style.minHeight = '44px'; rm.style.padding = '3px 10px'; rm.style.fontSize = '12px';
        rm.addEventListener('click', function () {
          if (inst.graded) return;
          inst.seq.splice(inst.seq.indexOf(id), 1); renderEx();
        });
        li.appendChild(rm); ol.appendChild(li);
      });
      wr.appendChild(ol);
      w.appendChild(wr);
    } else if (ex.type === 'terminal') {
      var T = ex.term;
      if (T.syntax) {
        var sp = el('div', 'synpanel');
        var spHtml = '<div class="h">Syntax reminder</div><pre>' + esc(T.syntax.shape) + '</pre><ul>';
        T.syntax.notes.forEach(function (n) { spHtml += '<li>' + esc(n) + '</li>'; });
        spHtml += '</ul><pre>Example on another target: ' + esc(T.syntax.example) + '</pre>';
        sp.innerHTML = spHtml;
        w.appendChild(sp);
      }
      var t = el('div', 'term');
      if (T.deadline) {
        if (inst.deadlineLeft == null) inst.deadlineLeft = T.deadline;
        var dl2 = el('div', 'chip');
        dl2.style.cssText = 'margin:0 0 8px;display:inline-flex;color:var(--state-paused);border-color:var(--state-paused)';
        dl2.innerHTML = '\u23F8 In-scenario deadline: <span id="dlLeft" style="font-family:var(--font-mono);font-weight:700">' +
          fmtTime(inst.deadlineLeft) + '</span>&nbsp;(pauses with the exam timer; does not affect your score)';
        w.appendChild(dl2);
      }
      t.innerHTML = '<div class="scr" id="termScr"></div>' +
        '<div class="pline"><span class="pr">' + esc(T.prompt) + '</span>' +
        '<input id="termIn" autocomplete="off" spellcheck="false" aria-label="Terminal input"></div>';
      w.appendChild(t);
      var scr = t.querySelector('#termScr'), inp = t.querySelector('#termIn');
      inst.lines.forEach(function (L) {
        var d = el('div', L.cls || ''); d.innerHTML = L.html; scr.appendChild(d);
      });
      function submit() {
        var v = inp.value;
        if (!v.trim()) return;
        var echo = el('div'); echo.innerHTML = '<span class="pr">' + esc(T.prompt) + '</span> ' + esc(v);
        scr.appendChild(echo); inst.lines.push({ html: echo.innerHTML });
        inst.cmd = v;
        var ok = gradeRaw(ex, v);
        if (ok) {
          (T.out || []).forEach(function (ln) {
            var d = el('div', 'out'); d.innerHTML = hl(ln);
            scr.appendChild(d); inst.lines.push({ html: d.innerHTML, cls: 'out' });
          });
        } else {
          var d2 = el('div', 'err');
          d2.textContent = 'Sandbox: this input does not match the simulated task. Press Check to grade what you typed.';
          scr.appendChild(d2); inst.lines.push({ html: esc(d2.textContent), cls: 'err' });
        }
        inp.value = ''; inst.ran = true;
        scr.scrollTop = scr.scrollHeight;
      }
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
      if (inst.graded) inp.disabled = true;
      setTimeout(function () { try { inp.focus(); } catch (e) {} }, 30);
    } else if (ex.type === 'branch') {
      var bw = el('div');
      var chips = el('div'); chips.style.marginBottom = '8px';
      ex.steps.forEach(function (st, i) {
        var c = el('span', 'stepchip' + (i === inst.step ? ' cur' : ''));
        c.textContent = 'STEP ' + (i + 1) + ' OF ' + ex.steps.length +
          (inst.stepAns[i] !== -1 ? ' \u2713' : '');
        chips.appendChild(c);
      });
      bw.appendChild(chips);
      var st = ex.steps[inst.step];
      var q = el('p'); q.style.fontWeight = '700'; q.textContent = st.q; bw.appendChild(q);
      var box = el('div', 'opts');
      inst.stepViews[inst.step].forEach(function (o, vi) {
        var b = el('button', 'opt'); b.type = 'button';
        b.innerHTML = '<span class="lt">' + optLabel(vi) + '</span><span>' + esc(o.t) + '</span><span class="tag"></span>';
        b.addEventListener('click', function () {
          if (inst.graded) return;
          box.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); x.querySelector('.tag').textContent = ''; });
          b.classList.add('sel'); b.querySelector('.tag').textContent = 'SELECTED';
          inst._pick = vi; inst._pickStep = inst.step;
        });
        if (inst._pick === vi && inst._pickStep === inst.step) b.classList.add('sel');
        box.appendChild(b);
      });
      bw.appendChild(box);
      w.appendChild(bw);
      inst._branchBox = box;
    }
    return w;
  }
  function gradeRaw(ex, cmd) {
    var T = ex.term, c = norm(cmd);
    var ok = T.elements.every(function (e) {
      return e.all.every(function (sub) { return c.indexOf(sub.toLowerCase()) !== -1; });
    });
    var bad = (T.forbid || []).some(function (f) {
      return f.any.some(function (sub) { return c.indexOf(sub.toLowerCase()) !== -1; });
    });
    return ok && !bad;
  }
  function textOf(ex, id) {
    for (var i = 0; i < ex.items.length; i++) if (ex.items[i].id === id) return ex.items[i].txt;
    return '';
  }
  function pillFor(inst, ii) {
    var it = inst.ex.items[ii];
    var p = el('button', 'pill' + (inst.selItem === ii ? ' sel' : ''));
    p.textContent = it.txt; p.draggable = !inst.graded;
    p.setAttribute('data-item', ii);
    p.setAttribute('aria-label', 'Item: ' + it.txt);
    p.addEventListener('click', function () {
      if (inst.graded) return;
      if (inst.place[ii] !== -1) { inst.place[ii] = -1; renderEx(); return; }
      inst.selItem = (inst.selItem === ii) ? null : ii;
      renderEx();
    });
    p.addEventListener('dragstart', function (e) {
      e.dataTransfer.setData('text/plain', String(ii));
    });
    return p;
  }
  function pillForOrder(inst, id) {
    var p = el('button', 'pill');
    p.textContent = textOf(inst.ex, id);
    p.setAttribute('aria-label', 'Step: ' + textOf(inst.ex, id));
    p.addEventListener('click', function () {
      if (inst.graded) return;
      inst.seq.push(id); renderEx();
    });
    return p;
  }
  function placeItem(inst, zi) {
    if (inst.graded || inst.selItem == null) return;
    inst.place[inst.selItem] = zi;
    inst.selItem = null;
    renderEx();
  }

  /* ---------------- check / next / skip / hint ---------------- */
  function onCheck() {
    var inst = curInst();
    if (!inst || inst.graded) return;
    if (inst.ex.type === 'branch' && inst.step < inst.ex.steps.length - 1) {
      if (inst._pick == null || inst._pickStep !== inst.step) return;
      inst.stepAns[inst.step] = inst._pick;
      inst.step++; inst._pick = null; inst._pickStep = null;
      renderEx(); return;
    }
    setT('PAUSED_AUTO_CHECK');
    if (inst.ex.type === 'branch' && inst._pick != null && inst._pickStep === inst.step && inst.stepAns[inst.step] === -1) {
      /* record the final step's choice before grading (intermediate steps already stored theirs) */
      inst.stepAns[inst.step] = inst._pick;
    }
    var res = grade(inst);
    res.base = res.credit;
    if (S.hints[inst.ex.id]) res.credit = Math.max(0, res.credit - 0.10);
    inst.graded = true; inst.lastRes = res;
    S.credits[inst.ex.id] = res.credit;
    S.bases[inst.ex.id] = res.base;
    S.answered[inst.ex.id] = true;
    delete S.skipped[inst.ex.id];
    renderEx();
  }
  function showFeedback(inst, res, silent) {
    var ex = inst.ex;
    var holder = document.getElementById('fbkHolder');
    holder.innerHTML = '';
    var eff = (res.base == null) ? res.credit : res.base;
    var cls = eff >= 0.999 ? 'ok' : (eff > 0 ? 'part' : 'bad');
    var lbl = eff >= 0.999 ? '\u2713 CORRECT' : (eff > 0 ? '\u2713 PARTIALLY CORRECT' : '\u2717 INCORRECT');
    var f = el('div', 'fbk ' + cls);
    var hh = el('div', 'fbk-h');
    hh.innerHTML = esc(lbl) + ' <span class="credit">credit ' + (Math.round(res.credit * 100) / 100).toFixed(2) + '</span>' +
      (res.danger && res.danger.length ? ' <span class="badge bad">\u2717 DANGEROUS \u2014 NEAR MISS</span>' : '');
    f.appendChild(hh);
    var multi = ['multi', 'match', 'dnd', 'fill', 'order', 'terminal', 'branch'].indexOf(ex.type) !== -1;
    if (multi && res.rows.length) {
      var ul = el('ul', 'items');
      res.rows.forEach(function (r) {
        var li = el('li');
        var vmap = { ok: '\u2713 Correct', bad: '\u2717 Wrong', miss: '\u25CB Missed', danger: '\u2717 Dangerous' };
        li.innerHTML = '<span class="v ' + r.v + '">' + vmap[r.v] + '</span><span><b>' + r.t + '</b>' +
          (r.why ? ' \u2014 ' + esc(r.why) : '') + '</span>';
        ul.appendChild(li);
      });
      f.appendChild(ul);
    } else if (ex.type === 'qcm') {
      var ci = ex.correct[0];
      var p = el('p', 'why');
      p.innerHTML = 'Correct answer: <b>' + esc(ex.options[ci].t) + '</b>';
      f.appendChild(p);
    }
    var why = el('p', 'why'); why.innerHTML = esc(res.explain || ex.explain || '');
    f.appendChild(why);
    if (res.canonical) {
      var cb = el('div');
      cb.innerHTML = '<div class="sec-note">Canonical command (copyable):</div><pre class="code">' + esc(res.canonical) + '</pre>';
      f.appendChild(cb);
      var T = ex.term;
      var ul2 = el('ul', 'items');
      T.elements.forEach(function (e2) {
        var li = el('li');
        li.innerHTML = '<span class="v miss">\u25B8 Part</span><span>' + esc(e2.desc) + (e2.why ? ' \u2014 ' + esc(e2.why) : '') + '</span>';
        ul2.appendChild(li);
      });
      f.appendChild(ul2);
    }
    if (eff < 0.999 && ex.study) {
      var st = el('div', 'study');
      st.innerHTML = '<span class="h">What to study:</span> ' + esc(ex.study);
      f.appendChild(st);
    }
    holder.appendChild(f);
    var bn = document.getElementById('btnNext');
    bn.style.display = 'inline-flex';
    bn.textContent = (S.pos === S.order.length - 1 && !S.reviewReturn)
      ? ((skippedOpen() > 0) ? 'Final Submit \u2192 review skipped' : 'Final Submit \u2192 results')
      : 'Next \u2192';
    var bc = document.getElementById('btnCheck');
    bc.disabled = true;
    renderHdr();
    if (!silent) {
      try { f.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'nearest' }); } catch (e) {}
    }
  }

  /* override: attach explain after grade (kept simple) */
  var _grade = grade;
  grade = function (inst) {
    var r = _grade(inst);
    r.explain = inst.ex.explain;
    return r;
  };

  function onNext() {
    var inst = curInst();
    if (!inst || !inst.graded) return;
    if (S.reviewReturn) { S.reviewReturn = false; showReview(); return; }
    if (S.pos < S.order.length - 1) {
      S.pos++; setT('RUNNING'); renderEx();
      window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
    } else {
      if (skippedOpen() > 0 && S.remain > 0) { showReview(); }
      else { showResults(); }
    }
  }
  function onSkip() {
    var inst = curInst();
    if (!inst || inst.graded) return;
    S.skipped[inst.ex.id] = true;
    if (S.reviewReturn) { S.reviewReturn = false; showReview(); return; }
    if (S.pos < S.order.length - 1) { S.pos++; renderEx(); }
    else if (skippedOpen() > 0) { showReview(); }
    else { showResults(); }
    renderHdr();
  }
  function onHint() {
    var inst = curInst();
    if (!inst || inst.graded || S.hints[inst.ex.id]) return;
    S.hints[inst.ex.id] = true;
    var hb = document.getElementById('hintBox');
    document.getElementById('hintTxt').textContent = inst.ex.hint || '';
    hb.style.display = 'block';
    document.getElementById('btnHint').disabled = true;
  }
  function onPause() {
    if (S.tState === 'RUNNING' || S.tState === 'PAUSED_AUTO_CHECK') {
      S.manualFrom = S.tState;
      setT('PAUSED_MANUAL');
      var ov = document.getElementById('pauseOverlay');
      ov.style.display = 'flex';
    }
  }
  function onResume() {
    var ov = document.getElementById('pauseOverlay');
    ov.style.display = 'none';
    setT(S.manualFrom || 'RUNNING');
    S.manualFrom = null;
  }
  function finishTimeout() {
    stopClock();
    var inst = curInst();
    if (inst && !inst.graded && S.view === 'exam') S.skipped[inst.ex.id] = true;
    S.timeoutHit = true;
    showResults();
  }

  /* ---------------- review skipped ---------------- */
  function showReview() {
    S.view = 'review'; S.reviewReturn = false;
    document.getElementById('examView').style.display = 'none';
    document.getElementById('resultsView').style.display = 'none';
    var v = document.getElementById('reviewView');
    v.style.display = 'block';
    var h = '<div class="card"><h2>\u26A0 Review skipped exercises</h2>' +
      '<p class="sec-note">The timer is still running. You can answer a skipped exercise now, or final-submit and leave it out of the score.</p><ul class="revlist">';
    S.order.forEach(function (idx, pos) {
      var ex = EXS[idx];
      if (S.skipped[ex.id] && !S.answered[ex.id]) {
        h += '<li><span class="badge skip">\u26A0 Skipped</span><span class="t">' + esc(ex.title) + '</span>' +
          '<button class="btn amber" data-pos="' + pos + '">\u2192 Answer now</button></li>';
      }
    });
    h += '</ul><div class="exfoot">' +
      '<button class="btn primary" id="btnFinalGo">\u2713 Final submit anyway (' + skippedOpen() + ' excluded)</button></div></div>';
    v.innerHTML = h;
    v.querySelectorAll('button[data-pos]').forEach(function (b) {
      b.addEventListener('click', function () {
        S.pos = parseInt(b.getAttribute('data-pos'), 10);
        S.reviewReturn = true; S.view = 'exam';
        v.style.display = 'none';
        document.getElementById('examView').style.display = 'block';
        setT('RUNNING'); renderEx();
      });
    });
    document.getElementById('btnFinalGo').addEventListener('click', showResults);
    setT('RUNNING');
    renderHdr();
  }

  /* ---------------- results ---------------- */
  function showResults() {
    if (S.tState !== 'ENDED') { setT('ENDED'); stopClock(); }
    S.view = 'results';
    document.getElementById('examView').style.display = 'none';
    document.getElementById('reviewView').style.display = 'none';
    var v = document.getElementById('resultsView');
    v.style.display = 'block';
    var full = 0, part = 0, bad = 0, skip = 0, partSum = 0;
    EXS.forEach(function (ex) {
      if (S.answered[ex.id]) {
        var b = (S.bases[ex.id] != null) ? S.bases[ex.id] : (S.credits[ex.id] || 0);
        var c = S.credits[ex.id] || 0;
        if (b >= 0.999) full++;
        else if (b > 0) { part++; partSum += c; }
        else bad++;
      } else { skip++; }
    });
    var answered = full + part + bad;
    var sum = 0; EXS.forEach(function (ex) { if (S.answered[ex.id]) sum += (S.credits[ex.id] || 0); });
    var percent = answered ? Math.round(sum / answered * 100) : 0;
    var pass = percent >= CFG.meta.passMark;
    var avg = part ? Math.round(partSum / part * 100) / 100 : 0;
    var h = '<div class="card"><h2>Results \u2014 ' + esc(CFG.meta.title) + '</h2>' +
      '<p class="score-line">Score <b>' + (Math.round(sum * 10) / 10).toFixed(1) + '</b> / ' + answered + ' answered \u2014 <b>' + percent + '%</b> (pass mark ' + CFG.meta.passMark + '%)</p>' +
      (S.timeoutHit ? '<p class="sec-note">\u23F1 Time ran out \u2014 unanswered exercises were excluded from the score.</p>' : '') +
      '<div class="statgrid">' +
      stat(full, '\u2713 Fully correct', 'ok') +
      stat(part, '\u2713 Partially correct' + (part ? ' \u00b7 avg ' + avg : ''), 'part') +
      stat(bad, '\u2717 Fully incorrect', 'bad') +
      stat(skip, '\u26A0 Skipped \u2014 excluded', 'skip') +
      '</div>';
    h += '<p class="sec-note">\u23F8 Time paused manually: ' + fmtTime(S.pauseManualMs / 1000) +
      ' \u00b7 \u23F8 Time reviewing feedback: ' + fmtTime(S.pauseAutoMs / 1000) + '</p>';
    if (pass) {
      h += '<div class="verdict pass"><div class="big">\u2713 PASS</div>' +
        '<p>Certificate-style result: you reached ' + percent + '%, above the ' + CFG.meta.passMark + '% pass mark. Well done \u2014 you can now take the next severity file for ' + esc(CFG.meta.topicId.toUpperCase()) + '.</p></div>';
      h += '<div class="exfoot"><button class="btn primary" id="btnRetake">\u21BA Retake exam (new shuffle)</button></div>';
    } else {
      h += '<div class="verdict fail"><div class="big">\u2717 FAIL</div>' +
        '<p>' + percent + '% is below the ' + CFG.meta.passMark + '% pass mark. You must retake this exam. Study the "What to study" hints, then try again \u2014 the questions and answers will be shuffled.</p></div>';
      h += '<div class="exfoot"><button class="btn primary big" id="btnRetake">\u21BA Retake exam</button></div>';
    }
    h += '</div>';
    v.innerHTML = h;
    document.getElementById('btnRetake').addEventListener('click', startExam);
    renderHdr();
    reportScore(sum, answered, percent, pass);
  }
  function stat(n, l, cls) {
    return '<div class="stat ' + cls + '"><div class="n">' + n + '</div><div class="l">' + esc(l) + '</div></div>';
  }
  function reportScore(sum, answered, percent, pass) {
    if (S.reported) return;
    S.reported = true;
    if (window.parent === window && location.protocol === 'file:') {
      /* Opened directly from disk: parent is this page itself, nothing to report to. */
      return;
    }
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: CFG.meta.topicId,
        batch: CFG.meta.batch,
        score: Math.round(sum),
        total: answered,
        percent: percent,
        passed: percent >= CFG.meta.passMark
      }, location.origin);
    } catch (e) { /* opened directly \u2014 nothing to report to */ }
  }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) return;
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
    S.user = event.data.username || null;
    /* theme field is always 'dark'; the file is dark-only by contract, nothing to switch */
  });

  /* ---------------- wire up ---------------- */
  function boot() {
    renderIntro();
    document.getElementById('btnSkip').addEventListener('click', onSkip);
    document.getElementById('btnHint').addEventListener('click', onHint);
    document.getElementById('btnPause').addEventListener('click', onPause);
    document.getElementById('btnResume').addEventListener('click', onResume);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
