'use strict';
/* ===================== utils ===================== */
function $(s,r){return (r||document).querySelector(s);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){var x=a.slice();for(var i=x.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=x[i];x[i]=x[j];x[j]=t;}return x;}
function norm(s){return String(s).replace(/\s+/g,' ').trim().toLowerCase();}
function fmt(sec){sec=Math.max(0,sec);var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
/* scoreExercise — mandatory formula: max(0,(H-W)/N) */
function scoreExercise(H,W,N){if(N<=0)return 0;return Math.max(0,(H-W)/N);}
function hl(line){
  var s=esc(line);
  s=s.replace(/^(\s*\[?[0-9]{4}-[0-9]{2}-[0-9]{2}[T ][0-9:.]+Z?\]?)/,'<span class="d">$1</span>');
  s=s.replace(/\b(xattr|spctl|codesign|certutil|bcdedit|csrutil|add-trusted-cert|security|signtool|powershell|sigverif|reg|mount|open|sh|bash|curl|Get-AuthenticodeSignature|driverquery|osquery|Sysmon|EDR|siem)\b/g,'<span class="t">$1</span>');
  s=s.replace(/(-{1,2}[A-Za-z][\w-]*)/g,'<span class="k">$1</span>');
  s=s.replace(/([A-Za-z]:\\[^ \s"]*|\/(?:Library|Applications|Windows|tmp|etc|usr|System)[^\s"]*|HKLM\\[^ \s"]*|\\Registry\\[^ \s"]*)/g,'<span class="p">$1</span>');
  s=s.replace(/(\bTRUE\b|\bON\b|\btrustRoot\b|\bROOT\b|\b0x[0-9a-fA-F]+\b)/g,'<span class="g">$1</span>');
  return s;

var META = {"topicId":"t1553","batch":4,"objectId":"T1553","objectName":"Subvert Trust Controls","objectType":"Technique","title":"T1553 Subvert Trust Controls — EXTREMELY HARD","difficulty":"extremely-hard","estimatedMinutes":80,"passMark":70,"keywords":[["Expert detection work",["<b>DET0452<\/b> full-correlation strategy","<b>AN1246<\/b> certificate + registry + module loads","baseline trust stores","unverifiable revocation","<code>g_CiOptions<\/code> kernel tampering"]],["Chained incidents",["valid signature + fresh CA + AiTM","isolated host still emitting events","GPO-spread root certificates","kernel DSE off via vulnerable signed driver","<b>Turla<\/b> / <b>Pandora<\/b> patterns"]],["Cost &amp; judgement",["evidence that survives scrutiny","containment vs month-end close","least-aggressive correct action","escalate / gather evidence","best practice that is wrong here"]],["Coverage under gaps",["no EDR on macOS fleet","MDM queries as compensating telemetry","proxy pinning logs","risk acceptance with a plan"]],["Analytics referenced",["AN0643","AN0800","AN1222","AN1446","AN0712","AN0153/AN0154"]]]};
var EXAMS = [{"id":"x01","type":"branch","title":"LedgerWorks: five chained decisions","note":"Signed update, unreachable revocation, CFO machines exposed. Noise included.","scenario":"<p>18:40. Your SIEM shows a signed installer 'LedgerWorks Suite 2026 Update' executed on 9 hosts, including 3 finance machines. The signature chain validates. The certificate was issued <b>6 weeks ago<\/b>. The revocation server is <b>unreachable<\/b> (OCSP timeouts). Proxy logs from last month show no LedgerWorks traffic; a nightly backup job ran during the same window (noise).<\/p>","artefacts":[{"label":"ARTEFACT 1 — signature panel","code":"Subject:   LedgerWorks Software Ltd\nIssued:    2026-09-08 (6 weeks ago)\nChain:     valid to public CA\nOCSP/CRL:  unreachable (timeout)"},{"label":"ARTEFACT 2 — EDR summary","code":"9 hosts executed Setup.exe (signed, valid chain)\n3 hosts = finance segment (CFO laptop included)\npost-install: service 'LWUpdate' created on 4 hosts"},{"label":"ARTEFACT 3 — CTI note","code":"Trojanized signed installers with fresh certs mirror the\n3CX Supply Chain Attack pattern (T1553.002). Revocation\nunreachability is common for fraudulently bought certs."}],"question":"Take the five decisions in order.","steps":[{"prompt":"Step 1 of 5 — The signature is valid but revocation cannot be checked. What is the defensible reading?","options":[["A valid-looking signature without revocation proof is not proof of trust — treat as untrusted until verified out-of-band",true],["A valid chain means the signer is trusted; revocation is optional",false],["An unreachable revocation server proves the certificate is revoked",false]]},{"prompt":"Step 2 of 5 — Which chain of sub-techniques does the current evidence support?","options":[["T1553.002 Code Signing, with possible follow-on persistence via the created service",true],["T1553.003 SIP hijacking — the signature must have been forged locally",false],["T1553.005 only — the payload arrived without MotW",false]]},{"prompt":"Step 3 of 5 — Which analytic from your stack fires on exactly this certificate signal?","options":[["AN0643 — unusual or recently issued certificates used in privileged contexts",true],["AN0800 — quarantine attribute manipulation on macOS",false],["AN1446 — bcdedit and Test Signing enablement",false]]},{"prompt":"Step 4 of 5 — Containment scope, given finance machines and month-end in 3 days?","options":[["Isolate the finance segment hosts first, preserve their images, let batch systems run on secondary hosts",true],["Do nothing until revocation is confirmed, to avoid false alarm",false],["Reimage all 9 hosts immediately, business impact be damned",false]]},{"prompt":"Step 5 of 5 — The CISO asks for the decision in one line. What do you say?","options":[["Block the signer org-wide, hunt for the service artifact, escalate to IR — revocation status still unproven",true],["Accept the update — vendors sign updates all the time",false],["Wait for the revocation server to come back online before any action",false]]}],"hint":"Constraint from Step 1 carries through everything: 'valid-looking' is not 'trusted'.","explain":"<p>Step 1: revocation <b>unreachable<\/b> means <b>unproven<\/b> — not valid, not revoked. Step 2: evidence supports <b>T1553.002<\/b> (valid signature abuse, 3CX pattern) plus service-based persistence; nothing points to local forging (.003) or container delivery (.005). Step 3: <b>AN0643<\/b> was written for this signal. Step 4: containment with <b>accepted cost<\/b> — finance isolation is disruptive, but a compromised CFO laptop at month-end is worse; imaging preserves evidence. Step 5: the CISO line contains decision + hunt + escalation. The backup job is noise; last month's clean proxy logs are <b>incomplete information<\/b> (the campaign is 6 weeks old — old logs were pruned, absence of evidence is not evidence of absence).<\/p>","study":"3CX Supply Chain Attack (C0057); SolarWinds lesson; DET0230/AN0643."},{"id":"x02","type":"qcm","title":"Which signal wins?","note":"Two signals contradict; state which one governs.","scenario":"<p>Same incident, 19:05. The EDR verdict for the LedgerWorks installer reads 'signature VALID'. Your PKI team confirms the OCSP responder for that CA has been <b>down for 4 hours<\/b>. The helpdesk insists 'valid means safe, close the alert'.<\/p>","question":"Which statement is the decision-correct one?","options":[["Absence of revocation data is not proof of validity — the signature cannot be called fully trusted until revocation is verified",true],["The EDR verdict is authoritative; close the alert",false],["The OCSP outage proves the certificate was revoked",false],["Both signals are unreliable, so take no position at all",false]],"hint":"One signal is positive-looking but incomplete; the other explains why it is incomplete.","explain":"<p>The EDR's 'VALID' verdict reflects <b>chain integrity<\/b> — it does not certify <b>revocation state<\/b> it could not fetch. The OCSP outage explains the gap. The helpdesk commits the classic error: treating 'no negative data' as 'positive data'. <b>Attacker view:<\/b> fraudulently bought certs thrive exactly when revocation infrastructure is flaky. <b>Defender view:<\/b> write the gap down and verify out-of-band with the vendor — the signature may yet be clean, but you decide with evidence, not hope.<\/p>","study":"DET0230 — why 'revoked or unknown certificates' (unknown!) is in the analytic."},{"id":"x03","type":"triage","title":"Senior queue: six calls under pressure","note":"Month-end close tonight. Costs are real. Two answers are 'do not touch yet'.","scenario":"<p>21:15, month-end close in progress. You are the senior on call. Six cases. Some correct answers are deliberately NOT the most aggressive one.<\/p>","question":"Choose the senior-level disposition for every case.","alerts":[{"name":"CASE-A","src":"DC-02 — already isolated at 14:02","log":["new root-certificate GPO-linked events still arriving from DC-02 after isolation","events reference Policy\\SystemCertificates on OTHER hosts"],"options":[["Escalate to IR lead — isolation is not stopping the source; a replication mechanism is spreading it",true],["Close — the host is isolated, nothing more to do",false],["Reboot DC-02 to clear the events",false]]},{"name":"CASE-B","src":"CFO laptop — new root cert + proxy shows spoofed bank portal","log":["cert fingerprint matches no internal CA","proxy: cert served for bank portal hostname","CFO demo tomorrow 09:00"],"options":[["Isolate now and accept the demo risk — active AiTM against the CFO outweighs the demo",true],["Wait until after tomorrow's demo, then isolate",false],["Ask the CFO to avoid online banking until Monday",false]]},{"name":"CASE-C","src":"Design MacBook — quarantine strip on design tools","log":["service account 'design-ci' strips quarantine on signed internal builds","documented pipeline, ticket DES-118"],"options":[["Verify ticket DES-118, then close and tune the analytic to exclude design-ci",true],["Escalate as attacker Gatekeeper bypass",false],["Disable the design pipeline",false]]},{"name":"CASE-D","src":"3 lab hosts — unknown root cert, no ticket","log":["same fingerprint on 3 lab machines","source unknown, no network evidence yet","hosts are low-value"],"options":[["Gather more evidence first — snapshot the cert stores and hunt the fingerprint fleet-wide",true],["Reimage all three hosts immediately",false],["Delete the certificate and close",false]]},{"name":"CASE-E","src":"SQL-PRD-02 — TESTSIGNING seen ON","log":["bcdedit -set TESTSIGNING ON 3 weeks ago by svc_dbadmin","no incidents since; month-end close runs on this host tonight"],"options":[["Open the IR case now, contain at 22:30 after the finance freeze window",true],["Force a reboot and disable TESTSIGNING right now",false],["Leave it — three quiet weeks prove it is benign",false]]},{"name":"CASE-F","src":"Fleet — AN0643 pages on a newly issued signer","log":["binary signed 5 days ago executed on 2 hosts","chain valid; vendor known to your org; procurement confirms a pilot today"],"options":[["Verify the procurement pilot against the cert fingerprint, then close as sanctioned",true],["Escalate — new certificates are always attacker activity",false],["Block the signer org-wide pending investigation",false]]}],"hint":"Ask of each case: what does isolation cost, what does waiting cost, and is the source actually stopped?","explain":"<p><b>CASE-A:<\/b> events persisting <i>after<\/i> isolation prove a non-endpoint source (GPO replication) — escalate; the constraint 'host isolated' changes the reading. <b>CASE-B:<\/b> active AiTM against the CFO — isolate now, accept the demo cost (the real cost of waiting is worse). <b>CASE-C:<\/b> documented pipeline — verify, close, tune. <b>CASE-D:<\/b> low-value hosts, no evidence yet — <b>gather evidence first<\/b>; reimaging destroys the artefact. <b>CASE-E:<\/b> T1553.006 on a production DB during month-end — case now, contain after the freeze (cost-aware timing; three quiet weeks prove nothing — the TESTSIGNING pattern matches BlackEnergy). <b>CASE-F:<\/b> a known vendor with a confirmed pilot — verify then close; reflex-blocking a real supplier is the costly mistake.<\/p>","study":"Senior triage: every action has a cost; every delay has a cost; evidence first."},{"id":"x04","type":"terminal","title":"Terminal: evidence that survives scrutiny","note":"Windows host, live, legal requires chain detail. Choose tools and order yourself.","scenario":"<p>Legal hold on host FIN-WS-7 (live, must not alter state). A suspect driver <b>C:\\Windows\\System32\\drivers\\lwdrv.sys<\/b> must be documented with its <b>full signing chain and policy details<\/b> for a report that will survive scrutiny. You have an elevated shell and the Windows SDK on a USB evidence kit. One tempting command would <b>enable unsigned drivers<\/b> — that would destroy the claim of a pristine host. Typo tolerance: none beyond whitespace.<\/p>","question":"Type the command that verifies the driver's signature and prints the full certificate chain, using the Windows SDK verification tool with the default authentication (policy A) and verbose output.","prompt":"PS C:\\evidence> ","canonical":"signtool verify /pa /v C:\\Windows\\System32\\drivers\\lwdrv.sys","sample":["Issued to: LedgerWorks Software Ltd","Issued by: Secure Public CA R3","Expires:   2027-09-01  SHA2 hash: 3f9a...c2","The signature is valid. (revocation checked: yes)"],"danger":["bcdedit","testsigning"],"hint":"The SDK tool is signtool; you need 'verify', policy A, and verbose.","explain":"<p>Canonical: <code>signtool verify /pa /v C:\\Windows\\System32\\drivers\\lwdrv.sys<\/code>. Parts: <b>signtool<\/b> (SDK verification tool), <b>verify<\/b> (subcommand), <b>/pa<\/b> (Default Authentication policy — what Windows actually uses), <b>/v<\/b> (verbose: full chain, hashes, expiry), <b>target<\/b>. The destructive near-miss <code>bcdedit -set TESTSIGNING ON<\/code> would have flipped code-signing policy (<b>T1553.006<\/b> — the very technique under investigation) and been flagged <b>DANGEROUS — NEAR MISS<\/b>. <code>sigverif<\/code> is a legacy GUI without chain detail; <code>Get-AuthenticodeSignature<\/code> is defensible but the report demanded signtool-grade chain output. <b>Attacker view:<\/b> a driver signed six weeks ago by a fresh CA is exactly the T1553.002 + T1553.006 combination Turla-class actors reach for. <b>Defender view:<\/b> chain detail is what makes the finding survive legal review.<\/p>","study":"signtool verify /pa /v; contrast with state-changing policy commands."},{"id":"x05","type":"multi","title":".003 or .006? Discriminators","note":"Three signals raise confidence for SIP hijack — pick them out of six.","scenario":"<p>An incident on host APP-14 shows 'signature checks behave oddly'. You must separate <b>T1553.003<\/b> (SIP hijack) from <b>T1553.006<\/b> (policy modification). Select the three signals that raise confidence for .003 over .006.<\/p>","question":"Select the three .003-leaning signals.","options":[["Registry writes under Cryptography\\Providers\\Trust",true],["A non-standard DLL mapped into the signature validation path",true],["WinVerifyTrust verdicts inconsistent with the file's true signer",true],["The desktop shows the 'Test Mode' watermark",false],["g_CiOptions was flipped in kernel memory",false],["A new root certificate appeared in the user store",false]],"hint":"Policy modification lives in boot/kernel policy and watermarks; SIP hijack lives in the validation machinery.","explain":"<p><b>.003<\/b> is about the <b>validation machinery<\/b>: SIP provider registry mappings, non-Microsoft crypto DLLs entering the trust path, verdicts that no longer match reality. <b>.006<\/b> leaves different fingerprints: the <b>Test Mode watermark<\/b>, <code>bcdedit<\/code>/<code>testsigning<\/code>, or <code>g_CiOptions<\/code> kernel tampering (Turla). The root certificate is <b>.004<\/b>. Correctly separating the two changes the whole response playbook.<\/p>","study":"DET0442/AN1222 vs DET0523/AN1446 — different artefacts, different playbooks."},{"id":"x06","type":"order","title":"Prioritise the response — cost-aware","note":"Five actions for a trust-subversion incident on a file server. Order = severity of consequence if skipped.","scenario":"<p>Host FS-11 shows: attacker-installed root certificate, unsigned service running, and a SIP registry write. Month-end file shares depend on FS-11. Order the response actions so that skipping the earlier ones would hurt most.<\/p>","question":"Order the five actions from first (most urgent) to last.","items":["Isolate FS-11 from the network (contain without powering off)","Snapshot the certificate stores, registry keys and running service (volatile evidence)","Determine blast radius: which certificate fingerprint, which other hosts","Block the signer certificate and remove the root cert org-wide","Rebuild FS-11 from a known-good image and restore data"],"hint":"Containment first — but never at the price of powering off volatile evidence.","explain":"<p>Order: <b>isolate<\/b> (stop bleed; keep RAM alive) &rarr; <b>snapshot<\/b> (cert stores, registry, service — lose them and the case dies) &rarr; <b>blast radius<\/b> (one fingerprint tells you which of 200 hosts matter) &rarr; <b>org-wide block<\/b> (only once scoped — blocking first would blind the hunt) &rarr; <b>rebuild<\/b> (restores service at the lowest risk). The exercise is prioritisation under cost: each step protects the value of the next.<\/p>","study":"IR sequencing for trust-store incidents: contain, capture, scope, block, rebuild."},{"id":"x07","type":"branch","title":"CISO: ten minutes","note":"Board pressure, conflicting ticket, real costs.","scenario":"<p>22:50. Root certificate found on the CFO laptop; proxy logs show a spoofed bank portal serving a valid-for-that-domain certificate (AiTM). A ticket claims the cert belongs to an 'authorised pentest', but the pentest vendor is unreachable. The CISO needs a decision in 10 minutes.<\/p>","question":"Take the four decisions.","steps":[{"prompt":"Step 1 of 4 — Immediate technical action while you decide?","options":[["Block the spoofed domain at the proxy and capture the certificate fingerprint as evidence",true],["Delete the root certificate from the laptop immediately",false],["Shut down the proxy",false]]},{"prompt":"Step 2 of 4 — The pentest ticket exists but the vendor is unreachable. How do you treat the ticket?","options":[["Documented ticket is not authorisation — treat as a real incident until the vendor confirms",true],["Trust the ticket — tickets are audited documents",false],["Ignore both the ticket and the alert",false]]},{"prompt":"Step 3 of 4 — Containment of the CFO laptop, given the demo at 09:00?","options":[["Isolate the laptop now and prepare a clean loaner for the demo",true],["Isolate after the demo to protect the demo",false],["Do not isolate — a ticket exists",false]]},{"prompt":"Step 4 of 4 — Post-decision hardening for the night?","options":[["Hunt the fingerprint fleet-wide and rotate the CFO's credentials",true],["Wait for the vendor's morning report before any hunt",false],["Reissue the demo laptop only",false]]}],"hint":"The ticket reduces uncertainty by some amount — is that amount enough to bet the CFO's account?","explain":"<p>Step 1: block + capture — stop the interception <b>and<\/b> keep evidence. Step 2: an unverified ticket is <b>incomplete information<\/b>; in incident response the safe reading wins until confirmed. Step 3: isolation has a cost (the demo) — accept it and mitigate with a clean loaner; an AiTM'd CFO account costs more. Step 4: the same root cert may exist elsewhere (scope) and the CFO's credentials are <b>already exposed<\/b> to the attacker's TLS termination — rotation is mandatory. <b>Attacker view:<\/b> root cert (.004) + spoofed portal is the exact T1553.004 playbook used for credential capture.<\/p>","study":"T1553.004 in AiTM campaigns; decision-making with unverifiable authorisations."},{"id":"x08","type":"qcm","title":"Best practice that is wrong here","note":"A widely recommended rule fails on this fleet.","scenario":"<p>Best practice says: 'Alert on any execution of <code>xattr -d com.apple.quarantine<\/code>.' Your macOS fleet includes 40 CI build machines that strip and re-notarize DMGs hourly as part of the pipeline (documented, service accounts only). Since deployment, the rule fires 900 times/day; real attacks would drown.<\/p>","question":"What is the correct action for THIS environment?","options":[["Scope the alert to exclude the documented CI service accounts, keep it broad for interactive users",true],["Keep the alert as-is — best practice is best practice",false],["Disable Gatekeeper fleet-wide so the attribute is never set",false],["Block CI accounts from running xattr entirely",false]],"hint":"The rule itself is right; the question is who can legitimately perform the action.","explain":"<p>The behaviour is legitimate <b>for a specific identity and context<\/b> — so the correct tuning is <b>identity-scoped<\/b>: exclude the documented CI service accounts, keep the alert for everyone else. Keeping 900 pages/day trains analysts to ignore the alert (the real risk). Disabling Gatekeeper fleet-wide <i>creates<\/i> the T1553.001 exposure you were defending against. Blocking CI from xattr breaks the pipeline for no security gain.<\/p>","study":"Tuning analytics by identity/context — DET0288 in a fleet with legitimate automation."},{"id":"x09","type":"multi","title":"Extract the chain from the noise","note":"Eight log lines; exactly two form the trust-subversion chain.","scenario":"<p>macOS unified log, host DES-7. Two lines together form a trust-subversion chain. The rest is noise.<\/p>","artefacts":[{"label":"ARTEFACT 1 — unified log extract (filtered view)","filter":true,"lines":["2026-10-22T18:03:41Z  spotlight  indexing /Users/dana/Movies (12 items, 0 errors)","2026-10-22T18:07:02Z  process  sh -c xattr -d com.apple.quarantine /Users/dana/Downloads/SyncTool.app","2026-10-22T18:07:09Z  timemachine  backupd: snapshot mounted (3.1 GB)","2026-10-22T18:07:31Z  gatekeeper  SyncTool.app: first-run check skipped — no quarantine flag","2026-10-22T18:09:12Z  process  /Applications/SyncTool.app/Contents/MacOS/SyncTool started (uid=501)","2026-10-22T18:12:44Z  wifi  associated with network 'DES-Guest'","2026-10-22T18:15:02Z  launchservices  Finder resumed session for desktop 0","2026-10-22T18:21:37Z  mdm  inventory sync completed (0 changes)"]}],"question":"Select the TWO lines that form the trust-subversion chain.","options":[["sh -c xattr -d com.apple.quarantine .../SyncTool.app",true],["gatekeeper: first-run check skipped — no quarantine flag",true],["process SyncTool started (uid=501)",false],["timemachine snapshot mounted",false],["mdm inventory sync completed",false],["wifi associated with DES-Guest",false]],"hint":"The chain is: attribute removed + the check that was thereby skipped. Execution alone proves neither.","explain":"<p>The chain pairs the <b>cause<\/b> (xattr removing the quarantine attribute — T1553.001 attacker action) with the <b>effect<\/b> (Gatekeeper's first-run check skipped because the flag was gone). The process-start line is execution, not trust subversion — on its own it proves nothing. Time Machine, MDM, Wi-Fi and Finder lines are realistic noise; senior analysis pairs cause+effect instead of paging on any single scary word.<\/p>","study":"Correlate cause and effect lines before escalating (DET0288 correlation logic)."},{"id":"x10","type":"fill","title":"DET0452 in your own words","note":"Three blanks from the umbrella detection strategy.","scenario":"<p>Complete the summary of <b>DET0452<\/b> — Detect Subversion of Trust Controls via Certificate, Registry, and Attribute Manipulation (analytic AN1246).<\/p>","question":"Fill in the three blanks.","segments":["AN1246 correlates abnormal installation or modification of ",{"a":"root","alts":["root-ca","root ca"]}," or code-signing certificates, suspicious registry keys for ",{"a":"trust","alts":["trust provider","trust-provider"]}," providers, and unusual module loads from ",{"a":"non-standard","alts":["non-standard locations","nonstandard","unusual"]}," locations."],"hint":"Certificates, trust-provider registry keys, module loads — one adjective and two nouns.","explain":"<p>DET0452's strength is the <b>correlation<\/b>: <b>root/code-signing certificates<\/b> (T1553.002/.004), <b>trust provider registry keys<\/b> (T1553.003), and <b>module loads from non-standard locations<\/b> — plus unsigned or improperly signed executables bypassing trust prompts combined with persistence artefacts. One analytic family covering four sub-techniques is why it is called an umbrella strategy.<\/p>","study":"DET0452 and its analytics AN1246–AN1248."},{"id":"x11","type":"dragdrop","title":"Artefact to analytic","note":"Six artefacts, six analytics from the ATT&CK detection strategies.","scenario":"<p>Map each observed artefact to the analytic that fires on it. Analytics come from the T1553 detection strategies.<\/p>","question":"Drag each artefact onto its analytic.","instr":"Click or drag an artefact, then click or drop it on an analytic card.","items":["xattr -d com.apple.quarantine + unified-log trust failure","certutil -addstore -f -user ROOT ca.der executed","reg write Cryptography\\Providers\\Trust\\FinalProvider → syncflt.dll","bcdedit -set TESTSIGNING ON followed by unsigned driver load","ISO mounted from Internet; payload lacks Zone.Identifier","binary signed by a certificate issued 5 days ago, in privileged context"],"targets":["AN0800","AN0154","AN1222","AN1446","AN0712","AN0643"],"sol":[0,1,2,3,4,5],"hint":"Read each analytic's family: quarantine (macOS), store commands, SIP registry, policy tools, containers, certificates.","explain":"<p><b>AN0800<\/b> (DET0288) — quarantine/Gatekeeper manipulation on macOS. <b>AN0154<\/b> (DET0056) — commands adding certificates to trusted stores. <b>AN1222<\/b> (DET0442) — SIP/trust-provider registry tampering. <b>AN1446<\/b> (DET0523) — bcdedit/Test Signing and DSE disablement. <b>AN0712<\/b> (DET0257) — containers whose contents lack MotW. <b>AN0643<\/b> (DET0230) — unusual/recently issued certificates. Knowing which analytic owns which artefact is what makes tuning nights short.<\/p>","study":"The six detection strategies attached to T1553 and its sub-techniques."},{"id":"x12","type":"multi","title":"Controls that actually cut .002 risk","note":"Three real controls; three popular ideas that fail. Watch for the best-practice trap.","scenario":"<p>The board asks which controls genuinely reduce <b>T1553.002 Code Signing<\/b> risk. One widely repeated 'best practice' is deliberately wrong here.<\/p>","question":"Select the three controls that genuinely reduce T1553.002 risk.","options":[["Allow-list known publisher certificates for software allowed to run in privileged contexts",true],["Block or sandbox binaries signed with certificates issued within the last 30 days in privileged contexts",true],["Alert and block when executing code presents a revoked certificate",true],["Ban all self-signed binaries — that closes the gap",false],["Disable operating-system root store auto-updates to freeze trust",false],["Trust every validly signed binary — signatures imply vendor vetting",false]],"hint":"T1553.002 abuse is validly signed malware — controls must judge the certificate, not the signature's existence.","explain":"<p>Real controls judge the <b>certificate<\/b>: publisher allow-listing for privileged contexts, <b>freshness<\/b> (fraudulently bought certs are young — AN0643), and <b>revocation<\/b> enforcement. The traps: banning self-signed binaries misses the actual attack (the malware is <i>validly<\/i> signed); freezing root-store updates breaks normal trust maintenance and blinds you to CA changes; blanket trust in signatures is precisely the assumption T1553.002 exploits. ATT&amp;CK itself notes .002 'cannot be easily mitigated with preventive controls' — detection and certificate hygiene carry the weight.<\/p>","study":"T1553.002 mitigation note; DET0230 rationale."},{"id":"x13","type":"branch","title":"The isolated host kept talking","note":"Constraint: FS-11 was isolated at 14:02. New events keep arriving. Resolve the contradiction.","scenario":"<p>FS-11 was <b>isolated<\/b> (switchport shut) at 14:02. At 14:05, 14:09, 14:12 your certificate monitor logs <b>new root-cert install events attributed to FS-11<\/b>. The isolation switch logs show the port down the whole time. Two signals contradict.<\/p>","question":"Resolve the contradiction in four steps.","steps":[{"prompt":"Step 1 of 4 — What is the strongest explanation for events 'from FS-11' while its port is down?","options":[["The events are not originating from FS-11's port — another source (GPO replication, a second host using its identity, or server-side logs) is producing them",true],["Isolation does not stop processes from writing certificates",false],["The certificate monitor is broken",false]]},{"prompt":"Step 2 of 4 — Which check separates the explanations fastest?","options":[["Compare the events' GPO/MDM provenance and other hosts' logs for the same certificate fingerprint",true],["Reboot FS-11 and watch",false],["Wait an hour and re-check",false]]},{"prompt":"Step 3 of 4 — The fingerprint appears on 12 additional hosts via a GPO-linked certificate push. Scope decision?","options":[["Keep FS-11 isolated and sweep all hosts for the fingerprint before lifting anything",true],["Lift FS-11 isolation — it was not the source after all",false],["Reimage the whole domain immediately",false]]},{"prompt":"Step 4 of 4 — How does the incident timeline read now?","options":[["T1553.004 with a replication mechanism (GPO) — scope expanding; persistence via policy objects, not the endpoint",true],["Single-host T1553.004, contained at 14:02",false],["False positive — certificate monitors invent events",false]]}],"hint":"'Isolated' constrains the network port, not GPO replication or identity reuse.","explain":"<p>Step 1: isolation constrains <b>that port<\/b> — GPO-based replication, identity reuse by a second host, or server-side attribution can still emit 'FS-11' events. Step 2: provenance comparison (GPO/MDM logs + fingerprint search) is the fastest separator. Step 3: scope first, then decide about isolation — lifting it because 'FS-11 was not the source' ignores that something <i>else<\/i> pushed the cert. Step 4: the story is <b>T1553.004 via policy objects<\/b> — persistence that lives in Active Directory, not on the endpoint. This is why trust-store analytics must include the <b>source of the push<\/b>, not only the endpoint.<\/p>","study":"T1553.004 with M1028; correlate endpoint events with GPO/MDM provenance."},{"id":"x14","type":"order","title":"Kernel-mode DSE chain","note":"Turla-style sequence. Order the attacker's steps.","scenario":"<p>A CTI report describes a Turla-style sequence for disabling driver signature enforcement without a reboot-visible policy change.<\/p>","question":"Order the five steps as the attacker performed them.","items":["Exploit a signed but vulnerable driver to gain kernel-mode write access","Flip the g_CiOptions kernel variable to disable Driver Signature Enforcement","Load the unsigned rootkit driver into the kernel","Restore g_CiOptions to hide the modification window","Survive on the host while tools show no policy change at boot"],"hint":"Kernel write access must exist before any kernel variable can be touched.","explain":"<p>Chain: exploit <b>signed vulnerable driver<\/b> (the paradox attackers abuse — the loader is legitimately signed) &rarr; flip <code>g_CiOptions<\/code> (DSE off <b>in memory only<\/b>, T1553.006 via kernel variable) &rarr; load unsigned driver &rarr; restore the variable (no boot-visible artefact, no watermark) &rarr; persist quietly. <b>Defender view:<\/b> this variant leaves no <code>bcdedit<\/code> or registry trace — detections must watch for <b>vulnerable signed driver exploitation<\/b> (Exploitation for Privilege Escalation) and unsigned driver loads in memory, not only policy tools (AN1446 alone is not enough).<\/p>","study":"T1553.006 description: kernel variable tampering, g_CiOptions; Turla procedure."},{"id":"x15","type":"qcm","title":"Least aggressive correct call","note":"Single lab host, unknown cert, no network evidence yet.","scenario":"<p>One lab host (LAB-3, low value) shows an unknown root certificate. No ticket. No matching network activity. No other host affected. Budget meeting is in five minutes; a colleague shouts 'reimage it and move on'.<\/p>","question":"What is the correct senior call?","options":[["Escalate to IR with a snapshot of the certificate store and a fleet-wide fingerprint hunt — do not reimage yet",true],["Reimage LAB-3 immediately to save time",false],["Delete the certificate locally and close the ticket",false],["Do nothing — a lab host is worthless to attackers",false]],"hint":"Two options destroy the artefact or the trail; one option ignores a fleet-wide question.","explain":"<p>The certificate is an artefact: <b>image or export it before touching the host<\/b>, and ask the fleet-wide question (where else is this fingerprint?). Reimaging destroys evidence and answers nothing; deleting the cert destroys the artefact <i>and<\/i> leaves the distribution mechanism unknown; ignoring it assumes scope you have not measured. <b>Escalate with evidence<\/b> is the least aggressive correct action — and often the fastest to close, because the fingerprint hunt either finds the source or clears the fleet.<\/p>","study":"Evidence preservation before remediation; hunt by certificate fingerprint."},{"id":"x16","type":"multi","title":"Coverage with a telemetry gap","note":"No EDR on the macOS fleet. What is defensible?","scenario":"<p>You discover your macOS fleet has <b>no EDR<\/b>; T1553.001/.004 on macOS would be invisible. Rollout of EDR takes 4 months. The CISO asks what is defensible <i>today<\/i>. Incomplete information is part of the game.<\/p>","question":"Select the three defensible interim actions.","options":[["Query MDM for installed root certificates and configuration profiles across the fleet",true],["Deploy compensating network telemetry (proxy TLS/pinning logs) to spot trust anomalies",true],["Document the gap in the risk register with a dated remediation plan",true],["Assume the fleet is clean until EDR arrives",false],["Reimage the entire macOS fleet this weekend",false],["Take no action until the EDR rollout completes",false]],"hint":"Defensible = produces some evidence today, or documents the risk honestly. Two options do neither.","explain":"<p>With no endpoint telemetry, you still have <b>MDM<\/b> (root certs and profiles are inventoried there — a direct T1553.004 check), <b>network-side<\/b> signals (proxy logs revealing trust anomalies, pinning failures), and <b>honest risk documentation<\/b> with dates and owners — that is what a GRC reviewer means by 'compensating controls'. Assuming cleanliness is unmeasured risk; a fleet-wide reimage is a business outage disproportionate to the threat; waiting four months is the same as assuming.<\/p>","study":"Compensating controls and risk acceptance when telemetry has gaps."}];
var S = {
  phase:'intro', order:[], cur:0, reviewMode:false,
  st:{},            /* id -> {status:pending|checked|skipped, credit, hint, answer} */
  tm:{state:'IDLE', left:0, last:null, pausedManual:0, pausedAuto:0, iv:null},
  sum:0, answered:0, reported:false, user:{name:'',country:'',locale:''}
};

/* ===================== timer state machine ===================== */
/* states: IDLE -> RUNNING <-> PAUSED_MANUAL / PAUSED_AUTO_CHECK -> ENDED */
function tmSet(state){
  S.tm.state=state; renderHeader();
}
function tmRunning(){return S.tm.state==='RUNNING';}
function tmTick(){
  if(S.tm.state!=='RUNNING')return;
  S.tm.left-=1;
  if(S.tm.left<=0){S.tm.left=0; endByTimeout(); return;}
  renderHeader();
}
function tmStart(){
  S.tm.left=META.estimatedMinutes*60;
  if(S.tm.iv)clearInterval(S.tm.iv);
  S.tm.iv=setInterval(tmTick,1000);
  tmSet('RUNNING');
}
function tmStopAll(){if(S.tm.iv)clearInterval(S.tm.iv);S.tm.iv=null;}
function endByTimeout(){
  tmStopAll(); tmSet('ENDED');
  /* current unanswered exercise becomes skipped */
  var ex=curEx();
  if(ex && S.st[ex.id] && S.st[ex.id].status==='pending'){S.st[ex.id].status='skipped';}
  showResults(true);
}

  else if(S.tm.state==='PAUSED_MANUAL'){st.className='state-word st-pause';st.innerHTML='&#10074;&#10074; PAUSED &mdash; manual (press Resume)';pc.innerHTML='&#9654; Resume';pc.disabled=false;}

  else {st.className='state-word st-run';st.innerHTML='&#9654; READY';pc.disabled=true;}
  var pct=S.answered>0?Math.round((S.sum/S.answered)*100):0;

  var prog=S.phase==='intro'?0:(S.phase==='results'?100:Math.round(((S.cur)/Math.max(1,total))*100+(100/Math.max(1,total))*(S.phase==='review'?1:0)));
  if(S.phase==='review')prog=100;
  var bar=$('#h-bar');if(bar){bar.style.width=prog+'%';bar.style.setProperty('--sev-col',sevVar());bar.style.background='linear-gradient(90deg,'+sevVar()+',var(--accent-blue))';}
  var hintB=$('#b-hint'),skipB=$('#b-skip');
  var interactive=(S.phase==='exam')&&ex&&S.st[ex.id].status==='pending'&&S.tm.state==='RUNNING';
  hintB.disabled=!interactive||S.st[ex.id].hint;
  skipB.disabled=!interactive;
}

er detections catch the quiet paths — and blue teams close those gaps next quarter.<\/li>\n<\/ul>\n<p>Every exercise chains at least three ideas. Read every artefact, expect one to be a decoy, and expect one option that is technically defensible somewhere else — but not here.<\/p>\n";

/* ===================== flow ===================== */
function curEx(){return S.phase==='exam'?EXAMS[S.order[S.cur]]:null;}
function stOf(id){if(!S.st[id])S.st[id]={status:'pending',credit:0,hint:false};return S.st[id];}
function startExam(){
  S.order=shuffle(EXAMS.map(function(e,i){return i;}));
  S.st={};S.sum=0;S.answered=0;S.reported=false;S.reviewMode=false;S.cur=0;S.tmPrev='RUNNING';
  EXAMS.forEach(function(e){S.st[e.id]={status:'pending',credit:0,hint:false};});
  S.phase='exam';
  tmStart();
  showExercise(0,false);
}
function labelFor(i,total){
  if(total===1)return '';
  return 'Exercise '+(i+1)+' of '+total;
}
function showExercise(i,fromReview){
  if(i>=S.order.length){showReview();return;}
  S.cur=i;S.reviewMode=!!fromReview;S.phase='exam';
  var ex=EXAMS[S.order[i]];
  renderCard(ex);
  renderHeader();
}
function renderCard(ex){
  var app=$('#app');app.innerHTML='';
  var w=el('div','wrap');w.id='ex-wrap';
  var st=stOf(ex.id);
  var pos=el('div','kicker mono');pos.style.letterSpacing='1px';
  pos.innerHTML=labelFor(S.cur,S.order.length)+' &mdash; '+esc(ex.title);
  w.appendChild(pos);
  /* SCENARIO */
  var sc=el('div','blk blk-s');
  var scH=el('div','blk-h');
  scH.innerHTML='<span class="ic">&#128209;</span> SCENARIO';
  var colBtn=el('button','hdr-btn');colBtn.style.marginLeft='auto';colBtn.style.minHeight='28px';colBtn.style.padding='2px 10px';
  colBtn.textContent='Collapse';colBtn.setAttribute('aria-expanded','true');
  scH.appendChild(colBtn);
  sc.appendChild(scH);
  var scBody=el('div');scBody.innerHTML=(ex.note?'<p class="m">'+esc(ex.note)+'</p>':'')+ex.scenario;
  sc.appendChild(scBody);
  var summary=el('p','m');summary.style.display='none';summary.innerHTML='<b>Collapsed:</b> '+esc(ex.collapsible||ex.title);
  sc.appendChild(summary);
  colBtn.addEventListener('click',function(){
    var open=scBody.style.display!=='none';
    scBody.style.display=open?'none':'';summary.style.display=open?'':'none';
    colBtn.textContent=open?'Expand':'Collapse';
    colBtn.setAttribute('aria-expanded',String(!open));
  });
  (ex.artefacts||[]).forEach(function(a){sc.appendChild(buildArtefact(a));});
  w.appendChild(sc);
  /* QUESTION */
  var q=el('div','blk blk-q');
  q.innerHTML='<div class="blk-h"><span class="ic">&#10067;</span> QUESTION</div><div class="qtext">'+ex.question+'</div>';
  w.appendChild(q);
  /* YOUR ANSWER */
  var an=el('div','blk blk-a');
  an.innerHTML='<div class="blk-h"><span class="ic">&#9997;&#65039;</span> YOUR ANSWER</div>';
  var box=el('div');box.id='ansbox';
  an.appendChild(box);
  if(st.hint){box.appendChild(buildHint(ex));}
  w.appendChild(an);
  var fb=el('div');fb.id='fb';
  w.appendChild(fb);
  /* actions */
  var acts=el('div','acts');
  var bCheck=el('button','btn primary');bCheck.id='b-check';bCheck.innerHTML='&#10003; Check answer';
  var bNext=el('button','btn');bNext.id='b-next';bNext.disabled=true;
  acts.appendChild(bCheck);acts.appendChild(bNext);
  w.appendChild(acts);
  app.appendChild(w);
  buildWidget(ex,box);
  bCheck.addEventListener('click',function(){checkCurrent();});
  bNext.addEventListener('click',nextAction);
  updateActions(ex);
}
function buildArtefact(a){
  var d=el('div','art');
  var h=el('div','art-h');
  h.innerHTML='<span>'+esc(a.label)+'</span><span class="grow"></span>';
  d.appendChild(h);
  var pre=el('pre','code');
  var lines=a.lines||String(a.code||'').split('\n');
  if(a.filter){
    var fi=document.createElement('input');fi.className='art-filter';fi.placeholder='filter lines&hellip;';fi.setAttribute('aria-label','filter log lines');
    h.appendChild(fi);
    var body=el('div');body.style.padding='6px 0';
    var render=function(f){
      body.innerHTML='';
      lines.forEach(function(l){
        if(!f||l.toLowerCase().indexOf(f.toLowerCase())>=0){
          var ln=el('div');ln.style.padding='1px 12px';ln.innerHTML=hl(l)||'&nbsp;';body.appendChild(ln);
        }
      });
    };
    fi.addEventListener('input',function(){render(fi.value.trim());});
    render('');
    d.appendChild(body);
  }else{
    pre.innerHTML=lines.map(function(l){return hl(l)||'&nbsp;';}).join('\n');
    d.appendChild(pre);
  }
  return d;
}
function buildHint(ex){
  return el('div','hintbox','<div class="hh">&#9432; Hint used &mdash; credit &minus;0.10 for this exercise</div>'+esc(ex.hint||''));
}
function updateActions(ex){
  var st=stOf(ex.id);
  var bCheck=$('#b-check'),bNext=$('#b-next');
  if(!bCheck)return;
  if(st.status==='checked'){
    bCheck.disabled=true;
    var skippedLeft=S.order.some(function(idx,k){return S.st[EXAMS[idx].id].status!=='checked';});
    var isLast=S.cur>=S.order.length-1;
    if(S.reviewMode){bNext.disabled=false;bNext.innerHTML='&#9664; Back to review';}
    else if(isLast){bNext.disabled=false;bNext.innerHTML=skippedLeft?'&#9888; Review skipped ('+(S.order.length-S.answered)+')':'&#9632; Final Submit';}
    else{bNext.disabled=false;bNext.innerHTML='Next &#9654;';}
  }else{
    bCheck.disabled=false;bNext.disabled=true;bNext.innerHTML='Next &#9654;';
  }
}
function checkCurrent(){
  var ex=curEx();if(!ex)return;
  var st=stOf(ex.id);
  if((st.status!=='pending'&&st.status!=='skipped')||S.tm.state==='ENDED')return;
  /* FIRST ACTION: auto-pause (mandatory) */
  if(S.tm.state==='RUNNING'){S.tmPrev='RUNNING';tmSet('PAUSED_AUTO_CHECK');}
  var res=gradeEx(ex,$('#ansbox'));
  var raw=scoreExercise(res.H,res.W,res.N);
  var credit=raw;
  if(st.hint)credit=Math.max(0,+(credit-0.10).toFixed(2));
  st.status='checked';st.credit=credit;
  S.sum+=credit;S.answered=S.order.map(function(i){return EXAMS[i].id;}).filter(function(id){return S.st[id].status==='checked';}).length;
  renderFeedback(ex,res,credit,raw);
  updateActions(ex);renderHeader();
}
function renderFeedback(ex,res,credit,raw){
  var fb=$('#fb');fb.innerHTML='';
  var cls=credit===1?'fb-correct':(credit>0?'fb-partial':'fb-incorrect');
  var label=credit===1?'&#10003; CORRECT':(credit>0?'&#10003; PARTIALLY CORRECT':'&#10007; INCORRECT');
  var col=credit===1?'var(--state-correct)':(credit>0?'var(--state-partial)':'var(--state-incorrect)');
  var d=el('div','fb '+cls);
  var creditTxt='';
  if(res.N>1||res.type==='terminal'){
    creditTxt='<span class="fb-credit">credit '+credit.toFixed(2)+' &mdash; '+res.H+'/'+res.N+' items'+(res.W?' &middot; '+res.W+' wrong':'')+'</span>';
  }else{creditTxt='<span class="fb-credit">credit '+credit.toFixed(2)+'</span>';}
  d.innerHTML='<div class="fb-label" style="color:'+col+'"><span>'+label+'</span>'+creditTxt+
    (stOf(ex.id).hint?'<span class="fb-credit">&#9432; hint used &minus;0.10</span>':'')+
    (res.danger?'<span class="fb-credit" style="color:var(--state-incorrect);border-color:var(--state-incorrect)">&#10071; DANGEROUS &mdash; NEAR MISS</span>':'')+
    '</div>';
  if(res.rows&&res.rows.length){
    res.rows.forEach(function(r){
      var ic=r.s==='ok'?['&#10003; Correct','ri-ok']:(r.s==='bad'?['&#10007; Wrong','ri-bad']:['&#9675; Missed','ri-miss']);
      var row=el('div','rowitem');
      row.innerHTML='<span class="'+ic[1]+'">'+ic[0]+'</span><span>'+r.t+'</span>';
      d.appendChild(row);
    });
  }
  if(res.correct){d.appendChild(el('p','explain','<b>Correct answer:</b> '+res.correct));}
  d.appendChild(el('div','explain',ex.explain||''));
  if(ex.study){d.appendChild(el('div','study','<b>What to study:</b> '+esc(ex.study)));}
  fb.appendChild(d);
  try{d.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}
}
function nextAction(){
  var ex=curEx();
  if(S.tm.state==='PAUSED_AUTO_CHECK'){tmSet(S.reviewMode?'RUNNING':'RUNNING');}
  if(S.reviewMode){showReview();return;}
  if(S.cur>=S.order.length-1){
    var pending=S.order.filter(function(i){return S.st[EXAMS[i].id].status!=='checked';}).length;
    if(pending>0){showReview();}
    else{showResults(false);}
  }else{showExercise(S.cur+1,false);}
}
function skipCurrent(){
  var ex=curEx();if(!ex)return;
  var st=stOf(ex.id);
  if(st.status!=='pending'||S.tm.state!=='RUNNING')return;
  st.status='skipped';
  fbSkipNote(ex);
  if(S.reviewMode||S.cur>=S.order.length-1){showReview();}
  else{showExercise(S.cur+1,false);}
  renderHeader();
}
function fbSkipNote(ex){
  var fb=$('#fb');fb.innerHTML='';
  fb.appendChild(el('div','fb fb-skipped','<div class="fb-label" style="color:var(--state-skipped)"><span>&#9888; SKIPPED &mdash; MOVED TO REVIEW POOL</span></div><p class="explain m">This exercise was skipped without revealing the answer. You can answer it later from the review screen. If it is never answered, it is excluded from your score.</p>'));
  var bCheck=$('#b-check');if(bCheck)bCheck.disabled=true;
}
function useHint(){
  var ex=curEx();if(!ex)return;
  var st=stOf(ex.id);
  if((st.status!=='pending'&&st.status!=='skipped')||st.hint||S.tm.state!=='RUNNING')return;
  st.hint=true;
  var box=$('#ansbox');
  if(box&&!box.querySelector('.hintbox'))box.insertBefore(buildHint(ex),box.firstChild);
  renderHeader();
}
/* ===================== manual pause ===================== */
function toggleManualPause(){
  var exWrap=$('#ex-wrap');
  if(S.tm.state==='RUNNING'||S.tm.state==='PAUSED_AUTO_CHECK'){
    S.tmPrev=S.tm.state;
    S.tm._runningAt=Date.now();
    tmSet('PAUSED_MANUAL');
    if(exWrap)exWrap.style.display='none';
    showPauseOverlay();
  }else if(S.tm.state==='PAUSED_MANUAL'){
    if(S.tm._runningAt){var dt=Math.round((Date.now()-S.tm._runningAt)/1000);S.tm.pausedManual+=dt;S.tm._runningAt=null;}
    tmSet(S.tmPrev||'RUNNING');
    hidePauseOverlay();
    if(exWrap)exWrap.style.display='';
  }
  renderHeader();
}
function showPauseOverlay(){
  var app=$('#app');
  if(!app.querySelector('.pause-ov')){
    var ov=el('div','pause-ov','&#10074;&#10074; PAUSED &mdash; manual break<br><span class="m" style="font-size:14px;color:var(--text-secondary)">The exercise is hidden and the timer is stopped. Press Resume in the header to continue.</span>');
    ov.id='pause-ov';app.appendChild(ov);
  }else{$('#pause-ov').style.display='';}
}
function hidePauseOverlay(){var ov=$('#pause-ov');if(ov)ov.style.display='none';}

/* ===================== review skipped ===================== */
function showReview(){
  S.phase='review';renderHeader();
  if(S.tm.state==='PAUSED_AUTO_CHECK')tmSet('RUNNING');
  var app=$('#app');app.innerHTML='';
  var w=el('div','wrap');
  w.appendChild(el('div','card','<div class="kicker">Before you finish</div><h1>&#9888; Review skipped exercises</h1>'+
    '<p class="m">These exercises were skipped and never answered. You can return to each one and answer it as many times as you need while the timer is running. If you submit while some are still unanswered, they are <b>excluded from your score</b> &mdash; they count neither for you nor against you.</p>'));
  var pending=[];
  S.order.forEach(function(idx,k){var ex=EXAMS[idx];if(S.st[ex.id].status!=='checked')pending.push({ex:ex,k:k});});
  if(pending.length===0){
    w.appendChild(el('div','card','<p>&#10003; Nothing skipped &mdash; every exercise was answered.</p>'));
  }else{
    var c=el('div','card');
    pending.forEach(function(p){
      var row=el('div','rev-row');
      var wasSkipped=S.st[p.ex.id].status==='skipped';
      row.innerHTML='<span class="warn">&#9888; '+(wasSkipped?'Skipped':'Not answered yet')+'</span><span class="t">'+esc(p.ex.title)+'</span>';
      var b=el('button','btn');b.innerHTML='Answer &#9654;';
      b.addEventListener('click',function(){showExercise(p.k,true);});
      row.appendChild(b);c.appendChild(row);
    });
    w.appendChild(c);
  }
  var c2=el('div','card');
  c2.innerHTML='<div class="acts"><button class="btn primary big" id="b-final">&#9632; Final Submit</button></div>'+
    '<p class="m" style="margin-top:10px">Answered so far: <b>'+S.answered+' of '+S.order.length+'</b> &middot; live score <b>'+S.sum.toFixed(1)+' / '+S.answered+'</b></p>';
  w.appendChild(c2);
  app.appendChild(w);
  $('#b-final').addEventListener('click',function(){showResults(false);});
  renderHeader();
}

/* ===================== results ===================== */
function showResults(byTimeout){
  if(S.tm.state!=='ENDED'){tmStopAll();tmSet('ENDED');}
  if(S.tm._runningAt){var dt=Math.round((Date.now()-S.tm._runningAt)/1000);S.tm.pausedManual+=dt;S.tm._runningAt=null;}
  S.phase='results';
  var full=0,part=0,zero=0,skipped=0,partSum=0;
  S.order.forEach(function(idx){var st=S.st[EXAMS[idx].id];
    if(st.status!=='checked'){skipped++;return;}
    if(st.credit>=1)full++;else if(st.credit>0){part++;partSum+=st.credit;}else zero++;});
  var percent=S.answered>0?Math.round((S.sum/S.answered)*100):0;
  var passed=percent>=META.passMark;
  renderHeader();
  var app=$('#app');app.innerHTML='';
  var w=el('div','wrap');
  var v=el('div','verdict '+(passed?'pass':'fail'));
  v.innerHTML='<div class="v-word">'+(passed?'&#10003; PASS':'&#10007; FAIL')+'</div>'+
    '<div class="v-sub">'+(passed?'Certification-style result: you reached the pass mark.':'You did not reach the pass mark this time. Review the explanations and retake the exam.')+'</div>'+
    '<div class="v-sub"><b style="color:var(--text-primary);font-family:var(--font-mono)">'+S.sum.toFixed(1)+' / '+S.answered+'</b> answered &middot; <b style="color:var(--text-primary);font-family:var(--font-mono)">'+percent+'%</b> (pass mark '+META.passMark+'%)'+
    (byTimeout?' &middot; <span style="color:var(--state-paused)">&#10074;&#10074; time ran out &mdash; timer ended</span>':'')+'</div>';
  w.appendChild(v);
  var g=el('div','res-grid');
  var avg=part>0?(partSum/part).toFixed(2):'&mdash;';
  g.innerHTML=
    '<div class="res-cell"><div class="num c-correct">'+full+'</div><div class="lab">&#10003; Fully correct</div></div>'+
    '<div class="res-cell"><div class="num c-partial">'+part+'</div><div class="lab">&#10003; Partially correct'+(part>0?' &middot; avg '+avg:'')+'</div></div>'+
    '<div class="res-cell"><div class="num c-incorrect">'+zero+'</div><div class="lab">&#10007; Fully incorrect</div></div>'+
    '<div class="res-cell"><div class="num c-skipped">'+skipped+'</div><div class="lab">&#9888; Skipped &mdash; excluded</div></div>';
  w.appendChild(g);
  var time=el('div','card');
  time.innerHTML='<h2>&#9201; Time &amp; pauses</h2><div class="res-grid">'+
    '<div class="res-cell"><div class="num">'+fmt(META.estimatedMinutes*60-S.tm.left)+'</div><div class="lab">time used of '+META.estimatedMinutes+':00 budget</div></div>'+
    '<div class="res-cell"><div class="num">'+fmt(S.tm.pausedManual)+'</div><div class="lab">&#10074;&#10074; paused manually (break)</div></div>'+
    '<div class="res-cell"><div class="num">'+fmt(S.tm.pausedAuto)+'</div><div class="lab">&#10074;&#10074; paused reviewing feedback</div></div></div>';
  w.appendChild(time);
  var rec=el('div','card');rec.innerHTML='<h2>&#128203; Exercise recap</h2>';
  var rc=el('div','recap');
  S.order.forEach(function(idx){
    var ex=EXAMS[idx],st=S.st[ex.id];
    var ic,cl,cr;
    if(st.status!=='checked'){ic='&#9888; Skipped &mdash; excluded';cl='c-skipped';cr='&mdash;';}
    else if(st.credit>=1){ic='&#10003; Fully correct';cl='c-correct';cr=st.credit.toFixed(2);}
    else if(st.credit>0){ic='&#10003; Partially correct';cl='c-partial';cr=st.credit.toFixed(2);}
    else{ic='&#10007; Fully incorrect';cl='c-incorrect';cr='0.00';}
    var row=el('div','recap-row');
    row.innerHTML='<span class="id">'+esc(ex.id)+'</span><span class="'+cl+'">'+ic+'</span><span>'+esc(ex.title)+'</span><span class="cr">'+cr+'</span>';
    rc.appendChild(row);
  });
  rec.appendChild(rc);w.appendChild(rec);
  var again=el('div','card');
  again.innerHTML='<div class="acts"><button class="btn primary big" id="b-retake">&#8635; Retake exam</button></div>'+
    '<p class="m" style="margin-top:8px">Retaking reshuffles the exercise order and all answer choices, resets the timer and clears your score.</p>';
  w.appendChild(again);
  app.appendChild(w);
  $('#b-retake').addEventListener('click',retake);
  reportScore(S.sum,S.answered);
}
function retake(){
  startExam();
  window.scrollTo(0,0);
}

/* ===================== site integration ===================== */
function reportScore(creditSum,answeredCount){
  if(S.reported)return;S.reported=true;
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:META.topicId,batch:META.batch,
      score:Math.round(creditSum),total:answeredCount,
      percent:percent,passed:percent>=META.passMark
    },location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  S.user={name:event.data.username||'',country:event.data.country||'',locale:event.data.locale||''};
  /* theme field is always 'dark' — the file is dark-only, nothing to toggle */
  if(S.phase==='intro'){var k=$('#app .meta-grid');if(k&&S.user.name)renderIntro();}
});

/* ===================== widgets & grading ===================== */
function letters(i){return String.fromCharCode(65+i)+'. ';}
function lockBox(box){box.style.pointerEvents='none';}

function buildWidget(ex,box){
  var t=ex.type;
  if(t==='qcm'||t==='tf'||t==='multi')buildChoice(ex,box);
  else if(t==='match')buildMatch(ex,box);
  else if(t==='dragdrop')buildDD(ex,box);
  else if(t==='fill')buildFill(ex,box);
  else if(t==='order')buildOrder(ex,box);
  else if(t==='terminal')buildTerm(ex,box);
  else if(t==='triage')buildTriage(ex,box);
  else if(t==='branch')buildBranch(ex,box);
}

/* ---------- choice: qcm / tf / multi ---------- */
function buildChoice(ex,box){
  var opts=ex.options.map(function(o,i){return {t:o[0],ok:!!o[1],i:i};});
  if(ex.fixed!==true)opts=shuffle(opts);
  box._w={opts:opts,sel:{},multi:ex.type==='multi'};
  if(ex.instr)box.appendChild(el('p','m',esc(ex.instr)));
  opts.forEach(function(o,k){
    var b=el('button','opt');b.type='button';
    b.innerHTML='<span class="lab">'+letters(k)+'</span><span>'+esc(o.t)+'</span><span class="mark">&#10003;</span>';
    b.addEventListener('click',function(){
      if(box._w.multi){box._w.sel[o.i]=!box._w.sel[o.i];b.classList.toggle('sel',!!box._w.sel[o.i]);}
      else{
        box._w.sel={};box.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel');});
        box._w.sel[o.i]=true;b.classList.add('sel');
      }
    });
    b.dataset.oi=o.i;box.appendChild(b);
  });
}
function gradeChoice(ex,box){
  var w=box._w,res={type:ex.type,N:0,H:0,W:0,rows:[],correct:''};
  var okOpts=w.opts.filter(function(o){return o.ok;});
  if(w.multi){
    res.N=okOpts.length;
    w.opts.forEach(function(o){
      var s=!!w.sel[o.i];
      if(o.ok&&s){res.H++;res.rows.push({s:'ok',t:esc(o.t)});}
      else if(o.ok&&!s){res.rows.push({s:'miss',t:esc(o.t)});}
      else if(!o.ok&&s){res.W++;res.rows.push({s:'bad',t:esc(o.t)});}
    });
    res.correct=okOpts.map(function(o){return esc(o.t);}).join(' &middot; ');
    w.opts.forEach(function(o){
      var b=box.querySelector('.opt[data-oi="'+o.i+'"]');
      if(b){if(o.ok)b.classList.add('good');else if(w.sel[o.i])b.classList.add('bad');b.disabled=true;}
    });
  }else{
    res.N=1;
    var chosen=w.opts.filter(function(o){return w.sel[o.i];})[0];
    var okO=okOpts[0];
    if(chosen&&chosen.ok){res.H=1;res.rows.push({s:'ok',t:esc(chosen.t)});}
    else if(chosen&&!chosen.ok){res.W=1;res.rows.push({s:'bad',t:esc(chosen.t)});}
    else{res.rows.push({s:'miss',t:'no answer selected'});}
    res.correct=esc(okO.t);
    w.opts.forEach(function(o){
      var b=box.querySelector('.opt[data-oi="'+o.i+'"]');
      if(b){if(o.ok)b.classList.add('good');else if(w.sel[o.i])b.classList.add('bad');b.disabled=true;}
    });
  }
  return res;
}

/* ---------- match ---------- */
function buildMatch(ex,box){
  var right=ex.right.map(function(t,i){return {t:t,i:i};});
  var rSh=shuffle(right);
  box._w={matchOf:ex.left.map(function(){return null;}),rSh:rSh,pick:null};
  var grid=el('div','match-row');
  var lc=el('div'),rc=el('div');
  lc.appendChild(el('div','mcol-h','Items'));
  rc.appendChild(el('div','mcol-h','Matches'));
  ex.left.forEach(function(t,i){
    var d=el('div','mitem');d.innerHTML='<span class="lab mono">'+letters(i)+'</span>'+esc(t);
    d.dataset.li=i;d.setAttribute('role','button');d.tabIndex=0;
    d.addEventListener('click',function(){selectLeft(i,box);});
    lc.appendChild(d);
  });
  rSh.forEach(function(r,k){
    var d=el('div','mitem');d.innerHTML=esc(r.t)+'<br><span class="pair-tag" data-rt="'+r.i+'">&nbsp;</span>';
    d.dataset.ri=r.i;d.setAttribute('role','button');d.tabIndex=0;
    d.addEventListener('click',function(){pickRight(r.i,box);});
    rc.appendChild(d);
  });
  grid.appendChild(lc);grid.appendChild(rc);
  box.appendChild(grid);
  var rst=el('button','btn');rst.innerHTML='&#8635; Reset pairs';
  rst.addEventListener('click',function(){
    box._w.matchOf=ex.left.map(function(){return null;});box._w.pick=null;
    box.querySelectorAll('.mitem').forEach(function(m){m.classList.remove('pick');});
    box.querySelectorAll('.pair-tag').forEach(function(p){p.innerHTML='&nbsp;';});
  });
  box.appendChild(rst);
}
function selectLeft(i,box){
  box._w.pick=(box._w.pick===i)?null:i;
  box.querySelectorAll('.mitem').forEach(function(m){if(m.dataset.li!==undefined)m.classList.toggle('pick',Number(m.dataset.li)===box._w.pick);});
}
function pickRight(ri,box){
  if(box._w.pick===null)return;
  var prev=box._w.matchOf.indexOf(ri);
  if(prev>=0)box._w.matchOf[prev]=null;
  box._w.matchOf[box._w.pick]=ri;box._w.pick=null;
  box.querySelectorAll('.mitem').forEach(function(m){m.classList.remove('pick');});
  box._w.matchOf.forEach(function(r,li){
    var tag=box.querySelector('.pair-tag[data-rt="'+r+'"]');
    box.querySelectorAll('.pair-tag').forEach(function(p){if(Number(p.dataset.rt)===r)p.innerHTML='&nbsp;';});
    if(tag!==null&&tag){var lt=box.querySelector('.mitem[data-li="'+li+'"] .lab');if(lt)tag.innerHTML='&#8592; '+esc(lt.textContent);}
  });
}
function gradeMatch(ex,box){
  var w=box._w,res={type:'match',N:ex.left.length,H:0,W:0,rows:[],correct:''};
  ex.left.forEach(function(t,i){
    var j=w.matchOf[i];
    var rightText=j===null?'not matched':esc(ex.right[j]);
    if(j===i){res.H++;res.rows.push({s:'ok',t:esc(t)+' &rarr; '+rightText});}
    else if(j===null){res.rows.push({s:'miss',t:esc(t)+' &rarr; correct match: '+esc(ex.right[i])});}
    else{res.W++;res.rows.push({s:'bad',t:esc(t)+' &rarr; '+rightText+' (correct: '+esc(ex.right[i])+')'});}
  });
  res.correct=ex.left.map(function(t,i){return esc(t)+' &rarr; '+esc(ex.right[i]);}).join(' &middot; ');
  lockBox(box);
  return res;
}

/* ---------- drag & drop ---------- */
function buildDD(ex,box){
  var order=shuffle(ex.items.map(function(t,i){return i;}));
  box._w={placed:ex.items.map(function(){return null;}),picked:null,order:order,ex:ex};
  box.appendChild(el('p','m',esc(ex.instr||'Drag each item to the right target, or click an item and then click a target.')));
  var bank=el('div','bank');bank.id='dd-bank';
  box.appendChild(bank);
  var zonesWrap=el('div');
  ex.targets.forEach(function(t,zi){
    var z=el('div','zone');z.dataset.zi=zi;
    z.innerHTML='<div class="z-label">'+esc(t)+'</div><div class="z-body"></div>';
    z.addEventListener('click',function(){dropTo(zi,box);});
    z.addEventListener('dragover',function(ev){ev.preventDefault();z.classList.add('over');});
    z.addEventListener('dragleave',function(){z.classList.remove('over');});
    z.addEventListener('drop',function(ev){ev.preventDefault();z.classList.remove('over');dropTo(zi,box);});
    zonesWrap.appendChild(z);
  });
  box.appendChild(zonesWrap);
  var rst=el('button','btn');rst.innerHTML='&#8635; Reset placements';
  rst.addEventListener('click',function(){
    box._w.placed=ex.items.map(function(){return null;});box._w.picked=null;redrawDD(ex,box);
  });
  box.appendChild(rst);
  redrawDD(ex,box);
}
function redrawDD(ex,box){
  var bank=$('#dd-bank');if(!bank)return;bank.innerHTML='';
  var zbs=box.querySelectorAll('.z-body');zbs.forEach(function(z){z.innerHTML='';});
  box._w.order.forEach(function(ii){
    var chip=el('span','chip');chip.textContent=ex.items[ii];chip.draggable=true;chip.dataset.ii=ii;
    chip.addEventListener('dragstart',function(ev){ev.dataTransfer.setData('text/plain',String(ii));box._w.picked=ii;});
    chip.addEventListener('click',function(){box._w.picked=(box._w.picked===ii)?null:ii;redrawDD(ex,box);});
    if(box._w.placed[ii]===null)bank.appendChild(chip);
    else{
      var zi=box._w.placed[ii];
      chip.className='chip mine';
      box.querySelectorAll('.z-body')[zi].appendChild(chip);
    }
  });
  box.querySelectorAll('.chip').forEach(function(c){
    c.classList.toggle('picked',Number(c.dataset.ii)===box._w.picked);
  });
}
function dropTo(zi,box){
  var p=box._w.picked;
  if(p===null)return;
  var from=box._w.placed.indexOf(zi);
  if(from>=0)box._w.placed[from]=null;
  box._w.placed[p]=zi;box._w.picked=null;
  redrawDD(box._w.ex,box);
}
function gradeDD(ex,box){
  box._w.ex=ex;
  var w=box._w,res={type:'dragdrop',N:ex.items.length,H:0,W:0,rows:[],correct:''};
  ex.items.forEach(function(t,i){
    var p=w.placed[i];
    if(p===null)res.rows.push({s:'miss',t:esc(t)+' &rarr; not placed (correct: '+esc(ex.targets[ex.sol[i]])+')'});
    else if(p===ex.sol[i]){res.H++;res.rows.push({s:'ok',t:esc(t)+' &rarr; '+esc(ex.targets[p])});}
    else{res.W++;res.rows.push({s:'bad',t:esc(t)+' &rarr; '+esc(ex.targets[p])+' (correct: '+esc(ex.targets[ex.sol[i]])+')'});}
  });
  res.correct=ex.items.map(function(t,i){return esc(t)+' &rarr; '+esc(ex.targets[ex.sol[i]]);}).join(' &middot; ');
  lockBox(box);
  return res;
}

/* ---------- fill in the blank ---------- */
function buildFill(ex,box){
  box._w={inputs:[]};
  var wrap=el('div');wrap.style.lineHeight='2.1';wrap.style.fontSize='15.5px';
  ex.segments.forEach(function(seg){
    if(typeof seg==='string'){wrap.appendChild(document.createTextNode(seg));}
    else{
      var inp=document.createElement('input');inp.className='fill-input';inp.spellcheck=false;
      inp.style.width=Math.max(120,(seg.a.length+6)*9)+'px';inp.setAttribute('aria-label','blank');
      wrap.appendChild(inp);box._w.inputs.push({el:inp,a:seg.a,alts:seg.alts||[]});
    }
  });
  box.appendChild(wrap);
}
function gradeFill(ex,box){
  var w=box._w,res={type:'fill',N:w.inputs.length,H:0,W:0,rows:[],correct:''};
  w.inputs.forEach(function(b,k){
    var v=norm(b.el.value);
    if(v===''){res.rows.push({s:'miss',t:'blank '+(k+1)+' &mdash; correct: <code>'+esc(b.a)+'</code>'});}
    else if(v===norm(b.a)||b.alts.map(norm).indexOf(v)>=0){res.H++;b.el.classList.add('good');res.rows.push({s:'ok',t:'blank '+(k+1)+': <code>'+esc(b.el.value.trim())+'</code>'});}
    else{res.W++;b.el.classList.add('bad');res.rows.push({s:'bad',t:'blank '+(k+1)+': <code>'+esc(b.el.value.trim())+'</code> &mdash; correct: <code>'+esc(b.a)+'</code>'});}
    b.el.disabled=true;
  });
  res.correct=w.inputs.map(function(b){return '<code>'+esc(b.a)+'</code>';}).join(' &middot; ');
  return res;
}

/* ---------- ordering ---------- */
function buildOrder(ex,box){
  var idx=shuffle(ex.items.map(function(t,i){return i;}));
  box._w={seq:idx};
  box.appendChild(el('p','m',esc(ex.instr||'Put the steps in the correct order. Use the arrow buttons or drag to reorder.')));
  var list=el('div');list.id='ord-list';box.appendChild(list);
  redrawOrder(ex,box);
}
function redrawOrder(ex,box){
  var list=$('#ord-list');list.innerHTML='';
  box._w.seq.forEach(function(ii,pos){
    var row=el('div','ord-item');
    row.innerHTML='<span class="n">'+(pos+1)+'.</span><span class="txt">'+esc(ex.items[ii])+'</span>';
    var up=el('button');up.type='button';up.innerHTML='&uarr;';up.setAttribute('aria-label','move up');
    up.addEventListener('click',function(){if(pos>0){var s=box._w.seq;var t=s[pos];s[pos]=s[pos-1];s[pos-1]=t;redrawOrder(ex,box);}});
    var dn=el('button');dn.type='button';dn.innerHTML='&darr;';dn.setAttribute('aria-label','move down');
    dn.addEventListener('click',function(){var s=box._w.seq;if(pos<s.length-1){var t=s[pos];s[pos]=s[pos+1];s[pos+1]=t;redrawOrder(ex,box);}});
    row.appendChild(up);row.appendChild(dn);
    row.draggable=true;
    row.addEventListener('dragstart',function(ev){ev.dataTransfer.setData('text/plain',String(pos));});
    row.addEventListener('dragover',function(ev){ev.preventDefault();});
    row.addEventListener('drop',function(ev){
      ev.preventDefault();
      var from=Number(ev.dataTransfer.getData('text/plain'));
      if(isNaN(from))return;
      var s=box._w.seq;var item=s.splice(from,1)[0];s.splice(pos,0,item);redrawOrder(ex,box);
    });
    list.appendChild(row);
  });
}
function gradeOrder(ex,box){
  var w=box._w,res={type:'order',N:ex.items.length,H:0,W:0,rows:[],correct:''};
  w.seq.forEach(function(ii,pos){
    if(ii===pos){res.H++;res.rows.push({s:'ok',t:'position '+(pos+1)+': '+esc(ex.items[ii])});}
    else{res.W++;res.rows.push({s:'bad',t:'position '+(pos+1)+': '+esc(ex.items[ii])+' (correct: '+esc(ex.items[pos])+')'});}
  });
  res.correct=ex.items.map(function(t,i){return (i+1)+'. '+esc(t);}).join(' &nbsp;&rarr;&nbsp; ');
  lockBox(box);
  return res;
}

/* ---------- terminal ---------- */
function buildTerm(ex,box){
  box._w={};
  if(ex.panel){
    var p=el('div','panel');
    p.innerHTML=ex.panel.map(function(l){return hl(l);}).join('<br>');
    box.appendChild(p);
  }
  var sh=el('div','shell');
  var out=el('div','shell-out');out.id='term-out';
  out.innerHTML=ex.banner?ex.banner.map(function(l){return hl(l);}).join('\n'):'<span class="s"># session ready &mdash; type your command and press Enter. Grading happens when you press Check.</span>';
  var inl=el('div','shell-in');
  inl.innerHTML='<span class="prompt">'+esc(ex.prompt||'analyst@soc-lab:~$')+'</span>';
  var inp=document.createElement('input');inp.id='term-in';inp.spellcheck=false;inp.autocomplete='off';
  inp.setAttribute('aria-label','terminal input');
  inl.appendChild(inp);sh.appendChild(out);sh.appendChild(inl);
  box.appendChild(sh);
  box._w.input=inp;
  box._w.lastCmd='';
  inp.addEventListener('keydown',function(ev){
    if(ev.key!=='Enter')return;
    var cmd=inp.value;box._w.lastCmd=cmd;inp.value='';
    var o=$('#term-out');
    var echo=el('div');echo.innerHTML='<span class="g">'+esc(ex.prompt||'analyst@soc-lab:~$')+'</span> '+esc(cmd);
    o.appendChild(echo);
    var resp=el('div');
    if(norm(cmd)===norm(ex.canonical)){resp.innerHTML=(ex.sample||['# command accepted']).map(function(l){return hl(l);}).join('\n');}
    else{
      var first=norm(cmd).split(' ')[0];var firstC=norm(ex.canonical).split(' ')[0];
      if(first===firstC){resp.innerHTML='<span class="r">'+esc('incorrect usage — check the tool options and the target')+'</span>';}
      else{resp.innerHTML='<span class="r">'+esc('command not found: '+first)+'</span>';}
    }
    o.appendChild(resp);o.scrollTop=o.scrollHeight;
  });
}
function gradeTerm(ex,box){
  var w=box._w,res={type:'terminal',N:0,H:0,W:0,rows:[],correct:'<code>'+esc(ex.canonical)+'</code>',danger:false};
  var typed=norm(w.lastCmd||w.input.value);
  var ct=norm(ex.canonical).split(' ').filter(Boolean);
  var ut=typed.split(' ').filter(Boolean);
  res.N=ct.length;
  ct.forEach(function(tok){
    var k=ut.indexOf(tok);
    if(k>=0){res.H++;res.rows.push({s:'ok',t:'<code>'+esc(tok)+'</code>'});ut.splice(k,1);}
    else{res.rows.push({s:'miss',t:'missing element: <code>'+esc(tok)+'</code>'});}
  });
  ut.forEach(function(tok){res.W++;res.rows.push({s:'bad',t:'unexpected element: <code>'+esc(tok)+'</code>'});});
  (ex.danger||[]).forEach(function(d){if(typed.indexOf(norm(d))>=0)res.danger=true;});
  var out=$('#term-out');
  var can=el('div');can.style.marginTop='8px';
  can.innerHTML='<span class="s"># canonical command:</span>\n<span class="g">'+esc(ex.canonical)+'</span>';
  out.appendChild(can);
  w.input.disabled=true;
  return res;
}

/* ---------- triage ---------- */
function buildTriage(ex,box){
  box._w={sel:{}};
  ex.alerts.forEach(function(a,ai){
    var card=el('div','alert');
    card.innerHTML='<div class="alert-h"><span class="alert-id">'+esc(a.name)+'</span><span class="m">'+esc(a.src||'')+'</span></div>';
    if(a.log){var pre=el('div','alert-pre');pre.innerHTML=a.log.map(function(l){return hl(l);}).join('\n');card.appendChild(pre);}
    var opts=shuffle(a.options.map(function(o,i){return {t:o[0],ok:!!o[1],i:i};}));
    box._w.sel[ai]=null;
    var wrap=el('div');
    opts.forEach(function(o,k){
      var b=el('button','opt');b.type='button';
      b.innerHTML='<span class="lab">'+letters(k)+'</span><span>'+esc(o.t)+'</span><span class="mark">&#10003;</span>';
      b.addEventListener('click',function(){
        box._w.sel[ai]=o.i;
        wrap.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel');});
        b.classList.add('sel');
      });
      b.dataset.gi=o.i;wrap.appendChild(b);
    });
    card.appendChild(wrap);box.appendChild(card);
    a._opts=opts;
  });
}
function gradeTriage(ex,box){
  var res={type:'triage',N:ex.alerts.length,H:0,W:0,rows:[],correct:''};
  ex.alerts.forEach(function(a,ai){
    var gi=box._w.sel[ai];
    var okOpt=a._opts.filter(function(o){return o.ok;})[0];
    var chosen=(gi===null)?null:a._opts.filter(function(o){return o.i===gi;})[0];
    if(chosen&&chosen.ok){res.H++;res.rows.push({s:'ok',t:esc(a.name)+': '+esc(chosen.t)});}
    else if(chosen){res.W++;res.rows.push({s:'bad',t:esc(a.name)+': '+esc(chosen.t)+' (correct: '+esc(okOpt.t)+')'});}
    else{res.rows.push({s:'miss',t:esc(a.name)+': not answered (correct: '+esc(okOpt.t)+')'});}
  });
  res.correct=ex.alerts.map(function(a){var o=a._opts.filter(function(x){return x.ok;})[0];return esc(a.name)+' &rarr; '+esc(o.t);}).join(' &middot; ');
  box.querySelectorAll('.opt').forEach(function(b){b.disabled=true;});
  return res;
}

/* ---------- branching ---------- */
function buildBranch(ex,box){
  box._w={sel:{},n:ex.steps.length};
  ex.steps.forEach(function(s,si){
    var card=el('div','step-card');card.id='step-'+si;
    card.innerHTML='<span class="step-tag">STEP '+(si+1)+' OF '+ex.steps.length+'</span><p style="margin:6px 0">'+s.prompt+'</p>';
    var opts=shuffle(s.options.map(function(o,i){return {t:o[0],ok:!!o[1],i:i};}));
    s._opts=opts;
    var wrap=el('div');
    opts.forEach(function(o,k){
      var b=el('button','opt');b.type='button';
      b.innerHTML='<span class="lab">'+letters(k)+'</span><span>'+esc(o.t)+'</span><span class="mark">&#10003;</span>';
      b.addEventListener('click',function(){
        box._w.sel[si]=o.i;
        wrap.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel');});
        b.classList.add('sel');
        var next=$('#step-'+(si+1));
        if(next)next.classList.remove('hidden');
      });
      b.dataset.gi=o.i;wrap.appendChild(b);
    });
    card.appendChild(wrap);
    if(si>0)card.classList.add('hidden');
    box.appendChild(card);
  });
}
function gradeBranch(ex,box){
  var res={type:'branch',N:ex.steps.length,H:0,W:0,rows:[],correct:''};
  ex.steps.forEach(function(s,si){
    var gi=box._w.sel[si];
    var okOpt=s._opts.filter(function(o){return o.ok;})[0];
    var chosen=(gi===null||gi===undefined)?null:s._opts.filter(function(o){return o.i===gi;})[0];
    if(chosen&&chosen.ok){res.H++;res.rows.push({s:'ok',t:'step '+(si+1)+': '+esc(chosen.t)});}
    else if(chosen){res.W++;res.rows.push({s:'bad',t:'step '+(si+1)+': '+esc(chosen.t)+' (better: '+esc(okOpt.t)+')'});}
    else{res.rows.push({s:'miss',t:'step '+(si+1)+': not answered (better: '+esc(okOpt.t)+')'});}
  });
  res.correct=ex.steps.map(function(s,si){var o=s._opts.filter(function(x){return x.ok;})[0];return 'step '+(si+1)+' &rarr; '+esc(o.t);}).join(' &middot; ');
  box.querySelectorAll('.opt').forEach(function(b){b.disabled=true;});
  return res;
}

/* ---------- dispatcher ---------- */
function gradeEx(ex,box){
  var t=ex.type,r;
  if(t==='qcm'||t==='tf'||t==='multi')r=gradeChoice(ex,box);
  else if(t==='match')r=gradeMatch(ex,box);
  else if(t==='dragdrop')r=gradeDD(ex,box);
  else if(t==='fill')r=gradeFill(ex,box);
  else if(t==='order')r=gradeOrder(ex,box);
  else if(t==='terminal')r=gradeTerm(ex,box);
  else if(t==='triage')r=gradeTriage(ex,box);
  else if(t==='branch')r=gradeBranch(ex,box);
  return r;
}

/* ===================== boot ===================== */
buildHeader();
renderIntro();

</script>
