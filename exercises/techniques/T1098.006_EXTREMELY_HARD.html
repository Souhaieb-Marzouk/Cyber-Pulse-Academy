window.__EXAM__={"meta": {"topicId": "t1098.006", "batch": 4, "title": "T1098.006 Account Manipulation: Additional Container Cluster Roles — EXTREMELY HARD", "difficulty": "extremely-hard", "questionCount": 15, "estimatedMinutes": 60, "passMark": 70}, "sevKey": "extreme", "sevWord": "EXTREMELY HARD", "objId": "T1098.006", "objName": "Account Manipulation: Additional Container Cluster Roles", "timerMinutes": 60, "estimatedMinutes": 60, "typeList": ["Branching incident decisions (two 3-step scenarios)", "Single-choice questions on conflicting signals", "Multi-select with partial credit (incl. wrong-to-do selections)", "Matching pairs (artefacts to proportionate actions)", "Drag & drop (coverage matrix, fact-check)", "Fill-in-the-blank (executive risk statement)", "Ranking containment actions by cost", "One terminal command under an advisory budget (safe vs destructive)"], "intro": {"title": "T1098.006 — EXTREMELY HARD practice exam", "subtitle": "Account Manipulation: Additional Container Cluster Roles — chained decisions under conflicting signals", "objType": "Sub-Technique (child of T1098 — Account Manipulation)", "learn": "\n<p>This is the top tier for <b>T1098.006 — Additional Container Cluster Roles<\/b>, sub-technique of <b>T1098 — Account Manipulation<\/b> under the <b>Persistence<\/b> and <b>Privilege Escalation<\/b> tactics. Nothing here is a single recall question. Every exercise chains three or more ideas, and at least one signal in each scenario contradicts another — your job is to decide which signal wins, say why, and accept the cost of the decision. The technique itself: an adversary with sufficient permissions adds roles or permissions to an account they control in a container orchestration system by creating a <b>RoleBinding<\/b> or <b>ClusterRoleBinding<\/b> (or by editing an <b>ABAC<\/b> policy), keeping persistent access to the cluster; in managed clouds (<b>GKE / EKS / AKS<\/b>) it may pair with <b>T1098.003<\/b>.<\/p>\n<p>The roles in the chair are senior ones: the <b>IR lead<\/b> choosing containment that legal can defend, the <b>detection engineer<\/b> whose best-practice rule is wrong for this estate, the <b>CTI analyst<\/b> briefing the CISO without over-claiming (the 2023 documented campaign used Kubernetes RBAC to backdoor clusters — the ATT&CK page names no group), and the <b>platform owner<\/b> who must weigh a four-hour outage against residual risk. You will write the CISO risk statement yourself, rank containment by evidence cost, and run one terminal command whose correct version is the <b>safe<\/b> one while the tempting version destroys evidence.<\/p>\n<p>Two warnings. First: at this level, 'do nothing yet / gather more evidence / escalate' is sometimes the correct answer. Second: several widely recommended best practices are deliberately wrong in these specific contexts — reading the artefacts, not the folklore, is what passes.<\/p>\n", "keywords": "\n<div class=\"kwtheme\"><h4>🗂 Chained adversary behaviour<\/h4><ul>\n<li>Compromised CI/CD identity → new <span class=\"mono\">ServiceAccount<\/span> → <span class=\"mono\">ClusterRoleBinding<\/span> to <span class=\"mono\">cluster-admin<\/span><\/li>\n<li>ABAC policy modification as the audit-blind variant; masquerading binding names<\/li>\n<li>Estate-scale persistence across clusters; conjunction with <b>T1098.003<\/b> in GKE/EKS/AKS<\/li>\n<\/ul><\/div>\n<div class=\"kwtheme\"><h4>📡 Conflicting-signal telemetry<\/h4><ul>\n<li>Change windows vs out-of-band source IPs; automation identities used at wrong times<\/li>\n<li>Audit retention gaps — what is confirmed vs what cannot be claimed<\/li>\n<li>Node/kubelet telemetry to bridge API-audit blind spots; ABAC file telemetry<\/li>\n<\/ul><\/div>\n<div class=\"kwtheme\"><h4>⚖ Decision economics<\/h4><ul>\n<li>Evidence preservation vs containment speed; targeted revocation vs cluster-wide outage<\/li>\n<li>Legal-grade evidence: read-only capture before any state change<\/li>\n<li>Escalation and 'gather more evidence first' as correct answers<\/li>\n<\/ul><\/div>\n<div class=\"kwtheme\"><h4>🛡 Controls under scrutiny<\/h4><ul>\n<li>DET0572 / AN1579 tuning limits; M1018 / M1032 as design constraints<\/li>\n<li>Multi-cluster coverage: EKS control-plane logging, GKE Cloud Audit Logs, AKS diagnostics vs cloud-IAM detections<\/li>\n<li>CISO-grade risk statements with correct IDs and honest uncertainty<\/li>\n<\/ul><\/div>\n", "how": "\n<p><b>Goal:<\/b> reach at least <b>70%<\/b> — that is a PASS. Below it, retake; everything reshuffles.<\/p>\n<p><b>Exercise types in this file:<\/b><\/p>\n<ul class=\"howlist\">\n<li><b>Branching incident decisions<\/b> — three steps each, your earlier choices shape the story; all steps are graded at the final Check with partial credit. Intermediate confirms do not pause the clock.<\/li>\n<li>Single-choice questions built on contradictory signals.<\/li>\n<li>Multi-select with partial credit — including 'select what is WRONG to do'.<\/li>\n<li>Matching pairs, drag &amp; drop, ranking with costs, and keyword insertion into an executive risk statement.<\/li>\n<li>One terminal exercise under a stated <b>advisory time budget<\/b>: the safe command is correct; the tempting one destroys evidence.<\/li>\n<\/ul>\n<p><b>Scoring:<\/b> one point maximum per exercise; multi-part exercises score <code>(H − W) / N<\/code>; one hint per exercise costs 10% of that exercise. Hints here only restate a constraint — they never name the concept.<\/p>\n<p><b>Timer:<\/b> <b>60 minutes<\/b>. <b>Check<\/b> auto-pauses the clock for unlimited feedback review; <b>Next<\/b> resumes it. <b>Pause<\/b> hides the exercise for a manual break. <b>Skip<\/b> parks an exercise for later review; skipped-and-never-answered exercises are excluded from the score.<\/p>\n"}, "exercises": [{"id": "x01", "type": "branch", "scen": [{"k": "p", "t": "You are the IR lead. Monday 03:47. The pager fired and the CISO wants a decision in ten minutes."}, {"k": "art", "label": "ARTEFACT 1 — Ticket INC-2291 (opening facts)", "kind": "code", "lines": ["Cluster: prod-eu (EKS, payments platform, live traffic)", "Entry point: Jenkins exposed to the internet on 10[.]44[.]2[.]10", "Stolen identity: system:serviceaccount:ci:deploy-bot", "Observed: SA kube-admin-sa created 03:09 from 203[.]0[.]113[.]90", "          ClusterRoleBinding kube-admin2 -> cluster-admin 03:11"]}, {"k": "art", "label": "ARTEFACT 2 — Precedent", "kind": "code", "lines": ["April 2023: researchers documented the first known attack", "leveraging Kubernetes RBAC to backdoor clusters — same chain:", "CI entry point, token theft, privileged binding. No group named."]}], "scenSum": "INC-2291 — three-step incident decision chain", "q": "Work the three decision steps; every step is graded at the final Check.", "steps": [{"q": "STEP 1 — CISO: 'Contain now or investigate first?' What do you do with the deploy-bot identity?", "options": [{"t": "Freeze deploy-bot (disable its token use) but keep the cluster serving — evidence intact", "ok": true, "why": "Freezing the identity cuts the attacker's current tool without deleting anything; the cluster stays up and the audit trail stays complete."}, {"t": "Delete deploy-bot and every object it created, immediately", "ok": false, "why": "Deleting now destroys the binding, the SA and the timeline before capture — legal loses the case and you lose the hunt map."}, {"t": "Business as usual — deploy-bot is trusted automation", "ok": false, "why": "The identity was stolen via an exposed Jenkins; trusting it now is trusting the attacker."}]}, {"q": "STEP 2 — Audit retention is 7 days and the event is 38 minutes old. What happens first?", "options": [{"t": "Export the audit slice and capture the binding + SA YAML now", "ok": true, "why": "Retention is the clock: the slice must leave the platform before anything rotates or ages out."}, {"t": "Wait for tonight's automated log export job", "ok": false, "why": "The job may fail, and meanwhile rotation or retention changes can erase your evidence."}, {"t": "Restart the API server to flush its state", "ok": false, "why": "A restart interrupts service, changes no evidence, and adds noise to the timeline."}]}, {"q": "STEP 3 — Before removal, what scope check do you run?", "options": [{"t": "Enumerate ALL bindings and SAs referencing kube-admin-sa or created tonight, cluster-wide", "ok": true, "why": "One binding is rarely the whole persistence set; the sweep defines what removal must cover."}, {"t": "Remove kube-admin2 only and close the ticket", "ok": false, "why": "The SA itself and possible sibling bindings survive — the attacker re-binds in minutes."}, {"t": "Delete the namespace where the SA was created", "ok": false, "why": "default namespace deletion is catastrophic and still not estate-wide."}]}], "hint": "Everything you delete in the next ten minutes is evidence you cannot get back — sequence for capture first.", "expl": "The chain reward goes to capture-first thinking: freeze the identity (containment without destruction), export and capture (beat retention), then scope before removal (bindings referencing the rogue SA, estate-wide). The precedent from the documented 2023 campaign says this chain is a known pattern — expect siblings. Every shortcut here either destroys evidence or leaves the persistence layer alive.", "study": "Write your own three-line policy for live RBAC backdoors: freeze identities, export before retention bites, scope before removal."}, {"id": "x02", "type": "qcm", "scen": [{"k": "p", "t": "Two signals, one decision. The platform lead is already typing 'no incident' in the bridge chat."}, {"k": "art", "label": "ARTEFACT 1 — The signals", "kind": "code", "lines": ["Signal A (calming):  binding created 02:41 — inside the approved", "                     01:00-03:00 deploy window (CR-2291)", "Signal B (alarming): created by deploy-bot from 203[.]0[.]113[.]90,", "                     which is NOT in the CI CIDR; the bound SA was", "                     created 02:38, also from that IP"]}], "scenSum": "Which signal wins — the window or the source?", "q": "Which signal wins, and what do you do?", "options": [{"t": "B wins — automation creates from automation infrastructure; treat as suspicious and verify with the automation owner", "ok": true}, {"t": "A wins — inside the approved window means approved by definition", "ok": false}, {"t": "IPs never matter inside a change window", "ok": false}, {"t": "Escalate straight to law enforcement — no internal verification needed", "ok": false}], "hint": "Automation creates bindings from automation infrastructure. Ask what the location of the request says about who is driving.", "expl": "Windows approve changes, not locations. The identity of the DRIVER is what AN1579 keys on: deploy-bot's job is to call from the CI subnet, and an external IP holding its token means token theft — the window is precisely what made the timing plausible. Verify with the automation owner (was there a legitimate reason?) while treating it as suspicious; skipping verification to law enforcement skips the facts your own estate can give you in minutes.", "study": "Whenever two signals conflict, ask which one speaks to IDENTITY and which to CONVENIENCE — identity wins."}, {"id": "x03", "type": "term", "scen": [{"k": "p", "t": "Legal has one sentence for you: 'We need evidence that will survive scrutiny, and nothing in this cluster may change until it is captured.' The rogue binding is named <span class=\"mono\">kube-admin2<\/span>. An advisory budget of <b>3 minutes<\/b> applies to this task — the main exam clock governs either way."}, {"k": "art", "label": "ARTEFACT 1 — Environment", "kind": "code", "lines": ["cluster: prod-eu (LIVE — payments in traffic)", "your user: incident-lead (read-only mandated by legal)", "audit export: running since minute one", "forbidden: any command that changes cluster state"]}], "scenSum": "Evidence-grade capture of the rogue binding (safe vs destructive)", "q": "Type the read-only command that outputs the full YAML of that binding, then run it and press Check.", "term": {"prompt": "incident-lead@prod-eu:~$", "canonical": "kubectl get clusterrolebinding kube-admin2 -o yaml", "setup": "context: prod-eu · read-only mandate in force · advisory budget 3 min", "budget": 180, "elements": [{"re": "\\bkubectl\\b", "desc": "the cluster CLI (kubectl)"}, {"re": "\\bget\\b", "desc": "the read verb get (captures without changing)"}, {"re": "\\bclusterrolebinding\\b", "desc": "the object type: clusterrolebinding (singular, one object)"}, {"re": "\\bkube-admin2\\b", "desc": "the object name: kube-admin2"}, {"re": "(-o\\s+yaml\\b|-oyaml\\b|--output=yaml\\b|--output\\s+yaml\\b)", "desc": "-o yaml prints the full object for evidence"}], "danger": ["delete", "remove", "drain", "cordon", "patch", "apply", "replace", "taint"], "out": ["apiVersion: rbac.authorization.k8s.io/v1", "kind: ClusterRoleBinding", "metadata:", "  name: kube-admin2", "  creationTimestamp: 2026-10-19T03:11:22Z", "  uid: 4f9d2a71-8c33-4c11-9e2b-77c1d4a0e9b2", "roleRef:", "  apiGroup: rbac.authorization.k8s.io", "  kind: ClusterRole", "  name: cluster-admin", "subjects:", "- kind: ServiceAccount", "  name: kube-admin-sa", "  namespace: default"], "err": "error: the flag combination did not produce object output — evidence capture needs -o yaml"}, "hint": "The verb is get; the output flag prints the whole object exactly as stored — that is what 'survives scrutiny' means here.", "expl": "Canonical command: kubectl get clusterrolebinding kube-admin2 -o yaml. Every element serves the legal requirement: get reads, the singular resource plus name targets the one object, and -o yaml freezes roleRef, subjects, UID and creationTimestamp — the fields that prove the backdoor. A delete of the same object is the near-miss that feels productive and destroys the evidence (the binding itself is the exhibit); patch or apply would silently rewrite it. The DANGEROUS — NEAR MISS label exists for exactly this reason.", "study": "Evidence capture in Kubernetes: get -o yaml (or a JSON dump) plus the audit slice — before any revocation."}, {"id": "x04", "type": "multi", "scen": [{"k": "p", "t": "The bridge is filling with advice. Some of it is good, some of it would make legal's job impossible. Select every action that is WRONG right now because it destroys evidence or availability."}, {"k": "art", "label": "ARTEFACT 1 — State of the incident", "kind": "code", "lines": ["Rogue binding captured?  NOT YET", "Audit slice exported?    YES (minute one)", "Attacker active?         possibly — external IP seen 4 min ago", "Legal constraint:        no cluster state changes before capture"]}], "scenSum": "Select the evidence-destroying / availability-destroying actions", "q": "Select every action that is WRONG to take right now.", "options": [{"t": "Delete the binding immediately, before capture", "ok": true}, {"t": "Rotate ALL cluster credentials at once, without a snapshot", "ok": true}, {"t": "Restart the API server to 'clean' the state", "ok": true}, {"t": "Disable audit logging to reduce noise during triage", "ok": true}, {"t": "Export one more audit slice around the last-seen IP", "ok": false}, {"t": "Capture the binding YAML and the SA list", "ok": false}], "hint": "Two options only read. Everything that writes, resets or silences destroys something you will want tomorrow.", "expl": "Deleting before capture destroys the exhibit itself; mass rotation without a snapshot destroys the ability to reconstruct which tokens mattered (and can lock out the response team mid-incident); an API restart disrupts payments and gains nothing; disabling audit logging is self-blinding during a live intrusion. The two safe actions are read-only — they add evidence without touching state. The pattern to remember: writes and resets destroy, reads preserve.", "study": "Build a two-column card for live incidents: DESTROYS (delete, rotate-all, restart, silence) vs PRESERVES (export, capture, snapshot)."}, {"id": "x05", "type": "dnd", "scen": [{"k": "p", "t": "Estate review after INC-2291. Six controls exist across the estate. Map each to what it actually covers for this technique — the CISO wants the honest matrix."}, {"k": "art", "label": "ARTEFACT 1 — Estate controls", "kind": "code", "lines": ["C1 EKS control-plane audit streaming -> SIEM (RBAC analytic AN1579)", "C2 GKE Cloud Audit Logs, alert on rolebinding/clusterrolebinding create", "C3 AKS diagnostics (kube-audit-admin) -> SIEM, same analytic", "C4 CloudTrail alert on AttachRolePolicy / PutUserPolicy", "C5 Entra ID alert on Global Administrator assignment", "C6 Antivirus on developer laptops"]}], "scenSum": "Honest coverage matrix for the estate", "q": "Drag each control to what it covers.", "zones": [{"id": "z1", "label": "Covers T1098.006 (cluster layer)"}, {"id": "z2", "label": "Covers T1098.003 only (cloud IAM)"}, {"id": "z3", "label": "Covers neither"}], "items": [{"t": "C1 EKS audit streaming with the RBAC analytic", "zone": "z1", "why": "Watches the cluster's own API — sees binding creation on EKS."}, {"t": "C2 GKE Cloud Audit Logs alert on binding creates", "zone": "z1", "why": "Same layer, same objects, on GKE."}, {"t": "C3 AKS diagnostics with the same analytic", "zone": "z1", "why": "Third managed cluster, same cluster-layer coverage."}, {"t": "C4 CloudTrail alert on IAM policy attachments", "zone": "z2", "why": "The cloud identity plane — that is T1098.003, the sibling the page says may pair with T1098.006."}, {"t": "C5 Entra ID alert on Global Admin assignment", "zone": "z2", "why": "Cloud role abuse again — valuable, but blind to in-cluster bindings."}, {"t": "C6 Antivirus on developer laptops", "zone": "z3", "why": "Different endpoint world — it never sees an API server audit event."}], "hint": "Three controls watch the cluster's own API; two watch the cloud identity plane; one watches neither.", "expl": "The honest matrix is the CISO deliverable: cluster-layer bindings are covered on all three managed platforms (C1-C3), cloud-IAM role abuse is covered separately (C4-C5, the T1098.003 sibling), and endpoint antivirus (C6) contributes nothing here. The trap is claiming C4/C5 'cover' the technique — the ATT&CK page explicitly says the two layers can be used together, so both columns must stay lit.", "study": "Draw your estate's matrix once per year: rows = clusters, columns = cluster layer / cloud IAM layer / nothing."}, {"id": "x06", "type": "qcm", "scen": [{"k": "p", "t": "A fresh alert: user <span class=\"mono\">ops-contractor<\/span> (a human identity, created last week) created a ClusterRoleBinding to cluster-admin 45 minutes ago on production, from an IP with no prior history. The CISO wants a decision in ten minutes. Logs are not yet exported. The junior proposes deleting the binding right now."}, {"k": "art", "label": "ARTEFACT 1 — Pressure board", "kind": "code", "lines": ["T-10:00  CISO bridge starts", "T-45m   binding created by ops-contractor from unknown IP", "T-00    audit export: NOT started · binding YAML: NOT captured", "junior: 'delete it now, ask questions later'"]}], "scenSum": "Escalate and preserve first — or delete now?", "q": "What is the correct call with ten minutes on the clock?", "options": [{"t": "Escalate to the IR lead and export/capture first — removal follows in minutes, not hours", "ok": true}, {"t": "Delete the binding immediately — speed beats evidence", "ok": false}, {"t": "Wait for the post-mortem to decide anything", "ok": false}, {"t": "Unplug the cluster from the network", "ok": false}], "hint": "What will you lose forever if the first action is deletion — and how long does capture actually take?", "expl": "Capture takes minutes; losing the binding's subjects and roleRef context costs the whole investigation — and legal will ask. The correct senior move is the least destructive effective one: escalate (you are about to make estate-wide decisions) and preserve, then remove. Deletion-first destroys the exhibit for zero time gain; waiting leaves live cluster-admin access with the adversary; pulling the network is an availability decision nobody authorised.", "study": "In ten-minute windows, plan the sequence, not the single action: escalate → export/capture → remove → rotate."}, {"id": "x07", "type": "order", "scen": [{"k": "p", "t": "The CISO approves containment. Five actions, each with a cost. Order them the way an IR lead would — evidence first, outage last, and be ready to defend the order in the post-mortem."}, {"k": "art", "label": "ARTEFACT 1 — Actions and their costs", "kind": "code", "lines": ["A. Remove the rogue binding            (cost: attacker alerted)", "B. Export audit logs                   (cost: none)", "C. Capture binding + SA + token YAML   (cost: none)", "D. Rotate the affected tokens/creds    (cost: brief CI downtime)", "E. Review workloads/nodes for role use (cost: analyst hours)"]}], "scenSum": "Rank containment actions by evidence-versus-speed economics", "q": "Put the containment actions in the order IR should perform them.", "order": [{"t": "Export audit logs", "why": "Zero cost, protects the timeline — always first."}, {"t": "Capture binding + SA + token YAML", "why": "Zero cost, freezes the exhibits removal would otherwise destroy."}, {"t": "Remove the rogue binding", "why": "The containment moment: the access path dies after evidence is safe."}, {"t": "Rotate the affected tokens/credentials", "why": "Eviction follows containment — cached tokens die, brief CI downtime accepted."}, {"t": "Review workloads and nodes for what the role was used for", "why": "Impact assessment last: needs the quieted environment and the captured evidence."}], "hint": "Zero-cost preservation precedes everything; the outage-priced action comes after containment, and assessment needs quiet.", "expl": "The order is an economics table: two free preservation steps, then the irreversible containment, then the eviction that carries real downtime, then the analyst-hours assessment. Reordering — rotating before capture, for instance — destroys your ability to prove which credentials the adversary held. Reviewing last is not laziness: it needs the evidence you captured and the calm after revocation.", "study": "Attach a cost to every response action; the right order usually sorts by ascending irreversibility."}, {"id": "x08", "type": "qcm", "scen": [{"k": "p", "t": "The timeline has a hole: 21 minutes of API audit records are missing between 03:31 and 03:52 (retention pipeline hiccup — or worse). Everything else is in front of you."}, {"k": "art", "label": "ARTEFACT 1 — Reconstructed timeline", "kind": "log", "lines": ["03:09 create serviceaccount kube-admin-sa  from 203[.]0[.]113[.]90", "03:11 create clusterrolebinding kube-admin2 (cluster-admin)", "03:13 get secrets (all namespaces)          from 203[.]0[.]113[.]90", "03:15 create pod + exec in kube-system      from 203[.]0[.]113[.]90", "03:31 [ RETENTION GAP — 21 MINUTES MISSING ]", "03:52 deploy-bot get clusterrolebindings    from 10[.]201[.]4[.]18", "04:02 unrelated CI deploy from 10[.]201[.]4[.]22"]}], "scenSum": "What can you conclude despite the audit gap?", "q": "Given the 21-minute audit gap, which conclusion is defensible?", "options": [{"t": "Persistence via a cluster-admin binding is CONFIRMED; data theft inside the gap is NOT established", "ok": true}, {"t": "Data exfiltration is proven by the 03:15 exec line", "ok": false}, {"t": "Nothing at all can be concluded from this timeline", "ok": false}, {"t": "The gap itself proves the adversary tampered with logs", "ok": false}], "hint": "Separate what the logs show from what the logs cannot show — and separate a pipeline failure from proof of intent.", "expl": "Confirmed: the backdoor (create SA, bind cluster-admin) and privilege use (secrets read, pod exec) — all pre-gap, all from one external IP. Not established: anything inside the gap, including theft or destruction; claiming exfiltration from an exec line over-reaches (exec shows access, not data movement). The gap itself is a pipeline failure until proven otherwise — tampering is a hypothesis to check against node logs, not a conclusion to print. This is how senior analysts keep statements honest.", "study": "Phrase findings in two lists: established (with log lines) vs unknown (with the telemetry you still need)."}, {"id": "x09", "type": "fill", "scen": [{"k": "p", "t": "The CISO reads one paragraph, then decides budget. Every word must be the exact, correct one — a wrong scope word changes the risk decision."}, {"k": "art", "label": "ARTEFACT 1 — Established facts", "kind": "code", "lines": ["compromised identity : CI/CD service account (deploy-bot)", "object created       : ClusterRoleBinding -> built-in cluster-admin", "reach                : every namespace of the EKS estate", "ATT&CK               : sub-technique T1098.006 under parent T1098"]}], "scenSum": "Write the CISO risk statement — exact words only", "q": "Fill every blank in the executive risk statement using the word bank.", "text": ["Exec summary: The adversary abused a compromised ", {"b": 0}, " identity to create a ", {"b": 1}, " granting ", {"b": 2}, " on the whole cluster, achieving ", {"b": 3}, " (T1098.006 under parent ", {"b": 4}, ") — access persisted across the EKS estate until revoked."], "blanks": ["CI/CD", "ClusterRoleBinding", "cluster-admin", "persistence", "T1098"], "bank": ["CI/CD", "ClusterRoleBinding", "cluster-admin", "persistence", "T1098", "RoleBinding", "T1098.003", "exfiltration"], "hint": "Two blanks are ATT&CK IDs; the phrase 'on the whole cluster' decides which binding type fits; the parent, not the sibling, goes in the last blank.", "expl": "The compromised layer is CI/CD; the object is a ClusterRoleBinding because the sentence says 'whole cluster' (a RoleBinding would be namespaced — that decoy is the trap); the role is cluster-admin; the goal achieved is persistence (no data-theft claim is established); and the parent technique is T1098 — T1098.003 is the cloud-roles sibling, not the parent. Executive readers act on exact words: scope, object and ID all change the decision.", "study": "Draft one risk statement per incident with this discipline: layer, object, role, goal, IDs — then re-read every noun against the evidence."}, {"id": "x10", "type": "match", "scen": [{"k": "p", "t": "Five artefacts from INC-2291 sit in the evidence folder. Match each to its most proportionate next action — some are read-only, some revoke, some enrich."}, {"k": "art", "label": "ARTEFACT 1 — The five artefacts", "kind": "code", "lines": ["V1  audit gap 03:31-03:52 (21 min)", "V2  unknown source IP 203[.]0[.]113[.]90", "V3  ServiceAccount kube-admin-sa + its token", "V4  binding named kube-admin2 (masquerades as platform tooling)", "V5  deploy-bot activity in-window from CI subnet"]}], "scenSum": "Match artefacts to proportionate actions", "q": "Match each artefact to its best next action.", "lefts": [{"t": "V1 — the 21-minute audit gap", "why": "The gap blocks conclusions; bridge it with a different telemetry layer (node/kubelet logs)."}, {"t": "V2 — the unknown source IP", "why": "Enrich and then block — after capture, at the edge, not by editing cluster state."}, {"t": "V3 — the rogue SA and its token", "why": "The eviction target: capture, then rotate the token and disable the SA."}, {"t": "V4 — the masquerading binding name", "why": "One binding is never alone: capture, remove, and sweep for similar names."}, {"t": "V5 — deploy-bot's in-window activity from CI", "why": "Baseline material: allow-list it with the automation owner so future alerts stay sharp."}], "rights": ["Pull control-plane / kubelet logs to bridge the gap", "Enrich with threat intel, then block at the edge after capture", "Capture the token context, then rotate and disable the SA", "Capture YAML, remove, then sweep clusters for similar names", "Baseline and allow-list with the automation owner"], "pairs": [[0, 0], [1, 1], [2, 2], [3, 3], [4, 4 function highlight(l){

/* ===================== ANSWER <-> SCORING ===================== */
function haveAnswer(ex,idx){
  var a=S.answers[idx];
  if(!a) return false;
  switch(ex.type){
    case 'qcm': return a.sel!==undefined;
    case 'multi': return a.sel&&Object.keys(a.sel).length>0;
    case 'match': return a.assign&&Object.keys(a.assign).length>0;
    case 'dnd': return a.place&&Object.keys(a.place).some(function(k){ return a.place[k]; });
    case 'order': return true;
    case 'fill': return a.fills&&Object.keys(a.fills).length>0;
    case 'term': return !!(a.cmd&&a.cmd.trim());
    case 'branch': return Object.keys(a.choices).length===ex.steps.length;
  }
  return false;
}
function grade(ex,idx){
  var a=S.answers[idx]||{};
  var items=[]; var H=0,W=0,N=0;
  switch(ex.type){
    case 'qcm': {
      N=1;
      var pick=a.sel, ok=false;
      if(pick!==undefined){ ok=!!ex.options[pick].ok; H=ok?1:0; }
      items.push({st:pick===undefined?'○ Missed — nothing selected':(ok?'✓ Correct — you picked the right option':'✗ Wrong — that option is not correct'),cls:pick===undefined?'miss':(ok?'ok':'bad')});
      break; }
    case 'multi': {
      var sel=a.sel||{};
      N=ex.options.filter(function(o){return o.ok;}).length;
      ex.options.forEach(function(o,oi){
        var s=!!sel[oi];
        if(o.ok&&s){H++; items.push({st:'✓ Correct — selected: '+o.t,cls:'ok'});}
        else if(!o.ok&&s){W++; items.push({st:'✗ Wrong — selected: '+o.t,cls:'bad'});}
        else if(o.ok&&!s){items.push({st:'○ Missed — correct option not selected: '+o.t,cls:'miss'});}
      });
      break; }
    case 'match': {
      var as=a.assign||{};
      N=ex.pairs.length;
      ex.pairs.forEach(function(pr){
        var li=pr[0], want=pr[1], got=as[li];
        var ltxt=ex.lefts[li].t;
        if(got===undefined){ items.push({st:'○ Missed — '+ltxt+' left unmatched (correct: '+ex.rights[want]+')',cls:'miss',why:ex.lefts[li].why}); }
        else if(got===want){ H++; items.push({st:'✓ Correct — '+ltxt+' → '+ex.rights[want],cls:'ok',why:ex.lefts[li].why}); }
        else { W++; items.push({st:'✗ Wrong — '+ltxt+' → '+ex.rights[got]+' (correct: '+ex.rights[want]+')',cls:'bad',why:ex.lefts[li].why}); }
      });
      break; }
    case 'dnd': {
      var pl=a.place||{};
      N=ex.items.length;
      ex.items.forEach(function(it,ii){
        var want=it.zone, got=pl[ii];
        var zoneName=function(zid){ var z=ex.zones.filter(function(z){return z.id===zid;})[0]; return z?z.label:zid; };
        if(got===undefined||got===null){ items.push({st:'○ Missed — "'+it.t+'" left in the bank (correct zone: '+zoneName(want)+')',cls:'miss',why:it.why}); }
        else if(got===want){ H++; items.push({st:'✓ Correct — "'+it.t+'" in '+zoneName(want),cls:'ok',why:it.why}); }
        else { W++; items.push({st:'✗ Wrong — "'+it.t+'" placed in '+zoneName(got)+' (correct: '+zoneName(want)+')',cls:'bad',why:it.why}); }
      });
      break; }
    case 'order': {
      var seq=a.seq||[];
      N=ex.order.length;
      seq.forEach(function(ii,pos){
        var want=ii, got=pos;
        if(got===want){H++; items.push({st:'✓ Correct at position '+(pos+1)+' — '+ex.order[ii].t,cls:'ok',why:ex.order[ii].why});}
        else {W++; items.push({st:'✗ Wrong position '+(got+1)+' — '+ex.order[ii].t+' belongs at position '+(want+1),cls:'bad',why:ex.order[ii].why});}
      });
      break; }
    case 'fill': {
      var fs=a.fills||{};
      N=ex.blanks.length;
      ex.blanks.forEach(function(want,b){
        var raw=fs[b];
        var got=(raw===undefined||raw===null)?'':String(raw).replace(/\s+/g,' ').trim().toLowerCase();
        var w=String(want).toLowerCase();
        if(got===''){ items.push({st:'○ Missed — blank '+(b+1)+' empty (correct: '+want+')',cls:'miss'}); }
        else if(got===w){ H++; items.push({st:'✓ Correct — blank '+(b+1)+': '+got,cls:'ok'}); }
        else { W++; items.push({st:'✗ Wrong — blank '+(b+1)+': you used "'+got+'", correct is "'+want+'"',cls:'bad'}); }
      });
      break; }
    case 'term': {
      var t=ex.term; var cmd=normCmd(a.cmd||'');
      N=t.elements.length;
      var dangerHit=false;
      t.danger.forEach(function(d){ if(cmd.indexOf(d)>-1) dangerHit=true; });
      t.elements.forEach(function(el){
        var re=new RegExp(el.re,'i');
        if(re.test(cmd)){ H++; items.push({st:'✓ Correct element — '+el.desc,cls:'ok'}); }
        else { items.push({st:'○ Missed element — '+el.desc,cls:'miss'}); }
      });
      var extras=extraTokens(cmd,t);
      extras.forEach(function(x){ W++; items.push({st:'✗ Wrong/extra element — '+x,cls:'bad'}); });
      if(dangerHit) items.push({st:'✗ DANGEROUS — NEAR MISS: your command changes cluster state or destroys evidence. In a real incident this would be the wrong move.',cls:'bad'});
      break; }
    case 'branch': {
      var ch=a.choices||{};
      N=ex.steps.length;
      ex.steps.forEach(function(st,si){
        var got=ch[si], okIdx=st.options.map(function(o,i){return o.ok?i:-1;}).filter(function(x){return x>-1;})[0];
        var okT=st.options[okIdx].t;
        if(got===undefined){ items.push({st:'○ Missed — step '+(si+1)+' never confirmed',cls:'miss',why:st.options[okIdx].why}); }
        else if(got===okIdx){ H++; items.push({st:'✓ Correct at step '+(si+1)+' — '+okT,cls:'ok',why:st.options[okIdx].why}); }
        else { W++; items.push({st:'✗ Wrong at step '+(si+1)+' — you chose: '+st.options[got].t+' | best: '+okT,cls:'bad',why:st.options[got].why+' Best choice: '+st.options[okIdx].why}); }
      });
      break; }
  }
  var credit=scoreExercise(H,W,N);
  if(S.hintUsed[idx]) credit=Math.max(0,credit-0.10);
  return {credit:credit,items:items,N:N,H:H,W:W};
}
function normCmd(c){ return c.replace(/\s+/g,' ').trim().toLowerCase(); }
function extraTokens(cmd,t){
  var out=[];
  var tokens=cmd.split(' ');
  var matchedStr='';
  t.elements.forEach(function(el){
    try{ var m=new RegExp(el.re,'i').exec(cmd); if(m&&m[0]) matchedStr+=' '+m[0]; }catch(e){}
  });
  tokens.forEach(function(tok){
    if(tok.indexOf('-')===0){
      var base=tok.replace(/=.*$/,'');
      var inCanon=t.canonical.toLowerCase().indexOf(base)>-1;
      var inMatched=matchedStr.indexOf(tok)>-1||matchedStr.indexOf(base)>-1;
      if(!inCanon&&!inMatched&&tok!=='-') out.push('unexpected option "'+tok+'"');
    }
  });
  ['delete','remove','drain','cordon','patch','apply','replace','taint'].forEach(function(d){
    if(tokens.indexOf(d)>-1 && t.canonical.toLowerCase().indexOf(d)===-1) out.push('state-changing word "'+d+'" is not part of this read-only task');
  });
  return out.filter(function(v,i,a){ return a.indexOf(v)===i; });
}

/* ===================== FEEDBACK ===================== */
function feedbackHtml(ex,idx){
  var g=S.credits[idx]; if(!g) return '';
  var c=g.credit;
  var label,cls,icon;
  if(c>=0.999){ label='CORRECT'; cls='f-ok'; icon='✓'; }
  else if(c>0){ label='PARTIALLY CORRECT'; cls='f-part'; icon='✓'; }
  else { label='INCORRECT'; cls='f-bad'; icon='✗'; }
  var creditLine='credit '+c.toFixed(2)+' of 1.00'+(g.N>1?(' — '+Math.round(c*g.N)+' of '+g.N+' items, (H−W)/N'):' — single-answer (binary)')+(S.hintUsed[idx]?' · hint penalty applied (−0.10)':' · no hint used');
  var h='<div class="fb '+cls+'" role="region" aria-live="polite" aria-label="Feedback: '+label+'">'+
    '<div class="fbh">'+icon+' '+label+'<span class="credit">'+creditLine+'</span></div><div class="fbb">';
  if(g.N>1){ h+='<div class="items">'+g.items.map(function(it){ return '<div class="item '+it.cls+'"><span class="ic" aria-hidden="true">'+it.st.charAt(0)+'</span><span>'+esc(it.st.slice(2))+(it.why?' — <span class="muted">'+esc(it.why)+'</span>':'')+'</span></div>'; }).join('')+'</div>'; }
  else { h+='<div class="items">'+g.items.map(function(it){ return '<div class="item '+it.cls+'"><span class="ic" aria-hidden="true">'+it.st.charAt(0)+'</span><span>'+esc(it.st.slice(2))+'</span></div>'; }).join('')+'</div>'; }
  if(ex.type==='term'){
    h+='<h5>Canonical command</h5><div class="canon"><code>'+esc(ex.term.canonical)+'</code></div>';
    if(ex.term.canonExpl) h+='<p class="expl">'+ex.term.canonExpl+'</p>';
  }
  h+='<h5>Why</h5><p class="expl">'+ex.expl+'</p>';
  h+='<h5>What to study</h5><p class="study">'+esc(ex.study)+'</p></div></div>';
  return h;
}

/* ===================== NAV / ACTIONS ===================== */
function nextExercise(first){
  S.cur++;
  if(S.cur<TOTAL){ S.idx=S.order[S.cur]; S.fromReview=false; renderExam(); }
  else { S.fromReview=false; afterLast(); }
}
function afterLast(){
  if(S.skipped.length>0&&S.timer.state!=='ENDED'){ renderReview(); }
  else { endTime(); }
}
function doCheck(){
  if(S.inFeedback[S.idx]) return;
  var ex=EX.exercises[S.idx];
  if(!haveAnswer(ex,S.idx)){
    S.notice='⚠ Choose or place at least one answer first — or use Skip if you want to answer later.';
    renderExam();
    return;
  }
  S.notice='';
  setTimerState('PAUSED_AUTO_CHECK');
  var g=grade(ex,S.idx);
  S.credits[S.idx]=g; S.inFeedback[S.idx]=true;
  S.answered++; S.sum+=g.credit;
  renderExam();
}
function doNext(){
  S.notice='';
  setTimerState('RUNNING');
  if(S.fromReview){ S.fromReview=false; renderReview(); return; }
  nextExercise();
}
function doSkip(){
  if(S.inFeedback[S.idx]) return;
  S.notice='';
  if(S.skipped.indexOf(S.idx)===-1) S.skipped.push(S.idx);
  setTimerState('RUNNING');
  if(S.fromReview){ S.fromReview=false; S.skipped=S.skipped.filter(function(i){return i!==S.idx;}); S.skipped.push(S.idx); renderReview(); return; }
  S.cur++;
  if(S.cur<TOTAL){ S.idx=S.order[S.cur]; renderExam(); }
  else { afterLast(); }
}
function doHint(){
  if(S.inFeedback[S.idx]||S.hintUsed[S.idx]) return;
  S.hintUsed[S.idx]=true;
  renderExam();          /* the renderer emits the hint panel for hint-used exercises */
  updateHdr();
}
function doPause(){
  if(S.timer.state==='PAUSED_MANUAL'){ setTimerState(S.prevRunningState==='PAUSED_AUTO_CHECK'?'PAUSED_AUTO_CHECK':'RUNNING'); renderExam(); }
  else if(S.timer.state==='RUNNING'||S.timer.state==='PAUSED_AUTO_CHECK'){ S.prevRunningState=S.timer.state; setTimerState('PAUSED_MANUAL'); renderExam(); }
}
function endTime(auto){
  setTimerState('ENDED');
  renderResults();
}
/* ===================== REVIEW VIEW ===================== */
function renderReview(){
  S.view='review';
  var h='<h2 class="sec" style="color:var(--state-skipped)">⚠ Review skipped exercises</h2>'+
  '<div class="card prose"><p>You skipped '+S.skipped.length+' exercise'+(S.skipped.length===1?'':'s')+'. They are not graded yet. You can answer as many as you want while the timer still runs.</p>'+
  '<p class="muted">If you finish now, skipped exercises stay unanswered and are <b>excluded from the score</b> — they count neither for nor against you.</p></div>';
  S.skipped.forEach(function(idx){
    var ex=EX.exercises[idx];
    var answered=S.inFeedback[idx]!==undefined;
    h+='<div class="revrow"><span style="color:var(--state-skipped);font-weight:800" aria-hidden="true">⚠</span>'+
      '<span class="badge-sev '+SEVCLS+'" role="img" aria-label="Severity '+SEVWORD+'"><span class="dot" aria-hidden="true"></span>'+SEVWORD+'</span>'+
      '<span class="t"><b>Exercise '+(S.order.indexOf(idx)+1)+'</b> — '+esc(ex.scenSum)+'</span>'+
      (answered?'<span class="chip">✓ answered</span>':'<button class="btn sm" data-act="rev" data-i="'+idx+'" aria-label="Answer this skipped exercise">Answer →</button>')+
      '</div>';
  });
  h+='<div class="navrow"><button class="btn primary" data-act="finish" aria-label="Finish exam and see results">Finish exam →</button>'+
    '<span class="note">Timer keeps running during review.</span></div>';
  $('view').innerHTML=h;
  updateHdr();
  window.scrollTo(0,0);
}
/* ===================== RESULTS VIEW ===================== */
function renderResults(){
  S.view='results';
  var full=0,part=0,zero=0,partSum=0;
  Object.keys(S.credits).forEach(function(k){
    var c=S.credits[k].credit;
    if(c>=0.999) full++;
    else if(c>0){ part++; partSum+=c; }
    else zero++;
  });
  var skippedNever=TOTAL-S.answered;   /* exercises never answered (skipped or timeout) — excluded from score */
  var pct=(S.answered>0)?Math.round((S.sum/S.answered)*100):0;
  var passed=pct>=70;
  var h='<div class="card res-hero '+(passed?'pass':'fail')+'">'+
    '<div class="pct" aria-label="Final score '+pct+' percent">'+pct+'%</div>'+
    '<div class="verdict" role="status">'+(passed?'✓ PASS':'✗ FAIL')+'</div>'+
    '<div class="muted" style="margin-top:8px">Final score <b class="mono">'+S.sum.toFixed(1)+' / '+S.answered+'</b> over answered exercises · pass mark 70% · '+SEVWORD+' exam</div>'+
  '</div>';
  h+='<div class="resgrid">'+
    '<div class="rescard ok"><div class="num" aria-label="Fully correct count">'+full+'</div><div class="lab">✓ Fully correct</div></div>'+
    '<div class="rescard part"><div class="num">'+part+'</div><div class="lab">✓ Partially correct'+(part?' — avg '+(partSum/part).toFixed(2):'')+'</div></div>'+
    '<div class="rescard bad"><div class="num">'+zero+'</div><div class="lab">✗ Fully incorrect</div></div>'+
    '<div class="rescard skip"><div class="num">'+(TOTAL-S.answered)+'</div><div class="lab">⚠ Skipped — excluded</div></div>'+
  '</div>';
  h+='<div class="card prose">'+
    '<h3 style="margin-top:0">'+(passed?'🎓 Certificate-style result':'📌 Keep going')+'</h3>'+
    (passed?'<div class="certline">This result shows working knowledge of <b>'+esc(EX.objId)+' — '+esc(EX.objName)+'</b> at <b>'+SEVWORD+'</b> level. You can download or screenshot this panel as your record for this attempt.</div>'
           :'<p>You did not reach the 70% pass mark this time. Review the explanations you saw, then press <b>Retake Exam</b> — the exercise order and answer positions are shuffled again.</p>')+
    '<div class="pauselog" aria-label="Pause accounting">'+
      '<span>⏸ Manual pause time: <b class="mono">'+fmt(S.timer.manualMs/1000)+'</b></span>'+
      '<span>⏸ Feedback review time (auto-pause): <b class="mono">'+fmt(S.timer.autoMs/1000)+'</b></span>'+
      '<span>⏱ Time left at submit: <b class="mono">'+fmt(S.timer.remain)+'</b></span>'+
    '</div>'+
  '</div>';
  h+='<div class="navrow"><button class="btn primary" data-act="retake" aria-label="Retake the exam">↺ Retake Exam</button></div>';
  $('view').innerHTML=h;
  updateHdr();
  window.scrollTo(0,0);
  if(!S.reported){
    S.reported=true;
    reportScore(S.sum,S.answered);
  }
}
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:METACFG.topicId,
      batch:METACFG.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=70
    },location.origin);
  }catch(e){ /* opened directly — nothing to report to */ }
}
/* ===================== EVENTS ===================== */
document.addEventListener('click',function(ev){
  var btn=ev.target.closest('[data-act]');
  if(!btn) return;
  var act=btn.getAttribute('data-act');
  var ex=EX.exercises[S.idx];
  switch(act){
    case 'start': startExam(); break;
    case 'collapse': S.collapsed[S.idx]=!S.collapsed[S.idx]; renderExam(); break;
    case 'check': doCheck(); break;
    case 'next': doNext(); break;
    case 'skip': doSkip(); break;
    case 'hint': doHint(); break;
    case 'pause': doPause(); break;
    case 'retake': startExam(); break;
    case 'finish': endTime(); break;
    case 'rev': {
      var i=parseInt(btn.getAttribute('data-i'),10);
      S.idx=i; S.fromReview=true; setTimerState('RUNNING'); S.view='exam'; renderExam(); break;
    }
    case 'opt': {
      var oi=parseInt(btn.getAttribute('data-i'),10);
      if(!ex) break;
      var a=S.answers[S.idx]||(S.answers[S.idx]={});
      if(ex.type==='qcm'){ a.sel=oi; }
      else { a.sel=a.sel||{}; if(a.sel[oi]) delete a.sel[oi]; else a.sel[oi]=1; }
      renderExam(); break;
    }
    case 'mleft': S.selLeft=parseInt(btn.getAttribute('data-i'),10); S.selRight=null; renderExam(); break;
    case 'mright': {
      if(S.selLeft===null||S.selLeft===undefined) { S.notice='⚠ Pick an item on the left first, then pick its match.'; renderExam(); break; }
      var ri=parseInt(btn.getAttribute('data-i'),10);
      var am=S.answers[S.idx]||(S.answers[S.idx]={assign:{}});
      am.assign[S.selLeft]=ri; S.selRight=ri; S.notice=''; renderExam(); break;
    }
    case 'ditem': S.selItem=parseInt(btn.getAttribute('data-i'),10); renderExam(); break;
    case 'dzone': {
      if(S.selItem===null||S.selItem===undefined){ break; }
      var zid=btn.getAttribute('data-i');
      var ad=S.answers[S.idx]||(S.answers[S.idx]={place:{}});
      ad.place[S.selItem]=zid; S.selItem=null; renderExam(); break;
    }
    case 'dunplace': {
      var ii=parseInt(btn.getAttribute('data-i'),10);
      var ad2=S.answers[S.idx]||(S.answers[S.idx]={place:{}});
      if(S.selItem!==null&&S.selItem!==undefined){
        var zhost=btn.closest('.zone');
        if(zhost) ad2.place[S.selItem]=zhost.getAttribute('data-zone');
        S.selItem=null;
      } else {
        ad2.place[ii]=null;
      }
      renderExam(); break;
    }
    case 'oup': case 'odown': {
      var jj=parseInt(btn.getAttribute('data-i'),10);
      var ao=S.answers[S.idx]||(S.answers[S.idx]={seq:S.perms[S.idx].order.slice()});
      var pos=ao.seq.indexOf(jj);
      var to=act==='oup'?pos-1:pos+1;
      if(to<0||to>=ao.seq.length) break;
      var tmp=ao.seq[pos]; ao.seq[pos]=ao.seq[to]; ao.seq[to]=tmp;
      renderExam(); break;
    }
    case 'wbank': {
      S.selWord=btn.getAttribute('data-w');
      var exf=EX.exercises[S.idx];
      var af=S.answers[S.idx]||(S.answers[S.idx]={fills:{}});
      var target=-1;
      exf.text.forEach(function(seg){ if(typeof seg!=='string'&&target===-1){ var bb=seg.b; if(!af.fills[bb]) target=bb; } });
      if(target>-1){ af.fills[target]=S.selWord; S.selWord=null; }
      renderExam(); break;
    }
    case 'trun': runTerm(); break;
    case 'bopt': {
      var si=parseInt(btn.getAttribute('data-s'),10), boi=parseInt(btn.getAttribute('data-i'),10);
      var ab=S.answers[S.idx]||(S.answers[S.idx]={choices:{},step:0});
      ab.choices[si]=boi; renderExam(); break;
    }
    case 'bconfirm': {
      var ab2=S.answers[S.idx]||(S.answers[S.idx]={choices:{},step:0});
      if(ab2.choices[ab2.step]===undefined){ S.notice='⚠ Choose one option for this step, then confirm.'; renderExam(); break; }
      S.notice='';
      if(ab2.step<ex.steps.length-1){ ab2.step++; renderExam(); }
      else { doCheck(); }
      break;
    }
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t&&t.classList&&t.classList.contains('blankin')){
    var b=parseInt(t.getAttribute('data-b'),10);
    var a=S.answers[S.idx]||(S.answers[S.idx]={fills:{}});
    a.fills[b]=t.value;
    t.classList.toggle('filled', !!t.value);
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.target&&ev.target.id==='termin'&&ev.key==='Enter'){ ev.preventDefault(); runTerm(); }
});
document.addEventListener('dragstart',function(ev){
  var el=ev.target.closest('[draggable="true"]');
  if(!el) return;
  ev.dataTransfer.setData('text/plain',el.getAttribute('data-i')||'');
  el.classList.add('dragging');
});
document.addEventListener('dragend',function(ev){
  var el=ev.target.closest('.dragging'); if(el) el.classList.remove('dragging');
});
document.addEventListener('dragover',function(ev){
  var z=ev.target.closest('.zone');
  if(z){ ev.preventDefault(); z.classList.add('over'); }
});
document.addEventListener('dragleave',function(ev){
  var z=ev.target.closest('.zone'); if(z) z.classList.remove('over');
});
document.addEventListener('drop',function(ev){
  var z=ev.target.closest('.zone');
  if(!z) return;
  ev.preventDefault(); z.classList.remove('over');
  var di=ev.dataTransfer.getData('text/plain');
  if(di==='') return;
  S.selItem=parseInt(di,10);
  var ex=EX.exercises[S.idx];
  var ad=S.answers[S.idx]||(S.answers[S.idx]={place:{}});
  ad.place[S.selItem]=z.getAttribute('data-zone');
  S.selItem=null; renderExam();
});
document.addEventListener('dragstart',function(ev){
  var row=ev.target.closest('.orow');
  if(!row) return;
  ev.dataTransfer.setData('text/orow',row.getAttribute('data-i'));
});
document.addEventListener('dragover',function(ev){
  var row=ev.target.closest('.orow');
  if(row&&ev.dataTransfer.types.indexOf('text/orow')>-1){ ev.preventDefault(); }
});
document.addEventListener('drop',function(ev){
  var row=ev.target.closest('.orow');
  if(!row) return;
  var src=ev.dataTransfer.getData('text/orow');
  if(src==='') return;
  ev.preventDefault();
  var ex=EX.exercises[S.idx];
  var ao=S.answers[S.idx]||(S.answers[S.idx]={seq:S.perms[S.idx].order.slice()});
  var si=parseInt(src,10), ti=parseInt(row.getAttribute('data-i'),10);
  var a=ao.seq.indexOf(si), b=ao.seq.indexOf(ti);
  if(a<0||b<0) return;
  ao.seq.splice(b,0,ao.seq.splice(a,1)[0]);
  renderExam();
});
/* ===================== TERMINAL ===================== */
function runTerm(){
  var ex=EX.exercises[S.idx];
  if(!ex||ex.type!=='term') return;
  var t=ex.term;
  var inp=$('termin'); if(!inp) return;
  var cmd=inp.value;
  if(!cmd.trim()) return;
  var hist=S.termHist[S.idx];
  var a=S.answers[S.idx]||(S.answers[S.idx]={cmd:cmd});
  a.cmd=cmd;
  var n=normCmd(cmd);
  var cls='echo', txt=t.prompt+' '+cmd;
  hist.push({cls:'echo',t:txt});
  var dangerHit=false;
  (t.danger||[]).forEach(function(d){ if(n.indexOf(d)>-1) dangerHit=true; });
  var allOk=t.elements.every(function(el){ return new RegExp(el.re,'i').test(n); });
  if(dangerHit){
    hist.push({cls:'err',t:'error: this would change cluster state or destroy evidence — simulation blocked the real effect'});
  } else if(allOk){
    (t.out||['(ok)']).forEach(function(l){ hist.push({cls:'good',t:l}); });
  } else {
    var toolOk=new RegExp('^kubectl(\\s|$)','i').test(n);
    if(!toolOk){ hist.push({cls:'err',t:'command not found: '+cmd.split(' ')[0]}); }
    else { hist.push({cls:'err',t:(t.err||'error: wrong arguments — the goal needs different options')}); }
  }
  renderExam();
  var sc=$('scr-'+S.idx); if(sc) sc.scrollTop=sc.scrollHeight;
  var ti=$('termin'); if(ti&&!S.inFeedback[S.idx]) ti.focus();
}
/* ===================== HANDSHAKE ===================== */
window.addEventListener('message',function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT') return;
  S.user.name=event.data.username||'';
  S.user.country=event.data.country||'';
  S.user.locale=event.data.locale||'en';
  /* theme is always 'dark'; this file is dark-only by contract — nothing to switch */
  updateHdr();
});

function boot(){
  var app=document.getElementById('app');
  app.innerHTML='<div id="hdr" class="hdr"></div><div id="view"></div>';
  renderIntro();
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',boot); } else { boot(); }
})();
