*{box-sizing:border-box}

/* ---------- persistent exam header ---------- */
#hdr{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--bg-base);border-bottom:1px solid var(--border);padding:10px 4px;margin:0 -16px 14px;padding-left:16px;padding-right:16px}

.hdr-timer{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-weight:700;font-size:14px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:999px;padding:6px 14px}

.ts-pman{color:var(--accent-amber)}

#t-state{font-family:var(--sans);font-size:12px;font-weight:700}
.hdr-score{font-weight:700;font-size:14px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:999px;padding:6px 14px}

.btn:hover{border-color:var(--accent-blue)}
.btn.primary{border-color:var(--accent-green);background:var(--accent-green-dim)}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;min-width:44px;padding:6px 12px;font-size:13px}
.btn.big{min-height:52px;padding:12px 34px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.hintbtn{border-color:var(--accent-amber)}
.btn.skipbtn{border-color:var(--border-strong)}

/* ---------- intro ---------- */

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-surface-2);border:1px solid var(--border-strong);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:700;color:var(--text-2)}
.i-sec{background:var(--bg-surface-1);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-top:16px}
.kw{display:flex;flex-wrap:wrap;gap:8px}
.kw-chip{display:inline-block;background:var(--bg-surface-2);border:1px solid var(--border-strong);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--text-2)}

.badge.sev-easy{color:var(--sev-easy);border-color:var(--sev-easy);background:var(--sev-easy-dim)}
.badge.sev-medium{color:var(--sev-medium);border-color:var(--sev-medium);background:var(--sev-medium-dim)}
.badge.sev-hard{color:var(--sev-hard);border-color:var(--sev-hard);background:var(--sev-hard-dim)}
.badge.sev-extreme{color:var(--sev-extreme);border-color:var(--sev-extreme);background:var(--sev-extreme-dim)}

/* ---------- exercise card and fixed three-block accents ---------- */

.block{border:1px solid var(--border);border-left:4px solid var(--b-accent);background:var(--bg-surface-2);border-radius:10px;padding:12px 16px;margin:12px 0}

.block-question{--b-accent:var(--accent-amber)}
.block-answer{--b-accent:var(--accent-green)}

.block-body{color:var(--text-1)}
.block-body.collapsed{display:none}
.log{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:13px;color:var(--term-out);white-space:pre-wrap;overflow-x:auto;margin:8px 0}

code{font-family:var(--mono);font-size:13px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:1px 6px;color:var(--term-out)}

.opts{margin:4px 0}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;min-height:48px;border:1px solid var(--border);border-radius:10px;margin:8px 0;cursor:pointer;background:var(--bg-surface-1)}
.opt:hover{border-color:var(--border-strong)}
.opt.sel{border-color:var(--accent-green);background:var(--accent-green-dim)}
.opt input{margin-top:4px;accent-color:var(--accent-green);width:18px;height:18px;flex:none}
.opt-txt{flex:1}
.opt-b{display:block;width:100%;text-align:left;padding:12px 14px;min-height:48px;border:1px solid var(--border);border-radius:10px;margin:8px 0;cursor:pointer;background:var(--bg-surface-1);color:var(--text-1);font-size:15px}
.opt-b:hover{border-color:var(--border-strong)}
.opt-b.sel{border-color:var(--accent-green);background:var(--accent-green-dim)}

select{min-height:44px;background:var(--bg-surface-2);color:var(--text-1);border:1px solid var(--border-strong);border-radius:8px;padding:6px 10px;font-size:14px;max-width:100%}

.dd-zone{border:1px solid var(--border-strong);border-radius:10px;padding:8px;min-height:104px;background:var(--bg-surface-1)}
.dd-zone.over{border-color:var(--accent-blue);background:var(--accent-blue-dim)}
.dd-zl{font-weight:800;color:var(--accent-blue);font-size:13px;margin-bottom:6px}
.dd-drop{display:flex;flex-direction:column;gap:6px;min-height:58px}
.dd-chip{display:block;width:100%;text-align:left;min-height:44px;padding:9px 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--bg-surface-2);color:var(--text-1);font-size:14px;cursor:grab}
.dd-chip.picked{border-color:var(--accent-amber);background:var(--accent-amber-dim)}

.ord-n{font-family:var(--mono);color:var(--text-3);min-width:22px;text-align:right}
.ord-t{flex:1}
.ord-btns{display:flex;gap:6px}

.b-step{color:var(--accent-amber);font-weight:700;font-size:13px;margin:6px 0}
.b-q{font-weight:700;margin:8px 0}

.task{font-size:14px;padding:4px 0;color:var(--text-2)}
.task.t-hit{color:var(--ok)}
.task.t-danger{color:var(--sev-hard);font-weight:700}
.term{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-family:var(--mono)}
.term-out{max-height:230px;overflow:auto;font-size:13px}
.t-line{white-space:pre-wrap;word-break:break-word;padding:1px 0}

.t-cmd::before{content:'$ ';color:var(--term-prompt)}

.t-err{color:var(--bad)}
.t-warn{color:var(--sev-hard);font-weight:700}
.t-note{color:var(--accent-amber)}

/* ---------- hint, feedback ---------- */
.hintbox{border:1px solid var(--accent-amber);background:var(--accent-amber-dim);padding:10px 14px;border-radius:10px;margin-top:12px;color:var(--text-1)}

.f-partial .f-head{color:var(--warn)}
.f-incorrect .f-head{color:var(--bad)}

.f-items{list-style:none;margin:8px 0;padding:0}

.it-hit{color:var(--ok)}
.it-wrong{color:var(--bad)}

.pausecard{max-width:460px;margin:60px auto;background:var(--bg-surface-1);border:1px solid var(--accent-amber);border-radius:14px;padding:30px;text-align:center}

/* ---------- review ---------- */
.r-row{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin:8px 0;background:var(--bg-surface-1)}

.res-hero{text-align:center;background:var(--bg-surface-1);border:1px solid var(--border);border-radius:14px;padding:26px 20px;margin-top:18px}
.res-pct{font-size:52px;font-weight:800;font-family:var(--mono)}
.res-banner{display:inline-block;margin-top:10px;padding:8px 22px;border:1px solid;border-radius:999px;font-weight:800;letter-spacing:.06em}
.res-banner.pass{color:var(--ok);border-color:var(--ok);background:var(--ok-dim)}
.res-banner.fail{color:var(--bad);border-color:var(--bad);background:var(--bad-dim)}
.res-note{color:var(--text-2);font-size:14px;margin-top:10px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:14px}
.res-box{background:var(--bg-surface-1);border:1px solid var(--border);border-radius:12px;padding:12px 16px}
.res-box b{display:block;font-size:22px}
.res-box.ok b{color:var(--ok)}
.res-box.warn b{color:var(--warn)}
.res-box.bad b{color:var(--bad)}
.res-box.neu b{color:var(--neutral)}
.res-lab{color:var(--text-2);font-size:13px}
.res-list{margin-top:14px}
.res-row{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:8px 14px;margin:6px 0;background:var(--bg-surface-1);font-size:14px;flex-wrap:wrap}
.res-state{font-weight:700;white-space:nowrap}
.res-cred{font-family:var(--mono);color:var(--text-2)}
.res-pause{margin-top:14px;font-size:13px;color:var(--text-2);background:var(--bg-surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-family:var(--mono)}

/* ---------- responsive ---------- */
@media (max-width:720px){

}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

<script id="exam-data" type="application/json">{"config":{"title":"T1586.003 EXTREMELY HARD exam - Compromise Accounts: Cloud Accounts","sevName":"EXTREMELY HARD","passMark":70,"estimatedMinutes":45,"budgetSeconds":2700,"introLearn":["T1586.003 is a <b>sub-technique<\/b> in the MITRE ATT&amp;CK framework: <b>Compromise Accounts: Cloud Accounts<\/b>, in the <b>Resource Development<\/b> tactic. This EXTREMELY HARD exam is for learners who already finished the EASY, MEDIUM and HARD exams. Every exercise makes you weigh contradicting signals, costs, and trade-offs, like a real incident or a real red-team engagement.","New heavy ideas appear with short definitions: <b>Golden SAML<\/b> (an attacker with the federation's token-signing certificate can forge sign-in tokens for any identity, with no password and no MFA), <b>token replay<\/b> (reusing a stolen session or refresh token inside its lifetime), <b>baseline blending<\/b> (making attacker actions look like the tenant's normal activity), and <b>cost of action<\/b> (every move an attacker makes trades noise for capability).","The terminal exercise is a defender task with a trap: the obvious 'clean-up' command destroys evidence and breaks production, while the correct command removes only the attacker's access. Choosing the destructive command is flagged as DANGEROUS. Read twice, run once."],"keywords":["Golden SAML","token-signing certificate","SAML token","federation","token replay","refresh token","conditional access","PIM","session revocation","service principal","OAuth grant","GuardDuty","contradictory signals","cost of action","destructive command","evidence handling","baseline blending"],"introHow":["<b>Passing score.<\/b> You need 70% or more to pass. Each exercise gives 1 point. Exercises with several correct parts give part marks.","<b>Exercise types.<\/b> Single-choice, multi-select, matching, ordering, fill-in-the-blank, a branching decision path, and one defender terminal exercise with a destructive-command trap.","<b>Timer.<\/b> Your budget is 50 minutes. Press <b>Pause<\/b> to stop the clock at any time. When you press <b>Check<\/b>, the clock stops by itself while you read the feedback, and starts again on Next. Hint and Skip never stop the clock. Branching Continue buttons do not stop the clock either.","<b>Scoring.<\/b> Multi-part exercises give part marks: correct parts add, wrong picks subtract, never below zero. Using the Hint costs 10% of that exercise's credit.","<b>Skip.<\/b> Skipped exercises wait in a review screen at the end. Exercises you never answer are not counted in your score.","Press Start when you are ready. In this exam the obvious answer is often the trap."]},"exercises":[{"id":"x01","type":"branch","label":"Purple-team path in Azure (branching)","persp":"attacker","scenario":"<pre class='log'>Purple-team exercise. Rules: stay quiet, no PIM alerts, no new tenants.\nTenant:      Azure + Entra ID\nBlocks:      legacy auth off; phishing-resistant MFA on all admins;\n             PIM alerts on every role activation\nHeld:        refresh token of a cloud engineer (info-stealer log)\nConstraint:  actions must survive a password reset<\/pre>","question":"Work the decision path, then choose the signal pairs that would expose the exercise fastest.","hint":"Token replay works without a password; PIM activation pages the SOC; storage and VMs under existing naming rules are invisible.","explain":"The quiet path: <b>replay the refresh token<\/b> from a matching network (no password, no MFA), <b>avoid PIM activation<\/b> (it alerts by design), and develop resources <b>inside the existing subscription and naming style<\/b>. The fastest exposures are <b>PIM activation + new admin role assignment<\/b> and <b>unknown-app OAuth grant + mass mail reads<\/b>: both combine a rare event with a behaviour change. Routine listings and expired report lines are noise the SOC sees every day. If you picked either of those, re-read the rule: exposures come from rare events, not daily ones.","data":{"nodes":[{"add":"You hold a valid refresh token. Conditional Access blocks legacy auth but allows modern OAuth from compliant-looking clients.","prompt":"How do you get working access?","options":[{"html":"Replay the refresh token against the OAuth endpoints from a residential proxy that matches the user's usual network"},{"html":"Brute-force the admin portal until MFA is disabled"},{"html":"Ask the service desk for an SMS reset"}]},{"add":"The token works. You can read mail and directories via the Graph API.","prompt":"Which action do you avoid, because it pages the SOC within minutes?","options":[{"html":"Activating a PIM-protected admin role"},{"html":"Opening a document library the user visits daily"},{"html":"Listing group memberships"}]},{"add":"You decide to develop resources under an existing subscription.","prompt":"Which development choice stays inside the tenant baseline?","options":[{"html":"A small VM plus a storage container following the tenant's existing naming convention"},{"html":"A new subscription with a GPU cluster"},{"html":"A public storage container named 'stolen-backups'"}]}],"final":{"prompt":"Final decision: select the signal pairs that would expose the exercise fastest.","options":[{"html":"Routine storage listings combined with daily document opens"},{"html":"An expired conditional-access report line"},{"html":"PIM role activation alert combined with a new admin role assignment"},{"html":"An OAuth grant to an unknown publisher app followed by mass mail reads"}],"answer":[2,3]}}},{"id":"x02","type":"qcm-single","label":"Contradictory signals","persp":"defender","scenario":"<pre class='log'>04:10  Console session from the user's home ISP, usual device fingerprint\n04:12  CreateAccessKey from a datacentre ASN, different country\n04:15  The new key lists buckets from a third continent\nUser:  asleep, denies nothing (was not asked yet), MFA log clean\nHome:  no roommate, laptop reported intact<\/pre>","question":"Which conclusion is best supported by this evidence?","hint":"One line says 'the user', two lines say 'someone else with a valid session'.","explain":"The home-ISP session at 04:10 can be <b>replayed session material<\/b> (a stolen cookie carries the device fingerprint with it), so 'same ISP and fingerprint' does not prove the user. The key creation from a <b>datacentre ASN<\/b> and use from a <b>third continent<\/b> minutes later cannot be the sleeping user. The best-supported story is token or cookie replay. Night shift contradicts the user being asleep, and intact logs with three consistent lines are not corruption.","options":[{"html":"False positive, because the same ISP proves the user"},{"html":"The logs are corrupted and cannot be trusted"},{"html":"Session or token replay: someone reused a valid session while the user slept; the datacentre key creation is the tell"},{"html":"The user is working a night shift; everything is benign"}],"answer":2},{"id":"x03","type":"terminal","label":"IR terminal: remove without damage","persp":"defender","scenario":"<pre class='log'>You are incident response. Rogue key found on user svc-backup:\n  AKIAY7XRR3K9PL2QVTHB\nConstraints:\n  - remove the attacker's access\n  - do NOT destroy evidence\n  - do NOT break the production jobs that use the LEGITIMATE key\nThink before you type: the wrong 'cleanup' command makes things worse.<\/pre>","question":"Type the command that removes exactly the rogue key, then press Check answer.","hint":"IAM has a command that deletes one access key of a user. It needs both the key ID and the user name. Deleting the whole user is NOT that command.","explain":"The canonical command is <code>aws iam delete-access-key --access-key-id AKIAY7XRR3K9PL2QVTHB --user-name svc-backup<\/code>: it removes exactly the rogue key, keeps the user (and its evidence) alive, and the legitimate key keeps running the backup job. If you typed <code>aws iam delete-user<\/code>, that was the <b>destructive trap<\/b>: it deletes the whole user, destroys the evidence trail and breaks production. If you only listed keys, you stopped one step short: the task was to delete.","data":{"prompt":"responder@soc:~$","banner":"AWS CLI simulator - incident response session. Type 'help' for commands.","tasks":[{"label":"Delete the rogue access key AKIAY7XRR3K9PL2QVTHB from user svc-backup","accept":"^aws\\s+iam\\s+delete-access-key\\b(?=.*AKIAY7XRR3K9PL2QVTHB)(?=.*svc-backup)","danger":"^aws\\s+iam\\s+delete-user\\b"}],"dangerous":[{"match":"^aws\\s+iam\\s+delete-user\\b","why":"delete-user removes the whole account: you lose the evidence trail tied to the user and break every job that runs as it. Delete only the rogue key."}],"nearmiss":[{"match":"^aws\\s+iam\\s+list-access-keys\\b","note":"listing keys is safe, but the task is to delete the rogue one - use the delete command with the key ID."}],"sim":[{"match":"^help$","out":"Available commands:\n  aws iam list-access-keys --user-name USER\n  aws iam delete-access-key --access-key-id KEY --user-name USER\n  aws iam delete-user --user-name USER\n  clear"},{"match":"^aws\\s+iam\\s+list-access-keys","out":"{\n    \"AccessKeyMetadata\": [\n        {\"UserName\": \"svc-backup\", \"AccessKeyId\": \"AKIAJ4EXAMPLEOLDKEY\", \"Status\": \"Active\", \"Note\": \"used by nightly backup job\"},\n        {\"UserName\": \"svc-backup\", \"AccessKeyId\": \"AKIAY7XRR3K9PL2QVTHB\", \"Status\": \"Active\", \"Note\": \"rogue key\"}\n    ]\n}"},{"match":"^aws\\s+iam\\s+delete-access-key\\s+--access-key-id\\s+AKIAY7XRR3K9PL2QVTHB","out":"Deleted access key AKIAY7XRR3K9PL2QVTHB for user svc-backup.\nCloudTrail event recorded. Nightly backup job (legit key) unaffected."},{"match":"^aws\\s+iam\\s+delete-access-key","out":"Error: both --access-key-id and --user-name are required. Nothing was changed."},{"match":"^aws\\s+iam\\s+delete-user","out":"(blocked by simulator policy - see the warning above)"}]}},{"id":"x04","type":"qcm-multi","label":"Signal stacking","persp":"defender","scenario":"A detection lead rewrites the alert policy: single weak signals stay informational, only stacked signals page someone. She asks the team which stacks deserve a page.","question":"Select <b>all<\/b> the signal combinations that give HIGH confidence of cloud-account compromise.","hint":"Each correct stack links access, a change made by the attacker, and use of that change.","explain":"High confidence needs <b>rare event + attacker-owned change + use<\/b>: a fresh key used from a new network within minutes; an unknown-app grant followed by bulk reads; denied prompts turning into a success from a new device together with a federation change (that change can kill MFA for everyone). A user's own password change, a usual-phone sign-in and a scheduled report are daily noise.","options":[{"html":"One sign-in from the user's usual phone"},{"html":"A scheduled monthly report email"},{"html":"A new access key, a sign-in from a new network, and use of the key within minutes"},{"html":"An OAuth grant to an unknown app followed by mass mail reads"},{"html":"Denied MFA prompts, then a success from a new device, plus a federation setting change"},{"html":"A single password change made by the user during work hours"}],"answer":[2,3,4]},{"id":"x05","type":"qcm-single","label":"Cost of action","persp":"attacker","scenario":"<pre class='log'>Stolen: one admin session (cookie), 60-day plan.\nOptions and their alert costs:\n (a) create a new sub-account     -> 'new user created' alert, anomaly\n (b) reuse existing service account -> blends in, shared blast radius\n (c) attach a new policy to an existing role -> high-privilege change alert\n (d) stay read-only forever       -> no alerts, but no resources developed<\/pre>","question":"For a 60-day quiet Resource Development plan, which option is the best trade-off?","hint":"The plan needs resources eventually, so (d) fails the mission; find the option that both works and blends.","explain":"<b>(b)<\/b> is the best trade-off: the service account already runs automation, so tenant-normal actions through it blend in, and it can still create resources. <b>(a)<\/b> buys capability with a creation alert on day one; <b>(c)<\/b> is a high-privilege change that policy alerts catch; <b>(d)<\/b> is silent but fails the mission, because Resource Development needs created resources. Cost of action means paying attention to what each move buys and what it announces.","options":[{"html":"(a) create a new sub-account immediately"},{"html":"(c) attach a new policy to an existing role"},{"html":"(d) stay read-only forever"},{"html":"(b) reuse the existing service account with tenant-normal actions"}],"answer":3},{"id":"x06","type":"qcm-single","label":"Golden SAML severity","persp":"concept","scenario":"In a documented attack pattern, the intruder dumps the ADFS token-signing certificate from a federation server, forges a SAML token for any user in the domain, and signs in to the cloud side as an admin. No password is typed and no MFA prompt appears.","question":"Why is Golden SAML so hard to catch with normal sign-in defences?","hint":"From the cloud's point of view, the forged token is genuine.","explain":"The cloud trusts tokens signed by the federation's <b>token-signing certificate<\/b>. A forged SAML token is, technically, a perfectly normal sign-in: trusted source, no password step, <b>no MFA step<\/b>. Only unusual artefacts - the certificate being exported, tokens with odd lifetimes or claims, sign-ins without matching federation events - expose it. Conditional access sees a valid login, not a failure.","options":[{"html":"It only works on workstations, so the cloud is safe"},{"html":"The forged token expires within one second"},{"html":"The sign-in looks fully trusted and MFA is never invoked, so only rare certificate or signing anomalies reveal it"},{"html":"It fails every conditional-access policy and shows up as failed logins"}],"answer":2},{"id":"x07","type":"matching","label":"Chain of techniques","persp":"concept","scenario":"A CTI analyst maps the full chain around a compromised cloud account to ATT&CK. Each technique has one role in the chain.","question":"Match each technique to its role in the chain.","hint":"Follow the life of the account: taken, opened without MFA, tokenized, kept, used.","explain":"The chain: <b>T1566<\/b> steals the credentials, <b>T1539<\/b> turns a stolen cookie into an MFA-free session, <b>T1528<\/b> abuses stolen OAuth tokens, <b>T1098<\/b> adds keys or roles so a reset does not evict the attacker, and <b>T1078.004<\/b> covers acting with the valid account. Ransomware encryption belongs to a different story.","data":{"pairs":[{"left":"T1566 Phishing","right":"Harvests the cloud credentials in the first place"},{"left":"T1539 Steal Web Session Cookie","right":"Lets the attacker skip password and MFA"},{"left":"T1528 Steal Application Access Token","right":"Gives OAuth token access to cloud data"},{"left":"T1098 Account Manipulation","right":"Adds keys or roles to keep access"},{"left":"T1078.004 Valid Accounts: Cloud","right":"Uses the compromised account to act"}],"rights":["Harvests the cloud credentials in the first place","Lets the attacker skip password and MFA","Gives OAuth token access to cloud data","Adds keys or roles to keep access","Uses the compromised account to act","Encrypts files for ransom"]}},{"id":"x08","type":"qcm-multi","label":"Baseline blending","persp":"attacker","scenario":"An attacker studies 30 days of tenant activity and builds a profile: two regions, three instance families, nine-to-eighteen API activity, service accounts with naming like svc-*, storage names like proj-*.","question":"Select <b>all<\/b> the choices that blend into this tenant baseline.","hint":"Four options copy the tenant; two invent a new normal.","explain":"Blending means copying the measured baseline: <b>existing regions and families<\/b>, <b>normal hours<\/b>, <b>tenant-style names<\/b>, and <b>already-automated service accounts<\/b>. A first GPU fleet and a bucket named staging-stolen-data create brand-new shapes that anomaly rules love.","options":[{"html":"Follow the tenant's naming style for new resources"},{"html":"Use service accounts the tenant already automates with"},{"html":"Spin up the tenant's first-ever GPU fleet"},{"html":"Name a bucket staging-stolen-data"},{"html":"Reuse the regions and instance families the tenant already uses"},{"html":"Run API activity inside the tenant's normal hours"}],"answer":[4,5,0,1]},{"id":"x09","type":"order","label":"Rank the controls","persp":"defender","scenario":"A CISO with a limited budget asks for a ranking: which control reduces the risk of cloud account takeover the most per unit of cost? Rank from strongest to weakest.","question":"Put the four controls in order of risk reduction for cloud account takeover.","hint":"Ask for each control: can the attack still work at all, and how much of it does the control kill?","explain":"Rank: <b>1)<\/b> phishing-resistant MFA (kills password phishing and push spam outright - the two main ways in), <b>2)<\/b> conditional access (blocks stolen tokens from unknown devices or places), <b>3)<\/b> short sessions and revocation (limits what a stolen session is worth and for how long), <b>4)<\/b> tuned audit alerts (they shorten the attack, but only after it started). Detection is last because prevention removes the whole class of attempts.","data":{"items":["Phishing-resistant MFA for all users","Conditional Access with device and location rules","Short session lifetimes with a token-revocation runbook","Fine-tuned audit alerts on key, OAuth and federation changes"],"initial":[1,0,3,2]}},{"id":"x10","type":"fill","label":"Golden SAML anatomy","persp":"concept","scenario":"A training slide explains the three ingredients of a Golden SAML attack. Someone removed the three key nouns.","question":"Fill all three blanks.","hint":"Think: what is dumped, what is forged, and what relationship is abused.","explain":"The three ingredients are the <b>token-signing certificate<\/b> (dumped from ADFS), the forged <b>SAML token<\/b> (signed with it, so it looks genuine), and the abused <b>federation trust<\/b> (the cloud still trusts whatever ADFS signs). As long as the trust is not rotated, every forged token is a normal sign-in.","data":{"template":"In a Golden SAML attack, the attacker exports the ADFS token-signing [[0]], forges a SAML [[1]] for any identity, and the cloud side accepts it because the [[2]] between ADFS and the cloud is still trusted.","blanks":[{"answers":["certificate","cert","key"],"label":"what is exported"},{"answers":["token"],"label":"what is forged"},{"answers":["federation","federated trust","trust"],"label":"what is abused"}]}},{"id":"x11","type":"qcm-single","label":"GuardDuty, benign or not","persp":"defender","scenario":"<pre class='log'>Finding: GuardDuty 'Unusual console login by svc-deploy'\nDevice:  corporate-managed, compliant\nSource:  office IP, user on shift, ticket open for maintenance work\nHistory: svc-deploy logs in daily at this hour<\/pre>","question":"What is the best handling of this finding?","hint":"The context says 'normal', but the rule that fired is still worth tuning, not deleting.","explain":"Context (managed device, office IP, on shift, open ticket, daily pattern) makes this <b>likely benign<\/b>, but the correct engineering move is to <b>tune the rule<\/b> so that the managed-device + office-network combination stops paging while everything else still fires. Global suppression, blanket svc-* ignores and disabling the service throw away real coverage for the day the pattern breaks.","options":[{"html":"Ignore every finding about svc-* accounts"},{"html":"Disable GuardDuty entirely"},{"html":"Likely benign: keep the finding, correlate with device posture, and tune the rule to allow managed-device plus office-network combos instead of suppressing it"},{"html":"Delete this finding type globally for all users"}],"answer":2},{"id":"x12","type":"qcm-single","label":"Hardest way in","persp":"attacker","scenario":"<pre class='log'>Defences measured:\n- phishing-resistant MFA on all humans\n- session cookies HttpOnly, 8-hour lifetime\n- OAuth consent for new third-party apps blocked by policy\n- info-stealer logs are on sale and include this tenant<\/pre>","question":"Given these constraints, which path is most viable for the attacker?","hint":"Find the control that still has a gap: the cookie is HttpOnly on the browser, but it still exists and it still works for 8 hours.","explain":"Phishing-resistant MFA kills password phishing, consent is blocked by policy, and brute-forcing a FIDO2 PIN is unrealistic. The gap is the <b>session cookie<\/b>: HttpOnly keeps malware from reading it in the browser, but info-stealers lift cookies from disk stores, and a replayed cookie works without password or MFA until it expires. Speed is everything: the 8-hour lifetime is the attacker's window.","options":[{"html":"Brute-force the FIDO2 key PIN"},{"html":"Buy a stolen session cookie from an info-stealer log and replay it fast, inside its 8-hour lifetime"},{"html":"Phish the password again with a better page"},{"html":"Ask the user to approve a consent screen for your app"}],"answer":1},{"id":"x13","type":"qcm-multi","label":"Evidence before containment","persp":"defender","scenario":"The SOC is one click away from disabling a compromised cloud admin account. A senior responder stops the team for sixty seconds: 'Collect first, then cut.'","question":"Select <b>all<\/b> the evidence you should collect BEFORE disabling the account.","hint":"Four items capture state and history; two actions destroy or leak.","explain":"Before containment you capture: <b>audit event exports<\/b> (what happened), <b>keys and role snapshots<\/b> (what the attacker changed), <b>sessions, refresh tokens and grants<\/b> (what still gives access), and <b>federation changes<\/b> (the Golden-SAML-grade stuff). Deleting the account first destroys the objects you are investigating, and wiping the laptop before export destroys host-side evidence.","options":[{"html":"Delete the account immediately, before any export"},{"html":"Wipe the user's laptop before exporting logs"},{"html":"Export recent CloudTrail and Entra audit events"},{"html":"Snapshot current access keys and role assignments"},{"html":"List active sessions, refresh tokens and OAuth grants"},{"html":"Capture federation and trust configuration changes"}],"answer":[2,3,4,5]},{"id":"x14","type":"qcm-single","label":"Why staging on cloud accounts","persp":"concept","scenario":"A threat-intel briefing compares two ways for an intrusion set to stage operations: rented bulletproof infrastructure versus compromised cloud accounts of real organisations.","question":"Why do many intrusion sets prefer compromised cloud accounts for staging?","hint":"Think about reputation, billing, and who can take the infrastructure down.","explain":"A compromised cloud account borrows a <b>real company's reputation, billing and identity<\/b>: new resources sit behind a trusted tenant, and takedown means engaging the real customer. Attribution gets harder because the activity points at the victim, not the attacker. Tracking still exists (logs are everywhere), and providers do respond to lawful requests - which is exactly why attackers prefer victims' accounts over their own.","options":[{"html":"Cloud accounts are completely untraceable in every case"},{"html":"Providers refuse to cooperate with any investigation"},{"html":"Cloud activity is never written to any log"},{"html":"The activity rides on legitimate billing, identity and reputation, so takedown and attribution are harder"}],"answer":3},{"id":"x15","type":"qcm-single","label":"Revoke before reset","persp":"defender","scenario":"During containment, a junior analyst resets the compromised user's password first and calls it 'done'. Thirty minutes later the attacker is still reading mail via an old session.","question":"Why must sessions and tokens be revoked BEFORE (or together with) the password reset?","hint":"Ask what the stolen session still proves after the password changes.","explain":"A password reset changes the password; it does <b>not<\/b> invalidate sessions, cookies, refresh tokens or OAuth grants that were already issued. That is why the runbook revokes sessions and tokens first (or in the same breath): the attacker's valid session proves 'already signed in', and the cloud keeps honouring it. Logs are untouched by resets, MFA re-enrolment is unrelated, and tokens never expire on a password change.","options":[{"html":"MFA must be re-enrolled before any reset can work"},{"html":"Tokens expire automatically the moment the password changes"},{"html":"Stolen cookies and OAuth tokens survive a password reset, so the attacker keeps access until every session and token is revoked"},{"html":"A password reset deletes CloudTrail logs"}],"answer":2}]}</script>
<script>
(function(){
'use strict';
var META=JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var RAW=JSON.parse(document.getElementById('exam-data').textContent);
var CFG=RAW.config, EXS=RAW.exercises;
window.__EXAM__={config:CFG,exercises:EXS,meta:META};
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function elt(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function stripTags(s){var d=elt('div');d.innerHTML=s;return (d.textContent||'').replace(/\s+/g,' ').trim();}
function shortLabel(o){var t=o.short?o.short:stripTags(o.html||o.text||'');return (t||'item').slice(0,52);}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtT(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function fmtD(sec){sec=Math.round(sec);var m=Math.floor(sec/60);return m+'m '+('0'+(sec%60)).slice(-2)+'s';}
function sevClass(){return {EASY:'sev-easy',MEDIUM:'sev-medium',HARD:'sev-hard','EXTREMELY HARD':'sev-extreme'}[CFG.sevName]||'sev-easy';}

/* ---------------- timer state machine ----------------
   States: IDLE, RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED.
   - Check switches to PAUSED_AUTO_CHECK before feedback is rendered.
   - Next / Final Submit switch back to RUNNING (or ENDED on the last exercise).
   - Skip and Hint never change the timer state.
   - Manual Pause works on top of any state and returns to it on Resume. */
var T={state:'IDLE',remaining:CFG.budgetSeconds,since:0,resumeTo:null,acc:{RUNNING:0,PAUSED_MANUAL:0,PAUSED_AUTO_CHECK:0}};
function accrue(){if(T.since&&T.acc[T.state]!=null){T.acc[T.state]+=(Date.now()-T.since)/1000;}T.since=Date.now();}
function setState(s){if(T.state===s){renderTimer();return;}accrue();T.state=s;if(T.acc[s]==null){T.since=0;}renderTimer();}
function hardResetTimer(){T.state='IDLE';T.since=0;T.remaining=CFG.budgetSeconds;T.resumeTo=null;T.acc={RUNNING:0,PAUSED_MANUAL:0,PAUSED_AUTO_CHECK:0};renderTimer();}
setInterval(function(){
  if(T.state!=='RUNNING'){return;}
  T.remaining-=1;
  if(T.remaining<=0){T.remaining=0;renderTimer();finishExam(true);return;}
  renderTimer();
},1000);
var TMETA={RUNNING:['\u25B6','running'],PAUSED_MANUAL:['\u23F8','Paused'],PAUSED_AUTO_CHECK:['\u23F3','Auto-paused \u00B7 checking'],ENDED:['\u25A0','ended'],IDLE:['\u25CB','ready']};
function renderTimer(){
  var ic=$('#t-icon'),tm=$('#t-time'),st=$('#t-state');
  if(!ic||!tm||!st){return;}
  var m=TMETA[T.state]||TMETA.IDLE;
  ic.textContent=m[0];st.textContent=m[1];tm.textContent=fmtT(Math.max(0,T.remaining));
  st.className={RUNNING:'ts-run',PAUSED_MANUAL:'ts-pman',PAUSED_AUTO_CHECK:'ts-pauto',ENDED:'ts-end',IDLE:'ts-end'}[T.state]||'ts-end';
  tm.classList.toggle('low',T.remaining<=60&&T.state==='RUNNING');
  $('#hdr-timer').setAttribute('aria-label','Timer, state '+m[1]+', time left '+fmtT(Math.max(0,T.remaining)));
}

/* ---------------- session state ---------------- */
var S=null;
function resetAttempt(){
  S={screen:'intro',idx:0,mode:'main',credits:{},checked:{},hint:{},skipped:[],cur:null,prevScreen:'exercise',posted:false,timeUp:false,ddSel:null};
}
resetAttempt();
function scoreSum(){var s=0,k;for(k in S.credits){s+=S.credits[k];}return s;}
function exById(id){for(var i=0;i<EXS.length;i++){if(EXS[i].id===id){return EXS[i];}}return null;}

/* ---------------- header ---------------- */
function renderHeader(){
  var hdr=$('#hdr');if(!hdr){return;}
  var inExam=(S.screen==='exercise'||S.screen==='paused'||S.screen==='review');
  hdr.classList.toggle('hidden',!inExam);
  if(!inExam){return;}
  var counter=$('#hdr-counter'),sev=$('#hdr-sev'),scoreEl=$('#hdr-score'),
      hintB=$('#btn-hint'),skipB=$('#btn-skip'),pauseB=$('#btn-pause');
  if(!counter||!sev||!scoreEl||!hintB||!skipB||!pauseB){return;}
  if(S.mode==='review'||S.screen==='review'){counter.textContent='Reviewing skipped \u00B7 '+S.skipped.length+' left';}
  else{counter.textContent='Exercise '+(S.idx+1)+' of '+EXS.length;}
  scoreEl.textContent='Score: '+(Math.round(scoreSum()*10)/10).toFixed(1);
  sev.className='badge '+sevClass();sev.textContent=CFG.sevName;
  var cur=S.cur;
  var onEx=(S.screen==='exercise');
  hintB.disabled=!onEx||!cur||!!cur.graded||!!S.hint[cur.ex.id];
  skipB.disabled=!onEx||!cur||!!cur.graded||S.mode==='review';
  pauseB.textContent=(T.state==='PAUSED_MANUAL')?'\u23F8 Resume':'\u23F8 Pause';
}

/* ---------------- screens ---------------- */
function show(sc){S.screen=sc;render();}
function render(){
  var st=$('#stage');st.innerHTML='';
  if(S.screen==='intro')renderIntro(st);
  else if(S.screen==='exercise')renderExerciseScreen(st);
  else if(S.screen==='paused')renderPaused(st);
  else if(S.screen==='review')renderReview(st);
  else if(S.screen==='results')renderResults(st);
  renderHeader();renderTimer();
}
function renderIntro(st){
  var w=elt('div','intro');
  var strip=elt('div','strip');
  strip.innerHTML='<h1>'+CFG.title+'</h1>'
    +'<div class="chips">'
    +'<span class="chip">'+EXS.length+' exercises</span>'
    +'<span class="badge '+sevClass()+'">'+CFG.sevName+'</span>'
    +'<span class="chip">Estimated time: '+CFG.estimatedMinutes+' min</span>'
    +'<span class="chip">Timer budget: '+fmtT(CFG.budgetSeconds)+'</span>'
    +'<span class="chip">Pass mark: '+CFG.passMark+'%</span>'
    +'</div>';
  w.appendChild(strip);
  var s1=elt('section','i-sec');
  s1.appendChild(elt('h2',null,'What you will learn here'));
  CFG.introLearn.forEach(function(p){s1.appendChild(elt('p',null,p));});
  w.appendChild(s1);
  var s2=elt('section','i-sec');
  s2.appendChild(elt('h2',null,'Keywords covered in this exam'));
  var kc=elt('div','kw');
  CFG.keywords.forEach(function(k){kc.appendChild(elt('span','kw-chip',k));});
  s2.appendChild(kc);
  w.appendChild(s2);

function startExam(){
  resetAttempt();
  hardResetTimer();
  S.mode='main';S.idx=0;
  startExercise();
  setState('RUNNING');
}

/* ---------------- exercise flow ---------------- */
function startExercise(){
  var ex=EXS[S.idx];
  S.cur={ex:ex,sel:-1,selM:[],match:{},place:{},order:(ex.data&&ex.data.initial?ex.data.initial.slice():[]),moved:[],vals:[],
         branch:{node:0,picks:[],final:[]},term:{lastRel:{},lines:[]},graded:null};
  S.screen='exercise';
  render();
}
function onCheck(){
  var c=S.cur;if(!c||c.graded)return;
  if(c.ex.type==='branch'&&c.branch.node<c.ex.data.nodes.length)return;
  setState('PAUSED_AUTO_CHECK');       /* auto-pause happens BEFORE feedback is rendered */
  c.graded=grade(c);
  S.credits[c.ex.id]=c.graded.final;
  S.checked[c.ex.id]=true;
  render();
}
function nextLabel(){
  if(S.mode==='review')return (S.skipped.length>1)?'Back to review':'Finish exam';
  if(S.idx<EXS.length-1)return 'Next exercise';
  return S.skipped.length?('Review skipped ('+S.skipped.length+')'):'Final Submit';
}
function onNext(){
  if(S.mode==='review'){
    S.skipped=S.skipped.filter(function(id){return id!==S.cur.ex.id;});
    if(S.skipped.length){S.screen='review';setState('RUNNING');render();}
    else{finishExam(false);}
    return;
  }
  if(S.idx<EXS.length-1){S.idx++;startExercise();setState('RUNNING');}
  else if(S.skipped.length){S.screen='review';setState('RUNNING');render();}
  else{finishExam(false);}
}
function onSkip(){
  var c=S.cur;
  if(!c||c.graded||S.mode==='review'||S.screen!=='exercise')return;
  S.skipped.push(c.ex.id);           /* timer keeps running: no state change */
  if(S.idx<EXS.length-1){S.idx++;startExercise();}
  else{S.screen='review';render();}  /* skipped pool is never empty here */
}
function onHint(){
  var c=S.cur;
  if(!c||c.graded||S.hint[c.ex.id]||S.screen!=='exercise')return;
  S.hint[c.ex.id]=true;              /* timer keeps running: no state change */
  render();
}
function onPause(){
  if(T.state==='PAUSED_MANUAL'){
    var back=T.resumeTo||'RUNNING';
    T.resumeTo=null;
    setState(back);
    show(S.prevScreen);
    return;
  }
  if(T.state==='RUNNING'||T.state==='PAUSED_AUTO_CHECK'){
    T.resumeTo=T.state;
    S.prevScreen=S.screen;
    setState('PAUSED_MANUAL');
    show('paused');
  }
}
function finishExam(timeUp){
  S.timeUp=!!timeUp;
  S.screen='results';
  setState('ENDED');
  render();
  setTimeout(postScore,750);         /* post after the score animation has settled */
}
function postScore(){
  if(S.posted)return;S.posted=true;
  var sum=0,total=0;
  EXS.forEach(function(ex){if(S.checked[ex.id]){sum+=S.credits[ex.id];total++;}});
  sum=Math.round(sum*10)/10;         /* rounding happens only here */
  var percent=total?Math.round(100*sum/total):0;
  var passed=total>0&&percent>=CFG.passMark;
  var msg={type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,score:sum,total:total,percent:percent,passed:passed};
  try{parent.postMessage(msg,location.origin);}catch(e){}
}

function runCmd(c,cmd){
  var d=c.ex.data,L=c.term.lines;
  L.push({cls:'t-cmd',html:escHtml(cmd)});
  var i,dk=null;
  for(i=0;i<(d.dangerous||[]).length;i++){if(re(d.dangerous[i].match).test(cmd)){dk=d.dangerous[i];break;}}
  if(dk){
    L.push({cls:'t-warn',html:'\u26A0 DANGEROUS \u2014 NEAR MISS: '+dk.why});
    (d.tasks||[]).forEach(function(t,ti){if(t.danger&&re(t.danger).test(cmd)){c.term.lastRel[ti]='danger';}});
    render();
    return;
  }
  var sim=null;
  for(i=0;i<(d.sim||[]).length;i++){if(re(d.sim[i].match).test(cmd)){sim=d.sim[i];break;}}
  if(sim){
    String(sim.out).split('\n').forEach(function(ln){L.push({cls:'t-out',html:escHtml(ln)});});
  }else{
    L.push({cls:'t-err',html:'sh: command not found: '+escHtml(cmd)});
  }
  (d.nearmiss||[]).forEach(function(r){
    if(re(r.match).test(cmd))L.push({cls:'t-note',html:'\u26A0 Near miss: '+r.note});
  });
  (d.tasks||[]).forEach(function(t,ti){
    if(!c.term.lastRel[ti]&&re(t.accept).test(cmd)){
      c.term.lastRel[ti]='correct';
      L.push({cls:'t-ok',html:'\u2713 Task '+(ti+1)+' command accepted.'});
    }
  });
  render();
}

/* ---------------- grading ---------------- */
function grade(c){
  var ex=c.ex,type=ex.type,raw=0,items=[],N,H,W,i;
  if(type==='qcm-single'){
    var ok=(c.sel===ex.answer);
    raw=ok?1:0;
    if(ok)items.push({label:shortLabel(ex.options[ex.answer]),state:'hit'});
    else{
      if(c.sel>=0)items.push({label:shortLabel(ex.options[c.sel]),state:'wrong'});
      items.push({label:shortLabel(ex.options[ex.answer]),state:'missed'});
    }
  }else if(type==='qcm-multi'){
    var ans=ex.answer;N=ans.length;H=0;W=0;
    ex.options.forEach(function(o,oi){
      var isA=ans.indexOf(oi)>=0,sel=c.selM.indexOf(oi)>=0;
      if(isA&&sel){H++;items.push({label:shortLabel(o),state:'hit'});}
      else if(!isA&&sel){W++;items.push({label:shortLabel(o),state:'wrong'});}
      else if(isA&&!sel){items.push({label:shortLabel(o),state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='matching'){
    var rights=ex.data.rights;N=ex.data.pairs.length;H=0;W=0;
    ex.data.pairs.forEach(function(p,pi){
      var v=c.match[pi];
      if(v!=null&&rights[v]===p.right){H++;items.push({label:p.left,state:'hit'});}
      else if(v!=null){W++;items.push({label:p.left,state:'wrong'});}
      else{items.push({label:p.left,state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='dragdrop'){
    N=ex.data.items.length;H=0;W=0;
    ex.data.items.forEach(function(it){
      var z=c.place[it.id];
      if(z&&z===it.zone){H++;items.push({label:stripTags(it.html),state:'hit'});}
      else if(z){W++;items.push({label:stripTags(it.html),state:'wrong'});}
      else{items.push({label:stripTags(it.html),state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='order'){
    N=ex.data.items.length;H=0;W=0;
    for(i=0;i<N;i++){
      var itIdx=c.order[i];
      if(itIdx===i){H++;items.push({label:ex.data.items[i],state:'hit'});}
      else if(c.moved.indexOf(itIdx)>=0){W++;items.push({label:ex.data.items[itIdx],state:'wrong'});}
      else{items.push({label:ex.data.items[itIdx],state:'missed'});}
    }
    raw=Math.max(0,(H-W)/N);
  }else if(type==='fill'){
    N=ex.data.blanks.length;H=0;W=0;
    ex.data.blanks.forEach(function(b,bi){
      var v=(c.vals[bi]||'').trim().toLowerCase();
      var good=b.answers.some(function(a){return a.trim().toLowerCase()===v;});
      if(v===''){items.push({label:b.label||('Blank '+(bi+1)),state:'missed'});}
      else if(good){H++;items.push({label:b.label||('Blank '+(bi+1)),state:'hit'});}
      else{W++;items.push({label:b.label||('Blank '+(bi+1)),state:'wrong'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='branch'){
    var fans=ex.data.final.answer;N=fans.length;H=0;W=0;
    ex.data.final.options.forEach(function(o,oi){
      var isA=fans.indexOf(oi)>=0,sel=c.branch.final.indexOf(oi)>=0;
      if(isA&&sel){H++;items.push({label:shortLabel(o),state:'hit'});}
      else if(!isA&&sel){W++;items.push({label:shortLabel(o),state:'wrong'});}
      else if(isA&&!sel){items.push({label:shortLabel(o),state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='terminal'){
    N=(ex.data.tasks||[]).length;H=0;W=0;
    (ex.data.tasks||[]).forEach(function(t,ti){
      var rel=c.term.lastRel[ti];
      if(rel==='correct'){H++;items.push({label:t.label,state:'hit'});}
      else if(rel==='danger'){W++;items.push({label:t.label,state:'wrong'});}
      else{items.push({label:t.label,state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }
  var hint=!!S.hint[ex.id];
  var fin=Math.max(0,Math.round((raw-(hint?0.10:0))*100)/100);
  var verdict=(fin>=0.999)?'correct':(fin>0?'partial':'incorrect');
  return {raw:raw,final:fin,hint:hint,items:items,verdict:verdict};
}

/* ---------------- exercise screen ---------------- */
function renderExerciseScreen(st){
  var c=S.cur,ex=c.ex;
  var card=elt('div','card');
  card.tabIndex=-1;
  card.setAttribute('aria-label','Exercise card');
  card.appendChild(scenarioBlock(ex));
  var qb=elt('div','block block-question');
  qb.appendChild(elt('div','block-label','QUESTION'));
  qb.appendChild(elt('div','block-body',ex.question));
  card.appendChild(qb);
  var ab=elt('div','block block-answer');
  ab.appendChild(elt('div','block-label','YOUR ANSWER'));
  var host=elt('div','ans');
  ab.appendChild(host);
  if(ex.type==='qcm-single')uiQCM(host,c,false);
  else if(ex.type==='qcm-multi')uiQCM(host,c,true);
  else if(ex.type==='matching')uiMatch(host,c);
  else if(ex.type==='dragdrop')uiDD(host,c);
  else if(ex.type==='order')uiOrder(host,c);
  else if(ex.type==='fill')uiFillAnswer(host,c);
  else if(ex.type==='branch')uiBranch(host,c);
  else if(ex.type==='terminal')uiTerm(host,c);
  card.appendChild(ab);
  if(S.hint[ex.id]&&!c.graded)card.appendChild(elt('div','hintbox','<b>Hint (\u221210%):</b> '+ex.hint));
  var act=elt('div','actions');
  var chk=elt('button','btn primary','Check answer');
  chk.id='btn-check';chk.type='button';
  if(c.graded)chk.disabled=true;
  if(ex.type==='branch'&&!branchDone(c))chk.disabled=true;
  chk.addEventListener('click',onCheck);
  act.appendChild(chk);
  card.appendChild(act);
  if(c.graded)renderFeedback(card,c);
  st.appendChild(card);
  if(c.graded)lockCard(card);
  if(document.activeElement===document.body){
    var tgt=c.graded?$('#btn-next'):card;
    try{tgt.focus();}catch(e){}
  }
}
function lockCard(card){
  $$('.ans input,.ans select,.ans button',card).forEach(function(x){x.disabled=true;});
  $$('.ans .dd-chip',card).forEach(function(x){x.draggable=false;});
  $$('.ans .term-in',card).forEach(function(x){x.readOnly=true;});
}
function renderFeedback(card,c){
  var g=c.graded;
  var f=elt('div','feedback f-'+g.verdict);
  f.setAttribute('aria-live','polite');
  f.appendChild(elt('div','f-head',{correct:'\u2713 Correct',partial:'\u2713 Partially correct',incorrect:'\u2717 Incorrect'}[g.verdict]));
  f.appendChild(elt('div','f-credit','Credit: '+g.final.toFixed(2)+' of 1.00'+(g.hint?' \u00B7 includes hint penalty \u22120.10':'')));
  if(g.items.length){
    var ul=elt('ul','f-items');
    g.items.forEach(function(it){
      ul.appendChild(elt('li','it-'+it.state,({hit:'\u2713 Correct',wrong:'\u2717 Wrong',missed:'\u25CB Missed'})[it.state]+' \u2014 '+it.label));
    });
    f.appendChild(ul);
  }
  f.appendChild(elt('div','f-explain',c.ex.explain));
  var nb=elt('button','btn primary',nextLabel());
  nb.id='btn-next';nb.type='button';
  nb.addEventListener('click',onNext);
  f.appendChild(nb);
  card.appendChild(f);
}

/* ---------------- results ---------------- */
function renderResults(st){
  var answered=[],unanswered=[];
  EXS.forEach(function(ex){(S.checked[ex.id]?answered:unanswered).push(ex);});
  var full=[],part=[],zero=[],sum=0;
  answered.forEach(function(ex){
    var cr=S.credits[ex.id];sum+=cr;
    if(cr>=0.999)full.push(ex);else if(cr>0)part.push(ex);else zero.push(ex);
  });
  sum=Math.round(sum*10)/10;
  var total=answered.length;
  var percent=total?Math.round(100*sum/total):0;
  var passed=total>0&&percent>=CFG.passMark;
  var avgPart=part.length?(part.reduce(function(a,e){return a+S.credits[e.id];},0)/part.length):0;
  var w=elt('div','results');
  var hero=elt('div','res-hero');
  var pct=elt('div','res-pct','0%');pct.id='res-pct';
  hero.appendChild(pct);
  hero.appendChild(elt('div',null,'You answered '+total+' of '+EXS.length+' exercises. Unanswered and skipped exercises are not counted.'));
  var ban=elt('div','res-banner '+(passed?'pass':'fail'),passed?'\u2713 Passed':'\u2717 Not passed');
  hero.appendChild(ban);
  if(S.timeUp)hero.appendChild(elt('div','res-note','\u23F1 Time is up. Exercises you never answered were not scored.'));
  hero.appendChild(elt('div','res-note','Pass mark: '+CFG.passMark+'% \u00B7 Final score: '+sum.toFixed(1)+' points'));
  w.appendChild(hero);
  var grid=elt('div','res-grid');
  function box(cls,icon,num,lab){
    var b=elt('div','res-box '+cls);
    b.appendChild(elt('b',null,icon+' '+num));
    b.appendChild(elt('div','res-lab',lab));
    return b;
  }
  grid.appendChild(box('ok','\u2713',full.length,'Fully correct'));
  grid.appendChild(box('warn','\u2713',part.length,'Partially correct'+(part.length?(' \u00B7 avg partial credit '+avgPart.toFixed(2)):'')));
  grid.appendChild(box('bad','\u2717',zero.length,'Fully incorrect'));
  grid.appendChild(box('neu','\u26A0',unanswered.length,'Skipped / never answered (not scored)'));
  w.appendChild(grid);
  var acc=T.acc;
  w.appendChild(elt('div','res-pause','Time on the clock: '+fmtD(CFG.budgetSeconds-T.remaining)
    +' \u00B7 Running: '+fmtD(acc.RUNNING)
    +' \u00B7 Manual pause: '+fmtD(acc.PAUSED_MANUAL)
    +' \u00B7 Checking pause: '+fmtD(acc.PAUSED_AUTO_CHECK)));
  var list=elt('div','res-list');
  EXS.forEach(function(ex){
    var row=elt('div','res-row');
    row.appendChild(elt('span',null,ex.label));
    if(S.checked[ex.id]){
      var cr=S.credits[ex.id];
      var st=(cr>=0.999)?['res-state','\u2713 Correct','it-hit']:(cr>0)?['res-state','\u2713 Partially correct','it-hit']:['res-state','\u2717 Incorrect','it-wrong'];
      row.appendChild(elt('span',st[0]+' '+st[2],st[1]));
      row.appendChild(elt('span','res-cred',cr.toFixed(2)+(S.hint[ex.id]?' \u00B7 hint used':'')));
    }else{
      row.appendChild(elt('span','res-state it-missed','\u26A0 Skipped \u00B7 not scored'));
      row.appendChild(elt('span','res-cred','\u2014'));
    }
    list.appendChild(row);
  });
  w.appendChild(list);
  var act=elt('div','actions');
  var rb=elt('button','btn primary big','Retake exam');
  rb.id='btn-retake';rb.type='button';
  rb.addEventListener('click',function(){
    resetAttempt();
    hardResetTimer();
    show('intro');
  });
  act.appendChild(rb);
  w.appendChild(act);
  st.appendChild(w);
  /* score animation, then the score is posted by finishExam's timer */
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce||percent===0){
    pct.textContent=percent+'%';
  }else{
    var t0=null,dur=600;
    function step(ts){
      if(t0===null)t0=ts;
      var p=Math.min(1,(ts-t0)/dur);
      pct.textContent=Math.round(percent*(p<1?(1-Math.pow(1-p,3)):1))+'%';
      if(p<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
}

/* ---------------- boot ---------------- */
$('#btn-hint').addEventListener('click',onHint);
$('#btn-skip').addEventListener('click',onSkip);
$('#btn-pause').addEventListener('click',onPause);
show('intro');
})();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
