<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg-page:#0b1020; --bg-surface:#121a2e; --bg-surface-2:#0f1729; --border:#243049;
  --text-primary:#e6ecff; --text-secondary:#a9b4d0; --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff; --accent-amber:#ffb454; --accent-green:#57d38c;
  --state-correct:#57d38c; --state-partial:#ffb454; --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0; --state-paused:#9d7bff;
  --sev-easy:#57d38c; --sev-medium:#ffb454; --sev-hard:#ff8a3d; --sev-extreme:#ff6b6b;
  --sev:var(--sev-easy);
  --shadow:0 6px 18px rgba(3,8,20,.45);
  --r:8px;
}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:dark}
html,body{margin:0;padding:0}
body{
  background:var(--bg-page); color:var(--text-primary);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono,.code,pre.code,input.term-in,.log-line,.term-out{
  font-family:ui-monospace,SFMono-Regular,"Cascadia Mono","JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace;
}
.wrap{max-width:980px;margin:0 auto;padding:20px 18px 64px}
h1,h2,h3{line-height:1.25;margin:0 0 10px}
h1{font-size:1.45rem} h2{font-size:1.15rem} h3{font-size:1.02rem}
p{margin:.45em 0}
a{color:var(--accent-blue)}
small,.small{font-size:.86rem;color:var(--text-secondary)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}
::selection{background:#2b3f66}

/* ---------- cards & panels ---------- */
.panel{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px 18px;margin:14px 0}
.panel.tight{padding:12px 14px}
.sub{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:10px 0}
.sub-label{font-size:.78rem;letter-spacing:.06em;color:var(--text-secondary);text-transform:uppercase;
  font-family:ui-monospace,Consolas,monospace;margin:0 0 6px}
.hr{border:none;border-top:1px solid var(--border);margin:14px 0}

/* ---------- intro ---------- */
.intro-head{border-left:4px solid var(--sev);padding-left:16px;margin:6px 0 4px}
.factrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;
  padding:7px 12px;font-size:.88rem;color:var(--text-secondary)}
.fact b{color:var(--text-primary);font-weight:600}
.kw-theme{margin:10px 0}
.kw-theme h3{color:var(--accent-blue);font-size:.95rem}
.kw-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.kw{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:20px;
  padding:4px 12px;font-size:.84rem;color:var(--text-primary)}
.rules{list-style:none;margin:8px 0;padding:0}
.rules li{padding:7px 0 7px 30px;position:relative;border-bottom:1px dashed var(--border);color:var(--text-primary)}
.rules li:last-child{border-bottom:none}
.rules li::before{content:"\25B8";position:absolute;left:8px;color:var(--accent-amber)}

/* ---------- chips / badges ---------- */
.badge{display:inline-flex;align-items:center;gap:7px;border-radius:20px;padding:4px 13px;
  font-size:.82rem;font-weight:700;letter-spacing:.05em;border:1px solid}
.badge .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
.b-easy{color:var(--sev-easy);border-color:var(--sev-easy);background:rgba(87,211,140,.09)}
.b-medium{color:var(--sev-medium);border-color:var(--sev-medium);background:rgba(255,180,84,.09)}
.b-hard{color:var(--sev-hard);border-color:var(--sev-hard);background:rgba(255,138,61,.10)}
.b-extreme{color:var(--sev-extreme);border-color:var(--sev-extreme);background:rgba(255,107,107,.10)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:6px;
  background:var(--bg-surface-2);padding:6px 11px;font-size:.84rem;color:var(--text-primary)}
.chip.ok{color:var(--state-correct);border-color:var(--state-correct)}
.chip.warn{color:var(--state-partial);border-color:var(--state-partial)}
.chip.bad{color:var(--state-incorrect);border-color:var(--state-incorrect)}
.chip.skip{color:var(--state-skipped);border-color:var(--border)}
.chip.pause{color:var(--state-paused);border-color:var(--state-paused)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(11,16,32,.96);border-bottom:1px solid var(--border);
  box-shadow:0 4px 14px rgba(3,8,20,.5)}
.topbar-in{max-width:980px;margin:0 auto;padding:9px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:9px}
.tb-count{font-weight:700;font-size:.92rem;white-space:nowrap}
.tb-user{font-size:.8rem;color:var(--text-secondary);white-space:nowrap}
.tb-spacer{flex:1}
.tb-timer{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;font-weight:700;
  font-size:.95rem;color:var(--text-primary)}
.tb-state{font-size:.74rem;letter-spacing:.03em}
.tb-score{font-family:ui-monospace,Consolas,monospace;font-size:.92rem;color:var(--text-primary)}
.tb-score b{color:var(--accent-green)}
.tb-score .pct{color:var(--text-secondary);font-size:.82rem}

/* ---------- progress ---------- */
.pbar{height:8px;background:var(--bg-surface-2);border-bottom:1px solid var(--border);overflow:hidden}
.pbar-in{height:100%;width:0%;
  background:linear-gradient(90deg,var(--sev),var(--accent-blue));
  transition:width .5s ease;position:relative}
.pbar-in::after{content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(230,236,255,.25) 50%,transparent 70%);
  animation:sheen 2.8s linear infinite}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;
  padding:9px 18px;border-radius:6px;border:1px solid var(--border);background:var(--bg-surface-2);
  color:var(--text-primary);cursor:pointer;font-weight:600;font-size:.92rem;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:#1a2440;border-color:#33507e}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn-primary{background:var(--sev);border-color:var(--sev);color:#08101f}
.btn-primary:hover:not(:disabled){background:var(--sev);filter:brightness(1.12)}
.btn-blue{background:#173154;border-color:var(--accent-blue);color:var(--accent-blue)}
.btn-ghost{background:transparent}
.btn-danger{border-color:var(--state-incorrect);color:var(--state-incorrect)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn-lg{font-size:1.02rem;padding:12px 30px}

/* ---------- exercise blocks ---------- */
.ex-head{display:flex;align-items:center;gap:10px;margin:16px 0 8px;flex-wrap:wrap}
.ex-title{font-size:.95rem;color:var(--text-secondary);font-weight:600}
.blk{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
.blk-h{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:.82rem;font-weight:800;
  letter-spacing:.09em;border-bottom:1px solid var(--border);text-transform:uppercase}
.blk-h .ic{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;
  border-radius:5px;font-size:.85rem;background:rgba(90,169,255,.14);color:var(--accent-blue)}
.blk-h .tag{margin-left:auto;font-weight:600;letter-spacing:.02em;font-size:.72rem;color:var(--text-secondary)}
.blk-scenario{border-left:4px solid var(--accent-blue)}
.blk-scenario .blk-h{color:var(--accent-blue)}
.blk-question{border-left:4px solid var(--accent-amber)}
.blk-question .blk-h{color:var(--accent-amber)}
.blk-question .ic{background:rgba(255,180,84,.14);color:var(--accent-amber)}
.blk-answer{border-left:4px solid var(--accent-green)}
.blk-answer .blk-h{color:var(--accent-green)}
.blk-answer .ic{background:rgba(87,211,140,.14);color:var(--accent-green)}
.blk-b{padding:14px 16px}
.scen-p{margin:.5em 0;color:var(--text-primary)}
.q-text{font-weight:700;font-size:1.02rem;margin:0}

/* collapsible scenario */
.collapse-btn{margin-left:auto;background:none;border:1px solid var(--border);border-radius:5px;
  color:var(--text-secondary);cursor:pointer;padding:3px 10px;font-size:.74rem;min-height:44px}
.collapsed .blk-b{display:none}
.collapsum{display:none;padding:8px 14px;font-size:.82rem;color:var(--text-secondary);border-top:1px solid var(--border)}
.collapsed .collapsum{display:block}

/* artefacts & code */
.artefact{margin:12px 0}
pre.code{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;
  color:var(--text-mono);font-size:.86rem;line-height:1.55;padding:11px 13px;margin:6px 0 0;
  overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.tok-k{color:var(--accent-blue);font-weight:700}
.tok-s{color:var(--accent-amber)}
.tok-n{color:var(--sev-hard)}
.tok-c{color:var(--text-secondary);font-style:italic}
.tok-f{color:var(--state-incorrect)}

/* log viewer */
.logview{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.logview-top{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border)}
.logview input{flex:1;background:var(--bg-page);border:1px solid var(--border);border-radius:5px;
  color:var(--text-primary);padding:8px 10px;font-size:.86rem;min-height:38px}
.log-count{font-size:.74rem;color:var(--text-secondary);font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
.log-lines{max-height:300px;overflow:auto;padding:6px 0}
.log-line{padding:3px 12px;font-size:.82rem;color:var(--text-mono);white-space:pre-wrap;word-break:break-word}
.log-line .ts{color:var(--text-secondary)}
.log-line .src{color:var(--accent-blue);font-weight:700}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:6px;padding:11px 13px;cursor:pointer;min-height:44px;
  color:var(--text-primary);transition:background .12s,border-color .12s}
.opt:hover:not(:disabled){background:#182238}
.opt-k{flex:0 0 auto;font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--text-secondary)}
.opt-t{flex:1}
.opt-sel{border-left:4px solid var(--accent-green);box-shadow:0 0 0 1px var(--accent-green),0 0 12px rgba(87,211,140,.25)}
.opt.sel-tag::after{content:"\25CF selected";margin-left:auto;color:var(--accent-green);font-size:.76rem;font-weight:700;white-space:nowrap}
.opt:disabled{cursor:default;opacity:.85}
.opt-correct{border-left:4px solid var(--state-correct)}
.opt-wrong{border-left:4px solid var(--state-incorrect)}

/* fill-in */
.fill-wrap{line-height:2.3;color:var(--text-primary)}
.fill-in{background:var(--bg-page);border:1px solid var(--border);border-bottom:2px solid var(--accent-green);
  border-radius:5px;color:var(--text-mono);padding:6px 10px;font-size:.9rem;min-height:44px;min-width:120px;margin:0 3px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)}
.bank-l{font-size:.78rem;color:var(--text-secondary);width:100%}
.bk{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:16px;padding:3px 11px;
  font-size:.84rem;color:var(--text-mono);font-family:ui-monospace,Consolas,monospace}

/* match */
.match-row{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.match-row:last-child{border-bottom:none}
.match-l{flex:1 1 240px;font-size:.92rem}
.match-row select{flex:1 1 200px;background:var(--bg-page);border:1px solid var(--border);border-radius:5px;
  color:var(--text-primary);padding:9px 10px;font-size:.88rem;min-height:44px}

/* order */
.ord-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.ord-item{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);
  border-radius:6px;padding:8px 11px}
.ord-pos{flex:0 0 30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:5px;
  background:var(--bg-page);border:1px solid var(--border);font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:.85rem}
.ord-t{flex:1}
.ord-btns{display:flex;gap:5px}
.ord-btns button{width:44px;height:44px;border-radius:5px;border:1px solid var(--border);background:var(--bg-page);
  color:var(--text-primary);cursor:pointer;font-size:1rem}
.ord-btns button:hover:not(:disabled){border-color:var(--accent-blue);color:var(--accent-blue)}

/* drag & drop */
.drag-zone{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:9px;border:1px dashed var(--border);
  border-radius:6px;background:var(--bg-page);margin-top:8px}
.drag-zone.over{border-color:var(--accent-green);box-shadow:inset 0 0 0 1px var(--accent-green)}
.chipd{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;
  font-size:.88rem;cursor:grab;color:var(--text-primary);min-height:44px;display:inline-flex;align-items:center;gap:7px}
.chipd.picked{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green)}
.chipd .pick-mark{color:var(--accent-green);font-weight:700;font-size:.78rem}
.buckets{display:grid;gap:10px;margin-top:12px}
.bucket{border:1px solid var(--border);border-radius:6px;background:var(--bg-surface-2);padding:10px}
.bucket-h{font-size:.84rem;font-weight:700;color:var(--accent-blue);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.bucket .drag-zone{margin-top:0;min-height:64px}
.drag-hintline{font-size:.8rem;color:var(--text-secondary);margin-top:8px}

/* terminal */
.term{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.term-bar{display:flex;gap:6px;align-items:center;padding:7px 11px;border-bottom:1px solid var(--border);background:var(--bg-page)}
.term-dot{width:10px;height:10px;border-radius:50%;background:var(--border)}
.term-dot.r{background:var(--state-incorrect)}.term-dot.y{background:var(--state-partial)}.term-dot.g{background:var(--state-correct)}
.term-name{margin-left:6px;font-size:.76rem;color:var(--text-secondary);font-family:ui-monospace,Consolas,monospace}
.term-out{padding:10px 12px;max-height:220px;overflow:auto;font-size:.84rem;color:var(--text-mono);line-height:1.55}
.term-line{white-space:pre-wrap;word-break:break-word}
.term-line .p{color:var(--accent-green);font-weight:700}
.term-in-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--border)}
.term-pr{color:var(--accent-green);font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:.86rem;white-space:nowrap}
input.term-in{flex:1;background:transparent;border:none;color:var(--text-mono);font-size:.88rem;min-height:44px}
.per-timer{display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,Consolas,monospace;
  font-size:.8rem;color:var(--state-partial);border:1px solid var(--state-partial);border-radius:5px;padding:3px 9px}

/* decision tree */
.step-tag{display:inline-flex;align-items:center;gap:7px;background:rgba(90,169,255,.12);border:1px solid var(--accent-blue);
  color:var(--accent-blue);border-radius:5px;padding:4px 11px;font-size:.78rem;font-weight:700;letter-spacing:.05em;margin-bottom:8px}
.step-outcome{border-left:3px solid var(--accent-blue);background:var(--bg-surface-2);border-radius:4px;
  padding:8px 12px;margin:8px 0;font-size:.88rem;color:var(--text-primary)}
.step-outcome.ok{border-left-color:var(--state-correct)}
.step-outcome.bad{border-left-color:var(--state-incorrect)}
.done-steps{margin-bottom:6px}

/* feedback */
.fb{border:1px solid var(--border);border-radius:var(--r);margin:12px 0;overflow:hidden;background:var(--bg-surface);
  box-shadow:var(--shadow)}
.fb-h{display:flex;align-items:center;gap:10px;padding:11px 15px;font-weight:800;letter-spacing:.05em;font-size:.95rem;
  border-bottom:1px solid var(--border)}
.fb-h.ok{color:var(--state-correct);background:rgba(87,211,140,.08)}
.fb-h.part{color:var(--state-partial);background:rgba(255,180,84,.08)}
.fb-h.bad{color:var(--state-incorrect);background:rgba(255,107,107,.08)}
.fb-credit{font-family:ui-monospace,Consolas,monospace;font-size:.88rem;margin-left:auto;white-space:nowrap}
.fb-b{padding:13px 16px}
.fb-correct{background:var(--bg-surface-2);border:1px solid var(--border);border-left:3px solid var(--state-correct);
  border-radius:5px;padding:9px 12px;margin:8px 0;font-size:.9rem}
.fb-correct .mono{color:var(--text-mono)}
.items{margin:10px 0;display:flex;flex-direction:column;gap:6px}
.item-row{display:flex;gap:9px;align-items:flex-start;font-size:.88rem;padding:6px 9px;border-radius:5px;
  background:var(--bg-surface-2);border:1px solid var(--border)}
.item-ic{flex:0 0 auto;font-weight:700}
.item-row.ok .item-ic{color:var(--state-correct)}
.item-row.bad .item-ic{color:var(--state-incorrect)}
.item-row.miss .item-ic{color:var(--state-skipped)}
.fb-exp{color:var(--text-primary);font-size:.92rem;margin-top:8px}
.fb-study{color:var(--accent-amber);font-size:.88rem;margin-top:8px;border-left:3px solid var(--accent-amber);padding-left:10px}
.fb-persp{display:grid;gap:8px;margin-top:10px}
.persp{border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:.88rem;background:var(--bg-surface-2)}
.persp b{color:var(--accent-blue)}
.persp.d b{color:var(--accent-green)}
.fb-note{font-size:.8rem;color:var(--text-secondary);margin-top:9px}

/* review & results */
.rv-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.rv-row:last-child{border-bottom:none}
.rv-t{flex:1;min-width:200px}
.res-sum{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0}
.res-big{font-family:ui-monospace,Consolas,monospace;font-size:2rem;font-weight:800}
.res-pct{font-size:1.2rem;font-weight:700;color:var(--text-secondary)}
.verdict{border-radius:var(--r);border:1px solid;padding:16px 18px;margin:14px 0;font-size:1.05rem;font-weight:700}
.verdict.ok{color:var(--state-correct);border-color:var(--state-correct);background:rgba(87,211,140,.07)}
.verdict.bad{color:var(--state-incorrect);border-color:var(--state-incorrect);background:rgba(255,107,107,.07)}
.res-break{display:grid;gap:8px;margin:12px 0}
.res-row{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);
  border-radius:6px;padding:9px 13px;font-size:.92rem}
.res-row b{margin-left:auto;font-family:ui-monospace,Consolas,monospace}
.pause-stats{font-size:.86rem;color:var(--text-secondary);margin-top:10px;display:grid;gap:4px}

/* overlay for manual pause */
.overlay{position:fixed;inset:0;background:rgba(5,8,18,.9);backdrop-filter:blur(5px);z-index:90;
  display:flex;align-items:center;justify-content:center;padding:20px}
.overlay-card{max-width:440px;width:100%;text-align:center;background:var(--bg-surface);border:1px solid var(--state-paused);
  border-radius:10px;padding:30px 26px;box-shadow:0 0 40px rgba(157,123,255,.25)}
.overlay-card .big{font-size:2.2rem;color:var(--state-paused);margin-bottom:8px}
.hidden{display:none!important}

/* misc */
.notice{border:1px solid var(--border);border-left:4px solid var(--accent-amber);background:var(--bg-surface-2);
  border-radius:5px;padding:9px 12px;font-size:.86rem;margin:10px 0;color:var(--text-primary)}
.tiny-note{font-size:.78rem;color:var(--text-secondary)}

@media (max-width:640px){
  .wrap{padding:14px 10px 50px}
  .blk-b{padding:12px}
  .topbar-in{padding:8px 10px;gap:6px}
  .tb-state{display:none}
  .buckets{grid-template-columns:1fr!important}
}

<script>
window.__EXAM__ = {"meta":{"topicId":"t1589.003","batch":1,"title":"T1589.003 Employee Names — EASY","difficulty":"easy","sevWord":"EASY","objId":"T1589.003","objName":"Employee Names","questionCount":16,"estimatedMinutes":30,"timerSeconds":1800,"passMark":70,"pageTitle":"T1589.003 — EASY practice exam"},"intro":{"h1":"T1589.003 — EASY practice exam","objType":"Sub-technique of T1589 — an ATT&CK 'how they do it' entry inside the Reconnaissance tactic","learnTitle":"What you will learn here","learn":["Welcome. This exam is about one small but important entry in the MITRE ATT&amp;CK framework: <b>T1589.003, called Employee Names<\/b>. You will learn what it is, why attackers care about staff names, and what defenders can and cannot do about it. Everything is explained in simple words.","ATT&amp;CK is a shared catalogue of attacker behaviour. A <b>technique<\/b> describes one behaviour, and a <b>sub-technique<\/b> describes a smaller piece of that behaviour. T1589.003 is a sub-technique. Its small behaviour is: an adversary collects the names of people who work at the target organisation. It sits in the <b>Reconnaissance<\/b> tactic — the phase that happens <i>before<\/i> any break-in. ATT&amp;CK marks it with the platform <b>PRE<\/b>, which simply means 'pre-compromise'.","You will see where this object is used in real work. A <b>SOC analyst<\/b> meets it when a phishing email greets a colleague by name. A <b>CTI analyst<\/b> tags threat reports with this ID. A <b>detection engineer<\/b> reads the linked detection note (DET0857), which says this collection is hard to see and points defenders to watch the next stage, Initial Access. A <b>red teamer<\/b> collects names to make test lures believable. A <b>privacy or GRC analyst<\/b> reduces public staff data, following mitigation <b>M1056 Pre-compromise<\/b>.","Three real groups appear on the ATT&amp;CK page for this sub-technique: <b>Kimsuky<\/b>, <b>Sandworm Team<\/b> and <b>Silent Librarian<\/b> — all documented as collecting employee names or employee information while preparing attacks. By the end of this exam you will recognise this behaviour in simple artefacts and know what a defender should do next."],"themes":[{"name":"Object identity & matrix position","items":["T1589.003 — Employee Names","Parent: T1589 — Gather Victim Identity Information","Sibling: T1589.001 — Credentials","Sibling: T1589.002 — Email Addresses","Tactic: Reconnaissance","Platform: PRE (pre-compromise)"]},{"name":"The behaviour & why it matters","items":["gathering employee names","deriving email addresses","crafting believable lures","guiding further recon"]},{"name":"Where the names come from","items":["Social Media (T1593.001)","Search Victim-Owned Websites (T1594)","public staff pages","open data sets"]},{"name":"Defender view","items":["M1056 — Pre-compromise","minimise public staff data","hard to detect (high false positives)","watch the Initial Access stage"]},{"name":"Real groups on the ATT&CK page","items":["Kimsuky (G0094)","Sandworm Team (G0034)","Silent Librarian (G0122)"]}],"how":["You need <b>70%<\/b> to pass. The score counts only exercises you answered with Check. Skipped-and-never-answered exercises are excluded from both your points and the total.","This file has <b>16 exercises<\/b> of these types: single-choice questions, drag-and-drop sorting, matching, fill-in-the-blank, ordering steps, and a mini ATT&amp;CK-matrix placement.","The timer starts at <b>30:00<\/b> and counts down while you work. Pressing <b>Check<\/b> stops the timer and shows feedback — take all the time you need to read it. The timer restarts only when you press <b>Next<\/b>.","The <b>Pause<\/b> button is a manual break: the exercise hides and the timer stops until you press Resume.","Exercises with several items give <b>partial credit<\/b>: right items add credit, wrong items subtract it — the formula is max(0, (H−W)/N). Selecting everything does not help you.","One <b>hint<\/b> per exercise is allowed; it costs 10% of that exercise's credit. <b>Skip<\/b> moves an exercise to a review pool without showing the answer; before you finish, you can return to skipped exercises until the timer ends."]},"exercises":[{"id":"E01","title":"Name the object","type":"qcm","summary":"Read the ATT&CK row and name the behaviour","scen":[{"label":"ARTEFACT 1 — ATT&CK excerpt (Enterprise matrix, Reconnaissance column)","kind":"code","body":"T1589  Gather Victim Identity Information\n  |- T1589.001  Credentials\n  |- T1589.002  Email Addresses\n  '- T1589.003  Employee Names"}],"q":"Which behaviour does the ATT&CK ID T1589.003 describe?","opts":[{"t":"Finding the names of people who work at the victim organisation","correct":true,"why":"The ATT&CK name of T1589.003 is Employee Names, and the description says adversaries gather employee names for targeting."},{"t":"Guessing passwords for staff accounts","correct":false,"why":"That is the sibling T1589.001 Credentials — it is about secrets, not names."},{"t":"Reading the victim's job adverts for open roles","correct":false,"why":"Job adverts point to organisation and host information gathering, not to this sub-technique."},{"t":"Scanning the victim's public IP address ranges","correct":false,"why":"That is Active Scanning (T1595), a different Reconnaissance technique."}],"explain":"T1589.003 is called Employee Names. It is a sub-technique of T1589, Gather Victim Identity Information, and it describes one small behaviour: an adversary collects staff names to prepare an attack. The other options belong to other ATT&CK objects, so reading the ID and the name together is enough here.","study":"Re-read the sub-technique list under T1589 in the artefact and match each ID to its name.","hint":"Look at the last row of the artefact — the ATT&CK name of the ID is almost the answer itself."},{"id":"E02","title":"Place the technique in the matrix","type":"drag","summary":"Put the T1589.003 card in the right tactic column","scen":[{"label":"CONTEXT","kind":"prose","body":"You are browsing the Enterprise ATT&CK matrix for the first time. Your mentor hands you one technique card and asks you to drop it into the correct tactic column. Think about the moment this behaviour happens: it takes place before the adversary has any foothold at all."}],"q":"Drag the card T1589.003 — Employee Names into the tactic column where ATT&CK places it.","buckets":[{"id":"recon","t":"Reconnaissance (TA0043)"},{"id":"ia","t":"Initial Access (TA0001)"},{"id":"pers","t":"Persistence (TA0003)"}],"chips":[{"id":"c1","t":"T1589.003 — Employee Names","b":"recon","why":"ATT&CK lists T1589.003 under the Reconnaissance tactic, TA0043."}],"explain":"Reconnaissance is the first tactic of the Enterprise matrix. Collecting employee names happens before the adversary touches the victim's systems, so the card belongs in the Reconnaissance column. Initial Access starts with the first phish or login attempt, and Persistence only exists after a foothold.","study":"Open the Enterprise matrix and find the Reconnaissance column — look for the T1589 family.","hint":"The behaviour needs zero access to victim systems. Which column describes work done from the outside, before entry?"},{"id":"E03","title":"Why attackers want names","type":"qcm","summary":"Pick the attacker's reason for collecting staff names","scen":[{"label":"CONTEXT","kind":"prose","body":"Imagine you are a red teamer preparing an authorised test. From public pages you already have a short list of staff names. Your goal is a phishing simulation that a busy employee will not find suspicious."}],"q":"According to ATT&CK, why does an adversary collect employee names?","opts":[{"t":"To derive work email addresses and write believable lures","correct":true,"why":"The ATT&CK description says names are used to derive email addresses and craft more-believable lures."},{"t":"To bypass the network firewall directly","correct":false,"why":"A name is not a network credential; a firewall does not check names at all."},{"t":"To encrypt victim files faster","correct":false,"why":"Encryption speed has nothing to do with names; that would be an Impact-stage behaviour."},{"t":"To scan ports more quietly","correct":false,"why":"Port scanning is Active Scanning (T1595) and does not become quieter because of names."}],"explain":"Names are raw material for social engineering. With a name like 'Dana Cole' an adversary can guess dana.cole@…, greet the person correctly, and mention their real team. ATT&CK states the uses directly: derive email addresses, guide other reconnaissance, and craft more-believable lures.","persp":{"a":"For the attacker, a real name plus a guessed address turns generic spam into a targeted lure that survives a first glance.","d":"For the defender, every named staff detail published outside is free ammunition for the next phishing wave — this is why M1056 says to minimise external data."},"study":"Re-read the first sentences of the ATT&CK description for T1589.003.","hint":"This is about the tactic where the adversary first learns who works at the target — think about what a name is worth in a phishing email."},{"id":"E04","title":"Why defenders cannot just block it","type":"qcm","summary":"Explain the only listed mitigation: M1056 Pre-compromise","scen":[{"label":"ARTEFACT 1 — ATT&CK mitigation excerpt","kind":"code","body":"M1056  Pre-compromise\n\"This technique cannot be easily mitigated with preventive\ncontrols since it is based on behaviors performed outside\nof the scope of enterprise defenses and controls.\nEfforts should focus on minimizing the amount and\nsensitivity of data available to external parties.\""}],"q":"Why is M1056 Pre-compromise the only mitigation ATT&CK lists for T1589.003?","opts":[{"t":"The collection happens outside the enterprise control scope, so defenders minimise public data instead","correct":true,"why":"M1056 says exactly this: the behaviour is outside the scope of enterprise controls, so the effort goes into minimising external data."},{"t":"The collection traffic is always encrypted, so controls cannot inspect it","correct":false,"why":"Encryption is not the reason; browsing a public page needs no special encryption story."},{"t":"The collection needs stolen admin rights, so MFA blocks it","correct":false,"why":"No access is needed at all — the adversary reads what anyone can read; MFA is irrelevant here."},{"t":"The collection only affects cloud tenants, so on-premises tools cannot see it","correct":false,"why":"The reason is broader: the activity happens outside the victim's reach, on social media or other open data sets."}],"explain":"Reading a public LinkedIn profile or a staff page happens on systems the defender does not own. No firewall, EDR or MFA rule can stop a stranger from reading a public page. That is why ATT&CK lists only M1056 Pre-compromise, and it redirects the effort: reduce how much staff data is available to external parties.","study":"Read the M1056 Pre-compromise mitigation text on the T1589.003 page.","hint":"Ask yourself: who owns the computer where this 'attack' happens? The defender does not."},{"id":"E05","title":"Spot the outsider","type":"qcm","summary":"Which item is not employee-name information","scen":[{"label":"CONTEXT","kind":"prose","body":"A junior analyst makes a list of what an adversary can learn about staff under T1589.003. One item on the list does not belong there."}],"q":"Which item does NOT belong to employee-name information?","opts":[{"t":"The model of the victim's border firewall","correct":true,"why":"A firewall model describes the victim's systems, not its people — that belongs to Gather Victim Host Information."},{"t":"Full names of IT support staff","correct":false,"why":"Staff names are exactly what T1589.003 covers."},{"t":"Job titles in the finance team","correct":false,"why":"Titles travel with names in staff lists and help the adversary pick believable roles."},{"t":"Speaker names from a public conference list","correct":false,"why":"Conference lists are open data sets full of employee names — a classic T1589.003 source."}],"explain":"T1589.003 is identity information about people: names, roles, departments. The firewall model is information about a host, which ATT&CK records under the Gather Victim Host Information family (T1592), not under identity information. Keeping the two families apart is the whole point of this exercise.","study":"Compare the ATT&CK descriptions of T1589 (identity information) and T1592 (host information).","hint":"Ask for each option: is this about a person, or about a machine?"},{"id":"E06","title":"Sort the behaviours","type":"drag","summary":"Two buckets: name gathering vs other ATT&CK behaviour","scen":[{"label":"CONTEXT","kind":"prose","body":"Four activity cards were found in a threat report. Sort them before the report is tagged in ATT&CK. One bucket is for collecting employee names (T1589.003); the other is for a different ATT&CK behaviour."}],"q":"Drag each card into the correct bucket.","buckets":[{"id":"names","t":"Collecting employee names (T1589.003)"},{"id":"other","t":"A different ATT&CK behaviour"}],"chips":[{"id":"c1","t":"Counting security engineers on the victim's LinkedIn page","b":"names","why":"LinkedIn is Social Media (T1593.001) — a classic source of employee names."},{"id":"c2","t":"Reading the staff page on the victim's careers website","b":"names","why":"A victim-owned website is named by ATT&CK as a place where names sit exposed."},{"id":"c3","t":"Testing staff logins with passwords from an old dump","b":"other","why":"Working with stolen secrets is Credentials (T1589.001) / Valid Accounts (T1078), not name collection."},{"id":"c4","t":"Port-scanning the victim's public IP ranges","b":"other","why":"That is Active Scanning (T1595) — machines and ports, not people."}],"explain":"Two cards are about people: reading LinkedIn and reading a staff page both collect employee names. Two cards are about systems or secrets: password testing and port scanning belong to other techniques. ATT&CK keeps people-information (T1589) and system-information (T1592) in different families.","study":"Group every artefact you meet by one question: person, machine, or secret?","hint":"Name collection means learning who works at the target — secrets and ports are not people."},{"id":"E07","title":"Match the siblings","type":"match","summary":"Pair each T1589 sub-technique ID with its name","scen":[{"label":"ARTEFACT 1 — ATT&CK excerpt","kind":"code","body":"T1589  Gather Victim Identity Information\n  three sub-techniques:\n    T1589.001   T1589.002   T1589.003"}],"q":"Match each sub-technique ID to its official ATT&CK name.","left":["T1589.001","T1589.002","T1589.003"],"right":["Credentials","Email Addresses","Employee Names"],"correct":[0,1,2],"why":["T1589.001 is Credentials — passwords, keys and other secrets about staff.","T1589.002 is Email Addresses — the addresses themselves, before or without the names.","T1589.003 is Employee Names — the people behind the addresses."],"explain":"The three siblings split identity information into three pieces: secrets (Credentials), addresses (Email Addresses) and people (Employee Names). The numbering is stable across ATT&CK versions, so recognising the pairs pays off every time you read a report.","study":"Memorise the trio .001 Credentials / .002 Email Addresses / .003 Employee Names.","hint":"The names follow the same order as the numbers: what a person HAS (credentials), SENDS with (email), and IS (name)."},{"id":"E08","title":"Name the tactic","type":"fill","summary":"One blank: which tactic owns T1589.003","scen":[{"label":"ARTEFACT 1 — ATT&CK card","kind":"code","body":"ID:        T1589.003\nName:      Employee Names\nSub-technique of: T1589\nTactic:    (see blank)\nPlatforms: PRE"}],"q":"Complete the sentence with the correct tactic.","text":"T1589.003 sits in the {0} tactic of the Enterprise matrix. This tactic covers what adversaries do before they try to get in.","blanks":[{"accept":["reconnaissance"],"why":"Tactic TA0043 Reconnaissance holds all pre-entry information gathering."}],"bank":["Reconnaissance","Persistence","Discovery","Collection"],"explain":"The tactic is Reconnaissance. It is the only tactic where the adversary is still fully outside. Persistence happens after entry, while Discovery and Collection happen inside the network after a foothold — so those three are wrong even though they sound related.","study":"Learn the two 'outside' ideas: the Reconnaissance tactic and the PRE platform marker.","hint":"You are looking for the only tactic that happens with zero access to victim systems."},{"id":"E09","title":"The adversary's small plan","type":"order","summary":"Order three simple steps from names to lure","scen":[{"label":"CONTEXT","kind":"prose","body":"An adversary has three planned steps on a napkin, but the order got shuffled when the napkin was folded. The goal: one phishing email that greets the reader by name and mentions their real team."}],"q":"Put the three steps in the order the adversary would do them.","items":["Find staff names on public pages","Derive work email addresses from the names","Send a believable lure to a named person"],"why":["Public pages and social media come first — they are free to read and expose the names.","Names turn into first.last@ addresses; the address needs the name before it can exist.","With a real name and address the lure can greet the person, which is the final step."],"explain":"This is the core use of T1589.003 in three beats: collect the names, derive the addresses, craft the lure. ATT&CK's description names exactly this chain — employee names are used to derive email addresses and craft more-believable lures. If you ever see a phish that greets people by first name, some version of this chain happened first.","persp":{"a":"From the red side, each step is cheap and silent: pages, a text editor, then one email.","d":"From the blue side, step one is nearly invisible, step two invisible, step three is the first thing your mail gateway can actually see."},"study":"Re-read the ATT&CK sentence: 'Employee names may be used to derive email addresses... and/or craft more-believable lures.'","hint":"Ask first: which step can even happen without the other two? The one that needs nothing goes first."},{"id":"E10","title":"Can we even see it?","type":"drag","summary":"Sort activities by defender visibility","scen":[{"label":"ARTEFACT 1 — ATT&CK detection note (AN1989)","kind":"code","body":"\"Much of this activity may have a very high occurrence\nand associated false positive rate, as well as potentially\ntaking place outside the visibility of the target\norganization, making detection difficult for defenders.\""}],"q":"Sort the four activities by whether a defender could see them in their own telemetry.","buckets":[{"id":"out","t":"Outside our visibility"},{"id":"in","t":"Visible in our own logs"}],"chips":[{"id":"c1","t":"Reading our staff LinkedIn profiles from a home laptop","b":"out","why":"LinkedIn is a third-party site; nothing reaches your logs."},{"id":"c2","t":"Buying a staff list from a shady online forum","b":"out","why":"The trade happens on someone else's platform — you see nothing."},{"id":"c3","t":"A script downloading our public staff directory page","b":"in","why":"The request hits your web server, so the visit is in your access logs."},{"id":"c4","t":"Someone testing our VPN login page","b":"in","why":"The attempts touch your edge systems, which do log them."}],"explain":"Anything that happens on third-party platforms — LinkedIn, forums, data brokers — never touches your infrastructure, so it cannot appear in your logs. Requests that hit your own web or VPN servers do leave traces. ATT&CK's detection note says the collection is mostly invisible and noisy, which is why it points defenders to the next lifecycle stage instead.","study":"Read analytic AN1989 for T1589.003 and note the phrase 'outside the visibility of the target organization'.","hint":"Ask for each card: does the data pass through a machine that WE own and log?"},{"id":"E11","title":"From name to technique ID","type":"fill","summary":"Map a staff-page artefact to the right ATT&CK IDs","scen":[{"label":"ARTEFACT 1 — public staff page (saved by the adversary)","kind":"code","body":"ACME Florists — Our Team\n  Dana Cole     — Payroll Lead\n  Marcus Webb   — IT Support"}],"q":"Complete the sentence with the correct ATT&CK IDs.","text":"From this page an adversary can build addresses like dana.cole@acmeflorists[.]example. In ATT&CK, collecting these names is sub-technique {0}, and its parent technique is {1}.","blanks":[{"accept":["t1589.003"],"why":"Employee Names is T1589.003 — exactly this artefact."},{"accept":["t1589"],"why":"The parent technique T1589 is Gather Victim Identity Information."}],"bank":["T1589.003","T1589","T1566","TA0043"],"explain":"The artefact shows names plus roles of employees — the definition of T1589.003 Employee Names. It sits under parent T1589, Gather Victim Identity Information. T1566 is Phishing, which might come later, and TA0043 is the tactic ID of Reconnaissance — a tactic, not a technique.","study":"Practise writing the full chain: TA0043 > T1589 > T1589.003.","hint":"One blank wants the sub-technique number ending in .003; the other wants its three-digit parent."},{"id":"E12","title":"Evidence to technique","type":"match","summary":"Pair each saved artefact with the sub-technique it proves","scen":[{"label":"CONTEXT","kind":"prose","body":"A seized laptop held three text files, each a different kind of identity data stolen from public or semi-public sources. Tag each artefact for the case report."}],"q":"Match each artefact to the ATT&CK sub-technique it evidences.","left":["notes.txt — job titles and full names copied from a staff page","addresses.txt — staff email addresses, no names attached","logins.txt — staff passwords from an old breach dump"],"right":["T1589.003 — Employee Names","T1589.002 — Email Addresses","T1589.001 — Credentials"],"correct":[0,1,2],"why":["Names and titles are people-data: T1589.003.","Addresses without names map to T1589.002.","Passwords are secrets: T1589.001."],"explain":"The kind of data decides the ID. People-data is T1589.003, address-data is T1589.002, secret-data is T1589.001. Case reports that tag this correctly let the next analyst see instantly which identity pieces the adversary already holds.","study":"Sort any identity artefact with one question: is it a person, an address, or a secret?","hint":"Match the noun in each file: names, addresses, passwords — each noun owns one ID."},{"id":"E13","title":"Read the procedure table","type":"qcm","summary":"Which group collected lists of names from targeted organizations","scen":[{"label":"ARTEFACT 1 — ATT&CK procedure examples for T1589.003","kind":"code","body":"ID      Name              Description\nG0094   Kimsuky           has collected victim employee\n                          name information\nG0034   Sandworm Team     research of potential victim\n                          organizations included the\n                          identification and collection of\n                          employee information\nG0122   Silent Librarian  has collected lists of names for\n                          individuals from targeted\n                          organizations"}],"q":"Which group does ATT&CK document as having 'collected lists of names for individuals from targeted organizations'?","opts":[{"t":"Silent Librarian","correct":true,"why":"That exact wording is Silent Librarian's row (G0122) in the procedure table."},{"t":"Kimsuky","correct":false,"why":"Kimsuky's row says 'collected victim employee name information' — similar, but not this wording."},{"t":"Sandworm Team","correct":false,"why":"Sandworm's row describes victim-organisation research that included employee information."},{"t":"No group is documented for this technique","correct":false,"why":"Three groups are documented — the table is right there in the artefact."}],"explain":"This exercise trains precise reading of procedure examples. All three groups touched employee information, but each row is worded differently: Kimsuky collected employee name information, Sandworm Team's research included employee information, and Silent Librarian collected lists of names from targeted organisations. Quote-matching like this is a daily CTI task.","study":"Open the T1589.003 page's Procedure Examples table and read each row slowly.","hint":"Find the phrase 'lists of names' in the artefact and read the name in the left column of that row."},{"id":"E14","title":"Finish the defender sentences","type":"fill","summary":"Two blanks straight from M1056 and AN1989","scen":[{"label":"ARTEFACT 1 — ATT&CK excerpts for T1589.003","kind":"code","body":"M1056 Pre-compromise:\n  \"Efforts should focus on minimizing the amount and\n   sensitivity of data available to external parties.\"\n\nAN1989 (detection analytic):\n  \"Detection efforts may be focused on related stages\n   of the adversary lifecycle, such as during Initial\n   Access.\""}],"q":"Complete the two sentences using the excerpt.","text":"Mitigation M1056 says to minimise how much staff data is available to {0}. Because the collection itself is hard to see, analytic AN1989 points detection at the next stage: {1}.","blanks":[{"accept":["external parties","outside parties"],"why":"M1056 literally says 'available to external parties'."},{"accept":["initial access"],"why":"AN1989 literally says 'such as during Initial Access'."}],"bank":["external parties","Initial Access","internal staff","Persistence"],"explain":"Both blanks are direct quotes, and both are the strategy in one line: shrink what strangers can read about your staff, and put your detection energy where evidence actually appears — the Initial Access stage, for example a phishing email that greets people by name. 'Persistence' is a later stage, and 'internal staff' contradicts the whole point: the data at risk is what leaves the building.","study":"Learn the pairing: M1056 = minimise external data, AN1989 = watch Initial Access.","hint":"The first blank is WHO can read the data; the second blank is the tactic that follows Reconnaissance."},{"id":"E15","title":"The defender's plan","type":"order","summary":"Order three sensible defender steps","scen":[{"label":"CONTEXT","kind":"prose","body":"A small security team just learned that its staff page lists every employee by name and role, and that staff profiles are public on social media. The team writes a short plan with three actions, but the order is debatable — do the sensible ATT&CK-aligned order."}],"q":"Order the three defender actions from first to last.","items":["Find out which staff names are public and how exposed they are","Reduce the amount of public staff data (trim the page, tighten profiles)","Watch inbound mail for personalised lures that use the old exposure"],"why":["You must measure the exposure before you can fix it — this maps to M1056's 'minimise' work.","Reduction follows the measurement; you cannot trim what you have not listed.","Detection comes last in the plan, and per AN1989 it watches Initial Access — the lures that may follow."],"explain":"The order follows the mitigation logic of M1056: measure, then minimise, then monitor the stage where the consequence shows up. Doing detection first would waste effort on noise, because AN1989 warns the collection itself is invisible and full of false positives. The plan accepts that old data may already be copied, so watching for lures stays on the list even after the page is trimmed.","study":"Re-read M1056 and turn each sentence into one concrete action.","hint":"Fixing a leak starts with finding it, not with watching for rain."},{"id":"E16","title":"The PRE platform","type":"fill","summary":"Two blanks: platform marker and parent technique","scen":[{"label":"ARTEFACT 1 — ATT&CK card","kind":"code","body":"ATT&CK object card\n  ID:              T1589.003\n  Name:            Employee Names\n  Tactic:          Reconnaissance\n  Platforms:       PRE\n  Sub-technique of: T1589\n  Siblings:        .001 Credentials, .002 Email Addresses"}],"q":"Complete the sentence with the platform marker and the parent technique.","text":"ATT&CK marks T1589.003 with the special platform {0}, which means the behaviour happens before any compromise. T1589.003 is one of three sub-techniques under the parent {1}.","blanks":[{"accept":["pre","pre (pre-compromise)","pre-compromise"],"why":"PRE is ATT&CK's marker for pre-compromise reconnaissance."},{"accept":["t1589"],"why":"The parent technique is T1589, Gather Victim Identity Information."}],"bank":["PRE","T1589","TA0043","POST"],"explain":"PRE is not a computer type like Windows or Linux — it is ATT&CK's flag that this behaviour runs 'before the compromise', on the open internet rather than inside the victim estate. The parent is T1589. TA0043 is the Reconnaissance tactic ID, not a technique, and POST is not an ATT&CK platform marker.","study":"Look up what the PRE platform means in ATT&CK's data model.","hint":"The platform marker is a three-letter abbreviation; the parent is a four-digit T-number without a dot."}]};
</script>

function fmtT(sec){ sec=Math.max(0,Math.round(sec)); var m=Math.floor(sec/60),s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function scoreExercise(h,w,n){ if(n<=0){return 0;} return Math.max(0,(h-w)/n); }
function normalize(s){ return String(s||'').toLowerCase().replace(/[.,;:!?"'`()\[\]]/g,' ').replace(/\s+/g,' ').trim(); }

/* ---------------- app state ---------------- */

/* ---------------- topbar ---------------- */
function sevClass(){ return {easy:'b-easy',medium:'b-medium',hard:'b-hard','extremely-hard':'b-extreme'}[D.meta.difficulty]; }
function topbarHTML(){
  return '<div class="topbar-in">'
   +'<span class="tb-count" id="tb-count"></span>'
   +'<span class="badge '+sevClass()+'"><span class="dot"></span>'+esc(D.meta.sevWord)+'</span>'
   +'<span class="tb-timer" id="tb-timer" aria-label="exam timer">--:--</span>'
   +'<span class="tb-state" id="tb-state"></span>'
   +'<span class="tb-spacer"></span>'
   +'<span class="tb-user" id="tb-user"></span>'
   +'<span class="tb-score" id="tb-score" aria-label="live score"></span>'
   +'<button class="btn btn-ghost" id="bt-hint" title="Reveal one hint (costs 10 percent of this exercise credit)">\u25C9 Hint</button>'
   +'<button class="btn btn-ghost" id="bt-pause" title="Manual pause: hides the exercise and stops the timer">\u23F8 Pause</button>'
   +'<button class="btn btn-ghost" id="bt-skip" title="Skip: move this exercise to the skipped pool">\u26A0 Skip</button>'
   +'</div><div class="pbar"><div class="pbar-in" id="pbar-in"></div></div>';
}
function renderUser(){
  var el = $('#tb-user'); if(!el){return;}
  if(S.user && S.user.username){ el.textContent = 'Analyst: '+S.user.username+(S.user.country && S.user.country!=='ZZ' ? ' ('+S.user.country+')' : ''); }
}
function updateTopbar(){
  var ex = curEx();
  $('#tb-count').textContent = S.view==='exam' ? ('Exercise '+(S.order.indexOf(S.idx)+1)+' of '+S.order.length) : '';
  var t = $('#tb-timer'); var st = $('#tb-state');
  t.textContent = fmtT(S.timer.remaining);
  var btp = $('#bt-pause');
  if(S.timer.state==='RUNNING'){ t.style.color='var(--state-correct)'; st.textContent='\u25B6 RUNNING'; st.style.color='var(--state-correct)'; btp.disabled=false; }
  else if(S.timer.state==='PAUSED_MANUAL'){ t.style.color='var(--state-paused)'; st.textContent='\u23F8 PAUSED \u2014 manual (press Resume)'; st.style.color='var(--state-paused)'; }
  else if(S.timer.state==='PAUSED_AUTO_CHECK'){ t.style.color='var(--state-paused)'; st.textContent='\u23F8 PAUSED \u2014 reviewing feedback (resumes on Next)'; st.style.color='var(--state-paused)'; }
  else if(S.timer.state==='ENDED'){ t.style.color='var(--state-skipped)'; st.textContent='\u25A0 ENDED'; st.style.color='var(--state-skipped)'; }
  else { st.textContent=''; }
  var sum=0, cnt=0;
  for(var k in S.credit){ sum+=S.credit[k]; cnt++; }
  var sc=$('#tb-score');
  if(cnt>0){ var pct=Math.round((sum/cnt)*100); sc.innerHTML='<b>'+sum.toFixed(1)+'</b> / '+cnt+' <span class="pct">\u00B7 '+pct+'%</span>'; }
  else { sc.innerHTML='<b>0.0</b> / 0 <span class="pct">\u00B7 start answering</span>'; }
  var p = S.view==='exam' ? ((S.order.indexOf(S.idx)+1)/S.order.length*100) : (S.view==='results'?100:0);
  $('#pbar-in').style.width = p+'%';
  document.body.setAttribute('data-exact-score', String(sum));
  renderUser();
}

/* ---------------- timer ---------------- */
var lastTick = null;
setInterval(function(){
  var now = Date.now();
  if(lastTick===null){ lastTick=now; return; }
  var dt = now-lastTick; lastTick=now;
  if(S.timer.state==='RUNNING'){
    S.timer.remaining -= dt/1000;
    if(S.timer.per.active){ S.timer.per.rem -= dt/1000;
      var pe=$('#per-timer-v'); if(pe){ pe.textContent = fmtT(S.timer.per.rem);
        if(S.timer.per.rem<=30){ pe.style.color='var(--state-incorrect)'; } }
      if(S.timer.per.rem<=0){ S.timer.per.active=false; if(widget&&widget.autoSubmit){ widget.autoSubmit(); } }
    }
    if(S.timer.remaining<=0){ S.timer.remaining=0; S.timer.state='ENDED'; endExam('timeout'); }
    if(S.view==='exam'||S.view==='review'){ updateTopbar(); }
  }
},250);
function setTimerState(st){
  if(st==='PAUSED_MANUAL'){ S.sinceManual=Date.now(); }
  if(st==='RUNNING'){ if(S.sinceManual){ S.acc.manual+=(Date.now()-S.sinceManual)/1000; S.sinceManual=null; } }
  if(st==='PAUSED_AUTO_CHECK'){ if(!S.sinceAuto){ S.sinceAuto=Date.now(); } }
}
function leaveAuto(){ if(S.sinceAuto){ S.acc.auto+=(Date.now()-S.sinceAuto)/1000; S.sinceAuto=null; } }

/* manual pause (can also be pressed on top of the Check auto-pause) */
function togglePause(){
  var t=S.timer;
  if(t.state==='RUNNING'||t.state==='PAUSED_AUTO_CHECK'){
    if(t.state==='PAUSED_AUTO_CHECK'){
      S.pendingAuto=true;
      if(S.sinceAuto){ S.acc.auto+=(Date.now()-S.sinceAuto)/1000; S.sinceAuto=null; }
    }
    t.state='PAUSED_MANUAL'; S.sinceManual=Date.now(); showPauseOverlay();
  }
  else if(t.state==='PAUSED_MANUAL'){
    hidePauseOverlay();
    if(S.sinceManual){ S.acc.manual+=(Date.now()-S.sinceManual)/1000; S.sinceManual=null; }
    if(S.pendingAuto){ t.state='PAUSED_AUTO_CHECK'; if(!S.sinceAuto){ S.sinceAuto=Date.now(); } }
    else { t.state='RUNNING'; }
  }
  updateTopbar();
}
function showPauseOverlay(){
  var o=document.createElement('div'); o.className='overlay'; o.id='pause-overlay';
  o.innerHTML='<div class="overlay-card"><div class="big">\u23F8</div><h2>PAUSED \u2014 manual break</h2>'
   +'<p>The timer is stopped and the exercise is hidden. Press Resume when you are ready to continue.</p>'
   +'<button class="btn btn-primary btn-lg" id="bt-resume">Resume exam</button></div>';
  document.body.appendChild(o);
  $('#bt-resume').addEventListener('click', togglePause);
}
function hidePauseOverlay(){ var o=$('#pause-overlay'); if(o){ o.remove(); } }

/* ---------------- views ---------------- */
function show(id){ ['view-intro','view-exam','view-review','view-results'].forEach(function(v){ var el=$('#'+v); if(el){ el.classList.add('hidden'); } }); $('#'+id).classList.remove('hidden'); window.scrollTo(0,0); }

function renderIntro(){
  var I=D.intro, m=D.meta;
  var h='<div class="intro-head"><h1>'+esc(I.h1)+'</h1>'

   +'<span class="badge '+sevClass()+'"><span class="dot"></span>'+esc(m.sevWord)+'</span>'
   +'<span class="fact"><b>'+D.exercises.length+'</b> exercises</span>'
   +'<span class="fact">estimated <b>'+m.estimatedMinutes+' min</b> \u00B7 timer budget <b>'+fmtT(m.timerSeconds)+'</b></span>'
   +'<span class="fact">pass mark <b>'+m.passMark+'%</b></span>'
   +'</div></div>';
  h+='<div class="panel"><h2>'+esc(I.learnTitle)+'</h2>'+I.learn.map(function(p){return '<p>'+p+'</p>';}).join('')+'</div>';
  h+='<div class="panel"><h2>Keywords covered in this exam</h2>';
  I.themes.forEach(function(t){ h+='<div class="kw-theme"><h3>'+esc(t.name)+'</h3><div class="kw-list">'
    +t.items.map(function(x){return '<span class="kw">'+esc(x)+'</span>';}).join('')+'</div></div>'; });
  h+='</div>';
  h+='<div class="panel"><h2>How this exam works</h2><ul class="rules">';
