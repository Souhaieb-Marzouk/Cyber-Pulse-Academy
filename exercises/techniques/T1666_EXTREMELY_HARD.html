/* ===== T1666 — EXTREMELY HARD ===== */
var EXAM = {
meta:{topicId:'t1666',batch:4,title:'T1666 Modify Cloud Resource Hierarchy — EXTREMELY HARD',difficulty:'extremely-hard',questionCount:17,estimatedMinutes:58,passMark:70,sevKey:'extreme',sevName:'EXTREMELY HARD',objId:'T1666',objName:'Modify Cloud Resource Hierarchy',timerSeconds:4200},
intro:{
learn:'<p>This is the <b>EXTREMELY HARD</b> exam for <b>T1666 — Modify Cloud Resource Hierarchy</b>: the technique where adversaries restructure an IaaS environment — AWS Organizations, accounts, SCPs, Azure management groups, subscriptions and tenant transfers — so that guardrails and detections stop covering them. Formally, this is a <b>Technique</b> object in ATT&amp;CK Enterprise — tactic Defense Impairment (TA0112), platform IaaS, no sub-techniques.</p><p>Here you are the senior decision-maker. Scenarios chain <b>three or more concepts</b> and contain <b>conflicting signals</b>: a real M&amp;A onboarding runs in parallel with what may be an attack, a dashboard contradicts an event stream, a runbook “best practice” is the wrong move, and the right containment has a real business cost you must accept and state. At least one best answer is <i>“do nothing destructive yet — corroborate and escalate.”</i></p><p>The artefact sets are rich and partly <b>irrelevant on purpose</b>: facility emails, ticketed batch jobs, invoice trivia. Incomplete information is part of every case — you will be asked what the evidence <i>does</i> support, not what a story would like it to say. This is the working reality of a <b>senior IR lead</b> briefing a CISO on a weekend, a <b>detection engineer</b> defending an AN0442 tuning decision, a <b>cloud architect</b> designing a transfer-freeze that does not stop a merger, and a <b>GRC analyst</b> writing the gap statement an auditor will accept.</p><p>Everything is built from the ATT&amp;CK page for T1666 — <code>LeaveOrganization</code>, <code>CreateAccount</code>, <code>MoveAccount</code>, Azure subscription creation and hijacking — plus its mitigations M1018 / M1047 / M1054 and its detection strategy DET0155 / AN0442.</p>',
keywords:[
{theme:'Senior decision-making',items:['Resolving conflicting signals (ticket vs principal deviation)','Cost-accepting containment (targeted vs group-wide)','“Do nothing destructive yet” as the correct call','Evidence preservation before remediation']},
{theme:'Detection engineering',items:['AN0442 correlation windows and baselines','Eventual-consistency traps (policy state vs API events)','Ninety-day sweeps for earlier hierarchy hits','Detection-gap statements for auditors']},
{theme:'Adversary trade-offs',items:['CreateAccount stealth vs LeaveOrganization permanence','Transfer-direction forensics from log fields','Playbook error-spotting (wrong-layer response)','Out-of-band witnesses after a transfer']},
{theme:'Control mapping',items:['Preventive / detective / corrective classification','M1054, M1018, M1047 mapped to the gap they closed','Restore sequencing (D3-RC last, evidence first)','Stakeholder briefing with confidence levels']}],
how:'<ul class="howlist"><li><b>Pass mark: 70%.</b> A PASS means you can hold a full hierarchy-attack case in your head and make the calls a senior would defend. A FAIL means retake — the scenarios repay a second pass.</li><li><b>Exercise types in this file:</b> five-artefact case analysis, dependent branching decisions, conflicting-signal multiple choice, runbook-trap spotting, priority ranking over six findings, analytic completion, an evidence-preservation terminal with a senior pace target, control mapping, auditor-statement selection, and a four-alert triage queue.</li><li><b>Timer:</b> you get a 70 minute countdown. 💡 <b>Hint</b> restates a constraint you may have missed (−10% of that exercise’s credit, one per exercise). ⏸ <b>Pause</b> hides the exercise for a real break.</li><li><b>Check pauses the timer:</b> ✓ Check stops the clock immediately — feedback stays as long as you need; the clock resumes on Next. Branching exercises grade and pause only on the final Check. The terminal exercise shows a senior pace target on screen and obeys the same pause rules.</li><li><b>Partial credit:</b> multi-item exercises score (correct − wrong) ÷ total. Defensible-looking wrong picks subtract. Reason before you tick.</li><li><b>Skipping:</b> ⚠ Skip parks the exercise without revealing anything; the pool stays open while the timer runs; never-answered exercises are excluded from the score.</li><li>Press <b>Start</b> — the CISO is waiting.</li></ul>'
},
exercises:[
{id:'x1',type:'multi',summary:'00:10 Sunday — five artefacts, one CISO question',
scenario:['Sunday, 00:10. Meridian Energy Group is mid-merger with Corvus Retail Ltd. The CISO needs a decision in 10 minutes: “Are we being attacked, or is this the merger?” Five artefacts are on the bridge screen.'],
artefacts:[
{label:'ARTEFACT 1 — CloudTrail 23:47 Sat',html:'<p><span class="lk">eventName</span>=<span class="ls">CreateAccount</span> → <span class="ls">meg-tmp-9903</span><br><span class="lk">principal</span>=<span class="lu">user/tmp-adm-4172</span> (created 5h earlier, no JIT approval)<br><span class="lk">changeRef</span>=<span class="ls">null</span></p>'},
{label:'ARTEFACT 2 — Jira MEG-2941 (Corvus onboarding wave 2)',html:'<p>Scope: create 4 accounts, named in the ticket. Owner: platform team. Status: 3 created in business hours by <code>role/OrgOnboarding-bot</code>, all ticketed. 4th pending Monday.</p>'},
{label:'ARTEFACT 3 — Email (facility system)',html:'<p>From: <span class="lu">facility-alerts@meridian-energy[.]example</span> — “Dock B gate motor maintenance scheduled Sunday 06:00. Expect contractors.”</p>'},
{label:'ARTEFACT 4 — Azure Activity Log (pending)',html:'<p><span class="lk">operation</span>=<span class="ls">Transfer Subscription (request)</span> · <span class="lk">subscription</span>=<span class="ls">meg-mtr-payg-01</span> · <span class="lk">targetTenantId</span>=<span class="ls">8d1f-… (not in CMDB)</span></p>'},
{label:'ARTEFACT 5 — CMDB policy note',html:'<p>Group policy: temporary accounts must carry a <code>tmp-</code> prefix <b>and</b> a linked ticket. Deviations page the on-call.</p>'}],
question:'Select <b>all</b> statements the artefacts actually support.',
options:[
{t:'The 23:47 CreateAccount breaks the M&A baseline: no ticket, unfamiliar principal, off-hours',correct:true,why:'Artefacts 1, 2 and 5 agree: the bot does the ticketed creations; tmp-adm-4172 has none of the three baseline marks.'},
{t:'A subscription transfer request to an unknown external tenant is in progress',correct:true,why:'Artefact 4 is explicit — and 8d1f-… is not in the CMDB.'},
{t:'Ownership of the external tenant is unverified; the case is incomplete until billing corroborates',correct:true,why:'The artefacts show a request and an unknown ID, not proof of who owns it.'},
{t:'The dock B maintenance email proves insider involvement',why:'It is realistic noise — facility traffic with no link to the hierarchy events.'},
{t:'All four Corvus onboarding accounts are confirmed hostile',why:'Three are ticketed, business-hours, bot-created — the artefacts support the opposite.'}],
multiNote:'Three of five statements are supported. Narrative desires do not count.',
hint:'Separate what the fields say from what the story wants. The facility email and the three ticketed accounts are noise.',
explain:'The senior read: one <b>baseline-breaking</b> account creation, one <b>pending transfer</b> to an unknown tenant, and an honest gap — tenant ownership unverified. The facility email and the three ticketed accounts are noise the scenario inserted on purpose. <b>Attacker view:</b> merging into real M&amp;A noise is the cover. <b>Defender view:</b> say exactly what is supported — the CISO brief is built on those three lines, not on five.'},

{id:'x2',type:'branch',summary:'The 10-minute decision — three dependent calls',
scenario:['Same case. You are running the bridge. Each step depends on the previous one. The final Check grades all three.'],
question:'Make each call in order. Destructive shortcuts cost you the case later.',
steps:[
{label:'STEP 1 — 00:10, first move',text:'The rogue account and the pending transfer are live. What is your first move?',
options:[
{t:'Corroborate the transfer with the billing contact and the tenant ID while keeping live monitoring on both events',correct:true,why:'The evidence is incomplete; corroboration costs minutes and preserves every option.'},
{t:'Delete tmp-adm-4172 and cancel the Corvus onboarding',why:'Destroys evidence and kills a legitimate merger stream on a 10-minute-old suspicion.'},
{t:'Shut down every subscription in the group',why:'Catastrophic business impact on an unverified read.'},
{t:'Wait for the Monday change board',why:'The transfer is pending now — waiting concedes the move.'}]},
{label:'STEP 2 — 00:40, corroboration returns',text:'Billing: “No knowledge of any transfer.” Vendor portal: tenant 8d1f-… was created yesterday. Which signal wins now?',
options:[
{t:'The unexplained external tenant plus no billing knowledge outweighs the quiet weekend — declare an incident',correct:true,why:'Both corroboration legs failed; the benign explanation is gone.'},
{t:'The Jira ticket covers it — wait for Monday after all',why:'The ticket covers named accounts by the bot; it covers neither tmp-adm-4172 nor the transfer.'},
{t:'The facility email suggests an insider — pull the contractors in',why:'Noise. It never connected to the hierarchy events.'},
{t:'Re-run the query — the logs may be stale',why:'The event stream is live and two sources now agree; re-querying is delay.'}]},
{label:'STEP 3 — 01:00, containment',text:'Incident declared. Choose the containment that preserves evidence and the merger.',
options:[
{t:'Targeted containment: deny-SCP / policy on the rogue account and freeze the pending transfer; keep everything running',correct:true,why:'Stops exactly the two hostile moves, destroys nothing, touches the merger nowhere.'},
{t:'Delete the rogue account immediately',why:'Erases the principal, its session history and your case.'},
{t:'Delete the whole organization and rebuild',why:'Evidence annihilation at group scale.'},
{t:'Rotate every password in the tenant',why:'Enormous blast radius, and it contains neither the account nor the transfer.'}]}],
hint:'Step 1: the evidence is not complete yet. Step 2: two independent corroboration legs just failed. Step 3: stop the two moves, nothing else.',
explain:'This is the senior pattern: <b>corroborate → declare → contain narrowly</b>. Each step refused a destructive shortcut that a calm analyst can see was premature. The targeted deny/freezes are the M1054 pattern applied as response — forbidding the move without killing the estate. <b>Defender view:</b> evidence, options and the merger all survive. <b>Attacker view:</b> the plan dies at the freeze, and the audit stream still tells the whole story.'},

{id:'x3',type:'qcm',summary:'The ticket exists — so which reading wins?',
scenario:['The defence on the bridge: “Jira MEG-2941 exists and covers account creation this weekend — the 23:47 call is covered.” The facts: the call came from <code>user/tmp-adm-4172</code>, not <code>role/OrgOnboarding-bot</code>; the account <code>meg-tmp-9903</code> is not in the ticket’s account list; the ticket’s own scope says bot-only.'],
question:'Which reading wins, and why?',
options:[
{t:'The deviation wins: the ticket covers named accounts by a named bot, so this call sits outside its scope',correct:true,why:'A ticket legitimises what it names — nothing more.'},
{t:'The ticket wins: any open onboarding ticket legitimises any CreateAccount call that weekend',why:'That logic would excuse every hierarchy abuse that ever happened during a merger.'},
{t:'Neither — conflicting signals cancel and the case waits',why:'Signals do not cancel; scope comparison resolves them.'},
{t:'The hour wins: anything after 22:00 is hostile by policy',why:'Policy-by-clock is the noise generator the tuning exercise warned about.'}],
hint:'Compare the ticket’s exact scope to the call’s exact principal and object.',
explain:'Conflicting signals resolve by <b>scope comparison</b>: the ticket names accounts, a principal and a window; the call matches none of the three. This is the discipline behind AN0442’s “deviates from organizational baselines” — deviation is measured against what is written down, not against what feels plausible. State it that way in the CISO brief and the room aligns in one sentence.'},

{id:'x4',type:'qcm',summary:'The runbook trap — auto-delete is 3 minutes away',
scenario:['The on-call runbook (v7) says: “Any account created outside the CMDB is auto-deleted by remediation within 15 minutes.” The rogue account <code>meg-tmp-9903</code> is 12 minutes old. The automation is armed.'],
question:'Why is letting the runbook fire the <b>wrong</b> move right now?',
options:[
{t:'Deleting destroys evidence and could kill a legitimate M&A account — contain first, investigate later',correct:true,why:'Deletion erases the principal, its session and its linkage; a targeted deny achieves containment without destruction.'},
{t:'The runbook is always right — automation must never be second-guessed',why:'Runbooks encode yesterday’s risk appetite; a live case overrides them.'},
{t:'The account cannot be deleted by automation',why:'It can — that is why the decision matters in the next three minutes.'},
{t:'Deletion only alerts the attacker; nothing else changes',why:'Deletion changes everything: evidence, sessions and possibly a merger account.'}],
hint:'The widely-used “best practice” is the trap. What does deletion cost that a deny does not?',
explain:'This is the “widely used best practice is wrong here” trap. Auto-delete is a fine hygiene default for quiet Tuesdays; during a live hierarchy case it is an <b>evidence destructor</b> and a possible merger-killer. The senior move is to disarm the automation, apply the targeted deny (M1054-as-response), and let the investigation read the account while it is frozen in place.'},

{id:'x5',type:'multi',summary:'36 hours later — which out-of-band witnesses still work?',
scenario:['The transfer of <code>meg-mtr-payg-01</code> completed 36 hours ago. Compute is running that nobody in the group can see. The CISO asks which witnesses <b>outside the moved subscription</b> still work for you.'],
question:'Select <b>all</b> witnesses that can still surface the abuse.',
options:[
{t:'Cost anomalies on the payment instrument that rode along with the subscription',correct:true,why:'Payment methods follow the account, so billing stays an out-of-band witness.'},
{t:'The vendor-side record showing tenant 8d1f-… was created the day before the transfer',correct:true,why:'The vendor portal lives outside your tenant — and outside the attacker’s control.'},
{t:'Post-transfer VM CPU metrics in the Meridian Activity Log',why:'The resources belong to the owning tenant now; their telemetry follows them.'},
{t:'The SIEM’s copy of firewall logs for the post-transfer VMs',why:'Those flows run inside the moved subscription — the victim SIEM never saw them.'},
{t:'A new Azure Monitor alert scoped to the moved subscription',why:'A scope pinned to the moved subscription now watches the attacker’s world, not yours.'}],
multiNote:'Two witnesses survive. Everything scoped inside the moved subscription does not.',
hint:'Ask one question per option: does this witness live inside the moved subscription, or outside it?',
explain:'<b>Defender view:</b> after a hijack, your working witnesses are the ones the move could not carry away — billing on the payment instrument, and vendor-side records such as the new tenant’s creation date. Everything scoped inside the subscription now belongs to the owner. <b>Attacker view:</b> that is the payoff — compute “without generating logs on the victim tenant”, in the ATT&amp;CK wording. Your monitoring plan must therefore lean on out-of-band signals plus the pre-transfer identity chain.'},

{id:'x6',type:'order',summary:'Rank the six findings for the 08:00 brief',
scenario:['Sunday 06:30. The sweep has produced six findings. Rank them 1 (act first) to 6 (housekeeping) for the CISO brief.'],
items:['A pay-as-you-go subscription transferred to an external tenant — confirmed 36h ago','Role elevation followed by LeaveOrganization on the corvus-finance account — confirmed chain','A second subscription transfer request is pending for meg-mtr-payg-03','The management account runs five workloads','Two resource groups carry unapproved tags','A password-rotation ticket sits in the service queue'],
hint:'Order by realised harm, then active capability, then degraded detection, then hygiene, then noise.',
explain:'Realised outcomes first (completed transfer, confirmed elevation→leave chain), then the <b>active</b> second transfer request, then the degraded baseline (management-account workloads), then hygiene (tags), then pure noise (rotation ticket). The ranking is the brief: it tells the CISO that the adversary is mid-campaign — two moves realised, one in flight — which is exactly the urgency the 10-minute decision protected.'},

{id:'x7',type:'blank',summary:'State AN0442 from memory — the full rule',
scenario:['The auditor asks you to state the analytic you tuned, in one sentence. Complete it.'],
text:'AN0442 correlates an administrative role <code>{0}</code> followed by a hierarchy <code>{1}</code> inside a short <code>{2}</code>, and flags deviation from the organizational <code>{3}</code>.',
bank:['elevation','modification','window','baseline','subnet','certificate'],
correct:['elevation','modification','window','baseline'],
why:['What comes first in the chain.','What follows it at the management plane.','The bounded time that links the two events.','The reference the deviation is measured against.'],
hint:'The rule is a four-word spine: what happens first, what happens next, how close, measured against what.',
explain:'The full rule is the defender’s memory of the whole technique: <b>elevation → modification → window → baseline</b>. Lose any one of the four and the rule either never fires (no elevation leg) or fires all night (no baseline). This sentence is what you defend in tuning reviews and what the auditor will quote back at you.'},

{id:'x8',type:'terminal',summary:'Preserve the policy-state evidence — before anyone “fixes” it',
scenario:['Bridge, 00:35. The policy dashboard insists every guardrail is “enforced: yes”, while the event stream shows a successful guardrail escape. The platform team is 20 minutes from “correcting” the Azure policy assignments. Legal wants the current assignment state preserved as machine-readable evidence before anything changes. The Azure CLI is authenticated to the Meridian tenant on the forensics jump host.'],
timerNote:'Senior pace target: about four minutes. Evidence preservation is a race against remediation. The command is graded on its evidence-preservation elements.',
question:'Run the Azure CLI command that lists the policy assignments and <b>saves the output to a .json file</b>, then press Check.',
prompt:'forensics@meg-jump:~$',
simMatch:'az policy assignment list',
simLines:['[','  { "name": "deny-subscription-transfer", "scope": "/providers/Microsoft.Management/managementGroups/meg-root", "enforcementMode": "Default" },','  { "name": "require-tags", "scope": "/subscriptions/meg-prod-01", "enforcementMode": "Default" },','  { "name": "allowed-locations", "scope": "/providers/Microsoft.Management/managementGroups/meg-root", "enforcementMode": "Default" }',']','— output saved to file —'],
required:[{re:'(^|\\s)az(\\s|$)',label:'the az CLI program'},{re:'(^|\\s)policy(\\s|$)',label:'the policy command group'},{re:'(^|\\s)assignment(\\s|$)',label:'the assignment object'},{re:'(^|\\s)list(\\s|$)',label:'the read-only list command'},{re:'(^|\\s)>{1,2}\\s*\\S+\\.json',label:'output redirected to a .json file (the preservation step)'}],
wrong:[{re:'\\srm\\s|s3\\s+rm',label:'a deletion command',why:'You are preserving evidence, not deleting anything.'},{re:'policy\\s+assignment\\s+(update|create|delete)',label:'a state-changing assignment operation',why:'Creating, updating or deleting assignments rewrites the very state you were told to preserve.'}],
dangerous:[{re:'(delete|update|create)\\s',label:'a state-changing operation',why:'No change window is open — editing assignments or definitions during the case destroys the state you were asked to freeze.'},{re:'purge',label:'a purge operation',why:'Purging removes the record permanently.'}],
canonical:'az policy assignment list > meg-policy-state.json',
parts:[{label:'az policy assignment list',why:'The read-only view of every assignment the tenant inherits right now — the reality the lagging dashboard only sketches.'},{label:'(optional --scope or --output json)',why:'Scoping to a management group or forcing JSON output is fine — the graded core is the listing plus the redirect.'},{label:'> meg-policy-state.json',why:'The preservation step: the state now exists outside the dashboard that can lag or be edited.'}],
hint:'Two halves: the read-only listing of the policy assignment object — then a shell redirect into a .json file.',
explain:'<b>Defender view:</b> preservation is a shell redirect — cheap, fast, and the reason the “enforced: yes” claim can be checked against reality months later. <b>Attacker view:</b> a lagging dashboard plus a helpful “cleanup” is exactly the cover a guardrail escape needs; freezing the state first closes it. The near-miss commands here were not wrong syntax — they were wrong <i>actions</i>: updating or deleting assignments would have rewritten the evidence while “helping”.'},

{id:'x9',type:'qcm',summary:'Why CreateAccount instead of LeaveOrganization?',
scenario:['The adversary had rights for both moves. They chose <code>CreateAccount</code> — a quiet new account inside the organization — rather than the loud leave. The CISO asks why.'],
question:'Which explanation holds?',
options:[
{t:'A new account rides the organization’s payment methods and raises fewer alarms than a guardrail removal',correct:true,why:'The ATT&amp;CK description: same payment methods, and it may not be subject to existing detections or SCPs.'},
{t:'CreateAccount deletes the management account quietly',why:'It creates accounts; it deletes nothing.'},
{t:'LeaveOrganization is impossible in AWS',why:'It is not — this case contains one.'},
{t:'New accounts receive the full SCP set immediately at creation',why:'The description says the opposite — coverage is not guaranteed.'}],
hint:'Weigh stealth against permanence — which move keeps the attacker inside your billing and your tree, unnoticed?',
explain:'<b>CreateAccount</b> is the stealth play: stay inside the org tree, inherit the payment rails, and hope coverage was never extended to the fresh account. <b>LeaveOrganization</b> is the loud, permanent escape — one event, guardrails gone. Senior defenders watch for both shapes: the escape (DET0155’s named APIs) and the quiet fresh-account pattern that baseline comparison catches.'},

{id:'x10',type:'qcm',summary:'The dashboard contradicts the event stream',
scenario:['23:48 — the org event stream shows <code>LeaveOrganization</code> succeeded on <code>corvus-finance</code>. 23:52 — the SCP management dashboard still shows <code>scp-deny-leave</code> as “enforced: yes” for that account. The bridge wants one answer.'],
question:'Which reading do you act on, and how?',
options:[
{t:'Act on the API event: policy-state telemetry can lag — verify with the org event stream and treat the leave as done',correct:true,why:'The event is the ground truth of what executed; dashboards report desired state and can trail reality.'},
{t:'Act on the dashboard: the API log entry must be corrupted',why:'Logs of executed calls are the system of record; a lagging widget is not “corruption”.'},
{t:'Both cancel out — close the alert',why:'A successful guardrail removal does not un-happen because a chart lags.'},
{t:'Reboot the management console to reconcile the two',why:'Cosmetics. The reconciliation you need is event-stream verification.'}],
hint:'Which of the two is a record of something that executed, and which is a picture of desired state?',
explain:'<b>Eventual consistency is the trap:</b> policy-state telemetry describes what <i>should</i> be and trails what <i>was</i>. The API event proves execution — that is what the case, the alert and the CISO brief run on. The dashboard gets a ticket, not authority. Senior analysts resolve signal conflicts by asking which source is closer to the action.'},

{id:'x11',type:'qcm',summary:'The playbook has one wrong layer',
scenario:['SOC playbook v4, section “Cloud hierarchy events”: <br>Step 1 — confirm the organization API event.<br>Step 2 — isolate the affected VM with EDR.<br>Step 3 — reimage the affected VM.<br>Step 4 — close the ticket.'],
question:'Which step is the <b>mistake</b> for a T1666 hierarchy attack?',
options:[
{t:'Step 2 — isolation targets a VM, but the impairment lives at the organization/management plane',correct:true,why:'There is no “affected VM”; the response must target accounts, SCPs and transfers.'},
{t:'Step 1 — confirming events is never the first step',why:'Confirmation is exactly the right first step.'},
{t:'Step 4 — tickets must stay open forever',why:'Tickets close after response, not never.'},
{t:'None — the playbook is correct as written',why:'A VM playbook applied to a management-plane attack responds to nothing.'}],
hint:'Ask what object each step touches — and which object T1666 actually touched.',
explain:'The playbook was written for endpoint attacks and pasted under a cloud heading. T1666 never lands on a VM: the moves are org APIs, subscription transfers and policy objects. The correct steps are management-plane ones — verify the event, freeze movement with SCP/policy, sweep for siblings, restore from known-good. Wrong-layer playbooks are how teams “respond” for six hours while the transfer completes.'},

{id:'x12',type:'match',summary:'Classify the controls',
scenario:['The auditor asks for the control category of each line in the T1666 annex. Match them.'],
lefts:['SCP that denies <code>organizations:LeaveOrganization</code>','DET0155 / AN0442 alert on elevation → hierarchy change','D3-RC — Restore Configuration','M1047 scheduled hierarchy audit'],
rights:['Preventive','Detective — raises the signal during the attack','Corrective','Detective — finds the residue after the attack'],
correct:[0,1,2,3],
why:['It forbids the move before it happens.','It raises the signal while it happens.','It repairs the state after it happened.','The audit finds residue after the fact.'],
hint:'Forbid, raise, repair, find.',
explain:'Categories drive budget arguments: <b>preventive</b> (M1054 configurations) stops the move; <b>detective</b> (AN0442, the M1047 audit) finds it; <b>corrective</b> (D3-RC restore) repairs it. A mature T1666 posture funds one of each — a case with only detective controls detects every attack and stops none.'},

{id:'x13',type:'multi',summary:'The auditor gap statement',
scenario:['External audit, Monday. Legal wants the gap statement worded so it survives scrutiny. Four candidate bullets are on the table.'],
question:'Select <b>all</b> bullets that belong in the gap statement.',
options:[
{t:'Subscription transfers were not blocked by tenant policy — an M1054 gap',correct:true,why:'A missing preventive configuration, named with its mitigation ID.'},
{t:'Break-glass roles were not scoped or alerted for hierarchy changes — an M1018 gap',correct:true,why:'The capability gap that let the elevation happen unwatched.'},
{t:'Hierarchy audit cadence was quarterly while the control baseline requires monthly — an M1047 gap',correct:true,why:'A cadence gap against the stated baseline — measurable and fixable.'},
{t:'The group operates both AWS and Azure',why:'A fact, not a gap. Auditors fund gaps, not geography.'}],
multiNote:'Three bullets are gaps with owners. One is scenery.',
hint:'A gap statement names a missing control, its mitigation family, and is falsifiable. Scenery does not qualify.',
explain:'Each accepted bullet has three properties: a <b>missing control</b>, a <b>mitigation ID</b> (M1054 / M1018 / M1047), and a <b>fix an owner can sign</b>. The AWS-and-Azure bullet fails all three. This is GRC value in the T1666 file: the page’s mitigation list converts directly into an auditor-grade finding set.'},

{id:'x14',type:'triage',summary:'The 08:00 queue — four alerts, one busy morning',
scenario:['Sunday 08:00. Four alerts wait while the incident runs. Decide each so the team does not drown.'],
alerts:[
{title:'Alert A — P1: vm-meg-app14 CPU 99%',body:'Change CHG-771 (“month-end batch run”) is active and names this VM. No hierarchy events.',
options:[{t:'Archive as benign — ticketed batch job',correct:true,why:'The change record explains the load; nothing touches the hierarchy.'},{t:'Respond now as incident work',why:'It would pull your best people onto a ticketed batch run.'},{t:'Escalate to the CISO',why:'The CISO has a campaign to hear about — not a batch window.'}]},
{title:'Alert B — Medium: MoveAccount to ou-mg-sandbox',body:'By <code>svc-Terra-Planner</code>, no change reference, during the active incident window.',
options:[{t:'Respond now — hierarchy move, unticketed, inside the incident window',correct:true,why:'A guardrail escape during a confirmed campaign is campaign activity until proven otherwise.'},{t:'Archive — pipelines move accounts all the time',why:'Without a ticket, during this window, the pipeline explanation does not hold.'},{t:'Wait for the pipeline owner’s Monday summary',why:'The move takes effect immediately; Monday is too late.'}]},
{title:'Alert C — Critical: LeaveOrganization on corvus-finance',body:'Confirmed successful, principal linked to the case.',

{title:'Alert D — Info: deny-subscription-transfer policy deployed',body:'By the platform team, approval reference attached, top management group.',
options:[{t:'Archive as benign — the planned defensive change',correct:true,why:'It is the M1054 fix arriving; log it as mitigation progress.'},{t:'Respond now',why:'Responding to your own fix wastes the window.'},{t:'Escalate as attacker activity',why:'The approval reference and the defensive direction say otherwise.'}]}],

correct:['targeted','account','downtime'],

]};

</script>
<script>
'use strict';
/* ============ T1666 dark exam engine (vanilla JS, no external requests) ============ */
var $=function(s){return document.querySelector(s);};
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmtT(sec){var m=Math.floor(sec/60),s=sec%60;return m+':'+(s<10?'0':'')+s;}
function minLabel(sec){return Math.round(sec/60)+' min';}
var META=EXAM.meta;
function creditLabel(c,N){ if(c>=1)return {cls:'fb-ok',ic:'✓',word:'CORRECT'}; if(c>0)return {cls:'fb-part',ic:'✓',word:'PARTIALLY CORRECT'}; return {cls:'fb-bad',ic:'✗',word:'INCORRECT'}; }

/* ---------------- global attempt state ---------------- */
var S={view:'intro',order:[],idx:0,credits:{},hinted:{},skipped:[],reviewMode:false,
  timer:{state:'RUNNING',remaining:0,prev:'RUNNING'},_int:null,
  pausedManualSec:0,pausedAutoSec:0,reportFired:false,username:''};

function setState(st){ if(S.timer.state===st)return; S.timer.prev=S.timer.state; S.timer.state=st; renderTop(); }
function startTicker(){ if(S._int)clearInterval(S._int); S._int=setInterval(tick,1000); }
function tick(){
  var t=S.timer;
  if(t.state==='RUNNING'){ t.remaining--; if(t.remaining<=0){t.remaining=0;renderTop();endByTimeout();return;} }
  else if(t.state==='PAUSED_MANUAL'){ S.pausedManualSec++; }
  else if(t.state==='PAUSED_AUTO_CHECK'){ S.pausedAutoSec++; }
  renderTop();
}
function endByTimeout(){ setState('ENDED'); if(S._int)clearInterval(S._int); openResults(true); }
function showVeil(on){ $('#pauseVeil').classList.toggle('hidden',!on); }

/* ---------------- score ---------------- */
function scoreExercise(H,W,N){ var c=(H-W)/N; if(c<0)c=0; if(c>1)c=1; return c; }
function liveScore(){
  var sum=0,cnt=0; for(var k in S.credits){ sum+=S.credits[k]; cnt++; }
  var pct=cnt>0?Math.round(sum/cnt*100):0;
  return {sum:sum,cnt:cnt,pct:pct};
}
function totalAnswerable(){ return S.order.length; }

/* ---------------- reporting + handshake ---------------- */
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  var o=location.origin||'';
  var realSite=o && o!=='null' && o.indexOf('file:')!==0; /* opened directly on file: -> same-origin target */
  var target=realSite?o:'/'; /* never '*' */
  try{
    parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,
      score:Math.round(creditSum),total:answeredCount,percent:percent,passed:percent>=META.passMark},target);
  }catch(e){/* opened directly — nothing to report to */}
}
window.addEventListener('message',function(ev){
  var d=ev.data; if(!d)return;
  if(d.type!=='CYBERPULSE_INIT'&&d.type!=='CYBERMASTERY_INIT')return;
  if(d.username)S.username=d.username;
  /* theme is always 'dark' by contract — the file is dark-only, nothing to switch */
});

/* ---------------- views ---------------- */
function showView(v){
  ['introView','examView','reviewView','resultsView'].forEach(function(id){
    $('#'+id).classList.toggle('hidden',id!==v);
  });
  window.scrollTo(0,0);
}

/* ---------------- top bar ---------------- */
function timerStateLabel(){
  var t=S.timer;
  if(t.state==='RUNNING')return {cls:'t-running',html:'<span class="tstate">▶ RUNNING</span>'};
  if(t.state==='PAUSED_MANUAL')return {cls:'t-paused',html:'<span class="tstate">⏸ PAUSED — manual (press Resume)</span>'};
  if(t.state==='PAUSED_AUTO_CHECK')return {cls:'t-paused',html:'<span class="tstate">⏸ PAUSED — reviewing feedback (resumes on Next)</span>'};
  return {cls:'t-ended',html:'<span class="tstate">■ ENDED</span>'};
}
function buildTop(){
  var row=el('div','tb-row');
  row.appendChild(el('span','tb-id',META.objId+' · '+META.objName));
  var sev=el('span','chip sev-badge','◆ '+META.sevName);
  sev.setAttribute('aria-label','Severity '+META.sevName);
  row.appendChild(sev);
  var cnt=el('span','chip','<span class="lbl">Exercise</span> <b id="tbCount">–</b>');
  row.appendChild(cnt);
  var tc=el('span','chip timer-chip','<span class="tval" id="tbTime">–:––</span> <span id="tbState"></span>');
  tc.setAttribute('aria-label','Timer and timer state');
  row.appendChild(tc);
  var sc=el('span','chip score-chip','<span class="lbl">Score</span> <span class="sval" id="tbScore">0.0 / 0</span> <span class="spct" id="tbPct">0%</span>');
  row.appendChild(sc);
  row.appendChild(el('span','spacer'));
  var hb=el('button','btn btn-warn','💡 Hint'); hb.id='tbHint'; hb.setAttribute('aria-label','Show one hint for this exercise (costs 10 percent of its credit)');
  hb.addEventListener('click',onHint); row.appendChild(hb);
  var pb=el('button','btn btn-pause','⏸ Pause'); pb.id='tbPause'; pb.setAttribute('aria-label','Manual pause — hides the exercise and stops the timer');
  pb.addEventListener('click',onPause); row.appendChild(pb);
  var sb=el('button','btn btn-ghost','⚠ Skip'); sb.id='tbSkip'; sb.setAttribute('aria-label','Skip this exercise — move it to the skipped pool');
  sb.addEventListener('click',onSkip); row.appendChild(sb);
  var bar=el('div','pbar','<div class="pbar-track"><div class="pbar-fill" id="pFill"></div></div>');
  $('#topbar').appendChild(row); $('#topbar').appendChild(bar);
}
function renderTop(){
  var tt=timerStateLabel();
  var chip=$('#topbar .timer-chip');
  if(chip){ chip.className='chip timer-chip '+tt.cls; $('#tbTime').textContent=fmtT(S.timer.remaining); $('#tbState').innerHTML=tt.html; }
  var c=$('#tbCount'); if(c)c.textContent=(S.idx+1)+' of '+totalAnswerable();
  var ls=liveScore();
  var s=$('#tbScore'); if(s)s.textContent=ls.sum.toFixed(1)+' / '+ls.cnt;
  var p=$('#tbPct'); if(p)p.textContent=ls.pct+'%';
  var f=$('#pFill'); if(f)f.style.width=Math.round(((S.idx)/Math.max(1,totalAnswerable()))*100)+'%';
  var sk=$('#tbSkip'); if(sk)sk.disabled=(S.timer.state==='ENDED')||!!(S.order[S.idx] in S.credits);
  var hb=$('#tbHint'); if(hb)hb.disabled=!!S.hinted[S.order[S.idx]]||(S.timer.state==='ENDED')||!!(S.order[S.idx] in S.credits);
}

/* ---------------- intro ---------------- */
function renderIntro(){
  var v=$('#introView'); v.innerHTML='';
  var hero=el('div','intro-hero');
  hero.appendChild(el('h1',null,META.objId+' — '+META.sevName+' practice exam'));
  hero.appendChild(el('p','tb-sub','<b>'+META.objId+' — '+META.objName+'</b> · MITRE ATT&CK Enterprise technique · Tactic: Defense Impairment (TA0112) · Platform: IaaS'));
  var facts=el('div','facts');
  function f(lbl,val){var x=el('span','fact','<span>'+lbl+'</span> <b>'+val+'</b>');facts.appendChild(x);}
  f('Exercises in this file:',META.questionCount);
  f('Estimated time:',minLabel(META.estimatedMinutes));
  f('Timer budget:',minLabel(META.timerSeconds));
  f('Pass mark:',META.passMark+'%');
  f('Severity:',META.sevName+' ◆');
  hero.appendChild(facts);
  v.appendChild(hero);

  var c1=el('div','card');
  c1.appendChild(el('h2',null,'<span class="ic">◈</span> What you will learn here'));
  c1.appendChild(el('div',null,EXAM.intro.learn));
  v.appendChild(c1);

  var c2=el('div','card');
  c2.appendChild(el('h2',null,'<span class="ic">◈</span> Keywords covered in this exam'));
  c2.appendChild(el('p','tb-sub','Every keyword below is exercised by the '+META.questionCount+' interactive tasks in this file.'));
  EXAM.intro.keywords.forEach(function(k){
    var t=el('div','kw-theme');
    t.appendChild(el('h3',null,k.theme));
    var ul=el('ul','kw-items');
    k.items.forEach(function(i){ul.appendChild(el('li',null,i));});
    t.appendChild(ul); c2.appendChild(t);
  });
  v.appendChild(c2);

  var c3=el('div','card');
  c3.appendChild(el('h2',null,'<span class="ic">◈</span> How this exam works'));
  c3.appendChild(el('div',null,EXAM.intro.how));
  var start=el('button','btn btn-go','▶ Start the exam');
  start.style.cssText='margin-top:16px;min-width:220px;min-height:48px;font-weight:700;';
  start.setAttribute('aria-label','Start the exam');
  start.addEventListener('click',startExam);
  c3.appendChild(start);
  v.appendChild(c3);
}

/* ---------------- exam flow ---------------- */
function startExam(){
  resetAttempt();
  showView('examView');
  S.idx=0;
  setState('RUNNING');
  startTicker();
  renderEx();
}
function resetAttempt(){
  S.order=shuffle(EXAM.exercises.map(function(e,i){return i;}));
  S.credits={}; S.hinted={}; S.skipped=[]; S.reviewMode=false; S.reportFired=false;
  S.pausedManualSec=0; S.pausedAutoSec=0;
  S.timer.state='RUNNING'; S.timer.prev='RUNNING'; S.timer.remaining=META.timerSeconds;
  if(S._int)clearInterval(S._int);
  $('#exMain').innerHTML='';
}
function retake(){ startExam(); }

function onHint(){
  var id=S.order[S.idx]; if(id==null||S.hinted[id])return;
  var ex=EXAM.exercises[id]; if(!ex)return;
  S.hinted[id]=true; renderTop();
  var hp=$('#hintPanel');
  if(hp){ hp.classList.remove('hidden'); hp.scrollIntoView({block:'nearest'}); return; }
  var p=el('div','syntax-panel','<h4>💡 Hint — costs 10% of this exercise&rsquo;s credit</h4><div>'+ex.hint+'</div>');
  p.id='hintPanel';
  var ans=$('#ansBlock .block-body'); if(ans)ans.parentNode.insertBefore(p,ans.nextSibling);
}
function onPause(){
  var t=S.timer;
  if(t.state==='RUNNING'||t.state==='PAUSED_AUTO_CHECK'){ setState('PAUSED_MANUAL'); showVeil(true); }
  else if(t.state==='PAUSED_MANUAL'){ setState(t.prev==='PAUSED_AUTO_CHECK'?'PAUSED_AUTO_CHECK':'RUNNING'); showVeil(false); }
}
function onSkip(){
  var id=S.order[S.idx]; if(id==null)return;
  if(!(id in S.credits)&&S.skipped.indexOf(id)<0)S.skipped.push(id);
  if(S.idx>=totalAnswerable()-1){ showReview(); if(S.timer.state!=='RUNNING'&&S.timer.state!=='ENDED')setState('RUNNING'); }
  else { S.idx++; if(S.timer.state!=='RUNNING'&&S.timer.state!=='ENDED')setState('RUNNING'); renderEx(); }
}
function onCheck(){
  if(S.timer.state==='RUNNING'){ setState('PAUSED_AUTO_CHECK'); } /* first action: auto-pause */
  var id=S.order[S.idx], ex=EXAM.exercises[id];
  if(id in S.credits)return;
  var g=gradeCurrent(ex);
  var c=scoreExercise(g.H,g.W,g.N);
  if(S.hinted[id])c=Math.max(0,c-0.10);
  S.credits[id]=c;
  renderFeedback(ex,g,c);
  renderTop();
}
function onNext(){
  if(S.timer.state==='PAUSED_AUTO_CHECK')setState('RUNNING');
  if(S.reviewMode){ S.reviewMode=false; showReview(); return; }
  if(S.idx>=totalAnswerable()-1){ showReview(); }
  else { S.idx++; renderEx(); }
}
function onFinalSubmit(){
  if(S.timer.state!=='ENDED')setState('ENDED');
  if(S._int)clearInterval(S._int);
  openResults(false);
}

/* ---------------- exercise rendering ---------------- */
function artefactHtml(a,i){
  return '<div class="artefact"><span class="artefact-head">ARTEFACT '+(i+1)+' — '+a.label+'</span><div class="artefact-body">'+a.html+'</div></div>';
}
function renderEx(){
  var id=S.order[S.idx], ex=EXAM.exercises[id];
  var main=$('#exMain'); main.innerHTML='';
  renderTop();
  var rvTag=S.reviewMode?'<span class="chip" style="border-color:var(--state-skipped);color:var(--state-skipped)">⚠ Reviewing a skipped exercise</span>':'';
  var top=el('div',null,rvTag);
  top.style.marginBottom='12px'; main.appendChild(top);

  /* SCENARIO block */
  var sc=el('section','block block-scenario'); sc.id='scenBlock';
  var head=el('div','block-head','<span class="bh-ic">◈</span> SCENARIO');
  var col=el('button','collapser','▾ Collapse');
  col.setAttribute('aria-label','Collapse or expand the scenario panel');
  head.appendChild(col); sc.appendChild(head);
  var sum=el('div','scen-sum','📌 '+ex.summary);
  sc.appendChild(sum);
  var body=el('div','block-body scenario');
  var html='';
  (ex.scenario||[]).forEach(function(p){html+='<p>'+p+'</p>';});
  if(ex.viewer){ html+=viewerHtml(ex.viewer); }
  (ex.artefacts||[]).forEach(function(a,i){ html+=artefactHtml(a,i); });
  body.innerHTML=html;
  sc.appendChild(body);
  main.appendChild(sc);
  wireViewer(body);
  col.addEventListener('click',function(){
    var open=body.style.display!=='none';
    body.style.display=open?'none':'block';
    sum.style.display=open?'block':'none';
    col.textContent=open?'▸ Expand':'▾ Collapse';
  });

  /* QUESTION block */
  var qb=el('section','block block-question');
  qb.appendChild(el('div','block-head','<span class="bh-ic">◈</span> QUESTION'));
  qb.appendChild(el('div','block-body',ex.question));
  main.appendChild(qb);

  /* YOUR ANSWER block */
  var ab=el('section','block block-answer'); ab.id='ansBlock';
  ab.appendChild(el('div','block-head','<span class="bh-ic">◈</span> YOUR ANSWER'));
  var abody=el('div','block-body'); abody.id='ansBody'; ab.appendChild(abody);
  main.appendChild(ab);

  buildWidget(ex,abody);

  /* nav */
  var nav=el('div','exnav'); nav.id='exNav';
  var chk=el('button','btn btn-go','✓ Check'); chk.id='btnCheck';
  chk.setAttribute('aria-label','Check this exercise — the timer pauses for unlimited feedback review');
  chk.addEventListener('click',onCheck); nav.appendChild(chk);
  if(ex.type==='branch'){ chk.disabled=true; } /* multi-step: Check unlocks only after the last step is answered */
  nav.appendChild(el('span','spacer'));
  var nx=el('button','btn btn-primary hidden','Next ▶'); nx.id='btnNext';
  nx.setAttribute('aria-label','Next exercise — the timer resumes');
  nx.addEventListener('click',onNext); nav.appendChild(nx);
  var fin=el('button','btn btn-primary hidden','⏹ Final Submit'); fin.id='btnFinal';
  fin.setAttribute('aria-label','Finish the exam and open the results screen');
  fin.addEventListener('click',onFinalSubmit); nav.appendChild(fin);
  main.appendChild(nav);
  var fn=el('p','footer-note','Press Check to submit and see feedback. The timer pauses automatically while you read the feedback and resumes only when you press Next.');
  main.appendChild(fn);
}

/* ---------------- widget builders ---------------- */
var WIDGETS={};
function buildWidget(ex,host){
  var w=WIDGETS[ex.type];
  if(!w){ host.innerHTML='<p class="fbitem st-bad">Unknown exercise type.</p>'; return; }
  var inst=w.build(ex,host);
  host._grade=inst.grade;
}
/* --- option buttons shared by qcm / multi --- */
function optButton(o,idx,multi){
  var b=el('button','opt','<span class="ol">'+String.fromCharCode(65+idx)+'.</span><span class="ot">'+o.t+'</span>');
  b.type='button'; b._sel=false; b._o=o; b._idx=idx;
  b.setAttribute('aria-pressed','false');
  b.addEventListener('click',function(){
    if(b.disabled)return;
    if(multi){ b._sel=!b._sel; b.classList.toggle('sel',b._sel); b.setAttribute('aria-pressed',b._sel?'true':'false'); }
    else {
      var host=b.parentNode;
      Array.prototype.forEach.call(host.children,function(c){c._sel=false;c.classList.remove('sel');c.setAttribute('aria-pressed','false');});
      b._sel=true; b.classList.add('sel'); b.setAttribute('aria-pressed','true');
    }
  });
  return b;
}
function lockOptions(host){
  Array.prototype.forEach.call(host.querySelectorAll('button.opt'),function(b){b.disabled=true;});
}
function optGrade(items){
  /* items: [{o, sel}] -> partial credit over correct options */
  var N=0,H=0,W=0,out=[];
  items.forEach(function(it){
    if(it.o.correct)N++;
    if(it.o.correct&&it.sel)H++;
    if(!it.o.correct&&it.sel)W++;
  });
  items.forEach(function(it){
    if(it.o.correct&&it.sel)out.push({t:it.plain,st:'ok',why:it.o.why||'Part of the correct answer.'});
    else if(!it.o.correct&&it.sel)out.push({t:it.plain,st:'bad',why:it.o.why||'Not part of the correct answer.'});
    else if(it.o.correct&&!it.sel)out.push({t:it.plain,st:'miss',why:it.o.why||'You missed this correct item.'});
  });
  if(N===0)N=1;
  return {H:H,W:W,N:N,items:out};
}
function plainOf(o){ var d=el('div',null,o.t); return d.textContent.replace(/\s+/g,' ').trim(); }

WIDGETS.qcm={build:function(ex,host){
  var box=el('div','opts');
  shuffle(ex.options.map(function(o,i){return {o:o,i:i};})).forEach(function(p){
    box.appendChild(optButton(p.o,p.i,false));
  });
  host.appendChild(box);
  var hint=el('p','dnd-hint','Choose one answer, then press Check.');
  host.appendChild(hint);
  return {grade:function(){
    var sel=null;
    Array.prototype.forEach.call(box.children,function(b){ if(b._sel)sel=b; });
    lockOptions(box);
    var correct=ex.options.filter(function(o){return o.correct;})[0];
    var ok=sel&&sel._o.correct;
    var items=[{t:'Correct answer: '+plainOf(correct),st:ok?'ok':'bad',why:correct.why}];
    return {H:ok?1:0,W:(!ok)?1:0,N:1,items:items};
  }};
}};

WIDGETS.multi={build:function(ex,host){
  var box=el('div','opts');
  shuffle(ex.options.map(function(o,i){return {o:o,i:i};})).forEach(function(p){
    box.appendChild(optButton(p.o,p.i,true));
  });
  host.appendChild(box);
  host.appendChild(el('p','dnd-hint',ex.multiNote||'Select all answers that apply, then press Check.'));
  return {grade:function(){
    var items=[];
    Array.prototype.forEach.call(box.children,function(b){ if(b._o)items.push({o:b._o,sel:b._sel,plain:plainOf(b._o)}); });
    lockOptions(box);
    return optGrade(items);
  }};
}};

WIDGETS.match={build:function(ex,host){
  var rights=shuffle(ex.rights.map(function(r,i){return {t:r,i:i};}));
  var wrap=el('div');
  var rows=[];
  ex.lefts.forEach(function(l,li){
    var row=el('div','selrow');
    row.appendChild(el('span','sr-l',l));
    var s=el('select'); s.setAttribute('aria-label','Match: '+l);
    var ph=el('option',null,'— choose —'); ph.value=''; s.appendChild(ph);
    rights.forEach(function(r){ var o=el('option',null,r.t); o.value=String(r.i); s.appendChild(o); });
    s._li=li; row.appendChild(s); wrap.appendChild(row); rows.push(s);

WIDGETS.order={build:function(ex,host){
  var list=el('div','ordr');
  var cur=shuffle(ex.items.map(function(t,i){return {t:t,i:i};}));
  function draw(){
    list.innerHTML='';
    cur.forEach(function(it,pos){
      var row=el('div','ordr-item');
      row.draggable=true; row._pos=pos;
      row.appendChild(el('span','opos',(pos+1)+'.'));
      row.appendChild(el('span','otxt',it.t));
      var btns=el('span','ordr-btns');
      var up=el('button',null,'↑'); up.type='button'; up.setAttribute('aria-label','Move item '+(pos+1)+' up');
      up.addEventListener('click',function(){ if(pos>0){var t=cur[pos-1];cur[pos-1]=cur[pos];cur[pos]=t;draw();} });
      var dn=el('button',null,'↓'); dn.type='button'; dn.setAttribute('aria-label','Move item '+(pos+1)+' down');
      dn.addEventListener('click',function(){ if(pos<cur.length-1){var t=cur[pos+1];cur[pos+1]=cur[pos];cur[pos]=t;draw();} });
      btns.appendChild(up); btns.appendChild(dn); row.appendChild(btns);
      row.addEventListener('dragstart',function(ev){ S._dragRow=pos; try{ev.dataTransfer.setData('text/plain','row');}catch(e){} });
      row.addEventListener('dragover',function(ev){ ev.preventDefault(); });
      row.addEventListener('drop',function(ev){ ev.preventDefault();
        var from=S._dragRow; if(from==null||from===pos)return;
        var m=cur.splice(from,1)[0]; cur.splice(pos,0,m); S._dragRow=null; draw();
      });
      list.appendChild(row);
    });
  }
  draw();
  host.appendChild(list);
  host.appendChild(el('p','dnd-hint','Put the items in the correct order: use ↑ / ↓ or drag the rows, then press Check.'));
  return {grade:function(){
    var H=0,W=0,items=[];
    cur.forEach(function(it,pos){
      var ok=it.i===pos;
      if(ok)H++; else W++;
      items.push({t:'Position '+(pos+1)+': '+it.t,st:ok?'ok':'bad',why:ok?'Correct position.':'Expected here: '+ex.items[pos]});
    });
    ex.items.forEach(function(t,pos){
      if(cur[pos].i!==pos){ /* already covered by position rows */ }
    });
    return {H:H,W:W,N:ex.items.length,items:items};
  }};
}};

WIDGETS.drag={build:function(ex,host){
  var wrap=el('div','dnd-wrap');
  var bank=el('div','dnd-bank','<h4 style="margin:0 0 6px;font-size:.9em;color:var(--text-secondary)">Item bank</h4>');
  var zones=el('div','dnd-zones');
  var buckets=[];
  ex.buckets.forEach(function(b,bi){
    var z=el('div','dnd-bucket','<h4>⬛ '+b+'</h4>');
    z._bi=bi; zones.appendChild(z); buckets.push(z);
  });
  var picked=null;
  function unassign(it){ if(it._bi!=null){ buckets[it._bi].removeChild(it); it._bi=null; bank.appendChild(it); it.classList.remove('picked'); var a=it.querySelector('.asg'); if(a)a.remove(); } }
  function assign(it,bi){ unassign(it); it._bi=bi; buckets[bi].appendChild(it); it.appendChild(el('span','asg','→ '+ex.buckets[bi])); }
  ex.items.forEach(function(t){
    var it=el('div','dnd-item',t);
    it._bi=null; it._t=t; it.tabIndex=0; it.setAttribute('role','button');
    it.setAttribute('aria-label','Draggable item: '+t+'. Click to pick, then click a zone.');
    function pick(){ if(picked===it){picked.classList.remove('picked');picked=null;return;} if(picked)picked.classList.remove('picked'); picked=it; it.classList.add('picked'); }
    it.addEventListener('click',function(){ if(!it.disabled)pick(); });
    it.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pick();} });
    it.addEventListener('pointerdown',function(ev){
      if(it.disabled)return;
      it.classList.add('dragging'); pick();
      function move(e){
        buckets.forEach(function(z){ z.classList.toggle('over',pointIn(e,z)); });
      }
      function up(e){
        document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
        it.classList.remove('dragging');
        var zi=-1; buckets.forEach(function(z,i){ if(pointIn(e,z))zi=i; });
        buckets.forEach(function(z){ z.classList.remove('over'); });
        if(zi>=0)assign(it,zi);
      }
      document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
    });
    bank.appendChild(it);
  });
  function pointIn(ev,node){ var r=node.getBoundingClientRect(); return ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom; }
  buckets.forEach(function(z){
    z.addEventListener('click',function(){ if(picked){ assign(picked,z._bi); picked.classList.remove('picked'); picked=null; } });
  });
  wrap.appendChild(bank); wrap.appendChild(zones); host.appendChild(wrap);
  host.appendChild(el('p','dnd-hint','Drag each item into the right zone — or click the item, then click the zone. Click an item again to return it to the bank.'));
  return {grade:function(){
    var H=0,W=0,M=0,items=[];
    Array.prototype.forEach.call(bank.querySelectorAll('.dnd-item'),function(it){
      if(it._bi==null){ items.push({t:it._t,st:'miss',why:'Left in the bank. Belongs to: '+ex.buckets[ex.assign[ex.items.indexOf(it._t)]]}); M++; }
    });
    buckets.forEach(function(z,bi){
      Array.prototype.forEach.call(z.querySelectorAll('.dnd-item'),function(it){
        var ok=ex.assign[ex.items.indexOf(it._t)]===bi;
        if(ok)H++; else W++;
        items.push({t:it._t,st:ok?'ok':'bad',why:ok?'Correct zone.':'Placed in “'+ex.buckets[bi]+'”. Belongs in “'+ex.buckets[ex.assign[ex.items.indexOf(it._t)]]+'”.'});
      });
    });
    Array.prototype.forEach.call(bank.querySelectorAll('.dnd-item'),function(it){it.disabled=true;});
    return {H:H,W:W,N:ex.items.length,items:items};
  }};
}};

WIDGETS.terminal={build:function(ex,host){
  if(ex.timerNote){ var tn=el('div','timer-note','⏱ '+ex.timerNote); host.appendChild(tn); }
  if(ex.syntaxPanel){
    var sp=el('div','syntax-panel','<h4>Syntax reminder</h4>'+ex.syntaxPanel);
    host.appendChild(sp);
  }
  var term=el('div','term');
  term.innerHTML='<div class="term-head"><span class="term-dot"></span><span>'+ (ex.termTitle||'audit shell — simulation only, nothing is really executed') +'</span></div>'+
    '<div class="term-scroll"><div class="term-line lm">'+(ex.shellIntro||'Type your command and press Enter.')+'</div></div>';
  var inrow=el('div','term-in');
  inrow.innerHTML='<span class="pr">'+ex.prompt+'</span>';
  var inp=el('input'); inp.type='text'; inp.setAttribute('aria-label','Terminal input'); inp.autocomplete='off'; inp.spellcheck=false;
  inrow.appendChild(inp); term.appendChild(inrow);
  host.appendChild(term);
  var scroll=term.querySelector('.term-scroll');
  var lastCmd='';
  function norm(c){ return c.replace(/\s+/g,' ').trim(); }
  function run(){
    var v=inp.value; if(!v.trim())return;
    lastCmd=norm(v);
    var line=el('div','term-line'); line.innerHTML='<span class="lm">'+ex.prompt+'</span> '+lastCmd.replace(/</g,'&lt;');
    scroll.appendChild(line);
    var out;
    if(ex.simMatch&&new RegExp(ex.simMatch,'i').test(lastCmd.toLowerCase())) out=ex.simLines;
    else out=['zsh: only read-only audit commands are available in this simulator.'];
    out.forEach(function(o){ scroll.appendChild(el('div','term-line lm',o)); });
    scroll.scrollTop=scroll.scrollHeight;
    inp.value='';
  }
  inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter')run(); });
  var runBtn=el('button','btn','Run ▸'); runBtn.type='button';
  runBtn.style.minHeight='44px'; runBtn.addEventListener('click',run);
  inrow.appendChild(runBtn);
  host.appendChild(el('p','dnd-hint','Run the command you judge correct, then press Check. Your last command is graded.'));
  return {grade:function(){
    inp.disabled=true; runBtn.disabled=true;
    var cmd=(lastCmd||'').toLowerCase().replace(/\s+/g,' ').trim();
    var items=[],dangerHit=null;
    (ex.dangerous||[]).forEach(function(d){ if(new RegExp(d.re,'i').test(cmd))dangerHit=d; });
    var H=0,W=0;
    if(!cmd){ return {H:0,W:0,N:ex.required.length,items:[{t:'No command was run',st:'bad',why:'Type a command in the shell, then press Check.'}],danger:null}; }
    ex.required.forEach(function(r){
      if(new RegExp(r.re,'i').test(cmd)){ H++; items.push({t:'✓ element — '+r.label,st:'ok',why:'Present in your command.'}); }
      else { items.push({t:'○ element — '+r.label,st:'miss',why:'Missing from your command.'}); }
    });
    (ex.wrong||[]).forEach(function(w){
      if(new RegExp(w.re,'i').test(cmd)){ W++; items.push({t:'✗ element — '+w.label,st:'bad',why:w.why||'This element does not belong here.'}); }
    });
    if(dangerHit){ items.unshift({t:'✗ DANGEROUS — NEAR MISS: '+dangerHit.label,st:'bad',why:dangerHit.why}); }
    return {H:H,W:W,N:ex.required.length,items:items,danger:dangerHit};
  }};
}};

  hero.appendChild(el('div','res-big '+(passed?'':''),percent+'%'));
  hero.appendChild(el('p','res-line','✓ '+(passed?'PASS':'✗ FAIL')+' — pass mark is '+META.passMark+'%. Score computed only over answered exercises ('+answered+' of '+S.order.length+').'));
  if(S.username)hero.appendChild(el('p','res-line','Candidate: '+S.username));
  if(timeout)hero.appendChild(el('p','res-line','⏱ The timer ran out. Exercises never answered were excluded from the score.'));
  v.appendChild(hero);
  var grid=el('div','res-grid');
  function cell(cls,n,lbl){ grid.appendChild(el('div','res-cell '+cls,'<div class="rn">'+n+'</div><div class="rl">'+lbl+'</div>')); }
  cell('c-ok',full,'✓ Fully correct');
  cell('c-part',part,'✓ Partially correct'+(part>0?' · avg '+(partSum/part).toFixed(2):''));
  cell('c-bad',bad,'✗ Fully incorrect');
  cell('c-skip',skipped,'⚠ Skipped — excluded');
  v.appendChild(grid);
  var tg=el('div','time-grid');
  function tcell(l,val){ tg.appendChild(el('div','time-cell',l+' <b>'+val+'</b>')); }
  tcell('Time left on the clock:',fmtT(S.timer.remaining));
  tcell('Time paused manually:',fmtT(S.pausedManualSec));
  tcell('Time paused for feedback review:',fmtT(S.pausedAutoSec));
  v.appendChild(tg);
  var ret=el('button','btn btn-go','↻ Retake Exam');
  ret.style.cssText='margin-top:18px;min-width:220px;min-height:48px;font-weight:700;';
  ret.setAttribute('aria-label','Retake the exam — questions and answers are reshuffled');
  ret.addEventListener('click',retake);
  v.appendChild(ret);
  v.appendChild(el('p','footer-note',passed?'✓ PASS — your result was reported to the site (once for this attempt).':'✗ FAIL — retake the exam. On retake, the exercise order and answer choices are shuffled again.'));
  showView('resultsView');
  if(!S.reportFired){ S.reportFired=true; reportScore(sum,answered); }
}

/* ---------------- init ---------------- */
document.body.classList.add('sev-'+META.sevKey);
$('#veilResume').addEventListener('click',onPause);
buildTop();
renderIntro();
showView('introView');

</script>
