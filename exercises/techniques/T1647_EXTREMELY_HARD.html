    host.innerHTML = triageHtml(ex); bindTriage(ex);
  }
  function bindTriage(ex) {
    var host = $("ansArea");
    host.querySelectorAll(".opt").forEach(function (b) {
      b.addEventListener("click", function () {
        var st = EX_STATE[ex.id];
        if (st.checked) return;
        var a = parseInt(b.getAttribute("data-a"), 10);
        st.picks[a] = parseInt(b.getAttribute("data-oi"), 10);
        redrawTriage(ex);
      });
    });
  }

  /* ---------- grading ---------- */
  /* Single reusable partial-credit scoring function (spec STEP 5).
     selectedItems / correctItems are arrays of item keys; a selected key that
     is not a correct key counts as a wrong pick. Returns a real in [0, 1]. */
  function scoreExercise(selectedItems, correctItems) {
    var N = correctItems.length, H = 0, W = 0, i, k;
    var picked = [];
    for (i = 0; i < selectedItems.length; i++) {
      if (selectedItems[i] === undefined || selectedItems[i] === null) continue;
      var dup = false;
      for (k = 0; k < picked.length; k++) { if (picked[k] === String(selectedItems[i])) { dup = true; break; } }
      if (!dup) picked.push(String(selectedItems[i]));
    }
    for (i = 0; i < picked.length; i++) {
      var inCorrect = false;
      for (k = 0; k < N; k++) { if (String(correctItems[k]) === picked[i]) { inCorrect = true; break; } }
      if (inCorrect) H++; else W++;
    }
    return Math.max(0, (H - W) / N);
  }
  function grade(ex) {
    var st = EX_STATE[ex.id];
    var g = { credit: 0, H: 0, W: 0, N: 1, items: [], label: "INCORRECT", extra: "" };
    var i, k;
    if (ex.type === "mcq") {
      g.N = 1;
      var pick = st.sel && st.sel.length ? st.sel[0] : undefined;
      if (pick === ex.answer) { g.H = 1; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 you picked the right answer." }); }
      else if (pick === undefined) { g.items.push({ s: "miss", t: "\u25CB Missed \u2014 no answer given." }); }
      else { g.W = 1; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 correct answer: " + ex.options[ex.answer].t }); }
    } else if (ex.type === "multi" || (ex.type === "log" && ex.sub.type === "multi")) {
      var opts = ex.type === "log" ? ex.sub.options : ex.options;
      var sel = ex.type === "log" ? st.sel : st.sel;
      g.N = 0;
      for (i = 0; i < opts.length; i++) {
        if (opts[i].correct) {
          g.N++;
          if (sel && sel.indexOf(i) >= 0) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 " + opts[i].t + " " + (opts[i].why ? "\u2014 " + opts[i].why : "") }); }
          else g.items.push({ s: "miss", t: "\u25CB Missed \u2014 " + opts[i].t + " " + (opts[i].why ? "\u2014 " + opts[i].why : "") });
        }
      }
      for (i = 0; i < opts.length; i++) {
        if (!opts[i].correct && sel && sel.indexOf(i) >= 0) { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 " + opts[i].t + " " + (opts[i].why ? "\u2014 " + opts[i].why : "") }); }
      }
    } else if (ex.type === "match") {
      g.N = ex.left.length;
      for (i = 0; i < ex.left.length; i++) {
        if (st.asg[i] === undefined) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 " + ex.left[i].t + " was not paired." });
        else if (st.asg[i] === i) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 " + ex.left[i].t + " \u2192 " + ex.right[i].t }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 " + ex.left[i].t + " pairs with \u201C" + ex.right[i].t + "\u201D, not \u201C" + ex.right[st.asg[i]].t + "\u201D." }); }
      }
    } else if (ex.type === "dnd") {
      g.N = ex.slots.length;
      for (i = 0; i < ex.slots.length; i++) {
        var occupant = null;
        for (k in st.placed) { if (st.placed[k] === i) occupant = parseInt(k, 10); }
        if (occupant === null) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 target \u201C" + ex.slots[i].label + "\u201D was left empty; it accepts " + ex.items[ex.slots[i].accept].t + "." });
        else if (occupant === ex.slots[i].accept) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 " + ex.items[occupant].t + " \u2192 " + ex.slots[i].label }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 " + ex.items[occupant].t + " does not belong on \u201C" + ex.slots[i].label + "\u201D; the right item is " + ex.items[ex.slots[i].accept].t + "." }); }
      }
    } else if (ex.type === "fill") {
      var blanks = [];
      for (i = 0; i < ex.segments.length; i++) if (typeof ex.segments[i] !== "string") blanks.push(ex.segments[i].blank);
      g.N = blanks.length;
      for (i = 0; i < blanks.length; i++) {
        var v = st.vals ? (st.vals[i] || "") : "";
        if (!v.trim()) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 blank " + (i + 1) + " (" + blanks[i].label + ") left empty; accepted: " + blanks[i].accept.join(" / ") + "." });
        else if (blanks[i].accept.map(norm).indexOf(norm(v)) >= 0) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 blank " + (i + 1) + " (" + blanks[i].label + "): " + v }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 blank " + (i + 1) + " (" + blanks[i].label + "): you typed \u201C" + v + "\u201D; accepted: " + blanks[i].accept.join(" / ") + "." }); }
      }
    } else if (ex.type === "order") {
      g.N = ex.items.length;
      for (i = 0; i < st.list.length; i++) {
        if (st.list[i] === i) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 position " + (i + 1) + ": " + ex.items[i].t }); }
        else g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 position " + (i + 1) + " should be: " + ex.items[i].t + " (you placed " + ex.items[st.list[i]].t + ")" });
      }
    } else if (ex.type === "terminal") {
      var cmd = st.cmd || "";
      var n = norm(cmd);
      g.N = ex.elements.length;
      if (!cmd.trim()) {
        for (i = 0; i < ex.elements.length; i++) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 " + ex.elements[i].label + " (no command entered)" });
      } else {
        for (i = 0; i < ex.elements.length; i++) {
          var el = ex.elements[i], hit = false;
          for (k = 0; k < el.any.length; k++) { if (n.indexOf(norm(el.any[k])) >= 0) { hit = true; break; } }
          if (hit) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct element \u2014 " + el.label }); }
          else g.items.push({ s: "miss", t: "\u25CB Missing element \u2014 " + el.label });
        }
      }
      if (ex.danger) {
        var dHit = false;
        for (i = 0; i < ex.danger.length; i++) {
          var ds = ex.danger[i].any;
          for (k = 0; k < ds.length; k++) { if (n.indexOf(norm(ds[k])) >= 0) { dHit = true; break; } }
          if (dHit) break;
        }
        if (dHit) g.extra = "\u2717 DANGEROUS \u2014 NEAR MISS: " + ex.dangerNote;
      }
    } else if (ex.type === "branch") {
      g.N = ex.steps.length;
      for (i = 0; i < ex.steps.length; i++) {
        var p2 = st.picks[i];
        if (p2 === undefined) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 step " + (i + 1) + " unanswered; best move: " + ex.steps[i].bestNote });
        else if (ex.steps[i].options[p2].ok) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 step " + (i + 1) + ": " + ex.steps[i].options[p2].t }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 step " + (i + 1) + ": you chose \u201C" + ex.steps[i].options[p2].t + "\u201D; better: " + ex.steps[i].bestNote }); }
      }
    } else if (ex.type === "triage") {
      g.N = ex.alerts.length;
      for (i = 0; i < ex.alerts.length; i++) {
        var p3 = st.picks[i];
        if (p3 === undefined) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 " + ex.alerts[i].name + " not handled; best move: " + ex.alerts[i].bestNote });
        else if (ex.alerts[i].options[p3].ok) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 " + ex.alerts[i].name + ": " + ex.alerts[i].options[p3].t }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 " + ex.alerts[i].name + ": you chose \u201C" + ex.alerts[i].options[p3].t + "\u201D; better: " + ex.alerts[i].bestNote }); }
      }
    } else if (ex.type === "log" && ex.sub.type === "mcq") {
      g.N = 1;
      var pick2 = st.sel && st.sel.length ? st.sel[0] : undefined;
      if (pick2 === ex.sub.answer) { g.H = 1; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 you read the log the right way." }); }
      else if (pick2 === undefined) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 no answer given." });
      else { g.W = 1; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 correct answer: " + ex.sub.options[ex.sub.answer].t }); }
    }
    /* route every exercise (multi-answer and single-answer alike) through the
       one reusable scoring function: H correct picks, W wrong picks, N correct items */
    var selKeys = [], corKeys = [], i3;
    for (i3 = 0; i3 < g.H; i3++) selKeys.push("c" + i3);
    for (i3 = 0; i3 < g.W; i3++) selKeys.push("w" + i3);
    for (i3 = 0; i3 < g.N; i3++) corKeys.push("c" + i3);
    g.credit = scoreExercise(selKeys, corKeys);
    g.label = g.credit >= 1 ? "CORRECT" : (g.credit > 0 ? "PARTIALLY CORRECT" : "INCORRECT");
    return g;
  }

  /* ---------- check / feedback / next ---------- */
  function doCheck(ex) {
    var st = EX_STATE[ex.id];
    if (st.checked) return;
    autoPauseStart(); /* FIRST action: stop the timer before rendering feedback */
    var g = grade(ex);
    st.checked = true;
    var hinted = !!st.hinted;
    var before = g.credit;
    var finalCredit = hinted ? Math.max(0, before - 0.1) : before;
    st.g = g; st.finalCredit = finalCredit; st.hinted = hinted;
    S.answers[ex.id] = { credit: finalCredit, ex: ex };
    S.answeredCount += 1;
    S.creditSum += finalCredit;
    renderFeedback(ex, g, finalCredit, hinted, before);
    $("btnCheck").disabled = true;
    $("btnSkip").disabled = true;
    $("btnHint").disabled = true;
    var nb = $("btnNext");
    nb.classList.remove("hidden");
    if (!st.inReview && S.idx === S.order.length - 1) nb.textContent = "Final Submit \u2192";
    disableWidget(ex);
    updateHeader();
  }
  function renderFeedback(ex, g, finalCredit, hinted, before) {
    var host = $("fbHost");
    var cls = g.label === "CORRECT" ? "f-correct" : (g.label === "PARTIALLY CORRECT" ? "f-partial" : "f-incorrect");
    var icon = g.label === "INCORRECT" ? "\u2717" : "\u2713";
    var h = "<div class=\"feedback " + cls + "\"><div class=\"feedback-h\"><span aria-hidden=\"true\">" + icon + "</span> " + g.label;
    if (g.N > 1) h += " <span style=\"font-weight:400\">(credit " + (Math.round(finalCredit * 100) / 100) + " \u2014 " + g.H + "/" + g.N + " items)</span>";
    h += "</div><div class=\"feedback-b\">";
    if (hinted && before > 0) h += "<div class=\"credit-line\" style=\"color:var(--state-partial)\">\u25CB Hint penalty applied: " + before + " \u2192 " + finalCredit + " (credit \u2212 0.10).</div>";
    h += "<div>" + esc(ex.explain) + "</div>";
    if (g.N > 1 || g.label === "INCORRECT") {
      h += "<div class=\"item-rows\">";
      for (var i = 0; i < g.items.length; i++) {
        var it = g.items[i];
        var c = it.s === "ok" ? "ok" : it.s === "bad" ? "bad" : "miss";
        h += "<div class=\"item-row " + c + "\"><span class=\"ic\" aria-hidden=\"true\">" + (it.s === "ok" ? "\u2713" : it.s === "bad" ? "\u2717" : "\u25CB") + "</span><span class=\"itxt\">" + esc(it.t) + "</span></div>";
      }
      h += "</div>";
    }
    if (g.extra) h += "<div class=\"item-row bad\"><span class=\"ic\" aria-hidden=\"true\">\u2717</span><span class=\"itxt\">" + esc(g.extra) + "</span></div>";
    if (ex.type === "terminal") {
      h += "<div class=\"canon\"><div class=\"artefact\"><div class=\"artefact-label\">Canonical command</div><div class=\"artefact-body\"><pre class=\"code\">" + codeHi(ex.canonical) + "</pre></div></div>";
      h += "<div class=\"item-rows\">";
      for (var p = 0; p < ex.parts.length; p++) h += "<div class=\"item-row ok\"><span class=\"ic\" aria-hidden=\"true\">\u2699</span><span class=\"itxt\"><b>" + esc(ex.parts[p].label) + "</b> \u2014 " + esc(ex.parts[p].desc) + "</span></div>";
      h += "</div></div>";
    }
    if (ex.persp) {
      h += "<div class=\"persp\"><div class=\"pcard red\"><div class=\"ph\">\u25B2 ATTACKER PERSPECTIVE</div>" + esc(ex.persp.red) + "</div>" +
        "<div class=\"pcard blue\"><div class=\"ph\">\u25CF DEFENDER PERSPECTIVE</div>" + esc(ex.persp.blue) + "</div></div>";
    }
    if (ex.study) h += "<div class=\"study\">\u25C6 What to study: " + esc(ex.study) + "</div>";
    h += "</div></div>";
    host.innerHTML = h;
  }
  function doNext(ex) {
    var st = EX_STATE[ex.id];
    autoPauseEnd();
    if (st.inReview) { openReview(); return; }
    if (S.idx === S.order.length - 1) {
      var hasOpen = false;
      for (var i = 0; i < S.skipped.length; i++) { if (!S.answers[S.skipped[i]]) { hasOpen = true; break; } }
      if (hasOpen) { openReview(); return; }
      setTimerState("ENDED");
      showResults();
      return;
    }
    advance();
  }
  function skip() {
    var ex = curEx();
    S.skipped.push(ex.id);
    advance();
  }
  function hint() {
    var ex = curEx();
    var st = EX_STATE[ex.id];
    if (st.hinted || st.checked) return;
    st.hinted = true;
    mountHint(ex);
    $("btnHint").disabled = true;
  }
  function mountHint(ex) {
    var st = EX_STATE[ex.id];
    if (!st || !st.hinted || st.checked) return;
    if ($("hintBox")) return;
    var box = document.createElement("div");
    box.className = "hintbox";
    box.id = "hintBox";
    box.innerHTML = "<div class=\"hint-h\"><span aria-hidden=\"true\">\u25CB</span> HINT (\u221210% of this exercise's credit)</div>" + esc(ex.hint);
    var host = $("ansArea");
    if (host) host.insertBefore(box, host.firstChild);
  }
  function manualPause() {
    if (S.timer.state === "ENDED") return;
    if (S.timer.state === "PAUSED_MANUAL") return;
    S.timer._manualPrev = S.timer.state;
    if (S.timer.state === "PAUSED_AUTO_CHECK" && S.timer._autoStart) { S.timer.autoPauseSec += Math.round((Date.now() - S.timer._autoStart) / 1000); S.timer._autoStart = null; }
    S.timer.state = "PAUSED_MANUAL";
    S.timer._manualStart = Date.now();
    setTimerState("PAUSED_MANUAL");
    var m = $("pausemask");
    m.classList.remove("hidden");
    m.innerHTML = "<div class=\"pi\" aria-hidden=\"true\">\u23F8</div><div class=\"pt\">\u23F8 PAUSED \u2014 manual (press Resume)</div><div class=\"ps\">The timer is stopped and the exercise is hidden so you cannot read it while on break. Press Resume to continue where you were.</div><button class=\"btn primary\" id=\"btnResume\" type=\"button\">\u25B6 Resume</button>";
    $("btnResume").addEventListener("click", resumeManual);
  }
  function resumeManual() {
    var m = $("pausemask");
    m.classList.add("hidden");
    if (S.timer._manualStart) { S.timer.manualPauseSec += Math.round((Date.now() - S.timer._manualStart) / 1000); S.timer._manualStart = null; }
    if (S.timer._manualPrev === "PAUSED_AUTO_CHECK") {
      S.timer.state = "PAUSED_AUTO_CHECK";
      S.timer._autoStart = Date.now();
      setTimerState("PAUSED_AUTO_CHECK");
    } else {
      S.timer.state = "RUNNING";
      setTimerState("RUNNING");
    }
  }

  /* ---------- review skipped ---------- */
  function openReview() {
    S.phase = "review";
    autoPauseEnd();
    setTimerState("RUNNING");
    $("exam").classList.add("hidden");
    $("review").classList.remove("hidden");
    var timeUp = S.timer.remaining <= 0 || S.timer.state === "ENDED";
    var h = "<div class=\"card\"><h2 style=\"margin:0 0 6px\"><span aria-hidden=\"true\">\u26A0</span> Review skipped exercises</h2>";
    h += "<p style=\"color:var(--text-secondary)\">These exercises were skipped. You can go back and answer as many times as you want until the timer ends. If you submit now, skipped-and-never-answered exercises are excluded from the score.</p><div class=\"rev-list\">";
    for (var i = 0; i < S.skipped.length; i++) {
      var e = null;
      for (var k = 0; k < S.order.length; k++) { if (DATA.exercises[S.order[k]].id === S.skipped[i]) { e = DATA.exercises[S.order[k]]; break; } }
      var answered = S.answers[e.id] ? true : false;
      h += "<div class=\"rev-row\"><span class=\"tag\">\u26A0 " + (answered ? "Answered" : "Skipped") + "</span><span style=\"flex:1\">" + esc(e.summary) + "</span>" +
        "<button class=\"btn green\" data-review=\"" + S.skipped[i] + "\" type=\"button\"" + (timeUp && !answered ? " disabled" : "") + ">Answer</button></div>";
    }
    h += "</div><div class=\"startrow\"><button class=\"btn primary\" id=\"btnFinalSubmit\" type=\"button\">\u2713 Final Submit \u2192 results</button></div></div>";
    $("review").innerHTML = h;
    $("review").querySelectorAll("button[data-review]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-review");
        var idx = -1;
        for (var k2 = 0; k2 < S.order.length; k2++) { if (DATA.exercises[S.order[k2]].id === id) { idx = k2; break; } }
        S.idx = idx;
        S.phase = "exam";
        $("review").classList.add("hidden");
        $("exam").classList.remove("hidden");
        var ex2 = DATA.exercises[S.order[idx]];
        var already = S.answers[ex2.id] ? true : false;
        S.answers[ex2.id] = undefined;
        S.answeredCount = 0; S.creditSum = 0;
        for (var kk = 0; kk < S.order.length; kk++) {
          var ee = DATA.exercises[S.order[kk]];
          if (S.answers[ee.id]) { S.answeredCount += 1; S.creditSum += S.answers[ee.id].credit; }
        }
        var st = EX_STATE[ex2.id];
        if (already) {
          st.checked = false; delete st.g; delete st.finalCredit;
          if (st.termTimer) { clearInterval(st.termTimer); st.termTimer = null; }
          if (ex2.timeLimit) st.termLeft = ex2.timeLimit;
        }
        renderExercise(ex2, true);
        updateHeader();
        window.scrollTo(0, 0);
      });
    });
    $("btnFinalSubmit").addEventListener("click", function () {
      setTimerState("ENDED");
      showResults();
    });
  }

  /* ---------- results ---------- */
  function showResults() {
    S.phase = "results";
    if (S.timer._manualStart) { S.timer.manualPauseSec += Math.round((Date.now() - S.timer._manualStart) / 1000); S.timer._manualStart = null; }
    if (S.timer._autoStart) { S.timer.autoPauseSec += Math.round((Date.now() - S.timer._autoStart) / 1000); S.timer._autoStart = null; }
    $("exam").classList.add("hidden");
    $("review").classList.add("hidden");
    $("pausemask").classList.add("hidden");
    var answered = [], full = 0, part = 0, zero = 0, partSum = 0;
    for (var k = 0; k < S.order.length; k++) {
      var ex = DATA.exercises[S.order[k]];
      var a = S.answers[ex.id];
      if (a) {
        answered.push(a);
        if (a.credit >= 1) full++;
        else if (a.credit > 0) { part++; partSum += a.credit; }
        else zero++;
      }
    }
    var excluded = S.order.length - answered.length;
    var percent = answered.length > 0 ? Math.round((S.creditSum / answered.length) * 100) : 0;
    var passed = percent >= META.passMark;
    var avgPart = part > 0 ? Math.round((partSum / part) * 100) / 100 : 0;
    var h = "";
    h += "<div class=\"card\" style=\"text-align:center\"><div class=\"bigpct\">" + percent + "%</div>";
    h += "<div style=\"color:var(--text-secondary)\">Total score <b style=\"color:var(--text-primary)\">" + r1(S.creditSum) + " / " + answered.length + "</b> (answered exercises only \u2014 skipped-and-never-answered are excluded) \u2014 pass mark " + META.passMark + "%</div></div>";
    h += "<div class=\"verdict " + (passed ? "pass" : "fail") + "\"><span aria-hidden=\"true\">" + (passed ? "\u2713" : "\u2717") + "</span> " + (passed ? "\u2713 PASS \u2014 certification-style result: well done." : "\u2717 FAIL \u2014 you must retake this exam to reach " + META.passMark + "%.") + "</div>";
    h += "<div class=\"res-grid\">";
    h += "<div class=\"res-cell ok\"><div class=\"rc-h\">\u2713 Fully correct</div><div class=\"rc-v\">" + full + "</div></div>";
    h += "<div class=\"res-cell part\"><div class=\"rc-h\">\u2713 Partially correct (avg " + avgPart + ")</div><div class=\"rc-v\">" + part + "</div></div>";
    h += "<div class=\"res-cell bad\"><div class=\"rc-h\">\u2717 Fully incorrect</div><div class=\"rc-v\">" + zero + "</div></div>";
    h += "<div class=\"res-cell skip\"><div class=\"rc-h\">\u26A0 Skipped \u2014 excluded</div><div class=\"rc-v\">" + excluded + "</div></div>";
    h += "</div>";
    h += "<div class=\"card\"><div class=\"pauselog\">\u23F8 Time paused manually: <b>" + fmtDur(S.timer.manualPauseSec) + "</b> \u2014 \u23F8 Time paused reviewing feedback: <b>" + fmtDur(S.timer.autoPauseSec) + "</b> \u2014 time remaining at submit: <b>" + fmtTime(S.timer.remaining) + "</b></div></div>";
    h += "<div class=\"card\"><div style=\"font-weight:700;margin-bottom:6px\">Per-exercise results</div><div class=\"item-rows\">";
    for (var k2 = 0; k2 < S.order.length; k2++) {
      var ex2 = DATA.exercises[S.order[k2]];
      var a2 = S.answers[ex2.id];
      if (!a2) h += "<div class=\"item-row miss\"><span class=\"ic\" aria-hidden=\"true\">\u26A0</span><span class=\"itxt\">\u26A0 Skipped \u2014 excluded: " + esc(ex2.summary) + "</span></div>";
      else {
        var cls2 = a2.credit >= 1 ? "ok" : (a2.credit > 0 ? "part" : "bad");
        var ic2 = a2.credit >= 1 ? "\u2713" : (a2.credit > 0 ? "\u2713" : "\u2717");
        var col = a2.credit >= 1 ? "var(--state-correct)" : (a2.credit > 0 ? "var(--state-partial)" : "var(--state-incorrect)");
        h += "<div class=\"item-row " + cls2 + "\"><span class=\"ic\" aria-hidden=\"true\" style=\"color:" + col + "\">" + ic2 + "</span><span class=\"itxt\">credit " + (Math.round(a2.credit * 100) / 100) + " \u2014 " + esc(ex2.summary) + "</span></div>";
      }
    }
    h += "</div></div>";
    h += "<div class=\"startrow\" style=\"justify-content:center\"><button class=\"startbtn\" id=\"btnRetake\" type=\"button\">\u21BA Retake Exam</button></div>";
    $("results").innerHTML = h;
    $("results").classList.remove("hidden");
    reportScore(S.creditSum, answered.length, percent, passed);
    $("btnRetake").addEventListener("click", function () {
      S.attempt += 1;
      startExam();
    });
  }
  function reportScore(creditSum, answeredCount, percent, passed) {
    if (S.reportedThisAttempt) return;
    S.reportedThisAttempt = true;
    try {
      parent.postMessage({
        type: "CYBERPULSE_SCORE",
        topicId: META.topicId,
        batch: META.batch,
        score: Math.round(creditSum),
        total: answeredCount,
        percent: percent,
        passed: passed
      }, location.origin);
    } catch (e) { /* opened directly - nothing to report to */ }
  }

  /* ---------- handshake & init ---------- */
  window.addEventListener("message", function (event) {
    if (!event.data) return;
    if (event.data.type !== "CYBERPULSE_INIT" && event.data.type !== "CYBERMASTERY_INIT") return;
    /* consumed: username, country, locale, topicId, batch. theme is always dark; the file is dark-only, no toggle. */
    S.handshake = { username: event.data.username || "", country: event.data.country || "", locale: event.data.locale || "en" };
  });
  function init() {
    var metaEl = document.getElementById("cm-exercise-meta");
    var dataEl = document.getElementById("cm-exam-data");
    META = JSON.parse(metaEl.textContent);
    DATA = JSON.parse(dataEl.textContent);
    S = { phase: "intro", attempt: 1, reportedThisAttempt: false, order: [], creditSum: 0, answeredCount: 0, answers: {}, skipped: [], timer: { remaining: META.timerBudget, state: "RUNNING", manualPauseSec: 0, autoPauseSec: 0 } };
    document.title = META.objectId + " \u2014 " + META.severity + " practice exam";
    renderIntro();
    startTicks();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
