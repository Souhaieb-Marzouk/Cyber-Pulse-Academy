.bigpct { font-size: 42px; font-weight: 800; font-family: var(--mono-stack); }
.pauselog { font-size: 14px; color: var(--text-secondary); }

/* ---------- manual pause overlay ---------- */
.pausemask { position: fixed; inset: 0; z-index: 60; background: var(--tint-page-96); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }

.collapsed .collapsed-summary { display: block; }
.collapsed .artefacts-wrap { display: none; }
.footrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }

}
@media (prefers-reduced-motion: reduce) {

  * { transition: none !important; }
}

<script type="application/json" id="cm-exam-data">{"meta":{"objectId":"T1647","objectLine":"T1647 — Plist File Modification (Enterprise technique, macOS, tactic Defense Impairment)","topicId":"t1647","batch":4,"title":"T1647 Plist File Modification — EXTREMELY HARD","difficulty":"extremely-hard","sevClass":"extreme","questionCount":15,"estimatedMinutes":45,"passMark":70,"severity":"EXTREMELY HARD","timerBudget":2700},"intro":{"learn":"<p>You will learn how attackers bend macOS <b>plist files<\/b> to hide themselves and to persist — and how senior defenders catch them when the signals fight each other.<\/p><p>This is the <b>EXTREMELY HARD<\/b> level for technique <b>T1647 — Plist File Modification<\/b> — a MITRE ATT&amp;CK <b>Technique<\/b> for <b>macOS<\/b>. Here you work like a <b>senior incident responder, senior detection engineer, or CTI lead<\/b>: several artefacts per case, signals that contradict each other, information that is missing on purpose, and decisions that cost real money or real evidence if you call them wrong.<\/p><p>The cases chain <b>three or more concepts<\/b>: plist modification feeding persistence (<b>LaunchAgents, LaunchDaemons, Re-opened Applications<\/b>), hiding (<b>LSUIElement<\/b>, binary conversion), library injection (<b>LSEnvironment<\/b>), detection strategy <b>DET0109<\/b> tuning, and the real procedures of <b>XCSSET (S0658)<\/b> and <b>Cuckoo Stealer (S1153)<\/b>. At least one exercise rewards you for doing <b>nothing yet<\/b> and gathering evidence instead of acting — a senior instinct that juniors rarely trust.<\/p><p>Expect stakeholder pressure in the scenarios: a CISO who wants a decision in ten minutes, a legal team that needs evidence to survive scrutiny, and a playbook best practice that is exactly wrong this one time. There is no timer trick that saves you here — only reasoning.<\/p>","keywords":[{"theme":"Conflicting signals","tags":["process attribution vs identity","EDR verdict vs artefact fact","notarization vs runtime edit"]},{"theme":"Cost-bearing decisions","tags":["isolation vs invoice run","chain of custody vs agent takedown","fleet wipe vs scoped hunt"]},{"theme":"Full technique chains","tags":["T1647","T1543.004 Launch Daemon","T1547.007 Re-opened Applications","T1574.006 Dynamic Linker Hijacking","T1564.003 Hidden Window"]},{"theme":"Detection strategy ownership","tags":["DET0109","AN0306","MonitoredDirectories","SuspiciousKeys","TimeWindow","coverage gaps","compensating detections"]},{"theme":"CTI discipline","tags":["XCSSET (S0658)","Cuckoo Stealer (S1153)","Flashback-era noise","attribution confidence levels","executive reporting"]}],"how":"<ul class=\"howlist\"><li><b>Goal:<\/b> pass with at least <b>70%<\/b>. Several options are defensible somewhere — only one is right <b>in this world<\/b>, and the explanation shows why the others lose.<\/li><li><b>15 exercises<\/b>: two branching incidents, a five-alert executive queue, log chains with noise and missing data, coverage-gap mapping, one timed terminal evidence task, and synthesis questions.<\/li><li><b>Timer:<\/b> <b>45 minutes<\/b>. <b>Check<\/b> stops the timer (⏸ “reviewing feedback”) until <b>Next<\/b>; <b>Pause<\/b> hides everything for a break. The terminal task has its own 90-second clock, announced on screen before it starts.<\/li><li><b>Partial credit:<\/b> (correct − wrong) / total. One hint per exercise (−10%). Skipped exercises can be answered before final submit; unanswered ones are excluded from the score.<\/li><\/ul>"},"exercises":[{"id":"xh01","type":"branch","summary":"CISO case — 03:11 plist write while jdoe is on PTO","scenario":[{"label":"ARTEFACT 1 — Exec summary email (08:47)","text":"From: CISO. 'FIN-07 fired a plist-tampering alert at 03:11. Finance runs invoices from that Mac until Friday. I need your decision in 10 minutes. What do we do, and what do I tell the board?'"},{"label":"ARTEFACT 2 — FIN-07 log excerpt","code":"03:11:58  exec   defaults write com.apple.dock persistent-apps -> /Users/Shared/.upd/CleanIt.app   user: jdoe\n03:12:20  exec   launchctl load /Users/jdoe/Library/LaunchAgents/com.apple.update.agent.plist       user: jdoe\n03:12:41  exec   /Users/Shared/.upd/helper   (parent: launchd)"},{"label":"ARTEFACT 3 — Physical security export","text":"Badge records: jdoe last badged in Monday 17:52. jdoe is on approved PTO since Tuesday. The 03:11 session ran on FIN-07's cached domain credentials."},{"label":"ARTEFACT 4 — Threat intel note (context, read critically)","text":"Intel feed: 'Mass macOS infections reminiscent of the 2012 Flashback era are resurging.' Your estate shows a targeted, single-host, credential-driven pattern — nothing about it is mass infection."}],"question":"Take the CISO through four decisions.","hint":"The badge record constrains what the log's username can mean — but clock or session spoofing still needs a look. Containment has a business price; say it out loud.","explain":"Signal 1 wins: a plist-tampering chain under jdoe's name while jdoe is badge-absent makes account compromise the primary hypothesis, with clock/session anomalies as the secondary line of enquiry — the log is a fact about the session, the badge record is a fact about the human, and the two together mean 'stolen session' until proven otherwise. Containment costs real money (the invoice run stops), so you isolate after preserving volatile evidence and say the price out loud. Incomplete info (was the agent plist planted by login session or something else?) is resolved by comparing against a known-good Mac. The Flashback intel line is era noise — a targeted credential case is not a mass-infection era, and saying so keeps the board briefing honest.","persp":{"red":"Running under a PTO user's cached credentials is deliberate: even if flagged, 'the user did it' is the story the logs tell.","blue":"Two facts in tension (log says jdoe, badge says absent) must be resolved explicitly — that resolution drives containment, comms and scope."},"study":"Conflicting signals: resolve which one wins and why, then accept and declare the business cost of acting.","steps":[{"question":"Step 1 — Which signal wins, and what is your primary hypothesis?","options":[{"t":"Account compromise primary; clock/session anomaly secondary","ok":true,"consequence":"You treat the 03:11 session as hostile until credential review and session telemetry say otherwise."},{"t":"Clock skew on the Mac — no action tonight","ok":false,"consequence":"You dismissed the human fact (badge absence) to keep the log comfortable — a classic shortcut the attacker designed for."},{"t":"jdoe did it remotely via VPN — case closed","ok":false,"consequence":"The badge export contradicts you, and you have no VPN record yet."}],"bestNote":"the session fact is hostile; the badge absence makes account compromise primary and clock anomalies secondary"},{"question":"Step 2 — CISO: 'Can we leave FIN-07 running until invoices finish Friday?' Your containment call (cost is real):","options":[{"t":"Preserve volatile evidence, then isolate now and accept the invoice delay","ok":true,"consequence":"Memory and live agent state are captured, the host is isolated, and finance is told the invoice run slips — the cost is declared, not discovered."},{"t":"Wait until Friday — the alerts look low-grade","ok":false,"consequence":"A live implant with a loaded LaunchAgent keeps running for three days under a stolen session."},{"t":"Reboot FIN-07 tonight to clear memory","ok":false,"consequence":"You wiped volatile evidence and the agent (RunAtLoad) simply returns at next login."}],"bestNote":"capture first, isolate now — and declare the invoice-run cost to the CISO"},{"question":"Step 3 — The agent plist claims Label com.apple.update.agent. Incomplete info: is that Apple's own agent?","options":[{"t":"Diff against a known-good Mac's LaunchAgents and check the binary path","ok":true,"consequence":"No Apple agent lives in the user's ~/Library/LaunchAgents with a binary in /Users/Shared/.upd — the label is masquerading."},{"t":"Trust the label — com.apple.* means Apple signed it","ok":false,"consequence":"Labels are strings anyone writes; trusting one is how masquerading works."},{"t":"Delete the plist and move on","ok":false,"consequence":"You lost the artefact that names the campaign's structure."}],"bestNote":"labels are free text — compare against a known-good host and follow the binary path"},{"question":"Step 4 — The board brief in one line:","options":[{"t":"Confirmed plist-based persistence under a compromised session; contained; scope check underway","ok":true,"consequence":"Facts, action, next step — the brief survives follow-up questions."},{"t":"A 2012-era mass infection has returned","ok":false,"consequence":"You anchored on irrelevant era intel; the estate pattern is targeted."},{"t":"False positive, nothing to report","ok":false,"consequence":"The board hears 'safe' and you own a live implant story in two weeks."}],"bestNote":"state the confirmed behaviours, the containment, and the open scope check — nothing grander"}]},{"id":"xh02","type":"mcq","summary":"The playbook says scan and wait. The agent says KeepAlive.","scenario":[{"label":"ARTEFACT 1 — Recovered agent plist (FIN-07)","code":"<key>ProgramArguments<\/key><array><string>/Users/Shared/.upd/helper<\/string><\/array>\n<key>KeepAlive<\/key><true/>"},{"label":"ARTEFACT 2 — Playbook text","text":"Corporate playbook (widely used across the industry): 'On suspicion of macOS persistence, start a full antivirus scan and wait for the verdict before other response actions.'"}],"question":"Why is the playbook's scan-and-wait wrong for this specific host?","hint":"Read the KeepAlive value, then imagine the 40-minute scan window. What does launchd do the moment the helper dies?","explain":"KeepAlive=true means launchd restarts the helper the instant it exits. During the scan-and-wait window the implant runs, respawns, and can re-tamper plists or kill the scanner. The plist must be unloaded (launchctl bootout) and the binary disabled BEFORE the scan — this is the 'best practice is wrong here' case. The playbook is not bad in general; it is wrong whenever the persistence mechanism self-heals, and this one does.","persp":{"red":"KeepAlive turns every half-hearted cleanup into a restart: responders scan, you respawn, they scan again.","blue":"Sequence matters: bootout the agent, disable the binary, then scan — the reverse order feeds the implant."},"study":"KeepAlive + RunAtLoad agents must be unloaded before scanning or cleanup.","options":[{"t":"KeepAlive respawns the helper during the scan — unload first"},{"t":"AV scanning is deprecated and never useful"},{"t":"Signed helpers cannot be scanned by policy"},{"t":"Waiting is fine — launchd pauses during scans"}],"answer":0},{"id":"xh03","type":"triage","summary":"Executive queue — five alerts, ten minutes, one contradictory pair","scenario":[{"label":"ARTEFACT 1 — Queue snapshot (08:52)","text":"Five alerts. Two of them describe the SAME plist with DIFFERENT writers. The CISO reads your triage at 09:00. Pick the action that a senior would defend for each."},{"label":"ARTEFACT 2 — Alert F (the contradiction)","text":"Detector A: '/Library/LaunchAgents/com.company.cleanup.plist modified by mdm-agent at 11:00, ticket CHG-2211'. Detector B: 'com.company.cleanup.plist written by /usr/bin/defaults run as user svc-print at 11:00:41'. Same file, one minute apart, two writers."}],"question":"Handle all five alerts — one defensible action each.","hint":"When two signals contradict, process attribution (which binary actually wrote) beats label attribution. Never let a ticket vouch for a writer it does not name.","explain":"A: the Dock-path alert on a hidden folder escalates — deception intent is documented T1647 behaviour. B: the contradiction resolves on process attribution — mdm-agent wrote at 11:00:00 and defaults-as-svc-print wrote 41 seconds later; the ticket vouches for the MDM writer only, so the svc-print write is investigated, not waved away. C: an LSUIElement flip on a notarized app after an update is checked against the vendor changelog before any verdict. D: a new LaunchDaemon in /System/Library/LaunchDaemons is root boot-time persistence — escalate immediately. E: dockutil repointing the Dock at 22:00 mirrors XCSSET's documented abuse — escalate and hunt the referenced app fleet-wide.","persp":{"red":"Sliding your write in seconds after a legitimate MDM write is deliberate: detectors that trust tickets more than writers stay blind.","blue":"Writer process + timestamp delta + ticket scope — that trio resolves every 'two writers' contradiction."},"study":"Contradiction protocol: the writer binary wins; tickets vouch only for the writer they name.","alerts":[{"name":"ALERT A — Dock plist now lists /Users/Shared/.upd/CleanIt.app","sev":"HIGH","lines":["02:58:41  exec  defaults write com.apple.dock persistent-apps -> /Users/Shared/.upd/CleanIt.app  user: jdoe (PTO)"],"question":"Hidden-folder app injected into the Dock under a PTO account. Action?","options":[{"t":"Escalate to IR; hunt the app path fleet-wide","ok":true,"consequence":"IR pivots on the path and the defaults command line across EDR — the campaign's footprint gets measured today."},{"t":"Ask jdoe to tidy the Dock after PTO","ok":false,"consequence":"You asked a person who was not at the keyboard; the implant keeps its lure."},{"t":"Remove the Dock tile and close","ok":false,"consequence":"Cosmetic fix; the writer account, the helper and the LaunchAgent remain."}],"bestNote":"escalate and hunt the path — hidden-folder Dock injection is documented T1647 deception"},{"name":"ALERT B — two writers on the same managed plist (contradiction)","sev":"MEDIUM","lines":["11:00:00  write  com.company.cleanup.plist  process: mdm-agent  ticket: CHG-2211","11:00:41  exec   /usr/bin/defaults write com.company.cleanup.plist ...  user: svc-print"],"question":"MDM wrote it (ticketed) and svc-print wrote it 41 seconds later. Which wins?","options":[{"t":"Investigate svc-print's write — the ticket covers only mdm-agent","ok":true,"consequence":"svc-print used cached rights to touch a managed plist: service-account review opens, the MDM change stays valid."},{"t":"Close both — the ticket vouches for the file","ok":false,"consequence":"The ticket vouches for a writer it does not name; the second write vanishes."},{"t":"Close the MDM write, panic-isolate over the second","ok":false,"consequence":"Isolation may be justified eventually, but you skipped who/what/why for svc-print — the brief will collapse."}],"bestNote":"process attribution wins: investigate the writer the ticket does not cover"},{"name":"ALERT C — LSUIElement flip on notarized TaskPad.app after update","sev":"LOW","lines":["09:40:12  write  /Applications/TaskPad.app/Contents/Info.plist  process: installer","09:40:30  exec   spctl --assess /Applications/TaskPad.app  result: accepted, notarized"],"question":"Update installer rewrote Info.plist; app verifies notarized. Action?","options":[{"t":"Check the vendor changelog, pin the new hash, keep a watch","ok":true,"consequence":"If the vendor shipped a background-mode change, the hash pins it; any later unexplained flip alerts."},{"t":"Declare malicious — LSUIElement is always hostile","ok":false,"consequence":"A notarized update becomes an incident; analysts stop trusting your verdicts."},{"t":"Declare clean and remove the alert rule","ok":false,"consequence":"You deleted the exact rule that would catch the real flip next month."}],"bestNote":"verify against the vendor's changelog and pin the hash — proportionate, watchful"},{"name":"ALERT D — new plist in /System/Library/LaunchDaemons","sev":"CRITICAL","lines":["04:12:09  write  /System/Library/LaunchDaemons/com.apple.logd.helper2.plist  writer: unknown (root context)"],"question":"Root boot-time autostart, unknown writer, Apple-looking name. Action?","options":[{"t":"Escalate now — root persistence with masquerading label","ok":true,"consequence":"IR captures the plist and binary, checks SIP status and the true writer path — boot-time root persistence is a board-level event."},{"t":"Wait for the next patch cycle to overwrite it","ok":false,"consequence":"Root implant survives reboots for weeks on your trust in patch cadence."},{"t":"Delete the file with sudo and continue","ok":false,"consequence":"You destroyed the best artefact and likely got alerted by its KeepAlive anyway."}],"bestNote":"escalate immediately — root boot-time persistence with a masquerading label"},{"name":"ALERT E — dockutil repointed the Dock at 22:00 on DL-03","sev":"HIGH","lines":["22:07:44  exec  dockutil --add /Users/Shared/.upd/CleanIt.app --all-homes  user: kim"],"question":"Third-party notarized Dock tool adding a hidden app — XCSSET-style. Action?","options":[{"t":"Escalate and hunt the app + dockutil command line fleet-wide","ok":true,"consequence":"The XCSSET-mirroring procedure gets hunted at scale; the referenced app is captured before it can be renamed."},{"t":"Ignore — dockutil is a legitimate tool","ok":false,"consequence":"Legitimate tooling used at 22:07 to point the Dock into a hidden folder is the technique, not noise."},{"t":"Uninstall dockutil on that Mac only","ok":false,"consequence":"The already-planted app path stays in the Dock plist on every home it touched."}],"bestNote":"escalate and hunt — notarized tooling repurposed against the Dock mirrors S0658 exactly"}]},{"id":"xh04","type":"log","summary":"Eight-line chain — separate the proof from the noise","scenario":[{"label":"ARTEFACT 1 — FIN-07 unified log (03:11–03:14, with estate noise)","code":"03:11:58  exec   defaults write com.apple.dock persistent-apps -> /Users/Shared/.upd/CleanIt.app\n03:12:05  write  /Users/jdoe/Library/Preferences/com.apple.spotlight.plist  process: Spotlight (reindex)\n03:12:20  exec   launchctl load /Users/jdoe/Library/LaunchAgents/com.apple.update.agent.plist\n03:12:41  exec   /Users/Shared/.upd/helper  (parent: launchd)\n03:13:02  exec   plutil -convert binary1 /Users/jdoe/Library/LaunchAgents/com.apple.update.agent.plist\n03:13:40  write  /Library/Preferences/com.apple.TimeMachine.plist  process: backupd\n03:13:55  exec   sqlite3 ~/Library/Application Support/Knowledge/knowledge.db 'UPDATE ...'  (Siri suggestions)\n03:14:10  exec   /Users/Shared/.upd/helper --beacon 10[.]0[.]4[.]31:443   (parent: launchd)"},{"label":"ARTEFACT 2 — AN0306 reminder","text":"The analytic correlates plist modification with subsequent execution that references the altered plist, inside its time window."}],"question":"Select the THREE findings the artefact chain actually proves.","hint":"Spotlight, backupd and the Siri database are estate noise. Ask what each remaining line demonstrates about the technique chain.","explain":"Proven 1: the LaunchAgent plist was modified and the binary it references executed under launchd inside the correlation window — the exact pattern AN0306 exists for. Proven 2: AFTER loading, the agent plist was converted to binary — an anti-review step against quick human inspection. Proven 3: the label com.apple.update.agent masquerades as Apple's own naming while pointing into /Users/Shared/.upd. The Spotlight, backupd and Siri lines are estate noise with no link to the chain. The beacon line is interesting but proves command-and-control behaviour, not the three findings asked here.","persp":{"red":"Load first, convert to binary second: the analytic fires once, but the human reviewer finds a readable file gone.","blue":"Chain analytics on time-ordered events; name the noise in the ticket so nobody re-investigates backupd tomorrow."},"study":"Modification → launch → anti-review conversion → masquerading label: the four-beat T1647 chain.","lines":["03:11:58  exec   defaults write com.apple.dock persistent-apps -> /Users/Shared/.upd/CleanIt.app","03:12:05  write  /Users/jdoe/Library/Preferences/com.apple.spotlight.plist  process: Spotlight (reindex)","03:12:20  exec   launchctl load /Users/jdoe/Library/LaunchAgents/com.apple.update.agent.plist","03:12:41  exec   /Users/Shared/.upd/helper  (parent: launchd)","03:13:02  exec   plutil -convert binary1 /Users/jdoe/Library/LaunchAgents/com.apple.update.agent.plist","03:13:40  write  /Library/Preferences/com.apple.TimeMachine.plist  process: backupd","03:13:55  exec   sqlite3 ~/Library/Application Support/Knowledge/knowledge.db 'UPDATE ...'  (Siri suggestions)","03:14:10  exec   /Users/Shared/.upd/helper --beacon 10[.]0[.]4[.]31:443   (parent: launchd)"],"sub":{"type":"multi","options":[{"t":"The agent plist was modified, then its binary ran under launchd inside the window","correct":true,"why":"03:12:20 → 03:12:41 — the modification-to-execution link the analytic detects"},{"t":"The agent plist was converted to binary after loading","correct":true,"why":"03:13:02 — anti-review hardening of the artefact"},{"t":"The agent label masquerades as Apple naming","correct":true,"why":"com.apple.update.agent in a user folder with a /Users/Shared binary"},{"t":"TimeMachine writes prove data exfiltration","correct":false,"why":"backupd is scheduled estate noise, unrelated to the chain"},{"t":"The Spotlight reindex was attacker-triggered cover","correct":false,"why":"no artefact links the reindex to the adversary — do not invent causality"}]}},{"id":"xh05","type":"mcq","summary":"One quiet conversion on ENG-11 — act or wait","scenario":[{"label":"ARTEFACT 1 — ENG-11 (developer workstation)","text":"Single event, 36 hours of clean telemetry around it: /Applications/NoteSync.app/Contents/Info.plist converted to binary by the user's own session. The app verifies notarized. No persistence keys, no new processes, no hidden folders, no user complaints."},{"label":"ARTEFACT 2 — Stakeholder pressure","text":"The CISO's deputy: 'Just wipe the Mac, it is one developer, zero downtime for me.' IT opened a plugin-update ticket for NoteSync yesterday but nobody has checked its contents yet."}],"question":"What is the senior call?","hint":"One uncorroborated event, a probable change ticket, and a wipe offer that costs evidence. What does the evidence actually support right now?","explain":"Open a low-priority case, capture the plist and signature details, and pull the plugin-update ticket contents — do not isolate, do not wipe, do not declare clean. The event is real but uncorroborated: a developer toolchain converting a plist is plausible, the ticket may explain it, and destroying the artefact now makes any later review impossible. 'Wipe it, zero downtime' is the pressure talking; 'declare clean' is premature with the ticket unread. Evidence-first is the discipline this level tests.","persp":{"red":"Attackers hide behind routine developer noise; seniors neither flinch at single events nor bless them unread.","blue":"Capture, corroborate against change records, decide — in that order, every time."},"study":"Uncorroborated single event + pending change ticket = gather evidence before verdicts.","options":[{"t":"Open a low-priority case; capture artefacts; read the ticket"},{"t":"Approve the wipe — zero downtime, problem gone"},{"t":"Declare the host clean in the daily report"},{"t":"Isolate the Mac until the vendor answers"}],"answer":0},{"id":"xh06","type":"dnd","summary":"Which behaviours does AN0306 actually cover","scenario":[{"label":"ARTEFACT 1 — AN0306 as deployed","code":"File Modification (DC0061): *.plist writes in LaunchAgents, LaunchDaemons, Application Support, Preferences\nProcess Creation (DC0032): defaults, plutil, vim/nano targeting plists\nCommand Execution (DC0064): /usr/bin/defaults write or /usr/bin/plutil runs\nTimeWindow: 300s;  SuspiciousKeys: LSUIElement, LSEnvironment, ProgramArguments"},{"label":"ARTEFACT 2 — Four observed behaviours from other estates (CTI share)","text":"1) defaults write into ~/Library/LaunchAgents. 2) vim editing /Library/LaunchDaemons plist. 3) An encrypted blob written to /Users/Shared/.upd/config.dat and decoded to a plist IN MEMORY, then loaded. 4) plutil -p used merely to READ a plist copied to removable media."}],"question":"Drag each behaviour onto the assessment that fits it.","hint":"The analytic keys on .plist writes and on defaults/plutil/editor processes. A blob named .dat decoded in memory never touches those signatures; reading is not modification.","explain":"Covered twice over: defaults writes into LaunchAgents hit File Modification, Process Creation and Command Execution at once, and vim on a LaunchDaemons plist is exactly the editor coverage AN0306 names. Two gaps: Cuckoo-style in-memory plist assembly (an encrypted .dat blob decoded without ever writing a .plist) needs a compensating detection such as a file-creation analytic on the .upd directory or an API-level hook; and read-only plutil -p on removable media is not modification at all, so media-control or audit analytics must carry it. Knowing your analytic's edges is detection engineering, not paranoia.","persp":{"red":"Never writing a .plist to disk is the cleanest way past a plist-write analytic — in-memory assembly does it.","blue":"Name your gaps and buy compensating detections; an analytic with unspoken edges is a liability."},"study":"Coverage mapping: what the analytic sees, what it cannot see, what compensates.","items":[{"t":"defaults write into ~/Library/LaunchAgents plist"},{"t":"vim editing a /Library/LaunchDaemons plist"},{"t":"Encrypted blob decoded to a plist in memory, never written as .plist"},{"t":"plutil -p reading a plist copied to removable media"}],"slots":[{"label":"Covered — file, process and command components all see it","accept":0},{"label":"Covered — editor targeting of plists is tracked","accept":1},{"label":"Gap — needs a compensating detection (dir watch / API hook)","accept":2},{"label":"Gap — out of modification scope; needs media or audit analytics","accept":3}]},{"id":"xh07","type":"branch","summary":"Legal wants custody, CISO wants a fleet wipe tonight","scenario":[{"label":"ARTEFACT 1 — Situation board","text":"FIN-07 confirmed: T1647-enabled LaunchAgent persistence + Dock deception. Legal: 'Anything you touch must survive a regulator's chain-of-custody review.' CISO: 'Rebuild all 400 Macs tonight, I want it gone.' Finance: 'Quarterly close is tomorrow.'"},{"label":"ARTEFACT 2 — Constraint card","text":"You can run EDR hunts estate-wide in minutes. Golden-image rebuilds take 40 minutes per Mac and burn the night shift. The agent plist and helper binary are the only two artefacts pinned so far."}],"question":"Take the incident through three decisions.","hint":"Legal's constraint prices your first move; the CISO's demand fails one word: scope. Comms must promise what you can prove.","explain":"Decision 1: forensic capture (hash + image the plist, binary, memory) BEFORE unloading the agent — the cost is real (the implant lives ~20 minutes longer), and you accept it deliberately to preserve admissibility. Decision 2: scope first — hunt the plist path, the label and the binary hash across EDR; wiping 400 unscoped Macs burns a night, destroys per-host evidence, and still misses what you did not think to wipe. Decision 3: the 18:00 note promises only what is proven: behaviours, containment, scope numbers, next update. Promising 'all clear' to a board is how incidents become scandals.","persp":{"red":"A panicked fleet-wide rebuild is the attacker's dream: days of noise, zero comparable evidence, and re-infection from the one missed host.","blue":"Capture → scope → targeted rebuild → measured comms. Each step funds the next with facts."},"study":"Chain of custody constrains sequence; scoping constrains spend; comms constrain trust.","steps":[{"question":"Step 1 — Legal's custody requirement is binding. First move on FIN-07?","options":[{"t":"Hash and image plist + binary + memory, then unload the agent","ok":true,"consequence":"Evidence is admissible; the implant lived ~20 minutes extra — a cost you accepted on the record."},{"t":"Unload and delete the agent immediately, capture later","ok":false,"consequence":"Fast, satisfying, and spoliation: the regulator now questions every artefact you kept."},{"t":"Freeze everything until a court order","ok":false,"consequence":"A live root-adjacent implant waits on paperwork while it re-tamper plists nightly."}],"bestNote":"capture before takedown — custody rules price the sequence, and you declare the dwell-time cost"},{"question":"Step 2 — CISO: 'Wipe all 400 tonight.' Your response?","options":[{"t":"Hunt the path/label/hash estate-wide first; rebuild hits only","ok":true,"consequence":"Nine Macs hit, rebuilt before dawn; 391 stay in production with monitoring — scoping did the work."},{"t":"Wipe all 400 tonight as ordered","ok":false,"consequence":"Night shift destroyed, per-host evidence burned, and the one host you misclassified re-seeds the estate."},{"t":"Wipe nothing until the quarterly close ends","ok":false,"consequence":"The close matters, but an unscoped implant gets three quiet days to spread."}],"bestNote":"scope with EDR first, rebuild the hits — 'wipe everything' fails because nothing is measured"},{"question":"Step 3 — The 18:00 all-staff note says:","options":[{"t":"Confirmed plist persistence on FIN-07; contained; 9 of 400 hits; next update 18:00 tomorrow","ok":true,"consequence":"Every number is provable, the cadence is set, and nobody invents rumours in the gap."},{"t":"The incident is fully resolved, nothing further","ok":false,"consequence":"You promised an end you cannot prove; the next finding reads as a cover-up."},{"t":"No comment while investigations continue","ok":false,"consequence":"Silence is a rumour generator; the queue at the CISO's door grows."}],"bestNote":"promise only what is proven, on a stated cadence"}]},{"id":"xh08","type":"fill","summary":"Fill the executive brief with the precise words","scenario":[{"label":"ARTEFACT 1 — Brief skeleton (board version, four gaps)","text":"The board version must be exact: sub-technique-level names, the utility, the masquerade, and the anti-review step. Every gap is a word from this case."},{"label":"ARTEFACT 2 — Case facts (for reference)","text":"defaults wrote the Dock path; LaunchDaemon persistence; label com.apple.update.agent; agent plist converted to binary after loading."}],"question":"Complete the brief using the word bank.","hint":"Blank 1: the autostart type that runs as root at boot. Blank 2: the utility that wrote settings. Blank 3: the masquerade word inside com.apple.___. Blank 4: the format the plist was converted to.","explain":"The brief reads: persistence via a Launch Daemon (root, boot-time — T1543.004), settings written with defaults, a masquerading com.apple.update label, and an anti-review conversion to binary. Boards do not need the XML — they need the right nouns, because those nouns are what auditors and regulators will ask about next.","study":"Executive briefs live or die on precise nouns: Daemon, defaults, update, binary.","segments":["Persistence was achieved via a Launch ",{"blank":{"label":"autostart type (root, boot)","accept":["daemon"]}},", settings were written with the ",{"blank":{"label":"settings utility","accept":["defaults"]}}," utility, the implant masqueraded as com.apple.",{"blank":{"label":"masquerade word","accept":["update"]}},", and the agent plist was converted to ",{"blank":{"label":"anti-review format","accept":["binary"]}}," after loading."],"bank":["Daemon","defaults","update","binary","Agent","XML"]},{"id":"xh09","type":"mcq","summary":"EDR-A says benign, EDR-B says malicious — resolve it","scenario":[{"label":"ARTEFACT 1 — The disagreement","text":"EDR-A verdict: 'Benign — /Applications/TaskPad.app is notarized.' EDR-B verdict: 'Malicious — Info.plist LSUIElement flip detected at runtime on a production app.' Both engines saw the same 09:40 event."},{"label":"ARTEFACT 2 — Your remit","text":"You own the verdict. The CISO wants one line: which engine do we trust?"}],"question":"Which resolution do you defend, and why?","hint":"One engine reasoned about the app's papers, the other about an event on disk. Which one is a fact, and which is context that can be stale?","explain":"EDR-B's observation is a fact: an Info.plist edit flipping LSUIElement happened at runtime. EDR-A's notarization describes the app's shipped papers — context that was true when signed and says nothing about who edited the file afterwards. So the flip is investigated: who wrote it, when, and does a ticket or vendor changelog explain it. 'Trust the signer' and 'trust the alerter' are both shortcuts; the fact drives, the context explains. This is the two-contradicting-signals case, resolved explicitly.","persp":{"red":"Runtime edits to already-notarized apps are attractive precisely because everyone trusts the signature badge.","blue":"Facts (events) drive; context (signatures, tickets) explains. Never let context veto a fact unexamined."},"study":"Runtime artefact facts outrank stale provenance context — investigate, then reconcile.","options":[{"t":"Investigate the flip — the event is fact, notarization is context"},{"t":"EDR-A wins — a valid notarization clears all runtime edits"},{"t":"EDR-B wins — isolate now, questions later"},{"t":"Both engines are broken — disable plist alerting"}],"answer":0},{"id":"xh10","type":"terminal","summary":"Terminal — pin the evidence hash for legal, 90 seconds","scenario":[{"label":"ARTEFACT 1 — Legal's instruction (verbatim)","text":"'Before your tooling touches /Users/Shared/.upd/config.plist one more time, I need a cryptographic fingerprint of that exact file that we can defend in front of a regulator. One command, read-only, right now.'"},{"label":"ARTEFACT 2 — Environment","text":"Live host FIN-07. Stock macOS. The plist is evidence. Any write to it — conversion, edit, move, copy-over — ends its admissibility. A 90-second clock runs on this exercise; announce nothing, just act."}],"question":"Type the single read-only command that pins the file's SHA-256 fingerprint.","hint":"The constraint restated: read-only, the file itself, SHA-256. Do not convert, move, or rewrite anything.","explain":"shasum -a 256 on the file prints its SHA-256 without touching a byte — the defensible fingerprint legal asked for. Anything that rewrites (plutil -convert), moves, or copies over the file destroys admissibility; hashing the file directly is the safe twin of the destructive commands sitting next to it in your muscle memory. This is the 'two plausible commands, one destroys evidence' case: the safe one is correct, and it is also the least aggressive.","persp":{"red":"Responders who 'just quickly convert' the evidence file gift the defence a tampering narrative.","blue":"Hash first, print second, convert never — that order survives regulators."},"study":"shasum -a 256 file = read-only fingerprint. Convert/move/copy-over = spoliation.","host":"responder@FIN-07 evidence","prompt":"responder@FIN-07 ~ %","introLines":["# EVIDENCE: /Users/Shared/.upd/config.plist","# Legal needs the SHA-256 fingerprint. Read-only. Clock running."],"elements":[{"label":"the hashing tool: shasum","any":["shasum"]},{"label":"the algorithm flag: -a 256","any":["-a 256","-a256","256"]},{"label":"the evidence file path","any":["config.plist"]}],"canonical":"shasum -a 256 /Users/Shared/.upd/config.plist","parts":[{"label":"shasum","desc":"stock macOS hashing tool"},{"label":"-a 256","desc":"SHA-256 — the algorithm regulators accept"},{"label":"path","desc":"the evidence plist, read in place"}],"danger":[{"any":["-convert","rm ","mv ","cp ","> "],"note":"that command writes, moves or overwrites the evidence file — legal will call it spoliation."}],"dangerNote":"converting, moving, copying over or redirecting onto the evidence file destroys admissibility.","outputSample":["c41d2f9a7e51b0c8d3a2f6e1b4c9d8a7e6f5c4b3a2918f0e2d3c4b5a6978fed1  /Users/Shared/.upd/config.plist"],"timeLimit":90},{"id":"xh11","type":"multi","summary":"Pick the keys that belong in SuspiciousKeys","scenario":[{"label":"ARTEFACT 1 — Detection council","text":"You own AN0306's SuspiciousKeys element. Council question: which keys indicate evasion-or-persistence INTENT when they CHANGE in unexpected plists? Pick THREE. Every pick shapes 400 analysts' mornings."},{"label":"ARTEFACT 2 — Candidate list","text":"LSUIElement — hides app presence. LSEnvironment — injects env vars / DYLD libraries. ProgramArguments — what an agent runs. CFBundleDisplayName — the label users see. NSHighResolutionCapable — rendering flag. LSHasLocalizedDisplayName — localization flag."}],"question":"Select the THREE keys that belong in SuspiciousKeys.","hint":"Ask per key: does a change to it change what RUNS or what is SEEN? Run-behaviour and hiding are intent; cosmetics and rendering are not.","explain":"In: LSUIElement (hiding), LSEnvironment (injection/persistence), ProgramArguments (what executes). Out: CFBundleDisplayName — XCSSET did abuse display names, but that deception is caught better by the Dock/Dock-plist analytic than by key-change noise; the two localization/rendering flags never change behaviour. The council nuance matters: SuspiciousKeys drives alerts, so cosmetic keys would buy noise, not coverage.","study":"SuspiciousKeys = keys whose change changes behaviour: hide (LSUIElement), inject (LSEnvironment), run (ProgramArguments).","options":[{"t":"LSUIElement","correct":true,"why":"its change hides execution — direct T1647 behaviour"},{"t":"LSEnvironment","correct":true,"why":"its change injects variables/DYLD libraries — persistence path"},{"t":"ProgramArguments","correct":true,"why":"its change alters what an agent executes"},{"t":"CFBundleDisplayName","correct":false,"why":"cosmetic deception — better covered by the Dock analytic than by key-change alerts"},{"t":"NSHighResolutionCapable","correct":false,"why":"rendering flag, no behaviour or visibility impact"}]},{"id":"xh12","type":"log","summary":"The log truncated the binary path — hunt anyway?","scenario":[{"label":"ARTEFACT 1 — FIN-07 log (collector clipped long lines)","code":"03:12:20  exec   launchctl load /Users/jdoe/Library/LaunchAgents/com.apple.update.agent.plist\n03:12:41  exec   /Users/Shared/.upd/he…  (line truncated by collector)\n03:14:10  exec   /Users/Shared/.upd/he… --poll 4  (line truncated by collector)"},{"label":"ARTEFACT 2 — Estate state","text":"The Mac is isolated. The agent plist still exists on the isolated disk. Your EDR hunt runs estate-wide in minutes. The CISO asks whether you can hunt 'right now' with what the log shows."}],"question":"Given the truncated path, what is the sound next step?","hint":"You hold an intact copy of the artefact that NAMES the full path. Read the artefact, not the fragment.","explain":"Recover the full path from the intact plist on the isolated host (plutil -p) and hunt that — hunting the truncated fragment 'he…' would return garbage or, worse, a false comfort when it matches nothing. Assuming the name is 'helper' is a guess dressed as a decision. Incomplete information is normal; the discipline is to go to the artefact that completes it before spending a hunt.","persp":{"red":"Truncated telemetry is free cover: fragments never pivot back to the real binary name.","blue":"The artefact on the isolated disk outranks the clipped log — recover, then hunt with the full string."},"study":"Truncated IOC → recover from the source artefact first; never hunt a fragment you can complete.","lines":["03:12:20  exec   launchctl load /Users/jdoe/Library/LaunchAgents/com.apple.update.agent.plist","03:12:41  exec   /Users/Shared/.upd/he…  (line truncated by collector)","03:14:10  exec   /Users/Shared/.upd/he… --poll 4  (line truncated by collector)"],"sub":{"type":"mcq","options":[{"t":"Recover the full path from the plist on the isolated host, then hunt"},{"t":"Hunt the truncated fragment estate-wide immediately"},{"t":"Assume the binary is named helper and hunt that"},{"t":"Close the hunt — the path is unreadable"}],"answer":0}},{"id":"xh13","type":"order","summary":"Order the takedown sequence under two clocks","scenario":[{"label":"ARTEFACT 1 — The two clocks","text":"Clock 1: the implant re-tampers plists hourly. Clock 2: legal needs custody-grade evidence. Five actions, one order."},{"label":"ARTEFACT 2 — Actions in play","text":"Hash and copy the agent plist and binary. Capture live process and agent state. Unload and disable the LaunchAgent. Quarantine the helper binary. Rebuild the host from the golden image."}],"question":"Order the five actions from first to last.","hint":"Nothing destructive before nothing-capturing. The rebuild is last because it burns the evidence you may still need.","explain":"1: hash and copy the artefacts — fingerprints before anything else changes. 2: capture live process and agent state (launchctl list, process tree) — volatile, dies at reboot. 3: unload and disable the agent — the takedown that stops the hourly re-tampering. 4: quarantine the binary so no process can revive it. 5: rebuild from the golden image — the costly step that also erases the last local evidence, which is why it is last. Every step before the rebuild exists to make the rebuild safe and the story provable.","study":"Fingerprint → volatile state → takedown → quarantine → rebuild. Costliest and most destructive last.","items":[{"t":"Hash and copy the agent plist and helper binary"},{"t":"Capture live process and agent state"},{"t":"Unload and disable the LaunchAgent"},{"t":"Quarantine the helper binary"},{"t":"Rebuild the host from the golden image"}]},{"id":"xh14","type":"mcq","summary":"CTI lead: can we call it XCSSET?","scenario":[{"label":"ARTEFACT 1 — What you actually have","text":"One dockutil command repointing the Dock at a hidden app, one Info.plist LSUIElement flip, one LaunchAgent in ~/Library/LaunchAgents. No code overlap, no infrastructure overlap, no campaign overlap with published XCSSET reporting — just procedure similarity."},{"label":"ARTEFACT 2 — CTI lead's question","text":"'The CISO will ask if it is XCSSET. What do we publish?'"}],"question":"What is the defensible attribution position?","hint":"Procedure similarity is suggestive, not identifying. Tooling is shared; code and infrastructure identify.","explain":"Publish 'XCSSET-like TTPs, attribution unresolved' with the IOCs (dockutil command line, LSUIElement flip, agent label and paths) and keep confidence low. Procedure overlap alone cannot buy attribution — tools and techniques are shared across families, and dockutil abuse is documented for XCSSET but not exclusive to it. Claiming the family on procedure similarity is exactly how CTI teams lose credibility; so is refusing to publish useful IOCs. Name the behaviour, share the pivots, hold the confidence honest.","persp":{"red":"Borrowing another family's signature procedure is cheap misdirection — attribution teams over-anchor on it.","blue":"Publish behaviour + IOCs, mark confidence, let infrastructure and code do the naming."},"study":"TTP overlap suggests; code and infrastructure identify; confidence levels keep you honest.","options":[{"t":"Publish 'XCSSET-like TTPs' with IOCs, confidence low"},{"t":"Attribute to XCSSET — only they use dockutil"},{"t":"Publish nothing until code-level proof exists"},{"t":"Attribute to the Flashback operators of 2012"}],"answer":0},{"id":"xh15","type":"multi","summary":"Board pre-read — select the FOUR true statements","scenario":[{"label":"ARTEFACT 1 — Draft pre-read for the board's security committee","text":"Six statements about T1647 were drafted by two different teams. Exactly FOUR are true. Your sign-off decides which four ship."}],"question":"Select the FOUR statements that are true.","hint":"Two drafts contain platform and taxonomy slips. Check each statement against the ATT&CK page you studied.","explain":"True: T1647 is a macOS technique; plist modification can enable persistence via LaunchAgents, LaunchDaemons and Re-opened Applications; LSUIElement changes hide app execution; the ATT&CK-listed mitigation is M1013 (Apple developer guidance / hardened runtime). False: it does not apply to the Windows Registry (that is a different platform and technique), and it is a technique, not a tactic — Defense Impairment is the tactic. A board pre-read with one wrong platform claim becomes the quote that follows you.","study":"Capstone: platform, enabled behaviours, hiding key, mitigation — the four pillars of T1647.","options":[{"t":"T1647 is a technique that applies to macOS","correct":true,"why":"the ATT&CK header says macOS, Enterprise"},{"t":"Plist modification can enable LaunchAgents, LaunchDaemons and Re-opened Applications persistence","correct":true,"why":"named in the technique description"},{"t":"Setting LSUIElement makes an app run without Dock presence","correct":true,"why":"the description's hiding behaviour"},{"t":"ATT&CK lists M1013 Application Developer Guidance (hardened runtime) for T1647","correct":true,"why":"the single mitigation row on the page"},{"t":"T1647 describes Windows Registry tampering","correct":false,"why":"wrong platform — Registry abuse is a different technique"},{"t":"T1647 is a tactic in the ATT&CK matrix","correct":false,"why":"it is a technique; Defense Impairment is the tactic"}]}]}</script>
<script>
/* ============ CyberPulse exam engine — T1647 ============ */
(function () {
  "use strict";
  var META = null, DATA = null;
  var S = null; /* session state */
  var EX_STATE = {}; /* per-exercise render state */
  var TICK = null;

  /* ---------- utils ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;");
  }
  function escAttr(s) { return esc(s).replace(/'/g, "&#39;"); }
  function shuffle(a) {
    var x = a.slice(), i, j, t;
    for (i = x.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = x[i]; x[i] = x[j]; x[j] = t; }
    return x;
  }
  function fmtTime(s) {
    if (s < 0) s = 0;
    var m = Math.floor(s / 60), r = s % 60;
    return (m < 10 ? "0" + m : "" + m) + ":" + (r < 10 ? "0" + r : "" + r);
  }
  function fmtDur(s) {
    var m = Math.floor(s / 60), r = s % 60;
    if (m === 0) return r + "s";
    return m + "m " + (r < 10 ? "0" + r : r) + "s";
  }
  function r1(x) { return Math.round(x * 10) / 10; }
  function words(s) { return String(s).split(/\s+/).filter(function (w) { return w.length > 0; }).length; }
  function norm(s) {
    return String(s).toLowerCase().replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"')
      .replace(/\s+/g, " ").trim();
  }
  function codeHi(s) {
    var out = esc(s);
    out = out.replace(/(&quot;[^&]*?&quot;)/g, "<span class=\"s\">$1</span>");
    out = out.replace(/(^|\s)(\/[\w.\/~@+-]+)/g, "$1<span class=\"p\">$2</span>");
    out = out.replace(/(^|\s)((?:defaults|plutil|PlistBuddy|dockutil|launchctl|killall|osascript|file|grep|ls|cat|md5|shasum|codesign|spctl|xattr|sqlite3)(?=\s|$))/g, "$1<span class=\"k\">$2</span>");
    return out;
  }

  /* ---------- timer state machine ---------- */
  /* states: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
  function setTimerState(st) {
    S.timer.state = st;
    var el = $("hTState");
    if (st === "RUNNING") { el.textContent = "\u25B6 RUNNING"; el.className = "tstate run"; }
    else if (st === "PAUSED_MANUAL") { el.textContent = "\u23F8 PAUSED \u2014 manual (press Resume)"; el.className = "tstate"; }
    else if (st === "PAUSED_AUTO_CHECK") { el.textContent = "\u23F8 PAUSED \u2014 reviewing feedback (resumes on Next)"; el.className = "tstate"; }
    else { el.textContent = "\u23F9 ENDED"; el.className = "tstate"; }
  }
  function startTicks() {
    if (TICK) clearInterval(TICK);
    TICK = setInterval(function () {
      if (!S || S.phase === "intro" || S.phase === "results") return;
      if (S.timer.state !== "RUNNING") return;
      S.timer.remaining -= 1;
      if (S.timer.remaining <= 0) {
        S.timer.remaining = 0;
        setTimerState("ENDED");
        updateHeader();
        showResults();
        return;
      }
      updateHeader();
    }, 1000);
  }
  function autoPauseStart() {
    if (S.timer.state === "RUNNING") {
      S.timer.state = "PAUSED_AUTO_CHECK";
      S.timer._autoStart = Date.now();
      setTimerState("PAUSED_AUTO_CHECK");
    }
  }
  function autoPauseEnd() {
    if (S.timer.state === "PAUSED_AUTO_CHECK") {
      if (S.timer._autoStart) { S.timer.autoPauseSec += Math.round((Date.now() - S.timer._autoStart) / 1000); S.timer._autoStart = null; }
      S.timer.state = "RUNNING";
      setTimerState("RUNNING");
    }
  }

  /* ---------- header ---------- */
  function updateHeader() {
    $("hTimer").textContent = fmtTime(S.timer.remaining);
    $("hN").textContent = String(Math.min(S.idx + 1, S.order.length));
    $("hScore").textContent = r1(S.creditSum) + " / " + S.answeredCount;
    var pct = S.answeredCount > 0 ? Math.round((S.creditSum / S.answeredCount) * 100) : 0;
    $("hPct").textContent = "(" + pct + "%)";
    $("hProg").style.width = (S.order.length ? Math.round(((S.idx) / S.order.length) * 100) : 0) + "%";
  }
  function buildHeader() {
    var sev = META.severity, cls = "sev-badge sev-" + META.sevClass;
    var sevIcon = sev === "EASY" ? "\u25CF" : sev === "MEDIUM" ? "\u25CF" : sev === "HARD" ? "\u25B2" : "\u25B2";
    $("hdr").innerHTML =
      "<div class=\"cell\"><span class=\"tid\">" + esc(META.topicId.toUpperCase()) + "</span> Exercise <b id=\"hN\">1</b> of " + S.order.length + "</div>" +
      "<div class=\"cell\"><span class=\"" + cls + "\"><span aria-hidden=\"true\">" + sevIcon + "</span> " + esc(sev) + "</span></div>" +
      "<div class=\"cell\"><span id=\"hTState\" class=\"tstate run\">\u25B6 RUNNING</span> <span id=\"hTimer\" class=\"timer\">" + fmtTime(S.timer.remaining) + "</span></div>" +
      "<div class=\"cell\">Score <b id=\"hScore\">0.0 / 0</b> <span id=\"hPct\">(0%)</span></div>" +
      "<div class=\"spacer\"></div>" +
      "<button class=\"btn amber\" id=\"btnHint\" type=\"button\">\u25CB Hint</button>" +
      "<button class=\"btn ghost\" id=\"btnPause\" type=\"button\">\u23F8 Pause</button>" +
      "<button class=\"btn red\" id=\"btnSkip\" type=\"button\">\u26A0 Skip</button>" +
      "<div class=\"progress-track\" style=\"flex-basis:100%\"><div class=\"progress-fill\" id=\"hProg\"></div></div>";
    $("btnHint").addEventListener("click", hint);
    $("btnPause").addEventListener("click", manualPause);
    $("btnSkip").addEventListener("click", skip);
  }

  /* ---------- intro ---------- */
  function renderIntro() {
    var sev = META.severity, cls = "sev-badge sev-" + META.sevClass;
    var sevIcon = sev === "HARD" || sev === "EXTREMELY HARD" ? "\u25B2" : "\u25CF";
    var mins = META.estimatedMinutes;
    var h = "";
    h += "<div class=\"card\">";
    h += "<div class=\"intro-head\"><h1>" + esc(META.objectId) + " \u2014 " + esc(sev) + " practice exam</h1></div>";
    h += "<div style=\"color:var(--text-secondary);font-size:15.5px\">" + esc(META.objectLine) + "</div>";
    h += "<div class=\"meta-chips\">";
    h += "<span class=\"chip2\"><span aria-hidden=\"true\">\u2691</span> Severity: <b>" + esc(sev) + "</b> <span class=\"" + cls + "\"><span aria-hidden=\"true\">" + sevIcon + "</span> " + esc(sev) + "</span></span>";
    h += "<span class=\"chip2\"><span aria-hidden=\"true\">\u2261</span> Exercises in this file: <b>" + DATA.exercises.length + "</b></span>";
    h += "<span class=\"chip2\"><span aria-hidden=\"true\">\u23F1</span> Estimated time: <b>" + mins + " min</b> \u2014 timer budget <b>" + fmtTime(META.timerBudget) + "</b></span>";
    h += "<span class=\"chip2\"><span aria-hidden=\"true\">\u2713</span> Pass mark: <b>" + META.passMark + "%</b></span>";
    h += "</div></div>";

    h += "<h2 class=\"sec\"><span aria-hidden=\"true\">\u25C6</span> What you will learn here</h2>";
    h += "<div class=\"card\">" + DATA.intro.learn + "</div>";

    h += "<h2 class=\"sec\"><span aria-hidden=\"true\">\u25C6</span> Keywords covered in this exam</h2>";
    h += "<div class=\"card\">";
    for (var i = 0; i < DATA.intro.keywords.length; i++) {
      var k = DATA.intro.keywords[i];
      h += "<div class=\"kw-theme\"><div class=\"kw-h\">" + esc(k.theme) + "</div><div class=\"kw-tags\">";
      for (var j = 0; j < k.tags.length; j++) h += "<span class=\"kw-tag\">" + esc(k.tags[j]) + "</span>";
      h += "</div></div>";
    }
    h += "</div>";

    h += "<h2 class=\"sec\"><span aria-hidden=\"true\">\u25C6</span> How this exam works</h2>";
    h += "<div class=\"card\">" + DATA.intro.how;
    h += "<div class=\"startrow\"><button id=\"btnStart\" class=\"startbtn\" type=\"button\">\u25B6 Start the exam</button>";
    h += "<span class=\"mini\" style=\"color:var(--text-secondary);font-size:14px\">Pass mark " + META.passMark + "%. Good luck.</span></div></div>";
    $("intro").innerHTML = h;
    $("btnStart").addEventListener("click", startExam);
  }

  /* ---------- exam start / flow ---------- */
  function startExam() {
    S.phase = "exam";
    S.order = shuffle(DATA.exercises.map(function (o, i) { return i; }));
    S.idx = 0;
    S.answers = {};
    EX_STATE = {};
    S.answeredCount = 0;
    S.creditSum = 0;
    S.skipped = [];
    S.reviewing = null;
    S.hinted = {};
    S.reportedThisAttempt = false;
    S.timer = { remaining: META.timerBudget, state: "RUNNING", manualPauseSec: 0, autoPauseSec: 0, _autoStart: null, _manualStart: null };
    $("intro").classList.add("hidden");
    $("results").classList.add("hidden");
    $("review").classList.add("hidden");
    $("exam").classList.remove("hidden");
    buildHeader();
    setTimerState("RUNNING");
    renderCurrent();
  }
  function curEx() { return DATA.exercises[S.order[S.idx]]; }
  function renderCurrent() {
    var ex = curEx();
    renderExercise(ex, false);
    updateHeader();
    window.scrollTo(0, 0);
  }
  function allDone() { return S.idx >= S.order.length; }
  function advance() {
    S.idx += 1;
    if (allDone()) {
      if (S.skipped.length > 0) openReview();
      else showResults();
    } else renderCurrent();
  }

  /* ---------- scenario / question / answer blocks ---------- */
  function artefactHtml(a) {
    var h = "<div class=\"artefact\"><div class=\"artefact-label\">" + esc(a.label) + "</div><div class=\"artefact-body\">";
    if (a.code !== undefined && a.code !== null) h += "<pre class=\"code\">" + codeHi(a.code) + "</pre>";
    else h += "<div style=\"font-size:15px\">" + esc(a.text) + "</div>";
    h += "</div></div>";
    return h;
  }
  function renderExercise(ex, inReview) {
    var host = $("exercise");
    var st = EX_STATE[ex.id] = EX_STATE[ex.id] || {};
    st.inReview = !!inReview;
    var longScenario = words(ex.scenario.map(function (a) { return a.text || a.code || ""; }).join(" ")) > 110;
    var h = "";
    h += "<div class=\"block block-s\" id=\"blkS\">";
    h += "<div class=\"block-h\"><span class=\"ic\" aria-hidden=\"true\">\u25A3</span> SCENARIO <span style=\"margin-left:auto\"></span>";
    if (longScenario) h += "<button class=\"collapse-btn\" id=\"btnCollapse\" type=\"button\">Collapse scenario</button>";
    h += "</div>";
    if (longScenario) h += "<div class=\"collapsed-summary\">" + esc(ex.summary) + "</div>";
    h += "<div class=\"block-b artefacts-wrap\">";
    for (var i = 0; i < ex.scenario.length; i++) h += artefactHtml(ex.scenario[i]);
    h += "</div></div>";
    h += "<div class=\"block block-q\"><div class=\"block-h\"><span class=\"ic\" aria-hidden=\"true\">\u2753</span> QUESTION</div><div class=\"block-b\"><div class=\"qtext\">" + esc(ex.question) + "</div></div></div>";
    h += "<div class=\"block block-a\"><div class=\"block-h\"><span class=\"ic\" aria-hidden=\"true\">\u270E</span> YOUR ANSWER</div><div class=\"block-b\" id=\"ansArea\"></div></div>";
    h += "<div class=\"footrow\">";
    h += "<div style=\"color:var(--text-secondary);font-size:13.5px\">" + (inReview ? "\u26A0 Skipped exercise \u2014 review mode. Answer it now or return to the list." : (st.hinted ? "\u25CB Hint used on this exercise (\u221210% credit)." : "One hint allowed on this exercise (\u221210% of its credit).")) + "</div>";
    h += "<div style=\"display:flex;gap:10px\">";
    if (!inReview) h += "<button class=\"btn green\" id=\"btnCheck\" type=\"button\">\u2713 Check</button>";
    else h += "<button class=\"btn green\" id=\"btnCheck\" type=\"button\">\u2713 Check</button>";
    h += "<button class=\"btn primary hidden\" id=\"btnNext\" type=\"button\">" + (inReview ? "Next \u2192 back to list" : "Next \u2192") + "</button>";
    h += "</div></div>";
    h += "<div id=\"fbHost\"></div>";
    host.innerHTML = h;
    var ca = $("btnCollapse");
    if (ca) ca.addEventListener("click", function () {
      var blk = $("blkS");
      blk.classList.toggle("collapsed");
      ca.textContent = blk.classList.contains("collapsed") ? "Expand scenario" : "Collapse scenario";
    });
    renderWidget(ex);
    $("btnCheck").addEventListener("click", function () { doCheck(ex); });
    $("btnNext").addEventListener("click", function () { doNext(ex); });
    var hintBtn2 = $("btnHint");
    hintBtn2.disabled = !!(st.hinted || st.checked);
    $("btnSkip").disabled = !!st.checked;
    if (st.checked) { $("btnCheck").disabled = true; disableWidget(ex); }
  }

  /* ---------- widgets ---------- */
  function renderWidget(ex) {
    var host = $("ansArea");
    var st = EX_STATE[ex.id];
    if (ex.type === "mcq") host.innerHTML = optsHtml(ex, false);
    else if (ex.type === "multi") host.innerHTML = optsHtml(ex, true);
    else if (ex.type === "match") host.innerHTML = matchHtml(ex);
    else if (ex.type === "dnd") host.innerHTML = dndHtml(ex);
    else if (ex.type === "fill") host.innerHTML = fillHtml(ex);
    else if (ex.type === "order") host.innerHTML = orderHtml(ex);
    else if (ex.type === "terminal") host.innerHTML = termHtml(ex);
    else if (ex.type === "branch") host.innerHTML = branchHtml(ex);
    else if (ex.type === "triage") host.innerHTML = triageHtml(ex);
    else if (ex.type === "log") host.innerHTML = logHtml(ex);
    bindWidget(ex);
  }
  function optsHtml(ex, isMulti) {
    var st = EX_STATE[ex.id] = EX_STATE[ex.id] || {};
    if (!st.optPerm) {
      st.optPerm = shuffle(ex.options.map(function (o, i) { return i; }));
    }
    var h = "<div class=\"opts\" role=\"" + (isMulti ? "group" : "radiogroup") + "\" aria-label=\"Answer options\">";
    for (var v = 0; v < st.optPerm.length; v++) {
      var oi = st.optPerm[v];
      var o = ex.options[oi];
      var letter = String.fromCharCode(65 + v);
      var sel = st.sel && st.sel.indexOf(oi) >= 0;
      h += "<label class=\"opt" + (sel ? " sel" : "") + "\">" +
        "<input type=\"" + (isMulti ? "checkbox" : "radio") + "\" name=\"opt_" + esc(ex.id) + "\" value=\"" + oi + "\"" + (sel ? " checked" : "") + " data-oi=\"" + oi + "\">" +
        "<span class=\"lbl\">" + letter + ".</span><span class=\"txt\">" + esc(o.t) + "</span></label>";
    }
    h += "</div>";
    if (isMulti) h += "<div style=\"margin-top:9px;font-size:13.5px;color:var(--text-secondary)\">\u2691 Multi-select: several answers may apply. Partial credit per correct item; wrong picks subtract.</div>";
    return h;
  }
  function matchHtml(ex) {
    var st = EX_STATE[ex.id];
    if (!st.rgtPerm) st.rgtPerm = shuffle(ex.right.map(function (o, i) { return i; }));
    if (!st.asg) st.asg = {};
    var h = "<div style=\"font-size:13.5px;color:var(--text-secondary);margin-bottom:9px\">\u2691 Click one item on the left, then its partner on the right. Tap again to change a pairing.</div>";
    h += "<div class=\"match-grid\"><div class=\"match-col\" id=\"mLeft\">";
    for (var i = 0; i < ex.left.length; i++) {
      var L = ex.left[i];
      var tag = st.asg[i] !== undefined ? "<span class=\"pairtag\">\u2194 " + esc(ex.right[st.asg[i]].t) + "</span>" : "";
      h += "<button type=\"button\" class=\"mtile lft" + (st.selL === i ? " sel" : "") + "\" data-l=\"" + i + "\"><span class=\"lbl\">" + (i + 1) + ".</span> " + esc(L.t) + tag + "</button>";
    }
    h += "</div><div class=\"match-col\" id=\"mRight\">";
    for (var r = 0; r < st.rgtPerm.length; r++) {
      var ri = st.rgtPerm[r];
      h += "<button type=\"button\" class=\"mtile rgt" + (st.selL !== undefined && st.asg[st.selL] === ri ? " sel" : "") + "\" data-r=\"" + ri + "\">" + esc(ex.right[ri].t) + "</button>";
    }
    h += "</div></div>";
    return h;
  }
  function dndHtml(ex) {
    var st = EX_STATE[ex.id];
    if (!st.chipPerm) st.chipPerm = shuffle(ex.items.map(function (o, i) { return i; }));
    if (!st.placed) st.placed = {};
    var h = "<div class=\"dnd-area\">";
    h += "<div><div style=\"font-size:13.5px;color:var(--text-secondary);margin-bottom:7px\">\u2691 Drag each item onto a target (or click the item, then click the target). Partial credit per target.</div>";
    h += "<div class=\"bank\" id=\"dndBank\">";
    for (var c = 0; c < st.chipPerm.length; c++) {
      var ii = st.chipPerm[c];
      if (st.placed[ii] === undefined) {
        h += "<span class=\"chip" + (st.selChip === ii ? " sel" : "") + "\" draggable=\"true\" data-ii=\"" + ii + "\" tabindex=\"0\" role=\"button\" aria-label=\"Item " + (ii + 1) + ": " + escAttr(ex.items[ii].t) + "\">" + esc(ex.items[ii].t) + "</span>";
      }
    }
    h += "</div></div><div class=\"slots\" id=\"dndSlots\">";
    for (var s = 0; s < ex.slots.length; s++) {
      var sl = ex.slots[s];
      h += "<div class=\"slot\" data-slot=\"" + s + "\"><div class=\"slot-h\">\u25AB " + esc(sl.label) + "</div>";
      for (var p in st.placed) {
        if (st.placed[p] === s) {
          h += "<div class=\"filled\"><span>" + esc(ex.items[p].t) + "</span><button class=\"rm\" data-rm=\"" + p + "\" type=\"button\" aria-label=\"Remove item\">\u2715</button></div>";
        }
      }
      h += "</div>";
    }
    h += "</div></div>";
    return h;
  }
  function logHtml(ex) {
    var st = EX_STATE[ex.id];
    if (!st.optPerm && ex.sub.type === "mcq") st.optPerm = shuffle(ex.sub.options.map(function (o, i) { return i; }));
    if (!st.optPerm && ex.sub.type === "multi") st.optPerm = shuffle(ex.sub.options.map(function (o, i) { return i; }));
    var h = "<div style=\"font-size:13.5px;color:var(--text-secondary);margin-bottom:7px\">\u2691 Log viewer: type in the filter box to highlight matching lines.</div>";
    h += "<input class=\"logfilter\" id=\"logFilter\" type=\"text\" placeholder=\"filter... e.g. defaults or plist\" aria-label=\"Filter log lines\">";
    h += "<div class=\"artefact logviewer\" id=\"logView\" style=\"max-height:280px;overflow:auto\">";
    h += "<div class=\"artefact-body\">";
    for (var i = 0; i < ex.lines.length; i++) {
      h += "<span class=\"log-line\" data-raw=\"" + escAttr(ex.lines[i]) + "\"><pre class=\"log\">" + codeHi(ex.lines[i]) + "</pre></span>";
    }
    h += "</div></div>";
    h += "<div style=\"margin-top:12px\">";
    if (ex.sub.type === "multi") h += optsHtml({ id: ex.id + "-sub", options: ex.sub.options }, true);
    else h += optsHtml({ id: ex.id + "-sub", options: ex.sub.options }, false);
    h += "</div>";
    return h;
  }
  function bindWidget(ex) {
    var st = EX_STATE[ex.id];
    mountHint(ex); /* keep a revealed hint visible across widget redraws */
    if (st.checked) return;
    var host = $("ansArea");
    if (ex.type === "mcq" || ex.type === "multi") {
      host.querySelectorAll("input").forEach(function (inp) {
        inp.addEventListener("change", function () {
          st.sel = [];
          host.querySelectorAll("input:checked").forEach(function (c) { st.sel.push(parseInt(c.getAttribute("data-oi"), 10)); });
          host.querySelectorAll(".opt").forEach(function (o) {
            var v = o.querySelector("input").getAttribute("data-oi");
            o.classList.toggle("sel", st.sel.indexOf(parseInt(v, 10)) >= 0);
          });
        });
      });
    } else if (ex.type === "match") {
      host.querySelectorAll(".mtile.lft").forEach(function (b) {
        b.addEventListener("click", function () {
          var i = parseInt(b.getAttribute("data-l"), 10);
          st.selL = (st.selL === i) ? undefined : i;
          host.innerHTML = matchHtml(ex); bindWidget(ex);
        });
      });
      host.querySelectorAll(".mtile.rgt").forEach(function (b) {
        b.addEventListener("click", function () {
          if (st.selL === undefined) return;
          var r = parseInt(b.getAttribute("data-r"), 10);
          for (var k in st.asg) { if (st.asg[k] === r) delete st.asg[k]; }
          st.asg[st.selL] = r;
          st.selL = undefined;
          host.innerHTML = matchHtml(ex); bindWidget(ex);
        });
      });
    } else if (ex.type === "dnd") {
      var redraw = function () { host.innerHTML = dndHtml(ex); bindWidget(ex); };
      host.querySelectorAll(".chip").forEach(function (ch) {
        ch.addEventListener("dragstart", function (ev) { st.selChip = parseInt(ch.getAttribute("data-ii"), 10); ev.dataTransfer.setData("text/plain", String(st.selChip)); });
        ch.addEventListener("click", function () { st.selChip = parseInt(ch.getAttribute("data-ii"), 10); redraw(); });
        ch.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); st.selChip = parseInt(ch.getAttribute("data-ii"), 10); redraw(); } });
      });
      host.querySelectorAll(".slot").forEach(function (sl) {
        sl.addEventListener("dragover", function (ev) { ev.preventDefault(); sl.classList.add("over"); });
        sl.addEventListener("dragleave", function () { sl.classList.remove("over"); });
        sl.addEventListener("drop", function (ev) {
          ev.preventDefault(); sl.classList.remove("over");
          var ii = st.selChip !== undefined ? st.selChip : parseInt(ev.dataTransfer.getData("text/plain"), 10);
          if (ii === undefined || isNaN(ii)) return;
          for (var p in st.placed) { if (st.placed[p] === parseInt(sl.getAttribute("data-slot"), 10)) delete st.placed[p]; }
          st.placed[ii] = parseInt(sl.getAttribute("data-slot"), 10);
          st.selChip = undefined; redraw();
        });
        sl.addEventListener("click", function (ev) {
          if (ev.target.classList && ev.target.classList.contains("rm")) return;
          if (st.selChip === undefined) return;
          for (var p in st.placed) { if (st.placed[p] === parseInt(sl.getAttribute("data-slot"), 10)) delete st.placed[p]; }
          st.placed[st.selChip] = parseInt(sl.getAttribute("data-slot"), 10);
          st.selChip = undefined; redraw();
        });
      });
      host.querySelectorAll(".rm").forEach(function (rm) {
        rm.addEventListener("click", function (ev) {
          ev.stopPropagation();
          var p = rm.getAttribute("data-rm");
          delete st.placed[p]; redraw();
        });
      });
    } else if (ex.type === "fill") {
      host.querySelectorAll(".fill-in").forEach(function (inp, bi) {
        inp.addEventListener("input", function () { st.vals = st.vals || {}; st.vals[bi] = inp.value; });
      });
      host.querySelectorAll(".chip[data-word]").forEach(function (ch) {
        ch.addEventListener("click", function () {
          st.vals = st.vals || {};
          var inputs = host.querySelectorAll(".fill-in");
          for (var i = 0; i < inputs.length; i++) {
            if (!inputs[i].value) { inputs[i].value = ch.getAttribute("data-word"); st.vals[i] = inputs[i].value; break; }
          }
        });
      });
    } else if (ex.type === "order") {
      var redraw2 = function () { host.innerHTML = orderHtml(ex); bindWidget(ex); };
      host.querySelectorAll("button[data-up]").forEach(function (b) {
        b.addEventListener("click", function () {
          var i = parseInt(b.getAttribute("data-up"), 10);
          if (i > 0) { var t = st.list[i - 1]; st.list[i - 1] = st.list[i]; st.list[i] = t; redraw2(); }
        });
      });
      host.querySelectorAll("button[data-dn]").forEach(function (b) {
        b.addEventListener("click", function () {
          var i = parseInt(b.getAttribute("data-dn"), 10);
          if (i < st.list.length - 1) { var t = st.list[i + 1]; st.list[i + 1] = st.list[i]; st.list[i] = t; redraw2(); }
        });
      });
    } else if (ex.type === "terminal") {
      var input = $("termIn");
      if (input) input.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") { runTerm(ex, input.value); input.value = ""; }
      });
      var runBtn = $("termRun");
      if (runBtn) runBtn.addEventListener("click", function () { runTerm(ex, input.value); input.value = ""; });
      if (ex.timeLimit && !st.termTimer && !st.checked) {
        st.termLeft = ex.timeLimit;
        st.termTimer = setInterval(function () {
          if (!S || S.timer.state !== "RUNNING") return;
          st.termLeft -= 1;
          var te = $("termLeft");
          if (te) te.textContent = st.termLeft + "s left in this exercise";
          if (st.termLeft <= 0) {
            clearInterval(st.termTimer); st.termTimer = null;
            doCheck(ex);
          }
        }, 1000);
      }
    } else if (ex.type === "branch") {
      redrawBranch(ex);
    } else if (ex.type === "triage") {
      redrawTriage(ex);
    } else if (ex.type === "log") {
      var f = $("logFilter");
      if (f) f.addEventListener("input", function () {
        var q = norm(f.value);
        host.querySelectorAll(".log-line").forEach(function (ln) {
          var raw = ln.getAttribute("data-raw");
          var show = !q || norm(raw).indexOf(q) >= 0;
          ln.style.display = show ? "block" : "none";
          ln.querySelector("pre").innerHTML = show && q ? hiMark(raw, q) : codeHi(raw);
        });
      });
      var subHost = host.querySelector(".opts");
      subHost.querySelectorAll("input").forEach(function (inp) {
        inp.addEventListener("change", function () {
          st.sel = [];
          subHost.querySelectorAll("input:checked").forEach(function (c) { st.sel.push(parseInt(c.getAttribute("data-oi"), 10)); });
          subHost.querySelectorAll(".opt").forEach(function (o) {
            var v = o.querySelector("input").getAttribute("data-oi");
            o.classList.toggle("sel", st.sel.indexOf(parseInt(v, 10)) >= 0);
          });
        });
      });
    }
  }
  function hiMark(raw, q) {
    var e = esc(raw);
    var idx = norm(raw).indexOf(q);
    if (idx < 0) return codeHi(raw);
    var before = raw.slice(0, idx), mid = raw.slice(idx, idx + q.length), after = raw.slice(idx + q.length);
    return codeHi(before) + "<mark>" + esc(mid) + "</mark>" + codeHi(after);
  }
  function disableWidget(ex) {
    var host = $("ansArea");
    host.querySelectorAll("input, button, .chip, .mtile").forEach(function (el) {
      if (el.id === "termRun") return;
      if (!el.classList.contains("rm")) el.disabled = true;
    });
  }


  /* ---------- fill / order / terminal / branch / triage ---------- */
  function fillHtml(ex) {
    var st = EX_STATE[ex.id];
    if (!st.bankPerm) st.bankPerm = shuffle(ex.bank.map(function (w, i) { return i; }));
    var h = "";
    h += "<div class=\"fill-line\">";
    var bi = 0;
    for (var i = 0; i < ex.segments.length; i++) {
      var seg = ex.segments[i];
      if (typeof seg === "string") h += esc(seg);
      else {
        h += "<input class=\"fill-in\" type=\"text\" data-bi=\"" + bi + "\" aria-label=\"Blank " + (bi + 1) + ": " + escAttr(seg.blank.label) + "\" placeholder=\"\u2026\" autocomplete=\"off\" style=\"min-width:" + Math.max(110, seg.blank.label.length * 9) + "px\">";
        bi++;
      }
    }
    h += "</div>";
    h += "<div style=\"margin-top:9px;font-size:13.5px;color:var(--text-secondary)\">\u2691 Type into each blank (or tap a word from the bank below). Spelling and case are forgiven; wrong words are not.</div>";
    h += "<div class=\"bank bankwords\">";
    for (var w = 0; w < st.bankPerm.length; w++) {
      h += "<span class=\"chip\" data-word=\"" + escAttr(ex.bank[st.bankPerm[w]]) + "\" tabindex=\"0\" role=\"button\">" + esc(ex.bank[st.bankPerm[w]]) + "</span>";
    }
    h += "</div>";
    return h;
  }
  function orderHtml(ex) {
    var st = EX_STATE[ex.id];
    if (!st.list) st.list = shuffle(ex.items.map(function (o, i) { return i; }));
    var h = "<div style=\"font-size:13.5px;color:var(--text-secondary);margin-bottom:9px\">\u2691 Put the steps in the right order using the arrows. Each step in its correct position earns credit.</div><div class=\"olist\">";
    for (var p = 0; p < st.list.length; p++) {
      var it = ex.items[st.list[p]];
      h += "<div class=\"oitem\"><span class=\"pos\">" + (p + 1) + "</span><span class=\"otxt\">" + esc(it.t) + "</span>" +
        "<span class=\"mv\"><button type=\"button\" data-up=\"" + p + "\" aria-label=\"Move up\">\u2191</button>" +
        "<button type=\"button\" data-dn=\"" + p + "\" aria-label=\"Move down\">\u2193</button></span></div>";
    }
    h += "</div>";
    return h;
  }
  function termHtml(ex) {
    var st = EX_STATE[ex.id];
    if (!st.termLines) {
      st.termLines = ex.introLines ? ex.introLines.slice() : [];
    }
    var h = "<div class=\"term\">";
    h += "<div class=\"term-h\"><span class=\"term-dot\" style=\"background:var(--state-incorrect)\"></span><span class=\"term-dot\" style=\"background:var(--state-partial)\"></span><span class=\"term-dot\" style=\"background:var(--state-correct)\"></span>&nbsp; " + esc(ex.host || "analyst@macbook-fin-07") + " \u2014 zsh" + (ex.timeLimit ? " <span id=\"termLeft\" style=\"color:var(--accent-amber);margin-left:10px\">\u23F1 " + ex.timeLimit + "s left in this exercise</span>" : "") + "</div>";
    h += "<div class=\"term-scroll\" id=\"termScroll\">";
    for (var i = 0; i < st.termLines.length; i++) h += "<div>" + codeHi(st.termLines[i]) + "</div>";
    h += "</div>";
    h += "<div class=\"term-input-row\"><span class=\"term-prompt\">" + esc(ex.prompt || "analyst@macbook-fin-07 ~ %") + "</span>" +
      "<input class=\"term-in\" id=\"termIn\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" aria-label=\"Terminal command input\" placeholder=\"type a command and press Enter\">" +
      "<button class=\"btn green\" id=\"termRun\" type=\"button\">Run \u21B5</button></div></div>";
    if (ex.syntax) {
      h += "<div class=\"syntax-panel\"><b style=\"color:var(--accent-blue)\">Syntax reminder</b><br>" + codeHi(ex.syntax) + "</div>";
    }
    return h;
  }
  function runTerm(ex, cmd) {
    var st = EX_STATE[ex.id];
    if (st.checked) return;
    if (!cmd || !cmd.trim()) return;
    st.cmd = cmd;
    st.termLines.push((ex.prompt || "analyst@macbook-fin-07 ~ %") + " " + cmd);
    var n = norm(cmd);
    var hitTool = false;
    if (ex.elements.length && ex.elements[0].any) {
      var t0 = ex.elements[0].any;
      for (var j = 0; j < t0.length; j++) { if (n.indexOf(norm(t0[j])) >= 0) { hitTool = true; break; } }
    }
    if (hitTool && ex.outputSample) { st.termLines = st.termLines.concat(ex.outputSample.slice()); }
    else if (hitTool) { st.termLines.push("(command accepted)"); }
    else { st.termLines.push("zsh: command not found: " + cmd.trim().split(" ")[0]); }
    var host = $("termScroll");
    var h = "";
    for (var k = 0; k < st.termLines.length; k++) h += "<div>" + codeHi(st.termLines[k]) + "</div>";
    host.innerHTML = h;
    host.scrollTop = host.scrollHeight;
  }
  function branchHtml(ex) {
    var st = EX_STATE[ex.id];
    if (st.step === undefined) { st.step = 0; st.picks = []; }
    var s = ex.steps[st.step];
    var h = "<div class=\"step-tag\">\u25B8 STEP " + (st.step + 1) + " OF " + ex.steps.length + "</div>";
    if (s.artefact) h += artefactHtml(s.artefact);
    h += "<div style=\"font-weight:700;margin-bottom:10px\">" + esc(s.question) + "</div>";
    h += "<div class=\"opts\" role=\"group\" aria-label=\"Step options\">";
    for (var i = 0; i < s.options.length; i++) {
      var sel = st.picks[st.step] === i;
      h += "<button type=\"button\" class=\"opt" + (sel ? " sel" : "") + "\" style=\"width:100%;text-align:left\" data-oi=\"" + i + "\"><span class=\"lbl\">" + String.fromCharCode(65 + i) + ".</span><span class=\"txt\">" + esc(s.options[i].t) + "</span></button>";
    }
    h += "</div>";
    if (st.picks[st.step] !== undefined) {
      h += "<div class=\"consequence\">\u25B8 " + esc(s.options[st.picks[st.step]].consequence) + "</div>";
      h += "<div style=\"margin-top:12px\"><button class=\"btn primary\" id=\"btnStep\" type=\"button\">" + (st.step < ex.steps.length - 1 ? "Confirm &amp; continue \u2192" : "Confirm &amp; finish step \u2192") + "</button> <span style=\"font-size:13px;color:var(--text-secondary)\">(the timer keeps running between steps; grading happens on the final Check)</span></div>";
    }
    return h;
  }
  function redrawBranch(ex) {
    var host = $("ansArea");
    host.innerHTML = branchHtml(ex); bindBranch(ex);
  }
  function bindBranch(ex) {
    var st = EX_STATE[ex.id];
    if (st.checked) return;
    var host = $("ansArea");
    host.querySelectorAll(".opt").forEach(function (b) {
      b.addEventListener("click", function () {
        if (st.checked) return;
        st.picks[st.step] = parseInt(b.getAttribute("data-oi"), 10);
        redrawBranch(ex);
      });
    });
    var btn = $("btnStep");
    if (btn) btn.addEventListener("click", function () {
      if (st.checked) return;
      if (st.step < ex.steps.length - 1) { st.step += 1; redrawBranch(ex); }
      else { doCheck(ex); }
    });
  }
  function triageHtml(ex) {
    var st = EX_STATE[ex.id];
    if (!st.picks) st.picks = {};
    var h = "<div style=\"font-size:13.5px;color:var(--text-secondary);margin-bottom:10px\">\u2691 Handle every alert in the queue: pick one action per alert. The outcome line shows what your choice does. Grading happens on the final Check.</div><div class=\"alertqueue\">";
    for (var a = 0; a < ex.alerts.length; a++) {
      var al = ex.alerts[a];
      h += "<div class=\"alertcard" + (st.picks[a] !== undefined ? " done" : "") + "\"><div class=\"alert-h\">\u26A1 " + esc(al.name) + " <span class=\"alert-sev\">" + esc(al.sev) + "</span></div>";
      if (al.lines) {
        h += "<div class=\"artefact\"><div class=\"artefact-body\"><pre class=\"log\">";
        for (var l = 0; l < al.lines.length; l++) h += esc(al.lines[l]) + "\n";
        h += "</pre></div></div>";
      }
      h += "<div class=\"opts\" role=\"group\" aria-label=\"Action for " + escAttr(al.name) + "\">";
      for (var o = 0; o < al.options.length; o++) {
        var sel = st.picks[a] === o;
        h += "<button type=\"button\" class=\"opt" + (sel ? " sel" : "") + "\" style=\"width:100%;text-align:left\" data-a=\"" + a + "\" data-oi=\"" + o + "\"><span class=\"lbl\">" + String.fromCharCode(65 + o) + ".</span><span class=\"txt\">" + esc(al.options[o].t) + "</span></button>";
      }
      h += "</div>";
      if (st.picks[a] !== undefined) h += "<div class=\"consequence\">\u25B8 Outcome: " + esc(al.options[st.picks[a]].consequence) + "</div>";
      h += "</div>";
    }
    h += "</div>";
    return h;
  }
  function redrawTriage(ex) {
    var host = $("ansArea");
