.rcard .rc-num{font-size:26px;font-weight:800}
.rcard .rc-lab{font-size:13.5px;color:var(--text-secondary);margin-top:4px;letter-spacing:.03em}
.cert{border-radius:12px;padding:20px 22px;margin:16px 0;border:1px solid}
.cert.pass{border-color:var(--state-correct);background:linear-gradient(135deg,var(--tint-green-hero),transparent)}
.cert.fail{border-color:var(--state-incorrect);background:linear-gradient(135deg,var(--tint-red-hero),transparent)}
.cert h2{margin:0 0 6px 0;font-size:22px}
.cert p{margin:6px 0;color:var(--text-primary)}
.pauselog{color:var(--text-secondary);font-size:14px;border-top:1px dashed var(--border);margin-top:12px;padding-top:10px}

/* ---------- manual pause overlay ---------- */
#pauseoverlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.pausecard{max-width:460px;text-align:center;background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:12px;padding:28px}
.pausecard .pico{font-size:38px;color:var(--state-paused)}
.pausecard h2{color:var(--state-paused);margin:8px 0}
.pausecard p{color:var(--text-secondary)}

.term-clock{font-family:var(--font-mono);font-size:13px;color:var(--accent-amber);font-weight:700}
@media (max-width:720px){
  #app{padding:10px 10px 80px}
  .card,.blk-body{padding:13px}
  .topbar{gap:8px}
  .tstate{max-width:100%}
  pre.mono,pre.codeblock,.loglines{font-size:13px}
  .blank-in{width:150px}
}
@media (prefers-reduced-motion:reduce){
  #pbar::after{animation:none}
  *{transition:none !important;animation:none !important}
}
</style>

<script type="application/json" id="cm-exam-data">{"object":{"id":"T1590.002","name":"Gather Victim Network Information: DNS","type":"Sub-Technique","parent":"T1590","tactic":"Reconnaissance (TA0043)","platforms":"PRE"},"learn":["This object is a sub-technique. In MITRE ATT&CK, it describes one specific way to carry out the parent technique T1590, Gather Victim Network Information. Here the target of the gathering is the victim's DNS: the system that turns names like harbourline-freight[.]com into server addresses.","Imagine you work in the SOC of a shipping company. An attacker, sitting somewhere outside your network, quietly asks public DNS servers: 'Which servers handle this company's mail? Which name servers run its zones? What addresses do its subdomains point to?' Each answer is a small clue — mail vendors, cloud providers, live subdomains — and together the clues become a map of your attack surface. That is T1590.002.","You will meet this object as a CTI analyst (profiling how attackers prepare), as a pentester (running the same queries on purpose), as a SOC analyst ( spotting recon in DNS telemetry), and as a detection engineer (writing analytics like ATT&CK detection strategy DET0843 and its analytic AN1975). Tools on both sides: dig and nslookup for direct queries, passive DNS datasets such as CIRCL's, DNS Dumpster-style mapping sites, and your own DNS server logs.","ATT&CK places this sub-technique in the Reconnaissance tactic (TA0043) on the PRE platform — meaning it happens before the attack touches you, often outside your visibility. The page lists one mitigation, M1054 Software Configuration: restrict zone transfers to validated servers only. It also warns that a DNS zone transfer (AXFR) against a misconfigured server can leak every record at once. Detection is hard — high volume, high false positives — so defenders watch for later stages like Initial Access. Real cases on the page include a wrong BIND configuration that exposed a country's TLD records and CISA's warning that AXFR requests may leak domain information."],"kw":["dig","nslookup","host","axfr","nxdomain","mx","txt","soa","ptr","cname","spf","name-server","zone","transfer","recursion","include","all","in","grep","head"],"themes":[{"name":"Recon objective & lifecycle","concepts":["feeds Compromise Infrastructure (T1584)","feeds External Remote Services (T1133) initial access"]},{"name":"DNS record types & what they reveal","concepts":["MX records and mail providers","TXT and SPF records","NS records / registered name servers","PTR / reverse DNS","SaaS exposure: Office 365, G Suite, Salesforce, Zendesk"]},{"name":"Collection methods","concepts":["direct DNS queries (active)","Passive DNS datasets","Search Open Technical Databases (T1596)","dig / nslookup / host tools"]},{"name":"Zone transfer (AXFR)","concepts":["AXFR query type","misconfigured DNS server","leaks the full zone","restrict transfers to validated secondaries"]},{"name":"Mitigations & controls","concepts":["M1054 Software Configuration","zone transfer policies (validated servers only)","DNS hardening good practice"]},{"name":"Data sources & telemetry","concepts":["DNS/Passive DNS data","DNS server query logs","zone transfer attempt logs","resolver telemetry inside the victim"]},{"name":"Detection logic & analytics","concepts":["activity outside the victim's visibility","focus on later lifecycle stages (Initial Access)","internal hosts doing external recon"]},{"name":"Attacker value & next steps","concepts":["discover SaaS/third-party providers","find live subdomains","plan lookalike infrastructure","choose targets for External Remote Services"]},{"name":"Reference cases from the page","concepts":["CISA alert on AXFR leaks"]}],"exercises":[{"id":"T1590-002-M01","type":"triage","title":"Classify the DNS queries","summary":"Four flows through the resolver — recon, recon, or routine.","concepts":["AXFR query type","MX records and mail providers","direct DNS queries (active)","resolver telemetry inside the victim","PTR / reverse DNS"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Resolver extract, morning shift","kind":"text","text":"The SOC watches the internal resolver. Baselines: mail gateway checks SPF hourly; backups run at 02:00; nobody should pull full zones."}],"question":"Classify each flow: T1590.002 recon, routine traffic, or noisy-but-unrelated.","rows":[{"alert":"10[.]44[.]2[.]77 → AXFR harbourline-freight[.]com (external NS)","detail":"Workstation account, mid-morning, repeated twice.","options":["T1590.002 recon","Routine traffic","Unrelated noise"],"correctIndex":0,"why":"A workstation pulling a full zone from outside is textbook active DNS recon.","whyNot":{"1":"No baseline job does zone transfers from user subnets.","2":"AXFR is exactly the technique — never dismiss it as noise."}},{"alert":"mail-gw → TXT harbourline-freight[.]com (hourly)","detail":"Matches the SPF-check baseline.","options":["T1590.002 recon","Routine traffic","Unrelated noise"],"correctIndex":1,"why":"The mail gateway's hourly SPF check is expected traffic — the baseline explains it.","whyNot":{"0":"It is the gateway's own domain, on schedule, from a known service account.","2":"It matches a documented baseline job — routine, not noise."}},{"alert":"10[.]44[.]9[.]13 → MX, NS, SOA sweep of harbourline-freight[.]com","detail":"New laptop, all three types within 40 seconds.","options":["T1590.002 recon","Routine traffic","Unrelated noise"],"correctIndex":0,"why":"A rapid MX/NS/SOA sweep is a recon toolkit signature, not any known job.","whyNot":{"1":"No inventory or mail job sweeps all three types in seconds.","2":"The sweep pattern is the technique in miniature."}},{"alert":"printer-3 → PTR 10[.]44[.]2[.]1","detail":"Reverse lookup of its own gateway.","options":["T1590.002 recon","Routine traffic","Unrelated noise"],"correctIndex":2,"why":"A printer doing a reverse lookup of its gateway is everyday chatter — unrelated to recon.","whyNot":{"0":"No zone or mail data is being gathered — nothing about the victim's DNS surface.","1":"'Routine' would imply a known job; this is simply background noise."}}],"hint":"Two questions per row: does it gather DNS surface, and does a baseline job explain it?","explain":"Recon = gathering the DNS surface (AXFR, record sweeps). Routine = known jobs on schedule. Noise = chatter that neither gathers nor matches a job. This split is the daily triage rhythm for DET0843-style telemetry.","study":"Building resolver baselines that separate jobs from recon."},{"id":"T1590-002-M02","type":"multi","title":"Which records reveal the SaaS stack?","summary":"Pick every record type the ATT&CK text names as a third-party revealer.","concepts":["SaaS exposure: Office 365, G Suite, Salesforce, Zendesk","TXT and SPF records","MX records and mail providers"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — ATT&CK excerpt (T1590.002)","kind":"text","text":"DNS MX, TXT, and SPF records may also reveal the use of third party cloud and SaaS providers, such as Office 365, G Suite, Salesforce, or Zendesk."}],"question":"Select every record type the excerpt names as revealing third-party providers.","options":[{"t":"MX records","correct":true,"why":"Correct — MX answers name the mail platform (Office 365, G Suite, and so on)."},{"t":"TXT records (which carry SPF)","correct":true,"why":"Correct — TXT/SPF include third-party senders and verification tokens for SaaS."},{"t":"PTR records","correct":false,"why":"PTR is reverse lookup; the excerpt does not name it as a SaaS revealer."},{"t":"HINFO records","correct":false,"why":"HINFO is a hardware-description type, rare and not named in the excerpt."},{"t":"DS records","correct":false,"why":"DS belongs to DNSSEC delegation — not a SaaS signal in the excerpt."}],"hint":"Stay inside the excerpt: mail records and the policy text records.","explain":"MX + TXT/SPF are the SaaS windows: mail platform in MX, verified third-party senders in SPF. PTR, HINFO, and DS are real types but not the ones the page names.","study":"Reading SPF/TXT records to inventory a company's SaaS exposure."},{"id":"T1590-002-M03","type":"mcq","title":"Why a full zone leak matters","summary":"The two-step reasoning behind AXFR danger.","concepts":["leaks the full zone","AXFR query type","misconfigured DNS server"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Two ways to enumerate","kind":"text","text":"Path A: guess subdomains one by one (slow, incomplete). Path B: one AXFR against a misconfigured server (instant, complete). The attacker prefers B when it works."}],"question":"Why does a successful AXFR change the recon game for the attacker?","options":[{"t":"It hands over every record at once, including names that guessing would never find","correct":true,"why":"Correct — the full zone removes the guessing problem and exposes hidden internal naming in one shot."},{"t":"It crashes the DNS server as a side effect","correct":false,"why":"AXFR does not crash anything; the danger is disclosure, not availability."},{"t":"It encrypts the attacker's future queries","correct":false,"why":"Nothing about AXFR adds stealth to later queries."},{"t":"It gives the attacker write access to the zone","correct":false,"why":"AXFR is read-only — it leaks, it does not modify."}],"hint":"Compare the two paths in the artefact: coverage and speed.","explain":"Guessing finds only what you imagine; AXFR delivers everything recorded, including staging and internal names. That completeness is why the single M1054 control (validated-secondaries-only) targets it.","study":"The CISA warning on AXFR and the SecurityTrails BIND misconfiguration case."},{"id":"T1590-002-M04","type":"terminal","title":"List only the mail exchangers","summary":"The tool is known — work out the options for a clean MX answer.","concepts":["dig / nslookup / host tools","MX records and mail providers"],"perspective":"attacker","tags":[],"skill":"option-selection-lookup","scenario":[{"label":"ARTEFACT 1 — Tasking note","kind":"text","text":"Tasking (authorised lab): return only the answer lines for the mail exchangers of harbourline-freight[.]com — no status headers, no diagnostics. The tool is dig; you choose the options."}],"question":"Type the dig command that prints just the MX answer lines.","cmd":{"prompt":"recon-lab:~$","canonical":"dig +short MX harbourline-freight[.]com","nearMiss":"dig +noall MX harbourline-freight[.]com","outputs":[{"re":"dig\\s+\\+short\\s+mx\\s+harbourline-freight\\[.\\]com","lines":["10 aspmx.l.google[.]com.","20 alt1.aspmx.l.google[.]com."]}],"unknown":"command not recognised — dig takes options starting with '+', a record type, and the domain.","elements":[{"re":"\\bdig\\b","label":"Uses dig","why":"The tasking names dig as the tool."},{"re":"\\+short","label":"The +short option","why":"+short suppresses headers — answer lines only, as tasked."},{"re":"(^|\\s)mx(\\s|$)","label":"Asks for MX","why":"Mail exchangers live in MX records."},{"re":"harbourline-freight\\[.\\]com","label":"Targets the tasked domain","why":"The exact name from the tasking."}],"forbidden":[{"re":"\\baxfr\\b","label":"a zone-transfer attempt","why":"The tasking asks for MX lines only — AXFR is out of scope and likely refused."},{"re":"\\+noall(?!\\s*\\+answer)","label":"+noall without +answer","why":"That combination prints nothing useful — a near-miss option pairing."}]},"hint":"You need to see only established answers, not everything — dig has one well-known option for that.","explain":"'dig +short MX <domain>' prints bare answer lines: exactly the tasking. '+noall' alone (without '+answer') yields silence — the classic option near-miss. Option choice is the skill this exercise drills.","study":"dig output options: +short, +noall +answer, and when each fits."},{"id":"T1590-002-M05","type":"mcq","title":"The value of DNS history","summary":"Why passive DNS history beats a single snapshot.","concepts":["Passive DNS datasets","plan lookalike infrastructure","Search Open Technical Databases (T1596)"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Attacker's dataset choice","kind":"text","text":"The attacker can query today's records, or pull five years of passive DNS history for the freight company's domain."}],"question":"What extra value does the history give the attacker?","options":[{"t":"Old and deleted hostnames that may still have live, forgotten services","correct":true,"why":"Correct — historical records surface forgotten subdomains and past providers, widening the attack surface."},{"t":"The victim's future DNS plans","correct":false,"why":"History records the past; it cannot reveal plans."},{"t":"The contents of the victim's mailboxes","correct":false,"why":"No DNS dataset contains mailbox contents."},{"t":"It hides the attacker's queries from their own ISP","correct":false,"why":"Datasets change who sees the query, not the attacker's own network trace."}],"hint":"Think about what existed before but is gone now.","explain":"Passive DNS history exposes names that no longer resolve publicly or services that were never decommissioned properly — classic T1590.002 gains that a single live query cannot give.","study":"Using passive DNS for forgotten-subdomain discovery."},{"id":"T1590-002-M06","type":"branch","title":"Work the external AXFR alert","summary":"Three decisions from alert to closure.","concepts":["zone transfer attempt logs","restrict transfers to validated secondaries","M1054 Software Configuration"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Alert SEC-4419","kind":"text","text":"03:40 — AXFR attempt for harbourline-freight[.]com against ns1 from 198[.]51[.]100[.]231 (external). You are the on-call analyst."}],"question":"Make the three triage decisions.","steps":[{"text":"Decision 1 — First verification?","options":[{"t":"Check the server's response to that exact query (allowed or refused)","correct":true,"why":"Correct — the response decides severity in one look.","outcome":"Log shows REFUSED: source not in the transfer ACL. No data left the zone.","outcomeBad":false},{"t":"Shut down ns1 to be safe","correct":false,"why":"ns1 serves public DNS — shutting it down takes the domain's answers offline for nothing.","outcome":"ns1 offline; web and mail lookups degrade; the attempt was already refused anyway.","outcomeBad":true},{"t":"Reply to the source IP asking who they are","correct":false,"why":"Pointless and noisy — DNS does not chat back.","outcome":"No response; time wasted.","outcomeBad":true}]},{"text":"Decision 2 — The attempt was refused. What does that tell you about M1054?","options":[{"t":"The zone-transfer policy worked — only validated servers may transfer","correct":true,"why":"Correct — a refusal proves the M1054 control is enforced on this server.","outcome":"Policy confirmed: transfers allowed only to ns2 (validated secondary).","outcomeBad":false},{"t":"Refusal proves the attacker got the zone","correct":false,"why":"The opposite — refused means the zone did not move.","outcome":"You would report a leak that never happened.","outcomeBad":true},{"t":"Refusal means the server is broken","correct":false,"why":"Refusing unauthorised AXFR is correct behaviour, not breakage.","outcome":"You would open a pointless incident on a healthy control.","outcomeBad":true}]},{"text":"Decision 3 — How do you close the alert?","options":[{"t":"Close as attempted-recon, add the source to watching, confirm policy on ns2 too","correct":true,"why":"Correct — record the attempt, keep telemetry, and verify the control on every authoritative server.","outcome":"Alert closed with policy verified on both NS; source added to the recon watchlist.","outcomeBad":false},{"t":"Close and delete the log line to reduce noise","correct":false,"why":"Tampering with logs destroys the evidence trail.","outcome":"The audit trail now has a hole where the attempt was.","outcomeBad":true},{"t":"Escalate as a confirmed breach","correct":false,"why":"Nothing was disclosed — escalation would misstate the facts.","outcome":"A false breach claim burns credibility for the next real one.","outcomeBad":true}]}],"hint":"Response first, control second, closure third — let the log decide severity.","explain":"The branch drills two linked ideas: what the log proves (refused = control works) and what closure requires (telemetry + policy verification on all NS). Panic actions (shutting ns1) cost availability with zero benefit.","study":"Zone-transfer alert handling and M1054 policy verification."},{"id":"T1590-002-M07","type":"fib","title":"Explain the SPF record","summary":"Two blanks make the SPF sentence true.","concepts":["TXT and SPF records","SaaS exposure: Office 365, G Suite, Salesforce, Zendesk"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — Onboarding quiz","kind":"text","text":"Quiz: 'An SPF record (inside a TXT record) lists the servers {b0} to send mail for the domain. Reading it tells an outsider which {b1} the company depends on.'"}],"question":"Fill the two blanks of the quiz.","template":"An SPF record lists the servers {b0} to send mail for the domain. Reading it tells an outsider which {b1} the company depends on.","blanks":[{"accept":["allowed","authorised","permitted"],"why":"SPF declares which senders are allowed — that is its whole job.","whyMiss":"SPF is an allow-list for senders, not a log or a blacklist."},{"accept":["third parties","third-party providers","providers","services"],"why":"SPF includes SaaS senders — a direct window into the provider stack.","whyMiss":"The page's point: SPF reveals third-party cloud/SaaS dependencies."}],"hint":"Blank one: what SPF does to senders. Blank two: whose names appear inside it.","explain":"SPF = the published allow-list of senders. Every included third party (helpdesk, CRM, marketing tool) shows up there — which is exactly why the ATT&CK text calls TXT/SPF a SaaS revealer.","study":"SPF mechanics and what 'include:' entries expose."},{"id":"T1590-002-M08","type":"dnd","title":"Tag the collection paths","summary":"Four DNS-recon artefacts into active, passive, abuse, or telemetry.","concepts":["direct DNS queries (active)","Passive DNS datasets","misconfigured DNS server","DNS server query logs","DNS/Passive DNS data"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Evidence tray","kind":"text","text":"Four artefacts from a recon review. Label each with the collection path it represents."}],"question":"Drag each artefact to its collection path.","zones":[{"name":"Active collection","accepts":[0],"why":"Direct queries to the victim's servers are active collection."},{"name":"Passive collection","accepts":[1],"why":"Third-party datasets are passive — no victim contact."},{"name":"Misconfiguration abuse","accepts":[2],"why":"AXFR against a wrong-config server abuses a server-side mistake."},{"name":"Defender telemetry","accepts":[3],"why":"The victim's own query logs are the defender's view of active collection."}],"bank":[{"t":"dig +short MX harbourline-freight[.]com from 198[.]51[.]100[.]7","whyMiss":"A direct query to public infrastructure — active."},{"t":"Five-year resolution history from a CIRCL-style dataset","whyMiss":"Dataset lookups never touch the victim — passive."},{"t":"AXFR accepted by ns-old with 'allow-transfer any'","whyMiss":"A bad allow-transfer line turns the server itself into the leak — misconfiguration abuse."},{"t":"harbourline resolver log of inbound record sweeps","whyMiss":"The victim's own logs = defender telemetry."}],"hint":"Ask per artefact: did it touch the victim, a dataset, a mistake, or your own logs?","explain":"Four paths, four labels. Active touches you, passive does not, misconfiguration abuse makes your server the leak, and telemetry is what you can actually see. DET0843's limits follow directly: passive paths are invisible to you.","study":"Active vs passive vs abuse paths in DNS recon."},{"id":"T1590-002-M09","type":"order","title":"Order the recon-to-access chain","summary":"Four steps from record sweep to the first access attempt.","concepts":["feeds External Remote Services (T1133) initial access","discover SaaS/third-party providers","find live subdomains","choose targets for External Remote Services"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Case timeline stubs","kind":"text","text":"Stubs: 'TXT/SPF read → SaaS list drafted' · 'MX + NS mapped' · 'Subdomains resolved, one old VPN portal found' · 'VPN portal probed for access'."}],"question":"Order the four steps of the chain.","sequence":["Map MX and NS records","Read TXT/SPF and draft the SaaS list","Resolve subdomains and find the old VPN portal","Probe the VPN portal for access (External Remote Services)"],"orderWhy":["Mail and DNS hosting come first — the base map.","SPF reading turns the base map into a SaaS inventory.","Subdomain resolution finds the entry candidates, like the old portal.","The portal probe is the pivot into Initial Access territory."],"hint":"Base map, then the SaaS list, then live hosts, then the first probe.","explain":"DNS recon is the supply line for later stages: the sweep ends at an exposed remote service, and the probe crosses into External Remote Services (T1133). This is why AN1975 redirects detection attention to Initial Access.","study":"The T1590.002 page's 'leads to' relationships, including External Remote Services."},{"id":"T1590-002-M10","type":"mcq","title":"What can the victim even see?","summary":"The visibility limit that shapes DET0843.","concepts":["activity outside the victim's visibility","Passive DNS datasets","resolver telemetry inside the victim"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Two recon paths","kind":"text","text":"Path 1: an external host queries your authoritative name servers directly. Path 2: the same actor reads a passive DNS dataset in another country."}],"question":"Which path can the victim's telemetry see, and why?","options":[{"t":"Path 1 only — direct queries hit servers the victim controls and logs","correct":true,"why":"Correct — authoritative servers log inbound queries; dataset reads leave no trace on victim systems."},{"t":"Path 2 only — datasets always notify the domain owner","correct":false,"why":"Datasets do not notify anyone; that is what makes them invisible."},{"t":"Both — every DNS query worldwide is logged by the domain owner","correct":false,"why":"Only queries reaching servers you control are visible to you."},{"t":"Neither — DNS queries are anonymous and unloggable","correct":false,"why":"Your own servers absolutely can log the queries they receive."}],"hint":"Visibility follows the servers that answer the query.","explain":"You see what hits your resolvers and authoritative NS; you never see dataset reads. That asymmetry is the core limitation AN1975 describes — and why internal hosts doing the same sweeps are your best visible signal.","study":"Detection strategy DET0843: what telemetry can and cannot cover."},{"id":"T1590-002-M11","type":"match","title":"Match controls to their effect","summary":"The ATT&CK-listed control plus two standard DNS practices.","concepts":["M1054 Software Configuration","zone transfer policies (validated servers only)","DNS hardening good practice"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Control register (extract)","kind":"text","text":"Register: (1) M1054 zone-transfer policy · (2) split-horizon DNS (internal names only on internal resolvers) · (3) monitoring for AXFR attempts from unlisted sources."}],"question":"Match each control to the effect it delivers.","left":[{"t":"M1054 zone-transfer policy","match":0,"why":"The ATT&CK-listed control: transfers only from validated servers."},{"t":"Split-horizon DNS","match":1,"why":"Keeps internal naming out of the public zone entirely."},{"t":"AXFR attempt monitoring","match":2,"why":"Turns recon attempts into telemetry you can alert on."}],"right":[{"t":"Full zones leave only to validated secondaries","why":"The policy decides exactly who may pull the zone."},{"t":"Internal hostnames are never published at all","why":"Split-horizon removes the data before any query can leak it."},{"t":"Attempts become alerts instead of silence","why":"Monitoring converts recon noise into signal."}],"hint":"One restricts the transfer, one shrinks the published data, one watches the door.","explain":"M1054 is the listed mitigation; split-horizon and monitoring are the supporting practices that make it complete — restrict, minimise, observe. Together they blunt both AXFR abuse and record sweeps.","study":"M1054 on the T1590.002 page plus standard DNS hardening practice."},{"id":"T1590-002-M12","type":"logview","title":"Allowed or refused?","summary":"Read the transfer log and pick the line that shows a SUCCESSFUL leak.","concepts":["leaks the full zone","zone transfer attempt logs","restrict transfers to validated secondaries"],"perspective":"defender","tags":[],"logTitle":"ns1 transfer audit log (02:00-02:30)","filterPlaceholder":"filter transfer lines...","log":["02:03:11  AXFR req  from ns2.provider-dns[.]net   status: ALLOWED (validated secondary)","02:03:12  AXFR sent zone harbourline-freight[.]com to ns2.provider-dns[.]net  214 records","02:11:40  AXFR req  from 198[.]51[.]100[.]231        status: REFUSED (not in ACL)","02:12:05  IXFR req  from ns2.provider-dns[.]net    status: ALLOWED (incremental)","02:25:19  AXFR req  from 203[.]0[.]113[.]88         status: REFUSED (not in ACL)"],"options":[{"t":"02:03:12 — the zone sent to the validated secondary","correct":true,"why":"Correct — that line shows 214 records actually transferred; the source is the validated secondary, so it is the one lawful transfer in the log."},{"t":"02:11:40 — the REFUSED line for the external requester","correct":false,"why":"Refused means nothing moved — that is the control working, not a leak."},{"t":"02:03:11 — the allowed request from the secondary","correct":false,"why":"The request line alone shows permission; the 02:03:12 line is the actual transfer of records."},{"t":"02:25:19 — the second refusal","correct":false,"why":"Another refusal — again the control working, not a successful leak."}],"question":"Which line shows a zone actually transferred, and to whom?","hint":"A transfer needs both a permission and a 'sent' line — and the source decides whether it is lawful.","explain":"The 02:03:12 'sent 214 records' line to the validated secondary is a legitimate transfer. Both external requests were refused. Reading permission, action, and source together is the skill.","study":"Authoritative-server transfer logs: request, status, and source fields.","scenario":[{"label":"ARTEFACT 1 — ns1 transfer audit log (02:00-02:30)","kind":"text","text":"You are reviewing this export in the SOC log viewer. Read the transfer log and pick the line that shows a SUCCESSFUL leak. Use the filter box to narrow the lines before answering."}]},{"id":"T1590-002-M13","type":"multi","title":"What NS records tell the attacker","summary":"Pick the two conclusions NS records support.","concepts":["NS records / registered name servers","plan lookalike infrastructure","Compromise Infrastructure (T1584)","feeds Compromise Infrastructure (T1584)"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — NS answer","kind":"code","text":"harbourline-freight[.]com.  NS  ns1.harbourline-freight[.]com.\nharbourline-freight[.]com.  NS  ns2.provider-dns[.]net."}],"question":"Select the two conclusions the attacker can defensibly draw.","options":[{"t":"Which servers hold the authoritative zone","correct":true,"why":"Correct — NS names exactly the authoritative servers for the zone."},{"t":"Which DNS hosting provider runs the secondary","correct":true,"why":"Correct — provider-dns[.]net names the provider, useful for planning provider-side attacks."},{"t":"The internal Active Directory domain controller names","correct":false,"why":"Public NS records list authoritative DNS servers, not internal DCs."},{"t":"The admin console password policy","correct":false,"why":"Nothing in DNS describes password rules."},{"t":"That the mail platform is G Suite","correct":false,"why":"Mail platforms come from MX, not NS — right conclusion, wrong record type."}],"hint":"Stay with what the two answer lines literally say.","explain":"NS gives the authoritative server list and, often, the DNS provider behind it — inputs for later Compromise Infrastructure (T1584) planning. Mail platforms are MX territory; internal DC names are never in public NS.","study":"NS records and how they feed Compromise Infrastructure planning."},{"id":"T1590-002-M14","type":"triage","title":"Choose the next step","summary":"Three recon alerts — pick the proportionate next action for each.","concepts":["internal hosts doing external recon","zone transfer attempt logs","focus on later lifecycle stages (Initial Access)"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Queue at 09:15","kind":"text","text":"Three alerts, three decisions. Context: an attacker's mail-based campaign hit the industry last week."}],"question":"Pick the proportionate next step for each alert.","rows":[{"alert":"Internal host sweeps MX/TXT of harbourline-freight[.]com","detail":"Fresh laptop, never seen before.","options":["Treat as possible insider/compromised host — investigate host","Ignore, external recon is expected","Shut down the resolver"],"correctIndex":0,"why":"Internal recon against your own DNS surface is a host-level signal — investigate the machine and its user.","whyNot":{"1":"External recon is expected; INTERNAL recon against your own estate is not.","2":"Resolver shutdown breaks the company to catch one host."}},{"alert":"External AXFR attempts, refused, from a known scanner range","detail":"Third refusals this month from ranges that scan everyone.","options":["Treat as possible insider/compromised host — investigate host","Log and watch; refusals held, volume normal","Shut down the resolver"],"correctIndex":1,"why":"The control held and the source is a known internet-wide scanner — watching is proportionate.","whyNot":{"0":"There is no internal host involved here.","2":"Refused attempts from a known scanner do not justify breaking DNS."}},{"alert":"Sudden SPF record change published at 02:00, no change ticket","detail":"New 'include:' points at an unknown sender domain.","options":["Treat as possible insider/compromised host — investigate the change","Ignore, external recon is expected","Shut down the resolver"],"correctIndex":0,"why":"An unticketed SPF change can authorise an attacker's sender domain — investigate immediately.","whyNot":{"1":"Record CHANGES are not recon at all — they may be tampering.","2":"The resolver is fine; the published data is the problem."}}],"hint":"Where the actor sits (inside vs outside) and what changed (queries vs records) decide the action.","explain":"Internal recon → host investigation; refused external noise → watch; record changes → investigate the change path. Three different signals, three proportionate answers — overreaction is its own incident.","study":"Proportionate response tiers for DNS telemetry signals."},{"id":"T1590-002-M15","type":"mcq","title":"The CISA warning in practice","summary":"What the page's CISA reference warns about.","concepts":["CISA alert on AXFR leaks","leaks the full zone"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — GRC briefing slide","kind":"text","text":"Slide: 'CISA (2016): DNS zone transfer (AXFR) requests may leak domain information.' The CFO asks what that means for us."}],"question":"Which explanation matches the warning?","options":[{"t":"Misconfigured servers can answer AXFR from anyone, dumping the whole zone to strangers","correct":true,"why":"Correct — CISA warned that AXFR, when allowed broadly, leaks the full record set."},{"t":"AXFR encrypts the zone during transfer","correct":false,"why":"AXFR is a transfer mechanism, not an encryption feature."},{"t":"AXFR lets visitors update their own records","correct":false,"why":"AXFR is read-only; updates go through dynamic update, a different mechanism."},{"t":"AXFR slows the server down during office hours","correct":false,"why":"Performance is not the concern — disclosure is."}],"hint":"This is about disclosure, not performance or encryption.","explain":"CISA's point: an AXFR-enabled-for-everyone server hands its entire zone to any requester. That warning, plus the SecurityTrails BIND case, is why M1054 exists on this page.","study":"The CISA reference and the SecurityTrails BIND misconfiguration case on the T1590.002 page."}],"severityWord":"MEDIUM","partLabel":null}</script>
<script>
'use strict';
var DATA = JSON.parse(document.getElementById('cm-exam-data').textContent);
var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var EXS = [];
var S = null;
var T = null; // timer object for current attempt

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function fmtTime(sec){
  sec = Math.max(0, sec|0);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function round1(x){ return Math.round(x*10)/10; }
function letterKey(n){ return String.fromCharCode(65+n); }
function dispKey(ex, origIdx){ return ex._optOrder ? ex._optOrder.indexOf(origIdx) : origIdx; }

var KW = (DATA.kw && DATA.kw.length) ? DATA.kw : ['show','key','log','policy','error'];
var KWRE = new RegExp('(^|[^\\w-])(' + KW.join('|') + ')(?=[^\\w-]|$)','g');
function hl(text){
  var e = esc(text);
  e = e.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g, '<span class="tok-str">$1</span>');
  e = e.replace(/\b\d{1,3}(?:\[\.\]\d{1,3}){3}\b/g, '<span class="tok-ip">$&</span>');
  e = e.replace(KWRE, function(m,p1,p2){ return p1 + '<span class="tok-kw">' + p2 + '</span>'; });
  e = e.replace(/(\s|^)(-{1,2}[A-Za-z][\w-]*)/g, '$1<span class="tok-flag">$2</span>');
  e = e.replace(/\b(\d+)\b(?![^<]*<\/span>)/g, function(m, g1, off, str){
    var before = str.slice(Math.max(0, off-6), off);
    if(before.indexOf('class=') >= 0){ return m; }
    return '<span class="tok-num">'+m+'</span>';
  });
  return e;
}

function scoreExercise(H, W, N){
  if(N <= 0){ return 0; }
  return Math.max(0, (H - W) / N);
}
function normTxt(s){
  return String(s).trim().toLowerCase().replace(/\s+/g,' ').replace(/[.,;]+$/,'');
}

/* ================= timer state machine ================= */
function setTState(st){
  T.state = st;
  var el = $('tstate');
  if(!el){ return; }
  el.className = 'tstate';
  if(st === 'RUNNING'){ el.classList.add('running'); el.innerHTML = '&#9654; RUNNING'; }
  else if(st === 'PAUSED_MANUAL'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; manual (press Resume)'; }
  else if(st === 'PAUSED_AUTO_CHECK'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; reviewing feedback (resumes on Next)'; }
  else if(st === 'ENDED'){ el.classList.add('ended'); el.innerHTML = '&#9632; ENDED'; }
  renderTimerBox();
}
function renderTimerBox(){ var el = $('timerbox'); if(el){ el.textContent = fmtTime(T.remaining); } }
function tick(){
  if(T.state === 'RUNNING'){
    T.remaining -= 1;
    renderTimerBox();
    var tc = $('termclock');
    if(tc && S && (S.screen === 'exam') && curEx() && curEx().type === 'terminal' && !curEx()._checked && curEx()._tleft !== null && curEx()._tleft !== undefined){
      curEx()._tleft -= 1;
      if(curEx()._tleft <= 0){ curEx()._tleft = 0; tc.textContent = '\u23f1 0:00 left — grading now'; curEx()._autoGrade = true; gradeCurrent(); return; }
      tc.textContent = '\u23f1 ' + Math.floor(curEx()._tleft/60) + ':' + (curEx()._tleft%60 < 10 ? '0' : '') + (curEx()._tleft%60) + ' left on this terminal (pauses with the exam timer)';
    }
    if(T.remaining <= 0){
      T.remaining = 0;
      setTState('ENDED');
      finishAttempt(true);
    }
  } else if(T.state === 'PAUSED_MANUAL'){ T.manualTotal += 1; }
  else if(T.state === 'PAUSED_AUTO_CHECK'){ T.autoTotal += 1; }
}

/* ================= intro screen ================= */
function typeLabel(t){
  return {
    mcq:'multiple choice', multi:'multi-select (partial credit)', match:'matching pairs',
    dnd:'drag & drop', order:'timeline ordering', fib:'fill-in-the-blank',
    terminal:'fake terminal command', branch:'branching decision scenario',
    triage:'SOC alert-queue triage', logview:'log viewer analysis'
  }[t] || t;
}
var TYPE_ICONS = {mcq:'A.', multi:'☑', match:'⇄', dnd:'✥', order:'↕', fib:'▁', terminal:'>_ ', branch:'⑃', triage:'▦', logview:'☰'};

function renderIntro(){
  S.screen = 'intro';
  var exTypes = [];
  DATA.exercises.forEach(function(e){ if(exTypes.indexOf(e.type) < 0){ exTypes.push(e.type); } });
  var chips = exTypes.map(function(t){ return '<span class="typechip">'+esc(TYPE_ICONS[t]||'•')+' '+esc(typeLabel(t))+'</span>'; }).join('');
  var themes = DATA.themes.map(function(th){
    return '<div class="themebox"><h4>'+esc(th.name)+'</h4><ul>'+ th.concepts.map(function(c){ return '<li>'+esc(c)+'</li>'; }).join('') +'</ul></div>';
  }).join('');
  var learn = DATA.learn.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('');
  var app = $('app');
  app.innerHTML =
  '<div class="intro-hero card">'+
    '<h1>'+esc(META.title)+'</h1>'+
    '<div class="objline"><b>'+esc(DATA.object.id)+' — '+esc(DATA.object.name)+'</b> &nbsp;·&nbsp; ATT&amp;CK object type: '+esc(DATA.object.type)+' &nbsp;·&nbsp; Tactic: '+esc(DATA.object.tactic)+'</div>'+
    '<div class="objline">Platform(s): '+esc(DATA.object.platforms)+'</div>'+
    '<div class="factrow">'+
      '<span class="badge '+sevClass()+'">'+esc(DATA.severityWord)+'</span>'+
      '<span class="fact">▦ <span><b>'+DATA.exercises.length+'</b> exercises</span></span>'+
      '<span class="fact">⏱ <span>estimated time <b>'+META.estimatedMinutes+' min</b> — the countdown timer gives you the same <b>'+META.timerMinutes+' min</b></span></span>'+
      '<span class="fact">◎ <span>pass mark <b>'+META.passMark+'%</b></span></span>'+
      (S.init && S.init.username ? '<span class="userchip">👤 Analyst: '+esc(S.init.username)+'</span>' : '')+
    '</div>'+
  '</div>'+
  '<section class="card"><h2>What you will learn here</h2>'+learn+'</section>'+
  '<section class="card"><h2>Keywords covered in this exam</h2><div class="themegrid">'+themes+'</div>'+
    '<p class="kw-note">Each keyword above is exercised at least once in this file. Themes follow the structure of the ATT&amp;CK page for '+esc(DATA.object.id)+'.</p></section>'+
  '<section class="card"><h2>How this exam works</h2>'+
    '<div class="typechips">'+chips+'</div>'+
    '<ul class="rulelist">'+
    '<li><span class="rl-ico">◎</span><span><b>Pass mark '+META.passMark+'%.</b> Your score is computed only over the exercises you actually answered (checked). PASS means you scored at least '+META.passMark+'%; FAIL means you should retake the exam.</span></li>'+
    '<li><span class="rl-ico">⚖</span><span><b>Partial credit.</b> Multi-answer exercises are graded per item: credit = max(0, (correct items selected − wrong items selected) ÷ total correct items). Selecting everything is graded 0, not full marks.</span></li>'+
    '<li><span class="rl-ico">💡</span><span><b>Hint costs 10% of the exercise credit.</b> One hint per exercise. The hint gives a nudge, never the answer.</span></li>'+
    '<li><span class="rl-ico">⏱</span><span><b>Timer.</b> A countdown runs for '+META.timerMinutes+' minutes. <b>Pause</b> is manual: it hides the exercise until you press Resume. Pressing <b>Check</b> also pauses the timer automatically while you study the feedback — the exercise stays visible, and the timer resumes only when you press <b>Next</b> (or Final Submit on the last exercise).</span></li>'+
    '<li><span class="rl-ico">⤼</span><span><b>Skip.</b> Every exercise can be skipped without penalty. Skipped exercises go to a review pool. Before you finish, you can return to them as many times as the timer allows. Skipped-and-never-answered exercises are excluded from the score completely.</span></li>'+
    '</ul>'+
    '<div class="btnrow"><button class="btn primary" id="startbtn" onclick="startAttempt()">▶ Start the exam</button></div>'+
  '</section>';
  window.scrollTo(0,0);
}

/* ================= exam flow ================= */
function constrainedShuffle(){
  var isTerm = EXS.map(function(e){ return e.type === 'terminal'; });
  var ord = EXS.map(function(e,i){ return i; });
  for(var tries=0; tries<80; tries++){
    ord = shuffle(EXS.map(function(e,i){ return i; }));
    var ok = true;
    for(var k=1; k<ord.length; k++){ if(isTerm[ord[k]] && isTerm[ord[k-1]]){ ok = false; break; } }
    if(ok){ return ord; }
  }
  return ord;
}
function startAttempt(){
  EXS = DATA.exercises.map(function(e){ return JSON.parse(JSON.stringify(e)); });
  S = {
    screen:'exam', order:[], cur:0, creditSum:0, answered:0, checkedCount:0,
    skipped:[], reported:false, init:S ? S.init : null, reviewing:null
  };
  S.order = shuffle(EXS.map(function(e,i){ return i; }));
  EXS.forEach(function(ex){
    ex._checked = false; ex._credit = 0; ex._hintUsed = false; ex._ans = null; ex._items = null; ex._autoGrade = false;
    if(ex.type === 'mcq' || ex.type === 'multi' || ex.type === 'logview'){ ex._optOrder = shuffle(ex.options.map(function(o,i){ return i; })); }
    if(ex.type === 'match'){ ex._rightOrder = shuffle(ex.right.map(function(r,i){ return i; })); }
    if(ex.type === 'dnd'){ ex._bankOrder = shuffle(ex.bank.map(function(b,i){ return i; })); }
    if(ex.type === 'order'){ ex._seq = shuffle(ex.sequence.slice()); }
    if(ex.type === 'terminal'){ ex._log = []; ex._lastCmd = null; ex._tleft = (ex.cmd && ex.cmd.timeLimit) ? ex.cmd.timeLimit : null; }
    if(ex.type === 'branch'){ ex._step = 0; ex._picks = []; ex._pendingPick = null; }
  });
  T = { remaining: META.timerMinutes*60, state:'RUNNING', iv:null, manualTotal:0, autoTotal:0 };
  if(T.iv){ clearInterval(T.iv); }
  T.iv = setInterval(tick, 1000);
  setTState('RUNNING');
  S.screen = 'exam';
  S.cur = 0;
  S.order = constrainedShuffle();
  LASTKEY = '';
  renderExamShell();
  renderExercise();
}
function curEx(){ return EXS[S.order[S.cur]]; }
function sevClass(){ return 'sev-' + (META.difficulty === 'extremely-hard' ? 'extreme' : META.difficulty); }

function renderExamShell(){
  $('app').innerHTML =
    '<div class="topbar" id="topbar">'+
      '<span class="tb-item" id="tb-counter"></span>'+
      '<span class="tb-item"><span class="badge '+sevClass()+'" id="tb-badge"></span></span>'+
      '<span class="tb-item" id="tb-part"></span>'+
      '<span class="tb-item">⏱ <span class="timerbox" id="timerbox">--:--</span> <span class="tstate" id="tstate"></span></span>'+
      '<span class="tb-item tb-score">◎ Score: <strong id="tb-score">0 / 0</strong> <span id="tb-pct">(0%)</span></span>'+
      (S.init && S.init.username ? '<span class="userchip">👤 '+esc(S.init.username)+'</span>' : '')+
      '<span style="flex:1"></span>'+
      '<button class="btn ghost" id="btn-pause" onclick="pauseManual()">⏸ Pause</button>'+
      '<button class="btn amber" id="btn-hint" onclick="doHint()">💡 Hint <small style="opacity:.8">−10%</small></button>'+
      '<button class="btn ghost" id="btn-skip" onclick="doSkip()">⤼ Skip</button>'+
    '</div>'+
    '<div id="pbarwrap"><div id="pbar"></div></div>'+
    '<div id="exarea"></div>';
  $('tb-badge').textContent = DATA.severityWord;
  $('tb-part').innerHTML = DATA.partLabel ? '<span class="statechip st-skipped">'+esc(DATA.partLabel)+'</span>' : '';
  $('pbar').style.setProperty('--sev', 'var(--sev-' + META.difficulty.replace('extremely-hard','extreme') + ')');
  renderTimerBox();
  setTState(T ? T.state : 'RUNNING');
  updateHeader();
}
function updateHeader(){
  if(!$('tb-counter')){ return; }
  var ex = curEx();
  if(S.screen === 'exam'){
    $('tb-counter').innerHTML = 'Exercise <strong>'+(S.cur+1)+'</strong> of <strong>'+EXS.length+'</strong>';
  } else if(S.screen === 'open'){
    $('tb-counter').innerHTML = '⚠ Reviewing skipped exercise <strong>'+(S.reviewPos+1)+'</strong> of <strong>'+S.skipped.length+'</strong>';
  } else if(S.screen === 'review'){
    $('tb-counter').innerHTML = 'Review skipped exercises';
  }
  $('tb-score').textContent = round1(S.creditSum).toFixed(1) + ' / ' + S.answered;
  var pct = S.answered > 0 ? Math.round((S.creditSum / S.answered) * 100) : 0;
  $('tb-pct').textContent = '(' + pct + '%)';
  var p = Math.round((S.checkedCount / EXS.length) * 100);
  $('pbar').style.width = p + '%';
  var hintDis = S.screen !== 'exam' && S.screen !== 'open';
  hintDis = hintDis || !ex || ex._hintUsed || ex._checked;
  $('btn-hint').disabled = !!hintDis;
  $('btn-skip').disabled = S.screen !== 'exam' || !ex || ex._checked;
  var pb = $('btn-pause'); if(pb){ pb.disabled = !T || T.state === 'ENDED'; }
}

/* ---------- scenario / question blocks ---------- */
function scenarioHtml(ex){
  var arts = (ex.scenario || []).map(function(a, i){
    if(a.kind === 'log' || a.kind === 'code'){
      var lines = a.text.split('\n').map(function(l){ return '<div class="ln">'+hl(l)+'</div>'; }).join('');
      return '<div class="artefact"><span class="art-label">'+esc(a.label)+'</span><div class="art-body"><pre class="mono" style="background:transparent;border:none;padding:0;margin:0">'+lines+'</pre></div></div>';
    }
    return '<div class="artefact"><span class="art-label">'+esc(a.label)+'</span><div class="art-body"><p>'+esc(a.text).replace(/\n/g,'<br>')+'</p></div></div>';
  }).join('');
  var sum = '<div class="blk-body" id="scen-sum" style="border-top:1px dashed var(--border);padding:10px 16px"><span class="art-label" style="padding:0 0 4px 0">⚠ ONE-LINE SUMMARY</span><p style="margin:2px 0">'+esc(ex.summary)+'</p></div>';
  return '<div class="blk scenario" id="blk-scen">'+
    '<div class="blk-head"><span class="blk-ico">🛰</span> SCENARIO'+
      '<span style="flex:1"></span>'+
      '<button class="btn ghost" id="scen-toggle" style="min-height:44px;padding:4px 12px" onclick="toggleScenario()" aria-expanded="true">▲ Collapse</button>'+
    '</div>'+
    '<div class="blk-body" id="scen-body">'+arts+'</div>'+sum+
  '</div>';
}
function toggleScenario(){
  var b = $('scen-body'), t = $('scen-toggle');
  if(!b){ return; }
  var open = !b.classList.contains('hidden');
  b.classList.toggle('hidden', open);
  t.textContent = open ? '▼ Expand' : '▲ Collapse';
  t.setAttribute('aria-expanded', String(!open));
}

/* ---------- answer widgets ---------- */
function optRowHtml(ex, i, kind){
  var o = ex.options[i];
  var dk = dispKey(ex, i);
  var inp = '<input type="'+(kind==='multi'?'checkbox':'radio')+'" name="ans" id="opt-'+i+'" value="'+i+'" onchange="pickOpt()" aria-label="Option '+letterKey(dk)+'">';
  return '<label class="opt" id="optrow-'+i+'">'+inp+'<span class="opt-key">'+letterKey(dk)+'.</span><span class="opt-text">'+esc(o.t)+'</span></label>';
}
function answerHtml(ex){
  var h = '';
  var i;
  if(ex.type === 'mcq'){
    h = '<div class="optlist" id="answidget">' + ex._optOrder.map(function(oi){ return optRowHtml(ex, oi, 'mcq'); }).join('') + '</div>';
  } else if(ex.type === 'logview'){
    var lines0 = ex.log.map(function(l,i){ return '<div class="ln" data-ln="'+i+'">'+hl(l)+'</div>'; }).join('');
    h = '<div id="answidget"><div class="logtool"><div class="logbar"><span class="lg-title">☰ '+esc(ex.logTitle||'log viewer')+'</span><input id="logfilter" placeholder="'+esc(ex.filterPlaceholder||'filter lines...')+'" aria-label="Filter log lines" oninput="logFilter()"></div><div class="loglines" id="loglines">'+lines0+'</div></div>'+
      '<div class="optlist" style="margin-top:12px">' + ex._optOrder.map(function(oi){ return optRowHtml(ex, oi, ex.multi?'multi':'mcq'); }).join('') + '</div></div>';
  } else if(ex.type === 'multi'){
    h = '<div class="optlist" id="answidget">' + ex._optOrder.map(function(oi){ return optRowHtml(ex, oi, 'multi'); }).join('') + '</div>';
  } else if(ex.type === 'match'){
    var rows = ex.left.map(function(L, li){
      var opts = '<option value="">— choose a match —</option>' + ex._rightOrder.map(function(ri){
        var r = ex.right[ri];
        return '<option value="'+ri+'">'+esc(r.t)+'</option>';
      }).join('');
      return '<div class="matchrow"><span class="m-left">'+esc(L.t)+'</span><select class="anssel" id="match-'+li+'" onchange="pickMatch()" aria-label="Match for item '+(li+1)+'">'+opts+'</select></div>';
    }).join('');
    h = '<div id="answidget">'+rows+'<p class="kw-note">⇄ Matching: each correct pair earns its own credit; a wrong pair subtracts.</p></div>';
  } else if(ex.type === 'dnd'){
    var bank = ex._bankOrder.map(function(bi){
      var b = ex.bank[bi];
      return '<button type="button" class="chip" draggable="true" data-bank="'+bi+'" id="chip-'+bi+'" onclick="chipClick('+bi+')" ondragstart="chipDrag(event,'+bi+')">'+esc(b.t)+'</button>';
    }).join('');
    var zones = ex.zones.map(function(z, zi){
      return '<div class="zone" id="zone-'+zi+'" data-zone="'+zi+'" onclick="zoneClick('+zi+')" ondragover="zoneDragOver(event,'+zi+')" ondragleave="zoneDragLeave(event)" ondrop="zoneDrop(event,'+zi+')"><h5>⬇ '+esc(z.name)+'</h5><div class="zone-slot" id="zoneslot-'+zi+'"></div></div>';
    }).join('');
    h = '<div id="answidget"><div class="dndwrap"><div class="dndbank"><h4>✥ ITEM BANK (click a chip, then click a zone — or drag)</h4><div id="bank">'+bank+'</div></div><div class="zones">'+zones+'</div></div><p class="kw-note">✥ Each correctly filled zone earns its own credit; a wrongly filled zone subtracts.</p></div>';
  } else if(ex.type === 'order'){
    h = '<div id="answidget"><ul class="seq" id="seqlist"></ul><p class="kw-note">↕ Put the steps in the correct order. Every step in its correct position earns credit.</p></div>';
  } else if(ex.type === 'fib'){
    var parts = ex.template.split(/\{b(\d+)\}/);
    var htmlp = '';
    for(var k=0;k<parts.length;k++){
      if(k%2===1){ htmlp += '<input class="blank-in" id="blank-'+parts[k]+'" size="'+(ex.blanks[parseInt(parts[k],10)].width||18)+'" autocomplete="off" spellcheck="false" aria-label="Blank '+(parseInt(parts[k],10)+1)+'" oninput="pickFib()">'; }
      else { htmlp += esc(parts[k]); }
    }
    h = '<div id="answidget" class="blanks">'+htmlp+'</div>';
  } else if(ex.type === 'terminal'){
    var panel = '';
    if(ex.cmd.syntaxPanel){ panel = '<div class="syntaxpanel"><span class="sp-title">SYNTAX REMINDER</span><pre class="mono" style="background:transparent;border:none;padding:6px 0 0 0;margin:0">'+hl(ex.cmd.syntaxPanel)+'</pre></div>'; }
    if(ex.cmd.timeLimit){ panel += '<p class="term-clock" id="termclock">⏱ This terminal has its own ' + Math.floor(ex.cmd.timeLimit/60) + ':' + (ex.cmd.timeLimit%60<10?'0':'')+(ex.cmd.timeLimit%60) + ' budget — it pauses with the exam timer.</p>'; }
    h = '<div id="answidget">'+panel+
      '<div class="shell"><div class="scroll" id="shelllog">'+ ex._log.map(function(l){ return '<div class="'+(l.err?'out-err':'out-ok')+'">'+hl(l.t)+'</div>'; }).join('') +'</div>'+
      '<div class="promptline"><span class="prompt">'+esc(ex.cmd.prompt)+'</span><input id="shellin" autocomplete="off" spellcheck="false" aria-label="Terminal input" onkeydown="if(event.key===\'Enter\'){shellRun();}"><button type="button" class="btn ghost answerctl" onclick="shellRun()" style="min-height:44px">↵ Run</button></div>'+
      '</div>'+
      '<div class="btnrow"><button type="button" class="btn green answerctl" id="termcheck" onclick="gradeCurrent()">✓ Check</button></div></div>';
  } else if(ex.type === 'branch'){
    h = '<div id="answidget"></div>';
  } else if(ex.type === 'triage'){
    var rows = ex.rows.map(function(r, ri){
      var opts = '<option value="">— choose a disposition —</option>' + r.options.map(function(o,oi){ return '<option value="'+oi+'">'+esc(o)+'</option>'; }).join('');
      return '<div class="trirrow"><span class="t-alert">'+esc(r.alert)+'</span><select class="anssel" id="tri-'+ri+'" onchange="pickTriage()" aria-label="Disposition for alert '+(ri+1)+'">'+opts+'</select><span class="t-detail">'+esc(r.detail)+'</span></div>';
    }).join('');
    h = '<div id="answidget">'+rows+'</div>';
  }
  return h;
}

/* ---------- grading ---------- */
function applyHintPenalty(credit, ex){
  if(ex._hintUsed){ return Math.max(0, credit - 0.10); }
  return credit;
}
function gradeCurrent(){
  if(S.screen !== 'exam' && S.screen !== 'open'){ return; }
  var ex = curEx();
  if(ex._checked){ return; }
  if(ex.type === 'branch' && ex._step < ex.steps.length){
    var fb = $('fback');
    if(fb){ fb.innerHTML = '<div class="hintpanel"><span class="hint-tag">⏳ NOT FINISHED YET</span>Confirm every step of this decision first (the timer keeps running while you decide). The Check button unlocks after the final step.</div>'; }
    return;
  }
  var res = gradeEx(ex);
  ex._items = res.items;
  ex._dangerous = res.dangerous || false;
  ex._credit = applyHintPenalty(res.credit, ex);
  ex._checked = true;
  S.creditSum += ex._credit;
  S.answered += 1;
  S.checkedCount += 1;
  var idx = EXS.indexOf(ex);
  var poolIdx = S.skipped.indexOf(idx);
  if(poolIdx >= 0){ S.skipped.splice(poolIdx, 1); }
  if(T.state === 'RUNNING'){ setTState('PAUSED_AUTO_CHECK'); }
  renderFeedback(ex, res);
  lockAnswer();
  updateHeader();
}

  var cls = state==='correct' ? 'st-correct' : (state==='wrong' ? 'st-incorrect' : 'st-skipped');

    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT ANSWER</span>'+esc(letterKey(dispKey(ex,ci))+'. '+ex.options[ci].t)+'</div>';

  } else if(ex.type === 'fib'){
    var ca = ex.blanks.map(function(b,i){ return esc(b.accept[0]); }).join(' | ');

  } else if(ex.type === 'dnd'){

    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT PLACEMENTS</span>'+dc+'</div>';

    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT DISPOSITIONS</span>'+tc+'</div>';
  } else if(ex.type === 'multi' || (ex.type === 'logview' && ex.multi)){
    var oc2 = ex.options.map(function(o,i){ return o.correct ? esc(letterKey(dispKey(ex,i))+'. '+o.t) : null; }).filter(Boolean).join('<br>');
    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT ANSWERS</span>'+oc2+'</div>';

  var cc = $('copycanon');

function isLastGraded(){
  return S.cur >= EXS.length - 1;
}
function copyCmd(btn, txt){
  var done = function(){ btn.textContent = '✓ Copied'; setTimeout(function(){ btn.textContent = '⧉ Copy'; }, 1500); };

    navigator.clipboard.writeText(txt).then(done, done);
  } else { done(); }
}

/* ---------- per-type grading ---------- */
function gradeEx(ex){
  var items = [], H=0, W=0, N=0, dangerous=false;
  var i, j;
  if(ex.type === 'mcq'){
    N = 1;
    var sel = getMcqSel();
    var ci = ex.options.map(function(o,k){ return o.correct ? k : -1; }).filter(function(k){ return k>=0; })[0];
    if(sel === ci){ H = 1; items.push({state:'correct', label:'Option '+letterKey(dispKey(ex,ci)), note:ex.options[ci].why}); }
    else if(sel >= 0){ W = 1; items.push({state:'wrong', label:'Option '+letterKey(dispKey(ex,sel)), note:ex.options[sel].why}); }
    else { items.push({state:'missed', label:'Option '+letterKey(dispKey(ex,ci)), note:ex.options[ci].why}); }
  } else if(ex.type === 'multi' || ex.type === 'logview'){
    var sel2 = getMultiSel();
    ex.options.forEach(function(o,k){
      var picked = sel2.indexOf(k) >= 0;
      if(o.correct){
        N += 1;
        if(picked){ H += 1; items.push({state:'correct', label:'Option '+letterKey(dispKey(ex,k)), note:o.why}); }
        else { items.push({state:'missed', label:'Option '+letterKey(dispKey(ex,k)), note:o.why}); }
      } else if(picked){
        W += 1; items.push({state:'wrong', label:'Option '+letterKey(dispKey(ex,k)), note:o.why});
      }
    });
  } else if(ex.type === 'match'){
    N = ex.left.length;
    ex.left.forEach(function(L, li){
      var v = $('match-'+li) ? parseInt($('match-'+li).value,10) : NaN;
      if(v === L.match){ H += 1; items.push({state:'correct', label:L.t+' → '+ex.right[L.match].t, note:L.why}); }
      else if(!isNaN(v) && $('match-'+li).value !== ''){ W += 1; items.push({state:'wrong', label:L.t+' → '+ex.right[v].t, note:(ex.right[v].why || L.whyMiss || 'That pairing is not correct here. '+L.why)}); }
      else { items.push({state:'missed', label:L.t+' → '+ex.right[L.match].t, note:L.why}); }
    });
  } else if(ex.type === 'dnd'){
    N = ex.zones.length;
    ex.zones.forEach(function(z, zi){
      var placed = ex._ans && ex._ans[zi] !== undefined ? ex._ans[zi] : null;
      if(placed !== null && placed === z.accepts[0]){ H += 1; items.push({state:'correct', label:z.name+' ← '+ex.bank[placed].t, note:z.why}); }
      else if(placed !== null){ W += 1; items.push({state:'wrong', label:z.name+' ← '+ex.bank[placed].t, note:(ex.bank[placed].whyMiss || z.why)}); }
      else { items.push({state:'missed', label:z.name+' ← '+ex.bank[z.accepts[0]].t, note:z.why}); }
    });
  } else if(ex.type === 'order'){
    N = ex.sequence.length;
    ex._seq.forEach(function(t, pos){
      var correctHere = (ex.sequence[pos] === t);
      if(correctHere){ H += 1; items.push({state:'correct', label:'Position '+(pos+1)+': '+t, note:ex.orderWhy ? ex.orderWhy[pos] : 'This step belongs in position '+(pos+1)+'.'}); }
      else { W += 1; items.push({state:'wrong', label:'Position '+(pos+1)+': '+t, note:'Expected: '+ex.sequence[pos]+'. '+(ex.orderWhy ? ex.orderWhy[pos] : '')}); }
    });
  } else if(ex.type === 'fib'){
    N = ex.blanks.length;
    ex.blanks.forEach(function(b, bi){
      var el = $('blank-'+bi);
      var val = el ? normTxt(el.value) : '';
      var ok = b.accept.map(normTxt).indexOf(val) >= 0;
      if(ok){ H += 1; items.push({state:'correct', label:'Blank '+(bi+1)+': '+b.accept[0], note:b.why}); }
      else if(val !== ''){ W += 1; items.push({state:'wrong', label:'Blank '+(bi+1)+': '+el.value, note:b.whyMiss || b.why}); }
      else { items.push({state:'missed', label:'Blank '+(bi+1)+': '+b.accept[0], note:b.why}); }
    });
  } else if(ex.type === 'terminal'){
    N = ex.cmd.elements.length;
    var norm = ex._lastCmd || '';
    ex.cmd.elements.forEach(function(el2){
      var re = new RegExp(el2.re);
      if(re.test(norm)){ H += 1; items.push({state:'correct', label:el2.label, note:el2.why}); }
      else { items.push({state:'missed', label:el2.label, note:el2.why}); }
    });
    (ex.cmd.forbidden || []).forEach(function(f){
      var re = new RegExp(f.re);
      if(re.test(norm)){ W += 1; dangerous = true; items.push({state:'wrong', label:'Used: '+f.label, note:f.why}); }
    });
    if(!norm){ items.unshift({state:'missed', label:'No command was submitted', note:'Type the command and press Run, then Check.'}); }
  } else if(ex.type === 'branch'){
    N = ex.steps.length;
    ex.steps.forEach(function(st2, si2){
      var pick = ex._picks[si2];
      var ci2 = st2.options.map(function(o,k){ return o.correct ? k : -1; }).filter(function(k){ return k>=0; })[0];
      if(pick === ci2){ H += 1; items.push({state:'correct', label:'Step '+(si2+1), note:st2.options[ci2].why}); }
      else if(pick !== undefined && pick !== null){ W += 1; items.push({state:'wrong', label:'Step '+(si2+1), note:st2.options[pick].why}); }
      else { items.push({state:'missed', label:'Step '+(si2+1), note:st2.options[ci2].why}); }
    });
  } else if(ex.type === 'triage'){
    N = ex.rows.length;
    ex.rows.forEach(function(r, ri){
      var el3 = $('tri-'+ri);
      var v = el3 && el3.value !== '' ? parseInt(el3.value,10) : null;
      if(v === r.correctIndex){ H += 1; items.push({state:'correct', label:'Alert '+(ri+1), note:r.why}); }
      else if(v !== null){ W += 1; items.push({state:'wrong', label:'Alert '+(ri+1), note:(r.whyNot && r.whyNot[v] ? r.whyNot[v] : r.why)}); }
      else { items.push({state:'missed', label:'Alert '+(ri+1)+': '+r.options[r.correctIndex], note:r.why}); }
    });
  }
  return { credit: scoreExercise(H, W, N), h:H, w:W, n:N, items:items, dangerous:dangerous };
}

/* ---------- interactions per type ---------- */
function pickMatch(){ /* nothing needed pre-check */ }
function pickFib(){ /* nothing needed pre-check */ }
function pickTriage(){ /* nothing needed pre-check */ }
var armedChip = null;
function chipClick(bi){
  if(curEx()._checked){ return; }
  var chip = $('chip-'+bi);
  if(!chip){ return; }
  if(chip.closest('.zone')){ returnToBank(bi); return; }
  if(armedChip === bi){ chip.classList.remove('armed'); armedChip = null; return; }
  document.querySelectorAll('.chip.armed').forEach(function(c){ c.classList.remove('armed'); });
  armedChip = bi;
  chip.classList.add('armed');
  chip.innerHTML = esc(curEx().bank[bi].t) + ' <span class="chip-armprompt">CLICK A ZONE ▸</span>';
}
function zoneClick(zi){
  if(curEx()._checked){ return; }
  if(armedChip === null){ returnToBankFromZone(zi); return; }
  placeChip(armedChip, zi);
  armedChip = null;
}
function placeChip(bi, zi){
  curEx()._ans = curEx()._ans || {};
  var prevZone = null;
  Object.keys(curEx()._ans).forEach(function(k){ if(curEx()._ans[k] === bi){ prevZone = k; } });
  if(prevZone !== null && String(prevZone) !== String(zi)){ delete curEx()._ans[prevZone]; $('zoneslot-'+prevZone).innerHTML = ''; }
  curEx()._ans[zi] = bi;
  $('zoneslot-'+zi).innerHTML = '<span class="chip" data-inzone="'+bi+'">'+esc(curEx().bank[bi].t)+' <small style="color:var(--text-secondary)">✕ remove</small></span>';
  var chip = $('chip-'+bi);
  if(chip){ chip.classList.add('hidden'); chip.classList.remove('armed'); }
}
function returnToBank(bi){
  var ex = curEx();
  Object.keys(ex._ans || {}).forEach(function(k){ if(ex._ans[k] === bi){ delete ex._ans[k]; $('zoneslot-'+k).innerHTML=''; } });
  var chip = $('chip-'+bi); if(chip){ chip.classList.remove('hidden'); }
}
function returnToBankFromZone(zi){
  var ex = curEx();
  var bi = ex._ans && ex._ans[zi];
  if(bi === undefined || bi === null){ return; }
  returnToBank(bi);
}
function chipDrag(ev, bi){ ev.dataTransfer.setData('text/plain', String(bi)); armedChip = bi; }
function zoneDragOver(ev, zi){ ev.preventDefault(); $('zone-'+zi).classList.add('dragover'); }
function zoneDragLeave(ev){ ev.target.classList && ev.target.classList.remove('dragover'); }
function zoneDrop(ev, zi){
  ev.preventDefault();
  $('zone-'+zi).classList.remove('dragover');
  var bi = parseInt(ev.dataTransfer.getData('text/plain'),10);
  if(!isNaN(bi)){ placeChip(bi, zi); armedChip = null; }
}
function seqMove(i, dir){
  var ex = curEx();
  if(ex._checked){ return; }
  var j = i + dir;
  if(j < 0 || j >= ex._seq.length){ return; }
  var t = ex._seq[i]; ex._seq[i] = ex._seq[j]; ex._seq[j] = t;
  renderSeqList();
}
function shellRun(){
  var ex = curEx();
  var inp = $('shellin');
  if(!inp || inp.disabled){ return; }
  var raw = inp.value;
  if(!raw.trim()){ return; }
  var norm = raw.trim().replace(/\s+/g,' ').toLowerCase();
  ex._lastCmd = norm;
  ex._log.push({t: ex.cmd.prompt + ' ' + raw, err:false});
  var out = null;
  (ex.cmd.outputs || []).forEach(function(o){
    if(!out && new RegExp(o.re).test(norm)){ out = o; }
  });
  if(out){ out.lines.forEach(function(l){ ex._log.push({t:l, err:false}); }); }
  else { ex._log.push({t: ex.cmd.unknown || 'command not recognized for this simulation — check spelling and options', err:true}); }
  renderExercise();
  var lg = $('shelllog'); if(lg){ lg.scrollTop = lg.scrollHeight; }
  var si2 = $('shellin'); if(si2 && !si2.disabled){ si2.focus(); }
}
function logFilter(){
  var q = ($('logfilter').value || '').toLowerCase();
  document.querySelectorAll('#loglines .ln').forEach(function(ln){
    ln.style.display = (!q || ln.textContent.toLowerCase().indexOf(q) >= 0) ? '' : 'none';
  });
}
function renderBranchStep(){
  var ex = curEx();
  var area = $('answidget');
  if(!area){ return; }
  var htmlp = '';
  ex.steps.forEach(function(st2, si2){
    if(si2 > ex._step){ return; }
    var opts = st2.options.map(function(o, oi){
      var selCls = (ex._picks[si2] === oi) ? ' selected' : '';
      return '<label class="opt'+selCls+'" style="margin:6px 0"><input type="radio" name="bstep'+si2+'" value="'+oi+'" '+(ex._picks[si2]===oi?'checked':'')+' onchange="branchPick('+si2+','+oi+')"><span class="opt-key">'+String.fromCharCode(65+oi)+'.</span><span class="opt-text">'+esc(o.t)+'</span></label>';
    }).join('');
    var outcome = (ex._picks[si2] !== undefined && ex._picks[si2] !== null && si2 < ex._step) ?
      '<div class="outcome'+((ex._picks[si2]!==undefined && st2.options[ex._picks[si2]].outcomeBad)?' bad':'')+'">▸ '+esc(st2.options[ex._picks[si2]].outcome)+'</div>' : '';
    htmlp += '<div class="step"><span class="step-tag">STEP '+(si2+1)+' OF '+ex.steps.length+'</span><div class="step-text">'+esc(st2.text)+'</div>'+opts+outcome+
      (si2 === ex._step && ex._picks[si2] === undefined ? '<button class="btn ghost" style="margin-top:8px" onclick="branchConfirm('+si2+')">▸ Confirm step '+(si2+1)+' (does not stop the timer)</button>' : '')+
      '</div>';
  });
  if(ex._step >= ex.steps.length && !ex._checked){
    htmlp += '<div class="btnrow"><button class="btn green" onclick="gradeCurrent()">✓ Check — grade all '+ex.steps.length+' decisions</button></div>';
  }
  area.innerHTML = htmlp;
}
function branchPick(si2, oi){
  var ex = curEx();
  if(ex._checked || si2 !== ex._step){ return; }
  ex._pendingPick = oi;
  document.querySelectorAll('input[name="bstep'+si2+'"]').forEach(function(el){ var r = el.closest('.opt'); if(r){ r.classList.toggle('selected', el.checked); } });
}
function branchConfirm(si2){
  var ex = curEx();
  var picked = ex._pendingPick;
  if(picked === undefined || picked === null){ return; }
  ex._picks[si2] = picked;
  ex._pendingPick = null;
  ex._step = si2 + 1;
  renderBranchStep();
  updateCheckState();
}

/* ---------- flow: pause / skip / hint / next / review / results ---------- */
var flowLock = false;
function flowLockAcquire(){
  if(flowLock){ return false; }
  flowLock = true;
  return true;
}
function flowLockRelease(){ flowLock = false; }
function pauseManual(){
  if(!T || T.state === 'ENDED'){ return; }
  if(T.state === 'PAUSED_MANUAL'){ return; }
  T.prevState = T.state;
  setTState('PAUSED_MANUAL');
  var ov = document.createElement('div');
  ov.id = 'pauseoverlay';
  ov.innerHTML = '<div class="pausecard"><div class="pico">⏸</div><h2>PAUSED — manual</h2><p>The exercise is hidden and the timer is stopped. Press Resume when you are ready to continue.</p><button class="btn primary" id="btn-resume" onclick="resumeManual()">▶ Resume</button></div>';
  document.body.appendChild(ov);
  var ex = $('exarea'); if(ex){ ex.style.visibility = 'hidden'; }
}
function resumeManual(){
  var ov = $('pauseoverlay'); if(ov){ ov.remove(); }
  var ex = $('exarea'); if(ex){ ex.style.visibility = 'visible'; }
  setTState(T.prevState === 'PAUSED_AUTO_CHECK' ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
}
function doHint(){
  if(S.screen !== 'exam' && S.screen !== 'open'){ return; }
  var ex = curEx();
  if(!ex || ex._hintUsed || ex._checked){ return; }
  ex._hintUsed = true;
  var hp = document.createElement('div');
  hp.className = 'hintpanel';
  hp.innerHTML = '<span class="hint-tag">💡 HINT (one per exercise — costs 10% of this exercise\u2019s credit)</span>' + esc(ex.hint);
  var blk = document.querySelector('.blk.answer .blk-body');
  if(blk){ blk.insertBefore(hp, blk.firstChild); }
  $('btn-hint').disabled = true;
}
function doSkip(){
  if(S.screen !== 'exam'){ return; }
  if(!flowLockAcquire()){ return; }
  var ex = curEx();
  if(!ex || ex._checked){ flowLockRelease(); return; }
  var idx = EXS.indexOf(ex);
  if(S.skipped.indexOf(idx) < 0){ S.skipped.push(idx); }
  if(S.cur < EXS.length - 1){ S.cur += 1; renderExercise(); }
  else { flowLockRelease(); openReview(); }
}
function goNext(){
  if(!flowLockAcquire()){ return; }
  if(T.state === 'PAUSED_AUTO_CHECK'){ setTState('RUNNING'); }
  if(S.screen === 'open'){
    S.screen = 'review';
    openReview();
    return;
  }
  if(S.cur < EXS.length - 1){ S.cur += 1; renderExercise(); }
  else { flowLockRelease(); finishAttempt(false); }
}
function openReview(){
  flowLockRelease();
  S.screen = 'review';
  S.reviewing = null;
  if(T.state === 'PAUSED_AUTO_CHECK'){ setTState('RUNNING'); }
  updateHeader();
  var items = S.skipped.map(function(idx, pos){
    var ex = EXS[idx];
    return '<li><span class="statechip st-skipped">⚠ Skipped</span><span class="rv-title">'+esc(ex.title)+'</span><button class="btn primary" onclick="openSkipped('+pos+')">↩ Open and answer</button></li>';
  }).join('');
  $('exarea').innerHTML =
    '<div class="card"><h2>⚠ Review skipped exercises ('+S.skipped.length+')</h2>'+
    '<p style="color:var(--text-secondary)">The timer is still running. You can open each skipped exercise as many times as you need until the timer ends or you submit. If you submit now, every skipped-and-never-answered exercise is excluded from the score — it does not count as correct or wrong.</p>'+
    (S.skipped.length ? '<ul class="reviewlist">'+items+'</ul>' : '<p>Nothing left here — you answered everything.</p>')+
    '<div class="btnrow"><button class="btn danger" onclick="showResults()">⏹ Submit exam now</button></div></div>';
  window.scrollTo(0,0);
}
function openSkipped(pos){
  var idx = S.skipped[pos];
  var ordPos = S.order.indexOf(idx);
  if(ordPos < 0){ ordPos = 0; }
  S.cur = ordPos;
  S.reviewPos = pos;
  S.screen = 'open';
  renderExercise();
}
function finishAttempt(auto){
  if(T.iv){ clearInterval(T.iv); }
  var anySkipped = S.skipped.length > 0;
  if(!auto && anySkipped && S.screen === 'exam'){
    openReview();
    return;
  }
  showResults();
}
function showResults(){
  flowLockRelease();
  if(S.screen === 'results'){ return; }
  if(T.iv){ clearInterval(T.iv); }
  setTState('ENDED');
  S.screen = 'results';
  var fully = 0, partial = 0, partialSum = 0, incorrect = 0, skippedN = 0, answeredN = 0;
  EXS.forEach(function(ex){
    if(ex._checked){
      answeredN += 1;
      if(ex._credit >= 1){ fully += 1; }
      else if(ex._credit > 0){ partial += 1; partialSum += ex._credit; }
      else { incorrect += 1; }
    } else { skippedN += 1; }
  });
  var sum = 0;
  EXS.forEach(function(ex){ if(ex._checked){ sum += ex._credit; } });
  var pct = answeredN > 0 ? Math.round((sum / answeredN) * 100) : 0;
  var passed = pct >= META.passMark && answeredN > 0;
  var avgP = partial > 0 ? round1(partialSum / partial).toFixed(2) : '0.00';
  var mins = Math.floor((META.timerMinutes*60 - T.remaining) / 60);
  var cert = passed ?
    '<div class="cert pass"><h2>✓ PASS</h2><p>You reached <b>'+pct+'%</b>, which is at or above the '+META.passMark+'% pass mark. Your result has been reported to the site.</p></div>' :
    '<div class="cert fail"><h2>✗ FAIL</h2><p>You reached <b>'+pct+'%</b>, below the '+META.passMark+'% pass mark. You must retake the exam to pass.</p></div>';
  $('app').innerHTML =
    '<div class="card"><h1>Results — '+esc(META.title)+'</h1>'+
    '<p style="color:var(--text-secondary)">Score computed over <b>'+answeredN+'</b> answered exercise(s). '+skippedN+' skipped-and-never-answered exercise(s) were excluded from both the score and the maximum.</p>'+
    '<div class="factrow"><span class="fact">◎ <span>Final score: <b>'+sum.toFixed(1)+' / '+answeredN+'</b> — <b>'+pct+'%</b></span></span><span class="fact">⏱ <span>timer used: <b>'+mins+' min</b> of '+META.timerMinutes+'</span></span></div>'+
    '</div>'+
    cert+
    '<div class="resultgrid">'+
    '<div class="rcard"><div class="rc-num st-correct">✓ '+fully+'</div><div class="rc-lab">Fully correct (credit 1.0)</div></div>'+
    '<div class="rcard"><div class="rc-num st-partial">✓ '+partial+'</div><div class="rc-lab">Partially correct (avg credit '+avgP+')</div></div>'+
    '<div class="rcard"><div class="rc-num st-incorrect">✗ '+incorrect+'</div><div class="rc-lab">Fully incorrect (credit 0)</div></div>'+
    '<div class="rcard"><div class="rc-num st-skipped">⚠ '+skippedN+'</div><div class="rc-lab">Skipped — excluded</div></div>'+
    '</div>'+
    '<div class="card"><h2>How your time was spent</h2><p class="pauselog">⏸ Total time paused manually (exercise hidden): <b class="mono">'+T.manualTotal+' s</b><br>⏸ Total time paused for feedback review (Check auto-pause): <b class="mono">'+T.autoTotal+' s</b></p></div>'+
    '<div class="btnrow"><button class="btn primary" id="retakebtn" onclick="retake()">↻ Retake Exam</button></div>';
  window.scrollTo(0,0);
  if(!S.reported){
    S.reported = true;
    reportScore(sum, answeredN);
  }
}
function reportScore(creditSum, answeredCount){
  var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent >= META.passMark
    }, location.origin);
  } catch(e) { /* Opened directly rather than inside the site. */ }
}
function retake(){
  var init = S ? S.init : null;
  startAttempt();
  S.init = init;
  updateHeader();
}

/* ---------- handshake & boot ---------- */
window.addEventListener('message', function (event) {
  if (!event.data) { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  S = S || { init: null };
  S.init = {
    username: event.data.username || '',
    country: event.data.country || '',
    locale: event.data.locale || 'en',
    theme: event.data.theme || 'dark' /* always 'dark'; the file is dark-only, nothing to switch */
  };
  var uc = document.querySelector('.userchip');
  if (S.init.username && !uc) {
    var hero = document.querySelector('.factrow');
    if (hero) {
      var chip = document.createElement('span');
      chip.className = 'userchip';
      chip.textContent = '👤 Analyst: ' + S.init.username;
      hero.appendChild(chip);
    }
  }
});
S = { init: null };
renderIntro();
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
