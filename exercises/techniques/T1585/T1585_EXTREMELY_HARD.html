<style>

.termWrap{border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#070d1a}

.termHead .dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}

.redTimer{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-weight:700;color:var(--sev-extreme);border:1px solid var(--sev-extreme);background:rgba(239,68,68,.1);padding:4px 10px;border-radius:8px;font-size:.85rem}

.lvFilter{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}

.repRow .hd .t{font-weight:700;font-size:.93rem}
.repRow .bd{margin-top:8px;font-size:.9rem;color:#d7e1f3;border-top:1px dashed var(--line);padding-top:8px}
.repRow .bd .lbl{color:var(--cyan);font-weight:700}
.repRow.exc{opacity:.75}
.verdict{font-weight:800;font-size:.8rem;padding:2px 9px;border-radius:999px;white-space:nowrap}

.v-mid{color:var(--warn);border:1px solid var(--warn)} .v-exc{color:var(--faint);border:1px solid var(--faint)}

.themeStrip{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

  *{transition:none !important;animation:none !important;scroll-behavior:auto !important}

  object: { id: 'T1585', name: 'Establish Accounts' },
  intro: {
    objectHtml: '<p><b>The technique under pressure.</b> T1585 — Establish Accounts (Resource Development, platform PRE) is the adversary behaviour of creating and cultivating accounts — social media, email, cloud — to build personas used during targeting. Everything you mastered in the lower tiers is assumed here. This tier is the senior desk: conflicting signals that must be weighed against each other, artefacts that contain realistic noise and deliberate gaps, and decisions where every option costs something.</p>' +
      '<p>The anchor points stay the same. The ATT&amp;CK page says personas may be fictitious or impersonate real people and may span many sites; email accounts feed Phishing and register other services; cloud accounts host payloads and acquire servers, typically on top of a fresh mailbox. M1056 Pre-compromise tells you prevention is mostly out of reach. Detection strategies DET0873 / DET0851 / DET0835 / DET0846 tell you where the ripples appear — or tell you to watch the next lifecycle stage instead. What changes at this tier is the <i>judgement</i>: which signal wins, whether to act at all yet, and what the business can afford.</p>',
    workHtml: '<p>Where senior staff actually use this technique\u2019s knowledge:</p>' +
      '<ul>' +
      '<li><b>Senior SOC / IR lead.</b> A CTO-impersonation persona is live and PR wants a statement in ten minutes. You decide what is said, what is kept quiet, and what is watched instead of acted on.</li>' +
      '<li><b>Senior CTI analyst.</b> You write the attribution line: what confidence, based on which habits, with which caveat — because the report will be quoted in board packs and maybe in court.</li>' +
      '<li><b>Detection engineering lead.</b> You approve analytics with scoping (recency, volume, affiliation claims) and refuse \u201Cbest practice\u201D rules that break the business.</li>' +
      '<li><b>Forensics / evidence custodian.</b> You preserve a trial tenant\u2019s volatile audit trail before an adversary deletes it — safe command first, destructive command never.</li>' +
      '</ul>' +
      '<p><b>The risk addressed:</b> pre-compromise resource development is invisible to preventive control, so the senior decision is not \u201Cwhich tool blocks this?\u201D but \u201Cwhich action buys the most safety for its cost — and when is watching worth more than acting?\u201D</p>',
    rulesHtml: '<ul>' +
      '<li><b>Pass mark: 70%</b>, computed only over answered exercises; skipped-and-unanswered items are excluded from both sides of the fraction.</li>' +
      '<li><b>Exercise types:</b> three- and four-step decision chains, a mixed-feed log viewer, drag ranking with business cost, an executive memo, three multiple-choice items, and two simulated terminals.</li>' +
      '<li><b>Terminals run on a reduced timer</b> — a red countdown starts the first time you type in the shell. You will be told before each one starts. Typos are not tolerated; whitespace is normalised.</li>' +
      '<li><b>At least one destructive command exists in each terminal\u2019s option space.</b> The safe command is always the correct one; the feedback explains exactly what the destructive one would have destroyed.</li>' +
      '<li><b>Timer:</b> 50 minutes total, pausable; pausing hides the exercise. Expiry auto-submits.</li>' +
      '<li><b>Hints:</b> \u221210% each; at this tier a hint only restates a constraint you may have missed. It never points at the answer.</li>' +
      '</ul>',
    severityNote: 'chain reasoning across three or more concepts, at least one ambiguous or conflicting signal per exercise, and answers whose real cost you must accept.'
  },
  keywords: [
    { t: 'Judgement anchors', d: 'T1585 creation vs use stage; sub-technique by service (social .001 / email .002 / cloud .003); impersonation of real people; cross-platform cultivation.' },
    { t: 'Conflicting signals', d: 'internal provisioning vs external impersonation; template habits vs targeting overlap; sandbox \u201Cno family\u201D vs custom strings; PR deadline vs collection value.' },
    { t: 'Detection & analytics', d: 'DET0873/AN2005; DET0851/AN1983; DET0835/AN1967; DET0846/AN1978; downstream-stage focus; scoped analytics (recency, volume, affiliation claims).' },
    { t: 'Attribution discipline', d: 'cluster on operator habits; confidence levels; one reused element per network claim; report wording that survives scrutiny.' },
    { t: 'Evidence & terminals', d: 'dc3dd image with hash and log; saasctl audit-export before user disable; destructive alternatives (shred, delete, dd of=/dev/zero) named and explained.' },
    { t: 'Cost of action', d: 'takedowns tip operators and end collection; blanket blocks stall recruiting; public naming has legal and alerting costs.' },
    { t: 'Real examples', d: 'Contagious Interview repo personas; CURIUM persona networks; Salesforce Data Exfiltration trial accounts; Storm-1811 Teams helpdesk accounts.' }
  ],
  exercises: [
    {
      id: 'X1', theme: 5, type: 'steps', typeLabel: 'CISO decision — three steps', points: 15,
      hint: 'The PR clock is a constraint, not evidence. Weigh operator habits against targeting, and remember what a takedown ends.',
      scenario: {
        title: 'SEC-1 — CTO impersonation, live',
        summary: 'Five artefacts, one decision in ten minutes',
        parts: [
          { label: 'ARTEFACT 1 — Executive escalation, 09:41', text: 'From: CTO office. \u201CA LinkedIn profile \u2018Daniel Reyes \u2014 CTO, Novacruit Group\u2019 uses our CTO\u2019s conference photo and title. Two investors accepted its connection request this morning. PR wants a public statement in 10 minutes.\u201D' },
          { label: 'ARTEFACT 2 — Brand monitoring', text: 'Second profile @d.reyes.cto on X, created 5 days ago, same photo, same \u201Cscaling Novacruit\u201D bio line. Bio template matches the profile that targeted two sector peers in March.' },
          { label: 'ARTEFACT 3 — Tenant audit', text: 'trial-0412 registered on our SaaS vendor 3 days ago; recovery mailbox reyes.cto@freshmail-dsp[.]net created 40 minutes before sign-up; no activity yet beyond sign-up.' },
          { label: 'ARTEFACT 4 — CTI note', text: 'Cluster \u201CDustyDrain\u201D ran executive-impersonation personas against two peers; their recovery mailboxes came from the same disposable provider; their lures differed (invoices there, investor chats here). No malware seen in either wave.' },
          { label: 'ARTEFACT 5 — Incomplete data', text: 'The conference photo\u2019s origin could not be confirmed (EXIF unavailable); the LinkedIn profile view is capped by the platform for logged-out visitors.' }
        ],
        collapsed: true
      },
      steps: [
        {
          question: 'Which evidence line carries the most weight for linking this activity to DustyDrain?',
          widget: {
            kind: 'mcq', correct: 2,
            options: [
              'The sector match: DustyDrain ran the same play against peers in our industry',
              'The photo EXIF gap, which shows the operators are careful professionals',
              'The registration habit: recovery mailbox made ~40 minutes before sign-up at the same disposable provider',
              'The PR deadline pressure, which proves an active campaign against us'
            ]
          },
          explain: 'Habits cluster; context does not. The 40-minute mailbox-to-sign-up gap at the same disposable provider is the registration signature that also appears in the March wave. Sector overlap is weak — it is true of half the internet. The EXIF gap is an information gap, not evidence of sophistication, and PR pressure is your calendar, not their fingerprint.',
          study: 'One habit signature outweighs three context statements; write it that way in every attribution line.'
        },
        {
          question: 'The CISO asks: \u201CDo we take the trial account down now?\u201D What is the best answer for the first 24 hours?',
          widget: {
            kind: 'mcq', correct: 1,
            options: [
              'Yes — delete the trial account and issue takedown requests at once, before investors are contacted',
              'Not yet — watch the persona and tenant, warn the executives and investors, queue coordinated reports',
              'Do nothing at all and say nothing — impersonation is the platform\u2019s problem to manage',
              'Block our staff from LinkedIn and X until the platform answers us'
            ]
          },
          explain: 'The watch-versus-act decision: the trial account is dormant, and it is your best sensor — its first real action will confirm intent and feed the cluster map. Takedown tips the operators and burns the observation post; blocking platforms is a business self-harm; doing literally nothing abandons the executives to the live persona. Monitor, warn, queue reports — act when the map is complete or the persona moves on staff.',
          study: 'Escalate and monitor is a valid, senior answer — name its trigger condition (first contact with staff or investors).'
        },
        {
          question: 'Which statement goes into the board line and the PR holding note?',
          widget: {
            kind: 'mcq', correct: 3,
            options: [
              'We confirm DustyDrain is attacking us and will announce the actor name in today\u2019s public statement.',
              'The profiles are clearly fake bots, and there is no threat to anyone here.',
              'We have no evidence of anything at all, so no statement is needed today.',
              'We confirm impersonation profiles (T1585.001 / .003); attribution is moderate confidence, ongoing.'
            ]
          },
          explain: 'The senior wording separates the confirmed observation (impersonation personas and a tenant trial account — techniques T1585.001 and T1585.003) from the judgement (moderate-confidence attribution to a cluster) and the open work. Naming the actor with confidence the evidence cannot carry, minimising the issue, or denying evidence all create legal and credibility exposure later.',
          study: 'Confidence wording (low / moderate / high) is a promise about your evidence — keep the promise smaller than the evidence.'
        }
      ],
      study: 'Chain: habit evidence \u2192 watch-first decision with a trigger \u2192 calibrated public wording. That chain is the senior answer.'
    },
    {
      id: 'X2', theme: 4, type: 'terminal', typeLabel: 'Terminal (simulated, reduced timer)', points: 15,
      hint: 'The legal hold says the image must be verifiable on its own. Which options make a copy verifiable, and which alternative destroys the source?',
      scenario: {
        title: 'Evidence preservation — trial tenant VM',
        summary: 'Legal requires a verifiable disk image before any cleanup',
        parts: [
          { label: 'ARTEFACT 1 — Legal hold LH-12', text: 'Trial account trial-0412 is linked to an executive-impersonation case. Its VM disk is attached read-only to the forensic host as /dev/sdb1. Before the vendor purges the tenant, you must produce an image that survives scrutiny: hash at capture time, written to /evidence/, with a session log.' },
          { label: 'ARTEFACT 2 — Host tools', text: 'dc3dd, dd, shred, rm are installed. Policy: if=/dev/sdb1 may only be read; anything that writes to /dev/sdb1 destroys the evidence.' },
          { label: 'ARTEFACT 3 — Timing note', text: 'The vendor\u2019s purge job runs soon. Work with intent — the exercise runs on a reduced timer once you start typing.' }
        ]
      },
      question: 'In the simulated shell, produce the forensically sound image of /dev/sdb1 into /evidence/ with a SHA-256 hash and a session log, file name trial0412.img and trial0412.log.',
      widget: {
        kind: 'terminal',
        prompt: 'custodian@ir-host:~$',
        canonical: 'dc3dd if=/dev/sdb1 of=/evidence/trial0412.img hash=sha256 log=/evidence/trial0412.log',
        notFound: 'lab guard: unknown command — legal hold LH-12 lists dc3dd, dd, shred, rm.',
        accepted: [
          'dc3dd\\s+if=/dev/sdb1\\s+of=/evidence/trial0412\\.img\\s+hash=sha256\\s+log=/evidence/trial0412\\.log\\s*',
          'dc3dd\\s+(if=/dev/sdb1|of=/evidence/trial0412\\.img|hash=sha256|log=/evidence/trial0412\\.log)(\\s+(if=/dev/sdb1|of=/evidence/trial0412\\.img|hash=sha256|log=/evidence/trial0412\\.log)){3}\\s*'
        ],
        sim: [
          { p: 'dc3dd[\\s\\S]*if=/dev/sdb1', o: 'dc3dd: acquiring /dev/sdb1 -> /evidence/trial0412.img\ndc3dd: hash (sha256): 9f2c41b7e8d2a4c6f0a3d5e7b9c1d3f5a2b4c6d8e0f2a4b6c8d0e2f4a6b8c0d2\ndc3dd: log written to /evidence/trial0412.log\ndc3dd: acquisition complete, 21,474,836,480 bytes' }
        ],
        dangerous: [
          { p: 'dd[\\s\\S]*if=/dev/zero[\\s\\S]*of=/dev/sdb1[\\s\\S]*', n: '\u201Cdd if=/dev/zero of=/dev/sdb1\u201D OVERWRITES THE EVIDENCE DISK with zeros. That is destruction, not preservation — the case ends there.' },
          { p: 'shred[\\s\\S]*', n: 'shred\u2019s whole purpose is unrecoverable destruction. Running it anywhere near this source destroys the evidence.' },
          { p: 'rm[\\s\\S]*(/evidence|trial0412)[\\s\\S]*', n: 'Deleting from /evidence destroys the artefacts the legal hold protects.' }
        ],
        reduceTimerSec: 120
      },
      explain: 'The canonical command is dc3dd if=/dev/sdb1 of=/evidence/trial0412.img hash=sha256 log=/evidence/trial0412.log — read the source once, write the image, compute SHA-256 at acquisition, keep a session log: the copy verifies itself without the original. Plain dd can copy but records no hash or log, so the image would be contestable. dd with if=/dev/zero of=/dev/sdb1 and shred overwrite the source — evidence destruction. In the safe-versus-destructive pairing, the safe command is also the correct one.',
      study: 'Say the acquisition triangle out loud: image + hash + log. Two out of three does not survive scrutiny.'
    },
    {
      id: 'X3', theme: 3, type: 'steps', typeLabel: 'Repo persona chain — four steps', points: 15,
      hint: 'The sandbox saying \u201Cno known family\u201D is a gap, not a verdict. The strings and the PDB path are your real evidence.',
      scenario: {
        title: 'Repo persona — \u201Cnova-recruit-test\u201D',
        summary: 'Four artefacts with one gap and one contradiction',
        parts: [
          { label: 'ARTEFACT 1 — Repo profile', text: 'Account \u201Cnova-recruit-test\u201D created 2 days ago on a code hosting platform. Bio: \u201CHiring platform for Novacruit Group\u201D. One repository: \u201Crecruitment-coding-test\u201D, pushed 2 days ago, README invites candidates to \u201Cclone and run setup.sh\u201D.' },
          { label: 'ARTEFACT 2 — Sandbox result', text: 'Automated sandbox: \u201Cno known malware family detected\u201D. Behaviour log: the binary opens a raw TCP socket and sends a 4-byte header NX9 before any HTTP traffic.' },
          { label: 'ARTEFACT 3 — Strings sample', text: 'Strings include a build path C:\\Users\\dev\\build\\nu-RU\\proj.pdb and the literal NX9. No other artifacts. VirusTotal: 1/60 engines, first submission 2 days ago.' },
          { label: 'ARTEFACT 4 — HR note', text: 'No candidate from our current requisitions has received this repository — so far the profile has approached two staff on a professional network only.' }
        ],
        collapsed: true
      },
      steps: [
        {
          question: 'Classify the account behaviour so far.',
          widget: {
            kind: 'mcq', correct: 1,
            options: [
              'T1587 — the operators developed new malware, so the account row is out of scope here',
              'T1585.001 — a persona account was created and cultivated for targeting, with a payload staged',
              'T1586 — the account is compromised, because the sandbox reported nothing at all',
              'Benign — a sandbox with no detection means no technique applies here'
            ]
          },
          explain: 'Two techniques are in play and the question asks about the account: creating and cultivating \u201Cnova-recruit-test\u201D to approach staff is T1585.001. Development of the payload itself (T1587) is the companion row in the same report. \u201CNo known family\u201D means the sandbox lacks a signature — the custom NX9 protocol and fresh sample are consistent with in-house tooling, which is exactly why coverage of this account matters.',
          study: 'Separate the rows: persona row (T1585.001), tooling row (T1587), delivery row (Initial Access when it happens).'
        },
        {
          question: 'Which attribution line is defensible for the report?',
          widget: {
            kind: 'mcq', correct: 2,
            options: [
              'High confidence attribution to Contagious Interview, because the published pattern matches our case',
              'No attribution is possible here, because the sandbox found no known malware family',
              'Low-to-moderate: build path and sample profile match developer-persona clusters; single-source evidence, sandbox inconclusive',
              'Moderate confidence attribution to APT29, because Twitter C2 nodes were reported for them.'
            ]
          },
          explain: 'Single-source habit evidence (a PDB build path, a fresh 1/60 sample, a recruitment persona) supports low-to-moderate confidence and a named caveat — the sandbox gap stays in the sentence. Published-pattern matching alone does not reach \u201Chigh\u201D; \u201Cno attribution possible\u201D throws away real evidence; APT29\u2019s Twitter C2 example is unrelated tooling context, not a fingerprint.',
          study: 'The confidence scale exists so you can be precise; use the pair (evidence list, confidence level) every time.'
        },
        {
          question: 'Which detection package do you approve?',
          widget: {
            kind: 'mcq', correct: 0,
            options: [
              'Hunt NX9 on egress; watch repo accounts recruiting our staff; add raw-socket behaviour to sandbox review',
              'Block the code hosting platform at the proxy for everyone, effective immediately',
              'Wait for a vendor signature to appear before doing anything at all',
              'Raise the sandbox verdict threshold so unknown binaries alert only above 5/60 engines'
            ]
          },
          explain: 'Custom tooling defeats signatures, so you hunt the observable habits: the NX9 header, the persona pattern from AN2005, and sandbox behaviour review for raw sockets. Platform-wide blocking breaks engineering and does not stop the persona; waiting for signatures surrenders days; raising thresholds hides exactly this class of low-prevalence sample.',
          study: 'For unknown tooling, anchor detections on protocol quirks and account patterns, not on engine scores.'
        },
        {
          question: 'What goes into the stakeholder brief today?',
          widget: {
            kind: 'mcq', correct: 3,
            options: [
              'A confirmed breach announcement, because a payload already exists on the repo',
              'Nothing at all for now — no candidate has been contacted or infected yet',
              'A malware family analysis, since the sandbox result is the headline finding',
              'Impact and next steps: persona targets staff; delivery not yet seen; monitoring live; attribution low-to-moderate'
            ]
          },
          explain: 'The brief leads with impact and posture: persona live, delivery not yet observed, controls engaged, attribution honestly bounded. A breach announcement outruns the evidence; \u201Cnothing\u201D ignores the targeting; the sandbox\u2019s \u201Cno family\u201D is a gap, not a headline. Seniors brief decisions and uncertainty, not artefact trivia.',
          study: 'Executive brief formula: what is happening, what is not (yet) happening, what we did, what we do not know.'
        }
      ],
      study: 'Four-step rhythm: classify rows separately, bound the confidence, approve habit-based detections, brief impact plus uncertainty.'
    },
    {
      id: 'X4', theme: 3, type: 'mcq', typeLabel: 'Attribution statement', points: 10,
      hint: 'The constraint you may have missed: three of the four statements are internally consistent — but only one matches the evidence weight in this case.',
      question: 'Which statement about the \u201Cnova-recruit-test\u201D cluster is the defensible senior position?',
      widget: {
        kind: 'mcq', correct: 1,
        options: [
          'Attribution to the known cluster is confirmed: template reuse is individual-level proof.',
          'Tentative link to a developer-persona cluster from shared habits; low-to-moderate confidence pending multi-source overlap',
          'No link is possible because the sector targeting differs from the historical cluster\u2019s victims',
          'High confidence is justified because the sandbox reported no family, proving bespoke tooling.'
        ]
      },
      explain: 'Three of the four options are coherent in some world — that is what makes this tier. In this world, template and build-path habits justify a tentative link at low-to-moderate confidence; confirmation would need multi-source overlap (infrastructure, tooling, targeting together). Template reuse is not individual-level proof, sector drift happens in real clusters, and \u201Cno family\u201D says nothing about who built it.',
      study: 'Practise the wording: \u201Ctentative link, low-to-moderate confidence, based on X, caveat Y\u201D — then defend it in one breath.'
    },
    {

      study: 'In real feeds you will never have complete metadata; decide on the reused elements you DO have.'
    },
    {
      id: 'X6', theme: 1, type: 'mcq', typeLabel: 'Conflicting signals', points: 10,
      hint: 'The constraint you may have missed: T1585 lives on the PRE platform — which of the two signals can even be T1585?',
      question: 'Monday 09:00: signal A — the HR system provisioned 30 new employee accounts; the roster matches this week\u2019s signed hiring list. Signal B — brand monitoring caught two external profiles created this weekend claiming to be \u201Cour new regional directors\u201D. Both alerts landed in one incident. What is the correct call?',
      widget: {
        kind: 'mcq', correct: 2,
        options: [
          'Signal A disproves Signal B — with onboarding under way, the profiles are just the new hires\u2019 fresh accounts.',
          'Signal B disproves Signal A — bulk account creation is always adversarial',
          'Both stand and differ: A is internal provisioning, not T1585; B is T1585.001 impersonation and needs handling.',
          'Both are T1585.003, because both involve the creation of new accounts this week'

      explain: 'The contradiction dissolves once you ask which signal can even be the technique: T1585 is a PRE behaviour — accounts created on external services before intrusion. Internal provisioning by the HR system is business-as-usual account management, regardless of volume. Signal B keeps its full weight: externally created profiles claiming affiliation is exactly the AN1983 pattern. Merging them into one incident is the error the question punishes.',
      study: 'Volume alone never decides; ownership and platform do. Inside-tenant provisioning and outside-platform personas live in different ATT&CK rows.'
    },
    {
