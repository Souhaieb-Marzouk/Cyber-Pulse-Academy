.res-row .rr-ico { flex: 0 0 1.6em; font-weight: 800; }
.res-row .rr-cred { margin-left: auto; font-family: var(--font-mono); color: var(--text-secondary); }

/* ---------- hint ---------- */
.hintbox { border: 1px solid var(--accent-amber); border-left: 4px solid var(--accent-amber); background: color-mix(in srgb, var(--accent-amber) 8%, var(--bg-surface-2)); border-radius: 0 6px 6px 0; padding: 10px 14px; margin: 10px 0; font-size: 0.93rem; }
.hintbox .hb-label { font-weight: 800; color: var(--accent-amber); }

/* ---------- misc ---------- */
.ex-meta-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 4px; }
.ex-num { font-family: var(--font-mono); font-weight: 800; color: var(--sev-current); }
.fade-in { animation: fadein 0.25s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.tbl { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.tbl th, .tbl td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
.tbl th { background: var(--bg-surface-2); color: var(--text-secondary); }
@media (max-width: 640px) { .wrap { padding: 12px 12px; } .block-body { padding: 12px; } body { font-size: 15px; } }
@media (prefers-reduced-motion: reduce) {
  .progress .fill { animation: none; }
  .fade-in { animation: none; }
  * { transition: none !important; }
}

<script>
window.EX_DATA = {"meta": {"topicId": "t1547.006", "batch": 4, "title": "T1547.006 Kernel Modules and Extensions — EXTREMELY HARD", "difficulty": "extremely-hard", "questionCount": 16, "estimatedMinutes": 60, "passMark": 70, "sev": "EXTREMELY HARD", "sevWord": "EXTREMELY HARD", "objId": "T1547.006", "objName": "Kernel Modules and Extensions", "objType": "Sub-Technique", "examTitle": "T1547.006 — EXTREMELY HARD practice exam", "page_title": "T1547.006 — EXTREMELY HARD practice exam", "timerMinutes": 70}, "intro": {"learn": ["This is the expert tier for MITRE ATT&CK T1547.006 — Kernel Modules and Extensions, the sub-technique of T1547 (Boot or Logon Autostart Execution) covering attacker code inside the Linux kernel (Loadable Kernel Modules) and the macOS kernel (kexts). Nothing here is a definition test. Every exercise mirrors a senior decision: conflicting telemetry you must rank, business costs you must accept, evidence you must protect under pressure, and best practices that are wrong in the specific world of the scenario.", "The situations are drawn from the T1547.006 evidence base: the Drovorub toolset of Russian GRU 85th GTsSS (NSA/FBI advisory, where the kernel module hides activity from the very host it lives on), the signed kernel rootkit of Operation CuckooBees (C0012, Winnti tooling — where 'it is signed' stops being comfort), REPTILE (S1219) in UNC3886 espionage operations, and Skidmap (S0468) hiding a crypto miner. You will weigh signature checks against baselines, KextPolicy approvals against load context, EDR verdicts against netflow — and you will say which signal wins and why.", "You will also make the calls that keep you employed: whether to isolate a production node during peak traffic, whether to run rkhunter on a compromised kernel (you will learn why not), how to tune a noisy analytic without going blind, how to sequence volatile evidence collection so it survives scrutiny, and how to brief a CISO who needs a decision in ten minutes. Several correct answers are 'gather more evidence' or 'escalate' — knowing when NOT to act is an expert skill.", "The two terminal exercises are pressure simulations: one asks whether and what to run on a host whose kernel is untrusted (with its own reduced timer), the other builds a durable auditd detection rule under element-by-element grading. Every explanation tells you not just the right call but the cost of the plausible wrong ones. If you can pass this tier, you can own a kernel-rootkit incident end to end."], "keywords": [{"theme": "Conflicting signals & signal ranking", "items": ["EDR verdict vs /sys/module vs lsmod delta", "KextPolicy approval vs load context", "signature validity vs baseline absence", "netflow as out-of-band ground truth"]}, {"theme": "Senior response decisions", "items": ["cordon-and-drain vs cluster shutdown (cost)", "volatile-first evidence order", "do-nothing-yet / gather-more-evidence calls", "CISO escalation with evidence bundles"]}, {"theme": "Detection engineering", "items": ["AN1243 tuning: DKMS build windows and hash allowlists", "module.sig_enforce=1 and kernel lockdown", "auditctl compound rules (b64, -S, -k)", "why disabling a noisy analytic loses ring-0 coverage"]}, {"theme": "Attribution with uncertainty", "items": ["Drovorub (S0502) — GRU 85th GTsSS, NSA/FBI", "Operation CuckooBees (C0012) — signed rootkit, Winnti", "REPTILE (S1219) — UNC3886", "confidence language and caveats"]}, {"theme": "Platform strategy", "items": ["macOS System Extensions vs legacy kexts (post-10.15)", "com.apple.syspolicy.kernel-extension-policy", "MDM allowlists vs blanket blocks", "T1014 Rootkit overlap and neighbour techniques (T1547.001, T1547.013)"]}], "how": ["Pass mark: 70% over answered exercises only; skipped-and-never-answered items are excluded from numerator and denominator.", "Exercise types: branching decision scenarios with per-step consequences, two pressure terminal exercises (the first has its own reduced timer — announced on screen), multi-select with partial credit, signal-ranking drag & drop, matching, fill the blank, ordering, and single choice with expert-grade distractors.", "Conflicting signals are the core drill: when two sources disagree, decide which one wins and why — the feedback explains the ranking.", "Some correct answers cost something (downtime, lost evidence paths, a vendor conversation). Accepting the cheapest real cost is part of the skill.", "Partial credit formula: max(0, (correct − wrong) / items). Wrong elements subtract — including dangerous terminal elements.", "Timer: 70 minutes. Pause hides the exercise. Check stops the timer automatically (unlimited feedback time); it resumes on Next. One hint per exercise costs 10% of that exercise's credit.", "Skips are free and reversible until you finish. Press Start when you are ready — read every artefact, including the ones that do not matter. That is the job."]}, "exercises": [{"id": "x01", "type": "sim", "title": "The node that lies to itself", "lead": "08:52, Tuesday, peak traffic in 40 minutes. You are senior IR. Every decision below has a real cost — pick the cheapest correct one.", "scenario": [], "question": "Own the incident. Confirm each decision and carry its consequence into the next step.", "steps": [{"scen": "Step 1 — prod-eks-node-17. EDR: 'no detections, healthy'. auditd (shipped to central log BEFORE the host could touch it): init_module at 03:40 from a path under /tmp, then the .ko file deleted at 03:47. /sys/module: 137 entries; lsmod on the host: 136. Netflow: beacons every 90s to 45[.]133[.]1[.]208:443 since 03:41. The node's image build history is unavailable (registry retention expired). An unrelated change ticket mentions a printer-driver update on a DIFFERENT host.", "q": "EDR says healthy; auditd, the module-count delta and netflow all say otherwise. What do you declare?", "options": [{"t": "Suspected ring-0 compromise: trust the independent telemetry, stop trusting the host's own view", "c": true, "why": "Three independent out-of-host signals beat one in-host verdict a rootkit can reach.", "cont": "You declare suspected ring-0 compromise. The host's own tools are now treated as untrusted witnesses. The beacon continues — evidence is ticking."}, {"t": "Trust EDR: healthy nodes do not get isolated for fun", "c": false, "why": "EDR runs in user space — exactly the layer a kernel module controls. Its 'healthy' is not independent.", "cont": "You stand down. The beacons continue every 90 seconds. Three hours later the C2 pushes a second stage."}, {"t": "Reboot the node first so the module is gone, then investigate calmly", "c": false, "why": "The module is registered for boot; a reboot also erases the memory image — the only complete specimen.", "cont": "The node reboots. lsmod now shows a clean 136. The module is still there — and your evidence is gone."}, {"t": "Wait for the endpoint vendor's support ticket to answer", "c": false, "why": "Vendor support is not a detection source. The out-of-band evidence is already conclusive enough to act on.", "cont": "The vendor replies at 14:20. The operator had five unhurried hours on your cluster."}]}, {"scen": "Step 2 — You have declared ring-0 suspicion. Now scoping: how far does this go? The cluster runs 60 nodes; the beacon is seen only from node-17 so far.", "q": "What is the correct scoping move?", "options": [{"t": "Hunt fleet-wide from OUTSIDE the hosts: check central auditd for /tmp module loads and netflow for the beacon across all 60 nodes", "c": true, "why": "Out-of-band hunting scales without trusting any compromised kernel.", "cont": "Fleet hunt: only node-17 shows both signals. Scope confirmed: one node. Business impact stays calculable."}, {"t": "rmmod the module on node-17 to see if it respawns", "c": false, "why": "You would alter state, alert the operator, and learn nothing that the central logs do not already prove.", "cont": "rmmod: 'module in use'. The beacon switched to a backup C2 within two minutes."}, {"t": "Shut down the entire cluster immediately — better safe", "c": false, "why": "With scope unconfirmed, that is maximal cost for an unknown problem. Scope FIRST, then contain at the right radius.", "cont": "The cluster drops. Checkout fails for 22 minutes. Scope would have shown one node."}, {"t": "Log into each node and eyeball lsmod", "c": false, "why": "Interactive checks on possibly-compromised kernels are blind and slow — the delta already proved that.", "cont": "Two hours of lsmod reading. The hooked kernels all say 'all clear'."}]}, {"scen": "Step 3 — Scope: one node. The CISO asks for a containment decision NOW, on the call, with the numbers: cordoning node-17 migrates ~30 pods and costs an estimated 4 minutes of degraded latency; doing nothing keeps a hostile kernel in the payment path.", "q": "What is your containment recommendation?", "options": [{"t": "Cordon and drain node-17, take it out of rotation, preserve the memory image — accept the 4-minute cost", "c": true, "why": "The cheapest action that removes the attacker from the payment path AND preserves evidence.", "cont": "Node-17 cordoned and drained in 6 minutes; workloads rescheduled; memory image captured before shutdown. Payment path clean."}, {"t": "Shut down the whole cluster during peak — zero risk beats any downtime", "c": false, "why": "It is maximal cost for a scoped single-node problem. Proportionality is part of the job.", "cont": "The cluster dies at peak. Revenue impact: six figures. Scope was one node."}, {"t": "Leave node-17 serving until the weekend maintenance window", "c": false, "why": "A hostile kernel in the payment path for four days is not a 'risk acceptance', it is negligence with paperwork.", "cont": "The change board approved the wait. The attacker exfiltrated payment-shaped data on Thursday."}, {"t": "Power off node-17 immediately, hard, no drain", "c": false, "why": "A hard power-off loses the memory image and crashes live workloads — the expensive version of the right idea.", "cont": "Node down in 2 seconds. 30 workloads hard-killed. The memory specimen — gone with the RAM."}]}, {"scen": "Step 4 — Containment done. The CISO wants the incident summary and wants to know who did this.", "q": "What goes into the next report, and what is the escalation path?", "options": [{"t": "P1 incident with the evidence bundle (timeline, auditd records, netflow profile, memory image hash) and a threat-attribution paragraph with stated confidence and caveats", "c": true, "why": "Evidence plus calibrated attribution is the senior standard — conclusions travel with their uncertainty.", "cont": "The report lands. Legal and the threat-intel team pick up the attribution thread. The memory image is preserved under chain of custody."}, {"t": "Company-wide email naming the attacker group and the C2 IP", "c": false, "why": "Uncontrolled disclosure leaks scope, tips the operator, and creates legal exposure.", "cont": "The C2 IP rotates within the hour; three journalists get screenshots."}, {"t": "Delete the module and close the ticket as resolved", "c": false, "why": "You cannot delete what the kernel hides, and 'resolved' without eradication is fiction.", "cont": "The ticket closes. The rebuild never happens. The same beacon returns in 11 days."}, {"t": "No report until every question is answered", "c": false, "why": "Perfect information never arrives. Executives need the state of knowledge NOW, marked as such.", "cont": "For three days the CISO hears nothing and briefs the board from rumours."}]}], "hint": "In-host witnesses can be puppeteered; out-of-band ones cannot. Every step: cheapest action that removes the attacker and keeps the evidence.", "expl": "The spine of the case: independent telemetry outranks the compromised host's self-report (auditd shipped centrally, netflow, the /sys/module delta — three against one); scoping happens out-of-band before containment; containment takes the smallest sufficient radius (cordon+drain) while preserving the memory image; and the report pairs evidence with calibrated attribution. Every wrong branch here models a real headlines-generating failure. The printer-driver ticket was deliberate noise; the missing image history was deliberate incompleteness — seniors decide with 80% information and say so. Attacker view: the operator of this node banked on exactly this pressure — that a senior team would rather reboot fast than preserve proof, and that in-host tools would keep lying until the end. Defender view: your whole advantage here came from signals the attacker cannot hook — central auditd shipping, netflow, and the /sys/module delta — so the lesson is to keep and trust those independent sources when the endpoint itself lies.", "study": "out-of-band verification, proportionate containment, evidence-first reporting for LKM rootkit incidents"}, {"id": "x02", "type": "terminal", "title": "One command, one shot, evidence that survives", "lead": "Node-17 is confirmed ring-0 suspect and still live. Legal wants evidence that survives scrutiny; the kernel is untrusted; the team is waiting on your word before anyone touches the box.", "scenario": [{"label": "Constraint card", "kind": "prose", "body": "The evidence mount /mnt/ev is writable and hashed after every write. You get ONE command on this host before containment. It must capture the kernel's LIVE module list into /mnt/ev/modules.txt — the canonical volatile artefact for LKM cases. Anything that changes state (load, remove, reboot) is forbidden and will be graded as the dangerous act it is."}, {"label": "Pressure note", "kind": "prose", "body": "This exercise has its own reduced timer, shown below. Type the command, run it to see simulated output, then Check. If the timer expires, your current command is checked automatically."}], "question": "Type the ONE read-only command that writes the live kernel module list into /mnt/ev/modules.txt, run it, then Check.", "term": {"title": "simulated shell — nothing real is executed", "prompt": "[responder@node-17 ~]$", "banner": ["node-17 — RING-0 SUSPECT — evidence mode", "write target: /mnt/ev (hash-locked evidence mount)", "one command. make it count."], "notFound": "command not found", "simOut": [{"re": "(cat|lsmod)[\\s\\S]*\\/mnt\\/ev\\/modules\\.txt", "out": ["(137 lines written to /mnt/ev/modules.txt — hash recorded on evidence mount)"]}], "simFail": [{"re": "\\b(rmmod|modprobe\\s+-r|insmod)\\b", "out": "STATE CHANGE REFUSED by exercise: that command alters the kernel on an evidence-critical host."}, {"re": "\\b(reboot|shutdown|poweroff)\\b", "out": "STATE CHANGE REFUSED by exercise: a reboot destroys the memory image."}], "expect": [{"el": "reads the kernel's live module list (cat /proc/modules — or lsmod)", "re": "\\b(cat\\s+/proc/modules|lsmod)\\b", "why": "/proc/modules is the kernel's own view; cat reads it directly, lsmod formats it. On an untrusted kernel, the direct read is preferred."}, {"el": "writes to the evidence file /mnt/ev/modules.txt", "re": "(>|>>|\\btee\\b)[^|]*\\/mnt\\/ev\\/modules\\.txt", "why": "The output must LAND on the evidence mount with the exact filename legal asked for."}], "traps": [{"re": "\\brmmod\\b|\\bmodprobe\\s+-r\\b", "note": "Removing the module would destroy the single most valuable volatile artefact — the loaded implant itself."}, {"re": "\\b(reboot|shutdown|poweroff)\\b", "note": "A reboot erases the memory image and every other volatile artefact."}, {"re": "\\binsmod\\b|\\bmodprobe\\b[^-]", "note": "Loading anything else on this kernel alters state and adds attacker-visible noise."}], "canonical": "cat /proc/modules > /mnt/ev/modules.txt", "canonExpl": ["cat /proc/modules — reads the kernel's live module table straight from procfs; on a rootkit host this direct read is preferred over user-space wrappers.", "> /mnt/ev/modules.txt — writes the list to the hash-locked evidence mount with the filename legal specified.", "Read-only with respect to the SYSTEM: nothing loads, nothing unloads, nothing reboots. The only write lands on the evidence mount.", "The alternative lsmod > /mnt/ev/modules.txt also captures the list (graded correct); the feedback explains why the direct read is the senior habit."], "perTimer": 240}, "hint": "The kernel's own view lives under /proc. The only write allowed is to the evidence mount.", "expl": "cat /proc/modules > /mnt/ev/modules.txt — the senior answer: read the kernel's table directly from procfs and land it on the evidence mount. The destructive twins were rmmod (destroys the implant specimen), reboot (erases all volatile evidence), and insmod (changes state). lsmod was graded as capturing the same list — defensible — but on an untrusted kernel the direct /proc read is the better habit: fewer user-space layers between you and the kernel's memory of the truth. This command, plus the memory image, is what 'evidence that survives scrutiny' looks like.", "study": "volatile evidence capture on rootkit-suspect hosts; /proc/modules vs lsmod"}, {"id": "x03", "type": "multi", "title": "Scope and response decisions when the kernel is untrusted", "lead": "The incident board needs the response doctrine for the node-17 case in writing. Five candidate decisions are on the table; some are doctrine, some are theatre.", "scenario": [{"label": "Doctrine draft", "kind": "prose", "body": "Mark every decision that is defensible for a suspected LKM rootkit on a production node. Reject the ones that either trust the compromised kernel or destroy evidence."}], "question": "Select every defensible scope/response decision.", "options": [{"t": "Verify all findings from outside the host: central auditd, netflow, management plane", "c": true, "why": "Out-of-band views cannot be hooked by the implant under investigation."}, {"t": "Acquire a full memory image before any state change", "c": true, "why": "The rootkit lives in RAM; the image is the primary specimen and the proof of scope."}, {"t": "Plan eradication as a rebuild from a known-good image, not an in-place fix", "c": true, "why": "You cannot reliably remove kernel code with tools the kernel controls; rebuild is the honest eradication."}, {"t": "Run a user-space antivirus scan on the node and treat 'clean' as proof of innocence", "c": false, "why": "The agent answers to a hooked kernel; a clean verdict is worthless — and treating it as proof is worse than no scan."}, {"t": "Trust interactive shell listings (ls, ps) for the file hunt", "c": false, "why": "Every user-space listing passes through the layer the attacker controls."}], "hint": "Two of the five let the compromised kernel vouch for itself. Doctrine never does.", "expl": "Doctrine: out-of-band verification, memory-first evidence, rebuild-based eradication. Anti-doctrine: trusting user-space verdicts (AV scan, ls, ps) on a hooked kernel — the tools run BELOW the thing you are hunting. This is the same principle as the Drovorub advisory's netflow recommendation, generalised: independent vantage points or nothing. When the doctrine is written down before the next incident, the 03:00 version of you does not have to reinvent it under pressure.", "study": "response doctrine for ring-0 compromises"}, {"id": "x04", "type": "drag", "title": "Which signal wins?", "lead": "Four disputes from the node-17 case file. In each, two signals disagree. Your doctrine must say which one outranks the other — and the ranking is not always the same.", "scenario": [{"label": "Doctrine worksheet", "kind": "prose", "body": "Place each dispute under the ruling that matches how a senior analyst resolves it. 'Context decides' means the surrounding facts (time, path, actor) must be examined before either signal is trusted."}], "question": "Drag each dispute onto the correct ruling.", "bank": [{"id": "i0", "t": "EDR: clean — vs — /sys/module has one more entry than lsmod", "why": "A kernel-space view (sysfs) outranks a user-space agent that a hook can blind."}, {"id": "i1", "t": "netflow beacon continues — vs — host EDR says clean", "why": "Network telemetry runs off-host; the implant cannot edit it. It outranks the host's verdict."}, {"id": "i2", "t": "kext approved in KextPolicy — vs — it loaded at 03:41 from a user's Downloads folder", "why": "Approval says WHO may sign; the context says WHERE and WHEN. Investigate before trusting either."}, {"id": "i3", "t": "module file hash matches the vendor package — vs — the load came from /tmp", "why": "Two true facts that disagree: find out WHICH copy actually loaded before concluding anything."}], "slots": [{"label": "Ruling: the host-internal kernel-space signal wins", "accept": ["i0"]}, {"label": "Ruling: the out-of-band network signal wins", "accept": ["i1"]}, {"label": "Ruling: context decides — investigate before concluding", "accept": ["i2", "i3"]}], "hint": "Rank by vantage point: can the implant reach the sensor? If both sensors are reachable or both are clean, context arbitrates.", "expl": "Signal ranking doctrine: a sensor the implant cannot reach outranks one it can. The sysfs delta and the netflow beacon each outrank the in-host EDR verdict for that reason. But KextPolicy approval vs odd load context, and matching hash vs odd path, are genuine contradictions — no blanket rule wins, so context arbitrates (who, when, where) before any conclusion. Experts are distinguished less by knowing signals than by knowing WHICH signal is authoritative for WHICH question.", "study": "signal ranking: vantage points, reachability, and context arbitration"}, {"id": "x05", "type": "qcm", "title": "Tune the analytic without going blind", "lead": "Your AN1243-derived analytic pages the on-call for every DKMS build (ZFS driver rebuilds on kernel updates): 40 false pages a week. Morale is gone. A team lead proposes the popular fix: disable the analytic. You have ten minutes to pick the durable answer.", "scenario": [{"label": "Noise profile", "kind": "code", "lines": ["fires on: dkms build/install of zfs.ko during kernel updates", "fires on: hash known, signer = distro/vendor, load by package manager", "true-positive profile: unowned files, unknown signer, non-root attempts, /tmp loads"]}, {"label": "Constraint", "kind": "prose", "body": "The analytic is currently the ONLY ring-0 module-load coverage on the fleet. No EDR kernel telemetry exists on these hosts."}], "question": "Which tuning keeps coverage AND kills the noise?", "options": [{"t": "Keep the analytic; suppress only loads whose file hash and signer match a known package during package-manager activity windows", "c": true, "why": "It removes exactly the benign profile (known hash + known signer + package context) while keeping every true-positive profile armed."}, {"t": "Disable the analytic — 40 pages a week is worse than blindness", "c": false, "why": "The popular fix. It also deletes the only ring-0 visibility on the fleet; the next Skidmap loads unseen."}, {"t": "Raise the threshold: page only after 100 module loads per day", "c": false, "why": "Real intrusions load once or twice. A volume threshold is blind to precisely the attacks that matter."}, {"t": "Move the analytic to a weekly offline review", "c": false, "why": "Module-load detection has minutes-to-hours value; a weekly queue is an archive, not a detection."}], "hint": "The noise and the true positives differ in hash, signer and CONTEXT — tune on those, not on volume or schedule.", "expl": "The durable answer suppresses the benign profile precisely: known hash + vendor signer + package-manager context. Everything hostile — unowned files, unknown signers, /tmp paths, non-root attempts — still pages. Disabling the analytic is the 'widely used best practice' that is wrong here: with no other ring-0 source, the fix trades 40 false pages for guaranteed misses. Volume thresholds and schedule downgrades are the same trade wearing a disguise. Noise is a tuning problem, not a coverage problem — and the reverse mistake (alert on everything forever) burns out teams just as surely.", "study": "AN1243 tuning: suppress on hash+signer+context, never on volume"}, {"id": "x06", "type": "fill", "title": "The kernel lockdown parameters", "lead": "You are writing the hardened-baseline document for the RHEL fleet. Two boot parameters close the module road: one enforces signature enforcement, one restricts kernel functionality changes after boot.", "scenario": [{"label": "Baseline draft", "kind": "code", "lines": ["GRUB_CMDLINE_LINUX: ... {} =1 lockdown=..."]}, {"label": "Kernel docs note", "kind": "prose", "body": "module.sig_enforce=1 makes the kernel REFUSE any module that fails signature verification — an unsigned or wrongly-signed load attempt then fails loudly (and lands in the log). The lockdown feature, e.g. lockdown=integrity, restricts even root from modifying the running kernel's code paths (including some module operations) — trading flexibility for integrity."}], "question": "Fill the blanks: the signature-enforcement parameter is {} , and the kernel feature that restricts post-boot kernel modification is {} .", "sentence": "Boot with {} =1 to refuse unsigned modules, and enable the kernel {} mechanism to restrict post-boot modification.", "blanks": [{"accept": "module\\.sig_enforce|sig_enforce", "disp": "module.sig_enforce", "why": "module.sig_enforce=1 enforces module signature verification at load time."}, {"accept": "lockdown", "disp": "lockdown", "why": "Kernel lockdown (integrity mode) limits ring-0 changes even by root."}], "hint": "First blank: a module.* parameter with 'enforce' in it. Second blank: one word, what a lockdown does.", "expl": "module.sig_enforce=1 refuses unsigned modules at load time — the strongest preventive against T1547.006 abuse — and lockdown (integrity mode) narrows what even root can change in a running kernel. Trade-offs belong in the same document: strict signature enforcement breaks DKMS/third-party modules (ZFS, GPU drivers) unless you enrol their keys, and lockdown can break tooling that deliberately pokes the kernel. That is why these parameters are scoped per-fleet, and why M1038's 'kernel tuning' wording on the ATT&CK page includes exactly this family.", "study": "module.sig_enforce and kernel lockdown — M1038 kernel tuning"}, {"id": "x07", "type": "match", "title": "Anchor each artefact to its analytic", "lead": "The threat-intel annex of the report maps each collected artefact to the detection anchor that would have caught it earliest — so detection engineering gets a shopping list, not vibes.", "scenario": [{"label": "Annex table (anchors missing)", "kind": "prose", "body": "Four artefacts from the case file. Anchors: the AN1243 Linux analytic, the AN1244 macOS analytic, the hidden-module cross-check (kernel-space view vs user-space view), and the macOS KextPolicy + file-monitoring cross-check."}], "question": "Match each artefact to the anchor that covers it.", "pairs": [{"l": "auditd: init_module from an interactive shell (Linux)", "r": "AN1243 — module-load analytic", "why": "The load syscall is AN1243's core event."}, {"l": "unified log: kextload of a legacy kext (macOS)", "r": "AN1244 — kext analytic", "why": "kextload activity is AN1244's core event."}, {"l": "/proc/modules count differs from lsmod count", "r": "hidden-module cross-check (kernel view vs user view)", "why": "Two views of one kernel disagreeing is the hiding anchor."}, {"l": "new kext bundle under /Library/Extensions (macOS)", "r": "KextPolicy + file-monitoring cross-check", "why": "File appearance plus the policy DB is the macOS install anchor."}], "hint": "Two anchors are platform analytics (one per OS); two are cross-checks between two views of the same thing.", "expl": "The annex's value is the mapping: each artefact names the anchor that catches it, which turns the incident into detector requirements. AN1243 eats Linux load syscalls; AN1244 eats kextload; the hidden-module cross-check eats view deltas; the macOS install cross-check eats new kext bundles reconciled against KextPolicy. In review, this is also how you show the gap list honestly: artefacts your estate had NO anchor for are the ones that need funding.", "study": "detection anchors for T1547.006 — analytics and cross-checks"}, {"id": "x08", "type": "qcm", "title": "Say the attribution out loud", "lead": "The CISO briefing is in ten minutes. The board wants a name. You have three artefacts and a career-length memory of what over-claiming costs.", "scenario": [{"label": "ARTEFACT 1 — module behaviour", "kind": "prose", "body": "Implant: LKM, hides itself and selected processes/sockets, authenticated backdoor, C2 over TLS with a custom protocol. Behaviour overlaps strongly with the Drovorub profile (S0502)."}, {"label": "ARTEFACT 2 — infrastructure", "kind": "prose", "body": "C2 45[.]133[.]1[.]208 appears in a 2021 scan report tied to infrastructure previously linked to GRU 85th GTsSS operations. One reused IP is weak-to-moderate evidence on its own."}, {"label": "ARTEFACT 3 — complicating fact", "kind": "prose", "body": "REPTILE (S1219), an open-source LKM rootkit with similar hiding features, is public and was used by UNC3886. Code reuse means hiding features alone cannot separate these actors."}], "question": "Which attribution statement is defensible in the briefing?", "options": [{"t": "Moderate-to-high confidence in GRU 85th GTsSS (Drovorub) tooling, based on behaviour, code overlap and infrastructure — with the caveat that public rootkits blur certainty", "c": true, "why": "It states the hypothesis, the evidence classes behind it, and the honest uncertainty."}, {"t": "It is Drovorub, case closed — the behaviour matches exactly", "c": false, "why": "'Exactly' is false: REPTILE-style overlap exists, and behaviour alone never closes attribution."}, {"t": "No attribution is ever possible, so the section is blank", "c": false, "why": "Calibrated confidence is the standard; refusing to assess wastes the evidence you have."}, {"t": "It is a ransomware crew following the Drovorub write-up", "c": false, "why": "Nothing in the artefacts supports the crime-gang hypothesis — it is invented, not just unproven."}], "hint": "Attribution is a probability with its evidence attached. Which option attaches evidence AND admits the limit?", "expl": "Defensible attribution names the hypothesis (GRU 85th GTsSS / Drovorub tooling), the evidence classes (behavioural overlap, code lineage, infrastructure reuse), and the limitation (public LKM rootkits like REPTILE make hiding features weak separators). 'Case closed' over-claims; blank refusal under-claims; the ransomware line invents a sponsor. This is exactly the CTI skill the T1547.006 procedure table trains: four actors, one technique, and the differences live in motive, tooling lineage and infrastructure — not in the mere existence of a module.", "study": "calibrated attribution using the T1547.006 procedure examples"}, {"id": "x09", "type": "sim", "title": "Friday night: the kext that did not load", "lead": "21:30 Friday. A designer's MacBook alerted: kextload attempt from ~/Downloads, rejected by policy. The user says they clicked a 'codec pack' from a text message. Two steps in, you will be tempted to act first and think later. Don't.", "scenario": [], "question": "Work the incident. Confirm each decision to see its consequence.", "steps": [{"scen": "Step 1 — Facts: the kext was NOT loaded (policy + SIP blocked it; the unified log shows 'rejected: signature not valid'). KextPolicy shows no approval was ever granted. No other host shows this file.", "q": "Is there active kernel compromise on this Mac?", "options": [{"t": "No — the load was blocked; treat as a phishing/tampering incident and collect the installer, not a kernel compromise", "c": true, "why": "The control chain (policy + SIP) held. Kernel compromise requires a LOAD; there was none.", "cont": "You classify it as phishing with attempted kernel persistence. The MacBook stays in service; the installer is quarantined."}, {"t": "Yes — isolate the Mac immediately as kernel-compromised", "c": false, "why": "Isolation is for active compromise. Nothing loaded; the expensive response would be wrong here.", "cont": "You isolate a designer's working machine on a Friday night for a blocked file. Two escalated tickets and one unhappy VP later, the classification is corrected."}, {"t": "Reimage the Mac now, evidence can wait", "c": false, "why": "Reimaging destroys the installer and the message trail — the artefacts that decide whether this is a one-off or a campaign.", "cont": "The Mac is pristine. So is your evidence. Two more designers report the same text on Monday — with no sample to compare."}, {"t": "Approve the kext in a test VM to see what it would have done", "c": false, "why": "You would be defeating the exact control that protected the host — on purpose — without approvals.", "cont": "The test VM kernel panics on load. You have learned something, and burned change-approval credit doing it."}]}, {"scen": "Step 2 — The installer is quarantined. The text message came from a number spoofing a real conference organiser.", "q": "What is the right next move?", "options": [{"t": "Pull the SMS, hash the installer, check other recipients of the same number — campaign scoping, all out-of-band", "c": true, "why": "Cheap checks that answer the real question: one user, or a campaign?", "cont": "Three more Macs received the same SMS. None clicked. The campaign is scoped in twenty minutes."}, {"t": "rmmod the kext to be sure it is not loaded", "c": false, "why": "There is nothing loaded to remove — the block proves it. This is keyboard theatre.", "cont": "kextunload returns 'not loaded'. You knew that. The ticket now contains a pointless command."}, {"t": "Disable SIP on the user's Mac to investigate deeper", "c": false, "why": "Weakening the control that saved you, on the host that was targeted — the attacker's own to-do list, executed for free.", "cont": "SIP is off. The Mac is now the weakest node in the fleet, permanently."}, {"t": "Approve the kext 'temporarily' so the user can work", "c": false, "why": "Approving an unsigned, phished kext converts a blocked attack into a successful one.", "cont": "The kext loads. Sixty minutes later you have a real kernel incident, self-inflicted."}]}, {"scen": "Step 3 — Campaign scoped: one click, three attempts, installer hashed. The vendor verdict on the sample takes until Monday. The SOC lead asks what to do with the fleet until then.", "q": "Choose the holding action.", "options": [{"t": "No host changes yet: keep MDM policy as is, alert on any kextload attempt not on the allowlist, review with the vendor verdict Monday", "c": true, "why": "Gather-more-evidence is the correct action: controls held, nothing indicates bypass, changes cost more than they buy.", "cont": "The weekend passes quietly. Monday: vendor confirms adware-family kext. The allowlist stays clean; the alert rule ships fleet-wide."}, {"t": "Fleet-wide emergency: block and wipe all non-Apple kexts tonight", "c": false, "why": "The controls already held; a fleet emergency buys nothing and breaks specialist hardware workflows for days.", "cont": "Monday morning: 40 tickets about broken audio interfaces. The attack had already been stopped on Friday."}, {"t": "Add the sender's domain to the mail/SMS gateway blocklist and nothing else", "c": false, "why": "Partially right but incomplete — the number is spoofable, and detection on the endpoint side is missing.", "cont": "The actor spoofs a different number on Tuesday. Only the new kextload alert catches attempt four."}, {"t": "Wait silently — no ticket, no detection changes, 'it did not load after all'", "c": false, "why": "Attempted persistence is a detection gift: the attempt itself is telemetry. Ignoring it wastes the attack.", "cont": "The actor tries again on another floor with a different lure. Nobody is watching for it."}]}], "hint": "The controls held — that fact drives everything. The expensive options all spend cost to solve a problem that already got solved.", "expl": "The branch discipline: when a control demonstrably held (policy + SIP rejected the kext), the incident class changes from kernel compromise to phishing/tampering, and the correct senior action is evidence + scoping + detection, not emergency response. The 'do nothing to hosts / gather more evidence' answer is graded correct because every host-side option either destroys evidence (reimage), weakens the winning control (SIP off), or converts failure into success (approval). What you DO add is the detection: any non-allowlisted kextload attempt — because attempts are free telemetry for the next attempt.", "study": "responding to blocked kextload attempts; attempts as telemetry"}, {"id": "x10", "type": "drag", "title": "Hardening choices and their real trade-offs", "lead": "The hardening board wants the trade-offs stated IN the proposal, not discovered after rollout. Four controls, four honest costs.", "scenario": [{"label": "Trade-off sheet", "kind": "prose", "body": "Match each control to the trade-off it actually carries. 'Balanced control' means the cost is bounded and known — not zero."}], "question": "Drag each control onto its honest trade-off.", "bank": [{"id": "i0", "t": "Boot every server with module.sig_enforce=1", "why": "Unsigned and self-built modules (DKMS: ZFS, GPU) fail to load until keys are enrolled."}, {"id": "i1", "t": "MDM policy: block ALL user kext install and approval", "why": "Approved specialist drivers (audio interfaces, lab hardware) break for everyone."}, {"id": "i2", "t": "MDM allowlist of specific developer team IDs", "why": "Bounded cost: known vendors keep working; everything else stays blocked."}, {"id": "i3", "t": "rmmod on any module-load alert, as standing practice", "why": "Outages and evidence loss for near-zero defensive value — the worst of both worlds."}], "slots": [{"label": "Trade-off: breaks legitimate third-party modules", "accept": ["i0", "i1"]}, {"label": "Trade-off: balanced — bounded, known cost", "accept": ["i2"]}, {"label": "Trade-off: poor practice — cost without value", "accept": ["i3"]}], "hint": "Two controls are blunt instruments (they break legit software), one is surgical, one is just vandalism with a terminal.", "expl": "Honest trade-offs: sig_enforce and blanket MDM blocks both break legitimate software (DKMS builds; specialist kexts) — powerful, blunt. The MDM team-ID allowlist is the balanced control: approved vendors keep loading, everything else fails closed. Standing rmmod-on-alert is the anti-pattern: it risks crashes, destroys volatile evidence, teaches attackers nothing, and burns trust in the alert pipeline. Boards fund controls whose costs are stated; they defund controls whose costs surface as incidents.", "study": "cost-bounded hardening for T1547.006 across Linux and macOS"}, {"id": "x11", "type": "order", "title": "Volatile-first, under pressure", "lead": "The memory specialist is 20 minutes out. The CISO wants to know the order of operations so they can tell the board who touches what. One wrong order and the evidence chain breaks.", "scenario": [{"label": "Sequence cards", "kind": "prose", "body": "Four actions on node-17 before eradication. Order them so that the most volatile, least reliable-to-reproduce evidence comes first, and the destructive step comes last."}], "question": "Drag the actions into the correct order, first to last.", "bank": [{"id": "i0", "t": "Capture network state and /proc/modules to the evidence mount", "why": "Seconds to run, cheapest, and grounds the memory analysis context."}, {"id": "i1", "t": "Acquire the full memory image", "why": "The core specimen — the rootkit lives in RAM and dies with power."}, {"id": "i2", "t": "Collect the module file and its hash from disk", "why": "Disk survives power-off, so it outranks nothing — but it is still needed before the system changes."}, {"id": "i3", "t": "Power off and reimage from a trusted source", "why": "Destructive by definition — strictly last, after the evidence chain is complete."}], "hint": "Ask each step: if power died right after, would this evidence still exist? Run the would-not-survive steps first.", "expl": "Volatile-first: network state and /proc/modules (gone with power, seconds to capture), then the memory image (the specimen), then disk artefacts (survive power-off but still needed before changes), and only then the destructive rebuild. The order is not ritual — it is a volatility ranking, and courts and auditors ask why each step preceded the next. Skipping to the rebuild 'to be safe' is the single most common way junior responders convert a strong case into a weak one.", "study": "the volatility ordering principle applied to LKM incidents"}, {"id": "x12", "type": "terminal", "title": "Build the durable auditd rule", "lead": "Detection engineering sprint. The fleet (RHEL 8, x86_64) needs a durable auditd rule so module load AND unload syscalls reach the central log with a tag the SOC can search. This is the rule the whole AN1243 coverage rests on.", "scenario": [{"label": "Requirements card", "kind": "prose", "body": "One auditctl line. Requirements: (1) always,exit action; (2) 64-bit syscall architecture; (3) all three module syscalls — init_module, finit_module, delete_module; (4) keyed lkm_watch for ausearch."}, {"label": "Environment", "kind": "prose", "body": "RHEL 8, x86_64 only, no 32-bit userland. auditd installed and running. The rule must survive into the audit configuration management afterwards (that part is not your command)."}], "question": "Type the complete auditctl rule, press Enter to see the simulated daemon response, then Check.", "term": {"title": "simulated shell — nothing real is executed", "prompt": "[root@log-eng-01 ~]#", "banner": ["RHEL 8.9 — detection engineering workstation", "auditctl simulation active"], "notFound": "command not found", "simOut": [{"re": "auditctl[\\s\\S]*always[\\s\\S]*b64[\\s\\S]*(init_module[\\s\\S]*delete_module|delete_module[\\s\\S]*init_module)[\\s\\S]*lkm_watch", "out": ["AUDIT_STATUS: rule added (1 rules in effect)", "ausearch -k lkm_watch will now return module load/unload events"]}], "simFail": [{"re": "auditctl[\\s\\S]*-w\\s+/proc/modules", "out": "Rule accepted syntactically — but a file watch records READS of /proc/modules, not module-load syscalls. Check your approach."}, {"re": "auditctl[\\s\\S]*arch=b32", "out": "Rule added — but on this x86_64-only fleet, b32 rules record nothing. Verify your architecture filter."}], "expect": [{"el": "auditctl with an always,exit rule action", "re": "-a\\s+always\\s*,\\s*exit", "why": "The standard syscall-audit action: log on exit of the syscall."}, {"el": "architecture filter arch=b64 (x86_64 fleet)", "re": "arch=b64", "why": "Without b64 the rule records nothing on 64-bit-only hosts — the HARD-tier near-miss made durable."}, {"el": "all three module syscalls: init_module, finit_module, delete_module", "re": "(init_module[\\s\\S]*finit_module[\\s\\S]*delete_module|delete_module[\\s\\S]*init_module[\\s\\S]*finit_module|finit_module[\\s\\S]*init_module[\\s\\S]*delete_module)", "why": "Loads (two syscalls) AND removals — missing delete_module misses cleanup behaviour."}, {"el": "key -k lkm_watch", "re": "-k\\s+lkm_watch", "why": "The key makes the events searchable: ausearch -k lkm_watch."}], "traps": [{"re": "arch=b32", "note": "b32 alone records nothing on this x86_64 fleet — the near-miss that silently blinds the rule."}, {"re": "-w\\s+/proc/modules", "note": "A file watch on /proc/modules records file READS, not module-load syscalls — it looks right and detects almost nothing of value."}], "canonical": "auditctl -a always,exit -F arch=b64 -S init_module,finit_module,delete_module -k lkm_watch", "canonExpl": ["-a always,exit — audit the syscall on exit, always (no condition).", "-F arch=b64 — restrict to the 64-bit syscall table: the one this fleet actually uses.", "-S init_module,finit_module,delete_module — both load syscalls plus the removal syscall.", "-k lkm_watch — the search key: ausearch -k lkm_watch returns every matching event.", "This rule is the durable telemetry behind AN1243 on this fleet."]}, "hint": "Four graded elements: the action pair, the architecture filter, the three syscalls, and the search key. Order of the -F/-S parts is forgiven; their presence is not.", "expl": "The canonical rule: auditctl -a always,exit -F arch=b64 -S init_module,finit_module,delete_module -k lkm_watch. Graded elements: action, b64 filter, all three syscalls, the key. The traps are the two ways this rule fails silently in production: arch=b32 (nothing recorded on x86_64-only fleets) and -w on /proc/modules (file reads, not loads) — both look plausible and both blind the fleet. Option order inside -S is semantically free; the grader normalises it. This single line is what turns detection strategy DET0450's Linux analytic from a document into running telemetry.", "study": "auditd syscall rules — action, arch, syscall list, key"}, {"id": "x13", "type": "multi", "title": "Read the unified log like AN1244 does", "lead": "A MacBook (macOS 14) in the executive suite. You pulled the unified log slice around 03:41. Tag the AN1244 signals that are actually present — the analytic will be tuned against your tags.", "scenario": [{"label": "ARTEFACT — unified log extract (macbook-exec-02)", "kind": "log", "viewer": true, "name": "unified log 03:38–03:47", "lines": ["2026-03-23 03:41:02 kernel: (AppleSystemPolicy) kextload attempt: /Users/rvance/Downloads/quickfix.kext — REJECTED: signature not valid (no Apple-privileged Developer ID)", "2026-03-23 03:41:02 KernelPolicy: request from user rvance (admin) — KextPolicy: no matching approval record", "2026-03-23 03:41:44 systmd[99]: (csrutil) attempt to modify SIP status detected via recovery-adjacent binary — DENIED by policy", "2026-03-23 03:44:10 files: new bundle appeared under /Library/Extensions/ — quickfix.kext (installed, not loaded)", "2026-03-23 03:44:55 appstore: softwareupdate — Safari 17.4 update installed (signed, catalog verified)", "2026-03-23 03:45:30 vpn: IPsec rekey completed tunnel=corp-vpn-3"]}, {"label": "AN1244 signal list (from DET0450)", "kind": "prose", "body": "AN1244 detects: user-initiated kextload commands; modifications to /Library/Extensions; changes to the KextPolicy database or unauthorised developer signing identities; attempts to disable SIP; legacy extensions loaded from unsigned sources."}], "question": "Select every AN1244 signal present in this log slice.", "options": [{"t": "User-initiated kextload of an unsigned/legacy kext (rejected)", "c": true, "why": "The 03:41:02 kernel line is the textbook AN1244 event — rejected still counts."}, {"t": "A new bundle installed under /Library/Extensions", "c": true, "why": "03:44:10 — the file-monitoring half of the analytic."}, {"t": "An attempt to disable SIP", "c": true, "why": "03:41:44 — the SIP-tampering signal, denied but present."}, {"t": "A signed Safari update from the App Store catalog", "c": false, "why": "Software updates are normal admin activity — no kext, no policy event."}, {"t": "The IPsec VPN rekey", "c": false, "why": "Routine network maintenance noise — present in almost every log slice."}], "hint": "Three of the six lines are the attack; two are deliberate noise. Match against the AN1244 list, not against 'suspiciousness'.", "expl": "Present: rejected kextload (unsigned), new /Library/Extensions bundle, SIP-tampering attempt — three AN1244 signals, and note the KextPolicy 'no approval' line corroborating the first. Noise: the Safari update and the VPN rekey — normal events that prove the trap of tuning on 'weird-looking lines' instead of the analytic's defined signals. Also read the story: installed-but-not-loaded (03:44) after a rejection means the operator is staging for a second try — the detection rule that fires on ATTEMPTS is what buys you the rematch.", "study": "AN1244 signal list applied to unified log triage"}, {"id": "x14", "type": "qcm", "title": "The macOS kext endgame decision", "lead": "Platform architecture review. The Mac fleet is moving to macOS 14+. Kexts are deprecated since 10.15 in favour of System Extensions — but 'deprecated' is not 'gone': your DLP vendor still ships a kernel extension for two product lines, and the design team depends on specialist hardware drivers. Three proposals are on the table; two are popular and wrong.", "scenario": [{"label": "ATT&CK context — the page's wording", "kind": "prose", "body": "Since macOS Catalina 10.15, kernel extensions have been deprecated in favour of System Extensions. However, kexts are still allowed as 'Legacy System Extensions' since there is no System Extension for Kernel Programming Interfaces."}, {"label": "Fleet facts", "kind": "prose", "body": "DLP vendor: kext today, System Extension 'next year' (two years running). Design team: approved audio-interface kext, MDM-allowlisted, mission-critical. Current MDM: com.apple.syspolicy.kernel-extension-policy allowlist by team ID."}], "question": "Which proposal is the sound enterprise move?", "options": [{"t": "Approve the DLP System Extension where offered, keep the team-ID allowlist for the legacy kexts that still exist, and track the vendor migration with a deadline", "c": true, "why": "It moves where the platform moved, keeps only allowlisted legacy entries, and manages the residue actively."}, {"t": "Keep allowing ALL kexts like in 2015 — the DLP needs it anyway", "c": false, "why": "That is the pre-10.15 world: any admin-password kext loads. It also ignores M1018 entirely."}, {"t": "Block and remove every kext fleet-wide tonight — deprecation means dead", "c": false, "why": "Deprecation is not removal — the page says kexts remain allowed precisely because no System Extension covers kernel programming. The fleet-wide wipe breaks DLP and the design team for zero risk reduction on the real gap.", "cont": "(popular-but-wrong option — see feedback)"}, {"t": "Downgrade the fleet to an older macOS that still defaults to allowing kexts", "c": false, "why": "Running old macOS to keep weak defaults is a security regression wearing a compatibility costume."}], "hint": "The page's exact words matter: kexts remain allowed because a System Extension for kernel programming DOES NOT EXIST. Which proposal respects that reality while shrinking the surface?", "expl": "The sound move migrates what the platform has migrated (System Extensions where the vendor offers them), keeps legacy kexts only behind the MDM team-ID allowlist, and manages the vendor's roadmap with a deadline. The popular-but-wrong 'wipe everything tonight' fails on the page's own logic: legacy kexts remain a supported mechanism because kernel programming has no System Extension replacement — wiping breaks real work without removing the mechanism. And 'allow all kexts' is the 2015 posture that M1018 exists to end. Enterprise platform strategy is reading the platform's actual direction, not its slogans.", "study": "System Extensions vs legacy kexts; M1018 MDM policy design"}, {"id": "x15", "type": "fill", "title": "Draft the report sentence correctly", "lead": "The incident report's technique-mapping paragraph needs its identifiers filled in — wrong IDs in a report get bounced by the ATT&CK review board.", "scenario": [{"label": "Report paragraph", "kind": "prose", "body": "“The implant loads its code into the operating system kernel to guarantee re-execution after reboots. In MITRE ATT&CK (Enterprise, v20) this behaviour is tracked as {} (Kernel Modules and Extensions), a sub-technique of T1547, under the {} tactic; the same action also grants Ring-0 privilege, which is why the technique appears under Privilege Escalation as well.”"}], "question": "Fill both blanks: the full technique ID and the primary tactic name.", "sentence": "This behaviour is tracked as {} (Kernel Modules and Extensions), sub-technique of T1547, under the {} tactic.", "blanks": [{"accept": "t1547\\.006|1547\\.006", "disp": "T1547.006", "why": "The dotted sub-technique ID is T1547.006."}, {"accept": "persistence", "disp": "Persistence", "why": "The primary tactic named first on the card is Persistence."}], "hint": "Blank one is the dotted ID (T1547 dot 006). Blank two is the tactic that heads the card — the one about staying running.", "expl": "The report standard: T1547.006, dotted form for sub-techniques, with Persistence named as the primary tactic (Privilege Escalation is the second). ID discipline matters practically: the site, the matrices, and every detection tool key on the exact string — 'T1547' alone names the parent with 15 children, and 'kernel modules' alone matches nothing. Note the sentence also models good practice: one behaviour, two tactics, said explicitly.", "study": "ATT&CK ID conventions — dotted sub-technique IDs and tactic citation"}, {"id": "x16", "type": "drag", "title": "Place the statements on the right technique", "lead": "Final board exercise: the executive summary shrinks the case to four sentences. Each sentence must carry the RIGHT technique ID — executives repeat what you write, and the matrix columns differ.", "scenario": [{"label": "Summary sentences", "kind": "prose", "body": "Four sentences, four techniques. One of them describes the ROOTKIT behaviour itself (Defense Evasion), which overlaps with our technique but is a different object. One is a Windows artefact, one a Linux desktop artefact."}], "question": "Drag each sentence onto the technique it describes.", "bank": [{"id": "i0", "t": "a .ko registered to load at boot so attacker code runs again after every reboot (Linux)", "why": "The autostart mechanism via kernel modules — our subject."}, {"id": "i1", "t": "kernel code that hides files, processes and network use from tools", "why": "The rootkit behaviour itself — T1014 Rootkit (Defense Evasion). Overlaps T1547.006 but is a different object."}, {"id": "i2", "t": "a value added under the Windows Run key to start an EXE at logon", "why": "T1547.001 Registry Run Ke (function () {

  /* ---------------- scoring (spec contract) ---------------- */
  function scoreExercise(selectedItems, correctItems) {
    var N, H, W;
    if (Array.isArray(correctItems) && Array.isArray(selectedItems)) {
      N = correctItems.length;

      for (var i = 0; i < N; i++) set[correctItems[i]] = true;
      H = 0; W = 0;
      var seen = {};
      for (var j = 0; j < selectedItems.length; j++) {
        var x = selectedItems[j];
        if (seen[x]) continue;
        seen[x] = true;
        if (set[x]) H++; else W++;
      }
    } else {
      N = correctItems;
      H = selectedItems.correct || 0;
      W = selectedItems.wrong || 0;
    }
    if (!N) return 0;
    return Math.max(0, (H - W) / N);
  }

  /* ---------------- syntax highlighting ---------------- */
  var CMDWORDS = "modprobe|insmod|rmmod|lsmod|modinfo|depmod|kextload|kextunload|kextstat|auditd|auditctl|ausearch|init_module|finit_module|delete_module|osquery|rkhunter|chkrootkit|sudo|grep|systemctl|cat|dpkg|rpm|sha256sum|ls|insmod";

  function hl(line) {
    var out = "", last = 0, m;
    HLRE.lastIndex = 0;
    var raw = String(line == null ? "" : line);
    while ((m = HLRE.exec(raw)) !== null) {
      out += esc(raw.slice(last, m.index));
      if (m[1]) out += '<span class="ts">' + esc(m[1]) + "</span>";
      else if (m[2]) out += '<span class="path">' + esc(m[2]) + "</span>";
      else if (m[3]) out += '<span class="path">' + esc(m[3]) + "</span>";
      else if (m[4]) out += '<span class="cmd">' + esc(m[4]) + "</span>";
      else out += '<span class="warn">' + esc(m[5]) + "</span>";

      var p = parts[i];
      if (p.indexOf("/") === 0) h += ' <span class="path">' + esc(p) + "</span>";

  /* ---------------- log viewer component ---------------- */

  /* ---------------- timer state machine ---------------- */

      else if (T.state === "PAUSED_AUTO_CHECK") { pb.textContent = "⏸ Pause"; pb.disabled = false; }

  /* ---------------- intro screen ---------------- */

  /* ---------------- exam start / navigation ---------------- */
  function buildQueue() {

      if (q[i].type === "terminal" && q[i + 1].type === "terminal") {

  /* ---------------- widget builders ---------------- */
  function buildWidget(root, ex) {

  }
  function buildDnd(root, ex) {

  function placedSomewhere(ex, iid) {

  function makeChip(ex, it, inSlot) {

  function placeInto(ex, slotIdx) {

  function refreshDnd(ex) {

  function accList(slot) { return Array.isArray(slot.accept) ? slot.accept : [slot.accept]; }
  function revealDnd(ex, slotsEl) {

  function buildMatch(root, ex) {
    if (!ex._pool) {

  function buildFill(root, ex) {

    root.appendChild(holder);

  function accArr(a) { return Array.isArray(a) ? a : [a]; }

  /* ---------------- terminal ---------------- */
  function buildTerm(root, ex) {

    if (chk) chk.style.display = (ex._step < ex.steps.length - 1) ? "none" : "";
  }

  /* ---------------- grading ---------------- */
  function gradeExercise(ex) {
    var res = { credit: 0, rows: [], correctTxt: "", dangerous: null, canon: null };
    if (ex.type === "qcm" || ex.type === "multi") {
      var corrIds = ex.options.map(function (o, i) { return o.c ? "o" + i : null; }).filter(Boolean);
      var selIds = ex.type === "multi" ? ex._ans.slice() : (ex._ans ? [ex._ans] : []);
      res.credit = scoreExercise(selIds, corrIds);
      ex.options.forEach(function (o, i) {
        var oid = "o" + i;
        var chosen = selIds.indexOf(oid) >= 0;
        if (o.c && chosen) res.rows.push({ ico: "✓", word: "Correct", cls: "st-correct", txt: o.t + (o.why ? " — " + o.why : "") });
        else if (o.c && !chosen) res.rows.push({ ico: "○", word: "Missed", cls: "st-skipped", txt: o.t + (o.why ? " — " + o.why : "") });
        else if (!o.c && chosen) res.rows.push({ ico: "✗", word: "Wrong", cls: "st-incorrect", txt: o.t + (o.why ? " — " + o.why : "") });
      });
      var cor = ex.options.filter(function (o) { return o.c; }).map(function (o) { return o.t; }).join(" | ");
      res.correctTxt = "Correct answer: " + cor;
    } else if (ex.type === "drag" || ex.type === "order") {
      var n = ex.type === "order" ? ex.bank.length : ex.slots.length;
      var Hd = 0, Wd = 0;
      for (var i = 0; i < n; i++) {
        var acc = ex.type === "order" ? [ex.bank[i].id] : accList(ex.slots[i]);
        var got = ex._ans[i];
        if (got && acc.indexOf(got) >= 0) Hd++;
        else if (got) Wd++;
      }
      res.credit = scoreExercise({ correct: Hd, wrong: Wd }, n);
      for (var j = 0; j < n; j++) {
        var acc2 = ex.type === "order" ? [ex.bank[j].id] : accList(ex.slots[j]);
        var got2 = ex._ans[j];
        var needTxt = acc2.map(function (aid) { return ex.bank.filter(function (b) { return b.id === aid; })[0].t; }).join(" / ");
        var lbl = ex.type === "order" ? "Position " + (j + 1) : ex.slots[j].label;
        if (got2 && acc2.indexOf(got2) >= 0) {
          res.rows.push({ ico: "✓", word: "Correct", cls: "st-correct", txt: lbl + ": " + ex.bank.filter(function (b) { return b.id === got2; })[0].t });
        } else if (got2) {
          var gotTxt = ex.bank.filter(function (b) { return b.id === got2; })[0].t;
          res.rows.push({ ico: "✗", word: "Wrong", cls: "st-incorrect", txt: lbl + ": you placed “" + gotTxt + "”. Correct: “" + needTxt + "”." });
        } else {
          res.rows.push({ ico: "○", word: "Missed", cls: "st-skipped", txt: lbl + ": you left it empty. Correct: “" + needTxt + "”." });
        }
      }
      res.correctTxt = "See the item-by-item breakdown above.";
    } else if (ex.type === "match") {
      var Nm = ex.pairs.length, Hm = 0, Wm = 0;
      ex.pairs.forEach(function (p, i) {
        if (ex._ans[i] === "r" + i) Hm++;
        else if (ex._ans[i]) Wm++;
      });
      res.credit = scoreExercise({ correct: Hm, wrong: Wm }, Nm);
      ex.pairs.forEach(function (p, i) {
        var ok = ex._ans[i] === "r" + i;
        var chosenTxt = ex._ans[i] ? ex._pool.filter(function (x) { return x.id === ex._ans[i]; })[0].t : "(empty)";
        if (ok) res.rows.push({ ico: "✓", word: "Correct", cls: "st-correct", txt: p.l + " → " + p.r });
        else if (ex._ans[i]) res.rows.push({ ico: "✗", word: "Wrong", cls: "st-incorrect", txt: p.l + ": you chose “" + chosenTxt + "”. Correct: “" + p.r + "”." + (p.why ? " " + p.why : "") });
        else res.rows.push({ ico: "○", word: "Missed", cls: "st-skipped", txt: p.l + ": correct answer is “" + p.r + "”." + (p.why ? " " + p.why : "") });
      });
      res.correctTxt = "See the item-by-item breakdown above.";
    } else if (ex.type === "fill") {
      var H = 0, W = 0, Nn = ex.blanks.length;
      var resRows = [];
      ex.blanks.forEach(function (b, i) {
        var v = ex._ans[i];
        var disp = b.disp || accArr(b.accept)[0].replace(/\\/g, "");
        if (blankOk(b, v)) { H++; resRows.push({ ico: "✓", word: "Correct", cls: "st-correct", txt: "Blank " + (i + 1) + ": “" + v + "”. " + (b.why || "") }); }
        else if (v) { W++; resRows.push({ ico: "✗", word: "Wrong", cls: "st-incorrect", txt: "Blank " + (i + 1) + ": you typed “" + v + "”. Correct: “" + disp + "”. " + (b.why || "") }); }
        else { resRows.push({ ico: "○", word: "Missed", cls: "st-skipped", txt: "Blank " + (i + 1) + " was empty. Correct: “" + disp + "”. " + (b.why || "") }); }
      });
      res.credit = scoreExercise({ correct: H, wrong: W }, Nn);
      res.rows = resRows;
      res.correctTxt = "See the item-by-item breakdown above.";
    } else if (ex.type === "terminal") {
      var buf = ex._hist.length ? ex._hist[ex._hist.length - 1].cmd : (ex._cur || "");
      var nb = norm(buf);
      var H2 = 0, W2 = 0, Ne = ex.term.expect.length;
      ex.term.expect.forEach(function (e, i) {
        var re = new RegExp(e.re, "i");
        var ok = re.test(nb);
        if (ok) H2++; else res.rows.push({ ico: "○", word: "Missed", cls: "st-skipped", txt: "Element " + (i + 1) + " (" + e.el + ") is missing. " + (e.why || "") });
      });
      (ex.term.traps || []).forEach(function (tp) {
        if (new RegExp(tp.re, "i").test(nb)) {
          W2++;
          res.rows.unshift({ ico: "✗", word: "Wrong", cls: "st-incorrect", txt: "Your command contains: " + tp.note });
        }
      });
      if (!buf) res.rows.unshift({ ico: "○", word: "Missed", cls: "st-skipped", txt: "No command was submitted." });
      ex.term.expect.forEach(function (e, i) {
        var re = new RegExp(e.re, "i");
        if (re.test(nb)) res.rows.unshift({ ico: "✓", word: "Correct", cls: "st-correct", txt: "Element " + (i + 1) + " (" + e.el + "): found in your command." });
      });
      res.credit = scoreExercise({ correct: H2, wrong: W2 }, Ne);
      res.canon = ex.term.canonical;
      res.canonExpl = ex.term.canonExpl || [];
      if (W2 > 0) res.dangerous = ex.term.dangerousNote || "Your command would have changed the system or destroyed evidence.";
      res.correctTxt = "Canonical command: " + ex.term.canonical;
    } else if (ex.type === "sim") {
      var corrS = [], selS = [];
      ex.steps.forEach(function (st, i) {
        var corrK = st.options.map(function (o, k) { return o.c ? k : -1; }).filter(function (k) { return k >= 0; })[0];
        corrS.push(i + "#" + corrK);
        var chosenK = ex._ans[i] != null ? parseInt(String(ex._ans[i]).slice(1), 10) : (i === ex._step && ex._pick != null ? parseInt(String(ex._pick).slice(1), 10) : -1);
        if (chosenK >= 0) selS.push(i + "#" + chosenK);
      });
      res.credit = scoreExercise(selS, corrS);
      ex.steps.forEach(function (st, i) {
        var corrK = st.options.map(function (o, k) { return o.c ? k : -1; }).filter(function (k) { return k >= 0; })[0];
        var chosenK = ex._ans[i] != null ? parseInt(String(ex._ans[i]).slice(1), 10) : (i === ex._step && ex._pick != null ? parseInt(String(ex._pick).slice(1), 10) : -1);
        var corrTxt = st.options[corrK].t;
        if (chosenK === corrK) {
          res.rows.push({ ico: "✓", word: "Correct", cls: "st-correct", txt: "Step " + (i + 1) + ": " + st.options[chosenK].t + (st.options[chosenK].why ? " — " + st.options[chosenK].why : "") });
        } else if (chosenK >= 0) {
          res.rows.push({ ico: "✗", word: "Wrong", cls: "st-incorrect", txt: "Step " + (i + 1) + ": you chose “" + st.options[chosenK].t + "”" + (st.options[chosenK].why ? " — " + st.options[chosenK].why : "") + ". Correct: “" + corrTxt + "”" + (st.options[corrK].why ? " — " + st.options[corrK].why : "") });
        } else {
          res.rows.push({ ico: "○", word: "Missed", cls: "st-skipped", txt: "Step " + (i + 1) + " was never answered. Correct: “" + corrTxt + "”" + (st.options[corrK].why ? " — " + st.options[corrK].why : "") });
        }
      });
      res.correctTxt = "See the item-by-item breakdown above.";
    }
    return res;
  }
  /* ---------------- check / feedback / navigation ---------------- */
  function doCheck(auto) {
    var ex = S.disp || currentEx();
    if (!ex || ex._checked) return;
    if (ex.type === "sim" && ex._step < ex.steps.length - 1) return;
    if (ex.type !== "sim") {
      var hasAns = ex.type === "multi" ? ex._ans.length > 0 : ex.type === "fill" ? ex._ans.some(Boolean) : ex.type === "terminal" ? (ex._hist.length > 0 || !!(ex._cur || "").trim()) : (ex.type === "drag" || ex.type === "order") ? Object.keys(ex._ans).length > 0 : ex.type === "match" ? ex._ans.some(Boolean) : !!ex._ans;
      if (!hasAns && !auto) return;
    } else if (!ex._pick && !auto) return;
    /* spec: the Check button must, as its FIRST action, set PAUSED_AUTO_CHECK */
    if (T.state === "RUNNING") tSet("PAUSED_AUTO_CHECK");
    ex._checked = true;
    var g = gradeExercise(ex);
    var raw = g.credit;
    if (S.hintUsed[ex.id]) raw = Math.max(0, raw - 0.10);
    raw = Math.round(raw * 1000) / 1000;
    ex._credit = raw;
    S.credits[ex.id] = raw;
    S.answered[ex.id] = true;
    var si = S.skipped.indexOf(ex);
    if (si >= 0) S.skipped.splice(si, 1);
    renderScore();
    renderFeedback(ex, g, raw);
    var chk = $("#btn-check"); if (chk) chk.disabled = true;
    var nxt = $("#btn-next"); if (nxt) { nxt.style.display = ""; nxt.focus(); }
    var sk = $("#btn-skip"); if (sk) sk.style.display = "none";
    var hb = $("#btn-hint"); if (hb) hb.disabled = true;
    if (P.handle) { P.handle = null; }
    if (S.pos >= S.queue.length - 1 && S.view !== "review") {
      nxt.textContent = S.skipped.length > 0 ? "⚠ Review skipped & finish ▸" : "⏹ Final Submit";
    }
  }
  function labelFor(credit) {
    if (credit >= 0.999) return { t: "✓ CORRECT", cls: "f-correct", col: "st-correct" };
    if (credit > 0) return { t: "✓ PARTIALLY CORRECT", cls: "f-partial", col: "st-partial" };
    return { t: "✗ INCORRECT", cls: "f-incorrect", col: "st-incorrect" };
  }
  function renderFeedback(ex, g, raw, root) {
    if (!g) { g = ex._graded; raw = ex._credit; } else { ex._graded = g; }
    var L = labelFor(raw);
    var fb = elx("div", "feedback " + L.cls);
    var multi = ["multi", "drag", "order", "match", "fill", "terminal", "sim"].indexOf(ex.type) >= 0;
    var fractional = raw > 0 && raw < 0.999;
    fb.appendChild(elx("p", "fb-label " + L.col, L.t + (fractional ? " — credit " + raw.toFixed(2) : "")));
    if (multi || fractional) fb.appendChild(elx("p", "fb-credit", "Credit " + raw.toFixed(2) + (raw >= 0.999 ? " (full)" : " — formula max(0, (H − W) / N)")));
    if (g.dangerous) fb.appendChild(elx("div", "fb-danger", "✗ DANGEROUS — NEAR MISS: " + esc(g.dangerous)));
    var rows = elx("div", "item-rows");
    g.rows.forEach(function (r) {
      rows.appendChild(elx("div", "item-row", '<span class="ir-ico ' + r.cls + '">' + r.ico + '</span><span class="' + r.cls + '"><b>' + r.word + '</b></span><span>' + esc(r.txt) + "</span>"));
    });
    if (g.rows.length) fb.appendChild(rows);
    if (g.canon) {
      fb.appendChild(elx("div", "copyrow", '<button class="copybtn" type="button">Copy command</button>'));
      var cb = elx("div", "codeblock", hlCmd(g.canon));
      fb.appendChild(cb);
      $(".copybtn", fb).addEventListener("click", function () {
        try { navigator.clipboard.writeText(g.canon); this.textContent = "Copied!"; } catch (e) { this.textContent = "Select & copy manually"; }
      });
      (g.canonExpl || []).forEach(function (cx) { fb.appendChild(elx("div", "small", "• " + esc(cx))); });
    }
    fb.appendChild(elx("p", "fb-expl", esc(ex.expl)));
    if (g.correctTxt && !g.rows.length) fb.appendChild(elx("p", "small", esc(g.correctTxt)));
    var st = elx("div", "fb-study", "📚 What to study: " + esc(ex.study));
    fb.appendChild(st);
    var old = $(".feedback", root) || $("#fbwrap .feedback");
    if (old) old.remove();
    var host = (root && root.querySelector("#fbwrap")) || $("#fbwrap");
    host.appendChild(fb);
    var rmReduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    fb.scrollIntoView({ behavior: rmReduce ? "auto" : "smooth", block: "nearest" });
  }
  function goNext() {
    if (T.state === "PAUSED_AUTO_CHECK") tSet("RUNNING");
    S.pos += 1;
    var nextEx = currentEx();
    if (!nextEx) { afterQueue(); return; }
    showCurrent();
  }
  function doSkip() {
    if (S.view === "review") return;
    var ex = currentEx();
    if (!ex || ex._checked) return;
    S.skipped.push(ex);
    S.pos += 1;
    if (!currentEx()) { afterQueue(); return; }
    showCurrent();
  }
  function afterQueue() {
    if (S.skipped.length > 0) { S.view = "review"; renderReview(); }
    else finishExam(false);
  }

  /* ---------------- review skipped ---------------- */
  function renderReview() {
    S.view = "review";
    S.disp = null;
    var sk = $("#tb-skip"); if (sk) sk.style.display = "none";
    var area = $("#exarea");
    if (!area) { renderExamChrome(); area = $("#exarea"); }
    area.innerHTML = "";
    $("#tb-count").textContent = "Review — " + S.skipped.length + " skipped";
    renderProgress();
    var card = elx("div", "fade-in");
    card.appendChild(elx("h2", "", "⚠ Review skipped exercises"));
    card.appendChild(elx("p", "muted", "You skipped " + S.skipped.length + " exercise(s). You can answer them now, as many times as you need, until the timer ends. You can also submit without answering them — skipped-and-never-answered exercises are excluded from your score."));
    var list = elx("div", "review-list");
    S.skipped.forEach(function (ex, i) {
      var it = elx("div", "review-item");
      it.innerHTML = '<span class="st-skipped">⚠</span><span><b>Skipped</b> — ' + esc(TYPE_LBL[ex.type]) + ": " + esc(ex.title) + "</span>";
      var b = elx("button", "btn ri-btn", "Answer now ▸");
      b.addEventListener("click", function () { openSkipped(i); });
      it.appendChild(b);
      list.appendChild(it);
    });
    card.appendChild(list);
    var nav = elx("div", "step-nav");
    var fin = elx("button", "btn btn-primary", "⏹ Final Submit");
    fin.addEventListener("click", function () { finishExam(false); });
    nav.appendChild(fin);
    card.appendChild(nav);
    area.appendChild(card);
  }
  function openSkipped(i) {
    var ex = S.skipped[i];
    if (!ex) { renderReview(); return; }
    S.disp = ex;
    var area = $("#exarea");
    area.innerHTML = "";
    syncPerTimer(ex);
    $("#tb-count").textContent = "Review " + (i + 1) + " of " + S.skipped.length;
    var card = buildExerciseCard(ex, (i + 1) + " of " + S.skipped.length, true);
    area.appendChild(card);
    var nxt = $("#btn-next", card);
    var fresh = nxt.cloneNode(false);
    nxt.parentNode.replaceChild(fresh, nxt);
    fresh.textContent = "◂ Back to skipped list";
    fresh.addEventListener("click", function () {
      if (T.state === "PAUSED_AUTO_CHECK") tSet("RUNNING");
      renderReview();
    });
  }

  /* ---------------- results ---------------- */
  function finishExam(fromTimeout) {
    if (S.done && S.reported) return;
    S.done = true;
    S.view = "results";
    if (T.state !== "ENDED") tSet("ENDED");
    S.times.endTs = S.times.endTs || Date.now();
    if (P.handle) P.handle = null;
    var answered = Object.keys(S.credits).length;
    var sum = sumCredits();
    var pct = answered > 0 ? Math.round((sum / answered) * 100) : 0;
    var fully = 0, partly = 0, wrongly = 0;
    Object.keys(S.credits).forEach(function (k) {
      var c = S.credits[k];
      if (c >= 0.999) fully++;
      else if (c > 0) partly++;
      else wrongly++;
    });
    var skippedCount = S.queue.length - answered;
    var app = $("#app");
    app.innerHTML = "";
    var w = elx("div", "wrap fade-in");
    var cert = elx("div", "cert" + (pct >= PASS ? "" : " fail"));
    cert.appendChild(elx("div", "c-title", pct >= PASS ? "✓ PASS" : "✗ FAIL"));
    cert.appendChild(elx("div", "c-pct", pct + "%"));
    cert.appendChild(elx("div", "muted", (pct >= PASS ? "Congratulations — you reached the " + PASS + "% pass mark." : "You did not reach the " + PASS + "% pass mark. Retake the exam to try again.") + " Score computed over the " + answered + " answered exercise(s) only" + (fromTimeout ? " — the timer ended." : ".")));
    w.appendChild(cert);
    var grid = elx("div", "res-grid");
    function cell(num, lbl, cls, extra) {
      var c = elx("div", "res-cell");
      c.innerHTML = '<div class="rc-num ' + cls + '">' + num + '</div><div class="rc-lbl">' + esc(lbl) + (extra ? " — " + esc(extra) : "") + "</div>";
      return c;
    }
    var avgP = partly > 0 ? (Object.keys(S.credits).map(function (k) { return S.credits[k]; }).filter(function (c) { return c > 0 && c < 0.999; })) : [];
    var avg = avgP.length ? (avgP.reduce(function (a, b) { return a + b; }, 0) / avgP.length).toFixed(2) : "0";
    grid.appendChild(cell(fully, "Fully correct", "st-correct", "credit = 1"));
    grid.appendChild(cell(partly, "Partially correct", "st-partial", "avg credit " + avg));
    grid.appendChild(cell(wrongly, "Fully incorrect", "st-incorrect", "credit = 0"));
    grid.appendChild(cell(skippedCount, "Skipped — excluded", "st-skipped", "not counted"));
    w.appendChild(grid);
    var meta = elx("div", "card");
    var usedSec = Math.max(0, Math.round((S.times.endTs - S.times.startTs) / 1000));
    meta.innerHTML =
      '<p><b>Time used:</b> <span class="mono">' + fmtT(Math.min(usedSec, T.budget)) + "</span> of " + fmtT(T.budget) + " budget</p>" +
      '<p><b>⏸ Time paused manually:</b> <span class="mono">' + fmtT(Math.round(T.manualMs / 1000)) + "</span></p>" +
      '<p><b>⏸ Time paused reviewing feedback:</b> <span class="mono">' + fmtT(Math.round(T.feedbackMs / 1000)) + "</span></p>" +
      '<p class="muted small">Hints used: ' + Object.keys(S.hintUsed).length + " (each hint cost 10% of that exercise credit)</p>";
    w.appendChild(meta);
    var listCard = elx("div", "card");
    listCard.appendChild(elx("h2", "", "📋 Exercise review"));
    var list = elx("div", "res-list");
    S.queue.forEach(function (ex) {
      var c = S.credits[ex.id];
      var row = elx("div", "res-row");
      if (c == null) row.innerHTML = '<span class="rr-ico st-skipped">⚠</span><span class="st-skipped"><b>Skipped — excluded</b></span><span>' + esc(TYPE_LBL[ex.type]) + ": " + esc(ex.title) + '</span><span class="rr-cred">not counted</span>';
      else if (c >= 0.999) row.innerHTML = '<span class="rr-ico st-correct">✓</span><span class="st-correct"><b>Fully correct</b></span><span>' + esc(TYPE_LBL[ex.type]) + ": " + esc(ex.title) + '</span><span class="rr-cred">1.0</span>';
      else if (c > 0) row.innerHTML = '<span class="rr-ico st-partial">✓</span><span class="st-partial"><b>Partially correct</b></span><span>' + esc(TYPE_LBL[ex.type]) + ": " + esc(ex.title) + '</span><span class="rr-cred">' + c.toFixed(2) + "</span>";
      else row.innerHTML = '<span class="rr-ico st-incorrect">✗</span><span class="st-incorrect"><b>Fully incorrect</b></span><span>' + esc(TYPE_LBL[ex.type]) + ": " + esc(ex.title) + '</span><span class="rr-cred">0.0</span>';
      list.appendChild(row);
    });
    listCard.appendChild(list);
    w.appendChild(listCard);
    var navc = elx("div", "card start-row");
    var rb = elx("button", "btn btn-primary", "↻ Retake exam");
    rb.addEventListener("click", retake);
    navc.appendChild(rb);
    w.appendChild(navc);
    app.appendChild(w);
    reportScore(sum, answered);
  }

  /* ---------------- site integration (STEP 6) ---------------- */
  function reportScore(creditSum, answeredCount) {
    if (S.reported) return;
    S.reported = true;
    var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
    try {
      /* Report only when actually embedded in a site page (http/https same-origin iframe).
         Opened directly (file://, parent === window) there is nothing to report to. */
      if (window.parent && window.parent !== window && /^https?:$/.test(location.protocol)) {
        parent.postMessage({
          type: "CYBERPULSE_SCORE",
          topicId: META.topicId,
          batch: META.batch,
          score: Math.round(creditSum),
          total: answeredCount,
          percent: percent,
          passed: percent >= PASS
        }, location.origin);
      }
    } catch (e) {
      /* Opened directly rather than inside the site. Nothing to report to. */
    }
  }
  window.addEventListener("message", function (event) {
    if (!event.data) return;
    if (event.data.type !== "CYBERPULSE_INIT" && event.data.type !== "CYBERMASTERY_INIT") return;
    S.username = event.data.username || "";
    S.country = event.data.country || "";
    S.locale = event.data.locale || "en";
    /* theme field is always 'dark' — this file is dark-only by contract, nothing to switch */
    var chip = $("#learner-chip");
    if (S.username && chip) chip.textContent = "Learner: " + S.username;
  });

  /* ---------------- boot ---------------- */
  document.addEventListener("DOMContentLoaded", function () {
    renderIntro();
  });
})();

    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
