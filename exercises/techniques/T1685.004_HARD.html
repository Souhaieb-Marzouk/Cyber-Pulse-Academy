window.CM_META = {"topicId": "t1685.004", "batch": 3, "title": "T1685.004 Disable or Modify Linux Audit System Log — HARD", "difficulty": "hard", "questionCount": 16, "estimatedMinutes": 44, "passMark": 70, "sev": "hard", "sevName": "HARD", "sevColor": "#ff8a3d", "objId": "T1685.004", "objName": "Disable or Modify Linux Audit System Log", "objLine": "T1685.004 — Disable or Modify Linux Audit System Log", "objType": "Sub-Technique", "timerMinutes": 44, "timerSeconds": 2640, "partLabel": null, "keywords": [{"theme": "Detection engineering & tuning", "items": ["Analytics per data component", "Command-line watch on auditctl", "Service-state and process-termination analytics", "FIM analytics on /etc/audit/*", "Log-source heartbeat (\"detection of absence\")", "False-positive tuning with change data"]}, {"theme": "Mitigation design & trade-offs", "items": ["M1018 — User Account Management", "M1047 — Audit", "Immutable audit mode (-e 2)", "Sudo whitelisting and command logging", "Centralised log forwarding", "Evidence preservation before restoring logging"]}, {"theme": "Real-world procedure examples", "items": ["Ebury (S0377) — libaudit hooking for stealth SSH", "SkidMap (S0628) — audit rule edits and service stops", "Operation Windigo context", "Linux crypto-mining and SSH backdoor targeting"]}, {"theme": "Advanced evasion paths", "items": ["Hooking audit library functions", "ld.so.preload based hooking", "Why hooking survives restarts", "Baseline drift vs golden image"]}, {"theme": "Evidence & senior decisions", "items": ["Correlating sudo, ticket and baseline data", "Least-aggressive response under uncertainty", "Process ancestry as a trust signal", "Verdict wording with confidence levels"]}], "types": ["Log and artefact correlation with a filter box", "Multiple-choice questions with near-miss distractors", "Multi-select evidence sets (partial credit)", "Matching (analytics to data sources)", "Ordering a detection-engineering rollout", "Sort events into verdict bins (drag & drop)", "Fill-in-the-blank analytic specification", "Branching decisions with conflicting signals", "Two terminal exercises (environment given, tool not named)"], "learnTitle": "What you will learn here", "learnBody": "<p><b>This is the challenging tier.</b> The object is still <b>T1685.004 — Disable or Modify Linux Audit System Log</b>, the audit-tampering <b>Sub-Technique</b> of <b>T1685 — Disable or Modify Tools</b> under the <b>Defense Evasion</b> tactic. Here the answers are no longer obvious: options will look defensible, logs will contain noise, and sometimes the \"obvious\" action is exactly the wrong one.</p><p>You will work like a senior analyst: correlate the kernel audit log with sudo records, change tickets and EDR telemetry; decide between tampering and approved automation; protect evidence on a live host; and tune analytics so they catch attackers like <b>Ebury</b> (the Windigo SSH backdoor that hooked the audit library) and <b>SkidMap</b> (the Linux miner family that edits audit rules and services) without drowning in false positives from config management.</p><p>Two exercises use a simulated terminal where the environment is described but the tool is <b>not</b> named — choosing the wrong option letter there can be destructive, exactly like real life. Read twice, answer once.</p>"};
window.CM_EXERCISES = [{"id": "hard-01-immutable", "type": "mcq", "tag": "Kernel response", "summary": "Interpret the kernel error when auditctl -e 0 fails", "scenario": [{"k": "text", "label": "ARTEFACT 1 — EDR process telemetry, paycore-lin-02", "text": "An attacker-controlled root shell ran auditctl -e 0 and the command failed. The EDR captured the exact console output below. The IR lead asks what this error actually proves."}, {"k": "code", "label": "ARTEFACT 2 — Console output", "text": "$ auditctl -e 0\nError sending enable request: Operation not permitted\nThe audit system is in immutable mode, no reconfiguration until reboot"}], "question": "What does this output prove about the host’s audit configuration?", "hint": "The kernel refused the change — some earlier administrator locked the setting. What locks it, and until when?", "explain": "The error proves immutable mode (auditctl -e 2) was set: the kernel audit subsystem locks its enabled state and rule set until the next reboot, so even root cannot disable auditing live. A near-miss reading is \"auditd is broken\" — wrong: the daemon may be perfectly healthy, the kernel switch is simply locked. The attacker’s remaining options (edit rule files for the next boot, reboot) are noisy and give defenders time.", "study": "Add auditctl -e 2 to your hardening baseline and verify it survives a test reboot.", "options": [{"t": "The audit subsystem was locked with immutable mode (-e 2) until the next reboot", "correct": true}, {"t": "The auditd daemon is definitely broken on this host", "correct": false}, {"t": "The attacker lacks root on this host", "correct": false}, {"t": "The audit rules were already deleted", "correct": false}]}, {"id": "hard-02-chain-multi", "type": "multi", "tag": "Chain evidence", "summary": "Select the evidence lines that form the audit-tampering chain", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Triage note, edge-proxy-04", "text": "IR case 4412: initial access via a vulnerable file-upload service, then root through a misconfigured sudo rule. You must pick the lines that together evidence the T1685.004 behaviour chain. Noise lines are deliberate."}, {"k": "log", "label": "ARTEFACT 2 — Correlated log export (filter: audit)", "lines": ["Oct 17 23:41:02 edge-proxy-04 httpd[7702]: upload endpoint hit from 203[.]0[.]113[.]66 (lab replay)", "Oct 17 23:42:55 edge-proxy-04 sudo: www-data : USER=root ; COMMAND=/usr/bin/auditctl -a never,task -k quiet", "Oct 17 23:42:56 edge-proxy-04 auditd[1102]: config change requested by pid 7801 (auditctl)", "Oct 17 23:43:04 edge-proxy-04 systemd[1]: Started Daily apt upgrade and clean activities.", "Oct 17 23:44:19 edge-proxy-04 sudo: www-data : USER=root ; COMMAND=/usr/bin/systemctl stop auditd", "Oct 17 23:44:20 edge-proxy-04 systemd[1]: Stopped Audit Service.", "Oct 17 23:45:01 edge-proxy-04 CROND[9310]: (root) CMD (/usr/sbin/logrotate /etc/logrotate.conf)", "Oct 17 23:46:40 edge-proxy-04 sshd[9412]: Accepted password for root from 203[.]0[.]113[.]66 port 61022"]}], "question": "Which THREE lines together evidence the audit-tampering chain?", "hint": "A rule change request accepted by the kernel, a service stop, and the resulting Stopped state — the upload hit and cron are scaffolding.", "explain": "The chain is: auditctl -a never,task adds a blanket ignore rule (with a tell-tale \"config change requested\"), then systemctl stop auditd, then systemd confirms \"Stopped Audit Service\". Those three lines are the technique. The upload endpoint hit documents initial access, logrotate is routine, and the password login for root is a second access method — context, not the tampering chain itself.", "study": "Build chains, not single lines: request → action → state change.", "options": [{"t": "sudo: auditctl -a never,task -k quiet (rule ignore added)", "correct": true}, {"t": "auditd: config change requested by pid 7801", "correct": true}, {"t": "sudo + systemd: systemctl stop auditd → Stopped Audit Service", "correct": true}, {"t": "httpd upload endpoint hit", "correct": false}, {"t": "CROND logrotate line", "correct": false}]}, {"id": "hard-03-verdict-bins", "type": "assign", "tag": "Verdict bins", "summary": "Sort six findings into audit-tampering, log-clearing and expected-activity bins", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Case board, IR case 4412 (continued)", "text": "Six findings need verdict bins before the client call. Two bins map to specific techniques; one collects expected activity. Some findings were planted to mislead you — check mechanisms, not keywords."}, {"k": "table", "label": "ARTEFACT 2 — Findings", "head": ["#", "Finding"], "rows": [["1", "/etc/ld.so.preload now contains a library path (TTP: Ebury-style hooking)"], ["2", "audit.log.1 removed, audit.log intact (shell history)"], ["3", "package audit-2.8.5 installed by unattended-upgrades"], ["4", "ausearch run interactively by admin from a terminal"], ["5", "auditctl -R /etc/audit/audit.rules by config management (ticket attached)"], ["6", "systemctl disable auditd executed from a reverse shell"]]}], "question": "Place each finding into the correct bin.", "hint": "Hooking and disabling service = audit tampering; deleting a log file = clearing; package installs, admin reads and ticketed reloads are expected.", "explain": "Findings 1 and 6 are T1685.004 evidence: installing an audit-library hook and disabling the audit service. Finding 2 is T1070.002 evidence — a log file was removed. Findings 3, 4 and 5 are expected activity: package updates, admins using the search tool, and a ticketed config-management reload. Sorting by mechanism defeats the keyword trap \"anything with audit in it is an incident\".", "study": "Keep two buckets for two techniques and force every finding into one — ambiguity dies in bins.", "buckets": [{"id": "t1", "label": "T1685.004 — audit system tampering"}, {"id": "t2", "label": "T1070.002 — clearing log files"}, {"id": "exp", "label": "Expected / benign activity"}], "items": [{"id": "f1", "t": "ld.so.preload library hook installed", "bucket": "t1"}, {"id": "f6", "t": "systemctl disable auditd from reverse shell", "bucket": "t1"}, {"id": "f2", "t": "audit.log.1 removed", "bucket": "t2"}, {"id": "f3", "t": "audit package installed by unattended-upgrades", "bucket": "exp"}, {"id": "f4", "t": "admin runs ausearch interactively", "bucket": "exp"}, {"id": "f5", "t": "ticketed auditctl -R rules reload", "bucket": "exp"}]}, {"id": "hard-04-ebury-dual", "type": "branch", "tag": "Dual perspective — Ebury style", "summary": "Red choice then blue detection for an Ebury-style audit hook", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Purple-team design sheet (Ebury emulation)", "text": "The red team emulates Ebury (S0377), the Windigo SSH backdoor that hooked audit library functions so backdoor sessions were not written to audit logs. You design both halves of the emulation. The final Check grades both steps."}, {"k": "code", "label": "ARTEFACT 2 — Excerpt, ESET Ebury report (2014), summarised", "text": "Ebury hooked libaudit functions used by audit-aware programs, so logging calls silently did nothing\nResult: backdoor sessions absent from audit records while auditd itself stayed running"}], "question": "Decide the red action, then the blue detection anchor.", "hint": "Red: which action keeps auditd running while making its output blind? Blue: a hook must exist on disk — what watches it?", "explain": "Red picks library hooking — auditd keeps running (no service-stop alert), but audit calls from hooked programs produce nothing, mirroring Ebury. Blue anchors on file-integrity monitoring of preload and library paths (/etc/ld.so.preload, libaudit) plus EDR telemetry for unexpected library loads — because the hook must be installed on disk. Waiting for auditd to announce anything is the trap: it never notices a hooked caller.", "dual": {"red": "Red insight: the most durable evasion leaves the sensor alive and blinds the collector — fewer alarms, longer dwell.", "blue": "Blue insight: when a sensor reports nothing, watch the sensor’s dependencies — libraries, config, preload paths."}, "study": "Read the Ebury write-up mapping: hooking audit functions is why this sub-technique exists.", "steps": [{"text": "STEP 1 — RED SIDE. Root is yours on the lab host. Which emulation action best matches Ebury’s stealth profile?", "options": [{"t": "Hook audit library functions so calls from your backdoor do nothing"}, {"t": "systemctl stop auditd and leave it stopped"}, {"t": "Format the audit log partition"}, {"t": "Email the blue team your IP address"}], "correct": 0, "outcome": "Recorded: hooking keeps the service alive and the logs blind — the Ebury pattern."}, {"text": "STEP 2 — BLUE SIDE. Which detection anchor catches the hook installation, not just its effects?", "options": [{"t": "FIM on /etc/ld.so.preload and audit libraries plus EDR library-load telemetry"}, {"t": "A daily grep of audit.log for the word Ebury"}, {"t": "Waiting for auditd to report being hooked"}, {"t": "Watching the office door with a webcam"}], "correct": 0, "outcome": "Recorded: hooks install on disk — watch the disk, catch the hook."}]}, {"id": "hard-05-skidmap", "type": "mcq", "tag": "SkidMap reasoning", "summary": "Explain why a cryptominer bothers editing audit rules", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Honeypot incident note (SkidMap emulation)", "text": "A honeypot captured a SkidMap-style campaign: the dropper installed a Monero miner, then edited /etc/audit/audit.rules adding ignore rules and touched the audit service before starting the miner. The intern asks why a miner — whose CPU use is already loud — bothers with audit edits at all."}, {"k": "code", "label": "ARTEFACT 2 — Excerpt, Trustwave SkidMap honeypot note (2023), summarised", "text": "SkidMap variant adjusted audit rules and services so its miner and persistence were not logged\nEffect: mining loops and cron persistence absent from audit-based detections"}], "question": "What does the audit-rule editing actually buy the SkidMap operator?", "hint": "Miners loop on schedule — what would audit rules normally record about those loops, and how does that shorten defender reaction time?", "explain": "Mining and its cron persistence generate constant process activity that audit rules would record as execve and file-watch events. Editing the rules to ignore that activity extends the operator’s dwell time: the loudest part of the intrusion becomes invisible to audit-based detections, leaving only external clues. It is not about CPU stealth at all — it is about removing the audit record trail.", "study": "Ask of every intrusion: which telemetry did the attacker most fear, and did they touch it?", "options": [{"t": "It hides the mining and persistence activity from audit-based detections, extending dwell time", "correct": true}, {"t": "It reduces CPU load so the miner mines faster", "correct": false}, {"t": "It fixes a bug in the audit package", "correct": false}, {"t": "It makes the honeypot think the miner is a backup job", "correct": false}]}, {"id": "hard-06-analytic-match", "type": "match", "tag": "Analytics to sources", "summary": "Match five analytics to the data component they depend on", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Detection backlog grooming", "text": "Grooming the T1685.004 detection backlog: five candidate analytics, five data components. Match each analytic to the component it cannot work without."}], "question": "Match each analytic to its required data component.", "hint": "Typed command, dead process, changed file, service state, and the silence of the source itself.", "explain": "The command-line analytic needs Command Execution (it fires on auditctl strings); the auditd-terminated analytic needs Process Termination; the rules-diff analytic needs File Modification; the service-off analytic needs Service Metadata; and the \"no audit events in N minutes\" heartbeat needs the stream itself — the detection of absence. Each analytic inherits the blind spots of its source, which is why the heartbeat exists.", "study": "Write one analytic per data component, then one heartbeat across them all.", "items": [{"l": "Alert on auditctl commands outside change windows", "r": "Command Execution"}, {"l": "Alert when the auditd process terminates", "r": "Process Termination"}, {"l": "Alert on diffs of /etc/audit/audit.rules and audit.conf", "r": "File Modification"}, {"l": "Alert when the auditd unit enters inactive/disabled state", "r": "Service Metadata"}, {"l": "Alert when no audit events arrive for 15 minutes", "r": "Log-source heartbeat (absence detection)"}]}, {"id": "hard-07-rollout-order", "type": "order", "tag": "Detection rollout", "summary": "Order the five steps of a detection-engineering rollout", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Backlog ticket DET-118", "text": "Ticket DET-118: \"Build T1685.004 coverage for the Linux fleet end to end.\" The steps were written on sticky notes and fell on the floor. Order them: top = first. Engineering discipline: define, source, build, validate, tune."}, {"k": "code", "label": "ARTEFACT 2 — The five sticky notes", "text": "A. Map each attacker path to ATT&CK data components (command, process, file, service)\nB. Test with purple-team emulation including a libaudit hook (Ebury-style)\nC. Define the behaviour: list the paths that disable or modify Linux audit logging\nD. Tune thresholds and false positives with change and asset data\nE. Implement analytics in the SIEM/EDR for each data component plus a heartbeat"}], "question": "Put the rollout steps in the correct order.", "hint": "Define the behaviour first, then sources, then build, then validate against an emulation, then tune.", "explain": "C → A → E → B → D: define behaviour, map it to data components, implement the analytics, validate with a purple-team emulation (including the hook path, because it produces no service or process alert), and only then tune with real change and asset data. Testing before tuning is deliberate: tuning first hides the gaps the test would have found.", "study": "Copy this spine for your next detection backlog ticket.", "items": [{"id": "r1", "t": "Define the behaviour: list every audit-tampering path"}, {"id": "r2", "t": "Map paths to ATT&CK data components"}, {"id": "r3", "t": "Implement analytics per component plus a heartbeat"}, {"id": "r4", "t": "Validate with purple-team emulation including a hook"}, {"id": "r5", "t": "Tune false positives with change and asset data"}]}, {"id": "hard-08-terminal-s", "type": "terminal", "tag": "Terminal — triage", "summary": "Choose and type the read-only command that shows audit subsystem state", "scenario": [{"k": "text", "label": "ARTEFACT 1 — IR radio message", "text": "Case 4412, host edge-proxy-04, live response. The incident lead is on the radio: \"Tell me whether the kernel audit subsystem is enabled at all, how many rules are loaded, and whether anything is being lost — in one read-only shot. Do NOT change rule or enabled state.\" You have root, the shell is yours."}], "question": "Type the single read-only command that reports the audit subsystem’s enabled state, rule count and loss counters.", "hint": "The environment is described, the tool is not named. You want a status report — not a rule listing, and certainly nothing that writes.", "explain": "auditctl -s prints the kernel audit subsystem status in one shot: enabled flag (1 or 2 — 2 means immutable), how many rules are loaded, backlog and lost-event counters. It changes nothing. auditctl -D would have deleted every rule — the exact opposite of the lead’s order; auditctl -e anything writes state; auditctl -l lists rules but not the enabled flag or loss counters, so it misses two of the three requested facts.", "study": "In live response, \"one read-only shot\" means the status verb — in this family, that is -s.", "terminal": {"title": "root@edge-proxy-04: ~ (live response)", "prompt": "root@edge-proxy-04:~#", "canonical": "auditctl -s", "out": "enabled 1\nfailure 1\npid 1102\nrate_limit 0\nbacklog_limit 8192\nlost 0\nbacklog 0\nenabled 1 — rule count 14 — immutable 0", "banner": ["Live response shell on edge-proxy-04. Lead wants facts, not changes.", "Type your command, then press Check."], "elements": [{"re": "\\bauditctl\\b", "label": "auditctl (kernel audit tool)", "why": "Only auditctl reports the kernel audit subsystem state."}, {"re": "(^|\\s)-s(\\s|$)", "label": "-s (status report)", "why": "-s returns enabled flag, rule count, backlog and lost counters in one read-only shot."}], "forbidden": [{"re": "\\s-D(\\s|$)", "label": "-D (deletes all rules)", "why": "This destroys the rule set the lead asked you to report on — evidence loss."}, {"re": "\\s-e\\s*\\d", "label": "-e <n> (writes the enabled state)", "why": "The order said do not change state; -e writes state (0 disables, 1 enables, 2 locks)."}, {"re": "(^|\\s)-l(\\s|$)", "label": "-l (rule list only)", "why": "-l shows rules but not the enabled flag or loss counters — it answers only one of three questions."}]}}, {"id": "hard-09-least-aggressive", "type": "mcq", "tag": "Least-aggressive action", "summary": "Choose the response that preserves evidence on a live file server", "scenario": [{"k": "text", "label": "ARTEFACT 1 — IR bridge decision, case 4412", "text": "The bridge agrees edge-proxy-04 was audit-tampered by an intruder with root for at least 40 minutes. Business wants \"logging back NOW\". The IR lead holds the pen. Which action goes on the board first?"}, {"k": "table", "label": "ARTEFACT 2 — Options on the board", "head": ["#", "Candidate action"], "rows": [["1", "Snapshot memory and copy rules file, audit.conf and journals off-host"], ["2", "systemctl restart auditd immediately — visibility first"], ["3", "Rebuild the host from the gold image tonight"], ["4", "Wait a week — maybe the intruder will leave"]]}], "question": "Which action is correct as the FIRST step?", "hint": "Restarting restores visibility but also resets the very state the case depends on — what must exist before restoration is safe?", "explain": "Preserve first: a memory snapshot plus copies of the rules file, audit.conf and journals capture what the intruder changed and how. Restarting auditd is right — but only after preservation, because the restart erases runtime state and starts fresh rotation. Rebuilding tonight destroys evidence on the most interesting host; waiting a week lets the intruder deepen. Least-aggressive-first is a HARD discipline, not politeness.", "study": "Write \"preserve → restore → rebuild\" into the IR plan for tampered telemetry hosts.", "options": [{"t": "Snapshot memory and copy audit config, rules and journals off-host", "correct": true}, {"t": "Restart auditd immediately to restore visibility", "correct": false}, {"t": "Rebuild the host from the gold image tonight", "correct": false}, {"t": "Wait a week before doing anything", "correct": false}]}, {"id": "hard-10-analytic-fill", "type": "fill", "tag": "Analytic spec", "summary": "Complete the SIEM analytic specification from the word bank", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Analytic spec form DET-118-A2", "text": "The detection backlog form is half-filled. Bank is shuffled; one phrase per blank."}], "question": "Fill the four blanks to complete the analytic specification.", "hint": "Sequence: the process tool, the state change, the comparison baseline, and the noise filter.", "explain": "The spec reads: \"Fires when a process executes auditctl with a state-changing flag (such as -D, -e 0 or a never rule), or when the auditd unit transitions to inactive or disabled; compares the loaded rule set against the golden-image baseline; and suppresses matches that carry an approved change ticket.\" Without the baseline and the suppression the analytic would either miss edits or flood the queue.", "study": "Every analytic needs four parts: trigger, state, baseline, suppression." function normCmd(s) { return String(s).replace(/\s+/g, ' ').trim().toLowerCase(); }
function sameCmd(a, b) {
  if (a === b) return true;
  var ta = a.split(' ').filter(Boolean), tb = b.split(' ').filter(Boolean);
  if (ta.length !== tb.length) return false;
  var oa = ta.filter(function (t) { return t.charAt(0) === '-'; }).sort();
  var ob = tb.filter(function (t) { return t.charAt(0) === '-'; }).sort();
  var pa = ta.filter(function (t) { return t.charAt(0) !== '-'; });
  var pb = tb.filter(function (t) { return t.charAt(0) !== '-'; });
  return oa.join(' ') === ob.join(' ') && pa.join(' ') === pb.join(' ');
}

      '<div class="sample">Example on a different unit: <code>' + esc(t.syntax.example) + '</code>' +

/* ---------------- grading ---------------- */
function scoreExercise(H, W, N) { return Math.max(0, (H - W) / N); }
function grade(ex) {
  var I = S.inter, H, W, N, rows = [], i;
  if (ex.type === 'mcq') {
    N = 1;
    var picked = I.sel.length ? I.disp[I.sel[0]] : -1;
    var ok = picked >= 0 && ex.options[picked].correct;
    H = ok ? 1 : 0; W = ok ? 0 : (picked >= 0 ? 1 : 0);
    if (ok) rows.push({ st: 'ok', text: 'You picked the correct option.' });
    else if (picked >= 0) rows.push({ st: 'bad', text: 'You picked: \u201C' + ex.options[picked].t + '\u201D \u2014 not correct here.' });
    else rows.push({ st: 'bad', text: 'You did not pick any option.' });
    var co = ex.options.filter(function (o) { return o.correct; })[0];
    if (!ok) rows.push({ st: 'miss', text: 'Correct answer: \u201C' + co.t + '\u201D' });
    return { credit: scoreExercise(H, W, N), rows: rows };
  }
  if (ex.type === 'multi') {
    var corr = ex.options.map(function (o, oi) { return o.correct ? oi : -1; }).filter(function (x) { return x >= 0; });
    N = corr.length; H = 0; W = 0;
    ex.options.forEach(function (o, oi) {

function reportScore(creditSum, answeredCount) {

  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,

  } catch (e) { /* opened directly, nothing to report to */ }
}
