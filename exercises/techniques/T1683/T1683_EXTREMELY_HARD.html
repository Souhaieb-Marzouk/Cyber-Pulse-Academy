function rQcm(q, multi){
  QR[q.id].sel = [];
  var w = el('div');
  var sh = shuffle(q.options.map(function(o,i){return i;}));
  QR[q.id].map = sh;
  sh.forEach(function(oi, pos){
    var o = q.options[oi];
    var b = el('button','opt'+(multi?' multi':''));
    b.type='button'; b.setAttribute('role', multi?'checkbox':'radio');
    b.setAttribute('aria-checked','false');
    b.innerHTML = '<span class="lab">'+String.fromCharCode(65+pos)+'.</span><span class="txt">'+ md(o.t) +'</span>'+(multi?'<span class="mark" aria-hidden="true"></span>':'');
    b.onclick = function(){
      if(QR[q.id].locked) return;
      var i = QR[q.id].sel.indexOf(oi);
      if(multi){ if(i>=0){ QR[q.id].sel.splice(i,1); b.setAttribute('aria-checked','false'); b.classList.remove('sel'); b.querySelector('.mark').textContent=''; } else { QR[q.id].sel.push(oi); b.setAttribute('aria-checked','true'); b.classList.add('sel'); b.querySelector('.mark').textContent='✓'; } }
      else { QR[q.id].sel=[oi]; Array.prototype.forEach.call(w.querySelectorAll('.opt'),function(x){x.classList.remove('sel');x.setAttribute('aria-checked','false');}); b.classList.add('sel'); b.setAttribute('aria-checked','true'); }
    };
    w.appendChild(b);
  });
  return w;
}

function rMatch(q){
  QR[q.id].pairs = {}; QR[q.id].selL=null;
  var w = el('div');
  w.appendChild(el('div','small','Select one item on the left, then its partner on the right. Click a pair below to undo it.'));
  w.appendChild(el('div','small matchNotice hidden',''));
  var L = shuffle(q.pairs.map(function(p,i){return i;}));
  var R = shuffle(q.pairs.map(function(p,i){return i;}));
  QR[q.id].L=L; QR[q.id].R=R;
  var grid = el('div','matchwrap');
  var colL = el('div'); var colR = el('div');
  L.forEach(function(pi, pos){
    var b = el('button','mitem','<span class="tagno">'+String.fromCharCode(65+pos)+'.</span>'+ esc(q.pairs[pi].l));
    b.type='button'; b.setAttribute('data-side','L'); b.setAttribute('data-idx',pi);
    b.onclick=function(){ pickMatch(q,'L',pi,b); };
    colL.appendChild(b);
  });
  R.forEach(function(pi, pos){
    var b = el('button','mitem','<span class="tagno">'+ (pos+1) +'.</span>'+ esc(q.pairs[pi].r));
    b.type='button'; b.setAttribute('data-side','R'); b.setAttribute('data-idx',pi);
    b.onclick=function(){ pickMatch(q,'R',pi,b); };
    colR.appendChild(b);
  });
  grid.appendChild(colL); grid.appendChild(colR); w.appendChild(grid);
  var pl = el('div','mpairs','<b class="small">Your pairs</b><div id="plist" class="small">No pairs yet.</div>');
  w.appendChild(pl);
  return w;
}
function matchNotice(q, msg){
  var host = document.querySelector('.blk.answer .matchNotice');
  if(!host) return;
  if(msg){ host.textContent = msg; host.classList.remove('hidden'); }
  else { host.textContent=''; host.classList.add('hidden'); }
}
function pickMatch(q, side, idx, btn){
  var st = QR[q.id];
  if(st.locked) return;
  if(side==='L'){ st.selL = idx; Array.prototype.forEach.call(btn.parentNode.querySelectorAll('.mitem'),function(x){x.classList.remove('sel');}); btn.classList.add('sel'); matchNotice(q,null); }
  else {
    if(st.selL==null){ matchNotice(q,'Select an item on the left first, then its partner here.'); return; }
    st.pairs[st.selL]=idx;
    Array.prototype.forEach.call(btn.parentNode.querySelectorAll('.mitem'),function(x){ if(x.getAttribute('data-side')==='R') x.classList.remove('sel'); });
    var lb = null;
    Array.prototype.forEach.call(document.querySelectorAll('.mitem'),function(x){ if(x.getAttribute('data-side')==='L' && +x.getAttribute('data-idx')===st.selL){ lb=x; } });
    if(lb) lb.classList.add('paired');
    btn.classList.add('paired');
    st.selL=null; drawPairs(q);
  }
}
function drawPairs(q){
  var st = QR[q.id]; var p = $('plist'); if(!p) return;
  var html='';
  Object.keys(st.pairs).forEach(function(li){
    html += '<div class="p"><b>'+esc(q.pairs[li].l)+'</b> → '+esc(q.pairs[st.pairs[li]].r)+' <button class="sc-collapse" data-unpair="'+li+'" aria-label="Undo pair">undo</button></div>';
  });
  p.innerHTML = html || 'No pairs yet.';
  Array.prototype.forEach.call(p.querySelectorAll('[data-unpair]'), function(bn){
    bn.onclick=function(){
      var li=bn.getAttribute('data-unpair');
      var oldR = st.pairs[li];
      delete st.pairs[li];
      drawPairs(q);
      /* un-highlight exactly the affected items (left li, right oldR unless
         another left item is still paired to the same right item) */
      var stillUsed = Object.keys(st.pairs).some(function(k){ return String(st.pairs[k])===String(oldR); });
      Array.prototype.forEach.call(document.querySelectorAll('.mitem'),function(x){
        var side=x.getAttribute('data-side'), di=x.getAttribute('data-idx');
        if(side==='L' && di===String(li)) x.classList.remove('paired','sel');
        if(side==='R' && di===String(oldR) && !stillUsed) x.classList.remove('paired','sel');
      });
    };
  });
}

function rDrag(q){
  QR[q.id].place = {}; QR[q.id].selChip=null;
  var w = el('div');
  w.appendChild(el('div','small','Drag each card into a zone, or click a card and then click a zone. Click a placed card to send it back.'));
  var bank = el('div','bank'); bank.id='bank';
  var order = shuffle(q.chips.map(function(c,i){return i;}));
  QR[q.id].order = order;
  order.forEach(function(ci){
    var c = el('button','dchip','<i class="ic" aria-hidden="true">↔</i> '+ esc(q.chips[ci].t));
    c.type='button'; c.setAttribute('draggable','true'); c.setAttribute('data-chip',ci); c.id='chip'+ci;
    c.onclick=function(){ chipClick(q,ci); };
    c.ondragstart=function(ev){ ev.dataTransfer.setData('text/plain', String(ci)); };
    bank.appendChild(c);
  });
  w.appendChild(bank);
  var grid = el('div','dzgrid');
  q.zones.forEach(function(zn, zi){
    var z = el('div','dz'); z.setAttribute('data-zone',zi); z.id='zone'+zi;
    z.appendChild(el('div','dzname', esc(zn)));
    z.onclick=function(){ zoneClick(q,zi); };
    z.ondragover=function(ev){ ev.preventDefault(); z.classList.add('over'); };
    z.ondragleave=function(){ z.classList.remove('over'); };
    z.ondrop=function(ev){ ev.preventDefault(); z.classList.remove('over'); var ci=+ev.dataTransfer.getData('text/plain'); placeChip(q,ci,zi); };
    grid.appendChild(z);
  });
  w.appendChild(grid);
  return w;
}
function chipClick(q,ci){
  var st=QR[q.id]; if(st.locked) return;
  if(st.place[ci]!=null && st.place[ci]>=0){ delete st.place[ci]; redrawDnD(q); return; }
  st.selChip = ci;
  Array.prototype.forEach.call(document.querySelectorAll('.dchip'),function(x){x.classList.remove('sel');});
  var c=$('chip'+ci); if(c) c.classList.add('sel');
}
function zoneClick(q,zi){
  var st=QR[q.id]; if(st.locked||st.selChip==null) return;
  placeChip(q,st.selChip,zi);
}
function placeChip(q,ci,zi){
  var st=QR[q.id];
  if(st.place[ci]!=null && st.place[ci]>=0){ var zb=$('zone'+st.place[ci]); if(zb){ var old=zb.querySelector('#chip'+ci); if(old) zb.removeChild(old); } }
  st.place[ci]=zi;
  var c=$('chip'+ci); var z=$('zone'+zi);
  if(c&&z){ z.appendChild(c); c.classList.remove('sel'); }
  st.selChip=null;
}
function redrawDnD(q){
  q.chips.forEach(function(c,ci){
    var chip=$('chip'+ci); if(!chip) return;
    var z = QR[q.id].place[ci];
    if(z!=null && z>=0){ var zb=$('zone'+z); if(zb && chip.parentNode!==zb) zb.appendChild(chip); }
    else { var bk=$('bank'); if(bk && chip.parentNode!==bk) bk.appendChild(chip); }
  });
}

function rOrder(q){
  var items = shuffle(q.sequence.map(function(s,i){return i;}));
  QR[q.id].arr = items.slice();
  var w = el('div');
  w.appendChild(el('div','small','Put the steps in the right order. Use the arrow buttons or drag a row onto another row.'));
  var list = el('div','olist'); list.id='olist';
  w.appendChild(list);
  drawOrderInto(list, q);
  return w;
}
function drawOrder(q){
  var list=$('olist');
  if(list) drawOrderInto(list, q);
}
function drawOrderInto(list, q){
  list.innerHTML='';
  QR[q.id].arr.forEach(function(si, pos){
    var row = el('div','oitem'); row.setAttribute('draggable','true'); row.setAttribute('data-si',si);
    row.innerHTML = '<span class="pos">'+(pos+1)+'</span><span class="txt">'+ esc(q.sequence[si]) +'</span>';
    var up = el('button','mv','↑'); up.type='button'; up.setAttribute('aria-label','Move up');
    var dn = el('button','mv','↓'); dn.type='button'; dn.setAttribute('aria-label','Move down');
    up.onclick=function(){ moveOrder(q,pos,-1); };
    dn.onclick=function(){ moveOrder(q,pos,1); };
    row.appendChild(up); row.appendChild(dn);
    row.ondragstart=function(ev){ ev.dataTransfer.setData('text/plain',String(pos)); row.classList.add('dragging'); };
    row.ondragend=function(){ row.classList.remove('dragging'); };
    row.ondragover=function(ev){ ev.preventDefault(); };
    row.ondrop=function(ev){ ev.preventDefault(); var from=+ev.dataTransfer.getData('text/plain'); if(from!==pos){ var a=QR[q.id].arr; var it=a.splice(from,1)[0]; a.splice(pos,0,it); drawOrder(q); } };
    list.appendChild(row);
  });
}
function moveOrder(q,pos,d){
  var a=QR[q.id].arr; var np=pos+d;
  if(np<0||np>=a.length) return;
  var tmp=a[pos]; a[pos]=a[np]; a[np]=tmp;
  drawOrder(q);
}

function rFill(q){
  QR[q.id].fill = {};
  var w = el('div');
  var sent = el('div','fillwrap'); sent.id='fillsent';
  w.appendChild(sent);
  w.appendChild(el('div','rowlab','WORD BANK (shuffled — order means nothing)'));
  var bank = el('div','bankwords'); bank.id='wbank';
  var worder = shuffle(q.words.map(function(x,i){return i;}));
  QR[q.id].worder=worder;
  worder.forEach(function(wi){
    var c = el('button','wchip', esc(q.words[wi])); c.type='button'; c.setAttribute('data-wi',wi);
    c.onclick=function(){ selWord(q,wi,c); };
    bank.appendChild(c);
  });
  w.appendChild(bank);
  drawFillInto(sent, q);
  return w;
}
function selWord(q, wi, btn){
  var st=QR[q.id]; if(st.locked) return;
  st.selWord = (st.selWord===wi)? null : wi;
  Array.prototype.forEach.call(document.querySelectorAll('.wchip'),function(x){x.classList.remove('sel');});
  if(st.selWord!=null) btn.classList.add('sel');
}
function drawFill(q){
  var box=$('fillsent');
  if(box) drawFillInto(box, q);
}
function drawFillInto(box, q){
  var st=QR[q.id];
  var parts = q.sentence.split(/(\{\{\d+\}\})/);
  var html='';
  parts.forEach(function(p){
    var m = p.match(/^\{\{(\d+)\}\}$/);
    if(m){ var bi=+m[1]; var wi = st.fill[bi];
      html += '<button type="button" class="blank'+(wi!=null?' filled':'')+'" data-blank="'+bi+'" aria-label="Blank '+(bi+1)+'">'+ (wi!=null? esc(q.words[wi]) : '&nbsp;') +'</button>';
    } else { html += esc(p); }
  });
  box.innerHTML = html;
  Array.prototype.forEach.call(box.querySelectorAll('.blank'), function(bn){
    bn.onclick=function(){
      if(st.locked) return;
      var bi=+bn.getAttribute('data-blank');
      if(st.selWord!=null){ st.fill[bi]=st.selWord; st.selWord=null; Array.prototype.forEach.call(document.querySelectorAll('.wchip'),function(x){x.classList.remove('sel');}); }
      else { delete st.fill[bi]; }
      drawFill(q);
    };
  });
}

function rTerm(q){
  QR[q.id].lines = []; QR[q.id].typed='';
  var sh = q.shell;
  var w = el('div');
  if(sh.syntax){ /* EASY support panel */
    var sp = el('div','synpanel','<div class="t">SYNTAX REMINDER</div>'+ md(sh.syntax));
    w.appendChild(sp);
  }
  var t = el('div','term');
  var bar = el('div','term-bar','<span class="dot"></span> SIMULATED SHELL — nothing real is executed · type your command and press Enter or Run');
  t.appendChild(bar);
  var out = el('div','term-out'); out.id='tout';
  var banner = (sh.banner||[]).join('\n');
  out.textContent = banner + '\n';
  t.appendChild(out);
  var line = el('div','term-in');
  line.innerHTML = '<span class="pr">'+ esc(sh.prompt||'analyst@lab:~$') +'</span>';
  var inp = document.createElement('input');
  inp.type='text'; inp.id='tin'; inp.setAttribute('aria-label','Type your command'); inp.autocomplete='off'; inp.spellcheck=false;
  line.appendChild(inp);
  var run = el('button','','Run'); run.setAttribute('aria-label','Run the typed command');
  run.onclick=function(){ runCmd(q, inp.value); inp.value=''; inp.focus(); };
  line.appendChild(run);
  t.appendChild(line);
  w.appendChild(t);
  inp.onkeydown=function(ev){ if(ev.key==='Enter'){ runCmd(q, inp.value); inp.value=''; } };
  if(sh.sampleShape){
    var ss = el('div','synpanel','<div class="t">EXPECTED OUTPUT SHAPE</div><pre class="codeblock" style="background:#eceff4">'+ esc(sh.sampleShape) +'</pre>');
    w.appendChild(ss);
  }
  return w;
}
function normCmd(s){ return String(s||'').trim().replace(/\s+/g,' ').toLowerCase().replace(/[;]+$/,''); }
/* Token-level forgiveness: formatting never fails a student (spec rule).
   Straighten smart quotes, unwrap quoted tokens, drop one trailing
   punctuation mark. Flags, targets and values themselves are still graded. */
function cleanTok(t){
  t = String(t).replace(/[\u201C\u201D\u201E]/g,'"').replace(/[\u2018\u2019]/g,"'");
  if((t.charAt(0)==='"' && t.charAt(t.length-1)==='"' && t.length>1) ||
     (t.charAt(0)==="'" && t.charAt(t.length-1)==="'" && t.length>1)){ t = t.slice(1,-1); }
  t = t.replace(/[.,;:!?)\]]+$/,'');
  if(t==='[') t='';
  return t;
}
function cleanTokList(arr){
  var out=[];
  (arr||[]).forEach(function(t){ var c=cleanTok(t); if(c) out.push(c); });
  return out;
}
function runCmd(q, raw){
  var st=QR[q.id]; if(st.locked) return;
  st.typed = raw;
  var out=$('tout'); if(!out) return;
  var sh=q.shell;
  var n = normCmd(raw);
  out.textContent += (sh.prompt||'analyst@lab:~$') + ' ' + raw + '\n';
  if(!n){ out.textContent += '(type a command and press Enter)\n'; return; }
  var nToks = cleanTokList(n.split(' '));
  var nClean = nToks.join(' ');
  var toolOk = nToks.length>0 && nToks[0]===String(sh.tool).toLowerCase();
  var isExact = nClean === cleanTokList(normCmd(sh.canonical).split(' ')).join(' ');
  if(isExact && sh.outExact){ out.textContent += sh.outExact + '\n'; }
  else if(!toolOk){ out.textContent += (sh.unknown||('command not found: '+ n.split(' ')[0] +'. This lab accepts only the tools named in the training.')) + '\n'; }
  else if(sh.danger){
    var hit=false;
    sh.danger.forEach(function(dg){ try{ if(new RegExp(dg.re,'i').test(n)) hit=true; }catch(e){} });
    if(hit && sh.outDanger){ out.textContent += sh.outDanger + '\n'; }
    else if(toolOk){ out.textContent += (sh.outArgs || 'error: missing or wrong options — nothing was changed.') + '\n'; }
    else { out.textContent += (sh.unknown || ('command not found: '+ n.split(' ')[0] +'. This lab accepts only the tools named in the training.')) + '\n'; }
  }
  else { out.textContent += (sh.outArgs || 'error: missing or wrong options — nothing was changed.') + '\n'; }
  out.scrollTop = out.scrollHeight;
}

function rTree(q){

/* ===================== grading ===================== */
function gradeQuestion(q){
  var st=QR[q.id];
  var res = { N:0, H:0, W:0, items:[], credit:0 };
  var sel, corr=[];
  if(q.type==='qcm'||q.type==='multi'){
    sel = st.sel.slice();
    q.options.forEach(function(o,i){ if(o.correct) corr.push(i); });
    res.N = corr.length;
    var sc = scoreExercise(sel, corr);
    res.H=0; corr.forEach(function(ci){ if(sel.indexOf(ci)>=0) res.H++; });
    res.W = sel.length - res.H; if(res.W<0) res.W=0;
    var corrSet={};
    q.options.forEach(function(o,i){
      var state;
      if(o.correct) state = (sel.indexOf(i)>=0)?'ok':'missed';
      else state = (sel.indexOf(i)>=0)?'bad':null;
      if(state) res.items.push({state:state, label:md(o.t), why:o.why});
    });
    res.credit = sc;
  }
  else if(q.type==='match'){
    res.N=q.pairs.length;
    var msel=[], mcorr=[];
    q.pairs.forEach(function(p,i){
      mcorr.push(i+'>'+i);
      var got = st.pairs[i];
      if(got==null){ res.items.push({state:'missed', label:esc(p.l)+' → '+esc(p.r), why:p.why}); }
      else if(got===i){ res.H++; res.items.push({state:'ok', label:esc(p.l)+' → '+esc(p.r), why:p.why}); msel.push(i+'>'+i); }
      else { res.W++; res.items.push({state:'bad', label:esc(p.l)+' → '+esc(q.pairs[got].r), why:p.why}); msel.push(i+'>'+got); }
    });
    res.credit = scoreExercise(msel, mcorr);
  }
  else if(q.type==='dragdrop'){
    res.N=q.chips.length;
    var dsel=[], dcorr=[];
    q.chips.forEach(function(c,i){
      dcorr.push(i+'>'+c.zone);
      var got = st.place[i];
      if(got==null){ res.items.push({state:'missed', label:esc(c.t)+' — belongs in: '+esc(q.zones[c.zone]), why:c.why}); }
      else if(got===c.zone){ res.H++; res.items.push({state:'ok', label:esc(c.t)+' — '+esc(q.zones[c.zone]), why:c.why}); dsel.push(i+'>'+got); }
      else { res.W++; res.items.push({state:'bad', label:esc(c.t)+' — you placed it in: '+esc(q.zones[got]), why:c.why}); dsel.push(i+'>'+got); }
    });
    res.credit = scoreExercise(dsel, dcorr);
  }
  else if(q.type==='order'){
    res.N=q.sequence.length;
    var arr=st.arr;
    var osel=[], ocorr=[];
    arr.forEach(function(si,pos){
      ocorr.push(pos+'>'+q.sequence[pos]);
      osel.push(pos+'>'+si);
      if(si===q.sequence[pos]){ res.H++; res.items.push({state:'ok', label:'Position '+(pos+1)+': '+esc(q.sequence[si]), why:(q.orderWhy&&q.orderWhy[pos])||''}); }
      else { res.W++; res.items.push({state:'bad', label:'Position '+(pos+1)+': you placed '+esc(q.sequence[si]), why:('The correct item here is: '+q.sequence[pos]+'. '+(q.orderWhy&&q.orderWhy[pos])||'')}); }
    });
    res.credit = scoreExercise(osel, ocorr);
  }
  else if(q.type==='fill'){
    res.N=q.blankCorrect.length;
    var fsel=[], fcorr=[];
    q.blankCorrect.forEach(function(wi,bi){
      fcorr.push(bi+'>'+wi);
      var got = st.fill[bi];
      if(got==null){ res.items.push({state:'missed', label:'Blank '+(bi+1)+' — correct word: '+esc(q.words[wi]), why:(q.blankWhy&&q.blankWhy[bi])||''}); }
      else if(got===wi){ res.H++; res.items.push({state:'ok', label:'Blank '+(bi+1)+': '+esc(q.words[wi]), why:(q.blankWhy&&q.blankWhy[bi])||''}); fsel.push(bi+'>'+got); }
      else { res.W++; res.items.push({state:'bad', label:'Blank '+(bi+1)+': you used '+esc(q.words[got]), why:('The correct word is '+q.words[wi]+'. '+(q.blankWhy&&q.blankWhy[bi])||'')}); fsel.push(bi+'>'+got); }
    });
    res.credit = scoreExercise(fsel, fcorr);
  }
  else if(q.type==='terminal'){
    var sh=q.shell;
    var n = normCmd(st.typed||'');
    var toks = n? cleanTokList(n.split(' ')) : [];
    var elems=[]; /* {key,label,got} */
    var expectTokens={};
    expectTokens[String(sh.tool).toLowerCase()]=true;
    (sh.verbs||[]).forEach(function(v){ expectTokens[String(v).toLowerCase()]=true; });
    (sh.targets||[]).forEach(function(t){ expectTokens[String(t).toLowerCase()]=true; });
    (sh.flags||[]).forEach(function(f){ expectTokens[String(f).toLowerCase()]=true; (sh.aliases&&sh.aliases[f]||[]).forEach(function(a){ expectTokens[a.toLowerCase()]=true; }); });
    var aliasMap={};
    (sh.flags||[]).forEach(function(f){ (sh.aliases&&sh.aliases[f]||[]).forEach(function(a){ aliasMap[a.toLowerCase()]=f; }); });
    var hitTool = toks.length>0 && toks[0]===String(sh.tool).toLowerCase();
    elems.push({key:'tool', label:'tool `'+sh.tool+'`', got:hitTool});
    (sh.verbs||[]).forEach(function(v){
      elems.push({key:'verb', label:'verb `'+v+'`', got: toks.indexOf(String(v).toLowerCase())>=0 });
    });
    (sh.targets||[]).forEach(function(t){
      elems.push({key:'target', label:'target `'+t+'`', got: toks.indexOf(String(t).toLowerCase())>=0 });
    });
    (sh.flags||[]).forEach(function(f){
      var alts=(sh.aliases&&sh.aliases[f]||[]).map(function(a){return a.toLowerCase();});
      var got = toks.indexOf(String(f).toLowerCase())>=0 || alts.some(function(a){ return toks.indexOf(a)>=0; });
      elems.push({key:'flag', label:'option `'+f+'`', got:got});
    });
    res.N=elems.length;
    var tsel=[], tcorr=[];
    elems.forEach(function(e2,i){
      tcorr.push('e'+i);
      if(e2.got){ res.H++; tsel.push('e'+i); res.items.push({state:'ok', label:e2.label, why:(sh.elementWhy&&sh.elementWhy[i])||''}); }
      else { res.items.push({state:'missed', label:e2.label, why:(sh.elementWhy&&sh.elementWhy[i])||''}); }
    });
    var xk=0;
    toks.forEach(function(tk){
      if(tk && !expectTokens[tk]){ tsel.push('x'+(xk++)); }
    });
    res.credit = scoreExercise(tsel, tcorr);
    if(n){ res.typed=n; }
    res.dangerNote = null;
    var nClean = toks.join(' ');
    if(sh.danger){
      sh.danger.forEach(function(dg){ try{ if(new RegExp(dg.re,'i').test(nClean || n)) res.dangerNote=dg.why; }catch(e){} });
    }
  }
  else if(q.type==='tree'){
    res.N=q.steps.length;
    var qsel=[], qcorr=[];
    q.steps.forEach(function(s,i){
      qcorr.push('s'+i);
      var chosen = st.ans[i];
      var bestIdx=-1;
      s.options.forEach(function(o,oi){ if(o.best) bestIdx=oi; });
      if(chosen==null){ res.items.push({state:'missed', label:'Step '+(i+1)+' — not answered', why:(s.options[bestIdx]&&s.options[bestIdx].why)||''}); }
      else if(chosen===bestIdx){ res.H++; qsel.push('s'+i); res.items.push({state:'ok', label:'Step '+(i+1)+': '+md(s.options[chosen].t), why:s.options[chosen].why}); }
      else { res.W++; qsel.push('s'+i+'w'); res.items.push({state:'bad', label:'Step '+(i+1)+': '+md(s.options[chosen].t), why:(s.options[chosen].why + ' Better: ' + s.options[bestIdx].t + '. ' + s.options[bestIdx].why)}); }
    });
    res.credit = scoreExercise(qsel, qcorr);
  }
  if(S.hintUsed[q.id]) res.credit = Math.max(0, res.credit - 0.10);
  res.credit = Math.max(0, Math.round(res.credit*10000)/10000);
  return res;
}

/* ===================== check & feedback ===================== */
function doCheck(){
  var q=currentQ(); if(!q) return;
  var st=QR[q.id]; if(st.locked) return;
  if(TM.state==='RUNNING'){ TM.setState('PAUSED_AUTO_CHECK'); }
  var res = gradeQuestion(q);
  S.checked[q.id] = res.credit;
  var i = S.order.indexOf(q.id);
  S.creditSum += res.credit; S.answered += 1;
  st.locked = true;
  lockWidgets(q);
  showFeedback(q, res);
  drawHdr(); refreshHdrButtons();
  var fb = document.querySelector('.blk.feedback');
  if(fb) fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function autoGradeSub(){
  var q=currentQ(); if(!q||!q.subTimer) return;
  var st=QR[q.id];
  if(st && !st.locked){ runCmd(q, (QR[q.id].typed||'')); doCheck(); }
}
function lockWidgets(q){
  var card=$('excard'); if(!card) return;
  /* Note: artefact filter inputs stay enabled so the learner can keep
     filtering the logs while studying the feedback. */
  Array.prototype.forEach.call(card.querySelectorAll('button.opt, button.mitem, button.dchip, button.wchip, button.blank, .oitem button, .term-in input, .term-in button'), function(x){ x.disabled=true; });
  var chk=$('bCheck'); if(chk){ chk.disabled=true; }
}
function showFeedback(q, res){
  var label, cls, icon;
  if(res.credit>=1){ label='CORRECT'; cls='correct'; icon='✓'; }
  else if(res.credit>0){ label='PARTIALLY CORRECT'; cls='partial'; icon='✓'; }
  else { label='INCORRECT'; cls='incorrect'; icon='✗'; }
  var h = '<div class="blk feedback '+cls+'" id="fb">';
  h += '<div class="blk-head" tabindex="-1"><i class="ic">'+icon+'</i><span>'+label+'</span></div><div class="blk-body">';
  if(res.N>1 || q.type==='match' || q.type==='dragdrop' || q.type==='order' || q.type==='fill' || q.type==='terminal' || q.type==='tree'){
    h += '<div class="credline">credit '+ (Math.round(res.credit*100)/100) +' — '+ res.H +'/'+ res.N +' items';
    if(res.W>0) h += ' · '+res.W+' wrong';
    h += '</div>';
    if(S.hintUsed[q.id]) h += '<div class="small">includes the −10% hint deduction.</div>';
    if(res.dangerNote) h += '<div class="warnbox">⚠ Dangerous command detected: '+ md(res.dangerNote) +'</div>';
    h += '<ul class="itemlist">';
    res.items.forEach(function(it){
      var st = it.state==='ok'? '<span class="st ok">✓ Correct</span>' : it.state==='bad'? '<span class="st bad">✗ Wrong</span>' : '<span class="st miss">○ Missed</span>';
      h += '<li>'+st+'<span>'+it.label+'<br><span class="small">'+it.why+'</span></span></li>';
    });
    h += '</ul>';
  } else {
    if(S.hintUsed[q.id]) h += '<div class="small">includes the −10% hint deduction.</div>';
  }
  if(q.type==='terminal' && q.shell){
    h += '<div class="rowlab">CANONICAL COMMAND (copyable)</div>';
    h += '<div class="copyblk"><pre class="codeblock" id="canon">'+ esc(q.shell.canonical) +'</pre><button class="cp" id="cpBtn" type="button">Copy</button></div>';
    h += '<div class="exp small">' + q.shell.canonicalExplain.map(function(x){ return esc(x); }).join('<br>') + '</div>';
  }
  h += '<div class="exp">'+ md(q.explanation) +'</div>';
  if(q.study) h += '<div class="study"><b>What to study next:</b> '+ md(q.study) +'</div>';
  h += '</div></div>';
  var card=$('excard');
  var div = el('div'); div.innerHTML=h;
  var fbEl = div.firstChild;
  fbEl.setAttribute('role','region');
  fbEl.setAttribute('aria-label','Grading result: '+label);
  card.appendChild(fbEl);
  var cp=$('cpBtn');
  if(cp) cp.onclick=function(){ try{ navigator.clipboard.writeText(q.shell.canonical); cp.textContent='Copied'; }catch(e){ cp.textContent='Copy failed'; } };
  wireNext();
  var fh = fbEl.querySelector('.blk-head');
  if(fh) fh.focus({preventScroll:true});
}

  card.appendChild(buildScenario(q));
  card.appendChild(blk('question','❓','QUESTION','<p class="qtext">'+ md(q.question) +'</p>'));
  var ab = blk('answer','✍','YOUR ANSWER',''); ab.firstChild.nextSibling.appendChild(answerBody(q));
  card.appendChild(ab);
  window.scrollTo({top:0, behavior:'auto'});
  drawHdr(); refreshHdrButtons();
}

/* ===================== review skipped ===================== */
function renderReview(){
  S.phase='review'; S.mode='review';
  var host=screenHost(); host.innerHTML='';
  var hdr = el('div',''); hdr.id='hdr'; hdr.innerHTML='<div class="row"></div>';
  host.appendChild(hdr);
  var card = el('div',''); card.id='excard';
  host.appendChild(card);
  var w = el('div','panel');
  w.appendChild(el('h2',null,'Review skipped exercises'));
  w.appendChild(el('p','small','You skipped '+S.skipped.length+' exercise(s). You may answer them now, as many times as you like, until the timer ends. Skipped exercises you never answer are left out of your score.'));
  var list = el('div','revlist');
  S.skipped.slice().forEach(function(id, i){
    var q=QBY[id];
    var row = el('div','revrow');
    row.appendChild(el('span','rt', (i+1)+'. '+esc(q.title)));
    var ans = el('button','btn primary','Answer');
    ans.disabled = (TM.state==='ENDED');
    ans.onclick=function(){ answerSkipped(id); };
    row.appendChild(ans);
    list.appendChild(row);
  });
  if(S.skipped.length===0) list.appendChild(el('p','small','Nothing skipped.'));
  w.appendChild(list);
  var acts = el('div','acts');
  var fin = el('button','btn big','Finish exam and see results');
  fin.onclick=function(){ endExam(false); };
  acts.appendChild(fin);
  if(TM.state==='ENDED') acts.appendChild(el('span','note','The timer has ended — you can no longer answer skipped exercises.'));
  w.appendChild(acts);
  card.appendChild(w);
  drawHdr(); refreshHdrButtons();
}
function answerSkipped(id){
  var ix = S.skipped.indexOf(id);
  if(ix>=0) S.skipped.splice(ix,1);
  S.mode='review'; S.selQid=id;
  var q=QBY[id];
  QR[q.id]={locked:false};
  if(q.subTimer){ SUB.active=true; SUB.qid=id; SUB.total=q.subTimer; SUB.remaining=q.subTimer; }
  var host=screenHost(); host.innerHTML='';
  var hdr = el('div',''); hdr.id='hdr'; hdr.innerHTML='<div class="row"></div>';
  host.appendChild(hdr);
  var card = el('div',''); card.id='excard'; host.appendChild(card);
  card.appendChild(el('div','exnum','RETURNED SKIPPED EXERCISE · '+esc(CFG.sevLabel)+' TIER · MAX 1.0 CREDIT'));
  card.appendChild(buildScenario(q));
  card.appendChild(blk('question','❓','QUESTION','<p class="qtext">'+ md(q.question) +'</p>'));
  var ab = blk('answer','✍','YOUR ANSWER',''); ab.firstChild.nextSibling.appendChild(answerBody(q));
  card.appendChild(ab);
  drawHdr(); refreshHdrButtons();
}

/* ===================== results ===================== */
function endExam(byTimeout){
  TM.setState('ENDED');
  SUB.active=false;
  S.phase='results';
  var answeredIds = Object.keys(S.checked);
  var creditSum=0; answeredIds.forEach(function(id){ creditSum += S.checked[id]; });
  var answeredCount = answeredIds.length;
  var percent = answeredCount>0 ? Math.round((creditSum/answeredCount)*100) : 0;
  var passed = percent >= CFG.passMark;
  var full=0, part=0, zero=0, partSum=0;
  answeredIds.forEach(function(id){ var c=S.checked[id]; if(c>=1) full++; else if(c>0){ part++; partSum+=c; } else zero++; });
  var unanswered = QS.length - answeredCount;
  var host=screenHost(); host.innerHTML='';
  var hdr = el('div',''); hdr.id='hdr'; hdr.innerHTML='<div class="row"></div>';
  host.appendChild(hdr); drawHdr();
  var w = el('div','screen');
  var head = el('div','intro-head','<h1>Results — '+esc(CFG.title)+'</h1>'+badgeHTML());
  w.appendChild(head);
  var cert = el('div','cert'+(passed?'':' fail'),
     '<div class="t">'+(passed?'✓ PASS — certificate earned':'✗ FAIL — retake required')+'</div>'+
     '<div class="d">Final score: <b>'+ (Math.round(creditSum*10)/10) +' / '+answeredCount+'</b> · <b>'+percent+'%</b> (pass mark '+CFG.passMark+'%)'+
     (passed? '<br>Congratulations. You reached the pass mark on this '+esc(CFG.sevLabel)+' tier for T1683 Generate Content.'
            : '<br>You must retake this exam to pass the '+esc(CFG.sevLabel)+' tier.')+'</div>');
  w.appendChild(cert);
  var g = el('div','resgrid');
  g.appendChild(el('div','rescard','<div class="n">'+full+'</div><div class="l">FULLY CORRECT (credit 1.0)</div>'));
  g.appendChild(el('div','rescard','<div class="n">'+part+'</div><div class="l">PARTIALLY CORRECT'+(part? ' · AVG CREDIT '+ (Math.round((partSum/part)*100)/100):'')+'</div>'));
  g.appendChild(el('div','rescard','<div class="n">'+zero+'</div><div class="l">FULLY INCORRECT (credit 0)</div>'));
  g.appendChild(el('div','rescard','<div class="n">'+unanswered+'</div><div class="l">SKIPPED / NOT ANSWERED — EXCLUDED FROM SCORE</div>'));
  w.appendChild(g);
  w.appendChild(el('div','panel','<h2>How your score was built</h2>'+
    '<p class="small">Multi-answer exercises were scored per item with <code>credit = max(0, (correct − wrong) / items)</code>. '+
    'Hints cost 10% of one exercise\'s credit. Skipped exercises you never answered are excluded from both the score and the total.</p>'+
    '<div class="timesreport">⏸ Time paused manually: <b>'+fmtT(TM.manualMs/1000)+'</b><br>⏸ Time paused while reviewing feedback (Check auto-pause): <b>'+fmtT(TM.autoMs/1000)+'</b><br>'+
    (byTimeout? 'The timer ran out before you submitted — unanswered exercises were excluded.' : 'You finished within the time limit.')+'</div>'));
  var acts = el('div','acts');
  var rt = el('button','btn primary big','Retake Exam');
  rt.onclick=function(){ retake(); };
  acts.appendChild(rt);
  w.appendChild(acts);
  host.appendChild(w);
  window.scrollTo({top:0, behavior:'auto'});
  reportScore(creditSum, answeredCount, percent, passed);
}
function reportScore(creditSum, answeredCount, percent, passed){
  if(S.reported) return;
  S.reported = true;
  try {
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId: CFG.topicId,
      batch: CFG.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: passed
    }, location.origin);
  } catch(e) { /* opened directly, nothing to report to */ }
}
function retake(){
  S.attempt++; S.reported=false;
  resetState();
  renderExamShell();
  TM.remaining=CFG.timerSeconds; TM.manualMs=0; TM.autoMs=0; TM.state='IDLE';
  TM.start();
  renderExercise();
}

/* ===================== site handshake ===================== */
var GREETING=null;
window.addEventListener('message', function(event){
  if(!event.data) return;
  if(event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  GREETING = event.data;
});
/* ===================== boot ===================== */
renderIntro();
setInterval(tick, 250);
})();

</script>
</body>
