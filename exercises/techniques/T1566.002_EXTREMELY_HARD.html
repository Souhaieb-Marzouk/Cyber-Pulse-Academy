<style>
:root{
  --bg-page:#0b1020; --bg-surface:#121a2e; --bg-surface-2:#0f1729;
  --border:#243049; --border-soft:#1c2740;
  --text-primary:#e6ecff; --text-secondary:#a9b4d0; --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff; --accent-amber:#ffb454; --accent-green:#57d38c;
  --state-correct:#57d38c; --state-partial:#ffb454; --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0; --state-paused:#9d7bff;
  --bg-log:#0a0f1e; --bg-term:#070b16; --tok-mail:#9dd6ff; --tok-id:#c9a7ff;
  --sev-easy:#57d38c; --sev-medium:#ffb454; --sev-hard:#ff8a3d; --sev-extreme:#ff6b6b;
  --sev:var(--sev-easy);
  --shadow:0 10px 24px rgba(0,0,0,.35);
  --radius:8px;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
html{color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-ui);font-size:16px;line-height:1.55;}
body.sev-easy{--sev:var(--sev-easy);}
body.sev-medium{--sev:var(--sev-medium);}
body.sev-hard{--sev:var(--sev-hard);}
body.sev-extreme{--sev:var(--sev-extreme);}
.wrap{max-width:1020px;margin:0 auto;padding:18px 16px 60px;}
a{color:var(--accent-blue);}
code,.mono{font-family:var(--font-mono);}
button{font-family:var(--font-ui);}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px;}
[hidden]{display:none !important;}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.4px;border:1px solid;}
.badge .dot{width:8px;height:8px;border-radius:50%;background:currentColor;}
.badge-sev{color:var(--sev);border-color:var(--sev);background:color-mix(in srgb,var(--sev) 12%,transparent);}
.badge-correct{color:var(--state-correct);border-color:var(--state-correct);background:color-mix(in srgb,var(--state-correct) 12%,transparent);}
.badge-partial{color:var(--state-partial);border-color:var(--state-partial);background:color-mix(in srgb,var(--state-partial) 12%,transparent);}
.badge-incorrect{color:var(--state-incorrect);border-color:var(--state-incorrect);background:color-mix(in srgb,var(--state-incorrect) 12%,transparent);}
.badge-skipped{color:var(--state-skipped);border-color:var(--state-skipped);background:color-mix(in srgb,var(--state-skipped) 10%,transparent);}
.badge-paused{color:var(--state-paused);border-color:var(--state-paused);background:color-mix(in srgb,var(--state-paused) 12%,transparent);}

/* ---------- header ---------- */
#hdr{position:sticky;top:0;z-index:40;background:var(--bg-surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow);}
#hdr .hrow{max-width:1020px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;}
#hdr .brand{font-weight:800;letter-spacing:.3px;font-size:15px;display:flex;align-items:center;gap:8px;}
#hdr .brand .cid{color:var(--accent-blue);font-family:var(--font-mono);}
#hdr .hitem{display:flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:14px;}
#hdr .hitem b{color:var(--text-primary);font-family:var(--font-mono);font-weight:700;}
#hdr .hspacer{flex:1;}
.hbtn{background:var(--bg-surface-2);border:1px solid var(--border);color:var(--text-primary);padding:9px 14px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;}
.hbtn:hover{border-color:var(--accent-blue);}
.hbtn:disabled{opacity:.45;cursor:not-allowed;}
.hbtn.primary{background:linear-gradient(135deg,color-mix(in srgb,var(--accent-green) 22%,var(--bg-surface-2)),var(--bg-surface-2));border-color:var(--accent-green);color:var(--accent-green);font-weight:800;}
.hbtn.big{font-size:16px;padding:12px 22px;}
#tstate-ind{font-size:13px;font-weight:700;}
.tst-running{color:var(--state-correct);}
.tst-paused{color:var(--state-paused);}
.tst-ended{color:var(--state-incorrect);}
#timer-txt{min-width:64px;text-align:right;}

/* ---------- progress ---------- */
#pbar-wrap{height:6px;background:var(--bg-surface-2);border-bottom:1px solid var(--border);overflow:hidden;}
#pbar{height:100%;width:0%;background:linear-gradient(90deg,var(--sev),color-mix(in srgb,var(--sev) 55%,transparent));position:relative;transition:width .4s ease;}
#pbar::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 2.8s linear infinite;}
@keyframes sheen{0%{transform:translateX(-100%);}60%,100%{transform:translateX(100%);}}

/* ---------- cards & blocks ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.block{margin:16px 0;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-surface);overflow:hidden;}
.block-h{display:flex;align-items:center;gap:8px;padding:9px 14px;font-weight:800;font-size:14px;letter-spacing:1.2px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bc) 10%,var(--bg-surface));}
.block-h .bh-ico{font-size:15px;}
.block-h .bh-txt{color:var(--bc);}
.block.scenario{--bc:var(--accent-blue);}
.block.question{--bc:var(--accent-amber);}
.block.answer{--bc:var(--accent-green);}
.block.scenario .block-h{border-left:4px solid var(--accent-blue);}
.block.question .block-h{border-left:4px solid var(--accent-amber);}
.block.answer .block-h{border-left:4px solid var(--accent-green);}
.block-b{padding:14px 16px;}
.scn-intro{margin:0 0 10px;color:var(--text-primary);}
.artefact{margin:10px 0;border:1px solid var(--border-soft);border-radius:6px;background:var(--bg-surface-2);}
.art-label{font-family:var(--font-mono);font-size:12px;color:var(--accent-blue);padding:6px 10px;border-bottom:1px solid var(--border-soft);letter-spacing:.6px;}
.art-note{padding:10px 12px;color:var(--text-secondary);font-size:14px;}
pre.mono{margin:0;padding:12px;font-family:var(--font-mono);font-size:14px;line-height:1.5;color:var(--text-mono);white-space:pre-wrap;word-break:break-word;background:var(--bg-surface-2);}
.q-text{margin:0;font-size:17px;font-weight:700;color:var(--text-primary);}
.step-chip{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:12px;background:color-mix(in srgb,var(--accent-amber) 15%,transparent);color:var(--accent-amber);border:1px solid var(--accent-amber);vertical-align:middle;}

/* collapsible scenario */
.scn-sum{display:flex;align-items:center;gap:8px;padding:8px 14px;color:var(--text-secondary);font-size:14px;border-bottom:1px dashed var(--border);}
.collapse-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text-secondary);border-radius:6px;padding:6px 10px;cursor:pointer;min-height:44px;font-size:13px;}
.collapse-btn:hover{color:var(--text-primary);border-color:var(--accent-blue);}

/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:12px 14px;margin:8px 0;cursor:pointer;color:var(--text-primary);font-size:15.5px;line-height:1.5;min-height:48px;}
.opt .olab{font-family:var(--font-mono);font-weight:800;color:var(--accent-blue);flex:0 0 auto;}
.opt:hover{background:color-mix(in srgb,var(--accent-blue) 8%,var(--bg-surface-2));border-color:var(--accent-blue);}
.opt.sel{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset,0 0 0 3px color-mix(in srgb,var(--accent-green) 18%,transparent);background:color-mix(in srgb,var(--accent-green) 9%,var(--bg-surface-2));}
.opt .osel-ind{margin-left:auto;color:var(--accent-green);font-weight:800;font-size:13px;white-space:nowrap;}
.opt.lock{cursor:default;}
.opt.right{border-color:var(--state-correct);}
.opt.wrong{border-color:var(--state-incorrect);}
.opt .mini-ic{font-weight:800;font-size:13px;white-space:nowrap;}

/* ---------- word bank / fill ---------- */
.blk-text{font-size:16px;color:var(--text-primary);line-height:1.8;}
select.blank{font-family:var(--font-mono);font-size:14px;background:var(--bg-surface-2);color:var(--text-mono);border:1px solid var(--border);border-radius:5px;padding:6px 8px;margin:0 3px;min-height:44px;}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.chip{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:999px;padding:7px 13px;font-family:var(--font-mono);font-size:13.5px;color:var(--text-mono);cursor:pointer;min-height:44px;}
.chip.sel{border-color:var(--accent-green);color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}

/* ---------- drag & drop ---------- */
.dd-wrap{display:grid;grid-template-columns:1fr 1.2fr;gap:14px;}
.dd-bank,.dd-zone{border:1px dashed var(--border);border-radius:8px;padding:10px;min-height:90px;background:var(--bg-surface-2);}
.dd-zone.hlit{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.dd-zt{font-size:13.5px;font-weight:800;color:var(--accent-blue);margin-bottom:8px;letter-spacing:.4px;}
.dd-item{display:flex;align-items:center;gap:8px;background:var(--bg-surface);border:1px solid var(--border);border-radius:6px;padding:9px 11px;margin:7px 0;font-size:14.5px;cursor:grab;color:var(--text-primary);}
.dd-item .rm{margin-left:auto;border:none;background:transparent;color:var(--state-incorrect);cursor:pointer;font-weight:800;font-size:14px;min-width:44px;min-height:44px;}
.dd-item.sel{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.dd-hintline{font-size:13px;color:var(--text-secondary);margin:4px 0 8px;}

/* ---------- order / rank ---------- */
.ord-list{list-style:none;margin:0;padding:0;}
.ord-item{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:8px 0;}
.ord-item .rk{font-family:var(--font-mono);font-weight:800;color:var(--accent-amber);min-width:30px;text-align:center;}
.ord-item .ot{flex:1;}
.ord-ctrls{display:flex;gap:6px;}
.ord-btn{border:1px solid var(--border);background:var(--bg-surface);color:var(--text-primary);border-radius:5px;min-width:44px;min-height:44px;cursor:pointer;font-size:15px;}
.ord-btn:hover{border-color:var(--accent-blue);}
.ord-item.dragover{border-color:var(--accent-green);}

/* ---------- match ---------- */
.mt-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
.mt-left{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:14.5px;}
.mt-left .mt-q{font-weight:700;}
.mt-slot{margin-top:8px;display:flex;align-items:center;gap:8px;}
.mt-drop{flex:1;border:1px dashed var(--border);border-radius:5px;padding:7px 10px;font-family:var(--font-mono);font-size:13px;color:var(--text-secondary);min-height:38px;background:var(--bg-surface);}
.mt-drop.hlit{border-color:var(--accent-green);}
.mt-drop .fillv{color:var(--text-mono);}
.mt-clear{border:none;background:transparent;color:var(--state-incorrect);font-weight:800;cursor:pointer;min-width:44px;min-height:44px;}

/* ---------- log viewer ---------- */
.logv{border:1px solid var(--border-soft);border-radius:6px;background:var(--bg-log);margin:8px 0;}
.logv-head{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border-soft);}
.logv-src{font-family:var(--font-mono);font-size:12.5px;color:var(--accent-blue);}
.logv-filter{margin-left:auto;flex:0 1 240px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:5px;color:var(--text-mono);font-family:var(--font-mono);font-size:13px;padding:7px 9px;min-height:44px;}
.logv pre{max-height:300px;overflow:auto;margin:0;padding:10px 12px;font-family:var(--font-mono);font-size:13.5px;line-height:1.55;color:var(--text-mono);}
.logv .ln{display:block;white-space:pre-wrap;word-break:break-word;}
.l-ts{color:var(--accent-amber);} .l-ip{color:var(--accent-blue);} .l-url{color:var(--accent-green);} .l-kw{color:var(--state-incorrect);font-weight:700;} .l-mail{color:var(--tok-mail);} .l-id{color:var(--tok-id);} .l-warn{color:var(--state-incorrect);}

/* ---------- terminal ---------- */
.term{background:var(--bg-term);border:1px solid var(--border-soft);border-radius:8px;font-family:var(--font-mono);font-size:14px;}
.term-bar{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border-soft);align-items:center;}
.tdot{width:10px;height:10px;border-radius:50%;}
.term-title{margin-left:8px;color:var(--text-secondary);font-size:12.5px;}
.term-out{padding:10px 12px;max-height:260px;overflow:auto;color:var(--text-mono);line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.term-in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border-soft);align-items:center;}
.term-prompt{color:var(--accent-green);font-weight:700;white-space:nowrap;}
.term-in input{flex:1;background:transparent;border:none;color:var(--text-mono);font-family:var(--font-mono);font-size:14px;padding:8px 2px;min-height:40px;}
.term-in input:focus-visible{outline:1px solid var(--accent-green);}
.syn-panel{border:1px solid var(--border-soft);border-left:4px solid var(--accent-blue);border-radius:6px;background:var(--bg-surface-2);padding:10px 12px;margin:10px 0;}
.syn-panel h5{margin:0 0 6px;font-size:13px;color:var(--accent-blue);letter-spacing:.5px;}
.syn-panel pre{margin:4px 0;font-family:var(--font-mono);font-size:13px;color:var(--text-mono);white-space:pre-wrap;}
.syn-panel .ex{color:var(--text-secondary);}

/* ---------- triage ---------- */
.tri-card{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin:10px 0;}
.tri-title{font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.tri-meta{color:var(--text-secondary);font-size:13.5px;margin-top:3px;font-family:var(--font-mono);}
.tri-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.tri-act{border:1px solid var(--border);background:var(--bg-surface);color:var(--text-primary);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:13.5px;min-height:40px;}
.tri-act.sel{border-color:var(--accent-green);color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.tri-act.sel-tri{border-color:var(--accent-amber);color:var(--accent-amber);}

/* ---------- feedback ---------- */
#fbk{margin:16px 0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
#fbk .fb-h{display:flex;align-items:center;gap:10px;padding:10px 14px;font-weight:800;letter-spacing:.8px;border-bottom:1px solid var(--border);}
.fb-correct{background:color-mix(in srgb,var(--state-correct) 12%,var(--bg-surface));color:var(--state-correct);}
.fb-partial{background:color-mix(in srgb,var(--state-partial) 12%,var(--bg-surface));color:var(--state-partial);}
.fb-incorrect{background:color-mix(in srgb,var(--state-incorrect) 12%,var(--bg-surface));color:var(--state-incorrect);}
.fb-danger{background:color-mix(in srgb,var(--state-incorrect) 18%,var(--bg-surface));color:var(--state-incorrect);}
#fbk .fb-b{padding:14px 16px;}
.item-row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border-soft);border-radius:6px;margin:7px 0;background:var(--bg-surface-2);font-size:14.5px;}
.it-correct{color:var(--state-correct);} .it-wrong{color:var(--state-incorrect);} .it-missed{color:var(--state-skipped);}
.item-row .it-ic{font-weight:800;flex:0 0 auto;}
.item-row .it-tx{color:var(--text-primary);}
.credit-line{font-family:var(--font-mono);font-weight:700;margin-top:6px;}
.study-line{margin-top:10px;padding:9px 12px;border-left:4px solid var(--accent-amber);background:color-mix(in srgb,var(--accent-amber) 8%,transparent);border-radius:0 6px 6px 0;color:var(--text-primary);font-size:14.5px;}
.canon{border:1px solid var(--border-soft);border-radius:6px;background:var(--bg-surface-2);margin:10px 0;}
.canon .canon-h{display:flex;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border-soft);font-family:var(--font-mono);font-size:12.5px;color:var(--accent-green);}
.copy-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text-secondary);border-radius:5px;padding:4px 10px;cursor:pointer;font-size:12px;min-height:44px;}
.copy-btn:hover{color:var(--text-primary);border-color:var(--accent-green);}

/* ---------- nav ---------- */
.nav-row{display:flex;gap:10px;align-items:center;margin:18px 0;}
.nav-note{color:var(--text-secondary);font-size:13.5px;margin-left:auto;}

/* ---------- hint ---------- */
#hint-panel{margin:12px 0;border:1px solid var(--accent-amber);border-left:4px solid var(--accent-amber);border-radius:0 6px 6px 0;background:color-mix(in srgb,var(--accent-amber) 8%,transparent);padding:10px 14px;color:var(--text-primary);font-size:14.5px;}
#hint-panel .hp-h{color:var(--accent-amber);font-weight:800;font-size:13px;letter-spacing:.6px;margin-bottom:4px;}

/* ---------- overlay / pause ---------- */
#overlay{position:fixed;inset:0;background:rgba(5,8,18,.92);z-index:80;display:flex;align-items:center;justify-content:center;}
.ov-card{max-width:460px;margin:20px;text-align:center;padding:30px;border:1px solid var(--state-paused);border-radius:10px;background:var(--bg-surface);box-shadow:var(--shadow);}
.ov-card .ov-ic{font-size:34px;color:var(--state-paused);}
.ov-card h2{color:var(--state-paused);margin:10px 0 6px;}
.ov-card p{color:var(--text-secondary);}

/* ---------- intro ---------- */
.intro-head{padding:18px 20px;}
.intro-title{font-size:24px;font-weight:900;margin:0 0 4px;color:var(--text-primary);}
.intro-sub{color:var(--text-secondary);font-size:15px;margin:0 0 12px;}
.fact-row{display:flex;flex-wrap:wrap;gap:10px;}
.fact{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:10px 14px;min-width:150px;}
.fact .f-l{font-size:12px;color:var(--text-secondary);letter-spacing:.8px;text-transform:uppercase;}
.fact .f-v{font-size:17px;font-weight:800;color:var(--text-primary);font-family:var(--font-mono);}
.kw-theme{border:1px solid var(--border-soft);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin:10px 0;}
.kw-theme h4{margin:0 0 8px;color:var(--accent-blue);font-size:14px;letter-spacing:.5px;}
.kw-list{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none;}
.kw-list li{border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--text-mono);font-family:var(--font-mono);background:var(--bg-surface);}
.how-list{margin:8px 0 0;padding-left:20px;color:var(--text-primary);}
.how-list li{margin:8px 0;}
.learn-p{color:var(--text-primary);}
.role-tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.role-tag{border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--accent-green);background:var(--bg-surface-2);}

/* ---------- review ---------- */
.rv-list{list-style:none;margin:0;padding:0;}
.rv-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin:9px 0;background:var(--bg-surface-2);}
.rv-row .rv-t{flex:1;}
.rv-row .rv-s{font-size:13px;color:var(--text-secondary);}

/* ---------- results ---------- */
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0;}
.res-cell{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:14px;}

window.EXAM_INTRO={"title":"T1566.002 — EXTREMELY HARD practice exam","subline":"Expert certification exam: chained decisions, conflicting signals, incomplete data and business cost on Spearphishing Link.","obj":"T1566.002 — Spearphishing Link","learn":["This is the expert tier for <b>T1566.002 — Phishing: Spearphishing Link</b> (Sub-Technique of <b>T1566 Phishing</b>, tactic <b>Initial Access</b>, TA0001). The scenarios chain <b>three or more concepts</b>, hand you artefact sets with <b>irrelevant noise and missing pieces</b>, and demand the kind of call a senior analyst, senior responder or senior detection engineer makes when the CISO wants a decision in ten minutes.","You will resolve <b>contradictions</b>: an endpoint agent that says 'clean' against a proxy record that shows a credential POST; a mail gateway that says 'rewritten and detonated, clean' against a direct hit from personal webmail that never passed the gateway. You will weigh answers that cost real money — isolating a finance estate on payroll day — and cases where the correct action is to <b>wait, gather evidence, or escalate</b> instead of acting.","You will also operate the craft at scale: MSP tenant-to-tenant response with adversary-in-the-middle credential capture, legal-grade evidence preservation, attribution with partial infrastructure overlap, and the detection-strategy budgeting that ATT&amp;CK's DET0107 analytics imply. Widely used 'best practices' appear — and in at least one case the best practice is the wrong answer <i>here</i>.","Everything in this file is calibrated to the expert band: long artefact sets, several defensible-looking options, and exactly one defensible answer <i>in this world</i>. Read everything, then decide. Defend the decision in your head before you press Check."],"roles":["Senior SOC analyst / IC","Senior incident responder","Detection engineering lead","CTI lead","CISO advisor","MSP security lead"],"kw":[{"theme":"Chained object knowledge","items":["T1566.002 delivery chain end-to-end","T1204 User Execution follow-through","T1528 token theft via consent pages","Device code phishing pattern"]},{"theme":"Conflicting signal resolution","items":["EDR-clean vs proxy POST","Gateway rewrite vs personal webmail bypass","Which sensor wins, and why"]},{"theme":"Cost-bearing decisions","items":["Isolation on payroll day","Evidence vs downtime","Proportionality under CISO pressure"]},{"theme":"Evidence & legal discipline","items":["Read-only extraction","Chain of custody","Retention limits as stated evidence bounds"]},{"theme":"Detection strategy at scale","items":["DET0107 analytics 0298-0301","Multi-gateway rewrite normalisation","OAuth consent grants in IdP logs","Detection budget choices"]},{"theme":"Attribution & campaigns","items":["MirrorFace (G1054) — OneDrive link TTP","Storm-1811 (G1046) — EvilProxy AITM at MSP scale","APT-C-36 URL-shortener pattern","Confidence language for boards"]}],"how":["<b>Pass mark: 70%.</b> Percentages are computed only over exercises you answered; skipped-and-unanswered exercises leave both the numerator and the denominator.","<b>Exercise types in this file:</b> long multi-artefact scenarios with single choice, branching crisis chains, one read-only terminal decision, multi-select evidence packs, ranking under pressure, triage with planted noise, brief drafting, and matching at scale.","<b>Timer: 100 minutes.</b> Manual Pause hides the exercise for a genuine break. <b>Check</b> auto-pauses the timer (PAUSED — reviewing feedback) until <b>Next</b> — the explanations here are part of the training; read them fully.","<b>Partial credit:</b> multi-item exercises score max(0, (correct &#8722; wrong) / items). Several options per exercise are defensible somewhere — your job is to find the one defensible here. One hint per exercise costs 10% of that exercise&#8217;s credit and restates a constraint only.","<b>Skip and review:</b> skipped exercises wait in the review pool while the timer runs; at submit, unanswered skips are excluded.","Press <b>Start</b>. Trust the artefacts, price the risk, and decide like it is your name on the ticket."]};
window.EXAMS=[{"id":"X01","type":"qcm","title":"Ten minutes for the CISO","summary":"EDR says clean, the proxy says otherwise — pick the decision","scenario":[{"label":"What is confirmed","kind":"note","text":"08:58 mail delivered to the CFO with a link to sso-portal-secure[.]example-id-4091[.]com (registered 5 days ago). 09:06 proxy: GET then POST to /login, status 200, bytes consistent with a form submission. 09:19 IdP: successful sign-in for the CFO from a residential ASN, new device fingerprint."},{"label":"What is contradictory","kind":"note","text":"EDR on the CFO laptop: no file written, no process spawned, verdict clean. The mail gateway's own URL rewrite service reports the message as rewritten and its detonation 'no threat found' (the page was built to serve humans, not the sandbox parser)."},{"label":"The demand","kind":"note","text":"The CISO joins in ten minutes and wants one decision, with the reasoning, and the cost stated. Finance systems sessions are involved. It is 09:25."}],"question":"Which decision do you present?","hint":"One sensor watches the page; one sensor watches the endpoint. Which one actually saw the credential leave?","expl":"The proxy POST is direct evidence the credential was submitted, and the residential-ASN sign-in is direct evidence it was used — page-level and identity-level truth. The EDR's 'clean' only means nothing landed on disk, which is exactly what a pure credential phish looks like; the gateway detonation missed a human-targeted page. So: treat credentials as compromised — revoke sessions, reset, re-enrol MFA, hunt downstream sign-ins — and say the cost plainly: the CFO loses an hour of access. 'Wait for EDR' waits on a sensor that has nothing to say about this technique, and reimaging burns a day for no identity-plane gain.","study":"Sensor hierarchy for this technique: identity and proxy evidence outrank endpoint cleanliness, because a credential phish never touches the endpoint.","opts":["Treat the CFO's credentials as compromised: revoke sessions, reset and re-enrol MFA now, and hunt IdP sign-ins for the whole finance group","Hold action until EDR raises a detection, since the endpoint is the source of truth","Reimage the CFO laptop immediately before touching the identity plane","Only block the domain and send an awareness mail — no identity action without malware"],"correct":0},{"id":"X02","type":"branch","title":"The rewrite that never happened","summary":"Branching crisis: gateway certainty vs a bypassed path","scenario":["The mail gateway's Safe Links-style service rewrites every corporate-tenant URL and detonates it. That is the control the board was promised. This morning, a user's managed laptop shows a direct proxy hit to payload-host[.]example-id-5512[.]net serving an 'Adobe update' MSI — no rewrite record exists for that click. The user reads personal webmail in a browser tab; the corporate tenant never saw this message. Gateway dashboards show 'all links rewritten, zero threats'. Two dashboards now disagree, and the CISO quotes the second one at you."],"question":"Four decisions, in order. The branch matters: your earlier choices shape what remains.","hint":"The bypass lives in the path the gateway never saw. Confidence language is a deliverable — state bounds, not vibes.","expl":"The proxy record wins because it covers the path that actually existed: personal webmail bypasses the corporate gateway entirely, so 'all links rewritten' is True only of the corporate tenant. Containment keeps the host online while identity access is cut — payroll runs today and no payload executed. With the MSI blocked by EDR, scoping who else reached the host beats purging one mail. And when the campaign predates your 14-day proxy retention, the honest statement is a bounded one: 14 days of certainty, mail logs for the older window, zero and 'many' are both unproven.","steps":[{"scn":["STEP 1 — The gateway lead insists the detonation service is authoritative. Choose the reading that wins, and say why in one line."],"opts":[{"t":"The proxy record wins: the click came from personal webmail, a path the gateway never saw — 'all links rewritten' is True only of the corporate tenant","ok":true,"note":"Coverage, not authority, decides: a control cannot see a path it is not on."},{"t":"The gateway detonation wins: it is the paid control and its dashboard says zero threats","ok":false,"note":"A control cannot validate the traffic it never observed; the dashboard is True and irrelevant."},{"t":"Treat both as right and escalate to the vendor for arbitration","ok":false,"note":"The vendor sells one of the two controls; arbitration wastes the golden hour."}]},{"scn":["STEP 2 — The user is mid-shift; payroll processing uses their host this afternoon. No payload executed (EDR blocked the MSI). Choose containment."],"opts":[{"t":"Revoke the user's sessions, force re-auth, and keep the host online with elevated logging","ok":true,"note":"Removes the identity risk at near-zero business cost; the endpoint shows no compromise to remove."},{"t":"Isolate the host now and move payroll to a shared machine","ok":false,"note":"Payroll on a shared machine is a fresh risk; isolation buys nothing the revocation does not."},{"t":"Disable the account until tomorrow","ok":false,"note":"The user has payroll duties today; the session revocation already closed the attacker's door."}]},{"scn":["STEP 3 — EDR blocked the MSI at download. The mail search finds this message only in the personal account (not visible to compliance). Choose the scoping move."],"opts":[{"t":"Search proxy history for every visitor to payload-host[.]example-id-5512[.]net over its lifetime","ok":true,"note":"The host, not the mail, is the shared artefact — scoping by infrastructure beats scoping by one mailbox."},{"t":"Purge the message from the corporate tenant","ok":false,"note":"The message is not in the corporate tenant; the action is a no-op dressed as progress."},{"t":"Close the case as blocked-by-EDR","ok":false,"note":"The delivery path remains open for everyone else; 'blocked once' is not 'scoped'."}]},{"scn":["STEP 4 — The CISO asks: 'are we sure nobody else was phished?' Proxy retention is 14 days; the campaign mail is older; mail-gateway logs go back a year. Choose the answer you will stand behind."],"opts":[{"t":"State the bound: 14 days of proxy coverage shows no other visitor; task the mail-gateway logs for the older window before saying more","ok":true,"note":"Bounded confidence plus a collection task is what survives an audit; the CISO can quote it verbatim."},{"t":"Confirm zero: EDR blocked the payload, so no one else was phished","ok":false,"note":"EDR on one host says nothing about other users, and 'phished' includes credential pages that never deliver payloads."},{"t":"Assume many: campaigns always succeed somewhere","ok":false,"note":"Panic ranges move budgets for the wrong reasons; you have data — bound it and collect more."}]}]},{"id":"X03","type":"term","title":"Evidence that survives scrutiny","summary":"One read-only pipeline — the finance exec's proxy window","scenario":[{"label":"The situation","kind":"note","text":"Legal has asked for the exec's proxy activity around the phish, in a form that survives scrutiny: original lines preserved, reproducible, no system state changed. The attacker may still hold a session; the temptation in the room is to 'clean up' first."},{"label":"The materials","kind":"note","text":"proxy.log sits in your home directory. The exec's source IP is 10[.]0[.]19[.]7. The campaign domain is bonus-portal[.]example-id-8817[.]com. GNU tools available: grep, awk, sed, sort, uniq, cut."},{"label":"Legal's constraint","kind":"note","text":"'We need the raw matching lines, deduplicated by unique URL, with a count per URL — and we need to be able to say under oath that the extraction itself read the log but never wrote to it.'"}],"question":"Produce the extraction: one pipeline that prints the exec's lines for the campaign domain, sorted with a count per unique URL.","hint":"Two greps, then the sort-and-count pair. Anything that writes, moves or deletes is the wrong tool today.","expl":"grep for the IP keeps the exec's lines; the second grep keeps the campaign domain; sort groups identical URLs so uniq -c counts them. Every stage reads — nothing writes, renames or removes — which is what makes the output oath-safe: the log on disk is untouched and the command itself is reproducible on demand. A wipe or an isolation-first reflex would destroy exactly the artefact legal asked for; 'cleaning up before exporting' is the classic evidence-destroying near miss.","study":"Read-only extraction first, state changes later — and only after the export is hashed and stored.","termTitle":"soc-workstation — evidence shell (simulation only)","prompt":"analyst@soc:~$","sim":{"tool":"grep","banner":"Simulation shell. Output is what legal would receive; nothing on disk changes.","notFound":"command not found — this shell offers: grep, awk, sed, sort, uniq, cut","out":["   1 2026-10-27T09:06:12Z src_ip=10[.]0[.]19[.]7 GET hxxps://bonus-portal[.]example-id-8817[.]com/login status=200","   3 2026-10-27T09:06:40Z src_ip=10[.]0[.]19[.]7 POST hxxps://bonus-portal[.]example-id-8817[.]com/login status=200"]},"elems":[{"label":"first stage: grep filtered on the exec's source IP","all":["grep","10[.]0[.]19[.]7"]},{"label":"second stage: grep filtered on the campaign domain","all":["grep","bonus-portal[.]example-id-8817[.]com"]},{"label":"sort stage to group identical lines","all":["sort"]},{"label":"uniq -c stage for the count per unique URL","all":["uniq","-c"]}],"noise":["|","proxy.log"],"danger":[{"pat":"rm |shred|>|mv |chmod|chown|isolat|shutdown|reboot","why":"The log is the evidence. Any state change before the export destroys the chain of custody."}],"canonical":"grep \"10[.]0[.]19[.]7\" proxy.log | grep \"bonus-portal[.]example-id-8817[.]com\" | sort | uniq -c","parts":[{"t":"grep \"10[.]0[.]19[.]7\" proxy.log","d":"keep the exec's proxy lines — read-only on the log"},{"t":"grep \"bonus-portal[.]example-id-8817[.]com\"","d":"keep only the campaign-domain activity"},{"t":"sort","d":"group identical lines for counting"},{"t":"uniq -c","d":"one line per unique URL with its occurrence count — the reproducible artefact legal receives"}]},{"id":"X04","type":"qcm","title":"The discipline of waiting","summary":"One click, no POST, sandbox pending — the senior call","scenario":[{"label":"The case","kind":"note","text":"A contractor clicked a link in a shipping-notice phish. The tab closed within seconds: proxy shows GET to the landing page only — no POST, no download. EDR: clean, no spawn from the browser. Sandbox detonation of the URL is queued and runs in 40 minutes. The contractor's laptop returns to the device pool on Friday."},{"label":"The pressure","kind":"note","text":"The account owner wants the contractor blocked and the laptop wiped today. The fleet team notes a wipe costs a half-day and the contractor ships code until Friday. The CISO's deputy asks what you would stake your signature on."},{"label":"The missing piece","kind":"note","text":"The landing page is unknown: it may be a credential page the user simply closed, a drive-by kit, or a benign misfire of the campaign filter. Nobody has yet looked at what the page served — the detonation will tell."}],"question":"What is the decision that a senior analyst signs?","hint":"Nothing was submitted, nothing executed, and the one artefact that would settle it is 40 minutes away.","expl":"No credential left, no payload landed, and the detonation — the cheapest possible artefact — is imminent. Keeping the case open, watchlisting the domain, and deciding on the detonation is evidence-first discipline: every aggressive option on the table (wipe, block, formal breach talk) prices real cost and can be justified in 40 minutes instead. Signing 'wipe now' spends half a day and the contractor's trust to learn what the sandbox will tell you for free. 'Do nothing yet' is a decision — write it down with its review time.","study":"Senior triage prices the cost of acting against the cost of the next cheapest artefact; act when the artefact cannot settle it.","opts":["Keep the case open, watchlist the domain, and decide when the detonation lands in 40 minutes","Wipe the laptop now — a click on an unknown page is grounds enough","Block the contractor from all systems until the vendor confirms the page is safe","Open a formal breach notification case to be safe"],"correct":0},{"id":"X05","type":"qcm","title":"The best practice that breaks here","summary":"Block all shorteners? Price it in this world first","scenario":[{"label":"The recommendation on the table","kind":"note","text":"An industry best-practice paper (and a big-four slide) says: block all URL-shortener domains org-wide to kill redirect-based phishing. Several peers have done it."},{"label":"This organisation's reality","kind":"note","text":"The sales org runs paid campaigns through two shortener platforms; support links in invoices use a third. Blocking them breaks the outbound campaign pipeline and invoice support links — revenue-facing systems, not convenience. Meanwhile the actual campaign pattern this quarter (per the CTI note, mirroring the APT-C-36 pattern of shortener-relayed urgent notices) used three shortener domains, each once, never reused."},{"label":"The constraint","kind":"note","text":"Proxy capacity allows one new inspection policy this quarter: either blanket category blocks, or detonate-and-log for shorteners with targeted blocks on confirmed campaign domains."}],"question":"In THIS organisation, which decision is correct?","hint":"The attacker used each shortener once. The business uses them every day. Whose pattern does a static block actually fit?","expl":"A static block fits repeat visitors, and the attacker's whole trick here is single-use shorteners — block three domains, they mint a fourth, while sales loses its pipeline every day in between. Detonating shortener traffic and blocking confirmed campaign domains targets the behaviour (redirect-to-credential) instead of the tool category, keeps revenue systems whole, and generates the telemetry that makes the next block precise. 'Peers did it' is not a control justification; the organisation's own traffic pattern is.","study":"Best practices are priors, not decisions — run them against your traffic and your adversary's pattern before signing.","opts":["Detonate-and-log shortener traffic and block confirmed campaign domains — target the behaviour, not the category","Block all shortener domains org-wide, as the best-practice paper and peers recommend","Allow all shorteners but add them to awareness training slides","Block shorteners for everyone except the sales team's whole department"],"correct":0},{"id":"X06","type":"qcm","title":"Attribution on two of five","summary":"Partial infra overlap — name the confidence you can defend","scenario":[{"label":"The campaign","kind":"note","text":"European energy-sector supplier. Emails carry links to OneDrive-hosted archives; the OneDrive accounts were registered days before each send; credential pages mimic the supplier's procurement portal."},{"label":"The overlap analysis","kind":"note","text":"TTP match: OneDrive-link delivery matches ATT&CK's MirrorFace (G1054) note — embedded OneDrive URLs leading to malicious file installation — and MirrorFace's documented targeting is Japan-focused (Earth Kasha reporting). Sector fit: none. Registrant privacy-protected; one staging domain shares a name-server pair with an unrelated campaign; no code overlap yet. Score: 2 of 5 indicator classes match."},{"label":"The demand","kind":"note","text":"The board pack needs one line: actor, confidence, next step. The CTI lead warns against 'naming for the sake of naming'."}],"question":"Which line goes into the board pack?","hint":"Two indicator classes match, and the actor's documented target region contradicts yours. What can that line honestly carry?","expl":"Two of five indicator classes — one behavioural, one weak infrastructural — against a targeting contradiction is a low-confidence TTP-level attribution: the behaviour resembles MirrorFace's documented OneDrive-link delivery, and nothing more can be claimed yet. High-confidence claims would import Japan-targeting assertions into a European energy case, and excluding MirrorFace entirely would ignore the strongest TTP signal you have. The defensible line pairs the confidence with the collection task that could raise it: registrant patterns, staging reuse, code overlap. Boards fund collection, not hunches.","study":"Confidence language: low = behaviour matches, high = behaviour plus infrastructure plus targeting all agree — say which you have.","opts":["Low confidence TTP match to MirrorFace's OneDrive-link delivery; task registrant/staging/code collection before any stronger claim","MirrorFace with high confidence — the OneDrive-link TTP is distinctive enough","No attribution possible — do not name any actor at any confidence","A Japan-based actor with high confidence, since MirrorFace targets Japan"],"correct":0},{"id":"X07","type":"branch","title":"MSP night: the AITM cascade","summary":"Branching crisis: one phishing host, two tenants, admin tokens","scenario":["You are the security lead of an MSP. 22:40: tenant A's helpdesk reports a wave of MFA-push-bombing calls followed by 're-authentication' emails; the links resolve through a reverse-proxy phishing host (EvilProxy-style) that relays real MFA prompts. Tenant A's IT-admin account shows a session that is password-correct and MFA-approved — approved by the attacker relaying it. The same host appears in one tenant B mailbox. Contracts require cross-tenant notification 'without undue delay' for confirmed compromise. This chain is the Storm-1811 pattern at MSP scale."],"question":"Four decisions, in order. Each shapes the next.","hint":"Password resets do not evict stolen sessions — token revocation does. And the phishing host, not the mailbox, is the shared artefact.","expl":"AITM means the password and MFA were both relayed, so the only containment that works at the identity plane is session/token revocation plus phishing-resistant re-enrolment — password resets alone leave the attacker's session alive. The registered device is persistence: remove it and audit what an authenticated admin could touch (consent grants, inbox rules, federated trust). Tenant B shares the phishing host, so notification is contractual and immediate — silence trades someone else's breach for your reputation. Each step follows from what an AITM attacker actually holds at that moment.","steps":[{"scn":["STEP 1 — 22:44. Tenant A's admin account is session-compromised via the relayed login. Choose the first containment."],"opts":[{"t":"Revoke all sessions and refresh tokens for the admin, then require phishing-resistant MFA re-enrolment","ok":true,"note":"Token revocation evicts the live attacker; re-enrolment cuts the relayed-MFA path they used."},{"t":"Reset the admin's password and send them home","ok":false,"note":"The attacker's session survives a password reset — revocation is the eviction, not the password."},{"t":"Wait for the MFA pushes to stop on their own","ok":false,"note":"The pushes stop when the attacker stops — and the session is theirs until revoked."}]},{"scn":["STEP 2 — 23:10. IdP audit shows a new device registered for the admin account and two OAuth consent grants from the phishing chain. Choose the cleanup."],"opts":[{"t":"Remove the rogue device, revoke the consent grants, and audit inbox rules and delegation on the admin mailbox","ok":true,"note":"Device = persistence, consents = tokens (T1528), rules = re-entry — the full AITM aftermath in one sweep."},{"t":"Remove the device only; consents can wait for business hours","ok":false,"note":"Consent-granted tokens keep working from anywhere, all night, with MFA satisfied."},{"t":"Rebuild the whole tenant from scratch","ok":false,"note":"Costly, slow, and it destroys the very audit trail the next four hours depend on."}]},{"scn":["STEP 3 — 23:35. The same phishing host is confirmed in one tenant B mailbox (unopened). Contracts say 'notify without undue delay on confirmed compromise of shared infrastructure'. Choose the disclosure move."],"opts":[{"t":"Notify tenant B's security contact now with the IOC set and the containment status, per contract","ok":true,"note":"Shared-infrastructure compromise triggers the clause; early notice lets tenant B act on their own telemetry."},{"t":"Say nothing until tenant B shows signs of compromise","ok":false,"note":"The contract's trigger is confirmed shared infrastructure, not observed impact in tenant B."},{"t":"Post a general advisory on the customer portal","ok":false,"note":"A passive advisory does not meet a 'notify the tenant' clause, and most customers never read the portal."}]},{"scn":["STEP 4 — 00:20. The phishing host still resolves and serves fresh tenants. Choose the disruption move that fits your authority."],"opts":[{"t":"Push the host and its fast-flux pattern to the blocklists you control, and file abuse/registrar reports with the captured evidence","ok":true,"note":"Blocks every tenant you serve and starts the takedown clock with evidence attached — the scale-appropriate move."},{"t":"Attempt to hack back and wipe the phishing host","ok":false,"note":"Unauthorised access is a legal cliff no SOC lead walks off, however satisfying."},{"t":"Do nothing outside the two tenants — it is someone else's problem","ok":false,"note":"Every hour the host serves, another tenant walks into the same MFA relay; blocking is cheap and yours to do."}]}]},{"id":"X08","type":"multi","title":"The evidence pack legal will accept","summary":"Three of six — preserve without touching","scenario":[{"label":"Legal's instruction","kind":"note","text":"Counsel needs an evidence pack for a potential claim against the phishing-kit operator: the pack must let an expert re-derive every conclusion, and nothing in the production environment may be altered by the collection itself."},{"label":"The candidate actions","kind":"note","text":"1) Export proxy logs for the window in original format with hashes. 2) Preserve the original .eml with full headers into the evidence vault. 3) Write the UTC timeline citing a source artefact for every event. 4) Log into the CFO's mailbox interactively to screenshot the phish. 5) Reset the CFO's router so 'nothing else happens tonight'. 6) Email the domain registrant to warn them off."},{"label":"The stakes","kind":"note","text":"Counsel's words: 'If we cannot say who touched what and when, the pack is worth the paper it is printed on.'"}],"question":"Select the three actions that belong in the evidence pack workflow.","hint":"Reproducible, sourced, and non-mutating — three properties, three actions.","expl":"Original-format exports with hashes, the preserved .eml with headers, and a source-cited UTC timeline are the triad that lets an expert re-derive conclusions — and none of them changes production state. Interactive mailbox access mangles read-state and metadata on a live system and cannot be sworn to; router resets and registrant emails are actions in the world, not evidence, and the registrant note tips off the adversary. Evidence work is boring on purpose: export, preserve, annotate.","study":"Chain-of-custody test: can you name the artefact, its hash, its source, and the UTC time it entered the vault?","opts":["Export the proxy logs for the window in original format, with hashes recorded","Preserve the original .eml with full headers into the evidence vault","Write the UTC timeline citing a source artefact for every event","Log into the CFO's mailbox interactively and screenshot the phishing mail","Reset the CFO's home router to stop any further activity tonight","Email the domain registrant a warning"],"correct":[0,1,2],"why":{"3":"Interactive access alters mailbox state and cannot be reproduced or sworn to — collection must be non-mutating.","4":"A router reset is a live-system change with no evidentiary value and breaks continuity of observation.","5":"Tipping the adversary destroys attribution options and any future quiet collection."}},{"id":"X09","type":"rank","title":"Four fires, one hour","summary":"Rank the concurrent reports by decision urgency","scenario":[{"label":"Fire A","kind":"note","text":"Finance exec: POST to a lookalike portal captured credentials; an MFA push was approved; a follow-on IdP sign-in from a residential ASN just occurred. Payroll runs in three hours on this user's host."},{"label":"Fire B","kind":"note","text":"IT admin: a phishing link led to a consent page for 'Mail Cleanup Pro'; the user reached the consent screen but there is no grant record yet. The consent URL is still live in three other mailboxes."},{"label":"Fire C & D","kind":"note","text":"C: marketing campaign links reported by 40 users; domain already blocked; zero clicks, zero submissions. D: contractor clicked, closed the tab in seconds; no POST, no download; sandbox detonation queued in 40 minutes; contractor's laptop returns to the pool Friday."}],"question":"Rank the four fires from most decision-urgent (rank 1) to least (rank 4).","hint":"Rank by what the attacker holds right now and what expires first — not by report volume.","expl":"A is first: the attacker holds a working session and payroll gives a three-hour deadline — containment decisions expire fastest there. B is second: a live consent URL is one click away from handing out app tokens (T1528), and purging three mailboxes closes it cheaply. D is third: nothing was submitted and the detonation will decide it — the wait is the decision. C is last: blocked, unclicked, contained; documentation remains but no decision does. Urgency is the rate at which your options disappear, not the noise of the report.","study":"Rate-of-option-loss ranking: which decision expires soonest, and which has the cheapest deferral?","items":["A — finance exec: session held, MFA approved, payroll deadline","B — IT admin: live consent URL, no grant yet","D — contractor: click, no POST, detonation pending","C — marketing campaign: blocked domain, zero clicks"]},{"id":"X10","type":"multi","title":"Spend the detection budget","summary":"Two analytics, biggest gap closure","scenario":[{"label":"Current coverage","kind":"note","text":"Covered: attachment sandbox verdicts; AV on endpoints; generic proxy category blocks. Gaps for the link variant per DET0107: no mail-click-to-proxy correlation exists, and IdP logs are unwatched for consent grants and device-code flows."},{"label":"The budget note","kind":"note","text":"Engineering capacity exists for exactly two analytics this quarter. Candidates: (a) mail-gateway click event joined with the following proxy connection, per analytic 0298/0299; (b) IdP rule for OAuth consent grants and device-code approvals following phishing URLs, per analytic 0301; (c) alert on every external email; (d) alert when any user opens a marketing email; (e) nightly AV sweep of the mail store."}],"question":"Select the two analytics that close the biggest T1566.002 gaps.","hint":"One covers the click chain, one covers the token-and-device fall-out — the two stages with nothing on them today.","expl":"The mail+proxy join is the spine of the link-variant chain (0298/0299) and its absence is why clicks are found by hand today. The IdP rule catches the modern fall-out: consent-granted tokens and device-code approvals (0301) — the paths that bypass the endpoint entirely. Alerting on every external mail drowns the team in noise by lunch; marketing-email alerts train analysts to auto-dismiss; mail-store AV sweeps belong to the attachment variant. Budget maths is gap maths: fund the stages with no sensor today.","study":"DET0107's four analytics map the full chain — fund coverage where the chain is currently dark.","opts":["Correlate mail-gateway click events with the following proxy connections (analytics 0298/0299)","Alert on OAuth consent grants and device-code approvals that follow phishing URLs (analytic 0301)","Alert on every external email arriving in the tenant","Alert whenever a user opens a marketing email","Run a nightly AV sweep of the mail store"],"correct":[0,1],"why":{"2":"External mail is most of the mail; the alert volume would bury the real chain within days.","3":"Marketing opens are behaviourally identical to normal reading — pure noise for this technique.","4":"Mail-store sweeps serve the attachment variant; the link variant never puts a payload in the mailbox."}},{"id":"X11","type":"triage","title":"The 06:00 pile","summary":"Six alerts with planted duplicates, noise — and three real chains","scenario":["Monday 06:00. Overnight queue: six alerts. Two are duplicates, one is building noise, one is a marketing tracker — and three belong to real T1566.002-adjacent chains: a credential POST, an OAuth consent page, and a device-code entry. Actions available: escalate to IR; close as benign/duplicate; route to a different technique."],"question":"Choose the correct action for every alert.","hint":"Pair the duplicates first, then send the three chains up. The building and the tracker are not email-link work.","expl":"AL-7701 is a complete credential chain: deliver, click, POST to the lookalike — escalate. AL-7702 shares its proxy session ID: duplicate. AL-7703 is consent phishing in progress — the user reached the OAuth approval page, which is token theft one click away (T1528 fall-out of this sub-technique) — escalate. AL-7704 is device-code phishing: a code from an email entered on the device-login page yields an attacker-approvable token — escalate. AL-7705 is the badge system — physical telemetry, not an email-link behaviour. AL-7706 is the newsletter tracker that fires nightly — benign by pattern and by final destination.","study":"Real chains hide in familiar shapes: consent and device-code pages are this sub-technique's modern fall-out, not noise.","actions":[{"t":"Escalate to IR"},{"t":"Close — benign or duplicate"},{"t":"Route out — different technique/telemetry, not email-link phishing"}],"alerts":[{"t":"AL-7701 — Credential chain","meta":"deliver 05:31 -> GET+POST hxxps://invoice-sso[.]example-id-6620[.]com/login 05:47-05:48 user=g.ferrari","ok":0,"why":"The full delivery-click-submission chain — the core T1566.002 case."},{"t":"AL-7702 — Proxy alert, session 55120","meta":"POST hxxps://invoice-sso[.]example-id-6620[.]com/login session_id=55120 (same session as AL-7701)","ok":1,"why":"Same session as the escalated chain — a duplicate view of one incident."},{"t":"AL-7703 — Consent page reached","meta":"user=c.muller reached OAuth consent page for 'Mail Cleanup Pro' from mail link hxxps://app-consent[.]example-id-8834[.]net/grant — no grant yet","ok":0,"why":"Consent phishing fall-out (T1528): one click from an app token; IR must kill the URL and warn the user."},{"t":"AL-7704 — Device code entered","meta":"user=p.horan entered a device code shown in an email on the device-login page; IdP logged an approval prompt","ok":0,"why":"Device-code phishing — the documented email-to-token chain that needs an IdP-side response."},{"t":"AL-7705 — Badge system alert","meta":"door sensor west-lobby forced-open event 04:58","ok":2,"why":"Physical access telemetry — unrelated to email-link phishing and to this playbook."},{"t":"AL-7706 — Tracker click again","meta":"t[.]dripemail[.]example-id-2[.]com/c/9815/track user=m.weber 03:44 -> retailer order page","ok":1,"why":"The nightly newsletter tracker; final destination benign, pattern matches 900+ users."}]},{"id":"X12","type":"fill","title":"The brief the board reads","summary":"Four blanks — ID, name, tactic, detection strategy","scenario":[{"label":"Draft brief (sanitize before send)","kind":"note","text":"Last week's campaign delivered OneDrive-hosted archives by email link, captured procurement credentials, and used per-recipient tracking links. The board pack must name the ATT&CK objects precisely: the behaviour, its canonical name, the tactic it lives in, and the ATT&CK detection strategy that covers it."},{"label":"House style","kind":"note","text":"IDs exactly as ATT&CK writes them; names capitalised as in the catalogue; tactics by name; detection strategies by DET number. Managers navigate Navigator from these four tokens — a wrong token sends the budget to the wrong control."}],"question":"Complete the brief with the four tokens.","hint":"The behaviour is the link variant of phishing; its tactic is the get-in tactic; the detection strategy for it is DET0107.","expl":"The behaviour is T1566.002, named Spearphishing Link; it sits in Initial Access — the attacker's entry step; and ATT&CK's detection strategy covering it is DET0107 with its four analytics. T1566.001 would misdirect the budget to attachment controls. Lateral Movement is a post-foothold tactic, and T1059 is an execution technique. Any of those in a board pack sends money and attention to the wrong layer of the chain.","study":"Four-token discipline in briefs: ID, name, tactic, DET — they are the board's links into the framework.","template":"The campaign's delivery behaviour was {0} ({1}) in the {2} tactic; the matching ATT&CK detection strategy is {3}.","bank":["T1566.002","Spearphishing Link","T1566.001","Initial Access","Lateral Movement","DET0107","DET0999","T1059"],"correct":[0,1,3,5]},{"id":"X13","type":"qcm","title":"Payroll day isolation","summary":"The costly option is on the table — accept or refuse the cost?","scenario":[{"label":"The situation","kind":"note","text":"One of thirty finance hosts has a confirmed credential-phish click (proxy POST). No payload on any host. The finance estate runs the monthly payroll batch starting in 90 minutes; isolation of any finance host pauses the batch, and pausing mid-run risks a corrupted pay cycle affecting 4,100 employees."},{"label":"The options on the bridge","kind":"note","text":"Option 1: isolate all 30 finance hosts until the batch completes. Option 2: revoke the affected user's sessions, block the credential domain fleet-wide, raise logging on the estate, and hold isolation in reserve with a 15-minute trigger. Option 3: let the batch run and revisit tomorrow."},{"label":"The constraint","kind":"note","text":"The CISO asks explicitly: which cost are we choosing to accept, and which are we deferring? The answer must name the risk left open."}],"question":"Which option do you recommend, with its accepted risk?","hint":"The compromise lives in the identity plane. What does isolating disks actually remove from it?","expl":"The stolen asset is a session, not a disk image: revoking it, blocking the road fleet-wide, and raising logging addresses the actual risk at near-zero business cost, with isolation held as a 15-minute reserve if the IdP or proxy shows follow-on activity. Mass isolation accepts a corrupted pay cycle for 4,100 employees to remove a risk it cannot touch — the session rides again the moment the host returns. Waiting until tomorrow defers the one cheap containment that should happen now. Name the accepted risk in the recommendation; that is what makes it a decision rather than a hope.","study":"Cost-bearing calls: state what you accept (residual identity risk under watch) and what you defer (downtime) — and set the trigger that un-defers it.","opts":["Option 2 — revoke sessions, block fleet-wide, raise logging, isolation in reserve on a 15-minute trigger; accepted risk: residual identity activity under elevated watch","Option 1 — isolate all 30 finance hosts now; accepted risk: a corrupted pay cycle for 4,100 employees","Option 3 — revisit tomorrow; accepted risk: an attacker-held session for a full business day","Option 1 for the affected host only, plus rebuild the other 29 to be certain"],"correct":0},{"id":"X14","type":"match","title":"Normalise two gateways, keep one truth","summary":"Three rewrite formats — three correct handling rules","scenario":[{"label":"Gateway A format","kind":"code","text":"clicks arrive as:\n hxxps://protect-outbound[.]gw-a[.]example-id-5[.]net/u/?q=<base64 destination>"},{"label":"Gateway B format","kind":"code","text":"clicks arrive as:\n hxxps://safelinks[.]gw-b[.]example-id-6[.]net/?url=<percent-encoded destination, double-encoded>"},{"label":"Gateway C reality","kind":"note","text":"Gateway C rewrites corporate-tenant mail, but users reading personal webmail bypass it entirely — the proxy sees the direct destination, and no rewrite exists to undo."}],"question":"Match each gateway to the correct normalisation rule for a unified detection.","hint":"Decode the parameter you are given; where there is no wrapper, there is nothing to undo.","expl":"Gateway A hides the destination in a base64 parameter, so the rule decodes q= and judges the decoded value. Gateway B percent-encodes twice, so the rule takes url= and decodes twice — once yields the wrapper's encoding of the encoding. Gateway C needs no unwrapping: personal-webmail clicks appear in the proxy with the direct destination, and the unified rule must accept those records as already-normalised. One detection, three normalisation paths — that is what a rewrite-aware deployment of DET0107 looks like in a real estate.","study":"Inventory every rewrite format in the estate and write one decode rule per format — then test the rule on a bypassed path.","left":["Gateway A — q= parameter, base64","Gateway B — url= parameter, double percent-encoded","Gateway C — personal webmail, no rewrite"],"right":["Decode the q= parameter once, then judge the destination","Take the url= parameter and URL-decode it twice","Treat the direct proxy destination as already normalised — no decode step"],"correct":[0,1,2]},{"id":"X15","type":"order","title":"The brief with a hole in it","summary":"Order the defensible conclusions around a retention gap","scenario":[{"label":"The timeline","kind":"note","text":"08:12 UTC mail delivered (gateway log, retained 1 year). 08:31 click (proxy). 08:33 POST to /login on the lookalike (proxy). 08:41 IdP sign-in, Bogotá ASN, user is in Berlin (IdP log). 08:50-09:20: a 14-day proxy retention note means the sub-page fetches between 08:33 and 08:41 were aged out — the window is incomplete."},{"label":"The demand","kind":"note","text":"The morning brief must present four statements in the order a reviewer can verify them, each tied to its artefact, with the evidence limit stated last so the caveats cannot be lost."},{"label":"The rule","kind":"note","text":"Conclusions follow the event order; exposure scoping follows the confirmed capture; the evidence limit is always the closing line."}],"question":"Order the four statements as the brief must present them.","hint":"Follow the events: capture, then the use of the capture, then the window it opened, then the honest limit.","expl":"The 08:33 POST is the capture moment — the first defensible verdict, tied to the proxy artefact. The 08:41 Bogotá sign-in is the adversary using the capture: an impossible-travel contradiction the IdP log settles. The exposure window then scopes the mailbox sweep between delivery and capture — what the adversary could have read before you cut them off. The retention gap closes the brief as an explicit evidence limit: it bounds every claim above it instead of undermining them from the middle. Order is verifiability: each statement stands on the artefact before it.","study":"Senior briefs read like evidence chains: verdict, consequence, scope, limit — in that order, every time.","items":["Verdict: the 08:33 POST to /login is the credential-capture moment","Consequence: the 08:41 Bogotá sign-in is the adversary using the captured credential","Scope: sweep the mailbox for the 08:12-08:33 exposure window","Limit: the 08:33-08:41 proxy window has aged out — state the 14-day retention gap explicitly"]}];

<script>

'use strict';
/* ============ T1566.002 exam engine (self-contained, vanilla JS) ============ */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function letters(i){ return String.fromCharCode(65+i); }
function fmt1(x){ return (Math.round(x*10)/10).toFixed(1); }
function fmtClock(sec){ sec=Math.max(0,sec); var m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }

/* Mandatory scoring formula: exerciseCredit = max(0,(H-W)/N) */
function scoreExercise(H,W,N){ if(N<=0){ return 0; } return Math.max(0,(H-W)/N); }

var BUDGET = window.EXAM_BUDGET_MIN * 60;
var S = {
  order: [], cur: 0,
  credit: [], answered: [], skipped: [], hintUsed: [], done: [], picks: [],
  timerState: 'IDLE', prevState: null, remaining: BUDGET,
  manualSecs: 0, autoSecs: 0, _lastT: 0, _tick: null,
  reported: false, attempt: 1, mode: 'normal',
  user: { username:'', country:'', locale:'en' }
};

var EX = window.EXAMS;

/* ---------------- timer state machine ---------------- */
function setState(st){
  S.timerState = st; S._lastT = Date.now();
  renderHeader();
}
function tick(){
  var now = Date.now(); var dt = Math.round((now - S._lastT)/1000);
  if(dt<=0){ return; }
  S._lastT = now;
  if(S.timerState==='RUNNING'){
    S.remaining -= dt;
    if(S.remaining<=0){ S.remaining=0; setState('ENDED'); onTimeout(); }
  } else if(S.timerState==='PAUSED_AUTO_CHECK'){
    S.autoSecs += dt;
  } else if(S.timerState==='PAUSED_MANUAL'){
    S.manualSecs += dt;
  }
  renderTimer();
}
function startTimer(){ setState('RUNNING'); }
function timerLabel(){
  if(S.timerState==='RUNNING'){ return '<span class="tst-running">&#9654; RUNNING</span>'; }
  if(S.timerState==='PAUSED_MANUAL'){ return '<span class="tst-paused">&#9208; PAUSED &#8212; manual (press Resume)</span>'; }
  if(S.timerState==='PAUSED_AUTO_CHECK'){ return '<span class="tst-paused">&#9203; AUTO-PAUSED &#8212; reading feedback (resumes on Next)</span>'; }
  if(S.timerState==='ENDED'){ return '<span class="tst-ended">&#9632; ENDED</span>'; }
  return '';
}
function renderTimer(){
  var el=$('timer-txt'); if(el){ el.textContent = fmtClock(S.remaining); }
  var st=$('tstate-ind'); if(st){ st.innerHTML = timerLabel(); }
}

/* ---------------- header ---------------- */
function renderHeader(){
  var exN = S.order.length;
  $('h-counter').innerHTML = 'Exercise <b>'+(S.cur+1)+'</b> of <b>'+exN+'</b>';
  $('h-score').innerHTML = 'Score <b>'+fmt1(creditSum())+'</b> / '+answeredCount()+' ('+percentNow()+'%)';
  var u = $('h-user');
  if(S.user.username){ u.innerHTML = '&#128100; '+esc(S.user.username)+(S.user.country && S.user.country!=='ZZ' ? ' ('+esc(S.user.country)+')':''); }
  renderTimer();
  updateProgress();
}
function answeredCount(){ var n=0; for(var i=0;i<S.answered.length;i++){ if(S.answered[i]){ n++; } } return n; }
function creditSum(){ var s=0; for(var i=0;i<S.credit.length;i++){ if(S.answered[i]){ s+=S.credit[i]; } } return s; }
function percentNow(){ var n=answeredCount(); if(n===0){ return 0; } return Math.round((creditSum()/n)*100); }
function updateProgress(){
  var total = S.order.length;
  var done = 0;
  for(var i=0;i<S.done.length;i++){ if(S.done[i]){ done++; } }
  $('pbar').style.width = Math.round((done/total)*100)+'%';
}

/* ---------------- intro ---------------- */
function buildIntro(){
  var d = window.EXAM_INTRO;
  var h = '';
  h += '<div class="card intro-head">';
  h += '  <h1 class="intro-title">'+esc(d.title)+'</h1>';
  h += '  <p class="intro-sub">'+esc(d.subline)+'</p>';
  h += '  <div class="fact-row">';
  h += '    <div class="fact"><div class="f-l">ATT&amp;CK object</div><div class="f-v">'+esc(d.obj)+'</div></div>';
  h += '    <div class="fact"><div class="f-l">Severity</div><div class="f-v"><span class="badge badge-sev"><span class="dot"></span>'+esc(window.EXAM_SEV_WORD)+'</span></div></div>';
  h += '    <div class="fact"><div class="f-l">Exercises</div><div class="f-v">'+EX.length+'</div></div>';
  h += '    <div class="fact"><div class="f-l">Estimated time</div><div class="f-v">'+window.EXAM_EST_MIN+' min</div></div>';
  h += '    <div class="fact"><div class="f-l">Timer budget</div><div class="f-v">'+window.EXAM_BUDGET_MIN+' min</div></div>';
  h += '    <div class="fact"><div class="f-l">Pass mark</div><div class="f-v">70%</div></div>';
  h += '  </div></div>';
  h += '<div class="block scenario"><div class="block-h"><span class="bh-ico">&#128218;</span><span class="bh-txt">WHAT YOU WILL LEARN HERE</span></div><div class="block-b">';
  for(var i=0;i<d.learn.length;i++){ h += '<p class="learn-p">'+d.learn[i]+'</p>'; }
  h += '<div class="role-tags">';
  for(var j=0;j<d.roles.length;j++){ h += '<span class="role-tag">'+esc(d.roles[j])+'</span>'; }
  h += '</div></div></div>';
  h += '<div class="block question"><div class="block-h"><span class="bh-ico">&#127991;</span><span class="bh-txt">KEYWORDS COVERED IN THIS EXAM</span></div><div class="block-b">';
  for(var k=0;k<d.kw.length;k++){
    h += '<div class="kw-theme"><h4>'+esc(d.kw[k].theme)+'</h4><ul class="kw-list">';
    for(var m=0;m<d.kw[k].items.length;m++){ h += '<li>'+esc(d.kw[k].items[m])+'</li>'; }
    h += '</ul></div>';
  }
  h += '</div></div>';
  h += '<div class="block answer"><div class="block-h"><span class="bh-ico">&#9881;&#65039;</span><span class="bh-txt">HOW THIS EXAM WORKS</span></div><div class="block-b">';
  h += '<ul class="how-list">';
  for(var n2=0;n2<d.how.length;n2++){ h += '<li>'+d.how[n2]+'</li>'; }
  h += '</ul>';
  h += '<div class="nav-row" style="justify-content:center"><button id="btn-start" class="hbtn primary big">&#9654; Start</button></div>';
  h += '</div></div>';
  $('intro').innerHTML = h;
  $('btn-start').addEventListener('click', startExam);
}

/* ---------------- exam lifecycle ---------------- */
function startExam(){
  S.order = shuffle(EX.map(function(e,i){ return i; }));
  S.cur = 0;
  S.credit = EX.map(function(){ return 0; });
  S.answered = EX.map(function(){ return false; });
  S.done = EX.map(function(){ return false; });
  S.hintUsed = EX.map(function(){ return false; });
  S.picks = EX.map(function(){ return null; });
  S.skipped = [];
  S.remaining = BUDGET;
  S.manualSecs = 0; S.autoSecs = 0;
  S.reported = false; S.mode = 'normal';
  $('intro').hidden = true;
  $('results').hidden = true;
  $('review').hidden = true;
  $('exam').hidden = false;
  if(S._tick){ clearInterval(S._tick); }
  S._lastT = Date.now();
  S._tick = setInterval(tick, 1000);
  renderExercise();
  startTimer();
  $('exam').scrollIntoView();
}
function curEx(){ return EX[S.order[S.cur]]; }

function renderExercise(){
  var idx = S.order[S.cur];
  var e = EX[idx];
  if(!S.answered[idx]){ S.done[idx]=false; }
  var h = '<div class="card" style="padding:6px 18px 18px">';
  h += exerciseHTML(e, idx);
  h += '<div id="fbk" hidden></div>';
  h += '<div class="nav-row">';
  h += '  <button id="btn-check" class="hbtn primary">Check answer</button>';
  h += '  <button id="btn-next" class="hbtn" disabled>Next &#8594;</button>';
  h += '  <span class="nav-note" id="nav-note"></span>';
  h += '</div></div>';
  $('ex-area').innerHTML = h;
  $('h-sevbadge').innerHTML = '<span class="badge badge-sev"><span class="dot"></span>'+window.EXAM_SEV_WORD+'</span>';
  bindExercise(e, idx);
  $('btn-check').addEventListener('click', function(){ onCheck(); });
  $('btn-next').addEventListener('click', function(){ onNext(); });
  $('btn-hint').disabled = S.answered[idx] || S.hintUsed[idx];
  if(S.hintUsed[idx] && !S.answered[idx]){ showHintPanel(e); }
  $('btn-pause').disabled = false;
  $('btn-skip').disabled = S.answered[idx];
  renderHeader();
  var last = lastUnansweredPos();
  $('btn-check').textContent = (S.cur===S.order.length-1) ? 'Check answer' : 'Check answer';
  if(S.cur===S.order.length-1){ $('nav-note').textContent = 'This is the last exercise. After Check, use Final Submit.'; }
  updateNavForState();
  window.scrollTo(0,0);
}
function lastUnansweredPos(){
  for(var i=S.order.length-1;i>=0;i--){ var idx=S.order[i]; if(!S.answered[idx]){ return i; } }
  return S.order.length-1;
}
function isLast(){
  /* last exercise position reached AND all later ones are done/skipped */
  for(var i=S.cur+1;i<S.order.length;i++){ var idx=S.order[i]; if(!S.done[idx] && S.skipped.indexOf(idx)===-1){ return false; } }
  return true;
}
function updateNavForState(){
  var idx = S.order[S.cur];
  var checked = S.answered[idx];
  $('btn-check').disabled = checked;
  var nextBtn = $('btn-next');
  nextBtn.innerHTML = (S.mode==='review' && remainingSkipped()>1) ? 'Back to skipped list &#8594;' : (isLast() ? 'Final Submit &#8594;' : 'Next &#8594;');
  nextBtn.disabled = !checked;
}
function onCheck(){
  if(S.timerState==='RUNNING'){ setState('PAUSED_AUTO_CHECK'); }
  gradeCurrent();
}
function onNext(){
  var idx = S.order[S.cur];
  if(S.timerState==='PAUSED_AUTO_CHECK'){ startTimer(); }
  S.done[idx] = true;
  if(S.mode==='review'){
    if(remainingSkipped()>0){
      showReview();
      return;
    } else {
      S.mode='normal';
      finishFlow();
      return;
    }
  }
  if(isLast()){
    finishFlow();
    return;
  }
  var nxt = S.cur+1;
  while(nxt < S.order.length && S.skipped.indexOf(S.order[nxt])!==-1 && S.answered[S.order[nxt]]){ nxt++; }
  if(nxt >= S.order.length){ finishFlow(); return; }
  S.cur = nxt;
  renderExercise();
}
function onSkip(){
  var idx = S.order[S.cur];
  if(S.answered[idx]){ return; }
  if(S.skipped.indexOf(idx)===-1){ S.skipped.push(idx); }
  S.done[idx] = true;
  if(S.mode==='review'){ showReview(); return; }
  var nxt = S.cur+1;
  if(nxt >= S.order.length){
    finishFlow();
    return;
  }
  S.cur = nxt;
  renderExercise();
}
function remainingSkipped(){
  var n=0;
  for(var i=0;i<S.skipped.length;i++){ if(!S.answered[S.skipped[i]]){ n++; } }
  return n;
}
function finishFlow(){
  if(remainingSkipped()>0 && S.timerState!=='ENDED'){
    showReview();
  } else {
    showResults();
  }
}
function onTimeout(){
  if(S._tick){ clearInterval(S._tick); S._tick=null; }
  var open = remainingSkipped();
  if(open>0){ showReview(true); } else { showResults(); }
}
function onHint(){
  var idx = S.order[S.cur];
  if(S.answered[idx] || S.hintUsed[idx]){ return; }
  S.hintUsed[idx] = true;
  var e = EX[idx];
  showHintPanel(e);
  $('btn-hint').disabled = true;
}
function showHintPanel(e){
  var p = $('hint-panel');
  if(!p){
    p = document.createElement('div');
    p.id = 'hint-panel';
    var nav = $('ex-area').querySelector('.nav-row');
    nav.parentNode.insertBefore(p, nav);
  }
  p.innerHTML = '<div class="hp-h">&#128161; HINT (costs 10% of this exercise&#8217;s credit)</div>'+esc(e.hint);
}
function onPause(){
  if(S.timerState==='RUNNING' || S.timerState==='PAUSED_AUTO_CHECK'){
    S.prevState = S.timerState;
    setState('PAUSED_MANUAL');
    $('overlay').hidden = false;
    $('ex-area').style.visibility = 'hidden';
  }
}
function onResume(){
  $('overlay').hidden = true;
  $('ex-area').style.visibility = 'visible';
  setState(S.prevState || 'RUNNING');
  S.prevState = null;
}
function showReview(timeout){
  S.mode = 'review';
  $('exam').hidden = true;
  $('review').hidden = false;
  var list = S.skipped.filter(function(i){ return !S.answered[i]; });
  var h = '<div class="card" style="padding:18px 20px">';
  h += '<h2 style="margin-top:0">&#9888; Skipped exercises &#8212; review before you finish</h2>';
  h += '<p style="color:var(--text-secondary)">'+(timeout
    ? 'Time is over. You cannot answer these any more. They will be excluded from your score: they do not count as correct, wrong, or add to the total.'
    : 'You skipped these. You can go back and answer them now, as many times as you need, while the timer is still running. If you submit with skipped exercises, they are excluded from the score.')+'</p>';
  if(S.timerState!=='ENDED'){
    h += '<div style="margin:8px 0"><b style="color:var(--text-primary)">&#9201; Time left: '+fmtClock(S.remaining)+'</b></div>';
  }
  h += '<ul class="rv-list">';
  for(var i=0;i<list.length;i++){
    var idx=list[i]; var e=EX[idx];
    h += '<li class="rv-row"><span class="badge badge-skipped"><span class="dot"></span>&#9888; Skipped</span><span class="rv-t">'+esc(e.title)+'</span>';
    h += (S.timerState==='ENDED')
      ? '<button class="hbtn" disabled>Time is over</button>'
      : '<button class="hbtn" data-open="'+idx+'">&#8617; Open and answer</button>';
    h += '</li>';
  }
  h += '</ul>';
  h += '<div class="nav-row"><button id="rv-submit" class="hbtn primary big">'+(timeout?'Go to results':'Submit anyway')+'</button></div>';
  h += '</div>';
  $('review').innerHTML = h;
  var btns = $('review').querySelectorAll('[data-open]');
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener('click', function(ev){
      var idx = parseInt(ev.currentTarget.getAttribute('data-open'),10);
      S.cur = S.order.indexOf(idx);
      S.mode = 'review';
      $('review').hidden = true;
      $('exam').hidden = false;
      renderExercise();
    });
  }
  $('rv-submit').addEventListener('click', function(){
    if(S.timerState==='ENDED'){ showResults(); }
    else if(remainingSkipped()>0){ showResults(); }
    else { S.mode='normal'; finishFlow(); }
  });
  window.scrollTo(0,0);
}


/* ---------------- shared render helpers ---------------- */
var HL_RE = /(\d{4}-\d{2}-\d{2}[T ][\d:.]+(?:Z|[+-]\d{2}:?\d{2})?)|((?:\d{1,3}\[\.\]){3}\d{1,3})|((?:hxxps?):\/\/[^\s"',<>()]+)|([A-Za-z0-9._%+-]+@[A-Za-z0-9.\[\]-]+\.[A-Za-z]{2,})|(\b(?:GET|POST|CLICK|CLICKED|OPENED|BLOCK|BLOCKED|DENY|DENIED|ALERT|ALERTED|QUARANTINE|QUARANTINED|REWRITE|REWRITTEN|DELIVERED|DETONATED|FAILED|PASS|WATCHLIST|REPUTATION|MALICIOUS|PHISH)\b)/gi;
function hlLine(line){
  var out=''; var last=0; var m;
  HL_RE.lastIndex=0;
  while((m=HL_RE.exec(line))!==null){
    out += esc(line.slice(last, m.index));
    var t = m[0];
    if(m[1]){ out += '<span class="l-ts">'+esc(t)+'</span>'; }
    else if(m[2]){ out += '<span class="l-ip">'+esc(t)+'</span>'; }
    else if(m[3]){ out += '<span class="l-url">'+esc(t)+'</span>'; }
    else if(m[4]){ out += '<span class="l-mail">'+esc(t)+'</span>'; }
    else { out += '<span class="l-kw">'+esc(t)+'</span>'; }
    last = m.index + t.length;
  }
  out += esc(line.slice(last));
  return out;
}
function logViewerHTML(n, src, lines){
  var h = '<div class="logv" data-lv="'+n+'">';
  h += '<div class="logv-head"><span class="logv-src">&#128196; '+esc(src)+'</span><input class="logv-filter" type="text" placeholder="filter lines..." aria-label="Filter log lines for '+esc(src)+'"></div>';
  h += '<pre>';
  for(var i=0;i<lines.length;i++){ h += '<span class="ln">'+hlLine(lines[i])+'</span>'; }
  h += '</pre></div>';
  return h;
}
function artefactHTML(n, a){
  var h = '<div class="artefact"><div class="art-label">ARTEFACT '+n+' &#8212; '+esc(a.label)+'</div>';
  if(a.kind==='log'){
    h += logViewerHTML('a'+n, a.src || a.label, a.lines);
  } else if(a.kind==='note'){
    h += '<div class="art-note">'+esc(a.text)+'</div>';
  } else {
    h += '<pre class="mono">'+hlLine(a.text)+'</pre>';
  }
  h += '</div>';
  return h;
}
function scenarioHTML(e){
  var h = '<div class="block scenario"><div class="block-h"><span class="bh-ico">&#128270;</span><span class="bh-txt">SCENARIO</span>';
  h += '<button type="button" class="collapse-btn" id="scn-toggle">Collapse &#9662;</button></div>';
  h += '<div class="scn-sum" id="scn-sum" hidden>&#128204; '+esc(e.summary)+'</div>';

}
function bindScenario(){
