<script>window.__EXAM_DATA__ = {"meta":{"topicId":"t1690","techId":"T1690","objectLine":"T1690 — Prevent Command History Logging · MITRE ATT&CK Technique (Enterprise) · Tactic: Defense Impairment · Platforms: ESXi, Linux, Network Devices, Windows, macOS · Created 14 April 2026 (ATT&CK v20, version 1.0)","batch":2,"difficulty":"medium","examTitle":"T1690 — MEDIUM practice exam","sevWord":"MEDIUM","estimatedMinutes":35,"timerSec":2100,"passMark":70},"intro":{"learn":["You already know that T1690 — Prevent Command History Logging stops a shell from saving the commands an attacker types. This exam goes one step deeper. Here you combine two facts at a time: you read an artefact, decide what it shows, and then choose the action or control that matches it.","You will meet the same attacker goal on four platforms. On Linux and macOS the attacker unsets HISTFILE, zeroes HISTFILESIZE, or abuses HISTCONTROL=ignorespace with a leading space. On Windows the attacker redirects the PSReadLine history file or sets HistorySaveStyle to SaveNothing. On ESXi hypervisors the variable trick reappears and the syslog service can be stopped. On network devices a single CLI line can disable logging.","You will also meet real users of this technique, because the ATT&CK page lists them: APT38 typed every command with a leading space; Sea Turtle unset Bash and MySQL history files; the Medusa ransomware group removed the PowerShell history file; BPFDoor pointed MySQL and shell history at /dev/null; the VIRTUALPITA backdoor zeroed HISTFILE on ESXi and stopped the syslog service.","Real work with this technique: SOC analysts confirm which alert shows prevention rather than noise; detection engineers write rules that watch for tampered variables and for history files that stop growing; incident responders capture the live process environment before it disappears; GRC analysts check that baseline configurations keep ignoredups instead of ignoreboth. This exam practises those pairings on realistic cases."],"roles":["SOC analyst (tier 2)","Detection engineer","Incident responder","Threat hunter","Red team lead","GRC analyst","Platform engineer (hardening)"],"keywords":[{"theme":"Technique and tactic recap","items":["T1690 — Prevent Command History Logging","Defense Impairment — weakening the history record before commands are saved","Prevent vs clear — future logging vs already-saved history"]},{"theme":"Linux, macOS and MySQL mechanics","items":["HISTFILE / HISTFILESIZE / HISTCONTROL — the three variables attackers touch","ignorespace, ignoredups, ignoreboth — the HISTCONTROL values and what each hides","MYSQL_HISTFILE — the MySQL client history variable attackers point at /dev/null","/proc/<PID>/environ — the live process environment where set variables can still be read"]},{"theme":"Windows mechanics","items":["Set-PSReadLineOption -HistorySavePath — redirects where PowerShell history is written","Set-PSReadLineOption -HistorySaveStyle SaveNothing — stops saving PowerShell history","Remove-Item (Get-PSReadlineOption).HistorySavePath — deletes the PowerShell history file"]},{"theme":"ESXi and network devices","items":["ESXi HISTFILE — the variable trick works on hypervisor shells too","vmsyslogd — the ESXi logging service attackers stop","no logging — a network device CLI line that disables logging"]},{"theme":"Detection and analytics","items":["DET0563 — the ATT&CK detection strategy for this technique","AN1555 / AN1556 — tampered history variables plus missing bash history writes","AN1557 — PowerShell history suppression via PSReadLine options","AN1558 — ESXi shells with unset HISTFILE","AN1559 — network CLI commands that disable history logging"]},{"theme":"Mitigations","items":["M1039 Environment Variable Permissions — block changes to HISTFILE-like variables","M1028 Operating System Configuration — keep HISTCONTROL on ignoredups"]}],"how":["Pass mark: 70%. Your score is the credit you earn over the exercises you actually answer; skipped-and-never-answered exercises do not count in either side.","You have 16 exercises and 35 minutes. Each exercise chains two ideas: read the artefact, then act on it.","Check stops the timer automatically (⏸ PAUSED — reviewing feedback) and Next restarts it. Study the feedback as long as you need.","Pause is your real break: the exercise is hidden and the clock stops until you press Resume.","Multi-answer exercises use partial credit: max(0, (H − W) / N). Wrong picks cancel right picks, so do not select everything.","One hint per exercise costs 10% of that exercise's credit.","Skip parks an exercise in a review list. You can answer parked exercises until the timer ends; unfinished ones are excluded from the score.","The terminal exercise simulates a shell. It grades the command elements you include; a wrong flag costs you credit."]},"exercises":[{"id":"med-01","type":"multi","title":"Audit a shell config","scenario":{"summary":"Config review of lin-dev09 — select every suppressing line","arts":[{"label":"ARTEFACT 1 — /home/rdev/.bashrc on lin-dev09 (excerpt)","mono":true,"body":"1  export HISTSIZE=10000\n2  shopt -s histappend\n3  unset HISTFILE\n4  export HISTFILESIZE=0\n5  export HISTCONTROL=ignorespace\n6  alias ll='ls -la'"}]},"question":"Select every line in this .bashrc that suppresses command history logging.","hint":"Two lines are normal quality-of-life settings. Three lines stop history from being written.","explain":"Lines 3, 4 and 5 each stop history from being recorded: no file pointer, a zero size cap, and space-skipping. Lines 1 and 2 are normal settings (a bigger history and appending instead of overwriting), and line 6 is only an alias. Finding all three suppressing lines in one config is the typical SOC review task when a developer account is suspected.","study":"HISTSIZE=10000 is the near-miss here: a big size limit still keeps history, it does not suppress it.","multi":{"opts":[{"t":"Line 3: unset HISTFILE","correct":true,"why":"Correct: with no HISTFILE, bash has no file to flush history into."},{"t":"Line 4: export HISTFILESIZE=0","correct":true,"why":"Correct: a zero size cap keeps the history file empty."},{"t":"Line 5: export HISTCONTROL=ignorespace","correct":true,"why":"Correct: space-prefixed commands are then skipped silently."},{"t":"Line 1: export HISTSIZE=10000","correct":false,"why":"Wrong: a larger in-memory history still gets saved — it does not suppress logging."},{"t":"Line 2: shopt -s histappend","correct":false,"why":"Wrong: histappend appends new lines instead of overwriting — history still works."},{"t":"Line 6: alias ll='ls -la'","correct":false,"why":"Wrong: an alias only renames a command; it has no effect on history."}]}},{"id":"med-02","type":"terminal","title":"Silence PowerShell history","scenario":{"summary":"Windows lab win-lab-02 — PSReadLine task","arts":[{"label":"ARTEFACT 1 — lab task card","mono":false,"body":"In the Windows lab you demonstrate the PowerShell variant of T1690.\nYou know the tool: the Set-PSReadLineOption cmdlet.\nGoal in plain words: from now on, save nothing into the PowerShell history file."}]},"question":"Type the full command that tells PSReadLine to save no history.","hint":"You need the cmdlet, the parameter that controls the save style, and the value that means 'save nothing'.","explain":"Set-PSReadLineOption -HistorySaveStyle SaveNothing stops PSReadLine from writing future commands into ConsoleHost_history.txt. The cmdlet is Set-PSReadLineOption; -HistorySaveStyle selects the saving mode; SaveNothing is the mode that keeps nothing. This is the canonical Windows variant of the technique on the ATT&CK page.","study":"If the command fails, check the exact parameter spelling: HistorySaveStyle.","terminal":{"prompt":"PS win-lab-02>","banner":["# Windows PowerShell 7 training shell","# Simulated session — no real module is changed"],"solution":"Set-PSReadLineOption -HistorySaveStyle SaveNothing","elements":[{"re":"set-psreadlineoption","label":"uses the Set-PSReadLineOption cmdlet","why":"The cmdlet changes PSReadLine runtime options."},{"re":"-historysavestyle","label":"targets the HistorySaveStyle parameter","why":"That parameter controls whether and how history is saved."},{"re":"savenothing","label":"sets the style to SaveNothing","why":"SaveNothing stops new history from being written."}],"dangerous":[{"re":"remove-item|del |rd ","label":"delete command in this context","why":"Deleting the history file destroys existing evidence instead of testing prevention."}],"panel":null,"sampleOut":null,"output":["HistorySaveStyle : SaveNothing"]}},{"id":"med-03","type":"drag","title":"Which platform does what","scenario":{"summary":"Sort five commands by the platform they belong to","arts":[{"label":"ARTEFACT 1 — multi-platform case bag","mono":false,"body":"Five command lines were collected from three different case reports.\nEach one disables or redirects command history, but on a different platform family.\nSort them so the report can name the right platform for each."}]},"question":"Drag each command to the platform where it runs.","hint":"export/unset belong to Unix shells; Set-* cmdlets to PowerShell; plain short config lines to network CLIs.","explain":"export and unset change shell variables on Linux and macOS, including MySQL client variables like MYSQL_HISTFILE. Set-PSReadLineOption and Remove-Item against HistorySavePath are PowerShell on Windows. 'no logging' is the classic network device CLI line that turns logging off, as the ATT&CK page notes for network devices.","study":"Platform spotting is step one of every T1690 triage.","drag":{"zones":[{"id":"z-linux","label":"Linux / macOS shell"},{"id":"z-win","label":"Windows PowerShell"},{"id":"z-net","label":"Network device CLI"}],"items":[{"t":"export HISTFILESIZE=0","zone":"z-linux","why":"export with a variable is Unix shell syntax."},{"t":"Set-PSReadLineOption -HistorySaveStyle SaveNothing","zone":"z-win","why":"A PSReadLine cmdlet runs in Windows PowerShell."},{"t":"no logging","zone":"z-net","why":"Network device CLIs disable logging with short config lines like this."},{"t":"unset MYSQL_HISTFILE","zone":"z-linux","why":"MySQL client history on Unix is controlled by shell variables."},{"t":"Remove-Item (Get-PSReadlineOption).HistorySavePath","zone":"z-win","why":"Get-/Remove- cmdlets and the HistorySavePath property are PowerShell."}]}},{"id":"med-04","type":"qcm","title":"Choose the data source","scenario":{"summary":"Detection design — catch the space-prefix trick","arts":[{"label":"ARTEFACT 1 — design note","mono":false,"body":"Detection engineering ticket DE-77:\n'We must catch the leading-space trick on Linux servers.\nHistory files alone will never show those commands.\nWhich data source should the analytic use?'"}]},"question":"Which data source gives the analytic the best chance to see space-prefixed commands?","hint":"The history file skips them — so the source must record the command before the shell filters it.","explain":"Space-prefixed commands never reach the history file, so the analytic must watch a source that records commands independently of bash filtering: process command-line or shell command execution logs (auditd, EDR telemetry). Firewall, DHCP and antivirus records never contain the typed command, so they cannot show the trick.","study":"When one source filters data, detect from a source that does not filter.","qcm":{"correct":2,"opts":[{"t":"The firewall logs of the server segment.","why":"Wrong: firewalls see connections, not typed commands."},{"t":"The DHCP lease table of the site.","why":"Wrong: DHCP only maps addresses to hosts."},{"t":"Shell command execution logging such as auditd or EDR process command lines.","why":"Correct: these record the full command line, including the leading space."},{"t":"The antivirus quarantine list.","why":"Wrong: quarantine lists hold detected files, not commands."}]}},{"id":"med-05","type":"branch","title":"Work the alert queue","scenario":{"summary":"Three alerts on the queue — one is T1690","arts":[{"label":"ARTEFACT 1 — SOC queue (three alerts)","mono":true,"body":"A-77101  lin-db01  dbadmin ran: export HISTCONTROL=ignorespace\nA-77102  win-fs01  antivirus quarantined a test malware sample\nA-77103  vpn-gw01  new login country for user j.nowak"}]},"question":"Triage the queue in three steps.","hint":"Only one alert names a command that stops history being written.","explain":"Alert A-77101 contains an actual T1690 command: setting ignorespace lets every following space-prefixed command vanish from history. The quarantine and the new-country login are real work, but neither is history prevention. The right follow-up looks for evidence that the trick is being used — command execution logs and the shell config — and the right escalation records the behaviour under T1690 for the IR lead.","study":"First decide WHAT a technique is, then WHERE to look for its use, then HOW to report it.","branch":{"sim":true,"best":"A-77101 is the T1690 alert; verify via command telemetry and shell config, then hand it to IR with the artefacts.","steps":[{"question":"Step 1 — Which alert shows T1690 behaviour?","opts":[{"t":"A-77101 — a user set HISTCONTROL=ignorespace.","good":true,"why":"Correct: ignorespace enables the leading-space hiding trick.","outcome":"You pick A-77101 for deeper checks."},{"t":"A-77102 — antivirus quarantined a sample.","good":false,"why":"Wrong: quarantine is antivirus work, not history tampering.","outcome":"Following A-77102 wastes the shift on the wrong queue item."},{"t":"A-77103 — a login from a new country.","good":false,"why":"Wrong: that is an access anomaly, not command history behaviour.","outcome":"The real suppression continues unnoticed."}]},{"question":"Step 2 — What should you check next on lin-db01?","opts":[{"t":"Command execution logs and the user's shell config for further suppression.","good":true,"why":"Correct: you need to see whether space-prefixed commands followed the change.","outcome":"Auditd shows eleven space-prefixed commands the same hour."},{"t":"Only the antivirus quarantine folder.","good":false,"why":"Wrong: the quarantine cannot show shell behaviour.","outcome":"The check finds nothing about the trick."},{"t":"The VPN gateway logs.","good":false,"why":"Wrong: VPN logs belong to alert A-77103, not to the shell.","outcome":"The trail on lin-db01 goes cold."}]},{"question":"Step 3 — How do you report it?","opts":[{"t":"Hand the alert, the config and the space-prefixed commands to IR, mapped to T1690.","good":true,"why":"Correct: a clean handover with artefacts lets IR act fast.","outcome":"IR opens a case and preserves the session data."},{"t":"Close the alert as a false positive to keep the queue clean.","good":false,"why":"Wrong: closing hides a real suppression attempt.","outcome":"The attacker keeps a hiding channel."},{"t":"Wait for the user to file a change ticket first.","good":false,"why":"Wrong: waiting leaves the hiding channel open while the attacker works.","outcome":"Response is delayed by hours."}]}]}},{"id":"med-06","type":"match","title":"Group and its trick","scenario":{"summary":"Match three groups to their observed T1690 behaviour","arts":[{"label":"ARTEFACT 1 — CTI digest cards","mono":false,"body":"Three groups on the ATT&CK page for T1690, three habits:\nOne financial group types a space before every command.\nOne espionage group unsets the Bash and MySQL history files.\nOne ransomware group deletes the PowerShell history file by name."}]},"question":"Match each group to the behaviour the ATT&CK page records for it.","hint":"Space prefix, unset variables, Remove-Item on the history path — one habit each.","explain":"APT38 (G0082) is recorded prepending a space to terminal commands so HISTCONTROL skips them. Sea Turtle (G1041) unset the Bash and MySQL history files on victims. The Medusa group removed the PowerShell history file with Remove-Item (Get-PSReadlineOption).HistorySavePath. Recognising these habits helps you attribute faster and choose the right detection per group.","study":"These three examples all appear on the ATT&CK procedure examples table.","match":{"pairs":[{"l":"APT38 (G0082)","r":"Prepends a space to every terminal command","why":"APT38 used the HISTCONTROL=ignorespace space-prefix trick."},{"l":"Sea Turtle (G1041)","r":"Unsets the Bash and MySQL history files","why":"Sea Turtle cleared the history variables on victim systems."},{"l":"Medusa (G1051)","r":"Removes the PowerShell history file with Remove-Item","why":"Medusa ran Remove-Item (Get-PSReadlineOption).HistorySavePath."}]}},{"id":"med-07","type":"fill","title":"Write the analytic description","scenario":{"summary":"Detection engineering — fill the rule description","arts":[{"label":"ARTEFACT 1 — rule draft for AN1555-style logic","mono":true,"body":"# analytic draft — bash history tampering\nAlert when a shell process is started with __________ unset,\nor when __________ is set to __________\nwhile an interactive session is active."}]},"question":"Place the three missing words into the analytic description.","hint":"One variable is the file pointer, one is the size cap, and the dangerous value is a single digit.","explain":"The core Linux analytic watches the two variables attackers unset or zero: HISTFILE (the file pointer) and HISTFILESIZE (the size cap) set to 0. Requiring an active session in the correlation is what makes the alert strong — variables alone are changed by admins too, but a live session with a dead history file is the evasion pattern.","study":"Correlation with an active session turns a weak signal into a strong one.","fill":{"text":"Alert when a shell process is started with {{0}} unset, or when {{1}} is set to {{2}}, while an interactive session is active.","slots":[{"correct":"HISTFILE","why":"An unset HISTFILE removes the history save target."},{"correct":"HISTFILESIZE","why":"HISTFILESIZE caps how many lines are kept."},{"correct":"0","why":"Zero lines means nothing new is saved."}],"bank":["HISTFILE","HISTFILESIZE","0","ignoredups","10000"]}},{"id":"med-08","type":"branch","title":"Redirected history path","scenario":{"summary":"EDR alert on win-fs11 — HistorySavePath changed","arts":[{"label":"ARTEFACT 1 — EDR event","mono":true,"body":"host:  win-fs11\nuser:  svc_backup\nrun:   Set-PSReadLineOption -HistorySavePath C:\\Users\\svc_backup\\notes.txt\ntime:  21:40 local"}]},"question":"Decide what happened and what to collect, in two steps.","hint":"The cmdlet did not delete anything — it changed WHERE history is written.","explain":"Changing HistorySavePath does not stop history; it moves it. ConsoleHost_history.txt stops growing because the module now writes into notes.txt instead — exactly the stop-receiving-logs effect the ATT&CK page describes. The evidence to pull first is therefore the current PSReadLine configuration of that account and the content of the new file. A service account running an interactive-style cmdlet at night is itself the anomaly.","study":"Redirecting the path is prevention by another route: the default file stops receiving logs.","branch":{"sim":false,"best":"HistorySavePath redirection moved PSReadLine output to a new file; collect the config and the new file.","steps":[{"question":"Step 1 — What did this command do to history logging?","opts":[{"t":"It redirected PowerShell history into a different file.","good":true,"why":"Correct: HistorySavePath changes the destination, so the default file goes quiet.","outcome":"You record the event as T1690 redirection behaviour."},{"t":"It started the nightly backup job.","good":false,"why":"Wrong: a PSReadLine option has nothing to do with backup jobs.","outcome":"The alert is misfiled as routine."},{"t":"It deleted all PowerShell history at once.","good":false,"why":"Wrong: this command changes a path; deletion would need Remove-Item.","outcome":"The report claims destruction that never happened."}]},{"question":"Step 2 — Which evidence do you collect first?","opts":[{"t":"The PSReadLine configuration of svc_backup and the content of notes.txt.","good":true,"why":"Correct: the config shows the redirection and the file shows what it was hiding.","outcome":"Both artefacts confirm the redirection."},{"t":"A full reimage of win-fs11.","good":false,"why":"Wrong: reimaging destroys the evidence you still need.","outcome":"The trail is wiped."},{"t":"The printer history of the server room.","good":false,"why":"Wrong: printing is unrelated to PowerShell history.","outcome":"Time is wasted on an unrelated source."}]}]}},{"id":"med-09","type":"qcm","title":"Pick the matching mitigation","scenario":{"summary":"Hardening ticket — stop users changing history variables","arts":[{"label":"ARTEFACT 1 — hardening ticket HRD-31","mono":false,"body":"Goal: users must not be able to change HISTFILE, HISTFILESIZE or HISTCONTROL\non the shared Linux build.\nWhich ATT&CK mitigation matches this goal?"}]},"question":"Which mitigation on the ATT&CK page matches the ticket goal?","hint":"The goal is about permissions on environment variables — the mitigation name says the same.","explain":"M1039 Environment Variable Permissions is exactly this control: prevent users from changing HISTCONTROL, HISTFILE and HISTFILESIZE. M1028 Operating System Configuration is about keeping ignoredups as the HISTCONTROL value. Patching and application isolation do not touch shell variables.","study":"Match the control name to the object it protects: variables → variable permissions.","qcm":{"correct":0,"opts":[{"t":"M1039 — Environment Variable Permissions.","why":"Correct: M1039 blocks users from changing the history variables."},{"t":"M1028 — Operating System Configuration.","why":"Wrong: M1028 is the ignoredups baseline, not the variable permission lock."},{"t":"M1051 — Update Software.","why":"Wrong: patching fixes vulnerabilities; it does not lock shell variables."},{"t":"M1040 — Strengthen Defensive Configuration? — no such control for variables.","why":"Wrong: this is not the mitigation the ATT&CK page lists for T1690."}]}},{"id":"med-10","type":"qcm","title":"The confident admin","scenario":{"summary":"Standup claim about server baselines","arts":[{"label":"ARTEFACT 1 — chat message","mono":false,"body":"#platform-team, 09:12\n'Our servers are safe by default: HISTCONTROL=ignoreboth ships on every build,\nso nobody can hide commands. No extra control needed.'"}]},"question":"What is the flaw in this claim?","hint":"ignoreboth bundles ignorespace. What can a user still hide with the default in place?","explain":"The claim fails because ignoreboth includes ignorespace: any user can hide a command by typing one space first — by default. The platform team should set HISTCONTROL=ignoredups, which only skips exact duplicates and keeps space-prefixed commands visible. The other answers misunderstand the setting or the platform.","study":"M1028 says: use ignoredups, not ignoreboth.","qcm":{"correct":1,"opts":[{"t":"HISTCONTROL is misspelled on all builds.","why":"Wrong: the variable name is correct; the value is the problem."},{"t":"ignoreboth includes ignorespace, so a single leading space hides commands by default.","why":"Correct: the default itself opens the hiding trick."},{"t":"ignoreboth wipes the history file at each login.","why":"Wrong: it skips saving some commands; it never wipes files."},{"t":"HISTCONTROL has no effect on Linux servers.","why":"Wrong: bash on Linux respects HISTCONTROL fully."}]}},{"id":"med-11","type":"order","title":"First response on a live host","scenario":{"summary":"Order five first-response steps on app-lin-04","arts":[{"label":"ARTEFACT 1 — case note","mono":false,"body":"app-lin-04 shows a live shell session whose history file stopped growing.\nThe responder must collect the right evidence in the right order before anything changes.\nThe five steps are shuffled in the answer area."}]},"question":"Order the first-response steps from first to last.","hint":"Most volatile first: the process environment dies with the process.","explain":"The live environment of the suspect shell (/proc/<PID>/environ) dies with the process, so it comes first. Config files and auditd records are on disk and survive longer. Only after capturing the volatile data do you compare what history should have been written with what exists, and finally you report with timestamps so others can repeat the work.","study":"Volatility ordering: memory-like data first, disk data second, reporting last.","order":{"items":[{"t":"Capture the live shell environment from /proc/<PID>/environ.","why":"The environment disappears when the process ends — highest volatility."},{"t":"Copy the shell config files (.bashrc, .bash_profile) of the account.","why":"Config files can hold suppression lines; they are stable on disk."},{"t":"Export the session command lines from auditd or EDR telemetry.","why":"Command telemetry shows what the session really ran."},{"t":"Compare the session activity with what ~/.bash_history contains.","why":"The gap between activity and saved history demonstrates the suppression."},{"t":"Report the findings with timestamps to the incident lead.","why":"A timestamped report makes the evidence usable for others."}]}},{"id":"med-12","type":"multi","title":"Hypervisor signals","scenario":{"summary":"Two changes on esx-prod02 — what does the page support?","arts":[{"label":"ARTEFACT 1 — hypervisor telemetry","mono":true,"body":"host:    esx-prod02 (ESXi)\nchange1: HISTFILE set to 0 in an ESXi shell session\nchange2: vmsyslogd service stopped\nactor:   local admin session, 02:05 local"}]},"question":"Select every conclusion the ATT&CK T1690 page supports for these two changes.","hint":"The page's ESXi example names both changes together, in one malware entry.","explain":"The ATT&CK page lists VIRTUALPITA (S1217) setting HISTFILE to 0 and stopping vmsyslogd on ESXi — both changes here match that pattern, and stopping the logging service also impairs ESXi's own logs. Nothing on the page calls either change part of normal startup, and no patch state follows from a variable change.","study":"The ESXi example pairs the variable trick with the syslog service.","multi":{"opts":[{"t":"The HISTFILE change is history variable tampering.","correct":true,"why":"Correct: zeroing HISTFILE stops shell history on ESXi like on Linux."},{"t":"Stopping vmsyslogd also impairs the host's logging.","correct":true,"why":"Correct: vmsyslogd is ESXi's logging service; stopping it removes log output."},{"t":"This pair of changes matches the VIRTUALPITA example on the page.","correct":true,"why":"Correct: VIRTUALPITA does exactly these two actions on ESXi."},{"t":"The changes prove the hypervisor is fully patched.","correct":false,"why":"Wrong: variable and service changes say nothing about patch levels."},{"t":"Both changes are part of normal ESXi startup.","correct":false,"why":"Wrong: neither change is a normal startup action."}]}},{"id":"med-13","type":"qcm","title":"Red team trade-off","scenario":{"summary":"Authorised engagement — pick the quietest variant","arts":[{"label":"ARTEFACT 1 — engagement note (authorised test)","mono":false,"body":"You hold root on a Linux test host. The blue team reads ~/.bash_history after the exercise.\nEngagement rules: no destructive actions, keep file changes minimal."}]},"question":"Which variant keeps your new commands out of the history file with the smallest footprint?","hint":"Compare what each option writes to disk versus what it only changes in memory.","explain":"unset HISTFILE in your own session only changes that session's environment — no file on disk is touched, and the session simply stops flushing history. Editing /etc/profile or planting a cron job writes files that defenders can diff, and deleting the history file destroys evidence and violates the engagement rules.","study":"Prevention lives in the session; the loudest variants write to disk.","qcm":{"correct":2,"opts":[{"t":"Edit /etc/profile so every future login unsets HISTFILE.","why":"Wrong: a system file change is a loud, persistent artefact."},{"t":"Create a cron job that wipes ~/.bash_history every hour.","why":"Wrong: cron entries are visible, and wiping destroys saved history."},{"t":"Run unset HISTFILE inside your own shell session.","why":"Correct: a session-scoped variable change leaves no file trace."},{"t":"Delete ~/.bash_history before logging off.","why":"Wrong: deletion destroys evidence and breaks the engagement rules."}]}},{"id":"med-14","type":"match","title":"Analytics and their focus","scenario":{"summary":"Match four analytics to the platform behaviour they watch","arts":[{"label":"ARTEFACT 1 — detection strategy DET0563 sheet","mono":true,"body":"AN1555  env-var tampering + missing bash history writes\nAN1556  bash/zsh suppression + ~/.bash_history stops updating\nAN1557  PSReadLine options (SaveNothing / HistorySavePath)\nAN1558  ESXi shell sessions with unset HISTFILE\nAN1559  device CLI lines like 'no logging'"}]},"question":"Match each behaviour family to its analytic.","hint":"Two analytics are bash-family, one is PowerShell, one is ESXi, one is network devices.","explain":"AN1555 and AN1556 both watch the bash family — variables plus missing writes. AN1557 is the PowerShell logic for PSReadLine options. AN1558 is the ESXi shell logic. AN1559 watches network device CLI for logging that is switched off. Mapping analytics to platforms is how coverage gaps get found later.","study":"DET0563 collects all five analytics across the platforms T1690 touches.","match":{"pairs":[{"l":"Env-var tampering with an active shell session","r":"AN1555","why":"AN1555 correlates unset or zeroed history variables with live sessions."},{"l":"PSReadLine options changed on Windows","r":"AN1557","why":"AN1557 covers SaveNothing and HistorySavePath changes."},{"l":"ESXi shell sessions with unset HISTFILE","r":"AN1558","why":"AN1558 is the ESXi-focused analytic."},{"l":"Device CLI disabling history logging","r":"AN1559","why":"AN1559 watches for CLI lines such as 'no logging'."}]}},{"id":"med-15","type":"fill","title":"Finish the engagement sentence","scenario":{"summary":"CTI report draft — three gaps","arts":[{"label":"ARTEFACT 1 — report paragraph (gaps marked)","mono":true,"body":"During the engagement the operator typed each command with a leading ________ .\nBecause HISTCONTROL was set to ________ , bash skipped those lines.\nThe behaviour is mapped to technique ________ in the report."}]},"question":"Place the three missing words into the report sentence.","hint":"The trick, the enabling value, and the technique ID that prevents history logging.","explain":"The sentence needs the trick (a leading space), the enabler (HISTCONTROL=ignorespace skips such lines), and the right technique ID: T1690 prevents history logging. T1070.003 would be wrong here because nothing was cleared — the commands were simply never saved.","study":"Never-saved is T1690; already-saved-then-removed is T1070.003.","fill":{"text":"The operator typed each command with a leading {{0}}. Because HISTCONTROL was set to {{1}}, bash skipped those lines. The behaviour is mapped to technique {{2}} in the report.","slots":[{"correct":"space","why":"The trick is one leading space per command."},{"correct":"ignorespace","why":"ignorespace is the HISTCONTROL value that skips space-prefixed lines."},{"correct":"T1690","why":"Preventing new history lines is T1690, not the clearing technique."}],"bank":["space","ignorespace","T1690","T1070.003","ignoredups"]}},{"id":"med-16","type":"qcm","title":"Evidence that survives","scenario":{"summary":"BPFDoor case — variables pointed at /dev/null","arts":[{"label":"ARTEFACT 1 — malware note from the case","mono":true,"body":"BPFDoor sets MYSQL_HISTFILE and HISTFILE to /dev/null\nso the shell and the MySQL client stop writing history.\nThe backdoor process is still running on the host."}]},"question":"Where can investigators still read the malware's HISTFILE=/dev/null setting right now?","hint":"The variables live in the running process — there is a standard interface to read a live process's environment.","explain":"While the process runs, its environment is readable from /proc/<PID>/environ on Linux — the same place the ATT&CK page cites when it describes BPFDoor's variable settings. A reboot would remove it; the registry and printer queues are Windows artefacts, and cloud consoles never hold local process environments.","study":"Volatile evidence first: /proc/<PID>/environ dies with the process.","qcm":{"correct":0,"opts":[{"t":"In the running process environment, /proc/<PID>/environ.","why":"Correct: the live environment holds the variables until the process ends."},{"t":"In the cloud provider's console.","why":"Wrong: the cloud console cannot show a local process environment."},{"t":"In the Windows registry of the host.","why":"Wrong: this is a Linux host and process environments are not in a registry."},{"t":"In the printer spooler queue.","why":"Wrong: print jobs have nothing to do with shell variables."}]}}]};</script>
<script>

(function () {
  'use strict';
  var D = window.__EXAM_DATA__;
  var M = D.meta;

  /* ---------- helpers ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function shuffled(a) { var x = a.slice(); for (var i = x.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = x[i]; x[i] = x[j]; x[j] = t; } return x; }
  function norm(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().toLowerCase(); }
  function fmtClk(sec) { sec = Math.max(0, sec | 0); var m = (sec / 60) | 0, s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
  function reTest(reStr, s) { try { return new RegExp(reStr, 'i').test(s); } catch (e) { return false; } }
  function scoreSet(sel, cor) {
    var cs = {}; cor.forEach(function (x) { cs[x] = 1; });
    var H = 0, W = 0;
    sel.forEach(function (x) { if (cs[x]) H++; else W++; });
    var N = cor.length; if (!N) return { credit: 0, H: 0, W: 0, N: 0 };
    return { credit: Math.max(0, (H - W) / N), H: H, W: W, N: N };
  }
  var TYPE_LABEL = { qcm: 'Multiple choice', multi: 'Select all that apply', drag: 'Drag & drop', order: 'Timeline ordering', match: 'Matching', fill: 'Fill the blanks', terminal: 'Terminal — type the command', branch: 'Decision scenario', logview: 'Log analysis' };

  /* ---------- syntax highlighter ---------- */
  var TOK_RE = new RegExp([
    '(\\/proc\\/\\d+\\/environ|\\/proc\\/\\$PID|\\/proc\\/[0-9]+|\\/dev\\/null|[\\/~][\\w.\\/-]*bash_history|zsh_history|ConsoleHost_history\\.txt|\\$env:APPDATA[\\w.\\\\-]*)',
    '(Set-PSReadLineOption|Set-PSReadlineOption|Get-PSReadlineOption|Remove-Item|Get-Content|Set-ItemProperty)',
    '(HistorySavePath|HistorySaveStyle|SaveNothing|PSReadLine|PSReadline)',
    '(MYSQL_HISTFILE|HISTFILE|HISTFILESIZE|HISTSIZE|HISTCONTROL|HISTCMD|HISTTIMEFORMAT|HISTIGNORE)',
    '(vmsyslogd|dslogserver|syslogd|auditd|journalctl|ausearch|systemctl|service|resolv)',
    '(no logging|show logging|show run|logging host|logging enable|logging)',
    '(export|unset|printenv|echo|cat|sudo|grep|tr|tail|head|awk|sed|history|env|bash|zsh|kill|ps|enable|configure)',
    '(-{1,2}[A-Za-z][A-Za-z0-9-]*)'
  ].join('|'), 'g');
  function tokClass(m) {
    if (m[1]) return 'tok-path';
    if (m[2] || m[3]) return 'tok-ps';
    if (m[4]) return 'tok-env';
    if (m[5]) return 'tok-svc';
    if (m[6] || m[7]) return 'tok-cmd';
    if (m[8]) return 'tok-flag';
    return null;
  }
  function hlLine(line) {
    var f = document.createDocumentFragment();
    var tr = line.replace(/\s+$/, '');
    if (tr.charAt(0) === '#') { f.appendChild(el('span', 'tok-comment', line)); return f; }
    var last = 0, m;
    TOK_RE.lastIndex = 0;
    while ((m = TOK_RE.exec(line)) !== null) {
      if (m.index > last) f.appendChild(el('span', null, line.slice(last, m.index)));
      f.appendChild(el('span', tokClass(m), m[0]));
      last = m.index + m[0].length;
      if (m[0].length === 0) { TOK_RE.lastIndex++; }
    }
    if (last < line.length) f.appendChild(el('span', null, line.slice(last)));
    return f;
  }
  function monoBlock(lines) {
    var pre = el('pre', 'mono');
    (lines || []).forEach(function (ln) {
      var d = el('div', 'monoline');
      if (ln === '') { d.appendChild(document.createTextNode(' ')); } else { d.appendChild(hlLine(ln)); }
      pre.appendChild(d);
    });
    return pre;
  }
  function artPanel(a) {
    var d = el('div', 'art' + (a.mono ? '' : ' prose'));
    d.appendChild(el('div', 'alabel', a.label));
    if (a.mono) { d.appendChild(monoBlock(String(a.body).split('\n'))); }
    else { String(a.body).split('\n').forEach(function (p) { if (p.trim()) d.appendChild(el('p', null, p)); }); }
    return d;
  }

  /* ---------- state ---------- */
  var S = {
    screen: 'intro', order: [], idx: 0,
    results: {}, checkedIds: {}, hinted: {}, skipped: [],
    sum: 0, answered: 0, locked: false,
    returnTo: null, cur: null, widget: null,
    timer: { state: 'IDLE', left: M.timerSec, tick: null, lastT: 0, resumeBack: null },
    pauseManual: 0, pauseAuto: 0,
    reported: false,
    init: { username: '', country: '', locale: 'en' }
  };
  function byId(id) { for (var i = 0; i < D.exercises.length; i++) { if (D.exercises[i].id === id) return D.exercises[i]; } return null; }
  D.exercises.forEach(function (ex) {
    if (ex.type === 'drag') { ex.drag.items.forEach(function (it, i) { if (!it.id) { it.id = 'i' + i; } }); }
  });

  /* ---------- timer state machine: IDLE | RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED ---------- */
  function tick() {
    var st = S.timer.state;
    if (st === 'IDLE' || st === 'ENDED') return;
    var now = Date.now();
    var dt = Math.round((now - S.timer.lastT) / 1000);
    if (dt <= 0) return;
    S.timer.lastT = now;
    if (st === 'RUNNING') {
      S.timer.left -= dt;
      if (S.timer.left <= 0) { S.timer.left = 0; renderTimerChip(); toState('ENDED'); return; }
    } else if (st === 'PAUSED_MANUAL') { S.pauseManual += dt; }
    else if (st === 'PAUSED_AUTO_CHECK') { S.pauseAuto += dt; }
    renderTimerChip();
  }
  function toState(st) {
    S.timer.state = st;
    renderTimerChip();
    if (st === 'ENDED') { finishExam(true); }
  }
  function startTicker() {
    S.timer.lastT = Date.now();
    if (S.timer.tick) { clearInterval(S.timer.tick); }
    S.timer.tick = setInterval(tick, 500);
  }
  function stopTicker() { if (S.timer.tick) { clearInterval(S.timer.tick); S.timer.tick = null; } }

  /* ---------- header ---------- */
  function renderTimerChip() {
    var st = S.timer.state, ico = '▶', word = 'RUNNING', cls = 'running';
    if (st === 'PAUSED_MANUAL') { ico = '⏸'; word = 'PAUSED — manual (press Resume)'; cls = 'paused'; }
    else if (st === 'PAUSED_AUTO_CHECK') { ico = '⏸'; word = 'PAUSED — reviewing feedback (resumes on Next)'; cls = 'paused'; }
    else if (st === 'ENDED') { ico = '⏹'; word = 'ENDED'; cls = 'ended'; }
    else if (st === 'IDLE') { ico = '⏱'; word = 'READY'; cls = 'running'; }
    var t = $('#hd-timer');
    t.className = 'tstate ' + cls;
    $('#hd-tico').textContent = ico;
    $('#hd-tword').textContent = word;
    $('#hd-tclock').textContent = fmtClk(S.timer.left);
  }
  function renderScoreChip() {
    $('#hd-sum').textContent = (Math.round(S.sum * 10) / 10).toFixed(1);
    $('#hd-cnt').textContent = String(S.answered);
    $('#hd-pct').textContent = (S.answered > 0 ? Math.round((S.sum / S.answered) * 100) : 0) + '%';
  }
  function renderProgress() {
    var done = Object.keys(S.checkedIds).length + S.skipped.length;
    var pct = Math.max(0, Math.min(100, Math.round((done / D.exercises.length) * 100)));
    $('#progressbar').style.width = pct + '%';
  }
  function renderHeader() {
    var countChip = $('#hd-count');
    if (S.screen === 'review') { countChip.innerHTML = ''; countChip.appendChild(el('b', null, 'Review skipped — ' + S.skipped.length + ' left')); }
    else if (S.screen === 'results') { countChip.innerHTML = ''; countChip.appendChild(el('b', null, 'Exam finished')); }
    else { countChip.innerHTML = ''; countChip.appendChild(el('b', null, 'Exercise ' + (S.idx + 1) + ' of ' + D.exercises.length)); }
    var sev = $('#hd-sev');
    sev.textContent = '● ' + M.sevWord;
    sev.setAttribute('aria-label', 'Severity: ' + M.sevWord);
    renderTimerChip(); renderScoreChip();
    var inExam = (S.screen === 'exam');
    $('#bt-pause').disabled = !inExam || S.timer.state === 'ENDED';
    $('#bt-hint').disabled = !inExam || S.locked || !!(S.cur && S.hinted[S.cur.id]);
    $('#bt-skip').disabled = !inExam || S.locked;
    renderProgress();
  }

  /* ---------- views ---------- */
  function showView(name) {
    ['intro', 'exam', 'review', 'results'].forEach(function (v) { $('#view-' + v).hidden = (v !== name); });
    var chrome = (name !== 'intro');
    $('#topbar').hidden = !chrome;
    $('#progresswrap').hidden = !chrome;
  }

  /* ---------- intro screen (exactly four sections) ---------- */
  function buildIntro() {
    var v = $('#view-intro'); v.innerHTML = '';
    /* 1 — header strip */
    var c1 = el('div', 'card');
    var head = el('div', 'intro-head');
    head.appendChild(el('h1', null, M.examTitle));
    var badge = el('span', 'badge-sev', '● ' + M.sevWord); badge.setAttribute('aria-label', 'Severity: ' + M.sevWord);
    head.appendChild(badge);
    c1.appendChild(head);
    c1.appendChild(el('p', 'muted', M.objectLine));
    var mr = el('div', 'meta-row');
    mr.appendChild(metaItem('Exercises', String(D.exercises.length)));
    mr.appendChild(metaItem('Estimated time', M.estimatedMinutes + ' min'));
    mr.appendChild(metaItem('Timer budget', fmtClk(M.timerSec)));
    mr.appendChild(metaItem('Pass mark', M.passMark + '%'));
    if (S.init.username) { mr.appendChild(metaItem('Learner', S.init.username + (S.init.country && S.init.country !== 'ZZ' ? ' (' + S.init.country + ')' : ''))); }
    c1.appendChild(mr);
    v.appendChild(c1);
    /* 2 — what you will learn here */
    var c2 = el('div', 'card');
    c2.appendChild(el('h2', null, 'What you will learn here'));
    var grid = el('div', 'learn-grid');
    var lcol = el('div');
    D.intro.learn.forEach(function (p) { lcol.appendChild(el('p', null, p)); });
    grid.appendChild(lcol);
    var rcol = el('div');
    rcol.appendChild(el('h2', null, 'Roles that use this'));
    var roles = el('div', 'roles');
    D.intro.roles.forEach(function (r) { roles.appendChild(el('span', 'role', r)); });
    rcol.appendChild(roles);
    grid.appendChild(rcol);
    c2.appendChild(grid);
    v.appendChild(c2);
    /* 3 — keywords covered in this exam */
    var c3 = el('div', 'card');
    c3.appendChild(el('h2', null, 'Keywords covered in this exam'));
    c3.appendChild(el('p', 'muted', 'Every exercise below is built only from these concepts — the ones the ATT&CK page for ' + M.techId + ' actually ties together.'));
    var kg = el('div', 'kw-grid');
    D.intro.keywords.forEach(function (k) {
      var kc = el('div', 'kw-theme');
      kc.appendChild(el('h3', null, k.theme));
      var ul = el('ul', 'plain');
      k.items.forEach(function (it) {
        var li = el('li');
        if (it.indexOf(' — ') > 0) {
          var parts = it.split(' — ');
          li.appendChild(el('b', null, parts.shift()));
          li.appendChild(document.createTextNode(' — ' + parts.join(' — ')));
        } else { li.textContent = it; }
        ul.appendChild(li);
      });
      kc.appendChild(ul);
      kg.appendChild(kc);
    });
    c3.appendChild(kg);
    v.appendChild(c3);
    /* 4 — how this exam works */
    var c4 = el('div', 'card');
    c4.appendChild(el('h2', null, 'How this exam works'));
    var ul = el('ul', 'how-list plain');
    D.intro.how.forEach(function (h) { ul.appendChild(el('li', null, h)); });
    var liTypes = el('li');
    liTypes.appendChild(document.createTextNode('Exercise types used in this file: '));
    var types = [];
    D.exercises.forEach(function (ex) {
      var lbl = ex.type === 'branch' && ex.branch && ex.branch.sim ? 'Scenario simulation' : (TYPE_LABEL[ex.type] || ex.type);
      if (types.indexOf(lbl) < 0) { types.push(lbl); }
    });
    liTypes.appendChild(el('b', null, types.join(', ')));
    liTypes.appendChild(document.createTextNode('.'));
    ul.appendChild(liTypes);
    c4.appendChild(ul);
    var sr = el('div', 'start-row');
    var bt = el('button', 'btn primary', '▶ Start the exam');
    bt.id = 'bt-start';
    bt.addEventListener('click', startExam);
    sr.appendChild(bt);
    sr.appendChild(el('span', 'muted', 'The timer starts the moment you press Start. Good luck.'));
    c4.appendChild(sr);
    v.appendChild(c4);
  }
  function metaItem(k, val) { var m = el('span', 'meta-item'); m.appendChild(el('b', null, k + ': ')); m.appendChild(document.createTextNode(val)); return m; }

  function startExam() {
    S.order = shuffled(D.exercises.map(function (e) { return e.id; }));
    S.idx = 0; S.results = {}; S.checkedIds = {}; S.hinted = {}; S.skipped = [];
    S.sum = 0; S.answered = 0; S.locked = false; S.returnTo = null; S.reported = false;
    S.pauseManual = 0; S.pauseAuto = 0;
    S.timer.left = M.timerSec; S.timer.resumeBack = null;
    S.screen = 'exam';
    showView('exam');
    toState('RUNNING');
    startTicker();
    renderCurrent();
  }

  /* ---------- exercise scaffolding ---------- */
  function buildScenario(ex) {
    var b = el('div', 'block block-scen');
    var bh = el('div', 'bhead');
    bh.appendChild(el('span', null, '◆ SCENARIO'));
    var sum = el('span', 'gear', ex.scenario.summary);
    bh.appendChild(sum);
    var tg = el('span', 'gear', '▾ Collapse');
    bh.appendChild(tg);
    bh.addEventListener('click', function () {
      b.classList.toggle('collapsed');
      tg.textContent = b.classList.contains('collapsed') ? '▸ Expand' : '▾ Collapse';
    });
    b.appendChild(bh);
    var bb = el('div', 'bbody');
    (ex.scenario.arts || []).forEach(function (a) { bb.appendChild(artPanel(a)); });
    b.appendChild(bb);
    return b;
  }

  function renderCurrent() {
    var ex = byId(S.order[S.idx]);
    S.cur = ex; S.widget = null; S.locked = false;
    var v = $('#view-exam'); v.innerHTML = '';
    var card = el('div', 'excard');
    var meta = el('div', 'exmeta');
    var isSim = ex.type === 'branch' && ex.branch && ex.branch.sim;
    meta.appendChild(el('span', 'typechip', isSim ? 'Scenario simulation' : TYPE_LABEL[ex.type]));
    var bd = el('span', 'badge-sev', '● ' + M.sevWord); bd.setAttribute('aria-label', 'Severity: ' + M.sevWord);
    meta.appendChild(bd);
    card.appendChild(meta);
    card.appendChild(buildScenario(ex));
    var qb = el('div', 'block block-q');
    var qh = el('div', 'bhead'); qh.appendChild(el('span', null, '▲ QUESTION')); qh.appendChild(el('span', 'gear', 'one task only'));
    qb.appendChild(qh);
    var qbod = el('div', 'bbody'); qbod.appendChild(el('p', 'qtext', ex.question));
    qb.appendChild(qbod); card.appendChild(qb);
    var ab = el('div', 'block block-a');
    var ah = el('div', 'bhead'); ah.appendChild(el('span', null, '✓ YOUR ANSWER'));
    ab.appendChild(ah);
    var abod = el('div', 'bbody'); ab.appendChild(abod); card.appendChild(ab);
    var fb = el('div', 'feedback'); fb.hidden = true; card.appendChild(fb);
    var nav = el('div', 'start-row');
    var btCheck = el('button', 'btn primary', '✓ Check'); btCheck.id = 'bt-check';
    var btNext = el('button', 'btn', 'Next ▶'); btNext.id = 'bt-next'; btNext.disabled = true;
    if (S.idx === S.order.length - 1) { btNext.textContent = 'Final Submit ✓'; }
    btCheck.addEventListener('click', onCheck);
    btNext.addEventListener('click', onNext);
    nav.appendChild(btCheck); nav.appendChild(btNext);
    nav.appendChild(el('span', 'muted', 'Check stops the timer so you can study the feedback without pressure.'));
    card.appendChild(nav);
    v.appendChild(card);
    S.widget = WIDGETS[ex.type](ex, abod);
    updateBtns();
    renderHeader();
    window.scrollTo(0, 0);
  }

  function updateBtns() {
    var btCheck = $('#bt-check'), btNext = $('#bt-next');
    if (!btCheck) { return; }
    var ans = S.widget && S.widget.answered && S.widget.answered();
    btCheck.disabled = !ans || S.locked;
    btNext.disabled = !S.locked;
    if (S.idx === S.order.length - 1 && btNext.textContent.indexOf('Final') < 0) { btNext.textContent = 'Final Submit ✓'; }
  }

  /* ---------- widgets ---------- */
  var WIDGETS = {};

  WIDGETS.qcm = function (ex, host) {
    var q = ex.qcm;
    var order = shuffled(q.opts.map(function (o, i) { return i; }));
    var sel = -1, btns = [];
    var wrap = el('div', 'opts');
    order.forEach(function (oi, pos) {
      var o = q.opts[oi];
      var b = el('button', 'opt');
      b.setAttribute('aria-label', 'Option ' + 'ABCDEF'[pos]);
      b.appendChild(el('span', 'olabel', 'ABCDEF'[pos] + '.'));
      b.appendChild(el('span', null, o.t));
      b.addEventListener('click', function () {
        if (S.locked) { return; }
        sel = oi;
        btns.forEach(function (x) { x.classList.remove('selected'); var sm = x.querySelector('.selmark'); if (sm) { sm.remove(); } });
        b.classList.add('selected');
        b.appendChild(el('span', 'selmark', '● Selected'));
        updateBtns();
      });
      btns.push(b); wrap.appendChild(b);
    });
    host.appendChild(wrap);
    return {
      answered: function () { return sel >= 0; },
      grade: function () {
        var ok = sel === q.correct;
        var items = [];
        q.opts.forEach(function (o, i) {
          if (i === sel && ok) { items.push({ label: o.t, st: 'ok', why: o.why }); }
          else if (i === sel && !ok) { items.push({ label: o.t, st: 'bad', why: o.why }); }
          else if (i === q.correct && !ok) { items.push({ label: o.t, st: 'miss', why: o.why }); }

    (lv.logs || []).forEach(function (ln) {
      var d = el('div', 'logline');
      d.dataset.raw = ln;
      d.appendChild(hlLine(ln));
      linesBox.appendChild(d); lineEls.push(d);
    });
    panel.appendChild(linesBox);
    host.appendChild(panel);
    fin.addEventListener('input', function () {
      var f = fin.value.trim().toLowerCase();
      lineEls.forEach(function (d) {
        var raw = d.dataset.raw;
        if (!f || raw.toLowerCase().indexOf(f) >= 0) { d.style.display = ''; } else { d.style.display = 'none'; }
      });
    });
    var innerHost = el('div'); innerHost.style.marginTop = '14px';
    host.appendChild(innerHost);
    var innerData = {};
    innerData[lv.inner.type] = lv.inner;
    var inner = WIDGETS[lv.inner.type](innerData, innerHost);
    return {
      answered: function () { return inner.answered(); },
      grade: function () { return inner.grade(); }
    };
  };

  /* ---------- check / next / skip / hint ---------- */
  function onCheck() {
    if (S.locked || S.timer.state === 'ENDED' || S.screen !== 'exam') { return; }
    var w = S.widget;
    if (!w || !w.answered()) { return; }
    var g = w.grade();
    if (!g) { return; }
    if (S.hinted[S.cur.id]) { g.credit = Math.max(0, g.credit - 0.10); }
    g.credit = Math.max(0, Math.min(1, g.credit));
    S.results[S.cur.id] = g;
    S.checkedIds[S.cur.id] = true;
    var si = S.skipped.indexOf(S.cur.id);
    if (si >= 0) { S.skipped.splice(si, 1); }
    S.sum += g.credit; S.answered++;
    S.locked = true;
    toState('PAUSED_AUTO_CHECK');
    renderFeedback(S.cur, g);
    renderHeader(); updateBtns();
    var fb = $('#view-exam .feedback');
    if (fb) { fb.hidden = false; }
  }

  function fbIcon(st) { return st === 'ok' ? '✓ Correct' : (st === 'bad' ? '✗ Wrong' : '○ Missed'); }
  function renderFeedback(ex, g) {
    var fb = $('#view-exam .feedback');
    fb.innerHTML = '';
    var cls = g.credit >= 0.999 ? 'ok' : (g.credit > 0 ? 'partial' : 'bad');
    fb.classList.add(cls);
    var head = el('div', 'fb-head');
    var lab = g.credit >= 0.999 ? '✓ CORRECT' : (g.credit > 0 ? '✓ PARTIALLY CORRECT' : '✗ INCORRECT');
    head.appendChild(el('span', null, lab));
    if (g.N && g.N > 1) { head.appendChild(el('span', 'fb-credit', '— credit ' + (Math.round(g.credit * 100) / 100).toFixed(2) + ' · ' + g.H + ' of ' + g.N + ' items')); }
    fb.appendChild(head);
    var body = el('div', 'fb-body');
    if (g.danger) {
      var dw = el('div', 'item st-bad');
      dw.appendChild(el('span', 'ist', '✗ DANGEROUS — NEAR MISS'));
      dw.appendChild(el('span', null, 'Your command matches a pattern that would alter or destroy evidence in a real session. Read the canonical command below carefully.'));
      body.appendChild(dw);
    }
    if (g.credit > 0 && g.credit < 0.999 && g.N > 1) {
      body.appendChild(el('p', 'fb-credit', 'Partial credit formula: max(0, (H − W) / N) → H=' + g.H + ' correct picks, W=' + g.W + ' wrong picks, N=' + g.N + ' items. Wrong picks cancel right picks.'));
    }
    if (ex.explain) {
      var p = el('p'); p.textContent = ex.explain; body.appendChild(p);
    }
    if (g.answerText) {
      var at = el('p', 'fb-credit'); at.appendChild(el('b', null, 'Correct answer: ')); at.appendChild(document.createTextNode(g.answerText));
      body.appendChild(at);
    }
    if (g.items && g.items.length) {
      var box = el('div', 'items');
      g.items.forEach(function (it) {
        var r = el('div', 'item st-' + it.st);
        r.appendChild(el('span', 'ist', fbIcon(it.st)));
        var c = el('span');
        c.appendChild(el('b', null, it.label));
        if (it.why) { c.appendChild(document.createTextNode(' — ' + it.why)); }
        r.appendChild(c);
        box.appendChild(r);
      });
      body.appendChild(box);
    }
    if (ex.type === 'terminal') {
      var t = ex.terminal;
      body.appendChild(el('p', 'fb-credit', 'Canonical command (copyable):'));
      var cw = el('div', 'copywrap');
      cw.appendChild(monoBlock([t.solution]));
      var cb = el('button', 'copybtn', 'Copy');
      cb.setAttribute('aria-label', 'Copy the canonical command');
      cb.addEventListener('click', function () {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t.solution); cb.textContent = 'Copied ✓'; }
          else { cb.textContent = 'Select it manually'; }
        } catch (e) { cb.textContent = 'Select it manually'; }
        setTimeout(function () { cb.textContent = 'Copy'; }, 1600);
      });
      cw.appendChild(cb);
      body.appendChild(cw);
      (t.solutionWhy || []).forEach(function (l) {
        var d = el('div', 'sl'); d.style.margin = '4px 0'; d.appendChild(hlLine(l)); body.appendChild(d);
      });
    }
    if (ex.study && g.credit < 0.999) {
      var st2 = el('div', 'study');
      st2.appendChild(el('b', null, 'What to study: '));
      st2.appendChild(document.createTextNode(ex.study));
      body.appendChild(st2);
    }
    if (S.hinted[ex.id]) { body.appendChild(el('p', 'fb-credit', 'Hint used: −0.10 credit applied to this exercise.')); }
    fb.appendChild(body);
    fb.hidden = false;
  }

  function onNext() {
    if (!S.locked) { return; }
    var wasReturn = S.returnTo === 'review';
    if (wasReturn) { S.returnTo = null; }
    if (S.idx < S.order.length - 1 && !wasReturn) {
      S.idx++;
      toState('RUNNING');
      renderCurrent();
    } else if (S.skipped.length > 0) {
      toState('RUNNING');
      showReview();
    } else {
      finishExam(false);
    }
  }

  function onSkip() {
    if (S.locked || S.screen !== 'exam') { return; }
    if (S.skipped.indexOf(S.cur.id) < 0) { S.skipped.push(S.cur.id); }
    if (S.returnTo === 'review') { S.returnTo = null; showReview(); return; }
    if (S.idx < S.order.length - 1) {
      S.idx++;
      renderCurrent();
    } else if (S.skipped.length > 0) {
      showReview();
    } else {
      finishExam(false);
    }
  }

  function onHint() {
    if (S.locked || S.screen !== 'exam' || S.hinted[S.cur.id]) { return; }
    S.hinted[S.cur.id] = true;
    var ab = $('#view-exam .block-a .bbody');
    if (ab) {
      var hp = el('div', 'study');
      hp.style.marginTop = '12px';
      hp.appendChild(el('b', null, '💡 Hint (−10% of this exercise credit): '));
      hp.appendChild(document.createTextNode(S.cur.hint || 'Re-read the scenario artefacts — the key detail is there.'));
      ab.appendChild(hp);
    }
    renderHeader();
  }

  /* ---------- review skipped screen ---------- */
  function showReview() {
    S.screen = 'review';
    showView('review');
    var v = $('#view-review'); v.innerHTML = '';
    var c = el('div', 'card');
    c.appendChild(el('h2', null, '⚠ Review skipped exercises'));
    c.appendChild(el('p', 'muted', 'You have ' + S.skipped.length + ' skipped exercise(s). You can go back and answer them now — the timer is still running — or submit the exam. Skipped-and-never-answered exercises are excluded from the score.'));
    S.skipped.forEach(function (id) {
      var ex = byId(id);
      var row = el('div', 'rev-row');
      row.appendChild(el('span', 'warn-ico', '⚠'));
      row.appendChild(el('b', null, 'Skipped'));
      row.appendChild(el('span', 'rt', ex.title));
      var b = el('button', 'btn small primary', 'Answer now');
      b.addEventListener('click', function () { answerFromReview(id); });
      row.appendChild(b);
      c.appendChild(row);
    });
    var sr = el('div', 'start-row');
    var sb = el('button', 'btn primary', 'Submit exam ✓');
    sb.addEventListener('click', function () { finishExam(false); });
    sr.appendChild(sb);
    sr.appendChild(el('span', 'muted', 'Once you submit, unanswered skipped exercises no longer count.'));
    c.appendChild(sr);
    v.appendChild(c);
    renderHeader();
    window.scrollTo(0, 0);
  }
  function answerFromReview(id) {
    S.returnTo = 'review';
    S.idx = S.order.indexOf(id);
    if (S.idx < 0) { S.idx = 0; }
    toState('RUNNING');
    S.screen = 'exam';
    showView('exam');
    renderCurrent();
  }

  /* ---------- results + site contract ---------- */
  function finishExam(timedOut) {
    if (S.screen === 'results') { return; }
    S.screen = 'results';
    S.timer.state = 'ENDED';
    renderTimerChip();
    stopTicker();
    showView('results');
    var v = $('#view-results'); v.innerHTML = '';
    var c = el('div', 'card');
    c.appendChild(el('h2', null, 'Exam results — ' + M.examTitle));
    var answered = S.answered;
    var percent = answered > 0 ? Math.round((S.sum / answered) * 100) : 0;
    var sc = el('p');
    sc.appendChild(el('b', null, (Math.round(S.sum * 10) / 10).toFixed(1) + ' / ' + answered));
    sc.appendChild(document.createTextNode(' answered · ' + percent + '%  (pass mark ' + M.passMark + '%)'));
    c.appendChild(sc);
    if (timedOut) { c.appendChild(el('p', 'muted', '⏹ The timer ended — the exam was submitted automatically. Unanswered and skipped exercises were excluded from the score.')); }
    var fc = 0, pc = 0, ic = 0, pcSum = 0;
    Object.keys(S.results).forEach(function (k) {
      var cr = S.results[k].credit;
      if (cr >= 0.999) { fc++; }
      else if (cr > 0) { pc++; pcSum += cr; }
      else { ic++; }
    });
    var skippedLeft = D.exercises.length - answered;
    var grid = el('div', 'resgrid');
    grid.appendChild(resCard('ok', '✓ Fully correct', fc));
    grid.appendChild(resCard('partial', '✓ Partially correct', pc, pc > 0 ? 'avg ' + (Math.round((pcSum / pc) * 100) / 100).toFixed(2) : null));
    grid.appendChild(resCard('bad', '✗ Fully incorrect', ic));
    grid.appendChild(resCard('skip', '⚠ Skipped — excluded', skippedLeft));
    c.appendChild(grid);
    var tr = el('div', 'times-row');
    tr.appendChild(metaItem('Time used', fmtClk(M.timerSec - S.timer.left)));
    tr.appendChild(metaItem('Paused manually', fmtClk(S.pauseManual)));
    tr.appendChild(metaItem('Paused for feedback', fmtClk(S.pauseAuto)));
    c.appendChild(tr);
    if (answered > 0 && percent >= M.passMark) {
      var pp = el('div', 'passpanel');
      pp.appendChild(el('div', 'big', '✓ PASS'));
      pp.appendChild(el('p', null, 'You reached ' + percent + '% — above the ' + M.passMark + '% pass mark. Well done: you showed command of ' + M.techId + ' at ' + M.sevWord + ' level.'));
      c.appendChild(pp);
    } else {
      var fp = el('div', 'failpanel');
      fp.appendChild(el('div', 'big', '✗ FAIL'));
      fp.appendChild(el('p', null, answered === 0 ? 'No exercise was answered, so the score is 0%. You must retake this exam.' : 'You reached ' + percent + '%, below the ' + M.passMark + '% pass mark. You must retake this exam — read the feedback you collected and try again.'));
      c.appendChild(fp);
    }
    var sr = el('div', 'start-row');
    var rb = el('button', 'btn primary', '↻ Retake exam');
    rb.setAttribute('aria-label', 'Retake the exam with reshuffled exercises');
    rb.addEventListener('click', function () { startExam(); });
    sr.appendChild(rb);
    c.appendChild(sr);
    v.appendChild(c);
    renderHeader();
    reportScore();
    window.scrollTo(0, 0);
  }
  function resCard(cls, lab, num, extra) {
    var d = el('div', 'rescard ' + cls);
    d.appendChild(el('div', 'num', String(num)));
    var l = el('div', 'lab', lab + (extra ? ' — ' + extra : ''));
    d.appendChild(l);
    return d;
  }
  function reportScore() {
    if (S.reported) { return; }
    S.reported = true;
    var percent = S.answered > 0 ? Math.round((S.sum / S.answered) * 100) : 0;
    try {
      if (!window.parent || window.parent === window) { return; } /* opened directly: no parent to report to */
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: M.topicId,
        batch: M.batch,
        score: Math.round(S.sum),
        total: S.answered,
        percent: percent,
        passed: percent >= M.passMark
      }, location.origin);
    } catch (e) { /* opened directly, nothing to report to */ }
  }

  /* ---------- site handshake (dark-only file: theme field is accepted, never acted on) ---------- */
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || (d.type !== 'CYBERPULSE_INIT' && d.type !== 'CYBERMASTERY_INIT')) { return; }
    S.init.username = d.username || '';
    S.init.country = d.country || '';
    S.init.locale = d.locale || 'en';
    if (S.screen === 'intro') { buildIntro(); }
  });

  /* ---------- wire up ---------- */
  document.addEventListener('DOMContentLoaded', function () {
    $('#bt-pause').addEventListener('click', onPause);
    $('#bt-hint').addEventListener('click', onHint);
    $('#bt-skip').addEventListener('click', onSkip);
    $('#pv-resume').addEventListener('click', onPause);
    buildIntro();
  });

  function onPause() {
    if (S.screen !== 'exam' && S.screen !== 'review') { return; }
    if (S.timer.state === 'ENDED') { return; }
    if (S.timer.state === 'PAUSED_MANUAL') {
      S.timer.state = S.timer.resumeBack || 'RUNNING';
      S.timer.resumeBack = null;
      $('#pauseveil').classList.remove('on');
      renderTimerChip();
      return;
    }
    S.timer.resumeBack = S.timer.state;
    S.timer.state = 'PAUSED_MANUAL';
    $('#pv-title').textContent = 'PAUSED — manual (press Resume)';
    $('#pv-text').textContent = S.timer.resumeBack === 'PAUSED_AUTO_CHECK'
      ? 'You paused while reviewing feedback. Resume to return to the explanation — the timer stays stopped until you press Next.'
      : 'The timer is stopped and the exercise is hidden. Take a real break — the exam waits for you.';
    $('#pauseveil').classList.add('on');
    renderTimerChip();
  }
})();

</script>
</body>
</html>
