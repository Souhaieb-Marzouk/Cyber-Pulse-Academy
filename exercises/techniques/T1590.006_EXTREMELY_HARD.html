.fb-b{padding:12px 16px}
.fb .answer-line{font-size:14.5px;margin:0 0 8px}
.items{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.it{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:8px 12px}
.it .i{font-weight:800;white-space:nowrap}
.it .i.ok{color:var(--state-correct)} .it .i.bad{color:var(--state-incorrect)} .it .i.miss{color:var(--state-skipped)} .it .i.danger{color:var(--state-incorrect)}
.it .w{color:var(--text-secondary)}
.expl{font-size:14.5px;border-top:1px dashed var(--border);padding-top:10px;margin-top:10px}
.expl p{margin:6px 0}
.copyblk{position:relative;margin:8px 0}
.copyblk pre{background:var(--bg-deep);border:1px solid var(--border-strong);border-radius:var(--radius);padding:12px 14px;color:var(--text-mono);font-family:var(--font-mono);font-size:14px;white-space:pre-wrap;word-break:break-word}
/* ---------- paused veil ---------- */
.veil{position:absolute;inset:0;background:var(--veil-bg);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:40;border-radius:var(--radius)}
.veil-card{text-align:center;padding:30px}
.veil-card .pi{font-size:44px;color:var(--state-paused)}
.veil-card .pw{color:var(--state-paused);font-weight:800;font-size:17px;letter-spacing:.05em}
.veil-card .ps{color:var(--text-secondary);font-size:13.5px;margin-top:6px}
/* ---------- review skipped ---------- */
.rev-item{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-surface-2);padding:12px 14px;margin:10px 0}
.rev-item .t{flex:1}
.rev-item .t b{display:block}
.rev-item .t span{color:var(--text-secondary);font-size:13.5px}
.rev-clock{font-size:13.5px;color:var(--text-secondary);margin:2px 0 10px}
.rev-clock b{color:var(--text-primary)}
/* ---------- results ---------- */
.res-hero{padding:26px 22px;text-align:center;position:relative;overflow:hidden}
.res-hero .big{font-size:52px;font-weight:800;margin:6px 0}
.res-hero.pass{border-color:var(--state-correct)}
.res-hero.pass:before{content:"";position:absolute;inset:0;background:radial-gradient(600px 200px at 50% 0%,var(--tint-green-12),transparent);pointer-events:none}
.res-hero.fail{border-color:var(--state-incorrect)}
.res-hero .lbl{font-size:20px;font-weight:800;letter-spacing:.12em}
.res-hero.pass .lbl{color:var(--state-correct)} .res-hero.fail .lbl{color:var(--state-incorrect)}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:13px;color:var(--text-secondary)}
.stat.ok .v{color:var(--state-correct)} .stat.part .v{color:var(--state-partial)} .stat.bad .v{color:var(--state-incorrect)} .stat.skip .v{color:var(--state-skipped)} .stat.pause .v{color:var(--state-paused)}
.res-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.res-row{display:flex;gap:10px;align-items:baseline;font-size:14px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:8px 12px}
.res-row .st{font-weight:700;white-space:nowrap}
.res-row .st.ok{color:var(--state-correct)} .res-row .st.part{color:var(--state-partial)} .res-row .st.bad{color:var(--state-incorrect)} .res-row .st.skip{color:var(--state-skipped)}
.res-row .cr{margin-left:auto;font-family:var(--font-mono);font-size:13px;color:var(--text-secondary)}
.center{text-align:center}
@media (max-width:720px){
  .xhead-in{gap:6px 10px}
  .mrow{grid-template-columns:1fr}
  .intro-title{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  .prog-fill:after{animation:none}
  *{transition:none!important}
}

<script>
"use strict";
var EXAM = {"severity":"EXTREMELY HARD","attckId":"T1590.006","attckName":"Network Security Appliances","intro":{"learn":["<p>This exam trains you on a <b>Sub-Technique of the MITRE ATT&amp;CK framework<\/b>: <b>T1590.006 — Gather Victim Network Information: Network Security Appliances<\/b>. It belongs to the <b>Reconnaissance<\/b> tactic (TA0043), and its platform is <b>PRE<\/b> — the pre-attack phase, before an adversary touches any of your systems. Here the adversary studies your defensive hardware: your firewalls, content filters, proxies and bastion hosts, and your network intrusion detection systems (NIDS). They want to know what stands between them and the network, so they can plan around it.<\/p>","<p>You will meet this behaviour in real work: triaging edge probes in the SIEM, writing cyber-threat-intelligence (CTI) profiles, hunting quiet scanners, tuning detection rules, planning red-team reconnaissance, and reviewing external exposure with governance, risk and compliance (GRC) colleagues. The documents you will touch are threat-intel reports, ATT&amp;CK matrix pages, risk registers and change tickets; the tools are the SIEM (Veridian Health's CoreSight), scanning platforms and asset registers. The exercises use the Veridian Health universe: edge firewall VH-FW-EDGE, tickets #43xxx, analysts Omar Haddad and Lena Fischer.<\/p>","<p>The sixteen exercises drill senior decisions. You will resolve a criminal-forum leak that is half stale and half live (campaign C0063), separate a ticketed internal scan from a quiet external probe, sequence an evidence-preserving response under a ten-minute CISO deadline, and decide when to hold instead of act. You will map the adversary chain into its next stages — Search Open Technical Databases (T1596), Obtain Capabilities (T1588) and External Remote Services (T1133) — turn the G1017 Volt Typhoon pre-compromise pattern into a watchlist, and read detection strategy DET0889 / analytic AN2021 honestly.<\/p>","<p>Why it matters: you cannot stop someone reading what you expose. Mitigation M1056 Pre-compromise means shrinking what you publish and watching where reconnaissance lands. Master this sub-technique and you will spend less time surprised by first footholds, and more time proving — with evidence that survives scrutiny — exactly how an adversary studied the doors before trying one.<\/p>"],"keywords":[{"theme":"Appliance classes under recon","items":["firewalls","content filters","proxies and bastion hosts","network intrusion detection systems (NIDS)"]},{"theme":"Collection vectors of T1590.006","items":["Active Scanning (T1595)","Phishing for Information (T1598)","Search Victim-Owned Websites (T1594)"]},{"theme":"Next stages the recon enables","items":["Search Open Technical Databases (T1596)","Search Open Websites/Domains (T1593)","Develop Capabilities (T1587)","Obtain Capabilities (T1588)","External Remote Services (T1133)"]},{"theme":"Detection and mitigation frame","items":["DET0889","AN2021","false-positive rate","M1056 Pre-compromise","Initial Access"]},{"theme":"Campaigns and senior calls","items":["C0063","Volt Typhoon (G1017)","T1590.006","Reconnaissance (TA0043)","evidence preservation"]}]},"exercises":[{"id":"e01","type":"steps","title":"C0063 forum paste: half stale, half live","scenario":"<p>Sunday 06:12. CoreSight's threat-intel relay flags a criminal-forum thread tracked as campaign <b>C0063 (2025 Poland Wiper Attacks)<\/b>: members are trading perimeter-device configuration details of European health-sector victims. The paste names <code>vh-edge-2024.conf<\/code> and reads like Veridian Health's own edge firewall. CISO Devi Rao wants a decision in 10 minutes; the board reads a briefing at 08:00. The dump looks stale — change #43550 upgraded VH-FW-EDGE firmware in January — but nobody has ever checked what the paste gets right. Omar Haddad holds a read-only audit account on the appliance.<\/p>","artefacts":[{"label":"SOC bridge, 06:12-06:20","kind":"chat","body":["Devi Rao (CISO): Omar — forum paste looks like our edge. Board briefing 08:00. Decision in 10 minutes.","Omar Haddad: On it. First move is a read-only diff, nothing changes on the device.","Marek Dutko (duty mgr): Clinics are quiet now; a failover test window exists at 22:00 if you need one.","Devi Rao (CISO): Legal will ask whether the evidence survives scrutiny. Assume it must."]},{"label":"Criminal-forum thread (CTI relay, campaign C0063)","kind":"text","body":"<p><b>Thread:<\/b> 'perimeter configs — EU health sector (fresh drop)'<br/><b>Paste:<\/b> hxxp://paste[.]share/vh-edge-2024.conf — SSL-VPN portal 203[.]0[.]113[.]10:443, FortiGate 100F, firmware 7.2.3, two admin accounts, 'no source restrictions'.<br/><b>Reply:<\/b> 'these circulate every spring; wiper crews shopped this batch' — the relay tags the thread to campaign C0063 (2025 Poland Wiper Attacks), known for obtaining victim Fortinet perimeter configuration details.<\/p>"},{"label":"Change record #43550 — VH-FW-EDGE","kind":"table","head":["Field","Value"],"rows":[["Change","Firmware upgrade 7.2.3 to 7.2.5"],["Executed","11 Jan, 01:00-03:00, vendor-led"],["SSL-VPN portal scope after upgrade","NOT RECORDED"],["Owner of the vhsvc_maint account","(blank in the CMDB)"]]},{"label":"ATT&CK excerpt — T1590.006","kind":"attack","body":"T1590.006 — Gather Victim Network Information: Network Security Appliances\nAdversaries gather information about the victim's network security appliances: existence and specifics of deployed firewalls, content filters, proxies / bastion hosts, and network intrusion detection systems (NIDS).\nTactic: Reconnaissance (TA0043)   Platform: PRE"},{"label":"Weekend facilities digest (noise)","kind":"text","body":"<p>Car-park B resurfacing Sat 14 - Sun 15 Mar. Staff flu clinic continues in Hall 2. Cafeteria: Sunday roast from 12:00.<\/p>"}],"question":"Walk the three decisions in order.","hint":"Two facts are in conflict and only one source settles them — the device itself, read-only.","explanation":"<p>The conflict — stale firmware, live portal — can only be settled against the device itself, read-only, before any blocking action. Once the exposure proved live, the least costly safe move was a planned restriction plus a watch for the stage appliance recon actually feeds: External Remote Services (T1133). When the watch fired, the ticket separated the proven part (T1590.006 recon) from the suspected part (T1133) instead of jumping to 'compromised' or to attribution. Taking the edge offline or posting undercover would have spent cost and risk on an unconfirmed rumour, and a customer notice would have re-published the fingerprint. Campaign IDs like C0063 describe behaviour we can compare against, not proof of who is acting.<\/p><p><b>Study this:<\/b> T1590.006 (Network Security Appliances), its next stage External Remote Services (T1133), and M1056 Pre-compromise minimisation.<\/p>","steps":[{"question":"The CISO call starts now. What do you do first?","options":[{"t":"Take VH-FW-EDGE offline until the source is found","why":"You would force fourteen clinic sites onto failover to test a rumour."},{"t":"Block the forum's address range at the edge","why":"The paste already left; blocking the forum stops no collection."},{"t":"Diff the live read-only config against the paste","correct":true,"why":"Only device-side truth settles whether the leak is stale, and a read-only diff changes nothing."},{"t":"Reply in the thread posing as a buyer","why":"Undercover contact is an operational-security and legal decision, not a triage move."}],"advance":"<p>The read-only diff runs in four minutes. Firmware is 7.2.5 — the paste's 7.2.3 is stale. But the SSL-VPN portal is still reachable on 203[.]0[.]113[.]10:443 with no source-range restriction, so half of the leak is still true.<\/p>"},{"question":"Half-true leak, live exposure, clinics online. What do you recommend?","options":[{"t":"Emergency change now; clinics lose remote imaging uploads overnight","why":"Defensible with signs of active exploitation — none exist yet, so the downtime is unpaid-for."},{"t":"Book the restriction change and open a 72-hour portal watch","correct":true,"why":"It fixes the live exposure at bounded cost and starts looking for the next stage instead of guessing."},{"t":"Publish a customer notice naming the appliance model and firmware","why":"That re-leaks to every reader exactly what C0063-style collectors want."},{"t":"Close it: the stale firmware voids the whole paste","why":"Stale firmware does not void a still-live portal exposure."}],"advance":"<p>Devi takes the watch-plus-window plan; ticket #43688 opens the 72-hour watch. Night two, 04:52, CoreSight raises a medium alert on the SSL-VPN portal.<\/p>"},{"question":"The watch fires: 240 failed MFA pushes, then one success at 04:52 from an unfamiliar network. How do you frame ticket #43688?","options":[{"t":"Confirmed: the edge appliance is compromised by an actor","why":"One success from an unfamiliar network is not yet proof of appliance compromise; overclaiming burns credibility at 08:00."},{"t":"Benign lockout storm; close the watch and keep the chart","why":"A success after 240 failures is not a lockout pattern."},{"t":"Attribute tonight's activity to the C0063 actors","why":"C0063 describes behaviour to compare against, not proof of who is on the keyboard."},{"t":"T1590.006 confirmed, T1133 suspected — preserve, notify IR","correct":true,"why":"It states what is proven, what is suspected, and starts the actions that keep every option open."}],"advance":"<p>The debrief records the path you took; the Check button grades all three steps together.<\/p>"}]},{"id":"e02","type":"blank","title":"Map case #43671 for the shift handover","scenario":"<p>Omar must finish the CoreSight case #43671 mapping line before the 10-minute handover. The night shift pastes that line into three reports, and Devi quotes it to the board, so the tactic, technique ID, platform and the next-stage watch must be exact. Lena reminds him where the sibling boundary sits: this case is about what outsiders learned about the defensive appliances themselves — not about how the network is arranged, and not about address ranges. The mapping draft still has four gaps.<\/p>","artefacts":[{"label":"Case #43671 — handover draft (gaps marked [1]-[4])","kind":"code","body":"CASE #43671 — perimeter exposure — shift handover\nSummary: adversary-side recon of Veridian's defensive appliances\n  sources: forum paste (C0063-tagged), portal banner, six-day probes\nMapping: tactic [1] | technique [2] | platform [3]\nNext stage to watch: [4] — portal sign-ins, watch #43688\nOwner: Omar Haddad — confidence: (pending IR case #43701)"},{"label":"Sibling contrast — the T1590 family","kind":"table","head":["Technique","Focus","Status in #43671"],"rows":[["T1590.006","Defensive appliances: firewalls, content filters, proxies and bastion hosts, network intrusion detection systems (NIDS)","this case"],["T1590.004","Network Topology — how networks are arranged","sibling, not this case"],["T1590.005","IP Addresses — address ranges in use","sibling, not this case"],["Not assessed in #43671","DNS (T1590.002) and trust dependencies (T1590.003) — no data collected","(gap — say so in the handover)"]]},{"label":"Handover thread","kind":"chat","body":["Lena Fischer: Handover in 10 — the mapping line must be exact; the night shift pastes it into three reports.","Devi Rao (CISO): And keep tactic and platform right; the board pack quotes the line verbatim.","Omar Haddad: Writing it now — appliance identity, not topology, not IP ranges."]},{"label":"Cafeteria menu, week 12 (noise)","kind":"text","body":"<p>Mon lentil soup · Tue swedish meatballs · Wed grill day · Thu curry · Fri fish. Salad bar returns in April.<\/p>"}],"question":"Fill the four gaps so the handover mapping line is exact.","hint":"The case is scoped to what outsiders learned about the defensive appliances themselves — the siblings for address ranges and layout are deliberately out of scope.","explanation":"<p>The mapping line has to name the appliance-focused sub-technique (T1590.006) under Reconnaissance (TA0043) on platform PRE, because the case is about what outsiders learned about the defensive appliances themselves. The siblings fail on scope: T1590.004 is about how the network is arranged and T1590.005 about address ranges — neither is what the paste and banners reveal. Platform PRE states plainly that the adversary acted before touching Veridian systems. The watch line points at External Remote Services (T1133), the stage this recon most directly feeds — which is why a 72-hour portal watch, not a firewall change, is the recorded next step. Initial Access (TA0001) would be the mapping after a confirmed foothold, not for the study that preceded it.<\/p><p><b>Study this:<\/b> the T1590 sibling set (.001-.005) and how each differs from the appliance focus of T1590.006.<\/p>","blanks":[{"label":"Tactic [1]","accept":["reconnaissance","recon"],"why":"Studying the victim's defences before any attack action sits in Reconnaissance (TA0043)."},{"label":"Technique ID [2]","accept":["t1590.006"],"why":"The appliance-focused sub-technique is T1590.006 — not its topology or IP-address siblings."},{"label":"Platform [3]","accept":["pre"],"why":"The activity happens before the adversary touches Veridian systems — platform PRE."},{"label":"Next stage to watch [4]","accept":["t1133","external remote services"],"why":"Appliance recon most directly feeds External Remote Services (T1133), the exposed portal."}],"bank":["Reconnaissance","T1590.006","PRE","T1133","Initial Access","T1590.004","TA0001","POST"]},{"id":"e03","type":"multi","title":"Red-team OSINT sweep of Veridian's published surface","scenario":"<p>Authorised tabletop, attacker perspective: the contracted red team may not touch the network at all. Their job is to show the CISO how much defensive-appliance detail an outsider can collect passively — the collection surface T1590.006 lives on, and the surface M1056 Pre-compromise says to shrink. They sweep only what Veridian itself publishes or exposes: careers pages, portal banners, block pages. Omar will turn their findings into the minimisation backlog; Devi asks 'how bad is it?' in today's stand-up. The team returns five findings; not all of them belong to this problem.<\/p>","artefacts":[{"label":"Careers page — 'Network Security Engineer, Veridian Health'","kind":"text","body":"<p>'You will administer our FortiGate firewalls and Palo Alto edge platform, own our content-filter policy, and run vendor maintenance through our bastion.' Posted 2 Feb.<\/p>"},{"label":"Banner-grab sheet (external, passive)","kind":"table","head":["Target","What it shows"],"rows":[["SSL-VPN portal 203[.]0[.]113[.]10","Header: 'FortiGate 100F — firmware 7.2.5'"],["Guest Wi-Fi block page","'Filtered by Veridian Content Filter (vh-cf-01)'"],["Portal login error page","'Connection via VH-PROXY-01 denied — policy 12'"],["Exposed since","(not recorded by the team)"]]},{"label":"Marketing-site access log (noise)","kind":"log","body":"203[.]0[.]113[.]77 - GET /careers 200\n198[.]51[.]100[.]9 - GET /about 200\n203[.]0[.]113[.]77 - GET /news/press 200\n198[.]51[.]100[.]9 - GET /robots.txt 200"},{"label":"Stand-up thread","kind":"chat","body":["Devi Rao (CISO): How bad is it — one line.","Omar Haddad: Enough to fingerprint three appliance classes from public data alone.","Sven Kroll (net lead): The job post is mine. I will rewrite it today."]}],"question":"Select all that apply: which findings go on the M1056 minimisation backlog?","hint":"The red team never touched the network — every correct item is something Veridian published or exposed on purpose.","explanation":"<p>Every correct item is a fact about a defensive appliance that Veridian published or exposed deliberately — the collection surface T1590.006 describes and M1056 Pre-compromise says to shrink. The job post hands over appliance classes and the maintenance path; the portal banner gives make, model and firmware; the block page confirms the content filter and its internal hostname. The brochure-style press lines and the crawler traffic describe products and generic interest, not defences — that is the noise. The red team proved the point without touching the network, which is exactly why these items belong on a minimisation backlog rather than a patch queue.<\/p><p><b>Study this:<\/b> M1056 Pre-compromise and the Search Victim-Owned Websites (T1594) collection vector.<\/p>","options":[{"t":"The job post naming firewall vendors and the bastion","correct":true,"why":"It advertises appliance classes and the maintenance path to every reader — prime M1056 minimisation."},{"t":"The portal banner with make, model and firmware","correct":true,"why":"Exactly the appliance specifics T1590.006 describes, collected for free from a banner."},{"t":"The block page revealing the content-filter hostname","correct":true,"why":"It confirms the content filter's existence and internal hostname from outside."},{"t":"The patient-app brochure and press release","why":"Product marketing says nothing about defensive appliances."},{"t":"The crawler lines in the marketing-site log","why":"Generic crawling is noise here — it selected and revealed no appliance detail."}]},{"id":"e04","type":"qcm","title":"Loud ticketed scan vs quiet external probe","scenario":"<p>Tuesday 03:00-04:00: CoreSight logs a loud SYN burst against the 10[.]91[.]100[.]0/24 management VLAN from VH-SCAN-01 (10[.]91[.]44[.]7). Approved change #43602 covers a quarterly vulnerability scan — source, scope and window all match. The same week, a different pattern sits quietly underneath: 20-30 packets per hour, six days running, from 45[.]83[.]220[.]17, touching only 443, 22 and 8443 on the appliance management addresses. Devi wants one line for the 10-minute call: are we being scanned, and does anything change tonight? Sven votes to 'just block the range'; legal asks what a block would do to the evidence picture.<\/p>","artefacts":[{"label":"CoreSight — edge probe log, merged view","kind":"logview","body":"2025-03-11T03:00:12Z VH-SCAN-01 10[.]91[.]44[.]7 -> 10[.]91[.]100[.]23 SYN sweep change=43602 approved\n2025-03-11T03:00:40Z VH-SCAN-01 10[.]91[.]44[.]7 -> 10[.]91[.]100[.]31 SYN sweep change=43602 approved\n2025-03-11T03:01:02Z VH-SCAN-01 10[.]91[.]44[.]7 -> 10[.]91[.]100[.]44 SYN sweep change=43602 approved\n2025-03-11T03:02:55Z 45[.]83[.]220[.]17 -> 203[.]0[.]113[.]10:443 SYN rate=low\n2025-03-11T03:14:10Z 45[.]83[.]220[.]17 -> 203[.]0[.]113[.]10:8443 SYN rate=low\n2025-03-11T04:40:02Z 198[.]51[.]100[.]9 -> vh-veridian[.]com GET /news (crawler)\n2025-03-12T02:58:33Z 45[.]83[.]220[.]17 -> 203[.]0[.]113[.]10:443 SYN rate=low\n2025-03-12T03:00:05Z VH-SCAN-01 10[.]91[.]44[.]7 -> 10[.]91[.]100[.]23 SYN sweep change=43602 approved\n2025-03-13T01:22:47Z 45[.]83[.]220[.]17 -> 203[.]0[.]113[.]10:22 SYN rate=low\n2025-03-14T23:41:19Z 45[.]83[.]220[.]17 -> 203[.]0[.]113[.]10:8443 SYN rate=low\n2025-03-15T04:10:36Z 45[.]83[.]220[.]17 -> 203[.]0[.]113[.]10:443 SYN rate=low\n2025-03-16T03:07:54Z VH-SCAN-01 10[.]91[.]44[.]7 -> 10[.]91[.]100[.]23 SYN sweep change=43602 approved"},{"label":"Change #43602 — approved scope","kind":"table","head":["Field","Value"],"rows":[["Source","VH-SCAN-01 (10[.]91[.]44[.]7)"],["Scope","10[.]91[.]100[.]0/24 management VLAN"],["Window","Tuesdays 03:00-04:00"],["External sources in scope","none recorded"]]},{"label":"10-minute bridge","kind":"chat","body":["Devi Rao (CISO): Are we being scanned? One line — and does anything change tonight?","Sven Kroll (net lead): Block 45[.]83[.]220[.]0/24 at the edge, done in five minutes.","Omar Haddad: Give me the log check first; a block burns our visibility for no gain.","Petra Vogt (legal): If we touch the edge tonight, does the evidence picture survive?"]},{"label":"CoreSight 12.4 release notes (noise)","kind":"text","body":"<p>Release 12.4: faster dashboards, new licence portal, dark-mode charts. No behaviour changes to alerting. (Unrelated to case #43671.)<\/p>"}],"question":"What is the one line for Devi's 10-minute call?","hint":"Three facts decide this — the source, the port set, and what change #43602 actually covers; one of the three breaks the shortcut.","explanation":"<p>Two signals share one week, and only the approved scope separates them. The loud burst matches change #43602 on source, scope and window, so it is the scanner doing its ticketed job — not an incident. The quiet pattern matches nothing approved: one external range, only appliance management ports, six days — that is Active Scanning (T1595) in service of appliance recon (T1590.006). Blocking feels decisive but buys nothing: the collector simply changes range, and Veridian loses the telemetry it is using to understand the campaign, which is why the correct line holds the block and keeps capture. 'Background noise' is wrong for a different reason — noise does not select ports with this much care and stay on them for six days.<\/p><p><b>Study this:<\/b> Active Scanning (T1595) telemetry versus approved scan scopes, and the high false-positive profile of DET0889 / AN2021.<\/p>","options":[{"t":"No — everything this week is the ticketed quarterly scan; close unmapped","why":"The ticket names the internal source and scope; the external probes match neither."},{"t":"No — low-rate probes are internet background noise; log nothing","why":"Background noise does not pick exactly appliance management ports and stay on them for six days."},{"t":"Yes — the quiet external probe is the recon signal; block nothing, keep capture","correct":true,"why":"Source, scope and window rule out the scanner; a six-day, port-selective, low-rate probe is targeted recon, and blocking would burn visibility for no gain."},{"t":"Yes — VH-SCAN-01 is compromised; isolate it and freeze scans","why":"True in a world where the burst had no matching change; here source, scope and window all match the approval."}]},{"id":"e05","type":"match","title":"Fingerprint five appliance classes from one bundle","scenario":"<p>For the change advisory board (CAB), Sven asks Omar to prove a point with one capture: which defensive appliance classes does the outside world actually see? A single CoreSight triage bundle is enough — portal header, block page, proxy CONNECT lines, NIDS signature hits, a port-22 banner. Each line fingerprints one class. Devi wants the CAB slide to name classes, not products, 'so we stop feeding the collectors'. Lena notes the asset register is incomplete, and decides the gap itself goes on the slide.<\/p>","artefacts":[{"label":"CoreSight — triage bundle 2025-03-17","kind":"logview","body":"2025-03-17T08:12:04Z portal-header SSL-VPN service banner: FortiGate 100F\n2025-03-17T08:14:47Z guest-wifi block page: Filtered by Veridian Content Filter (vh-cf-01)\n2025-03-17T08:21:33Z proxy CONNECT vh-proxy-01 ALLOW 10[.]91[.]31[.]9 -> updates[.]vendor[.]com:443\n2025-03-17T08:22:10Z proxy CONNECT vh-proxy-01 DENY 10[.]91[.]31[.]14 -> paste[.]site:80\n2025-03-17T08:30:19Z nids vh-nids-02 sig=2010987 ET-scan hit on span of edge VLAN\n2025-03-17T08:31:02Z nids vh-nids-02 sig=2011565 portscan hit on span of edge VLAN\n2025-03-17T08:35:51Z banner 22/tcp VH-BASTION-01 'authorised vendor maintenance only'\n2025-03-17T08:36:44Z banner 22/tcp VH-BASTION-01 cipher=aes256-gcm@openssh"},{"label":"Asset register extract — the gaps are the point","kind":"table","head":["Asset","Class","Owner"],"rows":[["VH-FW-EDGE","Edge firewall","Sven Kroll"],["vh-cf-01","Content filter","(not recorded)"],["vh-proxy-01","Forward proxy","Sven Kroll"],["vh-nids-02","NIDS sensor","(not recorded)"],["VH-BASTION-01","Bastion host","vendor contract, holder unclear"]]},{"label":"CAB prep thread","kind":"chat","body":["Sven Kroll (net lead): One bundle, five classes — name them for the slide, no product names.","Devi Rao (CISO): And show the register gaps; the board funds fixes, not vibes.","Lena Fischer: I put the unowned sensors on the slide on purpose."]},{"label":"Radiology PACS bulletin (noise)","kind":"text","body":"<p>Saturday maintenance 22:00-02:00; archives read-only during the window. Clinics unaffected. (Not related to the appliance review.)<\/p>"}],"question":"Match each captured line to the appliance class it fingerprints.","hint":"Two register rows have no owner — that gap is part of the slide, not a reason to drop a class.","explanation":"<p>Each line fingerprints exactly one appliance class, and the board asked for classes, not products. The portal header proves the edge firewall, the block page the content filter, the CONNECT lines the forward proxy, the signature hits the NIDS, and the port-22 banner the bastion host. The decoy classes fail on absence: no honeypot is deployed at Veridian and no mail line appears in the bundle. The unowned register rows are not a detail — an appliance without an owner is how an exposure survives three quarterly reviews, which is why Lena puts the gap on the slide. One capture, read carefully, is a whole exposure map.<\/p><p><b>Study this:<\/b> the appliance classes T1590.006 names — firewalls, content filters, proxies and bastion hosts, network intrusion detection systems (NIDS) — and your own asset register's gaps.<\/p>","pairs":[{"l":"Portal header 'FortiGate 100F — SSL-VPN service'","r":"Edge firewall","why":"The SSL-VPN service banner identifies the perimeter firewall itself."},{"l":"Block page 'Filtered by Veridian Content Filter (vh-cf-01)'","r":"Content filter","why":"The block page proves a content filter and leaks its hostname."},{"l":"CONNECT vh-proxy-01 ALLOW 10[.]91[.]31[.]9","r":"Forward proxy","why":"CONNECT lines are the signature of a forward proxy in the path."},{"l":"vh-nids-02 sig 2010987 ET-scan on the edge-VLAN span","r":"NIDS","why":"Signature hits on a monitored span are the NIDS at work."},{"l":"Banner on 22/tcp: VH-BASTION-01, vendor maintenance only","r":"Bastion host","why":"A dedicated maintenance banner marks the bastion host."}],"decoys":[{"r":"Honeypot","why":"No honeypot is deployed at Veridian; nothing in the bundle pretends to be one."},{"r":"Mail security gateway","why":"Mail filtering is a different stack; no mail line appears in the bundle."}]},{"id":"e06","type":"dragdrop","title":"Tabletop: the adversary chain from recon to foothold","scenario":"<p>Lena builds the tabletop walkthrough 'from the adversary's chair': using only what the C0063-style forum trade and Veridian's own exposures provide, the room reconstructs the chain from appliance recon to a first foothold. Constraint for the room: the forum thread offers a ready-made SSL-VPN exploit for sale — nobody in this story develops anything. The board wants the chain in ATT&amp;CK language, so the same five stages reappear in every future exercise, with the blind-spot column left honest.<\/p>","artefacts":[{"label":"ATT&CK excerpt — T1590.006 collection and enablement","kind":"attack","body":"T1590.006 — Network Security Appliances\nCollection: direct actions via Active Scanning (T1595) or Phishing for Information (T1598); exposed via online or accessible data sets, e.g. Search Victim-Owned Websites (T1594).\nEnables: other recon (Search Open Technical Databases T1596, Search Open Websites/Domains T1593), establishing operational resources (Develop Capabilities T1587, Obtain Capabilities T1588), and initial access via External Remote Services (T1133)."},{"label":"Forum thread — the constraint","kind":"text","body":"<p><b>Seller:<\/b> 'FortiGate SSL-VPN pre-auth — working build, EUR 15k, buyer tests on your own targets.'<br/><b>Relay note:<\/b> thread tagged C0063-adjacent; the sale, not the code, is the tabletop fact.<\/p>"},{"label":"Tabletop room brief","kind":"chat","body":["Lena Fischer: Five slots, one chip each; the chain must run clean from recon to foothold.","Devi Rao (CISO): If a stage is invisible to us, say so — the board needs our blind spots, not a perfect story.","Sven Kroll (net lead): The 'develop it yourself' chip stays off — the thread sells it."]},{"label":"Victim visibility per stage — the gap column is real","kind":"table","head":["Stage","Victim visibility"],"rows":[["Active Scanning T1595","visible as edge probes (case #43671)"],["Search Victim-Owned Websites T1594","visible only if we audit our own pages"],["Search Open Technical Databases T1596","(outside victim visibility)"],["Obtain Capabilities T1588","(outside victim visibility)"],["External Remote Services T1133","visible as portal sign-ins (watch #43688)"]]},{"label":"CoreSight storage-quota report (noise)","kind":"text","body":"<p>Index retention 90 days; cold tier 4% free; archive job green. No action required for this exercise.<\/p>"}],"question":"Drag each stage chip onto the slot it completes — the sold-exploit constraint decides slot four.","hint":"Read the seller line again: the exploit is bought, not built.","explanation":"<p>The chain runs: probe the appliances directly (Active Scanning T1595), read what Veridian published about them (Search Victim-Owned Websites T1594), enrich with technical-database lookups (Search Open Technical Databases T1596), acquire the ready-made exploit (Obtain Capabilities T1588), and land on the exposed portal (External Remote Services T1133). The 'develop it yourself' chip fails on the room's own constraint — the thread sells a working build, so nothing is developed. T1566 phishing fails on the tactic boundary: this chain has no delivery message at all; the recon-family elicitation would be Phishing for Information (T1598), and even that is not in this story. Two of the five stages sit outside victim visibility, which is the board's real lesson: you cannot watch what never touches you, so you watch where it lands.<\/p><p><b>Study this:<\/b> the enablement sentence on T1590.006 — T1596 / T1593, then T1587 / T1588, then T1133.<\/p>","slots":[{"label":"Direct collection vector","accept":"a1","why":"Probing the appliances directly is Active Scanning (T1595)."},{"label":"Open data the victim published","accept":"a2","why":"Victim-owned pages exposing appliance details map to Search Victim-Owned Websites (T1594)."},{"label":"Other recon stage enabled next","accept":"a3","why":"Technical-database lookups about the appliance stack are Search Open Technical Databases (T1596)."},{"label":"Operational resources stage","accept":"a4","why":"Buying the ready-made exploit is Obtain Capabilities (T1588) — the thread, not a lab, is the source."},{"label":"Initial access stage","accept":"a5","why":"Logging into the exposed SSL-VPN is External Remote Services (T1133)."}],"chips":[{"k":"a1","t":"Active Scanning (T1595)","why":"Direct probing of appliance ports is the direct collection vector."},{"k":"a2","t":"Search Victim-Owned Websites (T1594)","why":"Careers pages and portals are victim-owned surfaces that leak appliance detail."},{"k":"a3","t":"Search Open Technical Databases (T1596)","why":"Technical databases about the stack sit between recon and operations."},{"k":"a4","t":"Obtain Capabilities (T1588)","why":"The thread sells the exploit; acquiring it is Obtain Capabilities."},{"k":"a5","t":"External Remote Services (T1133)","why":"The exposed SSL-VPN is the remote service the chain lands on."},{"k":"d1","t":"Develop Capabilities (T1587)","why":"Defensible if no exploit existed to buy — the room's constraint says one is for sale, so T1587 stays off the board."},{"k":"d2","t":"Phishing (T1566)","why":"T1566 is delivery phishing for initial access; the recon-family elicitation is T1598, and this chain has no phishing at all."}]},{"id":"e07","type":"terminal","title":"Preserve VH-FW-EDGE configuration evidence","scenario":"<p>Day two, 09:40. Legal counsel Petra Vogt: 'If this becomes an incident, the evidence must survive scrutiny — chain of custody, no state changes.' Devi gives Omar ten minutes. VH-FW-EDGE is live; fourteen clinic sites route through it; a reboot or reset would wipe in-memory session and NAT state and force failover. Omar sits at the forensic jumphost vh-jump-01 with a read-only audit account on the appliance. The objective is the appliance's current configuration, preserved off-device, with nothing on VH-FW-EDGE changed — not even a log line out of place.<\/p>","artefacts":[{"label":"Bridge — 09:40","kind":"chat","body":["Petra Vogt (legal): Evidence must survive scrutiny. Whatever you run, the device must not change.","Devi Rao (CISO): Ten minutes, Omar. And the clinics stay up.","Omar Haddad: Read-only capture, off-box copy, hashes recorded. No reboots.","Sven Kroll (net lead): If anyone types 'reboot' I will unplug their keyboard."]},{"label":"Stakes on VH-FW-EDGE","kind":"table","head":["What","Status"],"rows":[["In-memory state","live SSL-VPN sessions, NAT table — lost on reboot"],["Config on disk","survives a reboot, not a factory reset"],["Clinic routing","14 sites fail over to one backup link if the edge bounces"],["MFA bypass status for vhsvc_maint","unknown"],["Vendor confirmation for the 22:04 maintenance session","not received"]]},{"label":"Appliance admin session log (extract)","kind":"log","body":"2025-03-10T22:04:11Z admin vhsvc_maint src 10[.]91[.]44[.]2 ssh maintenance session start\n2025-03-10T23:47:56Z admin vhsvc_maint ssh maintenance session end\n2025-03-12T09:41:03Z admin omar.haddad src vh-jump-01 audit (read-only) session start"},{"label":"ATT&CK excerpt — why the config matters","kind":"attack","body":"C0063 2025 Poland Wiper Attacks: obtained victim Fortinet perimeter device configuration details, including publicly disclosed details from an online forum used by criminal communities.\nDevice-side configuration evidence is what makes the comparison stand up."},{"label":"Staff flu-vaccination notice (noise)","kind":"text","body":"<p>Drop-in slots continue this week in Hall 2. Line managers, please release staff in staggered groups.<\/p>"}],"question":"Type the one command that preserves the appliance's current configuration into the case folder without changing anything on the device.","hint":"Every token of your command must be something a court would call read-and-copy — the device may not even blink.","explanation":"<p>The objective is legal-grade evidence, so the command reads like a read-and-copy operation: SSH to the audit account, a show command that only reads the full running configuration, and tee to place a copy in the case folder while the session log records the read. Nothing in the canonical changes device state, which is what 'survives scrutiny' requires. The destructive near-misses are the trap: reboot and shutdown wipe the in-memory session and NAT tables and bounce fourteen clinic sites, and a factory reset also destroys the on-disk config — 'reboot to be safe' is a widely shared best practice that is exactly wrong when volatile state is the evidence. Scanning the appliance with nmap adds noise without producing the artefact legal asked for. Doing nothing was also a decision with a cost: configs rotate and sessions age out, so tomorrow the 'current' state would be gone.<\/p><p><b>Study this:<\/b> evidence preservation first, the C0063 lesson that appliance configuration details are the prize, and read-only capture over state-changing 'fixes'.<\/p>","prompt":"omar@vh-jump-01:~$","banner":"VH-FW-EDGE is live and clinic traffic flows through it. Evidence must survive scrutiny — nothing you run may change the device. Type the command, then press Enter (simulated).","elements":[{"label":"connects to the appliance over SSH","re":"\\bssh\\b","why":"SSH to the read-only audit account is the path to the device that changes nothing."},{"label":"dumps the full running configuration without changing state","re":"show\\s+full-configuration","why":"A show command only reads; device state stays untouched."},{"label":"writes the capture into the case folder off the appliance","re":"(tee\\s+/case/|>\\s*/case/)","why":"Evidence must land in controlled storage with a path and name you can cite."}],"bads":[{"re":"\\breboot\\b","note":"Rebooting wipes the in-memory session and NAT state — the very evidence legal needs — and bounces fourteen clinic sites. The 'reboot to be safe' reflex is exactly wrong here.","dangerous":true},{"re":"factory[- ]?reset","note":"A factory reset destroys the on-disk configuration as well; the case would lose its primary artefact.","dangerous":true},{"re":"\\b(shutdown|halt|poweroff)\\b","note":"Stopping the appliance is an outage plus destroyed volatile state — the opposite of evidence preservation.","dangerous":true},{"re":"\\bnmap\\b","note":"Scanning your own suspected appliance adds noise and proves nothing about its stored configuration; the read-only dump is the scrutinisable artefact."}],"canonical":"ssh vh-fw-edge \"show full-configuration\" | tee /case/evidence/vh-fw-edge-config-20250312.txt","out":"audit@vh-fw-edge session opened (read-only)\n#config-version=VH-FW-EDGE-7.2.5\nconfig system global\n    set hostname \"VH-FW-EDGE\"\nconfig vpn ssl settings\n    set port 443\n... (41,812 lines)\n-- capture written to /case/evidence/vh-fw-edge-config-20250312.txt\nsha256 9f2c...e1 recorded in case #43671"},{"id":"e08","type":"order","title":"Sequence the response: evidence before change","scenario":"<p>The CAB and Devi agree: act on the live SSL-VPN exposure. Five actions arrive at once, each sponsor certain theirs is first — legal wants capture, the IR retainer wants the watch, Sven wants the change, the duty manager wants the ticket updated, GRC wants the minimisation backlog. Sequencing is the senior decision: one action, if taken late, can never be taken early again, because the configuration will already have changed. Omar has ten minutes to set the order before the change window opens.<\/p>","artefacts":[{"label":"Five sponsors, ten minutes","kind":"chat","body":["Petra Vogt (legal): Capture first — after the change, the old config exists nowhere.","Astra-IR (retainer): Watch up before anything touches the portal.","Sven Kroll (net lead): My window is tonight; slip it and I lose the vendor slot.","Marek Dutko (duty mgr): Ticket hygiene keeps the night shift from re-deciding this.","Ida Brandt (GRC): The backlog is standing work; it can start any day."]},{"label":"Cost and reversibility","kind":"table","head":["Action","Reversible","Time","Clinic impact"],"rows":[["Read-only config capture","no","minutes","none"],["72h sign-in watch (#43688)","no","minutes","none"],["Portal source-range change","yes","40 min","remote imaging upload pauses"],["Case #43671 mapping update","yes","5 min","none"],["M1056 minimisation backlog","yes","weeks","none"],["Clinic failover headroom","(not measured)","—","—"]]},{"label":"Draft change request CR-118 (preconditions on purpose)","kind":"code","body":"CR-118 restrict SSL-VPN portal source ranges on VH-FW-EDGE\nprecondition: capture of running config completed [ ]\nprecondition: watch #43688 active [ ]\nrollback: restore prior source-range table [ ]\nvendor slot: tonight 22:00-23:00"},{"label":"HR timesheet reminder (noise)","kind":"text","body":"<p>March timesheets close on the 20th. Unsubmitted entries escalate to line managers on the 21st.<\/p>"}],"question":"Order the five actions the way Omar should sequence them tonight.","hint":"One of these actions destroys the precondition for another if you swap them — CR-118 itself names its preconditions.","explanation":"<p>The order follows reversibility and dependency, not the seniority of sponsors. Capture goes first because it is the only action that cannot be done later — after CR-118 the old source-range table exists nowhere. The watch goes live second so any exploitation attempt during the change is seen; the change itself is third, inside its booked window, with the capture as its precondition and the watch as its net. The ticket update follows the actions so the record states what actually happened, in order. The standing M1056 minimisation backlog is real work, but it is unscheduled and never blocks a live response. Swapping one and three destroys the case's primary artefact — that is the whole exercise.<\/p><p><b>Study this:<\/b> sequencing response actions by evidence preservation and reversibility under stakeholder pressure.<\/p>","items":["Read-only capture of the running config to the case folder","Confirm the 72-hour sign-in watch is active (#43688)","Execute CR-118: restrict portal source ranges in the booked window","Update case #43671 mapping (T1590.006 / TA0043 / PRE) for handover","Open the standing M1056 minimisation backlog"],"itemWhy":["Evidence preservation is first: after the change, today's config exists nowhere.","The watch must be live before the portal changes, so any exploitation attempt during the window is seen.","The change is the third move: it needs the capture as its precondition and the watch as its safety net.","Ticket hygiene follows the action so the record reflects what was actually done, in order.","Standing minimisation is important but unscheduled; it never blocks the response sequence."]},{"id":"e09","type":"multi","title":"Night two: what justifies escalating tonight","scenario":"<p>Night two, 04:52. Watch #43688 fires. CoreSight shows 240 failed MFA pushes against the SSL-VPN portal between 04:10 and 04:40, then one success: user vhsvc_maint, source 193[.]32[.]249[.]88, MFA approved from a device never registered before (SM-G991B, 'new'). Context: HR ran a company-wide password-reset day, so failed-push volume is expected somewhere. The recon-window summary shows 45[.]83[.]220[.]17 and 193[.]32[.]249[.]88 both probed appliance ports during the six-day window. Devi, 05:20: 'Which of these changes tonight — in ten words?'<\/p>","artefacts":[{"label":"CoreSight — SSL-VPN auth log, watch #43688","kind":"logview","body":"2025-03-18T04:10:03Z mfa-push vhsvc_maint src 193[.]32[.]249[.]88 result=failed\n... (238 similar lines, 04:10-04:40 — log truncated)\n2025-03-18T04:52:17Z sslvpn-login vhsvc_maint src 193[.]32[.]249[.]88 result=success mfa=approved device=SM-G991B (new)\n2025-03-18T04:52:19Z session vhsvc_maint portal=/remote/login duration=--\n2025-03-18T04:53:02Z cmd vhsvc_maint ran 'show vpn ssl settings' (read-only)\n2025-03-18T05:01:44Z session vhsvc_maint portal session end\n2025-03-18T05:04:31Z crawler 198[.]51[.]100[.]9 GET /news/page-2 (search-engine ASN)\n2025-03-18T05:12:09Z agent VH-CLINIC-07 heartbeat missed (agent back at 05:31)"},{"label":"Watch context pack — the gaps are load-bearing","kind":"table","head":["Item","Detail"],"rows":[["HR password-reset day","company email 16:00 — push failures expected to rise"],["Recon-window probes","45[.]83[.]220[.]17 and 193[.]32[.]249[.]88 hit appliance ports in the six-day window"],["Device SM-G991B","owner: (not registered in MDM)"],["vhsvc_maint interactive history","none before this week"]]},{"label":"05:20 bridge","kind":"chat","body":["Devi Rao (CISO): Which of these changes tonight — in ten words.","Astra-IR (retainer): If a success ties to the recon sources, that is our trigger.","Omar Haddad: Reading the success line now; volume alone does not move me."]},{"label":"Website cookie-consent audit (noise)","kind":"text","body":"<p>Banner consent rate 91%; quarterly filing complete. No action for the watch.<\/p>"}],"question":"Select the TWO findings that justify escalating to the IR retainer tonight.","hint":"Reset day explains volume, not success — tie the source to the recon window before you answer.","explanation":"<p>Tonight turns on the success line and its ties, not on volume. The 04:52 login as vhsvc_maint with MFA approved from a first-seen, unregistered device is possible External Remote Services (T1133) on a maintenance account with no interactive history. The same address that probed appliance ports during the recon window then signing in is the chain — recon, then the door, then a hand on it. The 240 failures are explained by reset-day volume and stay watch-and-report; the crawler and the heartbeat gap are unrelated noise. Both correct findings justify escalation to the retainer tonight; everything else can be a dashboard row until morning.<\/p><p><b>Study this:<\/b> separating volume noise from success-plus-context, and the recon-to-External Remote Services (T1133) chain.<\/p>","options":[{"t":"The 240 failed MFA pushes between 04:10 and 04:40 tonight","why":"Reset day explains the volume; without a success it stays watch-and-report."},{"t":"The 04:52 success as vhsvc_maint with MFA from a first-seen device","correct":true,"why":"A success on a maintenance account from an unregistered device is the line that turns recon into possible External Remote Services (T1133)."},{"t":"Crawler requests to the /news pages from a search-engine ASN","why":"Generic crawling of the marketing site is unrelated to the appliance chain."},{"t":"Source 193[.]32[.]249[.]88 ties the recon probes to tonight's login","correct":true,"why":"The same address touching appliance ports and then signing in is the chain — escalate."},{"t":"The missed agent heartbeat on VH-CLINIC-07 that recovered","why":"Endpoint hygiene noise; it recovered at 05:31 and touches nothing appliance-side."}]},{"id":"e10","type":"blank","title":"Detection note: DET0889 / AN2021 honestly","scenario":"<p>Detection-engineering note, due before the CAB follow-up. Lena must tune the CoreSight scan-recon analytic so the on-call stops paging on every crawler, and she must write honestly what appliance-recon detection cannot do. The detection strategy for this technique (DET0889, analytic AN2021) is blunt: occurrence and false positives are very high, and much of the activity happens where Veridian has no sensors. The note's three gaps go to the detection lead for sign-off; the coffee rota goes to nobody.<\/p>","artefacts":[{"label":"CoreSight analytic AN2021 (tuning draft)","kind":"code","body":"analytic: AN2021 (scan-recon, appliance-focused)   strategy: DET0889\nwhen: edge probe events where dst in appliance_mgmt_ports\n  and rate < 60 pph over 6h\n  and source not in approved_scanners\nthen: case-ticket, severity=medium\nthreshold: (missing — set after two-week baseline)\nsuppress: crawler ASNs, approved scan windows"},{"label":"Known-benign look-alikes (last 7 days)","kind":"log","body":"2025-03-19T11:02:11Z 198[.]51[.]100[.]9 banner GET / HTTP/1.1 (research crawler)\n2025-03-19T11:02:15Z 198[.]51[.]100[.]9 banner HEAD /ssl-vpn (research crawler)\n2025-03-20T09:41:02Z 10[.]91[.]44[.]2 vendor support check of portal status (ticketed)\n2025-03-21T03:00:07Z VH-SCAN-01 quarterly sweep (change 43602)"},{"label":"AN2021 profile, quoted from the strategy","kind":"table","head":["Property","Value"],"rows":[["Occurrence","very high"],["False-positive rate","very high"],["Where activity happens","often outside victim visibility"],["Pivot point","later lifecycle stages, e.g. Initial Access"],["Two-week baseline","(not yet collected)"]]},{"label":"Detection lead review","kind":"chat","body":["Petra Lang (det lead): I sign thresholds, not wishes — where is the baseline?","Lena Fischer: Two weeks out; the note says so, and the pivot row is the point.","Omar Haddad: If the note kills one false page per night, it pays for itself."]},{"label":"Coffee corner rota (noise)","kind":"text","body":"<p>Machine descaled; this week's roast is the mild Peru. Cleaning rota unchanged.<\/p>"}],"question":"Complete the three gaps in the detection note.","hint":"The note repeats the strategy's own words, not our hopes: noisy, invisible, pivot.","explanation":"<p>The note is honest about limits because the strategy is: AN2021 sees very high occurrence and a very high false-positive rate, and much appliance recon happens outside the victim's visibility entirely. 'Outside' is the word that keeps the on-call from chasing crawler ghosts they cannot fully stop — tuning, baselines and suppression handle the noise they can see. The pivot row is the operationally useful part: when recon itself is invisible, detection effort moves to the lifecycle stages it feeds, above all Initial Access via External Remote Services (T1133). 'Inside' and 'zero' invert the strategy, and 'low' contradicts the very high false-positive profile the page states.<\/p><p><b>Study this:<\/b> DET0889 / AN2021 — very high false-positive rate, activity outside victim visibility, pivot to later stages.<\/p>","blanks":[{"label":"AN2021 carries a very high ___ rate","accept":["false-positive","false positive","fp","false positives","falsepositives"],"why":"The strategy states occurrence and false positives are very high — tuning and baselines are the answer, not more noise."},{"label":"Appliance recon often happens ___ the victim's visibility","accept":["outside","beyond"],"why":"Much of this recon runs on public data or from sources we never see — sensors cannot page on what they never observe."},{"label":"Detection effort pivots to later stages such as ___","accept":["initial access","t1133"],"why":"When recon is invisible, the watch moves to where the recon lands: External Remote Services (T1133)."}],"bank":["false-positive","outside","Initial Access","inside","zero","DET0001","low"]},{"id":"e11","type":"steps","title":"Volt Typhoon bulletin vs the 03:14 admin login","scenario":"<p>Day three, 02:40. The CTI relay circulates a bulletin on <b>G1017 Volt Typhoon<\/b>: long pre-compromise reconnaissance of a target's network security measures, quiet hands, no flashy scans, access only when the picture is complete. At 03:14, VH-FW-EDGE logs an admin login as vhsvc_maint from the SSL-VPN tunnel range. Vendor maintenance ticket #43695 booked 22:00 yesterday — but no confirmation the vendor ever connected. Devi's question is brutal: 'Do we pull VH-FW-EDGE from the cluster? Fourteen clinics route through it.' Pulling it means every site on one backup link for hours; rebooting it means losing the session you are watching.<\/p>","artefacts":[{"label":"CTI bulletin — G1017 Volt Typhoon (relay)","kind":"text","body":"<p>G1017 Volt Typhoon conducts extensive pre-compromise reconnaissance, including identifying the target's network security measures, before establishing presence. Expect no indicators, low-and-slow probing, and living-off-the-land tooling once inside. Attribution of any single session to the group requires more than timing.<\/p>"},{"label":"VH-FW-EDGE — admin session log, 03:14","kind":"log","body":"2025-03-19T03:14:07Z admin vhsvc_maint src 10[.]91[.]199[.]44 (ssl-vpn tunnel range) login success\n2025-03-19T03:16:22Z cmd vhsvc_maint 'show vpn ssl settings' (read-only)\n2025-03-19T03:19:40Z cmd vhsvc_maint 'show user local' (read-only)\n2025-03-19T03:26:51Z session vhsvc_maint active\nvendor ticket #43695: booked 22:00 (no connection logged at 22:00)\nvendor confirmation of the 03:14 session: (not received)"},{"label":"02:52 bridge","kind":"chat","body":["Devi Rao (CISO): Pull it or hold it — fourteen clinics are the cost either way.","Sven Kroll (net lead): Pulling means one backup link for every site. Imaging uploads crawl for hours.","Astra-IR (retainer): If you reboot it, the session we want to understand is gone.","Devi Rao (CISO): Ten minutes."]},{"label":"Cost of each path — the gap is the point","kind":"table","head":["Path","Consequence"],"rows":[["Keep live + targeted containment","session killed, service kept, evidence kept"],["Pull from cluster","all 14 clinics on one backup link, hours of degraded uploads"],["Reboot 'to be safe'","volatile state destroyed, clinics bounced, nothing learned"],["Backup link headroom","(not measured)"]]},{"label":"Town-hall invite (noise)","kind":"text","body":"<p>Lab redesign consultation, Thursday 15:00, Hall 1. Slides on the intranet.<\/p>"}],"question":"Walk the three decisions in order.","hint":"The bulletin says the quiet session is the pattern to take seriously — and that every option you are weighing has a cost you must be able to state.","explanation":"<p>The bulletin sets the reading frame: G1017 Volt Typhoon does long, quiet pre-compromise recon of security measures, so an unattributed admin session is exactly the shape to take seriously without naming a group. Capture comes first, because every later option depends on evidence that only exists now; the reboot reflex destroys the live session — the volatile state that is the whole case. With a live unattributed session and no vendor confirmation, the least costly safe action is targeted: kill the session, disable the account, keep the service, escalate to the retainer. Pulling the edge is defensible in a world of confirmed destructive activity; here it buys the same containment at fourteen-clinic cost. And the chain question stays behavioural — exposure first, then the first external login on that exposure — because sector, forum tags and account names are not attribution.<\/p><p><b>Study this:<\/b> the G1017 Volt Typhoon pre-compromise recon pattern, containment as a costly trade-off, and attribution caution.<\/p>","steps":[{"question":"Before any containment decision, what comes first?","options":[{"t":"Reboot the appliance to clear any implant","why":"The reflex feels safe and destroys the only volatile evidence — the live session."},{"t":"Wait for the vendor to call back about ticket #43695","why":"An unattributed live session does not wait for business hours."},{"t":"Pull VH-FW-EDGE from the cluster immediately","why":"Real clinical cost, and it also destroys the session you need to observe."},{"t":"Read-only capture of the live session, config and logs","correct":true,"why":"Preserving what is happening now keeps every later option open; nothing else on this list does."}],"advance":"<p>Capture completes at 03:31: one live SSL-VPN session as vhsvc_maint from the tunnel range, read-only commands against the portal config, and a CMDB owner field for vhsvc_maint that is blank. The vendor has still not called.<\/p>"},{"question":"Live, unattributed, clinics online. Your recommendation to Devi?","options":[{"t":"Kill the session, disable vhsvc_maint, keep the device live, engage IR","correct":true,"why":"It removes the access, keeps the service, keeps the evidence, and escalates — the least costly safe action in this world."},{"t":"Pull VH-FW-EDGE from the cluster now and take the downtime","why":"Defensible with confirmed destructive activity; here a targeted kill achieves containment without fourteen sites on one link."},{"t":"Leave the session running; it is probably the vendor's engineer","why":"The vendor never connected at 22:00 and nobody confirms 03:14 — 'probably' is not containment."},{"t":"Factory-reset the appliance tonight before the shift changes","why":"It destroys evidence and service together; nothing about this session justifies it."}],"advance":"<p>Session killed at 03:52; vhsvc_maint disabled; Astra-IR engaged as case #43701. Their first question: what supports reading this as recon-then-access rather than a stray maintenance login?<\/p>"},{"question":"Which line is the strongest evidence for the T1590.006 to T1133 chain?","options":[{"t":"Volt Typhoon targets health care, so this session is Volt Typhoon","why":"Sector and timing are not attribution; the bulletin itself warns against it."},{"t":"The account name vhsvc_maint sounds suspicious to the board","why":"Names are not evidence; the behaviour around the name is."},{"t":"Exposure was followed within 72 hours by the first external portal login","correct":true,"why":"Exposure first, access second, on the same door — that is the chain the technique family predicts."},{"t":"The forum paste carried a C0063 tag, so C0063 actors are inside","why":"A public tag on behaviour we resemble is not membership."}],"advance":"<p>The debrief records the path you took; the Check button grades all three steps together.<\/p>"}]},{"id":"e12","type":"qcm","title":"The CVE notice vs the live exposure","scenario":"<p>Thursday. The comms lead drafts the quarterly customer security notice; this month it names 'perimeter firewalls (FortiGate 100F, firmware 7.2.5) affected by CVE-2024-21762'. Policy says transparency; legal sees no barrier. The catch: CR-118 only closes the portal source-range exposure on Monday, and case #43671 shows collectors actively harvesting exactly this appliance fingerprint — C0063-style forum trades, six-day probes, a live portal. Devi asks Omar for a recommendation before the 10-minute call. 'Transparent disclosure' is the textbook answer. Is it the right one this week?<\/p>","artefacts":[{"label":"Draft customer notice v0.3","kind":"text","body":"<p>'Out of abundance of caution, Veridian Health confirms its perimeter firewalls (FortiGate 100F, firmware 7.2.5) are affected by CVE-2024-21762. Patching and configuration hardening are underway; the SSL-VPN portal remains available.'<\/p>"},{"label":"Comms bridge","kind":"chat","body":["Isabel Frey (comms): Transparency is our policy; legal is fine. Publish at 16:00?","Devi Rao (CISO): Omar — one recommendation, ten minutes.","Petra Vogt (legal): If we publish, we publish facts we cannot take back.","Sven Kroll (net lead): The portal is open until Monday. Say that out loud and count the readers."]},{"label":"What the draft teaches an outside reader","kind":"table","head":["Fact","Effect on the reader"],"rows":[["Appliance model","FortiGate 100F — confirmed by the victim itself"],["Firmware","7.2.5 — exact build"],["CVE","CVE-2024-21762 — exploitability confirmed"],["Portal availability","open until Monday (planned)"],["Source-range restriction status","(planned Monday, not yet in force)"],["Vendor patch status","(not confirmed by the vendor)"]]},{"label":"ATT&CK excerpt — mitigation frame","kind":"attack","body":"M1056 Pre-compromise: this recon behaviour cannot be easily mitigated with preventive controls once the data is exposed; focus on minimising the amount and sensitivity of data available to external parties."},{"label":"Marketing press-release note (noise)","kind":"text","body":"<p>Patient-app launch press release ships Friday 09:00; spokesperson quotes locked.<\/p>"}],"question":"What does Omar recommend on the notice before the call?","hint":"One sentence of the draft is only true until Monday — the recommendation has to survive that clock.","explanation":"<p>The textbook best practice — transparent disclosure — collides this week with the live fact the draft would certify: the door is open until Monday, and collectors are actively fingerprinting exactly this appliance. Publishing now confirms model, firmware, exploitability and portal availability to every reader, which is the opposite of M1056 Pre-compromise's focus on minimising what external parties can learn. Holding to Monday is not censorship; it times the disclosure so its facts stop being true when it ships, and the version detail goes anyway. Stripping only the firmware still confirms model and CVE; a vendor-forum-only post narrows the audience to the community where C0063-style trades happen. A 90-day comms freeze punishes every unrelated disclosure for one mistimed draft.<\/p><p><b>Study this:<\/b> M1056 Pre-compromise minimisation versus disclosure timing, using the C0063 collector behaviour as the threat model.<\/p>","options":[{"t":"Publish the draft as written, at 16:00 as scheduled","why":"It certifies the appliance fingerprint to every collector while the door is still open."},{"t":"Publish now but strip the firmware version from the text","why":"Model plus CVE still confirms the exposure and its exploitability until Monday."},{"t":"Suspend all customer communications for a full 90 days","why":"Overcorrection: unrelated disclosures should not stop because one draft was mistimed."},{"t":"Hold the notice to Monday, then publish without appliance detail","correct":true,"why":"It times the disclosure to when the fact stops being true, and shrinks what the notice itself teaches (M1056)."},{"t":"Publish only in the vendor community forum, nowhere else","why":"A semi-public forum is exactly where C0063-style trades happen; it narrows the audience to the hostile one."}]},{"id":"e13","type":"match","title":"Map observations to exact techniques for review","scenario":"<p>Lena's CTI report on case #43671 goes to the CTI review board tomorrow. Each observation must map to the right technique — the board rejects reports that stretch labels, and the siblings are the classic stretch: Network Topology (T1590.004) is about arrangement, IP Addresses (T1590.005) about ranges, while this case is about the defensive appliances themselves. One mapping is the board's favourite trap: the criminal-forum paste. The forum is not Veridian-owned, so which collection technique does finding it belong to? The reviewer wants zero hedging and exact IDs.<\/p>","artefacts":[{"label":"Observations register — case #43671","kind":"table","head":["Observation","Source"],"rows":[["Six-day low-rate probe of appliance management ports from one external range","edge log, confirmed"],["Perimeter config details circulated in a criminal-forum thread","CTI relay paste"],["Careers post naming the firewall vendors we run","our own careers page"],["First external SSL-VPN login after the recon window","watch #43688"],["T1596 database lookups","(outside victim visibility — not claimed)"]]},{"label":"Evidence lines (abridged)","kind":"log","body":"2025-03-11T03:02:55Z 45[.]83[.]220[.]17 -> 203[.]0[.]113[.]10:443 SYN rate=low\n2025-03-18T04:52:17Z sslvpn-login vhsvc_maint src 193[.]32[.]249[.]88 result=success\nrelay: paste vh-edge-2024.conf found on criminal forum (C0063-tagged)\ncareers: 'administer our FortiGate firewalls ... our bastion'"},{"label":"Review board pre-read","kind":"chat","body":["Petra Lang (reviewer): Exact IDs, no hedging. The forum trap catches someone every quarter.","Lena Fischer: The paste is the test: not victim-owned, so not T1594.","Omar Haddad: And the login is access, not recon — different tactic boundary."]},{"label":"ATT&CK excerpt — collection sentence","kind":"attack","body":"T1590.006 collection: direct actions via Active Scanning (T1595) or Phishing for Information (T1598); exposed via online or accessible data sets, e.g. Search Victim-Owned Websites (T1594)."},{"label":"Fire-safety drill notice (noise)","kind":"text","body":"<p>Full evacuation drill next Wednesday 10:00. Wardens, check your sweeps.<\/p>"}],"question":"Match each observation to the exact technique the board expects.","hint":"Ownership decides the collection label: who owns the surface the adversary read?","explanation":"<p>Ownership decides the collection labels. The probe of appliance ports is direct collection — Active Scanning (T1595). The forum paste reads as open-web collection because the forum is not Veridian-owned, so it maps to Search Open Websites/Domains (T1593), while the careers post on Veridian's own site is Search Victim-Owned Websites (T1594) — the board's favourite trap; the sibling techniques for topology and IP ranges stay out of scope entirely. The first external portal login crosses the tactic boundary into External Remote Services (T1133). The decoys fail on absence and evidence: no elicitation message exists for Phishing for Information (T1598), and no exploit attempt was observed for Exploit Public-Facing Application (T1190) — only a login.<\/p><p><b>Study this:<\/b> T1593 versus T1594 (who owns the surface the adversary read) and the Reconnaissance-to-Initial-Access boundary at T1133.<\/p>","pairs":[{"l":"Six-day low-rate probe of appliance management ports","r":"Active Scanning (T1595)","why":"Direct probing of the appliances is the direct collection vector for this sub-technique."},{"l":"Perimeter config details found on a criminal forum","r":"Search Open Websites/Domains (T1593)","why":"The forum is open to members but not victim-owned — collecting there is open-web search, not T1594."},{"l":"Careers post naming our firewall vendors","r":"Search Victim-Owned Websites (T1594)","why":"Veridian's own site is the victim-owned surface that leaked the appliance detail."},{"l":"First external SSL-VPN login after the recon window","r":"External Remote Services (T1133)","why":"It crosses from Reconnaissance into Initial Access via the exposed remote service."}],"decoys":[{"r":"Phishing for Information (T1598)","why":"Defensible when an adversary elicits appliance detail from staff; no elicitation message exists in this case."},{"r":"Exploit Public-Facing Application (T1190)","why":"No exploit attempt is observed — only a login; T1190 is the stage to watch for if exploitation appears."}]},{"id":"e14","type":"cloze","title":"The CTI sentence that gets quoted","scenario":"<p>The CTI sentence for report R-2025-041 must be exact: the same sentence gets quoted into the risk register and two client briefings. Reviewer Petra Lang wants every keyword load-bearing — technique ID, tactic, platform, and the next-stage watch — with no hedging words. The sentence template is fixed; the four keywords are dropdowns. The case-fields table still shows IR confidence as pending, which the report must reflect, not paper over.<\/p>","artefacts":[{"label":"ATT&CK frame for the sentence","kind":"attack","body":"T1590.006 — Network Security Appliances.\nSub-technique of T1590 (Gather Victim Network Information).\nTactic: Reconnaissance (TA0043).   Platform: PRE.\nNext stages include External Remote Services (T1133)."},{"label":"Case fields — #43671","kind":"table","head":["Field","Value"],"rows":[["Owner","Lena Fischer"],["Technique family","Gather Victim Network Information (T1590)"],["IR confidence","(pending — case #43701 open)"],["Watch","#43688, 72h, SSL-VPN portal sign-ins"]]},{"label":"Review note","kind":"chat","body":["Petra Lang (reviewer): Four keywords, all load-bearing. If the platform word is wrong, the register quote is wrong.","Lena Fischer: The sentence stays inside this one sub-technique — no sibling leakage.","Omar Haddad: And the watch keyword names the stage we actually observe."]},{"label":"CoreSight backup job report (noise)","kind":"text","body":"<p>Nightly config index completed 02:00, 412 MB, no errors. (Routine.)<\/p>"}],"question":"Complete the four keyword slots so the sentence is exact.","hint":"Every keyword must name what was observed — arrangement, address ranges and exploits belong to other sentences.","explanation":"<p>Each keyword is load-bearing because the sentence is quoted elsewhere. T1590.006 names the appliance-focused sub-technique — the topology (T1590.004) and IP-address (T1590.005) siblings describe other collections entirely. Reconnaissance (TA0043) is the tactic because studying defences precedes any action against them; Initial Access and Discovery sit later in the timeline. PRE is the platform word for 'before the attack begins' — the register quote depends on it. T1133 names the stage the case actually observed: a login on the exposed remote service, not an exploit (T1190) or a password guess (T1110). The pending-confidence field stays pending: the report reflects what IR has confirmed, not what would read better.<\/p><p><b>Study this:<\/b> writing ATT&amp;CK mappings that survive quoting — exact ID, tactic, platform, and the observed next stage.<\/p>","template":"Case #43671 records adversary recon of Veridian's defensive appliances as ATT&CK %0 under tactic %1 on platform %2; the standing watch now focuses on the stage the recon enables, %3.","choices":[["T1590.004","T1590.006","T1590.005"],["Reconnaissance (TA0043)","Initial Access (TA0001)","Discovery (TA0007)"],["Cloud","Enterprise","PRE"],["T1133","T1190","T1110"]],"correct":[1,0,2,0],"why":["The behaviour studies defensive appliances — the .006 sub-technique; .004 is topology and .005 is IP ranges.","Studying defences before contact sits in Reconnaissance (TA0043), before Initial Access or Discovery.","PRE marks the pre-attack phase: the adversary acts before touching Veridian systems.","The observed next stage is a login on the exposed remote service (T1133), not an exploit or a password guess."]},{"id":"e15","type":"dragdrop","title":"Build the M1056 minimisation backlog","scenario":"<p>CR-118 is in; the portal now accepts broker ranges only. Devi wants the standing M1056 Pre-compromise minimisation backlog: what Veridian stops teaching outsiders about its appliances. Sven arrives with a crowd-pleaser — 'industry best practice is a weekly reboot cycle for perimeter boxes' — and Ida wants the register gaps closed. The backlog must name one control per exposure, and it must survive the question 'what does this actually reduce?' Three of the proposals on the table reduce nothing; one destroys something.<\/p>","artefacts":[{"label":"External exposure register (March)","kind":"table","head":["Exposure","Status"],"rows":[["SSL-VPN portal open to any source","closed by CR-118, verify quarterly"],["Portal banner shows make, model, firmware","open"],["Vendor maintenance ports reachable from vendor ranges","open"],["CMDB owner fields for vh-cf-01 and vh-nids-02","(not recorded)"],["Portal certificate CN","(not recorded)"]]},{"label":"Backlog workshop","kind":"chat","body":["Sven Kroll (net lead): Weekly reboots — every hardening guide says it, and it shows we act.","Devi Rao (CISO): Show me what a reboot reduces about what outsiders can learn.","Ida Brandt (GRC): And name owners; unowned appliances stay unhardened.","Omar Haddad: Banners and job posts are the cheap wins."]},{"label":"Current external banners (abridged)","kind":"log","body":"portal: FortiGate 100F — SSL-VPN service\n22/tcp: VH-BASTION-01 authorised vendor maintenance only\nblock page: Filtered by Veridian Content Filter (vh-cf-01)"},{"label":"Facilities elevator notice (noise)","kind":"text","body":"<p>Elevator 2 maintenance Thursday 07:00-09:00; use elevator 1 or the east stairs.<\/p>"}],"question":"Drag each control onto the exposure slot it actually closes.","hint":"Two chips destroy value and one republishes it — ask what each chip reduces about an outsider's picture.","explanation":"<p>Each correct control reduces a specific thing an outsider can learn or reach: source-range restriction shrinks who can knock on the portal, banner stripping removes the appliance fingerprint from the cheapest collection surface, the bastion-only maintenance path shrinks the exposed management trail, and named owners close the register gaps that let everything else survive reviews. The reboot cycle fails the test the CISO set: it reduces nothing about what outsiders can learn and destroys the volatile state that evidence lives in — a popular best practice that is wrong here. The CVE notice republishes the fingerprint, and disabling logging blinds Veridian at the exact pivot point where recon becomes visible again. Minimisation is subtraction with intent, not activity.<\/p><p><b>Study this:<\/b> M1056 Pre-compromise — controls that reduce externally available appliance data, and the impostors that only look like hardening.<\/p>","slots":[{"label":"Portal reachability","accept":"a1","why":"Source-range restriction is the control that actually shrinks who can reach the SSL-VPN door."},{"label":"Banner and version leakage","accept":"a2","why":"Stripping identifying banners removes the exact T1590.006 data outsiders collect for free."},{"label":"Maintenance-path leakage","accept":"a3","why":"Funneling vendors through one bastion shrinks the exposed maintenance surface and its banner trail."},{"label":"Ownership blind spot","accept":"a4","why":"Named owners close the register gaps that let exposures survive quarterly reviews."}],"chips":[{"k":"a1","t":"Restrict portal source ranges (verify quarterly)","why":"Directly reduces who can reach the SSL-VPN door."},{"k":"a2","t":"Strip make, model and firmware from external banners","why":"Removes the appliance fingerprint from the attacker's cheapest source."},{"k":"a3","t":"Route vendor maintenance through VH-BASTION-01 only","why":"One audited path instead of open maintenance ports."},{"k":"a4","t":"Assign named CMDB owners for every appliance","why":"Owned appliances get patched and reviewed; unowned ones leak and stay leaked."},{"k":"d1","t":"Reboot all appliances weekly","why":"Popular and pointless here: a reboot reduces nothing outsiders learn and destroys the volatile state evidence lives in."},{"k":"d2","t":"Publish CVE notices naming affected models","why":"Re-publishes the fingerprint to the exact community collecting it."},{"k":"d3","t":"Disable appliance logging to shrink the footprint","why":"Blinds Veridian and kills the pivot to Initial Access signals; logging is how the chain got caught."}]},{"id":"e16","type":"order","title":"Rank the signals for the quarterly review","scenario":"<p>Quarterly risk review. The board funds standing watch capacity, so the ranking must survive the question 'why does this signal get an analyst?' Case #43671 produced five recurring signal types; the G1017 bulletin reminds the room that the most dangerous appliance recon looks like nothing at all. Ida wants costs kept in the appendix; Petra Lang wants the ranking defensible, not dramatic. Omar has one slide: the order is the recommendation.<\/p>","artefacts":[{"label":"Board note — G1017 reminder (relay)","kind":"text","body":"<p>G1017 Volt Typhoon identifies target network security measures as part of pre-compromise reconnaissance — quiet, patient, and easy to under-rank because it generates little volume. Rank by targeting quality, not by packet count.<\/p>"},{"label":"Signal profile (Q1)","kind":"table","head":["Signal","Profile"],"rows":[["Low-rate port-selective probe, days","targeted, repeat visits"],["Forum thread quoting our config","targeted, published once"],["Careers post naming vendors","targeted, self-inflicted"],["One-off portal banner grab, research scanner","untargeted"],["Crawler hits on /news","untargeted, constant"],["Analyst hours available","(to be agreed)"]]},{"label":"Pre-read comments","kind":"chat","body":["Petra Lang (reviewer): Rank by how much each signal says about intent, not by volume.","Devi Rao (CISO): The quiet one worries me most — convince me with the order.","Ida Brandt (GRC): Costs stay in the appendix."]},{"label":"Travel-desk update (noise)","kind":"text","body":"<p>Updated per-diem rates from 1 April; bookings via the portal as usual.<\/p>"}],"question":"Rank the five signals from most to least deserving of standing watch capacity.","hint":"The bulletin's warning is the ranking rule: weight intent and selection, never raw volume.","explanation":"<p>The ranking weights intent and selection, not volume — the G1017 reminder is the rule. The quiet, port-selective, repeated probe outranks everything because selecting appliance management ports across days is the signature of targeting; the forum thread is targeted and public, but a single event until it repeats. The careers post is self-inflicted and appliance-specific yet fixable in a day, so it ranks behind active external interest; the one-off research banner grab confirms exposure without showing intent; and the constant marketing-site crawler earns a dashboard, not an analyst. The board funds capacity, so the order is the decision: watch what says 'Veridian, specifically'.<\/p><p><b>Study this:<\/b> ranking recon signals by intent and selection — the pre-compromise lesson of Volt Typhoon (G1017).<\/p>","items":["Low-rate, port-selective probe of appliance management ports across days","Criminal-forum thread quoting our perimeter configuration","Careers post naming the firewall vendors we run","One-off portal banner grab by a research scanner","Generic crawler requests to the public website"],"itemWhy":["Port-selective, repeated, low-rate: the signature of targeted appliance recon, and the quietest line on the slide.","Someone is trading our appliance details — targeted and published, but a single event until it repeats.","Self-inflicted and appliance-specific; fixable in a day, so it ranks behind active external interest.","Research scanning touches everyone; it confirms exposure but shows no intent toward Veridian.","Constant, untargeted marketing-site noise; it earns a dashboard, not an analyst."]}]};
