<style>
:root{

  --tint-amber:rgba(255,180,84,.08);
  --tint-amber-strong:rgba(255,180,84,.20);
  --tint-amber-weak:rgba(255,180,84,.09);
  --tint-amber-badge:rgba(255,180,84,.12);
  --tint-green:rgba(87,211,140,.12);
  --tint-green-strong:rgba(87,211,140,.22);
  --tint-green-weak:rgba(87,211,140,.10);
  --tint-green-faint:rgba(87,211,140,.07);
  --tint-green-hero:rgba(87,211,140,.14);

  --btn-primary-text:#eaf3ff;
  --btn-green-text:#e9fff3;
  --btn-amber-text:#fff3e2;

  --tok-flag:#9d7bff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-ui);font-size:16px;line-height:1.55}
body{min-height:100vh}
#app{max-width:1060px;margin:0 auto;padding:14px 16px 90px}
h1,h2,h3{line-height:1.25}
button{font-family:var(--font-ui)}
a{color:var(--accent-blue)}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-mono)}
.hidden{display:none !important}

/* ---------- progress bar ---------- */
#pbarwrap{position:sticky;top:0;z-index:60;height:6px;background:var(--bg-surface-2);border-bottom:1px solid var(--border)}
#pbar{height:100%;width:0%;background:linear-gradient(90deg,var(--sev),var(--accent-blue));transition:width .4s ease;position:relative;overflow:hidden}
#pbar::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 0%,var(--sheen) 50%,transparent 100%);transform:translateX(-100%);animation:sheen 3.2s linear infinite}
@keyframes sheen{0%{transform:translateX(-100%)}60%,100%{transform:translateX(220%)}}

/* ---------- cards & blocks ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:18px 20px;margin:14px 0}
.blk{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);margin:16px 0;overflow:hidden}
.blk-head{display:flex;align-items:center;gap:10px;padding:10px 16px;font-weight:700;letter-spacing:.06em;font-size:14px;border-bottom:1px solid var(--border)}
.blk-head .blk-ico{font-size:16px}
.blk-body{padding:16px}
.blk.scenario .blk-head{color:var(--accent-blue);border-left:4px solid var(--accent-blue)}
.blk.scenario .blk-body{background:linear-gradient(180deg,var(--tint-blue-faint),transparent 60%),var(--bg-surface)}
.blk.question .blk-head{color:var(--accent-amber);border-left:4px solid var(--accent-amber)}
.blk.question .blk-body{background:linear-gradient(180deg,var(--tint-amber-weak),transparent 60%),var(--bg-surface)}
.blk.answer .blk-head{color:var(--accent-green);border-left:4px solid var(--accent-green)}
.blk.question .qtext{font-weight:700;font-size:17px;color:var(--text-primary)}
.artefact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;margin:10px 0;overflow:hidden}
.artefact .art-label{display:block;padding:7px 12px 0 12px;font-family:var(--font-mono);font-size:12.5px;color:var(--accent-blue);letter-spacing:.05em}
.artefact .art-body{padding:8px 12px 12px 12px}
.artefact p{margin:4px 0;color:var(--text-primary)}
pre.mono,pre.codeblock{font-family:var(--font-mono);font-size:14.5px;color:var(--text-mono);background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:6px 0;overflow-x:auto;white-space:pre;line-height:1.5}
pre.codeblock .copied{color:var(--state-correct);font-family:var(--font-ui);font-size:13px;margin-left:10px}
.tok-ip{color:var(--accent-amber)}
.tok-num{color:var(--tok-num)}
.tok-str{color:var(--accent-green)}
.tok-kw{color:var(--accent-blue);font-weight:600}
.tok-flag{color:var(--tok-flag)}
.copywrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- top bar (exam header) ---------- */
.topbar{position:sticky;top:6px;z-index:50;background:var(--topbar-bg);border:1px solid var(--border);border-bottom:2px solid var(--border);border-radius:10px;padding:10px 14px;margin:10px 0 18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;box-shadow:var(--shadow-lg)}
.tb-item{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text-secondary);min-height:34px}
.tb-item strong{color:var(--text-primary);font-size:15px}
.tb-score strong{font-size:16px}
.timerbox{font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--text-primary);letter-spacing:.04em;min-width:74px;text-align:center;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:4px 10px}
.tstate{font-size:12.5px;font-weight:600;letter-spacing:.03em;border-radius:6px;padding:3px 8px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-secondary);max-width:320px}
.tstate.running{color:var(--state-correct)}
.tstate.paused{color:var(--state-paused)}
.tstate.ended{color:var(--state-incorrect)}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;letter-spacing:.07em;border-radius:999px;padding:4px 12px;border:1px solid}
.badge.sev-easy{color:var(--sev-easy);border-color:var(--sev-easy);background:var(--tint-green)}
.badge.sev-medium{color:var(--sev-medium);border-color:var(--sev-medium);background:var(--tint-amber-badge)}
.badge.sev-hard{color:var(--sev-hard);border-color:var(--sev-hard);background:var(--tint-orange-badge)}
.badge.sev-extreme{color:var(--sev-extreme);border-color:var(--sev-extreme);background:var(--tint-red-badge)}
.statechip{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;letter-spacing:.04em}
.st-correct{color:var(--state-correct)}
.st-partial{color:var(--state-partial)}
.st-incorrect{color:var(--state-incorrect)}
.st-skipped{color:var(--state-skipped)}
.st-paused{color:var(--state-paused)}
.userchip{font-size:13px;color:var(--text-secondary);border:1px dashed var(--border);border-radius:999px;padding:3px 10px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:9px 18px;border-radius:8px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-primary);font-size:15px;font-weight:600;cursor:pointer;transition:filter .15s ease,transform .05s ease}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--tint-blue-strong),var(--tint-blue-weak));border-color:var(--accent-blue);color:var(--btn-primary-text)}
.btn.green{background:linear-gradient(180deg,var(--tint-green-strong),var(--tint-green-weak));border-color:var(--accent-green);color:var(--btn-green-text)}
.btn.amber{background:linear-gradient(180deg,var(--tint-amber-strong),var(--tint-amber-weak));border-color:var(--accent-amber);color:var(--btn-amber-text)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--state-incorrect);color:var(--state-incorrect);background:var(--tint-red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}

/* ---------- options ---------- */
.optlist{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);cursor:pointer;min-height:44px;transition:background .15s ease,border-color .15s ease;position:relative}
.opt:hover{background:var(--surface-hover)}
.opt input{width:19px;height:19px;margin-top:2px;accent-color:var(--accent-blue);flex:none}
.opt .opt-key{font-family:var(--font-mono);font-weight:700;color:var(--accent-blue);flex:none;min-width:26px}
.opt .opt-text{color:var(--text-primary);font-size:15.5px}
.opt.selected{border-color:var(--accent-blue);border-left:4px solid var(--accent-blue);background:var(--tint-blue)}
.opt.selected::after{content:"SELECTED";position:absolute;right:10px;top:8px;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--accent-blue)}
.opt.state-correct{border-color:var(--state-correct);border-left:4px solid var(--state-correct)}
.opt.state-wrong{border-color:var(--state-incorrect);border-left:4px solid var(--state-incorrect)}
.opt .opt-why{display:block;width:100%;margin-top:6px;font-size:13.5px;color:var(--text-secondary)}
.locked{pointer-events:none}
.locked input,.locked select,.locked button.answerctl{opacity:.85}

/* ---------- matching / triage selects ---------- */
.matchrow,.trirrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);margin:8px 0}
.matchrow .m-left,.trirrow .t-alert{flex:1 1 260px;color:var(--text-primary);font-size:15px}
.matchrow .m-left .mono,.trirrow .mono{font-size:14px}
select.anssel{min-height:44px;background:var(--bg-page);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14.5px;max-width:340px}
.trirrow .t-detail{flex:1 1 100%;font-size:13.5px;color:var(--text-secondary)}
.rowstate{font-size:12.5px;font-weight:700;letter-spacing:.05em;min-width:110px;text-align:right}

/* ---------- drag & drop ---------- */
.dndwrap{display:flex;flex-wrap:wrap;gap:14px}
.dndbank{flex:1 1 240px;min-width:220px;background:var(--bg-surface-2);border:1px dashed var(--border);border-radius:8px;padding:10px}
.dndbank h4,.zones h4{margin:2px 0 8px 2px;font-size:13px;letter-spacing:.06em;color:var(--text-secondary);font-weight:700}
.zones{flex:2 1 320px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.zone{background:var(--bg-surface-2);border:1px dashed var(--accent-blue);border-radius:8px;min-height:72px;padding:10px;cursor:pointer;transition:border-color .15s ease,background .15s ease}
.zone h5{margin:0 0 8px 0;font-size:13.5px;color:var(--accent-blue);font-weight:700}
.zone.dragover{background:var(--tint-blue);border-style:solid}
.zone.state-correct{border-color:var(--state-correct)}
.zone.state-wrong{border-color:var(--state-incorrect)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-hover);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:14px;padding:9px 12px;margin:4px;cursor:grab;min-height:44px}
.chip.armed{border-color:var(--accent-green);box-shadow:var(--ring-green)}
.chip .chip-armprompt{font-size:11px;color:var(--accent-green);font-weight:700;letter-spacing:.06em}

/* ---------- ordering ---------- */
.seq{list-style:none;margin:0;padding:0}
.seq li{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:8px 0;min-height:52px}
.seq .seq-pos{font-family:var(--font-mono);font-weight:700;color:var(--accent-amber);min-width:30px;text-align:center}
.seq .seq-text{flex:1;font-size:15px;color:var(--text-primary)}
.seq .seq-btns{display:flex;gap:6px}
.seq .seq-btns button{min-width:44px;min-height:44px}
.seq li.state-correct{border-color:var(--state-correct)}
.seq li.state-wrong{border-color:var(--state-incorrect)}

/* ---------- fill in the blank ---------- */
.blanks{font-size:16px;color:var(--text-primary);line-height:2.1}
.blank-in{font-family:var(--font-mono);font-size:14.5px;background:var(--bg-surface-2);border:1px solid var(--border);border-bottom:2px solid var(--accent-green);border-radius:6px;color:var(--text-mono);padding:9px 10px;width:200px;min-height:44px}
.blank-in.state-correct{border-color:var(--state-correct)}
.blank-in.state-wrong{border-color:var(--state-incorrect)}

/* ---------- terminal ---------- */
.shell{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;font-family:var(--font-mono);font-size:14.5px;color:var(--text-mono);padding:12px 14px}
.shell .scroll{max-height:230px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.shell .promptline{display:flex;align-items:center;gap:8px;margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
.shell .prompt{color:var(--accent-green);font-weight:700;white-space:nowrap}
.shell input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text-mono);font-family:var(--font-mono);font-size:14.5px;padding:12px 4px;min-width:200px;min-height:44px}
.shell input:focus{outline:none;border-bottom-color:var(--accent-green)}
.shell .out-err{color:var(--state-incorrect)}
.shell .out-ok{color:var(--text-mono)}
.syntaxpanel{background:var(--bg-surface-2);border:1px solid var(--border);border-left:4px solid var(--accent-blue);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14px}
.syntaxpanel .sp-title{font-weight:700;color:var(--accent-blue);font-size:13px;letter-spacing:.06em}

/* ---------- log viewer ---------- */
.logtool{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.logtool .logbar{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.logtool .logbar .lg-title{font-size:12.5px;font-family:var(--font-mono);color:var(--accent-blue);letter-spacing:.05em}
.logtool input{flex:1;min-width:180px;min-height:44px;background:var(--bg-page);border:1px solid var(--border);border-radius:6px;color:var(--text-mono);font-family:var(--font-mono);font-size:13.5px;padding:8px 10px}
.loglines{max-height:300px;overflow:auto;padding:8px 10px;font-family:var(--font-mono);font-size:13.5px;line-height:1.65;color:var(--text-mono)}
.loglines .ln{white-space:pre-wrap;word-break:break-word}
.loglines .lnmark{color:var(--accent-amber)}

/* ---------- branching ---------- */
.step{border:1px solid var(--border);border-left:4px solid var(--accent-blue);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin:12px 0}
.step .step-tag{display:inline-block;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--accent-blue);letter-spacing:.08em;margin-bottom:6px}
.step .step-text{color:var(--text-primary);font-size:15.5px;margin-bottom:10px}
.outcome{border-left:4px solid var(--accent-green);background:var(--tint-green-faint);border-radius:6px;padding:8px 12px;margin:10px 0 2px 0;font-size:14.5px;color:var(--text-primary)}
.outcome.bad{border-left-color:var(--state-incorrect);background:var(--tint-red-faint)}

/* ---------- hint & feedback ---------- */
.hintpanel{border:1px solid var(--border);border-left:4px solid var(--accent-amber);background:var(--tint-amber);border-radius:8px;padding:10px 14px;margin:12px 0;color:var(--text-primary);font-size:15px}
.hintpanel .hint-tag{font-weight:700;color:var(--accent-amber);font-size:12.5px;letter-spacing:.07em;display:block;margin-bottom:4px}
.feedback{border:1px solid var(--border);border-radius:10px;margin:16px 0 4px 0;overflow:hidden;background:var(--bg-surface)}
.feedback .fb-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700}
.feedback.f-correct .fb-head{border-left:5px solid var(--state-correct)}
.feedback.f-partial .fb-head{border-left:5px solid var(--state-partial)}
.feedback.f-incorrect .fb-head{border-left:5px solid var(--state-incorrect)}
.feedback .fb-body{padding:14px 16px}
.fb-correct-answer{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:15px}
.fb-correct-answer .fb-ca-tag{font-weight:700;color:var(--accent-green);font-size:12.5px;letter-spacing:.06em;display:block;margin-bottom:4px}
.fb-items{list-style:none;margin:10px 0 0 0;padding:0}
.fb-items li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--border);border-radius:8px;margin:7px 0;background:var(--bg-surface-2);font-size:14.5px}
.fb-items .fi-ico{font-weight:700;flex:none;font-size:15px}
.fb-items .fi-note{display:block;color:var(--text-secondary);font-size:13.5px;margin-top:3px}
.studypointer{margin-top:12px;font-size:14.5px;color:var(--text-secondary);border-top:1px dashed var(--border);padding-top:10px}
.creditline{font-size:14px;color:var(--text-secondary)}

/* ---------- intro screen ---------- */
.intro-hero{background:linear-gradient(135deg,var(--tint-blue),var(--tint-purple)),var(--bg-surface);border:1px solid var(--border);border-radius:12px;padding:22px 24px;margin:16px 0}
.intro-hero h1{margin:0 0 6px 0;font-size:24px}

.factrow{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:14px}
.fact{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--text-secondary)}
.fact b{color:var(--text-primary)}
.themegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:8px}
.themebox{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}

.themebox li{margin:4px 0}
.rulelist{margin:8px 0 0 0;padding-left:0;list-style:none}

.rulelist li:last-child{border-bottom:none}
.rulelist .rl-ico{flex:none;font-weight:700}
.typechips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px 0}
.typechip{font-size:13px;font-weight:600;color:var(--text-secondary);border:1px solid var(--border);border-radius:999px;padding:5px 12px;background:var(--bg-surface-2)}
.kw-note{color:var(--text-secondary);font-size:13.5px;margin-top:8px}

.reviewlist{list-style:none;margin:0;padding:0}
.reviewlist li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin:8px 0;background:var(--bg-surface-2);flex-wrap:wrap}
.reviewlist .rv-title{flex:1 1 260px;color:var(--text-primary);font-size:15px}

.rcard{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.rcard .rc-num{font-size:26px;font-weight:800}
.rcard .rc-lab{font-size:13.5px;color:var(--text-secondary);margin-top:4px;letter-spacing:.03em}
.cert{border-radius:12px;padding:20px 22px;margin:16px 0;border:1px solid}
.cert.pass{border-color:var(--state-correct);background:linear-gradient(135deg,var(--tint-green-hero),transparent)}
.cert.fail{border-color:var(--state-incorrect);background:linear-gradient(135deg,var(--tint-red-hero),transparent)}
.cert h2{margin:0 0 6px 0;font-size:22px}
.cert p{margin:6px 0;color:var(--text-primary)}
.pauselog{color:var(--text-secondary);font-size:14px;border-top:1px dashed var(--border);margin-top:12px;padding-top:10px}

/* ---------- manual pause overlay ---------- */
#pauseoverlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.pausecard{max-width:460px;text-align:center;background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:12px;padding:28px}
.pausecard .pico{font-size:38px;color:var(--state-paused)}
.pausecard h2{color:var(--state-paused);margin:8px 0}
.pausecard p{color:var(--text-secondary)}

.term-clock{font-family:var(--font-mono);font-size:13px;color:var(--accent-amber);font-weight:700}
@media (max-width:720px){
  #app{padding:10px 10px 80px}
  .card,.blk-body{padding:13px}
  .topbar{gap:8px}
  .tstate{max-width:100%}
  pre.mono,pre.codeblock,.loglines{font-size:13px}
  .blank-in{width:150px}
}
@media (prefers-reduced-motion:reduce){
  #pbar::after{animation:none}
  *{transition:none !important;animation:none !important}
}
</style>

<script type="application/json" id="cm-exam-data">{"object":{"id":"T1590.001","name":"Gather Victim Network Information: Domain Properties","type":"Sub-Technique","parent":"T1590","tactic":"Reconnaissance (TA0043)","platforms":"PRE"},"learn":["This object is a sub-technique of T1590, Gather Victim Network Information. It describes attackers collecting facts about the domains a company owns: who registered them, when they expire, which name servers they use, and the contact details attached to them. Think of it as reading the company's public ID card — the one the internet hands out automatically.","Imagine you are a CTI analyst at an energy company called Aldercrest Energy. One morning a brand-new domain appears: 'aldercreast-energy[.]com' — one letter different. It was registered three days ago, behind a privacy service. Someone is preparing to pretend to be your company. Spotting that early is exactly the skill this exam trains.","You will meet this object as a CTI analyst (profiling attacker infrastructure), as a brand-protection or GRC analyst (deciding which company data should be public at all), as a SOC analyst (reading WHOIS/RDAP records and tenant API logs), and as a detection engineer (building analytics like DET0847/AN1979). Tools: WHOIS and RDAP lookups, certificate transparency logs, brand-monitoring feeds, and — for cloud tenants — public Microsoft endpoints called GetUserRealm and autodiscover.","The ATT&CK page gives this sub-technique real procedure examples: the AADInternals PowerShell tool (S0677) gathers a tenant's domain information through public Microsoft APIs, and the Sandworm Team group (G0034) researched an official parliament's internet domain before its 2019 attack. The page lists one mitigation, M1056 Pre-compromise: you cannot really prevent someone reading public records, so you minimise what is there to read. Detection is difficult — high volume, high false positives — so attention turns to later stages such as Initial Access."],"kw":["whois","registrar","registrant","creation","expiry","name-server","zone","dig","soa","ns","grep","head","sort","uniq","autodiscover","getuserrealm"],"themes":[{"name":"Recon objective & lifecycle","concepts":["feeds Phishing (T1566) initial access","enables Search Open Websites/Domains (T1593)"]},{"name":"Collection methods","concepts":["Active Scanning (T1595)"]},{"name":"Attacker value","concepts":["register lookalike/typosquat domains","validate tenant domain names"]},{"name":"Procedure examples (real)","concepts":["G0034 Sandworm Team — recon of the Parliament of Georgia's domain before the 2019 attack"]},{"name":"Mitigations & control limits","concepts":["M1056 Pre-compromise","minimize externally visible data","review public contact/admin data","monitor for lookalike registrations","registrar lock and privacy services"]},{"name":"Data sources & telemetry","concepts":["historical WHOIS/RDAP snapshots","tenant-side API request logs","certificate transparency logs"]},{"name":"Detection logic & analytics","concepts":["DET0847 detection strategy","high false-positive rate","outside enterprise visibility","surges of GetUserRealm/autodiscover requests"]},{"name":"Framework mappings & real work","concepts":["NIST CSF ID.RA-05 external exposure risk","CIS Control 13 network monitoring and defense","IR evidence handling"]}],"exercises":[{"id":"T1590-001-X01","type":"branch","title":"Two tenants of truth","summary":"Bounty researcher or hostile actor? Decide each step.","concepts":["surges of GetUserRealm/autodiscover requests","IR evidence handling","NIST CSF ID.RA-05 external exposure risk"],"perspective":"defender","tags":["trap:conflicting-signals","trap:escalate-or-gather"],"scenario":[{"label":"ARTEFACT 1 — The night's API traffic","kind":"text","text":"Source A (bounty researcher, in-programme per the platform dashboard, scope 'web endpoints'): 40 autodiscover probes, sequential names, 23:00-23:40. Source B (unknown host): 300 autodiscover probes for random strings plus GetUserRealm sweeps, 03:00-03:20, then stops. Both nights touch the same public endpoints."},{"label":"ARTEFACT 2 — Scope card","kind":"text","text":"Bounty scope: 'web endpoints of *.aldercrest-energy[.]com'. The bounty platform's own rules explicitly exclude 'tenant enumeration via Microsoft APIs'."}],"question":"Make the four senior decisions.","steps":[{"text":"Decision 1 — Source A's probes match the bounty programme. How do you classify them?","options":[{"t":"Out of scope despite the programme — the rules exclude tenant API enumeration","correct":true,"why":"Correct — scope text wins over the researcher's presence; the platform itself excludes this behaviour.","outcome":"The platform confirms: API enumeration is out of scope; researcher warned, findings void.","outcomeBad":false},{"t":"Authorised — the dashboard shows them in-programme","correct":false,"why":"The dashboard shows membership, not scope; the written rules exclude this activity.","outcome":"Out-of-scope activity is waved through; the rules become decorative.","outcomeBad":true},{"t":"Hostile — anyone probing at night is an attacker","correct":false,"why":"The programme membership and timing argue engagement, not hostility; scope is the real question.","outcome":"A researcher is blocked and the programme relationship sours.","outcomeBad":true}]},{"text":"Decision 2 — Source B's random-string sweep is clearly hostile. What is the first action?","options":[{"t":"Snapshot the tenant API logs and the lookalike registration records before anything else","correct":true,"why":"Correct — the evidence (logs, records) is the raw material for every later step; capture first.","outcome":"Logs and records preserved; the 300-name list later matches the phishing wave's targets.","outcomeBad":false},{"t":"Shut the tenant API endpoints to the whole internet","correct":false,"why":"Mail clients worldwide need those endpoints; a global shutdown is an outage disguised as defence.","outcome":"Remote clients fail all morning; the actor already has the data.","outcomeBad":true},{"t":"Reply to the probing host to scare them off","correct":false,"why":"Nothing useful comes from engaging; it only confirms detection.","outcome":"The host rotates within minutes.","outcomeBad":true}]},{"text":"Decision 3 — Evidence shows B's random list later matched real mailboxes. What does that change?","options":[{"t":"It upgrades the case: the enumeration fed a targeting list — treat as pre-phishing recon","correct":true,"why":"Correct — knowledge transfer from probe list to target list is the escalation evidence.","outcome":"Case upgraded to pre-attack recon; phishing-response team engaged early.","outcomeBad":false},{"t":"Nothing — random probes are just noise","correct":false,"why":"The match to real mailboxes is the opposite of noise — it is the impact proof.","outcome":"The escalation moment is missed; the wave lands better prepared.","outcomeBad":true},{"t":"It proves a breach of the tenant itself","correct":false,"why":"Public API reads do not prove compromise — over-claiming misdirects the response.","outcome":"Effort shifts to a breach hunt while the phishing prep continues.","outcomeBad":true}]},{"text":"Decision 4 — The board wants one line. Which is defensible?","options":[{"t":"'Hostile tenant enumeration (Source B) separate from out-of-scope researcher activity (Source A); exposure review ordered.'","correct":true,"why":"Correct — it separates the actors, names the behaviour, and commits to the exposure review (ID.RA-05 thinking).","outcome":"The board approves the exposure review and the API monitoring tune.","outcomeBad":false},{"t":"'We were attacked by our own bug bounty.'","correct":false,"why":"Wrong actor, wrong story — and it torpedoes a valuable programme.","outcome":"The programme is paused; real attackers keep probing.","outcomeBad":true},{"t":"'Nothing left the tenant; case closed.'","correct":false,"why":"The mailbox-name match shows the information left and was used.","outcome":"A false all-clear precedes the phishing wave.","outcomeBad":true}]}],"hint":"Scope text beats programme membership; capture beats shutdown; matched names beat assumptions.","explain":"The branch resolves the conflicting signals: A is engagement without authorisation for this behaviour; B is hostile enumeration that demonstrably fed a target list. Every decision depends on that first scope reading.","study":"Bounty scope interpretation and tenant-API enumeration casework."},{"id":"T1590-001-X02","type":"terminal","title":"Count the enumerating sources","summary":"Read-only pipeline: who asked GetUserRealm, how often.","concepts":["surges of GetUserRealm/autodiscover requests","tenant-side API request logs","IR evidence handling"],"perspective":"defender","tags":["trap:real-cost"],"skill":"log-aggregation-pipeline","scenario":[{"label":"ARTEFACT 1 — Environment","kind":"text","text":"On the API gateway (Linux). Objective: for the bridge, print a per-source-IP count of GetUserRealm requests from the tenant API log — read-only, evidence untouched. Standard tools are available."}],"question":"Type the command that prints each source IP with its GetUserRealm request count.","cmd":{"timeLimit":300,"prompt":"ir@gw01:~$","canonical":"grep -i getuserrealm /var/log/nginx/tenant-api.log | awk '{print $1}' | sort | uniq -c","nearMiss":"grep -i getuserrealm /var/log/nginx/tenant-api.log | sudo tee /var/log/nginx/tenant-api.log","outputs":[{"re":"grep\\s+-i\\s*getuserrealm\\s+/var/log/nginx/tenant-api\\.log\\s*\\|\\s*awk\\s*'\\{print \\$1\\}'\\s*\\|\\s*sort\\s*\\|\\s*uniq\\s+-c","lines":["   1 10[.]44[.]2[.]15"," 300 198[.]51[.]100[.]9"]}],"unknown":"pipeline error — search, extract the first field, sort, then count.","elements":[{"re":"\\bgrep\\b","label":"grep (read-only search)","why":"Selects the GetUserRealm lines without touching anything."},{"re":"-i","label":"Case-insensitive flag","why":"Log casing varies between entries."},{"re":"getuserrealm","label":"The GetUserRealm pattern","why":"The tasked endpoint."},{"re":"/var/log/nginx/tenant-api\\.log","label":"The evidence log path","why":"The tenant API access log."},{"re":"awk\\s*'\\{print \\$1\\}'","label":"awk extracting field 1 (source IP)","why":"Each line starts with the source IP — field 1."},{"re":"\\bsort\\b","label":"sort","why":"Groups equal IPs together for counting."},{"re":"uniq\\s+-c","label":"uniq -c (count per group)","why":"Produces the per-source counts the bridge asked for."}],"forbidden":[{"re":"\\brm\\b|\\bmv\\b|\\btruncate\\b|>\\s*/var/log|systemctl (restart|stop|reload)","label":"a log-modifying or service action","why":"Anything that writes, moves, truncates, or restarts taints or destroys evidence — the DANGEROUS near-miss."},{"re":"\\bsudo tee\\b","label":"writing back into the log","why":"A write to the evidence file breaks its integrity."}]},"hint":"Four stages: search, extract the IP field, sort, count. All read-only.","explain":"'grep -i getuserrealm <log> | awk '{print $1}' | sort | uniq -c' yields the per-source counts (300 vs 1). The DANGEROUS near-misses are the log-modifying verbs — rm/mv/truncate/redirect/restart — which would destroy the case.","study":"Read-only log aggregation pipelines for incident evidence."},{"id":"T1590-001-X03","type":"mcq","title":"Which signal wins tonight?","summary":"Identical timing to an authorised scan — resolve it properly.","concepts":["surges of GetUserRealm/autodiscover requests","high false-positive rate","outside enterprise visibility"],"perspective":"attacker","tags":["trap:conflicting-signals"],"scenario":[{"label":"ARTEFACT 1 — Two readings","kind":"text","text":"Signal 1: the probe schedule matches the authorised asset-scan window exactly (same minutes). Signal 2: the probe names are strings the scanner has never used — and three of them match mailbox aliases retired last year but still listed in an old public PDF."}],"question":"Which signal resolves the case, and why?","options":[{"t":"Signal 2 — knowledge of retired aliases proves data-driven targeting, not scheduled scanning","correct":true,"why":"Correct — the scanner could not know retired aliases from an old PDF unless it did its own harvesting; knowledge outranks timing."},{"t":"Signal 1 — matching the scan window proves it is the scanner","correct":false,"why":"Timing is the cheapest thing for an attacker to copy — the mimicry trap."},{"t":"Neither — aliases in a PDF are public anyway","correct":false,"why":"Public-but-forgotten is exactly what this recon harvests; the knowledge still evidences targeting."},{"t":"Both — average them out to medium confidence and stop","correct":false,"why":"Signals of different evidentiary weight do not average; knowledge dominates."}],"hint":"Ask which signal requires information the authorised scanner does not have.","explain":"Timing mimicry is cheap; knowledge of retired aliases harvested from an old PDF is data-driven targeting. Conflicting signals resolve by asking what each side could actually know.","study":"Weighing mimicry versus knowledge in recon attribution."},{"id":"T1590-001-X04","type":"logview","title":"Prove the tenant enumeration","summary":"Two log lines close the case — pick them.","concepts":["surges of GetUserRealm/autodiscover requests","tenant-side API request logs","validate tenant domain names"],"perspective":"defender","tags":["trap:conflicting-signals"],"logTitle":"tenant API log, 03:00-03:25 + tenant registry","filterPlaceholder":"filter lines...","multi":true,"log":["03:02:11  198[.]51[.]100[.]9  GET /autodiscover/autodiscover.json?Email=q8zk1@aldercrest-energy[.]com  401","03:02:40  198[.]51[.]100[.]9  GET /autodiscover/autodiscover.json?Email=q8zk2@aldercrest-energy[.]com  401","03:11:52  198[.]51[.]100[.]9  GET /getuserrealm?login=finance.team@aldercrest-energy[.]com  200  Managed","03:12:03  198[.]51[.]100[.]9  GET /getuserrealm?login=hr.payroll@aldercrest-energy[.]com  200  Managed","03:20:44  registry  tenant domains: aldercrest-energy[.]com (verified), aldercrest-energy[.]net (unverified)","03:22:10  10[.]44[.]2[.]15  GET /autodiscover/autodiscover.json?Email=c.diaz@aldercrest-energy[.]com  200 (internal client)"],"options":[{"t":"The 03:11-03:12 GetUserRealm 200s for finance and HR from the external IP","correct":true,"why":"Correct — confirmed tenant responses for value mailboxes from the hostile source: enumeration with results."},{"t":"The 03:02 401 probe pair","correct":true,"why":"Correct — the guessing phase (random names, 401s) from the same IP is the enumeration's shape."},{"t":"The registry line listing the tenant domains","correct":false,"why":"The registry's own view of its domains — internal state, not hostile evidence."},{"t":"The internal client's 200 at 03:22","correct":false,"why":"Baseline client behaviour — the near-miss that proves nothing here."}],"question":"Select the TWO lines that together prove hostile tenant enumeration.","hint":"One line shows the guessing; two consecutive ones show it landing. The internal client is always a decoy.","explain":"Guessing (401 burst) plus landing (GetUserRealm 200s on value mailboxes) from the same external IP is the proof pair. Registry state and internal clients are the traps.","study":"Proof pairs in tenant enumeration casework.","scenario":[{"label":"ARTEFACT 1 — tenant API log, 03:00-03:25 + tenant registry","kind":"text","text":"You are reviewing this export in the SOC log viewer. Two log lines close the case — pick them. Use the filter box to narrow the lines before answering."}]},{"id":"T1590-001-X05","type":"dnd","title":"Build the pre-attack board","summary":"Four artefacts into enumeration, registration, authorised, or noise.","concepts":["surges of GetUserRealm/autodiscover requests","register lookalike/typosquat domains","G0034 Sandworm Team — recon of the Parliament of Georgia's domain before the 2019 attack","certificate transparency logs"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Case board columns","kind":"text","text":"TENANT ENUMERATION / REGISTRATION RECON / AUTHORISED ACTIVITY / NOISE. Four artefacts, one column each. Reference: the page's own Sandworm example shows how domain recon precedes attacks."}],"question":"Drag each artefact to its column.","zones":[{"name":"TENANT ENUMERATION","accepts":[0],"why":"The GetUserRealm sweep with confirmed responses is enumeration."},{"name":"REGISTRATION RECON","accepts":[1],"why":"A fresh brand-typo registration two weeks pre-wave is registration recon."},{"name":"AUTHORISED ACTIVITY","accepts":[2],"why":"The bounty researcher's web-endpoint scan is in-scope work."},{"name":"NOISE","accepts":[3],"why":"A CT entry for an unrelated company's subdomain is background."}],"bank":[{"t":"300 random-name autodiscover probes + 2 confirmed GetUserRealm hits","whyMiss":"Guessing plus landing = enumeration."},{"t":"aldercreast-energy[.]com registered 14 days pre-wave, privacy-hidden","whyMiss":"Fresh brand imitation = registration recon."},{"t":"Researcher's scoped web-endpoint scan, dashboard-verified","whyMiss":"In-scope programme activity — authorised."},{"t":"CT log entry for shop.someotherbrand[.]com","whyMiss":"Unrelated certificate issuance — noise."}],"hint":"Ask per artefact: did it enumerate, register, stay in scope, or belong to someone else entirely?","explain":"The board mirrors the Sandworm pattern at small scale: recon (both registry and tenant) precedes the wave, and authorised work runs alongside it. Mis-filing any artefact distorts the pre-attack narrative.","study":"Pre-attack case boards for domain-property recon."},{"id":"T1590-001-X06","type":"terminal","title":"Quietly verify the lookalike's zone","summary":"One read-only query — no enumeration-shaped traffic.","concepts":["WHOIS / RDAP records","historical WHOIS/RDAP snapshots","IR evidence handling","Active Scanning (T1595)"],"perspective":"defender","tags":["trap:real-cost"],"skill":"quiet-verification-query","scenario":[{"label":"ARTEFACT 1 — Bridge request","kind":"text","text":"Confirm the lookalike zone is live and note its serial, for the takedown evidence. Rules: one read-only DNS query; nothing that resembles enumeration (the actor watches for responders' traffic shapes); no recursion tricks."}],"question":"Type the single command that reads the lookalike zone's SOA record, short output.","cmd":{"timeLimit":300,"prompt":"ir@jump:~$","canonical":"dig soa aldercreast-energy[.]com +short","nearMiss":"dig axfr aldercreast-energy[.]com","outputs":[{"re":"dig\\s+soa\\s+aldercreast-energy\\[.\\]com\\s+\\+short","lines":["ns1.mailsetup[.]example. hostmaster.mailsetup[.]example. 2026102105 7200 3600 1209600 3600"]}],"unknown":"command not recognised — one record type, the domain, and the short-output flag.","elements":[{"re":"\\bdig\\b","label":"Uses dig","why":"A single quiet query."},{"re":"(^|\\s)soa(\\s|$)","label":"Reads the SOA","why":"Serial and zone health live in SOA."},{"re":"aldercreast-energy\\[.\\]com","label":"Targets the lookalike","why":"The evidence tasking names the lookalike, not the real brand."},{"re":"\\+short","label":"Keeps output short","why":"One clean line for the evidence bundle."}],"forbidden":[{"re":"(^|\\s)axfr(\\s|$)","label":"an AXFR attempt","why":"A zone-pull from YOUR host mimics attacker behaviour and tips observers — the DANGEROUS near-miss."},{"re":"@?ns\\d","label":"naming their name server directly","why":"Unnecessary direct contact with the hostile infrastructure; the public answer suffices."},{"re":"\\bwhois\\b.*\\|.*\\bgrep\\b","label":"a whois pipeline","why":"The tasking asks for zone liveness (SOA), not registry fields — wrong data class."}]},"hint":"One record type carries the serial; one flag gives you the single-line output. Do not contact their name server directly and do not pull the zone.","explain":"'dig soa <lookalike> +short' answers liveness and serial in one query — the lightest possible member of the active-probe (T1595) family. The DANGEROUS near-misses — axfr from your own host, or direct @ns queries — mimic attacker traffic and can tip the operator mid-response.","study":"Quiet verification queries for takedown evidence."},{"id":"T1590-001-X07","type":"match","title":"Weight the attribution evidence","summary":"Four artefacts and how much attribution weight each carries.","concepts":["register lookalike/typosquat domains","feeds Phishing (T1566) initial access","registrar lock and privacy services"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Attribution weighing","kind":"text","text":"For each artefact, the review asks: how much does it actually move attribution confidence?"}],"question":"Match each artefact to its evidentiary weight.","left":[{"t":"Lookalike registered 3 days pre-wave, MX live","match":0,"why":"Timing plus arming is strong behavioural evidence."},{"t":"Mail host shared with two prior campaign domains","match":1,"why":"Infrastructure reuse across campaigns is a solid moderate signal."},{"t":"WHOIS privacy service on the lookalike","match":2,"why":"Privacy is used by everyone from marketers to attackers — near-zero weight."},{"t":"Bounty ticket covering the same hour","match":3,"why":"A documented authorisation for that window is exculpatory for the researcher."}],"right":[{"t":"Strong — timing plus arming","why":"Few benign reasons explain a live-mail imitation days before a wave."},{"t":"Moderate — shared infrastructure","why":"Hosts are rented and resold; reuse supports, but does not prove, common operators."},{"t":"Weak — privacy alone","why":"Privacy is common practice; it excludes almost nothing."},{"t":"Exculpatory — documented authorisation","why":"A covering ticket removes the researcher from that window's suspicion."}],"hint":"Timing, reuse, hygiene, authorisation — four different weights.","explain":"Attribution discipline: behavioural timing weighs most, infrastructure reuse supports, hygiene signals weigh almost nothing, and authorisation records exculpate. Mis-weighted evidence is how wrong accusations happen.","study":"Evidence weighting in domain-attribution work."},{"id":"T1590-001-X08","type":"multi","title":"Defensible conclusions","summary":"Which three survive the review?","concepts":["feeds Phishing (T1566) initial access","surges of GetUserRealm/autodiscover requests","NIST CSF ID.RA-05 external exposure risk","monitor for lookalike registrations"],"perspective":"defender","tags":["trap:conflicting-signals"],"scenario":[{"label":"ARTEFACT 1 — Draft conclusions","kind":"text","text":"Facts: lookalike registered 14 days pre-wave and armed; hostile tenant enumeration with two confirmed hits; researcher activity out-of-scope but non-hostile; old PDF exposed retired aliases; no tenant compromise detected."}],"question":"Select the three defensible conclusions.","options":[{"t":"The domain-property recon demonstrably prepared the phishing wave","correct":true,"why":"Correct — registration, arming, and enumeration all precede and enable the wave."},{"t":"The exposed alias list (old PDF) materially helped the enumeration","correct":true,"why":"Correct — three probe names matched the PDF exactly; external data minimisation is now a risk item (ID.RA-05 thinking)."},{"t":"The researcher's activity warrants a scope reminder, not an incident","correct":true,"why":"Correct — out-of-scope but programme-affiliated: correct with the process, do not escalate to hostile."},{"t":"The enumeration proves the tenant was breached","correct":false,"why":"Public API reads prove exposure, not compromise — over-claiming misdirects effort."},{"t":"Because no data 'left' the tenant, nothing needs reporting","correct":false,"why":"Tenant responses (200s) and the later target-list match show the information did leave and was used."},{"t":"WHOIS privacy proves the registrant is hostile","correct":false,"why":"Privacy is common hygiene — near-zero evidentiary weight."}],"hint":"Separate preparation evidence, external-exposure findings, and process fixes from over-claims.","explain":"Defensible conclusions tie claims to evidence classes: preparation (artefact chain), exposure (the PDF match), and process (scope reminder). The rejected three each over- or under-read their evidence.","study":"Evidence-class discipline for domain-property casework."},{"id":"T1590-001-X09","type":"order","title":"Sequence the response","summary":"Five steps from verification to published detection tuning.","concepts":["IR evidence handling","monitor for lookalike registrations","CIS Control 13 network monitoring and defense","DET0847 detection strategy"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Response cards (shuffled)","kind":"text","text":"Cards: 'Verify the researcher's authorisation in writing' · 'Snapshot WHOIS/RDAP and tenant API logs' · 'File the takedown with the evidence bundle' · 'Publish the staff alert with the exact sender pattern' · 'Tune DET0847-style analytics and publish the API-monitoring change'."}],"question":"Order the five response steps.","sequence":["Verify the researcher's authorisation in writing","Snapshot WHOIS/RDAP and tenant API logs","File the takedown with the evidence bundle","Publish the staff alert with the exact sender pattern","Tune DET0847-style analytics and publish the API-monitoring change"],"orderWhy":["Resolve the authorised-actor question first so evidence attribution is clean.","Snapshots freeze the artefacts everything else cites.","The takedown moves on preserved evidence.","Staff protection cannot wait for registries — alert with the exact pattern.","Hardening and tuning are the deliverables that outlast the incident."],"hint":"Authorisation, evidence, enforcement, people, permanence.","explain":"The sequence separates what must precede what: authorisation before attribution, snapshots before filings, and staff alerts before registry timelines. CIS Control 13's monitoring goal lands in the final step.","study":"Dependency-ordered response for lookalike and enumeration incidents."},{"id":"T1590-001-X10","type":"mcq","title":"The privacy-myth trap","summary":"Why 'WHOIS privacy everywhere' does not stop this recon.","concepts":["M1056 Pre-compromise","minimize externally visible data","WHOIS / RDAP records"],"perspective":"defender","tags":["trap:best-practice-wrong"],"scenario":[{"label":"ARTEFACT 1 — Proposal","kind":"text","text":"Proposal: 'Enable WHOIS privacy on every domain — that stops domain reconnaissance.' The CTI lead must correct the record before the board votes."}],"question":"Which correction is right?","options":[{"t":"Privacy hides registrant contact data; it does nothing about tenant API exposure or CT logs","correct":true,"why":"Correct — the recon also read tenant endpoints and certificates; privacy touches only the registry record."},{"t":"Privacy also hides MX records and certificates","correct":false,"why":"Neither: MX must be public for mail, and CT logs are publication-by-design."},{"t":"Correct as proposed — privacy stops all domain recon","correct":false,"why":"It addresses one of several public surfaces."},{"t":"Only deleting all public records works","correct":false,"why":"Impossible for active domains — and self-harming where partially possible."}],"hint":"Ask which of the night's three artefacts (WHOIS, tenant API, CT) privacy actually touches.","explain":"The best-practice trap: WHOIS privacy is correct hygiene for the registry record but irrelevant to tenant API and CT exposure. Real reduction is role aliases, minimised records, AND tenant/CT monitoring.","study":"What registry privacy does and does not hide."},{"id":"T1590-001-X11","type":"logview","title":"The certificate that proves intent","summary":"Which CT entry shows the lookalike was armed for mail?","concepts":["certificate transparency logs","register lookalike/typosquat domains","feeds Phishing (T1566) initial access"],"perspective":"defender","tags":["trap:conflicting-signals"],"logTitle":"certificate transparency entries (lookalike zone)","filterPlaceholder":"filter entries...","log":["CT1  aldercreast-energy[.]com                (root, no sub)      Let's Encrypt","CT2  mail.aldercreast-energy[.]com           (mail host)         Let's Encrypt","CT3  login.aldercreast-energy[.]com          (portal clone)      Let's Encrypt","CT4  staging.aldercrest-energy[.]com         (your own zone)     internal CA","CT5  shop.othercompany[.]example             (unrelated)         Let's Encrypt"],"options":[{"t":"CT2 — a certificate for mail.<lookalike>, issued three days pre-wave","correct":true,"why":"Correct — a mail-host certificate is the arming evidence: the zone was set up to send or receive mail."},{"t":"CT1 — the root domain certificate","correct":false,"why":"A bare certificate proves hosting, not mail arming — the weaker near-miss."},{"t":"CT3 — the login-clone certificate","correct":false,"why":"Strong corroborating evidence of portal cloning — but the question asks for the MAIL-arming line, which is CT2."},{"t":"CT4 — your own staging certificate","correct":false,"why":"Your own zone's internal CA entry — routine, however it sits in the feed."}],"question":"Which single CT line proves the lookalike was armed to SEND mail?","hint":"One subdomain name says 'this zone will carry mail'.","explain":"CT2's mail.<lookalike> certificate is the mail-arming proof for takedown bundles. CT3 corroborates the portal clone (useful, but different evidence), CT1 is weaker, and CT4 is your own estate.","study":"Reading CT logs for lookalike arming evidence.","scenario":[{"label":"ARTEFACT 1 — certificate transparency entries (lookalike zone)","kind":"text","text":"You are reviewing this export in the SOC log viewer. Which CT entry shows the lookalike was armed for mail? Use the filter box to narrow the lines before answering."}]},{"id":"T1590-001-X12","type":"fib","title":"Write the exposure finding","summary":"Two words complete the PDF-exposure finding.","concepts":["minimize externally visible data","review public contact/admin data","enables Search Open Websites/Domains (T1593)"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — Finding 4 draft","kind":"text","text":"Draft: 'A 2024 brochure PDF published retired mailbox {b0}; the actor's probes matched it exactly — evidence that {b1} externally available data is an ongoing risk.'"}],"question":"Fill the two blanks of the finding.","template":"A 2024 brochure PDF published retired mailbox {b0}; the actor's probes matched it exactly — evidence that {b1} externally available data is an ongoing risk.","blanks":[{"accept":["aliases","alias","addresses","names"],"why":"The PDF exposed retired mailbox aliases — the matched artefact.","whyMiss":"The PDF's contribution was the alias list, not passwords or certificates."},{"accept":["minimizing","minimising","reducing"],"why":"M1056's verb: minimise what is externally available.","whyMiss":"The lesson is minimisation — not publishing more or encrypting PDFs alone."}],"hint":"Blank one: what the PDF exposed. Blank two: M1056's verb for external data.","explain":"The finding closes the loop from exposure to targeting: published aliases were harvested and used — exactly the open-websites exposure that Search Open Websites/Domains (T1593) describes. That is the business case for the M1056 hygiene programme.","study":"Linking external data exposure to targeting evidence."},{"id":"T1590-001-X13","type":"triage","title":"The board's four asks","summary":"Comply, gather first, or decline with rationale.","concepts":["monitor for lookalike registrations","M1056 Pre-compromise","surges of GetUserRealm/autodiscover requests","registrar lock and privacy services"],"perspective":"defender","tags":["trap:escalate-or-gather","trap:real-cost"],"scenario":[{"label":"ARTEFACT 1 — Board asks (Friday 18:00)","kind":"text","text":"1) 'Sue the researcher.' 2) 'Publish the actor's infrastructure tonight.' 3) 'Tell us which properties we must shrink.' 4) 'Disable autodiscover tonight.'"}],"question":"Choose the best response to each ask.","rows":[{"alert":"'Sue the researcher.'","detail":"Activity was out-of-scope but non-destructive and disclosed.","options":["Comply now","Gather more evidence first","Decline with rationale"],"correctIndex":2,"why":"Litigation for out-of-scope-but-disclosed probing is disproportionate; the platform's own warning process is the proportionate tool.","whyNot":{"0":"Suing a researcher poisons the programme and likely loses.","1":"The facts are already known — no evidence is missing."}},{"alert":"'Publish the actor's infrastructure tonight.'","detail":"Attribution confidence: medium; infrastructure rotates weekly.","options":["Comply now","Gather more evidence first","Decline with rationale"],"correctIndex":1,"why":"Medium confidence plus rotating infrastructure makes publication premature — gather first.","whyNot":{"0":"Publishing shaky attribution tips the actor and risks errors.","2":"It is sequencing, not refusal."}},{"alert":"'Tell us which properties we must shrink.'","detail":"The M1056 review is drafted and evidence-backed.","options":["Comply now","Gather more evidence first","Decline with rationale"],"correctIndex":0,"why":"The review is complete — deliver the shrink list with owners and dates.","whyNot":{"1":"The evidence exists; delay adds nothing.","2":"Declining an answerable governance question erodes trust."}},{"alert":"'Disable autodiscover tonight.'","detail":"Remote mail clients depend on it; the enumeration already succeeded.","options":["Comply now","Gather more evidence first","Decline with rationale"],"correctIndex":2,"why":"Disabling breaks remote mail for zero gain — the data already left; monitoring and tuning are the real levers.","whyNot":{"0":"A self-inflicted outage after the fact.","1":"The dependency facts are known — no gathering needed."}}],"hint":"For each ask: is it proportionate, is it ready, does complying break something?","explain":"Two asks are answerable now, one needs evidence (publication), one must be declined (autodiscover shutdown). The pattern keeps proportionality and dependencies visible under pressure.","study":"Board communication under pre-attack pressure."},{"id":"T1590-001-X14","type":"multi","title":"Costs that buy real reduction","summary":"Which two costly actions genuinely shrink the exposure?","concepts":["minimize externally visible data","monitor for lookalike registrations","NIST CSF ID.RA-05 external exposure risk"],"perspective":"defender","tags":["trap:real-cost"],"scenario":[{"label":"ARTEFACT 1 — Cost board","kind":"text","text":"The CISO approves only costs that remove a named exposure. Two are justified."}],"question":"Select the two justified actions.","options":[{"t":"Scrub retired aliases and named individuals from all public records and PDFs, with a quarterly re-check","correct":true,"why":"Correct — removes the exact data the enumeration harvested (M1056 / ID.RA-05 in action)."},{"t":"Stand up continuous lookalike monitoring with registrar-level takedown pre-agreements","correct":true,"why":"Correct — cuts the arming window from weeks to hours for every future wave."},{"t":"Disable autodiscover for everyone, permanently","correct":false,"why":"Breaks remote mail everywhere; the exposure it 'fixes' is the mail function itself."},{"t":"Buy a bigger firewall for the tenant API gateway","correct":false,"why":"The gateway is not short of capacity; the issue is exposure and monitoring, not throughput."},{"t":"Remove the organisation from all certificate transparency logs","correct":false,"why":"Impossible — CT is mandatory publication by certificate authorities."}],"hint":"Justified cost names the exposure it removes. Two options do.","explain":"Data minimisation removes the harvested material; monitoring plus pre-agreed takedowns collapses future arming windows. The rejected options are impossible, mismatched, or self-harming.","study":"Cost-justified exposure reduction for domain properties."},{"id":"T1590-001-X15","type":"fib","title":"Finish the M1056 citation","summary":"Two words quote the mitigation accurately.","concepts":["M1056 Pre-compromise","outside enterprise visibility"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Wiki citation","kind":"text","text":"Draft: 'M1056 notes the behaviours occur outside the scope of enterprise {b0}; efforts should therefore focus on {b1} the amount and sensitivity of externally available data.'"}],"question":"Fill the two blanks of the citation.","template":"M1056 notes the behaviours occur outside the scope of enterprise {b0}; efforts should therefore focus on {b1} the amount and sensitivity of externally available data.","blanks":[{"accept":["defenses","defences","defenses and controls","controls"],"why":"The page: 'outside of the scope of enterprise defenses and controls'.","whyMiss":"The phrase is enterprise defenses (and controls) — not 'monitoring' or 'networks'."},{"accept":["minimizing","minimising","reducing"],"why":"The page's verb: minimizing the amount and sensitivity of data available externally.","whyMiss":"Minimisation is the guidance — not maximizing visibility or deleting domains."}],"hint":"Blank one: what the behaviour sits outside of. Blank two: the verb applied to the data.","explain":"The accurate M1056 citation carries the whole argument: outside enterprise defences, therefore minimise externally available data. Exact quotes keep governance documents defensible.","study":"Quoting M1056 precisely in governance material."}],"severityWord":"EXTREMELY HARD","partLabel":null}</script>
<script>
'use strict';
var DATA = JSON.parse(document.getElementById('cm-exam-data').textContent);
var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var EXS = [];
var S = null;
var T = null; // timer object for current attempt

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function fmtTime(sec){
  sec = Math.max(0, sec|0);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function round1(x){ return Math.round(x*10)/10; }
function letterKey(n){ return String.fromCharCode(65+n); }
function dispKey(ex, origIdx){ return ex._optOrder ? ex._optOrder.indexOf(origIdx) : origIdx; }

var KW = (DATA.kw && DATA.kw.length) ? DATA.kw : ['show','key','log','policy','error'];
var KWRE = new RegExp('(^|[^\\w-])(' + KW.join('|') + ')(?=[^\\w-]|$)','g');
function hl(text){
  var e = esc(text);
  e = e.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g, '<span class="tok-str">$1</span>');
  e = e.replace(/\b\d{1,3}(?:\[\.\]\d{1,3}){3}\b/g, '<span class="tok-ip">$&</span>');
  e = e.replace(KWRE, function(m,p1,p2){ return p1 + '<span class="tok-kw">' + p2 + '</span>'; });
  e = e.replace(/(\s|^)(-{1,2}[A-Za-z][\w-]*)/g, '$1<span class="tok-flag">$2</span>');
  e = e.replace(/\b(\d+)\b(?![^<]*<\/span>)/g, function(m, g1, off, str){
    var before = str.slice(Math.max(0, off-6), off);
    if(before.indexOf('class=') >= 0){ return m; }
    return '<span class="tok-num">'+m+'</span>';
  });
  return e;
}

function scoreExercise(H, W, N){
  if(N <= 0){ return 0; }
  return Math.max(0, (H - W) / N);
}
function normTxt(s){
  return String(s).trim().toLowerCase().replace(/\s+/g,' ').replace(/[.,;]+$/,'');
}

/* ================= timer state machine ================= */
function setTState(st){
  T.state = st;
  var el = $('tstate');
  if(!el){ return; }
  el.className = 'tstate';
  if(st === 'RUNNING'){ el.classList.add('running'); el.innerHTML = '&#9654; RUNNING'; }
  else if(st === 'PAUSED_MANUAL'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; manual (press Resume)'; }
  else if(st === 'PAUSED_AUTO_CHECK'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; reviewing feedback (resumes on Next)'; }
  else if(st === 'ENDED'){ el.classList.add('ended'); el.innerHTML = '&#9632; ENDED'; }
  renderTimerBox();
}
function renderTimerBox(){ var el = $('timerbox'); if(el){ el.textContent = fmtTime(T.remaining); } }
function tick(){
  if(T.state === 'RUNNING'){
    T.remaining -= 1;
    renderTimerBox();
    var tc = $('termclock');
    if(tc && S && (S.screen === 'exam') && curEx() && curEx().type === 'terminal' && !curEx()._checked && curEx()._tleft !== null && curEx()._tleft !== undefined){
      curEx()._tleft -= 1;
      if(curEx()._tleft <= 0){ curEx()._tleft = 0; tc.textContent = '\u23f1 0:00 left — grading now'; curEx()._autoGrade = true; gradeCurrent(); return; }
      tc.textContent = '\u23f1 ' + Math.floor(curEx()._tleft/60) + ':' + (curEx()._tleft%60 < 10 ? '0' : '') + (curEx()._tleft%60) + ' left on this terminal (pauses with the exam timer)';
    }
    if(T.remaining <= 0){
      T.remaining = 0;
      setTState('ENDED');
      finishAttempt(true);
    }
  } else if(T.state === 'PAUSED_MANUAL'){ T.manualTotal += 1; }
  else if(T.state === 'PAUSED_AUTO_CHECK'){ T.autoTotal += 1; }
}

/* ================= intro screen ================= */
function typeLabel(t){
  return {
    mcq:'multiple choice', multi:'multi-select (partial credit)', match:'matching pairs',
    dnd:'drag & drop', order:'timeline ordering', fib:'fill-in-the-blank',
    terminal:'fake terminal command', branch:'branching decision scenario',
    triage:'SOC alert-queue triage', logview:'log viewer analysis'
  }[t] || t;
}
var TYPE_ICONS = {mcq:'A.', multi:'☑', match:'⇄', dnd:'✥', order:'↕', fib:'▁', terminal:'>_ ', branch:'⑃', triage:'▦', logview:'☰'};

function renderIntro(){
  S.screen = 'intro';
  var exTypes = [];
  DATA.exercises.forEach(function(e){ if(exTypes.indexOf(e.type) < 0){ exTypes.push(e.type); } });
  var chips = exTypes.map(function(t){ return '<span class="typechip">'+esc(TYPE_ICONS[t]||'•')+' '+esc(typeLabel(t))+'</span>'; }).join('');
  var themes = DATA.themes.map(function(th){
    return '<div class="themebox"><h4>'+esc(th.name)+'</h4><ul>'+ th.concepts.map(function(c){ return '<li>'+esc(c)+'</li>'; }).join('') +'</ul></div>';
  }).join('');
  var learn = DATA.learn.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('');
  var app = $('app');
  app.innerHTML =
  '<div class="intro-hero card">'+
    '<h1>'+esc(META.title)+'</h1>'+
    '<div class="objline"><b>'+esc(DATA.object.id)+' — '+esc(DATA.object.name)+'</b> &nbsp;·&nbsp; ATT&amp;CK object type: '+esc(DATA.object.type)+' &nbsp;·&nbsp; Tactic: '+esc(DATA.object.tactic)+'</div>'+
    '<div class="objline">Platform(s): '+esc(DATA.object.platforms)+'</div>'+
    '<div class="factrow">'+
      '<span class="badge '+sevClass()+'">'+esc(DATA.severityWord)+'</span>'+
      '<span class="fact">▦ <span><b>'+DATA.exercises.length+'</b> exercises</span></span>'+
      '<span class="fact">⏱ <span>estimated time <b>'+META.estimatedMinutes+' min</b> — the countdown timer gives you the same <b>'+META.timerMinutes+' min</b></span></span>'+
      '<span class="fact">◎ <span>pass mark <b>'+META.passMark+'%</b></span></span>'+
      (S.init && S.init.username ? '<span class="userchip">👤 Analyst: '+esc(S.init.username)+'</span>' : '')+
    '</div>'+
  '</div>'+
  '<section class="card"><h2>What you will learn here</h2>'+learn+'</section>'+
  '<section class="card"><h2>Keywords covered in this exam</h2><div class="themegrid">'+themes+'</div>'+
    '<p class="kw-note">Each keyword above is exercised at least once in this file. Themes follow the structure of the ATT&amp;CK page for '+esc(DATA.object.id)+'.</p></section>'+
  '<section class="card"><h2>How this exam works</h2>'+
    '<div class="typechips">'+chips+'</div>'+
    '<ul class="rulelist">'+
    '<li><span class="rl-ico">◎</span><span><b>Pass mark '+META.passMark+'%.</b> Your score is computed only over the exercises you actually answered (checked). PASS means you scored at least '+META.passMark+'%; FAIL means you should retake the exam.</span></li>'+
    '<li><span class="rl-ico">⚖</span><span><b>Partial credit.</b> Multi-answer exercises are graded per item: credit = max(0, (correct items selected − wrong items selected) ÷ total correct items). Selecting everything is graded 0, not full marks.</span></li>'+
    '<li><span class="rl-ico">💡</span><span><b>Hint costs 10% of the exercise credit.</b> One hint per exercise. The hint gives a nudge, never the answer.</span></li>'+
    '<li><span class="rl-ico">⏱</span><span><b>Timer.</b> A countdown runs for '+META.timerMinutes+' minutes. <b>Pause</b> is manual: it hides the exercise until you press Resume. Pressing <b>Check</b> also pauses the timer automatically while you study the feedback — the exercise stays visible, and the timer resumes only when you press <b>Next</b> (or Final Submit on the last exercise).</span></li>'+
    '<li><span class="rl-ico">⤼</span><span><b>Skip.</b> Every exercise can be skipped without penalty. Skipped exercises go to a review pool. Before you finish, you can return to them as many times as the timer allows. Skipped-and-never-answered exercises are excluded from the score completely.</span></li>'+
    '</ul>'+
    '<div class="btnrow"><button class="btn primary" id="startbtn" onclick="startAttempt()">▶ Start the exam</button></div>'+
  '</section>';
  window.scrollTo(0,0);
}

/* ================= exam flow ================= */
function constrainedShuffle(){
  var isTerm = EXS.map(function(e){ return e.type === 'terminal'; });
  var ord = EXS.map(function(e,i){ return i; });
  for(var tries=0; tries<80; tries++){
    ord = shuffle(EXS.map(function(e,i){ return i; }));
    var ok = true;
    for(var k=1; k<ord.length; k++){ if(isTerm[ord[k]] && isTerm[ord[k-1]]){ ok = false; break; } }
    if(ok){ return ord; }
  }
  return ord;
}
function startAttempt(){
  EXS = DATA.exercises.map(function(e){ return JSON.parse(JSON.stringify(e)); });
  S = {
    screen:'exam', order:[], cur:0, creditSum:0, answered:0, checkedCount:0,
    skipped:[], reported:false, init:S ? S.init : null, reviewing:null
  };
  S.order = shuffle(EXS.map(function(e,i){ return i; }));
  EXS.forEach(function(ex){
    ex._checked = false; ex._credit = 0; ex._hintUsed = false; ex._ans = null; ex._items = null; ex._autoGrade = false;
    if(ex.type === 'mcq' || ex.type === 'multi' || ex.type === 'logview'){ ex._optOrder = shuffle(ex.options.map(function(o,i){ return i; })); }
    if(ex.type === 'match'){ ex._rightOrder = shuffle(ex.right.map(function(r,i){ return i; })); }
    if(ex.type === 'dnd'){ ex._bankOrder = shuffle(ex.bank.map(function(b,i){ return i; })); }
    if(ex.type === 'order'){ ex._seq = shuffle(ex.sequence.slice()); }
    if(ex.type === 'terminal'){ ex._log = []; ex._lastCmd = null; ex._tleft = (ex.cmd && ex.cmd.timeLimit) ? ex.cmd.timeLimit : null; }
    if(ex.type === 'branch'){ ex._step = 0; ex._picks = []; ex._pendingPick = null; }
  });
  T = { remaining: META.timerMinutes*60, state:'RUNNING', iv:null, manualTotal:0, autoTotal:0 };
  if(T.iv){ clearInterval(T.iv); }
  T.iv = setInterval(tick, 1000);
  setTState('RUNNING');
  S.screen = 'exam';
  S.cur = 0;
  S.order = constrainedShuffle();
  LASTKEY = '';
  renderExamShell();
  renderExercise();
}
function curEx(){ return EXS[S.order[S.cur]]; }
function sevClass(){ return 'sev-' + (META.difficulty === 'extremely-hard' ? 'extreme' : META.difficulty); }

function renderExamShell(){
  $('app').innerHTML =
    '<div class="topbar" id="topbar">'+
      '<span class="tb-item" id="tb-counter"></span>'+
      '<span class="tb-item"><span class="badge '+sevClass()+'" id="tb-badge"></span></span>'+
      '<span class="tb-item" id="tb-part"></span>'+
      '<span class="tb-item">⏱ <span class="timerbox" id="timerbox">--:--</span> <span class="tstate" id="tstate"></span></span>'+
      '<span class="tb-item tb-score">◎ Score: <strong id="tb-score">0 / 0</strong> <span id="tb-pct">(0%)</span></span>'+
      (S.init && S.init.username ? '<span class="userchip">👤 '+esc(S.init.username)+'</span>' : '')+
      '<span style="flex:1"></span>'+
      '<button class="btn ghost" id="btn-pause" onclick="pauseManual()">⏸ Pause</button>'+
      '<button class="btn amber" id="btn-hint" onclick="doHint()">💡 Hint <small style="opacity:.8">−10%</small></button>'+
      '<button class="btn ghost" id="btn-skip" onclick="doSkip()">⤼ Skip</button>'+
    '</div>'+
    '<div id="pbarwrap"><div id="pbar"></div></div>'+
    '<div id="exarea"></div>';
  $('tb-badge').textContent = DATA.severityWord;
  $('tb-part').innerHTML = DATA.partLabel ? '<span class="statechip st-skipped">'+esc(DATA.partLabel)+'</span>' : '';
  $('pbar').style.setProperty('--sev', 'var(--sev-' + META.difficulty.replace('extremely-hard','extreme') + ')');
  renderTimerBox();
  setTState(T ? T.state : 'RUNNING');
  updateHeader();
}
function updateHeader(){
  if(!$('tb-counter')){ return; }
  var ex = curEx();
  if(S.screen === 'exam'){
    $('tb-counter').innerHTML = 'Exercise <strong>'+(S.cur+1)+'</strong> of <strong>'+EXS.length+'</strong>';
  } else if(S.screen === 'open'){
    $('tb-counter').innerHTML = '⚠ Reviewing skipped exercise <strong>'+(S.reviewPos+1)+'</strong> of <strong>'+S.skipped.length+'</strong>';
  } else if(S.screen === 'review'){
    $('tb-counter').innerHTML = 'Review skipped exercises';
  }
  $('tb-score').textContent = round1(S.creditSum).toFixed(1) + ' / ' + S.answered;
  var pct = S.answered > 0 ? Math.round((S.creditSum / S.answered) * 100) : 0;
  $('tb-pct').textContent = '(' + pct + '%)';
  var p = Math.round((S.checkedCount / EXS.length) * 100);
  $('pbar').style.width = p + '%';
  var hintDis = S.screen !== 'exam' && S.screen !== 'open';
  hintDis = hintDis || !ex || ex._hintUsed || ex._checked;
  $('btn-hint').disabled = !!hintDis;
  $('btn-skip').disabled = S.screen !== 'exam' || !ex || ex._checked;
  var pb = $('btn-pause'); if(pb){ pb.disabled = !T || T.state === 'ENDED'; }
}

/* ---------- scenario / question blocks ---------- */
function scenarioHtml(ex){
  var arts = (ex.scenario || []).map(function(a, i){
    if(a.kind === 'log' || a.kind === 'code'){
      var lines = a.text.split('\n').map(function(l){ return '<div class="ln">'+hl(l)+'</div>'; }).join('');

  }).join('');
  var sum = '<div class="blk-body" id="scen-sum" style="border-top:1px dashed var(--border);padding:10px 16px"><span class="art-label" style="padding:0 0 4px 0">⚠ ONE-LINE SUMMARY</span><p style="margin:2px 0">'+esc(ex.summary)+'</p></div>';
  return '<div class="blk scenario" id="blk-scen">'+
    '<div class="blk-head"><span class="blk-ico">🛰</span> SCENARIO'+

/* ---------- grading ---------- */
function applyHintPenalty(credit, ex){
  if(ex._hintUsed){ return Math.max(0, credit - 0.10); }
  return credit;
}
function gradeCurrent(){
  if(S.screen !== 'exam' && S.screen !== 'open'){ return; }
  var ex = curEx();
  if(ex._checked){ return; }
  if(ex.type === 'branch' && ex._step < ex.steps.length){
    var fb = $('fback');
    if(fb){ fb.innerHTML = '<div class="hintpanel"><span class="hint-tag">⏳ NOT FINISHED YET</span>Confirm every step of this decision first (the timer keeps running while you decide). The Check button unlocks after the final step.</div>'; }
    return;
  }
  var res = gradeEx(ex);
  ex._items = res.items;
  ex._dangerous = res.dangerous || false;
  ex._credit = applyHintPenalty(res.credit, ex);
  ex._checked = true;
  S.creditSum += ex._credit;
  S.answered += 1;
  S.checkedCount += 1;
  var idx = EXS.indexOf(ex);
  var poolIdx = S.skipped.indexOf(idx);
  if(poolIdx >= 0){ S.skipped.splice(poolIdx, 1); }
  if(T.state === 'RUNNING'){ setTState('PAUSED_AUTO_CHECK'); }
  renderFeedback(ex, res);
  lockAnswer();
  updateHeader();
}
