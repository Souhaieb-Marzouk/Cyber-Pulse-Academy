var META=JSON.parse(document.getElementById('cm-exercise-meta').textContent);var INTRO={"learn":["This exam is about <b>T1686.001 — Cloud Firewall<\/b>, a <b>sub-technique<\/b> of T1686 — Disable or Modify System Firewall, in the tactic <b>Defense Impairment<\/b> (TA0112), on the <b>IaaS<\/b> platform. This is the investigator tier: ambiguous evidence, attacker trade-offs, and decisions where the wrong move costs real money or destroys evidence.","You will assemble <b>full intrusion chains<\/b>: a dormant automation role taken over, a GuardDuty trust-list update that silences findings for the attacker’s address (the Pacu S1091 procedure), security group rules opened for ingress and egress, and cryptomining traffic that only makes sense once all pieces are lined up. You will judge <b>why attackers prefer narrow /32 rules, atypical ports, and legitimate-looking change shapes<\/b> — and which detections still catch them.","You will reason about <b>detection design under business constraints<\/b>: public services genuinely need some 0.0.0.0/0 rules, so blanket bans fail; the durable design is baseline diffing, atypical-port logic, and actor correlation, as worded in detection strategy DET0424 / analytic AN1188. You will also weigh <b>preventive controls (SCPs, least privilege, break-glass approval)<\/b> against <b>detective controls (analytics, GuardDuty/CloudTrail alerts)<\/b>.","Finally you will practise <b>safe incident behavior<\/b>: two terminal exercises separate the investigator who verifies with read-only commands from the one who destructively edits production — and the remediation exercise demands a surgical revoke of exactly one rule, with destructive shortcuts graded as failures."],"keywords":["T1686.001 Cloud Firewall","Intrusion chain reconstruction","GuardDuty IPSet allowlisting (Pacu S1091)","Ingress + egress expansion","0.0.0.0/0 vs /32 trade-offs","Atypical ports","Baseline diffing (AN1188)","Preventive vs detective controls","SCPs and permission boundaries","Break-glass approval workflow","Read-only triage discipline","Targeted revoke vs destructive cleanup","T1685.002 / T1686.002 / T1686.003 mapping","False-positive suppression","M1047 Audit and M1018 least privilege"],"how":["<b>Goal.<\/b> You need <b>70%<\/b> to pass. The exam has 15 exercises; the final score is a percent.","<b>Exercise types.<\/b> Single-choice, multi-select, drag-and-drop (matching and ordering), and two simulated terminal exercises built around <b>safe-vs-destructive decisions<\/b>. Multi-select and drag-and-drop give <b>partial credit<\/b>; terminal exercises are scored per element, and destructive command choices are graded as zero with an explanation.","<b>Timer.<\/b> The timer budget is 42 minutes. <b>Check<\/b> auto-pauses the countdown while feedback is displayed (“⏳ Feedback pause”) and <b>Next<\/b> resumes it. The <b>⏸ Pause<\/b> button freezes the timer on top of the auto-pause if you need a real break, and <b>Resume<\/b> returns you to the exact state you left.","<b>Hints and scoring.<\/b> Hints at this tier are deliberately vague nudges. Every opened hint costs 25% of the exercise’s credit; the penalty applies after partial credit and the credit is clamped at zero.","<b>Skip rules.<\/b> <b>Skip<\/b> moves past an exercise with no answer and no feedback. Before results, a review screen lets you answer every skipped exercise or leave it out; exercises left out are excluded from score and total."]};
var EX=[{"id":"x01","type":"single","persp":"defender","concept":"Investigation","scenario":"Kestrel Health, week 3: finance flags a 6× spike in data-transfer cost. Findings in order: (1) 40 minutes before any firewall change, a GuardDuty trusted-IP set was updated to include 198.51.100[.]9; (2) the dormant automation role <code>kg-auto-remediate<\/code> — holder of EC2 network permissions — made a session from an unknown ASN and added ingress tcp/3333 and egress tcp/3333 to 198.51.100[.]9 on group <code>sg-0b7e21aa<\/code>; (3) VPC flow logs from that hour show sustained tcp/3333 connections to a Stratum-style pool endpoint; (4) no deployment, no ticket, no IaC plan mentions any of it.","question":"Which explanation chain best fits all four findings?","options":[["The automation role was taken over; the attacker first allowlisted their address in GuardDuty, then opened ingress and egress for mining traffic, which explains the cost spike",true],["A cloud provider maintenance job changed the rules, and the cost spike is billing latency",false],["A developer was debugging the app and opened the ports; GuardDuty findings are unrelated",false],["GuardDuty produced a false positive, and the traffic is a legitimate backup stream",false]],"explanation":"<b>A is correct:<\/b> every element snaps together — the IPSet update (the Pacu-style GuardDuty allowlist, a T1686.001 procedure) silenced findings for 198.51.100[.]9 forty minutes before the firewall change made with a role that should never act interactively; port 3333 is the classic Stratum mining-protocol port; sustained pool connections explain the transfer cost. Impairment first, access second, abuse third. <b>B is wrong:<\/b> providers do not touch customer security groups silently, and a maintenance story explains neither the IPSet change nor the pool traffic. <b>C is wrong:<\/b> a debugging developer does not edit GuardDuty trust lists, and their sessions would match employment records. <b>D is wrong:<\/b> the flow logs are the ground truth — tcp/3333 to a pool is measured traffic, not a sensor artifact.","hints":["Put the four findings on a timeline and ask which one had to happen first for the others to stay invisible.","Port 3333 has a well-known workload — it is not web traffic."]},{"id":"x02","type":"multi","persp":"defender","concept":"Investigation","scenario":"You are writing the Kestrel Health timeline for the executive report and must keep only statements the evidence supports.","question":"Select every timeline statement that is fully supported by the evidence described. (Pick all that apply.)","options":[["T-40 min: GuardDuty trust list updated with 198.51.100[.]9 — detection for that address impaired before any rule changed",true],["T-0: a session of the dormant role kg-auto-remediate added ingress and egress tcp/3333 to 198.51.100[.]9 on sg-0b7e21aa",true],["T+minutes: sustained tcp/3333 connections to a pool endpoint appear in flow logs, and transfer costs spike",true],["The attacker had console access to the Kestrel Health corporate laptops",false],["The attacker deleted the CloudTrail trail before making changes",false]],"explanation":"<b>A, B and C are correct:<\/b> each restates a logged fact in order — trust-list impairment first, the role-based rule expansion second, the mining traffic and cost impact third. That ordering is also the analytic story: impair detection, open the path, then use it. <b>D is wrong:<\/b> nothing in the evidence touches corporate laptops; inventing endpoint access overstates the case and would be torn apart in review. <b>E is wrong:<\/b> the trail kept delivering — that is how the events were found at all; claiming its deletion contradicts the evidence you just cited. Precision in the timeline protects the case: unsupported statements are how attribution gets thrown out.","hints":["Three options restate the four findings with times attached — the other two invent new facts.","If the finding list never mentions laptops or a deleted trail, neither belongs in the timeline."]},{"id":"x03","type":"single","persp":"attacker","concept":"Evasion reasoning","scenario":"An operator asks why the Pacu-style GuardDuty allowlisting is classified under a Defense Impairment sub-technique at all, when nothing seems to be “turned off”.","question":"Why does allowlisting an IP in GuardDuty count as impairing a defense?","options":[["Findings about traffic from trusted-listed addresses are suppressed, so the defender’s monitoring goes blind exactly where the attacker operates",true],["It deletes GuardDuty’s stored findings from S3",false],["It disables the GuardDuty service for the entire account",false],["It encrypts GuardDuty findings so analysts cannot read them",false]],"explanation":"<b>A is correct:<\/b> a trust list tells the detection service “traffic from this address is expected”, so findings for it are not raised. The attacker does not need to kill the sensor — pointing it at a whitewashed identity achieves the same silence for their own traffic, which is precisely “degrading the effectiveness and trustworthiness of monitoring” in the tactic’s definition. <b>B is wrong:<\/b> no stored findings are deleted; only future evaluation of that address is affected. <b>C is wrong:<\/b> the service keeps running for every other address — that selectivity is what makes the move quiet. <b>D is wrong:<\/b> nothing is encrypted; the findings for everyone else arrive normally, which is why the blind spot is so hard to notice.","hints":["The attacker does not stop the engine — they poison its idea of “trusted”.","Ask what an analyst sees afterwards: more alerts, or fewer?"]},{"id":"x04","type":"terminal","persp":"defender","concept":"Safe triage","scenario":"Kestrel Health, 03:12: the on-call analyst pages you. Production group <code>sg-0b7e21aa<\/code> shows an unexpected open rule, and nobody has claimed the change. You are the senior on the bridge: the decision now is <b>verify only<\/b>.","question":"In the simulated shell, type the read-only command (or two read-only commands joined with &&) that shows the group’s current rules and who made the latest change.","shell":{"banner":"CYBERPULSE BRIDGE — PRODUCTION ACCOUNT 777788889999 · triage is read-only by policy","goal":"Verify, do not modify: show sg-0b7e21aa’s current rules AND look up the audit record of the change.","syntax":"aws ec2 describe-security-groups … && aws cloudtrail lookup-events …","expected":"{ \"SecurityGroups\": [{ \"GroupId\": \"sg-0b7e21aa\", \"IpPermissions\": [\n  { \"IpProtocol\": \"tcp\", \"FromPort\": 3389, \"ToPort\": 3389, \"IpRanges\": [{ \"CidrIp\": \"198.51.100[.]9/32\" }] }] }]\n}\n---\n{ \"Events\": [{ \"EventName\": \"AuthorizeSecurityGroupIngress\", \"Username\": \"kg-auto-remediate\",\n  \"CloudTrailEvent\": \"{ ... \\\"sourceIPAddress\\\": \\\"198.51.100[.]44\\\" ... }\" }] }","prompt":"senior@kestrel-bridge","path":"~/bridge","placeholder":"read-only verification commands only"},"checks":[{"re":"describe-security-groups\\b","label":"inspects the group’s current rules with describe-security-groups"},{"re":"sg-0b7e21aa\\b","label":"targets the flagged group sg-0b7e21aa"},{"re":"lookup-events\\b","label":"pulls the control-plane audit trail with cloudtrail lookup-events"}],"nearMiss":[{"re":"get-security-groups-for-vpc","msg":"That call lists groups per VPC but not their full rule set — describe-security-groups is the verification call."},{"re":"aws\\s+iam\\s+list-","msg":"IAM listing shows identities, not who changed a firewall rule; the change record lives in CloudTrail lookup-events."}],"destructive":{"re":"revoke-security-group-ingress|revoke-security-group-egress|authorize-security-group-ingress|delete-security-group|update-security-group-rule-definitions","msg":"That is a WRITE action. During triage you must not change the environment: altering rules mid-incident destroys the state you are investigating, can break production, and hands the attacker a confused scene. Verify first; change only after the bridge approves it."},"canonical":"aws ec2 describe-security-groups --group-ids sg-0b7e21aa && aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=AuthorizeSecurityGroupIngress","explanation":"Verification needs exactly two read-only views: <code>describe-security-groups<\/code> against <code>sg-0b7e21aa<\/code> (checks 1 and 2) for the live state, and <code>cloudtrail lookup-events<\/code> (check 3) for the who-and-how of the change. Joining them with <code>&&<\/code> is fine — the grader looks for both fragments. The destructive trap is the real exam here: any <code>revoke-…<\/code>, <code>authorize-…<\/code>, or <code>delete-security-group<\/code> call at 03:12 would edit a live incident scene — deleting evidence, risking outages, and losing the actor session you have not yet attributed. Triage reads; the bridge writes.","hints":["Both halves of the task map to one command each — the two families you already know.","Nothing you type in this task should be able to change any rule."]},{"id":"x05","type":"single","persp":"defender","concept":"Trade-offs","scenario":"Kestrel Health leadership demands: “block every 0.0.0.0/0 rule”. The platform team answers that the public booking API, the CDN health checks, and partner webhooks all <b>require<\/b> any-source ingress on 443.","question":"Which detection-and-prevention design survives this business reality best?","options":[["Allow documented any-source rules in the baseline, and alert on undocumented expansion, atypical ports, and unexplained actors via baseline diffing",true],["Block all 0.0.0.0/0 rules and accept the outage until the business relents",false],["Keep the business rules but stop logging them so the SOC is not flooded",false],["Move every workload into one security group so there is only one rule set to watch",false]],"explanation":"<b>A is correct:<\/b> it accepts that some any-source rules are the business, encodes them as the <b>approved baseline<\/b>, and directs detection effort at what actually signals T1686.001 — expansion beyond that baseline, atypical ports, and actor correlation. That is exactly the AN1188 posture: expected state plus anomaly, not absolute bans. <b>B is wrong:<\/b> a self-inflicted outage is not a control; the change board will revert it within a day and the SOC loses credibility with it. <b>C is wrong:<\/b> not logging legitimate rules blinds the baseline itself — the diff needs the full state, and “less noise by less visibility” is how blind spots are born. <b>D is wrong:<\/b> one shared group maximizes blast radius: a single bad change now exposes every workload at once.","hints":["The business constraint is fixed — the design has to work around documented exceptions.","The winning design changes the question from “is there a 0.0.0.0/0?” to “is this 0.0.0.0/0 approved?”"]},{"id":"x06","type":"dnd","mode":"match","persp":"defender","concept":"Related objects","scenario":"You are normalizing Kestrel Health’s multi-environment incident tickets into ATT&CK technique IDs. Four firewall-adjacent actions arrived from four teams.","question":"Drag each action onto the ATT&CK element it belongs to.","bank":["VPC security group ingress rule added to 0.0.0.0/0","Windows Server firewall profile switched off inside the guest OS","Border router ACL entries deleted at the colocation site","VPC flow logs turned off for the mining subnet"],"zones":[{"label":"T1686.001 — Cloud Firewall","accepts":[0]},{"label":"T1686.003 — Windows Host Firewall","accepts":[1]},{"label":"T1686.002 — Network Device Firewall","accepts":[2]},{"label":"T1685.002 — Disable or Modify Cloud Log","accepts":[3]}],"explanation":"<b>Security group rule added<\/b> — a cloud firewall object changed through the control plane — is T1686.001. <b>Guest-OS firewall profile disabled<\/b> on a Windows server is T1686.003, even though the same actor did both. <b>Router ACL entries deleted<\/b> at the colocation site are T1686.002 — a network-device firewall, not a cloud one. <b>VPC flow logs switched off<\/b> tampers with cloud logging, not with any firewall — T1685.002. The discipline here is object-first classification: the same intrusion, the same actor, four different technique IDs, and your coverage metrics are only correct if each action lands on the object it actually touched.","hints":["Two of the four actions do not modify any firewall at all — one is logging.","Cloud object, Windows object, router object: each zone name tells you its object."]},{"id":"x07","type":"single","persp":"defender","concept":"Detection","scenario":"A rule change at Kestrel Health shows all three legs at once: live state differs from the approved baseline, the assuming session belongs to a privileged role never used interactively, and no change record of any kind exists.","question":"Why does the combination justify high-confidence attacker attribution, when each leg alone does not?","options":[["Three independent signal types — state anomaly, actor anomaly, missing legitimacy record — must all be explained by one hypothesis, and only attacker activity explains all three",true],["Because three alerts always mean three attackers",false],["Because the baseline diff alone is already conclusive in every case",false],["Because privileged roles are forbidden from touching security groups by law",false]],"explanation":"<b>A is correct:<\/b> this is converging evidence. The state leg (expansion beyond baseline) says <b>something<\/b> changed; the actor leg (privileged role, interactive session, unknown ASN) says the change did not come from the usual pipeline; the record leg (no ticket, no IaC plan) removes the most common innocent explanation. Independent legs attacking the same hypothesis multiply confidence — each one alone has a mundane failure mode (drift, a new hire, a lost ticket). <b>B is wrong:<\/b> alert counts say nothing; one actor generates many alerts. <b>C is wrong:<\/b> baseline diffs fire on every legitimate IaC drift too — that is why the other legs exist. <b>D is wrong:<\/b> privilege boundaries are policy, not law, and policies are exactly what a stolen role bypasses.","hints":["Think in hypotheses: which single story explains anomaly, actor, and missing paperwork at once?","Each leg alone has a boring innocent explanation — what happens when all three fire together?"]},{"id":"x08","type":"multi","persp":"defender","concept":"Detection","scenario":"A junior engineer proposes watching only <code>AuthorizeSecurityGroupIngress<\/code>, because “attackers open doors, they do not close or build groups”.","question":"Select every accurate argument for why AN1188 watches creation, deletion, AND modification of groups and rules. (Pick all that apply.)","options":[["Creation matters: attackers can build a brand-new wide-open group and attach it, leaving the original groups clean",true],["Deletion matters: removing a rule that blocks the attacker is as useful to them as adding one that admits them",true],["Modification matters: widening an existing trusted rule (adding a port or a source) is quieter than adding a new rule",true],["Because DescribeSecurityGroups calls also change the state of the group",false],["Because deletion events are always attacker activity and never legitimate",false]],"explanation":"<b>A, B and C are correct.<\/b> Creation: a fresh group named like the platform’s own naming convention with open rules is a known pattern — the ATT&CK description literally includes “creates new security groups entirely”. Deletion: <code>RevokeSecurityGroupIngress<\/code> or deleting a group removes a rule that was in the attacker’s way; the Kestrel and Northwind playbooks both treat removal as expansion when the removed rule was protective. Modification: editing an existing trusted rule — adding a second port or a second source to a rule that already exists — produces no “new rule” event shape at all. <b>D is wrong:<\/b> Describe calls are read-only; they cannot change state. <b>E is wrong:<\/b> deletions are routine in legitimate operations (retiring services); they are signals to correlate, not verdicts.","hints":["The ATT&CK description itself names two of the three verbs.","One wrong option misunderstands which API calls are read-only; the other treats a normal operation as proof of guilt."]},{"id":"x09","type":"dnd","mode":"order","persp":"defender","concept":"Defender workflow","scenario":"The Kestrel Health bridge authorizes a multi-account response. Evidence suggests the compromised role touched groups in three production accounts during a 6-hour window.","question":"Drag the four response phases into the correct order (first phase on top).","bank":["Scope: pull every security group and firewall rule change across the three accounts for the 6-hour window","Attribute: resolve the assuming session behind each change (role chain, source address, user-agent)","Restore: revoke unauthorized rules and re-apply the approved IaC state","Validate and harden: confirm detections fire on the reverted rules in staging, then close the IAM gap"],"zones":[{"label":"Phase 1"},{"label":"Phase 2"},{"label":"Phase 3"},{"label":"Phase 4"}],"explanation":"Correct order: <b>(1) Scope<\/b> — before touching anything, know the full blast radius; in multi-account incidents, restoring account A while account B still has an open rule just moves the incident. <b>(2) Attribute<\/b> — each change needs its actor resolved (role chain, source, user-agent) so restoration does not accidentally revert a legitimate 3 a.m. emergency fix and so the report can separate attacker changes from noise. <b>(3) Restore<\/b> — revoke unauthorized rules and re-apply the approved IaC state; with scoping and attribution done, this is surgical and safe. <b>(4) Validate and harden<\/b> — proving the detection would have caught it (in staging, on the reverted rules) and closing the permission gap turns the incident into durable improvement; hardening before scoping is how missed sibling changes survive.","hints":["Two phases change the environment and two only read or plan — the reading ones come first.","Staging validation belongs to the same phase as the permanent IAM fix, not to restoration."]},{"id":"x10","type":"single","persp":"attacker","concept":"Behavior","scenario":"The Kestrel Health attacker opened <b>both<\/b> ingress and egress rules for tcp/3333 to 198.51.100[.]9. A reviewer asks why egress mattered when the goal was “just mining”.","question":"Why did the attacker need an egress change in addition to ingress?","options":[["The workload must be able to send its mining traffic out to the pool, so restricted egress had to be widened too",true],["Egress rules control who can log in to the instance",false],["Egress changes are required before any ingress change can be made",false],["Egress rules store the mining results in S3",false]],"explanation":"<b>A is correct:<\/b> mining is a two-way relationship — the pool sends work, the worker sends shares — and both directions ride the workload’s network path. If egress to the pool address on tcp/3333 is blocked, an opened ingress rule alone connects nothing; the attacker widens both so the worker can talk to the pool directly. <b>B is wrong:<\/b> egress governs outbound connections, not inbound logins. <b>C is wrong:<\/b> the two rule directions are independent API calls; neither is a prerequisite for the other. <b>D is wrong:<\/b> S3 storage has nothing to do with egress rules; results flow over the network path the egress rule permits.","hints":["Follow the mining traffic packet by packet: which direction does each part of the conversation travel?","Ingress and egress are independent switches — the attacker flips the ones the traffic needs."]},{"id":"x11","type":"single","persp":"defender","concept":"Mitigation design","scenario":"Kestrel Health’s CISO asks you to sort the proposed controls into preventive and detective buckets so the roadmap is honest about what stops versus what sees.","question":"Which pairing classifies the controls correctly?","options":[["Preventive: SCPs and permission boundaries that deny firewall mutation outside pipeline roles. Detective: baseline-diff analytics and alerts on GuardDuty IP-set changes",true],["Preventive: baseline-diff analytics. Detective: SCPs that deny the mutation",false],["Both preventive, because both are written in the same policy document",false],["Both detective, because nothing can actually stop a cloud API call",false]],"explanation":"<b>A is correct:<\/b> preventive controls act <b>before<\/b> the unwanted change — service control policies and permission boundaries simply refuse the <code>AuthorizeSecurityGroupIngress<\/code> call from identities that should never make it (M1018 operationalised). Detective controls act <b>after<\/b>, watching for what slips through: baseline diffs per AN1188 and alerts on GuardDuty IP-set mutations (the Pacu-style impairment play) shorten dwell time. <b>B is wrong:<\/b> it swaps the labels — analytics cannot prevent an API call, and an SCP does not observe anything. <b>C is wrong:<\/b> sharing a document does not merge their mechanism. <b>D is wrong:<\/b> a denied API call never happens — prevention is real and standard in cloud platforms.","hints":["Ask each control: does it refuse the call, or does it report the call?","One bucket needs the call to succeed in order to have something to see."]},{"id":"x12","type":"terminal","persp":"defender","concept":"Targeted remediation","scenario":"The Kestrel Health bridge has attributed the change and approved exactly one remediation: remove the attacker’s rule — tcp/3389 from 198.51.100[.]9/32 on group <code>sg-0b7e21aa<\/code> — without touching any other rule; the booking API’s rules must keep working.","question":"In the simulated shell, type the AWS CLI command that removes exactly that one rule.","shell":{"banner":"CYBERPULSE BRIDGE — approved change window · single-rule removal · do not improvise","goal":"Revoke ingress: tcp/3389 from 198.51.100[.]9/32 on sg-0b7e21aa — nothing else.","syntax":"aws ec2 revoke-security-group-ingress --group-id &lt;id&gt; --protocol &lt;p&gt; --port &lt;n&gt; --cidr &lt;range&gt;","expected":"{\n  \"Return\": true\n}","prompt":"senior@kestrel-bridge","path":"~/bridge","placeholder":"aws ec2 revoke-security-group-ingress …"},"checks":[{"re":"^aws\\s+ec2\\s+revoke-security-group-ingress\\b","label":"uses revoke-security-group-ingress (the rule-removing call)"},{"re":"--group-id\\s*=?\\s*sg-0b7e21aa\\b","label":"targets group sg-0b7e21aa"},{"re":"--protocol\\s*=?\\s*tcp\\b","label":"matches the rule’s protocol tcp"},{"re":"--port\\s*=?\\s*3389\\b","label":"matches the rule’s port 3389"},{"re":"--cidr\\s*=?\\s*198\\.51\\.100\\.9(\\/32)?\\b","label":"matches the rule’s source 198.51.100[.]9/32"}],"nearMiss":[{"re":"revoke-security-group-egress","msg":"Egress is the outbound direction; the approved change removes an ingress rule."},{"re":"--port\\s*=?\\s*3388\\b","msg":"The rule to remove is on port 3389; revoking 3388 touches the wrong rule."},{"re":"198\\.51\\.100\\.0\\s*\\/\\s*24","msg":"A /24 revokes a whole range; the approved change removes only the single address /32, and wider revocation can break other rules."}],"destructive":{"re":"delete-security-group\\b","msg":"Deleting the security group destroys every rule on it and detaches it from the workload — a destructive, out-of-scope action that would take the booking API down with the attacker’s rule. The approved change removes exactly one ingress rule."},"canonical":"aws ec2 revoke-security-group-ingress --group-id sg-0b7e21aa --protocol tcp --port 3389 --cidr 198.51.100[.]9/32","explanation":"Surgical remediation mirrors the rule it removes: <code>revoke-security-group-ingress<\/code> (check 1) on <code>sg-0b7e21aa<\/code> (check 2) with the rule’s exact protocol, port, and source — tcp, 3389, 198.51.100[.]9/32 (checks 3–5). Every element must match, because the grader of a real change board is the same: the command should be a no-op if the rule is already gone and must not touch neighbours. The near misses are the classic ways a targeted revoke goes wrong — wrong direction (egress), wrong port, or an over-wide /24 that rips out other tenants’ rules. The destructive trap is <code>delete-security-group<\/code>: it removes every rule at once and detaches the group, converting a one-rule fix into an outage.","hints":["The command family removes rules; the direction keyword must say ingress.","Copy the rule’s three properties exactly from the approval line."]},{"id":"x13","type":"single","persp":"defender","concept":"Detection","scenario":"Red-team debrief at Kestrel Health: the emulation opened tcp/8443 from a single /32 sourced from an ASN adjacent to the company’s own. The existing detections — a 0.0.0.0/0 alert and a tcp/3389 alert — never fired.","question":"Which detection change closes this gap most robustly?","options":[["Baseline-diff every rule change regardless of port or source width, and correlate new/unused roles and unfamiliar ASNs into the score",true],["Add 8443 to the port list in the 0.0.0.0/0 alert",false],["Require all security group changes to happen only on Fridays",false],["Disable the 0.0.0.0/0 alert since it missed this attack",false]],"explanation":"<b>A is correct:<\/b> the emulation defeated two <b>signatures<\/b> (a CIDR shape and a port), so the fix must stop being signature-shaped: baseline diffing evaluates every state change — any port, any source width — and actor correlation (unused roles, unfamiliar ASNs, session age) catches what the rule shape deliberately hides. That is the AN1188 design intent applied. <b>B is wrong:<\/b> adding 8443 to a 0.0.0.0/0 alert fails twice — the emulation was not 0.0.0.0/0, and the next port is one character away. <b>C is wrong:<\/b> day-of-week is a gameable ritual, not a control. <b>D is wrong:<\/b> retiring the /0 alert removes a genuinely useful signal for the loud case; the lesson is to add coverage, not subtract it.","hints":["List what the emulation varied: port, source width, network origin. The fix must not depend on any of them.","One option deletes a working alert for the wrong reason — coverage is additive."]},{"id":"x14","type":"multi","persp":"defender","concept":"Mitigation","scenario":"Post-incident, Kestrel Health funds a hardening bundle. The steering committee wants measures that map to the ATT&CK mitigations for this sub-technique and to its real procedures.","question":"Select every measure that belongs in the bundle. (Pick all that apply.)","options":[["An SCP that denies security group mutation to every role except audited pipeline roles",true],["A scheduled compliance job that diffs live security groups against the IaC state and reports drift (M1047 in practice)",true],["An alert on GuardDuty IP-set changes, so the allowlisting play is seen immediately",true],["A break-glass role for emergency firewall changes, with approval workflow and alerting on every use",true],["Deleting the GuardDuty IPSet feature entirely so attackers cannot abuse it",false]],"explanation":"<b>A, B, C and D are correct.<\/b> A is least privilege enforced centrally (M1018) — the compromised-automation-role path is closed. B operationalises M1047 — Audit: routine, scheduled comparison of live state to approved state, which is the baseline diff powering the analytics. C covers the impairment procedure itself (the Pacu-style IPSet allowlist), turning the attacker’s quiet move into an immediate signal. D keeps emergency capability without silent power: every use is approved and alerted, so the “legitimate-looking 3 a.m. change” loses its camouflage. <b>E is wrong:<\/b> deleting a native detection service feature to stop its abuse removes your own visibility along with the attack path — you would never see the next allowlist attempt either; control the permission to change it instead.","hints":["Four measures either remove the capability or watch it; one destroys a defensive capability.","The wrong option is the “smash the window because it can be opened” school of hardening."]},{"id":"x15","type":"single","persp":"defender","concept":"Investigation","scenario":"Weeks later, a similar change appears: 03:00, the dormant role <code>kg-auto-remediate<\/code> adds one ingress rule on 8443 from a /32. No ticket. The role’s owner says automation “sometimes does that”. The change board is split: call it an attack, or close the ticket as an automation quirk.","question":"What is the professionally correct position for the SOC?","options":[["Hold both hypotheses and resolve them with evidence: attribute the assuming session, check IaC locks and deployment records, and compare against the baseline — then decide",true],["Escalate as a confirmed attacker action, because 03:00 and a dormant role prove compromise",false],["Close it as legitimate, because the role is an official automation role and its owner vouched for it",false],["Ignore it, because one rule on 8443 is below the incident threshold",false]],"explanation":"<b>A is correct:<\/b> the evidence so far is ambiguous — suspicious context (dormant role, 03:00, no record, a /32 shape that hides from loud detections) but no proof either way. The SOC’s job is to drive ambiguity to zero with the tools already used in the Kestrel case: resolve the assuming session (role chain, source, user-agent), confirm whether any pipeline or IaC lock could have produced the change, and diff the rule against the baseline. Only then is “attacker” or “quirk” a finding. <b>B is wrong:<\/b> odd hours and dormancy raise suspicion; they are not attribution — real automation does act at 03:00, and declaring attacks without evidence destroys trust. <b>C is wrong:<\/b> an owner’s vouch plus an official role is precisely the camouflage a compromised role provides; the Kestrel intrusion started exactly this way. <b>D is wrong:<\/b> one quiet rule is the T1686.001 signature at its quietest — severity is decided by evidence, not by rule count.","hints":["Two options decide from context alone — one too fast to guilt, one too fast to innocence.","The same three evidence legs from earlier apply: session, records, baseline."]}];
var HINT_PEN=0.25;
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(s){s=Math.max(0,Math.floor(s));var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function norm(s){return String(s||'').replace(/\[\.\]/g,'.').replace(/\[:\]/g,':').replace(/["']/g,'')
  .replace(/\s+/g,' ').trim()}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- timer state machine: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED ---------- */
var T={state:'IDLE',remaining:META.timerMinutes*60,tRun:0,tMan:0,tAuto:0,iv:null,enteredAt:0,resumeTo:'RUNNING'};
function tAccount(){
  var now=Date.now();
  if(T.state==='PAUSED_MANUAL'){T.tMan+=Math.max(0,Math.round((now-T.enteredAt)/1000))}
  else if(T.state==='PAUSED_AUTO_CHECK'){T.tAuto+=Math.max(0,Math.round((now-T.enteredAt)/1000))}
}
function timerTick(){
  if(T.state!=='RUNNING')return;
  T.remaining--;T.tRun++;renderTimer();
  if(T.remaining<=0){forceFinish()}
}
function tEnter(st){

function tPauseManual(){if(T.state==='ENDED'||T.state==='PAUSED_MANUAL')return;
  T.resumeTo=(T.state==='PAUSED_AUTO_CHECK')?'PAUSED_AUTO_CHECK':'RUNNING';
  tEnter('PAUSED_MANUAL');$('pause-ov').classList.add('show');document.body.classList.add('blurred')}
function tResumeManual(){if(T.state!=='PAUSED_MANUAL')return;
  tEnter(T.resumeTo||'RUNNING');$('pause-ov').classList.remove('show');document.body.classList.remove('blurred')}
function tAutoPause(){if(T.state==='RUNNING'){tEnter('PAUSED_AUTO_CHECK')}}
function tAutoResume(){if(T.state==='PAUSED_AUTO_CHECK'){tEnter('RUNNING')}}
function tEnd(){tAccount();if(T.iv){clearInterval(T.iv);T.iv=null}T.state='ENDED';renderTimer()}
function renderTimer(){var c=$('timerchip');if(!c)return;var cls='chip timer-run',txt='';
  if(T.state==='RUNNING'){cls='chip timer-run';txt='▶ Running · '+fmt(T.remaining)}
  else if(T.state==='PAUSED_MANUAL'){cls='chip timer-man';txt='⏸ Paused'}
  else if(T.state==='PAUSED_AUTO_CHECK'){cls='chip timer-auto';txt='⏳ Feedback pause'}
  else if(T.state==='ENDED'){cls='chip timer-end';txt='⏱ Ended'}
  c.className=cls;c.textContent=txt;
  c.title=T.state==='PAUSED_MANUAL'?'Paused by you: the countdown is frozen. Resume continues the exam.'
    :(T.state==='PAUSED_AUTO_CHECK'?'Auto-paused while feedback is shown: the countdown is frozen until you press Next.'
    :(T.state==='ENDED'?'The exam has ended.':'Countdown is running.'))}

/* ---------- grading ---------- */
function gradeCurrent(){
  var e=cur();
  if(e.type==='single'||e.type==='multi'){
    if(!S.sel.length)return null;
    var N=0,H=0,W=0,items=[];
    e.options.forEach(function(o){if(o[1])N++});
    e.options.forEach(function(o,i){
      var picked=(S.sel.indexOf(i)>=0);
      if(o[1]&&picked){H++;items.push([i,'ok','✓ Correct'])}
      else if(o[1]&&!picked){items.push([i,'miss','○ Missed'])}
      else if(!o[1]&&picked){W++;items.push([i,'bad','✗ Wrong'])}
      else{items.push([i,'',''])}});
    var base=(e.type==='single')?((H===1&&W===0)?1:0):Math.max(0,(H-W)/N);
    return {base:base,items:items,N:N};
  }
  if(e.type==='dnd'){
    var N2=e.bank.length,H2=0,W2=0,items2=[],cmap=correctMap(e);
    for(var i=0;i<e.bank.length;i++){
      var z=S.dndAssign[i];
      if(z===undefined||z===null||z<0){items2.push([i,'miss','○ Missed — not placed'])}
      else if(z===cmap[i]){H2++;items2.push([i,'ok','✓ Correct'])}
      else{W2++;items2.push([i,'bad','✗ Wrong — '+(e.mode==='order'?('correct position is '+(cmap[i]+1)):('belongs to “'+e.zones[cmap[i]].label+'”'))])}
    }
    return {base:Math.max(0,(H2-W2)/N2),items:items2,N:N2};
  }
  if(e.type==='terminal'){
    var raw=($('term-in')||{}).value||'';
    var inp=norm(raw);
    if(!inp)return null;
    var items3=[],H3=0,W3=0,trap=null,nm=[];
    if(e.destructive&&e.destructive.re&&new RegExp(e.destructive.re,'i').test(inp)){
      trap=e.destructive.msg;
    }
    if(!trap&&e.nearMiss){e.nearMiss.forEach(function(m){
      if(new RegExp(m.re,'i').test(inp))nm.push(m.msg)})}
    e.checks.forEach(function(c){
      var ok=new RegExp(c.re,'i').test(inp);
      if(ok)H3++;
      items3.push([null,ok?'ok':'miss',(ok?'✓ Passed — ':'○ Not met — ')+c.label])});
    W3=nm.length;
    var N3=e.checks.length;
    return {base:trap?0:Math.max(0,(H3-W3)/N3),items:items3,N:N3,trap:trap,nm:nm,inp:inp};
  }
  return null;
}
function correctMap(e){
  var m=[];
  if(e.mode==='order'){for(var i=0;i<e.bank.length;i++)m[i]=i}
  else{for(var i2=0;i2<e.bank.length;i2++)m[i2]=-1;
    e.zones.forEach(function(z,zi){(z.accepts||[]).forEach(function(ii){m[ii]=zi})})}
  return m;
}

/* ---------- feedback ---------- */
function showFeedback(g,credit,status){
  var e=cur(),fb=$('feedback');if(!fb)return;
  var cls=status==='full'?'fb-full':(status==='partial'?'fb-partial':'fb-zero');
  var head=status==='full'?'✓ Correct':(status==='partial'?'✓ Partially correct':'✗ Incorrect');
  var h='<div class="fb-head"><span>'+head+'</span><span class="credit">Credit: '+credit.toFixed(2)+' / 1.00'
   +(S.curHints>0?(' · −'+(HINT_PEN*S.curHints).toFixed(2)+' hint penalty ('+S.curHints+' hint'+(S.curHints>1?'s':'')+' used)'):'')+'</span></div>';
  h+='<ul class="peritem">';
  if(e.type==='single'||e.type==='multi'){
    g.items.forEach(function(it){
      if(it[2])h+='<li><span class="mark-tag '+(it[1]==='ok'?'':it[1])+'" style="color:'+(it[1]==='ok'?'var(--ok)':(it[1]==='bad'?'var(--bad)':'var(--miss)'))+'">'+it[2]+'</span><span><b>'+LETTERS[it[0]]+'.</b> '+e.options[it[0]][0]+'</span></li>'});
  }else if(e.type==='dnd'){
    g.items.forEach(function(it){
      h+='<li><span class="mark-tag" style="color:'+(it[1]==='ok'?'var(--ok)':(it[1]==='bad'?'var(--bad)':'var(--miss)'))+'">'+it[2]+'</span><span>'+e.bank[it[0]]+'</span></li>'});
  }else if(e.type==='terminal'){
    if(g.trap)h+='<li><span class="mark-tag" style="color:var(--bad)">✗ Unsafe action blocked</span><span>'+g.trap+'</span></li>';
    g.nm.forEach(function(m){h+='<li><span class="mark-tag" style="color:var(--warn)">⚠ Near miss</span><span>'+m+'</span></li>'});
    g.items.forEach(function(it){h+='<li><span class="mark-tag" style="color:'+(it[1]==='ok'?'var(--ok)':'var(--miss)')+'">'+it[2]+'</span></li>'});
  }
  h+='</ul><div class="expl"><span class="why">Why</span>'+e.explanation+'</div>';
  fb.className='feedback show '+cls;fb.innerHTML=h;
  var last=(S.phase==='review')?(S.reviewP===S.reviewQ.length-1):(S.idx===EX.length-1);
  var row=document.createElement('div');row.className='actrow';
  var lbl=S.phase==='review'?(last?'Finish review →':'Next skipped →'):(last?'Final Submit →':'Next →');
  row.innerHTML='<button type="button" class="btn btn-green" data-act="next">'+lbl+'</button>';
  fb.parentNode.insertBefore(row,fb.nextSibling);
  document.querySelectorAll('[data-act="check"],[data-act="skip"],[data-act="hint"]').forEach(function(b){b.disabled=true});
  var ti=$('term-in');if(ti)ti.disabled=true;
  markOptions(e,g);
  termOut(e,g);
}
function markOptions(e,g){
  if(!g||!g.items)return;
  if(e.type==='single'||e.type==='multi'){
    g.items.forEach(function(it){var el=document.querySelector('.opt[data-i="'+it[0]+'"]');if(!el)return;
      if(it[1]==='ok')el.classList.add('state-ok');
      else if(it[1]==='bad')el.classList.add('state-bad');
      else if(it[1]==='miss')el.classList.add('state-miss');
      var tag=it[2]?('<span class="mark-tag" style="color:'+(it[1]==='ok'?'var(--ok)':(it[1]==='bad'?'var(--bad)':'var(--miss)'))+'">'+it[2]+'</span>'):'';
      el.insertAdjacentHTML('beforeend',tag)});
  }else if(e.type==='dnd'){
    document.querySelectorAll('.dnd-chip').forEach(function(c){
      var i=parseInt(c.getAttribute('data-i'),10),it=g.items[i];if(!it)return;
      if(it[1]==='ok')c.classList.add('ok');else if(it[1]==='bad')c.classList.add('bad');else if(it[1]==='miss')c.classList.add('miss')});
  }
}
function termOut(e,g){
  if(e.type!=='terminal'||!g)return;
  var out=$('term-out');if(!out)return;
  if(g.trap){out.innerHTML='<span class="out-err">✗ '+esc(g.trap)+'</span>';return}
  if(g.base>=0.999&&e.shell.expected){out.innerHTML='<span class="out-ok">'+e.shell.expected+'</span>';return}
  out.innerHTML='<span class="out-dim">Simulated shell: no output matched the expected action. Check the per-item notes below.</span>';
}

/* ---------- flow ---------- */
function startExam(){S.phase='exam';S.idx=0;prepExercise();renderExam();tStart()}
function prepExercise(){
  S.sel=[];S.dndAssign={};S.dndPick=null;S.checked=false;S.curHints=0;
  var e=cur();
  if(e.type==='dnd'){S.dndDisp=shuffle(e.bank.map(function(_,i){return i}))}
}
function renderExam(){
  var app=$('app');
  app.innerHTML=barHTML()+examHTML();
  $('counter').textContent='Exercise '+(S.idx+1)+' / '+EX.length;
  renderTimer();updateScore();
  var inp=$('term-in');
  if(inp)inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();doCheck()}});
}
function updateScore(){var c=$('scorechip');if(c)c.textContent='★ '+S.score.toFixed(2)+' pts'}
function warn(msg){var w=$('warnline');if(w){w.textContent='⚠ '+msg;w.classList.add('show');
  setTimeout(function(){w.classList.remove('show')},2200)}}
function doCheck(){
  if(S.checked)return;
  var g=gradeCurrent();if(g===null){warn('Select an answer first.');return}
  tAutoPause();
  S.checked=true;
  var credit=Math.max(0,g.base-HINT_PEN*S.curHints);
  S.score+=credit;
  var status=(credit>=0.999)?'full':(credit>0?'partial':'zero');
  var qi=(S.phase==='review')?S.reviewQ[S.reviewP]:S.idx;
  S.results[qi]={status:status,credit:credit,hints:S.curHints};
  updateScore();
  renderExamFeedbackOnly(g,credit,status);
}
function renderExamFeedbackOnly(g,credit,status){
  var fb=$('feedback');
  if(!fb){renderExam();var fb2=$('feedback');paint(g,credit,status,fb2);return}
  paint(g,credit,status,fb);
}
function paint(g,credit,status,fb){showFeedback(g,credit,status)}
function doHint(){
  if(S.checked)return;var e=cur();
  if(!e.hints||S.curHints>=e.hints.length)return;
  S.curHints++;var p=$('hint-panel');
  if(p){p.classList.add('show');p.innerHTML='ⓘ Hint '+S.curHints+' / '+e.hints.length+': '+e.hints[S.curHints-1]}
}
function doNext(){
  if(!S.checked)return;
  tAutoResume();
  if(S.phase==='review'){
    S.reviewP++;
    if(S.reviewP<S.reviewQ.length){prepExercise();renderReview()}
    else showResults();
    return;
  }
  if(S.idx<EX.length-1){S.idx++;prepExercise();renderExam()}
  else finalSubmit();
}
function doSkip(){
  if(S.checked)return;
  var qi=(S.phase==='review')?S.reviewQ[S.reviewP]:S.idx;
  S.results[qi]={status:'skipped',credit:0,hints:0};
  if(S.phase==='review'){
    if(S.skipped.indexOf(qi)<0)S.skipped.push(qi);
    S.reviewP++;
    if(S.reviewP<S.reviewQ.length){prepExercise();renderReview()}
    else showResults();
    return;
  }
  if(S.skipped.indexOf(S.idx)<0)S.skipped.push(S.idx);
  if(S.idx<EX.length-1){S.idx++;prepExercise();renderExam()}
  else finalSubmit();
}
function finalSubmit(){
  S.reviewQ=S.skipped.filter(function(i){return S.results[i]&&S.results[i].status==='skipped'});
  S.reviewP=0;
  if(S.reviewQ.length){S.phase='review';prepExercise();renderReview()}
  else showResults();
}
function renderReview(){
  var app=$('app');app.innerHTML=barHTML()+examHTML();
  $('counter').textContent='Review skipped '+(S.reviewP+1)+' / '+S.reviewQ.length;
  renderTimer();updateScore();
  var inp=$('term-in');
  if(inp)inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();doCheck()}});
}
function forceFinish(){
  if(S.phase==='exam'&&!S.checked){S.results[S.idx]={status:'skipped',credit:0,hints:0};
    if(S.skipped.indexOf(S.idx)<0)S.skipped.push(S.idx)}
  showResults();
}

/* ---------- results + reporting ---------- */
function showResults(){
  S.phase='results';tEnd();
  $('pause-ov').classList.remove('show');document.body.classList.remove('blurred');
  var answered=0,full=0,part=0,zero=0,skipN=0,partSum=0;
  for(var i=0;i<EX.length;i++){var r=S.results[i]||{status:'skipped',credit:0};
    if(r.status==='skipped'){skipN++;continue}
    answered++;
    if(r.status==='full')full++;else if(r.status==='partial'){part++;partSum+=r.credit}else zero++}
  var rounded=Math.round(S.score);
  var percent=answered>0?Math.round(rounded/answered*100):0;
  var passed=percent>=META.passMark;
  var partAvg=part>0?(partSum/part):0;
  var h='<main class="wrap"><section class="card"><h2>Results — '+esc(META.objectName)+'</h2>'
   +'<div class="res-hero"><div class="res-pct '+(passed?'pass':'fail')+'" id="final-pct">0%</div>'
   +'<div><span class="badge '+(passed?'sev-easy':'sev-xhard')+'">'+(passed?'✓ Passed':'✗ Not passed')+'</span>'
   +'<p class="muted">Pass mark: '+META.passMark+'% · Points: '+rounded+' of '+answered+' answered exercise'+(answered===1?'':'s')+' · Skipped-and-never-answered exercises are excluded.</p></div></div>'
   +'<div class="res-grid">'
   +'<div class="res-box b-full"><div class="n">'+full+'</div><div class="t">✓ Fully correct</div></div>'
   +'<div class="res-box b-part"><div class="n">'+part+'</div><div class="t">✓ Partially correct — average partial credit '+partAvg.toFixed(2)+'</div></div>'
   +'<div class="res-box b-zero"><div class="n">'+zero+'</div><div class="t">✗ Fully incorrect</div></div>'
   +'<div class="res-box b-skip"><div class="n">'+skipN+'</div><div class="t">⚠ Skipped &amp; never answered (excluded)</div></div>'
   +'</div>'
   +'<div class="res-time"><span class="chip">▶ Running: '+fmt(T.tRun)+'</span>'
   +'<span class="chip">⏸ Paused by you: '+fmt(T.tMan)+'</span>'
   +'<span class="chip">⏳ Paused for feedback: '+fmt(T.tAuto)+'</span>'
   +'<span class="chip">⏱ Total: '+fmt(T.tRun+T.tMan+T.tAuto)+'</span></div>'
   +'<div class="actrow"><button type="button" class="btn btn-primary" data-act="retake">↻ Retake</button></div>'
   +'</section></main>';
  $('app').innerHTML=h;
  var done=false;
  function settle(){if(done)return;done=true;postReport(rounded,answered,percent,passed)}
  var reduced=false;
  try{reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(err){}
  var el=$('final-pct');
  if(reduced||!el){if(el)el.textContent=percent+'%';settle();return}
  var t0=null,dur=1100;
  requestAnimationFrame(function step(ts){
    if(t0===null)t0=ts;var k=Math.min(1,(ts-t0)/dur);
    el.textContent=Math.round(percent*(1-Math.pow(1-k,3)))+'%';
    if(k<1)requestAnimationFrame(step);else settle();
  });
}
function postReport(score,total,percent,passed){
  if(S.postSent)return;S.postSent=true;
  try{(window.parent===window?window:window.parent).postMessage(
    {type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,difficulty:META.difficulty,
     score:score,total:total,percent:percent,passed:passed},
    S.hostOrigin||location.origin)}catch(e){}
}
function doRetake(){
  S.phase='intro';S.idx=0;S.score=0;S.results=[];S.skipped=[];S.reviewQ=[];S.reviewP=0;
  S.postSent=false;S.sel=[];S.dndAssign={};S.dndPick=null;S.checked=false;S.curHints=0;
  if(T.iv){clearInterval(T.iv);T.iv=null}
  T.state='IDLE';T.remaining=META.timerMinutes*60;T.tRun=0;T.tMan=0;T.tAuto=0;T.resumeTo='RUNNING';
  renderIntro();
}

/* ---------- app ---------- */
function renderIntro(){
  $('app').innerHTML='<main class="wrap">'+introHTML()+'</main>';
  window.scrollTo(0,0);
}
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act');
  if(act==='start'){startExam();window.scrollTo(0,0)}
  else if(act==='sc-toggle'){var b=document.querySelector('.sc-body');
    var open=b.classList.toggle('sc-open');el.textContent=open?'Hide scenario ▴':'Show full scenario ▾'}
  else if(act==='opt'){if(S.checked)return;var i=parseInt(el.getAttribute('data-i'),10);
    var e=cur();
    if(e.type==='single'){S.sel=[i]}
    else{var p=S.sel.indexOf(i);if(p>=0)S.sel.splice(p,1);else S.sel.push(i)}
    document.querySelectorAll('.opt').forEach(function(o){
      var oi=parseInt(o.getAttribute('data-i'),10);
      o.classList.toggle('picked',S.sel.indexOf(oi)>=0);
      o.setAttribute('aria-pressed',S.sel.indexOf(oi)>=0)})}
  else if(act==='check'){doCheck()}
  else if(act==='hint'){doHint()}
  else if(act==='pause'){tPauseManual()}
  else if(act==='resume'){tResumeManual()}
  else if(act==='skip'){doSkip()}
  else if(act==='next'){doNext()}
  else if(act==='review-leave'){doSkip()}
  else if(act==='retake'){doRetake();window.scrollTo(0,0)}
  else if(act==='dnd-pick'){
    if(S.checked)return;
    var di=parseInt(el.getAttribute('data-i'),10);
    if(S.dndAssign[di]!==undefined&&S.dndAssign[di]!==null&&S.dndAssign[di]>=0){
      S.dndAssign[di]=null;S.dndPick=null}
    else{S.dndPick=(S.dndPick===di?null:di)}
    reRenderDnd()}
  else if(act==='dnd-zone'){
    if(S.checked)return;
    var z=parseInt(el.getAttribute('data-zone')||el.closest('[data-zone]').getAttribute('data-zone'),10);
    if(S.dndPick===null){warn('Pick an item first, then click a box.')}
    else{S.dndAssign[S.dndPick]=z;S.dndPick=null;reRenderDnd()}}
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&T.state==='PAUSED_MANUAL'){tResumeManual()}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target&&ev.target.closest&&ev.target.closest('[data-act="dnd-zone"]')){
    ev.preventDefault();
    if(S.checked)return;
    var z=parseInt(ev.target.closest('[data-act="dnd-zone"]').getAttribute('data-zone'),10);
    if(S.dndPick===null){warn('Pick an item first, then click a box.')}
    else{S.dndAssign[S.dndPick]=z;S.dndPick=null;reRenderDnd()}
  }
});
function reRenderDnd(){var e=cur();
  var holder=document.querySelector('.blk-answer');if(!holder)return;
  holder.innerHTML='<div class="lbl">◈ YOUR ANSWER</div>'+dndHTML(e)}
/* drag-and-drop native events */
document.addEventListener('dragstart',function(ev){
  var t=ev.target.closest&&ev.target.closest('.dnd-chip');
  if(t){ev.dataTransfer.setData('text/plain',t.getAttribute('data-i'))}});
document.addEventListener('dragover',function(ev){
  var z=ev.target.closest&&ev.target.closest('.dnd-zone');
  if(z){ev.preventDefault();z.classList.add('over')}});
document.addEventListener('dragleave',function(ev){
  var z=ev.target.closest&&ev.target.closest('.dnd-zone');
  if(z){z.classList.remove('over')}});
document.addEventListener('drop',function(ev){
  var z=ev.target.closest&&ev.target.closest('.dnd-zone');
  if(z){ev.preventDefault();z.classList.remove('over');
    if(S.checked)return;
    var i=parseInt(ev.dataTransfer.getData('text/plain'),10);
    if(!isNaN(i)){S.dndAssign[i]=parseInt(z.getAttribute('data-zone'),10);S.dndPick=null;reRenderDnd()}}});
/* host handshake: CYBERPULSE_INIT and CYBERMASTERY_INIT are both accepted; theme is ignored (dark-only file) */
window.addEventListener('message',function(ev){
  var d=ev.data||{};
  if(d.type==='CYBERPULSE_INIT'||d.type==='CYBERMASTERY_INIT'){
    S.hostOrigin=ev.origin||null;
    try{(window.parent===window?window:window.parent).postMessage(
      {type:'CYBERPULSE_READY',topicId:META.topicId,batch:META.batch,difficulty:META.difficulty},
      S.hostOrigin||location.origin)}catch(e){}
  }
});
document.addEventListener('DOMContentLoaded',function(){renderIntro()});
})();

</script>
