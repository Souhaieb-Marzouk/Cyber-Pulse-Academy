  if(ex.type === "match"){ w.rightPerm = shuffleArr(range(ex.answer.right.length), r); }
  if(ex.type === "order"){ w.list = shuffleArr(ex.answer.items.map(function(it){ return it.id; }), r); }
  if(ex.type === "fill"){ w.bankPerm = shuffleArr(range(ex.answer.bank.length), r); }
  if(ex.type === "dragdrop"){ w.itemPerm = shuffleArr(range(ex.answer.items.length), r); }
  if(ex.type === "branch"){ w.stepPerm = ex.answer.steps.map(function(st){ return shuffleArr(range(st.options.length), r); }); }
  if(ex.type === "triage"){
    ex.answer.alerts.forEach(function(a){ w.alertPerm[a.id] = shuffleArr(range(a.actions.length), r); });
  }
  return w;
}

function startAttempt(){
  S.attempt++;
  S.rng = mulberry32(90210 + S.attempt * 7919 + EXERCISES.length * 31);
  S.order = shuffleArr(range(EXERCISES.length), S.rng);
  S.results = EXERCISES.map(function(){ return null; });
  S.skipped = [];
  S.scoreSum = 0; S.answered = 0; S.elapsedSec = 0;
  S.pause = { manualSec: 0, feedbackSec: 0 };
  S.reported = false; S.reviewing = false; S.paused = false; S.prevAuto = false;
  S.cur = 0;
  S.work = EXERCISES.map(function(ex){ return initWork(ex); });
  if(S.timer && S.timer.int){ clearInterval(S.timer.int); }
  S.timer = { state: "RUNNING", remaining: EXAM.timerMinutes * 60, int: null };
  S.timer.int = setInterval(onTick, 1000);
  S.phase = "exam";
  render();
}

/* ================= timer state machine ================= */
function setTimerState(st){ S.timer.state = st; renderHeader(); }
function stopTimer(){
  if(S.timer.int){ clearInterval(S.timer.int); S.timer.int = null; }
  S.timer.state = "ENDED";
  renderHeader();
}
function onTick(){
  if(!S){ return; }
  if(S.phase !== "exam" && S.phase !== "review"){ return; }
  S.elapsedSec++;
  var st = S.timer.state;
  if(st === "RUNNING"){
    S.timer.remaining--;
    if(S.timer.remaining <= 0){
      S.timer.remaining = 0;
      renderHeader();
      examTimeout();
      return;
    }
  } else if(st === "PAUSED_MANUAL"){ S.pause.manualSec++; }
  else if(st === "PAUSED_AUTO_CHECK"){ S.pause.feedbackSec++; }
  renderHeader();
}
function examTimeout(){ stopTimer(); showResults(); }

function timerStateHtml(){
  var st = S.timer.state;
  if(st === "RUNNING"){ return '<span class="tmr tmr-running"><b>⏱ ' + fmtClock(S.timer.remaining) + '</b> <span class="tstate">▶ RUNNING</span></span>'; }
  if(st === "PAUSED_MANUAL"){ return '<span class="tmr tmr-paused"><b>⏱ ' + fmtClock(S.timer.remaining) + '</b> <span class="tstate">⏸ PAUSED — manual (press Resume)</span></span>'; }
  if(st === "PAUSED_AUTO_CHECK"){ return '<span class="tmr tmr-paused"><b>⏱ ' + fmtClock(S.timer.remaining) + '</b> <span class="tstate">⏸ PAUSED — reviewing feedback (resumes on Next)</span></span>'; }
  return '<span class="tmr tmr-ended"><b>⏱ ' + fmtClock(S.timer.remaining) + '</b> <span class="tstate">■ ENDED</span></span>';
}

/* ================= scoring ================= */
function scorePartial(H, W, N){ if(N <= 0){ return 0; } return Math.max(0, (H - W) / N); }

function gradeCurrent(){
  var idx = S.order[S.cur], ex = EXERCISES[idx], w = S.work[idx];
  if(w.checked){ return; }
  var g = TYPES[ex.type].grade(ex, w);
  var credit = scorePartial(g.H, g.W, g.N);
  if(w.usedHint){ credit = Math.max(0, credit - 0.10); }
  w.checked = true;
  w.grade = g;
  w.credit = credit;
  S.results[idx] = { status: "answered", credit: credit, usedHint: w.usedHint };
  S.scoreSum += credit;
  S.answered++;
  setTimerState("PAUSED_AUTO_CHECK");
  render();
}

/* ================= flows ================= */
function doStart(){ startAttempt(); }

function doCheck(){
  var idx = S.order[S.cur], ex = EXERCISES[idx], w = S.work[idx];
  if(!w.checked && TYPES[ex.type].canCheck(ex, w)){ gradeCurrent(); }
}

function canAdvance(){ return S.cur < S.order.length - 1; }
function skippedRemaining(){
  return S.skipped.filter(function(i){ return S.results[i] && S.results[i].status === "skipped"; });
}
function doNext(){
  if(S.timer.state === "PAUSED_AUTO_CHECK"){ setTimerState("RUNNING"); }
  if(S.reviewing){
    S.reviewing = false;
    goReviewOrFinish();
    return;
  }
  if(canAdvance()){ S.cur++; render(); }
  else { goReviewOrFinish(); }
}
function goReviewOrFinish(){
  if(skippedRemaining().length > 0){ S.phase = "review"; render(); }
  else { showResults(); }
}
function doSkip(){
  var idx = S.order[S.cur], w = S.work[idx];
  if(w.checked){ return; }
  if(!S.results[idx]){ S.results[idx] = { status: "skipped" }; S.skipped.push(idx); }
  if(S.reviewing){ S.reviewing = false; goReviewOrFinish(); return; }
  if(canAdvance()){ S.cur++; render(); }
  else { goReviewOrFinish(); }
}
function doHint(){
  var idx = S.order[S.cur], w = S.work[idx];
  if(w.checked || w.usedHint){ return; }
  w.usedHint = true;
  render();
}
function doPause(){
  if(S.phase !== "exam"){ return; }
  if(S.timer.state === "RUNNING"){ S.prevAuto = false; S.paused = true; setTimerState("PAUSED_MANUAL"); render(); }
  else if(S.timer.state === "PAUSED_AUTO_CHECK"){ S.prevAuto = true; S.paused = true; setTimerState("PAUSED_MANUAL"); render(); }
}
function doResume(){
  if(S.timer.state !== "PAUSED_MANUAL"){ return; }
  S.paused = false;
  setTimerState(S.prevAuto ? "PAUSED_AUTO_CHECK" : "RUNNING");
  render();
}
function reviewAnswer(pos){
  S.cur = pos;
  S.reviewing = true;
  S.phase = "exam";
  render();
}
function showResults(){
  if(S.phase === "results"){ return; }
  S.phase = "results";
  stopTimer();
  render();
  if(!S.reported){ reportScore(); S.reported = true; }
}
function doRetake(){ startAttempt(); }

function reportScore(){
  var creditSum = S.scoreSum, answered = S.answered;
  var percent = answered > 0 ? Math.round((creditSum / answered) * 100) : 0;
  try{
    parent.postMessage({
      type: "CYBERPULSE_SCORE",
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum),
      total: answered,
      percent: percent,
      passed: percent >= EXAM.passMark
    }, location.origin);
  }catch(e){ /* opened directly, nothing to report to */ }
}

/* handshake from the parent site (optional; the exam stays dark-only) */
window.addEventListener("message", function(ev){
  if(!ev.data){ return; }
  var t = ev.data.type;
  if(t !== "CYBERPULSE_INIT" && t !== "CYBERMASTERY_INIT"){ return; }
  S.handshake = {
    username: ev.data.username || "",
    country: ev.data.country || "",
    theme: ev.data.theme || "dark",
    locale: ev.data.locale || "en"
  };
});

/* ================= scenario block rendering ================= */
function scenarioHtml(ex){
  var sc = ex.scenario || {};
  var h = '<div class="blk blk-scen" id="scenBlk">';
  h += '<div class="blk-head"><span aria-hidden="true">▤</span> SCENARIO';
  if(sc.title){ h += '<span class="sum"> — ' + esc(sc.title) + '</span>'; }
  h += '<button type="button" class="collapser" id="scenToggle" aria-expanded="true" aria-controls="scenBody">▾ collapse</button>';
  h += '</div><div class="blk-body" id="scenBody">';
  (sc.blocks || []).forEach(function(b){
    if(b.kind === "text"){
      h += '<p style="margin:8px 0;">' + esc(b.body) + "</p>";
    } else if(b.kind === "artefact" || b.kind === "artifact"){
      h += '<div class="art"><div class="art-label">' + esc(b.label || "ARTEFACT") + "</div>";
      h += '<div class="art-body">' + esc(b.body) + "</div></div>";
    } else if(b.kind === "code"){
      h += '<div class="art"><div class="art-label">' + esc(b.label || "CODE") + "</div>";
      h += '<div class="mono-scroll"><pre class="code">';
      (b.lines || []).forEach(function(l){ h += hl(l) + "\n"; });
      h += "</pre></div></div>";
    } else if(b.kind === "log"){
      var logId = "log" + Math.floor(Math.random() * 100000);
      h += '<div class="art"><div class="art-label">' + esc(b.label || "LOG") +
           '<span style="font-weight:400;">filter:</span> <input type="text" class="logf" data-log="' + logId + '" placeholder="type to filter lines…" aria-label="Filter log lines">' +
           "</div>";
      h += '<div class="logscroll"><table class="logtable" id="' + logId + '"><tbody>';
      (b.lines || []).forEach(function(l, li){
        h += '<tr data-lc="' + esc(String(l).toLowerCase()) + '"><td class="ln">' + (li + 1) + '</td><td>' + hl(String(l)) + "</td></tr>";
      });
      h += "</tbody></table></div></div>";
    }
  });
  h += "</div></div>";
  return h;
}
function bindScenario(root){
  var tog = root.querySelector("#scenToggle");
  if(tog){
    tog.addEventListener("click", function(){
      var body = root.querySelector("#scenBody");
      var open = tog.getAttribute("aria-expanded") === "true";
      tog.setAttribute("aria-expanded", open ? "false" : "true");
      tog.textContent = open ? "▸ expand" : "▾ collapse";
      if(body){ body.classList.toggle("collapsed", open); }
    });
  }
  root.querySelectorAll(".logf").forEach(function(inp){
    inp.addEventListener("input", function(){
      var tbl = root.querySelector("#" + inp.getAttribute("data-log"));
      if(!tbl){ return; }
      var q = inp.value.trim().toLowerCase();
      tbl.querySelectorAll("tr").forEach(function(tr){
        var hit = q === "" || (tr.getAttribute("data-lc") || "").indexOf(q) >= 0;
        tr.style.display = hit ? "" : "none";
      });
    });
  });
}

/* ================= exercise types ================= */
var TYPES = {

  /* ---------- single-answer multiple choice ---------- */
  qcm: {
    canCheck: function(ex, w){ return w.sel >= 0; },
    render: function(ex, w){
      var h = '<div class="opts" role="radiogroup" aria-label="Answer options">';
      w.perm.forEach(function(orig, disp){
        var sel = (w.sel === orig);
        h += '<button type="button" class="opt' + (sel ? " opt-selected" : "") + '" data-orig="' + orig + '" role="radio" aria-checked="' + sel + '"' + (w.checked ? " disabled" : "") + '>'
          + '<span class="opt-key">' + LETTERS[disp] + '.</span>'
          + '<span>' + esc(ex.answer.options[orig]) + "</span>"
          + (sel && !w.checked ? '<span class="opt-selmark">◉ selected</span>' : "");
        if(w.checked && w.grade){
          var isC = (orig === ex.answer.correctIndex);
          var wasSel = (w.sel === orig);
          if(isC && wasSel){ h += '<span class="opt-state st-correct">✓ correct</span>'; }
          else if(isC && !wasSel){ h += '<span class="opt-state st-missed">○ correct answer</span>'; }
          else if(!isC && wasSel){ h += '<span class="opt-state st-wrong">✗ your pick</span>'; }
        }
        h += "</button>";
      });
      return h + "</div>";
    },
    bind: function(ex, w, root){
      root.querySelectorAll(".opt").forEach(function(b){
        b.addEventListener("click", function(){
          if(w.checked){ return; }
          w.sel = parseInt(b.getAttribute("data-orig"), 10);
          renderMain();
          var el = root.querySelector('.opt[data-orig="' + w.sel + '"]');
          if(el){ el.focus(); }
        });
      });
    },
    grade: function(ex, w){
      var ok = (w.sel === ex.answer.correctIndex);
      var items = [{
        label: "Your answer: " + (w.sel >= 0 ? shortTxt(ex.answer.options[w.sel], 90) : "(nothing selected)"),
        state: ok ? "correct" : "wrong",
        note: ok ? "This is the correct option." : "The correct option was: " + shortTxt(ex.answer.options[ex.answer.correctIndex], 90)
      }];
      return { H: ok ? 1 : 0, W: ok ? 0 : (w.sel >= 0 ? 1 : 0), N: 1, items: items };
    }
  },

  /* ---------- multi-select with partial credit ---------- */
  multi: {
    canCheck: function(ex, w){ for(var k in w.selSet){ if(w.selSet[k]){ return true; } } return false; },
    render: function(ex, w){
      var h = '<div class="opts" role="group" aria-label="Answer options — select all that apply">';
      h += '<p class="small" style="margin:0 0 8px;">Select all options that apply. Wrong selections subtract from your score.</p>';
      w.perm.forEach(function(orig, disp){
        var sel = !!w.selSet[orig];
        h += '<button type="button" class="opt' + (sel ? " opt-selected" : "") + '" data-orig="' + orig + '" role="checkbox" aria-checked="' + sel + '"' + (w.checked ? " disabled" : "") + '>'
          + '<span class="opt-key">' + LETTERS[disp] + '.</span>'
          + "<span>" + esc(ex.answer.options[orig]) + "</span>"
          + (sel && !w.checked ? '<span class="opt-selmark">◉ selected</span>' : "");
        if(w.checked && w.grade){
          var isC = ex.answer.correct.indexOf(orig) >= 0;
          if(isC && sel){ h += '<span class="opt-state st-correct">✓ correct</span>'; }
          else if(isC && !sel){ h += '<span class="opt-state st-missed">○ missed</span>'; }
          else if(!isC && sel){ h += '<span class="opt-state st-wrong">✗ wrong</span>'; }
        }
        h += "</button>";
      });
      return h + "</div>";
    },
    bind: function(ex, w, root){
      root.querySelectorAll(".opt").forEach(function(b){
        b.addEventListener("click", function(){
          if(w.checked){ return; }
          var o = parseInt(b.getAttribute("data-orig"), 10);
          w.selSet[o] = !w.selSet[o];
          renderMain();
          var el = root.querySelector('.opt[data-orig="' + o + '"]');
          if(el){ el.focus(); }
        });
      });
    },
    grade: function(ex, w){
      var corr = ex.answer.correct, N = corr.length;
      var selList = Object.keys(w.selSet).filter(function(k){ return w.selSet[k]; }).map(Number);
      var H = 0, W = 0, items = [];
      corr.forEach(function(ci){
        var chosen = selList.indexOf(ci) >= 0;
        if(chosen){ H++; }
        items.push({
          label: shortTxt(ex.answer.options[ci], 90),
          state: chosen ? "correct" : "missed",
          note: chosen ? "You selected this — it belongs in the answer." : "You missed this — it belongs in the correct answer."
        });
      });
      selList.forEach(function(si){
        if(corr.indexOf(si) < 0){
          W++;
          items.push({
            label: shortTxt(ex.answer.options[si], 90),
            state: "wrong",
            note: "You selected this, but it is not part of the correct answer here."
          });
        }
      });
      return { H: H, W: W, N: N, items: items };
    }
  },

  /* ---------- matching (dropdown per left item) ---------- */
  match: {
    canCheck: function(ex, w){
      return ex.answer.left.some(function(l){ return w.map[l.id]; });
    },
    render: function(ex, w){
      var h = '<div class="small" style="margin-bottom:6px;">Pick the matching item for each row.</div>';
      ex.answer.left.forEach(function(l){
        var v = w.map[l.id] || "";
        h += '<div class="match-row"><span class="match-left">' + esc(l.text) + "</span>";
        h += '<select class="match-select" data-lid="' + esc(l.id) + '"' + (w.checked ? " disabled" : "") + ' aria-label="Match for: ' + esc(shortTxt(l.text, 60)) + '">';
        h += '<option value="">— choose —</option>';
        w.rightPerm.forEach(function(ri){
          var r = ex.answer.right[ri];
          h += '<option value="' + esc(r.id) + '"' + (v === r.id ? " selected" : "") + ">" + esc(r.text) + "</option>";
        });
        h += "</select>";
        if(w.checked && w.grade){
          var it = (w.grade.matchItems || {})[l.id];
          if(it){ h += '<span class="opt-state st-' + (it.state === "correct" ? "correct" : it.state === "wrong" ? "wrong" : "missed") + '">' + (it.state === "correct" ? "✓ correct" : it.state === "wrong" ? "✗ wrong" : "○ missed") + "</span>"; }
        }
        h += "</div>";
      });
      return h;
    },
    bind: function(ex, w, root){
      root.querySelectorAll(".match-select").forEach(function(s){
        s.addEventListener("change", function(){
          if(w.checked){ return; }
          w.map[s.getAttribute("data-lid")] = s.value;
        });
      });
    },
    grade: function(ex, w){
      var N = ex.answer.left.length, H = 0, W = 0, items = [], matchItems = {};
      ex.answer.left.forEach(function(l){
        var v = w.map[l.id] || "";
        var rightId = ex.answer.correct[l.id];
        var rightText = "";
        ex.answer.right.forEach(function(r){ if(r.id === rightId){ rightText = r.text; } });
        if(!v){
          matchItems[l.id] = { state: "missed" };
          items.push({ label: shortTxt(l.text, 80), state: "missed", note: "Left unanswered. Correct match: " + shortTxt(rightText, 80) });
        } else if(v === rightId){
          H++; matchItems[l.id] = { state: "correct" };
          items.push({ label: shortTxt(l.text, 80), state: "correct", note: "Matched correctly to: " + shortTxt(rightText, 80) });
        } else {
          W++; matchItems[l.id] = { state: "wrong" };
          items.push({ label: shortTxt(l.text, 80), state: "wrong", note: "Wrong match. Correct match: " + shortTxt(rightText, 80) });
        }
      });
      var g = { H: H, W: W, N: N, items: items };
      g.matchItems = matchItems;
      return g;
    }
  },

  /* ---------- ordering / ranking ---------- */
  order: {
    canCheck: function(ex, w){ return w.list.length > 0; },
    render: function(ex, w){
      var itemById = {};
      ex.answer.items.forEach(function(it){ itemById[it.id] = it; });
      var h = '<div class="small" style="margin-bottom:6px;">Put the items in the right order. Use the arrows to move them.</div>';
      w.list.forEach(function(id, i){
        var st = "";
        if(w.checked && w.grade){
          var ok = (ex.answer.correctOrder[i] === id);
          st = '<span class="opt-state st-' + (ok ? "correct" : "wrong") + '">' + (ok ? "✓" : "✗") + "</span>";
        }
        h += '<div class="order-row"><span class="order-pos">' + (i + 1) + ".</span>"
          + '<span class="order-text">' + esc(itemById[id].text) + "</span>" + st
          + (w.checked ? "" :
            '<button type="button" class="arrowbtn" data-mv="up" data-i="' + i + '" aria-label="Move up: ' + esc(shortTxt(itemById[id].text, 50)) + '" ' + (i === 0 ? "disabled" : "") + ">▲</button>" +
            '<button type="button" class="arrowbtn" data-mv="down" data-i="' + i + '" aria-label="Move down: ' + esc(shortTxt(itemById[id].text, 50)) + '" ' + (i === w.list.length - 1 ? "disabled" : "") + ">▼</button>")
          + "</div>";
      });
      return h;
    },
    bind: function(ex, w, root){
      if(w.checked){ return; }
      root.querySelectorAll(".arrowbtn").forEach(function(b){
        b.addEventListener("click", function(){
          if(w.checked){ return; }
          var i = parseInt(b.getAttribute("data-i"), 10);
          var dir = b.getAttribute("data-mv") === "up" ? -1 : 1;
          var j = i + dir;
          if(j < 0 || j >= w.list.length){ return; }
          var t = w.list[i]; w.list[i] = w.list[j]; w.list[j] = t;
          renderMain();
        });
      });
    },
    grade: function(ex, w){
      var N = w.list.length, H = 0, W = 0, items = [];
      var byId = {};
      ex.answer.items.forEach(function(it){ byId[it.id] = it; });
      w.list.forEach(function(id, i){
        var want = ex.answer.correctOrder[i];
        if(id === want){
          H++;
          items.push({ label: "Position " + (i + 1) + " — " + shortTxt(byId[id].text, 70), state: "correct", note: "This item is in the right position." });
        } else {
          W++;
          items.push({ label: "Position " + (i + 1) + " — " + shortTxt(byId[id].text, 70), state: "wrong", note: "Wrong position. This slot should hold: " + shortTxt(byId[want] ? byId[want].text : "?", 70) });
        }
      });
      return { H: H, W: W, N: N, items: items };
    }
  },

  /* ---------- drag & drop categorisation ---------- */
  dragdrop: {
    canCheck: function(ex, w){
      return ex.answer.items.some(function(it){ return w.place[it.id]; });
    },
    render: function(ex, w){
      var byId = {};
      ex.answer.items.forEach(function(it){ byId[it.id] = it; });
      function chip(id, inBucket){
        var it = byId[id];
        var st = "";
        if(w.checked && w.grade){
          var want = ex.answer.correct[id];
          var got = w.place[id] || "";
          var ok = (got === want);
          st = inBucket ? '<span class="opt-state st-' + (ok ? "correct" : got ? "wrong" : "missed") + '">' + (ok ? "✓" : got ? "✗" : "○") + "</span>" : '<span class="opt-state st-missed">○ missed</span>';
        }
        return '<span class="chip' + (w.selItem === id && !w.checked ? " chip-selected" : "") + '" draggable="' + (!w.checked) + '" data-item="' + esc(id) + '" data-inbucket="' + (inBucket ? "1" : "0") + '" role="button" tabindex="0" aria-label="' + esc(it.text) + '">' + esc(it.text) + st + "</span>";
      }
      var h = '<div class="small" style="margin-bottom:6px;">Drag each item into the right zone — or click an item, then click a zone. Click an item inside a zone to send it back.</div>';
      h += '<div class="bank" id="ddBank" data-bucket="">';
      w.itemPerm.forEach(function(ii){
        var it = ex.answer.items[ii];
        if(!w.place[it.id]){ h += chip(it.id, false); }
      });
      h += "</div>";
      h += '<div class="bankzones">';
      ex.answer.buckets.forEach(function(b){
        h += '<div class="bucket" data-bucket="' + esc(b.id) + '" role="group" aria-label="Drop zone: ' + esc(b.label) + '"><div class="bucket-label">' + esc(b.label) + "</div><div class=\"bucket-items\">";
        Object.keys(w.place).forEach(function(iid){
          if(w.place[iid] === b.id){ h += chip(iid, true); }
        });
        h += "</div></div>";
      });
      h += "</div>";
      return h;
    },
    bind: function(ex, w, root){
      function placeItem(iid, bid){
        if(w.checked){ return; }
        if(bid){ w.place[iid] = bid; } else { delete w.place[iid]; }
        w.selItem = null;
        renderMain();
      }
      root.querySelectorAll(".chip").forEach(function(c){
        var iid = c.getAttribute("data-item");
        var inBucket = c.getAttribute("data-inbucket") === "1";
        c.addEventListener("dragstart", function(ev){
          try{ ev.dataTransfer.setData("text/plain", iid); }catch(e){}
        });
        c.addEventListener("click", function(){
          if(w.checked){ return; }
          if(inBucket){ placeItem(iid, ""); return; }
          w.selItem = (w.selItem === iid ? null : iid);
          renderMain();
        });
        c.addEventListener("keydown", function(ev){
          if(w.checked){ return; }
          if(ev.key === "Enter" || ev.key === " "){
            ev.preventDefault();
            if(inBucket){ placeItem(iid, ""); } else { w.selItem = (w.selItem === iid ? null : iid); renderMain(); }
          }
        });
      });
      root.querySelectorAll(".bucket, #ddBank").forEach(function(z){
        var bid = z.getAttribute("data-bucket");
        z.addEventListener("dragover", function(ev){ ev.preventDefault(); z.classList.add("bucket-over"); });
        z.addEventListener("dragleave", function(){ z.classList.remove("bucket-over"); });
        z.addEventListener("drop", function(ev){
          ev.preventDefault();
          z.classList.remove("bucket-over");
          var iid = null;
          try{ iid = ev.dataTransfer.getData("text/plain"); }catch(e){}
          if(iid){ placeItem(iid, bid); }
        });
        z.addEventListener("click", function(ev){
          if(w.checked){ return; }
          if(ev.target !== z && ev.target !== z.querySelector(".bucket-label") && ev.target !== z.querySelector(".bucket-items")){ return; }
          if(w.selItem){ placeItem(w.selItem, bid); }
        });
      });
    },
    grade: function(ex, w){
      var N = ex.answer.items.length, H = 0, W = 0, items = [];
      var byId = {};
      ex.answer.items.forEach(function(it){ byId[it.id] = it; });
      var bucketName = {};
      ex.answer.buckets.forEach(function(b){ bucketName[b.id] = b.label; });
      ex.answer.items.forEach(function(it){
        var got = w.place[it.id] || "";
        var want = ex.answer.correct[it.id];
        if(got === want){
          H++;
          items.push({ label: shortTxt(it.text, 80), state: "correct", note: "Right zone: " + bucketName[want] });
        } else if(got){
          W++;
          items.push({ label: shortTxt(it.text, 80), state: "wrong", note: "You placed it in " + bucketName[got] + ". Right zone: " + bucketName[want] });
        } else {
          items.push({ label: shortTxt(it.text, 80), state: "missed", note: "Left in the bank. Right zone: " + bucketName[want] });
        }
      });
      return { H: H, W: W, N: N, items: items };
    }
  },

  /* ---------- fill in the blanks ---------- */
  fill: {
    canCheck: function(ex, w){
      var n = ex.answer.blanks.length;
      for(var i = 0; i < n; i++){ if(w.filled[i]){ return true; } }
      return false;
    },
    render: function(ex, w){
      var mode = ex.answer.mode || "select";
      var h = "";
      if(mode === "select"){
        h += '<div class="small" style="margin-bottom:6px;">Pick the right word for each blank from the word bank (the bank order is shuffled on purpose).</div>';
        h += '<div class="bank">';
        w.bankPerm.forEach(function(bi){
          h += '<span class="chip chip-static">' + esc(ex.answer.bank[bi]) + "</span>";
        });
        h += "</div>";
        h += '<div class="fill-para">';
        ex.answer.segments.forEach(function(seg, i){
          h += "<span>" + esc(seg) + "</span> ";
          if(i < ex.answer.blanks.length){
            var v = w.filled[i] || "";
            h += '<select class="fill-select" data-bi="' + i + '" aria-label="Blank ' + (i + 1) + '"' + (w.checked ? " disabled" : "") + '>';
            h += '<option value="">— choose —</option>';
            w.bankPerm.forEach(function(bi){
              var val = ex.answer.bank[bi];
              h += '<option value="' + esc(val) + '"' + (v === val ? " selected" : "") + ">" + esc(val) + "</option>";
            });
            h += "</select> ";
          }
        });
        h += "</div>";
      } else {
        h += '<div class="small" style="margin-bottom:6px;">Type the missing piece into each blank. Spelling must match the wording used in the scenario.</div>';
        h += '<div class="fill-para">';
        ex.answer.segments.forEach(function(seg, i){
          h += "<span>" + esc(seg) + "</span> ";
          if(i < ex.answer.blanks.length){
            var v = w.filled[i] || "";
            h += '<input type="text" class="fill-input" data-bi="' + i + '" value="' + esc(v) + '" aria-label="Blank ' + (i + 1) + '"' + (w.checked ? " disabled" : "") + "> ";
          }
        });
        h += "</div>";
      }
      return h;
    },
    bind: function(ex, w, root){
      if(w.checked){ return; }
      var mode = ex.answer.mode || "select";
      if(mode === "select"){
        root.querySelectorAll(".fill-select").forEach(function(s){
          s.addEventListener("change", function(){
            w.filled[s.getAttribute("data-bi")] = s.value;
          });
        });
      } else {
        root.querySelectorAll(".fill-input").forEach(function(inp){
          inp.addEventListener("input", function(){
            w.filled[inp.getAttribute("data-bi")] = inp.value;
          });
        });
      }
    },
    grade: function(ex, w){
      var N = ex.answer.blanks.length, H = 0, W = 0, items = [];
      ex.answer.blanks.forEach(function(b, i){
        var v = String(w.filled[i] || "").trim().toLowerCase();
        if(!v){
          items.push({ label: "Blank " + (i + 1), state: "missed", note: "Left empty. Accept: " + shortTxt(b.accept.join(" / "), 80) + (b.note ? " — " + b.note : "") });
        } else if(b.accept.some(function(a){ return String(a).trim().toLowerCase() === v; })){
          H++;
          items.push({ label: "Blank " + (i + 1) + " — " + shortTxt(v, 40), state: "correct", note: b.note || "Correct." });
        } else {
          W++;
          items.push({ label: "Blank " + (i + 1) + " — " + shortTxt(v, 40), state: "wrong", note: "Not the right word here. Accept: " + shortTxt(b.accept.join(" / "), 80) + (b.note ? " — " + b.note : "") });
        }
      });
      return { H: H, W: W, N: N, items: items };
    }
  },

  /* ---------- terminal simulation ---------- */
  terminal: {
    canCheck: function(ex, w){ return String(w.cmd || "").trim().length > 0; },
    render: function(ex, w){
      var a = ex.answer;
      var h = '<div class="term"><div class="term-head">'
        + '<span class="term-dot" style="background:var(--state-incorrect);"></span>'
        + '<span class="term-dot" style="background:var(--state-partial);"></span>'
        + '<span class="term-dot" style="background:var(--state-correct);"></span>'
        + "<span>" + esc(a.termTitle || "simulated shell — nothing real is executed") + "</span></div>";
      h += '<div class="term-scroll" aria-live="polite">';
      w.echo.forEach(function(l){ h += '<div class="term-line">' + l + "</div>"; });
      h += "</div>";
      h += '<div class="term-input-row"><span class="term-prompt">' + esc(a.prompt) + '</span>'
        + '<input type="text" class="term-input" id="termInput" value="' + esc(w.cmd) + '" ' + (w.checked ? "disabled" : "") + ' spellcheck="false" autocomplete="off" aria-label="Type the command">'
        + (w.checked ? "" : '<button type="button" class="runbtn" id="termRun">Run ▸</button>')
        + "</div></div>";
      if(a.syntax){
        h += '<div class="art" style="margin-top:10px;"><div class="art-label">' + esc(a.syntax.label || "SYNTAX REMINDER (example on a different target)") + "</div><div class=\"mono-scroll\"><pre class=\"code\">";
        (a.syntax.lines || []).forEach(function(l){ h += hl(l) + "\n"; });
        h += "</pre></div></div>";
      }
      return h;
    },
    bind: function(ex, w, root){
      if(w.checked){ return; }
      var inp = root.querySelector("#termInput");
      var run = root.querySelector("#termRun");
      function runCmd(){
        var c = inp.value;
        w.cmd = c;
        w.echo.push('<span class="term-prompt">' + esc(ex.answer.prompt) + "</span> " + esc(c));
        (ex.answer.output || []).forEach(function(l){ w.echo.push('<span style="color:var(--text-secondary);">' + esc(l) + "</span>"); });
        w.ran = true;
        renderMain();
        var el = root.querySelector("#termInput");
        if(el){ el.focus(); }
      }
      if(inp){
        inp.addEventListener("input", function(){ w.cmd = inp.value; });
        inp.addEventListener("keydown", function(ev){
          if(ev.key === "Enter"){ ev.preventDefault(); runCmd(); }
        });
      }
      if(run){ run.addEventListener("click", runCmd); }
    },
    grade: function(ex, w){
      var req = ex.answer.required || [];
      var forb = ex.answer.forbidden || [];
      var N = req.length;
      var norm = String(w.cmd || "").trim().replace(/\s+/g, " ").toLowerCase();
      var H = 0, W = 0, items = [];
      if(!norm){
        req.forEach(function(r){
          items.push({ label: r.desc, state: "missed", note: "No command was submitted." });
        });
        return { H: 0, W: 0, N: Math.max(1, N), items: items };
      }
      req.forEach(function(r){
        var hit = new RegExp(r.re, "i").test(norm);
        if(hit){ H++; }
        items.push({ label: r.desc, state: hit ? "correct" : "missed", note: hit ? "Found in your command." : "Missing or wrong in your command." });
      });
      forb.forEach(function(f){
        var hit = new RegExp(f.re, "i").test(norm);
        if(hit){
          W++;
          items.push({ label: f.desc, state: "wrong", danger: !!f.danger, note: (f.danger ? "DANGEROUS — this would change system state or destroy evidence. " : "") + (f.note || "") });
        }
      });
      return { H: H, W: W, N: Math.max(1, N), items: items };
    }
  },

  /* ---------- branching decision tree ---------- */
  branch: {
    canCheck: function(ex, w){ return w.step >= ex.answer.steps.length; },
    render: function(ex, w){
      var steps = ex.answer.steps;
      var h = '<div class="small" style="margin-bottom:8px;">Answer each step in order. Your choices are recorded and graded together at the final step.</div>';
      steps.forEach(function(st, i){
        var done = i < w.step;
        var cur = (i === w.step && !w.checked);
        h += '<div class="kwgroup" style="margin:10px 0;">';
        h += '<div class="kwtheme">STEP ' + (i + 1) + " OF " + steps.length + (done ? " — locked" : cur ? "" : w.checked ? " — locked" : "") + "</div>";
        h += '<p style="margin:6px 0 10px;">' + esc(st.text) + "</p>";
        var perm = w.stepPerm[i];
        perm.forEach(function(oi, di){
          var selIdx = w.stepSel[i];
          var sel = (selIdx === oi);
          var cls = cur ? "opt" + (sel ? " opt-selected" : "") : "opt";
          var mark = "";
          if(w.checked && w.grade){
            var okStep = (w.stepSel[i] === st.correctIndex);
            if(sel && okStep){ mark = '<span class="opt-state st-correct">✓</span>'; }
            else if(sel && !okStep){ mark = '<span class="opt-state st-wrong">✗</span>'; }
            else if(!sel && oi === st.correctIndex){ mark = '<span class="opt-state st-missed">○</span>'; }
          }
          h += '<div class="' + cls + '" style="cursor:' + (cur ? "pointer" : "default") + ';"' + (cur ? ' data-step="' + i + '" data-oi="' + oi + '" role="radio" aria-checked="' + sel + '"' : "") + ">"
            + '<span class="opt-key">' + LETTERS[di] + '.</span><span>' + esc(st.options[oi]) + "</span>"
            + (sel && cur ? '<span class="opt-selmark">◉ selected</span>' : "") + mark + "</div>";
        });
        h += "</div>";
      });
      return h;
    },
    bind: function(ex, w, root){
      var curStep = w.step, steps = ex.answer.steps;
      if(w.step < steps.length && !w.checked){
        root.querySelectorAll('[data-step="' + curStep + '"]').forEach(function(d){
          d.addEventListener("click", function(){
            w.stepSel[curStep] = parseInt(d.getAttribute("data-oi"), 10);
            renderMain();
          });
        });
      }
    },
    grade: function(ex, w){
      var steps = ex.answer.steps, N = steps.length, H = 0, W = 0, items = [];
      steps.forEach(function(st, i){
        var ok = (w.stepSel[i] === st.correctIndex);
        if(ok){ H++; } else { W++; }
        items.push({
          label: "Step " + (i + 1) + ": " + shortTxt(st.text, 70),
          state: ok ? "correct" : "wrong",
          note: ok ? "Good call." : "Better call: " + shortTxt(st.options[st.correctIndex], 90)
        });
      });
      return { H: H, W: W, N: N, items: items };
    }
  },

  /* ---------- SOC alert triage ---------- */
  triage: {
    canCheck: function(ex, w){
      return Object.keys(w.alertSel).some(function(k){ return w.alertSel[k] !== undefined && w.alertSel[k] !== null; });
    },
    render: function(ex, w){
      var h = '<div class="small" style="margin-bottom:8px;">Choose one action for each alert. All alerts are graded together when you press Check.</div>';
      ex.answer.alerts.forEach(function(a, ai){
        h += '<div class="kwgroup" style="margin:10px 0;"><div class="kwtheme">ALERT ' + (ai + 1) + " — " + esc(a.title) + "</div>";
        h += '<p style="margin:6px 0 10px;">' + esc(a.detail) + "</p>";
        var perm = w.alertPerm[a.id] || range(a.actions.length);
        perm.forEach(function(oi, di){
          var sel = (w.alertSel[a.id] === oi);
          var mark = "";
          if(w.checked && w.grade){
            var ok = (w.alertSel[a.id] === ex.answer.correct[a.id]);
            if(sel && ok){ mark = '<span class="opt-state st-correct">✓</span>'; }
            else if(sel && !ok){ mark = '<span class="opt-state st-wrong">✗</span>'; }
            else if(!sel && oi === ex.answer.correct[a.id]){ mark = '<span class="opt-state st-missed">○</span>'; }
          }
          h += '<div class="opt' + (sel ? " opt-selected" : "") + '" style="cursor:' + (w.checked ? "default" : "pointer") + ';"' + (w.checked ? "" : ' data-alert="' + esc(a.id) + '" data-oi="' + oi + '" role="radio" aria-checked="' + sel + '"') + ">"
            + '<span class="opt-key">' + LETTERS[di] + '.</span><span>' + esc(a.actions[oi]) + "</span>"
            + (sel && !w.checked ? '<span class="opt-selmark">◉ selected</span>' : "") + mark + "</div>";
        });
        h += "</div>";
      });
      return h;
    },
    bind: function(ex, w, root){
      if(w.checked){ return; }
      root.querySelectorAll("[data-alert]").forEach(function(d){
        d.addEventListener("click", function(){
          w.alertSel[d.getAttribute("data-alert")] = parseInt(d.getAttribute("data-oi"), 10);
          renderMain();
        });
      });
    },
    grade: function(ex, w){
      var N = ex.answer.alerts.length, H = 0, W = 0, items = [];
      ex.answer.alerts.forEach(function(a){
        var sel = w.alertSel[a.id];
        var want = ex.answer.correct[a.id];
        if(sel === undefined || sel === null){
          items.push({ label: a.title, state: "missed", note: "No action chosen. Best action: " + shortTxt(a.actions[want], 90) });
        } else if(sel === want){
          H++;
          items.push({ label: a.title, state: "correct", note: "Right call: " + shortTxt(a.actions[sel], 90) });
        } else {
          W++;
          items.push({ label: a.title, state: "wrong", note: "You chose: " + shortTxt(a.actions[sel], 70) + ". Best action: " + shortTxt(a.actions[want], 70) });
        }
      });
      return { H: H, W: W, N: N, items: items };
    }
  }
};

/* ================= rendering ================= */
function renderHeader(){
  var hdr = $("hdr");
  if(!hdr || !S){ return; }
  var pos = (S.phase === "exam") ? (S.cur + 1) : null;
  var idx = S.order[S.cur];
  var ex = EXERCISES[idx];
  var countHtml = "";
  if(S.phase === "exam" && ex){
    countHtml = '<span class="hdr-chip">Exercise <b>' + (S.cur + 1) + "</b> of <b>" + S.order.length + "</b></span>";
  } else if(S.phase === "review"){
    countHtml = '<span class="hdr-chip">Review skipped — <b>' + skippedRemaining().length + "</b> left</span>";
  }
  var pct = S.answered > 0 ? Math.round((S.scoreSum / S.answered) * 100) : 0;
  var scoreHtml = '<span class="hdr-chip">Score <b>' + (Math.round(S.scoreSum * 10) / 10).toFixed(1) + "</b> / " + S.answered + " · " + pct + "%</span>";
  var answeredN = S.results.filter(function(r){ return r && r.status === "answered"; }).length;
  var barPct = Math.round((answeredN / EXERCISES.length) * 100);
  hdr.innerHTML =
    '<div class="hdr-row">' + countHtml +
    '<span class="badge ' + SEV_CLASS[EXAM.severity] + '"><span class="dot" aria-hidden="true"></span>' + esc(EXAM.severity) + "</span>" +
    timerStateHtml() + scoreHtml +
    '<span class="hdr-spacer"></span>' +
    (S.phase === "exam" && ex && !S.work[idx].checked && !S.paused ?
      '<button type="button" class="hbtn" id="btnHint" ' + (S.work[idx].usedHint ? "disabled" : "") + '>💡 Hint (−10%)</button>' : "") +
    (S.phase === "exam" ? '<button type="button" class="hbtn" id="btnPause">' + (S.paused ? "▶ Resume" : "⏸ Pause") + "</button>" : "") +
    (S.phase === "exam" && ex && !S.work[idx].checked ? '<button type="button" class="hbtn" id="btnSkip">⏭ Skip</button>' : "") +
    "</div>" +
    '<div class="hdr-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + barPct + '" aria-label="Exam progress"><div class="bar-fill" style="width:' + barPct + "%;background:" + SEV_VAR[EXAM.severity] + ';"></div></div>';

  var bh = $("btnHint"); if(bh){ bh.addEventListener("click", doHint); }
  var bp = $("btnPause"); if(bp){ bp.addEventListener("click", S.paused ? doResume : doPause); }
  var bs = $("btnSkip"); if(bs){ bs.addEventListener("click", doSkip); }
}

function actionsHtml(ex, w){
  var h = '<div class="actions">';
  if(ex.type !== "branch"){
    if(!w.checked){
      h += '<button type="button" class="btn btn-primary" id="btnCheck">✓ Check answer</button>';
    }
  }
  if(w.checked){
    var last = !canAdvance() || S.reviewing;
    var nextLabel = S.reviewing ? (skippedRemaining().length > 0 ? "Back to review ▸" : "Finish exam ▸") : (canAdvance() ? "Next exercise ▸" : "Finish exam ▸");
    h += '<button type="button" class="btn btn-primary" id="btnNext">' + nextLabel + "</button>";
  }
  h += "</div>";
  return h;
}

function feedbackHtml(ex, w){
  if(!w.checked || !w.grade){ return ""; }
  var g = w.grade, credit = w.credit;
  var cls, ico, word;
  if(credit >= 1){ cls = "fb-correct"; ico = "✓"; word = "CORRECT"; }
  else if(credit > 0){ cls = "fb-partial"; ico = "✓"; word = "PARTIALLY CORRECT"; }
  else { cls = "fb-incorrect"; ico = "✗"; word = "INCORRECT"; }
  var h = '<div class="fb ' + cls + '" role="status">';
  h += '<div class="fb-head"><span aria-hidden="true">' + ico + '</span> ' + word;
  h += '<span class="fb-credit">credit ' + credit.toFixed(2) + (w.usedHint ? " (hint −10% applied)" : "") + "</span></div>";
  h += '<div class="fb-body">';
  if(g.items && g.items.some(function(it){ return it.danger; })){
    h += '<div class="fb-nearmiss">⚠ DANGEROUS — NEAR MISS: your command matches a destructive or state-changing pattern. It was scored as wrong; use the read-only command shown below.</div>';
  }
  h += '<p class="fb-formula">credit = max(0, (H − W) ÷ N) = (' + g.H + " − " + g.W + ") ÷ " + g.N + "</p>";
  h += '<p class="fb-expl">' + esc(ex.explanation) + "</p>";
  if(g.items && g.items.length > 1 || (ex.type !== "qcm")){
    h += '<div class="fb-items">';
    g.items.forEach(function(it){
      var ico2 = it.state === "correct" ? "✓" : it.state === "wrong" ? "✗" : "○";
      var wrd = it.state === "correct" ? "Correct" : it.state === "wrong" ? "Wrong" : "Missed";
      h += '<div class="fb-item"><span class="fb-ico st-' + it.state + '" aria-hidden="true">' + ico2 + '</span>'
        + '<span class="fb-item-word st-' + it.state + '">' + wrd + '</span>'
        + "<span><span class=\"fb-item-label\">" + esc(it.label) + "</span>"
        + (it.note ? '<span class="fb-item-note"> — ' + esc(it.note) + "</span>" : "") + "</span></div>";
    });
    h += "</div>";
  }
  if(ex.type === "terminal"){
    h += '<div class="canon-label">EXPECTED COMMAND (canonical form)</div>';
    h += '<div class="copyrow"><pre class="code" style="flex:1;min-width:260px;" id="canonCmd">' + esc(ex.answer.canonical) + '</pre><button type="button" class="copybtn" id="btnCopy">Copy</button></div>';
  }
  if(ex.study){
    h += '<p class="fb-study"><b>What to study:</b> ' + esc(ex.study) + "</p>";
  }
  h += "</div></div>";
  return h;
}

function examMainHtml(){
  var idx = S.order[S.cur], ex = EXERCISES[idx], w = S.work[idx];
  var h = "";
  if(S.paused){
    h += '<div class="pausecard" role="alert"><div class="pauseword">⏸ PAUSED — manual (press Resume)</div>';
    h += '<p class="pausesub">The exercise is hidden while you take a break. The timer is stopped.</p>';
    h += '<button type="button" class="btn btn-primary" id="btnResume2">▶ Resume</button></div>';
    return h;
  }
  h += '<section class="card" aria-label="Exercise ' + (S.cur + 1) + " of " + S.order.length + '">';
  h += scenarioHtml(ex);
  h += '<div class="blk blk-q"><div class="blk-head"><span aria-hidden="true">❓</span> QUESTION</div><div class="blk-body"><p class="q-text">' + esc(ex.question) + "</p></div></div>";
  h += '<div class="blk blk-ans"><div class="blk-head"><span aria-hidden="true">✎</span> YOUR ANSWER</div><div class="blk-body" id="ansWrap">';
  h += TYPES[ex.type].render(ex, w);
  h += "</div></div>";
  if(ex.type === "branch" && !w.checked){
    var steps = ex.answer.steps;
    var last = (w.step === steps.length - 1);
    h += '<div class="actions"><button type="button" class="btn btn-primary" id="btnStep"' + (w.stepSel[w.step] === undefined || w.stepSel[w.step] === null ? "" : "") + ">" +
      (last ? "⚖ Submit decision ▸ (final Check)" : "Confirm &amp; continue ▸") + "</button></div>";
  }
  h += actionsHtml(ex, w);
  if(w.usedHint){
    h += '<div class="hint-panel"><span class="hint-tag">💡 HINT</span> — ' + esc(ex.hint) + " <span class='small'>(this hint costs 10% of this exercise's credit)</span></div>";
  }
  h += feedbackHtml(ex, w);
  h += "</section>";
  return h;
}

function bindExamMain(root){
  var idx = S.order[S.cur], ex = EXERCISES[idx], w = S.work[idx];
  bindScenario(root);
  TYPES[ex.type].bind(ex, w, root);
  var bc = $("btnCheck"); if(bc){ bc.addEventListener("click", doCheck); }
  var bn = $("btnNext"); if(bn){ bn.addEventListener("click", doNext); }
  var br2 = $("btnResume2"); if(br2){ br2.addEventListener("click", doResume); }
  var bcp = $("btnCopy");
  if(bcp){
    bcp.addEventListener("click", function(){
      var txt = ex.answer.canonical;
      try{
        navigator.clipboard.writeText(txt).then(function(){ bcp.textContent = "Copied ✓"; }, function(){ bcp.textContent = "Select & copy"; });
      }catch(e){ bcp.textContent = "Select & copy"; }
    });
  }
  if(ex.type === "branch" && !w.checked){
    var bs2 = $("btnStep");
    if(bs2){
      bs2.addEventListener("click", function(){
        var steps = ex.answer.steps;
        if(w.stepSel[w.step] === undefined || w.stepSel[w.step] === null){ return; }
        if(w.step < steps.length - 1){
          w.step++;
          renderMain();
        } else {
          gradeCurrent();
        }
      });
    }
  }
  var tinp = root.querySelector("#termInput");
  if(tinp && !w.checked){ tinp.focus(); }
}

function renderMain(){
  var main = $("main");
  if(!main){ return; }
  main.innerHTML = examMainHtml();
  bindExamMain(main);
  var ex = EXERCISES[S.order[S.cur]];
  var w = S.work[S.order[S.cur]];
  var ansWrap = main.querySelector("#ansWrap");
  if(w.checked){
    main.querySelectorAll("select, input").forEach(function(el){
      if(!el.classList.contains("logf")){ el.disabled = true; }
    });
  }
  var fb = main.querySelector(".fb");
  if(fb){ fb.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
}

function renderReview(){
  var remaining = skippedRemaining();
  var h = '<section class="card" aria-label="Review skipped exercises">';
  h += '<h2 style="margin-top:0;"><span style="color:var(--state-skipped);">⚠</span> Review skipped exercises</h2>';
  h += '<p>You skipped ' + remaining.length + ' exercise' + (remaining.length === 1 ? "" : "s") + '. You can answer ' + (remaining.length === 1 ? "it" : "them") + ' now, as many times as you want, while the timer is still running. If you submit now, skipped-and-never-answered exercises are excluded from your score.</p>';
  h += '<p class="pausenote">⏱ Time left: <b>' + fmtClock(S.timer.remaining) + "</b> · timer state: " + (S.timer.state === "RUNNING" ? "▶ RUNNING" : S.timer.state) + "</p>";
  remaining.forEach(function(idx){
    var ex = EXERCISES[idx];
    var pos = S.order.indexOf(idx);
    h += '<div class="skiprow"><span style="color:var(--state-skipped);" aria-hidden="true">⚠</span><span class="sk-word">Skipped</span><span class="sk-title">' + esc(ex.scenario && ex.scenario.title ? ex.scenario.title : "Exercise " + idx) + "</span>" +
      '<button type="button" class="btn btn-ghost" data-pos="' + pos + '">Answer</button></div>';
  });
  h += '<div class="actions"><button type="button" class="btn btn-primary" id="btnFinal">🏁 Final Submit</button></div>';
  h += "</section>";
  return h;
}

function bindReview(root){
  root.querySelectorAll("[data-pos]").forEach(function(b){
    b.addEventListener("click", function(){ reviewAnswer(parseInt(b.getAttribute("data-pos"), 10)); });
  });
  var bf = $("btnFinal"); if(bf){ bf.addEventListener("click", showResults); }
}

function renderResults(){
  var answered = S.answered;
  var fully = 0, partial = 0, incorrect = 0, partialSum = 0;
  S.results.forEach(function(r){
    if(r && r.status === "answered"){
      if(r.credit >= 1){ fully++; }
      else if(r.credit > 0){ partial++; partialSum += r.credit; }
      else { incorrect++; }
    }
  });
  var skippedN = S.results.filter(function(r){ return r && r.status === "skipped"; }).length;
  var nullN = S.results.filter(function(r){ return !r; }).length;
  var percent = answered > 0 ? Math.round((S.scoreSum / answered) * 100) : 0;
  var passed = percent >= EXAM.passMark;
  var h = '<section class="card" aria-label="Exam results">';
  h += '<h2 style="margin-top:0;">🏁 Results — ' + esc(EXAM.mitreId) + " — " + esc(EXAM.severity) + "</h2>";
  h += '<div class="result-big"><span class="result-score">' + Math.round(S.scoreSum) + " / " + answered + '</span><span class="result-pct">' + percent + "%</span>" +
    '<span class="badge ' + (passed ? "sev-easy" : "sev-extreme") + '" style="font-size:15px;">' + (passed ? "✓ PASS" : "✗ FAIL") + "</span></div>";
  h += '<p class="pausenote">Raw credit sum ' + (Math.round(S.scoreSum * 100) / 100).toFixed(2) + " over " + answered + " answered exercise" + (answered === 1 ? "" : "s") + " · pass mark " + EXAM.passMark + "% · computed only over answered exercises.</p>";
  if(passed){
    h += '<div class="passpanel"><div class="pass-label" style="color:var(--state-correct);">✓ PASS — ' + esc(EXAM.mitreId) + " — " + esc(EXAM.severity) + "</div>";
    h += '<p style="margin:8px 0 0;">Nice work. You reached the pass mark. Your result has been recorded.</p></div>';
  } else {
    h += '<div class="failpanel"><div class="pass-label" style="color:var(--state-incorrect);">✗ FAIL — you must retake this exam</div>';
    h += '<p style="margin:8px 0 0;">You needed ' + EXAM.passMark + "%. Review the feedback you collected, then try again. Questions and options are reshuffled on every retake.</p></div>";
  }
  h += '<div class="fb-items">';
  h += '<div class="fb-item"><span class="fb-ico st-correct">✓</span><span class="fb-item-word st-correct">Fully correct</span><span><span class="fb-item-label">' + fully + ' exercise' + (fully === 1 ? "" : "s") + '</span></span></div>';
  h += '<div class="fb-item"><span class="fb-ico st-partial">✓</span><span class="fb-item-word st-partial">Partially correct</span><span><span class="fb-item-label">' + partial + (partial > 0 ? " · avg credit " + (Math.round((partialSum / partial) * 100) / 100).toFixed(2) : "") + '</span></span></div>';
  h += '<div class="fb-item"><span class="fb-ico st-wrong">✗</span><span class="fb-item-word st-wrong">Fully incorrect</span><span><span class="fb-item-label">' + incorrect + '</span></span></div>';
  h += '<div class="fb-item"><span class="fb-ico st-missed">⚠</span><span class="fb-item-word st-missed">Skipped — excluded</span><span><span class="fb-item-label">' + skippedN + " (not counted in score)</span></span></div>";
  if(nullN > 0){
    h += '<div class="fb-item"><span class="fb-ico st-missed">○</span><span class="fb-item-word st-missed">Not reached — excluded</span><span><span class="fb-item-label">' + nullN + " (exam timer ended first; not counted in score)</span></span></div>";
  }
  h += "</div>";
  h += '<p class="pausenote">⏱ Time on this attempt: ' + fmtClock(S.elapsedSec) + " · paused manually: " + fmtClock(S.pause.manualSec) + " · reviewing feedback: " + fmtClock(S.pause.feedbackSec) + "</p>";
  h += '<div class="actions"><button type="button" class="btn btn-primary" id="btnRetake">↻ Retake exam</button></div>';
  h += "</section>";
  return h;
}

function bindResults(root){
  var br = $("btnRetake"); if(br){ br.addEventListener("click", doRetake); }
}

function renderIntro(){
  var h = "";
  h += '<section class="intro-hero" aria-label="Exam introduction">';
  h += '<p class="intro-kicker">CYBERPULSE ACADEMY — PRACTICE CERTIFICATION EXAM</p>';
  h += '<h1 class="intro-title">' + esc(EXAM.mitreId) + " — " + esc(EXAM.severity) + " practice exam</h1>";
  h += '<p class="intro-obj">ATT&amp;CK object: <b style="color:var(--text-primary);">' + esc(EXAM.mitreId) + " — " + esc(EXAM.objectName) + "</b> · type: " + esc(EXAM.objectType) + " · tactic: Defense Evasion (TA0005)</p>";
  h += '<div class="factrow">';
  h += '<span class="fact">Severity <b style="color:' + SEV_VAR[EXAM.severity] + ';">● ' + esc(EXAM.severity) + "</b></span>";
  h += '<span class="fact">Exercises <b>' + EXERCISES.length + "</b></span>";
  h += '<span class="fact">Estimated time <b>' + EXAM.estimatedMinutes + " min</b> · timer budget <b>" + EXAM.timerMinutes + " min</b></span>";
  h += '<span class="fact">Pass mark <b>' + EXAM.passMark + "%</b></span>";
  if(S && S.handshake && (S.handshake.username || S.handshake.country)){
    h += '<span class="fact">Signed in as <b>' + esc(S.handshake.username || "learner") + (S.handshake.country ? " (" + esc(S.handshake.country) + ")" : "") + "</b></span>";
  }
  h += "</div></section>";

  h += '<section class="sect" aria-label="What you will learn here">';
  h += '<h2 class="sect-title"><span class="sx">1</span>What you will learn here</h2>';
  (EXAM.learnIntro || []).forEach(function(p){
    h += '<div class="card" style="margin:10px 0;"><p style="margin:0;">' + esc(p) + "</p></div>";
  });
  h += "</section>";

  h += '<section class="sect" aria-label="Keywords covered in this exam">';
  h += '<h2 class="sect-title"><span class="sx">2</span>Keywords covered in this exam</h2>';
  (EXAM.keywords || []).forEach(function(kg){
    h += '<div class="kwgroup"><p class="kwtheme">' + esc(kg.theme) + '</p><div class="kwitems">';
    (kg.items || []).forEach(function(k){ h += '<span class="kw">' + esc(k) + "</span>"; });
    h += "</div></div>";
  });
  h += "</section>";

  h += '<section class="sect" aria-label="How this exam works">';
  h += '<h2 class="sect-title"><span class="sx">3</span>How this exam works</h2>';
  h += '<div class="card"><ul class="rules">';
  h += "<li><b>Pass mark " + EXAM.passMark + "%.</b> Your final score is computed only over the exercises you actually answered.</li>";
  var typesUsed = [];
  var seen = {};
  EXERCISES.forEach(function(e){ if(!seen[e.type]){ seen[e.type] = true; typesUsed.push(e.type); } });
  h += "<li><b>Exercise types in this exam:</b> " + typesUsed.map(function(t){ return TYPE_LABEL[t] || t; }).join("; ") + ".</li>";
  h += "<li><b>Partial credit.</b> Exercises with several correct items are scored with <span class='rx'>credit = max(0, (H − W) ÷ N)</span>: correct items (H) minus wrong items (W), divided by the number of correct items (N). Selecting everything does not help — wrong picks subtract.</li>";
  h += "<li><b>Timer.</b> A " + EXAM.timerMinutes + "-minute countdown runs while you work. Pressing <b>Check</b> stops the timer automatically so you can read the feedback without pressure; the timer resumes only when you press <b>Next</b> (or Final Submit on the last exercise).</li>";
  h += "<li><b>Manual Pause.</b> The Pause button hides the exercise and stops the timer for a real break; Resume brings it back.</li>";
  h += "<li><b>Hints.</b> One hint per exercise; a hint costs <span class='rx'>−10% of that exercise's credit</span>.</li>";
  h += "<li><b>Skips.</b> Every exercise has a Skip button. Skipping is free; before finishing you get a review screen where you can answer skipped exercises while the timer allows. Skipped-and-never-answered exercises are excluded from the score.</li>";
  h += "<li><b>Retake.</b> If you fail, you can retake the exam — questions and options are reshuffled.</li>";
  h += "</ul>";
  h += '<div class="startrow"><button type="button" class="startbtn" id="btnStart">▶ Start the exam</button><span class="small">Nothing real is executed. All systems, logs and alerts are simulated.</span></div>';
  h += "</div></section>";
  return h;
}

function render(){
  var app = $("app");
  if(!app || !S){ return; }
  if(S.phase === "intro"){
    app.innerHTML = renderIntro();
    var bst = $("btnStart"); if(bst){ bst.addEventListener("click", doStart); }
    return;
  }
  var h = '<header class="hdr" id="hdr"></header><div id="main"></div>';
  if(S.phase === "exam"){ app.innerHTML = h; renderHeader(); var main = $("main"); main.innerHTML = examMainHtml(); bindExamMain(main); }
  else if(S.phase === "review"){ app.innerHTML = h; renderHeader(); $("main").innerHTML = renderReview(); bindReview($("main")); }
  else if(S.phase === "results"){ app.innerHTML = renderResults(); bindResults(app); }
}

/* ================= boot ================= */
S = freshState();
render();
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
