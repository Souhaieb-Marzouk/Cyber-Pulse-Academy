    username: event.data.username || '',
    country: event.data.country || '',
    locale: event.data.locale || 'en',
    theme: event.data.theme || 'dark'   /* always 'dark': the file is dark-only, nothing to switch */
  };
  if (st.screen === 'intro') showIntro();   /* re-render so the learner name appears in the header strip */
});

/* ================= score report (STEP 6.2) ================= */
function reportScore(creditSum, answeredCount) {
  var origin = String(location.origin || '');
  if (origin.indexOf('http') !== 0) return;   /* opened directly (file://): there is no site to report to — stay console-clean */
  var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent >= META.passMark
    }, location.origin);
  } catch (e) {
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}

/* ================= review-skipped screen ================= */
function showReview() {
  st.screen = 'review';
  renderHeader();
  renderProgress();
  var list;
  if (st.skipped.length === 0) {
    list = '<div class="card"><p class="learn-p">✓ No skipped exercises. Everything was answered — well done, analyst.</p></div>';
  } else {
    list = st.skipped.map(function (id) {
      var ex = EXS[exIndex(id)];
      return '<div class="review-item"><span class="ri-tag">⚠ Skipped</span>' +
        '<span class="ri-t">' + esc(ex.id) + ' — ' + esc(ex.title) + '</span>' +
        '<button class="btn" data-answer="' + esc(id) + '">↩ Answer now</button></div>';
    }).join('');
    list = '<div class="card">' +
      '<p class="learn-p">You still have <b>' + st.skipped.length + '</b> skipped exercise(s). You may return to them as many times as you need while the timer runs. If you submit now, they are excluded from your score.</p>' + list + '</div>';
  }
  $('app').innerHTML = '<div class="wrap">' +
    '<h2 class="sec">Review skipped exercises</h2>' + list +
    '<div class="footerbar">' +
      '<button class="btn" id="btnBackExam">← Back to the exam overview</button>' +
      '<span class="spacer"></span>' +
      '<button class="btn btn-ok" id="btnFinal" style="min-width:200px">🏁 Final Submit</button>' +
    '</div></div>';
  var btns = document.querySelectorAll('[data-answer]');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function () {
      st.fromReview = true;
      st.cur = st.order.indexOf(exIndex(this.getAttribute('data-answer')));
      st.screen = 'exam';
      renderHeader(); renderExercise();
    });
  }
  $('btnFinal').addEventListener('click', function () { showResults(false); });
  $('btnBackExam').addEventListener('click', function () {
    st.fromReview = false;
    st.cur = firstUnanswered();
    if (st.cur < 0) showReview(); else { st.screen = 'exam'; renderHeader(); renderExercise(); }
  });
  window.scrollTo(0, 0);
}
function firstUnanswered() {
  for (var i = 0; i < st.order.length; i++) {
    var id = EXS[st.order[i]].id;
    if (!st.answered[id] && st.skipped.indexOf(id) < 0) return i;
  }
  return -1;
}
function exIndex(id) {
  for (var i = 0; i < EXS.length; i++) if (EXS[i].id === id) return i;
  return -1;
}

/* ================= results screen ================= */
function showResults(autoEnded) {
  st.screen = 'results';
  if (st.state !== T_ENDED) setState(T_ENDED);
  if (autoEnded) {
    /* timer ran out: every never-answered exercise counts as skipped-and-never-answered */
    for (var pi = 0; pi < st.order.length; pi++) {
      var pid = EXS[st.order[pi]].id;
      if (!st.answered[pid] && st.skipped.indexOf(pid) < 0) st.skipped.push(pid);
    }
  }
  var fully = 0, part = 0, bad = 0, partSum = 0;
  Object.keys(st.credits).forEach(function (k) {
    var c = st.credits[k];
    if (c >= 0.999) fully++;
    else if (c > 0) { part++; partSum += c; }
    else bad++;
  });
  var skippedN = st.skipped.length;
  var answered = st.answeredCount;
  var pct = answered > 0 ? Math.round((st.creditSum / answered) * 100) : 0;
  var pass = pct >= META.passMark;
  renderHeader(); renderProgress();
  var heroCls = pass ? 'pass' : 'fail';
  var html = '<div class="wrap">' +
    '<div class="result-hero ' + heroCls + '">' +
      '<div style="font-size:15px;color:var(--text-secondary);letter-spacing:.06em">RESULTS — ' + esc(META.title) + '</div>' +
      '<div class="big">' + (pass ? '✓ PASS' : '✗ FAIL') + '</div>' +
      '<div class="pct">' + st.creditSum.toFixed(1) + ' / ' + answered + ' — <span id="pctNum">0%</span></div>' +
      '<div class="msg">' + (autoEnded
        ? 'The timer ran out, so the exam closed automatically. Unanswered skipped exercises were excluded from the score.'
        : (pass ? 'You reached the ' + META.passMark + '% pass mark. Certificate-level performance on ' + esc(sevWord()) + '.' : 'You need ' + META.passMark + '% or more to pass. Review the explanations below the fold and retake when ready.')) + '</div>' +
    '</div>' +
    '<div class="statgrid">' +
      '<div class="stat ok"><div class="n">✓ ' + fully + '</div><div class="l">Fully correct</div><div class="avg">credit 1.0 each</div></div>' +
      '<div class="stat part"><div class="n">✓ ' + part + '</div><div class="l">Partially correct</div><div class="avg">' + (part ? 'avg credit ' + (partSum / part).toFixed(2) : 'avg —') + '</div></div>' +
      '<div class="stat bad"><div class="n">✗ ' + bad + '</div><div class="l">Fully incorrect</div><div class="avg">credit 0.0 each</div></div>' +
      '<div class="stat skip"><div class="n">⚠ ' + skippedN + '</div><div class="l">Skipped — excluded</div><div class="avg">not counted in numerator or denominator</div></div>' +
    '</div>' +
    '<div class="timegrid">' +
      '<span>⏱ Time left: ' + fmtSecs(st.remaining) + '</span>' +
      '<span>⏸ Paused manually (breaks): ' + fmtDur(st.manualMs) + '</span>' +
      '<span>⏸ Paused for feedback review: ' + fmtDur(st.feedbackMs) + '</span>' +
      '<span>🎯 Pass mark: ' + META.passMark + '%</span>' +
    '</div>' +
    '<div class="footerbar"><span class="spacer"></span>' +
      '<button class="btn btn-primary" id="btnRetake" style="min-width:200px">↻ Retake exam</button></div>' +
  '</div>';
  $('app').innerHTML = html;
  $('btnRetake').addEventListener('click', startExam);
  window.scrollTo(0, 0);
  /* score animation: the big percent counts up; the score message is posted
     exactly once per attempt, only after the animation has settled */
  var reduceMotion = false;
  try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  var pctEl = $('pctNum');
  if (pctEl && !reduceMotion && pct > 0) {
    var t0 = null, DUR = 700;
    var step = function (ts) {
      if (t0 === null) t0 = ts;
      var k = Math.min(1, (ts - t0) / DUR);
      pctEl.textContent = Math.round(pct * k) + '%';
      if (k < 1) requestAnimationFrame(step);
      else pctEl.textContent = pct + '%';
    };
    requestAnimationFrame(step);
  } else if (pctEl) {
    pctEl.textContent = pct + '%';
  }
  if (!st.reported) {
    st.reported = true;
    var post = function () { reportScore(st.creditSum, answered); };
    if (reduceMotion) post(); else setTimeout(post, 850);
  }
}

/* ================= exercise rendering: scenario + question ================= */
function artefactHTML(a) {
  var inner;
  if (a.kind === 'mono') {
    inner = '<pre class="mono">' + (a.filter ? '<span data-lines></span>' : hl(a.body)) + '</pre>';
  } else {
    inner = '<div class="bbody" style="padding:12px 14px">' + a.body + '</div>';
  }
  var frow = a.filter && a.kind === 'mono'
    ? '<div class="filterrow"><span class="fcount">🔎 filter</span><input type="text" aria-label="Filter log lines" placeholder="type to filter lines…"><span class="fcount" data-fcount></span></div>'
    : '';
  return '<div class="artefact"><div class="art-label">' + esc(a.label) + '</div>' + frow + inner + '</div>';
}
function wireFilter(root, body) {
  var inp = root.querySelector('.filterrow input');
  if (!inp) return;
  var linesEl = root.querySelector('[data-lines]');
  var cnt = root.querySelector('[data-fcount]');
  var all = body.split('\n');
  function apply() {
    var q = inp.value.trim().toLowerCase();
    var keep = q ? all.filter(function (l) { return l.toLowerCase().indexOf(q) >= 0; }) : all;
    linesEl.innerHTML = hl(keep.join('\n'));
    cnt.textContent = keep.length + '/' + all.length + ' lines';
  }
  inp.addEventListener('input', apply);
  apply();
}
function scenarioHTML(ex) {
  var arts = (ex.scenario && ex.scenario.artefacts || []).map(artefactHTML).join('');
  var intro = (ex.scenario && ex.scenario.intro) ? '<p class="learn-p">' + ex.scenario.intro + '</p>' : '';
  return '' +
    '<div class="block b-blue" id="blkScenario">' +
      '<button class="sc-head" id="scToggle" aria-expanded="true"><span class="ic">🧭</span><b>SCENARIO</b>' +
      '<span class="sc-sum">' + esc(ex.summary) + '</span><span class="caret">▾</span></button>' +
      '<div class="sc-body"><div class="bbody">' + intro + arts + '</div></div>' +
    '</div>';
}

/* keyboard focus continuity: re-rendering a widget must not drop focus to <body> */
function refocusSel(root, sel) {
  if (!sel) return;
  var el = root.querySelector(sel);
  if (el && el.focus) { try { el.focus({ preventScroll: true }); } catch (e) { try { el.focus(); } catch (e2) {} } }
}
function activeAttr(el, attr) {
  return (el && el.getAttribute) ? el.getAttribute(attr) : null;
}

/* ================= shared option shuffling ================= */
function permFor(ex, n) {
  var key = 'p' + n;
  if (!ex._ui.perm) ex._ui.perm = {};
  if (!ex._ui.perm[key]) {
    var a = [];
    for (var i = 0; i < n; i++) a.push(i);
    ex._ui.perm[key] = shuffle(a);
  }
  return ex._ui.perm[key];
}

/* ================= qcm (single answer) ================= */
RENDER.qcm = function (ex, root) {
  var perm = permFor(ex, ex.options.length);
  ex._ui.sel = null;
  root.innerHTML = perm.map(function (oi, di) {
    return '<button class="opt" data-orig="' + oi + '"><span class="lab">' + 'ABCDEF'[di] + '.</span><span>' + esc(ex.options[oi]) + '</span></button>';
  }).join('');
  var opts = root.querySelectorAll('.opt');
  for (var i = 0; i < opts.length; i++) {
    opts[i].addEventListener('click', function () {
      if (st.answered[ex.id]) return;
      for (var j = 0; j < opts.length; j++) opts[j].classList.remove('sel');
      this.classList.add('sel');
      ex._ui.sel = parseInt(this.getAttribute('data-orig'), 10);
    });
  }
  ex._grade = function () {
    var ok = ex._ui.sel === ex.answer;
    if (!ok && root) {
      var el = root.querySelector('.opt[data-orig="' + ex.answer + '"]');
      if (el) el.classList.add('ok');
      var sel = root.querySelector('.opt.sel');
      if (sel) sel.classList.add('bad');
    } else if (ok) {
      var s2 = root.querySelector('.opt.sel'); if (s2) s2.classList.add('ok');
    }
    var rows;
    if (ok) {
      rows = [{ state: 'ok', label: '✓ Correct — your answer: ' + esc(ex.options[ex.answer]), why: ex.explain }];
    } else {
      rows = [
        { state: 'bad', label: '✗ Wrong — your answer: ' + esc(ex._ui.sel === null ? '(nothing selected)' : ex.options[ex._ui.sel]), why: (ex.itemWhy && ex.itemWhy[ex._ui.sel] ? ex.itemWhy[ex._ui.sel] : ex.explain) },
        { state: 'miss', label: '○ Missed — correct answer: ' + esc(ex.options[ex.answer]), why: (ex.itemWhy && ex.itemWhy[ex.answer] ? ex.itemWhy[ex.answer] : '') }
      ];
    }
    return { credit: ok ? 1 : 0, rows: rows };
  };
  ex._presence = function () { return ex._ui.sel !== null; };
  ex._warn = 'Select one option before pressing Check.';
};

/* ================= multi (multi-select, partial credit) ================= */
RENDER.multi = function (ex, root) {
  var perm = permFor(ex, ex.options.length);
  ex._ui.sel = {};
  root.innerHTML = perm.map(function (oi, di) {
    return '<button class="opt" data-orig="' + oi + '"><span class="lab">' + 'ABCDEF'[di] + '.</span><span>' + esc(ex.options[oi]) + '</span></button>';
  }).join('');
  var opts = root.querySelectorAll('.opt');
  for (var i = 0; i < opts.length; i++) {
    opts[i].addEventListener('click', function () {
      if (st.answered[ex.id]) return;
      this.classList.toggle('sel');
      var o = parseInt(this.getAttribute('data-orig'), 10);
      if (this.classList.contains('sel')) ex._ui.sel[o] = true; else delete ex._ui.sel[o];
    });
  }
  ex._grade = function () {
    var H = 0, W = 0, N = ex.correct.length;
    var rows = [];
    for (var i = 0; i < ex.options.length; i++) {
      var isC = ex.correct.indexOf(i) >= 0, isS = !!ex._ui.sel[i];
      var why = (ex.itemWhy && ex.itemWhy[i]) ? ex.itemWhy[i] : '';
      if (isS && isC) { H++; rows.push({ state: 'ok', label: '✓ Correct — ' + esc(ex.options[i]), why: why }); }
      else if (isS && !isC) { W++; rows.push({ state: 'bad', label: '✗ Wrong — ' + esc(ex.options[i]), why: why }); }
      else if (!isS && isC) { rows.push({ state: 'miss', label: '○ Missed — ' + esc(ex.options[i]), why: why }); }
    }
    return { credit: scoreExercise(H, W, N), rows: rows, meta: { H: H, W: W, N: N } };
  };
  ex._presence = function () { return Object.keys(ex._ui.sel).length > 0; };
  ex._warn = 'Select at least one option before pressing Check.';
};

/* ================= drag & drop (items -> slots, partial credit) ================= */
RENDER.dnd = function (ex, root) {
  ex._ui.place = {};   // bankId -> slotId
  ex._ui.armed = null;
  var bank = shuffle(ex.bank);
  root.innerHTML = '<div class="dnd-wrap">' +
    '<div class="dnd-bank"><div class="dnd-col-title">◍ ITEM BANK (drag or click, then click a zone)</div><div id="bankList"></div></div>' +
    '<div class="dnd-zones"><div class="dnd-col-title">▢ DROP ZONES</div>' +
      ex.slots.map(function (s) {
        return '<div class="slot" data-slot="' + esc(s.id) + '"><div class="slot-label">▢ ' + esc(s.label) + '</div><div class="slot-inner"></div></div>';
      }).join('') +
    '</div></div>';
  var bankList = root.querySelector('#bankList');
  function chipHTML(b) { return '<button class="chip" draggable="true" data-bank="' + esc(b.id) + '">' + esc(b.text) + '</button>'; }
  function drawBank() {
    var left = bank.filter(function (b) { return !ex._ui.place[b.id]; });
    bankList.innerHTML = left.map(chipHTML).join('') || '<div class="small">All items placed.</div>';
  }
  function drawSlots() {
    root.querySelectorAll('.slot').forEach(function (slotEl) {
      var id = slotEl.getAttribute('data-slot');
      var items = bank.filter(function (b) { return ex._ui.place[b.id] === id; });
      slotEl.querySelector('.slot-inner').innerHTML = items.map(function (b) {
        return '<button class="chip pop" data-bank="' + esc(b.id) + '">' + esc(b.text) + '</button>';
      }).join('');
    });
  }
  function redraw(focusBank) {
    var aeBank = activeAttr(document.activeElement, 'data-bank');
    drawBank(); drawSlots(); wireChips(); syncArmed();
    refocusSel(root, focusBank ? '.chip[data-bank="' + focusBank + '"]' : (aeBank ? '.chip[data-bank="' + aeBank + '"]' : null));
  }
  function wireChips() {
    root.querySelectorAll('.chip').forEach(function (c) {
      c.addEventListener('click', function () {
        if (st.answered[ex.id]) return;
        var id = this.getAttribute('data-bank');
        var slotEl = this.closest ? this.closest('.slot') : null;
        if (ex._ui.armed && slotEl) {
          /* armed item + click on a chip sitting inside a zone -> place into that zone
             (previously this popped the placed item back out — a click-steal bug) */
          ex._ui.place[ex._ui.armed] = slotEl.getAttribute('data-slot');
          ex._ui.armed = null;
        } else if (!ex._ui.armed && ex._ui.place[id]) {
          /* nothing armed + click a placed chip -> pick it back to the bank */
          delete ex._ui.place[id];
          ex._ui.armed = id;
        } else {
          /* bank chip: arm it (click again to disarm, click another to switch) */
          ex._ui.armed = (ex._ui.armed === id) ? null : id;
        }
        redraw();
      });
      c.addEventListener('dragstart', function (ev) {
        ev.dataTransfer.setData('text/plain', this.getAttribute('data-bank'));
        try { ev.dataTransfer.setData('bankid', this.getAttribute('data-bank')); } catch (e) {}
      });
    });
  }
  function syncArmed() {
    root.querySelectorAll('.chip').forEach(function (c) {
      c.classList.toggle('armed', c.getAttribute('data-bank') === ex._ui.armed);
    });
  }
  root.querySelectorAll('.slot').forEach(function (slotEl) {
    slotEl.setAttribute('tabindex', '0');
    slotEl.setAttribute('role', 'button');
    slotEl.setAttribute('aria-label', 'Drop zone: ' + slotEl.querySelector('.slot-label').textContent.replace(/^▢\s*/, '') + ' — press Enter to place the armed item');
    slotEl.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      ev.preventDefault();
      if (st.answered[ex.id] || !ex._ui.armed) return;
      var wasArmed = ex._ui.armed;
      ex._ui.place[wasArmed] = slotEl.getAttribute('data-slot');
      ex._ui.armed = null; redraw(wasArmed);
    });
    slotEl.addEventListener('click', function (ev) {
      if (st.answered[ex.id] || !ex._ui.armed) return;
      if (ev.target.closest && ev.target.closest('.chip')) return;
      var wasArmed = ex._ui.armed;
      ex._ui.place[wasArmed] = this.getAttribute('data-slot');
      ex._ui.armed = null; redraw(wasArmed);
    });
    slotEl.addEventListener('dragover', function (ev) { ev.preventDefault(); this.classList.add('over'); });
    slotEl.addEventListener('dragleave', function () { this.classList.remove('over'); });
    slotEl.addEventListener('drop', function (ev) {
      ev.preventDefault(); this.classList.remove('over');
      if (st.answered[ex.id]) return;
      var id = ev.dataTransfer.getData('text/plain');
      if (id) { ex._ui.place[id] = this.getAttribute('data-slot'); ex._ui.armed = null; redraw(); }
    });
  });
  redraw();
  ex._grade = function () {
    var H = 0, W = 0, N = ex.bank.length, rows = [];
    var slotById = {}; ex.slots.forEach(function (s) { slotById[s.id] = s; });
    ex.bank.forEach(function (b) {
      var to = ex._ui.place[b.id];
      var slotEl = root.querySelector('.slot[data-slot="' + to + '"]');
      if (to && slotById[to].accept.indexOf(b.id) >= 0) {
        H++; rows.push({ state: 'ok', label: '✓ Correct — “' + esc(b.text) + '” is in “' + esc(slotById[to].label) + '”', why: (ex.itemWhy && ex.itemWhy[b.id]) || '' });
        if (slotEl) slotEl.classList.add('ok');
      } else if (to) {
        W++; rows.push({ state: 'bad', label: '✗ Wrong — “' + esc(b.text) + '” is in “' + esc(slotById[to].label) + '”', why: (ex.itemWhy && ex.itemWhy[b.id]) || '' });
        if (slotEl) slotEl.classList.add('bad');
      } else {
        rows.push({ state: 'miss', label: '○ Missed — “' + esc(b.text) + '” was not placed', why: (ex.itemWhy && ex.itemWhy[b.id]) || '' });
      }
    });
    return { credit: scoreExercise(H, W, N), rows: rows, meta: { H: H, W: W, N: N } };
  };
  ex._presence = function () { return Object.keys(ex._ui.place).length > 0; };
  ex._warn = 'Place at least one item before pressing Check.';
};

/* ================= matching (pairs, partial credit) ================= */
RENDER.match = function (ex, root) {
  ex._ui.pair = {};      // leftId -> right index
  ex._ui.armedL = null;
  var lefts = shuffle(ex.lefts.map(function (l, i) { return i; }));
  var rights = shuffle(ex.rights.map(function (r, i) { return i; }));
  root.innerHTML = '<div class="match-grid">' +
    '<div class="match-list" id="mL"><div class="dnd-col-title">◉ LEFT COLUMN (click one)</div></div>' +
    '<div class="match-list" id="mR"><div class="dnd-col-title">◉ RIGHT COLUMN (then click its partner)</div></div>' +
    '</div>';
  function draw() {
    var aeL = activeAttr(document.activeElement, 'data-left');
    var aeR = activeAttr(document.activeElement, 'data-right');
    ex._ui._aeL = aeL; ex._ui._aeR = aeR;
    root.querySelector('#mL').innerHTML = '<div class="dnd-col-title">◉ LEFT COLUMN</div>' +
      lefts.map(function (li) {
        var l = ex.lefts[li];
        var p = ex._ui.pair[l.id];
        return '<button class="mitem' + (ex._ui.armedL === l.id ? ' armed' : '') + '" data-left="' + esc(l.id) + '">' +
          '<b>' + esc(l.text) + '</b>' + (p !== undefined ? '<span class="pair-tag">→ ' + esc(ex.rights[p]) + '</span>' : '') + '</button>';
      }).join('');
    root.querySelector('#mR').innerHTML = '<div class="dnd-col-title">◉ RIGHT COLUMN</div>' +
      rights.map(function (ri) {
        return '<button class="mitem" data-right="' + ri + '">' + esc(ex.rights[ri]) + '</button>';
      }).join('');
    root.querySelectorAll('[data-left]').forEach(function (el) {
      el.addEventListener('click', function () {
        if (st.answered[ex.id]) return;
        var id = this.getAttribute('data-left');
        if (ex._ui.pair[id] !== undefined) { delete ex._ui.pair[id]; ex._ui.armedL = null; }
        else ex._ui.armedL = (ex._ui.armedL === id) ? null : id;
        draw();
      });
    });
    root.querySelectorAll('[data-right]').forEach(function (el) {
      el.addEventListener('click', function () {
        if (st.answered[ex.id] || ex._ui.armedL === null) return;
        ex._ui.pair[ex._ui.armedL] = parseInt(this.getAttribute('data-right'), 10);
        ex._ui.armedL = null; draw();
      });
    });
    if (aeL) refocusSel(root, '[data-left="' + aeL + '"]');
    else if (aeR !== null && aeR !== undefined) refocusSel(root, '[data-right="' + aeR + '"]');
  }
  draw();
  ex._grade = function () {
    var H = 0, W = 0, N = ex.lefts.length, rows = [];
    ex.lefts.forEach(function (l) {
      var p = ex._ui.pair[l.id];
      var okRow = p !== undefined && p === l.right;
      if (okRow) {
        H++; rows.push({ state: 'ok', label: '✓ Correct pair — ' + esc(l.text) + ' → ' + esc(ex.rights[p]), why: (ex.itemWhy && ex.itemWhy[l.id]) || '' });
      } else if (p !== undefined) {
        W++; rows.push({ state: 'bad', label: '✗ Wrong pair — ' + esc(l.text) + ' → ' + esc(ex.rights[p]), why: (ex.itemWhy && ex.itemWhy[l.id]) || '' });
      } else {
        rows.push({ state: 'miss', label: '○ Missed — ' + esc(l.text) + ' was not paired', why: (ex.itemWhy && ex.itemWhy[l.id]) || '' });
      }
    });
    return { credit: scoreExercise(H, W, N), rows: rows, meta: { H: H, W: W, N: N } };
  };
  ex._presence = function () { return Object.keys(ex._ui.pair).length > 0; };
  ex._warn = 'Make at least one pair before pressing Check.';
};

/* ================= fill-in-the-blank (word bank, partial credit) ================= */
RENDER.fib = function (ex, root) {
  ex._ui.fill = {};      // blankIdx -> word
  ex._ui.armedW = null;
  var bank = shuffle(ex.bank);
  var parts = ex.text.split(/\{\{(\d+)\}\}/);
  var html = '<div class="fib-text">';
  for (var i = 0; i < parts.length; i++) {
    if (i % 2 === 0) html += esc(parts[i]);
    else html += '<button class="blank" data-blank="' + parts[i] + '">&nbsp;…&nbsp;</button>';
  }
  html += '</div><div class="dnd-col-title mt8">◍ WORD BANK (click a word, then click a blank)</div><div class="bank" id="bank"></div>';
  root.innerHTML = html;
  function draw() {
    ex._ui._aeW = activeAttr(document.activeElement, 'data-word');
    ex._ui._aeB = activeAttr(document.activeElement, 'data-blank');
    root.querySelectorAll('.blank').forEach(function (b) {
      var bi = b.getAttribute('data-blank');
      var w = ex._ui.fill[bi];
      b.textContent = w ? w : '…';
      b.classList.toggle('filled', !!w);
    });
    root.querySelector('#bank').innerHTML = bank.map(function (w) {
      var used = Object.keys(ex._ui.fill).some(function (k) { return ex._ui.fill[k] === w; });
      return '<button class="bword' + (used ? ' used' : '') + (ex._ui.armedW === w ? ' armed' : '') + '" data-word="' + esc(w) + '">' + esc(w) + '</button>';
    }).join('');
    root.querySelectorAll('.bword').forEach(function (bw) {
      bw.addEventListener('click', function () {
        if (st.answered[ex.id]) return;
        var w = this.getAttribute('data-word');
        Object.keys(ex._ui.fill).forEach(function (k) { if (ex._ui.fill[k] === w) delete ex._ui.fill[k]; });
        ex._ui.armedW = (ex._ui.armedW === w) ? null : w;
        draw();
      });
    });
    root.querySelectorAll('.blank').forEach(function (b) {
      b.onclick = function () {
        if (st.answered[ex.id]) return;
        var bi = this.getAttribute('data-blank');
        if (!ex._ui.armedW && ex._ui.fill[bi]) { delete ex._ui.fill[bi]; draw(); return; }
        if (!ex._ui.armedW) return;
        ex._ui.fill[bi] = ex._ui.armedW; ex._ui.armedW = null; draw();
      };
    });
    if (ex._refocus) ex._refocus();
  }
  draw();
  ex._grade = function () {
    var H = 0, W = 0, N = ex.blanks.length, rows = [];
    ex.blanks.forEach(function (w, i) {
      var got = ex._ui.fill[i];
      if (got === w) { H++; rows.push({ state: 'ok', label: '✓ Correct — blank ' + (i + 1) + ': “' + esc(w) + '”', why: (ex.itemWhy && ex.itemWhy[i]) || '' }); }
      else if (got) { W++; rows.push({ state: 'bad', label: '✗ Wrong — blank ' + (i + 1) + ': you wrote “' + esc(got) + '” (expected “' + esc(w) + '”)', why: (ex.itemWhy && ex.itemWhy[i]) || '' }); }
      else { rows.push({ state: 'miss', label: '○ Missed — blank ' + (i + 1) + ': “' + esc(w) + '”', why: (ex.itemWhy && ex.itemWhy[i]) || '' }); }
    });
    return { credit: scoreExercise(H, W, N), rows: rows, meta: { H: H, W: W, N: N } };
  };
  ex._refocus = function () {
    refocusSel(root, ex._ui._aeW ? '.bword[data-word="' + ex._ui._aeW + '"]' : (ex._ui._aeB ? '.blank[data-blank="' + ex._ui._aeB + '"]' : null));
  };
  ex._presence = function () { return Object.keys(ex._ui.fill).length > 0; };
  ex._warn = 'Fill at least one blank before pressing Check.';
};

/* ================= ordering / ranking (partial credit per position) ================= */
RENDER.order = function (ex, root) {
  ex._ui.arr = shuffle(ex.items.map(function (x, i) { return i; }));
  root.innerHTML = '<div class="dnd-col-title">↕ Arrange in the required order (use the arrows, or drag rows)</div><div class="olist" id="olist"></div>';
  function draw() {
    var aeUp = activeAttr(document.activeElement, 'data-up');
    var aeDown = activeAttr(document.activeElement, 'data-down');
    root.querySelector('#olist').innerHTML = ex._ui.arr.map(function (oi, pos) {
      return '<div class="oitem" draggable="true" data-pos="' + pos + '">' +
        '<span class="num">' + (pos + 1) + '</span><span class="txt">' + esc(ex.items[oi]) + '</span>' +
        '<span class="mv"><button data-up="' + pos + '" aria-label="Move up">↑</button><button data-down="' + pos + '" aria-label="Move down">↓</button></span></div>';
    }).join('');
    root.querySelectorAll('[data-up]').forEach(function (b) {
      b.addEventListener('click', function () {
        var p = parseInt(this.getAttribute('data-up'), 10);
        if (p > 0) { var t = ex._ui.arr[p]; ex._ui.arr[p] = ex._ui.arr[p - 1]; ex._ui.arr[p - 1] = t; draw(); }
      });
    });
    root.querySelectorAll('[data-down]').forEach(function (b) {
      b.addEventListener('click', function () {
        var p = parseInt(this.getAttribute('data-down'), 10);
        if (p < ex._ui.arr.length - 1) { var t = ex._ui.arr[p]; ex._ui.arr[p] = ex._ui.arr[p + 1]; ex._ui.arr[p + 1] = t; draw(); }
      });
    });
    var dragPos = null;
    root.querySelectorAll('.oitem').forEach(function (el) {
      el.addEventListener('dragstart', function (ev) { dragPos = parseInt(this.getAttribute('data-pos'), 10); });
      el.addEventListener('dragover', function (ev) { ev.preventDefault(); });
      el.addEventListener('drop', function (ev) {
        ev.preventDefault();
        var to = parseInt(this.getAttribute('data-pos'), 10);
        if (dragPos === null || dragPos === to) return;
        var it = ex._ui.arr.splice(dragPos, 1)[0];
        ex._ui.arr.splice(to, 0, it);
        dragPos = null; draw();
      });
    });
    var aeSel = aeUp !== null ? '[data-up="' + aeUp + '"]' : (aeDown !== null ? '[data-down="' + aeDown + '"]' : null);
    if (aeSel) { var aeEl = root.querySelector(aeSel); if (aeEl && aeEl.focus) { try { aeEl.focus({ preventScroll: true }); } catch (e) { try { aeEl.focus(); } catch (e2) {} } } }
  }
  draw();
  var mode = ex.rank ? 'Rank the items (1 = highest priority / most urgent)' : 'Put the steps in the correct order';
  root.querySelector('.dnd-col-title').textContent = '↕ ' + mode + ' — use the arrows, or drag rows';
  ex._grade = function () {
    var H = 0, W = 0, N = ex.items.length, rows = [];
    ex._ui.arr.forEach(function (oi, pos) {
      var ok = oi === pos;
      if (ok) { H++; rows.push({ state: 'ok', label: '✓ Correct — position ' + (pos + 1) + ': “' + esc(ex.items[oi]) + '”', why: (ex.itemWhy && ex.itemWhy[oi]) || '' }); }
      else { W++; rows.push({ state: 'bad', label: '✗ Wrong — position ' + (pos + 1) + ': “' + esc(ex.items[oi]) + '”', why: (ex.itemWhy && ex.itemWhy[oi]) || '' }); }
    });
    return { credit: scoreExercise(H, W, N), rows: rows, meta: { H: H, W: W, N: N } };
  };
  ex._presence = function () { return true; };
  ex._warn = '';
};

/* ================= spot the mistake (click lines, partial credit) ================= */
RENDER.spot = function (ex, root) {
  ex._ui.sel = {};
  root.innerHTML = '<div class="dnd-col-title">◉ Click every line you believe is wrong (click again to un-select)</div>' +
    '<ul class="spotlines">' + ex.lines.map(function (l, i) {
      return '<li><button class="sline" data-ln="' + i + '"><span class="ln">' + (i + 1) + '</span><span class="mono">' + hl(l) + '</span></button></li>';
    }).join('') + '</ul>';
  root.querySelectorAll('.sline').forEach(function (el) {
    el.addEventListener('click', function () {
      if (st.answered[ex.id]) return;
      this.classList.toggle('sel');

      if (this.classList.contains('sel')) ex._ui.sel[i] = true; else delete ex._ui.sel[i];
    });
  });

    var H = 0, W = 0, N = ex.correct.length, rows = [];

      var isC = ex.correct.indexOf(i) >= 0, isS = !!ex._ui.sel[i];
      var why = (ex.itemWhy && ex.itemWhy[i]) ? ex.itemWhy[i] : '';
      if (isS && isC) { H++; rows.push({ state: 'ok', label: '✓ Correct — line ' + (i + 1), why: why }); }
      else if (isS && !isC) { W++; rows.push({ state: 'bad', label: '✗ Wrong — line ' + (i + 1) + ' is fine', why: why }); }
      else if (!isS && isC) { rows.push({ state: 'miss', label: '○ Missed — line ' + (i + 1), why: why }); }
      if (lineEls[i]) {
        if (isC) lineEls[i].classList.add('ok');
        else if (isS) lineEls[i].classList.add('bad');

    });
    return { credit: scoreExercise(H, W, N), rows: rows, meta: { H: H, W: W, N: N } };
  };
  ex._presence = function () { return Object.keys(ex._ui.sel).length > 0; };
  ex._warn = 'Select at least one line before pressing Check.';
};

/* ================= triage queue (per-alert choices, partial credit) ================= */
RENDER.triage = function (ex, root) {
  ex._ui.sel = {};
  ex._ui.permA = {};
  root.innerHTML = '<div class="dnd-col-title">◉ For each alert, choose the best response. Grade once with Check.</div>' +
    ex.alerts.map(function (a, i) {
      return '<div class="alert"><div class="alert-h">⚑ ' + esc(a.ref) + '</div>' +
        '<pre class="mono">' + hl(a.body) + '</pre>' +
        '<div class="opts" data-alert="' + i + '">' +
        a.options.map(function (o, oi) { return '<button class="opt" data-oi="' + oi + '"><span class="lab">' + 'ABC'[oi] + '.</span><span>' + esc(o) + '</span></button>'; }).join('') +
        '</div></div>';
    }).join('');
  ex.alerts.forEach(function (a, i) {
    ex._ui.permA[i] = shuffle(a.options.map(function (x, oi) { return oi; }));
    var box = root.querySelector('[data-alert="' + i + '"]');
    var btns = box.querySelectorAll('.opt');
    /* re-order DOM by perm */
    ex._ui.permA[i].forEach(function (orig) {
      box.appendChild(box.querySelector('.opt[data-oi="' + orig + '"]'));
    });
    Array.prototype.forEach.call(box.querySelectorAll('.opt'), function (el, di) {
      var lab = el.querySelector('.lab'); if (lab) lab.textContent = 'ABCDEF'[di] + '.';
      el.addEventListener('click', function () {
        if (st.answered[ex.id]) return;
        box.querySelectorAll('.opt').forEach(function (o) { o.classList.remove('sel'); });
        el.classList.add('sel');
        ex._ui.sel[i] = parseInt(el.getAttribute('data-oi'), 10);
      });
    });
  });
  ex._grade = function () {
    var H = 0, W = 0, N = ex.alerts.length, rows = [];
    ex.alerts.forEach(function (a, i) {
      var sel = ex._ui.sel[i];
      if (sel === a.answer) { H++; rows.push({ state: 'ok', label: '✓ Correct — ' + esc(a.ref) + ': ' + esc(a.options[sel]), why: a.why }); }
      else { W++; rows.push({ state: 'bad', label: '✗ Wrong — ' + esc(a.ref) + ': you chose "' + esc(a.options[sel]) + '". Better: "' + esc(a.options[a.answer]) + '"', why: a.why }); }
    });
    return { credit: scoreExercise(H, W, N), rows: rows, meta: { H: H, W: W, N: N } };
  };
  ex._presence = function () { return Object.keys(ex._ui.sel).length === ex.alerts.length; };
  ex._warn = 'Choose a response for every alert before pressing Check.';
};

/* ================= branching decision tree (auto-pause only on final check) ================= */
RENDER.decision = function (ex, root) {
  ex._ui.step = 0; ex._ui.choices = {}; ex._ui.permS = {};
  root.innerHTML = '<div id="decSteps"></div>' +
    '<div class="footerbar"><button class="btn btn-ok" id="btnStep">▸ Continue</button>' +
    '<span class="small" id="stepNote">Choose a response for the step, then Continue. The timer keeps running between steps — it pauses only on the final Check.</span></div>';
  function drawStep() {
    var i = ex._ui.step, s = ex.steps[i];
    if (!ex._ui.permS[i]) ex._ui.permS[i] = shuffle(s.options.map(function (x, oi) { return oi; }));
    var d = document.createElement('div');
    d.className = 'step-block'; d.setAttribute('data-step', i);
    var prev = '';
    if (i > 0) {
      var pc = ex._ui.choices[i - 1];
      var oc = ex.steps[i - 1].outcomes ? ex.steps[i - 1].outcomes[pc] : '';
      prev = '<div class="outcome"><b>After your choice:</b> ' + esc(oc || 'The scenario moves on.') + '</div>';
    }
    d.innerHTML = '<span class="step-tag">STEP ' + (i + 1) + ' OF ' + ex.steps.length + '</span>' + prev +
      '<p class="learn-p" style="margin-top:6px">' + esc(s.situation) + '</p>' +
      s.options.map(function (o, oi) { return '<button class="opt" data-oi="' + oi + '"><span class="lab">' + 'ABCDEF'[oi] + '.</span><span>' + esc(o) + '</span></button>'; }).join('');
    $('decSteps').appendChild(d);
    ex._ui.permS[i].forEach(function (orig) { d.appendChild(d.querySelector('.opt[data-oi="' + orig + '"]')); });
    Array.prototype.forEach.call(d.querySelectorAll('.opt'), function (el, di) {
      var lab = el.querySelector('.lab'); if (lab) lab.textContent = 'ABCDEF'[di] + '.';
      el.addEventListener('click', function () {
        if (st.answered[ex.id]) return;
        d.querySelectorAll('.opt').forEach(function (o) { o.classList.remove('sel'); });
        el.classList.add('sel');
        ex._ui.choices[i] = parseInt(el.getAttribute('data-oi'), 10);
      });
    });
    var bs = $('btnStep');
    if (i === ex.steps.length - 1) bs.textContent = '✓ Check answer (final)';
    window.scrollTo(0, document.body.scrollHeight);
  }
  $('btnStep').addEventListener('click', function () {
    if (st.answered[ex.id]) return;
    var i = ex._ui.step;
    if (ex._ui.choices[i] === undefined) {
      var w = $('warnline'); w.textContent = '⚠ Choose a response for STEP ' + (i + 1) + ' before continuing.'; w.classList.add('show');
      return;
    }
    $('warnline').classList.remove('show');
    if (i < ex.steps.length - 1) { ex._ui.step++; drawStep(); }
    else doCheck();   /* final check -> auto-pause + grade all steps */
  });
  drawStep();
  ex._grade = function () {
    var H = 0, W = 0, N = ex.steps.length, rows = [];
    ex.steps.forEach(function (s, i) {
      var c = ex._ui.choices[i];
      if (c === s.answer) { H++; rows.push({ state: 'ok', label: '✓ Correct — STEP ' + (i + 1) + ': ' + esc(s.options[c]), why: s.why }); }
      else { W++; rows.push({ state: 'bad', label: '✗ Wrong — STEP ' + (i + 1) + ': you chose "' + esc(s.options[c]) + '". Better: "' + esc(s.options[s.answer]) + '"', why: s.why }); }
    });
    return { credit: scoreExercise(H, W, N), rows: rows, meta: { H: H, W: W, N: N } };
  };
  ex._presence = function () { return Object.keys(ex._ui.choices).length === ex.steps.length; };
  ex._warn = 'Answer every step before the final Check.';
};

/* ================= terminal emulator ================= */
function normalizeCmd(c) {
  return String(c || '')
    .replace(/\s+/g, ' ').trim()
    .toLowerCase()
    .replace(/[.]$/, '')
    .replace(/\[\.\]/g, '.')
    .replace(/hxxp/g, 'http');
}
RENDER.terminal = function (ex, root) {
  ex._ui.cmd = '';
  var banner = (ex.banner || []).map(function (l) { return '<div class="term-line">' + hl(l) + '</div>'; }).join('');
  var syn = ex.syntaxPanel
    ? '<div class="synpanel"><div class="t">⌨ SYNTAX REMINDER (read before typing)</div><pre class="mono">' + hl(ex.syntaxPanel.join('\n')) + '</pre><div class="note">' + esc(ex.syntaxNote || '') + '</div></div>'
    : '';
  root.innerHTML = syn +
    '<div class="term"><div class="term-head">' +
    '<span class="term-dot" style="background:var(--state-incorrect)"></span>' +
    '<span class="term-dot" style="background:var(--accent-amber)"></span>' +
    '<span class="term-dot" style="background:var(--accent-green)"></span>' +
    '<span>' + esc(ex.termTitle || 'analyst@soc-shell: ~') + '</span></div>' +
    '<div class="term-body" id="tBody">' + banner + '</div>' +
    '<div class="term-in"><span class="ps">' + esc(ex.prompt) + '</span>' +
    '<input id="tIn" type="text" spellcheck="false" autocomplete="off" aria-label="Shell input — type the command"></div></div>' +
    '<button class="btn mt8" id="btnRun">▸ Run command (or press Enter)</button>' +
    '<p class="small mt8">This is a simulation. Nothing leaves this page. Tip: it accepts defanged input such as <span class="mono">name[.]tld</span> and runs it as the real form.</p>';
  var tBody = $('tBody'), tIn = $('tIn');
  function run() {
    var cmd = tIn.value;
    if (!cmd.trim()) return;
    ex._ui.cmd = cmd;
    tBody.innerHTML += '<div class="term-line"><span style="color:var(--accent-green);font-weight:700">' + esc(ex.prompt) + '</span> ' + esc(cmd) + '</div>';
    var out = ex.sampleOutput || ['(simulated output — nothing is really executed)'];
    out.forEach(function (l) { tBody.innerHTML += '<div class="term-line"><span class="out">' + hl(l) + '</span></div>'; });
    tBody.scrollTop = tBody.scrollHeight;
    tIn.value = '';
  }
  tIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); run(); } });
  $('btnRun').addEventListener('click', run);
  ex._grade = function () {
    var norm = normalizeCmd(ex._ui.cmd);
    var H = 0, W = 0, N = ex.elements.length, rows = [];
    var nearMiss = false;
    ex.elements.forEach(function (el) {
      if (new RegExp(el.re, 'i').test(norm)) { H++; rows.push({ state: 'ok', label: '✓ Present — ' + esc(el.label), why: el.why || '' }); }
      else rows.push({ state: 'miss', label: '○ Missing — ' + esc(el.label), why: el.why || '' });
    });
    (ex.forbidden || []).forEach(function (f) {
      if (new RegExp(f.re, 'i').test(norm)) {
        W++;
        if (f.danger) nearMiss = true;
        rows.push({ state: 'bad', label: '✗ Present but wrong' + (f.danger ? ' and dangerous' : '') + ' — ' + esc(f.label), why: f.why || '' });
      }
    });
    return { credit: scoreExercise(H, W, N), rows: rows, meta: { H: H, W: W, N: N }, terminal: true, nearMiss: nearMiss };
  };
  ex._presence = function () { return (ex._ui.cmd || '').trim().length > 0; };
  ex._warn = 'Type a command in the shell (press Enter to simulate it), then press Check.';
};

/* ================= exercise shell (scenario + question + answer + footer) ================= */
function curEx() { return EXS[st.order[st.cur]]; }
function renderExercise() {
  renderHeader(); renderProgress();

  ex._ui = {};
  var h = scenarioHTML(ex) +
    '<div class="block b-amber" id="blkQuestion"><div class="bhead"><span class="ic">❓</span>QUESTION</div><div class="bbody"><p class="qtext">' + esc(ex.question) + '</p></div></div>' +
    '<div class="block b-green"><div class="bhead"><span class="ic">✍</span>YOUR ANSWER</div><div class="bbody" id="ansBody"></div></div>' +
    '<p class="warnline" id="warnline"></p>' +
    '<div class="footerbar" id="exFooter"></div>';
  $('app').innerHTML = h;
  $('scToggle').addEventListener('click', function () {
    var b = $('blkScenario');
    b.classList.toggle('closed');
    this.setAttribute('aria-expanded', b.classList.contains('closed') ? 'false' : 'true');
  });
  var body = $('ansBody');
  RENDER[ex.type](ex, body);
  buildFooter(ex);
  window.scrollTo(0, 0);
}
function buildFooter(ex) {
  var f = $('exFooter');
  if (!f) return;

    if (ex.type === 'decision') {
      f.innerHTML = '<span class="small">The Check button appears inside the scenario as the final step (“✓ Check answer (final)”).</span>';
    } else {
      f.innerHTML = '<button class="btn btn-ok" id="btnCheck" style="min-width:170px">✓ Check answer</button>';
      $('btnCheck').addEventListener('click', doCheck);
    }
  } else {
    var last = st.cur >= st.order.length - 1;
    var lbl = st.fromReview ? '↩ Return to review' : (last ? '→ Finish & review skipped' : '→ Next exercise');
    f.innerHTML = '<button class="btn btn-primary" id="btnNext" style="min-width:190px">' + lbl + '</button>';
    $('btnNext').addEventListener('click', doNext);
  }
}
function doHint() {
  if (st.screen !== 'exam') return;
  var ex = curEx();
  if (st.hintUsed[ex.id] || st.answered[ex.id]) return;
  st.hintUsed[ex.id] = true;
  var q = $('blkQuestion');
  q.insertAdjacentHTML('afterend',
    '<div class="synpanel" style="border-color:var(--accent-amber)"><div class="t" style="color:var(--accent-amber)">💡 HINT — using it costs 10% of this exercise\'s credit</div><div>' + esc(ex.hint) + '</div></div>');
  var b = $('btnHint'); if (b) { b.disabled = true; b.title = 'Hint already used for this exercise'; }
}
function doCheck() {
  var ex = curEx();
  if (st.answered[ex.id]) return;
  if (!ex._presence()) {
    var w = $('warnline');
    w.textContent = '⚠ ' + (ex._warn || 'Provide an answer before pressing Check.');
    w.classList.add('show');
    return;   /* nothing to grade: no auto-pause, timer keeps running */
  }
  $('warnline').classList.remove('show');
  setState(T_PAUTO);                 /* Check-triggered auto-pause FIRST */
  renderTimer();
  var g = ex._grade();
  var credit = g.credit;
  if (st.hintUsed[ex.id]) credit = Math.max(0, credit - 0.10);
  st.answered[ex.id] = true;
  st.credits[ex.id] = credit;
  st.answeredCount++;
  st.creditSum += credit;
  var si = st.skipped.indexOf(ex.id);
  if (si >= 0) st.skipped.splice(si, 1);
  var body = $('ansBody');
  body.classList.add('answer-locked');
  body.querySelectorAll('input,button,textarea').forEach(function (el) { el.disabled = true; });
  /* once graded, skip/hint no longer apply to this exercise */
  var sk = $('btnSkip'); if (sk) sk.disabled = true;
  var hb = $('btnHint'); if (hb) hb.disabled = true;
  renderFeedback(ex, g, credit);
  buildFooter(ex);
  renderScore(); renderProgress();
  var fb = document.querySelector('.fb');
  if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function renderFeedback(ex, g, credit) {
  var label, cls, icon;
  if (g.nearMiss) { label = 'DANGEROUS — NEAR MISS'; cls = 'fb-bad'; icon = '✗'; }
  else if (credit >= 0.999) { label = 'CORRECT'; cls = 'fb-ok'; icon = '✓'; }
  else if (credit > 0) { label = 'PARTIALLY CORRECT'; cls = 'fb-part'; icon = '✓'; }
  else { label = 'INCORRECT'; cls = 'fb-bad'; icon = '✗'; }
  var credChip = '';
  if (g.meta) credChip = '<span class="cred">credit ' + credit.toFixed(2) + ' — ' + g.meta.H + '/' + g.meta.N + ' items' + (st.hintUsed[ex.id] ? ' · includes −0.10 hint penalty' : '') + '</span>';
  else credChip = '<span class="cred">credit ' + credit.toFixed(2) + (st.hintUsed[ex.id] ? ' · includes −0.10 hint penalty' : '') + '</span>';
  var nearNote = g.nearMiss ? '<div class="itrow bad"><span class="st">✗ This command would burn the investigation — see the warning below</span></div>' : '';
  var rows = g.rows.map(function (r) {
    return '<div class="itrow ' + r.state + '"><span class="st">' + r.label + '</span>' +
      (r.why ? '<span class="why">' + esc(r.why) + '</span>' : '') + '</div>';
  }).join('');
  var extra = '';
  if (g.terminal || ex.type === 'terminal') {
    extra = '<h4>Canonical command (copyable)</h4><div class="artefact copy-cmd"><div class="art-label">EXPECTED COMMAND</div>' +
      '<pre class="mono" id="canonCmd">' + esc(ex.canonical || ex.expected) + '</pre>' +
      '<button class="copy-btn" id="btnCopy">copy</button></div>' +
      '<h4>Command breakdown</h4>' +
      (ex.breakdown || []).map(function (b) { return '<div class="itrow"><span class="st mono" style="color:var(--accent-green)">' + esc(b[0]) + '</span><span class="why">' + esc(b[1]) + '</span></div>'; }).join('');
  }
  var answerKey = '';
  if (ex.type === 'qcm') answerKey = '<h4>Correct answer</h4><div class="itrow ok"><span class="st">✓ ' + esc(ex.options[ex.answer]) + '</span></div>';
  var fb = '<div class="fb ' + cls + '"><div class="fb-h"><span>' + icon + ' ' + label + '</span>' + credChip + '</div>' +
    '<div class="fb-b">' + nearNote + answerKey +
    '<h4>Why</h4><p class="learn-p">' + esc(ex.explain) + '</p>' +
    (rows ? '<h4>Item-by-item breakdown</h4>' + rows : '') + extra + '</div></div>';
  var green = $('ansBody').closest('.block');
  green.insertAdjacentHTML('afterend', fb);
  var cp = $('btnCopy');
  if (cp) cp.addEventListener('click', function () {
    var t = $('canonCmd').textContent;
    var done = function () { cp.textContent = 'copied'; setTimeout(function () { cp.textContent = 'copy'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, done);
    else done();
  });
}
function doNext() {
  if (st.state === T_PAUTO) setState(T_RUNNING);   /* resume on Next */
  renderTimer();
  if (st.fromReview) { st.fromReview = false; showReview(); return; }
  if (st.cur < st.order.length - 1) { st.cur++; renderExercise(); }
  else showReview();
}
function doSkip() {
  if (st.screen !== 'exam') return;
  var ex = curEx();
  if (st.answered[ex.id]) return;
  if (st.skipped.indexOf(ex.id) < 0) st.skipped.push(ex.id);
  if (st.fromReview) { st.fromReview = false; showReview(); return; }
  if (st.cur < st.order.length - 1) { st.cur++; renderExercise(); }
  else showReview();
}

/* ================= manual pause overlay ================= */
function showPauseOverlay() {
  if ($('pov')) return;
  var d = document.createElement('div');
  d.className = 'poverlay'; d.id = 'pov';
  d.innerHTML = '<div class="pin"><div class="pic">⏸</div><h3>PAUSED — manual</h3>' +
    '<p>The timer is stopped and the exercise is hidden while you rest. Press Resume when you are ready to continue.</p>' +
    '<button class="btn btn-primary" id="btnResume" style="min-width:160px">▶ Resume</button></div>';
  document.body.appendChild(d);
  $('btnResume').addEventListener('click', manualResume);
}
function hidePauseOverlay() { var d = $('pov'); if (d) d.remove(); }
function manualPause() {
  if (st.state === T_RUNNING || st.state === T_PAUTO) {
    st.pauseResumeTo = st.state;
    setState(T_PMAN);
    renderTimer();
    showPauseOverlay();
  }
}
function manualResume() {
  if (st.state === T_PMAN) {
    var to = st.pauseResumeTo || T_RUNNING;
    if (to === T_PAUTO) setState(T_PAUTO); else setState(T_RUNNING);
  }
  hidePauseOverlay();
  renderTimer();
}

/* ================= boot ================= */
document.addEventListener('DOMContentLoaded', function () {
  /* severity palette wiring: --sev-col must reflect THIS file's difficulty
     (green / amber / orange / red) for the header badge and progress bar */
  document.documentElement.style.setProperty('--sev-col', sevColor());
  showIntro();
});
/* testability hook: internal state only, no network, no storage, invisible to learners */
window.__CM_DEBUG__ = { st: st, EXS: EXS, showReview: showReview, showResults: showResults, T: { RUNNING: T_RUNNING, PMAN: T_PMAN, PAUTO: T_PAUTO, ENDED: T_ENDED } };
})();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
