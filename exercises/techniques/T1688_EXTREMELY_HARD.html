/* terminal */
RENDER.terminal=function(e,w){
  S.answers[e.id]={last:''};
  if(e.syntaxPanel){
    w.appendChild(el('div','synpanel','<div class="sp-h">Syntax reminder</div>'+e.syntaxPanel));
  }
  if(e.expectedOutput){
    w.appendChild(el('div','synpanel','<div class="sp-h">Expected output shape</div><pre class="code">'+e.expectedOutput+'</pre>'));
  }
  var term=el('div','term');
  term.innerHTML='<div class="tscroll" id="tsc_'+e.id+'"></div>'+
    '<div class="tin"><span class="tprompt">'+e.prompt+'</span><input id="tin_'+e.id+'" type="text" autocomplete="off" spellcheck="false" aria-label="Type your command">'+
    '<button type="button" class="btn ghost" id="run_'+e.id+'" aria-label="Run command">&#9166; Run</button></div>';
  w.appendChild(term);
  var sc=term.querySelector('.tscroll');
  function push(html){ var l=el('div','tline'); l.innerHTML=html; sc.appendChild(l); sc.scrollTop=sc.scrollHeight; }
  push('<span class="cmt">'+esc(e.banner||'Simulation shell. Type the command you judge correct, then press Check to grade it.')+'</span>');
  var inp=term.querySelector('input');
  function run(){
      var v=inp.value; inp.value='';
      push('<span class="tprompt">'+esc(e.prompt)+'</span>'+esc(v));
      S.answers[e.id].last=v;
      var norm=normalise(v);
      var matched=e.dangerous.some(function(d){ return RX(d.re).test(norm); });
      var expected=e.elements.every(function(elx){ return RX(elx.re).test(norm); });
      if(expected){ push('<span class="okv">[simulated] command accepted \u2014 simulated output below.</span>');
        (e.simOutput||[]).forEach(function(o){ push(esc(o)); }); }
      else if(matched){ push('<span class="errv">[simulated] command executed \u2014 WARNING: this changes state on a live system.</span>'); }
      else { push('<span class="errv">command not recognised in this simulation</span>'); }
  }
  inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter'){ run(); } });
  term.querySelector('#run_'+e.id).addEventListener('click',function(){ run(); });
};
function normalise(cmd){
  return String(cmd).toLowerCase().replace(/\s+/g,' ').trim();
}
function RX(r){
  if(r instanceof RegExp) return r;
  try{ return new RegExp(r,'i'); }catch(e){ return { test:function(){ return false; } }; }
}
GRADER.terminal=function(e){
  var a=S.answers[e.id]||{last:''};
  if(!a.last) return null;
  var norm=normalise(a.last);
  var h=0,wr=0,rows=[];
  e.elements.forEach(function(elx){
    if(RX(elx.re).test(norm)){ h++; rows.push({label:elx.label,state:'ok',why:elx.why}); }
    else { rows.push({label:elx.label,state:'miss',why:elx.why}); }
  });
  e.dangerous.forEach(function(d){
    if(RX(d.re).test(norm)){ wr++; rows.push({label:'DANGEROUS element: '+d.label,state:'bad',why:d.why}); }
  });
  var n=e.elements.length;
  return {credit:scoreExercise(h,wr,n),h:h,n:n,rows:rows,dangerous:wr>0};
};

/* branch (multi-step decision tree) */
RENDER.branch=function(e,w){
  S.answers[e.id]={};
  var holder=el('div');
  w.appendChild(holder);
  e.steps.forEach(function(st,si){
    var sb=el('div','block block-question'); sb.style.margin='10px 0';
    sb.innerHTML='<div class="bh">STEP '+(si+1)+' OF '+e.steps.length+'</div><div class="qtext" style="font-weight:600;font-size:15.5px">'+st.prompt+'</div>';
    var ow=el('div','opts');
    shuffle(st.options.map(function(o){return o.id;})).forEach(function(oid,i){
      var o=st.options.filter(function(x){return x.id===oid;})[0];
      var b=el('button','opt'); b.type='button'; b.setAttribute('data-oid',oid);
      b.innerHTML='<span class="olabel">'+letters(i)+'.</span><span>'+o.text+' <span class="selmark">&#9679; selected</span></span>';
      b.onclick=function(){
        if(S.feedbackShown[e.id])return;
        ow.querySelectorAll('.opt').forEach(function(x){x.classList.remove('selected'); x.removeAttribute('aria-pressed');});
        b.classList.add('selected'); b.setAttribute('aria-pressed','true');
        S.answers[e.id][st.id]=oid;
        var n=w.querySelector('.nudge'); if(n)n.remove();
      };
      ow.appendChild(b);
    });
    sb.appendChild(ow); holder.appendChild(sb);
  });
};
GRADER.branch=function(e){
  var a=S.answers[e.id]||{};
  var any=e.steps.some(function(s){ return a[s.id]; });
  if(!any) return null;
  var h=0,wr=0,rows=[];
  e.steps.forEach(function(s){
    var got=a[s.id];
    var co=s.options.filter(function(o){return o.id===s.correctId;})[0];
    if(got&&got===s.correctId){ h++; rows.push({label:s.label,state:'ok',why:co.why}); }
    else if(got){ var wo=s.options.filter(function(o){return o.id===got;})[0];
      wr++; rows.push({label:s.label,state:'bad',why:wo.why+' (best action: '+co.why+')'}); }
    else { rows.push({label:s.label+' (not answered)',state:'miss',why:co.why}); }
  });
  return {credit:scoreExercise(h,wr,e.steps.length),h:h,n:e.steps.length,rows:rows};
};

/* ---------- review skipped ---------- */

  '<p class="sub">These exercises were skipped. You can return to any of them now and answer it. You can do this as many times as you need while the timer is still running. If you submit now, the exercises below are excluded from the score.</p>'+

  document.getElementById('btn-finish').onclick=function(){ finishExam(); };
  document.getElementById('btn-hint').disabled=true;
  document.getElementById('btn-skip').disabled=true;
}

/* ---------- results ---------- */
function renderResults(){
  var answeredIds=S.order.filter(function(id){ return S.answered[id]; });
  var creditSum=0; answeredIds.forEach(function(id){ creditSum+=S.credits[id]||0; });
  var count=answeredIds.length;
  var percent=count>0?Math.round((creditSum/count)*100):0;
  var passed=percent>=M.passMark;
  var full=0,partial=0,partialAvg=0,zero=0,skippedN=0;
  answeredIds.forEach(function(id){
    var c=S.credits[id]||0;
    if(c>=0.999) full++;
    else if(c>0){ partial++; partialAvg+=c; }
    else zero++;
  });
  /* skipped-and-never-answered = everything in the running order that has no credit */
  S.order.forEach(function(id){ if(!S.answered[id]) skippedN++; });
  if(partial>0) partialAvg=Math.round((partialAvg/partial)*100)/100;
  if(!S.reported) reportScore();
  app.innerHTML=
  '<div class="card center"><h1>Results &mdash; '+esc(M.title)+'</h1>'+
    '<div class="cert '+(passed?'pass':'fail')+'">'+
      '<div class="cl">'+(passed?'&#10003; PASS':'&#10007; FAIL')+'</div>'+
      '<div class="cs">'+creditSum.toFixed(1)+' / '+count+' ('+percent+'%)</div>'+
      '<div class="sub">Computed only over the '+count+' exercises you answered. Pass mark: '+M.passMark+'%.</div>'+
    '</div>'+
    '<div class="result-grid">'+
      '<div class="rescard"><div class="rk" style="color:var(--state-correct)">&#10003; Fully correct</div><div class="rv">'+full+'</div><div class="rn">credit 1.00 each</div></div>'+
      '<div class="rescard"><div class="rk" style="color:var(--state-partial)">&#10003; Partially correct</div><div class="rv">'+partial+'</div><div class="rn">average credit '+(partial>0?partialAvg.toFixed(2):'&mdash;')+'</div></div>'+
      '<div class="rescard"><div class="rk" style="color:var(--state-incorrect)">&#10007; Fully incorrect</div><div class="rv">'+zero+'</div><div class="rn">credit 0.00</div></div>'+
      '<div class="rescard"><div class="rk" style="color:var(--state-skipped)">&#9888; Skipped &mdash; excluded</div><div class="rv">'+skippedN+'</div><div class="rn">not counted in score</div></div>'+
    '</div>'+
    '<div class="pausestats">'+
      '<span>&#9208; Manual pause time: <b>'+fmtDur(S.pauseLog.manualMs)+'</b></span>'+
      '<span>&#9203; Feedback review time (auto-pause): <b>'+fmtDur(S.pauseLog.autoMs)+'</b></span>'+
      '<span>&#9203; Time left when finished: <b>'+fmtTime(S.timer.remaining)+'</b></span>'+
    '</div>'+
    (passed
      ?'<p class="sub" style="margin-top:14px">You passed. Keep the certificate feeling: revisit any exercise explanation by retaking, or move to the next severity tier of this topic.</p>'
      :'<p class="sub" style="margin-top:14px">You did not reach 70%. Restudy the "What to study" pointers, then retake the exam. Questions and options are shuffled on every attempt.</p>')+
    '<div class="btnrow center"><button class="btn primary" id="btn-retake">&#8635; Retake Exam</button></div>'+
  '</div>';
  document.getElementById('btn-retake').onclick=function(){ startExam(); };
  window.scrollTo(0,0);
}

/* ---------- boot ---------- */
render();
/* test/debug handle: introspection for automated QA (contains no scoring logic) */
window.__EXAM_DEBUG__={ S:S, T:T, M:M, EXS:EXS };
})();

</script>
