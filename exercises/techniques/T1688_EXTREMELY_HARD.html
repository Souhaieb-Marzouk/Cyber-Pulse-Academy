window.__EXAM_META__={"topicId": "t1688", "batch": 4, "title": "T1688 — EXTREMELY HARD practice exam", "sevWord": "EXTREMELY HARD", "difficulty": "extremely-hard", "estimatedMinutes": 70, "timerSeconds": 4200, "passMark": 70, "intro": {"title": "T1688 Safe Mode Boot — EXTREMELY HARD practice exam", "object": "MITRE ATT&CK object: Technique T1688 — Safe Mode Boot (Enterprise, Windows, tactic Defense Impairment TA0112)", "learnTitle": "What you will learn here", "learn": "<p>This is the expert tier for <b>T1688 — Safe Mode Boot<\/b>, a MITRE ATT&CK <b>technique<\/b> on <b>Windows<\/b>: forcing a host into <b>safe mode<\/b>, where only a limited set of drivers and services start, so third-party security software such as EDR (endpoint detection and response) may not start. You now meet the technique the way a senior analyst does: inside a live campaign, with contradictory telemetry, an impatient CISO, and choices where every option costs something.<\/p><p>The scenarios chain three or more ideas at once: the boot change itself, the SafeBoot/COM persistence inside safe mode, the detection strategy DET0116, the mitigations M1026 and M1054, and the real procedure examples — Black Basta, REvil, AvosLocker, Qilin, RansomHub, LockBit 3.0, Embargo. Some signals will contradict each other and you must decide which one wins and say why. Some information will be missing and you must reason around the gap. At least one widely repeated 'best practice' will be the wrong answer here.<\/p><p><b>Where you use this at work:<\/b> senior IR leads sequence containment against evidence loss under executive pressure; senior detection engineers close analytic gaps the base rules leave open; senior CTI analysts turn noisy artefacts into confident, precisely-worded mappings; senior engineers decide what a control like M1054 does — and does not — buy. If a decision here feels uncomfortable, that is the exercise working: comfort is what the distractors sell.<\/p>", "keywords": [{"theme": "Campaign mechanics (chained)", "items": ["bcdedit /set safeboot::preparation signal", "SafeBoot service + COM registration::inside-safe-mode tooling", "restart (EID 1074)::activates the mode", "EDR service start in safe mode::the M1054 test", "post-attack /deletevalue::cleanup signal"]}, {"theme": "Contradiction and evidence", "items": ["Stale health banners::which signal wins and why", "Volatile vs non-volatile evidence::what a reimage or power pull destroys", "Incomplete timestamps::order by causal logic", "DET0116 / AN0323::correlation backbone"]}, {"theme": "Procedure-grounded attribution", "items": ["Black Basta / REvil::bcdedit /set safeboot network", "AvosLocker::restart into safe mode", "Qilin / RansomHub::avoid detection, prior to encryption", "Embargo::MDeployer DLL variant", "LockBit 3.0::reboots the infected host"]}, {"theme": "Executive decisions", "items": ["M1026 / M1054::what each buys, what each leaves open", "Escalate vs act::when doing nothing yet is the answer", "Cost acceptance::isolation downtime, rotation friction", "Fleet-wide 'best practice' traps::blanket blocks that backfire"]}], "exTypes": ["<li><b>Exercise types in this file:<\/b> multi-artefact choice decisions with near-identical options, a four-step scoping branch, line-tagging across a full attack timeline, ranking an attacker's recovered plans, two terminal commands (evidence export of the BCD store, then of the SafeBoot tree), fill-in-the-blank confidence statements, and multi-select attribution.<\/li>"]}};
window.__EXERCISES__=[{"id": "x01", "type": "choice", "title": "The banner says healthy", "summary": "Contradiction — boot change ran, EDR banner claims healthy", "perspective": "defender", "scenario": "<p>04:40, Meridian Health Trust SOC. Campaign GLASSVAULT is one hour old. Two sources disagree about MH-APP-31 and the CISO wants a position in ten minutes. Four artefacts are on your screen — one of them is noise.<\/p>", "artifacts": [{"label": "Sysmon EID 1", "code": "04:11:52  Process Create (MH-APP-31)\nImage:       C:\\Windows\\System32\\bcdedit.exe\nCommandLine: bcdedit /set {current} safeboot minimal\nParent:      wmiprvse.exe   User: MH\\svc_deploy (Administrators)"}, {"label": "EDR console banner", "code": "MH-APP-31  AGENT HEALTHY\nLast heartbeat received: 04:16:02\nConsole cached view, last refresh: 04:16:40"}, {"label": "System event log", "code": "04:14:59  EID 1074  restart requested via WMI\n04:17:20  EID 6005  event log started\n(boot completed; SCM events not yet pulled)"}, {"label": "printer queue", "code": "04:03:11  PrintSvc  driver 'HQ-MFP-88' updated\n(change CHG-9912, approved, unrelated)"}], "question": "Which position do you give the CISO — and what is your next concrete step?", "options": [{"id": "A", "text": "The boot change is real and unresolved; the healthy banner predates the reboot — pull SCM service-start events for the safe-mode session before touching the host.", "plain": "boot change wins; verify with SCM events", "why": "Correct — the banner's own timestamps show its last data arrived before the boot completed; the boot change plus the restart is the unresolved T1688 chain."}, {"id": "B", "text": "The healthy banner wins: an agent reporting healthy cannot have been impaired, so close the boot alert.", "plain": "banner wins; close alert", "why": "Near miss — it reads plausible, but a console banner is a cached view; its own refresh stamp proves it cannot know about a boot at 04:17."}, {"id": "C", "text": "The printer update is the root cause: driver installs trigger reboots, so file everything under CHG-9912.", "plain": "blame the printer change", "why": "Near miss — this is the planted noise; the printer change is approved, unrelated and does not set safeboot values."}, {"id": "D", "text": "Isolate and reimage MH-APP-31 immediately; skip service-event checks to save time.", "plain": "reimage now", "why": "Near miss — fast, but it destroys the service-start evidence that decides whether M1054 held, and you still owe the CISO a defensible position."}], "correctId": "A", "hint": "Compare the timestamps: which artefact physically cannot know what happened at 04:17?", "explain": "Two signals contradict each other and you must say which wins and why. The safeboot command and the restart are causal facts; the healthy banner is a cached console view whose last data predates the boot — its own timestamps disqualify it. Senior practice is to resolve the contradiction with a third source (SCM service-start events in the safe-mode session) rather than to act destructively on either signal. The printer artefact is realistic noise: approved, irrelevant, and there to be ignored.", "study": "Resolving contradictory telemetry by timestamp analysis and a third authoritative source."}, {"id": "x02", "type": "terminal", "title": "Evidence before anything", "summary": "Terminal — export the BCD store without destroying it", "perspective": "defender", "scenario": "<p>MH-APP-31 is isolated. The case board authorises one command now. Two commands are in everyone's head: one preserves the boot configuration as evidence, one destroys the very value you came to collect. The evidence share is mounted at <span class=\"mono\">C:\\evidence<\/span>.<\/p>", "artifacts": [{"label": "Case board authorisation", "code": "AUTHORISED: preserve boot configuration evidence\nTARGET:     C:\\evidence (mounted, writable)\nTOOL:       bcdedit available in the IR shell\nFORBIDDEN:  any state change to the boot store"}], "question": "Type the bcdedit command that preserves the boot configuration store to the evidence share.", "canonical": "bcdedit /export C:\\evidence\\bcd-backup", "prompt": "IR-SHELL MH-APP-31&gt;", "banner": "One command is authorised. Type it, press Enter, then Check.", "elements": [{"re": "\\bbcdedit\\b", "label": "Tool: bcdedit", "why": "bcdedit is the boot store tool and its /export operation is non-destructive."}, {"re": "/export", "label": "Operation: /export", "why": "/export writes a copy of the store — the only operation that preserves without altering."}, {"re": "c:\\\\evidence", "label": "Target path: C:\\evidence\\...", "why": "The store copy must land on the evidence share, not in a temp folder that gets cleaned."}], "dangerous": [{"re": "/deletevalue", "label": "evidence-destroying /deletevalue", "why": "Deleting the safeboot value destroys the artefact you were sent to preserve — the destructive twin of the safe command."}, {"re": "\\bformat\\b|\\bdiskpart\\b|\\bcd\\b\\s+/createstore", "label": "store-destroying operation", "why": "Any command that overwrites or recreates the store destroys evidence."}], "simOutput": ["(simulated) The store export has completed successfully.", "(simulated) C:\\evidence\\bcd-backup written"], "correctId": null, "hint": "The tool is given. Among its operations you need the one whose output is a copy — and a destination on the evidence share.", "explain": "Canonical command: <span class=\"mono\">bcdedit /export C:\\evidence\\bcd-backup<\/span>. /export copies the boot store; it changes nothing in the original. The twin command in everyone's head — bcdedit /deletevalue {current} safeboot — is the evidence-destroying shortcut: it would remove the very state the investigation needs, and it is exactly what the attacker's own cleanup (exercise 8 territory in the HARD tier) would do. Preserve first, repair later, always in that order.", "study": "bcdedit /export as the evidence-preservation operation, and why cleanup commands destroy cases."}, {"id": "x03", "type": "branch", "title": "Scope the SafeBoot writer", "summary": "Branch — four decisions to scope a fleet-wide persistence write", "perspective": "defender", "scenario": "<p>A scheduled-looking process is writing SafeBoot keys on three hosts. Four decisions follow; they are scored together at the final Check. Intermediate confirms do not stop the clock.<\/p>", "artifacts": [{"label": "Fleet telemetry", "code": "MH-ENG-77, MH-APP-31, MH-DEV-05:\n  EID 13  TargetObject: ...\\SafeBoot\\Minimal\\svchost.exe\n  Image writing it: C:\\Windows\\svchost.exe  (unsigned)\n  Note: the REAL svchost.exe lives in System32\n  Known-good signed installers in the window: 1 (AV upgrade)"}], "question": "Make the four scoping decisions.", "steps": [{"id": "s1", "label": "Step 1 — the writer", "prompt": "The writer is 'C:\\Windows\\svchost.exe' (unsigned), while the real svchost lives in System32. What is your read?", "options": [{"id": "s1_o1", "text": "Masquerading binary: treat the writer as attacker tooling, not the OS service", "why": "Correct — path and signature both contradict the OS service; this is a deliberate look-alike."}, {"id": "s1_o2", "text": "OS service writing its own config", "why": "Wrong — the real service host is signed and in System32; the path here is the tell."}, {"id": "s1_o3", "text": "Corrupted AV upgrade artefact", "why": "Wrong — the one known-good installer in the window is signed and named; this binary matches neither."}], "correctId": "s1_o1"}, {"id": "s2", "label": "Step 2 — the key write", "prompt": "The write registers svchost.exe under SafeBoot\\Minimal. What does this achieve for the attacker?", "options": [{"id": "s2_o1", "text": "Their binary starts inside safe-mode sessions — persistence where the EDR may not run", "why": "Correct — that is the SafeBoot registration half of T1688, straight from the technique description."}, {"id": "s2_o2", "text": "It disables safe mode entirely", "why": "Wrong — SafeBoot entries enable tools in safe mode; they do not disable the mode."}, {"id": "s2_o3", "text": "It only slows the next boot", "why": "Wrong — it changes which tools start inside the mode, which is the attacker's goal."}], "correctId": "s2_o1"}, {"id": "s3", "label": "Step 3 — the sweep", "prompt": "Three hosts confirmed. Sweep scope for the same unsigned writer?", "options": [{"id": "s3_o1", "text": "Sweep all Windows endpoints for the file hash, the writer path and SafeBoot writes under it", "why": "Correct — hash plus path plus behaviour: a scoped sweep that would catch every instance without touching 4,000 machines blindly."}, {"id": "s3_o2", "text": "Sweep only the three confirmed hosts", "why": "Wrong — confirmed hosts are already known; the question is where else the same tooling landed."}, {"id": "s3_o3", "text": "Sweep nothing until the attacker acts again", "why": "Wrong — waiting hands the attacker the next safe-mode window."}], "correctId": "s3_o1"}, {"id": "s4", "label": "Step 4 — the verdict", "prompt": "Sweep: 9 more hosts have the writer, none have bcdedit history yet. Final call?", "options": [{"id": "s4_o1", "text": "Escalate to crisis: 12-host SafeBoot persistence = staged campaign; contain and collect, expect a safeboot wave next", "why": "Correct — persistence deployed fleet-wide is preparation; the bcdedit wave is the predictable next step, so escalate now."}, {"id": "s4_o2", "text": "Wait for the bcdedit wave before escalating", "why": "Wrong — the persistence layer is the earlier, quieter half; waiting for the loud half surrenders the window."}, {"id": "s4_o3", "text": "Classify as adware", "why": "Wrong — nothing here matches adware behaviour; safe-mode persistence is a deliberate impairment campaign."}], "correctId": "s4_o1"}], "hint": "Path and signature settle step 1; each later step should follow from the one before it.", "explain": "The chain: masquerading writer (path + signature), SafeBoot persistence (the description's registration half), a scoped sweep (hash + path + behaviour), then escalation on 12 hosts — because fleet-wide in-safe-mode persistence is staged preparation whose next visible step is the safeboot wave. Each decision depends on the previous one; changing step 1 changes everything after it.", "study": "Chaining binary analysis, SafeBoot semantics, sweep scoping and escalation thresholds."}, {"id": "x04", "type": "choice", "title": "The mass-reboot proposal", "summary": "Do-nothing-yet — resisting a fleet-wide 'fix'", "perspective": "defender", "scenario": "<p>07:20. The 12-host persistence finding stands; no host has run bcdedit yet. The infrastructure director proposes: 'Script a fleet-wide reboot of all 4,000 Windows endpoints with a pre-step that deletes any safeboot value. Clears the threat in one night.' Everyone in the room nods. You have the floor.<\/p>", "artifacts": [{"label": "Known state (07:20)", "code": "12 hosts: SafeBoot persistence (unsigned svchost)\n0 hosts: bcdedit /set observed\nEncryption stage: not observed anywhere\nAttacker status: unknown, presumed active"}], "question": "Which response do you defend?", "options": [{"id": "A", "text": "Do not mass-touch the fleet yet: escalate to the crisis team, scope first — a 4,000-host reboot blinds you mid-investigation and tips the attacker off", "plain": "escalate, scope, then act", "why": "Correct — this is the deliberate 'do nothing yet / escalate' answer: mass action without scope destroys your own visibility (logs, running state) and burns the element of surprise for zero confirmed benefit."}, {"id": "B", "text": "Approve the fleet reboot — a clean slate tonight is worth the noise", "plain": "approve fleet reboot", "why": "Near miss — tempting, but it erases running-process and network state on 4,000 machines at once, destroys the investigation's own telemetry, and a single missed SafeBoot entry re-runs the whole play."}, {"id": "C", "text": "Approve it but exclude the 12 known hosts", "plain": "reboot except the 12", "why": "Near miss — half the noise problem remains, the attacker learns your knowledge boundary, and the pre-step script itself becomes a 4,000-host change to validate."}, {"id": "D", "text": "Reject reboots AND reject escalation — handle it inside the SOC to avoid management overhead", "plain": "keep it in the SOC", "why": "Near miss — right instinct on reboots, wrong on scale: 12 hosts of staged persistence across departments is a crisis-team matter by policy and by risk, not a queue item."}], "correctId": "A", "hint": "Ask what a 4,000-host simultaneous reboot does to YOUR visibility — and what it tells the attacker.", "explain": "This is the 'do nothing yet — escalate' exercise. The mass reboot is a widely proposed 'decisive' action that would simultaneously destroy volatile state everywhere, blind the investigation, and signal your knowledge to the attacker — for a threat that has not yet fired its visible stage. The correct move is scope-then-act under crisis governance, starting from the 12 known hosts. Decisiveness is not the same as destructiveness.", "study": "When the correct action is escalation and restraint, not a fleet-wide technical fix."}, {"id": "x05", "type": "match", "title": "Actions and their irreversible costs", "summary": "Matching — every option costs something; know what", "perspective": "defender", "scenario": "<p>The crisis team keeps a 'cost card' for every candidate action in the GLASSVAULT playbook. Match each action to the cost it irrevocably accepts.<\/p>", "artifacts": [], "question": "Match each action to its accepted cost.", "lefts": [{"id": "l1", "label": "Reimage a confirmed host immediately", "why": "A reimage erases disk state: registry, SafeBoot artefacts, and any staged tooling — gone as evidence."}, {"id": "l2", "label": "Pull power to stop a running encryptor", "why": "Power loss erases RAM: injected code, keys, live connections — the most volatile evidence."}, {"id": "l3", "label": "Fleet-wide forced reboot tonight", "why": "Fleet-wide reboot erases running state and network sessions everywhere at once — the investigation's own picture."}, {"id": "l4", "label": "Delete the abused service account at once", "why": "Deleting the account destroys the trail of what else it touched — your lead map."}, {"id": "l5", "label": "bcdedit /export to the evidence share", "why": "A store export is a copy operation: it accepts essentially no cost — which is why it is always first."}], "rights": [{"id": "r1", "label": "loses live RAM content and connections"}, {"id": "r2", "label": "loses the account's activity trail"}, {"id": "r3", "label": "loses disk artefacts and staged tooling"}, {"id": "r4", "label": "loses nothing — a copy, always safe first"}, {"id": "r5", "label": "loses fleet-wide running state at once"}], "correct": {"l1": "r3", "l2": "r1", "l3": "r5", "l4": "r2", "l5": "r4"}, "hint": "Order the costs by what evidence class each action destroys: disk, memory, fleet state, lead trail — and one action destroys nothing.", "explain": "Every response action buys something and destroys something. Reimage costs disk artefacts; power pull costs RAM; fleet reboot costs the fleet-wide running picture; account deletion costs the lead trail; bcdedit /export costs nothing because it is a copy. The senior habit is to spend the zero-cost action first (export), then sequence the costly ones deliberately — never let an executive's urgency pick the cost for you.", "study": "Evidence-class cost mapping for response actions."}, {"id": "x06", "type": "choice", "title": "The blanket block", "summary": "Best practice that is wrong here — AppLocker vs bcdedit", "perspective": "defender", "scenario": "<p>The after-action review proposes a widely shared control: 'Block bcdedit.exe organisation-wide via application control — MITRE even lists it as an approach.' Your fleet context: 500 developers and 15,000 managed endpoints; infra runs bcdedit weekly for legitimate boot maintenance through privileged access workflows; the GLASSVAULT operator used WMI from a service account, and the msconfig GUI gap still exists.<\/p>", "artifacts": [], "question": "Why is the blanket block the wrong answer in this specific context?", "options": [{"id": "A", "text": "It breaks sanctioned weekly maintenance, does not stop the service-account/WMI or GUI paths, and drives the attacker to a copy of the binary under a different name", "plain": "breaks ops, misses paths, bypassable", "why": "Correct — three separate failures: operational breakage, the unblocked paths that still reach the same change, and rename/copy evasion, which is why store-side and privilege-side controls fit here better."}, {"id": "B", "text": "It is wrong because bcdedit can never be blocked — application control does not support it", "plain": "AppLocker cannot do it", "why": "Near miss — technically false; path rules can block bcdedit. The control is possible — it is the context that makes it wrong."}, {"id": "C", "text": "It is wrong because M1026 already removed the risk entirely", "plain": "M1026 already solved it", "why": "Near miss — M1026 reduces who can do this; it does not close the technique, and the compromised service account proves residual path exists."}, {"id": "D", "text": "It is wrong because blocking bcdedit makes safe mode unusable for admins", "plain": "safe mode becomes unusable", "why": "Near miss — safe mode itself remains reachable through msconfig; the block would only close one door while breaking one workflow — the real failure list is longer and more specific."}], "correctId": "A", "hint": "Three distinct failures, all specific to THIS fleet and THIS operator's path.", "explain": "The blanket block is a famous best practice that fails here three ways: it breaks the weekly sanctioned workflow (operational cost with no security gain on the real path), it leaves the WMI/service-account path and the msconfig GUI path open (the exact paths this campaign used), and it is defeated by copying the binary to a new name — while the BCD store and the privileged account are the invariants that cannot rename themselves. Controls should target the invariant (store state, admin rights) or the operator's actual path, not the most famous filename.", "study": "Why single-file blocks fail against determined operators — and what to control instead."}, {"id": "x07", "type": "tag", "title": "Tag the full timeline", "summary": "Tagging — seven lines across the whole GLASSVAULT clock", "perspective": "neutral", "scenario": "<p>The campaign timeline for MH-APP-31, rebuilt. Tag every line: PREP (safe-mode preparation), ACT (action inside the safe-mode session), CLEANUP (hiding the mechanism), or UNRELATED (noise).<\/p>", "artifacts": [], "question": "Tag all seven timeline lines.", "lines": [{"id": "t1", "text": "04:03  printer driver update (approved CHG-9912)", "short": "printer update", "why": "UNRELATED — approved change, planted noise."}, {"id": "t2", "text": "04:11  bcdedit /set {current} safeboot minimal", "short": "bcdedit /set", "why": "PREP — the boot-configuration change that forces the next safe-mode start."}, {"id": "t3", "text": "04:13  write to SafeBoot\\Minimal\\svchost.exe (unsigned writer)", "short": "SafeBoot write", "why": "PREP — persistence registered to start inside the safe-mode session."}, {"id": "t4", "text": "04:17  boot into safe mode completes; EDR service start attempt fails", "short": "safe-mode boot", "why": "PREP completes / the session begins — the activation edge of the preparation."}, {"id": "t5", "text": "04:29  bulk ACL changes on finance share staging folders", "short": "bulk ACL changes", "why": "ACT — the damage-preparation work done while the watcher was absent."}, {"id": "t6", "text": "04:58  bcdedit /deletevalue {current} safeboot; immediate restart", "short": "/deletevalue + restart", "why": "CLEANUP — removing the safeboot value hides the mechanism and restores normal look."}, {"id": "t7", "text": "05:02  'coffee-machine IoT telemetry gap' alert from the facilities feed", "short": "coffee machine", "why": "UNRELATED — a facilities feed alert with no connection to the boot chain."}], "tags": [{"id": "prep", "label": "PREP", "accepts": ["t2", "t3", "t4"]}, {"id": "act", "label": "ACT", "accepts": ["t5"]}, {"id": "cleanup", "label": "CLEANUP", "accepts": ["t6"]}, {"id": "unrel", "label": "UNRELATED", "accepts": ["t1", "t7"]}], "hint": "The printer and the coffee machine belong to nobody's kill chain. The /deletevalue arrives last, at the quiet moment.", "explain": "PREP: the bcdedit change and the SafeBoot registration, activated by the safe-mode boot. ACT: the bulk ACL changes inside the session — the work the absence of the EDR enabled. CLEANUP: the /deletevalue plus restart, hiding the mechanism. UNRELATED: the approved printer change and the facilities alert — noise that consumes attention. Reading a timeline by phase is what lets you brief an executive in one slide.", "study": "Phase-tagging a T1688 timeline: preparation, in-session action, cleanup, noise."}, {"id": "x08", "type": "choice", "title": "M1054 held — so what is this?", "summary": "Contradiction 2 — defences survived, damage proceeded anyway", "perspective": "defender", "scenario": "<p>SCM events finally arrive for MH-APP-31's safe-mode session — and they contradict your working theory. M1054 is deployed fleet-wide, and the log proves it worked here.<\/p>", "artifacts": [{"label": "SCM, safe-mode session", "code": "04:18:02  Service Control Manager\n  'MERC-EDR Service' entered the running state\n  (started successfully during safe-mode session)"}, {"label": "same session", "code": "04:29  bulk ACL changes on finance staging folders\n04:33  SafeBoot\\Minimal\\svchost.exe service RUNNING\n04:58  /deletevalue cleanup + restart"}], "question": "Which conclusion survives both artefacts?", "options": [{"id": "A", "text": "The safeboot step failed to blind this host (M1054 held), but the attacker's own registered service still ran inside the session — the session was never harmless", "plain": "M1054 held; attacker service ran anyway", "why": "Correct — both artefacts fit: the guard started (M1054 success) AND the attacker's SafeBoot-registered tool operated inside the same session (the persistence half the mitigation never claimed to stop)."}, {"id": "B", "text": "The safe-mode session was harmless because the EDR ran — close GLASSVAULT as attempted-only", "plain": "close as attempted-only", "why": "Near miss — the comforting read; it ignores the running attacker service and the bulk changes that followed."}, {"id": "C", "text": "M1054 must have failed silently — the EDR could not really have started in safe mode", "plain": "M1054 failed", "why": "Near miss — it treats the control's success as impossible; SCM says otherwise, and wishful reading of controls is how sessions get dismissed."}, {"id": "D", "text": "The ACL changes were made by the EDR itself during its safe-mode start", "plain": "EDR made the changes", "why": "Near miss — invents EDR behaviour to reconcile the artefacts; nothing in any EDR does bulk ACL changes on finance staging folders."}], "correctId": "A", "hint": "Do not let a control's success overwrite observed activity — ask what each control never claimed to cover.", "explain": "A second contradiction, resolved by separating what M1054 covers from what it does not: it keeps the guard alive in safe mode; it says nothing about attacker-registered services starting alongside. Both artefacts are true at once. The residual action item is precisely the persistence half — SafeBoot/COM registrations — which is why the analytic watches both the guard's start and everything else that started in the same session.", "study": "What a mitigation covers vs what residual paths remain open during the same session."}, {"id": "x09", "type": "fill", "title": "Confidence, stated precisely", "summary": "Attribution wording — family, confidence, justification", "perspective": "defender", "scenario": "<p>Your CTI statement must attach a confidence level to the family mapping and justify it. Three blanks. The evidence pool: exact command 'bcdedit /set safeboot network', WMI-driven restarts, Go-based locker binaries, and a staging folder named after a fish.<\/p>", "artifacts": [{"label": "Statement draft", "code": "Behaviour matches T1688 as executed by ____ :\n  confidence ____ , justified by ____ ."}], "question": "Complete the attribution statement.", "segments": [{"t": "txt", "v": "Behaviour matches T1688 as executed by "}, {"t": "blank", "id": "b1", "name": "family"}, {"t": "txt", "v": "; confidence "}, {"t": "blank", "id": "b2", "name": "level"}, {"t": "txt", "v": ", justified by the "}, {"t": "blank", "id": "b3", "name": "justification"}, {"t": "txt", "v": "."}], "bank": ["Black Basta", "High", "exact command match to the page's procedure entry", "Medium", "fish-named staging folder", "Qilin"], "blanks": [{"id": "b1", "name": "family", "correct": "Black Basta", "why": "The page's procedure entry for Black Basta (S1070) quotes exactly 'bcdedit /set safeboot network'."}, {"id": "b2", "name": "level", "correct": "High", "why": "An exact command match to a published procedure supports high confidence for the behavioural mapping."}, {"id": "b3", "name": "justification", "correct": "exact command match to the page's procedure entry", "why": "Confidence must hang on the shared, verifiable artefact — not on a folder name that any operator could have chosen."}], "hint": "Anchor confidence to the one artefact a report reader can verify against the ATT&CK page themselves.", "explain": "The defensible statement: behaviour matches T1688 as executed by Black Basta; confidence High, justified by the exact command match to the page's procedure entry. The fish-named folder is the trap: staging-folder names are weak, copyable signals, and Qilin's procedure (reboot to avoid detection) does not include the specific command. Attribution wording separates what you can prove from what you suspect — that separation is the deliverable.", "study": "Confidence levels anchored to verifiable procedure matches."}, {"id": "x10", "type": "terminal", "title": "Export the SafeBoot tree", "summary": "Terminal — preserve the safe-mode persistence evidence", "perspective": "defender", "scenario": "<p>Second authorised collection on MH-ENG-77: the SafeBoot registry tree that the unsigned writer touched. Two commands again: one exports the tree to the evidence share, one would delete the artefact while 'cleaning up'. The service variant to preserve is the <b>Minimal<\/b> tree.<\/p>", "artifacts": [{"label": "Case board authorisation", "code": "AUTHORISED: preserve SafeBoot\\Minimal tree\nTARGET:     C:\\evidence (mounted)\nTOOL:       reg.exe\nFORBIDDEN:  deleting or modifying the tree"}], "question": "Type the command that exports the SafeBoot Minimal tree to the evidence share.", "canonical": "reg export \"HKLM\\SYSTEM\\CurrentControlSet\\Control\\SafeBoot\\Minimal\" C:\\evidence\\safeboot-minimal.reg", "prompt": "IR-SHELL MH-ENG-77&gt;", "banner": "Registry collection only. Type it, press Enter, then Check.", "elements": [{"re": "^reg(\\.exe)?\\s", "label": "Tool: reg.exe", "why": "reg.exe is the registry tool with an export operation."}, {"re": "\\bexport\\b", "label": "Operation: export", "why": "reg export writes the key tree to a file — read-only on the source."}, {"re": "safeboot\\\\minimal", "label": "Key: SafeBoot\\Minimal", "why": "The Minimal tree is the one the unsigned writer registered under."}, {"re": "c:\\\\evidence", "label": "Target path: C:\\evidence\\...", "why": "The export must land on the evidence share."}], "dangerous": [{"re": "\\bdelete\\b", "label": "evidence-destroying delete", "why": "reg delete removes the very artefact you were sent to preserve."}, {"re": "\\brestore\\b", "label": "state-changing restore", "why": "restore overwrites registry state — a change, not a collection."}], "simOutput": ["(simulated) The operation completed successfully.", "(simulated) C:\\evidence\\safeboot-minimal.reg written"], "correctId": null, "hint": "Shape: tool, operation, the quoted key path ending in Minimal, then the destination file on the share.", "explain": "Canonical command: <span class=\"mono\">reg export \"HKLM\\SYSTEM\\CurrentControlSet\\Control\\SafeBoot\\Minimal\" C:\\evidence\\safeboot-minimal.reg<\/span>. Export is a copy: the source tree is untouched, which is what the authorisation and the evidence rules require. Its evil twin — reg delete on the same key — is indistinguishable from the attacker's own cleanup and would erase the persistence proof. Both terminals in this exam are about preservation; the destructive twins are the traps.", "study": "reg export for registry evidence; the delete/restore twins to refuse."}, {"id": "x11", "type": "order", "title": "The recovered playbook", "summary": "Ranking — the attacker's own next-step priorities", "perspective": "attacker", "scenario": "<p>Forensics recovered a fragment of the operator's notes (plain text, no timestamps). Rank the five lines in the order an operator following this playbook would execute them.<\/p>", "artifacts": [{"label": "Recovered notes fragment", "code": "note A: 'kill the safeboot value + reboot — look normal'\nnote B: 'set safeboot network, come back after reboot'\nnote C: 'register the runner under Minimal so it loads in the small boot'\nnote D: 'stage the locker to the finance share'\nnote E: 'run the locker once the watcher is confirmed gone'"}], "question": "Order the operator's steps as the playbook intends.", "items": [{"id": "p1", "label": "B — set safeboot network for the next boot", "why": "Preparation comes first: the boot change is the switch the rest depends on."}, {"id": "p2", "label": "C — register the runner under SafeBoot\\Minimal", "why": "The tool must be waiting inside the safe-mode session before the reboot makes that session happen."}, {"id": "p3", "label": "D — stage the locker on the finance share", "why": "Staging can ride the same session; it must precede execution."}, {"id": "p4", "label": "E — run the locker once the watcher is gone", "why": "Execution is the goal — only after the session is confirmed blind."}, {"id": "p5", "label": "A — remove the safeboot value and reboot to normal", "why": "Cleanup is last: hide the mechanism after the work is done."}], "hint": "The switch comes first, the tool must be inside before the switch flips, and looking normal again is the last wish.", "explain": "The playbook order: set safeboot (B), register the in-session runner (C), stage the locker (D), execute (E), then clean the boot value and reboot (A). Attacker view: C before B is the subtle discipline — the persistence must exist before the mode arrives, or the session is wasted. Defender view: every one of those five steps is observable, and the clean-up step (A) is your confirmation that the previous four already happened.", "study": "Operational ordering of a T1688 campaign, from the operator's side."}, {"id": "x12", "type": "click", "title": "Two lines that prove damage", "summary": "Incomplete log — click the two lines that prove in-session action", "perspective": "defender", "scenario": "<p>The safe-mode session's logs are partial — one line lost its timestamp in collection. Click the <b>two<\/b> lines that together prove the session was used for damage, not merely entered.<\/p>", "artifacts": [], "paragraphs": [{"tokens": [{"v": "04:17  safe-mode boot complete, EDR service running (M1054)", "id": "k1"}]}, {"tokens": [{"v": "[timestamp lost]  service 'svchost.exe' (SafeBoot\\Minimal) entered running state", "id": "k2"}]}, {"tokens": [{"v": "[timestamp lost]  1,412 ACL entries changed on \\\\MH-FS\\finance-staging", "id": "k3"}]}, {"tokens": [{"v": "04:56  svchost.exe (SafeBoot\\Minimal) stopped", "id": "k4"}]}, {"tokens": [{"v": "04:58  bcdedit /deletevalue {current} safeboot", "id": "k5"}]}], "clickInstruction": "Click exactly two lines. Click again to unselect.", "correctTokens": ["k3"], "tokenInfo": {"k3": {"label": "1,412 ACL entries changed on finance staging", "why": "Correct — the bulk change is the damage work; nothing else on the list shows action beyond the session existing."}, "k2": {"label": "the attacker service started", "why": "Close, but a service starting is still preparation-adjacent; without k3 it could have sat idle."}, "k5": {"label": "the /deletevalue cleanup", "why": "Cleanup proves hiding, not damage."}, "k1": {"label": "EDR started (M1054)", "why": "Defence telemetry, not damage."}, "k4": {"label": "attacker service stopped", "why": "Session end bookkeeping."}}, "correctId": null, "question": "Click the two lines that together prove the session did damage work.", "hint": "One line shows the tool ran; one line shows what the tool DID. You need the did.", "explain": "Only the 1,412 ACL changes (k3) prove action; the second click belongs to the line that shows the operator's tool running (k2), turning 'a service started' into 'this service did this'. The exercise also carries the incomplete-information lesson: with a lost timestamp, causal order (service running before its changes, changes before the service stops) still reconstructs the sequence — absence of a timestamp is not absence of a timeline.", "study": "Proving action vs presence; reconstructing order around missing timestamps."}, {"id": "x13", "type": "branch", "title": "The RAM capture failed", "summary": "Adaptation — accepting a loss that already happened", "perspective": "defender", "scenario": "<p>11:15. The RAM capture on MH-APP-31 failed — insufficient pagefile headroom, the tool aborted at 71%. The host is still isolated and powered on, the attacker is still active somewhere (file changes continue on a second host). The board wants a revised plan now.<\/p>", "artifacts": [{"label": "State (11:15)", "code": "MH-APP-31: RAM capture FAILED (71%, aborted)\n           powered on, isolated, running\nBCD export: done   SafeBoot export: done\nAttacker:   active on MH-DEV-05 (file changes live)\nBoard:      wants a decision in 5 minutes"}], "question": "Make the two revision decisions.", "steps": [{"id": "s1", "label": "Decision 1 — the sunk loss", "prompt": "The RAM capture failed at 71%. What do you do about MH-APP-31's volatile evidence?", "options": [{"id": "s1_o1", "text": "Accept the RAM loss as sunk; finish non-volatile collection on APP-31 (disk, tasks, registry)", "why": "Correct — the failed capture is an accepted cost; the recoverable classes (disk, SafeBoot, BCD, tasks) remain, and chasing the lost 29% spends minutes you do not have."}, {"id": "s1_o2", "text": "Retry the RAM capture after enlarging the pagefile", "why": "Wrong — changing the pagefile alters the very memory state you want, and the session is cold while another host bleeds evidence."}, {"id": "s1_o3", "text": "Power-cycle APP-31 and capture a 'fresh' RAM image", "why": "Wrong — a reset destroys residual running state for zero gain; a fresh boot holds nothing of the attacker's session."}], "correctId": "s1_o1"}, {"id": "s2", "label": "Decision 2 — the live capacity", "prompt": "You have one live-response specialist free right now. Where do they go?", "options": [{"id": "s2_o1", "text": "MH-DEV-05 — the attacker is actively changing files there; live evidence per minute is highest", "why": "Correct — a bleeding host offers collection and containment value per minute that a cold, isolated session cannot."}, {"id": "s2_o2", "text": "MH-APP-31 — finish the failed capture attempt properly", "why": "Wrong — APP-31 is isolated and cold; the attacker is not there anymore, and the sunk cost does not become recoverable by throwing the specialist at it."}, {"id": "s2_o3", "text": "Neither — write the incident report while the picture is fresh", "why": "Wrong — reporting matters, but an active attacker outranks documentation; the report can be written tonight."}], "correctId": "s2_o1"}], "hint": "Distinguish sunk loss from recoverable loss, and cold sessions from bleeding ones.", "explain": "The failed capture is an accepted cost — the exercise's 'real cost' moment — and the discipline is to bank what survived (BCD and SafeBoot exports, disk forensics) rather than chase the lost 29%. Live-response capacity is finite: the actively-changing host offers evidence and containment value per minute that a cold session cannot. Senior triage is deciding where the next minute of work buys the most, then saying that sentence out loud to a board.", "study": "Sunk evidence costs, recoverable classes, and live-response prioritisation."}, {"id": "x14", "type": "dnd", "title": "Behaviours to phases", "summary": "Mapping — four behaviours, four lifecycle slots", "perspective": "neutral", "scenario": "<p>The final report maps four observed behaviours to lifecycle slots. One of them is a documented procedure from the page's table; one is a decoy with a ticket.<\/p>", "artifacts": [], "question": "Drag each behaviour onto its lifecycle slot.", "items": [{"id": "q1", "label": "bcdedit /set {current} safeboot network", "why": "The preparation change that forces the next boot — pre-encryption impairment."}, {"id": "q2", "label": "COM object registered to load in the safe-mode session", "why": "Inside-safe-mode persistence — the description's other load path."}, {"id": "q3", "label": "msconfig safeboot change, ticket CHG-8877, confirmed diagnostic", "why": "Documented benign work — the decoy that belongs to nobody's kill chain."}, {"id": "q4", "label": "bcdedit /deletevalue + restart after bulk changes", "why": "Post-attack cleanup — hiding the mechanism once the work is done."}], "buckets": [{"id": "pre", "label": "Pre-encryption impairment", "hint": "Preparing the blind session.", "accepts": ["q1"]}, {"id": "pers", "label": "Inside-safe-mode persistence", "hint": "Tooling that lives in the session.", "accepts": ["q2"]}, {"id": "ben", "label": "Benign / unrelated", "hint": "Documented, owned, confirmed.", "accepts": ["q3"]}, {"id": "clean", "label": "Post-attack cleanup", "hint": "Hiding the switch afterwards.", "accepts": ["q4"]}], "hint": "The ticket is the tell for the decoy; the deletevalue is never preparation.", "explain": "The safeboot /set is pre-encryption impairment (the RansomHub/Qilin slot in the page's procedures); the COM registration is inside-safe-mode persistence; the ticketed msconfig change is benign work that must not inherit attack weight; the /deletevalue-plus-restart after bulk changes is cleanup. Reports that blur these four slots either overstate attacks or understate them — the slot assignment IS the finding.", "study": "Lifecycle slotting of boot-related behaviours for final reports."}, {"id": "x15", "type": "multi", "title": "Tradecraft match", "summary": "Multi-select — which families fit the observed chain", "perspective": "attacker", "scenario": "<p>Observed chain: 'bcdedit /set safeboot network', WMI-forced restart, in-session runner via SafeBoot, Go-based locker. Which of the page's families are consistent with this chain as published? Select all that apply — wrong picks cost credit.<\/p>", "artifacts": [{"label": "Page procedures (refresh)", "code": "Black Basta : bcdedit /set safeboot network\nREvil       : force reboot in safe mode with networking\nAvosLocker  : restart machine in safe mode\nQilin       : reboot in safe mode to avoid detection\nEmbargo     : MDeployer DLL via Safe Mode"}], "question": "Select every family whose published behaviour fits the observed chain.", "options": [{"id": "o1", "text": "Black Basta", "plain": "Black Basta", "why": "Correct — the exact bcdedit /set safeboot network command is its published procedure."}, {"id": "o2", "text": "REvil", "plain": "REvil", "why": "Correct — forcing a reboot into safe mode with networking is its published behaviour."}, {"id": "o3", "text": "AvosLocker", "plain": "AvosLocker", "why": "Wrong — it restarts machines into safe mode, but nothing published ties it to the specific networking command chain shown here."}, {"id": "o4", "text": "Embargo", "plain": "Embargo", "why": "Wrong — its procedure is the MDeployer DLL disabling security through Safe Mode; the observed chain shows no MDeployer artefact."}, {"id": "o5", "text": "Qilin", "plain": "Qilin", "why": "Wrong — its published reason (avoid detection) fits the goal but not the specific networking command chain; looser than the two fits."}], "correctIds": ["o1", "o2"], "hint": "Match on the published specifics: the command string and the networking detail, not the general goal.", "explain": "Black Basta (exact command) and REvil (safe mode with networking) fit the chain as published. AvosLocker, Qilin and Embargo all touch safe mode, but their published specifics differ — and the exercise's grading is deliberate: in attribution, over-matching on the shared goal ('they all reboot to safe mode') is the error the wrong picks simulate. Fit on specifics, state the rest as possibilities.", "study": "Procedure-specific attribution vs goal-level overlap."}, {"id": "x16", "type": "choice", "title": "The second credential", "summary": "Costly action — rotate now despite the business hit", "perspective": "defender", "scenario": "<p>13:40. You learn the operator holds a second, unrotated domain-admin credential (seen in a dumped LSA fragment on MH-DEV-05). Month-end close runs Friday; a fleet-wide credential rotation plus session invalidation lands on 6,000 users. The CISO asks whether to wait for the weekend. Nobody in the room wants to say the number out loud.<\/p>", "artifacts": [], "question": "Which call do you make?", "options": [{"id": "A", "text": "Rotate the credential and invalidate its sessions now, and say the Monday-morning friction is the cost being accepted", "plain": "rotate now, accept the friction", "why": "Correct — an unrotated domain-admin credential in attacker hands is the campaign's cheapest next step; rotation friction is bounded and known, attacker reuse is neither."}, {"id": "B", "text": "Wait for the weekend as planned — rotation mid-close is unthinkable", "plain": "wait for the weekend", "why": "Near miss — the calendar is real, but the credential can pivot faster than the calendar; the wait accepts an unbounded cost to avoid a bounded one."}, {"id": "C", "text": "Rotate only for the finance department and watch the rest", "plain": "rotate finance only", "why": "Near miss — the credential is domain-admin; its power is not departmental, and partial rotation leaves the pivot path whole."}, {"id": "D", "text": "Do not rotate; instead silently monitor the account and follow it", "plain": "monitor instead", "why": "Near miss — monitoring-first is defensible for low-privilege leakage; for domain-admin with an active operator it is how you lose the fleet while watching it."}], "correctId": "A", "hint": "Compare the two cost curves: one is bounded, scheduled and known; the other is unbounded and scheduled by the attacker.", "explain": "The costly action exercise, executive edition: rotating a domain-admin credential mid-close costs real, countable friction; leaving it costs an attacker-controlled, uncountable pivot. The senior move is to name the cost in the room ('this costs us the close-week comfort, and that is the price of removing their cheapest next step'), not to let the calendar decide by default. The 'monitor it quietly' option is the seductive best practice that fails when the credential is this powerful and the operator this active.", "study": "Cost-bound vs cost-unbounded decisions for credential exposure."}, {"id": "x17", "type": "branch", "title": "The 2003 host decision", "summary": "Branch — residual-risk control design in three steps", "perspective": "defender", "scenario": "<p>MH-FS-LEG-01 still runs Windows Server 2003 R2 (boot.ini era, planning system, no modern EDR possible). M1054 cannot protect it in safe mode — the control does not exist for this OS. Three decisions close the residual risk.<\/p>", "artifacts": [{"label": "Asset facts", "code": "MH-FS-LEG-01\nOS:      Windows Server 2003 R2\nEDR:     none installable (M1054 gap confirmed)\nData:    planning system, read-mostly, one vendor link\nAccess:  local admin = domain admin (legacy trust)"}], "question": "Make the three residual-risk decisions.", "steps": [{"id": "s1", "label": "Step 1 — the gap", "prompt": "Why does M1054 not cover this host?", "options": [{"id": "s1_o1", "text": "The endpoint software that must run in safe mode cannot be installed on this OS at all", "why": "Correct — M1054 requires software that can run in safe mode; none exists for this platform."}, {"id": "s1_o2", "text": "Someone disabled the EDR service manually", "why": "Wrong — no EDR exists here to disable; the gap is structural."}, {"id": "s1_o3", "text": "M1054 only applies to workstations", "why": "Wrong — it applies to any endpoint that can run the software; this one cannot."}], "correctId": "s1_o1"}, {"id": "s2", "label": "Step 2 — compensating control", "prompt": "Which compensating control fits this host?", "options": [{"id": "s2_o1", "text": "Remove its domain-admin trust and isolate it to the one vendor link it needs", "why": "Correct — you cannot give it a safe-mode guard, so you remove its ability to matter: least privilege plus network narrowing."}, {"id": "s2_o2", "text": "Install a 2003-era antivirus and accept it as the control", "why": "Wrong — 2003-era AV is itself unpatched and unsupported; it adds a false sense of control."}, {"id": "s2_o3", "text": "Monitor it from the network and change nothing else", "why": "Wrong — network monitoring without privilege reduction leaves the legacy trust intact."}], "correctId": "s2_o1"}, {"id": "s3", "label": "Step 3 — the endgame", "prompt": "The planning system is replaceable in 90 days. Final decision?", "options": [{"id": "s3_o1", "text": "Schedule retirement in 90 days with interim isolation and document the accepted risk until then", "why": "Correct — retirement removes the gap permanently; the interim plan is explicit, time-boxed and owned."}, {"id": "s3_o2", "text": "Retire it this afternoon, planning system be damned", "why": "Wrong — the business function is real; destroying it without a replacement is a self-inflicted outage."}, {"id": "s3_o3", "text": "Keep it as-is and revisit next year", "why": "Wrong — the gap is confirmed and structural; deferring accepts it silently."}], "correctId": "s3_o1"}], "hint": "You cannot fix the host — so shrink what an attacker gains from it, then end its life on a schedule.", "explain": "When a control cannot reach a platform, the design moves to the platform's blast radius: remove the domain-admin trust, narrow the network, then retire on a documented schedule with the accepted risk written down. This is the mitigation-mapping lesson at architecture level: M1026-style least privilege and M1054's safe-mode guard are complements, and where one structurally fails, the other plus retirement carries the risk.", "study": "Compensating controls where the primary mitigation structurally cannot apply."}, {"id": "x18", "type": "fill", "title": "The closing report", "summary": "Report completion — controls, sessions, persistence in one sentence", "perspective": "defender", "scenario": "<p>The GLASSVAULT closing report's key sentence must state what the control did, what the session was, and how the attacker persisted — in that order. Three blanks.<\/p>", "artifacts": [{"label": "Report sentence (draft)", "code": "During the forced safe-mode session on MH-APP-31,\n  the EDR service ____ (M1054 held); the session was still\n  used by the attacker, whose tool persisted via ____ ,\n  registered under the ____ tree."}], "question": "Complete the closing report sentence.", "segments": [{"t": "txt", "v": "During the forced safe-mode session on MH-APP-31, the EDR service "}, {"t": "blank", "id": "b1", "name": "control outcome"}, {"t": "txt", "v": " (M1054 held); the session was still used by the attacker, whose tool persisted via "}, {"t": "blank", "id": "b2", "name": "mechanism"}, {"t": "txt", "v": ", registered under the "}, {"t": "blank", "id": "b3", "name": "registry tree"}, {"t": "txt", "v": " tree."}], "bank": ["started successfully", "a COM object registered for safe mode", "SafeBoot\\Minimal", "failed to start", "a scheduled task", "BootLoader"], "blanks": [{"id": "b1", "name": "control outcome", "correct": "started successfully", "why": "The SCM artefact proved the EDR entered the running state during the session — M1054 did its job."}, {"id": "b2", "name": "mechanism", "correct": "a COM object registered for safe mode", "why": "The persistence half: the description names COM objects as a safe-mode load path; the SafeBoot service is the other half of the story and belongs in blank three's neighbourhood."}, {"id": "b3", "name": "registry tree", "correct": "SafeBoot\\Minimal", "why": "The service registration lived under SafeBoot\\Minimal on this host."}], "hint": "Blank one is the control's success; blanks two and three are the two halves of safe-mode persistence the description names.", "explain": "The closing sentence: the EDR service started successfully (M1054 held); the session was still used by the attacker, whose tool persisted via a COM object registered for safe mode, registered under the SafeBoot\\Minimal tree. It compresses the whole exam: a control can succeed and the technique can still advance — because T1688 has two halves, and a control that covers one half leaves the other half to your detections.", "study": "Writing findings that separate control outcomes from residual attacker capability."}];

/* ---------- timer state machine ---------- */
var T = {
  tick:null,
  start:function(){ this.stopTick(); var self=this; this.tick=setInterval(function(){ self.onTick(); },1000); },
  stopTick:function(){ if(this.tick){ clearInterval(this.tick); this.tick=null; } },
  onTick:function(){
    if(S.timer.state!=='RUNNING') return;
    S.timer.remaining--;
    if(S.timer.remaining<=0){ S.timer.remaining=0; S.timer.state='ENDED'; this.stopTick(); onTimeout(); }
    renderHeader();
  },
  setState:function(st){
    var prev=S.timer.state;
    if(prev===st) return;
    /* close any open pause interval logs */
    var now=Date.now();
    if(prev==='PAUSED_MANUAL'){ S.pauseLog.manualMs+=now-S.pauseLog.pauseStart; }
    if(prev==='PAUSED_AUTO_CHECK'){ S.pauseLog.autoMs+=now-S.pauseLog.autoStart; }
    if(st==='PAUSED_MANUAL'){ S.pauseLog.pauseStart=now; }
    if(st==='PAUSED_AUTO_CHECK'){ S.pauseLog.autoStart=now; }
    S.timer.state=st;
    if(st==='RUNNING'){ T.start(); } else { T.stopTick(); }
    if(st==='ENDED'){ T.stopTick(); }
    renderHeader();
  }
};

function onTimeout(){
  S.screen='results'; render();
}

/* ---------- score report ---------- */
function reportScore(){
  var answeredIds=S.order.filter(function(id){ return S.answered[id]; });
  var creditSum=0; answeredIds.forEach(function(id){ creditSum+=S.credits[id]||0; });
  var count=answeredIds.length;
  var percent=count>0?Math.round((creditSum/count)*100):0;
  S.reported=true;
  try{
    /* opened directly: there is no integrator to report to (self-post would be a no-op
       and would log an origin warning in some engines), so stay silent. */
    if(window.parent && window.parent!==window){
      /* Strict targeting on the real site (https: parent origin === location.origin).
         On opaque/file origins (sandbox, offline preview) strict targeting cannot match,
         so fall back to '*' — there is no cross-origin boundary to protect there. */
      var org=String(location.origin||'');
      var safe=(org && org!=='null' && org.indexOf('file://')!==0)?org:'*';
      parent.postMessage({
        type:'CYBERPULSE_SCORE', topicId:M.topicId, batch:M.batch,
        score:Math.round(creditSum), total:count, percent:percent, passed:percent>=M.passMark
      }, safe);
    }
  }catch(e){ /* opened directly; nothing to report to */ }
}

/* ---------- handshake ---------- */
var OPERATOR='';
window.addEventListener('message',function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  OPERATOR = event.data.username || '';
  var hi=document.getElementById('operator-hello');
  if(hi && OPERATOR){ hi.innerHTML='Operator signed in: <b>'+esc(OPERATOR)+'</b>'; }
});

/* ---------- header ---------- */
function timerStateLabel(){
  switch(S.timer.state){
    case 'RUNNING': return '<span class="tstate-running">&#9654; RUNNING</span>';
    case 'PAUSED_MANUAL': return '<span class="tstate-paused">&#9208; PAUSED &mdash; manual (press Resume)</span>';
    case 'PAUSED_AUTO_CHECK': return '<span class="tstate-paused">&#9203; AUTO-PAUSED &mdash; reading feedback (Next resumes)</span>';
    case 'ENDED': return '<span class="tstate-ended">&#9632; ENDED</span>';
    default: return '<span class="muted">&#9679; STANDBY</span>';
  }
}
function renderHeader(){
  var h=document.getElementById('examhead'); if(!h) return;
  var liveSum=0, liveCount=0;
  S.order.forEach(function(id){ if(S.answered[id]){ liveSum+=S.credits[id]||0; liveCount++; } });
  var pct=liveCount>0?Math.round((liveSum/liveCount)*100):0;
  var cur=curEx();
  var hintOff=(!cur)||S.hintUsed[cur.id]||S.feedbackShown[cur.id]||S.screen==='review';
  var reviewMode=(S.screen==='review');
  h.innerHTML =
    '<div class="left">'+
      '<div class="hstat"><span class="k">Exercise</span><span class="v">'+Math.min(S.idx+1,S.order.length)+' of '+S.order.length+'</span></div>'+
      '<span class="badge sev-badge" aria-label="Severity '+esc(M.sevWord)+'"><span class="dot"></span>'+esc(M.sevWord)+'</span>'+
      '<div class="hstat"><span class="k">Timer</span><span class="v mono">'+fmtTime(S.timer.remaining)+'</span></div>'+
      '<div class="hstat"><span class="k">Clock state</span><span class="v">'+timerStateLabel()+'</span></div>'+
      '<div class="hstat"><span class="k">Live score</span><span class="v"><span class="score-em">'+liveSum.toFixed(1)+'</span> / '+liveCount+' &nbsp;('+pct+'%)</span></div>'+
    '</div>'+
    '<div class="right">'+
      '<button class="btn ghost" id="btn-hint"'+(hintOff?' disabled':'')+' aria-label="Hint costs 10 percent of this exercise credit">&#128161; Hint (&minus;10%)</button>'+
      '<button class="btn ghost" id="btn-pause"'+(reviewMode?' disabled':'')+' aria-label="Pause exam manually">&#9208; Pause</button>'+
      '<button class="btn ghost" id="btn-skip"'+(reviewMode?' disabled':'')+' aria-label="Skip exercise">&#9888; Skip</button>'+
    '</div>';
  document.getElementById('btn-hint').onclick=onHint;
  document.getElementById('btn-pause').onclick=onManualPause;
  document.getElementById('btn-skip').onclick=onSkip;
  updateProgress();
}
function updateProgress(){
  var p=document.getElementById('progressbar'); if(!p) return;
  var done=0; S.order.forEach(function(id){ if(S.answered[id]||S.skipped.indexOf(id)>=0) done++; });
  p.style.width=Math.round((done/S.order.length)*100)+'%';
}

/* ---------- screens ---------- */
function render(){
  if(S.screen==='intro') renderIntro();
  else if(S.screen==='exam') renderExam();
  else if(S.screen==='review') renderReview();
  else if(S.screen==='results') renderResults();
}

function startExam(){
  S.order=shuffledOrder();
  S.idx=0; S.credits={}; S.answered={}; S.skipped=[]; S.hintUsed={};
  S.feedbackShown={};
  S.answers={}; S.lastRes={}; S.pauseLog={manualMs:0,autoMs:0,pauseStart:0,autoStart:0};
  S.timer.budget=M.timerSeconds; S.timer.remaining=M.timerSeconds;
  S.prevTimerState=null; S.endedBy='unfinished';
  S.reported=false; S.screen='exam'; S.mode='exam';
  T.setState('RUNNING');
  render();
}

/* ----- exam ----- */
function renderExam(){
  var e=curEx(); if(!e){ nextAfterLast(); return; }
  var head='<div class="exam-head" id="examhead"></div>'+
    '<div class="progress" role="progressbar" aria-label="Exam progress"><div class="bar" id="progressbar"></div></div>';
  if(S.timer.state==='PAUSED_MANUAL'){
    /* MANUAL PAUSE: the exercise is removed from the DOM, not just veiled */
    app.innerHTML=head+'<div id="exzone" class="pausedveil">'+
      '<div class="veil"><div class="big">&#9208; PAUSED &mdash; manual</div><div class="muted">Press Resume to continue.</div><button class="btn primary" id="btn-resume">&#9654; Resume</button></div>'+
      '</div>';
    renderHeader();
    var rr=document.getElementById('btn-resume'); if(rr) rr.onclick=onManualResume;
    return;
  }
  app.innerHTML=head+'<div id="exzone"><div id="exbody"></div></div>';
  renderHeader();
  renderExercise(e);
  /* feedback persists across Pause/Resume and re-entry into an answered exercise */
  if(S.feedbackShown[e.id] && S.lastRes[e.id]){
    renderFeedback(e, S.credits[e.id]||0, S.lastRes[e.id]);
  }
  var zone=document.getElementById('exzone');
  scrollNow(zone);
}

function onManualPause(){
  if(S.timer.state!=='RUNNING' && S.timer.state!=='PAUSED_AUTO_CHECK') return;
  S.prevTimerState=S.timer.state;
  T.setState('PAUSED_MANUAL');
  renderExam();
}
function onManualResume(){
  T.setState(S.prevTimerState==='PAUSED_AUTO_CHECK'?'PAUSED_AUTO_CHECK':'RUNNING');
  renderExam();
}

function onHint(){
  var e=curEx(); if(!e) return;
  if(S.hintUsed[e.id]) return;
  if(S.feedbackShown[e.id]) return;
  S.hintUsed[e.id]=true;
  var hp=document.getElementById('hintpanel');
  if(hp){ hp.classList.remove('hidden'); hp.setAttribute('aria-hidden','false'); }
  var b=document.getElementById('btn-hint'); if(b){ b.disabled=true; }
}

function onSkip(){
  var e=curEx(); if(!e) return;
  if(S.feedbackShown[e.id]){ /* already graded: Skip acts as Next */
    if(S.timer.state==='PAUSED_AUTO_CHECK'){ T.setState('RUNNING'); }
    var last=(S.idx===S.order.length-1);
    if(last){ if(S.skipped.length>0){ S.screen='review'; render(); } else finishExam(); }
    else advance(true);
    return;
  }
  if(S.skipped.indexOf(e.id)<0){ S.skipped.push(e.id); }
  advance(false);
}

/* advance: from Next or Skip. checked=true when moving past a checked exercise */
function advance(checked){
  var e=curEx();
  if(checked && e){
    var p=S.skipped.indexOf(e.id);
    if(p>=0){ S.skipped.splice(p,1); }
  }
  S.idx++;
  if(S.idx>=S.order.length){
    if(S.skipped.length>0){ S.screen='review'; render(); }
    else { nextAfterLast(); }
    return;
  }
  render();
}
function nextAfterLast(){
  /* safety net: anything never visited and unanswered joins the review pool */
  S.order.forEach(function(id){
    if(!S.answered[id] && S.skipped.indexOf(id)<0){ S.skipped.push(id); }
  });
  if(S.skipped.length>0){ S.screen='review'; render(); }
  else finishExam();
}
function finishExam(){
  S.timer.state='ENDED'; T.stopTick();
  S.screen='results'; render();
}

/* ---------- exercise renderers ---------- */
function renderExercise(e){
  var body=document.getElementById('exbody');
  body.innerHTML='';
  var card=el('div','card');
  card.setAttribute('data-ex',e.id);
  var already = S.feedbackShown[e.id];
  var sumline=e.summary||e.title;
  var scen='<div class="collhead"><div><h2 style="font-size:16px;letter-spacing:.4px">SCENARIO</h2>'+
    '<div class="sumline">'+esc(sumline)+(already?' &mdash; collapsed':'')+'</div></div>'+
    '<button class="ct" id="colltoggle" aria-expanded="true">Collapse</button></div>'+
    '<div class="collbody" id="collbody">'+e.scenario;
  (e.artifacts||[]).forEach(function(a,i){
    scen+='<div class="artefact"><div class="alabel"><span>ARTEFACT '+(i+1)+' &mdash; '+esc(a.label)+'</span></div><pre class="code">'+a.code+'</pre></div>';
  });
  scen+='</div>';
  card.innerHTML=scen;

  var ab=el('div','block block-question');
  ab.innerHTML='<div class="bh">&#10067; QUESTION</div><div class="qtext">'+e.question+'</div>';
  if(e.hint){
    ab.appendChild(el('div','hintpanel hidden','<div class="hh">&#128161; Hint (one only &mdash; 10% of this exercise credit)</div><div>'+e.hint+'</div>'));
    ab.lastChild.id='hintpanel'; ab.lastChild.setAttribute('aria-hidden','true');
  }
  card.appendChild(ab);

  var answ=el('div','block block-answer');
  answ.innerHTML='<div class="bh">&#9999; YOUR ANSWER</div>';
  var widget=el('div'); widget.id='widget'; answ.appendChild(widget);
  card.appendChild(answ);
  body.appendChild(card);

  /* collapsible behaviour */
  var ctog=card.querySelector('#colltoggle'), cbody=card.querySelector('#collbody');
  ctog.onclick=function(){
    var hid=cbody.classList.toggle('hidden');
    ctog.textContent=hid?'Expand':'Collapse';
    ctog.setAttribute('aria-expanded',hid?'false':'true');
  };

  RENDER[e.type](e,widget);

  /* nav row */
  var nav=el('div','btnrow');
  if(already){
    nav.innerHTML='<button class="btn primary" id="btn-next">'+(S.idx===S.order.length-1?'Final Submit &#10140;':'Next &#10140;')+'</button>';
  }else{
    nav.innerHTML='<button class="btn primary" id="btn-check">&#10003; Check</button>';
  }
  body.appendChild(nav);
  if(already){ bindNext(); } else { document.getElementById('btn-check').onclick=function(){ onCheck(e); }; }
}
function bindNext(){
  var b=document.getElementById('btn-next'); if(!b) return;
  b.onclick=function(){
    if(S.timer.state==='PAUSED_AUTO_CHECK'){ T.setState('RUNNING'); }
    if(S.mode==='review'){
      /* returning from a review answer: back to the review list */
      var cur=curEx();
      if(cur){ var pp=S.skipped.indexOf(cur.id); if(pp>=0){ S.skipped.splice(pp,1); } }
      if(S.skipped.length>0){ S.screen='review'; render(); }
      else finishExam();
      return;
    }
    var last=(S.idx===S.order.length-1);
    if(last){
      if(S.skipped.length>0){ S.screen='review'; render(); }
      else finishExam();
    } else {
      advance(true);
    }
  };
}

function onCheck(e){
  var res=GRADER[e.type](e);
  if(res===null){ /* nothing answered yet: nudge */
    var w=document.getElementById('widget');
    var nudge=w.querySelector('.nudge');
    if(!nudge){ nudge=el('div','small','<span style="color:var(--state-partial)">&#9888;</span> Choose an answer first, then press Check.'); w.insertBefore(nudge,w.firstChild); }
    return;
  }
  var credit=res.credit;
  if(S.hintUsed[e.id]) credit=Math.max(0,credit-0.10);
  credit=Math.round(credit*10000)/10000;
  S.credits[e.id]=credit; S.answered[e.id]=true; S.feedbackShown[e.id]=true;
  S.lastRes[e.id]=res;
  /* CHECK-TRIGGERED AUTO-PAUSE: first action, before rendering feedback */
  if(S.timer.state==='RUNNING'){ T.setState('PAUSED_AUTO_CHECK'); }
  renderHeader();
  renderExercise(e);
  renderFeedback(e,credit,res);
  var zone=document.getElementById('exzone'); if(zone) scrollNow(zone);
}

function renderFeedback(e,credit,res){
  var old=document.getElementById('fbzone'); if(old) old.remove();
  var zone=document.getElementById('exbody');
  var cls,lab,icon;
  if(credit>=0.999){ cls='fb-correct'; lab='CORRECT'; icon='&#10003;'; }
  else if(credit>0){ cls='fb-partial'; lab='PARTIALLY CORRECT'; icon='&#10003;'; }
  else { cls='fb-incorrect'; lab='INCORRECT'; icon='&#10007;'; }
  var fb=el('div','fb '+cls); fb.id='fbzone';
  var head='<div class="fbh"><span>'+icon+'</span> '+lab;
  if(res.n>1) head+=' <span class="credit">credit '+credit.toFixed(2)+' &mdash; '+res.h+' / '+res.n+' items</span>';
  if(res.dangerous) head+=' <span class="pill" style="color:var(--state-incorrect);border-color:var(--state-incorrect)">&#10007; DANGEROUS &mdash; NEAR MISS</span>';
  head+='</div>';
  var rows='';
  (res.rows||[]).forEach(function(r){
    var ic,cl;
    if(r.state==='ok'){ ic='&#10003; Correct'; cl='ic-ok'; }
    else if(r.state==='bad'){ ic='&#10007; Wrong'; cl='ic-bad'; }
    else if(r.state==='miss'){ ic='&#9675; Missed'; cl='ic-miss'; }
    else { ic='&#9679; Info'; cl='ic-part'; }
    rows+='<div class="itemrow"><span class="ic '+cl+'">'+ic+'</span><span><b>'+r.label+'</b>'+(r.why?' &mdash; '+r.why:'')+'</span></div>';
  });
  var study='';
  if(credit<0.999 && e.study) study='<div class="study"><b>What to study:</b> '+e.study+'</div>';
  var canon='';
  if(e.type==='terminal' && e.canonical){
    canon='<div class="artefact"><div class="alabel"><span>CANONICAL COMMAND &mdash; copyable</span>'+
      '<button type="button" class="ct" id="copycanon" aria-label="Copy canonical command">Copy</button></div>'+
      '<pre class="code" id="cmdcanon">'+esc(e.canonical)+'</pre></div>';
  }
  fb.innerHTML=head+canon+rows+'<div class="explain">'+e.explain+'</div>'+study;
  var copyBtn=fb.querySelector('#copycanon');
  if(copyBtn){ copyBtn.onclick=function(){
    var txt=e.canonical;
    try{ navigator.clipboard.writeText(txt); copyBtn.textContent='Copied'; }catch(err){ copyBtn.textContent='Select & copy'; }
    setTimeout(function(){ copyBtn.textContent='Copy'; },1500);
  }; }
  var navzone=zone.querySelector('.btnrow');
  zone.insertBefore(fb,navzone);
}

/* ----- render + grade per type ----- */
var RENDER={}; var GRADER={};

/* choice */
RENDER.choice=function(e,w){
  var order=shuffle(e.options.map(function(o){return o.id;}));
  S.answers[e.id+'_order']=order;
  var wrap=el('div','opts');
  order.forEach(function(oid,i){
    var o=e.options.filter(function(x){return x.id===oid;})[0];
    var b=el('button','opt'); b.type='button'; b.setAttribute('data-oid',oid);
    b.innerHTML='<span class="olabel">'+letters(i)+'.</span><span>'+o.text+' <span class="selmark">&#9679; selected</span></span>';
    b.onclick=function(){
      if(S.feedbackShown[e.id]) return;
      wrap.querySelectorAll('.opt').forEach(function(x){ x.classList.remove('selected'); });
      b.classList.add('selected'); b.setAttribute('aria-pressed','true');
      S.answers[e.id]=oid;
      var n=w.querySelector('.nudge'); if(n) n.remove();
    };
    wrap.appendChild(b);
  });
  w.appendChild(wrap);
};
GRADER.choice=function(e){
  var pick=S.answers[e.id];
  if(!pick) return null;
  var ok=(pick===e.correctId);
  var rows=e.options.map(function(o){
    if(o.id===e.correctId) return {label:o.plain,state:ok&&pick===o.id?'ok':'miss',why:o.why};
    if(o.id===pick) return {label:o.plain,state:'bad',why:o.why};
    return null;
  }).filter(Boolean);
  return {credit:ok?1:0,h:ok?1:0,n:1,rows:rows};
};

/* multi */
RENDER.multi=function(e,w){
  var order=shuffle(e.options.map(function(o){return o.id;}));
  S.answers[e.id+'_order']=order;
  var wrap=el('div','opts');
  order.forEach(function(oid,i){
    var o=e.options.filter(function(x){return x.id===oid;})[0];
    var b=el('button','opt'); b.type='button'; b.setAttribute('data-oid',oid);
    b.innerHTML='<span class="olabel">'+letters(i)+'.</span><span>'+o.text+' <span class="selmark">&#9679; selected</span></span>';
    b.onclick=function(){
      if(S.feedbackShown[e.id]) return;
      var on=b.classList.toggle('selected');
      b.setAttribute('aria-pressed',on?'true':'false');
      var set=S.answers[e.id]||[]; set=on?set.concat([oid]):set.filter(function(x){return x!==oid;});
      S.answers[e.id]=set;
      var n=w.querySelector('.nudge'); if(n&&set.length) n.remove();
    };
    wrap.appendChild(b);
  });
  w.appendChild(wrap);
};
GRADER.multi=function(e){
  var pick=S.answers[e.id]; if(!pick||!pick.length) return null;
  var h=0,wr=0,rows=[];
  e.options.forEach(function(o){
    var sel=pick.indexOf(o.id)>=0, corr=e.correctIds.indexOf(o.id)>=0;
    if(sel&&corr){ h++; rows.push({label:o.plain,state:'ok',why:o.why}); }
    else if(sel&&!corr){ wr++; rows.push({label:o.plain,state:'bad',why:o.why}); }
    else if(!sel&&corr){ rows.push({label:o.plain,state:'miss',why:o.why}); }
  });
  return {credit:scoreExercise(h,wr,e.correctIds.length),h:h,n:e.correctIds.length,rows:rows};
};

/* dnd (click-to-place + HTML5 drag) */
RENDER.dnd=function(e,w){
  var items=shuffle(e.items.map(function(x){return x.id;}));
  S.answers[e.id]={placed:{},sel:null};
  var bank=el('div','bank'); bank.id='bank_'+e.id;
  items.forEach(function(iid){
    var it=e.items.filter(function(x){return x.id===iid;})[0];
    var d=el('button','ditem'); d.type='button'; d.draggable=true; d.setAttribute('data-iid',iid);
    d.innerHTML='&#8942;&#8942; '+it.label;
    d.onclick=function(){ if(S.feedbackShown[e.id])return;
      bank.querySelectorAll('.ditem').forEach(function(x){x.classList.remove('sel');});
      d.classList.add('sel'); S.answers[e.id].sel=iid; };
    d.ondragstart=function(ev){ ev.dataTransfer.setData('text/plain',iid); d.classList.add('dragging'); };
    d.ondragend=function(){ d.classList.remove('dragging'); };
    bank.appendChild(d);
  });
  w.appendChild(el('div','small muted','Click an item, then click the right panel. You can also drag the items. Return an item with its &times; button.'));
  w.appendChild(bank);
  var bwrap=el('div','buckets');
  e.buckets.forEach(function(b){
    var bd=el('div','bucket'); bd.setAttribute('data-bid',b.id);
    bd.innerHTML='<h5>'+b.label+'</h5>'+(b.hint?'<div class="bhint">'+b.hint+'</div>':'')+'<div class="chips"></div>';
    bd.onclick=function(){
      var sel=S.answers[e.id].sel; if(!sel||S.feedbackShown[e.id]) return;
      place(e,sel,bd); S.answers[e.id].sel=null;
      bank.querySelectorAll('.ditem').forEach(function(x){x.classList.remove('sel');});
    };
    bd.ondragover=function(ev){ ev.preventDefault(); bd.classList.add('over'); };
    bd.ondragleave=function(){ bd.classList.remove('over'); };
    bd.ondrop=function(ev){ ev.preventDefault(); bd.classList.remove('over');
      if(S.feedbackShown[e.id])return; place(e,ev.dataTransfer.getData('text/plain'),bd); };
    bwrap.appendChild(bd);
  });
  w.appendChild(bwrap);
  function place(e2,iid,bd){
    if(!iid) return;
    var it=e2.items.filter(function(x){return x.id===iid;})[0];
    var src=document.getElementById('bank_'+e2.id).querySelector('[data-iid="'+iid+'"]');
    if(!src) return; /* already placed: move back to bank first */
    src.remove();
    var chip=el('div','chipx'); chip.setAttribute('data-iid',iid);
    chip.innerHTML='<span>'+it.label+'</span>';
    var x=el('button','','&times;'); x.setAttribute('aria-label','Return item '+iid);
    x.onclick=function(ev){ ev.stopPropagation();
      if(S.feedbackShown[e2.id])return;
      chip.remove(); delete S.answers[e2.id].placed[iid];
      document.getElementById('bank_'+e2.id).appendChild(src);
    };
    chip.appendChild(x); bd.querySelector('.chips').appendChild(chip);
    S.answers[e2.id].placed[iid]=bd.getAttribute('data-bid');
  }
};
GRADER.dnd=function(e){
  var a=S.answers[e.id]||{placed:{}};
  var placedCount=Object.keys(a.placed).length;
  if(placedCount===0) return null;
  var h=0,wr=0,rows=[];
  e.items.forEach(function(it){
    var got=a.placed[it.id];
    var good=e.buckets.filter(function(b){return b.id===got;})[0];
    var goodBucket=good&&good.accepts.indexOf(it.id)>=0;
    if(got&&goodBucket){ h++; rows.push({label:it.label+' &rarr; '+good.label,state:'ok',why:it.why}); }
    else if(got){ wr++; var g2=e.buckets.filter(function(b){return b.id===got;})[0];
      rows.push({label:it.label+' &rarr; '+(g2?g2.label:'?'),state:'bad',why:it.why}); }
    else { rows.push({label:it.label+' (not placed)',state:'miss',why:it.why}); }
  });
  return {credit:scoreExercise(h,wr,e.items.length),h:h,n:e.items.length,rows:rows};
};

/* match */
RENDER.match=function(e,w){
  var rights=shuffle(e.rights.map(function(x){return x.id;}));
  S.answers[e.id]={pairs:{},selLeft:null};
  w.appendChild(el('div','small muted','Click one card on the left, then its partner on the right. Click a made pair to undo it.'));
  var wrap=el('div','matchwrap');
  var lcol=el('div','mcol'), rcol=el('div','mcol');
  e.lefts.forEach(function(l){
    var b=el('button','ditem'); b.type='button'; b.setAttribute('data-lid',l.id);
    b.innerHTML='&#9635; '+l.label;
    b.onclick=function(){
      if(S.feedbackShown[e.id])return;
      lcol.querySelectorAll('.ditem').forEach(function(x){x.classList.remove('sel');});
      b.classList.add('sel'); S.answers[e.id].selLeft=l.id;
    };
    lcol.appendChild(b);
  });
  rights.forEach(function(rid){
    var r=e.rights.filter(function(x){return x.id===rid;})[0];
    var b=el('button','ditem'); b.type='button'; b.setAttribute('data-rid',rid);
    b.innerHTML=r.label;
    b.onclick=function(){
      if(S.feedbackShown[e.id])return;
      var lid=S.answers[e.id].selLeft; if(!lid) return;
      var lb=lcol.querySelector('[data-lid="'+lid+'"]');
      lb.classList.remove('sel'); S.answers[e.id].selLeft=null;
      /* if this right card already paired, unpair it */
      var prev=Object.keys(S.answers[e.id].pairs).filter(function(k){return S.answers[e.id].pairs[k]===rid;})[0];
      if(prev!==undefined){ delete S.answers[e.id].pairs[prev]; unpairLine(e,prev); }
      if(S.answers[e.id].pairs[lid]){ unpairLine(e,lid); }
      S.answers[e.id].pairs[lid]=rid;
      var pl=document.getElementById('pairs_'+e.id);
      var line=el('div','pairline'); line.id='pair_'+lid;
      var lt=e.lefts.filter(function(x){return x.id===lid;})[0];
      line.innerHTML='&#8594; <b>'+lt.label+'</b> matched with <b>'+r.label+'</b> <button type="button" style="background:none;border:none;color:var(--text-secondary);cursor:pointer" aria-label="Undo pair">&times;</button>';
      line.querySelector('button').onclick=function(){ if(S.feedbackShown[e.id])return; unpair(e,lid); };
      pl.appendChild(line);
      var n=w.querySelector('.nudge'); if(n&&Object.keys(S.answers[e.id].pairs).length) n.remove();
    };

  function unpairLine(e2,lid){ var ln=document.getElementById('pair_'+lid); if(ln) ln.remove(); }
  function unpair(e2,lid){ delete S.answers[e2.id].pairs[lid]; unpairLine(e2,lid); }
};
GRADER.match=function(e){

};

/* order / rank */
RENDER.order=function(e,w){
  var items=shuffle(e.items.map(function(x){return x.id;}));
  S.answers[e.id]=items;
  w.appendChild(el('div','small muted','Put the items in the right order. Use the arrows or drag an item onto another item.'));
  var list=el('div','orderlist'); list.id='olist_'+e.id;
  w.appendChild(list);
  function draw(){
    list.innerHTML='';
    S.answers[e.id].forEach(function(iid,i){
      var it=e.items.filter(function(x){return x.id===iid;})[0];
      var row=el('div','oitem'); row.draggable=true; row.setAttribute('data-iid',iid);
      row.innerHTML='<span class="onum">'+(i+1)+'</span><span class="otxt">'+it.label+'</span>'+
        '<span class="mv"><button type="button" data-d="-1" aria-label="Move up">&#9650;</button><button type="button" data-d="1" aria-label="Move down">&#9660;</button></span>';
      row.querySelector('[data-d="-1"]').onclick=function(){ if(S.feedbackShown[e.id])return; move(i,-1); };
      row.querySelector('[data-d="1"]').onclick=function(){ if(S.feedbackShown[e.id])return; move(i,1); };
      row.ondragstart=function(ev){ ev.dataTransfer.setData('text/plain',String(i)); };
      row.ondragover=function(ev){ ev.preventDefault(); };
      row.ondrop=function(ev){ ev.preventDefault(); if(S.feedbackShown[e.id])return;
        var from=parseInt(ev.dataTransfer.getData('text/plain'),10); if(isNaN(from))return;
        var arr=S.answers[e.id]; var m=arr.splice(from,1)[0]; arr.splice(i,0,m); draw(); };
      list.appendChild(row);
    });
  }
  function move(i,d){
    var arr=S.answers[e.id]; var j=i+d; if(j<0||j>=arr.length) return;
    var t=arr[i]; arr[i]=arr[j]; arr[j]=t; draw();
  }
  draw();
};
GRADER.order=function(e){
  var a=S.answers[e.id]; if(!a||!a.length) return null;
  var h=0,wr=0,rows=[];
  a.forEach(function(iid,pos){
    var it=e.items.filter(function(x){return x.id===iid;})[0];

    else { wr++; rows.push({label:'Position '+(pos+1)+': '+it.label,state:'bad',why:it.why+' (correct here: '+e.items[pos].label+')'}); }
  });
  return {credit:scoreExercise(h,wr,e.items.length),h:h,n:e.items.length,rows:rows};
};

GRADER.fill=function(e){

GRADER.tag=function(e){

  if(!any) return null;
  var h=0,wr=0,rows=[];
  e.lines.forEach(function(l){
    var got=a[l.id];
    var correctTag=null; e.tags.forEach(function(t){ if(t.accepts.indexOf(l.id)>=0) correctTag=t.id; });
    var correctLabel=correctTag?e.tags.filter(function(t){return t.id===correctTag;})[0].label:'?';

    else { rows.push({label:'Line "'+l.short+'" (untagged)',state:'miss',why:l.why}); }
  });

};
