<style>

html{color-scheme:dark;}
html,body{background:var(--bg-page);color:var(--text-primary);}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.55;}

.hidden{display:none!important;}
.view{max-width:1000px;margin:0 auto;padding:18px 16px 64px;}
a{color:var(--accent-blue);}

button,select,input{font:inherit;color:inherit;}
button{cursor:pointer;}

/* severity badge colour is driven by body class */
body.sev-easy{--sev-c:var(--sev-easy);}
body.sev-medium{--sev-c:var(--sev-medium);}
body.sev-hard{--sev-c:var(--sev-hard);}
body.sev-extreme{--sev-c:var(--sev-extreme);}
/* ---------- top bar ---------- */
#topbar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,var(--bg-topbar-1) 0%,var(--bg-topbar-2) 100%);border-bottom:1px solid var(--border);box-shadow:var(--shadow);}
.tb-row{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;}
.tb-id{font-weight:700;letter-spacing:.02em;}
.tb-sub{color:var(--text-secondary);font-size:.86em;}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--bg-surface);border-radius:999px;padding:5px 12px;min-height:34px;font-size:.86em;white-space:nowrap;}
.chip .lbl{color:var(--text-secondary);}
.sev-badge{border:1px solid var(--sev-c);color:var(--sev-c);background:var(--tint-white);font-weight:700;letter-spacing:.06em;}
.timer-chip{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;}

.timer-chip .tstate{color:var(--text-secondary);}
.timer-chip.t-running .tstate{color:var(--accent-green);}

.timer-chip.t-ended .tstate{color:var(--state-skipped);}

.score-chip .spct{color:var(--text-secondary);}
.btn{border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-primary);border-radius:8px;padding:9px 16px;min-height:44px;transition:background .15s,border-color .15s,transform .05s;}
.btn:hover{background:var(--bg-hover);border-color:var(--border-hover);}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{border-color:var(--accent-blue);background:var(--tint-blue);}

.btn-go{border-color:var(--accent-green);background:var(--tint-green);}

.logline{font-family:ui-monospace,Consolas,monospace;font-size:14px;color:var(--text-mono);white-space:pre-wrap;word-break:break-word;padding:2px 0;border-bottom:1px dotted var(--border-dim);}

.logv-filter{display:flex;gap:8px;align-items:center;margin:0 0 8px;}

.blank-text{font-size:1.02em;line-height:2;}
.blank-text select{margin:0 4px;}

.ordr-item .otxt{flex:1;}

.dnd-wrap{display:flex;flex-wrap:wrap;gap:16px;}

.dnd-item{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:8px 0;cursor:grab;touch-action:none;user-select:none;}
.dnd-item.dragging{opacity:.55;border-style:dashed;}
.dnd-item.picked{border-color:var(--accent-blue);box-shadow:0 0 0 1px var(--accent-blue) inset;}

.dnd-bucket{border:1.5px dashed var(--border);border-radius:8px;padding:10px 14px;min-height:96px;background:var(--bg-surface-2);}

.dnd-bucket.over{border-color:var(--accent-blue);background:var(--tint-blue-2);}
.dnd-bucket.over::after{content:"⬇ Drop here";display:block;font-size:.8em;color:var(--accent-blue);font-family:ui-monospace,Consolas,monospace;}
.dnd-hint{font-size:.82em;color:var(--text-secondary);margin:6px 0;}
/* terminal */
.term{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.term-head{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);color:var(--text-secondary);font-size:.8em;font-family:ui-monospace,Consolas,monospace;}
.term-dot{width:10px;height:10px;border-radius:50%;background:var(--state-partial);display:inline-block;}
.term-scroll{max-height:280px;overflow:auto;padding:12px 14px;font-family:ui-monospace,Consolas,monospace;font-size:14px;color:var(--text-mono);}
.term-line{white-space:pre-wrap;word-break:break-word;}
.term-in{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);padding:10px 14px;}

.term-in input{flex:1;background:transparent;border:none;color:var(--text-mono);font-family:ui-monospace,Consolas,monospace;font-size:14px;min-height:44px;}

.syntax-panel{background:var(--bg-surface-2);border:1px solid var(--border);border-left:3px solid var(--accent-amber);border-radius:8px;padding:12px 16px;margin:10px 0;font-size:.92em;}

.timer-note{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--state-paused);color:var(--state-paused);border-radius:6px;padding:4px 10px;font-size:.85em;margin:8px 0;}

.fb{border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-surface);margin:0 0 16px;overflow:hidden;}
.fb-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:11px 16px;font-weight:700;letter-spacing:.05em;border-bottom:1px solid var(--border);}

.fb-part .fb-head{color:var(--state-partial);background:var(--tint-amber);border-left:3px solid var(--state-partial);}
.fb-bad .fb-head{color:var(--state-incorrect);background:var(--tint-red);border-left:3px solid var(--state-incorrect);}
.fb-credit{font-family:ui-monospace,Consolas,monospace;font-size:.9em;color:var(--text-secondary);font-weight:400;}
.fb-body{padding:14px 18px;}
.fbitems{margin:10px 0;padding:0;list-style:none;}
.fbitem{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:9px 13px;margin:7px 0;font-size:.94em;}
.fbitem .fi-ic{font-weight:700;min-width:20px;}
.fbitem.st-ok{color:var(--state-correct);}
.fbitem.st-bad{color:var(--state-incorrect);}

.fbitem .fi-why{color:var(--text-secondary);font-weight:400;}
.fb-why{border-top:1px dashed var(--border);margin-top:12px;padding-top:12px;color:var(--text-secondary);}
.fb-why .why-t{color:var(--text-primary);font-weight:700;display:block;margin-bottom:6px;}
.fb-danger{display:flex;gap:10px;border:1px solid var(--state-incorrect);background:var(--tint-red);color:var(--state-incorrect);border-radius:8px;padding:10px 14px;margin:10px 0;font-weight:700;}

.rv-item{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:11px 14px;margin:9px 0;}

}

  .view{padding:12px 10px 50px;}
  .tb-row{padding:8px 10px;}

var EXAM = {
meta:{topicId:'t1666',batch:3,title:'T1666 Modify Cloud Resource Hierarchy — HARD',difficulty:'hard',questionCount:17,estimatedMinutes:42,passMark:70,sevKey:'hard',sevName:'HARD',objId:'T1666',objName:'Modify Cloud Resource Hierarchy',timerSeconds:3000},
intro:{
learn:'<p>This is the <b>HARD</b> exam for <b>T1666 — Modify Cloud Resource Hierarchy</b>, the ATT&amp;CK technique where adversaries change the grouping of cloud resources — AWS Organizations and accounts, Azure management groups and subscriptions — to escape guardrails and detections.</p><p>At this level the answers stop being obvious on purpose. You will read <b>several artefacts at once</b> — CloudTrail events, Azure Activity Log entries, change tickets, SCP JSON — and you will meet <b>near-miss answers</b>: options that are technically defensible in a different context but wrong in this one. Some events look alarming and are benign. Some look routine and are the attack. One correct action is the least aggressive one.</p><p>This is a <b>Technique</b> object, so you will work both sides: the <b>red side</b> (what the adversary does next once guardrails fall) and the <b>blue side</b> (which detection anchors first, which control actually blunts the move). You will also touch the real-world layer: Microsoft Threat Intelligence’s reporting on the <b>Peach Sandstorm</b> password-spray campaigns and the subscription-hijacking hunting guidance published for Microsoft Defender for Cloud Apps.</p><p>In real work this is the daily material of a <b>senior SOC analyst</b> correlating cloud alerts, a <b>detection engineer</b> tuning AN0442 against M&amp;A noise, a <b>cloud architect</b> designing SCPs, and an <b>incident commander</b> choosing containment that preserves evidence.</p>',
keywords:[
{theme:'Correlation &amp; near-miss analysis',items:['Multi-artefact correlation (log + ticket + policy set)','LeaveOrganization vs account-removal near-misses','MoveAccount as a quiet guardrail escape','Break-glass roles as hierarchy weapons']},
{theme:'Real-world procedures',items:['Peach Sandstorm — password spray to Global Administrator','Subscription hijacking reported by Microsoft Threat Intelligence','Hunting compromised Azure subscriptions (Defender for Cloud Apps guidance)']},
{theme:'Detection engineering',items:['AN0442 tuning against M&amp;A onboarding baselines','Compensating detections for IaaS blind spots','D3FEND: Configuration Inventory and Restore Configuration','Transfer-direction proof in activity-log fields']},
{theme:'Control design',items:['SCP deny-block design and its exemption flaws','M1047 audit prioritisation','M1018 vs M1054 scoping trade-offs','Least-aggressive containment under pressure']}],
how:'<ul class="howlist"><li><b>Pass mark: 70%.</b> A PASS means you can discriminate between near-miss answers under artefact pressure. A FAIL means you should retake this exam.</li><li><b>Exercise types in this file:</b> multi-artefact analysis, multi-select with partial credit, near-miss multiple choice, branching decisions (red and blue), JSON flaw-spotting, priority ranking, D3FEND matching, an Azure CLI terminal, and ordering under escalation pressure.</li><li><b>Timer:</b> you get a 50 minute countdown. 💡 <b>Hint</b> removes one wrong path only (−10% of that exercise’s credit, one hint per exercise). ⏸ <b>Pause</b> hides the exercise for a real break.</li><li><b>Check pauses the timer:</b> ✓ Check stops the clock at once; the feedback stays as long as you need; the clock runs again on Next. Branching exercises grade and pause only on the final Check.</li><li><b>Partial credit:</b> multi-item exercises score (correct − wrong) ÷ total. Near-miss picks subtract. Read before you tick.</li><li><b>Skipping:</b> ⚠ Skip parks the exercise silently; the pool stays open while the timer runs; never-answered exercises are excluded from the score.</li><li>Press <b>Start</b> when ready — artefacts are dense; pace yourself.</li></ul>'
},
exercises:[
{id:'h1',type:'multi',summary:'02:11 Saturday — read all three artefacts before answering',
scenario:['Saturday, 02:11 UTC. Bluepeak Health, incident BP-2026-0417. Three artefacts are in front of you. Read all three before you tick anything.'],
artefacts:[
{label:'ARTEFACT 1 — CloudTrail management event',html:'<p><span class="ld">2026-04-18T02:11:07Z</span> <span class="lk">eventName</span>=<span class="ls">LeaveOrganization</span><br><span class="lk">userIdentity</span>=<span class="lu">arn:aws:sts::666666666666:assumed-role/BreakGlass-2/emergency-console</span><br><span class="lk">eventResult</span>=<span class="ls">success</span> <span class="lk">readOnly</span>=<span class="ls">false</span></p>'},
{label:'ARTEFACT 2 — change system query',html:'<p>Change windows for account <code>666666666666</code> this weekend: <b>none scheduled</b>. Last approved change for this account: 41 days ago (routine tag update).</p>'},
{label:'ARTEFACT 3 — SCP inventory for the account’s OU',html:'<p>Attached at OU <code>ou-bh-workloads</code>: <code>scp-deny-leave</code> (denies <code>organizations:LeaveOrganization</code>), <code>scp-region-lock</code>, <code>scp-root-actions</code>. All three applied via organization membership.</p>'}],
question:'Select <b>all</b> the conclusions the artefacts actually support.',
options:[
{t:'BreakGlass-2 credentials severed the account from the organization',correct:true,why:'The event names the role and the API; success is recorded.'},
{t:'Every SCP guardrail that applied via membership stopped applying at 02:11',correct:true,why:'Artefact 3 lists the guardrails; the leave removes exactly those.'},
{t:'If monitoring relied on the organization-wide trail, that account’s new activity may now fall outside it',correct:true,why:'Org-trail coverage follows membership; a severed account drifts out of scope.'},
{t:'LeaveOrganization also deleted the account and its resources',why:'Leaving is detachment, not deletion — the account lives on without the guardrails.'}],
multiNote:'Three of four conclusions are supported. Extra or wrong picks subtract credit.',
hint:'The event proves the leave; the inventory proves what was lost. Nothing in the artefacts says anything was deleted.',
explain:'The artefacts chain into one fact set: a break-glass role, an unscheduled hour, and three membership guardrails that died with the leave. <b>Attacker view:</b> the break-glass role is the perfect hierarchy weapon — powerful, rarely watched, excused from normal controls. <b>Defender view:</b> the case now turns on BreakGlass-2 usage history and on compensating logging for an account that just left your trail’s reach.'},

{id:'h2',type:'qcm',summary:'Friday 22:40 — the alert that two analysts already closed',
scenario:['Friday 22:40. <code>CreateAccount</code> builds <code>bluepeak-staging-2026</code> under the organization, caller <code>j.mercer@bluepeak[.]example</code>, DevOps lead. Jira BP-1571 “Annual staging account refresh — approved” is linked, approver: platform manager. Two analysts closed it as expected activity. The queue metric says this event family fired 9 times this month, all ticketed.'],
question:'What is the <b>best</b> next action?',
options:[
{t:'Corroborate ticket, approver and requester, then document and leave the account pending Monday review',correct:true,why:'The evidence points benign, but corroboration and documentation cost nothing and catch the trained-look-alike.'},
{t:'Detach the account and suspend Mercer immediately — Friday-night creations are attacks',why:'Aggressive action against a ticketed, named, approved change punishes legitimate work and destroys trust.'},
{t:'Accept it — a linked Jira ticket means the event is safe by definition',why:'Tickets can be forged or mis-scoped; “linked” is not “verified”.'},
{t:'Delete the new account to undo the risk',why:'Deleting a possibly-legitimate account destroys evidence and may break the staging refresh.'}],
hint:'Everything looks right. The question is what a senior analyst does when everything looks right at an odd hour.',
explain:'This is the “looks alarming but is benign” trap — and the correct action is the <b>least aggressive</b> one. The ticket, the named requester and the approver make benign the best explanation; corroboration plus Monday review is what separates a defensible close from a lucky one. <b>Attacker view:</b> a stolen DevOps identity with a real ticket is exactly how a rogue <code>CreateAccount</code> would be dressed — so the corroboration habit is the control.'},

{id:'h3',type:'qcm',summary:'04:00 pipeline move — routine or escape path?',
scenario:['04:00. Role <code>svc-IaC-Automation</code> calls <code>MoveAccount</code>: account <code>777777777777</code> moves from OU <code>ou-bh-gold</code> (strict SCPs) to OU <code>ou-sandbox-experimental</code> (minimal SCPs). The pipeline has 400 similar moves in its history, all ticketed. This one has no ticket. The pipeline’s last deployment was three weeks ago.'],
viewer:{label:'CloudTrail — organizations event',lines:[
'<span class="ld">2026-04-18T04:00:12Z</span> <span class="lk">eventName</span>=<span class="ls">MoveAccount</span> <span class="lk">source</span>=<span class="ls">ou-bh-gold</span> <span class="lk">destination</span>=<span class="ls">ou-sandbox-experimental</span>',
'<span class="lk">userIdentity</span>=<span class="lu">role/svc-IaC-Automation</span> <span class="lk">sessionId</span>=<span class="ls">rotated-4d-prior</span> <span class="lk">changeRef</span>=<span class="ls">null</span>']},
question:'What do you check <b>first</b>?',
options:[
{t:'Whether a pipeline change set requested the move, and who owns the destination OU',correct:true,why:'The anomaly is the missing ticket on an otherwise ticketed automation — start where the pattern broke.'},
{t:'Whether the account’s users have MFA enrolled',why:'Plausible hygiene question, but it does not explain a silent strict-to-loose move.'},
{t:'The account’s monthly cost trend',why:'Cost drift is not what broke the pattern here.'},
{t:'Whether the destination OU name follows naming standards',why:'Cosmetic. The policy distance is the issue, not the name.'}],
hint:'The pipeline is normally loud with tickets. This time it is silent. Where does that point?',
explain:'This is the “looks benign but is alarming” case: a known automation principal doing what it always does — except unticketed, and into a loose policy zone. <code>MoveAccount</code> moves the account’s <b>inherited SCP coverage</b>, so a strict-to-loose move is a guardrail escape wearing pipeline clothing. First check the change system; if no change set exists, treat the move as hostile until the pipeline owner proves otherwise.'},

{id:'h4',type:'qcm',summary:'“They deleted the account” — correct the responder',
scenario:['The 02:11 <code>LeaveOrganization</code> is on the bridge call. A responder proposes: “The attacker deleted the account. Let’s restore it from backup and rebuild.”'],
question:'Which correction is right?',
options:[
{t:'LeaveOrganization detaches the account; it still exists with its resources — restore-from-backup is the wrong play',correct:true,why:'The API ends organization membership. Existence, resources and data stay untouched.'},
{t:'LeaveOrganization deletes the account after a 24-hour grace period',why:'No such grace period is part of this API — that is a different lifecycle process.'},
{t:'LeaveOrganization only locks the console, resources keep running under full guardrails',why:'The opposite: guardrails are what stop applying.'},
{t:'LeaveOrganization merges the account into the management account',why:'Accounts never merge; membership is a tree relationship, not a merge.'}],
hint:'Re-read the ATT&amp;CK sentence: the account is “severed from the AWS Organization to which it was tied”. What exactly does severing remove?',
explain:'The near-miss is deletion-thinking. <code>LeaveOrganization</code> severs the membership: SCPs, guardrails and org-trail coverage stop; the account, its resources and its data persist — now <b>outside</b> your policy perimeter. The response play is therefore containment of a live account, not restoration of a dead one: deny-by-SCP where possible, watch the orphan, and capture evidence while the account still talks.'},

{id:'h5',type:'multi',summary:'Subscription already transferred — what survives?',
scenario:['Azure side of BP-2026-0417: pay-as-you-go subscription <code>bh-mtr-payg-02</code> was transferred to an external tenant five days ago. The transfer is confirmed. The SOC wants to know what visibility remains on the Bluepeak side.'],
artefacts:[{label:'Azure Activity Log — 2026-04-13',html:'<p><span class="lk">operation</span>=<span class="ls">Transfer Subscription</span> · <span class="lk">result</span>=<span class="ls">Succeeded</span> · <span class="lk">targetTenantId</span>=<span class="ls">f2c9-… (external)</span><br><span class="lk">precededBy</span>=<span class="lu">Global Admin role activated for m.reyes@bluepeak[.]example</span></p>'}],
question:'Select <b>all</b> signals that can still exist on the Bluepeak side.',
options:[
{t:'The transfer confirmation event in the tenant activity log',correct:true,why:'The move itself was logged before visibility ended.'},
{t:'A billing or email notice that the subscription left the tenant',correct:true,why:'Billing and notification systems sit outside the transferred resource’s logging.'},
{t:'The Global Admin role activation that preceded the transfer',correct:true,why:'Pre-transfer events stay in the victim tenant forever.'},
{t:'Deployment logs of the VMs the attacker created after the transfer',why:'Those VMs live in the owning tenant now — their logs follow the subscription.'},
{t:'Azure Firewall traffic logs for those post-transfer VMs',why:'Same story: the resources and their telemetry moved with the subscription.'}],
multiNote:'Three survive on the victim side. Post-transfer resource telemetry does not.',
hint:'Draw the timeline: everything before the transfer stays; everything the attacker does after lives on their side.',
explain:'<b>Defender view:</b> the survivor set is exactly three — the transfer event, the billing/notification traces, and the pre-transfer access chain (the Global Admin activation). <b>Attacker view:</b> that is the entire point of hijacking — compute used “without generating logs on the victim tenant”, as the ATT&amp;CK description says. Your compensating controls therefore live outside the transferred subscription: billing anomalies, tenant-level transfer policy, and the pre-transfer identity chain.'},

{id:'h6',type:'blank',summary:'The Peach Sandstorm chain — complete the report',
scenario:['Your CTI analyst drafts the real-world section of BP-2026-0417 using Microsoft Threat Intelligence reporting. Complete the chain.'],
text:'Microsoft Threat Intelligence reported that <code>Peach Sandstorm</code> used password <code>{0}</code> campaigns to reach a Global Administrator, then hijacked a pay-as-you-go <code>{1}</code> by transferring it out of the victim <code>{2}</code> — the same pattern as our case.',
bank:['spray','subscription','tenant','firewall','mainframe'],
correct:['spray','subscription','tenant'],
why:['The campaign’s signature access technique.','The Azure asset that was hijacked.','The boundary the subscription crossed.'],
hint:'The access move has a three-letter first word. The asset and the boundary are the two words you have been using all day.',
explain:'<b>Peach Sandstorm</b> (Microsoft Threat Intelligence, 2023) ran password-spray campaigns that ended at Global Administrator, followed by subscription hijacking — the victim tenant loses the subscription and the compute runs silent on the attacker side. The hunting guidance published for Microsoft Defender for Cloud Apps (Dor Edry) targets exactly this pattern. Your case writing links the observed chain to the published one — that is CTI value, not name-dropping.'},

{id:'h7',type:'qcm',summary:'SCP JSON — where is the bypass?',
scenario:['Post-incident review of the 02:11 leave examines why <code>scp-deny-leave</code> did not stop BreakGlass-2. The policy (as attached to the account’s OU at the time):'],
artefacts:[{label:'scp-deny-leave (JSON, annotated)',html:'<pre>{\n  "Version": "2012-10-17",\n  "Statement": [{\n    "Sid": "DenyLeaveOrg",\n    "Effect": "Deny",\n    "Action": "organizations:LeaveOrganization",\n    "Resource": "*",\n    "Condition": {\n      "StringNotEquals": {"aws:PrincipalTag/team": "pipeline"}\n    }\n  }]\n}</pre>'}],
question:'Which detail let a compromised <b>pipeline-tagged</b> role bypass the guardrail?',
options:[
{t:'The condition exempts every principal tagged team=pipeline from the deny',correct:true,why:'StringNotEquals inverts the deny for the tagged population — the exemption is the hole.'},
{t:'The Sid string is too short',why:'Sids are labels; they change nothing about enforcement.'},
{t:'Resource * is too wide',why:'For account-level APIs a wildcard resource is normal here.'},
{t:'Effect Deny is the wrong keyword',why:'Deny is exactly right for a guardrail.'}],
hint:'Read the Condition like an attacker: who is NOT denied?',
explain:'<b>M1054</b> works only when the SCP has no hole. <code>StringNotEquals</code> here means “deny unless the principal is tagged team=pipeline” — a standing exemption an attacker only has to inherit or wear. Hardening review of guardrail policies is part of the M1054 control design: every Condition is a second policy you must also defend.'},

{id:'h8',type:'multi',summary:'Tuning AN0442 through M&amp;A noise',
scenario:['Merger week: 12 legitimate <code>CreateAccount</code> calls across three days — all ticketed, business hours, principal <code>role/OrgOnboarding-bot</code>. Saturday 23:47: one <code>CreateAccount</code>, principal <code>user/tmp-ops-77</code> (created 6 hours earlier), no ticket. You are tuning the AN0442 alert logic.'],
question:'Which filter choices keep the true positive and drop the M&amp;A noise? <b>Select all.</b>',
options:[
{t:'Require a ticket reference or a known onboarding principal for suppression',correct:true,why:'Both benign dimensions are structural — the bot principal and the ticket — not situational.'},
{t:'Flag creations whose principal has no history and no ticket',correct:true,why:'tmp-ops-77 fails both tests at once — that is the signal shape.'},
{t:'Suppress all CreateAccount alerts during business hours',why:'Time-window suppression would have hidden nothing here — and it would hide a ticketed daytime attack.'},
{t:'Alert only when the call comes from the management account',why:'Both the bot and the rogue call run through organization-level privileges — the filter splits nothing.'}],
multiNote:'Two filters survive tuning review. The others either miss the attack or split nothing.',
hint:'A good filter keys on structural facts (principal identity, ticket linkage), not on clock time or on attributes shared by everyone.',
explain:'Detection engineering for T1666 lives or dies on baselines: the ATT&amp;CK analytic says “deviates from organizational baselines”, and the baseline here is <i>who</i> legitimately creates accounts and <i>with what paper trail</i>. Time-of-day suppression is the classic wrong lesson from noisy weeks — attackers read calendars too.'},

{id:'h9',type:'multi',summary:'The IaaS blind spot — what closes it?',
scenario:['Bluepeak’s EDR covers every VM. The 02:11 leave, the 04:00 move and the Saturday <code>CreateAccount</code> were all invisible to it. The CIO asks what actually closes the gap for hierarchy tampering.'],
question:'Select <b>all</b> actions that close the T1666-specific gap.',
options:[
{t:'Ship organization and tenant management events (CloudTrail org events, Azure Activity Log) into the SIEM',correct:true,why:'The telemetry for T1666 lives at the management plane, not on the VMs.'},
{t:'Implement the AN0442 correlation: role elevation followed by hierarchy modification',correct:true,why:'The analytic is designed for exactly this technique.'},
{t:'Install EDR on more VMs until coverage reaches 100%',why:'True and useful for endpoint techniques — but hierarchy API calls never touch a VM agent.'},
{t:'Add firewall rules blocking outbound 443 from the management account',why:'The calls are legitimate API traffic; blocking it breaks the cloud, not the attack.'}],
multiNote:'Two answers close the management-plane gap. The other two address a different layer.',
hint:'Ask where the evidence of each attack lived: on a VM, or in the provider’s own audit stream?',
explain:'<b>Defender view:</b> T1666 happens entirely on the management plane — the provider’s audit stream is the only witness, so shipping it and correlating it (elevation → modification) is the fix. <b>Attacker view:</b> the beauty of the technique is that a fleet of perfectly EDR-covered VMs sees nothing while their guardrails are removed from outside.'},

{id:'h10',type:'order',summary:'M1047 audit — rank the findings',
scenario:['Monthly M1047 hierarchy audit produced four findings. Rank them 1 (worst) to 4 (least severe) for the report.'],
items:['A pay-as-you-go subscription was transferred to an external tenant three days ago','A new AWS account not present in the CMDB sits directly under the org root','The management account holds five workloads','Two resource groups carry non-standard tags'],
hint:'Rank by how directly each finding enables or proves a T1666 outcome, and by how close to the top of the hierarchy it sits.',
explain:'Ranking logic: the <b>completed transfer</b> is a realised T1666 outcome (compute gone silent); the <b>rogue top-level account</b> is a live capability one step from use; <b>management-account workloads</b> degrade your future detection baseline; <b>tag drift</b> is hygiene. M1047’s own words justify the top ranks: audit “especially close to the top of the hierarchy”, and top-level accounts should hold no workloads.'},

{id:'h11',type:'match',summary:'D3FEND countermeasures for the aftermath',
scenario:['The architecture board asks which D3FEND countermeasures map to the two post-incident activities. Match them.'],
lefts:['Keeping a verified inventory of what should exist in the hierarchy','Putting the hierarchy back to its known-good shape after tampering'],
rights:['D3-CI — Configuration Inventory','D3-RC — Restore Configuration'],
correct:[0,1],
why:['The inventory is the reference that makes “unexpected” meaningful.','Restore is the corrective act once evidence is captured.'],
hint:'One is the reference picture, one is the repair action.',
explain:'The D3FEND mapping for T1666 lists <b>Configuration Inventory</b> and <b>Restore Configuration</b>. The inventory is what makes M1047 audits and DET0155 baselines possible — you cannot flag “unexpected” without a verified “expected”. Restore is corrective and comes last: restoring before evidence capture destroys the case and hides the entry path.'},

{id:'h12',type:'branch',summary:'One artefact, two chairs — red and blue',
scenario:['Same artefact as the 02:11 leave: BreakGlass-2 succeeded, guardrails gone, account <code>666666666666</code> outside the org. You will answer once as the adversary, once as the defender.'],
question:'Answer both steps. The final Check grades the pair.',
steps:[
{label:'STEP — Red chair',text:'You are the adversary: the account is free of SCPs. What is your next move to keep the defense impaired?',
options:[
{t:'Deploy compute from that account, outside the organization’s guardrails',correct:true,why:'Freedom from SCPs is only useful once something runs outside them.'},
{t:'Delete the organization’s management account',why:'Not possible — and loud even to attempt.'},
{t:'Rotate the victim’s MFA devices',why:'That is the victim’s action, not yours.'},
{t:'Email the CISO your demands',why:'Noise without value for this technique.'}]},
{label:'STEP — Blue chair',text:'You are the defender at 02:30. Which detection anchors the case first?',
options:[
{t:'The LeaveOrganization event itself, correlated with the role elevation that preceded it',correct:true,why:'The management-plane pair is the anchor — AN0442 exists for exactly this.'},
{t:'Antivirus verdicts on the workload VMs',why:'Nothing has landed on a VM yet; endpoint telemetry is silent by design here.'},
{t:'A port-scan alert from the perimeter',why:'No scanning is required for this technique.'},
{t:'The helpdesk satisfaction survey',why:'Noise.'}]}],
hint:'Red: what did the attacker buy with the leave? Blue: where is the only evidence of the purchase?',
explain:'The dual view in one breath: the adversary converts guardrail-freedom into unobserved compute; the defender anchors on the <b>management-plane event pair</b> — elevation, then hierarchy modification. This is why the ATT&amp;CK page’s detection strategy is built on organization APIs and not on endpoint telemetry.'},

{id:'h13',type:'qcm',summary:'One control, most directly',
scenario:['The board approves exactly one new control this quarter for T1666. The shortlist: (a) an SCP that denies <code>organizations:LeaveOrganization</code> for all principals, (b) a least-privilege review of every role (M1018), (c) a monthly cost review.'],
question:'Which single control <b>most directly</b> stops the LeaveOrganization move?',
options:[
{t:'The SCP denying organizations:LeaveOrganization for all principals',correct:true,why:'It forbids the API itself — the move fails regardless of who holds it.'},
{t:'The least-privilege review of every role (M1018)',why:'Valuable and defensible, but it shrinks the population instead of forbidding the move — and drifts back over time.'},
{t:'The monthly cost review',why:'Detects consequences weeks later; stops nothing.'},
{t:'A stronger password policy',why:'Unrelated to the organization API path.'}],
hint:'“Most directly” means the move fails even for the principal who already holds the right.',
explain:'<b>M1054</b> beats <b>M1018</b> on directness for this exact API: the SCP denies the call for <i>everyone</i>, including roles that legitimately hold the permission and stolen sessions that inherit it. M1018 remains essential — it reduces who can attempt the other moves — but when the board funds one control against <code>LeaveOrganization</code>, the deny-SCP is the answer.'},

{id:'h14',type:'terminal',summary:'Azure CLI — pull 48h of tenant activity, change nothing',
scenario:['Environment: bastion <code>bp-sec-jump</code>, Azure CLI authenticated to the Bluepeak tenant with Reader and Security Reader. No change window is open. Objective: surface subscription-creation and transfer events from the last 48 hours in the activity log. Nothing may be modified.'],
question:'Run the Azure CLI command that lists the last 48 hours of activity-log events, then press Check.',
prompt:'azuser@bp-sec-jump:~$',
simMatch:'az monitor activity-log list',
simLines:['[','  { "eventTimestamp": "2026-04-18T01:47:02Z", "operationName": { "value": "Microsoft.Subscription/createSubscription", "localizedValue": "Create Subscription" }, "caller": "tmp-ops-77" },','  { "eventTimestamp": "2026-04-17T22:15:40Z", "operationName": { "value": "Microsoft.Subscription/TransferSubscription", "localizedValue": "Transfer Subscription" }, "caller": "m.reyes@bluepeak[.]example" },','  { "eventTimestamp": "2026-04-16T19:02:11Z", "operationName": { "value": "Microsoft.Policy/policyAssignments/write", "localizedValue": "Assign policy" }, "caller": "platform-team" }',']'],
required:[{re:'(^|\\s)az(\\s|$)',label:'the az CLI program'},{re:'(^|\\s)monitor(\\s|$)',label:'the monitor service'},{re:'(^|\\s)activity-log(\\s|$)',label:'the activity-log component'},{re:'(^|\\s)list(\\s|$)',label:'the read-only list command'},{re:'--offset\\s+(48h|2d)',label:'--offset 48h (the requested time window)'}],
wrong:[{re:'az\\s+vm\\s',label:'a VM-scoped command',why:'Hierarchy events live in the activity log, not on VM objects.'},{re:'--caller',label:'--caller filtering',why:'You have no single caller to filter on — you want the window, not one identity.'}],
dangerous:[{re:'delete|purge|clear|remove',label:'a state-changing operation',why:'No change window is open; deleting policies, assignments or logs during an active case destroys evidence.'}],
canonical:'az monitor activity-log list --offset 48h',
parts:[{label:'az monitor activity-log list',why:'The read-only view of management-plane events for the tenant’s resources.'},{label:'--offset 48h',why:'The requested window — last two days, which covers the transfer and the creation.'},{label:'(optional --query)',why:'Filtering by operationName client-side is fine; the graded core is the windowed list.'}],
hint:'The Azure answer to “what happened at the management plane” is one service, one component, one read-only verb — plus the window.',
explain:'<code>az monitor activity-log list --offset 48h</code> is the Azure sibling of the CloudTrail lookup: a repeatable, read-only management-plane sweep. <b>Defender view:</b> the output shows the creation, the transfer and the (benign) policy assignment in one screen — exactly the artefact set AN0442 correlates. <b>Attacker view:</b> this command is why they transfer subscriptions out in the first place: once ownership moves, this list stops telling on them.'},

{id:'h15',type:'order',summary:'Escalation timeline for the transferred subscription',
scenario:['The <code>bh-mtr-payg-02</code> transfer is confirmed five days old. Order the escalation steps from first to last.'],
items:['Freeze and preserve the audit evidence','Notify the cloud platform owner and the CISO','Apply a targeted deny: SCP or policy blocking further movement of the affected accounts','Run a full DET0155 sweep for earlier hits across the last 90 days','Plan the hierarchy restore from known-good configuration'],
hint:'Preserve, tell, contain, widen, rebuild.',
explain:'The order encodes senior judgement: evidence before people (so the brief is factual), a <b>targeted</b> containment before broad sweeps (least aggressive that stops the bleeding), the 90-day sweep to size the intrusion, and restore last — after the picture is complete. Restore too early is the classic mistake: it resets the attacker’s clock and your evidence with it.'},

{id:'h16',type:'branch',summary:'Unknown initial access — follow the chain',
scenario:['Bridge, 02:40. Entry path for BP-2026-0417 is unknown. You direct the investigation in three dependent steps.'],
question:'Choose at each step; later steps depend on what you chose earlier. Final Check grades all three.',
steps:[
{label:'STEP 1 — First evidence pull',text:'Management plane is the crime scene. What do you pull first?',
options:[
{t:'The role-elevation history for BreakGlass-2 over the last 48 hours',correct:true,why:'The leave used BreakGlass-2; its elevation is the earliest visible link of the chain.'},
{t:'A memory dump of a workload VM',why:'The technique never touched a VM — you would burn hours on the wrong plane.'},
{t:'The email gateway quarantine',why:'Possible later, but the management plane is screaming and you have not read it yet.'},
{t:'The office badge logs',why:'Physical access is unrelated to an org API call.'}]},
{label:'STEP 2 — The elevation record',text:'The history shows: BreakGlass-2 assumed at 01:54, just-in-time request <b>denied</b> 40 minutes earlier, session opened anyway. What is your read?',
options:[
{t:'The elevation bypassed approval — treat the whole chain as hostile',correct:true,why:'A denied JIT followed by a live session is a control bypass, not an emergency procedure.'},
{t:'Approvals can lag; assume it was approved',why:'The record says denied. Assuming the opposite is how cases die.'},
{t:'Close it — break-glass is allowed to skip approval',why:'Break-glass skips <i>workflow</i>, not the requirement of a real emergency; 01:54 Saturday is unexplained.'},
{t:'Wait for the role owner to return from leave',why:'The window for evidence is now, not Monday.'}]},
{label:'STEP 3 — With that read',text:'Given a hostile, approval-bypassing elevation, what is the next move?',
options:[
{t:'Open the incident, contain BreakGlass-2, and alert on every hierarchy API call from it',correct:true,why:'Contain the weapon and watch the crime scene it used.'},
{t:'Patch the workload VMs first',why:'Patching is good hygiene, not the response to a management-plane bypass.'},
{t:'Rebuild the organization from scratch',why:'Disproportionate and evidence-destroying at this stage.'},
{t:'Do nothing until the weekly security meeting',why:'The attacker is mid-chain; waiting concedes the whole hierarchy.'}]}],
hint:'Step 1: where did the leave come from? Step 2: the JIT record contradicts the session. Step 3: contain the specific weapon.',
explain:'The chain teaches dependency: the elevation record reframes everything after it. A <b>denied</b> JIT followed by a live break-glass session is the conflict signal that upgrades triage to incident. <b>Defender view:</b> contain the role, alert on its hierarchy calls, keep the audit stream frozen. <b>Attacker view:</b> stolen break-glass is the master key to T1666 — which is why its usage must be rare, alerted, and reviewed.'},

{id:'h17',type:'multi',summary:'Proving the transfer direction from fields',
scenario:['Legal asks for the evidence that the subscription moved <b>from</b> Bluepeak <b>to</b> the external tenant — direction must be provable from log fields, not from narrative.'],
artefacts:[{label:'Azure Activity Log — transfer entry',html:'<p><span class="lk">operationName.value</span>=<span class="ls">Microsoft.Subscription/TransferSubscription</span><br><span class="lk">homeTenantId</span>=<span class="ls">bh-tenant (Bluepeak)</span> · <span class="lk">targetTenantId</span>=<span class="ls">f2c9-… (external)</span><br><span class="lk">caller</span>=<span class="lu">m.reyes@bluepeak[.]example (elevated)</span> · <span class="lk">result</span>=<span class="ls">Succeeded</span></p>'}],
question:'Select <b>all</b> field-based facts that prove direction.',
options:[
{t:'The event sits in the Bluepeak tenant’s log while targetTenantId is external',correct:true,why:'Source log plus external target equals outbound — that is the direction.'},
{t:'operationName is a transfer, not a creation or a deletion',correct:true,why:'The verb distinguishes moving an existing subscription from creating one.'},
{t:'The VM size referenced in the invoice is D-series',why:'Sizing is billing trivia with no directional value.'},
{t:'The invoice currency is EUR',why:'Currency has nothing to do with tenant direction.'}],
multiNote:'Two field facts carry the proof. The invoice details are noise.',
hint:'Direction lives in two fields: where the event is logged, and where the target points.',
explain:'Direction proof is boring and airtight: the event’s <b>home</b> tenant logs it, the <b>target</b> tenant is external, and the <b>verb</b> is a transfer. Courts, auditors and insurers accept field-level arguments, not stories — which is why the artefact panel exists exactly as labelled evidence.'}
]};

</script>
<script>
'use strict';
/* ============ T1666 dark exam engine (vanilla JS, no external requests) ============ */
var $=function(s){return document.querySelector(s);};
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmtT(sec){var m=Math.floor(sec/60),s=sec%60;return m+':'+(s<10?'0':'')+s;}
function minLabel(sec){return Math.round(sec/60)+' min';}
var META=EXAM.meta;
function creditLabel(c,N){ if(c>=1)return {cls:'fb-ok',ic:'✓',word:'CORRECT'}; if(c>0)return {cls:'fb-part',ic:'✓',word:'PARTIALLY CORRECT'}; return {cls:'fb-bad',ic:'✗',word:'INCORRECT'}; }

/* ---------------- global attempt state ---------------- */
var S={view:'intro',order:[],idx:0,credits:{},hinted:{},skipped:[],reviewMode:false,
  timer:{state:'RUNNING',remaining:0,prev:'RUNNING'},_int:null,
  pausedManualSec:0,pausedAutoSec:0,reportFired:false,username:''};

function setState(st){ if(S.timer.state===st)return; S.timer.prev=S.timer.state; S.timer.state=st; renderTop(); }
function startTicker(){ if(S._int)clearInterval(S._int); S._int=setInterval(tick,1000); }
function tick(){
  var t=S.timer;
  if(t.state==='RUNNING'){ t.remaining--; if(t.remaining<=0){t.remaining=0;renderTop();endByTimeout();return;} }
  else if(t.state==='PAUSED_MANUAL'){ S.pausedManualSec++; }
  else if(t.state==='PAUSED_AUTO_CHECK'){ S.pausedAutoSec++; }
  renderTop();
}
function endByTimeout(){ setState('ENDED'); if(S._int)clearInterval(S._int); openResults(true); }
function showVeil(on){ $('#pauseVeil').classList.toggle('hidden',!on); }

/* ---------------- score ---------------- */
function scoreExercise(H,W,N){ var c=(H-W)/N; if(c<0)c=0; if(c>1)c=1; return c; }
function liveScore(){
  var sum=0,cnt=0; for(var k in S.credits){ sum+=S.credits[k]; cnt++; }
  var pct=cnt>0?Math.round(sum/cnt*100):0;
  return {sum:sum,cnt:cnt,pct:pct};
}
function totalAnswerable(){ return S.order.length; }

/* ---------------- reporting + handshake ---------------- */
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  var o=location.origin||'';
  var realSite=o && o!=='null' && o.indexOf('file:')!==0; /* opened directly on file: -> same-origin target */
  var target=realSite?o:'/'; /* never '*' */
  try{
    parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,
      score:Math.round(creditSum),total:answeredCount,percent:percent,passed:percent>=META.passMark},target);
  }catch(e){/* opened directly — nothing to report to */}
}
window.addEventListener('message',function(ev){
  var d=ev.data; if(!d)return;
  if(d.type!=='CYBERPULSE_INIT'&&d.type!=='CYBERMASTERY_INIT')return;
  if(d.username)S.username=d.username;
  /* theme is always 'dark' by contract — the file is dark-only, nothing to switch */
});

/* ---------------- views ---------------- */
function showView(v){
  ['introView','examView','reviewView','resultsView'].forEach(function(id){
    $('#'+id).classList.toggle('hidden',id!==v);
  });
  window.scrollTo(0,0);
}

/* ---------------- top bar ---------------- */
function timerStateLabel(){
  var t=S.timer;
  if(t.state==='RUNNING')return {cls:'t-running',html:'<span class="tstate">▶ RUNNING</span>'};
  if(t.state==='PAUSED_MANUAL')return {cls:'t-paused',html:'<span class="tstate">⏸ PAUSED — manual (press Resume)</span>'};
  if(t.state==='PAUSED_AUTO_CHECK')return {cls:'t-paused',html:'<span class="tstate">⏸ PAUSED — reviewing feedback (resumes on Next)</span>'};
  return {cls:'t-ended',html:'<span class="tstate">■ ENDED</span>'};
}
function buildTop(){
  var row=el('div','tb-row');
  row.appendChild(el('span','tb-id',META.objId+' · '+META.objName));
  var sev=el('span','chip sev-badge','◆ '+META.sevName);
  sev.setAttribute('aria-label','Severity '+META.sevName);
  row.appendChild(sev);
  var cnt=el('span','chip','<span class="lbl">Exercise</span> <b id="tbCount">–</b>');
  row.appendChild(cnt);
  var tc=el('span','chip timer-chip','<span class="tval" id="tbTime">–:––</span> <span id="tbState"></span>');
  tc.setAttribute('aria-label','Timer and timer state');
  row.appendChild(tc);
  var sc=el('span','chip score-chip','<span class="lbl">Score</span> <span class="sval" id="tbScore">0.0 / 0</span> <span class="spct" id="tbPct">0%</span>');
  row.appendChild(sc);
  row.appendChild(el('span','spacer'));
  var hb=el('button','btn btn-warn','💡 Hint'); hb.id='tbHint'; hb.setAttribute('aria-label','Show one hint for this exercise (costs 10 percent of its credit)');
  hb.addEventListener('click',onHint); row.appendChild(hb);
  var pb=el('button','btn btn-pause','⏸ Pause'); pb.id='tbPause'; pb.setAttribute('aria-label','Manual pause — hides the exercise and stops the timer');
  pb.addEventListener('click',onPause); row.appendChild(pb);
  var sb=el('button','btn btn-ghost','⚠ Skip'); sb.id='tbSkip'; sb.setAttribute('aria-label','Skip this exercise — move it to the skipped pool');
  sb.addEventListener('click',onSkip); row.appendChild(sb);
  var bar=el('div','pbar','<div class="pbar-track"><div class="pbar-fill" id="pFill"></div></div>');
  $('#topbar').appendChild(row); $('#topbar').appendChild(bar);
}
function renderTop(){
  var tt=timerStateLabel();
  var chip=$('#topbar .timer-chip');
  if(chip){ chip.className='chip timer-chip '+tt.cls; $('#tbTime').textContent=fmtT(S.timer.remaining); $('#tbState').innerHTML=tt.html; }
  var c=$('#tbCount'); if(c)c.textContent=(S.idx+1)+' of '+totalAnswerable();
  var ls=liveScore();
  var s=$('#tbScore'); if(s)s.textContent=ls.sum.toFixed(1)+' / '+ls.cnt;
  var p=$('#tbPct'); if(p)p.textContent=ls.pct+'%';
  var f=$('#pFill'); if(f)f.style.width=Math.round(((S.idx)/Math.max(1,totalAnswerable()))*100)+'%';
  var sk=$('#tbSkip'); if(sk)sk.disabled=(S.timer.state==='ENDED')||!!(S.order[S.idx] in S.credits);
  var hb=$('#tbHint'); if(hb)hb.disabled=!!S.hinted[S.order[S.idx]]||(S.timer.state==='ENDED')||!!(S.order[S.idx] in S.credits);
}

/* ---------------- intro ---------------- */
function renderIntro(){
  var v=$('#introView'); v.innerHTML='';
  var hero=el('div','intro-hero');
  hero.appendChild(el('h1',null,META.objId+' — '+META.sevName+' practice exam'));
  hero.appendChild(el('p','tb-sub','<b>'+META.objId+' — '+META.objName+'</b> · MITRE ATT&CK Enterprise technique · Tactic: Defense Impairment (TA0112) · Platform: IaaS'));
  var facts=el('div','facts');
  function f(lbl,val){var x=el('span','fact','<span>'+lbl+'</span> <b>'+val+'</b>');facts.appendChild(x);}
  f('Exercises in this file:',META.questionCount);
  f('Estimated time:',minLabel(META.estimatedMinutes));
  f('Timer budget:',minLabel(META.timerSeconds));
  f('Pass mark:',META.passMark+'%');
  f('Severity:',META.sevName+' ◆');
  hero.appendChild(facts);
  v.appendChild(hero);

  var c1=el('div','card');
  c1.appendChild(el('h2',null,'<span class="ic">◈</span> What you will learn here'));
  c1.appendChild(el('div',null,EXAM.intro.learn));
  v.appendChild(c1);

  var c2=el('div','card');
  c2.appendChild(el('h2',null,'<span class="ic">◈</span> Keywords covered in this exam'));
  c2.appendChild(el('p','tb-sub','Every keyword below is exercised by the '+META.questionCount+' interactive tasks in this file.'));
  EXAM.intro.keywords.forEach(function(k){
    var t=el('div','kw-theme');
    t.appendChild(el('h3',null,k.theme));
    var ul=el('ul','kw-items');
    k.items.forEach(function(i){ul.appendChild(el('li',null,i));});
    t.appendChild(ul); c2.appendChild(t);
  });
  v.appendChild(c2);

  var c3=el('div','card');
  c3.appendChild(el('h2',null,'<span class="ic">◈</span> How this exam works'));
  c3.appendChild(el('div',null,EXAM.intro.how));
  var start=el('button','btn btn-go','▶ Start the exam');
  start.style.cssText='margin-top:16px;min-width:220px;min-height:48px;font-weight:700;';
  start.setAttribute('aria-label','Start the exam');
  start.addEventListener('click',startExam);
  c3.appendChild(start);
  v.appendChild(c3);
}

/* ---------------- exam flow ---------------- */
function startExam(){
  resetAttempt();
  showView('examView');
  S.idx=0;
  setState('RUNNING');
  startTicker();
  renderEx();
}
function resetAttempt(){
  S.order=shuffle(EXAM.exercises.map(function(e,i){return i;}));
  S.credits={}; S.hinted={}; S.skipped=[]; S.reviewMode=false; S.reportFired=false;
  S.pausedManualSec=0; S.pausedAutoSec=0;
  S.timer.state='RUNNING'; S.timer.prev='RUNNING'; S.timer.remaining=META.timerSeconds;
  if(S._int)clearInterval(S._int);
  $('#exMain').innerHTML='';
}
function retake(){ startExam(); }

function onHint(){
  var id=S.order[S.idx]; if(id==null||S.hinted[id])return;
  var ex=EXAM.exercises[id]; if(!ex)return;
  S.hinted[id]=true; renderTop();
  var hp=$('#hintPanel');
  if(hp){ hp.classList.remove('hidden'); hp.scrollIntoView({block:'nearest'}); return; }
  var p=el('div','syntax-panel','<h4>💡 Hint — costs 10% of this exercise&rsquo;s credit</h4><div>'+ex.hint+'</div>');
  p.id='hintPanel';
  var ans=$('#ansBlock .block-body'); if(ans)ans.parentNode.insertBefore(p,ans.nextSibling);
}
function onPause(){
  var t=S.timer;
  if(t.state==='RUNNING'||t.state==='PAUSED_AUTO_CHECK'){ setState('PAUSED_MANUAL'); showVeil(true); }
  else if(t.state==='PAUSED_MANUAL'){ setState(t.prev==='PAUSED_AUTO_CHECK'?'PAUSED_AUTO_CHECK':'RUNNING'); showVeil(false); }
}
function onSkip(){
  var id=S.order[S.idx]; if(id==null)return;
  if(!(id in S.credits)&&S.skipped.indexOf(id)<0)S.skipped.push(id);
  if(S.idx>=totalAnswerable()-1){ showReview(); if(S.timer.state!=='RUNNING'&&S.timer.state!=='ENDED')setState('RUNNING'); }
  else { S.idx++; if(S.timer.state!=='RUNNING'&&S.timer.state!=='ENDED')setState('RUNNING'); renderEx(); }
}
function onCheck(){
  if(S.timer.state==='RUNNING'){ setState('PAUSED_AUTO_CHECK'); } /* first action: auto-pause */
  var id=S.order[S.idx], ex=EXAM.exercises[id];
  if(id in S.credits)return;
  var g=gradeCurrent(ex);
  var c=scoreExercise(g.H,g.W,g.N);
  if(S.hinted[id])c=Math.max(0,c-0.10);
  S.credits[id]=c;
  renderFeedback(ex,g,c);
  renderTop();
}
function onNext(){
  if(S.timer.state==='PAUSED_AUTO_CHECK')setState('RUNNING');
  if(S.reviewMode){ S.reviewMode=false; showReview(); return; }
  if(S.idx>=totalAnswerable()-1){ showReview(); }
  else { S.idx++; renderEx(); }
}
function onFinalSubmit(){
  if(S.timer.state!=='ENDED')setState('ENDED');
  if(S._int)clearInterval(S._int);
  openResults(false);
}

/* ---------------- exercise rendering ---------------- */
function artefactHtml(a,i){
  return '<div class="artefact"><span class="artefact-head">ARTEFACT '+(i+1)+' — '+a.label+'</span><div class="artefact-body">'+a.html+'</div></div>';
}
function renderEx(){
  var id=S.order[S.idx], ex=EXAM.exercises[id];
  var main=$('#exMain'); main.innerHTML='';
  renderTop();
  var rvTag=S.reviewMode?'<span class="chip" style="border-color:var(--state-skipped);color:var(--state-skipped)">⚠ Reviewing a skipped exercise</span>':'';
  var top=el('div',null,rvTag);
  top.style.marginBottom='12px'; main.appendChild(top);

  /* SCENARIO block */
  var sc=el('section','block block-scenario'); sc.id='scenBlock';
  var head=el('div','block-head','<span class="bh-ic">◈</span> SCENARIO');
  var col=el('button','collapser','▾ Collapse');
  col.setAttribute('aria-label','Collapse or expand the scenario panel');
  head.appendChild(col); sc.appendChild(head);
  var sum=el('div','scen-sum','📌 '+ex.summary);
  sc.appendChild(sum);
  var body=el('div','block-body scenario');
  var html='';
  (ex.scenario||[]).forEach(function(p){html+='<p>'+p+'</p>';});
  if(ex.viewer){ html+=viewerHtml(ex.viewer); }
  (ex.artefacts||[]).forEach(function(a,i){ html+=artefactHtml(a,i); });
  body.innerHTML=html;
  sc.appendChild(body);
  main.appendChild(sc);
  wireViewer(body);
  col.addEventListener('click',function(){
    var open=body.style.display!=='none';
    body.style.display=open?'none':'block';
    sum.style.display=open?'block':'none';
    col.textContent=open?'▸ Expand':'▾ Collapse';
  });

  /* QUESTION block */
  var qb=el('section','block block-question');
  qb.appendChild(el('div','block-head','<span class="bh-ic">◈</span> QUESTION'));
  qb.appendChild(el('div','block-body',ex.question));
  main.appendChild(qb);

  /* YOUR ANSWER block */
  var ab=el('section','block block-answer'); ab.id='ansBlock';
  ab.appendChild(el('div','block-head','<span class="bh-ic">◈</span> YOUR ANSWER'));
  var abody=el('div','block-body'); abody.id='ansBody'; ab.appendChild(abody);
  main.appendChild(ab);

  buildWidget(ex,abody);

  /* nav */
  var nav=el('div','exnav'); nav.id='exNav';
  var chk=el('button','btn btn-go','✓ Check'); chk.id='btnCheck';
  chk.setAttribute('aria-label','Check this exercise — the timer pauses for unlimited feedback review');
  chk.addEventListener('click',onCheck); nav.appendChild(chk);
  if(ex.type==='branch'){ chk.disabled=true; } /* multi-step: Check unlocks only after the last step is answered */
  nav.appendChild(el('span','spacer'));
  var nx=el('button','btn btn-primary hidden','Next ▶'); nx.id='btnNext';
  nx.setAttribute('aria-label','Next exercise — the timer resumes');
  nx.addEventListener('click',onNext); nav.appendChild(nx);
  var fin=el('button','btn btn-primary hidden','⏹ Final Submit'); fin.id='btnFinal';
  fin.setAttribute('aria-label','Finish the exam and open the results screen');
  fin.addEventListener('click',onFinalSubmit); nav.appendChild(fin);
  main.appendChild(nav);
  var fn=el('p','footer-note','Press Check to submit and see feedback. The timer pauses automatically while you read the feedback and resumes only when you press Next.');
  main.appendChild(fn);
}

/* ---------------- widget builders ---------------- */
var WIDGETS={};
function buildWidget(ex,host){
  var w=WIDGETS[ex.type];
  if(!w){ host.innerHTML='<p class="fbitem st-bad">Unknown exercise type.</p>'; return; }
  var inst=w.build(ex,host);
  host._grade=inst.grade;
}
/* --- option buttons shared by qcm / multi --- */
function optButton(o,idx,multi){
  var b=el('button','opt','<span class="ol">'+String.fromCharCode(65+idx)+'.</span><span class="ot">'+o.t+'</span>');
  b.type='button'; b._sel=false; b._o=o; b._idx=idx;
  b.setAttribute('aria-pressed','false');
  b.addEventListener('click',function(){
    if(b.disabled)return;
    if(multi){ b._sel=!b._sel; b.classList.toggle('sel',b._sel); b.setAttribute('aria-pressed',b._sel?'true':'false'); }
    else {
      var host=b.parentNode;
      Array.prototype.forEach.call(host.children,function(c){c._sel=false;c.classList.remove('sel');c.setAttribute('aria-pressed','false');});
      b._sel=true; b.classList.add('sel'); b.setAttribute('aria-pressed','true');
    }
  });
  return b;
}
function lockOptions(host){
  Array.prototype.forEach.call(host.querySelectorAll('button.opt'),function(b){b.disabled=true;});
}
function optGrade(items){
  /* items: [{o, sel}] -> partial credit over correct options */
  var N=0,H=0,W=0,out=[];
  items.forEach(function(it){
    if(it.o.correct)N++;
    if(it.o.correct&&it.sel)H++;
    if(!it.o.correct&&it.sel)W++;
  });
  items.forEach(function(it){
    if(it.o.correct&&it.sel)out.push({t:it.plain,st:'ok',why:it.o.why||'Part of the correct answer.'});
    else if(!it.o.correct&&it.sel)out.push({t:it.plain,st:'bad',why:it.o.why||'Not part of the correct answer.'});
    else if(it.o.correct&&!it.sel)out.push({t:it.plain,st:'miss',why:it.o.why||'You missed this correct item.'});
  });
  if(N===0)N=1;
  return {H:H,W:W,N:N,items:out};
}
function plainOf(o){ var d=el('div',null,o.t); return d.textContent.replace(/\s+/g,' ').trim(); }

WIDGETS.qcm={build:function(ex,host){
  var box=el('div','opts');
  shuffle(ex.options.map(function(o,i){return {o:o,i:i};})).forEach(function(p){
    box.appendChild(optButton(p.o,p.i,false));
  });
  host.appendChild(box);
  var hint=el('p','dnd-hint','Choose one answer, then press Check.');
  host.appendChild(hint);
  return {grade:function(){
    var sel=null;
    Array.prototype.forEach.call(box.children,function(b){ if(b._sel)sel=b; });
    lockOptions(box);
    var correct=ex.options.filter(function(o){return o.correct;})[0];
    var ok=sel&&sel._o.correct;
    var items=[{t:'Correct answer: '+plainOf(correct),st:ok?'ok':'bad',why:correct.why}];
    return {H:ok?1:0,W:(!ok)?1:0,N:1,items:items};
  }};
}};

WIDGETS.multi={build:function(ex,host){
  var box=el('div','opts');
  shuffle(ex.options.map(function(o,i){return {o:o,i:i};})).forEach(function(p){
    box.appendChild(optButton(p.o,p.i,true));
  });
  host.appendChild(box);

WIDGETS.order={build:function(ex,host){
  var list=el('div','ordr');
  var cur=shuffle(ex.items.map(function(t,i){return {t:t,i:i};}));
  function draw(){
    list.innerHTML='';
    cur.forEach(function(it,pos){
      var row=el('div','ordr-item');
      row.draggable=true; row._pos=pos;
      row.appendChild(el('span','opos',(pos+1)+'.'));
      row.appendChild(el('span','otxt',it.t));
      var btns=el('span','ordr-btns');
      var up=el('button',null,'↑'); up.type='button'; up.setAttribute('aria-label','Move item '+(pos+1)+' up');
      up.addEventListener('click',function(){ if(pos>0){var t=cur[pos-1];cur[pos-1]=cur[pos];cur[pos]=t;draw();} });
      var dn=el('button',null,'↓'); dn.type='button'; dn.setAttribute('aria-label','Move item '+(pos+1)+' down');
      dn.addEventListener('click',function(){ if(pos<cur.length-1){var t=cur[pos+1];cur[pos+1]=cur[pos];cur[pos]=t;draw();} });
      btns.appendChild(up); btns.appendChild(dn); row.appendChild(btns);
      row.addEventListener('dragstart',function(ev){ S._dragRow=pos; try{ev.dataTransfer.setData('text/plain','row');}catch(e){} });
      row.addEventListener('dragover',function(ev){ ev.preventDefault(); });
      row.addEventListener('drop',function(ev){ ev.preventDefault();
        var from=S._dragRow; if(from==null||from===pos)return;
        var m=cur.splice(from,1)[0]; cur.splice(pos,0,m); S._dragRow=null; draw();
      });
      list.appendChild(row);
    });
  }
  draw();
  host.appendChild(list);
  host.appendChild(el('p','dnd-hint','Put the items in the correct order: use ↑ / ↓ or drag the rows, then press Check.'));
  return {grade:function(){
    var H=0,W=0,items=[];
    cur.forEach(function(it,pos){
      var ok=it.i===pos;
      if(ok)H++; else W++;
      items.push({t:'Position '+(pos+1)+': '+it.t,st:ok?'ok':'bad',why:ok?'Correct position.':'Expected here: '+ex.items[pos]});
    });
    ex.items.forEach(function(t,pos){
      if(cur[pos].i!==pos){ /* already covered by position rows */ }
    });
    return {H:H,W:W,N:ex.items.length,items:items};
  }};
}};

WIDGETS.drag={build:function(ex,host){
  var wrap=el('div','dnd-wrap');
  var bank=el('div','dnd-bank','<h4 style="margin:0 0 6px;font-size:.9em;color:var(--text-secondary)">Item bank</h4>');
  var zones=el('div','dnd-zones');
  var buckets=[];
  ex.buckets.forEach(function(b,bi){
    var z=el('div','dnd-bucket','<h4>⬛ '+b+'</h4>');
    z._bi=bi; zones.appendChild(z); buckets.push(z);
  });
  var picked=null;
  function unassign(it){ if(it._bi!=null){ buckets[it._bi].removeChild(it); it._bi=null; bank.appendChild(it); it.classList.remove('picked'); var a=it.querySelector('.asg'); if(a)a.remove(); } }
  function assign(it,bi){ unassign(it); it._bi=bi; buckets[bi].appendChild(it); it.appendChild(el('span','asg','→ '+ex.buckets[bi])); }
  ex.items.forEach(function(t){
    var it=el('div','dnd-item',t);
    it._bi=null; it._t=t; it.tabIndex=0; it.setAttribute('role','button');
    it.setAttribute('aria-label','Draggable item: '+t+'. Click to pick, then click a zone.');
    function pick(){ if(picked===it){picked.classList.remove('picked');picked=null;return;} if(picked)picked.classList.remove('picked'); picked=it; it.classList.add('picked'); }
    it.addEventListener('click',function(){ if(!it.disabled)pick(); });
    it.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pick();} });
    it.addEventListener('pointerdown',function(ev){
      if(it.disabled)return;
      it.classList.add('dragging'); pick();
      function move(e){
        buckets.forEach(function(z){ z.classList.toggle('over',pointIn(e,z)); });
      }
      function up(e){
        document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
        it.classList.remove('dragging');
        var zi=-1; buckets.forEach(function(z,i){ if(pointIn(e,z))zi=i; });
        buckets.forEach(function(z){ z.classList.remove('over'); });
        if(zi>=0)assign(it,zi);
      }
      document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
    });
    bank.appendChild(it);
  });
  function pointIn(ev,node){ var r=node.getBoundingClientRect(); return ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom; }
  buckets.forEach(function(z){
    z.addEventListener('click',function(){ if(picked){ assign(picked,z._bi); picked.classList.remove('picked'); picked=null; } });
  });
  wrap.appendChild(bank); wrap.appendChild(zones); host.appendChild(wrap);
  host.appendChild(el('p','dnd-hint','Drag each item into the right zone — or click the item, then click the zone. Click an item again to return it to the bank.'));
  return {grade:function(){
    var H=0,W=0,M=0,items=[];
    Array.prototype.forEach.call(bank.querySelectorAll('.dnd-item'),function(it){
      if(it._bi==null){ items.push({t:it._t,st:'miss',why:'Left in the bank. Belongs to: '+ex.buckets[ex.assign[ex.items.indexOf(it._t)]]}); M++; }
    });
    buckets.forEach(function(z,bi){
      Array.prototype.forEach.call(z.querySelectorAll('.dnd-item'),function(it){
        var ok=ex.assign[ex.items.indexOf(it._t)]===bi;
        if(ok)H++; else W++;
        items.push({t:it._t,st:ok?'ok':'bad',why:ok?'Correct zone.':'Placed in “'+ex.buckets[bi]+'”. Belongs in “'+ex.buckets[ex.assign[ex.items.indexOf(it._t)]]+'”.'});
      });
    });
    Array.prototype.forEach.call(bank.querySelectorAll('.dnd-item'),function(it){it.disabled=true;});
    return {H:H,W:W,N:ex.items.length,items:items};
  }};
}};

WIDGETS.terminal={build:function(ex,host){
  if(ex.timerNote){ var tn=el('div','timer-note','⏱ '+ex.timerNote); host.appendChild(tn); }
  if(ex.syntaxPanel){
    var sp=el('div','syntax-panel','<h4>Syntax reminder</h4>'+ex.syntaxPanel);
    host.appendChild(sp);
  }
  var term=el('div','term');
  term.innerHTML='<div class="term-head"><span class="term-dot"></span><span>'+ (ex.termTitle||'audit shell — simulation only, nothing is really executed') +'</span></div>'+
    '<div class="term-scroll"><div class="term-line lm">'+(ex.shellIntro||'Type your command and press Enter.')+'</div></div>';
  var inrow=el('div','term-in');
  inrow.innerHTML='<span class="pr">'+ex.prompt+'</span>';
  var inp=el('input'); inp.type='text'; inp.setAttribute('aria-label','Terminal input'); inp.autocomplete='off'; inp.spellcheck=false;
  inrow.appendChild(inp); term.appendChild(inrow);
  host.appendChild(term);
  var scroll=term.querySelector('.term-scroll');
  var lastCmd='';
  function norm(c){ return c.replace(/\s+/g,' ').trim(); }
  function run(){
    var v=inp.value; if(!v.trim())return;
    lastCmd=norm(v);
    var line=el('div','term-line'); line.innerHTML='<span class="lm">'+ex.prompt+'</span> '+lastCmd.replace(/</g,'&lt;');
    scroll.appendChild(line);
    var out;
    if(ex.simMatch&&new RegExp(ex.simMatch,'i').test(lastCmd.toLowerCase())) out=ex.simLines;
    else out=['zsh: only read-only audit commands are available in this simulator.'];
    out.forEach(function(o){ scroll.appendChild(el('div','term-line lm',o)); });
    scroll.scrollTop=scroll.scrollHeight;
    inp.value='';
  }
  inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter')run(); });
  var runBtn=el('button','btn','Run ▸'); runBtn.type='button';
  runBtn.style.minHeight='44px'; runBtn.addEventListener('click',run);
  inrow.appendChild(runBtn);
  host.appendChild(el('p','dnd-hint','Run the command you judge correct, then press Check. Your last command is graded.'));
  return {grade:function(){
    inp.disabled=true; runBtn.disabled=true;
    var cmd=(lastCmd||'').toLowerCase().replace(/\s+/g,' ').trim();
    var items=[],dangerHit=null;
    (ex.dangerous||[]).forEach(function(d){ if(new RegExp(d.re,'i').test(cmd))dangerHit=d; });
    var H=0,W=0;
    if(!cmd){ return {H:0,W:0,N:ex.required.length,items:[{t:'No command was run',st:'bad',why:'Type a command in the shell, then press Check.'}],danger:null}; }
    ex.required.forEach(function(r){
      if(new RegExp(r.re,'i').test(cmd)){ H++; items.push({t:'✓ element — '+r.label,st:'ok',why:'Present in your command.'}); }
      else { items.push({t:'○ element — '+r.label,st:'miss',why:'Missing from your command.'}); }
    });
    (ex.wrong||[]).forEach(function(w){
      if(new RegExp(w.re,'i').test(cmd)){ W++; items.push({t:'✗ element — '+w.label,st:'bad',why:w.why||'This element does not belong here.'}); }
    });
    if(dangerHit){ items.unshift({t:'✗ DANGEROUS — NEAR MISS: '+dangerHit.label,st:'bad',why:dangerHit.why}); }
    return {H:H,W:W,N:ex.required.length,items:items,danger:dangerHit};
  }};
}};

function openResults(timeout){
  setState('ENDED'); if(S._int)clearInterval(S._int); showVeil(false);
  var v=$('#resultsView'); v.innerHTML='';
  var ls=liveScore();
  var answered=ls.cnt, sum=ls.sum;
  var percent=answered>0?Math.round(sum/answered*100):0;
  var passed=percent>=META.passMark;
  var full=0,part=0,partSum=0,bad=0;
  for(var k in S.credits){ var c=S.credits[k]; if(c>=1)full++; else if(c>0){part++;partSum+=c;} else bad++; }
  var skipped=S.order.length-answered;
  var hero=el('div','res-hero '+(passed?'pass':'fail'));
  hero.appendChild(el('h1',null,META.objId+' — '+META.sevName+' — results'));
  hero.appendChild(el('div','res-big '+(passed?'':''),percent+'%'));
  hero.appendChild(el('p','res-line','✓ '+(passed?'PASS':'✗ FAIL')+' — pass mark is '+META.passMark+'%. Score computed only over answered exercises ('+answered+' of '+S.order.length+').'));
  if(S.username)hero.appendChild(el('p','res-line','Candidate: '+S.username));
  if(timeout)hero.appendChild(el('p','res-line','⏱ The timer ran out. Exercises never answered were excluded from the score.'));
  v.appendChild(hero);
  var grid=el('div','res-grid');
  function cell(cls,n,lbl){ grid.appendChild(el('div','res-cell '+cls,'<div class="rn">'+n+'</div><div class="rl">'+lbl+'</div>')); }
  cell('c-ok',full,'✓ Fully correct');
  cell('c-part',part,'✓ Partially correct'+(part>0?' · avg '+(partSum/part).toFixed(2):''));
  cell('c-bad',bad,'✗ Fully incorrect');
  cell('c-skip',skipped,'⚠ Skipped — excluded');
  v.appendChild(grid);
  var tg=el('div','time-grid');
  function tcell(l,val){ tg.appendChild(el('div','time-cell',l+' <b>'+val+'</b>')); }
  tcell('Time left on the clock:',fmtT(S.timer.remaining));
  tcell('Time paused manually:',fmtT(S.pausedManualSec));
  tcell('Time paused for feedback review:',fmtT(S.pausedAutoSec));
  v.appendChild(tg);
  var ret=el('button','btn btn-go','↻ Retake Exam');
  ret.style.cssText='margin-top:18px;min-width:220px;min-height:48px;font-weight:700;';
  ret.setAttribute('aria-label','Retake the exam — questions and answers are reshuffled');
  ret.addEventListener('click',retake);
  v.appendChild(ret);
  v.appendChild(el('p','footer-note',passed?'✓ PASS — your result was reported to the site (once for this attempt).':'✗ FAIL — retake the exam. On retake, the exercise order and answer choices are shuffled again.'));
  showView('resultsView');
  if(!S.reportFired){ S.reportFired=true; reportScore(sum,answered); }
}

/* ---------------- init ---------------- */
document.body.classList.add('sev-'+META.sevKey);
$('#veilResume').addEventListener('click',onPause);
buildTop();
renderIntro();
showView('introView');

</script>
