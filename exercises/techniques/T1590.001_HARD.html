<style>
:root{

  --state-skipped:#a9b4d0;
  --state-paused:#9d7bff;

  --sev-medium:#ffb454;

  --tint-blue:rgba(90,169,255,.10);
  --tint-blue-strong:rgba(90,169,255,.25);
  --tint-blue-weak:rgba(90,169,255,.12);
  --tint-blue-faint:rgba(90,169,255,.06);
  --tint-amber:rgba(255,180,84,.08);
  --tint-amber-strong:rgba(255,180,84,.20);
  --tint-amber-weak:rgba(255,180,84,.09);
  --tint-amber-badge:rgba(255,180,84,.12);
  --tint-green:rgba(87,211,140,.12);
  --tint-green-strong:rgba(87,211,140,.22);
  --tint-green-weak:rgba(87,211,140,.10);
  --tint-green-faint:rgba(87,211,140,.07);
  --tint-green-hero:rgba(87,211,140,.14);
  --tint-orange-badge:rgba(255,138,61,.12);
  --tint-red:rgba(255,107,107,.08);
  --tint-red-faint:rgba(255,107,107,.07);
  --tint-red-badge:rgba(255,107,107,.12);
  --tint-red-hero:rgba(255,107,107,.12);
  --tint-purple:rgba(157,123,255,.07);
  --ring-green:0 0 0 2px rgba(87,211,140,.35);
  --btn-primary-text:#eaf3ff;
  --btn-green-text:#e9fff3;
  --btn-amber-text:#fff3e2;
  --tok-num:#7fd8ff;
  --tok-flag:#9d7bff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-ui);font-size:16px;line-height:1.55}
body{min-height:100vh}
#app{max-width:1060px;margin:0 auto;padding:14px 16px 90px}
h1,h2,h3{line-height:1.25}
button{font-family:var(--font-ui)}
a{color:var(--accent-blue)}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-mono)}
.hidden{display:none !important}

/* ---------- progress bar ---------- */
#pbarwrap{position:sticky;top:0;z-index:60;height:6px;background:var(--bg-surface-2);border-bottom:1px solid var(--border)}
#pbar{height:100%;width:0%;background:linear-gradient(90deg,var(--sev),var(--accent-blue));transition:width .4s ease;position:relative;overflow:hidden}
#pbar::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 0%,var(--sheen) 50%,transparent 100%);transform:translateX(-100%);animation:sheen 3.2s linear infinite}
@keyframes sheen{0%{transform:translateX(-100%)}60%,100%{transform:translateX(220%)}}

/* ---------- cards & blocks ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:18px 20px;margin:14px 0}
.blk{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);margin:16px 0;overflow:hidden}
.blk-head{display:flex;align-items:center;gap:10px;padding:10px 16px;font-weight:700;letter-spacing:.06em;font-size:14px;border-bottom:1px solid var(--border)}
.blk-head .blk-ico{font-size:16px}
.blk-body{padding:16px}
.blk.scenario .blk-head{color:var(--accent-blue);border-left:4px solid var(--accent-blue)}
.blk.scenario .blk-body{background:linear-gradient(180deg,var(--tint-blue-faint),transparent 60%),var(--bg-surface)}
.blk.question .blk-head{color:var(--accent-amber);border-left:4px solid var(--accent-amber)}
.blk.question .blk-body{background:linear-gradient(180deg,var(--tint-amber-weak),transparent 60%),var(--bg-surface)}
.blk.answer .blk-head{color:var(--accent-green);border-left:4px solid var(--accent-green)}
.blk.question .qtext{font-weight:700;font-size:17px;color:var(--text-primary)}
.artefact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;margin:10px 0;overflow:hidden}
.artefact .art-label{display:block;padding:7px 12px 0 12px;font-family:var(--font-mono);font-size:12.5px;color:var(--accent-blue);letter-spacing:.05em}
.artefact .art-body{padding:8px 12px 12px 12px}
.artefact p{margin:4px 0;color:var(--text-primary)}
pre.mono,pre.codeblock{font-family:var(--font-mono);font-size:14.5px;color:var(--text-mono);background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:6px 0;overflow-x:auto;white-space:pre;line-height:1.5}
pre.codeblock .copied{color:var(--state-correct);font-family:var(--font-ui);font-size:13px;margin-left:10px}
.tok-ip{color:var(--accent-amber)}
.tok-num{color:var(--tok-num)}
.tok-str{color:var(--accent-green)}
.tok-kw{color:var(--accent-blue);font-weight:600}
.tok-flag{color:var(--tok-flag)}
.copywrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- top bar (exam header) ---------- */
.topbar{position:sticky;top:6px;z-index:50;background:var(--topbar-bg);border:1px solid var(--border);border-bottom:2px solid var(--border);border-radius:10px;padding:10px 14px;margin:10px 0 18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;box-shadow:var(--shadow-lg)}
.tb-item{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text-secondary);min-height:34px}
.tb-item strong{color:var(--text-primary);font-size:15px}
.tb-score strong{font-size:16px}
.timerbox{font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--text-primary);letter-spacing:.04em;min-width:74px;text-align:center;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:4px 10px}
.tstate{font-size:12.5px;font-weight:600;letter-spacing:.03em;border-radius:6px;padding:3px 8px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-secondary);max-width:320px}
.tstate.running{color:var(--state-correct)}
.tstate.paused{color:var(--state-paused)}
.tstate.ended{color:var(--state-incorrect)}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;letter-spacing:.07em;border-radius:999px;padding:4px 12px;border:1px solid}
.badge.sev-easy{color:var(--sev-easy);border-color:var(--sev-easy);background:var(--tint-green)}
.badge.sev-medium{color:var(--sev-medium);border-color:var(--sev-medium);background:var(--tint-amber-badge)}
.badge.sev-hard{color:var(--sev-hard);border-color:var(--sev-hard);background:var(--tint-orange-badge)}
.badge.sev-extreme{color:var(--sev-extreme);border-color:var(--sev-extreme);background:var(--tint-red-badge)}
.statechip{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;letter-spacing:.04em}
.st-correct{color:var(--state-correct)}
.st-partial{color:var(--state-partial)}
.st-incorrect{color:var(--state-incorrect)}
.st-skipped{color:var(--state-skipped)}
.st-paused{color:var(--state-paused)}
.userchip{font-size:13px;color:var(--text-secondary);border:1px dashed var(--border);border-radius:999px;padding:3px 10px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:9px 18px;border-radius:8px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-primary);font-size:15px;font-weight:600;cursor:pointer;transition:filter .15s ease,transform .05s ease}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--tint-blue-strong),var(--tint-blue-weak));border-color:var(--accent-blue);color:var(--btn-primary-text)}
.btn.green{background:linear-gradient(180deg,var(--tint-green-strong),var(--tint-green-weak));border-color:var(--accent-green);color:var(--btn-green-text)}
.btn.amber{background:linear-gradient(180deg,var(--tint-amber-strong),var(--tint-amber-weak));border-color:var(--accent-amber);color:var(--btn-amber-text)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--state-incorrect);color:var(--state-incorrect);background:var(--tint-red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}

/* ---------- options ---------- */
.optlist{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);cursor:pointer;min-height:44px;transition:background .15s ease,border-color .15s ease;position:relative}
.opt:hover{background:var(--surface-hover)}
.opt input{width:19px;height:19px;margin-top:2px;accent-color:var(--accent-blue);flex:none}
.opt .opt-key{font-family:var(--font-mono);font-weight:700;color:var(--accent-blue);flex:none;min-width:26px}
.opt .opt-text{color:var(--text-primary);font-size:15.5px}
.opt.selected{border-color:var(--accent-blue);border-left:4px solid var(--accent-blue);background:var(--tint-blue)}
.opt.selected::after{content:"SELECTED";position:absolute;right:10px;top:8px;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--accent-blue)}
.opt.state-correct{border-color:var(--state-correct);border-left:4px solid var(--state-correct)}
.opt.state-wrong{border-color:var(--state-incorrect);border-left:4px solid var(--state-incorrect)}
.opt .opt-why{display:block;width:100%;margin-top:6px;font-size:13.5px;color:var(--text-secondary)}
.locked{pointer-events:none}
.locked input,.locked select,.locked button.answerctl{opacity:.85}

/* ---------- matching / triage selects ---------- */
.matchrow,.trirrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);margin:8px 0}
.matchrow .m-left,.trirrow .t-alert{flex:1 1 260px;color:var(--text-primary);font-size:15px}
.matchrow .m-left .mono,.trirrow .mono{font-size:14px}
select.anssel{min-height:44px;background:var(--bg-page);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14.5px;max-width:340px}
.trirrow .t-detail{flex:1 1 100%;font-size:13.5px;color:var(--text-secondary)}
.rowstate{font-size:12.5px;font-weight:700;letter-spacing:.05em;min-width:110px;text-align:right}

/* ---------- drag & drop ---------- */
.dndwrap{display:flex;flex-wrap:wrap;gap:14px}
.dndbank{flex:1 1 240px;min-width:220px;background:var(--bg-surface-2);border:1px dashed var(--border);border-radius:8px;padding:10px}
.dndbank h4,.zones h4{margin:2px 0 8px 2px;font-size:13px;letter-spacing:.06em;color:var(--text-secondary);font-weight:700}
.zones{flex:2 1 320px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.zone{background:var(--bg-surface-2);border:1px dashed var(--accent-blue);border-radius:8px;min-height:72px;padding:10px;cursor:pointer;transition:border-color .15s ease,background .15s ease}
.zone h5{margin:0 0 8px 0;font-size:13.5px;color:var(--accent-blue);font-weight:700}
.zone.dragover{background:var(--tint-blue);border-style:solid}
.zone.state-correct{border-color:var(--state-correct)}
.zone.state-wrong{border-color:var(--state-incorrect)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-hover);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:14px;padding:9px 12px;margin:4px;cursor:grab;min-height:44px}
.chip.armed{border-color:var(--accent-green);box-shadow:var(--ring-green)}
.chip .chip-armprompt{font-size:11px;color:var(--accent-green);font-weight:700;letter-spacing:.06em}

/* ---------- ordering ---------- */
.seq{list-style:none;margin:0;padding:0}
.seq li{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:8px 0;min-height:52px}
.seq .seq-pos{font-family:var(--font-mono);font-weight:700;color:var(--accent-amber);min-width:30px;text-align:center}
.seq .seq-text{flex:1;font-size:15px;color:var(--text-primary)}
.seq .seq-btns{display:flex;gap:6px}
.seq .seq-btns button{min-width:44px;min-height:44px}
.seq li.state-correct{border-color:var(--state-correct)}
.seq li.state-wrong{border-color:var(--state-incorrect)}

/* ---------- fill in the blank ---------- */
.blanks{font-size:16px;color:var(--text-primary);line-height:2.1}
.blank-in{font-family:var(--font-mono);font-size:14.5px;background:var(--bg-surface-2);border:1px solid var(--border);border-bottom:2px solid var(--accent-green);border-radius:6px;color:var(--text-mono);padding:9px 10px;width:200px;min-height:44px}
.blank-in.state-correct{border-color:var(--state-correct)}
.blank-in.state-wrong{border-color:var(--state-incorrect)}

/* ---------- terminal ---------- */
.shell{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;font-family:var(--font-mono);font-size:14.5px;color:var(--text-mono);padding:12px 14px}
.shell .scroll{max-height:230px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.shell .promptline{display:flex;align-items:center;gap:8px;margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
.shell .prompt{color:var(--accent-green);font-weight:700;white-space:nowrap}
.shell input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text-mono);font-family:var(--font-mono);font-size:14.5px;padding:12px 4px;min-width:200px;min-height:44px}
.shell input:focus{outline:none;border-bottom-color:var(--accent-green)}
.shell .out-err{color:var(--state-incorrect)}
.shell .out-ok{color:var(--text-mono)}
.syntaxpanel{background:var(--bg-surface-2);border:1px solid var(--border);border-left:4px solid var(--accent-blue);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:14px}
.syntaxpanel .sp-title{font-weight:700;color:var(--accent-blue);font-size:13px;letter-spacing:.06em}

/* ---------- log viewer ---------- */
.logtool{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.logtool .logbar{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.logtool .logbar .lg-title{font-size:12.5px;font-family:var(--font-mono);color:var(--accent-blue);letter-spacing:.05em}
.logtool input{flex:1;min-width:180px;min-height:44px;background:var(--bg-page);border:1px solid var(--border);border-radius:6px;color:var(--text-mono);font-family:var(--font-mono);font-size:13.5px;padding:8px 10px}
.loglines{max-height:300px;overflow:auto;padding:8px 10px;font-family:var(--font-mono);font-size:13.5px;line-height:1.65;color:var(--text-mono)}
.loglines .ln{white-space:pre-wrap;word-break:break-word}
.loglines .lnmark{color:var(--accent-amber)}

/* ---------- branching ---------- */
.step{border:1px solid var(--border);border-left:4px solid var(--accent-blue);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin:12px 0}
.step .step-tag{display:inline-block;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--accent-blue);letter-spacing:.08em;margin-bottom:6px}
.step .step-text{color:var(--text-primary);font-size:15.5px;margin-bottom:10px}
.outcome{border-left:4px solid var(--accent-green);background:var(--tint-green-faint);border-radius:6px;padding:8px 12px;margin:10px 0 2px 0;font-size:14.5px;color:var(--text-primary)}
.outcome.bad{border-left-color:var(--state-incorrect);background:var(--tint-red-faint)}

/* ---------- hint & feedback ---------- */
.hintpanel{border:1px solid var(--border);border-left:4px solid var(--accent-amber);background:var(--tint-amber);border-radius:8px;padding:10px 14px;margin:12px 0;color:var(--text-primary);font-size:15px}
.hintpanel .hint-tag{font-weight:700;color:var(--accent-amber);font-size:12.5px;letter-spacing:.07em;display:block;margin-bottom:4px}
.feedback{border:1px solid var(--border);border-radius:10px;margin:16px 0 4px 0;overflow:hidden;background:var(--bg-surface)}
.feedback .fb-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700}
.feedback.f-correct .fb-head{border-left:5px solid var(--state-correct)}
.feedback.f-partial .fb-head{border-left:5px solid var(--state-partial)}
.feedback.f-incorrect .fb-head{border-left:5px solid var(--state-incorrect)}
.feedback .fb-body{padding:14px 16px}
.fb-correct-answer{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:15px}
.fb-correct-answer .fb-ca-tag{font-weight:700;color:var(--accent-green);font-size:12.5px;letter-spacing:.06em;display:block;margin-bottom:4px}
.fb-items{list-style:none;margin:10px 0 0 0;padding:0}
.fb-items li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--border);border-radius:8px;margin:7px 0;background:var(--bg-surface-2);font-size:14.5px}
.fb-items .fi-ico{font-weight:700;flex:none;font-size:15px}
.fb-items .fi-note{display:block;color:var(--text-secondary);font-size:13.5px;margin-top:3px}
.studypointer{margin-top:12px;font-size:14.5px;color:var(--text-secondary);border-top:1px dashed var(--border);padding-top:10px}
.creditline{font-size:14px;color:var(--text-secondary)}

/* ---------- intro screen ---------- */
.intro-hero{background:linear-gradient(135deg,var(--tint-blue),var(--tint-purple)),var(--bg-surface);border:1px solid var(--border);border-radius:12px;padding:22px 24px;margin:16px 0}
.intro-hero h1{margin:0 0 6px 0;font-size:24px}
.intro-hero .objline{color:var(--text-secondary);font-size:15px;margin:2px 0}
.factrow{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:14px}
.fact{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--text-secondary)}
.fact b{color:var(--text-primary)}
.themegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:8px}
.themebox{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.themebox h4{margin:0 0 8px 0;color:var(--accent-blue);font-size:13.5px;letter-spacing:.05em;text-transform:uppercase}
.themebox ul{margin:0;padding-left:18px;color:var(--text-primary);font-size:14.5px}
.themebox li{margin:4px 0}
.rulelist{margin:8px 0 0 0;padding-left:0;list-style:none}
.rulelist li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);color:var(--text-primary);font-size:15px;align-items:flex-start}
.rulelist li:last-child{border-bottom:none}
.rulelist .rl-ico{flex:none;font-weight:700}
.typechips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px 0}
.typechip{font-size:13px;font-weight:600;color:var(--text-secondary);border:1px solid var(--border);border-radius:999px;padding:5px 12px;background:var(--bg-surface-2)}
.kw-note{color:var(--text-secondary);font-size:13.5px;margin-top:8px}

/* ---------- review & results ---------- */
.reviewlist{list-style:none;margin:0;padding:0}
.reviewlist li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin:8px 0;background:var(--bg-surface-2);flex-wrap:wrap}
.reviewlist .rv-title{flex:1 1 260px;color:var(--text-primary);font-size:15px}
.resultgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0}
.rcard{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.rcard .rc-num{font-size:26px;font-weight:800}
.rcard .rc-lab{font-size:13.5px;color:var(--text-secondary);margin-top:4px;letter-spacing:.03em}
.cert{border-radius:12px;padding:20px 22px;margin:16px 0;border:1px solid}
.cert.pass{border-color:var(--state-correct);background:linear-gradient(135deg,var(--tint-green-hero),transparent)}
.cert.fail{border-color:var(--state-incorrect);background:linear-gradient(135deg,var(--tint-red-hero),transparent)}
.cert h2{margin:0 0 6px 0;font-size:22px}
.cert p{margin:6px 0;color:var(--text-primary)}
.pauselog{color:var(--text-secondary);font-size:14px;border-top:1px dashed var(--border);margin-top:12px;padding-top:10px}

/* ---------- manual pause overlay ---------- */
#pauseoverlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.pausecard{max-width:460px;text-align:center;background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:12px;padding:28px}
.pausecard .pico{font-size:38px;color:var(--state-paused)}
.pausecard h2{color:var(--state-paused);margin:8px 0}
.pausecard p{color:var(--text-secondary)}

.term-clock{font-family:var(--font-mono);font-size:13px;color:var(--accent-amber);font-weight:700}
@media (max-width:720px){
  #app{padding:10px 10px 80px}
  .card,.blk-body{padding:13px}
  .topbar{gap:8px}
  .tstate{max-width:100%}
  pre.mono,pre.codeblock,.loglines{font-size:13px}
  .blank-in{width:150px}
}
@media (prefers-reduced-motion:reduce){
  #pbar::after{animation:none}
  *{transition:none !important;animation:none !important}
}
</style>

<script type="application/json" id="cm-exam-data">{"object":{"id":"T1590.001","name":"Gather Victim Network Information: Domain Properties","type":"Sub-Technique","parent":"T1590","tactic":"Reconnaissance (TA0043)","platforms":"PRE"},"learn":["This object is a sub-technique of T1590, Gather Victim Network Information. It describes attackers collecting facts about the domains a company owns: who registered them, when they expire, which name servers they use, and the contact details attached to them. Think of it as reading the company's public ID card — the one the internet hands out automatically.","Imagine you are a CTI analyst at an energy company called Aldercrest Energy. One morning a brand-new domain appears: 'aldercreast-energy[.]com' — one letter different. It was registered three days ago, behind a privacy service. Someone is preparing to pretend to be your company. Spotting that early is exactly the skill this exam trains.","You will meet this object as a CTI analyst (profiling attacker infrastructure), as a brand-protection or GRC analyst (deciding which company data should be public at all), as a SOC analyst (reading WHOIS/RDAP records and tenant API logs), and as a detection engineer (building analytics like DET0847/AN1979). Tools: WHOIS and RDAP lookups, certificate transparency logs, brand-monitoring feeds, and — for cloud tenants — public Microsoft endpoints called GetUserRealm and autodiscover.","The ATT&CK page gives this sub-technique real procedure examples: the AADInternals PowerShell tool (S0677) gathers a tenant's domain information through public Microsoft APIs, and the Sandworm Team group (G0034) researched an official parliament's internet domain before its 2019 attack. The page lists one mitigation, M1056 Pre-compromise: you cannot really prevent someone reading public records, so you minimise what is there to read. Detection is difficult — high volume, high false positives — so attention turns to later stages such as Initial Access."],"kw":["whois","registrar","registrant","creation","expiry","name-server","zone","dig","soa","ns","grep","head","sort","uniq","autodiscover","getuserrealm"],"themes":[{"name":"Recon objective & lifecycle","concepts":["feeds Phishing (T1566) initial access","feeds Acquire Infrastructure (T1583)"]},{"name":"Domain property types","concepts":["registrar and registrant admin data","creation and expiry dates"]},{"name":"Collection methods","concepts":["WHOIS / RDAP lookups","Phishing for Information (T1598)","public cloud API endpoints","autodiscover (Office 365)"]},{"name":"Attacker value","concepts":["craft convincing phishing with real contacts","register lookalike/typosquat domains","validate tenant domain names"]},{"name":"Procedure examples (real)","concepts":["S0677 AADInternals — tenant domain info via public Microsoft APIs","G0034 Sandworm Team — recon of the Parliament of Georgia's domain before the 2019 attack"]},{"name":"Mitigations & control limits","concepts":["M1056 Pre-compromise","review public contact/admin data","monitor for lookalike registrations","registrar lock and privacy services"]},{"name":"Data sources & telemetry","concepts":["brand-monitoring alerts on new registrations","tenant-side API request logs","certificate transparency logs"]},{"name":"Detection logic & analytics","concepts":["high false-positive rate","surges of GetUserRealm/autodiscover requests"]},{"name":"Framework mappings & real work","concepts":["ISO/IEC 27001 A.5.23 cloud services security","IR evidence handling"]}],"exercises":[{"id":"T1590-001-H01","type":"logview","title":"Which registration is hostile?","summary":"Two fresh registrations and a certificate log — separate the hostile one.","concepts":["register lookalike/typosquat domains","creation and expiry dates","certificate transparency logs"],"perspective":"defender","tags":["trap:alarming-but-benign","trap:benign-but-alarming"],"logTitle":"brand feed + CT log (48h)","filterPlaceholder":"filter lines...","log":["D1  aldercrest-energy-jobs[.]com   created 2d ago  registrant: Aldercrest HR (via privacy svc)  MX: provider-dns[.]net  ticket CHG-3120","D1  CT: cert issued for careers.aldercrest-energy-jobs[.]com (Let's Encrypt)","D2  aldercreast-energysupport[.]com created 2d ago  registrant: privacy svc only  MX: mailbox-host[.]example  no ticket","D2  CT: cert issued for mail.aldercreast-energysupport[.]com (Let's Encrypt)"],"options":[{"t":"D2 — no ticket, unrelated mail host, and a mail certificate issued for it","correct":true,"why":"Correct — mail infrastructure plus a mail-server certificate on an unticketed brand imitation is hostile arming."},{"t":"D1 — privacy service registrants are always hostile","correct":false,"why":"D1 is the organisation's own ticketed careers domain — privacy there is routine practice."},{"t":"D1 — Let's Encrypt certificates indicate an attack","correct":false,"why":"Free certificates are the default everywhere; on D1 they match the ticketed campaign."},{"t":"D2 — the two-day age alone decides it","correct":false,"why":"Age matters, but the decisive evidence is the unticketed mail setup — D1 shares the age."}],"question":"Which registration goes to the takedown queue, and why?","hint":"One has a ticket and the org's own registrant behind it; the other has neither — and is arming mail.","explain":"D1 is the alarming-but-benign case: fresh, privacy-hidden, yet ticketed and owned. D2 is the benign-looking-but-alarming case: quiet, privacy-only, but arming mail (cert for mail.<domain>). Evidence chains decide, not single properties.","study":"Correlating registration records with certificate transparency arming signals.","scenario":[{"label":"ARTEFACT 1 — brand feed + CT log (48h)","kind":"text","text":"You are reviewing this export in the SOC log viewer. Two fresh registrations and a certificate log — separate the hostile one. Use the filter box to narrow the lines before answering."}]},{"id":"T1590-001-H02","type":"mcq","title":"Respond to an armed lookalike","summary":"The least aggressive action that actually reduces the risk.","concepts":["monitor for lookalike registrations","registrar lock and privacy services","IR evidence handling"],"perspective":"defender","tags":["trap:least-aggressive"],"scenario":[{"label":"ARTEFACT 1 — Bridge note","kind":"text","text":"Confirmed: aldercreast-energysupport[.]com is armed and sending mail. Options on the table: (a) takedown filing with evidence, (b) block the hosting provider's entire ASN, (c) publish the lookalike's full WHOIS on social media."}],"question":"Which option is correct?","options":[{"t":"(a) — takedown filing with the evidence bundle","correct":true,"why":"Correct — evidence-based takedown targets exactly the hostile asset with no collateral damage."},{"t":"(b) — block the hosting provider's entire ASN","correct":false,"why":"Thousands of legitimate tenants share that ASN — massive collateral for one domain."},{"t":"(c) — publicise the WHOIS record","correct":false,"why":"Public shaming tips the actor, achieves nothing technical, and may expose registrant data you should not spread."},{"t":"None — wait for the registrar's annual review","correct":false,"why":"Active phishing needs the takedown path now; waiting is not a control."}],"hint":"The right option removes the hostile asset and nothing else.","explain":"Least-aggressive-that-works is the evidence-backed takedown. ASN blocks and publicity stunts are the traps: one breaks partners, the other warns the attacker.","study":"Evidence packages for registrar abuse reports."},{"id":"T1590-001-H03","type":"multi","title":"Corroborate the lookalike threat","summary":"Which three signals, together, justify escalation?","concepts":["register lookalike/typosquat domains","surges of GetUserRealm/autodiscover requests","certificate transparency logs","brand-monitoring alerts on new registrations"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Signal shelf","kind":"text","text":"Six candidate signals for the escalation memo."}],"question":"Select the three signals that genuinely corroborate an active lookalike threat.","options":[{"t":"Brand-imitating domain registered 3 days ago","correct":true,"why":"Correct — the foundation signal from the registration feed."},{"t":"Mail certificate issued for a subdomain of the lookalike","correct":true,"why":"Correct — CT logs show the lookalike is arming to send or receive mail."},{"t":"autodiscover lookups referencing the lookalike from an external host","correct":true,"why":"Correct — tenant-facing probes for the lookalike mean it is being wired into mail clients."},{"t":"The organisation's own domain has WHOIS privacy enabled","correct":false,"why":"Your own privacy setting is hygiene, not a threat signal."},{"t":"Marketing renewed a campaign domain last quarter","correct":false,"why":"A ticketed renewal — routine, however it looks in a feed."},{"t":"A colleague complains the cafeteria soup is cold","correct":false,"why":"Noise, however heartfelt."}],"hint":"Two signals must show the lookalike exists AND is arming; one shows it reaching toward your tenant.","explain":"Existence (fresh registration) + arming (mail cert) + reach (autodiscover references) escalate the case. Your own privacy settings and ticketed renewals are the near-misses.","study":"Building an escalation-grade signal set for lookalike threats."},{"id":"T1590-001-H04","type":"match","title":"Match the page's examples","summary":"The two procedure examples plus two collection methods.","concepts":["S0677 AADInternals — tenant domain info via public Microsoft APIs","G0034 Sandworm Team — recon of the Parliament of Georgia's domain before the 2019 attack","WHOIS / RDAP lookups","autodiscover (Office 365)"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Reference card","kind":"text","text":"Four items straight from the T1590.001 page."}],"question":"Match each item to what it is.","left":[{"t":"S0677 AADInternals","match":0,"why":"The page's tooling example for tenant-domain gathering."},{"t":"G0034 Sandworm Team","match":1,"why":"The page's group example: pre-attack domain recon (Georgia, 2019)."},{"t":"WHOIS / RDAP","match":2,"why":"The registry lookup pair that exposes registration properties."},{"t":"autodiscover","match":3,"why":"A public Office 365 endpoint exposing mail configuration."}],"right":[{"t":"PowerShell tool gathering tenant domains via public APIs","why":"The page's S0677 description, verbatim."},{"t":"Group that reconnoitred a parliament's domain pre-attack","why":"The page's G0034 description, verbatim."},{"t":"Public registry lookups for registration data","why":"WHOIS/RDAP expose registrar, dates, contacts, name servers."},{"t":"Public cloud endpoint revealing mail setup","why":"autodiscover exposes the tenant's mail infrastructure."}],"hint":"Two are examples (a tool and a group); two are collection methods.","explain":"Knowing which items are page examples versus collection methods keeps your CTI citations accurate — the HARD-level habit this match drills.","study":"The procedure table and collection-method sentence on the T1590.001 page."},{"id":"T1590-001-H05","type":"terminal","title":"Date and registrar, nothing else","summary":"Objective and environment only — build the two-line extract.","concepts":["WHOIS / RDAP lookups","creation and expiry dates","registrar and registrant admin data"],"perspective":"attacker","tags":[],"skill":"registration-evidence-pipeline","scenario":[{"label":"ARTEFACT 1 — Tasking (authorised lab)","kind":"text","text":"Objective: for the lookalike domain aldercreast-energy[.]com, print only the lines showing when it was created and which registrar runs it. Environment: Linux box with whois and standard tools. Output must contain nothing else."}],"question":"Type the command that prints exactly those lines.","cmd":{"prompt":"recon-lab:~$","canonical":"whois aldercreast-energy[.]com | grep -iE \"creation|registrar\"","nearMiss":"whois aldercreast-energy[.]com | grep -iE \"creation|registrar\" > evidence.txt","outputs":[{"re":"whois\\s+aldercreast-energy\\[.\\]com\\s*\\|\\s*grep\\s+-i?e?\\s*[\\\"']?creation\\|registrar[\\\"']?","lines":["   Creation Date: 2026-10-19T04:41:00Z","   Registrar: BulkRegister Co"]}],"unknown":"command not recognised — whois plus a filtered pipe answers this tasking.","elements":[{"re":"\\bwhois\\b","label":"Uses whois","why":"Registration data lives in the registry lookup."},{"re":"aldercreast-energy\\[.\\]com","label":"Targets the lookalike (misspelled) domain","why":"The tasking is about the lookalike, not the real brand."},{"re":"\\|","label":"Pipes into the filter","why":"The full record must be reduced to two lines."},{"re":"\\bgrep\\b","label":"Uses grep","why":"The standard line filter."},{"re":"creation\\|registrar|registrar\\|creation","label":"Matches BOTH fields","why":"Two lines were tasked: creation date and registrar."}],"forbidden":[{"re":"\\bdig\\b|\\baxfr\\b","label":"a DNS-based lookup","why":"DNS answers host/zone questions, not registration facts — the wrong tool class."},{"re":">\\s*\\S+|\\brm\\b","label":"writing or deleting files","why":"Unneeded state changes in a read-only tasking."}]},"hint":"Two fields, one pipe: fetch the record, then keep only the lines whose keywords you choose. Mind which domain — it is the lookalike.","explain":"'whois <lookalike> | grep -iE \"creation|registrar\"' yields exactly the tasked evidence lines. The near-misses reach for DNS tools (wrong data class) or forget the alternation and return one line only.","study":"Building precise evidence extracts from WHOIS records."},{"id":"T1590-001-H06","type":"dnd","title":"Sort the recon artefacts","summary":"Four artefacts — tenant enumeration, registry recon, legit, internal.","concepts":["surges of GetUserRealm/autodiscover requests","WHOIS / RDAP records","tenant-side API request logs","active DNS queries vs registry reads"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Case tray","kind":"text","text":"Columns: TENANT ENUMERATION / REGISTRY RECON / LEGITIMATE TRAFFIC / INTERNAL TELEMETRY."}],"question":"Drag each artefact to its column.","zones":[{"name":"TENANT ENUMERATION","accepts":[0],"why":"A burst of autodiscover probes for many random mailbox names is enumeration."},{"name":"REGISTRY RECON","accepts":[1],"why":"Reading WHOIS of a brand-adjacent domain is registry recon."},{"name":"LEGITIMATE TRAFFIC","accepts":[2],"why":"Your own mail gateway's routine autodiscover use is legitimate."},{"name":"INTERNAL TELEMETRY","accepts":[3],"why":"Tenant sign-in logs are the victim-side view of API activity."}],"bank":[{"t":"External IP: autodiscover probes for 300 random names in 6 min","whyMiss":"Random-name bursts = enumeration."},{"t":"whois aldercreast-energy[.]com from a VPS","whyMiss":"A registry read of the lookalike = registry recon."},{"t":"Outlook clients autodiscovering their own tenant each morning","whyMiss":"Expected client behaviour — legitimate."},{"t":"Tenant sign-in log extract for the same window","whyMiss":"The victim-side record = internal telemetry."}],"hint":"Ask per artefact: who is asking, about what, and from where?","explain":"Separating enumeration from legitimate client behaviour is the daily HARD-level judgement on tenant APIs — and the tenant-side logs are where you verify it.","study":"Distinguishing client autodiscover noise from hostile enumeration."},{"id":"T1590-001-H07","type":"fib","title":"Write the timeline line","summary":"Two blanks tie the registration to the campaign.","concepts":["creation and expiry dates","feeds Phishing (T1566) initial access"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — Report line","kind":"text","text":"Draft: 'The lookalike was registered on {b0}, three days before the first {b1} wave referencing it.' (Use the exact date from the record.)"}],"question":"Fill the two blanks of the report line.","template":"The lookalike was registered on {b0}, three days before the first {b1} wave referencing it.","blanks":[{"accept":["2026-10-19"],"why":"The record's creation date — the anchor of the finding.","whyMiss":"Use the creation date exactly as recorded, not the campaign date."},{"accept":["phishing","phish","campaign"],"why":"The waves referencing the domain were phishing.","whyMiss":"The follow-on activity was phishing, not a product launch."}],"hint":"Blank one comes straight from the registration record; blank two names the wave.","explain":"Findings bind artefacts: the creation date anchors the lookalike to the phishing timeline. Regulators and registrars both act on exactly this kind of line.","study":"Writing date-anchored findings for takedown evidence."},{"id":"T1590-001-H08","type":"order","title":"Order the lookalike lifecycle","summary":"Five steps from reading properties to harvesting replies.","concepts":["craft convincing phishing with real contacts","register lookalike/typosquat domains","validate tenant domain names","feeds Phishing (T1566) initial access","Phishing for Information (T1598)","feeds Acquire Infrastructure (T1583)"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Lifecycle cards (shuffled)","kind":"text","text":"Cards: 'read WHOIS contacts and formats' · 'validate the real tenant via public APIs' · 'register the lookalike' · 'obtain a mail certificate and send lures' · 'harvest replies and credentials'."}],"question":"Order the attacker's five steps.","sequence":["Read WHOIS contacts and formats","Validate the real tenant via public APIs","Register the lookalike","Obtain a mail certificate and send lures","Harvest replies and credentials"],"orderWhy":["Contacts and formats are the template — everything copies reality.","Tenant validation fixes the platform look the lures must match.","Registration follows research, not precedes it.","Arming (certificate, mail) enables the send.","Harvesting is the payoff the whole chain built toward."],"hint":"Research, validate, register, arm, harvest.","explain":"The lifecycle shows why each property matters downstream: formats shape lures (harvesting contacts can also happen through Phishing for Information, T1598), tenant checks shape their look, and registering the lookalike is Acquire Infrastructure (T1583) fed by recon. Interdiction works best early — at registration.","study":"The full lookalike lifecycle and its interdiction points."},{"id":"T1590-001-H09","type":"logview","title":"Spot the tenant enumeration","summary":"One external IP, many names — pick the line pattern that proves it.","concepts":["surges of GetUserRealm/autodiscover requests","tenant-side API request logs","high false-positive rate"],"perspective":"defender","tags":["trap:benign-but-alarming"],"logTitle":"tenant API gateway log (04:00-04:12)","filterPlaceholder":"filter requests...","log":["04:01:02  198[.]51[.]100[.]9  GET  /autodiscover/autodiscover.json?Email=a.smith@aldercrest-energy[.]com  401","04:01:04  198[.]51[.]100[.]9  GET  /autodiscover/autodiscover.json?Email=b.jones@aldercrest-energy[.]com  401","04:01:09  198[.]51[.]100[.]9  GET  /autodiscover/autodiscover.json?Email=hr.payroll@aldercrest-energy[.]com  401","04:03:30  198[.]51[.]100[.]9  GET  /autodiscover/autodiscover.json?Email=finance.team@aldercrest-energy[.]com  200","04:03:31  10[.]44[.]2[.]15   GET  /autodiscover/autodiscover.json?Email=c.diaz@aldercrest-energy[.]com  200  (internal client)"],"options":[{"t":"One external IP probing many guessed names (401s) and landing on 200 for value targets","correct":true,"why":"Correct — guessed-name bursts from one source, then success on HR/finance, is enumeration with a target list."},{"t":"The internal client's single 200 response","correct":false,"why":"A known internal client validating its own mailbox is baseline — the near-miss."},{"t":"The 401 status codes by themselves","correct":false,"why":"A 401 alone is routine; the pattern (source, names, order) is the evidence."},{"t":"The timestamp spread across twelve minutes","correct":false,"why":"Timing matters only as part of the source-and-name pattern."}],"question":"Which observation proves hostile tenant enumeration?","hint":"Compare sources and name patterns — one client is inside and normal; the other is outside and guessing.","explain":"External single-source guessing (401s) plus targeted 200s on high-value mailboxes is enumeration. The internal 200 is the benign-but-alarming near-miss that keeps the queue honest.","study":"Reading tenant API logs for enumeration patterns.","scenario":[{"label":"ARTEFACT 1 — tenant API gateway log (04:00-04:12)","kind":"text","text":"You are reviewing this export in the SOC log viewer. One external IP, many names — pick the line pattern that proves it. Use the filter box to narrow the lines before answering."}]},{"id":"T1590-001-H10","type":"mcq","title":"Resolve the campaign conflict","summary":"Marketing claims the lookalike — the register disagrees. Which wins?","concepts":["conflicting evidence","brand-monitoring alerts on new registrations","register lookalike/typosquat domains"],"perspective":"defender","tags":["trap:conflicting-signals"],"scenario":[{"label":"ARTEFACT 1 — Two claims","kind":"text","text":"Marketing: 'That's our new campaign domain, we registered it.' The register: aldercreast-energysupport[.]com created 3 days ago, registrant a privacy service, no ticket, MX at an unknown host, and marketing's own campaign list does not contain it."}],"question":"Which reading is correct?","options":[{"t":"The register wins — no ticket, hidden registrant, and mail infrastructure marketing cannot explain","correct":true,"why":"Correct — a verbal claim without a ticket or matching MX is not authorisation; the artefacts say hostile."},{"t":"Marketing's verbal claim wins — humans beat records","correct":false,"why":"Claims are easy; records are checkable. The claim fails every artefact test."},{"t":"Both — treat it as owned but still file a takedown","correct":false,"why":"Contradictory handling: you do not takedown your own domain; resolve first."},{"t":"Neither — delete the domain from monitoring entirely","correct":false,"why":"Conflict is a reason to investigate, not to go blind."}],"hint":"Ask what each side can evidence: a ticket and MX, or just words.","explain":"Conflicting signals resolve to verifiable artefacts: tickets, registrants, MX. Marketing's claim fails all three — the correct handling is to confirm with the campaign owner in writing while treating the domain as hostile in the queue.","study":"Resolving ownership disputes with registration evidence."},{"id":"T1590-001-H11","type":"terminal","title":"Extract the enumeration evidence","summary":"Show the external autodiscover probes from the gateway log.","concepts":["surges of GetUserRealm/autodiscover requests","tenant-side API request logs","IR evidence handling"],"perspective":"defender","tags":["trap:real-cost"],"skill":"tenant-log-extraction","scenario":[{"label":"ARTEFACT 1 — Environment","kind":"text","text":"You are on the API gateway host (Linux, nginx). Objective: print the first 50 log lines mentioning autodiscover for the incident bundle. Rules: read-only; the log is evidence; do not restart or truncate anything."}],"question":"Type the command that prints those 50 lines without altering anything.","cmd":{"prompt":"ir@gw01:~$","canonical":"grep -i \"autodiscover\" /var/log/nginx/tenant-api.log | head -50","nearMiss":"grep -i \"autodiscover\" /var/log/nginx/tenant-api.log > /var/log/nginx/tenant-api.log","outputs":[{"re":"grep\\s+-i\\s*[\\\"']?autodiscover[\\\"']?\\s+/var/log/nginx/tenant-api\\.log\\s*\\|\\s*head\\s+-?50","lines":["04:01:02 198[.]51[.]100[.]9 GET /autodiscover/autodiscover.json?Email=a.smith@... 401","04:01:04 198[.]51[.]100[.]9 GET /autodiscover/autodiscover.json?Email=b.jones@... 401","04:03:30 198[.]51[.]100[.]9 GET /autodiscover/autodiscover.json?Email=finance.team@... 200"]}],"unknown":"no matches — check the pattern and the log path.","elements":[{"re":"\\bgrep\\b","label":"grep (read-only)","why":"The evidence-safe search verb."},{"re":"-i","label":"Case-insensitive flag","why":"Log casing varies; -i catches all spellings."},{"re":"autodiscover","label":"The autodiscover pattern","why":"The tasked endpoint name."},{"re":"/var/log/nginx/tenant-api\\.log","label":"The evidence log path","why":"The gateway's access log for tenant APIs."},{"re":"\\|","label":"The pipe","why":"Feeds matches into the limiter."},{"re":"head\\s+-?50|head\\s+-n\\s*50","label":"head -50 bound","why":"The bundle asked for the first 50 lines."}],"forbidden":[{"re":"\\brm\\b|\\bmv\\b|\\btruncate\\b|>\\s*/var/log|systemctl (restart|stop|reload)","label":"a log-modifying or service action","why":"Any write, move, truncation, or service restart destroys or taints evidence — the DANGEROUS near-miss."}]},"hint":"One case-insensitive search, one bound on the output, nothing that touches the file.","explain":"'grep -i \"autodiscover\" <log> | head -50' produces the bundle extract. The DANGEROUS near-misses (rm/mv/truncate, redirects, restarts) destroy the very record the case depends on.","study":"Evidence-safe extraction from nginx-style access logs."},{"id":"T1590-001-H12","type":"triage","title":"The Thursday queue","summary":"Four domain-property items — pick the disposition.","concepts":["monitor for lookalike registrations","surges of GetUserRealm/autodiscover requests","review public contact/admin data","M1056 Pre-compromise"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Queue","kind":"text","text":"Four items. Context: one armed lookalike is under takedown; the record-hygiene project starts next month."}],"question":"Choose the disposition for each item.","rows":[{"alert":"Second lookalike registered, no MX yet, privacy registrant","detail":"Different typo pattern than the first.","options":["Queue for takedown now","Add to watchlist (not armed)","Disable all tenant APIs"],"correctIndex":1,"why":"Registered but not armed — watchlist with alerting on MX/cert issuance is proportionate.","whyNot":{"0":"Takedowns need arming or use, not just a fresh registration.","2":"Disabling tenant APIs breaks mail for everyone."}},{"alert":"autodiscover 401 burst from a new external IP","detail":"Same guessing pattern as last week's.","options":["Queue for takedown now","Add to watchlist (not armed)","Escalate to IR — hostile enumeration"],"correctIndex":2,"why":"Active hostile enumeration is an IR escalation, not a brand task.","whyNot":{"0":"There is no domain to takedown here — it is probing traffic.","1":"Watching alone underreacts to active enumeration."}},{"alert":"Registrant email in WHOIS is a named director","detail":"Found during hygiene review.","options":["Queue for takedown now","Add to the record-hygiene backlog (role alias + privacy)","Disable all tenant APIs"],"correctIndex":1,"why":"An exposure finding belongs in the M1056 hygiene backlog — no incident exists.","whyNot":{"0":"It is your own record; there is nothing to takedown.","2":"Unrelated to the exposure — wrong lever."}},{"alert":"Armed lookalike's takedown confirmed by registrar","detail":"Domain now serverHold.","options":["Close with evidence archived","Add to watchlist (not armed)","Escalate to IR — hostile enumeration"],"correctIndex":0,"why":"The action completed — archive the evidence bundle and close.","whyNot":{"1":"serverHold means it is down, not watched-forever.","2":"The enumeration trigger is gone."}}],"hint":"Match each item to its lever: takedown, watch, hygiene, IR, or close.","explain":"Four items, four different levers — including closing one. The discipline is matching signal class to response class instead of escalating everything.","study":"Disposition mapping for domain-property signals."},{"id":"T1590-001-H13","type":"branch","title":"The takedown decision chain","summary":"Three decisions before the abuse report goes out.","concepts":["IR evidence handling","registrar lock and privacy services","monitor for lookalike registrations"],"perspective":"defender","tags":["trap:conflicting-signals"],"scenario":[{"label":"ARTEFACT 1 — Pre-filing checklist","kind":"text","text":"Before filing: (1) is the domain really hostile? (2) what evidence goes in the bundle? (3) what happens after filing?"}],"question":"Make the three decisions.","steps":[{"text":"Decision 1 — Hostility test?","options":[{"t":"Require the triplet: brand imitation + no ticket + arming/use evidence","correct":true,"why":"Correct — one property is noise; the triplet is a defensible hostility test.","outcome":"Triplet satisfied: imitation, no ticket, mail cert issued.","outcomeBad":false},{"t":"File on name similarity alone","correct":false,"why":"Registrars reject similarity-only filings; partners with similar names get hurt.","outcome":"Filing rejected; credibility with the registrar drops.","outcomeBad":true},{"t":"Skip the test — takedowns are always right","correct":false,"why":"Wrong filings have real costs: partners hit, reputation lost.","outcome":"A legitimate reseller domain is killed by your filing.","outcomeBad":true}]},{"text":"Decision 2 — What goes in the evidence bundle?","options":[{"t":"Registration record, CT certificate entries, and logged abuse (mails/URLs)","correct":true,"why":"Correct — identity, arming, and use: the three-part bundle registrars act on.","outcome":"Bundle complete; the registrar accepts the filing same-day.","outcomeBad":false},{"t":"A screenshot of your feelings about the domain","correct":false,"why":"Not evidence — and yes, this appears in real queues.","outcome":"The bundle bounces for lack of substance.","outcomeBad":true},{"t":"Only the creation date","correct":false,"why":"One property proves nothing about hostility or use.","outcome":"Registrar asks for more; days lost.","outcomeBad":true}]},{"text":"Decision 3 — After filing?","options":[{"t":"Keep monitoring; alert staff on the exact sender pattern; never reply to the lures","correct":true,"why":"Correct — filing is not instant; meanwhile people must recognise the pattern and not engage.","outcome":"Two clicks reported before the takedown lands; evidence preserved.","outcomeBad":false},{"t":"Reply to the lures demanding they stop","correct":false,"why":"Confirms live addresses and burns the element of surprise.","outcome":"The actor rotates infrastructure early.","outcomeBad":true},{"t":"Tell staff the problem is solved because you filed","correct":false,"why":"serverHold takes days; premature all-clear breeds clicks.","outcome":"A click lands during the false-safety window.","outcomeBad":true}]}],"hint":"Test with a triplet, bundle three artefact classes, and keep defending after filing.","explain":"The chain makes takedowns professional: a defensible hostility test, a three-part evidence bundle, and continued defence during the waiting period. Each decision protects a different asset — accuracy, credibility, and people.","study":"Takedown filings that registrars accept."},{"id":"T1590-001-H14","type":"fib","title":"Complete the enumeration finding","summary":"Two words finish the tenant-API finding.","concepts":["surges of GetUserRealm/autodiscover requests","validate tenant domain names"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — Finding draft","kind":"text","text":"Draft: 'Tenant-side logs show {b0} requests for many random mailbox names — evidence of {b1} rather than normal mail flow.'"}],"question":"Fill the two blanks of the finding.","template":"Tenant-side logs show {b0} requests for many random mailbox names — evidence of {b1} rather than normal mail flow.","blanks":[{"accept":["autodiscover"],"why":"The observed requests hit the autodiscover endpoint.","whyMiss":"The log pattern names autodiscover; GetUserRealm was not the observed endpoint here."},{"accept":["enumeration","hostile enumeration","recon"],"why":"Random-name bursts are enumeration behaviour.","whyMiss":"The pattern is enumeration — not normal client validation."}],"hint":"Blank one: the endpoint in the logs. Blank two: the behaviour name.","explain":"The finding names the endpoint and the behaviour — the two facts a reader needs. Precise findings survive review; vague ones do not.","study":"Writing precise tenant-API findings."},{"id":"T1590-001-H15","type":"mcq","title":"Anchor the cloud-exposure review","summary":"Which ISO control fits a review of public tenant API exposure?","concepts":["ISO/IEC 27001 A.5.23 cloud services security","public cloud API endpoints"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — GRC note","kind":"text","text":"GRC must anchor 'review what our Microsoft 365 tenant exposes through public endpoints' to a recognised control."}],"question":"Which anchor fits best?","options":[{"t":"ISO/IEC 27001 A.5.23 — information security for use of cloud services","correct":true,"why":"Correct — A.5.23 governs securing the organisation's use of cloud services, including their exposure."},{"t":"ISO/IEC 27001 A.8.28 — secure coding","correct":false,"why":"Secure coding governs development, not tenant endpoint exposure."},{"t":"NIST CSF RC.CO — communications","correct":false,"why":"RC.CO is incident communication, not exposure review."},{"t":"CIS Control 14 — Security Awareness","correct":false,"why":"Awareness training does not govern tenant API configuration."}],"hint":"The anchor's subject is the organisation's use of cloud services.","explain":"A.5.23 is the natural anchor for cloud-service exposure reviews. Framework anchors give the hygiene programme a home in the audit.","study":"ISO/IEC 27001 A.5.23 and cloud exposure governance."}],"severityWord":"HARD","partLabel":null}</script>
<script>
'use strict';
var DATA = JSON.parse(document.getElementById('cm-exam-data').textContent);
var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var EXS = [];
var S = null;
var T = null; // timer object for current attempt

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function fmtTime(sec){
  sec = Math.max(0, sec|0);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function round1(x){ return Math.round(x*10)/10; }
function letterKey(n){ return String.fromCharCode(65+n); }
function dispKey(ex, origIdx){ return ex._optOrder ? ex._optOrder.indexOf(origIdx) : origIdx; }

var KW = (DATA.kw && DATA.kw.length) ? DATA.kw : ['show','key','log','policy','error'];
var KWRE = new RegExp('(^|[^\\w-])(' + KW.join('|') + ')(?=[^\\w-]|$)','g');
function hl(text){
  var e = esc(text);
  e = e.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g, '<span class="tok-str">$1</span>');
  e = e.replace(/\b\d{1,3}(?:\[\.\]\d{1,3}){3}\b/g, '<span class="tok-ip">$&</span>');
  e = e.replace(KWRE, function(m,p1,p2){ return p1 + '<span class="tok-kw">' + p2 + '</span>'; });
  e = e.replace(/(\s|^)(-{1,2}[A-Za-z][\w-]*)/g, '$1<span class="tok-flag">$2</span>');
  e = e.replace(/\b(\d+)\b(?![^<]*<\/span>)/g, function(m, g1, off, str){
    var before = str.slice(Math.max(0, off-6), off);
    if(before.indexOf('class=') >= 0){ return m; }
    return '<span class="tok-num">'+m+'</span>';
  });
  return e;
}

function scoreExercise(H, W, N){
  if(N <= 0){ return 0; }
  return Math.max(0, (H - W) / N);
}
function normTxt(s){
  return String(s).trim().toLowerCase().replace(/\s+/g,' ').replace(/[.,;]+$/,'');
}

/* ================= timer state machine ================= */
function setTState(st){
  T.state = st;
  var el = $('tstate');
  if(!el){ return; }
  el.className = 'tstate';
  if(st === 'RUNNING'){ el.classList.add('running'); el.innerHTML = '&#9654; RUNNING'; }
  else if(st === 'PAUSED_MANUAL'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; manual (press Resume)'; }
  else if(st === 'PAUSED_AUTO_CHECK'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; reviewing feedback (resumes on Next)'; }
  else if(st === 'ENDED'){ el.classList.add('ended'); el.innerHTML = '&#9632; ENDED'; }
  renderTimerBox();
}
function renderTimerBox(){ var el = $('timerbox'); if(el){ el.textContent = fmtTime(T.remaining); } }
function tick(){
  if(T.state === 'RUNNING'){
    T.remaining -= 1;
    renderTimerBox();
    var tc = $('termclock');
    if(tc && S && (S.screen === 'exam') && curEx() && curEx().type === 'terminal' && !curEx()._checked && curEx()._tleft !== null && curEx()._tleft !== undefined){
      curEx()._tleft -= 1;
      if(curEx()._tleft <= 0){ curEx()._tleft = 0; tc.textContent = '\u23f1 0:00 left — grading now'; curEx()._autoGrade = true; gradeCurrent(); return; }
      tc.textContent = '\u23f1 ' + Math.floor(curEx()._tleft/60) + ':' + (curEx()._tleft%60 < 10 ? '0' : '') + (curEx()._tleft%60) + ' left on this terminal (pauses with the exam timer)';
    }
    if(T.remaining <= 0){
      T.remaining = 0;
      setTState('ENDED');
      finishAttempt(true);
    }
  } else if(T.state === 'PAUSED_MANUAL'){ T.manualTotal += 1; }
  else if(T.state === 'PAUSED_AUTO_CHECK'){ T.autoTotal += 1; }
}

/* ================= intro screen ================= */
function typeLabel(t){
  return {
    mcq:'multiple choice', multi:'multi-select (partial credit)', match:'matching pairs',
    dnd:'drag & drop', order:'timeline ordering', fib:'fill-in-the-blank',
    terminal:'fake terminal command', branch:'branching decision scenario',
    triage:'SOC alert-queue triage', logview:'log viewer analysis'
  }[t] || t;
}
var TYPE_ICONS = {mcq:'A.', multi:'☑', match:'⇄', dnd:'✥', order:'↕', fib:'▁', terminal:'>_ ', branch:'⑃', triage:'▦', logview:'☰'};

function renderIntro(){
  S.screen = 'intro';
  var exTypes = [];
  DATA.exercises.forEach(function(e){ if(exTypes.indexOf(e.type) < 0){ exTypes.push(e.type); } });
  var chips = exTypes.map(function(t){ return '<span class="typechip">'+esc(TYPE_ICONS[t]||'•')+' '+esc(typeLabel(t))+'</span>'; }).join('');
  var themes = DATA.themes.map(function(th){
    return '<div class="themebox"><h4>'+esc(th.name)+'</h4><ul>'+ th.concepts.map(function(c){ return '<li>'+esc(c)+'</li>'; }).join('') +'</ul></div>';
  }).join('');
  var learn = DATA.learn.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('');
  var app = $('app');
  app.innerHTML =
  '<div class="intro-hero card">'+
    '<h1>'+esc(META.title)+'</h1>'+
    '<div class="objline"><b>'+esc(DATA.object.id)+' — '+esc(DATA.object.name)+'</b> &nbsp;·&nbsp; ATT&amp;CK object type: '+esc(DATA.object.type)+' &nbsp;·&nbsp; Tactic: '+esc(DATA.object.tactic)+'</div>'+
    '<div class="objline">Platform(s): '+esc(DATA.object.platforms)+'</div>'+
    '<div class="factrow">'+
      '<span class="badge '+sevClass()+'">'+esc(DATA.severityWord)+'</span>'+
      '<span class="fact">▦ <span><b>'+DATA.exercises.length+'</b> exercises</span></span>'+
      '<span class="fact">⏱ <span>estimated time <b>'+META.estimatedMinutes+' min</b> — the countdown timer gives you the same <b>'+META.timerMinutes+' min</b></span></span>'+
      '<span class="fact">◎ <span>pass mark <b>'+META.passMark+'%</b></span></span>'+
      (S.init && S.init.username ? '<span class="userchip">👤 Analyst: '+esc(S.init.username)+'</span>' : '')+
    '</div>'+
  '</div>'+
  '<section class="card"><h2>What you will learn here</h2>'+learn+'</section>'+
  '<section class="card"><h2>Keywords covered in this exam</h2><div class="themegrid">'+themes+'</div>'+
    '<p class="kw-note">Each keyword above is exercised at least once in this file. Themes follow the structure of the ATT&amp;CK page for '+esc(DATA.object.id)+'.</p></section>'+
  '<section class="card"><h2>How this exam works</h2>'+
    '<div class="typechips">'+chips+'</div>'+
    '<ul class="rulelist">'+
    '<li><span class="rl-ico">◎</span><span><b>Pass mark '+META.passMark+'%.</b> Your score is computed only over the exercises you actually answered (checked). PASS means you scored at least '+META.passMark+'%; FAIL means you should retake the exam.</span></li>'+
    '<li><span class="rl-ico">⚖</span><span><b>Partial credit.</b> Multi-answer exercises are graded per item: credit = max(0, (correct items selected − wrong items selected) ÷ total correct items). Selecting everything is graded 0, not full marks.</span></li>'+
    '<li><span class="rl-ico">💡</span><span><b>Hint costs 10% of the exercise credit.</b> One hint per exercise. The hint gives a nudge, never the answer.</span></li>'+
    '<li><span class="rl-ico">⏱</span><span><b>Timer.</b> A countdown runs for '+META.timerMinutes+' minutes. <b>Pause</b> is manual: it hides the exercise until you press Resume. Pressing <b>Check</b> also pauses the timer automatically while you study the feedback — the exercise stays visible, and the timer resumes only when you press <b>Next</b> (or Final Submit on the last exercise).</span></li>'+
    '<li><span class="rl-ico">⤼</span><span><b>Skip.</b> Every exercise can be skipped without penalty. Skipped exercises go to a review pool. Before you finish, you can return to them as many times as the timer allows. Skipped-and-never-answered exercises are excluded from the score completely.</span></li>'+
    '</ul>'+
    '<div class="btnrow"><button class="btn primary" id="startbtn" onclick="startAttempt()">▶ Start the exam</button></div>'+
  '</section>';
  window.scrollTo(0,0);
}

/* ================= exam flow ================= */
function constrainedShuffle(){
  var isTerm = EXS.map(function(e){ return e.type === 'terminal'; });
  var ord = EXS.map(function(e,i){ return i; });
  for(var tries=0; tries<80; tries++){
    ord = shuffle(EXS.map(function(e,i){ return i; }));
    var ok = true;
    for(var k=1; k<ord.length; k++){ if(isTerm[ord[k]] && isTerm[ord[k-1]]){ ok = false; break; } }
    if(ok){ return ord; }
  }
  return ord;
}
function startAttempt(){
  EXS = DATA.exercises.map(function(e){ return JSON.parse(JSON.stringify(e)); });
  S = {
    screen:'exam', order:[], cur:0, creditSum:0, answered:0, checkedCount:0,
    skipped:[], reported:false, init:S ? S.init : null, reviewing:null
  };
  S.order = shuffle(EXS.map(function(e,i){ return i; }));
  EXS.forEach(function(ex){
    ex._checked = false; ex._credit = 0; ex._hintUsed = false; ex._ans = null; ex._items = null; ex._autoGrade = false;
    if(ex.type === 'mcq' || ex.type === 'multi' || ex.type === 'logview'){ ex._optOrder = shuffle(ex.options.map(function(o,i){ return i; })); }
    if(ex.type === 'match'){ ex._rightOrder = shuffle(ex.right.map(function(r,i){ return i; })); }
    if(ex.type === 'dnd'){ ex._bankOrder = shuffle(ex.bank.map(function(b,i){ return i; })); }
    if(ex.type === 'order'){ ex._seq = shuffle(ex.sequence.slice()); }
    if(ex.type === 'terminal'){ ex._log = []; ex._lastCmd = null; ex._tleft = (ex.cmd && ex.cmd.timeLimit) ? ex.cmd.timeLimit : null; }
    if(ex.type === 'branch'){ ex._step = 0; ex._picks = []; ex._pendingPick = null; }
  });
  T = { remaining: META.timerMinutes*60, state:'RUNNING', iv:null, manualTotal:0, autoTotal:0 };
  if(T.iv){ clearInterval(T.iv); }
  T.iv = setInterval(tick, 1000);
  setTState('RUNNING');
  S.screen = 'exam';
  S.cur = 0;
  S.order = constrainedShuffle();
  LASTKEY = '';
  renderExamShell();
  renderExercise();
}
function curEx(){ return EXS[S.order[S.cur]]; }
function sevClass(){ return 'sev-' + (META.difficulty === 'extremely-hard' ? 'extreme' : META.difficulty); }

function renderExamShell(){
  $('app').innerHTML =
    '<div class="topbar" id="topbar">'+
      '<span class="tb-item" id="tb-counter"></span>'+
      '<span class="tb-item"><span class="badge '+sevClass()+'" id="tb-badge"></span></span>'+
      '<span class="tb-item" id="tb-part"></span>'+
      '<span class="tb-item">⏱ <span class="timerbox" id="timerbox">--:--</span> <span class="tstate" id="tstate"></span></span>'+
      '<span class="tb-item tb-score">◎ Score: <strong id="tb-score">0 / 0</strong> <span id="tb-pct">(0%)</span></span>'+
      (S.init && S.init.username ? '<span class="userchip">👤 '+esc(S.init.username)+'</span>' : '')+
      '<span style="flex:1"></span>'+
      '<button class="btn ghost" id="btn-pause" onclick="pauseManual()">⏸ Pause</button>'+
      '<button class="btn amber" id="btn-hint" onclick="doHint()">💡 Hint <small style="opacity:.8">−10%</small></button>'+
      '<button class="btn ghost" id="btn-skip" onclick="doSkip()">⤼ Skip</button>'+
    '</div>'+
    '<div id="pbarwrap"><div id="pbar"></div></div>'+
    '<div id="exarea"></div>';
  $('tb-badge').textContent = DATA.severityWord;
  $('tb-part').innerHTML = DATA.partLabel ? '<span class="statechip st-skipped">'+esc(DATA.partLabel)+'</span>' : '';
  $('pbar').style.setProperty('--sev', 'var(--sev-' + META.difficulty.replace('extremely-hard','extreme') + ')');
  renderTimerBox();
  setTState(T ? T.state : 'RUNNING');
  updateHeader();
}
function updateHeader(){
  if(!$('tb-counter')){ return; }
  var ex = curEx();
  if(S.screen === 'exam'){
    $('tb-counter').innerHTML = 'Exercise <strong>'+(S.cur+1)+'</strong> of <strong>'+EXS.length+'</strong>';
  } else if(S.screen === 'open'){
    $('tb-counter').innerHTML = '⚠ Reviewing skipped exercise <strong>'+(S.reviewPos+1)+'</strong> of <strong>'+S.skipped.length+'</strong>';
  } else if(S.screen === 'review'){
    $('tb-counter').innerHTML = 'Review skipped exercises';
  }
  $('tb-score').textContent = round1(S.creditSum).toFixed(1) + ' / ' + S.answered;
  var pct = S.answered > 0 ? Math.round((S.creditSum / S.answered) * 100) : 0;
  $('tb-pct').textContent = '(' + pct + '%)';
  var p = Math.round((S.checkedCount / EXS.length) * 100);
  $('pbar').style.width = p + '%';
  var hintDis = S.screen !== 'exam' && S.screen !== 'open';
  hintDis = hintDis || !ex || ex._hintUsed || ex._checked;
  $('btn-hint').disabled = !!hintDis;
  $('btn-skip').disabled = S.screen !== 'exam' || !ex || ex._checked;
  var pb = $('btn-pause'); if(pb){ pb.disabled = !T || T.state === 'ENDED'; }
}

/* ---------- scenario / question blocks ---------- */
function scenarioHtml(ex){
  var arts = (ex.scenario || []).map(function(a, i){
    if(a.kind === 'log' || a.kind === 'code'){
      var lines = a.text.split('\n').map(function(l){ return '<div class="ln">'+hl(l)+'</div>'; }).join('');
      return '<div class="artefact"><span class="art-label">'+esc(a.label)+'</span><div class="art-body"><pre class="mono" style="background:transparent;border:none;padding:0;margin:0">'+lines+'</pre></div></div>';
    }
    return '<div class="artefact"><span class="art-label">'+esc(a.label)+'</span><div class="art-body"><p>'+esc(a.text).replace(/\n/g,'<br>')+'</p></div></div>';
  }).join('');
  var sum = '<div class="blk-body" id="scen-sum" style="border-top:1px dashed var(--border);padding:10px 16px"><span class="art-label" style="padding:0 0 4px 0">⚠ ONE-LINE SUMMARY</span><p style="margin:2px 0">'+esc(ex.summary)+'</p></div>';
  return '<div class="blk scenario" id="blk-scen">'+
    '<div class="blk-head"><span class="blk-ico">🛰</span> SCENARIO'+
      '<span style="flex:1"></span>'+
      '<button class="btn ghost" id="scen-toggle" style="min-height:44px;padding:4px 12px" onclick="toggleScenario()" aria-expanded="true">▲ Collapse</button>'+
    '</div>'+
    '<div class="blk-body" id="scen-body">'+arts+'</div>'+sum+
  '</div>';
}
function toggleScenario(){
  var b = $('scen-body'), t = $('scen-toggle');
  if(!b){ return; }
  var open = !b.classList.contains('hidden');
  b.classList.toggle('hidden', open);
  t.textContent = open ? '▼ Expand' : '▲ Collapse';
  t.setAttribute('aria-expanded', String(!open));
}

/* ---------- answer widgets ---------- */
function optRowHtml(ex, i, kind){
  var o = ex.options[i];
  var dk = dispKey(ex, i);
  var inp = '<input type="'+(kind==='multi'?'checkbox':'radio')+'" name="ans" id="opt-'+i+'" value="'+i+'" onchange="pickOpt()" aria-label="Option '+letterKey(dk)+'">';
  return '<label class="opt" id="optrow-'+i+'">'+inp+'<span class="opt-key">'+letterKey(dk)+'.</span><span class="opt-text">'+esc(o.t)+'</span></label>';
}
function answerHtml(ex){
  var h = '';
  var i;
  if(ex.type === 'mcq'){
    h = '<div class="optlist" id="answidget">' + ex._optOrder.map(function(oi){ return optRowHtml(ex, oi, 'mcq'); }).join('') + '</div>';
  } else if(ex.type === 'logview'){
    var lines0 = ex.log.map(function(l,i){ return '<div class="ln" data-ln="'+i+'">'+hl(l)+'</div>'; }).join('');
    h = '<div id="answidget"><div class="logtool"><div class="logbar"><span class="lg-title">☰ '+esc(ex.logTitle||'log viewer')+'</span><input id="logfilter" placeholder="'+esc(ex.filterPlaceholder||'filter lines...')+'" aria-label="Filter log lines" oninput="logFilter()"></div><div class="loglines" id="loglines">'+lines0+'</div></div>'+
      '<div class="optlist" style="margin-top:12px">' + ex._optOrder.map(function(oi){ return optRowHtml(ex, oi, ex.multi?'multi':'mcq'); }).join('') + '</div></div>';
  } else if(ex.type === 'multi'){
    h = '<div class="optlist" id="answidget">' + ex._optOrder.map(function(oi){ return optRowHtml(ex, oi, 'multi'); }).join('') + '</div>';
  } else if(ex.type === 'match'){
    var rows = ex.left.map(function(L, li){
      var opts = '<option value="">— choose a match —</option>' + ex._rightOrder.map(function(ri){
        var r = ex.right[ri];
        return '<option value="'+ri+'">'+esc(r.t)+'</option>';
      }).join('');
      return '<div class="matchrow"><span class="m-left">'+esc(L.t)+'</span><select class="anssel" id="match-'+li+'" onchange="pickMatch()" aria-label="Match for item '+(li+1)+'">'+opts+'</select></div>';
    }).join('');
    h = '<div id="answidget">'+rows+'<p class="kw-note">⇄ Matching: each correct pair earns its own credit; a wrong pair subtracts.</p></div>';
  } else if(ex.type === 'dnd'){
    var bank = ex._bankOrder.map(function(bi){
      var b = ex.bank[bi];
      return '<button type="button" class="chip" draggable="true" data-bank="'+bi+'" id="chip-'+bi+'" onclick="chipClick('+bi+')" ondragstart="chipDrag(event,'+bi+')">'+esc(b.t)+'</button>';
    }).join('');
    var zones = ex.zones.map(function(z, zi){
      return '<div class="zone" id="zone-'+zi+'" data-zone="'+zi+'" onclick="zoneClick('+zi+')" ondragover="zoneDragOver(event,'+zi+')" ondragleave="zoneDragLeave(event)" ondrop="zoneDrop(event,'+zi+')"><h5>⬇ '+esc(z.name)+'</h5><div class="zone-slot" id="zoneslot-'+zi+'"></div></div>';
    }).join('');
    h = '<div id="answidget"><div class="dndwrap"><div class="dndbank"><h4>✥ ITEM BANK (click a chip, then click a zone — or drag)</h4><div id="bank">'+bank+'</div></div><div class="zones">'+zones+'</div></div><p class="kw-note">✥ Each correctly filled zone earns its own credit; a wrongly filled zone subtracts.</p></div>';
  } else if(ex.type === 'order'){
    h = '<div id="answidget"><ul class="seq" id="seqlist"></ul><p class="kw-note">↕ Put the steps in the correct order. Every step in its correct position earns credit.</p></div>';
  } else if(ex.type === 'fib'){
    var parts = ex.template.split(/\{b(\d+)\}/);
    var htmlp = '';
    for(var k=0;k<parts.length;k++){
      if(k%2===1){ htmlp += '<input class="blank-in" id="blank-'+parts[k]+'" size="'+(ex.blanks[parseInt(parts[k],10)].width||18)+'" autocomplete="off" spellcheck="false" aria-label="Blank '+(parseInt(parts[k],10)+1)+'" oninput="pickFib()">'; }
      else { htmlp += esc(parts[k]); }
    }
    h = '<div id="answidget" class="blanks">'+htmlp+'</div>';
  } else if(ex.type === 'terminal'){
    var panel = '';
    if(ex.cmd.syntaxPanel){ panel = '<div class="syntaxpanel"><span class="sp-title">SYNTAX REMINDER</span><pre class="mono" style="background:transparent;border:none;padding:6px 0 0 0;margin:0">'+hl(ex.cmd.syntaxPanel)+'</pre></div>'; }
    if(ex.cmd.timeLimit){ panel += '<p class="term-clock" id="termclock">⏱ This terminal has its own ' + Math.floor(ex.cmd.timeLimit/60) + ':' + (ex.cmd.timeLimit%60<10?'0':'')+(ex.cmd.timeLimit%60) + ' budget — it pauses with the exam timer.</p>'; }
    h = '<div id="answidget">'+panel+
      '<div class="shell"><div class="scroll" id="shelllog">'+ ex._log.map(function(l){ return '<div class="'+(l.err?'out-err':'out-ok')+'">'+hl(l.t)+'</div>'; }).join('') +'</div>'+
      '<div class="promptline"><span class="prompt">'+esc(ex.cmd.prompt)+'</span><input id="shellin" autocomplete="off" spellcheck="false" aria-label="Terminal input" onkeydown="if(event.key===\'Enter\'){shellRun();}"><button type="button" class="btn ghost answerctl" onclick="shellRun()" style="min-height:44px">↵ Run</button></div>'+
      '</div>'+
      '<div class="btnrow"><button type="button" class="btn green answerctl" id="termcheck" onclick="gradeCurrent()">✓ Check</button></div></div>';
  } else if(ex.type === 'branch'){
    h = '<div id="answidget"></div>';
  } else if(ex.type === 'triage'){
    var rows = ex.rows.map(function(r, ri){
      var opts = '<option value="">— choose a disposition —</option>' + r.options.map(function(o,oi){ return '<option value="'+oi+'">'+esc(o)+'</option>'; }).join('');
      return '<div class="trirrow"><span class="t-alert">'+esc(r.alert)+'</span><select class="anssel" id="tri-'+ri+'" onchange="pickTriage()" aria-label="Disposition for alert '+(ri+1)+'">'+opts+'</select><span class="t-detail">'+esc(r.detail)+'</span></div>';
    }).join('');
    h = '<div id="answidget">'+rows+'</div>';
  }
  return h;
}

/* ---------- grading ---------- */
function applyHintPenalty(credit, ex){
  if(ex._hintUsed){ return Math.max(0, credit - 0.10); }
  return credit;
}
function gradeCurrent(){
  if(S.screen !== 'exam' && S.screen !== 'open'){ return; }
  var ex = curEx();
  if(ex._checked){ return; }
  if(ex.type === 'branch' && ex._step < ex.steps.length){
    var fb = $('fback');
    if(fb){ fb.innerHTML = '<div class="hintpanel"><span class="hint-tag">⏳ NOT FINISHED YET</span>Confirm every step of this decision first (the timer keeps running while you decide). The Check button unlocks after the final step.</div>'; }
    return;
  }
  var res = gradeEx(ex);
  ex._items = res.items;
  ex._dangerous = res.dangerous || false;
  ex._credit = applyHintPenalty(res.credit, ex);
  ex._checked = true;
  S.creditSum += ex._credit;
  S.answered += 1;
  S.checkedCount += 1;
  var idx = EXS.indexOf(ex);
  var poolIdx = S.skipped.indexOf(idx);
  if(poolIdx >= 0){ S.skipped.splice(poolIdx, 1); }
  if(T.state === 'RUNNING'){ setTState('PAUSED_AUTO_CHECK'); }
  renderFeedback(ex, res);
  lockAnswer();
  updateHeader();
}
function itemRow(state, label, note){

  var cls = state==='correct' ? 'st-correct' : (state==='wrong' ? 'st-incorrect' : 'st-skipped');
  return '<li><span class="fi-ico '+cls+'">'+ico+'</span><span><b>'+esc(label)+'</b>'+(note ? '<span class="fi-note">'+esc(note)+'</span>' : '')+'</span></li>';

function isLastGraded(){
  return S.cur >= EXS.length - 1;
}
function copyCmd(btn, txt){
  var done = function(){ btn.textContent = '✓ Copied'; setTimeout(function(){ btn.textContent = '⧉ Copy'; }, 1500); };
