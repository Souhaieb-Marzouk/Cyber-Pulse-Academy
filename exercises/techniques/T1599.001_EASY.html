intro: {
learn: "<p>You will learn about one small, precise piece of the MITRE ATT&amp;CK framework. ATT&amp;CK is a big public catalogue that describes what real attackers do. This object is a <b>sub-technique</b>. A sub-technique is one specific way to carry out a broader method. The parent here is <b>T1599 — Network Boundary Bridging</b>. This child is <b>T1599.001 — Network Address Translation Traversal</b>.</p><p>Imagine a company network like an office with two locked wings. A router or firewall stands between them and translates addresses so packets can pass. That translation is called <b>NAT (Network Address Translation)</b>. NAT rewrites the source or destination address inside the header of each packet. Some networks use private addresses that cannot travel on the public Internet, so NAT is required on the border device for packets to cross.</p><p>An attacker who takes control of that router or firewall can edit its NAT rules. The edit can bridge two separated networks, or hide where traffic really comes from. That weakens a security control, so ATT&amp;CK places this technique in the <b>Defense Impairment</b> tactic — the tactic whose goal is to break or blind security mechanisms.</p><p>You will see where this matters in real work: SOC analysts triage configuration-change alerts; network security engineers review device configs; detection engineers write analytics such as DET0163; incident responders find out how an attacker crossed a segment; GRC analysts check MFA and least privilege on network devices; red teamers demonstrate the gap safely during authorized tests.</p><p>By the end you will recognise the technique, its tactic, the traces it leaves, and the controls that stop it.</p>",

    "NAT rewrites source or destination addresses in the IP header",

function fmt(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function r1(x){return Math.round(x*10)/10;}
function pct(sum,n){return n>0?Math.round((sum/n)*100):0;}

D.exercises=(window.__EXAM_PART_A__.exercises||[]).concat(window.__EXAM_PART_B__?(window.__EXAM_PART_B__.exercises||[]):[]);

    S.pauseStart=0;S.pauseKind='';
  }

/* ---------- exercise-order build (first run authored; retake shuffled, terminals never adjacent) ---------- */
function buildList(shuffled){
  var n=EX.length,base=[];
  for(var i=0;i<n;i++)base.push(i);
  if(!shuffled)return base;
  var ok=false,tries=0;
  while(!ok&&tries<40){
    tries++;var l=shuffle(base);ok=true;
    for(var k=1;k<l.length;k++){if(EX[l[k]].kind==='term'&&EX[l[k-1]].kind==='term'){ok=false;break;}}
    if(ok)base=l;
  }
  return base;
}

function hi(line){
  var s=esc(line);
  s=s.replace(/(^|\s)(show|copy|clear|reload|grep|ip nat|access-list|username|aaa|tacacs|radius|enable|conf(igure)? t(erminal)?|write|interface|router|snmp-server|logging|no )/g,'$1<span class="tk-cmd">$2</span>');
  s=s.replace(/(10\[\.\]\d+\[\.\]\d+\[\.\]\d+|172\[\.](1[6-9]|2\d|3[01])\[\.]\d+\[\.]\d+|192\[\.]168\[\.]\d+\[\.]\d+)/g,'<span class="tk-ip">$1</span>');
  s=s.replace(/(\d+\/(tcp|udp)|\b\d{2,5}\b(?=[\s<]))/g,'<span class="tk-str">$1</span>');
  s=s.replace(/(^|\s)(!.*)$/,'$1<span class="tk-cmt">$2</span>');
  return s;
}

function buildAnswer(host,d,r,i){

function buildChoice(host,d,r,i){
  var multi=d.kind==='multi';

  var wrap=el('div','opts');wrap.id='anshost';

    b.setAttribute('role',multi?'checkbox':'radio');
    b.setAttribute('aria-checked',multi?String(store.indexOf(oi)>=0):String(store===oi));
    b.addEventListener('click',function(){
      if(r.checked)return;
      if(multi){
        var at=store.indexOf(oi);
        if(at>=0)store.splice(at,1);else store.push(oi);
        b.classList.toggle('sel');b.setAttribute('aria-checked',String(store.indexOf(oi)>=0));
      }else{
        store=oi;r.sel=oi;
        Array.prototype.forEach.call(wrap.children,function(c){c.classList.remove('sel');c.setAttribute('aria-checked','false');});
        b.classList.add('sel');b.setAttribute('aria-checked','true');

function buildDD(host,d,r,i){
  r.placed=r.placed||{};r.pick=r.pick||null;
  var wrap=el('div','ddwrap');wrap.id='anshost';
  var bankLbl=el('div',null,'<b class="sec small">Cards — click one, then click a slot (or drag it):</b>');
  wrap.appendChild(bankLbl);
  var bank=el('div','bank');
  d._items=d._items||shuffle(d.items.slice());
  var slotsRow=el('div','slots');
  d.slots.forEach(function(s){var sl=el('div','slot');sl.dataset.slot=s.id;sl.setAttribute('tabindex','0');sl.setAttribute('role','button');sl.setAttribute('aria-label','Slot: '+s.label+' — press Enter to place the selected card here');sl.innerHTML='<div class="slabel"><span class="sic">⬇</span> '+esc(s.label)+'</div><div class="hintslot">'+esc(s.hint||'')+'</div>';
    sl.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();if(r.pick){r.placed[r.pick]=s.id;r.pick=null;draw();}}});
    slotsRow.appendChild(sl);});
  function draw(){
    bank.innerHTML='';Array.prototype.forEach.call(slotsRow.children,function(sl){
      Array.prototype.forEach.call(sl.querySelectorAll('.dditem'),function(n){n.remove();});
    });
    d._items.forEach(function(it){
      if(r.placed[it.id])return;
      var n=el('button','dditem'+(r.pick===it.id?' pick':''));
      n.type='button';n.draggable=true;
      n.innerHTML='<span class="pi">▦</span> '+esc(it.text);
      n.setAttribute('aria-label','Card: '+it.text);
      n.addEventListener('click',function(){r.pick=(r.pick===it.id?null:it.id);draw();});
      n.addEventListener('dragstart',function(e){r.pick=it.id;n.classList.add('dragging');try{e.dataTransfer.setData('text/plain',it.id);}catch(e2){}});
      n.addEventListener('dragend',function(){n.classList.remove('dragging');});
      bank.appendChild(n);
    });
    d.slots.forEach(function(s){
      var sl=slotsRow.querySelector('[data-slot="'+s.id+'"]');
      Object.keys(r.placed).forEach(function(iid){
        if(r.placed[iid]!==s.id)return;
        var it=null;d.items.forEach(function(x){if(x.id===iid)it=x;});
        var n=el('button','dditem');
        n.type='button';n.innerHTML='<span class="pi">▦</span> '+esc(it.text)+' <span class="selword">in slot</span>';
        n.setAttribute('aria-label','Card '+it.text+' in slot '+s.label+' — click to return');
        n.addEventListener('click',function(ev){ev.stopPropagation();if(r.checked)return;delete r.placed[iid];r.pick=null;draw();});
        sl.appendChild(n);
      });
    });
  }
  slotsRow.addEventListener('click',function(e){
    var sl=e.target.closest('.slot');if(!sl)return;

    if(r.pick){r.placed[r.pick]=sl.dataset.slot;r.pick=null;draw();}
  });
  slotsRow.addEventListener('dragover',function(e){
    var sl=e.target.closest('.slot');if(sl){e.preventDefault();sl.classList.add('over');}
  });
  slotsRow.addEventListener('dragleave',function(e){var sl=e.target.closest('.slot');if(sl)sl.classList.remove('over');});
  slotsRow.addEventListener('drop',function(e){
    var sl=e.target.closest('.slot');if(!sl)return;

  });
  wrap.appendChild(bank);wrap.appendChild(slotsRow);
  host.appendChild(wrap);
  draw();
}
function buildMatch(host,d,r,i){

function buildOrder(host,d,r,i){

function buildFill(host,d,r,i){

  if(d.bank){r._bank=r._bank||shuffle(d.bank);wrap.appendChild(el('p','sec small','Word bank (shuffled): <b>'+r._bank.map(esc).join(' · ')+'</b>'));}
  host.appendChild(wrap);
  Array.prototype.forEach.call(wrap.querySelectorAll('input'),function(inp){
    inp.addEventListener('input',function(){r.vals[parseInt(inp.dataset.blank,10)]=inp.value;});
  });
}
function buildTerm(host,d,r,i){
  r.log=r.log||[];r.limit=(d.timeLimit?d.timeLimit:null);
  var wrap=el('div','term');wrap.id='anshost';
  var scroll=el('div','scroll');
  scroll.setAttribute('aria-live','polite');
  r.log.forEach(function(l){scroll.appendChild(el('div',null,esc(l)));});
  var inrow=el('div','inrow');
  var pr=el('span','prompt',esc(d.prompt)+' ');
  var inp=document.createElement('input');
  inp.setAttribute('aria-label','Command line');inp.spellcheck=false;inp.autocapitalize='off';inp.autocomplete='off';
  inrow.appendChild(pr);inrow.appendChild(inp);
  wrap.appendChild(scroll);wrap.appendChild(inrow);
  host.appendChild(wrap);
  r._scroll=scroll;r._inp=inp;r._prompt=d.prompt;
  if(r.log.length===0){
    (d.banner||['% Connection to simulated device established. Read-only lab.','% Type the command you want to run, then press Enter. Check grades your last command.']).forEach(function(l){termEcho(d,r,l);});
  }
  inp.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;
    var cmd=inp.value;inp.value='';
    r.lastCmd=cmd;
    termEcho(d,r,d.prompt+' '+cmd);
    var sim=simulate(d,cmd);
    sim.forEach(function(l){termEcho(d,r,l);});
  });
  if(d.syntax){
    var sp=el('div','synpanel','<span class="st">SYNTAX REMINDER</span><pre>'+esc(d.syntax)+'</pre>');
    host.appendChild(sp);
  }
}
function termEcho(d,r,line){
  r.log.push(line);
  if(r._scroll){r._scroll.appendChild(el('div',null,esc(line)));r._scroll.scrollTop=r._scroll.scrollHeight;}
}
function simulate(d,cmd){
  var n=normCmd(cmd);
  if(!n.trim())return ['% (nothing typed)'];
  var allOk=true,forbiddenHit=null;
  d.elements.forEach(function(e2){if(!(new RegExp(e2.accept,'i')).test(n))allOk=false;});
  (d.forbidden||[]).forEach(function(f){if((new RegExp(f.match,'i')).test(n))forbiddenHit=f;});
  if(forbiddenHit)return ['% ERROR — refused in this safe lab: this command would change device state or destroy evidence.','% Nothing was executed. Think about what the scenario actually needs.'];
  if(allOk)return d.out||['% OK'];
  return ['% Invalid input or wrong command for this task.','% (Hint of behaviour: the device answers only the expected command shape.)'];
}
function buildBranch(host,d,r,i){
  r.branchStep=r.branchStep||0;r.choices=r.choices||[];
  var st=r.branchStep;
  if(st>=d.steps.length)st=d.steps.length-1;
  var step=d.steps[st];
  if(!r.choices[st]&&r.choices[st]!==0)r.choices[st]=-1;
  var wrap=el('div','opts');wrap.id='anshost';
  var labels=['A','B','C','D','E','F'];
  var shKey='sh'+st;
  d._bsh=d._bsh||{};if(!d._bsh[shKey])d._bsh[shKey]=shuffle(step.opts.map(function(o,k){return k;}));
  d._bsh[shKey].forEach(function(oi,pos){
    var b=el('button','opt'+(r.choices[st]===oi?' sel':''));
    b.type='button';
    b.innerHTML='<span class="olabel">'+labels[pos]+'.</span><span>'+esc(step.opts[oi])+'</span><span class="selword">● selected</span>';
    b.addEventListener('click',function(){
      if(r.stepLocked)return;
      r.choices[st]=oi;
      Array.prototype.forEach.call(wrap.children,function(c){c.classList.remove('sel');});
      b.classList.add('sel');
    });
    wrap.appendChild(b);
  });
  host.appendChild(wrap);
  var confirm=el('button','primary','Confirm step '+(st+1)+' →');
  confirm.style.marginTop='10px';
  confirm.addEventListener('click',function(){
    if(r.choices[st]==null||r.choices[st]<0)return;
    r.stepLocked=false;
    if(r.branchStep<d.steps.length-1){
      r.branchStep++;
      var q=$('excard').querySelector('.b-question .qtext');
      q.innerHTML='<span class="chip">STEP '+(r.branchStep+1)+' OF '+d.steps.length+'</span> '+esc(d.steps[r.branchStep].q);
      rebuildAnswer(d,r);
    }else{
      doCheck(d,r,true);
    }
  });
  host.appendChild(confirm);
}
function rebuildAnswer(d,r){
  var ab=$('anshost').parentNode;
  ab.innerHTML='';
  buildAnswer(ab,d,r,exIdx());
}

/* ---------- answer guards ---------- */
function hasAnswer(d,r){
  if(d.kind==='mcq')return r.sel!=null&&r.sel>=0;
  if(d.kind==='multi')return r.sel&&r.sel.length>0;
  if(d.kind==='dd')return Object.keys(r.placed||{}).length>0;
  if(d.kind==='match')return Object.keys(r.pairs||{}).length>0;
  if(d.kind==='order')return (r.order||[]).length>0;
  if(d.kind==='fill')return (r.vals||[]).some(function(v){return v&&v.trim();});
  if(d.kind==='term')return ((r._inp&&r._inp.value.trim())||r.lastCmd||'').trim().length>0;
  if(d.kind==='branch')return r.choices[r.branchStep]!=null&&r.choices[r.branchStep]>=0;
  return false;
}
function autoSubmit(i){
  var d=EX[i],r=EXR(i);
  if(r.checked)return;
  r.autoTimed=true;
  doCheck(d,r,false);
}

/* ---------- hint / skip / pause ---------- */
function showHint(i,d,r){

  if(!hb){hb=el('div');hb.id='hintboxhost';$('excard').appendChild(hb);}

function doSkip(){
  var i=exIdx(),r=EXR(i);
  if(r.checked)return;

  S.pos++;renderExam();
}
function manualPause(){
  if(S.tstate!=='RUNNING'&&S.tstate!=='PAUSED_AUTO_CHECK')return;
  var prev=S.tstate;
  setPause('manual',true);
  S.tstate='PAUSED_MANUAL';S.prevT=prev;

    '<p>The exercise is hidden so you cannot read or answer it while paused. The timer is stopped. Press Resume to return exactly where you were.</p>';

/* ================= SCORING ================= */
function normCmd(s){
  return String(s||'').toLowerCase().replace(/\s+/g,' ').replace(/\[\.\]/g,'.').replace(/;/g,' ').trim();
}
function normWord(s){
  return String(s||'').toLowerCase().replace(/\s+/g,' ').replace(/[.,;:!?"']/g,'').trim();
}
function scoreExercise(H,W,N){var c=Math.max(0,(H-W)/Math.max(1,N));return c;}
function grade(d,r){
  var rows=[],H=0,W=0,N=1;
  var labels=['A','B','C','D','E','F'];
  if(d.kind==='mcq'){
    N=1;var sel=r.sel;
    d._shuf.forEach(function(oi,pos){
      var chosen=(sel===oi);
      if(oi===d.correct){
        rows.push({ic:chosen?'✓':'○',w:chosen?'Correct':'Missed',cls:chosen?'i-correct':'i-missed',txt:'Option '+labels[pos]+' — “'+d.opts[oi]+'”'+(chosen?' — you chose it. ':' — this was the correct answer. ')+d.optWhy[oi]});
      }else if(chosen){
        W++;rows.push({ic:'✗',w:'Wrong',cls:'i-wrong',txt:'Option '+labels[pos]+' — “'+d.opts[oi]+'” — you chose it. '+d.optWhy[oi]});
      }
    });
    H=(sel===d.correct)?1:0;
  }else if(d.kind==='multi'){
    N=d.correct.length;
    var selA=r.sel||[];
    d._shuf.forEach(function(oi,pos){
      var isC=d.correct.indexOf(oi)>=0,isS=selA.indexOf(oi)>=0;
      if(isC&&isS){H++;rows.push({ic:'✓',w:'Correct',cls:'i-correct',txt:d.opts[oi]+' — you selected it. '+d.optWhy[oi]});}
      else if(!isC&&isS){W++;rows.push({ic:'✗',w:'Wrong',cls:'i-wrong',txt:d.opts[oi]+' — you selected it, but it is not correct here. '+d.optWhy[oi]});}
      else if(isC&&!isS){rows.push({ic:'○',w:'Missed',cls:'i-missed',txt:d.opts[oi]+' — you missed this correct item. '+d.optWhy[oi]});}
      else{rows.push({ic:'·',w:'Left out',cls:'i-missed',txt:d.opts[oi]+' — you left it out; that was right, it is not part of the answer. '+d.optWhy[oi]});}
    });
  }else if(d.kind==='dd'){
    N=d.items.length;
    d.items.forEach(function(it){
      var put=r.placed[it.id],sol=d.sol[it.id];
      var slotName=function(id){var s=d.slots.filter(function(x){return x.id===id;})[0];return s?s.label:id;};
      if(put===sol){H++;rows.push({ic:'✓',w:'Correct',cls:'i-correct',txt:'“'+it.text+'” → '+slotName(sol)+'. '+d.slotWhy[sol]});}
      else if(put){W++;rows.push({ic:'✗',w:'Wrong',cls:'i-wrong',txt:'“'+it.text+'” → you placed it in “'+slotName(put)+'”, but it belongs in “'+slotName(sol)+'”. '+d.slotWhy[sol]});}
      else{rows.push({ic:'○',w:'Missed',cls:'i-missed',txt:'“'+it.text+'” — you did not place it. It belongs in “'+slotName(sol)+'”. '+d.slotWhy[sol]});}
    });
  }else if(d.kind==='match'){
    N=d.left.length;
    d.left.forEach(function(L){
      var got=r.pairs[L.id],sol=d.sol[L.id];
      var rn=function(id){var x=d.right.filter(function(y){return y.id===id;})[0];return x?x.text:id;};
      if(got===sol){H++;rows.push({ic:'✓',w:'Correct',cls:'i-correct',txt:'“'+L.text+'” ↔ “'+rn(sol)+'”. '+d.pairWhy[L.id]});}
      else if(got){W++;rows.push({ic:'✗',w:'Wrong',cls:'i-wrong',txt:'“'+L.text+'” ↔ “'+rn(got)+'” — not the right pair. It pairs with “'+rn(sol)+'”. '+d.pairWhy[L.id]});}
      else{rows.push({ic:'○',w:'Missed',cls:'i-missed',txt:'“'+L.text+'” — unpaired. It pairs with “'+rn(sol)+'”. '+d.pairWhy[L.id]});}
    });
  }else if(d.kind==='order'){
    N=d.items.length;
    r.order.forEach(function(id,pos){
      var it=null;d.items.forEach(function(x){if(x.id===id)it=x;});
      var good=(d.items[pos].id===id);
      if(good){H++;rows.push({ic:'✓',w:'Correct',cls:'i-correct',txt:'Position '+(pos+1)+': “'+it.text+'” is where it belongs. '+(d.why[it.id]||'')});}
      else{W++;rows.push({ic:'✗',w:'Wrong',cls:'i-wrong',txt:'Position '+(pos+1)+': “'+it.text+'” is not right here — “'+d.items[pos].text+'” belongs there. '+(d.why[d.items[pos].id]||'')});}
    });
  }else if(d.kind==='fill'){
    N=d.blanks.length;
    d.blanks.forEach(function(B,bi){
      var v=r.vals?r.vals[bi]:undefined;
      var nv=normWord(v);
      var ok=B.accept.some(function(a){return typeof a==='string'?normWord(a)===nv:(new RegExp(a.re,'i')).test(nv);});
      if(!v||!v.trim()){rows.push({ic:'○',w:'Missed',cls:'i-missed',txt:'Blank '+(bi+1)+' — left empty. Expected: '+B.show+'. '+d.why[bi]});}
      else if(ok){H++;rows.push({ic:'✓',w:'Correct',cls:'i-correct',txt:'Blank '+(bi+1)+' = “'+v.trim()+'”. '+d.why[bi]});}
      else{W++;rows.push({ic:'✗',w:'Wrong',cls:'i-wrong',txt:'Blank '+(bi+1)+' = “'+v.trim()+'”, expected '+B.show+'. '+d.why[bi]});}
    });
  }else if(d.kind==='term'){
    N=d.elements.length;
    var typed=normCmd((r._inp&&r._inp.value.trim())||r.lastCmd||'');
    d.elements.forEach(function(e2){
      if((new RegExp(e2.accept,'i')).test(typed)){H++;rows.push({ic:'✓',w:'Correct',cls:'i-correct',txt:'Element “'+e2.label+'” found in your command. '+e2.why});}
      else{rows.push({ic:'○',w:'Missed',cls:'i-missed',txt:'Element “'+e2.label+'” missing from your command. '+e2.why});}
    });
    (d.forbidden||[]).forEach(function(f){
      if((new RegExp(f.match,'i')).test(typed)){
        W++;
        rows.push({ic:'✗',w:f.dangerous?'DANGEROUS — NEAR MISS':'Wrong',cls:'i-wrong',txt:'Your command contains “'+f.label+'”. '+f.why});
      }
    });
  }else if(d.kind==='branch'){
    N=d.steps.length;
    d.steps.forEach(function(st,k){
      var c=r.choices[k];
      if(c===st.correct){H++;rows.push({ic:'✓',w:'Correct',cls:'i-correct',txt:'Step '+(k+1)+': you chose “'+st.opts[c]+'”. '+st.why[st.correct]});}
      else if(c!=null&&c>=0){W++;rows.push({ic:'✗',w:'Wrong',cls:'i-wrong',txt:'Step '+(k+1)+': you chose “'+st.opts[c]+'”. The best choice was “'+st.opts[st.correct]+'”. '+st.why[st.correct]});}
      else{rows.push({ic:'○',w:'Missed',cls:'i-missed',txt:'Step '+(k+1)+': not answered. '+st.why[st.correct]});}
    });
  }
  var credit=scoreExercise(H,W,N);
  if(S.hint[exIdxOf(d)])credit=Math.max(0,credit-0.10);
  var label=credit>=0.999?'CORRECT':(credit>0?'PARTIALLY CORRECT':'INCORRECT');
  return {credit:credit,rows:rows,label:label,N:N,H:H,W:W,typed:d.kind==='term'?normCmd((r._inp&&r._inp.value.trim())||r.lastCmd||''):null};
}
function exIdxOf(d){for(var i=0;i<EX.length;i++)if(EX[i]===d)return i;return -1;}

/* ---------- check & feedback ---------- */
function doCheck(d,r,isFinal){
  var i=exIdx();
  if(r.checked)return;
  if(d.kind==='term'){if(r._inp&&r._inp.value.trim())r.lastCmd=r._inp.value;}
  /* mandatory: first action sets the auto-pause state */
  if(S.tstate==='RUNNING'){setPause('fb',true);S.tstate='PAUSED_AUTO_CHECK';}
  var g=grade(d,r);
  r.checked=true;r.base=g;
  S.checked[i]=true;
  if(S.skipped.indexOf(i)>=0)S.skipped=S.skipped.filter(function(x){return x!==i;});
  if(S.answered.indexOf(i)<0)S.answered.push(i);
  S.credit[i]=g.credit;
  renderFeedback(d,r,g);
  lockAnswer(d,r);
  paintHeader();
  paintNav(d,r,$('excard').parentNode.querySelector('.warnline'));
  var nb=$('nextBtn');if(nb)nb.focus();
}
function renderFeedback(d,r,g){
  var host=$('fbhost');if(!host)return;
  host.innerHTML='';
  var cls=g.label==='CORRECT'?'f-correct':(g.label==='PARTIALLY CORRECT'?'f-partial':'f-incorrect');
  var ic=g.label==='CORRECT'?'✓':(g.label==='PARTIALLY CORRECT'?'✓':'✗');
  var creditLine=(g.N>1)?('credit '+g.credit.toFixed(2)+' — '+Math.round(g.credit*g.N*100)/100+' of '+g.N+' items, formula (H − W) / N = ('+g.H+' − '+g.W+') / '+g.N):('credit '+g.credit.toFixed(2));
  if(S.hint[exIdxOf(d)])creditLine+=' (includes −0.10 hint penalty)';
  if(r.autoTimed)creditLine+=' · ⏱ exercise timer expired — answer auto-submitted';
  var f=el('div','fb '+cls);
  var h='<div class="fbhead"><span>'+ic+' '+g.label+'</span><span class="credit">'+esc(creditLine)+'</span></div>';
  if(g.rows&&g.rows.length)h+='<div class="rows">'+g.rows.map(function(row){
    return '<div class="irow"><span class="iic '+row.cls+'" aria-label="'+row.w+'">'+row.ic+'</span><span><b class="'+row.cls+'">'+esc(row.w)+'</b> — '+esc(row.txt)+'</span></div>';
  }).join('')+'</div>';
  h+='<div class="fball">'+d.fb+'</div>';
  if(d.kind==='term'){
    h+='<div class="canon"><div class="clabel">✓ CANONICAL COMMAND (copyable)</div><pre>'+esc(d.canonical)+'</pre><pre class="sec small" style="color:var(--text-secondary)">'+esc(d.canonExpl||'')+'</pre></div>';
  }
  if(d.study)h+='<div class="study"><b>What to study:</b> '+esc(d.study)+'</div>';
  f.innerHTML=h;
  host.appendChild(f);
  var cb=el('button',null,'📋 Copy canonical command');
  cb.style.marginTop='8px';
  if(d.kind==='term')cb.addEventListener('click',function(){
    try{navigator.clipboard.writeText(d.canonical);}catch(e){}
    cb.textContent='✓ Copied';
    cb.disabled=true;
  });
  if(d.kind==='term')f.appendChild(cb);
}

/* ---------- review-skipped screen ---------- */
function finishAttempt(){

}

/* ---------- results ---------- */
function endExam(reason){

}

  var br=el('div','card');

    '<div class="stat s-partial"><div class="sn">✓ '+part+'</div><div class="sl">Partially correct'+(part?(' — avg '+(Math.round(100*partSum/part)/100).toFixed(2)):'')+'</div></div>'+
    '<div class="stat s-incorrect"><div class="sn">✗ '+zero+'</div><div class="sl">Fully incorrect (credit 0.00)</div></div>'+

  '</div>';
  var tt=el('table','timetable');
  tt.innerHTML='<tr><td>⏱ Time remaining (timer budget '+fmt(D.meta.timerSec)+')</td><td>'+fmt(S.remaining)+'</td></tr>'+
    '<tr><td>▶ Time spent with timer running</td><td>'+fmt(S.elapsed)+'</td></tr>'+
    '<tr><td>⏸ Time paused manually (breaks)</td><td>'+fmt(S.pausedManualSec)+'</td></tr>'+
    '<tr><td>⏸ Time paused reviewing feedback (auto-pause)</td><td>'+fmt(S.pausedFbSec)+'</td></tr>';
  br.appendChild(tt);
  w.appendChild(br);

  var rl=el('div','card');
  rl.innerHTML='<h2>🧾 Per-exercise results</h2><div class="reslist"></div>';
  var listEl=rl.querySelector('.reslist');
  S.list.forEach(function(i,k){
    var d=EX[i],r=EXR(i);
    var ic,w2,cl;
    if(S.skipped.indexOf(i)>=0||!S.checked[i]){ic='⚠';w2='Skipped — excluded';cl='i-missed';}
    else{
      var c=S.credit[i]||0;
      if(c>=0.999){ic='✓';w2='Fully correct';cl='i-correct';}
      else if(c>0){ic='✓';w2='Partially correct ('+(Math.round(c*100)/100).toFixed(2)+')';cl='i-partial';}
      else{ic='✗';w2='Fully incorrect';cl='i-wrong';}
    }
    var row=el('div','resrow');
    row.innerHTML='<span class="ric '+cl+'">'+ic+' '+esc(w2)+'</span><span>'+(k+1)+'. '+esc(d.scenario.summary)+'</span>';
    listEl.appendChild(row);
  });
  w.appendChild(rl);
  app().appendChild(w);
  paintHeader();
}

/* ---------- site contract: score report (STEP 6.2) ---------- */
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:D.meta.topicId,
      batch:D.meta.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=D.meta.passMark
    },location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}

/* ---------- site contract: handshake (STEP 6.3) ---------- */
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  if(!S)S=freshState();
  S.user.name=String(event.data.username||'').slice(0,40);
  S.user.country=String(event.data.country||'');
  S.user.locale=String(event.data.locale||'');
  /* theme field is always 'dark' — the file is dark-only, nothing to switch */
});

/* ---------- boot ---------- */
S=freshState();
renderIntro();
})();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
