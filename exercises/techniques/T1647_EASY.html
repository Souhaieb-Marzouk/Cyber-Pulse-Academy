<script type="application/json" id="cm-exam-data">{"meta":{"objectId":"T1647","objectLine":"T1647 — Plist File Modification (Enterprise technique, macOS, tactic Defense Impairment)","topicId":"t1647","batch":1,"title":"T1647 Plist File Modification — EASY","difficulty":"easy","sevClass":"easy","questionCount":16,"estimatedMinutes":25,"passMark":70,"severity":"EASY","timerBudget":1500},"intro":{"learn":"<p><b>Welcome!<\/b> This exam teaches you the MITRE ATT&amp;CK technique <b>T1647 — Plist File Modification<\/b>. This is a <b>Technique<\/b> page in the ATT&amp;CK framework. A technique describes <b>how<\/b> an attacker does one specific thing. T1647 describes how an attacker changes <b>plist files<\/b> on <b>macOS<\/b> computers to hide malicious software or to make it start again and again.<\/p><p>Imagine you are a <b>SOC analyst<\/b> (a person who watches security alerts). One day your Mac security tool shows that a small settings file was changed. Is that bad? With the knowledge from this exam, you will know what plist files are, which keys attackers like to change, and what to check next.<\/p><p>You will also see why <b>detection engineers<\/b> (people who write alert rules), <b>incident responders<\/b> (people who clean up attacks), and <b>macOS administrators<\/b> all care about this technique. You will meet the simple tools involved, like <b>defaults<\/b>, <b>plutil<\/b>, and text editors. You will learn the one mitigation ATT&amp;CK lists for this technique: <b>M1013 — Application Developer Guidance<\/b>, which asks app makers to use Apple's <b>hardened runtime<\/b> (a stricter, safer way to run apps). Everything here is written in simple words, and every new term is explained when it first appears.<\/p>","keywords":[{"theme":"The technique itself","tags":["T1647","Plist File Modification","plist files","Info.plist","key-value pairs","binary vs XML format"]},{"theme":"Where it sits in ATT&CK","tags":["Enterprise technique","macOS platform","Defense Impairment tactic (formerly Defense Evasion)","no sub-techniques"]},{"theme":"Keys and folders","tags":["LSUIElement","LSEnvironment","~/Library/LaunchAgents","com.apple.dock.plist","Info.plist keys"]},{"theme":"Tools you will see","tags":["defaults","plutil","text editors (vim, nano)","dockutil (third-party)"]},{"theme":"First defence steps","tags":["M1013 Application Developer Guidance","hardened runtime","macOS unified log","spotting plist changes"]}],"how":"<ul class=\"howlist\"><li><b>Goal:<\/b> pass with at least <b>70%<\/b>. A pass means you know the basics of T1647. A fail means you should retake it after a short break.<\/li><li><b>16 exercises<\/b> wait for you: log reading, multiple choice, matching pairs, fill-in-the-blank, drag &amp; drop, ordering steps, one guided terminal task, and one small multi-select.<\/li><li><b>Timer:<\/b> you have <b>25 minutes<\/b>. The timer in the header counts down. Press <b>Pause<\/b> for a real break — the exercise is hidden while paused.<\/li><li><b>Check buys time:<\/b> the moment you press <b>Check<\/b>, the timer stops (the header shows ⏸ “reviewing feedback”). Read the explanation as long as you want. The timer runs again only when you press <b>Next<\/b>.<\/li><li><b>Partial credit:<\/b> exercises with several items (matching, drag &amp; drop, blanks, multi-select) give you a share of the points. Wrong picks subtract, so do not select everything.<\/li><li><b>Hints:<\/b> one hint per exercise is allowed. It costs 10% of that exercise's credit.<\/li><li><b>Skipping:<\/b> press <b>Skip<\/b> to park an exercise. Before the exam finishes you may return to skipped ones and answer them. Skipped-and-never-answered exercises are excluded from your score.<\/li><\/ul>"},"exercises":[{"id":"ez01","type":"log","summary":"Unified log line — a settings file for the Dock was changed","scenario":[{"label":"ARTEFACT 1 — macOS unified log (one line)","code":"2026-05-11 09:14:02  macos:unifiedlog  write  /Users/jdoe/Library/Preferences/com.apple.dock.plist  modified by process: defaults"}],"question":"Look at the file path in this log line. What is happening here?","hint":"The path ends with .plist. Plist files store macOS settings. One of the answers says exactly that in simple words.","explain":"The log line shows a write to a .plist file. Plist files are macOS settings files. A change to com.apple.dock.plist changes the apps shown in the Dock. That is exactly the behaviour technique T1647 describes: modifying plist files to influence how the system behaves.","persp":{"red":"An attacker adds a malicious app path to com.apple.dock.plist so a bad app shows up (or hides) in the Dock and users click it.","blue":"A SOC analyst watches the unified log for writes to plist files. A change to Dock or LaunchAgents plists is worth a second look."},"study":"Technique T1647 — Plist File Modification: plist files store key-value settings for macOS apps.","lines":["2026-05-11 09:14:02  macos:unifiedlog  write  /Users/jdoe/Library/Preferences/com.apple.dock.plist  modified by process: defaults"],"sub":{"type":"mcq","options":[{"t":"A macOS settings file (plist) for the Dock was changed"},{"t":"A user downloaded a movie file to the Downloads folder"},{"t":"A new user account was created on the Mac"},{"t":"The Mac connected to a Wi-Fi network"}],"answer":0}},{"id":"ez02","type":"fill","summary":"What a plist file is on macOS","scenario":[{"label":"ARTEFACT 1 — ATT&CK excerpt (T1647)","text":"macOS applications use plist files, such as the info.plist file, to store properties and configuration settings that inform the operating system how to handle the application at runtime. Plist files are structured metadata in key-value pairs."}],"question":"Complete the sentence about plist files. Use the excerpt above.","hint":"The excerpt says “key-value pairs”. One word in the bank below names this kind of file.","explain":"The missing word is “settings”. A plist (property list) file is a settings file. It stores key-value pairs — a key is a name, and the value is its setting. Apps like Info.plist tell macOS how to treat the app. Attackers change these pairs to change app and system behaviour, which is why T1647 exists. The other bank words are wrong for obvious reasons: a plist is not a password vault, not a video file, and not a network list.","study":"T1647 works because plist files control real behaviour — changing a value changes what macOS does.","segments":["A plist file is a ",{"blank":{"label":"what kind of file","accept":["settings","setting","preferences","config","configuration"]}}," file that stores key-value pairs for apps."],"bank":["settings","password","video","network"]},{"id":"ez03","type":"match","summary":"Match LaunchAgent plist keys to what they do","scenario":[{"label":"ARTEFACT 1 — LaunchAgent plist excerpt (~/Library/LaunchAgents/)","code":"<key>Label<\/key>        <string>com.updater.helper<\/string>\n<key>ProgramArguments<\/key> <string>/Users/Shared/.upd/helper<\/string>\n<key>RunAtLoad<\/key>     <true/>"}],"question":"Match each plist key on the left to what it does on the right.","hint":"Read each key's name like a sentence: Program-Arguments = what program to run; Run-At-Load = run when loaded.","explain":"Label is the agent's unique name. ProgramArguments is the command the agent runs — here a hidden program in /Users/Shared/.upd. RunAtLoad means: run it as soon as the agent loads (for example at login). An attacker who writes these keys gets their program started automatically.","study":"LaunchAgent plists with ProgramArguments + RunAtLoad are a classic macOS persistence trick.","left":[{"t":"Label"},{"t":"ProgramArguments"},{"t":"RunAtLoad"}],"right":[{"t":"the unique name of the agent"},{"t":"the command the agent runs"},{"t":"run it as soon as the agent loads"}]},{"id":"ez04","type":"mcq","summary":"Which folder holds per-user Launch Agents","scenario":[{"label":"ARTEFACT 1 — ATT&CK excerpt (T1647 detection)","text":"Monitor for unexpected modifications of plist files in persistence or configuration directories (e.g., ~/Library/LaunchAgents, ~/Library/Preferences, /Library/LaunchDaemons)."}],"question":"Which of these folders holds Launch Agents for one single user?","hint":"In macOS paths, the tilde (~) means “this user's home folder”. One option starts with ~.","explain":"~/Library/LaunchAgents is inside one user's home folder, so agents there run only for that user. /Library/LaunchDaemons is system-wide and runs before login for the whole machine. Knowing which folder a suspicious plist sits in tells you how wide the impact is.","study":"~/Library/LaunchAgents = per user. /Library/LaunchDaemons = whole system (runs as root).","options":[{"t":"~/Library/LaunchAgents"},{"t":"/Library/LaunchDaemons"},{"t":"/System/Library/Fonts"},{"t":"/Users/Shared/Movies"}],"answer":0},{"id":"ez05","type":"fill","summary":"Fill the blanks: Info.plist and LSUIElement","scenario":[{"label":"ARTEFACT 1 — Note from your teammate","text":"Each macOS app bundle carries a settings file. Attackers flip one key in it to make their app run in the background without a Dock icon. Fill the two missing words below."}],"question":"Complete the two blanks using the word bank.","hint":"The settings file inside an app bundle is called Info.plist. The key that hides the app is LSUIElement.","explain":"The app's settings file is Info.plist. Setting LSUIElement to true makes macOS treat the app as a background agent: no Dock icon, no normal window. T1647 names this exact trick — attackers use it to hide the execution of an application.","study":"LSUIElement = true in Info.plist means the app hides from the Dock and App Switcher.","segments":["macOS apps keep their settings in a file called ",{"blank":{"label":"the app settings file","accept":["info.plist"]}},". An attacker sets the key ",{"blank":{"label":"the key that hides the app","accept":["lsuielement"]}}," to true, so the app runs without a Dock icon."],"bank":["Info.plist","LSUIElement","DockPass","NetFilter"]},{"id":"ez06","type":"dnd","summary":"Which plist or folder matches which description","scenario":[{"label":"ARTEFACT 1 — Cheat sheet from your onboarding","text":"Three names come back again and again in macOS investigations. Drag each name onto the sentence that describes it."}],"question":"Drag each item onto the target that matches it.","hint":"Two items are file names and one is a folder. The Dock one talks about apps in the Dock.","explain":"com.apple.dock.plist controls which apps appear in the Dock. ~/Library/LaunchAgents is the per-user folder where Launch Agent plists live. Info.plist is the settings file inside every app bundle. T1647 is about changing exactly these kinds of files.","study":"Learn these three names by heart — they appear in nearly every macOS plist investigation.","items":[{"t":"com.apple.dock.plist"},{"t":"~/Library/LaunchAgents"},{"t":"Info.plist"}],"slots":[{"label":"The Dock's own settings file","accept":0},{"label":"Folder with per-user Launch Agent plists","accept":1},{"label":"Settings file inside an app bundle","accept":2}]},{"id":"ez07","type":"mcq","summary":"Which tactic does T1647 belong to","scenario":[{"label":"ARTEFACT 1 — ATT&CK excerpt (T1647)","text":"Adversaries may modify property list files (plist files) to enable other malicious activity, while also potentially evading and bypassing system defenses."}],"question":"Changing plist files helps an attacker hide and keep access. Which ATT&CK tactic does T1647 belong to?","hint":"A tactic is the attacker's goal. The excerpt says the goal is to evade and bypass defences.","explain":"T1647 sits in the Defense Impairment tactic (this tactic was called Defense Evasion in older ATT&CK versions). Its goal: weaken or bypass the system's defences and visibility. The plist changes can also enable persistence, but the technique itself is classified under this defensive-bypass goal.","study":"Tactic = the attacker's goal (the column in the ATT&CK matrix). Technique = the method used.","options":[{"t":"Defense Impairment (formerly Defense Evasion)"},{"t":"Reconnaissance"},{"t":"Exfiltration"},{"t":"Resource Development"}],"answer":0},{"id":"ez08","type":"order","summary":"Put the LSUIElement hiding steps in order","scenario":[{"label":"ARTEFACT 1 — What the attacker wants","text":"An attacker has dropped a malicious app called CleanIt.app on a Mac. They want it to run without showing up in the Dock. Put their three steps in the right order."}],"question":"Order the steps from first to last.","hint":"First they must open the settings file, then change the key, then start the app.","explain":"Step 1: open CleanIt.app/Contents/Info.plist. Step 2: set LSUIElement to true. Step 3: launch the app — macOS now runs it as a background agent with no Dock icon. This is the LSUIElement hiding trick that T1647 and XCSSET (S0658) both show in the wild.","study":"The LSUIElement trick needs three things: the file, the key, the relaunch.","items":[{"t":"Open CleanIt.app/Contents/Info.plist"},{"t":"Set the LSUIElement key to true"},{"t":"Launch CleanIt.app — it runs with no Dock icon"}]},{"id":"ez09","type":"terminal","summary":"Guided terminal — convert a plist to XML with plutil","scenario":[{"label":"ARTEFACT 1 — Ticket #2104 (triage note)","text":"A suspicious file /Users/jdoe/Library/Preferences/suspect.plist was found. It is in binary format, so you cannot read it in a text editor. Your lead asks you to convert it to XML text so it can be read. Do it now in the terminal below."}],"question":"Type the command that converts suspect.plist to XML text format.","hint":"Use the plutil tool with -convert and the XML format name xml1, then the file name.","explain":"plutil is a built-in macOS tool that converts, checks and prints plist files. You converted the binary plist into XML text so humans and tools can read it. Reading is safe: the command only writes a new readable version of the file. Binary plists are also a small evasion trick — malware saves plists in binary so a quick look in a text editor shows nothing useful.","persp":{"red":"Attackers keep some plists in binary1 format so casual inspection fails; converting to XML1 makes analysis easy.","blue":"Analysts convert suspicious plists to XML before review — a read-only conversion that changes no system settings."},"study":"plutil -convert xml1 turns a binary plist into readable XML text.","host":"analyst@macbook-fin-07 triage","prompt":"analyst@macbook-fin-07 ~ %","introLines":["# Ticket #2104 — convert the plist so it can be read"],"elements":[{"label":"the tool: plutil","any":["plutil"]},{"label":"the action: -convert xml1","any":["-convert xml1","-convert  xml1"]},{"label":"the target file: suspect.plist","any":["suspect.plist"]}],"canonical":"plutil -convert xml1 suspect.plist","parts":[{"label":"plutil","desc":"built-in macOS tool for plist files"},{"label":"-convert xml1","desc":"convert to XML text (binary1 would go the other way)"},{"label":"suspect.plist","desc":"the file from ticket #2104"}],"danger":[{"any":["-convert binary1"],"note":"that command would convert the file back INTO binary, making it harder to read, not easier."}],"dangerNote":"converting TO binary1 makes the file harder to read — you wanted XML text.","outputSample":["<?xml version=\"1.0\" encoding=\"UTF-8\"?>","<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"hxxp://www.apple.com/DTDs/PropertyList-1.0.dtd\">","<plist version=\"1.0\">","<dict>  ... readable keys now ...  <\/dict>","<\/plist>"],"syntax":"plutil -convert <format> <file>\n  formats: xml1 = XML text, binary1 = binary\n  example on a different file: plutil -convert xml1 /tmp/notes.plist\n  expected output: the plist header lines appear in XML text","timeLimit":null},{"id":"ez10","type":"mcq","summary":"Which platform does T1647 apply to","scenario":[{"label":"ARTEFACT 1 — ATT&CK technique header (T1647)","text":"T1647 — Plist File Modification. Domain: Enterprise. Platforms: macOS. Sub-techniques: none."}],"question":"On which platform can attackers use T1647?","hint":"Plist files belong to one operating system family made by Apple. The header names it.","explain":"T1647 applies to macOS. Plist files are a macOS concept — Windows uses the Registry, and Linux uses dotfiles and unit files instead. Knowing the platform tells you which computers the detection and response steps apply to.","study":"T1647 = macOS only. The same idea on Windows would be a different technique (Registry changes).","options":[{"t":"macOS"},{"t":"Windows"},{"t":"Android"},{"t":"Cisco IOS"}],"answer":0},{"id":"ez11","type":"fill","summary":"Fill the blanks: technique vs tactic","scenario":[{"label":"ARTEFACT 1 — Whiteboard photo (text version)","text":"Your mentor drew two boxes on the whiteboard: one labelled WHY the attacker acts, one labelled HOW the attacker acts. ATT&CK has a word for each box."}],"question":"Fill the two blanks with the right ATT&CK words.","hint":"T1647 is one specific method (a technique). Defense Impairment is the goal column (a tactic).","explain":"A technique describes HOW the attacker acts — T1647 is one technique. A tactic describes WHY — the goal, like Defense Impairment. Every technique lives in one or more tactic columns of the ATT&CK matrix. This two-word distinction is the base of all ATT&CK work.","study":"Tactic = goal (matrix column). Technique = method (a cell in that column).","segments":["In ATT&CK, a ",{"blank":{"label":"HOW word","accept":["technique"]}}," describes how an attacker does one specific thing, while a ",{"blank":{"label":"WHY word","accept":["tactic"]}}," describes the attacker's goal."],"bank":["technique","tactic","playbook","signature"]},{"id":"ez12","type":"log","summary":"Log line — a plist was converted to binary","scenario":[{"label":"ARTEFACT 1 — macOS unified log (one line)","code":"2026-05-11 10:22:47  macos:unifiedlog  exec  /usr/bin/plutil -convert binary1 /Users/jdoe/Library/Preferences/com.apple.dock.plist  user: jdoe"}],"question":"Select the TWO things this command did to the Dock's plist.","hint":"binary1 is a format name. Converting TO binary makes the file harder to read as text.","explain":"The command rewrote the plist in binary format. A binary plist looks like garbage in a text editor, so a quick human review shows nothing. Tools like plutil -p can still print it. Turning plists binary is a small evasion move that fits T1647's goal of bypassing defences and visibility.","persp":{"red":"Saving a modified plist as binary1 slows down a responder who opens it in a text editor.","blue":"A conversion of a user's Dock plist to binary is rare on a normal workday — worth checking what changed inside."},"study":"Binary plists hide their content from text editors; plutil -p prints them read-only.","lines":["2026-05-11 10:22:47  macos:unifiedlog  exec  /usr/bin/plutil -convert binary1 /Users/jdoe/Library/Preferences/com.apple.dock.plist  user: jdoe","2026-05-11 10:23:01  macos:unifiedlog  exec  /usr/bin/killall Dock  user: jdoe"],"sub":{"type":"multi","options":[{"t":"It rewrote the plist in binary format","correct":true,"why":"“binary1” is the name of the binary plist format"},{"t":"It made the file harder to read as plain text","correct":true,"why":"a text editor shows a binary plist as garbage"},{"t":"It deleted the Dock's settings file","why":"“convert” changes the format, it does not delete anything"},{"t":"It sent the plist to a remote server","why":"nothing in the log line touches the network"}]}},{"id":"ez13","type":"match","summary":"Match each tool to its job","scenario":[{"label":"ARTEFACT 1 — Toolbox note (T1647 detection names these tools)","text":"The ATT&CK detection for T1647 says: track use of utilities such as defaults, plutil, or text editors making changes to Info.plist files. Later versions of the malware XCSSET also abused a third-party tool called dockutil."}],"question":"Match each tool to the job it does.","hint":"defaults reads/writes settings, plutil converts and checks plists, vim edits text, dockutil edits the Dock.","explain":"defaults reads and writes plist settings from the command line. plutil converts and checks plist files. vim is a terminal text editor — it can edit an XML plist directly. dockutil is a third-party tool that edits the Dock's plist; XCSSET abused a notarized copy of it. These are the exact tools the T1647 detection watches for.","study":"Detection AN0306 tracks defaults, plutil, and editors touching Info.plist files.","left":[{"t":"defaults"},{"t":"plutil"},{"t":"vim"},{"t":"dockutil"}],"right":[{"t":"reads or writes plist settings from the command line"},{"t":"converts and checks plist files"},{"t":"text editor that can edit an XML plist"},{"t":"third-party tool that edits the Dock's plist"}]},{"id":"ez14","type":"multi","summary":"Which keys does the T1647 text name","scenario":[{"label":"ARTEFACT 1 — ATT&CK excerpt (T1647)","text":"Adversaries can modify the LSUIElement key in an application's info.plist file to run the app in the background. Adversaries can also insert key-value pairs to insert environment variables, such as LSEnvironment."}],"question":"Select the TWO plist keys that this excerpt names.","hint":"Both correct keys start with LS. The other two options are invented network settings.","explain":"The excerpt names LSUIElement (hides the app window) and LSEnvironment (injects environment variables). The two other options are made-up names that no macOS plist uses. Learning the real key names helps you spot them quickly inside a suspicious plist.","study":"LSUIElement and LSEnvironment are real keys abused in T1647 behaviour.","options":[{"t":"LSUIElement","correct":true,"why":"named in the excerpt — hides the app"},{"t":"LSEnvironment","correct":true,"why":"named in the excerpt — injects environment variables"},{"t":"TCP_WINDOW_SCALING","correct":false,"why":"a network tuning name, not a plist key from this technique"},{"t":"GUEST_USER_DISABLED","correct":false,"why":"not a key that appears in the T1647 text"}]},{"id":"ez15","type":"dnd","summary":"Which file does each attacking behaviour touch","scenario":[{"label":"ARTEFACT 1 — ATT&CK excerpt (T1647 behaviours)","text":"Adversaries can add a malicious application path to the com.apple.dock.plist file, which controls apps that appear in the Dock. They can modify the LSUIElement key in an app's Info.plist to run the app in the background."}],"question":"Drag each attacker behaviour onto the file it would touch.","hint":"The Dock file decides what shows in the Dock. The app's own Info.plist decides how the app presents itself.","explain":"Showing a fake or malicious app in the Dock means editing com.apple.dock.plist. Hiding an app from the Dock means flipping LSUIElement inside that app's Info.plist. Both behaviours are listed in T1647 — same technique, two different files, two different goals.","persp":{"red":"One edit (Dock plist) makes the bad app look normal; the other (Info.plist) makes it invisible. Attackers pick based on the deception they want.","blue":"Detections should watch both files: Dock plist writes and Info.plist key changes are both rare on healthy Macs."},"study":"T1647 behaviours map to specific files — com.apple.dock.plist and Info.plist.","items":[{"t":"Make a malicious app appear in the Dock"},{"t":"Run an app in the background with no Dock icon"}],"slots":[{"label":"com.apple.dock.plist","accept":0},{"label":"the app's Info.plist","accept":1}]},{"id":"ez16","type":"mcq","summary":"The mitigation ATT&CK lists for T1647","scenario":[{"label":"ARTEFACT 1 — ATT&CK mitigation row (T1647)","text":"M1013 — Application Developer Guidance: Ensure applications are using Apple's developer guidance which enables hardened runtime."}],"question":"Which mitigation does ATT&CK list for T1647?","hint":"The mitigation is addressed to app developers, not to users. One option matches the row above word for word.","explain":"ATT&CK lists M1013 — Application Developer Guidance. Apple's developer guidance enables the hardened runtime, a stricter app runtime that makes certain code-injection and tampering tricks harder. The other options are real-sounding ATT&CK mitigation names, but they address other techniques, not T1647.","study":"One mitigation row only: M1013. Hardened runtime comes from following Apple's developer guidance.","options":[{"t":"M1013 — Application Developer Guidance"},{"t":"M1033 — Limit Software Installation"},{"t":"M1021 — Restrict Web-Based Content"},{"t":"M1035 — Limit Account Creation"}],"answer":0}]}</script>

    out = out.replace(/(&quot;[^&]*?&quot;)/g, "<span class=\"s\">$1</span>");
    out = out.replace(/(^|\s)(\/[\w.\/~@+-]+)/g, "$1<span class=\"p\">$2</span>");
    out = out.replace(/(^|\s)((?:defaults|plutil|PlistBuddy|dockutil|launchctl|killall|osascript|file|grep|ls|cat|md5|shasum|codesign|spctl|xattr|sqlite3)(?=\s|$))/g, "$1<span class=\"k\">$2</span>");
    return out;
  }

  /* ---------- timer state machine ---------- */
  /* states: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
  function setTimerState(st) {
    S.timer.state = st;
    var el = $("hTState");
    if (st === "RUNNING") { el.textContent = "\u25B6 RUNNING"; el.className = "tstate run"; }
    else if (st === "PAUSED_MANUAL") { el.textContent = "\u23F8 PAUSED \u2014 manual (press Resume)"; el.className = "tstate"; }
    else if (st === "PAUSED_AUTO_CHECK") { el.textContent = "\u23F8 PAUSED \u2014 reviewing feedback (resumes on Next)"; el.className = "tstate"; }
    else { el.textContent = "\u23F9 ENDED"; el.className = "tstate"; }
  }
  function startTicks() {
    if (TICK) clearInterval(TICK);
    TICK = setInterval(function () {
      if (!S || S.phase === "intro" || S.phase === "results") return;
      if (S.timer.state !== "RUNNING") return;
      S.timer.remaining -= 1;
      if (S.timer.remaining <= 0) {
        S.timer.remaining = 0;
        setTimerState("ENDED");
        updateHeader();
        showResults();
        return;
      }
      updateHeader();
    }, 1000);
  }
  function autoPauseStart() {
    if (S.timer.state === "RUNNING") {
      S.timer.state = "PAUSED_AUTO_CHECK";
      S.timer._autoStart = Date.now();
      setTimerState("PAUSED_AUTO_CHECK");
    }
  }
  function autoPauseEnd() {
    if (S.timer.state === "PAUSED_AUTO_CHECK") {
      if (S.timer._autoStart) { S.timer.autoPauseSec += Math.round((Date.now() - S.timer._autoStart) / 1000); S.timer._autoStart = null; }
      S.timer.state = "RUNNING";
      setTimerState("RUNNING");
    }
  }

  /* ---------- header ---------- */
  function updateHeader() {
    $("hTimer").textContent = fmtTime(S.timer.remaining);
    $("hN").textContent = String(Math.min(S.idx + 1, S.order.length));
    $("hScore").textContent = r1(S.creditSum) + " / " + S.answeredCount;
    var pct = S.answeredCount > 0 ? Math.round((S.creditSum / S.answeredCount) * 100) : 0;
    $("hPct").textContent = "(" + pct + "%)";
    $("hProg").style.width = (S.order.length ? Math.round(((S.idx) / S.order.length) * 100) : 0) + "%";
  }
  function buildHeader() {
    var sev = META.severity, cls = "sev-badge sev-" + META.sevClass;
    var sevIcon = sev === "EASY" ? "\u25CF" : sev === "MEDIUM" ? "\u25CF" : sev === "HARD" ? "\u25B2" : "\u25B2";
    $("hdr").innerHTML =
      "<div class=\"cell\"><span class=\"tid\">" + esc(META.topicId.toUpperCase()) + "</span> Exercise <b id=\"hN\">1</b> of " + S.order.length + "</div>" +
      "<div class=\"cell\"><span class=\"" + cls + "\"><span aria-hidden=\"true\">" + sevIcon + "</span> " + esc(sev) + "</span></div>" +
      "<div class=\"cell\"><span id=\"hTState\" class=\"tstate run\">\u25B6 RUNNING</span> <span id=\"hTimer\" class=\"timer\">" + fmtTime(S.timer.remaining) + "</span></div>" +
      "<div class=\"cell\">Score <b id=\"hScore\">0.0 / 0</b> <span id=\"hPct\">(0%)</span></div>" +
      "<div class=\"spacer\"></div>" +
      "<button class=\"btn amber\" id=\"btnHint\" type=\"button\">\u25CB Hint</button>" +
      "<button class=\"btn ghost\" id=\"btnPause\" type=\"button\">\u23F8 Pause</button>" +
      "<button class=\"btn red\" id=\"btnSkip\" type=\"button\">\u26A0 Skip</button>" +
      "<div class=\"progress-track\" style=\"flex-basis:100%\"><div class=\"progress-fill\" id=\"hProg\"></div></div>";
    $("btnHint").addEventListener("click", hint);
    $("btnPause").addEventListener("click", manualPause);
    $("btnSkip").addEventListener("click", skip);
  }

  /* ---------- intro ---------- */
  function renderIntro() {
    var sev = META.severity, cls = "sev-badge sev-" + META.sevClass;
    var sevIcon = sev === "HARD" || sev === "EXTREMELY HARD" ? "\u25B2" : "\u25CF";

    var h = "";
    h += "<div class=\"card\">";
    h += "<div class=\"intro-head\"><h1>" + esc(META.objectId) + " \u2014 " + esc(sev) + " practice exam</h1></div>";
    h += "<div style=\"color:var(--text-secondary);font-size:15.5px\">" + esc(META.objectLine) + "</div>";
    h += "<div class=\"meta-chips\">";

    h += "<div class=\"card\">" + DATA.intro.learn + "</div>";

    h += "<h2 class=\"sec\"><span aria-hidden=\"true\">\u25C6</span> Keywords covered in this exam</h2>";
    h += "<div class=\"card\">";
    for (var i = 0; i < DATA.intro.keywords.length; i++) {
      var k = DATA.intro.keywords[i];
      h += "<div class=\"kw-theme\"><div class=\"kw-h\">" + esc(k.theme) + "</div><div class=\"kw-tags\">";
      for (var j = 0; j < k.tags.length; j++) h += "<span class=\"kw-tag\">" + esc(k.tags[j]) + "</span>";
      h += "</div></div>";
    }
    h += "</div>";

    h += "<h2 class=\"sec\"><span aria-hidden=\"true\">\u25C6</span> How this exam works</h2>";

    $("intro").innerHTML = h;
    $("btnStart").addEventListener("click", startExam);
  }

  /* ---------- exam start / flow ---------- */
  function startExam() {
    S.phase = "exam";
    S.order = shuffle(DATA.exercises.map(function (o, i) { return i; }));
    S.idx = 0;
    S.answers = {};
    EX_STATE = {};
    S.answeredCount = 0;
    S.creditSum = 0;
    S.skipped = [];
    S.reviewing = null;
    S.hinted = {};
    S.reportedThisAttempt = false;
    S.timer = { remaining: META.timerBudget, state: "RUNNING", manualPauseSec: 0, autoPauseSec: 0, _autoStart: null, _manualStart: null };
    $("intro").classList.add("hidden");
    $("results").classList.add("hidden");
    $("review").classList.add("hidden");
    $("exam").classList.remove("hidden");
    buildHeader();
    setTimerState("RUNNING");
    renderCurrent();
  }
  function curEx() { return DATA.exercises[S.order[S.idx]]; }
  function renderCurrent() {
    var ex = curEx();
    renderExercise(ex, false);
    updateHeader();
    window.scrollTo(0, 0);
  }
  function allDone() { return S.idx >= S.order.length; }
  function advance() {
    S.idx += 1;
    if (allDone()) {
      if (S.skipped.length > 0) openReview();
      else showResults();
    } else renderCurrent();
  }

  /* ---------- scenario / question / answer blocks ---------- */
  function artefactHtml(a) {
    var h = "<div class=\"artefact\"><div class=\"artefact-label\">" + esc(a.label) + "</div><div class=\"artefact-body\">";
    if (a.code !== undefined && a.code !== null) h += "<pre class=\"code\">" + codeHi(a.code) + "</pre>";
    else h += "<div style=\"font-size:15px\">" + esc(a.text) + "</div>";
    h += "</div></div>";
    return h;
  }
  function renderExercise(ex, inReview) {
    var host = $("exercise");
    var st = EX_STATE[ex.id] = EX_STATE[ex.id] || {};
    st.inReview = !!inReview;
    var longScenario = words(ex.scenario.map(function (a) { return a.text || a.code || ""; }).join(" ")) > 110;
    var h = "";
    h += "<div class=\"block block-s\" id=\"blkS\">";
    h += "<div class=\"block-h\"><span class=\"ic\" aria-hidden=\"true\">\u25A3</span> SCENARIO <span style=\"margin-left:auto\"></span>";
    if (longScenario) h += "<button class=\"collapse-btn\" id=\"btnCollapse\" type=\"button\">Collapse scenario</button>";
    h += "</div>";
    if (longScenario) h += "<div class=\"collapsed-summary\">" + esc(ex.summary) + "</div>";
    h += "<div class=\"block-b artefacts-wrap\">";
    for (var i = 0; i < ex.scenario.length; i++) h += artefactHtml(ex.scenario[i]);
    h += "</div></div>";
    h += "<div class=\"block block-q\"><div class=\"block-h\"><span class=\"ic\" aria-hidden=\"true\">\u2753</span> QUESTION</div><div class=\"block-b\"><div class=\"qtext\">" + esc(ex.question) + "</div></div></div>";
    h += "<div class=\"block block-a\"><div class=\"block-h\"><span class=\"ic\" aria-hidden=\"true\">\u270E</span> YOUR ANSWER</div><div class=\"block-b\" id=\"ansArea\"></div></div>";
    h += "<div class=\"footrow\">";
    h += "<div style=\"color:var(--text-secondary);font-size:13.5px\">" + (inReview ? "\u26A0 Skipped exercise \u2014 review mode. Answer it now or return to the list." : (st.hinted ? "\u25CB Hint used on this exercise (\u221210% credit)." : "One hint allowed on this exercise (\u221210% of its credit).")) + "</div>";
    h += "<div style=\"display:flex;gap:10px\">";
    if (!inReview) h += "<button class=\"btn green\" id=\"btnCheck\" type=\"button\">\u2713 Check</button>";
    else h += "<button class=\"btn green\" id=\"btnCheck\" type=\"button\">\u2713 Check</button>";
    h += "<button class=\"btn primary hidden\" id=\"btnNext\" type=\"button\">" + (inReview ? "Next \u2192 back to list" : "Next \u2192") + "</button>";
    h += "</div></div>";
    h += "<div id=\"fbHost\"></div>";
    host.innerHTML = h;
    var ca = $("btnCollapse");
    if (ca) ca.addEventListener("click", function () {
      var blk = $("blkS");
      blk.classList.toggle("collapsed");
      ca.textContent = blk.classList.contains("collapsed") ? "Expand scenario" : "Collapse scenario";
    });
    renderWidget(ex);
    $("btnCheck").addEventListener("click", function () { doCheck(ex); });
    $("btnNext").addEventListener("click", function () { doNext(ex); });
    var hintBtn2 = $("btnHint");
    hintBtn2.disabled = !!(st.hinted || st.checked);
    $("btnSkip").disabled = !!st.checked;
    if (st.checked) { $("btnCheck").disabled = true; disableWidget(ex); }
  }

  /* ---------- widgets ---------- */
  function renderWidget(ex) {
    var host = $("ansArea");
    var st = EX_STATE[ex.id];
    if (ex.type === "mcq") host.innerHTML = optsHtml(ex, false);
    else if (ex.type === "multi") host.innerHTML = optsHtml(ex, true);
    else if (ex.type === "match") host.innerHTML = matchHtml(ex);
    else if (ex.type === "dnd") host.innerHTML = dndHtml(ex);
    else if (ex.type === "fill") host.innerHTML = fillHtml(ex);
    else if (ex.type === "order") host.innerHTML = orderHtml(ex);
    else if (ex.type === "terminal") host.innerHTML = termHtml(ex);
    else if (ex.type === "branch") host.innerHTML = branchHtml(ex);
    else if (ex.type === "triage") host.innerHTML = triageHtml(ex);
    else if (ex.type === "log") host.innerHTML = logHtml(ex);
    bindWidget(ex);
  }
  function optsHtml(ex, isMulti) {
    var st = EX_STATE[ex.id] = EX_STATE[ex.id] || {};
    if (!st.optPerm) {
      st.optPerm = shuffle(ex.options.map(function (o, i) { return i; }));
    }
    var h = "<div class=\"opts\" role=\"" + (isMulti ? "group" : "radiogroup") + "\" aria-label=\"Answer options\">";
    for (var v = 0; v < st.optPerm.length; v++) {
      var oi = st.optPerm[v];
      var o = ex.options[oi];
      var letter = String.fromCharCode(65 + v);
      var sel = st.sel && st.sel.indexOf(oi) >= 0;
      h += "<label class=\"opt" + (sel ? " sel" : "") + "\">" +
        "<input type=\"" + (isMulti ? "checkbox" : "radio") + "\" name=\"opt_" + esc(ex.id) + "\" value=\"" + oi + "\"" + (sel ? " checked" : "") + " data-oi=\"" + oi + "\">" +
        "<span class=\"lbl\">" + letter + ".</span><span class=\"txt\">" + esc(o.t) + "</span></label>";
    }
    h += "</div>";
    if (isMulti) h += "<div style=\"margin-top:9px;font-size:13.5px;color:var(--text-secondary)\">\u2691 Multi-select: several answers may apply. Partial credit per correct item; wrong picks subtract.</div>";
    return h;
  }
  function matchHtml(ex) {
    var st = EX_STATE[ex.id];
    if (!st.rgtPerm) st.rgtPerm = shuffle(ex.right.map(function (o, i) { return i; }));
    if (!st.asg) st.asg = {};
    var h = "<div style=\"font-size:13.5px;color:var(--text-secondary);margin-bottom:9px\">\u2691 Click one item on the left, then its partner on the right. Tap again to change a pairing.</div>";
    h += "<div class=\"match-grid\"><div class=\"match-col\" id=\"mLeft\">";
    for (var i = 0; i < ex.left.length; i++) {
      var L = ex.left[i];
      var tag = st.asg[i] !== undefined ? "<span class=\"pairtag\">\u2194 " + esc(ex.right[st.asg[i]].t) + "</span>" : "";
      h += "<button type=\"button\" class=\"mtile lft" + (st.selL === i ? " sel" : "") + "\" data-l=\"" + i + "\"><span class=\"lbl\">" + (i + 1) + ".</span> " + esc(L.t) + tag + "</button>";
    }
    h += "</div><div class=\"match-col\" id=\"mRight\">";
    for (var r = 0; r < st.rgtPerm.length; r++) {
      var ri = st.rgtPerm[r];
      h += "<button type=\"button\" class=\"mtile rgt" + (st.selL !== undefined && st.asg[st.selL] === ri ? " sel" : "") + "\" data-r=\"" + ri + "\">" + esc(ex.right[ri].t) + "</button>";
    }
    h += "</div></div>";
    return h;
  }
  function dndHtml(ex) {
    var st = EX_STATE[ex.id];
    if (!st.chipPerm) st.chipPerm = shuffle(ex.items.map(function (o, i) { return i; }));
    if (!st.placed) st.placed = {};
    var h = "<div class=\"dnd-area\">";
    h += "<div><div style=\"font-size:13.5px;color:var(--text-secondary);margin-bottom:7px\">\u2691 Drag each item onto a target (or click the item, then click the target). Partial credit per target.</div>";
    h += "<div class=\"bank\" id=\"dndBank\">";
    for (var c = 0; c < st.chipPerm.length; c++) {
      var ii = st.chipPerm[c];
      if (st.placed[ii] === undefined) {
        h += "<span class=\"chip" + (st.selChip === ii ? " sel" : "") + "\" draggable=\"true\" data-ii=\"" + ii + "\" tabindex=\"0\" role=\"button\" aria-label=\"Item " + (ii + 1) + ": " + escAttr(ex.items[ii].t) + "\">" + esc(ex.items[ii].t) + "</span>";
      }
    }
    h += "</div></div><div class=\"slots\" id=\"dndSlots\">";
    for (var s = 0; s < ex.slots.length; s++) {
      var sl = ex.slots[s];
      h += "<div class=\"slot\" data-slot=\"" + s + "\"><div class=\"slot-h\">\u25AB " + esc(sl.label) + "</div>";
      for (var p in st.placed) {
        if (st.placed[p] === s) {
          h += "<div class=\"filled\"><span>" + esc(ex.items[p].t) + "</span><button class=\"rm\" data-rm=\"" + p + "\" type=\"button\" aria-label=\"Remove item\">\u2715</button></div>";
        }
      }
      h += "</div>";
    }
    h += "</div></div>";
    return h;
  }
  function logHtml(ex) {
    var st = EX_STATE[ex.id];
    if (!st.optPerm && ex.sub.type === "mcq") st.optPerm = shuffle(ex.sub.options.map(function (o, i) { return i; }));
    if (!st.optPerm && ex.sub.type === "multi") st.optPerm = shuffle(ex.sub.options.map(function (o, i) { return i; }));
    var h = "<div style=\"font-size:13.5px;color:var(--text-secondary);margin-bottom:7px\">\u2691 Log viewer: type in the filter box to highlight matching lines.</div>";
    h += "<input class=\"logfilter\" id=\"logFilter\" type=\"text\" placeholder=\"filter... e.g. defaults or plist\" aria-label=\"Filter log lines\">";
    h += "<div class=\"artefact logviewer\" id=\"logView\" style=\"max-height:280px;overflow:auto\">";
    h += "<div class=\"artefact-body\">";
    for (var i = 0; i < ex.lines.length; i++) {
      h += "<span class=\"log-line\" data-raw=\"" + escAttr(ex.lines[i]) + "\"><pre class=\"log\">" + codeHi(ex.lines[i]) + "</pre></span>";
    }
    h += "</div></div>";
    h += "<div style=\"margin-top:12px\">";
    if (ex.sub.type === "multi") h += optsHtml({ id: ex.id + "-sub", options: ex.sub.options }, true);
    else h += optsHtml({ id: ex.id + "-sub", options: ex.sub.options }, false);
    h += "</div>";
    return h;
  }
  function bindWidget(ex) {
    var st = EX_STATE[ex.id];
    mountHint(ex); /* keep a revealed hint visible across widget redraws */
    if (st.checked) return;
    var host = $("ansArea");
    if (ex.type === "mcq" || ex.type === "multi") {
      host.querySelectorAll("input").forEach(function (inp) {
        inp.addEventListener("change", function () {
          st.sel = [];
          host.querySelectorAll("input:checked").forEach(function (c) { st.sel.push(parseInt(c.getAttribute("data-oi"), 10)); });
          host.querySelectorAll(".opt").forEach(function (o) {
            var v = o.querySelector("input").getAttribute("data-oi");
            o.classList.toggle("sel", st.sel.indexOf(parseInt(v, 10)) >= 0);
          });
        });
      });
    } else if (ex.type === "match") {
      host.querySelectorAll(".mtile.lft").forEach(function (b) {
        b.addEventListener("click", function () {
          var i = parseInt(b.getAttribute("data-l"), 10);
          st.selL = (st.selL === i) ? undefined : i;
          host.innerHTML = matchHtml(ex); bindWidget(ex);
        });
      });
      host.querySelectorAll(".mtile.rgt").forEach(function (b) {
        b.addEventListener("click", function () {
          if (st.selL === undefined) return;
          var r = parseInt(b.getAttribute("data-r"), 10);
          for (var k in st.asg) { if (st.asg[k] === r) delete st.asg[k]; }
          st.asg[st.selL] = r;
          st.selL = undefined;
          host.innerHTML = matchHtml(ex); bindWidget(ex);
        });
      });
    } else if (ex.type === "dnd") {
      var redraw = function () { host.innerHTML = dndHtml(ex); bindWidget(ex); };
      host.querySelectorAll(".chip").forEach(function (ch) {
        ch.addEventListener("dragstart", function (ev) { st.selChip = parseInt(ch.getAttribute("data-ii"), 10); ev.dataTransfer.setData("text/plain", String(st.selChip)); });
        ch.addEventListener("click", function () { st.selChip = parseInt(ch.getAttribute("data-ii"), 10); redraw(); });
        ch.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); st.selChip = parseInt(ch.getAttribute("data-ii"), 10); redraw(); } });
      });
      host.querySelectorAll(".slot").forEach(function (sl) {
        sl.addEventListener("dragover", function (ev) { ev.preventDefault(); sl.classList.add("over"); });
        sl.addEventListener("dragleave", function () { sl.classList.remove("over"); });
        sl.addEventListener("drop", function (ev) {
          ev.preventDefault(); sl.classList.remove("over");
          var ii = st.selChip !== undefined ? st.selChip : parseInt(ev.dataTransfer.getData("text/plain"), 10);
          if (ii === undefined || isNaN(ii)) return;
          for (var p in st.placed) { if (st.placed[p] === parseInt(sl.getAttribute("data-slot"), 10)) delete st.placed[p]; }
          st.placed[ii] = parseInt(sl.getAttribute("data-slot"), 10);
          st.selChip = undefined; redraw();
        });
        sl.addEventListener("click", function (ev) {
          if (ev.target.classList && ev.target.classList.contains("rm")) return;
          if (st.selChip === undefined) return;
          for (var p in st.placed) { if (st.placed[p] === parseInt(sl.getAttribute("data-slot"), 10)) delete st.placed[p]; }
          st.placed[st.selChip] = parseInt(sl.getAttribute("data-slot"), 10);
          st.selChip = undefined; redraw();
        });
      });
      host.querySelectorAll(".rm").forEach(function (rm) {
        rm.addEventListener("click", function (ev) {
          ev.stopPropagation();
          var p = rm.getAttribute("data-rm");
          delete st.placed[p]; redraw();
        });
      });
    } else if (ex.type === "fill") {
      host.querySelectorAll(".fill-in").forEach(function (inp, bi) {
        inp.addEventListener("input", function () { st.vals = st.vals || {}; st.vals[bi] = inp.value; });
      });
      host.querySelectorAll(".chip[data-word]").forEach(function (ch) {
        ch.addEventListener("click", function () {
          st.vals = st.vals || {};
          var inputs = host.querySelectorAll(".fill-in");
          for (var i = 0; i < inputs.length; i++) {
            if (!inputs[i].value) { inputs[i].value = ch.getAttribute("data-word"); st.vals[i] = inputs[i].value; break; }
          }
        });
      });
    } else if (ex.type === "order") {
      var redraw2 = function () { host.innerHTML = orderHtml(ex); bindWidget(ex); };
      host.querySelectorAll("button[data-up]").forEach(function (b) {
        b.addEventListener("click", function () {
          var i = parseInt(b.getAttribute("data-up"), 10);
          if (i > 0) { var t = st.list[i - 1]; st.list[i - 1] = st.list[i]; st.list[i] = t; redraw2(); }
        });
      });
      host.querySelectorAll("button[data-dn]").forEach(function (b) {
        b.addEventListener("click", function () {
          var i = parseInt(b.getAttribute("data-dn"), 10);
          if (i < st.list.length - 1) { var t = st.list[i + 1]; st.list[i + 1] = st.list[i]; st.list[i] = t; redraw2(); }
        });
      });
    } else if (ex.type === "terminal") {
      var input = $("termIn");
      if (input) input.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") { runTerm(ex, input.value); input.value = ""; }
      });
      var runBtn = $("termRun");
      if (runBtn) runBtn.addEventListener("click", function () { runTerm(ex, input.value); input.value = ""; });
      if (ex.timeLimit && !st.termTimer && !st.checked) {
        st.termLeft = ex.timeLimit;
        st.termTimer = setInterval(function () {
          if (!S || S.timer.state !== "RUNNING") return;
          st.termLeft -= 1;
          var te = $("termLeft");
          if (te) te.textContent = st.termLeft + "s left in this exercise";
          if (st.termLeft <= 0) {
            clearInterval(st.termTimer); st.termTimer = null;
            doCheck(ex);
          }
        }, 1000);
      }
    } else if (ex.type === "branch") {
      redrawBranch(ex);
    } else if (ex.type === "triage") {
      redrawTriage(ex);
    } else if (ex.type === "log") {
      var f = $("logFilter");
      if (f) f.addEventListener("input", function () {

        host.querySelectorAll(".log-line").forEach(function (ln) {

      subHost.querySelectorAll("input").forEach(function (inp) {

            o.classList.toggle("sel", st.sel.indexOf(parseInt(v, 10)) >= 0);

    }
  }
  function hiMark(raw, q) {
    var e = esc(raw);
    var idx = norm(raw).indexOf(q);
    if (idx < 0) return codeHi(raw);
    var before = raw.slice(0, idx), mid = raw.slice(idx, idx + q.length), after = raw.slice(idx + q.length);
    return codeHi(before) + "<mark>" + esc(mid) + "</mark>" + codeHi(after);

  function disableWidget(ex) {

  function runTerm(ex, cmd) {
    var st = EX_STATE[ex.id];

    var hitTool = false;
    if (ex.elements.length && ex.elements[0].any) {

    }
    if (hitTool && ex.outputSample) { st.termLines = st.termLines.concat(ex.outputSample.slice()); }
    else if (hitTool) { st.termLines.push("(command accepted)"); }
    else { st.termLines.push("zsh: command not found: " + cmd.trim().split(" ")[0]); }
    var host = $("termScroll");

    for (var k = 0; k < st.termLines.length; k++) h += "<div>" + codeHi(st.termLines[k]) + "</div>";

  function branchHtml(ex) {

  function triageHtml(ex) {

    var h = "<div style=\"font-size:13.5px;color:var(--text-secondary);margin-bottom:10px\">\u2691 Handle every alert in the queue: pick one action per alert. The outcome line shows what your choice does. Grading happens on the final Check.</div><div class=\"alertqueue\">";
    for (var a = 0; a < ex.alerts.length; a++) {
      var al = ex.alerts[a];

      if (al.lines) {
        h += "<div class=\"artefact\"><div class=\"artefact-body\"><pre class=\"log\">";
        for (var l = 0; l < al.lines.length; l++) h += esc(al.lines[l]) + "\n";
        h += "</pre></div></div>";
      }
      h += "<div class=\"opts\" role=\"group\" aria-label=\"Action for " + escAttr(al.name) + "\">";
      for (var o = 0; o < al.options.length; o++) {
        var sel = st.picks[a] === o;
        h += "<button type=\"button\" class=\"opt" + (sel ? " sel" : "") + "\" style=\"width:100%;text-align:left\" data-a=\"" + a + "\" data-oi=\"" + o + "\"><span class=\"lbl\">" + String.fromCharCode(65 + o) + ".</span><span class=\"txt\">" + esc(al.options[o].t) + "</span></button>";
      }
      h += "</div>";
      if (st.picks[a] !== undefined) h += "<div class=\"consequence\">\u25B8 Outcome: " + esc(al.options[st.picks[a]].consequence) + "</div>";

  function redrawTriage(ex) {

  /* ---------- grading ---------- */
  /* Single reusable partial-credit scoring function (spec STEP 5).
     selectedItems / correctItems are arrays of item keys; a selected key that
     is not a correct key counts as a wrong pick. Returns a real in [0, 1]. */
  function scoreExercise(selectedItems, correctItems) {
    var N = correctItems.length, H = 0, W = 0, i, k;
    var picked = [];
    for (i = 0; i < selectedItems.length; i++) {
      if (selectedItems[i] === undefined || selectedItems[i] === null) continue;
      var dup = false;
      for (k = 0; k < picked.length; k++) { if (picked[k] === String(selectedItems[i])) { dup = true; break; } }
      if (!dup) picked.push(String(selectedItems[i]));
    }
    for (i = 0; i < picked.length; i++) {
      var inCorrect = false;
      for (k = 0; k < N; k++) { if (String(correctItems[k]) === picked[i]) { inCorrect = true; break; } }
      if (inCorrect) H++; else W++;
    }
    return Math.max(0, (H - W) / N);
  }
  function grade(ex) {
    var st = EX_STATE[ex.id];
    var g = { credit: 0, H: 0, W: 0, N: 1, items: [], label: "INCORRECT", extra: "" };
    var i, k;
    if (ex.type === "mcq") {
      g.N = 1;
      var pick = st.sel && st.sel.length ? st.sel[0] : undefined;
      if (pick === ex.answer) { g.H = 1; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 you picked the right answer." }); }
      else if (pick === undefined) { g.items.push({ s: "miss", t: "\u25CB Missed \u2014 no answer given." }); }
      else { g.W = 1; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 correct answer: " + ex.options[ex.answer].t }); }
    } else if (ex.type === "multi" || (ex.type === "log" && ex.sub.type === "multi")) {
      var opts = ex.type === "log" ? ex.sub.options : ex.options;
      var sel = ex.type === "log" ? st.sel : st.sel;
      g.N = 0;
      for (i = 0; i < opts.length; i++) {
        if (opts[i].correct) {
          g.N++;
          if (sel && sel.indexOf(i) >= 0) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 " + opts[i].t + " " + (opts[i].why ? "\u2014 " + opts[i].why : "") }); }
          else g.items.push({ s: "miss", t: "\u25CB Missed \u2014 " + opts[i].t + " " + (opts[i].why ? "\u2014 " + opts[i].why : "") });
        }
      }
      for (i = 0; i < opts.length; i++) {
        if (!opts[i].correct && sel && sel.indexOf(i) >= 0) { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 " + opts[i].t + " " + (opts[i].why ? "\u2014 " + opts[i].why : "") }); }
      }
    } else if (ex.type === "match") {
      g.N = ex.left.length;
      for (i = 0; i < ex.left.length; i++) {
        if (st.asg[i] === undefined) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 " + ex.left[i].t + " was not paired." });
        else if (st.asg[i] === i) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 " + ex.left[i].t + " \u2192 " + ex.right[i].t }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 " + ex.left[i].t + " pairs with \u201C" + ex.right[i].t + "\u201D, not \u201C" + ex.right[st.asg[i]].t + "\u201D." }); }
      }
    } else if (ex.type === "dnd") {
      g.N = ex.slots.length;
      for (i = 0; i < ex.slots.length; i++) {
        var occupant = null;
        for (k in st.placed) { if (st.placed[k] === i) occupant = parseInt(k, 10); }
        if (occupant === null) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 target \u201C" + ex.slots[i].label + "\u201D was left empty; it accepts " + ex.items[ex.slots[i].accept].t + "." });
        else if (occupant === ex.slots[i].accept) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 " + ex.items[occupant].t + " \u2192 " + ex.slots[i].label }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 " + ex.items[occupant].t + " does not belong on \u201C" + ex.slots[i].label + "\u201D; the right item is " + ex.items[ex.slots[i].accept].t + "." }); }
      }
    } else if (ex.type === "fill") {
      var blanks = [];
      for (i = 0; i < ex.segments.length; i++) if (typeof ex.segments[i] !== "string") blanks.push(ex.segments[i].blank);
      g.N = blanks.length;
      for (i = 0; i < blanks.length; i++) {
        var v = st.vals ? (st.vals[i] || "") : "";
        if (!v.trim()) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 blank " + (i + 1) + " (" + blanks[i].label + ") left empty; accepted: " + blanks[i].accept.join(" / ") + "." });
        else if (blanks[i].accept.map(norm).indexOf(norm(v)) >= 0) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 blank " + (i + 1) + " (" + blanks[i].label + "): " + v }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 blank " + (i + 1) + " (" + blanks[i].label + "): you typed \u201C" + v + "\u201D; accepted: " + blanks[i].accept.join(" / ") + "." }); }
      }
    } else if (ex.type === "order") {
      g.N = ex.items.length;
      for (i = 0; i < st.list.length; i++) {
        if (st.list[i] === i) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 position " + (i + 1) + ": " + ex.items[i].t }); }
        else g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 position " + (i + 1) + " should be: " + ex.items[i].t + " (you placed " + ex.items[st.list[i]].t + ")" });
      }
    } else if (ex.type === "terminal") {
      var cmd = st.cmd || "";
      var n = norm(cmd);
      g.N = ex.elements.length;
      if (!cmd.trim()) {
        for (i = 0; i < ex.elements.length; i++) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 " + ex.elements[i].label + " (no command entered)" });
      } else {
        for (i = 0; i < ex.elements.length; i++) {
          var el = ex.elements[i], hit = false;
          for (k = 0; k < el.any.length; k++) { if (n.indexOf(norm(el.any[k])) >= 0) { hit = true; break; } }
          if (hit) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct element \u2014 " + el.label }); }
          else g.items.push({ s: "miss", t: "\u25CB Missing element \u2014 " + el.label });
        }
      }
      if (ex.danger) {
        var dHit = false;
        for (i = 0; i < ex.danger.length; i++) {
          var ds = ex.danger[i].any;
          for (k = 0; k < ds.length; k++) { if (n.indexOf(norm(ds[k])) >= 0) { dHit = true; break; } }
          if (dHit) break;
        }
        if (dHit) g.extra = "\u2717 DANGEROUS \u2014 NEAR MISS: " + ex.dangerNote;
      }
    } else if (ex.type === "branch") {
      g.N = ex.steps.length;
      for (i = 0; i < ex.steps.length; i++) {
        var p2 = st.picks[i];
        if (p2 === undefined) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 step " + (i + 1) + " unanswered; best move: " + ex.steps[i].bestNote });
        else if (ex.steps[i].options[p2].ok) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 step " + (i + 1) + ": " + ex.steps[i].options[p2].t }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 step " + (i + 1) + ": you chose \u201C" + ex.steps[i].options[p2].t + "\u201D; better: " + ex.steps[i].bestNote }); }
      }
    } else if (ex.type === "triage") {
      g.N = ex.alerts.length;
      for (i = 0; i < ex.alerts.length; i++) {
        var p3 = st.picks[i];
        if (p3 === undefined) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 " + ex.alerts[i].name + " not handled; best move: " + ex.alerts[i].bestNote });
        else if (ex.alerts[i].options[p3].ok) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 " + ex.alerts[i].name + ": " + ex.alerts[i].options[p3].t }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 " + ex.alerts[i].name + ": you chose \u201C" + ex.alerts[i].options[p3].t + "\u201D; better: " + ex.alerts[i].bestNote }); }
      }
    } else if (ex.type === "log" && ex.sub.type === "mcq") {
      g.N = 1;
      var pick2 = st.sel && st.sel.length ? st.sel[0] : undefined;
      if (pick2 === ex.sub.answer) { g.H = 1; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 you read the log the right way." }); }
      else if (pick2 === undefined) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 no answer given." });
      else { g.W = 1; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 correct answer: " + ex.sub.options[ex.sub.answer].t }); }
    }
    /* route every exercise (multi-answer and single-answer alike) through the
       one reusable scoring function: H correct picks, W wrong picks, N correct items */
    var selKeys = [], corKeys = [], i3;
    for (i3 = 0; i3 < g.H; i3++) selKeys.push("c" + i3);
    for (i3 = 0; i3 < g.W; i3++) selKeys.push("w" + i3);
    for (i3 = 0; i3 < g.N; i3++) corKeys.push("c" + i3);
    g.credit = scoreExercise(selKeys, corKeys);
    g.label = g.credit >= 1 ? "CORRECT" : (g.credit > 0 ? "PARTIALLY CORRECT" : "INCORRECT");
    return g;
  }

  /* ---------- check / feedback / next ---------- */
  function doCheck(ex) {
    var st = EX_STATE[ex.id];
    if (st.checked) return;
    autoPauseStart(); /* FIRST action: stop the timer before rendering feedback */
    var g = grade(ex);
    st.checked = true;
    var hinted = !!st.hinted;
    var before = g.credit;
    var finalCredit = hinted ? Math.max(0, before - 0.1) : before;
    st.g = g; st.finalCredit = finalCredit; st.hinted = hinted;
    S.answers[ex.id] = { credit: finalCredit, ex: ex };
    S.answeredCount += 1;
    S.creditSum += finalCredit;
    renderFeedback(ex, g, finalCredit, hinted, before);
    $("btnCheck").disabled = true;
    $("btnSkip").disabled = true;
    $("btnHint").disabled = true;
    var nb = $("btnNext");
    nb.classList.remove("hidden");
    if (!st.inReview && S.idx === S.order.length - 1) nb.textContent = "Final Submit \u2192";
    disableWidget(ex);
    updateHeader();
  }
  function renderFeedback(ex, g, finalCredit, hinted, before) {
    var host = $("fbHost");
    var cls = g.label === "CORRECT" ? "f-correct" : (g.label === "PARTIALLY CORRECT" ? "f-partial" : "f-incorrect");
    var icon = g.label === "INCORRECT" ? "\u2717" : "\u2713";
    var h = "<div class=\"feedback " + cls + "\"><div class=\"feedback-h\"><span aria-hidden=\"true\">" + icon + "</span> " + g.label;
    if (g.N > 1) h += " <span style=\"font-weight:400\">(credit " + (Math.round(finalCredit * 100) / 100) + " \u2014 " + g.H + "/" + g.N + " items)</span>";
    h += "</div><div class=\"feedback-b\">";
    if (hinted && before > 0) h += "<div class=\"credit-line\" style=\"color:var(--state-partial)\">\u25CB Hint penalty applied: " + before + " \u2192 " + finalCredit + " (credit \u2212 0.10).</div>";
    h += "<div>" + esc(ex.explain) + "</div>";
    if (g.N > 1 || g.label === "INCORRECT") {
      h += "<div class=\"item-rows\">";
      for (var i = 0; i < g.items.length; i++) {
        var it = g.items[i];
        var c = it.s === "ok" ? "ok" : it.s === "bad" ? "bad" : "miss";
        h += "<div class=\"item-row " + c + "\"><span class=\"ic\" aria-hidden=\"true\">" + (it.s === "ok" ? "\u2713" : it.s === "bad" ? "\u2717" : "\u25CB") + "</span><span class=\"itxt\">" + esc(it.t) + "</span></div>";
      }
      h += "</div>";
    }
    if (g.extra) h += "<div class=\"item-row bad\"><span class=\"ic\" aria-hidden=\"true\">\u2717</span><span class=\"itxt\">" + esc(g.extra) + "</span></div>";
    if (ex.type === "terminal") {
      h += "<div class=\"canon\"><div class=\"artefact\"><div class=\"artefact-label\">Canonical command</div><div class=\"artefact-body\"><pre class=\"code\">" + codeHi(ex.canonical) + "</pre></div></div>";
      h += "<div class=\"item-rows\">";
      for (var p = 0; p < ex.parts.length; p++) h += "<div class=\"item-row ok\"><span class=\"ic\" aria-hidden=\"true\">\u2699</span><span class=\"itxt\"><b>" + esc(ex.parts[p].label) + "</b> \u2014 " + esc(ex.parts[p].desc) + "</span></div>";
      h += "</div></div>";
    }
    if (ex.persp) {
      h += "<div class=\"persp\"><div class=\"pcard red\"><div class=\"ph\">\u25B2 ATTACKER PERSPECTIVE</div>" + esc(ex.persp.red) + "</div>" +
        "<div class=\"pcard blue\"><div class=\"ph\">\u25CF DEFENDER PERSPECTIVE</div>" + esc(ex.persp.blue) + "</div></div>";
    }
    if (ex.study) h += "<div class=\"study\">\u25C6 What to study: " + esc(ex.study) + "</div>";
    h += "</div></div>";
    host.innerHTML = h;
  }
  function doNext(ex) {
    var st = EX_STATE[ex.id];
    autoPauseEnd();
    if (st.inReview) { openReview(); return; }
    if (S.idx === S.order.length - 1) {
      var hasOpen = false;
      for (var i = 0; i < S.skipped.length; i++) { if (!S.answers[S.skipped[i]]) { hasOpen = true; break; } }
      if (hasOpen) { openReview(); return; }
      setTimerState("ENDED");
      showResults();
      return;
    }
    advance();
  }
  function skip() {
    var ex = curEx();
    S.skipped.push(ex.id);
    advance();
  }
  function hint() {
    var ex = curEx();
    var st = EX_STATE[ex.id];
    if (st.hinted || st.checked) return;
    st.hinted = true;
    mountHint(ex);
    $("btnHint").disabled = true;
  }
  function mountHint(ex) {
    var st = EX_STATE[ex.id];
    if (!st || !st.hinted || st.checked) return;
    if ($("hintBox")) return;
    var box = document.createElement("div");
    box.className = "hintbox";
    box.id = "hintBox";
    box.innerHTML = "<div class=\"hint-h\"><span aria-hidden=\"true\">\u25CB</span> HINT (\u221210% of this exercise's credit)</div>" + esc(ex.hint);
    var host = $("ansArea");
    if (host) host.insertBefore(box, host.firstChild);
  }
  function manualPause() {
    if (S.timer.state === "ENDED") return;
    if (S.timer.state === "PAUSED_MANUAL") return;
    S.timer._manualPrev = S.timer.state;
    if (S.timer.state === "PAUSED_AUTO_CHECK" && S.timer._autoStart) { S.timer.autoPauseSec += Math.round((Date.now() - S.timer._autoStart) / 1000); S.timer._autoStart = null; }
    S.timer.state = "PAUSED_MANUAL";
    S.timer._manualStart = Date.now();
    setTimerState("PAUSED_MANUAL");
    var m = $("pausemask");
    m.classList.remove("hidden");
    m.innerHTML = "<div class=\"pi\" aria-hidden=\"true\">\u23F8</div><div class=\"pt\">\u23F8 PAUSED \u2014 manual (press Resume)</div><div class=\"ps\">The timer is stopped and the exercise is hidden so you cannot read it while on break. Press Resume to continue where you were.</div><button class=\"btn primary\" id=\"btnResume\" type=\"button\">\u25B6 Resume</button>";
    $("btnResume").addEventListener("click", resumeManual);
  }
  function resumeManual() {
    var m = $("pausemask");
    m.classList.add("hidden");
    if (S.timer._manualStart) { S.timer.manualPauseSec += Math.round((Date.now() - S.timer._manualStart) / 1000); S.timer._manualStart = null; }
    if (S.timer._manualPrev === "PAUSED_AUTO_CHECK") {
      S.timer.state = "PAUSED_AUTO_CHECK";
      S.timer._autoStart = Date.now();
      setTimerState("PAUSED_AUTO_CHECK");
    } else {
      S.timer.state = "RUNNING";
      setTimerState("RUNNING");
    }
  }

  /* ---------- review skipped ---------- */
  function openReview() {
    S.phase = "review";
    autoPauseEnd();
    setTimerState("RUNNING");
    $("exam").classList.add("hidden");
    $("review").classList.remove("hidden");
    var timeUp = S.timer.remaining <= 0 || S.timer.state === "ENDED";
    var h = "<div class=\"card\"><h2 style=\"margin:0 0 6px\"><span aria-hidden=\"true\">\u26A0</span> Review skipped exercises</h2>";
    h += "<p style=\"color:var(--text-secondary)\">These exercises were skipped. You can go back and answer as many times as you want until the timer ends. If you submit now, skipped-and-never-answered exercises are excluded from the score.</p><div class=\"rev-list\">";
    for (var i = 0; i < S.skipped.length; i++) {
      var e = null;
      for (var k = 0; k < S.order.length; k++) { if (DATA.exercises[S.order[k]].id === S.skipped[i]) { e = DATA.exercises[S.order[k]]; break; } }
      var answered = S.answers[e.id] ? true : false;
      h += "<div class=\"rev-row\"><span class=\"tag\">\u26A0 " + (answered ? "Answered" : "Skipped") + "</span><span style=\"flex:1\">" + esc(e.summary) + "</span>" +
        "<button class=\"btn green\" data-review=\"" + S.skipped[i] + "\" type=\"button\"" + (timeUp && !answered ? " disabled" : "") + ">Answer</button></div>";
    }
    h += "</div><div class=\"startrow\"><button class=\"btn primary\" id=\"btnFinalSubmit\" type=\"button\">\u2713 Final Submit \u2192 results</button></div></div>";
    $("review").innerHTML = h;
    $("review").querySelectorAll("button[data-review]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-review");
        var idx = -1;
        for (var k2 = 0; k2 < S.order.length; k2++) { if (DATA.exercises[S.order[k2]].id === id) { idx = k2; break; } }
        S.idx = idx;
        S.phase = "exam";
        $("review").classList.add("hidden");
        $("exam").classList.remove("hidden");
        var ex2 = DATA.exercises[S.order[idx]];
        var already = S.answers[ex2.id] ? true : false;
        S.answers[ex2.id] = undefined;
        S.answeredCount = 0; S.creditSum = 0;
        for (var kk = 0; kk < S.order.length; kk++) {
          var ee = DATA.exercises[S.order[kk]];
          if (S.answers[ee.id]) { S.answeredCount += 1; S.creditSum += S.answers[ee.id].credit; }
        }
        var st = EX_STATE[ex2.id];
        if (already) {
          st.checked = false; delete st.g; delete st.finalCredit;
          if (st.termTimer) { clearInterval(st.termTimer); st.termTimer = null; }
          if (ex2.timeLimit) st.termLeft = ex2.timeLimit;
        }
        renderExercise(ex2, true);
        updateHeader();
        window.scrollTo(0, 0);
      });
    });
    $("btnFinalSubmit").addEventListener("click", function () {
      setTimerState("ENDED");
      showResults();
    });
  }

  /* ---------- results ---------- */
  function showResults() {
    S.phase = "results";
    if (S.timer._manualStart) { S.timer.manualPauseSec += Math.round((Date.now() - S.timer._manualStart) / 1000); S.timer._manualStart = null; }
    if (S.timer._autoStart) { S.timer.autoPauseSec += Math.round((Date.now() - S.timer._autoStart) / 1000); S.timer._autoStart = null; }
    $("exam").classList.add("hidden");
    $("review").classList.add("hidden");
    $("pausemask").classList.add("hidden");
    var answered = [], full = 0, part = 0, zero = 0, partSum = 0;
    for (var k = 0; k < S.order.length; k++) {
      var ex = DATA.exercises[S.order[k]];
      var a = S.answers[ex.id];
      if (a) {
        answered.push(a);
        if (a.credit >= 1) full++;
        else if (a.credit > 0) { part++; partSum += a.credit; }
        else zero++;
      }
    }
    var excluded = S.order.length - answered.length;
    var percent = answered.length > 0 ? Math.round((S.creditSum / answered.length) * 100) : 0;
    var passed = percent >= META.passMark;
    var avgPart = part > 0 ? Math.round((partSum / part) * 100) / 100 : 0;
    var h = "";
    h += "<div class=\"card\" style=\"text-align:center\"><div class=\"bigpct\">" + percent + "%</div>";
    h += "<div style=\"color:var(--text-secondary)\">Total score <b style=\"color:var(--text-primary)\">" + r1(S.creditSum) + " / " + answered.length + "</b> (answered exercises only \u2014 skipped-and-never-answered are excluded) \u2014 pass mark " + META.passMark + "%</div></div>";
    h += "<div class=\"verdict " + (passed ? "pass" : "fail") + "\"><span aria-hidden=\"true\">" + (passed ? "\u2713" : "\u2717") + "</span> " + (passed ? "\u2713 PASS \u2014 certification-style result: well done." : "\u2717 FAIL \u2014 you must retake this exam to reach " + META.passMark + "%.") + "</div>";
    h += "<div class=\"res-grid\">";
    h += "<div class=\"res-cell ok\"><div class=\"rc-h\">\u2713 Fully correct</div><div class=\"rc-v\">" + full + "</div></div>";
    h += "<div class=\"res-cell part\"><div class=\"rc-h\">\u2713 Partially correct (avg " + avgPart + ")</div><div class=\"rc-v\">" + part + "</div></div>";
    h += "<div class=\"res-cell bad\"><div class=\"rc-h\">\u2717 Fully incorrect</div><div class=\"rc-v\">" + zero + "</div></div>";
    h += "<div class=\"res-cell skip\"><div class=\"rc-h\">\u26A0 Skipped \u2014 excluded</div><div class=\"rc-v\">" + excluded + "</div></div>";
    h += "</div>";
    h += "<div class=\"card\"><div class=\"pauselog\">\u23F8 Time paused manually: <b>" + fmtDur(S.timer.manualPauseSec) + "</b> \u2014 \u23F8 Time paused reviewing feedback: <b>" + fmtDur(S.timer.autoPauseSec) + "</b> \u2014 time remaining at submit: <b>" + fmtTime(S.timer.remaining) + "</b></div></div>";
    h += "<div class=\"card\"><div style=\"font-weight:700;margin-bottom:6px\">Per-exercise results</div><div class=\"item-rows\">";
    for (var k2 = 0; k2 < S.order.length; k2++) {
      var ex2 = DATA.exercises[S.order[k2]];
      var a2 = S.answers[ex2.id];
      if (!a2) h += "<div class=\"item-row miss\"><span class=\"ic\" aria-hidden=\"true\">\u26A0</span><span class=\"itxt\">\u26A0 Skipped \u2014 excluded: " + esc(ex2.summary) + "</span></div>";
      else {
        var cls2 = a2.credit >= 1 ? "ok" : (a2.credit > 0 ? "part" : "bad");
        var ic2 = a2.credit >= 1 ? "\u2713" : (a2.credit > 0 ? "\u2713" : "\u2717");
        var col = a2.credit >= 1 ? "var(--state-correct)" : (a2.credit > 0 ? "var(--state-partial)" : "var(--state-incorrect)");
        h += "<div class=\"item-row " + cls2 + "\"><span class=\"ic\" aria-hidden=\"true\" style=\"color:" + col + "\">" + ic2 + "</span><span class=\"itxt\">credit " + (Math.round(a2.credit * 100) / 100) + " \u2014 " + esc(ex2.summary) + "</span></div>";
      }
    }
    h += "</div></div>";
    h += "<div class=\"startrow\" style=\"justify-content:center\"><button class=\"startbtn\" id=\"btnRetake\" type=\"button\">\u21BA Retake Exam</button></div>";
    $("results").innerHTML = h;
    $("results").classList.remove("hidden");
    reportScore(S.creditSum, answered.length, percent, passed);
    $("btnRetake").addEventListener("click", function () {
      S.attempt += 1;
      startExam();
    });
  }
  function reportScore(creditSum, answeredCount, percent, passed) {
    if (S.reportedThisAttempt) return;
    S.reportedThisAttempt = true;
    try {
      parent.postMessage({
        type: "CYBERPULSE_SCORE",
        topicId: META.topicId,
        batch: META.batch,
        score: Math.round(creditSum),
        total: answeredCount,
        percent: percent,
        passed: passed
      }, location.origin);
    } catch (e) { /* opened directly - nothing to report to */ }
  }

  /* ---------- handshake & init ---------- */
  window.addEventListener("message", function (event) {
    if (!event.data) return;
    if (event.data.type !== "CYBERPULSE_INIT" && event.data.type !== "CYBERMASTERY_INIT") return;
    /* consumed: username, country, locale, topicId, batch. theme is always dark; the file is dark-only, no toggle. */
    S.handshake = { username: event.data.username || "", country: event.data.country || "", locale: event.data.locale || "en" };
  });
  function init() {
    var metaEl = document.getElementById("cm-exercise-meta");
    var dataEl = document.getElementById("cm-exam-data");
    META = JSON.parse(metaEl.textContent);
    DATA = JSON.parse(dataEl.textContent);
    S = { phase: "intro", attempt: 1, reportedThisAttempt: false, order: [], creditSum: 0, answeredCount: 0, answers: {}, skipped: [], timer: { remaining: META.timerBudget, state: "RUNNING", manualPauseSec: 0, autoPauseSec: 0 } };
    document.title = META.objectId + " \u2014 " + META.severity + " practice exam";
    renderIntro();
    startTicks();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
