var EX = [
{id:'med-01',type:'qcm',
 sc:[{t:'ARTEFACT 1 — Firewall log (fw-edge-01, overnight)',viewer:true,lines:['2026-10-14 01:12:09 fw-edge-01 %SYS-5-CONFIG_I: Configured from console by svc-backup on vty1 (10[.]20[.]9[.]51)','2026-10-14 01:13:30 fw-edge-01 %SEC-6-IPACCESSLOGP: list INSIDE-OUT permitted tcp 10[.]30[.]5[.]10(50122) -> 198[.]51[.]100[.]77 eq 8443','2026-10-14 01:13:44 fw-edge-01 %SEC-6-IPACCESSLOGP: list INSIDE-OUT permitted tcp 10[.]30[.]5[.]10(50131) -> 198[.]51[.]100[.]77 eq 8443','2026-10-14 01:20:00 fw-edge-01 %SYS-6-LOGOUT: User svc-backup has exited tty session 1(10[.]20[.]9[.]51)']},
     {t:'ARTEFACT 2 — Change database extract',x:'<p class="sc-p">Tonight for fw-edge-01: <b>no change scheduled</b>. Account note: <b>svc-backup</b> is the backup service account. It runs on the backup server only. It has never had, and should never have, access to network devices.</p>'}],
 sum:'Service account changed a firewall; no change was scheduled',
 q:'Combine both artefacts. What happened on fw-edge-01?',
 o:['The nightly backup ran normally on the backup server','A network admin did routine maintenance out of hours','A service account that must never touch network devices changed the firewall, then new outbound traffic appeared','The firewall failed over to its secondary device'],
 c:[2],
 why:'Two facts connect: (1) the login is <b>svc-backup</b>, an account that belongs on the backup server, not on a firewall console; (2) the change database says no change was scheduled. Right after the configuration change, new outbound traffic to an outside host appears. A backup job on the backup server would never log into the firewall, and "routine maintenance" contradicts the empty change calendar. This pattern — unexpected account, config change, then new traffic — is the T1599 bridge-in-progress pattern.',
 study:'why service accounts must not have device admin rights, and how to combine logs with the change database.',
 hint:'First look at WHO made the change and what that account is supposed to do. Then look at what the change database says.'},
{id:'med-02',type:'multi',
 sc:[{t:'ARTEFACT 1 — Detection plan (from the T1599 detection strategy)',x:'<p class="sc-p">"Suspicious bridging is observed when network devices begin allowing traffic that contradicts existing segmentation or access policies. Observable behaviours include sudden modifications to ACLs or firewall rules, unusual cross-boundary traffic flows (for example east-west communications across separated VLANs), or simultaneous ingress/egress anomalies. Multi-event correlation is key."</p>'}],
 sum:'The T1599 detection strategy lists three observable behaviours',
 q:'Select the THREE behaviours the detection plan names.',
 o:['A firewall rule was changed and, minutes later, unexpected traffic crossed the boundary','Unusual east-west flows appeared between two separated VLANs','Ingress and egress anomalies happened at the same time','The device CPU spiked to 80% for two minutes','A laptop received a new DHCP address from the normal pool','Three users failed to log in to the intranet portal'],
 c:[0,1,2],
 why:'The plan names exactly three behaviours: <b>sudden ACL or firewall rule modifications</b>, <b>unusual cross-boundary (east-west) flows</b>, and <b>simultaneous ingress/egress anomalies</b> — and it stresses correlation between them. A CPU spike, a normal DHCP lease, and failed portal logins are generic events: they can mean anything, and they are not in the strategy. Building detections on the named behaviours keeps false positives low.',
 study:'the three observable behaviours in the T1599 detection strategy.',
 hint:'The plan is about what the device ALLOWS and what traffic CROSSES. Which three options talk about exactly that?'},
{id:'med-03',type:'order',
 sc:[{t:'ARTEFACT 1 — Lab brief (FRP walkthrough)',x:'<p class="sc-p">In the Indian critical infrastructure intrusions, investigators observed <b>FRP</b> (a fast reverse proxy tool) used to bridge network boundaries and overcome NAT. Rebuild the same flow in the correct order.</p>'}],
 sum:'The FRP reverse-tunnel flow used to cross NAT',
 q:'Put the four attacker steps in the order they happen.',
 items:['Take control of a host inside the network','Install the FRP reverse proxy tool on that host','The tool dials out and opens a tunnel through the NAT to the attacker server','Reach internal systems such as RDP through the tunnel'],
 why:'FRP is a <b>reverse</b> proxy: the attacker must first own an inside host, then install the tool there. The inside host dials <i>outward</i> to the attacker server — which crosses the NAT the same way any web browsing does — and the tunnel then carries the attacker back in. From there they reach internal services like RDP as if they were inside. Order matters: the tunnel cannot exist before the tool is installed, and the tool cannot be installed before a host is controlled.',
 study:'how reverse proxy tools like FRP traverse NAT, and why they bridge boundaries.',
 hint:'The host must be owned before anything is installed, and the tunnel must exist before the attacker can use RDP through it.'},
{id:'med-04',type:'match',
 sc:[{t:'ARTEFACT 1 — Linked techniques from the T1599 page text',x:'<p class="sc-p">The T1599 description links bridging to follow-on techniques: "...allowing them to then further achieve goals such as command and control via Multi-hop Proxy or exfiltration of data via Traffic Duplication. Adversaries may also target internal devices ... and abuse these in conjunction with Internal Proxy."</p>'}],
 sum:'Match each linked technique to the goal it serves',
 q:'Match each technique to what it achieves for the attacker.',
 left:['T1599 — Network Boundary Bridging','T1090.001 — Internal Proxy','T1090.003 — Multi-hop Proxy','T1020.001 — Traffic Duplication'],
 right:['Change a boundary device so forbidden traffic can cross the trust zone','Route traffic through a compromised host inside the network','Chain several proxies so command and control traffic is hard to trace','Send copied data streams out to more than one place at once'],
 extra:['Encrypt files on a disk and demand payment'],
 correct:[0,1,2,3],
 why:'These four techniques form a chain. T1599 opens the path by controlling the boundary device. The path is then used for command and control through a <b>Multi-hop Proxy</b> (T1090.003), traffic can be steered through an <b>Internal Proxy</b> (T1090.001) on a compromised internal host, and data can leave while being copied to several destinations with <b>Traffic Duplication</b> (T1020.001). File encryption for ransom money is a different technique family entirely.',
 study:'the follow-on goals named in the T1599 description.',
 hint:'One chip is about opening the door, two are about routing traffic, one is about copying data out. Ransomware is none of these.'},
{id:'med-05',type:'dnd',
 sc:[{t:'ARTEFACT 1 — Control mapping worksheet',x:'<p class="sc-p">Your team maps the T1599 mitigations to the exact risks they close. Drag each mitigation to the risk it addresses. Two chips are distractors.</p>'}],
 sum:'Map mitigations to the risks they close',
 q:'Drag each mitigation onto the risk it addresses.',
 slots:['A stolen device admin password must not be enough to log in','Admin accounts must be few and must not overlap with server or endpoint accounts','Local device passwords must be stored encrypted, never in plain text','Malicious packets from a compromised device must be blocked without touching that device'],
 items:['M1032 Multi-factor Authentication','M1026 Privileged Account Management','M1043 Credential Access Protection','M1037 Filter Network Traffic'],
 extra:['M1027 Password Policies (NIST)','Full-disk encryption on laptops'],
 correct:[0,1,2,3],
 why:'Each mitigation closes one specific door. <b>M1032</b> (MFA over TACACS+/RADIUS) makes a stolen password alone useless. <b>M1026</b> keeps admin accounts few and stops credential overlap between network and non-network systems. <b>M1043</b> removes plain-text device passwords, which an attacker would otherwise read straight off the device. <b>M1037</b> is the incident-time control: block the malicious packets on an <i>unaffected</i> device in path, because the compromised one cannot be trusted. M1027 and disk encryption are good controls but they answer different questions.',
 study:'the five T1599 mitigations and which risk each one closes.',
 hint:'Two chips are about identity (second factor, account hygiene), one about storage, and one about blocking traffic somewhere else.'},
{id:'med-06',type:'tree',
 sc:[{t:'ARTEFACT 1 — SOC alert queue (excerpt)',x:'<p class="sc-p">Alert 22:41 — "Border router rtr-edge-01: new peer-style connection from an internal host to an outside address. No matching config change found yet."</p>'}],
 sum:'A new peer connection on the border router with no config change yet',
 q:'You take the alert. Work through the three steps.',
 steps:[
  {text:'Step 1 — The alert shows a connection but no config change yet. What do you pull first?',
   o:['The NAT translation table and the current device configuration','A full reboot of the router','An email to all staff asking about the connection'],c:0},
  {text:'Step 2 — The NAT table shows a translation for an internal server that no rule explains, and the change log shows an ACL edit four minutes before. What does this combination suggest?',
   o:['A routine DHCP lease renewal','Possible T1599 bridging: a config change followed by cross-boundary traffic','A routine NTP time sync'],c:1},
  {text:'Step 3 — You open a case and escalate to the network security team. What do you attach?',
   o:['The office holiday calendar','The user handbook of the router','The config change events and the flow records'],c:2}],
 why:'Step 1: the evidence for bridging lives on the device — the NAT table and configuration show what the device now allows. Step 2: a config change followed by new cross-boundary traffic is the T1599 pattern from the detection strategy. Step 3: the case needs the raw evidence — change events and flow records — so the next team can verify, not guess. Reboots destroy live state, and calendars or handbooks prove nothing.',
 study:'the triage order for a suspected boundary bridging alert.',
 hint:'Each step asks for the source that proves the NEXT fact: what the device allows, what that means, and what the next team needs.'},
{id:'med-07',type:'spot',
 sc:[{t:'ARTEFACT 1 — Hardening checklist for network devices (review draft)',lines:['1. Enable MFA (TACACS+/RADIUS) for all device admin accounts','2. Restrict device management access to a dedicated management VLAN','3. Store the enable secret and local user passwords in plain text so recovery stays easy','4. Back up device configurations and review them regularly']}],
 sum:'One line in the hardening checklist is wrong',
 q:'Click the checklist line that is the mistake.',
 lines:['1. Enable MFA (TACACS+/RADIUS) for all device admin accounts','2. Restrict device management access to a dedicated management VLAN','3. Store the enable secret and local user passwords in plain text so recovery stays easy','4. Back up device configurations and review them regularly'],
 c:[2],
 why:'Line 3 is the mistake. Mitigation <b>M1043 Credential Access Protection</b> says the opposite: some devices can store local passwords in plain text or encrypted form — where the vendor allows it, always choose <b>encrypted</b>. Plain-text passwords on a device are a gift to any attacker who gets file-level access or a config export, and they enable exactly the admin takeover that T1599 needs. The other three lines are solid practice.',
 study:'Mitigation M1043 and why plain-text device passwords must be avoided.',
 hint:'One line makes the attacker\'s first step (getting admin rights) easier instead of harder.'},
{id:'med-08',type:'term',
 sc:[{t:'ARTEFACT 1 — Work request (team chat)',x:'<p class="sc-p"><b>Team lead (chat):</b> "On rtr-edge-01, show me only the NAT translations that involve host 10[.]44[.]2[.]77. Same read-only show command you know — you need to filter its output."</p>'}],
 sum:'Filtered NAT table request on a simulated router',
 q:'Type the command, press Enter to run it, then press Check.',

 goal:'Show only NAT translations involving 10[.]44[.]2[.]77. You know the read-only table command; add a filter to its output. Do not clear anything.',
 simOut:[{re:'^show\\s+ip\\s+nat\\s+translations\\s*\\|\\s*include\\s+10\\.44\\.2\\.77',out:['tcp 203[.]0[.]113[.]9:55901 10[.]44[.]2[.]77:55901 198[.]51[.]100[.]77:443 198[.]51[.]100[.]77:443','udp 203[.]0[.]113[.]9:50053 10[.]44[.]2[.]77:50053 203[.]0[.]113[.]44:53 203[.]0[.]113[.]44:53','--- 2 matching translations ---']},{re:'^show\\s+ip\\s+nat\\s+translations',out:['Pro  Inside global        Inside local        Outside local       Outside global','tcp 203[.]0[.]113[.]9:55101 10[.]20[.]4[.]15:55101 203[.]0[.]113[.]44:443 203[.]0[.]113[.]44:443','tcp 203[.]0[.]113[.]9:55901 10[.]44[.]2[.]77:55901 198[.]51[.]100[.]77:443 198[.]51[.]100[.]77:443','udp 203[.]0[.]113[.]9:50053 10[.]44[.]2[.]77:50053 203[.]0[.]113[.]44:53 203[.]0[.]113[.]44:53','--- (unfiltered table: you were asked for a filtered view) ---']}],
 correctElems:[{s:'show',name:'the read-only verb "show"'},{s:'ip nat translation',name:'the NAT translations table'},{s:'| include 10[.]44[.]2[.]77',name:'the output filter "| include 10[.]44[.]2[.]77" (plain dots accepted)'}],
 wrongElems:[{s:'clear',name:'"clear" wipes live state — not acceptable',dangerous:true,msg:'"clear ip nat ..." would remove live translations on a live device. The request was read-only. Always prefer "show ... | include" for filtered views.'},{s:'exclude',name:'"exclude" hides exactly the lines you were asked to show'},{s:'statistics',name:'"statistics" shows counters, not the translation table'}],

 canonWhy:'<p style="margin:6px 0 0"><b>show ip nat translations</b> — the live table. <b>| include 10[.]44[.]2[.]77</b> — keeps only lines containing that host. The pipe filter is the IOS way to narrow command output; "exclude" would do the opposite of what was asked.</p>',
 why:'Two steps in one line: pick the read-only <b>translations table</b> command, then narrow its output with <b>| include &lt;host&gt;</b>. "exclude" would hide the very lines you need, "statistics" shows counters instead of translations, and "clear" would destroy live state. The normaliser accepts the IP with plain dots too.',

{id:'med-09',type:'qcm',
 sc:[{t:'ARTEFACT 1 — ATT&CK excerpt (T1599)',x:'<p class="sc-p">"...an adversary can reconfigure the device to allow the traffic they want, allowing them to then further achieve goals such as command and control via Multi-hop Proxy or exfiltration of data via Traffic Duplication."</p>'}],
 sum:'The page names the follow-on C2 technique after bridging',
 q:'After bridging the boundary, the attacker wants command and control that is hard to trace. Which follow-on technique does the T1599 page name for this?',
 o:['T1090.003 — Multi-hop Proxy','T1486 — Data Encrypted for Impact','T1059 — Command and Scripting Interpreter','T1078 — Valid Accounts'],
 c:[0],
 why:'The T1599 text names it directly: command and control via <b>Multi-hop Proxy (T1090.003)</b>. The bridged path lets the attacker chain proxies so the C2 traffic is hard to attribute. T1486 is destructive file encryption, T1059 is running scripts, and T1078 is logging in with legitimate accounts — none of them is the follow-on C2 technique named on this page.',
 study:'the follow-on goals the T1599 page links to: Multi-hop Proxy and Traffic Duplication.',
 hint:'The answer is a proxy technique with a number of hops in its name.'},
{id:'med-10',type:'fib',
 sc:[{t:'ARTEFACT 1 — Detection engineering doc (draft)',x:'<p class="sc-p">You are writing the T1599 analytic description for your SIEM docs. Fill the three missing words.</p>'}],
 sum:'Finish the detection analytic description',
 q:'Complete the sentence from the word bank.',
 text:'For T1599 detection, correlate {{0}} changes on the router or firewall with {{1}} traffic patterns, especially from {{2}} sources.',
 bank:['configuration','unexpected','unusual','encrypted','monthly'],
 blanks:[{accept:['configuration','config']},{accept:['unexpected','anomalous']},{accept:['unusual','new','odd']}],
 why:'The analytic (AN0015) works because <b>configuration</b> changes on their own are common, and strange flows on their own are common too — but a config change followed by <b>unexpected</b> traffic from <b>unusual</b> sources is the strong signal. "Encrypted" and "monthly" do not belong to this correlation at all.',
 study:'the multi-event correlation idea in DET0006 / AN0015.',
 hint:'The first blank is what the admin does to a device; the other two describe the traffic that follows.'},
{id:'med-11',type:'spot',
 sc:[{t:'ARTEFACT 1 — Segmentation firewall log (fw-core-01)',viewer:true,lines:['11:40:01 fw-core-01 %SEC-6-IPACCESSLOGP: list VLAN-OFFICE deny tcp 10[.]30[.]5[.]10(52000) -> 10[.]40[.]8[.]25 eq 445','11:41:12 fw-core-01 %SEC-6-IPACCESSLOGP: list VLAN-FACTORY permit tcp 10[.]40[.]8[.]25(53000) -> 10[.]30[.]7[.]4 eq 5985','11:42:03 fw-core-01 %SEC-6-IPACCESSLOGP: list VLAN-OFFICE deny udp 10[.]30[.]5[.]10(53053) -> 10[.]40[.]8[.]1 eq 161','11:43:44 fw-core-01 %SEC-6-IPACCESSLOGP: list VLAN-OFFICE permit tcp 10[.]30[.]5[.]33(53111) -> 10[.]30[.]5[.]40 eq 445','11:45:09 fw-core-01 %SYS-5-CONFIG_I: Configured from console by admin on vty2 (10[.]20[.]9[.]140)','11:46:31 fw-core-01 %SEC-6-IPACCESSLOGP: list VLAN-FACTORY permit tcp 10[.]40[.]8[.]25(53188) -> 10[.]40[.]7[.]5 eq 5985']}],
 sum:'Policy: office VLAN and factory VLAN must never talk directly',
 q:'Policy forbids direct traffic between the office VLAN (10[.]30[.]0[.]0/16) and the factory VLAN (10[.]40[.]0[.]0/16). Click the line that shows a flow contradicting the segmentation.',
 lines:['11:40:01 fw-core-01 %SEC-6-IPACCESSLOGP: list VLAN-OFFICE deny tcp 10[.]30[.]5[.]10(52000) -> 10[.]40[.]8[.]25 eq 445','11:41:12 fw-core-01 %SEC-6-IPACCESSLOGP: list VLAN-FACTORY permit tcp 10[.]40[.]8[.]25(53000) -> 10[.]30[.]7[.]4 eq 5985','11:42:03 fw-core-01 %SEC-6-IPACCESSLOGP: list VLAN-OFFICE deny udp 10[.]30[.]5[.]10(53053) -> 10[.]40[.]8[.]1 eq 161','11:43:44 fw-core-01 %SEC-6-IPACCESSLOGP: list VLAN-OFFICE permit tcp 10[.]30[.]5[.]33(53111) -> 10[.]30[.]5[.]40 eq 445','11:45:09 fw-core-01 %SYS-5-CONFIG_I: Configured from console by admin on vty2 (10[.]20[.]9[.]140)','11:46:31 fw-core-01 %SEC-6-IPACCESSLOGP: list VLAN-FACTORY permit tcp 10[.]40[.]8[.]25(53188) -> 10[.]40[.]7[.]5 eq 5985'],
 c:[1],
 why:'Line 2 shows a factory host (10[.]40[.]8[.]25) reaching an office host (10[.]30[.]7[.]4) on WinRM port 5985 — and the device <b>permitted</b> it. That is an east-west flow across two separated VLANs, exactly what the policy forbids and what the T1599 detection strategy calls "unusual cross-boundary traffic". Lines 1 and 3 were <b>denied</b> (the boundary still holds for them), line 4 stays inside one VLAN, line 6 stays inside the factory VLAN, and line 5 is a config change with no flow attached here.',
 study:'reading rule-hit logs: which interface list, which direction, permit or deny.',
 hint:'You need a PERMITTED flow whose source is in 10[.]40[.] and whose destination is in 10[.]30[.]'},
{id:'med-12',type:'dnd',
 sc:[{t:'ARTEFACT 1 — Four events from the shift handover',x:'<p class="sc-p">Sorting exercise for the new analyst. Drag each event to the right box.</p>'}],
 sum:'Bridging indicators versus routine events',
 q:'Drag each event to the correct box.',
 slots:['Strong bridging indicator (per DET0006)','Routine event'],
 items:['An ACL edit followed within minutes by new cross-boundary traffic','Simultaneous ingress and egress anomalies after an unexplained rule change','A firewall change executed during the approved maintenance window with a ticket','A new syslog server added by an approved change request'],
 correct:[0,0,1,1],
 why:'The detection strategy stresses <b>multi-event correlation</b>: a rule change followed by unexpected traffic, or simultaneous ingress/egress anomalies, are strong indicators. The other two events have approved tickets and fit the change calendar — they are routine. The lesson: the same "config changed" log line is routine with a ticket and alarming without one.',
 study:'why correlation of two events beats watching one event type.',
 hint:'Ask for each event: is there a second, connected event — and is there an approved ticket?'},
{id:'med-13',type:'multi',
 sc:[{t:'ARTEFACT 1 — Red-team debrief (excerpt)',x:'<p class="sc-p">"Why did you reconfigure the edge device instead of deploying implants on twenty endpoints?" asked the blue team. The red team gave two honest reasons — and admitted two things they could NOT claim.</p>'}],
 sum:'Why attackers prefer device control over endpoint malware',
 q:'Select the TWO honest reasons the red team could give.',
 o:['No implant is needed on internal endpoints, so endpoint antivirus sees nothing','One change can serve many systems: traffic for the whole zone can cross at once','It leaves no trace anywhere, ever','It works without any access to the device','It automatically evades MFA'],
 c:[0,1],
 why:'Device control is <b>leverage</b>: one change serves the whole zone, and no endpoint implant means endpoint telemetry stays clean. But the red team must admit the limits: the change itself appears in <b>device logs</b> (that is exactly what DET0006 correlates), it needs <b>sufficient rights</b> on the device first, and <b>MFA (M1032)</b> defends the admin path like any other login. "No trace, no access, auto-MFA-bypass" are the claims they cannot make.',
 study:'the attacker trade-offs of boundary bridging versus endpoint malware.',
 hint:'Both true reasons are about leverage and quietness. The false ones claim perfection.'},
{id:'med-14',type:'match',
 sc:[{t:'ARTEFACT 1 — Telemetry catalogue (draft)',x:'<p class="sc-p">The detection team lists the sources that feed the T1599 analytic. Match each source to what it actually shows.</p>'}],
 sum:'Match each telemetry source to what it reveals',
 q:'Match each data source to what it reveals.',
 left:['Device configuration history','NAT translation table','Flow records (NetFlow-style)','VPN concentrator logs'],
 right:['Which rules or ACL entries were changed, and when','Which inside hosts currently talk to which outside hosts','Which traffic actually crossed the boundary, between which addresses','Which tunnels were set up, when, and from where'],
 extra:['Printer queue statistics'],
 correct:[0,1,2,3],
 why:'Each source answers one question. Configuration history shows the <b>rule changes</b>. The NAT translation table shows the <b>live address pairs</b> crossing the device. Flow records show the <b>actual traffic</b> that crossed, even after the fact. VPN logs show <b>tunnel setup</b>, which matters because attackers have used VPN tunnels (for example with a compromised MSP entity) to enter directly. Printer queues tell you nothing about boundaries.',
 study:'which telemetry feeds each part of the T1599 detection.',
 hint:'One source shows changes, one shows live address pairs, one shows the traffic itself, one shows tunnels.'},
{id:'med-15',type:'qcm',
 sc:[{t:'ARTEFACT 1 — Config diff (rtr-edge-01)',code:['+ ip nat inside source static tcp 10[.]44[.]2[.]15 3389 203[.]0[.]113[.]9 3390','  (no other lines changed)']},
     {t:'ARTEFACT 2 — Change database',x:'<p class="sc-p">No approved change for rtr-edge-01. Note: request CHG-1187 — "publish RDP for 10[.]44[.]2[.]15" — was <b>rejected</b> last week by the change board.</p>'}],
 sum:'A static NAT rule appeared; the same request was rejected before',
 q:'What does this combination most suggest?',
 o:['A vendor bug silently changed the config','An accepted risk approved by management','A typo with no effect on traffic','An unauthorised static NAT exposing an internal host — consistent with boundary bridging (T1599)'],
 c:[3],
 why:'A <b>static NAT</b> rule publishes an inside service on the border device\'s public address: here, RDP (TCP 3389) of 10[.]44[.]2[.]15 becomes reachable on 203[.]0[.]113[.]9 port 3390 from anywhere. That is a bridge across the boundary by definition. The change board <b>rejected</b> exactly this request, so "accepted risk" is false, and nothing in the artefacts points to a vendor bug or a harmless typo.',
 study:'what "ip nat inside source static" publishes, and why it bridges a boundary.',
 hint:'Read the rule as a sentence: "anyone out there can reach this inside host on port X".'},
{id:'med-16',type:'order',
 sc:[{t:'ARTEFACT 1 — Mitigation M1037 text (excerpt)',x:'<p class="sc-p">"Upon identifying a compromised network device being used to bridge a network boundary, block the malicious packets using an unaffected network device in path... Continue to monitor for additional activity and to ensure that the blocks are indeed effective."</p>'}],
 sum:'The defender response sequence after confirming bridging',
 q:'Put the four response steps in the right order.',
 items:['Preserve evidence: export the device configuration and logs','Block the malicious flows on an unaffected device in path (M1037)','Keep monitoring for further activity and confirm the block works','Report to the incident owner and review how access was gained'],
 why:'Evidence comes first: exporting the config and logs preserves what the attacker changed, before anything touches the device. Then <b>M1037</b> says to block on an <i>unaffected</i> device in path — not on the compromised one. The mitigation also demands <b>continued monitoring</b> to confirm the block is effective. Reporting and the access review come last, once the bleeding is stopped. Blocking before preserving would destroy the very proof you need.',
 study:'the M1037 response order: preserve, block elsewhere, monitor, report.',
 hint:'The M1037 text gives you steps two and three. What must happen before them, and what closes the case?'}

/* ================= ENGINE ================= */
function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmtT(s){s=Math.max(0,s|0);var m=(s/60)|0,x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function norm(s){return String(s==null?'':s).toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'');}
function nrmIP(s){return norm(s).replace(/\[\.\]/g,'.');}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function plainText(s){return String(s).replace(/<[^>]*>/g,'');}
function scoreExercise(selected,correct){
 var cs={};(correct||[]).forEach(function(k){cs[String(k)]=1;});
 var H=0,W=0;(selected||[]).forEach(function(k){if(cs[String(k)])H++;else W++;});
 var N=Math.max(1,(correct||[]).length);
 return Math.max(0,(H-W)/N);
}
var S={view:'intro',order:[],cur:0,rec:{},skipped:[],sum:0,answered:0,reported:false,user:'',
 timer:{state:'RUNNING',left:0,tick:null,manualSec:0,fbSec:0,fbStart:0,prev:'RUNNING',pauseStart:0},
 reviewMode:false,w:null,exTimer:0,drag:null};
function curEx(){return EX[S.order[S.cur]];}
function curRec(){return S.rec[S.order[S.cur]];}
/* ---------- highlight & scenario ---------- */
function hl(l){
 var s=esc(l);
 s=s.replace(/(\d{1,3}(?:\[\.\]\d{1,3}){3})/g,'<span class="lv-ip">$1</span>');
 s=s.replace(/\b(permitted|permit|allow|established|success)\b/gi,'<span class="lv-kw-a">$1</span>');
 s=s.replace(/\b(denied|deny|drop|blocked|failed|fail)\b/gi,'<span class="lv-kw-r">$1</span>');
 s=s.replace(/\b(CONFIG_I|configured|NAT|translation|access-list|ACL|AAA|TACACS|RADIUS|alert|banner)\b/g,'<span class="lv-kw-c">$1</span>');
 s=s.replace(/^(\d{4}-\d{2}-\d{2}[ T]?\d{0,2}:?\d{0,2}:?\d{0,2})/,'<span class="lv-ts">$1</span>');
 s=s.replace(/^(\d{2}:\d{2}:\d{2})/,'<span class="lv-ts">$1</span>');
 return s;
}
function blkScenario(ex){
 var body=ex.sc.map(function(a){
  var inner=a.code?'<pre class="code">'+a.code.map(function(l){return hl(l);}).join('\n')+'</pre>':a.x;
  return '<div class="art">'+(a.t?'<span class="art-t">'+esc(a.t)+'</span>':'')+'<div class="art-b">'+(a.viewer?viewer(a):inner)+'</div></div>';
 }).join('');
 return '<div class="blk" id="scblk"><div class="blk-h bh-sc">◈ SCENARIO <button class="collapser" data-act="collapse" data-t="#scblk">— collapse</button></div>'
  +'<div class="sumline">'+esc(ex.sum)+'</div>'
  +'<div class="blk-b">'+body+'</div></div>';
}
function viewer(a){
 var h='<input type="text" class="lfilter" placeholder="Filter lines (text match)" aria-label="Filter log lines" data-lview="'+Math.random().toString(36).slice(2,7)+'">';
 h+='<pre class="code" data-vbody="1">'+a.lines.map(function(l){return '<span class="lv-line" data-vl="1">'+hl(l)+'</span>';}).join('')+'</pre>';
 return h;
}
document.addEventListener('input',function(e){
 var f=e.target;
 if(!f.classList||!f.classList.contains('lfilter'))return;
 var pre=f.parentElement.querySelector('pre[data-vbody]');
 if(!pre)return;
 var q=f.value.toLowerCase();
 pre.querySelectorAll('.lv-line').forEach(function(ln){
  ln.style.display=(!q||ln.textContent.toLowerCase().indexOf(q)>=0)?'':'none';
 });
});

function startExam(){
 S.view='exam';S.rec={};S.skipped=[];S.sum=0;S.answered=0;S.reported=false;S.reviewMode=false;
 S.order=shuffle(EX.map(function(_,i){return i;}));
 S.cur=0;S.timer.left=CFG.minutes*60;S.timer.manualSec=0;S.timer.fbSec=0;S.timer.state='RUNNING';S.timer.prev='RUNNING';
 clearInterval(S.timer.tick);S.timer.tick=setInterval(tick,1000);
 $('#hdr').classList.remove('hidden');document.body.classList.remove('pman');

function tick(){
 if(S.timer.state!=='RUNNING')return;
 if(S.exTimer>0){S.exTimer--;var tv=$('#extv');if(tv)tv.textContent=fmtT(S.exTimer);
  if(S.exTimer===0){var inp=$('#tcmd');if(inp)inp.disabled=true;var n=$('#exnote');if(n)n.textContent='⏱ Time for this exercise has ended. Press Check to grade what you have typed.';}}
 S.timer.left--;
 if(S.timer.left<=0){S.timer.left=0;renderHdr();finishExam(true);return;}

function widget(ex){

function wDnd(ex){

 w.pool=shuffle(ex.items.map(function(_,i){return i;}).concat(ex.extra?ex.extra.map(function(_,k){return 100+k;}):[]));
 w.slots=ex.slots.map(function(){return [];});w.pick=-1;

 });

function renderDnd(ex){
 var w=S.w;
 w.pool.forEach(function(i){
  var el=document.getElementById('chip-'+i);if(!el)return;
  var used=w.slots.some(function(arr){return arr.indexOf(i)>=0;});
  el.classList.toggle('used',used);el.classList.toggle('picked',w.pick===i);
 });
 ex.slots.forEach(function(s,si){
  var btn=document.querySelector('.slotbtn[data-s="'+si+'"]');if(!btn)return;
  var arr=w.slots[si];
  if(!arr.length){btn.innerHTML='<span class="s-ph">drop here</span>';}
  else{
   btn.innerHTML=arr.map(function(v){
    return '<span class="s-val" style="display:flex;align-items:center;gap:6px">'+esc(dndLabel(ex,v))+'<button class="btn" style="min-height:26px;padding:1px 7px;font-size:11px" data-act="dnd-clear" data-s="'+si+'" data-i="'+v+'" aria-label="Remove item from slot">✕</button></span>';
   }).join('');
  }
  btn.setAttribute('aria-label','Slot '+s+': '+(arr.length?arr.map(function(v){return plainText(dndLabel(ex,v));}).join(', '):'empty'));
 });
}
function placeDnd(itemI,slotI){
 var w=S.w,ex=curEx(),r=curRec();if(r&&r.checked)return;
 if(itemI==null||itemI<0)return;
 w.slots.forEach(function(arr){var p=arr.indexOf(itemI);if(p>=0)arr.splice(p,1);});
 w.slots[slotI].push(itemI);w.pick=-1;
 renderDnd(ex);
}

function wTerm(ex){
 var w=S.w;w.cmd='';w.ran=false;
 var h='';
 if(ex.goal)h+='<div class="syn"><b>Goal:</b> '+ex.goal+'</div>';
 if(ex.syntax){
  h+='<div class="syn"><div><b>Syntax reminder</b> — the shape of the command:</div><div class="mono" style="margin:6px 0">'+esc(ex.syntax.shape)+'</div><table>';
  ex.syntax.opts.forEach(function(o){h+='<tr><td class="k">'+esc(o.k)+'</td><td>'+esc(o.v)+'</td></tr>';});
  h+='</table>'+(ex.syntax.example?'<div style="margin-top:6px">Example on a different device: <span class="k">'+esc(ex.syntax.example)+'</span></div>':'')+'</div>';
 }
 if(ex.sampleOut)h+='<div class="syn"><b>Expected output shape</b> (from an earlier run on another router):<pre class="code" style="margin:6px 0 0">'+ex.sampleOut.map(esc).join('\n')+'</pre></div>';
 h+='<div class="term"><div class="t-out" id="tcout" aria-live="polite"></div><div class="t-row"><span class="t-p">'+esc(ex.prompt)+'</span><input type="text" id="tcmd" autocomplete="off" spellcheck="false" aria-label="Simulated command line. Type the command and press Enter."></div></div>';
 if(ex.sec)h+='<div class="extimer" id="exnote">⏱ Reduced per-exercise timer: <span id="extv">'+fmtT(ex.sec)+'</span> — announced before you start. It stops together with the exam timer (manual pause or Check).</div>';
 return h;

function runTerm(raw){
 var w=S.w,ex=curEx();if(!w||!w.hasOwnProperty('cmd'))return;
 var cmd=String(raw==null?'':raw);
 if(!cmd.replace(/\s/g,''))return;
 w.cmd=cmd;w.ran=true;
 var out=$('#tcout');if(!out)return;
 var n=nrmIP(cmd);
 var hit=ex.simOut&&ex.simOut.filter(function(so){return (new RegExp(so.re,'i')).test(n);})[0];
 var dangerHit=null;
 (ex.wrongElems||[]).forEach(function(we){if(we.dangerous&&(new RegExp(escRe(nrmIP(we.s)),'i')).test(n))dangerHit=we;});
 var res=hit?hit.out.join('\n'):(dangerHit&&dangerHit.out?dangerHit.out.join('\n')+'\n% WARNING: this command changes device state.':'% Command not recognized on this simulated device. Nothing was executed.');
 out.textContent+=ex.prompt+' '+cmd+'\n'+res+'\n';
 out.scrollTop=out.scrollHeight;
 var inp=$('#tcmd');if(inp)inp.value='';
}

/* ---------- grading ---------- */
function grade(ex){
 var w=S.w,g={H:0,W:0,N:1,items:[],canon:null,danger:null,credit:null},r=curRec();
 if(ex.type==='qcm'||ex.type==='multi'){
  var sel=(w.sel||[]).map(String),corr=ex.c.map(String);
  g.N=corr.length;
  sel.forEach(function(si){if(corr.indexOf(si)>=0)g.H++;else g.W++;});
  g.credit=scoreExercise(sel,corr);
  ex.c.forEach(function(ci){g.items.push({name:plainText(ex.o[ci]),state:sel.indexOf(String(ci))>=0?'ok':'miss'});});
  sel.forEach(function(si){var i2=parseInt(si,10);if(ex.c.indexOf(i2)<0)g.items.push({name:plainText(ex.o[i2]),state:'bad'});});
 }else if(ex.type==='spot'){
  g.N=1;var s0=(w.sel||[])[0];
  if(s0===ex.c[0])g.H=1;else g.W=1;
  g.items=[];
  if(s0==null)g.items.push({name:'No line was clicked',state:'miss'});
  else if(s0!==ex.c[0])g.items.push({name:'Line '+(s0+1)+': '+ex.lines[s0],state:'bad'});
  g.items.push({name:'Line '+(ex.c[0]+1)+': '+ex.lines[ex.c[0]],state:s0===ex.c[0]?'ok':'miss'});
 }else if(ex.type==='dnd'){
  g.N=ex.items.length;
  ex.items.forEach(function(_,i){
   var si=-1;w.slots.forEach(function(arr,ix){if(arr.indexOf(i)>=0)si=ix;});
   if(si<0)g.items.push({name:plainText(dndLabel(ex,i))+' — left unsorted',state:'miss'});
   else if(si===ex.correct[i]){g.H++;g.items.push({name:plainText(dndLabel(ex,i))+' → '+plainText(ex.slots[si]),state:'ok'});}
   else{g.W++;g.items.push({name:plainText(dndLabel(ex,i))+' → placed in "'+plainText(ex.slots[si])+'"',state:'bad'});}
  });
  (ex.extra||[]).forEach(function(_,k){
   var i=100+k,si=-1;w.slots.forEach(function(arr,ix){if(arr.indexOf(i)>=0)si=ix;});
   if(si>=0){g.W++;g.items.push({name:'Distractor placed: '+plainText(dndLabel(ex,i)),state:'bad'});}
  });
 }else if(ex.type==='order'){
  g.N=ex.items.length;
  w.ord.forEach(function(i,pos){
   if(i===pos){g.H++;g.items.push({name:'Position '+(pos+1)+': '+plainText(ex.items[i]),state:'ok'});}
   else{g.W++;g.items.push({name:'Position '+(pos+1)+': you placed "'+plainText(ex.items[i])+'"; correct: "'+plainText(ex.items[pos])+'"',state:'bad'});}
  });
 }else if(ex.type==='match'){
  g.N=ex.left.length;
  document.querySelectorAll('#answ select[data-mrow]').forEach(function(sl){
   var li=parseInt(sl.getAttribute('data-mrow'),10),v=parseInt(sl.value,10);
   if(v<0)g.items.push({name:ex.left[li]+' — no answer',state:'miss'});
   else if(v===ex.correct[li]){g.H++;g.items.push({name:plainText(ex.left[li])+' → '+plainText(ex.right[v]),state:'ok'});}
   else{g.W++;g.items.push({name:plainText(ex.left[li])+' → '+plainText(ex.right[v]),state:'bad'});}
  });
 }else if(ex.type==='fib'){
  g.N=ex.blanks.length;
  document.querySelectorAll('#answ input[data-b]').forEach(function(inp){
   var bi=parseInt(inp.getAttribute('data-b'),10),v=nrmIP(inp.value);
   var ok=ex.blanks[bi].accept.some(function(a){return nrmIP(a)===v;});
   if(!v)g.items.push({name:'Blank '+(bi+1)+' — left empty',state:'miss'});
   else if(ok){g.H++;g.items.push({name:'Blank '+(bi+1)+': "'+inp.value+'"',state:'ok'});}
   else{g.W++;g.items.push({name:'Blank '+(bi+1)+': "'+inp.value+'" — not a fit',state:'bad'});}
  });
 }else if(ex.type==='term'){
  var cmd=(w.cmd&&w.ran)?w.cmd:($('#tcmd')?$('#tcmd').value:'');
  g.N=ex.correctElems.length;g.canon=ex.canon;
  if(!cmd||!cmd.replace(/\s/g,'')){
   g.items=[{name:'You did not type a command',state:'miss'}];
  }else{
   var n=nrmIP(cmd);
   ex.correctElems.forEach(function(ce){
    var found=(ce.accept||[ce.s]).some(function(a){return n.indexOf(nrmIP(a))>=0;});
    if(found){g.H++;g.items.push({name:'Element: '+ce.name,state:'ok'});}
    else g.items.push({name:'Element: '+ce.name,state:'miss'});
   });
   (ex.wrongElems||[]).forEach(function(we){
    if(n.indexOf(nrmIP(we.s))>=0){g.W++;g.items.push({name:'Used: '+we.s+' — '+we.name,state:'bad'});if(we.dangerous)g.danger=we;}
   });
  }
 }else if(ex.type==='tree'){
  g.N=ex.steps.length;
  ex.steps.forEach(function(st,si){
   var v=w.chosen?w.chosen[si]:null;
   if(v==null)g.items.push({name:'Step '+(si+1)+' — no answer',state:'miss'});
   else if(v===st.c){g.H++;g.items.push({name:'Step '+(si+1)+': '+plainText(st.o[v]),state:'ok'});}
   else{g.W++;g.items.push({name:'Step '+(si+1)+': you chose "'+plainText(st.o[v])+'"',state:'bad'});}
  });
 }
 if(g.credit==null)g.credit=Math.max(0,(g.H-g.W)/Math.max(1,g.N));
 return g;
}
/* ---------- check / feedback / navigation ---------- */
function onCheck(){
 var i=S.order[S.cur],ex=curEx(),r=curRec();
 if(r&&r.checked)return;
 if(S.timer.state!=='RUNNING')return;
 var g=grade(ex);
 var credit=g.credit;
 if(r&&r.usedHint)credit=Math.max(0,credit-0.10);
 credit=Math.round(credit*100)/100;
 r=r||{};r.credit=credit;r.checked=true;r.usedHint=!!r.usedHint;r.skipped=false;r.g=g;
 S.rec[i]=r;S.sum+=credit;S.answered++;
 S.skipped=S.skipped.filter(function(x){return x!==i;});
 renderFeedback(ex,r,g);
 var an=$('#answ');if(an)an.classList.add('locked');
 var last=S.cur===EX.length-1;
 $('#navrow').innerHTML=last
  ?'<button class="btn primary" data-act="final">⏹ Final Submit — see results</button>'
  :'<button class="btn primary" data-act="next">Next exercise ▶</button>';
 S.timer.prev=S.timer.state;S.timer.state='PAUSED_AUTO_CHECK';S.timer.fbStart=Date.now();
 renderHdr();renderBar();
}
function itemsFraction(g){var ok=0;g.items.forEach(function(it){if(it.state==='ok')ok++;});return ok+'/'+g.N+' items correct';}
function renderFeedback(ex,r,g){
 var lbl,cls;
 if(r.credit>=0.999){lbl='✓ CORRECT';cls='ok';}
 else if(r.credit>0){lbl='✓ PARTIALLY CORRECT';cls='part';}
 else{lbl='✗ INCORRECT';cls='bad';}
 var h='<div class="fb '+cls+'"><div class="fb-h">'+lbl
  +(r.credit>0&&r.credit<0.999?' <span class="cred">— '+itemsFraction(g)+', credit '+r.credit.toFixed(2)+'</span>':'')
  +(r.usedHint?' <span class="cred">(−0.10 hint applied)</span>':'')+'</div><div class="fb-b">';
 if(g.N>1)h+='<p style="margin:0 0 8px">Partial credit: (correct − wrong) ÷ '+g.N+' = <b class="cred">'+r.credit.toFixed(2)+'</b>. '+itemsFraction(g)+'.</p>';
 h+=g.items.map(function(it){
  return '<div class="itrow '+(it.state==='ok'?'it-ok':(it.state==='bad'?'it-bad':'it-miss'))+'"><span style="white-space:nowrap;font-weight:700">'+(it.state==='ok'?'✓ Correct':(it.state==='bad'?'✗ Wrong':'○ Missed'))+'</span><span class="in">'+esc(it.name)+'</span></div>';
 }).join('');
 h+='<p style="margin:12px 0 0"><b>Why this is the right answer:</b></p><p style="margin:4px 0 0">'+ex.why+'</p>';
 if(ex.dual)h+='<p style="margin:8px 0 0">'+ex.dual+'</p>';
 if(g.canon)h+='<p style="margin:12px 0 4px"><b>Canonical command (copyable):</b></p><pre class="code copy" tabindex="0">'+esc(g.canon)+'</pre>';
 if(ex.canonWhy)h+='<div>'+ex.canonWhy+'</div>';
 if(g.danger)h+='<div class="danger"><span class="d-t">✗ DANGEROUS — NEAR MISS</span><p style="margin:6px 0 0">'+esc(g.danger.msg)+'</p></div>';
 if(ex.study)h+='<div class="study"><b>What to study:</b> '+ex.study+'</div>';
 h+='</div></div>';
 $('#fbwrap').innerHTML=h;
}
function onNext(){
 if(S.timer.state==='PAUSED_AUTO_CHECK'){S.timer.fbSec+=Math.max(0,Math.round((Date.now()-S.timer.fbStart)/1000));S.timer.state='RUNNING';renderHdr();}
 if(S.reviewMode){S.reviewMode=false;openReview();return;}
 if(S.cur<EX.length-1){S.cur++;renderEx();window.scrollTo({top:0,behavior:(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)?'auto':'smooth'});}
}
function onSkip(){
 var i=S.order[S.cur],r=curRec();
 if(r&&r.checked)return;
 S.rec[i]=S.rec[i]||{};S.rec[i].skipped=true;S.rec[i].checked=false;
 if(S.skipped.indexOf(i)<0)S.skipped.push(i);
 if(S.reviewMode){S.reviewMode=false;openReview();return;}
 if(S.cur<EX.length-1){S.cur++;renderEx();}
 else if(S.skipped.length)openReview();
 else finishExam(false);
 window.scrollTo(0,0);
}
function onHint(){
 var i=S.order[S.cur],ex=curEx(),r=curRec();
 if(r&&r.checked)return;
 if(r&&r.usedHint)return;
 r=r||{};r.usedHint=true;S.rec[i]=r;
 $('#hintwrap').innerHTML='<div class="hintbox" role="status"><span class="h-t">💡 Hint — costs 10% of this exercise\'s credit</span><p style="margin:6px 0 0">'+ex.hint+'</p></div>';
 renderHdr();
}
function onPause(){
 if(S.timer.state==='RUNNING'||S.timer.state==='PAUSED_AUTO_CHECK'){
  S.timer.prev=S.timer.state;S.timer.state='PAUSED_MANUAL';S.timer.pauseStart=Date.now();
  document.body.classList.add('pman');renderHdr();
 }
}
function onResume(){
 document.body.classList.remove('pman');
 S.timer.manualSec+=Math.max(0,Math.round((Date.now()-S.timer.pauseStart)/1000));
 if(S.timer.prev==='RUNNING')S.timer.state='RUNNING';
 else S.timer.state='PAUSED_AUTO_CHECK';
 renderHdr();
}
function onFinal(){
 if(S.timer.state==='PAUSED_AUTO_CHECK'){S.timer.fbSec+=Math.max(0,Math.round((Date.now()-S.timer.fbStart)/1000));S.timer.state='RUNNING';renderHdr();}
 if(S.skipped.length)openReview();else finishExam(false);
}
/* ---------- review & results ---------- */
function openReview(){S.view='review';renderReview();window.scrollTo(0,0);}
function renderReview(){
 var h='<div class="pbar"><div class="pfill" style="width:100%"></div></div>';
 h+='<div class="card"><h1 style="margin:0 0 6px;font-size:22px">⚠ Review skipped exercises</h1>';
 h+='<p style="color:var(--text-secondary);margin:6px 0 14px">You have '+S.skipped.length+' skipped exercise(s). You may answer them now, as long as the timer has not ended ('+fmtT(S.timer.left)+' left). Skipped exercises that stay unanswered are excluded from your score — they count neither for nor against you.</p>';
 if(S.timer.state==='ENDED')h+='<div class="danger"><span class="d-t">■ TIME ENDED</span><p style="margin:6px 0 0">The exam time is over. Submit to see your results.</p></div>';
 if(!S.skipped.length)h+='<p>Nothing left in the skipped pool. Press Submit exam to finish.</p>';
 S.skipped.forEach(function(i){
  var ex=EX[i];
  h+='<div class="rvitem"><span class="rt">⚠ Skipped</span><span class="rq">'+esc(plainText(ex.q).slice(0,140))+'…</span><button class="btn" data-act="rv-answer" data-i="'+i+'">✎ Answer now</button></div>';
 });
 var pending=false;
 EX.forEach(function(_,i){var r=S.rec[i];if(!r||(!r.checked&&!r.skipped))pending=true;});
 h+='<div class="navrow">'+(pending&&!S.reviewMode?'<button class="btn" data-act="rv-back">◀ Back to exam</button>':'')+'<span class="spacer"></span><button class="btn primary" data-act="rv-submit">⏹ Submit exam</button></div></div>';
 $('#exwrap').innerHTML=h;renderHdr();
}
function answerSkipped(i){S.view='exam';S.reviewMode=true;S.cur=S.order.indexOf(i);renderEx();window.scrollTo(0,0);}
function renderBar(){var done=0;EX.forEach(function(_,i){var r=S.rec[i];if(r&&r.checked)done++;});var el=document.querySelector('#exwrap .pfill');if(el)el.style.width=Math.round(done/EX.length*100)+'%';}
function finishExam(timeout){
 clearInterval(S.timer.tick);S.timer.state='ENDED';S.view='results';
 renderResults(timeout);reportOnce();window.scrollTo(0,0);
}
function renderResults(timeout){
 var full=0,part=0,zero=0,partSum=0;
 EX.forEach(function(_,i){var r=S.rec[i];if(r&&r.checked){if(r.credit>=0.999)full++;else if(r.credit>0){part++;partSum+=r.credit;}else zero++;}});
 var skippedLeft=EX.length-S.answered;
 var pct=S.answered>0?Math.round(S.sum/S.answered*100):0;
 var pass=pct>=CFG.passMark;
 var used=CFG.minutes*60-S.timer.left;
 var h='<div class="card res">';
 h+='<h1 class="'+(pass?'pass':'fail')+'">'+(pass?'✓ PASS':'✗ FAIL')+'</h1>';
 h+='<div class="bignum" style="color:'+(pass?'var(--state-correct)':'var(--state-incorrect)')+'">'+pct+'%</div>';
 h+='<p style="color:var(--text-secondary)">'+(timeout?'⏱ Time ended. ':'')+'Final score over answered exercises: <b>'+S.sum.toFixed(1)+' / '+S.answered+'</b>. Skipped-and-unanswered exercises are excluded. Pass mark: '+CFG.passMark+'%.</p>';
 h+='<div class="stats">';
 h+='<div class="stat ok"><div class="num">'+full+'</div><div class="lab">✓ Fully correct</div></div>';
 h+='<div class="stat part"><div class="num">'+part+'</div><div class="lab">✓ Partially correct'+(part?' — avg credit '+(partSum/part).toFixed(2):'')+'</div></div>';
 h+='<div class="stat bad"><div class="num">'+zero+'</div><div class="lab">✗ Fully incorrect</div></div>';
 h+='<div class="stat skip"><div class="num">'+skippedLeft+'</div><div class="lab">⚠ Skipped — excluded</div></div>';
 h+='</div>';
 h+='<p style="color:var(--text-secondary);font-size:14px">⏱ Time used: '+fmtT(used)+' of '+fmtT(CFG.minutes*60)+' · ⏸ Paused manually: '+fmtT(S.timer.manualSec)+' · ⏸ Reviewing feedback: '+fmtT(S.timer.fbSec)+'</p>';
 if(pass)h+='<div class="fb ok"><div class="fb-h">✓ PASS — certificate panel</div><div class="fb-b"><p style="margin:0">Well done! You reached '+pct+'%, above the '+CFG.passMark+'% pass mark. You have shown a solid understanding of '+esc(CFG.objId)+' — '+esc(CFG.objName)+' at '+CFG.sev+' level. Keep this knowledge: next time a boundary device changes configuration and new traffic appears, you will know what to ask for.</p></div></div>';
 else h+='<div class="fb bad"><div class="fb-h">✗ FAIL — retake required</div><div class="fb-b"><p style="margin:0 0 10px">You scored '+pct+'%, below the '+CFG.passMark+'% pass mark. Reread the intro screen, review the feedback you received during the exam, and try again. You can retake the exam as many times as you want.</p></div></div>';
 h+='<div class="navrow"><span class="spacer"></span><button class="btn primary" data-act="retake" style="min-width:220px;min-height:52px">↻ Retake exam</button></div>';
 h+='</div>';
 $('#exwrap').innerHTML=h;
 $('#b-hint').disabled=true;$('#b-skip').disabled=true;
}
function reportOnce(){
 if(S.reported)return;S.reported=true;
 var percent=S.answered>0?Math.round((S.sum/S.answered)*100):0;
 if(window.parent&&window.parent!==window){
  try{
   parent.postMessage({type:'CYBERPULSE_SCORE',topicId:CFG.topicId,batch:CFG.batch,
    score:Math.round(S.sum),total:S.answered,percent:percent,passed:percent>=CFG.passMark},location.origin);
  }catch(e){/* parent origin mismatch (e.g. file:// sandbox); nothing to report to */}
 }
}
function retake(){
 document.body.classList.remove('pman');
 startExam();window.scrollTo(0,0);
}
/* ---------- header ---------- */
function renderHdr(){
 $('#h-count').textContent='Exercise '+(S.cur+1)+' of '+EX.length;
 var sev=$('#h-sev');sev.textContent=CFG.sev;sev.className='badge '+CFG.sevClass;
 $('#h-time').textContent=fmtT(S.timer.left);
 var st=$('#h-tstate');
 if(S.timer.state==='RUNNING'){st.textContent='▶ RUNNING';st.className='tstate run';}
 else if(S.timer.state==='PAUSED_MANUAL'){st.textContent='⏸ PAUSED — manual (press Resume)';st.className='tstate pm';}
 else if(S.timer.state==='PAUSED_AUTO_CHECK'){st.textContent='⏸ PAUSED — reviewing feedback (resumes on Next)';st.className='tstate pa';}
 else{st.textContent='■ ENDED';st.className='tstate end';}
 $('#h-score').textContent=S.sum.toFixed(1)+' / '+S.answered;
 $('#h-pct').textContent=(S.answered>0?Math.round(S.sum/S.answered*100)+'%':'—');
 var r=curRec();
 $('#b-hint').disabled=!!(r&&(r.checked||r.usedHint));
 $('#b-skip').disabled=!!(r&&r.checked);
 renderWho();
}
function renderWho(){$('#h-who').textContent=S.user?'👤 '+S.user:'';}
/* ---------- events ---------- */
function bind(){
 document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act');
  if(act==='start')startExam();
  else if(act==='check')onCheck();
  else if(act==='next')onNext();
  else if(act==='final')onFinal();
  else if(act==='skip')onSkip();
  else if(act==='hint')onHint();
  else if(act==='pause')onPause();
  else if(act==='resume')onResume();
  else if(act==='finishearly')onFinal();
  else if(act==='retake')retake();
  else if(act==='collapse'){var b=document.querySelector(el.getAttribute('data-t'));if(b){b.classList.toggle('collapsed');el.textContent=b.classList.contains('collapsed')?'+ expand':'— collapse';}}
  else if(act==='opt')onOpt(el);
  else if(act==='spot')onSpot(el);
  else if(act==='chip')onChip(el);
  else if(act==='dnd-item')onDndItem(el);
  else if(act==='dnd-slot')onDndSlot(el);
  else if(act==='dnd-clear')onDndClear(el);
  else if(act==='ord-up')onOrdMove(el,-1);
  else if(act==='ord-dn')onOrdMove(el,1);
  else if(act==='tree-opt')onTreeOpt(el);
  else if(act==='tree-back')onTreeBack();
  else if(act==='rv-answer')answerSkipped(parseInt(el.getAttribute('data-i'),10));
  else if(act==='rv-back'){S.view='exam';S.reviewMode=false;renderEx();}
  else if(act==='rv-submit')finishExam(false);
 });
 document.addEventListener('keydown',function(e){
  var t=e.target;
  if(t&&t.id==='tcmd'&&e.key==='Enter'){runTerm(t.value);return;}
  if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'){e.preventDefault();t.click();}
 });
 document.addEventListener('dragstart',function(e){
  var el=e.target.closest('[draggable="true"]');if(!el)return;
  S.drag={kind:el.getAttribute('data-drag'),i:parseInt(el.getAttribute('data-i'),10)};
  try{e.dataTransfer.setData('text/plain',String(S.drag.i));}catch(x){}
 });
 document.addEventListener('dragover',function(e){
  var t=e.target.closest('.slot,.orow');if(!t)return;e.preventDefault();t.classList.add('over');
 });
 document.addEventListener('dragleave',function(e){
  var t=e.target.closest('.slot,.orow');if(t)t.classList.remove('over');
 });
 document.addEventListener('drop',function(e){
  var t=e.target.closest('.slot,.orow');if(!t)return;e.preventDefault();t.classList.remove('over');
  if(!S.drag)return;
  if(t.classList.contains('slot')&&S.drag.kind==='dnd')placeDnd(S.drag.i,parseInt(t.getAttribute('data-s'),10));
  else if(t.classList.contains('orow')&&S.drag.kind==='ord')moveOrdTo(S.drag.i,parseInt(t.getAttribute('data-i'),10));
  S.drag=null;
 });
 window.addEventListener('message',function(ev){
  var d=ev.data;if(!d)return;
  if(d.type!=='CYBERPULSE_INIT'&&d.type!=='CYBERMASTERY_INIT')return;
  S.user=d.username||'';renderWho();
 });
}
document.addEventListener('DOMContentLoaded',function(){
 S.order=EX.map(function(_,i){return i;});
 bind();renderIntro();
});
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
