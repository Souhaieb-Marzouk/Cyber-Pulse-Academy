function doSkip() {
  const ex = S.cur, r = S.records[ex.id];
  if (r.checked || S.fromReview) return;
  r.skipped = true;
  advance();
}
function doManualPause() {
  if (S.timer.state === "RUNNING" || S.timer.state === "PAUSED_AUTO_CHECK") {
    S.timer.returnTo = S.timer.state;
    setState("PAUSED_MANUAL");
    const ov = $("#pauseov");
    if (S.timer.returnTo === "PAUSED_AUTO_CHECK") {
      ov.querySelector("h3").textContent = "PAUSED \u2014 feedback review on hold";
      ov.querySelector("p").innerHTML = "The timer is stopped and the exercise is hidden.<br>Press Resume to return to the feedback review.";
    } else {
      ov.querySelector("h3").textContent = "PAUSED \u2014 manual break";
      ov.querySelector("p").innerHTML = "The timer is stopped and the exercise is hidden.<br>Press Resume when you are ready to continue.";
    }
    ov.classList.remove("hidden");
  }
}
function doResume() {
  $("#pauseov").classList.add("hidden");
  setState(S.timer.returnTo === "PAUSED_AUTO_CHECK" ? "PAUSED_AUTO_CHECK" : "RUNNING");
}
function doCheck() {
  const ex = S.cur, r = S.records[ex.id];
  if (r.checked) return;
  setState("PAUSED_AUTO_CHECK"); /* Check-triggered auto-pause happens FIRST, per contract */
  const res = S.curRenderer.collect();
  let credit = scoreExercise(res.H, res.W, res.N);
  if (r.hintUsed) credit = Math.max(0, credit - 0.10);
  r.credit = credit; r.checked = true;
  S.sum += credit; S.answered += 1;
  $("#b-hint").disabled = true; $("#b-skip").disabled = true;
  if (S.curRenderer.lock) S.curRenderer.lock(res);
  renderFeedback(ex, res, credit);
  const nb = $("#b-check");
  const isLast = S.idx === S.order.length - 1;
  nb.disabled = false;
  nb.onclick = advance;
  nb.innerHTML = S.fromReview ? "\u2192 Back to review" : (isLast ? "\u23F9 Final Submit" : "\u2192 Next");
  $("#checknote").textContent = isLast && !S.fromReview ? "Submitting shows your results and reports your score." : "";
  updateHeader();
}
function advance() {
  if (S.fromReview) { S.fromReview = false; showReview(); return; }
  S.idx++;
  if (S.idx < S.order.length) { setState("RUNNING"); renderExercise(); }
  else if (skippedIds().length > 0 && S.timer.state !== "ENDED") { showReview(); }
  else finalize(false);
}
function doNextFromReview(id) {
  S.idx = S.order.indexOf(id); S.fromReview = true;
  setState("RUNNING");
  renderExercise();
  $("#b-skip").disabled = true;
}

/* ---------------- feedback ---------------- */
function renderFeedback(ex, res, credit) {
  const fb = $("#feedback"); fb.innerHTML = "";
  const cls = credit >= 1 ? "c" : (credit > 0 ? "p" : "w");
  const label = credit >= 1 ? "\u2713 CORRECT" : (credit > 0 ? "\u2713 PARTIALLY CORRECT" : "\u2717 INCORRECT");
  const div = document.createElement("section"); div.className = "feed " + cls;
  let h = '<div class="feed-h">' + label;
  if (credit > 0 && credit < 1) h += ' <span class="creditline">\u2014 ' + res.H + "/" + res.N + " items, credit " + credit.toFixed(2) + "</span>";
  h += "</div>";
  let b = '<div class="feed-b">';
  if (res.nearMiss) b += '<div class="dangerbox">\u2717 DANGEROUS \u2014 NEAR MISS: your command could have run, but it would have changed or destroyed state. In a real investigation that can cost evidence.</div>';
  if (res.answerDisplay) b += "<h5>Correct answer</h5>" + '<div class="expl">' + res.answerDisplay + "</div>";
  if (credit > 0 && credit < 1) b += '<p class="creditline mt8">Credit: (H \u2212 W) / N = (' + res.H + " \u2212 " + res.W + ") / " + res.N + " = " + credit.toFixed(2) + (S.records[ex.id].hintUsed ? " \u2192 hint penalty applied (\u22120.10)" : "") + "</p>";
  if (res.items && res.items.length) {
    b += '<h5>Item-by-item breakdown</h5><div class="itemrows">';
    res.items.forEach((it) => {
      const st = it.status === "correct" ? '<span class="st c">\u2713 Correct</span>' : it.status === "wrong" ? '<span class="st w">\u2717 Wrong</span>' : '<span class="st m">\u25CB Missed</span>';
      b += '<div class="itemrow">' + st + "<span>" + it.text + "</span></div>";
    });
    b += "</div>";
  }
  const xp = ex.explain || {};
  b += '<h5>Why</h5><div class="expl">' + esc(xp.correct || "");
  if (xp.dual) {
    b += '<span class="dual red"><b class="red">\uD83D\uDD34 Red team view:</b> ' + esc(xp.dual.red) + "</span>";
    b += '<span class="dual blue"><b class="blue">\uD83D\uDD35 Blue team view:</b> ' + esc(xp.dual.blue) + "</span>";
  }
  if (xp.job) b += '<span class="job"><b>\uD83E\uDDF0 Real-world work task:</b> ' + esc(xp.job) + "</span>";
  b += "</div>";
  if (xp.wrong) b += '<h5>Why the wrong options fail</h5><div class="expl">' + esc(xp.wrong) + "</div>";
  if (xp.study) b += '<div class="study"><b>What to study next:</b> ' + esc(xp.study) + "</div>";
  b += "</div>";
  div.innerHTML = h + b;
  fb.appendChild(div);
  const cb = div.querySelector(".copybtn");
  if (cb && res.canonText) cb.addEventListener("click", () => {
    try { navigator.clipboard.writeText(res.canonText); cb.textContent = "Copied!"; } catch (e) { cb.textContent = "Select + copy"; }
  });
  smoothScroll(div);
}

/* ---------------- review skipped ---------------- */
function showReview() {
  S.cur = null; S.fromReview = false;
  if (S.timer.state !== "ENDED") setState("RUNNING"); /* review screen keeps the clock live, as its text promises */
  const v = $("#view"); v.innerHTML = "";
  const ids = skippedIds();
  const sec = document.createElement("section"); sec.className = "card block";
  let h = '<div class="block-h" style="color:var(--state-paused);border-left:4px solid var(--state-paused)"><span class="ic">\u26A0</span> Review skipped exercises</div><div class="block-b">';
  h += '<p class="dim">The timer is still running. You can answer any skipped exercise below, as many times as you like, until the timer ends or you press Final Submit. Skipped exercises you leave unanswered are excluded from your score.</p>';
  ids.forEach((id) => {
    const ex = exById(id);
    h += '<div class="rvrow"><span class="st">\u26A0 Skipped</span><span class="tx">' + esc(ex.scenario.summary) + '</span><button class="btn ghost" data-rid="' + id + '">\u25B6 Answer now</button></div>';
  });
  h += '<div class="actions"><button class="btn amber" id="b-finish">\u23F9 Final Submit</button></div></div>';
  sec.innerHTML = h; v.appendChild(sec);
  sec.querySelectorAll("[data-rid]").forEach((b) => b.addEventListener("click", () => doNextFromReview(b.getAttribute("data-rid"))));
  $("#b-finish").addEventListener("click", () => finalize(false));
  updateHeader();
}

/* ---------------- results ---------------- */
function finalize(timedOut) {
  setState("ENDED");
  const recs = S.order.map((id) => ({ id, r: S.records[id] || {} }));
  const full = recs.filter((x) => x.r.checked && x.r.credit >= 1).length;
  const partialList = recs.filter((x) => x.r.checked && x.r.credit > 0 && x.r.credit < 1);
  const wrong = recs.filter((x) => x.r.checked && x.r.credit <= 0).length;
  const skippedCount = recs.filter((x) => x.r.skipped && !x.r.checked).length;
  const avgP = partialList.length ? (partialList.reduce((a, x) => a + x.r.credit, 0) / partialList.length) : 0;
  const answered = S.answered;
  const percent = answered > 0 ? Math.round((S.sum / answered) * 100) : 0;
  const passed = answered > 0 && percent >= 70;
  $("#hdr").classList.add("hidden");
  const v = $("#view"); v.innerHTML = "";
  const head = document.createElement("section");
  head.className = "res-head " + (passed ? "pass" : "fail");
  head.innerHTML = '<div class="big" aria-hidden="true">' + (passed ? "\u2705" : "\u274C") + "</div><h2>" + (passed ? "PASS" : "FAIL") + "</h2>" +
    "<p>" + esc(D.meta.title) + "</p>" +
    (timedOut ? "<p>\u23F1 Time ran out \u2014 unanswered exercises were excluded from the score.</p>" : "") +
    '<div class="score">' + S.sum.toFixed(1) + " / " + answered + " \u00B7 " + percent + "% \u00B7 pass mark 70%</div>" +
    '<p class="small">' + (passed ? "Certificate-style result: you mastered this practice exam." : "You must retake this exam. Review the feedback you collected, then press Retake Exam.") + "</p>";
  v.appendChild(head);
  const grid = document.createElement("div"); grid.className = "resgrid";
  [["c", full, "\u2713 Fully correct"],
   ["p", partialList.length, "\u2713 Partially correct" + (partialList.length ? " (avg " + avgP.toFixed(2) + ")" : "")],
   ["w", wrong, "\u2717 Fully incorrect"],
   ["s", skippedCount, "\u26A0 Skipped \u2014 excluded"]].forEach(([k, n, l]) => {
    const c = document.createElement("div"); c.className = "rescard " + k; c.innerHTML = '<div class="n">' + n + '</div><div class="l">' + l + "</div>"; grid.appendChild(c);
  });
  v.appendChild(grid);
  const pl = document.createElement("div"); pl.className = "card";
  pl.innerHTML = '<div class="pauselog"><span>\u23F8 Time paused manually: <b>' + fmt(S.timer.manualSec) + "</b></span>" +
    "<span>\u23F8 Time paused for feedback review: <b>" + fmt(S.timer.autoSec) + "</b></span>" +
    "<span>\u23F1 Time left on the clock: <b>" + fmt(S.timer.remaining) + "</b></span></div>";
  v.appendChild(pl);
  const act = document.createElement("div"); act.className = "actions"; act.style.justifyContent = "center";
  act.innerHTML = '<button class="btn primary" id="b-retake">\u21BA Retake Exam</button>';
  v.appendChild(act);
  $("#b-retake").addEventListener("click", () => { renderIntro(); });
  if (!S.reported) { S.reported = true; reportScore(S.sum, answered, percent, passed); }
}
function reportScore(creditSum, answeredCount, percent, passed) {
  try {
    parent.postMessage({
      type: "CYBERPULSE_SCORE",
      topicId: D.meta.topicId,
      batch: D.meta.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: passed
    }, location.origin);
  } catch (e) { /* opened directly \u2014 nothing to report to */ }
}

/* ---------------- handshake ---------------- */
window.addEventListener("message", function (event) {
  if (!event.data) return;
  if (event.data.type !== "CYBERPULSE_INIT" && event.data.type !== "CYBERMASTERY_INIT") return;
  try { S.username = event.data.username || ""; updateHeader(); } catch (e) { }
});

/* ---------------- option helpers ---------------- */
function letter(i) { return String.fromCharCode(65 + i); }
function lockRows(area, correctSet, chosenSet) {
  area.querySelectorAll(".opt").forEach((o) => {
    o.disabled = true;
    const id = o.getAttribute("data-id");
    if (correctSet.has(id)) { o.classList.add("correct"); if (!o.querySelector(".mark")) { const m = document.createElement("span"); m.className = "mark c"; m.textContent = "\u2713 Correct"; o.appendChild(m); } }
    else if (chosenSet.has(id)) { o.classList.add("wrong"); const m = document.createElement("span"); m.className = "mark w"; m.textContent = "\u2717 Wrong"; o.appendChild(m); }
  });
}

/* ================= renderers ================= */
const RENDERERS = {
  /* ---- single choice ---- */
  qcm: function (ex, area) {
    const opts = shuffle(ex.options.map((o) => ({ id: o.id, text: o.text })));
    let chosen = null;
    const box = document.createElement("div"); box.className = "opts"; box.setAttribute("role", "radiogroup"); box.setAttribute("aria-label", "Answer options");
    opts.forEach((o, i) => {
      const b = document.createElement("button"); b.className = "opt"; b.type = "button"; b.setAttribute("data-id", o.id); b.setAttribute("role", "radio"); b.setAttribute("aria-checked", "false");
      b.innerHTML = '<span class="tag">' + letter(i) + ".</span><span>" + esc(o.text) + "</span>";
      b.addEventListener("click", () => { if (b.disabled) return; chosen = o.id; box.querySelectorAll(".opt").forEach((x) => { x.classList.remove("sel"); x.setAttribute("aria-checked", "false"); }); b.classList.add("sel"); b.setAttribute("aria-checked", "true"); });
      box.appendChild(b);
    });
    area.appendChild(box);
    return {
      collect: function () {
        const corr = ex.answer;
        const corrText = ex.options.find((o) => o.id === corr).text;
        if (chosen === corr) return { N: 1, H: 1, W: 0, answerDisplay: esc(corrText), items: [{ text: esc(corrText), status: "correct" }] };
        const wrongText = chosen ? ex.options.find((o) => o.id === chosen).text : "(no answer selected)";
        return { N: 1, H: 0, W: chosen ? 1 : 0, answerDisplay: esc(corrText), items: [{ text: esc(wrongText), status: "wrong" }, { text: esc(corrText), status: "missed" }] };
      },
      lock: function () { lockRows(area, new Set([ex.answer]), new Set(chosen ? [chosen] : [])); }
    };
  },
  /* ---- multi select ---- */
  multi: function (ex, area) {
    const opts = shuffle(ex.options.map((o) => ({ id: o.id, text: o.text })));
    const chosen = new Set();
    const box = document.createElement("div"); box.className = "opts";
    box.setAttribute("role", "group"); box.setAttribute("aria-label", "Select all that apply");
    opts.forEach((o) => {
      const b = document.createElement("button"); b.className = "opt"; b.type = "button"; b.setAttribute("data-id", o.id);
      b.innerHTML = '<span class="tag">\u2610</span><span>' + esc(o.text) + "</span>";
      b.addEventListener("click", () => {
        if (b.disabled) return;
        if (chosen.has(o.id)) { chosen.delete(o.id); b.classList.remove("sel"); b.querySelector(".tag").textContent = "\u2610"; }
        else { chosen.add(o.id); b.classList.add("sel"); b.querySelector(".tag").textContent = "\u2611"; }
      });
      box.appendChild(b);
    });
    const note = document.createElement("p"); note.className = "subq mt8"; note.textContent = "Select all that apply. Wrong selections subtract credit.";
    area.appendChild(box); area.appendChild(note);
    return {
      collect: function () {
        const N = ex.correct.length; let H = 0, W = 0; const items = [];
        ex.options.forEach((o) => {
          const inC = ex.correct.includes(o.id), sel = chosen.has(o.id);
          if (inC && sel) { H++; items.push({ text: esc(o.text), status: "correct" }); }
          else if (!inC && sel) { W++; items.push({ text: esc(o.text), status: "wrong" }); }
          else if (inC && !sel) { items.push({ text: esc(o.text), status: "missed" }); }
        });
        return { N, H, W, answerDisplay: esc(ex.correct.map((id) => ex.options.find((o) => o.id === id).text).join(" \u00B7 ")), items };
      },
      lock: function () { lockRows(area, new Set(ex.correct), chosen); }
    };
  },
  /* ---- matching ---- */
  match: function (ex, area) {
    const right = shuffle(ex.right.map((r) => ({ id: r.id, text: r.text })));
    const pairs = {};
    let selLeft = null, selRight = null, locked = false;
    const wrap = document.createElement("div"); wrap.className = "matchwrap";
    const lc = document.createElement("div"); lc.className = "mcol"; const rc = document.createElement("div"); rc.className = "mcol";
    ex.left.forEach((l) => {
      const d = document.createElement("div"); d.className = "mitem"; d.setAttribute("data-lid", l.id); d.tabIndex = 0; d.setAttribute("role", "button");
      d.setAttribute("aria-label", "Match item: " + l.text);
      d.innerHTML = "<span>" + esc(l.text) + '</span><span class="pair hidden" title="Click to undo this pair"></span>';
      d.addEventListener("click", () => { if (locked) return; selLeft = l.id; lc.querySelectorAll(".mitem").forEach((x) => x.classList.remove("selc")); d.classList.add("selc"); tryPair(); });
      d.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); d.click(); } });
      lc.appendChild(d);
    });
    right.forEach((r) => {
      const d = document.createElement("div"); d.className = "mitem"; d.setAttribute("data-rid", r.id); d.tabIndex = 0; d.setAttribute("role", "button");
      d.setAttribute("aria-label", "Match option: " + r.text);
      d.innerHTML = "<span>" + esc(r.text) + "</span>";
      d.addEventListener("click", () => { if (locked) return; selRight = r.id; rc.querySelectorAll(".mitem").forEach((x) => x.classList.remove("selc")); d.classList.add("selc"); tryPair(); });
      d.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); d.click(); } });
      rc.appendChild(d);
    });
    function tryPair() {
      if (!selLeft || !selRight) return;
      Object.keys(pairs).forEach((k) => { if (pairs[k] === selRight) delete pairs[k]; });
      pairs[selLeft] = selRight;
      selLeft = null; selRight = null;
      lc.querySelectorAll(".mitem").forEach((x) => x.classList.remove("selc"));
      rc.querySelectorAll(".mitem").forEach((x) => x.classList.remove("selc"));
      tryPairRedraw();
    }
    function tryPairRedraw() {
      lc.querySelectorAll(".mitem").forEach((x) => {
        const lid = x.getAttribute("data-lid"), p = x.querySelector(".pair");
        p.onclick = null;
        if (pairs[lid]) {
          p.classList.remove("hidden");
          const pos = right.findIndex((r) => r.id === pairs[lid]);
          p.textContent = "\u2192 " + (pos >= 0 ? pos + 1 : "?") + " \u2715";
          p.setAttribute("role", "button");
          p.setAttribute("aria-label", "Undo pair for this item");
          p.onclick = (ev) => { ev.stopPropagation(); if (locked) return; delete pairs[lid]; selLeft = null; selRight = null; lc.querySelectorAll(".mitem").forEach((y) => y.classList.remove("selc")); rc.querySelectorAll(".mitem").forEach((y) => y.classList.remove("selc")); tryPairRedraw(); };
        } else p.classList.add("hidden");
      });
    }
    wrap.appendChild(lc); wrap.appendChild(rc);
    area.appendChild(wrap);
    const note = document.createElement("p"); note.className = "subq mt8"; note.textContent = "Click one item on the left, then one on the right to pair them. The arrow chip shows the right-column number. Click a chip to undo a pair.";
    area.appendChild(note);
    return {
      collect: function () {
        const N = ex.left.length; let H = 0, W = 0; const items = [];
        ex.left.forEach((l) => {
          const myPair = pairs[l.id]; const corr = ex.pairs[l.id];
          const corrText = ex.right.find((r) => r.id === corr).text;
          if (myPair === corr) { H++; items.push({ text: esc(l.text) + " \u2192 " + esc(corrText), status: "correct" }); }
          else if (myPair) { W++; items.push({ text: esc(l.text) + " \u2192 " + esc(ex.right.find((r) => r.id === myPair).text) + " (correct: " + esc(corrText) + ")", status: "wrong" }); }
          else { items.push({ text: esc(l.text) + " (correct: " + esc(corrText) + ")", status: "missed" }); }
        });
        return { N, H, W, answerDisplay: esc(ex.left.map((l) => l.text + " \u2192 " + ex.right.find((r) => r.id === ex.pairs[l.id]).text).join(" \u00B7 ")), items };
      },
      lock: function () {
        locked = true;
        lc.querySelectorAll(".mitem").forEach((x) => { const lid = x.getAttribute("data-lid"); x.classList.add(pairs[lid] === ex.pairs[lid] ? "ok" : "ko"); x.style.pointerEvents = "none"; });
        rc.querySelectorAll(".mitem").forEach((x) => { x.style.pointerEvents = "none"; });
      }
    };
  },
  /* ---- ordering / ranking ---- */
  order: function (ex, area) {
    const isRank = ex.type === "rank";
    let items = shuffle(ex.items.map((i) => ({ id: i.id, text: i.text })));
    let locked = false;
    const list = document.createElement("div"); list.className = "ordlist";
    function draw() {
      list.innerHTML = "";
      items.forEach((it, i) => {
        const row = document.createElement("div"); row.className = "ordrow"; row.setAttribute("data-id", it.id);
        if (!locked) { row.draggable = true; row.classList.add("candrag"); }
        row.innerHTML = '<span class="pos">' + (isRank ? "Rank " + (i + 1) : "Step " + (i + 1)) + '</span><span class="otext">' + esc(it.text) + '</span><span class="mv">' +
          '<button type="button" aria-label="Move up" data-mv="up">\u2191</button><button type="button" aria-label="Move down" data-mv="down">\u2193</button></span>';
        row.addEventListener("dragstart", (e) => { row.classList.add("dragging"); e.dataTransfer.setData("text/plain", it.id); });
        row.addEventListener("dragend", () => row.classList.remove("dragging"));
        row.addEventListener("dragover", (e) => { e.preventDefault(); });
        row.addEventListener("drop", (e) => {
          e.preventDefault(); if (locked) return;
          const dragId = e.dataTransfer.getData("text/plain");
          const from = items.findIndex((x) => x.id === dragId); const to = items.findIndex((x) => x.id === it.id);
          if (from < 0 || to < 0 || from === to) return;
          const m = items.splice(from, 1)[0]; items.splice(to, 0, m); draw();
        });
        row.querySelector('[data-mv="up"]').addEventListener("click", () => { if (locked || i === 0) return; const t = items[i - 1]; items[i - 1] = items[i]; items[i] = t; draw(); });
        row.querySelector('[data-mv="down"]').addEventListener("click", () => { if (locked || i === items.length - 1) return; const t = items[i + 1]; items[i + 1] = items[i]; items[i] = t; draw(); });
        list.appendChild(row);
      });
    }
    draw(); area.appendChild(list);
    const note = document.createElement("p"); note.className = "subq mt8"; note.textContent = (isRank ? "Rank the items: position 1 is the highest priority. " : "Put the steps in the correct order. ") + "Drag rows or use the arrows.";
    area.appendChild(note);
    return {
      collect: function () {
        const N = items.length; let H = 0, W = 0; const rows = [];
        items.forEach((it, i) => {
          const ok = ex.correct[i] === it.id;
          if (ok) H++; else W++;
          rows.push({ text: (isRank ? "Rank " : "Position ") + (i + 1) + ": " + esc(it.text), status: ok ? "correct" : "wrong" });
        });
        return { N, H, W, answerDisplay: esc(ex.correct.map((cid, i) => (isRank ? "Rank " : "Position ") + (i + 1) + ": " + ex.items.find((x) => x.id === cid).text).join(" \u00B7 ")), items: rows };
      },
      lock: function () {
        locked = true;
        list.querySelectorAll(".ordrow").forEach((row, i) => {
          row.setAttribute("draggable", "false"); row.querySelector(".mv").remove();
          row.classList.add(ex.correct[i] === row.getAttribute("data-id") ? "ok" : "ko");
        });
      }
    };
  },
  /* ---- drag & drop into zones ---- */
  dnd: function (ex, area) {
    let bank = shuffle(ex.items.map((i) => ({ id: i.id, text: i.text })));
    const placed = {};
    let selItem = null, locked = false;
    const bankTitle = document.createElement("div"); bankTitle.className = "banktitle"; bankTitle.textContent = "Item bank \u2014 drag items into the correct zones (or click an item, then click a zone)";
    const bankEl = document.createElement("div"); bankEl.className = "bank"; bankEl.setAttribute("aria-label", "Item bank");
    const zonesEl = document.createElement("div"); zonesEl.className = "zones";
    const zoneMap = {};
    ex.zones.forEach((z) => {
      const zd = document.createElement("div"); zd.className = "zone"; zd.setAttribute("data-zid", z.id);
      zd.tabIndex = 0; zd.setAttribute("role", "button"); zd.setAttribute("aria-label", "Drop zone: " + z.label + ". Select an item from the bank, then activate this zone to place it.");
      zd.innerHTML = "<h4><span aria-hidden=\"true\">\uD83D\uDCC1</span> " + esc(z.label) + '</h4><div class="zdrop"></div>';
      zd.addEventListener("dragover", (e) => { e.preventDefault(); zd.classList.add("over"); });
      zd.addEventListener("dragleave", () => zd.classList.remove("over"));
      zd.addEventListener("drop", (e) => { e.preventDefault(); zd.classList.remove("over"); const id = e.dataTransfer.getData("text/plain"); place(id, z.id); });
      zd.addEventListener("click", (e) => { if (e.target.closest(".zitem")) return; if (selItem && !locked) place(selItem, z.id); });
      zd.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (selItem && !locked) place(selItem, z.id); } });
      zonesEl.appendChild(zd); zoneMap[z.id] = zd;
    });
    function drawBank() {
      bankEl.innerHTML = "";
      bank.forEach((it) => {
        const c = document.createElement("button"); c.type = "button"; c.className = "chip" + (selItem === it.id ? " selc" : ""); c.draggable = !locked; c.setAttribute("data-id", it.id);
        c.innerHTML = "<span>" + esc(it.text) + "</span>";
        c.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", it.id));
        c.addEventListener("click", () => { if (locked) return; selItem = (selItem === it.id ? null : it.id); drawBank(); });
        bankEl.appendChild(c);
      });
    }
    function place(id, zid) {
      if (locked || !id) return;
      bank = bank.filter((b) => b.id !== id); placed[id] = zid; selItem = null;
      drawBank(); drawZones();
    }
    function drawZones() {
      Object.keys(zoneMap).forEach((zid) => {
        const drop = zoneMap[zid].querySelector(".zdrop"); drop.innerHTML = "";
        Object.keys(placed).forEach((iid) => {
          if (placed[iid] !== zid) return;
          const it = ex.items.find((x) => x.id === iid);
          const row = document.createElement("div"); row.className = "zitem";
          row.innerHTML = '<span class="chip" style="cursor:default"><span>' + esc(it.text) + '</span></span><button class="rm" type="button" aria-label="Return item to bank">\u21A9</button>';
          row.querySelector(".rm").addEventListener("click", () => { if (locked) return; delete placed[iid]; bank.push(it); drawBank(); drawZones(); });
          drop.appendChild(row);
        });
      });
    }
    area.appendChild(bankTitle); area.appendChild(bankEl); area.appendChild(zonesEl);
    drawBank(); drawZones();
    return {
      collect: function () {
        const N = ex.items.length; let H = 0, W = 0; const rows = [];
        ex.items.forEach((it) => {
          const z = placed[it.id];
          const corrZ = Object.keys(ex.correct).find((k) => ex.correct[k].includes(it.id));
          const corrLabel = ex.zones.find((zn) => zn.id === corrZ).label;
          if (z === corrZ) { H++; rows.push({ text: esc(it.text) + " \u2192 " + esc(corrLabel), status: "correct" }); }
          else if (z) { W++; rows.push({ text: esc(it.text) + " \u2192 " + esc(ex.zones.find((zn) => zn.id === z).label) + " (belongs in: " + esc(corrLabel) + ")", status: "wrong" }); }
          else { rows.push({ text: esc(it.text) + " (belongs in: " + esc(corrLabel) + ")", status: "missed" }); }
        });
        return { N, H, W, answerDisplay: esc(ex.zones.map((z) => z.label + ": " + (ex.correct[z.id] || []).map((iid) => ex.items.find((i) => i.id === iid).text).join(", ")).join(" \u00B7 ")), items: rows };
      },
      lock: function () {
        locked = true;
        Object.keys(zoneMap).forEach((zid) => {
          const corr = ex.correct[zid] || [];
          const mine = Object.keys(placed).filter((iid) => placed[iid] === zid);
          const isOk = mine.length === corr.length && mine.every((iid) => corr.includes(iid));
          zoneMap[zid].classList.add(isOk ? "ok" : "ko");
          zoneMap[zid].querySelectorAll(".zitem .rm").forEach((b) => b.remove());
        });
        bankEl.querySelectorAll(".chip").forEach((c) => { c.draggable = false; c.disabled = true; });
      }
    };
  },
  /* ---- fill in the blanks ---- */
  blank: function (ex, area) {
    const parts = String(ex.text).split(/\{(\d+)\}/);
    const values = {};
    let bank = shuffle(ex.bank.slice());
    let locked = false;
    const slots = {};
    const holder = document.createElement("div"); holder.className = "blanks";
    const bankTitle = document.createElement("div"); bankTitle.className = "banktitle"; bankTitle.textContent = "Word bank \u2014 click a word to fill the next empty slot, or type directly";
    const bankEl = document.createElement("div"); bankEl.className = "bank";
    function drawText() {
      holder.innerHTML = "";
      parts.forEach((p, i) => {
        if (i % 2 === 0) { const s = document.createElement("span"); s.textContent = p; holder.appendChild(s); }
        else {
          const slot = document.createElement("span"); slot.className = "blankslot"; slot.setAttribute("data-slot", p);
          const inp = document.createElement("input"); inp.setAttribute("aria-label", "Blank " + p); inp.autocomplete = "off"; inp.spellcheck = false;
          inp.value = values[p] || "";
          inp.addEventListener("input", () => { if (locked) return; values[p] = inp.value; slot.classList.toggle("filled", !!inp.value.trim()); });
          const clr = document.createElement("button"); clr.className = "clr"; clr.type = "button"; clr.textContent = "\u2715"; clr.setAttribute("aria-label", "Clear blank " + p);
          clr.addEventListener("click", () => { if (locked) return; values[p] = ""; inp.value = ""; slot.classList.remove("filled"); });
          slot.appendChild(inp); slot.appendChild(clr); holder.appendChild(slot);
          slots[p] = slot;
        }
      });
    }
    function drawBank() {
      bankEl.innerHTML = "";
      bank.forEach((w) => {
        const c = document.createElement("button"); c.type = "button"; c.className = "chip"; c.textContent = w;
        c.addEventListener("click", () => {
          if (locked) return;
          const order = Object.keys(slots).sort((a, b) => Number(a) - Number(b));
          const target = order.find((s) => !values[s] || !values[s].trim());
          if (!target) return;
          values[target] = w; const inp = slots[target].querySelector("input"); inp.value = w; slots[target].classList.add("filled");
          bank = bank.filter((x) => x !== w); drawBank();
        });
        bankEl.appendChild(c);
      });
    }
    drawText(); drawBank();
    area.appendChild(holder); area.appendChild(bankTitle); area.appendChild(bankEl);
    const norm = (s) => String(s || "").trim().toLowerCase();
    return {
      collect: function () {
        const keys = Object.keys(ex.answers); const N = keys.length; let H = 0, W = 0; const rows = [];
        keys.forEach((k) => {
          const acc = ex.answers[k]; const arr = Array.isArray(acc) ? acc : [acc];
          const v = values[k] || "";
          if (v.trim() && arr.some((a) => norm(a) === norm(v))) { H++; rows.push({ text: "Blank {" + k + "}: " + esc(v), status: "correct" }); }
          else if (v.trim()) { W++; rows.push({ text: "Blank {" + k + "}: \u201C" + esc(v) + "\u201D \u2014 correct: " + esc(arr[0]), status: "wrong" }); }
          else { rows.push({ text: "Blank {" + k + "} \u2014 correct: " + esc(arr[0]), status: "missed" }); }
        });
        return { N, H, W, answerDisplay: esc(keys.map((k) => "{" + k + "} \u2192 " + (Array.isArray(ex.answers[k]) ? ex.answers[k][0] : ex.answers[k])).join(" \u00B7 ")), items: rows };
      },
      lock: function () {
        locked = true;
        bankEl.querySelectorAll(".chip").forEach((c) => c.disabled = true);
        holder.querySelectorAll("input").forEach((i) => i.disabled = true);
        holder.querySelectorAll(".clr").forEach((c) => c.remove());
        Object.keys(slots).forEach((k) => {
          const acc = ex.answers[k]; const arr = Array.isArray(acc) ? acc : [acc];
          slots[k].classList.add(arr.some((a) => norm(a) === norm(values[k])) ? "ok" : "ko");
        });
      }
    };
  },
  /* ---- spot the mistake (click lines) ---- */
  spot: function (ex, area) {
    const selected = new Set();
    let locked = false;
    const wrap = document.createElement("div"); wrap.className = "spotwrap";
    const pre = document.createElement("pre"); pre.className = "log";
    const lines = ex.lines;
    lines.forEach((ln, i) => {
      const sp = document.createElement("span"); sp.className = "logline clickable"; sp.tabIndex = 0; sp.setAttribute("role", "button");
      sp.innerHTML = '<span class="hl-ts">' + String(i + 1).padStart(2, " ") + " | </span>" + hlLine(ln);
      sp.setAttribute("aria-label", "Line " + (i + 1) + " (click to select as the mistake)");
      sp.addEventListener("click", () => {
        if (locked) return;
        if (selected.has(i)) { selected.delete(i); sp.classList.remove("sel"); }
        else { selected.add(i); sp.classList.add("sel"); }
      });
      sp.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sp.click(); } });
      pre.appendChild(sp);
    });
    wrap.appendChild(pre); area.appendChild(wrap);
    const note = document.createElement("p"); note.className = "subq mt8"; note.textContent = "Click a line to select it. Click again to deselect. Select several lines when the question asks for several.";
    area.appendChild(note);
    return {
      collect: function () {
        const N = ex.correct.length; let H = 0, W = 0; const rows = [];
        ex.correct.forEach((ci) => {
          const t = "Line " + (ci + 1) + ": " + esc(lines[ci]);
          if (selected.has(ci)) { H++; rows.push({ text: t, status: "correct" }); } else { rows.push({ text: t, status: "missed" }); }
        });
        selected.forEach((si) => { if (!ex.correct.includes(si)) { W++; rows.push({ text: "Line " + (si + 1) + ": " + esc(lines[si]) + " \u2014 not the mistake", status: "wrong" }); } });
        return { N, H, W, answerDisplay: esc(ex.correct.map((ci) => "Line " + (ci + 1) + ": " + lines[ci]).join(" \u00B7 ")), items: rows };
      },
      lock: function () {
        locked = true;
        pre.querySelectorAll(".logline").forEach((sp, i) => {
          sp.classList.remove("clickable", "sel");
          if (ex.correct.includes(i)) sp.classList.add("ok"); else if (selected.has(i)) sp.classList.add("bad");
        });
      }
    };
  },
  /* ---- branching decisions ---- */
  branch: function (ex, area) {
    const chosen = {};
    let step = 0, locked = false;
    const holder = document.createElement("div");
    function drawStep() {
      holder.innerHTML = "";
      const st = ex.steps[step];
      const hd = document.createElement("div"); hd.className = "stephdr"; hd.textContent = "STEP " + (step + 1) + " OF " + ex.steps.length;
      const pr = document.createElement("div"); pr.className = "stepprompt"; pr.textContent = st.prompt;
      const box = document.createElement("div"); box.className = "opts";
      st.options.forEach((o, i) => {
        const b = document.createElement("button"); b.className = "opt"; b.type = "button"; b.setAttribute("data-id", o.id);
        b.innerHTML = '<span class="tag">' + letter(i) + ".</span><span>" + esc(o.text) + "</span>";
        b.addEventListener("click", () => { if (locked) return; box.querySelectorAll(".opt").forEach((x) => x.classList.remove("sel")); b.classList.add("sel"); });
        box.appendChild(b);
      });
      const nav = document.createElement("div"); nav.className = "actions";
      const nb = document.createElement("button"); nb.className = "btn amber"; nb.type = "button";
      nb.textContent = step === ex.steps.length - 1 ? "Confirm final decision" : "Confirm and continue";
      nb.disabled = true;
      box.addEventListener("click", () => { nb.disabled = !box.querySelector(".opt.sel"); });
      nb.addEventListener("click", () => {
        if (locked) return;
        const sel = box.querySelector(".opt.sel"); if (!sel) return;
        chosen[step] = sel.getAttribute("data-id");
        if (step < ex.steps.length - 1) { step++; drawStep(); }
        else { locked = true; nb.disabled = true; const cb = $("#b-check"); if (cb) { cb.disabled = false; cb.focus(); } }
      });
      nav.appendChild(nb);
      holder.appendChild(hd); holder.appendChild(pr); holder.appendChild(box); holder.appendChild(nav);
      smoothScroll(holder);
    }
    drawStep(); area.appendChild(holder);
    const note = document.createElement("p"); note.className = "subq mt8"; note.textContent = "Each decision locks in as you confirm it. The grader scores the whole path when you press Check at the final step.";
    area.appendChild(note);
    return {
      collect: function () {
        const N = ex.steps.length; let H = 0, W = 0; const rows = [];
        ex.steps.forEach((st, i) => {
          const my = chosen[i];
          const corrText = st.options.find((o) => o.id === st.correct).text;
          if (my === st.correct) { H++; rows.push({ text: "Step " + (i + 1) + ": " + esc(corrText), status: "correct" }); }
          else if (my) { W++; rows.push({ text: "Step " + (i + 1) + ": " + esc(st.options.find((o) => o.id === my).text) + " (best: " + esc(corrText) + ")", status: "wrong" }); }
          else { rows.push({ text: "Step " + (i + 1) + " \u2014 best: " + esc(corrText), status: "missed" }); }
        });
        return { N, H, W, answerDisplay: esc(ex.steps.map((st, i) => "Step " + (i + 1) + ": " + st.options.find((o) => o.id === st.correct).text).join(" \u00B7 ")), items: rows };
      },
      lock: function () { locked = true; }
    };
  },
  /* ---- terminal ---- */
  term: function (ex, area) {
    const T = ex.term;
    let lastCmd = "";
    const holder = document.createElement("div");
    if (T.syntaxPanel) {
      const sp = document.createElement("div"); sp.className = "synpanel";
      let h = "<b>Syntax reminder</b><br><span class='sh'>" + esc(T.syntaxPanel.shape) + "</span>";
      if (T.syntaxPanel.options && T.syntaxPanel.options.length) h += "<table>" + T.syntaxPanel.options.map((o) => "<tr><td>" + esc(o[0]) + "</td><td>" + esc(o[1]) + "</td></tr>").join("") + "</table>";
      if (T.syntaxPanel.example) h += "<div>Example on a different target: <span class='sh'>" + esc(T.syntaxPanel.example) + "</span></div>";
      sp.innerHTML = h; holder.appendChild(sp);
    }
    const term = document.createElement("div"); term.className = "term";
    const bar = document.createElement("div"); bar.className = "termbar";
    bar.innerHTML = '<span class="dot" aria-hidden="true"></span><span>' + esc(T.title || "simulated shell \u2014 nothing is really executed") + "</span>" +
      (T.perSeconds ? ' <span class="ptimer" id="ptimer">\u23F1 ' + T.perSeconds + 's left in this task window</span>' : "");
    const out = document.createElement("div"); out.className = "termout"; out.setAttribute("aria-live", "polite");
    if (T.banner) { const bl = document.createElement("div"); bl.textContent = T.banner; out.appendChild(bl); }
    const inRow = document.createElement("div"); inRow.className = "termin";
    const p = document.createElement("span"); p.className = "p"; p.textContent = T.prompt + " ";
    const inp = document.createElement("input"); inp.autocomplete = "off"; inp.spellcheck = false; inp.setAttribute("aria-label", "Command input");
    inRow.appendChild(p); inRow.appendChild(inp);
    term.appendChild(bar); term.appendChild(out); term.appendChild(inRow);
    holder.appendChild(term);
    area.appendChild(holder);
    const note = document.createElement("p"); note.className = "subq mt8"; note.textContent = "Type the command and press Enter to run it in the simulation, then press Check answer to grade it. Nothing is really executed.";
    area.appendChild(note);
    const norm = (c) => String(c || "").trim().replace(/\s+/g, " ").toLowerCase();
    const stripQ = (s) => String(s || "").replace(/["']/g, "");
    inp.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const cmd = inp.value; if (!cmd.trim()) return;
      lastCmd = cmd;
      const line = document.createElement("div"); line.innerHTML = '<span class="termcmd">' + esc(T.prompt + " " + cmd) + "</span>"; out.appendChild(line);
      const n = norm(stripQ(cmd));
      const canon = norm(stripQ(T.expected.command));
      if (n === canon) {
        (T.successOutput || ["OK \u2014 command accepted (simulated)."]).forEach((l) => { const d = document.createElement("div"); d.textContent = l; out.appendChild(d); });
      } else {
        let dangerous = false;
        (T.expected.dangerous || []).forEach((dg) => { if (dg.tokens.every((t) => n.includes(norm(t)))) dangerous = true; });
        const d = document.createElement("div"); d.className = dangerous ? "termwarn" : "termerr";
        d.textContent = dangerous ? "!! DANGEROUS \u2014 in a real environment this command would change or destroy state. Think again." : (T.wrongOutput || "command not recognized in this simulation \u2014 check the tool, the options and the target.");
        out.appendChild(d);
      }
      inp.value = "";
      out.scrollTop = out.scrollHeight;
    });
    function grade(cmd) {
      const tokens = norm(stripQ(cmd)).split(" ").filter(Boolean);
      const canonTokens = norm(stripQ(T.expected.command)).split(" ").filter(Boolean);
      const covered = new Set(); let H = 0, W = 0; const rows = [];
      const allow = (T.expected.allowTokens || []).map(norm);
      T.expected.elements.forEach((el) => {
        let hit = null;
        for (const variant of el.anyOf) {
          const vt = variant.map(norm);
          if (!vt.length) continue; /* an empty variant must never auto-match */
          if (vt.every((t) => tokens.includes(t))) { hit = vt; break; }
        }
        if (hit) { H++; hit.forEach((t) => covered.add(t)); rows.push({ text: esc(el.label), status: "correct" }); }
        else { rows.push({ text: esc(el.label) + " \u2014 " + esc(el.help || "missing from your command"), status: "missed" }); }
      });
      tokens.forEach((t) => {
        /* tokens that belong to the canonical command are never "wrong extras" */
        if (covered.has(t) || allow.includes(t) || t === "|" || canonTokens.includes(t)) return;
        const inAnyVariant = T.expected.elements.some((el) => el.anyOf.some((v) => v.map(norm).includes(t)));
        if (!inAnyVariant) { W++; rows.push({ text: 'Extra or wrong element in your command: "' + esc(t) + '"', status: "wrong" }); }
      });
      let nearMiss = false;
      (T.expected.dangerous || []).forEach((dg) => {
        if (dg.tokens.every((t) => tokens.includes(norm(t)))) { nearMiss = true; rows.push({ text: esc(dg.note), status: "wrong" }); }
      });
      return { N: T.expected.elements.length, H, W: Math.min(W, T.expected.elements.length), rows, nearMiss };
    }
    return {
      collect: function () {
        const g = grade(lastCmd);
        return { N: g.N, H: g.H, W: g.W, items: g.rows, nearMiss: g.nearMiss,
          answerDisplay: '<div class="canon"><code>' + esc(T.expected.command) + '</code><button class="copybtn" type="button">Copy</button></div>',
          canonText: T.expected.command };
      },
      lock: function () { inp.disabled = true; }
    };
  }
};

/* rank shares the ordering renderer (different wording inside) */
RENDERERS.rank = RENDERERS.order;

/* ---------------- boot ---------------- */
renderIntro();
$("#b-resume").addEventListener("click", doResume);
/* QA handle (used by automated checks; harmless in production) */
window.__CYBERPULSE_DEBUG__ = { S: S, D: D, startExam: startExam, renderExercise: renderExercise, doCheck: doCheck, doHint: doHint, doSkip: doSkip, showReview: showReview, setState: setState, exById: exById };
if (REDUCED) { document.documentElement.setAttribute("data-reduced-motion", "on"); }
