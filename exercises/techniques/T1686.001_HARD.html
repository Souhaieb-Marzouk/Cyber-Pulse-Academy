var META=JSON.parse(document.getElementById('cm-exercise-meta').textContent);var INTRO={"learn":["This exam is about <b>T1686.001 — Cloud Firewall<\/b>, a <b>sub-technique<\/b> of T1686 — Disable or Modify System Firewall, in the tactic <b>Defense Impairment<\/b> (TA0112), on the <b>IaaS<\/b> platform. At this level you work the way a SOC analyst works in the middle of an intrusion.","You will correlate <b>multi-step evidence<\/b>: a compromised credential, a control-plane call that adds an ingress rule, atypical ports, 0.0.0.0/0 or single-address /32 sources, and the attacker’s aim of moving from the cloud control plane to the data plane. You will weigh <b>why an attacker picks a narrow /32 rule instead of the loud 0.0.0.0/0<\/b>, and how choices change what your analytics see.","You will use the <b>real procedure examples<\/b> from the ATT&CK page: Pacu (S1091) can allowlist IP addresses in AWS GuardDuty — impairing a detection service’s trust list — and Pacu’s neighbour capability of stopping CloudTrail maps to T1685.002. You will separate what each neighbour sub-technique covers (T1686.002 Network Device Firewall, T1686.003 Windows Host Firewall).","On the <b>defender side<\/b> you will apply the detection strategy DET0424 with its analytic AN1188 (creation, deletion, or modification of security groups and firewall rules beyond the expected baseline, correlated with privileged role or API key activity), design least-privilege controls under M1018, and map the ATT&CK mitigations M1047 — Audit and M1018 — User Account Management to real hardening work."],"keywords":["T1686.001 Cloud Firewall","AuthorizeSecurityGroupIngress","0.0.0.0/0 vs /32","Atypical ports","AN1188 baseline logic","API key correlation","Pacu (S1091)","GuardDuty CreateIPSet allowlisting","T1685.002 Disable or Modify Cloud Log","T1098.001 Additional Cloud Credentials","T1651 Cloud Administration Command","M1047 Audit","M1018 User Account Management","Control plane → data plane","Baseline diffing"],"how":["<b>Goal.<\/b> You need <b>70%<\/b> to pass. The exam has 15 exercises; the final score is a percent.","<b>Exercise types.<\/b> Single-choice, multi-select, drag-and-drop (matching and ordering), and two simulated terminal exercises: one attacker-perspective range task and one defender log-hunt. Multi-select and drag-and-drop give <b>partial credit<\/b>; terminal exercises are scored per element, so a partly correct command earns part of the credit.","<b>Timer.<\/b> The timer budget is 35 minutes. <b>Check<\/b> auto-pauses the countdown while feedback is on screen (“⏳ Feedback pause”) and <b>Next<\/b> restarts it. <b>⏸ Pause<\/b> is your own freeze button; <b>Resume<\/b> returns you exactly where you were — even in the middle of feedback.","<b>Hints and scoring.<\/b> Hints are short and directional at this level. Each opened hint costs 25% of the exercise’s credit; the penalty is applied after partial credit is computed, and the exercise’s credit never drops below zero.","<b>Skip rules.<\/b> <b>Skip<\/b> moves on without answering and without feedback. A review screen before the results lists every skipped exercise; answer it there or leave it out. Exercises you never answer are excluded from both score and total."]};
var EX=[{"id":"h01","type":"single","persp":"defender","concept":"Attribution","scenario":"Northwind Logistics, day 1, 02:14 UTC: the CI role <code>deploy-nw-prod<\/code> — dormant for 90 days except for deployments — fetches temporary credentials and calls <code>AuthorizeSecurityGroupIngress<\/code> on group <code>sg-0db01<\/code>, adding “tcp/22 from 0.0.0.0/0”. There is no pipeline run at that time, no change ticket, and the call arrives from an ASN the role has never used. Egress flows to 203.0.113[.]7 begin twelve minutes later.","question":"What is the best-supported reading of the security group change itself?","options":[["T1686.001 — Cloud Firewall, performed with the compromised CI role",true],["A routine deployment, because the role that made the change is a deployment role",false],["T1686.003 — Windows Host Firewall, because port 22 suggests a host firewall change",false],["T1685.002 — Disable or Modify Cloud Log, because the role was dormant",false]],"explanation":"<b>A is correct:<\/b> the touched object is a cloud security group, the change expands ingress beyond any baseline, and every correlator AN1188 names is present — privileged role activity, unusual source, no change record. <b>B is wrong:<\/b> the role’s name proves nothing; dormancy, missing pipeline, new ASN, and the missing ticket all contradict routine deployment. <b>C is wrong:<\/b> the change was made in the cloud control plane to a security group, not to a Windows host firewall — the port number does not move the event between sub-techniques. <b>D is wrong:<\/b> nothing happened to logging; dormancy is about the role, not about CloudTrail.","hints":["Follow the object, not the port: what did the API call actually modify?","Count the correlators: role, source, ticket, pipeline. How many contradict “routine”?"]},{"id":"h02","type":"multi","persp":"defender","concept":"Correlation","scenario":"You must justify the T1686.001 call in the incident ticket for the Northwind case and list the corroborating evidence.","question":"Select every item that genuinely corroborates T1686.001 attacker activity. (Pick all that apply.)","options":[["The control-plane log shows the ingress rule expanding access beyond the recorded baseline",true],["The request session belongs to the compromised role and an unfamiliar ASN, minutes after a new access key was created",true],["No change ticket, deployment record, or IaC plan explains the rule",true],["The security group’s name contains the word “prod”",false],["CloudTrail was still delivering logs afterwards",false]],"explanation":"<b>A, B and C are correct:<\/b> they are exactly the three legs of the analytic AN1188 — rule change beyond baseline, correlation with privileged role or API key activity, and the absence of any legitimate explanation. <b>D is wrong:<\/b> a group name proves nothing; attackers change rules on groups that happen to hold the assets they want, and “prod” appears in every legitimate group too. <b>E is wrong:<\/b> logs continuing to flow is good news for detection but is not evidence of the attacker’s firewall action — it neither supports nor weakens the technique call; the rule change itself is the evidence.","hints":["Two options describe context that exists in every account, attacker or not.","The analytic watches: rule expansion + who did it + does any legitimate record explain it."]},{"id":"h03","type":"terminal","persp":"attacker","concept":"Attacker skills","scenario":"Red-team range, Northwind emulation: you hold the role <code>deploy-nw-range<\/code> in the training account. Range task: open RDP on group <code>sg-0f3a1c9d<\/code> for your single address 203.0.113[.]7 only — not the whole internet.","question":"In the simulated shell, type the AWS CLI command that adds that ingress rule.","shell":{"banner":"RED-TEAM RANGE — simulated AWS account for training only · commands are graded, never executed","goal":"Add an ingress rule: tcp/3389 from 203.0.113[.]7/32 to sg-0f3a1c9d.","syntax":"aws ec2 authorize-security-group-ingress --group-id &lt;id&gt; --protocol &lt;p&gt; --port &lt;n&gt; --cidr &lt;range&gt;","expected":"{\n  \"Return\": true,\n  \"SecurityGroupRules\": [\n    { \"GroupId\": \"sg-0f3a1c9d\", \"IpProtocol\": \"tcp\", \"FromPort\": 3389, \"ToPort\": 3389,\n      \"CidrIpv4\": \"203.0.113[.]7/32\", \"IsEgress\": false }\n  ]\n}","prompt":"operator@nw-range","path":"~/range","placeholder":"aws ec2 authorize-security-group-ingress …"},"checks":[{"re":"^aws\\s+ec2\\s+authorize-security-group-ingress\\b","label":"uses authorize-security-group-ingress (the rule-adding call)"},{"re":"--group-id\\s*=?\\s*sg-0f3a1c9d\\b","label":"targets group sg-0f3a1c9d"},{"re":"--protocol\\s*=?\\s*tcp\\b","label":"sets the protocol to tcp"},{"re":"--port\\s*=?\\s*3389\\b","label":"opens RDP port 3389"},{"re":"--cidr\\s*=?\\s*203\\.0\\.113\\.7(\\/32)?\\b","label":"scopes the source to 203.0.113[.]7 (a single /32 address)"}],"nearMiss":[{"re":"--port\\s*=?\\s*3388\\b","msg":"Port 3388 is not RDP; RDP listens on 3389, so the rule would open the wrong door."},{"re":"--cidr\\s*=?\\s*0\\.0\\.0\\.0\\/0","msg":"0.0.0.0/0 opens the port to the entire internet; the range task demands the single address /32."},{"re":"revoke-security-group-ingress","msg":"Revoke removes rules; the task is to add one."}],"destructive":null,"canonical":"aws ec2 authorize-security-group-ingress --group-id sg-0f3a1c9d --protocol tcp --port 3389 --cidr 203.0.113[.]7/32","explanation":"The attacker’s call is <code>authorize-security-group-ingress<\/code> (check 1) aimed at <code>sg-0f3a1c9d<\/code> (check 2) with protocol <code>tcp<\/code> (check 3), port <code>3389<\/code> (check 4), and source <code>203.0.113[.]7/32<\/code> (check 5) — one address, not the world. Each element is scored separately, so a command with the right group but the wrong port still earns partial credit. The near misses matter in real detections: port 3388 would open nothing useful for RDP, 0.0.0.0/0 would trip broad-exposure alerts instantly, and <code>revoke-…<\/code> is the opposite operation. This is why narrow /32 rules are quieter than /0 — and why baseline diffing, not just /0 alerts, is needed.","hints":["The command skeleton above the prompt contains every flag you need.","Two values come straight from the goal line: the group id and your single address with /32."]},{"id":"h04","type":"multi","persp":"attacker","concept":"Evasion reasoning","scenario":"Compare two ways the Northwind attacker could have opened tcp/3389: (1) from 0.0.0.0/0, (2) from their single address 203.0.113[.]7/32. They chose (2).","question":"Select every accurate reason an attacker prefers the narrow /32 rule. (Pick all that apply.)","options":[["Only the attacker’s own address can use the door, so fewer outsiders can find and abuse it",true],["It looks closer to a legitimate admin change that pins one management address",true],["It can slip past detections that only alert on 0.0.0.0/0-style open rules",true],["The instance becomes unreachable from the internet",false],["It removes the need for the attacker to have IAM permissions",false]],"explanation":"<b>A, B and C are correct.<\/b> A narrow /32 admits only the attacker’s own address (A), so scanners and opportunistic actors never see the open port. A single pinned management address is a common, legitimate rule shape (B), so the change blends into normal configurations. And analytics that key on the 0.0.0.0/0 signature — a common cheap rule — miss it entirely (C), which is exactly why AN1188 words the detection as expansion <b>beyond baseline<\/b> and “atypical ports”, not just “0.0.0.0/0 seen”. <b>D is wrong:<\/b> the rule makes the instance reachable — at least from one address. <b>E is wrong:<\/b> no rule shape removes the permission requirement; the attacker still needed the compromised role to make the call.","hints":["Two options are about looking normal; one is about defeating a specific alert pattern.","Ask what each option does to who can connect — and to what the detectors see."]},{"id":"h05","type":"dnd","mode":"match","persp":"defender","concept":"Correlation","scenario":"Northwind case file, four logged actions, one night: (a) GuardDuty trusted-IP set updated with 203.0.113[.]7 (Pacu-style), (b) <code>cloudtrail stop-logging<\/code> on the main trail, (c) a new access key created for the CI role, (d) an SSM Run Command sent to a production instance.","question":"Drag each logged action onto the ATT&CK element it maps to.","bank":["GuardDuty trusted-IP update with 203.0.113[.]7","cloudtrail stop-logging on the main trail","New access key created for the CI role","SSM Run Command sent to a production instance"],"zones":[{"label":"T1686.001 — Cloud Firewall (procedure: Pacu S1091)","accepts":[0]},{"label":"T1685.002 — Disable or Modify Cloud Log","accepts":[1]},{"label":"T1098.001 — Additional Cloud Credentials","accepts":[2]},{"label":"T1651 — Cloud Administration Command","accepts":[3]}],"explanation":"<b>GuardDuty trusted-IP update<\/b> is the ATT&CK-listed procedure for T1686.001: Pacu (S1091) can allowlist IP addresses in AWS GuardDuty, impairing a cloud detection service’s trust list. <b>cloudtrail stop-logging<\/b> tampers with cloud logging — T1685.002 — Disable or Modify Cloud Log. <b>A new access key for an existing role<\/b> is T1098.001 — Additional Cloud Credentials (account manipulation for persistence/access). <b>SSM Run Command on an instance<\/b> is T1651 — Cloud Administration Command (running commands through a management service). The mapping matters operationally: the four events are one intrusion wearing four sub-techniques, and only the first is this exam’s technique — treating them all as “T1686.001” would corrupt your coverage metrics.","hints":["One zone explicitly names the Pacu procedure — match it to the GuardDuty trust list.","Ask for each action: what object did it touch — detection trust list, logging config, credentials, or an instance shell?"]},{"id":"h06","type":"single","persp":"defender","concept":"Detection","scenario":"You are reviewing whether your new Splunk-style rule is faithful to the ATT&CK detection strategy for this sub-technique (DET0424 / analytic AN1188).","question":"Which statement matches the intent of analytic AN1188?","options":[["Alert on creation, deletion, or modification of security groups and firewall rules in control-plane logs that expand access beyond the expected baseline, correlated with privileged role or API key activity",true],["Alert only when an ingress rule allows 0.0.0.0/0, because narrower rules are always safe",false],["Alert on every read-only DescribeSecurityGroups call, because visibility is king",false],["Alert only when the change is made outside business hours",false]],"explanation":"<b>A is correct:<\/b> AN1188 is a baseline-diff analytic over control-plane logs: it watches creation, deletion, and modification of groups and rules, evaluates whether access expanded beyond what is expected, and correlates the actor side (privileged roles, API keys). <b>B is wrong:<\/b> the Northwind case itself shows why — a /32 from the attacker’s address never matches a 0.0.0.0/0-only rule; narrow sources and atypical ports are explicitly in the defender view. <b>C is wrong:<\/b> Describe calls are read-only and enormously noisy; the analytic targets state-changing calls. <b>D is wrong:<\/b> time-of-day is a weak, gameable signal; the analytic keys on access expansion and actor correlation, not clock time.","hints":["The analytic has three ideas: which calls, compared to what, correlated with whom.","One option confuses the API’s read calls with its write calls."]},{"id":"h07","type":"terminal","persp":"defender","concept":"Defender skills","scenario":"Northwind IR, hour 2: you must pull every recorded <code>AuthorizeSecurityGroupIngress<\/code> event from CloudTrail for the last week to scope the intrusion.","question":"In the simulated shell, type the AWS CLI command that looks up CloudTrail management events by the event name AuthorizeSecurityGroupIngress.","shell":{"banner":"CYBERPULSE IR LAB — read-only CloudTrail lookup · region us-east-1 (simulated)","goal":"Look up CloudTrail events whose EventName is AuthorizeSecurityGroupIngress.","syntax":"aws cloudtrail lookup-events --lookup-attributes AttributeKey=&lt;key&gt;,AttributeValue=&lt;value&gt;","expected":"{\n  \"Events\": [\n    { \"EventName\": \"AuthorizeSecurityGroupIngress\",\n      \"Username\": \"deploy-nw-prod\",\n      \"CloudTrailEvent\": \"{ ... \\\"sourceIPAddress\\\": \\\"198.51.100[.]9\\\", \\\"requestParameters\\\": { \\\"cidrIp\\\": \\\"0.0.0.0/0\\\" } ... }\" }\n  ]\n}","prompt":"analyst@nw-ir","path":"~/ir","placeholder":"aws cloudtrail lookup-events …"},"checks":[{"re":"^aws\\s+cloudtrail\\s+lookup-events\\b","label":"uses cloudtrail lookup-events"},{"re":"--lookup-attributes\\b","label":"passes the --lookup-attributes flag"},{"re":"AttributeKey\\s*=\\s*EventName","label":"filters on AttributeKey=EventName"},{"re":"AttributeValue\\s*=\\s*AuthorizeSecurityGroupIngress","label":"looks for AttributeValue=AuthorizeSecurityGroupIngress"}],"nearMiss":[{"re":"LookupAttributes","msg":"LookupAttributes with capital letters is the JSON field inside the response; on the command line the flag is --lookup-attributes."},{"re":"describe-trails|get-trail-status","msg":"Those commands describe the trail configuration; they do not search past events by name."}],"destructive":null,"canonical":"aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=AuthorizeSecurityGroupIngress","explanation":"<code>lookup-events<\/code> is the search API over recorded management events (check 1); its attribute filter (check 2) is written as a key/value pair <code>AttributeKey=EventName,AttributeValue=AuthorizeSecurityGroupIngress<\/code> (checks 3 and 4), which returns exactly the rule-adding calls — with actor, source address, and full request parameters for your scoping table. The capitalised <code>LookupAttributes<\/code> form is a classic near miss: it is the response’s JSON field, not a CLI flag, and describe-trails style commands only describe configuration, never past events. Scoping with this one query answers “how many groups did the attacker touch?” before you write a single detection rule.","hints":["The flag name is written in kebab-case with a leading double dash.","Key and value use equal signs: AttributeKey=…,AttributeValue=…"]},{"id":"h08","type":"multi","persp":"attacker","concept":"Procedures","scenario":"In the Northwind intrusion the attacker ran a Pacu-style GuardDuty allowlist <b>and<\/b> opened the security group. You are writing the “why both?” paragraph.","question":"Select every accurate statement about that pairing. (Pick all that apply.)","options":[["The GuardDuty allowlist uses IP-set APIs (CreateIPSet/UpdateIPSet) to add trusted addresses",true],["After allowlisting, GuardDuty suppresses findings for traffic from the listed addresses",true],["The allowlist call itself still appears in CloudTrail, so it is detectable",true],["The allowlist makes GuardDuty stop working for the whole account",false],["The allowlist is required before any security group can be modified",false]],"explanation":"<b>A, B and C are correct.<\/b> GuardDuty trust lists are managed through IP-set APIs (A), and the effect of listing an address is that findings about traffic from it are suppressed — that is precisely why ATT&CK files the procedure under a Defense Impairment sub-technique (B). The API calls are control-plane calls like everything else, so they leave CloudTrail evidence — a defender’s silver lining (C). <b>D is wrong:<\/b> the allowlist is scoped to the listed addresses; GuardDuty keeps analysing everything else, so the attacker trades a blinding of “their” findings for the risk of the allowlist call being seen. <b>E is wrong:<\/b> the two actions are independent; modifying a security group needs only IAM permission, never a GuardDuty change first.","hints":["One option claims a service-wide kill switch — check the scope of a trust list.","Remember what every control-plane API call leaves behind for defenders."]},{"id":"h09","type":"single","persp":"defender","concept":"Related objects","scenario":"Two alerts, one night at Northwind: (1) EC2 Windows instance’s firewall profile set to off via the guest OS; (2) VPC security group gains an ingress rule. Both were done by the same stolen key — one with SSM, one with the EC2 API.","question":"How do these two actions map to ATT&CK sub-techniques?","options":[["(1) is T1686.003 — Windows Host Firewall; (2) is T1686.001 — Cloud Firewall",true],["Both are T1686.001, because the same actor did them",false],["(1) is T1686.001; (2) is T1686.002 — Network Device Firewall",false],["Both are T1685.002 — Disable or Modify Cloud Log",false]],"explanation":"<b>A is correct:<\/b> the sub-technique follows the <b>object<\/b>, not the actor or the tool: the guest-OS firewall on a Windows instance is T1686.003, while the VPC security group change through the EC2 API is T1686.001. <b>B is wrong:<\/b> attribution to one actor does not collapse two different objects into one technique; reporting them as one would understate coverage. <b>C is wrong:<\/b> it swaps the two — no cloud security group was touched in (1), and no router was touched in (2). <b>D is wrong:<\/b> neither action touched logging at all.","hints":["Ask “which firewall object changed?” — a Windows host firewall, or a cloud security group?","The actor being the same never changes the object that was modified."]},{"id":"h10","type":"dnd","mode":"order","persp":"defender","concept":"Defender workflow","scenario":"The Northwind rule change is confirmed malicious and the stolen key is still active. You are ordering the response actions.","question":"Drag the four response actions into the correct order (first action on top).","bank":["Disable the compromised access key and role session","Revoke the unauthorized ingress rule","Diff every security group against the approved baseline for remaining changes","Close the permission gap that let the CI role modify firewalls"],"zones":[{"label":"Action 1"},{"label":"Action 2"},{"label":"Action 3"},{"label":"Action 4"}],"explanation":"Correct order: <b>(1) Disable the key<\/b> — while the credential is live the attacker can re-open any rule you close; containment of the actor precedes containment of the artifact. <b>(2) Revoke the rule<\/b> — with the actor contained, removing the open door stops the bleed without the attacker simply re-adding it. <b>(3) Baseline diff<\/b> — the rule you know about is rarely the only one; diffing all groups against the approved baseline finds sibling changes made under the same key. <b>(4) Close the permission gap<\/b> — the durable fix (least privilege per M1018, routine audits per M1047) comes after the fire is out; doing it first leaves the attacker active while you edit policies.","hints":["Whatever order you pick, ask: “can the attacker undo this step in the next 30 seconds?”","Policy changes survive an incident; they are not a first response to a live key."]},{"id":"h11","type":"single","persp":"defender","concept":"Detection","scenario":"Your team debates what “beyond expected baselines” means in the AN1188 wording for Northwind’s account.","question":"Which implementation best expresses baseline comparison for security group rules?","options":[["Keep an approved rule inventory (from IaC state and review) and alert when live rules differ from it — added, removed, or widened",true],["Keep a list of banned ports and alert when they appear in any rule",false],["Store yesterday’s rules and alert on any change, everywhere",false],["Trust that rules created by the terraform-ci role are always the baseline",false]],"explanation":"<b>A is correct:<\/b> a baseline is an <b>expected state<\/b> — the approved inventory of rules per group — and detection is the diff between live state and that inventory, in every direction (added, removed, narrowed, widened). That is what “beyond expected baselines” operationalises. <b>B is wrong:<\/b> a port blocklist is a narrow signature; it misses new groups, /32 rules on ordinary ports, and egress changes. <b>C is wrong:<\/b> diffing against yesterday flags every legitimate IaC deployment as an alert — noise, not a baseline; the baseline is the <b>approved<\/b> state, not the previous state. <b>D is wrong:<\/b> a compromised CI role is precisely the Northwind scenario — the role’s stamp is not proof of legitimacy; the approved plan is.","hints":["Two options produce either too many or too few alerts — think which.","The baseline must represent approval, not recency."]},{"id":"h12","type":"multi","persp":"defender","concept":"Mitigation","scenario":"Post-incident, Northwind asks for the least-privilege redesign of firewall-change rights (mitigation M1018 in practice).","question":"Select every design choice that genuinely reduces T1686.001 risk. (Pick all that apply.)","options":[["Remove ec2:AuthorizeSecurityGroupIngress / RevokeSecurityGroupIngress from CI roles; they deploy via IaC pipelines, not by hand",true],["Use permission boundaries or SCPs so only the network-admin role can mutate firewall rules",true],["Require a reviewed change record for out-of-band firewall changes and reconcile it against CloudTrail",true],["Grant the build server’s role AdministratorAccess so it can also fix firewalls during deploys",false],["Delete CloudTrail to stop attackers learning your rule patterns",false]],"explanation":"<b>A, B and C are correct.<\/b> A removes the mutating actions from identities that never need them (least privilege); B enforces the same boundary centrally, so even a role escalation cannot cross it; C creates the auditable paper trail that turns AN1188’s “no legitimate record” leg into a hard signal. Together with M1047’s routine permission review, these are the ATT&CK-listed mitigation directions for this sub-technique. <b>D is wrong:<\/b> AdministratorAccess is the opposite of least privilege — it makes every compromised pipeline a one-step T1686.001. <b>E is wrong:<\/b> deleting CloudTrail removes your only control-plane visibility and maps to the attacker’s own T1685.002 play — never a mitigation.","hints":["Three options shrink or police the permission; two grow it or destroy visibility.","One option is literally the attacker’s own log-tampering play — it cannot be a mitigation."]},{"id":"h13","type":"single","persp":"defender","concept":"Detection","scenario":"Northwind’s detection engineering review finds an old rule: “alert if RDP (3389) is opened to 0.0.0.0/0”. The attacker used 3390 — an atypical port — from a /32 and was not alerted.","question":"What is the strongest improvement to that detection?","options":[["Baseline-diff rule changes and flag access expansion regardless of port, with atypical ports as an added signal",true],["Add more well-known ports (3388, 3390, 3391) to the 0.0.0.0/0 rule",false],["Lower the alert threshold to any new ingress rule, with no context",false],["Require attackers to use 3389 by blocking all other ports at the cloud edge",false]],"explanation":"<b>A is correct:<\/b> the failure was signature-shape (specific port + specific CIDR), so the durable fix is the analytic’s actual intent — compare live rules to the approved baseline and alert on expansion, letting “atypical port” and “privileged/API key correlation” raise the score. Any port, any source width. <b>B is wrong:<\/b> port lists are whack-a-mole; the attacker picks 3392 next. <b>C is wrong:<\/b> alerting on every new rule without context buries the SOC in IaC noise — the false-positive lesson from MEDIUM-level work. <b>D is wrong:<\/b> edge-blocking all ports except 3389 would break legitimate services and still misses a /32 rule on 3389 itself from an unexpected address.","hints":["The detection failed because it waited for one exact shape — a port plus a CIDR.","Which option keeps working when the attacker changes the port next time?"]},{"id":"h14","type":"single","persp":"attacker","concept":"Behavior","scenario":"After opening tcp/3389 on sg-0db01, the Northwind attacker RDPs into the instance and starts enumerating the internal network from there.","question":"Which sentence best describes the attacker’s control-plane → data-plane step?","options":[["The rule change was made through the management API; the opened path then let traffic reach the workload — the data plane",true],["The attacker moved the instance into a different cloud account first",false],["The attacker replaced the control plane with a data-plane service",false],["RDP only works on the control plane, so no data plane was involved",false]],"explanation":"<b>A is correct:<\/b> the ATT&CK description says the firewall modification lets the adversary “move laterally from the cloud control plane to the data plane” — the change is made at the management layer, and its payoff is traffic that now reaches the actual instance and the networks behind it. <b>B is wrong:<\/b> nothing in the scenario moves the instance between accounts; the door was opened in place. <b>C is wrong:<\/b> planes are layers of the same cloud, not replaceable services. <b>D is wrong:<\/b> RDP is precisely data-plane traffic — user sessions to a workload.","hints":["One plane is where you manage; the other is where workloads talk.","The attacker used the first plane to open a road into the second."]},{"id":"h15","type":"single","persp":"defender","concept":"Mitigation","scenario":"You are finishing the Northwind report’s mitigation section and must cite the two ATT&CK mitigations listed for T1686.001.","question":"Which pair are the mitigations ATT&CK lists for this sub-technique?","options":[["M1047 — Audit and M1018 — User Account Management",true],["M1047 — Audit and M1053 — Data Loss Prevention",false],["M1018 — User Account Management and M1021 — Restrict Web-Based Content",false],["M1016 — Integrity Verification and M1018 — User Account Management",false]],"explanation":"<b>A is correct:<\/b> the sub-technique page lists exactly two mitigations — M1047 — Audit (routinely check account role permissions so only expected users and roles can modify cloud firewalls) and M1018 — User Account Management (least privilege in IAM policies). <b>B is wrong:<\/b> Data Loss Prevention addresses data movement, not firewall-change rights. <b>C is wrong:<\/b> Restrict Web-Based Content is about web filtering, unrelated to cloud firewall administration. <b>D is wrong:<\/b> Integrity Verification targets code and configuration integrity in other contexts; it is not listed for this sub-technique.","hints":["Both listed mitigations are about people, permissions, and checking.","One wrong option is about web content, one about data leaving the org — neither fits."]}];
var HINT_PEN=0.25;
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(s){s=Math.max(0,Math.floor(s));var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function norm(s){return String(s||'').replace(/\[\.\]/g,'.').replace(/\[:\]/g,':').replace(/["']/g,'')
  .replace(/\s+/g,' ').trim()}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
var LETTERS='ABCDEFGH';

/* ---------- timer state machine: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED ---------- */
var T={state:'IDLE',remaining:META.timerMinutes*60,tRun:0,tMan:0,tAuto:0,iv:null,enteredAt:0,resumeTo:'RUNNING'};
function tAccount(){
  var now=Date.now();
  if(T.state==='PAUSED_MANUAL'){T.tMan+=Math.max(0,Math.round((now-T.enteredAt)/1000))}
  else if(T.state==='PAUSED_AUTO_CHECK'){T.tAuto+=Math.max(0,Math.round((now-T.enteredAt)/1000))}
}
function timerTick(){
  if(T.state!=='RUNNING')return;
  T.remaining--;T.tRun++;renderTimer();
  if(T.remaining<=0){forceFinish()}
}
function tEnter(st){
  tAccount();T.state=st;T.enteredAt=Date.now();
  if(st==='RUNNING'){if(!T.iv)T.iv=setInterval(timerTick,1000)}
  else if(T.iv){clearInterval(T.iv);T.iv=null}
  renderTimer();
}
function tStart(){T.state='RUNNING';T.enteredAt=Date.now();if(!T.iv)T.iv=setInterval(timerTick,1000);renderTimer()}
function tPauseManual(){if(T.state==='ENDED'||T.state==='PAUSED_MANUAL')return;
  T.resumeTo=(T.state==='PAUSED_AUTO_CHECK')?'PAUSED_AUTO_CHECK':'RUNNING';
  tEnter('PAUSED_MANUAL');$('pause-ov').classList.add('show');document.body.classList.add('blurred')}
function tResumeManual(){if(T.state!=='PAUSED_MANUAL')return;
  tEnter(T.resumeTo||'RUNNING');$('pause-ov').classList.remove('show');document.body.classList.remove('blurred')}
function tAutoPause(){if(T.state==='RUNNING'){tEnter('PAUSED_AUTO_CHECK')}}
function tAutoResume(){if(T.state==='PAUSED_AUTO_CHECK'){tEnter('RUNNING')}}
function tEnd(){tAccount();if(T.iv){clearInterval(T.iv);T.iv=null}T.state='ENDED';renderTimer()}
function renderTimer(){var c=$('timerchip');if(!c)return;var cls='chip timer-run',txt='';
  if(T.state==='RUNNING'){cls='chip timer-run';txt='▶ Running · '+fmt(T.remaining)}
  else if(T.state==='PAUSED_MANUAL'){cls='chip timer-man';txt='⏸ Paused'}
  else if(T.state==='PAUSED_AUTO_CHECK'){cls='chip timer-auto';txt='⏳ Feedback pause'}
  else if(T.state==='ENDED'){cls='chip timer-end';txt='⏱ Ended'}
  c.className=cls;c.textContent=txt;
  c.title=T.state==='PAUSED_MANUAL'?'Paused by you: the countdown is frozen. Resume continues the exam.'

    :(T.state==='ENDED'?'The exam has ended.':'Countdown is running.'))}

/* ---------- grading ---------- */
function gradeCurrent(){
  var e=cur();
  if(e.type==='single'||e.type==='multi'){
    if(!S.sel.length)return null;
    var N=0,H=0,W=0,items=[];
    e.options.forEach(function(o){if(o[1])N++});
    e.options.forEach(function(o,i){
      var picked=(S.sel.indexOf(i)>=0);
      if(o[1]&&picked){H++;items.push([i,'ok','✓ Correct'])}
      else if(o[1]&&!picked){items.push([i,'miss','○ Missed'])}
      else if(!o[1]&&picked){W++;items.push([i,'bad','✗ Wrong'])}
      else{items.push([i,'',''])}});
    var base=(e.type==='single')?((H===1&&W===0)?1:0):Math.max(0,(H-W)/N);
    return {base:base,items:items,N:N};
  }
  if(e.type==='dnd'){
    var N2=e.bank.length,H2=0,W2=0,items2=[],cmap=correctMap(e);
    for(var i=0;i<e.bank.length;i++){
      var z=S.dndAssign[i];
      if(z===undefined||z===null||z<0){items2.push([i,'miss','○ Missed — not placed'])}
      else if(z===cmap[i]){H2++;items2.push([i,'ok','✓ Correct'])}
      else{W2++;items2.push([i,'bad','✗ Wrong — '+(e.mode==='order'?('correct position is '+(cmap[i]+1)):('belongs to “'+e.zones[cmap[i]].label+'”'))])}
    }
    return {base:Math.max(0,(H2-W2)/N2),items:items2,N:N2};
  }
  if(e.type==='terminal'){
    var raw=($('term-in')||{}).value||'';
    var inp=norm(raw);
    if(!inp)return null;
    var items3=[],H3=0,W3=0,trap=null,nm=[];
    if(e.destructive&&e.destructive.re&&new RegExp(e.destructive.re,'i').test(inp)){
      trap=e.destructive.msg;
    }
    if(!trap&&e.nearMiss){e.nearMiss.forEach(function(m){
      if(new RegExp(m.re,'i').test(inp))nm.push(m.msg)})}
    e.checks.forEach(function(c){
      var ok=new RegExp(c.re,'i').test(inp);
      if(ok)H3++;
      items3.push([null,ok?'ok':'miss',(ok?'✓ Passed — ':'○ Not met — ')+c.label])});
    W3=nm.length;
    var N3=e.checks.length;
    return {base:trap?0:Math.max(0,(H3-W3)/N3),items:items3,N:N3,trap:trap,nm:nm,inp:inp};
  }
  return null;
}
function correctMap(e){
  var m=[];
  if(e.mode==='order'){for(var i=0;i<e.bank.length;i++)m[i]=i}
  else{for(var i2=0;i2<e.bank.length;i2++)m[i2]=-1;
    e.zones.forEach(function(z,zi){(z.accepts||[]).forEach(function(ii){m[ii]=zi})})}
  return m;
}

/* ---------- feedback ---------- */
function showFeedback(g,credit,status){
  var e=cur(),fb=$('feedback');if(!fb)return;
  var cls=status==='full'?'fb-full':(status==='partial'?'fb-partial':'fb-zero');
  var head=status==='full'?'✓ Correct':(status==='partial'?'✓ Partially correct':'✗ Incorrect');
  var h='<div class="fb-head"><span>'+head+'</span><span class="credit">Credit: '+credit.toFixed(2)+' / 1.00'
   +(S.curHints>0?(' · −'+(HINT_PEN*S.curHints).toFixed(2)+' hint penalty ('+S.curHints+' hint'+(S.curHints>1?'s':'')+' used)'):'')+'</span></div>';
  h+='<ul class="peritem">';
  if(e.type==='single'||e.type==='multi'){
    g.items.forEach(function(it){
      if(it[2])h+='<li><span class="mark-tag '+(it[1]==='ok'?'':it[1])+'" style="color:'+(it[1]==='ok'?'var(--ok)':(it[1]==='bad'?'var(--bad)':'var(--miss)'))+'">'+it[2]+'</span><span><b>'+LETTERS[it[0]]+'.</b> '+e.options[it[0]][0]+'</span></li>'});
  }else if(e.type==='dnd'){
    g.items.forEach(function(it){
      h+='<li><span class="mark-tag" style="color:'+(it[1]==='ok'?'var(--ok)':(it[1]==='bad'?'var(--bad)':'var(--miss)'))+'">'+it[2]+'</span><span>'+e.bank[it[0]]+'</span></li>'});
  }else if(e.type==='terminal'){
    if(g.trap)h+='<li><span class="mark-tag" style="color:var(--bad)">✗ Unsafe action blocked</span><span>'+g.trap+'</span></li>';
    g.nm.forEach(function(m){h+='<li><span class="mark-tag" style="color:var(--warn)">⚠ Near miss</span><span>'+m+'</span></li>'});
    g.items.forEach(function(it){h+='<li><span class="mark-tag" style="color:'+(it[1]==='ok'?'var(--ok)':'var(--miss)')+'">'+it[2]+'</span></li>'});
  }
  h+='</ul><div class="expl"><span class="why">Why</span>'+e.explanation+'</div>';
  fb.className='feedback show '+cls;fb.innerHTML=h;
  var last=(S.phase==='review')?(S.reviewP===S.reviewQ.length-1):(S.idx===EX.length-1);
  var row=document.createElement('div');row.className='actrow';
  var lbl=S.phase==='review'?(last?'Finish review →':'Next skipped →'):(last?'Final Submit →':'Next →');
  row.innerHTML='<button type="button" class="btn btn-green" data-act="next">'+lbl+'</button>';
  fb.parentNode.insertBefore(row,fb.nextSibling);
  document.querySelectorAll('[data-act="check"],[data-act="skip"],[data-act="hint"]').forEach(function(b){b.disabled=true});
  var ti=$('term-in');if(ti)ti.disabled=true;
  markOptions(e,g);
  termOut(e,g);
}
function markOptions(e,g){
  if(!g||!g.items)return;
  if(e.type==='single'||e.type==='multi'){
    g.items.forEach(function(it){var el=document.querySelector('.opt[data-i="'+it[0]+'"]');if(!el)return;
      if(it[1]==='ok')el.classList.add('state-ok');
      else if(it[1]==='bad')el.classList.add('state-bad');
      else if(it[1]==='miss')el.classList.add('state-miss');
      var tag=it[2]?('<span class="mark-tag" style="color:'+(it[1]==='ok'?'var(--ok)':(it[1]==='bad'?'var(--bad)':'var(--miss)'))+'">'+it[2]+'</span>'):'';
      el.insertAdjacentHTML('beforeend',tag)});
  }else if(e.type==='dnd'){
    document.querySelectorAll('.dnd-chip').forEach(function(c){
      var i=parseInt(c.getAttribute('data-i'),10),it=g.items[i];if(!it)return;
      if(it[1]==='ok')c.classList.add('ok');else if(it[1]==='bad')c.classList.add('bad');else if(it[1]==='miss')c.classList.add('miss')});
  }
}
function termOut(e,g){
  if(e.type!=='terminal'||!g)return;
  var out=$('term-out');if(!out)return;
  if(g.trap){out.innerHTML='<span class="out-err">✗ '+esc(g.trap)+'</span>';return}
  if(g.base>=0.999&&e.shell.expected){out.innerHTML='<span class="out-ok">'+e.shell.expected+'</span>';return}
  out.innerHTML='<span class="out-dim">Simulated shell: no output matched the expected action. Check the per-item notes below.</span>';
}

/* ---------- flow ---------- */
function startExam(){S.phase='exam';S.idx=0;prepExercise();renderExam();tStart()}
function prepExercise(){
  S.sel=[];S.dndAssign={};S.dndPick=null;S.checked=false;S.curHints=0;
  var e=cur();
  if(e.type==='dnd'){S.dndDisp=shuffle(e.bank.map(function(_,i){return i}))}
}
function renderExam(){
  var app=$('app');
  app.innerHTML=barHTML()+examHTML();
  $('counter').textContent='Exercise '+(S.idx+1)+' / '+EX.length;
  renderTimer();updateScore();
  var inp=$('term-in');
  if(inp)inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();doCheck()}});
}
function updateScore(){var c=$('scorechip');if(c)c.textContent='★ '+S.score.toFixed(2)+' pts'}
function warn(msg){var w=$('warnline');if(w){w.textContent='⚠ '+msg;w.classList.add('show');
  setTimeout(function(){w.classList.remove('show')},2200)}}
function doCheck(){
  if(S.checked)return;
  var g=gradeCurrent();if(g===null){warn('Select an answer first.');return}
  tAutoPause();
  S.checked=true;
  var credit=Math.max(0,g.base-HINT_PEN*S.curHints);
  S.score+=credit;
  var status=(credit>=0.999)?'full':(credit>0?'partial':'zero');
  var qi=(S.phase==='review')?S.reviewQ[S.reviewP]:S.idx;
  S.results[qi]={status:status,credit:credit,hints:S.curHints};
  updateScore();
  renderExamFeedbackOnly(g,credit,status);
}
function renderExamFeedbackOnly(g,credit,status){
  var fb=$('feedback');
  if(!fb){renderExam();var fb2=$('feedback');paint(g,credit,status,fb2);return}
  paint(g,credit,status,fb);
}
function paint(g,credit,status,fb){showFeedback(g,credit,status)}
function doHint(){
  if(S.checked)return;var e=cur();
  if(!e.hints||S.curHints>=e.hints.length)return;
  S.curHints++;var p=$('hint-panel');
  if(p){p.classList.add('show');p.innerHTML='ⓘ Hint '+S.curHints+' / '+e.hints.length+': '+e.hints[S.curHints-1]}
}
function doNext(){
  if(!S.checked)return;
  tAutoResume();
  if(S.phase==='review'){
    S.reviewP++;
    if(S.reviewP<S.reviewQ.length){prepExercise();renderReview()}
    else showResults();
    return;
  }
  if(S.idx<EX.length-1){S.idx++;prepExercise();renderExam()}
  else finalSubmit();
}
function doSkip(){
  if(S.checked)return;
  var qi=(S.phase==='review')?S.reviewQ[S.reviewP]:S.idx;
  S.results[qi]={status:'skipped',credit:0,hints:0};
  if(S.phase==='review'){
    if(S.skipped.indexOf(qi)<0)S.skipped.push(qi);
    S.reviewP++;
    if(S.reviewP<S.reviewQ.length){prepExercise();renderReview()}
    else showResults();
    return;
  }
  if(S.skipped.indexOf(S.idx)<0)S.skipped.push(S.idx);
  if(S.idx<EX.length-1){S.idx++;prepExercise();renderExam()}
  else finalSubmit();
}
function finalSubmit(){
  S.reviewQ=S.skipped.filter(function(i){return S.results[i]&&S.results[i].status==='skipped'});
  S.reviewP=0;
  if(S.reviewQ.length){S.phase='review';prepExercise();renderReview()}
  else showResults();
}
function renderReview(){
  var app=$('app');app.innerHTML=barHTML()+examHTML();
  $('counter').textContent='Review skipped '+(S.reviewP+1)+' / '+S.reviewQ.length;
  renderTimer();updateScore();
  var inp=$('term-in');
  if(inp)inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();doCheck()}});
}
function forceFinish(){
  if(S.phase==='exam'&&!S.checked){S.results[S.idx]={status:'skipped',credit:0,hints:0};
    if(S.skipped.indexOf(S.idx)<0)S.skipped.push(S.idx)}
  showResults();
}

/* ---------- results + reporting ---------- */
function showResults(){
  S.phase='results';tEnd();
  $('pause-ov').classList.remove('show');document.body.classList.remove('blurred');
  var answered=0,full=0,part=0,zero=0,skipN=0,partSum=0;
  for(var i=0;i<EX.length;i++){var r=S.results[i]||{status:'skipped',credit:0};
    if(r.status==='skipped'){skipN++;continue}
    answered++;
    if(r.status==='full')full++;else if(r.status==='partial'){part++;partSum+=r.credit}else zero++}
  var rounded=Math.round(S.score);
  var percent=answered>0?Math.round(rounded/answered*100):0;
  var passed=percent>=META.passMark;
  var partAvg=part>0?(partSum/part):0;
  var h='<main class="wrap"><section class="card"><h2>Results — '+esc(META.objectName)+'</h2>'
   +'<div class="res-hero"><div class="res-pct '+(passed?'pass':'fail')+'" id="final-pct">0%</div>'
   +'<div><span class="badge '+(passed?'sev-easy':'sev-xhard')+'">'+(passed?'✓ Passed':'✗ Not passed')+'</span>'
   +'<p class="muted">Pass mark: '+META.passMark+'% · Points: '+rounded+' of '+answered+' answered exercise'+(answered===1?'':'s')+' · Skipped-and-never-answered exercises are excluded.</p></div></div>'
   +'<div class="res-grid">'
   +'<div class="res-box b-full"><div class="n">'+full+'</div><div class="t">✓ Fully correct</div></div>'
   +'<div class="res-box b-part"><div class="n">'+part+'</div><div class="t">✓ Partially correct — average partial credit '+partAvg.toFixed(2)+'</div></div>'
   +'<div class="res-box b-zero"><div class="n">'+zero+'</div><div class="t">✗ Fully incorrect</div></div>'
   +'<div class="res-box b-skip"><div class="n">'+skipN+'</div><div class="t">⚠ Skipped &amp; never answered (excluded)</div></div>'
   +'</div>'
   +'<div class="res-time"><span class="chip">▶ Running: '+fmt(T.tRun)+'</span>'
   +'<span class="chip">⏸ Paused by you: '+fmt(T.tMan)+'</span>'
   +'<span class="chip">⏳ Paused for feedback: '+fmt(T.tAuto)+'</span>'
   +'<span class="chip">⏱ Total: '+fmt(T.tRun+T.tMan+T.tAuto)+'</span></div>'
   +'<div class="actrow"><button type="button" class="btn btn-primary" data-act="retake">↻ Retake</button></div>'
   +'</section></main>';
  $('app').innerHTML=h;
  var done=false;
  function settle(){if(done)return;done=true;postReport(rounded,answered,percent,passed)}
  var reduced=false;
  try{reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(err){}
  var el=$('final-pct');
  if(reduced||!el){if(el)el.textContent=percent+'%';settle();return}
  var t0=null,dur=1100;
  requestAnimationFrame(function step(ts){
    if(t0===null)t0=ts;var k=Math.min(1,(ts-t0)/dur);
    el.textContent=Math.round(percent*(1-Math.pow(1-k,3)))+'%';
    if(k<1)requestAnimationFrame(step);else settle();
  });
}
function postReport(score,total,percent,passed){
  if(S.postSent)return;S.postSent=true;
  try{(window.parent===window?window:window.parent).postMessage(
    {type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,difficulty:META.difficulty,
     score:score,total:total,percent:percent,passed:passed},
    S.hostOrigin||location.origin)}catch(e){}
}
function doRetake(){
  S.phase='intro';S.idx=0;S.score=0;S.results=[];S.skipped=[];S.reviewQ=[];S.reviewP=0;
  S.postSent=false;S.sel=[];S.dndAssign={};S.dndPick=null;S.checked=false;S.curHints=0;
  if(T.iv){clearInterval(T.iv);T.iv=null}
  T.state='IDLE';T.remaining=META.timerMinutes*60;T.tRun=0;T.tMan=0;T.tAuto=0;T.resumeTo='RUNNING';
  renderIntro();
}

/* ---------- app ---------- */
function renderIntro(){
  $('app').innerHTML='<main class="wrap">'+introHTML()+'</main>';
  window.scrollTo(0,0);
}
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act');
  if(act==='start'){startExam();window.scrollTo(0,0)}
  else if(act==='sc-toggle'){var b=document.querySelector('.sc-body');
    var open=b.classList.toggle('sc-open');el.textContent=open?'Hide scenario ▴':'Show full scenario ▾'}
  else if(act==='opt'){if(S.checked)return;var i=parseInt(el.getAttribute('data-i'),10);
    var e=cur();
    if(e.type==='single'){S.sel=[i]}
    else{var p=S.sel.indexOf(i);if(p>=0)S.sel.splice(p,1);else S.sel.push(i)}
    document.querySelectorAll('.opt').forEach(function(o){
      var oi=parseInt(o.getAttribute('data-i'),10);
      o.classList.toggle('picked',S.sel.indexOf(oi)>=0);
      o.setAttribute('aria-pressed',S.sel.indexOf(oi)>=0)})}
  else if(act==='check'){doCheck()}
  else if(act==='hint'){doHint()}
  else if(act==='pause'){tPauseManual()}
  else if(act==='resume'){tResumeManual()}
  else if(act==='skip'){doSkip()}
  else if(act==='next'){doNext()}
  else if(act==='review-leave'){doSkip()}
  else if(act==='retake'){doRetake();window.scrollTo(0,0)}
  else if(act==='dnd-pick'){
    if(S.checked)return;
    var di=parseInt(el.getAttribute('data-i'),10);
    if(S.dndAssign[di]!==undefined&&S.dndAssign[di]!==null&&S.dndAssign[di]>=0){
      S.dndAssign[di]=null;S.dndPick=null}
    else{S.dndPick=(S.dndPick===di?null:di)}
    reRenderDnd()}
  else if(act==='dnd-zone'){
    if(S.checked)return;
    var z=parseInt(el.getAttribute('data-zone')||el.closest('[data-zone]').getAttribute('data-zone'),10);
    if(S.dndPick===null){warn('Pick an item first, then click a box.')}
    else{S.dndAssign[S.dndPick]=z;S.dndPick=null;reRenderDnd()}}
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&T.state==='PAUSED_MANUAL'){tResumeManual()}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target&&ev.target.closest&&ev.target.closest('[data-act="dnd-zone"]')){
    ev.preventDefault();
    if(S.checked)return;
    var z=parseInt(ev.target.closest('[data-act="dnd-zone"]').getAttribute('data-zone'),10);
    if(S.dndPick===null){warn('Pick an item first, then click a box.')}
    else{S.dndAssign[S.dndPick]=z;S.dndPick=null;reRenderDnd()}
  }
});
function reRenderDnd(){var e=cur();
  var holder=document.querySelector('.blk-answer');if(!holder)return;
  holder.innerHTML='<div class="lbl">◈ YOUR ANSWER</div>'+dndHTML(e)}
/* drag-and-drop native events */
document.addEventListener('dragstart',function(ev){
  var t=ev.target.closest&&ev.target.closest('.dnd-chip');
  if(t){ev.dataTransfer.setData('text/plain',t.getAttribute('data-i'))}});
document.addEventListener('dragover',function(ev){
  var z=ev.target.closest&&ev.target.closest('.dnd-zone');
  if(z){ev.preventDefault();z.classList.add('over')}});
document.addEventListener('dragleave',function(ev){
  var z=ev.target.closest&&ev.target.closest('.dnd-zone');
  if(z){z.classList.remove('over')}});
document.addEventListener('drop',function(ev){
  var z=ev.target.closest&&ev.target.closest('.dnd-zone');
  if(z){ev.preventDefault();z.classList.remove('over');
    if(S.checked)return;
    var i=parseInt(ev.dataTransfer.getData('text/plain'),10);
    if(!isNaN(i)){S.dndAssign[i]=parseInt(z.getAttribute('data-zone'),10);S.dndPick=null;reRenderDnd()}}});
/* host handshake: CYBERPULSE_INIT and CYBERMASTERY_INIT are both accepted; theme is ignored (dark-only file) */
window.addEventListener('message',function(ev){
  var d=ev.data||{};
  if(d.type==='CYBERPULSE_INIT'||d.type==='CYBERMASTERY_INIT'){
    S.hostOrigin=ev.origin||null;
    try{(window.parent===window?window:window.parent).postMessage(
      {type:'CYBERPULSE_READY',topicId:META.topicId,batch:META.batch,difficulty:META.difficulty},
      S.hostOrigin||location.origin)}catch(e){}
  }
});
document.addEventListener('DOMContentLoaded',function(){renderIntro()});
})();

</script>
</body>
