.paused-overlay{position:fixed;inset:0;z-index:100;background:var(--bg-page);display:flex;align-items:center;justify-content:center;padding:20px}
.paused-card{background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 30px;max-width:440px;text-align:center}
.paused-card .pico{font-size:34px;color:var(--state-paused)}
.paused-card h2{margin:10px 0 6px;font-size:19px;color:var(--state-paused)}
.paused-card p{margin:0 0 18px;color:var(--text-secondary);font-size:14.5px}
/* ---------- responsive ---------- */
@media (max-width:760px){
  .dnd{grid-template-columns:1fr}
  .matchrow{grid-template-columns:1fr}
  .intro{padding:16px 12px 40px}
  .stage{padding:14px 10px 48px}
  .hdr{padding:8px 10px}
  .fact{font-size:12.5px}
}
@media (prefers-reduced-motion: reduce){
  .progress-fill{transition:none}
  .progress-fill::after{animation:none;display:none}
  .btn,.opt,.bankitem,.order-btns button,.zone,.match-sel{transition:none}
  *{scroll-behavior:auto!important}
}

<script type="application/json" id="exam-data">{"topicId":"t1553.005","batch":3,"difficulty":"hard","severity":"HARD","passMark":70,"estimatedMinutes":35,"mitreId":"T1553.005","mitreName":"Mark-of-the-Web Bypass","objectType":"Sub-Technique","intro":{"learn":["This exam is about the MITRE ATT&CK sub-technique T1553.005, called Mark-of-the-Web Bypass, and it sits in the Defense Evasion tactic. At this level the questions stop being definitional: the obvious answer is often wrong, and the artefacts must be read against each other.","Mark-of-the-Web (MOTW) lives in a file's Zone.Identifier stream and drives SmartScreen, Protected View and the Office macro block. Attackers remove the mark with Unblock-File or Remove-Item -Stream, rewrite it, or avoid it entirely by staging payloads in mounted ISO/IMG/VHD images, archives that drop without streams, or USB media with no stream support.","You will weigh near-miss conclusions: a mark on an intranet file that is perfectly normal, a missing mark that is not proof of tampering, and the difference between removing a mark and proving who removed it. Documented lure tradecraft from Emotet, IcedID and BumbleBee appears as scenario material.","The work is real: SOC analysts hand over stream alerts with a defended conclusion, incident responders sequence evidence preservation before cleanup, detection engineers join PowerShell 4103/4104 with Sysmon 15/23/26, Office macro audit events and EDR file events, threat hunters sweep for stream-less payloads, and mail security teams pick controls that survive the business, which administrators then enforce through MDM tools such as Intune. One command here can destroy the case — several exercises make you feel that cost before you act."],"keywords":[{"theme":"Bypass tradecraft","items":["mounted ISO/IMG/VHD images carry no mark","Emotet, IcedID and BumbleBee ISO lures","Unblock-File","Remove-Item -Stream","Set-Content -Stream rewrite","FAT32/exFAT USB staging"]},{"theme":"Reading the signals","items":["SmartScreen skipped","Protected View absent","ZoneId=1 intranet claims","script and HTA warnings"]},{"theme":"Detection and triage","items":["Sysmon events 15, 23 and 26","PowerShell events 4103 and 4104","Office macro audit events","EDR file events","stream inventories with Get-Item/Get-ChildItem -Stream *","least-aggressive response"]},{"theme":"Mitigations","items":["Attack Surface Reduction rules","prevalence, age and trusted-list checks","block macros from the internet policy","mail filtering of ISO/IMG/VHD"]}],"how":["You will answer 15 exercises. You need 70% or more to pass. A pass means you can defend these decisions to a senior reviewer.","Exercise types in this exam: multiple choice, matching pairs, drag and drop, fill-in-the-blank, one branching decision tree, and two simulated PowerShell terminals with different skills.","A countdown timer runs for 35 minutes. The Pause button hides the exercise and stops the timer until you press Resume.","When you press Check, the timer stops automatically so you can read the feedback as long as you like. It starts again when you press Next.","Exercises with several items give partial credit: max(0, (correct − wrong) / items). One hint per exercise is allowed; it costs 10% of that exercise's credit.","Skip moves an exercise to a review pool. Near the end you can answer skipped exercises. Skipped exercises you never answer do not count in your score at all. In the terminals you type the command yourself and press Enter to run it."]},"exercises":[{"id":"e01","type":"single","perspective":"defender","scenario":{"summary":"INC-6120 — name the evasion step for the ATT&CK mapping","text":["INC-6120: user kmyers on WKS-FIN-07 opened an 'urgent Q4 report' from external mail. The EDR now shows a beacon to an unknown host.","The IR lead needs the evasion step named for the ATT&CK mapping before the evening report. She scopes your answer to the 10:04–10:05 window only."],"artefacts":[{"label":"ARTEFACT 1 — Merged host timeline, WKS-FIN-07 (filter box available)","kind":"log","filter":true,"lines":["09:58:12  Sysmon 15  FileCreateStreamHash  C:\\Users\\kmyers\\Downloads\\report.docm:Zone.Identifier","10:04:11  PS 4104   ScriptBlock           Unblock-File -Path C:\\Users\\kmyers\\AppData\\Roaming\\temp\\report.docm","10:04:12  Sysmon 23  FileDelete            C:\\Users\\kmyers\\AppData\\Roaming\\temp\\report.docm:Zone.Identifier","10:05:40  Office     Audit                 report.docm opened — no Protected View banner","10:06:02  Sysmon 11  FileCreate            C:\\Users\\kmyers\\AppData\\Roaming\\temp\\rdpchk.exe","10:06:30  EDR        Network               temp\\rdpchk.exe → 203[.]0[.]113[.]55:443"]},{"label":"ARTEFACT 2 — Ticket INC-6120, IR lead note","kind":"ticket","lines":["Mapping request: name the sub-technique for the 10:04–10:05 window.","Do NOT map the user's double-click; that is already covered."]}]},"question":"Which sub-technique does the 10:04–10:05 window demonstrate?","options":[{"id":"a","text":"T1553.005 — a command removed the mark before the document was opened"},{"id":"b","text":"T1204.002 — the user was persuaded into running a malicious file"},{"id":"c","text":"T1562.001 — security tooling or its logging was impaired"},{"id":"d","text":"T1074.001 — data was staged in a local directory"}],"correct":["a"],"hint":"The note in the ticket already rules out one of the four windows.","explain":["The window contains Unblock-File, the stream's deletion, and an opening with no Protected View banner: the mark was removed so the document would open without friction. That is T1553.005, Mark-of-the-Web Bypass.","The user's double-click (T1204.002) is explicitly out of scope per the ticket. Logging kept working, so T1562.001 does not fit, and the AppData directory is payload staging, not data staging."]},{"id":"e02","type":"match","perspective":"defender","scenario":{"summary":"Signal decoder for the INC-6120 case file","text":["The case file holds six signal descriptions the trainee must decode before the review.","Match each signal to what it actually establishes."]},"question":"Match each signal to what it establishes.","pairs":[{"left":"Downloaded .hta that prompts before running","right":"Script warning caused by the mark being present"},{"left":"Event 15 on Downloads\\report.docm at 09:58:12","right":"The original download carried the mark"},{"left":"PS 4104 at 10:04:11 naming temp\\report.docm","right":"The unblock command ran on the temp copy"},{"left":"Sysmon Event 26 on a :Zone.Identifier stream","right":"Windows detected the stream's deletion"},{"left":"Word opens with no Protected View banner","right":"No mark remained at open time"},{"left":"Stream present with attacker-chosen text inside","right":"The mark was rewritten, not removed"}],"hint":"Creation, removal, rewriting, and the two consequences — one row is a warning that only exists while the mark is still there.","explain":["Event 15 on the Downloads file proves the original was marked at save time. The 4104 row at 10:04:11 records the unblock command running against the temp copy — the command side of the removal.","Event 26 is the detected-deletion event, here aimed at a Zone.Identifier stream — the actual mark removal on disk. The .hta script warning is a consequence of the mark still being present, the banner-less open is the consequence of it being gone, and a stream with new text means Set-Content rewrote it — which changes what you hunt for."]},{"id":"e03","type":"terminal","perspective":"defender","scenario":{"summary":"INC-6120 — stream inventory of the whole acquisition folder","text":["You are on the forensic workstation for INC-6120. The acquisition folder D:\\ir\\6120\\artifacts holds the files pulled from WKS-FIN-07, on a drive mounted read-only with streams preserved.","Objective: before the exhibit list is frozen, the IR lead wants the stream inventory of every file in that folder — which artefacts still carry a mark and which were born without one.","No tool is named for you — choose the enumerator and the stream view yourself."],"artefacts":[{"label":"ARTEFACT 1 — Forensic mount note","kind":"text","lines":["D:\\ir\\6120\\artifacts — mounted READ-ONLY, streams preserved.","Case rule: any command that alters state ends your lab access."]}]},"question":"Type the command that lists the streams of every file in the case folder.","terminal":{"prompt":"analyst@SRV-FORENSIC-01","banner":["Windows PowerShell — forensic workstation (simulated)","D:\\ir\\6120\\artifacts mounted READ-ONLY (streams preserved)"],"solution":"Get-ChildItem -Path D:\\ir\\6120\\artifacts\\* -Stream *","elements":[{"label":"bulk enumerator Get-ChildItem","re":"^[Gg]et-[Cc]hild[Ii]tem( |$)"},{"label":"the case folder D:\\ir\\6120\\artifacts","re":"6120\\\\artifacts"},{"label":"-Stream * (all streams)","re":"-Stream\\s+\\*"}],"outputs":[{"re":"-Stream\\s+\\*","lines":["  Folder: D:\\ir\\6120\\artifacts","report.docm   Stream: :$DATA            Length: 31842","report.docm   Stream: Zone.Identifier   Length: 176","rdpchk.exe    Stream: :$DATA            Length: 90112","note.txt      Stream: :$DATA            Length: 912","3 files listed — only report.docm still carries a Zone.Identifier on this copy."]},{"re":"^[Gg]et-[Cc]hild[Ii]tem","lines":["report.docm   31842 bytes","rdpchk.exe    90112 bytes","note.txt      912 bytes","File names only — add -Stream * for the stream inventory the review wants."]},{"re":"^[Gg]et-[Ii]tem","lines":["Get-Item inventories one file at a time — the case review wants every file in the folder."]}],"nearMiss":[{"re":"Remove-Item","msg":"Remove-Item deletes files or streams from the acquisition folder — the artefacts are the case."},{"re":"^[Ss]et-[Cc]ontent","msg":"Set-Content would rewrite stream text on case artefacts — alteration is its own evidence crime."}],"nearMissSample":"Remove-Item -Path D:\\ir\\6120\\artifacts\\report.docm -Stream Zone.Identifier","partialSample":"Get-ChildItem -Path D:\\ir\\6120\\artifacts\\*"},"hint":"Three elements are graded: the folder enumerator, the case folder path, and the all-streams view.","explain":["The canonical command is: Get-ChildItem -Path D:\\ir\\6120\\artifacts\\* -Stream *. The folder wildcard walks every artefact and -Stream * prints each file's streams: report.docm still carries Zone.Identifier, rdpchk.exe and note.txt were born without one — the biography the exhibit list needs.","Remove-Item deletes artefacts or streams and Set-Content rewrites stream text — both alter case evidence, so the sandbox flags them as dangerous near misses. Get-ChildItem alone lists file names only: two of the three graded elements, one third of the credit."]},{"id":"e04","type":"match","perspective":"dual","scenario":{"summary":"CTI back-brief — documented lure tradecraft","text":["Your purple team emulated the mounted-image lure tradecraft that CTI documents for Emotet, IcedID and BumbleBee.","The debrief wall lists five observed moves. Match each to the property it exploits or the trace it leaves."]},"question":"Match each documented move to its property.","pairs":[{"left":"Emotet-style invoice .iso the user mounts","right":"Payload lands with no Zone.Identifier stream"},{"left":"IcedID-style .img with a disguised .lnk inside","right":"Shortcut inside the image starts the loader"},{"left":"BumbleBee-style .iso carrying an archive","right":"Extractor output never receives a mark"},{"left":"Downloaded .hta the user double-clicks","right":"Script warning appears while the mark is present"},{"left":"Loader staged from an exFAT USB stick","right":"The filesystem has no alternate data streams at all"}],"hint":"Three rows avoid the mark by birthplace, one row shows the mark still working, one row removes the filesystem feature the mark depends on.","explain":["Mounted ISO/IMG/VHD contents and extractor output are born without the mark, which is why the documented Emotet, IcedID and BumbleBee lures favour them; the .lnk inside the image does the clicking for the user.","The .hta row is the counter-example: with the mark present, the script warning still fires. The exFAT USB row removes the underlying feature — no alternate data streams, so no Zone.Identifier can exist there.","Attacker perspective: the documented groups pick image formats and stream-less staging precisely because mark-based warnings then have nothing to read.","Defender perspective: the join is the answer — mount event plus stream-less file creation, backed by the prevalence/age/trusted-list rule that never needed the mark."]},{"id":"e05","type":"drag","perspective":"defender","scenario":{"summary":"INC-6120 — sort seven files by the mark's biography","text":["Evidence review for INC-6120 spreads seven files across the case. The IR lead wants each file's mark biography decided by the timeline, not by folklore.","Sort them: mark present, never had one, or removed after arrival."],"artefacts":[{"label":"ARTEFACT 1 — Merged host timeline, WKS-FIN-07 (filter box available)","kind":"log","filter":true,"lines":["09:58:12  Sysmon 15  FileCreateStreamHash  C:\\Users\\kmyers\\Downloads\\report.docm:Zone.Identifier","10:04:11  PS 4104    ScriptBlock           Unblock-File -Path C:\\Users\\kmyers\\AppData\\Roaming\\temp\\report.docm","10:04:12  Sysmon 23  FileDelete            C:\\Users\\kmyers\\AppData\\Roaming\\temp\\report.docm:Zone.Identifier","10:05:40  Office     Audit                 report.docm opened — no Protected View banner","10:06:02  Sysmon 11  FileCreate            C:\\Users\\kmyers\\AppData\\Roaming\\temp\\rdpchk.exe","10:06:30  EDR        Network               temp\\rdpchk.exe → 203[.]0[.]113[.]55:443","10:07:05  Sysmon 15  FileCreateStreamHash  C:\\Users\\kmyers\\Downloads\\Q4-notes.pdf:Zone.Identifier","10:08:55  Sysmon 11  FileCreate            C:\\Users\\kmyers\\AppData\\Roaming\\temp\\stage2.dll  (no stream event follows)","10:12:44  Sysmon 11  FileCreate            D:\\usbStaging\\collect.zip  (exFAT volume — no stream support)"]}]},"question":"Sort each file into the correct column.","zones":[{"id":"z1","label":"Mark present","accepts":["i1","i2","i3"]},{"id":"z2","label":"Never had a mark","accepts":["i5","i6","i7"]},{"id":"z3","label":"Mark removed after arrival","accepts":["i4"]}],"items":[{"id":"i1","text":"Downloads\\report.docm — Event 15 wrote its stream at 09:58:12"},{"id":"i2","text":"Q4-notes.pdf in Downloads — Event 15 at 10:07:05; nothing touched it after"},{"id":"i3","text":"The CAD package from the intranet design portal — stream shows ZoneId=1"},{"id":"i4","text":"temp\\report.docm — Unblock-File at 10:04:11, stream deleted at 10:04:12"},{"id":"i5","text":"temp\\rdpchk.exe — Event 11 at 10:06:02, no stream event before or after"},{"id":"i6","text":"temp\\stage2.dll — Event 11 at 10:08:55, copied out of the attacker's mounted image"},{"id":"i7","text":"collect.zip created on the exFAT USB volume at 10:12:44 — streams impossible there"}],"hint":"Three biographies come straight from Event 15 rows; a zone value on the stream does not change the presence answer.","explain":["Present: the two Event 15 rows prove marks written at save time (report.docm and Q4-notes.pdf), and the CAD package's ZoneId=1 stream is still a mark — zone 1 means intranet origin, not the absence of a mark.","Removed after arrival: temp\\report.docm was unblocked at 10:04:11 and its stream deleted at 10:04:12 — the T1553.005 action. Never had one: rdpchk.exe and stage2.dll were created with no stream event behind them (stage2.dll came out of the attacker's mounted image), and the exFAT volume cannot hold alternate data streams at all, so collect.zip was born unmarked there."]},{"id":"e06","type":"single","perspective":"defender","scenario":{"summary":"SEV-3 on WKS-ENG-05 — alarming row, boring truth?","text":["Alert SEV-3 fires on WKS-ENG-05: Sysmon 15 recorded Zone.Identifier creation on cad_drawing.zip.","The stream names the internal design portal as the source. The design team pulls CAD packages from that portal every day, and the portal is on the approved software list.","A colleague wants the alert escalated to IR before lunch."],"artefacts":[{"label":"ARTEFACT 1 — Sysmon Event 15, WKS-ENG-05","kind":"code","lines":["Event 15  FileCreateStreamHash","Target:   C:\\Users\\dchan\\Downloads\\cad_drawing.zip:Zone.Identifier","[ZoneTransfer] ZoneId=1","HostUrl=hxxp://intranet[.]design[.]example[.]com/pkg/cad_drawing.zip  (10[.]20[.]0[.]15)"]}]},"question":"What is the correct triage decision for SEV-3?","options":[{"id":"a","text":"Escalate to IR — a stream was written on an engineering host"},{"id":"b","text":"Close as expected behaviour: the daily portal download carries a zone value"},{"id":"c","text":"Delete the file so the mark cannot be abused later"},{"id":"d","text":"Disable SmartScreen on engineering hosts to stop these alerts"}],"correct":["b"],"hint":"The portal and its packages are on the approved software list with a daily baseline.","explain":["The row looks alarming — a zone stream appeared — but the baseline says the design portal's downloads are marked with ZoneId=1 every day. Expected behaviour, so it closes as benign; the least aggressive correct action wins.","Escalation burns IR time on a daily baseline. Deleting the file damages a legitimate CAD package and the user's work. Disabling SmartScreen weakens every other download check to silence one benign alert."]},{"id":"e07","type":"blank","perspective":"defender","scenario":{"summary":"Name the two IDs the removal rule needs","text":["The detection-engineering review asks you to name the two event IDs at the heart of the mark-removal rule.","One is the PowerShell log that stores removal commands word-for-word; the other is the Sysmon event that flags the stream's deletion."]},"question":"Fill both blanks in the rule summary.","blanks":[{"before":"The removal command text is recorded by PowerShell event ","after":" , and Sysmon flags the stream's deletion as event ID ","answer":["4104"],"hint":"the script-block logging ID you saw in the INC-6120 timeline"},{"before":"","after":" .","answer":["23","26"],"hint":"either Sysmon deletion ID is accepted — 23 logs it, 26 detects it"}],"hint":"The first gap is four digits from the timeline; the second gap accepts either Sysmon deletion ID.","explain":["PowerShell 4104 keeps the command text, which is why Unblock-File is visible word for word. Sysmon 23 logs the file/stream deletion (and archives the file); 26 is the detected-deletion variant — either ID proves the stream left the disk.","A rule that joins 4104 with a Sysmon deletion on a :Zone.Identifier path catches both the command and its effect, even when the attacker changes the path between them."]},{"id":"e08","type":"multi","perspective":"defender","scenario":{"summary":"Prove the ORDER: removal before open","text":["The IR lead accepts that the mark was removed from report.docm. She now wants proof of the order: removed BEFORE the document was opened.","Five facts are in the case file. Two of them prove the order."]},"question":"Select the TWO facts that prove removal happened before the open.","options":[{"id":"a","text":"4104 Unblock-File at 10:04:11; document opened at 10:05:40"},{"id":"b","text":"Sysmon 23 on :Zone.Identifier at 10:04:12; opened at 10:05:40"},{"id":"c","text":"The document contains an AutoOpen macro"},{"id":"d","text":"The delivery mail arrived in the mailbox at 09:44"},{"id":"e","text":"The Office audit log shows the document was opened"}],"correct":["a","b"],"hint":"One wrong path proves capability and another proves delivery — you need two timestamps on one clock.","explain":["Both correct facts pair a removal timestamp with the later open timestamp on the same host clock: the command at 10:04:11 and the stream deletion at 10:04:12 both precede the 10:05:40 open.","The AutoOpen macro proves capability, not order. The mail arrival time proves delivery. The bare 'opened' audit row lacks the removal side of the comparison, so it cannot establish order either."]},{"id":"e09","type":"drag","perspective":"defender","scenario":{"summary":"Sequence the playbook phases for INC-6120","text":["The IR lead pins three phases to the war-room wall: Preserve, Contain, Remediate.","Sort the six planned actions into the phase where the playbook requires them."]},"question":"Sort each action into its playbook phase.","zones":[{"id":"z1","label":"Phase 1 — Preserve","accepts":["i1","i2"]},{"id":"z2","label":"Phase 2 — Contain","accepts":["i3","i4"]},{"id":"z3","label":"Phase 3 — Remediate","accepts":["i5","i6"]}],"items":[{"id":"i1","text":"Capture memory while the host is still running"},{"id":"i2","text":"Take a stream-preserving disk image of the system drive"},{"id":"i3","text":"Isolate the host at the EDR, keeping it powered on"},{"id":"i4","text":"Pull the delivery mail so other recipients are protected"},{"id":"i5","text":"Remove the payload only after preservation is confirmed"},{"id":"i6","text":"Rebuild the workstation from a known-good image"}],"hint":"Two actions destroy what the first phase collects — they belong at the end, not the start.","explain":["Preserve comes first because memory and a stream-preserving image are the only sources for the mark's biography. Contain then stops the bleeding: isolation and pulling the mail protect others without touching evidence.","Remediate acts last: removing the payload and rebuilding both destroy the very artefacts Phase 1 collected. Doing them early is the cost-of-action mistake this phase structure exists to prevent."]},{"id":"e10","type":"branch","perspective":"defender","scenario":{"summary":"“It came from our portal” — the mark that isn't there","text":["A user on WKS-SUP-12 insists update_tool.exe came from the internal software portal. The file has no Zone.Identifier stream at all.","Work the decision tree to the ticket's final wording."],"artefacts":[{"label":"ARTEFACT 1 — Stream listing on a copy","kind":"code","lines":["Get-Item -Stream * → :$DATA only.  No Zone.Identifier found."]},{"label":"ARTEFACT 2 — Proxy log, WKS-SUP-12 (filter box available)","kind":"log","filter":true,"lines":["11:02:19  GET  hxxp://files[.]portal-share[.]example[.]com/dl/update_tool.exe  category=internet  user=jdoe","11:02:19  (no request to the internal portal in the surrounding hour)"]}]},"question":"Work through the branches and pick the final wording.","branch":{"steps":[{"prompt":"The user insists 'internal portal', but no mark exists. What do you check first?","options":[{"id":"a","text":"Compare the portal and proxy logs for that file name and time"},{"id":"b","text":"Trust the user and close the ticket"},{"id":"c","text":"Reimage the workstation before anything else"}],"correct":"a","outcome":"The proxy shows the download came from an internet site, not the intranet portal."},{"prompt":"The proxy contradicts the user, and the mark is missing. What do you check next?","options":[{"id":"a","text":"Search PowerShell 4104 and Sysmon 23/26 for stream removal on that path"},{"id":"b","text":"Declare a confirmed T1553.005 bypass now"},{"id":"c","text":"Ask the user to download it again from the real portal"}],"correct":"a","outcome":"No removal events exist. The file was fetched by a non-standard browser that never attaches the mark."}],"final":{"question":"What do you record as the ticket's outcome?","options":[{"id":"a","text":"Missing mark alone is not proof of a bypass; note the internet origin and browser quirk, keep monitoring"},{"id":"b","text":"Confirmed T1553.005 — escalate as a breach tonight"},{"id":"c","text":"The proxy log is wrong; close the ticket as the user described"},{"id":"d","text":"Delete the file and block the site for everyone"}],"correct":["a"]}},"hint":"Two records disagree with the user's claim — start there.","explain":["The tree separates two questions: where the file really came from (proxy wins over the user's claim) and whether anyone removed the mark (no removal events exist). Both answers point away from a confirmed bypass.","Declaring T1553.005 overreaches the evidence; accepting the user's story ignores two contradicting records; deleting the file destroys the artefact and overblocks a site on the strength of one download. The record stays factual and keeps monitoring."]},{"id":"e11","type":"match","perspective":"defender","scenario":{"summary":"Control catalogue — what each control actually buys","text":["The hardening board asks what each proposed control contributes against T1553.005.","Match each control to the single effect it delivers."]},"question":"Match each control to its effect.","pairs":[{"left":"SmartScreen kept enabled","right":"Warns before a marked program first runs"},{"left":"ASR rule: block Office child processes","right":"Stops a macro document from spawning the payload"},{"left":"ASR rule on prevalence, age or trusted list","right":"Blocks unknown executables even when no mark exists"},{"left":"Office policy: block macros with the mark","right":"Macros stay dead even if Protected View is bypassed"},{"left":"Mail filter for .iso/.img/.vhd","right":"Keeps mounted-image lures out of inboxes"}],"hint":"One row covers the mark-less world that mounted images create — the other four assume a mark or an attachment.","explain":["SmartScreen and the Office macro policy both lean on the mark: the first warns at first run, the second kills macros. They fail together when the mark is absent.","The prevalence/age/trusted-list ASR rule is the one control that still works with no mark at all, which is why mounted-image campaigns fear it. The mail filter and the Office child-process rule block the lure and the spawn respectively."]},{"id":"e12","type":"terminal","perspective":"defender","scenario":{"summary":"Detonation prep — the runbook sanctions one command","text":["Detonation lab SRV-LAB-02 sits on an isolated VLAN. The evidence original, E:\\Evidence\\INC-6120\\invoice.docm, is write-protected.","Runbook §4 authorises exactly one state change: removing the mark on the lab copy C:\\Lab\\INC-6120\\invoice-copy.docm so the document opens outside Protected View for detonation.","Run the sanctioned command on the lab copy."],"artefacts":[{"label":"ARTEFACT 1 — Runbook §4 extract","kind":"text","lines":["Sanctioned: mark removal on C:\\Lab\\INC-6120\\* copies only.","Forbidden: any command naming E:\\Evidence\\ paths."]}]},"question":"Type the runbook command for the lab copy.","terminal":{"prompt":"analyst@SRV-LAB-02","banner":["Windows PowerShell — detonation lab, isolated VLAN (simulated)","Evidence original: E:\\Evidence\\INC-6120\\invoice.docm (write-protected)","Sanctioned copy:   C:\\Lab\\INC-6120\\invoice-copy.docm"],"solution":"Unblock-File -Path C:\\Lab\\INC-6120\\invoice-copy.docm","elements":[{"label":"cmdlet Unblock-File","re":"^[Uu]nblock-[Ff]ile( |$)"},{"label":"the sanctioned lab copy invoice-copy.docm","re":"[Ii]nvoice-copy\\.docm"}],"outputs":[{"re":"[Ii]nvoice-copy\\.docm","lines":["PS C:\\Lab\\INC-6120> Unblock-File -Path C:\\Lab\\INC-6120\\invoice-copy.docm","[RUNBOOK] Mark removed on the lab copy — Zone.Identifier stream deleted.","Evidence original on E:\\Evidence\\ untouched. Copy ready for detonation."]},{"re":"^[Uu]nblock-[Ff]ile","lines":["No change made — name the sanctioned lab copy from runbook §4."]}],"nearMiss":[{"re":"[Uu]nblock-[Ff]ile.*[Ee]vidence","msg":"That names the evidence original — altering it destroys the case. Only the lab copy is sanctioned."},{"re":"[Uu]nblock-[Ff]ile.*\\*","msg":"Wildcard unblocking hits every file in the folder, not the one sanctioned copy."},{"re":"Remove-Item","msg":"Remove-Item deletes the file or stream — the runbook never sanctions deletion."}],"nearMissSample":"Unblock-File -Path E:\\Evidence\\INC-6120\\invoice.docm","partialSample":"Unblock-File -Path C:\\Lab\\INC-6120\\other-copy.docm"},"hint":"Both graded elements are in the runbook extract: the cmdlet and the exact sanctioned target.","explain":["The canonical command is: Unblock-File -Path C:\\Lab\\INC-6120\\invoice-copy.docm — the one state change the runbook sanctions, on the one file it names.","Naming the evidence path is the dangerous near miss the case rule forbids; a wildcard unblocks everything in the folder; Remove-Item deletes instead of unblocking. A different lab copy scores half the elements and zero credit here — precision is the skill."]},{"id":"e13","type":"single","perspective":"attacker","scenario":{"summary":"Purple-team question — what the second stage gains","text":["In the emulation debrief, the red team's first-stage loader ran with no warnings because its mark had been stripped at staging.","The blue team asks: what does that buy the adversary for the SECOND stage?"]},"question":"What does the adversary gain for the second stage?","options":[{"id":"a","text":"Later payloads land with fewer prompts, so delivery runs smoother"},{"id":"b","text":"The next stage is signed automatically by a trusted vendor"},{"id":"c","text":"Windows Update distributes the next stage silently"},{"id":"d","text":"The mail gateway starts trusting future attachments"}],"correct":["a"],"hint":"It is not about signing or update channels — think about every prompt the user no longer sees.","explain":["With the mark gone, each following payload opens and runs without SmartScreen challenges or Protected View friction. The attacker's delivery chain gets quieter, which is exactly why T1553.005 helps every later step of the chain, not just this one run.","Nothing in the bypass signs code, touches Windows Update, or changes the mail gateway's judgement of attachments. Those three are infrastructure-level changes the mark never controlled."]},{"id":"e14","type":"drag","perspective":"defender","scenario":{"summary":"Telemetry shopping list — what catches what","text":["Your detection engineering backlog has budget for six telemetry sources, in three families.","Sort each source by the family of signals it catches."]},"question":"Sort each source into the correct family.","zones":[{"id":"z1","label":"Catches command text","accepts":["i1","i2"]},{"id":"z2","label":"Catches stream state on disk","accepts":["i3","i4"]},{"id":"z3","label":"Catches document behaviour","accepts":["i5","i6"]}],"items":[{"id":"i1","text":"PowerShell 4104 script-block logging"},{"id":"i2","text":"PowerShell 4103 module logging"},{"id":"i3","text":"Sysmon event 15 (FileCreateStreamHash)"},{"id":"i4","text":"Sysmon events 23 and 26 (deletion)"},{"id":"i5","text":"Office macro audit events"},{"id":"i6","text":"EDR file events on Office child processes"}],"hint":"Command text, on-disk streams, and what documents do when opened — two sources per family.","explain":["Command text: 4104 records the script block and 4103 records the module-level activity of the same invocation — together they capture Unblock-File and Remove-Item runs.","Stream state: Sysmon 15 sees the mark being created, and 23/26 see it deleted. Document behaviour: Office macro audit events and EDR file events show what a document did — the consequences a bypass is trying to enable."]},{"id":"e15","type":"multi","perspective":"defender","scenario":{"summary":"Board pack — the three controls that earn their line","text":["The hardening board funds only the controls that directly reduce T1553.005 risk.","Five proposals are on the table; three earn a line in the pack."]},"question":"Select the THREE proposals that directly reduce T1553.005 risk.","options":[{"id":"a","text":"Keep SmartScreen enabled on all workstations"},{"id":"b","text":"Deploy the ASR rule blocking executables without prevalence, age or trusted-list status"},{"id":"c","text":"Enable the Office policy that blocks macros in files with the mark"},{"id":"d","text":"Allow all macros from any intranet file to reduce service-desk tickets"},{"id":"e","text":"Turn off the mail gateway's attachment filtering to speed delivery"}],"correct":["a","b","c"],"hint":"Two proposals remove protections the technique depends on bypassing — they move the risk the wrong way.","explain":["SmartScreen keeps the mark's warning alive, the prevalence/age/trusted-list ASR rule catches stream-less payloads that mounted images produce, and the Office macro policy keeps macros dead even when other layers fail.","Allowing intranet macros widens the exact trust gap attackers spoof with ZoneId=1, and switching off attachment filtering reopens the .iso delivery lane. Both increase T1553.005 risk."]}]}</script>
<script>
(function () {
  'use strict';

  /* ============================ utilities ============================ */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function mulberry32(seed) {
    var t = seed >>> 0;
    return function () {
      t += 0x6D2B79F5;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffled(arr, rnd) {
    var a = arr.slice(), i, j, tmp;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(rnd() * (i + 1));
      tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function fmt1(n) { return (Math.round(n * 10) / 10).toFixed(1); }
  function fmt2(n) { return (Math.round(n * 100) / 100).toFixed(2); }
  function fmtPct(sum, count) { return count > 0 ? Math.round((sum / count) * 100) : 0; }
  function hashId(s) {
    var h = 0, i;
    for (i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h;
  }
  function exSeed(ex, salt) { return ((S.seed ^ 0x9E3779B9) * 2654435761 + hashId(ex.id) * 97 + salt) >>> 0; }

  /* ============================ data ============================ */
  var DATA = JSON.parse($('exam-data').textContent);
  var EXS = DATA.exercises;
  var TOTAL = EXS.length;
  var BUDGET = (DATA.estimatedMinutes || 25) * 60;
  var PASSMARK = DATA.passMark || 70;
  var SEVCLS = { 'EASY': 'sev-easy', 'MEDIUM': 'sev-medium', 'HARD': 'sev-hard', 'EXTREMELY HARD': 'sev-extreme' };
  var byId = {};
  EXS.forEach(function (e) { byId[e.id] = e; });

  /* ============================ state ============================ */
  var S = {
    screen: 'intro',        // intro | exam | review | results
    attempt: 0,
    order: [],
    pos: 0,
    answers: {},            // exId -> widget state
    results: {},            // exId -> graded result
    skipped: [],            // exIds in the skip pool (never answered yet)
    hintUsed: {},
    creditSum: 0,
    answeredCount: 0,
    state: 'RUNNING',       // RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED
    resumeState: null,
    remaining: BUDGET,
    pauseAccum: { manual: 0, autoCheck: 0 },
    posted: false,
    mode: 'main',           // main | review
    reviewList: [],
    seed: 1,
    checkedId: null,
    exTimer: null,          // { exId, remaining } for per-exercise timed terminal exercises
    handshake: null
  };

  /* ============================ timer ============================ */
  var lastTick = Date.now();
  setInterval(function () {
    var now = Date.now();
    var dt = (now - lastTick) / 1000;
    lastTick = now;
    if (dt < 0 || dt > 2) { dt = 0.25; }
    if (S.state === 'RUNNING') {
      S.remaining -= dt;
      if (S.remaining <= 0) { S.remaining = 0; updateHeader(); endByTimeout(); return; }
      if (S.exTimer && !S.results[S.exTimer.exId] && S.screen === 'exam') {
        S.exTimer.remaining -= dt;
        var et = $('ex-timer-clock');
        if (et) { et.textContent = fmtClock(S.exTimer.remaining); }
        if (S.exTimer.remaining <= 0) { S.exTimer.remaining = 0; doCheck(true); }
      }
      updateTimerClock();
    } else if (S.state === 'PAUSED_MANUAL') {
      S.pauseAccum.manual += dt;
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      S.pauseAccum.autoCheck += dt;
    }
  }, 250);

  function updateTimerClock() {
    var el = $('hdr-clock');
    if (el) { el.textContent = fmtClock(S.remaining); }
  }
  function setState(next) {
    S.state = next;
    renderTimerPill();
    renderPauseOverlay();
  }
  function renderTimerPill() {
    var pill = $('hdr-timer');
    if (!pill) { return; }
    var clock = '<span class="t-clock" id="hdr-clock">' + fmtClock(S.remaining) + '</span>';
    if (S.state === 'RUNNING') {
      pill.className = 'pill pill-timer st-run';
      pill.innerHTML = '<span class="t-state">▶ Running</span>' + clock;
    } else if (S.state === 'PAUSED_MANUAL') {
      pill.className = 'pill pill-timer st-pause';
      pill.innerHTML = '<span class="t-state">⏸ PAUSED — manual (press Resume)</span>' + clock;
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      pill.className = 'pill pill-timer st-pause';
      pill.innerHTML = '<span class="t-state">⏸ PAUSED — reviewing feedback (resumes on Next)</span>' + clock;
    } else {
      pill.className = 'pill pill-timer st-end';
      pill.innerHTML = '<span class="t-state">■ Ended</span>' + clock;
    }
  }

  /* ============================ header ============================ */
  function headerHtml() {
    var sev = DATA.severity;
    var cls = SEVCLS[sev] || 'sev-easy';
    return '<header class="hdr" id="hdr">' +
      '<div class="hdr-row">' +
        '<span class="counter" id="hdr-counter"></span>' +
        '<span class="sev ' + cls + '" id="hdr-sev"><span class="dot" aria-hidden="true"></span>' + esc(sev) + '</span>' +
        '<span class="hdr-spacer"></span>' +
        '<span class="pill pill-timer" id="hdr-timer" role="timer"></span>' +
        '<span class="pill" id="hdr-score" aria-label="Live score"></span>' +
      '</div>' +
      '<div class="hdr-row">' +
        '<button type="button" class="btn" id="btn-hint">? Hint</button>' +
        '<button type="button" class="btn" id="btn-skip">Skip »</button>' +
        '<button type="button" class="btn" id="btn-pause">⏸ Pause</button>' +
        '<div class="progress" role="progressbar" id="hdr-progress" aria-label="Exam progress" aria-valuemin="0" aria-valuemax="' + TOTAL + '" aria-valuenow="0">' +
          '<div class="progress-fill" id="progress-fill"></div>' +
        '</div>' +
      '</div>' +
    '</header>';
  }
  function updateHeader() {
    var ex = currentEx();
    var counter = $('hdr-counter');
    if (counter) {
      if (S.screen === 'results') {
        counter.textContent = 'Exam complete';
      } else {
        var n = S.pos + 1;
        counter.textContent = (S.mode === 'review' ? 'Review · ' : '') + 'Exercise ' + n + ' of ' + TOTAL;
      }
    }
    var score = $('hdr-score');
    if (score) {
      var pct = fmtPct(S.creditSum, S.answeredCount);
      score.innerHTML = 'Score <b>' + fmt1(S.creditSum) + '</b>&nbsp;/&nbsp;' + S.answeredCount + ' · ' + pct + '%';
    }
    var hint = $('btn-hint'), skip = $('btn-skip'), pause = $('btn-pause');
    var answered = ex && !!S.results[ex.id];
    if (hint) {
      hint.disabled = answered || !!S.hintUsed[ex ? ex.id : ''] || S.state !== 'RUNNING' && S.state !== 'PAUSED_AUTO_CHECK';
      hint.setAttribute('aria-label', 'Hint (costs 10% of this exercise credit, one use only)');
    }
    if (skip) {
      skip.disabled = answered || S.state !== 'RUNNING';
      skip.setAttribute('aria-label', 'Skip this exercise and move it to the skipped pool');
    }
    if (pause) {
      var manual = S.state === 'PAUSED_MANUAL';
      pause.innerHTML = manual ? '▶ Resume' : '⏸ Pause';
      pause.disabled = S.state === 'ENDED';
      pause.setAttribute('aria-label', manual ? 'Resume the exam' : 'Pause the exam manually (hides the exercise)');
    }
    var fill = $('progress-fill');
    if (fill) {
      var done = S.answeredCount + S.skipped.length;
      var pctW = TOTAL > 0 ? Math.round((done / TOTAL) * 100) : 0;
      fill.style.width = pctW + '%';
      var pb = $('hdr-progress');
      if (pb) { pb.setAttribute('aria-valuenow', String(done)); }
    }
  }

  /* ============================ intro screen ============================ */
  function renderIntro() {
    S.screen = 'intro';
    var intro = DATA.intro;
    var kw = (intro.keywords || []).map(function (grp) {
      return '<div class="kw-theme"><h3>' + esc(grp.theme) + '</h3><ul>' +
        grp.items.map(function (k) { return '<li>' + esc(k) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    var html =
      '<div class="intro">' +
        '<section class="intro-strip" aria-label="Exam facts">' +
          '<h1>' + esc(DATA.mitreId) + ' — ' + esc(DATA.mitreName) + '</h1>' +
          '<div class="intro-sub">' + esc(DATA.objectType) + ' · MITRE ATT&CK · ' + esc(DATA.severity) + ' practice exam</div>' +
          '<div class="factrow">' +
            '<span class="fact"><b>' + TOTAL + '</b> exercises</span>' +
            '<span class="sev ' + (SEVCLS[DATA.severity] || 'sev-easy') + '"><span class="dot" aria-hidden="true"></span>' + esc(DATA.severity) + '</span>' +
            '<span class="fact">Estimated time: <b>' + DATA.estimatedMinutes + ' min</b></span>' +
            '<span class="fact">Timer budget: <b>' + fmtClock(BUDGET) + '</b></span>' +
            '<span class="fact">Pass mark: <b>' + PASSMARK + '%</b></span>' +
          '</div>' +
        '</section>' +
        '<section class="intro-card"><h2>What you will learn here</h2>' +
          intro.learn.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
        '</section>' +
        '<section class="intro-card"><h2>Keywords covered in this exam</h2>' +
          '<div class="kw-grid">' + kw + '</div>' +
        '</section>' +
        '<section class="intro-card"><h2>How this exam works</h2>' +
          '<ul class="how-list">' + intro.how.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' +
          '<div class="intro-start">' +
            '<button type="button" class="btn btn-primary btn-big" id="btn-start">Start exam</button>' +
            '<span class="start-note">The timer starts when you press Start.</span>' +
          '</div>' +
        '</section>' +
      '</div>';
    var app = $('app');
    app.innerHTML = html;
    $('btn-start').addEventListener('click', startAttempt);
  }

  /* ============================ attempt control ============================ */
  function startAttempt() {
    S.attempt += 1;
    S.seed = 1 + S.attempt * 7919;
    S.order = EXS.map(function (_, i) { return i; });
    if (S.attempt > 1) {
      S.order = shuffled(S.order, mulberry32(S.seed));
    }
    S.pos = 0;
    S.answers = {};
    S.results = {};
    S.skipped = [];
    S.hintUsed = {};
    S.creditSum = 0;
    S.answeredCount = 0;
    S.pauseAccum = { manual: 0, autoCheck: 0 };
    S.posted = false;
    S.mode = 'main';
    S.reviewList = [];
    S.checkedId = null;
    S.exTimer = null;
    S.remaining = BUDGET;
    S.screen = 'exam';
    setState('RUNNING');
    renderExam();
  }
  function currentEx() {
    if (S.screen !== 'exam' && S.screen !== 'results') { return null; }
    if (S.pos < 0 || S.pos >= S.order.length) { return null; }
    return EXS[S.order[S.pos]];
  }

  /* ============================ exercise rendering ============================ */
  function scenarioLong(sc) {
    var chars = (sc.text || []).join(' ').length;
    return chars > 600 || (sc.artefacts && sc.artefacts.length >= 2);
  }
  function artefactHtml(a, idx) {
    var body;
    if (a.kind === 'log' || a.kind === 'code') {
      var lines = (a.lines || []).map(function (ln) {
        return '<span class="ln">' + highlight(ln) + '</span>';
      }).join('');
      var filter = a.filter ? '<input type="text" class="logfilter" data-filter="' + idx + '" placeholder="Filter lines (text match)" aria-label="Filter log lines">' : '';
      body = filter + '<pre class="mono loglines" data-logbody="' + idx + '">' + lines + '</pre>';
    } else {
      body = '<pre class="mono loglines">' + (a.lines || []).map(function (ln) { return esc(ln); }).join('\n') + '</pre>';
    }
    return '<div class="artefact"><div class="artefact-label"><span aria-hidden="true">▤</span>' + esc(a.label) + '</div>' + body + '</div>';
  }
  var SYN_RE = /(&quot;[^&]*?&quot;)|(\bT\d{4}(?:\.\d{3})?\b)|(--?[A-Za-z][\w-]*)|(\b[\w.\-]+(?:[\/\\][\w.\-@]+)+[\/\\]?)|(\b\d{1,3}(?:\[\.\]\d{1,3}){2,3}\b)|(\b(?:allowed|denied|accepted|rejected|granted|denied|quarantine|failed|success|error|warning|blocked|trusted|unblocked|Root|UNTRUSTED|SIGNATURE|PASS|FAIL)\b)/gi;
  function highlight(line) {
    var e = esc(line);
    return e.replace(SYN_RE, function (m, q, mid, flag, path, ip, kw) {
      if (q) { return '<span class="tok-s">' + q + '</span>'; }
      if (mid) { return '<span class="tok-m">' + mid + '</span>'; }
      if (flag) { return '<span class="tok-f">' + flag + '</span>'; }
      if (path) { return '<span class="tok-c">' + path + '</span>'; }
      if (ip) { return '<span class="tok-n">' + ip + '</span>'; }
      if (kw) { return '<span class="tok-k">' + kw + '</span>'; }
      return m;
    });
  }
  function optText(ex, oid) {
    var o = (ex.options || []).find(function (x) { return x.id === oid; });
    return o ? o.text : oid;
  }
  function optsHtml(ex, kind) {
    var rnd = mulberry32(exSeed(ex, 1));
    var ids = ex.options.map(function (o) { return o.id; });
    var view = shuffled(ids, rnd);
    var role = kind === 'single' ? 'radio' : 'checkbox';
    var a = S.answers[ex.id] || {};
    var sel = a.sel || [];
    return '<div class="opts" role="group" aria-label="Answer options">' + view.map(function (oid, i) {
      /* options are shuffled per attempt; correct positions vary */
      var isSel = sel.indexOf(oid) >= 0;
      return '<button type="button" class="opt" data-oid="' + esc(oid) + '" role="' + role + '" aria-checked="' + (kind === 'single' && isSel) + '" aria-pressed="' + (kind === 'multi' && isSel) + '">' +
        '<span class="opt-key">' + String.fromCharCode(65 + i) + '.</span>' +
        '<span class="opt-text">' + esc(optText(ex, oid)) + '</span>' +
        '<span class="opt-mark">' + (isSel ? '● Selected' : '') + '</span>' +
      '</button>';
    }).join('') + '</div>' +
    (kind === 'multi' ? '<p class="note">Select all options that apply. Partial credit is possible.</p>' : '');
  }
  function exerciseHtml(ex) {
    var sc = ex.scenario || {};
    var long = scenarioLong(sc);
    var paras = (sc.text || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
    var arts = (sc.artefacts || []).map(function (a, i) { return artefactHtml(a, i); }).join('');
    var body = '<div class="scen-body" id="scen-body">' + paras + arts + '</div>';
    var html = '';
    if (S.mode === 'review') {
      html += '<div class="review-banner">⚠ Skipped earlier — you are answering it now from the review screen. The timer is running.</div>';
    }
    html += '<section class="block" aria-label="Scenario">' +
      '<div class="block-h h-scenario"><span class="bico" aria-hidden="true">▤</span> SCENARIO<span class="hspacer"></span>' +
        '<button type="button" class="scen-toggle" id="btn-scen" aria-expanded="' + (!long) + '">' + (long ? 'Show scenario' : 'Hide scenario') + '</button></div>' +
      (long ? '<div class="scen-summary" id="scen-summary">' + esc(sc.summary || '') + ' — collapsed</div>' : '') +
      '<div class="block-b">' + body + '</div>' +
    '</section>';
    html += '<section class="block" aria-label="Question">' +
      '<div class="block-h h-question"><span class="bico" aria-hidden="true">❓</span> QUESTION</div>' +
      '<div class="block-b"><p class="q-text">' + esc(ex.question) + '</p></div>' +
    '</section>';
    html += '<section class="block" aria-label="Your answer">' +
      '<div class="block-h h-answer"><span class="bico" aria-hidden="true">✎</span> YOUR ANSWER</div>' +
      '<div class="block-b">' + widgetHtml(ex) + '</div>' +
    '</section>';
    html += '<div id="fb-slot"></div>';
    html += '<div class="actionbar">' +
      '<button type="button" class="btn btn-primary" id="btn-check">Check answer</button>' +
      '<button type="button" class="btn btn-primary" id="btn-next" style="display:none"></button>' +
      '<span class="note">Check stops the timer so you can read the feedback without pressure.</span>' +
    '</div>';
    return html;
  }
  function widgetHtml(ex) {
    var a = S.answers[ex.id] || (S.answers[ex.id] = {});
    var inner = '';
    if (ex.type === 'single') {
      inner = optsHtml(ex, 'single');
    } else if (ex.type === 'multi') {
      inner = optsHtml(ex, 'multi');
    } else if (ex.type === 'match') {
      var rnd = mulberry32(exSeed(ex, 2));
      var rights = shuffled(ex.pairs.map(function (p) { return p.right; }), rnd);
      inner = '<div class="matchrows">' + ex.pairs.map(function (p, i) {

        return '<div class="matchrow"><span class="match-left">' + esc(p.left) + '</span>' +

      }).join('') + '</div>';
    } else if (ex.type === 'order' || ex.type === 'prioritize') {
      if (!a.arr) {
        var idxs = ex.steps.map(function (_, i) { return i; });
        a.arr = shuffled(idxs, mulberry32(exSeed(ex, 3)));
      }
      var label = ex.type === 'prioritize' ? 'Priority' : 'Step';
      inner = '<ol class="orderlist">' + a.arr.map(function (si, pos) {
        return '<li class="orderitem" data-pos="' + pos + '">' +

            '<button type="button" data-move="up" data-pos="' + pos + '" aria-label="Move up: ' + esc(ex.steps[si]) + '">▲</button>' +
            '<button type="button" data-move="down" data-pos="' + pos + '" aria-label="Move down: ' + esc(ex.steps[si]) + '">▼</button>' +
          '</span></li>';
      }).join('') + '</ol>' +
      '<p class="note">' + label + ' 1 is the first position. Use the arrows to reorder.</p>';
    } else if (ex.type === 'blank') {
      inner = '<p class="blankline">' + ex.blanks.map(function (b, i) {
        var val = a.blanks && a.blanks[i] ? a.blanks[i] : '';
        if (b.choices) {
          return esc(b.before) + '<select class="blank-sel" data-b="' + i + '" aria-label="' + esc(b.hint || 'Blank') + '">' +
            '<option value="">— choose —</option>' +
            b.choices.map(function (c) { return '<option value="' + esc(c) + '"' + (val === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') +
            '</select>' + esc(b.after || '');
        }
        return esc(b.before) + '<input type="text" class="blank-in" data-b="' + i + '" value="' + esc(val) + '" aria-label="' + esc(b.hint || 'Blank') + '" autocomplete="off" spellcheck="false" size="' + Math.max(10, Math.min(40, (b.answer[0] || '').length + 4)) + '">' + esc(b.after || '');
      }).join('') + '</p>';
    } else if (ex.type === 'drag') {
      if (!a.placed) { a.placed = {}; }
      if (!a.bankOrder) { a.bankOrder = shuffled(ex.items.map(function (it) { return it.id; }), mulberry32(exSeed(ex, 4))); }
      var placedIds = Object.keys(a.placed);
      var bankItems = ex.items.filter(function (it) { return placedIds.indexOf(it.id) < 0; });
      var inBank = a.bankOrder.filter(function (iid) { return bankItems.some(function (it) { return it.id === iid; }); });
      inner = '<div class="dnd">' +
        '<div class="bank" id="bank" aria-label="Item bank"><span class="bank-title">Items</span>' +
          inBank.map(function (iid) {
            var it = ex.items.find(function (x) { return x.id === iid; });
            return '<button type="button" class="bankitem" draggable="true" data-iid="' + esc(iid) + '">' + esc(it.text) + '<span class="place-note">Click to select, then click a zone</span></button>';
          }).join('') +
        '</div>' +
        '<div class="zones">' + ex.zones.map(function (z) {
          var inside = ex.items.filter(function (it) { return a.placed[it.id] === z.id; });
          return '<div class="zone" data-zid="' + esc(z.id) + '" tabindex="0" role="button" aria-label="Drop zone: ' + esc(z.label) + '. Select an item, then press Enter to place it.">' +
            '<div class="zone-h">' + esc(z.label) + '</div>' +
            '<div class="zone-items">' + inside.map(function (it) {
              return '<button type="button" class="bankitem" draggable="true" data-iid="' + esc(it.id) + '" data-inzone="' + esc(z.id) + '">' + esc(it.text) + '<span class="place-note">Click to send back to the bank</span></button>';
            }).join('') + '</div></div>';

    } else if (ex.type === 'terminal') {

      var promptTxt = ex.terminal.prompt + ':~$';
      inner = '<div class="shell" role="group" aria-label="Simulated terminal (nothing is executed for real)">' +
        '<div class="shell-head"><span class="dot" aria-hidden="true"></span> simulated shell — offline sandbox, nothing is executed for real</div>' +
        '<div class="shell-out" id="shell-out">' + a.scroll.map(function (ln) { return '<div>' + highlight(ln) + '</div>'; }).join('') + '</div>' +
        '<div class="shell-in"><span class="prompt">' + esc(promptTxt) + '</span>' +
        '<input type="text" class="shell-cmd" id="shell-cmd" aria-label="Type a command and press Enter" autocomplete="off" autocapitalize="off" spellcheck="false"></div></div>' +
        '<div class="shell-note">Type the command and press Enter, then press <strong>Check answer</strong>. Unknown commands are rejected by the sandbox.</div>' +
        (ex.terminal.timeLimit ? '<div class="ex-timer" id="ex-timer">⏱ Exercise timer: <span class="t-clock" id="ex-timer-clock">' + fmtClock(S.exTimer && S.exTimer.exId === ex.id ? S.exTimer.remaining : ex.terminal.timeLimit) + '</span> — this limit applies to this exercise only</div>' : '');
    } else if (ex.type === 'branch') {
      var br = ex.branch;

      if (st < br.steps.length) {

          '<div class="opts" style="margin-top:10px">' + step.options.map(function (o, i) {

      } else {

          '<div class="opts" style="margin-top:10px">' + f.options.map(function (o, i) {
            var isSel = fsel.indexOf(o.id) >= 0;
            return '<button type="button" class="opt" data-foid="' + esc(o.id) + '" role="' + (multi ? 'checkbox' : 'radio') + '" aria-checked="' + (!multi && isSel) + '" aria-pressed="' + (multi && isSel) + '">' +
              '<span class="opt-key">' + String.fromCharCode(65 + i) + '.</span><span class="opt-text">' + esc(o.text) + '</span>' +
              '<span class="opt-mark">' + (isSel ? '● Selected' : '') + '</span></button>';
          }).join('') + '</div>' +
          (multi ? '<p class="note">Select all options that apply.</p>' : '') +
          (a.outcomes && a.outcomes.length ? a.outcomes.map(function (o) { return '<div class="branch-outcome">' + esc(o) + '</div>'; }).join('') : '');

      inner += '<div class="hint-panel" role="note"><div class="hp-h">? Hint — 10% of this exercise credit will be deducted</div>' + esc(ex.hint) + '</div>';
