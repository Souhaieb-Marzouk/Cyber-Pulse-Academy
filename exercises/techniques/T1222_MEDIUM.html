var INTRO = {"learn": "<p><b>Picture your next shift.</b> You are past the basics: you know that T1222 is the ATT&amp;CK technique for attackers <b>changing file and folder permissions</b> to hide, to lock defenders out, or to prepare the next step. Now the alerts arrive — each one with a command line, an account, and a time. Is it the backup service doing its job, or the attacker locking the backdoor they just planted?</p><p><b>This exam trains the next level.</b> Every exercise combines <b>two</b> connected ideas: recognise the command <i>and</i> judge its effect; map the behaviour to the right sub-technique <i>and</i> the right data source; name the real threat group <i>and</i> the procedure they used. You will meet documented cases — WannaCry hiding files with <span class='mono'>attrib +h</span>, Wizard Spider using <span class='mono'>icacls</span> on backup servers, APT32 setting <span class='mono'>chmod 755</span> on a macOS payload, APT38 running <span class='mono'>chmod 777</span>, TeamTNT locking binaries with <span class='mono'>chattr</span>.</p><p><b>Where you will use this at work:</b> triaging SOC alerts on icacls/chmod/chattr; writing the detection rules that watch these commands; choosing between the two T1222 mitigations (M1022 tight permissions, M1026 fewer privileged accounts) when the hardening ticket lands on your desk; giving the incident responder the context they need at 3 a.m.; and red teamers rehearsing exactly these commands in a lab before an engagement.</p>", "keywords": [{"theme": "Commands and their real effects", "items": ["icacls /grant /deny /reset and takeown on Windows", "chmod modes (600, 755, 777), chattr +i, chown on Linux and macOS", "Why a Deny ACE wins over an Allow", "Place, hide, lock: the attacker's staging pattern"]}, {"theme": "From command to ATT&CK mapping", "items": ["T1222.001 vs T1222.002 by platform and tool", "Data sources: Command Execution, File Metadata, Process Creation", "Real procedures: WannaCry, Wizard Spider, APT32, APT38, TeamTNT, Rocke", "Why attribution needs more than one command"]}, {"theme": "Detection engineering for T1222", "items": ["Writing a SIEM rule for icacls command lines", "Baselining: which chmod/icacls runs are normal", "Windows Event 4670 (DACL change) and Sysmon process events", "auditd on Linux for chmod/chattr"]}, {"theme": "Mitigations in practice", "items": ["M1022 — Restrict File and Directory Permissions", "M1026 — Privileged Account Management", "Preventive vs detective controls", "Why ransomware resets ACLs before encrypting"]}], "how": "<ul class='howlist'><li><b>Goal:</b> score at least <b>70%</b> to pass. 16 exercises, each combining two ideas.</li><li><b>Exercise types:</b> single-choice, multi-select (partial credit), matching, drag &amp; drop, fill-in-the-blank, ordering, a 3-step branching triage, and two fake-terminal exercises where you type real commands.</li><li><b>Timer:</b> a 50:00 countdown. <b class='pz'>&#9208; Pause</b> hides the exercise for a real break. Pressing <b>Check</b> stops the clock automatically (<b class='pz'>&#9208; PAUSED — reviewing feedback</b>) until you press <b>Next</b> — unlimited thinking time on every explanation.</li><li><b>Partial credit:</b> multi-item exercises score <span class='ok'>(H &minus; W) &divide; N</span>. A wrong pick cancels a right one. In the branching triage each of the 3 steps is one item.</li><li><b>Hints and skipping:</b> one hint per exercise costs 10% of that exercise's credit; <b class='sk'>&#9888; Skip</b> parks an exercise for the end-of-exam review screen. Never-answered skipped exercises are excluded from the score entirely.</li><li><b>Terminals:</b> the shell is simulated — nothing real runs. It grades the elements of your command (tool, flag, target) with partial credit.</li></ul>"};
var EXERCISES = [{"id": "m01", "type": "qcm", "reviewLabel": "What did the icacls /grant achieve?", "scenario": "<p><b>Alert #40117</b> — 02:14 UTC, host WEB-04 (Windows Server, IIS).</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — EDR process event</span><div class='artbody'>Event: ProcessCreate\nParent: w3wp.exe (IIS app pool)\nImage:   icacls.exe\nCmdline: icacls C:\\Users\\Public\\update.exe /grant Everyone:F /T\nUser:    IIS APPPOOL\\defaultapppool</div></div><p>The alert auto-closed as &ldquo;unknown&rdquo;. You are picking it up for triage.</p>", "scenarioShort": "Alert #40117 — icacls /grant Everyone:F on WEB-04", "question": "What did this command actually achieve for the attacker?", "hint": "Everyone:F /T means full control, applied down the whole folder tree.", "explain": "<p><span class='mono'>/grant Everyone:F /T</span> gives <b>full control to every user</b>, recursively — so any process or account on the box can now modify and run update.exe. An IIS app-pool identity writing payloads into Public and then widening rights is the classic web-attack staging pattern. Ryuk used the same <span class='mono'>/grant Everyone:F /T</span> switch combination to strip access restrictions at scale. The command neither encrypts nor deletes — it <i>opens</i> doors.</p>", "study": "the icacls switch grammar: /grant, :F (full control), /T (recursive), and Ryuk's documented use of it.", "data": {"options": [{"t": "Every account on the host can now modify and run update.exe", "correct": true, "why": "Everyone:F grants full control to all users; /T applies it to the folder tree."}, {"t": "The file was encrypted with a new key", "why": "icacls never encrypts — it only edits the permissions list."}, {"t": "All existing ACL entries were wiped and inherited", "why": "That would be /reset — /grant adds an entry."}, {"t": "A scheduled task was registered to run update.exe", "why": "Registering a task is schtasks — a different technique entirely."}]}}, {"id": "m02", "type": "terminal", "reviewLabel": "Terminal: make the payload executable", "scenario": "<p>Red-team lab, Linux host <b>lab-web-01</b> (simulated). A payload was just downloaded to <b>payload.sh</b> but it is not executable yet, so running it fails with &ldquo;Permission denied&rdquo;. Real attackers do this constantly — KV Botnet activity altered permissions on downloaded tools for exactly this reason, and OSX/Shlayer used <span class='mono'>chmod +x</span>.</p><div class='artefact'><span class='artlabel'>Current state</span><div class='artbody'>$ ls -l payload.sh\n-rw-r--r-- 1 analyst analyst 512 Mar 3 09:12 payload.sh   <- no execute bit</div></div>", "scenarioShort": "Lab: chmod to make payload.sh runnable", "question": "Type the command that makes <b>payload.sh</b> executable for its owner, then Run and Check.", "hint": "chmod needs the tool, the change (+x adds execute), and the file name.", "explain": "<p><span class='mono'>chmod +x payload.sh</span> — the tool (<b>chmod</b>), the change (<b>+x</b> adds the execute bit for owner, group and others), and the target file. This is one of the most common attacker steps on Linux/macOS: a downloaded file is useless until it is executable. Blue side: watch for <span class='mono'>chmod</span> with <span class='mono'>+x</span>, <span class='mono'>755</span> or <span class='mono'>777</span> right after a download event — APT32 (755 on macOS), Bundlore (<span class='mono'>chmod -R 755</span>) and XCSSET (<span class='mono'>chmod +x</span>) all did this.</p>", "study": "chmod symbolic modes (+x, a+x) and octal modes (755, 777) on the T1222.002 page.", "data": {"title": "simulated bash shell — lab only, nothing real is touched", "banner": ["Linux lab-web-01 5.15.0-generic", "analyst@lab-web-01:~$ (training sandbox)", ""], "prompt": "analyst@lab-web-01:~$", "okRe": "^chmod", "notFound": "-bash: syntax error near unexpected token — try: chmod <mode> <file>", "output": ["(no output — chmod is silent on success)", "$ ls -l payload.sh", "-rwxr--r-- 1 analyst analyst 512 Mar 3 09:12 payload.sh   <- execute bit set"], "dangerRe": "chmod\\s+-r|rm |chown ", "dangerOut": ["[!] That removes rights recursively or changes ownership — not the task."], "required": [{"re": "^chmod", "label": "the chmod tool", "why": "chmod changes file modes on Unix systems.", "match": "chmod +x payload.sh"}, {"re": "\\+x|a\\+x|u\\+x|755|775|777", "label": "an execute-adding mode (+x)", "why": "The execute bit must be added.", "match": "chmod +x"}, {"re": "payload\\.sh", "label": "the target payload.sh", "why": "The command must name the payload file.", "match": "chmod +x payload.sh"}], "canonical": "chmod +x payload.sh"}}, {"id": "m03", "type": "multi", "reviewLabel": "Effects of an explicit Deny ACE", "scenario": "<p>You are explaining Windows ACLs to a new joiner using this real line from an incident: <span class='mono'>icacls C:\\Data\\Finance /deny Everyone:(F)</span> — run by the attacker after planting a staging folder. What does an explicit Deny actually do?</p>", "scenarioShort": "What does icacls /deny Everyone:(F) do?", "question": "Select <b>all</b> statements that are true about this command's effect.", "hint": "Deny entries are evaluated with priority. And think about what Deny does NOT do.", "explain": "<p>Windows evaluates a DACL so that an explicit <b>Deny</b> entry wins over Allow entries for that access. After <span class='mono'>/deny Everyone:(F)</span>, normal users can no longer open items in the folder — including admins who only have Allow rights. This is how attackers wall off their staging areas. It does <b>not</b> encrypt anything and does <b>not</b> delete the folder — the data is all still there, just unreachable. Grandoreiro went further and modified a binary's ACL so security tools could not run it.</p>", "study": "DACL evaluation order: explicit deny beats allow; /deny vs /remove vs /reset.", "data": {"options": [{"t": "Normal users can no longer open items inside that folder", "correct": true, "why": "The Deny entry blocks access checks for Everyone."}, {"t": "Deny entries usually win over Allow entries in Windows ACL checks", "correct": true, "why": "An explicit deny is evaluated first and stops the access."}, {"t": "The files inside are now encrypted", "why": "Deny only blocks access — the content is unchanged."}, {"t": "The folder was deleted and recreated empty", "why": "Nothing was deleted — the folder and its files still exist."}]}}, {"id": "m04", "type": "match", "reviewLabel": "Match four commands to their effects", "scenario": "<p>Your mentor's flash-card deck, round two. These four commands appeared across last quarter's incidents. Match each to its effect — all four are T1222 behaviour, on both platforms.</p>", "scenarioShort": "Command → effect matching drill", "question": "For each command, choose the effect it produces.", "hint": "+s is &ldquo;system&rdquo;, 600 is owner-only, /f takes ownership, +i freezes the file.", "explain": "<p><span class='mono'>attrib +s +h</span> marks a file <b>system and hidden</b> — doubly invisible in normal views. <span class='mono'>chattr +i</span> freezes a Linux file: not even root can modify it until <span class='mono'>-i</span> removes the flag (TeamTNT locked binaries this way). <span class='mono'>chmod 600</span> leaves read/write to the owner only. <span class='mono'>takeown /f</span> takes ownership — the prerequisite for editing a file's ACL afterwards.</p>", "study": "attrib flags, chattr +i, chmod octal values, takeown /f — one line each in your notes.", "data": {"left": [{"t": "attrib +s +h payload.dll", "r": 0, "why": "System + hidden: the file vanishes from normal listings."}, {"t": "chattr +i /etc/crontab", "r": 1, "why": "The immutable flag freezes the file against any change."}, {"t": "chmod 600 id_rsa", "r": 2, "why": "600 = owner reads/writes, everyone else gets nothing."}, {"t": "takeown /f C:\\Locked\\report.docx", "r": 3, "why": "Makes the current user the file owner."}], "right": ["Marks the file system + hidden", "Freezes the file (immutable, even for root)", "Leaves read/write to the owner only", "Makes the current user the owner"]}}, {"id": "m05", "type": "order", "reviewLabel": "Order the SOC response to a mass chmod alert", "scenario": "<p>03:11 — SIEM alert: <span class='mono'>chmod -R 777 /var/www</span> on PROD-WEB-02, account www-data. Your lead says: &ldquo;walk me through your response order&rdquo;. Evidence first, action later — the standard rhythm.</p>", "scenarioShort": "Order: triage steps for mass chmod 777", "question": "Click the four response steps in the correct order.", "hint": "You must know what ran and what it touched before you can compare with normal activity or fix anything.", "explain": "<p>1) <b>Confirm the command and account</b> — pull the full process event so you know exactly what ran. 2) <b>List the touched files</b> — the -R flag means everything under /var/www changed mode. 3) <b>Compare with normal activity</b> — does a deployment window or CI job explain it? www-data running wide-open chmod at 03:11 usually does not. 4) <b>Restore and report</b> — fix modes (755/644), check for planted webshells, and write it up. Acting before scoping risks destroying evidence you will want later.</p>", "study": "the classic triage rhythm: confirm, scope, baseline, act — applied to T1222 alerts.", "data": {"items": [{"t": "Confirm the full command and the account that ran it", "why": "The process event is your anchor — command line, parent, user."}, {"t": "List every file and folder the chmod touched", "why": "-R means recursive: you need the true scope before judging."}, {"t": "Compare the run against normal admin or deployment activity", "why": "Baseline check separates the CI job from the attacker."}, {"t": "Restore correct modes and report the finding", "why": "Only after scoping: fix modes, hunt for webshells, document."}]}}, {"id": "m06", "type": "fill", "reviewLabel": "Complete the SIEM rule for icacls", "scenario": "<p>Detection engineering ticket DE-221: &ldquo;Build a first rule for icacls grants targeting writable temp directories.&rdquo; Complete the Splunk-style pseudo-query with the two key fragments.</p><div class='artefact'><span class='artlabel'>Rule skeleton (Sysmon process events)</span><div class='artbody'>index=sysmon EventCode=1 process_name=icacls.exe\nAND CommandLine LIKE {{0}}\nAND CommandLine LIKE {{1}}</div></div>", "scenarioShort": "Fill the two CommandLine fragments", "question": "Pick the correct fragment for each blank.", "hint": "Blank 0 must match the /grant switch; blank 1 must match the writable temp path the rule targets.", "explain": "<p><b>%/grant%</b> catches any grant action ( Everyone:F, Users:M &hellip;), and <b>%C:\\Windows\\Temp%</b> narrows to the temp staging directory from the ticket. /deny would catch a different (also interesting) behaviour, D:\\Backup is out of scope here, and netstat/-an have nothing to do with icacls. This rule mirrors the first stage of the ATT&amp;CK detection strategy for T1222: process creation of permission tools, correlated with context.</p>", "study": "the T1222 detection strategy (DET0299): permission-tool process events + context correlation.", "data": {"template": "index=sysmon EventCode=1 process_name=icacls.exe\nAND CommandLine LIKE {{0}}\nAND CommandLine LIKE {{1}}", "blanks": [{"correct": "%/grant%", "why": "The rule watches for grant actions by icacls."}, {"correct": "%C:\\Windows\\Temp%", "why": "The ticket scopes the rule to the Windows temp staging directory."}], "bank": ["%/grant%", "%/deny%", "%C:\\Windows\\Temp%", "%D:\\Backup%", "netstat", "-an"]}}, {"id": "m07", "type": "qcm", "reviewLabel": "Why is chattr +i on /etc/passwd alarming?", "scenario": "<p>EDR flags: <span class='mono'>chattr +i /etc/passwd</span>, user root, host APP-07, 03:44. No change window. The trainee asks: &ldquo;it's just a file flag — why does the playbook say P2?&rdquo;</p>", "scenarioShort": "Why is chattr +i on /etc/passwd an incident?", "question": "What is the main reason this is alarming?", "hint": "Think about what /etc/passwd is used for on a Linux host — and what the flag prevents.", "explain": "<p><b>/etc/passwd</b> defines local accounts; /etc/shadow holds their password hashes. Making it <b>immutable</b> means defenders cannot correct, revert, or clean it while the flag stands — an attacker who added a rogue root line (or is about to) has frozen the file against you. Removing the flag needs <span class='mono'>chattr -i</span> with root — extra friction during response. Rocke did exactly this class of trick: changing permissions so security files could not be modified. The flag itself is not evil — <i>where</i> and <i>when</i> it lands is the story.</p>", "study": "the immutable flag's effect on incident cleanup, and Rocke's documented use of un-modifiable permissions.", "data": {"options": [{"t": "It freezes a critical account file so defenders cannot fix or revert it", "correct": true, "why": "Immutable +i blocks any edit to /etc/passwd while the flag stands."}, {"t": "It speeds up login on the host", "why": "File flags have nothing to do with login speed."}, {"t": "It encrypts the password hashes", "why": "chattr changes no content at all."}, {"t": "It is a routine cron job on every Linux host", "why": "Nothing runs chattr on /etc/passwd routinely — that is the point."}]}}, {"id": "m08", "type": "match", "reviewLabel": "Match each group to its documented T1222 procedure", "scenario": "<p>CTI hand-over notes: four threat actors, four documented T1222 behaviours from their ATT&amp;CK pages. Connect them — this is the knowledge that turns a bare command line into an attribution lead.</p>", "scenarioShort": "Group → documented procedure", "question": "For each actor, choose the procedure documented for them.", "hint": "One is macOS (755), one is wide-open 777, one hit backup servers with icacls, one used batch + cacls.", "explain": "<p><b>APT32</b>'s macOS backdoor set permission <b>755</b> on the file it wanted to execute. <b>APT38</b> changed file and directory permissions with <b>chmod 777</b>. <b>Wizard Spider</b> used <b>icacls</b> to give themselves full control of system folders on <b>backup servers</b> before encryption. <b>Storm-1811</b> ran <b>cacls.exe</b> from batch scripts to modify permissions across victim environments. Same technique, four fingerprints.</p>", "study": "the Procedure Examples tables on T1222.001 and T1222.002.", "data": {"left": [{"t": "APT32 (G0050)", "r": 0, "why": "Documented: its macOS backdoor sets permission 755 on the file it executes."}, {"t": "APT38 (G0082)", "r": 1, "why": "Documented: changed file and directory permissions using chmod 777."}, {"t": "Wizard Spider (G0102)", "r": 2, "why": "Documented: icacls to take full control of system folders on backup servers."}, {"t": "Storm-1811 (G1046)", "r": 3, "why": "Documented: cacls.exe via batch script to modify permissions."}], "right": ["Set permission 755 on its macOS payload", "Ran chmod 777 to change file and directory permissions", "Used icacls for full control of backup-server system folders", "Ran cacls.exe from batch scripts"]}}, {"id": "m09", "type": "multi", "reviewLabel": "Who can change permissions on Windows files?", "scenario": "<p>Hardening review: the GRC analyst asks which statements about <b>permission</b> to change Windows file permissions are correct, so the access model can be fixed.</p>", "scenarioShort": "Windows: who can edit ACLs?", "question": "Select <b>all</b> correct statements.", "hint": "Owners and admins hold the power; M1026 is about shrinking that set.", "explain": "<p><b>Owners</b> of a file and <b>administrators</b> can change its ACL — that is why takeown (become owner) is the first step of so many attacks. A normal user can still change permissions on files they own, like their own profile files. M1026 (<b>Privileged Account Management</b>) reduces the number of accounts with that power, and M1022 sets restrictive defaults so even a successful attacker finds little to widen. &ldquo;Any user can change any ACL&rdquo; is precisely the misconfiguration M1022 fixes.</p>", "study": "ownership vs administrator rights on Windows, and how M1022/M1026 shrink the attack surface.", "data": {"options": [{"t": "The file's owner can change its permissions", "correct": true, "why": "Ownership carries the right to edit the ACL — takeown abuses this."}, {"t": "Administrators can change permissions on other users' files", "correct": true, "why": "Admin rights override normal ownership limits."}, {"t": "M1026 (Privileged Account Management) limits who holds this power", "correct": true, "why": "Fewer privileged accounts = fewer ways to change ACLs."}, {"t": "Any user can always change any file's ACL", "why": "That is exactly the over-permissive state M1022 warns against."}]}}, {"id": "m10", "type": "qcm", "reviewLabel": "Pick the attacker's tool pair", "scenario": "<p>Threat-hunt hypothesis writing. An attacker on a Linux host wants a planted file to be <b>executable</b> right now and <b>impossible to delete or alter</b> later. Which command pair fits both goals?</p>", "scenarioShort": "Executable now, undeletable later", "question": "Which pair of commands matches both goals?", "hint": "One command adds execute rights; the other freezes the file against everyone.", "explain": "<p><span class='mono'>chmod 755</span> makes the file executable (owner full, group/others read+execute) — exactly what payloads need (APT32 used 755; Shlayer and XCSSET used +x). <span class='mono'>chattr +i</span> then freezes it: no modification, no deletion, not even by root, until the flag is lifted. The other pairs either remove rights (000), unfreeze (-i), use Windows tools on Linux, or leave the file non-executable.</p>", "study": "chmod 755 vs 600 vs 000, and chattr +i vs -i — which direction each one moves.", "data": {"options": [{"t": "chmod 755 planted.sh, then chattr +i planted.sh", "correct": true, "why": "755 = executable; +i = immutable against everyone."}, {"t": "chmod 000 planted.sh, then chattr -i planted.sh", "why": "000 removes execute; -i removes a lock instead of adding one."}, {"t": "attrib +h planted.sh, then icacls /grant planted.sh", "why": "Both are Windows tools — they do not exist on Linux."}, {"t": "chmod 600 planted.sh, then chmod 444 planted.sh", "why": "Neither adds execute — the payload still cannot run."}]}}, {"id": "m11", "type": "branch", "reviewLabel": "Branching triage: icacls /grant at 02:14", "scenario": "<p><b>Alert #40233</b> — FILE-SRV-11 (Windows file server).</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — EDR process event</span><div class='artbody'>Image:   icacls.exe\nCmdline: icacls D:\\Shares\\Finance /grant Everyone:F /T\nUser:    IIS APPPOOL\\defaultapppool\nTime:    02:14 UTC (no change window)</div></div><p>A file-server share touched by an IIS app-pool identity at 02:14. Work the triage one decision at a time.</p>", "scenarioShort": "3-step triage of a /grant on a file share", "question": "Decision by decision — pick the best action at each step.", "hint": "The account is the loudest clue: what should an IIS app pool never be doing?", "explain": "<p><b>Step 1:</b> always identify the account first — an IIS app-pool identity touching a file share is already wrong. <b>Step 2:</b> with no change window, correlate before deciding: what else did that identity do, and when did the host last see web attacks? A grant like this is often the follow-up to a webshell (the Wizard Spider and Ryuk pattern of opening paths). <b>Step 3:</b> escalate to IR with the evidence intact — do not reset the ACLs yet (you would destroy the DACL evidence) and do not close it as a false positive without the correlation.</p>", "study": "correlation of T1222 events with account context and preceding web attacks (DET0299's behavioural chain).", "data": {"steps": [{"q": "Step 1 — the very first thing you check is:", "options": [{"t": "Which account ran icacls and what that account normally does", "correct": true, "why": "Account context decides everything that follows — an app pool has no business here."}, {"t": "Restart the file server to clear the alert", "why": "Restarts destroy volatile evidence and fix nothing."}, {"t": "Delete the Finance share", "why": "Deleting business data on an unverified alert is harmful."}, {"t": "Reply to the alert email asking if someone did it on purpose", "why": "Too slow and unverifiable at 02:14 — check facts first."}]}, {"q": "Step 2 — the account is an IIS app-pool identity, no change window. Next:", "options": [{"t": "Correlate other events from that host and identity around the same time", "correct": true, "why": "Look for the webshell that preceded it, other permission edits, staged payloads."}, {"t": "Close the alert as a scheduled admin task", "why": "There is no window and no ticket — closing hides an attack."}, {"t": "Reimage FILE-SRV-11 immediately", "why": "Reimaging before scoping loses the intrusion story and other affected hosts."}, {"t": "Email all staff asking about Finance permissions", "why": "Alerts the attacker and drowns the team in replies."}]}, {"q": "Step 3 — correlation shows a new webshell in Inetpub an hour earlier. Your verdict:", "options": [{"t": "Escalate to IR with all evidence preserved, including the changed DACLs", "correct": true, "why": "The grant is part of a chain — IR needs the timeline, the webshell, and the ACL state."}, {"t": "Reset all ACLs on the share and close the ticket", "why": "Resetting destroys the DACL evidence of what the attacker changed."}, {"t": "Keep monitoring quietly for a week", "why": "With webshell + staging confirmed, waiting lets the attacker advance."}, {"t": "Delete the webshell only", "why": "The attacker will re-plant it — the scope is wider than one file."}]}]}}, {"id": "m12", "type": "fill", "reviewLabel": "Complete the threat-intel report line", "scenario": "<p>Your CTI report on a Windows intrusion has one line left to fill. The adversary hid its backdoor and took ownership of a locked file before changing its permissions.</p><div class='artefact'><span class='artlabel'>Report draft (T1222 section)</span><div class='artbody'>The adversary used '{{0}}' to hide the backdoor binary,\nand '{{1}}' to take ownership of the locked staging file.</div></div>", "scenarioShort": "Fill the two tool names", "question": "Pick the correct tool for each blank.", "hint": "One sets a flag that hides; the other changes the owner — both documented in real Windows incidents.", "explain": "<p><b>attrib +h</b> hides the binary from normal views — WannaCry used it on its own files. <b>takeown</b> (BitPaymer: <span class='mono'>takeown /F</span>; WastedLocker: <span class='mono'>takeown.exe /F filepath</span>) makes the attacker the owner so a following icacls can reset or widen the rights. <span class='mono'>icacls /save</span> is a <i>defender</i> evidence command, chflags is macOS, and vssadmin deletes shadow copies — a different technique.</p>", "study": "WannaCry's attrib usage and the BitPaymer/WastedLocker takeown procedures.", "data": {"template": "The adversary used '{{0}}' to hide the backdoor binary,\nand '{{1}}' to take ownership of the locked staging file.", "blanks": [{"correct": "attrib +h", "why": "attrib +h sets the hidden attribute — the documented hiding step."}, {"correct": "takeown", "why": "takeown makes the attacker the file owner."}], "bank": ["attrib +h", "takeown", "icacls /save", "chflags", "net use", "vssadmin"]}}, {"id": "m13", "type": "qcm", "reviewLabel": "Which chmod pattern is most suspicious?", "scenario": "<p>Your SIEM fires four chmod alerts a day. The detection engineer asks you to rank judgement: which of these patterns deserves an incident, not a ticket closure?</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — candidate patterns</span><div class='artbody'>A) chmod 755 /opt/app/start.sh      — deploy account, 10:02, deploy window\nB) chmod +x /home/alice/notes.sh    — user alice, 14:31, her own file\nC) chmod -R 777 /var/www            — www-data, 03:11, no window\nD) chmod 600 /home/alice/.ssh/id_rsa — user alice, 14:32, normal ssh hygiene</div></div>", "scenarioShort": "Rank the chmod patterns", "question": "Which pattern most deserves an incident response?", "hint": "Two axes at once: who is running it, and how wide is the blast radius.", "explain": "<p><b>C</b> stacks three red flags: the <b>www-data</b> service account (which should not need 777 on its own webroot), a <b>-R recursive</b> blast radius, and <b>03:11 with no change window</b>. 777 on a web root also means any compromised process can write a webshell. A and D are routine hygiene in their contexts, and B is a user on their own file. Wide scope + odd account + odd time is the T1222 triage triangle.</p>", "study": "baselining legitimate chmod use vs the recursive-wide-open pattern attackers favour.", "data": {"options": [{"t": "C — recursive 777 on the web root by www-data at 03:11", "correct": true, "why": "Wrong account, huge scope, no window — the classic attack pattern."}, {"t": "A — deploy account setting 755 in a deploy window", "why": "Normal deployment behaviour with a ticketed window."}, {"t": "B — a user making their own script executable", "why": "Ordinary user activity on their own file."}, {"t": "D — a user tightening their own SSH key to 600", "why": "That is good security hygiene, not an attack."}]}}, {"id": "m14", "type": "terminal", "reviewLabel": "Terminal: freeze a planted cron file", "scenario": "<p>Red-team lab, Linux host <b>lab-app-03</b> (simulated), root shell. The planted persistence file <b>/etc/cron.d/sync-upd</b> is in place; now the &ldquo;attacker&rdquo; wants it frozen so an admin cannot simply delete it. This pairs a Persistence step with a T1222 lock — and gives you the blue-side hunt too.</p><div class='artefact'><span class='artlabel'>Current state</span><div class='artbody'># ls -l /etc/cron.d/sync-upd\n-rw-r--r-- 1 root root 96 Mar 3 09:12 /etc/cron.d/sync-upd\n# lsattr /etc/cron.d/sync-upd\n--------------e------- /etc/cron.d/sync-upd</div></div>", "scenarioShort": "Lab: chattr +i the cron persistence file", "question": "Type the command that makes <b>/etc/cron.d/sync-upd</b> immutable, then Run and Check.", "hint": "The tool is chattr and the flag you want is the immutable one, written +i.", "explain": "<p><span class='mono'>chattr +i /etc/cron.d/sync-upd</span> — the tool (<b>chattr</b>), the change (<b>+i</b> sets the immutable flag), the target. Now even root gets &ldquo;Operation not permitted&rdquo; trying to delete it until <span class='mono'>chattr -i</span> runs first. TeamTNT used chattr to lock binaries in cloud intrusions. <span class='bv'>Blue view:</span> hunt for chattr runs on files under /etc, /usr and /var/spool/cron — legitimate software almost never freezes cron or system files, so any hit is worth a look.</p>", "study": "lsattr/chattr workflow and hunting immutable flags on system paths.", "data": {"title": "simulated root shell — lab only, nothing real is touched", "banner": ["root@lab-app-03:~#", "training sandbox — commands are simulated", ""], "prompt": "root@lab-app-03:~#", "okRe": "^chattr", "notFound": "-bash: syntax error near unexpected token — try: chattr +i <file>", "output": ["(no output — chattr is silent on success)", "# lsattr /etc/cron.d/sync-upd", "----i---------e------- /etc/cron.d/sync-upd   <- immutable flag set"], "dangerRe": "chattr\\s+-i|rm |chmod\\s+-r", "dangerOut": ["[!] That removes flags or deletes files — the opposite of the task."], "required": [{"re": "^chattr", "label": "the chattr tool", "why": "chattr changes Linux file attributes.", "match": "chattr +i /etc/cron.d/sync-upd"}, {"re": "\\+i", "label": "the +i (immutable) flag", "why": "+i freezes the file against every change.", "match": "chattr +i"}, {"re": "/etc/cron\\.d/sync-upd", "label": "the target file", "why": "The command must name the cron file.", "match": "chattr +i /etc/cron.d/sync-upd"}], "canonical": "chattr +i /etc/cron.d/sync-upd"}}, {"id": "m15", "type": "multi", "reviewLabel": "Why T1222 matters before ransomware", "scenario": "<p>Breakfast briefing slide: &ldquo;Why do we alert on permission changes at all?&rdquo; Pick the true statements about T1222's role in ransomware operations.</p>", "scenarioShort": "T1222 and ransomware preparation", "question": "Select <b>all</b> true statements.", "hint": "Ryuk and The Gentlemen ransomware both touched permissions <i>before</i> encrypting.", "explain": "<p>Ransomware needs <b>write access everywhere</b>. Ryuk ran <span class='mono'>icacls &lt;path&gt; /grant Everyone:F /T /C /Q</span> to strip access restrictions before encryption; The Gentlemen ransomware used takeown, icacls and attrib to secure unrestricted write access first; BlackByte granted Everyone full control of the drive root. Permission changes on shares and backup folders are therefore an <b>early warning</b>, not the encryption itself — and they happen on Windows file servers, not only on Linux. chmod never encrypts anything.</p>", "study": "the Ryuk, BlackByte and The Gentlemen rows in the T1222.001 procedure table.", "data": {"options": [{"t": "Attackers widen rights (icacls /grant) to unlock write access before encrypting", "correct": true, "why": "Ryuk's documented /grant Everyone:F /T pattern."}, {"t": "Permission changes on backup folders often happen before encryption", "correct": true, "why": "Backup folders must be unlocked for the ransomware to finish the job — an early warning."}, {"t": "The permission change IS the encryption step", "why": "Encryption is a separate operation — chmod/icacls only prepare it."}, {"t": "This only affects Linux servers", "why": "The documented ransomware procedures are largely Windows (icacls, takeown, attrib)."}]}}, {"id": "m16", "type": "drag", "reviewLabel": "Sort controls into preventive and detective", "scenario": "<p>Hardening project H-77 needs its control list sorted: which T1222 controls <b>stop</b> the behaviour, and which ones <b>show</b> it to you? Drag each control to its class.</p>", "scenarioShort": "Controls: preventive vs detective", "question": "Drag each control onto the right class.", "hint": "Preventive = the attack still fails. Detective = you see it in a log or alert.", "explain": "<p><b>Preventive:</b> M1022 (tight default ACLs leave nothing to widen) and M1026 (fewer privileged accounts can change permissions at all). <b>Detective:</b> command-line logging of icacls/chmod/chattr runs, and DACL-change auditing (Windows Security Event 4670) — both feed the DET0299 detection strategy for T1222. Real programmes need both: prevention slows the attacker down, detection tells you they came.</p>", "study": "M1022 and M1026 on the T1222 page, plus the DET0299 detection strategy.", "data": {"slots": [{"id": "prev", "label": "Preventive — stops the change"}, {"id": "det", "label": "Detective — shows the change"}], "items": [{"id": "c1", "t": "M1022 — tight file and folder permissions"}, {"id": "c2", "t": "M1026 — fewer privileged accounts"}, {"id": "c3", "t": "Log command lines of icacls / chmod / chattr"}, {"id": "c4", "t": "Audit DACL changes (Windows Event 4670)"}], "correct": {"c1": "prev", "c2": "prev", "c3": "det", "c4": "det"}, "why": {"c1": "Restrictive permissions leave the attacker nothing to widen — prevention.", "c2": "Fewer privileged accounts means fewer permission changes possible — prevention.", "c3": "Watching command lines surfaces the attack as it happens — detection.", "c4": "Event 4670 records every DACL edit — detection."}}}];
/* ============ T1222 exam engine — vanilla JS, self-contained ============ */
(function(){
'use strict';
/* ---------- tiny dom helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pad(n){return (n<10?'0':'')+n;}
function mmss(s){s=Math.max(0,s|0);return pad(Math.floor(s/60))+':'+pad(s%60);}
function score(H,W,N){return Math.max(0,(H-W)/N);}
function lockArea(root){var ns=root.querySelectorAll('button,select,input');for(var i=0;i<ns.length;i++){ns[i].disabled=true;}var os=root.querySelectorAll('.opt,.chipitem');for(var k=0;k<os.length;k++){os[k].classList.add('lock');}}

/* ---------- global state ---------- */
var S={};
function freshState(){
  return {phase:'intro',order:[],pos:0,seen:0,cur:null,curEx:null,rec:{},skipped:[],creditSum:0,answered:0,
    tState:'IDLE',remaining:0,tickId:null,manualTotal:0,autoTotal:0,stateSince:0,beforeManual:null,
    fromReview:false,reported:false,user:null,country:null,locale:null,perLimit:0,perLeft:0,checked:false,stepIdx:0,stepAns:null,picked:null,
    stageMode:'intro',pausedStage:null,lastResult:null};
}
/* ---------- timer state machine: RUNNING / PAUSED_MANUAL / PAUSED_AUTO_CHECK / ENDED ---------- */
function tSetState(st){
  var now=Date.now();
  if(S.tState==='PAUSED_MANUAL'){S.manualTotal+=Math.round((now-S.stateSince)/1000);}
  if(S.tState==='PAUSED_AUTO_CHECK'){S.autoTotal+=Math.round((now-S.stateSince)/1000);}
  S.tState=st;S.stateSince=now;updateHeader();
}
function tStart(){if(S.tickId)clearInterval(S.tickId);S.tickId=setInterval(tick,1000);}
function tick(){
  if(S.tState!=='RUNNING')return;
  S.remaining--;
  if(S.perLimit>0&&S.perLeft>0){S.perLeft--;var pl=$('#perclock');if(pl)pl.textContent=mmss(S.perLeft);
    if(S.perLeft<=0){doCheck(true);return;}}
  if(S.remaining<=0){S.remaining=0;updateHeader();timeUp();return;}
  updateHeader();
}
function timeUp(){tSetState('ENDED');if(S.tickId){clearInterval(S.tickId);S.tickId=null;}showResults();}
/* ---------- header ---------- */
function stateChip(){
  if(S.tState==='RUNNING')return '<span class="badge st-run" aria-label="Timer running">&#9654; RUNNING</span>';
  if(S.tState==='PAUSED_MANUAL')return '<span class="badge st-paused" aria-label="Timer paused manually">&#9208; PAUSED &mdash; manual (press Resume)</span>';
  if(S.tState==='PAUSED_AUTO_CHECK')return '<span class="badge st-paused" aria-label="Timer paused for feedback review">&#9208; PAUSED &mdash; reviewing feedback (resumes on Next)</span>';
  return '<span class="badge st-ended" aria-label="Timer ended">&#9209; ENDED</span>';
}
function updateHeader(){
  var t=$('#tval');if(t)t.textContent=mmss(S.remaining);
  var st=$('#tstate');if(st)st.innerHTML=stateChip();
  var sc=$('#scoreval');if(sc){var pct=S.answered>0?Math.round(S.creditSum/S.answered*100):0;
    sc.innerHTML='<b>'+S.creditSum.toFixed(1)+' / '+S.answered+'</b>&nbsp;('+pct+'%)';}
  var cnt=$('#counter');if(cnt){
    if(S.phase==='exam')cnt.textContent='Exercise '+S.seen+' of '+META.questionCount;
    else if(S.phase==='review')cnt.textContent='Review skipped — '+S.skipped.length+' left';
    else cnt.textContent=META.questionCount+' exercises';}
  var pb=$('#pbar');if(pb){var done=S.answered+S.skipped.length;var pct2=Math.min(100,Math.round(done/META.questionCount*100));
    pb.style.width=pct2+'%';pb.classList.add('sheen');}
}
function buildTopbar(){
  var tb=el('div','topbar');
  tb.innerHTML='<span class="tb-title">'+esc(META.objId)+' &middot; '+esc(META.objName)+'</span>'+
    '<span class="badge '+META.sevClass+'" aria-label="Severity '+esc(META.sevWord)+'"><span class="dot"></span>'+esc(META.sevWord)+'</span>'+
    '<span class="chip" id="counter">Exercise 1 of '+META.questionCount+'</span>'+
    '<span class="chip timerbox" aria-label="Time remaining">&#9201; <b id="tval">--:--</b></span>'+
    '<span id="tstate">'+stateChip()+'</span>'+
    '<span class="chip" aria-label="Live score">&#9878; <span id="scoreval"><b>0.0 / 0</b>&nbsp;(0%)</span></span>'+
    (S.user?'<span class="chip" aria-label="Learner">&#128100; '+esc(S.user)+'</span>':'')+
    '<button class="btn btn-ghost" id="btn-hint" title="Hint (costs 10% of this exercise credit)">&#128161; Hint</button>'+
    '<button class="btn btn-ghost" id="btn-pause" title="Manual pause">&#9208; Pause</button>'+
    '<button class="btn btn-ghost" id="btn-skip" title="Skip — comes back at the end">&#9888; Skip</button>';
  return tb;
}
function wireTopbar(){
  $('#btn-hint').onclick=doHint;$('#btn-pause').onclick=doPause;$('#btn-skip').onclick=doSkip;
  updateHintBtn();
}
function updateHintBtn(){
  var b=$('#btn-hint');if(!b)return;
  var r=S.rec[S.cur];
  if(!r||r.hintUsed||S.checked){b.disabled=true;return;}
  b.disabled=false;
}
/* ---------- intro ---------- */
function renderIntro(){
  S.phase='intro';document.title=META.pageTitle;
  var app=$('#app');app.innerHTML='';
  app.appendChild(buildIntroTop());
  var c1=el('div','card');
  c1.innerHTML='<div class="sechead"><span class="si">&#127919;</span>What you will learn here</div>'+INTRO.learn;
  app.appendChild(c1);
  var c2=el('div','card');
  var kw='<div class="sechead"><span class="si">&#128273;</span>Keywords covered in this exam</div><div class="kwgrid">';
  for(var i=0;i<INTRO.keywords.length;i++){var k=INTRO.keywords[i];
    kw+='<div class="kwpanel"><h4>'+k.theme+'</h4><ul>';
    for(var j=0;j<k.items.length;j++){kw+='<li>'+k.items[j]+'</li>';}
    kw+='</ul></div>';}
  kw+='</div>';c2.innerHTML=kw;app.appendChild(c2);
  var c3=el('div','card');
  c3.innerHTML='<div class="sechead"><span class="si">&#9881;</span>How this exam works</div>'+INTRO.how+
    '<div class="btn-row"><button class="btn btn-primary" id="btn-start" style="min-width:170px">&#9654; Start the exam</button></div>';
  app.appendChild(c3);
  $('#btn-start').onclick=startExam;
}
function buildIntroTop(){
  var c=el('div','card');
  c.innerHTML='<div class="intro-title">'+esc(META.title)+'</div>'+
    '<div class="intro-sub">MITRE ATT&amp;CK object: <b>'+esc(META.objId)+' — '+esc(META.objName)+'</b> &nbsp;&middot;&nbsp; '+esc(META.objKind)+'</div>'+
    '<div class="factstrip">'+
    '<div class="fact"><span class="fl">Severity</span><span class="fv"><span class="badge '+META.sevClass+'"><span class="dot"></span>'+esc(META.sevWord)+'</span></span></div>'+
    '<div class="fact"><span class="fl">Exercises in this file</span><span class="fv">'+META.questionCount+'</span></div>'+
    '<div class="fact"><span class="fl">Estimated time</span><span class="fv">'+META.estimatedMinutes+' min</span></div>'+
    '<div class="fact"><span class="fl">Timer budget</span><span class="fv">'+mmss(META.timerMinutes*60)+'</span></div>'+
    '<div class="fact"><span class="fl">Pass mark</span><span class="fv">'+META.passMark+'%</span></div>'+
    '</div>';
  return c;
}
/* ---------- exam flow ---------- */
function startExam(){
  resetToExam();
  for(var z=0;z<EXERCISES.length;z++){var e=EXERCISES[z];delete e._view;delete e._ans;delete e._seq;delete e._bank;delete e._place;delete e._items;delete e._norm;}
  var idxs=[];for(var i=0;i<EXERCISES.length;i++)idxs.push(i);
  S.order=shuffle(idxs);
  for(var k=0;k<EXERCISES.length;k++){S.rec[k]={status:'pending',credit:0,hintUsed:false};}
  S.remaining=META.timerMinutes*60;
  S.phase='exam';S.tState='RUNNING';S.stateSince=Date.now();
  renderExamShell();
  tStart();
  showExercise(S.order[0],false);
}
function resetToExam(){ /* full reset but keep handshake user */
  var u=S.user;S=freshState();S.user=u;
}
function renderExamShell(){
  var app=$('#app');app.innerHTML='';
  app.appendChild(buildTopbar());wireTopbar();
  var pr=el('div','progress');pr.innerHTML='<i id="pbar" style="width:0%"></i>';app.appendChild(pr);
  var stage=el('div','','');stage.id='stage';app.appendChild(stage);
  updateHeader();
}
function nextPending(afterPos){
  for(var i=afterPos+1;i<S.order.length;i++){var ix=S.order[i];if(S.rec[ix].status==='pending')return i;}
  return -1;
}
function showExercise(exIdx,fromReview){
  /* Next (or entering from the review screen) ends the Check auto-pause: timer returns to RUNNING */
  if(S.tState!=='ENDED'&&S.tState!=='RUNNING')tSetState('RUNNING');
  S.stageMode='exercise';
  var sb=$('#btn-skip');if(sb)sb.disabled=(S.phase!=='exam');
  S.cur=exIdx;S.curEx=EXERCISES[exIdx];S.fromReview=!!fromReview;S.checked=false;S.picked=null;S.stepIdx=0;S.stepAns=null;
  S.perLimit=(S.curEx.data&&S.curEx.data.timerSec)?S.curEx.data.timerSec:0;S.perLeft=S.perLimit;
  if(!fromReview){S.seen++;if(S.rec[exIdx].status==='pending')S.rec[exIdx].status='active';}
  var ex0=S.curEx;ex0._ans=[];ex0._seq=null;ex0._bank=null;ex0._view=null;ex0._place=null;ex0._items=null;
  var st=$('#stage');st.innerHTML='';
  renderBlocks(st,S.curEx);
  updateHeader();
  updateHintBtn();
  window.scrollTo(0,0);
}
function renderBlocks(root,ex){
  /* SCENARIO */
  var sc=el('div','blk blk-scenario');
  sc.innerHTML='<div class="blk-h">&#129517; SCENARIO</div>';
  var body=el('div','blk-b');body.innerHTML=ex.scenario;sc.appendChild(body);
  if(ex.collapsible){
    var tog=el('button','sc-collapse');
    tog.innerHTML='&#9650; Hide scenario &nbsp;&mdash;&nbsp; summary: '+esc(ex.scenarioShort);
    tog.onclick=function(){var open=body.style.display!=='none';
      body.style.display=open?'none':'';tog.innerHTML=open?'&#9660; Show scenario &nbsp;&mdash;&nbsp; summary: '+esc(ex.scenarioShort):'&#9650; Hide scenario &nbsp;&mdash;&nbsp; summary: '+esc(ex.scenarioShort);};
    sc.appendChild(tog);
  }
  root.appendChild(sc);
  /* QUESTION */
  var q=el('div','blk blk-question');
  var qb='<div class="blk-h">&#10067; QUESTION</div><div class="blk-b">';
  if(ex.type==='branch'){
    var si=Math.min(S.stepIdx,ex.data.steps.length-1);
    qb+='<div class="chip" style="margin-bottom:8px">&#128304; STEP '+(si+1)+' OF '+ex.data.steps.length+'</div>';
    qb+='<div class="qtext">'+ex.data.steps[si].q+'</div>';
    if(S.stepIdx>=ex.data.steps.length){qb+='<div class="hintbox" style="margin-top:8px"><b>&#128304; All '+ex.data.steps.length+' steps are recorded.</b> Press Check below to submit the whole chain.</div>';}
  }
  else{qb+='<div class="qtext">'+ex.question+'</div>';
    if(S.checked){qb+='<div class="hintbox" style="margin-top:8px"><b>&#9208; PAUSED &mdash; reviewing feedback (resumes on Next).</b> Your answer is graded below. The clock resumes when you press Next.</div>';}}
  qb+='</div>';
  q.innerHTML=qb;root.appendChild(q);
  /* YOUR ANSWER */
  var a=el('div','blk blk-answer');
  a.innerHTML='<div class="blk-h">&#9997; YOUR ANSWER</div>';
  var ab=el('div','blk-b');ab.id='ansarea';
  if(S.perLimit>0){ab.appendChild(el('div','hintbox','<b>&#9201; Per-exercise limit: '+mmss(S.perLimit)+'</b> — this terminal has its own clock: <b class="timerbox" id="perclock">'+mmss(S.perLeft)+'</b>. It pauses when the main timer pauses and grades what you typed when it expires.'));}
  renderAnswer(ab,ex);
  a.appendChild(ab);root.appendChild(a);
  /* button row */
  var br=el('div','btn-row');br.id='btrow';
  var stepsLeft=(ex.type==='branch'&&S.stepIdx<ex.data.steps.length);
  br.innerHTML='<button class="btn btn-primary" id="btn-check"'+(stepsLeft?' disabled title="Confirm every step first &mdash; Check grades the whole chain"':'')+'>&#10004; Check</button>';
  root.appendChild(br);
  $('#btn-check').onclick=function(){doCheck(false);};
}
function renderAnswer(area,ex){
  if(ex.type==='qcm')rChoice(area,ex,false);
  else if(ex.type==='multi')rChoice(area,ex,true);
  else if(ex.type==='match')rMatch(area,ex);
  else if(ex.type==='order')rOrder(area,ex);
  else if(ex.type==='fill')rFill(area,ex);
  else if(ex.type==='drag')rDrag(area,ex);
  else if(ex.type==='terminal')rTerminal(area,ex);
  else if(ex.type==='branch')rBranch(area,ex);
}
/* ---------- qcm & multi ---------- */
function rChoice(area,ex,isMulti){
  var opts=shuffle(ex.data.options.map(function(o,i){return {t:o.t,why:o.why||'',correct:!!o.correct,i:i};}));
  ex._view=opts;
  var wrap=el('div','opts');wrap.setAttribute('role',isMulti?'group':'radiogroup');
  var letters='ABCDEF';
  opts.forEach(function(o,k){
    var row=el('div','opt');row.setAttribute('role',isMulti?'checkbox':'radio');row.tabIndex=0;
    row.innerHTML='<span class="tag">'+letters[k]+'.</span><span class="txt">'+o.t+'</span><span class="selmark">&#9679; Selected</span>';
    row.__k=k;
    var pick=function(){if(S.checked)return;
      if(isMulti){row.classList.toggle('selected');row.setAttribute('aria-checked',row.classList.contains('selected')?'true':'false');}
      else{var rs=wrap.querySelectorAll('.opt');for(var z=0;z<rs.length;z++){rs[z].classList.remove('selected');rs[z].setAttribute('aria-checked','false');}
        row.classList.add('selected');row.setAttribute('aria-checked','true');}
    };
    row.onclick=pick;row.onkeydown=function(ev){if(ev.key===' '||ev.key==='Enter'){ev.preventDefault();pick();}};
    wrap.appendChild(row);
  });
  area.appendChild(wrap);
}
/* ---------- match ---------- */
function rMatch(area,ex){
  var rights=shuffle(ex.data.right.map(function(r,i){return {t:r,i:i};}));
  ex._view=rights;
  var g=el('div','matchgrid');
  ex.data.left.forEach(function(L,li){
    var left=el('div','mrow');
    var l=el('div','mleft',L.t);left.id='ml-'+li;
    var sel=el('select');sel.id='ms-'+li;sel.setAttribute('aria-label','Match for: '+L.t.replace(/<[^>]*>/g,''));
    sel.appendChild(el('option','', '&#8212; choose the match &mdash;')).value='';
    rights.forEach(function(R){var o=el('option','',R.t);o.value=String(R.i);sel.appendChild(o);});
    sel.__li=li;
    var rw=el('div');rw.appendChild(sel);
    left.appendChild(l);left.appendChild(rw);g.appendChild(left);
  });
  area.appendChild(g);
}
/* ---------- order ---------- */
function rOrder(area,ex){
  ex._bank=shuffle(ex.data.items.map(function(it,i){return {t:it.t,i:i};}));
  ex._seq=[];
  var bank=el('div','bank-inline');bank.id='obank';
  var hint=el('div','','<div class="fcredit">Click the items below in the correct order (first click = step 1). Click a placed item to send it back.</div>');
  area.appendChild(hint);
  var seq=el('div','seq');seq.id='oseq';
  area.appendChild(seq);
  area.appendChild(el('div','fcredit','Item bank:'));
  area.appendChild(bank);
  var draw=function(){
    bank.innerHTML='';seq.innerHTML='';
    ex._bank.forEach(function(b,k){
      var c=el('button','chipitem','<span class="ck">+'+(k+1)+'</span> '+b.t);
      c.onclick=function(){if(S.checked)return;ex._seq.push(b);ex._bank.splice(k,1);draw();};
      bank.appendChild(c);
    });
    ex._seq.forEach(function(b,k){
      var c=el('button','chipitem','<span class="ck">'+(k+1)+'</span> '+b.t);
      c.onclick=function(){if(S.checked)return;ex._bank.push(b);ex._seq.splice(k,1);draw();};
      seq.appendChild(c);
    });
    if(!ex._bank.length&&!ex._seq.length)bank.appendChild(el('span','fcredit','All items placed.'));
  };
  draw();
}
/* ---------- fill ---------- */
function rFill(area,ex){
  var bank=shuffle(ex.data.bank.map(function(b){return b;}));
  ex._view=bank;
  var parts=ex.data.template.split(/\{\{\s*(\d+)\s*\}\}/g);
  var line=el('div','fillline');
  for(var i=0;i<parts.length;i++){
    if(i%2===0){line.appendChild(document.createTextNode(parts[i]));}
    else{var bi=parseInt(parts[i],10);
      var sel=el('select');sel.id='fb-'+bi;sel.setAttribute('aria-label','Blank '+(bi+1));
      sel.appendChild(el('option','','&#8212; pick a word &mdash;')).value='';
      bank.forEach(function(w){var o=el('option','',w);o.value=w;sel.appendChild(o);});
      line.appendChild(sel);}
  }
  area.appendChild(line);
}
/* ---------- drag & drop ---------- */
function rDrag(area,ex){
  ex._items=shuffle(ex.data.items.map(function(it){return {id:it.id,t:it.t};}));
  ex._place={};
  var hint=el('div','fcredit','Pick an item, then click its slot (or drag it). Click a placed item to send it back.');
  area.appendChild(hint);
  var slotsWrap=el('div','slots');
  ex.data.slots.forEach(function(sl){
    var s=el('div','slot');s.id='slot-'+sl.id;
    s.innerHTML='<span class="slab">'+sl.label+'</span>';
    s.__sid=sl.id;
    s.tabIndex=0;s.setAttribute('role','button');
    s.setAttribute('aria-label','Drop zone: '+sl.label.replace(/<[^>]*>/g,'')+' — pick an item, then press Enter here to place it');
    s.onkeydown=function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();if(S.checked)return;dropTo(sl.id);}};
    s.onclick=function(ev){if(S.checked)return;var t=ev.target;
      if(t.classList&&t.classList.contains('chipitem')){sendBack(t.getAttribute('data-id'));return;}
      dropTo(sl.id);};
    s.ondragover=function(ev){ev.preventDefault();s.classList.add('over');};
    s.ondragleave=function(){s.classList.remove('over');};
    s.ondrop=function(ev){ev.preventDefault();s.classList.remove('over');var id=ev.dataTransfer.getData('text/plain');if(id){pick(id);dropTo(sl.id);}};
    slotsWrap.appendChild(s);
  });
  area.appendChild(slotsWrap);
  area.appendChild(el('div','fcredit','Item bank:'));
  var bank=el('div','bank');bank.id='dbank';area.appendChild(bank);
  function pick(id){var it=null;for(var i=0;i<ex._items.length;i++){if(ex._items[i].id===id)it=ex._items[i];}
    if(!it)return;var prev=ex._place[id];if(prev){var ps=$('#slot-'+prev);var pc=ps.querySelector('[data-id="'+id+'"]');if(pc)ps.removeChild(pc);delete ex._place[id];}
    return it;}
  function sendBack(id){if(S.checked)return;pick(id);drawBank();}
  function dropTo(sid){if(S.checked||!S.picked)return;ex._place[S.picked]=sid;
    var s=$('#slot-'+sid);var it=null;for(var i=0;i<ex._items.length;i++){if(ex._items[i].id===S.picked)it=ex._items[i];}
    var c=el('button','chipitem',it.t);c.setAttribute('data-id',S.picked);c.setAttribute('draggable','false');
    c.onclick=function(ev){ev.stopPropagation();sendBack(S.picked);};
    s.appendChild(c);S.picked=null;drawBank();}
  function drawBank(){bank.innerHTML='';ex._items.forEach(function(it){
    if(ex._place[it.id])return;
    var c=el('button','chipitem',it.t);c.setAttribute('data-id',it.id);c.setAttribute('draggable','true');
    c.onclick=function(){if(S.checked)return;var all=document.querySelectorAll('.chipitem.picked');for(var z=0;z<all.length;z++)all[z].classList.remove('picked');c.classList.add('picked');S.picked=it.id;};
    c.ondragstart=function(ev){ev.dataTransfer.setData('text/plain',it.id);c.classList.add('dragging');S.picked=it.id;};
    c.ondragend=function(){c.classList.remove('dragging');};
    bank.appendChild(c);});
    if(!bank.children.length)bank.appendChild(el('span','fcredit','All items placed — click a placed item to move it back.'));}
  drawBank();
}
/* ---------- terminal ---------- */
function rTerminal(area,ex){
  var term=el('div','term');
  term.innerHTML='<div class="term-bar"><i></i><i></i><i></i><span>'+esc(ex.data.title||'simulated shell — nothing here touches a real system')+'</span></div>'+
    '<div class="term-out" id="tout">'+ex.data.banner.map(function(l){return '<span class="c">'+l+'</span>';}).join('\n')+'</div>'+
    '<div class="term-in"><span class="pr">'+ex.data.prompt+'</span><input id="tin" type="text" autocomplete="off" spellcheck="false" aria-label="Type the command"></div>';
  area.appendChild(term);
  var row=el('div','termrow');
  row.innerHTML='<button class="btn btn-blue" id="btn-run">&#9654; Run</button>'+
    '<span class="fcredit">Type the command, press Run to see simulated output, then Check to grade it. Nothing real is executed.</span>';
  area.appendChild(row);
  function norm(c){return c.trim().replace(/\s+/g,' ').toLowerCase();}
  ex._norm=norm;
  function run(){
    if(S.checked)return;
    var v=$('#tin').value;var out=$('#tout');var n=norm(v);
    out.textContent+='\n'+ex.data.prompt+' '+v+'\n';
    if(!n){out.textContent+='(no command typed)\n';}
    else{
      var ok=false,dang=false;
      try{ok=new RegExp(ex.data.okRe,'i').test(n);}catch(e){ok=false;}
      try{dang=ex.data.dangerRe?new RegExp(ex.data.dangerRe,'i').test(n):false;}catch(e){dang=false;}
      if(dang){ex.data.dangerOut.forEach(function(l){out.textContent+=l+'\n';});}
      else if(ok){ex.data.output.forEach(function(l){out.textContent+=l+'\n';});}
      else{out.textContent+=(ex.data.notFound||('command not found: '+n.split(' ')[0]))+'\n';}
    }
    out.scrollTop=out.scrollHeight;
    $('#tin',area).focus();
  }
  $('#btn-run',area).onclick=run;
  $('#tin',area).onkeydown=function(ev){if(ev.key==='Enter'){ev.preventDefault();run();}};
  setTimeout(function(){var t=$('#tin',area);if(t)t.focus();},80);
}
/* ---------- branch ---------- */
function rBranch(area,ex){
  if(!ex._ans)ex._ans=[];
  if(!ex._view)ex._view=[];
  var si=Math.min(S.stepIdx,ex.data.steps.length-1);
  var wrap=el('div','opts');
  var step=ex.data.steps[si];
  /* shuffle each step's options once per attempt so the correct answer is not always in the same position */
  if(!ex._view[si])ex._view[si]=shuffle(step.options.map(function(o,k){return {o:o,k:k};}));
  ex._view[si].forEach(function(v,k){
    var o=v.o;
    var row=el('div','opt');row.tabIndex=0;row.setAttribute('role','radio');row.setAttribute('aria-checked','false');
    row.innerHTML='<span class="tag">'+'ABCDEF'[k]+'.</span><span class="txt">'+o.t+'</span><span class="selmark">&#9679; Selected</span>';
    row.onclick=function(){if(S.checked)return;var rs=wrap.querySelectorAll('.opt');
      for(var z=0;z<rs.length;z++){rs[z].classList.remove('selected');rs[z].setAttribute('aria-checked','false');}
      row.classList.add('selected');row.setAttribute('aria-checked','true');};
    wrap.appendChild(row);
  });
  area.appendChild(wrap);
  var br=el('div','btn-row');
  if(S.stepIdx>=ex.data.steps.length){
    lockArea(area);
  }else{
  br.innerHTML='<button class="btn btn-blue" id="btn-step">&#9998; Confirm step '+(S.stepIdx+1)+'</button>'+
    '<span class="fcredit">Your choice is locked in and hidden until the final Check — the timer keeps running between steps.</span>';
  area.appendChild(br);
  $('#btn-step',area).onclick=function(){
    if(S.checked)return;
    var sel=wrap.querySelector('.opt.selected');if(!sel)return;
    var k=Array.prototype.indexOf.call(wrap.querySelectorAll('.opt'),sel);
    ex._ans[S.stepIdx]=ex._view[S.stepIdx][k].k;S.stepIdx++;
    var stg=$('#stage');
    if(S.stepIdx<ex.data.steps.length){stg.innerHTML='';renderBlocks(stg,ex);}
    else{ /* final step recorded -> show Check */
      stg.innerHTML='';renderBlocks(stg,ex);
      var note=el('div','hintbox','<b>&#128304; All '+ex.data.steps.length+' steps recorded.</b> Your choices are hidden. Press Check to submit the whole chain and see the outcome.');
      $('#ansarea').appendChild(note);
      lockArea($('#ansarea'));
    }
    window.scrollTo(0,0);
  };
  }
}
/* ---------- grading ---------- */
function itemRow(kind,txt,why){
  var ic=kind==='correct'?'&#10004; Correct':(kind==='wrong'?'&#10008; Wrong':'&#9675; Missed');
  var cls=kind==='correct'?'i-correct':(kind==='wrong'?'i-wrong':'i-missed');
  return '<div class="itemrow '+cls+'"><span class="ic">'+ic+'</span><span><b>'+txt+'</b>'+(why?' — '+why:'')+'</span></div>';
}
function grade(ex){
  var r={credit:0,items:null,H:0,W:0,N:1,label:'',explain:ex.explain,danger:null};
  var t=ex.type;
  if(t==='qcm'){
    var sel=$('#ansarea').querySelector('.opt.selected');
    var k=sel?Array.prototype.indexOf.call($('#ansarea').querySelectorAll('.opt'),sel):-1;
    r.N=1;r.H=(k>=0&&ex._view[k].correct)?1:0;r.W=0;
    var o=k>=0?ex._view[k]:null;
    var correctOpt=ex._view.filter(function(x){return x.correct;})[0];
    r.items=itemRow(r.H?'correct':'wrong',o?('Your choice: '+o.t.replace(/<[^>]*>/g,'')):'No option selected',o?(o.correct?o.why:('Not correct here. Correct answer: '+correctOpt.t.replace(/<[^>]*>/g,'')+' &mdash; '+correctOpt.why)):'Nothing was selected, so the exercise scores 0.');
  }
  else if(t==='multi'){
    var rows=$('#ansarea').querySelectorAll('.opt');
    var picked={};rows.forEach(function(row,i){picked[i]=row.classList.contains('selected');});
    var its=[];var n=0,h=0,w=0;
    ex._view.forEach(function(o,i){
      if(o.correct){n++;if(picked[i]){h++;its.push(itemRow('correct','Selected: '+o.t.replace(/<[^>]*>/g,''),o.why));}
        else its.push(itemRow('missed','Missed: '+o.t.replace(/<[^>]*>/g,''),o.why));}
      else if(picked[i]){w++;its.push(itemRow('wrong','Wrong pick: '+o.t.replace(/<[^>]*>/g,''),o.why));}
    });
    r.N=n;r.H=h;r.W=w;r.items=its.join('');
  }
  else if(t==='match'){
    var its2=[];var n2=ex.data.left.length,h2=0,w2=0;
    ex.data.left.forEach(function(L,li){
      var s=$('#ms-'+li);var v=s?s.value:'';
      if(v===''){its2.push(itemRow('missed','No match chosen for: '+L.t.replace(/<[^>]*>/g,''),L.why));}
      else if(parseInt(v,10)===L.r){h2++;its2.push(itemRow('correct',L.t.replace(/<[^>]*>/g)+' &#8594; '+ex.data.right[L.r],L.why));}
      else{w2++;its2.push(itemRow('wrong',L.t.replace(/<[^>]*>/g)+' &#8594; '+ex.data.right[parseInt(v,10)],L.why));}
    });
    r.N=n2;r.H=h2;r.W=w2;r.items=its2.join('');
  }
  else if(t==='order'){
    var its3=[],n3=ex.data.items.length,h3=0,w3=0;
    for(var i=0;i<n3;i++){
      var placed=ex._seq[i];
      if(!placed){its3.push(itemRow('missed','Position '+(i+1)+' — '+ex.data.items[i].t,'Left empty. This step belongs here.'));}
      else if(placed.i===i){h3++;its3.push(itemRow('correct','Position '+(i+1)+' — '+placed.t,ex.data.items[i].why));}
      else{w3++;its3.push(itemRow('wrong','Position '+(i+1)+' — you placed: '+placed.t,ex.data.items[i].why));}
    }
    r.N=n3;r.H=h3;r.W=w3;r.items=its3.join('');
  }
  else if(t==='fill'){
    var its4=[],n4=ex.data.blanks.length,h4=0,w4=0;
    ex.data.blanks.forEach(function(b,bi){
      var s=$('#fb-'+bi);var v=s?s.value:'';
      if(v===''){its4.push(itemRow('missed','Blank '+(bi+1)+' left empty — answer: '+b.correct,b.why));}
      else if(v===b.correct){h4++;its4.push(itemRow('correct','Blank '+(bi+1)+': '+v,b.why));}
      else{w4++;its4.push(itemRow('wrong','Blank '+(bi+1)+': you chose '+v+' — answer: '+b.correct,b.why));}
    });
    r.N=n4;r.H=h4;r.W=w4;r.items=its4.join('');
  }
  else if(t==='drag'){
    var its5=[],n5=ex.data.items.length,h5=0,w5=0;
    ex.data.items.forEach(function(it){
      var dest=ex._place[it.id];
      if(!dest){its5.push(itemRow('missed','Still in bank: '+it.t,(ex.data.why&&ex.data.why[it.id])||'It belongs in: '+slotLabel(ex.data,ex.data.correct[it.id])));}
      else if(dest===ex.data.correct[it.id]){h5++;its5.push(itemRow('correct',it.t+' &#8594; '+slotLabel(ex.data,dest),(ex.data.why&&ex.data.why[it.id])||''));}
      else{w5++;its5.push(itemRow('wrong',it.t+' &#8594; '+slotLabel(ex.data,dest)+' — belongs in: '+slotLabel(ex.data,ex.data.correct[it.id]),(ex.data.why&&ex.data.why[it.id])||''));}
    });
    r.N=n5;r.H=h5;r.W=w5;r.items=its5.join('');
  }
  else if(t==='terminal'){
    var v=$('#tin')?$('#tin').value:'';
    var n=ex._norm?ex._norm(v):v.trim().toLowerCase();
    var its6=[];var h6=0,w6=0;
    ex.data.required.forEach(function(req){
      var hit=false;try{hit=new RegExp(req.re,'i').test(n);}catch(e){}
      if(hit){h6++;its6.push(itemRow('correct','Element present: '+req.label,req.why));}
      else its6.push(itemRow('missed','Element missing: '+req.label,req.why+' Expected something like: '+req.match));
    });
    if(ex.data.forbidden){ex.data.forbidden.forEach(function(f){
      var hit=false;try{hit=new RegExp(f.re,'i').test(n);}catch(e){}
      if(hit){w6++;its6.push(itemRow('wrong','Dangerous element present: '+f.label,f.why));}});}
    r.N=ex.data.required.length;r.H=h6;r.W=w6;r.items=its6.join('');
    if(w6>0){r.danger='&#10008; DANGEROUS — NEAR MISS: the command you typed would change or destroy state in a real incident ('+esc(ex.data.dangerWhy||'it alters the system you are investigating')+') . In live response, read-only or evidence-preserving commands come first.';}
  }
  else if(t==='branch'){
    var its7=[],n7=ex.data.steps.length,h7=0,w7=0;
    ex.data.steps.forEach(function(stp,si){
      var chosen=ex._ans?ex._ans[si]:-1;
      var opt=chosen>=0?stp.options[chosen]:null;
      if(opt&&opt.correct){h7++;its7.push(itemRow('correct','Step '+(si+1)+': '+opt.t.replace(/<[^>]*>/g,''),opt.why));}
      else if(opt){w7++;var co=stp.options.filter(function(x){return x.correct;})[0];
        its7.push(itemRow('wrong','Step '+(si+1)+': '+opt.t.replace(/<[^>]*>/g,''),opt.why+' Better: '+co.t.replace(/<[^>]*>/g,'')+' — '+co.why));}
      else its7.push(itemRow('missed','Step '+(si+1)+' — no choice recorded','This decision point was left empty.'));
    });
    r.N=n7;r.H=h7;r.W=w7;r.items=its7.join('');
  }
  r.credit=score(r.H,r.W,r.N);
  return r;
}
function slotLabel(d,sid){for(var i=0;i<d.slots.length;i++){if(d.slots[i].id===sid)return d.slots[i].label;}return sid;}
/* ---------- actions ---------- */
function doHint(){
  if(S.checked)return;var r=S.rec[S.cur];if(!r||r.hintUsed)return;
  r.hintUsed=true;updateHintBtn();
  var q=$('#stage .blk-question .blk-b');var h=el('div','hintbox','<b>&#128161; Hint</b> — using one costs 10% of this exercise&rsquo;s credit: '+S.curEx.hint);
  if(q)q.appendChild(h);
}
function doPause(){
  if(S.tState==='ENDED'||S.phase==='intro'||S.phase==='results')return;
  if(S.tState==='PAUSED_MANUAL')return;
  S.beforeManual=S.tState;S.pausedStage=S.stageMode;tSetState('PAUSED_MANUAL');
  var st=$('#stage');
  st.innerHTML='<div class="pausepanel"><div class="big">&#9208; PAUSED — manual</div><p>The exercise is hidden while you take a break. The clock is stopped.</p><button class="btn btn-blue" id="btn-resume">&#9654; Resume</button></div>';
  $('#btn-resume').onclick=doResume;
}
function doResume(){
  var back=S.beforeManual||'RUNNING';
  /* manual pause taken on top of the review-skipped screen returns to that screen */
  if(S.pausedStage==='list'){tSetState(back);showReview();window.scrollTo(0,0);return;}
  var st=$('#stage');st.innerHTML='';renderBlocks(st,S.curEx);
  if(S.checked&&S.lastResult){renderFeedback(S.lastResult);} /* restore graded view after manual pause on top of auto-pause */
  tSetState(back);
  window.scrollTo(0,0);
}
function doSkip(){
  if(S.checked||S.phase!=='exam')return;
  if(S.rec[S.cur].status!=='skipped'){S.rec[S.cur].status='skipped';S.skipped.push(S.cur);}
  advance();
}
function advance(){
  var np=nextPending(S.order.indexOf(S.cur));
  if(np>=0){showExercise(S.order[np],false);return;}
  if(S.skipped.length){showReview();return;}
  showResults();
}
function doCheck(auto){
  if(S.checked||S.tState==='ENDED')return;
  if(!auto){var need=false;
    if(S.curEx.type==='branch'&&S.stepIdx<S.curEx.data.steps.length)return; /* confirm steps first */
  }
  tSetState('PAUSED_AUTO_CHECK'); /* FIRST ACTION per spec */
  S.checked=true;
  var r=grade(S.curEx);
  if(S.rec[S.cur].hintUsed){r.credit=Math.max(0,r.credit-0.10);}
  S.rec[S.cur].credit=r.credit;S.rec[S.cur].status='done';S.answered++;S.creditSum+=r.credit;
  var sk=S.skipped.indexOf(S.cur);if(sk>=0)S.skipped.splice(sk,1); /* answered during review */
  S.lastResult=r;
  renderFeedback(r);
  updateHeader();
}
function renderFeedback(r){
  lockArea($('#ansarea'));
  var ex=S.curEx;
  var lab,cls;
  if(r.credit>=1){lab='&#10004; CORRECT';cls='f-correct';}
  else if(r.credit>0){lab='&#10004; PARTIALLY CORRECT';cls='f-partial';}
  else{lab='&#10008; INCORRECT';cls='f-incorrect';}
  var fb=el('div','feedback '+cls);
  var creditLine=(r.N>1||r.credit<1)?'<div class="fcredit">Credit <b>'+r.credit.toFixed(2)+'</b> — '+Math.round(r.H)+' correct / '+Math.round(r.W)+' wrong / '+r.N+' items &nbsp;(formula: (H &minus; W) &divide; N)'+(S.rec[S.cur].hintUsed?' &nbsp;&middot;&nbsp; includes &minus;0.10 hint penalty':'')+'</div>':'';
  var canon='';
  if(ex.type==='terminal'){
    canon='<div class="canon"><div class="fcredit" style="margin:8px 0 4px">Canonical command (copyable):</div><code id="canontext">'+esc(ex.data.canonical)+'</code>'+
      '<div class="btn-row"><button class="btn btn-ghost" id="btn-copy">&#128203; Copy</button></div></div>';
  }
  fb.innerHTML='<div class="fhead">'+lab+'</div>'+creditLine+
    (r.danger?'<div class="danger">'+r.danger+'</div>':'')+
    (r.items?'<div class="items">'+r.items+'</div>':'')+
    '<div class="fexplain">'+r.explain+'</div>'+canon+
    '<div class="study">&#128218; What to study next: '+ex.study+'</div>';
  $('#stage').appendChild(fb);
  var cp=$('#btn-copy');
  if(cp)cp.onclick=function(){var txt=ex.data.canonical;
    try{navigator.clipboard.writeText(txt).then(function(){cp.textContent='&#128203; Copied';},function(){fallbackCopy(txt);cp.textContent='&#128203; Copied';});}
    catch(e){fallbackCopy(txt);cp.textContent='&#128203; Copied';}};
  /* next button */
  var br=$('#btrow');
  var lastOne=!(nextPending(S.order.indexOf(S.cur))>=0)&&S.skipped.length===0;
  br.innerHTML='';
  var nb=el('button','btn btn-blue',lastOne&&S.skipped.length===0?'&#10148; Final Submit':'Next &#9654;');
  nb.onclick=function(){
    var np=nextPending(S.order.indexOf(S.cur));
    if(np>=0){showExercise(S.order[np],false);return;}
    if(S.skipped.length){showReview();return;}
    showResults();
  };
  br.appendChild(nb);
}
function fallbackCopy(t){try{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}catch(e){}}
/* ---------- review skipped ---------- */
function showReview(){
  S.phase='review';S.stageMode='list';
  /* returning to the review-skipped screen also resumes the clock (unless it already ended) */
  if(S.tState!=='ENDED'&&S.tState!=='RUNNING')tSetState('RUNNING');
  var sb=$('#btn-skip');if(sb)sb.disabled=true;
  var st=$('#stage');st.innerHTML='';
  updateHeader();
  var card=el('div','card');
  var rows='';
  S.skipped.forEach(function(ix,i){
    rows+='<div class="rvrow"><span class="t">'+(i+1)+'. '+EXERCISES[ix].reviewLabel+'</span>'+
      '<span class="rvtag">&#9888; Skipped</span><button class="btn btn-ghost" data-rv="'+ix+'">&#9998; Answer now</button></div>';
  });
  card.innerHTML='<div class="sechead"><span class="si">&#9888;</span>Review skipped exercises</div>'+
    '<p class="intro-sub">These '+S.skipped.length+' exercise(s) are still unanswered. Answer as many as the clock allows — anything you leave now is excluded from the score (it counts neither for you nor against you). The clock is still running.</p>'+rows+
    '<div class="btn-row" style="margin-top:14px"><button class="btn btn-primary" id="btn-finish">&#10148; Submit final results</button></div>';
  st.appendChild(card);
  var bs=card.querySelectorAll('[data-rv]');
  for(var i=0;i<bs.length;i++){bs[i].onclick=function(){var ix=parseInt(this.getAttribute('data-rv'),10);showExercise(ix,true);};}
  $('#btn-finish').onclick=showResults;
  window.scrollTo(0,0);
}
/* ---------- results ---------- */
function showResults(){
  if(S.tickId){clearInterval(S.tickId);S.tickId=null;}
  tSetState('ENDED');S.phase='results';S.stageMode='results';
  var sb=$('#btn-skip');if(sb)sb.disabled=true;
  var full=0,part=0,zero=0,partSum=0;
  for(var k in S.rec){var r=S.rec[k];if(r.status!=='done')continue;
    if(r.credit>=1)full++;else if(r.credit>0){part++;partSum+=r.credit;}else zero++;}
  var left=S.skipped.length;
  var pct=S.answered>0?Math.round(S.creditSum/S.answered*100):0;
  var passed=pct>=META.passMark;
  var st=$('#stage');st.innerHTML='';
  var card=el('div','card');
  card.innerHTML='<div class="result-head '+(passed?'pass':'fail')+'">'+(passed?'&#10004; PASS':'&#10008; FAIL')+'</div>'+
    '<div class="scorebig">'+pct+'%</div>'+
    '<div class="intro-sub">'+S.creditSum.toFixed(1)+' credit points over '+S.answered+' answered exercise(s) — pass mark '+META.passMark+'%. '+(passed?'Well done. ':'Below the pass mark — retake the exam to improve. ')+'Skipped-and-never-answered exercises are excluded from both the points and the total.</div>'+
    '<div class="statgrid">'+
    '<div class="stat s-c"><span class="sl">&#10004; Fully correct</span><span class="sv">'+full+'</span></div>'+
    '<div class="stat s-p"><span class="sl">&#10004; Partially correct</span><span class="sv">'+part+'</span><span class="sl">'+(part?'avg '+(partSum/part).toFixed(2)+' credit':'')+'</span></div>'+
    '<div class="stat s-w"><span class="sl">&#10008; Fully incorrect</span><span class="sv">'+zero+'</span></div>'+
    '<div class="stat s-s"><span class="sl">&#9888; Skipped — excluded</span><span class="sv">'+left+'</span></div>'+
    '</div>'+
    '<div class="pauselog">&#9201; Time log — paused manually: <b>'+mmss(S.manualTotal)+'</b> &middot; paused for feedback review: <b>'+mmss(S.autoTotal)+'</b> &middot; clock remaining: <b>'+mmss(S.remaining)+'</b></div>'+
    (passed?'<div class="certificate">&#127942; <b>Certificate note:</b> you passed the '+esc(META.sevWord)+' certification exam for '+esc(META.objId)+' — '+esc(META.objName)+'. Your score has been reported to the platform.</div>':'')+
    '<div class="btn-row" style="margin-top:14px"><button class="btn btn-amber" id="btn-retake">&#8635; Retake exam</button></div>';
  st.appendChild(card);
  $('#btn-retake').onclick=function(){startExam();};
  reportScore(S.creditSum,S.answered,pct);
  window.scrollTo(0,0);
}
function reportScore(creditSum,answeredCount,percent){
  if(S.reported)return;S.reported=true;
  try{
    parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,
      score:Math.round(creditSum),total:answeredCount,percent:percent,passed:percent>=META.passMark},location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}
/* ---------- handshake ---------- */
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  S.user=event.data.username||null;
  S.country=event.data.country||null;S.locale=event.data.locale||null; /* consumed — the file stays dark-only regardless of theme */
  var tb=document.querySelector('.topbar');
  if(S.user&&tb&&!tb.querySelector('.u-chip')){
    var c=el('span','chip u-chip','&#128100; '+esc(S.user));tb.insertBefore(c,document.getElementById('btn-hint'));
  }
});
/* ---------- init ---------- */
function init(){S=freshState();renderIntro();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();


</script>
</body>
</html>
