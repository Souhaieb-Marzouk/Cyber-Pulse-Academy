.paused-card{background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 30px;max-width:440px;text-align:center}
.paused-card .pico{font-size:34px;color:var(--state-paused)}

.paused-card p{margin:0 0 18px;color:var(--text-secondary);font-size:14.5px}

  .hdr{padding:8px 10px}

}

  *{scroll-behavior:auto!important}
}

<script type="application/json" id="exam-data">{"topicId":"t1553.001","batch":4,"difficulty":"extremely-hard","severity":"EXTREMELY HARD","passMark":70,"estimatedMinutes":45,"mitreId":"T1553.001","mitreName":"Gatekeeper Bypass","objectType":"Sub-Technique","intro":{"learn":["This exam is the EXTREMELY HARD level for the MITRE ATT&CK sub-technique T1553.001, Gatekeeper Bypass — a Sub-Technique of T1553, used for Defense Evasion on macOS. Every exercise chains several ideas and adds at least one signal that pulls in the opposite direction.","You will resolve conflicts, not recall facts: a verdict that says “accepted” while the log shows the first-launch check was skipped; a policy that is locked while the attribute is removed anyway; a log window with a hole in the middle. You will state which signal wins and why.","You will also weigh the cost of action. Wiping a Mac destroys the only copy of the payload; waiting too long lets adware spread; the textbook best practice is sometimes the wrong move in this specific incident. Several correct answers are “hold, preserve, escalate” rather than a technical action.","The scenarios reference documented macOS tradecraft — Shlayer and Bundlore, who ship tainted installers and clear the quarantine attribute before launch — and put you in senior seats: IR lead on a live host, detection engineer tuning the bypass rules, Mac platform owner answering the change board, threat hunter scoping the fleet. SOC analysts, incident responders, MDM administrators, and threat hunters all rehearse those calls in the exercises that follow.","Nothing outside this sub-technique is tested. Other platforms and other evasion tricks are out of scope; keep every answer anchored to T1553.001 evidence."],"keywords":[{"theme":"Conflicting evidence","items":["accepted verdict versus skipped assessment","incomplete log windows","noise in host telemetry","policy locked yet bypass observed"]},{"theme":"Evidence-first response","items":["read-only attribute capture","evidence before eradication","chain-of-custody hash verification","escalation thresholds","provisional findings"]},{"theme":"Fleet controls","items":["MDM enforcement verification","compound assessment commands","notarization limits","allowlisting and install rights"]}],"how":["You will answer 15 exercises and you need 70% or more to pass.","Exercise types in this exam: one timed terminal exercise, matching pairs, ordering steps, single choice, drag-and-drop sorting, fill-in-the-blank, a second terminal exercise, a branching scenario, priority ranking, multi-select, and a closing blank exercise.","A countdown timer runs for 45 minutes. Pause hides the exercise and stops the timer until you press Resume.","When you press Check, the timer stops automatically so you can read the feedback. It starts again on Next.","The first terminal exercise has its own 4-minute limit; when it expires, your answer is submitted automatically. This limit applies to that exercise only.","Exercises with several items give partial credit: max(0, (correct − wrong) / items). One hint per exercise is allowed; it costs 10% of that exercise's credit. Hints only restate a constraint you may have missed.","Skip moves an exercise to a review pool near the end. Skipped exercises you never answer do not count in your score at all."]},"exercises":[{"id":"e01","type":"terminal","perspective":"defender","scenario":{"summary":"Capture the attribute value before anything on the host changes","text":["INC-5117, MAC-FIN-02, already isolated. The user mounted FlashUpdate.dmg from a poisoned link (hxxp://flash-update[.]example[.]com/get); ESF shows a staged copy of the app was launched once from /tmp/stage — no first-launch warning appeared.","Legal wants evidence that survives scrutiny; the CISO wants the Mac back today. You are in the responder shell on the isolated host, and the original DMG is re-mounted read-only at /Volumes/FlashUpdate with the pristine app at /Volumes/FlashUpdate/FlashUpdate.app. The launched copy in /tmp/stage is the altered one.","Capture the exact quarantine attribute value of the pristine app in a form you can paste into the evidence log. Any command that writes, deletes, or clears is out of bounds."],"artefacts":[{"label":"ARTEFACT 1 — Ticket INC-5117 excerpt","kind":"ticket","lines":["User: Dana K., finance. App launched once from a staged copy; no first-launch warning.","Download link: hxxp://flash-update[.]example[.]com/get (proxy-blocked domain, new since Monday).","Hash of DMG not retained by the proxy."]},{"label":"ARTEFACT 2 — Evidence-log template line","kind":"ticket","lines":["Required entry: exact quarantine attribute value of /Volumes/FlashUpdate/FlashUpdate.app, captured read-only, paste-ready."]},{"label":"ARTEFACT 3 — Mounted-volume note","kind":"text","lines":["/Volumes/FlashUpdate: original image re-mounted read-only under the evidence policy (user mount ejected at isolation).","Copies to evidence storage: pending hashes."]}]},"question":"Type the command that captures the value the evidence log needs.","terminal":{"prompt":"ir@mac-fin-02","banner":["isolated host — INC-5117 — /Volumes/FlashUpdate mounted read-only","⏱ this terminal is timed: 4 minutes","evidence rule: read only — capture, never alter"],"solution":"xattr -p com.apple.quarantine /Volumes/FlashUpdate/FlashUpdate.app","timeLimit":240,"elements":[{"label":"uses the attribute tool in read mode","re":"^xattr( |$)"},{"label":"prints one attribute's value (-p)","re":"(^|\\s)-p( |$)"},{"label":"names the quarantine attribute","re":"com\\.apple\\.quarantine"},{"label":"targets the mounted sample","re":"FlashUpdate\\.app"}],"outputs":[{"re":"^xattr -p com","lines":["com.apple.quarantine: 0083;665f1a2b;Safari;A1B2C3D4-5E6F-4A9B-8C7D-1E2F3A4B5C6D"]},{"re":"^xattr","lines":["com.apple.quarantine"]}],"nearMiss":[{"re":"^xattr\\s+(-d|--delete)","msg":"Deleting the attribute on the live sample destroys the primary artefact the evidence log needs"},{"re":"^xattr\\s+(-rc|-r|-w)","msg":"Recursive clearing or writing attributes alters state across the mounted image — the evidence becomes tainted"}],"nearMissSample":"xattr -d com.apple.quarantine /Volumes/FlashUpdate/FlashUpdate.app","partialSample":"xattr com.apple.quarantine /Volumes/FlashUpdate/FlashUpdate.app","hint":"The evidence rule in the banner is binding: the command must only read.","explain":["xattr -p com.apple.quarantine <path> prints the exact attribute value — flags, timestamp, agent, UUID — which is the primary artefact for the evidence log, and it changes nothing.","The near misses are the incident-killers: deleting the attribute destroys the evidence you were sent to capture, and a recursive clear or write taints every attribute on the mounted image. The bare form without -p lists only attribute names, which is why it scores partially — the log needs the value, not the name."]},"hint":"The evidence rule in the banner is binding: the command must only read.","explain":["The canonical command is xattr -p com.apple.quarantine /Volumes/FlashUpdate/FlashUpdate.app — print mode, the named attribute, the mounted sample.","It is graded element by element. Deleting, recursively clearing, or writing attributes are flagged as dangerous near misses under the read-only evidence rule."]},{"id":"e02","type":"match","perspective":"defender","scenario":{"summary":"What each signal can and cannot prove","text":["The INC-5117 evidence file mixes five signals with different evidential weight, and legal will challenge any overclaim.","Match each signal to exactly what it proves — no more."],"artefacts":[{"label":"ARTEFACT 1 — Evidence-file cover note","kind":"ticket","lines":["INC-5117 evidence file: five signals, different sources and clocks.","Legal caution: each signal may be quoted only for what it actually proves."]},{"label":"ARTEFACT 2 — Collection times","kind":"text","lines":["spctl verdict: collected 09:41, run on the mounted sample.","Log slice: exported 09:52. xattr -p on the launched copy /tmp/stage/FlashUpdate.app: 09:47 — no such attribute.","ESF event: recorded 09:33:05. Signature check: run on the evidence copy at 10:05."]}]},"question":"Match each signal to what it proves.","pairs":[{"left":"spctl on the mounted sample: accepted, source=Notarized Developer ID","right":"The policy verdict is positive — it does not prove who removed the flag"},{"left":"Unified log: staged-copy launch with no assessment record","right":"The flag was absent at launch — the assessment never ran"},{"left":"xattr -p on the launched copy: no such attribute","right":"Proves the flag is gone now; not who removed it"},{"left":"ESF: user shell ran xattr -d on the staged copy seconds after download","right":"Strongest proof of an active removal step"},{"left":"codesign --verify: valid","right":"The bundle was not modified after signing"}],"hint":"Separate what each line proves about the past from what it proves about the present.","explain":["The accepted verdict and the valid signature both describe state, not history: the bundle passes now and was not modified after signing — neither line says who removed the flag or when.","The missing assessment record proves the check never ran at the staged-copy launch, which is the T1553.001 outcome. The xattr -p result on the launched copy proves only the present absence, while the ESF removal event is the one signal that shows an actor taking the action — the strongest single proof in the file."]},{"id":"e03","type":"order","perspective":"defender","scenario":{"summary":"Sequence for the wipe request on MAC-FIN-02","text":["Legal has placed INC-5117 under evidence hold, but the CISO's wipe request is already on the desk. The order you set decides whether the analysis survives the wipe.","Order the six actions from first to last."],"artefacts":[{"label":"ARTEFACT 1 — Legal hold memo","kind":"ticket","lines":["INC-5117 placed under evidence hold at 10:12.","Requirement: the analysis must survive the pending wipe request."]},{"label":"ARTEFACT 2 — Wipe request, as filed","kind":"ticket","lines":["Requester: CISO office. Scope: MAC-FIN-02 full reimage tonight.","Status: waiting on IR sequencing."]}]},"question":"Put the actions in the correct order.","steps":["Keep the host isolated and record the mounted volumes and attribute state","Export the unified log slice covering download to launch","Copy the DMG and the app bundle to read-only evidence storage with hashes","Run read-only verdict and signature checks on the copies","Search fleet telemetry for the download domain and the removal pattern","Approve eradication and the reimage request only after evidence is secured"],"hint":"The wipe request is last for a reason: everything before it must survive the wipe.","explain":["The first three steps freeze and duplicate everything volatile: live attribute state, the log window, and hashed copies of the payload. Nothing after that point can destroy them.","The read-only checks then characterize the copies, the fleet search turns one host into a scope, and only when the evidence is secured is the wipe approved — approving it first would have deleted the case."]},{"id":"e04","type":"single","perspective":"defender","scenario":{"summary":"Wipe in ten minutes or hold?","text":["The CISO gives you ten minutes to decide on MAC-FIN-02. Two signals point in opposite directions, and part of the record is missing.","The artefacts below are everything the board will see, and the answer must survive legal reading."],"artefacts":[{"label":"ARTEFACT 1 — Ticket INC-5117 (excerpts)","kind":"ticket","lines":["User: Dana K., finance. App launched once; no first-launch warning.","Download link: hxxp://flash-update[.]example[.]com/get (proxy-blocked domain, new since Monday).","Hash of DMG not retained by the proxy."]},{"label":"ARTEFACT 2 — spctl on the mounted sample","kind":"code","lines":["/Volumes/FlashUpdate/FlashUpdate.app: accepted","source=Notarized Developer ID","origin=Developer ID Application: BrightCode Ltd (T8QK2L9M4P)"]},{"label":"ARTEFACT 3 — Unified log slice (incomplete window)","kind":"log","filter":true,"lines":["09:32:58 Safari: download finished: FlashUpdate.dmg → /Users/dkerr/Downloads","09:33:02 kernel: hfs: mounted FlashUpdate at /Volumes/FlashUpdate (user open)","09:33:03 procmon: /bin/zsh: cp -R /Volumes/FlashUpdate/FlashUpdate.app /tmp/stage/","09:33:05 procmon: /bin/zsh -c xattr -d com.apple.quarantine /tmp/stage/FlashUpdate.app","… buffer rotated: 09:33:06–09:34:30 not retained …","09:34:41 launchd: /tmp/stage/FlashUpdate.app exec — no assessment record in window"]},{"label":"ARTEFACT 4 — Routine host noise, same window","kind":"text","lines":["MAC-FIN-02 scanner: scheduled QuickLook scan previewed 14 files at 09:40; no threats found.","Printer FIN-HP-3 queue: 2 jobs, both printed successfully."]}]},"question":"The CISO wants the wipe decision now. Which call is defensible?","options":[{"id":"a","text":"Approve the wipe now — a removed quarantine flag proves compromise beyond doubt"},{"id":"b","text":"Close the ticket as false positive — the notarized verdict means nothing happened"},{"id":"c","text":"Hold the wipe: isolate the host, finish the evidence copy, and request malware analysis first"},{"id":"d","text":"Uninstall the app and return the Mac to the user without further checks"}],"correct":["c"],"hint":"The ten-minute clock is for the decision, not for the reimage; weigh what the wipe would destroy.","explain":["The conflicting signals resolve in a fixed order: the removal event plus the launch without any assessment record outweigh the positive verdict, because the verdict describes the bundle while the removal describes the actor's action — the technique is the removal itself. The rotated buffer and the unretained hash leave the scope unknown, which is exactly why you do not finalize anything yet.","Wiping now destroys the mounted sample, the staging state, and the chance to answer “which other hosts”. Closing as false positive ignores the removal event, and returning the Mac without checks re-exposes the user. Holding with isolation, evidence completion, and a malware-analysis request is the call that survives legal scrutiny — the noise artefact changes none of it."]},{"id":"e05","type":"drag","perspective":"defender","scenario":{"summary":"Seven signals, three lanes — sorted by weight","text":["The INC-5117 board pack sorts seven collected signals by evidential weight before the wipe decision is minuted.","Two of them answer the same question — whether the bypass happened — with opposite weight: one is a state description, one is an observed action, and only the action may carry the finding. The last lane holds signals that cannot move until more data arrives."],"artefacts":[{"label":"ARTEFACT 1 — Board review note","kind":"ticket","lines":["INC-5117 signals for the wipe decision, collected 09:41–10:05.","Rule: a signal may support only the lane its evidential weight allows."]},{"label":"ARTEFACT 2 — Source and clock list","kind":"text","lines":["Removal event: ESF, recorded 09:33:05 on the staged copy.","Verdict: spctl on the mounted sample, 09:41. Signature check: evidence copy, 10:05.","Log slice: exported 09:52, buffer rotated mid-window. Proxy: no DMG hash retained."]}]},"question":"Sort each signal into the correct lane.","zones":[{"id":"z1","label":"Decisive — the finding stands on these","accepts":["i1","i2"]},{"id":"z2","label":"True but not decisive — describes state only","accepts":["i3","i4"]},{"id":"z3","label":"Inconclusive — collect more","accepts":["i5","i6","i7"]}],"items":[{"id":"i1","text":"Shell in the user session stripped the flag from the staged copy at 09:33:05"},{"id":"i2","text":"Staged copy launched at 09:34:41; no assessment record in the retained window"},{"id":"i3","text":"spctl verdict on the mounted sample: accepted (Notarized Developer ID)"},{"id":"i4","text":"codesign on the evidence copy: valid — not modified after signing"},{"id":"i5","text":"Unified log buffer rotated; 84 seconds of the incident window not retained"},{"id":"i6","text":"Proxy retained no hash of the downloaded DMG"},{"id":"i7","text":"Helpdesk notes say the user approved the app, but no approval record exists"}],"hint":"A signal earns the decisive lane only by showing the act; state descriptions and gaps cannot carry the finding.","explain":["The removal event and the launch without an assessment record are the only two signals that show the technique happening, so the finding stands on them. The accepted verdict and the valid signature are true, but both describe the bundle's state — neither can decide whether an actor bypassed the check, which is exactly the conflict the lanes resolve.","The rotated buffer, the unretained hash, and the approval claim with no matching record all lack the data to move: the gap hides part of the timeline, the missing hash blocks fleet scoping, and the claim has no record behind it. Each stays in the inconclusive lane until the extended export, the proxy re-query, or the helpdesk record check comes back."]},{"id":"e06","type":"blank","perspective":"defender","scenario":{"summary":"Policy findings for the MDM review","text":["The MDM review needs one precise paragraph that explains how the bypass worked although the policy was locked, and what the report cannot claim.","Complete the sentence with the three missing words."],"artefacts":[{"label":"ARTEFACT 1 — MDM inventory, MAC-FIN-02","kind":"code","lines":["guardrail.policy: GatekeeperLevel = IdentifiedDevelopers (set by MDM)","sip: enabled","localAdmins: dkerr added 2024-05-02 (exception: approved by R. Meer)","image.built: 2024-03-01 (golden image rebuild)"]},{"label":"ARTEFACT 2 — Incident window note","kind":"text","lines":["Incident window: 2024-05-14, 09:31–09:35.","Host rebuilt from a golden image on 2024-03-01; earlier log history not retained locally."]}]},"question":"Type the three missing words.","blanks":[{"before":"The Gatekeeper policy was ","answer":["locked","enforced"],"after":" by MDM, so no user could choose Anywhere; ","hint":"what MDM does to the setting"},{"before":"the bypass removed the com.apple.","answer":["quarantine"],"after":" attribute instead, ","hint":"the attribute named in the tickets"},{"before":"and the log window before 2024-03-01 remains ","answer":["missing","absent","unavailable","incomplete"],"after":" because the host was rebuilt from a golden image.","hint":"what an empty window is called"}],"hint":"Word one describes the MDM state, word two the attribute, word three the data you do not have.","explain":["The policy was locked: the MDM inventory shows the guardrail is set by MDM, so the Anywhere route was closed — the bypass never needed it, because removing the attribute happens below the policy level.","That is the paragraph's second fact: the com.apple.quarantine attribute was the target. The third fact is a limit on the report: the pre-rebuild log window is missing, so no historical claims about earlier activity on this host can be made."]},{"id":"e07","type":"terminal","perspective":"defender","scenario":{"summary":"One defensible line for the change board — INC-5223","text":["The change board asks for a defensible one-line answer covering both the fleet policy state and the verdict for the installed FlashUpdate.app on MAC-MKT-09.","Context you already have: the user moved the app to /Applications before launching it — remember what that move avoids. You are on the isolated host as ir.","Build one compound command: first the global assessment state, then the full verbose executable verdict for the installed bundle. Nothing may change state."],"artefacts":[{"label":"ARTEFACT 1 — Change-board request","kind":"ticket","lines":["One defensible line covering: (1) global assessment state of MAC-MKT-09, (2) full verbose verdict for the installed FlashUpdate.app.","Read-only checks only; nothing may change state."]},{"label":"ARTEFACT 2 — Context note","kind":"text","lines":["The user moved the app to /Applications before launching it.","The board accepts one compound command as the answer."]}]},"question":"Type the compound command the change board asked for.","terminal":{"prompt":"ir@mac-mkt-09","banner":["isolated host — INC-5223 — read-only checks only"],"solution":"spctl --status && spctl -a -vv -t exec /Applications/FlashUpdate.app","elements":[{"label":"checks the system-wide assessment policy","re":"spctl\\s+--status"},{"label":"chains both checks in one line","re":"&&"},{"label":"assesses the installed app","re":"spctl\\s+-a"},{"label":"verbose verdict (-vv)","re":"(^|\\s)-vv( |$)"},{"label":"executable bundle type (-t exec)","re":"-t\\s+exec( |$)"},{"label":"targets the installed bundle","re":"/Applications/FlashUpdate\\.app"}],"outputs":[{"re":"--status && spctl","lines":["assessments enabled","/Applications/FlashUpdate.app: rejected (source=Unnotarized Developer ID)"]},{"re":"^spctl","lines":["/Applications/FlashUpdate.app: rejected (source=Unnotarized Developer ID)"]}],"nearMiss":[{"re":"spctl\\s+--add","msg":"spctl --add whitelists the app permanently — a state change that would silently re-approve a malicious bundle for every user"},{"re":"--master-disable","msg":"Turning assessments off answers no question about this app and changes a fleet-visible security setting"}],"nearMissSample":"spctl --add /Applications/FlashUpdate.app","partialSample":"spctl -a -vv -t exec /Applications/FlashUpdate.app","hint":"The output must answer two questions in one line: the state of the whole Mac's checks, and the verdict for this one app.","explain":["The compound command answers both questions in the order the board asked: spctl --status reports the global policy state, and spctl -a -vv -t exec on the installed bundle delivers the verbose verdict — chained with && so one line produces both outputs.","The app-only form is the partial path: correct verdict, missing policy state. The near misses both change state — --add would whitelist the malicious bundle permanently, and --master-disable would disable the very control the board is auditing."]},"hint":"Two answers, one line, chained — policy state first, app verdict second.","explain":["The canonical command is spctl --status && spctl -a -vv -t exec /Applications/FlashUpdate.app: the global state, then the per-app verdict, in the board's order.","It is graded element by element, and the destructive variants — adding an exception or disabling assessments — are flagged as near misses because they alter the state the board is auditing."]},{"id":"e08","type":"branch","perspective":"defender","scenario":{"summary":"Bundlore staging with a log gap — INC-5223","text":["INC-5223, MAC-MKT-09. ESF recorded the full staging run of a Bundlore-style installer: DMG mount, payload copy, two attribute-removal calls, then two launches with no assessment records.","The unified log buffer rotated and a 90-second window is missing.","The user is in the local admin group — an exception approved last quarter.","Marketing needs the Mac for a launch event in two days, and the board decision comes at the end of the branch."],"artefacts":[{"label":"ARTEFACT 1 — ESF event slice, MAC-MKT-09","kind":"log","filter":true,"lines":["21:03:11 esf: disk-image mount FlashUpdate.dmg → /Volumes/FlashUpdate","21:03:26 esf: /bin/zsh: cp -R /Volumes/FlashUpdate/.helper /tmp/stage/","21:03:27 esf: /bin/zsh: xattr -d com.apple.quarantine /tmp/stage/.helper","21:03:28 esf: /bin/zsh: xattr -d com.apple.quarantine /tmp/stage/TuneUp.plugin","21:03:41 launchd: /tmp/stage/.helper exec (no assessment record)","21:04:02 launchd: /tmp/stage/TuneUp.plugin exec (no assessment record)"]},{"label":"ARTEFACT 2 — Threat-intel note","kind":"text","lines":["Bundlore: macOS adware; staged installs; clears quarantine attributes before launch;","persists via browser extension and periodic payload refreshes.","Staging behaviour overlaps the Shlayer profile."]},{"label":"ARTEFACT 3 — MDM inventory, MAC-MKT-09","kind":"code","lines":["policy: IdentifiedDevelopers (locked)","sip: enabled","localAdmins: mkeller (exception, approved Q1)"]}]},"question":"Work the branch to the decision the board needs.","branch":{"steps":[{"prompt":"The log gap sits between the second launch and the next retained record. What do you record?","options":[{"id":"a","text":"A clean host — the missing records prove nothing happened"},{"id":"b","text":"Confirmed evasion with a documented evidence gap; request the extended log export"},{"id":"c","text":"An agent outage — the gap proves the telemetry is broken"}],"correct":"b","outcome":"You record the gap and file the export request; the ESF slice remains the timeline backbone."},{"prompt":"The CISO asks whether to push the fleet-wide “reimage on any adware alert” policy now, while sample analysis is still running.","options":[{"id":"a","text":"Push it now — reimaging on every adware alert is the documented best practice"},{"id":"b","text":"Hold the fleet policy until analysis confirms scope and indicators; reimage decisions stay per-host"},{"id":"c","text":"Disable ESF logging until the noise dies down"}],"correct":"b","outcome":"The CISO accepts the hold; eradication stays per-host and evidence-driven."}],"final":{"question":"Which single action do you take right now?","options":[{"id":"a","text":"Isolate the host, keep the staging folder read-only, and hunt the fleet for the hash"},{"id":"b","text":"Reimage MAC-MKT-09 tonight so the marketing launch event can go ahead on a clean Mac"},{"id":"c","text":"Wait for the next Bundlore payload refresh cycle before touching the host at all"},{"id":"d","text":"Return the Mac to the user after installing a new antivirus product on it"}],"correct":["a"]}},"hint":"The policy was already as strict as it can be; what you still lack is proof of scope.","explain":["The ESF slice is intact and shows the full chain — mount, copy, two removals, two unassessed launches — so the host is not clean and the telemetry is not broken; the rotated buffer only limits the unified log's part of the timeline. Recording confirmed evasion with a documented gap keeps the claim honest.","The fleet-wide reimage-on-alert policy is best practice in general and wrong here: analysis is unfinished, so the indicators are not confirmed and a mass-reimage rule would destroy evidence on every future alert. The right immediate action preserves what exists — isolation, read-only staging folder, fleet hunt — instead of betting on a wipe or on waiting."]},{"id":"e09","type":"prioritize","perspective":"defender","scenario":{"summary":"Chain-of-custody order for the INC-5223 media","text":["The INC-5223 media is ready to move: the DMG and the app bundle sit on the isolated host, and the IR manager wants the handling sequence fixed before the first transfer.","The memo below binds every step; one step's position comes from the custody rule, not from the clock."],"artefacts":[{"label":"ARTEFACT 1 — Chain-of-custody memo, IR manager","kind":"ticket","lines":["Rule for INC-5223 media: nothing leaves the isolated host until its custody record exists in the evidence log.","Every transfer needs a named collector and a hash that has been verified against the registered value."]},{"label":"ARTEFACT 2 — Media status","kind":"text","lines":["Originals: DMG and app bundle on the isolated host.","Evidence storage: read-only share, awaiting first transfer.","Working copies: none yet."]}]},"question":"Order the evidence-handling steps from first to last.","steps":["Hash the original DMG and app bundle on the isolated host","Register the hashes and the collector identity in the evidence log","Copy the images to read-only evidence storage","Re-hash the copies and compare against the registered values","Restrict the evidence share to the named responders","Release verified working copies to the analysis bench"],"hint":"Custody records and verified hashes gate every move; the analysis bench receives the last copy.","explain":["Hashing the originals comes first because the hash is the identity every later step checks against; the custody record then exists before anything moves, which is what the memo demands — copying before registering would breach the rule even though the clock allows it.","The copies are re-hashed against the registered values so any transfer damage shows immediately, access is narrowed before anyone else touches the share, and only then does the analysis bench receive verified working copies. The originals never leave the isolated host."]},{"id":"e10","type":"multi","perspective":"defender","scenario":{"summary":"What the valid ticket does and does not mean","text":["BrightCode's signature is valid and the notarization ticket is stapled, yet the app is confirmed malicious — a malicious Developer ID, not a forgery.","The conclusions will be quoted in the board pack, so each must survive the wording test."],"artefacts":[{"label":"ARTEFACT 1 — Verifier output on the sample","kind":"code","lines":["/Applications/FlashUpdate.app: valid on disk","satisfies its Designated Requirement","staple: present, ticket valid"]},{"label":"ARTEFACT 2 — Analysis verdict excerpt","kind":"ticket","lines":["Sample analysis: BrightCode build confirmed malicious; the Developer ID is real, not forged.","Conclusions must separate what the ticket proves from what it does not."]}]},"question":"Select the TWO correct conclusions.","options":[{"id":"a","text":"Notarization proves an automated Apple scan passed at submission time, not that the vendor is benign"},{"id":"b","text":"A valid stapled ticket means the bundle was not modified after notarization"},{"id":"c","text":"A valid signature proves the app is safe to run"},{"id":"d","text":"Gatekeeper evaluates the vendor's business intent before approving"},{"id":"e","text":"A valid ticket removes the need for launch telemetry"}],"correct":["a","b"],"hint":"Each selected conclusion may claim only what the verifier output and the analysis verdict prove — no more.","explain":["Notarization is a point-in-time statement: an automated scan passed when the developer submitted the build, and the staple proves the exact bundle you hold is the one that was approved — unchanged since.","Neither statement says the vendor is trustworthy, and Gatekeeper has no view into business intent. That is why a malicious vendor with a real Developer ID passes the policy check — and why launch telemetry stays mandatory regardless of any ticket."]},{"id":"e11","type":"match","perspective":"defender","scenario":{"summary":"Five questions, five sources — one conflict, one gap","text":["The INC-5223 lessons-learned doc maps five questions to telemetry sources, but the last edit left two errors the review caught.","Two sources now claim the same question with different clocks, and one question has no collected source at all. Repair the mapping before the doc ships to the fleet admins."],"artefacts":[{"label":"ARTEFACT 1 — Lessons-learned doc header","kind":"ticket","lines":["INC-5223 lessons learned: five questions the review must answer with fleet telemetry.","Rule: each question is answered by exactly one source — or by an explicit coverage gap."]},{"label":"ARTEFACT 2 — Clock review note","kind":"text","lines":["Unified log export: helper launch recorded 21:04:41 (write time).","ESF exec event: the same launch recorded 21:04:38 (event time).","Sources on hand: unified log (forwarded), ESF events, process monitoring on attribute tools, MDM inventory, proxy and DNS records."]}]},"question":"Match each question to the source that answers it — or to the honest gap.","pairs":[{"left":"When did the first bypass launch happen — log says 21:04:41, ESF says 21:04:38","right":"ESF wins — the event-time record is the clock of record"},{"left":"Did the first-launch assessment run for the helper","right":"Unified log only — the assessment records exist there"},{"left":"Who removed the flag, and with what process","right":"Process monitoring on attribute tools — the actor lives there"},{"left":"Which policy the fleet actually enforces","right":"MDM inventory — the signed profile, not the local setting"},{"left":"What the helper fetched after launch","right":"No collected source covers it — the doc states the gap"}],"hint":"One question has two claimants and one has none; the doc may not fill a gap with a guess.","explain":["The launch-time question has two claimants with different clocks: the unified log line is a write time, the ESF exec event is taken at the event itself, so ESF wins the clock. The same unified log still owns the assessment question, because the skip records exist only there — losing one question does not remove the source from the doc.","The removal question belongs to process monitoring on attribute tools, the policy question to the MDM inventory, and the fleet scope to proxy and DNS records. The post-launch fetch question has no collected source, so the doc states the gap instead of borrowing a source that cannot answer it."]},{"id":"e12","type":"order","perspective":"attacker","scenario":{"summary":"Bundlore-style chain, attacker view","text":["For the ATT&CK mapping you reconstruct the attacker's side of INC-5223 from the captured installer.","Order the five attacker steps for the mapping session; one step's position is fixed by a dependency stated in the capture, not by the script's clock."],"artefacts":[{"label":"ARTEFACT 1 — Lab ticket MAL-091 note","kind":"ticket","lines":["Captured installer profile matches Bundlore: staged installs, attribute clearing, quiet launches.","Mapping session: attacker side first, defender view follows."]},{"label":"ARTEFACT 2 — Captured installer excerpt","kind":"code","lines":["stage: cp -R /Volumes/MediaCodec/.helper /tmp/.stage/","stage: xattr -d com.apple.quarantine /tmp/.stage/.helper","stage: launch /tmp/.stage/.helper","note: the refresh channel opens only after the first unassessed launch registers the install"]}]},"question":"Put the attacker's steps in the correct order.","steps":["Bait the user with a codec installer page (hxxp://media-codec[.]example[.]com/top)","Run the staged installer that drops helpers into a temp folder","Clear the quarantine attributes on the staged payloads","Launch the helpers with no first-launch warning","Refresh configurations and payloads through the channel that first quiet launch registered"],"hint":"The chain must stay unassessed from download to launch; one broken link stops it.","explain":["The bait page starts the chain, and the staged installer turns the download into dropped helpers while everything still carries the quarantine attribute from the network fetch.","The attribute clearing is the T1553.001 core: it must happen before launch, or the first-launch check fires. The quiet launch then activates the helpers — and registers the install with the C2, which is what opens the refresh channel; the periodic refreshes that follow keep the setup alive. Persistence and payload rotation, not a new bypass."]},{"id":"e13","type":"single","perspective":"defender","scenario":{"summary":"Accepted verdict against a removal event — which decides?","text":["On MAC-SUP-05 the two signals below were collected four seconds apart, and the ticket must state whether T1553.001 occurred.","Legal will read the wording, so the deciding rule must be explicit."],"artefacts":[{"label":"ARTEFACT 1 — spctl on MAC-SUP-05","kind":"code","lines":["/Applications/FlashUpdate.app: accepted","source=Notarized Developer ID"]},{"label":"ARTEFACT 2 — ESF and log slice","kind":"log","filter":true,"lines":["09:12:03 esf: Safari download finished: FlashUpdate.dmg","09:12:07 esf: /bin/zsh: xattr -d com.apple.quarantine /Users/sup05/Downloads/…","09:12:31 launchd: app exec — no assessment record in window"]}]},"question":"Which signal decides, and why?","options":[{"id":"a","text":"The spctl verdict: an accepted app cannot be part of a bypass"},{"id":"b","text":"The removal event: the technique is the attribute removal itself, regardless of the later verdict"},{"id":"c","text":"Neither: the signals cancel out, so classify as unknown"},{"id":"d","text":"The absence of an assessment record alone: without it nothing can be said"}],"correct":["b"],"hint":"Both artefacts are true; the rule you state must decide which of them answers the ticket's classification question.","explain":["T1553.001 is defined by defeating the first-launch check, and the ESF event shows exactly that defeat happening: an actor removed the attribute seconds after download. The later accepted verdict describes the bundle's policy state, not the actor's action — both signals are true, and only one of them is the technique.","Calling it unknown or relying on the missing record alone would misread evidence that is actually decisive. The ticket records: T1553.001 confirmed by the removal event; verdict positive but irrelevant to the classification."]},{"id":"e14","type":"drag","perspective":"dual","scenario":{"summary":"Same artefacts, two workflows","text":["The incident retrospective has one slide left: six artefacts from INC-5223, each of which serves one side's workflow.","Sort them before the slide goes to the print shop."],"artefacts":[{"label":"ARTEFACT 1 — Retro slide note","kind":"ticket","lines":["Slide: same artefacts, two workflows.","Rule: place each artefact on the side whose workflow it serves; no shared cards."]},{"label":"ARTEFACT 2 — Source list","kind":"text","lines":["Artefacts drawn from INC-5223: dropper script, ESF telemetry, DMG samples, hunt queries, host inventory, tuning tickets."]}]},"question":"Sort each artefact into the correct column.","zones":[{"id":"z1","label":"Serves the attacker's workflow","accepts":["i1","i3","i5"]},{"id":"z2","label":"Serves the defender's workflow","accepts":["i2","i4","i6"]}],"items":[{"id":"i1","text":"xattr -d com.apple.quarantine inside a dropper script"},{"id":"i2","text":"The same xattr event surfaced in ESF telemetry"},{"id":"i3","text":"A fresh tainted DMG repacked for every campaign wave"},{"id":"i4","text":"The DMG hash watched by fleet hunt queries"},{"id":"i5","text":"Moving the app to /Applications to avoid translocation"},{"id":"i6","text":"Tuned rules that flag translocation path sightings as expected noise"}],"hint":"For each artefact ask whose workflow it serves: the one getting code past the check, or the one watching for it.","explain":["Attacker perspective: the script edit, the repacked DMG, and the /Applications move all exist to keep the payload unassessed and unpredictable — hash rotation defeats blocklists, and the move defeats translocation.","Defender perspective: the same three artefacts, observed as telemetry, hashes, and tuned rules, are exactly what makes the bypass visible and repeatable to hunt — the event fires the alert, the hash scopes the fleet, and the tuning keeps the signal clean."]},{"id":"e15","type":"blank","perspective":"defender","scenario":{"summary":"Close-out summary wording for the change board","text":["The close-out summary goes to the change board. It must not claim more than the evidence holds: three of the four affected Macs have complete timelines; MAC-FIN-02's window is partial.","Draft the fixed wording with the three missing words."],"artefacts":[{"label":"ARTEFACT 1 — Change-board memo","kind":"ticket","lines":["Close-out summary due with the INC-5223 pack.","Rule: the summary must not claim more than the evidence holds."]},{"label":"ARTEFACT 2 — Export status","kind":"text","lines":["MAC-FIN-02 extended log export: requested, not yet arrived.","Other three hosts: timelines complete."]}]},"question":"Type the three missing words.","blanks":[{"before":"The installer reached the Macs as a DMG carrying the com.apple.","answer":["quarantine"],"after":" attribute, ","hint":"the attribute named in all four tickets"},{"before":"and the fleet-wide hunt found the same pattern on four Macs; for one Mac the log window is ","answer":["partial","incomplete","missing"],"after":", ","hint":"the state of the evidence for MAC-FIN-02"},{"before":"so the report marks that Mac's finding as ","answer":["provisional","preliminary","unconfirmed"],"after":" until the extended export arrives.","hint":"the wording for a finding that can still change"}],"hint":"The summary must not claim more than the evidence holds; name what is missing.","explain":["The attribute fact is stated plainly: the DMG carried the com.apple.quarantine attribute, which is what the removal step targeted on every host.","The fleet finding holds for four Macs, but MAC-FIN-02's window is partial — so the report marks that finding provisional until the extended export arrives. Overclaiming a complete result on incomplete evidence is exactly what the board would strike down."]}]}</script>
<script>
(function () {
  'use strict';

  /* ============================ utilities ============================ */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function mulberry32(seed) {
    var t = seed >>> 0;
    return function () {
      t += 0x6D2B79F5;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffled(arr, rnd) {
    var a = arr.slice(), i, j, tmp;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(rnd() * (i + 1));
      tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function fmt1(n) { return (Math.round(n * 10) / 10).toFixed(1); }
  function fmt2(n) { return (Math.round(n * 100) / 100).toFixed(2); }
  function fmtPct(sum, count) { return count > 0 ? Math.round((sum / count) * 100) : 0; }
  function hashId(s) {
    var h = 0, i;
    for (i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h;
  }
  function exSeed(ex, salt) { return ((S.seed ^ 0x9E3779B9) * 2654435761 + hashId(ex.id) * 97 + salt) >>> 0; }

  /* ============================ data ============================ */
  var DATA = JSON.parse($('exam-data').textContent);
  var EXS = DATA.exercises;
  var TOTAL = EXS.length;
  var BUDGET = (DATA.estimatedMinutes || 25) * 60;
  var PASSMARK = DATA.passMark || 70;
  var SEVCLS = { 'EASY': 'sev-easy', 'MEDIUM': 'sev-medium', 'HARD': 'sev-hard', 'EXTREMELY HARD': 'sev-extreme' };
  var byId = {};
  EXS.forEach(function (e) { byId[e.id] = e; });

  /* ============================ state ============================ */
  var S = {
    screen: 'intro',        // intro | exam | review | results
    attempt: 0,
    order: [],
    pos: 0,
    answers: {},            // exId -> widget state
    results: {},            // exId -> graded result
    skipped: [],            // exIds in the skip pool (never answered yet)
    hintUsed: {},
    creditSum: 0,
    answeredCount: 0,
    state: 'RUNNING',       // RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED
    resumeState: null,
    remaining: BUDGET,
    pauseAccum: { manual: 0, autoCheck: 0 },
    posted: false,
    mode: 'main',           // main | review
    reviewList: [],
    seed: 1,
    checkedId: null,
    exTimer: null,          // { exId, remaining } for per-exercise timed terminal exercises
    handshake: null
  };

  /* ============================ timer ============================ */
  var lastTick = Date.now();
  setInterval(function () {
    var now = Date.now();
    var dt = (now - lastTick) / 1000;
    lastTick = now;
    if (dt < 0 || dt > 2) { dt = 0.25; }
    if (S.state === 'RUNNING') {
      S.remaining -= dt;
      if (S.remaining <= 0) { S.remaining = 0; updateHeader(); endByTimeout(); return; }
      if (S.exTimer && !S.results[S.exTimer.exId] && S.screen === 'exam') {
        S.exTimer.remaining -= dt;
        var et = $('ex-timer-clock');
        if (et) { et.textContent = fmtClock(S.exTimer.remaining); }
        if (S.exTimer.remaining <= 0) { S.exTimer.remaining = 0; doCheck(true); }
      }
      updateTimerClock();
    } else if (S.state === 'PAUSED_MANUAL') {
      S.pauseAccum.manual += dt;
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      S.pauseAccum.autoCheck += dt;
    }
  }, 250);

  function updateTimerClock() {
    var el = $('hdr-clock');
    if (el) { el.textContent = fmtClock(S.remaining); }
  }
  function setState(next) {
    S.state = next;
    renderTimerPill();
    renderPauseOverlay();
  }
  function renderTimerPill() {
    var pill = $('hdr-timer');
    if (!pill) { return; }
    var clock = '<span class="t-clock" id="hdr-clock">' + fmtClock(S.remaining) + '</span>';
    if (S.state === 'RUNNING') {
      pill.className = 'pill pill-timer st-run';
      pill.innerHTML = '<span class="t-state">▶ Running</span>' + clock;
    } else if (S.state === 'PAUSED_MANUAL') {
      pill.className = 'pill pill-timer st-pause';
      pill.innerHTML = '<span class="t-state">⏸ PAUSED — manual (press Resume)</span>' + clock;
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      pill.className = 'pill pill-timer st-pause';
      pill.innerHTML = '<span class="t-state">⏸ PAUSED — reviewing feedback (resumes on Next)</span>' + clock;
    } else {
      pill.className = 'pill pill-timer st-end';
      pill.innerHTML = '<span class="t-state">■ Ended</span>' + clock;
    }
  }

  /* ============================ header ============================ */
  function headerHtml() {
    var sev = DATA.severity;
    var cls = SEVCLS[sev] || 'sev-easy';
    return '<header class="hdr" id="hdr">' +
      '<div class="hdr-row">' +
        '<span class="counter" id="hdr-counter"></span>' +
        '<span class="sev ' + cls + '" id="hdr-sev"><span class="dot" aria-hidden="true"></span>' + esc(sev) + '</span>' +
        '<span class="hdr-spacer"></span>' +
        '<span class="pill pill-timer" id="hdr-timer" role="timer"></span>' +
        '<span class="pill" id="hdr-score" aria-label="Live score"></span>' +
      '</div>' +
      '<div class="hdr-row">' +
        '<button type="button" class="btn" id="btn-hint">? Hint</button>' +
        '<button type="button" class="btn" id="btn-skip">Skip »</button>' +
        '<button type="button" class="btn" id="btn-pause">⏸ Pause</button>' +
        '<div class="progress" role="progressbar" id="hdr-progress" aria-label="Exam progress" aria-valuemin="0" aria-valuemax="' + TOTAL + '" aria-valuenow="0">' +
          '<div class="progress-fill" id="progress-fill"></div>' +
        '</div>' +
      '</div>' +
    '</header>';
  }
  function updateHeader() {
    var ex = currentEx();
    var counter = $('hdr-counter');
    if (counter) {
      if (S.screen === 'results') {
        counter.textContent = 'Exam complete';
      } else {
        var n = S.pos + 1;
        counter.textContent = (S.mode === 'review' ? 'Review · ' : '') + 'Exercise ' + n + ' of ' + TOTAL;
      }
    }
    var score = $('hdr-score');
    if (score) {
      var pct = fmtPct(S.creditSum, S.answeredCount);
      score.innerHTML = 'Score <b>' + fmt1(S.creditSum) + '</b>&nbsp;/&nbsp;' + S.answeredCount + ' · ' + pct + '%';
    }
    var hint = $('btn-hint'), skip = $('btn-skip'), pause = $('btn-pause');
    var answered = ex && !!S.results[ex.id];
    if (hint) {
      hint.disabled = answered || !!S.hintUsed[ex ? ex.id : ''] || S.state !== 'RUNNING' && S.state !== 'PAUSED_AUTO_CHECK';
      hint.setAttribute('aria-label', 'Hint (costs 10% of this exercise credit, one use only)');
    }
    if (skip) {
      skip.disabled = answered || S.state !== 'RUNNING';
      skip.setAttribute('aria-label', 'Skip this exercise and move it to the skipped pool');
    }
    if (pause) {
      var manual = S.state === 'PAUSED_MANUAL';
      pause.innerHTML = manual ? '▶ Resume' : '⏸ Pause';
      pause.disabled = S.state === 'ENDED';
      pause.setAttribute('aria-label', manual ? 'Resume the exam' : 'Pause the exam manually (hides the exercise)');
    }
    var fill = $('progress-fill');
    if (fill) {
      var done = S.answeredCount + S.skipped.length;
      var pctW = TOTAL > 0 ? Math.round((done / TOTAL) * 100) : 0;
      fill.style.width = pctW + '%';
      var pb = $('hdr-progress');
      if (pb) { pb.setAttribute('aria-valuenow', String(done)); }
    }
  }

  /* ============================ intro screen ============================ */
  function renderIntro() {
    S.screen = 'intro';
    var intro = DATA.intro;
    var kw = (intro.keywords || []).map(function (grp) {
      return '<div class="kw-theme"><h3>' + esc(grp.theme) + '</h3><ul>' +
        grp.items.map(function (k) { return '<li>' + esc(k) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    var html =
      '<div class="intro">' +
        '<section class="intro-strip" aria-label="Exam facts">' +
          '<h1>' + esc(DATA.mitreId) + ' — ' + esc(DATA.mitreName) + '</h1>' +
          '<div class="intro-sub">' + esc(DATA.objectType) + ' · MITRE ATT&CK · ' + esc(DATA.severity) + ' practice exam</div>' +
          '<div class="factrow">' +
            '<span class="fact"><b>' + TOTAL + '</b> exercises</span>' +
            '<span class="sev ' + (SEVCLS[DATA.severity] || 'sev-easy') + '"><span class="dot" aria-hidden="true"></span>' + esc(DATA.severity) + '</span>' +
            '<span class="fact">Estimated time: <b>' + DATA.estimatedMinutes + ' min</b></span>' +
            '<span class="fact">Timer budget: <b>' + fmtClock(BUDGET) + '</b></span>' +
            '<span class="fact">Pass mark: <b>' + PASSMARK + '%</b></span>' +
          '</div>' +
        '</section>' +
        '<section class="intro-card"><h2>What you will learn here</h2>' +
          intro.learn.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
        '</section>' +
        '<section class="intro-card"><h2>Keywords covered in this exam</h2>' +
          '<div class="kw-grid">' + kw + '</div>' +
        '</section>' +
        '<section class="intro-card"><h2>How this exam works</h2>' +
          '<ul class="how-list">' + intro.how.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' +
          '<div class="intro-start">' +
            '<button type="button" class="btn btn-primary btn-big" id="btn-start">Start exam</button>' +
            '<span class="start-note">The timer starts when you press Start.</span>' +
          '</div>' +
        '</section>' +
      '</div>';
    var app = $('app');
    app.innerHTML = html;
    $('btn-start').addEventListener('click', startAttempt);
  }

  /* ============================ attempt control ============================ */
  function startAttempt() {
    S.attempt += 1;
    S.seed = 1 + S.attempt * 7919;
    S.order = EXS.map(function (_, i) { return i; });
    if (S.attempt > 1) {
      S.order = shuffled(S.order, mulberry32(S.seed));
    }
    S.pos = 0;
    S.answers = {};
    S.results = {};
    S.skipped = [];
    S.hintUsed = {};
    S.creditSum = 0;
    S.answeredCount = 0;
    S.pauseAccum = { manual: 0, autoCheck: 0 };
    S.posted = false;
    S.mode = 'main';
    S.reviewList = [];
    S.checkedId = null;
    S.exTimer = null;
    S.remaining = BUDGET;
    S.screen = 'exam';
    setState('RUNNING');
    renderExam();
  }
  function currentEx() {
    if (S.screen !== 'exam' && S.screen !== 'results') { return null; }
    if (S.pos < 0 || S.pos >= S.order.length) { return null; }
    return EXS[S.order[S.pos]];
  }

  /* ============================ exercise rendering ============================ */
  function scenarioLong(sc) {
    var chars = (sc.text || []).join(' ').length;
    return chars > 600 || (sc.artefacts && sc.artefacts.length >= 2);
  }
  function artefactHtml(a, idx) {
    var body;
    if (a.kind === 'log' || a.kind === 'code') {
      var lines = (a.lines || []).map(function (ln) {
        return '<span class="ln">' + highlight(ln) + '</span>';
      }).join('');
      var filter = a.filter ? '<input type="text" class="logfilter" data-filter="' + idx + '" placeholder="Filter lines (text match)" aria-label="Filter log lines">' : '';
      body = filter + '<pre class="mono loglines" data-logbody="' + idx + '">' + lines + '</pre>';
    } else {
      body = '<pre class="mono loglines">' + (a.lines || []).map(function (ln) { return esc(ln); }).join('\n') + '</pre>';
    }
    return '<div class="artefact"><div class="artefact-label"><span aria-hidden="true">▤</span>' + esc(a.label) + '</div>' + body + '</div>';
  }
  var SYN_RE = /(&quot;[^&]*?&quot;)|(\bT\d{4}(?:\.\d{3})?\b)|(--?[A-Za-z][\w-]*)|(\b[\w.\-]+(?:[\/\\][\w.\-@]+)+[\/\\]?)|(\b\d{1,3}(?:\[\.\]\d{1,3}){2,3}\b)|(\b(?:allowed|denied|accepted|rejected|granted|denied|quarantine|failed|success|error|warning|blocked|trusted|unblocked|Root|UNTRUSTED|SIGNATURE|PASS|FAIL)\b)/gi;
  function highlight(line) {
    var e = esc(line);
    return e.replace(SYN_RE, function (m, q, mid, flag, path, ip, kw) {
      if (q) { return '<span class="tok-s">' + q + '</span>'; }
      if (mid) { return '<span class="tok-m">' + mid + '</span>'; }
      if (flag) { return '<span class="tok-f">' + flag + '</span>'; }
      if (path) { return '<span class="tok-c">' + path + '</span>'; }

            var isSel = fsel.indexOf(o.id) >= 0;

              '<span class="opt-key">' + String.fromCharCode(65 + i) + '.</span><span class="opt-text">' + esc(o.text) + '</span>' +

  function renderExam() {
