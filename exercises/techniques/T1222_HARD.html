var INTRO = {"learn": "<p><b>You are the senior on-call analyst.</b> Everyone below you can name icacls and chmod. You are paid for the harder skill: telling the <b>almost identical things apart</b>. The patch job that strips a Deny ACE looks like sabotage. The quiet <span class='mono'>chattr -i</span> looks like housekeeping — and is the attacker re-opening their own backdoor. The obvious &ldquo;best practice&rdquo; response is, in this one case, the wrong one.</p><p><b>What this exam drills.</b> Sixteen exercises built from real artefact sets — EDR events, tickets, ACL dumps, file listings — where at least two answers are technically defensible and only one is right <i>here</i>. You will separate <span class='mono'>/grant</span> from <span class='mono'>/deny</span> from <span class='mono'>/remove</span> from <span class='mono'>/reset</span>; decide when an owner change on 12 hosts is software deployment and when it is not; choose the <b>least aggressive</b> correct action; and pick the right evidence-preserving sequence before anyone &ldquo;fixes&rdquo; anything. Documented procedures from Wizard Spider, BitPaymer, WastedLocker and TeamTNT anchor the scenarios.</p><p><b>Where you will use this at work:</b> any escalation queue, any detection-tuning workshop, any IR bridge where the first wrong move costs evidence. The red and blue views are two sides of the same artefacts — you will practise both.</p>", "keywords": [{"theme": "icacls near-miss discrimination", "items": ["/grant vs /deny vs /remove vs /reset", "/inheritance:r — cutting a file off its parent ACL", "Ownership first: takeown then icacls (BitPaymer, WastedLocker)", "Why /remove:d by SCCM is not the same as /deny"]}, {"theme": "Benign vs malicious T1222", "items": ["Baselining: SCCM, backups, installers, CI/CD", "The alarming-benign case: ticketed ACL cleanup", "The benign-alarming case: chattr -i on a mimicking binary", "Time, account, scope: the triage triangle at depth"]}, {"theme": "SUID, locks and least-aggressive response", "items": ["chmod 4755 — SUID root on a planted script", "chattr +i/-i on persistence paths (TeamTNT, Rocke)", "Evidence order: icacls /save before any change", "macOS staging: chflags hidden"]}, {"theme": "Detection anchors and attribution", "items": ["Windows Security Event 4670 (DACL/owner change)", "Sysmon EID 1 process events with command lines", "auditd execve rules for chmod/chattr", "Matching TTPs to Wizard Spider vs cloud worms"]}], "how": "<ul class='howlist'><li><b>Goal:</b> score at least <b>70%</b>. 16 HARD exercises: 2&ndash;3 interacting concepts, near-miss answers, artefact sets.</li><li><b>Exercise types:</b> single-choice with near-miss options, multi-select, matching, drag &amp; drop triage, fill-in-the-blank, ordering, a 3-step branching escalation, and two terminal exercises (Windows takeown, macOS chflags).</li><li><b>Timer:</b> 65:00. <b class='pz'>&#9208; Pause</b> hides the exercise. <b>Check</b> auto-stops the clock (<b class='pz'>&#9208; PAUSED — reviewing feedback</b>) until <b>Next</b> — study each explanation without pressure.</li><li><b>Partial credit:</b> multi-item exercises use <span class='ok'>(H &minus; W) &divide; N</span>; wrong picks cancel right ones. Branch steps score one item each on the final Check only.</li><li><b>Hints:</b> one per exercise, costs 10% of that exercise's credit. <b class='sk'>&#9888; Skip</b> parks exercises for the review screen; never-answered skips are excluded from the score.</li><li><b>HARD contract:</b> in roughly a third of the exercises the obvious answer is wrong. Read the account, the time, and the scope before you click.</li></ul>"};
var EXERCISES = [{"id": "h01", "type": "qcm", "reviewLabel": "Triage: ACL cleanup or sabotage?", "scenario": "<p>Monday 09:12. SIEM fires: DACL change on <b>D:\\Departments</b> — the entire departmental share tree.</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — EDR process event</span><div class='artbody'>Image:   icacls.exe\nCmdline: icacls D:\\Departments /remove:d Everyone /T /C\nUser:    CORP\\SCCM-Service\nTime:    Mon 09:12:41</div></div><div class='artefact'><span class='artlabel'>ARTEFACT 2 — Change ticket CHG004312 (approved)</span><div class='artbody'>Title: GPO remediation of legacy Deny ACEs on D:\\Departments\nOwner: platform-team  |  Window: Mon 09:00-11:00\nScope: recursive removal of stale 'Deny Everyone' entries\nExpected tooling: icacls /remove:d via SCCM job</div></div><p>A junior analyst has already paged you: &ldquo;someone stripped deny entries from the whole share!&rdquo;</p>", "scenarioShort": "Ticketed /remove:d by SCCM — incident or not?", "question": "What is the correct triage verdict?", "hint": "Two artefacts, one window. Check who ran it, what the tooling was expected to be, and what the flag actually does.", "explain": "<p>This is the <b>alarming-looking, benign</b> case. The command strips <i>Deny</i> entries only (<span class='mono'>/remove:d</span>), the account is the SCCM service, and an approved ticket describes exactly this tooling in exactly this window. The two signals agree. The junior read <span class='mono'>/remove:d</span> as &ldquo;removed all protection&rdquo; — it removes stale Deny ACEs as designed, restoring inheritance-based access. Had the same command arrived from a user account at 03:00 with no ticket, the verdict flips. Same command, different world.</p>", "study": "icacls /remove:d semantics and correlating DACL alerts with change tickets before escalating.", "data": {"options": [{"t": "Benign — ticketed remediation matching account, tooling and window", "correct": true, "why": "SCCM service + approved ticket + expected /remove:d in the approved window all agree."}, {"t": "Incident — the attacker removed all protection from the share", "why": "/remove:d only strips Deny entries; account and ticket contradict the attacker story."}, {"t": "Incident — SCCM accounts never touch icacls", "why": "SCCM remediation jobs routinely run icacls; the ticket predicts it here."}, {"t": "Suspicious — re-add a Deny Everyone ACE immediately", "why": "Acting would undo an approved change and break the remediation."}]}}, {"id": "h02", "type": "multi", "reviewLabel": "Read the chattr -i on a mimicking binary", "scenario": "<p>03:40, host UTIL-02. An EDR rule for chattr fires and is auto-scored &ldquo;low&rdquo;.</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — process event</span><div class='artbody'>Image:   chattr\nCmdline: chattr -i /usr/bin/systemd-monitor\nUser:    root\nParent:  /usr/bin/.cache/upd --silent</div></div><div class='artefact'><span class='artlabel'>ARTEFACT 2 — file context</span><div class='artbody'>/usr/bin/systemd-monitor  ELF binary, first seen 11 days ago, unsigned\n/usr/bin/.cache/upd       same ELF family, first seen 11 days ago\nPatch window: none this month; no package owns either path</div></div>", "scenarioShort": "chattr -i by root on an unsigned mimic binary", "question": "Select <b>all</b> readings the artefacts support.", "hint": "Why would an attacker lock a file with +i eleven days ago and unlock it now?", "explain": "<p><b>Alarming-looking because it looks like housekeeping.</b> The parent process and the unsigned ELF family say this is one implant maintaining another. The classic reading: the binary was locked <span class='mono'>+i</span> at install time to survive cleanup (TeamTNT and Rocke both froze files with chattr); <span class='mono'>-i</span> now opens it for a version swap or reconfiguration, after which a <span class='mono'>+i</span> typically follows. The name mimics systemd — masquerading, not a real package (no package owns the path). Root is required for chattr, so &ldquo;how did they get root&rdquo; is a live question. None of this proves ransomware, and &ldquo;low&rdquo; is the wrong score.</p>", "study": "the +i then -i lifecycle of locked implants, and TeamTNT/Rocke chattr procedures.", "data": {"options": [{"t": "The implant is being maintained — a locked file was unlocked for a swap", "correct": true, "why": "-i after an install-time +i is the update window of a locked implant."}, {"t": "The binary name mimics systemd — masquerading, not a real package", "correct": true, "why": "No package owns the path and the name is a lookalike."}, {"t": "chattr requires root — the compromise already reached root", "correct": true, "why": "Attribute changes on /usr/bin demand root; the question is how."}, {"t": "This alone proves a ransomware deployment is starting", "why": "The lock/unlock is implant hygiene — ransomware needs more evidence."}, {"t": "Package managers run chattr -i routinely, so this is normal", "why": "No package owns the file and there is no patch window — the routine explanation fails."}]}}, {"id": "h03", "type": "match", "reviewLabel": "Four icacls switches, four different outcomes", "scenario": "<p>The incident bridge keeps confusing four icacls switches. BitPaymer's playbook (<span class='mono'>icacls /reset</span> then <span class='mono'>takeown /F</span>) is on the screen. Nail each switch to its outcome before the next call.</p>", "scenarioShort": "/grant vs /deny vs /remove vs /reset", "question": "For each switch, choose the outcome.", "hint": "One adds a right, one adds a refusal, one strips listed entries, one rebuilds from the parent.", "explain": "<p><b>/grant</b> adds an Allow ACE (Ryuk: <span class='mono'>/grant Everyone:F /T /C /Q</span>). <b>/deny</b> adds an explicit Deny ACE that beats Allow entries — the attacker's wall. <b>/remove</b> strips the listed accounts' entries (defenders use it to evict attacker ACEs). <b>/reset</b> throws the ACL away and rebuilds it from inherited defaults — destructive to custom entries and to evidence, which is exactly why BitPaymer pairs it with takeown to rebuild access the way they want.</p>", "study": "the four icacls sub-commands, and BitPaymer's documented /reset + takeown chain.", "data": {"left": [{"t": "icacls file /grant Users:F", "r": 0, "why": "Adds an Allow entry giving Users full control."}, {"t": "icacls file /deny Everyone:F", "r": 1, "why": "Adds a Deny entry — explicit refusals beat Allow entries."}, {"t": "icacls file /remove Everyone", "r": 2, "why": "Strips the listed accounts' ACEs, leaving others intact."}, {"t": "icacls file /reset", "r": 3, "why": "Discards explicit ACEs and inherits the parent's default again."}], "right": ["Adds an Allow ACE to the ACL", "Adds a Deny ACE that overrides Allow entries", "Deletes listed ACEs from the ACL", "Replaces the ACL with inherited defaults"]}}, {"id": "h04", "type": "terminal", "reviewLabel": "Terminal: takeown on a locked config (Windows IR)", "scenario": "<p>Live IR, host WEB-05. The account <b>svc-backup</b> is compromised. The attacker's config file is locked against you:</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — current state</span><div class='artbody'>C:\\Users\\Public> icacls s.conf\ns.conf Everyone:(N)   <- Deny, no access\nOwner:  svc-backup</div></div><p>You are admin on this host. Goal: <b>gain the ability to read s.conf with the least state change that works</b>. You are on a live, compromised system — every unnecessary change is a gift to the defence attorney of whatever this becomes.</p>", "scenarioShort": "Least-destructive way to read a locked file", "question": "Type the command that takes ownership of <b>C:\\Users\\Public\\s.conf</b> (nothing more), then Run and Check.", "hint": "Ownership is the precondition; everything else (reading, copying, resetting ACLs) comes after — and some of it never.", "explain": "<p><span class='mono'>takeown /f C:\\Users\\Public\\s.conf</span> — the tool (<b>takeown</b>), the file switch (<b>/f</b>), the target. It changes one thing: the owner becomes you. Then a follow-up <span class='mono'>icacls</span> read or grant could let you open it. WastedLocker used <span class='mono'>takeown.exe /F filepath</span> and BitPaymer chained <span class='mono'>takeown /F</span> with <span class='mono'>icacls /reset</span>. <span class='rv'>Red view:</span> the attacker denied access precisely to slow you down. <span class='bv'>Blue view:</span> takeown <i>then</i> <span class='mono'>icacls /save</span> the DACL before any reset — <span class='mono'>/reset</span> or <span class='mono'>del</span> here would have destroyed evidence.</p>", "study": "the takeown-before-icacls order, and why /reset is an evidence-destroying shortcut during live IR.", "data": {"title": "simulated cmd.exe — live IR exercise, nothing real is touched", "banner": ["Microsoft Windows [Version 10.0.19045]", "WEB-05 — incident response console (simulated)", ""], "prompt": "C:\\Users\\Public>", "okRe": "^takeown.*/f", "notFound": "'takeown' expects /f <file> — try: takeown /f <file>", "output": ["SUCCESS: The file (or folder): \"C:\\Users\\Public\\s.conf\" now owned by user CORP\\ir-analyst."], "dangerRe": "del |erase |icacls.*(/reset|/remove)|rd ", "dangerOut": ["[!] That would reset or destroy the file's ACL evidence on a live system."], "required": [{"re": "^takeown", "label": "the takeown tool", "why": "Ownership is the least-invasive precondition for access.", "match": "takeown /f C:\\Users\\Public\\s.conf"}, {"re": "/f", "label": "the /f file switch", "why": "takeown targets the named file.", "match": "takeown /f"}, {"re": "s\\.conf", "label": "the target s.conf", "why": "The command must name the locked config.", "match": "takeown /f C:\\Users\\Public\\s.conf"}], "forbidden": [{"re": "icacls.*(/reset|/remove)", "label": "icacls /reset or /remove", "why": "Rebuilding or stripping the DACL destroys the evidence of what the attacker changed."}, {"re": "^(del|erase|rd) ", "label": "deleting the file", "why": "Deleting the attacker's config destroys primary evidence."}], "canonical": "takeown /f C:\\Users\\Public\\s.conf", "dangerWhy": "resetting or deleting the file would erase the attacker's DACL trail"}}, {"id": "h05", "type": "multi", "reviewLabel": "Select the T1222 ransomware-prep evidence", "scenario": "<p>Ransomware deployment suspected on FS-CORE-01. The CISO wants to know specifically which findings are <b>T1222</b> preparation behaviour — not other techniques. The evidence pile:</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — findings, last 40 minutes</span><div class='artbody'>F1  icacls.exe /grant Everyone:F /T /C /Q on \\\\FS-CORE-01\\Shares (recursive)\nF2  takeown /f D:\\BackupCatalog on the backup share\nF3  attrib +h stage.exe in C:\\Users\\Public (new, unsigned)\nF4  vssadmin.exe delete shadows /all /quiet\nF5  net group 'Domain Admins' /domain</div></div>", "scenarioShort": "Which findings are T1222 behaviour?", "question": "Select <b>all</b> findings that are T1222 (permission modification) behaviour.", "hint": "Two findings are other ATT&CK techniques entirely — deleting recovery points and listing admins.", "explain": "<p><b>F1</b> is Ryuk's documented line — stripping access restrictions recursively. <b>F2</b> takes ownership of the backup catalogue (WastedLocker/BitPaymer pattern: own it, then unlock it). <b>F3</b> hides the staged executable — WannaCry's trick. <b>F4</b> (deleting shadow copies) is <b>T1490 Inhibit System Recovery</b>, and <b>F5</b> (listing Domain Admins) is account <b>discovery</b> — related to the operation, but not T1222. Precision here keeps the ATT&amp;CK mapping in the report honest.</p>", "study": "separating T1222 from T1490 and Discovery findings in the same incident.", "data": {"options": [{"t": "F1 — recursive icacls /grant Everyone:F on the shares", "correct": true, "why": "Ryuk's documented permission-stripping line."}, {"t": "F2 — takeown on the backup catalogue", "correct": true, "why": "Ownership grab on backups — classic ransomware prep (WastedLocker/BitPaymer pattern)."}, {"t": "F3 — attrib +h on the staged executable", "correct": true, "why": "Hiding a file with the hidden attribute is T1222.001."}, {"t": "F4 — vssadmin delete shadows", "why": "That is T1490 Inhibit System Recovery, not permission modification."}, {"t": "F5 — net group 'Domain Admins' /domain", "why": "Account discovery — a different tactic and technique."}]}}, {"id": "h06", "type": "drag", "reviewLabel": "Six artefacts, three verdicts", "scenario": "<p>End of shift triage board. Six artefacts from three hosts. Your lead wants them sorted <b>now</b>: likely T1222 defence evasion, benign admin activity, or not T1222 at all.</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — artefact list</span><div class='artbody'>A  attrib +h C:\\Users\\Public\\nc.exe                — 03:12, svc-print, no window\nB  chmod -R 755 /opt/app                            — 10:00, CI deploy job (ticketed)\nC  DNS query for telemetry[.]example                — background noise\nD  chattr +i /etc/ld.so.preload                     — 03:44, root, no window\nE  icacls D:\\Backup /grant svc-backup:F            — 22:00, inside backup window, ticketed\nF  Get-Process -Name svchost                        — analyst workstation</div></div>", "scenarioShort": "Sort six artefacts by verdict", "question": "Drag each artefact onto its verdict.", "hint": "For each row ask: permission change? whose account? what time and window?", "explain": "<p><b>A and D are T1222.</b> A hides a new <span class='mono'>nc.exe</span> from a service account at 03:12; D freezes <span class='mono'>ld.so.preload</span> — the loader-preload path attackers lock to survive reboots. <b>B and E are benign</b>: ticketed CI deployment with sane modes, and a backup-window grant to the backup service's own account. <b>C and F are not T1222</b> — one is a DNS lookup, one is a read-only process query. Time + account + scope decides every row; the tool name alone decides none.</p>", "study": "applying the triage triangle (account, time, scope) to chattr/attrib/icacls artefacts.", "data": {"slots": [{"id": "t", "label": "Likely T1222 defence evasion"}, {"id": "b", "label": "Benign admin activity"}, {"id": "n", "label": "Not T1222 at all"}], "items": [{"id": "a", "t": "A — attrib +h nc.exe, 03:12, svc-print"}, {"id": "b2", "t": "B — chmod -R 755 /opt/app, CI, ticketed"}, {"id": "c", "t": "C — DNS query for telemetry host"}, {"id": "d", "t": "D — chattr +i /etc/ld.so.preload, 03:44, root"}, {"id": "e", "t": "E — icacls /grant svc-backup, backup window"}, {"id": "f", "t": "F — Get-Process svchost"}], "correct": {"a": "t", "b2": "b", "c": "n", "d": "t", "e": "b", "f": "n"}, "why": {"a": "Hiding a new network tool from a service account out of hours — T1222.001.", "b2": "Ticketed CI deployment with expected modes — normal.", "c": "A DNS lookup changes no permissions.", "d": "Freezing the loader-preload path out of hours is a persistence-protecting lock.", "e": "The backup service granting itself rights in its own window is standard.", "f": "A read-only process query touches no ACL or attribute."}}}, {"id": "h07", "type": "branch", "reviewLabel": "Branching: the locked scheduled task", "scenario": "<p>DC-02. A scheduled task named <b>UpdateHelper</b> runs a planted service binary. The task's file is locked:</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — ACL on the task file</span><div class='artbody'>C:\\Windows\\System32\\Tasks\\UpdateHelper\n  Deny  Administrators:(F)   <- explicit\n  Deny  SYSTEM:(F)           <- explicit\n  Allow svc-taskupd:(F)      <- unknown account, creator\nOwner: svc-taskupd</div></div><div class='artefact'><span class='artlabel'>ARTEFACT 2 — task registration</span><div class='artbody'>TaskName: UpdateHelper   Run: C:\\Windows\\System32\\srvupdate.exe\nTrigger: at logon   Author: svc-taskupd   Created: 3 days ago</div></div>", "scenarioShort": "Deny-ACE locked task file on DC-02", "question": "Three decisions. The bridge is waiting.", "hint": "Ask at every step: what does the Deny actually protect, and what does the attacker want you NOT to do?", "explain": "<p><b>Step 1:</b> the creator account and the task itself explain the Deny — verify before touching. <b>Step 2:</b> the Deny ACE exists to stop <i>defenders</i> from removing the task: a persistence technique protected by a T1222 lock. That dual use — <span class='rv'>red view</span>: lock the artefact so cleanup fails; <span class='bv'>blue view</span>: alert on explicit Deny ACEs under <span class='mono'>C:\\Windows\\System32\\Tasks</span>, they should never appear there — is the lesson. <b>Step 3:</b> collect first (copy the task XML and binary offline, <span class='mono'>icacls /save</span> the ACL), then remove the Deny, disable the task, delete both — a locked artefact handled too fast leaves no story for the report.</p>", "study": "Deny ACEs under the Tasks folder as persistence protection, and evidence-first handling of locked artefacts.", "data": {"steps": [{"q": "Step 1 — before touching the task, the first thing to establish is:", "options": [{"t": "Who owns and created the task, and what srvupdate.exe is", "correct": true, "why": "Creator account + binary identity decide whether this is attacker infrastructure."}, {"t": "Whether the Deny ACE can be removed with icacls /remove:d", "why": "Feasibility is not the question — attribution of the artefact comes first."}, {"t": "Whether DC-02 can be rebooted tonight", "why": "A reboot neither removes the task nor preserves evidence."}, {"t": "How to phrase the email to IT operations", "why": "The bridge needs decisions, not wording."}]}, {"q": "Step 2 — why would an attacker place explicit Deny ACEs on their own task file?", "options": [{"t": "To stop defenders from reading or removing the task — persistence protected by a lock", "correct": true, "why": "Deny beats Allow: even admins cannot clean the task while it stands."}, {"t": "To hide the CPU usage of the task", "why": "Deny entries gate access, not resource meters."}, {"t": "To encrypt the task definition", "why": "ACLs never encrypt content."}, {"t": "To make the task start faster at logon", "why": "Permissions have no effect on scheduling."}]}, {"q": "Step 3 — the task is confirmed malicious. The best sequence is:", "options": [{"t": "Copy the task XML and binary offline, icacls /save the ACL, then remove the Deny and disable the task", "correct": true, "why": "Evidence first, then remediation — the locked artefact is part of the report."}, {"t": "Delete the task file immediately", "why": "Deleting first destroys the artefact and its ACL evidence."}, {"t": "Reimage DC-02 now", "why": "A domain controller is not reimaged on one finding — and evidence dies with it."}, {"t": "Leave it and monitor for a week", "why": "Confirmed persistence on a DC is contained, not watched."}]}]}}, {"id": "h08", "type": "qcm", "reviewLabel": "Least aggressive next step for a SUID root script", "scenario": "<p>Host APP-LIN-14, compromise confirmed. A planted file has escalated itself:</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — file listing</span><div class='artbody'>$ ls -l /tmp/backup.sh\n-rwsr-xr-x 1 root root 4210 Mar 3 09:12 /tmp/backup.sh\n$ lsattr /tmp/backup.sh\n--------------e------- /tmp/backup.sh</div></div><p>The SUID bit (<span class='mono'>s</span> in the owner column) means this script runs <b>as root</b> for anyone who executes it. The attacker is possibly still on the box.</p>", "scenarioShort": "SUID root script in /tmp — what first?", "question": "What is the <b>least aggressive</b> correct next step?", "hint": "You want to keep both the evidence and the safety. Which option changes the least while learning the most?", "explain": "<p>Document and copy first: the mode string itself (<span class='mono'>-rwsr-xr-x</span>), the hash, and a byte copy of the script are the report's core evidence. <span class='mono'>chmod -s</span> or deleting the file destroys the artefact mid-incident; a reboot clears volatile state and may tip the attacker; &ldquo;watch it&rdquo; leaves a root-executing payload live. The least-aggressive rule does not mean passive — it means the smallest change that keeps you safe and informed.</p>", "study": "SUID bits as persistence (chmod 4755 class), and evidence-first handling on live hosts.", "data": {"options": [{"t": "Document the mode and hash, copy the script to the IR share, then strip the bit", "correct": true, "why": "Evidence preserved, threat removed, minimal change."}, {"t": "Delete /tmp/backup.sh immediately", "why": "Destroys the primary artefact and tells the attacker you found it."}, {"t": "Reboot the host into recovery", "why": "Clears volatile evidence and may trigger attacker countermeasures."}, {"t": "Leave it running and observe for a day", "why": "A root-executing planted script is an unacceptable live risk."}]}}, {"id": "h09", "type": "multi", "reviewLabel": "Effects of /inheritance:r", "scenario": "<p>A hunted account ran this on FILE-08 — the report wants the ACL mechanics exactly right:</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — process event</span><div class='artbody'>Image:   icacls.exe\nCmdline: icacls C:\\Data\\report.docx /inheritance:r /grant:r CORP\\admins:(F)\nUser:    CORP\\hhelpdesk (account under review)</div></div>", "scenarioShort": "What /inheritance:r /grant:r actually does", "question": "Select <b>all</b> effects this command has on report.docx.", "hint": "inheritance:r cuts the cord to the parent; grant:r replaces rather than adds.", "explain": "<p><span class='mono'>/inheritance:r</span> removes <b>all inherited ACEs</b> — the file stops receiving anything from D:\\Data. <span class='mono'>/grant:r</span> then sets an <b>explicit</b> Allow for admins only (the <span class='mono'>:r</span> suffix means replace, not add). Result: only the listed accounts keep any access; everyone the parent ACL used to grant is locked out. This is the standard way to build a private folder — and equally a way to wall off a stolen document. ACLs never encrypt, and no domain-controller requirement exists for a local file.</p>", "study": "icacls /inheritance:r and the :r (replace) suffix on /grant — the private-folder pattern.", "data": {"options": [{"t": "All inherited ACEs are removed from the file", "correct": true, "why": "inheritance:r severs the link to the parent ACL."}, {"t": "Only accounts with an explicit grant keep access", "correct": true, "why": "After both switches, the explicit admin grant is the only path in."}, {"t": "The file's content becomes encrypted", "why": "ACL operations never touch content."}, {"t": "The command only works when run on a domain controller", "why": "icacls works on any Windows host for its local files."}]}}, {"id": "h10", "type": "match", "reviewLabel": "Match each artefact to its best detection anchor", "scenario": "<p>Detection engineering workshop. For each observed artefact, pick the telemetry anchor that will actually fire on it — not the trendiest one, the <b>correct</b> one.</p>", "scenarioShort": "Artefact → detection anchor", "question": "For each artefact, choose its best detection anchor.", "hint": "Attribute changes, DACL/owner changes, and command lines each live in different event streams.", "explain": "<p>Windows records <b>owner and DACL changes</b> as Security Event <b>4670</b> — the takeown anchor. <b>Command lines</b> of icacls/chmod/chattr live in Sysmon <b>EID 1</b> (or EDR process events) — the command-monitoring anchor. A <b>hidden attribute change</b> on a new file in a web root is file-metadata telemetry. On Linux, an <b>auditd</b> execve rule on chmod/chattr is the equivalent of EID 1. Each anchor answers one artefact; piling all four into one rule is how detections go deaf.</p>", "study": "Event 4670, Sysmon EID 1, file-metadata telemetry and auditd execve rules — one anchor per artefact class.", "data": {"left": [{"t": "takeown /f on a System32 binary", "r": 0, "why": "Ownership change — Security Event 4670 records it."}, {"t": "icacls /grant on a share, full command line", "r": 1, "why": "Command execution — Sysmon EID 1 / EDR process event."}, {"t": "attrib +h on a new exe in the web root", "r": 2, "why": "Attribute change — file metadata telemetry."}, {"t": "chmod 777 run on a Linux web host", "r": 3, "why": "Command execution on Linux — auditd execve rule on chmod."}], "right": ["Windows Security Event 4670 (owner change)", "Sysmon EID 1 / EDR process command line", "File metadata monitoring", "auditd execve rule on chmod"]}}, {"id": "h11", "type": "qcm", "reviewLabel": "Attribution: whose playbook is this?", "scenario": "<p>CTI review of an intrusion into a logistics firm. Hours before encryption began, the operators ran icacls against the <b>system drive root</b> of the file servers, granting <b>Everyone full control</b>. You are asked which documented actor this procedure matches — and which the evidence does <i>not</i> support.</p>", "scenarioShort": "Whose documented procedure is this?", "question": "Which actor's documented T1222.001 procedure matches this behaviour?", "hint": "The phrase to match: icacls /grant Everyone:F applied at the drive root right before encryption.", "explain": "<p>This is <b>BlackByte</b>'s documented procedure: using icacls to grant Everyone full control at the drive root — an unlock-everything step taken right before encryption. The near-matches are real but wrong <i>here</i>: Wizard Spider's signature is icacls against backup-server system folders, APT38's is chmod 777 on Linux hosts, and TeamTNT's is chattr on binaries in cloud environments. One procedure, one actor page — attribution stays a <i>lead</i> with confidence levels, but the procedure match is exact.</p>", "study": "the T1222.001 procedure examples table — and keeping attribution statements hedged.", "data": {"options": [{"t": "BlackByte — icacls /grant Everyone:F at the drive root", "correct": true, "why": "Their documented T1222.001 procedure matches exactly: an unlock-everything grant before encryption."}, {"t": "Wizard Spider — icacls on backup-server system folders", "why": "Documented for Wizard Spider, but their target is backup servers' system folders — not the drive root."}, {"t": "APT38 — chmod 777 on Linux hosts", "why": "A Linux chmod pattern — different platform and different switch."}, {"t": "TeamTNT — chattr on binaries in cloud environments", "why": "Cloud worm behaviour with chattr — not a drive-root icacls grant."}]}}, {"id": "h12", "type": "order", "reviewLabel": "Order the evidence-first cleanup", "scenario": "<p>FILE-03 is confirmed compromised. The attacker added Deny ACEs to share folders and changed owners. Management wants it &ldquo;back to normal this afternoon&rdquo;. Order your actions so the report survives and the business gets its shares back.</p>", "scenarioShort": "Evidence-first remediation order", "question": "Click the four actions in the correct order.", "hint": "Whatever you cannot reconstruct later must be captured before anything changes.", "explain": "<p>1) <b>icacls /save</b> writes the current (attacker-modified) DACLs to files — the only faithful record of what was changed. 2) <b>Copy the suspicious artefacts</b> (planted files, scripts) while the locks are still in place. 3) <b>Repair</b>: remove Deny ACEs, restore inheritance, reset owners from the saved state. 4) <b>Re-baseline and monitor</b>: alert on 4670 and command lines so a re-lock attempt fires immediately. Fixing first saves an hour and loses the case.</p>", "study": "icacls /save and /restore as the evidence pair for DACL remediation.", "data": {"items": [{"t": "icacls /save the current DACLs to the IR share", "why": "The modified ACLs are evidence — capture them before any change."}, {"t": "Copy planted files and scripts to evidence storage", "why": "Artefacts must be collected while the scene is intact."}, {"t": "Remove Deny ACEs and restore inheritance and owners", "why": "Now repair — from a saved baseline you can prove what changed."}, {"t": "Re-baseline monitoring and alert on re-lock attempts", "why": "A defender-visible tripwire catches the attacker restoring their locks."}]}}, {"id": "h13", "type": "fill", "reviewLabel": "Complete the hardening ticket", "scenario": "<p>Hardening ticket SEC-1188 after a web-root compromise. Fill the two control slots so the ticket is implementable.</p><div class='artefact'><span class='artlabel'>Ticket draft</span><div class='artbody'>1. Webroot ACLs: enforce {{0}} so only the app-pool identity can write.\n2. Auditing: collect {{1}} events for every DACL change into the SIEM.</div></div>", "scenarioShort": "Fill the two control slots", "question": "Pick the correct item for each blank.", "hint": "Blank 0 is the mitigation family, blank 1 is the Windows event ID for ACL changes.", "explain": "<p>Blank 0 is <b>restrictive ACLs — mitigation M1022</b>: if only the app pool can write the web root, a webshell cannot stage a hidden payload next to it. Blank 1 is <b>Security Event 4670</b>, the Windows audit record for DACL and owner changes — without it, the icacls trail is invisible. DNS logs and 4624 (logon) events answer different questions, and leaving port 445 open has nothing to do with either slot.</p>", "study": "M1022 in hardening tickets, and Event 4670 as the DACL audit source.", "data": {"template": "1. Webroot ACLs: enforce {{0}} so only the app-pool identity can write.\n2. Auditing: collect {{1}} events for every DACL change into the SIEM.", "blanks": [{"correct": "restrictive ACLs (M1022)", "why": "Tight webroot permissions are the M1022 implementation."}, {"correct": "Security Event 4670", "why": "Event 4670 records DACL and owner changes."}], "bank": ["restrictive ACLs (M1022)", "Security Event 4670", "antivirus exclusions", "DNS query logs", "port 445 open", "Security Event 4624"]}}, {"id": "h14", "type": "multi", "reviewLabel": "Tune the icacls rule: what to allowlist", "scenario": "<p>Your icacls /grant detection averages 60 alerts a day and the team is going deaf. The detection engineer asks which legitimate patterns belong on the <b>allowlist</b> — and which must stay off it.</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — top alert contexts this week</span><div class='artbody'>A  SCCM client health job, icacls on C:\\Windows\\CCM*, daily 10:00\nB  backup restore service, icacls /grant on restore targets, ticketed\nC  msiexec-driven installer, icacls on its own install folder\nD  attrib +h on a new exe in C:\\inetpub\\uploads, 01:47, no window\nE  chmod -R 777 /srv/www by www-data, 02:58, no window</div></div>", "scenarioShort": "Allowlist which icacls contexts?", "question": "Select <b>all</b> contexts that may be allowlisted as likely-benign.", "hint": "Allowlisting is about account, purpose and window — never about the artefact being new or hidden.", "explain": "<p><b>A, B, C</b> share the benign signature: known software purpose, known account, known or ticketed window. <b>D</b> stays — a hidden flag on a brand-new executable in the uploads tree is exactly what the rule exists for. <b>E</b> stays — wide-open recursive chmod by a service account out of hours is the classic attack pattern (and the Linux cousin of the Windows rules). Allowlisting the wrong context is how real intrusions get a free pass for months.</p>", "study": "detection tuning: baselining by account+purpose+window while keeping new-artefact and out-of-hours contexts alerting.", "data": {"options": [{"t": "A — SCCM client health job on its own paths", "correct": true, "why": "Known software, known account, fixed daily window."}, {"t": "B — ticketed backup restore grants", "correct": true, "why": "Purpose, account and ticket all line up."}, {"t": "C — installer adjusting its own install folder", "correct": true, "why": "Standard software-install behaviour, narrow scope."}, {"t": "D — attrib +h on a new exe in the uploads tree", "why": "A new hidden executable in the uploads tree is a primary detection goal."}, {"t": "E — recursive 777 by www-data at 02:58", "why": "Out-of-hours wide-open recursive chmod by a service account stays alerting."}]}}, {"id": "h15", "type": "terminal", "reviewLabel": "Terminal: stage a hidden file on macOS", "scenario": "<p>macOS forensics lab (simulated), host <b>mac-analyst-2</b>. You are reproducing macOS malware staging for a hunt write-up: a staged file <b>/Users/Shared/.upd</b> must be made properly invisible to Finder — not merely dot-named. Your write-up will teach the hunt.</p><div class='artefact'><span class='artlabel'>Current state</span><div class='artbody'>$ ls -l@o /Users/Shared/.upd\n-rwxr-xr-x  1 analyst  staff  -  512 Mar 3 09:12 /Users/Shared/.upd\n(no flags column yet)</div></div>", "scenarioShort": "Lab: make the staged file invisible on macOS", "question": "Type the command that makes <b>/Users/Shared/.upd</b> invisible to Finder and normal listings, then Run and Check.", "hint": "Renaming is the wrong path — the dot-name is already there. What is missing lives in the file's metadata, not its name.", "explain": "<p><span class='mono'>chflags hidden /Users/Shared/.upd</span> — the tool (<b>chflags</b>), the flag (<b>hidden</b>), the target. Finder and plain listings stop showing the file; <span class='mono'>ls -lO</span> or <span class='mono'>chflags nohidden</span> bring it back. <span class='rv'>Red view:</span> on macOS this is the cleaner hide than dot-prefix naming, because it survives &ldquo;show hidden files&rdquo; habits. <span class='bv'>Blue view:</span> collect the flags column (<span class='mono'>ls -lO</span>) and watch for chflags process events — XCSSET-class macOS threats stage exactly like this before their <span class='mono'>chmod +x</span>.</p>", "study": "macOS file flags (hidden, uchg) via chflags, and T1222.002's macOS coverage.", "data": {"title": "simulated zsh — macOS forensics lab, nothing real is touched", "banner": ["mac-analyst-2 (zsh)", "forensics lab — commands are simulated", ""], "prompt": "analyst@mac-analyst-2 ~ %", "okRe": "^chflags", "notFound": "zsh: command not found — try: chflags hidden <file>", "output": ["(no output — chflags is silent on success)", "$ ls -lO /Users/Shared/.upd", "-rwxr-xr-x  1 analyst  staff  hidden  512 Mar 3 09:12 /Users/Shared/.upd   <- flags: hidden"], "dangerRe": "rm |chflags\\s+nohidden|chmod\\s+-r", "dangerOut": ["[!] That un-hides or deletes the file — not the staging task."], "required": [{"re": "^chflags", "label": "the chflags tool", "why": "chflags sets macOS file flags.", "match": "chflags hidden /Users/Shared/.upd"}, {"re": "hidden", "label": "the hidden flag", "why": "The hidden flag removes the file from normal views.", "match": "chflags hidden"}, {"re": "/users/shared/\\.upd", "label": "the target .upd", "why": "The command must name the staged file.", "match": "chflags hidden /Users/Shared/.upd"}], "canonical": "chflags hidden /Users/Shared/.upd"}}, {"id": "h16", "type": "qcm", "reviewLabel": "Conflicting signals: software deployment or intrusion?", "scenario": "<p>Two signals, one question. Windows Event 4670 shows an owner change on <span class='mono'>C:\\Program Files\\VendorAgent\\agent.exe</span> to <b>LOCAL\\PatchSvc</b>. Your EDR also reports the same takeown-then-icacls pair fired on <b>12 hosts in the last hour</b>, always on agent.exe paths, always as PatchSvc.</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — the two signals</span><div class='artbody'>S1  4670 owner change on agent.exe -> LOCAL\\PatchSvc (12 hosts, 1 hour)\nS2  No ticket, no change window; PatchSvc is a local service account, not a deployment account\nS3  VendorAgent inventory shows version 2.4 rollout was completed last month</div></div>", "scenarioShort": "Owner changes on 12 hosts — deployment or intrusion?", "question": "Which verdict best fits all three signals?", "hint": "The pattern looks like software; the account and the absence of a rollout say otherwise. Which detail breaks the tie?", "explain": "<p>The wide pattern (S1) is deployment-shaped — software rollouts do touch many hosts in an hour. But the <b>account breaks the tie</b>: a local service account doing takeown+icacls with no ticket (S2), for software that finished rolling out last month (S3), does not match deployment practice. Treat as <b>suspect and verify</b>: confirm the PatchSvc binary's signature and parent process, check which deployment tool (if any) owns it, and hold off on both &ldquo;benign rollout&rdquo; and &ldquo;full incident&rdquo;. The worst move is allowing the wide pattern to wave everything through — that is exactly how one compromised updater reaches 12 hosts.</p>", "study": "weighing pattern-shaped evidence against account and context — and how to verify before verdicts.", "data": {"options": [{"t": "Suspect and verify — pattern looks like software, account and context do not", "correct": true, "why": "S1 is deployment-shaped but S2 and S3 contradict it; verify the binary and its parent before a verdict."}, {"t": "Benign — 12 hosts in an hour is clearly a vendor rollout", "why": "The rollout finished last month and no deployment account or ticket exists."}, {"t": "Full incident — declare compromise of all 12 hosts now", "why": "Possible, but unverified: one account check and one binary hash decide it cleanly."}, {"t": "False positive — 4670 always fires on vendor updates", "why": "4670 is quiet in normal operations; that habit is exactly what an abused updater relies on."}]}}];
/* ============ T1222 exam engine — vanilla JS, self-contained ============ */
(function(){
'use strict';
/* ---------- tiny dom helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pad(n){return (n<10?'0':'')+n;}
function mmss(s){s=Math.max(0,s|0);return pad(Math.floor(s/60))+':'+pad(s%60);}
function score(H,W,N){return Math.max(0,(H-W)/N);}
function lockArea(root){var ns=root.querySelectorAll('button,select,input');for(var i=0;i<ns.length;i++){ns[i].disabled=true;}var os=root.querySelectorAll('.opt,.chipitem');for(var k=0;k<os.length;k++){os[k].classList.add('lock');}}

/* ---------- global state ---------- */
var S={};
function freshState(){
  return {phase:'intro',order:[],pos:0,seen:0,cur:null,curEx:null,rec:{},skipped:[],creditSum:0,answered:0,
    tState:'IDLE',remaining:0,tickId:null,manualTotal:0,autoTotal:0,stateSince:0,beforeManual:null,
    fromReview:false,reported:false,user:null,country:null,locale:null,perLimit:0,perLeft:0,checked:false,stepIdx:0,stepAns:null,picked:null,
    stageMode:'intro',pausedStage:null,lastResult:null};
}
/* ---------- timer state machine: RUNNING / PAUSED_MANUAL / PAUSED_AUTO_CHECK / ENDED ---------- */
function tSetState(st){
  var now=Date.now();
  if(S.tState==='PAUSED_MANUAL'){S.manualTotal+=Math.round((now-S.stateSince)/1000);}
  if(S.tState==='PAUSED_AUTO_CHECK'){S.autoTotal+=Math.round((now-S.stateSince)/1000);}
  S.tState=st;S.stateSince=now;updateHeader();
}
function tStart(){if(S.tickId)clearInterval(S.tickId);S.tickId=setInterval(tick,1000);}
function tick(){
  if(S.tState!=='RUNNING')return;
  S.remaining--;
  if(S.perLimit>0&&S.perLeft>0){S.perLeft--;var pl=$('#perclock');if(pl)pl.textContent=mmss(S.perLeft);
    if(S.perLeft<=0){doCheck(true);return;}}
  if(S.remaining<=0){S.remaining=0;updateHeader();timeUp();return;}
  updateHeader();
}
function timeUp(){tSetState('ENDED');if(S.tickId){clearInterval(S.tickId);S.tickId=null;}showResults();}
/* ---------- header ---------- */
function stateChip(){
  if(S.tState==='RUNNING')return '<span class="badge st-run" aria-label="Timer running">&#9654; RUNNING</span>';
  if(S.tState==='PAUSED_MANUAL')return '<span class="badge st-paused" aria-label="Timer paused manually">&#9208; PAUSED &mdash; manual (press Resume)</span>';
  if(S.tState==='PAUSED_AUTO_CHECK')return '<span class="badge st-paused" aria-label="Timer paused for feedback review">&#9208; PAUSED &mdash; reviewing feedback (resumes on Next)</span>';
  return '<span class="badge st-ended" aria-label="Timer ended">&#9209; ENDED</span>';
}
function updateHeader(){
  var t=$('#tval');if(t)t.textContent=mmss(S.remaining);
  var st=$('#tstate');if(st)st.innerHTML=stateChip();
  var sc=$('#scoreval');if(sc){var pct=S.answered>0?Math.round(S.creditSum/S.answered*100):0;
    sc.innerHTML='<b>'+S.creditSum.toFixed(1)+' / '+S.answered+'</b>&nbsp;('+pct+'%)';}
  var cnt=$('#counter');if(cnt){
    if(S.phase==='exam')cnt.textContent='Exercise '+S.seen+' of '+META.questionCount;
    else if(S.phase==='review')cnt.textContent='Review skipped — '+S.skipped.length+' left';
    else cnt.textContent=META.questionCount+' exercises';}
  var pb=$('#pbar');if(pb){var done=S.answered+S.skipped.length;var pct2=Math.min(100,Math.round(done/META.questionCount*100));
    pb.style.width=pct2+'%';pb.classList.add('sheen');}
}
function buildTopbar(){
  var tb=el('div','topbar');
  tb.innerHTML='<span class="tb-title">'+esc(META.objId)+' &middot; '+esc(META.objName)+'</span>'+
    '<span class="badge '+META.sevClass+'" aria-label="Severity '+esc(META.sevWord)+'"><span class="dot"></span>'+esc(META.sevWord)+'</span>'+
    '<span class="chip" id="counter">Exercise 1 of '+META.questionCount+'</span>'+
    '<span class="chip timerbox" aria-label="Time remaining">&#9201; <b id="tval">--:--</b></span>'+
    '<span id="tstate">'+stateChip()+'</span>'+
    '<span class="chip" aria-label="Live score">&#9878; <span id="scoreval"><b>0.0 / 0</b>&nbsp;(0%)</span></span>'+
    (S.user?'<span class="chip" aria-label="Learner">&#128100; '+esc(S.user)+'</span>':'')+
    '<button class="btn btn-ghost" id="btn-hint" title="Hint (costs 10% of this exercise credit)">&#128161; Hint</button>'+
    '<button class="btn btn-ghost" id="btn-pause" title="Manual pause">&#9208; Pause</button>'+
    '<button class="btn btn-ghost" id="btn-skip" title="Skip — comes back at the end">&#9888; Skip</button>';
  return tb;
}
function wireTopbar(){
  $('#btn-hint').onclick=doHint;$('#btn-pause').onclick=doPause;$('#btn-skip').onclick=doSkip;
  updateHintBtn();
}
function updateHintBtn(){
  var b=$('#btn-hint');if(!b)return;
  var r=S.rec[S.cur];
  if(!r||r.hintUsed||S.checked){b.disabled=true;return;}
  b.disabled=false;
}
/* ---------- intro ---------- */
function renderIntro(){
  S.phase='intro';document.title=META.pageTitle;
  var app=$('#app');app.innerHTML='';
  app.appendChild(buildIntroTop());
  var c1=el('div','card');
  c1.innerHTML='<div class="sechead"><span class="si">&#127919;</span>What you will learn here</div>'+INTRO.learn;
  app.appendChild(c1);
  var c2=el('div','card');
  var kw='<div class="sechead"><span class="si">&#128273;</span>Keywords covered in this exam</div><div class="kwgrid">';
  for(var i=0;i<INTRO.keywords.length;i++){var k=INTRO.keywords[i];
    kw+='<div class="kwpanel"><h4>'+k.theme+'</h4><ul>';
    for(var j=0;j<k.items.length;j++){kw+='<li>'+k.items[j]+'</li>';}
    kw+='</ul></div>';}
  kw+='</div>';c2.innerHTML=kw;app.appendChild(c2);
  var c3=el('div','card');
  c3.innerHTML='<div class="sechead"><span class="si">&#9881;</span>How this exam works</div>'+INTRO.how+
    '<div class="btn-row"><button class="btn btn-primary" id="btn-start" style="min-width:170px">&#9654; Start the exam</button></div>';
  app.appendChild(c3);
  $('#btn-start').onclick=startExam;
}
function buildIntroTop(){
  var c=el('div','card');
  c.innerHTML='<div class="intro-title">'+esc(META.title)+'</div>'+
    '<div class="intro-sub">MITRE ATT&amp;CK object: <b>'+esc(META.objId)+' — '+esc(META.objName)+'</b> &nbsp;&middot;&nbsp; '+esc(META.objKind)+'</div>'+
    '<div class="factstrip">'+
    '<div class="fact"><span class="fl">Severity</span><span class="fv"><span class="badge '+META.sevClass+'"><span class="dot"></span>'+esc(META.sevWord)+'</span></span></div>'+
    '<div class="fact"><span class="fl">Exercises in this file</span><span class="fv">'+META.questionCount+'</span></div>'+
    '<div class="fact"><span class="fl">Estimated time</span><span class="fv">'+META.estimatedMinutes+' min</span></div>'+
    '<div class="fact"><span class="fl">Timer budget</span><span class="fv">'+mmss(META.timerMinutes*60)+'</span></div>'+
    '<div class="fact"><span class="fl">Pass mark</span><span class="fv">'+META.passMark+'%</span></div>'+
    '</div>';
  return c;
}
/* ---------- exam flow ---------- */
function startExam(){
  resetToExam();
  for(var z=0;z<EXERCISES.length;z++){var e=EXERCISES[z];delete e._view;delete e._ans;delete e._seq;delete e._bank;delete e._place;delete e._items;delete e._norm;}
  var idxs=[];for(var i=0;i<EXERCISES.length;i++)idxs.push(i);
  S.order=shuffle(idxs);
  for(var k=0;k<EXERCISES.length;k++){S.rec[k]={status:'pending',credit:0,hintUsed:false};}
  S.remaining=META.timerMinutes*60;
  S.phase='exam';S.tState='RUNNING';S.stateSince=Date.now();
  renderExamShell();
  tStart();
  showExercise(S.order[0],false);
}
function resetToExam(){ /* full reset but keep handshake user */
  var u=S.user;S=freshState();S.user=u;
}
function renderExamShell(){
  var app=$('#app');app.innerHTML='';
  app.appendChild(buildTopbar());wireTopbar();
  var pr=el('div','progress');pr.innerHTML='<i id="pbar" style="width:0%"></i>';app.appendChild(pr);
  var stage=el('div','','');stage.id='stage';app.appendChild(stage);
  updateHeader();
}
function nextPending(afterPos){
  for(var i=afterPos+1;i<S.order.length;i++){var ix=S.order[i];if(S.rec[ix].status==='pending')return i;}
  return -1;
}
function showExercise(exIdx,fromReview){
  /* Next (or entering from the review screen) ends the Check auto-pause: timer returns to RUNNING */
  if(S.tState!=='ENDED'&&S.tState!=='RUNNING')tSetState('RUNNING');
  S.stageMode='exercise';
  var sb=$('#btn-skip');if(sb)sb.disabled=(S.phase!=='exam');
  S.cur=exIdx;S.curEx=EXERCISES[exIdx];S.fromReview=!!fromReview;S.checked=false;S.picked=null;S.stepIdx=0;S.stepAns=null;
  S.perLimit=(S.curEx.data&&S.curEx.data.timerSec)?S.curEx.data.timerSec:0;S.perLeft=S.perLimit;
  if(!fromReview){S.seen++;if(S.rec[exIdx].status==='pending')S.rec[exIdx].status='active';}
  var ex0=S.curEx;ex0._ans=[];ex0._seq=null;ex0._bank=null;ex0._view=null;ex0._place=null;ex0._items=null;
  var st=$('#stage');st.innerHTML='';
  renderBlocks(st,S.curEx);
  updateHeader();
  updateHintBtn();
  window.scrollTo(0,0);
}
function renderBlocks(root,ex){
  /* SCENARIO */
  var sc=el('div','blk blk-scenario');
  sc.innerHTML='<div class="blk-h">&#129517; SCENARIO</div>';
  var body=el('div','blk-b');body.innerHTML=ex.scenario;sc.appendChild(body);
  if(ex.collapsible){
    var tog=el('button','sc-collapse');
    tog.innerHTML='&#9650; Hide scenario &nbsp;&mdash;&nbsp; summary: '+esc(ex.scenarioShort);
    tog.onclick=function(){var open=body.style.display!=='none';
      body.style.display=open?'none':'';tog.innerHTML=open?'&#9660; Show scenario &nbsp;&mdash;&nbsp; summary: '+esc(ex.scenarioShort):'&#9650; Hide scenario &nbsp;&mdash;&nbsp; summary: '+esc(ex.scenarioShort);};
    sc.appendChild(tog);
  }
  root.appendChild(sc);
  /* QUESTION */
  var q=el('div','blk blk-question');
  var qb='<div class="blk-h">&#10067; QUESTION</div><div class="blk-b">';
  if(ex.type==='branch'){
    var si=Math.min(S.stepIdx,ex.data.steps.length-1);
    qb+='<div class="chip" style="margin-bottom:8px">&#128304; STEP '+(si+1)+' OF '+ex.data.steps.length+'</div>';
    qb+='<div class="qtext">'+ex.data.steps[si].q+'</div>';
    if(S.stepIdx>=ex.data.steps.length){qb+='<div class="hintbox" style="margin-top:8px"><b>&#128304; All '+ex.data.steps.length+' steps are recorded.</b> Press Check below to submit the whole chain.</div>';}
  }
  else{qb+='<div class="qtext">'+ex.question+'</div>';
    if(S.checked){qb+='<div class="hintbox" style="margin-top:8px"><b>&#9208; PAUSED &mdash; reviewing feedback (resumes on Next).</b> Your answer is graded below. The clock resumes when you press Next.</div>';}}
  qb+='</div>';
  q.innerHTML=qb;root.appendChild(q);
  /* YOUR ANSWER */
  var a=el('div','blk blk-answer');
  a.innerHTML='<div class="blk-h">&#9997; YOUR ANSWER</div>';
  var ab=el('div','blk-b');ab.id='ansarea';
  if(S.perLimit>0){ab.appendChild(el('div','hintbox','<b>&#9201; Per-exercise limit: '+mmss(S.perLimit)+'</b> — this terminal has its own clock: <b class="timerbox" id="perclock">'+mmss(S.perLeft)+'</b>. It pauses when the main timer pauses and grades what you typed when it expires.'));}
  renderAnswer(ab,ex);
  a.appendChild(ab);root.appendChild(a);
  /* button row */
  var br=el('div','btn-row');br.id='btrow';
  var stepsLeft=(ex.type==='branch'&&S.stepIdx<ex.data.steps.length);
  br.innerHTML='<button class="btn btn-primary" id="btn-check"'+(stepsLeft?' disabled title="Confirm every step first &mdash; Check grades the whole chain"':'')+'>&#10004; Check</button>';
  root.appendChild(br);
  $('#btn-check').onclick=function(){doCheck(false);};
}
function renderAnswer(area,ex){
  if(ex.type==='qcm')rChoice(area,ex,false);
  else if(ex.type==='multi')rChoice(area,ex,true);
  else if(ex.type==='match')rMatch(area,ex);
  else if(ex.type==='order')rOrder(area,ex);
  else if(ex.type==='fill')rFill(area,ex);
  else if(ex.type==='drag')rDrag(area,ex);
  else if(ex.type==='terminal')rTerminal(area,ex);
  else if(ex.type==='branch')rBranch(area,ex);
}
/* ---------- qcm & multi ---------- */
function rChoice(area,ex,isMulti){
  var opts=shuffle(ex.data.options.map(function(o,i){return {t:o.t,why:o.why||'',correct:!!o.correct,i:i};}));
  ex._view=opts;
  var wrap=el('div','opts');wrap.setAttribute('role',isMulti?'group':'radiogroup');
  var letters='ABCDEF';
  opts.forEach(function(o,k){
    var row=el('div','opt');row.setAttribute('role',isMulti?'checkbox':'radio');row.tabIndex=0;
    row.innerHTML='<span class="tag">'+letters[k]+'.</span><span class="txt">'+o.t+'</span><span class="selmark">&#9679; Selected</span>';
    row.__k=k;
    var pick=function(){if(S.checked)return;
      if(isMulti){row.classList.toggle('selected');row.setAttribute('aria-checked',row.classList.contains('selected')?'true':'false');}
      else{var rs=wrap.querySelectorAll('.opt');for(var z=0;z<rs.length;z++){rs[z].classList.remove('selected');rs[z].setAttribute('aria-checked','false');}
        row.classList.add('selected');row.setAttribute('aria-checked','true');}
    };
    row.onclick=pick;row.onkeydown=function(ev){if(ev.key===' '||ev.key==='Enter'){ev.preventDefault();pick();}};
    wrap.appendChild(row);
  });
  area.appendChild(wrap);
}
/* ---------- match ---------- */
function rMatch(area,ex){
  var rights=shuffle(ex.data.right.map(function(r,i){return {t:r,i:i};}));
  ex._view=rights;
  var g=el('div','matchgrid');
  ex.data.left.forEach(function(L,li){
    var left=el('div','mrow');
    var l=el('div','mleft',L.t);left.id='ml-'+li;
    var sel=el('select');sel.id='ms-'+li;sel.setAttribute('aria-label','Match for: '+L.t.replace(/<[^>]*>/g,''));
    sel.appendChild(el('option','', '&#8212; choose the match &mdash;')).value='';
    rights.forEach(function(R){var o=el('option','',R.t);o.value=String(R.i);sel.appendChild(o);});
    sel.__li=li;
    var rw=el('div');rw.appendChild(sel);
    left.appendChild(l);left.appendChild(rw);g.appendChild(left);
  });
  area.appendChild(g);
}
/* ---------- order ---------- */
function rOrder(area,ex){
  ex._bank=shuffle(ex.data.items.map(function(it,i){return {t:it.t,i:i};}));
  ex._seq=[];
  var bank=el('div','bank-inline');bank.id='obank';
  var hint=el('div','','<div class="fcredit">Click the items below in the correct order (first click = step 1). Click a placed item to send it back.</div>');
  area.appendChild(hint);
  var seq=el('div','seq');seq.id='oseq';
  area.appendChild(seq);
  area.appendChild(el('div','fcredit','Item bank:'));
  area.appendChild(bank);
  var draw=function(){
    bank.innerHTML='';seq.innerHTML='';
    ex._bank.forEach(function(b,k){
      var c=el('button','chipitem','<span class="ck">+'+(k+1)+'</span> '+b.t);
      c.onclick=function(){if(S.checked)return;ex._seq.push(b);ex._bank.splice(k,1);draw();};
      bank.appendChild(c);
    });
    ex._seq.forEach(function(b,k){
      var c=el('button','chipitem','<span class="ck">'+(k+1)+'</span> '+b.t);
      c.onclick=function(){if(S.checked)return;ex._bank.push(b);ex._seq.splice(k,1);draw();};
      seq.appendChild(c);
    });
    if(!ex._bank.length&&!ex._seq.length)bank.appendChild(el('span','fcredit','All items placed.'));
  };
  draw();
}
/* ---------- fill ---------- */
function rFill(area,ex){
  var bank=shuffle(ex.data.bank.map(function(b){return b;}));
  ex._view=bank;
  var parts=ex.data.template.split(/\{\{\s*(\d+)\s*\}\}/g);
  var line=el('div','fillline');
  for(var i=0;i<parts.length;i++){
    if(i%2===0){line.appendChild(document.createTextNode(parts[i]));}
    else{var bi=parseInt(parts[i],10);
      var sel=el('select');sel.id='fb-'+bi;sel.setAttribute('aria-label','Blank '+(bi+1));
      sel.appendChild(el('option','','&#8212; pick a word &mdash;')).value='';
      bank.forEach(function(w){var o=el('option','',w);o.value=w;sel.appendChild(o);});
      line.appendChild(sel);}
  }
  area.appendChild(line);
}
/* ---------- drag & drop ---------- */
function rDrag(area,ex){
  ex._items=shuffle(ex.data.items.map(function(it){return {id:it.id,t:it.t};}));
  ex._place={};
  var hint=el('div','fcredit','Pick an item, then click its slot (or drag it). Click a placed item to send it back.');
  area.appendChild(hint);
  var slotsWrap=el('div','slots');
  ex.data.slots.forEach(function(sl){
    var s=el('div','slot');s.id='slot-'+sl.id;
    s.innerHTML='<span class="slab">'+sl.label+'</span>';
    s.__sid=sl.id;
    s.tabIndex=0;s.setAttribute('role','button');
    s.setAttribute('aria-label','Drop zone: '+sl.label.replace(/<[^>]*>/g,'')+' — pick an item, then press Enter here to place it');
    s.onkeydown=function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();if(S.checked)return;dropTo(sl.id);}};
    s.onclick=function(ev){if(S.checked)return;var t=ev.target;
      if(t.classList&&t.classList.contains('chipitem')){sendBack(t.getAttribute('data-id'));return;}
      dropTo(sl.id);};
    s.ondragover=function(ev){ev.preventDefault();s.classList.add('over');};
    s.ondragleave=function(){s.classList.remove('over');};
    s.ondrop=function(ev){ev.preventDefault();s.classList.remove('over');var id=ev.dataTransfer.getData('text/plain');if(id){pick(id);dropTo(sl.id);}};
    slotsWrap.appendChild(s);
  });
  area.appendChild(slotsWrap);
  area.appendChild(el('div','fcredit','Item bank:'));
  var bank=el('div','bank');bank.id='dbank';area.appendChild(bank);
  function pick(id){var it=null;for(var i=0;i<ex._items.length;i++){if(ex._items[i].id===id)it=ex._items[i];}
    if(!it)return;var prev=ex._place[id];if(prev){var ps=$('#slot-'+prev);var pc=ps.querySelector('[data-id="'+id+'"]');if(pc)ps.removeChild(pc);delete ex._place[id];}
    return it;}
  function sendBack(id){if(S.checked)return;pick(id);drawBank();}
  function dropTo(sid){if(S.checked||!S.picked)return;ex._place[S.picked]=sid;
    var s=$('#slot-'+sid);var it=null;for(var i=0;i<ex._items.length;i++){if(ex._items[i].id===S.picked)it=ex._items[i];}
    var c=el('button','chipitem',it.t);c.setAttribute('data-id',S.picked);c.setAttribute('draggable','false');
    c.onclick=function(ev){ev.stopPropagation();sendBack(S.picked);};
    s.appendChild(c);S.picked=null;drawBank();}
  function drawBank(){bank.innerHTML='';ex._items.forEach(function(it){
    if(ex._place[it.id])return;
    var c=el('button','chipitem',it.t);c.setAttribute('data-id',it.id);c.setAttribute('draggable','true');
    c.onclick=function(){if(S.checked)return;var all=document.querySelectorAll('.chipitem.picked');for(var z=0;z<all.length;z++)all[z].classList.remove('picked');c.classList.add('picked');S.picked=it.id;};
    c.ondragstart=function(ev){ev.dataTransfer.setData('text/plain',it.id);c.classList.add('dragging');S.picked=it.id;};
    c.ondragend=function(){c.classList.remove('dragging');};
    bank.appendChild(c);});
    if(!bank.children.length)bank.appendChild(el('span','fcredit','All items placed — click a placed item to move it back.'));}
  drawBank();
}
/* ---------- terminal ---------- */
function rTerminal(area,ex){
  var term=el('div','term');
  term.innerHTML='<div class="term-bar"><i></i><i></i><i></i><span>'+esc(ex.data.title||'simulated shell — nothing here touches a real system')+'</span></div>'+
    '<div class="term-out" id="tout">'+ex.data.banner.map(function(l){return '<span class="c">'+l+'</span>';}).join('\n')+'</div>'+
    '<div class="term-in"><span class="pr">'+ex.data.prompt+'</span><input id="tin" type="text" autocomplete="off" spellcheck="false" aria-label="Type the command"></div>';
  area.appendChild(term);
  var row=el('div','termrow');
  row.innerHTML='<button class="btn btn-blue" id="btn-run">&#9654; Run</button>'+
    '<span class="fcredit">Type the command, press Run to see simulated output, then Check to grade it. Nothing real is executed.</span>';
  area.appendChild(row);
  function norm(c){return c.trim().replace(/\s+/g,' ').toLowerCase();}
  ex._norm=norm;
  function run(){
    if(S.checked)return;
    var v=$('#tin').value;var out=$('#tout');var n=norm(v);
    out.textContent+='\n'+ex.data.prompt+' '+v+'\n';
    if(!n){out.textContent+='(no command typed)\n';}
    else{
      var ok=false,dang=false;
      try{ok=new RegExp(ex.data.okRe,'i').test(n);}catch(e){ok=false;}
      try{dang=ex.data.dangerRe?new RegExp(ex.data.dangerRe,'i').test(n):false;}catch(e){dang=false;}
      if(dang){ex.data.dangerOut.forEach(function(l){out.textContent+=l+'\n';});}
      else if(ok){ex.data.output.forEach(function(l){out.textContent+=l+'\n';});}
      else{out.textContent+=(ex.data.notFound||('command not found: '+n.split(' ')[0]))+'\n';}
    }
    out.scrollTop=out.scrollHeight;
    $('#tin',area).focus();
  }
  $('#btn-run',area).onclick=run;
  $('#tin',area).onkeydown=function(ev){if(ev.key==='Enter'){ev.preventDefault();run();}};
  setTimeout(function(){var t=$('#tin',area);if(t)t.focus();},80);
}
/* ---------- branch ---------- */
function rBranch(area,ex){
  if(!ex._ans)ex._ans=[];
  if(!ex._view)ex._view=[];
  var si=Math.min(S.stepIdx,ex.data.steps.length-1);
  var wrap=el('div','opts');
  var step=ex.data.steps[si];
  /* shuffle each step's options once per attempt so the correct answer is not always in the same position */
  if(!ex._view[si])ex._view[si]=shuffle(step.options.map(function(o,k){return {o:o,k:k};}));
  ex._view[si].forEach(function(v,k){
    var o=v.o;
    var row=el('div','opt');row.tabIndex=0;row.setAttribute('role','radio');row.setAttribute('aria-checked','false');
    row.innerHTML='<span class="tag">'+'ABCDEF'[k]+'.</span><span class="txt">'+o.t+'</span><span class="selmark">&#9679; Selected</span>';
    row.onclick=function(){if(S.checked)return;var rs=wrap.querySelectorAll('.opt');
      for(var z=0;z<rs.length;z++){rs[z].classList.remove('selected');rs[z].setAttribute('aria-checked','false');}
      row.classList.add('selected');row.setAttribute('aria-checked','true');};
    wrap.appendChild(row);
  });
  area.appendChild(wrap);
  var br=el('div','btn-row');
  if(S.stepIdx>=ex.data.steps.length){
    lockArea(area);
  }else{
  br.innerHTML='<button class="btn btn-blue" id="btn-step">&#9998; Confirm step '+(S.stepIdx+1)+'</button>'+
    '<span class="fcredit">Your choice is locked in and hidden until the final Check — the timer keeps running between steps.</span>';
  area.appendChild(br);
  $('#btn-step',area).onclick=function(){
    if(S.checked)return;
    var sel=wrap.querySelector('.opt.selected');if(!sel)return;
    var k=Array.prototype.indexOf.call(wrap.querySelectorAll('.opt'),sel);
    ex._ans[S.stepIdx]=ex._view[S.stepIdx][k].k;S.stepIdx++;
    var stg=$('#stage');
    if(S.stepIdx<ex.data.steps.length){stg.innerHTML='';renderBlocks(stg,ex);}
    else{ /* final step recorded -> show Check */
      stg.innerHTML='';renderBlocks(stg,ex);
      var note=el('div','hintbox','<b>&#128304; All '+ex.data.steps.length+' steps recorded.</b> Your choices are hidden. Press Check to submit the whole chain and see the outcome.');
      $('#ansarea').appendChild(note);
      lockArea($('#ansarea'));
    }
    window.scrollTo(0,0);
  };
  }
}
/* ---------- grading ---------- */
function itemRow(kind,txt,why){
  var ic=kind==='correct'?'&#10004; Correct':(kind==='wrong'?'&#10008; Wrong':'&#9675; Missed');
  var cls=kind==='correct'?'i-correct':(kind==='wrong'?'i-wrong':'i-missed');
  return '<div class="itemrow '+cls+'"><span class="ic">'+ic+'</span><span><b>'+txt+'</b>'+(why?' — '+why:'')+'</span></div>';
}
function grade(ex){
  var r={credit:0,items:null,H:0,W:0,N:1,label:'',explain:ex.explain,danger:null};
  var t=ex.type;
  if(t==='qcm'){
    var sel=$('#ansarea').querySelector('.opt.selected');
    var k=sel?Array.prototype.indexOf.call($('#ansarea').querySelectorAll('.opt'),sel):-1;
    r.N=1;r.H=(k>=0&&ex._view[k].correct)?1:0;r.W=0;
    var o=k>=0?ex._view[k]:null;
    var correctOpt=ex._view.filter(function(x){return x.correct;})[0];
    r.items=itemRow(r.H?'correct':'wrong',o?('Your choice: '+o.t.replace(/<[^>]*>/g,'')):'No option selected',o?(o.correct?o.why:('Not correct here. Correct answer: '+correctOpt.t.replace(/<[^>]*>/g,'')+' &mdash; '+correctOpt.why)):'Nothing was selected, so the exercise scores 0.');
  }
  else if(t==='multi'){
    var rows=$('#ansarea').querySelectorAll('.opt');
    var picked={};rows.forEach(function(row,i){picked[i]=row.classList.contains('selected');});
    var its=[];var n=0,h=0,w=0;
    ex._view.forEach(function(o,i){
      if(o.correct){n++;if(picked[i]){h++;its.push(itemRow('correct','Selected: '+o.t.replace(/<[^>]*>/g,''),o.why));}
        else its.push(itemRow('missed','Missed: '+o.t.replace(/<[^>]*>/g,''),o.why));}
      else if(picked[i]){w++;its.push(itemRow('wrong','Wrong pick: '+o.t.replace(/<[^>]*>/g,''),o.why));}
    });
    r.N=n;r.H=h;r.W=w;r.items=its.join('');
  }
  else if(t==='match'){
    var its2=[];var n2=ex.data.left.length,h2=0,w2=0;
    ex.data.left.forEach(function(L,li){
      var s=$('#ms-'+li);var v=s?s.value:'';
      if(v===''){its2.push(itemRow('missed','No match chosen for: '+L.t.replace(/<[^>]*>/g,''),L.why));}
      else if(parseInt(v,10)===L.r){h2++;its2.push(itemRow('correct',L.t.replace(/<[^>]*>/g)+' &#8594; '+ex.data.right[L.r],L.why));}
      else{w2++;its2.push(itemRow('wrong',L.t.replace(/<[^>]*>/g)+' &#8594; '+ex.data.right[parseInt(v,10)],L.why));}
    });
    r.N=n2;r.H=h2;r.W=w2;r.items=its2.join('');
  }
  else if(t==='order'){
    var its3=[],n3=ex.data.items.length,h3=0,w3=0;
    for(var i=0;i<n3;i++){
      var placed=ex._seq[i];
      if(!placed){its3.push(itemRow('missed','Position '+(i+1)+' — '+ex.data.items[i].t,'Left empty. This step belongs here.'));}
      else if(placed.i===i){h3++;its3.push(itemRow('correct','Position '+(i+1)+' — '+placed.t,ex.data.items[i].why));}
      else{w3++;its3.push(itemRow('wrong','Position '+(i+1)+' — you placed: '+placed.t,ex.data.items[i].why));}
    }
    r.N=n3;r.H=h3;r.W=w3;r.items=its3.join('');
  }
  else if(t==='fill'){
    var its4=[],n4=ex.data.blanks.length,h4=0,w4=0;
    ex.data.blanks.forEach(function(b,bi){
      var s=$('#fb-'+bi);var v=s?s.value:'';
      if(v===''){its4.push(itemRow('missed','Blank '+(bi+1)+' left empty — answer: '+b.correct,b.why));}
      else if(v===b.correct){h4++;its4.push(itemRow('correct','Blank '+(bi+1)+': '+v,b.why));}
      else{w4++;its4.push(itemRow('wrong','Blank '+(bi+1)+': you chose '+v+' — answer: '+b.correct,b.why));}
    });
    r.N=n4;r.H=h4;r.W=w4;r.items=its4.join('');
  }
  else if(t==='drag'){
    var its5=[],n5=ex.data.items.length,h5=0,w5=0;
    ex.data.items.forEach(function(it){
      var dest=ex._place[it.id];
      if(!dest){its5.push(itemRow('missed','Still in bank: '+it.t,(ex.data.why&&ex.data.why[it.id])||'It belongs in: '+slotLabel(ex.data,ex.data.correct[it.id])));}
      else if(dest===ex.data.correct[it.id]){h5++;its5.push(itemRow('correct',it.t+' &#8594; '+slotLabel(ex.data,dest),(ex.data.why&&ex.data.why[it.id])||''));}
      else{w5++;its5.push(itemRow('wrong',it.t+' &#8594; '+slotLabel(ex.data,dest)+' — belongs in: '+slotLabel(ex.data,ex.data.correct[it.id]),(ex.data.why&&ex.data.why[it.id])||''));}
    });
    r.N=n5;r.H=h5;r.W=w5;r.items=its5.join('');
  }
  else if(t==='terminal'){
    var v=$('#tin')?$('#tin').value:'';
    var n=ex._norm?ex._norm(v):v.trim().toLowerCase();
    var its6=[];var h6=0,w6=0;
    ex.data.required.forEach(function(req){
      var hit=false;try{hit=new RegExp(req.re,'i').test(n);}catch(e){}
      if(hit){h6++;its6.push(itemRow('correct','Element present: '+req.label,req.why));}
      else its6.push(itemRow('missed','Element missing: '+req.label,req.why+' Expected something like: '+req.match));
    });
    if(ex.data.forbidden){ex.data.forbidden.forEach(function(f){
      var hit=false;try{hit=new RegExp(f.re,'i').test(n);}catch(e){}
      if(hit){w6++;its6.push(itemRow('wrong','Dangerous element present: '+f.label,f.why));}});}
    r.N=ex.data.required.length;r.H=h6;r.W=w6;r.items=its6.join('');
    if(w6>0){r.danger='&#10008; DANGEROUS — NEAR MISS: the command you typed would change or destroy state in a real incident ('+esc(ex.data.dangerWhy||'it alters the system you are investigating')+') . In live response, read-only or evidence-preserving commands come first.';}
  }
  else if(t==='branch'){
    var its7=[],n7=ex.data.steps.length,h7=0,w7=0;
    ex.data.steps.forEach(function(stp,si){
      var chosen=ex._ans?ex._ans[si]:-1;
      var opt=chosen>=0?stp.options[chosen]:null;
      if(opt&&opt.correct){h7++;its7.push(itemRow('correct','Step '+(si+1)+': '+opt.t.replace(/<[^>]*>/g,''),opt.why));}
      else if(opt){w7++;var co=stp.options.filter(function(x){return x.correct;})[0];
        its7.push(itemRow('wrong','Step '+(si+1)+': '+opt.t.replace(/<[^>]*>/g,''),opt.why+' Better: '+co.t.replace(/<[^>]*>/g,'')+' — '+co.why));}
      else its7.push(itemRow('missed','Step '+(si+1)+' — no choice recorded','This decision point was left empty.'));
    });
    r.N=n7;r.H=h7;r.W=w7;r.items=its7.join('');
  }
  r.credit=score(r.H,r.W,r.N);
  return r;
}
function slotLabel(d,sid){for(var i=0;i<d.slots.length;i++){if(d.slots[i].id===sid)return d.slots[i].label;}return sid;}
/* ---------- actions ---------- */
function doHint(){
  if(S.checked)return;var r=S.rec[S.cur];if(!r||r.hintUsed)return;
  r.hintUsed=true;updateHintBtn();
  var q=$('#stage .blk-question .blk-b');var h=el('div','hintbox','<b>&#128161; Hint</b> — using one costs 10% of this exercise&rsquo;s credit: '+S.curEx.hint);
  if(q)q.appendChild(h);
}
function doPause(){
  if(S.tState==='ENDED'||S.phase==='intro'||S.phase==='results')return;
  if(S.tState==='PAUSED_MANUAL')return;
  S.beforeManual=S.tState;S.pausedStage=S.stageMode;tSetState('PAUSED_MANUAL');
  var st=$('#stage');
  st.innerHTML='<div class="pausepanel"><div class="big">&#9208; PAUSED — manual</div><p>The exercise is hidden while you take a break. The clock is stopped.</p><button class="btn btn-blue" id="btn-resume">&#9654; Resume</button></div>';
  $('#btn-resume').onclick=doResume;
}
function doResume(){
  var back=S.beforeManual||'RUNNING';
  /* manual pause taken on top of the review-skipped screen returns to that screen */
  if(S.pausedStage==='list'){tSetState(back);showReview();window.scrollTo(0,0);return;}
  var st=$('#stage');st.innerHTML='';renderBlocks(st,S.curEx);
  if(S.checked&&S.lastResult){renderFeedback(S.lastResult);} /* restore graded view after manual pause on top of auto-pause */
  tSetState(back);
  window.scrollTo(0,0);
}
function doSkip(){
  if(S.checked||S.phase!=='exam')return;
  if(S.rec[S.cur].status!=='skipped'){S.rec[S.cur].status='skipped';S.skipped.push(S.cur);}
  advance();
}
function advance(){
  var np=nextPending(S.order.indexOf(S.cur));
  if(np>=0){showExercise(S.order[np],false);return;}
  if(S.skipped.length){showReview();return;}
  showResults();
}
function doCheck(auto){
  if(S.checked||S.tState==='ENDED')return;
  if(!auto){var need=false;
    if(S.curEx.type==='branch'&&S.stepIdx<S.curEx.data.steps.length)return; /* confirm steps first */
  }
  tSetState('PAUSED_AUTO_CHECK'); /* FIRST ACTION per spec */
  S.checked=true;
  var r=grade(S.curEx);
  if(S.rec[S.cur].hintUsed){r.credit=Math.max(0,r.credit-0.10);}
  S.rec[S.cur].credit=r.credit;S.rec[S.cur].status='done';S.answered++;S.creditSum+=r.credit;
  var sk=S.skipped.indexOf(S.cur);if(sk>=0)S.skipped.splice(sk,1); /* answered during review */
  S.lastResult=r;
  renderFeedback(r);
  updateHeader();
}
function renderFeedback(r){
  lockArea($('#ansarea'));
  var ex=S.curEx;
  var lab,cls;
  if(r.credit>=1){lab='&#10004; CORRECT';cls='f-correct';}
  else if(r.credit>0){lab='&#10004; PARTIALLY CORRECT';cls='f-partial';}
  else{lab='&#10008; INCORRECT';cls='f-incorrect';}
  var fb=el('div','feedback '+cls);
  var creditLine=(r.N>1||r.credit<1)?'<div class="fcredit">Credit <b>'+r.credit.toFixed(2)+'</b> — '+Math.round(r.H)+' correct / '+Math.round(r.W)+' wrong / '+r.N+' items &nbsp;(formula: (H &minus; W) &divide; N)'+(S.rec[S.cur].hintUsed?' &nbsp;&middot;&nbsp; includes &minus;0.10 hint penalty':'')+'</div>':'';
  var canon='';
  if(ex.type==='terminal'){
    canon='<div class="canon"><div class="fcredit" style="margin:8px 0 4px">Canonical command (copyable):</div><code id="canontext">'+esc(ex.data.canonical)+'</code>'+
      '<div class="btn-row"><button class="btn btn-ghost" id="btn-copy">&#128203; Copy</button></div></div>';
  }
  fb.innerHTML='<div class="fhead">'+lab+'</div>'+creditLine+
    (r.danger?'<div class="danger">'+r.danger+'</div>':'')+
    (r.items?'<div class="items">'+r.items+'</div>':'')+
    '<div class="fexplain">'+r.explain+'</div>'+canon+
    '<div class="study">&#128218; What to study next: '+ex.study+'</div>';
  $('#stage').appendChild(fb);
  var cp=$('#btn-copy');
  if(cp)cp.onclick=function(){var txt=ex.data.canonical;
    try{navigator.clipboard.writeText(txt).then(function(){cp.textContent='&#128203; Copied';},function(){fallbackCopy(txt);cp.textContent='&#128203; Copied';});}
    catch(e){fallbackCopy(txt);cp.textContent='&#128203; Copied';}};
  /* next button */
  var br=$('#btrow');
  var lastOne=!(nextPending(S.order.indexOf(S.cur))>=0)&&S.skipped.length===0;
  br.innerHTML='';
  var nb=el('button','btn btn-blue',lastOne&&S.skipped.length===0?'&#10148; Final Submit':'Next &#9654;');
  nb.onclick=function(){
    var np=nextPending(S.order.indexOf(S.cur));
    if(np>=0){showExercise(S.order[np],false);return;}
    if(S.skipped.length){showReview();return;}
    showResults();
  };
  br.appendChild(nb);
}
function fallbackCopy(t){try{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}catch(e){}}
/* ---------- review skipped ---------- */
function showReview(){
  S.phase='review';S.stageMode='list';
  /* returning to the review-skipped screen also resumes the clock (unless it already ended) */
  if(S.tState!=='ENDED'&&S.tState!=='RUNNING')tSetState('RUNNING');
  var sb=$('#btn-skip');if(sb)sb.disabled=true;
  var st=$('#stage');st.innerHTML='';
  updateHeader();
  var card=el('div','card');
  var rows='';
  S.skipped.forEach(function(ix,i){
    rows+='<div class="rvrow"><span class="t">'+(i+1)+'. '+EXERCISES[ix].reviewLabel+'</span>'+
      '<span class="rvtag">&#9888; Skipped</span><button class="btn btn-ghost" data-rv="'+ix+'">&#9998; Answer now</button></div>';
  });
  card.innerHTML='<div class="sechead"><span class="si">&#9888;</span>Review skipped exercises</div>'+
    '<p class="intro-sub">These '+S.skipped.length+' exercise(s) are still unanswered. Answer as many as the clock allows — anything you leave now is excluded from the score (it counts neither for you nor against you). The clock is still running.</p>'+rows+
    '<div class="btn-row" style="margin-top:14px"><button class="btn btn-primary" id="btn-finish">&#10148; Submit final results</button></div>';
  st.appendChild(card);
  var bs=card.querySelectorAll('[data-rv]');
  for(var i=0;i<bs.length;i++){bs[i].onclick=function(){var ix=parseInt(this.getAttribute('data-rv'),10);showExercise(ix,true);};}
  $('#btn-finish').onclick=showResults;
  window.scrollTo(0,0);
}
/* ---------- results ---------- */
function showResults(){
  if(S.tickId){clearInterval(S.tickId);S.tickId=null;}
  tSetState('ENDED');S.phase='results';S.stageMode='results';
  var sb=$('#btn-skip');if(sb)sb.disabled=true;
  var full=0,part=0,zero=0,partSum=0;
  for(var k in S.rec){var r=S.rec[k];if(r.status!=='done')continue;
    if(r.credit>=1)full++;else if(r.credit>0){part++;partSum+=r.credit;}else zero++;}
  var left=S.skipped.length;
  var pct=S.answered>0?Math.round(S.creditSum/S.answered*100):0;
  var passed=pct>=META.passMark;
  var st=$('#stage');st.innerHTML='';
  var card=el('div','card');
  card.innerHTML='<div class="result-head '+(passed?'pass':'fail')+'">'+(passed?'&#10004; PASS':'&#10008; FAIL')+'</div>'+
    '<div class="scorebig">'+pct+'%</div>'+
    '<div class="intro-sub">'+S.creditSum.toFixed(1)+' credit points over '+S.answered+' answered exercise(s) — pass mark '+META.passMark+'%. '+(passed?'Well done. ':'Below the pass mark — retake the exam to improve. ')+'Skipped-and-never-answered exercises are excluded from both the points and the total.</div>'+
    '<div class="statgrid">'+
    '<div class="stat s-c"><span class="sl">&#10004; Fully correct</span><span class="sv">'+full+'</span></div>'+
    '<div class="stat s-p"><span class="sl">&#10004; Partially correct</span><span class="sv">'+part+'</span><span class="sl">'+(part?'avg '+(partSum/part).toFixed(2)+' credit':'')+'</span></div>'+
    '<div class="stat s-w"><span class="sl">&#10008; Fully incorrect</span><span class="sv">'+zero+'</span></div>'+
    '<div class="stat s-s"><span class="sl">&#9888; Skipped — excluded</span><span class="sv">'+left+'</span></div>'+
    '</div>'+
    '<div class="pauselog">&#9201; Time log — paused manually: <b>'+mmss(S.manualTotal)+'</b> &middot; paused for feedback review: <b>'+mmss(S.autoTotal)+'</b> &middot; clock remaining: <b>'+mmss(S.remaining)+'</b></div>'+
    (passed?'<div class="certificate">&#127942; <b>Certificate note:</b> you passed the '+esc(META.sevWord)+' certification exam for '+esc(META.objId)+' — '+esc(META.objName)+'. Your score has been reported to the platform.</div>':'')+
    '<div class="btn-row" style="margin-top:14px"><button class="btn btn-amber" id="btn-retake">&#8635; Retake exam</button></div>';
  st.appendChild(card);
  $('#btn-retake').onclick=function(){startExam();};
  reportScore(S.creditSum,S.answered,pct);
  window.scrollTo(0,0);
}
function reportScore(creditSum,answeredCount,percent){
  if(S.reported)return;S.reported=true;
  try{
    parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,
      score:Math.round(creditSum),total:answeredCount,percent:percent,passed:percent>=META.passMark},location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}
/* ---------- handshake ---------- */
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  S.user=event.data.username||null;
  S.country=event.data.country||null;S.locale=event.data.locale||null; /* consumed — the file stays dark-only regardless of theme */
  var tb=document.querySelector('.topbar');
  if(S.user&&tb&&!tb.querySelector('.u-chip')){
    var c=el('span','chip u-chip','&#128100; '+esc(S.user));tb.insertBefore(c,document.getElementById('btn-hint'));
  }
});
/* ---------- init ---------- */
function init(){S=freshState();renderIntro();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();


</script>
