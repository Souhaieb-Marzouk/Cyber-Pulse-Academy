<style>

}
.progress i {
  display: block; height: 100%; width: 0;

  position: relative; transition: width 0.4s ease;

  content: ""; position: absolute; inset: 0;
  background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.22) 50%, transparent 70%);

}
@keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* ---------- three exercise blocks ---------- */
.blk { border-left: 4px solid var(--accent-blue); margin-top: 16px; }
.blk-q { border-left-color: var(--accent-amber); }
.blk-a { border-left-color: var(--accent-green); }
.blk-h {
  display: flex; align-items: center; gap: 8px;

  margin-bottom: 8px;
}
.blk-s .blk-h { color: var(--accent-blue); }
.blk-q .blk-h { color: var(--accent-amber); }
.blk-a .blk-h { color: var(--accent-green); }
.blk-s { background: linear-gradient(180deg, rgba(90,169,255,0.06), transparent 60%), var(--bg-surface); }
.blk-q { background: linear-gradient(180deg, rgba(255,180,84,0.06), transparent 60%), var(--bg-surface); }
.blk-a { background: linear-gradient(180deg, rgba(87,211,140,0.05), transparent 60%), var(--bg-surface); }

.qtext { font-weight: 700; font-size: 17px; }

  color: var(--accent-amber); border: 1px solid var(--accent-amber);
  border-radius: 6px; padding: 1px 8px; margin-bottom: 8px;
}

}
.artefact-label {

  font-family: ui-monospace, Menlo, Consolas, monospace;
}
pre.log {
  margin: 0; padding: 10px 12px; overflow-x: auto;
  font-size: 14px; line-height: 1.5; color: var(--text-mono);

}
.log .c { color: #7f93b8; }        /* comment / quiet */
.log .k { color: var(--accent-blue); }  /* keyword */
.log .n { color: #9d7bff; }        /* number */

.log .b { color: var(--state-incorrect); background: rgba(255,107,107,0.10); display: inline-block; width: 100%; }
.log .g { color: var(--accent-green); }
.logview-tools { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg-surface-2); }
.logview-tools input {
  flex: 1; min-height: 36px; background: var(--bg-page); color: var(--text-mono);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 14px;
}
.logview-count { font-size: 12.5px; color: var(--text-secondary); white-space: nowrap; }

.opts { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.opt {
  display: flex; align-items: center; gap: 10px; width: 100%;
  min-height: 46px; padding: 9px 14px; text-align: left;
  background: var(--bg-surface-2); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
}
.opt:hover { background: #16203a; }
.opt.sel { border-color: var(--accent-blue); box-shadow: 0 0 0 1px var(--accent-blue), 0 0 14px rgba(90,169,255,0.25); }
.opt-letter {
  font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700;

.pool { flex: 1 1 240px; min-width: 220px; }

.pool-box, .bank-box {
  border: 1px dashed var(--border); border-radius: 8px;
  padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 64px;
}
.bank { flex: 1 1 240px; min-width: 220px; }
.bank-box { border-style: dashed; }
.bank-box.over, .pool-box.over, .slot.over { border-color: var(--accent-green); background: rgba(87,211,140,0.07); }
.chip {

  min-height: 44px; padding: 7px 12px; cursor: grab;

  color: var(--text-primary); text-align: left; font-size: 14.5px;
}
.chip.picked { border-color: var(--accent-amber); box-shadow: 0 0 0 1px var(--accent-amber); }
.pick-tag { margin-left: auto; color: var(--accent-amber); font-weight: 700; font-size: 12px; white-space: nowrap; }

.slot-row { display: flex; align-items: stretch; gap: 8px; }

.bankrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

.term {

  padding: 10px 12px; min-height: 130px; max-height: 260px; overflow-y: auto;

.fb-partial  { border-color: var(--state-partial);  background: rgba(255,180,84,0.07); }
.fb-incorrect{ border-color: var(--state-incorrect); background: rgba(255,107,107,0.07); }
.fb-h { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.fb-formula { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 8px; }
.fb-items { list-style: none; margin: 8px 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.fb-items li {

.alert-title { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.alert-meta { font-size: 13px; color: var(--text-secondary); font-family: ui-monospace, Menlo, Consolas, monospace; }

.outcome { border-left: 3px solid var(--accent-blue); background: var(--bg-surface-2); padding: 8px 12px; border-radius: 0 8px 8px 0; margin-top: 10px; }

/* ---------- review / results ---------- */
.review-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--bg-surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px; margin: 8px 0;
}
.result-grid { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
.result-cell {
  flex: 1 1 200px; background: var(--bg-surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px;

.result-cell b { display: block; font-size: 22px; }
.banner { border-radius: 10px; padding: 16px 18px; font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.banner-pass { border: 1px solid var(--state-correct); background: rgba(87,211,140,0.10); color: var(--state-correct); }
.banner-fail { border: 1px solid var(--state-incorrect); background: rgba(255,107,107,0.10); color: var(--state-incorrect); }
.xtable { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
.xtable th, .xtable td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.xtable th { color: var(--text-secondary); font-size: 12.5px; letter-spacing: 0.5px; }

/* ---------- pause overlay ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(4, 8, 18, 0.90); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; text-align: center;
}
.overlay-card { max-width: 480px; padding: 26px; }
.overlay-card .big { font-size: 24px; font-weight: 800; color: var(--state-paused); margin: 10px 0; }

@media (max-width: 760px) {
  .wrap { padding: 12px 10px 48px; }
  .xhead-in { gap: 6px 8px; }
  .facts div { min-width: 120px; }
  .dnd { flex-direction: column; }
  .filltext input { width: 130px; }
}
@media (prefers-reduced-motion: reduce) {
  .progress i { transition: none; }
  .progress i::after { animation: none; display: none; }
  * { transition: none !important; }
}
</style>

<script type="application/json" id="exam-data">{"meta": {"id": "T1601.001", "name": "Patch System Image", "parent": "T1601 Modify System Image", "domain": "Enterprise", "tactic": "Defense Impairment", "platform": "Network Devices", "topicId": "t1601.001", "version": "2.0", "updated": "12 May 2026", "estMin": 70, "budgetSec": 4200, "siteTitle": "T1601.001 Patch System Image — EXTREMELY HARD", "title_tag": "T1601.001 — EXTREMELY HARD practice exam", "sev": "EXTREMELY HARD", "sevClass": "sev-extreme", "sevVar": "var(--sev-extreme)", "difficulty": "extremely-hard", "batch": 4, "passMark": 70}, "learn": "\n<p>This is the <b>EXTREMELY HARD<\/b> tier for <b>T1601.001 — Patch System Image<\/b> (sub-technique of <b>T1601 — Modify System Image<\/b>): an attacker changes the operating system of a <b>network device<\/b> — in storage, in memory via debug commands, or with boot-loader help (<b>ROMMONkit<\/b>, T1542.004). Here the exam mirrors a senior decision seat. Objectives arrive as stakeholder demands (“the CISO needs a decision in 10 minutes”), not as questions. Signals contradict each other and you must say which one wins and why. Some correct answers cost real money or uptime; one right answer is “do nothing yet.” One widely taught best practice is wrong in this specific context — finding it is the point.<\/p>\n<p>The roles you step into: senior <b>IR lead<\/b> on a border HA pair under a no-downtime constraint; <b>detection engineer<\/b> turning analytic <b>DET0469/AN1293<\/b> plus out-of-band telemetry (SNMP <code>sysDescr<\/code>, config archives, TACACS+ accounting) into tuned rules; <b>CTI analyst<\/b> reporting <b>S0519 SYNful Knock<\/b>-style findings without over-attributing; <b>GRC owner<\/b> proving a control actually operates. Artefact sets include realistic noise (BGP flaps, UPS alarms, NTP syncs) and honest gaps (a 30-minute TACACS+ hole). Everything else stays as in lower tiers: partial credit, one hint per exercise, unlimited review after Check.<\/p>\n", "keywords": [{"theme": "Conflict resolution", "items": ["Device CLI output vs independent hash — which wins", "SNMP sysDescr drift vs patched show version", "TACACS+ gap vs logged session from suspect host", "Ticket exists vs transfer outside window"]}, {"theme": "Chained TTPs", "items": ["T1601.001 storage + memory patching", "T1601.002 Downgrade combo", "T1542.004 ROMMONkit persistence", "T1542.005 TFTP Boot", "T1600 Weaken Encryption outcome", "False CLI output maintained by the patch"]}, {"theme": "Senior response economics", "items": ["Evidence before state change (legal hold)", "Least-aggressive containment on HA pairs", "Accepted business cost vs unbounded risk", "Do-nothing-yet as a valid decision", "Peer hunting and fleet-wide hash sweeps"]}, {"theme": "Controls & audit", "items": ["M1046 Boot Integrity operating evidence", "M1045 signed golden images", "M1032 TACACS+/RADIUS MFA", "Control operating evidence vs policy paperwork"]}, {"theme": "Reporting discipline", "items": ["Technique + family with confidence levels", "No over-attribution", "DET0469 anchoring", "Executive impact wording"]}], "howExtra": "<li><b>Expert tier:<\/b> expect 3+ chained concepts, at least one contradictory-signal pair you must resolve explicitly, one correct action with a real cost, one “do nothing yet” answer, and one best practice that is wrong in context. Hints restate constraints; they never point at answers.<\/li>", "exercises": [{"id": "X01", "type": "logview", "multi": true, "persp": "def", "summary": "Isolate the implant chain from realistic noise", "scenario": "<p>04:40, IR bridge open. <b>rtr-core-fra-01<\/b> (active border, trading floor behind it) plus artefacts below. Known context: maintenance window <b>22:00–23:00<\/b> (ticket CM-2601, tagged MNT in accounting); the rack UPS is failing; the ISP ran BGP work at 03:30; TACACS+ accounting has a hole <b>02:10–02:40<\/b>. State which events belong to the implant chain — nothing else.<\/p>", "artefacts": [{"label": "Artefact 1 — TACACS+ accounting (selected)", "filter": true, "code": "Nov 12 22:31:07 [MNT] acct: user=netops on rtr-core-fra-01: copy scp://10[.]44[.]9[.]200/golden/ios-17.9.5a.bin flash:\nNov 12 22:32:40 [MNT] acct: user=netops on rtr-core-fra-01: verify /md5 flash:ios-17.9.5a.bin\n-- (accounting gap 02:10:00-02:40:59 — AAA buffer overflow, unparsed) --\n!!Nov 13 02:47:19 acct: user=svc_backup on rtr-core-fra-01 (vty3, 10[.]52[.]8[.]7): copy tftp://10[.]52[.]8[.]7/ios-image.bin flash:\n!!Nov 13 02:49:10 acct: user=svc_backup on rtr-core-fra-01 (vty3): boot system flash:ios-image.bin\n!!Nov 13 02:58:41 acct: user=svc_backup on rtr-core-fra-01 (vty3): reload"}, {"label": "Artefact 2 — Syslog + infra events", "code": "!!Nov 13 02:58:44 rtr-core-fra-01 %SYS-5-RELOAD: Reload requested by svc_backup on vty3\nNov 13 03:30:12 rtr-core-fra-01 %BGP-5-ADJCHANGE: neighbor 10[.]80[.]1[.]9 Down (ISP maintenance)\nNov 13 03:31:02 rtr-core-fra-01 %BGP-5-ADJCHANGE: neighbor 10[.]80[.]1[.]9 Up\nNov 13 03:44:51 ups-rack-7: on battery, 12 percent remaining (hardware alarm)"}, {"label": "Artefact 3 — Hash table (OOB measurement, 04:15)", "code": "flash:ios-17.9.5a.bin   vendor MD5 9f2c...a1   MATCH\nflash:ios-image.bin     vendor MD5 —          NO VENDOR RECORD (unsigned build)"}], "question": "Select ALL events that belong to the implant chain on rtr-core-fra-01.", "options": [{"t": "02:47:19 TFTP image push by svc_backup", "ok": true, "why": "The unsigned image arrives from an unmanaged host after a suspicious AAA gap — chain step 1."}, {"t": "02:49:10 boot system variable re-pointed to ios-image.bin", "ok": true, "why": "Chain step 2: the device is aimed at the unsigned file."}, {"t": "02:58:41 reload requested by svc_backup", "ok": true, "why": "Chain step 3: activation. The 02:58:44 syslog RELOAD confirms it executed."}, {"t": "22:31 [MNT] SCP push by netops", "ok": false, "why": "Ticketed, tagged maintenance, hash-verified golden build — the near miss dressed as the implant."}, {"t": "03:30 BGP adjacency change", "ok": false, "why": "ISP maintenance explains it; routing flaps are not image events."}, {"t": "03:44 UPS on-battery alarm", "ok": false, "why": "A failing UPS in the rack is noise — alarming, unrelated to the OS image."}], "hint": "The chain is exactly three steps on one device by one account. Everything else has another owner.", "explain": "The chain is: unsigned image in (02:47), boot variable aimed at it (02:49), reload (02:58) — all by svc_backup, all after the AAA gap that hides the session's beginning (incomplete information you must reason around). The MNT push fails the 'implant' test because ticket, window, and hash all pass; the BGP and UPS events have unrelated owners. Senior discipline = exact scope, no drama by association.", "study": "Chain isolation under noise; reasoning around telemetry gaps."}, {"id": "X02", "type": "tree", "persp": "dual", "summary": "Four decisions under executive pressure", "question": "Take the four decisions in order — the CISO is waiting on each one.", "scenario": "<p>05:10. The CISO joins the bridge: “Reboot that router NOW, memory malware dies with a reboot, everyone knows that.” Artefacts: flash contains an unsigned <code>ios-image.bin<\/code>; the boot variable was re-pointed at 02:49; transit for the trading floor runs on this device; legal wants court-usable evidence. Four decisions.<\/p>", "steps": [{"text": "Immediate response to the reload demand?", "options": [{"t": "Block OOB access, keep the device running, hash evidence first", "ok": true, "outcome": "You buy the bridge an hour: access blocked out-of-band, hashes and logs exported while the device keeps serving transit.", "why": "Evidence before state change; a reload would either activate a staged patch or destroy the memory-only story — both bad, both irreversible."}, {"t": "Comply — reload immediately", "ok": false, "outcome": "The device boots... whatever the boot variable points at. If that is the attacker's file, you just activated the implant yourself.", "why": "The boot variable was re-pointed at 02:49. Rebooting now is the attacker's plan with your signature on it."}, {"t": "Pull the power cables to freeze everything", "ok": false, "outcome": "Transit for the trading floor dies instantly; volatile evidence survives but the business does not forgive the 40-minute outage.", "why": "Defensible in a malware-only world; here the cost is unbounded and the same evidence is available without downtime."}]}, {"text": "The bridge accepts your call. What do you state about the reboot option?", "options": [{"t": "Reject for now: a reload would activate the staged file AND drop transit; revisit after the rebuild window", "ok": true, "outcome": "The CISO records a reasoned no with two concrete costs. The room moves to evidence and rebuild planning.", "why": "Two signals win explicitly: the boot variable (what a reload activates) and the transit dependency (what a reload costs)."}, {"t": "Agree — rebooting is best practice for memory malware", "ok": false, "outcome": "The playbook line wins over the evidence line. The implant, if staged, becomes official.", "why": "The best practice assumes the boot path is clean. Here the artefacts say it is not — context beats canon."}, {"t": "Compromise: reboot only during lunch", "ok": false, "outcome": "A quieter version of the same mistake, scheduled.", "why": "Timing changes the blast radius, not what the reload activates."}]}, {"text": "Legal asks what evidence exists for court. What do you commit to?", "options": [{"t": "Image file + TACACS+ accounting + config diffs exported to the evidence vault before any device change", "ok": true, "outcome": "Legal gets a defensible package: original file, command history, and the config delta, hash-chained to the vault.", "why": "Court needs originals and continuity. All three artefacts can leave the device without touching device state."}, {"t": "Format the flash to protect privacy, we have screenshots", "ok": false, "outcome": "The primary artefact is destroyed. Legal now has screenshots of a live session and an erased exhibit.", "why": "Destruction of evidence to protect privacy is a legal own-goal; minimisation happens on copies, not originals."}, {"t": "Promise the vendor's word that the image is fine", "ok": false, "outcome": "The vendor says it cannot certify an unsigned file. The bridge loses ten minutes and credibility.", "why": "The vendor is the root of trust for signed builds — which is exactly why the unsigned file fails."}]}, {"text": "Morning report wording?", "options": [{"t": "T1601.001 confirmed via hash + chain; pattern matches S0519 SYNful Knock; actor unknown", "ok": true, "outcome": "Leadership gets technique, precedent, and an honest confidence level. CTI can enrich later without retracting.", "why": "Technique and family are provable from artefacts; attribution is not. Separating them is senior reporting."}, {"t": "Attribute to the original 2015 SYNful Knock operators", "ok": false, "outcome": "A decade-old case gets new suspects on thin evidence; every later statement inherits the risk.", "why": "Shared technique and tooling are not proof of shared actors. Over-attribution is the classic executive-report failure."}, {"t": "Report a device malfunction, omit the technique", "ok": false, "outcome": "The board hears 'hardware hiccup' while the patch sits one approved reboot away from activation.", "why": "Under-reporting an impairment technique hides the control gap that let it happen."}]}], "hint": "One decision is 'no — and here are the two costs'. One report line separates what you know from what you suspect.", "explain": "Four chained calls: refuse the premature reload (boot variable + transit cost), say why on the record, commit only to state-preserving evidence, and report technique + family without inventing an actor. Attacker perspective: the plan counted on a panic reload — you declined. Defender perspective: the same facts drove evidence, containment, and honest reporting in one pass.", "study": "Executive communication under pressure; evidence lawfulness; attribution confidence."}, {"id": "X03", "type": "terminal", "persp": "def", "summary": "Preserve the image file before access is locked", "scenario": "<p>Change control gives you <b>90 seconds<\/b> of privileged CLI on <b>rtr-core-fra-01<\/b> before the account is locked for the rebuild. Legal's priority list: the patched image file itself, <code>flash:ios-image.bin<\/code>, must reach the evidence vault (<code>scp://10[.]44[.]9[.]200/evidence/fra-01/<\/code>). Nothing on the device may change. One command, typed once, correctly.<\/p>", "question": "Type the command that preserves the image file to the evidence vault, then press Enter.", "term": {"prompt": "rtr-core-fra-01#", "shellName": "network device CLI", "canonical": "copy flash:ios-image.bin scp:", "canonicalWhy": "'copy' moves the file; 'flash:ios-image.bin' is the source exhibit; 'scp:' sends it to the vault over SSH without touching device state.", "outputs": [{"re": "copy.*flash|flash.*scp|scp", "out": "Address or name of remote host [10[.]44[.]9[.]200]?\nDestination filename [evidence/fra-01/ios-image.bin]?\nWriting ios-image.bin !13894612 bytes copied in 4.1 secs"}], "defaultOut": "", "requires": [{"re": "\\bcopy\\b", "label": "the copy tool", "why": "copy exports a file without changing the device."}, {"re": "flash:ios-image\\.bin", "label": "source = flash:ios-image.bin", "why": "The exact exhibit legal named — not the golden image, not the config."}, {"re": "scp:", "label": "destination = scp:", "why": "The vault speaks SCP; the transfer must not alter the source."}], "forbid": [{"re": "\\breload\\b|write erase|\\bformat\\b", "label": "reload / write erase / format", "why": "Any of these destroys the exhibit or the running evidence — the exact opposite of the objective."}, {"re": "delete\\s+flash:", "label": "delete flash: ...", "why": "Deleting the file erases the primary evidence in the only 90 seconds you had."}]}, "hint": "Source first, destination second — and the exhibit is the file legal named, nothing else.", "explain": "Canonical: copy flash:ios-image.bin scp:. Under a 90-second lock, the dangerous near misses are tempting: a reload 'to be safe' destroys the runtime story; delete flash: erases the exhibit entirely. The senior move is the boring one: read-only export of exactly the named file, then let change control lock the box.", "study": "Evidence export commands; read-only discipline under time pressure."}, {"id": "X04", "type": "multi", "persp": "def", "summary": "Two versions, one device, which wins", "scenario": "<p>Artefacts: <code>show version<\/code> on rtr-core-fra-01 prints “Version 17.9.5a” (fleet baseline). An out-of-band SNMP walk reports <code>sysDescr<\/code> = “15.4(3)M8” — an older train nobody has run since 2023. The SNMP agent is a separate subsystem from the CLI parser; both were collected at 04:15. Select every statement that is TRUE.<\/p>", "question": "Select ALL statements that are TRUE about this conflict.", "options": [{"t": "The CLI version output cannot be trusted as evidence here", "ok": true, "why": "A patched image can make compromised commands print false output; the CLI is the suspect, not the witness."}, {"t": "The device likely runs a downgraded image with a patched CLI", "ok": true, "why": "An older sysDescr from an independent subsystem plus a fake 'newest' CLI string is the downgrade-plus-patch signature (T1601.002 + T1601.001)."}, {"t": "The SNMP sysDescr is the more trustworthy signal", "ok": true, "why": "It comes from a separate subsystem on the out-of-band plane, outside the patched CLI's control."}, {"t": "The CLI-vs-SNMP mismatch is itself an indicator worth alerting on", "ok": true, "why": "Two independent sources disagreeing about one fact is a high-fidelity, cheap analytic — RULE B material."}, {"t": "The SNMP agent must simply be broken", "ok": false, "why": "'Broken agent' is the rationalisation the attacker hopes for; nothing in the artefacts supports a malfunction."}, {"t": "Both strings describe the same running software correctly", "ok": false, "why": "One device cannot run two OS trains at once; the disagreement is the finding, not a coincidence."}], "hint": "Ask who controls each speaker: the patched CLI talks for the attacker; SNMP talks from another plane.", "explain": "Four truths: the CLI is attacker-controllable, the SNMP reading is the more independent witness, the pattern reads as downgrade+patch, and the mismatch itself is a first-class analytic. The two falsehoods are the comfortable ones — 'the agent is broken' and 'both are right'. Seniors resolve conflicts by asking which source the attacker could reach; juniors resolve them by asking which answer is less work.", "study": "Out-of-band SNMP sysDescr baselining; conflict-of-sources analysis."}, {"id": "X05", "type": "qcm", "persp": "def", "summary": "The best practice that fails this context", "scenario": "<p>Your SOC playbook, page 12: “Hosts with memory-resident malware: reboot to clear memory, then remediate.” The bridge applies it to rtr-core-fra-01. Artefacts say: unsigned <code>ios-image.bin<\/code> in flash, boot variable re-pointed at 02:49, trading-floor transit on this device.<\/p>", "question": "Why is the playbook's reboot step the WRONG action in this specific context?", "options": [{"t": "The boot variable points at the patched file, so a reload activates the implant and drops transit", "ok": true, "why": "Rebooting a device whose boot path is attacker-controlled runs the attacker's code — and the trading floor loses transit."}, {"t": "Reboots are only allowed on weekends", "ok": false, "why": "A scheduling rule does not address what the reboot would activate."}, {"t": "The playbook page number must be cited in the ticket", "ok": false, "why": "Process trivia; the artefacts, not the page number, decide the action."}, {"t": "Memory malware never actually clears on reboot", "ok": false, "why": "It usually does clear — which is exactly why this near miss sounds right until you read the boot variable."}], "hint": "The playbook assumes a clean boot path. Read the 02:49 artefact again.", "explain": "The best practice is right in its home context (clean boot path, memory-resident payload) and wrong here (boot path re-pointed to an unsigned file). The general lesson: playbooks encode assumptions; artefacts confirm or break them. Saying 'the playbook is wrong here, and here is the line that breaks it' is the senior sentence; silently following the book is the junior one.", "study": "Playbook assumption analysis; the boot variable as the decision pivot."}, {"id": "X06", "type": "dnd", "persp": "def", "summary": "Tag six artefacts into four objects", "scenario": "<p>CTI enrichment for the fra-01 case. Six artefacts, four buckets. Two artefacts will share a bucket.<\/p>", "question": "Drag each artefact to the ATT&CK object it evidences.", "banks": [{"label": "T1601.001 Patch System Image"}, {"label": "T1601.002 Downgrade System Image"}, {"label": "T1542.004 ROMMONkit"}, {"label": "Benign / unrelated"}], "items": [{"t": "Unsigned ios-image.bin in flash; hash has no vendor record", "bank": 0, "why": "The patched storage image is the core T1601.001 evidence."}, {"t": "Boot variable re-pointed at 02:49 by svc_backup", "bank": 0, "why": "Re-pointing the boot path is the activation half of the storage patch."}, {"t": "SNMP sysDescr reports the old 15.4(3)M8 train", "bank": 1, "why": "An older OS train on the wire is the downgrade signature (T1601.002)."}, {"t": "ROMMON checksum unknown after an unscheduled power event", "bank": 2, "why": "Bootloader-layer tampering evidence maps to ROMMONkit (T1542.004)."}, {"t": "[MNT] ticketed, hash-matched SCP push inside the window", "bank": 3, "why": "Ticket + window + vendor hash = managed change, not attacker evidence."}, {"t": "Rack UPS on-battery alarm at 03:44", "bank": 3, "why": "Facilities noise; it explains the power event, not the implant."}], "hint": "Two artefacts belong to the patch itself; the old train and the bootloader are separate objects; two rows are innocent.", "explain": "One incident, three ATT&CK objects: the patch (T1601.001) with two artefacts, the downgrade (T1601.002), and possible boot-layer persistence (T1542.004 ROMMONkit) — plus two benign rows that would poison the matrix if tagged. The mapping matters because each object carries different mitigations (M1045/M1046 for the patch, vendor advisories for the ROMMON layer).", "study": "Multi-object tagging for one incident; CTI matrix enrichment."}, {"id": "X07", "type": "order", "persp": "def", "summary": "Six moves, one correct order", "scenario": "<p>The fra-01 plan goes to the CISO in one slide. Constraints: trading floor needs transit; legal needs originals; auditors need proof. Order the plan.<\/p>", "question": "Drag the six moves into the execution order.", "steps": ["Verify scope: hash both HA members out-of-band before any device action", "Preserve legal evidence: export the image file, TACACS+ accounting, and config diffs to the vault", "Drain transit to the standby and isolate the affected unit's management plane, out-of-band", "Brief the CISO with the rebuild decision inside the approved maintenance window", "Rebuild from the vendor-signed golden image; verify signed boot and hash before re-admitting", "Hunt peers: fleet-wide baseline hash sweep and boot-variable drift report"], "hint": "Scope first, evidence second, containment third — the rebuild only happens after the decision, and the hunt outlives it.", "explain": "The order encodes the senior defaults: verify before acting (never rebuild a device you have not scoped), preserve before changing (legal originals), contain with the HA design instead of power switches, decide with leadership, rebuild with proof, then extend the win fleet-wide. Every tempting shortcut (rebuild first, hunt later, skip the brief) creates a specific, nameable loss.", "study": "Senior IR sequencing on revenue-critical infrastructure."}, {"id": "X08", "type": "fill", "persp": "def", "summary": "Five load-bearing words in the exec report", "question": "Complete the five blanks of the executive report with words from the bank.", "scenario": "<p>Two paragraphs of the CISO report. Five blanks carry the meaning; five words are decoys.<\/p>", "text": "Confirmed: T1601.001 on rtr-core-fra-01. The implant matches the {0} (S0519) pattern: the device's {1} image was replaced and the {2} variable re-pointed. Because the device's own CLI prints false output, we performed {3} verification out-of-band. Business impact was avoided by draining traffic to the {4} member.", "bank": ["SYNful Knock", "flash", "boot system", "signature", "standby", "phishing", "G0007", "T1059", "active", "printer"], "blanks": [{"ok": "SYNful Knock", "accept": ["synful knock"], "why": "S0519 is the precedent for image-patched router implants."}, {"ok": "flash", "accept": ["^flash"], "why": "The replaced file lives in flash storage."}, {"ok": "boot system", "accept": ["^boot( system)?$"], "why": "The boot system variable is what a reload follows."}, {"ok": "signature", "accept": ["^signature"], "why": "Signature (hash) verification against vendor values, done out-of-band."}, {"ok": "standby", "accept": ["^standby"], "why": "The HA standby carried transit while the active unit was contained."}], "hint": "Family, storage, config key, verification method, HA role — one each.", "explain": "Executive reports earn trust with five precise words: the precedent family (SYNful Knock), the storage location (flash), the config key (boot system), the verification method (signature/hash, out-of-band), and the HA role that saved the business (standby). The decoys would each mislead a reader — attribution noise (G0007, phishing), wrong platform (T1059), or a false HA claim (active).", "study": "Precise, ATT&CK-traceable executive reporting."}, {"id": "X09", "type": "triage", "persp": "def", "summary": "Five calls under one clock", "question": "Assign exactly one action to each of the five alerts.", "scenario": "<p>06:30 bridge, five items, actions from: <i>Close benign<\/i>, <i>Escalate to IR<\/i>, <i>Gather more evidence (hold)<\/i>, <i>Contain with accepted cost<\/i>, <i>Tune detection<\/i>. The trading floor opens in 90 minutes.<\/p>", "alerts": [{"title": "Single anomalous UDP blip toward rtr-core-fra-01", "meta": "03:12, one packet, no image correlation, no authentication event, source unresolvable", "options": [{"t": "Gather more evidence (hold) — add a watch rule, change nothing", "ok": true, "why": "One packet is not a technique; escalating burns the bridge, closing loses the thread. Holding is the decision."}, {"t": "Escalate to IR", "ok": false, "why": "No artefact supports IR scope yet; the queue behind you is real."}, {"t": "Close benign", "ok": false, "why": "Closing deletes the watch; 'unresolved' with a watch rule is the honest state."}]}, {"title": "Flash hash mismatch confirmed on rtr-core-fra-01; chain complete", "meta": "02:47–02:58 chain, unsigned image, boot variable re-pointed", "options": [{"t": "Escalate to IR", "ok": true, "why": "Decisive artefacts exist; IR owns classification and rebuild authority now."}, {"t": "Gather more evidence (hold)", "ok": false, "why": "The evidence already decides; holding an active implant is a choice with a price."}, {"t": "Close benign", "ok": false, "why": "Contradicts the artefacts directly."}]}, {"title": "[MNT] ticketed SCP push, window 22:00–23:00, vendor hash match", "meta": "Ticket CM-2601, operator netops, badge-in recorded", "options": [{"t": "Close benign", "ok": true, "why": "Window, ticket, operator, and integrity all pass — the verified near miss."}, {"t": "Escalate to IR", "ok": false, "why": "Escalating verified maintenance teaches the bridge to ignore escalations."}, {"t": "Gather more evidence (hold)", "ok": false, "why": "There is nothing left to learn; all four checks passed."}]}, {"title": "Confirmed implant on the ACTIVE border; standby verified clean", "meta": "Transit for the trading floor; replacement possible within 20 minutes via HA drain", "options": [{"t": "Contain with accepted cost: drain transit to standby, isolate active OOB", "ok": true, "why": "The cost is real (brief failover) but bounded, approved, and far below the risk of a patched active border."}, {"t": "Ignore until the weekend window", "ok": false, "why": "A confirmed implant on an active border for days is unbounded risk accepted for convenience."}, {"t": "Power off both members immediately", "ok": false, "why": "Doubles the outage and destroys the healthy standby's availability for no added certainty."}]}, {"title": "New SIEM rule fires 40 times a day on backup TFTP pushes", "meta": "All hits are ticketed push sources; the rule has no ticket-source exclusion", "options": [{"t": "Tune detection: exclude ticketed push sources, keep the mismatch closure check", "ok": true, "why": "Tuning keeps the analytic loud for real implants and quiet for managed change — that is the detection engineer's job."}, {"t": "Disable the rule", "ok": false, "why": "Killing the analytic reintroduces the exact blind spot the incident exploited."}, {"t": "Escalate every hit to IR", "ok": false, "why": "Forty escalations a day is how alerts get ignored by Friday."}]}], "hint": "One item is a hold, one is a tuned control, one is a bounded-cost action — the loud ones are already decided by artefacts.", "explain": "Five calls exercise five different muscles: hold on thin evidence, escalate on decisive artefacts, close on verified change, accept a bounded cost to contain a confirmed implant, and tune a noisy rule instead of killing it. Note the pattern: none of the five is 'do the dramatic thing immediately' — senior queues move on evidence strength and cost curves.", "study": "Evidence-strength triage; bounded-cost containment; detection tuning."}, {"id": "X10", "type": "terminal", "persp": "def", "summary": "One pipeline, only image transfers, minus maintenance", "scenario": "<p>Objective (legal phrasing): “Produce, without altering the original, the accounting lines where an image was copied onto a device — excluding maintenance-tagged entries.” You sit on the forensics workstation with <code>tacacs.log<\/code> (read-only copy). Maintenance lines are tagged <code>MNT<\/code>. The log must not be modified.<\/p>", "question": "Type the shell pipeline that outputs only image-copy lines and excludes MNT entries, then press Enter.", "term": {"prompt": "forensics@ir-ws:~/evidence$", "shellName": "Linux shell", "canonical": "grep -E \"copy (tftp|scp)\" tacacs.log | grep -v MNT", "canonicalWhy": "'grep -E' matches extended regex; the pattern catches copy of tftp or scp images; the pipe feeds the second stage; 'grep -v MNT' drops maintenance-tagged lines; the original file is only read.", "outputs": [{"re": "grep", "out": "!!Nov 13 02:47:19 acct: user=svc_backup on rtr-core-fra-01 (vty3, 10[.]52[.]8[.]7): copy tftp://10[.]52[.]8[.]7/ios-image.bin flash:"}], "defaultOut": "", "requires": [{"re": "\\bgrep\\b", "label": "grep as the tool", "why": "The task is line selection from a log file."}, {"re": "copy\\s*\\(tftp\\|scp\\)|copy.*tftp.*scp", "label": "a pattern matching copy of tftp or scp images", "why": "Both transfer protocols appear in image pushes; the pattern must catch both."}, {"re": "\\|", "label": "a pipe stage", "why": "Two selections in sequence need a pipeline."}, {"re": "-v\\s*mnt", "label": "the -v MNT exclusion", "why": "Maintenance-tagged lines must be filtered out, not matched."}], "forbid": [{"re": "\\brm\\b", "label": "rm", "why": "Deleting the log copy destroys evidence; the pipeline only ever reads."}, {"re": "\\bsudo\\s+rm\\b|>\\s*tacacs\\.log", "label": "overwriting tacacs.log", "why": "Redirecting into the log rewrites the original — legal needs it unmodified."}]}, "hint": "Two stages: catch the copies, then drop the maintenance tag. Nothing writes to disk.", "explain": "Canonical: grep -E \"copy (tftp|scp)\" tacacs.log | grep -v MNT. Four elements earn partial credit: the tool, the two-protocol pattern, the pipe, and the -v exclusion. The trap is efficiency-as-destruction: in-place edits or deletions satisfy curiosity and kill admissibility. Read-only pipelines are the senior default on evidence copies.", "study": "Read-only log triage pipelines; evidence copies vs originals."}, {"id": "X11", "type": "match", "persp": "def", "summary": "Five contradictions, five conclusions", "scenario": "<p>The bridge asks you to pre-write conclusions for the five contradictions in the fra-01 case. One conclusion per pair; one conclusion is a decoy.<\/p>", "question": "Match each conflicting pair to the conclusion the evidence supports.", "left": ["'show version' says 17.9.5a; OOB hash says the file was modified", "TACACS+ gap 02:10–02:40; svc_backup session logged 02:31 from 10[.]52[.]8[.]7", "An approved ticket exists; the transfer happened at 02:47 (window ended 02:00)", "Vendor engineer badge-in at 23:30; ticket says supervised install", "OOB sysDescr shows the old 15.4(3)M8; CLI prints the newest version"], "right": ["The CLI is attacker-controlled; trust the hash", "The gap hides activity; treat 10[.]52[.]8[.]7 as suspect and preserve its logs", "Policy violation plus implant profile; the ticket does not cover it", "Alarming but managed; verify the session transcript, not the badge alone", "Downgrade plus patch combination (T1601.002 + T1601.001); report both", "The SNMP agent needs a firmware reinstall"], "hint": "Ask of each pair: who controls speaker A, who controls speaker B, and what does the ticket actually cover?", "explain": "Each row resolves by asking who controls the source: the patched CLI loses to the independent hash; a logging gap never explains a changed file; a ticket covers its window and scope, not 02:47; a badge plus ticket makes a vendor session plausible but its transcript decides; and old-sysDescr-vs-new-CLI is the downgrade+patch signature. The decoy conclusion ('reinstall the agent') is the rationalisation the attackers count on.", "study": "Source-control analysis for conflicting telemetry."}, {"id": "X12", "type": "qcm", "persp": "def", "summary": "Prove the control operates, not just exists", "scenario": "<p>Audit finding draft: “M1046 Boot Integrity is claimed for the border fleet.” The auditor asks for operating evidence for the quarter, not intent. You manage the control.<\/p>", "question": "Which package is OPERATING evidence for M1046 in this quarter?", "options": [{"t": "Quarterly signed-boot verification logs plus the vendor's signing-chain attestation", "ok": true, "why": "Logs show the control ran (boots verified against signatures); the attestation shows the trust anchor is real."}, {"t": "A policy PDF stating devices must have secure boot", "ok": false, "why": "Policy states intent; the audit asked whether the control operates. Paper is the classic near miss."}, {"t": "The TACACS+ MFA report for the same fleet", "ok": false, "why": "That is M1032 evidence — the right shape, the wrong control."}, {"t": "The network diagram showing the border pair", "ok": false, "why": "Architecture context proves nothing about boot-time verification."}], "hint": "Operating = the control ran, on real devices, in the period, and someone can show the output.", "explain": "Auditors distinguish design, implementation, and operating effectiveness. M1046 operates when boot-time signature checks demonstrably ran — logs plus the vendor's signing attestation. The near misses are other controls' evidence and pure policy text. This distinction is exactly what turns an ATT&CK mitigation page into an auditable program.", "study": "Control operating evidence; M1046 in audit terms."}, {"id": "X13", "type": "multi", "persp": "def", "summary": "Anchored hunt hypotheses, not generic ones", "scenario": "<p>Post-incident, CTI proposes hunt hypotheses for the fleet. The lead rejects anything not anchored to T1601.001's own artefacts. Select the hypotheses that survive.<\/p>", "question": "Select ALL hypotheses anchored specifically to T1601.001 evidence.", "options": [{"t": "Sweep every border device's flash hash against vendor baselines", "ok": true, "why": "Direct anchor: the integrity mismatch is the technique's core artefact."}, {"t": "Diff boot system variables against the config-archive baseline and change tickets", "ok": true, "why": "Direct anchor: boot-variable drift outside tickets is a named analytic signal."}, {"t": "Alert on image-file transfers (TFTP/SCP) to devices outside approved windows", "ok": true, "why": "Direct anchor: the anomalous transfer is step one of the chain."}, {"t": "Search endpoints for a generic malware.exe binary", "ok": false, "why": "Wrong platform and no anchor: this technique lives on devices, not on malware.exe."}, {"t": "Review last quarter's phishing quarantine", "ok": false, "why": "Unrelated vector; the delivery channel of T1601.001 is privileged access, not mail."}], "hint": "A surviving hypothesis cites an artefact the technique must leave behind.", "explain": "Three hypotheses survive because each tests an artefact the technique cannot avoid: the modified file, the aimed boot path, the arriving image. The rejected pair are generic threat-hunting filler that wastes fleet-wide query budget. Hunting quality = anchor density: how directly the hypothesis touches the technique's own physics.", "study": "Hypothesis design anchored to technique artefacts."}, {"id": "X14", "type": "tree", "persp": "dual", "summary": "Three calls inside a hard constraint", "question": "Take the three calls in order under the no-downtime constraint.", "scenario": "<p>Constraint from the business: <b>no unscheduled downtime<\/b> — the trading floor opens in 40 minutes. State: active border <b>rtr-core-fra-01<\/b> is suspect (hash mismatch); standby <b>rtr-core-fra-02<\/b> is not yet verified. Three calls.<\/p>", "steps": [{"text": "First call under the constraint?", "options": [{"t": "Verify the standby clean first via OOB hash", "ok": true, "outcome": "The standby hashes clean in four minutes. You now have a verified landing zone before touching the active unit.", "why": "Under a no-downtime constraint, the safe path runs through the HA design: establish the healthy side before moving anything."}, {"t": "Isolate the active immediately — better safe", "ok": false, "outcome": "Transit drops for the trading floor with no verified replacement. The constraint is broken in the first move.", "why": "The instinct is safe, the sequence is not: without a verified standby, isolation equals an outage."}, {"t": "Run debug memory probing on the live device", "ok": false, "outcome": "Probe output is inconclusive and the device CPU spikes during route recalculation.", "why": "Active probing of a production border during open hours adds risk and trusts the patched CLI's playground."}]}, {"text": "Standby verified clean. Containment call?", "options": [{"t": "Drain transit to the standby; isolate the active's management plane out-of-band", "ok": true, "outcome": "Transit shifts in a planned failover; the active unit keeps running (evidence intact) with no attacker access.", "why": "Least aggressive effective action: uses the HA design, accepts a bounded, approved failover instead of an unbounded outage."}, {"t": "Power off the active now", "ok": false, "outcome": "Transit survives on the standby — but runtime evidence dies and the 'brief failover' became an emergency cutover.", "why": "A correct endpoint reached by a costly, evidence-destroying path; the drain does the same job better."}, {"t": "Keep the active running with enhanced monitoring until the weekend", "ok": false, "outcome": "A confirmed implant keeps the keys to the perimeter for days.", "why": "Monitoring is not containment; the boot variable is one approved reboot away from activation."}]}, {"text": "Closing statement to the CISO?", "options": [{"t": "Confirmed T1601.001 on the active; contained via HA drain; rebuild tonight in the approved window; evidence preserved", "ok": true, "outcome": "The CISO signs the rebuild and the business case writes itself: no downtime taken, implant contained, plan approved.", "why": "State, action, cost, and next step in one sentence — the senior brief."}, {"t": "Announce a full border breach publicly", "ok": false, "outcome": "Markets hear 'border breach' with no scope behind it; the standby's verified-clean status is buried.", "why": "Over-claiming under pressure creates its own incident — and retraction is never free."}, {"t": "Report a malfunction; keep the technique out of the record", "ok": false, "outcome": "The audit trail loses the technique; the control gap that allowed it survives the report.", "why": "Hiding the technique protects nobody and forfeits the M1046 budget request you are about to win."}]}], "hint": "The constraint is a design input, not an obstacle: the HA pair exists precisely for this sequence.", "explain": "Three calls, one theme: let the architecture carry the risk. Verify the safe side, move transit by design (a bounded failover), and brief with scope-cost-next-step. The near misses are the two classic failure modes: acting before the landing zone exists, and reaching the right endpoint through the costly door.", "study": "Constraint-aware containment; HA as a containment tool."}, {"id": "X15", "type": "fill", "persp": "def", "summary": "Complete RULE B — the out-of-band analytic", "question": "Complete the four blanks of RULE B with words from the bank.", "scenario": "<p>Detection engineering: RULE B complements the CLI-based rule by trusting only out-of-band sources. Four blanks; six decoys.<\/p>", "text": "RULE B: ALERT when the SNMP {0} reports an OS version older than the fleet baseline; CORRELATE with a config-archive {1} on the boot variable; CORRELATE with any {2} event within 30 minutes; CLOSE only after the flash {3} matches the vendor value.", "bank": ["sysDescr", "diff", "reload", "hash", "sysName", "ACL", "login", "printer", "TFTP", "MNT"], "blanks": [{"ok": "sysDescr", "accept": ["sysdescr"], "why": "sysDescr carries the OS version string from the out-of-band plane."}, {"ok": "diff", "accept": ["^diff"], "why": "The config archive diff exposes boot-variable drift."}, {"ok": "reload", "accept": ["^reload$|^reboot$"], "why": "The activation step of the chain completes within the correlation window."}, {"ok": "hash", "accept": ["^hash"], "why": "Closure requires the independent hash comparison against the vendor value."}], "hint": "The four blanks: the version object, the archive operation, the activation event, the integrity check.", "explain": "RULE B lives entirely on sources the patched CLI cannot touch: SNMP sysDescr, the config archive, reload events from syslog, and an independent hash for closure. Compare with H07's CLI rule: together they cover the analytic's channels (DC0064, DC0061, DC0004) with an attacker-resistant trust model — the senior version of 'don't trust the device to testify about itself'.", "study": "Out-of-band detection design; SNMP sysDescr baselining."}, {"id": "X16", "type": "qcm", "persp": "def", "summary": "State what you know, withhold what you do not", "scenario": "<p>Fra-01 case closure. Artefacts: IOS image patch technique confirmed; knock-style hidden ports on three devices; implant code matches the public 2015 SYNful Knock report; no group has claimed activity; your targeting data shows sectors similar to unrelated actors.<\/p>", "question": "Which closing statement reflects correct CTI discipline?", "options": [{"t": "Report T1601.001 and an S0519-style implant with high confidence; actor attribution unknown", "ok": true, "why": "Technique and family are provable from artefacts; nothing in the set identifies an actor — say exactly that."}, {"t": "Attribute to the 2015 SYNful Knock operators — the code matches", "ok": false, "why": "Shared or copied code is not continuous operation; a decade gap and no infrastructure link make this over-attribution."}, {"t": "Attribute to APT41 — the targeted sectors feel similar", "ok": false, "why": "'Feels similar' is not evidence; sector overlap is the weakest attribution signal there is."}, {"t": "State that no malware was present — the ports were misconfigurations", "ok": false, "why": "The artefacts (patched image, knock ports) contradict it; minimising for comfort is the worst of the four."}], "hint": "Two things are provable (technique, family). One is not (actor). The sentence should know the difference.", "explain": "CTI discipline separates three confidence tiers: the technique (T1601.001 — proven by artefacts), the family (S0519-style — proven by code and behaviour), and the actor (unknown — no evidence). Over-attribution poisons downstream defence and vendor engagement; under-attribution hides a real implant. The correct sentence carries exactly as much confidence as the evidence weighs.", "study": "Attribution confidence levels; technique vs family vs actor."}]}</script>
<script>

(function () {
  'use strict';
  var EXAM = JSON.parse(document.getElementById('exam-data').textContent);
  var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
  var EXS = EXAM.exercises;
  var LETTERS = 'ABCDEFGHIJ';

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function shuffle(arr) {
    var a = arr.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1));
      t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(s) { s = Math.max(0, s | 0); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
  function normCmd(s) {
    return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/[?]+$/, '');
  }

  /* ---------- state ---------- */
  var S = {
    view: 'intro', order: [], i: 0,
    shuffle: {}, answers: {}, results: {}, checked: {}, hintUsed: {},
    collapsed: {}, skipped: [], phase: 'main',
    pauseManualSec: 0, pauseAutoSec: 0,
    reported: false, finalPercent: 0, handshake: null,
    focusTerm: false
  };
  var T = { state: 'IDLE', remaining: EXAM.meta.budgetSec, resumeTo: null };

  /* ---------- scoring (spec contract) ---------- */
  function scoreExercise(selectedItems, correctItems) {
    var ok = {}, i, H = 0, W = 0;
    for (i = 0; i < correctItems.length; i++) ok[correctItems[i]] = true;
    for (i = 0; i < selectedItems.length; i++) { if (ok[selectedItems[i]]) H++; else W++; }
    var N = correctItems.length;
    return { credit: (N ? Math.max(0, (H - W) / N) : 0), H: H, W: W, N: N };
  }

  /* ---------- timer state machine: RUNNING / PAUSED_MANUAL / PAUSED_AUTO_CHECK / ENDED ---------- */
  function setTimer(st) { T.state = st; renderTimerChip(); }
  function tick() {
    if (T.state === 'RUNNING') {
      T.remaining -= 1;
      renderTimerChip();
      if (T.remaining <= 0) { T.remaining = 0; endExam('timeout'); return; }
    } else if (T.state === 'PAUSED_MANUAL') { S.pauseManualSec += 1; }
    else if (T.state === 'PAUSED_AUTO_CHECK') { S.pauseAutoSec += 1; }
  }
  setInterval(tick, 1000);

  function curKey() { return S.order[S.i]; }
  function curEx() { return EXS[curKey()]; }

  /* ---------- per-exercise presentation shuffles ---------- */
  function initExerciseState(key) {
    var ex = EXS[key], sh = {}, i;
    if (ex.type === 'qcm' || ex.type === 'multi' || ex.type === 'logview') {
      sh.opts = [];
      for (i = 0; i < ex.options.length; i++) sh.opts.push(i);
      sh.opts = shuffle(sh.opts);
    } else if (ex.type === 'match') {
      sh.rights = shuffle(ex.right.map(function (w, i) { return i; }));
    } else if (ex.type === 'dnd') {
      sh.chips = shuffle(ex.items.map(function (w, i) { return i; }));
    } else if (ex.type === 'order') {
      sh.chips = shuffle(ex.steps.map(function (w, i) { return i; }));
    } else if (ex.type === 'fill') {
      sh.bank = shuffle(ex.bank.map(function (w, i) { return i; }));
    } else if (ex.type === 'tree') {
      sh.opts = ex.steps.map(function (st) { return shuffle(st.options.map(function (o, i) { return i; })); });
    } else if (ex.type === 'triage') {
      sh.alerts = ex.alerts.map(function (a) { return shuffle(a.options.map(function (o, i) { return i; })); });
    }
    S.shuffle[key] = sh;
    resetAnswer(key);
  }
  function resetAnswer(key) {
    var ex = EXS[key], i, a = {};
    if (ex.type === 'qcm' || ex.type === 'logview') { a = { sel: [] }; }
    else if (ex.type === 'multi') { a = { sel: [] }; }
    else if (ex.type === 'match') { a = { map: {}, picked: null }; }
    else if (ex.type === 'dnd') { a = { place: {}, picked: null }; }
    else if (ex.type === 'order') { a = { slots: [], picked: null }; }
    else if (ex.type === 'fill') { a = { vals: [] }; for (i = 0; i < ex.blanks.length; i++) a.vals.push(''); }
    else if (ex.type === 'terminal') { a = { lines: [] }; }
    else if (ex.type === 'tree') { a = { step: 0, choices: [] }; }
    else if (ex.type === 'triage') { a = { pick: {} }; }
    S.answers[key] = a;
  }
  function canCheck(ex, a) {
    var i;
    if (ex.type === 'qcm' || ex.type === 'multi' || ex.type === 'logview') return a.sel && a.sel.length > 0;
    if (ex.type === 'match') { for (i in a.map) { return true; } return false; }
    if (ex.type === 'dnd') { for (i in a.place) { if (a.place[i].length) return true; } return false; }
    if (ex.type === 'order') { for (i = 0; i < a.slots.length; i++) { if (a.slots[i] != null) return true; } return false; }
    if (ex.type === 'fill') { for (i = 0; i < a.vals.length; i++) { if (a.vals[i].trim()) return true; } return false; }
    if (ex.type === 'terminal') return a.lines && a.lines.length > 0;
    if (ex.type === 'tree') return a.choices.length === ex.steps.length;
    if (ex.type === 'triage') { for (i in a.pick) { return true; } return false; }
    return false;
  }

  /* ---------- log highlighter ---------- */
  var KWX = /\b(copy|tftp|scp|ftp|boot system|boot|debug|verify|reload|show|version|flash|running-config|startup-config|md5|rommon|firmware|image|deny|permit|audit|tacacs|radius|enable|secret|username|snmp|syslog|port|shutdown)\b/g;
  function hlLine(ln) {
    var e = esc(ln);
    if (/^!!/.test(ln)) return '<span class="b">' + esc(ln.replace(/^!!/, '').replace(/^\s/, '')) + '</span>';
    if (/^\s*[!#]/.test(ln)) return '<span class="c">' + e + '</span>';
    e = e.replace(/&quot;[^&]*?&quot;/g, function (m) { return '<span class="s">' + m + '</span>'; });
    e = e.replace(KWX, function (m) { return '<span class="k">' + m + '</span>'; });
    e = e.replace(/\b\d[\d[\].:]*\b/g, function (m) { return '<span class="n">' + m + '</span>'; });
    return e;
  }
  function hl(code) {
    return String(code || '').split('\n').map(hlLine).join('\n');
  }
  function artefactHTML(a, idx) {
    var id = 'lg' + idx + '_' + curKey();
    var rows = String(a.code).split('\n');
    var inner;
    if (a.filter) {
      inner = '<div class="logview-tools"><input type="text" aria-label="filter log lines" placeholder="filter lines..." ' +
        'oninput="Z.logFilter(this.value,\'' + id + '\')"><span class="logview-count" id="' + id + 'c">' + rows.length + ' lines</span></div>' +
        '<pre class="log" id="' + id + '">' + rows.map(function (ln) {
          return '<span class="lg-row" data-t="' + esc(ln.toLowerCase()) + '">' + hlLine(ln) + '\n</span>';
        }).join('') + '</pre>';
    } else {
      inner = '<pre class="log">' + rows.map(hlLine).join('\n') + '</pre>';
    }
    return '<div class="artefact"><span class="artefact-label">' + esc(a.label) + '</span>' + inner + '</div>';
  }
  function artefactsHTML(ex) {
    if (!ex.artefacts) return '';
    var h = '';
    for (var i = 0; i < ex.artefacts.length; i++) h += artefactHTML(ex.artefacts[i], i);
    return h;
  }

  /* ---------- shared header ---------- */
  function sevBadge() {
    var m = EXAM.meta;
    return '<span class="badge ' + m.sevClass + '" aria-label="Severity ' + esc(m.sev) + '">● ' + esc(m.sev) + '</span>';
  }
  function timerChip() {
    var txt, lab;
    if (T.state === 'IDLE') { txt = '⏱ READY'; lab = 'Timer ready'; }
    else if (T.state === 'RUNNING') { txt = '▶ RUNNING'; lab = 'Timer running'; }
    else if (T.state === 'PAUSED_MANUAL') { txt = '⏸ PAUSED — manual (press Resume)'; lab = 'Timer paused manually'; }
    else if (T.state === 'PAUSED_AUTO_CHECK') { txt = '⏸ PAUSED — reviewing feedback (resumes on Next)'; lab = 'Timer paused for feedback review'; }
    else { txt = '■ ENDED'; lab = 'Timer ended'; }
    return '<span class="chipstate tstate ok-z" aria-label="' + lab + ': ' + fmt(T.remaining) + '">' + txt + ' <b>' + fmt(T.remaining) + '</b></span>';
  }
  function renderTimerChip() {
    var el = $('tchip');
    if (el) el.outerHTML = '<span id="tchip">' + timerChip() + '</span>';
  }
  function scoreChip() {
    var sum = 0, n = 0, k;
    for (k in S.results) { if (S.checked[k]) { sum += S.results[k].credit; n++; } }
    var pct = n ? Math.round((sum / n) * 100) : 0;
    return '<span class="chipstate xscore" aria-label="Live score">Score <b>' + sum.toFixed(1) + ' / ' + n + '</b> · ' + pct + '%</span>';
  }
  function headerHTML() {
    var ex = curEx();
    var key = curKey();
    var m = EXAM.meta;

    else counter = 'Exercise ' + (S.i + 1) + ' of ' + S.order.length;
    var hintDis = (S.checked[key] || S.hintUsed[key]) ? ' disabled' : '';
    var skipDis = (S.phase === 'review' || S.checked[key] || T.state === 'ENDED') ? ' disabled' : '';
    var h = '<div class="xhead"><div class="wrap xhead-in">' +
      '<span class="xcount">' + counter + '</span>' + sevBadge() +

      '<div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">' +

      '<button class="btn btn-ghost" onclick="Z.onSkip()"' + skipDis + ' aria-label="Skip this exercise">⚠ Skip</button>' +

  }
  function progPct() {
    var answered = 0, k;
    for (k in S.checked) { if (S.checked[k]) answered++; }

  }

  /* ---------- intro view (exactly four sections) ---------- */

      '<div class="facts">' +
      '<div><b>Exercises in this file</b><span>' + EXS.length + '</span></div>' +

      '</div>';
    var learn = '<div class="card"><h2>What you will learn here</h2>' + EXAM.learn + '</div>';
    var kw = '<div class="card"><h2>Keywords covered in this exam</h2>';
    for (var i = 0; i < EXAM.keywords.length; i++) {
      var g = EXAM.keywords[i];
      kw += '<div class="kw-theme"><h3>' + esc(g.theme) + '</h3><div class="kw-items">';
      for (var j = 0; j < g.items.length; j++) kw += '<span>' + esc(g.items[j]) + '</span>';
      kw += '</div></div>';
    }
    kw += '</div>';
    var types = {};
    EXS.forEach(function (e) { types[e.type] = true; });

    var how = '<div class="card"><h2>How this exam works</h2><ul class="rules">' +
      '<li><b>Passing score: ' + m.passMark + '%.</b> Your percentage is computed only over exercises you actually answered. PASS means you scored at least ' + m.passMark + '%; FAIL means you should retake the exam.</li>' +

      '<li><b>Partial credit:</b> exercises with several correct items score <code>max(0, (H − W) / N)</code> — correct items minus wrong items, divided by the number of items. You can earn 0.60 of an exercise, for example.</li>' +

  var TYPE_LABELS = {
    qcm: 'multiple choice (single answer)', multi: 'multi-select with partial credit',
    match: 'matching pairs', dnd: 'drag &amp; drop into categories', order: 'timeline ordering',
    fill: 'fill-in-the-blank with a word bank', terminal: 'typed terminal command',
    tree: 'branching decision scenario', triage: 'SOC alert-queue triage',
    logview: 'log analysis with a live filter'
  };

  /* ---------- answer widget renderers ---------- */
  function chipHTML(txt, picked, clickJs, dragJs, retJs) {
    return '<button type="button" class="chip' + (picked ? ' picked' : '') + '" ' +
      (dragJs ? 'draggable="true" ondragstart="' + dragJs + '" ondragend="Z.dragEnd(event)" ' : '') +
      'onclick="' + clickJs + '">' + '<span>' + txt + '</span>' +
      (picked ? '<span class="pick-tag">✓ Picked</span>' : '') +
      (retJs ? '<span class="pick-tag" style="color:var(--text-secondary)">✕ return</span>' : '') +
      '</button>';

  function dragAttrs() {
    return 'ondragover="Z.dragOver(event)" ondragleave="Z.dragLeave(event)" ondrop="Z.dragLeave(event)"';
  }

  function optsHTML(ex, key, a) {
    var multi = ex.type === 'multi' || !!ex.multi;
    var h = multi ? '<p class="multi-note">Select ALL that apply — partial credit: wrong picks subtract from correct ones.</p>' : '';
    h += '<div class="opts">';
    S.shuffle[key].opts.forEach(function (uid, i) {
      var o = ex.options[uid];
      var sel = a.sel.indexOf(uid) >= 0;

        (sel ? '<span class="sel-tag">✓ Selected</span>' : '') + '</button>';
    });
    return h + '</div>';
  }

  function matchHTML(ex, key, a) {
    var placed = {}, li;
    for (li in a.map) { placed[a.map[li]] = +li; }
    var h = '<div class="dnd"><div class="pool"><div class="pool-h">Items — drag or click to place</div><div class="pool-box" ondragover="Z.dragOver(event)" ondragleave="Z.dragLeave(event)" ondrop="Z.matchDrop(event,-1)">';
    var anyPool = false;
    S.shuffle[key].rights.forEach(function (r) {
      if (!(r in placed)) { anyPool = true; h += chipHTML(esc(ex.right[r]), a.picked === r, 'Z.matchPick(' + r + ')', 'Z.dragStart(event,' + r + ')', false); }
    });
    if (!anyPool) h += '<span class="empty-hint">All items placed.</span>';
    h += '</div></div><div class="bank"><div class="bank-h">Drop zones — one match per row</div>';
    ex.left.forEach(function (L, i) {
      var r = a.map[i];
      h += '<div class="slot' + (r != null ? ' slot-filled' : '') + '" tabindex="0" role="button" aria-label="drop zone for ' + esc(L) + '"'
        + ' ondragover="Z.dragOver(event)" ondragleave="Z.dragLeave(event)" ondrop="Z.matchDrop(event,' + i + ')"'
        + ' onclick="Z.matchSlot(' + i + ')"'
        + ' onkeydown="Z.slotKey(event,\'matchSlot\',' + i + ')">'
        + '<span class="slot-lab">' + esc(L) + '</span>'
        + (r != null ? chipHTML(esc(ex.right[r]), false, 'Z.matchReturn(' + i + ')', false, true) : '<span class="empty-hint">drop an item here (or pick above, then click)</span>')
        + '</div>';
    });
    return h + '</div></div>';
  }

  function dndHTML(ex, key, a) {
    var placed = {}, b, k;
    for (b in a.place) { a.place[b].forEach(function (it) { placed[it] = +b; }); }
    var h = '<div class="dnd"><div class="pool"><div class="pool-h">Item bank — drag or click to place</div><div class="pool-box" ondragover="Z.dragOver(event)" ondragleave="Z.dragLeave(event)" ondrop="Z.dndDrop(event,-1)">';
    var anyPool = false;
    S.shuffle[key].chips.forEach(function (it) {
      if (!(it in placed)) { anyPool = true; h += chipHTML(esc(ex.items[it].t), a.picked === it, 'Z.dndPick(' + it + ')', 'Z.dragStart(event,' + it + ')', false); }
    });
    if (!anyPool) h += '<span class="empty-hint">All items placed.</span>';
    h += '</div></div><div class="bank"><div class="bank-h">Categories</div>';
    ex.banks.forEach(function (B, bi) {
      var items = a.place[bi] || [];
      h += '<div style="margin-bottom:8px"><div class="bank-h">' + esc(B.label) + '</div>' +
        '<div class="bank-box" tabindex="0" role="button" aria-label="category ' + esc(B.label) + '"'
        + ' ondragover="Z.dragOver(event)" ondragleave="Z.dragLeave(event)" ondrop="Z.dndDrop(event,' + bi + ')"'
        + ' onclick="Z.dndBank(' + bi + ')"'
        + ' onkeydown="Z.slotKey(event,\'dndBank\',' + bi + ')">';
      items.forEach(function (it) { h += chipHTML(esc(ex.items[it].t), false, 'Z.dndReturn(' + it + ')', false, true); });
      if (!items.length) h += '<span class="empty-hint">drop items here</span>';
      h += '</div></div>';
    });
    return h + '</div></div>';
  }

  function orderHTML(ex, key, a) {
    var n = ex.steps.length;
    if (!a.slots || a.slots.length !== n) { a.slots = []; for (var q = 0; q < n; q++) a.slots.push(null); }
    var placed = {}, i;
    for (i = 0; i < a.slots.length; i++) { if (a.slots[i] != null) placed[a.slots[i]] = i; }
    var h = '<div class="dnd"><div class="pool"><div class="pool-h">Item bank — build the sequence</div><div class="pool-box" ondragover="Z.dragOver(event)" ondragleave="Z.dragLeave(event)" ondrop="Z.orderDrop(event,-1)">';
    var anyPool = false;
    S.shuffle[key].chips.forEach(function (it) {
      if (!(it in placed)) { anyPool = true; h += chipHTML(esc(ex.steps[it]), a.picked === it, 'Z.orderPick(' + it + ')', 'Z.dragStart(event,' + it + ')', false); }
    });
    if (!anyPool) h += '<span class="empty-hint">All items placed.</span>';
    h += '</div></div><div class="bank"><div class="bank-h">Timeline — first line on top</div>';
    for (i = 0; i < n; i++) {
      var it = a.slots[i];
      h += '<div class="slot-row"><div class="slot' + (it != null ? ' slot-filled' : '') + '" tabindex="0" role="button" aria-label="position ' + (i + 1) + '"'
        + ' ondragover="Z.dragOver(event)" ondragleave="Z.dragLeave(event)" ondrop="Z.orderDrop(event,' + i + ')"'
        + ' onclick="Z.orderSlot(' + i + ')"'
        + ' onkeydown="Z.slotKey(event,\'orderSlot\',' + i + ')">'
        + '<span class="slot-lab">' + (i + 1) + '.</span>'
        + (it != null ? chipHTML(esc(ex.steps[it]), false, 'Z.orderReturn(' + i + ')', false, true) : '<span class="empty-hint">empty position</span>')
        + '</div><div class="seq-btns">'
        + '<button aria-label="move up" onclick="Z.orderMove(' + i + ',-1)">▲</button>'
        + '<button aria-label="move down" onclick="Z.orderMove(' + i + ',1)">▼</button>'
        + '</div></div>';
    }
    return h + '</div></div>';
  }

  function fillHTML(ex, key, a) {
    var h = '<p class="filltext">' + esc(ex.text).replace(/\{(\d+)\}/g, function (m, d) {
      var i = +d;
      return '<input type="text" aria-label="blank ' + (i + 1) + '" value="' + esc(a.vals[i]) + '" oninput="Z.fillSet(' + i + ',this.value)">';
    }) + '</p>';
    h += '<div class="bankrow">';
    S.shuffle[key].bank.forEach(function (bi) {
      var w = ex.bank[bi];
      h += '<button type="button" class="chip" style="width:auto;min-width:0" onclick="Z.fillChip(\'' + w.replace(/'/g, "\\'") + '\')">' + esc(w) + '</button>';
    });
    return h + '</div><p class="small dim">Click a word to drop it into the first empty blank, or type directly. Some words are decoys.</p>';
  }

  function termHTML(ex, key, a) {
    var h = '';
    if (ex.term.syntax) h += '<div class="syntax-panel">' + ex.term.syntax + '</div>';
    h += '<div class="term" id="termScroll" aria-label="simulated terminal">';
    a.lines.forEach(function (ln) {
      h += '<span class="term-line"><span class="term-prompt">' + esc(ex.term.prompt) + '</span> ' + esc(ln) + '</span>';
      var out = termOut(ex, ln);
      if (out) h += '<span class="term-line">' + hl(out) + '</span>';
    });
    if (!a.lines.length) h += '<span class="term-line c">— simulated ' + esc(ex.term.shellName || 'device') + ' shell; nothing executed for real —</span>';
    h += '</div><div class="term-input-row"><span class="term-prompt">' + esc(ex.term.prompt) + '</span>' +
      '<input type="text" id="termIn" aria-label="terminal input" autocomplete="off" spellcheck="false" placeholder="type the command, then press Enter">';
    if (ex.term.sample) h += '<div class="syntax-panel"><b>Expected output shape:</b>' + hl(ex.term.sample) + '</div>';
    return h;
  }
  function termOut(ex, cmd) {
    if (!ex.term.outputs) return '';
    var n = normCmd(cmd), i;
    for (i = 0; i < ex.term.outputs.length; i++) {
      if (new RegExp(ex.term.outputs[i].re, 'i').test(n)) return ex.term.outputs[i].out;
    }
    return ex.term.defaultOut || '';
  }

  function treeHTML(ex, key, a) {
    var i = a.step, st = ex.steps[i];
    var h = '<span class="stepchip">STEP ' + (i + 1) + ' OF ' + ex.steps.length + '</span><p>' + st.text + '</p><div class="opts">';
    S.shuffle[key].opts[i].forEach(function (uid, k) {
      var o = st.options[uid];
      h += '<button type="button" class="opt' + (a.choices[i] === uid ? ' sel' : '') + '" aria-pressed="' + (a.choices[i] === uid) + '" onclick="Z.treeChoice(' + uid + ')">' +
        '<span class="opt-letter">' + LETTERS[k] + '.</span><span>' + o.t + '</span>' +
        (a.choices[i] === uid ? '<span class="sel-tag">✓ Selected</span>' : '') + '</button>';
    });
    h += '</div>';
    if (a.choices[i] != null) {
      var o = st.options[a.choices[i]];
      h += '<div class="outcome"><b>Outcome:</b> ' + o.outcome + '</div>';
      h += '<div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">';
      if (i > 0) h += '<button class="btn btn-ghost" onclick="Z.treeBack()">◀ Back one step</button>';
      if (i < ex.steps.length - 1) h += '<button class="btn" onclick="Z.treeNext()">Continue ▶ <span class="small dim">(timer keeps running)</span></button>';
      h += '</div>';
    }
    return h;
  }

  function triageHTML(ex, key, a) {
    var h = '<p class="small dim">Work the queue top to bottom. Assign one action per alert, then press Check once. Partial credit: one item per alert.</p>';
    ex.alerts.forEach(function (A, ai) {
      h += '<div class="alert-card"><div class="alert-title">🛰 Alert ' + (ai + 1) + ' — ' + esc(A.title) + '</div>' +
        '<div class="alert-meta">' + esc(A.meta) + '</div><div class="opts" style="margin-top:8px">';
      S.shuffle[key].alerts[ai].forEach(function (uid, k) {
        var o = A.options[uid];
        var sel = a.pick[ai] === uid;
        h += '<button type="button" class="opt' + (sel ? ' sel' : '') + '" aria-pressed="' + sel + '" onclick="Z.triagePick(' + ai + ',' + uid + ')">' +
          '<span class="opt-letter">' + LETTERS[k] + '.</span><span>' + o.t + '</span>' +
          (sel ? '<span class="sel-tag">✓ Selected</span>' : '') + '</button>';
      });
      h += '</div></div>';
