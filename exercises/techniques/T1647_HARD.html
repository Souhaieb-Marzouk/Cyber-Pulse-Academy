.res-cell.skip { border-color: var(--state-skipped); } .res-cell.skip .rc-h { color: var(--state-skipped); }
.verdict { border-radius: 8px; padding: 18px 20px; margin: 14px 0; border: 1px solid; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 12px; }
.verdict.pass { border-color: var(--state-correct); background: var(--tint-green-10); color: var(--state-correct); }
.verdict.fail { border-color: var(--state-incorrect); background: var(--tint-red-10); color: var(--state-incorrect); }
.bigpct { font-size: 42px; font-weight: 800; font-family: var(--mono-stack); }
.pauselog { font-size: 14px; color: var(--text-secondary); }

/* ---------- manual pause overlay ---------- */
.pausemask { position: fixed; inset: 0; z-index: 60; background: var(--tint-page-96); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
.pausemask .pi { font-size: 46px; color: var(--state-paused); }
.pausemask .pt { color: var(--state-paused); font-weight: 800; font-size: 19px; letter-spacing: 0.04em; }
.pausemask .ps { color: var(--text-secondary); font-size: 15px; max-width: 520px; }

/* ---------- misc ---------- */
.collapse-btn { background: none; border: none; color: var(--accent-blue); font-size: 13px; font-weight: 700; padding: 6px 10px; min-height: 44px; }
.collapsed-summary { display: none; padding: 8px 16px; font-size: 13.5px; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
.collapsed .collapsed-summary { display: block; }
.collapsed .artefacts-wrap { display: none; }
.footrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
@media (max-width: 760px) {
  .match-grid { grid-template-columns: 1fr; }
  .persp { grid-template-columns: 1fr; }
  .topbar .cell { font-size: 13.5px; }
}
@media (prefers-reduced-motion: reduce) {
  .progress-fill::after { animation: none; }
  * { transition: none !important; }
}

<script type="application/json" id="cm-exam-data">{"meta":{"objectId":"T1647","objectLine":"T1647 — Plist File Modification (Enterprise technique, macOS, tactic Defense Impairment)","topicId":"t1647","batch":3,"title":"T1647 Plist File Modification — HARD","difficulty":"hard","sevClass":"hard","questionCount":15,"estimatedMinutes":40,"passMark":70,"severity":"HARD","timerBudget":2400},"intro":{"learn":"<p>This is the <b>HARD<\/b> level for technique <b>T1647 — Plist File Modification<\/b> (a MITRE ATT&amp;CK <b>Technique<\/b> for <b>macOS<\/b>, tactic <b>Defense Impairment<\/b>). At this level the scenarios are real shift work: several artefacts per case, near-miss answers that are correct somewhere else but wrong here, and at least one case where the obvious answer is the trap.<\/p><p>You will read paired log excerpts and plist dumps, tell <b>LSUIElement<\/b> apart from <b>LSBackgroundOnly<\/b>, catch a persistence plist that fails because of one misspelled key, and tune the mutable elements of detection strategy <b>DET0109<\/b> without losing coverage. You will also see the real malware procedures from the T1647 page — <b>XCSSET (S0658)<\/b> with its <b>plutil<\/b> and notarized <b>dockutil<\/b> abuse — and place behaviours onto the right ATT&amp;CK tactics.<\/p><p>One exercise puts you in the attacker's chair and the next in the defender's chair — the same technique, two goals. Defenders, hunters, detection engineers and incident responders all do exactly this discrimination work; this exam drills it under realistic pressure.<\/p>","keywords":[{"theme":"Near-miss key discrimination","tags":["LSUIElement vs LSBackgroundOnly","ProgramArguments spelling","Info.plist structure"]},{"theme":"Procedure examples in the wild","tags":["XCSSET (S0658)","plutil","notarized dockutil","Cuckoo Stealer (S1153)"]},{"theme":"Detection engineering","tags":["DET0109","AN0306","MonitoredDirectories","SuspiciousKeys","TimeWindow","DC0061 / DC0032 / DC0064"]},{"theme":"Tactic placement","tags":["Defense Impairment","Persistence","Execution","T1564.003","T1543.011","T1543.004","T1547.007","T1574.006"]},{"theme":"Senior judgement","tags":["benign-vs-malicious verdicts","least-aggressive response","evidence preservation","risk ranking"]}],"how":"<ul class=\"howlist\"><li><b>Goal:<\/b> pass with at least <b>70%<\/b>. Expect near-miss answers: two options that look almost equally good, where only one is right <b>in this world<\/b>.<\/li><li><b>15 exercises<\/b>: log correlation, trap multiple choice, a branching red/blue scenario, risk ranking, detection tuning, one terminal task, matching evidence to techniques, and matrix placement.<\/li><li><b>Timer:<\/b> <b>40 minutes<\/b>. <b>Check<\/b> freezes the timer (⏸ “reviewing feedback”) until you press <b>Next<\/b>; <b>Pause<\/b> hides the exercise for a break.<\/li><li><b>Partial credit:<\/b> (correct − wrong) / total per exercise. Hints cost 10% of the exercise. Skipped exercises can be answered before final submit and are excluded if left unanswered.<\/li><\/ul>"},"exercises":[{"id":"hd01","type":"log","summary":"Night shift — two hosts, four events, two supported conclusions","scenario":[{"label":"ARTEFACT 1 — FIN-07 unified log","code":"02:58:41  exec   defaults write com.apple.dock persistent-apps -> /Users/Shared/.upd/CleanIt.app   user: jdoe\n02:59:07  exec   launchctl load /Users/jdoe/Library/LaunchAgents/com.apple.update.agent.plist      user: jdoe"},{"label":"ARTEFACT 2 — ENG-11 unified log","code":"03:04:12  exec   plutil -convert binary1 /Applications/NoteSync.app/Contents/Info.plist\n03:04:14  exec   codesign -v /Applications/NoteSync.app  result: valid, notarized"}],"question":"Select the TWO conclusions the evidence actually supports.","hint":"Conclusions must stay inside each host's own artefacts. One tempting option jumps across hosts.","explain":"FIN-07 shows a full chain: Dock plist modification (T1647) plus a LaunchAgent load — persistence enabled. ENG-11 shows a plist conversion on an app that immediately verifies as valid and notarized — consistent with a developer or packaging workflow, so 'possible-benign, keep an eye' is the supported call. Nothing links the two hosts: different users, different apps, no shared path. Claiming one operator or cross-host infection overreaches the evidence.","persp":{"red":"Separate low-signature actions on separate hosts each look explainable; only correlation across the estate would connect them.","blue":"Write down what each artefact proves on its own host before you write 'campaign' in the ticket."},"study":"Correlation discipline: a conclusion is only as wide as the artefacts behind it.","lines":["02:58:41  FIN-07  exec   defaults write com.apple.dock persistent-apps -> /Users/Shared/.upd/CleanIt.app   user: jdoe","02:59:07  FIN-07  exec   launchctl load /Users/jdoe/Library/LaunchAgents/com.apple.update.agent.plist      user: jdoe","03:04:12  ENG-11  exec   plutil -convert binary1 /Applications/NoteSync.app/Contents/Info.plist","03:04:14  ENG-11  exec   codesign -v /Applications/NoteSync.app  result: valid, notarized"],"sub":{"type":"multi","options":[{"t":"FIN-07 shows T1647 behaviour enabling persistence","correct":true,"why":"Dock plist write + LaunchAgent load in one minute is the documented chain"},{"t":"ENG-11 stays possible-benign pending context","correct":true,"why":"the converted app immediately verifies as valid and notarized"},{"t":"Both hosts are compromised by the same operator","correct":false,"why":"no shared path, tool, or account links the two hosts yet"},{"t":"The ENG-11 conversion proves malware on FIN-07","correct":false,"why":"a plist conversion on one host says nothing about the other"}]}},{"id":"hd02","type":"mcq","summary":"The key says LSBackgroundOnly, not LSUIElement","scenario":[{"label":"ARTEFACT 1 — Info.plist dump (signed app TextDeck.app)","code":"<key>LSBackgroundOnly<\/key>\n<true/>"},{"label":"ARTEFACT 2 — Analyst note in the ticket","text":"Ticket #5512: 'Confirmed classic T1647 LSUIElement trick on TextDeck.app.' The first responder closed the ticket after 4 minutes."},{"label":"ARTEFACT 3 — Reference note","text":"The Hidden Window technique (T1564.003) documents both keys on macOS: LSUIElement hides Dock presence and windows; LSBackgroundOnly forbids ALL user-interface use, which legitimate CLI helpers commonly set."}],"question":"The ticket says the classic LSUIElement trick. What does the artefact actually show?","hint":"Read the key in the dump letter by letter. One option defends the first responder; one corrects them.","explain":"The dump says LSBackgroundOnly — a different key. It blocks any user interface at all, which many legitimate background helpers and CLI tools set for themselves; its presence alone is weaker evidence of attacker hiding than LSUIElement on a GUI app. The ticket's claim is a misread: same family of keys, different meaning, different verdict weight. This is the classic near-miss — the obvious answer ('classic LSUIElement') is wrong because the artefact does not say LSUIElement.","persp":{"red":"A careless responder who skims keys does the attacker's work for them.","blue":"Quote keys exactly in tickets; LSUIElement and LSBackgroundOnly lead to different verdicts."},"study":"LSUIElement = hides UI presence. LSBackgroundOnly = no UI at all (common for helpers).","options":[{"t":"It is LSBackgroundOnly — the ticket misread the key"},{"t":"LSBackgroundOnly is just a typo of LSUIElement"},{"t":"LSBackgroundOnly makes an app show a big window"},{"t":"The two keys have nothing to do with each other"}],"answer":0},{"id":"hd03","type":"mcq","summary":"Spot the mistake — the attacker's agent never runs","scenario":[{"label":"ARTEFACT 1 — ~/Library/LaunchAgents/com.updater.helper.plist (recovered)","code":"<plist version=\"1.0\">\n<dict>\n  <key>Label<\/key><string>com.updater.helper<\/string>\n  <key>ProgramArgument<\/key>\n  <array><string>/Users/Shared/.upd/helper<\/string><\/array>\n  <key>RunAtLoad<\/key><true/>\n<\/dict>\n<\/plist>"},{"label":"ARTEFACT 2 — Observed behaviour","text":"Two weeks of logs: the plist is present, launchd parsed it without errors, but /Users/Shared/.upd/helper has never executed."}],"question":"The implant never starts. What is the most likely reason?","hint":"Compare the key names in the dump with the key name launchd expects. One letter group differs.","explain":"The key is misspelled: launchd reads ProgramArguments (plural, an array); the dump says ProgramArgument. launchd ignores unknown keys, so the agent loads, logs nothing useful, and never runs anything. This looks like working persistence — alarming — but it is benign-because-broken: a defanged implant. The lesson for defenders: an agent plist on disk is intent; execution is what matters, and AN0306's correlation of modification with subsequent launch is what separates them.","persp":{"red":"One wrong key and two weeks of persistence never fire — attackers make this mistake on rushed campaigns.","blue":"Alert on execution following modification, not on plist presence alone, or you chase dead configs."},"study":"launchd needs ProgramArguments (an array). Unknown keys are silently ignored.","options":[{"t":"The key is misspelled, so launchd never runs anything"},{"t":"RunAtLoad must be false for agents to work"},{"t":"Plists cannot contain <array> elements"},{"t":"The Label must be in uppercase to load"}],"answer":0},{"id":"hd04","type":"fill","summary":"Fill the CTI report on XCSSET's plist abuse","scenario":[{"label":"ARTEFACT 1 — Draft for the weekly CTI report","text":"Your draft has four gaps. The ATT&CK T1647 page supports every missing word: XCSSET used plutil on Info.plist keys, abused a notarized Dock tool, and the technique ID is T1647."}],"question":"Complete the report using the word bank.","hint":"Blank 1: the key that hides the app. Blank 2: the Dock tool. Blank 3: the ATT&CK technique number. Blank 4: the tool XCSSET used to change the keys.","explain":"The page's procedure row says: XCSSET uses plutil to modify LSUIElement, DFBundleDisplayName and CFBundleIdentifier in /Contents/Info.plist to change how it is visible, and later versions leveraged the third-party notarized dockutil tool to repoint the Dock to a malicious app. This is T1647 behaviour. Reports that quote exact keys and tools are the ones other analysts can actually pivot on.","study":"S0658 XCSSET: plutil + LSUIElement/DFBundleDisplayName/CFBundleIdentifier + notarized dockutil.","segments":["XCSSET modified the ",{"blank":{"label":"key that hides the app","accept":["lsuielement"]}}," key via the ",{"blank":{"label":"plist utility","accept":["plutil"]}}," command, and abused the notarized ",{"blank":{"label":"Dock-editing tool","accept":["dockutil"]}}," tool to repoint the Dock — behaviour tracked as ",{"blank":{"label":"ATT&CK technique ID","accept":["t1647"]}},"."],"bank":["LSUIElement","plutil","dockutil","T1647","KeychainAudit","T1059"]},{"id":"hd05","type":"branch","summary":"Red/blue branching — visibility control via plists","scenario":[{"label":"ARTEFACT 1 — Setup","text":"Same estate, two chairs. First you sit on the red team: your payload is on disk, your LaunchAgent load got flagged by the SOC's watch on ~/Library/LaunchAgents. Then you sit in the blue chair watching what a red operator does next."}],"question":"Play both sides through three decisions.","hint":"Red wants visibility control with minimum new artefacts; blue wants to verify before escalating.","explain":"Red step 1: flipping LSUIElement in your own dropped app's Info.plist hides it with zero new files — the T1647 trick on top of the flagged persistence. Blue step 2: an Info.plist flip on an installed app still needs verification — was the app installed legitimately, is it signed, who changed it — before an alert escalates; wiping first destroys the evidence chain. Red step 3: with Info.plist writes watched, the Dock plist (com.apple.dock.plist) is the next documented T1647 lever. Each side's move is the other side's next detection requirement.","persp":{"red":"T1647 is attractive because every lever is a settings file, not a binary — small edits, big visibility changes.","blue":"Every red move here maps to an AN0306-style watch: LaunchAgents writes, Info.plist key flips, Dock plist changes."},"study":"Dual view: the same key flip is evasion (red) and a high-signal event (blue).","steps":[{"question":"RED — The SOC watches LaunchAgents writes. Which plist move best hides your app WITHOUT creating new files?","options":[{"t":"Set LSUIElement in your app's own Info.plist","ok":true,"consequence":"Your app now runs with no Dock icon and no App Switcher entry — no new artefacts."},{"t":"Delete launchd from the system","ok":false,"consequence":"You just broke the host and every log will scream."},{"t":"Rename your app to helper.txt","ok":false,"consequence":"A .txt app bundle is louder than the problem you were solving."}],"bestNote":"flip LSUIElement in the app's Info.plist — a settings edit, not a new file"},{"question":"BLUE — EDR shows an LSUIElement flip on installed app NotesDeck.app. No new LaunchAgents. First move?","options":[{"t":"Check install source, signature and change history first","ok":true,"consequence":"MDM installed NotesDeck yesterday; a plugin update rewrote Info.plist — plausible, keep watching with the hash pinned."},{"t":"Wipe the app and re-image the Mac","ok":false,"consequence":"You destroyed the artefact before answering who changed it and why."},{"t":"Ignore — Info.plist edits are normal","ok":false,"consequence":"An unverified key flip that hides GUI apps stays live on a production host."}],"bestNote":"verify provenance and signature first — the least aggressive defensible move"},{"question":"RED — Blue now watches Info.plist key flips. Which T1647 lever still controls what the USER sees?","options":[{"t":"Repoint com.apple.dock.plist at your app","ok":true,"consequence":"The Dock is yours: your app looks legitimate next to Safari and Mail."},{"t":"Post your app on the App Store","ok":false,"consequence":"Review, signing and weeks of waiting — not an operation."},{"t":"Email the plist to the user as an attachment","ok":false,"consequence":"That achieves nothing except noise."}],"bestNote":"com.apple.dock.plist is the next documented lever — deception moves to the Dock"}]},{"id":"hd06","type":"order","summary":"Rank five findings by urgency","scenario":[{"label":"ARTEFACT 1 — Morning queue (5 findings)","text":"Rank these from most urgent (1) to least urgent (5). Think: privilege, reach, intent evidence, blast radius."},{"label":"ARTEFACT 2 — Context","text":"All five were found in the same estate in one night. You can only work one before the 09:00 standup."}],"question":"Order the findings from most to least urgent.","hint":"Root before user; unsigned hidden binaries before signed apps; macOS housekeeping last.","explain":"1st: a root LaunchDaemon plist created by a service account — root, boot-time, unexplained. 2nd: an unsigned app added to the Dock's plist from a hidden folder — clear T1647 deception intent. 3rd: LSUIElement=true on a properly notarized app — suspicious key on an otherwise legitimate artefact. 4th: Safari's Bookmarks.plist changed — normal app behaviour unless correlated with something else. 5th: Spotlight rewriting its own plist — pure macOS housekeeping. Privilege and intent evidence order the queue.","study":"Rank by privilege + reach + intent evidence, not by how loud the alert sounds.","items":[{"t":"LaunchDaemon plist created by svc-backup in /Library/LaunchDaemons"},{"t":"Unsigned app path written into com.apple.dock.plist from /Users/Shared/.upd"},{"t":"LSUIElement=true found in a notarized app's Info.plist"},{"t":"Safari rewrote Bookmarks.plist during normal browsing"},{"t":"Spotlight rewrote its own plist during a reindex"}]},{"id":"hd07","type":"mcq","summary":"47 overnight plist writes — alarm or not","scenario":[{"label":"ARTEFACT 1 — Alert PIN-9017","text":"Detector fired: com.apple.spotlight.plist was written 47 times overnight on design-lab Mac DL-03."},{"label":"ARTEFACT 2 — Corroborating context","text":"The Mac received macOS update 26.4 at 22:00 and spent the night reindexing. Every write names process Spotlight. No new processes, no persistence keys, no user reports."}],"question":"What is the correct verdict and action?","hint":"Ask who the writer was, and whether the estate had a scheduled reason to rewrite that plist all night.","explain":"The writer is Spotlight itself, the timing matches a post-update reindex, and no persistence or hiding keys are involved — this is the 'looks alarming, is benign' case. The verdict is benign with context recorded. The tempting answer ('47 writes = malware') is the trap: volume alone is not evidence, the writer and the keys are.","study":"Writer process + timing + keys — volume never decides a verdict alone.","options":[{"t":"Benign — post-update reindex by Spotlight, record and close"},{"t":"Malicious — 47 writes prove active tampering"},{"t":"Malicious — reindexing is a known attacker cover"},{"t":"Inconclusive — re-image the Mac as a precaution"}],"answer":0},{"id":"hd08","type":"terminal","summary":"Terminal — read a binary config on a live host, change nothing","scenario":[{"label":"ARTEFACT 1 — Lead's message","text":"Live Mac, not imaged. /Users/Shared/.upd/config.plist is binary. I need to SEE it and I need the disk untouched — not one byte rewritten. You have stock macOS tooling. Go."}],"question":"Type a command that shows the plist's contents without modifying anything.","hint":"The constraint is 'nothing rewritten'. Whatever tool you pick, it must be a print-only invocation.","explain":"The canonical answer is plutil -p on the file — a pure print of a binary plist. PlistBuddy's Print command is equally read-only and scores full credit too. Anything with -convert rewrites data (a state change on live evidence); opening it in an editor risks accidental writes. On a live host, read-only printing is the move that keeps the artefact admissible.","persp":{"red":"Responders who convert evidence files hand you a 'tampered evidence' escape hatch.","blue":"Print-only commands (-p / Print) keep the hash stable from first touch to courtroom."},"study":"plutil -p file = read-only. PlistBuddy -c 'Print' file = read-only. -convert = writes.","host":"responder@FIN-07 live","prompt":"responder@FIN-07 ~ %","introLines":["# Live response host. Evidence file: /Users/Shared/.upd/config.plist (binary)","# Constraint: nothing on disk may be rewritten."],"elements":[{"label":"a read-only plist tool (plutil or PlistBuddy)","any":["plutil","plistbuddy"]},{"label":"a print-only action (-p or Print)","any":["-p","print"]},{"label":"the target file config.plist","any":["config.plist"]}],"canonical":"plutil -p /Users/Shared/.upd/config.plist","parts":[{"label":"plutil -p","desc":"prints any plist (binary or XML) read-only"},{"label":"PlistBuddy -c 'Print'","desc":"alternative read-only reader, also accepted"},{"label":"path","desc":"the binary config inside the hidden folder"}],"danger":[{"any":["-convert","> ",">>","mv ","cp "],"note":"that invocation rewrites or replaces data — the lead said not one byte."}],"dangerNote":"-convert (or redirecting output back onto disk) rewrites data on a live evidence host.","outputSample":["{","  c2 = \"10[.]0[.]4[.]31:443\"","  interval = 60","  install_date = \"2026-05-11\"","}"],"timeLimit":null},{"id":"hd09","type":"match","summary":"Match each artefact to the behaviour it proves","scenario":[{"label":"ARTEFACT 1 — Case board (four exhibits)","text":"Four exhibits from one investigation. Each one proves exactly one enabled behaviour. T1647 is the plist-modification method behind all four."},{"label":"ARTEFACT 2 — Reference","text":"Enabled behaviours documented around T1647: hidden execution (T1564.003), login persistence (T1547.007), Dock deception, library injection via LSEnvironment (T1574.006)."}],"question":"Match each exhibit to the behaviour it proves.","hint":"Exhibit B mentions dockutil and the Dock. Exhibit D mentions DYLD_INSERT_LIBRARIES.","explain":"A: LSUIElement=true inside a signed app proves hidden execution (T1564.003 via T1647). B: dockutil repointing the Dock at a hidden app is XCSSET-style Dock deception. C: a ReopenedApps entry in the loginwindow plist proves login persistence (T1547.007 via T1647). D: LSEnvironment carrying DYLD_INSERT_LIBRARIES proves the setup for Dynamic Linker Hijacking (T1574.006 via T1647). Exhibit-to-behaviour mapping is what turns artefacts into an ATT&CK story.","study":"One exhibit, one behaviour, one technique reference — that is a CTI-grade case note.","left":[{"t":"A — LSUIElement=true in a signed app's Info.plist"},{"t":"B — dockutil run pointing the Dock at /Users/Shared/.upd/CleanIt.app"},{"t":"C — ReopenedApps entry in com.apple.loginwindow.plist"},{"t":"D — LSEnvironment with DYLD_INSERT_LIBRARIES in Info.plist"}],"right":[{"t":"hidden execution (T1564.003 via T1647)"},{"t":"Dock deception against the user"},{"t":"login persistence (T1547.007 via T1647)"},{"t":"Dynamic Linker Hijacking setup (T1574.006)"}]},{"id":"hd10","type":"log","summary":"Which sequence falls inside the analytic's time window","scenario":[{"label":"ARTEFACT 1 — AN0306 mutable elements","code":"MonitoredDirectories: ~/Library/LaunchAgents, /Library/LaunchDaemons, ~/Library/Preferences\nSuspiciousKeys: LSUIElement, LSEnvironment, ProgramArguments\nTimeWindow: 300 seconds between plist modification and referenced execution"},{"label":"ARTEFACT 2 — FIN-07 morning log","code":"10:14:02  write  /Users/jdoe/Library/LaunchAgents/com.apple.update.agent.plist\n10:14:05  exec   launchctl load /Users/jdoe/Library/LaunchAgents/com.apple.update.agent.plist\n10:14:09  exec   /Users/Shared/.upd/helper  (parent: launchd)\n13:02:11  exec   vim ~/Documents/notes.txt\n13:05:44  write  /Users/jdoe/Library/Preferences/com.apple.dock.plist  process: Dock (user tile move)"}],"question":"Which statement about the 10:14 sequence is correct?","hint":"Walk the three 10:14 events against the three mutable elements: directory, keys, window.","explain":"The plist was modified inside a monitored directory, then launchd loaded it, then the referenced binary executed — all inside the 300-second window. That is exactly the modification-followed-by-execution pattern AN0306 exists to catch, and the launchd parentage confirms the agent was the execution vector. The afternoon events are a text edit and a user-initiated Dock change: outside the window, outside the pattern.","persp":{"red":"Space your actions outside the correlation window and analytics that only look at short chains miss you.","blue":"This is why TimeWindow exists: presence alone is noise; modification→launch inside the window is signal."},"study":"AN0306 = monitored directory + suspicious keys + modification-before-launch inside TimeWindow.","lines":["10:14:02  write  /Users/jdoe/Library/LaunchAgents/com.apple.update.agent.plist","10:14:05  exec   launchctl load /Users/jdoe/Library/LaunchAgents/com.apple.update.agent.plist","10:14:09  exec   /Users/Shared/.upd/helper  (parent: launchd)","13:02:11  exec   vim ~/Documents/notes.txt","13:05:44  write  /Users/jdoe/Library/Preferences/com.apple.dock.plist  process: Dock (user tile move)"],"sub":{"type":"mcq","options":[{"t":"It is the exact modification-then-execution pattern AN0306 flags"},{"t":"It is three unrelated events — nothing correlates"},{"t":"Only the vim command is in scope of the analytic"},{"t":"The 13:05 Dock write is the suspicious anchor of the sequence"}],"answer":0}},{"id":"hd11","type":"mcq","summary":"One key flip on a managed app — how hard do you react","scenario":[{"label":"ARTEFACT 1 — Situation","text":"Morning finding: a single LSUIElement=true flip in the Info.plist of TaskPad.app, which MDM deployed and which verifies as notarized. No persistence keys anywhere, no new processes, no user complaints, no matching ticket."},{"label":"ARTEFACT 2 — Stakeholder pressure","text":"The service desk wants the Mac rebuilt 'just in case'. The CISO asks whether you are sure it can wait."}],"question":"Which response is proportionate and defensible?","hint":"One anomaly on an otherwise clean, signed artefact — the proportionate move watches and verifies; it does not wipe.","explain":"With one key flip, no persistence, no execution, and a signed app, the least aggressive defensible action is to capture the artefact, ask MDM/IT about the change, and put a targeted watch on the app — escalation only if corroboration arrives. Rebuilding or isolating on this evidence is overreaction with real cost; ignoring it leaves an unexplained hiding key live. Proportionality is a skill: match response strength to evidence strength.","persp":{"red":"Attackers test defenders with small probes — overreaction wastes your capacity; underreaction normalizes their edits.","blue":"Capture, verify, watch — escalate on the second signal, not the first flicker."},"study":"Proportionate response: capture + verify + targeted watch, escalate on corroboration.","options":[{"t":"Capture evidence, query MDM, add a targeted watch"},{"t":"Isolate and re-image the Mac immediately"},{"t":"Close the case — signed apps cannot be tampered"},{"t":"Push a fleet-wide plist reset tonight"}],"answer":0},{"id":"hd12","type":"multi","summary":"Tune AN0306's mutable elements without losing coverage","scenario":[{"label":"ARTEFACT 1 — Your SOC's complaint","text":"The plist analytic fires 400 times a day. The detection engineer asks you to pick THREE settings that cut noise but keep the technique's core coverage."},{"label":"ARTEFACT 2 — Current mutable elements","code":"MonitoredDirectories: ALL directories\nSuspiciousKeys: every key in every plist\nTimeWindow: none (no correlation)"}],"question":"Select the THREE settings that reduce false positives while keeping coverage.","hint":"Coverage comes from persistence directories, the documented keys, and the modification-to-launch link.","explain":"Scope MonitoredDirectories to the persistence/configuration folders the technique actually abuses, pin SuspiciousKeys to the keys with documented behaviour (LSUIElement, LSEnvironment, ProgramArguments), and keep the 5-minute modification-before-launch correlation — together these keep every T1647 path visible while cutting most noise. Watching every directory, every key, with no correlation is the current flood; shrinking to fonts drops the coverage the analytic exists for.","study":"MonitoredDirectories + SuspiciousKeys + TimeWindow — the three levers of AN0306 tuning.","options":[{"t":"MonitoredDirectories = ~/Library/LaunchAgents, /Library/LaunchDaemons, ~/Library/Preferences","correct":true,"why":"the folders T1647 is about — full technique coverage, far less volume"},{"t":"SuspiciousKeys = LSUIElement, LSEnvironment, ProgramArguments","correct":true,"why":"the documented behaviour keys"},{"t":"TimeWindow = 300s between plist write and referenced launch","correct":true,"why":"presence alone is noise; the link is the signal"},{"t":"MonitoredDirectories = /System/Library/Fonts only","correct":false,"why":"quiet, but zero coverage of the technique"},{"t":"Alert on every plist write estate-wide","correct":false,"why":"that is the flood you were asked to stop"}]},{"id":"hd13","type":"fill","summary":"Fill the incident report with the right ATT&CK words","scenario":[{"label":"ARTEFACT 1 — Report skeleton (four gaps)","text":"Your IR report must be pivot-ready: exact utility names, exact file names, exact technique ID. Every missing word is one you have used in this exam."}],"question":"Complete the report with the word bank.","hint":"The utility that wrote settings is defaults; the app's settings file is Info.plist; the technique is T1647; the tactic's goal is defence evasion.","explain":"The report names the defaults utility writing the Dock configuration, an Info.plist gaining LSUIElement, and assesses the activity as T1647 in service of Defense Impairment (defence evasion). Exact names make the report actionable: hunters can build queries, and the CISO reads a technique ID instead of adjectives.","study":"A good IR report names utilities, files, keys and technique IDs — nothing vaguer.","segments":["We observed the adversary use the ",{"blank":{"label":"settings utility","accept":["defaults"]}}," utility to write a path into the Dock configuration (",{"blank":{"label":"Dock plist file","accept":["com.apple.dock.plist"]}},"), and an app's ",{"blank":{"label":"app settings file","accept":["info.plist"]}}," gain an LSUIElement key. We assess the activity as ",{"blank":{"label":"ATT&CK technique","accept":["t1647"]}},"."],"bank":["defaults","com.apple.dock.plist","Info.plist","T1647","Spotlight","T1003"]},{"id":"hd14","type":"dnd","summary":"Place each behaviour in its ATT&CK tactic column","scenario":[{"label":"ARTEFACT 1 — Matrix excerpt (three columns)","code":"Defense Impairment | Persistence | Execution\n-------------------+-------------+----------\n (weaken defenses) | (stay)      | (run code)"},{"label":"ARTEFACT 2 — Three observed behaviours","text":"1) LSUIElement flip so the implant has no Dock presence. 2) A LaunchDaemon plist written to run the implant at boot. 3) Plist files populated so the dropped payload can execute (Cuckoo Stealer style)."}],"question":"Drag each behaviour onto the tactic column it belongs to.","hint":"Ask for each: is the goal hiding, staying, or running?","explain":"Hiding an app's presence is Defense Impairment — the T1647 tactic. Writing a boot-time LaunchDaemon is Persistence (T1543.004). Populating plists so a payload can execute is Execution — the enablement Cuckoo Stealer demonstrates. One technique (T1647) feeds several tactic goals; the tactic depends on what the adversary achieves with the edit, not on the file that was touched.","study":"Same technique, different columns: hiding, staying, running.","items":[{"t":"Flip LSUIElement so the implant has no Dock presence"},{"t":"Write a LaunchDaemon plist that runs the implant at boot"},{"t":"Populate plists so the dropped payload can execute"}],"slots":[{"label":"Defense Impairment","accept":0},{"label":"Persistence","accept":1},{"label":"Execution","accept":2}]},{"id":"hd15","type":"log","summary":"One quiet line — 'plist housekeeping' that is not","scenario":[{"label":"ARTEFACT 1 — Quiet afternoon log (FIN-11)","code":"16:41:02  exec   /usr/libexec/PlistBuddy -c 'Set :LSEnvironment -dict DYLD_INSERT_LIBRARIES /Users/Shared/.upd/interpose.dylib' /Applications/Notes.app/Contents/Info.plist\n16:41:20  write  /Applications/Notes.app/Contents/Info.plist\n16:42:01  write  /Users/kim/Library/Preferences/com.apple.Spotlight.plist  process: Spotlight"},{"label":"ARTEFACT 2 — Shift-lead comment","text":"'Just plist housekeeping on Notes.app. Low prio.' You are not sure. Look at the PlistBuddy arguments again."}],"question":"Select ALL conclusions that the 16:41 line supports.","hint":"The PlistBuddy Set command does not rename anything — it injects a dictionary with one variable into a specific key.","explain":"The quiet line injects DYLD_INSERT_LIBRARIES with a hidden library into a stock app via LSEnvironment — the exact T1647 passage that enables persistence via Dynamic Linker Hijacking (T1574.006). Every launch of Notes.app will now load the hostile library. The lead's 'housekeeping' read is the trap: benign housekeeping changes display names or paths, it does not plant DYLD variables pointing into /Users/Shared/.upd.","persp":{"red":"One quiet PlistBuddy line turns a trusted app into a loader — no new processes, no new files beyond the dylib.","blue":"Alert on LSEnvironment or DYLD_INSERT_LIBRARIES strings in Info.plist writes — they are near-zero false positive."},"study":"LSEnvironment + DYLD_INSERT_LIBRARIES in Info.plist = Dynamic Linker Hijacking setup.","lines":["16:41:02  exec   /usr/libexec/PlistBuddy -c 'Set :LSEnvironment -dict DYLD_INSERT_LIBRARIES /Users/Shared/.upd/interpose.dylib' /Applications/Notes.app/Contents/Info.plist","16:41:20  write  /Applications/Notes.app/Contents/Info.plist","16:42:01  write  /Users/kim/Library/Preferences/com.apple.Spotlight.plist  process: Spotlight"],"sub":{"type":"multi","options":[{"t":"LSEnvironment got a DYLD_INSERT_LIBRARIES value","correct":true,"why":"the PlistBuddy Set call writes exactly that key"},{"t":"Notes.app will load a library from /Users/Shared on launch","correct":true,"why":"the injected value points at /Users/Shared/.upd/interpose.dylib"},{"t":"This is normal Spotlight cache cleanup","why":"the 16:42 Spotlight line is unrelated background noise"},{"t":"The App Store repackaged Notes.app","why":"PlistBuddy is a local property-list edit, not a repackage"}]}}]}</script>
<script>
/* ============ CyberPulse exam engine — T1647 ============ */
(function () {
  "use strict";
  var META = null, DATA = null;
  var S = null; /* session state */
  var EX_STATE = {}; /* per-exercise render state */
  var TICK = null;

  /* ---------- utils ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;");
  }
  function escAttr(s) { return esc(s).replace(/'/g, "&#39;"); }
  function shuffle(a) {
    var x = a.slice(), i, j, t;
    for (i = x.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = x[i]; x[i] = x[j]; x[j] = t; }
    return x;
  }
  function fmtTime(s) {
    if (s < 0) s = 0;
    var m = Math.floor(s / 60), r = s % 60;
    return (m < 10 ? "0" + m : "" + m) + ":" + (r < 10 ? "0" + r : "" + r);
  }
  function fmtDur(s) {
    var m = Math.floor(s / 60), r = s % 60;
    if (m === 0) return r + "s";
    return m + "m " + (r < 10 ? "0" + r : r) + "s";
  }
  function r1(x) { return Math.round(x * 10) / 10; }
  function words(s) { return String(s).split(/\s+/).filter(function (w) { return w.length > 0; }).length; }
  function norm(s) {
    return String(s).toLowerCase().replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"')
      .replace(/\s+/g, " ").trim();
  }
  function codeHi(s) {
    var out = esc(s);
    out = out.replace(/(&quot;[^&]*?&quot;)/g, "<span class=\"s\">$1</span>");
    out = out.replace(/(^|\s)(\/[\w.\/~@+-]+)/g, "$1<span class=\"p\">$2</span>");
    out = out.replace(/(^|\s)((?:defaults|plutil|PlistBuddy|dockutil|launchctl|killall|osascript|file|grep|ls|cat|md5|shasum|codesign|spctl|xattr|sqlite3)(?=\s|$))/g, "$1<span class=\"k\">$2</span>");
    return out;
  }

  /* ---------- timer state machine ---------- */
  /* states: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
  function setTimerState(st) {
    S.timer.state = st;
    var el = $("hTState");
    if (st === "RUNNING") { el.textContent = "\u25B6 RUNNING"; el.className = "tstate run"; }
    else if (st === "PAUSED_MANUAL") { el.textContent = "\u23F8 PAUSED \u2014 manual (press Resume)"; el.className = "tstate"; }
    else if (st === "PAUSED_AUTO_CHECK") { el.textContent = "\u23F8 PAUSED \u2014 reviewing feedback (resumes on Next)"; el.className = "tstate"; }
    else { el.textContent = "\u23F9 ENDED"; el.className = "tstate"; }
  }
  function startTicks() {
    if (TICK) clearInterval(TICK);
    TICK = setInterval(function () {
      if (!S || S.phase === "intro" || S.phase === "results") return;
      if (S.timer.state !== "RUNNING") return;
      S.timer.remaining -= 1;
      if (S.timer.remaining <= 0) {
        S.timer.remaining = 0;
        setTimerState("ENDED");
        updateHeader();
        showResults();
        return;
      }
      updateHeader();
    }, 1000);
  }
  function autoPauseStart() {
    if (S.timer.state === "RUNNING") {
      S.timer.state = "PAUSED_AUTO_CHECK";
      S.timer._autoStart = Date.now();
      setTimerState("PAUSED_AUTO_CHECK");
    }
  }
  function autoPauseEnd() {
    if (S.timer.state === "PAUSED_AUTO_CHECK") {
      if (S.timer._autoStart) { S.timer.autoPauseSec += Math.round((Date.now() - S.timer._autoStart) / 1000); S.timer._autoStart = null; }
      S.timer.state = "RUNNING";
      setTimerState("RUNNING");
    }
  }

  /* ---------- header ---------- */
  function updateHeader() {
    $("hTimer").textContent = fmtTime(S.timer.remaining);
    $("hN").textContent = String(Math.min(S.idx + 1, S.order.length));
    $("hScore").textContent = r1(S.creditSum) + " / " + S.answeredCount;
    var pct = S.answeredCount > 0 ? Math.round((S.creditSum / S.answeredCount) * 100) : 0;
    $("hPct").textContent = "(" + pct + "%)";
    $("hProg").style.width = (S.order.length ? Math.round(((S.idx) / S.order.length) * 100) : 0) + "%";
  }
  function buildHeader() {
    var sev = META.severity, cls = "sev-badge sev-" + META.sevClass;
    var sevIcon = sev === "EASY" ? "\u25CF" : sev === "MEDIUM" ? "\u25CF" : sev === "HARD" ? "\u25B2" : "\u25B2";
    $("hdr").innerHTML =
      "<div class=\"cell\"><span class=\"tid\">" + esc(META.topicId.toUpperCase()) + "</span> Exercise <b id=\"hN\">1</b> of " + S.order.length + "</div>" +
      "<div class=\"cell\"><span class=\"" + cls + "\"><span aria-hidden=\"true\">" + sevIcon + "</span> " + esc(sev) + "</span></div>" +
      "<div class=\"cell\"><span id=\"hTState\" class=\"tstate run\">\u25B6 RUNNING</span> <span id=\"hTimer\" class=\"timer\">" + fmtTime(S.timer.remaining) + "</span></div>" +
      "<div class=\"cell\">Score <b id=\"hScore\">0.0 / 0</b> <span id=\"hPct\">(0%)</span></div>" +
      "<div class=\"spacer\"></div>" +
      "<button class=\"btn amber\" id=\"btnHint\" type=\"button\">\u25CB Hint</button>" +
      "<button class=\"btn ghost\" id=\"btnPause\" type=\"button\">\u23F8 Pause</button>" +
      "<button class=\"btn red\" id=\"btnSkip\" type=\"button\">\u26A0 Skip</button>" +
      "<div class=\"progress-track\" style=\"flex-basis:100%\"><div class=\"progress-fill\" id=\"hProg\"></div></div>";
    $("btnHint").addEventListener("click", hint);
    $("btnPause").addEventListener("click", manualPause);
    $("btnSkip").addEventListener("click", skip);
  }

  /* ---------- intro ---------- */
  function renderIntro() {
    var sev = META.severity, cls = "sev-badge sev-" + META.sevClass;
    var sevIcon = sev === "HARD" || sev === "EXTREMELY HARD" ? "\u25B2" : "\u25CF";
    var mins = META.estimatedMinutes;
    var h = "";
    h += "<div class=\"card\">";
    h += "<div class=\"intro-head\"><h1>" + esc(META.objectId) + " \u2014 " + esc(sev) + " practice exam</h1></div>";
    h += "<div style=\"color:var(--text-secondary);font-size:15.5px\">" + esc(META.objectLine) + "</div>";
    h += "<div class=\"meta-chips\">";
    h += "<span class=\"chip2\"><span aria-hidden=\"true\">\u2691</span> Severity: <b>" + esc(sev) + "</b> <span class=\"" + cls + "\"><span aria-hidden=\"true\">" + sevIcon + "</span> " + esc(sev) + "</span></span>";
    h += "<span class=\"chip2\"><span aria-hidden=\"true\">\u2261</span> Exercises in this file: <b>" + DATA.exercises.length + "</b></span>";
    h += "<span class=\"chip2\"><span aria-hidden=\"true\">\u23F1</span> Estimated time: <b>" + mins + " min</b> \u2014 timer budget <b>" + fmtTime(META.timerBudget) + "</b></span>";
    h += "<span class=\"chip2\"><span aria-hidden=\"true\">\u2713</span> Pass mark: <b>" + META.passMark + "%</b></span>";
    h += "</div></div>";

    h += "<h2 class=\"sec\"><span aria-hidden=\"true\">\u25C6</span> What you will learn here</h2>";
    h += "<div class=\"card\">" + DATA.intro.learn + "</div>";

    h += "<h2 class=\"sec\"><span aria-hidden=\"true\">\u25C6</span> Keywords covered in this exam</h2>";
    h += "<div class=\"card\">";
    for (var i = 0; i < DATA.intro.keywords.length; i++) {
      var k = DATA.intro.keywords[i];
      h += "<div class=\"kw-theme\"><div class=\"kw-h\">" + esc(k.theme) + "</div><div class=\"kw-tags\">";
      for (var j = 0; j < k.tags.length; j++) h += "<span class=\"kw-tag\">" + esc(k.tags[j]) + "</span>";
      h += "</div></div>";
    }
    h += "</div>";

    h += "<h2 class=\"sec\"><span aria-hidden=\"true\">\u25C6</span> How this exam works</h2>";
    h += "<div class=\"card\">" + DATA.intro.how;
    h += "<div class=\"startrow\"><button id=\"btnStart\" class=\"startbtn\" type=\"button\">\u25B6 Start the exam</button>";
    h += "<span class=\"mini\" style=\"color:var(--text-secondary);font-size:14px\">Pass mark " + META.passMark + "%. Good luck.</span></div></div>";
    $("intro").innerHTML = h;
    $("btnStart").addEventListener("click", startExam);
  }

  /* ---------- exam start / flow ---------- */
  function startExam() {
    S.phase = "exam";
    S.order = shuffle(DATA.exercises.map(function (o, i) { return i; }));
    S.idx = 0;
    S.answers = {};
    EX_STATE = {};
    S.answeredCount = 0;
    S.creditSum = 0;
    S.skipped = [];
    S.reviewing = null;
    S.hinted = {};
    S.reportedThisAttempt = false;
    S.timer = { remaining: META.timerBudget, state: "RUNNING", manualPauseSec: 0, autoPauseSec: 0, _autoStart: null, _manualStart: null };
    $("intro").classList.add("hidden");
    $("results").classList.add("hidden");
    $("review").classList.add("hidden");
    $("exam").classList.remove("hidden");
    buildHeader();
    setTimerState("RUNNING");
    renderCurrent();
  }
  function curEx() { return DATA.exercises[S.order[S.idx]]; }
  function renderCurrent() {
    var ex = curEx();
    renderExercise(ex, false);
    updateHeader();
    window.scrollTo(0, 0);
  }
  function allDone() { return S.idx >= S.order.length; }
  function advance() {
    S.idx += 1;
    if (allDone()) {
      if (S.skipped.length > 0) openReview();
      else showResults();
    } else renderCurrent();
  }

  /* ---------- scenario / question / answer blocks ---------- */
  function artefactHtml(a) {
    var h = "<div class=\"artefact\"><div class=\"artefact-label\">" + esc(a.label) + "</div><div class=\"artefact-body\">";
    if (a.code !== undefined && a.code !== null) h += "<pre class=\"code\">" + codeHi(a.code) + "</pre>";
    else h += "<div style=\"font-size:15px\">" + esc(a.text) + "</div>";
    h += "</div></div>";
    return h;
  }
  function renderExercise(ex, inReview) {
    var host = $("exercise");
    var st = EX_STATE[ex.id] = EX_STATE[ex.id] || {};
    st.inReview = !!inReview;
    var longScenario = words(ex.scenario.map(function (a) { return a.text || a.code || ""; }).join(" ")) > 110;
    var h = "";
    h += "<div class=\"block block-s\" id=\"blkS\">";
    h += "<div class=\"block-h\"><span class=\"ic\" aria-hidden=\"true\">\u25A3</span> SCENARIO <span style=\"margin-left:auto\"></span>";
    if (longScenario) h += "<button class=\"collapse-btn\" id=\"btnCollapse\" type=\"button\">Collapse scenario</button>";
    h += "</div>";
    if (longScenario) h += "<div class=\"collapsed-summary\">" + esc(ex.summary) + "</div>";
    h += "<div class=\"block-b artefacts-wrap\">";
    for (var i = 0; i < ex.scenario.length; i++) h += artefactHtml(ex.scenario[i]);
    h += "</div></div>";
    h += "<div class=\"block block-q\"><div class=\"block-h\"><span class=\"ic\" aria-hidden=\"true\">\u2753</span> QUESTION</div><div class=\"block-b\"><div class=\"qtext\">" + esc(ex.question) + "</div></div></div>";
    h += "<div class=\"block block-a\"><div class=\"block-h\"><span class=\"ic\" aria-hidden=\"true\">\u270E</span> YOUR ANSWER</div><div class=\"block-b\" id=\"ansArea\"></div></div>";
    h += "<div class=\"footrow\">";
    h += "<div style=\"color:var(--text-secondary);font-size:13.5px\">" + (inReview ? "\u26A0 Skipped exercise \u2014 review mode. Answer it now or return to the list." : (st.hinted ? "\u25CB Hint used on this exercise (\u221210% credit)." : "One hint allowed on this exercise (\u221210% of its credit).")) + "</div>";
    h += "<div style=\"display:flex;gap:10px\">";
    if (!inReview) h += "<button class=\"btn green\" id=\"btnCheck\" type=\"button\">\u2713 Check</button>";
    else h += "<button class=\"btn green\" id=\"btnCheck\" type=\"button\">\u2713 Check</button>";
    h += "<button class=\"btn primary hidden\" id=\"btnNext\" type=\"button\">" + (inReview ? "Next \u2192 back to list" : "Next \u2192") + "</button>";
    h += "</div></div>";
    h += "<div id=\"fbHost\"></div>";
    host.innerHTML = h;
    var ca = $("btnCollapse");
    if (ca) ca.addEventListener("click", function () {
      var blk = $("blkS");
      blk.classList.toggle("collapsed");
      ca.textContent = blk.classList.contains("collapsed") ? "Expand scenario" : "Collapse scenario";
    });
    renderWidget(ex);
    $("btnCheck").addEventListener("click", function () { doCheck(ex); });
    $("btnNext").addEventListener("click", function () { doNext(ex); });
    var hintBtn2 = $("btnHint");
    hintBtn2.disabled = !!(st.hinted || st.checked);
    $("btnSkip").disabled = !!st.checked;
    if (st.checked) { $("btnCheck").disabled = true; disableWidget(ex); }
  }

  /* ---------- widgets ---------- */
  function renderWidget(ex) {
    var host = $("ansArea");
    var st = EX_STATE[ex.id];
    if (ex.type === "mcq") host.innerHTML = optsHtml(ex, false);
    else if (ex.type === "multi") host.innerHTML = optsHtml(ex, true);
    else if (ex.type === "match") host.innerHTML = matchHtml(ex);
    else if (ex.type === "dnd") host.innerHTML = dndHtml(ex);
    else if (ex.type === "fill") host.innerHTML = fillHtml(ex);
    else if (ex.type === "order") host.innerHTML = orderHtml(ex);
    else if (ex.type === "terminal") host.innerHTML = termHtml(ex);
    else if (ex.type === "branch") host.innerHTML = branchHtml(ex);
    else if (ex.type === "triage") host.innerHTML = triageHtml(ex);
    else if (ex.type === "log") host.innerHTML = logHtml(ex);
    bindWidget(ex);
  }
  function optsHtml(ex, isMulti) {
    var st = EX_STATE[ex.id] = EX_STATE[ex.id] || {};
    if (!st.optPerm) {
      st.optPerm = shuffle(ex.options.map(function (o, i) { return i; }));
    }
    var h = "<div class=\"opts\" role=\"" + (isMulti ? "group" : "radiogroup") + "\" aria-label=\"Answer options\">";
    for (var v = 0; v < st.optPerm.length; v++) {
      var oi = st.optPerm[v];
      var o = ex.options[oi];
      var letter = String.fromCharCode(65 + v);
      var sel = st.sel && st.sel.indexOf(oi) >= 0;
      h += "<label class=\"opt" + (sel ? " sel" : "") + "\">" +
        "<input type=\"" + (isMulti ? "checkbox" : "radio") + "\" name=\"opt_" + esc(ex.id) + "\" value=\"" + oi + "\"" + (sel ? " checked" : "") + " data-oi=\"" + oi + "\">" +
        "<span class=\"lbl\">" + letter + ".</span><span class=\"txt\">" + esc(o.t) + "</span></label>";
    }
    h += "</div>";
    if (isMulti) h += "<div style=\"margin-top:9px;font-size:13.5px;color:var(--text-secondary)\">\u2691 Multi-select: several answers may apply. Partial credit per correct item; wrong picks subtract.</div>";
    return h;
  }
  function matchHtml(ex) {
    var st = EX_STATE[ex.id];
    if (!st.rgtPerm) st.rgtPerm = shuffle(ex.right.map(function (o, i) { return i; }));
    if (!st.asg) st.asg = {};

  /* ---------- grading ---------- */
  /* Single reusable partial-credit scoring function (spec STEP 5).
     selectedItems / correctItems are arrays of item keys; a selected key that
     is not a correct key counts as a wrong pick. Returns a real in [0, 1]. */
  function scoreExercise(selectedItems, correctItems) {
    var N = correctItems.length, H = 0, W = 0, i, k;
    var picked = [];
    for (i = 0; i < selectedItems.length; i++) {
      if (selectedItems[i] === undefined || selectedItems[i] === null) continue;
      var dup = false;
      for (k = 0; k < picked.length; k++) { if (picked[k] === String(selectedItems[i])) { dup = true; break; } }
      if (!dup) picked.push(String(selectedItems[i]));
    }
    for (i = 0; i < picked.length; i++) {
      var inCorrect = false;
      for (k = 0; k < N; k++) { if (String(correctItems[k]) === picked[i]) { inCorrect = true; break; } }
      if (inCorrect) H++; else W++;
    }
    return Math.max(0, (H - W) / N);
  }
  function grade(ex) {
    var st = EX_STATE[ex.id];
    var g = { credit: 0, H: 0, W: 0, N: 1, items: [], label: "INCORRECT", extra: "" };
    var i, k;
    if (ex.type === "mcq") {
      g.N = 1;
      var pick = st.sel && st.sel.length ? st.sel[0] : undefined;
      if (pick === ex.answer) { g.H = 1; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 you picked the right answer." }); }
      else if (pick === undefined) { g.items.push({ s: "miss", t: "\u25CB Missed \u2014 no answer given." }); }
      else { g.W = 1; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 correct answer: " + ex.options[ex.answer].t }); }
    } else if (ex.type === "multi" || (ex.type === "log" && ex.sub.type === "multi")) {
      var opts = ex.type === "log" ? ex.sub.options : ex.options;
      var sel = ex.type === "log" ? st.sel : st.sel;
      g.N = 0;
      for (i = 0; i < opts.length; i++) {
        if (opts[i].correct) {
          g.N++;
          if (sel && sel.indexOf(i) >= 0) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 " + opts[i].t + " " + (opts[i].why ? "\u2014 " + opts[i].why : "") }); }
          else g.items.push({ s: "miss", t: "\u25CB Missed \u2014 " + opts[i].t + " " + (opts[i].why ? "\u2014 " + opts[i].why : "") });
        }
      }
      for (i = 0; i < opts.length; i++) {
        if (!opts[i].correct && sel && sel.indexOf(i) >= 0) { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 " + opts[i].t + " " + (opts[i].why ? "\u2014 " + opts[i].why : "") }); }
      }
    } else if (ex.type === "match") {
      g.N = ex.left.length;
      for (i = 0; i < ex.left.length; i++) {
        if (st.asg[i] === undefined) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 " + ex.left[i].t + " was not paired." });
        else if (st.asg[i] === i) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 " + ex.left[i].t + " \u2192 " + ex.right[i].t }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 " + ex.left[i].t + " pairs with \u201C" + ex.right[i].t + "\u201D, not \u201C" + ex.right[st.asg[i]].t + "\u201D." }); }
      }
    } else if (ex.type === "dnd") {
      g.N = ex.slots.length;
      for (i = 0; i < ex.slots.length; i++) {
        var occupant = null;
        for (k in st.placed) { if (st.placed[k] === i) occupant = parseInt(k, 10); }
        if (occupant === null) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 target \u201C" + ex.slots[i].label + "\u201D was left empty; it accepts " + ex.items[ex.slots[i].accept].t + "." });
        else if (occupant === ex.slots[i].accept) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 " + ex.items[occupant].t + " \u2192 " + ex.slots[i].label }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 " + ex.items[occupant].t + " does not belong on \u201C" + ex.slots[i].label + "\u201D; the right item is " + ex.items[ex.slots[i].accept].t + "." }); }
      }
    } else if (ex.type === "fill") {
      var blanks = [];
      for (i = 0; i < ex.segments.length; i++) if (typeof ex.segments[i] !== "string") blanks.push(ex.segments[i].blank);
      g.N = blanks.length;
      for (i = 0; i < blanks.length; i++) {
        var v = st.vals ? (st.vals[i] || "") : "";
        if (!v.trim()) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 blank " + (i + 1) + " (" + blanks[i].label + ") left empty; accepted: " + blanks[i].accept.join(" / ") + "." });
        else if (blanks[i].accept.map(norm).indexOf(norm(v)) >= 0) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 blank " + (i + 1) + " (" + blanks[i].label + "): " + v }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 blank " + (i + 1) + " (" + blanks[i].label + "): you typed \u201C" + v + "\u201D; accepted: " + blanks[i].accept.join(" / ") + "." }); }
      }
    } else if (ex.type === "order") {
      g.N = ex.items.length;
      for (i = 0; i < st.list.length; i++) {
        if (st.list[i] === i) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 position " + (i + 1) + ": " + ex.items[i].t }); }
        else g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 position " + (i + 1) + " should be: " + ex.items[i].t + " (you placed " + ex.items[st.list[i]].t + ")" });
      }
    } else if (ex.type === "terminal") {
      var cmd = st.cmd || "";
      var n = norm(cmd);
      g.N = ex.elements.length;
      if (!cmd.trim()) {
        for (i = 0; i < ex.elements.length; i++) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 " + ex.elements[i].label + " (no command entered)" });
      } else {
        for (i = 0; i < ex.elements.length; i++) {
          var el = ex.elements[i], hit = false;
          for (k = 0; k < el.any.length; k++) { if (n.indexOf(norm(el.any[k])) >= 0) { hit = true; break; } }
          if (hit) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct element \u2014 " + el.label }); }
          else g.items.push({ s: "miss", t: "\u25CB Missing element \u2014 " + el.label });
        }
      }
      if (ex.danger) {
        var dHit = false;
        for (i = 0; i < ex.danger.length; i++) {
          var ds = ex.danger[i].any;
          for (k = 0; k < ds.length; k++) { if (n.indexOf(norm(ds[k])) >= 0) { dHit = true; break; } }
          if (dHit) break;
        }
        if (dHit) g.extra = "\u2717 DANGEROUS \u2014 NEAR MISS: " + ex.dangerNote;
      }
    } else if (ex.type === "branch") {
      g.N = ex.steps.length;
      for (i = 0; i < ex.steps.length; i++) {
        var p2 = st.picks[i];
        if (p2 === undefined) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 step " + (i + 1) + " unanswered; best move: " + ex.steps[i].bestNote });
        else if (ex.steps[i].options[p2].ok) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 step " + (i + 1) + ": " + ex.steps[i].options[p2].t }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 step " + (i + 1) + ": you chose \u201C" + ex.steps[i].options[p2].t + "\u201D; better: " + ex.steps[i].bestNote }); }
      }
    } else if (ex.type === "triage") {
      g.N = ex.alerts.length;
      for (i = 0; i < ex.alerts.length; i++) {
        var p3 = st.picks[i];
        if (p3 === undefined) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 " + ex.alerts[i].name + " not handled; best move: " + ex.alerts[i].bestNote });
        else if (ex.alerts[i].options[p3].ok) { g.H++; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 " + ex.alerts[i].name + ": " + ex.alerts[i].options[p3].t }); }
        else { g.W++; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 " + ex.alerts[i].name + ": you chose \u201C" + ex.alerts[i].options[p3].t + "\u201D; better: " + ex.alerts[i].bestNote }); }
      }
    } else if (ex.type === "log" && ex.sub.type === "mcq") {
      g.N = 1;
      var pick2 = st.sel && st.sel.length ? st.sel[0] : undefined;
      if (pick2 === ex.sub.answer) { g.H = 1; g.items.push({ s: "ok", t: "\u2713 Correct \u2014 you read the log the right way." }); }
      else if (pick2 === undefined) g.items.push({ s: "miss", t: "\u25CB Missed \u2014 no answer given." });
      else { g.W = 1; g.items.push({ s: "bad", t: "\u2717 Wrong \u2014 correct answer: " + ex.sub.options[ex.sub.answer].t }); }
    }
    /* route every exercise (multi-answer and single-answer alike) through the
       one reusable scoring function: H correct picks, W wrong picks, N correct items */
    var selKeys = [], corKeys = [], i3;
    for (i3 = 0; i3 < g.H; i3++) selKeys.push("c" + i3);
    for (i3 = 0; i3 < g.W; i3++) selKeys.push("w" + i3);
    for (i3 = 0; i3 < g.N; i3++) corKeys.push("c" + i3);
    g.credit = scoreExercise(selKeys, corKeys);
    g.label = g.credit >= 1 ? "CORRECT" : (g.credit > 0 ? "PARTIALLY CORRECT" : "INCORRECT");
    return g;
  }

  /* ---------- check / feedback / next ---------- */
  function doCheck(ex) {
    var st = EX_STATE[ex.id];
    if (st.checked) return;
    autoPauseStart(); /* FIRST action: stop the timer before rendering feedback */
    var g = grade(ex);
    st.checked = true;
    var hinted = !!st.hinted;
    var before = g.credit;
    var finalCredit = hinted ? Math.max(0, before - 0.1) : before;
    st.g = g; st.finalCredit = finalCredit; st.hinted = hinted;
    S.answers[ex.id] = { credit: finalCredit, ex: ex };
    S.answeredCount += 1;
    S.creditSum += finalCredit;
    renderFeedback(ex, g, finalCredit, hinted, before);
    $("btnCheck").disabled = true;
    $("btnSkip").disabled = true;
    $("btnHint").disabled = true;
    var nb = $("btnNext");
    nb.classList.remove("hidden");
    if (!st.inReview && S.idx === S.order.length - 1) nb.textContent = "Final Submit \u2192";
    disableWidget(ex);
    updateHeader();
  }
  function renderFeedback(ex, g, finalCredit, hinted, before) {
    var host = $("fbHost");
    var cls = g.label === "CORRECT" ? "f-correct" : (g.label === "PARTIALLY CORRECT" ? "f-partial" : "f-incorrect");
    var icon = g.label === "INCORRECT" ? "\u2717" : "\u2713";
    var h = "<div class=\"feedback " + cls + "\"><div class=\"feedback-h\"><span aria-hidden=\"true\">" + icon + "</span> " + g.label;
    if (g.N > 1) h += " <span style=\"font-weight:400\">(credit " + (Math.round(finalCredit * 100) / 100) + " \u2014 " + g.H + "/" + g.N + " items)</span>";
    h += "</div><div class=\"feedback-b\">";
    if (hinted && before > 0) h += "<div class=\"credit-line\" style=\"color:var(--state-partial)\">\u25CB Hint penalty applied: " + before + " \u2192 " + finalCredit + " (credit \u2212 0.10).</div>";
    h += "<div>" + esc(ex.explain) + "</div>";
    if (g.N > 1 || g.label === "INCORRECT") {
      h += "<div class=\"item-rows\">";
      for (var i = 0; i < g.items.length; i++) {
        var it = g.items[i];
        var c = it.s === "ok" ? "ok" : it.s === "bad" ? "bad" : "miss";
        h += "<div class=\"item-row " + c + "\"><span class=\"ic\" aria-hidden=\"true\">" + (it.s === "ok" ? "\u2713" : it.s === "bad" ? "\u2717" : "\u25CB") + "</span><span class=\"itxt\">" + esc(it.t) + "</span></div>";
      }
      h += "</div>";
    }
    if (g.extra) h += "<div class=\"item-row bad\"><span class=\"ic\" aria-hidden=\"true\">\u2717</span><span class=\"itxt\">" + esc(g.extra) + "</span></div>";
    if (ex.type === "terminal") {
      h += "<div class=\"canon\"><div class=\"artefact\"><div class=\"artefact-label\">Canonical command</div><div class=\"artefact-body\"><pre class=\"code\">" + codeHi(ex.canonical) + "</pre></div></div>";
      h += "<div class=\"item-rows\">";
      for (var p = 0; p < ex.parts.length; p++) h += "<div class=\"item-row ok\"><span class=\"ic\" aria-hidden=\"true\">\u2699</span><span class=\"itxt\"><b>" + esc(ex.parts[p].label) + "</b> \u2014 " + esc(ex.parts[p].desc) + "</span></div>";
      h += "</div></div>";
    }
    if (ex.persp) {
      h += "<div class=\"persp\"><div class=\"pcard red\"><div class=\"ph\">\u25B2 ATTACKER PERSPECTIVE</div>" + esc(ex.persp.red) + "</div>" +
        "<div class=\"pcard blue\"><div class=\"ph\">\u25CF DEFENDER PERSPECTIVE</div>" + esc(ex.persp.blue) + "</div></div>";
    }
    if (ex.study) h += "<div class=\"study\">\u25C6 What to study: " + esc(ex.study) + "</div>";
    h += "</div></div>";
    host.innerHTML = h;
  }
  function doNext(ex) {
    var st = EX_STATE[ex.id];
    autoPauseEnd();
    if (st.inReview) { openReview(); return; }
    if (S.idx === S.order.length - 1) {
      var hasOpen = false;
      for (var i = 0; i < S.skipped.length; i++) { if (!S.answers[S.skipped[i]]) { hasOpen = true; break; } }
      if (hasOpen) { openReview(); return; }
      setTimerState("ENDED");
      showResults();
      return;
    }
    advance();
  }
  function skip() {
    var ex = curEx();
    S.skipped.push(ex.id);
    advance();
  }
  function hint() {
    var ex = curEx();
    var st = EX_STATE[ex.id];
    if (st.hinted || st.checked) return;
    st.hinted = true;
    mountHint(ex);
    $("btnHint").disabled = true;
  }
  function mountHint(ex) {
    var st = EX_STATE[ex.id];
    if (!st || !st.hinted || st.checked) return;
    if ($("hintBox")) return;
    var box = document.createElement("div");
    box.className = "hintbox";
    box.id = "hintBox";
    box.innerHTML = "<div class=\"hint-h\"><span aria-hidden=\"true\">\u25CB</span> HINT (\u221210% of this exercise's credit)</div>" + esc(ex.hint);
    var host = $("ansArea");
    if (host) host.insertBefore(box, host.firstChild);
  }
  function manualPause() {
    if (S.timer.state === "ENDED") return;
    if (S.timer.state === "PAUSED_MANUAL") return;
    S.timer._manualPrev = S.timer.state;
    if (S.timer.state === "PAUSED_AUTO_CHECK" && S.timer._autoStart) { S.timer.autoPauseSec += Math.round((Date.now() - S.timer._autoStart) / 1000); S.timer._autoStart = null; }
    S.timer.state = "PAUSED_MANUAL";
    S.timer._manualStart = Date.now();
    setTimerState("PAUSED_MANUAL");
    var m = $("pausemask");
    m.classList.remove("hidden");
    m.innerHTML = "<div class=\"pi\" aria-hidden=\"true\">\u23F8</div><div class=\"pt\">\u23F8 PAUSED \u2014 manual (press Resume)</div><div class=\"ps\">The timer is stopped and the exercise is hidden so you cannot read it while on break. Press Resume to continue where you were.</div><button class=\"btn primary\" id=\"btnResume\" type=\"button\">\u25B6 Resume</button>";
    $("btnResume").addEventListener("click", resumeManual);
  }
  function resumeManual() {
    var m = $("pausemask");
    m.classList.add("hidden");
    if (S.timer._manualStart) { S.timer.manualPauseSec += Math.round((Date.now() - S.timer._manualStart) / 1000); S.timer._manualStart = null; }
    if (S.timer._manualPrev === "PAUSED_AUTO_CHECK") {
      S.timer.state = "PAUSED_AUTO_CHECK";
      S.timer._autoStart = Date.now();
      setTimerState("PAUSED_AUTO_CHECK");
    } else {
      S.timer.state = "RUNNING";
      setTimerState("RUNNING");
    }
  }

  /* ---------- review skipped ---------- */
  function openReview() {
    S.phase = "review";
    autoPauseEnd();
    setTimerState("RUNNING");
    $("exam").classList.add("hidden");
    $("review").classList.remove("hidden");
    var timeUp = S.timer.remaining <= 0 || S.timer.state === "ENDED";
    var h = "<div class=\"card\"><h2 style=\"margin:0 0 6px\"><span aria-hidden=\"true\">\u26A0</span> Review skipped exercises</h2>";
    h += "<p style=\"color:var(--text-secondary)\">These exercises were skipped. You can go back and answer as many times as you want until the timer ends. If you submit now, skipped-and-never-answered exercises are excluded from the score.</p><div class=\"rev-list\">";
    for (var i = 0; i < S.skipped.length; i++) {
      var e = null;
      for (var k = 0; k < S.order.length; k++) { if (DATA.exercises[S.order[k]].id === S.skipped[i]) { e = DATA.exercises[S.order[k]]; break; } }
      var answered = S.answers[e.id] ? true : false;
      h += "<div class=\"rev-row\"><span class=\"tag\">\u26A0 " + (answered ? "Answered" : "Skipped") + "</span><span style=\"flex:1\">" + esc(e.summary) + "</span>" +
        "<button class=\"btn green\" data-review=\"" + S.skipped[i] + "\" type=\"button\"" + (timeUp && !answered ? " disabled" : "") + ">Answer</button></div>";
    }
    h += "</div><div class=\"startrow\"><button class=\"btn primary\" id=\"btnFinalSubmit\" type=\"button\">\u2713 Final Submit \u2192 results</button></div></div>";
    $("review").innerHTML = h;
    $("review").querySelectorAll("button[data-review]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-review");
        var idx = -1;
        for (var k2 = 0; k2 < S.order.length; k2++) { if (DATA.exercises[S.order[k2]].id === id) { idx = k2; break; } }
        S.idx = idx;
        S.phase = "exam";
        $("review").classList.add("hidden");
        $("exam").classList.remove("hidden");
        var ex2 = DATA.exercises[S.order[idx]];
        var already = S.answers[ex2.id] ? true : false;
        S.answers[ex2.id] = undefined;
        S.answeredCount = 0; S.creditSum = 0;
        for (var kk = 0; kk < S.order.length; kk++) {
          var ee = DATA.exercises[S.order[kk]];
          if (S.answers[ee.id]) { S.answeredCount += 1; S.creditSum += S.answers[ee.id].credit; }
        }
        var st = EX_STATE[ex2.id];
        if (already) {
          st.checked = false; delete st.g; delete st.finalCredit;
          if (st.termTimer) { clearInterval(st.termTimer); st.termTimer = null; }
          if (ex2.timeLimit) st.termLeft = ex2.timeLimit;
        }
        renderExercise(ex2, true);
        updateHeader();
        window.scrollTo(0, 0);
      });
    });
    $("btnFinalSubmit").addEventListener("click", function () {
      setTimerState("ENDED");
      showResults();
    });
  }

  /* ---------- results ---------- */
  function showResults() {
    S.phase = "results";
    if (S.timer._manualStart) { S.timer.manualPauseSec += Math.round((Date.now() - S.timer._manualStart) / 1000); S.timer._manualStart = null; }
    if (S.timer._autoStart) { S.timer.autoPauseSec += Math.round((Date.now() - S.timer._autoStart) / 1000); S.timer._autoStart = null; }
    $("exam").classList.add("hidden");
    $("review").classList.add("hidden");
    $("pausemask").classList.add("hidden");
    var answered = [], full = 0, part = 0, zero = 0, partSum = 0;
    for (var k = 0; k < S.order.length; k++) {
      var ex = DATA.exercises[S.order[k]];
      var a = S.answers[ex.id];
      if (a) {
        answered.push(a);
        if (a.credit >= 1) full++;
        else if (a.credit > 0) { part++; partSum += a.credit; }
        else zero++;
      }
    }
    var excluded = S.order.length - answered.length;
    var percent = answered.length > 0 ? Math.round((S.creditSum / answered.length) * 100) : 0;
    var passed = percent >= META.passMark;
    var avgPart = part > 0 ? Math.round((partSum / part) * 100) / 100 : 0;
    var h = "";
    h += "<div class=\"card\" style=\"text-align:center\"><div class=\"bigpct\">" + percent + "%</div>";
    h += "<div style=\"color:var(--text-secondary)\">Total score <b style=\"color:var(--text-primary)\">" + r1(S.creditSum) + " / " + answered.length + "</b> (answered exercises only \u2014 skipped-and-never-answered are excluded) \u2014 pass mark " + META.passMark + "%</div></div>";
    h += "<div class=\"verdict " + (passed ? "pass" : "fail") + "\"><span aria-hidden=\"true\">" + (passed ? "\u2713" : "\u2717") + "</span> " + (passed ? "\u2713 PASS \u2014 certification-style result: well done." : "\u2717 FAIL \u2014 you must retake this exam to reach " + META.passMark + "%.") + "</div>";
    h += "<div class=\"res-grid\">";
    h += "<div class=\"res-cell ok\"><div class=\"rc-h\">\u2713 Fully correct</div><div class=\"rc-v\">" + full + "</div></div>";
    h += "<div class=\"res-cell part\"><div class=\"rc-h\">\u2713 Partially correct (avg " + avgPart + ")</div><div class=\"rc-v\">" + part + "</div></div>";
    h += "<div class=\"res-cell bad\"><div class=\"rc-h\">\u2717 Fully incorrect</div><div class=\"rc-v\">" + zero + "</div></div>";
    h += "<div class=\"res-cell skip\"><div class=\"rc-h\">\u26A0 Skipped \u2014 excluded</div><div class=\"rc-v\">" + excluded + "</div></div>";
    h += "</div>";
    h += "<div class=\"card\"><div class=\"pauselog\">\u23F8 Time paused manually: <b>" + fmtDur(S.timer.manualPauseSec) + "</b> \u2014 \u23F8 Time paused reviewing feedback: <b>" + fmtDur(S.timer.autoPauseSec) + "</b> \u2014 time remaining at submit: <b>" + fmtTime(S.timer.remaining) + "</b></div></div>";
    h += "<div class=\"card\"><div style=\"font-weight:700;margin-bottom:6px\">Per-exercise results</div><div class=\"item-rows\">";
    for (var k2 = 0; k2 < S.order.length; k2++) {
      var ex2 = DATA.exercises[S.order[k2]];
      var a2 = S.answers[ex2.id];
      if (!a2) h += "<div class=\"item-row miss\"><span class=\"ic\" aria-hidden=\"true\">\u26A0</span><span class=\"itxt\">\u26A0 Skipped \u2014 excluded: " + esc(ex2.summary) + "</span></div>";
      else {
        var cls2 = a2.credit >= 1 ? "ok" : (a2.credit > 0 ? "part" : "bad");
        var ic2 = a2.credit >= 1 ? "\u2713" : (a2.credit > 0 ? "\u2713" : "\u2717");
        var col = a2.credit >= 1 ? "var(--state-correct)" : (a2.credit > 0 ? "var(--state-partial)" : "var(--state-incorrect)");
        h += "<div class=\"item-row " + cls2 + "\"><span class=\"ic\" aria-hidden=\"true\" style=\"color:" + col + "\">" + ic2 + "</span><span class=\"itxt\">credit " + (Math.round(a2.credit * 100) / 100) + " \u2014 " + esc(ex2.summary) + "</span></div>";
      }
    }
    h += "</div></div>";
    h += "<div class=\"startrow\" style=\"justify-content:center\"><button class=\"startbtn\" id=\"btnRetake\" type=\"button\">\u21BA Retake Exam</button></div>";
    $("results").innerHTML = h;
    $("results").classList.remove("hidden");
    reportScore(S.creditSum, answered.length, percent, passed);
    $("btnRetake").addEventListener("click", function () {
      S.attempt += 1;
      startExam();
    });
  }
  function reportScore(creditSum, answeredCount, percent, passed) {
    if (S.reportedThisAttempt) return;
    S.reportedThisAttempt = true;
    try {
      parent.postMessage({
        type: "CYBERPULSE_SCORE",
        topicId: META.topicId,
        batch: META.batch,
        score: Math.round(creditSum),
        total: answeredCount,
        percent: percent,
        passed: passed
      }, location.origin);
    } catch (e) { /* opened directly - nothing to report to */ }
  }

  /* ---------- handshake & init ---------- */
  window.addEventListener("message", function (event) {
    if (!event.data) return;
    if (event.data.type !== "CYBERPULSE_INIT" && event.data.type !== "CYBERMASTERY_INIT") return;
    /* consumed: username, country, locale, topicId, batch. theme is always dark; the file is dark-only, no toggle. */
    S.handshake = { username: event.data.username || "", country: event.data.country || "", locale: event.data.locale || "en" };
  });
  function init() {
    var metaEl = document.getElementById("cm-exercise-meta");
    var dataEl = document.getElementById("cm-exam-data");
    META = JSON.parse(metaEl.textContent);
    DATA = JSON.parse(dataEl.textContent);
    S = { phase: "intro", attempt: 1, reportedThisAttempt: false, order: [], creditSum: 0, answeredCount: 0, answers: {}, skipped: [], timer: { remaining: META.timerBudget, state: "RUNNING", manualPauseSec: 0, autoPauseSec: 0 } };
    document.title = META.objectId + " \u2014 " + META.severity + " practice exam";
    renderIntro();
    startTicks();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
</body>
</html>
