<script>
var DATA = {"meta":{"topicId":"t1195.003","batch":1,"title":"T1195.003 Compromise Hardware Supply Chain — EASY","difficulty":"easy","questionCount":15,"estimatedMinutes":20,"passMark":70},"severity":"EASY","timerBudget":1200,"intro":{"learn":["You will learn about <b>T1195.003 &mdash; Compromise Hardware Supply Chain</b>. Imagine you buy a new firewall, a server, or a printer. Before it reaches your office, the box travels through factories, warehouses, and delivery vans. An attacker can open the box on that journey, change the device&rsquo;s <b>firmware</b> (the small built-in program that starts the device), and close it again. When you plug the device in, the attacker&rsquo;s code starts before your operating system. That is what this technique describes.","This is a <b>Sub-Technique</b> in the MITRE ATT&amp;CK framework. It lives under the parent technique <b>T1195 Supply Chain Compromise</b>, and it belongs to the <b>Initial Access</b> tactic (TA0001) &mdash; the phase where an attacker first gets a foothold. Its two siblings are T1195.001 (tampering with software dependencies and development tools) and T1195.002 (tampering with software products and update channels). T1195.003 is the hardware and firmware version of the family.","In a real work environment this object is used by many roles. A <b>SOC analyst</b> (the person watching security alerts) looks at boot and firmware telemetry. A <b>procurement officer</b> checks seals, serial numbers, and delivery chains when hardware arrives. An <b>incident responder</b> handles the worst case: a device that was already tampered with. A <b>detection engineer</b> builds alerts from boot logs and firmware version baselines. A <b>GRC analyst</b> (governance, risk and compliance) writes supplier rules. A <b>red teamer</b> may simulate the attack to test the checks.","The risk it addresses is serious: a hardware implant is very hard to see, because it runs <b>below</b> the operating system, where normal antivirus tools do not look. It can survive a Windows reinstall, and it can give the attacker a strong, quiet way into your network. The ATT&amp;CK page lists servers, workstations, network infrastructure, and peripherals as devices that can carry such a backdoor."],"themes":[{"name":"The attack idea","items":["supply chain","hardware implant","firmware","backdoor","shipment interdiction","servers, workstations, network devices, peripherals"]},{"name":"ATT&CK position","items":["T1195.003","sub-technique of T1195","siblings T1195.001 and T1195.002","Initial Access (TA0001)","platforms: Linux, Windows, macOS"]},{"name":"Spotting it","items":["firmware version drift","Secure Boot state","serial and asset records","boot logs"]},{"name":"Basic defenses","items":["vendor firmware baselines","checksums (hashes)","TPM (a small trust chip)","procurement intake checks"]},{"name":"Who uses this at work","items":["SOC analyst","procurement officer","incident responder","detection engineer","GRC analyst","threat intel analyst"]}],"types":"single-choice questions, matching, drag & drop sorting, ordering, word blanks, log line selection, one guided terminal command, and a short 2-step scenario"},"exercises":[{"id":"e1","type":"mcq","title":"Object type","summary":"T1195.003 &mdash; what kind of ATT&CK object is this?","scen":[{"t":"p","x":"A colleague sends you a note: &ldquo;I found <span class='mono' style='padding:1px 5px'>T1195.003</span> in a threat report. What exactly is this thing in ATT&amp;CK?&rdquo;"}],"q":"Which one describes T1195.003 correctly?","options":[{"id":"a","x":"A tactic &mdash; a big phase of an attack","why":"A tactic is a phase like Initial Access. T1195.003 is not a phase; it is one named behaviour inside a phase."},{"id":"b","x":"A sub-technique of the technique T1195","why":"Correct. T1195 is Supply Chain Compromise, and T1195.003 is its hardware sub-technique."},{"id":"c","x":"A mitigation &mdash; a defence you can deploy","why":"Mitigations have M-numbers, like M1046. T1195.003 starts with T, so it describes attacker behaviour, not a defence."},{"id":"d","x":"A threat actor group","why":"Groups have G-numbers, like G0007. T1195.003 describes what attackers do, not who they are."}],"correct":"b","hint":"Look at the shape of the ID: a T-number with a dot and three digits is one specific behaviour under a parent technique.","expl":"T1195.003 is a <b>sub-technique</b>. The parent technique T1195 (Supply Chain Compromise) has three children: .001 for software dependencies and development tools, .002 for software products and update channels, and .003 for hardware. Learning the object type first makes every later ATT&amp;CK conversation easier.","study":"Open the ATT&amp;CK matrix and trace T1195.003 up to its parent T1195 and its tactic Initial Access."},{"id":"e2","type":"mcq","title":"Tactic placement","summary":"Which tactic does T1195.003 belong to?","scen":[{"t":"mono","label":"ATT&CK EXCERPT — T1195.003","x":"ID: <span class='kw'>T1195.003</span> &nbsp; Sub-technique of: <span class='kw'>T1195</span>\nTactic: <span class='wn'>?</span>\nPlatforms: Linux, Windows, macOS"}],"q":"Which tactic is T1195.003 mapped to?","options":[{"id":"a","x":"Initial Access (TA0001)","why":"Correct. A tampered device is often the very first way the attacker gets into the network."},{"id":"b","x":"Execution (TA0002)","why":"Execution is about running attacker code on a system you already touch. Here the compromise happens before the buyer even receives the device."},{"id":"c","x":"Persistence (TA0003)","why":"Persistence is about staying inside after entry. The implant may persist, but the technique is placed where the attacker first gets in."},{"id":"d","x":"Reconnaissance (TA0043)","why":"Reconnaissance is gathering information, not tampering with products."}],"correct":"a","hint":"Ask yourself: at what moment does the attacker gain the foothold &mdash; before or after the victim is already inside their own network?","expl":"T1195.003 belongs to <b>Initial Access (TA0001)</b>. The victim organisation is compromised the moment it receives and starts the tampered device, so this is the attacker&rsquo;s way in. The implant may later help with persistence, but the technique itself is mapped to Initial Access.","study":"Read the tactic page for Initial Access and find the other supply-chain technique T1195 there."},{"id":"e3","type":"match","title":"The T1195 family","summary":"Match each T1195 sub-technique to its target","scen":[{"t":"p","x":"The Supply Chain Compromise family (T1195) has three sub-techniques. Each one targets a different link in the chain between the maker and the buyer."}],"q":"Match each sub-technique to what it attacks.","lefts":[{"id":"l1","x":"T1195.003","short":"T1195.003"},{"id":"l2","x":"T1195.001","short":"T1195.001"},{"id":"l3","x":"T1195.002","short":"T1195.002"}],"rights":[{"id":"r1","x":"Hardware and firmware of devices, before delivery"},{"id":"r2","x":"Software dependencies and development tools"},{"id":"r3","x":"Software products and their update channels"}],"correct":{"l1":"r1","l2":"r2","l3":"r3"},"why":{"l1":"Correct. T1195.003 is the hardware sub-technique: chips, firmware, whole devices tampered with before the buyer receives them.","l2":"Correct. T1195.001 attacks the building blocks of software: public packages (npm, PyPI) and the tools developers use.","l3":"Correct. T1195.002 attacks the finished software product or the channel that delivers its updates."},"hint":"The dot-number order follows the chain: code ingredients first (.001), finished software second (.002), physical hardware third (.003).","expl":"The three siblings split the supply chain into three attack surfaces: <b>.001</b> software ingredients and developer tools, <b>.002</b> the software product and its delivery channel, <b>.003</b> the physical device and its firmware. Knowing which sibling you face tells you which team must respond: AppSec for .001, IT for .002, and hardware procurement plus firmware security for .003.","study":"Compare the description text of T1195.001, T1195.002 and T1195.003 on attack.mitre.org (no link needed &mdash; the numbers are enough to look up)."},{"id":"e4","type":"mcq","title":"Plain words: supply chain","summary":"What does &ldquo;supply chain&rdquo; mean here?","scen":[{"t":"p","x":"A trainee asks you: &ldquo;Everyone says &lsquo;supply chain attack&rsquo;. In plain words, what is the chain?&rdquo;"}],"q":"Which answer explains it in the simplest correct way?","options":[{"id":"a","x":"The chain of cafeterias that feed the security team","why":"That is a joke reading of the word. In security it is about how products travel from maker to buyer."},{"id":"b","x":"The path a product takes from the factory to the buyer","why":"Correct. Factories, logistics, warehouses, distributors, and delivery are all links an attacker can touch."},{"id":"c","x":"The list of passwords stored in a password manager","why":"Password storage has nothing to do with the supply chain."},{"id":"d","x":"The network cables that connect two offices","why":"Network cabling is not the meaning here. The word is about product delivery, not about cables."}],"correct":"b","hint":"Think about every hand a boxed device changes on its way to your office door.","expl":"A <b>supply chain</b> is the whole journey of a product: design, factory, logistics, distributor, delivery, and finally the buyer. Every hand it passes is a place where an attacker with access can tamper with it. ATT&amp;CK&rsquo;s parent technique T1195 even lists &ldquo;shipment interdiction&rdquo; (stopping and changing a shipment) as one of the ways.","study":"Sketch the journey of one laptop from factory to desk and mark where tampering could happen."},{"id":"e5","type":"categorize","title":"Which family does it belong to?","summary":"Sort four events into the right T1195 sub-technique &mdash; or &ldquo;not supply chain&rdquo;","scen":[{"t":"p","x":"Four events landed in the weekly report. Sort each event into the correct bucket. Every bucket gets exactly one event."}],"q":"Drag each event to the bucket that fits it best.","slots":[{"id":"s1","label":"T1195.003 — hardware / firmware","why":"Correct: the switch firmware was changed before delivery, which is exactly the hardware supply chain sub-technique."},{"id":"s2","label":"T1195.001 — dependencies / dev tools","why":"Correct: a fake npm package poisons the software ingredients developers install."},{"id":"s3","label":"T1195.002 — software / updates","why":"Correct: the finished product&rsquo;s update file was replaced, which is the software supply chain sub-technique."},{"id":"s4","label":"Not a supply chain attack","why":"Correct: a phishing email is a classic social-engineering entry, not product tampering."}],"items":[{"id":"i1","x":"A new switch arrives with its firmware version changed from the factory build"},{"id":"i2","x":"A malicious look-alike npm package is published to trick developers"},{"id":"i3","x":"A vendor&rsquo;s update file is replaced on their download server"},{"id":"i4","x":"An email pretends to be from the CEO and asks for a payment"}],"correct":{"i1":"s1","i2":"s2","i3":"s3","i4":"s4"},"hint":"Ask for each event: what was touched &mdash; hardware before delivery, code ingredients, the finished software, or a person?","expl":"<b>Attacker view:</b> each sibling is a different route in &mdash; hardware, ingredients, product, or people. <b>Defender view:</b> the route decides which control helps: intake inspection for hardware, package scanning for dependencies, update verification for products, and user awareness for phishing.","study":"Re-read the descriptions of the three T1195 sub-techniques until you can sort any event into one of the three buckets."},{"id":"e6","type":"order","title":"The journey of an implant","summary":"Put the three steps of a hardware implant attack in order","scen":[{"t":"p","x":"A training poster shows a hardware implant attack as three pictures, but the pictures were shuffled when the poster was printed."}],"q":"Put the three steps in the order they really happen.","items":[{"id":"o1","x":"The device is tampered with at the factory or during shipping"},{"id":"o2","x":"The buyer receives the device and powers it on"},{"id":"o3","x":"The implant runs before the operating system and calls the attacker"}],"correctOrder":["o1","o2","o3"],"why":{"o1":"Correct as step 1: the tampering always happens <b>before</b> delivery &mdash; that is what makes it a supply chain attack.","o2":"Correct as step 2: the victim receives the device. Nothing looks wrong: the box is closed and the device boots normally.","o3":"Correct as step 3: the implant starts from firmware, before the OS, and then reaches out to the attacker."},"hint":"One step happens at the attacker&rsquo;s side, one happens in the mail room, one happens inside the device at power-on.","expl":"<b>Attacker view:</b> the beauty of this technique, from the attacker&rsquo;s side, is that step 1 happens far away from any defence the victim controls. <b>Defender view:</b> that is also why intake inspection (step 2) and firmware baselines (step 3) are the two best windows to catch it.","study":"Explain the three steps to a colleague in under one minute, without notes."},{"id":"e7","type":"mcq","title":"Why attackers like implants","summary":"What makes a hardware implant attractive to an attacker?","scen":[{"t":"p","x":"During a purple-team session, a junior tester asks: &ldquo;Why would anyone go through the trouble of tampering with hardware? Software seems so much easier.&rdquo;"}],"q":"What is the main reason an attacker picks a hardware implant?","options":[{"id":"a","x":"It removes the need to write any code at all","why":"False: implants still need code, often more, because they live in firmware."},{"id":"b","x":"It runs below the operating system, where antivirus tools do not look","why":"Correct: the implant starts before the OS, so endpoint tools simply are not running yet when it acts."},{"id":"c","x":"It makes password guessing much easier","why":"Password guessing is unrelated to the implant&rsquo;s main advantage."},{"id":"d","x":"It always crashes the device so admins reinstall it","why":"A crashing implant would be a bad implant &mdash; attackers want the device to look normal."}],"correct":"b","hint":"Think about the order things start when you press the power button: chip first, firmware second, operating system third, antivirus last.","expl":"<b>Attacker view:</b> the implant starts <b>before</b> the operating system, so it can hide from every tool that only starts later. It can also survive a disk wipe or OS reinstall because it lives in the chip. <b>Defender view:</b> this is exactly why boot integrity checks (M1046) matter &mdash; they watch the earliest stage instead of the last one.","study":"Look up mitigation M1046 Boot Integrity and read its four implementation measures."},{"id":"e8","type":"logsel","title":"Asset register check","summary":"One asset record does not add up","scen":[{"t":"mono","label":"ARTEFACT 1 — INTAKE ASSET REGISTER (excerpt)","x":"<span class='dm'>#  | asset        | model        | serial     | note</span>\n1  | switch-01    | NX-2200      | 2108-A4-01 | received dock 2, seals intact\n2  | switch-02    | NX-2200      | 2108-A4-02 | received dock 2, seals intact\n3  | server-07    | SR-640       | 5511-B2-07 | received dock 1, seals intact\n4  | server-09    | SR-640       | <span class='er'>2108-A4-09</span> | received dock 1, seals intact\n5  | printer-03   | PR-L420      | 9033-C1-03 | received dock 3, seals intact\n6  | laptop-14    | LT-740       | 7742-D9-14 | received dock 3, seals intact"}],"q":"Click the one register line that does not add up, then press Check.","lines":[{"id":1,"x":"1  switch-01   NX-2200   2108-A4-01   received dock 2, seals intact"},{"id":2,"x":"2  switch-02   NX-2200   2108-A4-02   received dock 2, seals intact"},{"id":3,"x":"3  server-07   SR-640    5511-B2-07   received dock 1, seals intact"},{"id":4,"x":"4  server-09   SR-640    2108-A4-09   received dock 1, seals intact"},{"id":5,"x":"5  printer-03  PR-L420   9033-C1-03   received dock 3, seals intact"},{"id":6,"x":"6  laptop-14   LT-740    7742-D9-14   received dock 3, seals intact"}],"correct":[4],"why":{"4":"Correct: the serial prefix 2108-A4 matches the <b>switch</b> batch, not the SR-640 <b>server</b> batch (which should look like 5511-B2). A serial that belongs to another product line is a classic intake red flag.","1":"This line is consistent: an NX-2200 switch with a 2108-A4 serial is normal.","2":"This line is consistent too: same model, same batch prefix, next number.","3":"This line is consistent: an SR-640 server with a 5511-B2 serial fits its product line.","5":"This line is consistent: the printer has its own serial scheme.","6":"This line is consistent: the laptop has its own serial scheme."},"hint":"Compare the serial prefixes: every model family has its own pattern. One line mixes two patterns.","expl":"A serial number that follows a <b>different product&rsquo;s pattern</b> is a strong intake red flag for T1195.003-style tampering or counterfeiting: it suggests the unit (or its label) did not come from the normal factory line. Intake staff who compare serial formats catch this in minutes. The ATT&amp;CK page lists network infrastructure, servers, workstations and peripherals &mdash; all of them should get this check.","study":"Ask your asset team where serial patterns per model family are documented, and make it an intake step."},{"id":"e9","type":"fill","title":"SOC handover note","summary":"Complete a short SOC note with three missing words","scen":[{"t":"p","x":"A night-shift analyst wrote a handover note but three words are missing. The word bank below is shuffled."}],"q":"Fill the three blanks with words from the bank.","parts":[{"t":"x","x":"The new switch had a changed "},{"t":"b","id":"b1"},{"t":"x","x":" version. It did not match the "},{"t":"b","id":"b2"},{"t":"x","x":" list for this model, so we unplugged the "},{"t":"b","id":"b3"},{"t":"x","x":" and opened a ticket."}],"bank":["firmware","vendor","device","printer","password","coffee"],"answers":{"b1":"firmware","b2":"vendor","b3":"device"},"blankNames":{"b1":"what changed","b2":"whose list","b3":"what was unplugged"},"why":{"b1":"Correct: the thing that changed is the device&rsquo;s <b>firmware</b> &mdash; the built-in program that starts it.","b2":"Correct: the comparison is always against the <b>vendor&rsquo;s</b> published list, the only trusted source for that model.","b3":"Correct: the <b>device</b> itself is unplugged so a possible implant cannot call out."},"hint":"The three missing words are: the thing that changed, whose published list we compare with, and what got unplugged.","expl":"This tiny note is the easiest useful response to a firmware drift signal: compare the version with the <b>vendor baseline</b>, and if it does not match, <b>unplug the device</b> so it cannot beacon, then verify. &ldquo;Printer&rdquo; and &ldquo;password&rdquo; do not fit any blank &mdash; they are decoys.","study":"Write your own three-sentence version of this note for your team&rsquo;s intake process."},{"id":"e10","type":"match","title":"Who cares about this?","summary":"Match each role to the task it owns","scen":[{"t":"p","x":"T1195.003 shows up in many job descriptions. Match each role to the task that belongs to it."}],"q":"Match each role to its hardware supply chain task.","lefts":[{"id":"l1","x":"SOC analyst","short":"SOC analyst"},{"id":"l2","x":"Procurement officer","short":"Procurement"},{"id":"l3","x":"Threat intel analyst","short":"CTI analyst"}],"rights":[{"id":"r1","x":"Checks seals, serial numbers and the delivery chain at intake"},{"id":"r2","x":"Watches boot and firmware alerts on managed devices"},{"id":"r3","x":"Writes reports about actors that tamper with hardware"}],"correct":{"l1":"r2","l2":"r1","l3":"r3"},"why":{"l1":"Correct: the SOC analyst lives in the alert queue, and boot or firmware alerts are early T1195.003 signals.","l2":"Correct: procurement owns the physical moment of arrival &mdash; seals, serials, and who touched the box.","l3":"Correct: the CTI analyst turns public reports about interdiction and implants into guidance for the others."},"hint":"Two roles work before the device is powered on; one role works when it is already running.","expl":"<b>Attacker view:</b> attackers hope organisations assume &ldquo;the factory would never send us something bad&rdquo; and skip all three tasks. <b>Defender view:</b> the defence works because the three roles cover three different moments: physical arrival (procurement), first boot (SOC), and long-term context (CTI). Remove any one and a window opens.","study":"Find out who owns each of the three tasks in your own organisation &mdash; if nobody does, that is your first finding."},{"id":"e11","type":"match","title":"One event, two views","summary":"Same event, attacker view and defender view","scen":[{"t":"p","x":"One event: &ldquo;a tampered device starts for the first time in the victim&rsquo;s office&rdquo;. Two people watch it: the attacker, and the defender. Match each goal to its side."}],"q":"Match each goal to the side that holds it.","lefts":[{"id":"l1","x":"Attacker view","short":"Attacker"},{"id":"l2","x":"Defender view","short":"Defender"}],"rights":[{"id":"r1","x":"&ldquo;My chip must run before the operating system starts&rdquo;"},{"id":"r2","x":"&ldquo;I verify the whole boot chain is signed at every start&rdquo;"}],"correct":{"l1":"r1","l2":"r2"},"why":{"l1":"Correct: the attacker&rsquo;s whole plan depends on running earlier than every defensive tool &mdash; that is why firmware is the target.","l2":"Correct: the defender answers with boot integrity: signed bootloaders, TPM measurements, and alerts when the chain changes."},"hint":"One sentence says &lsquo;before the OS&rsquo; &mdash; that is the attacker&rsquo;s wish. The other says &lsquo;verify at every start&rsquo; &mdash; that is the counter-move.","expl":"This is the whole technique in two sentences. <b>Attacker side:</b> run before the OS, stay invisible. <b>Defender side:</b> make the boot chain verifiable so &lsquo;before the OS&rsquo; no longer means &lsquo;unwatched&rsquo;. ATT&amp;CK&rsquo;s mitigation M1046 (Boot Integrity) is exactly this counter-move, using Secure Boot and TPM attestation.","study":"Say both sentences out loud &mdash; if you can explain both sides in one breath, you understand the technique."},{"id":"e12","type":"logsel","title":"First boot log","summary":"One boot log line should worry you","scen":[{"t":"mono","label":"ARTEFACT 1 — BOOT LOG (first boot of a new workstation)","x":"<span class='dm'>[boot]</span> POST: memory check passed, 32 GB\n<span class='dm'>[boot]</span> storage: NVMe0 present\n<span class='dm'>[boot]</span> firmware: version 1.0.7 loaded\n<span class='dm'>[boot]</span> <span class='er'>Secure Boot: DISABLED (setup flag set)</span>\n<span class='dm'>[boot]</span> loader: loading OS kernel\n<span class='dm'>[boot]</span> OS: starting services"}],"q":"Click the log line that should worry you on a brand-new machine, then press Check.","lines":[{"id":1,"x":"[boot] POST: memory check passed, 32 GB"},{"id":2,"x":"[boot] storage: NVMe0 present"},{"id":3,"x":"[boot] firmware: version 1.0.7 loaded"},{"id":4,"x":"[boot] Secure Boot: DISABLED (setup flag set)"},{"id":5,"x":"[boot] loader: loading OS kernel"},{"id":6,"x":"[boot] OS: starting services"}],"correct":[4],"why":{"4":"Correct: a <b>brand-new</b> machine should never arrive with Secure Boot already disabled. Someone may have turned it off so unsigned firmware or a modified bootloader can run.","1":"A normal memory check &mdash; nothing suspicious here.","2":"A normal storage line &mdash; the disk is present, nothing more.","3":"A firmware version line is normal; you would compare the version with the vendor baseline, but by itself it is not alarming.","5":"Loading the kernel is the normal next step.","6":"Services starting is the normal end of boot."},"hint":"New machines from a trusted vendor arrive with Secure Boot ON. Ask: who turned it off, and when?","expl":"<b>Secure Boot</b> is a firmware feature that only lets signed boot software run. If it is <b>disabled on arrival</b>, either someone in your chain changed it, or the device was prepared for an unsigned implant. ATT&amp;CK&rsquo;s detection strategy DET0368 watches exactly this: secure boot state, firmware versions, and boot paths. On a healthy machine the flag stays on for its whole life.","study":"Check the Secure Boot state of three machines in your environment today &mdash; you may be surprised."},{"id":"e13","type":"terminal","title":"Verify the firmware checksum","summary":"Use sha256sum to check a downloaded firmware image","scen":[{"t":"p","x":"You downloaded <b>fw-switch-3.2.1.img</b> into the <span class='mono' style='padding:1px 5px'>vendor/</span> folder to update a switch. The vendor&rsquo;s website publishes a SHA-256 checksum for every image. Before flashing, you verify the file."},{"t":"mono","label":"ARTEFACT 1 — VENDOR DOWNLOAD PAGE (excerpt)","x":"fw-switch-3.2.1.img\nSHA-256: <span class='ok'>9f2c...e81a</span>  (compare with your local hash)"}],"q":"In the terminal below, compute the SHA-256 hash of <b>vendor/fw-switch-3.2.1.img</b> so you can compare it with the vendor&rsquo;s value.","syntax":{"shape":"sha256sum &lt;file&gt;","notes":["<span class='kw'>sha256sum</span> is a standard Linux tool. It reads a file and prints its <b>SHA-256 fingerprint</b> &mdash; a 64-character string that changes if even one bit of the file changes.","You give it the <b>path of the file</b> you want to check. It does not change the file in any way &mdash; it only reads it."],"example":"sha256sum /tmp/other-vendor-README.txt","outshape":"9f2c...e81a  vendor/fw-switch-3.2.1.img"},"canonical":"sha256sum vendor/fw-switch-3.2.1.img","canonWhy":"<span class='kw'>sha256sum</span> is the tool; <b>vendor/fw-switch-3.2.1.img</b> is the exact file the vendor published a hash for. If the printed fingerprint differs from the vendor&rsquo;s value, the file was changed somewhere between the factory and your disk &mdash; do not flash it.","parts":[{"name":"command + target","mode":"full","ok":"^(sha256sum|shasum\\s+-a\\s*256)\\s+.*fw-switch-3\\.2\\.1\\.img","bad":"md5|sha1","why":"The command must run sha256sum (or shasum -a 256) against the file fw-switch-3.2.1.img. md5 or sha1 are weaker fingerprints and are not what the vendor publishes here."}],"dangerous":["flashrom","dd\\s","rm\\s+-rf"],"outputs":[{"m":"^(sha256sum|shasum\\s+-a\\s*256)\\s+.*fw-switch-3\\.2\\.1\\.img","x":"9f2c41d0aa7be8813f6c22d5a4b7e0f19c8d3a6251bb4c7e90f2d6a381cce81a  vendor/fw-switch-3.2.1.img"},{"m":"^(sha256sum|shasum\\s+-a\\s*256)","x":"sha256sum: cannot open: no such file in this simulation"}],"hint":"The syntax panel shows the full shape: the tool name, then the file path. The path is vendor/fw-switch-3.2.1.img.","expl":"<b>Attacker view:</b> an attacker who tampers with a firmware file hopes nobody compares hashes. <b>Defender view:</b> a checksum is the cheapest possible T1195.003 defence: read the vendor&rsquo;s published SHA-256, compute yours, compare. Same value = untouched file; different value = stop and investigate. This simulation only reads the file &mdash; computing a hash never changes anything.","study":"Compute a SHA-256 hash of any file on your own machine and change one byte to see the hash change completely."},{"id":"e14","type":"mcq","title":"What is a TPM?","summary":"Explain a TPM in plain words","scen":[{"t":"p","x":"Your manager reads a vendor brochure: &ldquo;Our devices include a TPM for supply chain assurance.&rdquo; She asks you what that little chip actually does."}],"q":"Which is the best plain-words explanation of a TPM?","options":[{"id":"a","x":"A small chip that stores keys and records the boot process so changes can be detected","why":"Correct: the TPM keeps cryptographic keys and takes measurements at each boot step, so any change is provable."},{"id":"b","x":"A faster processor for antivirus software","why":"The TPM does not make anything faster; it stores secrets and measurements."},{"id":"c","x":"A backup battery for the server room","why":"Backup power is a UPS, not a TPM."},{"id":"d","x":"A second hard disk for encrypted backups","why":"Storage is not the TPM&rsquo;s job; it stores tiny keys and counters, not files."}],"correct":"a","hint":"TPM stands for Trusted Platform Module &mdash; &lsquo;trust&rsquo; and &lsquo;platform&rsquo; are the clues: it is about trusting how the machine starts.","expl":"A <b>TPM (Trusted Platform Module)</b> is a tiny security chip on the motherboard. It holds keys and, most importantly for T1195.003, it <b>records measurements</b> of each boot step (firmware, bootloader, kernel). If a hardware implant changed any step, the recorded chain no longer matches &mdash; this is called <b>attestation</b>. ATT&amp;CK&rsquo;s mitigation M1046 lists exactly this: &ldquo;Configure systems to use TPM-based attestation for boot integrity&rdquo;.","study":"Run a TPM check on one machine near you and find where attestation logs are stored."},{"id":"e15","type":"sim","title":"Receiving a new server","summary":"Two guided decisions when a boxed server arrives","scen":[{"t":"p","x":"You are on the intake team. A boxed server arrives at the loading dock. You have two decisions to make &mdash; choose well, and the server joins the network safely."}],"q":"(shown per step)","steps":[{"id":"s1","label":"Step 1","q":"The sealed box is on the dock. What is the safe first step?","options":[{"id":"o1","x":"Inspect the packaging and tamper seals before opening","correct":true,"outcome":"The seals look intact and match the shipping photos. You open the box calmly.","why":"Correct: the physical seal check is the cheapest moment to spot interdiction &mdash; before any attacker code can run."},{"id":"o2","x":"Power it on right away to save time","correct":false,"outcome":"The device boots. If something was added before delivery, it may already be active &mdash; and now it is on your network.","why":"Not correct: powering on before inspection removes your only chance to catch physical tampering."},{"id":"o3","x":"Send it straight to the user&rsquo;s desk unopened","correct":false,"outcome":"The user opens it wherever they are. Nobody records seals or serials, and any implant goes live unnoticed.","why":"Not correct: skipping intake means skipping every check this exam teaches."}]},{"id":"s2","label":"Step 2","q":"The server passed the seal check. Before joining it to the network, what do you verify?","options":[{"id":"o1","x":"Compare the firmware version with the vendor&rsquo;s published baseline","correct":true,"outcome":"The firmware version matches the vendor baseline for this model. You join it to the network with confidence.","why":"Correct: the firmware baseline comparison catches version tampering in one minute."},{"id":"o2","x":"Only test the internet speed","correct":false,"outcome":"The speed is fine &mdash; and the firmware, which you never looked at, stays unknown.","why":"Not correct: speed tells you nothing about firmware integrity."},{"id":"o3","x":"Change the default wallpaper","correct":false,"outcome":"The wallpaper is nice. The firmware check never happened.","why":"Not correct: cosmetics are not security checks."}]}],"hint":"Think like the intake checklist: outside of the box first, inside of the box second.","expl":"<b>Attacker view:</b> the attacker counts on victims plugging devices in without inspection. <b>Defender view:</b> the two-step intake &mdash; seals first, firmware baseline second &mdash; is the minimum bar for T1195.003 defence, and it costs minutes per device.","study":"Draft a two-line intake card for your loading dock: seal check, then firmware baseline check."}]};

'use strict';
/* ================= utilities ================= */
function $(s){return document.querySelector(s);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function fmtTime(s){var m=Math.floor(s/60),ss=s%60;return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;}
function fmt1(x){return (Math.round(x*10)/10).toFixed(1);}

/* ================= state ================= */
var S={
  screen:'intro', pos:0, order:[],
  credit:{}, answered:{}, status:{}, hintUsed:{}, skipped:[],
  secondsLeft:0, timerState:'IDLE', tick:null,
  manualPauseSec:0, feedbackPauseSec:0, ovStart:0, ovAccum:0, fbStart:0,
  reported:false, attempt:1,
  user:{name:'',country:'',locale:'en',topicId:'',batch:null,theme:'dark'}
};
var R=null; /* runtime state of the exercise on screen */

/* ================= scoring (partial credit) ================= */
function scoreExercise(selected,correct){
  var N=correct.length; if(N===0)return 0;
  var H=0,W=0,cs={};
  correct.forEach(function(c){cs[c]=1;});
  selected.forEach(function(x){ if(cs[x])H++; else W++; });
  return Math.max(0,(H-W)/N);
}

/* ================= timer state machine =================
   States: IDLE, RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED */
function tSet(next){
  var prev=S.timerState;
  if(prev==='PAUSED_MANUAL' && next!=='PAUSED_MANUAL'){S.manualPauseSec+=(Date.now()-S.ovStart)/1000;}
  if(prev==='PAUSED_AUTO_CHECK' && next!=='PAUSED_AUTO_CHECK'){S.feedbackPauseSec+=(Date.now()-S.fbStart-S.ovAccum)/1000;S.ovAccum=0;}
  if(next==='PAUSED_MANUAL' && prev!=='PAUSED_MANUAL'){S.ovStart=Date.now();}
  if(next==='PAUSED_AUTO_CHECK' && prev!=='PAUSED_AUTO_CHECK'){S.fbStart=Date.now();}
  S.timerState=next; updateHeader();
}
function startTimer(){
  if(S.tick)clearInterval(S.tick);
  S.tick=setInterval(function(){
    if(S.timerState!=='RUNNING')return;
    S.secondsLeft--;
    if(S.secondsLeft<=0){S.secondsLeft=0;updateHeader();timerEnd();return;}
    updateHeader();
  },1000);
  tSet('RUNNING');
}
function timerEnd(){
  if(S.tick)clearInterval(S.tick);
  tSet('ENDED');
  if(S.screen==='exam'||S.screen==='review'){showResults();}
}

/* ================= flow ================= */
function startExam(){
  document.body.setAttribute('data-sev',sevClass());
  S.pos=0;S.credit={};S.answered={};S.status={};S.hintUsed={};S.skipped=[];
  S.secondsLeft=DATA.timerBudget;S.reported=false;
  S.manualPauseSec=0;S.feedbackPauseSec=0;S.ovAccum=0;
  /* clear per-attempt shuffle caches so retakes reshuffle answers too */
  DATA.exercises.forEach(function(e){
    delete e._shuf;delete e._shufR;delete e._shufB;
    if(e.steps)e.steps.forEach(function(st){delete st._shuf;});
  });
  S.order=shuffle(DATA.exercises.map(function(_,i){return i;}));
  /* keep terminal exercises non-adjacent after shuffle */
  for(var i=1;i<S.order.length-1;i++){
    if(isTerm(S.order[i])&&isTerm(S.order[i-1])){var j=i+1;while(j<S.order.length&&(isTerm(S.order[j])&&isTerm(S.order[j-1])))j++;if(j<S.order.length){var t=S.order[i];S.order[i]=S.order[j];S.order[j]=t;}}
  }
  S.screen='exam';startTimer();renderExercise();
}
function isTerm(i){return DATA.exercises[i].type==='terminal';}
function curEx(){return DATA.exercises[S.order[S.pos]];}
function advanceOrFinish(){
  S.pos++;
  if(S.pos>=S.order.length){ if(S.skipped.length>0){renderReview();if(S.timerState!=='ENDED')tSet('RUNNING');} else {showResults();} return;}
  renderExercise();
}
function showChrome(){var h=$('#hdr');if(h)h.classList.remove('hidden');var p=$('#prog');if(p)p.classList.remove('hidden');}
function hideChrome(){var h=$('#hdr');if(h)h.classList.add('hidden');var p=$('#prog');if(p)p.classList.add('hidden');}
function onCheck(){
  if(!R||R.checked)return;
  var res=collect(R);
  var credit=scoreExercise(res.selected,res.correct);
  if(S.hintUsed[R.ex.id])credit=Math.max(0,credit-0.10);
  R.checked=true;R.credit=credit;R.res=res;
  S.credit[R.ex.id]=credit;S.answered[R.ex.id]=true;
  S.status[R.ex.id]=credit>=0.999?'correct':(credit>0?'partial':'incorrect');
  /* an answered exercise never belongs in the skipped pool, whatever path answered it */
  var k=S.skipped.indexOf(R.ex.id);if(k>-1)S.skipped.splice(k,1);
  tSet('PAUSED_AUTO_CHECK');
  lockWidget();renderFeedback();updateHeader();
}
function onNext(){
  if(!R||!R.checked)return;
  if(R.fromReview){renderReview();tSet('RUNNING');return;}
  advanceOrFinish();
  if(S.screen==='exam'&&S.timerState!=='ENDED')tSet('RUNNING');
}
function onSkip(){
  if(S.screen!=='exam'||!R||R.checked)return;
  S.status[R.ex.id]='skipped';
  if(S.skipped.indexOf(R.ex.id)<0)S.skipped.push(R.ex.id);
  advanceOrFinish();
}
function onHint(){
  if(S.screen!=='exam'||!R||R.checked||S.hintUsed[R.ex.id])return;
  S.hintUsed[R.ex.id]=true;
  var hb=$('#hintpanel');if(hb)hb.classList.remove('hidden');
  var b=$('#hintbtn');if(b)b.disabled=true;
}
function onPauseToggle(){
  if(S.screen!=='exam'&&S.screen!=='review')return;
  var ov=$('#pauseov');
  if(ov){ov.remove();if(R&&R._pausedOnAuto){R._pausedOnAuto=false;tSet('PAUSED_AUTO_CHECK');}else{tSet('RUNNING');}return;}
  var keep=R?R.stateName:null;
  if(R&&R.checked&&S.timerState==='PAUSED_AUTO_CHECK'){R._pausedOnAuto=true;}
  var o=el('div','paused-overlay');
  o.id='pauseov';
  o.innerHTML='<div class="p1">&#9208; PAUSED &mdash; manual (press Resume)</div>'+
    '<div class="p2">The exercise is hidden while you take a break. The timer is stopped.</div>';
  var b=el('button','btn primary','&#9654; Resume');
  b.addEventListener('click',function(){o.remove();if(R&&R._pausedOnAuto&&S.timerState==='PAUSED_MANUAL'){R._pausedOnAuto=false;tSet('PAUSED_AUTO_CHECK');}else{tSet('RUNNING');}});
  o.appendChild(b);
  document.body.appendChild(o);
  tSet('PAUSED_MANUAL');
}
function onSubmitAll(){
  showResults();
}

/* ================= site report ================= */
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:DATA.meta.topicId,
      batch:DATA.meta.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=DATA.meta.passMark
    },location.origin);
  }catch(e){/* opened directly; nothing to report to */}
}

/* ================= handshake ================= */
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  S.user.name=event.data.username||'';
  S.user.country=event.data.country||'';
  S.user.locale=event.data.locale||'en';
  S.user.theme=event.data.theme||'dark'; /* dark-only file: no theme switch */
  var c=$('#candname');
  if(c&&S.user.name)c.textContent='Candidate: '+S.user.name;
});

/* ================= header ================= */
function stateBadge(){
  if(S.timerState==='RUNNING')return '<span class="badge running">&#9654; RUNNING</span>';
  if(S.timerState==='PAUSED_MANUAL')return '<span class="badge paused">&#9208; PAUSED &mdash; manual (press Resume)</span>';
  if(S.timerState==='PAUSED_AUTO_CHECK')return '<span class="badge paused">&#8214; PAUSED &mdash; reviewing feedback (resumes on Next)</span>';
  if(S.timerState==='ENDED')return '<span class="badge ended">&#9632; ENDED</span>';
  return '<span class="badge ended">&#9679; READY</span>';
}
function sevClass(){return {EASY:'easy',MEDIUM:'medium',HARD:'hard','EXTREMELY HARD':'extreme'}[DATA.severity];}
function scoreSummary(){
  var sum=0,n=0;
  Object.keys(S.answered).forEach(function(k){if(S.answered[k]){sum+=S.credit[k]||0;n++;}});
  var pct=n>0?Math.round((sum/n)*100):0;
  return {sum:sum,n:n,pct:pct};
}
function answeredOrSkipped(){var c=0;DATA.exercises.forEach(function(e){if(S.answered[e.id]||S.status[e.id]==='skipped')c++;});return c;}
var HDR_KEY=null;
function updateHeader(){
  var h=$('#hdr');if(!h)return;
  var ss=scoreSummary();
  var checked=R&&R.checked;
  var key=S.screen+'|'+S.pos+'|'+S.timerState+'|'+(checked?'c':'u')+'|'+S.order.length;
  if(key!==HDR_KEY){
    HDR_KEY=key;
    var posTxt;
    if(S.screen==='exam')posTxt='Exercise '+(S.pos+1)+' of '+S.order.length;
    else if(S.screen==='review')posTxt=(R&&R.fromReview&&!checked)?'Reviewing a skipped exercise':'Review skipped exercises';
    else posTxt='&nbsp;';
    var dis=(checked||S.screen!=='exam'&&S.screen!=='review')?' disabled':'';
    h.innerHTML=
      '<div class="hcell"><b>'+posTxt+'</b></div>'+
      '<div class="hcell"><span class="badge '+sevClass()+'">'+esc(DATA.severity)+'</span></div>'+
      '<div class="hcell"><span class="mono-t" id="h-timer">&#9201; '+fmtTime(S.secondsLeft)+'</span> '+stateBadge()+'</div>'+
      '<div class="hcell">Score <span class="score-sum" id="h-score">'+(ss.n>0?fmt1(ss.sum):'0.0')+' / '+ss.n+'</span> <span class="mono-t" id="h-pct">'+ss.pct+'%</span></div>'+
      '<div class="hcell" style="margin-left:auto;display:flex;gap:8px">'+
        '<button id="hintbtn" class="btn small ghost" onclick="onHint()"'+dis+'>&#128161; Hint</button>'+
        '<button class="btn small ghost" onclick="onPauseToggle()">&#9208; Pause</button>'+
        '<button class="btn small ghost" onclick="onSkip()"'+dis+'>&#9888; Skip</button>'+
      '</div>';
  }
  var t=$('#h-timer');if(t)t.innerHTML='&#9201; '+fmtTime(S.secondsLeft);
  var sc=$('#h-score');if(sc)sc.textContent=(ss.n>0?fmt1(ss.sum):'0.0')+' / '+ss.n;
  var pc=$('#h-pct');if(pc)pc.textContent=ss.pct+'%';
  var hb=$('#hintbtn');if(hb&&!checked)hb.disabled=!!(R&&S.hintUsed[R.ex.id]);
  var p=$('#prog-in');
  if(p)p.style.width=(100*answeredOrSkipped()/DATA.exercises.length)+'%';
}

/* ================= intro screen ================= */
function renderIntro(){
  S.screen='intro';hideChrome();
  if(S.tick){clearInterval(S.tick);S.tick=null;}
  var m=DATA.meta;
  var themes=DATA.intro.themes.map(function(t){
    return '<div class="themebox"><h4>'+esc(t.name)+'</h4><ul class="kwlist">'+
      t.items.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul></div>';
  }).join('');
  var learn=DATA.intro.learn.map(function(p){return '<p>'+p+'</p>';}).join('');
  var types=DATA.intro.types;
  var app=$('#main');
  app.innerHTML=
  '<div class="intro-hero">'+
    '<h1>'+esc(m.title)+'</h1>'+
    '<div class="obj">MITRE ATT&amp;CK object: <b>T1195.003 &mdash; Supply Chain Compromise: Compromise Hardware Supply Chain</b> &middot; a <b>Sub-Technique</b> of T1195, mapped to the <b>Initial Access</b> tactic (TA0001) <span id="candname" class="tag"></span></div>'+
    '<div class="facts">'+
      '<span class="f">&#127919; Severity: <span class="badge '+sevClass()+'">'+esc(DATA.severity)+'</span></span>'+
      '<span class="f">&#128218; Exercises in this file: <b>'+DATA.exercises.length+'</b></span>'+
      '<span class="f">&#9201; Estimated time: <b>'+m.estimatedMinutes+' minutes</b> (timer budget '+fmtTime(DATA.timerBudget)+')</span>'+
      '<span class="f">&#10003; Pass mark: <b>'+m.passMark+'%</b></span>'+
    '</div>'+
  '</div>'+
  '<h2 class="sec"><span class="n">2.</span> What you will learn here</h2>'+
  '<div class="card">'+learn+'</div>'+
  '<h2 class="sec"><span class="n">3.</span> Keywords covered in this exam</h2>'+
  '<div class="card">'+themes+'</div>'+
  '<h2 class="sec"><span class="n">4.</span> How this exam works</h2>'+
  '<div class="card"><ul class="rules">'+
    '<li><b>Passing score: '+m.passMark+'%.</b> Your final percentage is computed only over exercises you actually answered. PASS means you master this batch at this level; FAIL means you should retake it.</li>'+
    '<li><b>Exercise types in this file:</b> '+esc(types)+'</li>'+
    '<li><b>Timer:</b> a countdown runs for '+fmtTime(DATA.timerBudget)+'. You can press <b>Pause</b> for a real break: the timer stops and the exercise is hidden until you press Resume. When you press <b>Check</b>, the timer stops automatically too: you get unlimited time to read the feedback. The timer starts again only when you press <b>Next</b>.</li>'+
    '<li><b>Partial credit:</b> exercises with several correct items give a fraction of the point: <span class="mono">credit = max(0, (H &minus; W) / N)</span>. Correct items add, wrong items subtract, so guessing everything gives zero.</li>'+
    '<li><b>Hint:</b> one hint per exercise. It shows a nudge, never the answer, and costs 10% of that exercise&rsquo;s credit.</li>'+
    '<li><b>Skip:</b> every exercise has a Skip button. Skipped exercises go to a review pool before you finish, and you can go back and answer them while the timer runs. If a skipped exercise is never answered, it is excluded from the score.</li>'+
  '</ul>'+
  '<div class="startrow"><button class="btn primary startbtn" onclick="startExam()">&#9654; Start the exam</button></div>'+
  '</div>';
  window.scrollTo(0,0);
}

/* ================= review-skipped screen ================= */
function renderReview(){
  S.screen='review';showChrome();updateHeader();
  var rows=S.skipped.map(function(id){
    var ex=DATA.exercises.filter(function(e){return e.id===id;})[0];
    return '<div class="card" style="display:flex;align-items:center;gap:14px">'+
      '<span class="badge skip">&#9888; Skipped</span>'+
      '<div style="flex:1"><b>'+esc(ex.title)+'</b><div class="smallnote">'+esc(ex.summary)+'</div></div>'+
      '<button class="btn primary" onclick="answerSkipped(\''+id+'\')">&#9998; Answer</button></div>';
  }).join('');
  $('#main').innerHTML=
    '<h2 class="sec"><span class="n">&#9888;</span> Review skipped exercises</h2>'+
    '<div class="card"><p>You skipped '+S.skipped.length+' exercise(s). You can answer them now &mdash; as many times as you need &mdash; while the timer still runs. If you finish without answering them, they are <b>excluded</b> from the score.</p>'+rows+
    '<div class="startrow"><button class="btn green" onclick="onSubmitAll()">&#10003; Finish and show results</button></div></div>';
  window.scrollTo(0,0);
}
function answerSkipped(id){
  var i=-1;DATA.exercises.forEach(function(e,k){if(e.id===id)i=k;});
  S.pos=S.order.indexOf(i);
  renderExercise(i,true);
}

/* ================= results screen ================= */
function showResults(){
  S.screen='results';showChrome();updateHeader();
  if(S.tick)clearInterval(S.tick);
  if(S.timerState!=='ENDED')tSet('ENDED');
  var sum=0,n=0,full=0,part=0,partSum=0,zero=0,skipped=0;
  DATA.exercises.forEach(function(e){
    if(S.answered[e.id]){
      n++;var c=S.credit[e.id]||0;sum+=c;
      if(c>=0.999)full++;else if(c>0){part++;partSum+=c;}else zero++;
    }
  });
  skipped=DATA.exercises.length-n; /* every unanswered exercise (skipped or cut off by the timer) is excluded from the score */
  var pct=n>0?Math.round((sum/n)*100):0;
  var passed=pct>=DATA.meta.passMark;
  if(!S.reported){S.reported=true;reportScore(sum,n);}
  var avg=part>0?(Math.round((partSum/part)*100)/100):0;
  var cand=S.user.name?('<div class="smallnote" style="margin-top:8px">Candidate: '+esc(S.user.name)+'</div>'):'';
  var panel=passed?
    ('<div class="passpanel"><div style="font-size:34px">&#127942;</div><h2 style="margin:6px 0">&#10003; PASS &mdash; certificate earned</h2>'+
     '<p style="max-width:640px;margin:8px auto">You reached '+pct+'% on this '+esc(DATA.severity)+' exam for <b>T1195.003 &mdash; Compromise Hardware Supply Chain</b>. You can now read real hardware supply-chain reports and recognise this technique in your own telemetry.</p>'+cand+'</div>'):
    ('<div class="failpanel"><div style="font-size:34px">&#128542;</div><h2 style="margin:6px 0">&#10007; FAIL &mdash; retake required</h2>'+
     '<p style="max-width:640px;margin:8px auto">You reached '+pct+'%, below the '+DATA.meta.passMark+'% pass mark. Read the feedback from each exercise again, then press Retake. The exercises and answers will be shuffled.</p>'+cand+'</div>');
  var pauseInfo='<p class="smallnote" style="text-align:center">Time paused manually: <b>'+fmtTime(Math.round(S.manualPauseSec))+'</b> &middot; Time spent reviewing feedback (auto-pause): <b>'+fmtTime(Math.round(S.feedbackPauseSec))+'</b></p>';
  $('#main').innerHTML=
    '<div class="res-hero"><div class="smallnote">'+esc(DATA.meta.title)+' &middot; attempt '+S.attempt+'</div>'+
    '<div class="big" style="color:'+(passed?'var(--state-correct)':'var(--state-incorrect)')+'">'+fmt1(sum)+' / '+n+'</div>'+
    '<div class="pct">final score '+pct+'% &middot; pass mark '+DATA.meta.passMark+'%</div></div>'+
    panel+
    '<div class="resgrid">'+
      '<div class="rescell ok"><div class="num">'+full+'</div><div class="lbl">&#10003; Fully correct</div></div>'+
      '<div class="rescell part"><div class="num">'+part+'</div><div class="lbl">&#10003; Partially correct'+(part>0?' (avg '+avg+')':'')+'</div></div>'+
      '<div class="rescell bad"><div class="num">'+zero+'</div><div class="lbl">&#10007; Fully incorrect</div></div>'+
      '<div class="rescell skip"><div class="num">'+skipped+'</div><div class="lbl">&#9888; Skipped &mdash; excluded</div></div>'+
    '</div>'+
    pauseInfo+
    '<div class="startrow" style="gap:14px">'+
      '<button class="btn primary startbtn" onclick="retake()">&#8635; Retake exam</button>'+
      '<button class="btn ghost" onclick="renderIntro()">&#8962; Back to intro</button>'+
    '</div>';
  window.scrollTo(0,0);
}
function retake(){
  S.attempt++;S.reported=false;
  startExam();
}


/* ================= exercise rendering ================= */
function blockHeader(cls,icon,word,extra){
  return '<div class="bh '+cls+'">'+icon+' '+word+(extra||'')+'</div>';
}
function artefactHtml(a,idx){
  if(a.t==='p')return '<p>'+a.x+'</p>';
  if(a.t==='mono')return '<div class="arte"><span class="arte-label">'+esc(a.label)+'</span><div class="arte-body mono">'+a.x+'</div></div>';
  return '';
}
function renderExercise(idx,fromReview){
  var exIdx=(idx!==undefined)?idx:S.order[S.pos];
  var ex=DATA.exercises[exIdx];
  R={ex:ex,checked:false,credit:0,fromReview:!!fromReview,sel:null};
  showChrome();
  if(S.timerState==='ENDED'){showResults();return;}
  var scen=ex.scen.map(artefactHtml).join('');
  var app=$('#main');
  app.innerHTML=
    '<div class="block"><div class="bh blue" id="scenh">&#128444; SCENARIO <span class="sub">'+esc(ex.summary)+'</span>'+
      '<button class="btn small ghost" style="margin-left:10px" onclick="toggleScen()" aria-label="Collapse or expand scenario">&#9660; collapse</button></div>'+
      '<div class="bc" id="scenbody">'+scen+'</div></div>'+
    '<div class="block amb">'+blockHeader('amb','&#10067;','QUESTION','<span class="sub">'+(ex.stepTag||'')+'</span>')+
      '<div class="bc"><b>'+ex.q+'</b></div></div>'+
    '<div class="block grn">'+blockHeader('grn','&#9992;','YOUR ANSWER')+
      '<div class="bc" id="answ"></div></div>'+
    '<div id="hintpanel" class="hintbox hidden">&#128161; <b>Hint:</b> '+esc(ex.hint)+'</div>'+
    '<div class="startrow" id="actrow"><button class="btn green" id="checkbtn" onclick="onCheck()">&#10003; Check</button>'+
      '<span class="smallnote">Checking stops the timer so you can read the feedback without pressure.</span></div>'+
    '<div id="fbzone"></div>';
  buildWidget(ex);
  updateHeader();
  window.scrollTo(0,0);
}
function toggleScen(){
  var b=$('#scenbody'),h=$('#scenh');
  if(b.classList.contains('hidden')){b.classList.remove('hidden');}
  else{b.classList.add('hidden');}
}
function optRow(o,letter){
  return '<button class="opt" data-oid="'+o.id+'" onclick="pickOpt(\''+o.id+'\')" aria-pressed="false">'+
    '<span class="olid">'+letter+'.</span><span>'+o.x+'</span><span class="selmark">&#10003; selected</span></button>';
}
function lettersOf(n){var L='ABCDEFGHIJ';return L[n]||String(n+1);}

/* ---------- mcq / multi ---------- */
function buildMCQ(ex){
  var opts=ex._shuf||(ex._shuf=shuffle(ex.options));
  var html=opts.map(function(o,i){return optRow(o,lettersOf(i));}).join('');
  if(ex.type==='multi')html='<p class="smallnote">Select all options that apply. Wrong selections subtract.</p>'+html;
  $('#answ').innerHTML=html;
  R.sel=(ex.type==='multi')?{}:null;
}
/* ---------- categorize (drag & drop) ---------- */
function buildCategorize(ex){
  var items=ex._shuf||(ex._shuf=shuffle(ex.items));
  R.place={};R.picked=null;
  var bank='<div class="bank" id="bank" ondragover="ddOver(event)" ondrop="ddDrop(event,\'__bank\')">'+
    '<div class="slot-title">ITEMS TO PLACE <span class="drag-tag">drag &middot; or tap item then tap a slot</span></div><div id="banklist"></div></div>';
  var slots='<div class="slots">'+ex.slots.map(function(s){
    return '<div class="slot" id="slot-'+s.id+'" data-sid="'+s.id+'" tabindex="0" role="button" '+
      'ondragover="ddOver(event)" ondragleave="ddLeave(event)" ondrop="ddDrop(event,\''+s.id+'\')" '+
      'onclick="slotClick(\''+s.id+'\')" onkeydown="slotKey(event,\''+s.id+'\')">'+
      '<div class="slot-title">'+esc(s.label)+'</div><div class="inbank" id="slotlist-'+s.id+'"></div></div>';
  }).join('')+'</div>';
  $('#answ').innerHTML='<div class="ddwrap">'+bank+slots+'</div>';
  drawDD();
}
function drawDD(){
  var ex=R.ex;
  var bankItems=ex._shuf.filter(function(it){return !R.place[it.id];});
  $('#banklist').innerHTML=bankItems.map(function(it){
    return '<button class="bankitem'+(R.picked===it.id?' picked':'')+'" data-iid="'+it.id+'" draggable="true" ondragstart="ddStart(event,\''+it.id+'\')" onclick="itemClick(\''+it.id+'\')">'+(R.picked===it.id?'&#10003; ':'')+esc(it.x)+'</button>';
  }).join('')||'<span class="smallnote">All items placed.</span>';
  ex.slots.forEach(function(s){
    var inv=Object.keys(R.place).filter(function(iid){return R.place[iid]===s.id;});
    $('#slotlist-'+s.id).innerHTML=inv.map(function(iid){
      var it=ex.items.filter(function(x){return x.id===iid;})[0];
      return '<button class="bankitem" data-iid="'+iid+'" draggable="true" ondragstart="ddStart(event,\''+iid+'\')" onclick="itemClick(\''+iid+'\')" title="Click to return to the bank">&#128465; '+esc(it.x)+'</button>';
    }).join('');
  });
}
function itemClick(iid){
  if(!R||R.checked)return;
  if(R.place[iid]){delete R.place[iid];R.picked=null;drawDD();return;}
  R.picked=(R.picked===iid)?null:iid;drawDD();
}
function slotClick(sid){
  if(!R||R.checked)return;
  if(R.picked){
    var ex=R.ex,cur=Object.keys(R.place).filter(function(i){return R.place[i]===sid;})[0];
    if(cur)delete R.place[cur];
    R.place[R.picked]=sid;R.picked=null;drawDD();
  }
}
function slotKey(ev,sid){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();slotClick(sid);}}
function ddStart(ev,iid){ev.dataTransfer.setData('text/plain',iid);}
function ddOver(ev){if(R&&R.checked)return;ev.preventDefault();ev.currentTarget.classList.add('over');}
function ddLeave(ev){ev.currentTarget.classList.remove('over');}
function ddDrop(ev,where){
  if(!R||R.checked)return;
  ev.preventDefault();ev.currentTarget.classList.remove('over');
  var iid=ev.dataTransfer.getData('text/plain');if(!iid)return;
  if(where==='__bank'){delete R.place[iid];}
  else{var ex=R.ex,cur=Object.keys(R.place).filter(function(i){return R.place[i]===where;})[0];if(cur)delete R.place[cur];R.place[iid]=where;}
  R.picked=null;drawDD();
}
/* ---------- match ---------- */
function buildMatch(ex){
  var rights=ex._shufR||(ex._shufR=shuffle(ex.rights));
  R.pair={};R.pickedLeft=null;
  var L='<div><div class="slot-title">LEFT COLUMN &mdash; tap one</div>'+ex.lefts.map(function(l){
    return '<button class="pairopt" id="pl-'+l.id+'" onclick="pickLeft(\''+l.id+'\')">'+esc(l.x)+'</button>';
  }).join('')+'</div>';
  var Rt='<div><div class="slot-title">RIGHT COLUMN &mdash; then tap its match</div>'+rights.map(function(r){
    return '<button class="pairopt" id="pr-'+r.id+'" onclick="pickRight(\''+r.id+'\')">'+esc(r.x)+'</button>';
  }).join('')+'</div>';
  $('#answ').innerHTML='<div class="pairwrap">'+L+Rt+'</div><div id="pairchips"></div>';
  drawPairs();
}
function pickLeft(id){if(!R||R.checked)return;R.pickedLeft=(R.pickedLeft===id)?null:id;drawPairs();}
function pickRight(id){
  if(!R||R.checked)return;
  if(!R.pickedLeft)return;
  /* several lefts may legitimately map to the same right (many-to-one matching):
     reassigning pickedLeft's pair only, never stealing other lefts' pairs */
  R.pair[R.pickedLeft]=id;R.pickedLeft=null;drawPairs();
}
function unpair(l){if(!R||R.checked)return;delete R.pair[l];drawPairs();}
function drawPairs(){
  var ex=R.ex;
  ex.lefts.forEach(function(l){var p=$('#pl-'+l.id);if(p)p.classList.toggle('picked',R.pickedLeft===l.id);});
  ex.rights.forEach(function(r){var p=$('#pr-'+r.id);if(p)p.classList.remove('picked');});
  $('#pairchips').innerHTML=ex.lefts.filter(function(l){return R.pair[l.id];}).map(function(l){
    var r=ex.rights.filter(function(x){return x.id===R.pair[l.id];})[0];
    return '<div class="pairchip">&#128279; <b>'+esc(l.x)+'</b> &#8594; '+esc(r.x)+
      '<button class="x" onclick="unpair(\''+l.id+'\')" aria-label="Remove pair">&#10007;</button></div>';
  }).join('')||'<div class="smallnote">No pairs yet.</div>';
}
/* ---------- order / rank ---------- */
function buildOrder(ex){
  R.seq=ex._shuf||(ex._shuf=shuffle(ex.items.map(function(i){return i.id;})));
  drawOrder();
}
function drawOrder(){
  var ex=R.ex;
  $('#answ').innerHTML='<div class="ordlist">'+R.seq.map(function(id,i){
    var it=ex.items.filter(function(x){return x.id===id;})[0];
    return '<div class="orditem" draggable="true" ondragstart="ordStart(event,'+i+')" data-i="'+i+'">'+
      '<span class="pos">'+(i+1)+'.</span><span>'+esc(it.x)+'</span>'+
      '<span class="updown"><button onclick="ordMove('+i+',-1)" aria-label="Move up">&#9650;</button>'+
      '<button onclick="ordMove('+i+',1)" aria-label="Move down">&#9660;</button></span></div>';
  }).join('')+'</div><p class="smallnote">Drag rows or use the arrows. Position 1 = first / most important.</p>';
}
function ordMove(i,d){
  if(!R||R.checked)return;
  var j=i+d;if(j<0||j>=R.seq.length)return;
  var t=R.seq[i];R.seq[i]=R.seq[j];R.seq[j]=t;drawOrder();
}
function ordStart(ev,i){ev.dataTransfer.setData('text/plain',String(i));R._dragI=i;
  var n=ev.currentTarget;n.classList.add('dragging');}
document.addEventListener('dragend',function(ev){if(ev.currentTarget&&ev.currentTarget.classList)ev.currentTarget.classList.remove('dragging');});
document.addEventListener('dragover',function(ev){
  if(!R||R.checked||R._dragI===undefined)return;
  var t=ev.target.closest?ev.target.closest('.orditem'):null;if(!t)return;
  ev.preventDefault();
  var j=parseInt(t.getAttribute('data-i'),10);
  if(j===R._dragI)return;
  var seq=R.seq,id=R.seq[R._dragI];
  seq.splice(R._dragI,1);seq.splice(j,0,id);
  R._dragI=j;drawOrder();
});
/* ---------- fill ---------- */
function buildFill(ex){
  R.blank={};R.selBlank=null;
  var line=ex.parts.map(function(p){
    if(p.t==='x')return '<span>'+p.x+'</span>';
    return ' <button class="blank" id="bl-'+p.id+'" data-bid="'+p.id+'" onclick="blankClick(\''+p.id+'\')">&#8230;</button> ';
  }).join('');
  var bank=ex._shufB||(ex._shufB=shuffle(ex.bank));
  $('#answ').innerHTML='<div class="fillline">'+line+'</div>'+
    '<div class="bankrow">'+bank.map(function(t){return '<button class="chip" id="ch-'+b32(t)+'" onclick="chipClick(\''+esc(t)+'\')">'+esc(t)+'</button>';}).join('')+'</div>'+
    '<p class="smallnote">Tap a word, then tap a blank. Tap a filled blank to empty it again.</p>';
}
function b32(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))&0xfffff;}return h.toString(32);}
function blankClick(bid){
  if(!R||R.checked)return;
  if(R.blank[bid]){delete R.blank[bid];drawBlanks();return;}
  R.selBlank=bid;
  document.querySelectorAll('.blank').forEach(function(b){b.classList.toggle('picked',b.getAttribute('data-bid')===bid);});
}
function chipClick(tok){
  if(!R||R.checked)return;
  var ex=R.ex;
  var bid=R.selBlank||Object.keys(ex.answers).filter(function(k){return !R.blank[k];})[0];
  if(!bid)return;
  R.blank[bid]=tok;R.selBlank=null;drawBlanks();
}
function drawBlanks(){
  var ex=R.ex;
  Object.keys(ex.answers).forEach(function(bid){
    var b=$('#bl-'+bid);if(!b)return;
    var v=R.blank[bid];
    b.innerHTML=v?esc(v):'&#8230;';
    b.classList.toggle('filled',!!v);
    b.classList.toggle('picked',R.selBlank===bid);
  });
  ex.bank.forEach(function(t){
    var c=$('#ch-'+b32(t));if(!c)return;
    var used=Object.keys(R.blank).some(function(k){return R.blank[k]===t;});
    c.classList.toggle('used',used);
  });
}
/* ---------- terminal ---------- */
function buildTerminal(ex){
  R.lines=[];R.lastCmd='';
  var syn='';
  if(ex.syntax){
    syn='<div class="synpanel"><h5>SYNTAX REMINDER</h5><div class="mono">'+ex.syntax.shape+'</div>'+
      '<ul class="rules" style="margin:8px 0 4px">'+ex.syntax.notes.map(function(n){return '<li>'+n+'</li>';}).join('')+'</ul>'+
      '<p class="smallnote">Example on a different file: <span class="mono" style="padding:2px 6px">'+ex.syntax.example+'</span></p>'+
      '<p class="smallnote">Expected output shape: <span class="mono" style="padding:2px 6px">'+ex.syntax.outshape+'</span></p></div>';
  }
  $('#answ').innerHTML=syn+
    '<div class="term"><div class="term-scroll" id="tscroll"></div>'+
    '<div class="term-inrow"><span class="pr">analyst@lab:~$</span>'+
    '<input class="term-input" id="tin" autocomplete="off" spellcheck="false" placeholder="type a command and press Enter" aria-label="terminal input"></div></div>'+
    '<p class="smallnote">Type the command, press Enter, then press Check. Nothing real is executed &mdash; this is a simulation.</p>';
  $('#tin').addEventListener('keydown',function(ev){
    if(ev.key==='Enter'){var v=this.value;this.value='';runCmd(v);}
  });
  termOut('<span class="dm">simulation shell &mdash; only the commands relevant to this exercise are available</span>');
}
function normCmd(c){return c.trim().replace(/\s+/g,' ').toLowerCase();}
function runCmd(raw){
  var ex=R.ex,c=normCmd(raw);
  R.lines.push({in:raw});
  if(c===''){drawTerm();return;}
  R.lastCmd=raw;
  var out=null;
  if(ex.outputs){ex.outputs.forEach(function(o){if(out===null&&new RegExp(o.m).test(c))out=o.x;});}
  if(out===null){
    if(/^(clear|cls)$/.test(c)){R.lines=[];drawTerm();return;}
    var bin=c.split(' ')[0];
    out='sh: command not found: '+bin+'  <span class="dm">(this simulation only knows the commands needed here)</span>';
  }
  R.lines.push({out:out});
  drawTerm();
}
function termOut(html){R.lines.push({out:html});drawTerm();}
function drawTerm(){
  var t=$('#tscroll');if(!t)return;
  t.innerHTML=R.lines.map(function(l){
    if(l.in!==undefined)return '<div class="term-line"><span class="pr">analyst@lab:~$</span> <span class="in">'+esc(l.in)+'</span></div>';
    return '<div class="term-line"><span class="out">'+l.out+'</span></div>';
  }).join('')+'\n';
  t.scrollTop=t.scrollHeight;
}
/* ---------- logsel ---------- */
function buildLogsel(ex){
  R.sel={};
  var filt=ex.filter?'<input class="logfilter" id="logf" placeholder="filter lines (text match)..." aria-label="filter log lines">':'';
  $('#answ').innerHTML=filt+'<div class="logbox" id="logbox"></div>'+
    '<p class="smallnote">Click a line to select it. Click again to deselect.'+(ex.filter?' The filter box only narrows the view &mdash; it does not change your selection.':'')+'</p>';
  drawLog();
  if(ex.filter){$('#logf').addEventListener('input',function(){drawLog(this.value);});}
}
function drawLog(f){
  var ex=R.ex;
  f=(f||'').toLowerCase();
  $('#logbox').innerHTML=ex.lines.map(function(l){
    var show=!f||l.x.toLowerCase().indexOf(f)>-1;
    return '<div class="logline'+(R.sel[l.id]?' sel':'')+(show?'':' off')+'" data-lid="'+l.id+'" role="checkbox" aria-checked="'+(!!R.sel[l.id])+'" tabindex="0" onclick="lineSel(\''+l.id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();lineSel(\''+l.id+'\');}">'+
      '<span class="lnum">'+l.id+'</span><span class="selmark" style="display:'+(R.sel[l.id]?'inline':'none')+'">&#10003;</span><span class="mono" style="background:none;border:none;padding:0;white-space:pre-wrap">'+esc(l.x)+'</span></div>';
  }).join('');
}
function lineSel(id){
  if(!R||R.checked)return;
  if(R.sel[id]){delete R.sel[id];}else{R.sel[id]=1;}
  var n=document.querySelector('.logline[data-lid="'+id+'"]');
  if(n){n.classList.toggle('sel',!!R.sel[id]);n.setAttribute('aria-checked',!!R.sel[id]);
    var m=n.querySelector('.selmark');if(m)m.style.display=R.sel[id]?'inline':'none';}
}
/* ---------- sim (multi-step) ---------- */
function buildSim(ex){
  R.stepIdx=0;R.choices={};R.log=[];
  drawStep();
}
function drawStep(){
  var ex=R.ex,st=ex.steps[R.stepIdx];
  $('#scenbody').innerHTML=ex.scen.map(artefactHtml).join('')+
    (R.log.length?'<div class="caselog">'+R.log.map(function(l){return '<div class="cl">'+l+'</div>';}).join('')+'</div>':'');
  var qblock=document.querySelector('.block.amb .bc');
  qblock.innerHTML='<span class="steps-tag">STEP '+(R.stepIdx+1)+' OF '+ex.steps.length+'</span><br><b>'+st.q+'</b>';
  var opts=st._shuf||(st._shuf=shuffle(st.options));
  $('#answ').innerHTML=opts.map(function(o,i){return optRow(o,lettersOf(i));}).join('');
  document.querySelector('#actrow .smallnote').textContent='Intermediate steps do not stop the timer. The timer pauses only on the final Check.';
  var cb=$('#checkbtn');cb.disabled=true;cb.title='Available on the final step';
  document.getElementById('scenh').querySelector('.sub').textContent=ex.summary;
  window.scrollTo(0,0);
}
function pickSim(id){
  if(!R||R.checked)return;
  R._curChoice=id;
  document.querySelectorAll('#answ .opt').forEach(function(n){
    var on=n.getAttribute('data-oid')===id;
    n.classList.toggle('sel',on);n.setAttribute('aria-pressed',on?'true':'false');
  });
  var cb=$('#checkbtn');
  if(R.stepIdx===R.ex.steps.length-1){cb.disabled=false;cb.innerHTML='&#10003; Check final answers';cb.title='';}
  else{cb.disabled=false;cb.innerHTML='&#10145; Confirm &amp; continue';cb.title='';}
}
function simConfirm(){
  var ex=R.ex,st=ex.steps[R.stepIdx];
  var opt=st.options.filter(function(o){return o.id===R._curChoice;})[0];
  if(!opt)return;
  R.choices[st.id]=R._curChoice;
  R.log.push('<b>Step '+(R.stepIdx+1)+':</b> '+opt.outcome);
  if(R.stepIdx<ex.steps.length-1){
    R.stepIdx++;drawStep();
    var cb=$('#checkbtn');cb.innerHTML='&#10003; Check';cb.disabled=true;
  }else{
    onCheck();
  }
}
function pickOpt(id){
  if(!R||R.checked)return;
  if(R.ex.type==='sim'){pickSim(id);return;}
  var ex=R.ex;
  if(ex.type==='mcq'){
    R.sel=id;
    document.querySelectorAll('#answ .opt').forEach(function(n){
      var on=n.getAttribute('data-oid')===id;
      n.classList.toggle('sel',on);n.setAttribute('aria-pressed',on?'true':'false');
    });
  }else{
    if(R.sel[id]){delete R.sel[id];}else{R.sel[id]=1;}
    document.querySelectorAll('#answ .opt').forEach(function(n){
      var on=!!R.sel[n.getAttribute('data-oid')];
      n.classList.toggle('sel',on);n.setAttribute('aria-pressed',on?'true':'false');
    });
  }
}

/* ================= widget builder ================= */
function buildWidget(ex){
  if(ex.type==='mcq'||ex.type==='multi')buildMCQ(ex);
  else if(ex.type==='categorize')buildCategorize(ex);
  else if(ex.type==='match')buildMatch(ex);
  else if(ex.type==='order')buildOrder(ex);
  else if(ex.type==='fill')buildFill(ex);
  else if(ex.type==='terminal')buildTerminal(ex);
  else if(ex.type==='logsel')buildLogsel(ex);
  else if(ex.type==='sim'){buildSim(ex);document.getElementById('checkbtn').onclick=function(){if(R&&!R.checked)simConfirm();};}
}

/* ================= collectors ================= */
function collect(R){
  var ex=R.ex,res={selected:[],correct:[],items:[]};
  if(ex.type==='mcq'){
    res.selected=R.sel?[R.sel]:[];
    res.correct=[ex.correct];
    var co=ex.options.filter(function(o){return o.id===ex.correct;})[0];
    if(R.sel===ex.correct){res.items.push({name:'Answer',state:'ok',note:co.why});}
    else{
      var wo=R.sel?ex.options.filter(function(o){return o.id===R.sel;})[0]:null;
      if(wo)res.items.push({name:'Your pick',state:'wrong',note:wo.why});
      res.items.push({name:'Correct',state:'missed',note:co.why});
    }
  }else if(ex.type==='multi'){
    res.selected=Object.keys(R.sel);
    res.correct=ex.correct;
    ex.options.forEach(function(o){
      var isC=ex.correct.indexOf(o.id)>-1,isS=!!R.sel[o.id];
      if(isC&&isS)res.items.push({name:o.id.toUpperCase(),state:'ok',note:o.why});
      else if(isC&&!isS)res.items.push({name:o.id.toUpperCase(),state:'missed',note:o.why});
      else if(!isC&&isS)res.items.push({name:o.id.toUpperCase(),state:'wrong',note:o.why});
    });
  }else if(ex.type==='categorize'){
    ex.slots.forEach(function(s){
      var iid=Object.keys(R.place).filter(function(i){return R.place[i]===s.id;})[0];
      var good=Object.keys(ex.correct).filter(function(i){return ex.correct[i]===s.id;})[0];
      if(!iid){res.items.push({name:s.label,state:'missed',note:s.why});}
      else if(iid===good){
        res.items.push({name:s.label,state:'ok',note:s.why});
        res.selected.push(s.id+'='+iid);res.correct.push(s.id+'='+good);
      }else{
        res.items.push({name:s.label,state:'wrong',note:s.why+' The item you placed there belongs elsewhere.'});
        res.selected.push(s.id+'='+iid);
      }
      if(good)res.correct.push(s.id+'='+good);
    });
    res.correct=ex.slots.map(function(s){var g=Object.keys(ex.correct).filter(function(i){return ex.correct[i]===s.id;})[0];return g?s.id+'='+g:null;}).filter(Boolean);
    res.selected=ex.slots.map(function(s){var iid=Object.keys(R.place).filter(function(i){return R.place[i]===s.id;})[0];return iid?s.id+'='+iid:null;}).filter(Boolean);
  }else if(ex.type==='match'){
    ex.lefts.forEach(function(l){
      var p=R.pair[l.id];
      var corr=ex.correct[l.id];
      if(!p){res.items.push({name:l.short,state:'missed',note:ex.why[l.id]});}
      else{
        res.selected.push(l.id+'='+p);
        if(p===corr){res.items.push({name:l.short,state:'ok',note:ex.why[l.id]});}
        else{res.items.push({name:l.short,state:'wrong',note:ex.why[l.id]});}
      }
      res.correct.push(l.id+'='+corr);
    });
  }else if(ex.type==='order'){
    ex.correctOrder.forEach(function(id,i){
      var placed=R.seq[i];
      res.selected.push(i+'='+placed);res.correct.push(i+'='+id);
      if(placed===id)res.items.push({name:'Position '+(i+1),state:'ok',note:ex.why[id]});
      else res.items.push({name:'Position '+(i+1),state:'wrong',note:ex.why[id]});
    });
  }else if(ex.type==='fill'){
    Object.keys(ex.answers).forEach(function(bid){
      var raw=R.blank[bid]||'';
      var v=raw.trim().toLowerCase();
      var a=ex.answers[bid].trim().toLowerCase();
      res.correct.push(bid+'='+a);
      var nm='Blank: '+(ex.blankNames&&ex.blankNames[bid]||bid);
      if(raw.trim()!==''){
        res.selected.push(bid+'='+v);
        res.items.push({name:nm,state:v===a?'ok':'wrong',note:ex.why[bid]});
      }else{
        /* an untouched blank was never answered: it is missed, never wrong */
        res.items.push({name:nm,state:'missed',note:ex.why[bid]});
      }
    });
  }else if(ex.type==='terminal'){
    var c=normCmd(R.lastCmd||'');
    var toks=c?c.split(' '):[];
    function tokTest(rx){var re=new RegExp(rx);return toks.some(function(t){return re.test(t);});}
    function fullTest(rx){var re=new RegExp(rx);return re.test(c);}
    var danger=(ex.dangerous||[]).some(function(d){return new RegExp(d).test(c);});
    R._danger=danger;
    ex.parts.forEach(function(p,i){
      var test=(p.mode==='full')?fullTest:tokTest;
      var ok=c&&test(p.ok)&&!(p.bad&&test(p.bad));
      var bad=c&&p.bad&&test(p.bad);
      if(ok){res.selected.push('e'+i);res.items.push({name:p.name,state:'ok',note:p.why});}
      else if(bad){res.selected.push('w'+i);res.items.push({name:p.name,state:'wrong',note:p.why+' What you typed fails this part.'});}
      else{res.items.push({name:p.name,state:'missed',note:p.why});}
      res.correct.push('e'+i);
    });
    if(!c){res.items=res.items.map(function(it){return {name:it.name,state:'missed',note:it.note};});}
  }else if(ex.type==='logsel'){
    res.selected=Object.keys(R.sel);res.correct=ex.correct;
    ex.lines.forEach(function(l){
      if(ex.correct.indexOf(l.id)>-1){
        var st=R.sel[l.id]?'ok':'missed';
        res.items.push({name:'Line '+l.id,state:st,note:ex.why[l.id]});
      }else if(R.sel[l.id]){
        res.items.push({name:'Line '+l.id,state:'wrong',note:ex.why[l.id]});
      }
    });
  }else if(ex.type==='sim'){
    ex.steps.forEach(function(st){
      var ch=R.choices[st.id];
      var corr=st.options.filter(function(o){return o.correct;})[0];
      res.correct.push(st.id+'='+corr.id);
      if(!ch){res.items.push({name:st.label,state:'missed',note:corr.why});}
      else{
        res.selected.push(st.id+'='+ch);
        var o=st.options.filter(function(x){return x.id===ch;})[0];
        res.items.push({name:st.label,state:ch===corr.id?'ok':'wrong',note:ch===corr.id?o.why:(corr.why+' '+o.why)});
      }
    });
  }
  return res;
}

/* ================= lock & feedback ================= */
function lockWidget(){
  var a=$('#answ');if(a)a.classList.add('locked');
  a.querySelectorAll('button,input').forEach(function(n){n.disabled=true;});
  var cb=$('#checkbtn');if(cb){cb.disabled=true;}
}
function renderFeedback(){
  var ex=R.ex,res=R.res,credit=R.credit;
  var label,state,cls;
  if(credit>=0.999){label='&#10003; CORRECT';state='Correct';cls='correct';}
  else if(credit>0){label='&#10003; PARTIALLY CORRECT';state='Partially correct';cls='partial';}
  else{label='&#10007; INCORRECT';state='Incorrect';cls='incorrect';}
  var multi=ex.type!=='mcq';
  var html='<div class="fb '+cls+'" role="status">'+
    '<div class="fb-title '+cls+'">'+label+
    '<span class="fb-credit">credit '+credit.toFixed(2)+(multi?' &middot; '+Math.round(credit*res.correct.length)+'/'+res.correct.length+' items':'')+'</span></div>';
  if(R._danger)html+='<div class="fb-title incorrect" style="margin-top:8px;font-size:14px">&#10007; DANGEROUS &mdash; NEAR MISS: this command would have destroyed or altered evidence. Always preserve before you clean.</div>';
  if(multi){
    html+=res.items.map(function(it){
      var ic=it.state==='ok'?'&#10003;':(it.state==='wrong'?'&#10007;':'&#9675;');
      var st=it.state==='ok'?'Correct':(it.state==='wrong'?'Wrong':'Missed');
      return '<div class="fb-item '+it.state+'"><span class="ic">'+ic+'</span><span class="nm">'+esc(it.name)+' &mdash; '+st+'</span><span class="nt">'+it.note+'</span></div>';
    }).join('');
  }else{
    var co=ex.options.filter(function(o){return o.id===ex.correct;})[0];
    html+='<div class="fb-item ok"><span class="ic">&#10003;</span><span class="nm">Correct answer</span><span class="nt">'+co.x+'</span></div>';
  }
  if(ex.type==='terminal'){
    html+='<div style="margin-top:10px"><div class="arte-label" style="border-radius:6px 6px 0 0">CANONICAL COMMAND</div><div class="mono">'+esc(ex.canonical)+'</div></div>';
    html+='<p class="smallnote" style="margin-top:6px">'+ex.canonWhy+'</p>';
  }
  html+='<div class="fb-exp"><b>Why:</b> '+ex.expl+'</div>';
  if(credit<0.999)html+='<div class="fb-study"><b>What to study:</b> '+ex.study+'</div>';
  html+='</div>';
  var last=(S.pos>=S.order.length-1);
  var nextLbl=R.fromReview?'&#8617; Return to skipped list':(last?'&#10003; Final Submit':'Next &#10145;');
  html+='<div class="startrow"><button class="btn primary" onclick="onNext()">'+nextLbl+'</button></div>';
  $('#fbzone').innerHTML=html;
  var ab=$('#actrow');if(ab)ab.classList.add('hidden');
}

renderIntro();
</script>
