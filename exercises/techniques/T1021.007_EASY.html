<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1021.007 Cloud Services — EASY</title>
<style>
:root{
  --bg-page:#070c12;
  --bg-panel:#0d141d;
  --bg-surface:#111a26;
  --bg-surface-2:#0a111a;
  --bg-elev:#172335;
  --ink:#e9eff7;
  --ink-dim:#a9b9cb;
  --ink-faint:#8497ab;
  --line:#1f2b3c;
  --line-soft:#182331;
  --blue:#4aa8e8;   --blue-soft:rgba(74,168,232,.13);
  --amber:#e6aa3c;  --amber-soft:rgba(230,170,60,.13);
  --green:#41c07f;  --green-soft:rgba(65,192,127,.13);
  --red:#ef5a6a;    --red-soft:rgba(239,90,106,.15);
  --sev-easy:#41c07f;
  --sev-medium:#e6aa3c;
  --sev-hard:#f0813c;
  --sev-extreme:#ef5a6a;
  --focus:#4aa8e8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1 0 auto;width:100%;max-width:980px;margin:0 auto;padding:20px 16px 40px}
.foot{flex-shrink:0;margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:12.5px;background:var(--bg-panel)}
.foot b{color:var(--ink-dim);letter-spacing:.08em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-surface-2)}
::-webkit-scrollbar-thumb{background:#24344b;border-radius:6px;border:2px solid var(--bg-surface-2)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(8,13,20,.94);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.14em;font-size:12.5px;color:var(--green)}
.brand small{color:var(--ink-faint);letter-spacing:.05em;font-weight:600}
.tb-sep{width:1px;height:22px;background:var(--line)}
.tb-title{font-weight:700;font-size:13.5px;color:var(--ink-dim);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stat{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;font-weight:600;background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:32px}
.tb-stat .ic{font-size:13px}
.tb-stat.timer{font-family:var(--mono);color:var(--ink)}
.tb-state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px;border:1px solid}
.tb-state.manual{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.tb-state.autocheck{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.tb-btn:hover:not(:disabled){border-color:var(--blue)}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}
.tb-btn.hint{color:var(--amber)}
.tb-btn.skip{color:var(--ink-dim)}
.prog{height:3px;background:var(--line-soft)}
.prog i{display:block;height:100%;background:var(--green);width:0%;transition:width .25s}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 12px;color:#08110b}
.badge::before{content:"●";font-size:9px}
.sev-EASY{background:var(--sev-easy)}
.sev-MEDIUM{background:var(--sev-medium)}
.sev-HARD{background:var(--sev-hard)}
.sev-EXTREMELY_HARD{background:var(--sev-extreme);color:#160407}
.otype{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg-surface)}
/* ---------- intro ---------- */
.intro-head{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--bg-panel),var(--bg-surface-2));padding:26px 26px 20px;margin-bottom:16px}
.intro-head h1{margin:8px 0 4px;font-size:26px;line-height:1.25}
.intro-head .sub{color:var(--ink-dim);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-dim);background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:34px}
.chip .ic{color:var(--ink-faint)}
.cand{margin-top:12px;font-size:13px;color:var(--ink-faint)}
.intro-sec{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;background:var(--bg-panel);padding:18px 22px;margin-bottom:14px}
.intro-sec.learn{border-left-color:var(--blue)}
.intro-sec.keys{border-left-color:var(--amber)}
.intro-sec.how{border-left-color:var(--green)}
.intro-sec h2{margin:0 0 10px;font-size:15px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.intro-sec.learn p{color:var(--ink-dim);margin:0 0 10px}
.intro-sec.learn p:last-child{margin-bottom:0}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kw-card{background:var(--bg-surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 14px}
.kw-card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.kw-card ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:13.5px}
.kw-card li{margin:2px 0}
.rules{margin:0;padding:0;list-style:none}
.rules li{position:relative;padding:7px 0 7px 26px;color:var(--ink-dim);font-size:14px}
.rules li::before{content:"▸";position:absolute;left:4px;color:var(--green)}
.rules li .dim{color:var(--ink-faint)}
/* ---------- exercise card ---------- */
.excard{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--bg-panel);border:1px solid var(--line);border-left:4px solid var(--blk,var(--blue));border-radius:12px;padding:16px 20px}
.blk-scenario{--blk:var(--blue)}
.blk-question{--blk:var(--amber)}
.blk-answer{--blk:var(--green)}
.blk-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--blk,var(--ink));margin-bottom:10px}
.blk-label .dot{width:8px;height:8px;border-radius:50%;background:var(--blk,var(--ink))}
.ex-title{margin:0 0 8px;font-size:16.5px}
.summary{color:var(--ink-faint);font-size:13.5px;font-style:italic;margin:0 0 8px}
.showfull{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;min-height:32px}
.scen-body p{margin:0 0 10px;color:var(--ink-dim)}
.scen-body p:last-child{margin-bottom:0}
details.artef{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin:10px 0 0}
details.artef summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--blue);user-select:none;min-height:40px;display:flex;align-items:center}
details.artef .artbody{padding:0 14px 12px}
.mono{font-family:var(--mono);font-size:13px;line-height:1.5;color:#c8d8e6;background:var(--bg-surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:0}
table.attable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:0}
table.attable th{background:var(--bg-elev);color:var(--ink);text-align:left}
table.attable th,table.attable td{border:1px solid var(--line-soft);padding:6px 10px;color:var(--ink-dim)}
.q-text{margin:0;font-weight:700;font-size:16px;color:var(--ink)}
/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-height:44px;cursor:pointer;color:var(--ink);font-size:14.5px;font-family:var(--sans);margin:0 0 8px}
.opt:last-child{margin-bottom:0}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}
.opt .mark{font-weight:800;flex-shrink:0}
/* ---------- match ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol h4,.obank h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mleft{flex:1;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;min-height:44px;display:flex;align-items:center}
.mzone{flex:1;background:var(--bg-surface-2);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;min-height:44px;color:var(--ink-faint);font-size:13.5px;cursor:pointer;text-align:left;font-family:var(--sans)}
.mzone.filled{border-style:solid;border-color:var(--blue);color:var(--ink)}
.mzone.dragover{border-color:var(--green)}
.mzone.correct{border-color:var(--green);background:var(--green-soft)}
.mzone.wrong{border-color:var(--red);background:var(--red-soft)}
.mbank{display:flex;flex-direction:column}
.mchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;margin-bottom:8px;cursor:grab;color:var(--ink);font-size:13.5px;text-align:left;font-family:var(--sans)}
.mchip:disabled{cursor:default;opacity:.5}
.mchip.selchip{border-color:var(--amber);background:var(--amber-soft)}
.mchip.used{opacity:.35}
.mhintline{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- order ---------- */
.ordlist{list-style:none;margin:0;padding:0;counter-reset:ord}
.orditem{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.orditem.dragover{border-color:var(--green)}
.orditem .num{font-family:var(--mono);color:var(--amber);font-weight:700;min-width:22px;text-align:center}
.orditem .txt{flex:1;font-size:14px}
.orditem.correct{border-color:var(--green)}
.orditem.wrong{border-color:var(--red)}
.ordbtns{display:flex;gap:4px}
.ordbtns button{min-width:34px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);cursor:pointer;font-size:14px}
.ordbtns button:hover{border-color:var(--blue)}
/* ---------- fill ---------- */
.fillwrap{font-size:15.5px;color:var(--ink-dim);line-height:2.1;white-space:pre-wrap}
.fillin{font-family:var(--mono);font-size:13.5px;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 10px;min-height:38px;width:170px;margin:0 3px}
.fillin:focus{border-color:var(--blue);outline:none}
.fillin.correct{border-color:var(--green)}
.fillin.wrong{border-color:var(--red)}
.fbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:38px;font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer}
.fchip:hover{border-color:var(--amber)}
/* ---------- terminal ---------- */
.term{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:8px;background:var(--bg-elev);padding:8px 12px;font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.term-bar .dots{letter-spacing:3px;color:var(--red)}
.term-out{font-family:var(--mono);font-size:13px;line-height:1.55;color:#c8d8e6;padding:12px 14px;min-height:130px;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term-out .tl-dim{color:var(--ink-faint)}
.term-out .tl-danger{color:var(--red);font-weight:700}
.term-out .tl-echo{color:var(--ink)}
.term-line{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding:10px 14px}
.term-prompt{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--mono);font-size:13px;min-height:34px}
.term-in:focus{outline:none}
details.syntax{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin-top:10px}
details.syntax summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--amber);min-height:40px;display:flex;align-items:center}
details.syntax .artbody{padding:0 14px 12px}
/* ---------- logview ---------- */
.logpanel{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log-tools{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-elev);border-bottom:1px solid var(--line-soft)}
.logfilter{flex:1;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 12px;min-height:38px}
.logfilter:focus{border-color:var(--blue);outline:none}
.log-count{font-size:12px;color:var(--ink-faint);font-family:var(--mono);white-space:nowrap}
.loglines{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#bccfe0;padding:12px 14px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.loglines mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}
.wtitle{font-weight:700;margin:14px 0 10px;color:var(--ink)}
/* ---------- decision ---------- */
.dstep{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.dstep.locked{opacity:.9}
.dlabel{display:inline-flex;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue);border-radius:6px;padding:3px 9px;margin-bottom:8px}
.dprompt{font-family:var(--mono);font-size:13px;color:var(--ink-dim);background:var(--bg-surface-2);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 10px;white-space:pre-wrap}
.dq{font-weight:700;margin:0 0 10px}
.drecorded{color:var(--ink-faint);font-size:13px;margin-top:8px}
.dwhy{font-size:13.5px;color:var(--ink-dim);background:var(--bg-surface-2);border-radius:8px;padding:9px 12px;margin-top:8px}
/* ---------- hint ---------- */
.hintbox{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin-top:12px;color:var(--ink-dim)}
.hintbox .hb{color:var(--amber);font-weight:800;font-size:12px;letter-spacing:.1em;display:block;margin-bottom:4px}
.penaltynote{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- feedback ---------- */
.fb{border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.fb.ok{border-color:var(--green)}
.fb.bad{border-color:var(--red)}
.fb.part{border-color:var(--amber)}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 18px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb.ok .fb-head{background:var(--green-soft);color:var(--green)}
.fb.bad .fb-head{background:var(--red-soft);color:var(--red)}
.fb.part .fb-head{background:var(--amber-soft);color:var(--amber)}
.fb-credit{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim);font-weight:600}
.fb-body{padding:14px 18px;background:var(--bg-panel)}
.fi{display:flex;gap:9px;padding:4px 0;font-size:14px;color:var(--ink-dim)}
.fi .ic{flex-shrink:0;font-weight:800}
.fi.ok .ic{color:var(--green)}
.fi.bad .ic{color:var(--red)}
.fi.miss .ic{color:var(--ink-faint)}
.fi.warn .ic{color:var(--red)}
.fi.warn{color:var(--red);font-weight:600}
.fi.note{color:var(--ink-faint)}
.fb-explain{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:12px;color:var(--ink-dim);font-size:14px}
.fb-explain p{margin:0 0 10px}
.fb-explain p:last-child{margin-bottom:0}
.fb-study{margin-top:10px;font-size:13px;color:var(--blue)}
.fb .mono{margin-top:10px}
/* ---------- actions ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:10px 20px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-family:var(--sans)}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:transparent;color:#04120a}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-amber{background:var(--amber);border-color:transparent;color:#1c1204}
.ghost-note{color:var(--ink-faint);font-size:13px}
/* ---------- review ---------- */
.revlist{display:flex;flex-direction:column;gap:10px}
.revrow{display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex-wrap:wrap}
.revrow .rn{font-family:var(--mono);color:var(--amber);font-weight:700}
.revrow .rt{flex:1;color:var(--ink-dim);font-size:14px;min-width:200px}
.revrow .badge-skip{color:var(--ink-faint);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* ---------- results ---------- */
.res-head{border:1px solid var(--line);border-radius:14px;background:var(--bg-panel);padding:26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ring{width:172px;height:172px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--pct)*1%),var(--bg-elev) 0);display:grid;place-items:center;flex-shrink:0}
.ring .rin{width:134px;height:134px;border-radius:50%;background:var(--bg-panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:34px;font-weight:800;font-family:var(--mono)}
.ring .of{font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
.res-verdict{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.res-verdict.pass{color:var(--green)}
.res-verdict.fail{color:var(--red)}
.res-sub{color:var(--ink-dim);font-size:14px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.statcard{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.statcard .sv{font-size:22px;font-weight:800;font-family:var(--mono)}
.statcard .sv.ok{color:var(--green)}
.statcard .sv.part{color:var(--amber)}
.statcard .sv.bad{color:var(--red)}
.statcard .sv.skip{color:var(--ink-faint)}
.statcard .sl{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.pausereport{border:1px solid var(--line);border-radius:10px;background:var(--bg-panel);padding:12px 16px;color:var(--ink-dim);font-size:13.5px;margin-bottom:14px}
.restable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.restable th{background:var(--bg-elev);text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase}
.restable td{padding:8px 12px;border-top:1px solid var(--line-soft);color:var(--ink-dim)}
.restable td.num{font-family:var(--mono)}
.st-ok{color:var(--green);font-weight:700}
.st-part{color:var(--amber);font-weight:700}
.st-bad{color:var(--red);font-weight:700}
.st-skip{color:var(--ink-faint);font-weight:700}
/* ---------- overlay ---------- */

var EXAMS = [{"id":"e01","type":"mcq","title":"The service behind the shell","summary":"Name the AWS service that runs commands through an agent.","scenario":"A new teammate asks how the admin team reaches hundreds of EC2 instances without ever opening SSH to the internet. You sketch the setup on the whiteboard: a small agent runs on every instance and stays connected to one AWS management service, which forwards commands to it and returns the output to the sender.","question":"Which AWS service runs commands on instances through that always-on agent?","hint":"The name says what it manages — systems — and how: through a manager service.","explanation":"AWS Systems Manager is the management service whose agent receives Run Command jobs and Session Manager shells. Route 53 handles DNS, Simple Queue Service moves messages, and Elastic Beanstalk deploys applications — none of them pushes commands to instance shells.\n\nRemember the pattern: control plane sends, agent on the guest executes.","study":"Study AWS Systems Manager basics: Run Command, Session Manager, and the SSM Agent.","options":["AWS Systems Manager (SSM)","AWS Route 53 DNS records","AWS Simple Queue Service","AWS Elastic Beanstalk service"],"correct":0},{"id":"e02","type":"match","title":"Same idea, three clouds","summary":"Match each cloud to its run-command or session path.","scenario":"You are preparing a one-page cheat sheet that maps each provider to the service an intruder could abuse for hands-on-keyboard movement between machines. The sheet must also contrast the cloud paths with classic network logins such as SSH and RDP, which need a reachable port on the target machine itself.","question":"Assign each environment to the remote-execution path it offers:","hint":"Three rows are cloud services; the last one is the classic network login.","explanation":"AWS moves operators through Systems Manager Run Command and Session Manager; Azure delivers Run Command through the VM agent; Google Cloud uses OS Login so account rights turn into compute ssh access. Classic SSH or RDP is different: it is a direct network login that needs port 22 or 3389 reachable.\n\nAll four end at a shell, but only the cloud paths ride the provider's control plane.","study":"Study the provider names for run-command and session services — they recur in every cloud case.","pairs":[{"left":"AWS","right":"Systems Manager Run Command and Session Manager"},{"left":"Azure","right":"Run Command delivered by the VM agent"},{"left":"Google Cloud","right":"OS Login plus gcloud compute ssh"},{"left":"Classic Linux or Windows host","right":"Direct SSH or RDP on a reachable port"}]},{"id":"e03","type":"order","title":"From laptop to instance shell","summary":"Order how a Session Manager shell is established.","scenario":"During onboarding you must explain, step by step, how an admin reaches a Linux instance shell without any inbound port open. Public provider documentation describes the flow from an authenticated command-line tool, through the service, down to the agent that is already connected outbound on the instance from the moment it boots.","question":"Arrange the steps into the order they really happen:","hint":"The agent is already talking outbound before anyone types anything.","explanation":"The admin first authenticates with valid cloud credentials, then asks the service to start a session on the chosen instance. The service relays the request to the agent, the agent connects outbound to the session relay, and only then does the interactive shell appear. Each step depends on the one before it.\n\nNo inbound port is involved anywhere — that is the whole appeal.","study":"Study the Session Manager flow: authenticate, request, relay, agent connects outbound, shell.","items":["Authenticate the CLI with valid cloud credentials","Ask the service to start a session on the target instance","The service forwards the request to the instance's agent","The agent connects outbound to the session relay","The interactive shell opens for the operator"]},{"id":"e04","type":"fill","title":"The agent in the middle","summary":"Complete the note about agent, service and ports.","scenario":"You are writing the onboarding note for junior analysts. It must state, in one sentence, which component runs on the guest, which service drives it, and which classic remote-access port the team can therefore keep closed on the firewall without breaking daily administration work anywhere.","question":"Complete the note with the correct terms from the bank:","hint":"The guest component and the service share their three-letter family name.","explanation":"The SSM Agent runs on the guest, the Systems Manager service drives it, and because commands ride that channel the team can keep inbound SSH port 22 closed. Port 445 belongs to SMB and 5985 to WinRM — different protocols entirely.\n\nThe pairing of agent and control-plane service is the core idea of T1021.007.","study":"Study the roles of the SSM Agent and the Systems Manager service before your next cloud triage.","text":"In AWS the ___ Agent runs on the guest, the ___ service sends commands to it, so the team can keep inbound SSH port ___ closed on the firewall.","blanks":["SSM","Systems Manager","22"],"bank":["SSM","Systems Manager","22","445","5985","IMDS"]},{"id":"e05","type":"terminal","title":"Open a session, the safe way","summary":"Start a Session Manager shell on one instance.","scenario":"You are the on-call operator in the sandbox account of the Northwind Retail lab. The runbook asks you to open an interactive shell on the lab instance i-0f3a9c27b61d8e401 using Session Manager, leaving every port closed and every step logged. The simulator only knows the toolset shown on the syntax panel, so read it first.","question":"Type the command that starts the Session Manager shell on that instance:","hint":"The command is 'start-session' and it needs --target plus the instance ID.","explanation":"aws ssm start-session --target i-0f3a9c27b61d8e401 asks the service for an interactive shell on that instance and hands you the prompt. terminate-session is the opposite move and ends a running session — the task asked you to start one.\n\nNote the output: the SessionId line is the handle you would later find in CloudTrail.","study":"Study aws ssm start-session and its --target switch; the session ID links CLI and audit trail.","prompt":"operator@mgmt:~$","skill":"ssm-session-review","knownTools":["aws","ssm","jq","grep"],"expected":"aws ssm start-session --target i-0f3a9c27b61d8e401","elements":[{"label":"the Session Manager start command","any":["aws ssm start-session"]},{"label":"the --target switch","any":["--target"]},{"label":"the lab instance ID","any":["i-0f3a9c27b61d8e401"]}],"forbidden":[{"any":["aws ssm terminate-session"],"why":"That ends an existing session; the runbook asked you to start one."}],"output":["Starting session with SessionId: botocore-session-0a91c2f7e3d5b8142","i-0f3a9c27b61d8e401 accepted the session request.","ssm-user@ip-10[.]20[.]4[.]118:~$ shell is ready","The session is recorded in CloudTrail as StartSession."],"syntaxPanel":"aws ssm start-session --target <instance-id>\n  start-session   open an interactive shell through Session Manager\n  --target        the managed instance to reach\n  example on another host: aws ssm start-session --target i-0aa11bb22cc33dd44","sampleOutput":"Starting session with SessionId: lab-4471-e9b1d2\nssm-user@ip-10[.]20[.]4[.]55:~$"},{"id":"e06","type":"logview","title":"CloudTrail first look","summary":"Read six audit lines and fill in the two event names.","scenario":"A trainer pastes a small CloudTrail-style extract from the lab account below. Every line shows one API event from the same morning, all from two known identities. Use the filter box if the panel allows it, then complete the sentence in the task with the two event names that matter for T1021.007.","question":"Complete the sentence with the two event names from the log:","hint":"One event opens an interactive shell; the other runs one command and returns output.","explanation":"StartSession is the event that opens an interactive Session Manager shell, and SendCommand is the one-shot Run Command event that pushes a document to instances. RunInstances creates machines, AssumeRole switches roles, and TerminateSession closes a shell — none of them executes a command or opens a new shell by itself.\n\nEvent names read like verbs; learn them as vocabulary.","study":"Study CloudTrail event names for the Systems Manager family: StartSession, SendCommand, TerminateSession.","filterable":true,"log":{"header":["time","eventName","detail"],"lines":["2026-03-02T08:14:22Z AssumeRole principal=ci-runner role=ops-deploy","2026-03-02T08:15:03Z StartSession target=i-0f3a9c27b61d8e401 actor=adm.lena","2026-03-02T08:15:41Z SendCommand document=AWS-RunShellScript actor=adm.lena","2026-03-02T08:16:02Z RunInstances image=ami-0abc123def actor=ci-runner","2026-03-02T09:02:19Z StartSession target=i-0b21e77c45f0ad334 actor=adm.lena","2026-03-02T09:04:55Z TerminateSession target=i-0b21e77c45f0ad334 actor=adm.lena"]},"widget":{"type":"fill","question":"Complete the sentence with the two event names from the log:","text":"Event ___ opens an interactive shell on an instance, while event ___ runs a one-shot command through a document.","blanks":["StartSession","SendCommand"],"bank":["StartSession","SendCommand","RunInstances","AssumeRole","TerminateSession"]}},{"id":"e07","type":"mcq","title":"Why both sides like it","summary":"The one property that makes Session Manager attractive.","scenario":"Your team lead asks why attackers bother with Session Manager when the instance already runs an SSH daemon. The answer is one property that admins also love, and it is the reason the firewall team could close most inbound rules years ago without breaking a single administration workflow anywhere in the estate.","question":"Which property makes the session path attractive to admins and attackers alike?","hint":"Think about what the network team no longer has to open.","explanation":"The shell arrives through the cloud service's outbound-connected relay, so no inbound port has to be open on the instance. The wrong options describe things Session Manager does not do: it does not store local password files, does not switch logging off, and works on Windows and Linux.\n\nNo open inbound port plus valid credentials equals quiet access.","study":"Study why port-closing reviews after cloud adoption often miss the service-relay path.","options":["It needs no open inbound port","It stores passwords in a local file","It turns off all guest logging quietly","It only ever works on Windows guests"],"correct":0},{"id":"e08","type":"match","title":"Agent, service, shell, log","summary":"Match each piece to the job it does.","scenario":"Before the lab continues, the trainer checks your vocabulary. Four names appear in every report about cloud remote services: the agent on the guest, the interactive shell feature, the one-shot command feature, and the audit log that records control-plane actions. Mixing them up in a report costs credibility.","question":"Match each name to the job it does:","hint":"One name is a log, not a component.","explanation":"The SSM Agent is the small program on the instance that receives work; Session Manager is the interactive shell relay; Run Command pushes one-shot commands to many instances at once; CloudTrail is the control-plane audit log that records StartSession and SendCommand calls.\n\nIf you can name the four pieces, you can read any report about this technique.","study":"Study the vocabulary split between guest-side agent and control-plane service features.","pairs":[{"left":"SSM Agent","right":"Small program on the instance that receives work"},{"left":"Session Manager","right":"Interactive shell relayed by the cloud service"},{"left":"Run Command","right":"One-shot command execution at many instances"},{"left":"CloudTrail","right":"Audit log of control-plane API calls"}]},{"id":"e09","type":"fill","title":"Where the trace lives","summary":"Name the two homes of the evidence.","scenario":"An incident reviewer asks where proof of a Session Manager shell can be found after the fact. Two places matter at this level: the control-plane audit service, and the agent's own directory on a Linux guest. Your note must name both exactly, because the reviewer will check them character by character.","question":"Complete the reviewer note with the two missing words:","hint":"The control-plane log is a trail; the guest directory is named after the agent.","explanation":"The control-plane record of StartSession and SendCommand sits in CloudTrail, and the agent writes its own activity under /var/log/amazon/ssm on Linux guests. Syslog and sshd logs may hold other clues but not the service conversation, and the console is just the web UI.\n\nTwo homes, two log families — check both in every case.","study":"Study the default agent log path /var/log/amazon/ssm and the CloudTrail record layout.","text":"After a session closes, the control-plane record sits in ___, while the agent's own activity on a Linux guest is written under /var/log/amazon/___.","blanks":["CloudTrail","ssm"],"bank":["CloudTrail","ssm","sshd","syslog","console"]},{"id":"e10","type":"order","title":"Responder's first four looks","summary":"Order the first checks after a session alert.","scenario":"Your queue shows a StartSession alert on a production instance at an unusual hour. Before anyone touches the instance, the lead asks for the four checks in the order a disciplined responder runs them, starting with who owned the session and ending with the comparison against normal admin hours for that team.","question":"Arrange the four checks in the responder's order:","hint":"Attribution comes before the guest, and the guest comes before the baseline.","explanation":"First confirm which account owned the session, because everything else hangs on that. Then read the CloudTrail event for the target and time, then the agent log on the instance for what actually ran, and finally compare the hour with the team's normal admin window to decide whether this is habit or misuse.\n\nDoing the baseline first is the classic mistake — you compare before you know what you found.","study":"Study alert triage order: attribute, read the event, read the guest, baseline.","items":["Confirm the account that owned the session","Read the CloudTrail event for target and time","Check the agent log on the instance for what ran","Compare the hour with normal admin activity"]},{"id":"e11","type":"terminal","title":"Count the managed fleet","summary":"List every instance the service manages.","scenario":"During the same lab shift you must confirm which instances the service actually manages before planning any response. The simulator knows the read-only inventory command from the syntax panel, and the lab policy forbids any command that removes an instance or an activation record from the service.","question":"Type the command that lists the managed instances with their status:","hint":"describe-instance-information is the inventory read; add --output text for a compact table.","explanation":"aws ssm describe-instance-information is the read-only inventory call and --output text renders a compact table. Deregistering an instance or deleting an activation removes the very record you are meant to inventory, and both destroy history during an investigation.\n\nRead-only inventory commands are always the safe first step.","study":"Study aws ssm describe-instance-information and the PingStatus values it returns.","prompt":"operator@mgmt:~$","skill":"ssm-inventory-check","knownTools":["aws","ssm","jq","column"],"expected":"aws ssm describe-instance-information --output text","elements":[{"label":"the read-only inventory command","any":["aws ssm describe-instance-information"]},{"label":"the compact output switch","any":["--output text"]}],"forbidden":[{"any":["deregister-instance","delete-activation"],"why":"Both remove the instance record from the service and destroy the trail you are inventorying."}],"output":["InstanceId             PingStatus       Platform","i-0f3a9c27b61d8e401    Online           Linux","i-0b21e77c45f0ad334    Online           Linux","i-0c8d2e6f1a9b3c7d5    ConnectionLost   Windows"],"syntaxPanel":"aws ssm describe-instance-information [--output text|json]\n  describe-instance-information   list instances managed by the service\n  --output text                   compact table instead of JSON\n  example: aws ssm describe-instance-information --output json","sampleOutput":"InstanceId           PingStatus   Platform\ni-0aa11bb22cc33dd44  Online       Linux"},{"id":"e12","type":"multi","title":"What one stolen password unlocks","summary":"Select every move the run-command service enables.","scenario":"A phishing mail harvested the password of an admin who holds broad Systems Manager rights. The attacker has valid credentials but no network foothold inside the VPC. You are briefing the helpdesk on what such an account could do next, so they recognise the signs on a ticket before it is closed.","question":"Select every move that valid Systems Manager rights could enable for the attacker:","hint":"Two options belong to other services entirely.","explanation":"With broad rights the attacker can run one command across many instances with SendCommand, open interactive shells through Session Manager, and reach guests without touching SSH keys. Resetting every directory password is a directory-service action and decrypting stored backups is not what this service does.\n\nThe pattern to remember: valid account plus management service equals reach without a foothold.","study":"Study how T1078 valid accounts combine with management services for lateral movement.","options":["Run one command on many instances at once","Open interactive shells through Session Manager","Reset every password in the company directory","Reach instance shells without touching SSH keys","Automatically decrypt stored database backups"],"correct":[0,1,3]},{"id":"e13","type":"fill","title":"Same idea, other clouds","summary":"Complete the cross-provider sentence.","scenario":"Your cheat sheet now grows a second row for Azure and Google Cloud. The sentence must name the Azure component that carries Run Command to the machine, the Google feature that turns account rights into ssh access, and the Google command-line tool that starts the login from a terminal window.","question":"Complete the cheat-sheet sentence with the correct terms:","hint":"Azure: the agent piece; Google: the login feature and its CLI tool.","explanation":"Azure delivers Run Command through the VM agent that already runs on the machine, and Google Cloud uses OS Login so that account rights enable ssh through the gcloud CLI. IMDS is instance metadata — related cloud plumbing, but a different technique — and the console is just the web UI.\n\nSame idea, three providers: control plane plus an agent or login feature.","study":"Study Azure Run Command via the VM agent and Google OS Login with gcloud compute ssh.","text":"On Azure the VM ___ carries Run Command to the machine, while Google Cloud pairs ___ Login with the ___ CLI for account-based ssh.","blanks":["agent","OS","gcloud"],"bank":["agent","OS","gcloud","IMDS","SSM","console"]},{"id":"e14","type":"mcq","title":"Spot the odd event out","summary":"One event name does not execute or open anything.","scenario":"A junior analyst groups four CloudTrail event names together as 'command and session activity'. One of them does not belong: it creates infrastructure instead of reaching an existing machine. You have thirty seconds to correct the group before the shift handover notes go out to the whole floor.","question":"Which event name creates a new machine instead of reaching an existing one?","hint":"Three names touch existing instances; one builds a new one.","explanation":"RunInstances creates a new EC2 machine — provisioning, not remote execution. SendCommand, StartSession and TerminateSession all act on instances that already exist: they run a command, open a shell, or close one.\n\nProvisioning events still matter in lateral-movement cases — attackers spin up their own machines — but they are a different event family.","study":"Study the difference between provisioning events like RunInstances and remote-execution events like SendCommand.","options":["SendCommand","StartSession","RunInstances","TerminateSession"],"correct":2},{"id":"e15","type":"match","title":"Who uses this at work","summary":"Match each role to its typical task.","scenario":"A careers day poster needs one honest line per security role about cloud remote services. The four roles below all touch T1021.007 in a normal week, each from a different angle: watching the queues, rebuilding timelines, testing the path politely, and writing the rule that catches it next time.","question":"Match each role to the task it performs with this technique:","hint":"One role writes alerts, one attacks politely, one watches queues, one rebuilds timelines.","explanation":"The SOC analyst watches CloudTrail queues for odd StartSession hours; the incident responder rebuilds the attacker's path across instances; the red team tests whether a stolen credential can reach more servers; the detection engineer writes the alert that fires on SendCommand bursts.\n\nFour roles, one shared telemetry: the cloud audit log.","study":"Study how each security role consumes the same cloud telemetry differently.","pairs":[{"left":"SOC analyst","right":"Watches CloudTrail queues for odd session hours"},{"left":"Incident responder","right":"Rebuilds the attacker path across instances"},{"left":"Red team","right":"Tests whether stolen credentials reach more servers"},{"left":"Detection engineer","right":"Writes alerts on SendCommand bursts"}]},{"id":"e16","type":"order","title":"Hardening in the right order","summary":"Order four controls from cheapest to most ongoing.","scenario":"After a tabletop exercise, the cloud team agrees to reduce T1021.007 risk with four controls. Finance wants the cheapest identity fix first, the platform team wants the logging switched on before any policy change, and the weekly review comes last because it needs the logs the earlier steps produce.","question":"Arrange the four controls in the agreed order:","hint":"MFA is first because it needs no policy change; the weekly review is last.","explanation":"Multi-factor authentication comes first because it protects every login at once and needs no policy surgery. A separate least-privilege admin account for SSM work comes next, then Session Manager logging to S3 or CloudWatch so sessions become reviewable, and finally the weekly CloudTrail review for sessions outside admin hours.\n\nEach step builds the evidence base the next step needs.","study":"Study the mitigation order: MFA, account tiering, session logging, recurring review.","items":["Turn on multi-factor authentication for cloud logins","Give admins a separate least-privilege account for SSM work","Turn on Session Manager logging to S3 or CloudWatch","Review CloudTrail weekly for sessions outside admin hours"]}];

/* ==== utils ==== */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function norm(s){
  return String(s == null ? "" : s).toLowerCase().replace(/\s+/g," ").replace(/[.,;:!]+$/,"").trim();
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function fmt1(n){ return (Math.round(n * 100) / 100).toFixed(1); }
function wordCount(s){ return String(s || "").split(/\s+/).filter(Boolean).length; }
function $(id){ return document.getElementById(id); }
function byClass(root, cls){ return root.getElementsByClassName(cls); }

  fill: { name: "Fill-in-the-blank", desc: "complete each gap — a word bank is provided." },
  terminal: { name: "Terminal simulation", desc: "type a command in the simulated shell, then press Check. Dangerous near-miss commands are flagged." },
  logview:  { name: "Log analysis", desc: "filter a log panel (like Kibana or Splunk), then answer the question below it." },
  decision: { name: "Decision tree", desc: "work through the steps one by one — the final Check grades every step." }
};

/* ==== timer ==== */
function setTimerState(next){
  var now = Date.now();
  if(S.tStateAt != null){
    var dt = (now - S.tStateAt) / 1000;
    if(S.tState === "PAUSED_MANUAL") S.pauseManual += dt;
    if(S.tState === "PAUSED_AUTO_CHECK") S.pauseAutoCheck += dt;
  }
  S.tState = next;
  S.tStateAt = now;
  updateHeader();
}
setInterval(function(){
  if(S.tState === "RUNNING"){
    S.remaining -= 1;
    S.elapsed += 1;
    if(S.remaining <= 0){
      S.remaining = 0;
      updateClock();
      finish();
      return;
    }
    updateClock();
  }
}, 1000);
function updateClock(){ var c = $("tb-clock"); if(c) c.textContent = fmtClock(S.remaining); }

/* ==== header ==== */
function sevClass(){ return "sev-" + META.severity; }
function curPos(){ return S.order[S.idx]; }
function answeredCount(){
  var n = 0;
  for(var k in S.checked){ if(Object.prototype.hasOwnProperty.call(S.checked, k)) n++; }
  return n;
}
function pendingSkips(){
  return S.skipList.filter(function(i){ return !S.checked[i]; });
}
function updateHeader(){
  var counter = $("tb-counter"), stateEl = $("tb-state");
  var total = EXAMS.length, done = answeredCount();
  if(S.screen === "exam" || S.screen === "review"){
    counter.textContent = (S.phase === "review" && S.reviewPos >= 0)
      ? ("Review " + (S.reviewPos + 1) + " / " + (S.reviewTotal || pendingSkips().length))
      : ((S.phase === "review") ? ("Review pool: " + pendingSkips().length)
      : ("Exercise " + (S.idx + 1) + " / " + total));
  } else {
    counter.textContent = "Exercises " + done + " / " + total;
  }
  var sev = $("tb-sev");
  sev.className = "badge " + sevClass();
  sev.textContent = META.severity.replace("_", " ");
  updateClock();
  $("tb-scoreval").textContent = fmt1(S.score);
  $("progbar").style.width = (total ? (done / total * 100) : 0) + "%";
  /* state chip */
  if(S.tState === "PAUSED_MANUAL"){
    stateEl.hidden = false;
    stateEl.className = "tb-state manual";
    stateEl.innerHTML = '<span aria-hidden="true">⏸</span> Paused (manual)';
  } else if(S.tState === "PAUSED_AUTO_CHECK"){
    stateEl.hidden = false;
    stateEl.className = "tb-state autocheck";
    stateEl.innerHTML = '<span aria-hidden="true">⏸</span> Auto-paused — checking';
  } else {
    stateEl.hidden = true;
  }
  /* buttons */
  var ex = curPos();
  var inExercise = (S.screen === "exam" || S.screen === "review") && ex != null && S.tState !== "ENDED";
  $("btn-hint").disabled = !inExercise || S.checked[ex] != null || S.hintsUsed[ex] === true;
  $("btn-skip").disabled = !inExercise || S.checked[ex] != null || S.phase === "review";
  $("btn-pause").disabled = !(S.tState === "RUNNING" || S.tState === "PAUSED_AUTO_CHECK");
}

/* ==== postMessage integration ==== */
window.addEventListener("message", function(ev){
  var d = ev.data;
  if(!d || typeof d !== "object") return;
  if(d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT"){
    S.init = d;
    var slot = $("candline");
    if(slot && d.username){
      slot.textContent = "Candidate: " + d.username + (d.country ? " · " + d.country : "");
      slot.style.display = "block";
    }
  }
});
function postScore(){
  if(S.scorePosted) return;
  S.scorePosted = true;
  var rounded = Math.round(S.score);
  var total = 0, i;
  for(i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null) total++;
  }
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var msg = {
    type: "CYBERPULSE_SCORE",
    topicId: META.topicId,
    batch: META.batch,
    score: rounded,
    total: total,
    percent: percent,
    passed: passed
  };
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage(msg, location.origin);
    }
  }catch(e){ /* standalone file:// — no parent handshake */ }
}

/* ==== answer defaults ==== */
function defaultAnswer(ex){
  var i, d;
  switch(ex.type){
    case "mcq": return { sel: -1 };
    case "multi": return { sel: [] };
    case "match":
      d = []; for(i = 0; i < ex.pairs.length; i++) d.push(-1); return { assign: d };
    case "order":
      d = []; for(i = 0; i < ex.items.length; i++) d.push(i);
      return { seq: shuffle(d) };
    case "fill":
      d = []; for(i = 0; i < ex.blanks.length; i++) d.push(""); return { vals: d };
    case "terminal": return { cmd: "" };
    case "logview": return { w: defaultAnswer(ex.widget) };
    case "decision":
      d = []; for(i = 0; i < ex.steps.length; i++) d.push(-1); return { steps: d, cursor: 0 };
  }
  return {};
}
function ensureAnswer(ex, i){
  if(S.answers[i] == null) S.answers[i] = defaultAnswer(ex);
  return S.answers[i];
}

/* ==== render exercise ==== */

  } else {

      (S.phase === "review" ? "Back to review list" : (lastMain ? "Final submit &amp; results" : "Next exercise")) +

function scenInner(ex){
  var out = "";
  var paras = String(ex.scenario).split(/\n\n+/);
  for(var p = 0; p < paras.length; p++) out += "<p>" + esc(paras[p]) + "</p>";
  if(ex.artefacts && ex.artefacts.length){
    for(var a = 0; a < ex.artefacts.length; a++){
      var art = ex.artefacts[a];
      var long = String(art.content || "").split("\n").length > 25;
      out += '<details class="artef"' + (long ? "" : " open") + '><summary>' + esc(art.label) + '</summary><div class="artbody">' + artefactBody(art) + "</div></details>";
    }
  }
  return out;
}
function artefactBody(art){
  if(art.kind === "table"){
    var rows = String(art.content).split("\n");
    var out = '<table class="attable">';
    for(var r = 0; r < rows.length; r++){
      var cells = rows[r].split(" | ");
      out += "<tr>";
      for(var c = 0; c < cells.length; c++){
        out += (r === 0 ? "<th>" : "<td>") + esc(cells[c]) + (r === 0 ? "</th>" : "</td>");
      }
      out += "</tr>";
    }
    return out + "</table>";
  }
  return '<pre class="mono">' + esc(art.content) + "</pre>";
}
function hintHTML(ex){
  return '<div class="hintbox" role="note"><span class="hb">💡 HINT</span>' + esc(ex.hint) +
         '<div class="penaltynote">Hint used — 10% credit penalty applies to this exercise.</div></div>';
}

/* ==== type renderers ==== */
function optionRow(text, idx, chosen, mark, cls){
  return '<button type="button" class="opt ' + (cls || "") + '" data-i="' + idx + '" aria-pressed="' + (chosen ? "true" : "false") + '">' +
    '<span class="mark" aria-hidden="true">' + (mark || "") + "</span><span>" + esc(text) + "</span></button>";
}
function renderByType(ex, area, i, lock, res){
  area.innerHTML = "";
  var ans = ensureAnswer(ex, i);
  var w = document.createElement("div");
  switch(ex.type){
    case "mcq":      renderChoice(ex, w, ans, lock, res, false, ""); break;
    case "multi":    renderChoice(ex, w, ans, lock, res, true, ""); break;
    case "match":    renderMatch(ex, w, ans, lock, res); break;
    case "order":    renderOrder(ex, w, ans, lock, res); break;
    case "fill":     renderFill(ex, w, ans, lock, res, null, ""); break;
    case "terminal": renderTerminal(ex, w, ans, lock, res); break;
    case "logview":  renderLogview(ex, w, ans, lock, res); break;
    case "decision": renderDecision(ex, w, ans, lock, res); break;
  }
  area.appendChild(w);
}
function renderChoice(ex, root, ans, lock, res, isMulti, path){
  var correct = isMulti ? ex.correct : [ex.correct];
  ex.options.forEach(function(opt, oi){
    var chosen = isMulti ? ans.sel.indexOf(oi) !== -1 : ans.sel === oi;
    var mark = "", cls = "";
    if(!lock){
      if(chosen){ mark = isMulti ? "☑" : "◉"; cls = "sel"; }
    } else {
      var isCorr = correct.indexOf(oi) !== -1;
      if(isCorr){ mark = "✓"; cls = "correct"; }
      else if(chosen){ mark = "✗"; cls = "wrong"; }
      else { cls = "dim"; }
    }
    root.insertAdjacentHTML("beforeend", optionRow(opt, oi, chosen, mark, cls));
  });
  var btns = byClass(root, "opt");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      btn.addEventListener("click", function(){
        if(lock) return;
        var oi = parseInt(btn.getAttribute("data-i"), 10);
        if(isMulti){
          var p = ans.sel.indexOf(oi);
          if(p === -1) ans.sel.push(oi); else ans.sel.splice(p, 1);
          btn.classList.toggle("sel");
          btn.setAttribute("aria-pressed", btn.classList.contains("sel") ? "true" : "false");
          btn.querySelector(".mark").textContent = btn.classList.contains("sel") ? "☑" : "";
        } else {
          ans.sel = oi;
          for(var z = 0; z < btns.length; z++){
            btns[z].classList.remove("sel");
            btns[z].setAttribute("aria-pressed", "false");
            var mk = btns[z].querySelector(".mark"); if(mk) mk.textContent = "";
          }
          btn.classList.add("sel");
          btn.setAttribute("aria-pressed", "true");
          btn.querySelector(".mark").textContent = "◉";
        }
      });
    })(btns[b]);
  }
}
function renderMatch(ex, root, ans, lock, res){
  var n = ex.pairs.length;
  var chipSel = -1;
  var html = '<div class="mgrid"><div class="mcol"><h4>Items</h4>';
  for(var z = 0; z < n; z++){
    html += '<div class="mrow"><div class="mleft">' + esc(ex.pairs[z].left) + '</div>' +
            '<button type="button" class="mzone" data-z="' + z + '" aria-label="Assigned value for ' + esc(ex.pairs[z].left) + '">— drop here —</button></div>';
  }
  html += '</div><div class="mbank"><h4>Answer bank</h4>';
  ex.pairs.forEach(function(pr, ri){
    html += '<button type="button" class="mchip" draggable="true" data-r="' + ri + '">' + esc(pr.right) + "</button>";
  });
  html += '</div></div><p class="mhintline">Click a bank item, then click a drop zone — or drag the item onto a zone. Click a filled zone to clear it.</p>';
  root.innerHTML = html;
  var zones = byClass(root, "mzone");
  var chips = byClass(root, "mchip");
  function paint(){
    for(var z = 0; z < n; z++){
      var zz = zones[z];
      var v = ans.assign[z];
      if(v === -1){
        zz.textContent = "— drop here —";
        zz.classList.remove("filled", "correct", "wrong");
      } else {
        zz.textContent = ex.pairs[v].right;
        zz.classList.add("filled");
        if(lock){
          zz.classList.remove("wrong", "correct");
          zz.classList.add(v === z ? "correct" : "wrong");
        }
      }
    }
    for(var c = 0; c < chips.length; c++){
      var used = ans.assign.indexOf(c) !== -1;
      chips[c].classList.toggle("used", used);
      if(used) chips[c].classList.remove("selchip");
    }
  }
  function assign(z, r){
    if(r === -1) return;
    for(var k = 0; k < n; k++){ if(ans.assign[k] === r) ans.assign[k] = -1; }
    ans.assign[z] = r;
    chipSel = -1;
    paint();
  }
  for(var zi = 0; zi < zones.length; zi++){
    (function(z){
      var zz = zones[z];
      zz.addEventListener("click", function(){
        if(lock) return;
        if(chipSel !== -1) assign(z, chipSel);
        else if(ans.assign[z] !== -1){ ans.assign[z] = -1; paint(); }
      });
      zz.addEventListener("dragover", function(e){ if(!lock){ e.preventDefault(); zz.classList.add("dragover"); } });
      zz.addEventListener("dragleave", function(){ zz.classList.remove("dragover"); });
      zz.addEventListener("drop", function(e){
        e.preventDefault(); zz.classList.remove("dragover");
        if(lock) return;
        var r = parseInt(e.dataTransfer.getData("text/plain"), 10);
        if(!isNaN(r)) assign(z, r);
      });
    })(zi);
  }
  for(var ci = 0; ci < chips.length; ci++){
    (function(c){
      var cc = chips[c];
      cc.addEventListener("click", function(){
        if(lock) return;
        if(chipSel === c){ chipSel = -1; cc.classList.remove("selchip"); }
        else {
          chipSel = c;
          for(var k = 0; k < chips.length; k++) chips[k].classList.remove("selchip");
          cc.classList.add("selchip");
        }
      });
      cc.addEventListener("dragstart", function(e){
        e.dataTransfer.setData("text/plain", String(c));
        e.dataTransfer.effectAllowed = "copy";
      });
    })(ci);
  }
  paint();
}
function renderOrder(ex, root, ans, lock, res){
  root.innerHTML = '<div class="obank"><h4>Steps — put them in the correct order</h4><ol class="ordlist"></ol>' +
    '<p class="mhintline">Drag a step onto another step, or use ▲ / ▼.</p></div>';
  var list = root.querySelector(".ordlist");
  function paint(){
    list.innerHTML = "";
    ans.seq.forEach(function(itemIdx, pos){
      var li = document.createElement("li");
      li.className = "orditem";
      li.setAttribute("draggable", "true");
      li.setAttribute("data-pos", String(pos));
      var mark = "";
      if(lock) mark = itemIdx === pos ? " ✓" : "";
      li.innerHTML = '<span class="num">' + (pos + 1) + '</span><span class="txt">' + esc(ex.items[itemIdx]) + mark + "</span>" +
        '<span class="ordbtns"><button type="button" data-mv="up" aria-label="Move up" ' + (lock ? "disabled" : "") + ">▲</button>" +
        '<button type="button" data-mv="down" aria-label="Move down" ' + (lock ? "disabled" : "") + ">▼</button></span>";
      if(lock) li.classList.add(itemIdx === pos ? "correct" : "wrong");
      list.appendChild(li);
      li.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", String(pos)); });
      li.addEventListener("dragover", function(e){ if(!lock) e.preventDefault(); });
      li.addEventListener("drop", function(e){
        e.preventDefault();
        if(lock) return;
        var from = parseInt(e.dataTransfer.getData("text/plain"), 10);
        var to = parseInt(li.getAttribute("data-pos"), 10);
        if(!isNaN(from) && !isNaN(to) && from !== to) move(from, to);
      });
    });
    var btns = list.querySelectorAll("button[data-mv]");
    for(var b = 0; b < btns.length; b++){
      (function(btn){
        btn.addEventListener("click", function(){
          if(lock) return;
          var li = btn.closest(".orditem");
          var pos = parseInt(li.getAttribute("data-pos"), 10);
          var dir = btn.getAttribute("data-mv") === "up" ? pos - 1 : pos + 1;
          if(dir < 0 || dir >= ans.seq.length) return;
          move(pos, dir);
        });
      })(btns[b]);
    }
  }
  function move(from, to){
    var it = ans.seq.splice(from, 1)[0];
    ans.seq.splice(to, 0, it);
    paint();
  }
  paint();
}
function renderFill(ex, root, ans, lock, res, ansObjRef, path){
  var parts = String(ex.text).split("___");
  var html = '<div class="fillwrap">';
  for(var k = 0; k < ex.blanks.length; k++){
    html += esc(parts[k] || "");
    var state = "";
    if(lock && res && res.itemsByKey){
      var ok = res.itemsByKey[path + "b" + k];
      state = ok === "ok" ? " correct" : " wrong";
    }
    html += '<input class="fillin' + state + '" data-b="' + k + '" value="' + esc(ans.vals[k]) + '"' + (lock ? " disabled" : "") + ' aria-label="Blank ' + (k + 1) + '">';
  }
  html += esc(parts[ex.blanks.length] || "") + "</div>";
  html += '<div class="fbank" role="listbox" aria-label="Word bank">';
  ex.bank.forEach(function(word){
    html += '<button type="button" class="fchip">' + esc(word) + "</button>";
  });
  html += "</div>";
  root.innerHTML = html;
  var inputs = byClass(root, "fillin");
  var chips = byClass(root, "fchip");
  var lastFocus = 0;
  for(var ii = 0; ii < inputs.length; ii++){

/* ==== grading ==== */
function gradeFillLike(text, blanks, vals){
  var items = [], H = 0, W = 0, N = blanks.length;
  for(var k = 0; k < N; k++){
    var v = norm(vals[k]);
    var ok = v !== "" && v === norm(blanks[k]);
    items.push({ ok: ok, state: v === "" ? "miss" : (ok ? "ok" : "bad"),
      text: v === "" ? ('Blank ' + (k + 1) + ' — missed. Correct: "' + blanks[k] + '"')
        : (ok ? ('Blank ' + (k + 1) + ' — correct: "' + blanks[k] + '"')
        : ('Blank ' + (k + 1) + ' — "' + vals[k] + '" is wrong. Correct: "' + blanks[k] + '"')) });
    if(ok) H++; else if(v !== "") W++;
  }
  return { H: H, W: W, N: N, items: items };
}
function gradeChoiceLike(options, correct, sel, isMulti){
  var items = [], H = 0, W = 0, N = correct.length;
  var selArr = isMulti ? (sel || []) : (sel === -1 ? [] : [sel]);
  for(var c = 0; c < correct.length; c++){
    var ci = correct[c];
    if(selArr.indexOf(ci) !== -1){ items.push({ ok: true, state: "ok", text: "✓ You selected the correct option: " + options[ci] }); H++; }
    else items.push({ ok: false, state: "miss", text: "Missed the correct option: " + options[ci] });
  }
  for(var s = 0; s < selArr.length; s++){
    var si = selArr[s];
    if(correct.indexOf(si) === -1){
      items.push({ ok: false, state: "bad", text: "Wrong selection: " + options[si] });
      W++;
    }
  }
  return { H: H, W: W, N: N, items: items };
}
function grade(ex, ans, hintUsed){
  var g, i;
  switch(ex.type){
    case "mcq":
      g = gradeChoiceLike(ex.options, [ex.correct], ans.sel, false);
      break;
    case "multi":
      g = gradeChoiceLike(ex.options, ex.correct, ans.sel, true);
      break;
    case "match":
      g = { H: 0, W: 0, N: ex.pairs.length, items: [] };
      for(i = 0; i < ex.pairs.length; i++){
        var a = ans.assign[i];
        if(a === -1){ g.items.push({ state: "miss", text: 'Missed: "' + ex.pairs[i].left + '" → correct partner: "' + ex.pairs[i].right + '"' }); }
        else if(a === i){ g.H++; g.items.push({ state: "ok", text: '✓ "' + ex.pairs[i].left + '" → "' + ex.pairs[i].right + '"' }); }
        else { g.W++; g.items.push({ state: "bad", text: 'Wrong: "' + ex.pairs[i].left + '" → you placed "' + ex.pairs[a].right + '", correct: "' + ex.pairs[i].right + '"' }); }
      }
      break;
    case "order":
      g = { H: 0, W: 0, N: ex.items.length, items: [] };
      for(i = 0; i < ex.items.length; i++){
        if(ans.seq[i] === i){ g.H++; g.items.push({ state: "ok", text: "Position " + (i + 1) + " — correct: " + ex.items[i] }); }
        else { g.W++; g.items.push({ state: "bad", text: "Position " + (i + 1) + " — you placed \"" + ex.items[ans.seq[i]] + '", correct: "' + ex.items[i] + '"' }); }
      }
      break;
    case "fill":
      g = gradeFillLike(ex.text, ex.blanks, ans.vals);
      break;
    case "terminal": {
      var cmd = String(ans.cmd || "");
      g = { H: 0, W: 0, N: ex.elements.length, items: [], warn: [], canon: null };
      var low = cmd.toLowerCase();
      if(!cmd){
        g.items.push({ state: "miss", text: "No command was run — nothing to grade." });
      } else {
        for(i = 0; i < ex.elements.length; i++){
          var el = ex.elements[i];
          var hit = false;
          for(var v = 0; v < el.any.length; v++){
            if(low.indexOf(String(el.any[v]).toLowerCase()) !== -1){ hit = true; break; }
          }
          if(hit){ g.H++; g.items.push({ state: "ok", text: "✓ Element matched: " + el.label }); }
          else g.items.push({ state: "miss", text: "Missing element: " + el.label });
        }
        (ex.forbidden || []).forEach(function(f){
          for(var v2 = 0; v2 < f.any.length; v2++){
            if(low.indexOf(String(f.any[v2]).toLowerCase()) !== -1){
              g.warn.push("⚠ DANGEROUS — NEAR MISS: " + f.why);
              break;
            }
          }
        });
      }
      if(g.H < g.N) g.canon = ex.expected;
      break;
    }
    case "logview": {
      var wg;
      if(ex.widget.type === "fill") wg = gradeFillLike(ex.widget.text, ex.widget.blanks, ans.w.vals);
      else if(ex.widget.type === "multi") wg = gradeChoiceLike(ex.widget.options, ex.widget.correct, ans.w.sel, true);
      else wg = gradeChoiceLike(ex.widget.options, [ex.widget.correct], ans.w.sel, false);
      g = { H: wg.H, W: wg.W, N: wg.N, items: wg.items.map(function(it){ return it; }) };
      break;
    }
    case "decision":
      g = { H: 0, W: 0, N: ex.steps.length, items: [] };
      for(i = 0; i < ex.steps.length; i++){
        var st = ex.steps[i];
        if(ans.steps[i] === st.correct){ g.H++; g.items.push({ state: "ok", text: (st.label || "Step " + (i + 1)) + " — correct: " + st.options[st.correct] }); }
        else if(ans.steps[i] === -1){ g.items.push({ state: "miss", text: (st.label || "Step " + (i + 1)) + " — not confirmed. Correct: " + st.options[st.correct] }); }
        else { g.W++; g.items.push({ state: "bad", text: (st.label || "Step " + (i + 1)) + " — wrong. Correct: " + st.options[st.correct] + ". " + st.why }); }
      }
      break;
    default:
      g = { H: 0, W: 0, N: 1, items: [] };
  }
  var raw = g.N > 0 ? Math.max(0, (g.H - g.W) / g.N) : 0;
  var penalty = hintUsed ? 0.10 : 0;
  var credit = Math.max(0, raw - penalty);
  var head = raw >= 0.999 ? "ok" : (raw <= 0.001 ? "bad" : "part");
  var headText = head === "ok" ? "✓ Correct" : (head === "bad" ? "✗ Incorrect" : "✓ Partially correct");
  var res = {
    credit: credit, raw: raw, head: head, headText: headText,
    H: g.H, W: g.W, N: g.N,
    items: g.items || [], warn: g.warn || [], canon: g.canon || null,
    itemsByKey: {}
  };
  if(ex.type === "fill"){
    for(var k1 = 0; k1 < (g.items || []).length; k1++) res.itemsByKey["b" + k1] = g.items[k1].state;
  } else if(ex.type === "logview" && ex.widget.type === "fill"){
    for(var k2 = 0; k2 < (g.items || []).length; k2++) res.itemsByKey["wb" + k2] = g.items[k2].state;
  }
  return res;
}

/* ==== check / feedback ==== */
function onCheck(){
  var i = curPos();

  if(S.tState === "RUNNING") setTimerState("PAUSED_AUTO_CHECK");
  var res = grade(ex, ensureAnswer(ex, i), S.hintsUsed[i] === true);
  res.wres = null;
  if(ex.type === "logview"){
    res.wres = { items: res.items, H: res.H, W: res.W, N: res.N };
  }
  S.checked[i] = res;
  S.score += res.credit;
  renderExercise();
}
function renderFeedback(i, res){
  var ex = EXAMS[i];
  var rows = "";

    (res.N > 1 ? " (" + res.H + "✓ " + res.W + "✗ " + (res.N - res.H - res.W) + "○ of " + res.N + ")" : "") + "</span></div>" +
    '<div class="fb-body">' + rows + canon +

/* ==== flow ==== */
function startExam(){
  S.order = shuffle(EXAMS.map(function(_, i){ return i; }));
  S.idx = 0;
  S.phase = "main";
  setTimerState("RUNNING");
  renderExercise();
}
function onCheckGuard(){ /* reserved */ }
function onNext(){
  if(S.phase === "review"){
    if(S.tState === "PAUSED_AUTO_CHECK") setTimerState("RUNNING");
    showReview();
    return;
  }
  if(S.tState === "PAUSED_AUTO_CHECK") setTimerState("RUNNING");
  if(S.idx < S.order.length - 1){
    S.idx++;
    renderExercise();
  } else {
    if(pendingSkips().length > 0) showReview();
    else finish();
  }
}
function onSkip(){
  if(S.phase === "review") return;
  var i = curPos();
  if(S.checked[i] != null) return;
  if(S.skipList.indexOf(i) === -1) S.skipList.push(i);
  $("actnote") && ($("actnote").textContent = "");
  if(S.idx < S.order.length - 1){
    S.idx++;
    renderExercise();
  } else {
    if(pendingSkips().length > 0) showReview();
    else finish();
  }
  updateHeader();
}
function onHint(){
  var i = curPos();

  if(S.checked[i] != null || S.hintsUsed[i]) return;

function finish(){
  setTimerState("ENDED");
  S.screen = "results";
  var m = $("main");
  var total = 0, full = 0, part = 0, bad = 0, skipped = 0;
  var partSum = 0;
  for(var i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null){
      total++;
      var c = S.checked[i].credit;
      if(c >= 0.999){ full++; }
      else if(c > 0){ part++; partSum += c; }
      else bad++;
    } else skipped++;
  }
  var rounded = Math.round(S.score);
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var pctColor = passed ? "var(--green)" : "var(--red)";
  var verdict = passed
    ? '<span class="res-verdict pass"><span aria-hidden="true">✓</span> PASSED</span>'
    : '<span class="res-verdict fail"><span aria-hidden="true">✗</span> NOT PASSED</span>';
  var avgPart = part > 0 ? (partSum / part) : 0;
  var rows = "";
  for(var q = 0; q < EXAMS.length; q++){
    var qi = S.order[q];
    var exq = EXAMS[qi];
    var st, cls;
    if(S.checked[qi] != null){
      var cc = S.checked[qi].credit;
      if(cc >= 0.999){ st = "✓ Correct"; cls = "st-ok"; }
      else if(cc > 0){ st = "✓ Partially correct"; cls = "st-part"; }
      else { st = "✗ Incorrect"; cls = "st-bad"; }
    } else { st = "⚠ Skipped — not answered"; cls = "st-skip"; }
    rows += "<tr><td>" + (q + 1) + "</td><td>" + esc(TYPE_LABEL[exq.type].name) + "</td><td>" + esc(exq.title) + '</td><td class="num">' +
      (S.checked[qi] != null ? S.checked[qi].credit.toFixed(2) : "—") + '</td><td class="' + cls + '">' + st + "</td></tr>";
  }
  m.innerHTML =
    '<section class="res-head"><div class="ring" style="--pct:' + percent + ";--rc:" + pctColor + '" role="img" aria-label="Final score ' + percent + ' percent"><div class="rin"><div><div class="pct">' + percent + '%</div><div class="of">SCORED</div></div></div></div>' +
    "<div>" + verdict +
      '<div class="res-sub">' + esc(META.attackId + " " + META.attackName + " — " + META.severity.replace("_"," ")) + "</div>" +
      '<div class="res-sub">Points: <b>' + S.score.toFixed(2) + "</b> (posted as " + rounded + ") from <b>" + total + "</b> answered of " + EXAMS.length + " · pass mark " + META.passMark + "%</div>" +
      '<div class="res-sub">Active time: <b>' + fmtClock(S.elapsed) + "</b> · budget " + META.timerMinutes + ":00</div>" +
    "</div></section>" +
    '<div class="statgrid">' +
      '<div class="statcard"><div class="sv ok">' + full + '</div><div class="sl">✓ Fully correct</div></div>' +
      '<div class="statcard"><div class="sv part">' + part + '</div><div class="sl">✓ Partial (avg ' + avgPart.toFixed(2) + ')</div></div>' +
      '<div class="statcard"><div class="sv bad">' + bad + '</div><div class="sl">✗ Fully incorrect</div></div>' +
      '<div class="statcard"><div class="sv skip">' + skipped + '</div><div class="sl">⚠ Skipped, never answered</div></div>' +
    "</div>" +
    '<div class="pausereport">⏱ <b>Pause report</b> — auto-paused during checks: <b>' + fmtClock(S.pauseAutoCheck) + "</b> · manual pauses: <b>" + fmtClock(S.pauseManual) + "</b>. No time passes during pauses.</div>" +
    '<table class="restable"><thead><tr><th>#</th><th>Type</th><th>Exercise</th><th>Credit</th><th>Result</th></tr></thead><tbody>' + rows + "</tbody></table>" +
    '<div class="actions" style="margin-top:18px"><button class="btn btn-primary" id="btn-retake" type="button">↻ Retake exam (reshuffled)</button></div>';
  $("btn-retake").addEventListener("click", retake);
  updateHeader();
  window.scrollTo(0, 0);
  setTimeout(postScore, 600);
}
function retake(){
  S.order = [];
  S.idx = 0;
  S.phase = "main";
  S.skipList = [];
  S.answers = {};
  S.checked = {};
  S.hintsUsed = {};
  S.score = 0;
  S.tState = "IDLE";
  S.tStateAt = null;
  S.pausedFrom = null;
  S.remaining = META.timerMinutes * 60;
  S.elapsed = 0;
  S.pauseManual = 0;
  S.pauseAutoCheck = 0;
  S.scorePosted = false;
  var po = $("pauseoverlay");
  po.classList.add("hidden");
  $("main").classList.remove("hidden");
  showIntro();
}

/* ==== pause / hint / skip wiring ==== */
$("btn-hint").addEventListener("click", onHint);
$("btn-skip").addEventListener("click", onSkip);
$("btn-pause").addEventListener("click", function(){
  if(S.tState === "RUNNING"){
    S.pausedFrom = null;
    setTimerState("PAUSED_MANUAL");
    $("pauseoverlay").classList.remove("hidden");
    $("main").classList.add("hidden");
    $("btn-resume").focus();
  } else if(S.tState === "PAUSED_AUTO_CHECK"){
    S.pausedFrom = "PAUSED_AUTO_CHECK";
    setTimerState("PAUSED_MANUAL");
    $("pauseoverlay").classList.remove("hidden");
    $("main").classList.add("hidden");
    $("btn-resume").focus();
  }
});
$("btn-resume").addEventListener("click", function(){
  $("pauseoverlay").classList.add("hidden");
  $("main").classList.remove("hidden");
  if(S.pausedFrom === "PAUSED_AUTO_CHECK"){
    S.pausedFrom = null;
    setTimerState("PAUSED_AUTO_CHECK");
  } else {
    setTimerState("RUNNING");
  }
});

/* ==== boot ==== */
$("tb-title").textContent = META.attackId + " " + META.attackName;
$("foot-meta").textContent = META.attackId + " · " + META.severity.replace("_", " ") + " · pass " + META.passMark + "%";
showIntro();

/* ==== automation hook (offline lab use) ==== */
function buildCorrectAns(ex){
  var i, a;
  switch(ex.type){
    case "mcq": return { sel: ex.correct };
    case "multi": return { sel: ex.correct.slice() };
    case "match":
      a = []; for(i = 0; i < ex.pairs.length; i++) a.push(i); return { assign: a };
    case "order":
      a = []; for(i = 0; i < ex.items.length; i++) a.push(i); return { seq: a };
    case "fill":
      a = []; for(i = 0; i < ex.blanks.length; i++) a.push(ex.blanks[i]); return { vals: a };
    case "terminal": return { cmd: ex.expected };
    case "logview": return { w: buildCorrectAns(ex.widget) };
    case "decision":
      a = []; for(i = 0; i < ex.steps.length; i++) a.push(ex.steps[i].correct);
      return { steps: a, cursor: ex.steps.length };
  }
  return {};
}
function buildWrongAns(ex){
  var i, a;
  switch(ex.type){
    case "mcq": return { sel: ex.correct === 0 ? 1 : 0 };
    case "multi": {
      var wrong = [];
      for(i = 0; i < ex.options.length && wrong.length < 1; i++){ if(ex.correct.indexOf(i) === -1) wrong.push(i); }
      return { sel: wrong };
    }
    case "match":
      a = []; for(i = 0; i < ex.pairs.length; i++) a.push((i + 1) % ex.pairs.length); return { assign: a };
    case "order":
      a = []; for(i = ex.items.length - 1; i >= 0; i--) a.push(i); return { seq: a };
    case "fill":
      a = []; for(i = 0; i < ex.blanks.length; i++) a.push("zz wrong"); return { vals: a };
    case "terminal": return { cmd: "echo zzz" };
    case "logview": return { w: buildWrongAns(ex.widget) };
    case "decision":
      a = []; for(i = 0; i < ex.steps.length; i++){ var w2 = (ex.steps[i].correct + 1) % ex.steps[i].options.length; a.push(w2); }
      return { steps: a, cursor: ex.steps.length };
  }
  return {};
}
window.__CP = {
  S: S,
  META: META,
  EXAMS: EXAMS,
  start: function(){ startExam(); },
  state: function(){
    return { screen: S.screen, tState: S.tState, remaining: S.remaining, elapsed: S.elapsed,
             score: S.score, idx: S.idx, phase: S.phase, posted: S.scorePosted };
  },
  correctAns: buildCorrectAns,
  wrongAns: buildWrongAns,
  fill: function(ans){ var i = curPos(); S.answers[i] = JSON.parse(JSON.stringify(ans)); renderExercise(); },
  fillIdx: function(idx, ans){ S.answers[idx] = JSON.parse(JSON.stringify(ans)); },
  check: function(){ onCheck(); },
  next: function(){ onNext(); },
  skip: function(){ onSkip(); },
  hint: function(){ onHint(); },
  gradeOne: function(i, ans){ return grade(EXAMS[i], ans, false); },
  pause: function(){ $("btn-pause").click(); },
  resume: function(){ $("btn-resume").click(); },
  finish: function(){ finish(); },
  postScore: postScore
};
</script>
