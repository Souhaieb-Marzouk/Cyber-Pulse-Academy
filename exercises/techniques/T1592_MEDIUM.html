<script>
var EXAM = {"meta":{"topicId":"t1592","batch":2,"title":"T1592 Gather Victim Host Information — Medium","difficulty":"medium","questionCount":15,"estimatedMinutes":35,"passMark":70},"severity":{"label":"MEDIUM","cls":"medium","meaning":"Two connected ideas per exercise. You must decide what to look at first. Distractors are mild but real."},"keywords":[{"theme":"Technique basics","items":["T1592 — Gather Victim Host Information","Technique (object type)","Tactic: Reconnaissance (TA0043)","Pre-compromise phase","Sub-technique T1592.001 Hardware","Sub-technique T1592.002 Software","Sub-technique T1592.003 Firmware","Sub-technique T1592.004 Client Configurations"]},{"theme":"What attackers collect","items":["CPU and RAM details","Device models","BIOS / UEFI versions","Operating system and patch level","Installed software versions","Service banners","SNMP sysDescr strings","Browser and mail client settings"]},{"theme":"How attackers collect","items":["Banner grabbing (curl -I, telnet, netcat)","SNMP queries (snmpwalk) with 'public'","nmap -sV service detection","masscan port sweeps","Shodan / Censys device databases","Wappalyzer / BuiltWith web fingerprinting","Reading victim-owned websites","Job postings and asset leaks"]},{"theme":"Neighbouring techniques","items":["T1589 Gather Victim Identity Information","T1590 Gather Victim Network Information","T1591 Gather Victim Org Information","T1593 Search Open Websites/Domains","T1594 Search Victim-Owned Websites","T1595 Active Scanning","T1595.002 Vulnerability Scanning","T1596 Search Open Technical Databases","T1597 Search Closed Sources"]},{"theme":"Telemetry and detection","items":["Web access logs (method + User-Agent)","Firewall and connection logs","IDS/IPS scanner signatures","DNS analytics","Honeypots","Probe cadence and low-and-slow patterns","False positives: uptime monitors, vendor scans","Tuning with asset and maintenance inventories"]},{"theme":"Mitigations and controls","items":["M1056 Pre-compromise","server_tokens off / banner discipline","Disable SNMP v1/v2c 'public'","Remove end-of-life exposed hosts","Patch and reduce exposed surface","Rate limiting and tarpits","WAF header normalisation"]},{"theme":"Real-world use and roles","items":["SOC alert triage","CTI reporting with ATT&CK IDs","Attack surface management","Detection engineering","Red team OSINT in authorised tests","Exploit tailoring before T1190","Edge-device recon playbooks (Volt Typhoon-style)"]}],"intro":["This exam is about <b>MITRE ATT&amp;CK technique T1592 — Gather Victim Host Information<\/b>. ATT&amp;CK is a free, public knowledge base that describes what real attackers do. Every action gets an ID. T1592 is a <b>Technique<\/b> (an object type that describes one attacker behaviour). It lives inside the <b>Reconnaissance tactic (TA0043)<\/b>. A tactic is a phase of an attack. Reconnaissance is the first phase: it happens <b>before<\/b> the attacker gets into a network. In this phase you will learn how attackers study a victim's computers, and how defenders work with that behaviour.","<b>What the technique describes.<\/b> The attacker collects facts about the victim's hosts (computers and devices). The facts fall into four groups, and each group is a sub-technique with its own ID: <b>T1592.001 Hardware<\/b> (CPU, RAM, device models), <b>T1592.002 Software<\/b> (operating systems, installed programs, exact versions, patch levels), <b>T1592.003 Firmware<\/b> (BIOS/UEFI versions baked into chips), and <b>T1592.004 Client Configurations<\/b> (browser types and versions, mail client settings, VPN client setups on staff devices).","<b>Why attackers do it.<\/b> Host facts make attacks precise. If an attacker learns that a web server runs an old software version, they can search for a known bug in that version. If they learn which remote-access tool a company uses, they can prepare an attack that fits that tool. Good reconnaissance saves the attacker attempts and lowers the chance that noise triggers an alert. This is why T1592 often feeds the next phase, Initial Access, for example exploiting a public-facing application (T1190).","<b>How attackers do it.<\/b> Often from outside the victim's network. They grab service banners (a banner is the short introduction a service sends: for example a web server saying 'Server: nginx/1.18.0'). They query devices with SNMP when the default community string 'public' still works. They scan with tools like nmap or masscan. They read public device databases such as Shodan or Censys, which index banners from millions of exposed devices. They fingerprint web technology from the browser with tools like Wappalyzer.","<b>Where you meet T1592 in real work.<\/b> A <b>SOC analyst<\/b> triages scan alerts and separates real recon from benign scanners. A <b>threat intelligence (CTI) analyst<\/b> maps attacker reports to T1592 and writes briefings with the correct IDs. A <b>detection engineer<\/b> builds analytics on web access logs, firewall logs and IDS alerts to catch fingerprinting. An <b>attack surface management<\/b> or vulnerability management team reduces what leaks: hiding version banners, turning off SNMP 'public', removing end-of-life hosts. A <b>red teamer<\/b> uses the same actions in authorised tests. A <b>GRC analyst<\/b> checks that policies cover information exposure. Deliverables include alert tickets, exposure reports, CTI reports with ATT&amp;CK IDs, and detection rules.","<b>The risk it addresses, and one honest limit.<\/b> If attackers learn your exact versions, their attacks get sharper and harder to spot. Note the limit: much of this activity happens outside your network, so you often cannot see it directly. ATT&amp;CK itself lists the mitigation <b>M1056 Pre-compromise<\/b> for T1592: you cannot stop someone thinking about you, but you can shrink what they learn — and you can watch your edge for probing patterns."],"typeList":"multiple-choice questions, multi-select with partial credit, matching, drag & drop, log analysis with a filter box, branching decision trees, terminal emulator exercises, ordering and ranking, fill-in-the-blank, click-the-line artefact analysis","exercises":[{"id":"M01","type":"qcm","typeName":"Two-step reasoning","title":"What did the attacker learn?","summary":"One banner plus one reasoning step: value of an exact version.","blocks":[{"k":"p","t":"A web administrator reviews last week's access logs and finds a series of HEAD requests from one outside IP. Every response returned the same header block. She suspects the visitor was fingerprinting the server (T1592.002, Software)."},{"k":"art","label":"ARTEFACT — response headers served during the probe","wrap":true,"lines":["HTTP/1.1 200 OK","Server: Apache/2.4.49","Content-Type: text/html"]}],"question":"What did the visitor learn, and why is that fact directly useful to an attacker?","hint":"Step 1: read the banner. Step 2: connect the exact version to something attackers collect versions for.","explanation":"The header announces the exact Apache version: 2.4.49. The two reasoning steps are: (1) the banner leaks a version, and (2) an exact version lets an attacker look up known bugs for that version — Apache 2.4.49 famously had a serious path-traversal and RCE bug family (CVE-2021-41773 / CVE-2021-42013). That is why version banners are T1592.002 gold. The other options invent facts that a banner cannot carry: visitor counts, physical location, or passwords.","study":"Version banners to known-bug lookup — the core value chain of T1592.002.","attdef":"Attacker view: one HEAD request, one version string, then a public CVE search. Defender view: hide the version and the chain breaks at step one.","data":{"options":["The exact Apache version — attackers can match known bugs to it","The site's monthly visitor count — useful for phishing lists","The server's physical location — useful for badge cloning","The admin's password — attackers could log in with it"],"answer":0,"why":"Banners leak version strings, and exact versions map to public bug databases."}},{"id":"M02","type":"multi","typeName":"Multi-select","title":"What does one SNMP walk reveal?","summary":"One snmpwalk output — select all facts it truly exposes.","blocks":[{"k":"p","t":"An attacker from the internet sends one SNMP query to a switch that still uses the default community string 'public'. SNMP (Simple Network Management Protocol) is a management protocol; sysDescr is its device-description field. The attacker collects the answer below. Select every fact the answer really exposes."},{"k":"art","label":"ARTEFACT — snmpwalk answer (system group)","wrap":true,"lines":["$ snmpwalk -v2c -c public 192[.]0[.]2[.]5 system","SNMPv2-MIB::sysDescr.0 = STRING: Cisco IOS Software, C2960 Software, Version 15.2(2)E","SNMPv2-MIB::sysUpTime.0 = Timeticks: (355140744) 41 days, 3:12:07","SNMPv2-MIB::sysName.0 = STRING: switch-sw01.corp.example","IF-MIB::ifNumber.0 = INTEGER: 26"]}],"question":"Select ALL facts this SNMP answer exposes about the host.","hint":"Read each line literally. Passwords are not part of the system group. Neither are employee addresses.","explanation":"The sysDescr line exposes device family and OS version (Cisco IOS, C2960, Version 15.2(2)E) — that is T1592.002 with a hardware-model hint (T1592.001). sysUpTime exposes how long the device has been up, which tells an attacker about patch cadence. ifNumber exposes the interface count, a small network fact. The answer contains no passwords and no employee data: SNMP system fields describe the device, not its credentials or its owners.","study":"SNMP sysDescr/sysUpTime contents and why default community strings are pure exposure.","data":{"options":["How long the device has been running (uptime)","All user passwords configured on the device","The number of network interfaces","The CEO's business email address","Device model and OS version"],"answers":[4,0,2],"instruction":"Select all that apply. Partial credit applies.","itemWhy":{"4":"sysDescr names the model and IOS version.","0":"sysUpTime shows uptime — a patch-cadence hint.","2":"ifNumber gives the interface count."},"wrongWhy":{"1":"SNMP system fields do not contain password material.","3":"Employee addresses are identity data (T1589), not in this output."}}},{"id":"M03","type":"match","typeName":"Matching","title":"Neighbour techniques in one pass","summary":"Match four collected artefacts to the right ATT&CK technique.","blocks":[{"k":"p","t":"A CTI analyst reviews what an actor collected during the targeting phase. Each artefact maps to a different victim-information technique. Two steps per row: read the artefact, then decide whether it is about people, network, organisation, or hosts."},{"k":"art","label":"ARTEFACT — collected items list","wrap":true,"lines":["1. A spreadsheet of employee email addresses","2. The target's public IP ranges and DNS records","3. The target's org chart and office locations","4. The exact web server software version of the target's shop"]}],"question":"Match each artefact to the technique it maps to.","hint":"People = T1589. Network = T1590. Organisation = T1591. Hosts = T1592.","explanation":"Employee emails are identity information: T1589. Public IP ranges and DNS records are network information: T1590. Org charts and offices are organisation information: T1591. An exact web server version is host information: T1592 (Software sub-technique). Keeping the victim-information family sorted this way is a daily CTI mapping task, and it decides which detections and controls each finding feeds.","study":"The victim-information neighbours: T1589, T1590, T1591, T1592.","data":{"left":["A spreadsheet of employee email addresses","The target's public IP ranges and DNS records","The target's org chart and office locations","The exact web server software version of the target's shop"],"right":["T1590 — Gather Victim Network Information","T1592 — Gather Victim Host Information","T1589 — Gather Victim Identity Information","T1591 — Gather Victim Org Information"],"pairs":[2,0,3,1],"itemWhy":["Emails identify people: T1589.","IP ranges and DNS are network facts: T1590.","Org charts describe the organisation: T1591.","A host software version is T1592."]}},{"id":"M04","type":"dragdrop","typeName":"Drag & drop","title":"Three buckets, six facts","summary":"Sort six collected facts into Hardware, Software, Client Configurations.","blocks":[{"k":"p","t":"A red teamer's authorised recon notes list six facts about the target. Sort each fact into its T1592 sub-technique. Tip: kernel and mail server programs are software; settings of user apps are client configurations."},{"k":"art","label":"ATT&CK reminder — the three buckets","wrap":true,"lines":["T1592.001 Hardware: physical parts","T1592.002 Software: OS, kernel, installed programs","T1592.004 Client Configurations: browser, mail client, VPN client settings"]}],"question":"Drag each fact into its correct bucket.","hint":"Ask: physical part, installed program, or setting of a user app?","explanation":"48 GB RAM and the firewall model FG-100D are physical: Hardware (T1592.001). Postfix 3.4 and kernel 5.4.0 are installed programs: Software (T1592.002). Chrome 120 on Windows 10 and Outlook 2019 default settings describe user app setups: Client Configurations (T1592.004). Mixed facts are common in real recon dumps, so sorting them is a standard CTI skill.","study":"Sorting collected facts into T1592.001, .002 and .004.","data":{"buckets":["Hardware (T1592.001)","Software (T1592.002)","Client Configurations (T1592.004)"],"items":[{"t":"48 GB RAM in the database server","b":0},{"t":"Postfix 3.4 mail server version","b":1},{"t":"kernel 5.4.0 on app03","b":1},{"t":"Sales team uses Chrome 120 on Windows 10","b":2},{"t":"Outlook 2019 with default settings","b":2},{"t":"Firewall appliance model FG-100D","b":0}],"itemWhy":["RAM is physical.","A mail server program with version.","A kernel is core software.","Browser facts are client configurations.","Mail client settings are client configurations.","An appliance model is hardware."]}},{"id":"M05","type":"logview","typeName":"Log analysis","title":"Automated or human?","summary":"Eight access-log lines with a filter box — select the fingerprinting lines.","blocks":[{"k":"p","t":"You review web01's access log. Some lines are real visitors. Some are automated fingerprinting: scripted requests that read what the server runs. Automated tools identify themselves in the User-Agent field — or look oddly empty. Use the filter box if you like, then select ALL lines that show automated fingerprinting."},{"k":"art","label":"ARTEFACT — web01 access log (excerpt)","wrap":true,"lines":["2026-09-14T09:02:11 \"GET / HTTP/1.1\" 200 \"Mozilla/5.0 (Windows NT 10.0) Chrome/120\"","2026-09-14T09:02:44 \"HEAD / HTTP/1.1\" 200 \"python-requests/2.31.0\"","2026-09-14T09:03:20 \"GET /products HTTP/1.1\" 200 \"Mozilla/5.0 (Macintosh) Safari/17\"","2026-09-14T09:04:02 \"HEAD /server-info HTTP/1.1\" 403 \"Nmap Scripting Engine\"","2026-09-14T09:04:51 \"GET /style.css HTTP/1.1\" 200 \"Mozilla/5.0 (Windows NT 10.0) Chrome/120\"","2026-09-14T09:05:12 \"HEAD / HTTP/1.1\" 200 \"masscan/1.3\"","2026-09-14T09:06:30 \"GET /contact HTTP/1.1\" 200 \"Mozilla/5.0 (X11; Linux) Firefox/121\"","2026-09-14T09:07:18 \"HEAD /robots.txt HTTP/1.1\" 200 \"python-requests/2.31.0\""]}],"question":"Select ALL log lines that show automated fingerprinting activity.","hint":"Browser names (Chrome, Safari, Firefox) are humans. Script names (python-requests, Nmap, masscan) are tools.","explanation":"The python-requests, Nmap Scripting Engine and masscan lines are automated tools probing the server; HEAD requests with script UAs are classic banner collection (T1592.002). The Chrome, Safari and Firefox lines look like real people browsing real pages. Note the /server-info line got a 403 — the server refused, but the fingerprint attempt still happened and is worth alerting on.","study":"User-Agent triage in access logs: script UAs versus browser UAs.","data":{"lines":["2026-09-14T09:02:11 \"GET / HTTP/1.1\" 200 \"Mozilla/5.0 (Windows NT 10.0) Chrome/120\"","2026-09-14T09:02:44 \"HEAD / HTTP/1.1\" 200 \"python-requests/2.31.0\"","2026-09-14T09:03:20 \"GET /products HTTP/1.1\" 200 \"Mozilla/5.0 (Macintosh) Safari/17\"","2026-09-14T09:04:02 \"HEAD /server-info HTTP/1.1\" 403 \"Nmap Scripting Engine\"","2026-09-14T09:04:51 \"GET /style.css HTTP/1.1\" 200 \"Mozilla/5.0 (Windows NT 10.0) Chrome/120\"","2026-09-14T09:05:12 \"HEAD / HTTP/1.1\" 200 \"masscan/1.3\"","2026-09-14T09:06:30 \"GET /contact HTTP/1.1\" 200 \"Mozilla/5.0 (X11; Linux) Firefox/121\"","2026-09-14T09:07:18 \"HEAD /robots.txt HTTP/1.1\" 200 \"python-requests/2.31.0\""],"mode":"multi","sub":{"options":["09:04:02 HEAD /server-info — Nmap Scripting Engine","09:05:12 HEAD / — masscan/1.3","09:02:11 GET / — Chrome/120 browser","09:06:30 GET /contact — Firefox/121 browser","09:02:44 HEAD / — python-requests/2.31.0"],"answers":[4,0,1],"instruction":"Select all that apply. Partial credit applies.","itemWhy":{"4":"A script UA doing HEAD requests — banner collection.","0":"An NSE probe of a version/info endpoint.","1":"masscan is a scanner tool, not a browser."},"wrongWhy":{"2":"A normal browser visit.","3":"A normal browser visit."}}}},{"id":"M06","type":"branch","typeName":"Decision tree","title":"Slow probes on web02","summary":"Three linked SOC decisions about low-rate HEAD probes.","blocks":[{"k":"p","t":"Monday 09:40. The SOC queue shows an alert: outside IP 203[.]0[.]113[.]88 sends HEAD requests to web02 once every ten minutes. The User-Agent changes between requests. Nothing else is abnormal. Work through the three decisions."}],"question":"Step through the three decisions and pick the best option each time.","hint":"Evidence first, service stays up, and the report must name the right technique.","explanation":"Step 1: before touching anything, pull web02's access logs and see the full pattern — the alert window is too small. Step 2: the logs confirm low-rate HEAD probes against / and /server-status: the goal is learning what web02 runs, not exploiting it. Step 3: the correct report line maps the behaviour to T1592.002 (Software): the probes read version-bearing headers. T1592.003 is firmware, T1190 means exploitation already happened, and TA0006 is credential access — none of those fit.","study":"Low-and-slow HEAD probes, evidence-first triage, and precise technique mapping.","attdef":"Attacker view: one request every ten minutes stays under simple rate alerts. Defender view: correlate longer windows; pattern, not volume, is the signal.","data":{"steps":[{"q":"First action on Monday 09:40?","short":"Pull the logs first","options":["Unplug web02 from the network immediately","Reply to the probe IP asking what it wants","Mark the alert as false positive and close it","Pull web02 access logs and look at the full week of this IP"],"answer":3,"whyOk":"Evidence first: one alert line is too little to decide anything."},{"q":"Logs confirm: 1 HEAD / and /server-status per 10 minutes, rotating UAs, all 200/403. What is happening?","short":"Fingerprinting confirmed","options":["A search engine crawling the shop","An internal backup job running outside schedule","A low-rate actor is fingerprinting web02","A CDN health check misconfiguration"],"answer":2,"whyOk":"Rotating UAs plus info endpoints equal deliberate fingerprinting, not health checks or crawling."},{"q":"Which line goes into the incident report?","short":"Map it to T1592.002","options":["Maps to T1592.003 (Firmware): the actor read BIOS strings","Maps to T1190: the actor exploited web02","Maps to TA0006: the actor stole credentials","Maps to T1592.002 (Software): probes read version-bearing headers"],"answer":3,"whyOk":"Version-bearing headers are software facts: T1592.002. No exploitation or credential theft happened yet."}]}},{"id":"M07","type":"qcm","typeName":"Two-step reasoning","title":"Why fingerprint before exploiting?","summary":"One attacker-logic question about the recon-to-exploit chain.","blocks":[{"k":"p","t":"A junior asks the red team lead: 'Why do careful attackers fingerprint a web server first? Why not just throw every exploit at it?' The lead explains the logic behind T1592."}],"question":"Why do attackers fingerprint a web server before trying exploits?","hint":"Think about noise, failure cost, and precision. What does knowing the exact version buy?","explanation":"Fingerprinting reveals the exact software version, and that lets the attacker pick an exploit that actually fits — one clean attempt instead of many noisy failures. Every failed exploit can crash a service or fire an alert, which burns the attacker's quiet access. The other options describe things fingerprinting does not do: it does not speed up the site for users, affect certificates, or change uptime scores.","study":"Recon-to-exploit value: precision lowers noise and raises success.","attdef":"Attacker view: one fitting exploit beats ten random ones. Defender view: noisy failing exploits are your friend — hiding versions forces the noisy path.","data":{"options":["To get a discount on the TLS certificate renewal","To raise the server's public uptime score","To pick an exploit that fits the exact version found","To make the website load faster for real visitors"],"answer":2,"why":"Exact versions let attackers choose fitting exploits: fewer attempts, less noise."}},{"id":"M08","type":"terminal","typeName":"Terminal","title":"Quiet header check in the range","summary":"Choose curl flags yourself: silent, headers-only, no body.","blocks":[{"k":"p","t":"You are on your team's authorised attack-range machine. Goal: see which software banner web03.range.example returns. curl is available. Requirements: you need only the response headers, and you want no progress meter or noise in your output — this run gets pasted into a report."},{"k":"art","label":"Environment","wrap":true,"lines":["Host: range-attack01 (authorised training range)","Tool available: curl","Target: web03.range.example"]}],"question":"Type the curl command that fetches only the response headers, silently, from web03.range.example. Run it, then Check.","hint":"You already know curl and -I from the EASY exam. The new requirement 'no noise in the output' maps to one extra single-letter flag.","explanation":"The canonical command is: curl -sI web03.range.example (or curl -I -s). curl makes the request; -I asks for response headers only; -s is silent mode: no progress meter or errors — clean output for the report. Dropping -I would dump the whole page body; dropping -s would add progress noise. On the range, the banner (for example 'Server: Apache/2.4.41') is exactly the T1592.002 fact an attacker would collect.","study":"curl flag choice: -I for headers-only, -s for silent output.","data":{"ps1":"redteam@range-attack01","banner":["Connected to range-attack01 (authorised training range).","Reminder: this is a lab target, not a real company."],"simTool":["curl"],"output":["HTTP/1.1 200 OK","Server: Apache/2.4.41 (Ubuntu)","Content-Type: text/html"],"placeholder":"type your curl command","expected":"curl -sI web03.range.example","required":[{"label":"The curl tool","all":["curl"],"why":"The scenario names curl as the available tool.","whyOk":"Correct tool."},{"label":"Headers-only flag (-I)","any":["-i","-si","-is"],"why":"Without -I you fetch the full page body, not just headers.","whyOk":"-I gives response headers only."},{"label":"Silent flag (-s)","any":["-s","-si","-is"],"why":"The task demands no progress noise; -s is silent mode.","whyOk":"-s keeps the output clean."},{"label":"Target web03.range.example","all":["web03.range.example"],"why":"The named target.","whyOk":"Correct target."}],"forbidden":[],"parts":[{"c":"curl","w":"The web request tool."},{"c":"-s","w":"Silent mode: no progress meter or error noise."},{"c":"-I","w":"HEAD-style request: response headers only."},{"c":"web03.range.example","w":"The range target whose banner you document."}]}},{"id":"M09","type":"qcm","typeName":"Control reasoning","title":"Shrink the banner","summary":"One control choice for a leaking web server, with the why.","blocks":[{"k":"p","t":"An exposure scan reports: your public web server returns 'Server: nginx/1.18.0' to every visitor. The platform team asks what to change.nginx has a configuration directive called server_tokens; when set to off, it stops printing the version number in the Server header."}],"question":"Which change reduces what attackers learn most, and fits a one-line config edit?","hint":"The goal is not to hide nginx itself — that is impractical. The goal is to hide the version.","explanation":"Setting 'server_tokens off;' removes the version from the Server header ('Server: nginx'). The version string is the exact fact attackers need to look up matching bugs, so removing it cuts the direct value of banner grabbing (T1592.002). A bigger firewall does not change what the banner says. Renaming the server or adding RAM changes nothing about headers.","study":"server_tokens off, and banner discipline as a pre-compromise control (M1056 thinking).","data":{"options":["Add more RAM so responses get faster","Hide versions: set server_tokens off in nginx","Install a bigger firewall in front of the server","Rename the server from web01 to web01-new"],"answer":1,"why":"server_tokens off removes the exact version string — the fact that maps to known bugs."}},{"id":"M10","type":"match","typeName":"Matching","title":"Match the tool to its purpose","summary":"Match three recon tools to what they reveal about hosts.","blocks":[{"k":"p","t":"A SOC lead asks you to brief new analysts on the tools attackers (and testers) use to collect host information. Match each tool to its purpose."},{"k":"art","label":"Tools to place","wrap":true,"lines":["Shodan","Wappalyzer","snmpwalk"]}],"question":"Match each tool to its correct purpose.","hint":"One indexes exposed devices from outside. One fingerprints web tech from the browser. One queries device info strings directly.","explanation":"Shodan is a search engine for internet-exposed devices: it indexes banners and versions that devices leak, so attackers can find victims without touching them. Wappalyzer fingerprints the technology behind a website (web server, frameworks, CMS) from the browser. snmpwalk queries SNMP devices and returns info strings like sysDescr: model, OS version, uptime. All three serve T1592, but through different doors: passive database, browser fingerprinting, and direct management-protocol queries.","study":"Shodan/Censys (passive), Wappalyzer (browser fingerprinting), snmpwalk (SNMP queries).","data":{"left":["Shodan","Wappalyzer","snmpwalk"],"right":["Reads device info strings like sysDescr from network devices","Searches internet-exposed devices and shows their leaked banners","Fingerprints the web technology of a site from the browser"],"pairs":[1,2,0],"itemWhy":["Shodan indexes banners of exposed devices at scale.","Wappalyzer identifies web tech from the client side.","snmpwalk walks the SNMP tree of a device."]}},{"id":"M11","type":"order","typeName":"Ranking","title":"Which leak hurts most?","summary":"Rank three banner findings by how much they help an attacker.","blocks":[{"k":"p","t":"An exposure report lists three findings on public servers. Rank them from most useful to an attacker (rank 1) to least useful (rank 3). Attacker value depends on how precisely the fact maps to an actionable bug."},{"k":"art","label":"ARTEFACT — exposure findings","wrap":true,"lines":["A. Public server shows: Apache/2.4.49 (version with a known critical bug family)","B. Public server shows: OpenSSH_7.4 (older, but no public exploit fits this config)","C. Public server shows: Server: nginx (version string hidden)"]}],"question":"Rank the findings: 1 = most useful to an attacker, 3 = least useful.","hint":"Ask for each finding: can an attacker turn this exact string into a specific next step?","explanation":"A comes first: an exact version with a known critical bug family is directly actionable — the attacker can pick and test a specific exploit. B is second: OpenSSH 7.4 is old and shows the software, but with no fitting public exploit for this configuration the string is only partially useful. C is last: 'nginx' without a version tells the attacker the family but denies the precise bug lookup, so banner discipline works. Ranking exposures this way is how vulnerability teams prioritise fixes.","study":"Attacker value of a fact: precision times actionability.","data":{"items":["Public server shows Apache/2.4.49 — version with known critical bugs","Public server shows OpenSSH_7.4 — old, no fitting public exploit here","Public server shows 'Server: nginx' — version hidden"],"itemWhy":["Exact version plus known bugs: top attacker value.","Version visible but not actionable: middle.","Family only, no version: least value."]}},{"id":"M12","type":"fill","typeName":"Report drafting","title":"Name the technique in the report","summary":"Complete a CTI report sentence with the right IDs and tactic.","blocks":[{"k":"p","t":"You draft the weekly CTI summary. The draft has three gaps. Fill them from the word bank so the report names the technique, the sub-technique and the tactic correctly. Two bank entries are distractors."}],"question":"Fill all three blanks with the correct entries.","hint":"The behaviour is host software collection. Which technique ID, which sub-technique ID, which tactic name?","explanation":"The completed sentence names T1592 (Gather Victim Host Information), sub-technique T1592.002 (Software), and the Reconnaissance tactic. T1190 is Exploit Public-Facing Application — wrong because no exploitation happened. 'Exfiltration' is a different phase entirely, and 'private' is not an ATT&CK tactic. Precise IDs make the report searchable and let others find matching detections.","study":"Writing CTI reports with correct technique, sub-technique and tactic names.","data":{"text":"The banner probes map to {0} (Gather Victim Host Information), sub-technique {1} (Software). The tactic is {2}.","bank":["T1592","T1190","T1592.002","Reconnaissance","Exfiltration"],"answers":["T1592","T1592.002","Reconnaissance"],"itemWhy":["The parent technique of host information gathering.","Software is the sub-technique for version collection.","Reconnaissance is the tactic."]}},{"id":"M13","type":"qcm","typeName":"False-positive reasoning","title":"The friendly Saturday scanner","summary":"A weekly scanner that is actually allowed — tune, do not panic.","blocks":[{"k":"p","t":"Every Saturday at 04:00, one IP runs version probes across your whole DMZ. The IP belongs to your security vendor, and the contract says 'weekly authenticated scan'. The new analyst wants to open a P1 incident."}],"question":"What should the SOC do with this recurring scan?","hint":"Two steps: is the activity expected? If yes, what is the correct alert treatment instead of a P1?","explanation":"The scan is authorised and scheduled, so a P1 is wrong. The professional treatment is: document it as expected activity, and tune the alert so it fires only outside the agreed window or from other sources. That keeps detection alive for real actors while removing the weekly false positive. Blocking the vendor breaks the service you pay for; disabling DMZ alerts forever blinds you; adding scan days helps nobody.","study":"Alert tuning against asset and contract inventories — expected-source allow-listing.","data":{"options":["Block the vendor IP and open a P1 incident now","Turn off all DMZ alerts permanently to stop noise","Ask the vendor to scan additional days too","Document it as expected; alert only on deviation"],"answer":3,"why":"Expected sources get allow-listed and monitored for deviation, not panicked on."}},{"id":"M14","type":"cardsel","typeName":"Spot the good line","title":"Find the line that already protects","summary":"One nginx config excerpt — click the line that hides version info.","blocks":[{"k":"p","t":"You audit a colleague's nginx configuration for information leaks. One line here is the protective one: it stops the server from advertising its version. Click it."},{"k":"art","label":"ARTEFACT — nginx server block excerpt","wrap":true,"lines":["server {","  listen 443 ssl;","  server_tokens off;","  add_header X-Frame-Options DENY;","}"]}],"question":"Click the line that hides version information from the Server header.","hint":"server_tokens controls how much nginx tells about itself.","explanation":"'server_tokens off;' is the line that stops nginx from printing its version in the Server header and on error pages — a direct reduction of T1592.002 value. The listen line only opens port 443, the header line is a clickjacking defence, and the braces are structure. Recognising protective lines is as important as spotting leaks: it tells you what is already done.","study":"nginx server_tokens and header-discipline configuration.","data":{"lines":["server {","  listen 443 ssl;","  server_tokens off;","  add_header X-Frame-Options DENY;","}"],"correct":[2],"why":["A structural block opener.","A listener on 443.","Exactly the version-hiding directive.","A clickjacking defence, not version hiding.","A structural closer."]}},{"id":"M15","type":"multi","typeName":"Multi-select","title":"Choose the two best reductions","summary":"Pick the two actions that actually cut what attackers learn.","blocks":[{"k":"p","t":"Your team gets one sprint to reduce what host-information gathering (T1592) can collect about you. There are many ideas on the table. Choose the TWO that directly reduce what attackers learn from banners and management protocols."}],"question":"Select the TWO actions that directly reduce what attackers learn.","hint":"Ask for each idea: does it change what a banner or an SNMP answer reveals to an outsider?","explanation":"Removing version banners from public services and disabling SNMP reads with the default 'public' community both directly cut the facts outsiders can collect (T1592.002, and .001/.002 via sysDescr). Publishing an asset inventory does the opposite: it is a gift to attackers. Giving every server a public DNS name enlarges the attack surface. Staff quizzes are good for phishing, not for banners.","study":"Banner discipline and SNMP hardening as the two classic T1592 reductions.","data":{"options":["Disable SNMP read access with the default 'public' community","Publish the internal asset inventory on the company website","Give every internal server a public DNS name","Remove version banners from public services"],"answers":[3,0],"instruction":"Choose the two best options. Partial credit applies.","itemWhy":{"3":"Fewer version strings means less T1592.002 material.","0":"No default-community reads means no free sysDescr."},"wrongWhy":{"1":"Publishing assets helps attackers map you.","2":"More public names means more surface to fingerprint."}}}]};

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function range(n){ var r=[]; for(var i=0;i<n;i++) r.push(i); return r; }
function scoreExercise(H,W,N){ N=N||1; return Math.max(0,(H-W)/N); }
function fmtClock(s){ s=Math.max(0,Math.floor(s)); var m=Math.floor(s/60), r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
function hasAll(s,arr){ for(var i=0;i<arr.length;i++){ if(s.indexOf(String(arr[i]).toLowerCase())<0) return false; } return true; }
function hasAny(s,arr){ for(var i=0;i<arr.length;i++){ if(s.indexOf(String(arr[i]).toLowerCase())>=0) return true; } return false; }
function normCmd(c){
  c = String(c||'').toLowerCase().replace(/\s+/g,' ').trim();
  c = c.replace(/^[a-z0-9]+:\/\//,'');
  c = c.replace(/\b(\d{1,3})\s*\.\s*(\d{1,3})\s*\.\s*(\d{1,3})\s*\.\s*(\d{1,3})\b/g,'$1[.]$2[.]$3[.]$4');
  c = c.replace(/-\s*v\s+2c/g,'-v2c');
  return c;
}
function hl(line){
  var e = esc(line);
  e = e.replace(/(&quot;[^&]*?&quot;)|(\d{1,3}(?:\[\.\]\d{1,3}){3})|(\b(?:GET|HEAD|POST|DROP|ALLOW|DENY|REJECT|HTTP\/1\.[01]|UDP|TCP|ICMP)\b)|(\b\d{2,5}\b)/g,
    function(m,q,ip,kw,num){
      if(q) return '<span class="hl-q">'+q+'</span>';
      if(ip) return '<span class="hl-ip">'+ip+'</span>';
      if(kw) return '<span class="hl-kw">'+kw+'</span>';
      if(num) return '<span class="hl-num">'+num+'</span>';
      return m;
    });
  return e;
}

/* ---------- exam state ---------- */
var S = {
  phase:'intro', order:[], cur:0, ans:{}, credits:{}, checked:{}, hintUsed:{},
  skipped:[], reviewingId:null, reported:false, wallStart:0, init:null,
  timer:{ state:'RUNNING', remaining:M.estimatedMinutes*60, prevState:null, pm:0, pa:0, per:null }
};
function currentEx(){ return EXS[S.order[S.cur]]; }
function skippedOpen(){ return S.skipped.filter(function(id){ return !S.checked[id]; }); }
function liveScore(){
  var s=0,c=0,id;
  for(id in S.credits){ c++; s+=S.credits[id]; }
  if(!c) return {sum:0,count:0,pct:0,txt:'0.0 / 0 (0%)'};
  var pct=Math.round((s/c)*100);
  return {sum:s,count:c,pct:pct,txt:(Math.round(s*10)/10)+' / '+c+' ('+pct+'%)'};
}

/* ---------- timer state machine ----------
   States: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED.
   Check -> PAUSED_AUTO_CHECK (before feedback renders). Next / Final Submit -> RUNNING or ENDED.
   Skip and Hint never change the state. Manual pause may sit on top of the auto-pause. */
function setState(st){ S.timer.prevState = S.timer.state; S.timer.state = st; renderHeader(); }
setInterval(function(){
  var t=S.timer;
  if((S.phase==='exam' && !S.reviewingId) || S.phase==='review' || (S.phase==='exam' && S.reviewingId)){
    if(t.state==='RUNNING'){
      t.remaining--;
      if(t.per && S.phase==='exam' && t.per.exId===S.renderedId && !S.checked[S.renderedId]){
        t.per.remaining--;
        var pc=$('pertime'); if(pc) pc.textContent=fmtClock(t.per.remaining);
        if(t.per.remaining<=0){ t.per.remaining=0; if(pc) pc.textContent=fmtClock(0); renderHeader(); doCheck(); return; }
      }
      if(t.remaining<=0){ t.remaining=0; renderHeader(); onTimeout(); return; }
    } else if(t.state==='PAUSED_AUTO_CHECK'){ t.pa++; }
    else if(t.state==='PAUSED_MANUAL'){ t.pm++; }
  }
  renderHeader();
},1000);
function onTimeout(){
  if(S.phase==='results'||S.phase==='intro') return;
  setState('ENDED');
  finish('timeout');
}
function renderHeader(){
  var t=S.timer, idx='', h=$('hdr'); if(!h) return;
  var badge='<span class="badge sev-'+SEV.cls+'">'+SEV.label+'</span>';
  if(S.phase==='exam'){
    idx = S.reviewingId ? ('Review skipped — '+skippedOpen().length+' left') : ('Exercise '+(S.cur+1)+' of '+S.order.length);
  } else if(S.phase==='review'){ idx='Review skipped — '+skippedOpen().length+' left'; }
  else if(S.phase==='results'){ idx='Results'; }
  else { idx='Introduction'; }
  var ts;
  if(t.state==='RUNNING') ts='<span class="tstate t-run">&#9654; Running</span>';
  else if(t.state==='PAUSED_MANUAL') ts='<span class="tstate t-man">&#10074;&#10074; Paused — manual (press Resume)</span>';
  else if(t.state==='PAUSED_AUTO_CHECK') ts='<span class="tstate t-auto">&#10074;&#10074; Paused — reviewing feedback (resumes on Next)</span>';
  else ts='<span class="tstate t-end">&#9632; Ended</span>';
  h.innerHTML =
    '<div class="hdr-l"><span class="hdr-idx">'+esc(idx)+'</span>'+badge+'</div>'+
    '<div class="hdr-m"><span class="hdr-timer">&#9201; '+fmtClock(t.remaining)+'</span>'+ts+'</div>'+
    '<div class="hdr-r"><span class="hdr-score">&#11088; '+liveScore().txt+'</span>'+
    '<button type="button" class="btn ghost" data-act="pause"'+(t.state==='RUNNING'||t.state==='PAUSED_AUTO_CHECK'?'':' disabled')+'>&#10074;&#10074; Pause</button>'+
    '<button type="button" class="btn ghost" data-act="resume"'+(t.state==='PAUSED_MANUAL'?'':' disabled')+'>Resume</button>'+
    '<button type="button" class="btn warn" data-act="hint"'+((S.phase==='exam'&&!S.checked[currentExId()]&&!S.hintUsed[currentExId()])?'':' disabled')+'>&#128161; Hint (&minus;10%)</button>'+
    '<button type="button" class="btn ghost" data-act="skip"'+((S.phase==='exam'&&!S.checked[currentExId()])?'':' disabled')+'>&#9193; Skip</button>'+
    '</div>';
}
function currentExId(){ return S.renderedId || ''; }

/* ---------- exam flow ---------- */
function startExam(){
  S.order = shuffle(range(EXS.length));
  S.cur=0; S.phase='exam'; S.wallStart=Date.now();
  setState('RUNNING');
  renderExercise(currentEx(),{});
}
function renderExercise(ex,opts){
  opts=opts||{};
  var w=WIDGETS[ex.type]; if(!w){ return; }
  S.renderedId = String(ex.id);
  if(!S.ans[ex.id]) S.ans[ex.id]={};
  var blocks='', b, art;
  for(var i=0;i<ex.blocks.length;i++){
    b=ex.blocks[i];
    if(b.k==='p'){ blocks+='<p>'+esc(b.t)+'</p>'; }
    else if(b.k==='art'){
      var lines='';
      for(var j=0;j<b.lines.length;j++) lines+=hl(b.lines[j])+'\n';
      blocks+='<div class="art"><div class="art-h">'+esc(b.label)+'</div><pre class="'+(b.wrap?'wrap':'')+'">'+lines+'</pre></div>';
    }
    else if(b.k==='table'){
      var thead='', trows='';
      for(var c=0;c<b.head.length;c++) thead+='<th>'+esc(b.head[c])+'</th>';
      for(var r=0;r<b.rows.length;r++){
        trows+='<tr>';
        for(var d=0;d<b.rows[r].length;d++) trows+='<td>'+hl(b.rows[r][d])+'</td>';
        trows+='</tr>';
      }
      blocks+='<div class="art"><div class="art-h">'+esc(b.label)+'</div><table class="tri"><thead><tr>'+thead+'</tr></thead><tbody>'+trows+'</tbody></table></div>';
    }
  }
  var collapsible = ex.blocks.length>=3 || blocks.length>1400;
  var scn = '<div class="blk blk-scn" id="scnblk">'+
    '<div class="blk-h">&#128674; Scenario <span class="grow"></span>'+
    (collapsible?'<button type="button" class="collapser" data-act="collapse" id="collapseBtn" aria-expanded="true">Collapse &#9650;</button>':'')+
    '</div>'+
    (collapsible?'<div class="scn-summary" id="scnSummary">'+esc(ex.summary)+'</div>':'')+
    '<div class="blk-b" id="scnBody">'+blocks+'</div></div>';
  var stepNote='';
  if(ex.type==='branch'){ stepNote='<span class="typechip" id="stepchip">STEP 1 OF '+ex.data.steps.length+'</span>'; }
  var per = (ex.timerSec && !S.checked[ex.id]) ? '<span class="perchip" id="perchip">&#9201; Exercise timer: <b id="pertime">'+fmtClock(ex.timerSec)+'</b></span>' : '';
  if(ex.timerSec && !S.checked[ex.id] && (!S.timer.per || S.timer.per.exId!==ex.id)){ S.timer.per={exId:ex.id, remaining:ex.timerSec}; }
  var reviewNote = opts.review ? '<div class="review-note">&#9888; You are answering a skipped exercise. Answer it and press Next to go back to the review list.</div>' : '';
  $('main').innerHTML =
  '<section class="ex">'+
    '<div class="ex-top"><span class="badge sev-'+SEV.cls+'">'+SEV.label+'</span>'+
    '<span class="typechip">'+esc(ex.typeName)+'</span><span class="ex-title">'+esc(ex.title)+'</span>'+per+'</div>'+
    reviewNote+
    scn+
    '<div class="blk blk-q"><div class="blk-h">&#10067; Question <span class="grow"></span>'+stepNote+'</div>'+
      '<div class="blk-b"><p class="q-text">'+esc(ex.question)+'</p>'+
      '<div class="hintpanel" id="hintPanel" hidden>&#128161; <b>Hint:</b> '+esc(ex.hint)+' <span class="small">(Using this hint costs 10% of this exercise credit, applied at Check.)</span></div></div></div>'+
    '<div class="blk blk-a"><div class="blk-h">&#9997; Your answer</div>'+
      '<div class="blk-b" id="answerArea"></div></div>'+
    '<div class="actions">'+
      '<button type="button" class="btn primary" id="btnCheck" data-act="check">'+(ex.type==='branch'?'Check final answer':'Check')+'</button>'+
      '<button type="button" class="btn ghost" id="btnNext" data-act="next" hidden>Next &#9654;</button>'+
      '<span class="spacer"></span>'+
      '<span class="small">Skip and Hint are also in the top bar.</span>'+
    '</div>'+
    '<div id="fbHolder" aria-live="polite"></div>'+
  '</section>';
  w.render(ex, $('answerArea'), S.ans[ex.id], opts);
  window.scrollTo(0,0);
  renderHeader();
}
function doHint(){
  var ex=byId(S.renderedId);
  if(S.checked[ex.id]||S.hintUsed[ex.id]) return;
  S.hintUsed[ex.id]=true;
  var p=$('hintPanel'); if(p) p.hidden=false;
  renderHeader();
}
function doSkip(){
  var ex=byId(S.renderedId);
  if(S.checked[ex.id]) return;
  if(S.skipped.indexOf(ex.id)<0) S.skipped.push(ex.id);
  if(S.reviewingId){ openReview(); return; }   /* skipping inside review stays in review */
  if(S.cur < S.order.length-1){ S.cur++; renderExercise(currentEx(),{}); }
  else { openReview(); }
}
function gradeExercise(ex){
  var g=WIDGETS[ex.type].grade(ex);
  g.credit0=scoreExercise(g.H,g.W,g.N);
  g.credit=S.hintUsed[ex.id]?Math.max(0,g.credit0-0.10):g.credit0;
  return g;
}
function doCheck(){
  var ex=byId(S.renderedId);
  if(S.checked[ex.id]) return;
  var g=gradeExercise(ex);
  S.credits[ex.id]=g.credit;
  S.checked[ex.id]=true;
  S.timer.per=null;
  setState('PAUSED_AUTO_CHECK');           /* first action: stop the timer before feedback shows */
  buildFeedback(ex,g);
  var aa=$('answerArea'); if(aa) aa.classList.add('locked');
  var cb=$('btnCheck'); if(cb) cb.disabled=true;
  var nb=$('btnNext'); if(nb){ nb.hidden=false; nb.innerHTML=nextLabel()+' &#9654;'; }
  renderHeader();
  var fb=$('fbHolder');
  if(fb && fb.scrollIntoView){
    var smooth=true;
    try{ smooth=!window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
    fb.scrollIntoView({behavior:smooth?'smooth':'auto',block:'nearest'});
  }
}
function nextLabel(){
  if(S.reviewingId){ return skippedOpen().length<=1 ? 'Finish exam' : 'Back to review'; }
  var last = S.cur>=S.order.length-1;
  if(last && skippedOpen().length===0) return 'Final Submit';
  if(last) return 'Review skipped';
  return 'Next';
}
function goNext(){
  if(!S.checked[S.renderedId]) return;
  if(S.reviewingId){
    S.reviewingId=null;
    if(skippedOpen().length===0){ submitExam(); } else { openReview(); }
    return;
  }
  setState('RUNNING');   /* Next ends the Check auto-pause; last exercise ends below */
  if(S.cur < S.order.length-1){ S.cur++; renderExercise(currentEx(),{}); }
  else if(skippedOpen().length>0){ openReview(); }
  else { submitExam(); }
}

/* ---------- feedback ---------- */
function buildFeedback(ex,g){
  var cls, label, icon;
  if(g.credit>=0.999){ cls='fb-correct'; label='CORRECT'; icon='&#9989;'; }
  else if(g.credit>0){ cls='fb-partial'; label='PARTIALLY CORRECT'; icon='&#9989;'; }
  else { cls='fb-wrong'; label='INCORRECT'; icon='&#10060;'; }
  var creditLine='';
  if(g.N>1){
    var got=g.H;
    creditLine='<span class="credit">credit '+ (Math.round(g.credit*100)/100) +' — '+got+'/'+g.N+' items'+(g.credit<g.credit0?' (after &minus;0.10 hint)':'')+'</span>';
  } else {
    creditLine='<span class="credit">credit '+ (Math.round(g.credit*100)/100) +'</span>';
  }
  var items='';
  for(var i=0;i<g.items.length;i++){
    var it=g.items[i], ic, st;
    if(it.status==='correct'){ ic='<span class="ic-c">&#10003; Correct</span>'; }
    else if(it.status==='wrong'){ ic='<span class="ic-w">&#10007; Wrong</span>'; }
    else { ic='<span class="ic-m">&#9675; Missed</span>'; }
    items+='<li>'+ic+' — '+esc(it.label)+(it.why?(' — '+esc(it.why)):'')+'</li>';
  }
  var paras=ex.explanation.split('\n\n'), ptxt='';
  for(var p=0;p<paras.length;p++) ptxt+='<p>'+esc(paras[p])+'</p>';
  if(ex.attdef) ptxt+='<p>'+esc(ex.attdef)+'</p>';
  var canon='';
  if(WIDGETS[ex.type] && WIDGETS[ex.type].canonical) canon=WIDGETS[ex.type].canonical(ex);
  $('fbHolder').innerHTML =
  '<div class="fb '+cls+'">'+
    '<div class="fb-h">'+icon+' '+label+creditLine+'</div>'+
    '<div class="fb-b">'+
      (g.N>1?'<b>Item by item:</b><ul class="fb-items">'+items+'</ul>':'<ul class="fb-items">'+items+'</ul>')+
      '<b>Why:</b>'+ptxt+
      (canon||'')+
      '<div class="study">&#128218; What to study next: '+esc(ex.study)+'</div>'+
    '</div>'+
  '</div>';
}

/* ---------- review skipped ---------- */
function openReview(){
  S.phase='review'; S.reviewingId=null;
  if(S.timer.state==='PAUSED_AUTO_CHECK' && S.timer.remaining>0) setState('RUNNING');
  var pool=skippedOpen();
  var list='';
  for(var i=0;i<pool.length;i++){
    var ex=byId(pool[i]);
    list+='<div class="rv-item"><span class="badge sev-'+SEV.cls+'">'+SEV.label+'</span>'+
      '<span class="rt"><b>'+esc(ex.title)+'</b><br><span class="small">'+esc(ex.summary)+'</span></span>'+
      '<button type="button" class="btn" data-act="rvans" data-id="'+esc(ex.id)+'">Answer now</button></div>';
  }
  $('main').innerHTML =
  '<div class="intro-card"><h1>Review skipped exercises</h1>'+
  '<p>You skipped '+pool.length+' exercise(s). You can answer them now, as many times as needed, while the timer is still running. '+
  'If you submit with skipped exercises left, they are <b>excluded from the score</b>: they count as neither correct nor wrong.</p>'+
  (pool.length?list:'<p><b>All skipped exercises have been answered. You can submit the exam.</b></p>')+
  '<div class="actions"><button type="button" class="btn primary" data-act="submit">Submit exam &#9654;</button></div>'+
  '</div>';
  window.scrollTo(0,0);
  renderHeader();
}
function reviewAnswer(id){
  var ex=byId(id); if(!ex) return;
  S.reviewingId=String(id);
  S.phase='exam';
  for(var i=0;i<S.order.length;i++){
    if(String(EXS[S.order[i]].id)===String(id)){ S.cur=i; break; }
  }
  renderExercise(ex,{review:true});
}
function byId(id){ for(var i=0;i<EXS.length;i++){ if(String(EXS[i].id)===String(id)) return EXS[i]; } return null; }
function submitExam(){ finish('submit'); }

/* ---------- results ---------- */
function finish(){
  setState('ENDED');
  showResults();
}
function showResults(){
  S.phase='results';
  var full=0, part=0, wrong=0, skippedN=0, sum=0, answered=0, partSum=0;
  for(var i=0;i<EXS.length;i++){
    var ex=EXS[i], c=S.credits[ex.id];
    if(S.checked[ex.id]){
      answered++; sum+=c;
      if(c>=0.999){ full++; }
      else if(c>0){ part++; partSum+=c; }
      else { wrong++; }
    } else if(S.skipped.indexOf(ex.id)>=0){ skippedN++; }
    else { skippedN++; }
  }
  var pct = answered>0 ? Math.round((sum/answered)*100) : 0;
  var passed = pct>=M.passMark;
  var avg = part>0 ? (Math.round((partSum/part)*100)/100) : 0;
  var mins = Math.round((Date.now()-S.wallStart)/60000);
  var cert = passed ?
    '<div class="cert"><h3>&#127942; CERTIFICATE OF COMPLETION</h3>'+
    '<p><b>'+esc(S.init&&S.init.username?S.init.username:'Learner')+'</b> passed the '+SEV.label+' practice exam</p>'+
    '<p>'+esc(M.title)+'</p><p>Score: <b>'+pct+'%</b> &nbsp;&bull;&nbsp; Pass mark: '+M.passMark+'% &nbsp;&bull;&nbsp; '+new Date().toLocaleDateString()+'</p></div>' : '';
  $('main').innerHTML =
  '<div class="res">'+
    '<h2>Results — '+SEV.label+' exam</h2>'+
    '<p class="pct '+ (passed?'res-pass':'res-fail') +'">'+pct+'%</p>'+
    '<p>'+(passed?'<b>PASS.</b> Well done — you reached the pass mark of '+M.passMark+'%.':'<b>FAIL.</b> You need '+M.passMark+'% or more. You must retake the exam to pass.')+'</p>'+
    cert+
    '<div class="statgrid">'+
      '<div class="stat"><b>'+full+'</b>Fully correct</div>'+
      '<div class="stat"><b>'+part+'</b>Partially correct'+(part?(' (avg credit '+avg+')'):'')+'</div>'+
      '<div class="stat"><b>'+wrong+'</b>Fully incorrect</div>'+
      '<div class="stat"><b>'+skippedN+'</b>Skipped, never answered (excluded)</div>'+
    '</div>'+
    '<div class="statgrid">'+
      '<div class="stat"><b>'+(answered>0?(Math.round(sum*10)/10):'0')+' / '+answered+'</b>Sum of credits over answered exercises</div>'+
      '<div class="stat"><b>~'+mins+' min</b>Wall time in the exam</div>'+
      '<div class="stat"><b>'+fmtClock(S.timer.pm)+'</b>Time paused manually</div>'+
      '<div class="stat"><b>'+fmtClock(S.timer.pa)+'</b>Time reviewing feedback (auto-pause)</div>'+
    '</div>'+
    '<p class="small">Skipped-and-never-answered exercises are excluded from both the score and the total. The percentage above is computed only over answered exercises.</p>'+
    '<div class="actions"><button type="button" class="btn primary" data-act="retake">&#8635; Retake Exam</button></div>'+
  '</div>';
  window.scrollTo(0,0);
  renderHeader();
  reportScore(sum,answered,pct);
}
function reportScore(sum,answered,pct){
  if(S.reported) return;
  S.reported=true;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:M.topicId,
      batch:M.batch,
      score:Math.round(sum),
      total:answered,
      percent:pct,
      passed:pct>=M.passMark
    }, location.origin);
  }catch(e){ /* opened directly in a browser; nothing to report to */ }
}
function retake(){
  S.phase='exam'; S.cur=0; S.ans={}; S.credits={}; S.checked={}; S.hintUsed={};
  S.skipped=[]; S.reviewingId=null; S.reported=false; S.wallStart=Date.now();
  S.timer={ state:'RUNNING', remaining:M.estimatedMinutes*60, prevState:null, pm:0, pa:0, per:null };
  S.order=shuffle(range(EXS.length));
  renderExercise(currentEx(),{});
}

/* ---------- manual pause ---------- */
function doPause(){
  var st=S.timer.state;
  if(st!=='RUNNING' && st!=='PAUSED_AUTO_CHECK') return;
  setState('PAUSED_MANUAL');
  var ov=$('pauseOv'); if(ov) ov.classList.add('show');
  document.body.classList.add('manual-paused');
}
function doResume(){
  if(S.timer.state!=='PAUSED_MANUAL') return;
  var back = (S.timer.prevState==='PAUSED_AUTO_CHECK')?'PAUSED_AUTO_CHECK':'RUNNING';
  setState(back);
  var ov=$('pauseOv'); if(ov) ov.classList.remove('show');
  document.body.classList.remove('manual-paused');
}

/* ---------- website handshake (both init names accepted; works with none) ---------- */
window.addEventListener('message', function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  S.init={ username:event.data.username||'', country:event.data.country||'', theme:event.data.theme||'light' };
});

/* ---------- global click routing ---------- */
document.addEventListener('click', function(e){
  var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if(!el) return;
  if(el.disabled) return;
  var act=el.getAttribute('data-act');
  if(act==='start'){ startExam(); }
  else if(act==='pause'){ doPause(); }
  else if(act==='resume'){ doResume(); }
  else if(act==='hint'){ doHint(); }
  else if(act==='skip'){ doSkip(); }
  else if(act==='check'){ doCheck(); }
  else if(act==='next'){ goNext(); }
  else if(act==='submit'){ submitExam(); }
  else if(act==='retake'){ retake(); }
  else if(act==='rvans'){ reviewAnswer(el.getAttribute('data-id')); }
  else if(act==='collapse'){
    var body=$('scnBody'), btn=$('collapseBtn'), sum=$('scnSummary');
    if(!body) return;
    var open = body.style.display!=='none';
    body.style.display = open?'none':'block';
    if(sum) sum.style.display = open?'flex':'none';
    if(btn){ btn.innerHTML = open?'Expand &#9660;':'Collapse &#9650;'; btn.setAttribute('aria-expanded', open?'false':'true'); }
  }
});



/* ---------- shared pure graders ---------- */
function gradeQCM(d,A){
  if(A.sel===null||A.sel===undefined){
    return {H:0,W:1,N:1,items:[{label:'No answer selected — correct was: '+d.options[d.answer],status:'wrong',why:'You did not select an option, so the exercise scores 0.'}]};
  }
  var ok=(A.sel===d.answer);
  var lbl = ok ? ('You selected the correct answer: '+d.options[d.answer])
               : ('You selected "'+d.options[A.sel]+'". Correct answer: '+d.options[d.answer]);
  return {H:ok?1:0,W:ok?0:1,N:1,items:[{label:lbl,status:ok?'correct':'wrong',why:ok?(d.why||''):(d.whyWrong||'This option does not fit the scenario. Re-read the explanation below.')}]};
}
function gradeMulti(d,A){
  var sel=A.sel||[], N=d.answers.length, H=0, W=0, items=[], i, j;
  for(i=0;i<d.options.length;i++){
    var isAns=d.answers.indexOf(i)>=0, isSel=sel.indexOf(i)>=0;
    if(isAns&&isSel){ H++; items.push({label:d.options[i],status:'correct',why:d.itemWhy&&d.itemWhy[i]?d.itemWhy[i]:'Part of the correct answer set.'}); }
    else if(isAns&&!isSel){ items.push({label:d.options[i],status:'missed',why:d.itemWhy&&d.itemWhy[i]?d.itemWhy[i]:'You missed this correct item.'}); }
    else if(!isAns&&isSel){ W++; items.push({label:d.options[i],status:'wrong',why:d.wrongWhy&&d.wrongWhy[i]?d.wrongWhy[i]:'This is not part of the correct answer in this scenario.'}); }
  }
  return {H:H,W:W,N:N,items:items};
}
function gradeCardsel(d,A){
  var sel=A.sel||[], N=d.correct.length, H=0, W=0, items=[], i;
  for(i=0;i<d.lines.length;i++){
    var isC=d.correct.indexOf(i)>=0, isS=sel.indexOf(i)>=0;
    if(isC&&isS){ H++; items.push({label:'Selected line: '+d.lines[i],status:'correct',why:d.why&&d.why[i]?d.why[i]:''}); }
    else if(!isC&&isS){ W++; items.push({label:'Selected line: '+d.lines[i],status:'wrong',why:d.why&&d.why[i]?d.why[i]:'This line is not the right one.'}); }
    else if(isC&&!isS){ items.push({label:'Correct line: '+d.lines[i],status:'missed',why:d.why&&d.why[i]?d.why[i]:'You missed this line.'}); }
  }
  return {H:H,W:W,N:N,items:items};
}

/* ---------- drag & drop into buckets (partial credit per item) ---------- */
WIDGETS.dragdrop={
  render:function(ex,host,A){
    if(!A.placed){ A.placed={}; A.selItem=null; A.bankOrder=shuffle(range(ex.data.items.length)); }
    draw();
    function chip(ii){
      var inBucket=A.placed[ii]!==undefined;
      return '<button type="button" class="chip'+(A.selItem===ii?' sel':'')+'" draggable="true" data-item="'+ii+'">'+esc(ex.data.items[ii].t)+'</button>';
    }
    function draw(){
      var bank='<div class="bank" id="ddBank" data-bucket="-1">';
      for(var k=0;k<A.bankOrder.length;k++){ var ii=A.bankOrder[k]; if(A.placed[ii]===undefined) bank+=chip(ii); }
      bank+='</div>';
      var cols='';
      for(var b=0;b<ex.data.buckets.length;b++){
        var inner='';
        for(var id in A.placed){ if(A.placed[id]===b) inner+=chip(parseInt(id,10)); }
        cols+='<div class="bucket" data-bucket="'+b+'"><h4>'+esc(ex.data.buckets[b])+'</h4><div class="bitems">'+inner+'</div></div>';
      }
      host.innerHTML='<p class="small">Click an item, then click a bucket. You can also drag items with the mouse. Click a placed item to send it back.</p>'+bank+'<div class="buckets">'+cols+'</div>';
      var chips=host.querySelectorAll('.chip');
      for(var c=0;c<chips.length;c++){
        chips[c].addEventListener('dragstart',function(e){ e.dataTransfer.setData('text/plain',this.getAttribute('data-item')); });
      }
      var bks=host.querySelectorAll('.bucket, .bank');
      for(var d=0;d<bks.length;d++){
        bks[d].addEventListener('dragover',function(e){ e.preventDefault(); this.classList.add('dragover'); });
        bks[d].addEventListener('dragleave',function(){ this.classList.remove('dragover'); });
        bks[d].addEventListener('drop',function(e){
          e.preventDefault(); this.classList.remove('dragover');
          if(S.checked[ex.id]) return;
          var ii=parseInt(e.dataTransfer.getData('text/plain'),10);
          if(isNaN(ii)) return;
          var b=this.getAttribute('data-bucket');
          if(b==='-1'||b===null){ delete A.placed[ii]; } else { A.placed[ii]=parseInt(b,10); }
          A.selItem=null; draw();
        });
      }
    }
    host.onclick=function(e){
      if(S.checked[ex.id]) return;
      var ch=e.target.closest?e.target.closest('[data-item]'):null;
      if(ch){
        var ii=parseInt(ch.getAttribute('data-item'),10);
        if(A.placed[ii]!==undefined && A.selItem!==ii){ delete A.placed[ii]; A.selItem=null; }
        else { A.selItem=(A.selItem===ii)?null:ii; }
        draw(); return;
      }
      var bk=e.target.closest?e.target.closest('[data-bucket]'):null;
      if(bk && A.selItem!==null && A.selItem!==undefined){
        var b=bk.getAttribute('data-bucket');
        if(b==='-1'||b===null){ delete A.placed[A.selItem]; }
        else { A.placed[A.selItem]=parseInt(b,10); }
        A.selItem=null; draw();
      }
    };
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id], H=0,W=0,items=[];
    for(var i=0;i<d.items.length;i++){
      var p=A.placed[i];
      if(p===undefined){ items.push({label:d.items[i].t,status:'missed',why:'You left this item in the bank.'}); }
      else if(p===d.items[i].b){ H++; items.push({label:d.items[i].t+' → '+d.buckets[d.items[i].b],status:'correct',why:d.itemWhy&&d.itemWhy[i]?d.itemWhy[i]:''}); }
      else { W++; items.push({label:d.items[i].t,status:'wrong',why:'You placed it in "'+d.buckets[p]+'". Correct bucket: "'+d.buckets[d.items[i].b]+'".'}); }
    }
    return {H:H,W:W,N:d.items.length,items:items};
  }
};

/* ---------- fill-in-the-blank with word bank (partial credit per blank) ---------- */
WIDGETS.fill={
  render:function(ex,host,A){
    if(!A.filled){ A.filled={}; A.selSlot=null; A.bankOrder=shuffle(range(ex.data.bank.length)); }
    draw();
    function draw(){
      var parts=ex.data.text.split(/\{(\d+)\}/), h='<p class="filltext">';
      for(var i=0;i<parts.length;i++){
        if(i%2===0){ h+=esc(parts[i]); }
        else{
          var k=parseInt(parts[i],10), w=A.filled[k];
          h+='<button type="button" class="slotbtn'+(w?' filled':'')+(A.selSlot===k?' sel':'')+'" data-slot="'+k+'">'+(w?esc(w):'blank '+(k+1))+'</button>';
        }
      }
      h+='</p><p class="small">Word bank (shuffled). Click a blank, then a word — or click a word first. Click a filled blank to clear it.</p><div class="bank" id="fillBank">';
      for(var j=0;j<A.bankOrder.length;j++){
        var b=A.bankOrder[j], used=false;
        for(var key in A.filled){ if(A.filled[key]===ex.data.bank[b]) used=true; }
        h+='<button type="button" class="chip'+(used?' used':'')+'" data-bank="'+b+'">'+esc(ex.data.bank[b])+'</button>';
      }
      host.innerHTML=h+'</div>';
    }
    host.onclick=function(e){
      if(S.checked[ex.id]) return;
      var sl=e.target.closest?e.target.closest('[data-slot]'):null;
      if(sl){
        var k=parseInt(sl.getAttribute('data-slot'),10);
        if(A.filled[k]){ delete A.filled[k]; A.selSlot=null; }
        else { A.selSlot=k; }
        draw(); return;
      }
      var ch=e.target.closest?e.target.closest('[data-bank]'):null;
      if(ch){
        var w=ex.data.bank[parseInt(ch.getAttribute('data-bank'),10)];
        var target=(A.selSlot!==null&&A.selSlot!==undefined)?A.selSlot:null;
        if(target===null){
          for(var t=0;t<ex.data.answers.length;t++){ if(!A.filled[t]){ target=t; break; } }
        }
        if(target!==null){ A.filled[target]=w; A.selSlot=null; }
        draw();
      }
    };
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id], H=0,W=0,items=[];
    for(var k=0;k<d.answers.length;k++){
      var w=A.filled[k];
      if(!w){ items.push({label:'Blank '+(k+1),status:'missed',why:'You left this blank empty.'}); }
      else if(w.toLowerCase()===String(d.answers[k]).toLowerCase()){ H++; items.push({label:'Blank '+(k+1)+': '+d.answers[k],status:'correct',why:d.itemWhy&&d.itemWhy[k]?d.itemWhy[k]:''}); }
      else { W++; items.push({label:'Blank '+(k+1),status:'wrong',why:'You wrote "'+w+'". Correct: "'+d.answers[k]+'".'}); }
    }
    return {H:H,W:W,N:d.answers.length,items:items};
  }
};

/* ---------- terminal emulator (fake shell, normaliser, element scoring) ---------- */
WIDGETS.terminal={
  render:function(ex,host,A){
    if(!A.hist){ A.hist=[]; A.cmd=''; }
    var d=ex.data;
    var syn=d.syntaxPanel?'<div class="synpanel"><b>Syntax reminder</b>'+d.syntaxPanel.map(function(l){return esc(l);}).join('<br>')+'</div>':'';
    var samp=d.sampleOutput?'<div class="synpanel"><b>Sample output on a different target</b><pre class="plain" style="margin:6px 0 0">'+esc(d.sampleOutput.join('\n'))+'</pre></div>':'';
    host.innerHTML=
      '<p class="small">'+esc(d.note||'Type the command, press Enter to run it in the fake shell, then press Check.')+'</p>'+syn+samp+
      '<div class="term"><div class="term-out" id="termOut"></div>'+
      '<div class="term-line"><span class="ps1">'+esc(d.ps1)+'$</span>'+
      '<input id="termIn" class="term-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal input" placeholder="'+esc(d.placeholder||'type a command and press Enter')+'"></div></div>';
    var out=$('termOut'), inp=$('termIn');
    function line(txt,dim){ var p=document.createElement('div'); if(dim) p.style.opacity='.75'; p.textContent=txt; out.appendChild(p); out.scrollTop=out.scrollHeight; }
    for(var i=0;i<d.banner.length;i++) line(d.banner[i],true);
    if(d.banner.length) line(' ');
    inp.onkeydown=function(e){
      if(e.key!=='Enter') return;
      var c=inp.value; inp.value='';
      if(!c.trim()) return;
      A.cmd=c; A.hist.push(c);
      line(d.ps1+'$ '+c,false);
      var tok=c.trim().split(/\s+/)[0].toLowerCase();
      if(d.simTool.indexOf(tok)>=0){ for(var k=0;k<d.output.length;k++) line(d.output[k],false); }
      else if(tok==='clear'){ out.innerHTML=''; }
      else { line(tok+': command not found'); }
      line(' ',false);
    };
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id];
    var cmd=normCmd(A.cmd||(A.hist.length?A.hist[A.hist.length-1]:''));
    var H=0,W=0,items=[],i,el,ok;
    for(i=0;i<d.required.length;i++){
      el=d.required[i]; ok=false;
      if(el.all&&hasAll(cmd,el.all)) ok=true;
      if(!ok&&el.any&&hasAny(cmd,el.any)) ok=true;
      if(ok) H++;
      items.push({label:el.label,status:ok?'correct':'missed',why:ok?(el.whyOk||''):(el.why||'This element is missing from your command.')});
    }
    for(i=0;i<(d.forbidden||[]).length;i++){
      var f=d.forbidden[i], bad=false;
      if(f.any&&hasAny(cmd,f.any)) bad=true;
      if(!bad&&f.re){ try{ bad=new RegExp(f.re,'i').test(cmd); }catch(e){} }
      if(bad){ W++; items.push({label:f.label,status:'wrong',why:f.why}); }
    }
    if(!cmd){ items.push({label:'No command typed',status:'wrong',why:'You did not type or run any command.'}); W+=1; }
    return {H:H,W:W,N:d.required.length,items:items};
  },
  canonical:function(ex){
    var d=ex.data, h='<b>Canonical command (copyable):</b><pre class="plain" id="canonCmd">'+esc(d.expected)+'</pre>'+
      '<div class="actions" style="margin-top:-6px"><button type="button" class="btn ghost" data-act="copy">&#128203; Copy command</button></div>'+
      (d.parts?'<b>Part by part:</b><ul class="fb-items">':'');
    if(d.parts){
      for(var i=0;i<d.parts.length;i++) h+='<li><code>'+esc(d.parts[i].c)+'</code> — '+esc(d.parts[i].w)+'</li>';
      h+='</ul>';
    }
    return h;
  }
};

/* ---------- log viewer (filter box + embedded answer) ---------- */
WIDGETS.logview={
  render:function(ex,host,A){
    if(!A.f){ A.f=''; }
    if(!A.sel) A.sel=[];
    if(!A.sub) A.sub={};
    var clicky=(ex.data.mode==='cardsel');
    var rows='';
    for(var i=0;i<ex.data.lines.length;i++){
      rows+='<div class="ll'+(clicky?' clicky':'')+(clicky&&A.sel.indexOf(i)>=0?' sel':'')+'" data-li="'+i+'">'+hl(ex.data.lines[i])+'</div>';
    }
    host.innerHTML=
      '<div class="logv"><div class="logv-bar"><input id="logF" type="text" placeholder="Filter lines (plain text)…" value="'+esc(A.f)+'" aria-label="Filter log lines">'+
      '<span class="logv-cnt" id="logC"></span></div><div class="logv-lines" id="logL">'+rows+'</div></div>'+
      '<div id="logAns"></div>';
    var f=$('logF');
    function applyF(){
      A.f=f.value;
      var lls=$('logL').querySelectorAll('.ll'), n=0;
      for(var k=0;k<lls.length;k++){
        var show=!A.f||ex.data.lines[k].toLowerCase().indexOf(A.f.toLowerCase())>=0;
        lls[k].classList.toggle('off',!show);
        if(show) n++;
      }
      $('logC').textContent='showing '+n+' of '+ex.data.lines.length+' lines';
    }
    f.oninput=applyF; applyF();
    if(clicky){
      $('logL').onclick=function(e){
        if(S.checked[ex.id]) return;
        var r=e.target.closest?e.target.closest('[data-li]'):null;
        if(!r) return;
        var i=parseInt(r.getAttribute('data-li'),10), p=A.sel.indexOf(i);
        if(p>=0) A.sel.splice(p,1); else A.sel.push(i);
        r.classList.toggle('sel',A.sel.indexOf(i)>=0);
      };
    }
    var subHost=$('logAns');
    if(ex.data.mode==='qcm'){ WIDGETS.qcm.render({id:ex.id,data:ex.data.sub},subHost,A.sub,{}); }
    else if(ex.data.mode==='multi'){ WIDGETS.multi.render({id:ex.id,data:ex.data.sub},subHost,A.sub,{}); }
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id];
    if(d.mode==='qcm') return gradeQCM(d.sub,A.sub);
    if(d.mode==='multi') return gradeMulti(d.sub,A.sub);
    return gradeCardsel(d,A);
  }
};

/* ---------- cardsel: click lines in an artefact ---------- */
WIDGETS.cardsel={
  render:function(ex,host,A){
    if(!A.sel) A.sel=[];
    draw();
    function draw(){
      var h='<p class="small">Click the line(s) inside the artefact. Click again to un-select.</p>'+
        '<div class="logv"><div class="logv-lines" id="csL">';
      for(var i=0;i<ex.data.lines.length;i++){
        h+='<div class="ll clicky'+(A.sel.indexOf(i)>=0?' sel':'')+'" data-li="'+i+'">'+hl(ex.data.lines[i])+'</div>';
      }
      host.innerHTML=h+'</div></div>';
    }
    host.onclick=function(e){
      if(S.checked[ex.id]) return;
      var r=e.target.closest?e.target.closest('[data-li]'):null;
      if(!r) return;
      var i=parseInt(r.getAttribute('data-li'),10), p=A.sel.indexOf(i);
      if(p>=0) A.sel.splice(p,1); else A.sel.push(i);
      draw();
    };
  },
  grade:function(ex){ return gradeCardsel(ex.data,S.ans[ex.id]); }
};

/* ---------- branching decision tree (auto-pause only on final Check) ---------- */
WIDGETS.branch={
  render:function(ex,host,A){
    if(A.step===undefined){ A.step=0; A.picks=[]; A.sel=null; }
    host.innerHTML='<div id="brMini" aria-live="polite"></div><div id="brStep"></div>';
    draw();
    function draw(){
      var steps=ex.data.steps, i=A.step, st=steps[i];
      var chip=$('stepchip'); if(chip) chip.textContent='STEP '+(i+1)+' OF '+steps.length;
      if(!A.perm){ A.perm={}; }
      if(!A.perm[i]){ A.perm[i]=shuffle(range(st.options.length)); }
      var h='<p class="small">Decision tree: choose one option, then confirm. The timer keeps running between steps and stops only on the final Check.</p>';
      h+='<div style="margin-bottom:8px"><b>'+esc(st.q)+'</b></div>';
      var perm=(A.perm&&A.perm[i])?A.perm[i]:range(st.options.length);
      for(var j=0;j<perm.length;j++){
        var oi=perm[j], on=(A.sel===oi);
        h+='<button type="button" class="opt'+(on?' sel':'')+'" data-boi="'+oi+'" role="radio" aria-checked="'+on+'"><span class="lab">'+String.fromCharCode(65+j)+'.</span><span>'+esc(st.options[oi])+'</span></button>';
      }
      h+='<div class="actions"><button type="button" class="btn '+(i===steps.length-1?'primary':'ghost')+'" id="brNext">'+(i===steps.length-1?'Check final answer':'Confirm step')+'</button></div>';
      $('brStep').innerHTML=h;
      $('brNext').onclick=function(){
        if(S.checked[ex.id]) return;
        if(A.sel===null){ $('brMini').innerHTML='<p class="small">Select an option first.</p>'; return; }
        A.picks[i]=A.sel;
        if(i<steps.length-1){
          var ok=(A.sel===steps[i].answer);
          $('brMini').innerHTML='<p class="small">'+(ok?'&#10003; Step '+(i+1)+' recorded — that is a reasonable step.':'&#10007; Step '+(i+1)+' recorded — keep it in mind; the full picture appears at the final Check.')+'</p>';
          A.step=i+1; A.sel=null;
          draw();
        } else {
          doCheck();
        }
      };
      host.onclick=function(e){
        var b=e.target&&e.target.closest?e.target.closest('[data-boi]'):null;
        if(!b) return;
        A.sel=parseInt(b.getAttribute('data-boi'),10);
        var all=$('brStep').querySelectorAll('[data-boi]');
        for(var k=0;k<all.length;k++){ var on2=all[k].getAttribute('data-boi')==String(A.sel); all[k].classList.toggle('sel',on2); all[k].setAttribute('aria-checked',on2?'true':'false'); }
      };
    }
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id], H=0,W=0,items=[];
    for(var i=0;i<d.steps.length;i++){
      var st=d.steps[i], pick=A.picks[i];
      if(pick===undefined||pick===null){ items.push({label:'Step '+(i+1),status:'missed',why:'No choice recorded.'}); continue; }
      var ok=(pick===st.answer);
      if(ok) H++; else W++;
      items.push({label:'Step '+(i+1)+': '+st.short,status:ok?'correct':'wrong',
        why:ok?st.whyOk:('You chose "'+st.options[pick]+'". Best choice: "'+st.options[st.answer]+'". '+st.whyOk)});
    }
    return {H:H,W:W,N:d.steps.length,items:items};
  }
};

/* ---------- SOC alert triage queue (partial credit per alert) ---------- */
WIDGETS.triage={
  render:function(ex,host,A){
    if(!A.orders){ A.orders=[]; A.picks={}; for(var i=0;i<ex.data.alerts.length;i++) A.orders.push(shuffle(range(ex.data.alerts[i].actions.length))); }
    var h='<p class="small">Choose the best action for each alert, then press Check. Each alert scores one item.</p>';
    h+='<table class="tri"><thead><tr><th style="width:46%">Alert</th><th>Best action</th></tr></thead><tbody>';
    for(var a=0;a<ex.data.alerts.length;a++){
      var al=ex.data.alerts[a];
      var opts='<option value="">— choose —</option>';
      for(var j=0;j<A.orders[a].length;j++){
        var ai=A.orders[a][j];
        opts+='<option value="'+ai+'"'+(A.picks[a]===ai?' selected':'')+'>'+esc(al.actions[ai])+'</option>';
      }
      h+='<tr><td><b>'+esc(al.t)+'</b></td><td><select data-ai="'+a+'" aria-label="Action for alert '+(a+1)+'">'+opts+'</select></td></tr>';
    }
    host.innerHTML=h+'</tbody></table>';
    host.onchange=function(e){
      if(!e.target||!e.target.matches||!e.target.matches('select[data-ai]')) return;
      if(S.checked[ex.id]) return;
      var a=parseInt(e.target.getAttribute('data-ai'),10);
      A.picks[a]=e.target.value===''?null:parseInt(e.target.value,10);
    };
  },
  grade:function(ex){
    var d=ex.data, A=S.ans[ex.id], H=0,W=0,items=[];
    for(var a=0;a<d.alerts.length;a++){
      var p=A.picks[a];
      if(p===null||p===undefined){ items.push({label:d.alerts[a].t,status:'missed',why:'No action chosen for this alert.'}); }
      else if(p===d.alerts[a].correct){ H++; items.push({label:d.alerts[a].t,status:'correct',why:d.alerts[a].whyOk||''}); }
      else { W++; items.push({label:d.alerts[a].t,status:'wrong',why:'You chose "'+d.alerts[a].actions[p]+'". Best: "'+d.alerts[a].actions[d.alerts[a].correct]+'". '+(d.alerts[a].whyOk||'')}); }
    }
    return {H:H,W:W,N:d.alerts.length,items:items};
  }
};

/* ---------- copy support for canonical command blocks ---------- */
document.addEventListener('click', function(e){
  var el=e.target&&e.target.closest?e.target.closest('[data-act="copy"]'):null;
  if(!el) return;
  var pre=$('canonCmd');
  if(pre && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(pre.textContent).catch(function(){});
  }
});

/* ---------- boot ---------- */
renderHeader();
showIntro();
})();

</script>
