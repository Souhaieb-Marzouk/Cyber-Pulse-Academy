<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1021.007 Cloud Services — HARD</title>
<style>
:root{
  --bg-page:#070c12;
  --bg-panel:#0d141d;
  --bg-surface:#111a26;
  --bg-surface-2:#0a111a;
  --bg-elev:#172335;
  --ink:#e9eff7;
  --ink-dim:#a9b9cb;
  --ink-faint:#8497ab;
  --line:#1f2b3c;
  --line-soft:#182331;
  --blue:#4aa8e8;   --blue-soft:rgba(74,168,232,.13);
  --amber:#e6aa3c;  --amber-soft:rgba(230,170,60,.13);
  --green:#41c07f;  --green-soft:rgba(65,192,127,.13);
  --red:#ef5a6a;    --red-soft:rgba(239,90,106,.15);
  --sev-easy:#41c07f;
  --sev-medium:#e6aa3c;
  --sev-hard:#f0813c;
  --sev-extreme:#ef5a6a;
  --focus:#4aa8e8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1 0 auto;width:100%;max-width:980px;margin:0 auto;padding:20px 16px 40px}
.foot{flex-shrink:0;margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:12.5px;background:var(--bg-panel)}
.foot b{color:var(--ink-dim);letter-spacing:.08em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-surface-2)}
::-webkit-scrollbar-thumb{background:#24344b;border-radius:6px;border:2px solid var(--bg-surface-2)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(8,13,20,.94);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.14em;font-size:12.5px;color:var(--green)}
.brand small{color:var(--ink-faint);letter-spacing:.05em;font-weight:600}
.tb-sep{width:1px;height:22px;background:var(--line)}
.tb-title{font-weight:700;font-size:13.5px;color:var(--ink-dim);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stat{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;font-weight:600;background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:32px}
.tb-stat .ic{font-size:13px}
.tb-stat.timer{font-family:var(--mono);color:var(--ink)}
.tb-state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px;border:1px solid}
.tb-state.manual{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.tb-state.autocheck{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.tb-btn:hover:not(:disabled){border-color:var(--blue)}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}
.tb-btn.hint{color:var(--amber)}
.tb-btn.skip{color:var(--ink-dim)}
.prog{height:3px;background:var(--line-soft)}
.prog i{display:block;height:100%;background:var(--green);width:0%;transition:width .25s}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 12px;color:#08110b}
.badge::before{content:"●";font-size:9px}
.sev-EASY{background:var(--sev-easy)}
.sev-MEDIUM{background:var(--sev-medium)}
.sev-HARD{background:var(--sev-hard)}
.sev-EXTREMELY_HARD{background:var(--sev-extreme);color:#160407}
.otype{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg-surface)}
/* ---------- intro ---------- */
.intro-head{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--bg-panel),var(--bg-surface-2));padding:26px 26px 20px;margin-bottom:16px}
.intro-head h1{margin:8px 0 4px;font-size:26px;line-height:1.25}
.intro-head .sub{color:var(--ink-dim);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-dim);background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:34px}
.chip .ic{color:var(--ink-faint)}
.cand{margin-top:12px;font-size:13px;color:var(--ink-faint)}
.intro-sec{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;background:var(--bg-panel);padding:18px 22px;margin-bottom:14px}
.intro-sec.learn{border-left-color:var(--blue)}
.intro-sec.keys{border-left-color:var(--amber)}
.intro-sec.how{border-left-color:var(--green)}
.intro-sec h2{margin:0 0 10px;font-size:15px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.intro-sec.learn p{color:var(--ink-dim);margin:0 0 10px}
.intro-sec.learn p:last-child{margin-bottom:0}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kw-card{background:var(--bg-surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 14px}
.kw-card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.kw-card ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:13.5px}
.kw-card li{margin:2px 0}
.rules{margin:0;padding:0;list-style:none}
.rules li{position:relative;padding:7px 0 7px 26px;color:var(--ink-dim);font-size:14px}
.rules li::before{content:"▸";position:absolute;left:4px;color:var(--green)}
.rules li .dim{color:var(--ink-faint)}
/* ---------- exercise card ---------- */
.excard{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--bg-panel);border:1px solid var(--line);border-left:4px solid var(--blk,var(--blue));border-radius:12px;padding:16px 20px}
.blk-scenario{--blk:var(--blue)}
.blk-question{--blk:var(--amber)}
.blk-answer{--blk:var(--green)}
.blk-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--blk,var(--ink));margin-bottom:10px}
.blk-label .dot{width:8px;height:8px;border-radius:50%;background:var(--blk,var(--ink))}
.ex-title{margin:0 0 8px;font-size:16.5px}
.summary{color:var(--ink-faint);font-size:13.5px;font-style:italic;margin:0 0 8px}
.showfull{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;min-height:32px}
.scen-body p{margin:0 0 10px;color:var(--ink-dim)}
.scen-body p:last-child{margin-bottom:0}
details.artef{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin:10px 0 0}
details.artef summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--blue);user-select:none;min-height:40px;display:flex;align-items:center}
details.artef .artbody{padding:0 14px 12px}
.mono{font-family:var(--mono);font-size:13px;line-height:1.5;color:#c8d8e6;background:var(--bg-surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:0}
table.attable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:0}
table.attable th{background:var(--bg-elev);color:var(--ink);text-align:left}
table.attable th,table.attable td{border:1px solid var(--line-soft);padding:6px 10px;color:var(--ink-dim)}
.q-text{margin:0;font-weight:700;font-size:16px;color:var(--ink)}
/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-height:44px;cursor:pointer;color:var(--ink);font-size:14.5px;font-family:var(--sans);margin:0 0 8px}
.opt:last-child{margin-bottom:0}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}
.opt .mark{font-weight:800;flex-shrink:0}
/* ---------- match ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol h4,.obank h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mleft{flex:1;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;min-height:44px;display:flex;align-items:center}
.mzone{flex:1;background:var(--bg-surface-2);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;min-height:44px;color:var(--ink-faint);font-size:13.5px;cursor:pointer;text-align:left;font-family:var(--sans)}
.mzone.filled{border-style:solid;border-color:var(--blue);color:var(--ink)}
.mzone.dragover{border-color:var(--green)}
.mzone.correct{border-color:var(--green);background:var(--green-soft)}
.mzone.wrong{border-color:var(--red);background:var(--red-soft)}
.mbank{display:flex;flex-direction:column}
.mchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;margin-bottom:8px;cursor:grab;color:var(--ink);font-size:13.5px;text-align:left;font-family:var(--sans)}
.mchip:disabled{cursor:default;opacity:.5}
.mchip.selchip{border-color:var(--amber);background:var(--amber-soft)}
.mchip.used{opacity:.35}
.mhintline{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- order ---------- */
.ordlist{list-style:none;margin:0;padding:0;counter-reset:ord}
.orditem{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.orditem.dragover{border-color:var(--green)}
.orditem .num{font-family:var(--mono);color:var(--amber);font-weight:700;min-width:22px;text-align:center}
.orditem .txt{flex:1;font-size:14px}
.orditem.correct{border-color:var(--green)}
.orditem.wrong{border-color:var(--red)}
.ordbtns{display:flex;gap:4px}
.ordbtns button{min-width:34px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);cursor:pointer;font-size:14px}
.ordbtns button:hover{border-color:var(--blue)}
/* ---------- fill ---------- */
.fillwrap{font-size:15.5px;color:var(--ink-dim);line-height:2.1;white-space:pre-wrap}
.fillin{font-family:var(--mono);font-size:13.5px;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 10px;min-height:38px;width:170px;margin:0 3px}
.fillin:focus{border-color:var(--blue);outline:none}
.fillin.correct{border-color:var(--green)}
.fillin.wrong{border-color:var(--red)}
.fbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:38px;font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer}
.fchip:hover{border-color:var(--amber)}
/* ---------- terminal ---------- */
.term{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:8px;background:var(--bg-elev);padding:8px 12px;font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.term-bar .dots{letter-spacing:3px;color:var(--red)}
.term-out{font-family:var(--mono);font-size:13px;line-height:1.55;color:#c8d8e6;padding:12px 14px;min-height:130px;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term-out .tl-dim{color:var(--ink-faint)}
.term-out .tl-danger{color:var(--red);font-weight:700}
.term-out .tl-echo{color:var(--ink)}
.term-line{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding:10px 14px}
.term-prompt{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--mono);font-size:13px;min-height:34px}
.term-in:focus{outline:none}
details.syntax{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin-top:10px}
details.syntax summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--amber);min-height:40px;display:flex;align-items:center}
details.syntax .artbody{padding:0 14px 12px}
/* ---------- logview ---------- */
.logpanel{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log-tools{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-elev);border-bottom:1px solid var(--line-soft)}
.logfilter{flex:1;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 12px;min-height:38px}
.logfilter:focus{border-color:var(--blue);outline:none}
.log-count{font-size:12px;color:var(--ink-faint);font-family:var(--mono);white-space:nowrap}
.loglines{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#bccfe0;padding:12px 14px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.loglines mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}
.wtitle{font-weight:700;margin:14px 0 10px;color:var(--ink)}
/* ---------- decision ---------- */
.dstep{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.dstep.locked{opacity:.9}
.dlabel{display:inline-flex;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue);border-radius:6px;padding:3px 9px;margin-bottom:8px}
.dprompt{font-family:var(--mono);font-size:13px;color:var(--ink-dim);background:var(--bg-surface-2);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 10px;white-space:pre-wrap}
.dq{font-weight:700;margin:0 0 10px}
.drecorded{color:var(--ink-faint);font-size:13px;margin-top:8px}
.dwhy{font-size:13.5px;color:var(--ink-dim);background:var(--bg-surface-2);border-radius:8px;padding:9px 12px;margin-top:8px}
/* ---------- hint ---------- */
.hintbox{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin-top:12px;color:var(--ink-dim)}
.hintbox .hb{color:var(--amber);font-weight:800;font-size:12px;letter-spacing:.1em;display:block;margin-bottom:4px}
.penaltynote{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- feedback ---------- */
.fb{border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.fb.ok{border-color:var(--green)}
.fb.bad{border-color:var(--red)}
.fb.part{border-color:var(--amber)}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 18px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb.ok .fb-head{background:var(--green-soft);color:var(--green)}
.fb.bad .fb-head{background:var(--red-soft);color:var(--red)}
.fb.part .fb-head{background:var(--amber-soft);color:var(--amber)}
.fb-credit{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim);font-weight:600}
.fb-body{padding:14px 18px;background:var(--bg-panel)}
.fi{display:flex;gap:9px;padding:4px 0;font-size:14px;color:var(--ink-dim)}
.fi .ic{flex-shrink:0;font-weight:800}
.fi.ok .ic{color:var(--green)}
.fi.bad .ic{color:var(--red)}
.fi.miss .ic{color:var(--ink-faint)}
.fi.warn .ic{color:var(--red)}
.fi.warn{color:var(--red);font-weight:600}
.fi.note{color:var(--ink-faint)}
.fb-explain{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:12px;color:var(--ink-dim);font-size:14px}
.fb-explain p{margin:0 0 10px}
.fb-explain p:last-child{margin-bottom:0}
.fb-study{margin-top:10px;font-size:13px;color:var(--blue)}
.fb .mono{margin-top:10px}
/* ---------- actions ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:10px 20px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-family:var(--sans)}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:transparent;color:#04120a}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-amber{background:var(--amber);border-color:transparent;color:#1c1204}
.ghost-note{color:var(--ink-faint);font-size:13px}
/* ---------- review ---------- */
.revlist{display:flex;flex-direction:column;gap:10px}
.revrow{display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex-wrap:wrap}
.revrow .rn{font-family:var(--mono);color:var(--amber);font-weight:700}
.revrow .rt{flex:1;color:var(--ink-dim);font-size:14px;min-width:200px}
.revrow .badge-skip{color:var(--ink-faint);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* ---------- results ---------- */
.res-head{border:1px solid var(--line);border-radius:14px;background:var(--bg-panel);padding:26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ring{width:172px;height:172px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--pct)*1%),var(--bg-elev) 0);display:grid;place-items:center;flex-shrink:0}
.ring .rin{width:134px;height:134px;border-radius:50%;background:var(--bg-panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:34px;font-weight:800;font-family:var(--mono)}
.ring .of{font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
.res-verdict{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.res-verdict.pass{color:var(--green)}
.res-verdict.fail{color:var(--red)}
.res-sub{color:var(--ink-dim);font-size:14px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.statcard{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.statcard .sv{font-size:22px;font-weight:800;font-family:var(--mono)}
.statcard .sv.ok{color:var(--green)}
.statcard .sv.part{color:var(--amber)}
.statcard .sv.bad{color:var(--red)}
.statcard .sv.skip{color:var(--ink-faint)}
.statcard .sl{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.pausereport{border:1px solid var(--line);border-radius:10px;background:var(--bg-panel);padding:12px 16px;color:var(--ink-dim);font-size:13.5px;margin-bottom:14px}
.restable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.restable th{background:var(--bg-elev);text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase}
.restable td{padding:8px 12px;border-top:1px solid var(--line-soft);color:var(--ink-dim)}
.restable td.num{font-family:var(--mono)}
.st-ok{color:var(--green);font-weight:700}
.st-part{color:var(--amber);font-weight:700}
.st-bad{color:var(--red);font-weight:700}
.st-skip{color:var(--ink-faint);font-weight:700}
/* ---------- overlay ---------- */

<script type="application/json" id="cm-exercise-meta">{"attackId":"T1021.007","attackName":"Cloud Services","objectType":"sub-technique","severity":"HARD","topicId":"t1021.007","batch":3,"title":"T1021.007 Cloud Services — HARD","difficulty":"hard","estimatedMinutes":45,"timerMinutes":45,"questionCount":17,"passMark":70,"learn":["T1021.007 is a sub-technique of T1021 Remote Services in the Lateral Movement tactic: adversaries with valid accounts use cloud management services — AWS Systems Manager, Azure Run Command, Google OS Login — to reach other machines from the control plane instead of over the network.","You will learn how the path is scoped and hardened: least-privilege IAM for ssm:* and compute roles, instance-tag conditions, service control policy guardrails, cloud-only admin identities separated from on-premises, and conditional access with MFA in front of console and CLI.","You will learn session logging in depth: the Session Manager preferences document, transcript delivery to S3 and CloudWatch, KMS encryption of transcripts, and why a missing transcript changes what an investigator can actually prove.","You will train the two triage traps of real SOCs: benign automation that looks alarming, like a scheduled patch push at 03:00 across the whole fleet, and alarming activity that looks benign, like a small weekly session that never had a ticket.","Daily tasks at this level: review IAM policies for over-broad ssm:*, read role assumption chains in CloudTrail, compare automation calendars against command pushes, and write detections that survive both traps without drowning the on-call in noise.","The exam uses realistic extracts with near-miss answers. Expect to justify every verdict in plain words, once from the attacker's chair and once from the defender's chair."],"keywords":[{"theme":"IAM Scoping & Guardrails","items":["ssm:SendCommand scoped by instance tags","ssm:StartSession allow-listed to named roles","Service Control Policy guardrails for ssm:*","cloud-only admin identities separate from on-premises","aws iam get-role-policy reviews"]},{"theme":"Session Logging & Hardening","items":["SSM-SessionManagerRunShell preferences document","transcript delivery to S3 and CloudWatch","KMS encryption of session transcripts","conditional access and MFA for CLI logins","aws ssm get-document verification"]},{"theme":"Detection Engineering","items":["SendCommand volume spikes versus patch calendars","rare CLI user-agent alerts","StartSession from new source networks","UpdateSSMDocument change review","benign automation versus hands-on-keyboard"]}]}</script>

premises","aws iam get-role-policy reviews"]},{"theme":"Session Logging & Hardening","items":["SSM-SessionManagerRunShell preferences document","transcript delivery to S3 and CloudWatch","KMS encryption of session transcripts","conditional access and MFA for CLI logins","aws ssm get-document verification"]},{"theme":"Detection Engineering","items":["SendCommand volume spikes versus patch calendars","rare CLI user-agent alerts","StartSession from new source networks","UpdateSSMDocument change review","benign automation versus hands-on-keyboard"]}]};
var EXAMS = [{"id":"e01","type":"logview","title":"03:00 burst on 120 instances","summary":"A fleet-wide push at 03:00 — automation or attacker?","scenario":"Halcyon Health's new alert fired at 03:02: SendCommand with AWS-RunShellScript to 120 instances, one role, one minute. The rule assumes humans send commands; nobody told it about automation. The extract below includes the association that ran the push and the quiet lines around it. Read them all before you judge.","question":"Give the most defensible verdict on the 03:00 push:","hint":"Look for a scheduled pattern marker before calling it hostile.","explanation":"The burst matches the nightly patch association: the trigger field names it, the cron schedule is visible in the DescribeAssociation line, and the agent-update companion run follows the same pattern. Isolation would hit patient-care systems for nothing. The adm.oduya console session at 03:40 is a separate, human-sized signal worth its own look — do not let the big burst hide it.\n\nVolume is not malice: read the trigger and the calendar first.","study":"Study SSM associations and cron schedules so fleet bursts read as automation when they are.","filterable":true,"log":{"header":["time","event","detail"],"lines":["2026-05-04T02:58:40Z ListAssociations principal=ssm-patch-runner agent=aws-cli/2.15 src=10[.]44[.]2[.]31","2026-05-04T02:59:00Z DescribeAssociation association=nightly-patch schedule=cron(0 3 * * ? *) principal=ssm-patch-runner","2026-05-04T03:00:01Z SendCommand document=AWS-RunShellScript targets=120 principal=ssm-patch-runner trigger=association:nightly-patch","2026-05-04T03:00:58Z SendCommand document=AWS-RunShellScript targets=120 principal=ssm-patch-runner trigger=association:nightly-patch","2026-05-04T03:01:40Z GetParameter name=/patch/window principal=ssm-patch-runner src=10[.]44[.]2[.]31","2026-05-04T03:04:12Z SendCommand document=AWS-UpdateSSMAgent targets=120 principal=ssm-patch-runner trigger=association:agent-updates","2026-05-04T03:19:27Z DescribeInstanceInformation principal=ssm-patch-runner src=10[.]44[.]2[.]31","2026-05-04T03:40:19Z StartSession target=i-0a77c31b8e2d54f90 principal=adm.oduya agent=console src=203[.]0[.]113[.]8","2026-05-04T03:47:02Z TerminateSession target=i-0a77c31b8e2d54f90 principal=adm.oduya agent=console src=203[.]0[.]113[.]8"]},"widget":{"type":"mcq","question":"What is the most defensible verdict on the 03:00 burst?","options":["Attack — isolate the 120 instances now","Benign — a scheduled association ran the documented patch","Undetermined — collect evidence and escalate to the platform team","Benign — alerts on SendCommand should be disabled"],"correct":1}},{"id":"e02","type":"mcq","title":"The scoping that actually binds","summary":"Which IAM condition stops the fleet pivot?","scenario":"Halcyon Health must keep Run Command for patching but stop any single role from commanding the whole fleet. Four policy drafts are on the table; three of them look strict and still allow the pivot. You are the reviewer who has to pick the one that actually binds.","question":"Which draft actually stops a single role from commanding every instance?","hint":"A condition on the target resource beats a condition on the tool.","explanation":"Allowing ssm:SendCommand with a resource condition on approved instance tags binds the permission to specific machines, so a stolen role cannot command the fleet. A console-only deny still lets the CLI through — the pivot used aws-cli, not a browser. Allowing ssm:* on all resources is the incident waiting to happen, and StartSession for everyone multiplies the path.\n\nResource conditions bind; tool-only restrictions slide.","study":"Study IAM condition keys and resource ARNs for Systems Manager targeting.","options":["Deny ssm:SendCommand only when called from the console","Allow ssm:* on all resources for the patch role","Allow ssm:SendCommand with an instance-tag resource condition","Allow ssm:StartSession to every instance for all staff and contractors"],"correct":2},{"id":"e03","type":"match","title":"What each guardrail buys","summary":"Match control to the risk it removes.","scenario":"The change board wants each control justified against one specific risk from the Halcyon Health case. Five controls are shortlisted; the case notes list five matching risks, from stolen federated accounts to unreviewed tooling edits. The board rejects any control that cannot name its risk in one line.","question":"Assign each control to the risk it removes:","hint":"One control is about identity origin, one about fleet-wide deny, one about transcripts.","explanation":"Separate cloud-only admin identities break the bridge from an on-premises breach; a service control policy denies ssm:SendCommand outside approved accounts org-wide; S3 transcript logging makes sessions replayable; conditional access with MFA raises the cost of stolen credentials; instance-tag conditions on SendCommand bind the permission to named machines.\n\nName the risk first, then pick the control — never the reverse.","study":"Study the mitigation catalogue for cloud management services and map each to its risk.","pairs":[{"left":"Cloud-only admin identities","right":"On-prem compromise cannot reach the control plane"},{"left":"Service Control Policy guardrail","right":"ssm:SendCommand denied outside approved accounts"},{"left":"Session transcripts to S3","right":"Every interactive session becomes replayable"},{"left":"Conditional access with MFA","right":"Stolen passwords alone no longer log in"},{"left":"Instance-tag condition on SendCommand","right":"A role cannot command untagged machines"}]},{"id":"e04","type":"decision","title":"The Saturday 22:00 session","summary":"A tiny weekly session nobody wants to escalate.","scenario":"For six weeks, adm.oduya's account started one Session Manager shell on a billing instance every Saturday at 22:05, for about ten minutes. The team says 'that's Dave's patching'. No ticket exists, transcripts are off, and the source address changes twice across the six weeks. The signal is small, the story is comfortable — work it anyway.","question":"Work through the three decision steps on the Saturday session:","hint":"Comfortable stories with no paperwork are classic cover; check the transcript gap first.","explanation":"Verification: six repeats plus two changing source addresses and no ticket means the patching story is unverified, not true. Evidence: with transcripts off, nobody can say what the session did — the absence is itself the finding. Action: enable transcripts, ask the account owner through management, rotate credentials if ownership cannot confirm, and alert on the exact pattern.\n\nSmall and regular is how quiet access prefers to look; the defender's job is to make it provable.","study":"Study session evidence: what CloudTrail proves, what only transcripts prove, and the gap between.","steps":[{"label":"STEP 1 OF 3 — test the story","prompt":"Pattern: StartSession on the billing instance, Saturdays 22:05, six weeks, two different source addresses, no ticket.","question":"What does the evidence say about the patching story?","options":["Unconfirmed — no ticket, no calendar entry, changing sources","Confirmed — the team says it is patching","Irrelevant — sessions under 15 minutes never matter"],"correct":0,"why":"A story without paperwork is a hypothesis; two source addresses for one human habit weakens it further."},{"label":"STEP 2 OF 3 — name the evidence gap","prompt":"Preferences show transcripts disabled; CloudTrail holds only StartSession and TerminateSession.","question":"What can you actually prove about the session content?","options":["Nothing about content — that gap is itself a finding","The full command history from CloudTrail","Whatever the instance's web server logs say"],"correct":0,"why":"Without transcripts the content is unprovable; stating that plainly drives the fix."},{"label":"STEP 3 OF 3 — act","prompt":"The account owner cannot be reached before Monday; the pattern repeats tomorrow night.","question":"Which action fits tonight?","options":["Delete the billing instance to be safe","Enable transcripts, alert on the exact pattern, prepare a managed credential rotation","Wait a month for more data points"],"correct":1,"why":"Turning on evidence and targeted alerting costs nothing and prepares proportionate containment; deleting a production system is disproportionate."}]},{"id":"e05","type":"order","title":"Scope down ssm:* after the case","summary":"Order the five moves that shrink the pivot.","scenario":"The Halcyon Health review found four roles holding ssm:* on all resources. The platform team must shrink the permission, keep patching alive, switch logging on, and prove the break-glass path still works — in an order that never leaves the fleet unpatchable or the team locked out.","question":"Arrange the five platform moves in the correct order:","hint":"Inventory before rewrite; re-test before enforcement bites.","explanation":"Inventory first: you cannot rewrite what you have not listed. Replace broad ssm:* with named actions per role, add instance-tag conditions so roles bind to machines, move session logging on with the preferences document, and re-test the break-glass path before the old broad policies are finally revoked.\n\nDefender view: every step is reversible until the last revocation — that is what makes the change survivable.","study":"Study IAM least-privilege refactors: inventory, rewrite, condition, log, verify, revoke.","items":["Inventory every role holding ssm:* on all resources","Replace broad ssm:* with named actions per role","Add instance-tag conditions to SendCommand and StartSession","Enable session logging with the preferences document","Re-test break-glass paths, then revoke the old policies"]},{"id":"e06","type":"fill","title":"The preferences document","summary":"Complete the note on transcript plumbing.","scenario":"A junior asks how a session transcript is born. The answer has three parts: the preferences document by name, the key that encrypts it on the way to storage, and the audit service that records the session even when no transcript exists. Complete the trainer note with all three terms.","question":"Complete the trainer note with the three missing terms:","hint":"The document name starts with SSM; the key service is KMS; the audit is the trail.","explanation":"The preferences document named SSM-SessionManagerRunShell directs transcripts to storage and encrypts them with a KMS key; CloudTrail records every session regardless. The metadata service and IMDS are different plumbing, and 'guest' is not a configuration object here.\n\nName the three parts and you can audit any tenant in minutes.","study":"Study the SSM-SessionManagerRunShell document and its storage and encryption fields.","text":"Transcripts follow the ___ document named SSM-SessionManagerRunShell, are encrypted with a ___ key in transit to storage, while every session event still lands in ___.","blanks":["preferences","KMS","CloudTrail"],"bank":["preferences","KMS","CloudTrail","metadata","IMDS","console"]},{"id":"e07","type":"terminal","title":"Read the deploy-bot policy","summary":"Fetch the inline policy that grants the pivot.","scenario":"Case file: role deploy-bot in Halcyon Health account 987654321098 ran pushes in the 03:00 pattern on dates when no patch calendar existed. Before recommending changes you need the exact inline policy attached to the role, verbatim, for the finding. The simulator allows read-only IAM inspection only.","question":"Type the command that reads the inline policy of role deploy-bot:","hint":"get-role-policy takes --role-name and --policy-name.","explanation":"aws iam get-role-policy --role-name deploy-bot --policy-name ssm-access prints the policy document — read-only, audit-friendly. Deleting or detaching the policy would remove the very evidence you are reviewing and break the role in production.\n\nRead the policy, quote the statements, then change access through change control.","study":"Study aws iam get-role-policy and reading Effect, Action and Resource statements.","prompt":"cloud-engineer@halcyon-mgmt:~$","skill":"iam-policy-review","knownTools":["aws","jq","grep"],"expected":"aws iam get-role-policy --role-name deploy-bot --policy-name ssm-access","elements":[{"label":"the IAM read command","any":["aws iam get-role-policy"]},{"label":"the role switch","any":["--role-name"]},{"label":"the role name","any":["deploy-bot"]},{"label":"the policy switch and name","any":["--policy-name","ssm-access"]}],"forbidden":[{"any":["delete-role-policy","detach-role-policy"],"why":"Removing the policy destroys the artefact you are auditing and breaks production — change access via change control."}],"output":["Role: deploy-bot  Policy: ssm-access","Statement 1: Effect=Allow Action=ssm:SendCommand Resource=*","Statement 2: Effect=Allow Action=ssm:StartSession Resource=*","Statement 3: Effect=Allow Action=ssm:TerminateSession Resource=*","Reviewer note: Resource=* on SendCommand permits fleet-wide pivoting."],"syntaxPanel":"aws iam get-role-policy --role-name <role> --policy-name <policy>\n  get-role-policy   print an inline policy attached to a role\n  --role-name       the IAM role to inspect\n  example:          aws iam get-role-policy --role-name ci-runner --policy-name s3-access","sampleOutput":"Role: ci-runner  Policy: s3-access\nStatement 1: Effect=Allow Action=s3:GetObject Resource=arn:aws:s3:::build-artefacts/*"},{"id":"e08","type":"logview","title":"Two accounts, one actor","summary":"Follow the role chain from login to shell.","scenario":"The extract below covers the hour before the alert: an identity switch, a document push, and an interactive shell on one target. Halcyon Health keeps one account, so the chain lives inside it. Filter the lines, then complete the chain note at the bottom with the role and the document.","question":"Complete the chain note with the role and the document from the log:","hint":"The AssumeRole line renames the actor; the push line names the document.","explanation":"adm.oduya assumed ssm-fleet-admin at 01:58; everything after carries that assumed role. The one-shot push used AWS-RunShellScript on two targets, and the shell opened on i-0a77c31b8e2d54f90. ci-audit and the PowerShell document belong to other lines' business.\n\nAttacker view: assume a powerful role, push a quiet document, then ride an interactive shell — three events, one story. Read them together and the pivot becomes visible.","study":"Study reading assumed-role sessions in CloudTrail: principal fields change after AssumeRole.","filterable":true,"log":{"header":["time","event","detail"],"lines":["2026-05-10T01:58:12Z AssumeRole principal=adm.oduya role=ssm-fleet-admin src=203[.]0[.]113[.]77 agent=aws-cli/2.15","2026-05-10T01:58:40Z ListCommands principal=ssm-fleet-admin agent=aws-cli/2.15 src=203[.]0[.]113[.]77","2026-05-10T01:59:22Z SendCommand document=AWS-RunShellScript targets=2 principal=ssm-fleet-admin src=203[.]0[.]113[.]77","2026-05-10T02:00:05Z GetCommandInvocation principal=ssm-fleet-admin command=7f3a91 src=203[.]0[.]113[.]77","2026-05-10T02:03:47Z StartSession target=i-0a77c31b8e2d54f90 principal=ssm-fleet-admin src=203[.]0[.]113[.]77","2026-05-10T02:41:19Z TerminateSession target=i-0a77c31b8e2d54f90 principal=ssm-fleet-admin src=203[.]0[.]113[.]77","2026-05-10T02:55:03Z DescribeDocument name=AWS-RunShellScript principal=ci-audit src=10[.]44[.]8[.]5"]},"widget":{"type":"fill","question":"Complete the chain note with the role and the document:","text":"The actor assumed role ___ and then pushed document ___ to two targets before opening a shell.","blanks":["ssm-fleet-admin","AWS-RunShellScript"],"bank":["ssm-fleet-admin","AWS-RunShellScript","AWS-RunPowerShellScript","ci-audit","adm.oduya"]}},{"id":"e09","type":"multi","title":"Why the pivot stayed quiet","summary":"Select every gap that hid the pivot.","scenario":"The Halcyon Health after-action list names candidate gaps. Some candidates are real gaps that hid the pivot; two are things that actually worked and must not be 'fixed' by the board. Tick the real gaps only — the board reads this list verbatim and funds whatever survives.","question":"Select every gap that genuinely let the pivot stay quiet:","hint":"Two options describe controls that worked.","explanation":"No transcript logging, ssm:* on Resource=*, CLI-only alerting, and unreviewed agent runs all hid the pivot; the running SSM Agent itself is required plumbing, not a gap, and CloudTrail being on is the reason the case exists at all.\n\nAttacker view: the quiet parts — no transcripts, broad rights, unwatched user-agents — are the load-bearing walls of the pivot.","study":"Study the difference between required plumbing, working controls, and true detection gaps.","options":["Session transcripts were never configured","ssm:* allowed on Resource=*","CloudTrail was enabled in the region","Alerts watched console logins, not CLI user-agents","Instances kept the SSM Agent running for patching"],"correct":[0,1,3,4]},{"id":"e10","type":"match","title":"Signal to first question","summary":"Match each signal to the question it demands.","scenario":"The Halcyon Health detection backlog lists five signals. Each one demands a different first question before any verdict: who explains the hour, what explains the volume, what explains the change, and what explains the silence. The playbook team wants the map, not the answers.","question":"Assign each signal to the first question it demands:","hint":"Volume asks about calendars; silence asks about logging.","explanation":"A 02:00 StartSession asks whose roster explains the hour; a 200-target SendCommand asks whether a scheduled association covers it; an AssumeRole from a CI principal asks whether the pipeline should touch SSM at all; an UpdateSSMDocument asks who edited tooling and why; a session with no transcript asks whether logging exists at all.\n\nSignals do not carry verdicts — questions do.","study":"Study writing detection triage playbooks as question pairs instead of verdicts.","pairs":[{"left":"StartSession at 02:00 UTC","right":"Whose roster or ticket explains the hour?"},{"left":"SendCommand to 200 instances","right":"Does a scheduled association cover the volume?"},{"left":"AssumeRole from a CI principal","right":"Is this pipeline supposed to touch SSM?"},{"left":"UpdateSSMDocument at 04:02","right":"Who changed the tooling and why?"},{"left":"Session without a transcript","right":"Is transcript logging configured at all?"}]},{"id":"e11","type":"decision","title":"Guardrail rollout without breaking CI","summary":"Deny fleet-wide SendCommand, keep the pipelines alive.","scenario":"Security wants an organisation-wide guardrail: no ssm:SendCommand outside the patch account. CI pipelines touch SSM from two other accounts and must keep working. The board wants an order of operations that proves impact before enforcement — not an outage story on Monday morning.","question":"Work through the three rollout steps in order:","hint":"Simulate first; carve the narrowest exception; prove the exception is monitored.","explanation":"Simulation first: IAM policy simulation on the CI roles shows exactly which pipelines the guardrail would break, before anything is enforced. Exception second: a dedicated patch role scoped by tags keeps the pipelines alive without a blanket hole. Verification third: re-run the simulation, test one session on a tagged instance, and alert on every use of the exception role.\n\nA guardrail without an evidence trail becomes the next outage story.","study":"Study IAM policy simulation and guardrail rollouts with narrow, monitored exceptions.","steps":[{"label":"STEP 1 OF 3 — simulate","prompt":"Draft guardrail: deny ssm:SendCommand outside the patch account, organisation-wide.","question":"What proves the impact on pipelines before enforcement?","options":["Policy simulation of the CI roles against the draft guardrail","Enforce on Friday evening and watch the dashboards","Ask each team by email whether they use SSM"],"correct":0,"why":"Simulation gives an objective broken-things list before any deny goes live."},{"label":"STEP 2 OF 3 — carve the exception","prompt":"Simulation shows two CI roles legitimately push agent updates from the build account.","question":"Which exception keeps them alive without a blanket hole?","options":["A dedicated patch role scoped by instance tags and account","Exempt both roles from all guardrails permanently","Disable the guardrail for the whole build account"],"correct":0,"why":"A narrow, named role keeps the job and stays visible; account-wide exemptions recreate the hole."},{"label":"STEP 3 OF 3 — prove it","prompt":"Guardrail is live; the patch role exists with tag scoping.","question":"What proves the guardrail works and stays watched?","options":["Trust the deny and move on to the next project","Re-run simulation, test one tagged-instance session, alert on exception-role use","Delete the old roles immediately at 17:00 Friday"],"correct":1,"why":"Verification plus alerting on the exception turns a rule into an observable control."}]},{"id":"e12","type":"terminal","title":"Read the session preferences","summary":"Check whether transcripts are even configured.","scenario":"Before the board meeting you must state, with evidence, whether Halcyon Health session transcripts exist. The preferences document by name holds the answer. The simulator allows read-only document inspection; deleting the document would silently switch logging off for everyone, which is exactly the sabotage the board fears.","question":"Type the command that reads the Session Manager preferences document:","hint":"get-document with --name SSM-SessionManagerRunShell.","explanation":"aws ssm get-document --name SSM-SessionManagerRunShell prints the preferences; empty bucket fields mean no transcripts. delete-document would switch logging off org-wide — the quietest possible sabotage of future investigations.\n\nEmpty preferences are a finding, not a footnote.","study":"Study the s3BucketName, cloudWatchLogEnabled and KMS fields of the preferences document.","prompt":"cloud-engineer@halcyon-mgmt:~$","skill":"session-prefs-review","knownTools":["aws","jq","grep"],"expected":"aws ssm get-document --name SSM-SessionManagerRunShell","elements":[{"label":"the document read command","any":["aws ssm get-document"]},{"label":"the name switch","any":["--name"]},{"label":"the preferences document name","any":["ssm-sessionmanagerrunshell"]}],"forbidden":[{"any":["delete-document"],"why":"Deleting the preferences document silently disables transcript logging org-wide — quiet sabotage."}],"output":["Document: SSM-SessionManagerRunShell (version 1)","cloudWatchLogEnabled: false","s3BucketName: (empty)","s3KeyPrefix: (empty)","Verdict: transcripts are OFF; CloudTrail holds session metadata only."],"syntaxPanel":"aws ssm get-document --name <document>\n  get-document   print an SSM document's content\n  --name         the document to read\n  example:       aws ssm get-document --name AWS-RunShellScript","sampleOutput":"Document: AWS-RunShellScript (version 1)\nschemaVersion: '2.2'\nmainSteps: [runScript]"},{"id":"e13","type":"mcq","title":"The Google path","summary":"Name the GCP pairing that mirrors the technique.","scenario":"The Halcyon Health platform runs a small GCP estate. The board asks for the one-line description of the equivalent path there: which feature turns account rights into instance access, and which command-line tool rides it. Two options are AWS plumbing wearing a GCP label — read carefully.","question":"Which pairing correctly describes the Google Cloud equivalent path?","hint":"One feature is about login rights; the command starts with gcloud compute.","explanation":"OS Login turns IAM rights into SSH access on instances, and operators arrive with gcloud compute ssh — access governed by roles like compute.instanceAdmin rather than firewall rules. Transcripts to S3 are AWS plumbing, scp moves files rather than opening sessions, and OS Login does not disable audit logging.\n\nSame technique family, different names: learn the provider vocabularies side by side.","study":"Study OS Login, compute.instanceAdmin and gcloud compute ssh as the GCP trio.","options":["OS Login plus gcloud compute ssh reaches instances by IAM","OS Login automatically stores session transcripts in S3 buckets","gcloud compute scp copies disks across projects","OS Login disables audit logging on the instance"],"correct":0},{"id":"e14","type":"fill","title":"Conditional access chain","summary":"Complete the identity hardening sentence.","scenario":"The Halcyon Health identity team writes the hardening standard. The sentence must cover MFA on cloud logins, the legacy protocols that bypass modern access rules, and where the administrative identities must live so an on-premises breach stops at the border and cannot walk into the control plane.","question":"Complete the hardening standard with the two missing terms:","hint":"Legacy authentication is the bypass; admin identities live cloud-side only.","explanation":"MFA on cloud logins, blocking legacy authentication protocols that skip conditional access, and cloud-only admin identities together stop a stolen on-premises password from becoming a control-plane session. Session and metadata are related words but not this sentence's answers.\n\nIdentity origin decides whether an on-prem breach can even try the cloud path.","study":"Study conditional access, legacy authentication blocking, and cloud-only admin accounts.","text":"Require MFA on cloud logins, block legacy ___ protocols that bypass conditional access, and keep admin identities ___-only so an on-premises breach cannot reach the control plane.","blanks":["authentication","cloud"],"bank":["authentication","cloud","session","metadata","federation","legacy"]},{"id":"e15","type":"order","title":"From alert to verdict","summary":"Order the five reviewer moves.","scenario":"A new signal lands: StartSession from a source network never seen in the Halcyon Health trail. The reviewer's job is a defensible verdict, not a fast one. Five moves from event pull to final verdict are on the table, and two of them are routinely done in the wrong order.","question":"Arrange the five reviewer moves in the correct order:","hint":"Actor and source first; the automation comparison comes near the end.","explanation":"Pull the events with actor and source, trace the assumption chain that granted the role, check whether transcripts exist for the window, compare the pattern against scheduled automation and admin hours, and only then write the verdict: escalate, or close as documented automation.\n\nA verdict written before the comparison is a guess with formatting.","study":"Study structured cloud triage: pull, trace, evidence-check, baseline, verdict.","items":["Pull the StartSession and SendCommand events with actor and source","Trace the AssumeRole chain that granted the actor's role","Check whether session transcripts exist for the window","Compare the pattern with scheduled automation and admin hours","Write the verdict: escalate, or close as documented automation"]},{"id":"e16","type":"logview","title":"OS Login on the GCP side","summary":"Spot the key import that preceded the login.","scenario":"The GCP estate's audit extract covers one evening. A human principal imports an SSH key through OS Login, flips a metadata flag, and starts a finance instance; the CI service account does its usual noisy builds around the same minutes. Filter and complete the note below the panel.","question":"Complete the note with the human principal and the instance from the log:","hint":"The import and the start share one actor; the CI account is noise.","explanation":"adm.rivas imported an SSH key via OS Login and started fin-app-07 in the same window — access creation followed immediately by use is the pattern. The metadata change forcing OS Login org-wide amplifies it. svc-ci's builds and batch worker churn are the estate's normal noise.\n\nAlarming looks benign here: one import line among build noise is easy to scroll past.","study":"Study GCP audit method names for OS Login imports and instance starts.","filterable":true,"log":{"header":["time","methodName","detail"],"lines":["2026-05-12T21:58:04Z OsLoginImportSshPublicKey principal=adm.rivas@corp[.]example src=203[.]0[.]113[.]51","2026-05-12T21:58:31Z ComputeInstancesSetMetadata principal=adm.rivas@corp[.]example key=enable-oslogin value=TRUE","2026-05-12T21:59:47Z ComputeInstancesStart principal=adm.rivas@corp[.]example instance=fin-app-07","2026-05-12T22:01:12Z ComputeInstancesStart principal=svc-ci@proj-build instance=batch-worker-02","2026-05-12T22:04:55Z ComputeInstancesStop principal=svc-ci@proj-build instance=batch-worker-02","2026-05-12T22:06:20Z storage.objects.create principal=svc-ci@proj-build bucket=build-artefacts","2026-05-12T22:31:41Z ComputeInstancesStart principal=svc-ci@proj-build instance=batch-worker-03"]},"widget":{"type":"fill","question":"Complete the note with the human principal and the instance:","text":"Principal ___ imported an OS Login key and then started instance ___ in the same window.","blanks":["adm.rivas","fin-app-07"],"bank":["adm.rivas","fin-app-07","svc-ci","batch-worker-02","enable-oslogin"]}},{"id":"e17","type":"mcq","title":"Editing the shared tooling","summary":"Why a modified built-in document is the loudest flag.","scenario":"CloudTrail shows UpdateSSMDocument on AWS-RunShellScript itself — the built-in shell document every SendCommand in the org can call. The change has no ticket. You must explain to the change board why this specific edit outranks every other open signal on the board today.","question":"Why does editing the built-in shell document outrank other open signals?","hint":"Anything that calls the document inherits the edit.","explanation":"Built-in documents are shared tooling: every SendCommand that calls AWS-RunShellScript executes whatever the edit added, across every caller and target. Documents can be edited, the edit changes command behaviour rather than machine metadata, and the document still runs org-wide after the change.\n\nTooling tampering multiplies; treat it above single-target signals.","study":"Study SSM document versioning and why document changes are audited like code changes.","options":["Documents cannot be edited, so the event must be fake","The edit only changes that machine's metadata","Every caller inherits whatever the edit added","Documents only run in the account that created them"],"correct":2}];

/* ==== utils ==== */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function norm(s){
  return String(s == null ? "" : s).toLowerCase().replace(/\s+/g," ").replace(/[.,;:!]+$/,"").trim();
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function fmt1(n){ return (Math.round(n * 100) / 100).toFixed(1); }
function wordCount(s){ return String(s || "").split(/\s+/).filter(Boolean).length; }
function $(id){ return document.getElementById(id); }
function byClass(root, cls){ return root.getElementsByClassName(cls); }

/* ==== timer ==== */
function setTimerState(next){
  var now = Date.now();
  if(S.tStateAt != null){
    var dt = (now - S.tStateAt) / 1000;
    if(S.tState === "PAUSED_MANUAL") S.pauseManual += dt;
    if(S.tState === "PAUSED_AUTO_CHECK") S.pauseAutoCheck += dt;
  }
  S.tState = next;
  S.tStateAt = now;
  updateHeader();
}
setInterval(function(){
  if(S.tState === "RUNNING"){
    S.remaining -= 1;
    S.elapsed += 1;
    if(S.remaining <= 0){
      S.remaining = 0;
      updateClock();
      finish();
      return;
    }
    updateClock();
  }
}, 1000);
function updateClock(){ var c = $("tb-clock"); if(c) c.textContent = fmtClock(S.remaining); }

/* ==== header ==== */
function sevClass(){ return "sev-" + META.severity; }
function curPos(){ return S.order[S.idx]; }
function answeredCount(){
  var n = 0;
  for(var k in S.checked){ if(Object.prototype.hasOwnProperty.call(S.checked, k)) n++; }
  return n;
}
function pendingSkips(){
  return S.skipList.filter(function(i){ return !S.checked[i]; });
}
function updateHeader(){
  var counter = $("tb-counter"), stateEl = $("tb-state");
  var total = EXAMS.length, done = answeredCount();
  if(S.screen === "exam" || S.screen === "review"){
    counter.textContent = (S.phase === "review" && S.reviewPos >= 0)
      ? ("Review " + (S.reviewPos + 1) + " / " + (S.reviewTotal || pendingSkips().length))
      : ((S.phase === "review") ? ("Review pool: " + pendingSkips().length)
      : ("Exercise " + (S.idx + 1) + " / " + total));
  } else {
    counter.textContent = "Exercises " + done + " / " + total;
  }
  var sev = $("tb-sev");
  sev.className = "badge " + sevClass();
  sev.textContent = META.severity.replace("_", " ");
  updateClock();
  $("tb-scoreval").textContent = fmt1(S.score);
  $("progbar").style.width = (total ? (done / total * 100) : 0) + "%";
  /* state chip */
  if(S.tState === "PAUSED_MANUAL"){
    stateEl.hidden = false;
    stateEl.className = "tb-state manual";
    stateEl.innerHTML = '<span aria-hidden="true">⏸</span> Paused (manual)';
  } else if(S.tState === "PAUSED_AUTO_CHECK"){
    stateEl.hidden = false;
    stateEl.className = "tb-state autocheck";
    stateEl.innerHTML = '<span aria-hidden="true">⏸</span> Auto-paused — checking';
  } else {
    stateEl.hidden = true;
  }
  /* buttons */
  var ex = curPos();
  var inExercise = (S.screen === "exam" || S.screen === "review") && ex != null && S.tState !== "ENDED";
  $("btn-hint").disabled = !inExercise || S.checked[ex] != null || S.hintsUsed[ex] === true;
  $("btn-skip").disabled = !inExercise || S.checked[ex] != null || S.phase === "review";
  $("btn-pause").disabled = !(S.tState === "RUNNING" || S.tState === "PAUSED_AUTO_CHECK");
}

/* ==== postMessage integration ==== */
window.addEventListener("message", function(ev){
  var d = ev.data;
  if(!d || typeof d !== "object") return;
  if(d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT"){
    S.init = d;
    var slot = $("candline");
    if(slot && d.username){
      slot.textContent = "Candidate: " + d.username + (d.country ? " · " + d.country : "");
      slot.style.display = "block";
    }
  }
});
function postScore(){
  if(S.scorePosted) return;
  S.scorePosted = true;
  var rounded = Math.round(S.score);
  var total = 0, i;
  for(i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null) total++;
  }
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var msg = {
    type: "CYBERPULSE_SCORE",
    topicId: META.topicId,
    batch: META.batch,
    score: rounded,
    total: total,
    percent: percent,
    passed: passed
  };
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage(msg, location.origin);
    }
  }catch(e){ /* standalone file:// — no parent handshake */ }
}

/* ==== answer defaults ==== */
function defaultAnswer(ex){
  var i, d;
  switch(ex.type){
    case "mcq": return { sel: -1 };
    case "multi": return { sel: [] };
    case "match":
      d = []; for(i = 0; i < ex.pairs.length; i++) d.push(-1); return { assign: d };
    case "order":
      d = []; for(i = 0; i < ex.items.length; i++) d.push(i);
      return { seq: shuffle(d) };
    case "fill":
      d = []; for(i = 0; i < ex.blanks.length; i++) d.push(""); return { vals: d };
    case "terminal": return { cmd: "" };
    case "logview": return { w: defaultAnswer(ex.widget) };
    case "decision":
      d = []; for(i = 0; i < ex.steps.length; i++) d.push(-1); return { steps: d, cursor: 0 };
  }
  return {};
}
function ensureAnswer(ex, i){
  if(S.answers[i] == null) S.answers[i] = defaultAnswer(ex);
  return S.answers[i];
}

/* ==== render exercise ==== */
function renderExercise(){
  var i = curPos();
  var ex = EXAMS[i];
  S.screen = "exam";
  ensureAnswer(ex, i);
  var m = $("main");
  var res = S.checked[i];
  var lock = res != null;
  var collapsed = !lock && wordCount(ex.scenario) > 70;
  var html = '<section class="excard">';
  /* scenario block */
  html += '<div class="blk blk-scenario"><div class="blk-label"><span class="dot"></span>SCENARIO</div>' +
          '<h3 class="ex-title">' + esc(ex.title) + "</h3>";
  if(collapsed && !lock){
    html += '<p class="summary">' + esc(ex.summary) + '</p><button class="showfull" id="btn-showfull" type="button">▸ Show full scenario</button><div class="scen-body hidden" id="scen-full">' + scenInner(ex) + "</div>";
  } else {
    if(collapsed) html += '<p class="summary">' + esc(ex.summary) + "</p>";
    html += '<div class="scen-body">' + scenInner(ex) + "</div>";
  }
  html += "</div>";
  /* question block */
  html += '<div class="blk blk-question"><div class="blk-label"><span class="dot"></span>QUESTION</div><p class="q-text">' + esc(ex.question) + "</p></div>";
  /* answer block */
  html += '<div class="blk blk-answer"><div class="blk-label"><span class="dot"></span>YOUR ANSWER</div><div id="ansarea">' + "</div></div>";
  /* hint + feedback slots */
  html += '<div id="hintslot"></div><div id="fbslot"></div>';
  /* actions */
  var lastMain = S.phase === "main" && S.idx === S.order.length - 1;
  html += '<div class="actions">' +
    '<button class="btn btn-primary" id="btn-check" type="button">' + (lock ? "✓ Checked" : "Check answer") + "</button>" +
    '<button class="btn" id="btn-next" type="button"' + (lock ? "" : " disabled") + ">" +
      (S.phase === "review" ? "Back to review list" : (lastMain ? "Final submit &amp; results" : "Next exercise")) +
    "</button>" +
    '<span class="ghost-note" id="actnote"></span>' +
    "</div></section>";
  m.innerHTML = html;
  var ansArea = $("ansarea");
  renderByType(ex, ansArea, i, lock, res);
  /* hint */
