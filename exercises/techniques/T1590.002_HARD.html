.rcard .rc-num{font-size:26px;font-weight:800}
.rcard .rc-lab{font-size:13.5px;color:var(--text-secondary);margin-top:4px;letter-spacing:.03em}
.cert{border-radius:12px;padding:20px 22px;margin:16px 0;border:1px solid}
.cert.pass{border-color:var(--state-correct);background:linear-gradient(135deg,var(--tint-green-hero),transparent)}
.cert.fail{border-color:var(--state-incorrect);background:linear-gradient(135deg,var(--tint-red-hero),transparent)}
.cert h2{margin:0 0 6px 0;font-size:22px}
.cert p{margin:6px 0;color:var(--text-primary)}
.pauselog{color:var(--text-secondary);font-size:14px;border-top:1px dashed var(--border);margin-top:12px;padding-top:10px}

/* ---------- manual pause overlay ---------- */
#pauseoverlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.pausecard{max-width:460px;text-align:center;background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:12px;padding:28px}
.pausecard .pico{font-size:38px;color:var(--state-paused)}
.pausecard h2{color:var(--state-paused);margin:8px 0}
.pausecard p{color:var(--text-secondary)}

.term-clock{font-family:var(--font-mono);font-size:13px;color:var(--accent-amber);font-weight:700}
@media (max-width:720px){
  #app{padding:10px 10px 80px}
  .card,.blk-body{padding:13px}
  .topbar{gap:8px}
  .tstate{max-width:100%}
  pre.mono,pre.codeblock,.loglines{font-size:13px}
  .blank-in{width:150px}
}
@media (prefers-reduced-motion:reduce){
  #pbar::after{animation:none}
  *{transition:none !important;animation:none !important}
}
</style>

<script type="application/json" id="cm-exam-data">{"object":{"id":"T1590.002","name":"Gather Victim Network Information: DNS","type":"Sub-Technique","parent":"T1590","tactic":"Reconnaissance (TA0043)","platforms":"PRE"},"learn":["This object is a sub-technique. In MITRE ATT&CK, it describes one specific way to carry out the parent technique T1590, Gather Victim Network Information. Here the target of the gathering is the victim's DNS: the system that turns names like harbourline-freight[.]com into server addresses.","Imagine you work in the SOC of a shipping company. An attacker, sitting somewhere outside your network, quietly asks public DNS servers: 'Which servers handle this company's mail? Which name servers run its zones? What addresses do its subdomains point to?' Each answer is a small clue — mail vendors, cloud providers, live subdomains — and together the clues become a map of your attack surface. That is T1590.002.","You will meet this object as a CTI analyst (profiling how attackers prepare), as a pentester (running the same queries on purpose), as a SOC analyst ( spotting recon in DNS telemetry), and as a detection engineer (writing analytics like ATT&CK detection strategy DET0843 and its analytic AN1975). Tools on both sides: dig and nslookup for direct queries, passive DNS datasets such as CIRCL's, DNS Dumpster-style mapping sites, and your own DNS server logs.","ATT&CK places this sub-technique in the Reconnaissance tactic (TA0043) on the PRE platform — meaning it happens before the attack touches you, often outside your visibility. The page lists one mitigation, M1054 Software Configuration: restrict zone transfers to validated servers only. It also warns that a DNS zone transfer (AXFR) against a misconfigured server can leak every record at once. Detection is hard — high volume, high false positives — so defenders watch for later stages like Initial Access. Real cases on the page include a wrong BIND configuration that exposed a country's TLD records and CISA's warning that AXFR requests may leak domain information."],"kw":["dig","nslookup","host","axfr","nxdomain","mx","txt","soa","ptr","cname","spf","name-server","zone","transfer","recursion","include","all","in","grep","head"],"themes":[{"name":"DNS record types & what they reveal","concepts":["A / AAAA records","MX records and mail providers","TXT and SPF records","NS records / registered name servers","SOA record"]},{"name":"Collection methods","concepts":["Passive DNS datasets","dig / nslookup / host tools"]},{"name":"Zone transfer (AXFR)","concepts":["AXFR query type","misconfigured DNS server","leaks the full zone","restrict transfers to validated secondaries"]},{"name":"Mitigations & controls","concepts":["M1054 Software Configuration","zone transfer policies (validated servers only)","DNS hardening good practice","minimising exposed DNS data"]},{"name":"Data sources & telemetry","concepts":["DNS server query logs","zone transfer attempt logs","resolver telemetry inside the victim"]},{"name":"Detection logic & analytics","concepts":["DET0843 detection strategy","high false-positive rate","activity outside the victim's visibility","focus on later lifecycle stages (Initial Access)","internal hosts doing external recon"]},{"name":"Reference cases from the page","concepts":["wrong BIND config exposed TLD records (SecurityTrails)","Alexa Top 1M AXFR scan"]}],"exercises":[{"id":"T1590-002-H01","type":"logview","title":"Two transfers, one alarm","summary":"A scheduled vendor transfer and a quiet internal sweep — which one goes to IR?","concepts":["zone transfer attempt logs","internal hosts doing external recon","restrict transfers to validated secondaries"],"perspective":"defender","tags":["trap:alarming-but-benign","trap:benign-but-alarming"],"logTitle":"dns-audit combined log (22:00-23:30)","filterPlaceholder":"filter lines...","log":["22:03:00  ns1  AXFR zone harbourline-freight[.]com -> 198[.]51[.]100[.]7  status: ALLOWED  job: vendor-dns-migration CHG-4188","22:03:41  ns1  AXFR complete  214 records  to 198[.]51[.]100[.]7  (CHG-4188 window 22:00-23:00)","23:12:07  res  10[.]44[.]9[.]13  A  vpn-old.harbourline-freight[.]com  NXDOMAIN","23:12:09  res  10[.]44[.]9[.]13  A  portal-test.harbourline-freight[.]com  NXDOMAIN","23:12:11  res  10[.]44[.]9[.]13  A  fin-web.harbourline-freight[.]com  203[.]0[.]113[.]44","23:12:13  res  10[.]44[.]9[.]13  A  hr-legacy.harbourline-freight[.]com  203[.]0[.]113[.]51"],"options":[{"t":"The 23:12 internal serial lookups of old and legacy hostnames","correct":true,"why":"Correct — a workstation enumerating forgotten names one by one is live internal recon; it needs IR even though every single line looks ordinary."},{"t":"The 22:03 full zone transfer to the migration vendor","correct":false,"why":"Alarming on the surface (a full zone left the building), but it is ticketed (CHG-4188), windowed, and to a validated partner — benign."},{"t":"The NXDOMAIN answers on vpn-old and portal-test","correct":false,"why":"The answers are dead names — but the PATTERN of asking for them is the signal, so this answer only tells half the story."},{"t":"The 214-record count on the vendor transfer","correct":false,"why":"A big number looks scary; with the ticket and window attached it is just the zone size."}],"question":"The duty manager asks which activity goes to IR. Which is it?","hint":"One activity has a ticket and a window; the other has neither and hunts for names nobody uses anymore.","explain":"Looks-alarming-but-benign: the ticketed vendor AXFR. Looks-benign-but-alarming: the quiet serial A-lookups from an internal host probing legacy names — classic subdomain hunting. Internal recon of your own surface is an IR trigger.","study":"Distinguishing ticketed transfers from internal subdomain enumeration.","scenario":[{"label":"ARTEFACT 1 — dns-audit combined log (22:00-23:30)","kind":"text","text":"You are reviewing this export in the SOC log viewer. A scheduled vendor transfer and a quiet internal sweep — which one goes to IR? Use the filter box to narrow the lines before answering."}]},{"id":"T1590-002-H02","type":"mcq","title":"Baseline or recon?","summary":"The same query pattern, two different hosts — which fires the analytic?","concepts":["high false-positive rate","resolver telemetry inside the victim","internal hosts doing external recon"],"perspective":"defender","tags":["trap:benign-but-alarming"],"scenario":[{"label":"ARTEFACT 1 — Two TXT/SOA bursts","kind":"text","text":"Host A (marketing-saas-connector, service account): 40 TXT queries to your domain at 02:00 nightly — SaaS validation job, ticketed, six months old. Host B (user laptop): 37 TXT+SOA queries to your domain spread over 50 minutes during office hours — no job accounts for it."}],"question":"Which burst does the recon analytic fire on, and why?","options":[{"t":"Host B — same volume as the job but no owning service, no schedule, odd query mix","correct":true,"why":"Correct — analytic logic keys on context (owner, schedule, record mix), not raw counts; B matches none of the job profile."},{"t":"Host A — 40 TXT queries in a minute is always anomalous","correct":false,"why":"Volume alone is the trap: A is a six-month ticketed job — firing on it is exactly the false-positive problem AN1975 warns about."},{"t":"Both — any burst of TXT queries is recon","correct":false,"why":"That rule would fire nightly on the legitimate connector and drown the queue."},{"t":"Neither — TXT queries are never security relevant","correct":false,"why":"Host B's unowned, slow, mixed-type sweep is a textbook recon pattern."}],"hint":"Compare owner, schedule, and query mix — not just the count.","explain":"The near-miss is volume: identical counts, opposite verdicts. Baselines (owner + schedule + record mix) are what turn high-volume DNS telemetry into a usable recon analytic.","study":"Writing context-aware DNS analytics that survive the false-positive rate."},{"id":"T1590-002-H03","type":"multi","title":"Signals that survive the noise","summary":"Which three telemetry signals indicate likely T1590.002 recon?","concepts":["zone transfer attempt logs","internal hosts doing external recon","high false-positive rate","DNS server query logs"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Week of DNS telemetry","kind":"text","text":"You must pick the three signals worth escalating out of a noisy week."}],"question":"Select the three signals that genuinely indicate likely DNS recon.","options":[{"t":"AXFR attempts from external hosts against your authoritative NS","correct":true,"why":"Correct — zone-transfer attempts are rare, purposeful, and exactly the page's named behaviour."},{"t":"One internal laptop resolving dozens of legacy hostnames serially","correct":true,"why":"Correct — internal subdomain hunting is recon you can actually see."},{"t":"A sudden external spike of +short MX sweeps targeting your domain","correct":true,"why":"Correct — rapid mail-mapping sweeps from outside are active recon of mail flow."},{"t":"CDN prefetch bursts for your marketing site","correct":false,"why":"Content-delivery prefetch is high-volume but structurally routine — noise."},{"t":"The nightly backup job's PTR lookups","correct":false,"why":"Documented job, reverse lookups only — baseline traffic."},{"t":"A printer re-registering its own A record","correct":false,"why":"Endpoint housekeeping chatter — unrelated to gathering your DNS surface."}],"hint":"Recon gathers YOUR surface — ask which signals show someone mapping mail, zones, or forgotten names.","explain":"The three survivors are purposeful mappings of your surface (zone pulls, legacy-name hunting, mail sweeps). Prefetch, backups, and printer chatter are the noise floor AN1975 exists because of.","study":"Prioritising DNS signals under high false-positive conditions."},{"id":"T1590-002-H04","type":"match","title":"What each query tells the attacker","summary":"Four query types and the operational question each answers.","concepts":["A / AAAA records","MX records and mail providers","TXT and SPF records","SOA record"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Attacker's question list","kind":"text","text":"'Which server takes mail? Where does the web app live? Who else sends mail for them? When does the zone refresh?' — four questions, four query types."}],"question":"Match each attacker question to the query type that answers it.","left":[{"t":"Which server takes their mail?","match":0,"why":"MX lists the mail exchangers in priority order."},{"t":"Where does the web app live?","match":1,"why":"A/AAAA resolve the app hostname to addresses."},{"t":"Who else sends mail for them?","match":2,"why":"TXT/SPF enumerate authorised third-party senders."},{"t":"When does the zone refresh?","match":3,"why":"SOA carries the zone's timing parameters (refresh, retry, serial)."}],"right":[{"t":"MX","why":"Mail exchangers live in MX records."},{"t":"A / AAAA","why":"Address records map the hostname to server IPs."},{"t":"TXT / SPF","why":"Sender policy records name every included third party."},{"t":"SOA","why":"The start-of-authority record holds refresh/retry/serial timing."}],"hint":"Mail, addresses, senders, timing — one type each.","explain":"Each type is a different recon question. SOA is the sneaky one: refresh/retry timings tell an attacker how fast secondary servers pull changes — useful when timing a DNS-based attack window.","study":"MX, A/AAAA, TXT/SPF, and SOA — the four windows attackers read first."},{"id":"T1590-002-H05","type":"terminal","title":"Attempt the full pull","summary":"Objective and environment only — assemble the zone-transfer attempt yourself.","concepts":["AXFR query type","dig / nslookup / host tools","misconfigured DNS server"],"perspective":"attacker","tags":[],"skill":"axfr-assembly","scenario":[{"label":"ARTEFACT 1 — Authorised lab tasking","kind":"text","text":"You are the red-team member on the SIGNED engagement for harbourline-freight[.]com (lab copy). Objective: attempt a full zone transfer against their designated lab name server ns1.lab.harbourline-freight[.]com. Tool of choice is yours; the attempt must address that server explicitly."}],"question":"Type the command that attempts a full zone transfer of harbourline-freight[.]com from ns1.lab.harbourline-freight[.]com.","cmd":{"prompt":"redteam-lab:~$","canonical":"dig @ns1.lab.harbourline-freight[.]com harbourline-freight[.]com axfr","nearMiss":"dig @ns1.lab.harbourline-freight[.]com harbourline-freight[.]com axfr +short","outputs":[{"re":"dig\\s+@ns1\\.lab\\.harbourline-freight\\[.\\]com\\s+harbourline-freight\\[.\\]com\\s+axfr","lines":["; <<>> DiG 9.18 <<>> @ns1.lab harbourline-freight[.]com axfr",";; communications error: connection refused (transfer denied by policy)"]}],"unknown":"command not recognised — zone-transfer attempts name the server with @, the zone, and the transfer type.","elements":[{"re":"\\bdig\\b","label":"Uses dig","why":"The standard tool for a single, scriptable DNS request."},{"re":"@ns1\\.lab\\.harbourline-freight\\[.\\]com","label":"Addresses the named server with @","why":"The tasking requires the attempt to hit that exact server explicitly."},{"re":"harbourline-freight\\[.\\]com","label":"Names the zone","why":"AXFR needs the full zone name as the transfer target."},{"re":"(^|\\s)axfr(\\s|$)","label":"Uses the axfr transfer type","why":"axfr is the query type that requests the entire zone."}],"forbidden":[{"re":"\\+short","label":"+short on a transfer attempt","why":"A near-miss: +short mangles AXFR output and signals copy-paste rather than intent."},{"re":"(^|\\s)ixfr(\\s|$)","label":"an incremental (IXFR) request","why":"IXFR asks for changes since a serial — a different, weaker request than the tasked full pull."}]},"hint":"Three pieces: which server (@), which zone, which transfer type. Order of the last two is flexible; the @server is not optional.","explain":"'dig @ns1.lab... zone axfr' is the canonical full-pull: @server, zone, axfr. The near-misses — IXFR (incremental) or +short — either ask for less or garble the output. In the lab the policy refused it, exactly as M1054 intends in production.","study":"Assembling dig zone-transfer attempts; why '@server' matters."},{"id":"T1590-002-H06","type":"dnd","title":"Sort the transfer outcomes","summary":"Four log artefacts — control worked, control failed, recon, routine.","concepts":["restrict transfers to validated secondaries","zone transfer attempt logs","MX records and mail providers","M1054 Software Configuration"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Transfer review board","kind":"text","text":"Columns: CONTROL HELD / CONTROL FAILED / ACTIVE RECON / ROUTINE. Four artefacts from ns1 and the resolver."}],"question":"Drag each artefact to its column.","zones":[{"name":"CONTROL HELD","accepts":[0],"why":"A refused external AXFR is the policy doing its job."},{"name":"CONTROL FAILED","accepts":[1],"why":"An allowed external AXFR means the transfer ACL is wrong or bypassed."},{"name":"ACTIVE RECON","accepts":[2],"why":"An unowned internal host sweeping MX records of your own domain."},{"name":"ROUTINE","accepts":[3],"why":"The mail gateway's scheduled SPF check is expected traffic."}],"bank":[{"t":"AXFR req from 198[.]51[.]100[.]231 — REFUSED (not in ACL)","whyMiss":"Refused external request = control held."},{"t":"AXFR sent 214 records to 203[.]0[.]113[.]88 (no ticket)","whyMiss":"Records left to an unticketed external host = control failed."},{"t":"10[.]44[.]9[.]13 MX sweep of harbourline-freight[.]com","whyMiss":"Internal unowned mail mapping = active recon."},{"t":"mail-gw hourly TXT/SPF check of its own domain","whyMiss":"Baseline job on schedule = routine."}],"hint":"Two artefacts are about the transfer ACL, one about an internal mapper, one a known job.","explain":"The board separates outcomes from intent: refusals and ticketed jobs are healthy; an unticketed outbound zone or an unowned internal sweep is not. This four-way sort is the core HARD-level DNS triage skill.","study":"Transfer ACL verification and internal-recon hunting."},{"id":"T1590-002-H07","type":"fib","title":"Write the M1054 policy line","summary":"Two blanks make the transfer policy enforceable.","concepts":["M1054 Software Configuration","zone transfer policies (validated servers only)","restrict transfers to validated secondaries"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Draft policy text","kind":"text","text":"Draft: 'Zone transfers are permitted only to {b0} name servers, as listed in the {b1} policy; all other sources are refused and logged.'"}],"question":"Fill the two blanks of the policy.","template":"Zone transfers are permitted only to {b0} name servers, as listed in the {b1} policy; all other sources are refused and logged.","blanks":[{"accept":["validated","approved","authorised"],"why":"M1054's wording: a list of VALIDATED servers permitted for zone transfers.","whyMiss":"'Any' or 'external' servers would defeat the control — the list must be validated."},{"accept":["zone transfer","zone-transfer"],"why":"The control is a zone-transfer policy — the name carries the scope.","whyMiss":"A generic 'network' policy would not bind the transfer behaviour specifically."}],"hint":"Blank one is M1054's own adjective for the server list. Blank two names the policy document.","explain":"The enforceable sentence has two anchors: validated (who) and zone-transfer policy (where the list lives). Copy M1054's wording into policy and the audit writes itself.","study":"Turning M1054 into an auditable policy clause."},{"id":"T1590-002-H08","type":"order","title":"Order the hardening sequence","summary":"Four steps from inventory to monitored policy.","concepts":["NS records / registered name servers","zone transfer policies (validated servers only)","zone transfer attempt logs","DNS hardening good practice"],"perspective":"defender","tags":["trap:least-aggressive"],"scenario":[{"label":"ARTEFACT 1 — Project plan cards","kind":"text","text":"Cards: 'Enable transfer ACLs allowing only the listed secondaries' · 'Inventory every authoritative NS for the domain' · 'Test AXFR from an unlisted external host' · 'Alert on refused transfer attempts'."}],"question":"Order the four hardening steps.","sequence":["Inventory every authoritative NS for the domain","Enable transfer ACLs allowing only the listed secondaries","Test AXFR from an unlisted external host","Alert on refused transfer attempts"],"orderWhy":["You cannot restrict what you have not listed — inventory first.","Then apply the M1054 ACLs to every server on that list.","Verify by attempting a transfer from outside — it must fail.","Finally convert future attempts into alerts (they are your recon telemetry)."],"hint":"List, restrict, verify, observe — the least aggressive ordering that still closes the hole.","explain":"Inventory before restriction (or you break a real secondary), verification before alerting (or you alert on a broken policy). Least-aggressive, dependency-correct sequencing is the skill.","study":"Rolling out M1054 across multiple authoritative servers."},{"id":"T1590-002-H09","type":"logview","title":"Find the refusal that matters","summary":"Mixed statuses — pick the refusal that signals targeted recon.","concepts":["zone transfer attempt logs","high false-positive rate","targeting of External Remote Services (T1133)"],"perspective":"defender","tags":["trap:alarming-but-benign"],"logTitle":"ns1 refused-transfer summary (7 days)","filterPlaceholder":"filter refusals...","log":["Mon  axfr-refused  harbourline-freight[.]com  from 185[.]199[.]110[.]153  (known internet-wide scanner, 4th week)","Tue  axfr-refused  harbourline-freight[.]com  from 185[.]199[.]110[.]153  (same scanner)","Wed  axfr-refused  14 unrelated TLDs          from 185[.]199[.]110[.]153  (mass scanning)","Thu  axfr-refused  harbourline-freight[.]com  from 198[.]51[.]100[.]231  (first sighting, single retry)","Fri  axfr-refused  harbourline-freight[.]com  from 198[.]51[.]100[.]231  (retry, +SOA pre-query)","Sat  axfr-refused  harbourline-freight[.]com  from 198[.]51[.]100[.]231  (retry, +NS pre-query)"],"options":[{"t":"Thu-Sat: one new source, single-target focus, escalating pre-queries","correct":true,"why":"Correct — targeted, patient, learning the zone before each retry: behaviour, not volume, marks intent."},{"t":"Mon-Wed: the scanner range hitting the domain repeatedly","correct":false,"why":"Alarming volume, but it mass-scans TLDs indiscriminately — baseline internet noise."},{"t":"Wed: 14 unrelated TLDs in one day","correct":false,"why":"Breadth without focus is the scanner's signature, not targeting."},{"t":"Fri: the SOA pre-query","correct":false,"why":"On its own a SOA lookup is routine; it matters only as part of the Thu-Sat pattern."}],"question":"Which pattern deserves escalation, and why?","hint":"One source scans everything; the other visits only you — and studies the zone between tries.","explain":"Intent shows in focus and escalation: a new source that touches only your zone and adds SOA/NS pre-queries is preparing, while the mass scanner sprays everyone. Behaviour over volume — the HARD-level read of refusal logs.","study":"Behavioural analysis of refused zone-transfer attempts.","scenario":[{"label":"ARTEFACT 1 — ns1 refused-transfer summary (7 days)","kind":"text","text":"You are reviewing this export in the SOC log viewer. Mixed statuses — pick the refusal that signals targeted recon. Use the filter box to narrow the lines before answering."}]},{"id":"T1590-002-H10","type":"mcq","title":"Respond without breaking the company","summary":"Recon confirmed — which response is proportionate?","concepts":["minimising exposed DNS data","focus on later lifecycle stages (Initial Access)","DNS hardening good practice"],"perspective":"defender","tags":["trap:least-aggressive","trap:real-cost"],"scenario":[{"label":"ARTEFACT 1 — Bridge, 16:40","kind":"text","text":"Confirmed: an external actor mapped your mail flow and subdomains (nothing was 'stolen' — it was public). CISO: 'Fix it before Monday.' Web, mail, and customer portal all run on this DNS."}],"question":"Which response is correct?","options":[{"t":"Minimise exposed data, enforce transfer ACLs, and tune detection for follow-on access","correct":true,"why":"Correct — recon used public data; the winning move is shrinking the surface and watching the next stage."},{"t":"Take the authoritative DNS offline over the weekend","correct":false,"why":"That breaks web, mail, and the portal — real cost, zero gain: the records were already public."},{"t":"Delete all public records and start from scratch","correct":false,"why":"Customers and mail partners need those records; deletion is self-inflicted outage."},{"t":"Do nothing — public data is public","correct":false,"why":"True but incomplete: exposure can be reduced and the follow-on stage watched."}],"hint":"The recon cost nothing to stop now — the follow-on is what you must shape.","explain":"Public records cannot be 'un-leaked'; the least aggressive effective response is reduce (SPF split-horizon, transfer ACLs) plus prepare (Initial-Access-focused detection). Destructive 'fixes' cost the business for no defensive gain.","study":"Attack-surface reduction after confirmed recon; AN1975's Initial Access focus."},{"id":"T1590-002-H11","type":"triage","title":"The Monday queue","summary":"Four DNS items — triage each with the right disposition.","concepts":["zone transfer attempt logs","internal hosts doing external recon","Passive DNS datasets","high false-positive rate"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Monday 08:30 queue","kind":"text","text":"Four items. Context from last week: an external actor mapped your DNS surface; the vendor migration CHG-4188 completed."}],"question":"Choose the disposition for each item.","rows":[{"alert":"New refusal pattern: single source, only your zone, SOA pre-queries","detail":"Started Thursday.","options":["Escalate as targeted recon","Close as scanner noise","Disable the authoritative NS"],"correctIndex":0,"why":"Targeted, patient, learning — the escalation pattern from last week's review.","whyNot":{"1":"Mass scanners spray TLDs; this source visits only you.","2":"Taking NS offline breaks the domain to spite one source."}},{"alert":"Vendor AXFR to 198[.]51[.]100[.]7 completed with CHG-4188","detail":"Window respected, 214 records.","options":["Escalate as targeted recon","Close as approved change","Disable the authoritative NS"],"correctIndex":1,"why":"Ticketed, windowed, validated partner — a closed change, not recon.","whyNot":{"0":"The ticket and window make this lawful — nothing to escalate.","2":"No failure occurred; disabling NS is pure damage."}},{"alert":"Internal laptop enumerating hr-legacy and portal-test names","detail":"Owner says 'just curious'.","options":["Escalate as possible compromise — check the host","Close as approved change","Disable the authoritative NS"],"correctIndex":0,"why":"Internal recon of forgotten names is an IR trigger regardless of the owner's story — verify the host.","whyNot":{"1":"No change record exists; curiosity is not a change ticket.","2":"The laptop is the problem, not the DNS platform."}},{"alert":"Passive-DNS dataset now shows your internal-only hostname","detail":"Name never seen in public zone before.","options":["Escalate — find how the name leaked","Close as approved change","Disable the authoritative NS"],"correctIndex":0,"why":"An internal-only name in a public dataset means it leaked somewhere (AXFR, misconfig, or internal resolver) — hunt the source.","whyNot":{"1":"Nothing was approved; the name should not exist publicly.","2":"Again the wrong lever — find the leak, do not break DNS."}}],"hint":"Ask per row: is there a ticket, is the source targeted, and could an internal name have leaked?","explain":"Four dispositions, four different levers: escalate behaviour, close tickets, check hosts, hunt leaks. The dangerous column (disable NS) is never right for any of these — proportionality is the test.","study":"Disposition mapping for DNS-surface signals."},{"id":"T1590-002-H12","type":"multi","title":"Prove the zone actually leaked","summary":"Pick the two artefacts that together prove a successful external pull.","concepts":["leaks the full zone","zone transfer attempt logs","Passive DNS datasets"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Evidence shelf","kind":"text","text":"(1) ns1 log: AXFR sent 214 records to 203[.]0[.]113[.]88 (unticketed) · (2) passive DNS dataset now lists internal-only hostname fin-web-internal · (3) a lunch-menu PDF · (4) one refused AXFR from a scanner · (5) the domain's public MX records."}],"question":"Select the two artefacts that together prove a successful zone leak.","options":[{"t":"Artefact 1 — the unticketed 214-record outbound transfer","correct":true,"why":"Correct — the server itself logged the full zone leaving to an unapproved host."},{"t":"Artefact 2 — the internal-only name appearing in a public dataset","correct":true,"why":"Correct — outside confirmation that internal naming escaped, consistent with the pull."},{"t":"Artefact 3 — the lunch menu","correct":false,"why":"Noise, however delicious."},{"t":"Artefact 4 — a refused scanner attempt","correct":false,"why":"Refused means nothing left — the control working, not failing."},{"t":"Artefact 5 — the public MX records","correct":false,"why":"Public records are public by design — no leak evidence there."}],"hint":"One artefact shows the zone leaving; one shows internal data existing outside. Pair them.","explain":"Server-side proof (records sent) plus outside proof (internal name in a dataset) closes the case. Refusals and public records are the classic false-positive traps here.","study":"Proving disclosure with paired internal and external evidence."},{"id":"T1590-002-H13","type":"branch","title":"The CISO's three questions","summary":"Verify, assess, decide — under a Monday deadline.","concepts":["minimising exposed DNS data","zone transfer policies (validated servers only)","focus on later lifecycle stages (Initial Access)"],"perspective":"defender","tags":["trap:conflicting-signals"],"scenario":[{"label":"ARTEFACT 1 — CISO memo (Friday 17:00)","kind":"text","text":"1) 'Are we sure anything leaked?' 2) 'How bad is the exposure?' 3) 'What do we do before Monday?' — answer each with the best decision."}],"question":"Make the three decisions.","steps":[{"text":"Decision 1 — 'Are we sure anything leaked?'","options":[{"t":"Confirm with the paired evidence: outbound transfer log + internal name in public dataset","correct":true,"why":"Correct — a leak claim needs both the exit and the outside confirmation.","outcome":"Both artefacts verified; leak confirmed with high confidence.","outcomeBad":false},{"t":"Say yes because an AXFR was attempted","correct":false,"why":"Attempted is not successful — most attempts are refused.","outcome":"You would claim a leak that the refusal log contradicts.","outcomeBad":true},{"t":"Say no because DNS is public anyway","correct":false,"why":"Public-by-design records are one thing; internal-only names in public datasets are another.","outcome":"The internal-name exposure goes unreported.","outcomeBad":true}]},{"text":"Decision 2 — 'How bad is the exposure?'","options":[{"t":"Assess from the leaked record list: internal naming + mail map + legacy hosts","correct":true,"why":"Correct — severity comes from what the 214 records actually contained.","outcome":"Assessment: internal naming exposed, two legacy hosts still live — medium-high.","outcomeBad":false},{"t":"Rate it critical because DNS was involved","correct":false,"why":"Tool identity does not set severity; content of the leak does.","outcome":"An inflated rating derisks nothing and burns credibility.","outcomeBad":true},{"t":"Rate it low because no system was touched","correct":false,"why":"Internal naming plus live legacy hosts is real targeting material.","outcome":"Under-rating leaves the legacy hosts unprotected.","outcomeBad":true}]},{"text":"Decision 3 — 'What do we do before Monday?'","options":[{"t":"Close the transfer hole, retire the legacy hosts, tune Initial Access detection","correct":true,"why":"Correct — fix the exit, remove the juiciest targets, watch the next stage: proportionate and finishable by Monday.","outcome":"ACLs enforced on all NS, legacy hosts retired, detection tuned — done Sunday 18:00.","outcomeBad":false},{"t":"Migrate the whole DNS platform to a new provider by Monday","correct":false,"why":"A weekend platform migration risks the domain's availability for marginal gain.","outcome":"Rushed migration wobbles; Monday mail delivery suffers.","outcomeBad":true},{"t":"Publish a public statement naming the attacker","correct":false,"why":"Attribution is unproven and disclosure mid-response can tip the actor.","outcome":"The statement is wrong or tips the actor — possibly both.","outcomeBad":true}]}],"hint":"Prove, size, fix — each answer depends on the previous one.","explain":"The branch chains evidence to severity to action. Prove with paired artefacts, size from leaked content, fix the exit and the targets while watching for the follow-on. Every wrong path over- or under-shoots what the evidence supports.","study":"From evidence to executive decision: the leak-response chain."},{"id":"T1590-002-H14","type":"fib","title":"Complete the strategy sentence","summary":"Two blanks capture DET0843's design.","concepts":["DET0843 detection strategy","activity outside the victim's visibility","focus on later lifecycle stages (Initial Access)"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Detection wiki (draft)","kind":"text","text":"Draft: 'Recon DNS traffic often {b0} the defender's visibility because it targets public servers and datasets; detection therefore focuses on later stages such as {b1}.'"}],"question":"Fill the two blanks in the wiki draft.","template":"Recon DNS traffic often {b0} the defender's visibility because it targets public servers and datasets; detection therefore focuses on later stages such as {b1}.","blanks":[{"accept":["escapes","avoids","bypasses"],"why":"Public-server queries and dataset reads never reach your logs — they escape visibility.","whyMiss":"The traffic is not blocked or hidden from the victim — it simply never arrives at victim-controlled systems."},{"accept":["initial access","initial-access"],"why":"AN1975 explicitly redirects attention to stages like Initial Access.","whyMiss":"The named follow-on stage is Initial Access — not Collection or Exfiltration."}],"hint":"Blank one: what recon traffic does to your visibility. Blank two: the two-word stage name from the analytic.","explain":"Escapes visibility + focus on Initial Access = the DET0843 design in one sentence. It tells juniors where NOT to hunt (external queries you cannot see) and where TO hunt (the access that recon enables).","study":"The DET0843 / AN1975 strategy text on the T1590.002 page."},{"id":"T1590-002-H15","type":"mcq","title":"Learn from the BIND case","summary":"What the SecurityTrails misconfiguration case teaches.","concepts":["wrong BIND config exposed TLD records (SecurityTrails)","misconfigured DNS server","leaks the full zone","Alexa Top 1M AXFR scan"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Incident-review prompt","kind":"text","text":"Reference case on the ATT&CK page: a wrong BIND configuration exposed the complete record list of an entire country's TLD to the internet. The review lead asks what the lesson is."}],"question":"Which lesson matches the case?","options":[{"t":"One wrong allow-transfer line can expose an entire zone tree — test configs before publishing","correct":true,"why":"Correct — the case is a config error with total-disclosure consequences; testing would have caught it."},{"t":"BIND is unsafe and must never be used","correct":false,"why":"The software was fine; one configuration line was wrong — vendor-blaming misses the lesson."},{"t":"Country TLDs are the only real AXFR targets","correct":false,"why":"The Alexa Top-1M scan on the same page shows everyone is probed — size does not protect."},{"t":"AXFR should be enabled to improve redundancy","correct":false,"why":"Redundancy comes from validated secondaries, not from open transfers."}],"hint":"This is about one configuration line with total consequences.","explain":"The BIND case is the worst-case M1054 failure: one 'allow-transfer' mistake, whole-zone exposure. The lesson is procedural — validate and test transfer config before it goes live, on any zone size.","study":"The SecurityTrails and Alexa Top-1M references on the T1590.002 page."}],"severityWord":"HARD","partLabel":null}</script>
<script>
'use strict';
var DATA = JSON.parse(document.getElementById('cm-exam-data').textContent);
var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var EXS = [];
var S = null;
var T = null; // timer object for current attempt

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function fmtTime(sec){
  sec = Math.max(0, sec|0);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function round1(x){ return Math.round(x*10)/10; }
function letterKey(n){ return String.fromCharCode(65+n); }
function dispKey(ex, origIdx){ return ex._optOrder ? ex._optOrder.indexOf(origIdx) : origIdx; }

var KW = (DATA.kw && DATA.kw.length) ? DATA.kw : ['show','key','log','policy','error'];
var KWRE = new RegExp('(^|[^\\w-])(' + KW.join('|') + ')(?=[^\\w-]|$)','g');
function hl(text){
  var e = esc(text);
  e = e.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g, '<span class="tok-str">$1</span>');
  e = e.replace(/\b\d{1,3}(?:\[\.\]\d{1,3}){3}\b/g, '<span class="tok-ip">$&</span>');
  e = e.replace(KWRE, function(m,p1,p2){ return p1 + '<span class="tok-kw">' + p2 + '</span>'; });
  e = e.replace(/(\s|^)(-{1,2}[A-Za-z][\w-]*)/g, '$1<span class="tok-flag">$2</span>');
  e = e.replace(/\b(\d+)\b(?![^<]*<\/span>)/g, function(m, g1, off, str){
    var before = str.slice(Math.max(0, off-6), off);
    if(before.indexOf('class=') >= 0){ return m; }
    return '<span class="tok-num">'+m+'</span>';
  });
  return e;
}

function scoreExercise(H, W, N){
  if(N <= 0){ return 0; }
  return Math.max(0, (H - W) / N);
}
function normTxt(s){
  return String(s).trim().toLowerCase().replace(/\s+/g,' ').replace(/[.,;]+$/,'');
}

/* ================= timer state machine ================= */
function setTState(st){
  T.state = st;
  var el = $('tstate');
  if(!el){ return; }
  el.className = 'tstate';
  if(st === 'RUNNING'){ el.classList.add('running'); el.innerHTML = '&#9654; RUNNING'; }
  else if(st === 'PAUSED_MANUAL'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; manual (press Resume)'; }
  else if(st === 'PAUSED_AUTO_CHECK'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; reviewing feedback (resumes on Next)'; }
  else if(st === 'ENDED'){ el.classList.add('ended'); el.innerHTML = '&#9632; ENDED'; }
  renderTimerBox();
}
function renderTimerBox(){ var el = $('timerbox'); if(el){ el.textContent = fmtTime(T.remaining); } }
function tick(){
  if(T.state === 'RUNNING'){
    T.remaining -= 1;
    renderTimerBox();
    var tc = $('termclock');
    if(tc && S && (S.screen === 'exam') && curEx() && curEx().type === 'terminal' && !curEx()._checked && curEx()._tleft !== null && curEx()._tleft !== undefined){
      curEx()._tleft -= 1;
      if(curEx()._tleft <= 0){ curEx()._tleft = 0; tc.textContent = '\u23f1 0:00 left — grading now'; curEx()._autoGrade = true; gradeCurrent(); return; }
      tc.textContent = '\u23f1 ' + Math.floor(curEx()._tleft/60) + ':' + (curEx()._tleft%60 < 10 ? '0' : '') + (curEx()._tleft%60) + ' left on this terminal (pauses with the exam timer)';
    }
    if(T.remaining <= 0){
      T.remaining = 0;
      setTState('ENDED');
      finishAttempt(true);
    }
  } else if(T.state === 'PAUSED_MANUAL'){ T.manualTotal += 1; }
  else if(T.state === 'PAUSED_AUTO_CHECK'){ T.autoTotal += 1; }
}

/* ================= intro screen ================= */
function typeLabel(t){
  return {
    mcq:'multiple choice', multi:'multi-select (partial credit)', match:'matching pairs',
    dnd:'drag & drop', order:'timeline ordering', fib:'fill-in-the-blank',
    terminal:'fake terminal command', branch:'branching decision scenario',
    triage:'SOC alert-queue triage', logview:'log viewer analysis'
  }[t] || t;
}
var TYPE_ICONS = {mcq:'A.', multi:'☑', match:'⇄', dnd:'✥', order:'↕', fib:'▁', terminal:'>_ ', branch:'⑃', triage:'▦', logview:'☰'};

function renderIntro(){
  S.screen = 'intro';
  var exTypes = [];
  DATA.exercises.forEach(function(e){ if(exTypes.indexOf(e.type) < 0){ exTypes.push(e.type); } });
  var chips = exTypes.map(function(t){ return '<span class="typechip">'+esc(TYPE_ICONS[t]||'•')+' '+esc(typeLabel(t))+'</span>'; }).join('');
  var themes = DATA.themes.map(function(th){
    return '<div class="themebox"><h4>'+esc(th.name)+'</h4><ul>'+ th.concepts.map(function(c){ return '<li>'+esc(c)+'</li>'; }).join('') +'</ul></div>';
  }).join('');
  var learn = DATA.learn.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('');
  var app = $('app');
  app.innerHTML =
  '<div class="intro-hero card">'+
    '<h1>'+esc(META.title)+'</h1>'+
    '<div class="objline"><b>'+esc(DATA.object.id)+' — '+esc(DATA.object.name)+'</b> &nbsp;·&nbsp; ATT&amp;CK object type: '+esc(DATA.object.type)+' &nbsp;·&nbsp; Tactic: '+esc(DATA.object.tactic)+'</div>'+
    '<div class="objline">Platform(s): '+esc(DATA.object.platforms)+'</div>'+
    '<div class="factrow">'+
      '<span class="badge '+sevClass()+'">'+esc(DATA.severityWord)+'</span>'+
      '<span class="fact">▦ <span><b>'+DATA.exercises.length+'</b> exercises</span></span>'+
      '<span class="fact">⏱ <span>estimated time <b>'+META.estimatedMinutes+' min</b> — the countdown timer gives you the same <b>'+META.timerMinutes+' min</b></span></span>'+
      '<span class="fact">◎ <span>pass mark <b>'+META.passMark+'%</b></span></span>'+
      (S.init && S.init.username ? '<span class="userchip">👤 Analyst: '+esc(S.init.username)+'</span>' : '')+
    '</div>'+
  '</div>'+
  '<section class="card"><h2>What you will learn here</h2>'+learn+'</section>'+
  '<section class="card"><h2>Keywords covered in this exam</h2><div class="themegrid">'+themes+'</div>'+
    '<p class="kw-note">Each keyword above is exercised at least once in this file. Themes follow the structure of the ATT&amp;CK page for '+esc(DATA.object.id)+'.</p></section>'+
  '<section class="card"><h2>How this exam works</h2>'+
    '<div class="typechips">'+chips+'</div>'+
    '<ul class="rulelist">'+
    '<li><span class="rl-ico">◎</span><span><b>Pass mark '+META.passMark+'%.</b> Your score is computed only over the exercises you actually answered (checked). PASS means you scored at least '+META.passMark+'%; FAIL means you should retake the exam.</span></li>'+
    '<li><span class="rl-ico">⚖</span><span><b>Partial credit.</b> Multi-answer exercises are graded per item: credit = max(0, (correct items selected − wrong items selected) ÷ total correct items). Selecting everything is graded 0, not full marks.</span></li>'+
    '<li><span class="rl-ico">💡</span><span><b>Hint costs 10% of the exercise credit.</b> One hint per exercise. The hint gives a nudge, never the answer.</span></li>'+
    '<li><span class="rl-ico">⏱</span><span><b>Timer.</b> A countdown runs for '+META.timerMinutes+' minutes. <b>Pause</b> is manual: it hides the exercise until you press Resume. Pressing <b>Check</b> also pauses the timer automatically while you study the feedback — the exercise stays visible, and the timer resumes only when you press <b>Next</b> (or Final Submit on the last exercise).</span></li>'+
    '<li><span class="rl-ico">⤼</span><span><b>Skip.</b> Every exercise can be skipped without penalty. Skipped exercises go to a review pool. Before you finish, you can return to them as many times as the timer allows. Skipped-and-never-answered exercises are excluded from the score completely.</span></li>'+
    '</ul>'+
    '<div class="btnrow"><button class="btn primary" id="startbtn" onclick="startAttempt()">▶ Start the exam</button></div>'+
  '</section>';
  window.scrollTo(0,0);
}

/* ================= exam flow ================= */
function constrainedShuffle(){
  var isTerm = EXS.map(function(e){ return e.type === 'terminal'; });
  var ord = EXS.map(function(e,i){ return i; });
  for(var tries=0; tries<80; tries++){
    ord = shuffle(EXS.map(function(e,i){ return i; }));
    var ok = true;
    for(var k=1; k<ord.length; k++){ if(isTerm[ord[k]] && isTerm[ord[k-1]]){ ok = false; break; } }
    if(ok){ return ord; }
  }
  return ord;
}
function startAttempt(){
  EXS = DATA.exercises.map(function(e){ return JSON.parse(JSON.stringify(e)); });
  S = {
    screen:'exam', order:[], cur:0, creditSum:0, answered:0, checkedCount:0,
    skipped:[], reported:false, init:S ? S.init : null, reviewing:null
  };
  S.order = shuffle(EXS.map(function(e,i){ return i; }));
  EXS.forEach(function(ex){
    ex._checked = false; ex._credit = 0; ex._hintUsed = false; ex._ans = null; ex._items = null; ex._autoGrade = false;
    if(ex.type === 'mcq' || ex.type === 'multi' || ex.type === 'logview'){ ex._optOrder = shuffle(ex.options.map(function(o,i){ return i; })); }
    if(ex.type === 'match'){ ex._rightOrder = shuffle(ex.right.map(function(r,i){ return i; })); }
    if(ex.type === 'dnd'){ ex._bankOrder = shuffle(ex.bank.map(function(b,i){ return i; })); }
    if(ex.type === 'order'){ ex._seq = shuffle(ex.sequence.slice()); }
    if(ex.type === 'terminal'){ ex._log = []; ex._lastCmd = null; ex._tleft = (ex.cmd && ex.cmd.timeLimit) ? ex.cmd.timeLimit : null; }
    if(ex.type === 'branch'){ ex._step = 0; ex._picks = []; ex._pendingPick = null; }
  });
  T = { remaining: META.timerMinutes*60, state:'RUNNING', iv:null, manualTotal:0, autoTotal:0 };
  if(T.iv){ clearInterval(T.iv); }
  T.iv = setInterval(tick, 1000);
  setTState('RUNNING');
  S.screen = 'exam';
  S.cur = 0;
  S.order = constrainedShuffle();
  LASTKEY = '';
  renderExamShell();
  renderExercise();
}
function curEx(){ return EXS[S.order[S.cur]]; }
function sevClass(){ return 'sev-' + (META.difficulty === 'extremely-hard' ? 'extreme' : META.difficulty); }

function renderExamShell(){
  $('app').innerHTML =
    '<div class="topbar" id="topbar">'+
      '<span class="tb-item" id="tb-counter"></span>'+
      '<span class="tb-item"><span class="badge '+sevClass()+'" id="tb-badge"></span></span>'+
      '<span class="tb-item" id="tb-part"></span>'+
      '<span class="tb-item">⏱ <span class="timerbox" id="timerbox">--:--</span> <span class="tstate" id="tstate"></span></span>'+
      '<span class="tb-item tb-score">◎ Score: <strong id="tb-score">0 / 0</strong> <span id="tb-pct">(0%)</span></span>'+
      (S.init && S.init.username ? '<span class="userchip">👤 '+esc(S.init.username)+'</span>' : '')+
      '<span style="flex:1"></span>'+
      '<button class="btn ghost" id="btn-pause" onclick="pauseManual()">⏸ Pause</button>'+
      '<button class="btn amber" id="btn-hint" onclick="doHint()">💡 Hint <small style="opacity:.8">−10%</small></button>'+
      '<button class="btn ghost" id="btn-skip" onclick="doSkip()">⤼ Skip</button>'+
    '</div>'+
    '<div id="pbarwrap"><div id="pbar"></div></div>'+
    '<div id="exarea"></div>';
  $('tb-badge').textContent = DATA.severityWord;
  $('tb-part').innerHTML = DATA.partLabel ? '<span class="statechip st-skipped">'+esc(DATA.partLabel)+'</span>' : '';
  $('pbar').style.setProperty('--sev', 'var(--sev-' + META.difficulty.replace('extremely-hard','extreme') + ')');
  renderTimerBox();
  setTState(T ? T.state : 'RUNNING');
  updateHeader();
}
function updateHeader(){
  if(!$('tb-counter')){ return; }
  var ex = curEx();
  if(S.screen === 'exam'){
    $('tb-counter').innerHTML = 'Exercise <strong>'+(S.cur+1)+'</strong> of <strong>'+EXS.length+'</strong>';
  } else if(S.screen === 'open'){
    $('tb-counter').innerHTML = '⚠ Reviewing skipped exercise <strong>'+(S.reviewPos+1)+'</strong> of <strong>'+S.skipped.length+'</strong>';
  } else if(S.screen === 'review'){
    $('tb-counter').innerHTML = 'Review skipped exercises';
  }
  $('tb-score').textContent = round1(S.creditSum).toFixed(1) + ' / ' + S.answered;
  var pct = S.answered > 0 ? Math.round((S.creditSum / S.answered) * 100) : 0;
  $('tb-pct').textContent = '(' + pct + '%)';
  var p = Math.round((S.checkedCount / EXS.length) * 100);
  $('pbar').style.width = p + '%';
  var hintDis = S.screen !== 'exam' && S.screen !== 'open';
  hintDis = hintDis || !ex || ex._hintUsed || ex._checked;
  $('btn-hint').disabled = !!hintDis;
  $('btn-skip').disabled = S.screen !== 'exam' || !ex || ex._checked;
  var pb = $('btn-pause'); if(pb){ pb.disabled = !T || T.state === 'ENDED'; }
}

/* ---------- scenario / question blocks ---------- */
function scenarioHtml(ex){
  var arts = (ex.scenario || []).map(function(a, i){
    if(a.kind === 'log' || a.kind === 'code'){
      var lines = a.text.split('\n').map(function(l){ return '<div class="ln">'+hl(l)+'</div>'; }).join('');
      return '<div class="artefact"><span class="art-label">'+esc(a.label)+'</span><div class="art-body"><pre class="mono" style="background:transparent;border:none;padding:0;margin:0">'+lines+'</pre></div></div>';
    }
    return '<div class="artefact"><span class="art-label">'+esc(a.label)+'</span><div class="art-body"><p>'+esc(a.text).replace(/\n/g,'<br>')+'</p></div></div>';
  }).join('');
  var sum = '<div class="blk-body" id="scen-sum" style="border-top:1px dashed var(--border);padding:10px 16px"><span class="art-label" style="padding:0 0 4px 0">⚠ ONE-LINE SUMMARY</span><p style="margin:2px 0">'+esc(ex.summary)+'</p></div>';
  return '<div class="blk scenario" id="blk-scen">'+
    '<div class="blk-head"><span class="blk-ico">🛰</span> SCENARIO'+
      '<span style="flex:1"></span>'+
      '<button class="btn ghost" id="scen-toggle" style="min-height:44px;padding:4px 12px" onclick="toggleScenario()" aria-expanded="true">▲ Collapse</button>'+
    '</div>'+
    '<div class="blk-body" id="scen-body">'+arts+'</div>'+sum+
  '</div>';
}
function toggleScenario(){
  var b = $('scen-body'), t = $('scen-toggle');
  if(!b){ return; }
  var open = !b.classList.contains('hidden');
  b.classList.toggle('hidden', open);
  t.textContent = open ? '▼ Expand' : '▲ Collapse';
  t.setAttribute('aria-expanded', String(!open));
}

/* ---------- answer widgets ---------- */
function optRowHtml(ex, i, kind){
  var o = ex.options[i];
  var dk = dispKey(ex, i);
  var inp = '<input type="'+(kind==='multi'?'checkbox':'radio')+'" name="ans" id="opt-'+i+'" value="'+i+'" onchange="pickOpt()" aria-label="Option '+letterKey(dk)+'">';

/* ---------- grading ---------- */
function applyHintPenalty(credit, ex){
  if(ex._hintUsed){ return Math.max(0, credit - 0.10); }
  return credit;
}
function gradeCurrent(){
  if(S.screen !== 'exam' && S.screen !== 'open'){ return; }
  var ex = curEx();
  if(ex._checked){ return; }
  if(ex.type === 'branch' && ex._step < ex.steps.length){
    var fb = $('fback');
    if(fb){ fb.innerHTML = '<div class="hintpanel"><span class="hint-tag">⏳ NOT FINISHED YET</span>Confirm every step of this decision first (the timer keeps running while you decide). The Check button unlocks after the final step.</div>'; }
    return;
  }
  var res = gradeEx(ex);
  ex._items = res.items;
  ex._dangerous = res.dangerous || false;
  ex._credit = applyHintPenalty(res.credit, ex);
  ex._checked = true;
  S.creditSum += ex._credit;
  S.answered += 1;
  S.checkedCount += 1;
  var idx = EXS.indexOf(ex);
  var poolIdx = S.skipped.indexOf(idx);
  if(poolIdx >= 0){ S.skipped.splice(poolIdx, 1); }
  if(T.state === 'RUNNING'){ setTState('PAUSED_AUTO_CHECK'); }
  renderFeedback(ex, res);
  lockAnswer();
  updateHeader();
}

/* ---------- per-type grading ---------- */
function gradeEx(ex){
  var items = [], H=0, W=0, N=0, dangerous=false;
  var i, j;
  if(ex.type === 'mcq'){
    N = 1;
    var sel = getMcqSel();
    var ci = ex.options.map(function(o,k){ return o.correct ? k : -1; }).filter(function(k){ return k>=0; })[0];
    if(sel === ci){ H = 1; items.push({state:'correct', label:'Option '+letterKey(dispKey(ex,ci)), note:ex.options[ci].why}); }
    else if(sel >= 0){ W = 1; items.push({state:'wrong', label:'Option '+letterKey(dispKey(ex,sel)), note:ex.options[sel].why}); }
    else { items.push({state:'missed', label:'Option '+letterKey(dispKey(ex,ci)), note:ex.options[ci].why}); }
  } else if(ex.type === 'multi' || ex.type === 'logview'){
    var sel2 = getMultiSel();
    ex.options.forEach(function(o,k){
      var picked = sel2.indexOf(k) >= 0;
      if(o.correct){
        N += 1;
        if(picked){ H += 1; items.push({state:'correct', label:'Option '+letterKey(dispKey(ex,k)), note:o.why}); }
        else { items.push({state:'missed', label:'Option '+letterKey(dispKey(ex,k)), note:o.why}); }
      } else if(picked){
        W += 1; items.push({state:'wrong', label:'Option '+letterKey(dispKey(ex,k)), note:o.why});
      }
    });
  } else if(ex.type === 'match'){
    N = ex.left.length;
    ex.left.forEach(function(L, li){
      var v = $('match-'+li) ? parseInt($('match-'+li).value,10) : NaN;
      if(v === L.match){ H += 1; items.push({state:'correct', label:L.t+' → '+ex.right[L.match].t, note:L.why}); }
      else if(!isNaN(v) && $('match-'+li).value !== ''){ W += 1; items.push({state:'wrong', label:L.t+' → '+ex.right[v].t, note:(ex.right[v].why || L.whyMiss || 'That pairing is not correct here. '+L.why)}); }
      else { items.push({state:'missed', label:L.t+' → '+ex.right[L.match].t, note:L.why}); }
    });
  } else if(ex.type === 'dnd'){
    N = ex.zones.length;
    ex.zones.forEach(function(z, zi){
      var placed = ex._ans && ex._ans[zi] !== undefined ? ex._ans[zi] : null;
      if(placed !== null && placed === z.accepts[0]){ H += 1; items.push({state:'correct', label:z.name+' ← '+ex.bank[placed].t, note:z.why}); }
      else if(placed !== null){ W += 1; items.push({state:'wrong', label:z.name+' ← '+ex.bank[placed].t, note:(ex.bank[placed].whyMiss || z.why)}); }
      else { items.push({state:'missed', label:z.name+' ← '+ex.bank[z.accepts[0]].t, note:z.why}); }
    });
  } else if(ex.type === 'order'){
    N = ex.sequence.length;
    ex._seq.forEach(function(t, pos){
      var correctHere = (ex.sequence[pos] === t);
      if(correctHere){ H += 1; items.push({state:'correct', label:'Position '+(pos+1)+': '+t, note:ex.orderWhy ? ex.orderWhy[pos] : 'This step belongs in position '+(pos+1)+'.'}); }
      else { W += 1; items.push({state:'wrong', label:'Position '+(pos+1)+': '+t, note:'Expected: '+ex.sequence[pos]+'. '+(ex.orderWhy ? ex.orderWhy[pos] : '')}); }
    });
  } else if(ex.type === 'fib'){
    N = ex.blanks.length;
    ex.blanks.forEach(function(b, bi){
      var el = $('blank-'+bi);
      var val = el ? normTxt(el.value) : '';
      var ok = b.accept.map(normTxt).indexOf(val) >= 0;
      if(ok){ H += 1; items.push({state:'correct', label:'Blank '+(bi+1)+': '+b.accept[0], note:b.why}); }
      else if(val !== ''){ W += 1; items.push({state:'wrong', label:'Blank '+(bi+1)+': '+el.value, note:b.whyMiss || b.why}); }
      else { items.push({state:'missed', label:'Blank '+(bi+1)+': '+b.accept[0], note:b.why}); }
    });
  } else if(ex.type === 'terminal'){
    N = ex.cmd.elements.length;
    var norm = ex._lastCmd || '';
    ex.cmd.elements.forEach(function(el2){
      var re = new RegExp(el2.re);
      if(re.test(norm)){ H += 1; items.push({state:'correct', label:el2.label, note:el2.why}); }
      else { items.push({state:'missed', label:el2.label, note:el2.why}); }
    });
    (ex.cmd.forbidden || []).forEach(function(f){
      var re = new RegExp(f.re);
      if(re.test(norm)){ W += 1; dangerous = true; items.push({state:'wrong', label:'Used: '+f.label, note:f.why}); }
    });
    if(!norm){ items.unshift({state:'missed', label:'No command was submitted', note:'Type the command and press Run, then Check.'}); }
  } else if(ex.type === 'branch'){
    N = ex.steps.length;
    ex.steps.forEach(function(st2, si2){
      var pick = ex._picks[si2];
      var ci2 = st2.options.map(function(o,k){ return o.correct ? k : -1; }).filter(function(k){ return k>=0; })[0];
      if(pick === ci2){ H += 1; items.push({state:'correct', label:'Step '+(si2+1), note:st2.options[ci2].why}); }
      else if(pick !== undefined && pick !== null){ W += 1; items.push({state:'wrong', label:'Step '+(si2+1), note:st2.options[pick].why}); }
      else { items.push({state:'missed', label:'Step '+(si2+1), note:st2.options[ci2].why}); }
    });
  } else if(ex.type === 'triage'){
    N = ex.rows.length;
    ex.rows.forEach(function(r, ri){
      var el3 = $('tri-'+ri);
      var v = el3 && el3.value !== '' ? parseInt(el3.value,10) : null;
      if(v === r.correctIndex){ H += 1; items.push({state:'correct', label:'Alert '+(ri+1), note:r.why}); }
      else if(v !== null){ W += 1; items.push({state:'wrong', label:'Alert '+(ri+1), note:(r.whyNot && r.whyNot[v] ? r.whyNot[v] : r.why)}); }
      else { items.push({state:'missed', label:'Alert '+(ri+1)+': '+r.options[r.correctIndex], note:r.why}); }
    });
  }
  return { credit: scoreExercise(H, W, N), h:H, w:W, n:N, items:items, dangerous:dangerous };
}

/* ---------- interactions per type ---------- */
function pickMatch(){ /* nothing needed pre-check */ }
function pickFib(){ /* nothing needed pre-check */ }
function pickTriage(){ /* nothing needed pre-check */ }
var armedChip = null;
function chipClick(bi){
  if(curEx()._checked){ return; }
  var chip = $('chip-'+bi);
  if(!chip){ return; }
  if(chip.closest('.zone')){ returnToBank(bi); return; }
  if(armedChip === bi){ chip.classList.remove('armed'); armedChip = null; return; }
  document.querySelectorAll('.chip.armed').forEach(function(c){ c.classList.remove('armed'); });
  armedChip = bi;
  chip.classList.add('armed');
  chip.innerHTML = esc(curEx().bank[bi].t) + ' <span class="chip-armprompt">CLICK A ZONE ▸</span>';
}
function zoneClick(zi){
  if(curEx()._checked){ return; }
  if(armedChip === null){ returnToBankFromZone(zi); return; }
  placeChip(armedChip, zi);
  armedChip = null;
}
function placeChip(bi, zi){
  curEx()._ans = curEx()._ans || {};
  var prevZone = null;
  Object.keys(curEx()._ans).forEach(function(k){ if(curEx()._ans[k] === bi){ prevZone = k; } });
  if(prevZone !== null && String(prevZone) !== String(zi)){ delete curEx()._ans[prevZone]; $('zoneslot-'+prevZone).innerHTML = ''; }
  curEx()._ans[zi] = bi;
  $('zoneslot-'+zi).innerHTML = '<span class="chip" data-inzone="'+bi+'">'+esc(curEx().bank[bi].t)+' <small style="color:var(--text-secondary)">✕ remove</small></span>';
  var chip = $('chip-'+bi);
  if(chip){ chip.classList.add('hidden'); chip.classList.remove('armed'); }
}
function returnToBank(bi){
  var ex = curEx();
  Object.keys(ex._ans || {}).forEach(function(k){ if(ex._ans[k] === bi){ delete ex._ans[k]; $('zoneslot-'+k).innerHTML=''; } });
  var chip = $('chip-'+bi); if(chip){ chip.classList.remove('hidden'); }
}
function returnToBankFromZone(zi){
  var ex = curEx();
  var bi = ex._ans && ex._ans[zi];
  if(bi === undefined || bi === null){ return; }
  returnToBank(bi);
}
function chipDrag(ev, bi){ ev.dataTransfer.setData('text/plain', String(bi)); armedChip = bi; }
function zoneDragOver(ev, zi){ ev.preventDefault(); $('zone-'+zi).classList.add('dragover'); }
function zoneDragLeave(ev){ ev.target.classList && ev.target.classList.remove('dragover'); }
function zoneDrop(ev, zi){
  ev.preventDefault();
  $('zone-'+zi).classList.remove('dragover');
  var bi = parseInt(ev.dataTransfer.getData('text/plain'),10);
  if(!isNaN(bi)){ placeChip(bi, zi); armedChip = null; }
}
function seqMove(i, dir){
  var ex = curEx();
  if(ex._checked){ return; }
  var j = i + dir;
  if(j < 0 || j >= ex._seq.length){ return; }
  var t = ex._seq[i]; ex._seq[i] = ex._seq[j]; ex._seq[j] = t;
  renderSeqList();
}
function shellRun(){
  var ex = curEx();
  var inp = $('shellin');
  if(!inp || inp.disabled){ return; }
  var raw = inp.value;
  if(!raw.trim()){ return; }
  var norm = raw.trim().replace(/\s+/g,' ').toLowerCase();
  ex._lastCmd = norm;
  ex._log.push({t: ex.cmd.prompt + ' ' + raw, err:false});
  var out = null;
  (ex.cmd.outputs || []).forEach(function(o){
    if(!out && new RegExp(o.re).test(norm)){ out = o; }
  });
  if(out){ out.lines.forEach(function(l){ ex._log.push({t:l, err:false}); }); }
  else { ex._log.push({t: ex.cmd.unknown || 'command not recognized for this simulation — check spelling and options', err:true}); }
  renderExercise();
  var lg = $('shelllog'); if(lg){ lg.scrollTop = lg.scrollHeight; }
  var si2 = $('shellin'); if(si2 && !si2.disabled){ si2.focus(); }
}
function logFilter(){
  var q = ($('logfilter').value || '').toLowerCase();
  document.querySelectorAll('#loglines .ln').forEach(function(ln){
    ln.style.display = (!q || ln.textContent.toLowerCase().indexOf(q) >= 0) ? '' : 'none';
  });
}
function renderBranchStep(){
  var ex = curEx();
  var area = $('answidget');
  if(!area){ return; }
  var htmlp = '';
  ex.steps.forEach(function(st2, si2){
    if(si2 > ex._step){ return; }
    var opts = st2.options.map(function(o, oi){
      var selCls = (ex._picks[si2] === oi) ? ' selected' : '';
      return '<label class="opt'+selCls+'" style="margin:6px 0"><input type="radio" name="bstep'+si2+'" value="'+oi+'" '+(ex._picks[si2]===oi?'checked':'')+' onchange="branchPick('+si2+','+oi+')"><span class="opt-key">'+String.fromCharCode(65+oi)+'.</span><span class="opt-text">'+esc(o.t)+'</span></label>';
    }).join('');
    var outcome = (ex._picks[si2] !== undefined && ex._picks[si2] !== null && si2 < ex._step) ?
      '<div class="outcome'+((ex._picks[si2]!==undefined && st2.options[ex._picks[si2]].outcomeBad)?' bad':'')+'">▸ '+esc(st2.options[ex._picks[si2]].outcome)+'</div>' : '';
    htmlp += '<div class="step"><span class="step-tag">STEP '+(si2+1)+' OF '+ex.steps.length+'</span><div class="step-text">'+esc(st2.text)+'</div>'+opts+outcome+
      (si2 === ex._step && ex._picks[si2] === undefined ? '<button class="btn ghost" style="margin-top:8px" onclick="branchConfirm('+si2+')">▸ Confirm step '+(si2+1)+' (does not stop the timer)</button>' : '')+
      '</div>';
  });
  if(ex._step >= ex.steps.length && !ex._checked){
    htmlp += '<div class="btnrow"><button class="btn green" onclick="gradeCurrent()">✓ Check — grade all '+ex.steps.length+' decisions</button></div>';
  }
  area.innerHTML = htmlp;
}
function branchPick(si2, oi){
  var ex = curEx();
  if(ex._checked || si2 !== ex._step){ return; }
  ex._pendingPick = oi;
  document.querySelectorAll('input[name="bstep'+si2+'"]').forEach(function(el){ var r = el.closest('.opt'); if(r){ r.classList.toggle('selected', el.checked); } });
}
function branchConfirm(si2){
  var ex = curEx();
  var picked = ex._pendingPick;
  if(picked === undefined || picked === null){ return; }
  ex._picks[si2] = picked;
  ex._pendingPick = null;
  ex._step = si2 + 1;
  renderBranchStep();
  updateCheckState();
}

/* ---------- flow: pause / skip / hint / next / review / results ---------- */
var flowLock = false;
function flowLockAcquire(){
  if(flowLock){ return false; }
  flowLock = true;
  return true;
}
function flowLockRelease(){ flowLock = false; }
function pauseManual(){
  if(!T || T.state === 'ENDED'){ return; }
  if(T.state === 'PAUSED_MANUAL'){ return; }
  T.prevState = T.state;
  setTState('PAUSED_MANUAL');
  var ov = document.createElement('div');
  ov.id = 'pauseoverlay';
  ov.innerHTML = '<div class="pausecard"><div class="pico">⏸</div><h2>PAUSED — manual</h2><p>The exercise is hidden and the timer is stopped. Press Resume when you are ready to continue.</p><button class="btn primary" id="btn-resume" onclick="resumeManual()">▶ Resume</button></div>';
  document.body.appendChild(ov);
  var ex = $('exarea'); if(ex){ ex.style.visibility = 'hidden'; }
}
function resumeManual(){
  var ov = $('pauseoverlay'); if(ov){ ov.remove(); }
  var ex = $('exarea'); if(ex){ ex.style.visibility = 'visible'; }
  setTState(T.prevState === 'PAUSED_AUTO_CHECK' ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
}
function doHint(){
  if(S.screen !== 'exam' && S.screen !== 'open'){ return; }
  var ex = curEx();
  if(!ex || ex._hintUsed || ex._checked){ return; }
  ex._hintUsed = true;
  var hp = document.createElement('div');
  hp.className = 'hintpanel';
  hp.innerHTML = '<span class="hint-tag">💡 HINT (one per exercise — costs 10% of this exercise\u2019s credit)</span>' + esc(ex.hint);
  var blk = document.querySelector('.blk.answer .blk-body');
  if(blk){ blk.insertBefore(hp, blk.firstChild); }
  $('btn-hint').disabled = true;
}
function doSkip(){
  if(S.screen !== 'exam'){ return; }
  if(!flowLockAcquire()){ return; }
  var ex = curEx();
  if(!ex || ex._checked){ flowLockRelease(); return; }
  var idx = EXS.indexOf(ex);
  if(S.skipped.indexOf(idx) < 0){ S.skipped.push(idx); }
  if(S.cur < EXS.length - 1){ S.cur += 1; renderExercise(); }
  else { flowLockRelease(); openReview(); }
}
function goNext(){
  if(!flowLockAcquire()){ return; }
  if(T.state === 'PAUSED_AUTO_CHECK'){ setTState('RUNNING'); }
  if(S.screen === 'open'){
    S.screen = 'review';
    openReview();
    return;
  }
  if(S.cur < EXS.length - 1){ S.cur += 1; renderExercise(); }
  else { flowLockRelease(); finishAttempt(false); }
}
function openReview(){
  flowLockRelease();
  S.screen = 'review';
  S.reviewing = null;
  if(T.state === 'PAUSED_AUTO_CHECK'){ setTState('RUNNING'); }
  updateHeader();
  var items = S.skipped.map(function(idx, pos){
    var ex = EXS[idx];
    return '<li><span class="statechip st-skipped">⚠ Skipped</span><span class="rv-title">'+esc(ex.title)+'</span><button class="btn primary" onclick="openSkipped('+pos+')">↩ Open and answer</button></li>';
  }).join('');
  $('exarea').innerHTML =
    '<div class="card"><h2>⚠ Review skipped exercises ('+S.skipped.length+')</h2>'+
    '<p style="color:var(--text-secondary)">The timer is still running. You can open each skipped exercise as many times as you need until the timer ends or you submit. If you submit now, every skipped-and-never-answered exercise is excluded from the score — it does not count as correct or wrong.</p>'+
    (S.skipped.length ? '<ul class="reviewlist">'+items+'</ul>' : '<p>Nothing left here — you answered everything.</p>')+
    '<div class="btnrow"><button class="btn danger" onclick="showResults()">⏹ Submit exam now</button></div></div>';
  window.scrollTo(0,0);
}
function openSkipped(pos){
  var idx = S.skipped[pos];
  var ordPos = S.order.indexOf(idx);
  if(ordPos < 0){ ordPos = 0; }
  S.cur = ordPos;
  S.reviewPos = pos;
  S.screen = 'open';
  renderExercise();
}
function finishAttempt(auto){
  if(T.iv){ clearInterval(T.iv); }
  var anySkipped = S.skipped.length > 0;
  if(!auto && anySkipped && S.screen === 'exam'){
    openReview();
    return;
  }
  showResults();
}
function showResults(){
  flowLockRelease();
  if(S.screen === 'results'){ return; }
  if(T.iv){ clearInterval(T.iv); }
  setTState('ENDED');
  S.screen = 'results';
  var fully = 0, partial = 0, partialSum = 0, incorrect = 0, skippedN = 0, answeredN = 0;
  EXS.forEach(function(ex){
    if(ex._checked){
      answeredN += 1;
      if(ex._credit >= 1){ fully += 1; }
      else if(ex._credit > 0){ partial += 1; partialSum += ex._credit; }
      else { incorrect += 1; }
    } else { skippedN += 1; }
  });
  var sum = 0;
  EXS.forEach(function(ex){ if(ex._checked){ sum += ex._credit; } });
  var pct = answeredN > 0 ? Math.round((sum / answeredN) * 100) : 0;
  var passed = pct >= META.passMark && answeredN > 0;
  var avgP = partial > 0 ? round1(partialSum / partial).toFixed(2) : '0.00';
  var mins = Math.floor((META.timerMinutes*60 - T.remaining) / 60);
  var cert = passed ?
    '<div class="cert pass"><h2>✓ PASS</h2><p>You reached <b>'+pct+'%</b>, which is at or above the '+META.passMark+'% pass mark. Your result has been reported to the site.</p></div>' :
    '<div class="cert fail"><h2>✗ FAIL</h2><p>You reached <b>'+pct+'%</b>, below the '+META.passMark+'% pass mark. You must retake the exam to pass.</p></div>';
  $('app').innerHTML =
    '<div class="card"><h1>Results — '+esc(META.title)+'</h1>'+
    '<p style="color:var(--text-secondary)">Score computed over <b>'+answeredN+'</b> answered exercise(s). '+skippedN+' skipped-and-never-answered exercise(s) were excluded from both the score and the maximum.</p>'+
    '<div class="factrow"><span class="fact">◎ <span>Final score: <b>'+sum.toFixed(1)+' / '+answeredN+'</b> — <b>'+pct+'%</b></span></span><span class="fact">⏱ <span>timer used: <b>'+mins+' min</b> of '+META.timerMinutes+'</span></span></div>'+
    '</div>'+
    cert+
    '<div class="resultgrid">'+
    '<div class="rcard"><div class="rc-num st-correct">✓ '+fully+'</div><div class="rc-lab">Fully correct (credit 1.0)</div></div>'+
    '<div class="rcard"><div class="rc-num st-partial">✓ '+partial+'</div><div class="rc-lab">Partially correct (avg credit '+avgP+')</div></div>'+
    '<div class="rcard"><div class="rc-num st-incorrect">✗ '+incorrect+'</div><div class="rc-lab">Fully incorrect (credit 0)</div></div>'+
    '<div class="rcard"><div class="rc-num st-skipped">⚠ '+skippedN+'</div><div class="rc-lab">Skipped — excluded</div></div>'+
    '</div>'+
    '<div class="card"><h2>How your time was spent</h2><p class="pauselog">⏸ Total time paused manually (exercise hidden): <b class="mono">'+T.manualTotal+' s</b><br>⏸ Total time paused for feedback review (Check auto-pause): <b class="mono">'+T.autoTotal+' s</b></p></div>'+
    '<div class="btnrow"><button class="btn primary" id="retakebtn" onclick="retake()">↻ Retake Exam</button></div>';
  window.scrollTo(0,0);
  if(!S.reported){
    S.reported = true;
    reportScore(sum, answeredN);
  }
}
function reportScore(creditSum, answeredCount){
  var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent >= META.passMark
    }, location.origin);
  } catch(e) { /* Opened directly rather than inside the site. */ }
}
function retake(){
  var init = S ? S.init : null;
  startAttempt();
  S.init = init;
  updateHeader();
}

/* ---------- handshake & boot ---------- */
window.addEventListener('message', function (event) {
  if (!event.data) { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  S = S || { init: null };
  S.init = {
    username: event.data.username || '',
    country: event.data.country || '',
    locale: event.data.locale || 'en',
    theme: event.data.theme || 'dark' /* always 'dark'; the file is dark-only, nothing to switch */
  };
  var uc = document.querySelector('.userchip');
  if (S.init.username && !uc) {
    var hero = document.querySelector('.factrow');
    if (hero) {
      var chip = document.createElement('span');
      chip.className = 'userchip';
      chip.textContent = '👤 Analyst: ' + S.init.username;
      hero.appendChild(chip);
    }
  }
});
S = { init: null };
renderIntro();
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
