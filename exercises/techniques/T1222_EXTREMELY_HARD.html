var INTRO = {"learn": "<p><b>This is the senior seat.</b> artefacts disagree. The CI/CD pipeline legitimately runs chattr in deploy windows — and something just ran chattr outside one. Three of your hosts have no EDR. The CISO wants a decision in ten minutes and the &ldquo;best practice&rdquo; answer is, in this context, the expensive mistake. Welcome to T1222 at expert level.</p><p><b>What you will face.</b> Sixteen exercises that chain three or more concepts: interpretation &rarr; containment &rarr; scope &rarr; reporting, with at least one genuinely conflicting signal each, realistic noise to ignore, and missing information you must reason around. You will weigh <b>real costs</b> (isolating a file server stops an intrusion <i>and</i> the business), pick evidence-preserving commands under a clock, choose when <b>not</b> to act yet, and write the uncertainty into the report instead of hiding it. Documented actors anchor the ambiguity: TeamTNT-style cloud worms imitate admins; Wizard Spider-class operators unlock backups before encryption.</p><p><b>Where you will use this at work:</b> incident command, detection-programme design reviews, executive briefings — anywhere the permission-modification signal (T1222) meets incomplete telemetry and a stakeholder clock.</p>", "keywords": [{"theme": "Chain reasoning over T1222 artefacts", "items": ["Deny ACEs and owner changes as defender-denial (T1222.001)", "chattr +i/-i lifecycles on persistence paths (T1222.002)", "Pre-encryption unlock patterns: icacls /grant, takeown", "Distinguishing T1222 from T1490 (recovery inhibition) and T1036 (masquerading)"]}, {"theme": "Conflicting signals and noise", "items": ["CI/CD and SCCM as legitimate chattr/icacls sources", "Backup-window grants vs out-of-hours grants", "Pattern-shaped evidence vs account-shaped evidence", "Commodity worm (TeamTNT-style) vs targeted actor narratives"]}, {"theme": "Decisions with real costs", "items": ["Isolate now (downtime) vs watch (spread) — the containment trade", "Evidence first: icacls /save under a clock", "When 'gather more evidence' is the correct action", "Reporting uncertainty without burying it"]}, {"theme": "Coverage and control gaps", "items": ["Compensating controls where Sysmon/EDR is absent (auditd, 4670, SACLs)", "M1022 and M1026 mapped to prevention, detection, recovery", "Post-incident report contents for ACL backdoors", "Prioritising a mixed alert queue under pressure"]}], "how": "<ul class='howlist'><li><b>Goal:</b> score at least <b>70%</b>. 16 EXTREMELY HARD exercises: 3+ chained concepts, conflicting signals, senior pressure.</li><li><b>Exercise types:</b> two branching incident decisions, multi-select evidence selection, prioritisation drag &amp; drop, technique discrimination matching, ordering with cost trade-offs, an executive fill-in, and <b>one timed terminal</b> (evidence preservation, 03:00 limit).</li><li><b>Timer:</b> 85:00. <b class='pz'>&#9208; Pause</b> hides the exercise. <b>Check</b> auto-stops the clock (<b class='pz'>&#9208; PAUSED — reviewing feedback</b>) until <b>Next</b>. The timed terminal has its own clock that runs only while the main clock runs and auto-submits on expiry.</li><li><b>Partial credit:</b> <span class='ok'>(H &minus; W) &divide; N</span> on every multi-item exercise; branch steps score one item each on the final Check.</li><li><b>Hints:</b> one per exercise, costs 10% of that exercise's credit — and here they only restate a constraint, never point at the answer. <b class='sk'>&#9888; Skip</b> parks exercises for the review screen; never-answered skips are excluded from the score.</li><li><b>Expert contract:</b> several options are defensible in some world; only one is correct in <i>this</i> world. Read every artefact — including the ones that look irrelevant.</li></ul>"};
var EXERCISES = [{"id": "x01", "type": "branch", "reviewLabel": "Branching: the staged file server, CISO waiting", "scenario": "<p>Friday 16:47. You are incident command. The artefacts below are everything you have. The CISO joins in ten minutes and wants a decision she can defend to the board.</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — EDR timeline, FS-EAST-01 (file server, 4,100 users)</span><div class='artbody'>15:58  webshell detected: /uploads/debug.aspx (T1505.003)\n16:04  icacls D:\\Shares /grant Everyone:F /T /C /Q   as IIS APPPOOL\\defaultapppool\n16:07  takeown /f E:\\BackupCatalog\\catalog.idx      as IIS APPPOOL\\defaultapppool\n16:09  attrib +h C:\\Users\\Public\\stage.exe          as IIS APPPOOL\\defaultapppool\n16:11  netstat -ano  (noise: normal SCCM sync to 10[.]20[.]0[.]15:443)\n16:13  no encryption processes observed yet</div></div><div class='artefact'><span class='artlabel'>ARTEFACT 2 — business context</span><div class='artbody'>FS-EAST-01 serves all departmental shares; quarter-end closes Monday.\nBackups: E: holds the only catalogue; replication to DR runs nightly 23:00.\nIsolation impact estimate: full file-service outage, ~30 min to fail over to FS-EAST-02 (stale by 12 h).</div></div>", "scenarioShort": "Staged file server at 16:47 — decide with the CISO", "question": "Two decisions. The bridge is live.", "hint": "The constraints that matter: no encryption yet, one catalogue, DR replication tonight, quarter-end Monday.", "explain": "<p><b>Decision 1 — interpretation.</b> The chain (webshell &rarr; recursive grant &rarr; takeown on the backup catalogue &rarr; hidden stage binary) is the classic pre-encryption unlock: Ryuk's grant line, WastedLocker-class takeown, WannaCry's hide. The SCCM netstat line is noise — same port as any sync, unrelated process tree. The operator is <i>preparing</i>, not executing: the absence of encryption processes is the one gift in the timeline. <b>Decision 2 — action with cost.</b> Isolate now. Yes, ~30 minutes of outage and a 12-hour-stale failover target — and the alternative is an operator you have already seen touching the <i>only</i> backup catalogue finishing their preparation over the weekend. The cost is real; the trade is still correct. Watch-only assumes the attacker's clock is yours; blocking one account assumes you know their access — you do not (the webshell is unattributed).</p>", "study": "pre-encryption permission-unlock chains and the containment-vs-cost decision framework.", "data": {"steps": [{"q": "Decision 1 — what does the artefact chain tell you?", "options": [{"t": "Pre-encryption staging: unlock, own the backups, hide the payload — operator not yet executing", "correct": true, "why": "Webshell + recursive grant + catalogue takeown + hidden stage is the unlock chain; no encryption processes yet."}, {"t": "Routine misconfiguration by the app-pool account", "why": "App-pool identities do not takeown backup catalogues."}, {"t": "Backup software fault — the catalogue index changed owners", "why": "Backup faults do not follow a webshell within minutes."}, {"t": "Ransomware already executed and failed", "why": "No encryption processes are observed — execution has not started."}]}, {"q": "Decision 2 — the CISO asks for your recommendation. You say:", "options": [{"t": "Isolate FS-EAST-01 now and accept the ~30 min outage — before the operator finishes preparing", "correct": true, "why": "The only backup catalogue is being staged for destruction; a bounded outage beats an unbounded one."}, {"t": "Watch passively for encryption to start, then act", "why": "Watching hands the clock to the operator — over a weekend."}, {"t": "Disable the IIS app-pool account only, keep serving", "why": "The webshell is unattributed; assuming one account closes the door is unsupported."}, {"t": "Restore FS-EAST-01 from last night's backups instead", "why": "Restoration without containment loses 16:00-16:13 evidence and the attacker's access path."}]}]}}, {"id": "x02", "type": "terminal", "reviewLabel": "Timed terminal: preserve the ACL evidence", "scenario": "<p>Legal has attached the webshell investigation. FS-EAST-01 is isolated; remediation begins in minutes and it will <b>reset the ACLs</b> on the uploads tree. Before any of that, you must produce ACL evidence that survives scrutiny — the exact DACL state the attacker left behind.</p><div class='artefact'><span class='artlabel'>Environment</span><div class='artbody'>Host:   FS-EAST-01 (isolated, admin shell)\nTarget: C:\\inetpub\\wwwroot\\uploads\nIR share for output: C:\\ir\\   (writable)\nRule:   state-preserving commands only</div></div>", "scenarioShort": "Save the uploads DACL to the IR share — 03:00 limit", "question": "Type the command that <b>saves the current ACLs of C:\\inetpub\\wwwroot\\uploads to C:\\ir\\acl-uploads.txt</b>, then Run and Check.", "hint": "The constraint: nothing may change on that tree. icacls has a switch that only writes to a file.", "explain": "<p><span class='mono'>icacls C:\\inetpub\\wwwroot\\uploads /save C:\\ir\\acl-uploads.txt</span> — the tool, the target tree, the <b>/save</b> switch (writes every ACE to a file, changes nothing), the output path. This file is the pair to <span class='mono'>icacls /restore</span> — the only faithful record of the attacker-modified DACLs, admissible because it was captured before remediation. The near-miss commands are the destructive ones remediation is about to run anyway: <span class='mono'>/reset</span> discards the evidence, <span class='mono'>/remove</span> and <span class='mono'>/deny</span> edit the record. The clock existed because the reset job starts in minutes — evidence first, always.</p>", "study": "the icacls /save and /restore evidence pair, and why ACL snapshots precede every remediation.", "data": {"timerSec": 180, "title": "simulated admin shell — evidence window open", "banner": ["FS-EAST-01 — isolated", "IR evidence window: ACL snapshot before remediation reset", "Per-exercise limit: 03:00 (simulated pressure)"], "prompt": "C:\\ir>", "okRe": "^icacls.*/save", "notFound": "icacls expects arguments — for this task: icacls <path> /save <file>", "output": ["Saved 14 ACL entries to C:\\ir\\acl-uploads.txt (tree: C:\\inetpub\\wwwroot\\uploads)"], "dangerRe": "(/reset|/remove|/deny|/grant|takeown)|^(del|erase|rd) ", "dangerOut": ["[!] STATE CHANGE on the evidence tree — that switch edits or destroys the ACL record."], "required": [{"re": "^icacls", "label": "the icacls tool", "why": "icacls is the ACL read/write/save tool on Windows.", "match": "icacls C:\\inetpub\\wwwroot\\uploads /save C:\\ir\\acl-uploads.txt"}, {"re": "/save", "label": "the /save switch", "why": "/save writes the DACLs to a file without changing state.", "match": "icacls ... /save ..."}, {"re": "inetpub\\\\wwwroot\\\\uploads|inetpub/wwwroot/uploads", "label": "the source tree", "why": "The snapshot must cover the uploads tree.", "match": "icacls C:\\inetpub\\wwwroot\\uploads ..."}, {"re": "c:\\\\ir\\\\|c:/ir/", "label": "the IR output path", "why": "Evidence must land on the IR share.", "match": "/save C:\\ir\\acl-uploads.txt"}], "forbidden": [{"re": "/reset", "label": "icacls /reset", "why": "Rebuilding the ACL destroys the attacker's DACL evidence."}, {"re": "/remove", "label": "icacls /remove", "why": "Stripping ACEs edits the record you must preserve."}, {"re": "takeown", "label": "takeown", "why": "Changing ownership mutates the ACL metadata you are documenting."}], "canonical": "icacls C:\\inetpub\\wwwroot\\uploads /save C:\\ir\\acl-uploads.txt", "dangerWhy": "reset, remove or ownership changes on this tree would erase the very evidence the report depends on"}}, {"id": "x03", "type": "branch", "reviewLabel": "Branching: the fleet, the CI noise and the three blind hosts", "scenario": "<p>Cloud Linux fleet, 60 hosts. Something ran <span class='mono'>chattr +i /etc/ld.so.preload</span> on APP-31 at 03:58. You have four facts and three blind spots:</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — what you know</span><div class='artbody'>K1  CI/CD legitimately runs 'chattr -i /etc/ld.so.preload' during deploys (18:00-19:30 window)\nK2  APP-31's chattr +i ran at 03:58, parent /tmp/.sysupdater (unsigned, 2 days old)\nK3  APP-31 has been re-imaged twice this quarter for unrelated drift\nK4  Three hosts (APP-44, APP-45, APP-46) have no EDR and no auditd\n\nK5  Fleet-wide cost: full re-image = ~6 h engineering + downtime per host</div></div>", "scenarioShort": "Fleet chattr signal with CI noise and blind hosts", "question": "Four decisions across the chain.", "hint": "The CI job runs -i in its window. The host ran +i at 03:58 from a tmp updater. Both facts survive; so do the blind spots.", "explain": "<p><b>1 — interpretation:</b> the CI job is <span class='mono'>-i</span> (unlock) <i>in</i> its window; APP-31 ran <span class='mono'>+i</span> (lock) <i>outside</i> it from an unsigned tmp updater — the direction, time and parent all disagree with the benign story. <b>2 — containment:</b> isolate APP-31 only; a fleet re-image punishes 59 healthy hosts and 6 hours of downtime on K5's numbers. <b>3 — the blind hosts:</b> with no EDR and no auditd you cannot confirm or clear them — so run <span class='mono'>lsattr /etc/ld.so.preload</span>-class read-only checks and temporary auditd rules, and say plainly that coverage is partial. <b>4 — reporting:</b> state the confidence and the gaps; claiming the CI explanation (wrong direction), declaring the fleet clean (three blind hosts), or writing &ldquo;TeamTNT confirmed&rdquo; (worm-like, not proven) each bury uncertainty the board is entitled to see.</p>", "study": "separating legitimate CI chattr from attacker chattr, and reporting blind spots honestly.", "data": {"steps": [{"q": "1 — How do you read the APP-31 signal against the CI baseline?", "options": [{"t": "Suspect — the CI job unlocks in its window; this locked from a tmp updater outside it", "correct": true, "why": "Direction (+i vs -i), time (03:58) and parent (unsigned tmp) all contradict the CI story."}, {"t": "Benign — the CI pipeline explains any chattr on this path", "why": "The CI job runs -i in a window — it explains neither +i nor 03:58."}, {"t": "Unknowable without more artefacts", "why": "Three independent signals already disagree with the benign story."}, {"t": "Benign — the host was re-imaged recently", "why": "Re-imaging history does not create a chattr parent in /tmp."}]}, {"q": "2 — Immediate containment, given the 6-hour fleet cost figure?", "options": [{"t": "Isolate APP-31 only; keep the fleet serving", "correct": true, "why": "One compromised host with a tmp updater; fleet-wide action is not yet supported."}, {"t": "Re-image the entire fleet tonight", "why": "Six engineering hours and per-host downtime on 59 healthy hosts — unsupported."}, {"t": "Wait for the attacker to spread before acting", "why": "A locked ld.so.preload is already persistence — waiting is not neutral."}, {"t": "Delete /etc/ld.so.preload on APP-31", "why": "That is attacker-cleanup behaviour: evidence loss, and chattr +i blocks it anyway."}]}, {"q": "3 — The three blind hosts (no EDR, no auditd). Best next move?", "options": [{"t": "Run read-only checks (lsattr on the preload path, cron listings) and deploy temporary auditd rules", "correct": true, "why": "Lightweight, state-preserving scope-out of the blind spot — the only honest way to shrink it."}, {"t": "Assume they are clean because CI runs everywhere", "why": "The CI story failed on APP-31; assuming it holds on unseen hosts is a guess."}, {"t": "Full EDR rollout to all 60 hosts before anything else", "why": "Right long-term, wrong now — it stalls containment for days."}, {"t": "Nothing — blind hosts cannot produce evidence", "why": "Blind means fewer signals, not zero — lsattr and auditd still work."}]}, {"q": "4 — The CISO's report line on this incident. Best phrasing?", "options": [{"t": "One confirmed host, worm-like tooling; three hosts unverifiable — partial coverage stated plainly", "correct": true, "why": "States the finding, the confidence and the gap — decisions stay possible."}, {"t": "CI/CD misconfiguration on one host, fleet clean", "why": "Hides the contradiction and the three blind hosts."}, {"t": "TeamTNT confirmed in the environment", "why": "Tooling is TeamTNT-like, but attribution is not proven — overclaiming."}, {"t": "No action taken pending further analysis", "why": "False: containment happened, and the line hides it."}]}]}}, {"id": "x04", "type": "multi", "reviewLabel": "Select the strongest defender-denial evidence", "scenario": "<p>The report's key claim: on DC-03, T1222 was used <b>to deny defenders access</b> to attacker infrastructure — not merely for staging. Select the findings that actually support <i>that</i> claim.</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — findings, DC-03</span><div class='artbody'>G1  Explicit Deny ACE for Everyone on C:\\Windows\\System32\\Tasks\\TaskSync\nG2  Owner of Tasks\\TaskSync changed from SYSTEM to svc-tsksync (unknown account)\nG3  chattr +i on /etc/sudoers on a Linux member server\nG4  Notepad.exe opened report.docx in D:\\Temp\nG5  40 files compressed to archive.zip in D:\\Temp</div></div>", "scenarioShort": "Which findings prove defender-denial?", "question": "Select <b>all</b> findings that support the defender-denial claim.", "hint": "The claim is about access being taken away from defenders — Deny entries, ownership moves, and immutability locks.", "explain": "<p><b>G1</b> — an explicit Deny for <i>Everyone</i> on the task file means even administrators fail to open or remove it: the definition of defender-denial. <b>G2</b> — ownership moved off SYSTEM to an unknown account: whoever owns the file controls its future ACLs. <b>G3</b> — the immutable flag freezes the loader-preload path against cleanup: the Linux twin of the same goal. G4 (Notepad) and G5 (archive) are staging/collection noise with no access-denial meaning. Precision keeps the report's ATT&amp;CK mapping (T1222) honest and defensible.</p>", "study": "Deny ACEs, ownership moves and immutable flags as the three faces of access denial.", "data": {"options": [{"t": "G1 — explicit Deny for Everyone on the task file", "correct": true, "why": "Blocks every account, admins included, from the artefact."}, {"t": "G2 — ownership moved from SYSTEM to an unknown account", "correct": true, "why": "The new owner controls all future permission changes."}, {"t": "G3 — chattr +i freezing a cleanup-critical path", "correct": true, "why": "Immutable means cleanup fails until the flag is removed."}, {"t": "G4 — Notepad opened a document", "why": "A read action — no access was denied to anyone."}, {"t": "G5 — files compressed into an archive", "why": "That is collection/staging behaviour, not access denial."}]}}, {"id": "x05", "type": "drag", "reviewLabel": "Prioritise the mixed T1222 queue", "scenario": "<p>Your queue, four hours left in the shift, two analysts. Rank the five alerts by what they cost the business if they sit unworked — drag each to its work window.</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — the queue</span><div class='artbody'>Q1  chattr +i /etc/rc.local, root, parent in /var/tmp (unsigned)\nQ2  icacls /deny on a registered task file under System32\\Tasks + task registered\nQ3  chmod 755 /opt/app/release.sh by CI in the deploy window (ticketed)\nQ4  attrib +s +h on new exe in C:\\ProgramData, svc-print, 01:26, no window\nQ5  takeown by unknown admin on the backup software's config DB, FS-EDGE-02</div></div>", "scenarioShort": "Queue: what works now, this shift, backlog", "question": "Drag each alert to its correct work window.", "hint": "Loader-preload locks and locked scheduled tasks are already persistence. Ticketed CI in-window is not an incident.", "explain": "<p><b>Act now:</b> Q1 (a frozen boot script = active persistence on the host) and Q2 (a locked, registered task on a Windows box — persistence protected by a Deny ACE). <b>This shift:</b> Q5 (ownership grab on the backup software's config DB — serious, but the host and account need one verification pass) and Q4 (hidden+system flags on a new exe — suspicious staging, worth a scoped hunt before the shift ends). <b>Backlog:</b> Q3 — ticketed CI in its window with expected modes; file it against the baseline. Priority is damage-if-ignored, not alert severity labels.</p>", "study": "prioritising T1222 alerts by persistence potential and cost of delay.", "data": {"slots": [{"id": "now", "label": "Act now"}, {"id": "shift", "label": "This shift"}, {"id": "back", "label": "Backlog"}], "items": [{"id": "q1", "t": "Q1 — chattr +i on /etc/rc.local from /var/tmp"}, {"id": "q2", "t": "Q2 — Deny ACE on a registered task file"}, {"id": "q3", "t": "Q3 — ticketed CI chmod 755 in window"}, {"id": "q4", "t": "Q4 — attrib +s +h on new ProgramData exe, 01:26"}, {"id": "q5", "t": "Q5 — takeown on backup config DB, unknown admin"}], "correct": {"q1": "now", "q2": "now", "q3": "back", "q4": "shift", "q5": "shift"}, "why": {"q1": "Active persistence via a boot script — immediate containment.", "q2": "A locked, registered task is protected persistence — immediate.", "q3": "Ticketed, in-window, expected modes — baseline backlog.", "q4": "Suspicious staging — scoped hunt this shift.", "q5": "Serious, but needs a verification pass before escalation — this shift."}}}, {"id": "x06", "type": "qcm", "reviewLabel": "When the best practice is the wrong answer", "scenario": "<p>The canary host <b>CAN-07</b> — deliberately exposed, instrumented, feeding your detection programme — lights up: <span class='mono'>chattr -iae</span> on rival miner binaries, mass <span class='mono'>chmod 777 /tmp</span>, an xmrig download from a paste site. The playbook — and half the internet — says: commodity worm, <b>reimage immediately</b>. Your threat-intel lead is in the room.</p>", "scenarioShort": "Commodity worm on the canary — reimage?", "question": "What is the correct call <i>in this context</i>?", "hint": "The constraint you may have missed: this host exists to be compromised. What is its job?", "explain": "<p>For a production host, reimage-now is correct and uncontroversial. CAN-07 is not a production host: it is <b>sensor infrastructure</b>, and its entire value is the live attacker. Wiping it on first contact destroys the TTP collection it was built for — the &ldquo;widely used best practice&rdquo; fails precisely because the context differs. Correct: keep observing within pre-agreed guardrails, snapshot the artefacts (the chattr lifecycle, the 777 sweep, the miner fetch), hand TTPs to intel and detection engineering, and reimage when collection saturates. A guardrail question to ask in the room: what would the worm have to touch for you to end collection instantly?</p>", "study": "canary/honeypot handling: when standard containment guidance is deliberately overridden.", "data": {"options": [{"t": "Keep observing within guardrails, snapshot artefacts, feed intel — reimage later", "correct": true, "why": "The canary's purpose is collection; context overrides the reimage habit."}, {"t": "Reimage immediately — it is the industry standard for commodity worms", "why": "Standard for production hosts; it destroys the sensor's whole purpose here."}, {"t": "Power off the host to preserve the disk", "why": "Kills the live collection and the attacker session — the sensor earns nothing offline."}, {"t": "Delete the miner and let the worm return", "why": "Tipping the attacker off changes their tooling mid-collection."}]}}, {"id": "x07", "type": "match", "reviewLabel": "Discriminate: T1222 or its noisy neighbours", "scenario": "<p>The executive summary mislabels everything as &ldquo;ransomware prep&rdquo;. You have five artefacts and must give each its correct ATT&amp;CK technique — T1222 included, but not alone.</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — artefact set, mixed hosts</span><div class='artbody'>R1  attrib +h payload.exe            (Windows)\nR2  chmod 777 /opt/data              (Linux)\nR3  vssadmin.exe delete shadows /all (Windows)\nR4  spoolsv.exe found running from C:\\Temp (Windows)\nR5  reg add HKLM\\...\\Run /v updt /d C:\\Temp\\s.exe (Windows)</div></div>", "scenarioShort": "Five artefacts, five techniques", "question": "For each artefact, choose the correct technique.", "hint": "One is recovery inhibition, one is masquerading by name, one is Run-key persistence; two belong to T1222.", "explain": "<p><b>R1</b> — the hidden attribute on Windows: <b>T1222.001</b>. <b>R2</b> — chmod on Linux: <b>T1222.002</b>. <b>R3</b> — shadow-copy deletion is <b>T1490 Inhibit System Recovery</b>: related to ransomware, but no permission is modified. <b>R4</b> — a binary named like a Windows service running from Temp is <b>T1036 Masquerading</b> (match by name). <b>R5</b> — a Run key is <b>T1547.001 Boot or Logon Autostart Execution</b>. The executive summary becomes defensible only when each row carries its own technique ID.</p>", "study": "T1490, T1036 and T1547.001 next to T1222 — the neighbours that swallow mislabelled reports.", "data": {"left": [{"t": "R1 — attrib +h payload.exe", "r": 0, "why": "Hidden attribute on Windows — T1222.001."}, {"t": "R2 — chmod 777 /opt/data", "r": 1, "why": "chmod on Linux — T1222.002."}, {"t": "R3 — vssadmin delete shadows /all", "r": 2, "why": "Recovery inhibition — T1490, not T1222."}, {"t": "R4 — spoolsv.exe running from C:\\Temp", "r": 3, "why": "Name masquerading from a temp path — T1036."}, {"t": "R5 — reg add ...Run key", "r": 4, "why": "Run-key autostart — T1547.001."}], "right": ["T1222.001 — Windows File and Directory Permissions Modification", "T1222.002 — Linux and Mac File and Directory Permissions Modification", "T1490 — Inhibit System Recovery", "T1036 — Masquerading (match by name)", "T1547.001 — Boot or Logon Autostart (Run key)"]}}, {"id": "x08", "type": "qcm", "reviewLabel": "Two signals disagree — which wins?", "scenario": "<p>Signal A: EDR alert — &ldquo;icacls /grant observed on FS-BACKUP-02&rdquo; (medium severity). Signal B: the full context —</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — context pull</span><div class='artbody'>4670 DACL change: 22:03, account CORP\\svc-backup\nCmdline: icacls E:\\BackupShadow /grant CORP\\svc-backup:(F)\nChange window: daily 22:00-23:30 (documented, ticketed CHG002981)\nAccount purpose: backup service, documented to re-grant itself rights on restore\nSame pattern daily for 14 months</div></div>", "scenarioShort": "EDR alert vs 14 months of context", "question": "Which signal wins, and why?", "hint": "One signal is the tool firing; the other is fourteen months of the same tool doing its documented job in its documented window.", "explain": "<p><b>Context wins — but only because it is specific.</b> The account exists precisely to do this, in a documented window, on documented paths, ticketed, unchanged for 14 months. A generic &ldquo;icacls alert&rdquo; is the weakest form of evidence; a fourteen-month baseline for one account on one path is the strongest form of benign context. The honest caveat: the baseline argument dies the day the path, window or account drifts — which is why the tuned rule keeps firing on drift instead of silencing icacls everywhere. Suppressing the tool globally (a common habit) is how real grants go unseen.</p>", "study": "context-shaped baselines vs tool-shaped alerts — and keeping drift-detection when you suppress.", "data": {"options": [{"t": "Context wins — account, window, path and 14-month history all match the documented job", "correct": true, "why": "Specific, ticketed, long-lived context beats a generic tool alert — keep drift detection."}, {"t": "The EDR alert wins — icacls /grant is always an incident", "why": "Every backup restore in the company would then be an incident; the alert carries no context."}, {"t": "Neither — require the CISO to decide", "why": "The evidence is sufficient and specific; escalation on settled baselines wastes the bridge."}, {"t": "Suppress all icacls alerting on this host permanently", "why": "Global suppression removes the drift signal — the path/window/account change would go unseen."}]}}, {"id": "x09", "type": "multi", "reviewLabel": "Compensating controls where Sysmon is absent", "scenario": "<p>Twelve legacy hosts cannot run Sysmon or the EDR agent (OS too old). The audit committee wants to know what <b>still</b> closes the T1222 visibility gap on those hosts. The candidate list:</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — candidates</span><div class='artbody'>P1  auditd execve rules on chmod / chattr / chown\nP2  Windows SACL + Security Event 4670 collection (DACL/owner changes)\nP3  Central shipping of auth logs and process accounting (psacct/audit)\nP4  Weekly reminders to admins to be careful\nP5  Blocking port 445 fleet-wide as the fix</div></div>", "scenarioShort": "What still covers the blind hosts?", "question": "Select <b>all</b> candidates that genuinely close (part of) the gap.", "hint": "You need telemetry that exists on old OSes and a path into your SIEM. Two candidates are theatre.", "explain": "<p><b>P1</b> — auditd runs everywhere Linux does and execve rules on the permission tools give you command-line parity with Sysmon. <b>P2</b> — 4670 needs only Security auditing plus a SACL, no Sysmon; it covers DACL and owner changes directly. <b>P3</b> — process accounting and auth logs are ancient, robust and shippable: weaker than EDR, honest coverage. <b>P4</b> is theatre — awareness is not telemetry. <b>P5</b> is a network change masquerading as a file-integrity control: it breaks SMB estate-wide, closes none of the visibility gap, and belongs to a different risk conversation.</p>", "study": "auditd execve rules, SACL/4670 and process accounting as compensating T1222 telemetry.", "data": {"options": [{"t": "P1 — auditd execve rules on the permission tools", "correct": true, "why": "Command-line visibility on any Linux host, old or new."}, {"t": "P2 — SACLs plus Security Event 4670", "correct": true, "why": "Native Windows auditing covers DACL/owner changes without Sysmon."}, {"t": "P3 — central auth + process accounting logs", "correct": true, "why": "Old, robust telemetry that still shows who ran what."}, {"t": "P4 — weekly admin awareness reminders", "why": "No telemetry, no coverage — it is not a control."}, {"t": "P5 — blocking port 445 fleet-wide", "why": "A network change that breaks SMB and adds no file-permission visibility."}]}}, {"id": "x10", "type": "order", "reviewLabel": "Order the senior IR sequence with cost trade-offs", "scenario": "<p>WEB-09, active operator, locked artefacts everywhere: Deny ACEs on task files, <span class='mono'>+i</span> on two binaries, owners moved. The CFO is on the bridge. Order the five moves so evidence survives, containment holds and the business comes back fastest <i>after</i> the risk is gone.</p>", "scenarioShort": "Five moves: evidence, snapshot, unlock, clean, restore", "question": "Click the five moves in the correct order.", "hint": "What cannot be reconstructed later must be written down first; what must not be watched twice comes after the snapshot.", "explain": "<p>1) <b>Write down the volatile ACL/attribute state</b> — <span class='mono'>icacls /save</span> and lsattr output: once you unlock, the attacker's exact state is gone. 2) <b>Snapshot the volumes</b> — the immutable copy that survives even operator countermeasures. 3) <b>Contain</b> — isolate the host (the operator is active; every extra minute is their minute). 4) <b>Unlock and clean</b> — chattr -i, remove Deny ACEs, disable the tasks, remove the binaries. 5) <b>Restore from the saved state and monitor</b> — bring the business back with a tripwire on re-lock attempts. Reordering steps 3 and 1 is the classic senior mistake: containment first feels decisive and erases the record.</p>", "study": "the evidence &rarr; snapshot &rarr; contain &rarr; clean &rarr; restore sequence for locked-artefact incidents.", "data": {"items": [{"t": "Capture ACL/attribute state (icacls /save, lsattr) to the IR share", "why": "Volatile and unique — the attacker's exact state must be recorded first."}, {"t": "Snapshot the affected volumes", "why": "The immutable copy that survives everything that follows."}, {"t": "Isolate the host from the network", "why": "The operator is active — containment comes before any repair."}, {"t": "Unlock and clean: chattr -i, remove Deny ACEs, disable tasks, remove binaries", "why": "Only now is it safe to touch the attacker's locks."}, {"t": "Restore from saved state and monitor for re-lock attempts", "why": "Business back, with a tripwire on the attacker's return move."}]}}, {"id": "x11", "type": "qcm", "reviewLabel": "The restoration decision with a price tag", "scenario": "<p>FILE-09, operator believed active (a new icacls run 20 minutes ago). The operator ran <span class='mono'>chmod 000</span> on ~40 production configuration files. Restoring them takes 30 minutes of downtime; the business is mid-morning peak. The room wants to &ldquo;just restore while we watch&rdquo;.</p>", "scenarioShort": "Restore now-and-live, or contain first?", "question": "What do you recommend, and what cost do you accept?", "hint": "One option spends downtime to stop an active operator; the other spends uptime and keeps the operator in the room.", "explain": "<p>The common habit — restore while live &ldquo;and watch&rdquo; — is the wrong trade here: an <b>active operator</b> plus <b>restoration traffic</b> plus <b>watching</b> is how the same files get re-locked mid-restore and the operator learns your response pattern. Isolate first: 30 minutes of accepted, bounded downtime buys you an operator with no eyes on your recovery, then restore and bring the service back with monitoring on every icacls/chmod path. The decision to <i>accept</i> the downtime is the senior part — the CISO needs you to name the cost, not hide it. Pure waiting and hoping the operator leaves are the only options that spend more than 30 minutes.</p>", "study": "containment-before-restoration on active intrusions, and naming the accepted cost out loud.", "data": {"options": [{"t": "Isolate first, accept ~30 min downtime, then restore with monitoring", "correct": true, "why": "An active operator gets cut off before restoration traffic starts; the cost is named and bounded."}, {"t": "Restore live while watching the operator", "why": "Re-locks mid-restore and teaches the operator your response pattern."}, {"t": "Wait for the operator to finish and leave", "why": "Their finishing means the configs may never come back."}, {"t": "Push restoration to the weekend window", "why": "40 locked production configs across peak traffic is an unacceptable standing outage."}]}}, {"id": "x12", "type": "fill", "reviewLabel": "Complete the executive briefing line", "scenario": "<p>The board deck's technical appendix, final line. Keep the IDs exact — the CISO's chief of staff reads them literally.</p><div class='artefact'><span class='artlabel'>Briefing appendix, final line</span><div class='artbody'>Adversary used {{0}} on Linux to freeze persistence paths and\n{{1}} on Windows to hide the stage-2 binary — both are\nMITRE ATT&CK T1222; primary mitigations: {{2}}.</div></div>", "scenarioShort": "Fill the two behaviours and the mitigation pair", "question": "Pick the correct item for each blank.", "hint": "One blank freezes files on Linux, one hides files on Windows, one is the two-ID mitigation pair from the T1222 page.", "explain": "<p><b>chattr +i</b> freezes files on Linux (the immutable flag). <b>attrib +h</b> hides files on Windows. The T1222 page names exactly two mitigations: <b>M1022</b> (Restrict File and Directory Permissions) and <b>M1026</b> (Privileged Account Management) — M1041 does not exist as a permission control, chmod 000 and icacls /save are behaviours and tools, not mitigations. Executives repeat what you write; the IDs must be the ones their teams can act on.</p>", "study": "the exact mitigation pair on the T1222 page, and the Windows/Linux tool split.", "data": {"template": "Adversary used {{0}} on Linux to freeze persistence paths and\n{{1}} on Windows to hide the stage-2 binary — both are\nMITRE ATT&CK T1222; primary mitigations: {{2}}.", "blanks": [{"correct": "chattr +i", "why": "The immutable flag is the Linux freeze mechanism."}, {"correct": "attrib +h", "why": "attrib +h sets the Windows hidden attribute."}, {"correct": "M1022 & M1026", "why": "The two mitigations named on the T1222 page."}], "bank": ["chattr +i", "attrib +h", "M1022 & M1026", "chmod 000", "icacls /save", "M1041", "vssadmin"]}}, {"id": "x13", "type": "qcm", "reviewLabel": "Attribution under ambiguity", "scenario": "<p>The artefacts: <span class='mono'>chattr -iae /root/.ssh/authorised_keys*</span>, mass <span class='mono'>chmod 777 /tmp</span>, an xmrig binary fetched from a paste-site mirror, root via a Docker daemon exposed on 2375. The CISO asks: &ldquo;is this TeamTNT? An APT? Who do I blame?&rdquo;</p>", "scenarioShort": "Who do you name — and with what confidence?", "question": "Which attribution statement is defensible?", "hint": "Match the tooling to the well-known playbook — then say what the evidence cannot prove.", "explain": "<p>The tooling is <b>TeamTNT-style commodity worm</b> behaviour — the chattr clearing of SSH key material, the 777 sweep, the cryptominer, the exposed-Docker initial access. Naming TeamTNT itself still overreaches: tooling similarity shows <i>family</i>, not <i>group identity</i>, and commodity kits are shared and copied constantly. What is defensible: &ldquo;consistent with a TeamTNT-class cloud worm; high confidence in the family, no confidence in a specific operator; motive assessed as cryptomining.&rdquo; An APT narrative has no supporting artefact here — no targeted tooling, no lateral objectives, no sector-specific interest.</p>", "study": "hedged attribution language: family-level confidence vs operator identity.", "data": {"options": [{"t": "TeamTNT-class cloud worm, high confidence in the family; operator unproven; motive: cryptomining", "correct": true, "why": "Matches the documented kit class while saying honestly what the evidence cannot prove."}, {"t": "TeamTNT confirmed — file the report under G0139", "why": "Kit similarity is not operator identity; commodity kits get copied."}, {"t": "State-sponsored APT — the persistence discipline proves it", "why": "Nothing targeted exists in the artefacts; discipline is kit behaviour."}, {"t": "No attribution possible — write nothing at all", "why": "Family-level attribution with stated confidence is possible and useful."}]}}, {"id": "x14", "type": "multi", "reviewLabel": "What the post-incident report must contain", "scenario": "<p>The ACL-backdoor incident is closing. Legal and the audit committee will read the report. Select every section that <b>must</b> be in it.</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — report scope, incident IR-2291</span><div class='artbody'>Affected: 3 hosts, DACLs modified, 2 Deny ACEs, 1 immutable lock, 1 owner move\nEvidence held: icacls /save output, lsattr output, snapshot set\nOpen questions: initial access vector unconfirmed on 1 host</div></div>", "scenarioShort": "Report contents for the ACL-backdoor incident", "question": "Select <b>all</b> sections that must appear in the report.", "hint": "The report must let an auditor reconstruct what changed, who changed it, and what you still do not know.", "explain": "<p><b>Affected paths with ACL diffs</b> — the <span class='mono'>/save</span> output before/after is the reconstructable core. <b>Accounts used</b> — every permission change is tied to an identity; the audit committee needs the list. <b>Uncertainty and open questions</b> — the unconfirmed initial-access host goes in writing; hiding it converts an honest gap into a future finding. Full disk images of every endpoint is not realistic scope for 3 hosts with targeted evidence; a confirmed attacker <i>motive</i> is exactly the thing evidence usually cannot deliver — assessed motive, labelled as assessment, can appear, &ldquo;confirmed&rdquo; cannot.</p>", "study": "post-incident reporting standards: diffs, accounts, and explicit uncertainty sections.", "data": {"options": [{"t": "Affected paths with before/after ACL diffs (icacls /save output)", "correct": true, "why": "The reconstructable core of any permission incident."}, {"t": "The accounts used for every permission change", "correct": true, "why": "Each change maps to an identity — the auditors' first question."}, {"t": "An explicit uncertainty section (unconfirmed initial access on one host)", "correct": true, "why": "Honest gaps in writing beat quiet gaps in practice."}, {"t": "Full disk images of every endpoint in the company", "why": "Untargeted scope — the evidence set already answers the questions."}, {"t": "The attacker's motive, stated as confirmed fact", "why": "Motive is assessed, not confirmed — certainty must not be manufactured."}]}}, {"id": "x15", "type": "drag", "reviewLabel": "Map the five controls to the gap each closes", "scenario": "<p>Programme review after IR-2291. Five controls are on the table; the committee wants each mapped to the gap it actually closes: preventing the permission change, seeing it, or recovering from it.</p><div class='artefact'><span class='artlabel'>ARTEFACT 1 — control list</span><div class='artbody'>C1  M1022 — restrictive default ACLs on shares and web roots\nC2  M1026 — shrink and monitor privileged accounts\nC3  Command-line monitoring of icacls/chmod/chattr (Sysmon/auditd)\nC4  Security Event 4670 collection with SACLs\nC5  icacls /restore from saved baselines after an incident</div></div>", "scenarioShort": "Controls: prevent, see, or recover", "question": "Drag each control onto the gap it closes.", "hint": "Two stop the change, two show it, one puts it back.", "explain": "<p><b>Prevent:</b> M1022 (tight defaults leave nothing to widen) and M1026 (fewer privileged identities can change ACLs at all). <b>See:</b> command-line monitoring (the tools announcing themselves) and 4670 collection (the ACL changing, whatever tool did it). <b>Recover:</b> <span class='mono'>icacls /restore</span> from saved baselines — the control that turns a week of manual ACL archaeology into an afternoon. A programme with only &ldquo;see&rdquo; controls detects fast and heals slowly; with only &ldquo;prevent&rdquo;, the first gap is invisible.</p>", "study": "balancing prevention, detection and recovery controls for T1222 across the programme.", "data": {"slots": [{"id": "pre", "label": "Prevent the change"}, {"id": "see", "label": "See the change"}, {"id": "rec", "label": "Recover from it"}], "items": [{"id": "c1", "t": "C1 — M1022 restrictive default ACLs"}, {"id": "c2", "t": "C2 — M1026 privileged account control"}, {"id": "c3", "t": "C3 — command-line monitoring of permission tools"}, {"id": "c4", "t": "C4 — Event 4670 collection"}, {"id": "c5", "t": "C5 — icacls /restore from baselines"}], "correct": {"c1": "pre", "c2": "pre", "c3": "see", "c4": "see", "c5": "rec"}, "why": {"c1": "Tight defaults remove the opportunity — prevention.", "c2": "Fewer privileged identities means fewer possible changes — prevention.", "c3": "The tools announce themselves in command telemetry — detection.", "c4": "Native auditing records every DACL/owner change — detection.", "c5": "Restoring known-good ACLs is the recovery mechanism."}}}, {"id": "x16", "type": "qcm", "reviewLabel": "Incomplete information: the two takeown events", "scenario": "<p>17:52. Windows Security log (only) shows <span class='mono'>takeown</span> by account <b>CORP\\t.reed</b> on 2 of 300 workstations, 16:10 and 16:31. No EDR on those hosts. SCCM shows t.reed as a field technician. No ticket. Nothing else in the central logs. The duty manager wants: incident, or not?</p>", "scenarioShort": "Two takeown events, no EDR, no ticket — declare?", "question": "What is the correct call with the information you have?", "hint": "Weigh what the two facts could each mean — and note exactly what you cannot see.", "explain": "<p>You have two facts that fit <b>both</b> worlds: a technician doing unlogged repairs (plausible — no ticket is a paperwork sin, not proof of malice), or someone abusing stolen technician credentials (equally consistent — takeown is exactly what an attacker runs before locking files). With no EDR and no command lines, you cannot separate them — and that is the point of the answer: <b>scope with read-only checks and escalate</b>. Call t.reed (60 seconds ends or confirms the benign branch), pull local Security logs from both hosts, lsattr-equivalent checks on the touched paths. Declaring a 300-host incident on two context-free events burns the bridge's credibility; closing as &ldquo;technician habit&rdquo; on an unverified story is how real deployments start. &ldquo;Not yet — and here is exactly what would change my mind&rdquo; is a decision, not a delay.</p>", "study": "decision-making under incomplete telemetry: read-only scoping, escalation thresholds, and naming your trigger conditions.", "data": {"options": [{"t": "Do not declare yet — read-only scoping (call t.reed, pull local logs), escalate if checks fail", "correct": true, "why": "Both stories fit the two facts; 60 seconds of verification separates them without burning credibility."}, {"t": "Declare a 300-host incident now", "why": "Two context-free events do not carry that cost — and one phone call might end it."}, {"t": "Close as technician habit, no further checks", "why": "The abuse story fits equally well — closing on an unverified narrative is how real intrusions start."}, {"t": "Reset the ACLs on both workstations as a precaution", "why": "A state change on your only evidence, on a guess, before a phone call."}]}}];
/* ============ T1222 exam engine — vanilla JS, self-contained ============ */
(function(){
'use strict';
/* ---------- tiny dom helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pad(n){return (n<10?'0':'')+n;}
function mmss(s){s=Math.max(0,s|0);return pad(Math.floor(s/60))+':'+pad(s%60);}
function score(H,W,N){return Math.max(0,(H-W)/N);}
function lockArea(root){var ns=root.querySelectorAll('button,select,input');for(var i=0;i<ns.length;i++){ns[i].disabled=true;}var os=root.querySelectorAll('.opt,.chipitem');for(var k=0;k<os.length;k++){os[k].classList.add('lock');}}

/* ---------- global state ---------- */
var S={};
function freshState(){
  return {phase:'intro',order:[],pos:0,seen:0,cur:null,curEx:null,rec:{},skipped:[],creditSum:0,answered:0,
    tState:'IDLE',remaining:0,tickId:null,manualTotal:0,autoTotal:0,stateSince:0,beforeManual:null,
    fromReview:false,reported:false,user:null,country:null,locale:null,perLimit:0,perLeft:0,checked:false,stepIdx:0,stepAns:null,picked:null,
    stageMode:'intro',pausedStage:null,lastResult:null};
}
/* ---------- timer state machine: RUNNING / PAUSED_MANUAL / PAUSED_AUTO_CHECK / ENDED ---------- */
function tSetState(st){
  var now=Date.now();
  if(S.tState==='PAUSED_MANUAL'){S.manualTotal+=Math.round((now-S.stateSince)/1000);}
  if(S.tState==='PAUSED_AUTO_CHECK'){S.autoTotal+=Math.round((now-S.stateSince)/1000);}
  S.tState=st;S.stateSince=now;updateHeader();
}
function tStart(){if(S.tickId)clearInterval(S.tickId);S.tickId=setInterval(tick,1000);}
function tick(){
  if(S.tState!=='RUNNING')return;
  S.remaining--;
  if(S.perLimit>0&&S.perLeft>0){S.perLeft--;var pl=$('#perclock');if(pl)pl.textContent=mmss(S.perLeft);
    if(S.perLeft<=0){doCheck(true);return;}}
  if(S.remaining<=0){S.remaining=0;updateHeader();timeUp();return;}
  updateHeader();
}
function timeUp(){tSetState('ENDED');if(S.tickId){clearInterval(S.tickId);S.tickId=null;}showResults();}
/* ---------- header ---------- */
function stateChip(){
  if(S.tState==='RUNNING')return '<span class="badge st-run" aria-label="Timer running">&#9654; RUNNING</span>';
  if(S.tState==='PAUSED_MANUAL')return '<span class="badge st-paused" aria-label="Timer paused manually">&#9208; PAUSED &mdash; manual (press Resume)</span>';
  if(S.tState==='PAUSED_AUTO_CHECK')return '<span class="badge st-paused" aria-label="Timer paused for feedback review">&#9208; PAUSED &mdash; reviewing feedback (resumes on Next)</span>';
  return '<span class="badge st-ended" aria-label="Timer ended">&#9209; ENDED</span>';
}
function updateHeader(){
  var t=$('#tval');if(t)t.textContent=mmss(S.remaining);
  var st=$('#tstate');if(st)st.innerHTML=stateChip();
  var sc=$('#scoreval');if(sc){var pct=S.answered>0?Math.round(S.creditSum/S.answered*100):0;
    sc.innerHTML='<b>'+S.creditSum.toFixed(1)+' / '+S.answered+'</b>&nbsp;('+pct+'%)';}
  var cnt=$('#counter');if(cnt){
    if(S.phase==='exam')cnt.textContent='Exercise '+S.seen+' of '+META.questionCount;
    else if(S.phase==='review')cnt.textContent='Review skipped — '+S.skipped.length+' left';
    else cnt.textContent=META.questionCount+' exercises';}
  var pb=$('#pbar');if(pb){var done=S.answered+S.skipped.length;var pct2=Math.min(100,Math.round(done/META.questionCount*100));
    pb.style.width=pct2+'%';pb.classList.add('sheen');}
}
function buildTopbar(){
  var tb=el('div','topbar');
  tb.innerHTML='<span class="tb-title">'+esc(META.objId)+' &middot; '+esc(META.objName)+'</span>'+
    '<span class="badge '+META.sevClass+'" aria-label="Severity '+esc(META.sevWord)+'"><span class="dot"></span>'+esc(META.sevWord)+'</span>'+
    '<span class="chip" id="counter">Exercise 1 of '+META.questionCount+'</span>'+
    '<span class="chip timerbox" aria-label="Time remaining">&#9201; <b id="tval">--:--</b></span>'+
    '<span id="tstate">'+stateChip()+'</span>'+
    '<span class="chip" aria-label="Live score">&#9878; <span id="scoreval"><b>0.0 / 0</b>&nbsp;(0%)</span></span>'+
    (S.user?'<span class="chip" aria-label="Learner">&#128100; '+esc(S.user)+'</span>':'')+
    '<button class="btn btn-ghost" id="btn-hint" title="Hint (costs 10% of this exercise credit)">&#128161; Hint</button>'+
    '<button class="btn btn-ghost" id="btn-pause" title="Manual pause">&#9208; Pause</button>'+
    '<button class="btn btn-ghost" id="btn-skip" title="Skip — comes back at the end">&#9888; Skip</button>';
  return tb;
}
function wireTopbar(){
  $('#btn-hint').onclick=doHint;$('#btn-pause').onclick=doPause;$('#btn-skip').onclick=doSkip;
  updateHintBtn();
}
function updateHintBtn(){
  var b=$('#btn-hint');if(!b)return;
  var r=S.rec[S.cur];
  if(!r||r.hintUsed||S.checked){b.disabled=true;return;}
  b.disabled=false;
}
/* ---------- intro ---------- */
function renderIntro(){
  S.phase='intro';document.title=META.pageTitle;
  var app=$('#app');app.innerHTML='';
  app.appendChild(buildIntroTop());
  var c1=el('div','card');
  c1.innerHTML='<div class="sechead"><span class="si">&#127919;</span>What you will learn here</div>'+INTRO.learn;
  app.appendChild(c1);
