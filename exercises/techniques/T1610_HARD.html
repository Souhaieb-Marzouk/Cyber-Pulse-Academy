var META={"topicId":"t1610","mitreId":"T1610","name":"Deploy Container","mitreName":"Deploy Container","objectType":"technique","title":"T1610 Deploy Container — HARD","difficulty":"hard","severity":"hard","severityLabel":"HARD","batch":3,"questionCount":15,"estimatedMinutes":24,"passMark":70,"protocol":"cpa-staged-v1"};
var INTRO={"learnHtml":"<p><b>Exam scope:</b> this exam teaches <b>T1610 — Deploy Container</b>, a <b>technique</b> of the MITRE ATT&amp;CK framework. <p><b>This is the HARD unit for T1610 — Deploy Container.<\/b> The EASY unit taught you what deploying a container means; the MEDIUM unit taught you to identify and decide. Here the signals <b>interact<\/b>: privilege settings meet workload identity, benign images meet runtime payloads, and the obvious answer is sometimes the wrong one.<\/p><p>You will reconstruct real procedures from ATT&amp;CK: <b>Peirates<\/b> deploying a pod that mounts the node root filesystem for a reverse shell, <b>TeamPCP<\/b> spreading privileged DaemonSets, <b>TeamTNT<\/b> seeding miners, <b>Salt Typhoon<\/b> enabling guestshell containers on network devices, and <b>Doki<\/b> / <b>Kinsing<\/b> running through deployed containers. Expect audit trails with noise, images that scan clean, and artefacts that look alarming while being innocent — and the reverse.<\/p><p>Rules of engagement: read every artefact before answering; at least one plausible shortcut leads somewhere wrong; when the least aggressive action is correct, resist the urge to delete everything. The deploy-versus-escape boundary matters: T1610 is the deployment; T1611 begins when they leave the container.<\/p>","themes":[{"name":"Deploying containers: paths and workload objects","concepts":["deploy a new container","Docker create/start API","DaemonSet spread"]},{"name":"Evasion by fresh deployment","concepts":["benign-image runtime payload","create → start → first-action correlation"]},{"name":"Privilege & escape precursors","concepts":["--privileged flag","hostPath mount","added capabilities (SYS_ADMIN)","escape to host precursor"]},{"name":"Detection, defense & response","concepts":["kube-audit create pod event","non-allow-listed image detection","admission controller","image scanning before deployment","workload identity (non-admin principal)","evidence preservation before containment"]},{"name":"Real-world operators","concepts":["Peirates node root filesystem pod","TeamPCP privileged DaemonSets","Cloud Stealer persistence pod","TeamTNT miner deployment","Salt Typhoon guestshell","Doki deployed container","Kinsing Ubuntu container"]}]};
var EXERCISES=[{"id":"EX-01","type":"qcm-single","summary":"Privileged DaemonSet at 02:00 — or just the backup?","concepts":["--privileged flag","DaemonSet spread"],"scenario":"<p>02:00, Northwind Traders SOC. Alert: a <b>privileged DaemonSet<\/b> deployed into <span class=\"mono\">kube-system<\/span>. Facts in the ticket:<\/p><ul><li>image <span class=\"mono\">registry[.]nw[.]example/nw-backup:2.4.1<\/span>, digest-pinned, on the allow-list<\/li><li>creator: <span class=\"mono\">system:serviceaccount:backup:backup-operator<\/span>, which deploys this exact workload every night<\/li><li>change CHG-2210 approves privileged mode for host-level backups; hostPath is scoped to <span class=\"mono\">/var/backups<\/span><\/li><li>no egress to non-corporate destinations since deploy<\/li><\/ul>","question":"<p>Why is this deployment most likely benign despite running privileged?<\/p>","options":["Privileged containers are never legitimate in a production cluster","The identity, image, change record and scoped mount all match the approved nightly backup pattern","DaemonSets cannot touch the host filesystem at all","The alert fired only because DaemonSets are rare"],"correct":1,"hint":"Correlate four independent confirmations before judging one alarming attribute.","explanation":"<p>Privilege alone is an alarm, not a verdict. Here the <b>workload identity<\/b> is the known backup operator, the image is digest-pinned and allow-listed, CHG-2210 documents the privileged requirement, the hostPath is <b>scoped<\/b> (not the node root), and egress is quiet. A privileged <b>DaemonSet<\/b> deployed this way is the normal shape of node-level backup agents.<\/p>","study":"Baseline privileged workloads by identity and change record, not by flag alone."},{"id":"EX-02","type":"line-select","summary":"Rogue deploy and its first action in a noisy audit trail","concepts":["kube-audit create pod event","non-allow-listed image detection","create → start → first-action correlation"],"scenario":"<p>Namespace <span class=\"mono\">build<\/span> runs many CI deploys nightly. One deploy is not like the others. The firewall feed is merged into the same view. (Rows indexed from 0.)<\/p>","question":"<p>Click the <b>two<\/b> lines that together show the rogue deployment and its first network action.<\/p>","logLines":["audit 01:58:02 create pod ns=build user=jenkins-deploy image=registry[.]nw[.]example/builder:3.1.0","audit 01:59:44 create pod ns=build user=jenkins-deploy image=registry[.]nw[.]example/builder:3.2.0-rc1","audit 02:03:15 create pod ns=build user=jenkins-deploy image=docker[.]io/library/ubuntu:latest hostPath=/ privileged=true","audit 02:03:20 create pod ns=build user=ci-runner image=registry[.]nw[.]example/tester:1.0.4","fw    02:04:11 pod=ubuntu-latest-9xkj2 -&gt; hxxp[:]//203[.]0[.]113[.]44:4444 SYN established","audit 02:06:30 get pod ns=build user=jenkins-deploy","fw    02:07:59 pod=tester-1-0-4z8 -&gt; registry[.]nw[.]example:443 TLS"],"badLines":[2,4],"hint":"Find the create that breaks the registry and privilege pattern; then find what that pod did one minute later.","explanation":"<p>Line 3 (index 2) is the rogue <b>create pod<\/b>: non-allow-listed <b>ubuntu:latest<\/b>, <b>privileged<\/b>, mounting the node root — and its creator, jenkins-deploy, normally pushes pinned builder images. Line 5 (index 4) is that pod's <b>first action<\/b>: an established connection to 203[.]0[.]113[.]44:4444, a classic reverse-shell port, one minute after create. The other deploys fit the nightly pattern, and their egress targets are internal.<\/p>","study":"DET0249: correlate create → start → first action inside a short window."},{"id":"EX-03","type":"drag-drop","summary":"Draw the T1610 / T1611 boundary correctly","concepts":["--privileged flag","hostPath mount","escape to host precursor","deploy a new container"],"scenario":"<p>Two junior analysts argue in the channel. One says a privileged pod with a node-root mount is already 'Escape to Host'. The other says it is still 'Deploy Container'. Settle it: place each action on the correct side of the boundary.<\/p>","question":"<p>Place each action in the right technique bucket.<\/p>","bank":["Deploy a pod with privileged: true","Deploy a pod that bind-mounts the node root via hostPath","Use nsenter inside the running container to enter host namespaces","Exploit a kernel bug from the container to run code on the host"],"slots":[{"label":"T1610 Deploy Container — the deployment itself","accept":[0,1]},{"label":"T1611 Escape to Host — leaving the container","accept":[2,3]}],"hint":"The technique boundary is the moment code first executes outside the container.","explanation":"<p>Deploying a <b>privileged<\/b> pod or one with a <b>hostPath<\/b> node-root mount is still <b>T1610<\/b> — hostile configuration, but the code runs inside the container; these are <b>escape precursors<\/b>. <b>nsenter<\/b> into host namespaces and kernel exploitation are <b>T1611<\/b>: code now executes outside the container. Near-miss: the privileged deployment prepares the escape but is not itself the escape.<\/p>","study":"T1610 feeds T1611; write it that way in tickets."},{"id":"EX-04","type":"multi-step","summary":"Reconstruct the Peirates pod-mount-and-shell procedure","concepts":["Peirates node root filesystem pod","escape to host precursor","create → start → first-action correlation"],"scenario":"<p>Artefacts from cluster <span class=\"mono\">staging-eu<\/span>:<br>(1) audit: <span class=\"mono\">create pod p-utility ns=default user=sa-external-0 image=docker[.]io/library/alpine:latest volume hostPath=/<\/span><br>(2) EDR on node k8s-wkr-07: process <span class=\"mono\">chroot /host /bin/bash<\/span> spawned from the container runtime<br>(3) node auth log: session opened for root from the pod CIDR, then outbound TCP to <span class=\"mono\">203[.]0[.]113[.]44:4444<\/span>.<\/p>","question":"<p>Work the three-step reconstruction.<\/p>","steps":[{"prompt":"Step 1 — the pod is created with hostPath=/ and its first process is chroot /host. What is the correct first reading?","options":["A backup job is running; chroot is normal","The pod mounts the node root filesystem — an escape precursor staged by a freshly deployed container","The node was compromised first and the pod came later"],"correct":1,"outcome":"Right — a deployed container mounting / and chrooting into it is the documented staging pattern."},{"prompt":"Step 2 — a root session appears on the node from the pod CIDR and a reverse shell leaves to 203[.]0[.]113[.]44:4444. What happened?","options":["The escape has begun: the deployment crossed into T1611 with code running on the host","Only DNS leaked","The kernel panicked and rebooted"],"correct":0,"outcome":"Correct — the boundary was crossed: host execution plus command-and-control egress."},{"prompt":"Step 3 — which publicly documented tool performs exactly this deploy-pod-mount-node-root-then-shell procedure?","options":["BloodHound","Peirates (S0683)","WinPEAS"],"correct":1,"outcome":"Yes — Peirates automates deploying a pod that mounts the node root filesystem and lands a reverse shell on the node."}],"hint":"Step 1: judge the mount. Step 2: judge the boundary. Step 3: the tool is Kubernetes-native and starts with P.","explanation":"<p>This is the <b>Peirates (S0683)<\/b> procedure: deploy a pod that mounts the node's root filesystem, then obtain a reverse shell on the node. The <b>create → first-action<\/b> correlation (create with hostPath=/ → chroot → node session → egress) turns three artefacts into one story, and the story crosses from T1610 into T1611 at the chroot/session boundary.<\/p>","study":"ATT&CK procedure examples for T1610/T1611; Peirates documentation."},{"id":"EX-05","type":"fill-blank","summary":"Complete the TeamTNT procedure note","concepts":["TeamTNT miner deployment"],"scenario":"<p>Finish the threat-intel annex sentence about TeamTNT's container deployments.<\/p>","question":"<p>Fill the blanks: TeamTNT (G0139) deployed containers and pushed crypto <input1> into Kubernetes clusters they found in <input2> IP ranges.<\/p>","template":"Fill the blanks: TeamTNT (G0139) deployed containers and pushed crypto <input1> into Kubernetes clusters they found in <input2> IP ranges.","blanks":[{"answer":"miners","alts":["miner","mining malware","coin miners"],"placeholder":"payload","width":9},{"answer":"local","alts":["private","internal"],"placeholder":"range type","width":8}],"hint":"First blank: what TeamTNT runs. Second blank: the clusters were not on the public internet.","explanation":"<p>TeamTNT (G0139) scanned for weakly protected Kubernetes clusters reachable in <b>local<\/b> IP ranges and <b>deployed crypto miners<\/b> into them — a textbook T1610 money motive with little interest in stealth after landing.<\/p>","study":"ATT&CK groups: G0139 TeamTNT procedures under T1610."},{"id":"EX-06","type":"qcm-single","summary":"Choose the least aggressive correct next action","concepts":["image scanning before deployment","workload identity (non-admin principal)","evidence preservation before containment"],"scenario":"<p>02:14, cluster prod-eu. <span class=\"mono\">create pod<\/span> by <span class=\"mono\">system:serviceaccount:monitoring:metrics-agent<\/span> — an account whose only verbs, ever, are read-only metrics. Image: <span class=\"mono\">docker[.]io/library/alpine:latest<\/span>, not allow-listed. The pod is running but has produced no egress; the admission controller runs in <b>audit mode<\/b> (logs, does not block). The on-call director wants it gone right now.<\/p>","question":"<p>Which action is correct — proportionate and evidence-safe?<\/p>","options":["Cordon and drain the node immediately; re-image before shift end","Snapshot the pod spec and logs, pull and scan the image offline, confirm the SA baseline, then decide containment","Delete the pod and delete the namespace to be safe","Do nothing — audit mode proves the platform accepted it knowingly"],"correct":1,"hint":"Two options destroy evidence; two options do not match what you actually know yet.","explanation":"<p>The <b>least aggressive correct action<\/b> preserves evidence while resolving the anomaly: snapshot spec and logs (evidence preservation), <b>scan the image<\/b> offline (M1047), and confirm the <b>identity baseline<\/b>. Draining and deleting destroy evidence and leave the redeployment question unanswered; 'do nothing' ignores a first-ever deploy by a non-admin principal. Containment stays on the table once the picture sharpens.<\/p>","study":"IR discipline: preserve → verify → contain, unless active damage forces the order."},{"id":"EX-07","type":"line-select","summary":"Guestshell containers on a network device","concepts":["Salt Typhoon guestshell","benign-image runtime payload"],"scenario":"<p>Device log, edge router <span class=\"mono\">edge-rtr-02<\/span>, during a suspected Salt Typhoon intrusion. Guestshell is Cisco's on-device Linux container environment. (Rows indexed from 0.)<\/p>","question":"<p>Click the <b>two<\/b> lines that show a container environment being deployed and then used to run attacker tooling.<\/p>","logLines":["Jan 06 21:14:02.113  %SYS-5-CONFIG_I: Configured from console by vty0 (10[.]20[.]4[.]7)","Jan 06 21:20:47.331  %IOSXE_INFRA-5-GS_ENABLE: guestshell enabled by admin","Jan 06 21:22:10.918  %IOSXE_INFRA-6-GS_START: guestshell started","Jan 06 21:25:33.402  guestshell: package chrony updated to 4.2.1","Jan 06 21:31:08.774  guestshell: python3 /flash/collect[.]py executed","Jan 06 21:33:52.106  %LINEPROTO-5-UPDOWN: Interface GigabitEthernet0/0/1 changed state to up"],"badLines":[1,4],"hint":"One line turns the container environment on; one line runs something from flash inside it.","explanation":"<p>Line 2 (index 1) — <span class=\"mono\">guestshell enable<\/span> — deploys the Linux container environment on the network device, the Salt Typhoon (G1045) T1610 procedure. Line 5 (index 4) runs <span class=\"mono\">/flash/collect[.]py<\/span> inside it: tooling from the device's own flash, a benign-platform runtime payload. The config and interface lines are routine, and a chrony update alone is housekeeping.<\/p>","study":"G1045 Salt Typhoon: guestshell enable on network devices = T1610 on exotic platforms."},{"id":"EX-08","type":"ordering","summary":"Order the API-server gate sequence","concepts":["admission controller"],"scenario":"<p>Detection engineering asks where an admission controller actually sits. Order the journey of a pod-create request through the API server, from first to last.<\/p>","question":"<p>Order the stages from first to last.<\/p>","items":["Authentication: who is making this request","Authorization: may this identity create pods here","Admission controllers: validate and possibly reject the pod request","Container start on a node"],"hint":"Identity comes before permission; the admission gate runs after both, before anything starts.","explanation":"<p>Correct order: <b>authentication → authorization → admission → start<\/b>. Admission controllers validate <b>after<\/b> authn/authz but <b>before<\/b> the container starts — the last point where a hostile deployment can simply be denied (M1047).<\/p>","study":"M1047 Audit: admission controllers as the enforcement point."}];

EXERCISES.push({"id":"EX-09","type":"qcm-multi","summary":"Which two actions are documented TeamPCP behaviour?","concepts":["TeamPCP privileged DaemonSets","Cloud Stealer persistence pod"],"scenario":"<p>A threat-intel briefing slide needs the correct rows kept and the wrong rows cut. Which two documented actions belong to TeamPCP (G1056)?<\/p>","question":"<p>Select the <b>two<\/b> TeamPCP actions.<\/p>","options":["Deployed privileged DaemonSets to delete files across compromised clusters","Deployed a pod running the Cloud Stealer persistence script","Delivered credential phishing via fake invoice emails","Created BITS jobs to download payloads on Windows hosts"],"correct":[0,1],"hint":"Both correct rows are things you DEPLOY into a cluster.","explanation":"<p>TeamPCP (G1056) used <b>privileged DaemonSets<\/b> to delete files on clusters and deployed a pod running the <b>Cloud Stealer (S9041)<\/b> persistence script — both are T1610 deployments. Phishing and BITS jobs belong to other techniques entirely.<\/p>","study":"ATT&CK T1610 procedure examples: G1056, S9041."},
{"id":"EX-10","type":"matching","summary":"Match clean images to their observed runtime behaviour","concepts":["benign-image runtime payload","TeamTNT miner deployment"],"scenario":"<p>The 'looks benign, is not' wall. Each image on the left scanned clean and is widely trusted. Match each to what the deployed container actually did.<\/p>","question":"<p>Click an image on the left, then its observed behaviour on the right.<\/p>","pairs":[{"left":"ubuntu:22.04 (official, hash-verified)","right":"fifteen minutes after start, curl fetched a payload from hxxp[:]//198[.]51[.]100[.]7 and ran it"},{"left":"redis:6.2 (official, hash-verified)","right":"spawned a mining binary that consumed 95% CPU on every pod copy"},{"left":"alpine:latest (official, hash-verified)","right":"opened an outbound reverse shell to 203[.]0[.]113[.]44:4444"}],"hint":"Match on the action, not the reputation: fetch-and-run, mine, reverse shell.","explanation":"<p>All three are <b>benign-image runtime payloads<\/b>: the evil arrives at runtime, so image scanning and allow-lists pass by design. The miner behaviour matches the <b>TeamTNT<\/b> pattern of deployed miners. This is why detection correlates <b>create → start → first action<\/b> instead of trusting image verdicts.<\/p>","study":"Runtime behaviour analytics versus static image scanning."},
{"id":"EX-11","type":"terminal","summary":"List every pod that mounts hostPath volumes, cluster-wide","concepts":["hostPath mount","escape to host precursor"],"scenario":"<p>Environment: your admin bastion has cluster-admin; the cluster CLI is configured and authenticated. Objective, no tool names given: produce the one-line command that lists <b>all pods in all namespaces as JSON<\/b> and extracts the <b>name of every pod that mounts a hostPath volume<\/b>. You have <span class=\"mono\">jq<\/span> available.<\/p>","question":"<p>Type the command.<\/p>","shellPrompt":"analyst@bastion-02:~$","expected":"kubectl get pods -A -o json | jq '[.items[] | select(.spec.volumes[]?.hostPath) | .metadata.name]'","elements":[{"any":["kubectl"],"label":"the cluster CLI"},{"any":["-o=json","-o json","-ojson"],"label":"JSON output flag"},{"any":["hostpath"],"label":"the hostPath filter"}],"hint":"Two wrong paths: querying one namespace only, or forgetting the machine-readable output flag.","explanation":"<p><span class=\"mono\">kubectl get pods -A -o json | jq '[.items[] | select(.spec.volumes[]?.hostPath) | .metadata.name]'<\/span> sweeps the cluster for <b>hostPath<\/b> mounts — the escape-precursor attribute — in one shot. During incidents this query usually surfaces the attacker's staging pod within seconds; expect the hostile ones to hide in kube-system.<\/p>","study":"kubectl -o json plus jq select: your fastest cluster-wide validator."},
{"id":"EX-12","type":"qcm-single","summary":"Attribute the deployed Ubuntu container to the right software","concepts":["Kinsing Ubuntu container","Doki deployed container"],"scenario":"<p>Ticket INC-4611: a container was <b>deployed<\/b> from the official Ubuntu image; minutes later the pod emitted heavy scanning to ports 445/6379/2375 across internal ranges and an XMRig-style miner process started. No backdoor file was found in the image or on the host.<\/p>","question":"<p>Which software matches this documented T1610 procedure?<\/p>","options":["Doki (S0600), a backdoor run through a deployed container","Peirates (S0683), the node-filesystem pod mounter","Kinsing (S0599), which runs through a deployed Ubuntu container","Guestshell, the Cisco on-device container service"],"correct":2,"hint":"One option is a backdoor, one is a pod-mount tool, one is a platform feature; the ticket describes a miner with scanning.","explanation":"<p>A miner plus aggressive internal scanning from a deployed <b>Ubuntu<\/b> container is the documented <b>Kinsing (S0599)<\/b> pattern. <b>Doki<\/b> is a backdoor (not a miner) run through a deployed container; Peirates is about mounting the node root; guestshell is the platform feature Salt Typhoon abuses.<\/p>","study":"Procedure-example matching: payload class and container origin, not vibes."},
{"id":"EX-13","type":"multi-step","summary":"One privileged DaemonSet manifest, red view then blue view","concepts":["TeamPCP privileged DaemonSets","DaemonSet spread","admission controller","benign-image runtime payload"],"scenario":"<p>Same artefact, two seats. Manifest observed cluster-wide:<\/p><pre class=\"art mono\">kind: DaemonSet          metadata: name: node-cleaner, ns: kube-system\nimage: docker[.]io/library/alpine:latest    securityContext: privileged: true\ncommand: [sh,-c, rm -rf /host/var/log/* &amp;&amp; /x/cleaner]\nvolumes: [{hostPath: {path: /}}]<\/pre>","question":"<p>Answer first as the operator, then as the defender.<\/p>","steps":[{"prompt":"RED SIDE — you are the operator. Why deploy this as a DaemonSet instead of one pod?","options":["DaemonSets are cheaper to run than single pods","A DaemonSet schedules one privileged pod on EVERY node, so file deletion spreads cluster-wide in one API call","A DaemonSet bypasses image scanning by design"],"correct":1,"outcome":"Right — DaemonSet spread is the point: every node, one call, no scheduler fiddling."},{"prompt":"BLUE SIDE — which single control would have denied this deployment before any container started?","options":["A weekly CVE scan of the alpine image","An enforcing admission controller rejecting privileged DaemonSets with hostPath / in kube-system","Disabling the kubelet's healthz endpoint"],"correct":1,"outcome":"Correct — admission enforcement at pod-create time is the only gate on this list that sees the spec."},{"prompt":"BLUE SIDE — the image is plain alpine and scans clean. Why did scanning miss the harm?","options":["Scanners cannot read YAML manifests","The image is clean; the harm lives in the runtime command, the mount and the privilege — config, not content","The scan ran before the tag was pulled"],"correct":1,"outcome":"Yes — a benign-image runtime/behaviour payload defeats content scanning; the spec is the evidence."}],"hint":"Red side: think coverage. Blue side: think gate position, then think config versus content.","explanation":"<p>This mirrors <b>TeamPCP (G1056)<\/b>: <b>privileged DaemonSets<\/b> used to delete files across clusters. The red-side value is <b>DaemonSet spread<\/b> — one privileged pod per node from a single create. The blue-side fix is an <b>enforcing admission controller<\/b> on the spec (privilege plus hostPath /), and the reason scanning failed is that the image was a <b>benign-image runtime payload<\/b>: clean bytes, hostile config and commands.<\/p>","study":"Replay this manifest through Pod Security Admission levels; watch it get denied."},
{"id":"EX-14","type":"line-select","summary":"Allow-listed image, hostile attributes","concepts":["added capabilities (SYS_ADMIN)","Docker create/start API"],"scenario":"<p>Docker Engine API log, production worker node. The image <span class=\"mono\">registry[.]nw[.]example/app:1.8.2<\/span> IS on the allow-list — that is the trap. (Rows indexed from 0.)<\/p>","question":"<p>Click the <b>two<\/b> lines that form the hostile create/start pair.<\/p>","logLines":["14:02:19  POST /containers/create  Image=registry[.]nw[.]example/app:1.8.2  Privileged=false  CapAdd=[]","14:02:20  POST /containers/aa31.../start","14:19:41  POST /containers/create  Image=registry[.]nw[.]example/app:1.8.2  CapAdd=[SYS_ADMIN]  Devices=[/dev/kvm]","14:19:42  POST /containers/77aa.../start","14:31:07  POST /containers/create  Image=registry[.]nw[.]example/ci-runner:5.0.1  Privileged=false","15:00:53  GET  /containers/json?all=false"],"badLines":[2,3],"hint":"Same image as the morning deploy — so what differs?","explanation":"<p>Lines 3–4 (indexes 2–3) deploy the <b>allow-listed<\/b> image but add <b>CAP_ADD SYS_ADMIN<\/b> and the <b>/dev/kvm device<\/b> — attributes the approved deployment never carries. Allow-listing the image name without validating <b>runtime attributes<\/b> is the gap; DET0249 fires on risky attributes even for approved images. The morning pair is the clean baseline.<\/p>","study":"DET0249: image allow-list AND risky runtime attributes are separate tests."},

(function () {

  function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function norm(s) { return String(s || '').toLowerCase().replace(/\s+/g, ' ').replace(/["'`]/g, '').replace(/[.;]+$/, '').trim(); }

  /* ---------------- per-attempt shuffles (stable) ---------------- */
  function buildShuffles() {
    S.shuffles = {};

  }

    else if (state === 'ENDED') { ic.textContent = '⏹'; word.textContent = 'ENDED'; $('tbTimer').style.color = 'var(--state-incorrect)'; }
    else { ic.textContent = '⏱'; word.textContent = 'READY'; }
  }
  function tick() {

  function updateScoreBar() {

    INTRO.themes.forEach(function (th) {
      var t = el('div', 'kw-theme');
      t.appendChild(el('h3', null, esc(th.name)));

    var how = el('div', 'card intro-sec');

    how.appendChild(el('ul', 'rules',
      '<li><b>Passing score:</b> you need <b>70%</b> to pass. PASS means you showed real understanding of ' + esc(META.mitreId) + ' at this level; FAIL means you should review and retake.</li>' +
      '<li><b>Exercise types in this file:</b> ' + types.map(esc).join(' · ') + '.</li>' +
      '<li><b>Timer:</b> the countdown runs while you work. The <b>Pause</b> button hides the exercise for a real break. Pressing <b>Check</b> also stops the timer automatically (⏸ PAUSED — reviewing feedback): study the feedback as long as you want, the timer resumes only when you press <b>Next</b>.</li>' +
      '<li><b>Partial credit:</b> exercises with several correct items are scored per item. Selecting wrong items subtracts: credit = max(0, (correct − wrong) / total).</li>' +
      '<li><b>Hints:</b> one hint per exercise costs <b>−10% of that exercise\'s credit</b> (never below zero).</li>' +
      '<li><b>Skipping:</b> every exercise has a Skip button. Skipped exercises are collected in a review screen before you finish, and you can answer them there while the timer still runs. Skipped-and-never-answered exercises are excluded from your score.</li>'));
    how.appendChild(el('div', 'typlist', '<span class="typ">' + META.questionCount + ' exercises</span><span class="typ">timer ' + fmtTime((META.estimatedMinutes || 15) * 60) + '</span><span class="typ">pass 70%</span><span class="typ">severity: ' + esc(META.severityLabel) + '</span>'));
    var startRow = el('div', 'actions');
    var startBtn = el('button', 'btn btn-primary', '▶ Start the exam');
    startBtn.setAttribute('aria-label', 'Start the exam');
    startBtn.addEventListener('click', startExam);
    startRow.appendChild(startBtn);
    how.appendChild(startRow);

  }
  function startExam() {
    if (!S.started) { S.started = true; startTimer(); }
    else { setTimerState(S.timerState === 'PAUSED_AUTO_CHECK' ? 'PAUSED_AUTO_CHECK' : S.timerState); }

    renderExercise(S.current);
  }

  /* ---------------- widgets ---------------- */
  function optRow(idx, text) {
    var b = el('button', 'opt', '<span class="key" aria-hidden="true">' + String.fromCharCode(65 + idx) + '.</span><span class="opt-txt">' + text + '</span>');
    b.type = 'button'; b.dataset.idx = idx;
    b.setAttribute('aria-label', 'Option ' + String.fromCharCode(65 + idx));
    return b;
  }
  function widgetFor(ex, box, wstate) {
    if (ex.type === 'qcm-single' || ex.type === 'qcm-multi') {
      var wrap = el('div', null, '');
      wstate.sel = wstate.sel || [];
      ex.options.forEach(function (o, i) {
        var r = optRow(i, o);
        if (wstate.sel.indexOf(i) >= 0) r.classList.add('sel');
        r.addEventListener('click', function () {
          if (S.answers[S.current].status === 'checked') return;
          if (ex.type === 'qcm-single') { wstate.sel = [i]; wrap.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); }); r.classList.add('sel'); }
          else { var p = wstate.sel.indexOf(i); if (p >= 0) { wstate.sel.splice(p, 1); r.classList.remove('sel'); } else { wstate.sel.push(i); r.classList.add('sel'); } }
        });
        wrap.appendChild(r);
      });
      box.appendChild(wrap);
    } else if (ex.type === 'fill-blank') {
      wstate.vals = wstate.vals || {};
      var parts = ex.template.split(/(<input\d+>)/g);
      var fw = el('div', 'fillwrap');
      parts.forEach(function (p) {
        var m = /^<input(\d+)>$/.exec(p);
        if (m) {
          var bi = parseInt(m[1], 10) - 1, bl = ex.blanks[bi];
          var inp = document.createElement('input');
          inp.type = 'text'; inp.placeholder = bl.placeholder || ''; inp.style.width = (bl.width || 14) + 'ch';
          inp.setAttribute('aria-label', 'Blank ' + (bi + 1));
          inp.value = wstate.vals[bi] || '';
          inp.addEventListener('input', function () { wstate.vals[bi] = inp.value; });
          fw.appendChild(inp);
        } else if (p) { fw.appendChild(el('span', null, p)); }
      });
      box.appendChild(fw);
    } else if (ex.type === 'drag-drop') {
      wstate.place = wstate.place || {}; // bankIdx -> slotIdx
      wstate.active = wstate.active === undefined ? null : wstate.active;
      var dd = el('div', 'ddwrap');
      var bank = el('div', 'ddbank'); bank.dataset.bank = '1';
      bank.setAttribute('aria-label', 'Item bank');
      var bankH = el('div', 'dd-hint', 'Item bank — click an item, then click a slot (or drag it)');
      var bankList = el('div', null);
      function chipEl(bi, inSlot) {
        var c = el('button', 'chip', esc(ex.bank[bi]));
        c.type = 'button'; c.draggable = true; c.dataset.bi = bi;
        c.setAttribute('aria-label', 'Item: ' + ex.bank[bi] + (inSlot ? ' (placed)' : ''));
        if (wstate.active === bi) c.classList.add('active');
        c.addEventListener('click', function () {
          if (S.answers[S.current].status === 'checked') return;
          if (inSlot) { delete wstate.place[bi]; wstate.active = null; rerender(); }
          else { wstate.active = (wstate.active === bi ? null : bi); rerender(); }
        });
        c.addEventListener('dragstart', function (ev) { try { ev.dataTransfer.setData('text/plain', String(bi)); } catch (e) { } });
        return c;
      }
      function rerender() {
        bankList.innerHTML = '';
        S.shuffles[S.current].bank.forEach(function (bi) { if (wstate.place[bi] === undefined) bankList.appendChild(chipEl(bi, false)); });
        dd.querySelectorAll('.sl-body').forEach(function (b) { b.innerHTML = ''; });
        ex.slots.forEach(function (sl, si) {
          var body = dd.querySelector('[data-slot="' + si + '"]');
          Object.keys(wstate.place).forEach(function (k) { if (wstate.place[k] === si) body.appendChild(chipEl(parseInt(k, 10), true)); });
        });
      }
      bank.appendChild(bankH); bank.appendChild(bankList); dd.appendChild(bank);
      var slotsBox = el('div', 'ddslots');
      ex.slots.forEach(function (sl, si) {
        var sd = el('div', 'ddslot');
        sd.appendChild(el('div', 'sl-h', esc(sl.label)));
        var body = el('div', 'sl-body'); body.dataset.slot = si; body.tabIndex = 0;

        body.setAttribute('aria-label', 'Slot: ' + sl.label);
        body.addEventListener('click', function () {
          if (S.answers[S.current].status === 'checked' || wstate.active === null) return;

        });

        body.addEventListener('drop', function (ev) {
          ev.preventDefault(); sd.classList.remove('over');
          if (S.answers[S.current].status === 'checked') return;
          var bi = parseInt(ev.dataTransfer.getData('text/plain'), 10);
          if (!isNaN(bi)) { wstate.place[bi] = si; wstate.active = null; rerender(); }
        });
        sd.appendChild(body); slotsBox.appendChild(sd);
      });
      dd.appendChild(slotsBox);
      box.appendChild(dd);
      rerender();
    } else if (ex.type === 'ordering') {
      wstate.order = wstate.order || S.shuffles[S.current].ord.slice();
      var ol = el('ul', 'ordlist'); ol.setAttribute('aria-label', 'Ordering list — use the arrows to reorder');
      function drawOrd() {

          dn.disabled = pos === wstate.order.length - 1;

    } else if (ex.type === 'terminal') {

      term.appendChild(el('div', 't-bar',
        '<span class="t-dot d-r"></span><span class="t-dot d-a"></span><span class="t-dot d-g"></span><span class="t-title">' + esc(ex.shellPrompt || 'shell') + ' — type the command, then press Enter or Check</span>'));
      var body = el('div', 't-body');
      var hist = el('div', 't-hist'); hist.textContent = wstate.cmd ? wstate.cmd : '';
      var inrow = el('div', 't-in');
      var pr = el('span', 'pr', esc(ex.shellPrompt || '$'));
      var inp = document.createElement('input');
      inp.type = 'text'; inp.value = wstate.cmd; inp.setAttribute('aria-label', 'Terminal command input'); inp.autocomplete = 'off'; inp.spellcheck = false;
      inp.addEventListener('input', function () { wstate.cmd = inp.value; hist.textContent = ''; });
      inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); doCheck(); } });
      inrow.appendChild(pr); inrow.appendChild(inp);
      body.appendChild(hist); body.appendChild(inrow); term.appendChild(body);
      box.appendChild(term);
      if (ex.syntaxPanel) box.appendChild(el('div', 'syntax', ex.syntaxPanel));
      setTimeout(function () { try { inp.focus(); } catch (e) { } }, 60);
    } else if (ex.type === 'line-select') {
      wstate.sel = wstate.sel || [];
      var lv = el('div', 'logview');
      var bar = el('div', 'lv-bar', '<span class="lv-tag">FILTER</span>');
      var finp = document.createElement('input');
      finp.type = 'text'; finp.placeholder = ex.filterable ? 'filter lines… (visual aid only)' : 'visual filter…';
      finp.setAttribute('aria-label', 'Filter log lines');
      bar.appendChild(finp); lv.appendChild(bar);
      var lines = el('div', 'lv-lines');
      function drawLines(f) {
        lines.innerHTML = '';
        ex.logLines.forEach(function (l, i) {
          if (f && l.toLowerCase().indexOf(f.toLowerCase()) < 0) return;
          var row = el('div', 'logline' + (wstate.sel.indexOf(i) >= 0 ? ' sel' : ''));
          row.setAttribute('role', 'button'); row.tabIndex = 0;
          row.setAttribute('aria-label', 'Log line ' + (i + 1) + (wstate.sel.indexOf(i) >= 0 ? ', selected' : ''));
          row.appendChild(el('span', 'ln', String(i + 1)));
          row.appendChild(el('span', null, esc(l)));
          row.addEventListener('click', function () {
            if (S.answers[S.current].status === 'checked') return;
            var p = wstate.sel.indexOf(i); if (p >= 0) { wstate.sel.splice(p, 1); row.classList.remove('sel'); row.setAttribute('aria-label', 'Log line ' + (i + 1)); }
            else { wstate.sel.push(i); row.classList.add('sel'); }
          });
          row.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); row.click(); } });
          lines.appendChild(row);
        });
      }
      drawLines('');
      finp.addEventListener('input', function () { drawLines(finp.value.trim()); });
      lv.appendChild(lines); box.appendChild(lv);
      box.appendChild(el('div', 'dd-hint', 'Click the line(s) that answer the question. The filter box is a visual aid only — filtering does not change your selection.'));
    } else if (ex.type === 'multi-step') {
      wstate.step = wstate.step === undefined ? 0 : wstate.step;
      wstate.picks = wstate.picks || {};
      wstate.stepSel = wstate.stepSel === undefined ? null : wstate.stepSel;
      drawStep();
    }
    function drawStep() {
      var sw = el('div', null, '');
      /* outcomes of already-confirmed intermediate steps */
      for (var done = 0; done < wstate.step; done++) {
        var pk = wstate.picks[done];
        var okv = pk === ex.steps[done].correct;
        sw.appendChild(el('div', 'outcome', (okv ? '✓ ' : '✗ ') + 'Step ' + (done + 1) + ' confirmed — the scenario continues. ' + esc(ex.steps[done].outcome || '') + (done === wstate.step - 1 ? ' <b>Intermediate step: the timer keeps running.</b>' : '')));
      }
      var st = ex.steps[wstate.step];
      sw.appendChild(el('span', 'step-h', '⎘ STEP ' + (wstate.step + 1) + ' OF ' + ex.steps.length));
      sw.appendChild(el('div', 'block-b', st.prompt));
      var confirmBtn = null;
      st.options.forEach(function (o, i) {
        var r = optRow(i, o);
        if (wstate.stepSel === i) r.classList.add('sel');
        r.addEventListener('click', function () {
          if (wstate.picks[wstate.step] !== undefined) return;
          wstate.stepSel = i;
          sw.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); });
          r.classList.add('sel');
          if (confirmBtn) confirmBtn.disabled = false;
        });
        sw.appendChild(r);
      });
      confirmBtn = el('button', 'btn btn-blue', (wstate.step === ex.steps.length - 1 ? '✓ Confirm final step & check' : '→ Confirm step'));
      confirmBtn.type = 'button'; confirmBtn.disabled = wstate.stepSel === null;
      confirmBtn.setAttribute('aria-label', 'Confirm step ' + (wstate.step + 1));
      confirmBtn.addEventListener('click', function () {
        if (wstate.stepSel === null || wstate.picks[wstate.step] !== undefined) return;
        wstate.picks[wstate.step] = wstate.stepSel;
        wstate.stepSel = null;
        if (wstate.step < ex.steps.length - 1) {
          wstate.step++;
          drawStep(); /* intermediate: no auto-pause, timer keeps running */
        } else {
          doCheck(); /* final confirm = final Check: triggers the auto-pause */
        }
      });
      sw.appendChild(confirmBtn);
      box.innerHTML = '';
      box.appendChild(sw);
    }
  }

  /* ---------------- scoring ---------------- */
  function scoreExercise(ex, wstate) {
    var items = [], N = 0, H = 0, W = 0, canon = null;
    function item(state, label) { items.push({ state: state, label: label }); }
    if (ex.type === 'qcm-single') {
      N = 1;
      var sel = wstate.sel && wstate.sel[0];
      if (sel === undefined) { item('mi', 'No option selected'); }
      else if (sel === ex.correct) { H = 1; item('ok', '✓ Correct — ' + strip(ex.options[ex.correct])); }
      else { W = 1; item('no', '✗ You chose: ' + strip(ex.options[sel])); }
      canon = ex.options[ex.correct];
    } else if (ex.type === 'qcm-multi') {
      N = ex.correct.length;
      var selset = wstate.sel || [];
      ex.correct.forEach(function (ci) {
        if (selset.indexOf(ci) >= 0) { H++; item('ok', '✓ Correct: ' + strip(ex.options[ci])); }
        else { item('mi', '○ Missed: ' + strip(ex.options[ci])); }
      });
      selset.forEach(function (si) { if (ex.correct.indexOf(si) < 0) { W++; item('no', '✗ Wrong: ' + strip(ex.options[si])); } });
      canon = ex.correct.map(function (ci) { return strip(ex.options[ci]); }).join(' · ');
    } else if (ex.type === 'fill-blank') {
      N = ex.blanks.length;
      ex.blanks.forEach(function (bl, bi) {
        var v = norm(wstate.vals && wstate.vals[bi]);
        var accept = [norm(bl.answer)].concat((bl.alts || []).map(norm));
        if (!v) { item('mi', '○ Missed blank ' + (bi + 1) + ' — expected: ' + esc(bl.answer)); }
        else if (accept.indexOf(v) >= 0) { H++; item('ok', '✓ Blank ' + (bi + 1) + ': ' + esc(bl.answer)); }
        else { W++; item('no', '✗ Blank ' + (bi + 1) + ' — you typed "' + esc(v) + '", expected: ' + esc(bl.answer)); }
      });
      canon = ex.blanks.map(function (bl) { return bl.answer; }).join(' | ');
    } else if (ex.type === 'drag-drop') {
      N = ex.bank.length;
      Object.keys(wstate.place || {}).forEach(function (k) {
        var bi = parseInt(k, 10), si = wstate.place[k];
        if (ex.slots[si] && ex.slots[si].accept.indexOf(bi) >= 0) { H++; item('ok', '✓ "' + strip(ex.bank[bi]) + '" → ' + esc(ex.slots[si].label)); }
        else { W++; item('no', '✗ "' + strip(ex.bank[bi]) + '" does not belong in ' + esc(ex.slots[si] ? ex.slots[si].label : '?')); }
      });
      ex.bank.forEach(function (t, bi) { if (wstate.place[bi] === undefined) item('mi', '○ Missed: "' + strip(t) + '" → ' + esc(slotLabelFor(ex, bi))); });
      canon = ex.slots.map(function (sl) { return sl.label + ': ' + sl.accept.map(function (bi) { return strip(ex.bank[bi]); }).join(', '); }).join(' | ');
    } else if (ex.type === 'ordering') {
      N = ex.items.length;
      var order = wstate.order || [];
      order.forEach(function (bi, pos) {
        if (bi === pos) { H++; item('ok', '✓ Position ' + (pos + 1) + ': ' + strip(ex.items[pos])); }
        else { W++; item('no', '✗ Position ' + (pos + 1) + ' — you put "' + strip(ex.items[bi]) + '", expected "' + strip(ex.items[pos]) + '"'); }
      });
      canon = ex.items.map(function (t, i) { return (i + 1) + '. ' + strip(t); }).join(' ');
    } else if (ex.type === 'matching') {
      N = ex.pairs.length;
      ex.pairs.forEach(function (p, li) {
        var a = (wstate.assign || {})[li];
        if (a === undefined) item('mi', '○ Missed: "' + strip(p.left) + '" → ' + esc(p.right));
        else if (a === li) { H++; item('ok', '✓ "' + strip(p.left) + '" → ' + esc(p.right)); }
        else { W++; item('no', '✗ "' + strip(p.left) + '" you matched to "' + strip(ex.pairs[a].right) + '", expected "' + esc(p.right) + '"'); }
      });
      canon = ex.pairs.map(function (p) { return strip(p.left) + ' = ' + strip(p.right); }).join(' | ');
    } else if (ex.type === 'terminal') {
      N = ex.elements.length;
      var cmd = norm(wstate.cmd || '');
      ex.elements.forEach(function (el2) {
        var hit = (el2.any || []).some(function (a) { return cmd.indexOf(String(a).toLowerCase()) >= 0; });
        if (hit) { H++; item('ok', '✓ ' + esc(el2.label)); }
        else { item('mi', '○ Missing: ' + esc(el2.label)); }
      });
      if (!cmd) item('mi', '○ Nothing typed — expected: ' + esc(ex.expected));
      canon = ex.expected;
    } else if (ex.type === 'line-select') {
      N = ex.badLines.length;
      var sel2 = wstate.sel || [];
      ex.badLines.forEach(function (li) {
        if (sel2.indexOf(li) >= 0) { H++; item('ok', '✓ Line ' + (li + 1) + ' is indeed the one to flag'); }
        else { item('mi', '○ Missed line ' + (li + 1) + ': ' + esc(shorten(ex.logLines[li], 90))); }
      });
      sel2.forEach(function (li) {
        if (ex.badLines.indexOf(li) < 0) { W++; item('no', '✗ Line ' + (li + 1) + ' is benign: ' + esc(shorten(ex.logLines[li], 80))); }
      });
      canon = ex.badLines.map(function (li) { return 'line ' + (li + 1); }).join(', ');
    } else if (ex.type === 'multi-step') {
      N = ex.steps.length;
      ex.steps.forEach(function (st, si) {
        var p = (wstate.picks || {})[si];
        if (p === undefined) item('mi', '○ Missed step ' + (si + 1) + ' — expected: ' + strip(st.options[st.correct]));
        else if (p === st.correct) { H++; item('ok', '✓ Step ' + (si + 1) + ': ' + strip(st.options[st.correct])); }
        else { W++; item('no', '✗ Step ' + (si + 1) + ' — you chose "' + strip(st.options[p]) + '", expected "' + strip(st.options[st.correct]) + '"'); }
      });
      canon = ex.steps.map(function (st, si) { return (si + 1) + '. ' + strip(st.options[st.correct]); }).join(' ');
    }
    var credit = N > 0 ? Math.max(0, (H - W) / N) : 0;
    if (N === 1) credit = H === 1 ? 1 : 0; /* single-answer: binary */
    if (S.answers[S.current].hintUsed) credit = Math.max(0, credit - 0.10);
    credit = Math.round(credit * 100) / 100;
    return { credit: credit, items: items, N: N, H: H, W: W, canon: canon };
  }
  function strip(s) { return esc(String(s).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim()); }
  function shorten(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function slotLabelFor(ex, bi) { var lbl = ''; ex.slots.forEach(function (sl) { if (sl.accept.indexOf(bi) >= 0) lbl = sl.label; }); return lbl; }

  /* ---------------- exercise screen ---------------- */
  function renderExercise(i) {
    var ex = EXERCISES[i];
    S.current = i;
    var a = S.answers[i];
    var area = $('exerciseArea'); area.innerHTML = '';
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    $('progressBar').style.width = Math.round(((i + 1) / EXERCISES.length) * 100) + '%';
    var tpEl = $('tbPart'); if (tpEl) { tpEl.textContent = 'Exercise ' + (i + 1) + ' of ' + EXERCISES.length; }

    var card = el('div', 'card');
    /* SCENARIO */
    var sc = el('div', 'block blk-scenario');
    var longSc = ex.scenario.length > 380;
    sc.innerHTML = '<div class="block-h"><span aria-hidden="true">📄</span> SCENARIO' + (longSc ? '<button type="button" class="sc-toggle" aria-expanded="true">⇅ collapse</button>' : '') + '</div>' +
      '<div class="block-b" id="scBody">' + ex.scenario + (ex.artifactNote ? '<div class="dd-hint">' + esc(ex.artifactNote) + '</div>' : '') + '</div>';
    card.appendChild(sc);
    if (longSc) {
      var tbtn = sc.querySelector('.sc-toggle'), body = sc.querySelector('#scBody');
      tbtn.addEventListener('click', function () {
        var open = tbtn.getAttribute('aria-expanded') === 'true';
        tbtn.setAttribute('aria-expanded', String(!open));
        tbtn.textContent = open ? '⇅ expand' : '⇅ collapse';
        body.classList.toggle('hidden', open);
      });
    }
    /* QUESTION */
    card.appendChild(el('div', 'block blk-question',
      '<div class="block-h"><span aria-hidden="true">❓</span> QUESTION</div><div class="block-b">' + ex.question + '</div>'));
    /* YOUR ANSWER */
    var answ = el('div', 'block blk-answer', '<div class="block-h"><span aria-hidden="true">✍</span> YOUR ANSWER</div>');
    var abody = el('div', 'block-b'); answ.appendChild(abody); card.appendChild(answ);

    var wstate = a.wstate;
    widgetFor(ex, abody, wstate);

    /* action row */
    var actions = el('div', 'actions');
    var checkBtn = el('button', 'btn btn-primary', '✓ Check');
    checkBtn.type = 'button'; checkBtn.id = 'checkBtn'; checkBtn.setAttribute('aria-label', 'Check your answer');
    checkBtn.addEventListener('click', doCheck);
    var nextBtn = el('button', 'btn btn-blue hidden', (i === EXERCISES.length - 1 || S.reviewMode) ? (S.reviewMode ? '⏭ Back to review' : '⏭ Final submit') : '⏭ Next');
    nextBtn.type = 'button'; nextBtn.id = 'nextBtn';
    nextBtn.addEventListener('click', goNext);
    var hintBtn = el('button', 'btn btn-amber', '💡 Hint (−10%)');
    hintBtn.type = 'button'; hintBtn.setAttribute('aria-label', 'Show hint, costs 10 percent of this exercise credit');
    hintBtn.disabled = a.hintUsed || a.status === 'checked';
    hintBtn.addEventListener('click', function () {
      if (a.hintUsed || a.status === 'checked') return;
      a.hintUsed = true; hintBtn.disabled = true;
      var hb = el('div', 'hintbox', '<div class="hb-h">💡 Hint — this exercise\'s credit is now reduced by 10%</div>' + esc(ex.hint));
      card.insertBefore(hb, actions);
    });
    var skipBtn = el('button', 'btn btn-ghost', '⚠ Skip');
    skipBtn.type = 'button'; skipBtn.setAttribute('aria-label', 'Skip this exercise'); skipBtn.disabled = a.status === 'checked';
    skipBtn.addEventListener('click', doSkip);
    actions.appendChild(checkBtn); actions.appendChild(nextBtn); actions.appendChild(el('span', 'spacer'));
    actions.appendChild(hintBtn); actions.appendChild(skipBtn);
    card.appendChild(actions);
    area.appendChild(card);

    /* manual pause veil (hidden by default) */
    if (S.timerState === 'PAUSED_MANUAL') showPauseVeil();

    /* restore feedback if already checked (should not normally happen) */
    if (a.status === 'checked') { renderFeedback(card, ex, a, true); checkBtn.disabled = true; nextBtn.classList.remove('hidden'); }

    updateScoreBar();
    /* pause button lives in topbar */
    renderTopbarButtons();
  }
  function renderTopbarButtons() {
    var bar = $('topbar');
    var old = document.getElementById('pauseBtn');
    if (old) old.remove();
    if (S.screen !== 'exam') return;
    var b = el('button', 'btn btn-ghost', '⏸ Pause');
    b.type = 'button'; b.id = 'pauseBtn'; b.setAttribute('aria-label', 'Pause the exam (manual pause)');
    b.addEventListener('click', function () {
      if (S.timerState === 'RUNNING' || S.timerState === 'PAUSED_AUTO_CHECK') {
        S.priorState = S.timerState;
        setTimerState('PAUSED_MANUAL'); showPauseVeil();
      } else if (S.timerState === 'PAUSED_MANUAL') {
        hidePauseVeil(); setTimerState(S.priorState || 'RUNNING');
      }
    });
    bar.appendChild(b);
    var oldF = document.getElementById('finishBtn');
    if (oldF) oldF.remove();
    var f = el('button', 'btn btn-ghost', '⏹ Finish');
    f.type = 'button'; f.id = 'finishBtn'; f.setAttribute('aria-label', 'Finish the exam early');
    f.addEventListener('click', function () { finishExam(false); });
    bar.appendChild(f);
  }
  function showPauseVeil() {
    var stage = document.querySelector('.exam-stage');
    var old = stage.querySelector('.pause-veil'); if (old) old.remove();
    var veil = el('div', 'pause-veil',
      '<div class="pv-ic" aria-hidden="true">⏸</div><div class="pv-word">PAUSED — manual</div>' +
      '<div style="color:var(--text-secondary);max-width:420px">The exercise is hidden while you are on a break. The timer is stopped.</div>');
    var r = el('button', 'btn btn-primary', '▶ Resume');
    r.type = 'button'; r.setAttribute('aria-label', 'Resume the exam');
    r.addEventListener('click', function () {
      hidePauseVeil();
      setTimerState(S.priorState === 'PAUSED_AUTO_CHECK' ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
    });
    veil.appendChild(r);
    stage.appendChild(veil);
    $('exerciseArea').querySelector('.card').style.visibility = 'hidden';
  }
  function hidePauseVeil() {
    var v = document.querySelector('.pause-veil'); if (v) v.remove();
    var c = $('exerciseArea').querySelector('.card'); if (c) c.style.visibility = 'visible';
  }

  function doCheck() {
    var i = S.current, ex = EXERCISES[i], a = S.answers[i];
    if (a.status === 'checked') return;
    var res = scoreExercise(ex, a.wstate);
    a.status = 'checked';
    a.credit = res.credit;
    a.result = res;
    a.label = res.credit >= 1 ? 'correct' : (res.credit > 0 ? 'partial' : 'incorrect');
    setTimerState('PAUSED_AUTO_CHECK'); /* check-triggered auto-pause */
    var card = $('exerciseArea').querySelector('.card');
    renderFeedback(card, ex, a, false);
    var cb = document.getElementById('checkBtn'); if (cb) cb.disabled = true;
    var sb = document.querySelector('#exerciseArea .btn-ghost'); /* skip button */ if (sb) sb.disabled = true;
    var hb = document.querySelector('#exerciseArea .btn-amber'); if (hb) hb.disabled = true;
    var nb = document.getElementById('nextBtn'); if (nb) nb.classList.remove('hidden');
    lockWidgets(card);
    updateScoreBar();
  }
  function lockWidgets(card) {
    var abody = card.querySelector('.blk-answer');
    if (!abody) return;
    abody.querySelectorAll('button, input').forEach(function (x) {
      x.disabled = true; x.style.pointerEvents = 'none'; x.readOnly = true;
      if (x.classList.contains('chip')) x.draggable = false;
    });
  }
  function renderFeedback(card, ex, a, restoring) {
    var old = card.querySelector('.fb'); if (old) old.remove();
    var res = a.result;
    var cls = a.label === 'correct' ? 'fb-correct' : (a.label === 'partial' ? 'fb-partial' : 'fb-incorrect');
    var word = a.label === 'correct' ? '✓ CORRECT' : (a.label === 'partial' ? '✓ PARTIALLY CORRECT' : '✗ INCORRECT');
    var fb = el('div', 'fb ' + cls);
    var hh = '<span>' + word + '</span>';
    if (res.N > 1) hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + ' — ' + res.H + '/' + res.N + ' items</span>';
    else hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + '</span>';
    if (a.hintUsed) hh += '<span class="fb-credit">💡 hint −0.10 applied</span>';
    fb.appendChild(el('div', 'fb-h', hh));
    var it = el('div', 'fb-items');
    res.items.forEach(function (im) { it.appendChild(el('div', 'fb-item ' + im.state, '<span class="fi-ic">' + (im.state === 'ok' ? '✓' : im.state === 'no' ? '✗' : '○') + '</span><span>' + im.label + '</span>')); });
    fb.appendChild(it);
    if (res.canon) {
      var c = el('div', 'canon');
      c.appendChild(el('div', 'dd-hint', 'Correct answer:'));
      c.appendChild(el('pre', 'art', esc(res.canon)));
      fb.appendChild(c);
    }
    fb.appendChild(el('div', 'exp', ex.explanation));
    if (a.label !== 'correct' && ex.study) fb.appendChild(el('div', 'study', '📚 What to study: ' + esc(ex.study)));
    var acts = card.querySelector('.actions');
    card.insertBefore(fb, acts);
    fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function doSkip() {
    var i = S.current, a = S.answers[i];
    if (a.status === 'checked') return;
    a.status = 'skipped';
    if (S.skipped.indexOf(i) < 0) S.skipped.push(i);
    /* no auto-pause: timer keeps running */
    advance();
  }
  function goNext() {
    if (S.timerState === 'PAUSED_AUTO_CHECK') setTimerState('RUNNING'); /* resume on Next */
    if (S.reviewMode) { S.reviewMode = false; renderReview(); showScreen('review'); return; }
    advance();
  }
  function advance() {
    var nxt = -1;
    for (var j = S.current + 1; j < EXERCISES.length; j++) { if (S.answers[j].status === 'unanswered') { nxt = j; break; } }
    if (nxt < 0) { /* none forward: go to review or results */
      for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered') { nxt = k; break; } }
    }
    if (nxt >= 0) renderExercise(nxt);
    else finishExam(false);
  }

  /* ---------------- review-skipped screen ---------------- */
  function renderReview() {
    var root = $('screen-review'); root.innerHTML = '';
    var c = el('div', 'card');
    c.appendChild(el('h2', null, '⚠ Review skipped exercises'));
    var open = S.skipped.filter(function (i) { return S.answers[i].status === 'skipped'; });
    if (open.length === 0) {
      c.appendChild(el('p', null, 'No skipped exercises left — everything was answered.'));
    } else {
      c.appendChild(el('p', 'dd-hint', 'You can return to any skipped exercise and answer it while the timer has not ended. Skipped-and-never-answered exercises are excluded from your score.'));
      open.forEach(function (i) {
        var row = el('div', 'rev-item');
        row.appendChild(el('span', 'ri-id', esc(EXERCISES[i].id)));
        row.appendChild(el('span', 'ri-sum', esc(EXERCISES[i].summary)));
        var b = el('button', 'btn btn-blue', '↩ Return to it');
        b.type = 'button'; b.setAttribute('aria-label', 'Return to ' + EXERCISES[i].id);
        b.addEventListener('click', function () { S.reviewMode = true; S.reviewFrom = 'review'; showScreen('exam'); renderExercise(i); });
        row.appendChild(b);
        c.appendChild(row);
      });
    }
    var acts = el('div', 'actions');
    var back = el('button', 'btn btn-ghost', '← Keep working (unanswered exercises)');
    back.type = 'button';
    back.addEventListener('click', function () {
      var u = -1; for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered' && S.skipped.indexOf(k) < 0) { u = k; break; } }
      if (u < 0) u = -1;
      if (u >= 0) { showScreen('exam'); renderExercise(u); } else { finishExam(false); }
    });
    var fin = el('button', 'btn btn-primary', '⏹ Final submit');
    fin.type = 'button'; fin.setAttribute('aria-label', 'Final submit and show results');
    fin.addEventListener('click', function () { finishExam(false); });
    acts.appendChild(back); acts.appendChild(el('span', 'spacer')); acts.appendChild(fin);
    c.appendChild(acts);
    root.appendChild(c);
  }

  /* ---------------- results ---------------- */
  function finishExam(timeout) {
    var anySkippedOpen = S.skipped.some(function (i) { return S.answers[i].status === 'skipped'; });
    if (!timeout && anySkippedOpen && S.timerState !== 'ENDED' && S.screen !== 'review') { renderReview(); showScreen('review'); return; }
    setTimerState('ENDED');
    var r = creditSum();
    var answered = r.n;
    var percent = answered > 0 ? Math.round((r.sum / answered) * 100) : 0;
    var passed = percent >= (META.passMark || 70);
    /* counts */
    var full = 0, part = 0, zero = 0, skipped = 0, partSum = 0;
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status;
      if (st === 'checked') {
        var cr = S.answers[i].credit;
        if (cr >= 1) full++;
        else if (cr > 0) { part++; partSum += cr; }
        else zero++;
      } else if (st === 'skipped') skipped++;
      else skipped++; /* unanswered at submit = excluded */
    });
    var root = $('screen-results'); root.innerHTML = '';
    var hero = el('div', 'card');
    var verdictTxt = passed ? '✓ PASS' : '✗ FAIL';
    hero.appendChild(el('div', 'res-hero',
      '<div><div class="res-score">' + percent + '%<small> · ' + r.sum.toFixed(1) + ' / ' + answered + ' credits</small></div>' +
      '<div class="dd-hint">scored over answered exercises only — skipped and never-answered are excluded</div></div>' +
      '<div class="verdict ' + (passed ? 'pass' : 'fail') + '">' + verdictTxt + '</div>'));
    root.appendChild(hero);
    var grid = el('div', 'res-grid');
    function cell(n, l, cls, ic) { return '<div class="res-cell"><div class="rc-n ' + (cls || '') + '">' + n + '</div><div class="rc-l"><span>' + ic + '</span><span>' + l + '</span></div></div>'; }
    grid.innerHTML =
      cell(full, 'Fully correct', 'ok-c', '✓') +
      cell(part + (part > 0 ? ' <small style="font-size:.8rem;color:var(--text-secondary)">(avg ' + (partSum / part).toFixed(2) + ')</small>' : ''), 'Partially correct', 'no-c', '✓') +
      cell(zero, 'Fully incorrect', 'no-c', '✗') +
      cell(skipped, 'Skipped — excluded', 'mi-c', '⚠');
    var gcard = el('div', 'card'); gcard.appendChild(grid);
    gcard.appendChild(el('div', 'dd-hint', '⏸ Time paused manually: ' + fmtTime(Math.round(S.manualPauseMs / 1000)) + ' · ⏸ Time reviewing feedback (auto-pause): ' + fmtTime(Math.round(S.autoPauseMs / 1000)) + ' · ⏱ Time used: ' + fmtTime((META.estimatedMinutes * 60) - S.remaining) + (timeout ? ' (timer ran out)' : '')));
    /* per-exercise strip */
    var strip = el('div', 'strip');
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status, cr = S.answers[i].credit;
      var cls = st === 'checked' ? (cr >= 1 ? 'st-ok' : cr > 0 ? 'st-pa' : 'st-no') : 'st-sk';
      var ic = st === 'checked' ? (cr >= 1 ? '✓' : cr > 0 ? '±' : '✗') : '⚠';
      var chip = el('span', 'st-chip ' + cls, ic);
      chip.title = ex.id + (st === 'checked' ? ' — credit ' + cr.toFixed(2) : ' — skipped/excluded');
      chip.setAttribute('aria-label', chip.title);
      strip.appendChild(chip);
    });
    gcard.appendChild(strip);
    root.appendChild(gcard);
    var acts = el('div', 'actions');
    var rt = el('button', 'btn btn-primary', '↺ Retake the exam');
    rt.type = 'button'; rt.setAttribute('aria-label', 'Retake the exam');
    rt.addEventListener('click', retake);
    acts.appendChild(rt);
    root.appendChild(el('div', 'card', '')).appendChild(acts);
    showScreen('results');
    /* report exactly once per attempt */
    if (!S.reported) {
      S.reported = true;
      reportScore(r.sum, answered);
    }
  }
  function retake() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    S.skipped = []; S.current = 0; S.reviewMode = false; S.reported = false; S.attempt++;
    S.manualPauseMs = 0; S.autoPauseMs = 0; S.priorState = null;
    buildShuffles();
    setTimerState('RUNNING'); S.remaining = (META.estimatedMinutes || 15) * 60;
    showScreen('exam'); renderExercise(0);
  }
  function reportScore(creditSumV, answeredCount) {
    var percent = answeredCount > 0 ? Math.round((creditSumV / answeredCount) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: META.topicId,
        batch: META.batch,
        score: Math.round(creditSumV),
        total: answeredCount,
        percent: percent,
        passed: percent >= 70
      }, location.origin);
    } catch (e) { /* opened directly rather than inside the site — nothing to report to */ }
  }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) return;
    var type = event.data.type;
    if (type !== 'CYBERPULSE_INIT' && type !== 'CYBERMASTERY_INIT') return;
    try {
      if (event.data.username) {
        var c = $('tbCandidate');
        c.textContent = '👤 ' + String(event.data.username).slice(0, 24);
        c.classList.remove('hidden');
      }
      /* country, locale, topicId, batch are consumed; theme is always 'dark' — this file is dark-only by contract */
    } catch (e) { }
  });

  /* ---------------- boot ---------------- */
  function boot() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    buildShuffles();
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    renderIntro();
    showScreen('intro');
  }
  window.__CP_BOOT__ = boot;
})();
