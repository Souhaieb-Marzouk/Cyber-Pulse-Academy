<script>window.__EXAM_DATA__ = {"meta":{"topicId":"t1690","techId":"T1690","objectLine":"T1690 — Prevent Command History Logging · MITRE ATT&CK Technique (Enterprise) · Tactic: Defense Impairment · Platforms: ESXi, Linux, Network Devices, Windows, macOS · Created 14 April 2026 (ATT&CK v20, version 1.0)","batch":4,"difficulty":"extremely-hard","examTitle":"T1690 — EXTREMELY HARD practice exam","sevWord":"EXTREMELY HARD","estimatedMinutes":60,"timerSec":3600,"passMark":70},"intro":{"learn":["This is the expert tier for the MITRE ATT&CK technique T1690 — Prevent Command History Logging. The behaviour itself is simple: an attacker stops the shell, the hypervisor or the network device from saving the commands they type, so the most honest local record of the intrusion never exists. What makes this tier hard is everything around that behaviour: partial evidence, contradictory signals, change-window noise, and decisions that cost real money or destroy real evidence if you get them wrong.","You will work cases the way senior people do. An incident lead must decide which signal wins when an approved change and an intrusion look identical. A responder must weigh isolating a hypervisor that runs two hundred virtual machines against the evidence that dies with it. A detection engineer must tune absence-based analytics without drowning the team in false positives. A CTI analyst must attribute with confidence levels, not certainty. Every case here mirrors one of those decisions.","The material still comes from the same ATT&CK page: HISTFILE, HISTFILESIZE and HISTCONTROL tampering; PSReadLine suppression on Windows; vmsyslogd stopped on ESXi; 'no logging' typed into perimeter devices; procedure examples from BPFDoor, UNC3886's RedPenguin on Junos routers, VIRTUALPITA on hypervisors, and the ArcaneDoor campaign on Cisco ASA; the DET0563 analytics AN1555 through AN1559; and the two mitigations M1039 and M1028.","There is no shame in using a hint here — but spend it wisely, and remember that in several cases the correct move is deliberately the quiet one: preserve first, escalate early, do not touch. If a famous best practice would cost you the evidence or two hundred VMs, this exam expects you to say so."],"roles":["Senior SOC analyst","Incident commander","Senior detection engineer","Threat hunting lead","CTI lead","Red team lead","CISO advisor / GRC lead"],"keywords":[{"theme":"Chain reasoning on the technique","items":["T1690 — Prevent Command History Logging across ESXi, Linux, Network Devices, Windows, macOS","Defense Impairment — the tactic; neighbouring techniques (clearing, disabling other logging)","Prevent vs clear vs disable — three families that are easy to blur under pressure"]},{"theme":"Variables, files and services under attack","items":["HISTFILE / HISTFILESIZE / HISTCONTROL — and the HISTSIZE near-miss","ignorespace vs ignoredups vs ignoreboth — which value hides what","MYSQL_HISTFILE — database client history pointed at /dev/null (BPFDoor, Sea Turtle)","vmsyslogd (ESXi), dslogserver (Ivanti), syslogd — logging services stopped","'no logging' — perimeter device CLI disabling the record (ArcaneDoor pattern)"]},{"theme":"Evidence under pressure","items":["/proc/<PID>/environ — volatile, read-only capture before anything changes state","Absence of expected history writes — noise alone, signal when correlated with active sessions","Conflicting signals — change tickets vs behaviour; service-account patterns vs user context"]},{"theme":"Analytics and their false-positive profile","items":["DET0563 strategy — AN1555 through AN1559 by platform","FP sources — admin dotfile changes, onboarding images, developer profiles, maintenance windows","Tuning — baseline, correlate, document, deploy, review"]},{"theme":"Controls and cost","items":["M1039 Environment Variable Permissions — lock the variables at build level","M1028 Operating System Configuration — ignoredups, not ignoreboth","Response economics — isolation costs, evidence loss, business impact"]}],"how":["Pass mark: 70% over the exercises you actually answer; skipped-and-never-answered exercises leave both sides of the ratio.","You have 16 exercises and 60 minutes. Most exercises chain three or more ideas and include at least one signal that fights the others.","Check stops the timer automatically (⏸ PAUSED — reviewing feedback) and Next restarts it. The feedback is part of the learning — read the per-step and per-item reasoning.","Pause hides everything and stops the clock until you press Resume.","Partial credit applies to every multi-item exercise: max(0, (H − W) / N). Wrong picks cancel right picks — commit only when the artefacts support you.","One hint per exercise costs 10% of that exercise's credit; hints restate a constraint, they never name the answer.","Skip parks exercises for the review list; the timer keeps running through skips, and unfinished exercises are excluded at submit.","Two terminal exercises simulate shells (one device CLI, one Linux). You get the objective and the environment only. Destructive commands are marked as dangerous near misses and cost credit."]},"exercises":[{"id":"ext-01","type":"branch","title":"Nightside Corp — first hour","scenario":{"summary":"Five artefacts, one decision path — the CISO wants a call in 10 minutes","arts":[{"label":"ARTEFACT 1 — EDR alert, jump-lin-07, 03:12","mono":true,"body":"user contractor-milan (external, project Aurora)\ncmd=\"unset HISTFILE\" ; cmd=\"export HISTFILESIZE=0\"\nparent: sshd, source AS unknown to the asset list"},{"label":"ARTEFACT 2 — /proc/8841/environ excerpt (captured 03:19)","mono":true,"body":"HISTFILE=(unset)\nHISTFILESIZE=0\nSSH_CLIENT=10[.]44[.]9[.]77 51122 22"},{"label":"ARTEFACT 3 — syslog gap timeline, perimeter","mono":true,"body":"03:05 device asa-perim-01: 'no logging' committed from vpn-admin-2\n03:05-03:55 VPN sessions continue; zero new session-log lines"},{"label":"ARTEFACT 4 — change ticket CHG-7781","mono":false,"body":"Approved maintenance window 03:00-05:00, scope: 'jump host patching'.\nOwner: platform team. Contractor-milan is NOT in the implementer list.\nNo ticket covers perimeter device logging changes."},{"label":"ARTEFACT 5 — CTI note","mono":false,"body":"Device-side logging disablement paired with shell history tampering on jump hosts\nmatches published intrusion patterns for targeted espionage operations."}]},"question":"Lead the first hour: resolve the conflict, act, escalate, report — four steps.","hint":"The ticket's scope is your scalpel: what it covers, and what it does not. Preservation beats disruption while the sessions are live.","explain":"The conflict resolves on scope and pairing: CHG-7781 covers jump host patching only, and no ticket covers the device change, while the two tamperings pair across platforms exactly as targeted-intrusion patterns describe — so the malicious reading wins. The right first action is read-only preservation (the environment was captured at 03:19, keep going) because the sessions are live and volatile. Escalation goes to the incident commander and the network owner with the change freeze, and the report maps the pair of behaviours to T1690 with AN1555 and AN1559 as the correlating analytics.","study":"Scope of the ticket + cross-platform pairing = the conflict resolver. Volatility dictates the order of actions.","branch":{"sim":true,"best":"Malicious: un-ticketed device change plus ticketed-out-of-scope jump host tampering; preserve read-only, escalate wide, report T1690 with AN1555/AN1559.","steps":[{"question":"STEP 1 OF 4 — The change ticket contradicts the EDR alert. Which signal wins, and why?","opts":[{"t":"Malicious wins: the ticket covers patching only, no ticket covers the device change, and the two tamperings pair across platforms.","good":true,"why":"Correct: scope analysis plus cross-platform pairing defeats the benign reading.","outcome":"You declare a suspected intrusion and keep the evidence alive."},{"t":"The ticket wins: maintenance windows explain odd commands; downgrade everything to informational.","good":false,"why":"Wrong: the ticket's scope does not cover either the contractor's commands or the device.","outcome":"The response is stood down; the intrusion consolidates."},{"t":"Both signals are equally likely; take no position until morning.","good":false,"why":"Wrong: the pairing and scope gap are decisive enough to act now.","outcome":"Twelve hours of dwell time are gifted to the actor."}]},{"question":"STEP 2 OF 4 — Sessions are live. What runs first?","opts":[{"t":"Read-only volatile capture: process environments, session lists, device config dumps.","good":true,"why":"Correct: volatile-first read-only collection preserves proof without altering state.","outcome":"Environments and configs are secured; nothing tipped off."},{"t":"Isolate jump-lin-07 at the switch to freeze the attacker.","good":false,"why":"Wrong: isolation ends the live sessions and the evidence they carry, before capture.","outcome":"The richest evidence dies with the sessions."},{"t":"Reboot the perimeter device to clear the injected config.","good":false,"why":"Wrong: rebooting destroys volatile device state and does not remove committed config.","outcome":"State tables and session evidence are lost."}]},{"question":"STEP 3 OF 4 — Who must be pulled in now?","opts":[{"t":"Incident commander plus the network device owner, with a change freeze on both platforms.","good":true,"why":"Correct: two platforms are affected; both owners must freeze changes.","outcome":"A coordinated case opens with a freeze in place."},{"t":"Only the platform team; the device change is probably vendor maintenance.","good":false,"why":"Wrong: no ticket supports vendor maintenance on the device.","outcome":"The device team re-enables logging blind and destroys the diff context."},{"t":"Nobody yet — wait for the contractor to reply to an email.","good":false,"why":"Wrong: asking the suspected actor tips them off.","outcome":"The actor cleans up and vanishes."}]},{"question":"STEP 4 OF 4 — Which mapping goes into the first report?","opts":[{"t":"T1690 on both platforms, correlated by AN1555 (shell variables) and AN1559 (device CLI).","good":true,"why":"Correct: the two analytics cover exactly the two behaviours observed.","outcome":"The report is precise and defensible."},{"t":"T1070.003 — both artefacts show history being cleared.","good":false,"why":"Wrong: nothing was cleared; records were prevented from existing.","outcome":"The report misleads the responders."},{"t":"No ATT&CK mapping until attribution is confirmed.","good":false,"why":"Wrong: behaviour mapping never waits for attribution.","outcome":"Detection engineering loses its anchor."}]}]}},{"id":"ext-02","type":"terminal","title":"Perimeter device, read-only","scenario":{"summary":"asa-perim-01 — prove the logging state without changing anything","arts":[{"label":"ARTEFACT 1 — your tasking","mono":false,"body":"You have a read-only session on asa-perim-01 (Cisco-style CLI). Legal needs evidence that\nsurvives scrutiny of exactly which logging lines are active in the running configuration.\nConstraint: configuration mode is forbidden; anything that alters or erases state is a finding."}]},"question":"Type the one-line privileged command that prints only the logging-related lines of the running configuration.","hint":"You want the running config, filtered to logging lines. Think show plus a pipe filter.","explain":"show running-config | include logging prints only the logging lines of the running config — read-only, evidence-grade, and copyable into the report. Running 'no logging' is the very action under investigation and changes state; write erase and reload destroy or reset the device. The pipe keeps the output bounded so it can be attached to the case file.","study":"On devices, the read-only show pipeline is your evidence tool; configuration mode is the suspect's tool.","terminal":{"prompt":"asa-perim-01#","banner":["# asa-perim-01 — privileged mode, READ-ONLY tasking","# legal hold in effect: no configuration changes"],"solution":"show running-config | include logging","elements":[{"re":"^\\s*show\\s+running-config\\b","label":"shows the running configuration","why":"The running config is the authoritative current state."},{"re":"\\|\\s*include\\s+logging","label":"filters with | include logging","why":"The filter bounds the output to logging lines."}],"dangerous":[{"re":"^\\s*(conf\\s*t|configure\\s+terminal)\\b","label":"enters configuration mode","why":"Configuration mode is forbidden under the legal hold and enables state changes."},{"re":"no\\s+logging","label":"'no logging' — the very action under investigation","why":"Running the attack command changes state and destroys the evidence posture."},{"re":"write\\s+erase|reload","label":"erase or reload the device","why":"Either action destroys device state and evidence."}],"panel":null,"sampleOut":null,"output":["no logging enable","no logging host inside 10[.]31[.]4[.]15"]}},{"id":"ext-03","type":"qcm","title":"Two analysts, one unset","scenario":{"summary":"Disagreement on jump-lin-07 — resolve it with the artefacts","arts":[{"label":"ARTEFACT 1 — analyst A (triage)","mono":false,"body":"'HISTFILE unset on jump-lin-07 is attacker behaviour. We should escalate now.'"},{"label":"ARTEFACT 2 — analyst B (engineering)","mono":false,"body":"'Our EDR health check unsets HISTFILE hourly as a self-test. This is noise.'"},{"label":"ARTEFACT 3 — the facts","mono":true,"body":"health-check pattern: svc-edr, every hour, parent=edr-agent, no interactive tty\nobserved event:    contractor-milan, 03:12, parent=sshd, tty=pts/2,\n                   source AS not on the asset list, session still open"}]},"question":"Which resolution is defensible to the review board?","hint":"Both can be true. The discriminator is the pattern: who, from where, under which parent, and is the session still alive?","explain":"The hourly self-test is real — that is why analyst B is not foolish — but the observed event breaks the benign pattern on every axis: wrong account, wrong parent, interactive tty, unknown source, and a session that is still open. Pattern deviation plus a live session outweighs the existence of a benign twin, so the defensible call is malicious-pending-verification, with the benign pattern documented as the false-positive profile.","study":"False positives are patterns; you defeat them by showing the event breaks the pattern, not by shouting.","qcm":{"correct":1,"opts":[{"t":"Analyst B is right: the health check exists, so this is noise.","why":"Wrong: the existence of a benign pattern does not explain an event that breaks it on every axis."},{"t":"Treat it as malicious pending verification — the event breaks the benign pattern.","why":"Correct: pattern deviation with a live session is the defensible reading."},{"t":"Disable the EDR health check so the signal stops being ambiguous.","why":"Wrong: that blinds the team and changes nothing about the real event."},{"t":"Escalate as confirmed attribution to a named group immediately.","why":"Wrong: attribution needs more than one behaviour; the decision at hand is triage, not naming."}]}},{"id":"ext-04","type":"branch","title":"Hypervisor estate under stress","scenario":{"summary":"Forty ESXi hosts, three alarms, one key — scope it in four steps","arts":[{"label":"ARTEFACT 1 — vCenter events","mono":true,"body":"esx-cluster-B: vmsyslogd stopped on esx-b-03, esx-b-17, esx-b-29 (02:00-02:20)\nlocal admin shell sessions opened on all three from one source IP"},{"label":"ARTEFACT 2 — auth log","mono":true,"body":"svc-hvadm key used from unknown IP 10[.]99[.]7[.]3 (not on the jump host list)\nsame key fingerprint as the service account's normal use"},{"label":"ARTEFACT 3 — estate facts","mono":false,"body":"40 ESXi hosts in cluster B; 200 production VMs on the three alarmed hosts;\nVM storage traffic rides the same management network as the hosts; business peak starts 08:00."},{"label":"ARTEFACT 4 — ATT&CK anchor","mono":false,"body":"VIRTUALPITA (S1217) on ESXi: HISTFILE zeroed and vmsyslogd stopped — the observed pair matches."}]},"question":"Scope and contain the estate in four steps.","hint":"Three hosts are seen; the key is one. Isolation here has a price tag attached to it.","explain":"Scope first: the key, not the hosts, defines the blast radius, so all 40 hosts are checked for the same service state and shell variables. Containment keeps the VMs running (the cost of cutting storage for 200 machines is rejected) but revokes the key and blocks the source IP. The detection anchor is AN1558, and the report cites the VIRTUALPITA pattern for the variable-plus-service pair.","study":"Scope on identity (the key), not on the alarms; accept cost only where it buys evidence or safety.","branch":{"sim":true,"best":"Scope via the compromised key across all 40 hosts; revoke and block without dropping the VMs; anchor on AN1558 and the VIRTUALPITA pattern.","steps":[{"question":"STEP 1 OF 4 — What defines the scope of the sweep?","opts":[{"t":"The compromised key: sweep all 40 hosts for the service state and variable pair.","good":true,"why":"Correct: identity defines blast radius; the three alarms are the observed subset.","outcome":"Two more hosts surface with the same pair but no alarm."},{"t":"Only the three alarmed hosts; the rest are clean until proven otherwise.","good":false,"why":"Wrong: one key reached all hosts; the alarms only show where it acted so far.","outcome":"Two compromised hosts are missed."},{"t":"The whole datacenter including storage arrays.","good":false,"why":"Wrong: no artefact puts the actor anywhere outside the cluster.","outcome":"The sweep drowns the team in noise."}]},{"question":"STEP 2 OF 4 — Containment with 200 VMs at stake. What do you choose?","opts":[{"t":"Revoke the key, block the source IP, keep the hosts serving VMs.","good":true,"why":"Correct: it cuts the actor's access at minimum business cost and preserves hosts for evidence.","outcome":"Access is cut; VMs and evidence survive."},{"t":"Isolate the three hosts from the management network immediately.","good":false,"why":"Wrong: storage and management traffic ride that network — 200 VMs drop.","outcome":"Business outage at peak hours; volatile evidence frozen, not captured."},{"t":"Wait for the night shift to decide.","good":false,"why":"Wrong: the key is live; delay is exposure.","outcome":"The actor moves laterally with the key."}]},{"question":"STEP 3 OF 4 — Which analytic anchors the detection write-up?","opts":[{"t":"AN1558 — ESXi shells with unset HISTFILE, correlated with service stops.","good":true,"why":"Correct: it is the ESXi-focused analytic for exactly this pair.","outcome":"The detection write-up has the right anchor."},{"t":"AN1557 — PowerShell history suppression.","good":false,"why":"Wrong: no Windows host is in this case.","outcome":"The write-up maps the wrong platform."},{"t":"AN1559 — device CLI 'no logging'.","good":false,"why":"Wrong: no network device is involved here.","outcome":"The write-up confuses platforms."}]},{"question":"STEP 4 OF 4 — Which pattern goes into the CTI paragraph?","opts":[{"t":"The VIRTUALPITA pattern: HISTFILE zeroed plus vmsyslogd stopped on ESXi.","good":true,"why":"Correct: the observed pair is the page's ESXi example.","outcome":"The paragraph is anchored to a named example."},{"t":"The BPFDoor (S1161) pattern: MYSQL_HISTFILE and HISTFILE to /dev/null.","good":false,"why":"Wrong: that is a Linux/MySQL mechanism, not ESXi services.","outcome":"The paragraph mixes cases."},{"t":"No pattern: hypervisors are never targeted.","good":false,"why":"Wrong: the page's ESXi examples prove the opposite.","outcome":"The paragraph dismisses real targeting."}]}]}},{"id":"ext-05","type":"order","title":"Order the response under cost","scenario":{"summary":"Four actions, real money and real evidence at stake","arts":[{"label":"ARTEFACT 1 — constraint memo","mono":false,"body":"The jump host pair (jump-lin-07, jump-lin-09) is live-affected. Costs on the table:\nsnapshots and config dumps cost nothing; isolation freezes evidence and stops two build pipelines;\nreimaging the pair destroys the case and costs a day of rebuild. Order the actions."}]},"question":"Order the response actions from first to last.","hint":"Free things that preserve proof go first; the expensive, destructive step goes last — if ever.","explain":"Volatile snapshots and read-only dumps preserve everything at zero cost, so they go first. Config capture on the device side follows while the change freeze holds. Isolation comes third: it is disruptive and freezes live evidence, so it happens only after capture. Reimaging is last because it destroys the case — and here it should ideally never run, only stand by.","study":"Order by (cost, reversibility, evidence preserved) — never by how satisfying the action feels.","order":{"items":[{"t":"Volatile capture on both jump hosts (environments, sessions, command telemetry).","why":"Zero cost, fully reversible, preserves the most perishable proof."},{"t":"Read-only config dumps on the affected device, inside the change freeze.","why":"Cheap and evidence-grade; must precede any device change."},{"t":"Isolate the two jump hosts once capture completes.","why":"Disruptive and evidence-freezing — only after capture."},{"t":"Rebuild hosts from golden images as the final, last-resort step.","why":"Destroys the case; only after everything is captured and signed off."}]}},{"id":"ext-06","type":"multi","title":"What runs now — and what must wait","scenario":{"summary":"Pick the actions the first hour supports","arts":[{"label":"ARTEFACT 1 — state of the case (post triage)","mono":false,"body":"Confirmed: history tampering on two jump hosts, un-ticketed device change, sessions still live.\nResources: one responder, one network engineer, an IR bridge on standby.\nLegal has asked to be paged before any destructive step."}]},"question":"Select every action that the first hour actually supports.","hint":"Three actions protect or gather; two actions either tip off the actor or destroy the case.","explain":"Preserving volatile data, standing up the IR bridge with the network team, and explicitly deferring reimage until capture completes are all supported: they protect proof and coordinate response. Rebooting clears memory; emailing the contractor gives the actor — possibly a compromised account — a warning shot.","study":"Every supported action either preserves evidence, coordinates response, or refuses destruction.","multi":{"opts":[{"t":"Preserve live environments and session telemetry read-only.","correct":true,"why":"Correct: volatile-first preservation is the backbone of the case."},{"t":"Open the IR bridge and page the network device owner.","correct":true,"why":"Correct: two platforms, two owners, one coordinated case."},{"t":"Defer any reimage until volatile capture is complete and legal signs off.","correct":true,"why":"Correct: the 'do nothing yet' decision protects the evidence."},{"t":"Reboot both jump hosts to evict the live sessions.","correct":false,"why":"Wrong: rebooting destroys the live evidence the case depends on."},{"t":"Email contractor-milan asking whether they tampered with history.","correct":false,"why":"Wrong: it tips off whoever holds the account, human or not."}]}},{"id":"ext-07","type":"qcm","title":"Attribution, carefully","scenario":{"summary":"Router case — pattern overlap is not proof","arts":[{"label":"ARTEFACT 1 — evidence list","mono":true,"body":"- RedPenguin (C0056)-style malware injecting into Junos OS processes\n- HISTFILE cleared on router shells; syslog inhibited from inside processes\n- targets: European telecom edge routers\n- overlap: tooling and behaviour match UNC3886 reporting"},{"label":"ARTEFACT 2 — caution note","mono":false,"body":"Tooling reuse and false flags exist. Shared TTPs are probability, not identity."}]},"question":"Which attribution statement belongs in the report?","hint":"Confidence language must match evidence weight — and 'certainly' is never one of the options here.","explain":"The behaviour and tooling overlap with published UNC3886 (G1048) activity is substantial: injection into Junos processes to inhibit logging plus router shell history tampering is the RedPenguin pattern. But shared tooling is probability, so the defensible line is moderate-confidence attribution with the reasoning shown. APT38 is a financially motivated actor with different targeting, Sea Turtle operates a different campaign profile, and certainty claims or evidence destruction are never report-grade.","study":"Attribution = behaviour overlap + targeting + capability, stated with calibrated confidence.","qcm":{"correct":0,"opts":[{"t":"Moderate confidence: UNC3886 (G1048), from Junos injection overlap.","why":"Correct: calibrated confidence with the reasoning attached."},{"t":"Confirmed UNC3886 operation, no caveats needed.","why":"Wrong: tooling overlap is not identity; reports need confidence language."},{"t":"APT38, because they also tamper with shell history.","why":"Wrong: APT38's profile is financial and its space-prefix habit does not match router injection."},{"t":"Withhold the report until the routers are reimaged for certainty.","why":"Wrong: reimage destroys the evidence needed for attribution."}]}},{"id":"ext-08","type":"match","title":"Tune the analytics","scenario":{"summary":"Match each analytic to its dominant false-positive source","arts":[{"label":"ARTEFACT 1 — tuning workshop board","mono":false,"body":"Four analytics, four noisy neighbourhoods:\nadmins edit dotfiles, onboarding images ship odd history states,\ndevelopers customise PSReadLine paths, and maintenance windows touch device logging.\nMatch each analytic to the noise it must learn to ignore."}]},"question":"Match each analytic to its dominant false-positive source.","hint":"Think about who legitimately performs a lookalike action on each platform.","explain":"AN1555's noise is admins changing HISTCONTROL in dotfiles, so it must correlate with change tickets and sessions. AN1556 trips on fresh onboarding images whose history files have never flushed, so it baselines host age. AN1557 meets developers who legitimately redirect HistorySavePath, so it allowlists known profiles. AN1559 sees maintenance windows reconfiguring device logging, so it pairs with change records.","study":"Every strong analytic has a named, documented false-positive profile.","match":{"pairs":[{"l":"AN1555 — env-var tampering with live sessions","r":"Admins editing HISTCONTROL in dotfiles during hardening","why":"Legitimate hardening looks identical until tickets and sessions are correlated."},{"l":"AN1556 — bash history stops updating","r":"Fresh onboarding images with never-flushed history files","why":"New hosts have quiet history files by construction; baseline on age."},{"l":"AN1557 — PSReadLine options changed","r":"Developer profiles redirecting HistorySavePath legitimately","why":"Known developer setups must be allowlisted by path and owner."},{"l":"AN1559 — device CLI disables logging","r":"Maintenance windows reconfiguring device logging","why":"Change records separate planned reconfigurations from stealth."}]}},{"id":"ext-09","type":"terminal","title":"Prove absence, read-only","scenario":{"summary":"fin-db-gw02 — the CISO wants proof that will survive scrutiny","arts":[{"label":"ARTEFACT 1 — tasking","mono":false,"body":"Account svc-deploy is logged in interactively on fin-db-gw02 and its ~/.bash_history\nis suspected to be suppressed. Legal wants evidence that shows BOTH facts at once:\nthat a session is live, and that the history file holds no content.\nRead-only only. Two separate facts, one line each is acceptable; a single line is better."}]},"question":"Type one compound line (two commands joined with &&) that shows the live sessions and counts the lines of /home/svc-deploy/.bash_history.","hint":"One classic command lists who is logged in; another counts lines in a file. Join them so both outputs appear.","explain":"w && wc -l /home/svc-deploy/.bash_history prints the live sessions (proving the interactive session) and then the line count of the history file (proving emptiness) — two facts, one read-only line. Truncating the file with : > proves nothing and destroys evidence, and history -c only clears memory. Ordering with && also proves the first command succeeded before the second ran.","study":"Evidence lines should bind two facts together — that is what makes them scrutiny-proof.","terminal":{"prompt":"auditor@fin-db-gw02","banner":["# read-only evidence session — fin-db-gw02","# legal hold: nothing may be modified"],"solution":"w && wc -l /home/svc-deploy/.bash_history","elements":[{"re":"(^|\\|\\||&&|;)\\s*w\\s*($|&&|;|\\|)","label":"runs w to list live sessions","why":"w proves the interactive session exists right now."},{"re":"wc\\s+-l\\s+/home/svc-deploy/\\.bash_history","label":"counts lines of the exact history file","why":"A zero line count proves the file holds nothing."},{"re":"&&","label":"joins both facts with &&","why":"The chain proves the session check succeeded before the count ran."}],"dangerous":[{"re":":\\s*>\\s*/home/svc-deploy/\\.bash_history|>\\s*/home/svc-deploy/\\.bash_history","label":"truncates the history file","why":"Truncation destroys the very record under investigation."},{"re":"history\\s+-c","label":"clears in-memory history","why":"Clearing memory alters the session state you are auditing."},{"re":"rm\\s+","label":"removal command in a legal-hold session","why":"Nothing may be deleted under the hold."}],"panel":null,"sampleOut":null,"output":["USER     TTY      FROM             LOGIN@   WHAT","svc-deploy  pts/3    10[.]44[.]9[.]77   03:12    bash","0 /home/svc-deploy/.bash_history"]}},{"id":"ext-10","type":"branch","title":"The morning queue, four deep","scenario":{"summary":"Four alerts, one is the intrusion, two are noise patterns","arts":[{"label":"ARTEFACT 1 — queue at 07:55","mono":true,"body":"Q-01  lin-app12  214 space-prefixed commands in one session (auditd)\nQ-02  lin-app12  svc-edr unset HISTFILE at 07:00 (hourly health check)\nQ-03  esx-b-17   vmsyslogd stopped 02:14; HISTFILE=0 in shell session\nQ-04  lin-bkp01  cron archived .bash_history (signed script, ticket CHG-2211)"}]},"question":"Work the queue in three steps: pick, resolve, summarise.","hint":"Freshness and impact first; the health check has a documented twin; the cron has a signature and a ticket.","explain":"Q-01 is the freshest, most voluminous evidence of active hiding, so it goes first. Q-02 resolves as noise because it matches the documented hourly service-account pattern exactly — the false-positive profile exists for precisely this. Q-03 is real and pairs with Q-01's host family into a coordinated story: hiding at the shell layer and the hypervisor layer at once. The queue's lesson is that targeted impairment across layers is the intrusion narrative, while pattern-matched twins and signed maintenance are the noise.","study":"Triage = freshness, volume, pattern-match against documented FPs, then narrative across layers.","branch":{"sim":true,"best":"Q-01 leads; Q-02 is documented noise; Q-03 pairs with Q-01 into a cross-layer intrusion narrative.","steps":[{"question":"STEP 1 OF 3 — Which alert do you work first?","opts":[{"t":"Q-01 — 214 space-prefixed commands in a live session.","good":true,"why":"Correct: freshest, highest-volume evidence of active hiding.","outcome":"The session is captured and the hunt widens."},{"t":"Q-02 — the hourly EDR health check.","good":false,"why":"Wrong: it matches the documented benign pattern exactly.","outcome":"The shift is burned on a known twin."},{"t":"Q-04 — the signed archive cron.","good":false,"why":"Wrong: signature and ticket make it the weakest candidate.","outcome":"Maintenance noise outranks an intrusion."}]},{"question":"STEP 2 OF 3 — How does Q-02 resolve?","opts":[{"t":"False positive: svc-edr hourly pattern, non-interactive, documented twin.","good":true,"why":"Correct: the event matches every axis of the documented FP profile.","outcome":"Q-02 is closed with the FP note attached."},{"t":"True positive: any unset HISTFILE is attacker behaviour.","good":false,"why":"Wrong: that reading ignores the documented pattern and would flood the queue daily.","outcome":"Alert fatigue rises; real signals drown."},{"t":"Suspicious: escalate to legal.","good":false,"why":"Wrong: nothing deviates from the benign pattern.","outcome":"Legal pages waste trust for nothing."}]},{"question":"STEP 3 OF 3 — What does the queue tell the commander?","opts":[{"t":"Coordinated hiding across shell and hypervisor layers (Q-01 + Q-03), with maintenance noise around it.","good":true,"why":"Correct: the narrative pairs the two genuine signals across layers.","outcome":"The commander scopes a cross-layer case."},{"t":"Four unrelated low events; file and move on.","good":false,"why":"Wrong: it misses the cross-layer pairing that changes severity.","outcome":"The case stays at noise level while the actor works."},{"t":"A backup infrastructure failure.","good":false,"why":"Wrong: nothing in the queue is a backup failure.","outcome":"The response targets the wrong system."}]}]}},{"id":"ext-11","type":"qcm","title":"When the best practice is wrong","scenario":{"summary":"CISO directive vs the economics of one host","arts":[{"label":"ARTEFACT 1 — directive","mono":false,"body":"CISO: 'Best practice is clear — isolate any host where logging was tampered with.\nDo it now for esx-b-17.'"},{"label":"ARTEFACT 2 — the host's reality","mono":true,"body":"esx-b-17: 68 production VMs; storage + vMotion ride the management network;\nkey revoked 20 minutes ago; volatile capture 80% complete; business peak in 40 min."}]},"question":"Which response to the CISO is technically correct here?","hint":"The directive was written for ordinary hosts. This host is not ordinary — and the key is already pulled.","explain":"Auto-isolation is the textbook move for a single compromised endpoint, but on a hypervisor whose management network carries storage and vMotion it would sever 68 VMs mid-peak — while the actor's access is already revoked and capture is 80% done. The correct answer accepts the cost consciously only when it buys safety; here a scoped block plus completing capture beats blanket isolation, and the answer says so with the economics attached.","study":"Best practices are defaults for ordinary cases; seniors re-derive them when the case is not ordinary.","qcm":{"correct":3,"opts":[{"t":"Isolate immediately — best practices are never questioned.","why":"Wrong: the practice assumes an ordinary host, not one carrying 68 VMs' traffic."},{"t":"Isolation has no cost here, so do it for speed.","why":"Wrong: it drops VM traffic and freezes evidence that is still being captured."},{"t":"Reimage the host instead — faster than isolation.","why":"Wrong: reimage destroys the case and costs a rebuild day."},{"t":"Keep the revocation and scoped blocks, finish capture, then decide isolation with the VM owners.","why":"Correct: it keeps access cut while avoiding a self-inflicted outage mid-peak."}]}},{"id":"ext-12","type":"drag","title":"Coverage map, estate edition","scenario":{"summary":"Five observed behaviours against three coverage buckets","arts":[{"label":"ARTEFACT 1 — estate coverage buckets","mono":false,"body":"Deployed analytics: AN1555/AN1556 (bash family) and AN1557 (Windows PowerShell).\nBuckets: 'Covered — bash', 'Covered — PowerShell', 'GAP — no analytic deployed'."}]},"question":"Drag each behaviour into the right coverage bucket.","hint":"Two buckets are honest about what is deployed; the gap bucket is where the new platforms live.","explain":"Unsetting HISTFILE and zeroing HISTFILESIZE on Linux servers sit in the covered bash bucket. The SaveNothing command on the Windows file server sits in the PowerShell bucket. The stopped vmsyslogd on ESXi and the 'no logging' line on the ASA are genuine gaps — no analytic is deployed for either platform, which is the finding the CISO needs before the next budget round.","study":"A coverage map is only useful when the gap bucket is allowed to exist.","drag":{"zones":[{"id":"z-bash","label":"Covered — bash analytics"},{"id":"z-ps","label":"Covered — PowerShell analytic"},{"id":"z-gap","label":"GAP — no analytic deployed"}],"items":[{"t":"unset HISTFILE on lin-app05","zone":"z-bash","why":"Bash variable tampering is exactly what AN1555 watches."},{"t":"HISTFILESIZE=0 found in .profile on lin-app05","zone":"z-bash","why":"The zeroed cap is the second bash pattern — covered."},{"t":"Set-PSReadLineOption -HistorySaveStyle SaveNothing on win-fs01","zone":"z-ps","why":"PSReadLine suppression is AN1557's home turf."},{"t":"vmsyslogd stopped on esx-mgmt03","zone":"z-gap","why":"No ESXi analytic (AN1558) is deployed — a genuine gap."},{"t":"'no logging' committed on asa-edge-02","zone":"z-gap","why":"No device analytic (AN1559) is deployed — a genuine gap."}]}},{"id":"ext-13","type":"fill","title":"Write the CTI paragraph","scenario":{"summary":"Executive report — four identifiers missing","arts":[{"label":"ARTEFACT 1 — draft paragraph (gaps marked ____)","mono":true,"body":"The intrusion shows behaviour consistent with technique ______ (Prevent Command\nHistory Logging) under the ______ tactic. We recommend enforcing ______ (Environment\nVariable Permissions) and deploying detection strategy ______ across the estate."}]},"question":"Place the four missing identifiers into the paragraph.","hint":"Technique ID, the tactic name, the variable-permission mitigation ID, and the strategy ID that bundles AN1555–1559.","explain":"The paragraph needs T1690 (the technique), Defense Impairment (the tactic that holds it), M1039 (the mitigation that locks the variables) and DET0563 (the detection strategy bundling the five analytics). T1070.003 is the clearing technique — the classic trap here — and M1028 is the ignoredups configuration, not the permission lock.","study":"Executives act on precise identifiers; each one routes to a different team.","fill":{"text":"The intrusion shows behaviour consistent with technique {{0}} (Prevent Command History Logging) under the {{1}} tactic. We recommend enforcing {{2}} (Environment Variable Permissions) and deploying detection strategy {{3}} across the estate.","slots":[{"correct":"T1690","why":"The behaviour is prevention of history logging — T1690."},{"correct":"Defense Impairment","why":"Defense Impairment is the tactic that holds T1690."},{"correct":"M1039","why":"M1039 is the Environment Variable Permissions mitigation."},{"correct":"DET0563","why":"DET0563 bundles the analytics AN1555 through AN1559."}],"bank":["T1690","Defense Impairment","M1039","DET0563","T1070.003","M1028"]}},{"id":"ext-14","type":"order","title":"Tune without drowning","scenario":{"summary":"Five tuning steps for the missing-writes analytic","arts":[{"label":"ARTEFACT 1 — tuning ticket DE-901","mono":false,"body":"AN1556 fires 60 times a day on the new estate. The tuning workflow has five steps,\nlisted shuffled in the answer area. Order them the way a senior detection engineer would."}]},"question":"Order the tuning steps from first to last.","hint":"Validate before you touch logic; document before you deploy; review is never the end.","explain":"First validate that alerts are genuinely firing as designed against raw artefacts — tuning an unvalidated rule is guesswork. Then baseline legitimate behaviour (host age, admin patterns) to learn the noise. Only then narrow the logic with the correlations that separate signal from noise. Document the exceptions so the next engineer inherits the reasoning, deploy, and schedule the review that keeps the analytic honest as the estate changes.","study":"Validate → baseline → narrow → document → deploy and review. Never narrow first.","order":{"items":[{"t":"Validate raw alerts against the artefacts that triggered them.","why":"Tuning starts by confirming the rule fires as designed."},{"t":"Baseline legitimate behaviour: host age, admin routines, onboarding noise.","why":"The noise profile must be measured before it can be filtered."},{"t":"Narrow the logic with correlations (session state, user context, tickets).","why":"Correlation is what separates the intrusion pattern from the noise."},{"t":"Document the exceptions and the false-positive profile.","why":"Written reasoning keeps the tuning auditable and transferable."},{"t":"Deploy the tuned logic and schedule a periodic review.","why":"Estates change; an unreviewed analytic rots."}]}},{"id":"ext-15","type":"qcm","title":"Validate like a purple team","scenario":{"summary":"Prove the detection works — without shipping attacker tooling","arts":[{"label":"ARTEFACT 1 — validation request","mono":false,"body":"The CISO wants proof that T1690 detections fire in production-like conditions.\nRules: no real malware, no production device changes, the test must exercise the telemetry."}]},"question":"Which validation plan satisfies the request and the rules?","hint":"The test must produce real telemetry events that the analytics can consume — but nothing destructive, nothing real.","explain":"A controlled emulation in an isolated production-like segment — running the same single-variable commands an attacker would, with telemetry wired exactly as in production — proves the analytics fire and the false-positive profile behaves. Real malware violates the rules, touching production devices violates them too, and a tabletop exercise exercises people, not telemetry.","study":"Purple-team validation = real telemetry, emulated behaviour, isolated segment, measured outcome.","qcm":{"correct":2,"opts":[{"t":"Run captured UNC3886 malware on a lab hypervisor to be realistic.","why":"Wrong: real tooling is out of scope and unnecessary for a telemetry test."},{"t":"Disable logging briefly on a production ASA to see if anyone notices.","why":"Wrong: a production device change breaks the rules and the trust."},{"t":"Emulate the commands in an isolated segment and verify AN1555/AN1559 fire.","why":"Correct: it exercises the real analytics on realistic, safe events."},{"t":"Run a tabletop exercise with slides only, no telemetry.","why":"Wrong: slides never produce telemetry, so nothing about detection is tested."}]}},{"id":"ext-16","type":"qcm","title":"The last call","scenario":{"summary":"End of shift — the account, the lawyer, the live session","arts":[{"label":"ARTEFACT 1 — case state","mono":false,"body":"The fin-ops-director account shows the same suppression pattern; the person holding the\naccount may be compromised, coerced, or simply careless — evidence supports all three.\nLegal has taken ownership of the human dimension. The session is still live and captured."}]},"question":"What does the SOC lead do with the live human dimension right now?","hint":"Three explanations are still open. Only one of the four options keeps all three open while protecting people and evidence.","explain":"With three live explanations — compromise, coercion, carelessness — the only defensible move is to escalate to the incident commander and legal, who own the human dimension, while preserving everything. Confronting the account holder can destroy a coercion case or tip off an intruder, wiping the account destroys evidence, and closing as a false positive ignores three open hypotheses.","study":"When humans and evidence mix, ownership moves up — quietly and immediately.","qcm":{"correct":0,"opts":[{"t":"Escalate to the incident commander and legal; preserve everything; do not contact the user.","why":"Correct: it keeps all three hypotheses open and puts the human risk with its owners."},{"t":"Message the director on chat and ask what they did.","why":"Wrong: confrontation can tip off an intruder or endanger a coerced person."},{"t":"Disable and wipe the account's sessions now.","why":"Wrong: wiping destroys evidence that legal will need."},{"t":"Close the case as a false positive to end the shift cleanly.","why":"Wrong: three open hypotheses is the opposite of a false positive."}]}}]};</script>
<script>

(function () {
  'use strict';
  var D = window.__EXAM_DATA__;
  var M = D.meta;

  /* ---------- helpers ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function shuffled(a) { var x = a.slice(); for (var i = x.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = x[i]; x[i] = x[j]; x[j] = t; } return x; }
  function norm(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().toLowerCase(); }
  function fmtClk(sec) { sec = Math.max(0, sec | 0); var m = (sec / 60) | 0, s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
  function reTest(reStr, s) { try { return new RegExp(reStr, 'i').test(s); } catch (e) { return false; } }
  function scoreSet(sel, cor) {
    var cs = {}; cor.forEach(function (x) { cs[x] = 1; });
    var H = 0, W = 0;
    sel.forEach(function (x) { if (cs[x]) H++; else W++; });
    var N = cor.length; if (!N) return { credit: 0, H: 0, W: 0, N: 0 };
    return { credit: Math.max(0, (H - W) / N), H: H, W: W, N: N };
  }
  var TYPE_LABEL = { qcm: 'Multiple choice', multi: 'Select all that apply', drag: 'Drag & drop', order: 'Timeline ordering', match: 'Matching', fill: 'Fill the blanks', terminal: 'Terminal — type the command', branch: 'Decision scenario', logview: 'Log analysis' };

  /* ---------- syntax highlighter ---------- */
  var TOK_RE = new RegExp([
    '(\\/proc\\/\\d+\\/environ|\\/proc\\/\\$PID|\\/proc\\/[0-9]+|\\/dev\\/null|[\\/~][\\w.\\/-]*bash_history|zsh_history|ConsoleHost_history\\.txt|\\$env:APPDATA[\\w.\\\\-]*)',
    '(Set-PSReadLineOption|Set-PSReadlineOption|Get-PSReadlineOption|Remove-Item|Get-Content|Set-ItemProperty)',
    '(HistorySavePath|HistorySaveStyle|SaveNothing|PSReadLine|PSReadline)',
    '(MYSQL_HISTFILE|HISTFILE|HISTFILESIZE|HISTSIZE|HISTCONTROL|HISTCMD|HISTTIMEFORMAT|HISTIGNORE)',
    '(vmsyslogd|dslogserver|syslogd|auditd|journalctl|ausearch|systemctl|service|resolv)',
    '(no logging|show logging|show run|logging host|logging enable|logging)',
    '(export|unset|printenv|echo|cat|sudo|grep|tr|tail|head|awk|sed|history|env|bash|zsh|kill|ps|enable|configure)',
    '(-{1,2}[A-Za-z][A-Za-z0-9-]*)'
  ].join('|'), 'g');
  function tokClass(m) {
    if (m[1]) return 'tok-path';
    if (m[2] || m[3]) return 'tok-ps';
    if (m[4]) return 'tok-env';
    if (m[5]) return 'tok-svc';
    if (m[6] || m[7]) return 'tok-cmd';
    if (m[8]) return 'tok-flag';
    return null;
  }
  function hlLine(line) {
    var f = document.createDocumentFragment();
    var tr = line.replace(/\s+$/, '');
    if (tr.charAt(0) === '#') { f.appendChild(el('span', 'tok-comment', line)); return f; }
    var last = 0, m;
    TOK_RE.lastIndex = 0;
    while ((m = TOK_RE.exec(line)) !== null) {
      if (m.index > last) f.appendChild(el('span', null, line.slice(last, m.index)));
      f.appendChild(el('span', tokClass(m), m[0]));
      last = m.index + m[0].length;
      if (m[0].length === 0) { TOK_RE.lastIndex++; }
    }
    if (last < line.length) f.appendChild(el('span', null, line.slice(last)));
    return f;
  }
  function monoBlock(lines) {
    var pre = el('pre', 'mono');
    (lines || []).forEach(function (ln) {
      var d = el('div', 'monoline');
      if (ln === '') { d.appendChild(document.createTextNode(' ')); } else { d.appendChild(hlLine(ln)); }
      pre.appendChild(d);
    });
    return pre;
  }
  function artPanel(a) {
    var d = el('div', 'art' + (a.mono ? '' : ' prose'));
    d.appendChild(el('div', 'alabel', a.label));
    if (a.mono) { d.appendChild(monoBlock(String(a.body).split('\n'))); }
    else { String(a.body).split('\n').forEach(function (p) { if (p.trim()) d.appendChild(el('p', null, p)); }); }
    return d;
  }

  /* ---------- state ---------- */
  var S = {
    screen: 'intro', order: [], idx: 0,
    results: {}, checkedIds: {}, hinted: {}, skipped: [],
    sum: 0, answered: 0, locked: false,
    returnTo: null, cur: null, widget: null,
    timer: { state: 'IDLE', left: M.timerSec, tick: null, lastT: 0, resumeBack: null },
    pauseManual: 0, pauseAuto: 0,
    reported: false,
    init: { username: '', country: '', locale: 'en' }
  };
  function byId(id) { for (var i = 0; i < D.exercises.length; i++) { if (D.exercises[i].id === id) return D.exercises[i]; } return null; }
  D.exercises.forEach(function (ex) {
    if (ex.type === 'drag') { ex.drag.items.forEach(function (it, i) { if (!it.id) { it.id = 'i' + i; } }); }
  });

  /* ---------- timer state machine: IDLE | RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED ---------- */
  function tick() {
    var st = S.timer.state;
    if (st === 'IDLE' || st === 'ENDED') return;
    var now = Date.now();
    var dt = Math.round((now - S.timer.lastT) / 1000);
    if (dt <= 0) return;
    S.timer.lastT = now;
    if (st === 'RUNNING') {
      S.timer.left -= dt;
      if (S.timer.left <= 0) { S.timer.left = 0; renderTimerChip(); toState('ENDED'); return; }
    } else if (st === 'PAUSED_MANUAL') { S.pauseManual += dt; }
    else if (st === 'PAUSED_AUTO_CHECK') { S.pauseAuto += dt; }
    renderTimerChip();
  }
  function toState(st) {
    S.timer.state = st;
    renderTimerChip();
    if (st === 'ENDED') { finishExam(true); }
  }
  function startTicker() {
    S.timer.lastT = Date.now();
    if (S.timer.tick) { clearInterval(S.timer.tick); }
    S.timer.tick = setInterval(tick, 500);
  }
  function stopTicker() { if (S.timer.tick) { clearInterval(S.timer.tick); S.timer.tick = null; } }

  /* ---------- header ---------- */
  function renderTimerChip() {
    var st = S.timer.state, ico = '▶', word = 'RUNNING', cls = 'running';
    if (st === 'PAUSED_MANUAL') { ico = '⏸'; word = 'PAUSED — manual (press Resume)'; cls = 'paused'; }
    else if (st === 'PAUSED_AUTO_CHECK') { ico = '⏸'; word = 'PAUSED — reviewing feedback (resumes on Next)'; cls = 'paused'; }
    else if (st === 'ENDED') { ico = '⏹'; word = 'ENDED'; cls = 'ended'; }
    else if (st === 'IDLE') { ico = '⏱'; word = 'READY'; cls = 'running'; }
    var t = $('#hd-timer');
    t.className = 'tstate ' + cls;
    $('#hd-tico').textContent = ico;
    $('#hd-tword').textContent = word;
    $('#hd-tclock').textContent = fmtClk(S.timer.left);
  }
  function renderScoreChip() {
    $('#hd-sum').textContent = (Math.round(S.sum * 10) / 10).toFixed(1);
    $('#hd-cnt').textContent = String(S.answered);
    $('#hd-pct').textContent = (S.answered > 0 ? Math.round((S.sum / S.answered) * 100) : 0) + '%';
  }
  function renderProgress() {
    var done = Object.keys(S.checkedIds).length + S.skipped.length;
    var pct = Math.max(0, Math.min(100, Math.round((done / D.exercises.length) * 100)));
    $('#progressbar').style.width = pct + '%';
  }
  function renderHeader() {
    var countChip = $('#hd-count');
    if (S.screen === 'review') { countChip.innerHTML = ''; countChip.appendChild(el('b', null, 'Review skipped — ' + S.skipped.length + ' left')); }
    else if (S.screen === 'results') { countChip.innerHTML = ''; countChip.appendChild(el('b', null, 'Exam finished')); }
    else { countChip.innerHTML = ''; countChip.appendChild(el('b', null, 'Exercise ' + (S.idx + 1) + ' of ' + D.exercises.length)); }
    var sev = $('#hd-sev');
    sev.textContent = '● ' + M.sevWord;
    sev.setAttribute('aria-label', 'Severity: ' + M.sevWord);
    renderTimerChip(); renderScoreChip();
    var inExam = (S.screen === 'exam');
    $('#bt-pause').disabled = !inExam || S.timer.state === 'ENDED';
    $('#bt-hint').disabled = !inExam || S.locked || !!(S.cur && S.hinted[S.cur.id]);
    $('#bt-skip').disabled = !inExam || S.locked;
    renderProgress();
  }

  /* ---------- views ---------- */
  function showView(name) {
    ['intro', 'exam', 'review', 'results'].forEach(function (v) { $('#view-' + v).hidden = (v !== name); });
    var chrome = (name !== 'intro');
    $('#topbar').hidden = !chrome;
    $('#progresswrap').hidden = !chrome;
  }

  /* ---------- intro screen (exactly four sections) ---------- */
  function buildIntro() {
    var v = $('#view-intro'); v.innerHTML = '';
    /* 1 — header strip */
    var c1 = el('div', 'card');
    var head = el('div', 'intro-head');
    head.appendChild(el('h1', null, M.examTitle));
    var badge = el('span', 'badge-sev', '● ' + M.sevWord); badge.setAttribute('aria-label', 'Severity: ' + M.sevWord);
    head.appendChild(badge);
    c1.appendChild(head);
    c1.appendChild(el('p', 'muted', M.objectLine));
    var mr = el('div', 'meta-row');
    mr.appendChild(metaItem('Exercises', String(D.exercises.length)));
    mr.appendChild(metaItem('Estimated time', M.estimatedMinutes + ' min'));
    mr.appendChild(metaItem('Timer budget', fmtClk(M.timerSec)));
    mr.appendChild(metaItem('Pass mark', M.passMark + '%'));
    if (S.init.username) { mr.appendChild(metaItem('Learner', S.init.username + (S.init.country && S.init.country !== 'ZZ' ? ' (' + S.init.country + ')' : ''))); }
    c1.appendChild(mr);
    v.appendChild(c1);
    /* 2 — what you will learn here */
    var c2 = el('div', 'card');
    c2.appendChild(el('h2', null, 'What you will learn here'));
    var grid = el('div', 'learn-grid');
    var lcol = el('div');
    D.intro.learn.forEach(function (p) { lcol.appendChild(el('p', null, p)); });
    grid.appendChild(lcol);
    var rcol = el('div');
    rcol.appendChild(el('h2', null, 'Roles that use this'));

        });

  WIDGETS.match = function (ex, host) {
    var mg = ex.match;
    var left = shuffled(mg.pairs.map(function (p, i) { return { id: 'L' + i, t: p.l }; }));
    var right = shuffled(mg.pairs.map(function (p, i) { return { id: 'R' + i, t: p.r }; }));
    var made = {}, used = {};
    var selL = null, selR = null;
    var wrap = el('div', 'matchwrap');
    var cl = el('div', 'mcol'), cr = el('div', 'mcol');
    wrap.appendChild(cl); wrap.appendChild(cr);
    host.appendChild(wrap);
    var pl = el('div', 'mpairs'); host.appendChild(pl);
    host.appendChild(el('div', 'ddnote', 'Click one item on the left and one on the right to pair them. Click × to undo a pair.'));
    function chip(list, side) {
      list.forEach(function (it) {
        var b = el('button', 'mitem', it.t); b.dataset.id = it.id; it.el = b;
        b.addEventListener('click', function () {
          if (S.locked || used[it.id]) { return; }
          if (side === 'L') { selL = it.id; }
          else { selR = it.id; }
          refresh();
          tryPair();
        });
        (side === 'L' ? cl : cr).appendChild(b);
      });
    }
    chip(left, 'L'); chip(right, 'R');
    function refresh() {
      left.forEach(function (it) { it.el.classList.toggle('sel', selL === it.id && !used[it.id]); it.el.classList.toggle('used', !!used[it.id]); });
      right.forEach(function (it) { it.el.classList.toggle('sel', selR === it.id && !used[it.id]); it.el.classList.toggle('used', !!used[it.id]); });
    }
    function tryPair() {
      if (selL && selR) {
        made[selL] = selR; used[selL] = used[selR] = true;
        selL = selR = null; refresh(); renderPairs(); updateBtns();
      }
    }
    function lidToIdx(id) { return Number(id.slice(1)); }
    function renderPairs() {
      pl.innerHTML = '';
      Object.keys(made).forEach(function (lid) {
        var li = lidToIdx(lid), ri = lidToIdx(made[lid]);
        var row = el('div', 'mpair');
        row.appendChild(el('span', null, mg.pairs[li].l));
        row.appendChild(el('span', 'arrow', '→'));
        row.appendChild(el('span', null, mg.pairs[ri].r));
        var x = el('button', 'x', '×'); x.setAttribute('aria-label', 'Undo this pair');
        x.addEventListener('click', function () {
          if (S.locked) { return; }
