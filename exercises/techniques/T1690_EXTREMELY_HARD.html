          renderPairs(); refresh(); updateBtns();
        });
        row.appendChild(x);
        pl.appendChild(row);
      });
    }
    return {
      answered: function () { return Object.keys(made).length === mg.pairs.length; },
      grade: function () {
        var items = [], H = 0, W = 0;
        mg.pairs.forEach(function (p, i) {
          var lid = 'L' + i;
          if (made[lid] != null) {
            if (made[lid] === 'R' + i) { H++; items.push({ label: p.l + ' → ' + p.r, st: 'ok', why: p.why }); }
            else { W++; items.push({ label: p.l + ' → ' + mg.pairs[lidToIdx(made[lid])].r, st: 'bad', why: p.why + ' Correct partner: ' + p.r + '.' }); }
          } else { items.push({ label: p.l, st: 'miss', why: p.why + ' Correct partner: ' + p.r + '.' }); }
        });
        return { credit: Math.max(0, (H - W) / mg.pairs.length), items: items, H: H, W: W, N: mg.pairs.length };
      }
    };
  };

  WIDGETS.fill = function (ex, host) {
    var f = ex.fill;
    var assigned = {}; // slotIdx -> chipText
    var selChip = null, selSlot = -1;
    var chipsUsed = {};
    var ft = el('p', 'filltext');
    var parts = String(f.text).split(/(\{\{\d+\}\})/g);
    var blanks = {};
    parts.forEach(function (p) {
      var m = p.match(/^\{\{(\d+)\}\}$/);
      if (m) {
        var si = Number(m[1]);
        var b = el('button', 'blank', '— empty —');
        b.dataset.slot = String(si);
        b.setAttribute('aria-label', 'Blank ' + (si + 1));
        b.addEventListener('click', function () {
          if (S.locked) { return; }
          if (assigned[si] != null) { returnChip(assigned[si]); assigned[si] = null; b.textContent = '— empty —'; b.classList.remove('filled'); updateBtns(); return; }
          if (selChip != null) { assigned[si] = selChip; chipsUsed[selChip] = true; b.textContent = selChip; b.classList.add('filled'); selChip = null; refreshChips(); updateBtns(); }
          else { selSlot = si; $$('.blank', ft).forEach(function (x) { x.classList.remove('sel'); }); b.classList.add('sel'); }
        });
        blanks[si] = b; ft.appendChild(b);
      } else if (p) { ft.appendChild(document.createTextNode(p)); }
    });
    host.appendChild(ft);
    host.appendChild(el('div', 'ddnote', 'Pick a word from the bank, then click a blank to place it. Click a filled blank to empty it.'));
    var bank = el('div', 'chips'); bank.style.marginTop = '10px';
    shuffled(f.bank).forEach(function (w) {
      var c = el('button', 'chip', w);
      c.addEventListener('click', function () {
        if (S.locked || chipsUsed[w]) { return; }
        selChip = w; refreshChips(); c.classList.add('sel');
        if (selSlot >= 0 && blanks[selSlot]) { var b = blanks[selSlot]; b.classList.remove('sel'); assigned[selSlot] = w; chipsUsed[w] = true; b.textContent = w; b.classList.add('filled'); selSlot = -1; selChip = null; refreshChips(); updateBtns(); }
      });
      c.dataset.word = w;
      bank.appendChild(c);
    });
    host.appendChild(bank);
    function refreshChips() {
      $$('.chip', bank).forEach(function (c) {
        var w = c.dataset.word;
        c.classList.toggle('used', !!chipsUsed[w]);
        c.classList.toggle('sel', selChip === w);
      });
    }
    function returnChip(w) { chipsUsed[w] = false; refreshChips(); }
    return {
      answered: function () { return f.slots.every(function (s, i) { return assigned[i] != null; }); },
      grade: function () {
        var items = [], H = 0, W = 0;
        f.slots.forEach(function (s, i) {
          var got = assigned[i];
          if (got == null) { items.push({ label: 'Blank ' + (i + 1), st: 'miss', why: s.why + ' Correct word: ' + s.correct + '.' }); }
          else if (norm(got) === norm(s.correct)) { H++; items.push({ label: 'Blank ' + (i + 1) + ': ' + got, st: 'ok', why: s.why }); }
          else { W++; items.push({ label: 'Blank ' + (i + 1) + ': ' + got, st: 'bad', why: s.why + ' Correct word: ' + s.correct + '.' }); }
        });
        return { credit: Math.max(0, (H - W) / f.slots.length), items: items, H: H, W: W, N: f.slots.length };
      }
    };
  };

  WIDGETS.terminal = function (ex, host) {
    var t = ex.terminal;
    if (t.panel) {
      var sp = el('div', 'synpanel');
      sp.appendChild(el('h4', null, t.panel.title || 'Syntax reminder'));
      t.panel.lines.forEach(function (ln) {
        if (ln.mono !== false) { var d = el('div', 'sl'); d.appendChild(hlLine(ln.t != null ? ln.t : ln)); sp.appendChild(d); }
        else { sp.appendChild(el('div', 'sl', ln.t != null ? ln.t : ln)); }
      });
      host.appendChild(sp);
    }
    if (t.sampleOut) {
      var so = el('div', 'synpanel');
      so.appendChild(el('h4', null, 'Expected output shape'));
      so.appendChild(monoBlock(t.sampleOut));
      host.appendChild(so);
    }
    var term = el('div', 'term');
    var out = el('div', 'term-out');
    term.appendChild(out);
    var inrow = el('div', 'term-in');
    inrow.appendChild(el('span', 'pr', t.prompt));
    var inp = el('input'); inp.type = 'text'; inp.autocomplete = 'off'; inp.spellcheck = false;
    inp.setAttribute('aria-label', 'Type the command, then press Check');
    inrow.appendChild(inp);
    term.appendChild(inrow);
    host.appendChild(term);
    (t.banner || []).forEach(function (ln) { var d = el('div', 'tline'); d.appendChild(hlLine(ln)); out.appendChild(d); });
    var lastCmd = '';
    inp.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { runCmd(); }
    });
    function line(txt, cls) { var d = el('div', 'tline' + (cls ? ' ' + cls : '')); d.appendChild(hlLine(txt)); out.appendChild(d); out.scrollTop = out.scrollHeight; }
    function rawline(txt, cls) { var d = el('div', 'tline' + (cls ? ' ' + cls : '')); d.textContent = txt; out.appendChild(d); out.scrollTop = out.scrollHeight; }
    function runCmd() {
      var cmd = inp.value;
      if (!cmd.trim()) { return; }
      lastCmd = cmd;
      rawline(t.prompt + ' $ ' + cmd, 'tcmd');
      var n = norm(cmd);
      if (n === norm(t.solution)) {
        (t.output || []).forEach(function (ln) { line(ln, 'tok'); });
        rawline('✔ simulation: command accepted — now press Check to grade it.', 'tok');
      } else if ((t.dangerous || []).some(function (dg) { return reTest(dg.re, cmd); })) {
        rawline('⚠ simulator note: in a real session this would alter or destroy evidence. Nothing was executed.', 'twarn');
      } else {
        rawline('command not found (simulation): ' + cmd.trim().split(' ')[0] + ' — the simulator only knows the commands this exercise needs.', 'terr');
      }
      inp.value = '';
      updateBtns();
    }
    return {
      answered: function () { return !!(inp.value.trim() || lastCmd); },
      grade: function () {
        var cmd = inp.value.trim() ? inp.value : lastCmd;
        if (!cmd || !cmd.trim()) { return null; }
        var items = [], H = 0, W = 0, danger = false;
        t.elements.forEach(function (em) {
          if (reTest(em.re, cmd)) { H++; items.push({ label: em.label, st: 'ok', why: em.why }); }
          else { items.push({ label: em.label, st: 'miss', why: em.why }); }
        });
        (t.dangerous || []).forEach(function (dg) {
          if (reTest(dg.re, cmd)) { W++; danger = true; items.push({ label: dg.label, st: 'bad', why: dg.why }); }
        });
        return { credit: Math.max(0, (H - W) / t.elements.length), items: items, H: H, W: W, N: t.elements.length, danger: danger, cmd: cmd };
      }
    };
  };

  WIDGETS.branch = function (ex, host) {
    var br = ex.branch;
    var chosen = [];
    var stepHost = el('div'); host.appendChild(stepHost);
    function renderStep(i) {
      stepHost.innerHTML = '';
      chosen.length = Math.min(chosen.length, i);
      var st = br.steps[i];
      stepHost.appendChild(el('span', 'typechip', 'STEP ' + (i + 1) + ' OF ' + br.steps.length));
      if (st.art) { stepHost.appendChild(artPanel(st.art)); }
      if (st.question) { stepHost.appendChild(el('p', 'qtext', st.question)); }
      var opts = el('div', 'opts');
      var sel = -1;
      var bts = [];
      st.opts.forEach(function (o, oi) {
        var b = el('button', 'opt');
        b.appendChild(el('span', 'olabel', 'ABCDEF'[oi] + '.'));
        b.appendChild(el('span', null, o.t));
        b.addEventListener('click', function () {
          if (S.locked) { return; }
          sel = oi;
          bts.forEach(function (x) { x.classList.remove('selected'); var sm = x.querySelector('.selmark'); if (sm) { sm.remove(); } });
          b.classList.add('selected'); b.appendChild(el('span', 'selmark', '● Selected'));
          bc.disabled = false;
        });
        bts.push(b); opts.appendChild(b);
      });
      stepHost.appendChild(opts);
      var row = el('div', 'start-row');
      var bc = el('button', 'btn primary', i === br.steps.length - 1 ? 'Confirm last step ▶' : 'Confirm & continue ▶');
      bc.disabled = true;
      row.appendChild(bc);
      row.appendChild(el('span', 'muted', i === br.steps.length - 1 ? 'Then press ✓ Check to grade the whole chain.' : 'Confirming a step does not stop the timer.'));
      stepHost.appendChild(row);
      bc.addEventListener('click', function () {
        if (sel < 0) { return; }
        chosen[i] = sel;
        if (st.opts[sel].outcome) {
          var oc = el('div', 'outcome');
          oc.appendChild(el('b', null, 'Outcome: '));
          oc.appendChild(document.createTextNode(st.opts[sel].outcome));
          stepHost.insertBefore(oc, row);
        }
        bc.disabled = true;
        bts.forEach(function (x) { x.disabled = true; });
        if (i < br.steps.length - 1) { renderStep(i + 1); }
        else { updateBtns(); stepHost.appendChild(el('div', 'ddnote', 'All steps confirmed. Press ✓ Check below to grade the full chain.')); }
      });
    }
    renderStep(0);
    return {
      answered: function () { return chosen.length === br.steps.length && chosen.every(function (c) { return c != null; }); },
      grade: function () {
        var items = [], H = 0, W = 0;
        br.steps.forEach(function (st, i) {
          var o = st.opts[chosen[i]];
          if (o.good) { H++; items.push({ label: 'STEP ' + (i + 1) + ': ' + o.t, st: 'ok', why: o.why }); }
          else { W++; items.push({ label: 'STEP ' + (i + 1) + ': ' + o.t, st: 'bad', why: o.why }); }
        });
        return { credit: Math.max(0, (H - W) / br.steps.length), items: items, H: H, W: W, N: br.steps.length, answerText: br.best || null };
      }
    };
  };

  WIDGETS.logview = function (ex, host) {
    var lv = ex.logview;
    var panel = el('div', 'logpanel');
    var bar = el('div', 'logbar');
    bar.appendChild(el('span', 'muted', lv.filterLabel || 'Filter:'));
    var fin = el('input'); fin.type = 'text'; fin.placeholder = 'type to filter lines…';
    fin.setAttribute('aria-label', 'Filter log lines');
    bar.appendChild(fin);
    panel.appendChild(bar);
    var linesBox = el('div', 'loglines');
    var lineEls = [];
    (lv.logs || []).forEach(function (ln) {
      var d = el('div', 'logline');
      d.dataset.raw = ln;
      d.appendChild(hlLine(ln));
      linesBox.appendChild(d); lineEls.push(d);
    });
    panel.appendChild(linesBox);
    host.appendChild(panel);
    fin.addEventListener('input', function () {
      var f = fin.value.trim().toLowerCase();
      lineEls.forEach(function (d) {
        var raw = d.dataset.raw;
        if (!f || raw.toLowerCase().indexOf(f) >= 0) { d.style.display = ''; } else { d.style.display = 'none'; }
      });
    });
    var innerHost = el('div'); innerHost.style.marginTop = '14px';
    host.appendChild(innerHost);
    var innerData = {};
    innerData[lv.inner.type] = lv.inner;
    var inner = WIDGETS[lv.inner.type](innerData, innerHost);
    return {
      answered: function () { return inner.answered(); },
      grade: function () { return inner.grade(); }
    };
  };

  /* ---------- check / next / skip / hint ---------- */
  function onCheck() {
    if (S.locked || S.timer.state === 'ENDED' || S.screen !== 'exam') { return; }
    var w = S.widget;
    if (!w || !w.answered()) { return; }
    var g = w.grade();
    if (!g) { return; }
    if (S.hinted[S.cur.id]) { g.credit = Math.max(0, g.credit - 0.10); }
    g.credit = Math.max(0, Math.min(1, g.credit));
    S.results[S.cur.id] = g;
    S.checkedIds[S.cur.id] = true;
    var si = S.skipped.indexOf(S.cur.id);
    if (si >= 0) { S.skipped.splice(si, 1); }
    S.sum += g.credit; S.answered++;
    S.locked = true;
    toState('PAUSED_AUTO_CHECK');
    renderFeedback(S.cur, g);
    renderHeader(); updateBtns();
    var fb = $('#view-exam .feedback');
    if (fb) { fb.hidden = false; }
  }

  function fbIcon(st) { return st === 'ok' ? '✓ Correct' : (st === 'bad' ? '✗ Wrong' : '○ Missed'); }
  function renderFeedback(ex, g) {
    var fb = $('#view-exam .feedback');
    fb.innerHTML = '';
    var cls = g.credit >= 0.999 ? 'ok' : (g.credit > 0 ? 'partial' : 'bad');
    fb.classList.add(cls);
    var head = el('div', 'fb-head');
    var lab = g.credit >= 0.999 ? '✓ CORRECT' : (g.credit > 0 ? '✓ PARTIALLY CORRECT' : '✗ INCORRECT');
    head.appendChild(el('span', null, lab));
    if (g.N && g.N > 1) { head.appendChild(el('span', 'fb-credit', '— credit ' + (Math.round(g.credit * 100) / 100).toFixed(2) + ' · ' + g.H + ' of ' + g.N + ' items')); }
    fb.appendChild(head);
    var body = el('div', 'fb-body');
    if (g.danger) {
      var dw = el('div', 'item st-bad');
      dw.appendChild(el('span', 'ist', '✗ DANGEROUS — NEAR MISS'));
      dw.appendChild(el('span', null, 'Your command matches a pattern that would alter or destroy evidence in a real session. Read the canonical command below carefully.'));
      body.appendChild(dw);
    }
    if (g.credit > 0 && g.credit < 0.999 && g.N > 1) {
      body.appendChild(el('p', 'fb-credit', 'Partial credit formula: max(0, (H − W) / N) → H=' + g.H + ' correct picks, W=' + g.W + ' wrong picks, N=' + g.N + ' items. Wrong picks cancel right picks.'));
    }
    if (ex.explain) {
      var p = el('p'); p.textContent = ex.explain; body.appendChild(p);
    }
    if (g.answerText) {
      var at = el('p', 'fb-credit'); at.appendChild(el('b', null, 'Correct answer: ')); at.appendChild(document.createTextNode(g.answerText));
      body.appendChild(at);
    }
    if (g.items && g.items.length) {
      var box = el('div', 'items');
      g.items.forEach(function (it) {
        var r = el('div', 'item st-' + it.st);
        r.appendChild(el('span', 'ist', fbIcon(it.st)));
        var c = el('span');
        c.appendChild(el('b', null, it.label));
        if (it.why) { c.appendChild(document.createTextNode(' — ' + it.why)); }
        r.appendChild(c);
        box.appendChild(r);
      });
      body.appendChild(box);
    }
    if (ex.type === 'terminal') {
      var t = ex.terminal;
      body.appendChild(el('p', 'fb-credit', 'Canonical command (copyable):'));
      var cw = el('div', 'copywrap');
      cw.appendChild(monoBlock([t.solution]));
      var cb = el('button', 'copybtn', 'Copy');
      cb.setAttribute('aria-label', 'Copy the canonical command');
      cb.addEventListener('click', function () {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t.solution); cb.textContent = 'Copied ✓'; }
          else { cb.textContent = 'Select it manually'; }
        } catch (e) { cb.textContent = 'Select it manually'; }
        setTimeout(function () { cb.textContent = 'Copy'; }, 1600);
      });
      cw.appendChild(cb);
      body.appendChild(cw);
      (t.solutionWhy || []).forEach(function (l) {
        var d = el('div', 'sl'); d.style.margin = '4px 0'; d.appendChild(hlLine(l)); body.appendChild(d);
      });
    }
    if (ex.study && g.credit < 0.999) {
      var st2 = el('div', 'study');
      st2.appendChild(el('b', null, 'What to study: '));
      st2.appendChild(document.createTextNode(ex.study));
      body.appendChild(st2);
    }
    if (S.hinted[ex.id]) { body.appendChild(el('p', 'fb-credit', 'Hint used: −0.10 credit applied to this exercise.')); }
    fb.appendChild(body);
    fb.hidden = false;
  }

  function onNext() {
    if (!S.locked) { return; }
    var wasReturn = S.returnTo === 'review';
    if (wasReturn) { S.returnTo = null; }
    if (S.idx < S.order.length - 1 && !wasReturn) {
      S.idx++;
      toState('RUNNING');
      renderCurrent();
    } else if (S.skipped.length > 0) {
      toState('RUNNING');
      showReview();
    } else {
      finishExam(false);
    }
  }

  function onSkip() {
    if (S.locked || S.screen !== 'exam') { return; }
    if (S.skipped.indexOf(S.cur.id) < 0) { S.skipped.push(S.cur.id); }
    if (S.returnTo === 'review') { S.returnTo = null; showReview(); return; }
    if (S.idx < S.order.length - 1) {
      S.idx++;
      renderCurrent();
    } else if (S.skipped.length > 0) {
      showReview();
    } else {
      finishExam(false);
    }
  }

  function onHint() {
    if (S.locked || S.screen !== 'exam' || S.hinted[S.cur.id]) { return; }
    S.hinted[S.cur.id] = true;
    var ab = $('#view-exam .block-a .bbody');
    if (ab) {
      var hp = el('div', 'study');
      hp.style.marginTop = '12px';
      hp.appendChild(el('b', null, '💡 Hint (−10% of this exercise credit): '));
      hp.appendChild(document.createTextNode(S.cur.hint || 'Re-read the scenario artefacts — the key detail is there.'));
      ab.appendChild(hp);
    }
    renderHeader();
  }

  /* ---------- review skipped screen ---------- */
  function showReview() {
    S.screen = 'review';
    showView('review');
    var v = $('#view-review'); v.innerHTML = '';
    var c = el('div', 'card');
    c.appendChild(el('h2', null, '⚠ Review skipped exercises'));
    c.appendChild(el('p', 'muted', 'You have ' + S.skipped.length + ' skipped exercise(s). You can go back and answer them now — the timer is still running — or submit the exam. Skipped-and-never-answered exercises are excluded from the score.'));
    S.skipped.forEach(function (id) {
      var ex = byId(id);
      var row = el('div', 'rev-row');
      row.appendChild(el('span', 'warn-ico', '⚠'));
      row.appendChild(el('b', null, 'Skipped'));
      row.appendChild(el('span', 'rt', ex.title));
      var b = el('button', 'btn small primary', 'Answer now');
      b.addEventListener('click', function () { answerFromReview(id); });
      row.appendChild(b);
      c.appendChild(row);
    });
    var sr = el('div', 'start-row');
    var sb = el('button', 'btn primary', 'Submit exam ✓');
    sb.addEventListener('click', function () { finishExam(false); });
    sr.appendChild(sb);
    sr.appendChild(el('span', 'muted', 'Once you submit, unanswered skipped exercises no longer count.'));
    c.appendChild(sr);
    v.appendChild(c);
    renderHeader();
    window.scrollTo(0, 0);
  }
  function answerFromReview(id) {
    S.returnTo = 'review';
    S.idx = S.order.indexOf(id);
    if (S.idx < 0) { S.idx = 0; }
    toState('RUNNING');
    S.screen = 'exam';
    showView('exam');
    renderCurrent();
  }

  /* ---------- results + site contract ---------- */
  function finishExam(timedOut) {
    if (S.screen === 'results') { return; }
    S.screen = 'results';
    S.timer.state = 'ENDED';
    renderTimerChip();
    stopTicker();
    showView('results');
    var v = $('#view-results'); v.innerHTML = '';
    var c = el('div', 'card');
    c.appendChild(el('h2', null, 'Exam results — ' + M.examTitle));
    var answered = S.answered;
    var percent = answered > 0 ? Math.round((S.sum / answered) * 100) : 0;
    var sc = el('p');
    sc.appendChild(el('b', null, (Math.round(S.sum * 10) / 10).toFixed(1) + ' / ' + answered));
    sc.appendChild(document.createTextNode(' answered · ' + percent + '%  (pass mark ' + M.passMark + '%)'));
    c.appendChild(sc);
    if (timedOut) { c.appendChild(el('p', 'muted', '⏹ The timer ended — the exam was submitted automatically. Unanswered and skipped exercises were excluded from the score.')); }
    var fc = 0, pc = 0, ic = 0, pcSum = 0;
    Object.keys(S.results).forEach(function (k) {
      var cr = S.results[k].credit;
      if (cr >= 0.999) { fc++; }
      else if (cr > 0) { pc++; pcSum += cr; }
      else { ic++; }
    });
    var skippedLeft = D.exercises.length - answered;
    var grid = el('div', 'resgrid');
    grid.appendChild(resCard('ok', '✓ Fully correct', fc));
    grid.appendChild(resCard('partial', '✓ Partially correct', pc, pc > 0 ? 'avg ' + (Math.round((pcSum / pc) * 100) / 100).toFixed(2) : null));
    grid.appendChild(resCard('bad', '✗ Fully incorrect', ic));
    grid.appendChild(resCard('skip', '⚠ Skipped — excluded', skippedLeft));
    c.appendChild(grid);
    var tr = el('div', 'times-row');
    tr.appendChild(metaItem('Time used', fmtClk(M.timerSec - S.timer.left)));
    tr.appendChild(metaItem('Paused manually', fmtClk(S.pauseManual)));
    tr.appendChild(metaItem('Paused for feedback', fmtClk(S.pauseAuto)));
    c.appendChild(tr);
    if (answered > 0 && percent >= M.passMark) {
      var pp = el('div', 'passpanel');
      pp.appendChild(el('div', 'big', '✓ PASS'));
      pp.appendChild(el('p', null, 'You reached ' + percent + '% — above the ' + M.passMark + '% pass mark. Well done: you showed command of ' + M.techId + ' at ' + M.sevWord + ' level.'));
      c.appendChild(pp);
    } else {
      var fp = el('div', 'failpanel');
      fp.appendChild(el('div', 'big', '✗ FAIL'));
      fp.appendChild(el('p', null, answered === 0 ? 'No exercise was answered, so the score is 0%. You must retake this exam.' : 'You reached ' + percent + '%, below the ' + M.passMark + '% pass mark. You must retake this exam — read the feedback you collected and try again.'));
      c.appendChild(fp);
    }
    var sr = el('div', 'start-row');
    var rb = el('button', 'btn primary', '↻ Retake exam');
    rb.setAttribute('aria-label', 'Retake the exam with reshuffled exercises');
    rb.addEventListener('click', function () { startExam(); });
    sr.appendChild(rb);
    c.appendChild(sr);
    v.appendChild(c);
    renderHeader();
    reportScore();
    window.scrollTo(0, 0);
  }
  function resCard(cls, lab, num, extra) {
    var d = el('div', 'rescard ' + cls);
    d.appendChild(el('div', 'num', String(num)));
    var l = el('div', 'lab', lab + (extra ? ' — ' + extra : ''));
    d.appendChild(l);
    return d;
  }
  function reportScore() {
    if (S.reported) { return; }
    S.reported = true;
    var percent = S.answered > 0 ? Math.round((S.sum / S.answered) * 100) : 0;
    try {
      if (!window.parent || window.parent === window) { return; } /* opened directly: no parent to report to */
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: M.topicId,
        batch: M.batch,
        score: Math.round(S.sum),
        total: S.answered,
        percent: percent,
        passed: percent >= M.passMark
      }, location.origin);
    } catch (e) { /* opened directly, nothing to report to */ }
  }

  /* ---------- site handshake (dark-only file: theme field is accepted, never acted on) ---------- */
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || (d.type !== 'CYBERPULSE_INIT' && d.type !== 'CYBERMASTERY_INIT')) { return; }
    S.init.username = d.username || '';
    S.init.country = d.country || '';
    S.init.locale = d.locale || 'en';
    if (S.screen === 'intro') { buildIntro(); }
  });

  /* ---------- wire up ---------- */
  document.addEventListener('DOMContentLoaded', function () {
    $('#bt-pause').addEventListener('click', onPause);
    $('#bt-hint').addEventListener('click', onHint);
    $('#bt-skip').addEventListener('click', onSkip);
    $('#pv-resume').addEventListener('click', onPause);
    buildIntro();
  });

  function onPause() {
    if (S.screen !== 'exam' && S.screen !== 'review') { return; }
    if (S.timer.state === 'ENDED') { return; }
    if (S.timer.state === 'PAUSED_MANUAL') {
      S.timer.state = S.timer.resumeBack || 'RUNNING';
      S.timer.resumeBack = null;
      $('#pauseveil').classList.remove('on');
      renderTimerChip();
      return;
    }
    S.timer.resumeBack = S.timer.state;
    S.timer.state = 'PAUSED_MANUAL';
    $('#pv-title').textContent = 'PAUSED — manual (press Resume)';
    $('#pv-text').textContent = S.timer.resumeBack === 'PAUSED_AUTO_CHECK'
      ? 'You paused while reviewing feedback. Resume to return to the explanation — the timer stays stopped until you press Next.'
      : 'The timer is stopped and the exercise is hidden. Take a real break — the exam waits for you.';
    $('#pauseveil').classList.add('on');
    renderTimerChip();
  }
})();

</script>
</body>
