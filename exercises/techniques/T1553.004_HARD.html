.paused-overlay{position:fixed;inset:0;z-index:100;background:var(--bg-page);display:flex;align-items:center;justify-content:center;padding:20px}
.paused-card{background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 30px;max-width:440px;text-align:center}
.paused-card .pico{font-size:34px;color:var(--state-paused)}
.paused-card h2{margin:10px 0 6px;font-size:19px;color:var(--state-paused)}
.paused-card p{margin:0 0 18px;color:var(--text-secondary);font-size:14.5px}
/* ---------- responsive ---------- */
@media (max-width:760px){
  .dnd{grid-template-columns:1fr}
  .matchrow{grid-template-columns:1fr}
  .intro{padding:16px 12px 40px}
  .stage{padding:14px 10px 48px}
  .hdr{padding:8px 10px}
  .fact{font-size:12.5px}
}
@media (prefers-reduced-motion: reduce){
  .progress-fill{transition:none}
  .progress-fill::after{animation:none;display:none}
  .btn,.opt,.bankitem,.order-btns button,.zone,.match-sel{transition:none}
  *{scroll-behavior:auto!important}
}

<script type="application/json" id="exam-data">{"topicId":"t1553.004","batch":3,"difficulty":"hard","severity":"HARD","passMark":70,"estimatedMinutes":35,"mitreId":"T1553.004","mitreName":"Install Root Certificate","objectType":"Sub-Technique","intro":{"learn":["This exam is about the MITRE ATT&CK sub-technique T1553.004, called Install Root Certificate, a Defense Evasion sub-technique. At this level the questions stop being about definitions and start being about judgement: which of two nearly identical observations is the attack, and which one is Tuesday.","The hard part of this topic is that legitimate software does the same thing attackers do. A corporate TLS-inspection root is installed fleet-wide by design. A browser vendor refreshes roots in the background. An attacker installs a rogue root with the same three commands. The difference lives in ownership, change records, and fingerprints — not in the tooling.","You will work real artefacts here: store diffs, change tickets, EDR session logs, and documented campaigns. HackingTeam's Galileo RCS, FinFisher/FinSpy, Turla's forged Microsoft root, and the Superfish adware all abused this sub-technique, and their choices still shape how defenders triage it today.","These exercises mirror senior work. SOC analysts separate sanctioned from rogue with evidence, incident responders preserve the tampered state before anyone rebuilds it, threat hunters diff trust stores across the fleet, detection engineers match findings to the right telemetry source, and control owners weigh MDM-enforced change controls against the cost of an action.","Expect near-miss answers. In several exercises the obvious choice is wrong on purpose, because on a real shift the obvious choice is what gets root certificates deleted at the worst possible moment."],"keywords":[{"theme":"Documented abuse","items":["HackingTeam Galileo RCS","FinFisher/FinSpy","Turla/Snake forged Microsoft root","Superfish (Komodia)"]},{"theme":"Tamper vs sanctioned change","items":["rogue root vs enterprise TLS-inspection CA","change-record matching","fingerprint identity","presence is not trust"]},{"theme":"Detection sources","items":["process and command-line monitoring","Sysmon registry events","macOS keychain telemetry","trust-store baseline diffing"]},{"theme":"Containment judgement","items":["least-aggressive action","evidence preservation","removal planning","cost of removal"]}],"how":["You will answer 15 exercises. You need 70% or more to pass. A pass means you can make these calls on a live incident without supervision.","Exercise types in this exam: multiple choice (single answer and select-two), matching pairs, sorting cards into zones (drag and drop), fill-in-the-blank, a decision-tree scenario, and one simulated terminal exercise.","A countdown timer runs for 35 minutes. The Pause button hides the exercise and stops the timer until you press Resume.","When you press Check, the timer stops automatically so you can read the feedback as long as you like. It starts again when you press Next.","Exercises with several items give partial credit: max(0, (correct − wrong) / items). One hint per exercise is allowed; it costs 10% of that exercise's credit. Hints at this level remove one wrong path — they do not give the answer.","Skip moves an exercise to a review pool. Near the end you can answer skipped exercises. Skipped exercises you never answer do not count in your score at all.","The terminal exercise simulates a shell. Type the command, press Enter, then press Check. Nothing is executed for real, but the scenario assumes every keystroke counts."]},"exercises":[{"id":"e01","type":"single","perspective":"attacker","scenario":{"summary":"CTI card: why Galileo RCS installed a root certificate","text":["You are writing a threat-intel card for the HackingTeam breach disclosures. Their Galileo remote control system was documented installing a root certificate on the machines it surveilled, and your card must state why in one defensible sentence.","A junior analyst has drafted four candidate sentences; exactly one survives the evidence."],"artefacts":[{"label":"ARTEFACT 1 — vendor report VT-2015-07, section 4 (redacted excerpt)","kind":"text","lines":["Vendor report VT-2015-07, section 4 (redacted excerpt):","Galileo RCS components deployed to surveillance targets included a","root certificate, installed without user interaction.","Sections 5-7 describe collection of the target's web sessions."]}]},"question":"Which sentence belongs on the card?","options":[{"id":"a","text":"The root let the implant trust its own update server, so component refreshes ran silently"},{"id":"b","text":"The trusted root let the implant fake site certificates and read the target's HTTPS traffic"},{"id":"c","text":"The root let the implant's dropper present as vendor-signed code on disk"},{"id":"d","text":"The root let the implant encrypt its captured logs so only the operator could read them"}],"correct":["b"],"hint":"The report separates installation (section 4) from collection (sections 5-7); one option claims a purpose no trust store provides at all.","explain":["The report documents the pattern: a root installed silently, then collection of the target's web sessions. The causal link the card must state is the documented T1553.004 purpose — the trusted root made the implant's fake site certificates pass validation, so HTTPS interception ran without a visible warning.","Option a describes update-channel trust, which is a real mechanism in principle but is not what the report documents for Galileo — sections 5-7 cover session collection, not component updates. Option c is the signing payoff documented for other campaigns, not this one. Option d claims a purpose no trust store provides: a root certificate governs what the machine believes about certificates, not the encryption of files an implant writes. Two of the distractors describe things certificate trust genuinely can do — only option b is the documented one."]},{"id":"e02","type":"drag","perspective":"defender","scenario":{"summary":"Three verdicts, one diff — WKS-LOG-04's new roots","text":["INC-3320 widens: the nightly diff now covers the log-shipment subnet, and WKS-LOG-04 shows roots it never carried before.","The service desk wants a verdict on each before the morning sweep. Your lead wants every verdict tied to a fingerprint and a record first.","Work the three columns; two of the roots must not receive a verdict at all yet."],"artefacts":[{"label":"ARTEFACT 1 — trust-store diff, WKS-LOG-04","kind":"code","lines":["+ Payroll-SSO Root CA      5C:71:0E:93:D2:41   via C:\\Windows\\CCM\\ccmexec.exe 02:52","+ Meridian-Updates Root CA 91:0D:6F:42:B8:5A   via C:\\Windows\\Temp\\log-rotator.exe 02:31","+ Legacy-Transit Root CA   expired 2024-04-02  present since 2019","+ Fleet-Backup Root CA     A2:58:1C:07:EE:34   via wusa.exe 04:58"]},{"label":"ARTEFACT 2 — change record CHG-7818 (excerpt)","kind":"ticket","lines":["CHG-7818 — payroll SSO vendor root + fleet backup root refresh","Approves: 5C:71:0E:93:D2:41 (Payroll-SSO Root CA) via SCCM","Approves: A2:58:1C:07:EE:34 (Fleet-Backup Root CA) via SCCM, window Sun 22:00-Mon 04:00","Owner: payroll-infra@acme[.]example   Approved 2024-05-09"]}]},"question":"Sort each root into the correct column.","zones":[{"id":"z1","label":"Sanctioned — record and mechanism agree","accepts":["i1"]},{"id":"z2","label":"Rogue — no record behind the install","accepts":["i2"]},{"id":"z3","label":"Verify before any verdict","accepts":["i3","i4"]}],"items":[{"id":"i1","text":"Payroll-SSO Root CA — fingerprint equals the value approved in CHG-7818, deployed by the SCCM client inside the window"},{"id":"i2","text":"Meridian-Updates Root CA — self-signed, installed by a log-rotator script from a Temp path, fingerprint in no record"},{"id":"i3","text":"Legacy-Transit Root CA — expired two months ago but still present with its old trust entry"},{"id":"i4","text":"Fleet-Backup Root CA — fingerprint matches the CHG-7818 value, but installed by wusa.exe outside the approved window"}],"hint":"One fingerprint matching a record proves the certificate, not the way it arrived; an expiry date is a fact to verify, not a verdict.","explain":["Payroll-SSO goes in the sanctioned column: fingerprint equal to the approved value, mechanism equal to the approved deployment, inside the window — record and mechanism agree.","Meridian-Updates is the rogue: self-signed, Temp-path installer, fingerprint in no record. The display name proves nothing either way; the missing record and the install path decide.","The other two get no verdict yet. Legacy-Transit is expired, so it cannot validate a chain today, but an expired root that nobody removed still needs an owner and a cleanup ticket before anyone calls it harmless. Fleet-Backup carries an approved fingerprint, so the certificate itself is proven — but wusa.exe at 04:58 matches neither the approved mechanism nor the window, so the record owner must explain the push before it is called routine. Fingerprint first, mechanism second, verdict last."]},{"id":"e03","type":"blank","perspective":"defender","scenario":{"summary":"Detection note: what the write event proves — and what it cannot","text":["You are writing the detection note that accompanies INC-3320: the Sysmon SetValue row is captured, but the note must state exactly what that row proves — and what it cannot.","Fill both blanks so the note separates the write from the use."]},"question":"Complete the two detection-note lines.","blanks":[{"before":"A Sysmon EventID ","after":" row with EventType=SetValue under the trusted-root keys records the install write itself — nothing more.","answer":["13","eid 13","event id 13","eventid 13","eventid13"],"hint":"the two-digit registry-event ID every Sysmon rule in this file filters on"},{"before":"A write is not a use: only the ","after":" operational log, once enabled, shows whether the rogue chain was later built and validated — the difference between installed and used.","answer":["capi2"],"hint":"the four-letter crypto API whose name ends in a 2"}],"hint":"One blank is the numeric ID of the registry-write event; the other is the log that records what happened after the write.","explain":["Step one: the SetValue row under the trusted-root keys is recorded by Sysmon event ID 13, the registry event. Step two: that write alone proves nothing about use.","Why event 13 alone is insufficient: it fires for every sanctioned push and every rogue install alike, and it can never show a chain validating afterwards. The CAPI2 operational log records chain building and validation, so correlating its chain events with the install timestamp is what proves the rogue root was actually used against a fake site certificate. Install and use are two different claims, and the note now carries a source for each."]},{"id":"e04","type":"match","perspective":"neutral","scenario":{"summary":"Campaign cards: match group to abuse pattern","text":["Your threat-intel team keeps one card per documented campaign that abused T1553.004.","The cards were shuffled in the last export. Match each campaign to how it abused installed roots."],"artefacts":[{"label":"ARTEFACT 1 — campaign export, last cycle (metadata)","kind":"code","lines":["Galileo RCS (HackingTeam)   documented 2015   Windows and macOS targets","FinSpy (FinFisher)          documented 2014+  desktop and mobile targets","Snake (Turla)               documented 2014   Windows targets","Superfish (Komodia)         documented 2014-2015  consumer laptop OEM images"]}]},"question":"Match each campaign to its abuse pattern.","pairs":[{"left":"HackingTeam (Galileo RCS)","right":"Installed a root certificate so the implant could intercept the target's HTTPS"},{"left":"FinFisher / FinSpy","right":"Surveillance implant that relied on an installed root to hide its command traffic"},{"left":"Turla / Snake","right":"Used a forged Microsoft root certificate to sign its tooling"},{"left":"Superfish (Komodia)","right":"Adware whose pre-installed root allowed MITM on consumer laptops"}],"hint":"Two cards are about intercepting traffic, one about signing tools, one about adware that shipped with the machine.","explain":["HackingTeam's Galileo RCS and FinFisher/FinSpy are interception cases: the installed root made their fake certificates trusted so HTTPS could be read or their command channel hidden.","Turla/Snake is the signing case: a forged Microsoft root made their tooling appear vendor-signed. Superfish is the consumer case: a Komodia-based root pre-installed on laptops allowed MITM and made every user of the machine trust it. Knowing the pattern tells you what to look for in your own store diffs."]},{"id":"e05","type":"blank","perspective":"defender","scenario":{"summary":"Two nuances the first responder got wrong","text":["Your first responder wrote: the suspect certificate is in the keychain, therefore it is trusted, therefore it is rogue.","Both halves of that sentence need a correction in the incident record. Fill the two blanks."]},"question":"Complete the two correction lines.","blanks":[{"before":"Identity is decided by the certificate ","after":" compared against a vendor-published value — the display name can be copied by anyone.","answer":["fingerprint"],"hint":"the hash-based identity of a certificate"},{"before":"On macOS, a certificate can sit in the keychain without being trusted: the decision lives in the ","after":" , which admins set separately.","answer":["trust settings"],"hint":"the two-word macOS concept that says which certificates are actually believed"}],"hint":"One blank is how you tell two look-alike certificates apart; the other is the macOS layer that decides belief.","explain":["The fingerprint is the only safe identity check: two certificates can share a subject name, but not a fingerprint. Comparing it with a vendor-published value separates mimicry from the real vendor.","On macOS, presence in the keychain is not belief — the separate trust settings layer decides whether a certificate is trusted as a root. The corrected record therefore says: verify the fingerprint, then verify the trust settings, before calling anything rogue."]},{"id":"e06","type":"multi","perspective":"defender","scenario":{"summary":"Which of the junior's commands changed trust state?","text":["A junior analyst practised keychain commands on the lab Mac MAC-DEV-01 during the INC-3320 follow-up and is not sure which of his commands actually changed state.","His session log is below. Select the TWO commands that would alter trust or the keychain's contents on a live host."],"artefacts":[{"label":"ARTEFACT 1 — session log, MAC-DEV-01 (lab)","kind":"log","filter":true,"lines":["07:41:55  sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain ~/Downloads/dev-ca.pem","07:44:02  security find-certificate -a -p /Library/Keychains/System.keychain > /tmp/syscerts.txt","07:51:37  security dump-trust-settings -d","07:58:10  security find-certificate -c dev-ca -p   (single certificate export)","08:03:26  security delete-certificate -c old-dev-ca /Library/Keychains/System.keychain   (cleanup during follow-up)"]}]},"question":"Select the TWO commands that would alter trust state.","options":[{"id":"a","text":"The add-trusted-cert command at 07:41:55"},{"id":"b","text":"The find-certificate export at 07:44:02"},{"id":"c","text":"The dump-trust-settings read at 07:51:37"},{"id":"d","text":"A delete-certificate command aimed at the System keychain"}],"correct":["a","d"],"hint":"Writing a file into /tmp is not a trust change; judge every line by what it does to the store or the trust settings.","explain":["add-trusted-cert grants system-wide trust — a state change by definition — and the delete-certificate command at 08:03:26 removes a certificate from the System keychain, also a state change. Those are the two.","The find-certificate exports only write a text file to /tmp; they read the keychain and change nothing about trust. dump-trust-settings prints the current trust decisions and is likewise read-only. The obvious trap is treating the export's file write as a trust change."]},{"id":"e07","type":"terminal","perspective":"defender","scenario":{"summary":"Terminal: export the System keychain for the diff","text":["INC-3320 follow-up on MAC-DEV-01: the IR lead needs every certificate in the System keychain exported as PEM text, so it can be diffed against the golden image.","The host is live and the session is read-only by policy. Choose the macOS command that prints all system-keychain certificates in PEM form — and nothing that changes trust."]},"question":"Type the read-only command that prints all System-keychain certificates as PEM.","terminal":{"prompt":"soc@MAC-DEV-01","banner":["macOS triage shell — INC-3320","read-only policy: export and inspect; never change trust from this session"],"solution":"security find-certificate -a -p /Library/Keychains/System.keychain","elements":[{"label":"tool security","re":"^security( |$)"},{"label":"subcommand find-certificate","re":"find-certificate( |$)"},{"label":"flag -a (all certificates)","re":"(^| )-a( |$)"},{"label":"flag -p (PEM output)","re":"(^| )-p( |$)"},{"label":"system keychain path","re":"/Library/Keychains/System\\.keychain( |$)"}],"outputs":[{"re":"^security find-certificate","lines":["-----BEGIN CERTIFICATE-----","MIIDrDCCApKgAwIBAgIQb2x1ZQEXAMPLE8F2B1nQwCgYIKoZIzj0EAwIw","-----END CERTIFICATE-----","-----BEGIN CERTIFICATE-----","MIIGYzCCBEugAwIBAgIQb3J2QEXAMPLE3F9C44AA71D0wCgYIKoZIzj0EAwIw","-----END CERTIFICATE-----","(24 certificates printed in PEM form)"]},{"re":"^security dump-trust-settings","lines":["Number of trusted certs = 1","Cert 0: ACME-SSL-Inspect Root CA","    Trust: admin-assigned, system-wide"]}],"nearMiss":[{"re":"^security\\s+(add-trusted-cert|remove-trusted-cert|delete-certificate|delete-identity)","msg":"This changes the keychain or its trust settings. This session is read-only — export with find-certificate instead."},{"re":"^security\\s+import\\b","msg":"Import adds a certificate to the keychain — a state change the policy forbids here."}],"nearMissSample":"security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain evil-root.pem","partialSample":"security dump-trust-settings -d"},"hint":"The task needs every certificate printed as PEM text; one subcommand of this tool lists trust decisions without printing the certificates themselves.","explain":["The canonical command is security find-certificate -a -p /Library/Keychains/System.keychain: the macOS security tool, the find-certificate subcommand, the -a switch for all certificates, and -p for PEM output against the system keychain.","dump-trust-settings -d is the partial the session log shows: it lists trust decisions but prints no certificates, so the diff cannot be built from it. The add, remove, delete, and import forms are near misses — every one of them writes state, which the read-only policy and the evidence rules both forbid."]},{"id":"e08","type":"branch","perspective":"dual","scenario":{"summary":"Service desk demands removal — which root, what order?","text":["INC-3320: WKS-FIN-03 carries the sanctioned ACME-SSL-Inspect Root CA and the rogue Update Helper CA. Finance depends on the TLS-inspection path for the nightly reconcile batch.","The service desk ticket says: remove all unknown roots now. Work the tree your lead will defend in the post-incident review."],"artefacts":[{"label":"ARTEFACT 1 — machine Root store (excerpt)","kind":"code","lines":["Cert 0  ACME-SSL-Inspect Root CA  3F:9C:44:AA:71:D0  (CHG-7741)","Cert 1  Update Helper CA          7C:3A:E1:52:09:DF  (no record, Temp-dir install)","Cert 2  Microsoft Root CA         vendor-signed, OS-managed"]},{"label":"ARTEFACT 2 — service-desk demand (INC-3320)","kind":"ticket","lines":["PRIORITY: remove every root that is not on a vendor list, immediately.","Business note: payment reconcile batch runs 22:00-23:30 via inspection proxy."]}]},"question":"Choose the correct option at each step.","branch":{"steps":[{"prompt":"Two extra-looking roots are on the host. What protects the business first?","options":[{"id":"a","text":"Remove every root that is not on the vendor list, immediately"},{"id":"b","text":"Classify each root against CHG-7741 and the MDM baseline before any change"},{"id":"c","text":"Reboot the host and re-run the diff"}],"correct":"b","outcome":"Classification shows the inspection root is sanctioned; only the Update Helper CA is rogue."},{"prompt":"The rogue root's fingerprint matches no vendor record, and proxy logs show a fake site certificate it signed. Next?","options":[{"id":"a","text":"Trust it until the unknown vendor replies to your email"},{"id":"b","text":"Contain it: block the signing key at the proxy and plan a controlled removal"},{"id":"c","text":"Delete the corporate inspection root too, to be thorough"}],"correct":"b","outcome":"Containment is scoped; nobody has broken the inspection path the reconcile batch depends on."},{"prompt":"The nightly reconcile batch starts in two hours. When does the rogue root come out?","options":[{"id":"a","text":"Right now, mid-batch, speed beats ceremony"},{"id":"b","text":"After the batch, in a change window, with the listing archived"},{"id":"c","text":"Never — removal always breaks something"}],"correct":"b","outcome":"The removal lands in the change window with evidence intact and the batch unaffected."}],"final":{"question":"Which closing action will the post-incident review accept?","options":[{"id":"a","text":"Removed everything unknown at 02:00 and told finance afterwards"},{"id":"b","text":"Classified first, rogue contained, removed in a window, inspection root kept"},{"id":"c","text":"Changed nothing and monitored for a week with the rogue root still trusted"}],"correct":["b"]}},"hint":"Deleting the corporate inspection root is off the table from the start; the ticket decides which root is sanctioned, and the batch decides the timing.","explain":["Attacker perspective: the operator's timing is the tell — the fake certificate appeared while the reconcile batch was still hours away, betting that removal would be rushed and that the sanctioned root would be deleted in the same sweep, hiding the mimic in the collateral.","Defender perspective: classification before touching, containment without collateral, and a removal timed for a window the business can afford — each fork denies the operator both the disruption and the cover.","The tree rewards the least-aggressive sufficient action at every fork. Deleting everything unknown breaks the TLS-inspection path that finance runs on, and doing nothing leaves a rogue CA trusted with a fake certificate already observed. The accepted path removes exactly the rogue root, at exactly the right time, with the evidence archived."]},{"id":"e09","type":"match","perspective":"neutral","scenario":{"summary":"Which artefact proves which claim in INC-3320?","text":["The INC-3320 timeline lists four artefacts; the IR lead wants each claim worded to match what its artefact can actually prove.","Overclaiming is how cases fall apart in review: match each artefact to the claim it supports, and no stronger."],"artefacts":[{"label":"ARTEFACT 1 — INC-3320 artefact register (excerpt)","kind":"code","lines":["A1  store diff, WKS-LOG-04    unexplained roots since 02:31","A2  EDR process event         certutil -addstore Root from a Temp-folder updater","A3  registry event            new key under HKLM\\...\\SystemCertificates\\Root","A4  bundle hash, DB-LNX-02    differs from the golden-image value"]}]},"question":"Match each artefact to the claim it supports.","pairs":[{"left":"A1 — the store diff on WKS-LOG-04","right":"Proves the host gained roots; not who installed them"},{"left":"A2 — the EDR command event","right":"Proves which process ran the install, and when it ran"},{"left":"A3 — the registry write event","right":"Proves the store write itself, even when the parent process looked benign"},{"left":"A4 — the bundle hash mismatch","right":"Proves the Linux store changed with no record behind it"}],"hint":"Each artefact answers one question — what changed, who ran it, where it landed, or that state differs from known-good — never all four.","explain":["The diff shows an outcome: roots appeared. It cannot name an installer, which is why A1 pairs with the weakest claim. The EDR event names the process and the moment, so A2 supports the strongest attribution wording.","A3 proves the write landed in the trusted-root keys regardless of how innocent the parent looked — the write is the fact. A4 proves deviation from known-good on the Linux host; it names neither actor nor root, only that the state changed. Wording each claim to its artefact is what survives the review."]},{"id":"e10","type":"single","perspective":"defender","scenario":{"summary":"Forty hosts show the inspection root — all compromised?","text":["The morning diff says 40 hosts gained ACME-SSL-Inspect Root CA at 02:52, all deployed by the SCCM client. Two of those hosts also show ZZ-Update Validation CA, installed by svc-update.exe from a Temp folder.","The queue wants one incident for all 42 findings. The change records are below."],"artefacts":[{"label":"ARTEFACT 1 — baseline diff summary","kind":"code","lines":["hosts with ACME-SSL-Inspect Root CA : 40   deployed by SCCM (CHG-7741)","hosts also showing ZZ-Update CA     :  2   deployed by Temp-dir svc-update.exe","ZZ fingerprints match no published vendor value"]},{"label":"ARTEFACT 2 — CHG-7741 (approved window Sun 22:00-Mon 04:00)","kind":"ticket","lines":["Deploy ACME-SSL-Inspect Root CA to all Windows endpoints via SCCM.","Approved fingerprint 3F:9C:44:AA:71:D0. Owner: network-team@acme[.]example"]}]},"question":"What is the correct assessment?","options":[{"id":"a","text":"The ACME rollout is sanctioned; only the two ZZ findings need incident handling"},{"id":"b","text":"All 40 hosts are compromised with the same rogue CA"},{"id":"c","text":"The ACME root is the rogue one because TLS inspection is never legitimate"},{"id":"d","text":"The ZZ roots are benign because only two hosts have them"}],"correct":["a"],"hint":"Count the deployment sources before you count the victims: an SCCM client and a Temp-folder installer are not the same actor.","explain":["Forty identical installs from the SCCM client, inside the CHG-7741 window, with a matching fingerprint, are one sanctioned change — alarming-looking but benign. The two ZZ findings come from a different installer, at a different time, with no record and no published fingerprint: those are the incident.","Option b ignores the change records. Option c is an ideology, not an assessment. Option d confuses rarity with innocence — a rare rogue is still rogue, and in this case the Temp-folder provenance already says tampering."]},{"id":"e11","type":"drag","perspective":"defender","scenario":{"summary":"Route each finding to the telemetry that catches it","text":["The detection-engineering backlog has budget for exactly three telemetry sources this quarter.","Sort the four INC-3320 findings by the source that catches each one, so the budget goes where the gaps are."],"artefacts":[{"label":"ARTEFACT 1 — current telemetry coverage, INC-3320 estate","kind":"code","lines":["process & command-line : EDR on all WKS and MAC hosts, 30s resolution","registry & file        : Sysmon on the WKS fleet only","baseline diffing       : weekly, manual on Linux; none on kiosk builds"]}]},"question":"Sort each finding into the telemetry source that catches it.","zones":[{"id":"z1","label":"Process and command-line monitoring","accepts":["i1","i4"]},{"id":"z2","label":"Registry and file monitoring","accepts":["i2"]},{"id":"z3","label":"Trust-store baseline diffing","accepts":["i3"]}],"items":[{"id":"i1","text":"certutil -addstore Root launched by a Temp-folder updater"},{"id":"i2","text":"A new key created under HKLM\\...\\SystemCertificates\\Root"},{"id":"i3","text":"The bundle hash on DB-LNX-02 differs from the golden-image value"},{"id":"i4","text":"security add-trusted-cert run from an unusual shell on a Mac"}],"hint":"Two findings are commands somebody typed, one is a registry write, and one is a difference between two states.","explain":["Process monitoring catches commands while they run: the certutil install and the unexpected add-trusted-cert both surface there with their full command lines.","Registry and file monitoring catches the writes themselves — the new SystemCertificates key — even when the parent process looks harmless. Baseline diffing catches what the other two miss entirely: a silent change whose install moment nobody observed, like the altered bundle on DB-LNX-02."]},{"id":"e12","type":"multi","perspective":"defender","scenario":{"summary":"Which apps stayed protected from the rogue root?","text":["During INC-3320 the rogue Update Helper CA was machine-trusted on WKS-FIN-03 for at least nine hours.","The CISO asks which of the estate's apps were still protected during that window. Select the TWO that were."]},"question":"Select the TWO apps that stayed protected.","options":[{"id":"a","text":"The payment terminal app, because it pins the server certificate"},{"id":"b","text":"The payroll Java app, because its 2021-vintage cacerts never received the rogue root"},{"id":"c","text":"Outlook on Windows, because it uses the OS trust store that received the rogue root"},{"id":"d","text":"Chrome on Windows, because it ignores the Windows trust store"}],"correct":["a","b"],"hint":"One app checks the server itself, and one app reads a store the attacker never touched; the other two live in the store that was tampered with.","explain":["Pinned apps verify the server certificate against a known value themselves, so machine-wide trust in a rogue root fails the pin check. The payroll app trusts only its own cacerts file — untouched since 2021, stale, and untouched by the attacker as well — so it never believed the rogue CA. Its staleness is a separate patching finding, not an exposure in this window.","Outlook and Chrome on Windows resolve trust through the OS store the attacker tampered with, so both were exposed during the window. Option d is also factually wrong on Windows: Chrome uses the platform trust store there."]},{"id":"e13","type":"blank","perspective":"defender","scenario":{"summary":"Two lines for the hardening RFC","text":["The post-incident RFC needs two precise sentences before engineering will accept it.","Fill both blanks."]},"question":"Complete the two RFC lines.","blanks":[{"before":"Sysmon EID13 filter: flag writes whose TargetObject contains the ","after":" key family under HKLM or HKCU, whatever the parent process claims to be.","answer":["systemcertificates","system certificates"],"hint":"the registry key family whose name says exactly what it stores"},{"before":"Residual-risk note: apps that ","after":" certificates resist rogue roots, so they are recorded in the asset inventory.","answer":["pin","pins","pinned","pinning"],"hint":"the hardening word for an app that checks the server certificate itself"}],"hint":"One blank completes the registry filter with the key family that holds every trusted root; the other names the property that makes an app immune here.","explain":["The registry filter keys on the TargetObject field of the Sysmon event: any write whose target contains the SystemCertificates key family is flagged on both hives, so a rogue install is caught even when the parent process looks like maintenance tooling.","The RFC's honesty clause is the pinning note: apps that pin certificates do not trust the rogue root no matter what the store says, and the inventory of those apps is what the CISO reads first when this happens again."]},{"id":"e14","type":"single","perspective":"neutral","scenario":{"summary":"A -user install on a shared kiosk — who is affected?","text":["Forensics on a shared kiosk (no admin rights for users) recovered the command: certutil -user -addstore Root rogue.cer, run by the daytime account.","The ticket owner assumed the whole kiosk and every domain user were affected. Scope it correctly."]},"question":"Who is affected by this install?","options":[{"id":"a","text":"Every user of the kiosk immediately, and every domain user at next login"},{"id":"b","text":"All domain members, because the root publishes through Active Directory"},{"id":"c","text":"Only the profiles that load that account's CurrentUser Root store"},{"id":"d","text":"Nobody, because user stores reject additions without admin rights"}],"correct":["c"],"hint":"The command never touched the machine store; read the one switch that scopes it before estimating impact.","explain":["The -user switch writes to the CurrentUser Root store of the account that ran it. Only profiles that load that user's store are affected — typically that account's own sessions on the kiosk.","The machine-wide store was never touched, so neither the kiosk's other sessions nor the domain is affected, and AD publication is a separate mechanism this command does not perform. Option d is wrong because user stores do accept per-user additions without elevation — which is exactly why attackers without admin rights use this variant."]},{"id":"e15","type":"match","perspective":"neutral","scenario":{"summary":"Store events: what each one actually did","text":["The INC-3320 timeline lists three store events without interpretation.","Match each event to what it actually did, so the timeline reads truthfully."],"artefacts":[{"label":"ARTEFACT 1 — INC-3320 timeline rows (uninterpreted)","kind":"log","filter":true,"lines":["02:47:33  EventType=SetValue  TargetObject=...\\Root\\Certificates\\7C3AE15209DF\\Blob  Host=WKS-FIN-03","03:58:12  EventType=DeleteKey TargetObject=...\\Root\\Certificates\\B7E55102        Host=WKS-FIN-03","09:12:40  add-trusted-cert -r trustRoot   trust settings updated   Host=MAC-DEV-01"]}]},"question":"Match each observed event to its meaning.","pairs":[{"left":"EventType=SetValue under Root\\Certificates\\<hash>\\Blob","right":"A certificate blob was written into the machine Root store"},{"left":"EventType=DeleteKey under Root\\Certificates\\<hash>","right":"A certificate was removed from the machine Root store"},{"left":"add-trusted-cert with -r trustRoot","right":"Explicit root trust was granted through macOS trust settings"}],"hint":"One event writes, one event removes, one event grants belief — three different verbs, three different rows.","explain":["The SetValue row is an install: a certificate blob landed in the Root store, which is how Windows records a new trusted root. The DeleteKey row is the opposite — a removal, which during an incident can be either cleanup or evidence destruction.","The macOS row is a trust grant: add-trusted-cert with trustRoot changes the trust settings layer, not just the keychain contents. Reading the verb correctly keeps the timeline honest — and in this incident the SetValue row at 02:47 is the T1553.004 anchor."]}]}</script>
<script>
(function () {
  'use strict';

  /* ============================ utilities ============================ */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function mulberry32(seed) {
    var t = seed >>> 0;
    return function () {
      t += 0x6D2B79F5;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffled(arr, rnd) {
    var a = arr.slice(), i, j, tmp;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(rnd() * (i + 1));
      tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function fmt1(n) { return (Math.round(n * 10) / 10).toFixed(1); }
  function fmt2(n) { return (Math.round(n * 100) / 100).toFixed(2); }
  function fmtPct(sum, count) { return count > 0 ? Math.round((sum / count) * 100) : 0; }
  function hashId(s) {
    var h = 0, i;
    for (i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h;
  }
  function exSeed(ex, salt) { return ((S.seed ^ 0x9E3779B9) * 2654435761 + hashId(ex.id) * 97 + salt) >>> 0; }

  /* ============================ data ============================ */
  var DATA = JSON.parse($('exam-data').textContent);
  var EXS = DATA.exercises;
  var TOTAL = EXS.length;
  var BUDGET = (DATA.estimatedMinutes || 25) * 60;
  var PASSMARK = DATA.passMark || 70;
  var SEVCLS = { 'EASY': 'sev-easy', 'MEDIUM': 'sev-medium', 'HARD': 'sev-hard', 'EXTREMELY HARD': 'sev-extreme' };
  var byId = {};
  EXS.forEach(function (e) { byId[e.id] = e; });

  /* ============================ state ============================ */
  var S = {
    screen: 'intro',        // intro | exam | review | results
    attempt: 0,
    order: [],
    pos: 0,
    answers: {},            // exId -> widget state
    results: {},            // exId -> graded result
    skipped: [],            // exIds in the skip pool (never answered yet)
    hintUsed: {},
    creditSum: 0,
    answeredCount: 0,
    state: 'RUNNING',       // RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED
    resumeState: null,
    remaining: BUDGET,
    pauseAccum: { manual: 0, autoCheck: 0 },
    posted: false,
    mode: 'main',           // main | review
    reviewList: [],
    seed: 1,
    checkedId: null,
    exTimer: null,          // { exId, remaining } for per-exercise timed terminal exercises
    handshake: null
  };

  /* ============================ timer ============================ */
  var lastTick = Date.now();
  setInterval(function () {
    var now = Date.now();
    var dt = (now - lastTick) / 1000;
    lastTick = now;
    if (dt < 0 || dt > 2) { dt = 0.25; }
    if (S.state === 'RUNNING') {
      S.remaining -= dt;
      if (S.remaining <= 0) { S.remaining = 0; updateHeader(); endByTimeout(); return; }
      if (S.exTimer && !S.results[S.exTimer.exId] && S.screen === 'exam') {
        S.exTimer.remaining -= dt;
        var et = $('ex-timer-clock');
        if (et) { et.textContent = fmtClock(S.exTimer.remaining); }
        if (S.exTimer.remaining <= 0) { S.exTimer.remaining = 0; doCheck(true); }
      }
      updateTimerClock();
    } else if (S.state === 'PAUSED_MANUAL') {
      S.pauseAccum.manual += dt;
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      S.pauseAccum.autoCheck += dt;
    }
  }, 250);

  function updateTimerClock() {
    var el = $('hdr-clock');
    if (el) { el.textContent = fmtClock(S.remaining); }
  }
  function setState(next) {
    S.state = next;
    renderTimerPill();
    renderPauseOverlay();
  }
  function renderTimerPill() {
    var pill = $('hdr-timer');
    if (!pill) { return; }
    var clock = '<span class="t-clock" id="hdr-clock">' + fmtClock(S.remaining) + '</span>';
    if (S.state === 'RUNNING') {
      pill.className = 'pill pill-timer st-run';
      pill.innerHTML = '<span class="t-state">▶ Running</span>' + clock;
    } else if (S.state === 'PAUSED_MANUAL') {
      pill.className = 'pill pill-timer st-pause';
      pill.innerHTML = '<span class="t-state">⏸ PAUSED — manual (press Resume)</span>' + clock;
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      pill.className = 'pill pill-timer st-pause';
      pill.innerHTML = '<span class="t-state">⏸ PAUSED — reviewing feedback (resumes on Next)</span>' + clock;
    } else {
      pill.className = 'pill pill-timer st-end';
      pill.innerHTML = '<span class="t-state">■ Ended</span>' + clock;
    }
  }

  /* ============================ header ============================ */
  function headerHtml() {
    var sev = DATA.severity;
    var cls = SEVCLS[sev] || 'sev-easy';
    return '<header class="hdr" id="hdr">' +
      '<div class="hdr-row">' +
        '<span class="counter" id="hdr-counter"></span>' +
        '<span class="sev ' + cls + '" id="hdr-sev"><span class="dot" aria-hidden="true"></span>' + esc(sev) + '</span>' +
        '<span class="hdr-spacer"></span>' +
        '<span class="pill pill-timer" id="hdr-timer" role="timer"></span>' +
        '<span class="pill" id="hdr-score" aria-label="Live score"></span>' +
      '</div>' +
      '<div class="hdr-row">' +
        '<button type="button" class="btn" id="btn-hint">? Hint</button>' +
        '<button type="button" class="btn" id="btn-skip">Skip »</button>' +
        '<button type="button" class="btn" id="btn-pause">⏸ Pause</button>' +
        '<div class="progress" role="progressbar" id="hdr-progress" aria-label="Exam progress" aria-valuemin="0" aria-valuemax="' + TOTAL + '" aria-valuenow="0">' +
          '<div class="progress-fill" id="progress-fill"></div>' +
        '</div>' +
      '</div>' +
    '</header>';
  }
  function updateHeader() {
    var ex = currentEx();
    var counter = $('hdr-counter');
    if (counter) {
      if (S.screen === 'results') {
        counter.textContent = 'Exam complete';
      } else {
        var n = S.pos + 1;
        counter.textContent = (S.mode === 'review' ? 'Review · ' : '') + 'Exercise ' + n + ' of ' + TOTAL;
      }
    }
    var score = $('hdr-score');
    if (score) {
      var pct = fmtPct(S.creditSum, S.answeredCount);
      score.innerHTML = 'Score <b>' + fmt1(S.creditSum) + '</b>&nbsp;/&nbsp;' + S.answeredCount + ' · ' + pct + '%';
    }
    var hint = $('btn-hint'), skip = $('btn-skip'), pause = $('btn-pause');
    var answered = ex && !!S.results[ex.id];
    if (hint) {
      hint.disabled = answered || !!S.hintUsed[ex ? ex.id : ''] || S.state !== 'RUNNING' && S.state !== 'PAUSED_AUTO_CHECK';
      hint.setAttribute('aria-label', 'Hint (costs 10% of this exercise credit, one use only)');
    }
    if (skip) {
      skip.disabled = answered || S.state !== 'RUNNING';
      skip.setAttribute('aria-label', 'Skip this exercise and move it to the skipped pool');
    }
    if (pause) {
      var manual = S.state === 'PAUSED_MANUAL';
      pause.innerHTML = manual ? '▶ Resume' : '⏸ Pause';
      pause.disabled = S.state === 'ENDED';
      pause.setAttribute('aria-label', manual ? 'Resume the exam' : 'Pause the exam manually (hides the exercise)');
    }
    var fill = $('progress-fill');
    if (fill) {
      var done = S.answeredCount + S.skipped.length;
      var pctW = TOTAL > 0 ? Math.round((done / TOTAL) * 100) : 0;
      fill.style.width = pctW + '%';
      var pb = $('hdr-progress');
      if (pb) { pb.setAttribute('aria-valuenow', String(done)); }
    }
  }

  /* ============================ intro screen ============================ */
  function renderIntro() {
    S.screen = 'intro';
    var intro = DATA.intro;
    var kw = (intro.keywords || []).map(function (grp) {
      return '<div class="kw-theme"><h3>' + esc(grp.theme) + '</h3><ul>' +
        grp.items.map(function (k) { return '<li>' + esc(k) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    var html =
      '<div class="intro">' +
        '<section class="intro-strip" aria-label="Exam facts">' +
          '<h1>' + esc(DATA.mitreId) + ' — ' + esc(DATA.mitreName) + '</h1>' +
          '<div class="intro-sub">' + esc(DATA.objectType) + ' · MITRE ATT&CK · ' + esc(DATA.severity) + ' practice exam</div>' +
          '<div class="factrow">' +
            '<span class="fact"><b>' + TOTAL + '</b> exercises</span>' +
            '<span class="sev ' + (SEVCLS[DATA.severity] || 'sev-easy') + '"><span class="dot" aria-hidden="true"></span>' + esc(DATA.severity) + '</span>' +
            '<span class="fact">Estimated time: <b>' + DATA.estimatedMinutes + ' min</b></span>' +
            '<span class="fact">Timer budget: <b>' + fmtClock(BUDGET) + '</b></span>' +
            '<span class="fact">Pass mark: <b>' + PASSMARK + '%</b></span>' +
          '</div>' +
        '</section>' +
        '<section class="intro-card"><h2>What you will learn here</h2>' +
          intro.learn.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
        '</section>' +
        '<section class="intro-card"><h2>Keywords covered in this exam</h2>' +
          '<div class="kw-grid">' + kw + '</div>' +
        '</section>' +
        '<section class="intro-card"><h2>How this exam works</h2>' +
          '<ul class="how-list">' + intro.how.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' +
          '<div class="intro-start">' +
            '<button type="button" class="btn btn-primary btn-big" id="btn-start">Start exam</button>' +
            '<span class="start-note">The timer starts when you press Start.</span>' +
          '</div>' +
        '</section>' +
      '</div>';
    var app = $('app');
    app.innerHTML = html;
    $('btn-start').addEventListener('click', startAttempt);
  }

  /* ============================ attempt control ============================ */
  function startAttempt() {
    S.attempt += 1;
    S.seed = 1 + S.attempt * 7919;
    S.order = EXS.map(function (_, i) { return i; });
    if (S.attempt > 1) {
      S.order = shuffled(S.order, mulberry32(S.seed));
    }
    S.pos = 0;
    S.answers = {};
    S.results = {};
    S.skipped = [];
    S.hintUsed = {};
    S.creditSum = 0;
    S.answeredCount = 0;
    S.pauseAccum = { manual: 0, autoCheck: 0 };
    S.posted = false;
    S.mode = 'main';
    S.reviewList = [];
    S.checkedId = null;
    S.exTimer = null;
    S.remaining = BUDGET;
    S.screen = 'exam';
    setState('RUNNING');
    renderExam();
  }
  function currentEx() {
    if (S.screen !== 'exam' && S.screen !== 'results') { return null; }
    if (S.pos < 0 || S.pos >= S.order.length) { return null; }
    return EXS[S.order[S.pos]];
  }

  /* ============================ exercise rendering ============================ */
  function scenarioLong(sc) {
    var chars = (sc.text || []).join(' ').length;
    return chars > 600 || (sc.artefacts && sc.artefacts.length >= 2);
  }
  function artefactHtml(a, idx) {
    var body;
    if (a.kind === 'log' || a.kind === 'code') {
      var lines = (a.lines || []).map(function (ln) {
        return '<span class="ln">' + highlight(ln) + '</span>';
      }).join('');
      var filter = a.filter ? '<input type="text" class="logfilter" data-filter="' + idx + '" placeholder="Filter lines (text match)" aria-label="Filter log lines">' : '';
      body = filter + '<pre class="mono loglines" data-logbody="' + idx + '">' + lines + '</pre>';
    } else {
      body = '<pre class="mono loglines">' + (a.lines || []).map(function (ln) { return esc(ln); }).join('\n') + '</pre>';
    }
    return '<div class="artefact"><div class="artefact-label"><span aria-hidden="true">▤</span>' + esc(a.label) + '</div>' + body + '</div>';
  }
  var SYN_RE = /(&quot;[^&]*?&quot;)|(\bT\d{4}(?:\.\d{3})?\b)|(--?[A-Za-z][\w-]*)|(\b[\w.\-]+(?:[\/\\][\w.\-@]+)+[\/\\]?)|(\b\d{1,3}(?:\[\.\]\d{1,3}){2,3}\b)|(\b(?:allowed|denied|accepted|rejected|granted|denied|quarantine|failed|success|error|warning|blocked|trusted|unblocked|Root|UNTRUSTED|SIGNATURE|PASS|FAIL)\b)/gi;
  function highlight(line) {
    var e = esc(line);
    return e.replace(SYN_RE, function (m, q, mid, flag, path, ip, kw) {
      if (q) { return '<span class="tok-s">' + q + '</span>'; }
      if (mid) { return '<span class="tok-m">' + mid + '</span>'; }
      if (flag) { return '<span class="tok-f">' + flag + '</span>'; }
      if (path) { return '<span class="tok-c">' + path + '</span>'; }
      if (ip) { return '<span class="tok-n">' + ip + '</span>'; }
      if (kw) { return '<span class="tok-k">' + kw + '</span>'; }
      return m;
    });
  }
  function optText(ex, oid) {
    var o = (ex.options || []).find(function (x) { return x.id === oid; });
    return o ? o.text : oid;
  }
  function optsHtml(ex, kind) {
    var rnd = mulberry32(exSeed(ex, 1));
    var ids = ex.options.map(function (o) { return o.id; });
    var view = shuffled(ids, rnd);
    var role = kind === 'single' ? 'radio' : 'checkbox';
    var a = S.answers[ex.id] || {};
    var sel = a.sel || [];
    return '<div class="opts" role="group" aria-label="Answer options">' + view.map(function (oid, i) {
      /* options are shuffled per attempt; correct positions vary */
      var isSel = sel.indexOf(oid) >= 0;
      return '<button type="button" class="opt" data-oid="' + esc(oid) + '" role="' + role + '" aria-checked="' + (kind === 'single' && isSel) + '" aria-pressed="' + (kind === 'multi' && isSel) + '">' +
        '<span class="opt-key">' + String.fromCharCode(65 + i) + '.</span>' +
        '<span class="opt-text">' + esc(optText(ex, oid)) + '</span>' +
        '<span class="opt-mark">' + (isSel ? '● Selected' : '') + '</span>' +
      '</button>';
    }).join('') + '</div>' +
    (kind === 'multi' ? '<p class="note">Select all options that apply. Partial credit is possible.</p>' : '');
  }
  function exerciseHtml(ex) {
    var sc = ex.scenario || {};
    var long = scenarioLong(sc);
    var paras = (sc.text || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
    var arts = (sc.artefacts || []).map(function (a, i) { return artefactHtml(a, i); }).join('');
    var body = '<div class="scen-body" id="scen-body">' + paras + arts + '</div>';
    var html = '';
    if (S.mode === 'review') {
      html += '<div class="review-banner">⚠ Skipped earlier — you are answering it now from the review screen. The timer is running.</div>';
    }
    html += '<section class="block" aria-label="Scenario">' +
      '<div class="block-h h-scenario"><span class="bico" aria-hidden="true">▤</span> SCENARIO<span class="hspacer"></span>' +
        '<button type="button" class="scen-toggle" id="btn-scen" aria-expanded="' + (!long) + '">' + (long ? 'Show scenario' : 'Hide scenario') + '</button></div>' +
      (long ? '<div class="scen-summary" id="scen-summary">' + esc(sc.summary || '') + ' — collapsed</div>' : '') +
      '<div class="block-b">' + body + '</div>' +
    '</section>';
    html += '<section class="block" aria-label="Question">' +
      '<div class="block-h h-question"><span class="bico" aria-hidden="true">❓</span> QUESTION</div>' +
      '<div class="block-b"><p class="q-text">' + esc(ex.question) + '</p></div>' +
    '</section>';
    html += '<section class="block" aria-label="Your answer">' +
      '<div class="block-h h-answer"><span class="bico" aria-hidden="true">✎</span> YOUR ANSWER</div>' +
      '<div class="block-b">' + widgetHtml(ex) + '</div>' +
    '</section>';
    html += '<div id="fb-slot"></div>';
    html += '<div class="actionbar">' +
      '<button type="button" class="btn btn-primary" id="btn-check">Check answer</button>' +
      '<button type="button" class="btn btn-primary" id="btn-next" style="display:none"></button>' +
      '<span class="note">Check stops the timer so you can read the feedback without pressure.</span>' +
    '</div>';
    return html;
  }
  function widgetHtml(ex) {
    var a = S.answers[ex.id] || (S.answers[ex.id] = {});
    var inner = '';
    if (ex.type === 'single') {
      inner = optsHtml(ex, 'single');
    } else if (ex.type === 'multi') {
      inner = optsHtml(ex, 'multi');
    } else if (ex.type === 'match') {
      var rnd = mulberry32(exSeed(ex, 2));
      var rights = shuffled(ex.pairs.map(function (p) { return p.right; }), rnd);
      inner = '<div class="matchrows">' + ex.pairs.map(function (p, i) {

        return '<div class="matchrow"><span class="match-left">' + esc(p.left) + '</span>' +

      }).join('') + '</div>';
    } else if (ex.type === 'order' || ex.type === 'prioritize') {
      if (!a.arr) {
        var idxs = ex.steps.map(function (_, i) { return i; });
        a.arr = shuffled(idxs, mulberry32(exSeed(ex, 3)));
      }
      var label = ex.type === 'prioritize' ? 'Priority' : 'Step';
      inner = '<ol class="orderlist">' + a.arr.map(function (si, pos) {
        return '<li class="orderitem" data-pos="' + pos + '">' +

            '<button type="button" data-move="up" data-pos="' + pos + '" aria-label="Move up: ' + esc(ex.steps[si]) + '">▲</button>' +
            '<button type="button" data-move="down" data-pos="' + pos + '" aria-label="Move down: ' + esc(ex.steps[si]) + '">▼</button>' +
          '</span></li>';
      }).join('') + '</ol>' +
      '<p class="note">' + label + ' 1 is the first position. Use the arrows to reorder.</p>';
    } else if (ex.type === 'blank') {
      inner = '<p class="blankline">' + ex.blanks.map(function (b, i) {
        var val = a.blanks && a.blanks[i] ? a.blanks[i] : '';
        if (b.choices) {
          return esc(b.before) + '<select class="blank-sel" data-b="' + i + '" aria-label="' + esc(b.hint || 'Blank') + '">' +
            '<option value="">— choose —</option>' +
            b.choices.map(function (c) { return '<option value="' + esc(c) + '"' + (val === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') +
            '</select>' + esc(b.after || '');
        }
        return esc(b.before) + '<input type="text" class="blank-in" data-b="' + i + '" value="' + esc(val) + '" aria-label="' + esc(b.hint || 'Blank') + '" autocomplete="off" spellcheck="false" size="' + Math.max(10, Math.min(40, (b.answer[0] || '').length + 4)) + '">' + esc(b.after || '');
      }).join('') + '</p>';
    } else if (ex.type === 'drag') {
      if (!a.placed) { a.placed = {}; }
      if (!a.bankOrder) { a.bankOrder = shuffled(ex.items.map(function (it) { return it.id; }), mulberry32(exSeed(ex, 4))); }
      var placedIds = Object.keys(a.placed);
      var bankItems = ex.items.filter(function (it) { return placedIds.indexOf(it.id) < 0; });
      var inBank = a.bankOrder.filter(function (iid) { return bankItems.some(function (it) { return it.id === iid; }); });
      inner = '<div class="dnd">' +
        '<div class="bank" id="bank" aria-label="Item bank"><span class="bank-title">Items</span>' +
          inBank.map(function (iid) {
            var it = ex.items.find(function (x) { return x.id === iid; });
            return '<button type="button" class="bankitem" draggable="true" data-iid="' + esc(iid) + '">' + esc(it.text) + '<span class="place-note">Click to select, then click a zone</span></button>';
          }).join('') +
        '</div>' +
        '<div class="zones">' + ex.zones.map(function (z) {
          var inside = ex.items.filter(function (it) { return a.placed[it.id] === z.id; });
          return '<div class="zone" data-zid="' + esc(z.id) + '" tabindex="0" role="button" aria-label="Drop zone: ' + esc(z.label) + '. Select an item, then press Enter to place it.">' +
            '<div class="zone-h">' + esc(z.label) + '</div>' +
            '<div class="zone-items">' + inside.map(function (it) {
              return '<button type="button" class="bankitem" draggable="true" data-iid="' + esc(it.id) + '" data-inzone="' + esc(z.id) + '">' + esc(it.text) + '<span class="place-note">Click to send back to the bank</span></button>';
            }).join('') + '</div></div>';

    } else if (ex.type === 'terminal') {

      var promptTxt = ex.terminal.prompt + ':~$';
      inner = '<div class="shell" role="group" aria-label="Simulated terminal (nothing is executed for real)">' +
        '<div class="shell-head"><span class="dot" aria-hidden="true"></span> simulated shell — offline sandbox, nothing is executed for real</div>' +
        '<div class="shell-out" id="shell-out">' + a.scroll.map(function (ln) { return '<div>' + highlight(ln) + '</div>'; }).join('') + '</div>' +
        '<div class="shell-in"><span class="prompt">' + esc(promptTxt) + '</span>' +
        '<input type="text" class="shell-cmd" id="shell-cmd" aria-label="Type a command and press Enter" autocomplete="off" autocapitalize="off" spellcheck="false"></div></div>' +
        '<div class="shell-note">Type the command and press Enter, then press <strong>Check answer</strong>. Unknown commands are rejected by the sandbox.</div>' +
        (ex.terminal.timeLimit ? '<div class="ex-timer" id="ex-timer">⏱ Exercise timer: <span class="t-clock" id="ex-timer-clock">' + fmtClock(S.exTimer && S.exTimer.exId === ex.id ? S.exTimer.remaining : ex.terminal.timeLimit) + '</span> — this limit applies to this exercise only</div>' : '');
    } else if (ex.type === 'branch') {
      var br = ex.branch;

      if (st < br.steps.length) {

          '<div class="opts" style="margin-top:10px">' + step.options.map(function (o, i) {

      } else {

          '<div class="opts" style="margin-top:10px">' + f.options.map(function (o, i) {
            var isSel = fsel.indexOf(o.id) >= 0;
            return '<button type="button" class="opt" data-foid="' + esc(o.id) + '" role="' + (multi ? 'checkbox' : 'radio') + '" aria-checked="' + (!multi && isSel) + '" aria-pressed="' + (multi && isSel) + '">' +
              '<span class="opt-key">' + String.fromCharCode(65 + i) + '.</span><span class="opt-text">' + esc(o.text) + '</span>' +
              '<span class="opt-mark">' + (isSel ? '● Selected' : '') + '</span></button>';
          }).join('') + '</div>' +
          (multi ? '<p class="note">Select all options that apply.</p>' : '') +
          (a.outcomes && a.outcomes.length ? a.outcomes.map(function (o) { return '<div class="branch-outcome">' + esc(o) + '</div>'; }).join('') : '');

      inner += '<div class="hint-panel" role="note"><div class="hp-h">? Hint — 10% of this exercise credit will be deducted</div>' + esc(ex.hint) + '</div>';
