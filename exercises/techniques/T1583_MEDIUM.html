ted devices; <b>.006 Web Services<\/b> — signing up for sites like GitHub, Dropbox or\nTwitter; <b>.007 Serverless<\/b> — using cloud functions such as Cloudflare Workers or AWS Lambda;\n<b>.008 Malvertising<\/b> — buying online adverts that push malware.<\/p>\n<p><b>Why does an attacker do this?<\/b> Own infrastructure gives them: a place to host fake login pages;\na place to stage malware; servers to receive stolen data (command and control); and traffic that blends\nin with normal cloud or web traffic. They can provision it fast, change it fast, and shut it down fast.\nThey can pay with crypto, use free trials, use private WHOIS, or buy an old domain that already looks\ntrustworthy. All of this makes it hard to tie the infrastructure back to a person.<\/p>\n<p><b>Who uses this object in real work?<\/b> Almost every security role touches it:<\/p>\n<ul>\n<li><b>SOC analysts<\/b> see the results: alerts about new or strange domains and fresh servers.<\/li>\n<li><b>CTI analysts<\/b> track which actor bought what, and write reports naming T1583.<\/li>\n<li><b>Detection engineers<\/b> build watches on WHOIS, passive DNS, certificate logs and scan data\n(DET0895 / AN2027 in ATT&amp;CK).<\/li>\n<li><b>Threat hunters and IR<\/b> pivot on infrastructure: domain age, hosting, certificates.<\/li>\n<li><b>Red teamers<\/b> rent the same services for authorised engagements.<\/li>\n<li><b>GRC and control owners<\/b> accept that this phase cannot be stopped directly — ATT&amp;CK lists\nonly <b>M1056 Pre-compromise<\/b> — so controls focus on the follow-on attack.<\/li>\n<\/ul>\n<p><b>Tools and deliverables<\/b> you will meet: WHOIS lookups, passive DNS, certificate transparency\nlogs, internet-scan services, newly-registered-domain feeds, brand monitoring, takedown requests, and\nATT&amp;CK-mapped threat intel reports. <b>The risks it addresses:<\/b> phishing from lookalike domains,\nmalware hosting, C2 servers, and malicious adverts — all built on acquired infrastructure.<\/p>\n", "themes": [{"name": "Technique identity & matrix position", "items": ["T1583 Acquire Infrastructure", "Technique (not a tactic)", "Tactic: Resource Development (TA0042)", "Platforms: PRE", "Siblings: T1584 Compromise Infrastructure, T1588 Obtain Capabilities", "Feeds Phishing (T1566), Drive-by Compromise (T1189), C2 (T1071/T1102), Proxy (T1090)"]}, {"name": "The eight sub-techniques (acquisition targets)", "items": ["T1583.001 Domains", "T1583.002 DNS Server", "T1583.003 Virtual Private Server", "T1583.004 Server", "T1583.005 Botnet", "T1583.006 Web Services", "T1583.007 Serverless", "T1583.008 Malvertising"]}, {"name": "Adversary motivations & trade-offs", "items": ["Blend in with normal traffic", "Rapidly provision / modify / shut down", "Hard to tie back to the attacker", "Free trial periods", "Bulletproof & minimal-KYC hosting", "Aged / expired domain reputation", "Homoglyphs, typosquats, IDN homograph attacks", "Private WHOIS & varied registrars", "Residential proxy services", "Payment in crypto / prepaid cards"]}, {"name": "Telemetry, data sources & detection strategy", "items": ["Detection Strategy DET0895 (analytic AN2027)", "Internet-scan data: listening services, certificates in use, SSL/TLS negotiation features", "DNS registry data", "Logged DNS data", "WHOIS registration data", "Detection focus on follow-on stages (e.g. Command and Control)"]}, {"name": "Mitigations & control limits", "items": ["M1056 Pre-compromise", "No direct preventive control (outside enterprise visibility)", "Newly-registered-domain feeds", "Brand monitoring & takedowns", "Ad blockers against malvertising follow-on", "Aged-domain evasion of age-based blocks"]}, {"name": "Real-world procedure examples", "items": ["Agrius, Contagious Interview, Ember Bear (commercial VPN services)", "Kimsuky (crypto-funded servers)", "Sandworm Team (resellers, email campaign services)", "Star Blizzard (HubSpot, MailerLite)", "Sea Turtle (VPN networks, adversary-in-the-middle DNS)", "APT41 DUST (Cloudflare Workers)", "Mustard Tempest & Raspberry Robin (malvertising)", "APT5 / HAFNIUM / Ke3chang (ORB networks)"]}, {"name": "Attribution & infrastructure intelligence", "items": ["Infrastructure overlap is a weak signal alone", "Shared registrars & privacy services", "Reseller chains blur ownership", "ORB networks raise defender cost", "Confidence language in CTI reporting"]}], "focus": "This tier combines two ideas at a time: sub-technique choice and attacker goals, WHOIS plus mail evidence, detection limits and SOC triage.", "rules": "\n<h2>How this exam works<\/h2>\n<ul>\n<li><b>Goal:<\/b> master <b>T1583 — Acquire Infrastructure<\/b> at the <b>MEDIUM<\/b> level.\nYou must combine two facts before the answer is clear.<\/li>\n<li><b>Questions:<\/b> 16 exercises. <b>Pass mark: 70%.<\/b> <b>Timer: 35 minutes.<\/b><\/li>\n<li><b>Exercise types in this tier:<\/b> two-step reasoning, matching, drag &amp; drop, an incident branch, an alert queue, one dig shell exercise and one log viewer.<\/li>\n<li><b>Partial credit:<\/b> some exercises have more than one right part. Each right part earns a share\nof the score. Wrong picks subtract from your score. If you select everything, you get 0 for that\nexercise. A partly right answer still earns part of the credit: credit = (H − W) / N.<\/li>\n<li><b>Check stops the clock:<\/b> when you press <b>Check<\/b>, the timer stops by itself. You can read\nthe notes for as long as you want. The timer starts again only when you press <b>Next<\/b>\n(or Final Submit on the last exercise).<\/li>\n<li><b>Manual pause:<\/b> the Pause button stops the timer and hides the exercise. Press Resume to continue.<\/li>\n<li><b>Hint:<\/b> one hint per exercise. It costs 10% of that exercise's credit. Hints never reveal the answer.<\/li>\n<li><b>Skip:<\/b> every exercise has a Skip button. Skipping does not stop the timer and does not show\nthe answer. Before you finish, you get a screen to return to skipped exercises. Skipped exercises you\nnever answer are excluded from the score — they count as neither right nor wrong.<\/li>\n<li><b>Retake:<\/b> if you fail, you can retake the exam. Questions and answer choices are shuffled again.<\/li>\n<li><b>Defanged indicators:<\/b> this lab writes harmful addresses safely, like\n<code>hxxp://evil[.]example<\/code> and <code>45[.]33[.]10[.]7<\/code>. In terminal exercises, type\ndomains the same defanged way.<\/li>\n<\/ul>\n"}, "exercises": [{"id": "m01", "type": "qcm", "sum": "Correlate WHOIS with a mail wave", "scen": "Ticket #2214: your mail gateway logged a wave of HR-themed emails. The links go to a domain nobody knows. You pull the WHOIS record and the mail log.", "arts": [{"label": "WHOIS record (shortened)", "text": "Domain Name:  hr-portal-nw[.]com\nRegistrar:     Best-Name Registrar\nCreation Date: 2026-10-08  (6 days ago)\nRegistrant:    Redacted for Privacy, Panama, PA\nName Server:   ns1.dns-parking[.]net"}, {"label": "Mail gateway log excerpt", "text": "2026-10-14 08:02:11  FROM hr-alerts@hr-portal-nw[.]com\n  TO 47 recipients (recruiting group)\n  SUBJECT: Your application status — action needed\n  LINK: hxxps://hr-portal-nw[.]com/apply  (defanged)\n  Verdict: delivered (no rule matched)\n\n2026-10-14 08:02:19  FROM hr-alerts@hr-portal-nw[.]com  (2nd wave, 31 recipients)"}], "q": "Combining both artefacts — which sub-technique did the adversary perform to enable this email?", "note": null, "hint": "Ask: what did the attacker need to acquire before this email could exist?", "study": "T1583.001 Domains — registration facts (age, privacy, parking) plus usage evidence identify domain acquisition.", "ex": "<p>Step one: WHOIS says the domain is 6 days old and hidden behind a privacy service. Step two: the mail wave uses that exact domain. Two facts together → the attacker acquired the domain (T1583.001) to send phishing (T1566). One artefact alone would be weaker; correlation is the skill this tier trains.<\/p>", "opts": [{"t": "T1583.001 — Domains", "c": true, "why": ["The mail wave rides on a domain registered 6 days ago with a privacy-shielded owner: acquired infrastructure."]}, {"t": "T1583.005 — Botnet", "c": false, "why": ["Nothing shows a rented infected network; the sender is a fresh domain."]}, {"t": "T1583.007 — Serverless", "c": false, "why": ["No cloud-function evidence appears in either artefact."]}, {"t": "T1588.001 — Obtain Capabilities: Malware", "c": false, "why": ["The emails are not malware purchases; the artefacts show a bought domain."]}]}, {"id": "m02", "type": "multi", "sum": "Select the true T1583 activities", "scen": "A junior analyst lists six activities from a threat report. Some are T1583. Some are other techniques. Select all that are genuinely <b>T1583 — Acquire Infrastructure<\/b>.", "arts": [], "q": "Select ALL activities that are T1583.", "note": "Select <b>ALL<\/b> that apply. Partial credit applies.", "hint": "Ask for each: did the attacker buy, rent or register something of their own — or abuse something that already existed?", "study": "T1583 = buy / rent / register (VPS, domains, botnets, web services, residential proxies). Abuse of victim assets is T1584; token theft is not acquisition.", "ex": "<p>Four items are acquisitions: the VPS (.003), the typosquat (.001), the booter subscription (.005) and the residential proxies (named in T1583’s description). The GitHub token is credential abuse, and the victim web server is T1584. The H−W formula means each wrong pick cancels one right pick — select only what you can defend.<\/p>", "opts": [{"t": "Bought a VPS from a provider that asks no identity questions", "c": true, "why": ["Renting a VPS with minimal registration is T1583.003."]}, {"t": "Registered a typosquat of the CFO’s name", "c": true, "why": ["Registering a lookalike name is T1583.001."]}, {"t": "Paid a booter/stresser subscription for a 24-hour DDoS window", "c": true, "why": ["Subscribing to a botnet-for-rent is T1583.005."]}, {"t": "Rented a residential-proxy service to rotate exit IPs", "c": true, "why": ["ATT&amp;CK’s T1583 text names residential proxy acquisition as part of the technique."]}, {"t": "Stole a developer’s GitHub token and read private repos", "c": false, "why": ["That is credential theft and collection — nothing was acquired, it was abused."]}, {"t": "Planted malware on the victim’s own web server", "c": false, "why": ["Using victim-owned servers is T1584 Compromise Infrastructure."]}]}, {"id": "m03", "type": "dd", "sum": "Three-way sort: T1583 vs T1584 vs T1588", "scen": "Resource Development has three sibling techniques. Sort each action into the right one. The third bucket is for obtaining capabilities (tools, malware, exploits) — not infrastructure.", "arts": [], "q": "Drag each action to the correct technique.", "note": null, "hint": "Acquire = their own. Compromise = victim’s. Capabilities = tools and malware, not places.", "study": "Resource Development trio: T1583 (acquire places), T1584 (compromise places), T1588 (obtain tools/malware).", "ex": "<p>The three siblings divide preparation work: <b>places<\/b> they own (T1583), <b>places<\/b> they steal (T1584), and <b>things<\/b> they use (T1588). The expired-domain purchase is a favourite trick: the old reputation survives the sale. That is why reports about aged domains still cite T1583.<\/p>", "zones": [{"k": "t1583", "n": "T1583 — Acquire Infrastructure"}, {"k": "t1584", "n": "T1584 — Compromise Infrastructure"}, {"k": "t1588", "n": "T1588 — Obtain Capabilities"}], "items": [{"t": "Buys an expired domain with an old good reputation", "z": "t1583", "why": ["Aged-domain acquisition is T1583.001."]}, {"t": "Roots a hosting box and plants a C2 agent on it", "z": "t1584", "why": ["Breaking into third-party infrastructure is T1584."]}, {"t": "Downloads a cracked offensive toolkit from a forum", "z": "t1588", "why": ["Obtaining tools/malware is T1588, not infrastructure."]}, {"t": "Registers a Google Apps Script endpoint for redirects", "z": "t1583", "why": ["Serverless sign-up is T1583.007."]}, {"t": "Hacks a church website to host a watering hole", "z": "t1584", "why": ["The website belongs to a victim — compromise, T1584."]}, {"t": "Buys a malware builder on an underground market", "z": "t1588", "why": ["A purchased capability, T1588."]}]}, {"id": "m04", "type": "match", "sum": "Match sub-technique to operational use", "scen": "You brief a red-team colleague on why an attacker picks each sub-technique. Match each sub-technique to its best operational use.", "arts": [], "q": "Match each sub-technique to the use that fits it best.", "hint": "Speed vs scale vs blending vs placement.", "study": "Operational fits: VPS → C2 hosting; Botnet → scale/mail waves; Web Services → blending; Malvertising → fake downloads in search.", "ex": "<p>Each sub-technique buys something different: a VPS buys <b>speed and reputation<\/b>, a botnet buys <b>scale<\/b>, web services buy <b>camouflage<\/b>, malvertising buys <b>placement<\/b>. Real actors combine them — ATT&amp;CK’s procedure examples show VPS C2 (APT38 on Hostwinds) and web-service C2 (APT29 on Twitter) in the same campaigns.<\/p>", "pairs": [{"l": "T1583.003 — Virtual Private Server", "r": "Stand up one C2 server fast on a reputable cloud range", "why": ["VPS gives speed plus the good name of big cloud networks."]}, {"l": "T1583.005 — Botnet", "r": "Push a large mail wave through thousands of rented infected hosts", "why": ["Botnets give scale and thousands of sending sources."]}, {"l": "T1583.006 — Web Services", "r": "Blend C2 into normal traffic to GitHub or Dropbox", "why": ["Trusted third-party sites make the traffic look ordinary."]}, {"l": "T1583.008 — Malvertising", "r": "Buy search ads that push a fake download", "why": ["Ads place the payload above real results."]}]}, {"id": "m05", "type": "logq", "sum": "Machine-like beaconing to a fresh domain", "scen": "The same proxy log, now with intervals visible. One host contacts a six-day-old domain every 60 seconds, four times in a row, right after the domain was registered.", "arts": [], "q": "Which domain shows machine-like regular contact that started right after its registration?", "note": null, "hint": "Look for the freshest domain whose timestamps repeat at a fixed interval.", "study": "Beaconing (fixed intervals) to a freshly registered domain links T1583 to its follow-on use in C2 (T1071).", "ex": "<p>Step one: spot the fixed 60-second rhythm — machines do that, humans do not. Step two: the age column says the domain is 6 days old. Two ideas combined: the domain was acquired (T1583) and is now used for command and control (T1071). ATT&amp;CK itself says detection of T1583 focuses on such follow-on stages.<\/p>", "log": "# proxy log 2026-10-14 — notes from our feed in the right column\n08:31:04  10[.]0[.]4[.]15   settings-win.data.microsoft[.]com   AGE 11y   note: telemetry, normal\n08:33:41  10[.]0[.]4[.]22   nwhelpdesk-status[.]net             AGE 6d    note: NEW, first seen today\n08:34:41  10[.]0[.]4[.]22   nwhelpdesk-status[.]net             AGE 6d    note: NEW\n08:35:41  10[.]0[.]4[.]22   nwhelpdesk-status[.]net             AGE 6d    note: NEW\n08:41:02  10[.]0[.]5[.]31   logistics-partner[.]com             AGE 4y    note: partner portal\n08:44:10  10[.]0[.]6[.]11   cdn.jsdelivr[.]net                  AGE 8y    note: public CDN\n08:47:55  10[.]0[.]7[.]9    mailfilter.nwind.internal            AGE 2y    note: internal FQDN\n08:52:29  10[.]0[.]4[.]22   nwhelpdesk-status[.]net             AGE 6d    note: NEW", "logLabel": "Proxy log with feed notes (2026-10-14)", "widget": {"type": "qcm", "opts": [{"t": "nwhelpdesk-status[.]net", "c": true}, {"t": "settings-win.data.microsoft[.]com", "c": false}, {"t": "logistics-partner[.]com", "c": false}, {"t": "mailfilter.nwind.internal", "c": false}]}}, {"id": "m06", "type": "term", "sum": "dig: get just the answer line", "scen": "Incident NW-2214. You suspect <b>mail-corp-update[.]com<\/b> and need the IP it points to. The lab shell has <b>dig<\/b>. Your lead says: “I only want the answer line, not the whole answer section.” <b>Lab rule:<\/b> type domains defanged.", "arts": [], "q": "Type the dig command that prints only the A-record answer line for mail-corp-update[.]com.", "note": "Type the command, press Enter (or Run), then press Check.", "hint": "You need an option that shortens dig’s output to the answer values only.", "study": "dig +short &lt;domain&gt; prints only the resolved values — here one A record.", "ex": "<p>dig reads DNS. The <b>+short<\/b> option prints only the answer values: 198[.]51[.]100[.]23. Without it, dig also prints the QUESTION and ANSWER section headers, which is noise in tickets. That single IP is the footprint of the rented server behind the acquired domain — the pivot point for your next WHOIS and scan lookups.<\/p>", "term": {"prompt": "analyst@lab:~$", "avail": ["dig"], "canonical": "dig +short mail-corp-update[.]com", "out": {"dig +short mail-corp-update[.]com": "; <<>> dig +short mail-corp-update[.]com\n198[.]51[.]100[.]23", "dig mail-corp-update[.]com": "; <<>> dig mail-corp-update[.]com\n;; QUESTION SECTION:\n;mail-corp-update[.]com.   IN  A\n;; ANSWER SECTION:\nmail-corp-update[.]com. 300  IN  A  198[.]51[.]100[.]23\n;; Query time: 18 msec"}, "elements": [{"re": "(^| )dig( |$)", "name": "tool: dig", "desc": "The DNS lookup tool named in the task."}, {"re": "\\+short", "name": "option: +short", "desc": "Prints only the answer values — what your lead asked for."}, {"re": "mail-corp-update\\.com", "name": "target: mail-corp-update[.]com", "desc": "The suspicious domain, typed defanged as the lab requires."}], "forbidden": []}, "terminal": true, "avail": ["dig"]}, {"id": "m07", "type": "branch", "sum": "Branching: the ceo-nwind[.]com incident", "scen": "Monday 09:15. The SOC queue shows an email from <b>ceo-nwind[.]com<\/b> asking a manager to “review an attached invoice”. The domain was registered 2 days ago. Nothing has happened yet beyond the email. Work the incident step by step.", "arts": [], "q": "Choose the best action at each step of the incident.", "note": "Answer each step, then press Check on the last step. Intermediate confirms do not stop the timer.", "hint": "Step 1: scope before acting. Step 2: fresh domain + fresh cert + VPS. Step 3: contain, remove, report.", "study": "Incident flow for acquired-domain phishing: scope → attribute the infrastructure → contain and start takedowns.", "ex": "<p>The branch trains the order of work: <b>scope<\/b>, then <b>explain<\/b>, then <b>act<\/b>. Each step used the previous result. The infrastructure facts (2-day domain, yesterday’s cert, VPS range) are the T1583 half of the story; the emails are the T1566 half. Both perspectives meet here: the attacker bought quiet infrastructure; you priced it out of the game.<\/p>", "steps": [{"add": null, "q": "Step 1 — Your first move as the on-call analyst?", "out": "You find 11 more mailboxes received the same link. The campaign is wider than one email.", "opts": [{"i": 0, "o": {"t": "Search the mail gateway for every recipient of that domain", "c": true, "why": ["Scope first: one search reveals the real blast radius without touching evidence."]}}, {"i": 1, "o": {"t": "Delete the email from the first mailbox at once", "c": false, "why": ["Deleting one copy hides the campaign and destroys context for the other 11 victims."]}}, {"i": 2, "o": {"t": "Reply to the sender to ask if it is genuine", "c": false, "why": ["Replying tells the attacker the mailbox is live and monitored."]}}]}, {"add": null, "q": "Step 2 — DNS shows the domain resolves to a VPS range; a TLS certificate was issued yesterday. What does this tell you?", "out": "CTI notes the registrar, fresh cert and VPS range match a known phishing-kit pattern.", "opts": [{"i": 0, "o": {"t": "The attacker acquired the domain and a server, then staged the page — T1583 before phishing", "c": true, "why": ["Fresh domain + fresh cert + rented VPS is the acquired-infrastructure fingerprint."]}}, {"i": 1, "o": {"t": "The mail filter cached an old DNS record", "c": false, "why": ["A 2-day-old domain cannot have a meaningful cache history."]}}, {"i": 2, "o": {"t": "The CEO travels and uses a new provider", "c": false, "why": ["The CEO does not register lookalike domains with privacy services."]}}]}, {"add": null, "q": "Step 3 — Action now?", "out": "Gateway blocks the domain, the 11 emails are pulled, the brand team opens a takedown case.", "opts": [{"i": 0, "o": {"t": "Block the domain at the gateway, pull the 11 emails, notify the brand team", "c": true, "why": ["Contain the channel, remove the lure, and start the takedown track — all reversible steps."]}}, {"i": 1, "o": {"t": "Do nothing until someone clicks the link", "c": false, "why": ["Waiting for a click is not a control; 11 mailboxes are armed."]}}, {"i": 2, "o": {"t": "Shut down the whole mail server", "c": false, "why": ["That stops all company mail — far beyond what this incident needs."]}}]}]}, {"id": "m08", "type": "qcm", "sum": "Attacker choice: which acquisition fits?", "scen": "You are planning an authorised red-team engagement. You need a phishing host whose traffic looks like ordinary cloud traffic and which you can abandon within minutes if discovered.", "arts": [], "q": "Which acquisition choice fits best?", "note": null, "hint": "Two needs: traffic that looks normal, and fast abandonment. Which option gives both?", "study": "T1583.003: cloud VPS gives trusted network ranges plus rapid provision/teardown — the trade-off ATT&amp;CK highlights.", "ex": "<p>ATT&amp;CK’s T1583.003 text says it directly: cloud infrastructure is easy to provision, modify and shut down, and benefits from the trust in bigger providers. Defender view: this is why fresh certificates on famous cloud ASN ranges deserve attention, even though the cloud provider itself is innocent.<\/p>", "opts": [{"t": "Rent a VPS from a well-known cloud provider", "c": true, "why": ["Big cloud ranges look ordinary and instances can be destroyed in minutes — exactly the trade-off wanted."]}, {"t": "Buy a physical server in your own country", "c": false, "why": ["Physical servers are slow to get and slow to abandon; they also pin the operator to a location."]}, {"t": "Use the office printer’s web panel as the host", "c": false, "why": ["A printer cannot serve a phishing campaign and is not attacker infrastructure."]}, {"t": "Send the malware as a direct email attachment", "c": false, "why": ["That skips hosting entirely — it is not an acquisition choice for a host."]}]}, {"id": "m09", "type": "match", "sum": "Match the hunting source to what it catches", "scen": "You plan a hunt for acquired infrastructure. Match each data source to what it is best at catching.", "arts": [], "q": "Match each source to its catch.", "hint": "One watches certificates, one watches resolutions over time, one watches the birth of names.", "study": "Hunting sources for T1583: CT logs, passive DNS, WHOIS age — plus scan data per DET0895.", "ex": "<p>Three lenses, three catches. CT logs catch the <b>certificate<\/b>, passive DNS catches the <b>movement<\/b>, WHOIS catches the <b>birth<\/b>. Combined, they rebuild the attacker’s shopping list. ATT&amp;CK’s analytic AN2027 asks for exactly these: scan data, DNS registry data, logged DNS and WHOIS.<\/p>", "pairs": [{"l": "Certificate transparency logs", "r": "New TLS certificates issued for lookalike sub-domains", "why": ["CT logs record every public certificate — fresh certs expose fresh infrastructure."]}, {"l": "Passive DNS", "r": "Domains that hop between IP addresses quickly", "why": ["Passive DNS keeps history of resolutions; fast changes betray fast-moving infra."]}, {"l": "WHOIS / registration age", "r": "Domains registered only days before use", "why": ["Creation dates are the classic acquisition signal."]}]}, {"id": "m10", "type": "fill", "sum": "Complete the CTI report sentence", "scen": "You finish a CTI report. Complete the key sentence with the correct words.", "arts": [{"label": "WHOIS card — nw-vpn-portal[.]com", "text": "Creation Date: 2026-10-10 (four days ago)\nRegistrant: Redacted for Privacy, Sofia, BG\nStatus: clientTransferProhibited"}, {"label": "Hosting card", "text": "A record: 45[.]61[.]187[.]12\nASN: 63949 (cloud VM provider)\nType: virtual private server\nCert: issued 2026-10-11, Let’s Encrypt"}], "q": "Fill the four blanks.", "note": "Pick one word or phrase for each blank from the word bank.", "hint": "Use the artefacts: age, owner style, hosting type, then the technique ID.", "study": "CTI reports should pin down: registration age, WHOIS privacy, hosting type, and the ATT&amp;CK technique used.", "ex": "<p>A good infrastructure sentence carries four facts: <b>when<\/b>, <b>who-style<\/b>, <b>where<\/b>, and <b>which technique<\/b>. Your report now reads like a professional product and names T1583 as the preparation step behind the phishing wave.<\/p>", "seg": ["The domain nw-vpn-portal[.]com was registered ", {"a": "four days ago", "why": "The WHOIS card shows creation 2026-10-10."}, " through a ", {"a": "privacy service", "why": "The registrant is redacted by a privacy provider."}, ", resolves to a ", {"a": "virtual private server", "why": "The hosting card shows a rented cloud VM, ASN 63949."}, " in a range linked to phishing. We assess the actor performed ", {"a": "T1583", "why": "Acquiring the name and the server is T1583."}, " before sending emails."], "bank": ["four days ago", "privacy service", "virtual private server", "T1583", "ten years", "public web server", "T1059", "TA0001"]}, {"id": "m11", "type": "qcm", "sum": "What does ATT&amp;CK itself say about detecting T1583?", "scen": "A colleague claims T1583 is easy to catch because “the EDR sees everything”. You check the ATT&amp;CK page for T1583.", "arts": [], "q": "What does the page actually say about detection?", "note": null, "hint": "The phrase to remember: the activity happens outside the target’s visibility.", "study": "ATT&amp;CK DET0895 / AN2027: scan data, DNS registry data, logged DNS, WHOIS; detection focuses on follow-on stages (C2).", "ex": "<p>ATT&amp;CK is explicit: much of this activity happens outside the victim’s view, so detection leans on <b>external<\/b> data (scans, registry data, WHOIS) and on the <b>follow-on<\/b> stages like C2. Your colleague’s EDR claim confuses T1583 with post-compromise techniques.<\/p>", "opts": [{"t": "It is hard to see directly; watch follow-on stages like C2, plus scan data, DNS registry data, logged DNS and WHOIS", "c": true, "why": ["AN2027 lists internet-scan data, DNS registry data, logged DNS and WHOIS, and says detection efforts focus on follow-on stages such as C2."]}, {"t": "The EDR shows the attacker buying the domain in real time, because acquisitions run through victim endpoints", "c": false, "why": ["The purchase happens on the attacker’s side, outside the victim’s EDR."]}, {"t": "Every newly registered domain on the internet must be blocked within 24 hours by international law", "c": false, "why": ["No such rule exists on the page or anywhere else."]}, {"t": "T1583 always leaves a detailed process log on the victim host that every EDR collects by default", "c": false, "why": ["Nothing is executed on the victim host during acquisition."]}]}, {"id": "m12", "type": "triage", "sum": "Triage the new-domain monitor queue", "scen": "Your “newly registered domain” monitor fired four alerts this morning. For each alert, choose the right action: <b>Escalate<\/b>, <b>Watchlist<\/b>, or <b>Auto-close<\/b>. Company context: ticket #8812 says the HR agency launches its own benefits site this week.", "arts": [], "q": "Choose one action per alert.", "note": "Choose one action per alert, then press Check. Partial credit per alert.", "hint": "Two alerts have a business explanation. Two have the fresh + lookalike + activity pattern.", "study": "Triage mix for new-domain alerts: owner/ticket = close; fresh + lookalike + (cert or visits) = escalate.", "ex": " function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function el(tag,cls,html){var e=document.createElement(tag);if(cls){e.className=cls;}if(html!=null){e.innerHTML=html;}return e;}
function fmtT(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function copyTxt(btn,txt){try{navigator.clipboard.writeText(txt).then(function(){btn.textContent='Copied';setTimeout(function(){btn.textContent='Copy';},1200);},function(){});}catch(e){}}
function hl(text){
  var lines=String(text).split('\n'),out=[];
  for(var i=0;i<lines.length;i++){
    var L=esc(lines[i]);
    L=L.replace(/^(\d{4}-\d{2}-\d{2}[T ][\d:.Z+-]*)/,'<span class="t-ts">$1</span>');
    L=L.replace(/^(\d{2}:\d{2}:\d{2})/,'<span class="t-ts">$1</span>');
    L=L.replace(/(\d{1,3}\[\.\]){3}\d{1,3}/g,'<span class="t-ip">$&</span>');
    L=L.replace(/([a-z0-9][a-z0-9-]*\[\.\])+(com|net|org|io|ru|cn|su|top|xyz|info|biz|online|shop|site|link|live|app|dev|co|uk|de|fr|nl|is|cc|tv|me|gov|edu|mil)\b/gi,'<span class="t-dom">$&</span>');
    L=L.replace(/hxxps?:\/\/[^\s<"'）)]+/g,'<span class="t-url">$&</span>');
    L=L.replace(/\b(GET|POST|DNS|TXT|TLS|SSL|HTTP|HTTPS|OK|FAILED|query|response|53)\b/g,'<span class="t-kw">$&</span>');
    out.push(L);
  }
  return out.join('\n');
}
function artsHTML(exd){
  if(!exd.arts||!exd.arts.length){return '';}
  var h='';
  for(var i=0;i<exd.arts.length;i++){

  return h;
}

/* ================= scoring core (contract) ================= */
/* scoreExercise(selectedItems, correctItems, optTotal) -> credit in [0,1]
   H = |selected & correct|, W = |selected \ correct|, N = optTotal or correct.length
   credit = max(0, (H - W) / N) */
function scoreExercise(selectedItems, correctItems, optTotal){
  var corr={};for(var i=0;i<correctItems.length;i++){corr[correctItems[i]]=true;}
  var H=0,W=0,seen={};
  for(var j=0;j<selectedItems.length;j++){
    var id=selectedItems[j];
    if(seen[id]){continue;}
    seen[id]=true;
    if(corr[id]){H++;}else{W++;}
  }
  var N=(typeof optTotal==='number')?optTotal:correctItems.length;
  if(N<=0){return 0;}
  return Math.max(0,(H-W)/N);
}

/* ================= timer state machine =================
   States: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED        */
function setState(st){S.tState=st;renderHeader();}
function startTimer(){
  if(S.tick){clearInterval(S.tick);}
  setState('RUNNING');
  S.tick=setInterval(function(){
    if(S.tState!=='RUNNING'){return;}
    S.remaining--;
    if(S.remaining<=0){S.remaining=0;renderHeader();timerEnd();return;}
    renderHeader();
  },1000);
}
function stopTick(){if(S.tick){clearInterval(S.tick);S.tick=null;}}
function pauseAuto(){ /* Check pressed: first action = stop the clock, before feedback renders */
  if(S.tState==='RUNNING'){S.pauseStart=Date.now();setState('PAUSED_AUTO_CHECK');}
}
function pauseManual(){
  if(S.tState==='RUNNING'||S.tState==='PAUSED_AUTO_CHECK'){
    S.pauseStart=Date.now();
    S.resumeTo=(S.tState==='PAUSED_AUTO_CHECK')?'PAUSED_AUTO_CHECK':'RUNNING';
    setState('PAUSED_MANUAL');
    showOverlay(true);
  }
}
function resumeManual(){
  if(S.tState!=='PAUSED_MANUAL'){return;}
  var d=Math.max(0,Math.round((Date.now()-S.pauseStart)/1000));
  if(S.resumeTo==='PAUSED_AUTO_CHECK'){S.autoSec+=d;}else{S.manualSec+=d;}
  showOverlay(false);
  setState(S.resumeTo||'RUNNING');
}
function timerEnd(){stopTick();S.tState='ENDED';renderHeader();endExam(true);}

/* per-exercise reduced timer (EXTREMELY HARD terminal only) */
function startPerEx(sec){
  S.perExRemaining=sec;
  if(S.perExHandle){clearInterval(S.perExHandle);}
  S.perExHandle=setInterval(function(){
    if(S.tState!=='RUNNING'||S.perExHandle===null){return;}
    S.perExRemaining--;
    var c=document.getElementById('perx-time');
    if(c){c.textContent=fmtT(Math.max(0,S.perExRemaining));}
    if(S.perExRemaining<=0){stopPerEx();perExExpire();}
  },1000);
}
function stopPerEx(){if(S.perExHandle){clearInterval(S.perExHandle);S.perExHandle=null;}}

  if(S.pos>=S.order.length-1){
    if(S.skip.length>0){screenReview();}else{endExam(false);}
  }else{
    S.pos++;renderExercise(S.order[S.pos],false);
  }
}
function onHint(){
  if(S.hint[S.cur]||locked){return;}
  S.hint[S.cur]=true;
  var exd=DATA.exercises[S.cur];
  var hb=document.querySelector('.hintbox-slot');
  if(hb){hb.innerHTML='<div class="hintbox"><b>Hint</b> — '+exd.hint+' <span class="hintcost">(costs 10% of this exercise\'s credit)</span></div>';}
  document.getElementById('btn-hint').disabled=true;
}
function onNext(){
  if(S.tState==='PAUSED_AUTO_CHECK'){setState('RUNNING');}
  /* Next is only reachable after Check (it is hidden until then); if it ever
     fires with the current exercise unanswered, do nothing rather than
     silently abandoning the exercise. */
  if(!S.answered[S.cur]){return;}
  var isLast=(S.pos>=S.order.length-1);
  if(S.reviewReturn){S.reviewReturn=false;screenReview();return;}
  if(!isLast){S.pos++;renderExercise(S.order[S.pos],false);}
  else{
    if(S.skip.length>0){screenReview();}else{endExam(false);}
  }
}

/* ================= feedback ================= */
function fbLabel(credit){
  if(credit>=1){return ['ok','✓','CORRECT'];}
  if(credit>0){return ['part','✓','PARTIALLY CORRECT'];}
  return ['bad','✗','INCORRECT'];
}
function renderFeedback(zone,exd,g,credit,pen){
  var L=fbLabel(credit);
  var h='<div class="fb '+L[0]+'"><div class="fb-h"><span aria-hidden="true">'+L[1]+'</span> '+L[2]
    +(pen?'<span class="hintcost">· hint used: −0.10 credit</span>':'')+'</div><div class="fb-b">';
  h+='<div class="fbc">credit '+credit.toFixed(2)+(g.N?' — '+g.H+'/'+g.N+' items · (H − W) / N = ('+g.H+' − '+g.W+') / '+g.N:'')+'</div>';
  if(g.items&&g.items.length){
    h+='<ul class="fb-items">';
    for(var i=0;i<g.items.length;i++){
      var it=g.items[i];
      var ic=it.status==='ok'?'<span class="icook">✓ Correct</span>':it.status==='bad'?'<span class="icbad">✗ Wrong</span>':'<span class="icmiss">○ Missed</span>';
      h+='<li class="'+(it.status==='ok'?'i-ok':it.status==='bad'?'i-bad':'i-miss')+'">'+ic+' — <b>'+it.label+'</b>'+(it.note?'<br>'+it.note:'')+'</li>';
    }
    h+='</ul>';
  }
  if(g.dangerHTML){h+='<div class="danger-note">⚠ '+g.dangerHTML+'</div>';}
  h+='<div class="prose">'+g.exHTML+'</div>';
  h+='<div class="study"><b>What to study:</b> '+exd.study+'</div>';
  h+='</div></div>';
  zone.innerHTML=h;
  if(g.postRender){g.postRender(zone);}
}

function WTERM(box,exd,api){
  var term=el('div','term');
  var out=el('div','term-out');
  var line=el('div','term-line');
  var inp=document.createElement('input');
  inp.className='tin';inp.type='text';inp.autocomplete='off';inp.spellcheck=false;
  inp.setAttribute('aria-label','Terminal input');
  var run=el('button','btn mini','Run');run.type='button';
  line.innerHTML='<span class="tp">'+esc(exd.term.prompt)+'</span>';
  line.appendChild(inp);line.appendChild(run);
  term.appendChild(out);term.appendChild(line);
  box.appendChild(term);
  var lastCmd='';
  var norm=function(c){return String(c).toLowerCase().replace(/\s+/g,' ').replace(/[\[\]]/g,'').replace(/['"]/g,'').trim();};
  var outMap={};
  var k;
  if(exd.term.out){for(k in exd.term.out){outMap[norm(k)]=exd.term.out[k];}}
  function echo(cmd,n){
    out.appendChild(el('div','tline','<span class="tp">'+esc(exd.term.prompt)+'</span> '+esc(cmd)+(n!==norm(cmd)?'   <span class="t-ts">[normalised: '+esc(n)+']</span>':'')));
  }
  function puts(txt,cls){
    String(txt).split('\n').forEach(function(l){out.appendChild(el('div','tline'+(cls?' '+cls:''),hl(l)));});
  }
  function runCmd(){
    var v=inp.value;
    if(!v.trim()){return;}
    var n=norm(v);
    echo(v,n);
    if(n==='clear'){out.innerHTML='';}
    else if(n==='pwd'){puts('/home/analyst');}
    else if(n==='ls'||n==='ls -la'||n==='ls -l'){puts('cases   evidence   logs   notes.txt');}
    else if(n==='help'){puts('Commands known in this lab: '+(exd.term.avail||[]).join(', ')+', plus pwd / ls / clear / help.');}
    else if(outMap[n]!=null){
      lastCmd=n;
      puts(outMap[n]);
    }else{
      var tok=v.trim().split(/\s+/)[0];
      out.appendChild(el('div','tline t-err','bash: '+esc(tok)+': command not found (this lab only knows: '+(exd.term.avail||[]).join(', ')+')'));
      lastCmd=n; /* wrong tool attempt is graded too */
    }
    inp.value='';
    out.scrollTop=out.scrollHeight;
    api.mark();
  }
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){runCmd();}});
  run.addEventListener('click',runCmd);
  return function(){
    var els=exd.term.elements;
    var forb=exd.term.forbidden||[];
    var N=els.length;
    var corr=[],selArr=[],items=[],danger=[];
    els.forEach(function(e2,i){
      corr.push('ok:'+i);
      var hit=new RegExp(e2.re,'i').test(lastCmd);
      if(hit){selArr.push('ok:'+i);items.push({label:e2.name,status:'ok',note:e2.desc});}
      else{items.push({label:e2.name,status:'miss',note:e2.desc});}
    });
    forb.forEach(function(f){
      if(new RegExp(f.re,'i').test(lastCmd)){
        selArr.push('bad:f'+danger.length);
        items.push({label:f.name,status:'bad',note:f.desc});
        danger.push('<b>'+esc(f.name)+'</b> — '+f.desc);
      }
    });
    var H=0,W=0;
    selArr.forEach(function(x){if(x.indexOf('ok:')===0){H++;}else{W++;}});
    var g={credit:scoreExercise(selArr,corr,N),H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:danger.length?danger.join('<br>'):''};
    g.postRender=function(zone){
      var code=el('div');
      code.innerHTML='<div class="qnote" style="margin-top:10px"><b>Canonical command:</b></div><pre class="codeblk">'+esc(exd.term.canonical)+'</pre>';
      var cb=el('button','btn mini','Copy');cb.type='button';
      cb.addEventListener('click',function(){copyTxt(cb,exd.term.canonical);});
      code.appendChild(cb);
      var parts='';
      for(var i=0;i<exd.term.elements.length;i++){parts+='<li><b>'+esc(exd.term.elements[i].name)+'</b> — '+exd.term.elements[i].desc+'</li>';}
      var expl=el('div');
      expl.innerHTML='<ul>'+parts+'</ul>';
      code.appendChild(expl);
      zone.appendChild(code);
    };
    if(!lastCmd){g.exHTML='<p><b>No command was run.</b> In the fake shell, type a command and press Enter (or press Run), then press Check. This attempt scored 0 because no command could be graded.</p>'+exd.ex;}
    return g;
  };
}
function WBRANCH(box,exd,api){
  var st={step:0,picks:[],done:false};
  var wrap=el('div');
  var prog=el('div','qnote','<b>Progress log</b><ul style="margin:6px 0 0;padding-left:20px" id="blog"></ul>');
  var stepBox=el('div');
  wrap.appendChild(prog);wrap.appendChild(stepBox);
  box.appendChild(wrap);
  var blogEl=wrap.querySelector('#blog');
  function renderStep(){
    var k=st.step;
    var s=exd.steps[k];
    stepBox.innerHTML='';
    var head=el('div');
    var opts=s.opts.map(function(o){return o;});
    opts=shuffle(opts);
    var html='<p><span class="stepchip">STEP '+(k+1)+' OF '+exd.steps.length+'</span></p>';
    if(s.add){html+='<div class="prose" style="margin-top:8px">'+s.add+'</div>';}
    html+='<p style="margin-top:10px"><b>'+s.q+'</b></p><div class="opts">';
    var letters=['A','B','C','D'];
    opts.forEach(function(p,i){
      html+='<button class="opt" type="button" data-i="'+p.i+'"><span class="lbl">'+letters[i]+'.</span><span>'+p.o.t+'</span></button>';
    });
    html+='</div><div style="margin-top:10px"><button class="btn primary" type="button" id="bconfirm" disabled>Confirm step</button></div>';
    head.innerHTML=html;
    stepBox.appendChild(head);
    var selIdx=null;
    var bc=stepBox.querySelector('#bconfirm');
    var ob=stepBox.querySelectorAll('.opt');
    for(var i=0;i<ob.length;i++){
      ob[i].addEventListener('click',function(){
        selIdx=parseInt(this.getAttribute('data-i'),10);
        var all=stepBox.querySelectorAll('.opt');
        for(var z=0;z<all.length;z++){all[z].classList.remove('sel');}
        this.classList.add('sel');
        bc.disabled=false;
      });
    }
    bc.addEventListener('click',function(){
      if(selIdx==null){return;}
      st.picks[k]=selIdx;
      var li=document.createElement('li');
      li.textContent=(k+1)+'. '+s.out;
      blogEl.appendChild(li);
      if(k<exd.steps.length-1){st.step++;renderStep();}
      else{st.done=true;stepBox.innerHTML='<div class="qnote">All steps recorded. Press <b>Check</b> to grade the whole decision chain.</div>';api.mark();}
    });
  }
  renderStep();
  return function(){
    var N=exd.steps.length;
    var corr=[],selArr=[],items=[];
    exd.steps.forEach(function(s,i){
      corr.push('ok:'+i);
      var p=st.picks[i];
      var chosen=null;
      if(p!=null){for(var j=0;j<s.opts.length;j++){if(s.opts[j].i===p){chosen=s.opts[j];break;}}}
      var right=null;
      for(var j2=0;j2<s.opts.length;j2++){if(s.opts[j2].o.c){right=s.opts[j2].o;break;}}
      if(p==null){items.push({label:'Step '+(i+1),status:'miss',note:'No choice recorded. Correct was: "'+right.t+'".'});}
      else if(chosen.o.c){selArr.push('ok:'+i);items.push({label:'Step '+(i+1)+' — '+chosen.o.t,status:'ok',note:chosen.o.why||''});}
      else{selArr.push('bad:'+i);items.push({label:'Step '+(i+1)+' — you chose "'+chosen.o.t+'", best is "'+right.t+'"',status:'bad',note:chosen.o.why||right.why||''});}
    });
    var H=0,W=0;
    selArr.forEach(function(x){if(x.indexOf('ok:')===0){H++;}else{W++;}});
    return {credit:scoreExercise(selArr,corr,N),H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:null};
  };
}
function WTRIAGE(box,exd,api){
  var st={};
  var wrap=el('div');
  exd.alerts.forEach(function(a,i){
    var c=el('div','blk');
    c.style.margin='10px 0';
    var letters=['A','B','C','D'];
    var opts=shuffle(a.opts.map(function(o,j){return {o:o,j:j};}));
    var h='<div class="blk-b"><div>'+a.t+'</div><div class="opts" style="margin-top:8px">';
    opts.forEach(function(p,k){
      h+='<button class="opt" type="button" data-a="'+i+'" data-j="'+p.j+'"><span class="lbl">'+letters[k]+'.</span><span>'+p.o+'</span></button>';
    });
    h+='</div></div>';
    c.innerHTML=h;
    wrap.appendChild(c);
  });
  box.appendChild(wrap);
  wrap.addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('.opt'):null;
    if(!b||locked){return;}
    var ai=b.getAttribute('data-a');
    st[ai]=parseInt(b.getAttribute('data-j'),10);
    var all=b.parentElement.querySelectorAll('.opt');
    for(var i=0;i<all.length;i++){all[i].classList.remove('sel');}
    b.classList.add('sel');
    api.mark();
  });
  return function(){
    var N=exd.alerts.length;
    var corr=[],selArr=[],items=[];
    exd.alerts.forEach(function(a,i){
      corr.push('ok:'+i);
      var p=st[i];
      if(p==null){items.push({label:'Alert '+(i+1),status:'miss',note:a.why||''});}
      else if(p===a.c){selArr.push('ok:'+i);items.push({label:'Alert '+(i+1)+' — '+a.opts[a.c],status:'ok',note:a.why||''});}
      else{selArr.push('bad:'+i);items.push({label:'Alert '+(i+1)+' — you chose "'+a.opts[p]+'", correct is "'+a.opts[a.c]+'"',status:'bad',note:a.why||''});}
    });
    var H=0,W=0;
    selArr.forEach(function(x){if(x.indexOf('ok:')===0){H++;}else{W++;}});
    return {credit:scoreExercise(selArr,corr,N),H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:null};
  };
}
function renderLogPanel(abody,exd){

function startExam(){
  S=freshState();
  examShell();
  buildOrder();
  S.pos=0;
  startTimer();
  renderExercise(S.order[0],false);
}
function buildOrder(){
  var ord=shuffle(DATA.exercises.map(function(_,i){return i;}));
  var isT=function(i){return !!DATA.exercises[i].terminal;};
  var guard=0;
  while(guard++<60){
    var fixed=false;
    for(var k=0;k<ord.length-1;k++){
      if(isT(ord[k])&&isT(ord[k+1])){
        var cut=ord.splice(k+1,1)[0];
        var placed=false;
        for(var t=0;t<40&&!placed;t++){
          var p=Math.floor(Math.random()*(ord.length+1));
          var badB=(p>0&&isT(ord[p-1])&&isT(cut));
          var badA=(p<ord.length&&isT(ord[p])&&isT(cut));
          if(!badB&&!badA){ord.splice(p,0,cut);placed=true;}
        }
        if(!placed){
          if(ord.length&&isT(ord[ord.length-1])&&!isT(ord[0])){ord.unshift(cut);}
          else{ord.push(cut);}
        }
        fixed=true;break;
      }
    }
    if(!fixed){break;}
  }
  S.order=ord;
}

  document.getElementById('btn-hint').style.display='none';
  document.getElementById('btn-skip').style.display='none';

    +'Answer them now, or submit. Skipped exercises you never answer are excluded from your score.</p>'
    +'<div class="chips"><span class="mchip">Answered so far: '+sp.n+'</span><span class="mchip">Live score: '+(Math.round(sp.sum*10)/10)+' / '+sp.n+'</span></div>';
  main.appendChild(hero);

    var b=el('button','btn primary','Answer');b.type='button';

  var nav=el('div','nav');

  nav.appendChild(sub);
  main.appendChild(nav);

}
function endExam(byTimeout){
  stopTick();stopPerEx();S.tState='ENDED';
  document.getElementById('btn-hint').style.display='none';
  document.getElementById('btn-skip').style.display='none';
  document.getElementById('btn-pause').style.display='none';
  var ids=[];
  S.order.forEach(function(i){if(S.answered[i]){ids.push(i);}});
  var sum=0,full=0,part=0,partSum=0,zero=0;
  ids.forEach(function(i){var c=S.credit[i];sum+=c;if(c>=1){full++;}else if(c>0){part++;partSum+=c;}else{zero++;}});
  var answered=ids.length;
  var skipped=DATA.exercises.length-answered;
  var pct=answered?Math.round(sum/answered*100):0;
  var passed=pct>=70;
  if(!S.reported){
    S.reported=true;
    try{
      parent.postMessage({type:'CYBERPULSE_SCORE',topicId:TOPIC,batch:BATCH,
        score:Math.round(sum),total:answered,percent:pct,passed:passed},location.origin);
    }catch(e){/* opened directly: nothing to report to */}
  }
  var main=document.getElementById('main');
  main.innerHTML='';
  var hero=el('div','res-hero '+(passed?'pass':'fail'));
  hero.innerHTML='<div class="pct">'+pct+'%</div>'
    +'<div style="font-size:19px;font-weight:800">'+(passed?'PASS':'FAIL')+' — '+esc(DATA.meta.title)+'</div>'
    +'<p style="margin:8px 0 0">'+(byTimeout?'The exam timer ended. ':'')+'Score over answered exercises only: '+sum.toFixed(1)+' credits / '+answered+' answered. Pass mark: 70%.</p>';
  main.appendChild(hero);
  if(passed){
    var cert=el('div','cert');
    cert.innerHTML='<b>Certificate of completion</b><br>Topic '+esc(TOPIC)+' — tier '+esc(SEV)
      +'<br>Learner: '+esc(USERNAME||'anonymous learner')
      +'<br>Result: '+pct+'% (pass mark 70%) — '+sum.toFixed(1)+' / '+answered+' credits';
    main.appendChild(cert);
  }else{
    var f=el('div','hero prose');
    f.innerHTML='<p>You did not reach the pass mark of 70%. You must retake this tier. Questions and answers will be shuffled again.</p>';
    main.appendChild(f);
  }
  var grid=el('div','statgrid');
  var rows=[['Fully correct',String(full)],['Partially correct',part?(''+part+' (avg '+(partSum/part).toFixed(2)+')'):'0'],['Fully incorrect',String(zero)],['Skipped — excluded',String(skipped)]];
  for(var i=0;i<rows.length;i++){
    var s=el('div','stat');
    s.innerHTML='<div class="n">'+rows[i][1]+'</div><div class="l">'+rows[i][0]+'</div>';
    grid.appendChild(s);
  }
  main.appendChild(grid);
  var pauseStats=el('div','hero prose');
  pauseStats.innerHTML='<div class="sec-h">How your time was spent</div><ul>'
    +'<li>Time in manual breaks: <b>'+fmtT(S.manualSec)+'</b></li>'
    +'<li>Time reviewing feedback (auto-pause on Check): <b>'+fmtT(S.autoSec)+'</b></li>'
    +'<li>Time left on the exam clock: <b>'+fmtT(S.remaining)+'</b></li></ul>';
  main.appendChild(pauseStats);
  var nav=el('div','nav');
  var rb=el('button','btn primary','Retake exam');rb.type='button';
  rb.addEventListener('click',function(){startExam();});
  nav.appendChild(rb);
  main.appendChild(nav);
  renderHeader();
  window.scrollTo(0,0);
}

});
