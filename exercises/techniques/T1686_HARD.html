.intro-sub{color:var(--text-secondary);font-size:15px;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:16px}
.fact .fl{font-size:12px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em}
.fact .fv{font-weight:800;font-size:16.5px;margin-top:2px}
.sec-title{font-size:19px;font-weight:800;margin:26px 0 0;padding-left:12px;border-left:4px solid var(--accent-blue)}
.kw-theme{
  border:1px solid var(--border-soft);border-radius:8px;
  background:var(--bg-surface-2);padding:12px 14px;margin-top:12px;
}
.kw-theme .kt{font-weight:800;font-size:14px;color:var(--accent-amber);letter-spacing:.03em;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  background:var(--tint-blue-08);border:1px solid var(--border);
  color:var(--text-primary);border-radius:999px;padding:4px 13px;font-size:13.5px;
}
.rules{margin:10px 0 0;padding-left:22px}
.rules li{margin:7px 0}
.rules .ico{font-weight:800}
/* ---------- pause overlay ---------- */
.pausemask{
  position:fixed;inset:0;background:var(--pausemask-bg);z-index:90;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
}
.pausemask .inner{max-width:520px}
.pausemask .big{font-size:22px;font-weight:800;color:var(--state-paused);margin:12px 0 8px}
.pausemask .sub{color:var(--text-secondary)}
/* ---------- review skipped ---------- */
.sk-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.sk-row{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);
  padding:12px 14px;
}
.sk-row .sk-ico{color:var(--state-skipped);font-weight:800}
.sk-row .sk-t{flex:1;min-width:200px}
.sk-row .sk-t .n{font-weight:700}
.sk-row .sk-t .d{font-size:13.5px;color:var(--text-secondary)}
/* ---------- results ---------- */
.res-head{display:flex;flex-wrap:wrap;align-items:center;gap:16px 30px}
.res-pct{font-size:52px;font-weight:800;font-family:var(--mono-font);line-height:1}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:16px}
.res-cell{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px}
.res-cell .rc-ico{font-size:20px;font-weight:800}
.res-cell.ok .rc-ico{color:var(--state-correct)}
.res-cell.part .rc-ico{color:var(--state-partial)}
.res-cell.bad .rc-ico{color:var(--state-incorrect)}
.res-cell.skip .rc-ico{color:var(--state-skipped)}
.res-cell .rc-n{font-size:26px;font-weight:800;font-family:var(--mono-font)}
.res-cell .rc-l{font-size:13.5px;color:var(--text-secondary)}
.cert{
  margin-top:18px;border:2px solid var(--state-correct);border-radius:10px;
  background:var(--tint-green-07);padding:20px 22px;text-align:center;
}
.cert.fail{border-color:var(--state-incorrect);background:var(--tint-red-06)}
.cert .c-big{font-size:30px;font-weight:800;color:var(--state-correct)}
.cert.fail .c-big{color:var(--state-incorrect)}
.cert .c-sub{color:var(--text-secondary);margin-top:6px}
.time-report{margin-top:14px;font-size:14px;color:var(--text-secondary)}
.time-report b{color:var(--text-primary)}
.hidden{display:none!important}
.footer-note{margin-top:26px;text-align:center;font-size:12.5px;color:var(--text-secondary)}
@media (max-width:760px){
  .wrap{padding:10px 12px 50px}
  .intro-title{font-size:21px}
  .res-pct{font-size:40px}
  .card{padding:13px 14px}
}

<script>window.__EXAM_DATA__ = {"meta":{"topicId":"t1686","batch":3,"title":"T1686 Disable or Modify System Firewall — HARD","difficulty":"hard","questionCount":16,"estimatedMinutes":50,"passMark":70,"sev":"hard","timerSeconds":3000},"introHtml":"\n<div class=\"intro-head\">\n  <h1 class=\"intro-title\">T1686 — HARD practice exam<\/h1>\n  <p class=\"intro-sub\">MITRE ATT&amp;CK object: <b>T1686 — Disable or Modify System Firewall<\/b> (Technique) &middot; Tactic: Defense Impairment (TA0112)<\/p>\n  <div class=\"facts\">\n    <div class=\"fact\"><div class=\"fl\">Severity<\/div><div class=\"fv\"><span class=\"badge sev-hard\">HARD<\/span><\/div><\/div>\n    <div class=\"fact\"><div class=\"fl\">Exercises in this file<\/div><div class=\"fv\">16<\/div><\/div>\n    <div class=\"fact\"><div class=\"fl\">Estimated time<\/div><div class=\"fv\">50 minutes<\/div><\/div>\n    <div class=\"fact\"><div class=\"fl\">Timer budget<\/div><div class=\"fv\">50:00 countdown<\/div><\/div>\n    <div class=\"fact\"><div class=\"fl\">Pass mark<\/div><div class=\"fv\">70%<\/div><\/div>\n  <\/div>\n<\/div>\n\n<h2 class=\"sec-title\">What you will learn here<\/h2>\n<div class=\"card\">\n  <p class=\"body\">At this level, the firewall story stops being obvious. Real incidents mix attacker actions with planned changes, weakened rules with hardened rules, and quiet registry edits with loud service stops. In this file you will learn to <b>discriminate<\/b>: two artefacts that look the same can mean opposite things, and the correct action is often the <b>least aggressive<\/b> one.<\/p>\n  <p class=\"body\">The object is the <b>Technique T1686 — Disable or Modify System Firewall<\/b> (Defense Impairment, TA0112), with its sub-techniques T1686.001 (cloud), T1686.002 (network devices) and T1686.003 (Windows hosts) and its platform coverage of Linux, macOS and ESXi. You will work the detection strategies from the ATT&amp;CK page: DET0145 with its platform analytics (AN0406–AN0410), DET0306 for perimeter devices, DET0424 for the cloud control plane, and DET0901 for Windows. You will also meet real procedure examples — ShrinkLocker's enable-then-delete trick, BPFDoor's iptables redirect, Salt Typhoon's ACL edits, Magic Hound's Terminal Server rule.<\/p>\n  <p class=\"body\">This is the daily material of a <b>senior SOC analyst<\/b> tuning out false positives, a <b>detection engineer<\/b> proving coverage with purple-team tests, an <b>incident responder<\/b> choosing containment levels, and a <b>CTI analyst<\/b> mapping procedures to techniques. You will run one read-only command yourself in an ESXi simulation — and you will see why the tempting command is the wrong one.<\/p>\n<\/div>\n\n<h2 class=\"sec-title\">Keywords covered in this exam<\/h2>\n<div class=\"card\">\n  <div class=\"kw-theme\"><div class=\"kt\">Near-miss discrimination<\/div><div class=\"chips\"><span class=\"chip\">planned change vs tampering<\/span><span class=\"chip\">weakening vs hardening changes<\/span><span class=\"chip\">least-aggressive containment<\/span><span class=\"chip\">evidence before action<\/span><\/div><\/div>\n  <div class=\"kw-theme\"><div class=\"kt\">Detection anchors (DET0145 family)<\/div><div class=\"chips\"><span class=\"chip\">AN0406 Windows netsh / Set-NetFirewallProfile / mpssvc<\/span><span class=\"chip\">AN0407 iptables, nftables, firewalld<\/span><span class=\"chip\">AN0408 pfctl, socketfilterfw, com[.]alf<\/span><span class=\"chip\">AN0409 esxcli and vSphere API<\/span><span class=\"chip\">AN0410 no access-list, permit any any<\/span><\/div><\/div>\n  <div class=\"kw-theme\"><div class=\"kt\">Windows paths and services<\/div><div class=\"chips\"><span class=\"chip\">registry EnableFirewall<\/span><span class=\"chip\">sc stop mpssvc<\/span><span class=\"chip\">Set rule group=\"Network Discovery\"<\/span><span class=\"chip\">purple-team coverage tests<\/span><\/div><\/div>\n  <div class=\"kw-theme\"><div class=\"kt\">Perimeter and cloud<\/div><div class=\"chips\"><span class=\"chip\">Fortigate allowaccess changes<\/span><span class=\"chip\">config commits from unusual sessions<\/span><span class=\"chip\">spike in previously blocked traffic<\/span><span class=\"chip\">security-group ingress 0[.]0[.]0[.]0/0<\/span><span class=\"chip\">GuardDuty suppression (Pacu)<\/span><\/div><\/div>\n  <div class=\"kw-theme\"><div class=\"kt\">Real procedures in play<\/div><div class=\"chips\"><span class=\"chip\">ShrinkLocker (enable + delete all rules)<\/span><span class=\"chip\">BPFDoor (nat REDIRECT to hidden port)<\/span><span class=\"chip\">Salt Typhoon (ACL and loopback edits)<\/span><span class=\"chip\">Magic Hound (Terminal Server 3389)<\/span><span class=\"chip\">HiddenFace (rule \"Cortana\" TCP/47000)<\/span><\/div><\/div>\n  <div class=\"kw-theme\"><div class=\"kt\">Governance and response<\/div><div class=\"chips\"><span class=\"chip\">M1018 / M1047 / M1051 controls<\/span><span class=\"chip\">change-window correlation<\/span><span class=\"chip\">time-boxed compensating monitoring<\/span><span class=\"chip\">evidence-safe containment<\/span><\/div><\/div>\n<\/div>\n\n<h2 class=\"sec-title\">How this exam works<\/h2>\n<div class=\"card\">\n  <ul class=\"rules\">\n    <li><span class=\"ico\">&#10003; Pass mark:<\/span> 70%. Exercises chain two to three ideas and include <b>near-miss answers<\/b> — options that are right in another context but wrong here. In some exercises the obvious answer is deliberately wrong; read the artefacts, not the keywords.<\/li>\n    <li><span class=\"ico\">&#9881; Exercise types in this file:<\/span> correlated log analysis, multi-select with partial credit, branching incident decisions, SOC queue triage, timeline ordering, matching analytics to platforms, fill-in-the-blank policy drafting, spot-the-mistake, one purple-team/blue-team perspective pair, and one interactive ESXi terminal.<\/li>\n    <li><span class=\"ico\">&#9201; Timer:<\/span> 50:00 countdown, state <b>&#9654; RUNNING<\/b>. <b>Pause<\/b> = manual break, exercise hidden. <b>Check<\/b> = automatic pause (&#9208; reviewing feedback, unlimited); the timer restarts only on <b>Next<\/b>. Long scenarios can be collapsed after reading — a one-line summary stays visible.<\/li>\n    <li><span class=\"ico\">&#10100; Partial credit:<\/span> multi-item exercises score max(0, (correct − wrong) / total). Selecting everything scores 0 — commit only to what the evidence supports.<\/li>\n    <li><span class=\"ico\">&#128161; Hints:<\/span> one per exercise, −10% credit. Hints remove one wrong path; they never name the answer.<\/li>\n    <li><span class=\"ico\">&#9888; Skip:<\/span> free, timer keeps running. Review skipped exercises before finishing; never-answered skips are excluded from the score.<\/li>\n  <\/ul>\n  <div class=\"btn-row\"><button type=\"button\" class=\"btn btn-primary btn-big\" id=\"btnStart\">&#9654; Start the exam<\/button><\/div>\n<\/div>\n","exercises":[{"id":"H01","type":"multi","title":"Sunday 03:12 on FIN-DB-01","summary":"A service account switched every profile off — ticket says otherwise","scenario":["Sunday, 03:12 UTC. On-call is you. Three artefacts land in the case channel within a minute."],"artefacts":[{"label":"ARTEFACT 1 — EDR process event, FIN-DB-01","kind":"log","filter":true,"lines":["2026-06-07 03:12:04 UTC  process-create  parent: sqlagent.exe   cmd: netsh advfirewall set allprofiles state off   user: CORP\\sql_agent_svc"]},{"label":"ARTEFACT 2 — Windows firewall audit event, FIN-DB-01","kind":"log","lines":["2026-06-07 03:12:05 UTC  FIREWALL STATE  profile: Domain,Private,Public  old: ON  new: OFF  changed-by: sql_agent_svc"]},{"label":"ARTEFACT 3 — change database, extract","kind":"log","lines":["CHG-4012  Firewall baseline refresh — WEB FARM ONLY  window: Mon 2026-06-08 08:00-10:00  owner: netops  status: approved","No other firewall changes registered for this weekend."]}],"question":"Select the <b>TWO<\/b> conclusions the evidence supports.","hint":"Compare each artefact against the ticket line by line: which farm, which window, which account.","options":[{"id":"A","text":"The sql_agent_svc action is not covered by CHG-4012 — wrong farm, wrong window, unregistered.","why":"Correct. The ticket covers the web farm on Monday; this is a DB host on Sunday."},{"id":"B","text":"Treat as T1686.003 tampering and escalate now: all profiles off, anomalous parent process.","why":"Correct. A DB service account spawning netsh to disable everything, outside any window, is the classic pattern."},{"id":"C","text":"The change is covered by CHG-4012 because both are firewall maintenance.","why":"Both touch firewalls, but scope and window mismatch — coverage is not transitive."},{"id":"D","text":"The account name proves a DBA made an intentional change.","why":"Account names prove identity at best, never intent — abused service accounts are the norm."}],"correct":["A","B"],"explanation":"Two conclusions survive the evidence: the action falls outside CHG-4012 (host class, day and account all mismatch), and the pattern itself — a service-account parent, all profiles, off-hours — matches T1686.003 and warrants escalation. Option C commits the classic ticket-coverage fallacy, and option D trusts a name. Service accounts running interactive-looking firewall commands are precisely how real impairments start.","study":"Next shift, pull three cases of service-account firewall changes and write down what made each one benign or malicious."},{"id":"H02","type":"branch","title":"Twelve hosts, two actors","summary":"One GPO-looking wave with one outlier","scenario":["11:02 — hunt alert: the command netsh advfirewall firewall set rule group=\"Network Discovery\" new enable=Yes fired on 12 hosts within 40 seconds — same second, same account gpo_sync.","On host LT-407 the same command fired at 11:02:07 by interactive account j.duke (sales), no deployment context. The other 11 show gpo_sync.","Work the three decisions."],"question":"Choose the best decision for each step.","hint":"Separate the machine-paced wave from the human-paced outlier before choosing any action.","steps":[{"prompt":"STEP 1 — Interpret the wave pattern first.","options":[{"id":"A","text":"Twelve identical enables in 40 seconds by gpo_sync is machine-paced — likely one distribution mechanism, e.g. the GPO baseline; the j.duke run is a separate event to examine.","outcome":"Right frame: two actors, two timelines. The wave looks administrative; the outlier does not.","why":"Correct — pace and identity separate deployment from hands-on activity."},{"id":"B","text":"All twelve are attacker-controlled; isolate the whole subnet now.","outcome":"You just proposed isolating eleven hosts that share one benign-looking mechanism and one that does not — scope first.","why":"Isolation on that scale needs evidence, not pace alone."},{"id":"C","text":"Network Discovery rules are harmless — close everything.","outcome":"The rule group is benign, but WHO ran it on LT-407 is not answered yet.","why":"Dismissing on rule content alone misses the actor question."}],"correct":"A","why":"Content and pace first: the wave reads as deployment, the outlier needs its own story."},{"prompt":"STEP 2 — Verify the machine-paced wave.","options":[{"id":"A","text":"Check whether the Network Discovery baseline push is a registered change and matches gpo_sync's scope.","outcome":"Confirmed: change CHG-4088 enables Network Discovery fleet-wide; gpo_sync is its service account. Wave resolved as planned.","why":"Correct — a ticket plus account scope closes the wave cleanly."},{"id":"B","text":"Scan all twelve hosts for malware first — hours of queue time before any answer.","outcome":"Possible, but you would spend scarce hours on the wave while the outlier sits unexplained.","why":"Triage order: resolve the cheap hypothesis first."},{"id":"C","text":"Ask the attacker — joke aside, ask j.duke what he ran.","outcome":"The wave is not j.duke's; asking him first answers the wrong event.","why":"Match the question to the event."}],"correct":"A","why":"Ticket plus service-account scope is the fastest legitimate resolution."},{"prompt":"STEP 3 — Handle LT-407 (j.duke, interactive, no deployment context).","options":[{"id":"A","text":"Collect LT-407 process and change history, ask j.duke's manager, keep the fleet monitoring — no isolation yet.","outcome":"Proportionate: history shows a local helpdesk tool run by j.duke; case closed with a note and the hunt rule stays on.","why":"Correct — least aggressive action that still answers the open question."},{"id":"B","text":"Reimage LT-407 within the hour.","outcome":"Disproportionate for an enable-only rule by a named employee — the business impact is unjustified.","why":"Containment must match evidence."},{"id":"C","text":"Disable Network Discovery on LT-407 and close.","outcome":"You treated the symptom; how a sales user ran an admin command stays unexplained.","why":"The actor question, not the rule, is the finding."}],"correct":"A","why":"Collect, verify with the human, keep monitoring — the HARD pattern of least-aggressive correctness."}],"explanation":"The trap was treating one artefact shape as one story. Machine-paced waves with service accounts map to changes; human-paced outliers map to investigations. Each step's wrong branch shows a real cost: needless isolation, wasted hours, or an unexplained admin action by a sales account. That final question — how does a sales user hold rights to touch firewall rules at all — is also an M1018 finding worth raising.","study":"Time-stamp clustering plus account context: rehearse this pair on your own alert history."},{"id":"H03","type":"multi","title":"Tuning AN0406 without losing coverage","summary":"Three changes that cut false positives — and three that cut real coverage","scenario":["AN0406 (detection strategy DET0145, Windows) fires on netsh, PowerShell Set-NetFirewallProfile and sc stop mpssvc, plus FirewallPolicy registry writes. In your estate it fires 40 times a day: administrators, build agents, an RMM tool. The detection engineer proposes six changes to the rule.","Constraint from the SOC manager: the tuning may reduce noise, but it must still catch every T1686.003 path — profile kills, rule edits, registry writes and service stops."],"question":"Select the <b>THREE<\/b> changes that reduce false positives WITHOUT dropping a tampering path.","hint":"For each change, name the path it would blind. A rule that watches only one verb watches one road in a city of three.","options":[{"id":"A","text":"Correlate each command with the measurable exposure change it produced before alerting","why":"Correct — the DET0901 design: the exposure change separates routine admin runs from real impairment without dropping any path."},{"id":"B","text":"Score each event against the change calendar and the account's baseline administration","why":"Correct — context scoring silences ticketed, in-window work while every path keeps firing outside it."},{"id":"C","text":"Keep all behaviour anchors (netsh, PowerShell, service stop, registry) and tune only the alerting decision","why":"Correct — tune the DECISION, not the sensors: coverage stays complete while noise drops."},{"id":"D","text":"Drop the registry-write anchor; almost nobody edits the registry directly","why":"That blinds the quiet path — the ZxShell road — which is the anchor's whole reason to exist."},{"id":"E","text":"Alert only on the literal string 'set allprofiles state off'","why":"One literal command string: every other phrasing, every rule edit and every registry write becomes invisible."},{"id":"F","text":"Require a valid change-ticket ID on the event before the alert can fire","why":"Attackers never file tickets — this switches the analytic off exactly when it matters."}],"correct":["A","B","C"],"explanation":"Good tuning changes how the rule DECIDES, not what it can SEE. Correlation with the exposure change (A) and calendar or baseline context (B) are the two levers DET0901 uses; keeping every anchor and tuning only the decision (C) keeps all four roads — netsh, the PowerShell cmdlet, the service stop, the registry write — under watch. The bad proposals each blind a real road: D silences the quiet registry path, E hard-codes one command string, and F hands the attacker a veto they exercise by simply not filing paperwork.","study":"List your own analytic's anchors, then label each tuning idea SEE or DECIDE — never accept a change that touches SEE."},{"id":"H04","type":"spot","title":"Fortigate diff — one line opens the edge","summary":"Find the change that exposes management access","scenario":["Salt Typhoon-style intruders edit perimeter device configurations to keep access. You review a config diff from an internet-facing Fortigate below. One line materially worsens exposure."],"question":"Click the <b>one line<\/b> that materially worsens the device's exposure.","hint":"Read what each allowaccess value permits on the interface facing the internet.","code":{"label":"ARTEFACT 1 — config diff, edge FW (session 88213, source 198[.]51[.]100[.]77)","lines":["- set allowaccess ping","+ set allowaccess ping https ssh","  set status up","  set mode static","- set logtraffic all","+ set logtraffic utm"]},"correct":["2"],"lineWhy":{"2":"Adding https and ssh to the WAN-facing interface exposes management services to the internet — the exposure change.","1":"This removal shows the OLD state (ping only) — context, not the problem itself.","3":"Interface status unchanged; no exposure impact.","4":"Addressing unchanged; no exposure impact.","5":"Logging scope shrinking from all to utm is a visibility reduction, but the question asks for management exposure — and line 2 is the material door-open."},"explanation":"Line 2 adds https and ssh management access to the internet-facing interface — the equivalent of leaving the control room door open on the perimeter wall. The logging change (line 6) is also worth flagging later — less telemetry helps attackers — but the question asks for the material exposure change, which is the allowaccess edit. DET0306 exists precisely to catch rule and management changes from abnormal sessions like this one.","study":"Read diffs interface by interface: what services does each allowaccess value start, and who can reach that interface?"},{"id":"H05","type":"triage","title":"Four events, one escalation budget","summary":"Decide four firewall events under time pressure","scenario":["You hold the escalation pen this shift. Four events; for each, decide. The runbook: escalate only what no ticket, owner or baseline explains."],"question":"For each event, choose the correct decision.","hint":"Owner + ticket + direction of change. A change that STRENGTHENS the firewall with a named owner is almost never the incident.","alerts":[{"id":"e1","time":"01:14","source":"Prod AWS account","text":"Security group ingress rule: TCP 445 from 0[.]0[.]0[.]0/0 created by role terraform-ci at 01:14, outside deploy windows. No ticket.","why":"Any-source SMB into prod, off-hours, unticketed: T1686.001 — escalate."},{"id":"e2","time":"08:02","source":"Corporate GPO","text":"Baseline push tightens outbound rules on workstations (block previously allowed 445) — change CHG-4090, owner netops.","why":"Documented, owned, and it strengthens the stance: benign work."},{"id":"e3","time":"09:40","source":"DC-FW-02","text":"Config commit: vulnerability-scan allowance for scanner VLAN added by secops account, ticket CHG-4091 attached.","why":"Named owner, ticket, narrow scope: benign — do not spend the escalation."},{"id":"e4","time":"23:58","source":"ISOL-FOR-01 (isolated forensic host)","text":"Windows firewall stopped via sc stop mpssvc by responder account r.chen during approved evidence-collection plan.","why":"Responder actions inside an approved plan are planned work — the account and host context say so."}],"actions":[{"id":"esc","label":"Escalate — possible T1686"},{"id":"close","label":"Close — explained, owner and ticket present"}],"correct":{"e1":"esc","e2":"close","e3":"close","e4":"close"},"explanation":"One escalation out of four, and it is the one with no owner, no ticket, an off-hours role, and an any-source SMB rule. The others all carry the benign triad — owner, ticket, plausible direction — including the forensic host where stopping the firewall service is part of the approved collection plan. The skill being trained is restraint: an escalation budget spent on explained events blinds you to the unexplained one.","study":"Score yourself against last week's queue: how many escalations had owners? Aim to push that number toward zero."},{"id":"H06","type":"qcm","title":"The invisible listener on 443","summary":"BPFDoor logic — connect the artefacts","scenario":["Confusion in the war room: on host PRX-01, defenders see a connection from the internet to TCP 443 — but no service change on 443, no new listening port in netstat, and no firewall rule change besides one odd nat-table entry captured by auditd:","iptables -t nat -A PREROUTING -p tcp -s 203[.]0[.]113[.]88 -j REDIRECT --to-ports 4444"],"question":"Which explanation ties the nat-table artefact to the observed connection?","hint":"PREROUTING acts before a service ever sees the packet. Follow the packet, not the socket list.","options":[{"id":"A","text":"Packets from that source are redirected in advance to the hidden shell port — netstat on 443 stays clean.","why":"Correct. REDIRECT rewrites the destination before routing; the visible service list never changes."},{"id":"B","text":"The attacker replaced the TLS certificate so 443 now serves their shell.","why":"A certificate swap changes identities, not destinations; netstat would still show the real listener."},{"id":"C","text":"A rootkit hides the listening socket from netstat while the service truly listens on 443.","why":"The artefact is a nat rule, not a socket-hiding rootkit — the rule fully explains the behaviour."},{"id":"D","text":"A proxy on 4444 relays traffic to 443 for logging purposes.","why":"Nothing in the evidence shows a relay; the redirect is one-way inbound from one source."}],"correct":["A"],"explanation":"The nat-table rule rewrites matching packets at PREROUTING — before any local service or socket list is involved. That is why the shell on the hidden high port never shows on 443 and why rule-listing looks unremarkable: the trick lives in the nat table, exactly the iptables-modification behaviour BPFDoor demonstrates under T1686 (its parent page lists this procedure). Detection therefore needs the iptables telemetry itself (AN0407), not socket listings.","study":"When traffic and socket lists disagree, suspect translation: nat tables, redirects, proxies — in that order."},{"id":"H07","type":"order","title":"Cloud rule incident — right order, real cost","summary":"Sequence the response to an any-source ingress rule","scenario":["03:20 — an any-source ingress rule appears on the production security group. You lead. Order the five actions; two orderings differ by real cost, so reason about exposure versus evidence."],"question":"Drag the five actions into the response order you would run.","hint":"The rogue rule is live exposure right now. Everything else can wait its turn without growing the loss.","items":[{"id":"x1","label":"Revoke the rogue ingress rule"},{"id":"x2","label":"Preserve the CloudTrail events and identify the acting identity"},{"id":"x3","label":"Disable the acting identity's keys and sessions"},{"id":"x4","label":"Diff the full security-group state against baseline for other rogue rules"},{"id":"x5","label":"Brief stakeholders with the confirmed timeline and actions taken"}],"correct":["x1","x2","x3","x4","x5"],"why":["Exposure first: an any-source rule is an open door this second; closing it costs nothing that matters.","Identity next: CloudTrail tells you whose key created the door — the actor, not the door, is the real problem.","Revoke the actor's access before they create the next door; note evidence was preserved before this disruptive step.","Sweep for siblings: attackers rarely open exactly one rule; a baseline diff finds the rest.","Briefing last, with facts: timeline, actor, actions — the order stakeholders can trust."],"explanation":"Revoke, identify, revoke the actor, sweep, brief. The common wrong ordering puts identity capture first 'to be safe' — but CloudTrail records persist, while an open any-source rule actively increases exposure every minute it lives. This mirrors the DET0424 world: control-plane changes are reversible in seconds, so reverse the exposure, then run the identity hunt with the evidence already captured.","study":"For your own cloud runbook, mark which steps are exposure-limited (act now) and which are evidence-limited (cannot spoil)."},{"id":"H08","type":"qcm","title":"Purple team — pick the path your detection misses","summary":"Choose the emulation path that tests the blind spot","scenario":["Purple-team planning. Your EDR analytic (AN0406-aligned) anchors on process creation with command lines: netsh, PowerShell Set-NetFirewallProfile, sc stop mpssvc. Registry telemetry exists but is not yet in the analytic.","Your goal for the emulation: prove whether the coverage gap is real by exercising the tampering path the current anchors do NOT catch."],"question":"Which emulation path tests exactly that gap?","hint":"Re-read which two telemetry families exist. The gap lives where only one of them has a witness.","options":[{"id":"A","text":"Write EnableFirewall=0 under FirewallPolicy via PowerShell registry access — no netsh, no service call, only registry telemetry.","why":"Correct. It changes the same state while appearing in the unwitnessed channel — precisely the suspected gap."},{"id":"B","text":"Run netsh advfirewall set allprofiles state off with full command line visible.","why":"That lands on your strongest anchor; it tests the working path, not the gap."},{"id":"C","text":"Run sc stop mpssvc to stop the firewall service.","why":"Also an AN0406 anchor — the analytic watches service control for exactly this."},{"id":"D","text":"Uninstall the firewall feature from the host.","why":"That is a system-modification route far beyond T1686 scope and would break the host rather than test a gap."}],"correct":["A"],"explanation":"The registry write performs the T1686.003 behaviour — a profile switched off — while producing only registry telemetry, which your analytic does not consume yet. That is the definition of a coverage gap, and the purple test will prove it the hard way. The netsh and sc paths (B, C) are your strongest anchors; they should pass. This is the attacker-perspective lesson inverted for the defender: attackers migrate to the quiet channel, so your tests must walk the quiet channel first.","study":"List one quiet channel per detection you own, then schedule the emulation that walks it.","perspective":{"attacker":"My netsh lines get caught. The same registry value that ZxShell flipped still switches the guard off — and nobody watches that door. I write four bytes and move on.","defender":"The purple result will show the registry write landing unseen. The fix is already scoped: add FirewallPolicy modification events to the analytic, alert on the value change, and re-test with the same path."}},{"id":"H09","type":"qcm","title":"Blue side — which telemetry caught the registry write","summary":"Same purple test, now from the sensor room","scenario":["The purple team ran the EnableFirewall=0 registry write on a lab host. Your process-based EDR analytic stayed silent — as predicted. You now must state, for the report, which telemetry source actually captured the tampering."],"question":"Which telemetry source recorded the T1686.003 action?","hint":"No process looked like firewall management, no service changed. What channel carried the change?","options":[{"id":"A","text":"Windows registry modification events showing the FirewallPolicy value change.","why":"Correct — the write itself is the event; registry telemetry is the only witness that exists."},{"id":"B","text":"Process creation telemetry of netsh.exe","why":"No netsh process ran; this is exactly the channel the purple path avoided."},{"id":"C","text":"Service control manager events","why":"The service never changed state — profiles were reconfigured, not stopped."},{"id":"D","text":"Network flow records","why":"Flows see the consequences later (open ports), never the management action itself."}],"correct":["A"],"explanation":"The blue answer mirrors the red intent: the only witness to a registry-side firewall change is registry telemetry. This is why AN0406 pairs process AND registry coverage — each catches what the other cannot see. In the report, the finding is one line: process anchors passed, registry write was invisible to process analytics, registry ingestion closed the gap.","study":"Write the one-line pairing for your own estate: which action, which two channels, which one is missing today."},{"id":"H10","type":"match","title":"Analytics to platforms","summary":"Pin each DET0145 analytic to its platform and logic","scenario":["You are documenting the DET0145 family for onboarding. Match each analytic to the platform and logic it covers."],"question":"Match each analytic to its platform and trigger logic.","hint":"Each analytic names its tools: netsh for Windows, iptables for Linux, pfctl for macOS, esxcli for ESXi, access-list for network gear.","items":[{"id":"a1","label":"AN0406","why":"Windows: netsh, Set-NetFirewallProfile, sc stop mpssvc, FirewallPolicy registry writes."},{"id":"a2","label":"AN0407","why":"Linux: iptables, nftables, firewalld rule changes and rule-count drops."},{"id":"a3","label":"AN0408","why":"macOS: pfctl, socketfilterfw, defaults writes to com[.]apple[.]alf."},{"id":"a4","label":"AN0409","why":"ESXi: esxcli network firewall set and vSphere API changes across management interfaces."},{"id":"a5","label":"AN0410","why":"Network devices: CLI changes like no access-list or permit any any, commits from unusual users."}],"slots":[{"id":"b1","label":"Windows — netsh / PowerShell / mpssvc / registry"},{"id":"b2","label":"Linux — iptables / nftables / firewalld"},{"id":"b3","label":"macOS — pfctl / socketfilterfw / alf"},{"id":"b4","label":"ESXi — esxcli / vSphere API"},{"id":"b5","label":"Network devices — ACL CLI / odd commit sessions"}],"correct":{"a1":"b1","a2":"b2","a3":"b3","a4":"b4","a5":"b5"},"explanation":"DET0145 is one strategy with five platform analytics; each analytic pairs a platform with the tools that only exist there. Onboarding engineers who know this pairing route alerts correctly on day one: an esxcli alert goes to virtualisation, a commit-session alert to the network team, a FirewallPolicy write to endpoint. Misrouting is how real detections end up 'noisy' — the logic was fine, the destination was wrong.","study":"Draw the five pairs from memory; then check them against the DET0145 table on the T1686 page."},{"id":"H11","type":"fill","title":"Perimeter device hardening policy","summary":"Insert the control keywords into the policy draft","scenario":["After the Fortigate near-miss (HARD exercise 4 style), GRC drafts a hardening policy for perimeter firewalls. The board wants one paragraph, no jargon. Insert the four control keywords."],"question":"Complete the policy paragraph with the four keywords.","hint":"One blank is a mitigation ID for patching, one for account rights; the other two name the reviews and the alert that catch rogue changes.","template":"Policy FW-P2: management access to perimeter firewalls is limited to named accounts under <b>{{1}}<\/b>; device images are patched on the vendor cycle under <b>{{2}}<\/b>; <b>{{3}}<\/b> are reviewed daily for unexplained rule or ACL edits; and any config commit from unusual users or sessions triggers <b>{{4}}<\/b> to the network-security team.","blanks":[{"id":"1","correct":"M1018 User Account Management","distractors":["M1051 Update Software","M1024 Restrict Registry Permissions"],"why":"Named-account access control is the M1018 discipline."},{"id":"2","correct":"M1051 Update Software","distractors":["M1018 User Account Management","M1047 Audit"],"why":"Patching images on vendor cycle is M1051 — the .002 sub-technique's mitigation."},{"id":"3","correct":"firewall and ACL rule changes","distractors":["user password resets","TLS certificate renewals"],"why":"Daily review targets the rule base — where T1686.002 lives."},{"id":"4","correct":"an immediate alert","distractors":["a monthly summary","an annual audit"],"why":"Commits from odd sessions are the DET0306 signal — the response must be immediate."}],"explanation":"The paragraph binds four controls to the four moments of a perimeter-tampering story: who may connect (M1018), that the device is patched (M1051), that the rule base is reviewed (where changes hide), and that odd commit sessions alert immediately (the DET0306 trigger). A policy that names the moment and the control is auditable; a policy that names only tools is not.","study":"Rewrite one of your own policies in this moment-control pattern and give it to an auditor to read."},{"id":"H12","type":"qcm","title":"ShrinkLocker's backwards trick","summary":"Enable the firewall, delete every rule — still T1686?","scenario":["During a ransomware case you find ShrinkLocker switched the system firewall ON and then deleted ALL existing rules. The host's firewall shows enabled with an empty rule set — remote access and C2 paths behave as if no firewall existed.","A colleague argues this is the opposite of T1686 because the firewall is on."],"question":"Why is the colleague wrong?","hint":"Read the technique title again: disable OR MODIFY. Then look at what the rule set can still do.","options":[{"id":"A","text":"Deleting the entire rule set modifies the firewall so it no longer restricts anything — the technique covers modifying, not only switching off.","why":"Correct. An enabled firewall with no rules blocks nothing; the protection is impaired either way."},{"id":"B","text":"It is only T1686 if the service is stopped; rule changes are a different technique.","why":"The technique description explicitly covers adding, deleting and modifying rules."},{"id":"C","text":"Enabling a firewall is always a defensive action regardless of context.","why":"Direction of the change matters: here enablement was cover for deleting the protections."},{"id":"D","text":"ShrinkLocker used PowerShell, and PowerShell actions map to a scripting technique instead.","why":"The tool does not define the technique; the behaviour — impairing the firewall — does."}],"correct":["A"],"explanation":"T1686 is defined by effect on the firewall's protection, not by the on/off label. ShrinkLocker's enable-then-delete leaves a green light on the dashboard while removing every restriction — arguably stealthier than switching off, because checks that look at state pass. This is why AN2043 (DET0901) watches measurable exposure changes and rule-set mutations, not just the state flag.","study":"Train your eye on rule counts and rule diffs, not only on the profile state — empty rule sets are a state of their own."},{"id":"H13","type":"multi","title":"DET0306 signals in the noise","summary":"Select the signals the perimeter analytic actually fires on","scenario":["You tune DET0306 (unauthorised network firewall rule modification): configuration changes from abnormal management IPs or non-console channels, correlated with spikes in previously blocked outbound traffic, unexpected allow-all rules, or bulk rule deletions — often after unauthorised logins.","Last night's device log bundle is on the table."],"artefacts":[{"label":"ARTEFACT 1 — device log bundle extract","kind":"log","filter":true,"lines":["23:41 config commit  src 198[.]51[.]100[.]77  session ssh  user admin_local  policy 'Any-Allow-Out' created","23:41 config commit  src 198[.]51[.]100[.]77  14 block policies disabled","23:55 traffic spike  outbound previously-blocked dest 203[.]0[.]113[.]0/24  +1900%","00:02 ntp drift  41ms  corrected","00:15 backup job  success  size 812MB","00:22 cpu  core-switch  61%  5-min avg"]}],"question":"Select the <b>TWO<\/b> findings that align with DET0306's logic.","hint":"The analytic wants: who changed what, from where — and what the traffic did afterwards.","options":[{"id":"A","text":"Config commits from an abnormal source creating allow rules and disabling block policies","why":"Correct — rule creation plus bulk disabling from an unusual management IP is the core trigger."},{"id":"B","text":"The outbound spike to previously blocked destinations right after the commits","why":"Correct — the correlated traffic consequence that turns config noise into confirmed impact."},{"id":"C","text":"The 41ms NTP drift that self-corrected","why":"Routine clock noise; it belongs in no firewall analytic."},{"id":"D","text":"The successful 812MB backup job","why":"Backup success is expected state; no rule or exposure change is described."},{"id":"E","text":"The 61% CPU average on the core switch","why":"A resource metric without config context; it supports nothing in this analytic."}],"correct":["A","B"],"explanation":"DET0306 is a two-part story — the config change from an abnormal place, and the network consequence that follows. The bundle shows both: allow-rule creation and bulk policy disabling from an unexpected source, then an outbound burst to previously blocked space. NTP, backups and CPU are realistic noise: they fill real logs, and a tuner who anchors on them spends the tuning budget in the wrong room.","study":"Practise separating event classes in one log bundle: config, consequence, housekeeping. Only the first two belong to detection logic."},{"id":"H14","type":"terminal","title":"ESXi — state before anything else","summary":"Read-only check on a compromised hypervisor","scenario":["You are root in the ESXi shell on host ESXI-03 during an active UNC3886-style incident. The CISO's instruction: <i>confirm the firewall state on that host — evidence must stay intact<\/i>.","You are in the ESXi shell. Nothing is named for you. Choose the tool and the verb yourself; the safe answer reads, it never writes."],"question":"Type the command that shows the ESXi firewall configuration without changing anything.","hint":"The vSphere client and the API are not reachable from this shell — the host's own command line is your only road. And the CISO's constraint already rules out half of the verbs on whatever tool you pick.","terminal":{"title":"ESXI-03 — simulated ESXi shell (root)","prompt":"[root@ESXI-03:~] ","banner":["VMware ESXi 8.0 build-23305546 — simulation for training only.","The CISO asked for the firewall state. Evidence must stay intact."],"expected":"esxcli network firewall get","elements":["esxcli","network","firewall","get"],"elWhy":{"esxcli":"the ESXi management CLI — the tool every ESXi firewall change goes through (AN0409).","network":"the namespace that owns firewall settings.","firewall":"the object under management.","get":"the read verb: prints Default Action and Enabled status without touching state."},"dangerous":["set","--enabled=false","unload","reset"],"dangerousMsg":"That command CHANGES hypervisor firewall state on a live compromised host — the exact evidence the CISO ordered preserved. The read verb reports; it never writes.","outputLines":["   Default Action: DROP","   Enabled: true","   Loaded: true"],"genericErr":"The shell does not recognise that command — and on a live incident host you get one quiet first move. Choose the read verb."},"explanation":"esxcli network firewall get prints the default action and enabled state without touching anything — the read verb, the exact AN0409 telemetry surface. The near-miss (set --enabled=false) would have DISABLED the hypervisor firewall on a compromised host: state change, evidence damage, and a gift to the attacker. Under incident conditions the safe tool choice is the one whose verb reads.","study":"Rehearse the read verbs per platform: show (netsh), list (iptables -L), get (esxcli), -s (socketfilterfw), show (device CLI)."},{"id":"H15","type":"multi","title":"Windows-host procedures only","summary":"Three of six examples belong to T1686.003","scenario":["You build the T1686.003 detection scope from real procedure examples. Six candidates are on the table; three belong to the Windows host firewall sub-technique."],"question":"Select the <b>THREE<\/b> procedures that belong to T1686.003.","hint":"Ask of each: which firewall was touched — a Windows host's, a cloud group's, or a perimeter device's?","options":[{"id":"A","text":"Magic Hound adds a netsh 'Terminal Server' rule allowing inbound TCP 3389","why":"Correct — a Windows host firewall rule via netsh."},{"id":"B","text":"HiddenFace adds a rule named 'Cortana' allowing inbound TCP 47000","why":"Correct — a disguised Windows firewall rule on a chosen port."},{"id":"C","text":"The Gentlemen Ransomware runs netsh advfirewall set allprofiles state off","why":"Correct — the Windows profiles switched off, the sub-technique's signature command."},{"id":"D","text":"Pacu allowlists IP addresses in AWS GuardDuty","why":"Cloud control-plane behaviour — T1686.001 territory, not Windows."},{"id":"E","text":"Salt Typhoon edits access-control lists on network devices","why":"Perimeter device rule sets — T1686.002, not the Windows host."},{"id":"F","text":"APT38 creates exemptions on ports 443, 6443, 8443 and 9443","why":"Device-level exemptions on the rule base — network device firewall again."}],"correct":["A","B","C"],"explanation":"The three Windows answers share one tell: the change lands on a Windows host's own firewall via netsh — profile state, or rules with innocent-sounding names. Pacu operates in the cloud control plane, and Salt Typhoon with APT38 operate on device rule sets. Scoping by platform keeps each sub-technique's detection and ownership clean — endpoint telemetry should never be expected to see an ACL commit.","study":"Rebuild this sort on the T1686 pages: six procedures, three sub-techniques — time yourself."},{"id":"H16","type":"branch","title":"The CISO's 22:00 demand","summary":"A migration deadline meets firewall governance","scenario":["22:00. The CISO calls: <i>the app migration moves tomorrow 06:00. The vendor says the simplest path is disabling host firewalls on the 40 migration hosts — permanently, fleet-wide. Decide now.<\/i>","You know the estate: those hosts sit on a flat segment with lateral paths to HR data. Two decisions to make."],"question":"Choose your decision for each step.","hint":"Never say only no — and never accept permanent for temporary. Shape the change: shortest window that works, monitored, reversible.","steps":[{"prompt":"STEP 1 — Your position on the vendor's request?","options":[{"id":"A","text":"Reject permanent fleet-wide disable; offer a time-boxed, scoped exception for the exact migration path with compensating monitoring.","outcome":"The CISO agrees: migration works, governance survives, and you own the exception's terms.","why":"Correct — the least aggressive action that still unblocks the business."},{"id":"B","text":"Accept the permanent disable — migration speed wins.","outcome":"40 hosts, flat segment, HR data — permanent disablement converts a migration into an exposure programme.","why":"The cost outlives the migration by years."},{"id":"C","text":"Refuse flatly and escalate; let someone else find the path.","outcome":"Governance intact, but the migration stalls and the CISO shops for a softer adviser — you lose the seat that lets you shape decisions.","why":"Saying only no fails the business and your influence."}],"correct":"A","why":"Shape, do not just gate: time-box, scope, monitor — the migration continues without a permanent impairment."},{"prompt":"STEP 2 — The exception's compensating conditions (pick the strongest set)?","options":[{"id":"A","text":"Window ends at 08:00, auto-revert task restores profiles, temporary alert on any lateral SMB/RDP from the segment, M1047 audit note filed.","outcome":"Solid: the exception self-destructs, the alert catches misuse, the audit trail exists. The CISO signs.","why":"Correct — reversibility, visibility, and record, in one breath."},{"id":"B","text":"Disable the firewalls and extend the window on request if the migration slips.","outcome":"Open-ended windows become permanent in practice; the revert never happens.","why":"Without a hard end, time-boxed is just disabled with paperwork."},{"id":"C","text":"No compensations — the migration team is senior enough.","outcome":"Trust is not a control; one abused credential on a flat segment spreads silently.","why":"M1047 exists exactly for this record-keeping."}],"correct":"A","why":"Auto-revert plus temporary detection plus audit note: the three-part signature of a governed exception."}],"explanation":"Senior firewall judgement is governance under pressure: refuse the permanent impairment, but hand back a workable, self-reverting, monitored exception. Both wrong branches show the price — exposure that outlives the migration, or influence lost to a bare refusal. Notice every condition in the correct answer maps to the T1686 mitigation set: least privilege (M1018), audit record (M1047), and monitoring that would catch T1686 use in the window.","study":"Draft your own one-page exception template tonight: window, scope, auto-revert, temporary detections, audit note."}]};</script>
<script>

(function(){
'use strict';
var DATA=window.__EXAM_DATA__;
var META=DATA.meta, EXS=DATA.exercises;
var SEV=META.sev, SEVCLASS={easy:'sev-easy',medium:'sev-medium',hard:'sev-hard','extremely-hard':'sev-extreme'};
var SEVWORD={easy:'EASY',medium:'MEDIUM',hard:'HARD','extremely-hard':'EXTREMELY HARD'};
var SEVCOL={easy:'var(--sev-easy)',medium:'var(--sev-medium)',hard:'var(--sev-hard)','extremely-hard':'var(--sev-extreme)'};
var TYPE_LABEL={qcm:'Multiple-choice question',multi:'Multi-select with partial credit',triage:'SOC alert-queue triage simulation',branch:'Branching incident-response decision',dragdrop:'Drag-and-drop sorting',order:'Timeline ordering',match:'Matching pairs',fill:'Fill-in-the-blank / report drafting',terminal:'Interactive terminal command',spot:'Spot the mistake'};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function clock(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function byId(list,id){for(var i=0;i<list.length;i++){if(list[i].id===id)return list[i];}return null;}
/* ---------------- state ---------------- */
var S={view:'intro',order:[],cur:0,phase:'idle',status:{},answers:{},credits:{},hintUsed:{},
 timer:{state:'ENDED',remaining:0,manualSec:0,autoSec:0,stamp:0},
 sum:0,answered:0,reviewMode:false,reported:false,perExLeft:0,
 user:{name:'',country:'',locale:''},pausePrev:null};
var TX=null; /* current exercise */
var tick=null;
var REDUCED=false;
try{REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){REDUCED=false;}
/* ---------------- timer state machine ---------------- */
function flushPause(){
 if(S.timer.stamp){var d=Math.round((Date.now()-S.timer.stamp)/1000);
  if(S.timer.state==='PAUSED_MANUAL')S.timer.manualSec+=d;
  else if(S.timer.state==='PAUSED_AUTO_CHECK')S.timer.autoSec+=d;
  S.timer.stamp=0;}
}
function tSet(next){
 var cur=S.timer.state;
 if(cur===next)return;
 if(cur==='RUNNING'){}else{flushPause();}
 S.timer.state=next;S.timer.stamp=0;
 if(next!=='RUNNING'&&next!=='ENDED')S.timer.stamp=Date.now();
 renderHeader();
}
function startTicker(){
 if(tick)return;
 tick=setInterval(function(){
  if(S.view==='results'||S.timer.state==='ENDED')return;
  if(S.timer.state==='RUNNING'){
   S.timer.remaining-=1;
   if(TX&&TX.perEx&&S.phase==='idle'&&S.view==='exam'){S.perExLeft=Math.max(0,S.perExLeft-1);renderPerEx();
    if(S.perExLeft===0){doCheck();return;}}
   if(S.timer.remaining<=0){S.timer.remaining=0;renderHeader();finishExam('timeout');return;}
   renderHeader();
  }
 },1000);
}
function startExam(retake){
 if(!retake){S.order=[];}
 S.order=shuffle(EXS.map(function(e,i){return i;}));
 /* keep terminal exercises non-adjacent */
 for(var i=1;i<S.order.length-1;i++){
  if(isTerm(S.order[i])&&isTerm(S.order[i-1])){var j=i+1;while(j<S.order.length&&(isTerm(S.order[j])||isTerm(S.order[j-1])))j++;if(j<S.order.length){var t=S.order[i];S.order[i]=S.order[j];S.order[j]=t;}}
 }
 S.cur=0;S.status={};S.answers={};S.credits={};S.hintUsed={};S.sum=0;S.answered=0;
 S.timer.remaining=META.timerSeconds;S.timer.manualSec=0;S.timer.autoSec=0;S.reported=false;
 S.phase='idle';S.reviewMode=false;S.perExLeft=0;
 tSet('RUNNING');
 S.view='exam';
 $('introView').classList.add('hidden');$('resultsView').classList.add('hidden');$('reviewView').classList.add('hidden');
 $('examView').classList.remove('hidden');$('progressWrap').classList.remove('hidden');
 renderCurrent();
 startTicker();
}
function isTerm(oi){return EXS[oi].type==='terminal';}
function resolvedCount(){var n=0;for(var k in S.status){if(S.status[k])n++;}return n;}
function updateProgress(){

  var seen={};
  (ans||[]).forEach(function(lid){seen[lid]=true;});
  C2.forEach(function(lid){
   var lbl='Line '+lid;
   if(seen[lid]){H++;add(lbl,'ok',(ex.lineWhy||{})[lid]||'');}
   else{add(lbl,'miss',(ex.lineWhy||{})[lid]||'');}});
  Object.keys(seen).forEach(function(lid){if(C2.indexOf(lid)<0){W++;add('Line '+lid,'bad',(ex.lineWhy||{})[lid]||'This line is not the mistake.');}});
 }else if(t==='terminal'){
  var tt=ex.terminal,norm=normCmd(ans),exp=normCmd(tt.expected);
  N=tt.elements.length;
  var tokens=norm?norm.split(' '):[];
  var expectedSet={};
  tt.elements.forEach(function(e){expectedSet[e]=true;});
  tt.elements.forEach(function(e){
   var got=e.indexOf(' ')>=0?(norm.indexOf(e)>=0):(tokens.indexOf(e)>=0);
   if(e.indexOf('=')>=0)got=norm.indexOf(e)>=0;
   if(got){H++;add(e,'ok',(tt.elWhy||{})[e]||'');}
   else{add(e,'miss',(tt.elWhy||{})[e]||'');}});
  tokens.forEach(function(tok){
   if(!tok)return;
   if(tt.elements.indexOf(tok)>=0)return;
   var isArg=tok.indexOf('=')>=0;
   var isKnownExtra=tt.allowedExtra&&tt.allowedExtra.indexOf(tok)>=0;
   if(isArg&&!isKnownExtra){var keyOk=tt.elements.some(function(e){return e.indexOf('=')>=0&&e.split('=')[0]===tok.split('=')[0];});
    if(!keyOk){W++;add(tok,'bad','This option is not needed and points the command in the wrong direction.');}}
  });
  if(tokens[0]&&tt.elements[0]&&tokens[0]!==tt.elements[0].split(' ')[0]){W++;add(tokens[0],'bad','Wrong tool for this goal.');}
 }
 var credit=scoreExercise(H,W,N);
 if(S.hintUsed[ex.id])credit=Math.max(0,credit-0.10);
 var g={credit:credit,items:items,H:H,W:W,N:N};
 if(t==='terminal'){
  var tt2=ex.terminal,norm2=normCmd(ans);
  g.dangerous=tt2.dangerous&&norm2!==normCmd(tt2.expected)&&tt2.dangerous.some(function(d){return norm2.indexOf(d.toLowerCase())>=0;});
 }
 return g;
}
/* ---------------- exercise flow ---------------- */
var widget=null;
function renderCurrent(){
 var oi=S.order[S.cur];TX=EXS[oi];
 S.phase='idle';S.perExLeft=TX.perEx||0;
 var h='';
 if(S.reviewMode)h+='<div class="card" style="border-color:var(--state-skipped)"><span style="color:var(--state-skipped);font-weight:700">\u26A0 Skipped exercise \u2014 you are back in review mode.</span></div>';
 h+=scenHtml(TX);
 h+='<section class="card blk blk-question"><div class="blk-h"><span class="ic">\u2753</span> QUESTION</div><div class="blk-b"><p class="q-text">'+TX.question+'</p></div></section>';
 h+='<section class="card blk blk-answer"><div class="blk-h"><span class="ic">\u270D\uFE0F</span> YOUR ANSWER</div><div class="blk-b" id="answerArea"></div></section>';
 h+='<div id="perExChip" class="step-chip hidden" style="margin-top:14px"></div>';
 h+='<div id="hintArea"></div><div id="fbArea"></div>';
 h+='<div class="btn-row"><button type="button" class="btn btn-check" id="btnCheck">\u2713 Check</button><button type="button" class="btn btn-danger" id="btnSkip2">\u23ED Skip</button><button type="button" class="btn btn-next hidden" id="btnNext">\u2192 Next</button></div>';
 $('examView').innerHTML=h;
 var area=$('answerArea');
 widget=W[TX.type](TX,area);
 $('colBtn').addEventListener('click',function(){var s=$('blkScen');s.classList.toggle('collapsed');
  this.textContent=s.classList.contains('collapsed')?'\u25B8 Expand':'\u25BE Collapse';});
 $('btnCheck').addEventListener('click',doCheck);
 $('btnSkip2').addEventListener('click',doSkip);
 $('btnNext').addEventListener('click',doNext);
 if(TX.perEx)renderPerEx();
 $('btnHint').disabled=false;
 (TX.artefacts||[]).forEach(function(a,i){
  if(a.kind==='log'&&a.filter){
   var fl=document.querySelector('[data-art="'+i+'"]');
   if(fl)fl.addEventListener('input',function(){
    var q=fl.value.toLowerCase();
    document.querySelectorAll('#art'+i+' .ln').forEach(function(ln){
     ln.classList.toggle('hide',q!==''&&ln.textContent.toLowerCase().indexOf(q)<0);});
   });
  }});
 renderHeader();
}
function doCheck(){
 if(S.phase!=='idle')return;
 var ans=widget.get();
 tSet('PAUSED_AUTO_CHECK'); /* Check-triggered auto-pause, before feedback renders */
 S.phase='checked';
 var g=grade(TX,ans);
 S.answers[TX.id]=ans;S.credits[TX.id]=g.credit;
 if(S.status[TX.id]!=='answered'){S.status[TX.id]='answered';S.sum+=g.credit;S.answered++;}
 markAnswerState(TX,ans);
 var ctrls=$('answerArea').querySelectorAll('input,select,button');
 for(var ci=0;ci<ctrls.length;ci++)ctrls[ci].disabled=true;
 renderFeedback(TX,g);
 $('btnCheck').disabled=true;$('btnSkip2').disabled=true;$('btnHint').disabled=true;
 var nb=$('btnNext');nb.classList.remove('hidden');
 var isLastQueued=(S.cur>=S.order.length-1);
 nb.textContent=S.reviewMode?'\u2192 Back to review':(isLastQueued?'\u2713 Final Submit':'\u2192 Next');
 renderPerEx();renderHeader();
}
function markAnswerState(ex,ans){
 var i,el,all;
 if(ex.type==='qcm'||ex.type==='multi'){
  all=$('answerArea').querySelectorAll('.opt');
  for(i=0;i<all.length;i++){el=all[i];var oid=el.getAttribute('data-oid');
   var inC=ex.correct.indexOf(oid)>=0,inS=ans.indexOf(oid)>=0;
   if(inC){el.insertAdjacentHTML('beforeend','<span class="mk ok">\u2713 Correct</span>');}
   else if(inS){el.insertAdjacentHTML('beforeend','<span class="mk bad">\u2717 Wrong</span>');}}}
 else if(ex.type==='fill'){
  all=$('answerArea').querySelectorAll('select.blank');
  for(i=0;i<all.length;i++){el=all[i];var b=byId(ex.blanks,el.getAttribute('data-bid'));
   if(el.value===b.correct)el.classList.add('ok');else if(el.value)el.classList.add('bad');}}
 else if(ex.type==='spot'){
  all=$('answerArea').querySelectorAll('.optline');
  for(i=0;i<all.length;i++){el=all[i];var lid=el.getAttribute('data-lid');
   if(ex.correct.indexOf(lid)>=0)el.style.outline='2px solid var(--state-correct)';
   else if(ans.indexOf(lid)>=0)el.style.outline='2px solid var(--state-incorrect)';}}
}
function doSkip(){
 if(S.phase!=='idle')return;
 S.status[TX.id]='skipped';
 if(S.reviewMode){S.reviewMode=false;showReview();return;}
 advance();
}
function doNext(){
 if(S.phase!=='checked')return;
 tSet('RUNNING');
 if(S.reviewMode){S.reviewMode=false;showReview();return;}
 advance();
}
function advance(){
 if(S.cur>=S.order.length-1){showReview();return;}
 S.cur++;renderCurrent();
}
/* ---------------- review skipped ---------------- */
function showReview(){
 var pending=[];
 S.order.forEach(function(oi,i){var ex=EXS[oi];if(S.status[ex.id]!=='answered'){pending.push({i:i,ex:ex});}});
 var unansweredSkipped=pending.filter(function(p){return S.status[p.ex.id]==='skipped';});
 if(S.timer.remaining<=0||S.timer.state==='ENDED'){finishExam(S.answered>0?'timeout':'timeout');return;}
 if(pending.length===0){finishExam('submit');return;}
 S.view='review';
 $('examView').classList.add('hidden');$('reviewView').classList.remove('hidden');
 var h='<section class="card"><div class="blk-h" style="color:var(--state-skipped)"><span class="ic">\u26A0\uFE0F</span> REVIEW SKIPPED EXERCISES</div><div class="blk-b">';
 h+='<p class="body">You have '+pending.length+' exercise(s) without a final answer. You can go back to any of them while the timer is running, or submit now. Skipped exercises that are never answered are <b>excluded</b> from the score \u2014 they count as neither correct nor wrong.</p>';
 h+='<div class="sk-list">';
 pending.forEach(function(p){
  h+='<div class="sk-row"><span class="sk-ico">\u26A0 Skipped</span><span class="sk-t"><span class="n">'+esc(p.ex.title)+'</span><br><span class="d">'+esc(p.ex.summary||'')+'</span></span><button type="button" class="btn" data-res="'+p.i+'">\u2192 Resume this exercise</button></div>';});
 h+='</div><div class="btn-row"><button type="button" class="btn btn-primary btn-big" id="btnFinalSubmit">\u2713 Submit final results</button></div>';
 h+='</div></section>';
 $('reviewView').innerHTML=h;
 $('reviewView').querySelectorAll('[data-res]').forEach(function(b){
  b.addEventListener('click',function(){
   S.cur=parseInt(b.getAttribute('data-res'),10);S.reviewMode=true;S.view='exam';
   $('reviewView').classList.add('hidden');$('examView').classList.remove('hidden');
   renderCurrent();});});
 $('btnFinalSubmit').addEventListener('click',function(){finishExam('submit');});
 renderHeader();
}
/* ---------------- feedback ---------------- */
function renderFeedback(ex,g){
 var cl,word,ico;
 if(g.credit>=1){cl='fb-correct';word='CORRECT';ico='\u2714';}
 else if(g.credit>0){cl='fb-partial';word='PARTIALLY CORRECT';ico='\u2714';}
 else{cl='fb-incorrect';word='INCORRECT';ico='\u2716';}
 var h='<section class="fb '+cl+'" id="fbBlock"><div class="fb-h"><span>'+ico+'</span> '+word;
 if(g.N>1)h+=' <span class="credit">\u2014 '+Math.round(g.H)+'/'+g.N+' items, credit '+g.credit.toFixed(2)+'</span>';
 h+='</div><div class="fb-b">';
 if(g.dangerous)h+='<div class="study" style="border-color:var(--state-incorrect);background:var(--tint-red-08)"><b style="color:var(--state-incorrect)">\u2717 DANGEROUS \u2014 NEAR MISS:</b> '+esc((ex.terminal&&ex.terminal.dangerousMsg)||'That command would have changed state or destroyed evidence.')+'</div>';
 if(ex.type==='terminal'){
  var t=ex.terminal;
  h+='<div class="canon"><div class="t">Canonical command (you can copy it):</div><pre class="code mono">'+hlCode(t.expected)+'</pre></div>';
  /* per-element breakdown from the graded items: what you got right, missed, or got wrong */
  h+='<div class="itrows">';
  g.items.forEach(function(it){
   var ic=it.st==='ok'?'\u2713 Correct':(it.st==='bad'?'\u2717 Wrong':'\u25CB Missed');
   h+='<div class="itrow '+it.st+'"><span class="ic">'+(it.st==='ok'?'\u2713':(it.st==='bad'?'\u2717':'\u25CB'))+'</span><span><b>'+esc(it.label)+'</b>'+(it.why?'<span class="why">'+esc(it.why)+'</span>':'')+'</span><span class="mk '+(it.st==='ok'?'ok':(it.st==='bad'?'bad':'miss'))+'">'+ic+'</span></div>';});
  h+='</div>';
  if(t.dangerNote)h+='<div class="study">'+t.dangerNote+'</div>';
 }else if(g.items.length){
  h+='<div class="itrows">';
  g.items.forEach(function(it){
   var ic=it.st==='ok'?'\u2713 Correct':(it.st==='bad'?'\u2717 Wrong':'\u25CB Missed');
   h+='<div class="itrow '+it.st+'"><span class="ic">'+(it.st==='ok'?'\u2713':(it.st==='bad'?'\u2717':'\u25CB'))+'</span><span>'+esc(it.label)+'<span class="why">'+esc(it.why)+'</span></span><span class="mk '+(it.st==='ok'?'ok':(it.st==='bad'?'bad':'miss'))+'">'+ic+'</span></div>';});
  h+='</div>';
 }
 h+='<p class="body" style="margin-top:12px">'+ex.explanation+'</p>';
 if(ex.perspective){
  h+='<div class="persp">';
  if(ex.perspective.attacker)h+='<div class="red"><b>\u2694 Attacker view:</b> '+ex.perspective.attacker+'</div>';
  if(ex.perspective.defender)h+='<div class="blue"><b>\u{1F6E1} Defender view:</b> '+ex.perspective.defender+'</div>';
  h+='</div>';
 }
 if(g.credit<1&&ex.study)h+='<div class="study"><b>What to study:</b> '+ex.study+'</div>';
 h+='</div></section>';
 $('fbArea').innerHTML=h;
 var fb=$('fbBlock');if(fb)fb.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'nearest'});
}
/* ---------------- results ---------------- */
function finishExam(reason){
 flushPause();tSet('ENDED');
 var byIdc={ok:0,part:0,bad:0},partSum=0,skippedList=[];
 EXS.forEach(function(ex){
  var st=S.status[ex.id];
  if(st==='answered'){var c=S.credits[ex.id]||0;
   if(c>=1)byIdc.ok++;else if(c>0){byIdc.part++;partSum+=c;}else byIdc.bad++;}
  else{skippedList.push(ex);}
 });
 var pct=S.answered>0?Math.round(S.sum/S.answered*100):0;
 var passed=pct>=70&&S.answered>0;
 S.view='results';
 $('examView').classList.add('hidden');$('reviewView').classList.add('hidden');$('resultsView').classList.remove('hidden');
 var h='<section class="card"><div class="blk-h" style="color:'+SEVCOL[SEV]+'"><span class="ic">\u{1F4CA}</span> RESULTS \u2014 '+esc(META.title)+'</div><div class="blk-b">';
 h+='<div class="res-head"><div><div class="res-pct" style="color:'+(passed?'var(--state-correct)':'var(--state-incorrect)')+'">'+pct+'%</div><div style="color:var(--text-secondary)">final score \u00B7 '+S.sum.toFixed(1)+' credits / '+S.answered+' answered</div></div></div>';
 h+='<div class="res-grid">';
 h+='<div class="res-cell ok"><div class="rc-ico">\u2714 Fully correct</div><div class="rc-n">'+byIdc.ok+'</div><div class="rc-l">exercises with credit 1.0</div></div>';
 h+='<div class="res-cell part"><div class="rc-ico">\u2714 Partially correct</div><div class="rc-n">'+byIdc.part+'</div><div class="rc-l">'+(byIdc.part?('avg credit '+(partSum/byIdc.part).toFixed(2)):'no partial answers')+'</div></div>';
 h+='<div class="res-cell bad"><div class="rc-ico">\u2716 Fully incorrect</div><div class="rc-n">'+byIdc.bad+'</div><div class="rc-l">credit 0.0</div></div>';
 h+='<div class="res-cell skip"><div class="rc-ico">\u26A0 Skipped \u2014 excluded</div><div class="rc-n">'+skippedList.length+'</div><div class="rc-l">not counted in numerator or denominator</div></div>';
 h+='</div>';
 if(skippedList.length){h+='<p class="body" style="margin-top:12px;color:var(--state-skipped)">\u26A0 Excluded (never answered): '+skippedList.map(function(e){return esc(e.title);}).join(' \u00B7 ')+'</p>';}
 h+='<div class="time-report">Time report \u2014 timer budget: <b>'+Math.round(META.timerSeconds/60)+' min</b> \u00B7 time left: <b>'+clock(S.timer.remaining)+'</b> \u00B7 paused manually: <b>'+clock(S.timer.manualSec)+'</b> \u00B7 paused for feedback review: <b>'+clock(S.timer.autoSec)+'</b> \u00B7 ended by: <b>'+(reason==='timeout'?'timer reached 00:00':'you pressed Submit')+'</b></div>';
 if(passed){
  h+='<div class="cert"><div class="c-big">\u2714 PASS \u2014 Certified: '+esc(META.title)+'</div><div class="c-sub">You reached '+pct+'%, above the 70% pass mark. Strong work: you can read, recognise and respond to this ATT&amp;CK object like a working analyst.</div></div>';
 }else{
  h+='<div class="cert fail"><div class="c-big">\u2716 FAIL \u2014 '+pct+'% (pass mark 70%)</div><div class="c-sub">Not this time. Re-read the intro notes, review the feedback from each exercise, and try again \u2014 every retake reshuffles questions and options.</div></div>';
 }
 h+='<div class="btn-row" style="justify-content:center"><button type="button" class="btn btn-primary btn-big" id="btnRetake">\u21BB Retake Exam</button></div>';
 h+='</div></section>';
 $('resultsView').innerHTML=h;
 var rb=$('btnRetake');
 if(rb)rb.addEventListener('click',function(){startExam(true);});
 reportScore(S.sum,S.answered,pct,passed);
 renderHeader();
}
function reportScore(creditSum,answeredCount,percent,passed){
 if(S.reported)return;S.reported=true;
 try{
  parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,
   score:Math.round(creditSum),total:answeredCount,percent:percent,passed:percent>=70},location.origin);
 }catch(e){/* opened directly, nothing to report to */}
}
/* ---------------- handshake ---------------- */
window.addEventListener('message',function(event){
 var d=event.data;if(!d)return;
 if(d.type!=='CYBERPULSE_INIT'&&d.type!=='CYBERMASTERY_INIT')return;
 S.user={name:d.username||'',country:d.country||'',locale:d.locale||''};
 /* theme field is always 'dark'; this file is dark-only by contract, nothing toggles */
 renderHeader();
});
/* ---------------- pause / hint ---------------- */
function togglePause(){
 if(S.view==='results')return;
 if(S.timer.state==='PAUSED_MANUAL'){
  tSet(S.pausePrev||'RUNNING');S.pausePrev=null;
  var m=$('pauseMask');if(m)m.remove();
 }else if(S.timer.state==='RUNNING'||S.timer.state==='PAUSED_AUTO_CHECK'){
  S.pausePrev=S.timer.state;tSet('PAUSED_MANUAL');
  var d=document.createElement('div');d.id='pauseMask';d.className='pausemask';
  d.innerHTML='<div class="inner"><div style="font-size:44px">\u23F8</div><div class="big">PAUSED \u2014 manual</div><div class="sub">The exercise is hidden and the timer is stopped. Press Resume to continue where you were.</div><div class="btn-row" style="justify-content:center"><button type="button" class="btn btn-primary btn-big" id="btnResume">\u25B6 Resume</button></div></div>';
  document.body.appendChild(d);
  $('btnResume').addEventListener('click',togglePause);
 }
}
$('btnPause').addEventListener('click',togglePause);
$('btnHint').addEventListener('click',function(){
 if(S.view!=='exam'||S.phase!=='idle'||!TX)return;
 if(S.hintUsed[TX.id])return;
 S.hintUsed[TX.id]=true;
 $('hintArea').innerHTML='<div class="hint-panel"><span class="h-ico">\u{1F4A1} Hint (\u221210% of this exercise\u2019s credit):</span>'+TX.hint+'</div>';
 $('btnHint').disabled=true;});
$('btnSkip').addEventListener('click',function(){if(S.view==='exam'&&S.phase==='idle')doSkip();});
/* ---------------- intro ---------------- */
function renderIntro(){
 $('hSev').textContent=SEVWORD[SEV];
 $('hSev').className='badge '+SEVCLASS[SEV];
 $('introView').innerHTML=DATA.introHtml;
 $('btnStart').addEventListener('click',function(){startExam(false);});
 renderHeader();
}
renderIntro();
})();

</script>
