/* ---------------- grading plumbing ---------------- */
function showFeedback(idx, g){
  var e = EX[idx];
  var credit = Math.max(0, g.credit - (S.hintUsed[idx] ? 0.10 : 0));
  S.credit[idx] = credit; S.answered[idx] = true;
  var si = S.skipped.indexOf(idx);
  if(si !== -1){ S.skipped.splice(si,1); }
  var label, cls, icon;
  if(credit >= 0.999){ label='CORRECT'; cls='fb-correct'; icon='&#10004;'; }
  else if(credit > 0){ label='PARTIALLY CORRECT'; cls='fb-partial'; icon='&#10004;'; }
  else { label='INCORRECT'; cls='fb-incorrect'; icon='&#10007;'; }
  if(g.dangerous){ label='DANGEROUS &#8212; NEAR MISS'; cls='fb-danger'; icon='&#10007;'; }
  var h = '<div class="fb-h '+cls+'"><span style="font-size:18px">'+icon+'</span> '+label;
  if(credit>0 && credit<0.999){ h += ' &#8212; credit '+credit.toFixed(2); }
  h += '</div><div class="fb-b">';
  if(g.creditLine){ h += '<div class="credit-line">'+g.creditLine+'</div>'; }
  if(g.items && g.items.length){
    for(var i=0;i<g.items.length;i++){
      var it=g.items[i];
      h += '<div class="item-row"><span class="it-ic '+it.cls+'">'+it.ic+'</span><span class="it-tx">'+it.tx+'</span></div>';
    }
  }
  h += '<p style="margin:12px 0 0">'+esc(g.expl || e.expl)+'</p>';
  if(g.extraHTML){ h += g.extraHTML; }
  if(!g.dangerous && S.credit[idx] < 1 && e.study){ h += '<div class="study-line">&#128218; <b>What to study:</b> '+esc(e.study)+'</div>'; }
  if(g.dangerous && e.study){ h += '<div class="study-line">&#128218; <b>What to study:</b> '+esc(e.study)+'</div>'; }
  h += '</div>';
  var fb=$('fbk'); fb.innerHTML=h; fb.hidden=false;
  lockWidget();
  renderHeader(); updateNavForState();
  fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function lockWidget(){
  var area=$('answer-area');
  var btns=area.querySelectorAll('button, select, input');
  for(var i=0;i<btns.length;i++){ btns[i].disabled=true; }
  var opts=area.querySelectorAll('.opt');
  for(var j=0;j<opts.length;j++){ opts[j].classList.add('lock'); }
}
function canonicalBlock(cmd){
  return '<div class="canon"><div class="canon-h">&#128203; Canonical command<button class="copy-btn" data-copy="'+esc(cmd)+'">&#128203; Copy</button></div><pre class="mono">'+esc(cmd)+'</pre></div>';
}
function bindCopy(){
  var b=$('fbk').querySelector('[data-copy]');
  if(b){ b.addEventListener('click', function(){
    var txt=b.getAttribute('data-copy');
    try { navigator.clipboard.writeText(txt); b.textContent='Copied'; }
    catch(err){ b.textContent='Select manually'; }
  }); }
}
function gradeCurrent(){
  var idx = S.order[S.cur];
  var e = EX[idx];
  var g = WIDGETS[e.type].grade(e, idx);
  g.expl = g.expl || e.expl;
  if(e.type==='term' && g.extraHTML === undefined && g.canonical){ g.extraHTML = canonicalBlock(g.canonical); }
  showFeedback(idx, g);
  bindCopy();
  $('btn-skip').disabled = true;
}

/* ---------------- widgets ---------------- */
var WIDGETS = {};

/* ==== qcm ==== */
WIDGETS.qcm = {
  html: function(e){ return '<div id="w-qcm"></div>'; },
  bind: function(e, idx){
    var order = shuffle(e.opts.map(function(_,i){ return i; }));
    var st = { order: order, sel: null };
    S.picks[idx] = st;
    var h='';
    for(var i=0;i<order.length;i++){
      var oi=order[i];
      h += '<button type="button" class="opt" data-oi="'+oi+'"><span class="olab">'+letters(i)+'.</span><span>'+esc(e.opts[oi])+'</span></button>';
    }
    $('answer-area').innerHTML = h;
    var btns = $('answer-area').querySelectorAll('.opt');
    for(var b=0;b<btns.length;b++){
      btns[b].addEventListener('click', function(ev){
        var el = ev.currentTarget;
        if(st.sel !== null){ return; }
        st.sel = parseInt(el.getAttribute('data-oi'),10);
        el.classList.add('sel');
        el.insertAdjacentHTML('beforeend','<span class="osel-ind">&#10003; Selected</span>');
      });
    }
  },
  grade: function(e, idx){
    var st=S.picks[idx];
    if(st.sel === null){ return { credit:0, items:[{ic:'&#9888;',cls:'it-missed',tx:'No answer selected.'}] }; }
    var ok = st.sel === e.correct;
    var rows = [];
    for(var i=0;i<e.opts.length;i++){
      var isC = i===e.correct;
      var chosen = st.sel===i;
      if(isC){ rows.push({ic: chosen?'&#10004;':'&#9675;', cls: chosen?'it-correct':'it-missed', tx:(chosen?'&#10004; Correct — ':'&#9675; Missed — ')+'The right answer was: '+e.opts[i]}); }
      else if(chosen){ rows.push({ic:'&#10007;', cls:'it-wrong', tx:'&#10007; Wrong — you chose: '+e.opts[i]}); }
    }
    return { credit: ok?1:0, items: rows };
  }
};

/* ==== multi (multi-select, partial credit) ==== */
WIDGETS.multi = {
  html: function(e){ return '<div id="w-multi"><div class="dd-hintline">Select all that apply. Wrong picks subtract from correct ones (partial credit).</div></div>'; },
  bind: function(e, idx){
    var order = shuffle(e.opts.map(function(_,i){ return i; }));
    var st = { order: order, sel: [] };
    S.picks[idx] = st;
    var h='';
    for(var i=0;i<order.length;i++){
      var oi=order[i];
      h += '<button type="button" class="opt" data-oi="'+oi+'"><span class="olab">'+letters(i)+'.</span><span>'+esc(e.opts[oi])+'</span></button>';
    }
    $('answer-area').insertAdjacentHTML('beforeend', h);
    var btns = $('answer-area').querySelectorAll('.opt');
    for(var b=0;b<btns.length;b++){
      btns[b].addEventListener('click', function(ev){
        var el = ev.currentTarget;
        var oi = parseInt(el.getAttribute('data-oi'),10);
        var at = st.sel.indexOf(oi);
        if(at === -1){ st.sel.push(oi); el.classList.add('sel'); el.insertAdjacentHTML('beforeend','<span class="osel-ind">&#10003; Selected</span>'); }
        else { st.sel.splice(at,1); el.classList.remove('sel'); var ind=el.querySelector('.osel-ind'); if(ind){ ind.remove(); } }
      });
    }
  },
  grade: function(e, idx){
    var st=S.picks[idx];
    var N=e.correct.length;
    var H=0, W=0; var rows=[];
    for(var c=0;c<e.correct.length;c++){
      var ci=e.correct[c];
      if(st.sel.indexOf(ci)!==-1){ H++; rows.push({ic:'&#10004;',cls:'it-correct',tx:'&#10004; Correct — '+e.opts[ci]+(e.why && e.why[ci] ? ' — '+e.why[ci] : '')}); }
      else { rows.push({ic:'&#9675;',cls:'it-missed',tx:'&#9675; Missed — '+e.opts[ci]+(e.why && e.why[ci] ? ' — '+e.why[ci] : '')}); }
    }
    for(var s=0;s<st.sel.length;s++){
      var si=st.sel[s];
      if(e.correct.indexOf(si)===-1){ W++; rows.push({ic:'&#10007;',cls:'it-wrong',tx:'&#10007; Wrong — '+e.opts[si]+(e.why && e.why[si] ? ' — '+e.why[si] : ' — not part of the correct answer here')}); }
    }
    if(st.sel.length===0){ return { credit:0, items:[{ic:'&#9888;',cls:'it-missed',tx:'Nothing selected.'}] }; }
    var credit = scoreExercise(H,W,N);
    return { credit: credit, creditLine: (H+W>0? ('Items: '+H+' correct / '+W+' wrong of N='+N+' &#8212; credit = max(0, ('+H+' &#8722; '+W+') / '+N+') = '+credit.toFixed(2)) : ''), items: rows };
  }
};

/* ==== match (partial credit) ==== */
WIDGETS.match = {
  html: function(e){ return '<div id="w-match"><div class="dd-hintline">Pick a value on the right, then press the drop slot next to the item it belongs to. Press &#10005; to clear a slot.</div><div id="mt-rows"></div><div class="bank" id="mt-bank"></div></div>'; },
  bind: function(e, idx){
    var rOrder = shuffle(e.right.map(function(_,i){ return i; }));
    var st = { assign: e.left.map(function(){ return null; }), selR: null };
    S.picks[idx] = st;
    var h='';
    for(var i=0;i<e.left.length;i++){
      h += '<div class="mt-row"><div class="mt-left"><div class="mt-q">'+esc(e.left[i])+'</div>';
      h += '<div class="mt-slot"><div class="mt-drop" data-l="'+i+'">&#9898; drop here</div><button type="button" class="mt-clear" data-cl="'+i+'" title="Clear">&#10005;</button></div></div></div>';
    }
    $('mt-rows').innerHTML = h;
    var bank='';
    for(var r2=0;r2<rOrder.length;r2++){
      var ri=rOrder[r2];
      bank += '<button type="button" class="chip" data-r="'+ri+'">'+esc(e.right[ri])+'</button>';
    }
    $('mt-bank').innerHTML = '<div class="dd-hintline">Values:</div>' + bank;
    var chips = $('mt-bank').querySelectorAll('.chip');
    for(var c=0;c<chips.length;c++){
      chips[c].addEventListener('click', function(ev){
        var el=ev.currentTarget;
        if(el.classList.contains('used')){ return; }
        var all=$('mt-bank').querySelectorAll('.chip');
        for(var k2=0;k2<all.length;k2++){ all[k2].classList.remove('sel'); }
        el.classList.add('sel');
        st.selR = parseInt(el.getAttribute('data-r'),10);
      });
    }
    var drops = $('mt-rows').querySelectorAll('.mt-drop');
    for(var d=0;d<drops.length;d++){
      drops[d].addEventListener('click', function(ev){
        if(st.selR === null){ return; }
        var li = parseInt(ev.currentTarget.getAttribute('data-l'),10);
        if(st.assign[li] !== null){ unassign(li); }
        st.assign[li] = st.selR;
        var chip = $('mt-bank').querySelector('[data-r="'+st.selR+'"]');
        chip.classList.add('used'); chip.classList.remove('sel');
        ev.currentTarget.innerHTML = '<span class="fillv">'+esc(e.right[st.selR])+'</span>';
        st.selR = null;
      });
    }
    var clears = $('mt-rows').querySelectorAll('.mt-clear');
    for(var cl=0;cl<clears.length;cl++){
      clears[cl].addEventListener('click', function(ev){
        unassign(parseInt(ev.currentTarget.getAttribute('data-cl'),10));
      });
    }
    function unassign(li){
      var cur = st.assign[li];
      if(cur === null){ return; }
      st.assign[li] = null;
      var chip = $('mt-bank').querySelector('[data-r="'+cur+'"]');
      if(chip){ chip.classList.remove('used'); }
      var drop = $('mt-rows').querySelector('.mt-drop[data-l="'+li+'"]');
      drop.innerHTML = '&#9898; drop here';
    }
  },
  grade: function(e, idx){
    var st=S.picks[idx];
    var H=0,W=0,miss=0; var rows=[];
    for(var i=0;i<e.left.length;i++){
      var a=st.assign[i];
      if(a===e.correct[i]){ H++; rows.push({ic:'&#10004;',cls:'it-correct',tx:'&#10004; Correct — '+e.left[i]+' &#8594; '+e.right[a]}); }
      else if(a!==null){ W++; rows.push({ic:'&#10007;',cls:'it-wrong',tx:'&#10007; Wrong — '+e.left[i]+' &#8594; '+e.right[a]+'. Right answer: '+e.right[e.correct[i]]}); }
      else { miss++; rows.push({ic:'&#9675;',cls:'it-missed',tx:'&#9675; Missed — '+e.left[i]+' &#8594; right answer: '+e.right[e.correct[i]]}); }
    }
    var N=e.left.length;
    return { credit: scoreExercise(H,W,N), creditLine: 'Items: '+H+' correct / '+W+' wrong of N='+N, items: rows };
  }
};

/* ==== drag & drop (partial credit) ==== */
WIDGETS.drag = {
  html: function(e){ return '<div id="w-drag"><div class="dd-hintline">Drag each item into the right zone — or press an item, then press a zone. Press &#10005; to send it back.</div><div class="dd-wrap"><div class="dd-bank" id="dd-bank"><div class="dd-zt">&#127991; Items</div></div><div id="dd-zones"></div></div></div>'; },
  bind: function(e, idx){
    var order = shuffle(e.items.map(function(_,i){ return i; }));
    var st = { where: e.items.map(function(){ return null; }), sel: null };
    S.picks[idx] = st;
    var zh='';
    for(var z=0;z<e.zones.length;z++){
      zh += '<div class="dd-zone" data-z="'+z+'"><div class="dd-zt">&#128451; '+esc(e.zones[z].t)+'</div><div class="z-items"></div></div>';
    }
    $('dd-zones').innerHTML = zh;
    function itemHTML(i){
      return '<div class="dd-item" draggable="true" data-i="'+i+'"><span>'+esc(e.items[i].t)+'</span><button type="button" class="rm" title="Return item">&#10005;</button></div>';
    }
    function renderAll(){
      var bank=$('dd-bank'); bank.innerHTML='<div class="dd-zt">&#127991; Items</div>';
      for(var i2=0;i2<order.length;i2++){ var ii=order[i2]; if(st.where[ii]===null){ bank.insertAdjacentHTML('beforeend', itemHTML(ii)); } }
      var zoneEls = $('dd-zones').querySelectorAll('.dd-zone');
      for(var zz=0; zz<zoneEls.length; zz++){
        var zk = zoneEls[zz].getAttribute('data-z');
        var holder = zoneEls[zz].querySelector('.z-items');
        holder.innerHTML='';
        for(var i3=0;i3<e.items.length;i3++){
          if(st.where[i3]===parseInt(zk,10)){ holder.insertAdjacentHTML('beforeend', itemHTML(i3)); }
        }
      }
      bindItems();
    }
    function placeItem(i, z){
      st.where[i] = z; st.sel=null; renderAll();
    }
    function bindItems(){
      var items=$('w-drag').querySelectorAll('.dd-item');
      for(var k=0;k<items.length;k++){
        items[k].addEventListener('click', function(ev){
          if(ev.target.classList && ev.target.classList.contains('rm')){ return; }
          var el=ev.currentTarget;
          var all=$('w-drag').querySelectorAll('.dd-item');
          for(var q=0;q<all.length;q++){ all[q].classList.remove('sel'); }
          el.classList.add('sel');
          st.sel = parseInt(el.getAttribute('data-i'),10);
        });
        items[k].addEventListener('dragstart', function(ev){
          ev.dataTransfer.setData('text/plain', ev.currentTarget.getAttribute('data-i'));
        });
        var rm=items[k].querySelector('.rm');
        if(rm){ rm.addEventListener('click', function(ev){
          var di=parseInt(ev.target.parentNode.getAttribute('data-i'),10);
          st.where[di]=null; renderAll();
        }); }
      }
      var zones=$('dd-zones').querySelectorAll('.dd-zone');
      for(var z2=0;z2<zones.length;z2++){
        zones[z2].addEventListener('click', function(ev){
          if(ev.target.classList && (ev.target.classList.contains('rm')||ev.target.classList.contains('dd-item'))){ return; }
          if(st.sel===null){ return; }
          placeItem(st.sel, parseInt(ev.currentTarget.getAttribute('data-z'),10));
        });
        zones[z2].addEventListener('dragover', function(ev){ ev.preventDefault(); ev.currentTarget.classList.add('hlit'); });
        zones[z2].addEventListener('dragleave', function(ev){ ev.currentTarget.classList.remove('hlit'); });
        zones[z2].addEventListener('drop', function(ev){
          ev.preventDefault(); ev.currentTarget.classList.remove('hlit');
          var i=parseInt(ev.dataTransfer.getData('text/plain'),10);
          if(!isNaN(i)){ placeItem(i, parseInt(ev.currentTarget.getAttribute('data-z'),10)); }
        });
      }
    }
    renderAll();
  },
  grade: function(e, idx){
    var st=S.picks[idx];
    var H=0,W=0; var rows=[];
    for(var i=0;i<e.items.length;i++){
      var w=st.where[i];
      if(w===e.items[i].z){ H++; rows.push({ic:'&#10004;',cls:'it-correct',tx:'&#10004; Correct — '+e.items[i].t+' &#8594; '+e.zones[w].t}); }
      else if(w!==null){ W++; rows.push({ic:'&#10007;',cls:'it-wrong',tx:'&#10007; Wrong — '+e.items[i].t+' placed in '+e.zones[w].t+'. Right zone: '+e.zones[e.items[i].z].t}); }
      else { rows.push({ic:'&#9675;',cls:'it-missed',tx:'&#9675; Missed — '+e.items[i].t+' belongs in '+e.zones[e.items[i].z].t}); }
    }
    var N=e.items.length;
    return { credit: scoreExercise(H,W,N), creditLine: 'Items: '+H+' correct / '+W+' wrong of N='+N, items: rows };
  }
};

/* ==== order / rank (partial credit) ==== */
function ordWidget(kind){
  return {
    html: function(e){ return '<div id="w-ord"><div class="dd-hintline">'+(kind==='rank'?'Drag or use the arrows to rank items from rank 1 (top) to the last rank (bottom).':'Drag or use the arrows to put the steps in the correct order, first step on top.')+'</div><ul class="ord-list" id="ord-list"></ul></div>'; },
    bind: function(e, idx){
      var cur = shuffle(e.items.map(function(_,i){ return i; }));
      var st = { list: cur };
      S.picks[idx] = st;
      function render(){
        var h='';
        for(var i=0;i<st.list.length;i++){
          h += '<li class="ord-item" draggable="true" data-pos="'+i+'"><span class="rk">'+(i+1)+'</span><span class="ot">'+esc(e.items[st.list[i]])+'</span>';
          h += '<span class="ord-ctrls"><button type="button" class="ord-btn" data-up="'+i+'" aria-label="Move up">&#8593;</button><button type="button" class="ord-btn" data-dn="'+i+'" aria-label="Move down">&#8595;</button></span></li>';
        }
        $('ord-list').innerHTML=h;
        var items=$('ord-list').querySelectorAll('.ord-item');
        for(var k=0;k<items.length;k++){
          items[k].addEventListener('dragstart', function(ev){ ev.dataTransfer.setData('text/plain', ev.currentTarget.getAttribute('data-pos')); });
          items[k].addEventListener('dragover', function(ev){ ev.preventDefault(); ev.currentTarget.classList.add('dragover'); });
          items[k].addEventListener('dragleave', function(ev){ ev.currentTarget.classList.remove('dragover'); });
          items[k].addEventListener('drop', function(ev){
            ev.preventDefault(); ev.currentTarget.classList.remove('dragover');
            var from=parseInt(ev.dataTransfer.getData('text/plain'),10);
            var to=parseInt(ev.currentTarget.getAttribute('data-pos'),10);
            if(!isNaN(from) && from!==to){ var mv=st.list.splice(from,1)[0]; st.list.splice(to,0,mv); render(); }
          });
        }
        var ups=$('ord-list').querySelectorAll('[data-up]');
        for(var u=0;u<ups.length;u++){ ups[u].addEventListener('click', function(ev){
          var i=parseInt(ev.currentTarget.getAttribute('data-up'),10);
          if(i>0){ var t=st.list[i-1]; st.list[i-1]=st.list[i]; st.list[i]=t; render(); }
        }); }
        var dns=$('ord-list').querySelectorAll('[data-dn]');
        for(var d2=0;d2<dns.length;d2++){ dns[d2].addEventListener('click', function(ev){
          var i=parseInt(ev.currentTarget.getAttribute('data-dn'),10);
          if(i<st.list.length-1){ var t=st.list[i+1]; st.list[i+1]=st.list[i]; st.list[i]=t; render(); }
        }); }
      }
      render();
    },
    grade: function(e, idx){
      var st=S.picks[idx];
      var H=0,W=0; var rows=[];
      for(var i=0;i<st.list.length;i++){
        var placed=st.list[i];
        if(placed===i){ H++; rows.push({ic:'&#10004;',cls:'it-correct',tx:'&#10004; Correct — '+(kind==='rank'?'rank '+(i+1):'position '+(i+1))+': '+e.items[i]}); }
        else { W++; rows.push({ic:'&#10007;',cls:'it-wrong',tx:'&#10007; Wrong — at '+(kind==='rank'?'rank '+(i+1):'position '+(i+1))+' you placed '+e.items[placed]+'. Right: '+e.items[i]}); }
      }
      var N=e.items.length;
      return { credit: scoreExercise(H,W,N), creditLine: 'Items: '+H+' in the right '+(kind==='rank'?'rank':'position')+' / '+W+' wrong of N='+N, items: rows };
    }
  };
}
WIDGETS.order = ordWidget('order');
WIDGETS.rank = ordWidget('rank');

/* ==== fill-in-the-blank (partial credit) ==== */
WIDGETS.fill = {
  html: function(e){ return '<div id="w-fill"><div class="blk-text" id="fill-text"></div><div class="dd-hintline" style="margin-top:8px">Choose a word for every blank. Distractor words are in the list too; wrong picks subtract from correct ones.</div><div class="bank" id="fill-bank"></div></div>'; },
  bind: function(e, idx){
    var bOrder = shuffle(e.bank.map(function(_,i){ return i; }));
    var st = { sel: e.correct.map(function(){ return null; }) };
    S.picks[idx] = st;
    var t='';
    var parts = e.template.split(/\{(\d+)\}/);
    for(var i=0;i<parts.length;i++){
      if(i%2===1){
        var bi=parseInt(parts[i],10);
        t += '<select class="blank" data-b="'+bi+'" aria-label="Blank '+(bi+1)+'"><option value="-1">&#8212; choose &#8212;</option>';
        for(var o=0;o<bOrder.length;o++){ t += '<option value="'+bOrder[o]+'">'+esc(e.bank[bOrder[o]])+'</option>'; }
        t += '</select>';
      } else {
        t += esc(parts[i]);
      }
    }
    $('fill-text').innerHTML = t;
    var bankH='';
    for(var b=0;b<bOrder.length;b++){ bankH += '<span class="chip">'+esc(e.bank[bOrder[b]])+'</span>'; }
    $('fill-bank').innerHTML = bankH;
    var sels=$('fill-text').querySelectorAll('select.blank');
    for(var s=0;s<sels.length;s++){
      sels[s].addEventListener('change', function(ev){
        var bi=parseInt(ev.currentTarget.getAttribute('data-b'),10);
        var v=parseInt(ev.currentTarget.value,10);
        st.sel[bi] = v===-1 ? null : v;
      });
    }
  },
  grade: function(e, idx){
    var st=S.picks[idx];
    var H=0,W=0; var rows=[];
    for(var i=0;i<e.correct.length;i++){
      var s=st.sel[i];
      if(s===e.correct[i]){ H++; rows.push({ic:'&#10004;',cls:'it-correct',tx:'&#10004; Correct — blank '+(i+1)+': '+e.bank[e.correct[i]]}); }
      else if(s!==null){ W++; rows.push({ic:'&#10007;',cls:'it-wrong',tx:'&#10007; Wrong — blank '+(i+1)+': you chose '+e.bank[s]+'. Right: '+e.bank[e.correct[i]]}); }
      else { rows.push({ic:'&#9675;',cls:'it-missed',tx:'&#9675; Missed — blank '+(i+1)+': '+e.bank[e.correct[i]]}); }
    }
    var N=e.correct.length;
    return { credit: scoreExercise(H,W,N), creditLine: 'Items: '+H+' correct / '+W+' wrong of N='+N, items: rows };
  }
};


/* ==== logq (log viewer + embedded single/multi answer) ==== */
WIDGETS.logq = {
  html: function(e){ return '<div id="w-logq"><div class="dd-hintline">'+(e.aw.kind==='multi'?'Select all that apply (partial credit).':'Pick the one best answer.')+'</div></div>'; },
  bind: function(e, idx){
    var order = shuffle(e.aw.opts.map(function(_,i){ return i; }));
    var st = { order: order, sel: (e.aw.kind==='multi'? [] : null) };
    S.picks[idx] = st;
    var h='';
    for(var i=0;i<order.length;i++){
      var oi=order[i];
      h += '<button type="button" class="opt" data-oi="'+oi+'"><span class="olab">'+letters(i)+'.</span><span>'+esc(e.aw.opts[oi])+'</span></button>';
    }
    $('answer-area').insertAdjacentHTML('beforeend', h);
    var btns = $('answer-area').querySelectorAll('.opt');
    for(var b=0;b<btns.length;b++){
      btns[b].addEventListener('click', function(ev){
        var el=ev.currentTarget;
        var oi=parseInt(el.getAttribute('data-oi'),10);
        if(e.aw.kind==='multi'){
          var at=st.sel.indexOf(oi);
          if(at===-1){ st.sel.push(oi); el.classList.add('sel'); el.insertAdjacentHTML('beforeend','<span class="osel-ind">&#10003; Selected</span>'); }
          else { st.sel.splice(at,1); el.classList.remove('sel'); var ind=el.querySelector('.osel-ind'); if(ind){ ind.remove(); } }
        } else {
          if(st.sel !== null){ return; }
          st.sel=oi; el.classList.add('sel');
          el.insertAdjacentHTML('beforeend','<span class="osel-ind">&#10003; Selected</span>');
        }
      });
    }
    bindFilters();
  },
  grade: function(e, idx){
    var st=S.picks[idx];
    var aw=e.aw;
    if(aw.kind==='multi'){
      var N=aw.correct.length,H=0,W=0; var rows=[];
      for(var c=0;c<aw.correct.length;c++){
        var ci=aw.correct[c];
        if(st.sel.indexOf(ci)!==-1){ H++; rows.push({ic:'&#10004;',cls:'it-correct',tx:'&#10004; Correct — '+aw.opts[ci]}); }
        else { rows.push({ic:'&#9675;',cls:'it-missed',tx:'&#9675; Missed — '+aw.opts[ci]}); }
      }
      for(var s=0;s<st.sel.length;s++){
        var si=st.sel[s];
        if(aw.correct.indexOf(si)===-1){ W++; rows.push({ic:'&#10007;',cls:'it-wrong',tx:'&#10007; Wrong — '+aw.opts[si]}); }
      }
      if(st.sel.length===0){ return { credit:0, items:[{ic:'&#9888;',cls:'it-missed',tx:'Nothing selected.'}] }; }
      return { credit: scoreExercise(H,W,N), creditLine: 'Items: '+H+' correct / '+W+' wrong of N='+N, items: rows };
    }
    var ok = st.sel === aw.correct;
    var rows2=[];
    for(var i2=0;i2<aw.opts.length;i2++){
      var isC=i2===aw.correct; var chosen=st.sel===i2;
      if(isC){ rows2.push({ic: chosen?'&#10004;':'&#9675;', cls: chosen?'it-correct':'it-missed', tx:(chosen?'&#10004; Correct — ':'&#9675; Missed — ')+aw.opts[i2]}); }
      else if(chosen){ rows2.push({ic:'&#10007;',cls:'it-wrong',tx:'&#10007; Wrong — you chose: '+aw.opts[i2]}); }
    }
    if(st.sel===null){ return { credit:0, items:[{ic:'&#9888;',cls:'it-missed',tx:'No answer selected.'}] }; }
    return { credit: ok?1:0, items: rows2 };
  }
};
function bindFilters(){
  var views=$('ex-area').querySelectorAll('.logv');
  for(var i=0;i<views.length;i++){
    (function(v){
      var inp=v.querySelector('.logv-filter');
      var lns=v.querySelectorAll('.ln');
      inp.addEventListener('input', function(){
        var q=inp.value.toLowerCase();
        for(var j=0;j<lns.length;j++){
          lns[j].style.display = (q==='' || lns[j].textContent.toLowerCase().indexOf(q)!==-1) ? '' : 'none';
        }
      });
    })(views[i]);
  }
}

/* ==== terminal (fake shell) ==== */
function normCmd(c){
  return c.toLowerCase().replace(/["']/g,'').replace(/\s+/g,' ').trim().replace(/[;]+$/,'');
}
WIDGETS.term = {
  html: function(e){
    var h='<div id="w-term">';
    if(e.syn){
      h += '<div class="syn-panel"><h5>'+esc(e.syn.title)+'</h5><pre>'+esc(e.syn.lines.join('\n'))+'</pre>'+(e.syn.example?'<pre class="ex">Example on another target: '+esc(e.syn.example)+'</pre>':'')+'</div>';
    }
    h += '<div class="term"><div class="term-bar"><span class="tdot" style="background:var(--state-incorrect)"></span><span class="tdot" style="background:var(--state-partial)"></span><span class="tdot" style="background:var(--state-correct)"></span><span class="term-title">'+esc(e.termTitle||'soc-workstation &#8212; analysis shell (simulation only)')+'</span></div>';
    h += '<div class="term-out" id="term-out" aria-live="polite"></div>';
    h += '<div class="term-in"><span class="term-prompt">'+esc(e.prompt||'analyst@soc:~$')+'</span><input id="term-in" type="text" autocomplete="off" spellcheck="false" aria-label="Type your command"><button type="button" class="hbtn" id="term-run">&#9654; Run</button></div></div></div>';
    return h;
  },
  bind: function(e, idx){
    var st={ typed:null };
    S.picks[idx]=st;
    var out=$('term-out');
    var inp=$('term-in');
    function banner(){
      out.innerHTML += '<div style="color:var(--text-secondary)">'+esc(e.sim.banner||'Simulation shell. Nothing here touches a real system. Type the command and press Run.')+'</div>';
    }
    banner();
    function run(){
      var raw=inp.value;
      if(!raw.trim()){ return; }
      st.typed = raw;
      var nrm = normCmd(raw);
      out.innerHTML += '<div><span class="term-prompt">'+esc(e.prompt||'analyst@soc:~$')+'</span> '+esc(raw)+'</div>';
      var toks = nrm.split(' ');
      var sim=e.sim;
      if(sim && toks.length>0 && toks[0]===sim.tool){
        for(var i=0;i<sim.out.length;i++){ out.innerHTML += '<div>'+hlLine(sim.out[i])+'</div>'; }
      } else {
        out.innerHTML += '<div style="color:var(--state-incorrect)">'+esc((sim&&sim.notFound)||'command not found: '+toks[0])+'</div>';
      }
      out.scrollTop = out.scrollHeight;
      inp.value='';
    }
    $('term-run').addEventListener('click', run);
    inp.addEventListener('keydown', function(ev){ if(ev.key==='Enter'){ run(); } });
  },
  grade: function(e, idx){
    var st=S.picks[idx];
    if(!st.typed){ return { credit:0, items:[{ic:'&#9888;',cls:'it-missed',tx:'You did not run any command. Type a command in the shell, press Run, then Check.'}] }; }
    var nrm = normCmd(st.typed);
    var toks = nrm.split(' ');
    var dangerous=null;
    for(var dz=0; dz<(e.danger||[]).length; dz++){
      if(new RegExp(e.danger[dz].pat,'i').test(nrm)){ dangerous = e.danger[dz]; break; }
    }
    var H=0; var rows=[];
    var usedToks={};
    for(var el=0; el<e.elems.length; el++){
      var elem=e.elems[el];
      var ok=true;
      for(var t=0;t<elem.all.length;t++){
        var tt=elem.all[t].toLowerCase();
        var found=false;
        for(var k=0;k<toks.length;k++){
          if(toks[k]===tt){ found=true; usedToks[k]=true; }
        }
        if(!found){ ok=false; }
      }
      if(ok){ H++; rows.push({ic:'&#10004;',cls:'it-correct',tx:'&#10004; Correct — '+elem.label}); }
      else { rows.push({ic:'&#9675;',cls:'it-missed',tx:'&#9675; Missed — '+elem.label}); }
    }
    var W=0;
    for(var x=0;x<toks.length;x++){
      if(!usedToks[x] && (e.noise||[]).indexOf(toks[x])===-1 && toks[x]!==''){ W++; rows.push({ic:'&#10007;',cls:'it-wrong',tx:'&#10007; Wrong — extra token &#8220;'+esc(toks[x])+'&#8221; is not part of the expected command'}); }
    }
    var N=e.elems.length;
    var credit = dangerous ? 0 : scoreExercise(H,W,N);
    var g={ credit: credit, dangerous: !!dangerous,
      creditLine: 'Elements: '+H+' correct / '+W+' wrong of N='+N,
      items: rows };
    if(dangerous){ g.expl = 'You ran a command that matches a dangerous pattern: '+dangerous.why+' '+e.expl; }
    g.canonical = e.canonical;
    g.extraHTML = canonicalBlock(e.canonical);
    if(e.parts){
      g.extraHTML += '<div class="syn-panel"><h5>Command explained part by part</h5>';
      for(var p=0;p<e.parts.length;p++){ g.extraHTML += '<pre>'+esc(e.parts[p].t)+'  &#8212;  '+esc(e.parts[p].d)+'</pre>'; }
      g.extraHTML += '</div>';
    }
    return g;
  }
};

/* ==== branch (decision tree; auto-pause only on final decision) ==== */
WIDGETS.branch = {
  html: function(e){ return '<div id="w-branch"></div>'; },
  bind: function(e, idx){
    var st={ step:0, picks:[], locked:false };
    S.picks[idx]=st;
    render();
    function render(){
      var k=st.step;
      var step=e.steps[k];
      var h='<div class="dd-hintline">Decision '+(k+1)+' of '+e.steps.length+(k<e.steps.length-1?' — the timer keeps running while you work through the steps. Only the final decision is graded with Check.':' — this is the final decision. Press Check after you pick.')+'</div>';
      if(step.scn && step.scn.length){
        for(var s2=0;s2<step.scn.length;s2++){ h += '<p class="scn-intro">'+esc(step.scn[s2])+'</p>'; }
      }
      var oOrder = shuffle(step.opts.map(function(_,i){ return i; }));
      st.order=oOrder;
      for(var i=0;i<oOrder.length;i++){
        var oi=oOrder[i];
        h += '<button type="button" class="opt" data-oi="'+oi+'"><span class="olab">'+letters(i)+'.</span><span>'+esc(step.opts[oi].t)+'</span></button>';
      }
      h += '<div id="br-stepfb"></div>';
      $('w-branch').innerHTML=h;
      var btns=$('w-branch').querySelectorAll('.opt');
      for(var b=0;b<btns.length;b++){
        btns[b].addEventListener('click', function(ev){
          var el=ev.currentTarget;
          var oi=parseInt(el.getAttribute('data-oi'),10);
          var all=$('w-branch').querySelectorAll('.opt');
          for(var q=0;q<all.length;q++){ all[q].classList.remove('sel'); }
          el.classList.add('sel');
          st.cur=oi;
          var fb=$('br-stepfb');
          fb.innerHTML='<div class="item-row"><span class="it-ic '+(step.opts[oi].ok?'it-correct':'it-wrong')+'">'+(step.opts[oi].ok?'&#10004;':'&#10007;')+'</span><span class="it-tx">'+(step.opts[oi].ok?'Good call.':'That path has consequences.')+' '+esc(step.opts[oi].note)+'</span></div>';
          fb.innerHTML += '<div class="nav-row"><button type="button" class="hbtn '+(k===e.steps.length-1?'primary':'')+'" id="br-cont">'+(k===e.steps.length-1?'Check final answer':'Continue &#8594;')+'</button></div>';
          $('br-cont').addEventListener('click', function(){
            st.picks[k]=st.cur;
            if(k===e.steps.length-1){
              onCheck();
            } else {
              st.step++;
              render();
            }
          });
        });
      }
    }
  },
  grade: function(e, idx){
    var st=S.picks[idx];
    var N=e.steps.length,H=0,W=0; var rows=[];
    for(var i=0;i<N;i++){
      var pick=st.picks[i];
      if(pick===undefined){ return { credit:0, items:[{ic:'&#9888;',cls:'it-missed',tx:'Not all decisions were made.'}] }; }
      var opt=e.steps[i].opts[pick];
      if(opt.ok){ H++; rows.push({ic:'&#10004;',cls:'it-correct',tx:'&#10004; Decision '+(i+1)+' correct — '+opt.t}); }
      else { W++; rows.push({ic:'&#10007;',cls:'it-wrong',tx:'&#10007; Decision '+(i+1)+' wrong — you chose: '+opt.t+'. Right: '+e.steps[i].opts.filter(function(o){return o.ok;})[0].t}); }
    }
    return { credit: scoreExercise(H,W,N), creditLine: 'Decisions: '+H+' correct / '+W+' wrong of N='+N, items: rows };
  }
};

/* ==== triage (SOC alert queue, partial credit) ==== */
WIDGETS.triage = {
  html: function(e){ return '<div id="w-triage"><div class="dd-hintline">Choose one action for every alert. Correct and wrong picks count per alert (partial credit).</div></div>'; },
  bind: function(e, idx){
    var aOrder = shuffle(e.alerts.map(function(_,i){ return i; }));
    var st={ order:aOrder, sel: e.alerts.map(function(){ return null; }) };
    S.picks[idx]=st;
    var h='';
    for(var i=0;i<aOrder.length;i++){
      var ai=aOrder[i]; var al=e.alerts[ai];
      h += '<div class="tri-card"><div class="tri-title">&#128231; '+esc(al.t)+'</div><div class="tri-meta">'+esc(al.meta)+'</div><div class="tri-actions" data-ai="'+ai+'">';
      for(var a=0;a<e.actions.length;a++){
        h += '<button type="button" class="tri-act" data-aa="'+a+'">'+esc(e.actions[a].t)+'</button>';
      }
      h += '</div></div>';
    }
    $('w-triage').insertAdjacentHTML('beforeend', h);
    var acts=$('w-triage').querySelectorAll('.tri-act');
    for(var b=0;b<acts.length;b++){
      acts[b].addEventListener('click', function(ev){
        var el=ev.currentTarget;
        var wrap=el.parentNode;
        var ai=parseInt(wrap.getAttribute('data-ai'),10);
        var aa=parseInt(el.getAttribute('data-aa'),10);
        st.sel[ai]=aa;
        var btns=wrap.querySelectorAll('.tri-act');
        for(var q=0;q<btns.length;q++){ btns[q].classList.remove('sel'); }
        el.classList.add('sel');
      });
    }
  },
  grade: function(e, idx){
    var st=S.picks[idx];
    var H=0,W=0; var rows=[];
    for(var i=0;i<e.alerts.length;i++){
      var s=st.sel[i];
      var al=e.alerts[i];
      if(s===al.ok){ H++; rows.push({ic:'&#10004;',cls:'it-correct',tx:'&#10004; Correct — '+al.t+': '+e.actions[al.ok].t+'. '+al.why}); }
      else if(s!==null){ W++; rows.push({ic:'&#10007;',cls:'it-wrong',tx:'&#10007; Wrong — '+al.t+': you chose '+e.actions[s].t+'. Right: '+e.actions[al.ok].t+'. '+al.why}); }
      else { rows.push({ic:'&#9675;',cls:'it-missed',tx:'&#9675; Missed — '+al.t+': right action was '+e.actions[al.ok].t+'. '+al.why}); }
    }
    var N=e.alerts.length;
    return { credit: scoreExercise(H,W,N), creditLine: 'Alerts: '+H+' handled right / '+W+' wrong of N='+N, items: rows };
  }
};

/* ---------------- results + report ---------------- */
function showResults(){
  if(S._tick){ clearInterval(S._tick); S._tick=null; }
  setState('ENDED');
  $('exam').hidden = true;
  $('review').hidden = true;
  $('results').hidden = false;
  var full=0, part=0, wrong=0, skipped=0, partSum=0;
  for(var i=0;i<EX.length;i++){
    if(S.answered[i]){
      if(S.credit[i]>=0.999){ full++; }
      else if(S.credit[i]>0){ part++; partSum+=S.credit[i]; }
      else { wrong++; }
    } else { skipped++; }
  }
  var answered=full+part+wrong;
  var sum=creditSum();
  var pct = answered>0 ? Math.round((sum/answered)*100) : 0;
  var pass = pct>=70;
  var h='<div class="card" style="padding:20px">';
  h += '<h2 style="margin-top:0">Results &#8212; '+esc(window.EXAM_TITLE)+'</h2>';
  var vcls = pass ? 'res-verdict res-pass' : 'res-verdict res-fail';
  h += '<div class="'+vcls+'"><div class="v-big">'+(pass?'&#10004; PASS':'&#10007; FAIL')+'</div>';
  h += '<div style="font-family:var(--font-mono);font-size:22px;margin-top:6px;color:var(--text-primary)">'+fmt1(sum)+' / '+answered+' &#8212; '+pct+'%</div>';
  h += '<p>'+(pass?'You reached the 70% pass mark.':'You need at least 70% to pass. Press Retake Exam to try again with reshuffled exercises and options.')+'</p></div>';
  h += '<div class="res-grid">';
  h += '<div class="res-cell"><div class="r-l"><span class="it-correct">&#10004;</span> Fully correct</div><div class="r-v it-correct">'+full+'</div></div>';
  h += '<div class="res-cell"><div class="r-l"><span class="it-wrong" style="color:var(--state-partial)">&#10004;</span> Partially correct</div><div class="r-v" style="color:var(--state-partial)">'+part+(part>0?' <span style="font-size:14px">(avg '+fmt1(partSum/part)+')</span>':'')+'</div></div>';
  h += '<div class="res-cell"><div class="r-l"><span class="it-wrong">&#10007;</span> Fully incorrect</div><div class="r-v it-wrong">'+wrong+'</div></div>';
  h += '<div class="res-cell"><div class="r-l"><span class="it-missed">&#9888;</span> Skipped &#8212; excluded</div><div class="r-v it-missed">'+skipped+'</div></div>';
  h += '</div>';
  h += '<p class="time-note">&#9201; Manual pause total: '+fmtClock(S.manualSecs)+' &#183; Feedback review time (Check auto-pause): '+fmtClock(S.autoSecs)+' &#183; Time left when you finished: '+fmtClock(S.remaining)+'</p>';
  h += '<div class="nav-row"><button id="btn-retake" class="hbtn primary big">&#8635; Retake Exam</button></div></div>';
  $('results').innerHTML=h;
  $('btn-retake').addEventListener('click', function(){
    $('results').hidden=true;
    $('intro').hidden=false;
    window.scrollTo(0,0);
  });
  window.scrollTo(0,0);
  if(!S.reported){ S.reported=true; reportScore(sum, answered); }
}
function reportScore(creditSumF, answeredCountN){
  var percent = answeredCountN>0 ? Math.round((creditSumF/answeredCountN)*100) : 0;
  try {
    /* Strict same-origin targeting; opaque origins (file://, sandboxed iframes)
       serialise to the string "null", which is not a valid targetOrigin, so we
       fall back to "*" — event.origin still identifies the sender unambiguously. */
    var target = (location.origin && location.origin !== 'null' && location.origin !== 'file://') ? location.origin : '*';
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: window.EXAM_TOPIC,
      batch: window.EXAM_BATCH,
      score: Math.round(creditSumF),
      total: answeredCountN,
      percent: percent,
      passed: percent>=70
    }, target);
  } catch(e) { /* opened directly, nothing to report to */ }
}
/* handshake — accepted but the file is dark-only, theme never toggles anything */
window.addEventListener('message', function(event){
  if(!event.data){ return; }
  if(event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT'){ return; }
  /* merge semantics: only fields actually present in the handshake are applied,
     so a CYBERMASTERY_INIT without a username never wipes a previous identity */
  if('username' in event.data){ S.user.username = String(event.data.username || ''); }
  if('country' in event.data){ S.user.country = String(event.data.country || ''); }
  if('locale' in event.data){ S.user.locale = String(event.data.locale || 'en'); }
  renderHeader();
});
function boot(){
  document.body.classList.add(window.EXAM_BODY_CLASS);
  $('h-id').textContent = window.EXAM_ID;
  $('h-sevbadge').innerHTML = '<span class="badge badge-sev"><span class="dot"></span>'+window.EXAM_SEV_WORD+'</span>';
  $('btn-hint').addEventListener('click', onHint);
  $('btn-skip').addEventListener('click', onSkip);
  $('btn-pause').addEventListener('click', onPause);
  $('ov-resume').addEventListener('click', onResume);
  buildIntro();
  S._lastT = Date.now();
  S._tick = setInterval(tick, 1000);
  renderHeader();
}
document.addEventListener('DOMContentLoaded', boot);

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
