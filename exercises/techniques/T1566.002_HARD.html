<style>
:root{
  --bg-page:#0b1020; --bg-surface:#121a2e; --bg-surface-2:#0f1729;
  --border:#243049; --border-soft:#1c2740;
  --text-primary:#e6ecff; --text-secondary:#a9b4d0; --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff; --accent-amber:#ffb454; --accent-green:#57d38c;
  --state-correct:#57d38c; --state-partial:#ffb454; --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0; --state-paused:#9d7bff;
  --bg-log:#0a0f1e; --bg-term:#070b16; --tok-mail:#9dd6ff; --tok-id:#c9a7ff;
  --sev-easy:#57d38c; --sev-medium:#ffb454; --sev-hard:#ff8a3d; --sev-extreme:#ff6b6b;
  --sev:var(--sev-easy);
  --shadow:0 10px 24px rgba(0,0,0,.35);
  --radius:8px;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
html{color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-ui);font-size:16px;line-height:1.55;}
body.sev-easy{--sev:var(--sev-easy);}
body.sev-medium{--sev:var(--sev-medium);}
body.sev-hard{--sev:var(--sev-hard);}
body.sev-extreme{--sev:var(--sev-extreme);}
.wrap{max-width:1020px;margin:0 auto;padding:18px 16px 60px;}
a{color:var(--accent-blue);}
code,.mono{font-family:var(--font-mono);}
button{font-family:var(--font-ui);}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px;}
[hidden]{display:none !important;}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.4px;border:1px solid;}
.badge .dot{width:8px;height:8px;border-radius:50%;background:currentColor;}
.badge-sev{color:var(--sev);border-color:var(--sev);background:color-mix(in srgb,var(--sev) 12%,transparent);}
.badge-correct{color:var(--state-correct);border-color:var(--state-correct);background:color-mix(in srgb,var(--state-correct) 12%,transparent);}
.badge-partial{color:var(--state-partial);border-color:var(--state-partial);background:color-mix(in srgb,var(--state-partial) 12%,transparent);}
.badge-incorrect{color:var(--state-incorrect);border-color:var(--state-incorrect);background:color-mix(in srgb,var(--state-incorrect) 12%,transparent);}
.badge-skipped{color:var(--state-skipped);border-color:var(--state-skipped);background:color-mix(in srgb,var(--state-skipped) 10%,transparent);}
.badge-paused{color:var(--state-paused);border-color:var(--state-paused);background:color-mix(in srgb,var(--state-paused) 12%,transparent);}

/* ---------- header ---------- */
#hdr{position:sticky;top:0;z-index:40;background:var(--bg-surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow);}
#hdr .hrow{max-width:1020px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;}
#hdr .brand{font-weight:800;letter-spacing:.3px;font-size:15px;display:flex;align-items:center;gap:8px;}
#hdr .brand .cid{color:var(--accent-blue);font-family:var(--font-mono);}
#hdr .hitem{display:flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:14px;}
#hdr .hitem b{color:var(--text-primary);font-family:var(--font-mono);font-weight:700;}
#hdr .hspacer{flex:1;}
.hbtn{background:var(--bg-surface-2);border:1px solid var(--border);color:var(--text-primary);padding:9px 14px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;}
.hbtn:hover{border-color:var(--accent-blue);}
.hbtn:disabled{opacity:.45;cursor:not-allowed;}
.hbtn.primary{background:linear-gradient(135deg,color-mix(in srgb,var(--accent-green) 22%,var(--bg-surface-2)),var(--bg-surface-2));border-color:var(--accent-green);color:var(--accent-green);font-weight:800;}
.hbtn.big{font-size:16px;padding:12px 22px;}
#tstate-ind{font-size:13px;font-weight:700;}
.tst-running{color:var(--state-correct);}
.tst-paused{color:var(--state-paused);}
.tst-ended{color:var(--state-incorrect);}
#timer-txt{min-width:64px;text-align:right;}

/* ---------- progress ---------- */
#pbar-wrap{height:6px;background:var(--bg-surface-2);border-bottom:1px solid var(--border);overflow:hidden;}
#pbar{height:100%;width:0%;background:linear-gradient(90deg,var(--sev),color-mix(in srgb,var(--sev) 55%,transparent));position:relative;transition:width .4s ease;}
#pbar::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 2.8s linear infinite;}
@keyframes sheen{0%{transform:translateX(-100%);}60%,100%{transform:translateX(100%);}}

/* ---------- cards & blocks ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.block{margin:16px 0;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-surface);overflow:hidden;}
.block-h{display:flex;align-items:center;gap:8px;padding:9px 14px;font-weight:800;font-size:14px;letter-spacing:1.2px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bc) 10%,var(--bg-surface));}
.block-h .bh-ico{font-size:15px;}
.block-h .bh-txt{color:var(--bc);}
.block.scenario{--bc:var(--accent-blue);}
.block.question{--bc:var(--accent-amber);}
.block.answer{--bc:var(--accent-green);}
.block.scenario .block-h{border-left:4px solid var(--accent-blue);}
.block.question .block-h{border-left:4px solid var(--accent-amber);}
.block.answer .block-h{border-left:4px solid var(--accent-green);}
.block-b{padding:14px 16px;}
.scn-intro{margin:0 0 10px;color:var(--text-primary);}
.artefact{margin:10px 0;border:1px solid var(--border-soft);border-radius:6px;background:var(--bg-surface-2);}
.art-label{font-family:var(--font-mono);font-size:12px;color:var(--accent-blue);padding:6px 10px;border-bottom:1px solid var(--border-soft);letter-spacing:.6px;}
.art-note{padding:10px 12px;color:var(--text-secondary);font-size:14px;}
pre.mono{margin:0;padding:12px;font-family:var(--font-mono);font-size:14px;line-height:1.5;color:var(--text-mono);white-space:pre-wrap;word-break:break-word;background:var(--bg-surface-2);}
.q-text{margin:0;font-size:17px;font-weight:700;color:var(--text-primary);}
.step-chip{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:12px;background:color-mix(in srgb,var(--accent-amber) 15%,transparent);color:var(--accent-amber);border:1px solid var(--accent-amber);vertical-align:middle;}

/* collapsible scenario */
.scn-sum{display:flex;align-items:center;gap:8px;padding:8px 14px;color:var(--text-secondary);font-size:14px;border-bottom:1px dashed var(--border);}
.collapse-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text-secondary);border-radius:6px;padding:6px 10px;cursor:pointer;min-height:44px;font-size:13px;}
.collapse-btn:hover{color:var(--text-primary);border-color:var(--accent-blue);}

/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:12px 14px;margin:8px 0;cursor:pointer;color:var(--text-primary);font-size:15.5px;line-height:1.5;min-height:48px;}
.opt .olab{font-family:var(--font-mono);font-weight:800;color:var(--accent-blue);flex:0 0 auto;}
.opt:hover{background:color-mix(in srgb,var(--accent-blue) 8%,var(--bg-surface-2));border-color:var(--accent-blue);}
.opt.sel{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset,0 0 0 3px color-mix(in srgb,var(--accent-green) 18%,transparent);background:color-mix(in srgb,var(--accent-green) 9%,var(--bg-surface-2));}
.opt .osel-ind{margin-left:auto;color:var(--accent-green);font-weight:800;font-size:13px;white-space:nowrap;}
.opt.lock{cursor:default;}
.opt.right{border-color:var(--state-correct);}
.opt.wrong{border-color:var(--state-incorrect);}
.opt .mini-ic{font-weight:800;font-size:13px;white-space:nowrap;}

/* ---------- word bank / fill ---------- */
.blk-text{font-size:16px;color:var(--text-primary);line-height:1.8;}
select.blank{font-family:var(--font-mono);font-size:14px;background:var(--bg-surface-2);color:var(--text-mono);border:1px solid var(--border);border-radius:5px;padding:6px 8px;margin:0 3px;min-height:44px;}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.chip{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:999px;padding:7px 13px;font-family:var(--font-mono);font-size:13.5px;color:var(--text-mono);cursor:pointer;min-height:44px;}
.chip.sel{border-color:var(--accent-green);color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}

/* ---------- drag & drop ---------- */
.dd-wrap{display:grid;grid-template-columns:1fr 1.2fr;gap:14px;}
.dd-bank,.dd-zone{border:1px dashed var(--border);border-radius:8px;padding:10px;min-height:90px;background:var(--bg-surface-2);}
.dd-zone.hlit{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.dd-zt{font-size:13.5px;font-weight:800;color:var(--accent-blue);margin-bottom:8px;letter-spacing:.4px;}
.dd-item{display:flex;align-items:center;gap:8px;background:var(--bg-surface);border:1px solid var(--border);border-radius:6px;padding:9px 11px;margin:7px 0;font-size:14.5px;cursor:grab;color:var(--text-primary);}
.dd-item .rm{margin-left:auto;border:none;background:transparent;color:var(--state-incorrect);cursor:pointer;font-weight:800;font-size:14px;min-width:44px;min-height:44px;}
.dd-item.sel{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.dd-hintline{font-size:13px;color:var(--text-secondary);margin:4px 0 8px;}

/* ---------- order / rank ---------- */
.ord-list{list-style:none;margin:0;padding:0;}
.ord-item{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:8px 0;}
.ord-item .rk{font-family:var(--font-mono);font-weight:800;color:var(--accent-amber);min-width:30px;text-align:center;}
.ord-item .ot{flex:1;}
.ord-ctrls{display:flex;gap:6px;}
.ord-btn{border:1px solid var(--border);background:var(--bg-surface);color:var(--text-primary);border-radius:5px;min-width:44px;min-height:44px;cursor:pointer;font-size:15px;}
.ord-btn:hover{border-color:var(--accent-blue);}
.ord-item.dragover{border-color:var(--accent-green);}

/* ---------- match ---------- */
.mt-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
.mt-left{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:14.5px;}
.mt-left .mt-q{font-weight:700;}
.mt-slot{margin-top:8px;display:flex;align-items:center;gap:8px;}
.mt-drop{flex:1;border:1px dashed var(--border);border-radius:5px;padding:7px 10px;font-family:var(--font-mono);font-size:13px;color:var(--text-secondary);min-height:38px;background:var(--bg-surface);}
.mt-drop.hlit{border-color:var(--accent-green);}
.mt-drop .fillv{color:var(--text-mono);}
.mt-clear{border:none;background:transparent;color:var(--state-incorrect);font-weight:800;cursor:pointer;min-width:44px;min-height:44px;}

/* ---------- log viewer ---------- */
.logv{border:1px solid var(--border-soft);border-radius:6px;background:var(--bg-log);margin:8px 0;}
.logv-head{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border-soft);}
.logv-src{font-family:var(--font-mono);font-size:12.5px;color:var(--accent-blue);}
.logv-filter{margin-left:auto;flex:0 1 240px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:5px;color:var(--text-mono);font-family:var(--font-mono);font-size:13px;padding:7px 9px;min-height:44px;}
.logv pre{max-height:300px;overflow:auto;margin:0;padding:10px 12px;font-family:var(--font-mono);font-size:13.5px;line-height:1.55;color:var(--text-mono);}
.logv .ln{display:block;white-space:pre-wrap;word-break:break-word;}
.l-ts{color:var(--accent-amber);} .l-ip{color:var(--accent-blue);} .l-url{color:var(--accent-green);} .l-kw{color:var(--state-incorrect);font-weight:700;} .l-mail{color:var(--tok-mail);} .l-id{color:var(--tok-id);} .l-warn{color:var(--state-incorrect);}

/* ---------- terminal ---------- */
.term{background:var(--bg-term);border:1px solid var(--border-soft);border-radius:8px;font-family:var(--font-mono);font-size:14px;}
.term-bar{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border-soft);align-items:center;}
.tdot{width:10px;height:10px;border-radius:50%;}
.term-title{margin-left:8px;color:var(--text-secondary);font-size:12.5px;}
.term-out{padding:10px 12px;max-height:260px;overflow:auto;color:var(--text-mono);line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.term-in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border-soft);align-items:center;}
.term-prompt{color:var(--accent-green);font-weight:700;white-space:nowrap;}
.term-in input{flex:1;background:transparent;border:none;color:var(--text-mono);font-family:var(--font-mono);font-size:14px;padding:8px 2px;min-height:40px;}
.term-in input:focus-visible{outline:1px solid var(--accent-green);}
.syn-panel{border:1px solid var(--border-soft);border-left:4px solid var(--accent-blue);border-radius:6px;background:var(--bg-surface-2);padding:10px 12px;margin:10px 0;}
.syn-panel h5{margin:0 0 6px;font-size:13px;color:var(--accent-blue);letter-spacing:.5px;}
.syn-panel pre{margin:4px 0;font-family:var(--font-mono);font-size:13px;color:var(--text-mono);white-space:pre-wrap;}
.syn-panel .ex{color:var(--text-secondary);}

/* ---------- triage ---------- */
.tri-card{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin:10px 0;}
.tri-title{font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.tri-meta{color:var(--text-secondary);font-size:13.5px;margin-top:3px;font-family:var(--font-mono);}
.tri-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.tri-act{border:1px solid var(--border);background:var(--bg-surface);color:var(--text-primary);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:13.5px;min-height:40px;}
.tri-act.sel{border-color:var(--accent-green);color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.tri-act.sel-tri{border-color:var(--accent-amber);color:var(--accent-amber);}

/* ---------- feedback ---------- */
#fbk{margin:16px 0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
#fbk .fb-h{display:flex;align-items:center;gap:10px;padding:10px 14px;font-weight:800;letter-spacing:.8px;border-bottom:1px solid var(--border);}
.fb-correct{background:color-mix(in srgb,var(--state-correct) 12%,var(--bg-surface));color:var(--state-correct);}
.fb-partial{background:color-mix(in srgb,var(--state-partial) 12%,var(--bg-surface));color:var(--state-partial);}
.fb-incorrect{background:color-mix(in srgb,var(--state-incorrect) 12%,var(--bg-surface));color:var(--state-incorrect);}
.fb-danger{background:color-mix(in srgb,var(--state-incorrect) 18%,var(--bg-surface));color:var(--state-incorrect);}
#fbk .fb-b{padding:14px 16px;}
.item-row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border-soft);border-radius:6px;margin:7px 0;background:var(--bg-surface-2);font-size:14.5px;}
.it-correct{color:var(--state-correct);} .it-wrong{color:var(--state-incorrect);} .it-missed{color:var(--state-skipped);}
.item-row .it-ic{font-weight:800;flex:0 0 auto;}
.item-row .it-tx{color:var(--text-primary);}
.credit-line{font-family:var(--font-mono);font-weight:700;margin-top:6px;}
.study-line{margin-top:10px;padding:9px 12px;border-left:4px solid var(--accent-amber);background:color-mix(in srgb,var(--accent-amber) 8%,transparent);border-radius:0 6px 6px 0;color:var(--text-primary);font-size:14.5px;}
.canon{border:1px solid var(--border-soft);border-radius:6px;background:var(--bg-surface-2);margin:10px 0;}
.canon .canon-h{display:flex;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border-soft);font-family:var(--font-mono);font-size:12.5px;color:var(--accent-green);}
.copy-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text-secondary);border-radius:5px;padding:4px 10px;cursor:pointer;font-size:12px;min-height:44px;}
.copy-btn:hover{color:var(--text-primary);border-color:var(--accent-green);}

/* ---------- nav ---------- */
.nav-row{display:flex;gap:10px;align-items:center;margin:18px 0;}
.nav-note{color:var(--text-secondary);font-size:13.5px;margin-left:auto;}

/* ---------- hint ---------- */
#hint-panel{margin:12px 0;border:1px solid var(--accent-amber);border-left:4px solid var(--accent-amber);border-radius:0 6px 6px 0;background:color-mix(in srgb,var(--accent-amber) 8%,transparent);padding:10px 14px;color:var(--text-primary);font-size:14.5px;}
#hint-panel .hp-h{color:var(--accent-amber);font-weight:800;font-size:13px;letter-spacing:.6px;margin-bottom:4px;}

/* ---------- overlay / pause ---------- */
#overlay{position:fixed;inset:0;background:rgba(5,8,18,.92);z-index:80;display:flex;align-items:center;justify-content:center;}
.ov-card{max-width:460px;margin:20px;text-align:center;padding:30px;border:1px solid var(--state-paused);border-radius:10px;background:var(--bg-surface);box-shadow:var(--shadow);}
.ov-card .ov-ic{font-size:34px;color:var(--state-paused);}
.ov-card h2{color:var(--state-paused);margin:10px 0 6px;}
.ov-card p{color:var(--text-secondary);}

/* ---------- intro ---------- */
.intro-head{padding:18px 20px;}
.intro-title{font-size:24px;font-weight:900;margin:0 0 4px;color:var(--text-primary);}
.intro-sub{color:var(--text-secondary);font-size:15px;margin:0 0 12px;}
.fact-row{display:flex;flex-wrap:wrap;gap:10px;}
.fact{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:10px 14px;min-width:150px;}
.fact .f-l{font-size:12px;color:var(--text-secondary);letter-spacing:.8px;text-transform:uppercase;}
.fact .f-v{font-size:17px;font-weight:800;color:var(--text-primary);font-family:var(--font-mono);}
.kw-theme{border:1px solid var(--border-soft);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin:10px 0;}
.kw-theme h4{margin:0 0 8px;color:var(--accent-blue);font-size:14px;letter-spacing:.5px;}
.kw-list{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none;}
.kw-list li{border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--text-mono);font-family:var(--font-mono);background:var(--bg-surface);}
.how-list{margin:8px 0 0;padding-left:20px;color:var(--text-primary);}
.how-list li{margin:8px 0;}
.learn-p{color:var(--text-primary);}
.role-tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.role-tag{border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--accent-green);background:var(--bg-surface-2);}

/* ---------- review ---------- */
.rv-list{list-style:none;margin:0;padding:0;}
.rv-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin:9px 0;background:var(--bg-surface-2);}
.rv-row .rv-t{flex:1;}
.rv-row .rv-s{font-size:13px;color:var(--text-secondary);}

/* ---------- results ---------- */
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0;}
.res-cell{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:14px;}

window.EXAM_INTRO={"title":"T1566.002 — HARD practice exam","subline":"Advanced certification exam: near-miss answers, conflicting artefacts, and senior-level discrimination on Spearphishing Link.","obj":"T1566.002 — Spearphishing Link","learn":["This exam works the sharp edges of <b>T1566.002 — Phishing: Spearphishing Link</b> (Sub-Technique of <b>T1566 Phishing</b>, tactic <b>Initial Access</b>, TA0001). By now you can recognise the behaviour. Here the scenarios carry <b>two to four artefacts each</b>, plausible short-croutes that lead to wrong answers, and traps: things that look alarming but are benign, things that look benign but are alarming, and moments where the least aggressive action is the correct one.","You will practise the artefacts a senior analyst really correlates: mail-gateway delivery and rewrite records, web-proxy sessions with <b>POST to login paths</b>, DNS answers for <b>newly registered and lookalike domains</b>, EDR process trees after the click, and sandbox verdicts. You will meet the URL obfuscation tricks the ATT&amp;CK description documents — <b>IDN homograph</b> lookalikes and <b>schema quirks</b> like text before an @ sign — where the domain you see is not the domain you get.","You will also weigh <b>attribution</b>: ATT&amp;CK documents groups behind this sub-technique with very different signatures — Leviathan with fraudulent lookalike domains and stolen branding, APT29 with links to zip archives, Storm-1811 funnelling to EvilProxy credential pages, Lazarus with OneDrive links in Operation Dream Job. Attribution is a confidence statement, never a slogan. And you will build <b>detections</b> that survive URL rewriting (Safe Links-style services) instead of drowning in tracker noise.","The roles on stage: senior SOC analyst, incident responder, detection engineer, CTI analyst, and red/blue pair. Every exercise asks you to justify, not recall. Read the artefacts in order, decide what you actually know, and pick the defensible answer."],"roles":["Senior SOC analyst","Incident responder","Detection engineer","CTI analyst","Red team operator","Blue team lead"],"kw":[{"theme":"Object identity & neighbours","items":["T1566.002 vs T1566.001/.003/.004","Revoked predecessor ID T1192","Initial Access TA0001","User Execution T1204 chain"]},{"theme":"URL obfuscation (from the ATT&CK description)","items":["IDN homograph / Punycode lookalikes","Integer and hex hostnames","Text before '@' is discarded","URL shorteners as campaign tools"]},{"theme":"Artefact correlation","items":["Mail rewrite + detonation records","Proxy GET/POST on login paths","DNS: newly registered domains","EDR child processes from the browser","Sandbox verdicts"]},{"theme":"Detection engineering","items":["Mail+proxy join by user/time","Rewrite-aware rules","Tracker False positives","Allowlist wildcard dangers"]},{"theme":"Attribution discipline","items":["Leviathan — lookalike domain + stolen branding","APT29 — link to zip archives","Storm-1811 — EvilProxy AITM","Lazarus — OneDrive links, Operation Dream Job","Confidence levels & collection tasks"]},{"theme":"Response judgement","items":["Least-aggressive containment","Evidence preservation order","Duplicate/retracted alert handling","Justified vs over-reaction"]}],"how":["<b>Pass mark: 70%.</b> Computed only over exercises you answered; skipped-and-unanswered ones are excluded from both the score and the total.","<b>Exercise types in this file:</b> multi-artefact log reading, single and multiple choice, a branching red/blue scenario, a terminal pipeline, matching, ordering, ranking, triage with duplicates, and fill-in-the-blank analysis.","<b>Timer: 70 minutes.</b> Pause hides the exercise for a real break. <b>Check</b> stops the timer automatically (PAUSED — reviewing feedback) until <b>Next</b> — spend that time on the item-by-item explanation.","<b>Partial credit:</b> multi-item exercises score max(0, (correct &#8722; wrong) / items). At this level, wrong picks usually look technically defensible — read them twice. One hint per exercise costs 10% of that exercise&#8217;s credit and only removes one wrong path.","<b>Skip and review:</b> skipped exercises wait in the review pool while the timer runs; unanswered skips are excluded at submit.","Press <b>Start</b> — and trust the artefacts, not the ticket title."]};
window.EXAMS=[{"id":"H01","type":"logq","title":"The ticket says macro","summary":"Ticket vs artefacts — which sub-technique really ran?","scenario":[{"label":"Incident ticket #1123 (opened by L1)","kind":"note","text":"Title: macro malware on finance laptop. Body: user says 'I clicked something in an email about invoices'. Machine not isolated. Requesting malware analysis."},{"label":"Mail gateway record","kind":"log","src":"mailgw.log","lines":["2026-10-23T07:41:55Z to=m.tanaka@corp[.]example subj=\"Unpaid invoices - Oct\" url=hxxps://invoices-copy[.]example-id-2044[.]net/dl attach=none action=deliver banner=external-sender"]},{"label":"Web proxy + EDR (same host)","kind":"log","src":"proxy.log + edr.log","lines":["2026-10-23T07:44:02Z user=m.tanaka GET hxxps://invoices-copy[.]example-id-2044[.]net/dl status=200 bytes=28411 content=application/zip","2026-10-23T07:44:40Z edr chrome.exe spawned powershell.exe -nop -w hidden -enc SQBFAFgA... parent_image=C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"]}],"question":"The ticket title blames a macro. Based on the artefacts, which ATT&CK mapping is actually defensible for the INITIAL access step?","hint":"Ask what crossed the mail boundary: a file, or a web address? And what did the browser do next?","expl":"The mail record shows attach=none and a URL; the proxy shows the browser downloading a zip and EDR shows the browser spawning PowerShell — that is the classic link-delivery chain. Initial access is therefore T1566.002; the macro story never touches the mail path. T1566.001 needs an attached file (there is none), T1204.002 describes the user-execution step after the click rather than the access step, and T1190 attacks a public server. The obvious ticket title is the trap: L1 wrote 'macro' because users say 'macro' for everything.","study":"When the ticket title and the artefacts disagree, the artefacts win — and you correct the title in the first five minutes.","logs":[],"aw":{"kind":"qcm","opts":["T1566.002 — the mail carried a link, the browser fetched the payload, and the chain is visible in proxy+EDR","T1566.001 — the email carried a macro document that the user opened","T1204.002 — a malicious file was attached and executed by the user","T1190 — the attacker exploited the public mail server directly"],"correct":0}},{"id":"H02","type":"qcm","title":"Alarming at 03:14","summary":"A click that looks like a breach — and is not","scenario":[{"label":"Proxy record, 03:14 local","kind":"log","src":"proxy.log","lines":["2026-10-24T03:14:09Z user=p.novak GET hxxps://t[.]dripemail[.]example-id-2[.]com/c/9812/track status=302 -> hxxps://shop[.]trusted-retailer[.]example/order/441291","2026-10-24T03:14:11Z user=p.novak GET hxxps://shop[.]trusted-retailer[.]example/order/441291 status=200 category=shopping"]},{"label":"Context from the mail platform","kind":"note","text":"p.novak signed up for the retailer's newsletter in June. The 03:14 click follows an order-confirmation mail the platform delivered at 03:12 (scheduled batch). The redirector t[.]dripemail[.]example-id-2[.]com is a mass-mailing tracker present on 900+ corporate mailboxes daily. No POST, no file download, domain categorised shopping/marketing."}],"question":"The pager is screaming: 'odd-hour click through unknown redirector'. What is the correct disposition?","hint":"Follow the redirect to its end and ask what the user could have lost there.","expl":"The chain ends at the retailer's genuine order page: a newsletter tracker 302-redirecting a scheduled confirmation click. Odd hours happen when batch mail lands at night; the tracker is on every mailbox; nothing was submitted and nothing downloaded. Escalating would burn IR hours during real campaigns, and blocking all redirectors breaks marketing mail. The alarming shape hides a benign story — that discrimination is the job.","study":"Disposition rule: chase the redirect to its final destination before judging the first hop.","opts":["Close as benign tracker behaviour — document the redirect chain as evidence","Escalate to IR — odd-hour clicks through unknown domains are breaches until proven otherwise","Block t[.]dripemail[.]example-id-2[.]com and all similar redirectors for the whole company","Ask the user to explain the click under HR supervision"],"correct":0},{"id":"H03","type":"qcm","title":"The certificate is valid","summary":"Two clean-looking URLs — the trap is in the encoding","scenario":[{"label":"Proxy record","kind":"log","src":"proxy.log","lines":["2026-10-25T10:02:17Z user=r.almeida GET hxxps://login[.]micros0ft-support[.]com/verify status=200 certificate=valid (Let's Encrypt, 4 days old)","2026-10-25T10:02:30Z user=r.almeida GET hxxp://portal[.]example-id-77[.]net@198[.]51[.]100[.]23/fetch status=200"]},{"label":"DNS record","kind":"log","src":"dns.log","lines":["2026-10-25T10:02:15Z query xn--micrsoft-2we[.]com answer=203[.]0[.]113[.]77 ttl=300","2026-10-25T10:02:28Z query portal[.]example-id-77[.]net answer=198[.]51[.]100[.]23 ttl=300"]}],"question":"Both pages rendered fine and one certificate is valid. Select the correct read of these two URLs.","hint":"In the first URL, one character in the brand name is not what it seems. In the second, everything before the @ is decoration — the browser connects to what follows it.","expl":"login.micros0ft-support.com is a typosquat (zero instead of an 'o') and the DNS line shows the underlying IDN homograph xn--micrsoft-2we.com — both are documented lookalike tricks. The second URL uses the schema quirk ATT&CK's description names: text before an @ is discarded, so the browser actually connects to 198[.]51[.]100[.]23, not to portal.example-id-77.net. A valid certificate proves only that the visitor reached the registered site — Let's Encrypt issues certificates to attackers for free. Both are credential-harvest setups.","study":"Two habits: decode Punycode (xn--) on sight, and remember everything before @ in a URL is decoration.","opts":["Both use documented URL obfuscation tricks — a typosquat/homograph and an @-host override — and both deserve phishing treatment","The @ part is just a username parameter and the rest is a normal portal","Punycode labels are normal in Europe, so the first URL is internal traffic","A valid TLS certificate proves the site belongs to the real brand"],"correct":0},{"id":"H04","type":"term","title":"Count the recipients","summary":"One pipeline over the mail log: who got the campaign, sorted and counted","scenario":[{"label":"Campaign domain","kind":"note","text":"Campaign domain: bonus-update[.]example-id-9410[.]com. The mail log is mailgw.log in your home directory. GNU text tools are available: grep, awk, sed, sort, uniq, cut. The log is large; you need recipients per message, deduplicated, with counts."},{"label":"mailgw.log shape","kind":"log","src":"mailgw.log (excerpt)","lines":["2026-10-26T09:00:01Z from=hr@vendor-benefits[.]example to=c.wu@corp[.]example subj=\"Bonus update\" url=hxxps://bonus-update[.]example-id-9410[.]com/claim action=deliver","2026-10-26T09:00:04Z from=hr@vendor-benefits[.]example to=j.brant@corp[.]example subj=\"Bonus update\" url=hxxps://bonus-update[.]example-id-9410[.]com/claim action=deliver","2026-10-26T09:00:01Z from=payroll@corp[.]example to=c.wu@corp[.]example subj=\"Payslip Oct\" url=hxxps://intranet[.]corp action=deliver"]}],"question":"Build one read-only pipeline that prints, for messages containing the campaign domain, every to= recipient — sorted, with duplicate counts.","hint":"You need two greps (one for the domain, one to cut the field), then the standard sort-and-count pair.","expl":"The first grep keeps only campaign lines; the second grep -oE \"to=[a-z.@]*\" lifts just the recipient field; sort groups equal addresses so uniq -c can count them. The payslip line shows why filtering by domain first matters — a plain 'grep to=' would count unrelated mail. Read-only at every stage: nothing in the pipeline writes or deletes anything.","study":"The sort | uniq -c pair is the standard 'how many of what' tool in any shell-based triage.","termTitle":"soc-workstation — mail analysis shell (simulation only)","prompt":"analyst@soc:~$","sim":{"tool":"grep","banner":"Simulation shell. mailgw.log is simulated; pipelines print realistic output.","notFound":"command not found — this shell offers: grep, awk, sed, sort, uniq, cut","out":["     12 to=c.wu@corp[.]example","      9 to=j.brant@corp[.]example","      4 to=l.dias@corp[.]example","      1 to=n.eri@corp[.]example"]},"elems":[{"label":"first stage: grep filtered on the campaign domain","all":["grep","bonus-update[.]example-id-9410[.]com"]},{"label":"second stage: grep -oE lifting the to= field","all":["grep","-oe","to=[a-z.@]*"]},{"label":"sort stage to group equal recipients","all":["sort"]},{"label":"uniq -c stage to count duplicates","all":["uniq","-c"]}],"noise":["|","mailgw.log"],"danger":[{"pat":"rm |shred|>|mv |chmod","why":"The mail log is evidence; redirecting or deleting it would destroy the campaign record."}],"canonical":"grep \"bonus-update[.]example-id-9410[.]com\" mailgw.log | grep -oE \"to=[a-z.@]*\" | sort | uniq -c","parts":[{"t":"grep \"bonus-update[.]example-id-9410[.]com\" mailgw.log","d":"keep only lines that carry the campaign domain"},{"t":"grep -oE \"to=[a-z.@]*\"","d":"from each kept line, print only the to=<recipient> field"},{"t":"sort","d":"group identical recipients next to each other"},{"t":"uniq -c","d":"collapse duplicates and prefix each with its count"}]},{"id":"H05","type":"qcm","title":"Attribution, if you must","summary":"Lookalike domain + stolen branding — name the actor and the confidence","scenario":[{"label":"Campaign overview","kind":"note","text":"Targets: a South-East Asian maritime-logistics firm. Delivery: emails carrying links to a fraudulent lookalike domain of the firm's freight portal; pages reuse the firm's stolen logo and formatting. Links lead to a credential page, and one week later to a hosted archive on a cloud drive."},{"label":"ATT&CK procedure notes (excerpt)","kind":"code","text":"G0065 Leviathan  : spearphishing emails with links, often using a\n                   fraudulent lookalike domain and stolen branding.\nG0016 APT29       : spearphishing with a link to a zip file containing\n                   malicious files.\nG0032 Lazarus     : malicious OneDrive links with fictitious job offers\n                   (Operation Dream Job).\nG0112 Windshift   : links to harvest credentials and deliver malware."}],"question":"Which attribution statement is the defensible one for the briefing?","hint":"Two actors match pieces; the note whose whole signature is lookalike domain plus stolen branding — in the right region — matches best.","expl":"Leviathan's documented signature — fraudulent lookalike domains plus stolen branding — matches the campaign's central feature, and the group's regional profile fits a South-East Asian maritime target, so moderate-confidence Leviathan is the honest call. APT29 shares only the link-to-archive step; Lazarus shares only the cloud-drive link; Windshift shares the credential-harvest goal. Naming those instead would import targeting and infrastructure claims you cannot support. Every attribution should end with what would raise confidence: registrar records, staging-domain overlap, and time-zone patterns.","study":"Attribution is a range, not a label: match the whole signature, state the confidence, list the collection tasks.","opts":["Leviathan, moderate confidence — the lookalike-domain-plus-stolen-branding signature and the regional targeting align; collect registrant and staging data to firm it up","APT29, high confidence — the link to a hosted archive is their documented move","Lazarus, high confidence — OneDrive links in a job-themed campaign are their hallmark","Windshift, high confidence — any credential-harvesting link in this region is theirs"],"correct":0},{"id":"H06","type":"multi","title":"Make the rule rewrite-proof","summary":"Two changes that survive Safe Links rewriting","scenario":[{"label":"Current environment","kind":"note","text":"The mail gateway rewrites all URLs into protect[.]gateway-a[.]example-id-5[.]net/u/?q=<encoded>. User clicks therefore hit the gateway first, then the real destination. A new SIEM rule alerts on every rewritten URL and pages the on-call 60 times a day — all marketing trackers."},{"label":"Desired outcome","kind":"note","text":"Detection should fire on clicks that end at suspicious destinations, not on every rewritten hop, and should keep working when a second gateway (different rewrite format) is added next quarter."}],"question":"Select the two engineering changes that actually achieve the desired outcome.","hint":"One change joins events instead of matching text; the other resolves the rewritten URL to its True destination before judging.","expl":"Joining the mail-gateway click event with the proxy connection that follows (same user, small time window) fires on the chain, not on the text — so it survives any rewrite format. And decoding/redirect-resolving the rewrite parameter in the sandbox gives you the True destination to judge against reputation. Alerting on every rewritten URL is exactly the noise they already have; dropping proxy logs blinds you; POST-only misses credential GETs and page fetches. This is DET0107 thinking: correlate stages, normalise the view.","study":"Rewrite-proof rule of thumb: never match the wrapper — match the chain and the resolved destination.","opts":["Correlate the mail-gateway click event with the following proxy connection by user and time window","Resolve the rewritten URL (decode the parameter or follow redirects in detonation) and judge the final destination","Alert on every rewritten URL, since attackers also use rewrites","Drop proxy logs from the use case, since rewrites hide the destination","Restrict the rule to POST requests only, to cut the volume"],"correct":[0,1],"why":{"2":"That is the current rule — it is the source of the 60 daily False positives, not the fix.","3":"Without the proxy you lose the only ground truth of where the click really went.","4":"Credential pages are fetched with GET; POST-only rules miss the page and still drown in form traffic."}},{"id":"H07","type":"branch","title":"Red takes, blue answers","summary":"Branching dual-perspective: harvest, use, persist","scenario":["One scenario, two hats. Steps 1 is red (authorised engagement), steps 2 and 3 are blue. The host you see belongs to a regional sales manager; their password was captured through a link to a perfect clone of the SSO portal, MFA push included."],"question":"Three decisions, in order — one hat at a time.","hint":"Red: which action stays under the noise floor? Blue: remove the way in, then the persistence — in that order.","expl":"Red operators replay the password against the real SSO through a residential proxy to blend in — spraying it around multiplies lockouts and alerts. Blue's first move is revoking sessions and forcing re-auth, which kills the live access even if tokens exist. And when the attacker has enrolled their own MFA device, resetting the password alone leaves that door open — the rogue MFA method must be removed and IdP admins alerted. Order matters: way in first, persistence second, paperwork last.","steps":[{"scn":["STEP 1 — RED: the captured password works on the real SSO. Your operator has a residential-proxy pool and the target's username."],"opts":[{"t":"Replay the password against the real SSO from the residential proxy, mimicking the user's browser","ok":true,"note":"Blends with normal logins; one factor bypassed quietly instead of a spray that trips lockout policies."},{"t":"Spray the password across mail, VPN and finance portals the same hour","ok":false,"note":"Multiple failed logins across services generate lockouts and a unified audit trail."},{"t":"Send 500 more phishing emails to cover the login noise","ok":false,"note":"Volume raises the base rate of reports; defenders correlate campaigns faster than logins."}]},{"scn":["STEP 2 — BLUE: the proxy shows a successful SSO sign-in for the manager from a residential ASN, nine minutes after the click. The user is on a call and confirms: 'yes, I logged in after the email'."],"opts":[{"t":"Revoke all sessions and force re-authentication, then hunt for other sign-ins from that ASN","ok":true,"note":"Kills the live access immediately; the hunt scopes whether other identities were touched."},{"t":"Wipe and reimage the laptop first","ok":false,"note":"The compromise is in the identity plane, not on disk; reimaging costs hours and fixes nothing."},{"t":"Wait for the second factor to fail — MFA will stop them","ok":false,"note":"The MFA push was already proxied and approved by the user; the second factor is not standing in the way."}]},{"scn":["STEP 3 — BLUE: while resetting, you find a new MFA method registered to the account two hours after the click — an authenticator you do not recognise."],"opts":[{"t":"Remove the rogue MFA method, disable the account's sessions again, and alert the IdP admin team","ok":true,"note":"Removes the attacker's persistence in the identity plane — the thing a password reset alone leaves behind."},{"t":"Reset the password once more and close the ticket","ok":false,"note":"The rogue MFA method survives a password reset — the attacker keeps their way back in."},{"t":"Ask the user to uninstall the authenticator app themselves","ok":false,"note":"The user cannot see IdP-registered methods, and self-service cleanup of an active intrusion is not a control."}]}]},{"id":"H08","type":"qcm","title":"The blocklist that breaks the business","summary":"Least-aggressive control after a DarkGate-style link campaign","scenario":[{"label":"The campaign","kind":"note","text":"A DarkGate-style campaign reached the company through Teams messages and mail links to freshly registered domains serving VBS/MSI downloads. Two users clicked; EDR blocked the installer on one and quarantined it on the other."},{"label":"The proposal on the table","kind":"note","text":"Proposal A: block every URL-shortener and file-sharing category org-wide. Proposal B: keep shorteners and file-sharing open but force detonation of newly-registered domains, block the campaign domains, and keep the EDR download-block policy. Marketing runs paid campaigns through two of the shortener platforms; sales engineering shares demo builds through the same file-sharing category."},{"label":"The pain data","kind":"note","text":"Last quarter a full block of the file-sharing category was rolled back after 31 support tickets in four days and a lost demo week for the sales engineering team."}],"question":"Which proposal is the defensible one, and why?","hint":"Last quarter's rollback is not an anecdote — it is data about what the business will actually bear.","expl":"Proposal B keeps the pressure on the actual technique — newly registered domains are the campaign's road — while detonation and EDR catch the payload, and the business keeps functioning. Proposal A repeats the move that already failed: broad category blocks break real work, get rolled back, and leave the team worse off. Doing nothing ignores two clicks and a working delivery chain. The least aggressive option that still removes the road is the senior answer, and it is also the one that survives the next steering meeting.","study":"Control design: target the attacker's specific road (new domains), not a category the business depends on.","opts":["Proposal B — target newly-registered domains with detonation and block the campaign IOCs, keeping shorteners and file-sharing with logging","Proposal A — block all shortener and file-sharing categories org-wide; the campaign used them, so they must go","No change — EDR blocked the payloads, so the delivery channel needs no attention","Proposal A for 30 days as a shock measure, then re-evaluate"],"correct":0},{"id":"H09","type":"drag","title":"Coverage map, honestly drawn","summary":"Four behaviours — covered or gap?","scenario":[{"label":"Current detection estate","kind":"note","text":"In place: mail-gateway click log joined with proxy connections (mail links in body); attachment sandbox + AV on mail; mail telemetry only for the corporate tenant; proxy applies to managed browsers via PAC file."},{"label":"The four behaviours to assess","kind":"note","text":"1) Link pasted directly in the mail body. 2) Link inside a shared cloud-drive page, opened from personal webmail in a managed browser — proxy sees only the drive domain. 3) Attachment variant .001 arriving by mail. 4) Link delivered through a workplace chat service (the .003 via-service sibling), which never touches mail telemetry."}],"question":"Drag each behaviour to the honest assessment of the current estate.","hint":"For each behaviour ask: which sensor would see it, and is that sensor joined into a rule?","expl":"Body links are exactly what the mail+proxy join covers. The cloud-drive page opened from personal webmail breaks the join: the mail event never exists in corporate telemetry, and the proxy only ever sees the big drive domain — that is a gap. The attachment variant is covered by the sandbox+AV pair. And a chat-delivered link is the T1566.003 pattern; with mail-only telemetry the whole variant is invisible. Honest coverage maps are how detection roadmaps get funded.","study":"For every variant, trace the sensor path end to end; a variant is 'covered' only where the chain is actually joined.","zones":[{"t":"Covered by the current estate"},{"t":"Uncovered gap — needs new telemetry or a new rule"}],"items":[{"t":"Link in the mail body, clicked in the managed browser","z":0},{"t":"Cloud-drive link opened from personal webmail — proxy sees only the drive domain","z":1},{"t":"Malicious attachment arriving by corporate mail","z":0},{"t":"Link delivered through a workplace chat service (T1566.003 pattern)","z":1}]},{"id":"H10","type":"rank","title":"Evidence before it evaporates","summary":"Rank five actions by how fast the evidence decays","scenario":["A campaign email used a shortened link; the click already happened. Five actions compete now. Two clocks are ticking: the proxy keeps only 14 days of session detail, and the user's mailbox auto-purges external mail after 30 days (the user tends to clean up inboxes weekly)."],"question":"Rank the actions from most time-critical (rank 1) to least (rank 5).","hint":"Rank by decay speed: which two artefacts die on their own timers first?","expl":"The proxy session detail has the shortest clock — export it first or the correlation window is gone. The mailbox copy is next: the user's own cleanup can destroy the primary artefact, so preserve the original with headers before any purge or user action. Detonating the resolved URL, sweeping other mailboxes, and writing the ticket follow — they depend on the first two, not on any external clock. Ranking by decay, not by habit, is what preserves a case.","study":"Ask of every artefact: what timer kills it? Rank by that timer, not by the org chart.","items":["Export the full proxy session detail for the click window","Preserve the original email with full headers before any purge or user cleanup","Detonate the resolved URL from a safe egress point","Enumerate other mailboxes holding the same message","Update the incident ticket with the timeline and IOCs"]},{"id":"H11","type":"fill","title":"The wildcard that helps the attacker","summary":"Find the two flaws in the proxy allowlist entry","scenario":[{"label":"Proxy allowlist (submitted for review)","kind":"code","text":"# Vendor SSO exemption requested by IT\nallow url_suffix=\".sso-portal[.]example-id-300[.]net\"\n# rationale: vendor says 'our domains may change weekly'"},{"label":"Whois on the base domain","kind":"note","text":"sso-portal[.]example-id-300[.]net registered 11 months ago, standard 1-year term, registrar with automated transfers. No mention in the vendor contract of subdomain control or renewal guarantees."}],"question":"Complete the review finding with the two blanks.","hint":"First ask what the wildcard actually matches. Then ask what happens to the base domain in one month.","expl":"A suffix rule with a leading dot matches every subdomain under that name — today the vendor's, tomorrow anyone the vendor's DNS points to, including a compromised or newly-created host. And the base domain itself sits on a one-year registration: if it lapses or is transferred, whoever registers it next inherits the allowlist exemption. Two independent flaws, both standard review findings — and both reasons vendor exemptions need expiry dates and exact-host entries.","study":"Allowlist review checklist: exact hosts over wildcards, and a renewal/expiry story for every exempted domain.","template":"The exemption is dangerous because the wildcard matches {0}, and because the base domain {1}.","bank":["every subdomain under that name","only one exact host","expires and can be re-registered by someone else","can never change ownership"],"correct":[0,2]},{"id":"H12","type":"triage","title":"Queue with duplicates and noise","summary":"Five alerts — duplicates, retractions, and one real chain","scenario":["09:20 on a campaign morning. Five alerts are open. The mail gateway, proxy and EDR all feed the queue; a vendor feed also pushes automatic alerts. One of these five is the real T1566.002 chain; the rest are duplicates, noise, or retractions. Choose the action for each."],"question":"Choose the correct action for every alert.","hint":"Duplicates share a session or event ID. Retractions quote the vendor. The real chain has delivery, click, and a submission.","expl":"AL-5501 is the full chain — deliver, click, POST to the lookalike — escalate. AL-5502 quotes the same proxy session ID, so it is a duplicate of the first, not a second incident. AL-5503 is the vendor's retraction: the domain turned out to be a shared CDN host, and re-alerting on it wastes the shift. AL-5504 is the VPN handshake noise — a different technique family entirely, nothing to do with mail links. AL-5505 is the missing piece of AL-5501's story but adds no new incident — merge it with the escalation rather than opening a second case.","study":"Triage hygiene: deduplicate on session/event IDs, honour retractions, and merge related alerts into one escalation.","actions":[{"t":"Escalate to IR (merge related alerts into it)"},{"t":"Close — duplicate of an already-escalated alert"},{"t":"Close — retracted or unrelated noise"},{"t":"Route out — different technique, not email-link phishing"}],"alerts":[{"t":"AL-5501 — Full chain on finance host","meta":"mail deliver 09:02 -> proxy GET+POST hxxps://payroll-portal[.]example-id-3391[.]com/login 09:07-09:08 user=l.hayes","ok":0,"why":"Delivery, click and credential submission in one session — the complete T1566.002 chain."},{"t":"AL-5502 — Same host, new alert","meta":"proxy POST hxxps://payroll-portal[.]example-id-3391[.]com/login session_id=88112 (same as AL-5501)","ok":1,"why":"Same session ID as the escalated alert — a duplicate view of one incident."},{"t":"AL-5503 — Vendor feed alert (auto)","meta":"domain cdn-assets[.]example-id-77[.]net — RETRACTED by vendor: shared CDN host, False positive","ok":2,"why":"The vendor retracted it explicitly; acting on it would burn the shift's hours."},{"t":"AL-5504 — VPN gateway handshake","meta":"vpn new-device handshake 02:14, geo-consistent with user history","ok":3,"why":"A remote-access event, not an email-link behaviour — different technique family and different playbook."},{"t":"AL-5505 — Sandbox verdict for the clicked URL","meta":"detonation of hxxps://payroll-portal[.]example-id-3391[.]com/login: credential-harvest page confirmed","ok":0,"why":"It confirms AL-5501 — merge it into that escalation as supporting evidence."}]},{"id":"H13","type":"rank","title":"Three incidents, one senior analyst","summary":"Rank by risk, not by noise","scenario":["Four o'clock. Three link-phish reports, all verified True, all unresolved. A: the CFO clicked a link, typed the password, and approved an MFA push; IdP shows a sign-in from a residential ASN eleven minutes later. B: 200 mailboxes received a campaign; zero clicks so far; the domain is newly registered. C: one user clicked, nothing was submitted, the page was a static mock on a compromised small-business site, and EDR shows no download."],"question":"Rank the three incidents from most urgent (rank 1) to least (rank 3).","hint":"Rank by what the attacker already holds, not by how loud the report was.","expl":"A is first: the CFO's credential AND MFA are effectively held by the attacker, and a follow-on sign-in already happened — that is an active intrusion in the identity plane. B is second: no clicks yet, but 200 mailboxes of live bait on a fresh domain make a second wave likely within hours; containment is cheap now and expensive later. C is third: the exposure was a page view on someone else's compromised site with no submission and no payload — monitor, document, and move on. Loudness is not risk; held assets are.","study":"Risk order: assets held > assets exposed > assets touched. Reports get queued in that order.","items":["A — CFO: password typed, MFA approved, follow-on sign-in observed","B — 200 mailboxes with live campaign links, zero clicks","C — single click, no submission, static mock page, no payload"]},{"id":"H14","type":"match","title":"Which sensor saw it?","summary":"Four log lines — four data sources","scenario":["You are documenting the telemetry map for the post-incident report. Each line below came from a different sensor, and the report must name the source class for each — the same classes ATT&CK's data-source model uses."],"question":"Match each log line to the sensor class that produced it.","hint":"Delivery, connection, resolution, and process creation — one class per line.","expl":"The line with from=/url=/action=deliver is the mail gateway — it owns delivery. The GET/POST line with a user and status codes is the web proxy — it owns the connection. The query/answer line is DNS — it owns resolution, and it is where newly-registered domains show first. The chrome.exe-spawned-powershell line is endpoint process telemetry — it owns what the browser did after the click. Naming the class per line keeps the report honest about what each sensor can and cannot prove.","study":"Four classes every link case needs: delivery, connection, resolution, execution.","left":["from=... url=... action=deliver banner=external-sender","user=... GET/POST hxxps://... status=200","query xn--micrsoft-2we[.]com answer=203[.]0[.]113[.]77","chrome.exe spawned powershell.exe -enc ..."],"right":["Mail gateway log (delivery telemetry)","Web proxy log (network connection telemetry)","DNS resolver log (network resolution telemetry)","EDR process log (process creation telemetry)"],"correct":[0,1,2,3]},{"id":"H15","type":"multi","title":"Justified, not theatre","summary":"Pick the three actions the evidence actually supports","scenario":[{"label":"What is known","kind":"note","text":"Confirmed: one user clicked a credential-harvesting link and submitted the password (proxy POST, page confirmed by detonation). The domain is blocked at proxy and DNS. EDR shows no download or execution on the host. IdP shows no anomalous sign-ins yet for the user. Three more users visited the domain but closed the tab before any form loaded."},{"label":"The pressure","kind":"note","text":"The CIO asks for 'maximum action'. The IR lead asks for the actions the evidence supports — the ticket will be read by auditors."}],"question":"Select the three actions the evidence supports right now.","hint":"Contain what was taken, block the road, scope the exposure — and let the rest follow evidence, not adrenaline.","expl":"Resetting the password and revoking sessions answers the one credential known to be stolen. The domain is already blocked, and extending the hunt through proxy history answers 'who else stood on the porch' without punishing anyone. Reimaging a host with no payload observed destroys evidence and costs a day for zero risk reduction; disabling the mail tenant punishes 4,000 people for one phish; a company-wide 'check your email' blast arrives after the purge anyway and trains users to ignore security mail. The evidence-supported set is smaller and sharper than the adrenaline set — that is the point.","study":"Auditor-proof response: every action in the ticket should cite the artefact that justifies it.","opts":["Reset the user's password and revoke active sessions/refresh tokens","Search proxy history for every other visitor to the domain in the exposure window","Keep the host online with increased logging, and re-assess after the session hunt","Reimage the laptop immediately — a click is a compromise","Disable the entire mail tenant until all users are interviewed"],"correct":[0,1,2],"why":{"3":"No payload was observed on the host; reimaging destroys evidence and buys no risk reduction.","4":"One credential phish does not justify a tenant-wide outage; containment must stay proportional."}}];
</script>
<script>

'use strict';
/* ============ T1566.002 exam engine (self-contained, vanilla JS) ============ */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function letters(i){ return String.fromCharCode(65+i); }
function fmt1(x){ return (Math.round(x*10)/10).toFixed(1); }
function fmtClock(sec){ sec=Math.max(0,sec); var m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }

/* Mandatory scoring formula: exerciseCredit = max(0,(H-W)/N) */
function scoreExercise(H,W,N){ if(N<=0){ return 0; } return Math.max(0,(H-W)/N); }

var BUDGET = window.EXAM_BUDGET_MIN * 60;
var S = {
  order: [], cur: 0,
  credit: [], answered: [], skipped: [], hintUsed: [], done: [], picks: [],
  timerState: 'IDLE', prevState: null, remaining: BUDGET,
  manualSecs: 0, autoSecs: 0, _lastT: 0, _tick: null,
  reported: false, attempt: 1, mode: 'normal',
  user: { username:'', country:'', locale:'en' }
};

var EX = window.EXAMS;

/* ---------------- timer state machine ---------------- */
function setState(st){
  S.timerState = st; S._lastT = Date.now();
  renderHeader();
}
function tick(){
  var now = Date.now(); var dt = Math.round((now - S._lastT)/1000);
  if(dt<=0){ return; }
  S._lastT = now;
  if(S.timerState==='RUNNING'){
    S.remaining -= dt;
    if(S.remaining<=0){ S.remaining=0; setState('ENDED'); onTimeout(); }
  } else if(S.timerState==='PAUSED_AUTO_CHECK'){
    S.autoSecs += dt;
  } else if(S.timerState==='PAUSED_MANUAL'){
    S.manualSecs += dt;
  }
  renderTimer();
}
function startTimer(){ setState('RUNNING'); }
function timerLabel(){
  if(S.timerState==='RUNNING'){ return '<span class="tst-running">&#9654; RUNNING</span>'; }
  if(S.timerState==='PAUSED_MANUAL'){ return '<span class="tst-paused">&#9208; PAUSED &#8212; manual (press Resume)</span>'; }
  if(S.timerState==='PAUSED_AUTO_CHECK'){ return '<span class="tst-paused">&#9203; AUTO-PAUSED &#8212; reading feedback (resumes on Next)</span>'; }
  if(S.timerState==='ENDED'){ return '<span class="tst-ended">&#9632; ENDED</span>'; }
  return '';
}
function renderTimer(){
  var el=$('timer-txt'); if(el){ el.textContent = fmtClock(S.remaining); }
  var st=$('tstate-ind'); if(st){ st.innerHTML = timerLabel(); }
}

/* ---------------- header ---------------- */
function renderHeader(){
  var exN = S.order.length;
  $('h-counter').innerHTML = 'Exercise <b>'+(S.cur+1)+'</b> of <b>'+exN+'</b>';
  $('h-score').innerHTML = 'Score <b>'+fmt1(creditSum())+'</b> / '+answeredCount()+' ('+percentNow()+'%)';
  var u = $('h-user');
  if(S.user.username){ u.innerHTML = '&#128100; '+esc(S.user.username)+(S.user.country && S.user.country!=='ZZ' ? ' ('+esc(S.user.country)+')':''); }
  renderTimer();
  updateProgress();
}
function answeredCount(){ var n=0; for(var i=0;i<S.answered.length;i++){ if(S.answered[i]){ n++; } } return n; }
function creditSum(){ var s=0; for(var i=0;i<S.credit.length;i++){ if(S.answered[i]){ s+=S.credit[i]; } } return s; }
function percentNow(){ var n=answeredCount(); if(n===0){ return 0; } return Math.round((creditSum()/n)*100); }
function updateProgress(){
  var total = S.order.length;
  var done = 0;
  for(var i=0;i<S.done.length;i++){ if(S.done[i]){ done++; } }
  $('pbar').style.width = Math.round((done/total)*100)+'%';
}

/* ---------------- intro ---------------- */
function buildIntro(){
  var d = window.EXAM_INTRO;
  var h = '';
  h += '<div class="card intro-head">';
  h += '  <h1 class="intro-title">'+esc(d.title)+'</h1>';
  h += '  <p class="intro-sub">'+esc(d.subline)+'</p>';
  h += '  <div class="fact-row">';
  h += '    <div class="fact"><div class="f-l">ATT&amp;CK object</div><div class="f-v">'+esc(d.obj)+'</div></div>';
  h += '    <div class="fact"><div class="f-l">Severity</div><div class="f-v"><span class="badge badge-sev"><span class="dot"></span>'+esc(window.EXAM_SEV_WORD)+'</span></div></div>';
  h += '    <div class="fact"><div class="f-l">Exercises</div><div class="f-v">'+EX.length+'</div></div>';
  h += '    <div class="fact"><div class="f-l">Estimated time</div><div class="f-v">'+window.EXAM_EST_MIN+' min</div></div>';
  h += '    <div class="fact"><div class="f-l">Timer budget</div><div class="f-v">'+window.EXAM_BUDGET_MIN+' min</div></div>';
  h += '    <div class="fact"><div class="f-l">Pass mark</div><div class="f-v">70%</div></div>';
  h += '  </div></div>';
  h += '<div class="block scenario"><div class="block-h"><span class="bh-ico">&#128218;</span><span class="bh-txt">WHAT YOU WILL LEARN HERE</span></div><div class="block-b">';
  for(var i=0;i<d.learn.length;i++){ h += '<p class="learn-p">'+d.learn[i]+'</p>'; }
  h += '<div class="role-tags">';
  for(var j=0;j<d.roles.length;j++){ h += '<span class="role-tag">'+esc(d.roles[j])+'</span>'; }
  h += '</div></div></div>';
  h += '<div class="block question"><div class="block-h"><span class="bh-ico">&#127991;</span><span class="bh-txt">KEYWORDS COVERED IN THIS EXAM</span></div><div class="block-b">';
  for(var k=0;k<d.kw.length;k++){
    h += '<div class="kw-theme"><h4>'+esc(d.kw[k].theme)+'</h4><ul class="kw-list">';
    for(var m=0;m<d.kw[k].items.length;m++){ h += '<li>'+esc(d.kw[k].items[m])+'</li>'; }
    h += '</ul></div>';
  }
  h += '</div></div>';
  h += '<div class="block answer"><div class="block-h"><span class="bh-ico">&#9881;&#65039;</span><span class="bh-txt">HOW THIS EXAM WORKS</span></div><div class="block-b">';
  h += '<ul class="how-list">';
  for(var n2=0;n2<d.how.length;n2++){ h += '<li>'+d.how[n2]+'</li>'; }
  h += '</ul>';
  h += '<div class="nav-row" style="justify-content:center"><button id="btn-start" class="hbtn primary big">&#9654; Start</button></div>';
  h += '</div></div>';
  $('intro').innerHTML = h;
  $('btn-start').addEventListener('click', startExam);
}

/* ---------------- exam lifecycle ---------------- */
function startExam(){
  S.order = shuffle(EX.map(function(e,i){ return i; }));
  S.cur = 0;
  S.credit = EX.map(function(){ return 0; });
  S.answered = EX.map(function(){ return false; });
  S.done = EX.map(function(){ return false; });
  S.hintUsed = EX.map(function(){ return false; });
  S.picks = EX.map(function(){ return null; });
  S.skipped = [];
  S.remaining = BUDGET;
  S.manualSecs = 0; S.autoSecs = 0;
  S.reported = false; S.mode = 'normal';
  $('intro').hidden = true;
  $('results').hidden = true;
  $('review').hidden = true;
  $('exam').hidden = false;
  if(S._tick){ clearInterval(S._tick); }
  S._lastT = Date.now();
  S._tick = setInterval(tick, 1000);
  renderExercise();
  startTimer();
  $('exam').scrollIntoView();
}
function curEx(){ return EX[S.order[S.cur]]; }

function renderExercise(){
  var idx = S.order[S.cur];
  var e = EX[idx];
  if(!S.answered[idx]){ S.done[idx]=false; }
  var h = '<div class="card" style="padding:6px 18px 18px">';
  h += exerciseHTML(e, idx);
  h += '<div id="fbk" hidden></div>';
  h += '<div class="nav-row">';
  h += '  <button id="btn-check" class="hbtn primary">Check answer</button>';
  h += '  <button id="btn-next" class="hbtn" disabled>Next &#8594;</button>';
  h += '  <span class="nav-note" id="nav-note"></span>';
  h += '</div></div>';
  $('ex-area').innerHTML = h;
  $('h-sevbadge').innerHTML = '<span class="badge badge-sev"><span class="dot"></span>'+window.EXAM_SEV_WORD+'</span>';
  bindExercise(e, idx);
  $('btn-check').addEventListener('click', function(){ onCheck(); });
  $('btn-next').addEventListener('click', function(){ onNext(); });
  $('btn-hint').disabled = S.answered[idx] || S.hintUsed[idx];
  if(S.hintUsed[idx] && !S.answered[idx]){ showHintPanel(e); }
  $('btn-pause').disabled = false;
  $('btn-skip').disabled = S.answered[idx];
  renderHeader();
  var last = lastUnansweredPos();
  $('btn-check').textContent = (S.cur===S.order.length-1) ? 'Check answer' : 'Check answer';
  if(S.cur===S.order.length-1){ $('nav-note').textContent = 'This is the last exercise. After Check, use Final Submit.'; }
  updateNavForState();
  window.scrollTo(0,0);
}
function lastUnansweredPos(){
  for(var i=S.order.length-1;i>=0;i--){ var idx=S.order[i]; if(!S.answered[idx]){ return i; } }
  return S.order.length-1;
}
function isLast(){
  /* last exercise position reached AND all later ones are done/skipped */
  for(var i=S.cur+1;i<S.order.length;i++){ var idx=S.order[i]; if(!S.done[idx] && S.skipped.indexOf(idx)===-1){ return false; } }
  return true;
}
function updateNavForState(){
  var idx = S.order[S.cur];
  var checked = S.answered[idx];
  $('btn-check').disabled = checked;
  var nextBtn = $('btn-next');
  nextBtn.innerHTML = (S.mode==='review' && remainingSkipped()>1) ? 'Back to skipped list &#8594;' : (isLast() ? 'Final Submit &#8594;' : 'Next &#8594;');
  nextBtn.disabled = !checked;
}
function onCheck(){
  if(S.timerState==='RUNNING'){ setState('PAUSED_AUTO_CHECK'); }
  gradeCurrent();
}
function onNext(){
  var idx = S.order[S.cur];
  if(S.timerState==='PAUSED_AUTO_CHECK'){ startTimer(); }
  S.done[idx] = true;
  if(S.mode==='review'){
    if(remainingSkipped()>0){
      showReview();
      return;
    } else {
      S.mode='normal';
      finishFlow();
      return;
    }
  }
  if(isLast()){
    finishFlow();
    return;
  }
  var nxt = S.cur+1;
  while(nxt < S.order.length && S.skipped.indexOf(S.order[nxt])!==-1 && S.answered[S.order[nxt]]){ nxt++; }
  if(nxt >= S.order.length){ finishFlow(); return; }
  S.cur = nxt;
  renderExercise();
}
function onSkip(){
  var idx = S.order[S.cur];
  if(S.answered[idx]){ return; }
  if(S.skipped.indexOf(idx)===-1){ S.skipped.push(idx); }
  S.done[idx] = true;
  if(S.mode==='review'){ showReview(); return; }
  var nxt = S.cur+1;
  if(nxt >= S.order.length){
    finishFlow();
    return;
  }
  S.cur = nxt;
  renderExercise();
}
function remainingSkipped(){
  var n=0;
  for(var i=0;i<S.skipped.length;i++){ if(!S.answered[S.skipped[i]]){ n++; } }
  return n;
}
function finishFlow(){
  if(remainingSkipped()>0 && S.timerState!=='ENDED'){
    showReview();
  } else {
    showResults();
  }
}
function onTimeout(){
  if(S._tick){ clearInterval(S._tick); S._tick=null; }
  var open = remainingSkipped();
  if(open>0){ showReview(true); } else { showResults(); }
}
function onHint(){
  var idx = S.order[S.cur];
  if(S.answered[idx] || S.hintUsed[idx]){ return; }
  S.hintUsed[idx] = true;
  var e = EX[idx];
  showHintPanel(e);
  $('btn-hint').disabled = true;
}
function showHintPanel(e){
  var p = $('hint-panel');
  if(!p){
    p = document.createElement('div');
    p.id = 'hint-panel';
    var nav = $('ex-area').querySelector('.nav-row');
    nav.parentNode.insertBefore(p, nav);
  }
  p.innerHTML = '<div class="hp-h">&#128161; HINT (costs 10% of this exercise&#8217;s credit)</div>'+esc(e.hint);
}
function onPause(){
  if(S.timerState==='RUNNING' || S.timerState==='PAUSED_AUTO_CHECK'){
    S.prevState = S.timerState;
    setState('PAUSED_MANUAL');
    $('overlay').hidden = false;
    $('ex-area').style.visibility = 'hidden';
  }
}
function onResume(){
  $('overlay').hidden = true;
  $('ex-area').style.visibility = 'visible';
  setState(S.prevState || 'RUNNING');
  S.prevState = null;
}
function showReview(timeout){
  S.mode = 'review';
  $('exam').hidden = true;
  $('review').hidden = false;
  var list = S.skipped.filter(function(i){ return !S.answered[i]; });
  var h = '<div class="card" style="padding:18px 20px">';
  h += '<h2 style="margin-top:0">&#9888; Skipped exercises &#8212; review before you finish</h2>';
  h += '<p style="color:var(--text-secondary)">'+(timeout
    ? 'Time is over. You cannot answer these any more. They will be excluded from your score: they do not count as correct, wrong, or add to the total.'
    : 'You skipped these. You can go back and answer them now, as many times as you need, while the timer is still running. If you submit with skipped exercises, they are excluded from the score.')+'</p>';
  if(S.timerState!=='ENDED'){
    h += '<div style="margin:8px 0"><b style="color:var(--text-primary)">&#9201; Time left: '+fmtClock(S.remaining)+'</b></div>';
  }
  h += '<ul class="rv-list">';
  for(var i=0;i<list.length;i++){
    var idx=list[i]; var e=EX[idx];
    h += '<li class="rv-row"><span class="badge badge-skipped"><span class="dot"></span>&#9888; Skipped</span><span class="rv-t">'+esc(e.title)+'</span>';
    h += (S.timerState==='ENDED')
      ? '<button class="hbtn" disabled>Time is over</button>'
      : '<button class="hbtn" data-open="'+idx+'">&#8617; Open and answer</button>';
    h += '</li>';
  }
  h += '</ul>';
  h += '<div class="nav-row"><button id="rv-submit" class="hbtn primary big">'+(timeout?'Go to results':'Submit anyway')+'</button></div>';
  h += '</div>';
  $('review').innerHTML = h;
  var btns = $('review').querySelectorAll('[data-open]');
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener('click', function(ev){
      var idx = parseInt(ev.currentTarget.getAttribute('data-open'),10);
      S.cur = S.order.indexOf(idx);
      S.mode = 'review';
      $('review').hidden = true;
      $('exam').hidden = false;
      renderExercise();
    });
  }
  $('rv-submit').addEventListener('click', function(){
    if(S.timerState==='ENDED'){ showResults(); }
    else if(remainingSkipped()>0){ showResults(); }
    else { S.mode='normal'; finishFlow(); }
  });
  window.scrollTo(0,0);
}


/* ---------------- shared render helpers ---------------- */
var HL_RE = /(\d{4}-\d{2}-\d{2}[T ][\d:.]+(?:Z|[+-]\d{2}:?\d{2})?)|((?:\d{1,3}\[\.\]){3}\d{1,3})|((?:hxxps?):\/\/[^\s"',<>()]+)|([A-Za-z0-9._%+-]+@[A-Za-z0-9.\[\]-]+\.[A-Za-z]{2,})|(\b(?:GET|POST|CLICK|CLICKED|OPENED|BLOCK|BLOCKED|DENY|DENIED|ALERT|ALERTED|QUARANTINE|QUARANTINED|REWRITE|REWRITTEN|DELIVERED|DETONATED|FAILED|PASS|WATCHLIST|REPUTATION|MALICIOUS|PHISH)\b)/gi;
function hlLine(line){
  var out=''; var last=0; var m;
  HL_RE.lastIndex=0;
  while((m=HL_RE.exec(line))!==null){
    out += esc(line.slice(last, m.index));
    var t = m[0];
    if(m[1]){ out += '<span class="l-ts">'+esc(t)+'</span>'; }
    else if(m[2]){ out += '<span class="l-ip">'+esc(t)+'</span>'; }
    else if(m[3]){ out += '<span class="l-url">'+esc(t)+'</span>'; }
    else if(m[4]){ out += '<span class="l-mail">'+esc(t)+'</span>'; }
    else { out += '<span class="l-kw">'+esc(t)+'</span>'; }
    last = m.index + t.length;
  }
  out += esc(line.slice(last));
  return out;
}
function logViewerHTML(n, src, lines){
  var h = '<div class="logv" data-lv="'+n+'">';
  h += '<div class="logv-head"><span class="logv-src">&#128196; '+esc(src)+'</span><input class="logv-filter" type="text" placeholder="filter lines..." aria-label="Filter log lines for '+esc(src)+'"></div>';
  h += '<pre>';
  for(var i=0;i<lines.length;i++){ h += '<span class="ln">'+hlLine(lines[i])+'</span>'; }
  h += '</pre></div>';
  return h;
}
function artefactHTML(n, a){
  var h = '<div class="artefact"><div class="art-label">ARTEFACT '+n+' &#8212; '+esc(a.label)+'</div>';
  if(a.kind==='log'){
    h += logViewerHTML('a'+n, a.src || a.label, a.lines);
  } else if(a.kind==='note'){
    h += '<div class="art-note">'+esc(a.text)+'</div>';
  } else {
    h += '<pre class="mono">'+hlLine(a.text)+'</pre>';
  }
  h += '</div>';
  return h;
}
function scenarioHTML(e){
  var h = '<div class="block scenario"><div class="block-h"><span class="bh-ico">&#128270;</span><span class="bh-txt">SCENARIO</span>';
  h += '<button type="button" class="collapse-btn" id="scn-toggle">Collapse &#9662;</button></div>';
  h += '<div class="scn-sum" id="scn-sum" hidden>&#128204; '+esc(e.summary)+'</div>';

    else { h += artefactHTML(i+1, p); }

  h += '</div></div>';

}
function bindScenario(){
