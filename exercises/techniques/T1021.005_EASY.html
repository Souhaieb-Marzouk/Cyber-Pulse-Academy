<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1021.005 VNC — EASY</title>
<style>
:root{
  --bg-page:#070c12;
  --bg-panel:#0d141d;
  --bg-surface:#111a26;
  --bg-surface-2:#0a111a;
  --bg-elev:#172335;
  --ink:#e9eff7;
  --ink-dim:#a9b9cb;
  --ink-faint:#8497ab;
  --line:#1f2b3c;
  --line-soft:#182331;
  --blue:#4aa8e8;   --blue-soft:rgba(74,168,232,.13);
  --amber:#e6aa3c;  --amber-soft:rgba(230,170,60,.13);
  --green:#41c07f;  --green-soft:rgba(65,192,127,.13);
  --red:#ef5a6a;    --red-soft:rgba(239,90,106,.15);
  --sev-easy:#41c07f;
  --sev-medium:#e6aa3c;
  --sev-hard:#f0813c;
  --sev-extreme:#ef5a6a;
  --focus:#4aa8e8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1 0 auto;width:100%;max-width:980px;margin:0 auto;padding:20px 16px 40px}
.foot{flex-shrink:0;margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:12.5px;background:var(--bg-panel)}
.foot b{color:var(--ink-dim);letter-spacing:.08em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-surface-2)}
::-webkit-scrollbar-thumb{background:#24344b;border-radius:6px;border:2px solid var(--bg-surface-2)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(8,13,20,.94);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.14em;font-size:12.5px;color:var(--green)}
.brand small{color:var(--ink-faint);letter-spacing:.05em;font-weight:600}
.tb-sep{width:1px;height:22px;background:var(--line)}
.tb-title{font-weight:700;font-size:13.5px;color:var(--ink-dim);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stat{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;font-weight:600;background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:32px}
.tb-stat .ic{font-size:13px}
.tb-stat.timer{font-family:var(--mono);color:var(--ink)}
.tb-state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px;border:1px solid}
.tb-state.manual{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.tb-state.autocheck{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.tb-btn:hover:not(:disabled){border-color:var(--blue)}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}
.tb-btn.hint{color:var(--amber)}
.tb-btn.skip{color:var(--ink-dim)}
.prog{height:3px;background:var(--line-soft)}
.prog i{display:block;height:100%;background:var(--green);width:0%;transition:width .25s}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 12px;color:#08110b}
.badge::before{content:"●";font-size:9px}
.sev-EASY{background:var(--sev-easy)}
.sev-MEDIUM{background:var(--sev-medium)}
.sev-HARD{background:var(--sev-hard)}
.sev-EXTREMELY_HARD{background:var(--sev-extreme);color:#160407}
.otype{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg-surface)}
/* ---------- intro ---------- */
.intro-head{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--bg-panel),var(--bg-surface-2));padding:26px 26px 20px;margin-bottom:16px}
.intro-head h1{margin:8px 0 4px;font-size:26px;line-height:1.25}
.intro-head .sub{color:var(--ink-dim);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-dim);background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:34px}
.chip .ic{color:var(--ink-faint)}
.cand{margin-top:12px;font-size:13px;color:var(--ink-faint)}
.intro-sec{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;background:var(--bg-panel);padding:18px 22px;margin-bottom:14px}
.intro-sec.learn{border-left-color:var(--blue)}
.intro-sec.keys{border-left-color:var(--amber)}
.intro-sec.how{border-left-color:var(--green)}
.intro-sec h2{margin:0 0 10px;font-size:15px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.intro-sec.learn p{color:var(--ink-dim);margin:0 0 10px}
.intro-sec.learn p:last-child{margin-bottom:0}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kw-card{background:var(--bg-surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 14px}
.kw-card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.kw-card ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:13.5px}
.kw-card li{margin:2px 0}
.rules{margin:0;padding:0;list-style:none}
.rules li{position:relative;padding:7px 0 7px 26px;color:var(--ink-dim);font-size:14px}
.rules li::before{content:"▸";position:absolute;left:4px;color:var(--green)}
.rules li .dim{color:var(--ink-faint)}
/* ---------- exercise card ---------- */
.excard{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--bg-panel);border:1px solid var(--line);border-left:4px solid var(--blk,var(--blue));border-radius:12px;padding:16px 20px}
.blk-scenario{--blk:var(--blue)}
.blk-question{--blk:var(--amber)}
.blk-answer{--blk:var(--green)}
.blk-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--blk,var(--ink));margin-bottom:10px}
.blk-label .dot{width:8px;height:8px;border-radius:50%;background:var(--blk,var(--ink))}
.ex-title{margin:0 0 8px;font-size:16.5px}
.summary{color:var(--ink-faint);font-size:13.5px;font-style:italic;margin:0 0 8px}
.showfull{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;min-height:32px}
.scen-body p{margin:0 0 10px;color:var(--ink-dim)}
.scen-body p:last-child{margin-bottom:0}
details.artef{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin:10px 0 0}
details.artef summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--blue);user-select:none;min-height:40px;display:flex;align-items:center}
details.artef .artbody{padding:0 14px 12px}
.mono{font-family:var(--mono);font-size:13px;line-height:1.5;color:#c8d8e6;background:var(--bg-surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:0}
table.attable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:0}
table.attable th{background:var(--bg-elev);color:var(--ink);text-align:left}
table.attable th,table.attable td{border:1px solid var(--line-soft);padding:6px 10px;color:var(--ink-dim)}
.q-text{margin:0;font-weight:700;font-size:16px;color:var(--ink)}
/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-height:44px;cursor:pointer;color:var(--ink);font-size:14.5px;font-family:var(--sans);margin:0 0 8px}
.opt:last-child{margin-bottom:0}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}
.opt .mark{font-weight:800;flex-shrink:0}
/* ---------- match ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol h4,.obank h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mleft{flex:1;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;min-height:44px;display:flex;align-items:center}
.mzone{flex:1;background:var(--bg-surface-2);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;min-height:44px;color:var(--ink-faint);font-size:13.5px;cursor:pointer;text-align:left;font-family:var(--sans)}
.mzone.filled{border-style:solid;border-color:var(--blue);color:var(--ink)}
.mzone.dragover{border-color:var(--green)}
.mzone.correct{border-color:var(--green);background:var(--green-soft)}
.mzone.wrong{border-color:var(--red);background:var(--red-soft)}
.mbank{display:flex;flex-direction:column}
.mchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;margin-bottom:8px;cursor:grab;color:var(--ink);font-size:13.5px;text-align:left;font-family:var(--sans)}
.mchip:disabled{cursor:default;opacity:.5}
.mchip.selchip{border-color:var(--amber);background:var(--amber-soft)}
.mchip.used{opacity:.35}
.mhintline{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- order ---------- */
.ordlist{list-style:none;margin:0;padding:0;counter-reset:ord}
.orditem{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.orditem.dragover{border-color:var(--green)}
.orditem .num{font-family:var(--mono);color:var(--amber);font-weight:700;min-width:22px;text-align:center}
.orditem .txt{flex:1;font-size:14px}
.orditem.correct{border-color:var(--green)}
.orditem.wrong{border-color:var(--red)}
.ordbtns{display:flex;gap:4px}
.ordbtns button{min-width:34px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);cursor:pointer;font-size:14px}
.ordbtns button:hover{border-color:var(--blue)}
/* ---------- fill ---------- */
.fillwrap{font-size:15.5px;color:var(--ink-dim);line-height:2.1;white-space:pre-wrap}
.fillin{font-family:var(--mono);font-size:13.5px;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 10px;min-height:38px;width:170px;margin:0 3px}
.fillin:focus{border-color:var(--blue);outline:none}
.fillin.correct{border-color:var(--green)}
.fillin.wrong{border-color:var(--red)}
.fbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:38px;font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer}
.fchip:hover{border-color:var(--amber)}
/* ---------- terminal ---------- */
.term{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:8px;background:var(--bg-elev);padding:8px 12px;font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.term-bar .dots{letter-spacing:3px;color:var(--red)}
.term-out{font-family:var(--mono);font-size:13px;line-height:1.55;color:#c8d8e6;padding:12px 14px;min-height:130px;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term-out .tl-dim{color:var(--ink-faint)}
.term-out .tl-danger{color:var(--red);font-weight:700}
.term-out .tl-echo{color:var(--ink)}
.term-line{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding:10px 14px}
.term-prompt{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--mono);font-size:13px;min-height:34px}
.term-in:focus{outline:none}
details.syntax{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin-top:10px}
details.syntax summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--amber);min-height:40px;display:flex;align-items:center}
details.syntax .artbody{padding:0 14px 12px}
/* ---------- logview ---------- */
.logpanel{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log-tools{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-elev);border-bottom:1px solid var(--line-soft)}
.logfilter{flex:1;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 12px;min-height:38px}
.logfilter:focus{border-color:var(--blue);outline:none}
.log-count{font-size:12px;color:var(--ink-faint);font-family:var(--mono);white-space:nowrap}
.loglines{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#bccfe0;padding:12px 14px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.loglines mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}
.wtitle{font-weight:700;margin:14px 0 10px;color:var(--ink)}
/* ---------- decision ---------- */
.dstep{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.dstep.locked{opacity:.9}
.dlabel{display:inline-flex;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue);border-radius:6px;padding:3px 9px;margin-bottom:8px}
.dprompt{font-family:var(--mono);font-size:13px;color:var(--ink-dim);background:var(--bg-surface-2);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 10px;white-space:pre-wrap}
.dq{font-weight:700;margin:0 0 10px}
.drecorded{color:var(--ink-faint);font-size:13px;margin-top:8px}
.dwhy{font-size:13.5px;color:var(--ink-dim);background:var(--bg-surface-2);border-radius:8px;padding:9px 12px;margin-top:8px}
/* ---------- hint ---------- */
.hintbox{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin-top:12px;color:var(--ink-dim)}
.hintbox .hb{color:var(--amber);font-weight:800;font-size:12px;letter-spacing:.1em;display:block;margin-bottom:4px}
.penaltynote{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- feedback ---------- */
.fb{border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.fb.ok{border-color:var(--green)}
.fb.bad{border-color:var(--red)}
.fb.part{border-color:var(--amber)}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 18px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb.ok .fb-head{background:var(--green-soft);color:var(--green)}
.fb.bad .fb-head{background:var(--red-soft);color:var(--red)}
.fb.part .fb-head{background:var(--amber-soft);color:var(--amber)}
.fb-credit{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim);font-weight:600}
.fb-body{padding:14px 18px;background:var(--bg-panel)}
.fi{display:flex;gap:9px;padding:4px 0;font-size:14px;color:var(--ink-dim)}
.fi .ic{flex-shrink:0;font-weight:800}
.fi.ok .ic{color:var(--green)}
.fi.bad .ic{color:var(--red)}
.fi.miss .ic{color:var(--ink-faint)}
.fi.warn .ic{color:var(--red)}
.fi.warn{color:var(--red);font-weight:600}
.fi.note{color:var(--ink-faint)}
.fb-explain{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:12px;color:var(--ink-dim);font-size:14px}
.fb-explain p{margin:0 0 10px}
.fb-explain p:last-child{margin-bottom:0}
.fb-study{margin-top:10px;font-size:13px;color:var(--blue)}
.fb .mono{margin-top:10px}
/* ---------- actions ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:10px 20px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-family:var(--sans)}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:transparent;color:#04120a}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-amber{background:var(--amber);border-color:transparent;color:#1c1204}
.ghost-note{color:var(--ink-faint);font-size:13px}
/* ---------- review ---------- */
.revlist{display:flex;flex-direction:column;gap:10px}
.revrow{display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex-wrap:wrap}
.revrow .rn{font-family:var(--mono);color:var(--amber);font-weight:700}
.revrow .rt{flex:1;color:var(--ink-dim);font-size:14px;min-width:200px}
.revrow .badge-skip{color:var(--ink-faint);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* ---------- results ---------- */
.res-head{border:1px solid var(--line);border-radius:14px;background:var(--bg-panel);padding:26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ring{width:172px;height:172px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--pct)*1%),var(--bg-elev) 0);display:grid;place-items:center;flex-shrink:0}
.ring .rin{width:134px;height:134px;border-radius:50%;background:var(--bg-panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:34px;font-weight:800;font-family:var(--mono)}
.ring .of{font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
.res-verdict{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.res-verdict.pass{color:var(--green)}
.res-verdict.fail{color:var(--red)}
.res-sub{color:var(--ink-dim);font-size:14px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.statcard{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.statcard .sv{font-size:22px;font-weight:800;font-family:var(--mono)}
.statcard .sv.ok{color:var(--green)}
.statcard .sv.part{color:var(--amber)}
.statcard .sv.bad{color:var(--red)}
.statcard .sv.skip{color:var(--ink-faint)}
.statcard .sl{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.pausereport{border:1px solid var(--line);border-radius:10px;background:var(--bg-panel);padding:12px 16px;color:var(--ink-dim);font-size:13.5px;margin-bottom:14px}
.restable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.restable th{background:var(--bg-elev);text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase}
.restable td{padding:8px 12px;border-top:1px solid var(--line-soft);color:var(--ink-dim)}
.restable td.num{font-family:var(--mono)}
.st-ok{color:var(--green);font-weight:700}
.st-part{color:var(--amber);font-weight:700}
.st-bad{color:var(--red);font-weight:700}
.st-skip{color:var(--ink-faint);font-weight:700}
/* ---------- overlay ---------- */

<script type="application/json" id="cm-exercise-meta">{"attackId":"T1021.005","attackName":"VNC","objectType":"sub-technique","severity":"EASY","topicId":"t1021.005","batch":1,"title":"T1021.005 VNC — EASY","difficulty":"easy","estimatedMinutes":25,"timerMinutes":25,"questionCount":16,"passMark":70,"learn":["T1021.005 is a sub-technique of T1021 Remote Services in the MITRE ATT&CK Lateral Movement tactic. It covers Virtual Network Computing (VNC), a screen-sharing system that lets a person see and control another computer's display over the network.","VNC uses the RFB protocol. A VNC server shares a display and listens on TCP 5900 for the first display, 5901 for the next, and so on. A viewer connects, proves a password, and then mirrors the screen while sending mouse and keyboard input.","In real work, SOC analysts meet VNC as open port 5900, as processes like winvnc.exe or x11vnc, and as products from RealVNC, TightVNC, TigerVNC and UltraVNC. Helpdesk teams also use VNC every day for remote support, so not every VNC session is an attack.","Your daily tasks include recognising VNC ports, naming the common tools, and knowing that a classic VNC password can never be longer than eight characters. You also learn the difference between full control and view-only access.","The main risk is simple: whoever controls the screen controls the logged-in user. One weak or missing VNC password gives an intruder hands-on-keyboard access, so this exam trains you to spot weak VNC setups early and explain them in plain words."],"keywords":[{"theme":"Ports & Protocol Basics","items":["TCP 5900 base display port","Display offsets 5901-5903","RFB remote framebuffer protocol","Screen sharing versus resource sharing"]},{"theme":"Tools & Software","items":["RealVNC","TightVNC","TigerVNC","UltraVNC","x11vnc session shadowing"]},{"theme":"Authentication & Safety Basics","items":["Eight-character VNC password ceiling","SecurityTypes None unauthenticated mode","View-only passwords","VPN front door basics"]}]}</script>

var META = {"attackId":"T1021.005","attackName":"VNC","objectType":"sub-technique","severity":"EASY","topicId":"t1021.005","batch":1,"title":"T1021.005 VNC — EASY","difficulty":"easy","estimatedMinutes":25,"timerMinutes":25,"questionCount":16,"passMark":70,"learn":["T1021.005 is a sub-technique of T1021 Remote Services in the MITRE ATT&CK Lateral Movement tactic. It covers Virtual Network Computing (VNC), a screen-sharing system that lets a person see and control another computer's display over the network.","VNC uses the RFB protocol. A VNC server shares a display and listens on TCP 5900 for the first display, 5901 for the next, and so on. A viewer connects, proves a password, and then mirrors the screen while sending mouse and keyboard input.","In real work, SOC analysts meet VNC as open port 5900, as processes like winvnc.exe or x11vnc, and as products from RealVNC, TightVNC, TigerVNC and UltraVNC. Helpdesk teams also use VNC every day for remote support, so not every VNC session is an attack.","Your daily tasks include recognising VNC ports, naming the common tools, and knowing that a classic VNC password can never be longer than eight characters. You also learn the difference between full control and view-only access.","The main risk is simple: whoever controls the screen controls the logged-in user. One weak or missing VNC password gives an intruder hands-on-keyboard access, so this exam trains you to spot weak VNC setups early and explain them in plain words."],"keywords":[{"theme":"Ports & Protocol Basics","items":["TCP 5900 base display port","Display offsets 5901-5903","RFB remote framebuffer protocol","Screen sharing versus resource sharing"]},{"theme":"Tools & Software","items":["RealVNC","TightVNC","TigerVNC","UltraVNC","x11vnc session shadowing"]},{"theme":"Authentication & Safety Basics","items":["Eight-character VNC password ceiling","SecurityTypes None unauthenticated mode","View-only passwords","VPN front door basics"]}]};
var EXAMS = [{"id":"e01","type":"mcq","title":"What VNC gives you","summary":"Identify what a VNC session actually controls.","scenario":"During onboarding at a design studio, a new analyst asks what Virtual Network Computing really does. The lead answers that VNC is screen sharing, not file sharing, and asks her to repeat one correct sentence to the team before the shift starts.","question":"Which sentence describes what a VNC session gives the person on the viewer side?","hint":"Think screen, mouse and keyboard — nothing else.","explanation":"VNC mirrors the remote screen and sends the viewer's mouse and keyboard input to the server, which is why it is called remote control software. It does not copy files like a network share, it does not carry chat, and it does not handle printing — those are other tools' jobs.\n\nWhen you see 'VNC' in a report, picture hands on the keyboard of the remote machine.","study":"Study the RFB protocol basics: server shares the framebuffer, viewer sends input.","options":["It shows and controls the remote screen","It only copies files from one host to another host","It only relays chat messages between support staff","It only forwards print jobs to office printers"],"correct":0},{"id":"e02","type":"mcq","title":"Default VNC port","summary":"Name the port where the first VNC display listens.","scenario":"A firewall ticket asks which port must be opened for a designer's VNC desktop. The junior analyst opens the port atlas and stops at the remote services page, where several remote-access services sit side by side. The studio standard says the first display is the base display.","question":"Which TCP port does the first VNC display listen on by default?","hint":"It is one number above 5899.","explanation":"Display :0 listens on TCP 5900, and every extra display adds one — :1 on 5901, :2 on 5902. Port 3389 belongs to RDP, 5985 to WinRM and 22 to SSH, so those options name different remote services from the same ATT&CK family T1021.\n\nKnowing the base port by heart lets you read any firewall or socket list and say 'that is VNC' instantly.","study":"Study VNC display numbering: base port 5900 plus the display number.","options":["TCP 5900","TCP 3389","TCP 5985","TCP 5901"],"correct":0},{"id":"e03","type":"match","title":"VNC software families","summary":"Match each common VNC tool to what it is known for.","scenario":"The team keeps mixing up the VNC tools that show up in incident notes. You prepare a small matching card for the wall so everyone can name a tool and its role in one line. All five tools appear in public reporting about normal use and about abuse, so the card must stay neutral.","question":"Match each VNC tool to the role it is known for:","hint":"One tool shadows an existing Linux screen; one is the Windows server with extra features.","explanation":"RealVNC is the cross-platform commercial suite; UltraVNC is the Windows server with extras like file transfer and an MS logon mode; TightVNC is the lightweight fork with a Java viewer; TigerVNC grew out of TightVNC with a focus on performance; and x11vnc shadows an existing X11 display instead of creating a new one.\n\nKnowing the tool names lets you read a process list and say 'that is a VNC server' instantly.","study":"Study the common VNC implementations: RealVNC, UltraVNC, TightVNC, TigerVNC and x11vnc.","pairs":[{"left":"RealVNC","right":"Cross-platform suite with commercial support"},{"left":"UltraVNC","right":"Windows server with MS logon and file transfer"},{"left":"TightVNC","right":"Lightweight fork with a Java viewer"},{"left":"TigerVNC","right":"Performance-focused fork of TightVNC"},{"left":"x11vnc","right":"Shadows an existing X11 display on Linux"}]},{"id":"e04","type":"order","title":"How a VNC session starts","summary":"Put the VNC connection steps in order.","scenario":"A new hire asks what happens between typing the server address into the viewer and seeing the remote desktop. You sketch the flow on the whiteboard in the right order so the whole class can copy it into their notebooks before the first triage exercise.","question":"Arrange the steps of a normal VNC connection in the order they happen:","hint":"The server must listen before anyone can connect.","explanation":"The server must start and listen first; only then can a viewer open the TCP connection. Both sides agree on the RFB protocol version, and only after authentication succeeds is the screen shared and controlled. Each earlier step is a precondition for the next one.\n\nThis order also explains the telemetry: a listening socket appears before any session flow does.","study":"Study the VNC connection sequence: listen, connect, handshake, authenticate, share.","items":["The VNC server starts and listens on its display port","The viewer opens a TCP connection to that port","Both sides agree on the RFB protocol version","The viewer passes authentication and the screen is shared"]},{"id":"e05","type":"fill","title":"VNC in one sentence","summary":"Complete the cheat-sheet sentence about VNC basics.","scenario":"You finish the studio cheat-sheet with one sentence that must hold the three facts every analyst repeats: what VNC shares, which protocol carries it, and which port the first display uses. The word bank holds more words than the sentence needs, so choose carefully.","question":"Complete the cheat-sheet sentence with terms from the bank:","hint":"The protocol name is three letters; the port is the base display port.","explanation":"VNC is screen-sharing software, the wire protocol is RFB, and the first display listens on TCP 5900. RDP and 3389 name the Windows remote desktop service instead, and 'chat' belongs to messaging tools.\n\nThese three facts are the core of every VNC triage note you will write.","study":"Study the RFB protocol and the 5900 base port as VNC's two calling cards.","text":"VNC is screen-___ software built on the ___ protocol, and the first display listens on TCP ___.","blanks":["sharing","RFB","5900"],"bank":["sharing","RFB","5900","RDP","3389","chat"]},{"id":"e06","type":"terminal","title":"Audit the VNC display port","summary":"Show which process listens on display port 5901.","scenario":"A designer says her Linux workstation runs a second VNC display. You are on lab-term-02 and must prove which process holds port 5901 without disturbing anything. The simulator only knows the lab toolset from the syntax panel, and read-only commands are enough here.","question":"Run the command that shows the process listening on TCP 5901:","hint":"ss lists sockets; the flag bundle shows listening TCP ports with numbers and processes; grep keeps the one you want.","explanation":"ss -ltnp lists listening TCP sockets with numeric ports and the owning process, and grep keeps the 5901 line. The output names Xvnc as the process, so the designer's claim is confirmed and nothing on the host was touched.\n\nCommands that restart or stop services change live state; during triage you only look.","study":"Study ss flag bundles: -l listening, -t TCP, -n numeric, -p process.","prompt":"analyst@lab-term-02:~$","skill":"vnc-port-audit","knownTools":["ss","grep","netstat","pgrep","systemctl"],"expected":"ss -ltnp | grep 5901","elements":[{"label":"the ss socket tool","any":["ss"]},{"label":"the -ltnp flag bundle","any":["-ltnp"]},{"label":"display port 5901","any":["5901"]}],"output":["LISTEN 0 5  *:5901  *:*  users:((\"Xvnc\",pid=2214,fd=6))","LISTEN 0 5  *:5900  *:*  users:((\"Xvnc\",pid=2214,fd=5))","Both 5900 and 5901 belong to the same Xvnc process, pid 2214."],"syntaxPanel":"ss -ltnp | grep <port>\n  ss     socket statistics\n  -l     listening sockets\n  -t     TCP only\n  -n     numeric ports\n  -p     owning process\n  example on another host: ss -ltnp | grep 5902","sampleOutput":"LISTEN 0 5  *:5902  *:*  users:((\"Xvnc\",pid=1810,fd=6))"},{"id":"e07","type":"logview","title":"Spot the VNC flow","summary":"Read a firewall export and name the VNC session.","scenario":"New analysts keep asking which flows in the morning firewall export are VNC. The export below is one hour from the studio edge. Remember the port families: 5900 and 5901 are VNC displays, 443 is web, 22 is SSH and 3389 is RDP. Filter the panel first, then answer.","question":"Which flow line shows a VNC session to the base display?","hint":"Base display means the lowest of the VNC port numbers.","explanation":"The base display is :0, which listens on 5900, so the 09:31:47 line is the answer. The 5901 lines are display :1 — still VNC, but one display above the base. The 3389 line is RDP and it is even denied, and the 443 lines are ordinary web traffic.\n\nFiltering by port first, then reading the direction, is the habit to build here.","study":"Study VNC display ports: 5900 is :0, each extra display adds one.","filterable":true,"log":{"header":["time","action","flow","service"],"lines":["09:02:11  allow  10[.]88[.]4[.]10:51204 -> 10[.]88[.]9[.]21:443  https","09:14:02  allow  10[.]88[.]4[.]10:51209 -> 10[.]88[.]9[.]21:443  https","09:31:47  allow  10[.]88[.]6[.]15:49312 -> 10[.]88[.]8[.]40:5900  vnc","09:31:52  allow  10[.]88[.]6[.]15:49316 -> 10[.]88[.]8[.]40:5901  vnc","10:02:33  allow  10[.]88[.]4[.]10:51388 -> 10[.]88[.]9[.]21:22   ssh","10:44:05  deny   10[.]88[.]4[.]66:53111 -> 10[.]88[.]8[.]40:3389  rdp","11:12:20  allow  10[.]88[.]6[.]15:49400 -> 10[.]88[.]8[.]40:5901  vnc","11:58:41  allow  10[.]88[.]4[.]10:51501 -> 10[.]88[.]9[.]21:443  https","12:20:09  allow  10[.]88[.]6[.]15:49477 -> 10[.]88[.]8[.]40:5900  vnc"]},"widget":{"type":"mcq","question":"Which flow line shows a VNC session to the base display?","options":["09:31:47 to 10[.]88[.]8[.]40 on 5900","09:31:52 to 10[.]88[.]8[.]40 on 5901","10:44:05 to 10[.]88[.]8[.]40 on 3389","09:02:11 to 10[.]88[.]9[.]21 on 443"],"correct":0}},{"id":"e08","type":"terminal","title":"Name the VNC processes","summary":"List Windows processes whose names contain vnc.","scenario":"The studio's Windows design station design-ws-07 must be checked before a clean-up ticket is closed. You need a read-only list of running processes whose names contain 'vnc'. The simulator only knows the lab toolset shown on the syntax panel, and nothing may be started or stopped.","question":"Run the command that lists running processes filtered to names containing vnc:","hint":"tasklist prints processes; pipe it through findstr with the short pattern.","explanation":"tasklist prints every process and findstr keeps the lines whose text contains 'vnc', so the UltraVNC server (winvnc.exe), the TightVNC server (tvnserver.exe) and the viewer (vncviewer.exe) all appear. A narrower filter like 'winvnc' alone would have missed the other two.\n\nThe command only reads; it starts nothing and stops nothing.","study":"Study tasklist piping into findstr for quick process triage on Windows.","prompt":"C:\\Users\\svc-helpdesk>","skill":"vnc-process-review","knownTools":["tasklist","findstr","netstat","sc","reg"],"expected":"tasklist | findstr vnc","elements":[{"label":"the tasklist process listing","any":["tasklist"]},{"label":"the findstr text filter","any":["findstr"]},{"label":"the vnc name pattern","any":["vnc"]}],"output":["Image Name                 PID Session Name        Session#    Mem Usage","tvnserver.exe              2214 Console                   1     18,432 K","winvnc.exe                 3188 Services                   0     11,204 K","vncviewer.exe              4010 Console                   1      9,120 K","Three VNC programs: two servers and one viewer."],"syntaxPanel":"tasklist | findstr <pattern>\n  tasklist   list running processes\n  |          send output to the next command\n  findstr    keep lines matching the pattern\n  example on another host: tasklist | findstr ssh","sampleOutput":"tvnserver.exe              812  Console                   2     17,900 K"},{"id":"e09","type":"match","title":"Displays and ports","summary":"Match each VNC display number to its port.","scenario":"The studio runs several VNC displays side by side on shared Linux machines. The wall chart lost its port column, so you rebuild it from memory before the next shift starts. Display :0 is the base display, and every further display adds exactly one port above 5900.","question":"Match each VNC display to its listening port:","hint":"Start at 5900 and add one per display number.","explanation":"Display :0 takes 5900, :1 takes 5901, :2 takes 5902 and :3 takes 5903 — the port is always 5900 plus the display number. This arithmetic turns any socket listing into an instant count of how many VNC desktops a host is offering.\n\nMore displays mean more doors, and each door needs its own authentication review.","study":"Study display-to-port arithmetic: 5900 plus the display number.","pairs":[{"left":"Display :0","right":"TCP 5900"},{"left":"Display :1","right":"TCP 5901"},{"left":"Display :2","right":"TCP 5902"},{"left":"Display :3","right":"TCP 5903"}]},{"id":"e10","type":"multi","title":"VNC password facts","summary":"Select every true statement about VNC passwords.","scenario":"A project manager read that VNC passwords are 'weak' and now wants to ban VNC entirely. You must correct the picture with facts before the meeting. Four statements are on the table; keep only the ones that are true for classic VNC authentication as it is deployed in the studio.","question":"Select every true statement about classic VNC authentication:","hint":"One statement claims passwords can be long — check the ceiling first.","explanation":"Classic VNC authentication takes only the first eight characters of a password, so the first option is false exactly because of that ceiling. Servers can be configured with no password at all — dangerous but real. View-only passwords are a genuine feature: watchers see the screen but cannot move the mouse or type.\n\nRemember the ceiling when you assess 'strong' VNC passwords: the ninth character and beyond simply do not count.","study":"Study the eight-character VNC password ceiling and the view-only mode.","options":["A VNC password can be longer than eight characters","Classic VNC auth stops at eight characters","Some servers run with no password configured","View-only passwords let users watch but not type"],"correct":[1,2,3]},{"id":"e11","type":"fill","title":"Auth basics","summary":"Complete the note about VNC password limits and no-auth mode.","scenario":"You annotate the studio wiki page about VNC authentication. The page must state the two facts that surprise people most: the password ceiling and the mode that asks no password at all. Choose the two words from the bank and leave the wrong ones where they are.","question":"Complete the wiki note with terms from the bank:","hint":"One blank is a number written as a word.","explanation":"The classic VNC password check stops at eight characters, and SecurityTypes None skips password checks entirely — those are the two most common VNC weaknesses. Sixteen is wrong for the ceiling, and 'vnc' or 'full' name no real SecurityTypes value here.\n\nWhen a report says 'VNC was open', check whether it means None mode or just a weak password.","study":"Study VNC SecurityTypes values: None, VncAuth and the TLS-wrapped variants.","text":"Classic VNC authentication uses at most ___ characters of the password, and a server set to SecurityTypes ___ asks for no password at all.","blanks":["eight","none"],"bank":["eight","none","sixteen","vnc","full"]},{"id":"e12","type":"mcq","title":"Shadowing the real screen","summary":"Name the tool that shadows an existing Linux display.","scenario":"The support lead wants to watch what a trainee does on the studio's shared Linux machine — the very screen the trainee sees, not a fresh second desktop. You check the VNC tools on the wall card and pick the one that was built for exactly that job.","question":"Which tool and setup matches the lead's request?","hint":"The word 'shadows' points at one specific tool.","explanation":"x11vnc attaches to the active X display, so the viewer sees exactly the trainee's screen — that is session shadowing. A fresh TightVNC virtual display would show an empty desktop instead, and a view-only viewer still needs something to watch. mstsc is the Windows RDP client and does not belong on a Linux X display.\n\nShadowing is why x11vnc shows up in both support use and attack reports.","study":"Study x11vnc: it shadows the existing X display rather than creating one.","options":["x11vnc attached to the active X display","TightVNC opening a fresh virtual display","A viewer started in view-only mode","mstsc connecting to the Windows console"],"correct":0},{"id":"e13","type":"order","title":"A safe VNC setup","summary":"Order the steps of a safe VNC rollout.","scenario":"The studio finally fixes its VNC setup. The plan has four moves and a sensible order matters: decide where it runs, set the passwords, hide the port behind a front door, and keep an eye on it month by month. Put the plan in the order the team should work through it.","question":"Arrange the safe-rollout steps in the order the team should do them:","hint":"You cannot protect what is still installed everywhere.","explanation":"Reducing the install base comes first, because you cannot protect what does not need to exist. Passwords and view-only access come next, then the VPN front door that removes direct 5900 reach, and the monthly review closes the loop. Each step builds on the one before it.\n\nSkipping straight to monitoring would flood the team with alerts about servers that should never have existed.","study":"Study VNC hardening basics: reduce, authenticate, front door, review.","items":["Install the VNC server only on hosts that truly need it","Set a VNC password and give visitors view-only access","Allow VNC only through the VPN instead of open port 5900","Log viewer connections and review the list each month"]},{"id":"e14","type":"fill","title":"Display port arithmetic","summary":"Complete the sentence about display port numbers.","scenario":"A shift note must remind everyone how VNC port numbers grow with each display, using the studio's shared Linux machine as the example. Two numbers are missing from the note and the bank holds five candidates — choose twice and leave the rest.","question":"Complete the shift note with the two port numbers from the bank:","hint":"Base port first, then base plus three.","explanation":"Display :0 takes 5900 and every display adds one, so display :3 listens on 5903. The numbers 5901 and 5902 belong to displays :1 and :2, and 3389 is RDP's port, not VNC's.\n\nThis arithmetic matters when you read listening-socket lists: a host offering both 5900 and 5901 is running two displays.","study":"Study display-to-port arithmetic: 5900 plus the display number.","text":"The first VNC display listens on TCP ___, so on the same host display :3 listens on TCP ___.","blanks":["5900","5903"],"bank":["5900","5903","5901","5902","3389"]},{"id":"e15","type":"logview","title":"Desktop session log","summary":"Read the VNC desktop log and complete the note.","scenario":"One evening of the studio's Linux VNC desktop log is below. The desktop starts, viewers connect and leave, and one attempt fails. Filter the panel, follow the connections in time order, and fill the note at the bottom. The log already names every port and every result you need.","question":"Complete the desktop-log note with the two values from the panel:","hint":"One value is a port; the other is the word for what the second viewer's authentication did.","explanation":"The first line names port 5901 for desktop :1, and the 22:02:09 line says auth failed for viewer 2, the one from 10[.]88[.]4[.]44. Port 5900 belongs to display :0, which this log does not mention, and 'succeeded' describes viewer 1, not the failed attempt.\n\nReading a VNC log is mostly pairing each connection line with the auth result that follows it.","study":"Study VNC server logs: connection lines pair with auth results.","filterable":true,"log":{"header":["time","entry"],"lines":["2024-03-11 21:10:02  vncserver[812]: desktop :1 listening on port 5901","2024-03-11 21:14:19  vncserver[812]: connection from 10[.]88[.]4[.]71","2024-03-11 21:14:21  vncserver[812]: auth succeeded (viewer 1)","2024-03-11 21:31:55  vncserver[812]: viewer 1 disconnected","2024-03-11 22:02:07  vncserver[812]: connection from 10[.]88[.]4[.]44","2024-03-11 22:02:09  vncserver[812]: auth failed (viewer 2)","2024-03-11 22:04:30  vncserver[812]: connection from 10[.]88[.]4[.]71","2024-03-11 22:04:32  vncserver[812]: auth succeeded (viewer 1)","2024-03-11 22:47:12  vncserver[812]: desktop idle, session closed"]},"widget":{"type":"fill","question":"Complete the desktop-log note with the two values from the panel:","text":"The desktop listens on port ___ and the viewer from 10[.]88[.]4[.]44 had its authentication ___.","blanks":["5901","failed"],"bank":["5901","failed","5900","succeeded"]}},{"id":"e16","type":"logview","title":"Viewer history card","summary":"Summarise one helpdesk viewer's morning from history.","scenario":"The studio's viewer keeps a small history file of outgoing connections. One morning of that history is below, with the account and the target on each line. Two accounts share this viewer host, so read the user column before you count anything, or the summary will name the wrong account.","question":"Complete the summary with the two values from the history:","hint":"Count only the lines that name the helpdesk account; the display :1 target belongs to the other account.","explanation":"svc-helpdesk touched studio-ws-03 and mkt-ws-14 — two different targets, even though studio-ws-03 appears three times. Display :1 appears only under studio-jobs, on lab-term-02. Counting four would mean counting every line regardless of account, and svc-helpdesk never used :1.\n\nViewer history is a small artefact, but it answers 'who connected where' without touching the network at all.","study":"Study viewer-side artefacts such as recent-connection history files.","filterable":true,"log":{"header":["time","user","target"],"lines":["08:58:03  svc-helpdesk  studio-ws-03:0","09:02:44  svc-helpdesk  studio-ws-03:0","09:47:10  svc-helpdesk  mkt-ws-14:0","10:15:31  studio-jobs   lab-term-02:1","10:16:02  studio-jobs   lab-term-02:1","11:03:27  svc-helpdesk  studio-ws-03:0","11:44:55  studio-jobs   grc-lab-03:0","12:31:12  svc-helpdesk  mkt-ws-14:0"]},"widget":{"type":"fill","question":"Complete the summary with the two values from the history:","text":"The account svc-helpdesk connected to ___ different target hosts, and display :1 was used only by account ___.","blanks":["two","studio-jobs"],"bank":["two","studio-jobs","four","svc-helpdesk"]}}];

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function norm(s){
  return String(s == null ? "" : s).toLowerCase().replace(/\s+/g," ").replace(/[.,;:!]+$/,"").trim();
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function fmt1(n){ return (Math.round(n * 100) / 100).toFixed(1); }
function wordCount(s){ return String(s || "").split(/\s+/).filter(Boolean).length; }
function $(id){ return document.getElementById(id); }
function byClass(root, cls){ return root.getElementsByClassName(cls); }

var TYPE_LABEL = {
  mcq:  { name: "Single-choice",  desc: "pick the one best answer." },
  multi:{ name: "Multiple-select",desc: "tick every correct option — wrong picks cancel correct ones (partial credit)." },
  match:{ name: "Matching",       desc: "assign each item on the left to its correct partner on the right." },
  order:{ name: "Sequencing",     desc: "put the steps into the correct order (drag, or use the arrow buttons)." },
  fill: { name: "Fill-in-the-blank", desc: "complete each gap — a word bank is provided." },
  terminal: { name: "Terminal simulation", desc: "type a command in the simulated shell, then press Check. Dangerous near-miss commands are flagged." },
  logview:  { name: "Log analysis", desc: "filter a log panel (like Kibana or Splunk), then answer the question below it." },
  decision: { name: "Decision tree", desc: "work through the steps one by one — the final Check grades every step." }
};

/* ==== state ==== */
var S = {
  screen: "intro",
  order: [],
  idx: 0,
  phase: "main",            /* main | review */
  skipList: [],             /* EXAMS indices skipped */
  answers: {},
  checked: {},
  hintsUsed: {},
  score: 0,
  tState: "IDLE",           /* IDLE | RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
  tStateAt: null,
  pausedFrom: null,
  remaining: META.timerMinutes * 60,
  elapsed: 0,
  pauseManual: 0,
  pauseAutoCheck: 0,
  init: null,
  scorePosted: false
};

/* ==== timer ==== */
function setTimerState(next){
  var now = Date.now();
  if(S.tStateAt != null){
    var dt = (now - S.tStateAt) / 1000;
    if(S.tState === "PAUSED_MANUAL") S.pauseManual += dt;
    if(S.tState === "PAUSED_AUTO_CHECK") S.pauseAutoCheck += dt;
  }
  S.tState = next;
  S.tStateAt = now;
  updateHeader();
}
setInterval(function(){
  if(S.tState === "RUNNING"){
    S.remaining -= 1;
    S.elapsed += 1;
    if(S.remaining <= 0){
      S.remaining = 0;
      updateClock();
      finish();
      return;
    }
    updateClock();
  }
}, 1000);
function updateClock(){ var c = $("tb-clock"); if(c) c.textContent = fmtClock(S.remaining); }

/* ==== header ==== */
function sevClass(){ return "sev-" + META.severity; }
function curPos(){ return S.order[S.idx]; }
function answeredCount(){
  var n = 0;
  for(var k in S.checked){ if(Object.prototype.hasOwnProperty.call(S.checked, k)) n++; }
  return n;
}
function pendingSkips(){
  return S.skipList.filter(function(i){ return !S.checked[i]; });
}
function updateHeader(){
  var counter = $("tb-counter"), stateEl = $("tb-state");
  var total = EXAMS.length, done = answeredCount();
  if(S.screen === "exam" || S.screen === "review"){
    counter.textContent = (S.phase === "review" && S.reviewPos >= 0)
      ? ("Review " + (S.reviewPos + 1) + " / " + (S.reviewTotal || pendingSkips().length))
      : ((S.phase === "review") ? ("Review pool: " + pendingSkips().length)
      : ("Exercise " + (S.idx + 1) + " / " + total));
  } else {
    counter.textContent = "Exercises " + done + " / " + total;
  }
  var sev = $("tb-sev");
  sev.className = "badge " + sevClass();
  sev.textContent = META.severity.replace("_", " ");
  updateClock();
  $("tb-scoreval").textContent = fmt1(S.score);
  $("progbar").style.width = (total ? (done / total * 100) : 0) + "%";
  /* state chip */
  if(S.tState === "PAUSED_MANUAL"){
    stateEl.hidden = false;
    stateEl.className = "tb-state manual";
    stateEl.innerHTML = '<span aria-hidden="true">⏸</span> Paused (manual)';
  } else if(S.tState === "PAUSED_AUTO_CHECK"){
    stateEl.hidden = false;
    stateEl.className = "tb-state autocheck";
    stateEl.innerHTML = '<span aria-hidden="true">⏸</span> Auto-paused — checking';
  } else {
    stateEl.hidden = true;
  }
  /* buttons */
  var ex = curPos();
  var inExercise = (S.screen === "exam" || S.screen === "review") && ex != null && S.tState !== "ENDED";
  $("btn-hint").disabled = !inExercise || S.checked[ex] != null || S.hintsUsed[ex] === true;
  $("btn-skip").disabled = !inExercise || S.checked[ex] != null || S.phase === "review";
  $("btn-pause").disabled = !(S.tState === "RUNNING" || S.tState === "PAUSED_AUTO_CHECK");
}

/* ==== postMessage integration ==== */
window.addEventListener("message", function(ev){
  var d = ev.data;
  if(!d || typeof d !== "object") return;
  if(d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT"){
    S.init = d;
    var slot = $("candline");
    if(slot && d.username){
      slot.textContent = "Candidate: " + d.username + (d.country ? " · " + d.country : "");
      slot.style.display = "block";
    }
  }
});
function postScore(){
  if(S.scorePosted) return;
  S.scorePosted = true;
  var rounded = Math.round(S.score);
  var total = 0, i;
  for(i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null) total++;
  }
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var msg = {
    type: "CYBERPULSE_SCORE",
    topicId: META.topicId,
    batch: META.batch,
    score: rounded,
    total: total,
    percent: percent,
    passed: passed
  };
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage(msg, location.origin);
    }
  }catch(e){ /* standalone file:// — no parent handshake */ }
}

/* ==== answer defaults ==== */
function defaultAnswer(ex){
  var i, d;
  switch(ex.type){
    case "mcq": return { sel: -1 };
    case "multi": return { sel: [] };
    case "match":
      d = []; for(i = 0; i < ex.pairs.length; i++) d.push(-1); return { assign: d };
    case "order":
      d = []; for(i = 0; i < ex.items.length; i++) d.push(i);
      return { seq: shuffle(d) };
    case "fill":
      d = []; for(i = 0; i < ex.blanks.length; i++) d.push(""); return { vals: d };
    case "terminal": return { cmd: "" };
    case "logview": return { w: defaultAnswer(ex.widget) };
    case "decision":
      d = []; for(i = 0; i < ex.steps.length; i++) d.push(-1); return { steps: d, cursor: 0 };
  }
  return {};
}
function ensureAnswer(ex, i){
  if(S.answers[i] == null) S.answers[i] = defaultAnswer(ex);
  return S.answers[i];
}

/* ==== render exercise ==== */
function renderExercise(){
  var i = curPos();
  var ex = EXAMS[i];
  S.screen = "exam";
  ensureAnswer(ex, i);
  var m = $("main");
  var res = S.checked[i];
  var lock = res != null;
  var collapsed = !lock && wordCount(ex.scenario) > 70;
  var html = '<section class="excard">';
  /* scenario block */
  html += '<div class="blk blk-scenario"><div class="blk-label"><span class="dot"></span>SCENARIO</div>' +
          '<h3 class="ex-title">' + esc(ex.title) + "</h3>";
  if(collapsed && !lock){
    html += '<p class="summary">' + esc(ex.summary) + '</p><button class="showfull" id="btn-showfull" type="button">▸ Show full scenario</button><div class="scen-body hidden" id="scen-full">' + scenInner(ex) + "</div>";
  } else {
    if(collapsed) html += '<p class="summary">' + esc(ex.summary) + "</p>";
    html += '<div class="scen-body">' + scenInner(ex) + "</div>";
  }
  html += "</div>";
  /* question block */
  html += '<div class="blk blk-question"><div class="blk-label"><span class="dot"></span>QUESTION</div><p class="q-text">' + esc(ex.question) + "</p></div>";
  /* answer block */
  html += '<div class="blk blk-answer"><div class="blk-label"><span class="dot"></span>YOUR ANSWER</div><div id="ansarea">' + "</div></div>";
  /* hint + feedback slots */
  html += '<div id="hintslot"></div><div id="fbslot"></div>';
  /* actions */
  var lastMain = S.phase === "main" && S.idx === S.order.length - 1;
  html += '<div class="actions">' +
    '<button class="btn btn-primary" id="btn-check" type="button">' + (lock ? "✓ Checked" : "Check answer") + "</button>" +
    '<button class="btn" id="btn-next" type="button"' + (lock ? "" : " disabled") + ">" +
      (S.phase === "review" ? "Back to review list" : (lastMain ? "Final submit &amp; results" : "Next exercise")) +
    "</button>" +
    '<span class="ghost-note" id="actnote"></span>' +
    "</div></section>";
  m.innerHTML = html;
  var ansArea = $("ansarea");
  renderByType(ex, ansArea, i, lock, res);
  /* hint */
  if(S.hintsUsed[i]){
    $("hintslot").innerHTML = hintHTML(ex);
  }
  if(lock){
    renderFeedback(i, res);
  } else {
    $("btn-check").addEventListener("click", onCheck);
    var sf = $("btn-showfull");
    if(sf) sf.addEventListener("click", function(){
      $("scen-full").classList.remove("hidden");
      sf.classList.add("hidden");
    });
  }
  $("btn-next").addEventListener("click", onNext);
  updateHeader();
}
function scenInner(ex){
  var out = "";
  var paras = String(ex.scenario).split(/\n\n+/);
  for(var p = 0; p < paras.length; p++) out += "<p>" + esc(paras[p]) + "</p>";
  if(ex.artefacts && ex.artefacts.length){
    for(var a = 0; a < ex.artefacts.length; a++){
      var art = ex.artefacts[a];
      var long = String(art.content || "").split("\n").length > 25;
      out += '<details class="artef"' + (long ? "" : " open") + '><summary>' + esc(art.label) + '</summary><div class="artbody">' + artefactBody(art) + "</div></details>";
    }
  }
  return out;
}
function artefactBody(art){
  if(art.kind === "table"){
    var rows = String(art.content).split("\n");
    var out = '<table class="attable">';
    for(var r = 0; r < rows.length; r++){
      var cells = rows[r].split(" | ");
      out += "<tr>";
      for(var c = 0; c < cells.length; c++){
        out += (r === 0 ? "<th>" : "<td>") + esc(cells[c]) + (r === 0 ? "</th>" : "</td>");
      }
      out += "</tr>";
    }
    return out + "</table>";
  }
  return '<pre class="mono">' + esc(art.content) + "</pre>";
}
function hintHTML(ex){
  return '<div class="hintbox" role="note"><span class="hb">💡 HINT</span>' + esc(ex.hint) +
         '<div class="penaltynote">Hint used — 10% credit penalty applies to this exercise.</div></div>';
}

/* ==== type renderers ==== */
function optionRow(text, idx, chosen, mark, cls){
  return '<button type="button" class="opt ' + (cls || "") + '" data-i="' + idx + '" aria-pressed="' + (chosen ? "true" : "false") + '">' +
    '<span class="mark" aria-hidden="true">' + (mark || "") + "</span><span>" + esc(text) + "</span></button>";
}
function renderByType(ex, area, i, lock, res){
  area.innerHTML = "";
  var ans = ensureAnswer(ex, i);
  var w = document.createElement("div");
  switch(ex.type){
    case "mcq":      renderChoice(ex, w, ans, lock, res, false, ""); break;
    case "multi":    renderChoice(ex, w, ans, lock, res, true, ""); break;
    case "match":    renderMatch(ex, w, ans, lock, res); break;
    case "order":    renderOrder(ex, w, ans, lock, res); break;
    case "fill":     renderFill(ex, w, ans, lock, res, null, ""); break;
    case "terminal": renderTerminal(ex, w, ans, lock, res); break;
    case "logview":  renderLogview(ex, w, ans, lock, res); break;
    case "decision": renderDecision(ex, w, ans, lock, res); break;
  }
  area.appendChild(w);
}
function renderChoice(ex, root, ans, lock, res, isMulti, path){
  var correct = isMulti ? ex.correct : [ex.correct];
  ex.options.forEach(function(opt, oi){
    var chosen = isMulti ? ans.sel.indexOf(oi) !== -1 : ans.sel === oi;
    var mark = "", cls = "";
    if(!lock){
      if(chosen){ mark = isMulti ? "☑" : "◉"; cls = "sel"; }
    } else {
      var isCorr = correct.indexOf(oi) !== -1;
      if(isCorr){ mark = "✓"; cls = "correct"; }
      else if(chosen){ mark = "✗"; cls = "wrong"; }
      else { cls = "dim"; }
    }
    root.insertAdjacentHTML("beforeend", optionRow(opt, oi, chosen, mark, cls));
  });
  var btns = byClass(root, "opt");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      btn.addEventListener("click", function(){
        if(lock) return;
        var oi = parseInt(btn.getAttribute("data-i"), 10);
        if(isMulti){
          var p = ans.sel.indexOf(oi);
          if(p === -1) ans.sel.push(oi); else ans.sel.splice(p, 1);
          btn.classList.toggle("sel");
          btn.setAttribute("aria-pressed", btn.classList.contains("sel") ? "true" : "false");
          btn.querySelector(".mark").textContent = btn.classList.contains("sel") ? "☑" : "";
        } else {
          ans.sel = oi;
          for(var z = 0; z < btns.length; z++){
            btns[z].classList.remove("sel");
            btns[z].setAttribute("aria-pressed", "false");
            var mk = btns[z].querySelector(".mark"); if(mk) mk.textContent = "";
          }
          btn.classList.add("sel");
          btn.setAttribute("aria-pressed", "true");
          btn.querySelector(".mark").textContent = "◉";
        }
      });
    })(btns[b]);
  }
}
function renderMatch(ex, root, ans, lock, res){
  var n = ex.pairs.length;
  var chipSel = -1;
  var html = '<div class="mgrid"><div class="mcol"><h4>Items</h4>';
  for(var z = 0; z < n; z++){
    html += '<div class="mrow"><div class="mleft">' + esc(ex.pairs[z].left) + '</div>' +
            '<button type="button" class="mzone" data-z="' + z + '" aria-label="Assigned value for ' + esc(ex.pairs[z].left) + '">— drop here —</button></div>';
  }
  html += '</div><div class="mbank"><h4>Answer bank</h4>';
  ex.pairs.forEach(function(pr, ri){
    html += '<button type="button" class="mchip" draggable="true" data-r="' + ri + '">' + esc(pr.right) + "</button>";
  });
  html += '</div></div><p class="mhintline">Click a bank item, then click a drop zone — or drag the item onto a zone. Click a filled zone to clear it.</p>';
  root.innerHTML = html;
  var zones = byClass(root, "mzone");
  var chips = byClass(root, "mchip");
  function paint(){
    for(var z = 0; z < n; z++){
      var zz = zones[z];
      var v = ans.assign[z];
      if(v === -1){
        zz.textContent = "— drop here —";
        zz.classList.remove("filled", "correct", "wrong");
      } else {
        zz.textContent = ex.pairs[v].right;
        zz.classList.add("filled");
        if(lock){
          zz.classList.remove("wrong", "correct");
          zz.classList.add(v === z ? "correct" : "wrong");
        }
      }
    }
    for(var c = 0; c < chips.length; c++){
      var used = ans.assign.indexOf(c) !== -1;
      chips[c].classList.toggle("used", used);
      if(used) chips[c].classList.remove("selchip");
    }
  }
  function assign(z, r){
    if(r === -1) return;
    for(var k = 0; k < n; k++){ if(ans.assign[k] === r) ans.assign[k] = -1; }
    ans.assign[z] = r;
    chipSel = -1;
    paint();
  }
  for(var zi = 0; zi < zones.length; zi++){
    (function(z){
      var zz = zones[z];
      zz.addEventListener("click", function(){
        if(lock) return;
        if(chipSel !== -1) assign(z, chipSel);
        else if(ans.assign[z] !== -1){ ans.assign[z] = -1; paint(); }
      });
      zz.addEventListener("dragover", function(e){ if(!lock){ e.preventDefault(); zz.classList.add("dragover"); } });
      zz.addEventListener("dragleave", function(){ zz.classList.remove("dragover"); });
      zz.addEventListener("drop", function(e){
        e.preventDefault(); zz.classList.remove("dragover");
        if(lock) return;
        var r = parseInt(e.dataTransfer.getData("text/plain"), 10);
        if(!isNaN(r)) assign(z, r);
      });
    })(zi);
  }
  for(var ci = 0; ci < chips.length; ci++){
    (function(c){
      var cc = chips[c];
      cc.addEventListener("click", function(){
        if(lock) return;
        if(chipSel === c){ chipSel = -1; cc.classList.remove("selchip"); }
        else {
          chipSel = c;
          for(var k = 0; k < chips.length; k++) chips[k].classList.remove("selchip");
          cc.classList.add("selchip");
        }
      });
      cc.addEventListener("dragstart", function(e){
        e.dataTransfer.setData("text/plain", String(c));
        e.dataTransfer.effectAllowed = "copy";
      });
    })(ci);
  }
  paint();
}
function renderOrder(ex, root, ans, lock, res){
  root.innerHTML = '<div class="obank"><h4>Steps — put them in the correct order</h4><ol class="ordlist"></ol>' +
    '<p class="mhintline">Drag a step onto another step, or use ▲ / ▼.</p></div>';
  var list = root.querySelector(".ordlist");
  function paint(){
    list.innerHTML = "";
    ans.seq.forEach(function(itemIdx, pos){
      var li = document.createElement("li");
      li.className = "orditem";
      li.setAttribute("draggable", "true");
      li.setAttribute("data-pos", String(pos));
      var mark = "";
      if(lock) mark = itemIdx === pos ? " ✓" : "";
      li.innerHTML = '<span class="num">' + (pos + 1) + '</span><span class="txt">' + esc(ex.items[itemIdx]) + mark + "</span>" +
        '<span class="ordbtns"><button type="button" data-mv="up" aria-label="Move up" ' + (lock ? "disabled" : "") + ">▲</button>" +
        '<button type="button" data-mv="down" aria-label="Move down" ' + (lock ? "disabled" : "") + ">▼</button></span>";
      if(lock) li.classList.add(itemIdx === pos ? "correct" : "wrong");
      list.appendChild(li);
      li.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", String(pos)); });
      li.addEventListener("dragover", function(e){ if(!lock) e.preventDefault(); });
      li.addEventListener("drop", function(e){
        e.preventDefault();
        if(lock) return;
        var from = parseInt(e.dataTransfer.getData("text/plain"), 10);
        var to = parseInt(li.getAttribute("data-pos"), 10);
        if(!isNaN(from) && !isNaN(to) && from !== to) move(from, to);
      });
    });
    var btns = list.querySelectorAll("button[data-mv]");
    for(var b = 0; b < btns.length; b++){
      (function(btn){
        btn.addEventListener("click", function(){
          if(lock) return;
          var li = btn.closest(".orditem");
          var pos = parseInt(li.getAttribute("data-pos"), 10);
          var dir = btn.getAttribute("data-mv") === "up" ? pos - 1 : pos + 1;
          if(dir < 0 || dir >= ans.seq.length) return;
          move(pos, dir);
        });

/* ==== grading ==== */
function gradeFillLike(text, blanks, vals){
  var items = [], H = 0, W = 0, N = blanks.length;
  for(var k = 0; k < N; k++){
    var v = norm(vals[k]);
    var ok = v !== "" && v === norm(blanks[k]);
    items.push({ ok: ok, state: v === "" ? "miss" : (ok ? "ok" : "bad"),
      text: v === "" ? ('Blank ' + (k + 1) + ' — missed. Correct: "' + blanks[k] + '"')
        : (ok ? ('Blank ' + (k + 1) + ' — correct: "' + blanks[k] + '"')
        : ('Blank ' + (k + 1) + ' — "' + vals[k] + '" is wrong. Correct: "' + blanks[k] + '"')) });
    if(ok) H++; else if(v !== "") W++;
  }
  return { H: H, W: W, N: N, items: items };
}
function gradeChoiceLike(options, correct, sel, isMulti){
  var items = [], H = 0, W = 0, N = correct.length;
  var selArr = isMulti ? (sel || []) : (sel === -1 ? [] : [sel]);
  for(var c = 0; c < correct.length; c++){
    var ci = correct[c];
    if(selArr.indexOf(ci) !== -1){ items.push({ ok: true, state: "ok", text: "✓ You selected the correct option: " + options[ci] }); H++; }
    else items.push({ ok: false, state: "miss", text: "Missed the correct option: " + options[ci] });
  }
  for(var s = 0; s < selArr.length; s++){
    var si = selArr[s];
    if(correct.indexOf(si) === -1){
      items.push({ ok: false, state: "bad", text: "Wrong selection: " + options[si] });
      W++;
    }
  }
  return { H: H, W: W, N: N, items: items };
}
function grade(ex, ans, hintUsed){
  var g, i;
  switch(ex.type){
    case "mcq":
      g = gradeChoiceLike(ex.options, [ex.correct], ans.sel, false);
      break;
    case "multi":
      g = gradeChoiceLike(ex.options, ex.correct, ans.sel, true);
      break;
    case "match":
      g = { H: 0, W: 0, N: ex.pairs.length, items: [] };
      for(i = 0; i < ex.pairs.length; i++){
        var a = ans.assign[i];
        if(a === -1){ g.items.push({ state: "miss", text: 'Missed: "' + ex.pairs[i].left + '" → correct partner: "' + ex.pairs[i].right + '"' }); }
        else if(a === i){ g.H++; g.items.push({ state: "ok", text: '✓ "' + ex.pairs[i].left + '" → "' + ex.pairs[i].right + '"' }); }
        else { g.W++; g.items.push({ state: "bad", text: 'Wrong: "' + ex.pairs[i].left + '" → you placed "' + ex.pairs[a].right + '", correct: "' + ex.pairs[i].right + '"' }); }
      }
      break;
    case "order":
      g = { H: 0, W: 0, N: ex.items.length, items: [] };
      for(i = 0; i < ex.items.length; i++){
        if(ans.seq[i] === i){ g.H++; g.items.push({ state: "ok", text: "Position " + (i + 1) + " — correct: " + ex.items[i] }); }
        else { g.W++; g.items.push({ state: "bad", text: "Position " + (i + 1) + " — you placed \"" + ex.items[ans.seq[i]] + '", correct: "' + ex.items[i] + '"' }); }
      }
      break;
    case "fill":
      g = gradeFillLike(ex.text, ex.blanks, ans.vals);
      break;
    case "terminal": {
      var cmd = String(ans.cmd || "");
      g = { H: 0, W: 0, N: ex.elements.length, items: [], warn: [], canon: null };
      var low = cmd.toLowerCase();
      if(!cmd){
        g.items.push({ state: "miss", text: "No command was run — nothing to grade." });
      } else {
        for(i = 0; i < ex.elements.length; i++){
          var el = ex.elements[i];
          var hit = false;
          for(var v = 0; v < el.any.length; v++){
            if(low.indexOf(String(el.any[v]).toLowerCase()) !== -1){ hit = true; break; }
          }
          if(hit){ g.H++; g.items.push({ state: "ok", text: "✓ Element matched: " + el.label }); }
          else g.items.push({ state: "miss", text: "Missing element: " + el.label });
        }
        (ex.forbidden || []).forEach(function(f){
          for(var v2 = 0; v2 < f.any.length; v2++){
            if(low.indexOf(String(f.any[v2]).toLowerCase()) !== -1){
              g.warn.push("⚠ DANGEROUS — NEAR MISS: " + f.why);
              break;
            }
          }
        });
      }
      if(g.H < g.N) g.canon = ex.expected;
      break;
    }
    case "logview": {
      var wg;
      if(ex.widget.type === "fill") wg = gradeFillLike(ex.widget.text, ex.widget.blanks, ans.w.vals);
      else if(ex.widget.type === "multi") wg = gradeChoiceLike(ex.widget.options, ex.widget.correct, ans.w.sel, true);
      else wg = gradeChoiceLike(ex.widget.options, [ex.widget.correct], ans.w.sel, false);
      g = { H: wg.H, W: wg.W, N: wg.N, items: wg.items.map(function(it){ return it; }) };
      break;
    }
    case "decision":
      g = { H: 0, W: 0, N: ex.steps.length, items: [] };
      for(i = 0; i < ex.steps.length; i++){
        var st = ex.steps[i];
        if(ans.steps[i] === st.correct){ g.H++; g.items.push({ state: "ok", text: (st.label || "Step " + (i + 1)) + " — correct: " + st.options[st.correct] }); }
        else if(ans.steps[i] === -1){ g.items.push({ state: "miss", text: (st.label || "Step " + (i + 1)) + " — not confirmed. Correct: " + st.options[st.correct] }); }
        else { g.W++; g.items.push({ state: "bad", text: (st.label || "Step " + (i + 1)) + " — wrong. Correct: " + st.options[st.correct] + ". " + st.why }); }
      }
      break;
    default:
      g = { H: 0, W: 0, N: 1, items: [] };
  }
  var raw = g.N > 0 ? Math.max(0, (g.H - g.W) / g.N) : 0;
  var penalty = hintUsed ? 0.10 : 0;
  var credit = Math.max(0, raw - penalty);
  var head = raw >= 0.999 ? "ok" : (raw <= 0.001 ? "bad" : "part");
  var headText = head === "ok" ? "✓ Correct" : (head === "bad" ? "✗ Incorrect" : "✓ Partially correct");
  var res = {
    credit: credit, raw: raw, head: head, headText: headText,
    H: g.H, W: g.W, N: g.N,
    items: g.items || [], warn: g.warn || [], canon: g.canon || null,
    itemsByKey: {}
  };
  if(ex.type === "fill"){
    for(var k1 = 0; k1 < (g.items || []).length; k1++) res.itemsByKey["b" + k1] = g.items[k1].state;
  } else if(ex.type === "logview" && ex.widget.type === "fill"){
    for(var k2 = 0; k2 < (g.items || []).length; k2++) res.itemsByKey["wb" + k2] = g.items[k2].state;
  }
  return res;
}

function startExam(){

  S.idx = 0;
  S.phase = "main";
  setTimerState("RUNNING");
  renderExercise();
}
function onCheckGuard(){ /* reserved */ }
function onNext(){
  if(S.phase === "review"){
    if(S.tState === "PAUSED_AUTO_CHECK") setTimerState("RUNNING");
    showReview();
    return;
  }
  if(S.tState === "PAUSED_AUTO_CHECK") setTimerState("RUNNING");
  if(S.idx < S.order.length - 1){
    S.idx++;
    renderExercise();
  } else {
    if(pendingSkips().length > 0) showReview();
    else finish();
  }
}
function onSkip(){
  if(S.phase === "review") return;
  var i = curPos();
  if(S.checked[i] != null) return;
  if(S.skipList.indexOf(i) === -1) S.skipList.push(i);
  $("actnote") && ($("actnote").textContent = "");
  if(S.idx < S.order.length - 1){
    S.idx++;

  } else {
    if(pendingSkips().length > 0) showReview();
    else finish();
  }
  updateHeader();
}

function finish(){
