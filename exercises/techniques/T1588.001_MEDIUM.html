    ex.bins.forEach(function (b) { binItems[b.id] = []; });
    function itemNode(it) {
      var d = el("div", { class: "dd-item", draggable: "true", "data-iid": it.id, tabindex: "0", role: "button", "aria-label": "Item: " + it.text + ". Press Enter to pick up, then choose a bin." });
      d.appendChild(el("span", { text: it.text }));
      var rm = el("button", { class: "dd-return hidden", type: "button", text: "✕", "aria-label": "Return item to bank" });
      rm.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var b = placement[it.id];
        if (b) { var arr = binItems[b]; arr.splice(arr.indexOf(it.id), 1); delete placement[it.id]; }
        bankItems[it.id] = true;
        pickedId = null;
        draw();
      });
      d.appendChild(rm);
      d.addEventListener("click", function () {
        if (placement[it.id]) return;
        pickedId = pickedId === it.id ? null : it.id;
        draw();
      });
      d.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); d.click(); }
      });
      d.addEventListener("dragstart", function (ev) { ev.dataTransfer.setData("text/plain", it.id); d.classList.add("dragging"); });
      d.addEventListener("dragend", function () { d.classList.remove("dragging"); });
      return d;
    }
    var placement = {};
    ex.items.forEach(function (it) { bankItems[it.id] = true; });
    var bankOrder = (disp && disp.length ? disp.slice() : ex.items.map(function (i) { return i.id; }));
    var bins = {};
    ex.bins.forEach(function (b) {
      var bin = el("div", { class: "dd-bin", tabindex: "0", role: "button", "aria-label": "Bin: " + b.label + ". Press Enter to place the picked item here." });
      bin.addEventListener("click", function () {
        if (!pickedId) return;
        placement[pickedId] = b.id;
        delete bankItems[pickedId];
        binItems[b.id].push(pickedId);
        pickedId = null;
        draw();
        var cb = $("#btn-check"); if (cb) cb.disabled = false;
      });
      bin.addEventListener("keydown", function (ev) { if (ev.key === "Enter") bin.click(); });
      bin.addEventListener("dragover", function (ev) { ev.preventDefault(); bin.classList.add("drag-over"); });
      bin.addEventListener("dragleave", function () { bin.classList.remove("drag-over"); });
      bin.addEventListener("drop", function (ev) {
        ev.preventDefault();
        var iid = ev.dataTransfer.getData("text/plain");
        if (!iid) return;
        var from = placement[iid];
        if (from) { var arr = binItems[from]; arr.splice(arr.indexOf(iid), 1); }
        delete bankItems[iid];
        placement[iid] = b.id;
        binItems[b.id].push(iid);
        pickedId = null;
        draw();
        var cb = $("#btn-check"); if (cb) cb.disabled = false;
      });
      bins[b.id] = bin;
      binsWrap.appendChild(bin);
    });
    function draw() {
      bank.innerHTML = "";
      bank.appendChild(el("h4", { text: "Items to place", style: "margin:0 0 6px;font-size:13px;color:var(--text-secondary);letter-spacing:1px" }));
      var any = false;
      bankOrder.forEach(function (iid) {
        if (!bankItems[iid]) return;
        any = true;
        var it = ex.items.filter(function (x) { return x.id === iid; })[0];
        var n = itemNode(it);
        if (pickedId === iid) n.classList.add("picked");
        bank.appendChild(n);
      });
      if (!any) bank.appendChild(el("p", { class: "dd-empty-hint", text: "All items placed. Press Check to grade." }));
      ex.bins.forEach(function (b) {
        var bin = bins[b.id];
        bin.innerHTML = "";
        bin.appendChild(el("h4", { text: b.label }));
        binItems[b.id].forEach(function (iid) {
          var it = ex.items.filter(function (x) { return x.id === iid; })[0];
          var n = itemNode(it);
          n.querySelector(".dd-return").classList.remove("hidden");
          bin.appendChild(n);
        });
        if (!binItems[b.id].length) bin.appendChild(el("p", { class: "dd-empty-hint", text: "Drop here" }));
      });
    }
    draw();
    wrap.appendChild(bank); wrap.appendChild(binsWrap);
    node.appendChild(wrap);
    W = {
      selection: function () {
        var sel = [], corr = [], items = [];
        var hits = 0, wrong = 0, base = 0;
        ex.items.forEach(function (it) {
          var p = placement[it.id];
          if (p) sel.push(it.id);
          var ok = p === it.bin;
          corr.push(it.id); /* display: N = every item */
          if (p) { if (ok) hits += 1; else wrong += 1; } /* scoring: H = correct placed, W = wrong placed, N = every item */
          var binLabel = function (bid) { var bb = ex.bins.filter(function (x) { return x.id === bid; })[0]; return bb ? bb.label : "(not placed)"; };
          items.push({
            state: ok ? "correct" : (p ? "wrong" : "missed"),
            text: it.text + " → " + binLabel(it.bin),
            why: (ex.why && ex.why[it.id]) || ""
          });
        });
        base = Math.max(0, (hits - wrong) / Math.max(1, ex.items.length));
        return { selected: sel, correct: corr, items: items, base: base };
      }
    };
    return { node: node, onReady: function () { var cb = $("#btn-check"); if (cb) cb.disabled = true; } };
  }

  function widgetTerminal(ex, idx) {
    var node = el("div", { class: "widget" });
    if (ex.syntaxReminder) {
      var sp = el("div", { class: "syntax-panel" }, [el("h5", { text: "SYNTAX REMINDER" })]);
      var ul = el("ul");
      ex.syntaxReminder.forEach(function (l) { ul.appendChild(el("li", { html: l })); });
      sp.appendChild(ul);
      node.appendChild(sp);
    }
    var term = el("div", { class: "term", role: "region", "aria-label": "Simulated terminal" });
    var scroll = el("div", { class: "term-scroll" });
    var input = el("input", { class: "term-input", type: "text", "aria-label": "Terminal command input", autocomplete: "off", spellcheck: "false", placeholder: "type the command and press Enter" });
    var run = el("button", { class: "btn", text: "Run ▸", "aria-label": "Run command in simulated terminal" });
    (ex.welcome || ["Simulated shell — nothing here is real."]).forEach(function (l) {
      scroll.appendChild(el("div", { class: "term-line", html: "<span class='t-cmt' style='color:var(--text-secondary)'>" + esc(l) + "</span>" }));
    });
    function normCmd(c) {
      return String(c || "").trim().replace(/\s+/g, " ").toLowerCase();
    }
    function runCmd() {
      var c = input.value;
      if (!c.trim()) return;
      scroll.appendChild(el("div", { class: "term-line", html: "<span class='t-prompt'>" + esc(ex.promptUser + "@" + ex.promptHost) + ":~$</span> <span class='t-cmd'>" + esc(c) + "</span>" }));
      (ex.simOutput && ex.simOutput.length ? ex.simOutput : ["(simulated output — nothing really executed)"]).forEach(function (l) {
        scroll.appendChild(el("div", { class: "term-line", html: highlightLog(l) }));
      });
      if (ex.expectedShape) {
        ex.expectedShape.forEach(function (l) {
          scroll.appendChild(el("div", { class: "term-line", html: "<span style='color:var(--text-secondary)'>" + esc(l) + "</span>" }));
        });
      }
      scroll.scrollTop = scroll.scrollHeight;
      input.value = "";
    }
    input.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); runCmd(); } });
    run.addEventListener("click", runCmd);
    term.appendChild(scroll);
    term.appendChild(el("div", { class: "term-inputrow" }, [el("span", { class: "term-prompt", text: ex.promptUser + "@" + ex.promptHost + ":~$" }), input, run]));
    node.appendChild(term);
    W = {
      selection: function () {
        /* grade the LAST command the learner ran (kept in input history) */
        var lines = $$(".term-line", scroll);
        var lastCmd = "";
        for (var i = lines.length - 1; i >= 0; i--) {
          var c = lines[i].querySelector(".t-cmd");
          if (c) { lastCmd = c.textContent; break; }
        }
        var norm = normCmd(lastCmd);
        var sel = [], corr = [], items = [];
        var hits = 0, wrong = 0, total = 0, base = 0;
        var dangerHit = ex.dangerous && ex.dangerous.match && new RegExp(ex.dangerous.match, "i").test(norm);
        (ex.elements || []).forEach(function (e) {
          var re = new RegExp(e.match, "i");
          var hit = re.test(norm);
          if (!e.penalty) total += 1; /* N = every required element */
          if (hit && e.penalty) {
            wrong += 1; /* a matched penalty element is a wrong selection: it subtracts */
            items.push({ state: "wrong", text: e.label, why: e.why || "" });
          } else if (hit) {
            hits += 1;
            sel.push(e.id); corr.push(e.id);
            items.push({ state: "correct", text: e.label, why: e.why || "" });
          } else {
            corr.push(e.id);
            items.push({ state: "missed", text: e.label, why: e.why || "" });
          }
        });
        if (dangerHit) {
          wrong += 1; /* the dangerous catch-all counts as one wrong selection */
          items.push({ state: "wrong", text: "Dangerous action", why: ex.dangerous.note || "" });
        }
        base = Math.max(0, (hits - wrong) / Math.max(1, total));
        return { selected: sel, correct: corr, items: items, dangerHit: dangerHit, lastCmd: lastCmd, base: base };
      }
    };
    return { node: node };
  }

  /* ---------------- branch ---------------- */
  function wireBranch(ex, idx) {
    var btn = $("#btn-confirm-step");
    function refresh() {
      btn.disabled = !W || !W.stepPicked;
    }
    var dispKey = idx + ":s" + Attempt.branchStep;
    var disp = Attempt.optionOrders[dispKey];
    var step = ex.steps[Attempt.branchStep];
    var isMulti = !!step.multi;
    var node = el("div", { class: "widget" });
    var host = $("#exam-main .blk-answer");
    host.appendChild(node);
    var picked = {};
    disp.forEach(function (oid, i) {
      var o = step.options.filter(function (x) { return x.id === oid; })[0];
      var row = choiceRow(o, String.fromCharCode(65 + i), isMulti, function (id, btnEl) {
        if (isMulti) {
          picked[id] = !picked[id];
          btnEl.setAttribute("aria-checked", picked[id] ? "true" : "false");
          btnEl.classList.toggle("selected", !!picked[id]);
        } else {
          Object.keys(picked).forEach(function (k) { picked[k] = false; });
          $$(".opt-row", node).forEach(function (r) { r.setAttribute("aria-checked", "false"); r.classList.remove("selected"); });
          picked[id] = true;
          btnEl.setAttribute("aria-checked", "true");
          btnEl.classList.add("selected");
        }
        W.stepPicked = Object.keys(picked).some(function (k) { return picked[k]; });
        refresh();
      });
      node.appendChild(row);
    });
    W = {
      stepPicked: false,
      selection: function () {
        var sel = Object.keys(picked).filter(function (k) { return picked[k]; });
        return { selected: sel, correct: isMulti ? step.correct : [step.correct] };
      }
    };
    btn.addEventListener("click", function () {
      var s = W.selection();
      var okNow = scoreExercise(s.selected, s.correct) === 1;
      Attempt.branchResults.push(okNow);
      if (Attempt.branchStep < ex.steps.length - 1) {
        Attempt.branchStep += 1;
        renderExercise(); /* timer keeps running: no auto-pause on intermediate steps */
      } else {
        /* final Check of the branch: grade all steps at once */
        onCheck(ex, idx);
      }
    });
    refresh();
  }


  /* ---------------- hint ---------------- */
  function useHint() {
    var idx = Attempt.currentIdx();
    if (Attempt.hintUsed[idx]) return;
    var ex = EXERCISES[idx];
    Attempt.hintUsed[idx] = true;
    $("#btn-hint").disabled = true;
    var fb = $("#feedback-area");
    var box = el("div", { class: "fb-card partial", role: "status" }, [
      el("p", { class: "fb-head", html: "<span aria-hidden='true'>💡</span> HINT <span class='fb-sub'>(−0.10 credit on this exercise)</span>" }),
      el("div", { class: "fb-block fb-why" }, [el("p", { text: ex.hint })])
    ]);
    fb.innerHTML = "";
    fb.appendChild(box);
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  /* ---------------- check / feedback ---------------- */
  function onCheck(ex, idx) {
    Timer.onCheck(); /* FIRST action: auto-pause before feedback */
    $("#btn-skip").disabled = true;
    $("#btn-check-skip") && ($("#btn-check-skip").disabled = true);

    var res, base;
    if (ex.type === "branch") {
      res = {
        selected: Attempt.branchResults.map(function (v, i) { return "s" + i; }),
        correct: Attempt.branchResults.map(function (v, i) { return "s" + i; }), /* display: N = every step (credit line reads k/N steps); scoring is computed directly below */
        items: ex.steps.map(function (st, i) {
          return {
            state: Attempt.branchResults[i] ? "correct" : "wrong",
            text: "Step " + (i + 1) + ": " + st.question,
            why: st.why || ""
          };
        }),
        lastCmd: null
      };
      /* every step was answered: H = correct steps, W = wrong steps,
         N = every step -> credit = max(0, (H - W) / N) per the scoring contract */
      var stepsN = Attempt.branchResults.length;
      var stepsH = 0;
      Attempt.branchResults.forEach(function (v) { if (v) stepsH += 1; });
      base = Math.max(0, (stepsH - (stepsN - stepsH)) / Math.max(1, stepsN));
    } else {
      res = W.selection();
      base = (typeof res.base === "number") ? res.base : scoreExercise(res.selected, res.correct);
    }
    var penalty = Attempt.hintUsed[idx] ? 0.10 : 0;
    var credit = Math.max(0, base - penalty);
    credit = Math.round(credit * 100) / 100;
    Attempt.credits[idx] = credit;
    Attempt.answered[idx] = true;
    renderScore(); /* live score updates in the same frame as the feedback block */

    var fb = $("#feedback-area");
    fb.innerHTML = "";
    var label, cls;
    if (credit >= 1) { label = "✓ CORRECT"; cls = "correct"; }
    else if (credit > 0) { label = "✓ PARTIALLY CORRECT"; cls = "partial"; }
    else { label = "✗ INCORRECT"; cls = "incorrect"; }
    if (res.dangerHit) { label = "✗ DANGEROUS — NEAR MISS"; cls = "danger"; }
    var N = res.correct.length;
    var creditLine = N > 1
      ? "credit " + credit.toFixed(2) + " — " + res.items.filter(function (i) { return i.state === "correct"; }).length + "/" + N + " items" + (penalty ? " (includes −0.10 hint penalty)" : "")
      : (penalty ? "credit " + credit.toFixed(2) + " (includes −0.10 hint penalty)" : "");
    var card = el("div", { class: "fb-card " + cls }, [
      el("p", { class: "fb-head", html: "<span aria-hidden='true'>" + (credit >= 1 || (credit > 0 && !res.dangerHit) ? "✓" : "✗") + "</span> " + label + " <span class='fb-credit'>" + creditLine + "</span>" })
    ]);
    if (N > 1) {
      var t = el("table", { class: "items-table" });
      res.items.forEach(function (it) {
        var ic = it.state === "correct" ? "✓ Correct" : (it.state === "wrong" ? "✗ Wrong" : "○ Missed");
        var cl = it.state === "correct" ? "correct" : (it.state === "wrong" ? "wrong" : "missed");
        t.appendChild(el("tr", {}, [
          el("td", { class: "it-state " + cl, html: "<span aria-hidden='true'>" + ic.slice(0, 1) + "</span> " + ic.slice(2) }),
          el("td", {}, [el("b", { text: it.text }), it.why ? el("div", { class: "fb-study", text: it.why }) : null])
        ]));
      });
      card.appendChild(t);
    } else {
      var right = res.items.filter(function (i) { return i.state === "correct"; })[0];
      var wrongs = res.items.filter(function (i) { return i.state === "wrong" || i.state === "missed"; });
      if (right) card.appendChild(el("p", { html: "<b style='color:var(--state-correct)'>✓ Correct answer:</b> " + esc(right.text) }));
      if (wrongs.length && cls !== "correct") {
        wrongs.forEach(function (wrow) {
          card.appendChild(el("p", { html: "<b style='color:var(--state-" + (wrow.state === "wrong" ? "incorrect" : "skipped") + ")'>" + (wrow.state === "wrong" ? "✗ Your answer:" : "○ You left unanswered:") + "</b> " + esc(wrow.text) }));
        });
      }
    }
    var expl = el("div", { class: "fb-block" }, [
      el("h5", { text: "Why" }),
      el("p", { class: "fb-why", text: ex.explanation })
    ]);
    card.appendChild(expl);
    if (ex.type === "terminal") {
      expl.appendChild(el("h5", { text: "Canonical command" }));
      expl.appendChild(el("div", { class: "codeblock", text: ex.expected }));
      var ul = el("ul", { class: "fb-study", style: "padding-left:18px;margin:6px 0" });
      (ex.elements || []).forEach(function (e2) { ul.appendChild(el("li", { html: "<span class='mono' style='color:var(--text-mono)'>" + esc(e2.label) + "</span> — " + esc(e2.why || "") })); });
      expl.appendChild(ul);
      if (res.dangerHit) expl.appendChild(el("p", { class: "fb-study", html: "<b style='color:var(--state-incorrect)'>⚠ This command was dangerous:</b> " + esc(ex.dangerous.note || "") }));
    }
    if (ex.study) {
      expl.appendChild(el("h5", { text: "What to study" }));
      expl.appendChild(el("p", { class: "fb-study", html: "<b>Study:</b> " + esc(ex.study) }));
    }
    fb.appendChild(card);

    /* next / submit buttons */
    var actions = el("div", { class: "action-row" });
    var isLast = Attempt.pos >= Attempt.order.length - 1;
    var nextLabel = ex.type === "branch" ? "Next ▸" : (Attempt.reviewMode ? "◂ Back to review" : (isLast ? "Final Submit ▸" : "Next ▸"));
    var nb = el("button", { class: "btn btn-primary", id: "btn-next", text: nextLabel, "aria-label": "Continue to next exercise" });
    nb.addEventListener("click", onNext);
    actions.appendChild(nb);
    fb.appendChild(actions);
    disableWidgetInput();
    nb.focus();
    fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  function disableWidgetInput() {
    $$("#exam-main .opt-row, #exam-main .match-select, #exam-main .fill-input, #exam-main .order-btns button, #exam-main .dd-item, #exam-main .dd-bin, #exam-main .term-input, #exam-main .term button").forEach(function (n) {
      n.disabled = true;
      n.classList.add("dim");
      n.style.pointerEvents = "none";
    });
    var cb = $("#btn-check"); if (cb) cb.disabled = true;
    var sb = $("#btn-skip"); if (sb) sb.disabled = true;
  }

  /* ---------------- navigation ---------------- */
  function onNext() {
    Timer.onNext(); /* resume timer after feedback review */
    var ex = EXERCISES[Attempt.currentIdx()];
    var isLast = Attempt.pos >= Attempt.order.length - 1;
    if (Attempt.reviewMode) {
      Attempt.skipped = Attempt.skipped.filter(function (i) { return i !== Attempt.currentIdx() || !Attempt.answered[Attempt.currentIdx()]; });
      openSkippedReview();
      return;
    }
    if (isLast) {
      if (Attempt.skipped.length) openSkippedReview();
      else finalSubmit();
      return;
    }
    Attempt.pos += 1;
    prepExercise(Attempt.currentIdx());
    renderExercise();
  }
  function skipExercise() {
    if ($("#btn-skip") && $("#btn-skip").disabled) return;
    var idx = Attempt.currentIdx();
    if (Attempt.answered[idx]) return;
    if (Attempt.reviewMode) {
      openSkippedReview();
      return;
    }
    Attempt.skipped.push(idx);
    var isLast = Attempt.pos >= Attempt.order.length - 1;
    if (isLast) { openSkippedReview(); return; }
    Attempt.pos += 1;
    prepExercise(Attempt.currentIdx());
    renderExercise();
  }
  function prepExercise(idx) {
    var ex = EXERCISES[idx];
    if ((ex.type === "qcm" || ex.type === "multi") && !Attempt.optionOrders[idx]) {
      Attempt.optionOrders[idx] = shuffle(ex.options.map(function (o) { return o.id; }));
    }
    if (ex.type === "match" && !Attempt.optionOrders[idx]) {
      Attempt.optionOrders[idx] = shuffle(ex.right.map(function (r) { return r.id; }));
    }
    if (ex.type === "order" && !Attempt.optionOrders[idx]) {
      Attempt.optionOrders[idx] = []; /* order widget shuffles internally once */
      Attempt.optionOrders[idx] = shuffle(ex.items.map(function (i) { return i.id; }));
    }
    if (ex.type === "dd" && !Attempt.optionOrders[idx]) {
      Attempt.optionOrders[idx] = shuffle(ex.items.map(function (i) { return i.id; }));
    }
    if (ex.type === "branch") prepBranch(ex, idx);
  }
  function prepBranch(ex, idx) {
    Attempt.branchStep = 0;
    Attempt.branchResults = [];
    ex.steps.forEach(function (st, si) {
      var k = idx + ":s" + si;
      if (!Attempt.optionOrders[k]) Attempt.optionOrders[k] = shuffle(st.options.map(function (o) { return o.id; }));
    });
  }

  /* ---------------- skipped review ---------------- */
  function openSkippedReview() {
    Attempt.reviewMode = true;
    showScreen("#screen-skipped");
    var root = $("#screen-skipped");
    root.innerHTML = "";
    root.appendChild(el("h2", { html: "<span aria-hidden='true'>⏭</span> Review skipped exercises", style: "margin:16px 0 6px" }));
    root.appendChild(el("p", { class: "muted", style: "color:var(--text-secondary)", text: "These exercises were skipped. Answer them now, or leave them unanswered — unanswered exercises are excluded from your score. The timer keeps running while this screen is open." }));
    var list = el("ul", { class: "skip-list" });
    if (!Attempt.skipped.length) {
      list.appendChild(el("li", { class: "skip-item", html: "<span class='s-text'>No skipped exercises left. You can submit now.</span>" }));
    }
    Attempt.skipped.slice().sort(function (a, b) { return a - b; }).forEach(function (idx, i) {
      var ex = EXERCISES[idx];
      var li = el("li", { class: "skip-item" });
      li.appendChild(el("span", { class: "s-no", text: "S" + (i + 1) }));
      li.appendChild(el("span", { class: "s-text", text: ex.id + " — " + (ex.scenario || "").slice(0, 90) + "…" }));
      li.appendChild(el("span", { class: "badge", style: "color:" + sev.color + ";border-color:" + sev.color, text: sev.label }));
      li.appendChild(el("button", { class: "btn", text: "Answer now", "aria-label": "Answer skipped exercise " + (i + 1) }));
      list.appendChild(li);
      li.querySelector("button").addEventListener("click", function () {
        Attempt.reviewIdx = idx;
        Attempt.pos = Attempt.order.indexOf(idx);
        prepBranchIfNeeded(ex, idx);
        renderExercise();
        showScreen("#screen-exam");
      });
    });
    root.appendChild(list);
    var actions = el("div", { class: "action-row" }, [
      el("button", { class: "btn btn-primary btn-large", id: "btn-final-submit", text: "■ Final Submit", "aria-label": "Submit exam and see results" })
    ]);
    root.appendChild(actions);
    $("#btn-final-submit").addEventListener("click", finalSubmit);
    renderScore();
  }
  function prepBranchIfNeeded(ex, idx) {
    if (ex.type === "branch") prepBranch(ex, idx);
  }

  /* ---------------- results ---------------- */
  function endByTimeout() {
    Timer.setState(TS.ENDED);
    finalSubmit(true);
  }
  function finalSubmit(fromTimeout) {
    if (!fromTimeout) Timer.setState(TS.ENDED);
    renderResults();
    showScreen("#screen-results");
  }
  function renderResults() {
    var sum = Attempt.creditSum();
    var n = Attempt.answeredCount();
    var pct = n ? Math.round((sum / n) * 100) : 0;
    var passed = pct >= META.passMark;
    var fully = 0, partial = 0, partSum = 0, incorrect = 0;
    Object.keys(Attempt.credits).forEach(function (k) {
      var c = Attempt.credits[k];
      if (c >= 1) fully++;
