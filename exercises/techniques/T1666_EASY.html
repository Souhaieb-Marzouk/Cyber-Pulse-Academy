<style>

  --text-primary:#e6ecff; --text-secondary:#a9b4d0; --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff; --accent-amber:#ffb454; --accent-green:#57d38c;
  --state-correct:#57d38c; --state-partial:#ffb454; --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0; --state-paused:#9d7bff;
  --sev-easy:#57d38c; --sev-medium:#ffb454; --sev-hard:#ff8a3d; --sev-extreme:#ff6b6b;
  --syn-key:#79b8ff; --syn-str:#a5d6a7; --syn-num:#ffcb6b; --syn-date:#9d7bff; --syn-user:#f2a4c0; --syn-dim:#93a1c4;

html{color-scheme:dark;}
html,body{background:var(--bg-page);color:var(--text-primary);}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.55;}
code,pre,.mono{font-family:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",Menlo,monospace;}
code{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:.92em;color:var(--text-mono);}
.hidden{display:none!important;}
.view{max-width:1000px;margin:0 auto;padding:18px 16px 64px;}
a{color:var(--accent-blue);}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px;}
button,select,input{font:inherit;color:inherit;}
button{cursor:pointer;}
h1,h2,h3{line-height:1.25;}
/* severity badge colour is driven by body class */
body.sev-easy{--sev-c:var(--sev-easy);}
body.sev-medium{--sev-c:var(--sev-medium);}
body.sev-hard{--sev-c:var(--sev-hard);}
body.sev-extreme{--sev-c:var(--sev-extreme);}
/* ---------- top bar ---------- */
#topbar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,var(--bg-topbar-1) 0%,var(--bg-topbar-2) 100%);border-bottom:1px solid var(--border);box-shadow:var(--shadow);}
.tb-row{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;}
.tb-id{font-weight:700;letter-spacing:.02em;}
.tb-sub{color:var(--text-secondary);font-size:.86em;}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--bg-surface);border-radius:999px;padding:5px 12px;min-height:34px;font-size:.86em;white-space:nowrap;}
.chip .lbl{color:var(--text-secondary);}
.sev-badge{border:1px solid var(--sev-c);color:var(--sev-c);background:var(--tint-white);font-weight:700;letter-spacing:.06em;}
.timer-chip{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;}
.timer-chip .tval{font-size:1.05em;color:var(--text-primary);font-weight:700;}
.timer-chip .tstate{color:var(--text-secondary);}
.timer-chip.t-running .tstate{color:var(--accent-green);}
.timer-chip.t-paused .tstate{color:var(--state-paused);}
.timer-chip.t-ended .tstate{color:var(--state-skipped);}
.score-chip .sval{color:var(--text-primary);font-weight:700;}
.score-chip .spct{color:var(--text-secondary);}
.btn{border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-primary);border-radius:8px;padding:9px 16px;min-height:44px;transition:background .15s,border-color .15s,transform .05s;}
.btn:hover{background:var(--bg-hover);border-color:var(--border-hover);}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{border-color:var(--accent-blue);background:var(--tint-blue);}
.btn-primary:hover{background:var(--tint-blue-strong);}
.btn-go{border-color:var(--accent-green);background:var(--tint-green);}
.btn-go:hover{background:var(--tint-green-strong);}
.btn-warn{border-color:var(--accent-amber);color:var(--accent-amber);background:var(--tint-amber);}
.btn-pause{border-color:var(--state-paused);color:var(--state-paused);background:var(--tint-purple);}

.pbar-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--accent-blue),var(--sev-c));position:relative;transition:width .35s ease;}
.pbar-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,var(--sheen) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 2.8s linear infinite;}

.intro-hero{background:linear-gradient(135deg,var(--bg-hero-1) 0%,var(--bg-hero-2) 70%);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px;}

.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px;}
.card>h2{margin:0 0 10px;font-size:1.12em;display:flex;align-items:center;gap:9px;}
.card>h2 .ic{display:inline-flex;width:26px;height:26px;border-radius:6px;align-items:center;justify-content:center;font-size:.85em;background:var(--tint-blue);color:var(--accent-blue);border:1px solid var(--tint-blue-border);}
.kw-theme{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin:10px 0;}

.kw-items{margin:0;padding-left:20px;color:var(--text-secondary);}

.howlist{margin:8px 0 0;padding-left:22px;color:var(--text-secondary);}

.block{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin:0 0 16px;overflow:hidden;}
.block-head{display:flex;align-items:center;gap:10px;padding:10px 16px;font-weight:700;letter-spacing:.08em;font-size:.82em;text-transform:uppercase;border-bottom:1px solid var(--border);}
.block-head .bh-ic{font-size:1.1em;}

.block-question .block-head{color:var(--accent-amber);background:linear-gradient(90deg,var(--tint-amber),transparent 60%);border-left:3px solid var(--accent-amber);}
.block-answer .block-head{color:var(--accent-green);background:linear-gradient(90deg,var(--tint-green),transparent 60%);border-left:3px solid var(--accent-green);}
.block-body{padding:16px 18px;}
.block-question .block-body{font-weight:700;font-size:1.05em;}
.collapser{margin-left:auto;font-size:.85em;text-transform:none;letter-spacing:0;color:var(--text-secondary);background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;min-height:44px;}

.artefact-head{display:block;font-family:ui-monospace,Consolas,monospace;font-size:.78em;letter-spacing:.06em;color:var(--accent-blue);padding:7px 12px;border-bottom:1px solid var(--border);background:var(--tint-blue-2);}
.artefact-body{padding:10px 14px;}

.artefact-body table{border-collapse:collapse;width:100%;font-size:.92em;margin:6px 0;}
.artefact-body th,.artefact-body td{border:1px solid var(--border);padding:5px 9px;text-align:left;vertical-align:top;}
.artefact-body th{color:var(--text-secondary);background:var(--tint-white);font-weight:600;}
/* mono log lines + syntax */
.logline{font-family:ui-monospace,Consolas,monospace;font-size:14px;color:var(--text-mono);white-space:pre-wrap;word-break:break-word;padding:2px 0;border-bottom:1px dotted var(--border-dim);}
.logline:last-child{border-bottom:none;}
.lk{color:var(--syn-key);}.ls{color:var(--syn-str);}.ln{color:var(--syn-num);}.ld{color:var(--syn-date);}.lu{color:var(--syn-user);}.lm{color:var(--syn-dim);}
.logv-filter{display:flex;gap:8px;align-items:center;margin:0 0 8px;}
.logv-filter input{flex:1;background:var(--bg-page);border:1px solid var(--border);border-radius:8px;padding:9px 12px;min-height:44px;color:var(--text-primary);}
.logv-filter .flbl{font-size:.8em;color:var(--text-secondary);letter-spacing:.05em;}
.logv-lines{max-height:300px;overflow:auto;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:8px 12px;}

.opts{display:flex;flex-direction:column;gap:10px;}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;min-height:48px;transition:background .15s,border-color .15s;}

.opt.sel::after{content:"◉ Selected";margin-left:auto;color:var(--accent-blue);font-size:.78em;font-family:ui-monospace,Consolas,monospace;white-space:nowrap;padding-top:2px;}
.opt .ot{flex:1;}
.opt .ot code{white-space:pre-wrap;}
/* selects (match / blank / triage) */
.selrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:10px 14px;margin:8px 0;}
.selrow .sr-l{flex:1;min-width:220px;}
select{background:var(--bg-page);border:1px solid var(--border);border-radius:8px;padding:8px 12px;min-height:44px;min-width:180px;color:var(--text-primary);max-width:100%;}
.blank-text{font-size:1.02em;line-height:2;}
.blank-text select{margin:0 4px;}
/* order list */
.ordr{display:flex;flex-direction:column;gap:8px;}
.ordr-item{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.ordr-item .opos{font-family:ui-monospace,Consolas,monospace;color:var(--accent-blue);font-weight:700;min-width:30px;text-align:center;}
.ordr-item .otxt{flex:1;}
.ordr-btns{display:flex;gap:6px;}
.ordr-btns button{background:var(--bg-page);border:1px solid var(--border);border-radius:6px;min-width:44px;min-height:44px;color:var(--text-secondary);font-size:1em;}
.ordr-btns button:hover{color:var(--text-primary);border-color:var(--border-hover);}
/* drag & drop */
.dnd-wrap{display:flex;flex-wrap:wrap;gap:16px;}
.dnd-bank{flex:1 1 240px;min-width:230px;}
.dnd-zones{flex:1.4 1 300px;min-width:260px;display:flex;flex-direction:column;gap:12px;}
.dnd-item{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:8px 0;cursor:grab;touch-action:none;user-select:none;}
.dnd-item.dragging{opacity:.55;border-style:dashed;}
.dnd-item.picked{border-color:var(--accent-blue);box-shadow:0 0 0 1px var(--accent-blue) inset;}
.dnd-item .asg{display:block;margin-top:6px;font-size:.8em;color:var(--accent-green);font-family:ui-monospace,Consolas,monospace;}
.dnd-bucket{border:1.5px dashed var(--border);border-radius:8px;padding:10px 14px;min-height:96px;background:var(--bg-surface-2);}
.dnd-bucket h4{margin:0 0 8px;font-size:.9em;color:var(--text-secondary);}
.dnd-bucket.over{border-color:var(--accent-blue);background:var(--tint-blue-2);}
.dnd-bucket.over::after{content:"⬇ Drop here";display:block;font-size:.8em;color:var(--accent-blue);font-family:ui-monospace,Consolas,monospace;}
.dnd-hint{font-size:.82em;color:var(--text-secondary);margin:6px 0;}
/* terminal */
.term{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.term-head{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);color:var(--text-secondary);font-size:.8em;font-family:ui-monospace,Consolas,monospace;}
.term-dot{width:10px;height:10px;border-radius:50%;background:var(--state-partial);display:inline-block;}
.term-scroll{max-height:280px;overflow:auto;padding:12px 14px;font-family:ui-monospace,Consolas,monospace;font-size:14px;color:var(--text-mono);}
.term-line{white-space:pre-wrap;word-break:break-word;}
.term-in{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);padding:10px 14px;}
.term-in .pr{color:var(--accent-green);font-family:ui-monospace,Consolas,monospace;font-size:14px;white-space:nowrap;}
.term-in input{flex:1;background:transparent;border:none;color:var(--text-mono);font-family:ui-monospace,Consolas,monospace;font-size:14px;min-height:44px;}
.term-in input:focus-visible{outline:2px solid var(--accent-blue);border-radius:4px;}
.syntax-panel{background:var(--bg-surface-2);border:1px solid var(--border);border-left:3px solid var(--accent-amber);border-radius:8px;padding:12px 16px;margin:10px 0;font-size:.92em;}
.syntax-panel h4{margin:0 0 6px;font-size:.85em;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-amber);}
.syntax-panel pre{margin:6px 0;padding:10px 12px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text-mono);font-size:13.5px;overflow:auto;}
.timer-note{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--state-paused);color:var(--state-paused);border-radius:6px;padding:4px 10px;font-size:.85em;margin:8px 0;}
/* feedback */
.fb{border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-surface);margin:0 0 16px;overflow:hidden;}
.fb-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:11px 16px;font-weight:700;letter-spacing:.05em;border-bottom:1px solid var(--border);}
.fb-ok .fb-head{color:var(--state-correct);background:var(--tint-green);border-left:3px solid var(--state-correct);}
.fb-part .fb-head{color:var(--state-partial);background:var(--tint-amber);border-left:3px solid var(--state-partial);}
.fb-bad .fb-head{color:var(--state-incorrect);background:var(--tint-red);border-left:3px solid var(--state-incorrect);}
.fb-credit{font-family:ui-monospace,Consolas,monospace;font-size:.9em;color:var(--text-secondary);font-weight:400;}
.fb-body{padding:14px 18px;}
.fbitems{margin:10px 0;padding:0;list-style:none;}
.fbitem{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:9px 13px;margin:7px 0;font-size:.94em;}
.fbitem .fi-ic{font-weight:700;min-width:20px;}
.fbitem.st-ok{color:var(--state-correct);}
.fbitem.st-bad{color:var(--state-incorrect);}
.fbitem.st-miss{color:var(--text-secondary);}
.fbitem .fi-why{color:var(--text-secondary);font-weight:400;}
.fb-why{border-top:1px dashed var(--border);margin-top:12px;padding-top:12px;color:var(--text-secondary);}
.fb-why .why-t{color:var(--text-primary);font-weight:700;display:block;margin-bottom:6px;}
.fb-danger{display:flex;gap:10px;border:1px solid var(--state-incorrect);background:var(--tint-red);color:var(--state-incorrect);border-radius:8px;padding:10px 14px;margin:10px 0;font-weight:700;}
.canon{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:10px 0;}

.canon pre{margin:0;color:var(--text-mono);font-size:14px;white-space:pre-wrap;word-break:break-word;}
.canon-parts{margin:8px 0 0;padding-left:20px;color:var(--text-secondary);font-size:.92em;}
.canon-parts li{margin:3px 0;}
.study-tip{border:1px solid var(--accent-amber);background:var(--tint-amber);border-radius:8px;padding:10px 14px;margin-top:12px;color:var(--text-secondary);}
.study-tip b{color:var(--accent-amber);}

.rv-item{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:11px 14px;margin:9px 0;}

.rv-item .rv-t{flex:1;min-width:220px;}

.res-hero.pass{border-color:var(--state-correct);box-shadow:0 0 24px var(--tint-green);}
.res-hero.fail{border-color:var(--state-incorrect);box-shadow:0 0 24px var(--tint-red);}

.res-cell .rn{font-size:1.5em;font-weight:800;}

.time-cell{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:9px 14px;font-size:.9em;color:var(--text-secondary);}

.exnav .spacer{flex:1;}
.footer-note{color:var(--text-secondary);font-size:.85em;margin-top:8px;}

  .pbar-fill::after{animation:none;display:none;}
  *{transition:none!important;}
}
@media (max-width:720px){
  .view{padding:12px 10px 50px;}
  .tb-row{padding:8px 10px;}
  .chip{padding:4px 9px;font-size:.82em;}
  .block-body{padding:13px 12px;}
  .card{padding:16px 14px;}
}

meta:{topicId:'t1666',batch:1,title:'T1666 Modify Cloud Resource Hierarchy — EASY',difficulty:'easy',questionCount:17,estimatedMinutes:25,passMark:70,sevKey:'easy',sevName:'EASY',objId:'T1666',objName:'Modify Cloud Resource Hierarchy',timerSeconds:1800},
intro:{
learn:'<p>Welcome! In this exam you will learn about one cloud attack called <b>T1666 — Modify Cloud Resource Hierarchy</b>.</p><p>This is a <b>Technique</b> in the MITRE ATT&amp;CK framework. ATT&amp;CK is a big catalogue of the ways real attackers work. A technique describes <i>one thing an attacker does</i>. Here, that thing is: changing the way a cloud company groups its resources, so that defenses stop working.</p><p>Imagine a big cloud platform like AWS or Azure. Companies put their cloud things into groups. AWS groups <b>accounts</b> under one <b>organization</b>. Azure groups <b>subscriptions</b> under <b>management groups</b>. Policies (rules) sit on top of these groups and protect everything inside them. An attacker who can add, move or delete these groups can slip out of the rules.</p><p>You will meet this object in real work: <b>SOC analysts</b> triage the alerts it raises; <b>detection engineers</b> build rules for APIs like <code>LeaveOrganization</code> and <code>CreateAccount</code>; <b>cloud engineers</b> turn on settings that block dangerous changes; <b>GRC analysts</b> write the control into policy documents; <b>incident responders</b> put the hierarchy back after an attack; and <b>red teamers</b> copy the attack to test whether defenses hold. The risk it addresses: attackers hide their compute, keep using the victim’s resources, and the victim’s logs go quiet.</p>',
keywords:[
{theme:'Technique basics',items:['T1666 — Modify Cloud Resource Hierarchy','Technique object in ATT&amp;CK Enterprise','Tactic: Defense Impairment (TA0112)','Platform: IaaS','Goal: evade defenses']},
{theme:'Cloud hierarchies',items:['AWS Organizations and member accounts','Service Control Policies (guardrails)','Management account hygiene — no workloads at the top','Azure management groups and subscriptions','Resource groups']},
{theme:'Adversary moves',items:['LeaveOrganization — cut an account out of the org','CreateAccount — a fresh account under the org','New subscription created with a Global Administrator','Subscription hijacking — transfer to another tenant','Losing visibility — no logs on the victim side']},
{theme:'Defender basics',items:['M1018 User Account Management (least privilege)','M1047 Audit the hierarchy','M1054 Software Configuration (SCP / transfer-blocking policy)','Cloud Service Modification telemetry','DET0155 — watch LeaveOrganization, CreateAccount, transfers']}],
how:'<ul class="howlist"><li><b>Pass mark: 70%.</b> A PASS means you master the basics of T1666. A FAIL means you should retake this exam.</li><li><b>Exercise types in this file:</b> multiple choice, fill-in-the-blank with a shuffled word bank, matching pairs, drag-and-drop zones, a small SOC alert queue, an ordering task, a log viewer, and one guided terminal command.</li><li><b>Timer:</b> you get a 30 minute countdown. 💡 <b>Hint</b> gives a nudge and costs −10% of that exercise’s credit (one hint per exercise). ⏸ <b>Pause</b> is a real break — the exercise is hidden while you rest.</li><li><b>Check pauses the timer:</b> when you press ✓ Check, the timer stops at once. The feedback stays on screen as long as you want. The timer runs again only when you press Next.</li><li><b>Partial credit:</b> exercises with several items give fractional credit: (correct items − wrong items) ÷ total items. Selecting everything is not a winning move.</li><li><b>Skipping:</b> ⚠ Skip moves an exercise to a skipped pool without revealing the answer. Before you finish, you can return to every skipped exercise while the timer still runs. Skipped-and-never-answered exercises are simply excluded from your score.</li><li>Press <b>Start</b> when you are ready. Good luck!</li></ul>'
},
exercises:[
{id:'e1',type:'qcm',summary:'ID card — match the technique ID T1666 to its name',
scenario:['Your team lead sends you a one-line task: “We got an ATT&amp;CK mapping from an audit. Technique T1666 — tell me what it is.” She attaches this card.'],
artefacts:[{label:'ATT&amp;CK technique card',html:'<table><tr><th>Field</th><th>Value</th></tr><tr><td>ID</td><td><code>T1666</code></td></tr><tr><td>Object type</td><td>Technique (Enterprise)</td></tr><tr><td>Platforms</td><td>IaaS</td></tr><tr><td>Tactic</td><td>Defense Impairment (TA0112)</td></tr><tr><td>Sub-techniques</td><td>None</td></tr></table>'}],
question:'Which <b>name</b> belongs to technique ID <code>T1666</code>?',
options:[
{t:'Modify Cloud Resource Hierarchy',correct:true,why:'T1666 is Modify Cloud Resource Hierarchy: changing how an IaaS provider groups resources, to weaken defenses.'},
{t:'Modify Cloud Authentication Settings',why:'A similar-sounding name, but T1666 is about the resource hierarchy, not about authentication.'},
{t:'Transfer Data to Cloud Storage',why:'That is data movement. T1666 does not move data — it changes the grouping of cloud resources.'},
{t:'Modify System Firewall Rules',why:'Firewall changes belong to other techniques. T1666 targets the hierarchy itself.'}],
hint:'The name says almost word for word what the technique does: it modifies the cloud resource hierarchy.',
explain:'T1666 is <b>Modify Cloud Resource Hierarchy</b>. In ATT&amp;CK, every technique has one fixed ID and one fixed name, so mapping reports stay unambiguous. The card confirms the facts you will use through this whole exam: platform IaaS, tactic Defense Impairment (TA0112), and no sub-techniques. <b>Attacker view:</b> change the grouping to slip out of the rules. <b>Defender view:</b> watch the grouping for changes that nobody approved.'},

{id:'e2',type:'blank',summary:'Azure grouping — which container holds subscriptions?',
scenario:['A colleague asks: “In Azure, where do I attach a policy so it reaches many subscriptions at once?” You open the Azure resource-organization page your team uses.'],
artefacts:[{label:'Azure docs — organize your resources (excerpt)',html:'<p>Hierarchies differ among cloud providers. In Azure, multiple <b>subscriptions</b> can be grouped under a single object. Policies applied at that level reach every subscription below it.</p>'}],
text:'In Azure, multiple subscriptions can be grouped under a single <code>{0}</code>. Policies applied there reach every subscription below it.',
bank:['management group','resource group','security group','billing profile'],
correct:['management group'],
hint:'The container sits above subscriptions — its name starts with “management”.',
explain:'Azure groups subscriptions under <b>management groups</b>, and policies inherit downward. AWS groups accounts under an <b>organization</b>. Remember both words: these are exactly the two hierarchies that T1666 attacks. A change at the top touches everything below, which is why attackers love the top.'},

{id:'e3',type:'qcm',summary:'Which tactic column holds T1666?',
scenario:['You are filling the tactic column of a coverage dashboard. The row for T1666 is still empty.'],
artefacts:[{label:'ATT&amp;CK matrix columns (excerpt, v19+)',html:'<p>Reconnaissance · Resource Development · Initial Access · Execution · Persistence · Privilege Escalation · <b>Stealth</b> · <b>Defense Impairment</b> · Credential Access · Discovery · Lateral Movement · Collection · Command and Control · Exfiltration · Impact</p>'}],
question:'Which tactic does <code>T1666</code> belong to?',
options:[
{t:'Defense Impairment (TA0112)',correct:true,why:'Removing or escaping guardrails is breaking a control, so T1666 lives in Defense Impairment.'},
{t:'Stealth (TA0005)',why:'Stealth means blending in without breaking anything. T1666 changes the hierarchy itself.'},
{t:'Credential Access',why:'Credential Access is about stealing passwords and tokens — not this technique.'},
{t:'Collection',why:'Collection is about gathering data. T1666 gathers nothing.'}],
hint:'This tactic is the one where defenses are not fooled — they are actively broken or bypassed.',
explain:'Since ATT&amp;CK v19 (April 2026) the old Defense Evasion tactic is split in two: <b>Stealth</b> (blend in) and <b>Defense Impairment</b> (break or bypass controls). T1666 v2.0 sits in <b>Defense Impairment (TA0112)</b>: leaving an organization removes its guardrails, so a defense is directly weakened, not just deceived.'},

{id:'e4',type:'blank',summary:'The goal of T1666 in one word',
scenario:['A trainee wrote a flashcard but left one word out. The first sentence of the ATT&amp;CK description reads:'],
artefacts:[{label:'T1666 description — first sentence',html:'<p>“Adversaries may attempt to modify hierarchical structures in infrastructure-as-a-service (IaaS) environments in order to <b>[ one word ]</b> defenses.”</p>'}],
text:'Adversaries may attempt to modify hierarchical structures in infrastructure-as-a-service (IaaS) environments in order to <code>{0}</code> defenses.',
bank:['evade','improve','document','measure'],
correct:['evade'],
hint:'The attacker wants defenses to stop working — the word means “to get around them”.',
explain:'The word is <b>evade</b>. The whole technique exists so that policies, detections and guardrails that worked yesterday stop covering the attacker today. Every concrete move you will learn next — leaving an organization, creating an account, transferring a subscription — serves that single goal.'},

{id:'e5',type:'match',summary:'AWS hierarchy words and what they mean',
scenario:['Your mentor wrote three AWS words on the whiteboard. Match each word to its plain meaning so the whole team reads the same language.'],
lefts:['AWS Organization','Service Control Policy (SCP)','AWS management account'],
rights:['Groups many AWS accounts under one payer and one rule set','A guardrail policy that limits what member accounts may do','The top account that should hold no workloads'],
correct:[0,1,2],
why:['The organization is the umbrella: accounts join it and inherit its rules.','SCPs are the guardrails an attacker escapes by leaving the organization.','Best practice says keep the top account clean — M1047 audits check exactly this.'],
hint:'These three words are the AWS building blocks: the umbrella, the guardrail, and the top box.',
explain:'These three objects are the AWS half of the T1666 story. The <b>organization</b> groups accounts; <b>SCPs</b> are its guardrails; the <b>management account</b> sits at the top. An attacker who changes any of these relationships (leave the org, land above the guardrails, hide workloads at the top) is doing T1666.'},

items:['The LeaveOrganization API','Management groups over subscriptions','Service Control Policies','A pay-as-you-go subscription transfer between tenants'],
buckets:['AWS world','Azure world'],
assign:[0,1,0,1],
hint:'Two facts are AWS names, two are Azure names — sort them by vocabulary.',
explain:'<code>LeaveOrganization</code> and SCPs belong to <b>AWS Organizations</b>. Management groups and subscription transfers belong to <b>Azure</b>. T1666 works on both platforms: the page lists AWS moves (leave the org, create an account) and Azure moves (create a subscription, transfer one to another tenant). Knowing which vocabulary belongs to which provider keeps your detection rules accurate.'},

{id:'e7',type:'match',summary:'API call → what changes',
scenario:['The detection team keeps a mini-table on the wall: action on the left, immediate effect on the right. Rebuild it.'],
lefts:['<code>LeaveOrganization</code>','<code>CreateAccount</code>','Subscription transfer'],
rights:['The account is severed from the org; SCPs and guardrails stop applying','A new account appears; it may not be covered by existing detections or SCPs','The subscription moves to another tenant; logs stop on the victim side'],
correct:[0,1,2],
why:['Leaving removes the guardrails that the organization imposed.','A fresh account starts outside the tuned detections and the SCP set.','After a transfer the compute runs under the attacker tenant, so the victim tenant logs nothing.'],
hint:'Read each effect as the answer to “what changed one second after the call?”.',
explain:'These are the three moves the T1666 page names. <b>Attacker view:</b> each move buys freedom from one control — guardrails, detections, or victim visibility. <b>Defender view:</b> each move leaves a trace — an org API call, a new account object, a transfer event — and DET0155 watches exactly those traces.'},

{id:'e8',type:'qcm',summary:'Why a brand-new subscription helps the attacker',
scenario:['An attacker already holds a Global Administrator account in the victim Azure tenant. Instead of touching old resources, they create a brand-new subscription.'],
question:'What is the <b>main benefit</b> for the attacker?',
options:[
{t:'The new subscription is a clean area, so existing detections and watch lists may not cover it',correct:true,why:'A fresh subscription starts with no tuned watchers, no baselines and no playbooks pointed at it.'},
{t:'The new subscription makes the victim logs louder',why:'The attacker wants the opposite — less noise about themselves, not more.'},
{t:'The new subscription automatically copies every existing policy onto itself',why:'The problem is the reverse: existing coverage may simply not reach the new area.'},
{t:'The new subscription gives the attacker unlimited free credit',why:'There is no unlimited free credit. The benefit is weaker coverage, not free money.'}],
hint:'Think about what “brand-new” means for anything that was tuned on the old footprint.',
explain:'<b>Attacker view:</b> a new subscription is an empty room — the security tooling, baselines and alerts that guard the old rooms were never pointed at this one. <b>Defender view:</b> any subscription creation by a Global Administrator outside a tracked change window is a T1666 signal worth checking. The ATT&amp;CK page names this exact move: a Global Administrator creating new subscriptions in which to deploy resources.'},

{id:'e9',type:'blank',summary:'Subscription hijacking in two words',
scenario:['Finish the two-sentence definition of subscription hijacking for the team wiki.'],
text:'In subscription hijacking, the attacker moves a pay-as-you-go subscription from the victim tenant to the <code>{0}</code> tenant. After the move, the victim tenant shows <code>{1}</code> for everything the attacker runs there.',
bank:['adversary’s','no logs','victim’s','full logs','loud alerts'],
correct:['adversary’s','no logs'],
why:['The subscription now belongs to the attacker tenant.','That is the whole point of the hijack: the victim sees nothing.'],
hint:'First blank: who ends up owning the subscription? Second blank: what does the victim see of the attacker’s compute?',
explain:'Subscription hijacking = transferring a victim’s pay-as-you-go subscription into a tenant the attacker owns. The attacker then uses the victim’s compute resources <b>without generating logs on the victim tenant</b>. That is why this move is dangerous: the resource is still billed to the victim’s payment instrument, but its activity is invisible on the victim side.'}
,

'<span class="lk">eventResult</span>=<span class="ls">"success"</span>  <span class="lk">readOnly</span>=<span class="ls">false</span>']},
question:'Look at the <code>eventName</code> field. What happened here?',
options:[

hint:'The event source is organizations.amazonaws.com and the call is not read-only — it changed the organization.',

{id:'e11',type:'drag',summary:'T1666 behaviour or a different technique?',
scenario:['Two alerts landed at once and a trainee asked which one is T1666. Sort the four behaviours.'],
items:['Creating a new Azure subscription with a stolen Global Admin account','Stopping the EDR agent on a server','Transferring a subscription to an attacker-owned tenant','Deleting Windows event logs'],

hint:'T1666 always touches the cloud grouping — accounts, subscriptions, hierarchy. Everything else lives elsewhere.',

{id:'e12',type:'match',summary:'Match each mitigation to what it does',
scenario:['The GRC team lists three mitigation IDs in the T1666 report. Match each to its job.'],
lefts:['<code>M1018</code> User Account Management','<code>M1047</code> Audit','<code>M1054</code> Software Configuration'],
rights:['Give people only the cloud rights they really need','Regularly check that only expected accounts and subscriptions exist','Turn on settings that block dangerous changes, like SCPs or transfer-blocking policies'],
correct:[0,1,2],
why:['Least privilege shrinks who can change the hierarchy at all.','The audit finds unexpected items, especially near the top of the hierarchy.','Configuration settings can directly forbid the dangerous API calls and transfers.'],
hint:'One is about people’s rights, one is about looking, one is about settings that forbid.',
explain:'All three mitigations on the T1666 page are preventive in flavour. <b>M1018</b> shrinks the set of principals who can add, delete or modify hierarchy objects. <b>M1047</b> finds surprises — unexpected accounts or subscriptions, especially close to the top. <b>M1054</b> forbids the moves themselves: an SCP that blocks <code>LeaveOrganization</code>, an Azure policy that blocks subscription transfers.'},

{id:'e13',type:'qcm',summary:'Spot the least-privilege break',
scenario:['An auditor pulls the platform team’s permission entries and asks you to point at the problem line before the report goes out.'],
artefacts:[{label:'Permission entries (excerpt)',html:'<pre>1  principal: role/platform-engineer   action: organizations:Describe*\n2  principal: role/platform-engineer   action: organizations:*\n3  principal: role/billing-bot         action: ce:GetCost*</pre>'}],
question:'Which line breaks least privilege (<code>M1018</code>) for hierarchy changes?',
options:[
{t:'Line 2 — the wildcard organizations:* allows adding, deleting or modifying hierarchy objects',correct:true,why:'A full wildcard on the Organizations service means the role could call LeaveOrganization or CreateAccount.'},
{t:'Line 1 — Describe is too much reading',why:'Read-only Describe calls are the normal, safe part of an engineer’s job.'},
{t:'Line 3 — billing bots must never read costs',why:'A billing bot reading cost data is exactly its job.'},
{t:'None — all three lines are fine',why:'Line 2 gives full hierarchy power to a general engineer role — that is the finding.'}],
hint:'Look for the action that does not limit what the caller may do with the whole Organizations service.',
explain:'<b>M1018</b> says: limit permissions to add, delete or modify resource groups to only those required. Line 2 grants <code>organizations:*</code>, which quietly includes <code>LeaveOrganization</code> and <code>CreateAccount</code> — the two T1666 APIs. This is how over-broad roles turn a normal engineer account into a hierarchy weapon.'},

{id:'e14',type:'blank',summary:'The M1054 settings that forbid the moves',
scenario:['Complete the hardening sentence for the cloud runbook.'],
text:'A strong M1054 setup uses an Azure <code>{0}</code> that blocks subscription transfers, and an AWS SCP that blocks the <code>LeaveOrganization</code> call.',

correct:['policy'],
hint:'The Azure object that expresses “this is not allowed in this tenant” and is assigned at management-group level.',
explain:'The T1666 page names both settings under <b>M1054 Software Configuration</b>: in Azure, a policy that blocks subscription transfers; in AWS, a Service Control Policy that prevents <code>LeaveOrganization</code>. These are cheap, preventive controls — they forbid the moves instead of chasing them after the fact.'},

{id:'e15',type:'triage',summary:'SOC queue — three quick calls',
scenario:['It is your first shift on the cloud queue. Classify each alert with one decision.'],

{title:'Alert A — CloudTrail',body:'<code>eventName: LeaveOrganization</code> on the production account, Saturday afternoon, no change ticket anywhere.',
options:[{t:'Suspicious — T1666 behaviour, verify now',correct:true,why:'An untracked leave on production is exactly what DET0155 exists for.'},{t:'Routine maintenance',why:'Nothing routine about it: no ticket, weekend, and it removes guardrails.'},{t:'A billing notification',why:'This is a hierarchy API call, not a billing event.'}]},
{title:'Alert B — Azure Activity Log',body:'A policy named <code>deny-subscription-transfer</code> was deployed at the top management group by the platform team, with an approved change record.',
options:[{t:'Benign — a defensive change',correct:true,why:'Blocking transfers is the exact M1054 control the page recommends.'},{t:'Suspicious — hierarchy attack',why:'The change strengthens the hierarchy instead of escaping it, and it is tracked.'},{t:'Account hijack',why:'No account was taken over here.'}]},
{title:'Alert C — cost bot',body:'The monthly cost report was emailed to the finance team. No cloud resources were changed.',
options:[{t:'Benign — no cloud change at all',correct:true,why:'No hierarchy object was touched, so T1666 is not in play.'},{t:'Suspicious hierarchy change',why:'There is no change here — just an email.'},{t:'Immediate CISO escalation',why:'Escalating a report email wastes the CISO’s trust in the queue.'}]}],
hint:'Ask one question per alert: did any account, subscription or hierarchy object change without approval?',
explain:'<b>Attacker view:</b> the queue is noise until a hierarchy API call appears — that is when the attacker’s move becomes visible. <b>Defender view:</b> Alert A matches the DET0155 watch-list (<code>LeaveOrganization</code>), Alert B strengthens the environment, Alert C changes nothing. Triage is mostly about knowing which events touch the hierarchy.'},

{id:'e16',type:'order',summary:'Azure hierarchy from top to bottom',
scenario:['A new joiner drew the Azure hierarchy upside down on the whiteboard. Fix it: put the levels from the top of the hierarchy down to the bottom.'],
items:['Management group','Subscription','Resource group'],
hint:'Policies inherit downward, so put the broadest, highest container first.',
explain:'The Azure stack reads top-down: <b>management group → subscription → resource group</b>. Policies inherit downward, which is why an attacker who changes the top (or escapes it) changes the rules for everything below — and why M1047 audits look “especially close to the top of the hierarchy”.'},

{id:'e17',type:'terminal',summary:'Guided shell — list every account in the AWS Organization',

simMatch:'aws organizations (list-accounts|describe-organization)',

required:[{re:'(^|\\s)aws(\\s|$)',label:'the aws CLI program'},{re:'(^|\\s)organizations(\\s|$)',label:'the organizations service'},{re:'(^|\\s)list-accounts(\\s|$)',label:'the list-accounts operation'}],
wrong:[{re:'delete|remove|leave|close|detach|attach',label:'a state-changing operation',why:'An audit is read-only. Any operation that changes the organization does not belong here.'}],
dangerous:[{re:'delete-organization|remove-account-from-organization|leave-organization|detach-policy|attach-policy|create-account',label:'a state-changing API',why:'Creating or deleting accounts during an audit would falsify your own evidence.'}],
canonical:'aws organizations list-accounts',
parts:[{label:'aws',why:'The AWS command-line program.'},{label:'organizations',why:'The service that owns the hierarchy.'},{label:'list-accounts',why:'The read-only operation that lists every account in the organization — exactly what the M1047 audit needs.'}],
hint:'You already saw the shape: aws + the service + the operation. The operation name literally means “list the accounts”.',
explain:'<code>aws organizations list-accounts</code> is the read-only listing that feeds the M1047 audit: you compare its rows against the CMDB and confirm only expected accounts exist. <b>Defender view:</b> the same listing is your DET0155 baseline — a rogue <code>CreateAccount</code> later shows up as a row nobody expected. <b>Attacker view:</b> the attacker avoids this operation entirely, because it changes nothing and hides nothing — they use <code>CreateAccount</code> instead.'}
]};

function tick(){
  var t=S.timer;
  if(t.state==='RUNNING'){ t.remaining--; if(t.remaining<=0){t.remaining=0;renderTop();endByTimeout();return;} }
  else if(t.state==='PAUSED_MANUAL'){ S.pausedManualSec++; }
  else if(t.state==='PAUSED_AUTO_CHECK'){ S.pausedAutoSec++; }
  renderTop();
}
function endByTimeout(){ setState('ENDED'); if(S._int)clearInterval(S._int); openResults(true); }
function showVeil(on){ $('#pauseVeil').classList.toggle('hidden',!on); }

/* ---------------- score ---------------- */
function scoreExercise(H,W,N){ var c=(H-W)/N; if(c<0)c=0; if(c>1)c=1; return c; }
function liveScore(){
  var sum=0,cnt=0; for(var k in S.credits){ sum+=S.credits[k]; cnt++; }
  var pct=cnt>0?Math.round(sum/cnt*100):0;
  return {sum:sum,cnt:cnt,pct:pct};
}
function totalAnswerable(){ return S.order.length; }

/* ---------------- reporting + handshake ---------------- */
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  var o=location.origin||'';
  var realSite=o && o!=='null' && o.indexOf('file:')!==0; /* opened directly on file: -> same-origin target */
  var target=realSite?o:'/'; /* never '*' */
  try{
    parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,
      score:Math.round(creditSum),total:answeredCount,percent:percent,passed:percent>=META.passMark},target);
  }catch(e){/* opened directly — nothing to report to */}
}
window.addEventListener('message',function(ev){
  var d=ev.data; if(!d)return;
  if(d.type!=='CYBERPULSE_INIT'&&d.type!=='CYBERMASTERY_INIT')return;
  if(d.username)S.username=d.username;
  /* theme is always 'dark' by contract — the file is dark-only, nothing to switch */
});

/* ---------------- views ---------------- */
function showView(v){
  ['introView','examView','reviewView','resultsView'].forEach(function(id){
    $('#'+id).classList.toggle('hidden',id!==v);
  });
  window.scrollTo(0,0);
}

/* ---------------- top bar ---------------- */
function timerStateLabel(){
  var t=S.timer;
  if(t.state==='RUNNING')return {cls:'t-running',html:'<span class="tstate">▶ RUNNING</span>'};
  if(t.state==='PAUSED_MANUAL')return {cls:'t-paused',html:'<span class="tstate">⏸ PAUSED — manual (press Resume)</span>'};
  if(t.state==='PAUSED_AUTO_CHECK')return {cls:'t-paused',html:'<span class="tstate">⏸ PAUSED — reviewing feedback (resumes on Next)</span>'};
  return {cls:'t-ended',html:'<span class="tstate">■ ENDED</span>'};
}

  var tt=timerStateLabel();

  var ls=liveScore();

  var p=$('#tbPct'); if(p)p.textContent=ls.pct+'%';

  var sk=$('#tbSkip'); if(sk)sk.disabled=(S.timer.state==='ENDED')||!!(S.order[S.idx] in S.credits);
  var hb=$('#tbHint'); if(hb)hb.disabled=!!S.hinted[S.order[S.idx]]||(S.timer.state==='ENDED')||!!(S.order[S.idx] in S.credits);
}

/* ---------------- exam flow ---------------- */
function startExam(){
  resetAttempt();
  showView('examView');
  S.idx=0;
  setState('RUNNING');
  startTicker();
  renderEx();
}
function resetAttempt(){
  S.order=shuffle(EXAM.exercises.map(function(e,i){return i;}));
  S.credits={}; S.hinted={}; S.skipped=[]; S.reviewMode=false; S.reportFired=false;
  S.pausedManualSec=0; S.pausedAutoSec=0;
  S.timer.state='RUNNING'; S.timer.prev='RUNNING'; S.timer.remaining=META.timerSeconds;
  if(S._int)clearInterval(S._int);
  $('#exMain').innerHTML='';
}
function retake(){ startExam(); }

function onHint(){
  var id=S.order[S.idx]; if(id==null||S.hinted[id])return;
  var ex=EXAM.exercises[id]; if(!ex)return;
  S.hinted[id]=true; renderTop();
  var hp=$('#hintPanel');
  if(hp){ hp.classList.remove('hidden'); hp.scrollIntoView({block:'nearest'}); return; }
  var p=el('div','syntax-panel','<h4>💡 Hint — costs 10% of this exercise&rsquo;s credit</h4><div>'+ex.hint+'</div>');
  p.id='hintPanel';
  var ans=$('#ansBlock .block-body'); if(ans)ans.parentNode.insertBefore(p,ans.nextSibling);
}
function onPause(){
  var t=S.timer;
  if(t.state==='RUNNING'||t.state==='PAUSED_AUTO_CHECK'){ setState('PAUSED_MANUAL'); showVeil(true); }
  else if(t.state==='PAUSED_MANUAL'){ setState(t.prev==='PAUSED_AUTO_CHECK'?'PAUSED_AUTO_CHECK':'RUNNING'); showVeil(false); }
}
function onSkip(){
  var id=S.order[S.idx]; if(id==null)return;
  if(!(id in S.credits)&&S.skipped.indexOf(id)<0)S.skipped.push(id);
  if(S.idx>=totalAnswerable()-1){ showReview(); if(S.timer.state!=='RUNNING'&&S.timer.state!=='ENDED')setState('RUNNING'); }
  else { S.idx++; if(S.timer.state!=='RUNNING'&&S.timer.state!=='ENDED')setState('RUNNING'); renderEx(); }
}
function onCheck(){
  if(S.timer.state==='RUNNING'){ setState('PAUSED_AUTO_CHECK'); } /* first action: auto-pause */
  var id=S.order[S.idx], ex=EXAM.exercises[id];
  if(id in S.credits)return;
  var g=gradeCurrent(ex);
  var c=scoreExercise(g.H,g.W,g.N);
  if(S.hinted[id])c=Math.max(0,c-0.10);
  S.credits[id]=c;
  renderFeedback(ex,g,c);
  renderTop();
}
function onNext(){
  if(S.timer.state==='PAUSED_AUTO_CHECK')setState('RUNNING');
  if(S.reviewMode){ S.reviewMode=false; showReview(); return; }
  if(S.idx>=totalAnswerable()-1){ showReview(); }
  else { S.idx++; renderEx(); }
}
function onFinalSubmit(){
  if(S.timer.state!=='ENDED')setState('ENDED');
  if(S._int)clearInterval(S._int);
  openResults(false);
}

  qb.appendChild(el('div','block-body',ex.question));

/* ---------------- widget builders ---------------- */
var WIDGETS={};
function buildWidget(ex,host){
  var w=WIDGETS[ex.type];
  if(!w){ host.innerHTML='<p class="fbitem st-bad">Unknown exercise type.</p>'; return; }
  var inst=w.build(ex,host);
  host._grade=inst.grade;
}
/* --- option buttons shared by qcm / multi --- */
function optButton(o,idx,multi){
  var b=el('button','opt','<span class="ol">'+String.fromCharCode(65+idx)+'.</span><span class="ot">'+o.t+'</span>');
  b.type='button'; b._sel=false; b._o=o; b._idx=idx;
  b.setAttribute('aria-pressed','false');
  b.addEventListener('click',function(){
    if(b.disabled)return;
    if(multi){ b._sel=!b._sel; b.classList.toggle('sel',b._sel); b.setAttribute('aria-pressed',b._sel?'true':'false'); }
    else {
      var host=b.parentNode;
      Array.prototype.forEach.call(host.children,function(c){c._sel=false;c.classList.remove('sel');c.setAttribute('aria-pressed','false');});
      b._sel=true; b.classList.add('sel'); b.setAttribute('aria-pressed','true');
    }
  });
  return b;
}
function lockOptions(host){
  Array.prototype.forEach.call(host.querySelectorAll('button.opt'),function(b){b.disabled=true;});
}
function optGrade(items){
  /* items: [{o, sel}] -> partial credit over correct options */
  var N=0,H=0,W=0,out=[];
  items.forEach(function(it){
    if(it.o.correct)N++;
    if(it.o.correct&&it.sel)H++;
    if(!it.o.correct&&it.sel)W++;
  });
  items.forEach(function(it){
    if(it.o.correct&&it.sel)out.push({t:it.plain,st:'ok',why:it.o.why||'Part of the correct answer.'});
    else if(!it.o.correct&&it.sel)out.push({t:it.plain,st:'bad',why:it.o.why||'Not part of the correct answer.'});
    else if(it.o.correct&&!it.sel)out.push({t:it.plain,st:'miss',why:it.o.why||'You missed this correct item.'});
  });
  if(N===0)N=1;
  return {H:H,W:W,N:N,items:out};
}
function plainOf(o){ var d=el('div',null,o.t); return d.textContent.replace(/\s+/g,' ').trim(); }

WIDGETS.qcm={build:function(ex,host){
  var box=el('div','opts');
  shuffle(ex.options.map(function(o,i){return {o:o,i:i};})).forEach(function(p){
    box.appendChild(optButton(p.o,p.i,false));
  });
  host.appendChild(box);
  var hint=el('p','dnd-hint','Choose one answer, then press Check.');
  host.appendChild(hint);
  return {grade:function(){
    var sel=null;
    Array.prototype.forEach.call(box.children,function(b){ if(b._sel)sel=b; });
    lockOptions(box);
    var correct=ex.options.filter(function(o){return o.correct;})[0];
    var ok=sel&&sel._o.correct;
    var items=[{t:'Correct answer: '+plainOf(correct),st:ok?'ok':'bad',why:correct.why}];
    return {H:ok?1:0,W:(!ok)?1:0,N:1,items:items};
  }};
}};

WIDGETS.multi={build:function(ex,host){
  var box=el('div','opts');
  shuffle(ex.options.map(function(o,i){return {o:o,i:i};})).forEach(function(p){
    box.appendChild(optButton(p.o,p.i,true));
  });
  host.appendChild(box);
  host.appendChild(el('p','dnd-hint',ex.multiNote||'Select all answers that apply, then press Check.'));
  return {grade:function(){
    var items=[];
    Array.prototype.forEach.call(box.children,function(b){ if(b._o)items.push({o:b._o,sel:b._sel,plain:plainOf(b._o)}); });
    lockOptions(box);
    return optGrade(items);
  }};
}};

WIDGETS.match={build:function(ex,host){
  var rights=shuffle(ex.rights.map(function(r,i){return {t:r,i:i};}));
  var wrap=el('div');
  var rows=[];
  ex.lefts.forEach(function(l,li){
    var row=el('div','selrow');
    row.appendChild(el('span','sr-l',l));
    var s=el('select'); s.setAttribute('aria-label','Match: '+l);
    var ph=el('option',null,'— choose —'); ph.value=''; s.appendChild(ph);
    rights.forEach(function(r){ var o=el('option',null,r.t); o.value=String(r.i); s.appendChild(o); });
    s._li=li; row.appendChild(s); wrap.appendChild(row); rows.push(s);
  });
  host.appendChild(wrap);
  host.appendChild(el('p','dnd-hint','Pick the matching item for every row, then press Check.'));
  return {grade:function(){
    var H=0,W=0,M=0,items=[];
    rows.forEach(function(s,li){
      var v=s.value; s.disabled=true;
      if(v===''){ items.push({t:ex.lefts[li],st:'miss',why:'Left unanswered. Correct match: '+ex.rights[ex.correct[li]]}); M++; return; }
      if(parseInt(v,10)===ex.correct[li]){ H++; items.push({t:ex.lefts[li],st:'ok',why:ex.why?ex.why[li]:'Correct pair.'}); }
      else { W++; items.push({t:ex.lefts[li],st:'bad',why:'You matched “'+ex.rights[parseInt(v,10)]+'”. Correct match: '+ex.rights[ex.correct[li]]+(ex.why?' — '+ex.why[li]:'')}); }
    });
    var N=ex.lefts.length;
    return {H:H,W:W,N:N,items:items};
  }};
}};
WIDGETS.blank={build:function(ex,host){
  var wrap=el('div','blank-text');
  var parts=ex.text.split(/\{\d\}/);
  var slots=[];
  var html='';
  for(var i=0;i<parts.length;i++){
    html+=parts[i];
    if(i<ex.correct.length){ html+='<select data-b="'+i+'" aria-label="Blank '+(i+1)+'"><option value="">— choose —</option></select>'; }
  }
  wrap.innerHTML=html;
  var bank=shuffle(ex.bank.map(function(b){return b;}));
  Array.prototype.forEach.call(wrap.querySelectorAll('select'),function(s){
    bank.forEach(function(w){ var o=el('option',null,w); o.value=w; s.appendChild(o); });
    slots.push(s);
  });
  host.appendChild(wrap);
  host.appendChild(el('p','dnd-hint','Fill every blank from the shuffled word bank, then press Check.'));
  return {grade:function(){
    var H=0,W=0,M=0,items=[];
    slots.forEach(function(s,i){
      var v=s.value; s.disabled=true;
      if(v===''){ items.push({t:'Blank '+(i+1),st:'miss',why:'Left empty. Correct word: '+ex.correct[i]}); M++; }
      else if(v===ex.correct[i]){ H++; items.push({t:'Blank '+(i+1)+': “'+ex.correct[i]+'”',st:'ok',why:ex.why?ex.why[i]:'This word fits the sentence and the ATT&CK facts.'}); }
      else { W++; items.push({t:'Blank '+(i+1)+': you chose “'+v+'”',st:'bad',why:'Correct word: “'+ex.correct[i]+'”.'+(ex.why?' '+ex.why[i]:'')}); }
    });
    return {H:H,W:W,N:ex.correct.length,items:items};
  }};
}};

WIDGETS.order={build:function(ex,host){
  var list=el('div','ordr');
  var cur=shuffle(ex.items.map(function(t,i){return {t:t,i:i};}));
  function draw(){
    list.innerHTML='';
    cur.forEach(function(it,pos){
      var row=el('div','ordr-item');
      row.draggable=true; row._pos=pos;
      row.appendChild(el('span','opos',(pos+1)+'.'));
      row.appendChild(el('span','otxt',it.t));
      var btns=el('span','ordr-btns');
      var up=el('button',null,'↑'); up.type='button'; up.setAttribute('aria-label','Move item '+(pos+1)+' up');
      up.addEventListener('click',function(){ if(pos>0){var t=cur[pos-1];cur[pos-1]=cur[pos];cur[pos]=t;draw();} });
      var dn=el('button',null,'↓'); dn.type='button'; dn.setAttribute('aria-label','Move item '+(pos+1)+' down');
      dn.addEventListener('click',function(){ if(pos<cur.length-1){var t=cur[pos+1];cur[pos+1]=cur[pos];cur[pos]=t;draw();} });
      btns.appendChild(up); btns.appendChild(dn); row.appendChild(btns);
      row.addEventListener('dragstart',function(ev){ S._dragRow=pos; try{ev.dataTransfer.setData('text/plain','row');}catch(e){} });
      row.addEventListener('dragover',function(ev){ ev.preventDefault(); });
      row.addEventListener('drop',function(ev){ ev.preventDefault();
        var from=S._dragRow; if(from==null||from===pos)return;
        var m=cur.splice(from,1)[0]; cur.splice(pos,0,m); S._dragRow=null; draw();
      });
      list.appendChild(row);
    });
  }
  draw();
  host.appendChild(list);
  host.appendChild(el('p','dnd-hint','Put the items in the correct order: use ↑ / ↓ or drag the rows, then press Check.'));
  return {grade:function(){
    var H=0,W=0,items=[];
    cur.forEach(function(it,pos){
      var ok=it.i===pos;
      if(ok)H++; else W++;
      items.push({t:'Position '+(pos+1)+': '+it.t,st:ok?'ok':'bad',why:ok?'Correct position.':'Expected here: '+ex.items[pos]});
    });
    ex.items.forEach(function(t,pos){
      if(cur[pos].i!==pos){ /* already covered by position rows */ }
    });
    return {H:H,W:W,N:ex.items.length,items:items};
  }};
}};

WIDGETS.drag={build:function(ex,host){
  var wrap=el('div','dnd-wrap');
  var bank=el('div','dnd-bank','<h4 style="margin:0 0 6px;font-size:.9em;color:var(--text-secondary)">Item bank</h4>');
  var zones=el('div','dnd-zones');
  var buckets=[];
  ex.buckets.forEach(function(b,bi){
    var z=el('div','dnd-bucket','<h4>⬛ '+b+'</h4>');
    z._bi=bi; zones.appendChild(z); buckets.push(z);
  });
  var picked=null;
  function unassign(it){ if(it._bi!=null){ buckets[it._bi].removeChild(it); it._bi=null; bank.appendChild(it); it.classList.remove('picked'); var a=it.querySelector('.asg'); if(a)a.remove(); } }
  function assign(it,bi){ unassign(it); it._bi=bi; buckets[bi].appendChild(it); it.appendChild(el('span','asg','→ '+ex.buckets[bi])); }
  ex.items.forEach(function(t){
    var it=el('div','dnd-item',t);
    it._bi=null; it._t=t; it.tabIndex=0; it.setAttribute('role','button');
    it.setAttribute('aria-label','Draggable item: '+t+'. Click to pick, then click a zone.');
    function pick(){ if(picked===it){picked.classList.remove('picked');picked=null;return;} if(picked)picked.classList.remove('picked'); picked=it; it.classList.add('picked'); }
    it.addEventListener('click',function(){ if(!it.disabled)pick(); });
    it.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pick();} });
    it.addEventListener('pointerdown',function(ev){
      if(it.disabled)return;
      it.classList.add('dragging'); pick();
      function move(e){
        buckets.forEach(function(z){ z.classList.toggle('over',pointIn(e,z)); });
      }
      function up(e){
        document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
        it.classList.remove('dragging');
        var zi=-1; buckets.forEach(function(z,i){ if(pointIn(e,z))zi=i; });
        buckets.forEach(function(z){ z.classList.remove('over'); });
        if(zi>=0)assign(it,zi);
      }
      document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
    });
    bank.appendChild(it);
  });
  function pointIn(ev,node){ var r=node.getBoundingClientRect(); return ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom; }
  buckets.forEach(function(z){
    z.addEventListener('click',function(){ if(picked){ assign(picked,z._bi); picked.classList.remove('picked'); picked=null; } });
  });
  wrap.appendChild(bank); wrap.appendChild(zones); host.appendChild(wrap);
  host.appendChild(el('p','dnd-hint','Drag each item into the right zone — or click the item, then click the zone. Click an item again to return it to the bank.'));
  return {grade:function(){
    var H=0,W=0,M=0,items=[];
    Array.prototype.forEach.call(bank.querySelectorAll('.dnd-item'),function(it){
      if(it._bi==null){ items.push({t:it._t,st:'miss',why:'Left in the bank. Belongs to: '+ex.buckets[ex.assign[ex.items.indexOf(it._t)]]}); M++; }
    });
    buckets.forEach(function(z,bi){
      Array.prototype.forEach.call(z.querySelectorAll('.dnd-item'),function(it){
        var ok=ex.assign[ex.items.indexOf(it._t)]===bi;
        if(ok)H++; else W++;
        items.push({t:it._t,st:ok?'ok':'bad',why:ok?'Correct zone.':'Placed in “'+ex.buckets[bi]+'”. Belongs in “'+ex.buckets[ex.assign[ex.items.indexOf(it._t)]]+'”.'});
      });
    });
    Array.prototype.forEach.call(bank.querySelectorAll('.dnd-item'),function(it){it.disabled=true;});
    return {H:H,W:W,N:ex.items.length,items:items};
  }};
}};

/* ---------------- log viewer ---------------- */
function viewerHtml(v){
  var h='<div class="artefact"><span class="artefact-head">LOG VIEWER — '+v.label+'</span><div class="artefact-body">';
  h+='<div class="logv-filter"><span class="flbl">filter</span><input type="text" aria-label="Filter log lines" placeholder="Type to filter lines…"></div>';
  h+='<div class="logv-lines">';
  v.lines.forEach(function(l){ h+='<div class="logline">'+l+'</div>'; });
  h+='</div></div></div>';
  return h;
}
function wireViewer(host){
  var inp=host.querySelector('.logv-filter input');
  if(!inp)return;
  inp.addEventListener('input',function(){
    var q=inp.value.toLowerCase();
    host.querySelectorAll('.logv-lines .logline').forEach(function(l){
      l.style.display=l.textContent.toLowerCase().indexOf(q)>=0?'block':'none';
    });
  });
}

WIDGETS.terminal={build:function(ex,host){
  if(ex.timerNote){ var tn=el('div','timer-note','⏱ '+ex.timerNote); host.appendChild(tn); }
  if(ex.syntaxPanel){
    var sp=el('div','syntax-panel','<h4>Syntax reminder</h4>'+ex.syntaxPanel);
    host.appendChild(sp);
  }
  var term=el('div','term');
  term.innerHTML='<div class="term-head"><span class="term-dot"></span><span>'+ (ex.termTitle||'audit shell — simulation only, nothing is really executed') +'</span></div>'+
    '<div class="term-scroll"><div class="term-line lm">'+(ex.shellIntro||'Type your command and press Enter.')+'</div></div>';
  var inrow=el('div','term-in');
  inrow.innerHTML='<span class="pr">'+ex.prompt+'</span>';
  var inp=el('input'); inp.type='text'; inp.setAttribute('aria-label','Terminal input'); inp.autocomplete='off'; inp.spellcheck=false;
  inrow.appendChild(inp); term.appendChild(inrow);
  host.appendChild(term);
  var scroll=term.querySelector('.term-scroll');
  var lastCmd='';
  function norm(c){ return c.replace(/\s+/g,' ').trim(); }
  function run(){
    var v=inp.value; if(!v.trim())return;
    lastCmd=norm(v);
    var line=el('div','term-line'); line.innerHTML='<span class="lm">'+ex.prompt+'</span> '+lastCmd.replace(/</g,'&lt;');
    scroll.appendChild(line);
    var out;
    if(ex.simMatch&&new RegExp(ex.simMatch,'i').test(lastCmd.toLowerCase())) out=ex.simLines;
    else out=['zsh: only read-only audit commands are available in this simulator.'];
    out.forEach(function(o){ scroll.appendChild(el('div','term-line lm',o)); });
    scroll.scrollTop=scroll.scrollHeight;
    inp.value='';
  }
  inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter')run(); });
  var runBtn=el('button','btn','Run ▸'); runBtn.type='button';
  runBtn.style.minHeight='44px'; runBtn.addEventListener('click',run);
  inrow.appendChild(runBtn);
  host.appendChild(el('p','dnd-hint','Run the command you judge correct, then press Check. Your last command is graded.'));
  return {grade:function(){
    inp.disabled=true; runBtn.disabled=true;
    var cmd=(lastCmd||'').toLowerCase().replace(/\s+/g,' ').trim();
    var items=[],dangerHit=null;
    (ex.dangerous||[]).forEach(function(d){ if(new RegExp(d.re,'i').test(cmd))dangerHit=d; });
    var H=0,W=0;
    if(!cmd){ return {H:0,W:0,N:ex.required.length,items:[{t:'No command was run',st:'bad',why:'Type a command in the shell, then press Check.'}],danger:null}; }
    ex.required.forEach(function(r){
      if(new RegExp(r.re,'i').test(cmd)){ H++; items.push({t:'✓ element — '+r.label,st:'ok',why:'Present in your command.'}); }
      else { items.push({t:'○ element — '+r.label,st:'miss',why:'Missing from your command.'}); }
    });
    (ex.wrong||[]).forEach(function(w){
      if(new RegExp(w.re,'i').test(cmd)){ W++; items.push({t:'✗ element — '+w.label,st:'bad',why:w.why||'This element does not belong here.'}); }
    });
    if(dangerHit){ items.unshift({t:'✗ DANGEROUS — NEAR MISS: '+dangerHit.label,st:'bad',why:dangerHit.why}); }
    return {H:H,W:W,N:ex.required.length,items:items,danger:dangerHit};
  }};
}};

WIDGETS.triage={build:function(ex,host){
  var wrap=el('div');
  var sels=[];
  ex.alerts.forEach(function(a,ai){
    var box=el('div','artefact');
    box.innerHTML='<span class="artefact-head">ALERT '+(ai+1)+' — '+a.title+'</span><div class="artefact-body"><p>'+a.body+'</p></div>';
    var row=el('div','selrow');
    var s=el('select'); s.setAttribute('aria-label','Decision for alert '+(ai+1));
    var ph=el('option',null,'— decide —'); ph.value=''; s.appendChild(ph);
    shuffle(a.options.map(function(o,i){return {o:o,i:i};})).forEach(function(p){
      var o=el('option',null,p.o.t); o.value=String(p.i); s.appendChild(o);
    });
    s._ai=ai; row.appendChild(s); box.appendChild(row); wrap.appendChild(box); sels.push(s);
  });
  host.appendChild(wrap);
  host.appendChild(el('p','dnd-hint','Choose one decision per alert, then press Check.'));
  return {grade:function(){
    var H=0,W=0,M=0,items=[];
    sels.forEach(function(s,ai){
      var v=s.value; s.disabled=true;
      var opts=ex.alerts[ai].options;
      var corr=opts.filter(function(o){return o.correct;})[0];
      if(v===''){ items.push({t:ex.alerts[ai].title,st:'miss',why:'Left undecided. Best call: '+corr.t+' — '+corr.why}); M++; }
      else if(opts[parseInt(v,10)].correct){ H++; items.push({t:ex.alerts[ai].title,st:'ok',why:corr.why}); }
      else { W++; items.push({t:ex.alerts[ai].title+' — you chose “'+opts[parseInt(v,10)].t+'”',st:'bad',why:'Best call: '+corr.t+' — '+corr.why}); }
    });
    return {H:H,W:W,N:ex.alerts.length,items:items};
  }};
}};

WIDGETS.branch={build:function(ex,host){
  var wrap=el('div');
  var picks=[];
  var doneAll=false;
  ex.steps.forEach(function(st,si){
    var box=el('div','artefact');
    box.innerHTML='<span class="artefact-head">STEP '+(si+1)+' OF '+ex.steps.length+' — '+st.label+'</span><div class="artefact-body"><p>'+st.text+'</p></div>';
    if(si>0)box.classList.add('hidden');
    var og=el('div','opts'); og.style.margin='8px 4px';
    var ogLocal=og;
    shuffle(st.options.map(function(o,i){return {o:o,i:i};})).forEach(function(p){
      var b=optButton(p.o,p.i,false);
      b.addEventListener('click',function(){
        if(b.disabled)return;
        Array.prototype.forEach.call(ogLocal.children,function(c){c.disabled=true;});
        picks[si]={o:b._o,ok:!!b._o.correct};
        var rec=el('div','dnd-hint','<span style="color:var(--accent-green)">✓ Recorded</span> — your choice for step '+(si+1)+' is locked. It is graded together with the other steps when you press Check.');
        box.appendChild(rec);
        if(si+1<ex.steps.length){ ex.steps[si+1]._box.classList.remove('hidden'); }
        else { doneAll=true; var cb2=$('#btnCheck'); if(cb2)cb2.disabled=false; }
      });
      ogLocal.appendChild(b);
    });
    box.appendChild(og);
    st._box=box;
    wrap.appendChild(box);
  });
  host.appendChild(wrap);
  host.appendChild(el('p','dnd-hint','Answer every step. Only the final Check grades the whole chain and pauses the timer.'));
  return {grade:function(){
    var H=0,W=0,items=[];
    ex.steps.forEach(function(st,si){
      var p=picks[si];
      var corr=st.options.filter(function(o){return o.correct;})[0];
      if(!p){ items.push({t:st.label,st:'miss',why:'Not answered. Correct: '+corr.t}); return; }
      if(p.ok){ H++; items.push({t:st.label,st:'ok',why:corr.why}); }
      else { W++; items.push({t:st.label+' — you chose “'+p.o.plainText+'”',st:'bad',why:'Correct: '+corr.t+' — '+corr.why}); }
    });
    return {H:H,W:W,N:ex.steps.length,items:items};
  }};
}};

/* store plain text of branch options for feedback */
var _origOptButton=optButton;
optButton=function(o,idx,multi){ var b=_origOptButton(o,idx,multi); var d=el('div',null,o.t); o.plainText=d.textContent.replace(/\s+/g,' ').trim(); return b; };

/* ---------------- grading + feedback ---------------- */
function gradeCurrent(ex){
  var host=$('#ansBody');
  return host._grade ? host._grade() : {H:0,W:0,N:1,items:[{t:'No answer',st:'bad',why:''}]};
}
function renderFeedback(ex,g,credit){
  var lab=creditLabel(credit,g.N);
  var fb=el('div','fb '+lab.cls); fb.id='fbBlock';
  var head='<span class="bh-ic">'+lab.ic+'</span> '+lab.word;
  if(g.N>1) head+='<span class="fb-credit"> — credit '+credit.toFixed(2)+' ('+fmtCreditItems(g,credit)+')</span>';
  else head+='<span class="fb-credit"> — credit '+credit.toFixed(2)+'</span>';
  if(S.hinted[S.order[S.idx]]) head+='<span class="fb-credit"> · includes −0.10 hint penalty</span>';
  fb.appendChild(el('div','fb-head',head));
  var body=el('div','fb-body');
  var ul=el('ul','fbitems');
  var ICON={ok:['✓','Correct'],bad:['✗','Wrong'],miss:['○','Missed']};
  g.items.forEach(function(it){
    var st=ICON[it.st]||ICON.miss;
    ul.appendChild(el('li','fbitem st-'+it.st,'<span class="fi-ic">'+st[0]+'</span><span><b>'+st[1]+'</b> — '+it.t+'. <span class="fi-why">'+it.why+'</span></span>'));
  });
  body.appendChild(ul);
  if(g.danger){ body.appendChild(el('div','fb-danger','✗ DANGEROUS — NEAR MISS: your command would change state. In a real incident it could destroy evidence. '+g.danger.why)); }
  if(ex.type==='terminal'&&ex.canonical){
    var c=el('div','canon');
    var ct='<span class="canon-t">✓ Canonical command <button class="collapser" id="cpBtn" aria-label="Copy the canonical command">⧉ Copy</button></span><pre>'+ex.canonical.replace(/</g,'&lt;')+'</pre>';
    c.innerHTML=ct;
    if(ex.parts&&ex.parts.length){
      var pl=el('ul','canon-parts');
      ex.parts.forEach(function(p){ pl.appendChild(el('li',null,'<b>'+p.label+'</b> — '+p.why)); });
      c.appendChild(pl);
    }
    body.appendChild(c);
    var cb=c.querySelector('#cpBtn');
    if(cb)cb.addEventListener('click',function(){
      try{ navigator.clipboard.writeText(ex.canonical); cb.textContent='✓ Copied'; }catch(e){ cb.textContent='Select and copy manually'; }
    });
  }
  body.appendChild(el('div','fb-why','<span class="why-t">Why — in plain words</span>'+ex.explain));
  if(credit<1&&ex.study){ body.appendChild(el('div','study-tip','<b>What to study:</b> '+ex.study)); }
  fb.appendChild(body);
  var nav=$('#exNav');
  nav.parentNode.insertBefore(fb,nav);
  var chk=$('#btnCheck'); if(chk)chk.disabled=true;
  var sk=$('#tbSkip'); if(sk)sk.disabled=true;
  var hb=$('#tbHint'); if(hb)hb.disabled=true;
  var nx=$('#btnNext'), fin=$('#btnFinal');
  var last=(S.idx>=totalAnswerable()-1);
  var skippedLeft=S.skipped.filter(function(id){return !(id in S.credits);}).length;
  if(last){
    if(skippedLeft>0&&S.timer.state!=='ENDED'){ nx.classList.remove('hidden'); }
    else { fin.classList.remove('hidden'); }
  } else { nx.classList.remove('hidden'); }
  fb.scrollIntoView({block:'nearest'});
}
function fmtCreditItems(g,credit){
  var got=0; g.items.forEach(function(it){ if(it.st==='ok')got++; });
  return got+'/'+g.N+' items, credit '+credit.toFixed(2);
}

/* ---------------- review skipped ---------------- */
function showReview(){
  S.reviewMode=false;
  if(S.timer.state==='PAUSED_AUTO_CHECK')setState('RUNNING');
  var v=$('#reviewView'); v.innerHTML='';
  v.appendChild(el('h1',null,'Review skipped exercises'));
  var left=S.skipped.filter(function(id){return !(id in S.credits);});
  var t=S.timer;
  if(t.state==='ENDED'){
    v.appendChild(el('p','tb-sub','⏱ <b style="color:var(--state-incorrect)">■ The timer has ENDED.</b> Unanswered and skipped exercises are excluded from the score.'));
    var b0=el('button','btn btn-primary','⏹ Final Submit'); b0.addEventListener('click',onFinalSubmit); v.appendChild(b0);
    showView('reviewView'); return;
  }
  v.appendChild(el('p','tb-sub','▶ The timer is still RUNNING ('+fmtT(t.remaining)+' left). You can return to every skipped exercise as many times as you need until the timer ends. ⚠ Skipped exercises left unanswered are excluded from the score.'));
  if(left.length===0){
    v.appendChild(el('p',null,'✓ No skipped exercises are waiting. You can submit the exam.'));
  } else {
    left.forEach(function(id){
      var ex=EXAM.exercises[id];
      var it=el('div','rv-item');
      it.innerHTML='<span class="rv-ic">⚠ Skipped</span><span class="rv-t">'+(id+1)+'. '+ex.summary+'</span>';
      var b=el('button','btn btn-go','Answer');
      b.setAttribute('aria-label','Return to skipped exercise: '+ex.summary);
      b.addEventListener('click',function(){ S.reviewMode=true; S.idx=id; showView('examView'); renderEx(); });
      it.appendChild(b); v.appendChild(it);
    });
  }
  var sub=el('button','btn btn-primary','⏹ Final Submit');
  sub.style.marginTop='14px';
  sub.addEventListener('click',onFinalSubmit);
  v.appendChild(sub);
  showView('reviewView');
}

/* ---------------- results ---------------- */
function openResults(timeout){
  setState('ENDED'); if(S._int)clearInterval(S._int); showVeil(false);
  var v=$('#resultsView'); v.innerHTML='';
  var ls=liveScore();
  var answered=ls.cnt, sum=ls.sum;
  var percent=answered>0?Math.round(sum/answered*100):0;
  var passed=percent>=META.passMark;
  var full=0,part=0,partSum=0,bad=0;
  for(var k in S.credits){ var c=S.credits[k]; if(c>=1)full++; else if(c>0){part++;partSum+=c;} else bad++; }
  var skipped=S.order.length-answered;
  var hero=el('div','res-hero '+(passed?'pass':'fail'));
  hero.appendChild(el('h1',null,META.objId+' — '+META.sevName+' — results'));
  hero.appendChild(el('div','res-big '+(passed?'':''),percent+'%'));
  hero.appendChild(el('p','res-line','✓ '+(passed?'PASS':'✗ FAIL')+' — pass mark is '+META.passMark+'%. Score computed only over answered exercises ('+answered+' of '+S.order.length+').'));
  if(S.username)hero.appendChild(el('p','res-line','Candidate: '+S.username));
  if(timeout)hero.appendChild(el('p','res-line','⏱ The timer ran out. Exercises never answered were excluded from the score.'));
  v.appendChild(hero);
  var grid=el('div','res-grid');
  function cell(cls,n,lbl){ grid.appendChild(el('div','res-cell '+cls,'<div class="rn">'+n+'</div><div class="rl">'+lbl+'</div>')); }
  cell('c-ok',full,'✓ Fully correct');
  cell('c-part',part,'✓ Partially correct'+(part>0?' · avg '+(partSum/part).toFixed(2):''));
  cell('c-bad',bad,'✗ Fully incorrect');
  cell('c-skip',skipped,'⚠ Skipped — excluded');
  v.appendChild(grid);
  var tg=el('div','time-grid');
  function tcell(l,val){ tg.appendChild(el('div','time-cell',l+' <b>'+val+'</b>')); }
  tcell('Time left on the clock:',fmtT(S.timer.remaining));
  tcell('Time paused manually:',fmtT(S.pausedManualSec));
  tcell('Time paused for feedback review:',fmtT(S.pausedAutoSec));
  v.appendChild(tg);
  var ret=el('button','btn btn-go','↻ Retake Exam');
  ret.style.cssText='margin-top:18px;min-width:220px;min-height:48px;font-weight:700;';
  ret.setAttribute('aria-label','Retake the exam — questions and answers are reshuffled');
  ret.addEventListener('click',retake);
  v.appendChild(ret);
  v.appendChild(el('p','footer-note',passed?'✓ PASS — your result was reported to the site (once for this attempt).':'✗ FAIL — retake the exam. On retake, the exercise order and answer choices are shuffled again.'));
  showView('resultsView');
  if(!S.reportFired){ S.reportFired=true; reportScore(sum,answered); }
}

/* ---------------- init ---------------- */
document.body.classList.add('sev-'+META.sevKey);
$('#veilResume').addEventListener('click',onPause);
buildTop();
renderIntro();
showView('introView');

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
