/* ---------------- actions (header buttons) ---------------- */
var Actions={
  current:function(){ return (App.curIdx>=0)? App.exById(App.order[App.curIdx]) : null; },
  hint:function(){
    var ex=this.current();
    if(!ex || App.lockInputs) return;
    if(App.hintUsed[ex.id]) return;
    App.hintUsed[ex.id]=true;
    var box=$('hintBox');
    box.innerHTML='<div class="hint-panel"><div class="hp-head"><span class="ic">&#128161;</span>HINT USED &mdash; 10% of this exercise credit deducted</div>'+ex.hint+'</div>';
    $('hintBtn').disabled=true;
  },
  skip:function(){
    if(App.lockInputs) return;
    if(App.curIdx<0) return;
    var idx=App.order[App.curIdx];
    var prev=App.status[idx];
    App.status[idx]='skipped';
    if(prev==='pending') App.visited++;
    App.progress();
    if(App.reviewing){ App.showReview(); }
    else{ App.showNext(); }
  },
  check:function(){
    var ex=this.current();
    if(!ex || App.lockInputs) return;
    var st=App.answers[ex.id];
    if(!st || !st.hasAnswer) return;
    Timer.pauseAuto(); /* FIRST action: stop the clock before feedback */
    var res=gradeAnswer(ex,st);
    var exIdx=App.curExIdx;
    var prev=App.status[exIdx];
    if(prev!=='answered'){ if(prev==='pending') App.visited++; App.status[exIdx]='answered'; }
    var credit=res.credit;
    if(App.hintUsed[ex.id]) credit=Math.max(0,credit-0.10);
    App.credits[ex.id]=credit;
    App.lockInputs=true;
    App.updateScoreChip();
    App.progress();
    lockWidget();
    renderFeedback(ex,res,credit);
    var cb=$('checkBtn'); if(cb) cb.classList.add('hidden');
    var nw=$('nextWrap');
    nw.innerHTML='<button id="nextBtn" class="btn primary">'+nextLabel()+'</button>';
    $('nextBtn').addEventListener('click',function(){ Actions.next(); });
    $('hintBtn').disabled=true; $('skipBtn').disabled=true;
  },
  next:function(){
    if(Timer.state==='PAUSED_AUTO_CHECK') Timer.resumeFromAuto();
    if(App.reviewing){ App.showReview(); return; }
    App.showNext();
  },
  finish:function(){
    if(Timer.state==='PAUSED_AUTO_CHECK') Timer.resumeFromAuto();
    if(!App.reviewing && App.nextPending()!==-1) return; /* safety: never finish early */
    if(App.anySkipped()){ App.showReview(); return; }
    finishExam(false);
  }
};
function exIdxOf(ex){ for(var i=0;i<PAYLOAD.exercises.length;i++){ if(PAYLOAD.exercises[i].id===ex.id) return i; } return -1; }
function nextLabel(){
  if(App.reviewing) return '&#9106; Return to Review';
  if(App.nextPending()!==-1) return '&#9654; Next';
  if(App.anySkipped()) return '&#9203; Review Skipped';
  return '&#9632; Final Submit';
}

  tog.type='button';
  tog.setAttribute('aria-expanded','true');
  tog.innerHTML='<span class="ic">&#9660;</span><span class="sum">'+esc(ex.scenario.summary)+'</span><span class="state-word">Expanded</span>';
  blk.appendChild(tog);
  var panels=el('div','sc-panels');
  if(ex.scenario.prose) panels.innerHTML+='<div class="prose">'+ex.scenario.prose+'</div>';
  (ex.scenario.arts||[]).forEach(function(a){
    var art=el('div','art');
    art.innerHTML='<div class="art-label">'+esc(a.label)+'</div>';
    if(a.kind==='log'){
      var tools=el('div','log-tools');
      var inp=el('input','log-filter');
      inp.type='text'; inp.placeholder='filter lines (text match)'; inp.setAttribute('aria-label','Filter log lines');
      var cnt=el('span','log-count');
      tools.appendChild(inp); tools.appendChild(cnt);
      art.appendChild(tools);
      var log=el('div','log');
      var lines=a.lines||[];
      log.innerHTML=lines.map(function(l){ return '<span class="logline">'+hlLog(l)+'</span>'; }).join('');
      art.appendChild(log);
      function applyF(){
        var q=norm(inp.value);
        var shown=0;
        var rows=log.querySelectorAll('.logline');
        for(var i=0;i<rows.length;i++){
          var show=(q===''||norm(lines[i]).indexOf(q)>-1);
          rows[i].classList.toggle('off',!show);
          if(show) shown++;
        }
        cnt.textContent=shown+' / '+lines.length+' lines';
      }
      inp.addEventListener('input',applyF);
      applyF();
    } else {
      var body=el('div','art-body');
      body.innerHTML=a.html||'';
      art.appendChild(body);
    }
    panels.appendChild(art);
  });
  blk.appendChild(panels);
  tog.addEventListener('click',function(){
    var open=blk.classList.toggle('collapsed')===false;
    panels.classList.toggle('hidden',!open);
    tog.setAttribute('aria-expanded',open?'true':'false');
    tog.innerHTML='<span class="ic">'+(open?'&#9660;':'&#9654;')+'</span><span class="sum">'+esc(ex.scenario.summary)+'</span><span class="state-word">'+(open?'Expanded':'Collapsed')+'</span>';
  });
  root.appendChild(blk);
}

/* ---------------- answer builders ---------------- */
function enableCheck(){
  var cb=$('checkBtn');
  if(cb && cb.classList.contains('hidden')===false) cb.disabled=false;
}
function lockWidget(){
  var box=$('ansBox');
  var els=box.querySelectorAll('button,input,select');
  for(var i=0;i<els.length;i++){ els[i].disabled=true; }
}

/* choice: qcm + spot (single answer) */
function buildChoice(ex,box,st,multi){
  st.picked=[]; st.hasAnswer=false;
  var letters='ABCDEFGH';
  var arr=ex.opts.map(function(o,i){ return {o:o,i:i}; });
  arr=shuffle(arr);
  st.rendered=arr;
  arr.forEach(function(w,k){
    var b=el('button','opt');
    b.type='button';
    b.innerHTML='<span class="opx">'+letters[k]+'.</span><span class="opt-t">'+w.o.t+'</span><span class="selmark hidden">&#10003; Selected</span>';
    b.addEventListener('click',function(){
      if(App.lockInputs) return;
      if(multi){
        var pos=st.picked.indexOf(w.i);
        if(pos>-1){ st.picked.splice(pos,1); b.classList.remove('sel'); b.querySelector('.selmark').classList.add('hidden'); }
        else{ st.picked.push(w.i); b.classList.add('sel'); b.querySelector('.selmark').classList.remove('hidden'); }
        st.hasAnswer=st.picked.length>0;
      }else{
        st.picked=[w.i];
        var rows=box.querySelectorAll('.opt');
        for(var r=0;r<rows.length;r++){ rows[r].classList.remove('sel'); rows[r].querySelector('.selmark').classList.add('hidden'); }
        b.classList.add('sel'); b.querySelector('.selmark').classList.remove('hidden');
        st.hasAnswer=true;
      }
      enableCheck();
    });
    box.appendChild(b);
  });
}

/* select-per-row builder used by match + triage */
function buildSelectRows(ex,box,st){
  st.picks={}; st.hasAnswer=false;
  var selOpts=st.rights;
  st.rows.forEach(function(row,k){
    var wrap=el('div','selrow');
    wrap.innerHTML='<div class="left">'+row.label+'</div>';
    var s=el('select');
    s.setAttribute('aria-label',row.aria||('Choice for row '+(k+1)));
    s.innerHTML='<option value="">-- choose --</option>'+selOpts.map(function(o){ return '<option value="'+o.v+'">'+esc(o.t)+'</option>'; }).join('');
    s.addEventListener('change',function(){
      if(App.lockInputs) return;
      st.picks[row.key]=s.value===''?null:s.value;
      st.hasAnswer=true;
      enableCheck();
    });
    wrap.appendChild(s);
    box.appendChild(wrap);
    st.sels[row.key]=s;
  });
}

/* match (pairs) */
function buildMatch(ex,box,st){
  var rights=shuffle(ex.pairs.map(function(p,i){ return {v:String(i),t:p[1]}; }));
  st.rights=rights;
  st.rows=ex.pairs.map(function(p,i){ return {key:i,label:'<b>'+esc(p[0])+'</b>'+(p[3]?'<span class="sub">'+esc(p[3])+'</span>':''),aria:'Match for '+p[0]}; });
  st.sels={};
  box.innerHTML='<p class="ex-meta">Open each chooser and pick the match that fits. Every correct match earns credit.</p>';
  buildSelectRows(ex,box,st);
}

/* triage (SOC alert queue) */
function buildTriage(ex,box,st){
  st.dispMap={}; ex.disps.forEach(function(d,i){ st.dispMap[d.id]=i; });
  var alerts=shuffle(ex.alerts.map(function(a,i){ return {a:a,i:i}; }));
  st.alertOrder=alerts.map(function(w){ return w.i; });
  st.rights=ex.disps.map(function(d){ return {v:d.id,t:d.label}; });
  st.rows=alerts.map(function(w){
    return {key:w.a.id,label:'<b><span class="mono">'+esc(w.a.id)+'</span> '+esc(w.a.title)+'</b><span class="sub">'+w.a.meta+'</span>',aria:'Disposition for '+w.a.id};
  });
  st.sels={};
  box.innerHTML='<p class="ex-meta">Triage the queue: set a disposition for each alert. A wrong pick cancels a correct one.</p>';
  buildSelectRows(ex,box,st);
}

/* dnd (drag & drop, one-cap slots or racks) */
function buildDnd(ex,box,st){
  st.place={}; st.selChip=-1; st.hasAnswer=false;
  var chips=shuffle(ex.bank.map(function(c,i){ return {c:c,i:i}; }));
  st.chips=chips;
  box.innerHTML='<p class="ex-meta">Drag each card into its zone &mdash; or click a card, then click a zone. Click the &#10005; to send a card back.</p>';
  var bank=el('div','bank');
  bank.setAttribute('aria-label','Card bank');
  var slotsBox=el('div','slots');
  st.slotEls=[];
  ex.slots.forEach(function(s,si){
    var slot=el('div','slot');
    slot.setAttribute('data-slot',si);
    slot.innerHTML='<div class="slot-label"><span class="ic">&#9635;</span> '+esc(s)+'<span class="cap">'+(ex.cap==='rack'?'(several cards allowed)':'(one card)')+'</span></div>';
    var inner=el('div','bank');
    slot.appendChild(inner);
    slotsBox.appendChild(slot);
    st.slotEls.push(slot);
    slot.addEventListener('dragover',function(e){ e.preventDefault(); slot.classList.add('over'); });
    slot.addEventListener('dragleave',function(){ slot.classList.remove('over'); });
    slot.addEventListener('drop',function(e){
      e.preventDefault(); slot.classList.remove('over');
      var ci=parseInt(e.dataTransfer.getData('text/plain'),10);
      if(!isNaN(ci)) placeChip(ci,si);
    });
    slot.addEventListener('click',function(e){
      /* a click anywhere inside the slot places the selected chip, even when
         it lands on an already-placed card (the card's own X button still works
         because it stops propagation) */
      if(st.selChip>-1){ placeChip(st.selChip,si); }
    });
  });
  function chipHtml(ci,txt,inSlot){
    return '<span class="chip-t">'+txt+'</span>'+(inSlot?'<button class="rm" title="Send back to bank" aria-label="Send back to bank">&#10005;</button>':'');
  }
  function renderBank(){
    bank.innerHTML='';
    chips.forEach(function(w){
      if(st.place[w.i]!==undefined) return;
      var c=el('div','chip');
      c.draggable=true; c.setAttribute('data-chip',w.i);
      c.innerHTML=chipHtml(w.i,w.c.t,false);
      c.addEventListener('dragstart',function(e){ e.dataTransfer.setData('text/plain',String(w.i)); c.classList.add('dragging'); });
      c.addEventListener('dragend',function(){ c.classList.remove('dragging'); });
      c.addEventListener('click',function(){
        if(App.lockInputs) return;
        if(st.selChip===w.i){ st.selChip=-1; c.classList.remove('sel'); }
        else{
          st.selChip=w.i;
          bank.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('sel'); });
          c.classList.add('sel');
        }
      });
      bank.appendChild(c);
    });
  }
  function placeChip(ci,si){
    if(App.lockInputs) return;
    /* one-cap slots: previous occupant returns to the bank */
    if(ex.cap!=='rack'){
      for(var k in st.place){ if(st.place[k]===si && String(k)!==String(ci)) delete st.place[k]; }
    }
    st.place[ci]=si;
    st.selChip=-1; st.hasAnswer=true;
    enableCheck();
    paint();
  }
  function paint(){
    renderBank();
    st.slotEls.forEach(function(slot,si){
      var inner=slot.querySelector('.bank');
      inner.innerHTML='';
      chips.forEach(function(w){
        if(st.place[w.i]!==si) return;
        var c=el('div','chip');
        c.innerHTML=chipHtml(w.i,w.c.t,true);
        var rm=c.querySelector('.rm');
        if(rm) rm.addEventListener('click',function(e){
          e.stopPropagation();
          if(App.lockInputs) return;
          /* if the learner already holds a selected card, clicking anywhere in
             this slot (even on this X) completes the placement instead */
          if(st.selChip>-1){ placeChip(st.selChip,si); return; }
          delete st.place[w.i]; paint();
        });
        inner.appendChild(c);
      });
    });
  }
  box.appendChild(bank);
  box.appendChild(slotsBox);
  paint();
}

/* order (timeline ordering) */
function buildOrder(ex,box,st){
  st.list=shuffle(ex.items.map(function(_,i){ return i; })); st.hasAnswer=true;
  box.innerHTML='<p class="ex-meta">Put the steps in the correct order: drag rows, or use the arrows. Each row in its correct position earns credit.</p>';
  var list=el('div','ord-list');
  box.appendChild(list);
  function paint(){
    list.innerHTML='';
    st.list.forEach(function(ii,pos){
      var row=el('div','ord-item');
      row.draggable=true;
      row.setAttribute('data-pos',pos);
      row.innerHTML='<span class="rank-badge">'+(pos+1)+'</span><span class="ord-handle">&#9776;</span><span>'+esc(ex.items[ii])+'</span>'
        +'<span class="ord-btns"><button class="btn" aria-label="Move up" data-mv="-1">&#9650;</button><button class="btn" aria-label="Move down" data-mv="1">&#9660;</button></span>';
      row.addEventListener('dragstart',function(e){ e.dataTransfer.setData('text/plain',String(pos)); row.classList.add('dragging'); });
      row.addEventListener('dragend',function(){ row.classList.remove('dragging'); });
      row.addEventListener('dragover',function(e){ e.preventDefault(); row.classList.add('over'); });
      row.addEventListener('dragleave',function(){ row.classList.remove('over'); });
      row.addEventListener('drop',function(e){
        e.preventDefault(); row.classList.remove('over');
        var from=parseInt(e.dataTransfer.getData('text/plain'),10);
        if(isNaN(from)) return;
        var to=pos;
        var it=st.list.splice(from,1)[0];
        st.list.splice(to,0,it);
        paint();
      });
      row.querySelectorAll('[data-mv]').forEach(function(btn){
        btn.addEventListener('click',function(){
          if(App.lockInputs) return;
          var d=parseInt(btn.getAttribute('data-mv'),10);
          var to=pos+d;
          if(to<0||to>=st.list.length) return;
          var t=st.list[pos]; st.list[pos]=st.list[to]; st.list[to]=t;
          paint();
        });
      });
      list.appendChild(row);
    });
    enableCheck(); /* an ordered list is always a complete answer */
  }
  paint();
}

/* fill in the blank */
function buildFill(ex,box,st){
  st.vals=ex.blanks.map(function(){ return ''; }); st.hasAnswer=false;
  var wrap=el('div');
  var sent=el('div','fill-sent');
  /* blank markers are written as ____ in the content; map them to {{n}} in order */
  var bi2=0;
  var tmpl=ex.text.replace(/_{2,}/g,function(){ return '{{'+(bi2++)+'}}'; });
  var parts=tmpl.split(/\{\{(\d+)\}\}/);
  var html='';
  for(var i=0;i<parts.length;i++){
    if(i%2===0){ html+=esc(parts[i]); }
    else{
      var bi=parseInt(parts[i],10);
      html+='<input type="text" class="fillin" data-bank="'+bi+'" aria-label="Blank '+(bi+1)+'" autocomplete="off" spellcheck="false">';
    }
  }
  sent.innerHTML=html;
  wrap.appendChild(sent);
  sent.querySelectorAll('.fillin').forEach(function(inp){
    inp.addEventListener('input',function(){
      if(App.lockInputs) return;
      st.vals[parseInt(inp.getAttribute('data-bank'),10)]=inp.value;
      st.hasAnswer=st.vals.some(function(v){ return v.trim().length>0; });
      enableCheck();
    });
  });
  box.appendChild(wrap);
}

/* branch (decision tree; only the final Check pauses) */
function buildBranch(ex,box,st){
  st.step=0; st.choices=[]; st.hasAnswer=false;
  var holder=el('div');
  box.appendChild(holder);
  function paintStep(){
    holder.innerHTML='';
    if(st.step>=ex.steps.length){ return; }
    var s=ex.steps[st.step];
    var card=el('div','branch-step');
    card.innerHTML='<span class="step-tag">STEP '+(st.step+1)+' OF '+ex.steps.length+'</span><div class="bq">'+s.q+'</div>';
    var letters='ABCD';
    shuffle(s.opts.map(function(o,i){ return {o:o,i:i}; })).forEach(function(w,k){
      var b=el('button','opt');
      b.type='button';
      b.innerHTML='<span class="opx">'+letters[k]+'.</span><span class="opt-t">'+w.o.t+'</span><span class="selmark hidden">&#10003; Selected</span>';
      b.addEventListener('click',function(){
        if(App.lockInputs) return;
        st.choices[st.step]=w.i;
        card.querySelectorAll('.opt').forEach(function(x){ x.classList.remove('sel'); x.querySelector('.selmark').classList.add('hidden'); });
        b.classList.add('sel'); b.querySelector('.selmark').classList.remove('hidden');
        cont.disabled=false;
      });
      card.appendChild(b);
    });
    var cont=el('button','btn small');
    cont.type='button'; cont.disabled=true;
    cont.innerHTML=(st.step===ex.steps.length-1)?'&#10003; Ready to Check':'&#9654; Continue';
    cont.addEventListener('click',function(){
      if(App.lockInputs) return;
      if(st.choices[st.step]===undefined) return;
      card.classList.add('done');
      card.querySelectorAll('button').forEach(function(b){ b.disabled=true; });
      st.step++;
      if(st.step>=ex.steps.length){ st.hasAnswer=true; enableCheck(); }
      else paintStep();
    });
    card.appendChild(cont);
    holder.appendChild(card);
  }
  paintStep();
}

/* terminal (fake shell) */
function termNorm(s){
  return norm(s).replace(/[\u201c\u201d\u2018\u2019"']/g,'');
}
function buildTerminal(ex,box,st){
  st.typed=''; st.hasAnswer=false;
  if(ex.shell.panelHtml) box.innerHTML+= '<div class="syntax-panel"><div class="sp-title"><span class="ic">&#9432;</span> SYNTAX REMINDER</div>'+ex.shell.panelHtml+'</div>';
  var term=el('div','term');
  var head=el('div','term-head');
  head.innerHTML='<span class="term-dot g"></span><span class="term-dot"></span><span class="term-dot"></span><span>'+esc(ex.shell.caption)+'</span>';
  var scroll=el('div','term-scroll');
  scroll.innerHTML='<div class="term-line">'+esc(ex.shell.banner)+'</div>';
  var inRow=el('div','term-in');
  var pl=el('span','p'); pl.textContent=ex.shell.prompt+' ';
  var inp=el('input');
  inp.type='text'; inp.autocomplete='off'; inp.spellcheck=false;
  inp.setAttribute('aria-label','Terminal input');
  var run=el('button','btn small'); run.innerHTML='&#9654; Run';
  inRow.appendChild(pl); inRow.appendChild(inp); inRow.appendChild(run);
  term.appendChild(head); term.appendChild(scroll); term.appendChild(inRow);
  box.appendChild(term);
  function doRun(){
    if(App.lockInputs) return;
    var cmd=inp.value.trim();
    if(!cmd) return;
    st.typed=cmd; st.hasAnswer=true; enableCheck();
    var line=el('div','term-line');
    line.innerHTML='<span class="p">'+esc(ex.shell.prompt)+'</span> '+esc(cmd);
    scroll.appendChild(line);
    var ncmd=termNorm(cmd);
    var danger=(ex.shell.danger||[]).some(function(d){ return d.re.test(ncmd); });
    var allOk=ex.shell.elements.every(function(e){ return e.re.test(ncmd); });
    var out=el('div','term-line '+(allOk?'ok':'err'));
    if(danger){ out.textContent='Blocked by the simulation guard: this command would change or destroy state. Nothing was executed.'; }
    else if(allOk){ out.textContent=ex.shell.out; }
    else{ out.textContent='Incorrect syntax or wrong tool for this task. Check the tool, the options and the target path, then try again.'; }
    scroll.appendChild(out);
    scroll.scrollTop=scroll.scrollHeight;
    inp.focus();
  }
  run.addEventListener('click',doRun);
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); doRun(); } });
  inp.addEventListener('input',function(){
    if(App.lockInputs) return;
    st.typed=inp.value; st.hasAnswer=inp.value.trim().length>0;
    if(st.hasAnswer) enableCheck();
  });
}

/* ---------------- grading ---------------- */
function gradeAnswer(ex,st){
  var items=[], N=1, H=0, W=0, dangerous=false, canonical=null;
  var t=ex.type;
  if(t==='qcm'||t==='spot'){
    N=1;
    var pick=st.picked[0];
    var corr=ex.opts.map(function(o,i){ return o.ok?i:-1; }).filter(function(i){ return i>-1; })[0];
    ex.opts.forEach(function(o){
      if(o.ok) items.push({label:o.t,state:(pick===ex.opts.indexOf(o))?'ok':'miss',why:o.why});
    });
    if(pick!==undefined && pick!==corr){
      items.push({label:ex.opts[pick].t,state:'bad',why:ex.opts[pick].why});
    }
    H=(pick===corr)?1:0; W=(pick!==undefined&&pick!==corr)?1:0;
  }
  else if(t==='multi'){
    var okIdx=ex.opts.map(function(o,i){ return o.ok?i:-1; }).filter(function(i){ return i>-1; });
    N=okIdx.length;
    ex.opts.forEach(function(o,i){
      var sel=st.picked.indexOf(i)>-1;
      if(o.ok&&sel){ items.push({label:o.t,state:'ok',why:o.why}); H++; }
      else if(o.ok&&!sel){ items.push({label:o.t,state:'miss',why:o.why}); }
      else if(!o.ok&&sel){ items.push({label:o.t,state:'bad',why:o.why}); W++; }
    });
  }
  else if(t==='match'){
    N=ex.pairs.length;
    ex.pairs.forEach(function(p,i){
      var pick=st.picks[i];
      if(pick===null||pick===undefined){ items.push({label:p[0]+' &rarr; '+p[1],state:'miss',why:p[2]}); }
      else if(pick===String(i)){ items.push({label:p[0]+' &rarr; '+p[1],state:'ok',why:p[2]}); H++; }
      else{ var wrongT=ex.pairs[parseInt(pick,10)][1]; items.push({label:p[0]+' &rarr; '+wrongT,state:'bad',why:p[2]}); W++; }
    });
  }
  else if(t==='triage'){
    N=ex.alerts.length;
    ex.alerts.forEach(function(a){
      var pick=st.picks[a.id];
      if(pick===null||pick===undefined){ items.push({label:a.id+' &mdash; '+a.title+' &rarr; '+ex.disps.filter(function(d){ return d.id===a.ok; })[0].label,state:'miss',why:a.why}); }
      else if(pick===a.ok){ items.push({label:a.id+' &mdash; '+a.title+' &rarr; '+ex.disps.filter(function(d){ return d.id===a.ok; })[0].label,state:'ok',why:a.why}); H++; }
      else{ var wt=ex.disps.filter(function(d){ return d.id===pick; })[0].label; items.push({label:a.id+' &mdash; '+a.title+' &rarr; '+wt,state:'bad',why:a.why}); W++; }
    });
  }
  else if(t==='dnd'){
    N=ex.bank.length;
    ex.bank.forEach(function(c,i){
      var p=st.place[i];
      if(p===undefined){ items.push({label:c.t+' &rarr; '+ex.slots[c.slot],state:'miss',why:c.why}); }
      else if(p===c.slot){ items.push({label:c.t+' &rarr; '+ex.slots[c.slot],state:'ok',why:c.why}); H++; }
      else{ items.push({label:c.t+' &rarr; '+ex.slots[p],state:'bad',why:c.why}); W++; }
    });
  }
  else if(t==='fill'){
    N=ex.blanks.length;
    ex.blanks.forEach(function(b,i){
      var v=norm(st.vals[i]||'');
      if(v===''){ items.push({label:'Blank '+(i+1)+': '+esc(b.disp),state:'miss',why:b.why}); }
      else if(b.a.some(function(acc){ return norm(acc)===v; })){ items.push({label:'Blank '+(i+1)+': '+esc(b.disp),state:'ok',why:b.why}); H++; }
      else{ items.push({label:'Blank '+(i+1)+': '+esc(st.vals[i]),state:'bad',why:b.why}); W++; }
    });
  }
  else if(t==='order'){
    N=ex.items.length;
    st.list.forEach(function(ii,pos){
      if(ii===pos){ items.push({label:'Position '+(pos+1)+': '+esc(ex.items[ii]),state:'ok',why:ex.why[ii]}); H++; }
      else{ items.push({label:'Position '+(pos+1)+': '+esc(ex.items[ii]),state:'bad',why:ex.why[ii]}); W++; }
    });
  }
  else if(t==='branch'){
    N=ex.steps.length;
    ex.steps.forEach(function(s,i){
      var ch=st.choices[i];
      var corr=s.opts.map(function(o,oi){ return o.ok?oi:-1; }).filter(function(x){ return x>-1; })[0];
      if(ch===undefined){ items.push({label:'Step '+(i+1),state:'miss',why:s.opts[corr].why}); }
      else if(ch===corr){ items.push({label:'Step '+(i+1)+': '+s.opts[ch].t,state:'ok',why:s.opts[corr].why}); H++; }
      else{ items.push({label:'Step '+(i+1)+': '+s.opts[ch].t,state:'bad',why:s.opts[ch].why}); W++; }
    });
  }
  else if(t==='terminal'){
    N=ex.shell.elements.length;
    var ncmd=termNorm(st.typed);
    dangerous=(ex.shell.danger||[]).some(function(d){ return d.re.test(ncmd); });
    ex.shell.elements.forEach(function(e){
      if(e.re.test(ncmd)){ items.push({label:e.label,state:'ok',why:e.why}); H++; }
      else{ items.push({label:e.label,state:'miss',why:e.why}); }
    });
    canonical=ex.shell.canonical;
  }
  var credit=scoreExercise(H,W,N);
  if(dangerous) credit=0;
  return {credit:credit,items:items,dangerous:dangerous,canonical:canonical};
}

/* ---------------- feedback ---------------- */
var ICONS={ok:['&#10003;','Correct'],bad:['&#10007;','Wrong'],miss:['&#9675;','Missed']};
function renderFeedback(ex,res,credit){
  var box=$('fbBox');
  var cls,head;
  if(res.dangerous){ cls='incorrect'; head='<span class="ic">&#10007;</span> DANGEROUS &mdash; NEAR MISS'; }
  else if(credit>=1){ cls='correct'; head='<span class="ic">&#10003;</span> CORRECT'; }
  else if(credit>0){ cls='partial'; head='<span class="ic">&#10003;</span> PARTIALLY CORRECT'; }
  else{ cls='incorrect'; head='<span class="ic">&#10007;</span> INCORRECT'; }
  var okN=res.items.filter(function(i){ return i.state==='ok'; }).length;
  var N=res.items.length;
  var creditChip='<span class="fb-credit">credit '+credit.toFixed(2)+' &mdash; '+okN+'/'+N+' items &mdash; max(0, (H&minus;W) / N)</span>';
  var h='<div class="fb '+cls+'"><div class="fb-head">'+head+creditChip+'</div><div class="fb-body">';
  h+='<h4>Why</h4>'+ex.exp;
  if(res.dangerous && ex.shell.dangerNote){ h+='<div class="itemrow"><span class="ic ic-bad">&#10007;</span><span><b>Danger detected in your command.</b> '+ex.shell.dangerNote+'</span></div>'; }
  if(res.items.length){
    h+='<h4>Item-by-item</h4>';
    res.items.forEach(function(it){
      var ic=ICONS[it.state];
      h+='<div class="itemrow"><span class="ic '+(it.state==='ok'?'ic-ok':(it.state==='bad'?'ic-bad':'ic-miss'))+'">'+ic[0]+'</span><span><b>'+ic[1]+'</b> &mdash; '+it.label+'. '+it.why+'</span></div>';
    });
  }
  if(res.canonical){
    h+='<h4>Canonical command</h4><div class="codeblock"><button class="copy" data-copy="'+esc(res.canonical)+'">Copy</button><code>'+esc(res.canonical)+'</code></div>';
    (ex.shell.explain||[]).forEach(function(l){ h+='<div class="itemrow"><span class="ic ic-ok">&#10003;</span><span>'+l+'</span></div>'; });
  }
  if(ex.study){ h+='<div class="study"><b>What to study next:</b> '+ex.study+'</div>'; }
  h+='</div></div>';
  box.innerHTML=h;
  var copyBtn=box.querySelector('.copy');
  if(copyBtn) copyBtn.addEventListener('click',function(){
    var txt=copyBtn.getAttribute('data-copy');
    var done=function(){ toast('Copied to clipboard'); };
    var fallback=function(){
      try{
        var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        done();
      }catch(e){ toast('Copy failed - select the text manually'); }
    };
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        var pr=navigator.clipboard.writeText(txt);
        if(pr&&pr.then){ pr.then(done,fallback); } else { done(); }
      }
      else{ fallback(); }
    }catch(e){ fallback(); }
  });
  scrollNearest(box);
}

/* ---------------- exercise rendering ---------------- */
var BUILDERS={
  qcm:function(ex,box,st){ buildChoice(ex,box,st,false); },
  spot:function(ex,box,st){ buildChoice(ex,box,st,false); },
  multi:function(ex,box,st){ buildChoice(ex,box,st,true); },
  match:function(ex,box,st){ buildMatch(ex,box,st); },
  triage:function(ex,box,st){ buildTriage(ex,box,st); },
  dnd:function(ex,box,st){ buildDnd(ex,box,st); },
  order:function(ex,box,st){ buildOrder(ex,box,st); },
  fill:function(ex,box,st){ buildFill(ex,box,st); },
  branch:function(ex,box,st){ buildBranch(ex,box,st); },
  terminal:function(ex,box,st){ buildTerminal(ex,box,st); }
};
function renderExercise(pos){
  var idx=App.order[pos], ex=App.exById(idx);
  App.curIdx=pos; App.curExIdx=idx; App.lockInputs=false;
  $('counter').textContent=(pos+1)+' / '+PAYLOAD.exercises.length;
  $('exMeta').innerHTML='<span class="ex-type"><span class="ic">&#9679;</span> '+esc(ex.extype)+'</span> <span class="ex-meta-inline">Exercise '+(pos+1)+' of '+PAYLOAD.exercises.length+'</span>';
  var card=$('exCard');
  card.innerHTML='';
  buildScenario(ex,card);
  var qb=el('div','blk b-q');
  qb.innerHTML='<div class="blk-head"><span class="ic">&#63;</span>QUESTION</div><div class="blk-body"><p style="font-weight:700;margin:4px 0;">'+ex.prompt+'</p></div>';
  card.appendChild(qb);
  var ab=el('div','blk b-ans');
  ab.innerHTML='<div class="blk-head"><span class="ic">&#9998;</span>YOUR ANSWER</div><div class="blk-body" id="ansBox"></div>';
  card.appendChild(ab);
  var bar=el('div','actionbar');
  bar.innerHTML='<button id="checkBtn" class="btn green" disabled><span class="ic">&#10003;</span> Check</button><span id="nextWrap"></span><span class="note" style="color:var(--text-secondary);font-size:13px;">Check stops the clock while you read the feedback.</span>';
  card.appendChild(bar);
  var hintBox=el('div'); hintBox.id='hintBox'; card.appendChild(hintBox);
  var fb=el('div'); fb.id='fbBox'; card.appendChild(fb);
  App.answers[ex.id]={hasAnswer:false};
  BUILDERS[ex.type](ex,$('ansBox'),App.answers[ex.id]);
  $('checkBtn').addEventListener('click',function(){ Actions.check(); });
  $('hintBtn').disabled=!!App.hintUsed[ex.id];
  $('skipBtn').disabled=false;
  scrollToTop();
  App.progress();
}

/* ---------------- review screen ---------------- */
App.showReview=function(){
  this.reviewing=false;
  $('exam').classList.add('hidden');
  var skipped=this.skippedIdxs();
  var h='<div class="card intro-sec"><h2 class="sec-h"><span class="ic">&#9203;</span>Review skipped exercises</h2>'
    +'<div class="prose"><p>You skipped '+skipped.length+' exercise'+(skipped.length===1?'':'s')+'. You can answer them now, as many times as you like, until the timer ends. If you submit without answering them, they are excluded from the score.</p></div>';
  h+='<div class="res-list">';
  skipped.forEach(function(idx){
    var ex=PAYLOAD.exercises[idx];
    var pos=App.order.indexOf(idx);
    h+='<div class="rev-item"><span class="r-l"><span class="sk"><span class="ic">&#9888;</span>Skipped</span> Exercise '+(pos+1)+' &mdash; '+esc(ex.extype)+'</span><button class="btn small" data-ans="'+idx+'">&#9998; Answer</button></div>';
  });
  h+='</div><div class="startrow"><button id="finalSubmitBtn" class="btn primary">&#9632; Final Submit</button>'
    +'<span class="note">Skipped-and-never-answered exercises do not count as wrong. They are simply excluded.</span></div></div>';
  $('review').innerHTML=h;
  $('review').classList.remove('hidden');
  $('review').querySelectorAll('[data-ans]').forEach(function(b){
    b.addEventListener('click',function(){
      var idx=parseInt(b.getAttribute('data-ans'),10);
      var pos=App.order.indexOf(idx);
      App.reviewing=true;
      $('review').classList.add('hidden');
      $('exam').classList.remove('hidden');
      App.renderExerciseReview(pos);
    });
  });
  $('finalSubmitBtn').addEventListener('click',function(){
    App.reviewing=false;
    finishExam(false);
  });
};
App.renderExerciseReview=function(pos){
  renderExercise(pos);
};

/* ---------------- results ---------------- */
function finishExam(byTimeout){
  if(App.finishing) return;
  App.finishing=true;
  Timer.end(true);
  var answered=[],leftOver=[];
  App.order.forEach(function(idx){
    var s=App.status[idx];
    if(s==='answered') answered.push(idx); else leftOver.push(idx);
  });
  var sum=0,full=0,partial=0,zero=0,psum=0;
  answered.forEach(function(idx){
    var c=App.credits[PAYLOAD.exercises[idx].id]||0;
    sum+=c;
    if(c>=1){ full++; }
    else if(c>0){ partial++; psum+=c; }
    else{ zero++; }
  });
  var aN=answered.length;
  var pct=aN>0?Math.round(100*sum/aN):0;
  var pass=pct>=70;
  var rows='';
  answered.forEach(function(idx){
    var ex=PAYLOAD.exercises[idx], c=App.credits[ex.id]||0;
    var ic,cc;
    if(c>=1){ ic='<span class="ic ic-ok">&#10003;</span>'; }
    else if(c>0){ ic='<span class="ic ic-part">&#10003;</span>'; }
    else{ ic='<span class="ic ic-bad">&#10007;</span>'; }
    rows+='<div class="res-row"><span>'+ic+' '+esc(ex.extype)+'</span><span class="rr-cred">'+c.toFixed(2)+' / 1.00</span></div>';
  });
  leftOver.forEach(function(idx){
    var ex=PAYLOAD.exercises[idx];
    rows+='<div class="res-row"><span><span class="ic ic-miss">&#9888;</span> '+esc(ex.extype)+' &mdash; Skipped, not answered (excluded)</span><span class="rr-cred">&mdash;</span></div>';
  });
  var partialAvg=partial>0?(psum/partial):0;
  var h='<div class="card res-hero">'
    +'<h2 class="ih-title">'+esc(PAYLOAD.objId)+' &mdash; '+esc(PAYLOAD.sevName)+' results</h2>'
    +'<p class="ih-obj">Computed over the '+aN+' exercise'+(aN===1?'':'s')+' you actually answered. Skipped-and-never-answered exercises are excluded.</p>'
    +'<div class="res-pct"><span class="mono">'+pct+'%</span> <small style="font-size:16px;color:var(--text-secondary);">('+fmt1(sum)+' credit over '+aN+')</small></div>'
    +'<div class="verdict '+(pass?'pass':'fail')+'">'+(pass?'<span class="ic">&#10003;</span> PASS':'<span class="ic">&#10007;</span> FAIL')+' &mdash; pass mark 70%</div>'
    +'<div class="res-grid">'
    +'<div class="res-cell"><div class="rl"><span class="ic ic-ok">&#10003;</span> Fully correct</div><div class="rv">'+full+'</div></div>'
    +'<div class="res-cell"><div class="rl"><span class="ic ic-part">&#10003;</span> Partially correct</div><div class="rv">'+partial+(partial?' <small>avg '+(Math.round(partialAvg*100)/100).toFixed(2)+'</small>':'')+'</div></div>'
    +'<div class="res-cell"><div class="rl"><span class="ic ic-bad">&#10007;</span> Fully incorrect</div><div class="rv">'+zero+'</div></div>'
    +'<div class="res-cell"><div class="rl"><span class="ic ic-miss">&#9888;</span> Skipped &mdash; excluded</div><div class="rv">'+leftOver.length+'</div></div>'
    +'</div>'
    +(pass?'<div class="prose" style="margin-top:14px;"><p>You reached the pass mark. Re-run the exam to shuffle everything again and confirm your mastery of '+esc(PAYLOAD.objId)+'.</p></div>'
          :'<div class="prose" style="margin-top:14px;"><p>You must retake this exam to reach 70%. Read the feedback below again, then press Retake Exam.</p></div>')
    +'<div class="res-list">'+rows+'</div>'
    +'<div class="timer-stats">'
    +'<div class="ts-row"><span class="k">Time on the clock when finished</span><span class="mono">'+fmtClock(PAYLOAD.budgetSec*1000-Timer.remain)+'</span></div>'
    +'<div class="ts-row"><span class="k ic-pause">&#9208; Time paused manually</span><span class="mono">'+fmtClock(Timer.manualMs)+'</span></div>'
    +'<div class="ts-row"><span class="k ic-pause">&#9208; Time reviewing feedback (auto-pause)</span><span class="mono">'+fmtClock(Timer.feedbackMs)+'</span></div>'
    +'</div>'
    +'<div class="startrow"><button id="retakeBtn" class="btn primary">&#8635; Retake Exam</button></div>'
    +'</div>';
  $('results').innerHTML=h;
  $('exam').classList.add('hidden');
  $('review').classList.add('hidden');
  $('results').classList.remove('hidden');
  $('retakeBtn').addEventListener('click',function(){
    $('results').classList.add('hidden');
    App.finishing=false;
    App.start();
  });
  if(!App.reported){ App.reported=true; reportScore(sum,aN); }
  scrollToTop();
}

/* ---------------- timeout path ---------------- */
App.finishByTimeout=function(){
  if(App.reported || App.finishing) return;
  finishExam(true);
};

/* ---------------- init ---------------- */
function initExam(){
  document.body.classList.add(PAYLOAD.sevCls);
  document.title=PAYLOAD.docTitle;
  renderIntro();
  renderHeaderStatic();
}
initExam();

/* compile terminal regexes from payload */
PAYLOAD.exercises.forEach(function(ex){ if(ex.type==='terminal'){ (ex.shell.elements||[]).forEach(function(e){ e.re=new RegExp(e.re,'i'); }); (ex.shell.danger||[]).forEach(function(d){ d.re=new RegExp(d.re,'i'); }); } });

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
