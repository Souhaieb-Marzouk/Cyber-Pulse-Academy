<style>
:root{
  --bg-page:#0b1020;
  --bg-surface:#121a2e;
  --bg-surface-2:#0f1729;
  --border:#243049;
  --text-primary:#e6ecff;
  --text-secondary:#a9b4d0;
  --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff;
  --accent-amber:#ffb454;
  --accent-green:#57d38c;
  --state-correct:#57d38c;
  --state-partial:#ffb454;
  --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0;
  --state-paused:#9d7bff;
  --sev-easy:#57d38c;
  --sev-medium:#ffb454;
  --sev-hard:#ff8a3d;
  --sev-extreme:#ff6b6b;
  --sev-easy-bg:rgba(87,211,140,.13);
  --sev-medium-bg:rgba(255,180,84,.13);
  --sev-hard-bg:rgba(255,138,61,.13);
  --sev-extreme-bg:rgba(255,107,107,.13);
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"Cascadia Code",Consolas,"SF Mono",Menlo,"Liberation Mono","Courier New",monospace;
  /* derived surface + tint tokens (all colour literals live here, once) */
  --btn-bg:#182238;
  --btn-bg-hover:#1c2a48;
  --accent-blue-strong:#7abcff;
  --accent-green-strong:#7ce3ab;
  --on-primary:#06121f;
  --on-green:#05130b;
  --opt-bg-hover:#132038;
  --input-bg:#0b1322;
  --term-bg:#070d1a;
  --hdr-bg:rgba(13,19,36,.97);
  --progress-track:#0d1428;
  --kw-blue:#7fd0ff;
  --tint-green:rgba(87,211,140,.08);
  --tint-green-2:rgba(87,211,140,.09);
  --tint-green-3:rgba(87,211,140,.1);
  --tint-amber:rgba(255,180,84,.08);
  --tint-amber-2:rgba(255,180,84,.06);
  --tint-amber-border:rgba(255,180,84,.45);
  --tint-red:rgba(255,107,107,.1);
  --tint-blue:rgba(90,169,255,.05);
  --tint-overlay:rgba(7,10,22,.88);
  --sheen:rgba(255,255,255,.35);
  --tint-overlay:rgba(7,10,22,.88);
  --sheen:rgba(255,255,255,.35);
  --tint-overlay:rgba(7,10,22,.88);
  --sheen:rgba(255,255,255,.35);
  --shadow-a:0 8px 22px rgba(0,0,0,.28);
  --shadow-b:0 6px 18px rgba(0,0,0,.35);
  --shadow-c:0 6px 16px rgba(0,0,0,.25);
  --shadow-d:0 10px 26px rgba(0,0,0,.4);
}
html,body{margin:0;padding:0;}
html{color-scheme:dark;}
body{
  background:var(--bg-page);
  color:var(--text-primary);
  font-family:var(--font-ui);
  font-size:16px;
  line-height:1.55;
  min-height:100vh;
}
body.sev-easy{--sev:var(--sev-easy);--sev-bg:var(--sev-easy-bg);}
body.sev-medium{--sev:var(--sev-medium);--sev-bg:var(--sev-medium-bg);}
body.sev-hard{--sev:var(--sev-hard);--sev-bg:var(--sev-hard-bg);}
body.sev-extreme{--sev:var(--sev-extreme);--sev-bg:var(--sev-extreme-bg);}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 60px;}
.hidden{display:none !important;}
button{font-family:var(--font-ui);}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px;}
.ic{font-style:normal;font-weight:700;}

/* ---------- sticky exam header ---------- */
#hdr{
  position:sticky;top:0;z-index:40;
  background:var(--hdr-bg);
  border-bottom:1px solid var(--border);
  box-shadow:var(--shadow-b);
}
#hdrIn{
  max-width:1000px;margin:0 auto;padding:10px 16px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
}
.hdr-title{font-weight:700;font-size:15px;color:var(--text-primary);margin-right:4px;}
.hdr-title .mono{font-family:var(--font-mono);}
.sev-badge{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--sev);color:var(--sev);background:var(--sev-bg);
  border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800;letter-spacing:.07em;
  min-height:30px;
}
.sev-badge .dot{width:9px;height:9px;border-radius:50%;background:var(--sev);}
.chipstat{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--border);border-radius:999px;
  background:var(--bg-surface);padding:6px 12px;font-size:13.5px;color:var(--text-primary);
  min-height:34px;
}
.chipstat .lbl{color:var(--text-secondary);}
.chipstat .mono{font-family:var(--font-mono);font-weight:700;}
.chipstat.ts-run{color:var(--text-primary);}
.chipstat.ts-paused{color:var(--state-paused);border-color:var(--state-paused);}
.chipstat.ts-ended{color:var(--state-incorrect);border-color:var(--state-incorrect);}
.score-sum{font-weight:800;}
.hdr-spacer{flex:1;}
.btn{
  min-height:44px;padding:9px 18px;border-radius:6px;cursor:pointer;
  border:1px solid var(--border);background:var(--btn-bg);color:var(--text-primary);
  font-weight:600;font-size:14.5px;transition:background .15s,border-color .15s;
}
.btn:hover{border-color:var(--accent-blue);background:var(--btn-bg-hover);}
.btn.primary{background:var(--accent-blue);border-color:var(--accent-blue);color:var(--on-primary);font-weight:800;}
.btn.primary:hover{background:var(--accent-blue-strong);}
.btn.green{background:var(--accent-green);border-color:var(--accent-green);color:var(--on-green);font-weight:800;}
.btn.green:hover{background:var(--accent-green-strong);}
.btn.ghost{background:transparent;}
.btn.danger{background:transparent;border-color:var(--state-incorrect);color:var(--state-incorrect);}
.btn.danger:hover{background:var(--tint-red);}
.btn.small{min-height:44px;padding:6px 13px;font-size:13.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn .ic{margin-right:4px;}

/* ---------- progress bar ---------- */
#progressWrap{position:sticky;top:57px;z-index:39;height:6px;background:var(--progress-track);border-bottom:1px solid var(--border);}
#progressBar{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--sev),var(--accent-blue));
  border-radius:0 3px 3px 0;position:relative;overflow:hidden;
  transition:width .4s ease;
}
#progressBar::after{
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,var(--sheen),transparent);
  animation:sheen 2.8s linear infinite;
}
@keyframes sheen{to{left:110%;}}

/* ---------- cards / blocks ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-a);}
.blk{background:var(--bg-surface);border:1px solid var(--border);border-left:4px solid var(--accent-blue);border-radius:8px;margin:16px 0;box-shadow:var(--shadow-c);}
.blk.b-q{border-left-color:var(--accent-amber);}
.blk.b-ans{border-left-color:var(--accent-green);}
.blk-head{
  display:flex;align-items:center;gap:9px;padding:10px 14px;
  border-bottom:1px solid var(--border);font-weight:800;font-size:13.5px;letter-spacing:.09em;
}
.b-scen>.blk-head{color:var(--accent-blue);}
.b-q>.blk-head{color:var(--accent-amber);}
.b-ans>.blk-head{color:var(--accent-green);}
.blk-head .ic{font-size:15px;}
.blk-body{padding:14px 16px;}
.ex-meta{color:var(--text-secondary);font-size:13.5px;margin:12px 2px 0;}
.ex-type{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
  border-radius:999px;padding:3px 11px;font-size:12px;color:var(--text-secondary);
  background:var(--bg-surface);letter-spacing:.05em;
}

/* ---------- scenario / artefacts ---------- */
.sc-toggle{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:transparent;border:none;color:var(--text-secondary);
  padding:10px 14px;cursor:pointer;font-size:13.5px;min-height:44px;
}
.sc-toggle:hover{color:var(--text-primary);}
.sc-toggle .sum{flex:1;}
.sc-toggle .state-word{font-size:12px;letter-spacing:.06em;border:1px solid var(--border);border-radius:999px;padding:2px 10px;color:var(--text-secondary);}
.sc-panels{padding:2px 14px 14px;}
.art{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;margin:10px 0;overflow:hidden;}
.art-label{
  font-family:var(--font-mono);font-size:12px;color:var(--accent-blue);
  padding:8px 12px 2px;letter-spacing:.07em;font-weight:700;
}
.art-body{padding:8px 12px 12px;font-size:15px;}
.art-body p{margin:6px 0;}
.prose p{margin:8px 0;}
.mono{font-family:var(--font-mono);}
code.inline{
  font-family:var(--font-mono);font-size:14px;color:var(--text-mono);
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;
}

/* ---------- log viewer ---------- */
.log-tools{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px dashed var(--border);}
.log-filter{
  flex:1;max-width:340px;min-height:44px;background:var(--input-bg);border:1px solid var(--border);
  color:var(--text-mono);font-family:var(--font-mono);font-size:13.5px;border-radius:4px;padding:6px 10px;
}
.log-count{font-size:12.5px;color:var(--text-secondary);font-family:var(--font-mono);}
.log{font-family:var(--font-mono);font-size:13.8px;line-height:1.6;padding:10px 12px;overflow-x:auto;white-space:pre;color:var(--text-mono);}
.logline{display:block;}
.logline.off{display:none;}
.lg-t{color:var(--text-secondary);}
.lg-ev{color:var(--accent-blue);font-weight:700;}
.lg-val{color:var(--accent-amber);}
.lg-str{color:var(--accent-green);}
.lg-kw{color:var(--kw-blue);font-weight:700;}
.lg-warn{color:var(--state-incorrect);font-weight:700;}
.lg-dim{color:var(--text-secondary);}

/* ---------- answer widgets ---------- */
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;
  padding:12px 14px;margin:9px 0;min-height:44px;color:var(--text-primary);
  cursor:pointer;font-size:15.5px;line-height:1.5;transition:border-color .15s,background .15s;
}
.opt:hover{border-color:var(--accent-blue);background:var(--opt-bg-hover);}
.opt .opx{color:var(--text-secondary);font-weight:800;flex:0 0 auto;}
.opt.sel{
  border-color:var(--accent-green);box-shadow:inset 4px 0 0 var(--accent-green);
  background:var(--tint-green);
}
.opt.sel .selmark{margin-left:auto;color:var(--accent-green);font-weight:700;font-size:13px;white-space:nowrap;}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;min-height:52px;}
.chip{
  display:inline-flex;align-items:center;gap:8px;min-height:44px;
  background:var(--bg-surface-2);border:1px dashed var(--border);border-radius:6px;
  padding:8px 14px;color:var(--text-primary);font-size:14.5px;cursor:grab;user-select:none;
}
.chip.sel{border-color:var(--accent-amber);box-shadow:0 0 0 1px var(--accent-amber);}
.chip.dragging{opacity:.45;}
.chip .rm{border:none;background:transparent;color:var(--state-incorrect);cursor:pointer;font-size:15px;padding:2px 4px;min-height:44px;min-width:44px;}
.slots{display:grid;gap:12px;margin-top:6px;}
.slot{
  border:1px dashed var(--border);border-radius:8px;background:var(--tint-blue);
  padding:10px 12px;min-height:60px;transition:border-color .15s,background .15s;
}
.slot.over{border-color:var(--accent-green);background:var(--tint-green-2);border-style:solid;}
.slot-label{font-family:var(--font-mono);font-size:12.5px;color:var(--accent-blue);letter-spacing:.06em;font-weight:700;margin-bottom:6px;display:flex;gap:8px;align-items:center;}
.slot-label .cap{color:var(--text-secondary);font-weight:400;}
.slot .bank{margin:4px 0 0;}
.selrow{
  display:grid;grid-template-columns:1fr minmax(220px,340px);gap:12px;align-items:center;
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;
  padding:10px 12px;margin:9px 0;
}
.selrow .left{font-size:15px;}
.selrow .left .sub{display:block;color:var(--text-secondary);font-size:13px;margin-top:2px;}
select,input[type=text].fillin{
  min-height:44px;background:var(--input-bg);border:1px solid var(--border);color:var(--text-primary);
  border-radius:4px;padding:8px 10px;font-size:14.5px;font-family:var(--font-ui);width:100%;
}
select:focus,input[type=text]:focus{border-color:var(--accent-blue);}
input[type=text].fillin{font-family:var(--font-mono);}
.fill-sent{font-size:16px;line-height:2;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:12px 14px;}
.fill-sent input{width:200px;margin:0 4px;display:inline-block;}
.ord-list{margin:6px 0;}
.ord-item{
  display:flex;gap:10px;align-items:center;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:9px 0;
  min-height:48px;cursor:grab;font-size:15px;
}
.ord-item.dragging{opacity:.4;}
.ord-item.over{border-color:var(--accent-green);border-style:solid;}
.ord-handle{color:var(--text-secondary);font-size:15px;letter-spacing:2px;}
.ord-btns{display:flex;gap:6px;margin-left:auto;}
.ord-btns .btn{min-height:44px;min-width:44px;padding:4px 10px;font-size:14px;}
.step-tag{
  display:inline-flex;gap:6px;align-items:center;border:1px solid var(--accent-amber);
  color:var(--accent-amber);border-radius:999px;font-size:12px;font-weight:800;
  padding:2px 10px;letter-spacing:.07em;margin:4px 0 8px;
}
.branch-step{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:12px 0;background:var(--bg-surface-2);}
.branch-step.done{opacity:.92;border-style:dashed;}
.branch-step .bq{font-weight:700;margin-bottom:8px;}
.alert-card{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:10px 0;}
.alert-card .a-title{display:flex;gap:10px;align-items:center;font-weight:700;}
.alert-card .a-id{font-family:var(--font-mono);color:var(--accent-blue);font-size:13px;}
.alert-card .a-meta{color:var(--text-secondary);font-size:13.5px;margin:6px 0;}
.prio-wrap{display:flex;flex-direction:column;gap:0;}
.rank-badge{
  flex:0 0 30px;height:30px;border-radius:50%;border:1px solid var(--sev);color:var(--sev);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--font-mono);font-size:14px;
}

/* ---------- terminal ---------- */
.term{background:var(--term-bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:10px 0;}
.term-head{
  display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--input-bg);
  border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:12.5px;color:var(--text-secondary);
}
.term-dot{width:10px;height:10px;border-radius:50%;background:var(--border);}
.term-dot.g{background:var(--accent-green);}
.term-scroll{max-height:230px;overflow-y:auto;padding:10px 12px;font-family:var(--font-mono);font-size:14px;color:var(--text-mono);white-space:pre-wrap;word-break:break-word;}
.term-line .p{color:var(--accent-green);font-weight:700;}
.term-line.err{color:var(--state-incorrect);}
.term-line.ok{color:var(--accent-green);}
.term-in{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--border);align-items:center;}
.term-in .p{font-family:var(--font-mono);color:var(--accent-green);font-weight:700;font-size:14px;white-space:nowrap;}
.term-in input{
  flex:1;min-height:44px;background:var(--input-bg);border:1px solid var(--border);color:var(--text-mono);
  font-family:var(--font-mono);font-size:14px;border-radius:4px;padding:8px 10px;
}
.syntax-panel{
  background:var(--bg-surface-2);border:1px solid var(--border);border-left:4px solid var(--accent-blue);
  border-radius:6px;padding:10px 14px;margin:10px 0;font-size:14px;
}
.syntax-panel .sp-title{font-family:var(--font-mono);font-size:12px;color:var(--accent-blue);font-weight:700;letter-spacing:.07em;margin-bottom:6px;}
.syntax-panel code{font-family:var(--font-mono);color:var(--text-mono);font-size:13.5px;display:block;margin:3px 0;}
.syntax-panel .cm{color:var(--text-secondary);}
.codeblock{position:relative;background:var(--term-bg);border:1px solid var(--border);border-radius:6px;margin:10px 0;}
.codeblock code{display:block;font-family:var(--font-mono);font-size:14px;color:var(--text-mono);padding:12px 14px;white-space:pre-wrap;word-break:break-word;}
.codeblock .copy{
  position:absolute;top:6px;right:6px;min-height:44px;min-width:44px;padding:2px 12px;font-size:12px;
  background:var(--bg-surface);border:1px solid var(--border);border-radius:4px;color:var(--text-secondary);cursor:pointer;
}
.codeblock .copy:hover{color:var(--text-primary);border-color:var(--accent-blue);}

/* ---------- hint / feedback ---------- */
.hint-panel{
  border:1px solid var(--tint-amber-border);background:var(--tint-amber);
  border-radius:6px;padding:10px 14px;margin:12px 0;color:var(--text-primary);font-size:15px;
}
.hint-panel .hp-head{color:var(--accent-amber);font-weight:800;font-size:13px;letter-spacing:.07em;display:flex;gap:7px;align-items:center;margin-bottom:4px;}
.fb{border:1px solid var(--border);border-left:5px solid var(--state-correct);border-radius:8px;background:var(--bg-surface);margin:16px 0 0;box-shadow:var(--shadow-c);}
.fb.correct{border-left-color:var(--state-correct);}
.fb.partial{border-left-color:var(--state-partial);}
.fb.incorrect{border-left-color:var(--state-incorrect);}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:800;letter-spacing:.06em;font-size:15px;flex-wrap:wrap;}
.fb.correct .fb-head{color:var(--state-correct);}
.fb.partial .fb-head{color:var(--state-partial);}
.fb.incorrect .fb-head{color:var(--state-incorrect);}
.fb-credit{
  font-family:var(--font-mono);font-size:12.5px;border:1px solid var(--border);
  border-radius:999px;padding:2px 10px;color:var(--text-secondary);font-weight:400;letter-spacing:0;
}
.fb-body{padding:4px 16px 16px;color:var(--text-primary);font-size:15px;}
.fb-body h4{margin:12px 0 6px;font-size:14px;color:var(--text-secondary);letter-spacing:.05em;font-weight:700;}
.itemrow{
  display:flex;gap:10px;align-items:flex-start;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:6px;padding:9px 12px;margin:7px 0;font-size:14.5px;
}
.itemrow .ic{flex:0 0 auto;margin-top:1px;}
.ic-ok{color:var(--state-correct);}
.ic-bad{color:var(--state-incorrect);}
.ic-miss{color:var(--state-skipped);}
.ic-part{color:var(--state-partial);}
.ic-pause{color:var(--state-paused);}
.study{border:1px dashed var(--accent-amber);border-radius:6px;background:var(--tint-amber-2);padding:10px 12px;margin-top:10px;font-size:14.5px;}
.study b{color:var(--accent-amber);}
.actionbar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center;}

/* ---------- pause overlay ---------- */
#pauseOverlay{
  position:fixed;inset:0;z-index:60;background:var(--tint-overlay);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.pauseBox{max-width:460px;width:100%;padding:26px;text-align:center;}
body.paused-blur #exam,body.paused-blur #review{filter:blur(16px);}
body.paused-blur #hdr{filter:blur(4px);}
.pauseBox .big{font-size:40px;color:var(--state-paused);}
.pauseBox h2{margin:8px 0 6px;color:var(--state-paused);letter-spacing:.06em;}
.pauseBox p{color:var(--text-secondary);}

/* ---------- intro screen ---------- */
.intro-hero{padding:22px 24px;margin-top:24px;}
.ih-title{font-size:26px;font-weight:800;margin:0 0 4px;letter-spacing:.01em;}
.ih-obj{color:var(--text-secondary);font-size:15px;margin:0 0 14px;}
.ih-obj .mono{color:var(--accent-blue);}
.facts{display:flex;flex-wrap:wrap;gap:10px;}
.fact{
  border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);
  padding:10px 14px;min-width:130px;
}
.fact .fl{font-size:12px;color:var(--text-secondary);letter-spacing:.07em;font-weight:700;}
.fact .fv{font-size:16.5px;font-weight:800;margin-top:3px;}
.fact .fv .mono{font-size:15.5px;}
.intro-sec{margin-top:18px;padding:20px 24px;}
.sec-h{
  display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;
  color:var(--text-primary);margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--border);
}
.sec-h .ic{color:var(--accent-blue);}
.prose{font-size:15.5px;color:var(--text-primary);}
.prose p{margin:10px 0;}
.kw-theme{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 16px;margin:12px 0;}
.kw-theme h4{margin:0 0 8px;font-size:14px;color:var(--accent-blue);letter-spacing:.06em;display:flex;gap:8px;align-items:center;}
.kw-list{display:flex;flex-wrap:wrap;gap:8px;}
.kw{
  border:1px solid var(--border);border-radius:999px;background:var(--bg-surface);
  color:var(--text-primary);font-size:13.5px;padding:4px 12px;
}
.how-list{margin:8px 0 0;padding:0 0 0 2px;list-style:none;}
.how-list li{
  display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--border);
  font-size:15px;
}
.how-list li:last-child{border-bottom:none;}
.how-list .ic{flex:0 0 auto;margin-top:1px;}
.startrow{margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.startrow .note{color:var(--text-secondary);font-size:13.5px;}

/* ---------- review screen ---------- */
.rev-item{
  display:flex;gap:12px;align-items:center;justify-content:space-between;
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;
  padding:12px 16px;margin:10px 0;flex-wrap:wrap;
}
.rev-item .r-l{display:flex;gap:10px;align-items:center;font-size:15px;}
.rev-item .sk{
  color:var(--state-skipped);font-weight:700;font-size:13px;border:1px solid var(--border);
  border-radius:999px;padding:2px 10px;display:inline-flex;gap:6px;align-items:center;
}

/* ---------- results ---------- */
.res-hero{padding:24px;margin-top:24px;text-align:left;}
.res-pct{font-size:44px;font-weight:800;}
.res-pct .mono{font-size:30px;}
.verdict{
  display:inline-flex;align-items:center;gap:10px;border-radius:10px;padding:10px 20px;
  font-size:22px;font-weight:800;letter-spacing:.08em;margin-top:6px;
}
.verdict.pass{border:1px solid var(--state-correct);color:var(--state-correct);background:var(--tint-green-3);}
.verdict.fail{border:1px solid var(--state-incorrect);color:var(--state-incorrect);background:var(--tint-red);}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:18px;}
.res-cell{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;}
.res-cell .rl{font-size:12.5px;color:var(--text-secondary);font-weight:700;letter-spacing:.06em;display:flex;gap:7px;align-items:center;}
.res-cell .rv{font-size:24px;font-weight:800;margin-top:4px;}
.res-cell .rv small{font-size:13px;color:var(--text-secondary);font-weight:600;}
.res-list{margin-top:14px;}
.res-row{
  display:flex;gap:10px;align-items:center;justify-content:space-between;
  border:1px solid var(--border);border-radius:6px;background:var(--bg-surface-2);
  padding:8px 12px;margin:7px 0;font-size:14px;flex-wrap:wrap;
}
.res-row .rr-cred{font-family:var(--font-mono);font-weight:700;}
.timer-stats{margin-top:16px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 16px;font-size:14.5px;}
.timer-stats .ts-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;flex-wrap:wrap;}
.timer-stats .ts-row .k{color:var(--text-secondary);}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--bg-surface);border:1px solid var(--accent-amber);color:var(--text-primary);
  border-radius:8px;padding:10px 18px;font-size:14.5px;z-index:80;box-shadow:var(--shadow-d);
}

/* ---------- responsive ---------- */
@media (max-width:780px){
  .selrow{grid-template-columns:1fr;}
  select{max-width:100%;}
  .hdr-title{width:100%;}
  #hdrIn{gap:8px;}
  .ih-title{font-size:21px;}
  .blk-body,.intro-sec,.intro-hero{padding:14px;}
}
@media (prefers-reduced-motion:reduce){
  #progressBar{transition:none;}
  #progressBar::after{animation:none;display:none;}
  *{transition:none !important;}
}
</style>

  <div id="exMeta" style="margin-top:18px;"></div>
  <section id="exCard"></section>
</main>
<main id="review" class="hidden wrap"></main>
<main id="results" class="hidden wrap"></main>
<div id="toast" class="hidden" role="status"></div>
<script>
'use strict';
/* =====================================================================

var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var PAYLOAD = {"docTitle": "T1547.014 — EXTREMELY HARD practice exam", "sevCls": "sev-extreme", "sevName": "EXTREMELY HARD", "objId": "T1547.014", "objName": "Boot or Logon Autostart Execution: Active Setup", "objShort": "Active Setup", "budgetSec": 3900, "exercises": [{"id": "X-01", "type": "multi", "extype": "Fleet status board (3 of 4 statements)", "scenario": {"summary": "07:20 SOC brief — four hosts, one approved rollout, one silent agent; CISO wants a status line", "prose": "<p>You inherited the DR-4011 follow-up. The board below is what you have at 07:20. Note what is <i>absent<\/i> as carefully as what is present: WS-31's agent stopped checking in. The Contoso Suite 12.3 rollout (change #4471) deployed through SCCM this week.<\/p>", "arts": [{"label": "ARTEFACT 1 — Fleet status board (excerpt)", "kind": "log", "lines": ["RDS-01  21:12 EID 14 Version modified 1,0,0,0 -> 5,0,0,0  key {C7F3A9E1-...}  by CORP\\svc_helpdesk2", "RDS-01  07:0x EID 1 x3 cmd.exe /c powershell -enc SQBFA...  Parent: mobsync.exe /logon  (3 users)", "RDS-01  profile count: 40   C2 beacon from stub session: YES", "FS-02   22:41 EID 13 StubPath set = C:\\ProgramData\\cache\\upd.exe (unsigned)  key {91F4B2E8-...}  creator unknown", "FS-02   HKCU markers for {91F4B2E8-...}: none   next logon wave: 08:00   fileserver (finance)", "WS-77   09:02 EID 12 key create {A9C1D4E2-...}  Image: SCCMClient.exe  manifest change #4471: MATCH  window: in-window", "WS-31   registry feed: none since 09:00 yesterday   installer log (local): 'Contoso Suite installed'   EDR last checkin 08:12", "noise   06:31 Teams auto-update;  06:44 printer driver service PRN-07;  07:01 WSUS sync"]}]}, "prompt": "Select every statement you can already defend to the CISO.", "hint": "One host's silence is itself information — but silence is never proof of benign. Count what each host's lines actually show.", "exp": "<p>Defensible: <b>RDS-01<\/b> shows active version-replay persistence — the Version raise preceded three real executions with a C2 beacon; containment is urgent. <b>FS-02<\/b> is planted (unsigned stub, unknown creator, no user-part markers) and the 08:00 logon wave makes pre-logon action the only clean window. <b>WS-77<\/b> matches an approved SCCM manifest inside its window — benign with evidence, not with luck. <b>WS-31<\/b> cannot be closed: a local installer log is not telemetry, and the registry feed is dark — the honest line is &ldquo;unknown, agent offline, restore visibility first&rdquo;.<\/p>", "study": "Absence of telemetry is not absence of activity. 'Cannot tell' is a finding you report, not a host you close.", "opts": [{"t": "RDS-01 shows active version-replay persistence — containment is urgent", "ok": true, "why": "Version raise, then three real executions with C2 — the full AN0871 correlation is satisfied."}, {"t": "FS-02 is planted and must be handled before the 08:00 logon wave", "ok": true, "why": "Planted, unexecuted, high-value host: acting before first execution is the cheapest outcome."}, {"t": "WS-77 is benign: manifest match and in-window creation", "ok": true, "why": "Creator, manifest and window agree — benign with evidence."}, {"t": "WS-31 can be closed because its local installer log says Contoso Suite", "ok": false, "why": "Wrong: the registry feed is dark and the EDR agent is offline. A local log is a claim, not telemetry."}]}, {"id": "X-02", "type": "qcm", "extype": "Multiple choice (conflicting signals)", "scenario": {"summary": "Two sources disagree — the change record says approved, the manifest says no", "prose": "<p>New component {7D2E9B14-6C05-4A3F-8B21-0E94D3C8F517} on FS-02: StubPath points to an <b>unsigned<\/b> binary in ProgramData; creator is <span class='mono'>CORP\\svc_maint<\/span>. CMDB change record CHG-5512 reads: &ldquo;Q3 software rollout — includes Contoso Suite Active Setup components — approved&rdquo;. The deployment manifest attached to CHG-5512 lists the approved component GUIDs — <b>{7D2E9B14-...} is not among them<\/b>. The platform team is unreachable for 40 minutes; the next logon wave is at 08:00.<\/p>"}, "prompt": "Which signal wins, and what do you do?", "hint": "One source is a human claim about intent; the other is the technical baseline the claim must match. Which one can an attacker forge?", "exp": "<p>The <b>manifest wins<\/b>. A change record is a claim about intent; the manifest is the technical baseline the claim commits to — and an attacker who can write HKLM can certainly draft a convincing change title. Out-of-manifest GUID + unsigned stub + a maintenance service account as creator breaks the benign story on three independent points. The play: escalate as persistence now, and in parallel ask the platform team to confirm that CHG-5512 never covered this GUID. Waiting 40 idle minutes with a logon wave incoming is not caution — it is choosing the attacker's window for them.<\/p>", "study": "When paperwork contradicts the artefacts, the artefacts decide; the paperwork gets verified, not obeyed.", "opts": [{"t": "The manifest wins — escalate as persistence; verify the change in parallel", "ok": true, "why": "Correct: technical baseline beats a textual claim, especially with an unsigned out-of-manifest stub."}, {"t": "The change record wins — close as planned rollout work", "ok": false, "why": "Wrong: the record's own manifest excludes this GUID; closing trusts a claim the evidence refutes."}, {"t": "Conflicting evidence cancels out — monitor for 30 days", "ok": false, "why": "Wrong: the conflict is resolved by the manifest; 'monitor' leaves a planted stub live before 08:00."}, {"t": "Ask end users whether they installed anything", "ok": false, "why": "Wrong: a service-account HKLM write with an unsigned payload is never a user-install question."}]}, {"id": "X-03", "type": "branch", "extype": "Decision tree (4 senior steps)", "scenario": {"summary": "RDS-01, 08:40 — the CISO needs your four decisions before the 09:00 leadership call", "prose": "<p>RDS-01 (80-user Session Host): version-replay confirmed, three users executed the stub, 37 profiles pending. Finance closes quarters on this host on Friday. Every step locks when you continue; the final Check scores all four together.<\/p>"}, "prompt": "Take the four decisions in order; the final Check grades them together.", "hint": "The constraint you may be missing: 37 profiles have NOT executed yet — every decision should be read against that number.", "exp": "<p>Step 1: active and replay-capable — 37 pending profiles mean every future logon is an execution window. Step 2: evidence before mutation — export the key, collect stub command lines and lineage while the host still runs. Step 3: the containment with a real price: block new sessions, stage logoffs across the next hour, remove the entry — accepting roughly an hour of lost RDS productivity instead of 37 silent executions. Monitoring leaves persistence; one reboot changes nothing because the key and per-user state survive it; deleting HKCU markers while the key exists re-arms execution. Step 4: validate — entry gone, value-modification alerts live, next logons clean. That sequence is what survives the leadership call.<\/p>", "study": "Blast radius (pending profiles) is the number that ranks every option in this decision.", "steps": [{"q": "STEP 1 — Classify RDS-01's current state.", "opts": [{"t": "Active, replay-capable persistence; every pending profile is an execution window", "ok": true, "why": "Correct: three executions prove the chain works; 37 pending profiles define the exposure."}, {"t": "Only the three users who executed are affected", "ok": false, "why": "Wrong: the Version raise schedules a run for every profile at its next logon."}, {"t": "Dormant until a new administrator intervenes", "ok": false, "why": "Wrong: the arming is already done — the next logon is the trigger."}]}, {"q": "STEP 2 — Before any mutation, what is the evidence priority?", "opts": [{"t": "Export the key, collect stub command lines and process lineage first", "ok": true, "why": "Correct: after deletion, the configuration that proves scope exists only in your export."}, {"t": "Delete immediately — evidence can wait", "ok": false, "why": "Wrong: deletion destroys the artefacts scoping and legal need."}, {"t": "Reboot to clear memory, then investigate", "ok": false, "why": "Wrong: a reboot destroys volatile evidence and does not touch the persistence."}]}, {"q": "STEP 3 — The CISO wants containment now. Choose with eyes open.", "opts": [{"t": "Block new sessions, stage logoffs over the next hour, remove the entry — accept ~1h RDS downtime", "ok": true, "why": "Correct: the only option that stops the 37 pending executions; the cost is explicit and bounded."}, {"t": "Monitor only tonight — zero downtime", "ok": false, "why": "Wrong: monitoring leaves live persistence running through every logon."}, {"t": "Reboot once at lunchtime", "ok": false, "why": "Wrong: the key and per-user state survive a reboot; the stub re-runs at the next logon."}, {"t": "Delete all HKCU markers to reset state", "ok": false, "why": "Wrong: with the key present, marker deletion re-arms execution for every profile."}]}, {"q": "STEP 4 — Containment done. What does validation look like?", "opts": [{"t": "Verify the entry is gone, keep value-modification alerts live, confirm clean next logons", "ok": true, "why": "Correct: validation closes the loop and catches a re-arm attempt."}, {"t": "Nothing further — deletion is final", "ok": false, "why": "Wrong: the operator who raised the Version can raise it again; that is exactly what validation watches."}, {"t": "Reimage all four hosts immediately", "ok": false, "why": "Wrong: disproportionate, and it destroys the hosts' own evidence mid-case."}, {"t": "Rotate every user's password", "ok": false, "why": "Wrong as a validation step: it addresses credentials, not the persistence channel, and proves nothing."}]}]}, {"id": "X-04", "type": "terminal", "extype": "Terminal command (preserve before mutation)", "scenario": {"summary": "Before anyone touches that key — export the component so the evidence survives scrutiny", "prose": "<p>Legal has flagged DR-4011: anything you do must survive scrutiny, and the configuration written by the attacker must be preserved in a form you can produce later. A colleague suggests &ldquo;just clean it out now&rdquo;. You have an elevated prompt on FS-02, the host is running, and the export destination directory exists. Type the command that writes a registry-format copy of the component key to the evidence folder — before any mutation.<\/p>", "arts": [{"label": "ARTEFACT 1 — Component under inspection (reg query output)", "kind": "log", "lines": ["HKLM\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components\\{C7F3A9E1-4B2D-4E8A-9C11-6F52D0A31B44}", "    StubPath    REG_SZ    cmd.exe /c C:\\ProgramData\\cache\\upd.exe", "    Version     REG_SZ    5,0,0,0", "    (Default)   REG_SZ    OneDrive Sync Helper"]}, {"label": "ARTEFACT 2 — Case note DR-4011", "kind": "log", "lines": ["14:00 platform approved removal window.", "Evidence destination: C:\\Evidence\\DR-4011\\  (exists, writable)"]}]}, "prompt": "Type the command that preserves the component key to the evidence folder.", "hint": "The constraint: what you write must be re-importable as registry state later — a plain text dump is not enough. The verb you need copies a key to a file.", "exp": "<p><span class='mono'>reg export<\/span> writes the key — values, types and all — into a <span class='mono'>.reg<\/span> file you can re-import or hash into the case file. This is the step that must precede every mutation: the near-miss <span class='mono'>reg delete<\/span> (or any file deletion of the evidence folder) destroys the only local copy of the attacker's configuration. The export is cheap, read-only and complete; deleting first is the error that cannot be undone.<\/p>", "study": "Order discipline: export &rarr; hash &rarr; remove. Never the reverse.", "shell": {"caption": "cmd.exe — FS-02 (elevated, simulation)", "banner": "Microsoft Windows [Version 10,0,19045,3803]\n(c) simulation only — no real command runs here", "prompt": "C:\\Windows\\system32>", "elements": [{"label": "Tool: reg export (read-only key-to-file copy)", "re": "^\\s*reg\\s+export\\b", "why": "reg export writes a re-importable .reg copy without touching the live key."}, {"label": "Full component key including the GUID", "re": "installed\\s+components(\\\\|/)\\{?c7f3a9e1-4b2d-4e8a-9c11-6f52d0a31b44\\}?", "why": "The evidence must be the exact component, GUID and all — not the whole tree."}, {"label": "Destination file in the evidence folder (.reg)", "re": "c:\\\\evidence\\\\dr-4011\\\\[a-z0-9_\\-]+\\.reg(\\s|$)", "why": "The output must land in the designated evidence path as a .reg file."}], "danger": [{"re": "reg\\s+(delete|add|copy|restore|save|load|unload)|(^|\\s)(del|erase|rd|rmdir|format)\\s", "label": "mutating or destructive command"}], "dangerNote": "You typed a mutating or destructive command. Before the export, that is evidence destruction: the only local copy of the attacker's configuration would be gone and unrecoverable.", "out": "The operation completed successfully.\nEvidence file: C:\\Evidence\\DR-4011\\as_component.reg (2,148 bytes)", "canonical": "reg export \"HKLM\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components\\{C7F3A9E1-4B2D-4E8A-9C11-6F52D0A31B44}\" C:\\Evidence\\DR-4011\\as_component.reg", "explain": ["<b>reg export<\/b> — copies a key and all its values into a .reg file, read-only for the live key.", "<b>\"HKLM\\...\\{C7F3A9E1-...}\"<\/b> — the exact component under the Active Setup tree, GUID included.", "<b>C:\\Evidence\\DR-4011\\as_component.reg<\/b> — the re-importable evidence artefact for the case file."]}}, {"id": "X-05", "type": "qcm", "extype": "Multiple choice (best practice, wrong context)", "scenario": {"summary": "The rule everyone recommends just buried the real alert — retune it", "prose": "<p>Your estate: SCCM deployments legitimately create several Active Setup components every month; the SIEM rule <b>&ldquo;alert on every new key under Installed Components&rdquo;<\/b> — the advice repeated in every hardening guide — produced 300 tickets last month. Last Tuesday, a Version raise on an existing component executed a stub for 12 users; the rule never fired; the value-modification telemetry exists but nobody watches it.<\/p>"}, "prompt": "Choose the best fix.", "hint": "The best practice is not wrong about intent — it is wrong about this estate's noise floor and blind to the replay lever.", "exp": "<p>The fix: <b>tune to the abuse surface, not the tree's existence<\/b>. Alert on StubPath and Version <i>value modifications<\/i> (the two writes that arm or re-arm execution), on new keys whose StubPath is unsigned or points outside approved paths, and keep the plain new-key feed as an informational inventory instead of a page-worthy alert. Keeping the rule as-is buries the signal under SCCM noise; deleting detection entirely abandons the tree; weekend-only alerting is a joke the attacker will appreciate. Widely repeated advice assumes a quiet estate — yours is not that estate.<\/p>", "study": "Best practices are priors, not conclusions: recalibrate them against your own baseline.", "opts": [{"t": "Tune: alert on value modifications and risky new keys; keep new-key inventory informational", "ok": true, "why": "Correct: it targets the two writes that matter and survives the SCCM noise floor."}, {"t": "Keep the rule as-is — false positives are the price of safety", "ok": false, "why": "Wrong: 300 tickets a month is how the real alert got missed; fatigue is a vulnerability."}, {"t": "Delete the rule — the tree is unmonitorable", "ok": false, "why": "Wrong: the value-modification telemetry is exactly the signal that caught nothing because nobody watched it."}, {"t": "Alert only on weekends when deployments are paused", "ok": false, "why": "Wrong: it leaves the highest-value window unwatched and does not address the replay blind spot."}]}, {"id": "X-06", "type": "match", "extype": "Matching (4 pairs)", "scenario": {"summary": "Evidence table — four artefacts from DR-4011, four honest interpretations", "prose": "<p>The case file has grown. For the leadership call you must state what each artefact <i>establishes<\/i> — no more, no less. Map each artefact to its honest interpretation.<\/p>"}, "prompt": "Match each artefact to its interpretation.", "hint": "Watch the tense: pending, done, claimed, or reacted. Each artefact establishes exactly one of those.", "exp": "<p>A machine Version above the HKCU copies establishes a <b>pending replay<\/b> — execution has not happened yet, the trigger is armed. A userinit &rarr; <span class='mono'>mobsync.exe /logon<\/span> &rarr; cmd lineage with the stub's command line establishes <b>logon-time execution<\/b> — done. A component identical to a SCCM manifest entry is only a <b>benign candidate<\/b> — a claim awaiting change-record and window verification. And an IsInstalled flip right after execution reads as <b>operator cleanup or staging<\/b> — a reaction worth investigating via the flipping account, not housekeeping you ignore.<\/p>", "pairs": [["HKLM Version 5,0,0,0 vs HKCU 1,0,0,0 on three hosts", "Replay pending: the stub re-runs at each profile's next logon", "The comparison is armed but not yet consumed — that is a future execution, not a past one."], ["Lineage: userinit -> mobsync.exe /logon -> cmd.exe with the stub command line", "Logon-time execution through the Active Setup helper chain", "This is the execution proof — unusual lineage post-login is part of AN0871's pattern."], ["Component identical to a SCCM deployment manifest entry", "Benign candidate — verify the change record and window before closing", "Manifest match alone is a claim with good odds, not a verdict."], ["IsInstalled flipped to 0 immediately after execution", "Operator cleanup or staging — investigate the account that flipped it", "Something disabled the component right after it ran; the who and why are the case."]]}, {"id": "X-07", "type": "dnd", "extype": "Drag & drop (6 actions, 2 racks)", "scenario": {"summary": "Triage the action list — what must happen before the next logon window vs what belongs to the investigation phase", "prose": "<p>Your incident board carries six actions and one clock: the next logon wave on the affected hosts is at 08:00. Sort each action by when it must happen. Wrong racks cost credit — think about which actions change state users would notice, and which only read.<\/p>"}, "prompt": "Drag each action to its rack.", "hint": "Containment changes state (deletes, blocks, forces logoffs). Investigation reads and preserves. Nothing in the investigation rack needs to beat the 08:00 clock.", "exp": "<p>Containment rack: remove the planted HKLM entry on FS-02 (stops the 08:00 wave), block new sessions on RDS-01, stage forced logoffs (both clear pending execution windows). Investigation rack: export keys and stub lines, diff HKLM vs HKCU versions estate-wide, capture memory on an executed host — all read-only, all essential, none of them time-critical against logons. Mixing the racks is how teams burn the pre-logon window on tasks that could have happened later.<\/p>", "slots": ["Containment — must happen before the next logon window", "Investigation — after evidence is safe"], "cap": "rack", "bank": [{"t": "Remove the planted HKLM entry on FS-02", "slot": 0, "why": "State-changing containment: without it, every 08:00 logon executes the stub."}, {"t": "Block new sessions on RDS-01", "slot": 0, "why": "Containment: stops the pending-profile count from growing while you work."}, {"t": "Stage forced logoffs on RDS-01", "slot": 0, "why": "Containment: clears the execution window the pending profiles represent."}, {"t": "Export every Active Setup key and stub command line", "slot": 1, "why": "Investigation: preserves evidence; it must precede removal but not the logon clock."}, {"t": "Diff HKLM vs HKCU Version across the estate", "slot": 1, "why": "Investigation: finds other armed hosts; read-only, no user impact."}, {"t": "Capture memory on a host where the stub ran", "slot": 1, "why": "Investigation: volatile evidence for the payload analysis — important, but not a logon-race."}]}, {"id": "X-08", "type": "fill", "extype": "Fill in the blank (3 blanks — AN0871 spec)", "scenario": {"summary": "Write the analytic spec from memory — three blanks decide whether your rule matches ATT&CK's", "prose": "<p>Your detection platform must implement the ATT&amp;CK analytic for this technique. The specification below paraphrases AN0871; complete it. Getting the first blank wrong makes the rule new-key-only — the exact blind spot that cost you last Tuesday.<\/p>"}, "prompt": "Complete the analytic specification — all three blanks.", "hint": "Blank 1: the correlation's first event family — writes, not just creations. Blank 2: how ATT&CK phrases 'weird' StubPath values. Blank 3: the binary property, not the path.", "exp": "<p>AN0871 correlates <b>registry creation/modification<\/b> under the Active Setup tree with anomalous execution at user logon. The risky patterns it names: a <b>non-standard<\/b> StubPath value, execution from <b>uncommon paths<\/b>, and <b>unsigned<\/b> binaries, plus unusual parent-child lineage post-login. The first blank is the one that kills naive implementations: 'creation' alone misses every Version bump and StubPath edit on existing keys.<\/p>", "text": "Analytic AN0871 correlates ____ under the Active Setup tree with anomalous execution of processes at user logon; behavioural patterns include a ____ StubPath value, execution from uncommon paths, and ____ binaries.", "blanks": [{"a": ["registry creation/modification", "registry creation or modification", "registry changes", "registry writes", "registry modification"], "disp": "registry creation/modification", "why": "Both creations and modifications correlate — modifications carry the replay play."}, {"a": ["non-standard", "non standard", "nonstandard", "unusual", "anomalous"], "disp": "non-standard", "why": "AN0871's own wording for StubPath values that do not look like installer-generated ones."}, {"a": ["unsigned", "not signed"], "disp": "unsigned", "why": "Unsigned binaries executing post-login are one of the analytic's named risk signals."}]}, {"id": "X-09", "type": "qcm", "extype": "Multiple choice (escalate)", "scenario": {"summary": "The L1 wants to 'clean it quietly and move on' — you hold the veto", "prose": "<p>Three hosts show the stub executing <span class='mono'>whoami /user<\/span> at logon — a low-noise fingerprint check across the estate. The L1 analyst proposes deleting the keys on all three hosts tonight and logging it as &ldquo;malware removed, closed&rdquo;, to avoid &ldquo;creating noise before the audit&rdquo;.<\/p>"}, "prompt": "What is the correct call?", "hint": "A whoami probe answers a question: 'who am I running as, and where did that land me?' Somebody is still operating.", "exp": "<p><b>Escalate to IR and preserve before remediation.<\/b> A whoami probe at logon is an active operator learning their execution context — the incident is live, not historical. Quiet cleanup destroys the three artefacts that answer the questions leadership will ask: who planted it, what else did the account touch, which hosts share the tooling. 'Avoiding noise before an audit' is the attacker's favourite scheduling preference. Delete — yes, but after export, lineage capture and estate scoping, as an IR decision rather than a queue shortcut.<\/p>", "study": "Discovery behaviour under persistence = active intrusion. Cleanup without evidence is how incidents become unprovable.", "opts": [{"t": "Escalate to IR as a suspected intrusion; preserve evidence before any removal", "ok": true, "why": "Correct: active operator behaviour plus persistence is an IR case, not a queue item."}, {"t": "Delete the keys tonight and close as 'malware removed'", "ok": false, "why": "Wrong: it destroys the evidence chain and hides an active operator from the record."}, {"t": "Wait for the monthly patch window to clean everything at once", "ok": false, "why": "Wrong: it leaves live persistence for weeks while an operator probes the estate."}, {"t": "Email the affected users to 'watch out for anything strange'", "ok": false, "why": "Wrong: users cannot triage persistence; it also tips off whoever reads those inboxes."}]}, {"id": "X-10", "type": "order", "extype": "Risk ranking (5 hosts)", "scenario": {"summary": "The remediation queue — rank five hosts by urgency with one maintenance crew and three hours", "prose": "<p>You have one remediation crew for the next three hours. Rank the hosts so the crew works in the order that minimises executions and business damage. Facts: RDS-01 (80 users, 37 profiles pending, active replay); WS-12 (workstation, stub executed, C2 beacon confirmed, single user travelling); FS-02 (finance fileserver, planted unsigned stub, 08:00 logon wave); WS-31 (suspicious activity, telemetry dark since 09:00); WS-77 (benign SCCM match, in-window).<\/p>"}, "prompt": "Drag the hosts into remediation order (first = work on it now).", "hint": "Weigh two axes: is execution still pending, and how many accounts sit behind the next logon. A host you cannot see is still a host you must plan for.", "exp": "<p>1) <b>RDS-01<\/b>: active replay with 37 pending profiles — the largest execution window still open. 2) <b>WS-12<\/b>: already executed with confirmed C2 — active compromise, but a single account and already isolatable. 3) <b>FS-02<\/b>: planted and unexecuted, finance-critical, with a hard 08:00 deadline — removal before the wave is cheap now and expensive after. 4) <b>WS-31<\/b>: suspicious but invisible — schedule agent restoration and a physical/remote check; you cannot remediate what you cannot see. 5) <b>WS-77<\/b>: benign with evidence — no remediation, just the paperwork. Ranking by 'scariest-looking' instead of 'pending blast radius' is the classic mistake this exercise punishes.<\/p>", "items": ["RDS-01 — active replay, 37 profiles pending", "WS-12 — executed stub, confirmed C2 beacon", "FS-02 — planted, unexecuted, 08:00 logon wave", "WS-31 — suspicious, telemetry dark", "WS-77 — benign SCCM match"], "why": ["Largest pending execution window: 37 profiles will each run the stub at their next logon.", "Active compromise with C2 — but bounded to one account; isolate-and-fix lands second.", "Removal before the 08:00 wave converts a certain execution into a non-event.", "No visibility means no clean remediation — restore telemetry and verify presence first.", "Benign with evidence: no action beyond closing the record."]}, {"id": "X-11", "type": "terminal", "extype": "Terminal command (safe removal)", "scenario": {"summary": "14:00 removal window — the export is hashed, the platform agreed; now remove it properly", "prose": "<p>State check before you type: the export <span class='mono'>C:\\Evidence\\DR-4011\\as_component.reg<\/span> was written and hashed at 13:41; the platform team approved removal at 14:00; no logon is in progress on FS-02. The component to remove is the one you exported. One command, elevated prompt. Note what must <i>not<\/i> appear in your command: the evidence file.<\/p>", "arts": [{"label": "ARTEFACT 1 — Case note DR-4011", "kind": "log", "lines": ["13:41 export written + hashed: C:\\Evidence\\DR-4011\\as_component.reg  sha256 9F2C41E8...", "14:00 removal approved (platform team). Host FS-02. Component {C7F3A9E1-4B2D-4E8A-9C11-6F52D0A31B44}.", "Constraint: the evidence file must remain untouched."]}]}, "prompt": "Type the removal command for the component key.", "hint": "The command must delete the exact component key non-interactively. Anything referencing the .reg file is a mistake you cannot take back.", "exp": "<p><span class='mono'>reg delete<\/span> with the full component path and <span class='mono'>/f<\/span> (force, no interactive prompt) is the removal. The two traps: forgetting <span class='mono'>/f<\/span> leaves the command hanging on a confirmation prompt that non-interactive sessions answer wrong; and any reference to the <span class='mono'>.reg<\/span> file means your fingers are on the evidence — deleting the export after hashing is the classic unrecoverable mistake. Same tool family, opposite goal from the earlier export: that was preserve-before-mutation; this is the mutation, executed on a preserved baseline.<\/p>", "study": "Removal discipline: exported + hashed + approved + no live logon = go.", "shell": {"caption": "cmd.exe — FS-02 (elevated, simulation)", "banner": "Microsoft Windows [Version 10,0,19045,3803]\n(c) simulation only — no real command runs here", "prompt": "C:\\Windows\\system32>", "elements": [{"label": "Tool: reg delete", "re": "^\\s*reg\\s+delete\\b", "why": "The removal verb for a registry key."}, {"label": "Exact component key including the GUID", "re": "installed\\s+components(\\\\|/)\\{?c7f3a9e1-4b2d-4e8a-9c11-6f52d0a31b44\\}?", "why": "Delete only the attacker's component — nothing broader."}, {"label": "Non-interactive force flag (/f)", "re": "(^|\\s)/f(\\s|$)", "why": "/f suppresses the interactive confirm; without it the command stalls."}], "danger": [{"re": "\\.reg\\b|(^|\\s)(del|erase|rd|rmdir|format)\\s", "label": "reference to evidence file or filesystem destruction"}], "dangerNote": "Your command touches the exported .reg evidence file or runs filesystem deletion. The hash you logged would point at nothing — that is the unrecoverable version of this step.", "out": "The operation completed successfully.\nKey deleted: HKLM\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components\\{C7F3A9E1-4B2D-4E8A-9C11-6F52D0A31B44}", "canonical": "reg delete \"HKLM\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components\\{C7F3A9E1-4B2D-4E8A-9C11-6F52D0A31B44}\" /f", "explain": ["<b>reg delete<\/b> — removes the named key and its values (the mutation you earned by exporting first).", "<b>\"HKLM\\...\\{C7F3A9E1-...}\"<\/b> — the attacker's component, precisely scoped.", "<b>/f<\/b> — forces the delete without an interactive confirmation prompt."]}}, {"id": "X-12", "type": "multi", "extype": "Hunt hypothesis (4 of 7)", "scenario": {"summary": "Design the estate hunt — which telemetry families belong in the hypothesis?", "prose": "<p>You are writing the hunt hypothesis for T1547.014 replay abuse across 4,000 endpoints. Seven candidate telemetry families are proposed. Select every family that can actually surface <b>arming or executing<\/b> an Active Setup stub. Network-only or peripheral families do not belong, however fashionable.<\/p>"}, "prompt": "Select the four telemetry families that belong in the hunt.", "hint": "Two families watch the registry writes; one watches the logon lineage; one compares state across hives.", "exp": "<p>In: <b>StubPath value writes<\/b> under the tree (EID 13) — the arming; <b>Version value modifications<\/b> (EID 14) — the replay lever; <b>logon-time lineage<\/b> whose parent is the Active Setup helper (mobsync /logon on current builds) — the executions; and <b>HKLM-vs-HKCU Version diffs<\/b> — hosts where the comparison is currently armed. Out: network signatures (the stub can run and persist with no traffic), USB events, and VPN logs — none of them touch the mechanism, so they cannot prove or disprove the hypothesis.<\/p>", "study": "A hunt hypothesis is falsifiable only over telemetry that touches the mechanism.", "opts": [{"t": "Registry value writes where name = StubPath under the Active Setup tree (EID 13)", "ok": true, "why": "The arming write — the single most direct signal for the mechanism."}, {"t": "Registry value modifications on Version under the tree (EID 14)", "ok": true, "why": "The replay lever: raises on existing keys never appear in new-key-only telemetry."}, {"t": "Logon-time processes whose parent is the Active Setup helper (mobsync /logon lineage)", "ok": true, "why": "Execution evidence: the stub's command line appears in the logon chain."}, {"t": "Hosts where HKLM Version is greater than the HKCU stored copy", "ok": true, "why": "A state diff that names every host with an armed, pending replay."}, {"t": "Network signature matches only", "ok": false, "why": "Out: the stub persists and executes without any network activity."}, {"t": "USB storage device events", "ok": false, "why": "Out: removable media is irrelevant to a registry logon mechanism."}, {"t": "VPN gateway connection logs", "ok": false, "why": "Out: gateway logs show sessions, not logon persistence writes."}]}, {"id": "X-13", "type": "qcm", "extype": "Multiple choice (attribution discipline)", "scenario": {"summary": "PoisonIvy on the stub path — the CTI lead wants a name for the 16:00 briefing", "prose": "<p>The stub's encoded PowerShell downloaded a payload from <span class='mono'>hxxp://203[.]0[.]113[.]7/p.bin<\/span>; the payload is PoisonIvy; the persistence is an Active Setup component. The CTI lead asks: &ldquo;So — Packrat? Can we print the actor name for the 16:00 briefing?&rdquo;<\/p>"}, "prompt": "What goes in the briefing?", "hint": "The ATT&CK page documents PoisonIvy's behaviour, not the operator. Shared malware plus one IP is a start, not a verdict.", "exp": "<p>The defensible line: <b>&ldquo;T1547.014 persistence matching the documented S0012 PoisonIvy behaviour; actor attribution low/medium confidence pending infrastructure and TTP overlap.&rdquo;<\/b> The ATT&amp;CK procedure example proves the <i>behaviour<\/i> — PoisonIvy creating an Active Setup key — not the operator. PoisonIvy is shared malware with a long history (Packrat among others); naming an actor from the RAT alone mistakes the weapon for the hand. Keep hunting: C2 infrastructure overlap, staging patterns and targeting decide the name — not the 16:00 deadline.<\/p>", "study": "Report technique matches at full confidence; report actor names at the confidence the infrastructure supports.", "opts": [{"t": "Report the S0012 behaviour match; keep actor attribution low/medium pending infrastructure overlap", "ok": true, "why": "Correct: technique-level certainty, actor-level honesty — the briefing survives cross-examination."}, {"t": "Print 'Packrat actor confirmed' — the malware and campaign line up", "ok": false, "why": "Wrong: campaign malware overlap is not operator proof; Packrat is context, not a fingerprint."}, {"t": "The malware name is the actor name — done", "ok": false, "why": "Wrong: widely shared RATs break that equation constantly."}, {"t": "Never report any attribution, ever", "ok": false, "why": "Wrong as a rule: attribution with stated confidence is exactly what CTI is for."}]}, {"id": "X-14", "type": "order", "extype": "Senior playbook ordering (6 steps)", "scenario": {"summary": "Fleet-wide replay incident — order the six phases so nothing re-arms while you celebrate", "prose": "<p>Multiple hosts show version-replay arming; two have executions. You run the response. Order the six phases. Two orderings both 'work' on paper; one of them lets the operator re-arm while you hunt, and one destroys memory evidence. Choose the professional one.<\/p>"}, "prompt": "Order the response phases from first to last.", "hint": "The operator raised a Version once already and can raise it again. Which phase order keeps watching that lever while you work?", "exp": "<p>Freeze first: blocking new sessions stops the pending-execution clock without touching evidence. Preserve volatile memory next — the decoded payload and lineage may exist only there. Export every Active Setup key and stub line — the configuration evidence, hashed, before any mutation. Scope the estate: GUID, stub string and C2 across 4,000 endpoints, with the value-modification alert live so a re-arm attempt pages you mid-hunt. Only then remove entries and stage logoffs. Validate last: clean next logons, alerts tuned, re-arm watch ongoing. Hunting before freezing lets executions continue; removing before export deletes what the report needs.<\/p>", "items": ["Freeze: block new sessions on the affected hosts", "Preserve volatile evidence (memory) where the stub executed", "Export all Active Setup keys and stub command lines", "Scope the estate: hunt the GUID, stub string and C2 with re-arm alerts live", "Remove the malicious entries and schedule staged logoffs", "Validate: clean next logons, tuned alerts, standing re-arm watch"], "why": ["Freezing stops the execution clock without mutating a byte of evidence.", "Memory is the most volatile artefact — capture while the host still runs.", "The export freezes the attacker's configuration for scoping and legal.", "Scoping with live alerts means a re-arm attempt surfaces immediately.", "Only now mutate: remove entries and clear pending windows with evidence safe.", "Validation closes the loop — clean logons, tuned detections, watched lever."]}, {"id": "X-15", "type": "triage", "extype": "SOC queue triage (4 items, conflicting notes)", "scenario": {"summary": "Morning queue after last night's remediation — one item came back", "prose": "<p>Last night: RDS-01's component removed, FS-02 export done, WS-77 closed on manifest match. This morning's queue holds four items with notes attached. Some notes were written by people who want to go home. Choose dispositions.<\/p>"}, "prompt": "Set a disposition for each queue item.", "hint": "One item claims a clean story but lacks the telemetry to prove it. One item means the operator answered your remediation.", "exp": "<p>T1: WS-31's clean story rests on a local installer log while its registry feed is dark — <b>reopen and request telemetry<\/b>; you do not close what you cannot see. T2: FS-02's unsigned stub with the 08:00 wave approaching — <b>escalate<\/b>. T3: WS-77's manifest match inside the deployment window — <b>close benign<\/b>, the evidence agrees. T4: RDS-01 was remediated last night and a fresh Version bump appeared at 06:50 — <b>escalate<\/b>: the operator answered your removal; they still hold admin somewhere.<\/p>", "study": "Remediation is a conversation with the operator. Their next write tells you what they still control.", "disps": [{"id": "d0", "label": "Close — benign with evidence"}, {"id": "d1", "label": "Escalate to IR"}, {"id": "d2", "label": "Reopen — request missing telemetry"}, {"id": "d3", "label": "Monitor 24h"}], "alerts": [{"id": "T1", "title": "WS-31 — 'Contoso Suite installed' per local log", "meta": "Registry feed dark since 09:00 yesterday; EDR checkin 08:12; note says 'probably fine, close it'", "ok": "d2", "why": "A local log is a claim, not telemetry. Reopen and restore visibility first."}, {"id": "T2", "title": "FS-02 — unsigned stub in ProgramData", "meta": "Component {91F4B2E8-...} still present; 08:00 logon wave in 20 minutes", "ok": "d1", "why": "Live persistence on a finance host with an execution window opening — escalate now."}, {"id": "T3", "title": "WS-77 — component matches change #4471 manifest", "meta": "SCCM client creator, in-window creation, signed stub", "ok": "d0", "why": "Creator, manifest and window agree — close with the evidence cited."}, {"id": "T4", "title": "RDS-01 — Version bump at 06:50 after last night's removal", "meta": "Entry removed 23:40; new Version raise on a DIFFERENT existing component at 06:50", "ok": "d1", "why": "A re-arm on another key hours after remediation — the operator is still inside. Escalate."}]}, {"id": "X-16", "type": "multi", "extype": "Log hunt (2 of 6 statements)", "scenario": {"summary": "06:30–07:10 estate log — find which hosts are armed for replay this morning", "prose": "<p>Twelve lines from the estate feed. Filter, read, and answer the six statements. Context from the case: RDS-01's attacker component was removed at 23:40; WS-77 closed on manifest match; SCCM deploys through the morning.<\/p>", "arts": [{"label": "ARTEFACT 1 — Estate registry feed (excerpt)", "kind": "log", "lines": ["L1  06:40 EID 14 Version modified 1,0,0,0 -> 6,0,0,0  WS-12  key {E2A7C5D1-...}  Image: powershell.exe", "L2  06:44 EID 5 process terminate TeamsUpdater.exe  WS-31", "L3  06:58 EID 14 Version modified 2,0,0,0 -> 7,0,0,0  FS-02  key {B7E41C93-...}  Image: wscript.exe", "L4  07:01 EID 12 key create {A9C1D4E2-...}  WS-77  Image: SCCMClient.exe (manifest #4471)", "L5  07:03 EID 13 StubPath set = msiexec /Fpums {...} /Qn  WS-201  Image: msiexec.exe", "L6  07:05 EID 1 cmd.exe /c powershell -enc SQBFA...  RDS-01  Parent: mobsync.exe /logon", "L7  07:06 EID 11 file create C:\\Windows\\Temp\\p.pkg  RDS-01", "L8  07:08 printer service install PRN-07", "L9  07:09 EID 3 chrome.exe -> 10[.]44[.]12[.]9:443  WS-77", "L10 07:10 EID 12 key create {91F4B2E8-...}  FS-02  Image: powershell.exe", "L11 06:30 EID 1 Teams.exe start  WS-31", "L12 07:11 WSUS sync completed"]}]}, "prompt": "Select the two true statements.", "hint": "Armed means: a Version raise on a component that still exists, with no removal since. RDS-01 had a removal at 23:40 — read L6 carefully against that.", "exp": "<p><b>WS-12 (L1)<\/b> and <b>FS-02 (L3)<\/b> took Version raises on existing components this morning — both are armed for replay at their next logons. RDS-01's L6 is an execution of a component still present from before 23:40 — but the attacker's arming component was removed, so RDS-01 is not <i>armed<\/i> in the replay sense; it needs its own investigation of that execution. WS-77's L4 is the SCCM manifest write. FS-02's L10 is a new plant, not proof of execution. And the msiexec StubPath write on L5 is installer behaviour.<\/p>", "study": "Armed = existing key + Version above the user copy + no removal. Execution without arming is a different problem with a different clock.", "opts": [{"t": "WS-12 is armed for replay (L1)", "ok": true, "why": "Version raise on an existing component by a scripting host — the replay lever, pulled."}, {"t": "FS-02 is armed for replay (L3)", "ok": true, "why": "A Version raise via wscript on an existing key — armed."}, {"t": "RDS-01 is armed for replay (L6)", "ok": false, "why": "Wrong: L6 shows an execution, but the arming component was removed at 23:40 — investigate, don't mislabel."}, {"t": "WS-77 is armed for replay (L4)", "ok": false, "why": "Wrong: a manifest-matching SCCM key creation, not a Version raise."}, {"t": "FS-02 has already executed its stub (L10)", "ok": false, "why": "Wrong: L10 is a new component creation — planting, not execution."}, {"t": "The msiexec StubPath write on L5 is replay arming", "ok": false, "why": "Wrong: msiexec writing StubPath under a deployment is installer behaviour."}]}], "intro": {"title": "T1547.014 — EXTREMELY HARD practice exam", "learn": "<p>This is the expert tier for <b>T1547.014 &mdash; Boot or Logon Autostart Execution: Active Setup<\/b>, the Windows logon-persistence sub-technique of MITRE ATT&amp;CK. By now the mechanism is familiar: a component under <span class='mono'>HKLM\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components<\/span> carries a <span class='mono'>StubPath<\/span> command that executes once per user at logon, before the desktop, in that user's context; raising the machine-side <b>Version<\/b> above the user's stored copy re-arms it for every existing profile. What changes here is the <b>decision environment<\/b>.<\/p><p>You operate at senior level: fleet-scale telemetry where a legitimate SCCM deployment writes the same registry tree the attacker uses; change records that contradict the deployment manifest; hosts whose telemetry simply stopped; executives who need a containment decision in ten minutes and will not enjoy the answer. ATT&amp;CK's analytic for this technique (AN0871) is a multi-event correlation — registry creation/modification with non-standard StubPath values, followed by execution from uncommon paths, unsigned binaries, or unusual parent-child lineage after login. You will decide when that correlation is satisfied, when it is noise, and when the honest answer is &ldquo;we cannot tell yet — and here is what that costs&rdquo;.<\/p><p>Expect the widely repeated advice to be <i>wrong<\/i> in at least one scenario. Expect one containment choice with a real price tag. Expect at least two moments where the best move is not a tool but a decision: escalate, or refuse to close. The procedure example from the ATT&amp;CK page — PoisonIvy (S0012) creating an Active Setup key pointing at a malicious executable — returns as an attribution exercise where the discipline is knowing exactly how far your evidence reaches.<\/p><p>Nothing here is pattern-matching. Every scenario was built so that at least three options stay defensible in some world; your job is to find the one that survives <i>this<\/i> world.<\/p><p>Senior roles run this play: the <b>IR lead<\/b> sets containment knowing its price; the <b>detection engineer<\/b> defends the analytic against its blind spots; the <b>threat hunter<\/b> proves coverage across both registry views and re-armed versions; the <b>SOC analyst<\/b> and <b>incident responder<\/b> escalate with clean evidence; the <b>CTI analyst<\/b> frames attribution with honest confidence levels; the <b>red teamer<\/b> reports the whole chain so defenders can detect it, not just remove it; and the <b>control owner / GRC analyst<\/b> answers for the golden image that carried the stub to every new user.<\/p>", "themes": [{"name": "Fleet-Scale Detection &amp; Gaps", "items": ["AN0871 multi-event correlation at fleet scale", "Version-replay arming across hosts", "Blind spot: value modifications vs new-key rules", "SCCM deployment baseline noise", "Incomplete telemetry hosts", "Compensating detections (EID 14 on Version)"]}, {"name": "Conflicting Signals &amp; Judgement", "items": ["Change record vs deployment manifest", "Timing anomalies on manifest-matching entries", "Do-not-close decisions on missing telemetry", "Escalation over quiet cleanup", "Re-arming after remediation (attacker reaction)"]}, {"name": "Containment With a Price Tag", "items": ["Staged logoffs /* ---------------- small utilities ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function shuffle(a){
  var r=a.slice();
  for(var i=r.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=r[i]; r[i]=r[j]; r[j]=t;
  }
  return r;
}
function norm(s){ return String(s).replace(/\s+/g,' ').trim().toLowerCase(); }
function el(tag,cls,html){
  var e=document.createElement(tag);
  if(cls) e.className=cls;
  if(html!==undefined) e.innerHTML=html;
  return e;
}
/* Mandatory scoring formula: credit = max(0,(H-W)/N) */
function scoreExercise(H,W,N){ return Math.max(0,(H-W)/N); }
function fmtClock(ms){
  var s=Math.max(0,Math.floor(ms/1000));
  var m=Math.floor(s/60); s=s%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function fmt1(x){ return (Math.round(x*10)/10).toFixed(1); }
/* Motion helper: honour prefers-reduced-motion for JS-driven scrolling too */
function reducedMotion(){
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}
function scrollToTop(){
  try{ window.scrollTo({top:0,behavior:reducedMotion()?'auto':'smooth'}); }
  catch(e){ window.scrollTo(0,0); }
}
function scrollNearest(elm){
  if(!elm) return;
  try{ elm.scrollIntoView({behavior:reducedMotion()?'auto':'smooth',block:'nearest'}); }
  catch(e){ /* older browsers: no-op */ }
}

/* ---------------- timer state machine ----------------
   States: IDLE -> RUNNING <-> PAUSED_MANUAL / PAUSED_AUTO_CHECK -> ENDED
   Check sets PAUSED_AUTO_CHECK BEFORE feedback is rendered.
   Next / Final Submit / Return-to-review resume the clock.        */
var Timer={
  state:'IDLE', remain:0, iv:null, last:0, mark:0,
  manualMs:0, feedbackMs:0, fromAuto:false,
  begin:function(sec){
    this.remain=sec*1000; this.state='RUNNING'; this.last=Date.now();
    this.manualMs=0; this.feedbackMs=0; this.fromAuto=false;
    if(this.iv) clearInterval(this.iv);
    this.iv=setInterval(function(){ Timer.tick(); },250);
    this.render();
  },
  tick:function(){
    var now=Date.now(), dt=now-this.last; this.last=now;
    if(this.state!=='RUNNING') return;
    this.remain-=dt;
    if(this.remain<=0){ this.remain=0; this.render(); this.end(); return; }
    this.render();
  },
  render:function(){
    var c=$('timerChip');
    if(!c) return;
    var t=fmtClock(this.remain);
    var txt='', cls='chipstat';
    if(this.state==='RUNNING'){ txt='<span class="ic">&#9654;</span> RUNNING <span class="mono">'+t+'</span>'; }
    else if(this.state==='PAUSED_MANUAL'){ cls+=' ts-paused'; txt='<span class="ic">&#9208;</span> PAUSED &mdash; manual (press Resume) <span class="mono">'+t+'</span>'; }
    else if(this.state==='PAUSED_AUTO_CHECK'){ cls+=' ts-paused'; txt='<span class="ic">&#9208;</span> PAUSED &mdash; reviewing feedback (resumes on Next) <span class="mono">'+t+'</span>'; }
    else if(this.state==='ENDED'){ cls+=' ts-ended'; txt='<span class="ic">&#9632;</span> ENDED <span class="mono">'+t+'</span>'; }
    else { txt='<span class="ic">&#9679;</span> READY <span class="mono">'+t+'</span>'; }
    c.className=cls; c.innerHTML=txt;
  },
  pauseManual:function(){
    if(this.state!=='RUNNING' && this.state!=='PAUSED_AUTO_CHECK') return;
    this.fromAuto=(this.state==='PAUSED_AUTO_CHECK');
    this.mark=Date.now(); this.state='PAUSED_MANUAL';
    if(this.iv){ clearInterval(this.iv); this.iv=null; }
    this.render();
  },
  resumeManual:function(){
    if(this.state!=='PAUSED_MANUAL') return;
    this.manualMs+=Date.now()-this.mark;
    if(this.fromAuto){ this.fromAuto=false; this.state='PAUSED_AUTO_CHECK'; }
    else{ this.state='RUNNING'; this.last=Date.now(); if(this.iv)clearInterval(this.iv); this.iv=setInterval(function(){ Timer.tick(); },250); }
    this.render();
  },
  pauseAuto:function(){
    if(this.state==='RUNNING'){ this.mark=Date.now(); this.state='PAUSED_AUTO_CHECK'; }
    if(this.iv){ clearInterval(this.iv); this.iv=null; }
    this.render();
  },
  resumeFromAuto:function(){
    if(this.state!=='PAUSED_AUTO_CHECK') return;
    this.feedbackMs+=Date.now()-this.mark;
    this.state='RUNNING'; this.last=Date.now();
    if(this.iv) clearInterval(this.iv);
    this.iv=setInterval(function(){ Timer.tick(); },250);
    this.render();
  },
  end:function(silent){
    if(this.state==='ENDED') return;
    this.state='ENDED';
    if(this.iv){ clearInterval(this.iv); this.iv=null; }
    this.render();
    if(silent!==true && typeof App!=='undefined' && App.finishByTimeout) App.finishByTimeout();
  }
};

/* ---------------- app state ---------------- */
var App={
  order:[], status:{}, credits:{}, hintUsed:{},
  curIdx:-1, visited:0, reported:false, reviewing:false, lockInputs:false,
  attempt:0, answers:{},

  exById:function(i){ return PAYLOAD.exercises[i]; },
  isTerm:function(ex){ return ex && ex.type==='terminal'; },
  buildOrder:function(){
    var n=PAYLOAD.exercises.length, idxs=[], i, tries=0, ord, bad, j;
    for(i=0;i<n;i++) idxs.push(i);
    for(;;){
      ord=shuffle(idxs); tries++; bad=false;
      for(j=1;j<ord.length;j++){
        if(this.isTerm(this.exById(ord[j])) && this.isTerm(this.exById(ord[j-1]))){ bad=true; break; }
      }
      if(!bad || tries>80) break;
    }
    return ord;
  },
  reset:function(){
    this.status={}; this.credits={}; this.hintUsed={}; this.answers={};
    this.curIdx=-1; this.visited=0; this.reported=false; this.reviewing=false; this.lockInputs=false;
    this.finishing=false; this.attempt++;
    this.order=this.buildOrder();
    for(var i=0;i<this.order.length;i++){ this.status[this.order[i]]='pending'; }
  },
  start:function(){
    this.reset();
    $('intro').classList.add('hidden');
    $('hdr').classList.remove('hidden');
    $('progressWrap').classList.remove('hidden');
    $('exam').classList.remove('hidden');
    Timer.begin(PAYLOAD.budgetSec);
    this.showNext();
  },
  nextPending:function(){
    for(var i=0;i<this.order.length;i++){
      if(this.status[this.order[i]]==='pending') return i;
    }
    return -1;
  },
  skippedIdxs:function(){
    var out=[],i;
    for(i=0;i<this.order.length;i++){ if(this.status[this.order[i]]==='skipped') out.push(this.order[i]); }
    return out;
  },
  pendingCount:function(){ return this.nextPending()===-1 ? 0 : 1; },
  answeredCount:function(){
    var c=0;
    for(var k in this.status){ if(this.status[k]==='answered') c++; }
    return c;
  },
  creditSum:function(){
    var s=0;
    for(var k in this.credits){ s+=this.credits[k]; }
    return s;
  },
  anySkipped:function(){ return this.skippedIdxs().length>0; },
  showNext:function(){
    this.reviewing=false;
    var i=this.nextPending();
    if(i<0){
      if(this.anySkipped()) this.showReview();
      else finishExam(false);
      return;
    }
    renderExercise(i);
  },
  progress:function(){
    var n=PAYLOAD.exercises.length;
    $('progressBar').style.width=Math.round(100*this.visited/Math.max(1,n))+'%';
  },
  updateScoreChip:function(){
    var a=this.answeredCount(), s=this.creditSum();
    var pct=a>0?Math.round(100*s/a):0;
    $('scoreChip').innerHTML='<span class="lbl">Score</span> <span class="score-sum mono">'+fmt1(s)+'</span><span class="mono"> / '+a+'</span> <span class="mono">('+pct+'%)</span>';
  }
};

    if(event.data.username){
      var chip=$('whoChip');
      chip.classList.remove('hidden');
      chip.innerHTML='<span class="lbl">Analyst</span> '+esc(event.data.username);
    }
  }catch(e){ /* handshake is optional */ }
});

/* ---------------- score report (STEP 6.2) ---------------- */
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0 ? Math.round((creditSum/answeredCount)*100) : 0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:META.topicId,
      batch:META.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=70
    },location.origin);
  }catch(e){
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}
