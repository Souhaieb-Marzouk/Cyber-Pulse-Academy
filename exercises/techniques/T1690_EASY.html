<script>window.__EXAM_DATA__ = {"meta":{"topicId":"t1690","techId":"T1690","objectLine":"T1690 — Prevent Command History Logging · MITRE ATT&CK Technique (Enterprise) · Tactic: Defense Impairment · Platforms: ESXi, Linux, Network Devices, Windows, macOS · Created 14 April 2026 (ATT&CK v20, version 1.0)","batch":1,"difficulty":"easy","examTitle":"T1690 — EASY practice exam","sevWord":"EASY","estimatedMinutes":25,"timerSec":1500,"passMark":70},"intro":{"learn":["Welcome. In this exam you will learn about MITRE ATT&CK technique T1690 — Prevent Command History Logging. ATT&CK is a big public catalogue that describes what real attackers do, step by step. This object is a Technique: one specific behaviour that an attacker can perform on a computer.","Imagine you work at a help desk. Every command you type in a terminal is saved in a history file, so you can look back at what you did. Attackers hate that. If they run bad commands on a computer they took over, those commands land in the same history file — and you can read them later. So attackers try to stop that history file from being written in the first place. That is exactly what T1690 describes: impairing command history logging before commands are saved.","This is a Defence Impairment behaviour: the attacker weakens a defence (the history record) instead of attacking your data directly. It works on Linux, macOS, Windows PowerShell, ESXi hypervisors and even network devices. On Linux the attacker can empty a variable called HISTFILE; on Windows they can tell the PowerShell PSReadLine module to save nothing; on network devices they can switch logging off.","You will use this knowledge in real work. SOC analysts see it in alerts. Threat hunters search for it. Incident responders check whether history was switched off on a hacked host. Detection engineers write rules for it. Red teamers use it in allowed test engagements to check that defenders would catch it. In this exam you will meet the main commands, the main files, and the first simple defence ideas."],"roles":["SOC analyst (tier 1)","Threat hunter","Incident responder","Detection engineer","Red teamer (training use)","CTI analyst","GRC analyst"],"keywords":[{"theme":"Technique basics","items":["T1690 — Prevent Command History Logging (Enterprise technique)","Defense Impairment — the ATT&CK tactic this technique belongs to","Prevent vs clear — stopping history before it is written, not deleting saved history"]},{"theme":"Linux & macOS mechanics","items":["HISTFILE — the variable that points to the history file","~/.bash_history — the default file where bash flushes commands at logoff","HISTCONTROL — decides which commands bash skips (ignorespace, ignoredups, ignoreboth)","HISTFILESIZE — the maximum number of lines kept in the history file","unset / export — shell commands that change or remove a variable"]},{"theme":"Windows mechanics","items":["PSReadLine — the PowerShell module that records typed commands","ConsoleHost_history.txt — the default PowerShell history file","HistorySaveStyle SaveNothing — the setting that stops history saving"]},{"theme":"Telemetry & first detection ideas","items":["Command execution logs — records of the commands a user or process ran","Absence of history lines — an active session that writes no history is a clue","Space-prefix trick — a command typed with a leading space is skipped when HISTCONTROL=ignorespace"]},{"theme":"First mitigation ideas","items":["M1039 Environment Variable Permissions — stop users from changing HISTFILE-like variables","M1028 Operating System Configuration — keep HISTCONTROL on ignoredups, not ignoreboth"]}],"how":["Pass mark: 70%. PASS means you scored at or above 70% of the credit over the exercises you actually answered. FAIL means you should study the feedback and retake the exam.","You have 16 exercises. The timer gives you 25 minutes. The countdown runs while you work.","Pressing Check stops the timer automatically (⏸ PAUSED — reviewing feedback). The timer starts again only when you press Next. You can study the explanation for as long as you like.","Press Pause for a real break: the timer stops and the exercise is hidden until you press Resume.","Exercises with several correct items give partial credit: right picks add, wrong picks cancel right picks. The formula is max(0, (H − W) / N).","The Hint button gives you one nudge per exercise. A hint costs 10% of that exercise's credit.","Skip moves an exercise to a skipped list without showing the answer. Before you finish, you can go back to skipped exercises while the timer still runs. Skipped-and-never-answered exercises are excluded from the score.","Multi-answer exercises are marked with a checkbox style. If you see radio-style single options, there is exactly one correct answer."]},"exercises":[{"id":"easy-01","type":"qcm","title":"What T1690 is for","scenario":{"summary":"Ticket #2201 — analyst asks what technique T1690 describes","arts":[{"label":"ARTEFACT 1 — ATT&CK excerpt (the MITRE ATT&CK page for T1690)","mono":true,"body":"ID:        T1690\nName:      Prevent Command History Logging\nTactic:    Defense Impairment\nPlatforms: ESXi, Linux, Network Devices, Windows, macOS"}]},"question":"According to the ATT&CK excerpt, what is the attacker trying to achieve with T1690?","hint":"The technique name is the clue: it is about stopping history from being written, not about cleaning it later.","explain":"T1690 stops command history from being saved while the attacker works. The commands may never reach the history file at all. That is different from deleting a history file that already has content in it. The tactic (Defense Impairment) tells you the attacker is weakening a defence — the history record — instead of stealing data directly.","study":"Re-read the 'Technique basics' theme on the intro screen, especially prevent vs clear.","qcm":{"correct":0,"opts":[{"t":"Stop new commands from being saved into the command history at all.","why":"Correct. The whole technique is about impairing history logging so new commands leave no trace there."},{"t":"Encrypt the history file so defenders cannot open it later.","why":"Wrong. T1690 does not encrypt anything — it stops the history from being written or makes it empty."},{"t":"Copy the history file to the attacker's own server.","why":"Wrong. Copying data out is collection behaviour, not this technique."},{"t":"Delete the history entries that the defender saved yesterday.","why":"Wrong. Deleting saved history is a different technique (Clear Command History). T1690 prevents new logging."}]}},{"id":"easy-02","type":"qcm","title":"Which tactic holds T1690","scenario":{"summary":"Matrix walk-through — where does T1690 sit in ATT&CK","arts":[{"label":"ARTEFACT 1 — ATT&CK matrix row","mono":true,"body":"Tactic column:      Defense Impairment\nTechnique in it:    T1690 — Prevent Command History Logging\nNeighbour example:  impair logging services, stop security tooling"}]},"question":"Which ATT&CK tactic does T1690 belong to?","hint":"The tactic name says what the attacker does to defences: it impairs them.","explain":"T1690 sits in the Defense Impairment tactic. This tactic groups behaviours that weaken defences, like switching off logging or stopping protection tools. Initial Access is about getting in, Persistence is about staying in, and Collection is about gathering data — none of those matches hiding commands from history.","study":"Look again at the 'Technique basics' theme — the tactic is listed there.","qcm":{"correct":1,"opts":[{"t":"Initial Access — the attacker's first way into the network.","why":"Wrong. Initial Access covers phishing and exploitation, not hiding commands."},{"t":"Defense Impairment — weakening a defence such as command history logging.","why":"Correct. T1690 impairs the history logging defence, so it lives in Defense Impairment."},{"t":"Collection — gathering data such as files and keystrokes.","why":"Wrong. Collection is about taking data; here the attacker only hides their own actions."},{"t":"Persistence — keeping access after a reboot.","why":"Wrong. Persistence keeps the attacker inside across restarts; it says nothing about history files."}]}},{"id":"easy-03","type":"fill","title":"Read one shell line","scenario":{"summary":"Log line from web server web01 — what does unset do","arts":[{"label":"ARTEFACT 1 — shell session on web01","mono":true,"body":"user@web01:~$ unset HISTFILE\nuser@web01:~$ id\nuid=1000(user) gid=1000(user) groups=1000(user)"}]},"question":"Complete the sentence about what happens after this command.","hint":"unset removes a variable. HISTFILE is the variable that tells the shell where to save history.","explain":"HISTFILE tells bash where to write the command history. Unsetting it removes that pointer, so the shell has nowhere to flush the session's commands when the session ends. The 'id' command still runs normally — only the history record is impaired.","study":"See the 'Linux & macOS mechanics' theme: HISTFILE is the pointer to the history file.","fill":{"text":"After the command 'unset HISTFILE' runs, the commands of this session {{0}} saved into a history file when the session ends, because the shell no longer has a {{1}} to flush them into.","slots":[{"correct":"are not","why":"With no HISTFILE, bash has no history file to flush the commands into."},{"correct":"file","why":"HISTFILE named the file; without it there is nothing to write to."}],"bank":["are not","file","are","server"]}},{"id":"easy-04","type":"terminal","title":"Set the history size to zero","scenario":{"summary":"Training lab — assemble one command on lin-lab-01","arts":[{"label":"ARTEFACT 1 — lab task card","mono":false,"body":"In the training lab on lin-lab-01 you must show how an attacker empties the history file using the size limit.\nThe goal in plain words: set the history file size to zero with one export command."}]},"question":"Type the command that sets the HISTFILESIZE variable to zero.","hint":"Start with the word export, then the variable name from the task, then =0.","explain":"export HISTFILESIZE=0 sets the maximum number of history lines to zero, so the history file stays empty. export is the shell keyword that sets a variable for this and future shells; HISTFILESIZE is the size limit; =0 is the value that means 'keep nothing'.","study":"Check the 'Linux & macOS mechanics' theme for HISTFILESIZE.","terminal":{"prompt":"student@lin-lab-01","banner":["# Training shell — lin-lab-01","# Simulated session for learning T1690 (no real system is touched)"],"solution":"export HISTFILESIZE=0","elements":[{"re":"^\\s*export\\s+","label":"uses the export keyword","why":"export sets the variable for this shell and shells started from it."},{"re":"HISTFILESIZE\\s*=\\s*0","label":"sets HISTFILESIZE to 0","why":"HISTFILESIZE=0 means the history file keeps zero lines."}],"dangerous":[{"re":"rm\\s+-rf\\s+/","label":"recursive delete from root","why":"rm -rf / would destroy the whole filesystem — never acceptable, even in a lab."}],"panel":{"title":"Syntax reminder","lines":[{"t":"export VARIABLE=value","mono":true},{"t":"export — makes a shell variable available to the session","mono":false},{"t":"Example on a different target: export EDITOR=nano","mono":true}]},"sampleOut":["# after the command, a new session would keep 0 history lines"],"output":["HISTFILESIZE is now 0 for new sessions"]}},{"id":"easy-05","type":"drag","title":"Prevent or clear","scenario":{"summary":"Sort four commands — stop logging vs remove saved history","arts":[{"label":"ARTEFACT 1 — trainer note","mono":false,"body":"Two families of behaviour are easy to mix up.\nOne family stops history from being written in the first place (that is T1690).\nThe other family removes or wipes history that is already saved (that is a different technique, Clear Command History)."}]},"question":"Drag each command into the right family.","hint":"Ask for each item: does it act on FUTURE commands (prevent) or on ALREADY SAVED history (clear)?","explain":"unset HISTFILE and export HISTFILESIZE=0 change how future commands are recorded, so they prevent logging (T1690). history -c wipes the in-memory history list and rm ~/.bash_history removes the saved file, so they clear history that already exists. Keeping the two families apart matters because they leave different traces: prevention leaves an odd live session with no new history lines; clearing leaves a suddenly shorter or missing file.","study":"Re-read the prevent-vs-clear item in the 'Technique basics' theme.","drag":{"zones":[{"id":"z-prevent","label":"Prevents future logging (T1690)"},{"id":"z-clear","label":"Removes already-saved history"}],"items":[{"t":"unset HISTFILE","zone":"z-prevent","why":"Removes the pointer to the history file, so new commands are not flushed into it."},{"t":"history -c","zone":"z-clear","why":"Clears the history list that is already held in memory."},{"t":"export HISTFILESIZE=0","zone":"z-prevent","why":"Caps the saved history at zero lines, so nothing new is kept."},{"t":"rm ~/.bash_history","zone":"z-clear","why":"Deletes the history file that already exists on disk."}]}},{"id":"easy-06","type":"fill","title":"How bash history is stored","scenario":{"summary":"Fill the three gaps in the storage explanation","arts":[{"label":"ARTEFACT 1 — study slide","mono":false,"body":"Bash keeps the commands of the current session in memory.\nWhen the session ends, the commands are flushed into a file.\nOne variable points to that file, and another variable decides which commands are skipped."}]},"question":"Place the three missing words into the sentence.","hint":"One variable points to the file, one is the default file path, and one decides what gets skipped.","explain":"HISTFILE points to the history file, ~/.bash_history is the usual default path in the user's home folder, and HISTCONTROL decides which commands are skipped (for example duplicates or commands that start with a space). Together they explain where history goes and why some commands never arrive.","study":"The 'Linux & macOS mechanics' theme lists all three names.","fill":{"text":"When you log out, bash writes the session's commands into the file named by {{0}}, which by default is {{1}} in your home folder. The {{2}} variable decides which commands are skipped before they are saved.","slots":[{"correct":"HISTFILE","why":"HISTFILE is the variable holding the path of the history file."},{"correct":"~/.bash_history","why":"~/.bash_history is the default history file in the home folder."},{"correct":"HISTCONTROL","why":"HISTCONTROL controls which commands bash skips (ignorespace, ignoredups, ignoreboth)."}],"bank":["HISTFILE","~/.bash_history","HISTCONTROL","PSReadLine","ConsoleHost_history.txt"]}},{"id":"easy-07","type":"order","title":"Life of one history line","scenario":{"summary":"Put the four steps of bash history in order","arts":[{"label":"ARTEFACT 1 — whiteboard photo (transcribed)","mono":false,"body":"A trainer drew the journey of a typed command on a whiteboard, but the photos arrived out of order.\nThe four steps are listed in the answer area — put them back in the right order."}]},"question":"Order the steps from first to last.","hint":"First you type, then the shell holds it, then the session ends, then the file gets the line.","explain":"A command first exists only on screen. Bash keeps it in memory for the whole session. Nothing is written to disk yet — this is the moment T1690 attacks, because an attacker who prevents the flush never leaves the file. When you log out, bash flushes the remembered commands into ~/.bash_history. Knowing this order tells you why 'no new history lines during an active session' is such a useful clue.","study":"Think again about when the flush happens: at logoff, not while typing.","order":{"items":[{"t":"You type a command and press Enter.","why":"The command exists on screen and runs — not yet saved anywhere."},{"t":"Bash keeps the command in its in-memory history list.","why":"The session memory is the only place the command exists while you stay logged in."},{"t":"You log out of the session.","why":"The session ends, which triggers the history flush."},{"t":"Bash flushes the remembered commands into ~/.bash_history.","why":"At logoff the in-memory list is appended to the history file."}]}},{"id":"easy-08","type":"match","title":"Windows PowerShell history words","scenario":{"summary":"Match three PowerShell history terms to their meaning","arts":[{"label":"ARTEFACT 1 — flashcards from the Windows module","mono":false,"body":"Windows saves PowerShell history in a different way than Linux.\nA module records every command you type in PowerShell sessions.\nThe records land in one file under your user profile.\nOne module setting can turn the saving off completely."}]},"question":"Match each term on the left with its meaning on the right.","hint":"The module records; the file stores; the setting switches saving off.","explain":"PSReadLine is the PowerShell module that records the commands you type. It writes them into ConsoleHost_history.txt under your user profile (by default in AppData). The HistorySaveStyle option set to SaveNothing tells the module to stop saving future commands — that is the T1690 behaviour on Windows. Note the file keeps history across sessions, so attackers prefer to stop the saving rather than fight the module.","study":"Re-check the 'Windows mechanics' theme on the intro screen.","match":{"pairs":[{"l":"PSReadLine","r":"The PowerShell module that records typed commands","why":"PSReadLine is the module that captures every command you type in PowerShell."},{"l":"ConsoleHost_history.txt","r":"The file where PowerShell history is saved by default","why":"ConsoleHost_history.txt is the default history file under the user profile."},{"l":"HistorySaveStyle SaveNothing","r":"The setting that stops PowerShell saving future history","why":"SaveNothing disables saving of new history lines — the prevent behaviour."}]}},{"id":"easy-09","type":"qcm","title":"The space in front","scenario":{"summary":"Session on database host db02 — one saved, one not","arts":[{"label":"ARTEFACT 1 — shell session on db02","mono":true,"body":"user@db02:~$ export HISTCONTROL=ignorespace\nuser@db02:~$  systemctl status postgresql\nuser@db02:~$ systemctl status mysql"}]},"question":"Look at the two status commands. Which one will bash save into history?","hint":"HISTCONTROL=ignorespace skips commands that start with a space. One line has a leading space.","explain":"With HISTCONTROL=ignorespace, bash skips every command that starts with a space. The first status command was typed with a leading space, so bash drops it. The second one starts directly with 's', so it is saved. Attackers abuse this by typing a space in front of every command they want to hide.","study":"The space-prefix trick is listed under 'Telemetry & first detection ideas'.","qcm":{"correct":3,"opts":[{"t":"Both commands are saved.","why":"Wrong. The ignorespace setting makes bash skip the command with the leading space."},{"t":"Neither command is saved.","why":"Wrong. Only space-prefixed commands are skipped; the normal one is saved."},{"t":"Only the postgresql command with the leading space is saved.","why":"Wrong. That is exactly the command the ignorespace setting drops."},{"t":"Only the mysql command without the leading space is saved.","why":"Correct. Commands starting with a space are skipped; the normal line is kept."}]}},{"id":"easy-10","type":"qcm","title":"Spot the hardening mistake","scenario":{"summary":"Config review — one line weakens visibility","arts":[{"label":"ARTEFACT 1 — proposed baseline for new servers","mono":true,"body":"# /etc/profile.d/history.sh  (proposed baseline)\nexport HISTCONTROL=ignoreboth\n# comment: 'ignoreboth is a safe default for every server'"}]},"question":"Why is the proposed baseline line a mistake for visibility?","hint":"ignoreboth is a bundle: it contains ignorespace — think about what a leading space hides.","explain":"ignoreboth bundles two behaviours: ignoredupe-like duplicate skipping AND ignorespace. With ignorespace active, any user can hide a command just by typing one space first. A safer baseline keeps HISTCONTROL on ignoredups (skip duplicates only), so space-prefixed commands still get saved. This is exactly what mitigation M1028 Operating System Configuration recommends.","study":"Mitigation M1028 says: keep ignoredups instead of ignoreboth.","qcm":{"correct":0,"opts":[{"t":"ignoreboth includes ignorespace, so users can hide commands with one leading space.","why":"Correct. The bundled ignorespace behaviour is the hiding place — M1028 recommends ignoredups instead."},{"t":"The word HISTCONTROL is spelled incorrectly in the file.","why":"Wrong. HISTCONTROL is spelled correctly — the problem is the value, not the name."},{"t":"ignoreboth deletes the history file on every login.","why":"Wrong. ignoreboth never deletes anything; it only skips saving some commands."},{"t":"HISTCONTROL only works on macOS, so Linux ignores the line.","why":"Wrong. HISTCONTROL is a bash setting that works on Linux; the ATT&CK page notes macOS respects it too when set."}]}},{"id":"easy-11","type":"qcm","title":"Where Windows keeps it","scenario":{"summary":"Windows forensics warm-up — default history file","arts":[{"label":"ARTEFACT 1 — investigator checklist","mono":false,"body":"Case 88-C: a Windows laptop may have had PowerShell history tampering.\nFirst question on the checklist: where does PowerShell save command history by default?"}]},"question":"Which file does PowerShell fill with command history by default?","hint":"The file name contains the words ConsoleHost_history.","explain":"PowerShell's PSReadLine module writes history into ConsoleHost_history.txt, by default under AppData\\Roaming\\Microsoft\\Windows\\PowerShell\\PSReadLine in the user profile. The other files belong to other jobs: Windows event logs live in the winevt folder, .bash_history belongs to Linux shells, and known_hosts belongs to SSH.","study":"ConsoleHost_history.txt appears in the 'Windows mechanics' theme.","qcm":{"correct":1,"opts":[{"t":"C:\\Windows\\System32\\winevt\\Logs\\Security.evtx","why":"Wrong. That is a Windows event log file, not the PowerShell history."},{"t":"%APPDATA%\\Microsoft\\Windows\\PowerShell\\PSReadLine\\ConsoleHost_history.txt","why":"Correct. PSReadLine saves history there by default."},{"t":"~/.bash_history","why":"Wrong. That is the Linux bash history file."},{"t":"C:\\Users\\<user>\\.ssh\\known_hosts","why":"Wrong. known_hosts stores SSH host keys, not command history."}]}},{"id":"easy-12","type":"branch","title":"Triage one alert","scenario":{"summary":"SOC alert queue — host web05, service account ran unset HISTFILE","arts":[{"label":"ARTEFACT 1 — SOC alert","mono":true,"body":"ALERT a-55102 · web05 · medium confidence\nprocess: bash\ncmdline: unset HISTFILE\nuser:    svc-deploy (service account)\ntime:    03:14 local"}]},"question":"Work the alert in two simple steps.","hint":"Step 1 asks what the command does. Step 2 asks for the normal, calm next move.","explain":"The command in the alert prevents command history logging — the exact behaviour of T1690. A service account doing this outside a change window is odd, so it deserves a ticket, not silence. The calm next step is to hand the alert to the incident lead with the command line and timestamps as evidence. Reboots can destroy live evidence, and deleting the history file would destroy data.","study":"Think about who normally handles confirmed defence-impairment alerts: the incident response lead.","branch":{"sim":true,"best":"Recognise T1690 behaviour, then report to the incident lead with the command line as evidence.","steps":[{"question":"Step 1 — What is the process in this alert doing?","opts":[{"t":"It stops new commands of this shell from being saved into history.","good":true,"why":"Correct: unset HISTFILE removes the history save target — T1690 behaviour.","outcome":"You classify the alert as command history prevention."},{"t":"It installs a software update for the web server.","good":false,"why":"Wrong: unsetting a variable installs nothing.","outcome":"The alert is misclassified and the attacker keeps working undisturbed."},{"t":"It restarts the web service after a crash.","good":false,"why":"Wrong: variable changes do not restart services.","outcome":"The misclassification delays any response."}]},{"question":"Step 2 — What is the best next simple step?","opts":[{"t":"Open a ticket and tell the incident lead, with the command line and time as evidence.","good":true,"why":"Correct: reporting with evidence is the safe, useful move.","outcome":"The incident lead opens case 88-E and starts the review."},{"t":"Reboot web05 quickly so the attacker loses the session.","good":false,"why":"Wrong: a reboot destroys live evidence and can hide how the access happened.","outcome":"Valuable volatile evidence is gone."},{"t":"Delete the history file so nobody reads wrong data.","good":false,"why":"Wrong: deleting history destroys evidence.","outcome":"The team loses the records it needed."}]}]}},{"id":"easy-13","type":"match","title":"Platform and its history home","scenario":{"summary":"Match each platform to its command history store","arts":[{"label":"ARTEFACT 1 — course board: one row per platform","mono":false,"body":"T1690 works on several platforms, and each platform stores command history in its own place.\nMatch the platform to the store the ATT&CK page names for it."}]},"question":"Match each platform to its history store.","hint":"Think bash for Linux, zsh variables for macOS, the PSReadLine file for Windows PowerShell.","explain":"Linux bash flushes commands into ~/.bash_history. macOS shells use the same HISTFILE variable idea, so the history path is controlled by that variable (zsh uses it too). Windows PowerShell keeps history in ConsoleHost_history.txt via PSReadLine. Knowing the store per platform tells you where absence of lines is suspicious.","study":"The platform stores are listed across the intro keyword themes.","match":{"pairs":[{"l":"Linux bash","r":"~/.bash_history flushed at logoff","why":"On Linux, bash flushes the session commands into ~/.bash_history when you log out."},{"l":"macOS shell (zsh)","r":"History path controlled by the HISTFILE variable","why":"macOS shells track history in the file that HISTFILE points to."},{"l":"Windows PowerShell","r":"ConsoleHost_history.txt via PSReadLine","why":"PowerShell history lives in ConsoleHost_history.txt, written by PSReadLine."}]}},{"id":"easy-14","type":"multi","title":"Pick the two prevent actions","scenario":{"summary":"Quiz card — exactly two options are T1690 behaviour","arts":[{"label":"ARTEFACT 1 — quiz card","mono":false,"body":"The trainer shows four command lines seen in past cases.\nExactly two of them prevent future history logging (T1690).\nThe other two remove data that already exists."}]},"question":"Select the two commands that prevent future history logging.","hint":"Look for commands that change variables for the future, not commands that delete files or logs.","explain":"unset HISTFILE removes the save target for future commands, and export HISTFILESIZE=0 caps the saved history at zero lines — both prevent logging. shred on the history file destroys existing data, and wevtutil cl Security clears a Windows event log — both are cleanup actions of already-saved records, not prevention.","study":"Prevention acts on the future; cleanup acts on the past.","multi":{"opts":[{"t":"unset HISTFILE","correct":true,"why":"Correct: with HISTFILE unset, new commands have no history file to be flushed into."},{"t":"export HISTFILESIZE=0","correct":true,"why":"Correct: a size limit of zero keeps the history file empty from then on."},{"t":"shred -u ~/.bash_history","correct":false,"why":"Wrong: shred destroys the existing history file — that is cleanup, not prevention."},{"t":"wevtutil cl Security","correct":false,"why":"Wrong: this clears a Windows event log — a different, already-saved record."}]}},{"id":"easy-15","type":"fill","title":"Write the SOC note","scenario":{"summary":"Finish a short SOC note about lin-app03","arts":[{"label":"ARTEFACT 1 — draft note (three gaps)","mono":true,"body":"# SOC note — lin-app03 — draft\nAnalyst saw the command __________ in the process command line.\nAfter it ran, the shell wrote __________ new lines into ~/.bash_history.\nThe team must treat an active session with an empty history as __________."}]},"question":"Place the three missing words into the note.","hint":"First gap: the command from the case. Second gap: a short word for zero new lines. Third gap: the opposite of 'normal'.","explain":"The note records the prevention command (unset HISTFILE), the effect (no new lines reach the history file while the session runs), and the judgement (suspicious). An active session that writes no history is the classic T1690 fingerprint and should be raised to the incident lead, not filed as normal.","study":"Absence of expected history writes is the first detection idea for T1690.","fill":{"text":"Analyst saw {{0}} in the process command line. After it ran, the shell wrote {{1}} new lines into ~/.bash_history. The team must treat an active session with an empty history as {{2}}.","slots":[{"correct":"unset HISTFILE","why":"The observed prevention command was unset HISTFILE."},{"correct":"no","why":"With the variable unset, no new lines are written."},{"correct":"suspicious","why":"An active session without history writes is a suspicious T1690 signal."}],"bank":["unset HISTFILE","no","suspicious","yes","normal"]}},{"id":"easy-16","type":"fill","title":"The black hole redirect","scenario":{"summary":"Explain the redirect attackers append to commands","arts":[{"label":"ARTEFACT 1 — command seen in a past case report","mono":true,"body":"/opt/app/run-job.sh > /dev/null 2>&1 &\n\n# question from the case review:\n# which part throws the output away, and which part adds the errors to it?"}]},"question":"Place the two missing pieces into the explanation.","hint":"One piece is the 'black hole' file; the other piece redirects error messages (stream 2) into the same place.","explain":"> /dev/null throws the normal output away, because /dev/null discards everything written to it. 2>&1 sends the error stream (stream 2) to the same place. Attackers use this pattern to run noisy tools quietly; on this ATT&CK page it appears as a way attackers keep output and errors from being seen or logged.","study":"Look for the /dev/null discussion in the technique's real-world examples.","fill":{"text":"The redirect {{0}} sends normal output into the system's discard file, and {{1}} sends error messages into the same place, so the terminal and the logs stay quiet.","slots":[{"correct":"> /dev/null","why":"/dev/null discards everything written to it."},{"correct":"2>&1","why":"2>&1 duplicates the error stream into the same destination as the output."}],"bank":["> /dev/null","2>&1",">> history.log","&& echo ok"]}}]};</script>

  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function shuffled(a) { var x = a.slice(); for (var i = x.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = x[i]; x[i] = x[j]; x[j] = t; } return x; }
  function norm(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().toLowerCase(); }
  function fmtClk(sec) { sec = Math.max(0, sec | 0); var m = (sec / 60) | 0, s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
  function reTest(reStr, s) { try { return new RegExp(reStr, 'i').test(s); } catch (e) { return false; } }
  function scoreSet(sel, cor) {
    var cs = {}; cor.forEach(function (x) { cs[x] = 1; });
    var H = 0, W = 0;
    sel.forEach(function (x) { if (cs[x]) H++; else W++; });
    var N = cor.length; if (!N) return { credit: 0, H: 0, W: 0, N: 0 };
    return { credit: Math.max(0, (H - W) / N), H: H, W: W, N: N };
  }
  var TYPE_LABEL = { qcm: 'Multiple choice', multi: 'Select all that apply', drag: 'Drag & drop', order: 'Timeline ordering', match: 'Matching', fill: 'Fill the blanks', terminal: 'Terminal — type the command', branch: 'Decision scenario', logview: 'Log analysis' };

  /* ---------- syntax highlighter ---------- */
  var TOK_RE = new RegExp([
    '(\\/proc\\/\\d+\\/environ|\\/proc\\/\\$PID|\\/proc\\/[0-9]+|\\/dev\\/null|[\\/~][\\w.\\/-]*bash_history|zsh_history|ConsoleHost_history\\.txt|\\$env:APPDATA[\\w.\\\\-]*)',
    '(Set-PSReadLineOption|Set-PSReadlineOption|Get-PSReadlineOption|Remove-Item|Get-Content|Set-ItemProperty)',
    '(HistorySavePath|HistorySaveStyle|SaveNothing|PSReadLine|PSReadline)',
    '(MYSQL_HISTFILE|HISTFILE|HISTFILESIZE|HISTSIZE|HISTCONTROL|HISTCMD|HISTTIMEFORMAT|HISTIGNORE)',
    '(vmsyslogd|dslogserver|syslogd|auditd|journalctl|ausearch|systemctl|service|resolv)',
    '(no logging|show logging|show run|logging host|logging enable|logging)',
    '(export|unset|printenv|echo|cat|sudo|grep|tr|tail|head|awk|sed|history|env|bash|zsh|kill|ps|enable|configure)',
    '(-{1,2}[A-Za-z][A-Za-z0-9-]*)'
  ].join('|'), 'g');
  function tokClass(m) {
    if (m[1]) return 'tok-path';
    if (m[2] || m[3]) return 'tok-ps';
    if (m[4]) return 'tok-env';
    if (m[5]) return 'tok-svc';
    if (m[6] || m[7]) return 'tok-cmd';
    if (m[8]) return 'tok-flag';
    return null;
  }
  function hlLine(line) {
    var f = document.createDocumentFragment();
    var tr = line.replace(/\s+$/, '');
    if (tr.charAt(0) === '#') { f.appendChild(el('span', 'tok-comment', line)); return f; }
    var last = 0, m;
    TOK_RE.lastIndex = 0;
    while ((m = TOK_RE.exec(line)) !== null) {
      if (m.index > last) f.appendChild(el('span', null, line.slice(last, m.index)));
      f.appendChild(el('span', tokClass(m), m[0]));
      last = m.index + m[0].length;
      if (m[0].length === 0) { TOK_RE.lastIndex++; }
    }
    if (last < line.length) f.appendChild(el('span', null, line.slice(last)));
    return f;
  }
  function monoBlock(lines) {
    var pre = el('pre', 'mono');
    (lines || []).forEach(function (ln) {
      var d = el('div', 'monoline');
      if (ln === '') { d.appendChild(document.createTextNode(' ')); } else { d.appendChild(hlLine(ln)); }
      pre.appendChild(d);
    });
    return pre;
  }
  function artPanel(a) {
    var d = el('div', 'art' + (a.mono ? '' : ' prose'));
    d.appendChild(el('div', 'alabel', a.label));
    if (a.mono) { d.appendChild(monoBlock(String(a.body).split('\n'))); }
    else { String(a.body).split('\n').forEach(function (p) { if (p.trim()) d.appendChild(el('p', null, p)); }); }
    return d;
  }

  /* ---------- state ---------- */
  var S = {
    screen: 'intro', order: [], idx: 0,
    results: {}, checkedIds: {}, hinted: {}, skipped: [],
    sum: 0, answered: 0, locked: false,
    returnTo: null, cur: null, widget: null,
    timer: { state: 'IDLE', left: M.timerSec, tick: null, lastT: 0, resumeBack: null },
    pauseManual: 0, pauseAuto: 0,
    reported: false,
    init: { username: '', country: '', locale: 'en' }
  };
  function byId(id) { for (var i = 0; i < D.exercises.length; i++) { if (D.exercises[i].id === id) return D.exercises[i]; } return null; }
  D.exercises.forEach(function (ex) {
    if (ex.type === 'drag') { ex.drag.items.forEach(function (it, i) { if (!it.id) { it.id = 'i' + i; } }); }
  });

  /* ---------- timer state machine: IDLE | RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED ---------- */
  function tick() {
    var st = S.timer.state;
    if (st === 'IDLE' || st === 'ENDED') return;
    var now = Date.now();
    var dt = Math.round((now - S.timer.lastT) / 1000);
    if (dt <= 0) return;
    S.timer.lastT = now;
    if (st === 'RUNNING') {
      S.timer.left -= dt;
      if (S.timer.left <= 0) { S.timer.left = 0; renderTimerChip(); toState('ENDED'); return; }
    } else if (st === 'PAUSED_MANUAL') { S.pauseManual += dt; }
    else if (st === 'PAUSED_AUTO_CHECK') { S.pauseAuto += dt; }
    renderTimerChip();
  }
  function toState(st) {
    S.timer.state = st;
    renderTimerChip();
    if (st === 'ENDED') { finishExam(true); }
  }
  function startTicker() {
    S.timer.lastT = Date.now();
    if (S.timer.tick) { clearInterval(S.timer.tick); }
    S.timer.tick = setInterval(tick, 500);
  }
  function stopTicker() { if (S.timer.tick) { clearInterval(S.timer.tick); S.timer.tick = null; } }

  /* ---------- header ---------- */
  function renderTimerChip() {
    var st = S.timer.state, ico = '▶', word = 'RUNNING', cls = 'running';
    if (st === 'PAUSED_MANUAL') { ico = '⏸'; word = 'PAUSED — manual (press Resume)'; cls = 'paused'; }
    else if (st === 'PAUSED_AUTO_CHECK') { ico = '⏸'; word = 'PAUSED — reviewing feedback (resumes on Next)'; cls = 'paused'; }
    else if (st === 'ENDED') { ico = '⏹'; word = 'ENDED'; cls = 'ended'; }
    else if (st === 'IDLE') { ico = '⏱'; word = 'READY'; cls = 'running'; }
    var t = $('#hd-timer');
    t.className = 'tstate ' + cls;
    $('#hd-tico').textContent = ico;
    $('#hd-tword').textContent = word;
    $('#hd-tclock').textContent = fmtClk(S.timer.left);
  }
  function renderScoreChip() {
    $('#hd-sum').textContent = (Math.round(S.sum * 10) / 10).toFixed(1);
    $('#hd-cnt').textContent = String(S.answered);
    $('#hd-pct').textContent = (S.answered > 0 ? Math.round((S.sum / S.answered) * 100) : 0) + '%';
  }
  function renderProgress() {
    var done = Object.keys(S.checkedIds).length + S.skipped.length;
    var pct = Math.max(0, Math.min(100, Math.round((done / D.exercises.length) * 100)));
    $('#progressbar').style.width = pct + '%';
  }
  function renderHeader() {
    var countChip = $('#hd-count');
    if (S.screen === 'review') { countChip.innerHTML = ''; countChip.appendChild(el('b', null, 'Review skipped — ' + S.skipped.length + ' left')); }
    else if (S.screen === 'results') { countChip.innerHTML = ''; countChip.appendChild(el('b', null, 'Exam finished')); }
    else { countChip.innerHTML = ''; countChip.appendChild(el('b', null, 'Exercise ' + (S.idx + 1) + ' of ' + D.exercises.length)); }
    var sev = $('#hd-sev');
    sev.textContent = '● ' + M.sevWord;
    sev.setAttribute('aria-label', 'Severity: ' + M.sevWord);
    renderTimerChip(); renderScoreChip();
    var inExam = (S.screen === 'exam');
    $('#bt-pause').disabled = !inExam || S.timer.state === 'ENDED';
    $('#bt-hint').disabled = !inExam || S.locked || !!(S.cur && S.hinted[S.cur.id]);
    $('#bt-skip').disabled = !inExam || S.locked;

  }

  function metaItem(k, val) { var m = el('span', 'meta-item'); m.appendChild(el('b', null, k + ': ')); m.appendChild(document.createTextNode(val)); return m; }

  function startExam() {
    S.order = shuffled(D.exercises.map(function (e) { return e.id; }));
    S.idx = 0; S.results = {}; S.checkedIds = {}; S.hinted = {}; S.skipped = [];
    S.sum = 0; S.answered = 0; S.locked = false; S.returnTo = null; S.reported = false;
    S.pauseManual = 0; S.pauseAuto = 0;
    S.timer.left = M.timerSec; S.timer.resumeBack = null;

  /* ---------- exercise scaffolding ---------- */
  function buildScenario(ex) {
    var b = el('div', 'block block-scen');

    bh.appendChild(el('span', null, '◆ SCENARIO'));

    var tg = el('span', 'gear', '▾ Collapse');
    bh.appendChild(tg);

      tg.textContent = b.classList.contains('collapsed') ? '▸ Expand' : '▾ Collapse';
    });
    b.appendChild(bh);
    var bb = el('div', 'bbody');

    b.appendChild(bb);

  }

  function renderCurrent() {

  function updateBtns() {
    var btCheck = $('#bt-check'), btNext = $('#bt-next');
    if (!btCheck) { return; }
    var ans = S.widget && S.widget.answered && S.widget.answered();
    btCheck.disabled = !ans || S.locked;
    btNext.disabled = !S.locked;
    if (S.idx === S.order.length - 1 && btNext.textContent.indexOf('Final') < 0) { btNext.textContent = 'Final Submit ✓'; }
  }

  /* ---------- widgets ---------- */
  var WIDGETS = {};

  WIDGETS.qcm = function (ex, host) {
    var q = ex.qcm;
    var order = shuffled(q.opts.map(function (o, i) { return i; }));
    var sel = -1, btns = [];
    var wrap = el('div', 'opts');
    order.forEach(function (oi, pos) {
      var o = q.opts[oi];
      var b = el('button', 'opt');
      b.setAttribute('aria-label', 'Option ' + 'ABCDEF'[pos]);
      b.appendChild(el('span', 'olabel', 'ABCDEF'[pos] + '.'));
      b.appendChild(el('span', null, o.t));
      b.addEventListener('click', function () {
        if (S.locked) { return; }
        sel = oi;
        btns.forEach(function (x) { x.classList.remove('selected'); var sm = x.querySelector('.selmark'); if (sm) { sm.remove(); } });
        b.classList.add('selected');
        b.appendChild(el('span', 'selmark', '● Selected'));
        updateBtns();
      });
      btns.push(b); wrap.appendChild(b);
    });
    host.appendChild(wrap);
    return {
      answered: function () { return sel >= 0; },
      grade: function () {
        var ok = sel === q.correct;
        var items = [];
        q.opts.forEach(function (o, i) {
          if (i === sel && ok) { items.push({ label: o.t, st: 'ok', why: o.why }); }
          else if (i === sel && !ok) { items.push({ label: o.t, st: 'bad', why: o.why }); }
          else if (i === q.correct && !ok) { items.push({ label: o.t, st: 'miss', why: o.why }); }
        });
        btns.forEach(function (b, pos) {
          var oi = order[pos]; var sm = b.querySelector('.selmark'); if (sm) { sm.remove(); }
          if (oi === q.correct) { b.appendChild(el('span', 'chk ok', '✓ Correct')); }
          else if (oi === sel) { b.appendChild(el('span', 'chk bad', '✗ Your pick — incorrect')); }
        });
        return { credit: ok ? 1 : 0, items: items, H: ok ? 1 : 0, N: 1, answerText: q.opts[q.correct].t };
      }
    };
  };

  WIDGETS.multi = function (ex, host) {
    var q = ex.multi;
    var order = shuffled(q.opts.map(function (o, i) { return i; }));
    var selMap = {}, btns = [];
    var wrap = el('div', 'opts');
    order.forEach(function (oi, pos) {
      var o = q.opts[oi];
      var b = el('button', 'opt');
      b.setAttribute('role', 'checkbox');
      b.setAttribute('aria-checked', 'false');
      b.appendChild(el('span', 'olabel', 'ABCDEF'[pos] + '.'));
      b.appendChild(el('span', null, o.t));
      b.addEventListener('click', function () {
        if (S.locked) { return; }
        selMap[oi] = !selMap[oi];
        b.classList.toggle('selected', !!selMap[oi]);
        b.setAttribute('aria-checked', selMap[oi] ? 'true' : 'false');
        var sm = b.querySelector('.selmark'); if (sm) { sm.remove(); }
        if (selMap[oi]) { b.appendChild(el('span', 'selmark', '☑ Selected')); }
        updateBtns();
      });
      btns.push(b); wrap.appendChild(b);
    });
    host.appendChild(wrap);
    var corIds = q.opts.map(function (o, i) { return o.correct ? String(i) : null; }).filter(Boolean);
    return {
      answered: function () { return Object.keys(selMap).some(function (k) { return selMap[k]; }); },
      grade: function () {
        var selIds = Object.keys(selMap).filter(function (k) { return selMap[k]; });
        var sc = scoreSet(selIds, corIds);
        var items = [];
        q.opts.forEach(function (o, i) {
          var picked = !!selMap[i];
          if (o.correct && picked) { items.push({ label: o.t, st: 'ok', why: o.why }); }
          else if (!o.correct && picked) { items.push({ label: o.t, st: 'bad', why: o.why }); }
          else if (o.correct && !picked) { items.push({ label: o.t, st: 'miss', why: o.why }); }
        });
        btns.forEach(function (b, pos) {
          var oi = order[pos]; var o = q.opts[oi]; var sm = b.querySelector('.selmark'); if (sm) { sm.remove(); }
          var chk = el('span', 'chk ' + (o.correct ? 'ok' : 'bad'), o.correct ? '✓ Correct item' : '✗ Not part of the answer');
          b.appendChild(chk);
        });
        return { credit: sc.credit, items: items, H: sc.H, W: sc.W, N: sc.N, answerText: corIds.map(function (i) { return q.opts[Number(i)].t; }).join(' · ') };
      }
    };
  };

  WIDGETS.drag = function (ex, host) {
    var d = ex.drag;
    var state = {}, selChip = null, chipEls = {};
    var wrap = el('div', 'ddwrap');
    var bank = el('div', 'zone ddbank');
    bank.appendChild(el('h4', null, 'Item bank — click an item, then click a box'));
    var bankChips = el('div', 'chips'); bank.appendChild(bankChips);
    wrap.appendChild(bank);
    var zw = el('div', 'zones');
    d.zones.forEach(function (z) {
      var zn = el('div', 'zone'); zn.dataset.zone = z.id;
      zn.appendChild(el('h4', null, z.label));
      zn.appendChild(el('div', 'chips'));
      zn.appendChild(el('div', 'zhint', 'Drop items here'));
      zw.appendChild(zn);
    });
    wrap.appendChild(zw);
    host.appendChild(wrap);
    host.appendChild(el('div', 'ddnote', 'Works with mouse drag or click-then-click (touch friendly). Click a placed item to send it back to the bank.'));
    d.items.forEach(function (it) {
      var c = el('button', 'chip', it.t);
      c.draggable = true;
      c.addEventListener('click', function () {
        if (S.locked) { return; }
        if (state[it.id] && state[it.id] !== 'bank') { place(it.id, 'bank'); }
        else { if (selChip) { chipEls[selChip].classList.remove('sel'); } selChip = it.id; c.classList.add('sel'); }
        updateBtns();
      });
      c.addEventListener('dragstart', function (ev) {
        if (S.locked) { ev.preventDefault(); return; }
        selChip = it.id; c.classList.add('sel');
        try { ev.dataTransfer.setData('text/plain', it.id); } catch (e) {}
      });
      c.addEventListener('dragend', function () { c.classList.remove('sel'); });
      chipEls[it.id] = c; bankChips.appendChild(c);
    });
    function place(id, zoneId) {
      var c = chipEls[id];
      state[id] = zoneId;
      if (zoneId === 'bank') { bankChips.appendChild(c); c.classList.remove('placed'); }
      else { var zc = zw.querySelector('.zone[data-zone="' + zoneId + '"] .chips'); if (zc) { zc.appendChild(c); c.classList.add('placed'); } }
      c.classList.remove('sel'); if (selChip === id) { selChip = null; }

  /* ---------- check / next / skip / hint ---------- */
  function onCheck() {
    if (S.locked || S.timer.state === 'ENDED' || S.screen !== 'exam') { return; }
    var w = S.widget;
    if (!w || !w.answered()) { return; }
    var g = w.grade();
    if (!g) { return; }
    if (S.hinted[S.cur.id]) { g.credit = Math.max(0, g.credit - 0.10); }
    g.credit = Math.max(0, Math.min(1, g.credit));
    S.results[S.cur.id] = g;
    S.checkedIds[S.cur.id] = true;
    var si = S.skipped.indexOf(S.cur.id);
    if (si >= 0) { S.skipped.splice(si, 1); }
    S.sum += g.credit; S.answered++;
    S.locked = true;
    toState('PAUSED_AUTO_CHECK');
    renderFeedback(S.cur, g);
    renderHeader(); updateBtns();
    var fb = $('#view-exam .feedback');
    if (fb) { fb.hidden = false; }
  }

    }
    if (ex.study && g.credit < 0.999) {
      var st2 = el('div', 'study');
      st2.appendChild(el('b', null, 'What to study: '));
      st2.appendChild(document.createTextNode(ex.study));
      body.appendChild(st2);
    }
    if (S.hinted[ex.id]) { body.appendChild(el('p', 'fb-credit', 'Hint used: −0.10 credit applied to this exercise.')); }
    fb.appendChild(body);
    fb.hidden = false;
  }

  function onNext() {
    if (!S.locked) { return; }
    var wasReturn = S.returnTo === 'review';
    if (wasReturn) { S.returnTo = null; }
    if (S.idx < S.order.length - 1 && !wasReturn) {
      S.idx++;
      toState('RUNNING');
      renderCurrent();
    } else if (S.skipped.length > 0) {
      toState('RUNNING');
      showReview();
    } else {
      finishExam(false);
    }
  }

  function onSkip() {
    if (S.locked || S.screen !== 'exam') { return; }
    if (S.skipped.indexOf(S.cur.id) < 0) { S.skipped.push(S.cur.id); }
    if (S.returnTo === 'review') { S.returnTo = null; showReview(); return; }
    if (S.idx < S.order.length - 1) {
      S.idx++;
      renderCurrent();
    } else if (S.skipped.length > 0) {
      showReview();
    } else {
      finishExam(false);
    }
  }

  function onHint() {
    if (S.locked || S.screen !== 'exam' || S.hinted[S.cur.id]) { return; }
    S.hinted[S.cur.id] = true;
    var ab = $('#view-exam .block-a .bbody');
    if (ab) {
      var hp = el('div', 'study');
      hp.style.marginTop = '12px';
      hp.appendChild(el('b', null, '💡 Hint (−10% of this exercise credit): '));
      hp.appendChild(document.createTextNode(S.cur.hint || 'Re-read the scenario artefacts — the key detail is there.'));
      ab.appendChild(hp);
    }
    renderHeader();
  }

  /* ---------- review skipped screen ---------- */
  function showReview() {
    S.screen = 'review';
    showView('review');
    var v = $('#view-review'); v.innerHTML = '';
    var c = el('div', 'card');
    c.appendChild(el('h2', null, '⚠ Review skipped exercises'));
    c.appendChild(el('p', 'muted', 'You have ' + S.skipped.length + ' skipped exercise(s). You can go back and answer them now — the timer is still running — or submit the exam. Skipped-and-never-answered exercises are excluded from the score.'));
    S.skipped.forEach(function (id) {
      var ex = byId(id);
      var row = el('div', 'rev-row');
      row.appendChild(el('span', 'warn-ico', '⚠'));
      row.appendChild(el('b', null, 'Skipped'));
      row.appendChild(el('span', 'rt', ex.title));
      var b = el('button', 'btn small primary', 'Answer now');
      b.addEventListener('click', function () { answerFromReview(id); });
      row.appendChild(b);
      c.appendChild(row);
    });
    var sr = el('div', 'start-row');
    var sb = el('button', 'btn primary', 'Submit exam ✓');
    sb.addEventListener('click', function () { finishExam(false); });
    sr.appendChild(sb);
    sr.appendChild(el('span', 'muted', 'Once you submit, unanswered skipped exercises no longer count.'));
    c.appendChild(sr);
    v.appendChild(c);
    renderHeader();
    window.scrollTo(0, 0);
  }
  function answerFromReview(id) {
    S.returnTo = 'review';
    S.idx = S.order.indexOf(id);
    if (S.idx < 0) { S.idx = 0; }
    toState('RUNNING');
    S.screen = 'exam';
    showView('exam');
    renderCurrent();
  }

  /* ---------- results + site contract ---------- */
  function finishExam(timedOut) {
    if (S.screen === 'results') { return; }
    S.screen = 'results';
    S.timer.state = 'ENDED';
    renderTimerChip();
    stopTicker();
    showView('results');
    var v = $('#view-results'); v.innerHTML = '';
    var c = el('div', 'card');
    c.appendChild(el('h2', null, 'Exam results — ' + M.examTitle));
    var answered = S.answered;
    var percent = answered > 0 ? Math.round((S.sum / answered) * 100) : 0;
    var sc = el('p');
    sc.appendChild(el('b', null, (Math.round(S.sum * 10) / 10).toFixed(1) + ' / ' + answered));
    sc.appendChild(document.createTextNode(' answered · ' + percent + '%  (pass mark ' + M.passMark + '%)'));
    c.appendChild(sc);
    if (timedOut) { c.appendChild(el('p', 'muted', '⏹ The timer ended — the exam was submitted automatically. Unanswered and skipped exercises were excluded from the score.')); }
    var fc = 0, pc = 0, ic = 0, pcSum = 0;
    Object.keys(S.results).forEach(function (k) {
      var cr = S.results[k].credit;
      if (cr >= 0.999) { fc++; }
      else if (cr > 0) { pc++; pcSum += cr; }
      else { ic++; }
    });
    var skippedLeft = D.exercises.length - answered;
    var grid = el('div', 'resgrid');
    grid.appendChild(resCard('ok', '✓ Fully correct', fc));
    grid.appendChild(resCard('partial', '✓ Partially correct', pc, pc > 0 ? 'avg ' + (Math.round((pcSum / pc) * 100) / 100).toFixed(2) : null));
    grid.appendChild(resCard('bad', '✗ Fully incorrect', ic));
    grid.appendChild(resCard('skip', '⚠ Skipped — excluded', skippedLeft));
    c.appendChild(grid);
    var tr = el('div', 'times-row');
    tr.appendChild(metaItem('Time used', fmtClk(M.timerSec - S.timer.left)));
    tr.appendChild(metaItem('Paused manually', fmtClk(S.pauseManual)));
    tr.appendChild(metaItem('Paused for feedback', fmtClk(S.pauseAuto)));
    c.appendChild(tr);
    if (answered > 0 && percent >= M.passMark) {
      var pp = el('div', 'passpanel');
      pp.appendChild(el('div', 'big', '✓ PASS'));
      pp.appendChild(el('p', null, 'You reached ' + percent + '% — above the ' + M.passMark + '% pass mark. Well done: you showed command of ' + M.techId + ' at ' + M.sevWord + ' level.'));
      c.appendChild(pp);
    } else {
      var fp = el('div', 'failpanel');
      fp.appendChild(el('div', 'big', '✗ FAIL'));
      fp.appendChild(el('p', null, answered === 0 ? 'No exercise was answered, so the score is 0%. You must retake this exam.' : 'You reached ' + percent + '%, below the ' + M.passMark + '% pass mark. You must retake this exam — read the feedback you collected and try again.'));
      c.appendChild(fp);
    }
    var sr = el('div', 'start-row');
    var rb = el('button', 'btn primary', '↻ Retake exam');
    rb.setAttribute('aria-label', 'Retake the exam with reshuffled exercises');
    rb.addEventListener('click', function () { startExam(); });
    sr.appendChild(rb);
    c.appendChild(sr);
    v.appendChild(c);
    renderHeader();
    reportScore();
    window.scrollTo(0, 0);
  }
  function resCard(cls, lab, num, extra) {
    var d = el('div', 'rescard ' + cls);
    d.appendChild(el('div', 'num', String(num)));
    var l = el('div', 'lab', lab + (extra ? ' — ' + extra : ''));
    d.appendChild(l);
    return d;
  }
  function reportScore() {
    if (S.reported) { return; }
    S.reported = true;
    var percent = S.answered > 0 ? Math.round((S.sum / S.answered) * 100) : 0;
    try {
      if (!window.parent || window.parent === window) { return; } /* opened directly: no parent to report to */
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: M.topicId,
        batch: M.batch,
        score: Math.round(S.sum),
        total: S.answered,
        percent: percent,
        passed: percent >= M.passMark
      }, location.origin);
    } catch (e) { /* opened directly, nothing to report to */ }
  }

  /* ---------- site handshake (dark-only file: theme field is accepted, never acted on) ---------- */
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || (d.type !== 'CYBERPULSE_INIT' && d.type !== 'CYBERMASTERY_INIT')) { return; }
    S.init.username = d.username || '';
    S.init.country = d.country || '';
    S.init.locale = d.locale || 'en';
    if (S.screen === 'intro') { buildIntro(); }
  });

  /* ---------- wire up ---------- */
  document.addEventListener('DOMContentLoaded', function () {
    $('#bt-pause').addEventListener('click', onPause);
    $('#bt-hint').addEventListener('click', onHint);
    $('#bt-skip').addEventListener('click', onSkip);
    $('#pv-resume').addEventListener('click', onPause);
    buildIntro();
  });

  function onPause() {
    if (S.screen !== 'exam' && S.screen !== 'review') { return; }
    if (S.timer.state === 'ENDED') { return; }
    if (S.timer.state === 'PAUSED_MANUAL') {
      S.timer.state = S.timer.resumeBack || 'RUNNING';
      S.timer.resumeBack = null;
      $('#pauseveil').classList.remove('on');
      renderTimerChip();
      return;
    }
    S.timer.resumeBack = S.timer.state;
    S.timer.state = 'PAUSED_MANUAL';
    $('#pv-title').textContent = 'PAUSED — manual (press Resume)';
    $('#pv-text').textContent = S.timer.resumeBack === 'PAUSED_AUTO_CHECK'
      ? 'You paused while reviewing feedback. Resume to return to the explanation — the timer stays stopped until you press Next.'
      : 'The timer is stopped and the exercise is hidden. Take a real break — the exam waits for you.';
    $('#pauseveil').classList.add('on');
    renderTimerChip();
  }
})();

</script>
</body>
</html>
