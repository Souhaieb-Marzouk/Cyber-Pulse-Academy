<style>
:root{

  --accent-amber:#ffb454;
  --accent-green:#57d38c;

  --state-partial:#ffb454;
  --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0;
  --state-paused:#9d7bff;
  --sev-easy:#57d38c;
  --sev-medium:#ffb454;
  --sev-hard:#ff8a3d;
  --sev-extreme:#ff6b6b;
  --sev-easy-bg:rgba(87,211,140,.13);
  --sev-medium-bg:rgba(255,180,84,.13);
  --sev-hard-bg:rgba(255,138,61,.13);
  --sev-extreme-bg:rgba(255,107,107,.13);
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"Cascadia Code",Consolas,"SF Mono",Menlo,"Liberation Mono","Courier New",monospace;
  /* derived surface + tint tokens (all colour literals live here, once) */
  --btn-bg:#182238;
  --btn-bg-hover:#1c2a48;
  --accent-blue-strong:#7abcff;
  --accent-green-strong:#7ce3ab;
  --on-primary:#06121f;
  --on-green:#05130b;
  --opt-bg-hover:#132038;
  --input-bg:#0b1322;
  --term-bg:#070d1a;
  --hdr-bg:rgba(13,19,36,.97);
  --progress-track:#0d1428;
  --kw-blue:#7fd0ff;
  --tint-green:rgba(87,211,140,.08);
  --tint-green-2:rgba(87,211,140,.09);
  --tint-green-3:rgba(87,211,140,.1);
  --tint-amber:rgba(255,180,84,.08);
  --tint-amber-2:rgba(255,180,84,.06);
  --tint-amber-border:rgba(255,180,84,.45);
  --tint-red:rgba(255,107,107,.1);
  --tint-blue:rgba(90,169,255,.05);
  --tint-overlay:rgba(7,10,22,.88);
  --sheen:rgba(255,255,255,.35);
  --tint-overlay:rgba(7,10,22,.88);
  --sheen:rgba(255,255,255,.35);
  --tint-overlay:rgba(7,10,22,.88);
  --sheen:rgba(255,255,255,.35);
  --shadow-a:0 8px 22px rgba(0,0,0,.28);
  --shadow-b:0 6px 18px rgba(0,0,0,.35);
  --shadow-c:0 6px 16px rgba(0,0,0,.25);
  --shadow-d:0 10px 26px rgba(0,0,0,.4);
}
html,body{margin:0;padding:0;}
html{color-scheme:dark;}
body{
  background:var(--bg-page);
  color:var(--text-primary);
  font-family:var(--font-ui);
  font-size:16px;
  line-height:1.55;
  min-height:100vh;
}
body.sev-easy{--sev:var(--sev-easy);--sev-bg:var(--sev-easy-bg);}
body.sev-medium{--sev:var(--sev-medium);--sev-bg:var(--sev-medium-bg);}
body.sev-hard{--sev:var(--sev-hard);--sev-bg:var(--sev-hard-bg);}
body.sev-extreme{--sev:var(--sev-extreme);--sev-bg:var(--sev-extreme-bg);}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 60px;}
.hidden{display:none !important;}
button{font-family:var(--font-ui);}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px;}
.ic{font-style:normal;font-weight:700;}

/* ---------- sticky exam header ---------- */
#hdr{
  position:sticky;top:0;z-index:40;
  background:var(--hdr-bg);
  border-bottom:1px solid var(--border);
  box-shadow:var(--shadow-b);
}
#hdrIn{
  max-width:1000px;margin:0 auto;padding:10px 16px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
}
.hdr-title{font-weight:700;font-size:15px;color:var(--text-primary);margin-right:4px;}
.hdr-title .mono{font-family:var(--font-mono);}
.sev-badge{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--sev);color:var(--sev);background:var(--sev-bg);
  border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800;letter-spacing:.07em;
  min-height:30px;
}
.sev-badge .dot{width:9px;height:9px;border-radius:50%;background:var(--sev);}
.chipstat{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--border);border-radius:999px;
  background:var(--bg-surface);padding:6px 12px;font-size:13.5px;color:var(--text-primary);
  min-height:34px;
}
.chipstat .lbl{color:var(--text-secondary);}
.chipstat .mono{font-family:var(--font-mono);font-weight:700;}
.chipstat.ts-run{color:var(--text-primary);}
.chipstat.ts-paused{color:var(--state-paused);border-color:var(--state-paused);}
.chipstat.ts-ended{color:var(--state-incorrect);border-color:var(--state-incorrect);}
.score-sum{font-weight:800;}
.hdr-spacer{flex:1;}
.btn{
  min-height:44px;padding:9px 18px;border-radius:6px;cursor:pointer;
  border:1px solid var(--border);background:var(--btn-bg);color:var(--text-primary);
  font-weight:600;font-size:14.5px;transition:background .15s,border-color .15s;
}
.btn:hover{border-color:var(--accent-blue);background:var(--btn-bg-hover);}
.btn.primary{background:var(--accent-blue);border-color:var(--accent-blue);color:var(--on-primary);font-weight:800;}
.btn.primary:hover{background:var(--accent-blue-strong);}
.btn.green{background:var(--accent-green);border-color:var(--accent-green);color:var(--on-green);font-weight:800;}
.btn.green:hover{background:var(--accent-green-strong);}
.btn.ghost{background:transparent;}
.btn.danger{background:transparent;border-color:var(--state-incorrect);color:var(--state-incorrect);}
.btn.danger:hover{background:var(--tint-red);}
.btn.small{min-height:44px;padding:6px 13px;font-size:13.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn .ic{margin-right:4px;}

/* ---------- progress bar ---------- */
#progressWrap{position:sticky;top:57px;z-index:39;height:6px;background:var(--progress-track);border-bottom:1px solid var(--border);}
#progressBar{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--sev),var(--accent-blue));
  border-radius:0 3px 3px 0;position:relative;overflow:hidden;
  transition:width .4s ease;
}
#progressBar::after{
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,var(--sheen),transparent);
  animation:sheen 2.8s linear infinite;
}
@keyframes sheen{to{left:110%;}}

/* ---------- cards / blocks ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-a);}
.blk{background:var(--bg-surface);border:1px solid var(--border);border-left:4px solid var(--accent-blue);border-radius:8px;margin:16px 0;box-shadow:var(--shadow-c);}
.blk.b-q{border-left-color:var(--accent-amber);}
.blk.b-ans{border-left-color:var(--accent-green);}
.blk-head{
  display:flex;align-items:center;gap:9px;padding:10px 14px;
  border-bottom:1px solid var(--border);font-weight:800;font-size:13.5px;letter-spacing:.09em;
}
.b-scen>.blk-head{color:var(--accent-blue);}
.b-q>.blk-head{color:var(--accent-amber);}
.b-ans>.blk-head{color:var(--accent-green);}
.blk-head .ic{font-size:15px;}
.blk-body{padding:14px 16px;}
.ex-meta{color:var(--text-secondary);font-size:13.5px;margin:12px 2px 0;}
.ex-type{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
  border-radius:999px;padding:3px 11px;font-size:12px;color:var(--text-secondary);
  background:var(--bg-surface);letter-spacing:.05em;
}

/* ---------- scenario / artefacts ---------- */
.sc-toggle{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:transparent;border:none;color:var(--text-secondary);
  padding:10px 14px;cursor:pointer;font-size:13.5px;min-height:44px;
}
.sc-toggle:hover{color:var(--text-primary);}
.sc-toggle .sum{flex:1;}
.sc-toggle .state-word{font-size:12px;letter-spacing:.06em;border:1px solid var(--border);border-radius:999px;padding:2px 10px;color:var(--text-secondary);}
.sc-panels{padding:2px 14px 14px;}
.art{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;margin:10px 0;overflow:hidden;}
.art-label{
  font-family:var(--font-mono);font-size:12px;color:var(--accent-blue);
  padding:8px 12px 2px;letter-spacing:.07em;font-weight:700;
}
.art-body{padding:8px 12px 12px;font-size:15px;}
.art-body p{margin:6px 0;}
.prose p{margin:8px 0;}
.mono{font-family:var(--font-mono);}
code.inline{
  font-family:var(--font-mono);font-size:14px;color:var(--text-mono);
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;
}

/* ---------- log viewer ---------- */
.log-tools{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px dashed var(--border);}
.log-filter{
  flex:1;max-width:340px;min-height:44px;background:var(--input-bg);border:1px solid var(--border);
  color:var(--text-mono);font-family:var(--font-mono);font-size:13.5px;border-radius:4px;padding:6px 10px;
}
.log-count{font-size:12.5px;color:var(--text-secondary);font-family:var(--font-mono);}
.log{font-family:var(--font-mono);font-size:13.8px;line-height:1.6;padding:10px 12px;overflow-x:auto;white-space:pre;color:var(--text-mono);}
.logline{display:block;}
.logline.off{display:none;}
.lg-t{color:var(--text-secondary);}
.lg-ev{color:var(--accent-blue);font-weight:700;}
.lg-val{color:var(--accent-amber);}
.lg-str{color:var(--accent-green);}
.lg-kw{color:var(--kw-blue);font-weight:700;}
.lg-warn{color:var(--state-incorrect);font-weight:700;}
.lg-dim{color:var(--text-secondary);}

/* ---------- answer widgets ---------- */
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;
  padding:12px 14px;margin:9px 0;min-height:44px;color:var(--text-primary);
  cursor:pointer;font-size:15.5px;line-height:1.5;transition:border-color .15s,background .15s;
}
.opt:hover{border-color:var(--accent-blue);background:var(--opt-bg-hover);}
.opt .opx{color:var(--text-secondary);font-weight:800;flex:0 0 auto;}
.opt.sel{
  border-color:var(--accent-green);box-shadow:inset 4px 0 0 var(--accent-green);
  background:var(--tint-green);
}
.opt.sel .selmark{margin-left:auto;color:var(--accent-green);font-weight:700;font-size:13px;white-space:nowrap;}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;min-height:52px;}
.chip{
  display:inline-flex;align-items:center;gap:8px;min-height:44px;
  background:var(--bg-surface-2);border:1px dashed var(--border);border-radius:6px;
  padding:8px 14px;color:var(--text-primary);font-size:14.5px;cursor:grab;user-select:none;
}
.chip.sel{border-color:var(--accent-amber);box-shadow:0 0 0 1px var(--accent-amber);}
.chip.dragging{opacity:.45;}
.chip .rm{border:none;background:transparent;color:var(--state-incorrect);cursor:pointer;font-size:15px;padding:2px 4px;min-height:44px;min-width:44px;}
.slots{display:grid;gap:12px;margin-top:6px;}
.slot{
  border:1px dashed var(--border);border-radius:8px;background:var(--tint-blue);
  padding:10px 12px;min-height:60px;transition:border-color .15s,background .15s;
}
.slot.over{border-color:var(--accent-green);background:var(--tint-green-2);border-style:solid;}
.slot-label{font-family:var(--font-mono);font-size:12.5px;color:var(--accent-blue);letter-spacing:.06em;font-weight:700;margin-bottom:6px;display:flex;gap:8px;align-items:center;}
.slot-label .cap{color:var(--text-secondary);font-weight:400;}
.slot .bank{margin:4px 0 0;}
.selrow{
  display:grid;grid-template-columns:1fr minmax(220px,340px);gap:12px;align-items:center;
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;
  padding:10px 12px;margin:9px 0;
}
.selrow .left{font-size:15px;}
.selrow .left .sub{display:block;color:var(--text-secondary);font-size:13px;margin-top:2px;}
select,input[type=text].fillin{
  min-height:44px;background:var(--input-bg);border:1px solid var(--border);color:var(--text-primary);
  border-radius:4px;padding:8px 10px;font-size:14.5px;font-family:var(--font-ui);width:100%;
}
select:focus,input[type=text]:focus{border-color:var(--accent-blue);}
input[type=text].fillin{font-family:var(--font-mono);}
.fill-sent{font-size:16px;line-height:2;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:12px 14px;}
.fill-sent input{width:200px;margin:0 4px;display:inline-block;}
.ord-list{margin:6px 0;}
.ord-item{
  display:flex;gap:10px;align-items:center;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:9px 0;
  min-height:48px;cursor:grab;font-size:15px;
}
.ord-item.dragging{opacity:.4;}
.ord-item.over{border-color:var(--accent-green);border-style:solid;}
.ord-handle{color:var(--text-secondary);font-size:15px;letter-spacing:2px;}
.ord-btns{display:flex;gap:6px;margin-left:auto;}
.ord-btns .btn{min-height:44px;min-width:44px;padding:4px 10px;font-size:14px;}
.step-tag{
  display:inline-flex;gap:6px;align-items:center;border:1px solid var(--accent-amber);
  color:var(--accent-amber);border-radius:999px;font-size:12px;font-weight:800;
  padding:2px 10px;letter-spacing:.07em;margin:4px 0 8px;
}
.branch-step{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:12px 0;background:var(--bg-surface-2);}
.branch-step.done{opacity:.92;border-style:dashed;}
.branch-step .bq{font-weight:700;margin-bottom:8px;}
.alert-card{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:10px 0;}
.alert-card .a-title{display:flex;gap:10px;align-items:center;font-weight:700;}
.alert-card .a-id{font-family:var(--font-mono);color:var(--accent-blue);font-size:13px;}
.alert-card .a-meta{color:var(--text-secondary);font-size:13.5px;margin:6px 0;}
.prio-wrap{display:flex;flex-direction:column;gap:0;}
.rank-badge{
  flex:0 0 30px;height:30px;border-radius:50%;border:1px solid var(--sev);color:var(--sev);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--font-mono);font-size:14px;
}

/* ---------- terminal ---------- */
.term{background:var(--term-bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:10px 0;}
.term-head{
  display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--input-bg);
  border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:12.5px;color:var(--text-secondary);
}
.term-dot{width:10px;height:10px;border-radius:50%;background:var(--border);}
.term-dot.g{background:var(--accent-green);}
.term-scroll{max-height:230px;overflow-y:auto;padding:10px 12px;font-family:var(--font-mono);font-size:14px;color:var(--text-mono);white-space:pre-wrap;word-break:break-word;}
.term-line .p{color:var(--accent-green);font-weight:700;}
.term-line.err{color:var(--state-incorrect);}
.term-line.ok{color:var(--accent-green);}
.term-in{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--border);align-items:center;}
.term-in .p{font-family:var(--font-mono);color:var(--accent-green);font-weight:700;font-size:14px;white-space:nowrap;}
.term-in input{
  flex:1;min-height:44px;background:var(--input-bg);border:1px solid var(--border);color:var(--text-mono);
  font-family:var(--font-mono);font-size:14px;border-radius:4px;padding:8px 10px;
}
.syntax-panel{
  background:var(--bg-surface-2);border:1px solid var(--border);border-left:4px solid var(--accent-blue);
  border-radius:6px;padding:10px 14px;margin:10px 0;font-size:14px;
}
.syntax-panel .sp-title{font-family:var(--font-mono);font-size:12px;color:var(--accent-blue);font-weight:700;letter-spacing:.07em;margin-bottom:6px;}
.syntax-panel code{font-family:var(--font-mono);color:var(--text-mono);font-size:13.5px;display:block;margin:3px 0;}
.syntax-panel .cm{color:var(--text-secondary);}
.codeblock{position:relative;background:var(--term-bg);border:1px solid var(--border);border-radius:6px;margin:10px 0;}
.codeblock code{display:block;font-family:var(--font-mono);font-size:14px;color:var(--text-mono);padding:12px 14px;white-space:pre-wrap;word-break:break-word;}
.codeblock .copy{
  position:absolute;top:6px;right:6px;min-height:44px;min-width:44px;padding:2px 12px;font-size:12px;
  background:var(--bg-surface);border:1px solid var(--border);border-radius:4px;color:var(--text-secondary);cursor:pointer;
}
.codeblock .copy:hover{color:var(--text-primary);border-color:var(--accent-blue);}

/* ---------- hint / feedback ---------- */
.hint-panel{
  border:1px solid var(--tint-amber-border);background:var(--tint-amber);
  border-radius:6px;padding:10px 14px;margin:12px 0;color:var(--text-primary);font-size:15px;
}
.hint-panel .hp-head{color:var(--accent-amber);font-weight:800;font-size:13px;letter-spacing:.07em;display:flex;gap:7px;align-items:center;margin-bottom:4px;}
.fb{border:1px solid var(--border);border-left:5px solid var(--state-correct);border-radius:8px;background:var(--bg-surface);margin:16px 0 0;box-shadow:var(--shadow-c);}
.fb.correct{border-left-color:var(--state-correct);}
.fb.partial{border-left-color:var(--state-partial);}
.fb.incorrect{border-left-color:var(--state-incorrect);}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:800;letter-spacing:.06em;font-size:15px;flex-wrap:wrap;}
.fb.correct .fb-head{color:var(--state-correct);}
.fb.partial .fb-head{color:var(--state-partial);}
.fb.incorrect .fb-head{color:var(--state-incorrect);}
.fb-credit{
  font-family:var(--font-mono);font-size:12.5px;border:1px solid var(--border);
  border-radius:999px;padding:2px 10px;color:var(--text-secondary);font-weight:400;letter-spacing:0;
}
.fb-body{padding:4px 16px 16px;color:var(--text-primary);font-size:15px;}
.fb-body h4{margin:12px 0 6px;font-size:14px;color:var(--text-secondary);letter-spacing:.05em;font-weight:700;}
.itemrow{
  display:flex;gap:10px;align-items:flex-start;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:6px;padding:9px 12px;margin:7px 0;font-size:14.5px;
}
.itemrow .ic{flex:0 0 auto;margin-top:1px;}
.ic-ok{color:var(--state-correct);}
.ic-bad{color:var(--state-incorrect);}
.ic-miss{color:var(--state-skipped);}
.ic-part{color:var(--state-partial);}
.ic-pause{color:var(--state-paused);}
.study{border:1px dashed var(--accent-amber);border-radius:6px;background:var(--tint-amber-2);padding:10px 12px;margin-top:10px;font-size:14.5px;}
.study b{color:var(--accent-amber);}
.actionbar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center;}

/* ---------- pause overlay ---------- */
#pauseOverlay{
  position:fixed;inset:0;z-index:60;background:var(--tint-overlay);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.pauseBox{max-width:460px;width:100%;padding:26px;text-align:center;}
body.paused-blur #exam,body.paused-blur #review{filter:blur(16px);}
body.paused-blur #hdr{filter:blur(4px);}
.pauseBox .big{font-size:40px;color:var(--state-paused);}
.pauseBox h2{margin:8px 0 6px;color:var(--state-paused);letter-spacing:.06em;}
.pauseBox p{color:var(--text-secondary);}

/* ---------- intro screen ---------- */
.intro-hero{padding:22px 24px;margin-top:24px;}
.ih-title{font-size:26px;font-weight:800;margin:0 0 4px;letter-spacing:.01em;}
.ih-obj{color:var(--text-secondary);font-size:15px;margin:0 0 14px;}
.ih-obj .mono{color:var(--accent-blue);}
.facts{display:flex;flex-wrap:wrap;gap:10px;}
.fact{
  border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);
  padding:10px 14px;min-width:130px;
}
.fact .fl{font-size:12px;color:var(--text-secondary);letter-spacing:.07em;font-weight:700;}
.fact .fv{font-size:16.5px;font-weight:800;margin-top:3px;}
.fact .fv .mono{font-size:15.5px;}
.intro-sec{margin-top:18px;padding:20px 24px;}
.sec-h{
  display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;
  color:var(--text-primary);margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--border);
}
.sec-h .ic{color:var(--accent-blue);}
.prose{font-size:15.5px;color:var(--text-primary);}
.prose p{margin:10px 0;}
.kw-theme{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 16px;margin:12px 0;}
.kw-theme h4{margin:0 0 8px;font-size:14px;color:var(--accent-blue);letter-spacing:.06em;display:flex;gap:8px;align-items:center;}
.kw-list{display:flex;flex-wrap:wrap;gap:8px;}
.kw{
  border:1px solid var(--border);border-radius:999px;background:var(--bg-surface);
  color:var(--text-primary);font-size:13.5px;padding:4px 12px;
}
.how-list{margin:8px 0 0;padding:0 0 0 2px;list-style:none;}
.how-list li{
  display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--border);
  font-size:15px;
}
.how-list li:last-child{border-bottom:none;}
.how-list .ic{flex:0 0 auto;margin-top:1px;}
.startrow{margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.startrow .note{color:var(--text-secondary);font-size:13.5px;}

/* ---------- review screen ---------- */
.rev-item{
  display:flex;gap:12px;align-items:center;justify-content:space-between;
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;
  padding:12px 16px;margin:10px 0;flex-wrap:wrap;
}
.rev-item .r-l{display:flex;gap:10px;align-items:center;font-size:15px;}
.rev-item .sk{
  color:var(--state-skipped);font-weight:700;font-size:13px;border:1px solid var(--border);
  border-radius:999px;padding:2px 10px;display:inline-flex;gap:6px;align-items:center;
}

/* ---------- results ---------- */
.res-hero{padding:24px;margin-top:24px;text-align:left;}
.res-pct{font-size:44px;font-weight:800;}
.res-pct .mono{font-size:30px;}
.verdict{
  display:inline-flex;align-items:center;gap:10px;border-radius:10px;padding:10px 20px;
  font-size:22px;font-weight:800;letter-spacing:.08em;margin-top:6px;
}
.verdict.pass{border:1px solid var(--state-correct);color:var(--state-correct);background:var(--tint-green-3);}
.verdict.fail{border:1px solid var(--state-incorrect);color:var(--state-incorrect);background:var(--tint-red);}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:18px;}
.res-cell{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;}
.res-cell .rl{font-size:12.5px;color:var(--text-secondary);font-weight:700;letter-spacing:.06em;display:flex;gap:7px;align-items:center;}
.res-cell .rv{font-size:24px;font-weight:800;margin-top:4px;}
.res-cell .rv small{font-size:13px;color:var(--text-secondary);font-weight:600;}
.res-list{margin-top:14px;}
.res-row{
  display:flex;gap:10px;align-items:center;justify-content:space-between;
  border:1px solid var(--border);border-radius:6px;background:var(--bg-surface-2);
  padding:8px 12px;margin:7px 0;font-size:14px;flex-wrap:wrap;
}
.res-row .rr-cred{font-family:var(--font-mono);font-weight:700;}
.timer-stats{margin-top:16px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 16px;font-size:14.5px;}
.timer-stats .ts-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;flex-wrap:wrap;}
.timer-stats .ts-row .k{color:var(--text-secondary);}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--bg-surface);border:1px solid var(--accent-amber);color:var(--text-primary);
  border-radius:8px;padding:10px 18px;font-size:14.5px;z-index:80;box-shadow:var(--shadow-d);
}

/* ---------- responsive ---------- */
@media (max-width:780px){
  .selrow{grid-template-columns:1fr;}
  select{max-width:100%;}
  .hdr-title{width:100%;}
  #hdrIn{gap:8px;}
  .ih-title{font-size:21px;}
  .blk-body,.intro-sec,.intro-hero{padding:14px;}
}
@media (prefers-reduced-motion:reduce){
  #progressBar{transition:none;}
  #progressBar::after{animation:none;display:none;}
  *{transition:none !important;}
}
</style>

</main>

<script>
'use strict';
/* =====================================================================

var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var PAYLOAD = {"docTitle": "T1547.014 — HARD practice exam", "sevCls": "sev-hard", "sevName": "HARD", "objId": "T1547.014", "objName": "Boot or Logon Autostart Execution: Active Setup", "objShort": "Active Setup", "budgetSec": 3000, "exercises": [{"id": "H-01", "type": "multi", "extype": "AN0871 pattern sweep (4 of 9)", "scenario": {"summary": "Detection-spec workshop — name the AN0871 risk pattern each telemetry line exhibits", "prose": "<p>Your detection engineer is implementing analytic AN0871 and asks you to label real telemetry against its risk vocabulary: non-standard StubPath values, execution from uncommon paths, unsigned binaries, unusual parent-child lineage post-user login, and creation/modification of HKLM Active Setup keys. Two hosts, one evening, nine lines. Select every line that exhibits <b>at least one<\/b> of those patterns.<\/p>", "arts": [{"label": "ARTEFACT 1 — RDS-01 + SRV-09 evening feed (UTC)", "kind": "log", "lines": ["L1 19:42 EID 13 value set ...\\Installed Components\\{C55A0D18-...}\\StubPath = C:\\Windows\\Temp\\upd7.exe   Host: RDS-01", "L2 19:44 EID 1 process create cmd.exe /c C:\\Users\\Public\\s.exe   Parent: mobsync.exe /logon   User: CORP\\tmarlow   Host: RDS-01", "L3 20:15 EID 13 value set ...\\Installed Components\\{91F4B2E8-...}\\StubPath = C:\\ProgramData\\cache\\ldr.dll.exe   Image: wscript.exe   Binary unsigned   Host: SRV-09", "L4 20:31 EID 12 key create ...\\Installed Components\\{A9C1D4E2-...}   Image: SCCMClient.exe   manifest #4471 MATCH   Host: SRV-09", "L5 20:36 EID 1 process create Teams.exe   Parent: explorer.exe   Host: RDS-01", "L6 20:40 EID 13 value set ...\\Installed Components\\{F3C1A9D2-...}\\StubPath = msiexec /Fpums {90160000-0011-0000-0000-0000000FF1CE} /Qn   change #2231   Host: SRV-09", "L7 20:52 EID 11 file create C:\\Windows\\System32\\spool\\PRINTERS\\00012.SPL   Host: SRV-09", "L8 21:07 EID 14 value modify ...\\Installed Components\\{E2A7C5D1-...}\\Version = 4,0,0,0   Image: powershell.exe   Host: RDS-01", "L9 21:30 EID 3 connect chrome.exe -> 10[.]44[.]12[.]9:443   Host: RDS-01"]}]}, "prompt": "Select the lines that exhibit an AN0871 risk pattern.", "hint": "Two lines are arming writes (one path problem, one signature problem), one is a lineage problem at execution, and one is the modification half of the correlation that new-key rules never see.", "exp": "<p><b>L1<\/b> — a StubPath pointing into <span class='mono'>C:\\Windows\\Temp<\/span>: execution from an uncommon path. <b>L2<\/b> — the stub executing as a child of the logon-time Active Setup helper with a payload in a user-writable folder: unusual post-login lineage (plus uncommon path). <b>L3<\/b> — an unsigned binary armed by a scripting host: the signature pattern. <b>L8<\/b> — a <b>modification<\/b> of an existing component's Version: the modification half of the correlation that naive new-key rules never see. L4 is the SCCM baseline working; L5, L7 and L9 are routine; L6 is installer behaviour inside an approved change.<\/p>", "study": "AN0871's vocabulary is your rule spec: name the pattern, then implement the match — never just 'new key'.", "opts": [{"t": "L1 — StubPath targets C:\\Windows\\Temp (uncommon path)", "ok": true, "why": "Execution from an uncommon path is one of AN0871's named risk patterns."}, {"t": "L2 — stub runs from Users\\Public under the logon-helper lineage", "ok": true, "why": "Unusual parent-child lineage post-login — the execution half of the correlation."}, {"t": "L3 — unsigned binary armed by wscript.exe", "ok": true, "why": "Unsigned binaries are an explicit AN0871 signal."}, {"t": "L8 — Version modified on an existing component", "ok": true, "why": "Modification of HKLM Active Setup keys is in the correlation — and invisible to new-key-only rules."}, {"t": "L4 — component created by SCCMClient, manifest match", "ok": false, "why": "Baseline deployment behaviour — known creator, manifest match, no risk pattern."}, {"t": "L5 — Teams.exe starts from explorer.exe", "ok": false, "why": "Routine shell child process; no Active Setup involvement."}, {"t": "L6 — msiexec writes StubPath under an approved change", "ok": false, "why": "Installer behaviour with a standard StubPath and a change ticket — the false positive you must tune out."}, {"t": "L7 — print spooler writes a .SPL file", "ok": false, "why": "Unrelated subsystem; the file path merely looks technical."}, {"t": "L9 — chrome.exe connects to an intranet address", "ok": false, "why": "Network noise; AN0871 correlates registry and process events, not browsing."}]}, {"id": "H-02", "type": "qcm", "extype": "Multiple choice", "scenario": {"summary": "Looks alarming? A new component pointing at a suite updater — change ticket and signature line up", "prose": "<p>Alert on WS-310: new component {C55A0D18-9E42-4B37-8D6F-1A7C02E95B41} with StubPath <span class='mono'>\"C:\\Program Files\\Common Files\\Contoso Suite\\csupdater.exe\" /syncfirst<\/span>. The binary is signed by Contoso IT (your own organisation). Ticket SD-8812 tracks the Contoso Suite 12.3 rollout; change #3001 is approved and currently in its deployment window; three other hosts already received the identical component from msiexec. The HKCU marker for this component was written on WS-310 four minutes after creation.<\/p>"}, "prompt": "What is the correct next action?", "hint": "One wrong path is to treat it as an emergency; the other is to close it without any check. Both skip a step.", "exp": "<p>Everything cross-checks: the binary is signed by your own IT, the component appeared inside an approved rollout that already produced identical entries elsewhere, and the HKCU marker confirms the expected once-per-user run. The right action is a <b>short verification and close<\/b>: confirm the signature and the change record, note it in the ticket, close as expected software. Deleting the key would break the deployed suite on that host; closing with no check would train you to ignore the tree — the next planted entry rides on that habit.<\/p>", "study": "Benign does not mean 'skip checking' — it means the checks resolve cleanly and you document them.", "opts": [{"t": "Verify signature and change record, then close as expected rollout behaviour", "ok": true, "why": "Correct: all signals (signature, change window, fleet-wide identical entries) agree on benign."}, {"t": "Delete the key immediately — new components are always hostile", "ok": false, "why": "Wrong here: it would break an approved deployment. Defensible during an unattributed incident, not when the change record matches."}, {"t": "Close without checks — signed binaries are always safe", "ok": false, "why": "Wrong: signatures get stolen and rollout names get masqueraded. The check is the value you add."}, {"t": "Disable the user's account pending investigation", "ok": false, "why": "Wrong: the user is not implicated — an installer ran under the deployment pipeline."}]}, {"id": "H-03", "type": "dnd", "extype": "Drag & drop (6 events, 3 buckets)", "scenario": {"summary": "Estate sweep — classify six Active Setup observations from the last 24 hours", "prose": "<p>You are sweeping telemetry after the DR-4011 phishing case. Six observations arrived from different hosts. Classify each: normal installer behaviour, an Active Setup persistence plant, or version-replay re-arming of an existing component.<\/p>"}, "prompt": "Drag each observation into its bucket.", "hint": "Installers come with change tickets and msiexec parents. Replays touch the Version value or the HKCU marker of keys that already existed.", "exp": "<p>Bucket logic: an <b>msiexec parent with an open change ticket<\/b> is installer behaviour — even when it writes StubPath, that is the mechanism's day job. A <b>new random GUID with a scripting host<\/b> as creator, or a stub pointing into a user-writable folder, is a plant. A <b>Version raise above stored HKCU copies<\/b> and a <b>bump hours after a phishing alert<\/b> are re-arming of keys that already existed — the replay pattern that 'new key' alerts never catch.<\/p>", "slots": ["Benign installer behaviour", "Active Setup persistence plant", "Version-replay re-arming"], "cap": "rack", "bank": [{"t": "msiexec writes StubPath for a new component; change #2231 open", "slot": 0, "why": "Installer parent plus an approved change ticket — the tree's normal day job."}, {"t": "Signed vendor updater component created during its rollout window", "slot": 0, "why": "A documented rollout producing an expected signed component is benign."}, {"t": "powershell.exe creates a random-GUID component at 22:41, no ticket", "slot": 1, "why": "Scripting host + random GUID + no change record — a plant."}, {"t": "StubPath points to a binary in C:\\Users\\Public on a fresh component", "slot": 1, "why": "Execution from a user-writable path on a new component is a classic plant pattern."}, {"t": "Version raised 4,0,0,0 to 9,0,0,0; HKCU copies at 4,0,0,0", "slot": 2, "why": "The raise schedules a re-run for every existing profile — replay arming."}, {"t": "Existing benign component's Version bumped two hours after a phishing alert", "slot": 2, "why": "A quiet bump of an old, trusted component right after an incident is the replay tell."}]}, {"id": "H-04", "type": "fill", "extype": "Fill in the blank (2 blanks)", "scenario": {"summary": "Write the core SIEM rule — two fields carry the whole detection", "prose": "<p>Your detection engineer asks you to spec the minimal reliable rule for StubPath writes. The rule fires on registry events where the written <b>value name<\/b> is X and the registry <b>path<\/b> contains Y. Generic enough to catch planting and replay; specific enough to avoid the rest of the registry.<\/p>"}, "prompt": "Complete the rule specification.", "hint": "Blank 1 is the exact value name the attacker must write. Blank 2 is the folder-like part of the key path that only Active Setup uses.", "exp": "<p>The pair that identifies the abuse is <b>StubPath<\/b> as the value name inside a path containing <b>Installed Components<\/b>. That combination exists only under the Active Setup tree, so the rule covers new components <i>and<\/i> StubPath edits on existing ones. Pinning the path to the machine part (HKLM ... Active Setup\\Installed Components) cuts user-part noise; add EID 14 later for Version renames.<\/p>", "text": "Rule: alert when the registry event's value name equals ____ AND the registry path contains ____, restricted to HKLM writes under the Active Setup tree.", "blanks": [{"a": ["stubpath"], "disp": "StubPath", "why": "StubPath is the only value whose data becomes an executed command — the write that matters."}, {"a": ["installed components", "installedcomponents", "active setup\\installed components"], "disp": "Installed Components", "why": "The path fragment that scopes the rule to the Active Setup component tree."}]}, {"id": "H-05", "type": "branch", "extype": "Decision tree (red / red / blue)", "scenario": {"summary": "Dual perspective — you re-arm it as red, then you detect it as blue", "prose": "<p>Authorised red-team exercise, host BOX-7 (Windows 10, admin rights obtained). The blue team watching the exercise has full Sysmon coverage. Three decisions follow — each locks when you continue. The scenario is scored at the end over all three steps.<\/p>"}, "prompt": "Make each decision in turn; the final Check grades all three steps together.", "hint": "Red side: you want EXISTING profiles to run your payload again. Blue side: the write you needed is your own detection anchor.", "exp": "<p><b>Attacker perspective:<\/b> a brand-new component only collects profiles as they first log on; reaching <i>existing<\/i> users requires the version mechanism — raise the Version value above each user's stored copy (comma format, e.g. 3,0,0,0 &rarr; 4,0,0,0) and the stub re-runs at their next logon. <b>Defender perspective:<\/b> that whole play is a registry <i>value modification<\/i> inside the Active Setup tree — so the single detection that catches replay is alerting on StubPath or Version value changes (EID 13/14) correlated with logon-time execution, not a rule that only fires on brand-new keys.<\/p>", "study": "Dual lesson: the re-arm lever (Version) and its detection (value-modification alerts) are the same fact seen from two sides.", "steps": [{"q": "STEP 1 — Your payload must re-run this week for users who <b>already<\/b> logged in. Which change achieves that?", "opts": [{"t": "Raise the Version value of your existing component above each user's stored copy", "ok": true, "why": "Correct: the version comparison is the re-run lever for existing profiles."}, {"t": "Create a brand-new Installed Components key", "ok": false, "why": "A new key is the right move for fresh profiles, not for users who already logged in this week."}, {"t": "Add a value under CurrentVersion\\Run", "ok": false, "why": "A Run key runs every logon — noisy, per-user, and a different technique; the exercise tracks Active Setup."}, {"t": "Reboot the host and wait", "ok": false, "why": "Rebooting changes nothing: execution is driven by the machine/user version comparison."}]}, {"q": "STEP 2 — Which exact value do you touch, and how?", "opts": [{"t": "Increase Version using four comma-separated numbers, e.g. 3,0,0,0 becomes 4,0,0,0", "ok": true, "why": "Correct: a higher comma-format Version forces the re-run and is copied to the user part afterwards."}, {"t": "Set IsInstalled to 0", "ok": false, "why": "IsInstalled = 0 disables the component — the opposite of what you want."}, {"t": "Empty the StubPath value", "ok": false, "why": "Empty StubPath removes the command — nothing would execute."}, {"t": "Rename the ComponentID value", "ok": false, "why": "ComponentID is metadata; the run decision is driven by the version comparison."}]}, {"q": "STEP 3 — Blue team: which single detection catches this replay play?", "opts": [{"t": "Alert on registry VALUE modifications (StubPath or Version) inside the Active Setup tree, correlated with logon execution", "ok": true, "why": "Correct: the replay is a value write; correlation with logon-time execution proves the impact."}, {"t": "Alert only when a new key appears under Active Setup", "ok": false, "why": "The replay edits an existing key — a new-key-only rule never fires."}, {"t": "Alert on new local administrator accounts", "ok": false, "why": "Useful hygiene elsewhere, but the replay used existing admin rights — no new account appears."}, {"t": "Alert on USB storage devices", "ok": false, "why": "No removable media is involved in any step of this play."}]}]}, {"id": "H-06", "type": "qcm", "extype": "Multiple choice", "scenario": {"summary": "Looks disabling? An IsInstalled=0 flip that happened AFTER the marker was written", "prose": "<p>Component {E2A7C5D1-4B63-4F98-8210-7D30B9C4E5A6} on FS-12: StubPath is present and points to <span class='mono'>cmd.exe /c powershell -enc SQBFAF...<\/span>. <b>IsInstalled is currently 0<\/b>. Registry audit: HKCU marker (Version copied) written 07:40 as part of anna.k's logon; IsInstalled flipped 1 &rarr; 0 at 09:02 by <span class='mono'>CORP\\svc_helpdesk2<\/span>, an account tied to the earlier phishing case. No logons occurred between 07:40 and 09:02.<\/p>"}, "prompt": "What does this timeline establish?", "hint": "Read the two timestamps in order. Ask what the marker's existence proves, and then who benefits from the flip.", "exp": "<p>The marker written at 07:40 proves the stub <b>already executed<\/b> during that logon — IsInstalled was 1 at the time. The 09:02 flip to 0 does not undo history; it disables <i>future<\/i> runs. Reading it as &ldquo;never ran&rdquo; is the obvious but wrong shortcut. And the flip itself is interesting: operators sometimes flip components off after use to clean up their trail or to stage the next move — either way the account that did it is part of the incident, not part of housekeeping.<\/p>", "study": "IsInstalled governs future runs only; the HKCU marker is your record of past runs.", "opts": [{"t": "The stub already ran for anna.k; the later flip disables future runs — investigate the flippers", "ok": true, "why": "Correct: marker at 07:40 proves the run; the 09:02 flip is a later, suspicious state change."}, {"t": "The stub never ran because IsInstalled is 0", "ok": false, "why": "Wrong: IsInstalled was 1 during the 07:40 logon — the marker could not exist otherwise."}, {"t": "IsInstalled = 0 deletes the StubPath value", "ok": false, "why": "Wrong: StubPath is still present; the flag only stops execution."}, {"t": "The component now runs at every boot regardless", "ok": false, "why": "Wrong: with IsInstalled = 0 the command will not run at all."}]}, {"id": "H-07", "type": "order", "extype": "Timeline ordering (6 steps)", "scenario": {"summary": "Incident DR-4011 — sequence the response so evidence survives and containment holds", "prose": "<p>WS-201 confirmed: planted component executed for one user; the same svc_helpdesk2 account is suspect on three more hosts. You lead. Order the six actions — early steps preserve facts, aggressive steps come only after capture, and the estate step closes the loop.<\/p>"}, "prompt": "Order the response actions from first to last.", "hint": "Two orders both 'work' operationally — but one destroys the memory and registry state your report needs. Choose that one away.", "exp": "<p>Scope first (what exists where), then preserve (memory while the stub's residue may be resident, then the registry export), then contain with the host <b>kept running<\/b> — removing the HKLM entry stops future executions without torching volatile evidence. Validate that the marker state and next logons behave, hunt the estate by GUID and stub string, and finish with the report mapping the behaviour to T1547.014. Powering off or reimaging up front destroys exactly the artefacts the later steps need.<\/p>", "items": ["Scope: enumerate every Installed Components entry and its StubPath on the host", "Preserve volatile evidence: capture memory while the host still runs", "Preserve on-disk state: export the Active Setup key and capture the timeline", "Contain: remove the malicious HKLM entry and keep the host running", "Hunt the estate: search all endpoints for the GUID and the stub command string", "Report: document the T1547.014 mapping, artefacts and lessons learned"], "why": ["Scope first: you need the full picture of what is planted before deciding what to preserve hardest.", "Memory is the most volatile artefact; the stub's decoded payload and lineage may exist only there.", "The registry export freezes the attacker's configuration exactly as planted.", "Containment removes future executions; keeping the host running preserves everything already volatile.", "Estate hunting uses the anchors you preserved — GUID, command string, service account.", "The report converts artefacts into detection and hardening changes."]}, {"id": "H-08", "type": "terminal", "extype": "Terminal command (tool not named)", "scenario": {"summary": "Evidence pull — enumerate every component's StubPath value with its properties in one line", "prose": "<p>Approved forensic jump host, Windows PowerShell 5.1, admin console open, host running. Objective: produce a list of <i>every<\/i> component under the machine Active Setup tree showing its StubPath value — one command, reading only, output as object properties. Choose tool, path and parameters yourself. Wrong flags are not forgiven here; option order is fine when the meaning is unchanged.<\/p>"}, "prompt": "Type the command that lists every component's StubPath value from HKLM.", "hint": "You need a cmdlet that reads VALUES (not just key names), a wildcard over every component sub-key, and a parameter that limits output to one value name.", "exp": "<p><span class='mono'>Get-ItemProperty<\/span> reads registry <b>values<\/b> of the items passed in; <span class='mono'>-Path ...\\Installed Components\\*<\/span> walks every component sub-key via the wildcard, and <span class='mono'>-Name StubPath<\/span> limits output to that one value. The near miss: <span class='mono'>Get-ChildItem<\/span> enumerates sub-keys but returns no StubPath values — you would list GUIDs and learn nothing. The reg.exe alternative (<span class='mono'>reg query ... /s /f StubPath<\/span>) is equally valid operationally; the canonical here is the property-object form your pipeline can consume.<\/p>", "study": "Get-ChildItem = keys; Get-ItemProperty = values. Choosing between them is the whole exercise.", "shell": {"caption": "Windows PowerShell — forensic jump host FJ-1 (simulation)", "banner": "Windows PowerShell 5.1 — simulation only, no real command runs", "prompt": "PS C:\\Users\\responder>", "elements": [{"label": "Cmdlet that reads registry values: Get-ItemProperty", "re": "get(-|)itemproperty\\b", "why": "Values live in item properties; Get-ChildItem would only enumerate sub-keys."}, {"label": "Path under HKLM ... Active Setup\\Installed Components", "re": "hklm:?\\\\software(\\\\|/)microsoft(\\\\|/)active\\s+setup(\\\\|/)installed\\s+components", "why": "The machine part of the tree is the evidence source."}, {"label": "Wildcard over every component sub-key (\\*)", "re": "components\\\\?\\*", "why": "The trailing \\* enumerates each GUID sub-key in one call."}, {"label": "Limits output to the StubPath value (-Name StubPath)", "re": "-name\\s+\\\"?stubpath\\b", "why": "-Name StubPath keeps the output a clean list of logon commands."}], "danger": [{"re": "reg\\s+(add|delete|copy|restore|save|load|unload)|remove-item|clear-item|set-itemproperty|(^|\\s)(del|erase|rd|rmdir|format)\\s", "label": "state-changing command"}], "dangerNote": "Your command writes to the registry. On a live evidence host, mutation before export is unrecoverable — read first, mutate only after the state is preserved.", "out": "StubPath : msiexec /Fpums {90160000-0011-0000-0000-0000000FF1CE} /Qn\nPSPath   : Microsoft.PowerShell.Core\\Registry::HKEY_LOCAL_MACHINE\\...\\{A9C1D4E2-51B7-4C38-9E0F-2D6A83B7C451}\n\nStubPath : cmd.exe /c powershell -w hidden -enc SQBFAFIAUG8A\nPSPath   : Microsoft.PowerShell.Core\\Registry::HKEY_LOCAL_MACHINE\\...\\{C4D9F0A7-2E61-4B05-8A33-9C1E5F70B2D8}", "canonical": "Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components\\*' -Name StubPath", "explain": ["<b>Get-ItemProperty<\/b> — reads the values of each item passed to it.", "<b>-Path 'HKLM:\\...\\Installed Components\\*'<\/b> — every component sub-key in one call via the wildcard.", "<b>-Name StubPath<\/b> — restricts the output to the value that holds the logon command."]}}, {"id": "H-09", "type": "match", "extype": "Matching (4 pairs)", "scenario": {"summary": "Detection audit — each existing control has a blind spot; name it", "prose": "<p>Post-incident review of DR-4011. Four controls exist in the estate. The attacker's replay play beat one of them; the others were never even exercised. Match each control to its blind spot so the roadmap is honest.<\/p>"}, "prompt": "Match each control to the gap it leaves open.", "hint": "For each control, ask: what would the attacker change so this control simply never fires?", "exp": "<p>A <b>new-key-only<\/b> rule is blind to edits of existing keys — the Version bump replays without any new key. <b>Execution-only<\/b> telemetry shows the run but not who wrote the component or when it was armed. <b>Hash block-lists<\/b> die against re-signed or slightly rebuilt payloads and against Masquerading names. <b>Daily snapshot diffs<\/b> miss anything that arms and executes between two snapshots. The compensating set: value-modification alerts (13/14) + logon-execution correlation + baseline diffs on Version.<\/p>", "pairs": [["Alert only on NEW keys under Installed Components", "Misses Version bumps on existing keys — replay arms without any new key", "The replay edits an existing component; no new key ever appears."], ["Alert only on process execution at logon", "Sees the run but not the arming — who wrote it and when is lost", "Without registry telemetry you catch the symptom and lose the configuration evidence."], ["Block-list of StubPath binary hashes", "Re-signed or rebuilt payloads and masqueraded names slip past", "Hashes pin one build; attackers ship a new build or borrow a legitimate name."], ["Daily registry snapshot diff", "Arms and executes that happen between two snapshots are invisible", "A version bump at 09:00 and a logon at 09:10 both fall inside one diff window."]]}, {"id": "H-10", "type": "triage", "extype": "SOC alert triage (4 alerts)", "scenario": {"summary": "RDS-01 night shift — a terminal server, an approved rollout, and two things that do not fit", "prose": "<p>RDS-01 is a Session Host for 80 users. The Contoso Suite 12.3 rollout (change #3001) deploys this week; the on-call rota lists three admins. Four alerts. Choose the best disposition for each; a wrong pick cancels a correct one.<\/p>"}, "prompt": "Set a disposition for each alert.", "hint": "Two alerts match the rollout and can be closed. One is a replay by an off-rota account. One matches the manifest but not the timing — that deserves a check, not silence.", "exp": "<p>A1: unsigned stub from ProgramData, unknown creator — escalate as a plant. A2: signed updater, msiexec parent, inside change #3001 — close as rollout behaviour. A3: Version raise by an admin not on the rota — escalate as replay. A4: manifest match but created three days outside the deployment window — put it in monitored review with the platform team; closing it as benign would trust a timing anomaly you have not explained.<\/p>", "study": "Manifest match is necessary but not sufficient — timing and creator complete the story.", "disps": [{"id": "d0", "label": "Close — covered by the approved rollout"}, {"id": "d1", "label": "Escalate — persistence plant"}, {"id": "d2", "label": "Escalate — version replay"}, {"id": "d3", "label": "Monitored review — verify with the platform team"}], "alerts": [{"id": "A1", "title": "New component, unsigned stub in ProgramData", "meta": "StubPath = <span class='mono'>C:\\ProgramData\\cache\\upd.exe<\/span>, creator unknown, 22:41, binary unsigned", "ok": "d1", "why": "Unknown creator, unsigned binary in a user-writable directory — a plant."}, {"id": "A2", "title": "New component during Suite 12.3 deployment", "meta": "StubPath = signed <span class='mono'>csupdater.exe<\/span>, parent msiexec.exe, change #3001 in window", "ok": "d0", "why": "Signed binary, installer parent, approved change — the tree working as designed."}, {"id": "A3", "title": "Version raise on an existing component", "meta": "Version 1,0,0,0 to 8,0,0,0 by CORP\\svc_helpdesk2 — not on the on-call rota", "ok": "d2", "why": "A replay arming by an off-rota privileged account on an 80-user host — escalate."}, {"id": "A4", "title": "New component matching the rollout manifest, odd timing", "meta": "Component GUID matches change #3001 manifest; created 3 days outside the deployment window", "ok": "d3", "why": "Right content, wrong time — verify with the platform team before closing or escalating."}]}, {"id": "H-11", "type": "qcm", "extype": "Multiple choice", "scenario": {"summary": "Looks benign? A helpful-sounding name in the wrong place", "prose": "<p>Component {91F4B2E8-3D57-4C0A-8E62-4B90C7D1F353} on WS-201. StubPath: <span class='mono'>mshta.exe C:\\Users\\Public\\Cache\\onedrive_sync.hta<\/span>. The analyst on shift says: &ldquo;OneDrive name, Windows binary — close it.&rdquo; The host had a phishing click yesterday; the component was created at 03:12; no change ticket matches.<\/p>"}, "prompt": "Assess the analyst's reasoning.", "hint": "Ask where the payload lives and which interpreter launches it — then weigh the name again.", "exp": "<p>The name borrows OneDrive's credibility, but the facts scream loader: <b>mshta<\/b> executing an HTA script from <b>C:\\Users\\Public<\/b> — a user-writable folder — planted at 03:12 with no change record, on a host that had a phishing click the day before. mshta shipping with Windows is exactly why attackers pick it: signed binary, script interpreter, no payload on disk until the HTA pulls one. High priority: isolate the artefact set, export the key, treat as active persistence.<\/p>", "study": "Masquerading lives in names; location and interpreter choice carry the real signal.", "opts": [{"t": "Wrong call — mshta running an HTA from a user-writable path is a classic loader pattern", "ok": true, "why": "Correct: the interpreter plus location outweighs the friendly name; treat as active persistence."}, {"t": "Right call — the OneDrive name proves it is sync software", "ok": false, "why": "Wrong: names are free. Masquerading exists precisely to exploit that trust."}, {"t": "Right call — mshta ships with Windows, so any use is normal", "ok": false, "why": "Wrong: mshta's legitimacy is the attraction; execution context decides intent."}, {"t": "Wrong call, but only because the host had a phishing click yesterday", "ok": false, "why": "Half-right reasoning: even without the click history, mshta + Public folder + 03:12 + no ticket is alarm-worthy."}]}, {"id": "H-12", "type": "multi", "extype": "Multi-select (3 of 7)", "scenario": {"summary": "Planted vs executed — which artefacts prove the stub actually ran?", "prose": "<p>Legal asks: &ldquo;Did the payload execute, or was it only planted?&rdquo; Seven candidate artefacts from WS-201 are on the table. Select every artefact that <b>proves execution<\/b> (the stub command actually ran in a user session) — planting alone does not count.<\/p>"}, "prompt": "Select the artefacts that prove execution.", "hint": "One artefact records the process, one records the profile's memory of the run, one shows the payload's behaviour in the command line itself.", "exp": "<p>Proof of execution: <b>the EID 1 process event<\/b> with the stub's exact command line in the logon chain; <b>the HKCU marker written after the plant<\/b> (the profile's record of having run it); and <b>the encoded -enc payload in the command line<\/b> — it shows what the executed process was doing. A key creation event alone proves planting; a random-looking GUID proves nothing; the host's OS build and its laptop status are irrelevant either way.<\/p>", "study": "Planting = registry state. Execution = process + user-part state. Keep the two apart in reports.", "opts": [{"t": "EID 1: powershell.exe with the stub's exact command line, logon chain parent", "ok": true, "why": "A process creation event is the direct proof that the command ran."}, {"t": "HKCU marker for the component written after the plant", "ok": true, "why": "Windows writes the marker only after running the component for that profile."}, {"t": "StubPath command line contains an -enc encoded payload", "ok": true, "why": "The encoded blob documents what the executed command was doing."}, {"t": "EID 12: the component key was created", "ok": false, "why": "Creation proves planting only — the component may never have fired."}, {"t": "The GUID looks randomly generated", "ok": false, "why": "Cosmetics prove neither planting nor execution."}, {"t": "The host is a laptop running Windows 10", "ok": false, "why": "Platform facts are context, never proof of a run."}, {"t": "The component's (Default) name sounds legitimate", "ok": false, "why": "A display name is free text — Masquerading makes it worthless as evidence."}]}, {"id": "H-13", "type": "fill", "extype": "Fill in the blank (2 blanks)", "scenario": {"summary": "Version format trap — a one-character mistake that silences a payload", "prose": "<p>An operator sets a component's Version to a dotted string &mdash; four numbers separated by dots, written the way an IPv4 address looks &mdash; and waits. Nothing re-runs, on any host. The documented format uses four numbers separated differently, and re-arming requires the machine number to sit above the user's stored copy.<\/p>"}, "prompt": "Complete both blanks about the Version format.", "hint": "Blank 1: the separator in the Version value. Blank 2: the verb describing what the attacker does to the machine-side number.", "exp": "<p>Version values are four numbers separated by <b>commas<\/b> — a dotted string does not compare as intended, which is why the operator's dot-formatted attempt did nothing. To force a re-run the attacker <b>increases<\/b> the machine-side Version above the copy stored in the user part. Fun fact for your report: the same format confusion sometimes breaks attackers' own tooling — and produces the silent logs that make a hunt easier.<\/p>", "text": "The Version value uses four numbers separated by ____ , not dots. To force a re-run for existing users, an attacker ____ the machine-side Version above the copy stored in the user part.", "blanks": [{"a": ["commas", "comma"], "disp": "commas", "why": "The documented format is comma-separated, e.g. 1,2,3,4 — dots do not compare correctly."}, {"a": ["increases", "increase", "raises", "raise", "bumps", "bump"], "disp": "increases", "why": "Raising the machine Version above the user's stored copy triggers the re-run."}]}, {"id": "H-14", "type": "qcm", "extype": "Multiple choice", "scenario": {"summary": "Least aggressive action that still works — live session, confirmed malicious stub, no current C2", "prose": "<p>WS-201, 10:30. The planted component is confirmed malicious; anna.k is actively working (a live session); no C2 traffic has been seen for 40 minutes; memory capture and registry export are already done. The site lead wants the machine usable and the evidence intact.<\/p>"}, "prompt": "Choose the correct action.", "hint": "Three options 'solve' the problem. Two of them destroy evidence or are overkill; one removes exactly the persistence vector and nothing else.", "exp": "<p>The least aggressive action that removes the threat: <b>delete the malicious HKLM entry and keep the host running<\/b>. It stops every future logon execution while preserving live session state and the already-captured evidence. Powering off destroys memory you may still need; reimaging throws away the timeline; deleting the user profile punishes the victim and orphans context. Aggression is not thoroughness — removal after preservation is the professional move.<\/p>", "study": "Containment ladder: preserve &rarr; remove the specific artefact &rarr; escalate to isolation only if execution continues.", "opts": [{"t": "Delete the malicious HKLM entry and keep the host running", "ok": true, "why": "Correct: removes future executions, preserves the live session and captured evidence."}, {"t": "Power off the machine immediately", "ok": false, "why": "Wrong: it destroys volatile memory for zero extra containment — the entry persists on disk anyway."}, {"t": "Reimage now, investigate later", "ok": false, "why": "Wrong: it erases the host-side timeline before the report can be finished."}, {"t": "Delete anna.k's user profile to clear the marker", "ok": false, "why": "Wrong: it does not touch the machine part and destroys the user's environment."}]}, {"id": "H-15", "type": "spot", "extype": "Spot the dangerous step", "scenario": {"summary": "Runbook review — one of these five steps re-arms the malware instead of removing it", "prose": "<p>A junior colleague drafted this cleanup runbook for confirmed Active Setup persistence:<\/p>", "arts": [{"label": "ARTEFACT 1 — Draft runbook RB-14", "kind": "log", "lines": ["1. Export the component key and its values as evidence", "2. Record the GUID, StubPath and Version values in the case file", "3. Delete the component's HKCU marker so the malware 'cannot run again'", "4. Remove the malicious HKLM entry", "5. Hunt all endpoints for the same GUID and StubPath string"]}]}, "prompt": "Which step is wrong — and dangerous?", "hint": "Simulate step 3 and step 4 in order. What does Active Setup do for a profile that has 'never' run a component?", "exp": "<p>Step 3 is the trap. The HKCU marker is the profile's record of having <b>already<\/b> run the component. Delete it and Active Setup treats the profile as fresh — so if any copy of the component survives (step 4 happens <i>after<\/i> step 3 in this draft), the stub executes again at the next logon. The order must be: export, record, remove the <b>HKLM<\/b> entry, and only then consider user-part cleanup during validation. Deleting the marker first is exactly how responders have re-infected hosts for a decade.<\/p>", "study": "Machine part = the payload. User part = the memory. Remove the payload first; never reset the memory while the payload exists.", "opts": [{"t": "Step 3 — deleting the HKCU marker re-arms execution", "ok": true, "why": "Correct: a profile without its marker runs the component again at next logon while the key still exists."}, {"t": "Step 1 — exporting evidence first is wrong", "ok": false, "why": "Exporting first is correct; it freezes the configuration before anything mutates."}, {"t": "Step 2 — recording values is unnecessary", "ok": false, "why": "Recording GUID, StubPath and Version creates the hunt anchors for the estate search."}, {"t": "Step 4 — removing the HKLM entry", "ok": false, "why": "Removing the machine part is the actual containment step — right idea, and safe after the export."}, {"t": "Step 5 — estate hunting", "ok": false, "why": "Hunting for the same GUID and command string is exactly how you find the other planted hosts."}]}, {"id": "H-16", "type": "match", "extype": "Matching (4 pairs)", "scenario": {"summary": "CTI hand-off — map each artefact to what it honestly supports (PoisonIvy / Packrat case)", "prose": "<p>Your CTI lead is drafting the report on DR-4011. ATT&amp;CK's own procedure example for T1547.014 is PoisonIvy (S0012) creating an Active Setup key pointing to a malicious executable; the Packrat reporting documents Poison Ivy against activists. Four artefacts are on the table. Map each to the conclusion it can honestly support.<\/p>"}, "prompt": "Match each artefact to its supported conclusion.", "hint": "Separate 'matches documented behaviour' from 'names an actor'. Shared malware needs infrastructure and TTP overlap before any name goes in a report.", "exp": "<p>An Active Setup key pointing at a PoisonIvy binary <b>matches the documented S0012 behaviour<\/b> — a technique-level match you can cite. PoisonIvy use against activists <b>aligns with the Packrat reporting<\/b> — historical context, not proof of the same hand. The same stub string on three hosts is a <b>scope anchor<\/b> for hunting. But naming a group from PoisonIvy presence alone is <b>too strong<\/b>: the RAT is widely shared, so attribution needs C2 infrastructure overlap and TTP corroboration before publication.<\/p>", "study": "Procedure examples match behaviour; actor names need infrastructure and TTPs — report confidence accordingly.", "pairs": [["Active Setup key pointing to a PoisonIvy binary", "Matches the documented T1547.014 procedure example (S0012 PoisonIvy)", "The ATT&amp;CK page records exactly this behaviour for PoisonIvy — a clean technique-level match."], ["PoisonIvy used against activists in 2015 reporting", "Consistent with the Packrat campaign reporting cited by ATT&amp;CK", "Historical context from the cited reporting — useful background, not proof of the current hand."], ["Identical stub string found on three additional hosts", "A scope anchor: hunt the estate for the same string", "Reused tooling strings are how you expand scope — before any naming debate."], ["Naming the actor from PoisonIvy presence alone", "Too strong: shared malware requires infrastructure and TTP corroboration", "PoisonIvy is widely reused; attribution without C2 and TTP overlap is speculation."]]}], "intro": {"title": "T1547.014 — HARD practice exam", "learn": "<p>This is the <b>HARD<\/b> tier for <b>T1547.014 &mdash; Boot or Logon Autostart Execution: Active Setup<\/b>, the Windows logon-persistence sub-technique of MITRE ATT&amp;CK. The mechanism in one line: a component under <span class='mono'>HKLM\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components<\/span> carries a <span class='mono'>StubPath<\/span> command that executes once per user at logon, before the desktop, in that user's context. Because the mechanism is a normal Windows feature, the ATT&amp;CK page concludes it cannot easily be mitigated with preventive controls &mdash; so detection quality and response discipline are where defenders win or lose.<\/p><p>At this level you stop reciting facts and start <b>discriminating<\/b>. Real estates are noisy: software installers create components legitimately, SCCM deployments write the same tree, and attackers know all of this. ATT&amp;CK's detection strategy for this technique (DET0312, analytic AN0871) is explicitly a <b>multi-event correlation<\/b>: registry creation or modification of HKLM Active Setup keys with non-standard StubPath values, followed by process execution from uncommon paths, unsigned binaries, or unusual parent-child lineage after user login. You will reason over exactly such telemetry &mdash; and over its blind spots, like version bumps on existing keys that &ldquo;new key&rdquo; alerts never see.<\/p><p>The scenarios mirror real work. You triage a queue where a benign signed updater sits next to a planted stub. You catch the classic response mistake &mdash; deleting the HKCU marker, which <i>re-arms<\/i> the component. You weigh the least-aggressive action that still removes persistence without destroying evidence. And you work a scenario built on the page's own procedure example: <b>PoisonIvy (S0012)<\/b>, documented creating an Active Setup key pointing to a malicious executable, including its use against activists in the Packrat reporting.<\/p><p>Answers here are rarely the loudest option. Read every artefact, expect at least two defensible-looking choices per question, and justify the one you keep.<\/p><p>The roles at this tier: a <b>SOC analyst<\/b> judges whether a correlated alert is a planted stub or just a noisy installer; a <b>threat hunter<\/b> builds AN0871-style sweeps; an <b>incident responder<\/b> contains hosts without destroying the evidence; a <b>detection engineer<\/b> closes the blind spots this file exposes; a <b>red teamer<\/b> emulates the tradecraft while staying under the radar; a <b>CTI analyst<\/b> maps what was observed to T1547.014 and to the tooling that uses it; and a <b>GRC analyst<\/b> owns the audit standard that makes the telemetry exist at all.<\/p>", "themes": [{"name": "Detection Logic &amp; Analytics (DET0312 / AN0871)", "items": ["Multi-event correlation: registry write + logon execution", "Non-standard StubPath values", "Execution from uncommon paths", "Unsigned binaries", "Unusual parent-child lineage post-login", "Blind spot: Version bumps on existing keys", "Benign installer false positives"]}, {"name": "Version-Replay &amp; State Manipulation", "items": ["Version raise above the HKCU copy", "Deleted HKCU marker re-arms execution", "IsInstalled flips after execution", "Comma format of Version (dots do not compare)"]}, {"name": "Real-World Procedure Examples", "items": ["PoisonIvy (S0012) Active Setup key", "Packrat campaign reporting (Poison Ivy)", "Shared malware vs attribution"]}, {"name": "Response Discipline &amp; Hardening", "items": ["Least-aggressive containment", "Evidence export before mutation", "HKCU marker trap in runbooks", "Estate scoping by GUID and stub string", "Wow6432Node blind spot", "Proof-of-execution vs mere planting"]}], "how": "<ul class='how-list'><li><span class='ic ic-ok'>&#10003;<\/span><span><b>Goal:<\/b> at least <b>70%<\/b> over the exercises you answer. Skipped-and-never-answered exercises are excluded from the score entirely.<\/span><\/li><li><span class='ic ic-part'>&#10003;<\/span><span><b>Exercise types in this file:<\/b> a filtered log-timeline analysis, multiple choice with near-miss options, multi-select evidence sets, event-bucket drag &amp; drop, a three-step red/blue decision tree, matching detections to blind spots, SOC triage, response ordering, fill in the blank, a terminal where the tool is <i>not<\/i> named, and a &ldquo;spot the dangerous step&rdquo; runbook review.<\/span><\/li><li><span class='ic ic-pause'>&#9208;<\/span><span><b>Timer:<\/b> 50:00 countdown. Manual <b>Pause<\/b> hides the exercise; <b>Check<\/b> stops the clock automatically while you study the feedback and resumes on <b>Next<\/b>. Long scenarios can be collapsed while you answer.<\/span><\/li><li><span class='ic ic-part'>&#10003;<\/span><span><b>Partial credit:<\/b> credit = max(0, (H &minus; W) / N) on every multi-item exercise — wrong picks cancel correct ones. One hint per exercise costs 10% of that exercise's credit, and HARD hints only remove one wrong path.<\/span><\/li><li><span class='ic ic-miss'>&#9888;<\/span><span><b>Skips:<\/b> the review-skipped screen appears before any final submit; unanswered skips are excluded, never penalised.<\/span><\/li><\/ul>"}};

/* ---------------- small utilities ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function shuffle(a){
  var r=a.slice();
  for(var i=r.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=r[i]; r[i]=r[j]; r[j]=t;
  }
  return r;
}
function norm(s){ return String(s).replace(/\s+/g,' ').trim().toLowerCase(); }
function el(tag,cls,html){
  var e=document.createElement(tag);
  if(cls) e.className=cls;
  if(html!==undefined) e.innerHTML=html;
  return e;
}
/* Mandatory scoring formula: credit = max(0,(H-W)/N) */
function scoreExercise(H,W,N){ return Math.max(0,(H-W)/N); }
function fmtClock(ms){
  var s=Math.max(0,Math.floor(ms/1000));
  var m=Math.floor(s/60); s=s%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function fmt1(x){ return (Math.round(x*10)/10).toFixed(1); }
/* Motion helper: honour prefers-reduced-motion for JS-driven scrolling too */
function reducedMotion(){
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}
function scrollToTop(){
  try{ window.scrollTo({top:0,behavior:reducedMotion()?'auto':'smooth'}); }
  catch(e){ window.scrollTo(0,0); }
}
function scrollNearest(elm){
  if(!elm) return;
  try{ elm.scrollIntoView({behavior:reducedMotion()?'auto':'smooth',block:'nearest'}); }
  catch(e){ /* older browsers: no-op */ }
}

/* ---------------- toast ---------------- */
var toastT=null;
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.remove('hidden');
  if(toastT) clearTimeout(toastT);
  toastT=setTimeout(function(){ t.classList.add('hidden'); },2200);
}

/* ---------------- timer state machine ----------------
   States: IDLE -> RUNNING <-> PAUSED_MANUAL / PAUSED_AUTO_CHECK -> ENDED
   Check sets PAUSED_AUTO_CHECK BEFORE feedback is rendered.
   Next / Final Submit / Return-to-review resume the clock.        */
var Timer={
  state:'IDLE', remain:0, iv:null, last:0, mark:0,
  manualMs:0, feedbackMs:0, fromAuto:false,
  begin:function(sec){
    this.remain=sec*1000; this.state='RUNNING'; this.last=Date.now();
    this.manualMs=0; this.feedbackMs=0; this.fromAuto=false;
    if(this.iv) clearInterval(this.iv);
    this.iv=setInterval(function(){ Timer.tick(); },250);
    this.render();
  },
  tick:function(){
    var now=Date.now(), dt=now-this.last; this.last=now;
    if(this.state!=='RUNNING') return;
    this.remain-=dt;
    if(this.remain<=0){ this.remain=0; this.render(); this.end(); return; }
    this.render();
  },
  render:function(){
    var c=$('timerChip');
    if(!c) return;
    var t=fmtClock(this.remain);
    var txt='', cls='chipstat';
    if(this.state==='RUNNING'){ txt='<span class="ic">&#9654;</span> RUNNING <span class="mono">'+t+'</span>'; }
    else if(this.state==='PAUSED_MANUAL'){ cls+=' ts-paused'; txt='<span class="ic">&#9208;</span> PAUSED &mdash; manual (press Resume) <span class="mono">'+t+'</span>'; }
    else if(this.state==='PAUSED_AUTO_CHECK'){ cls+=' ts-paused'; txt='<span class="ic">&#9208;</span> PAUSED &mdash; reviewing feedback (resumes on Next) <span class="mono">'+t+'</span>'; }
    else if(this.state==='ENDED'){ cls+=' ts-ended'; txt='<span class="ic">&#9632;</span> ENDED <span class="mono">'+t+'</span>'; }
    else { txt='<span class="ic">&#9679;</span> READY <span class="mono">'+t+'</span>'; }
    c.className=cls; c.innerHTML=txt;
  },
  pauseManual:function(){
    if(this.state!=='RUNNING' && this.state!=='PAUSED_AUTO_CHECK') return;
    this.fromAuto=(this.state==='PAUSED_AUTO_CHECK');
    this.mark=Date.now(); this.state='PAUSED_MANUAL';
    if(this.iv){ clearInterval(this.iv); this.iv=null; }
    this.render();
  },
  resumeManual:function(){
    if(this.state!=='PAUSED_MANUAL') return;
    this.manualMs+=Date.now()-this.mark;
    if(this.fromAuto){ this.fromAuto=false; this.state='PAUSED_AUTO_CHECK'; }
    else{ this.state='RUNNING'; this.last=Date.now(); if(this.iv)clearInterval(this.iv); this.iv=setInterval(function(){ Timer.tick(); },250); }
    this.render();
  },
  pauseAuto:function(){
    if(this.state==='RUNNING'){ this.mark=Date.now(); this.state='PAUSED_AUTO_CHECK'; }
    if(this.iv){ clearInterval(this.iv); this.iv=null; }
    this.render();
  },
  resumeFromAuto:function(){
    if(this.state!=='PAUSED_AUTO_CHECK') return;
    this.feedbackMs+=Date.now()-this.mark;
    this.state='RUNNING'; this.last=Date.now();
    if(this.iv) clearInterval(this.iv);
    this.iv=setInterval(function(){ Timer.tick(); },250);
    this.render();
  },
  end:function(silent){
    if(this.state==='ENDED') return;
    this.state='ENDED';
    if(this.iv){ clearInterval(this.iv); this.iv=null; }
    this.render();
    if(silent!==true && typeof App!=='undefined' && App.finishByTimeout) App.finishByTimeout();
  }
};

/* ---------------- app state ---------------- */
var App={
  order:[], status:{}, credits:{}, hintUsed:{},
  curIdx:-1, visited:0, reported:false, reviewing:false, lockInputs:false,
  attempt:0, answers:{},

  exById:function(i){ return PAYLOAD.exercises[i]; },
  isTerm:function(ex){ return ex && ex.type==='terminal'; },
  buildOrder:function(){
    var n=PAYLOAD.exercises.length, idxs=[], i, tries=0, ord, bad, j;
    for(i=0;i<n;i++) idxs.push(i);
    for(;;){
      ord=shuffle(idxs); tries++; bad=false;
      for(j=1;j<ord.length;j++){
        if(this.isTerm(this.exById(ord[j])) && this.isTerm(this.exById(ord[j-1]))){ bad=true; break; }
      }
      if(!bad || tries>80) break;
    }
    return ord;
  },
  reset:function(){
    this.status={}; this.credits={}; this.hintUsed={}; this.answers={};
    this.curIdx=-1; this.visited=0; this.reported=false; this.reviewing=false; this.lockInputs=false;
    this.finishing=false; this.attempt++;
    this.order=this.buildOrder();
    for(var i=0;i<this.order.length;i++){ this.status[this.order[i]]='pending'; }
  },
  start:function(){
    this.reset();
    $('intro').classList.add('hidden');
    $('hdr').classList.remove('hidden');
    $('progressWrap').classList.remove('hidden');
    $('exam').classList.remove('hidden');
    Timer.begin(PAYLOAD.budgetSec);
    this.showNext();
  },
  nextPending:function(){
    for(var i=0;i<this.order.length;i++){
      if(this.status[this.order[i]]==='pending') return i;
    }
    return -1;
  },
  skippedIdxs:function(){
    var out=[],i;
    for(i=0;i<this.order.length;i++){ if(this.status[this.order[i]]==='skipped') out.push(this.order[i]); }
    return out;
  },
  pendingCount:function(){ return this.nextPending()===-1 ? 0 : 1; },
  answeredCount:function(){
    var c=0;
    for(var k in this.status){ if(this.status[k]==='answered') c++; }
    return c;
  },
  creditSum:function(){
    var s=0;
    for(var k in this.credits){ s+=this.credits[k]; }
    return s;
  },
  anySkipped:function(){ return this.skippedIdxs().length>0; },
  showNext:function(){
    this.reviewing=false;
    var i=this.nextPending();
    if(i<0){
      if(this.anySkipped()) this.showReview();
      else finishExam(false);
      return;
    }
    renderExercise(i);
  },
  progress:function(){
    var n=PAYLOAD.exercises.length;
    $('progressBar').style.width=Math.round(100*this.visited/Math.max(1,n))+'%';
  },
  updateScoreChip:function(){
    var a=this.answeredCount(), s=this.creditSum();
    var pct=a>0?Math.round(100*s/a):0;
    $('scoreChip').innerHTML='<span class="lbl">Score</span> <span class="score-sum mono">'+fmt1(s)+'</span><span class="mono"> / '+a+'</span> <span class="mono">('+pct+'%)</span>';
  }
};

/* ---------------- site handshake (STEP 6.3) ----------------
   Accepts CYBERPULSE_INIT / CYBERMASTERY_INIT. The theme field is
   always 'dark'; this file is dark-only, so appearance never changes. */
window.addEventListener('message',function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  try{
    if(event.data.username){
      var chip=$('whoChip');
      chip.classList.remove('hidden');
      chip.innerHTML='<span class="lbl">Analyst</span> '+esc(event.data.username);
    }
  }catch(e){ /* handshake is optional */ }
});

/* ---------------- score report (STEP 6.2) ---------------- */
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0 ? Math.round((creditSum/answeredCount)*100) : 0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:META.topicId,
      batch:META.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=70
    },location.origin);
  }catch(e){
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}
