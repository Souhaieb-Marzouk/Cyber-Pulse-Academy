<script>
"use strict";
var EXAM = {"severity":"EXTREMELY HARD","attckId":"T1590.003","attckName":"Network Trust Dependencies","intro":{"learn":["<p>You are about to work a <b>Sub-Technique of the MITRE ATT&amp;CK framework<\/b>. Its ID is <b>T1590.003<\/b> and its name is <b>Network Trust Dependencies<\/b>. It belongs to the <b>Reconnaissance<\/b> tactic (TA0043) and its platform is <b>PRE<\/b> — the pre-attack stage: it happens before the attacker touches your systems. In plain words: before attacking, the adversary studies the organisations you trust — your managed service provider (MSP), your monitoring partner (MSSP), your contractors — because those parties often hold connected, and sometimes elevated, access to your network.<\/p>","<p>You will meet this technique in real work: a SOC analyst triaging evidence that someone is mapping your third parties; a threat-intelligence analyst briefing a CISO who needs a decision in ten minutes; a GRC reviewer reading a third-party access register that no longer matches reality; a detection engineer explaining why the analytic for this behaviour stays noisy. Your tools are familiar: the CoreSight SIEM, session and VPN logs, access registers, and the ATT&amp;CK matrix itself.<\/p>","<p>The sixteen exercises put you in the senior analyst's chair at Aurora Finance Group. You will resolve conflicting signals — MSSP shared-tenant logs that disagree with a contractor's personal VPN; decide when to escalate to third-party risk team and when to gather more evidence; weigh the costly action — cutting the MSSP link means settlement operations halt; and reject the comfortable best practice that is wrong here: trusting a partner only because 'they are certified'.<\/p>","<p>Mastering this sub-technique protects you against the quiet way in. Attacks that arrive through a trusted relationship (T1199) rarely look like attacks at first. If you can map trust dependencies, test comfortable assumptions against artefacts, and defend every decision with evidence, you remove the adversary's cheapest entry path. Start when you are ready — the board is waiting.<\/p>"],"keywords":[{"theme":"Trust dependency concepts","items":["Network Trust Dependencies (T1590.003)","managed service provider (MSP)","MSSP shared-tenant access","contractor with elevated access","Trusted Relationship (T1199)"]},{"theme":"Collection and adversary chain","items":["Phishing for Information (T1598)","Search Open Technical Databases (T1596)","Search Open Websites/Domains (T1593)","Active Scanning (T1595)","Compromise Infrastructure (T1584)"]},{"theme":"Detection and mitigation","items":["DET0828","AN1960","M1056 Pre-compromise","high false-positive rate"]},{"theme":"Senior analyst decisions","items":["escalate to third-party risk team","gather more evidence","cut the MSSP link","settlement halt","ISO 27001"]},{"theme":"Evidence artefacts","items":["third-party access register","shared-tenant logs","personal VPN","RADIUS records","CoreSight"]}]},"exercises":[{"id":"e01","type":"multi","title":"Register vs reality: MSSP access audit","scenario":"<p>08:20. Deputy CISO Anaya Rao has a board risk call at 09:00 and wants to repeat one line: <b>'our third-party access register is accurate and current.'<\/b> You are Iman Khalil, senior SOC analyst. Before she says that on the record, you pull the evidence on the MSSP shared-tenant access that Northgate holds, on Callisto Consulting (the contractor with elevated access to the treasury reconciliation environment), and on the nightly custody drop.<\/p><p>The register says Northgate's access is read-only in CoreSight. The tenant access audit says something else. Callisto's register row has not been reviewed since 2024. VaultBridge Custody drops its file nightly at 02:00 under ticket #63418.<\/p><p>Anaya messages: 'Board in 40 minutes. Tell me what the evidence actually supports — not what the register hopes.'<\/p>","artefacts":[{"label":"Third-party access register (extract)","kind":"table","head":["Party","Access as registered","Scope","Last review"],"rows":[["Northgate MSSP","Read-only SIEM tenant","Shared tenant in CoreSight, 2 named analysts","2026-01"],["Callisto Consulting","Elevated application account","Treasury reconciliation on AF-3RDPARTY","2024-03"],["VaultBridge Custody","Nightly SFTP drop","Custody file, 02:00, ticket-approved","2026-01"]]},{"label":"CoreSight tenant access audit (last 7 days)","kind":"logview","body":"2026-02-02T09:14:02Z login ok user=ng.soc1 role=tenant-analyst action=view src=10[.]168[.]20[.]10\n2026-02-02T09:31:47Z login ok user=ng.soc1 role=tenant-analyst action=export view=All-Alerts-90d src=10[.]168[.]20[.]10\n2026-02-03T03:44:57Z export ok user=svc-northgate view=All-Alerts-90d token=NG-EXPORT-77 src=10[.]168[.]20[.]10\n2026-02-03T04:00:31Z sftp ok user=af-vaultdrop src=192[.]0[.]2[.]31 file=custody-0200.csv\n2026-02-04T11:05:12Z login ok user=m.ferro role=app-admin target=AF-3RDPARTY src=10[.]168[.]20[.]45"},{"label":"Deputy CISO — direct line","kind":"chat","body":["A. Rao: Board in 40 minutes. Is the register true?","Iman Khalil: Not as written. The audit shows an export role and a named export token for Northgate.","A. Rao: So 'read-only' is wrong on paper and in fact?","Iman Khalil: In fact, yes. The Callisto row is also two review cycles old."]},{"label":"Facilities — catering, Northgate onboarding workshop","kind":"table","head":["Item","Qty","Cost"],"rows":[["Coffee urns","2","80.00"],["Sandwich platters","4","142.50"],["Named visitor badges","2","0.00"]]}],"question":"The CISO will quote you verbatim: select every statement the evidence actually supports about Aurora's trust dependencies.","hint":"Constraint: a register states intent; the audit records what the accounts actually did — grade the dependency on behaviour, not paperwork.","explanation":"<p>Trust dependencies are graded on effective access, not on what a register claims: the register is intent, the audit is behaviour. Here the behaviour (an export action plus export token NG-EXPORT-77) contradicts the 'read-only' claim, so the Northgate dependency is wider than documented. The Callisto row is a deliberate information gap — an elevated-access contractor with no review since 2024 cannot be vouched for today, which is a finding, not a formality. The VaultBridge drop matches its registered scope exactly, so it is realistic but irrelevant noise for this decision: expected, ticketed activity is not evidence of compromise. The wrong statements fail for opposite reasons — one sees compromise where the evidence shows conformity, the other sees accuracy where the evidence shows contradiction.<\/p><p><b>Study this:<\/b> T1590.003 exists because second and third parties hold connected, potentially elevated access — your first control is a register that matches behaviour.<\/p>","options":[{"t":"Northgate's effective access is broader than the register claims.","correct":true,"why":"The audit shows an export action and a named export token (NG-EXPORT-77); 'read-only' is contradicted by behaviour."},{"t":"The VaultBridge transfer is proof the custody link is compromised.","correct":false,"why":"Nothing deviates from the approved pattern; alarm is not evidence."},{"t":"The Callisto row is stale — no current review is on file.","correct":true,"why":"Last review 2024-03 against a 2026 cycle means the elevated-access claim is unverified today."},{"t":"The register can be signed off to the board as accurate.","correct":false,"why":"One row is contradicted by the audit and one row is stale — signing it as-is would misstate the control environment."},{"t":"The VaultBridge drop is a trust dependency, but its activity matches the registered scope.","correct":true,"why":"A nightly 02:00 SFTP under a ticket, matching scope, is exactly what a documented dependency looks like."}]},{"id":"e02","type":"match","title":"Attacker view: four moves, four techniques","scenario":"<p>Viktor Petrov (threat intelligence) is building the board pack. An Aurora accounts-payable clerk forwarded a 'vendor onboarding questionnaire' that arrived from a domain one letter off Northgate's real one. Separately, the same mailbox holds a pentest-style note describing how to map Active Directory forest trusts as a recon step before choosing an entry path — the methodology reference behind T1590.003 (García 2019, fictionalised here).<\/p><p>Viktor's instruction from the CISO: 'One line per behaviour: name the technique.' The behaviours below are the adversary's, seen from their side.<\/p>","artefacts":[{"label":"ATT&CK excerpt — T1590.003","kind":"attack","body":"Sub-technique of T1590 (Gather Victim Network Information).\nBehaviour: gather information about network trust dependencies — second or third-party organisations/domains (e.g. managed service providers (MSPs), contractors) with connected and potentially elevated access.\nCollection: direct elicitation via Phishing for Information (T1598); exposed via accessible data sets, e.g. Search Open Technical Databases (T1596).\nEnables initial access via Trusted Relationship (T1199)."},{"label":"Recovered questionnaire (excerpt)","kind":"code","body":"Q1. Which provider operates your security monitoring?\nQ2. Which vendors hold standing administrator accounts?\nQ3. Who connects to your environment nightly, and from where?\nQ4. Do you share a forest trust with any partner domain?\n— No links, no attachments. Questions only."},{"label":"Viktor — working notes","kind":"chat","body":["V. Petrov: Q1-Q4 are all about who we trust. Nothing touches our network.","V. Petrov: CISO wants the classification before 12:00.","V. Petrov: (canteen: new soup menu Monday — ignore)"]},{"label":"Mail triage","kind":"table","head":["Field","Value"],"rows":[["Sender domain","northgate-onboarding[.]example (registered 9 days ago)"],["Registrar privacy","Proxy — owner unknown (information gap)"],["Attachments / links","None"],["Recipients","3 finance staff, 1 SOC apprentice"]]}],"question":"Viktor needs the mapping for the board pack: match each adversary behaviour to the technique it represents.","hint":"Constraint: every move so far is questions and public records — no artefact shows traffic against Aurora or anything purchased.","explanation":"<p>Each behaviour sits at a different point of the same chain. Eliciting trust facts from people is Phishing for Information (T1598); reading provider relationships from open databases is Search Open Technical Databases (T1596); the map itself is Network Trust Dependencies (T1590.003); and entering later through the partner's channel is Trusted Relationship (T1199). The decoy, Acquire Infrastructure (T1583), belongs to establishing operational resources — a later stage with no evidence here. The genuinely conflicting detail is that some questionnaire answers could also be found in public data; the conflict resolves on who holds the fact: standing admin vendors and forest trusts live only with Aurora's people, so the behaviour in front of you is elicitation.<\/p><p><b>Study this:<\/b> the chain elicit/read → map trust dependencies → enter via T1199 is the spine of this sub-technique.<\/p>","pairs":[{"l":"Emails finance staff posing as an MSSP onboarding desk and asks which vendors hold admin rights","r":"Phishing for Information (T1598)","why":"Asking people to disclose trust facts is elicitation — the primary collection route for this sub-technique."},{"l":"Reads public registration and routing records to learn which provider runs Aurora's monitoring","r":"Search Open Technical Databases (T1596)","why":"Open technical data sets expose provider relationships without ever touching the victim."},{"l":"Plans to arrive through the MSSP's management channel instead of attacking Aurora's edge","r":"Trusted Relationship (T1199)","why":"Entering through a partner's legitimate access is the initial-access stage this recon feeds."},{"l":"Builds a map of which partner domains and providers Aurora depends on before picking a path","r":"Network Trust Dependencies (T1590.003)","why":"That mapping is this sub-technique: inventorying connected parties with elevated reach."}],"decoys":[{"r":"Acquire Infrastructure (T1583)","why":"Buying or renting attacker-owned servers is establishing operational resources — nothing here shows the adversary acquiring anything."}]},{"id":"e03","type":"blank","title":"Finish the escalation note (word bank)","scenario":"<p>15:40. Iman must file the third-party risk escalation before the 16:00 risk call. The template is strict: four gaps, one word each, and the note is read verbatim into the minutes. Northgate's account manager, Petra Lindholm, has already messaged that 'this is routine quarterly access, nothing to escalate' — their own audit extract suggests otherwise, and the note must stay factual either way.<\/p>","artefacts":[{"label":"Draft note — gaps marked [1]-[4]","kind":"code","body":"TRUST-DEPENDENCY ESCALATION (draft v3)\nNorthgate's shared-tenant account is a classic [1] dependency:\na second party with connected, elevated reach into our alert estate.\nIf abused, the realistic entry path is Trusted Relationship ([2]) —\nnot a direct hit on our edge.\nThe recovered questionnaire is best filed under\nPhishing for Information ([3]).\nPrevention before compromise is limited to mitigation ([4]) thinking:\nshrink what outsiders can learn about who we trust."},{"label":"Evidence summary","kind":"table","head":["Item","Status"],"rows":[["Tenant audit extract","Shows export role + token NG-EXPORT-77"],["Questionnaire reply","Recovered from finance mailbox"],["Northgate session records","Requested in writing 14:20 — not yet provided"],["Northgate staff roster","Not provided (information gap)"]]},{"label":"Northgate — account channel","kind":"chat","body":["P. Lindholm: This is routine quarterly access, nothing to escalate.","P. Lindholm: We are ISO 27001 certified, for the record.","Iman Khalil: Noted. Your session records are still outstanding.","P. Lindholm: Legal will respond in due course."]},{"label":"CoreSight platform health","kind":"table","head":["Check","Result"],"rows":[["Dashboards","All green"],["Ingest lag","2 min"],["Disk","41% used"]]}],"question":"Close the four gaps in the note with the bank — the risk call reads it verbatim.","hint":"Constraint: the note classifies what was observed so far — no artefact shows any scan traffic against Aurora, so the scanning technique has no place in it.","explanation":"<p>The note must classify, in order: the dependency class (trust — a second party with connected, elevated reach), the entry path (T1199 Trusted Relationship), the collection route (T1598 Phishing for Information), and the mitigation mindset (M1056 Pre-compromise — you cannot stop someone reading your public posture, but you can shrink it). T1595 (Active Scanning) is the distractor: nothing in the evidence shows packets against Aurora, and the ATT&CK page names elicitation, not scanning, as this sub-technique's primary collection. Petra's 'routine' claim is a conflict to be resolved with their session records, not with the note's wording — and the missing staff roster is an information gap the note correctly leaves open.<\/p><p><b>Study this:<\/b> dependency → entry → collection → mitigation is the four-part sentence every trust-dependency escalation should produce.<\/p>","blanks":[{"label":"[1] Dependency class","accept":["trust","trusted"],"why":"A connected second party with elevated reach is a trust dependency — the exact object of T1590.003."},{"label":"[2] Entry technique ID","accept":["t1199","1199"],"why":"Trusted Relationship is T1199: entering through a partner's legitimate access."},{"label":"[3] Collection technique ID","accept":["t1598","1598"],"why":"Phishing for Information is T1598 — direct elicitation, the primary collection route here."},{"label":"[4] Mitigation ID","accept":["m1056","1056","pre-compromise","precompromise","pre compromise"],"why":"M1056 Pre-compromise is the mapped mitigation: reduce what outsiders can learn."}],"bank":["trust","T1199","T1598","M1056","T1595"]},{"id":"e04","type":"steps","title":"03:44 export: routine sync or worse?","scenario":"<p>03:52, Saturday. CoreSight shows the MSSP shared account svc-northgate authenticating at 03:41 from the MSSP jump host (the normal pattern) — and then a second session at 03:44 from 198[.]51[.]100[.]77, a consumer VPN exit pool, running an export of the 90-day alert view. Petra Lindholm (Northgate) replies within minutes: 'Our analysts do not work 03:00 shifts. The 03:41 is the scheduled nightly sync. The 03:44 export is not ours.' Her two sentences do not sit together. Ticket #63412 is open, P2, with a board-safe answer wanted by 09:00. You are Iman Khalil; the evidence is still live.<\/p>","artefacts":[{"label":"CoreSight auth + export log (extract)","kind":"logview","body":"2026-02-07T03:41:12Z auth ok user=svc-northgate src=10[.]168[.]20[.]10 role=tenant-admin session=web\n2026-02-07T03:44:57Z auth ok user=svc-northgate src=198[.]51[.]100[.]77 role=tenant-admin session=api\n2026-02-07T03:45:30Z export ok user=svc-northgate view=All-Alerts-90d dst=198[.]51[.]100[.]77 rows=4122\n2026-02-07T04:00:31Z sftp ok user=af-vaultdrop src=192[.]0[.]2[.]31 file=custody-0200.csv\n2026-02-07T04:12:09Z vpn ok user=k.arnarson src=10[.]168[.]10[.]64"},{"label":"Overnight channel","kind":"chat","body":["P. Lindholm: 03:41 is our scheduled nightly sync job.","P. Lindholm: The 03:44 export is not ours — investigating.","E. Marchetti (CISO): One word by 09:00: routine or not?","Iman Khalil: Their two sentences contradict each other. Working on evidence."]},{"label":"Ticket #63412","kind":"table","head":["Field","Value"],"rows":[["Summary","Possible unauthorised export via MSSP shared account"],["Priority","P2 — board answer by 09:00"],["Owner","I. Khalil"],["Northgate change record","None found for last night (gap: their internal records unseen)"]]},{"label":"SkylineVPN exit pool 198[.]51[.]100[.]0/24","kind":"table","head":["Fact","Value"],"rows":[["Pool type","Shared consumer VPN exit"],["Tenant of that IP tonight","Unknown — attribution not yet requested (information gap)"],["Aurora exposure","Callisto laptop AF-CLT-07 uses SkylineVPN (unconfirmed link)"]]}],"question":"Walk Iman's three decisions in order — choose, at each step, the option you could defend on the evidence then available.","hint":"Constraint: every irreversible move (cut, delete, restart) also destroys the live evidence the 09:00 answer depends on.","explanation":"<p>This is the ambiguity discipline. Step 1: preserve before anything else, because every later argument cites what you preserved — a restart, a cut or a delete would each destroy the session state the board answer depends on. Step 2: a shared VPN exit pool proves co-location, not ownership, so origin stays unresolved and each hypothesis gets its own test — Northgate's session records for one, the contractor laptop's egress times for the other; assuming either side is bias, and emailing the VPN provider is a legal process, not an email. Step 3: with the signal still ambiguous, the correct action is to escalate through the third-party risk process and keep read-only watch, because it gathers decisive evidence at zero operational cost. The tempting wrong answers all move irreversibly — and each would trade a recoverable ambiguity for a permanent mistake. When confirmation later arrives (the 'cut decision' exercise), the same actions flip from wrong to justified.<\/p><p><b>Study this:<\/b> ambiguous trust-path signals are resolved by evidence and third-party process — irreversible actions wait for confirmation.<\/p>","steps":[{"question":"It is 03:52 and the evidence is live. What is your first move?","options":[{"t":"Restart CoreSight to clear the odd session and force clean logs","correct":false,"why":"A restart destroys session state and reads as tampering later — you never clean what you are investigating."},{"t":"Take read-only exports of the auth and export records and snapshot the live session list","correct":true,"why":"Preserving behaviour first is what every later decision will be judged against."},{"t":"Accept Petra's 'scheduled sync' line and close the alert","correct":false,"why":"Her own next sentence disowns the 03:44 export; closing on the first half of a contradiction is indefensible."},{"t":"Cut the MSSP VPN immediately to stop the bleeding","correct":false,"why":"Irreversible, halts third-party operations, and destroys the live session you need — premature on one login."}],"advance":"<p>04:05 — exports sealed and hashed. Northgate's status line now reads: the 03:44 export was 'not initiated by our SOC'. Their ticket system shows no change window for last night.<\/p>"},{"question":"The 03:44 exit IP belongs to a shared consumer VPN pool. Which reading wins right now?","options":[{"t":"It is the Callisto contractor's laptop — the pool is shared, so same owner","correct":false,"why":"A shared exit pool is exactly where coincidence lives; you cannot attribute an IP to a person from pool membership."},{"t":"It is Northgate — the account is theirs","correct":false,"why":"Account ownership is not session origin, and their own SOC denies the export; assuming either side is bias."},{"t":"Origin is unresolved — record both hypotheses with the test that would settle each","correct":true,"why":"Conflicting signals are settled by tests (their session records, laptop egress times), not by picking a side."},{"t":"Email SkylineVPN and ask who used the IP last night","correct":false,"why":"A consumer VPN will not disclose customers on a request; that path needs legal process."}],"advance":"<p>06:30 — you log both hypotheses. Northgate sends a partial session list: svc-northgate 'used only from 10[.]168[.]20[.]10 and one IP we do not recognise'. Legal asks what you intend to do about the 4,122 exported rows.<\/p>"},{"question":"The board call is in ten minutes. Which action will you defend?","options":[{"t":"Declare a confirmed MSSP breach and cut the link","correct":false,"why":"The evidence supports suspicion, not confirmation; a cut now is a costly action taken on a hypothesis."},{"t":"Close the alert on Northgate's word","correct":false,"why":"They disowned the export themselves; 'routine' died at 03:45:30 when the rows left the building."},{"t":"Escalate to third-party risk team with the evidence pack and keep read-only watch on svc-northgate","correct":true,"why":"Gathers the decisive records through the proper channel at zero operational cost — the defensible answer while the signal is ambiguous."},{"t":"Delete the svc-northgate account tonight","correct":false,"why":"You would destroy the shared account's history before Northgate can explain it, and blind your own monitoring."}],"advance":"<p>08:55 — third-party risk opens case TPR-2026-118. Overnight, svc-northgate performs no further exports. The board answer stands: 'possible compromise of a trust path, under active third-party review, no operational impact yet'.<\/p>"}]},{"id":"e05","type":"qcm","title":"Classify the elicitation for the insurer","scenario":"<p>Aurora's treasury analyst replies 'here you go' to a questionnaire from northgate-onboarding[.]example — one letter off the real domain. No links, no attachments: only questions. Two of the questions could be answered from public records; two of them cannot. The insurer handling Aurora's cyber policy wants one ATT&amp;CK classification for the activity, in writing, by 12:00. Viktor Petrov has the mail; the CISO has the deadline. The signal to resolve: public-data overlap versus direct elicitation — which technique owns this behaviour?<\/p>","artefacts":[{"label":"ATT&CK excerpt — collection for T1590.003","kind":"attack","body":"Adversaries may collect information about network trust dependencies\nvia direct elicitation (Phishing for Information, T1598) or via\naccessible data sets (e.g. Search Open Technical Databases, T1596).\nElicitation targets facts people hold: vendors with elevated access,\nnightly connectors, shared forests.\nT1598 is collection: the goal is information, not an implant or credentials."},{"label":"The questionnaire (full)","kind":"code","body":"Q1. Which SIEM product do you run?\nQ2. Which vendors hold standing admin accounts in your estate?\nQ3. Who connects nightly, and from where?\nQ4. Does your group share a forest trust with any partner?"},{"label":"Mail triage","kind":"table","head":["Field","Value"],"rows":[["Sender domain","northgate-onboarding[.]example — registered 9 days ago"],["Registrar privacy","Proxy (owner unknown — information gap)"],["Ask","Architecture and trust facts only; no credentials requested"],["Reply status","Treasury analyst answered Q1-Q3 before triage caught it"]]},{"label":"Edge telemetry, same window","kind":"table","head":["Observation","Volume"],"rows":[["Careers-page crawl by generic SEO bot","1,204 hits"],["Marketing webinar signups","312 hits"],["Scans against Aurora edge","0"]]}],"question":"The insurer wants one classification in writing: choose it and be ready to defend it.","hint":"Constraint: the activity is still PRE — nothing touched Aurora's network and no credentials were requested; weigh what was asked, not what ran.","explanation":"<p>The classification that survives scrutiny is Phishing for Information (T1598): the artefact is a set of questions to people about the trust web (standing admin vendors, nightly connectors, forest trusts) from a lookalike domain — elicitation, not a foothold attempt. The public-data overlap is real but does not own the behaviour: T1596 covers facts a database holds, and the decisive questions (Q2-Q4) live only with Aurora's staff, so elicitation dominates. Active Scanning (T1595) fails for absence of traffic — zero scans hit the edge. Spearphishing (T1566) fails because nothing in the mail seeks execution or credentials: it is collection, and the ATT&amp;CK page names elicitation as the primary route for trust dependencies. The reply already sent means the adversary holds three answers — expect the follow-up to arrive through the trusted partner, not the mailbox.<\/p><p><b>Study this:<\/b> for Network Trust Dependencies, questions about your trust web are the signature — classify the ask, not the noise around it.<\/p>","options":[{"t":"Active Scanning (T1595) — a quiet pre-attack probe of the edge","correct":false,"why":"Zero scans against the edge; T1595 needs traffic, and none exists."},{"t":"Phishing for Information (T1598) — direct elicitation of trust-dependency facts","correct":true,"why":"Questions aimed at people about vendors with admin rights, nightly connectors and forest trusts are the signature of the primary collection route for T1590.003."},{"t":"Search Open Technical Databases (T1596) — public records research","correct":false,"why":"Defensible only for Q1-style facts; the ask deliberately reaches for facts no database holds, so elicitation dominates."},{"t":"Spearphishing (T1566) — an initial-access attempt already underway","correct":false,"why":"T1566 seeks a foothold via payload or credential; this mail harvests knowledge only — the foothold would come later, through the trusted partner."}]},{"id":"e06","type":"order","title":"Reconstruct the adversary chain","scenario":"<p>Attacker perspective, board-pack view. Working with two sharing partners, Viktor has assembled five recovered adversary actions against Aurora. Two partners dated the actions independently, and the dates pin the order except for one gap: first contact with the contractor's VPN box was never observed and is inferred from the vendor's abuse notice. The CISO wants 'the chain, one line each' — the order is the argument: every step exists to make the last one possible.<\/p>","artefacts":[{"label":"Recovered actions (unsorted)","kind":"table","head":["Tag","Action","Date anchor"],"rows":[["A","Fake vendor survey elicits trust details from finance staff","12 Feb"],["B","Job post names Northgate as Aurora's MSSP","found 11 Feb"],["C","Scan-archive record confirms Northgate VPN ranges","14 Feb"],["D","Abuse notice: contractor's VPN box taken over","16 Feb"],["E","Entry attempt through the contractor's trusted link","17 Feb"]]},{"label":"ATT&CK excerpt — T1199","kind":"attack","body":"Trusted Relationship (T1199): adversaries may breach or otherwise gain\naccess to the target through trusted third parties — vendors,\ncontractors, partners — by compromising their accounts or infrastructure.\nThe quality of this path depends on recon like T1590.003:\nknowing who the target trusts."},{"label":"Aurora edge, same window (noise + gap)","kind":"logview","body":"2026-02-13T02:10:44Z GET /careers ua=GenericSEOBot/1.1 (untargeted crawler — noise)\n2026-02-15T23:58:02Z web GET /login ua=Mozilla (normal traffic)\n(gap: no telemetry exists for the contractor VPN box — it is outside Aurora's visibility)"},{"label":"CISO + COO","kind":"chat","body":["E. Marchetti: The chain, one line each, for the board.","D. Okafor (COO): Keep it calm — we have settlement Monday.","E. Marchetti: Calm and true. The order is the argument."]}],"question":"The board pack reads the chain as an argument: order the five actions from first to last.","hint":"Constraint: the abuse notice dates the VPN takeover after the survey replies came in — the order is fixed by the dates, and by what each step needs from the one before.","explanation":"<p>The chain follows cost and dependency: the open web first (T1593), because a job post reveals the relationship before any contact; then elicitation to shape the target (T1598); then technical databases to confirm the ranges the trusted path uses (T1596); then compromise of existing trusted infrastructure (T1584 — not T1583, because the adversary reused a box that already carried trust rather than acquiring one); and finally Trusted Relationship (T1199) as the cash-out. The noisy careers-page crawler and the zero-scan edge window make the deeper point: none of this touched Aurora's perimeter, which is exactly why trust recon is hard to see and why the analytic (AN1960) runs hot. The information gap — first contact with the VPN box — is covered by the vendor notice, which is why it sits where the dates put it.<\/p><p><b>Study this:<\/b> every step in a trust-recon chain exists to make the T1199 entry possible; read chains backwards from the entry to understand them.<\/p>","items":["Search Open Websites/Domains (T1593): the job post names Northgate as our MSSP","Phishing for Information (T1598): the fake vendor survey elicits trust details","Search Open Technical Databases (T1596): the scan archive confirms Northgate's VPN ranges","Compromise Infrastructure (T1584): the contractor's VPN box is taken over","Trusted Relationship (T1199): the entry attempt rides the contractor's trusted link"],"itemWhy":["Cheapest source first: open websites reveal the relationship before any contact.","Elicitation shapes the target list — who holds elevated access, who connects nightly.","Technical databases confirm the ranges the trusted path uses.","Operationalising: taking over existing trusted infrastructure beats building your own (that would be T1583).","The payoff: enter as the trusted party — the whole recon effort cashes out here."]},{"id":"e07","type":"dragdrop","title":"Sort the morning's artefacts","scenario":"<p>08:30 stand-up, after the night of the 03:44 export. Iman has six cards and four briefing buckets. The CISO wants 'only what a board needs'; the COO wants nothing dramatised. Two of the six cards are distractors — they look actionable but belong to no bucket in this briefing. Place the four evidence cards correctly; the distractors stay in the bank.<\/p>","artefacts":[{"label":"Overnight CoreSight (extract)","kind":"logview","body":"2026-02-08T02:00:11Z sftp ok user=af-vaultdrop src=192[.]0[.]2[.]31 file=custody-0200.csv\n2026-02-08T03:44:57Z export ok user=svc-northgate view=All-Alerts-90d dst=198[.]51[.]100[.]77\n2026-02-08T01:22:39Z login ok user=marketing src=10[.]168[.]10[.]88 app=designsuite\n2026-02-08T02:10:44Z GET /careers ua=GenericSEOBot/1.1\n2026-02-08T08:02:51Z note: forest-trust mapping note recovered from finance mailbox (see ticket #63447)"},{"label":"Recovered item — pentest note (fictionalised, García-style)","kind":"table","head":["Section","Content"],"rows":[["Phase 2","Enumerate external trusts; map direction; flag standing elevated accounts"],["Phase 3","Prefer paths where the partner logs less than the target"],["Owner","Unknown — sender domain privacy-proxied (information gap)"]]},{"label":"Callisto endpoint inventory","kind":"table","head":["Field","Value"],"rows":[["Status","Requested 12 Feb — not received (information gap)"],["Known host","AF-CLT-07, user m.ferro, SkylineVPN installed"],["Impact","Contractor-laptop hypothesis untestable without it"]]},{"label":"ATT&CK excerpt — T1590.003","kind":"attack","body":"Network Trust Dependencies: information about second or third-party\norganisations with connected, potentially elevated access.\nRelevant to planning initial access via Trusted Relationship (T1199)."}],"question":"Place each of the four evidence cards in its bucket — leave the two distractors in the bank.","hint":"Constraint: only four of the six cards describe evidence you actually hold — one is an action and one is untargeted noise duplicating a bucket.","explanation":"<p>The four buckets exist because boards misread mixed evidence. The forest-trust mapping note recovered from our own mailbox is trust-recon evidence: someone is studying the dependency web. The svc-northgate export from an origin Northgate's inventory cannot explain is the possible compromised-trust signal — the reason the third-party case is open. The custody drop matches its ticket exactly and stays out of the briefing no matter how alarming 'external transfer' sounds. The missing Callisto inventory is the open information gap: without it the contractor-laptop hypothesis cannot be tested, and gaps get chased, not narrated. The distractors fail cleanly: the SEO crawler is untargeted noise (and the noise bucket already holds its better card), and a password rotation is a response decision, not an artefact you brief.<\/p><p><b>Study this:<\/b> separate recon evidence, compromise signals, expected noise and open gaps before you brief — mixing them is how a catering invoice becomes 'a breach'.<\/p>","slots":[{"label":"Trust-recon evidence","accept":"a1","why":"A mapping note recovered from our own mailbox is direct evidence someone studies our trust web."},{"label":"Possible compromised-trust signal","accept":"a2","why":"Shared-account behaviour deviating from the documented pattern is the classic compromised-trust signal."},{"label":"Realistic noise — not briefed","accept":"a3","why":"The custody drop matches its ticket exactly; expected activity is background, not briefing."},{"label":"Open information gap","accept":"a4","why":"Without the Callisto inventory the contractor-laptop hypothesis cannot be tested — chase it, do not guess it."}],"chips":[{"k":"a1","t":"Forest-trust mapping note in the phishing reply","sub":"T1590.003","why":"A trust-mapping methodology note inside a reply to our staff is textbook trust recon."},{"k":"a2","t":"svc-northgate export from an IP outside Northgate's inventory","sub":"T1199 risk","why":"The shared tenant account exporting from an unknown origin is the compromised-trust pattern."},{"k":"a3","t":"Nightly VaultBridge custody SFTP, ticket-approved","sub":"expected","why":"Matches approved scope exactly — realistic but irrelevant for this briefing."},{"k":"a4","t":"Callisto endpoint inventory not delivered","sub":"gap","why":"The missing data blocks the only test of the contractor hypothesis."},{"k":"a5","t":"Careers-page crawler from a generic SEO bot","sub":"noise","why":"Untargeted crawling — noise, but the noise bucket already holds its evidence card; this one is a distractor."},{"k":"a6","t":"Rotate svc-northgate's password tonight","sub":"action","why":"A response action, not an artefact — it belongs in a decision forum, not an evidence briefing."}]},{"id":"e08","type":"terminal","title":"Evidence that survives scrutiny","scenario":"<p>17:40, Friday. Legal counsel R. Whitcombe needs <b>evidence that survives regulatory scrutiny<\/b>: a timestamped capture of which third-party sessions are live on AF-JUMP01 right now, before any containment, under change freeze #63412. Northgate is on the bridge demanding you 'flush the session table — our ISO 27001 auditor is on site Monday'. The COO reminds you settlement runs overnight. Legal's standing order: <b>capture read-only, or run nothing and say so<\/b>. You have root on AF-JUMP01; standard tools only. Pick the tool, the options and the target that satisfy the evidence standard — and nothing that changes state.<\/p>","artefacts":[{"label":"Bridge recording (excerpt)","kind":"chat","body":["R. Whitcombe (legal): I need the 4-tuple, the owning process, timestamps — and zero state changes.","P. Lindholm (Northgate): Flush your session table. We are ISO 27001 certified; this is our recommendation.","D. Okafor (COO): Settlement must run. Whatever you do, do not touch the settlement path.","R. Whitcombe (legal): If you cannot capture read-only, run nothing and tell me."]},{"label":"Evidence standard for the regulator","kind":"table","head":["Requirement","Met by"],"rows":[["Live session 4-tuple","Socket table, numeric output"],["Owning process","Process attribution flag"],["No state change","Read-only tool only"],["Timestamped","Console clock + ticket #63412"]]},{"label":"CoreSight — last known third-party sessions","kind":"logview","body":"2026-02-09T17:31:04Z session established svc-northgate src=10[.]168[.]20[.]10 (MSSP jump)\n2026-02-09T17:38:47Z session established svc-bridge src=198[.]51[.]100[.]77 (unknown origin — gap)\n2026-02-09T17:39:12Z note: Northgate egress IP inventory REFUSED (commercial confidentiality — information gap)"},{"label":"AF-JUMP01 environment","kind":"table","head":["Item","Value"],"rows":[["OS","Linux, kernel 5.15"],["Available","ss, conntrack, nft, tcpdump, nmap (all present)"],["Change freeze","#63412 active"],["Your access","root"]]}],"question":"Legal's order stands: capture the live third-party session evidence now — type the read-only command you will run on AF-JUMP01.","hint":"Constraint: the capture must not change a single byte of kernel session state — any flag that alters, flushes or kills is disqualified by the evidence standard.","explanation":"<p>The command that survives scrutiny is <code>ss -tnp state established<\/code>: read-only by design; -t keeps TCP; -n stays numeric so the capture generates no DNS traffic that could leak the investigation; -p attributes each socket to its owning process; state established narrows output to the live third-party links legal needs. The dangerous near-misses are not exotic: <code>ss -K<\/code> actively kills sockets — it would have destroyed the MSSP and contractor sessions mid-capture, which is precisely what the bridge pressure was pushing toward; <code>conntrack -F<\/code> wipes the kernel's record of every live session. Firewall changes would cut sessions and risk the settlement path; nmap is unauthorised recon against a third party; netstat cannot attribute processes on this build. And 'run nothing' was legal's fallback only if a read-only capture were impossible — it is possible. Petra's ISO 27001 line is the certification fallacy: a certificate is not a capture.<\/p><p><b>Study this:<\/b> under legal hold, the command itself is evidence — read-only, numeric, process-attributed, and never -K.<\/p>","prompt":"iman@af-jump01:~$","banner":"Change freeze #63412 — legal evidence capture — READ-ONLY (simulated shell). Type the command, press Enter, then Check.","elements":[{"label":"uses ss (socket statistics — read-only session audit)","re":"\\bss\\b","why":"ss lists live sockets without touching state — the only tool class that satisfies the legal standard here."},{"label":"limits to established sessions (the live third-party links)","re":"established","why":"Established is where the MSSP and contractor sessions live right now."},{"label":"resolves numerically (-n) so nothing dials out","re":"-n\\b|\\s-tnp\\b","why":"Numeric output avoids DNS lookups that would leak the investigation."},{"label":"shows owning processes (-p) for attribution","re":"-p\\b|\\s-tnp\\b","why":"The owning process is the first thing the regulator asks for."}],"bads":[{"re":"\\bss\\b.*\\s-k\\b","note":"ss -K KILLS the matching sockets — you would tear down the live MSSP and contractor sessions and destroy the exact evidence legal ordered you to preserve.","dangerous":true},{"re":"conntrack\\s+(-f|--flush)","note":"Flushing conntrack wipes the kernel's record of every live session — irreversible evidence destruction on a regulated capture.","dangerous":true},{"re":"\\bnmap\\b","note":"Scanning the MSSP is active recon against a third party — outside your authorisation, not evidence-grade, and it tells their SOC you are looking."},{"re":"\\b(iptables|nft|ufw|firewall-cmd)\\b","note":"Firewall changes mid-capture cut the sessions (evidence gone) and risk the settlement path — containment is for after the capture, under legal sign-off."},{"re":"\\bnetstat\\b","note":"netstat is deprecated on this build and without process attribution shows no owners — the graded standard is ss with -np."},{"re":"\\b(nothing|wait|standby|abort|skip)\\b","note":"'Run nothing' was legal's fallback if a read-only capture were impossible — it is possible; the graded command is the read-only capture itself."}],"canonical":"ss -tnp state established","out":"Netid State  Recv-Q Send-Q Local Address:Port       Peer Address:Port        Process\ntcp   ESTAB 0      0      10[.]168[.]20[.]22:43510 10[.]168[.]20[.]10:443   users:((\"coresight-agent\",pid=1842,fd=9))\ntcp   ESTAB 0      0      10[.]168[.]20[.]22:52144 198[.]51[.]100[.]77:443  users:((\"svc-bridge\",pid=2210,fd=12))\ntcp   ESTAB 0      0      10[.]168[.]20[.]22:22     10[.]168[.]10[.]64:51022 users:((\"sshd\",pid=990,fd=3))"},{"id":"e09","type":"multi","title":"Shared-tenant logs vs personal VPN","scenario":"<p>Defender perspective, 08:50, board call at 09:00. CoreSight's shared-tenant logs show svc-northgate authenticating twice overnight from 198[.]51[.]100[.]77 — a SkylineVPN consumer exit pool. In the same window, Callisto laptop AF-CLT-07 pushed its consultant's personal VPN (SkylineVPN) tunnel through the same exit IP. Northgate says 'not ours'. Northgate has also refused, citing commercial confidentiality, to hand over RADIUS records so far. The CISO will repeat to the board whatever you tell her in the next ten minutes, and the attribution here is genuinely ambiguous: a shared exit pool proves co-location, not ownership.<\/p>","artefacts":[{"label":"CoreSight auth log (overnight)","kind":"logview","body":"2026-02-10T01:12:44Z auth ok user=svc-northgate src=198[.]51[.]100[.]77 session=api\n2026-02-10T01:29:58Z vpn-tunnel up host=AF-CLT-07 user=m.ferro via=198[.]51[.]100[.]77 (SkylineVPN)\n2026-02-10T01:31:09Z auth ok user=svc-northgate src=198[.]51[.]100[.]77 session=api\n2026-02-10T01:31:40Z export ok user=svc-northgate view=Alerts-7d dst=198[.]51[.]100[.]77 rows=611\n2026-02-10T02:00:31Z sftp ok user=af-vaultdrop src=192[.]0[.]2[.]31"},{"label":"AF-CLT-07 (Callisto laptop)","kind":"table","head":["Field","Value"],"rows":[["Owner","Callisto Consulting (contractor, elevated access)"],["VPN client","SkylineVPN (personal account)"],["MDM enrolment","None (information gap)"],["Last audit","Never — first review opened this week"]]},{"label":"The ten minutes","kind":"chat","body":["E. Marchetti (CISO): Board in 10. Give me the two or three things we are doing.","P. Lindholm (Northgate): Not ours. RADIUS records are commercially confidential.","E. Marchetti (CISO): And do not tell me 'they are certified' — I have heard it."]},{"label":"Bandwidth talkers 01:00-02:00","kind":"table","head":["Host","Traffic"],"rows":[["AF-MKTG-03","4K training video — 41 GB"],["AF-PRINT-01","firmware fetch — 0.4 GB"],["AF-CLT-07","2.1 GB (VPN tunnel)"]]}],"question":"The CISO repeats your answer verbatim: select the THREE actions that are defensible on this evidence.","hint":"Constraint: a shared VPN exit pool proves co-location, not ownership — every defensible action tests the ambiguity rather than assuming a side.","explanation":"<p>Three actions survive because each resolves the ambiguity instead of guessing it away: written RADIUS/session records test Northgate's 'not ours' claim with their own data, and the written form creates the audit trail legal will need; timestamp correlation tests whether AF-CLT-07's personal VPN tunnel and the svc-northgate logins share more than a pool; and the third-party risk escalation opens the only channel that can audit a contractor's endpoints. The wrong options share one flaw — they act irreversibly or accept comfort on ambiguous evidence: cutting the link trades operations and evidence for a hypothesis; disabling the account destroys the thing under investigation; and ISO 27001 attests a management system, not last night's sessions. The bandwidth table is realistic noise — the 4K video explains the slow morning link, nothing else, and the absent MDM record is the gap that keeps the contractor hypothesis alive but unproven.<\/p><p><b>Study this:<\/b> when two trust paths share one exit IP, the defensible moves are side-records, correlation and the third-party process — never the plug.<\/p>","options":[{"t":"Cut the MSSP link before the board call","correct":false,"why":"Premature on ambiguous attribution — the costly action on unconfirmed evidence, plus operations halt and evidence loss."},{"t":"Request Northgate's session/RADIUS records for svc-northgate in writing","correct":true,"why":"Their side-records are the authoritative test of 'not ours' — and a written request starts the paper trail legal will need."},{"t":"Disable svc-northgate immediately","correct":false,"why":"Destroys the shared account before Northgate can explain it and blinds your own monitoring."},{"t":"Correlate AF-CLT-07's SkylineVPN egress times against the svc-northgate logins","correct":true,"why":"It tests the shared-exit-IP coincidence instead of assuming it — timestamps either tighten or break the link."},{"t":"Accept Northgate's ISO 27001 as proof the account is fine","correct":false,"why":"Certification attests their management system, not last night's session — the exact comfort the evidence just broke."},{"t":"Escalate to third-party risk team for a formal Callisto endpoint review","correct":true,"why":"The contractor side can only be settled through the third-party risk process; that is what it exists for."}]},{"id":"e10","type":"match","title":"What each dependency hands the adversary","scenario":"<p>Attacker-value view. Viktor's one-pager maps Aurora's dependency web using the recovered pentest-note methodology (García 2019, fictionalised): enumerate external trusts, map their direction, flag standing elevated accounts, and prefer paths where the partner logs less than the target. The CISO demands one line per dependency: <b>'what does it give them?'<\/b> VaultBridge's trust direction is undocumented in the register — that gap stays visible in the pack rather than being smoothed over.<\/p>","artefacts":[{"label":"Pentest-note fragment (recovered, fictionalised)","kind":"code","body":"Phase 2 — enumerate external trusts; map direction (inbound/outbound).\nFlag every account with standing elevated rights.\nPrefer paths where the partner logs LESS than the target.\nValue = reach x visibility x predictability."},{"label":"ATT&CK excerpt — T1590.003","kind":"attack","body":"Network Trust Dependencies: second or third-party organisations/domains\n(e.g. managed service providers (MSPs), contractors) that have connected —\nand potentially elevated — network access.\nUnderstanding these dependencies supports initial access via\nTrusted Relationship (T1199)."},{"label":"Dependency register (extract)","kind":"table","head":["Dependency","Registered value","Direction"],"rows":[["Northgate MSSP shared-tenant account","Read-mostly SIEM eyes + export","inbound to Aurora"],["Callisto elevated account on AF-3RDPARTY","Standing privileged path","inbound"],["VaultBridge nightly custody drop","Predictable 02:00 transfer","outbound"],["VaultBridge trust direction","UNDOCUMENTED (information gap)","—"]]},{"label":"CISO — the ask","kind":"chat","body":["E. Marchetti: One line per dependency: what does it give them?","E. Marchetti: And drop the canteen alert from the pack — it is noise."]}],"question":"For the CISO's one-pager: match each trust dependency to what it actually hands an adversary.","hint":"Constraint: value is measured from the adversary's side — reach, visibility, predictability — never from the vendor's contract value.","explanation":"<p>Each dependency pays the adversary in a different currency. The MSSP shared-tenant account pays in visibility: it sees the whole alert estate and can export from it. The Callisto standing elevated account pays in reach: a privileged path that is already legitimate, already inside, and barely watched. The VaultBridge nightly drop pays in predictability: same time, same content, every night — easy to study, time and hijack. The survey-answering staff pay in all three at once: they hand over the map itself, which is the T1598 lever. The decoy overclaims: no dependency in evidence touches the domain controllers, and a briefing that overclaims once is doubted everywhere. The note's own formula (reach x visibility x predictability) is the scoring rubric, and the undocumented VaultBridge direction is a gap to close, not a licence to guess.<\/p><p><b>Study this:<\/b> rate every trust dependency by reach, visibility and predictability — the three currencies of Trusted Relationship abuse.<\/p>","pairs":[{"l":"Northgate's shared-tenant SIEM account","r":"Wide read on every alert, plus export rights","why":"A shared tenant account sees the defence's whole picture — and can copy it out."},{"l":"Callisto's standing elevated account on AF-3RDPARTY","r":"A ready-made privileged path into treasury systems","why":"Standing elevated access is the ideal ride: legitimate, already inside, weakly watched."},{"l":"VaultBridge's nightly custody file drop","r":"A predictable, high-value external transfer","why":"Fixed schedule and fixed content make it easy to study, time and hijack."},{"l":"Aurora staff answering 'vendor onboarding' surveys","r":"A free elicitation channel for trust facts","why":"People disclose dependency maps when the ask looks routine — the T1598 lever."}],"decoys":[{"r":"Unlimited control of Aurora's domain controllers","why":"No dependency grants that, and nothing in the evidence shows domain-admin compromise — overclaiming is how briefings lose the room."}]},{"id":"e11","type":"blank","title":"Board risk note: four gaps, one bank","scenario":"<p>The board risk note is due. Board chair H. Lindqvist strikes any claim that is not sourced to an artefact. The deputy's draft already says 'Northgate is certified — low risk'; Iman's evidence says otherwise, and the chair has seen the evidence. The detection note in the pack states the hard truth: most trust recon happens outside Aurora's visibility, so the analytic stays noisy and incomplete by design. Complete the four gaps so the note survives the chair.<\/p>","artefacts":[{"label":"Draft note — gaps marked [1]-[4]","kind":"code","body":"BOARD RISK NOTE (draft v2)\nMost of this recon happens outside our visibility, so our own\nanalytic ([1]) will stay noisy and incomplete.\nPrevention is limited to ([2]) thinking: shrink what outsiders\ncan learn about who we trust.\nThe realistic payoff for the adversary is entry through\nTrusted Relationship ([3]) — not a perimeter breach.\nWriting 'Northgate is certified' as the control is the ([4])\nfallacy the evidence just broke."},{"label":"ATT&CK excerpt — M1056","kind":"attack","body":"M1056 Pre-compromise: this technique (T1590.003) cannot be easily\nmitigated with preventive controls, as the behaviour occurs outside\nenterprise defences.\nFocus: minimise the amount and sensitivity of data available\nto external parties."},{"label":"Detection note","kind":"table","head":["Item","Value"],"rows":[["Detection strategy","DET0828 — Detection of Network Trust Dependencies"],["Analytic","AN1960 — high false-positive rate"],["Coverage","PRE-stage recon largely outside victim visibility"],["Register: Northgate entry","Blank — update pending (information gap)"],["Pivot","Watch later-stage signals (e.g. T1199) instead"]]},{"label":"Deputy vs evidence","kind":"chat","body":["Deputy: Write 'certified, low risk' — it calms the board.","Iman Khalil: The evidence contradicts it. The chair has the evidence.","H. Lindqvist (chair): I strike unsourced claims. (Fire drill Thursday — all-staff note stands.)"]}],"question":"Close the four gaps so the note survives the chair — use the bank.","hint":"Constraint: the chair strikes unsourced claims — the note needs IDs and named concepts, and the draft says 'analytic', not 'detection strategy'.","explanation":"<p>The four gaps test whether you can source a board claim to the right artefact. [1] is AN1960 — the analytic — because the sentence says 'analytic'; DET0828 is the detection strategy above it and the bank's near-miss. [2] is M1056 Pre-compromise: prevention before compromise is limited to shrinking what outsiders can learn, exactly as the ATT&amp;CK excerpt says. [3] is T1199: the payoff of trust recon is entering through the trusted party, not breaking the perimeter. [4] is the certification fallacy — the deputy's comfort line asserts a control (a certificate) that does not measure the thing that failed (a shared account's behaviour). T1595-style scanning never appears in the evidence, and the chair's rule makes the deeper point: every claim in a risk note must trace to an artefact, and these artefacts say noisy analytic, limited mitigation, T1199 payoff, and a broken assumption.<\/p><p><b>Study this:<\/b> a trust-dependency risk note stands on what we can see (AN1960's limits), what we can prevent (M1056), how they enter (T1199), and which comforts to delete.<\/p>","blanks":[{"label":"[1] Our analytic","accept":["an1960","1960"],"why":"AN1960 is the trust-dependency analytic; DET0828 is the strategy built on it."},{"label":"[2] Mitigation mindset","accept":["m1056","1056","pre-compromise","precompromise","pre compromise"],"why":"M1056 Pre-compromise: reduce what outsiders can learn, since prevention before compromise is limited."},{"label":"[3] Entry technique ID","accept":["t1199","1199"],"why":"Trusted Relationship is T1199 — the initial-access stage trust recon feeds."},{"label":"[4] The broken comfort","accept":["certification","certificate","certified"],"why":"Certification attests a management system, not the state of your shared accounts."}],"bank":["AN1960","M1056","T1199","certification","DET0828"]},{"id":"e12","type":"steps","title":"The cut decision: cost on the table","scenario":"<p>Monday. The ambiguity broke overnight: Northgate's own session list — sent under complaint — shows svc-northgate active at 03:44 from an IP that appears in no Northgate inventory, and their 'nightly sync' story has no change record behind it. Their security officer, off the record: 'we cannot exclude it either'. Legal: 'then you have your basis'. The catch: overnight settlement (22:00-04:00) runs across a system the MSSP link supports, so cutting the link means a settlement halt. COO D. Okafor wants the night to run; CISO E. Marchetti wants the path closed. Northgate-side forensics are refused — the contract has no audit clause. You are Iman Khalil; the decisions are yours to defend.<\/p>","artefacts":[{"label":"Northgate session list vs their claims","kind":"table","head":["Claim","Record","Conflict"],"rows":[["'Scheduled nightly sync'","No change record for last night","unsourced"],["'Used only from our jump host'","Session list shows 198[.]51[.]100[.]77 at 03:44","contradicted"],["'Not ours'","Their security officer: 'cannot exclude'","retracted"]]},{"label":"Monday morning","kind":"chat","body":["D. Okafor (COO): Settlement runs at 22:00. Find another way.","E. Marchetti (CISO): The path is compromised. Close it.","R. Whitcombe (legal): Confirmed compromise plus no partner forensics — that is your basis.","Facilities: Parking permits expire Friday (renew on the portal)."]},{"label":"CoreSight right now","kind":"logview","body":"2026-02-12T10:02:11Z export ok user=svc-northgate view=Alerts-7d rows=88 dst=198[.]51[.]100[.]77\n2026-02-12T10:22:38Z export ok user=svc-northgate view=Alerts-7d rows=91 dst=198[.]51[.]100[.]77\n2026-02-12T10:24:00Z note: small steady exports every ~20 min — behaviour, not burst (gap: destination side unseen)"},{"label":"Settlement exposure","kind":"table","head":["Window","Load","Manual fallback"],"rows":[["22:00-04:00","1,900 transactions","Manual desk — slow, error-prone, auditable"],["Cost of halt","One night","Recoverable"],["Cost of continued path","Unknown exfil volume","Not recoverable"]]}],"question":"Take the three decisions in order — each one goes to the regulator with your name on it.","hint":"Constraint: the contract has no audit clause for the MSSP side — waiting for their forensics means waiting for evidence that will never arrive.","explanation":"<p>This is where the costly action becomes correct — and where it would have been wrong a day earlier. Step 1: confirmation flips the burden. The conflict resolves on the records, not the relationship: their session list cannot explain their own account, so the path is treated as compromised until Northgate proves otherwise. Step 2: evidence before cost, because a cut without sealed exports is an unexplainable gap in front of the regulator; procurement timelines are not a precondition for closing a confirmed-compromised channel. Step 3: with confirmation plus zero partner-side visibility (no audit clause), the trade-off finally justifies the halt — running 1,900 transactions across a compromised channel to save one night is the unacceptable version of business continuity, and disabling one account treats a channel problem as an account problem. Compare with the earlier ambiguous-night exercise: same actions, opposite verdicts — confirmation is the variable that flips them.<\/p><p><b>Study this:<\/b> suspicion gathers evidence; confirmation justifies cost — and a cut is a channel decision, not an account decision.<\/p>","steps":[{"question":"Monday, 10:30. Which reading of the evidence now wins?","options":[{"t":"Northgate's story stands — scheduled sync, case closed","correct":false,"why":"Their own session list contradicts it and no change record exists; taking the vendor's word over their own data repeats the certification fallacy."},{"t":"Stand down — the shared exit pool means contractor, not MSSP","correct":false,"why":"Pool membership never proved ownership; standing down trades a confirmed-bad pattern for an unproven theory."},{"t":"Treat the MSSP trust path as compromised until Northgate proves otherwise","correct":true,"why":"Their records show activity their inventory cannot explain; the burden of proof now sits with the party that owns the account."}],"advance":"<p>10:47 — you write the finding. Northgate's security officer, off the record: 'we cannot exclude it either'. Legal: 'then you have your basis'.<\/p>"},{"question":"Before any cut, what must already be true?","options":[{"t":"Nothing — contain first, think later","correct":false,"why":"Cutting without preserving hands the regulator an evidence gap nobody can explain."},{"t":"Read-only exports of the full session and export history, sealed under legal hold","correct":true,"why":"The cut is irreversible; the exports are what survive scrutiny — evidence first, then cost."},{"t":"A replacement MSSP contract signed","correct":false,"why":"Desirable, but procurement is not a precondition for closing a confirmed-compromised path; waiting serves the adversary."}],"advance":"<p>17:12 — exports sealed under legal hold LH-2211. svc-northgate is still exporting small views every 20 minutes.<\/p>"},{"question":"21:40. Settlement opens in twenty minutes. Decide.","options":[{"t":"Keep the link up through settlement, cut tomorrow","correct":false,"why":"You would run 1,900 transactions across a confirmed-compromised channel to save one night — the real cost is what crosses the path, not the downtime."},{"t":"Cut the MSSP link now and accept the settlement halt","correct":true,"why":"Confirmed compromise plus zero partner-side visibility flips the trade-off: the halt is the defensible cost, and the manual desk is auditable."},{"t":"Disable svc-northgate only; keep the VPN up","correct":false,"why":"The VPN is the channel; removing one account on a confirmed-compromised path leaves the road open."}],"advance":"<p>21:58 — the link goes down. Settlement fails over to the manual desk: slow, costly, and nothing to explain on top of it. Third-party risk opens the reconstruction.<\/p>"}]},{"id":"e13","type":"qcm","title":"Certified, therefore trusted?","scenario":"<p>Board member H. Lindqvist, assurance statement on the table: <b>'Northgate is ISO 27001 certified and independently audited. Certification is our control. We sign the statement and close the risk.'<\/b> The CISO turns to you with sixty seconds: one recommendation, on the record. The evidence pack from the fortnight — the export at 03:44, the retracted claims, the refused RADIUS records — sits in the same folder as the certificate. The room wants comfort; the artefacts want a decision.<\/p>","artefacts":[{"label":"The sixty seconds","kind":"chat","body":["H. Lindqvist (board): Certification is our control. We sign.","E. Marchetti (CISO): Iman — one recommendation, on the record.","R. Whitcombe (legal): Whatever you advise, it goes in the minutes.","Facilities: Fire drill Thursday; desk 4F move booked (not this meeting)."]},{"label":"Certification vs evidence","kind":"table","head":["Claim","What it actually covers"],"rows":[["ISO 27001 certificate","Northgate's own management system"],["'Independently audited'","That system — not your shared tenant accounts"],["Export at 03:44","Still unexplained by Northgate"],["Independent review of Northgate tenant access","Never performed (information gap)"]]},{"label":"ATT&CK excerpt — M1056 Pre-compromise","kind":"attack","body":"Pre-compromise: cannot be easily mitigated with preventive controls;\nbehaviour occurs outside enterprise defences.\nFocus on minimising the amount and sensitivity of data available to\nexternal parties — and on knowing exactly which external parties\nhold access."},{"label":"Aurora all-staff notices","kind":"table","head":["Notice","Relevance"],"rows":[["Fire drill Thursday","None"],["Office move: desk 4F ready","None"],["Charity 5k signup","None"]]}],"question":"The CISO needs your one recommendation for the board — choose it.","hint":"Constraint: an assurance statement is a claim about evidence, and the evidence on file currently contradicts the claim the board wants to sign.","explanation":"<p>The defensible recommendation is to hold the signature and gather more evidence: order the third-party risk review of Northgate's tenant access that has never been performed, and let certification be one input to it rather than the conclusion. The board's line is the classic best-practice-wrong trap: certification is real and useful, but it attests a management system — it cannot attest that a specific shared account behaved correctly at 03:44. Signing with a promise bolted on still puts a contradicted claim into the minutes over your name; re-cutting the link repeats a costly action that was already taken, adding operational cost and zero information; self-attestation is weaker than the certificate the board already holds, because the interested party grades itself. M1056's logic applies to assurance too: know exactly which external parties hold access and shrink what they can learn — that is a review, not a signature, and deferring the signature costs nothing material today.<\/p><p><b>Study this:<\/b> certification is an input to third-party assurance, never the assurance itself.<\/p>","options":[{"t":"Sign — certification is an independent control and the board is right","correct":false,"why":"The certificate attests Northgate's management system, not the behaviour of your shared accounts — the exact assumption this fortnight's evidence broke."},{"t":"Sign, but add a note promising a future review","correct":false,"why":"A promise is not evidence; the statement would still assert a control the artefacts contradict, in the minutes."},{"t":"Gather more evidence first — order a third-party risk review of Northgate's tenant access before any assurance statement is signed","correct":true,"why":"It is the only answer the evidence supports: certification becomes an input to that review, deferral costs nothing material today, and the minutes record a defensible decision."},{"t":"Cut the Northgate link again today","correct":false,"why":"The cut was already taken and justified on confirmation; re-cutting over a paperwork debate adds operational cost and zero information."},{"t":"Ask Northgate to self-attest in writing","correct":false,"why":"Self-attestation is the interested party grading itself — weaker than the certificate already on the table."}]},{"id":"e14","type":"cloze","title":"Insurer report: three insertions","scenario":"<p>18:00 deadline: Viktor's assessment goes to the cyber insurer, and the insurer reads classifications literally — each gap must carry the exact ATT&amp;CK ID or name, because underwriting prices the chain. The recovered artefacts say: a directed questionnaire to staff, ranges confirmed in a scan archive, a contractor VPN box taken over, then an entry attempt through the trusted link. One signal to resolve: parts of the trust web were also visible in open databases, but the artefact in hand is the questionnaire — the ask decides, not the availability.<\/p>","artefacts":[{"label":"Report draft — gaps marked %0-%2","kind":"code","body":"ASSESSMENT (for underwriting)\nThe adversary profiled Aurora's trust web through %0,\nand intended to cash it in as %1.\nHad prevention been needed before any compromise,\nthe applicable control is %2."},{"label":"ATT&CK excerpt — T1598","kind":"attack","body":"Phishing for Information (T1598): adversaries send phishing messages\nto elicit sensitive information.\nFor network trust dependencies, elicitation is the primary\ncollection route.\nIt is collection behaviour (PRE), not an access attempt."},{"label":"Chain summary","kind":"table","head":["Step","Evidence","Status"],"rows":[["Directed questionnaire to staff","Recovered mail + reply","observed"],["VPN ranges confirmed","Scan-archive record","observed"],["Contractor VPN box taken over","Vendor abuse notice","observed"],["Entry attempt via trusted link","Edge alert 17 Feb","observed"],["Original mail headers","Only partial Received chain retained","information gap"]]},{"label":"CFO mailbox, same week","kind":"table","head":["Mail","Triage"],"rows":[["Youth football club sponsorship request","Genuine — approved"],["Vendor survey (lookalike domain)","Escalated to CTI"]]}],"question":"The insurer reads the assessment literally: insert the three correct classifications.","hint":"Constraint: two gaps are techniques and one is a mitigation — the mitigation gap must name the control ATT&CK actually maps to PRE-stage recon, not the two that map to infrastructure hardening.","explanation":"<p>Gap one is Phishing for Information (T1598): the artefact underwriting this line is a directed questionnaire — the primary collection route for trust dependencies — even though open databases contributed context; the ask, not the availability, decides the classification. Gap two is Trusted Relationship (T1199): the chain's cash-out is entering through the partner, which is what the entry attempt shows; External Remote Services (T1133) would mean hitting Aurora's own services directly, and Valid Accounts (T1078) would need credentials already held. Gap three is M1056 Pre-compromise, the mitigation ATT&amp;CK actually maps to PRE-stage recon — network segmentation and traffic filtering are sensible hygiene, but they are not the control this technique's page names. The insurer prices exactly this chain, which is why literal IDs matter more than elegant prose, and the partial mail-header chain is the gap that keeps the sender attribution honest.<\/p><p><b>Study this:<\/b> assessment language runs collection → entry → mitigation; underwriting depends on the chain being named precisely.<\/p>","template":"Assessment: the adversary profiled Aurora's trust web through %0, and intended to cash it in as %1. Had prevention been needed before any compromise, the applicable control is %2.","choices":[["Active Scanning (T1595)","Phishing for Information (T1598)","Search Open Technical Databases (T1596)"],["Trusted Relationship (T1199)","External Remote Services (T1133)","Valid Accounts (T1078)"],["M1030 Network Segmentation","M1037 Filter Network Traffic","M1056 Pre-compromise"]],"correct":[1,0,2],"why":["The artefact in hand is a directed questionnaire to people — elicitation is the primary route for trust dependencies; the open-database overlap does not own the behaviour.","The whole chain exists to enable entry through the trusted partner — T1199; T1133 is direct remote services and T1078 assumes credentials already held.","M1056 Pre-compromise is the mitigation ATT&CK maps to this PRE-stage recon; segmentation and filtering are good hygiene but not the mapped control."]},{"id":"e15","type":"order","title":"Rank the recovery plan","scenario":"<p>Tuesday, 09:00, after the cut. The MSSP link is down; the manual settlement desk ran overnight — slow, auditable. One contractor session on AF-3RDPARTY is still established and exporting treasury views: contained channel or not, it is the last live anomaly. The CISO wants the plan ranked so the board sees order and cost; the COO wants settlement restored 'properly, today'; legal wants nothing that looks like spoliation. Rank the five plan items as Iman will execute them.<\/p>","artefacts":[{"label":"Tuesday morning","kind":"chat","body":["E. Marchetti (CISO): Order and cost per item. Board at 14:00.","D. Okafor (COO): Settlement properly restored — today.","R. Whitcombe (legal): Nothing that looks like spoliation. Preserve first."]},{"label":"Current state","kind":"logview","body":"2026-02-13T08:55:02Z mssp-link DOWN (cut 21:58, legal hold LH-2211)\n2026-02-13T08:57:40Z session established user=svc-bridge src=198[.]51[.]100[.]77 target=AF-3RDPARTY (still exporting treasury views)\n2026-02-13T09:01:15Z settlement manual-desk: 214/1900 processed overnight\n2026-02-13T09:03:22Z dhcp ok host=AF-COFFEE-01 lease renewed (kitchen IoT — noise)"},{"label":"Cost matrix","kind":"table","head":["Action","Cost","Blocks"],"rows":[["Freeze + preserve","Minimal","nothing"],["Kill contractor session","Contractor impact","their workday"],["Restore via manual desk","Slow, error-prone","board patience"],["Rebuild trust controls","Weeks of work","procurement"],["Tune AN1960 + T1199 pivots","Engineering time","only the next incident"],["(gap) Third-party risk outcome","pending","final report"]]},{"label":"ATT&CK excerpt — pivot note","kind":"attack","body":"AN1960 carries a high false-positive rate, and PRE-stage trust recon\nis largely invisible to the victim.\nPractical consequence: detection work should pivot to later-stage\nsignals (e.g. Trusted Relationship, T1199) rather than chase\nthe recon itself."}],"question":"Rank the five plan items for the board — order them as Iman will execute them.","hint":"Constraint: two items are only defensible after the evidence is sealed, and exactly one item helps only the next incident — not this one.","explanation":"<p>The order follows exposure. Preserve first: legal's spoliation warning makes the freeze non-negotiable, and everything after cites the sealed exports. Contain second: the still-live contractor session is the only adversary presence left, and with the MSSP channel already down this is the cheapest containment window you will get. Restore third: business continuity through the auditable manual desk answers the COO without re-opening the trust path — restoring first would re-open a road while an anomaly is still live. Rebuild fourth: rotations, documented trust directions and closed register gaps remove the foothold class the adversary used — M1056 in practice. Tune last: AN1960's false positives and the T1199 pivots protect the next incident, not this one. Swapping any two trades a live exposure for a comfort: tuning before rebuilding polishes telemetry while the dependency web stays undocumented.<\/p><p><b>Study this:<\/b> incident order is preserve, contain, restore, rebuild, retune — detection work that jumps the queue protects nobody tonight.<\/p>","items":["Freeze third-party access changes and preserve all read-only exports under legal hold","Kill the still-live contractor session on AF-3RDPARTY and rotate its standing account","Restore settlement through the manual desk and give the COO a dated timeline","Rebuild trust controls: rotate shared accounts, document trust directions, close the register gaps","Tune AN1960 thresholds and add T1199 pivot detections for the MSSP link's return"],"itemWhy":["Preservation is first because every later action is judged on what was sealed — and legal flagged spoliation.","The live contractor session is the last adversary presence; contain it while the MSSP channel is already down.","Business continuity through the auditable manual desk removes the COO's pressure without re-opening the trust path.","Rebuilding the dependency web (rotations, documented directions, closed gaps) removes the foothold class — M1056 in practice.","Detection tuning comes last: it improves the next detection, not this incident."]},{"id":"e16","type":"dragdrop","title":"Lessons learned: sort the decisions","scenario":"<p>End-of-incident review. The CISO wants every major decision of the fortnight sorted into four buckets for the lessons-learned pack: what was escalated, what was evidence-gathering, what was a costly action justified on confirmation, and which widely-used best practice turned out to be wrong here. The deputy still argues the certification line; two other proposals from the fortnight never earned their bucket and stay in the bank as distractors. Sort the six cards.<\/p>","artefacts":[{"label":"Decision log (fortnight)","kind":"table","head":["Ref","Decision","Basis"],"rows":[["D1","Written request for Northgate RADIUS/session records","side-records test of 'not ours'"],["D2","Callisto endpoint review routed to third-party risk","only channel that can audit a contractor"],["D3","MSSP link severed 21:58; settlement halt accepted","confirmed compromise, no partner forensics"],["D4","'Certified = trusted' line in board pack","struck by the chair; contradicted by evidence"]]},{"label":"Review room","kind":"chat","body":["E. Marchetti (CISO): Buckets by 17:00. The board reads this pack.","Deputy: I still say certification is a control.","R. Whitcombe (legal): Basis travels with the decision — or it is not in the pack.","Facilities: Desk 4F ready for the office move (not this pack)."]},{"label":"ATT&CK excerpt — M1056","kind":"attack","body":"Pre-compromise: minimise the amount and sensitivity of data\navailable to external parties.\nKnow which external parties hold connected, potentially elevated\naccess — and keep that knowledge current."},{"label":"Pack gaps","kind":"table","head":["Item","Status"],"rows":[["Contract clause 7 (MSSP audit rights)","Missing from file — negotiation list (information gap)"],["VaultBridge trust direction","UNDOCUMENTED — register update due"],["Proposed: cut Callisto same day","No confirmation on contractor side — never enacted"],["Proposed: rotate all staff passwords","Trust-web exposure unaffected — never enacted"]]}],"question":"Sort the four decisions into their buckets for the lessons-learned pack — two distractors stay in the bank.","hint":"Constraint: a costly action only earns its bucket when its evidence basis is stated with it — decisions without a basis are the distractors.","explanation":"<p>The buckets encode the fortnight's four lessons. Escalation: the Callisto review belongs to third-party risk because only that process can audit a contractor's endpoints. Evidence: the written RADIUS request tests the MSSP's claim with their own records — the move that made every later decision defensible. Costly action: the cut accepted a real, dated cost (the settlement halt) and only became defensible on confirmation plus the refused partner forensics — that basis travels with the decision. Wrong best practice: 'certified therefore trusted' is exactly the comfort the evidence broke; it is a reasonable practice elsewhere and wrong here. The distractors fail on basis: cutting Callisto repeats the costly pattern without contractor-side confirmation, and mass password rotation spends the company's goodwill on a control that never touched the trust web — which is also why M1056 points at knowing and shrinking third-party access, not at rotating everything.<\/p><p><b>Study this:<\/b> senior triage is bucket discipline — escalate, gather, act-with-cost, and name the comforts that break.<\/p>","slots":[{"label":"Escalate to third-party risk team","accept":"a2","why":"Auditing a contractor's endpoints is the third-party risk team's mandate — routing it there is the escalation decision."},{"label":"Gather more evidence first","accept":"a1","why":"Written RADIUS/session records test the MSSP's claim with their own data before anything irreversible."},{"label":"Costly action justified on confirmation","accept":"a3","why":"The cut carried a real cost — the settlement halt — and became defensible only once compromise was confirmed and partner forensics refused."},{"label":"Best practice that is wrong here","accept":"a6","why":"'Certified therefore trusted' was the comfort the evidence broke — certification is an input, not the assurance."}],"chips":[{"k":"a1","t":"Request Northgate's RADIUS records in writing","sub":"evidence","why":"It tests 'not ours' with their own records — gather-evidence before action."},{"k":"a2","t":"Route the Callisto endpoint review to third-party risk","sub":"escalation","why":"Contractor endpoints are only auditable through the third-party risk process."},{"k":"a3","t":"Sever the Northgate link — accept the settlement halt","sub":"costly","why":"A real business cost accepted on confirmation: the trade-off done right."},{"k":"a4","t":"Cut the Callisto contract the same day","sub":"distractor","why":"Same bucket as the cut? No — the contractor path was never confirmed; cost without basis is a distractor."},{"k":"a5","t":"Rotate every staff password tonight","sub":"distractor","why":"The exposure was the trust web, not staff credentials — expensive theatre that changes nothing about third-party access."},{"k":"a6","t":"Trust the MSSP because ISO 27001 certified","sub":"fallacy","why":"The certificate attests their management system, not your shared accounts — wrong here, however standard elsewhere."}]}]};
