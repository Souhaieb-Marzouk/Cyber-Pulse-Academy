.cert.fail{background:linear-gradient(160deg,var(--tint-red),var(--tint-orange));border-color:var(--state-incorrect)}
.cert .clogo{font-size:34px}
.cert.pass .clogo{color:var(--state-correct)} .cert.fail .clogo{color:var(--state-incorrect)}
.cert h3{margin:6px 0 4px;font-size:22px;letter-spacing:2px}
.cert.pass h3{color:var(--state-correct)} .cert.fail h3{color:var(--state-incorrect)}
.cert p{margin:4px 0;color:var(--text-secondary);font-size:14px}
.timesum{margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);color:var(--text-secondary);font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 22px}
.hidden{display:none!important}
@media (max-width:640px){
  .matchgrid,.dndarea{grid-template-columns:1fr}
  .topbar-in{gap:6px 10px}
  .blk{padding:13px 14px}
  .feedback{margin:0 14px 16px}
}
@media (prefers-reduced-motion: reduce){
  .progress-fill{transition:none}
  .progress-fill::after{animation:none}
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

<script>
var EXAM = {"meta": {"title": "T1685.001 Disable or Modify Windows Event Log — HARD", "objectId": "T1685.001", "objectName": "Disable or Modify Windows Event Log", "objectType": "Sub-Technique", "tactic": "Defense Impairment (TA0112)", "platform": "Windows", "sevClass": "sev-hard", "sevIcon": "🟠", "sevWord": "HARD", "estimatedMinutes": 60, "timerSeconds": 3600, "passMark": 70, "topicId": "t1685.001", "batch": 3}, "intro": {"learn": "\n<p class=\"lead\">This is the <b>HARD<\/b> exam for <b>T1685.001 — Disable or Modify Windows Event Log<\/b>. The scenario knowledge from the EASY and MEDIUM levels is assumed; here the difficulty comes from <b>discrimination<\/b>: several answers will look right, and at least one option that looks right is wrong <i>in this specific context<\/i>.<\/p>\n<p>The object itself, in plain words: <b>T1685.001<\/b> is a <b>Sub-Technique<\/b> of the MITRE ATT&amp;CK framework. An attacker with enough privileges switches off or changes the <b>Windows Event Log<\/b> — the computer's built-in note-taking — so that defenders lose sight of what happens next. The parent technique is <b>T1685 — Disable or Modify Tools<\/b>, and the goal belongs to the <b>Defense Impairment<\/b> tactic (<b>TA0112<\/b>). Silence is the product: no error, no alarm, just missing events.<\/p>\n<p>HARD-level work on this object looks like a real senior shift. A <b>SOC analyst<\/b> separates <b>authorised maintenance<\/b> from tampering inside the same change window. A <b>detection engineer<\/b> tunes analytic <b>AN0535<\/b> of detection strategy <b>DET0187<\/b> instead of amputating it. An <b>incident responder<\/b> spots an <b>IIS blind spot<\/b> created with <code>appcmd<\/code> while every Windows channel looks healthy, and reconstructs timelines that mirror public ATT&amp;CK procedure examples — <b>C0024<\/b> (AUDITPOL during the SolarWinds intrusion), <b>C0025<\/b> (a disruptive operation that disabled event logging), <b>G0027<\/b> (appcmd against IIS logging), <b>G0059<\/b> (scripts disabling the event log service), <b>C0038<\/b> (deleted events and application logs) and the native tool <b>S0645<\/b> (Wevtutil). A <b>threat hunter<\/b> turns the same commands into estate-wide hunts, a <b>CTI analyst<\/b> briefs the actors behind them, a <b>red teamer<\/b> plans within the constraints, and a <b>GRC analyst<\/b> or <b>control owner<\/b> owns the mitigation checklist the plan depends on.<\/p>\n<p>You will also work both sides of one operation: a red-team plan that must satisfy hard constraints, and the blue-team detection map that answers it. Expect near-miss commands (<code>/e:true<\/code> versus <code>/e:false<\/code>), expected-but-wrong best practices, and at least one moment where the least aggressive action is the correct one. Every Check buys you unlimited feedback time — use it to read why the near-misses were near.<\/p>\n", "keywords": [{"theme": "Near-miss command discrimination", "items": ["<code>wevtutil sl Security<\/code> (reads config) vs <code>/e:true<\/code> (re-enables) vs <code>/e:false<\/code> (disables) vs <code>cl<\/code> (clears)", "<code>auditpol /get<\/code> vs <code>/set<\/code> vs <code>/clear<\/code> vs <code>/backup<\/code>", "<code>sc config eventlog start= demand|disabled<\/code> vs <code>sc query eventlog<\/code> vs <code>sc stop eventlog<\/code>"]}, {"theme": "False positives and authorised maintenance", "items": ["Change tickets, patch windows and GPO baseline refreshes that legitimately touch audit settings", "The two-signal check behind AN0535 tuning: <code>AuthorizedAdminAccounts<\/code> + <code>TimeWindow<\/code>, then verify the channel came back"]}, {"theme": "Real-world procedure examples", "items": ["<b>C0024<\/b> APT29 — AUDITPOL to prevent audit collection · <b>C0025<\/b> — event logging disabled in a disruptive operation", "<b>G0027<\/b> Threat Group-3390 — appcmd.exe against IIS logging · <b>G0059<\/b> Magic Hound — scripts disabling the event log service", "<b>C0038<\/b> HomeLand Justice — deleted events and application logs · <b>S0645<\/b> Wevtutil — the native tool behind many of these commands"]}, {"theme": "Blind spots beyond the Windows channels", "items": ["IIS HTTP logging disabled via <code>appcmd set config /section:httpLogging /dontLog:true<\/code>", "AutoLogger keys under <code>HKLM\\SYSTEM\\CurrentControlSet\\Control\\WMI\\Autologger\\<\/code> — boot-time channel start"]}, {"theme": "Tuning and coverage", "items": ["Allowlisting one service account with a narrow window instead of disabling the analytic", "Which tap sees which artefact: Sysmon, System channel, Security channel, EDR and network sensors"]}, {"theme": "Mitigations applied to a plan", "items": ["<b>M1024<\/b> Restrict Registry Permissions · <b>M1022<\/b> Restrict File Permissions · <b>M1018<\/b> User Account Management · <b>M1047<\/b> Audit"]}], "how": "\n<ul class=\"howlist\">\n<li><b>Goal:<\/b> reach at least <b>70%<\/b>. That is a <span class=\"ok-i\">✓ PASS<\/span>. Below it is a <span class=\"err-i\">✗ FAIL<\/span>, and you can retake the exam.<\/li>\n<li><b>17 exercises at HARD level.<\/b> Expect 2–3 interacting concepts per exercise, near-miss options, artefact sets that must be read together, and traps: one scenario that is alarming but benign, one that looks benign but is not, and one where the least aggressive action is correct. Types: matching pairs, multi-select, log viewers, branching decisions, fill-in plans, drag-and-drop coverage, one terminal command, ordering and a procedure-example map. The blocks <b style=\"color:var(--accent-blue)\">SCENARIO<\/b>, <b style=\"color:var(--accent-amber)\">QUESTION<\/b> and <b style=\"color:var(--accent-green)\">YOUR ANSWER<\/b> never change their order.<\/li>\n<li><b>Timer:<\/b> this exam gives you <b>60 minutes<\/b>. <b>⏸ Pause<\/b> hides the exercise for a real break. <b>✓ Check<\/b> stops the timer automatically for feedback review; it resumes only on <b>Next ▶<\/b>. The header shows which pause is active at all times.<\/li>\n<li><b>Partial credit:<\/b> multi-item exercises use <code>max(0, (H − W) / N)<\/code> per item — wrong picks cancel right picks, so guess-selecting everything scores zero. The terminal command is graded element by element, and dangerous near-misses are flagged as such in the feedback.<\/li>\n<li><b>Hint:<\/b> 💡 costs 10% of that exercise's credit; at HARD it removes one wrong path without naming the answer.<\/li>\n<li><b>Skip:<\/b> ⚠ Skip parks an exercise in a pool you can revisit while time remains; never-answered exercises are excluded from the score.<\/li>\n<li>Press <b>Start<\/b> when ready. Read every option twice — at HARD, the obvious answer is wrong about a third of the time.<\/li>\n<\/ul>\n"}, "exercises": [{"id": "h01", "type": "match", "tag": "Five commands, five near-misses", "summary": "Config-drift review — match each command to what it actually does", "scenario": [{"prose": "Config-drift review, Northbridge Mutual estate. Baseline audit flagged five command lines from the week's Sysmon exports. None is malicious on its own; your job is the precision step every senior does first: say exactly what each command <i>does<\/i>, because two of them differ by a single character and produce opposite effects."}], "question": "Match each command to its actual effect.", "hint": "None of these is malicious; ignore intent. Two rows differ only in the value after /e:, and one flag changes a file, not a setting.", "match": {"left": [{"k": "L1", "t": "wevtutil sl Security /e:true"}, {"k": "L2", "t": "wevtutil sl Security"}, {"k": "L3", "t": "auditpol /get /category:Logon/Logoff"}, {"k": "L4", "t": "sc config eventlog start= demand"}, {"k": "L5", "t": "auditpol /backup /file:C:\\pol.txt"}], "right": [{"k": "R1", "t": "Re-enables the Security channel — a state change, not a read."}, {"k": "R2", "t": "Prints the Security channel's current configuration only."}, {"k": "R3", "t": "Prints the audit settings of one category."}, {"k": "R4", "t": "Sets the EventLog service start type to manual — applies at next boot."}, {"k": "R5", "t": "Saves the current audit policy to a file; changes nothing."}], "pairs": {"L1": "R1", "L2": "R2", "L3": "R3", "L4": "R4", "L5": "R5"}}, "explain": "L1 flips the Security channel <b>on<\/b> — the same command shape an attacker uses with <code>/e:false<\/code>, in reverse; in a drift review it usually means someone repaired or tested a channel. L2 without a value flag is a pure read. L3 scopes <code>auditpol /get<\/code> to one category. L4 changes the service's <i>start type<\/i> to manual — not immediately, but at the next boot, which is why start-type changes are tracked as boot-time risk. L5 exports the policy to a file: read-only, often done before changes. The pairing discipline matters because detection logic keys on exact flags: <code>/e:<\/code> with a value is state-changing, <code>sl<\/code> alone is not, and <code>/backup<\/code> writes a file without touching policy. Getting one flag wrong here means hunting the wrong direction all night.", "study": "Rebuild this table from memory: wevtutil sl/cl with and without /e:, auditpol get/set/clear/backup, sc config/query/stop."}, {"id": "h02", "type": "multi", "tag": "Alarming on Saturday", "summary": "Change window NBM-CHG-2211 — select every artefact that still needs escalation", "scenario": [{"label": "ARTEFACT 1 — Change ticket NBM-CHG-2211 (approved)", "html": "<p>Window: <b>Saturday 06:00–10:00<\/b>. Scope: monthly patching on all servers; <b>audit policy baseline refresh<\/b> applied via GPO by <code>NBM\\svc_baseline<\/code> (may clear and reapply audit settings, may briefly stop and restart the EventLog service).<\/p>"}, {"label": "ARTEFACT 2 — Weekend alert extract", "html": "<div class='codeblock'>04:58  Sysmon 1   <span class='hl-cmd'>auditpol.exe<\/span> <span class='hl-flag'>/set /category:\"Account Logon\" /success:disable<\/span>  User: NBM\\j.daley\n06:12  System 7035 EventLog stopped → started again 06:13 (patch reboot)\n06:31  Security <span class='hl-warn'>1102<\/span> The audit log was cleared. User: NBM\\svc_baseline\n07:02  Sysmon 13  <span class='hl-pth'>Services\\EventLog\\Start<\/span> → 4 on host <span class='hl-err'>NBM-ARCH-09<\/span>\n08:15  Sysmon 1   <span class='hl-cmd'>wevtutil.exe<\/span> <span class='hl-flag'>sl Security /e:true<\/span>  User: NBM\\svc_baseline\n09:40  Security 4624 Logon from jump host NBM-JMP-01 (normal pattern)<\/div>"}, {"prose": "Six artefacts, one approved ticket. The queue lead's rule: the ticket is a shield only for what it actually describes, inside its window. Decide which artefacts survive that shield — and which must still be escalated."}], "question": "Select every artefact that still needs escalation even with the change ticket in mind.", "hint": "Check three things per row: who ran it, whether the ticket names that action, and whether the clock was inside the window.", "multi": {"options": [{"k": "A", "t": "04:58 auditpol /set by j.daley — outside the window, user not in the ticket."}, {"k": "B", "t": "06:12 EventLog stop and start during the patch reboot."}, {"k": "C", "t": "06:31 event 1102 by svc_baseline inside the window."}, {"k": "D", "t": "07:02 Start value set to 4 on NBM-ARCH-09 — host not in the ticket's scope."}, {"k": "E", "t": "08:15 wevtutil sl Security /e:true by svc_baseline."}, {"k": "F", "t": "09:40 jump-host logon matching the normal admin pattern."}], "correct": ["A", "D"]}, "explain": "Two artefacts survive the shield. A: <code>auditpol /set<\/code> silencing Account Logon successes ran at 04:58 — <b>before the window opened<\/b> — by a named user the ticket never mentions; that is exactly the quiet technique T1685.001 uses through the policy layer. D: a <code>Start=4<\/code> write on <b>NBM-ARCH-09<\/b>, an archive server the patch ticket does not cover — a boot-time disable planted where nobody looks. The other four are the trap: the 06:12 stop/start is a patch reboot the ticket describes; the scary-looking <b>1102<\/b> at 06:31 is the ticketed baseline refresh by the ticketed account inside the window (the classic <i>alarming but benign<\/i>); the 08:15 <code>/e:true<\/code> re-enable is consistent with that same refresh finishing; and the 09:40 logon matches the normal pattern. Escalate A and D; annotate B, C, E and F as ticketed.", "study": "Compare the ticket text against each artefact line by line — scope, account, clock."}, {"id": "h03", "type": "qcm", "tag": "Authorised — or close it?", "summary": "DET0187 fired on NBM-DC01 at 02:07; the allowlist says svc_pamrotate at 02:00–02:15", "scenario": [{"label": "ARTEFACT 1 — DET0187 / AN0535 alert", "html": "<div class='codeblock'>02:07  System 7035 EventLog stopped\n02:07  Sysmon 1  <span class='hl-cmd'>sc.exe<\/span> <span class='hl-flag'>config eventlog start= disabled<\/span>  User: NBM\\svc_pamrotate\n02:07  Sysmon 13 <span class='hl-pth'>Services\\EventLog\\Start<\/span> → 4<\/div>"}, {"label": "ARTEFACT 2 — Analytic tuning record", "html": "<p><code>AuthorizedAdminAccounts:<\/code> NBM\\svc_pamrotate<br><code>TimeWindow:<\/code> daily 02:00–02:15 (PAM rotation job)<br><code>ServiceNames:<\/code> EventLog, Sysmon64<\/p>"}, {"prose": "The privileged-access-management (PAM) rotation job legitimately reconfigures services on the domain controller each night. Everything you see sits inside the allowlisted account and window. The queue lead still refuses to auto-close, and wants one reasoned decision."}], "question": "Which decision and justification are correct?", "hint": "Two mutable elements decide here: the account and the clock. One follow-up check remains after both match.", "qcm": {"options": [{"k": "A", "t": "True positive — PAM accounts never legitimately disable the EventLog service; isolate the host now."}, {"k": "B", "t": "Expected — account and window both match the allowlist; verify the channel was restored afterwards."}, {"k": "C", "t": "False positive — disable the analytic for DC01 so the nightly job stops firing."}, {"k": "D", "t": "Raise the alert threshold so single-service changes stop firing anywhere in the estate."}], "correct": "B"}, "explain": "The analytic's design intent is to allow exactly this pattern: the account (<code>svc_pamrotate<\/code>) is on <code>AuthorizedAdminAccounts<\/code>, the clock (02:07) sits inside the 02:00–02:15 <code>TimeWindow<\/code>, and the service is on the <code>ServiceNames<\/code> list. That makes it <i>expected<\/i> — but the decision is not finished until someone verifies the job put everything back: channel enabled, <code>Start<\/code> value restored, service running. A failed rotation that forgets to restore is a blind spot created by the tool you trusted. Option A mis-states the model — allowlisted accounts do legitimately change these settings here. Option C amputates coverage on a healthy rule; a disabled analytic is a gift to the next attacker. Option D blurs the rule for every other host. Tuning means describing reality precisely, not silencing it.", "study": "Read the AN0535 mutable elements again and draft the post-allowlist verification checklist."}, {"id": "h04", "type": "logs", "tag": "The healthy-looking farm", "summary": "NBM-IIS-05 Windows channels look perfect; three weeks of IIS access logs are missing — click the lines that explain why", "scenario": [{"prose": "Forensic review of the claims portal on <b>NBM-IIS-05<\/b> found a three-week attacker dwell. Windows Event Logs look perfectly healthy for the whole period — every channel produced events, no 1102, no 7035 on EventLog. Yet the portal's <b>IIS access logs<\/b> contain nothing for the attacker's requests. The web farm team insists “logging was never touched.” The answer is in the host's Sysmon history below."}], "question": "Click every line that explains why the portal's requests left no IIS logs.", "hint": "The Windows pipes are fine. Ask which <i>other<\/i> tap a command on this host could have closed, and which artefact records that closure.", "logs": {"prompt": "Click every line that explains the missing IIS logs, then press Check.", "lines": [{"h": "<span class='hl-num'>03-14 02:11:04<\/span> Sysmon 1  <span class='hl-cmd'>appcmd.exe<\/span> <span class='hl-flag'>set config \"Default Web Site\" /section:httpLogging /dontLog:true<\/span>  Parent: w3wp.exe"}, {"h": "<span class='hl-num'>03-14 02:11:06<\/span> Sysmon 11 FileCreate  <span class='hl-pth'>C:\\Windows\\System32\\inetsrv\\config\\applicationHost.config<\/span> (IIS configuration written)"}, {"h": "<span class='hl-num'>03-14 02:11:09<\/span> System 7036  The W3SVC service entered the running state."}, {"h": "<span class='hl-num'>03-14 02:14:41<\/span> Security 4688 A new process has been created.  <span class='hl-dim'>cmd.exe<\/span>"}, {"h": "<span class='hl-num'>03-14 02:20:02<\/span> Sysmon 3  Network connection → 203<span class='hl-dim'>[.]<\/span>0<span class='hl-dim'>[.]<\/span>113<span class='hl-dim'>[.]<\/span>7:443 (portal CDN — expected)"}, {"h": "<span class='hl-num'>03-14 02:31:18<\/span> Application 1334 ASP.NET startup event (routine)."}], "needles": [0, 1]}, "explain": "Line 1 is the answer's core: <code>appcmd set config … /section:httpLogging /dontLog:true<\/code> switched off IIS HTTP logging for the site — the exact behaviour ATT&amp;CK records for <b>G0027 (Threat Group-3390)<\/b> under this technique's family: impair the log source that watches you, not necessarily the Windows Event Log. Line 2 is the corroborating artefact: IIS writes such changes into <code>applicationHost.config<\/code>, and Sysmon 11 caught the file write. Everything else is noise: W3SVC running, a routine cmd.exe, the CDN connection, an ASP.NET startup message. The lesson that makes this HARD: Windows Event Log health is <i>not<\/i> proof that telemetry is healthy. When an application produces its own logs, a sophisticated attacker impairs that source instead — and only host-level command and file telemetry (Sysmon/EDR) sees it happen. <b>Attacker view:<\/b> blind the tap that actually records your web traffic. <b>Defender view:<\/b> watch application config stores, not only event channels.", "study": "Inventory every log source on your web hosts — Windows channels plus application logs — and monitor each one's config."}, {"id": "h05", "type": "branch", "tag": "AUDITPOL at 03:00", "summary": "svc_oragent ran auditpol /clear /y — a four-step decision chain in the C0024 pattern", "scenario": [{"prose": "Saturday, 03:04. Work one step at a time; intermediate steps continue the story without revealing answers, and the timer runs until the final Check. The pattern you are walking mirrors the SolarWinds-era tradecraft recorded as <b>C0024<\/b>: AUDITPOL used to prevent audit collection during a live intrusion."}], "question": "Choose the best action at each of the four steps.", "hint": "The account is trusted; the behaviour is not. Trust the behaviour — and keep the hosts powered.", "branch": {"steps": [{"label": "STEP 1 OF 4 — First read of the alert", "scen": [{"label": "EDR detection — NBM-SQL-02, 03:04", "html": "<p><code>auditpol.exe /clear /y<\/code> executed by <code>NBM\\svc_oragent<\/code> (database agent service account, SYSTEM context). No change ticket. Parent process: <code>wscript.exe<\/code>.<\/p>"}], "options": [{"k": "A", "t": "Treat service-account execution of auditpol as high-signal and pull the full parent process chain."}, {"k": "B", "t": "Close it — database agents tune audit settings routinely."}, {"k": "C", "t": "Reboot the host so the policy reloads from GPO."}], "correct": "A"}, {"label": "STEP 2 OF 4 — The chain and the scope", "scen": [{"label": "Process chain", "html": "<p>scheduled task <code>DbHealthHelper<\/code> (created 02:58) → <code>wscript.exe<\/code> → dropped <code>C:\\Windows\\Temp\\dbh.vbs<\/code> → <code>auditpol /clear /y<\/code>. The same task name appears on <b>NBM-SQL-03<\/b> and <b>NBM-FILE-01<\/b>.<\/p>"}], "options": [{"k": "A", "t": "Scope estate-wide by task name and script hash; treat all three hosts as one incident."}, {"k": "B", "t": "Delete the scheduled task on NBM-SQL-02 and close the case."}, {"k": "C", "t": "Rotate the svc_oragent password and close the case."}], "correct": "A"}, {"label": "STEP 3 OF 4 — Immediate action", "scen": [{"label": "Constraints", "html": "<p>Counsel: evidence must survive. Operations: keep services up if safely possible. The three hosts are production systems.<\/p>"}], "options": [{"k": "A", "t": "Network-isolate the three hosts while keeping them powered on."}, {"k": "B", "t": "Power all three off immediately for forensic imaging."}, {"k": "C", "t": "Leave them running and watch for further activity."}], "correct": "A"}, {"label": "STEP 4 OF 4 — What the report must contain", "scen": [{"label": "Reporting time", "html": "<p>Leadership asks what the audit-policy tampering actually cost you in visibility.<\/p>"}], "options": [{"k": "A", "t": "A per-host blind-spot window: when audit recording stopped and when it was restored."}, {"k": "B", "t": "A statement that there was no impact."}, {"k": "C", "t": "Only the count of malware samples removed."}], "correct": "A"}]}, "explain": "Step 1: a SYSTEM service account running <code>auditpol /clear /y<\/code> with no ticket is behaviour, not noise — the trusted identity is the attacker's best disguise, so the first move is the parent chain. Step 2: a scheduled task created two minutes before, with siblings on two more hosts, makes this one incident in three places; deleting one task or rotating one password closes the wrong case. Step 3: isolation with power preserved is the balance point — the attacker loses command and control while volatile evidence (memory, running processes) survives; powering off destroys it, watching does not contain anything. Step 4: the honest cost is the blind-spot window per host. This chain is the C0024 pattern: audit collection disabled <i>before<\/i> the next stage, so report the silence, not just the malware.", "study": "Read the ATT&amp;CK C0024 campaign page and note what audit collection disable enabled next."}, {"id": "h06", "type": "fill", "tag": "Hardening plan — four controls", "summary": "Complete the remediation plan with the four mitigation IDs", "scenario": [{"prose": "After the archive-server finding, the platform team writes the hardening plan. Four blanks, four mitigation IDs — place them by their official names. Two of the decoy IDs in the bank are real ATT&amp;CK mitigations that simply do not belong in these sentences."}], "question": "Complete the hardening plan with the four mitigation IDs.", "hint": "Registry ACLs, .evtx file ACLs, who holds admin, and the baseline that tells you when policy drifted.", "fill": {"sentence": "To close the observed path we will apply ___ (Restrict Registry Permissions) to the EventLog service and Autologger keys, apply ___ (Restrict File Permissions) to the .evtx log files, run quarterly reviews under ___ (User Account Management) for every account with local admin, and continuously compare live audit policy against the baseline we monitor under ___ (Audit).", "bank": ["M1024", "M1022", "M1018", "M1047", "M1021", "M1015", "M1036"], "blanks": [{"accept": ["m1024"], "size": 8}, {"accept": ["m1022"], "size": 8}, {"accept": ["m1018"], "size": 8}, {"accept": ["m1047"], "size": 8}]}, "explain": "The plan needs <b>M1024<\/b> (registry ACLs on <code>Services\\EventLog<\/code> and the Autologger keys — the exact objects the attacker wrote), <b>M1022<\/b> (file ACLs on the .evtx files themselves), <b>M1018<\/b> (reduce and review the accounts that hold local admin, because every method in this exam needed it), and <b>M1047<\/b> (the Audit control — keep auditing enabled and compare live policy against baseline). The decoys are real mitigations for other problems: M1021 restricts web-based content, M1015 hardens Active Directory configuration, and M1036 sets account use policies such as password length and lockout thresholds — none of them stops a local admin tampering with logging on a workstation. Mapping each control to the artefact it blocks is what turns a shopping list into an actual defence.", "study": "Open the ATT&amp;CK mitigation pages for M1024, M1022, M1018 and M1047 and note what each one would have blocked in this scenario."}, {"id": "h07", "type": "dnd", "tag": "Three patterns, six artefacts", "summary": "Sort artefacts into disable-pattern, clear-pattern and authorised-maintenance buckets", "scenario": [{"prose": "Pattern training for the night shift. Three buckets: artefacts that <b>silence recording going forward<\/b> (the disable pattern), artefacts that <b>erase what was already recorded<\/b> (the clear pattern), and artefacts that are <b>authorised maintenance<\/b>. One chip is deliberately ambiguous — decide by what it actually does, not by the word “clear” in it."}], "question": "Drag every artefact into the pattern it belongs to.", "hint": "One chip contains the word clear but silences the future instead of erasing the past. One chip is a GPO refresh inside its window.", "dnd": {"buckets": [{"k": "B1", "t": "Disable pattern — silence going forward"}, {"k": "B2", "t": "Clear pattern — erase the past"}, {"k": "B3", "t": "Authorised maintenance"}], "items": [{"k": "I1", "t": "wevtutil sl Application /e:false", "b": "B1"}, {"k": "I2", "t": "wevtutil cl Security", "b": "B2"}, {"k": "I3", "t": "auditpol /clear /y", "b": "B1"}, {"k": "I4", "t": "Security 1102 — audit log cleared", "b": "B2"}, {"k": "I5", "t": "GPO baseline refresh by svc_baseline, in window", "b": "B3"}, {"k": "I6", "t": "sc config eventlog start= disabled", "b": "B1"}]}, "explain": "I1 turns a channel off — silence going forward (B1). I2 wipes recorded content (B2), and I4 — event 1102 — is not an action at all but the <i>evidence artefact<\/i> a clear leaves behind, so it belongs with the clear pattern. I3 is the ambiguous chip: <code>auditpol /clear /y<\/code> contains the word “clear” but resets audit <i>policy<\/i> — it stops future recording of audited outcomes and deletes nothing from the logs — so it is the disable pattern (B1), exactly as recorded in campaign C0024. I5 is authorised maintenance in its window (B3), and I6 pins the disable across reboots (B1). The pattern split is the operationally useful one: disable patterns are hunted by config monitoring, clear patterns by 1102 and file-system checks — different rules, different data sources.", "study": "Explain to a colleague why auditpol /clear /y sits in the disable bucket despite its name."}, {"id": "h08", "type": "qcm", "tag": "Least aggressive wins", "summary": "One host, one disable, no other IOCs — choose the action that is correct here", "scenario": [{"label": "Situation — 11:20", "html": "<div class='codeblock'>Host:     NBM-WKS-114 (analyst workstation)\nFinding:  Security channel disabled 40 min ago via wevtutil /e:false\nScope:    no other host affected; no other IOC on this host\nContext:  user still working; EDR healthy and in report-only mode\nDemand:   CISO wants minimal disruption and eyes back on the host<\/div>"}, {"prose": "Four proposals are on the table, all technically possible. The CISO asked for the option that is right <i>for this situation<\/i> — not the textbook-maximal one."}], "question": "Which action is correct for this situation?", "hint": "Aggressive moves cost evidence and business time. What is the smallest move that restores your eyes and keeps watching?", "qcm": {"options": [{"k": "A", "t": "Re-enable the channel via EDR live response and raise monitoring on the host."}, {"k": "B", "t": "Isolate the host from the network immediately and take it offline."}, {"k": "C", "t": "Schedule a full reimage of the host for tonight."}, {"k": "D", "t": "Do nothing until the next patch cycle touches the host anyway."}], "correct": "A"}, "explain": "The correct action is the <b>least aggressive one that restores visibility<\/b>: re-enable the channel through the EDR agent you already trust, and raise monitoring to catch the next move. Isolation (B) is defensible in a world with more IOCs — lateral movement, credential theft, a second host — but here it costs the user their work for no containment gain, since nothing else was observed. Reimaging (C) destroys the very evidence you have not collected yet. Waiting (D) hands the attacker an open blind spot. This is the HARD trap shape: the <i>correct<\/i> answer is the one calibrated to observed scope, and the aggressive options are only right in a different world. Calibrate, then act — and keep watching after you act.", "study": "Write your team's calibration criteria for isolate vs restore vs reimage on a single-host finding."}, {"id": "h09", "type": "multi", "tag": "Red side — twenty quiet minutes", "summary": "Dual perspective (1/2): select every method that satisfies all four op constraints", "scenario": [{"prose": "This and the next exercise are the two sides of one authorised operation. <b>Red side:<\/b> operator “V” holds local admin on <b>NBM-SQL-02<\/b> under the signed engagement rules. Objective: impair Security-channel recording for roughly twenty minutes during staging. Hard constraints from the plan: no event <b>1102<\/b>, no reboot, <b>no service-state events<\/b> on EventLog, and everything fully reversible. Select every method that satisfies <i>all four<\/i> constraints."}], "question": "Select every method that satisfies all four constraints.", "hint": "Two constraints kill the loud options outright: one names an event, the other names a class of events. Re-read the plan's words “no service-state events”.", "multi": {"options": [{"k": "A", "t": "wevtutil sl Security /e:false, then revert with /e:true afterwards."}, {"k": "B", "t": "auditpol /set /category:\"Logon/Logoff\" /success:disable, then set it back."}, {"k": "C", "t": "Stop-Service EventLog -Force, then start it again."}, {"k": "D", "t": "wevtutil cl Security, then reload yesterday's backup .evtx."}, {"k": "E", "t": "sc config eventlog start= disabled plus a planned reboot."}], "correct": ["A", "B"]}, "explain": "Two methods survive all four constraints. A flips the channel off and back — no 1102, no reboot, no service event, trivially reversible. B silences one category's success outcomes at the policy layer — equally quiet and reversible. C fails on the plan's own words: stopping the service <i>is<\/i> a service-state change and fires 7035, the loudest possible clue on this exact technique. D fails twice — clearing fires 1102 and destroys history, and no backup reload makes that reversible. E fails on reboot (banned) and on timing: a <code>Start<\/code> change does nothing until the next boot, so it cannot deliver a twenty-minute window at all. <b>Attacker view:<\/b> the quiet methods live in the channel and policy layers, not the service layer. <b>Defender view:<\/b> that is precisely why AN0535 watches command lines and config writes, not only service events.", "study": "Redraft your red-team rules of engagement with the same four constraints and re-derive the method list."}, {"id": "h10", "type": "match", "tag": "Blue side — map each move to its tell", "summary": "Dual perspective (2/2): match each red method to the single best detection anchor", "scenario": [{"prose": "<b>Blue side<\/b> of the same operation. The detection engineering team wants the red team's method list mapped to the <b>single best detection anchor<\/b> for each — the artefact the method cannot avoid leaving. Map four methods."}], "question": "Match each attacker method to its best detection anchor.", "hint": "Ask one question per row: which artefact survives even if every log file is untouched — the process line, the registry write, or the service-state message?", "match": {"left": [{"k": "L1", "t": "wevtutil sl Security /e:false"}, {"k": "L2", "t": "auditpol /set … /success:disable"}, {"k": "L3", "t": "sc config eventlog start= disabled"}, {"k": "L4", "t": "Stop-Service EventLog -Force"}], "right": [{"k": "R1", "t": "System 7035 — the service-state change itself."}, {"k": "R2", "t": "Sysmon 1 — process create with the /e:false flag on the command line."}, {"k": "R3", "t": "Sysmon 13 — the write to Services\\EventLog\\Start."}, {"k": "R4", "t": "Sysmon 1 — process create of auditpol with /set on the command line."}], "pairs": {"L1": "R2", "L2": "R4", "L3": "R3", "L4": "R1"}}, "explain": "L1's tell is the process event with <code>/e:false<\/code> in the command line (R2) — the channel flip leaves no file artefact at all, so the process line is the anchor. L2's tell is auditpol running with <code>/set<\/code> (R4): policy changes are otherwise silent. L3's tell is the registry write to <code>Services\\EventLog\\Start<\/code> (R3) — Sysmon 13 sees the value change regardless of which tool made it. L4's tell is the 7035 service-state message (R1) — the one method that announces itself in the System channel. <b>Defender view:<\/b> four methods, three different anchors — which is why AN0535 pairs the System-channel 7035 leg with Sysmon command-line and registry legs. <b>Attacker view:<\/b> every layer has an unavoidable tell; choosing a method is choosing your tell. Completing both sides of this pair is the dual-perspective core of this exam.", "study": "Map your own telemetry: for each method row, confirm which anchor your estate actually collects."}, {"id": "h11", "type": "qcm", "tag": "Tune, don't amputate", "summary": "AN0535 fires 14×/week on backup maintenance — choose the correct tuning", "scenario": [{"label": "Noise profile — last 8 weeks", "html": "<div class='codeblock'>14 alerts/week: svc_backup stops EventLog and re-enables channels\n          during nightly restore verification (02:00–04:00)\nQueues:   analysts auto-close 100% of them\nRisk:     two real detections were closed in the same queue last month<\/div>"}, {"prose": "The analytic is healthy; its default shape (any admin, any time) simply does not describe this estate. Choose the tuning that keeps coverage and kills the noise — and only the noise."}], "question": "Which tuning is correct?", "hint": "The analytic is healthy; its mutable elements just need to describe reality more precisely. Widening windows and raising thresholds both trade coverage for quiet.", "qcm": {"options": [{"k": "A", "t": "Add svc_backup to AuthorizedAdminAccounts with its own narrow 02:00–04:00 window; keep alerting on everything else."}, {"k": "B", "t": "Disable the analytic — the estate cannot afford the noise."}, {"k": "C", "t": "Raise the global event threshold so small changes stop firing."}, {"k": "D", "t": "Widen the main TimeWindow to 02:00–06:00 to swallow the backup job."}], "correct": "A"}, "explain": "Correct tuning describes the legitimate pattern exactly: <b>one account<\/b>, <b>one narrow window<\/b>, everything else still alerting (A). If <code>svc_backup<\/code> runs outside 02:00–04:00, or another account touches logging at all, the alert still fires — coverage preserved, noise gone. B deletes a working detection because it was badly tuned; after the two real detections closed in that queue, this is indefensible. C raises the bar for every host: the next attacker who makes a <i>small<\/i> number of changes slips under it. D widens a blind period every night for everyone — an attacker who learns the schedule simply works inside it. Tuning is a precision instrument: allowlist the account, narrow the window, verify restoration, alert on everything else.", "study": "Rewrite your DET0187 tuning record with explicit AuthorizedAdminAccounts and TimeWindow values."}, {"id": "h12", "type": "dnd", "tag": "Which tap sees which artefact?", "summary": "Coverage exercise — sort six artefacts by the telemetry that captures them", "scenario": [{"prose": "Coverage review after the IIS finding. Six artefacts, four taps. The point is survival analysis: when one tap dies, which artefacts go dark with it? Sort every chip into the tap that <i>captures<\/i> it."}], "question": "Drag every artefact to the tap that captures it.", "hint": "Command lines and registry writes belong to host telemetry; service messages to System; the clear message to Security; lateral SMB to the wire.", "dnd": {"buckets": [{"k": "B1", "t": "Sysmon (process & registry)"}, {"k": "B2", "t": "System channel"}, {"k": "B3", "t": "Security channel"}, {"k": "B4", "t": "EDR / network sensor"}], "items": [{"k": "I1", "t": "Full sc.exe command line", "b": "B1"}, {"k": "I2", "t": "Sysmon 13 Start-value write", "b": "B1"}, {"k": "I3", "t": "7035 service stopped", "b": "B2"}, {"k": "I4", "t": "EventLog entering stopped state", "b": "B2"}, {"k": "I5", "t": "1102 audit log cleared", "b": "B3"}, {"k": "I6", "t": "SMB session to another host", "b": "B4"}]}, "explain": "I1 and I2 are Sysmon artefacts: the process-create line with full arguments, and the registry SetValue — both survive as long as the Sysmon service runs, even when Windows channels die. I3 and I4 are the same fact from the System channel: a 7035 naming the EventLog service entering the stopped state. I5 is the Security channel's own message — 1102 exists only if Security was alive at the moment of clearing, which is why its absence is information too. I6 is wire-level: an SMB session to another host is visible to network sensors and EDR regardless of any channel. The coverage conclusion: if the Security channel dies, I5 goes dark but I1, I2 and I6 keep flowing — that is the compensating-telemetry argument you make to leadership when asking for Sysmon and network visibility budgets.", "study": "Build the survival matrix: artefact × tap × survives-channel-death? for your own estate."}, {"id": "h13", "type": "term", "tag": "Terminal — prove the state, change nothing", "summary": "Live host NBM-ARCH-09: type the command that proves the EventLog service's current state", "scenario": [{"label": "Environment", "html": "<div class='codeblock'>Host:      NBM-ARCH-09 (Windows Server 2019) — LIVE, not imaged\nShell:     elevated command prompt, working directory C:\\\nPrivilege: local administrator\nEDR:       passive mode — will not block your commands\nIncident:  active; the archive server is a scope target\nRule:      nothing on this host may change before the 14:00 snapshot<\/div>"}, {"prose": "Leadership wants proof of the <b>EventLog service's current state<\/b> before the snapshot, and the incident rule allows reads only. No tool is named for you and no syntax is provided — choose the right tool, the right mode and the right target. Anything that changes service state is a violation."}], "question": "Type the command that proves the EventLog service's current state without changing anything.", "hint": "One built-in tool answers service-state questions. The mode you want begins with 'quer'.", "term": {"prompt": "C:\\>", "solution": "sc query eventlog", "output": "SERVICE_NAME: EventLog\n        TYPE               : 20  WIN32_SHARE_PROCESS\n        STATE              : 4  RUNNING\n                (STOPPABLE, NOT_PAUSABLE, ACCEPTS_SHUTDOWN)\n        WIN32_EXIT_CODE    : 0  (0x0)", "elements": [{"re": "^sc", "t": "the Service Control tool (sc)"}, {"re": " query ", "t": "the read-only query mode"}, {"re": "eventlog", "t": "the EventLog service as the target"}], "nearMiss": [{"re": "sc config", "t": "DANGEROUS — sc config rewrites the service configuration (this is the attacker's own command)", "out": "CONFIG_CHANGED — the service configuration was rewritten. In this incident that is a policy violation."}, {"re": "sc stop", "t": "DANGEROUS — sc stop changes service state (and would blind you right now)", "out": "STOP_PENDING — you just stopped the very service you were sent to verify."}, {"re": "queryex", "t": "close but wrong scope — queryex shows process details, not the clean state proof the report needs", "out": "SERVICE_NAME: EventLog ... (verbose output — not the requested state proof)"}, {"re": "net (start|stop)", "t": "state change — net start/stop alter services instead of reading them", "out": "The requested service has already been started. (state changed — violation)"}]}, "explain": "The canonical command is <code>sc query eventlog<\/code>: <b>sc<\/b> is the Service Control tool, <b>query<\/b> is its read-only mode, and <b>eventlog<\/b> is the target — the output's <code>STATE : 4 RUNNING<\/code> line is the proof the report needs. The near-misses are the teaching point. <code>sc config eventlog start= disabled<\/code> is the attacker's own command — typing it here would be a policy violation even if you never pressed Enter twice. <code>sc stop eventlog<\/code> and <code>net stop eventlog<\/code> change live state and would blind you mid-incident. <code>sc queryex<\/code> is read-only too, but returns verbose process data rather than the clean state proof — on a live host under rules, the precise mode matters. In live-response discipline, the difference between reading a system and changing it is one word; this exercise drills that word.", "study": "Practise the sc verb set: query, queryex, config, stop, start — and label each read or write before using it."}, {"id": "h14", "type": "order", "tag": "Rebuild the timeline", "summary": "Four artefacts from NBM-EDGE-02 — reconstruct the attacker's action order", "scenario": [{"label": "Artefact set — NBM-EDGE-02 (disruptive-operation pattern, cf. C0025)", "html": "<div class='codeblock'>A  01:41  Sysmon 1   net.exe localgroup Administrators EDGE\\support /add\nB  01:47  System 7035   The EventLog service entered the stopped state\nC  01:52  Sysmon 13     Services\\EventLog\\Start → 4\nD  02:03  Sysmon 1      7z.exe a C:\\Windows\\Temp\\stage.7z \\\\NBM-FS-01\\ops$<\/div>"}, {"prose": "The four artefacts are timestamped, but the report needs the <b>action order with its logic<\/b>: which capability came first, and what each step made possible. Order the attacker's actions as a chain."}], "question": "Order the four attacker actions from first to last.", "hint": "A service reconfiguration only matters after a stop; and nothing is staged before access exists.", "order": {"items": [{"k": "T1", "t": "Create the fallback admin account (net localgroup /add)."}, {"k": "T2", "t": "Stop the EventLog service."}, {"k": "T3", "t": "Pin the disable by setting the service Start value to 4."}, {"k": "T4", "t": "Stage tools and data from the file share into an archive."}]}, "explain": "The chain is A → B → C → D. First, persistent access: the new local admin account at 01:41 guarantees re-entry whatever happens next. Second, the blind spot: stopping EventLog at 01:47 silences recording immediately. Third, durability: the <code>Start=4<\/code> write at 01:52 makes the silence survive any restart. Fourth, with visibility gone and access guaranteed, the staging at 02:03 proceeds unobserved. This is the logic recorded in disruptive-operation campaigns such as C0025: impairment is not the goal — it is the <i>enabler<\/i> that buys quiet time for the destructive or preparatory stage. When you reconstruct a timeline, the timestamps give you the order, but the dependency logic (access → silence → durability → action) tells you which artefacts are causes and which are consequences.", "study": "Compare with the C0025 ATT&amp;CK campaign page and identify the equivalent steps in that operation."}, {"id": "h15", "type": "logs", "tag": "Registry stream autopsy", "summary": "Ten Sysmon 13 lines — click every write that impairs how Windows event logging starts or runs", "scenario": [{"prose": "One host's registry-event stream for the night. Most writes are daily churn: time zones, cache sizes, run keys, telemetry settings. Two are not. The question is scoped tightly: writes that change <b>how Windows event logging starts or runs<\/b> — including its boot-time AutoLogger configuration."}], "question": "Click every line that impairs how Windows event logging starts or runs.", "hint": "Two of these writes decide whether logging comes back at boot. The rest are churn — including one that repairs a value, and one that touches a different product's logging.", "logs": {"prompt": "Click every line that impairs Windows event logging, then press Check.", "lines": [{"h": "<span class='hl-num'>23:41:02<\/span> Sysmon 13  SetValue  <span class='hl-pth'>Services\\EventLog\\Start<\/span> → <span class='hl-err'>4<\/span>"}, {"h": "<span class='hl-num'>23:41:19<\/span> Sysmon 13  SetValue  <span class='hl-pth'>Control\\WMI\\Autologger\\EventLog-System\\Start<\/span> → <span class='hl-err'>0<\/span>"}, {"h": "<span class='hl-num'>23:44:55<\/span> Sysmon 13  SetValue  <span class='hl-dim'>Services\\Tcpip\\Parameters\\Interfaces\\LeaseobtainedTime<\/span>"}, {"h": "<span class='hl-num'>23:51:10<\/span> Sysmon 13  SetValue  <span class='hl-dim'>Control\\TimeZoneInformation\\Bias<\/span>"}, {"h": "<span class='hl-num'>00:02:33<\/span> Sysmon 13  SetValue  <span class='hl-dim'>Services\\Spooler\\PrintQueuesCache<\/span>"}, {"h": "<span class='hl-num'>00:07:48<\/span> Sysmon 13  SetValue  <span class='hl-dim'>Software\\Microsoft\\Windows\\CurrentVersion\\Run\\OneDriveStub<\/span>"}, {"h": "<span class='hl-num'>00:12:21<\/span> Sysmon 13  SetValue  Services\\EventLog\\Start → 2  <span class='hl-ok'>User: NBM\\svc_gpo-remediate<\/span> <span class='hl-dim'>(GPO remediation job, ticketed)<\/span>"}, {"h": "<span class='hl-num'>00:15:37<\/span> Sysmon 13  SetValue  <span class='hl-dim'>Control\\WMI\\Autologger\\Diagtrack-Listener\\Start<\/span> → 0"}, {"h": "<span class='hl-num'>00:19:02<\/span> Sysmon 13  SetValue  <span class='hl-dim'>Services\\Sysmon64\\Parameters\\ConfigHash<\/span>"}], "needles": [0, 1]}, "explain": "Line 1 sets the service <code>Start<\/code> value to 4 — disabled at next boot (impairs the service layer). Line 2 sets the AutoLogger <code>EventLog-System<\/code> <code>Start<\/code> to 0 — the channel will no longer start with the system, a subtler boot-time impairment that survives even a service repair (impairs the boot layer). The rest is churn or repair: TCP/IP lease data, time-zone bias, the spooler cache, a OneDrive run stub, Sysmon's own config hash. The Diagtrack AutoLogger write (line 8) disables a <i>telemetry product's<\/i> autologger — not a Windows event channel — which is the deliberate look-alike. And line 7 is the counter-example: <code>svc_gpo-remediate<\/code> restoring <code>Start<\/code> to 2 (automatic) is remediation, not tampering. Reading the full key path, the value <i>and<\/i> the actor is the autopsy skill: two impairments, one repair, one decoy — in one stream.", "study": "List the AutoLogger keys that feed your event channels and baseline their Start values."}, {"id": "h16", "type": "order", "tag": "Evidence first", "summary": "Counsel is involved — order the five steps so the evidence survives scrutiny", "scenario": [{"label": "Situation — NBM-SQL-02, 16:40", "html": "<div class='codeblock'>Finding:   logging disabled for ~5 hours; attacker access confirmed\nLegal:     counsel engaged; 'evidence must survive scrutiny'\nAttacker:  may still have access; credential reuse suspected\nTraps:     two tempting shortcuts destroy evidence or delay containment<\/div>"}, {"prose": "The order you choose is the order the evidence survives. Rank the five steps so that nothing irreversible happens before its time — and so the blind-spot timeline remains reconstructable afterwards."}], "question": "Put the five response steps in the correct order.", "hint": "Legal said the evidence must survive scrutiny. What dies first if you rush — and what dies if you wait forever?", "order": {"items": [{"k": "E1", "t": "Freeze: suspend interactive access, keep the host powered and network-isolated."}, {"k": "E2", "t": "Capture volatile state: live config, service Start values, channel states."}, {"k": "E3", "t": "Copy the .evtx files to the evidence share and hash them."}, {"k": "E4", "t": "Only then re-enable channels and restore the service configuration."}, {"k": "E5", "t": "Hand the reconstructed blind-spot timeline to the IR lead."}]}, 'use strict';
/* ============================ helpers ============================ */
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function norm(s){ return String(s).replace(/\s+/g,' ').trim().toLowerCase(); }
function scoreExercise(H, W, N){ if (N <= 0) return 0; return Math.max(0, (H - W) / N); }
function fmtTime(sec){ sec = Math.max(0, sec); var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }

/* ============================ state ============================ */
var TSTATE = { RUNNING:'RUNNING', PAUSED_MANUAL:'PAUSED_MANUAL', PAUSED_AUTO_CHECK:'PAUSED_AUTO_CHECK', ENDED:'ENDED' };
var S = {
  screen: 'intro', order: [], idx: 0,
  credits: {}, checked: {}, hintUsed: {}, skipped: [],
  mode: 'normal', reviewFrom: null,
  timeRemain: EXAM.meta.timerSeconds, timerState: TSTATE.RUNNING, prevTimerState: null,
  manualSec: 0, autoSec: 0, reported: false,
  rt: {}, handshake: { username:'', country:'', locale:'en' }
};
var ticker = null;

function total(){ return EXAM.exercises.length; }
function cur(){ return EXAM.exercises[S.order[S.idx]]; }
function answeredCount(){ var n = 0; for (var k in S.checked){ if (S.checked[k]) n++; } return n; }
function creditSum(){ var s = 0; for (var k in S.credits){ s += S.credits[k]; } return s; }

/* ============================ timer FSM ============================ */
function setTimerState(st){
  S.prevTimerState = S.timerState; S.timerState = st; renderTimer();
}
function resumeTimer(){
  if (S.timerState === TSTATE.ENDED) return;
  setTimerState(S.prevTimerState === TSTATE.PAUSED_AUTO_CHECK ? TSTATE.PAUSED_AUTO_CHECK : TSTATE.RUNNING);
}
function startTicker(){
  if (ticker) return;
  ticker = setInterval(function(){
    if (S.screen === 'intro') return;
    if (S.timerState === TSTATE.RUNNING){
      if (S.timeRemain > 0){ S.timeRemain--; renderTimer(); if (S.timeRemain === 0) timeUp(); }
    } else if (S.timerState === TSTATE.PAUSED_MANUAL){ S.manualSec++; }
    else if (S.timerState === TSTATE.PAUSED_AUTO_CHECK){ S.autoSec++; }
  }, 1000);
}
function timeUp(){
  setTimerState(TSTATE.ENDED);
  if (S.screen === 'exam' && !S.checked[S.idx]) { S.skipped.push(S.idx); }
  finishExam();
}
function renderTimer(){
  var tv = $('#tval'); if (tv) tv.textContent = fmtTime(S.timeRemain);
  var ts = $('#tstate'); if (!ts) return;
  var map = {
    RUNNING: ['▶','RUNNING',''],
    PAUSED_MANUAL: ['⏸','PAUSED — manual (press Resume)','paused'],
    PAUSED_AUTO_CHECK: ['⏸','PAUSED — reviewing feedback (resumes on Next)','paused'],
    ENDED: ['⏹','ENDED','ended']
  };
  var m = map[S.timerState] || map.RUNNING;
  ts.innerHTML = m[0] + ' ' + esc(m[1]);
  ts.className = 'tstate ' + m[2];
  var pb = $('#pausebtn');
  if (pb) pb.textContent = (S.timerState === TSTATE.PAUSED_MANUAL) ? '▶ Resume' : '⏸ Pause';
}
function renderScore(){
  var n = answeredCount(), s = creditSum();
  var pct = n > 0 ? Math.round((s / n) * 100) : 0;
  var e = $('#tbscore');
  if (e) e.innerHTML = 'Score <b>' + s.toFixed(1) + '</b> / ' + n + ' · ' + pct + '%';
}

/* ============================ build runtime ============================ */
/* schema normalisation: accept legacy flat qcm shape (options/correct at top level) */
function normalizeEx(ex){
  if (ex.type === 'qcm' && !ex.qcm && ex.options){
    ex.qcm = { options: ex.options, correct: ex.correct };
  }
  return ex;
}
function buildRt(exRaw){
  var ex = normalizeEx(exRaw);
  var rt = { ex: ex };
  if (ex.type === 'qcm'){ rt.opts = shuffle(ex.qcm.options.map(function(o){ return o.k; })); rt.sel = null; }
  if (ex.type === 'multi'){ rt.opts = shuffle(ex.multi.options.map(function(o){ return o.k; })); rt.sel = []; }
  if (ex.type === 'match'){ rt.right = shuffle(ex.match.right.map(function(r){ return r.k; })); rt.pairs = {}; rt.selL = null; }
  if (ex.type === 'dnd'){ rt.items = shuffle(ex.dnd.items.map(function(i){ return i.k; })); rt.place = {}; rt.selChip = null; }
  if (ex.type === 'fill'){ rt.bank = shuffle(ex.fill.bank.slice()); rt.vals = []; }
  if (ex.type === 'order'){ rt.orderKeys = shuffle(ex.order.items.map(function(i){ return i.k; })); rt.selIdx = null; }
  if (ex.type === 'logs'){ rt.sel = []; }
  if (ex.type === 'term'){ rt.ran = false; rt.lastCmd = ''; rt.lastKind = ''; rt.hist = []; }
  if (ex.type === 'branch'){ rt.step = 0; rt.choices = []; rt.optOrders = ex.branch.steps.map(function(st){ return shuffle(st.options.map(function(o){ return o.k; })); }); }
  return rt;
}

/* ============================ intro ============================ */
function renderIntro(){
  S.screen = 'intro';
  var m = EXAM.meta, I = EXAM.intro;
  var h = '';
  h += '<div class="wrap">';

  h += '<span class="ifact">Exercises in this file: <b>' + total() + '</b></span>';

  I.keywords.forEach(function(kw){
    h += '<div class="kw-theme"><h3>' + esc(kw.theme) + '</h3><ul>';
    kw.items.forEach(function(it){ h += '<li>' + it + '</li>'; });
    h += '</ul></div>';
  });
  h += '</section>';
  h += '<section class="card intro-sec" aria-label="How this exam works"><h2><span aria-hidden="true">🧭</span> How this exam works</h2>' + I.how;
  h += '<button id="startbtn" class="btn primary startbtn">▶ Start the exam</button>';
  h += '</section></div>';
  $('#app').innerHTML = h;
  $('#startbtn').addEventListener('click', startExam);
}

/* ============================ header ============================ */
function renderHeader(){
  var m = EXAM.meta;
  var h = '<div class="topbar-in">';
  h += '<span class="sevbadge ' + m.sevClass + ' tb-sev"><span aria-hidden="true">' + m.sevIcon + '</span> ' + esc(m.sevWord) + '</span>';
  h += '<span class="tb-counter">Exercise <b id="exnum">–</b> of <b>' + total() + '</b></span>';
  h += '<div class="progress" role="progressbar" aria-label="Exam progress" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" id="pfill"></div></div>';
  h += '<span class="tb-timer"><span aria-hidden="true">⏱</span><span class="tval" id="tval">' + fmtTime(S.timeRemain) + '</span><span class="tstate" id="tstate"></span></span>';
  h += '<span class="tb-score" id="tbscore"></span>';
  h += '<button class="skchip hidden" id="skchip" title="Review skipped exercises">⚠ <span id="skcount">0</span> skipped</button>';
  h += '<span class="tb-btns">';
  h += '<button class="tbtn" id="hintbtn">💡 Hint <span class="hl-warn">−10%</span></button>';
  h += '<button class="tbtn" id="pausebtn">⏸ Pause</button>';
  h += '<button class="tbtn warn" id="skipbtn">⚠ Skip</button>';
  h += '</span></div>';
  $('#topbar').innerHTML = h;
  $('#hintbtn').addEventListener('click', onPressHint);
  $('#pausebtn').addEventListener('click', onPressPause);
  $('#skipbtn').addEventListener('click', onPressSkip);
  $('#skchip').addEventListener('click', function(){ if (S.skipped.length) openReview(); });
  renderTimer(); renderScore(); updateSkChip();
}
function updateSkChip(){
  var c = $('#skchip'); if (!c) return;
  $('#skcount').textContent = S.skipped.length;
  c.classList.toggle('hidden', S.skipped.length === 0);
}
function updateProgress(done){
  var p = Math.round(((done ? S.idx + 1 : S.idx) / total()) * 100);
  var f = $('#pfill'); if (f){ f.style.width = p + '%'; f.parentElement.setAttribute('aria-valuenow', p); }
  var n = $('#exnum'); if (n) n.textContent = (S.idx + 1);
}

/* ============================ exam screen ============================ */
function startExam(){
  S.screen = 'exam'; S.mode = 'normal'; S.idx = 0;
  renderHeader();
  renderExercise();
}
function panelHTML(p){
  if (p.prose != null) return '<p>' + p.prose + '</p>';
  return '<div class="artefact"><div class="alabel">' + esc(p.label) + '</div><div class="abody">' + p.html + '</div></div>';
}
function renderExercise(){
  var ex = cur();
  S.rt = buildRt(ex);
  S.screen = 'exam';
  var wrap = $('#app');
  var h = '';
  h += '<div class="wrap"><div id="exzone" class="pauseveil">';
  h += '<div class="exmeta">Exercise <b>' + (S.idx + 1) + ' of ' + total() + '</b> — <b>' + esc(ex.tag) + '</b>' + (S.mode === 'review' ? ' · <span class="skip-i">⚠ answered from the skipped pool</span>' : '') + '</div>';
  h += '<section class="card excard" aria-label="Exercise">';
  h += '<div class="blk blk-scen" id="scenblk">';
  h += '<div class="blk-h"><span class="bicon" aria-hidden="true">📄</span> SCENARIO <button class="tbtn" id="scentoggle" style="margin-left:auto;min-height:30px;padding:3px 10px;font-size:12px" aria-expanded="true">▾ Collapse</button></div>';
  h += '<div class="ssummary hidden" style="font-size:13.5px;color:var(--text-secondary);margin:-4px 0 6px">' + esc(ex.summary) + '</div>';
  h += '<div class="sbody">' + ex.scenario.map(panelHTML).join('') + '</div>';
  h += '</div>';
  h += '<div class="blk blk-q"><div class="blk-h"><span class="bicon" aria-hidden="true">❓</span> QUESTION</div><div class="qtext">' + ex.question + '</div>';
  h += '<div id="hintzone"></div></div>';
  h += '<div class="blk blk-ans"><div class="blk-h"><span class="bicon" aria-hidden="true">✍</span> YOUR ANSWER</div><div id="answ"></div></div>';
  h += '<div id="fbzone"></div>';
  h += '<div class="navrow">';
  h += '<button class="btn primary" id="checkbtn">✓ Check answer</button>';
  h += '<span class="spacer"></span>';
  h += '<button class="btn" id="backrevbtn" style="display:none">↩ Back to review</button>';
  h += '<button class="btn primary" id="nextbtn" disabled>Next ▶</button>';
  h += '</div></section></div></div>';
  wrap.innerHTML = h;

  $('#scentoggle').addEventListener('click', function(){
    var b = $('.sbody', $('#scenblk')), s = $('.ssummary', $('#scenblk')), t = $('#scentoggle');
    var collapsed = b.classList.toggle('hidden');
    s.classList.toggle('hidden', !collapsed);
    t.textContent = collapsed ? '▸ Expand' : '▾ Collapse';
    t.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
  });
  renderWidget(ex, S.rt);
  $('#checkbtn').addEventListener('click', onPressCheck);
  $('#nextbtn').addEventListener('click', onPressNext);
  $('#backrevbtn').addEventListener('click', function(){
    /* Returning to the review screen always resumes the countdown (spec: the
       timer resumes when the learner returns to the review-skipped screen) —
       even if a manual pause was layered on top of the Check auto-pause. */
    if (S.timerState !== TSTATE.ENDED) setTimerState(TSTATE.RUNNING);
    openReview();
  });
  $('#backrevbtn').style.display = (S.mode === 'review') ? '' : 'none';
  $('#skipbtn').disabled = (S.mode === 'review');
  updateSkChip(); updateProgress(S.checked[S.idx]);
  renderScore();
  var nb = $('#nextbtn');
  if (S.idx === total() - 1) nb.innerHTML = 'Final Submit ⏭';
  window.scrollTo(0, 0);
}

/* ============================ widgets ============================ */
function optBtn(key, text, cls){
  return '<button class="qcm-opt ' + (cls || '') + '" data-k="' + esc(key) + '"><span class="okey">' + esc(key) + '.</span><span>' + text + '</span></button>';
}
function renderWidget(ex, rt){
  var z = $('#answ');
  if (ex.type === 'qcm'){
    z.innerHTML = '<div class="msel-hinttext">Choose the one best answer.</div>' + rt.opts.map(function(k){
      var o = ex.qcm.options.filter(function(x){ return x.k === k; })[0];
      return optBtn(o.k, o.t);
    }).join('');
    $$('.qcm-opt', z).forEach(function(b){
      b.addEventListener('click', function(){
        if (S.checked[S.idx]) return;
        rt.sel = b.getAttribute('data-k');
        $$('.qcm-opt', z).forEach(function(x){ x.classList.remove('sel'); });
        b.classList.add('sel');
      });
    });
  }
  else if (ex.type === 'multi'){
    z.innerHTML = '<div class="msel-hinttext">' + esc(ex.multi.hint || 'Select all that apply. Partial credit applies.') + '</div>' + rt.opts.map(function(k){
      var o = ex.multi.options.filter(function(x){ return x.k === k; })[0];
      return optBtn(o.k, o.t);
    }).join('');
    $$('.qcm-opt', z).forEach(function(b){
      b.addEventListener('click', function(){
        if (S.checked[S.idx]) return;
        var k = b.getAttribute('data-k');
        var i = rt.sel.indexOf(k);
        if (i >= 0){ rt.sel.splice(i, 1); b.classList.remove('sel'); }
        else { rt.sel.push(k); b.classList.add('sel'); }
      });
    });
  }
  else if (ex.type === 'match'){
    var h = '<div class="matchgrid"><div class="mcol"><div class="mcoltitle">ITEMS (click one)</div>';
    ex.match.left.forEach(function(l){
      h += '<button class="mitem" data-lk="' + esc(l.k) + '"><span class="ltext">' + l.t + '</span><span class="ptag" data-ptag="' + esc(l.k) + '"></span></button>';
    });
    h += '</div><div class="mcol"><div class="mcoltitle">MATCHES (click to pair)</div>';
    rt.right.forEach(function(rk){
      var r = ex.match.right.filter(function(x){ return x.k === rk; })[0];
      h += '<button class="mitem" data-rk="' + esc(rk) + '">' + r.t + '</button>';
    });
    h += '</div></div><div class="msel-hinttext">Click an item on the left, then its match on the right. Click a paired item to undo.</div>';
    z.innerHTML = h;
    $$('.mitem[data-lk]', z).forEach(function(b){
      b.addEventListener('click', function(){
        if (S.checked[S.idx]) return;
        var lk = b.getAttribute('data-lk');
        if (rt.pairs[lk] != null){ delete rt.pairs[lk]; $('[data-ptag="' + lk + '"]', z).textContent = ''; b.classList.remove('paired'); return; }
        rt.selL = lk;
        $$('.mitem[data-lk]', z).forEach(function(x){ x.classList.remove('sel'); });
        b.classList.add('sel');
      });
    });
    $$('.mitem[data-rk]', z).forEach(function(b){
      b.addEventListener('click', function(){
        if (S.checked[S.idx]) return;
        if (!rt.selL) return;
        var rk = b.getAttribute('data-rk');
        var lk = rt.selL; rt.selL = null;
        rt.pairs[lk] = rk;
        var lb = $('.mitem[data-lk="' + lk + '"]', z);
        lb.classList.remove('sel'); lb.classList.add('paired');
        var rname = ex.match.right.filter(function(x){ return x.k === rk; })[0].t;
        $('[data-ptag="' + lk + '"]', z).textContent = '↔ ' + rname.replace(/<[^>]*>/g, '').slice(0, 34);
      });
    });
  }
  else if (ex.type === 'dnd'){
    var h2 = '<div class="dndarea"><div class="chipbank" id="chipbank">';
