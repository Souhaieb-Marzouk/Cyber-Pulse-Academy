      var it = ex.dnd.items.filter(function(x){ return x.k === ik; })[0];
      if (!rt.place[ik]) h2 += '<button class="chip" draggable="true" data-ik="' + esc(ik) + '">' + it.t + '</button>';
    });
    h2 += '</div>';
    ex.dnd.buckets.forEach(function(bk){
      h2 += '<div class="bucket" data-bk="' + esc(bk.k) + '"><h4>' + bk.t + '</h4><div class="blist"></div></div>';
    });
    h2 += '</div><div class="msel-hinttext">Drag a chip into a zone, or click a chip then click a zone. Click a placed chip to send it back.</div>';
    z.innerHTML = h2;
    var bank = $('#chipbank', z);
    function chipClick(chip){
      if (S.checked[S.idx]) return;
      var ik = chip.getAttribute('data-ik');
      if (rt.place[ik] != null){ // send back
        delete rt.place[ik]; bank.appendChild(chip); chip.classList.remove('sel'); return;
      }
      rt.selChip = ik;
      $$('.chip', z).forEach(function(c){ c.classList.remove('sel'); });
      chip.classList.add('sel');
    }
    $$('.chip', z).forEach(function(c){
      c.addEventListener('click', function(){ chipClick(c); });
      c.addEventListener('dragstart', function(ev){ rt.selChip = c.getAttribute('data-ik'); c.classList.add('dragging'); try { ev.dataTransfer.setData('text/plain', rt.selChip); } catch(e){} });
      c.addEventListener('dragend', function(){ c.classList.remove('dragging'); });
    });
    $$('.bucket', z).forEach(function(bk){
      var bkk = bk.getAttribute('data-bk');
      bk.addEventListener('click', function(ev){
        if (ev.target !== bk && !ev.target.classList.contains('blist') && !ev.target.classList.contains('blist') && ev.target.tagName !== 'H4') return;
        if (S.checked[S.idx] || !rt.selChip) return;
        rt.place[rt.selChip] = bkk;
        var chip = $('.chip[data-ik="' + rt.selChip + '"]', z);
        if (chip){ $('.blist', bk).appendChild(chip); chip.classList.remove('sel'); }
        rt.selChip = null;
      });
      bk.addEventListener('dragover', function(ev){ ev.preventDefault(); bk.classList.add('over'); });
      bk.addEventListener('dragleave', function(){ bk.classList.remove('over'); });
      bk.addEventListener('drop', function(ev){
        ev.preventDefault(); bk.classList.remove('over');
        var ik = rt.selChip; try { ik = ev.dataTransfer.getData('text/plain') || ik; } catch(e){}
        if (!ik || S.checked[S.idx]) return;
        rt.place[ik] = bkk;
        var chip = $('.chip[data-ik="' + ik + '"]', z);
        if (chip){ $('.blist', bk).appendChild(chip); chip.classList.remove('sel', 'dragging'); }
        rt.selChip = null;
      });
    });
  }
  else if (ex.type === 'fill'){
    var parts = ex.fill.sentence.split('___');
    var fh = '<div class="fillin">';
    for (var i = 0; i < parts.length; i++){
      fh += parts[i];
      if (i < parts.length - 1) fh += '<input type="text" data-bi="' + i + '" size="' + (ex.fill.blanks[i].size || 12) + '" autocomplete="off" spellcheck="false" aria-label="Blank ' + (i + 1) + '">';
    }
    fh += '</div><div class="fillbank" id="fillbank"></div><div class="msel-hinttext">Type your answers, or click a word from the bank to place it in the next empty blank.</div>';
    z.innerHTML = fh;
    var fb = $('#fillbank', z);
    rt.bank.forEach(function(w){
      var c = el('button', 'chip', esc(w)); c.setAttribute('data-w', w);
      c.addEventListener('click', function(){
        if (S.checked[S.idx]) return;
        var target = null;
        $$('.fillin input', z).forEach(function(inp){ if (!target && !inp.value) target = inp; });
        if (target){ target.value = w; rt.vals[parseInt(target.getAttribute('data-bi'), 10)] = w; }
      });
      fb.appendChild(c);
    });
    $$('.fillin input', z).forEach(function(inp){
      inp.addEventListener('input', function(){ rt.vals[parseInt(inp.getAttribute('data-bi'), 10)] = inp.value; });
    });
  }
  else if (ex.type === 'order'){
    var oh = '<div class="orderlist" id="orderlist">';
    rt.orderKeys.forEach(function(k, i){
      var it = ex.order.items.filter(function(x){ return x.k === k; })[0];
      oh += '<div class="order-item" draggable="true" data-ok="' + esc(k) + '"><span class="onum">' + (i + 1) + '.</span><span class="otext">' + it.t + '</span><span class="obtns"><button class="obtn" data-mv="up" aria-label="Move up">▲</button><button class="obtn" data-mv="down" aria-label="Move down">▼</button></span></div>';
    });
    oh += '</div><div class="msel-hinttext">Put the steps in the right order: use ▲ ▼ or drag a row onto another row.</div>';
    z.innerHTML = oh;
    var ol = $('#orderlist', z);
    function redraw(){
      $$('.order-item', ol).forEach(function(row, i){
        $('.onum', row).textContent = (i + 1) + '.';
        row.classList.toggle('sel', rt.orderKeys[i] === rt.selIdx);
      });
    }
    $$('.order-item', ol).forEach(function(row){
      row.addEventListener('click', function(ev){
        if (ev.target.classList.contains('obtn') || ev.target.tagName === 'BUTTON') return;
        rt.selIdx = row.getAttribute('data-ok'); redraw();
      });
      row.addEventListener('dragstart', function(ev){ rt.selIdx = row.getAttribute('data-ok'); try { ev.dataTransfer.setData('text/plain', rt.selIdx); } catch(e){} });
      row.addEventListener('dragover', function(ev){ ev.preventDefault(); });
      row.addEventListener('drop', function(ev){
        ev.preventDefault();
        var dragged = rt.selIdx; try { dragged = ev.dataTransfer.getData('text/plain') || dragged; } catch(e){}
        var targetK = row.getAttribute('data-ok');
        if (!dragged || dragged === targetK) return;
        var arr = rt.orderKeys;
        arr.splice(arr.indexOf(dragged), 1);
        arr.splice(arr.indexOf(targetK), 0, dragged);
        redraw();
      });
      $$('.obtn', row).forEach(function(b){
        b.addEventListener('click', function(ev){
          ev.stopPropagation();
          var k = row.getAttribute('data-ok');
          var arr = rt.orderKeys, i = arr.indexOf(k);
          if (b.getAttribute('data-mv') === 'up' && i > 0){ arr.splice(i, 1); arr.splice(i - 1, 0, k); }
          if (b.getAttribute('data-mv') === 'down' && i < arr.length - 1){ arr.splice(i, 1); arr.splice(i + 1, 0, k); }
          redraw();
        });
      });
    });
  }
  else if (ex.type === 'logs'){
    var lh = '<div class="logbox"><div class="logtools"><input type="text" id="logfilter" placeholder="Filter lines…" aria-label="Filter log lines"><span class="logcount" id="logcount"></span></div><div class="loglines" id="loglines">';
    ex.logs.lines.forEach(function(L, i){
      var tag = ex.logs.needles && ex.logs.needles.length ? 'button' : 'div';
      lh += '<' + tag + ' class="logline" data-li="' + i + '"><span class="ln">' + (i + 1) + '</span><span class="lt">' + L.h + '</span>' + (tag === 'button' ? '</' + tag + '>' : '</' + tag + '>');
    });
    lh += '</div></div>';
    if (ex.logs.needles && ex.logs.needles.length) lh += '<div class="msel-hinttext">' + esc(ex.logs.prompt || 'Click every line that matches what the question asks, then press Check. Partial credit applies.') + '</div>';
    z.innerHTML = lh;
    var fl = $('#logfilter', z);
    fl.addEventListener('input', function(){
      var q = norm(fl.value);
      var vis = 0;
      $$('.logline', z).forEach(function(row){
        var hit = !q || norm(row.textContent).indexOf(q) >= 0;
        row.classList.toggle('hidden', !hit);
        if (hit) vis++;
      });
      $('#logcount', z).textContent = vis + ' of ' + ex.logs.lines.length + ' lines';
    });
    $('#logcount', z).textContent = ex.logs.lines.length + ' of ' + ex.logs.lines.length + ' lines';
    $$('.logline', z).forEach(function(row){
      if (row.tagName !== 'BUTTON') return;
      row.addEventListener('click', function(){
        if (S.checked[S.idx]) return;
        var i = parseInt(row.getAttribute('data-li'), 10);
        var p = rt.sel.indexOf(i);
        if (p >= 0){ rt.sel.splice(p, 1); row.classList.remove('picked'); }
        else { rt.sel.push(i); row.classList.add('picked'); }
      });
    });
  }
  else if (ex.type === 'term'){
    var th = '<div class="term"><div class="term-scroll" id="termscroll"><div class="term-line"><span class="tprompt">' + esc(ex.term.prompt) + '</span> ' + esc(ex.term.banner || 'Simulation shell — type the command and press Enter. Nothing here runs for real.') + '</div></div>';
    th += '<div class="term-inputrow"><span class="tprompt">' + esc(ex.term.prompt) + '</span><input type="text" id="termin" autocomplete="off" spellcheck="false" aria-label="Shell input"></div></div>';
    if (ex.term.syntaxNote) th += '<div class="hintpanel" style="margin-top:11px"><div class="htitle">SYNTAX REMINDER</div>' + ex.term.syntaxNote + '</div>';
    z.innerHTML = th;
    var tin = $('#termin', z), sc = $('#termscroll', z);
    function println(html){
      var d = el('div', 'term-line', html);
      sc.appendChild(d); sc.scrollTop = sc.scrollHeight;
    }
    function run(){
      var raw = tin.value;
      if (!norm(raw)) return;
      var n = norm(raw);
      println('<span class="tprompt">' + esc(ex.term.prompt) + '</span> ' + esc(raw));
      rt.ran = true; rt.lastCmd = n;
      if (ex.term.nearMiss){
        for (var i = 0; i < ex.term.nearMiss.length; i++){
          if (new RegExp(ex.term.nearMiss[i].re, 'i').test(n)){
            rt.lastKind = 'near:' + i;
            println('<span class="hl-warn">' + esc(ex.term.nearMiss[i].out) + '</span>');
            tin.value = ''; return;
          }
        }
      }
      var allMatch = ex.term.elements.every(function(e2){ return new RegExp(e2.re, 'i').test(n); });
      if (allMatch){
        rt.lastKind = 'solution';
        println('<span class="hl-ok">' + esc(ex.term.output) + '</span>');
      } else {
        rt.lastKind = 'other';
        println('<span class="hl-dim">command not recognised in this simulation (the real shell would try to run it)</span>');
      }
      tin.value = '';
    }
    tin.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') run(); });
    rt._run = run;
  }
  else if (ex.type === 'branch'){
    renderBranchStep(ex, rt);
  }
}
function renderBranchStep(ex, rt){
  var z = $('#answ');
  var st = ex.branch.steps[rt.step];
  var sh = '<span class="brstep">' + esc(st.label) + '</span>';
  sh += '<div>' + st.scen.map(panelHTML).join('') + '</div>';
  sh += (rt.optOrders[rt.step] || st.options.map(function(o){ return o.k; })).map(function(k){
    var o = st.options.filter(function(x){ return x.k === k; })[0];
    return optBtn(o.k, o.t, rt.choices[rt.step] === o.k ? 'sel' : '');
  }).join('');
  sh += '<div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">';
  if (rt.step < ex.branch.steps.length - 1){
    sh += '<button class="btn" id="stepconfirm">Confirm step ▶</button>';
    sh += '<span class="msel-hinttext">Intermediate steps do not reveal answers and do not pause the timer.</span>';
  } else {
    sh += '<span class="msel-hinttext">Final step — press <b>Check answer</b> below to grade the whole chain. That stops the timer.</span>';
  }
  sh += '</div>';
  z.innerHTML = '<div>' + sh + '</div>';
  $$('.qcm-opt', z).forEach(function(b){
    b.addEventListener('click', function(){
      if (S.checked[S.idx]) return;
      rt.choices[rt.step] = b.getAttribute('data-k');
      $$('.qcm-opt', z).forEach(function(x){ x.classList.remove('sel'); });
      b.classList.add('sel');
    });
  });
  var cb = $('#stepconfirm', z);
  if (cb) cb.addEventListener('click', function(){
    if (rt.choices[rt.step] == null) return;
    var note = el('div', 'recnote', '⏵ Response recorded — the scenario continues (timer still running).');
    z.appendChild(note);
    setTimeout(function(){ rt.step++; renderBranchStep(ex, rt); window.scrollTo(0, 0); }, 550);
  });
  updateCheckEnabled();
}
function updateCheckEnabled(){
  var cb = $('#checkbtn'); if (!cb) return;
  var ex = cur(), rt = S.rt;
  var enabled = true;
  if (ex.type === 'branch') enabled = (rt.step >= ex.branch.steps.length - 1);
  if (S.checked[S.idx]) enabled = false;
  cb.disabled = !enabled;
}

/* ============================ hint / pause / skip / next / check ============================ */
function onPressHint(){
  if (S.screen !== 'exam' || S.checked[S.idx] || S.hintUsed[S.idx]) return;
  S.hintUsed[S.idx] = true;
  var ex = cur();
  $('#hintzone').innerHTML = '<div class="hintpanel" role="status"><div class="htitle">💡 HINT (this exercise will lose 10% of its credit)</div>' + ex.hint + '</div>';
}
function onPressPause(){
  if (S.screen !== 'exam') return;
  if (S.timerState === TSTATE.PAUSED_MANUAL){
    resumeTimer(); hideVeil();
  } else if (S.timerState === TSTATE.RUNNING || S.timerState === TSTATE.PAUSED_AUTO_CHECK){
    setTimerState(TSTATE.PAUSED_MANUAL); showVeil();
  }
  renderTimer();
}
function showVeil(){
  var z = $('#exzone'); if (!z) return;
  if ($('.veil', z)) return;
  var v = el('div', 'veil');
  v.innerHTML = '<div class="vtitle">⏸ PAUSED — manual (press Resume)</div><p>The exercise is hidden while you take a break. The timer is stopped. Press Resume to continue where you were.</p>';
  var b = el('button', 'btn primary', '▶ Resume');
  b.addEventListener('click', onPressPause);
  v.appendChild(b);
  z.appendChild(v);
}
function hideVeil(){ var v = $('.veil'); if (v) v.remove(); }
function onPressSkip(){
  if (S.screen !== 'exam' || S.checked[S.idx] || S.mode === 'review') return;
  S.skipped.push(S.idx);
  updateSkChip();
  if (S.skipped.length && S.idx === total() - 1){ openReview(); return; }
  if (S.idx < total() - 1){ S.idx++; renderExercise(); }
  else openReview();
}
function onPressCheck(){
  if (S.screen !== 'exam' || S.checked[S.idx]) return;
  var ex = cur(), rt = S.rt;
  if (ex.type === 'branch' && rt.step < ex.branch.steps.length - 1) return;
  setTimerState(TSTATE.PAUSED_AUTO_CHECK); /* first action: stop the timer */
  var g = gradeExercise(ex, rt);
  var credit = g.credit;
  if (S.hintUsed[S.idx]) credit = Math.max(0, credit - 0.10);
  S.credits[S.idx] = credit;
  S.checked[S.idx] = true;
  renderFeedback(ex, rt, g, credit);
  updateProgress(true); renderScore(); updateCheckEnabled();
  $('#checkbtn').disabled = true;
  $('#skipbtn').disabled = true;
  $('#nextbtn').disabled = false;
  $('#answ').classList.add('opts-locked');
}
function onPressNext(){
  if (S.screen !== 'exam') return;
  if (S.timerState === TSTATE.PAUSED_AUTO_CHECK) setTimerState(TSTATE.RUNNING);
  if (S.mode === 'review'){ openReview(); return; }
  if (S.idx < total() - 1){ S.idx++; renderExercise(); }
  else if (S.skipped.length){ openReview(); }
  else finishExam();
}

/* ============================ grading ============================ */
function row(icon, cls, word, text){ return { icon: icon, cls: cls, word: word, text: text }; }
function gradeExercise(ex, rt){
  var g = { credit: 0, rows: [], extra: '' };
  if (ex.type === 'qcm'){
    var ok = rt.sel === ex.qcm.correct;
    g.credit = scoreExercise(ok ? 1 : 0, (!ok && rt.sel != null) ? 1 : 0, 1);
    ex.qcm.options.forEach(function(o){
      if (o.k === ex.qcm.correct) g.rows.push(row('✓','r-ok','Correct','<b>' + esc(o.k) + '.</b> ' + o.t));
      else if (o.k === rt.sel) g.rows.push(row('✗','r-bad','Wrong','<b>' + esc(o.k) + '.</b> ' + o.t));
    });
    if (rt.sel == null) g.rows.push(row('○','r-miss','Missed','You did not choose any answer.'));
  }
  else if (ex.type === 'multi'){
    var N = ex.multi.correct.length, H = 0, W = 0;
    ex.multi.options.forEach(function(o){
      var sel = rt.sel.indexOf(o.k) >= 0, isC = ex.multi.correct.indexOf(o.k) >= 0;
      if (isC && sel){ H++; g.rows.push(row('✓','r-ok','Correct','<b>' + esc(o.k) + '.</b> ' + o.t)); }
      else if (isC && !sel){ g.rows.push(row('○','r-miss','Missed','<b>' + esc(o.k) + '.</b> ' + o.t)); }
      else if (!isC && sel){ W++; g.rows.push(row('✗','r-bad','Wrong','<b>' + esc(o.k) + '.</b> ' + o.t)); }
    });
    g.credit = scoreExercise(H, W, N);
  }
  else if (ex.type === 'match'){
    var Nm = ex.match.left.length, Hm = 0, Wm = 0;
    ex.match.left.forEach(function(l){
      var got = rt.pairs[l.k], want = ex.match.pairs[l.k];
      var rtext = function(rk){ var r = ex.match.right.filter(function(x){ return x.k === rk; })[0]; return r ? r.t : '—'; };
      if (got == null) g.rows.push(row('○','r-miss','Missed','<b>' + l.t + '</b> → you left it unpaired. Correct match: ' + rtext(want)));
      else if (got === want){ Hm++; g.rows.push(row('✓','r-ok','Correct','<b>' + l.t + '</b> → ' + rtext(got))); }
      else { Wm++; g.rows.push(row('✗','r-bad','Wrong','<b>' + l.t + '</b> → you paired it with ' + rtext(got) + '. Correct match: ' + rtext(want))); }
    });
    g.credit = scoreExercise(Hm, Wm, Nm);
  }
  else if (ex.type === 'dnd'){
    var Nd = ex.dnd.items.length, Hd = 0, Wd = 0;
    var bname = function(bk){ var b = ex.dnd.buckets.filter(function(x){ return x.k === bk; })[0]; return b ? b.t : bk; };
    ex.dnd.items.forEach(function(it){
      var p = rt.place[it.k];
      if (p == null) g.rows.push(row('○','r-miss','Missed','<b>' + it.t + '</b> — not placed. It belongs to: <b>' + bname(it.b) + '</b>'));
      else if (p === it.b){ Hd++; g.rows.push(row('✓','r-ok','Correct','<b>' + it.t + '</b> → ' + bname(it.b))); }
      else { Wd++; g.rows.push(row('✗','r-bad','Wrong','<b>' + it.t + '</b> → you placed it in “' + bname(p) + '”. It belongs to: <b>' + bname(it.b) + '</b>')); }
    });
    g.credit = scoreExercise(Hd, Wd, Nd);
  }
  else if (ex.type === 'fill'){
    var Nf = ex.fill.blanks.length, Hf = 0, Wf = 0;
    for (var i = 0; i < Nf; i++){
      var v = norm(rt.vals[i] || ''), acc = ex.fill.blanks[i].accept.map(norm);
      if (!v){ g.rows.push(row('○','r-miss','Missed','Blank ' + (i + 1) + ' left empty. Accepted answer: <code>' + esc(ex.fill.blanks[i].accept[0]) + '</code>')); }
      else if (acc.indexOf(v) >= 0){ Hf++; g.rows.push(row('✓','r-ok','Correct','Blank ' + (i + 1) + ': <code>' + esc(v) + '</code>')); }
      else { Wf++; g.rows.push(row('✗','r-bad','Wrong','Blank ' + (i + 1) + ': <code>' + esc(v) + '</code>. Accepted answer: <code>' + esc(ex.fill.blanks[i].accept[0]) + '</code>')); }
    }
    g.credit = scoreExercise(Hf, Wf, Nf);
  }
  else if (ex.type === 'order'){
    var No = ex.order.items.length, Ho = 0, Wo = 0;
    var label = function(k){ var it = ex.order.items.filter(function(x){ return x.k === k; })[0]; return it ? it.t : k; };
    for (var j = 0; j < No; j++){
      var placedK = rt.orderKeys[j], wantK = ex.order.items[j].k;
      var nm = 'Position ' + (j + 1) + ' (' + label(wantK) + ')';
      if (placedK === wantK){ Ho++; g.rows.push(row('✓','r-ok','Correct', nm)); }
      else if (placedK == null){ g.rows.push(row('○','r-miss','Missed', nm)); }
      else { Wo++; g.rows.push(row('✗','r-bad','Wrong', 'Position ' + (j + 1) + ': you placed “' + label(placedK) + '”, but it belongs to “' + label(wantK) + '”')); }
    }
    g.credit = scoreExercise(Ho, Wo, No);
  }
  else if (ex.type === 'logs'){
    var Nl = ex.logs.needles.length, Hl = 0, Wl = 0;
    var lnText = function(i){ var d = el('div'); d.innerHTML = ex.logs.lines[i].h; return d.textContent.trim(); };
    for (var li = 0; li < ex.logs.lines.length; li++){
      var isN = ex.logs.needles.indexOf(li) >= 0, sel = rt.sel.indexOf(li) >= 0;
      if (isN && sel){ Hl++; g.rows.push(row('✓','r-ok','Correct','Line ' + (li + 1) + ' — ' + esc(lnText(li)).slice(0, 90) + '…')); }
      else if (isN && !sel){ g.rows.push(row('○','r-miss','Missed','Line ' + (li + 1) + ' — ' + esc(lnText(li)).slice(0, 90) + '…')); }
      else if (!isN && sel){ Wl++; g.rows.push(row('✗','r-bad','Wrong','Line ' + (li + 1) + ' — ' + esc(lnText(li)).slice(0, 90) + '… (not part of the answer)')); }
    }
    g.credit = scoreExercise(Hl, Wl, Nl);
  }
  else if (ex.type === 'term'){
    var Nt = ex.term.elements.length, Ht = 0, Wt = 0;
    g.extra += '<div style="margin-top:10px"><div class="mcoltitle" style="margin-bottom:5px">CANONICAL COMMAND (copyable)</div><button class="copybtn" data-copy="1">Copy</button><code class="codeblock" style="display:block" id="cmdblock">' + esc(ex.term.solution) + '</code></div>';
    if (!rt.ran){
      g.rows.push(row('○','r-miss','Missed','You did not run any command in the simulated shell.'));
      g.credit = 0;
      return g;
    } else {
      ex.term.elements.forEach(function(e2){
        if (new RegExp(e2.re, 'i').test(rt.lastCmd)){ Ht++; g.rows.push(row('✓','r-ok','Correct','Element present: ' + e2.t)); }
        else g.rows.push(row('○','r-miss','Missed','Element missing: ' + e2.t));
      });
      if (ex.term.nearMiss){
        ex.term.nearMiss.forEach(function(nm){
          if (new RegExp(nm.re, 'i').test(rt.lastCmd)){ Wt++; g.extra = '<div class="fb-row r-bad"><span class="ric">✗</span><span class="rword">DANGEROUS — NEAR MISS</span><span>Your command matches a harmful pattern: ' + nm.t + '</span></div>' + g.extra; }
        });
      }
      g.credit = scoreExercise(Ht, Wt, Nt);
    }
  }
  else if (ex.type === 'branch'){
    var Nb = ex.branch.steps.length, Hb = 0, Wb = 0;
    ex.branch.steps.forEach(function(st, i){
      var got = rt.choices[i], ok2 = got === st.correct;
      var otext = function(k){ var o = st.options.filter(function(x){ return x.k === k; })[0]; return o ? o.t : '—'; };
      if (got == null) g.rows.push(row('○','r-miss','Missed','<b>' + esc(st.label) + ':</b> no answer recorded. Correct: ' + otext(st.correct)));
      else if (ok2){ Hb++; g.rows.push(row('✓','r-ok','Correct','<b>' + esc(st.label) + ':</b> ' + otext(got))); }
      else { Wb++; g.rows.push(row('✗','r-bad','Wrong','<b>' + esc(st.label) + ':</b> you chose “' + otext(got) + '”. Correct: ' + otext(st.correct))); }
    });
    g.credit = scoreExercise(Hb, Wb, Nb);
  }
  return g;
}

/* ============================ feedback ============================ */
function renderFeedback(ex, rt, g, credit){
  var hinted = !!S.hintUsed[S.idx];
  var cls, label, icon;
  if (credit >= 0.999){ cls = 'fb-ok'; label = 'CORRECT'; icon = '✓'; }
  else if (credit > 0){ cls = 'fb-part'; label = 'PARTIALLY CORRECT'; icon = '✓'; }
  else { cls = 'fb-zero'; label = 'INCORRECT'; icon = '✗'; }
  var multiType = ['multi','match','dnd','fill','order','logs','term','branch'].indexOf(ex.type) >= 0;
  var creditTxt = multiType
    ? '<span class="fb-credit">credit ' + credit.toFixed(2) + ' · hint penalty ' + (hinted ? 'applied (−0.10)' : 'none') + '</span>'
    : '<span class="fb-credit">' + (hinted ? 'hint penalty applied (−0.10)' : 'no hint used') + '</span>';
  var h = '<section class="feedback ' + cls + '" aria-live="polite">';
  h += '<div class="fb-head"><span aria-hidden="true">' + icon + '</span> ' + label + ' <span aria-hidden="true">·</span> ' + creditTxt + '</div>';
  h += '<div class="fb-body">';
  if (g.rows.length) h += '<div class="fb-rows">' + g.rows.map(function(r){
    return '<div class="fb-row ' + r.cls + '"><span class="ric" aria-hidden="true">' + r.icon + '</span><span class="rword">' + esc(r.word) + '</span><span>' + r.text + '</span></div>';
  }).join('') + '</div>';
  h += g.extra;
  if (ex.type === 'term' && S.rt.ran && S.rt.lastKind !== 'solution'){
    h += '<div class="fb-explain">Each element above is one part of the command: the tool, the mode and the target. A command is only correct when every required element is present and nothing dangerous is added.</div>';
  }
  h += '<div class="fb-explain">' + ex.explain + '</div>';
  if (ex.study && credit < 0.999) h += '<div class="study"><b>What to study:</b> ' + ex.study + '</div>';
  h += '</div></section>';
  /* reveal correct/wrong on the option rows themselves (never colour-only: rows also carry words) */
  var corrKeys = [];
  if (ex.type === 'qcm') corrKeys = [ex.qcm.correct];
  if (ex.type === 'multi') corrKeys = ex.multi.correct;
  if (corrKeys.length){
    $$('#answ .qcm-opt').forEach(function(b){
      var k = b.getAttribute('data-k');
      if (corrKeys.indexOf(k) >= 0) b.classList.add('corr-reveal');
      else if (S.rt.sel && S.rt.sel.indexOf && S.rt.sel.indexOf(k) >= 0) b.classList.add('wrong-reveal');
    });
  }
  $('#fbzone').innerHTML = h;
  var cp = $('#fbzone .copybtn');
  if (cp) cp.addEventListener('click', function(){
    var txt = $('#cmdblock').textContent;
    try {
      navigator.clipboard.writeText(txt).then(function(){ cp.textContent = 'Copied ✓'; setTimeout(function(){ cp.textContent = 'Copy'; }, 1600); }, function(){});
    } catch(e){}
  });
}

/* ============================ review screen ============================ */
function openReview(){
  S.screen = 'review'; hideVeil();
  var h = '<div class="wrap"><section class="card results-card" aria-label="Review skipped exercises">';
  h += '<h2><span class="skip-i" aria-hidden="true">⚠</span> Review skipped exercises</h2>';
  h += '<p class="rs-sumline">These exercises were skipped without an answer. You may return to any of them as many times as you need, while the timer has time left. Skipped exercises you never answer are <b>excluded from your score</b> — they do not count for or against you.</p>';
  h += '<p class="rs-sumline">Timer: <b class="mono" id="revtimer">' + fmtTime(S.timeRemain) + '</b> · state: <b>' + esc(S.timerState) + '</b></p>';
  if (S.skipped.length === 0){
    h += '<p class="rs-sumline">Nothing left here — every skipped exercise has been answered.</p>';
  } else {
    h += '<div class="card revlist">';
    S.skipped.forEach(function(ix){
      var ex = EXAM.exercises[ix];
      h += '<div class="rev-item"><span><span class="rtitle">⚠ Skipped</span> — <span class="rname">' + esc(ex.tag) + '</span></span><button class="btn" data-go="' + ix + '">Answer this ▶</button></div>';
    });
    h += '</div>';
  }
  h += '<div style="margin-top:16px;display:flex;gap:12px;flex-wrap:wrap"><button class="btn primary" id="finalsubmit">⏹ Submit final results</button></div>';
  h += '</section></div>';
  $('#app').innerHTML = h;
  $$('.rev-item [data-go]').forEach(function(b){
    b.addEventListener('click', function(){
      S.mode = 'review'; S.reviewFrom = 'review';
      S.idx = parseInt(b.getAttribute('data-go'), 10);
      S.skipped.splice(S.skipped.indexOf(S.idx), 1);
      updateSkChip();
      renderExercise();
    });
  });
  $('#finalsubmit').addEventListener('click', finishExam);
  var iv = setInterval(function(){
    var rt2 = $('#revtimer');
    if (!rt2 || S.screen !== 'review'){ clearInterval(iv); return; }
    rt2.textContent = fmtTime(S.timeRemain);
  }, 1000);
}

/* ============================ results ============================ */
function finishExam(){
  if (S.screen === 'results') return;
  if (S.screen === 'exam'){
    if (!S.checked[S.idx] && S.skipped.indexOf(S.idx) < 0) S.skipped.push(S.idx);
    /* The learner must always see the Review-skipped screen before the final
       results — unless the timer already ended (nothing can be answered). */
    if (S.skipped.length && S.timerState !== TSTATE.ENDED){ openReview(); return; }
  }
  if (S.timerState !== TSTATE.ENDED) setTimerState(TSTATE.ENDED);
  S.screen = 'results';
  var n = answeredCount(), sum = creditSum();
  var pct = n > 0 ? Math.round((sum / n) * 100) : 0;
  var passed = pct >= EXAM.meta.passMark;
  var full = 0, part = 0, zero = 0, partSum = 0;
  for (var k in S.checked){
    if (!S.checked[k]) continue;
    var c = S.credits[k];
    if (c >= 0.999) full++;
    else if (c > 0){ part++; partSum += c; }
    else zero++;
  }
  var excluded = total() - n;
  var m = EXAM.meta;
  var h = '<div class="wrap"><section class="card results-card" aria-label="Results">';
  h += '<h2>' + esc(m.title) + ' — results</h2>';
  h += '<p class="rs-sumline">Scored over answered exercises only. Skipped-and-never-answered exercises are excluded from both the score and the total.</p>';
  h += '<div class="rs-big"><span class="rnum">' + sum.toFixed(1) + '</span><span>credit points over ' + n + ' answered</span><span class="rpct">' + pct + '%</span><span>pass mark ' + m.passMark + '%</span></div>';
  h += '<div class="rs-rows">';
  h += '<div class="rs-row r-ok"><span class="ric" aria-hidden="true">✓</span> Fully correct <span class="rnum">' + full + '</span></div>';
  h += '<div class="rs-row r-part"><span class="ric" aria-hidden="true">✓</span> Partially correct' + (part ? ' — avg credit ' + (partSum / part).toFixed(2) : '') + ' <span class="rnum">' + part + '</span></div>';
  h += '<div class="rs-row r-zero"><span class="ric" aria-hidden="true">✗</span> Fully incorrect <span class="rnum">' + zero + '</span></div>';
  h += '<div class="rs-row r-skip"><span class="ric" aria-hidden="true">⚠</span> Skipped — excluded from score <span class="rnum">' + excluded + '</span></div>';
  h += '</div>';
  if (passed){
    h += '<div class="cert pass"><div class="clogo" aria-hidden="true">✓</div><h3>PASS</h3>';
    h += '<p>Certificate of completion — ' + esc(m.objectId) + ' ' + esc(m.objectName) + ' · ' + esc(m.sevWord) + ' tier</p>';
  } else {
    h += '<div class="cert fail"><div class="clogo" aria-hidden="true">✗</div><h3>FAIL</h3>';
    h += '<p>You must retake this exam to reach the ' + m.passMark + '% pass mark. Review the feedback you collected, then try again.</p>';
  }
  if (S.handshake.username) h += '<p>Candidate: <b>' + esc(S.handshake.username) + '</b>' + (S.handshake.country && S.handshake.country !== 'ZZ' ? ' · ' + esc(S.handshake.country) : '') + '</p>';
  h += '</div>';
  h += '<div class="timesum"><span>⏱ Time left: <b>' + fmtTime(S.timeRemain) + '</b></span><span>⏸ Paused manually: <b>' + S.manualSec + 's</b></span><span>⏸ Paused for feedback review: <b>' + S.autoSec + 's</b></span></div>';
  h += '<div style="margin-top:18px"><button class="btn primary" id="retakebtn">↻ Retake exam</button></div>';
  h += '</section></div>';
  $('#app').innerHTML = h;
  $('#retakebtn').addEventListener('click', retake);
  updateSkChip();
  reportScore(sum, n, pct, passed);
}
function reportScore(creditSumV, answeredN, percent, passed){
  if (S.reported) return;
  S.reported = true;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: EXAM.meta.topicId,
      batch: EXAM.meta.batch,
      score: Math.round(creditSumV),
      total: answeredN,
      percent: percent,
      passed: passed
    }, location.origin);
  } catch (e) { /* opened directly — nothing to report to */ }
}
function retake(){
  S.order = shuffle(EXAM.exercises.map(function(e, i){ return i; }));
  S.idx = 0; S.credits = {}; S.checked = {}; S.hintUsed = {}; S.skipped = [];
  S.mode = 'normal'; S.reviewFrom = null;
  S.timeRemain = EXAM.meta.timerSeconds; S.timerState = TSTATE.RUNNING; S.prevTimerState = null;
  S.manualSec = 0; S.autoSec = 0; S.reported = false;
  renderHeader();
  renderExercise();
}

/* ============================ handshake + init ============================ */
window.addEventListener('message', function(event){
  if (!event.data) return;
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  S.handshake.username = event.data.username || '';
  S.handshake.country = event.data.country || '';
  S.handshake.locale = event.data.locale || 'en';
  /* theme is always 'dark' — the file is dark-only by contract, nothing to switch */
});
function initExam(){
  S.order = shuffle(EXAM.exercises.map(function(e, i){ return i; }));
  renderIntro();
  startTicker();
}
document.addEventListener('DOMContentLoaded', initExam);

</script>
