 gather environment details.</p>\n<p><b>Where will you meet this at work?</b> SOC analysts triaging scanner traffic; threat hunters\nbasing external exposure; incident responders reconstructing pre-compromise knowledge; CTI analysts\nmapping procedures to ATT&CK IDs; red teamers mirroring collection; detection engineers running\nanalytics like DET0820 with its high false-positive rate; GRC analysts and control owners owning\nthe M1056 Pre-compromise posture and its CIS / NIST CSF / ISO 27001 anchors.</p>\n<p><b>This tier:</b> near-miss answers are everywhere. At least two options will look defensible\nin another context — your job is to find the one that holds <i>here</i>, with a justification.</p>\n", "themesHtml": "<div class=\"theme-grid\"><div class=\"theme-card\"><h3>Technique identity and family</h3><div class=\"theme-tags\"><span class=\"tag\">T1592.004</span><span class=\"tag\">Sub-technique of T1592</span><span class=\"tag\">Tactic TA0043 Reconnaissance</span><span class=\"tag\">Siblings: .001 Hardware / .002 Software / .003 Firmware</span><span class=\"tag\">Platforms: PRE</span></div></div><div class=\"theme-card\"><h3>What counts as client configurations</h3><div class=\"theme-tags\"><span class=\"tag\">OS and version</span><span class=\"tag\">Virtualization</span><span class=\"tag\">Architecture 32/64-bit</span><span class=\"tag\">Language</span><span class=\"tag\">Time zone</span></div></div><div class=\"theme-card\"><h3>Collection methods</h3><div class=\"theme-tags\"><span class=\"tag\">Active Scanning (T1595): listening ports, server banners, user agent strings</span><span class=\"tag\">Phishing for Information (T1598)</span><span class=\"tag\">Compromised websites with fingerprinting content</span><span class=\"tag\">Open data sets: job postings, network maps, assessment reports, resumes, purchase invoices</span></div></div><div class=\"theme-card\"><h3>What recon unlocks next</h3><div class=\"theme-tags\"><span class=\"tag\">Search Open Websites/Domains (T1593)</span><span class=\"tag\">Search Open Technical Databases (T1597)</span><span class=\"tag\">Develop Capabilities (T1587)</span><span class=\"tag\">Obtain Capabilities (T1588)</span><span class=\"tag\">Supply Chain Compromise (T1195)</span><span class=\"tag\">External Remote Services (T1133)</span></div></div><div class=\"theme-card\"><h3>Telemetry and detection</h3><div class=\"theme-tags\"><span class=\"tag\">Detection Strategy DET0820 / analytic AN1952</span><span class=\"tag\">High false-positive rate for internet scanners</span><span class=\"tag\">Off-perimeter blind spots</span><span class=\"tag\">Watch the Initial Access stages</span></div></div><div class=\"theme-card\"><h3>Mitigation and controls</h3><div class=\"theme-tags\"><span class=\"tag\">M1056 Pre-compromise</span><span class=\"tag\">Minimize data available to external parties</span><span class=\"tag\">Version banner hygiene</span><span class=\"tag\">Public document hygiene</span><span class=\"tag\">Framework mappings: NIST CSF, CIS Controls, ISO 27001</span></div></div><div class=\"theme-card\"><h3>Real-world procedures</h3><div class=\"theme-tags\"><span class=\"tag\">C0064 AI-Assisted Breach of Mexico's Government Infrastructure</span><span class=\"tag\">C0062 Anthropic AI-orchestrated Campaign</span><span class=\"tag\">G0125 HAFNIUM — Office 365 tenant environment details</span></div></div><div class=\"theme-card\"><h3>Tools and work roles</h3><div class=\"theme-tags\"><span class=\"tag\">curl / banner grabbing</span><span class=\"tag\">Scanner tools</span><span class=\"tag\">SOC analyst</span><span class=\"tag\">CTI analyst</span><span class=\"tag\">Red teamer</span><span class=\"tag\">Detection engineer</span><span class=\"tag\">GRC analyst / control owner</span></div></div></div>", "exercises": [{"id": "h01", "type": "qcm-multi", "kindLabel": "Multi-select", "title": "Three artefacts belong to T1592.004", "summary": "Six artefacts from a case. Select the three ATT&CK records under T1592.004.", "scenario": [{"label": "Case file — artefact summary (case 2025-118)", "html": "<ol><li>HAFNIUM-style interaction with an Office 365 tenant to gather environment details.</li><li>A compromised partner site ran a script collecting each visitor's OS, architecture and language.</li><li>Purchase invoices (found via a supplier breach) show the company bought 32-bit thin clients.</li><li>A WHOIS lookup of the victim's domain registrar data.</li><li>A firmware image pulled from an edge router.</li><li>A DNS MX lookup identifying the mail provider.</li></ol>"}], "question": "Select the THREE artefacts that ATT&CK records under T1592.004.", "options": ["Office 365 tenant interaction to gather environment details (HAFNIUM pattern)", "Compromised site fingerprinting visitors' OS, architecture and language", "Purchase invoices revealing 32-bit thin clients", "WHOIS lookup of domain registrar data", "Firmware image pulled from an edge router", "DNS MX lookup of the mail provider"], "answerIdxs": [0, 1, 2], "hint": "One artefact is a documented procedure example on the ATT&CK page, one is the malicious-content pattern, one is an open data set. The others belong to sibling objects.", "explain": "HAFNIUM interacting with Office 365 tenants to gather environment details is a documented procedure example on the T1592.004 page. Fingerprinting content on compromised sites is named in the description ('compromise sites then include malicious content designed to collect host information from visitors'). Purchase invoices are an explicit open data set example. WHOIS belongs to T1590.001 (Domain Properties), DNS lookups to T1590.002 (DNS), and the firmware image to T1592.003 (Firmware).", "study": "Know the siblings: .004 is about client configurations, not domains, DNS or firmware."}, {"id": "h02", "type": "qcm", "kindLabel": "Multiple choice", "title": "The best-supported next step", "summary": "Collected data in hand — which ATT&CK step does the description actually support?", "scenario": "An attacker now holds: language en-GB, time zone Europe/London, architecture 32-bit for a finance team. Your trainee proposes four next moves; only one is supported by ATT&CK's own description of where this information leads.", "question": "Which next step is BEST supported by ATT&CK's description?", "options": ["External Remote Services (T1133) — attempt the VPN straight away tonight", "Gather Victim Host Information: Firmware (T1592.003) — pull router images", "Develop Capabilities (T1587) — a 32-bit payload and a locale-matched lure", "Adversary-in-the-Middle (T1557) — intercept traffic on the local segment"], "answerIdx": 2, "hint": "The description says collected details may reveal opportunities for establishing operational resources — before initial access.", "explain": "The T1592.004 description: gathering 'may reveal opportunities for ... establishing operational resources (ex: Develop Capabilities or Obtain Capabilities)'. A 32-bit, locale-matched payload is exactly that. Jumping straight to T1133 (initial access) without a fitting capability is the plausible shortcut that fails here; T1592.003 and T1557 need positions the attacker has not established.", "study": "Sequence matters: capabilities are built BEFORE access is attempted."}, {"id": "h03", "type": "branch", "kindLabel": "Decision steps", "title": "Mass scanner or something worse?", "summary": "Three decisions on conflicting signal.", "scenario": [{"label": "Artefact 1 — web access log (three nights)", "html": "<pre class=\"code\">198[.]51[.]100[.]24 - \"HEAD / HTTP/1.1\" 200 \"Mozilla/5.0 (compatible; Nmap Scripting Engine)\"\n198[.]51[.]100[.]24 - \"HEAD / HTTP/1.1\" 200 \"Mozilla/5.0 (compatible; Nmap Scripting Engine)\"\n198[.]51[.]100[.]24 - \"GET /?p=2 HTTP/1.1\" 200 \"Mozilla/5.0 (compatible; Nmap Scripting Engine)\"</pre>"}, {"label": "Artefact 2 — CTI bulletin", "html": "<p>Scanner fleet X hits thousands of organizations weekly with identical user agent patterns. Assessed as opportunistic mass scanning.</p>"}, {"label": "Artefact 3 — careers page", "html": "<p>Job ad posted last week names 'our legacy 32-bit laptop fleet' and 'en-GB language baseline'.</p>"}], "question": "Work the three decisions.", "steps": [{"question": "Step 1: What did the actor most likely collect from YOU?", "options": ["Banner and version information via active scanning", "Nothing — mass scans produce no usable signal", "User credentials", "Firmware images"], "answerIdx": 0, "hint": "HEAD requests return headers. Headers contain banners. That is the T1592.004 collection example.", "ack": "Noted — collection named. Next."}, {"question": "Step 2: The bulletin says the scanner hits thousands of orgs. Does that change what it means for YOU?", "options": ["No — the exposure is real and still worth minimizing; mass does not mean harmless", "Yes — you can close the ticket as generic noise", "Yes — it proves you are targeted for espionage"], "answerIdx": 0, "hint": "One wrong path: 'mass scan' and 'harmless' are not synonyms. The other: scale does not prove intent.", "ack": "Balanced view recorded. Last decision."}, {"question": "Step 3: Choose the least aggressive CORRECT action.", "options": ["Strip version banners and trim the job ad, then monitor for follow-up", "Shut the web tier down until the campaign passes", "Publish a public statement about the campaign"], "answerIdx": 0, "hint": "Two options here overreact in different ways. The proportionate fix touches configuration and documents.", "ack": ""}], "hint": "Name the collection honestly, keep scale in context, then pick the proportionate fix.", "explain": "Step 1: HEAD requests and scripting-engine user agents collect headers and banners — the T1592.004 collection example. Step 2: mass-scan context does not neutralize real exposure; your job ad still advertises a 32-bit fleet, and your banners still describe the stack. Step 3: stripping banners and trimming the ad are reversible, low-cost fixes (M1056 thinking); shutting a revenue-earning web tier and public statements punish the business, not the scanner.", "study": "Triage discipline: name the behaviour, weigh context, choose proportionate response."}, {"id": "h04", "type": "order", "kindLabel": "Ordering", "title": "The chain after client configs", "summary": "Five techniques — order the attacker chain.", "scenario": "You brief new joiners with the 'one chain' whiteboard: how T1592.004 output becomes an intrusion. The magnets fell off again.", "question": "Order the attacker chain for the briefing (top = first).", "items": ["Collect client configurations (T1592.004)", "Develop the matching capability (T1587.001)", "Send a localized spearphishing attachment (T1566.001)", "User runs the payload (T1204.002)", "Establish persistence with a registry run key (T1547.001)"], "correctSeq": [0, 1, 2, 3, 4], "hint": "Collect, build, deliver, execute, persist. Each stage depends on the previous one.", "explain": "Recon (T1592.004) tells the attacker what to build; T1587.001 (Develop Capabilities: Malware) produces the 32-bit, locale-fitting payload; T1566.001 delivers it as a credible lure; T1204.002 is the user executing it; T1547.001 makes it survive reboots. Skipping a stage is the classic mistake — a great payload with no delivery never lands.", "study": "Anchor each stage to its technique ID for cleaner reports."}, {"id": "h05", "type": "terminal", "kindLabel": "Terminal", "title": "Raw request on the record", "summary": "Objective only — choose the tool, the request form and the target yourself.", "scenario": "Engagement window, authorised target. Your lead's message: 'Portal is in scope. I want the server banner for the recon log — and I want the request ON RECORD exactly as it goes on the wire: hand-craft a HEAD request and send it through a raw TCP connection. One request, headers only. The victim's monitoring is live tonight — do not look like a scan.'", "question": "Send a hand-crafted HEAD request for / through a raw TCP connection to the portal, and capture its response headers.", "briefing": "<b>Objective:</b> capture the server banner with a hand-crafted raw HEAD request on the record.<br><b>Environment:</b> Linux attack box; HTTP reach to <span class=\"mono\">hxxp://portal[.]victim[.]example</span> on the default web port; raw socket utilities are installed; the target's monitoring is live.<br><b>Constraints:</b> one request; headers only; the request must visibly be a HEAD request for /; nothing written to disk.<br><b>Defang note:</b> hxxp:// and [.] stand for http:// and dots.", "prompt": "operator@box:~$", "motd": "authorised engagement shell — nothing runs for real", "elements": [{"name": "raw TCP client (nc / ncat / netcat)", "re": "(^| )(nc|ncat|netcat)( |$)", "show": "nc (raw TCP connection)"}, {"name": "request line: HEAD for /", "re": "head / http/1\\.1", "show": "HEAD / HTTP/1.1"}, {"name": "target host", "re": "portal\\.victim\\.example", "show": "portal.victim.example"}, {"name": "default port 80", "re": " 80( |$)|:80( |$)", "show": "80"}], "wrong": [{"name": "GET instead of HEAD", "re": "get / http/1\\.1", "show": "GET pulls the body too — HEAD asks for headers only"}], "danger": [{"re": "(^| )nmap( |$)", "note": "nmap (especially -A) is an invasive, noisy scan — the wrong tool when one quiet header read is the goal."}, {"re": "(^| )nc( )+-e", "note": "nc -e asks the REMOTE host to run a program — that is an exploitation attempt, not recon."}], "canonical": "echo -e \"HEAD / HTTP/1.1\\r\\n\\r\\n\" | nc portal.victim.example 80", "sim": "Trying portal[.]victim[.]example...\nConnected to portal[.]victim[.]example.\nHTTP/1.1 200 OK\nServer: nginx/1.24.0 (Ubuntu)\nX-Powered-By: PHP/8.1.2\nContent-Type: text/html; charset=UTF-8", "canonExpl": ["<span class=\"mono\">echo -e \"HEAD / HTTP/1.1\\r\\n\\r\\n\"</span> — builds the raw request text (echo -e interprets the escapes in bash); the empty lines end the headers.", "<span class=\"mono\">|</span> — pipes the request into the connection.", "<span class=\"mono\">nc portal.victim.example 80</span> — opens the raw TCP connection to the default web port.", "The reply is the banner: exactly the T1592.004 collection example, with a request record that shows a clean HEAD."], "hint": "Two stages joined by a pipe: build the request text, then hand it to a raw TCP client. The request line must say HEAD, and the port is the web default.", "explain": "The clean answer is <b>echo -e \"HEAD / HTTP/1.1\\r\\n\\r\\n\" | nc portal.victim.example 80</b>. The pipe hands a hand-crafted HEAD request to a raw TCP client, so the recon log shows exactly one quiet request and the banner comes back. Near-misses: GET / would pull the body and multiply the noise; a web client such as curl would work but does not put a hand-crafted raw request on the record the lead asked for; nmap would look like a scan on live monitoring; nc -e would be an exploitation attempt, not recon. The banner (Server, X-Powered-By) is the T1592.004 collection example in action — and your recon log now has exactly one line of noise.", "study": "Raw requests make evidence precise: build the request, pipe it, read the banner."}, {"id": "h06", "type": "match", "kindLabel": "Matching", "title": "Documented procedures: who collected what", "summary": "Real ATT&CK procedure examples plus two recurring patterns.", "scenario": "You update the CTI wiki page for T1592.004. The procedure-examples table needs accurate pairings — the reviewers check against attack.mitre.org.", "question": "Match each entry to what was collected.", "left": ["C0064 — AI-Assisted Breach of Mexico's Government Infrastructure", "C0062 — Anthropic AI-orchestrated Campaign", "G0125 — HAFNIUM", "Compromised-website pattern", "Open-data pattern"], "right": ["Interacted with Office 365 tenants to gather details about the target's environments", "AI agent tasked to collect environment details: diagrams, database tables, authentication flow, configuration files with credentials", "Fingerprinting content collects each visitor's client configuration", "Job postings, resumes or invoices expose the victim's system details", "AI agent gathered details of high-value systems: databases and workflow orchestration platforms"], "pairs": [1, 4, 0, 2, 3], "hint": "Two entries are AI-agent campaigns — do not swap their payloads. HAFNIUM's line mentions Office 365.", "explain": "Per the ATT&CK page: C0064's adversary tasked an AI agent to collect environment information including diagrams, database tables, authentication flow and configuration files with credentials. C0062's adversary leveraged an AI agent for details of high-value systems — databases and workflow orchestration platforms. HAFNIUM interacted with Office 365 tenants to gather environment details. The other two rows are the recurring collection patterns named in the technique description.", "study": "Quote procedure examples precisely — reviews check them against the ATT&CK page."}, {"id": "h07", "type": "qcm", "kindLabel": "Multiple choice", "title": "The comfort survey", "summary": "Looks benign, is not. What is the defensible call?", "scenario": [{"label": "Artefact — internal email, security review queue", "html": "<pre class=\"code\">From: people-team@victim[.]example\nSubject: IT comfort survey — win a coffee machine!\n\nHi all! 4 short questions:\n1. Which OS version does your work laptop run?\n2. Is it 32-bit or 64-bit?\n3. Which time zone do you work from?\n4. Which language pack is active?\n\nReply to this address. 3 winners get premium coffee kits.\n(No links. No attachments. Promise.)</pre>"}], "question": "What is the most defensible security call?", "options": ["Harmless HR housekeeping — approve the survey and close the ticket", "Phishing for Information (T1598) feeding T1592.004 — treat as suspicious", "Credential phishing — block it because it steals passwords by form", "Vendor spam — filter the sender and close the case quietly"], "answerIdx": 1, "hint": "Map the four questions onto the ATT&CK scope of T1592.004, word by word.", "explain": "The four questions are literally the T1592.004 scope: OS version, architecture (32/64-bit), time zone, language. Asking staff for them is Phishing for Information (T1598) that feeds client-configuration collection. 'No links, no attachments' is what makes it clever — there is no payload to detonate, just questions. The benign-looking option is the trap.", "study": "Judge the QUESTIONS, not the payload: recon emails carry no malware."}, {"id": "h08", "type": "qcm-multi", "kindLabel": "Multi-select", "title": "Select the two changes that matter", "summary": "Five candidate changes. Two reduce the value of this recon.", "scenario": "Budget round. The CISO asks: 'Given T1592.004 recon against us, which TWO changes most reduce its VALUE? Defend your pair.'", "question": "Select the TWO changes that most reduce the value of T1592.004 collection.", "options": ["Remove or genericize version banners at the web tier", "Trim system detail from public job posts and documents", "Buy 3x more firewall log storage", "Block today's scanner IP at the edge", "Uninstall EDR so the configuration is 'hidden' from recon"], "answerIdxs": [0, 1], "hint": "Value drops when the data shrinks at its source. Storage and single IPs do not shrink anything.", "explain": "Both winning options shrink the information available to external parties — the exact intent of M1056 Pre-compromise. Log storage changes detection capacity, not attacker knowledge. Blocking one IP shifts the scanner to another. Uninstalling EDR would blind you and change nothing the attacker collects — it is the 'looks related, actually harmful' distractor.", "study": "Reduce the source, not the symptom."}, {"id": "h09", "type": "dnd", "kindLabel": "Spot the mistake", "title": "Clean headers? Not quite.", "summary": "Two hardened files. One line still betrays the stack.", "scenario": [{"label": "Artefact 1 — /etc/nginx/nginx.conf (excerpt)", "html": "<pre class=\"code\">http {\n    server_tokens off;\n    ...\n}</pre>"}, {"label": "Artefact 2 — /etc/php/8.1/fpm/php.ini (excerpt)", "html": "<pre class=\"code\">; Language options\nexpose_php = On\nmemory_limit = 256M</pre>"}, {"label": "Context", "html": "<p>The admin's change ticket says: 'Headers no longer disclose versions.' An external scan still reports the PHP version.</p>"}], "question": "Place the offending line into the target box.", "zones": ["This line still leaks a version"], "items": ["php.ini: expose_php = On", "nginx.conf: server_tokens off;", "nginx.conf: listen 443 ssl;", "php.ini: memory_limit = 256M"], "map": [0, 1, 1, 1], "hint": "The ticket fixed one layer. The scanner reads a header that the other layer emits.", "explain": "With <b>expose_php = On</b>, PHP advertises its version (X-Powered-By) regardless of nginx's server_tokens. The ticket closed the nginx leak and left the PHP leak open — a classic partial-hardening mistake that keeps T1592.004 collection alive.", "study": "Harden every responding component; verify with an external scan, not a config read."}, {"id": "h10", "type": "qcm", "kindLabel": "Multiple choice", "title": "Which request deserves the strongest suspicion?", "summary": "Three requests, three stories — one is spoofed.", "scenario": [{"label": "Artefact — three requests from tonight's log", "html": "<pre class=\"code\">A) 203[.]0[.]113[.]7  \"HEAD / HTTP/1.1\" 200 \"Mozilla/5.0 (Windows NT 10.0; Win64; x64)\"\nB) 198[.]51[.]100[.]99 \"GET / HTTP/1.1\" 200 \"Googlebot/2.1 (+hxxp://www.google[.]com/bot.html)\"\nC) 198[.]51[.]100[.]7  \"GET / HTTP/1.1\" 200 \"python-requests/2.31\"   # documented PartnerX monitoring NAT</pre>"}, {"label": "Context notes", "html": "<p>Google publishes its crawler address ranges. PartnerX's monitoring NAT is documented in the vendor register. Plain HEAD requests from a residential IP are common scanner noise.</p>"}], "question": "Which request deserves the strongest suspicion, and why?", "options": ["A — plain HEAD requests are an attack no matter which address sends them", "C — python-requests clients are always malicious, no exceptions", "All three are equally benign once you read the context notes", "B — its Googlebot claim is false: the address is outside Google's ranges"], "answerIdx": 3, "hint": "One story contradicts a public fact. The others are noise explained by documented context.", "explain": "Google's crawler always comes from Google's published ranges; 198[.]51[.]100[.]99 is not one, so the Googlebot claim is a spoof — a classic fingerprinting disguise (looks benign, is alarming). A is generic scanner noise (alarming-looking, weak signal). C comes from the documented PartnerX monitoring NAT — odd-looking but explained (benign-looking, benign). Reading each story against external facts is the HARD-tier skill.", "study": "Verify claimed identities (bot ranges, partner NAT) before judging."}, {"id": "h11", "type": "fill", "kindLabel": "Gap fill", "title": "CTI brief: calibration words", "summary": "Four gaps — analytic confidence, technique IDs, staging status.", "scenario": "Your brief goes to the CISO at 08:00. The analytic language must be precise: confidence, IDs, and what you have NOT seen.", "question": "Fill the four gaps with the calibrated words.", "template": "We assess with {0} confidence that the actor performed active scanning (T1595) — listening ports, server banners and user agent strings — consistent with T1592.004. Collected details (OS, {1}, language, time zone) likely feed capability development ({2}). We have no evidence yet of {3}: no exploits staged, no lures observed.", "answers": ["moderate", "architecture", "T1587", "staging"], "bank": ["moderate", "architecture", "T1587", "staging", "high", "virtualization", "T1195", "patching"], "hint": "Confidence follows evidence volume. The scope word completes the ATT&CK list. One ID is about building tools, one word is about preparing them.", "explain": "<b>Moderate</b> confidence fits: pattern matches a known collection example but attribution and intent are unproven. The scope list is 'OS, architecture, language, time zone'. Capability <b>development</b> is T1587 (T1195 is Supply Chain Compromise — a different stage). '<b>No evidence of staging</b>' is the honest negative that keeps the brief defensible; claiming 'high' confidence would over-sell the case.", "study": "Calibrate: confidence from evidence, scope from ATT&CK wording, negatives stated explicitly."}, {"id": "h12", "type": "branch", "kindLabel": "Dual perspective", "title": "Same headers, two chairs", "summary": "Red side first, blue side second — one artefact.", "scenario": [{"label": "Artefact — response headers captured tonight", "html": "<pre class=\"code\">Server: nginx/1.24.0 (Ubuntu)\nX-Powered-By: PHP/8.1.2</pre>"}], "question": "Take both chairs in turn.", "steps": [{"question": "Step 1 — RED chair: what did you gain, and what is the natural next move?", "options": ["Exact software versions — next, match a capability to them", "Nothing usable — headers are random text", "User credentials — next, log in", "Network topology — next, map the segment"], "answerIdx": 0, "hint": "Stay honest: two lines, two products, two versions. That is all — and that is a lot.", "ack": "Red chair done. Change chairs."}, {"question": "Step 2 — BLUE chair: which single change removes the most banner intelligence?", "options": ["Strip or genericize version tokens in Server and X-Powered-By", "Add a second firewall", "Recolor the website", "Rename the server hostname"], "answerIdx": 0, "hint": "The intel lives in two header values. Fix those two values.", "ack": ""}], "hint": "Red reads data; blue deletes data. Keep the two views separate.", "explain": "Red: two lines gave exact software and versions — the T1592.004 collection example — and the attacker's next move is matching a capability to them (T1587/T1588). Blue: the cheapest large win is removing or genericizing those two header values at the web tier (M1056 thinking); firewalls, colors and hostnames do not touch the banner data.", "study": "Practise flipping chairs: every collection example is also a hardening target."}, {"id": "h13", "type": "fill", "kindLabel": "Gap fill", "title": "Incident note: the chosen option", "summary": "Three gaps in the decision record.", "scenario": "INC-2025-77 is closing. The note must record WHY the team chose the least aggressive correct option.", "question": "Fill the three gaps of the decision record.", "template": "Incident note: we chose the {0} option: strip {1} at the load balancer tonight and verify with an external scan — not a full {2} window.", "answers": ["least-aggressive", "version headers", "replacement"], "bank": ["least-aggressive", "version headers", "replacement", "most-aggressive", "debug logs", "upgrade"], "hint": "The note says 'not a full ...' — what big operation did they avoid? And what did they strip?", "explain": "The team stripped <b>version headers</b> at the load balancer and verified externally — the <b>least-aggressive</b> correct option. A full <b>replacement</b> window (or an upgrade) would have created downtime for no extra recon-reduction benefit. Debug logs would add noise, not reduce exposure.", "study": "Decision records should name the options considered AND the cost avoided."}, {"id": "h14", "type": "order", "kindLabel": "Ordering", "title": "Hardening sequence", "summary": "Four steps — order the exposure-reduction programme.", "scenario": "Your programme plan for 'stop feeding the scanners' has four milestones. The order is the whole point: each step enables the next.", "question": "Put the four milestones in the right order (top = first).", "items": ["Baseline what the internet sees (external attack-surface scan)", "Minimize banners and public document detail", "Patch and inventory the client fleet", "Re-scan and watch Initial Access stages"], "correctSeq": [0, 1, 2, 3], "hint": "You cannot reduce what you have not measured, and you cannot claim success without a re-scan.", "explain": "Baseline first: M1056 says minimize what external parties can learn — that needs a measurement. Then reduce (banners, documents), then cut the residual value (inventory + patching), then verify with a re-scan and keep watching Initial Access stages, per the ATT&CK detection note. Starting with patching would leave the leak growing while you patch.", "study": "Measure, reduce, harden, verify."}, {"id": "h15", "type": "terminal", "kindLabel": "Terminal", "title": "Read-only package audit", "summary": "Defender-side: list nginx package lines with versions. Change nothing.", "scenario": "The SOC compares what the attacker SAW (the banner) with what the server actually RUNS. You are on the box. Evidence is live — read only.", "question": "List the installed-package lines containing 'nginx' with their versions.", "briefing": "<b>Environment:</b> read-only console on web01 (Ubuntu). You may run listing commands only.<br><b>Goal:</b> print every installed-package line that mentions nginx, with versions, so the SOC can compare against the attacker's banner.<br><b>Constraints:</b> do not install, remove, restart or reconfigure anything.<br><b>Defang note:</b> all hosts below use [.] writing — type the command exactly as you would on the box.", "prompt": "soc@web01:~$", "motd": "read-only audit shell — listing commands only", "elements": [{"name": "package list source", "re": "(dpkg\\s+-l|dpkg-query\\s+-l|apt list --installed|apt list --installed\\s)", "show": "dpkg -l (or apt list --installed)"}, {"name": "pipe to grep", "re": "\\|\\s*grep", "show": "| grep"}, {"name": "pattern nginx", "re": "nginx", "show": "nginx"}], "wrong": [], "danger": [{"re": "(apt-get\\s+remove|apt\\s+remove|apt-get\\s+purge)", "note": "That command would REMOVE packages — destructive on live evidence. Listing only."}, {"re": "(systemctl\\s+(stop|restart|reload))", "note": "That command changes service state on a live evidence host. Listing only."}], "canonical": "dpkg -l | grep nginx", "sim": "ii  nginx  1.24.0-2ubuntu7  amd64  high performance web server\nii  nginx-common  1.24.0-2ubuntu7  all  small, powerful web server\nii  nginx-core  1.24.0-2ubuntu7  amd64  nginx core binaries", "canonExpl": ["<span class=\"mono\">dpkg -l</span> — lists installed packages with exact versions (apt list --installed also works).", "<span class=\"mono\">| grep nginx</span> — filters to nginx lines.", "Nothing else — no flags that change state; this is evidence handling."], "hint": "Two stages: list installed packages, then filter. Neither stage may change the system.", "explain": "<b>dpkg -l | grep nginx</b> prints the package lines with exact versions (1.24.0 here — matching the banner the attacker saw). 'apt list --installed | grep nginx' is equally valid. Anything that removes, purges or restarts would alter a live evidence host — the feedback would have flagged it. Version comparison like this is how defenders confirm what T1592.004 collection actually exposed.", "study": "On evidence hosts: listing is reading; everything else needs approval."}, {"id": "h16", "type": "order", "kindLabel": "Prioritization", "title": "Rank the exposures by attacker value", "summary": "Five findings — rank by how much they help the attacker.", "scenario": "Your exposure report has five findings. The CISO wants them ranked by ATTACKER VALUE: which item, in attacker hands, does the most damage to you?", "question": "Rank from most to least valuable to the attacker (top = most valuable).", "items": ["Leaked assessment report listing OS, architecture and language of every client", "Detailed response banners with exact software versions", "Job posting naming a legacy 32-bit fleet", "Status page exposing language and time zone settings", "Generic 'nginx' banner with no version"], "correctSeq": [0, 1, 2, 3, 4], "hint": "Whole-inventory leaks beat single-server banners; exact versions beat hints; nothing beats nothing.", "explain": "The leaked report is a ready-made client-configuration inventory — the entire T1592.004 scope in one document. Exact banners give precise versions to match capabilities against. The job ad narrows the fleet (32-bit). Language and time-zone settings refine lures and timing. A generic banner without a version still confirms the product but gives nothing to match. Ranking is about attacker VALUE, not about how loud the finding sounds.", "study": "In exposure reports, rank by what the attacker can DO with the data."}]};
