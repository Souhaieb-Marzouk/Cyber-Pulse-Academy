<style>

.matchrow{display:grid;grid-template-columns:1fr 240px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--row-dash)}

.hintbox .h{color:var(--accent-amber);font-weight:700}
.exfoot{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

#pauseOverlay .big{font-size:44px;color:var(--state-paused)}

.revlist{list-style:none;margin:10px 0;padding:0}
.revlist li{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bg-surface-2);

.revlist .t{flex:1 1 auto;font-weight:600}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:12px 14px}

.stat.bad .n{color:var(--state-incorrect)}.stat.skip .n{color:var(--state-skipped)}

@media (max-width:640px){

  #prog .fill::after{animation:none;display:none}
  *{transition:none!important;animation:none!important}
}

<script>
window.EXAM = {"meta": {"topicId": "t1547", "batch": 4, "title": "T1547 Boot or Logon Autostart Execution \u2014 EXTREMELY HARD", "difficulty": "extremely-hard", "questionCount": 16, "estimatedMinutes": 65, "passMark": 70}, "severity": {"key": "extremely-hard", "label": "EXTREMELY HARD"}, "timer": {"budgetSeconds": 3900}, "intro": {"objectLine": "T1547 - Boot or Logon Autostart Execution - MITRE ATT&CK Technique - Tactics: Persistence, Privilege Escalation - Platforms: Windows, macOS, Linux", "learn": ["This is the expert level for T1547 - Boot or Logon Autostart Execution. Every earlier habit still applies, but here the artefacts come in sets: four or more at a time, with realistic noise, deliberate red herrings, and at least one gap you must reason around instead of past.", "You will make the calls senior people actually make: which of three hash clusters is explained, urgent, or unresolved; which signal wins when reputation data and behaviour data disagree; whether a verified hardening baseline or a fresh registry artefact is lying; and what to tell a CISO who wants a destructive action you know is wrong.", "One exercise is the dual-perspective core of this whole topic: you emulate persistence from the red side with no admin rights, name the analytic from the blue side, and then decide how a professional behaves when the detection works. Another puts you on a payment-processor jump host with a legal constraint and an in-scenario deadline, where the safe command and the dangerous one are a single flag apart.", "Two exercises will feel uncomfortable by design: one asks you to accept a real business cost in your answer, and one asks you to escalate instead of acting. In this file, 'do nothing yet - gather more evidence' is sometimes the only defensible move, and recognizing when is the skill being tested."], "keywords": [{"t": "Mechanism mastery under pressure", "items": ["T1547.001 layered run key and Startup chains", "T1547.005 Lsa Security Packages load at boot", "T1547.014 Active Setup (HKLM StubPath, HKCU Version)", "T1547.012 print processor contradiction", "T1547.004 Winlogon Shell values", "T1547.015 Login Items on macOS"]}, {"t": "Senior judgement", "items": ["Cluster triage (explained / urgent / unresolved)", "Conflicting signals and which one wins", "Best-practice defaults that fail in context", "Decisions with real business cost", "Escalate-and-gather vs act-now"]}, {"t": "Attribution and reporting", "items": ["Confidence language (support / anchor / certainty)", "TTP overlap limits", "Hunting on artefacts, not names", "Evidence handling for legal scrutiny"]}, {"t": "Detection engineering", "items": ["High-fidelity analytic fields", "Coverage matrix (covered / gap / not applicable)", "Read-only tooling discipline (autorunsc, lsmod | grep)", "Dual-perspective engagement reporting"]}], "how": ["You need 70% to pass. The score counts only the exercises you actually answered.", "This file has 16 exercises: two multi-step decision trees, one terminal task with an in-scenario deadline, multi-select, matching, drag and drop, fill the blank, ordering, and single choice - most built on multi-artefact scenarios with noise and gaps.", "Exercises with several parts give partial credit: each correct part adds credit, each wrong part you select removes credit. The item-by-item feedback after Check is where the real teaching happens - read every row.", "The timer counts down from 65 minutes. Press Pause for a real break: the exercise hides and the timer stops until you press Resume.", "When you press Check, the timer stops automatically so you can study the feedback without pressure. It starts again when you press Next. Skip and Hint do not stop the timer.", "Skipped exercises go to a review pool you can revisit before finishing. Skipped exercises you never answer are excluded from the score.", "One hint per exercise is allowed. A hint costs 10% of that exercise's credit - and it only restates a constraint you may have missed; it never names the answer."]}, "exercises": [{"id": "X01", "type": "branch", "title": "Fleet-wide OneDriveSyncSvc", "summary": "Decision tree: 41 hosts, three hash clusters (4 steps)", "scenario": [{"p": "Day 3 of a watchlist hunt. The value name 'OneDriveSyncSvc' under HKLM Run appeared on 41 hosts across three sites in three days. Three hash clusters emerged, plus one helpdesk fact and one gap."}, {"log": "ARTEFACT 1 - EDR watchlist export", "lines": ["Cluster A  24 hosts  signer: Contoso IT Tools (in-house, CMDB-listed)", "Cluster B  11 hosts  unsigned  C:\\ProgramData\\odsync\\agent.exe  hash new to fleet", "Cluster C   6 hosts  signer: WingTip Software Ltd  (cert issued 3 weeks ago)"]}, {"artefact": "ARTEFACT 2 - Helpdesk ticket HD-8812", "text": "IT operations ran the quarterly laptop provisioning script on 24 hosts this week; the script registers the in-house deployment agent under HKLM Run."}, {"artefact": "ARTEFACT 3 - Gap in the evidence", "text": "Cluster C binaries have made no observed command-and-control connections yet, and the vendor cannot be verified before Monday."}], "question": "Work the four decisions the IR lead needs tonight.", "hint": "Each step depends on your reading of the artefacts: one cluster is explained, one is urgent, one is unresolved - and the CISO's demand collides with all three.", "explain": "Cluster A is explained by the provisioning ticket: marking it expected activity keeps the baseline honest without burning response capacity. Cluster B - unsigned, baseline-new, ProgramData - is the confirmed hostile set and gets immediate containment with power preserved. Cluster C has no C2 evidence and an unverifiable vendor, so the senior call is to gather more evidence, not to act on a signature alone. When the CISO demands a full wipe, the defensible answer is a scoping plan that wipes only cluster B: wiping A and C destroys the evidence trail and burns hours for nothing.", "study": "Practise the senior habit: separate clusters by provenance, decide a different action for each, and put the decision - not the fear - in front of leadership.", "steps": [{"q": "STEP 1 - Cluster A (24 hosts, Contoso IT Tools, matches ticket HD-8812). What is the call?", "options": [{"t": "Mark expected activity, keep it in the baseline, document the ticket link", "why": "Correct - documented provenance means the cluster is explained, not ignored."}, {"t": "Isolate all 24 hosts tonight", "why": "The provisioning ticket explains the artefact; mass isolation burns capacity and trust."}, {"t": "Remove the values from all 24 hosts", "why": "Removing a legitimate deployment agent breaks IT operations for nothing."}, {"t": "Leave it untriaged until B and C are closed", "why": "Untriaged baseline entries poison every future hunt - annotate now."}], "correct": 0}, {"q": "STEP 2 - Cluster B (11 hosts, unsigned, ProgramData, baseline-new). What is the call?", "options": [{"t": "Highest urgency - isolate those 11 hosts, keep them powered on, preserve memory", "why": "Correct - confirmed hostile artefacts get containment that preserves evidence."}, {"t": "Wait for cluster C verification, then act on everything at once", "why": "Confirmed hostility does not wait for an unrelated cluster's paperwork."}, {"t": "Delete the values and binaries on those hosts now", "why": "Deleting before capture destroys exactly the evidence needed to find patient zero."}, {"t": "Reboot all 11 hosts to trigger the payload and watch it", "why": "Rebooting runs the attacker's code and resets volatile state."}], "correct": 0}, {"q": "STEP 3 - Cluster C (6 hosts, three-week-old vendor certificate, no C2 observed, vendor unverifiable until Monday). What is the call?", "options": [{"t": "Gather more evidence and verify the vendor before acting", "why": "Correct - a fresh signature alone is not proof; the incomplete picture demands collection."}, {"t": "Treat as hostile immediately and wipe all 6 hosts", "why": "A fresh cert is suspicious, not conclusive - wiping on it is indefensible if the vendor is real."}, {"t": "Mark it benign - it is signed, and signed means trusted", "why": "Signing is one signal; attacker-controlled certificates exist and the gap must be resolved."}, {"t": "Ignore cluster C - no C2 means no compromise", "why": "Absence of observed C2 is not evidence of absence; the gap is explicitly unresolved."}], "correct": 0}, {"q": "STEP 4 - The CISO wants all 41 hosts wiped tonight. What do you answer?", "options": [{"t": "Escalate with a scoping plan: wipe only confirmed cluster B hosts now", "why": "Correct - defensible, proportionate, and it preserves the evidence trail for A and C."}, {"t": "Wipe all 41 - a CISO order is a CISO order", "why": "Executing a destructive order you know is wrong damages the investigation and the business."}, {"t": "Refuse to act on anything until Monday", "why": "Confirmed cluster B needs action tonight; refusing everything is also wrong."}, {"t": "Wipe cluster A first to show visible progress", "why": "Wiping the documented-benign cluster is the most expensive possible mistake."}], "correct": 0}]}, {"id": "X02", "type": "qcm", "title": "Two verdicts collide", "summary": "EDR says malicious, VirusTotal says clean - which signal wins?", "scenario": [{"p": "Finance workstation WS-114. Your EDR raised a high-severity alert on a run key write. Your colleague pulls the second opinion and wants to close the alert."}, {"log": "ARTEFACT 1 - Alert and enrichment", "lines": ["EDR verdict:   malicious - outlook.exe child wrote HKCU Run value 'OneDriveTray'", "VirusTotal:    0 / 70 engines flag the binary", "Signing:       binary signed 3 days ago; signing certificate created 4 weeks ago", "User context:  lure document 'invoice.docm' opened 4 minutes before the write", "Network:       2 minutes after the write, DNS query to cdn-sync[.]example-net[.]com", "               - domain registered 2 days ago, no other fleet host has ever queried it"]}], "question": "Which interpretation wins, and why?", "hint": "Rank the signals by how hard each is for an attacker to fake: multi-engine file reputation, a certificate's age, and a fresh domain that only this host queries.", "explain": "The fresh domain, the lure-to-write timing, and a weeks-old certificate in attacker context are expensive-to-fake signals; a clean multi-engine verdict is cheap for a novel binary to obtain. The EDR parent-child observation (outlook.exe spawning reg.exe) is exactly the T1547.001 chain. Trust the behavioural chain, not the reputation score.", "study": "Practise weighing signal hardness: reputation caches vs observed behaviour.", "options": [{"t": "VirusTotal is clean, so close the alert", "why": "File reputation is the weakest signal here - novel binaries are clean by definition."}, {"t": "The fresh-domain beacon plus the lure timing outweigh the clean verdict - treat as malicious", "why": "Correct - the hardest-to-fake signals all point one way."}, {"t": "The binary is signed, so it is trusted software", "why": "The certificate is four weeks old in an incident context - signing is not trust."}, {"t": "outlook.exe legitimately spawns sync helpers daily", "why": "Office does not spawn reg.exe writing run keys; that chain is the attack."}], "correct": [1]}, {"id": "X03", "type": "multi", "title": "Active Setup mechanics", "summary": "Select every true statement about the T1547.014 artefact", "scenario": [{"p": "Persistence via Active Setup (T1547.014) is confirmed on SRV-FS-04. The artefact:"}, {"log": "ARTEFACT 1 - Registry extract (SRV-FS-04)", "lines": ["HKLM\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components\\{A5B7C1D2-3E44-5F66-8A99-0B1C2D3E4F50}", "    StubPath = C:\\ProgramData\\msvcp\\upgrade.exe", "HKCU\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components\\{A5B7C1D2-...}", "    Version  = 1,0   (written after the user's first logon)"]}], "question": "Select every true statement about this persistence mechanism.", "hint": "Two registry hives tell the whole story: HKLM defines the command, HKCU records that each user has already run it.", "explain": "Active Setup runs the StubPath command once per user at the user's first logon after the HKLM entry appears; the HKCU Version value records that completion, which is why re-running requires bumping the version. The command runs with the user's rights inside their session - not as SYSTEM before logon - and deleting the HKLM StubPath stops the mechanism.", "study": "Read the T1547.014 description and trace the HKLM-to-HKCU relationship.", "options": [{"t": "StubPath runs once for each user at their first logon after installation", "why": "Correct - per-user, first-logon execution is the mechanism."}, {"t": "Windows marks completion per user under the HKCU Installed Components Version value", "why": "Correct - that Version value is what makes it 'once per user'."}, {"t": "Removing the HKLM StubPath stops the per-user execution", "why": "Correct - without the HKLM command, nothing runs for the next user."}, {"t": "Active Setup runs only when Windows boots, before any user session", "why": "False - it runs inside each user's logon."}, {"t": "StubPath commands run with SYSTEM rights before any user logs in", "why": "False - they run with the user's rights in the user session."}, {"t": "Active Setup is a macOS feature for login items", "why": "False - macOS login items are T1547.015."}], "correct": [0, 1, 2]}, {"id": "X04", "type": "qcm", "title": "The playbook default that fails here", "summary": "Why is 'delete the run key immediately' wrong in this specific incident?", "scenario": [{"p": "Your SOC playbook's first response line for any new run key value reads: 'Delete the value immediately.' The server you are on now tells a different story: the attacker holds SYSTEM rights, and you have already confirmed three other autostart artefacts - a Winlogon Shell entry, an LSA Security Packages entry, and a print processor registration (all T1547 family)."}], "question": "Why is the playbook's immediate deletion the wrong move in this specific context?", "hint": "The playbook was written for a single, low-privilege artefact. Count what the attacker has here.", "explain": "With SYSTEM rights and three other confirmed autostarts, the run key is one thread of a layered persistence web: the attacker re-adds it, and the deletion destroys the artefact you still need to map scope and brief leadership. The correct senior move is preserve-and-scope first, then coordinated removal of every confirmed autostart in one window. The widely used 'delete immediately' best practice assumes a simpler world than this one.", "study": "Read any persistence playbook critically: note which assumptions about attacker privileges it encodes.", "options": [{"t": "Run keys cannot be deleted while their process is running", "why": "False - values can be deleted at any time; the problem is strategy, not mechanics."}, {"t": "It is futile with SYSTEM rights and destroys evidence you still need", "why": "Correct - SYSTEM rights plus layered autostarts make deletion both futile and destructive."}, {"t": "Deleting values always triggers attacker retaliation", "why": "Retaliation is not the issue; evidence loss and re-addition are."}, {"t": "HKLM run keys are read-only to administrators", "why": "False - SYSTEM and admins can write them freely."}], "correct": [1]}, {"id": "X05", "type": "terminal", "title": "Autostart inventory under legal scrutiny", "summary": "Type the autorunsc command: full autostart inventory to CSV, host untouched", "scenario": [{"p": "Payment processor IR. You have one 20-minute slot on compromised jump host PAY-JH-02 before the change freeze. Legal's requirement: the evidence must survive scrutiny, and the host must not be altered. Sysinternals Autoruns CLI (autorunsc.exe) is staged in C:\\IR\\. Accept its licence flag silently, capture every autostart category, and write the output as CSV to C:\\IR\\autostarts.csv. A reduced in-scenario deadline is shown in the terminal panel - the real exam timer governs your score."}], "question": "Type the command that produces the full autostart inventory as CSV, without altering the host.", "hint": "The tool needs three things from you: the licence acceptance flag, the all-categories switch, the CSV switch - and the shell needs the redirect.", "explain": "autorunsc.exe with -accepteula (silent licence), -a (all autostart categories), and -c (CSV output), redirected into the evidence file, is the standard full inventory: it touches nothing on the host except creating the output file. The dangerous near-misses are deletion commands - they alter the host and destroy exactly the artefacts legal needs. The canonical command is autorunsc.exe -accepteula -a * -c > C:\\IR\\autostarts.csv.", "study": "Learn the autorunsc switches -accepteula, -a, -c, -ct, and practise the difference between running it and importing its output elsewhere.", "term": {"prompt": "C:\\IR>", "canonical": "autorunsc.exe -accepteula -a * -c > C:\\IR\\autostarts.csv", "out": ["", "Autoruns entry,Item,Image Path,Signer", "Logon,OneDriveSyncSvc,C:\\ProgramData\\odsync\\agent.exe,(not signed)", "Logon,OneDrive,\"C:\\Program Files\\Microsoft OneDrive\\OneDrive.exe\" /background,Microsoft", "LSA Providers,websec,C:\\Windows\\System32\\websec.dll,(not signed)", "Print Monitors,udpr,C:\\Windows\\System32\\spool\\prtprocs\\x64\\udpr.dll,(not signed)"], "deadline": 1200, "elements": [{"all": ["autorunsc"], "desc": "autorunsc.exe - the Sysinternals autostart enumeration tool", "why": "One tool, every autostart location - including the ones reg query alone would miss."}, {"all": ["-accepteula"], "desc": "the -accepteula licence flag", "why": "Accepting the EULA silently keeps the run unattended and non-interactive."}, {"all": [" -a "], "desc": "the -a switch for all autostart categories", "why": "Legal asked for the full inventory - one category would be an incomplete exhibit."}, {"all": ["-c"], "desc": "the -c switch for CSV output", "why": "CSV is the format the evidence file and the review tooling expect."}, {"all": [">", "autostarts.csv"], "desc": "the redirect into C:\\IR\\autostarts.csv", "why": "The shell redirect writes the exhibit file without touching the host's configuration."}], "forbid": [{"any": ["reg delete", "reg add", "del ", "rmdir", "rd ", "format"], "desc": "state-changing or destructive commands", "danger": true, "why": "Legal requires the host unaltered - any deletion or modification destroys the evidence chain."}], "syntax": null}}, {"id": "X06", "type": "multi", "title": "Attribution discipline", "summary": "Select every defensible statement about attributing the artefact set", "scenario": [{"p": "An EU foreign ministry engaged you after quiet, long-dwell activity. The artefact set: a Winlogon Shell value under HKCU pointing beside explorer.exe, and a Linux kernel module named binfmt_ext on the ministry's one legacy jump host. Two vendors have published overlapping TTP sets."}], "question": "Select every statement that is defensible to put in your report.", "hint": "Attribution language has grades: support, anchor, certainty. Only one grade is available from TTP overlap alone.", "explain": "TTP overlap supports - but never proves - attribution; tooling and infrastructure can be shared, stolen, or deliberately copied. The kernel module is a strong anchor because Linux rootkit persistence is rare and comparable across reports. And the operational rule holds: hunt on techniques and artefacts, because names change and artefacts do not. Certainty claims and delaying removal for attribution are both indefensible.", "study": "Practise writing attribution statements with explicit confidence language.", "options": [{"t": "TTP overlap with the published set supports attribution, but TTPs alone cannot prove it", "why": "Correct - support-grade language is the defensible ceiling here."}, {"t": "The Linux kernel module is rare enough to be a strong anchor for comparison", "why": "Correct - rare artefacts carry more attribution weight than common ones."}, {"t": "Hunt on the techniques and artefacts, not only on the group name", "why": "Correct - names churn; artefacts and techniques stay stable."}, {"t": "The Winlogon Shell value proves the attacker is Turla with certainty", "why": "Over-claiming - single-technique overlap is never certainty."}, {"t": "Attribution should delay removing the autostart entries", "why": "Indefensible - containment and evidence work do not wait on naming."}, {"t": "Kernel modules are the most common persistence mechanism on Windows", "why": "Factually wrong - and the module here was found on Linux."}], "correct": [0, 1, 2]}, {"id": "X07", "type": "dnd", "title": "Coverage matrix triage", "summary": "Drag six technique rows into covered, gap, or not-applicable", "scenario": [{"p": "The environment: Windows laptops and servers (analytic on Run keys and Winlogon values, EDR file rules for System32 only), two macOS executive laptops with no detection, no Linux hosts at all. The detection engineering lead wants the T1547 rows triaged before the quarterly review."}], "question": "Drag each row into the right bucket.", "hint": "Coverage means an analytic would actually fire on that artefact in THIS fleet - not that the technique is theoretically detectable.", "explain": "Run keys and Winlogon values are covered by the registry analytic. Active Setup and print processors are real Windows exposures with no analytic - genuine gaps. The macOS Login Items row is a gap because the platform exists but nothing watches it. XDG autostart is not applicable: there are no Linux hosts, so there is nothing to cover.", "study": "Build this exact three-bucket matrix for your own environment every quarter.", "zones": ["Covered by current controls", "Gap - needs a new detection", "Not applicable - platform not in fleet"], "items": [{"txt": "T1547.001 run keys - registry analytic in place", "zone": 0, "why": "The analytic watches Run keys in both hives."}, {"txt": "T1547.013 XDG autostart - fleet has no Linux desktops", "zone": 2, "why": "No Linux hosts means no exposure to cover."}, {"txt": "T1547.015 Login Items - two macOS laptops, nothing watches them", "zone": 1, "why": "The platform exists and is unwatched - a real gap."}, {"txt": "T1547.014 Active Setup - Windows fleet, no analytic", "zone": 1, "why": "Real Windows exposure with no detection - a real gap."}, {"txt": "T1547.004 Winlogon values - registry analytic covers the key", "zone": 0, "why": "The analytic extends to the Winlogon values."}, {"txt": "T1547.012 print processors - only System32 file rules exist", "zone": 1, "why": "No registry watch on the prtprocs key - a real gap."}]}, {"id": "X08", "type": "qcm", "title": "The baseline contradicts the artefact", "summary": "Spooler disabled by baseline, yet a print processor appears - which wins?", "scenario": [{"p": "All domain controllers have the print spooler service disabled per the hardening baseline - verified last month. DC-02 now shows a new DLL registered under Print Processors, with a registry write timestamp recorded after the last reboot. The service-control log shows no start event for spoolsv.exe since the reboot."}], "question": "Which interpretation wins, and what do you do?", "hint": "When a verified control and a fresh artefact contradict each other, the contradiction itself is the finding.", "explain": "Two signals conflict: the baseline says the mechanism cannot run, the registry says it was registered. The senior read: either the spooler was silently re-enabled and re-disabled, or someone wrote the key directly - both are incidents in their own right. Verify the service configuration now (config change history, group policy results), investigate the writer process, and treat the baseline exception as part of the incident, not as a reason to dismiss the artefact.", "study": "Practise resolving artefact-versus-control conflicts by interrogating the control's own logs first.", "options": [{"t": "False positive - the spooler is disabled, so the key cannot be used", "why": "Dismissal ignores that the write happened; a dead trigger is still a planted one."}, {"t": "Print processors run even when the spooler is off - treat as fully exploitable", "why": "Over-reach - without the service running, the load does not happen; the mechanism is the mystery."}, {"t": "The baseline is broken - verify the service state and hunt whoever wrote the key", "why": "Correct - the contradiction is the finding; interrogate both signals."}, {"t": "Delete the key and close the alert as resolved", "why": "Destroys the artefact and the opportunity to find how the baseline was bypassed."}], "correct": [2]}, {"id": "X09", "type": "multi", "title": "Fields for a high-fidelity analytic", "summary": "Select every field the run key write analytic needs", "scenario": [{"p": "Detection engineering review. The current analytic fires on every write to CurrentVersion\\Run and analysts drown. The rewrite must be high-fidelity: few false positives, no blind spots. Select every field the rewritten analytic needs to evaluate."}], "question": "Select every field the rewritten analytic needs.", "hint": "Fidelity comes from four families: where the write landed, what it wrote, who wrote it, and what the written thing is.", "explain": "The target path says which key was touched; the value name and new data say what will run; the writing process and its parent say whether the writer is an installer or something suspicious; and the signature state of the written binary separates vendor updates from unsigned drops. Metrics like CPU or mailbox counters correlate with nothing here - they add noise, not fidelity.", "study": "Write the four families into your next analytic review: target, payload, writer, payload quality.", "options": [{"t": "The TargetObject registry path of the write", "why": "Correct - which key and value were touched."}, {"t": "The value name and the new data written", "why": "Correct - what will run at logon."}, {"t": "The writing process and its parent process", "why": "Correct - installer vs suspicious writer."}, {"t": "The code-signing state of the binary the data points to", "why": "Correct - payload quality signal."}, {"t": "The DNS query of the hour report", "why": "Unrelated telemetry that adds noise."}, {"t": "Total CPU percent at alert time", "why": "Correlates with nothing in the persistence event."}, {"t": "The number of unread emails in the user's mailbox", "why": "Mailbox state is irrelevant to the registry write."}], "correct": [0, 1, 2, 3]}, {"id": "X10", "type": "fill", "title": "Complete the IR report line (Active Setup)", "summary": "Fill the blank: the sub-technique number for the StubPath artefact", "scenario": [{"p": "You are finishing the SRV-FS-04 report. The third confirmed mechanism used a StubPath value under Active Setup Installed Components (see the mechanism you classified in the earlier exercise). The report style guide wants the numeric sub-technique suffix."}], "question": "Complete the report sentence with the sub-technique number.", "hint": "Active Setup is the second-to-last sub-technique in the T1547 list - its suffix is the highest two-digit number you have seen in this exam family besides Login Items.", "explain": "The full ID is T1547.014. Precise suffixes matter downstream: detection content, dashboards, and threat-profile rows all key on the exact sub-technique number.", "study": "Memorise the suffixes you met: 001, 002, 003, 004, 005, 006, 009, 010, 012, 013, 014, 015.", "blanks": [{"name": "id14", "pre": "IR report line: 'Third mechanism: T1547.", "post": " (Active Setup) - a StubPath value under Installed Components points to C:\\ProgramData\\msvcp\\upgrade.exe.'", "answers": ["014", "14"], "why": "Active Setup is T1547.014.", "width": 6}]}, {"id": "X11", "type": "branch", "title": "Red and blue on the same run key", "summary": "Dual-perspective decision tree: emulate, detect, report (3 steps)", "scenario": [{"p": "Authorized red-team engagement at a SaaS company. The target workstation runs the EDR in detect mode; your lab tenant is isolated; the engagement's written goal is to demonstrate persistence and document every detection the blue team produces. You have no admin rights on the target."}], "question": "Make the three calls - red, blue, and red again.", "hint": "Step 1 is pure trade-off, step 2 is telemetry, step 3 is professionalism: the engagement goal constrains what 'winning' means.", "explain": "Red side: without admin, HKCU is the only honest option - print processors need SeLoadDriverPrivilege, LSA packages need admin and Protected Process Light blocks unsigned DLLs, and kernel modules are the wrong platform. Blue side: the analytic that catches it correlates the writer process, its parent, and the unsigned payload path. Red side again: the goal was to test detection, so the professional move is to document the detection with exact artefacts - escalating to stealth techniques or deleting evidence would betray the engagement's purpose.", "study": "Practise writing engagement findings from both chairs: what you did, what it touched, what detected it.", "steps": [{"q": "STEP 1 (red) - No admin rights on the target. Which autostart do you use for the demonstration?", "options": [{"t": "An HKCU run key value pointing at your payload", "why": "Correct - user-writable, no admin, honest fit to the foothold."}, {"t": "A print processor DLL registration", "why": "Needs SeLoadDriverPrivilege and admin - outside your foothold."}, {"t": "An LSA security package entry", "why": "Needs admin, and Protected Process Light blocks unsigned LSA DLLs."}, {"t": "A Linux kernel module", "why": "Wrong platform - the target is a Windows workstation."}], "correct": 0}, {"q": "STEP 2 (blue) - The blue team must name the analytic that caught it. Which one fires?", "options": [{"t": "New-process write to a Run key from an unusual parent, with an unsigned binary path", "why": "Correct - writer, parent, and payload quality are the three high-fidelity fields."}, {"t": "Network volume anomaly on the VPN gateway", "why": "VPN volume says nothing about the registry write."}, {"t": "Kerberos ticket anomaly for the test account", "why": "Authentication telemetry does not observe autostart registration."}, {"t": "Host firewall drops of SMB broadcasts", "why": "SMB broadcast filtering is unrelated to run key persistence."}], "correct": 0}, {"q": "STEP 3 (red) - Your run key was flagged within minutes. The engagement's goal is to test detection, not to evade it. What is the correct next move?", "options": [{"t": "Document the detection and stop - report the finding with the exact artefacts", "why": "Correct - the engagement goal defines success, and the detection worked."}, {"t": "Switch to an LSA package to hide better", "why": "Escalating beyond the authorized foothold betrays scope and breaks rules."}, {"t": "Delete the run key and re-run the same technique", "why": "Deleting evidence corrupts the very finding the blue team needs."}, {"t": "Brute-force the analytic signature until it stops firing", "why": "Evasion was not the engagement objective - and it damages trust."}], "correct": 0}]}, {"id": "X12", "type": "qcm", "title": "Verdict under incomplete evidence", "summary": "The host was reimaged early - what is the defensible verdict path?", "scenario": [{"p": "A junior analyst reimaged WS-77 thirty minutes after the first alert, following the playbook. Log retention on the host is 7 days; the EDR cloud console and the SIEM still hold the raw events; the proxy retains 30 days. The only local artefacts are one screenshot of a Run key value and the original alert. The CISO wants a verdict in the incident call now."}], "question": "What is the defensible verdict path?", "hint": "Local evidence is gone, but the run key write was observed by two central sources that survive the reimage.", "explain": "The screenshot shows the art       });
      (T.forbid || []).forEach(function (f) {
        var hit = f.any.some(function (sub) { return cmd.indexOf(sub.toLowerCase()) !== -1; });
        if (hit) {

  /* ---------------- check / next / skip / hint ---------------- */
  function onCheck() {
    var inst = curInst();
    if (!inst || inst.graded) return;
    if (inst.ex.type === 'branch' && inst.step < inst.ex.steps.length - 1) {
      if (inst._pick == null || inst._pickStep !== inst.step) return;
      inst.stepAns[inst.step] = inst._pick;
      inst.step++; inst._pick = null; inst._pickStep = null;
      renderEx(); return;
    }
    setT('PAUSED_AUTO_CHECK');
    if (inst.ex.type === 'branch' && inst._pick != null && inst._pickStep === inst.step && inst.stepAns[inst.step] === -1) {
      /* record the final step's choice before grading (intermediate steps already stored theirs) */
      inst.stepAns[inst.step] = inst._pick;
    }
    var res = grade(inst);
    res.base = res.credit;
    if (S.hints[inst.ex.id]) res.credit = Math.max(0, res.credit - 0.10);
    inst.graded = true; inst.lastRes = res;
    S.credits[inst.ex.id] = res.credit;
    S.bases[inst.ex.id] = res.base;
    S.answered[inst.ex.id] = true;
    delete S.skipped[inst.ex.id];
    renderEx();
  }
  function showFeedback(inst, res, silent) {

    var eff = (res.base == null) ? res.credit : res.base;
    var cls = eff >= 0.999 ? 'ok' : (eff > 0 ? 'part' : 'bad');
    var lbl = eff >= 0.999 ? '\u2713 CORRECT' : (eff > 0 ? '\u2713 PARTIALLY CORRECT' : '\u2717 INCORRECT');
    var f = el('div', 'fbk ' + cls);
    var hh = el('div', 'fbk-h');
    hh.innerHTML = esc(lbl) + ' <span class="credit">credit ' + (Math.round(res.credit * 100) / 100).toFixed(2) + '</span>' +
      (res.danger && res.danger.length ? ' <span class="badge bad">\u2717 DANGEROUS \u2014 NEAR MISS</span>' : '');
    f.appendChild(hh);
    var multi = ['multi', 'match', 'dnd', 'fill', 'order', 'terminal', 'branch'].indexOf(ex.type) !== -1;
    if (multi && res.rows.length) {
      var ul = el('ul', 'items');
      res.rows.forEach(function (r) {
        var li = el('li');
        var vmap = { ok: '\u2713 Correct', bad: '\u2717 Wrong', miss: '\u25CB Missed', danger: '\u2717 Dangerous' };
        li.innerHTML = '<span class="v ' + r.v + '">' + vmap[r.v] + '</span><span><b>' + r.t + '</b>' +
          (r.why ? ' \u2014 ' + esc(r.why) : '') + '</span>';
        ul.appendChild(li);
      });
      f.appendChild(ul);
    } else if (ex.type === 'qcm') {
      var ci = ex.correct[0];
      var p = el('p', 'why');
      p.innerHTML = 'Correct answer: <b>' + esc(ex.options[ci].t) + '</b>';
      f.appendChild(p);
    }
    var why = el('p', 'why'); why.innerHTML = esc(res.explain || ex.explain || '');
    f.appendChild(why);
    if (res.canonical) {
      var cb = el('div');
      cb.innerHTML = '<div class="sec-note">Canonical command (copyable):</div><pre class="code">' + esc(res.canonical) + '</pre>';
      f.appendChild(cb);
      var T = ex.term;
      var ul2 = el('ul', 'items');
      T.elements.forEach(function (e2) {
        var li = el('li');
        li.innerHTML = '<span class="v miss">\u25B8 Part</span><span>' + esc(e2.desc) + (e2.why ? ' \u2014 ' + esc(e2.why) : '') + '</span>';
        ul2.appendChild(li);
      });
      f.appendChild(ul2);
    }
    if (eff < 0.999 && ex.study) {
      var st = el('div', 'study');
      st.innerHTML = '<span class="h">What to study:</span> ' + esc(ex.study);
      f.appendChild(st);
    }
    holder.appendChild(f);
    var bn = document.getElementById('btnNext');
    bn.style.display = 'inline-flex';
    bn.textContent = (S.pos === S.order.length - 1 && !S.reviewReturn)
      ? ((skippedOpen() > 0) ? 'Final Submit \u2192 review skipped' : 'Final Submit \u2192 results')
      : 'Next \u2192';
    var bc = document.getElementById('btnCheck');
    bc.disabled = true;
    renderHdr();
    if (!silent) {
      try { f.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'nearest' }); } catch (e) {}
    }
  }

  /* override: attach explain after grade (kept simple) */
  var _grade = grade;
  grade = function (inst) {
    var r = _grade(inst);
    r.explain = inst.ex.explain;
    return r;
  };

  function onNext() {
    var inst = curInst();
    if (!inst || !inst.graded) return;
    if (S.reviewReturn) { S.reviewReturn = false; showReview(); return; }
    if (S.pos < S.order.length - 1) {
      S.pos++; setT('RUNNING'); renderEx();
      window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
    } else {
      if (skippedOpen() > 0 && S.remain > 0) { showReview(); }
      else { showResults(); }
    }
  }
  function onSkip() {
    var inst = curInst();
    if (!inst || inst.graded) return;
    S.skipped[inst.ex.id] = true;
    if (S.reviewReturn) { S.reviewReturn = false; showReview(); return; }
    if (S.pos < S.order.length - 1) { S.pos++; renderEx(); }
    else if (skippedOpen() > 0) { showReview(); }
    else { showResults(); }
    renderHdr();
  }
  function onHint() {
    var inst = curInst();
    if (!inst || inst.graded || S.hints[inst.ex.id]) return;
    S.hints[inst.ex.id] = true;
    var hb = document.getElementById('hintBox');
    document.getElementById('hintTxt').textContent = inst.ex.hint || '';
    hb.style.display = 'block';
    document.getElementById('btnHint').disabled = true;
  }
  function onPause() {
    if (S.tState === 'RUNNING' || S.tState === 'PAUSED_AUTO_CHECK') {
      S.manualFrom = S.tState;
      setT('PAUSED_MANUAL');
      var ov = document.getElementById('pauseOverlay');
      ov.style.display = 'flex';
    }
  }
  function onResume() {
    var ov = document.getElementById('pauseOverlay');
    ov.style.display = 'none';
    setT(S.manualFrom || 'RUNNING');
    S.manualFrom = null;
  }
  function finishTimeout() {
    stopClock();
    var inst = curInst();
    if (inst && !inst.graded && S.view === 'exam') S.skipped[inst.ex.id] = true;
    S.timeoutHit = true;
    showResults();
  }

  /* ---------------- review skipped ---------------- */
  function showReview() {
    S.view = 'review'; S.reviewReturn = false;
    document.getElementById('examView').style.display = 'none';
    document.getElementById('resultsView').style.display = 'none';
    var v = document.getElementById('reviewView');
    v.style.display = 'block';
    var h = '<div class="card"><h2>\u26A0 Review skipped exercises</h2>' +
      '<p class="sec-note">The timer is still running. You can answer a skipped exercise now, or final-submit and leave it out of the score.</p><ul class="revlist">';
    S.order.forEach(function (idx, pos) {
      var ex = EXS[idx];
      if (S.skipped[ex.id] && !S.answered[ex.id]) {
        h += '<li><span class="badge skip">\u26A0 Skipped</span><span class="t">' + esc(ex.title) + '</span>' +
          '<button class="btn amber" data-pos="' + pos + '">\u2192 Answer now</button></li>';
      }
    });
    h += '</ul><div class="exfoot">' +
      '<button class="btn primary" id="btnFinalGo">\u2713 Final submit anyway (' + skippedOpen() + ' excluded)</button></div></div>';
    v.innerHTML = h;
    v.querySelectorAll('button[data-pos]').forEach(function (b) {
      b.addEventListener('click', function () {
        S.pos = parseInt(b.getAttribute('data-pos'), 10);
        S.reviewReturn = true; S.view = 'exam';
        v.style.display = 'none';
        document.getElementById('examView').style.display = 'block';
        setT('RUNNING'); renderEx();
      });
    });
    document.getElementById('btnFinalGo').addEventListener('click', showResults);
    setT('RUNNING');
    renderHdr();
  }

  /* ---------------- results ---------------- */
  function showResults() {
    if (S.tState !== 'ENDED') { setT('ENDED'); stopClock(); }
    S.view = 'results';
    document.getElementById('examView').style.display = 'none';
    document.getElementById('reviewView').style.display = 'none';
    var v = document.getElementById('resultsView');
    v.style.display = 'block';
    var full = 0, part = 0, bad = 0, skip = 0, partSum = 0;
    EXS.forEach(function (ex) {
      if (S.answered[ex.id]) {
        var b = (S.bases[ex.id] != null) ? S.bases[ex.id] : (S.credits[ex.id] || 0);
        var c = S.credits[ex.id] || 0;
        if (b >= 0.999) full++;
        else if (b > 0) { part++; partSum += c; }
        else bad++;
      } else { skip++; }
    });
    var answered = full + part + bad;
    var sum = 0; EXS.forEach(function (ex) { if (S.answered[ex.id]) sum += (S.credits[ex.id] || 0); });
    var percent = answered ? Math.round(sum / answered * 100) : 0;
    var pass = percent >= CFG.meta.passMark;
    var avg = part ? Math.round(partSum / part * 100) / 100 : 0;
    var h = '<div class="card"><h2>Results \u2014 ' + esc(CFG.meta.title) + '</h2>' +
      '<p class="score-line">Score <b>' + (Math.round(sum * 10) / 10).toFixed(1) + '</b> / ' + answered + ' answered \u2014 <b>' + percent + '%</b> (pass mark ' + CFG.meta.passMark + '%)</p>' +
      (S.timeoutHit ? '<p class="sec-note">\u23F1 Time ran out \u2014 unanswered exercises were excluded from the score.</p>' : '') +
      '<div class="statgrid">' +
      stat(full, '\u2713 Fully correct', 'ok') +
      stat(part, '\u2713 Partially correct' + (part ? ' \u00b7 avg ' + avg : ''), 'part') +
      stat(bad, '\u2717 Fully incorrect', 'bad') +
      stat(skip, '\u26A0 Skipped \u2014 excluded', 'skip') +
      '</div>';
    h += '<p class="sec-note">\u23F8 Time paused manually: ' + fmtTime(S.pauseManualMs / 1000) +
      ' \u00b7 \u23F8 Time reviewing feedback: ' + fmtTime(S.pauseAutoMs / 1000) + '</p>';
    if (pass) {
      h += '<div class="verdict pass"><div class="big">\u2713 PASS</div>' +
        '<p>Certificate-style result: you reached ' + percent + '%, above the ' + CFG.meta.passMark + '% pass mark. Well done \u2014 you can now take the next severity file for ' + esc(CFG.meta.topicId.toUpperCase()) + '.</p></div>';
      h += '<div class="exfoot"><button class="btn primary" id="btnRetake">\u21BA Retake exam (new shuffle)</button></div>';
    } else {
      h += '<div class="verdict fail"><div class="big">\u2717 FAIL</div>' +
        '<p>' + percent + '% is below the ' + CFG.meta.passMark + '% pass mark. You must retake this exam. Study the "What to study" hints, then try again \u2014 the questions and answers will be shuffled.</p></div>';
      h += '<div class="exfoot"><button class="btn primary big" id="btnRetake">\u21BA Retake exam</button></div>';
    }
    h += '</div>';
    v.innerHTML = h;
    document.getElementById('btnRetake').addEventListener('click', startExam);
    renderHdr();
    reportScore(sum, answered, percent, pass);
  }
  function stat(n, l, cls) {
    return '<div class="stat ' + cls + '"><div class="n">' + n + '</div><div class="l">' + esc(l) + '</div></div>';
  }
  function reportScore(sum, answered, percent, pass) {
    if (S.reported) return;
    S.reported = true;
    if (window.parent === window && location.protocol === 'file:') {
      /* Opened directly from disk: parent is this page itself, nothing to report to. */
      return;
    }
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: CFG.meta.topicId,
        batch: CFG.meta.batch,
        score: Math.round(sum),
        total: answered,
        percent: percent,
        passed: percent >= CFG.meta.passMark
      }, location.origin);
    } catch (e) { /* opened directly \u2014 nothing to report to */ }
  }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) return;
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
    S.user = event.data.username || null;
    /* theme field is always 'dark'; the file is dark-only by contract, nothing to switch */
  });

  /* ---------------- wire up ---------------- */
  function boot() {
    renderIntro();
    document.getElementById('btnSkip').addEventListener('click', onSkip);
    document.getElementById('btnHint').addEventListener('click', onHint);
    document.getElementById('btnPause').addEventListener('click', onPause);
    document.getElementById('btnResume').addEventListener('click', onResume);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
