window.CM_META = {"topicId": "t1685.004", "batch": 1, "title": "T1685.004 Disable or Modify Linux Audit System Log — EASY", "difficulty": "easy", "questionCount": 16, "estimatedMinutes": 28, "passMark": 70, "sev": "easy", "sevName": "EASY", "sevColor": "#57d38c", "objId": "T1685.004", "objName": "Disable or Modify Linux Audit System Log", "objLine": "T1685.004 — Disable or Modify Linux Audit System Log", "objType": "Sub-Technique", "timerMinutes": 28, "timerSeconds": 1680, "partLabel": null, "keywords": [{"theme": "Technique fundamentals", "items": ["T1685.004 — Disable or Modify Linux Audit System Log", "Sub-technique of T1685 — Disable or Modify Tools", "Tactic TA0005 — Defense Evasion", "Platform: Linux", "Permission required: root", "Goal: hide activity, avoid detection"]}, {"theme": "The Linux Audit system (components)", "items": ["auditd — the logging daemon", "auditctl — the rule utility", "/etc/audit/audit.rules — rules loaded at boot", "audit.conf — daemon settings", "/var/log/audit/audit.log — the log file"]}, {"theme": "How attackers do it (basic paths)", "items": ["systemctl stop auditd", "Killing the auditd process", "auditctl -D (delete all rules)", "Editing audit.rules or audit.conf"]}, {"theme": "What data it produces (telemetry basics)", "items": ["Command execution", "Process termination", "File modification", "Service metadata (state changes)"]}, {"theme": "Basic defences", "items": ["M1018 — User Account Management (limit root)", "M1047 — Audit (review audit settings)", "Send logs to a central log server", "Log-source health monitoring"]}], "types": ["Multiple-choice questions (pick one answer)", "Multi-select questions (pick two — scored with partial credit)", "Matching (link items to their meaning)", "Fill-in-the-blank (pick words from a shuffled bank)", "Sort commands into bins (click or drag & drop)", "Order the timeline (put steps in sequence)", "One guided terminal exercise (type a simple read-only command)"], "learnTitle": "What you will learn here", "learnBody": "<p><b>This is part of your Linux defence-evasion training.</b> This exam is about one specific ATT&CK object: <b>T1685.004 — Disable or Modify Linux Audit System Log</b>. In MITRE ATT&CK, this object is a <b>Sub-Technique</b>. That means it is one specific way of doing a bigger job. Its parent technique is <b>T1685 — Disable or Modify Tools</b>, and its tactic (the attacker goal it serves) is <b>TA0005 — Defense Evasion</b>: the phase where the attacker tries to avoid being seen.</p><p>Imagine you are a SOC analyst. A Linux server writes security logs through a built-in system called the <b>Linux Audit system</b>. The daemon that writes these logs to disk is called <b>auditd</b>. Admins set what gets logged with the <b>auditctl</b> command and with the rule file <b>/etc/audit/audit.rules</b>. Settings live in <b>audit.conf</b>.</p><p>An attacker with <b>root</b> privileges (full administrator power on Linux) can stop the auditd service, delete the audit rules, or edit the rule files — so their next steps leave no logs behind. In this exam you will learn to recognise that behaviour, name it with the right ATT&CK ID, and say which simple defences and data sources matter.</p><p><b>Where you will meet this object at work:</b> SOC analysts triage the alerts it produces; threat hunters look for the commands and events behind it; incident responders check whether logs went dark during an intrusion; CTI analysts write reports that name the technique; detection engineers build alerts from the telemetry; GRC analysts map defences like M1018 User Account Management and M1047 Audit to it; and red teamers test the controls in a safe way. The risks it addresses are simple: if logs can be switched off, attackers get quiet time to work.</p>"};
window.CM_EXERCISES = [{"id": "easy-01-id-card", "type": "mcq", "tag": "ATT&CK card reading", "summary": "Read an ATT&CK excerpt card and pick the correct technique ID", "scenario": [{"k": "text", "label": "ARTEFACT 1 — ATT&CK excerpt card", "text": "Technique ID: T1685.004\nName: Disable or Modify Linux Audit System Log\nParent: T1685 — Disable or Modify Tools\nTactic: TA0005 — Defense Evasion\nPlatform: Linux\nPermissions required: root\nSummary: Adversaries may disable or modify the Linux Audit system to hide malicious activity and avoid detection."}], "question": "Which ATT&CK ID does this excerpt card show?", "hint": "This is about the sub-technique that hides attacker actions on Linux by touching the audit logging system. The ID is printed at the top of the card.", "explain": "The card names T1685.004, the sub-technique \"Disable or Modify Linux Audit System Log\". T1562.001 is a different (older-style) impair-defences entry, T1070.002 is about clearing existing logs, and TA0005 is a tactic (a goal), not a technique ID. Reading the ID block of an ATT&CK card is the first habit of every SOC analyst.", "study": "Practise reading ATT&CK technique cards: ID, name, parent, tactic, platforms, permissions.", "options": [{"t": "T1685.004 — Disable or Modify Linux Audit System Log", "correct": true}, {"t": "T1562.001 — Impair Defenses: Disable or Modify Tools", "correct": false}, {"t": "T1070.002 — Clear Linux or Mac System Logs", "correct": false}, {"t": "TA0005 — Defense Evasion (a tactic)", "correct": false}]}, {"id": "easy-02-components", "type": "match", "tag": "Linux Audit system parts", "summary": "Match each Linux Audit system component to what it does", "scenario": [{"k": "text", "label": "ARTEFACT 1 — New-starter note from your team lead", "text": "Welcome aboard! Before you touch any Linux alerts, learn these four names. One is the program that writes audit events to disk. One is the command tool admins use to set rules live. One file holds the rules that load at boot. One file holds settings like log size and what to do when the disk is full."}], "question": "Match each component on the left to its job on the right.", "hint": "Think about which part runs all the time (daemon), which part is typed by a person (command), and which two are files (rules vs settings).", "explain": "auditd is the daemon — the background program that writes events to /var/log/audit/audit.log. auditctl is the command-line utility used to add, list, or delete audit rules while the system runs. /etc/audit/audit.rules is the rules file loaded at boot. audit.conf is the configuration file for auditd itself (for example maximum log file size). Knowing which piece is which tells you exactly what an attacker touched.", "study": "Re-read the component names in the intro: auditd, auditctl, audit.rules, audit.conf.", "items": [{"l": "auditd", "r": "The daemon that writes audit events to disk"}, {"l": "auditctl", "r": "The command-line utility used to set audit rules live"}, {"l": "/etc/audit/audit.rules", "r": "The file of audit rules loaded at boot time"}, {"l": "audit.conf", "r": "The file with auditd settings like log file size"}]}, {"id": "easy-03-tactic", "type": "mcq", "tag": "Matrix position", "summary": "Pick the tactic that T1685.004 belongs to", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Question from a junior analyst", "text": "You show a teammate the ATT&CK card for T1685.004 — Disable or Modify Linux Audit System Log. They ask: \"Which tactic does this belong to? I want to place it correctly on the matrix.\""}], "question": "Which tactic does T1685.004 belong to?", "hint": "The attacker goal here is not getting in or stealing data — it is not being seen. That is one specific tactic.", "explain": "T1685.004 sits in TA0005 — Defense Evasion. The goal of the behaviour is to avoid detection by breaking the logging system. Initial Access is about getting in, Execution is about running code, and Collection is about gathering data. Stopping or changing security logging is a classic Defense Evasion action.", "study": "Look at the Defense Evasion tactic page and find the Disable or Modify Tools family.", "options": [{"t": "TA0005 — Defense Evasion", "correct": true}, {"t": "TA0001 — Initial Access", "correct": false}, {"t": "TA0002 — Execution", "correct": false}, {"t": "TA0009 — Collection", "correct": false}]}, {"id": "easy-04-permission", "type": "mcq", "tag": "Access requirements", "summary": "Pick the permission an attacker needs to stop the Linux Audit system", "scenario": [{"k": "text", "label": "ARTEFACT 1 — ATT&CK card line", "text": "T1685.004 — Disable or Modify Linux Audit System Log\nPermissions required: ___\n\nYour teammate asks: \"Could any normal user account do this, or do they need full power on the box?\""}], "question": "Which permission does the ATT&CK card require for this technique?", "hint": "The audit service and its rule files are protected. On Linux, full administrator power is called root.", "explain": "The technique requires root privileges. Stopping the auditd service, changing /etc/audit/audit.rules, or running auditctl to delete rules are administrator actions that a normal user cannot do. That is why account management (who can become root or use sudo) is the main mitigation.", "study": "M1018 — User Account Management: limiting admin rights limits this technique.", "options": [{"t": "root (full administrator privileges)", "correct": true}, {"t": "Any normal user account", "correct": false}, {"t": "Guest session access", "correct": false}, {"t": "Read-only access to one folder", "correct": false}]}, {"id": "easy-05-fill-components", "type": "fill", "tag": "Key files and tools", "summary": "Complete the summary sentence about how audit logging works", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Sentence for your study notes", "text": "Complete this sentence for your notes. Pick one word for each blank from the bank. The bank is shuffled."}], "question": "Fill in the three blanks to complete the sentence correctly.", "hint": "Blank 1 is the daemon name, blank 2 is the live rule tool, blank 3 is the file extension used by the settings file.", "explain": "The full sentence reads: \"The auditd daemon writes events to /var/log/audit/audit.log. Admins set rules with auditctl or by editing /etc/audit/audit.rules, and auditd settings live in audit.conf.\" These four names — auditd, auditctl, audit.rules, audit.conf — are the core vocabulary for this technique.", "study": "Say the four component names out loud until you can write them from memory.", "segs": ["The ", {"b": 0}, " daemon writes events to /var/log/audit/audit.log. Admins set rules with ", {"b": 1}, " or by editing /etc/audit/audit.rules, and daemon settings live in audit.", {"b": 2}, "."], "blanks": ["auditd", "auditctl", "conf"], "bank": ["auditd", "auditctl", "conf", "sshd", "syslog", "rules", "kern"]}, {"id": "easy-06-command-bins", "type": "assign", "tag": "Command triage", "summary": "Sort three commands into what each one does to the audit system", "scenario": [{"k": "text", "label": "ARTEFACT 1 – Bash history lines from host web-prod-02", "text": "A nightly job exports the shell history of the root account. Three lines matter to you:\n\nsystemctl stop auditd\nauditctl -D\nvim /etc/audit/audit.rules\n\nYou are teaching a new colleague what each line actually does before anyone panics."}], "question": "Drag each command into the bin that describes what it does.", "hint": "The service command talks to systemd; the auditctl -D form deletes rules; opening a file in vim edits it.", "explain": "systemctl stop auditd stops the audit service through systemd. auditctl -D deletes all audit rules loaded in the kernel right now. Opening /etc/audit/audit.rules in vim edits the rules file — the change applies at the next load or reboot. Three different mechanisms: service state, kernel rule set, and file content.", "study": "Learn the three mechanisms: service state changes, auditctl rule changes, and rule file edits.", "buckets": [{"id": "svc", "label": "Stops the audit service"}, {"id": "flush", "label": "Deletes all loaded audit rules"}, {"id": "edit", "label": "Edits the rules file"}], "items": [{"id": "i1", "t": "systemctl stop auditd", "bucket": "svc"}, {"id": "i2", "t": "auditctl -D", "bucket": "flush"}, {"id": "i3", "t": "vim /etc/audit/audit.rules", "bucket": "edit"}]}, {"id": "easy-07-two-ways", "type": "multi", "tag": "Configuration sources", "summary": "Select the two main ways audit log rules are configured", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Study flashcard", "text": "Flashcard front: \"The Linux Audit system keeps event rules in two places. Name both.\" Select the TWO correct answers. Wrong picks subtract points, so only select what you are sure of."}], "question": "Which TWO are the two main ways audit log generation rules are configured?", "hint": "One is a command-line utility; the other is a file loaded at boot time.", "explain": "The rules are configured through the command-line auditctl utility and through /etc/audit/audit.rules, which holds a sequence of auditctl commands loaded at boot. audit.conf holds auditd settings (like log size), not event rules, and deleting the log file does not configure anything — it destroys evidence.", "study": "Keep the pair together in your head: auditctl (live) + audit.rules (boot).", "options": [{"t": "The command-line auditctl utility", "correct": true}, {"t": "The /etc/audit/audit.rules file loaded at boot", "correct": true}, {"t": "The audit.conf daemon settings file", "correct": false}, {"t": "Deleting /var/log/audit/audit.log", "correct": false}]}, {"id": "easy-08-timeline", "type": "order", "tag": "Attacker timeline", "summary": "Put the four steps of a simple audit-tampering night in order", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Reconstructed incident summary", "text": "A small hosting company rebuilt what happened on one server last night. The four steps below happened in a specific order. Put them back in that order: top = first."}, {"k": "code", "label": "ARTEFACT 2 — The four steps", "text": "A. auditd is stopped, audit logging goes silent\nB. Attacker gets root on the public web server\nC. Attacker installs an SSH backdoor for later access\nD. Backdoor and attacker activity produce no audit logs"}], "question": "Put the four steps in the order they happened.", "hint": "Nothing can be stopped before the attacker has the power to stop it, and the backdoor is installed while logging is off.", "explain": "The order is B → A → C → D: the attacker first gets root, then stops auditd (T1685.004), then installs the backdoor quietly, and from then on activity is not logged.", "dual": {"red": "For an attacker this order is the point: reach root, silence the recorder, then do the real work unseen. Silencing early maximises the dark window.", "blue": "For defenders this explains why \"logs stopped\" is an early warning: the silence itself is the signal, especially when it follows a new privileged session."}, "study": "Defense Evasion usually comes right after the attacker gains enough privilege to change defences.", "items": [{"id": "o1", "t": "Attacker gets root on the public web server"}, {"id": "o2", "t": "auditd is stopped — audit logging goes silent"}, {"id": "o3", "t": "Attacker installs an SSH backdoor for later access"}, {"id": "o4", "t": "Backdoor and attacker activity produce no audit logs"}]}, {"id": "easy-09-why", "type": "mcq", "tag": "Attacker goal", "summary": "Pick the reason an attacker disables the Linux Audit system", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Trainee question", "text": "A trainee asks during onboarding: \"Why would an attacker bother stopping audit logging instead of just doing their thing? What do they actually gain?\""}], "question": "What does the attacker gain by disabling the Linux Audit system?", "hint": "The technique sits in the Defense Evasion tactic — the goal is about being seen, not about entry or speed.", "explain": "The Linux Audit system records security-relevant events: processes run, files changed, logins, network actions. If it is off, the attacker’s next steps leave no audit trail, so defenders cannot see or reconstruct them. That is exactly why the technique belongs to Defense Evasion — hide the activity, avoid detection.", "study": "Connect every technique to the tactic goal it serves.", "options": [{"t": "So defenders cannot see what the attacker does next", "correct": true}, {"t": "So the attacker can get into the server more easily", "correct": false}, {"t": "So the attacker can steal passwords faster", "correct": false}, {"t": "So the server runs faster and crashes less", "correct": false}]}, {"id": "easy-10-log-two", "type": "multi", "tag": "Read the log", "summary": "Read two log lines and select the two supported conclusions", "scenario": [{"k": "log", "label": "ARTEFACT 1 — /var/log/messages excerpt from srv-db01", "lines": ["Oct 12 03:11:20 srv-db01 sshd[4412]: Accepted publickey for deploy from 10[.]20[.]4[.]31 port 51422", "Oct 12 03:11:22 srv-db01 sudo: deploy : TTY=pts/0 ; PWD=/home/deploy ; USER=root ; COMMAND=/usr/sbin/auditctl -D", "Oct 12 03:11:23 srv-db01 auditctl[2891]: no rules", "Oct 12 03:12:01 srv-db01 CROND[5521]: (root) CMD (run-parts /etc/cron.hourly)"]}], "question": "Which TWO conclusions do these lines support?", "hint": "Line two shows exactly what was typed; line three shows the state after it ran. Read those two together.", "explain": "Line 2 shows the auditctl -D command being run with sudo, and line 3 shows the result: \"no rules\" — the loaded rule set was emptied by that command. The lines do not say auditd was uninstalled, they do not show a reboot (a reboot would appear as kernel/system messages), and the sshd line is a normal key-based login that only gives context.", "study": "Always pair a command-execution line with the state line that follows it.", "options": [{"t": "Someone ran the auditctl -D command with root rights", "correct": true}, {"t": "The loaded audit rule set was emptied", "correct": true}, {"t": "The auditd daemon was uninstalled from the server", "correct": false}, {"t": "The server rebooted at 03:11", "correct": false}, {"t": "A new user account was created", "correct": false}]}, {"id": "easy-11-data-source", "type": "match", "tag": "Telemetry mapping", "summary": "Match each event to the ATT&CK data source it produces", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Detection-engineer onboarding note", "text": "ATT&CK describes telemetry with \"data sources\" and \"data components\". Four event types feed detections for T1685.004. Match each event to the data source it belongs to."}, {"k": "table", "label": "ARTEFACT 2 — The four events", "head": ["#", "Observed event"], "rows": [["1", "auditd service is disabled with systemctl"], ["2", "the auditd process is killed"], ["3", "/etc/audit/audit.rules is modified"], ["4", "auditctl -e 0 is typed in a shell"]]}], "question": "Match each event to its ATT&CK data source.", "hint": "Service state, process death, file change, command typed — one data source each, in that order.", "explain": "Disabling a service maps to Service metadata (state of a service). Killing the auditd process maps to Process termination. Modifying the rules file maps to File modification. Typing auditctl -e 0 maps to Command execution. These four data components are the backbone of detections for this technique.", "study": "ATT&CK technique pages list their Data Sources — read them before building alerts.", "items": [{"l": "auditd service disabled with systemctl", "r": "Service: Service Metadata"}, {"l": "auditd process killed", "r": "Process: Process Termination"}, {"l": "/etc/audit/audit.rules modified", "r": "File: File Modification"}, {"l": "auditctl -e 0 typed in a shell", "r": "Command: Command Execution"}]}, {"id": "easy-12-ticket", "type": "fill", "tag": "Ticket wording", "summary": "Complet /* ---------------- terminal ---------------- */
function normCmd(s) { return String(s).replace(/\s+/g, ' ').trim().toLowerCase(); }
function sameCmd(a, b) {

  var ta = a.split(' ').filter(Boolean), tb = b.split(' ').filter(Boolean);
  if (ta.length !== tb.length) return false;
  var oa = ta.filter(function (t) { return t.charAt(0) === '-'; }).sort();
  var ob = tb.filter(function (t) { return t.charAt(0) === '-'; }).sort();
  var pa = ta.filter(function (t) { return t.charAt(0) !== '-'; });
  var pb = tb.filter(function (t) { return t.charAt(0) !== '-'; });
  return oa.join(' ') === ob.join(' ') && pa.join(' ') === pb.join(' ');
}

/* ---------------- grading ---------------- */
function scoreExercise(H, W, N) { return Math.max(0, (H - W) / N); }
function grade(ex) {
  var I = S.inter, H, W, N, rows = [], i;
  if (ex.type === 'mcq') {
    N = 1;
    var picked = I.sel.length ? I.disp[I.sel[0]] : -1;
    var ok = picked >= 0 && ex.options[picked].correct;
    H = ok ? 1 : 0; W = ok ? 0 : (picked >= 0 ? 1 : 0);
    if (ok) rows.push({ st: 'ok', text: 'You picked the correct option.' });
    else if (picked >= 0) rows.push({ st: 'bad', text: 'You picked: \u201C' + ex.options[picked].t + '\u201D \u2014 not correct here.' });
    else rows.push({ st: 'bad', text: 'You did not pick any option.' });
    var co = ex.options.filter(function (o) { return o.correct; })[0];
    if (!ok) rows.push({ st: 'miss', text: 'Correct answer: \u201C' + co.t + '\u201D' });
    return { credit: scoreExercise(H, W, N), rows: rows };
  }
  if (ex.type === 'multi') {
    var corr = ex.options.map(function (o, oi) { return o.correct ? oi : -1; }).filter(function (x) { return x >= 0; });
    N = corr.length; H = 0; W = 0;
    ex.options.forEach(function (o, oi) {
      var sel = I.sel.indexOf(I.disp.indexOf(oi)) !== -1;
      if (o.correct && sel) { H++; rows.push({ st: 'ok', text: '\u201C' + o.t + '\u201D \u2014 correct, you selected it.' }); }
      else if (!o.correct && sel) { W++; rows.push({ st: 'bad', text: '\u201C' + o.t + '\u201D \u2014 you selected it, but it does not belong.' }); }
      else if (o.correct && !sel) { rows.push({ st: 'miss', text: '\u201C' + o.t + '\u201D \u2014 you missed this correct item.' }); }
    });
    return { credit: scoreExercise(H, W, N), rows: rows };
  }
  if (ex.type === 'match') {
    N = ex.items.length; H = 0; W = 0;
    ex.items.forEach(function (it, li) {
      var c = I.choices[li];
      if (c === it.r) { H++; rows.push({ st: 'ok', text: '\u201C' + it.l + '\u201D \u2192 \u201C' + it.r + '\u201D \u2014 correct.' }); }
      else if (c) { W++; rows.push({ st: 'bad', text: '\u201C' + it.l + '\u201D \u2192 you chose \u201C' + c + '\u201D. Correct: \u201C' + it.r + '\u201D.' }); }
      else { rows.push({ st: 'miss', text: '\u201C' + it.l + '\u201D \u2014 left unmatched. Correct: \u201C' + it.r + '\u201D.' }); }
    });
    return { credit: scoreExercise(H, W, N), rows: rows };
  }
  if (ex.type === 'fill') {
    N = ex.blanks.length; H = 0; W = 0;
    ex.blanks.forEach(function (b, bi) {
      var p = I.picks[bi];
      if (p === b) { H++; rows.push({ st: 'ok', text: 'Blank ' + (bi + 1) + ': \u201C' + b + '\u201D \u2014 correct.' }); }
      else if (p) { W++; rows.push({ st: 'bad', text: 'Blank ' + (bi + 1) + ': you wrote \u201C' + p + '\u201D. Correct: \u201C' + b + '\u201D.' }); }
      else { rows.push({ st: 'miss', text: 'Blank ' + (bi + 1) + ' left empty. Correct: \u201C' + b + '\u201D.' }); }
    });
    return { credit: scoreExercise(H, W, N), rows: rows };
  }
  if (ex.type === 'assign') {
    N = ex.items.length; H = 0; W = 0;
    ex.items.forEach(function (it) {
      var b = I.place[it.id];
      if (b === it.bucket) { H++; rows.push({ st: 'ok', text: '\u201C' + it.t + '\u201D \u2192 \u201C' + bucketLabel(ex, it.bucket) + '\u201D \u2014 correct.' }); }
      else if (b) { W++; rows.push({ st: 'bad', text: '\u201C' + it.t + '\u201D \u2192 \u201C' + bucketLabel(ex, b) + '\u201D. Correct bin: \u201C' + bucketLabel(ex, it.bucket) + '\u201D.' }); }
      else { rows.push({ st: 'miss', text: '\u201C' + it.t + '\u201D \u2014 left in the bank. Correct bin: \u201C' + bucketLabel(ex, it.bucket) + '\u201D.' }); }
    });
    return { credit: scoreExercise(H, W, N), rows: rows };
  }
  if (ex.type === 'order') {
    N = ex.items.length; H = 0; W = 0; var marks = [];
    for (i = 0; i < N; i++) {
      var okp = I.seq[i] === ex.items[i].id;
      marks.push(okp);
      if (okp) { H++; rows.push({ st: 'ok', text: 'Position ' + (i + 1) + ': \u201C' + itemText(ex, ex.items[i].id) + '\u201D \u2014 correct.' }); }
      else { W++; rows.push({ st: 'bad', text: 'Position ' + (i + 1) + ': you placed \u201C' + itemText(ex, I.seq[i]) + '\u201D. Correct: \u201C' + itemText(ex, ex.items[i].id) + '\u201D.' }); }
    }
    return { credit: scoreExercise(H, W, N), rows: rows, marks: marks };
  }
  if (ex.type === 'branch') {
    N = ex.steps.length; H = 0; W = 0;
    ex.steps.forEach(function (s, si) {
      var di = I.choices[si];
      var oi = (di !== undefined && I.dispStep && I.dispStep[si]) ? I.dispStep[si][di] : -1;
      if (oi === s.correct) { H++; rows.push({ st: 'ok', text: 'Step ' + (si + 1) + ' \u2014 good decision.' }); }
      else { W++; rows.push({ st: 'bad', text: 'Step ' + (si + 1) + ' \u2014 you chose \u201C' + (s.options[oi] ? s.options[oi].t : '(no choice)') + '\u201D. Better: \u201C' + s.options[s.correct].t + '\u201D.' }); }
    });
    return { credit: scoreExercise(H, W, N), rows: rows };
  }
  if (ex.type === 'terminal') {
    var t = ex.terminal;
    var n = normCmd(I.cmd || '');
    N = t.elements.length; H = 0; W = 0;
    t.elements.forEach(function (el) {
      if (el.re.test(n)) { H++; rows.push({ st: 'ok', text: el.label + ' \u2014 found. ' + el.why }); }
      else { rows.push({ st: 'miss', text: el.label + ' \u2014 missing. ' + el.why }); }
    });
    var danger = false;
    (t.forbidden || []).forEach(function (f) {

    });
    if (!n) rows.unshift({ st: 'bad', text: 'You submitted an empty command line.' });
    return { credit: scoreExercise(H, W, N), rows: rows, danger: danger, typed: n };
  }
  return { credit: 0, rows: [] };
}

    if (!done) return; /* final Check only exists once every step is confirmed */
  }
  if (ex.type === 'terminal') { var ti = $('term-input'); if (ti && String(ti.value).trim()) S.inter.cmd = ti.value; }
  setState('PAUSED_AUTO_CHECK');   /* first action, before feedback renders */
  perExStop();
  var g = grade(ex);
  var pen = S.hintUsed[S.idx] ? 0.10 : 0;
  var credit = Math.max(0, g.credit - pen);
  S.checked[S.idx] = true;
  S.answered[S.idx] = credit;
  S.creditsSum += credit;
  S.skipped = S.skipped.filter(function (p) { return p !== S.idx; });
  S.curGraded = { g: g, credit: credit };
  S.locked = true;
  lockUI(ex, g);
  renderFeedback(ex, g, credit);
  var br = $('btn-row');
  br.innerHTML = '';
  var nb = document.createElement('button');
  nb.className = 'btn btn-green'; nb.id = 'btn-next';
  nb.textContent = S.returnTo === 'review' ? '\u21B9 Back to review \u25B6'
    : (S.idx + 1 === EXS.length) ? 'Final Submit \u25B6' : 'Next \u25B6';
  nb.addEventListener('click', onNext);
  br.appendChild(nb);
  var hb = $('btn-hint'); if (hb) hb.disabled = true;
  var sb = $('btn-skip'); if (sb) sb.disabled = true;
  renderHeader();
}
function lockUI(ex, g) {
  var I = S.inter;
  if (ex.type === 'mcq' || ex.type === 'multi') {
    document.querySelectorAll('#blk-ans .opt').forEach(function (b) {
      var di = parseInt(b.getAttribute('data-di'), 10);
      var oi = I.disp[di];
      var sel = I.sel.indexOf(di) !== -1;
      var corr = ex.options[oi].correct;
      b.classList.add('locked');
      var v = document.createElement('span'); v.className = 'verdict';
      if (sel && corr) { b.classList.add('correct'); v.className += ' v-ok'; v.textContent = '\u2713 Correct'; }
      else if (sel && !corr) { b.classList.add('wrong'); v.className += ' v-bad'; v.textContent = '\u2717 Wrong'; }
      else if (!sel && corr && ex.type === 'multi') { b.classList.add('missed'); v.className += ' v-miss'; v.textContent = '\u25CB Missed'; }
      else if (!sel && corr && ex.type === 'mcq') { b.classList.add('missed'); v.className += ' v-miss'; v.textContent = '\u25CB Missed \u2014 this was correct'; }
      b.appendChild(v);
    });
  } else if (ex.type === 'match') {
    document.querySelectorAll('#blk-ans .match-row').forEach(function (row, li) {
      var mk = row.querySelector('.pair-mark');
      var ok = I.choices[li] === ex.items[li].r;
      mk.style.display = '';
      mk.className = 'pair-mark ' + (ok ? 'ok' : (I.choices[li] ? 'bad' : 'miss'));
      mk.textContent = ok ? '\u2713 Correct' : (I.choices[li] ? '\u2717 Wrong' : '\u25CB Missed');
      row.querySelector('select').disabled = true;
    });
  } else if (ex.type === 'fill') {
    var slots = 0;
    document.querySelectorAll('#blk-ans .blank-sel').forEach(function (sel) {
      var bi = slots++;
      var mk = sel.parentElement.querySelector('.pair-mark');
      var ok = I.picks[bi] === ex.blanks[bi];
      mk.style.display = '';
      mk.className = 'pair-mark ' + (ok ? 'ok' : (I.picks[bi] ? 'bad' : 'miss'));
      mk.textContent = ok ? '\u2713' : (I.picks[bi] ? '\u2717' : '\u25CB');
      sel.disabled = true;
    });
  } else if (ex.type === 'assign') {
    document.querySelectorAll('#blk-ans .chip').forEach(function (chip) {
      var iid = chip.getAttribute('data-iid');
      var it = ex.items.filter(function (x) { return x.id === iid; })[0];
      var placed = I.place[iid];
      var v = document.createElement('span');
      if (placed === it.bucket) { v.className = 'chip-verdict v-ok'; v.textContent = '\u2713'; }
      else if (placed) { v.className = 'chip-verdict v-bad'; v.textContent = '\u2717'; }
      else { v.className = 'chip-verdict v-miss'; v.textContent = '\u25CB missed'; }
      chip.appendChild(v);
      var x = chip.querySelector('.x'); if (x) x.remove();
      chip.setAttribute('draggable', 'false');
    });
  } else if (ex.type === 'order') {
    drawOrder(ex, g.marks);
  } else if (ex.type === 'branch') {
    document.querySelectorAll('#blk-ans .step-box').forEach(function (box) {
      var si = parseInt(box.getAttribute('data-step'), 10);
      box.querySelectorAll('.opt').forEach(function (b) {
        var di = parseInt(b.getAttribute('data-di'), 10);
        var oi = I.dispStep[si][di];
        var chosen = I.choices[si] === di;
        var v = document.createElement('span'); v.className = 'verdict';
        if (chosen && oi === ex.steps[si].correct) { b.classList.add('correct'); v.className += ' v-ok'; v.textContent = '\u2713 Correct'; }
        else if (chosen) { b.classList.add('wrong'); v.className += ' v-bad'; v.textContent = '\u2717 Wrong'; }
        else if (oi === ex.steps[si].correct) { b.classList.add('missed'); v.className += ' v-miss'; v.textContent = '\u25CB Missed'; }
        b.appendChild(v);
      });
    });
  } else if (ex.type === 'terminal') {
    var inp = $('term-input'); if (inp) { inp.disabled = true; }
    var t = ex.terminal;
    termPrint(ex, '\u2500 simulator output \u2500', 't-info');
    termPrint(ex, esc(t.out));
  }
}
function renderFeedback(ex, g, credit) {
  var lab, cls, icon;
  if (credit >= 0.9999) { lab = 'CORRECT'; cls = 'f-correct'; icon = '\u2713'; }
  else if (credit <= 0.0001) { lab = 'INCORRECT'; cls = 'f-incorrect'; icon = '\u2717'; }
  else { lab = 'PARTIALLY CORRECT'; cls = 'f-partial'; icon = '\u2713'; }
  var multi = ['multi', 'match', 'fill', 'assign', 'order', 'branch'].indexOf(ex.type) !== -1 || ex.type === 'terminal';
  var creditLine = multi ? '<span class="fb-credit">credit ' + (Math.round(credit * 100) / 100).toFixed(2) + (credit > 0 ? ' \u2014 ' + countPicked(ex, g) : '') + '</span>' : '';
  var h = '<div class="fb-head ' + cls + '"><span aria-hidden="true">' + icon + '</span> ' + lab + creditLine + '</div>';
  var body = '<div class="fb-body"><h4>Why</h4>' + md(ex.explain);
  body += '<h4>Item by item</h4><div class="fb-items">' + g.rows.map(function (r) {
    var mark = r.st === 'ok' ? '<span class="i-mark">\u2713 Correct</span>' : r.st === 'bad' ? '<span class="i-mark">\u2717 Wrong</span>' : '<span class="i-mark">\u25CB Missed</span>';
    return '<div class="fb-item i-' + (r.st === 'ok' ? 'ok' : r.st === 'bad' ? 'bad' : 'miss') + '">' + mark + '<p>' + md(r.text).replace(/^<p>|<\/p>$/g, '') + '</p></div>';
  }).join('') + '</div>';
  if (g.danger) body += '<div class="study-tip danger"><b>\u2717 DANGEROUS \u2014 NEAR MISS:</b> your command would have changed the state of the host or destroyed evidence. In real work, that is a serious mistake even when the goal is right. Read the canonical command below.</div>';
  if (ex.type === 'terminal') {
    var t = ex.terminal;
    body += '<h4>Canonical command</h4><div class="canon-cmd"><button type="button" class="copy-btn" id="btn-copy">\u29C9 Copy</button><pre>' + esc(t.canonical) + '</pre></div>' +
      '<div class="fb-items">' + t.elements.map(function (el) {
        return '<div class="fb-item i-ok"><span class="i-mark">\u2713 Element</span><p><code>' + esc(el.label) + '</code> \u2014 ' + md(el.why).replace(/^<p>|<\/p>$/g, '') + '</p></div>';
      }).join('') + '</div>';
    if ((t.forbidden || []).length) {
      body += '<div class="fb-items">' + t.forbidden.map(function (f) {
        return '<div class="fb-item i-bad"><span class="i-mark">\u2717 Avoid</span><p><code>' + esc(f.label) + '</code> \u2014 ' + md(f.why).replace(/^<p>|<\/p>$/g, '') + '</p></div>';
      }).join('') + '</div>';
    }
  }
  if (ex.dual) {
    body += '<div class="dual-persp"><div class="dp red"><h5>\u25CF Attacker perspective</h5><p>' + md(ex.dual.red).replace(/^<p>|<\/p>$/g, '') + '</p></div>' +
      '<div class="dp blue"><h5>\u25CF Defender perspective</h5><p>' + md(ex.dual.blue).replace(/^<p>|<\/p>$/g, '') + '</p></div></div>';
  }
  if (ex.study) body += '<div class="study-tip"><b>What to study next:</b> ' + md(ex.study).replace(/^<p>|<\/p>$/g, '') + '</div>';
  body += '</div>';
  $('fb-area').innerHTML = h + body;
  var cp = $('btn-copy');
  if (cp) cp.addEventListener('click', function () {
    try {
      navigator.clipboard.writeText(ex.terminal.canonical).then(function () { cp.textContent = '\u2713 Copied'; }, function () { cp.textContent = 'Select & copy manually'; });
    } catch (e) { cp.textContent = 'Select & copy manually'; }
  });
  $('fb-area').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function countPicked(ex, g) {
  var ok = g.rows.filter(function (r) { return r.st === 'ok'; }).length;
  var bad = g.rows.filter(function (r) { return r.st === 'bad' && r.text.indexOf('DANGEROUS') === -1; }).length;
  var miss = g.rows.filter(function (r) { return r.st === 'miss'; }).length;
  var n = ok + bad + miss;
  return ok + '/' + n + ' items';
}
function onNext() {
  if (S.tState === 'PAUSED_AUTO_CHECK') setState('RUNNING');
  if (S.returnTo === 'review') { showReview(); return; }
  if (S.idx + 1 < EXS.length) { S.idx++; renderExercise(); }
  else { maybeReview(); }
}
function onSkip() {
  if (S.locked || S.checked[S.idx]) return;
  if (S.skipped.indexOf(S.idx) === -1) S.skipped.push(S.idx);
  renderHeader();
  if (S.returnTo === 'review') { S.returnTo = null; showReview(); return; }
  if (S.idx + 1 < EXS.length) { S.idx++; renderExercise(); }
  else { maybeReview(); }
}
function onHint() {
  if (S.locked || S.hintUsed[S.idx]) return;
  S.hintUsed[S.idx] = true;
  $('hint-slot').innerHTML = '<div class="hint-panel"><div class="h-head">\u2600 Hint \u2014 costs 10% of this exercise\u2019s credit</div>' + md(curEx().hint) + '</div>';
  $('btn-hint').disabled = true;
}
function onPause() {
  if (S.phase !== 'exam' && S.phase !== 'review') return;
  if (S.tState !== 'RUNNING' && S.tState !== 'PAUSED_AUTO_CHECK') return;
  S.resumeState = S.tState;
  setState('PAUSED_MANUAL');
  $('pause-veil').classList.remove('hidden');
}
function onResume() {
  $('pause-veil').classList.add('hidden');
  setState(S.resumeState === 'PAUSED_AUTO_CHECK' ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
}
function maybeReview() {
  if (S.skipped.length > 0) showReview();
  else showResults();
}
function showReview() {
  S.phase = 'review';
  if (S.tState === 'PAUSED_AUTO_CHECK') setState('RUNNING');
  $('view-exam').classList.add('hidden');
  $('view-results').classList.add('hidden');
  $('view-review').classList.remove('hidden');
  var list = '<div class="rev-item"><span class="r-mark">\u26A0 Skipped</span><span class="r-text">All exercises have been shown. Submit when ready.</span></div>';
  if (S.skipped.length) {
    list = S.skipped.map(function (p) {
      return '<div class="rev-item"><span class="r-mark">\u26A0 Skipped</span><span class="r-text">' + md(EXS[p].summary).replace(/^<p>|<\/p>$/g, '') + '</span>' +
        '<button type="button" class="btn btn-amber" data-pos="' + p + '">\u270E Answer now</button></div>';
    }).join('');
  }
  $('view-review').innerHTML = '<div class="card"><h2>Review skipped exercises</h2>' +
    '<p class="note" style="color:var(--text-secondary)">Exercises you skip and never answer are excluded from your score \u2014 they count neither for you nor against you. You can return to them as many times as you need until the timer ends.</p>' +
    list +
    '<div style="display:flex;gap:12px;justify-content:flex-end;margin-top:16px">' +
    '<button type="button" class="btn btn-green" id="btn-final">\u2713 Submit exam now</button></div></div>';
  $('view-review').querySelectorAll('[data-pos]').forEach(function (b) {
    b.addEventListener('click', function () {
      S.phase = 'exam'; S.idx = parseInt(b.getAttribute('data-pos'), 10); S.returnTo = 'review';
      $('view-review').classList.add('hidden');
      $('view-exam').classList.remove('hidden');
      renderExercise();
    });
  });
  $('btn-final').addEventListener('click', showResults);
  renderHeader();
}
function showResults() {
  S.phase = 'results';
  setState('ENDED');
  $('view-exam').classList.add('hidden');
  $('view-review').classList.add('hidden');
  $('view-results').classList.remove('hidden');
  var answered = Object.keys(S.answered).length;
  var full = 0, part = 0, partSum = 0, wrong = 0;
  Object.keys(S.answered).forEach(function (k) {
    var c = S.answered[k];
    if (c >= 0.9999) full++;
    else if (c > 0.0001) { part++; partSum += c; }
    else wrong++;
  });
  var skippedN = S.skipped.length;
  var pct = answered > 0 ? Math.round((S.creditsSum / answered) * 100) : 0;
  var pass = pct >= META.passMark;
  var avg = part > 0 ? (Math.round(partSum / part * 100) / 100).toFixed(2) : '\u2014';
  $('view-results').innerHTML =
    '<div class="card"><div class="res-hero">' +
    '<div class="res-pct">' + pct + '%</div>' +
    '<div class="res-verdict ' + (pass ? 'pass' : 'fail') + '">' + (pass ? '\u2713 PASS' : '\u2717 FAIL') + '</div>' +
    '<div style="color:var(--text-secondary)">Final score ' + fmt1(S.creditsSum) + ' / ' + answered + ' answered \u00B7 pass mark ' + META.passMark + '%</div>' +
    '</div><div class="res-grid">' +
    '<div class="res-cell ok"><div class="c-k">\u2713 Fully correct</div><div class="c-v">' + full + '</div></div>' +
    '<div class="res-cell part"><div class="c-k">\u2713 Partially correct (avg ' + avg + ')</div><div class="c-v">' + part + '</div></div>' +
    '<div class="res-cell bad"><div class="c-k">\u2717 Fully incorrect</div><div class="c-v">' + wrong + '</div></div>' +
    '<div class="res-cell skip"><div class="c-k">\u26A0 Skipped \u2014 excluded</div><div class="c-v">' + skippedN + '</div></div>' +
    '</div>' +
    (pass ? '<div class="certificate"><h3>\u2713 Certification-style result</h3><p>You reached ' + pct + '%, above the ' + META.passMark + '% pass mark. You have demonstrated a working command of ' + esc(META.objId + ' \u2014 ' + META.objName) + ' at ' + META.sevName + ' level.</p></div>'
      : '<div class="certificate fail"><h3 style="color:var(--state-incorrect)">\u2717 Not passed this time</h3><p>You reached ' + pct + '%, below the ' + META.passMark + '% pass mark. Review the feedback above, study the listed concepts, and retake the exam \u2014 questions and options will be reshuffled.</p></div>') +
    '<div class="pause-log">Time spent paused manually: ' + mmss(S.pauseManualMs / 1000) +
    ' \u00B7 time spent reviewing feedback (auto-pause): ' + mmss(S.pauseAutoMs / 1000) + '</div>' +
    '<div style="display:flex;justify-content:flex-end;margin-top:16px">' +
    '<button type="button" class="btn btn-primary" id="btn-retake">\u21BA Retake exam</button></div></div>';
  $('btn-retake').addEventListener('click', startExam);
  renderHeader();
  if (!S.reported) { S.reported = true; reportScore(S.creditsSum, answered); }
}
function finishAttempt() {
  if (S.phase === 'intro' || S.phase === 'results') return;
  showResults();
}

/* ---------------- site integration ---------------- */
function reportScore(creditSum, answeredCount) {
  var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent >= META.passMark
    }, location.origin);
  } catch (e) { /* opened directly, nothing to report to */ }
}
window.addEventListener('message', function (event) {
  if (!event.data) return;
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  S.hs = {
    username: event.data.username || '',
    country: event.data.country || '',
    locale: event.data.locale || 'en',
    topicId: event.data.topicId || '',
    batch: event.data.batch
  };
});

/* ---------------- boot ---------------- */
document.documentElement.style.setProperty('--sev-current', META.sevColor);
renderIntro();
document.addEventListener('DOMContentLoaded', function () {
  var b = $('btn-pause'); if (b) b.addEventListener('click', onPause);
  var r = $('btn-resume'); if (r) r.addEventListener('click', onResume);
  var h = $('btn-hint'); if (h) h.addEventListener('click', onHint);
  var s = $('btn-skip'); if (s) s.addEventListener('click', onSkip);
  var c = $('btn-check'); if (c) c.addEventListener('click', onCheck);
});
})();



</script>
</body>
</html>
