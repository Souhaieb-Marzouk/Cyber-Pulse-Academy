<script>
window.EXAM = {"topicId": "t1592.004", "batch": 1, "exCount": 15, "title": "T1592.004 Gather Victim Host Information: Client Configurations — EASY", "sev": "easy", "sevName": "EASY", "sevMeaning": "Each exercise tests one single idea with clear guidance. Scenarios are short and the hints are strong.", "minutes": 30, "typeList": "multiple choice, matching, drag and drop, ordering, gap fill, one guided terminal, log reading", "introHtml": "\n<p><b>This exam is about one MITRE ATT&CK object:\nT1592.004 — Gather Victim Host Information: Client Configurations.</b></p>\n<p>What type of object is this? It is a <b>sub-technique</b>. Its parent technique is\n<b>T1592 — Gather Victim Host Information</b>. It sits in the <b>Reconnaissance tactic (TA0043)</b>.\nReconnaissance means: the attacker studies you <i>before</i> they attack you.</p>\n<p><b>What are \"client configurations\"?</b> They are simple facts about the computers a company\nuses. ATT&CK lists: the operating system and its version, virtualization (systems that run inside\nvirtual machines), the architecture (32-bit or 64-bit), the language, and the time zone.\nThese facts look boring. They are not. An attacker uses them to pick the right tool, write a lure\nin the right language, and act at the right local time.</p>\n<p><b>How do attackers collect this?</b> ATT&CK lists several ways: direct collection like\nactive scanning (listening ports, server banners, user agent strings), phishing for information\n(they simply ask your staff), compromised websites that run small scripts to read each visitor's\nsystem, and open data such as job postings, network maps, assessment reports, resumes, or\npurchase invoices.</p>\n<p><b>Where will you meet this at work?</b></p>\n<ul>\n<li>A <b>SOC analyst</b> sees scanners probing the website and judges if it is recon.</li>\n<li>A <b>threat hunter</b> checks what the internet can learn about the company.</li>\n<li>An <b>incident responder</b> asks: what did the attacker learn before they got in?</li>\n<li>A <b>CTI analyst</b> maps actor reports to ATT&CK and briefs the CISO.</li>\n<li>A <b>red teamer</b> collects the same data to test defences.</li>\n<li>A <b>detection engineer</b> builds analytics like ATT&CK's DET0820 to spot fingerprinting content.</li>\n<li>A <b>GRC analyst or control owner</b> writes rules that reduce exposed information\n(the ATT&CK mitigation is M1056, Pre-compromise).</li>\n</ul>\n<p><b>Tools and work products:</b> curl for reading response headers, scanner tools,\nattack-surface management platforms, public databases. Deliverables include the recon section of\na threat intel report, an exposure report, or a hardening ticket.</p>\n<p><b>Why it matters:</b> an attacker who knows your systems can aim better and act faster.\nDetection is hard because most of this happens outside your network. So reducing what you\nexpose is the best defence.</p>\n", "themesHtml": "<div class=\"theme-grid\"><div class=\"theme-card\"><h3>Technique identity and family</h3><div class=\"theme-tags\"><span class=\"tag\">T1592.004</span><span class=\"tag\">Sub-technique of T1592</span><span class=\"tag\">Tactic TA0043 Reconnaissance</span><span class=\"tag\">Siblings: .001 Hardware / .002 Software / .003 Firmware</span><span class=\"tag\">Platforms: PRE</span></div></div><div class=\"theme-card\"><h3>What counts as client configurations</h3><div class=\"theme-tags\"><span class=\"tag\">OS and version</span><span class=\"tag\">Virtualization</span><span class=\"tag\">Architecture 32/64-bit</span><span class=\"tag\">Language</span><span class=\"tag\">Time zone</span></div></div><div class=\"theme-card\"><h3>Collection methods</h3><div class=\"theme-tags\"><span class=\"tag\">Active Scanning (T1595): listening ports, server banners, user agent strings</span><span class=\"tag\">Phishing for Information (T1598)</span><span class=\"tag\">Compromised websites with fingerprinting content</span><span class=\"tag\">Open data sets: job postings, network maps, assessment reports, resumes, purchase invoices</span></div></div><div class=\"theme-card\"><h3>What recon unlocks next</h3><div class=\"theme-tags\"><span class=\"tag\">Search Open Websites/Domains (T1593)</span><span class=\"tag\">Search Open Technical Databases (T1597)</span><span class=\"tag\">Develop Capabilities (T1587)</span><span class=\"tag\">Obtain Capabilities (T1588)</span><span class=\"tag\">Supply Chain Compromise (T1195)</span><span class=\"tag\">External Remote Services (T1133)</span></div></div><div class=\"theme-card\"><h3>Telemetry and detection</h3><div class=\"theme-tags\"><span class=\"tag\">Detection Strategy DET0820 / analytic AN1952</span><span class=\"tag\">High false-positive rate for internet scanners</span><span class=\"tag\">Off-perimeter blind spots</span><span class=\"tag\">Watch the Initial Access stages</span></div></div><div class=\"theme-card\"><h3>Mitigation and controls</h3><div class=\"theme-tags\"><span class=\"tag\">M1056 Pre-compromise</span><span class=\"tag\">Minimize data available to external parties</span><span class=\"tag\">Version banner hygiene</span><span class=\"tag\">Public document hygiene</span><span class=\"tag\">Framework mappings: NIST CSF, CIS Controls, ISO 27001</span></div></div><div class=\"theme-card\"><h3>Real-world procedures</h3><div class=\"theme-tags\"><span class=\"tag\">C0064 AI-Assisted Breach of Mexico's Government Infrastructure</span><span class=\"tag\">C0062 Anthropic AI-orchestrated Campaign</span><span class=\"tag\">G0125 HAFNIUM — Office 365 tenant environment details</span></div></div><div class=\"theme-card\"><h3>Tools and work roles</h3><div class=\"theme-tags\"><span class=\"tag\">curl / banner grabbing</span><span class=\"tag\">Scanner tools</span><span class=\"tag\">SOC analyst</span><span class=\"tag\">CTI analyst</span><span class=\"tag\">Red teamer</span><span class=\"tag\">Detection engineer</span><span class=\"tag\">GRC analyst / control owner</span></div></div></div>", "exercises": [{"id": "e01", "type": "qcm", "kindLabel": "Multiple choice", "title": "Which tactic owns T1592.004?", "summary": "One ATT&CK matrix question about the home of T1592.004.", "scenario": "You are new in the SOC. Your team lead sends you a short chat message: 'T1592.004 — where does this one live in the ATT&CK matrix? Check before the morning briefing.'", "question": "Which tactic does T1592.004 belong to?", "options": ["Initial Access (TA0001)", "Reconnaissance (TA0043)", "Discovery (TA0007)", "Collection (TA0009)"], "answerIdx": 1, "hint": "This technique happens before the attacker touches anything. Reconnaissance is the phase before the attack.", "explain": "T1592.004 lives in the Reconnaissance tactic (TA0043). Reconnaissance means the attacker studies the victim before an attack. Discovery (TA0007) looks similar, but it happens after the attacker is already inside a system. That is the key difference.", "study": "Read the intro section 'Technique identity and family', then compare Reconnaissance with Discovery."}, {"id": "e02", "type": "qcm", "kindLabel": "Multiple choice", "title": "What kind of ATT&CK object is this?", "summary": "A short object-type question about the ID format.", "scenario": "A slide in your training deck shows: <span class=\"mono\">T1592.004</span>. A colleague says: 'That is a technique, right?' You look at the dot in the ID and smile.", "question": "What type of ATT&CK object is T1592.004?", "options": ["A tactic from TA0043", "A mitigation like M1056", "A group profile such as G0125", "A sub-technique of T1592"], "answerIdx": 3, "hint": "The dot and the extra number matter. T1592 has four numbered children, and 004 is one of them.", "explain": "T1592.004 is a <b>sub-technique</b>. Its parent is T1592 (Gather Victim Host Information). ATT&CK shows a parent with a dot and a number: T1592.001 Hardware, T1592.002 Software, T1592.003 Firmware, T1592.004 Client Configurations. A tactic starts with TA, a mitigation with M, a group with G.", "study": "Look at the ID patterns: T = technique, TA = tactic, M = mitigation, G = group."}, {"id": "e03", "type": "match", "kindLabel": "Matching", "title": "What does each artefact tell an attacker?", "summary": "Five small artefacts. Match each one to the information it exposes.", "scenario": [{"label": "Artefact 1 — HTTP response header", "html": "<pre class=\"code\">User-Agent probe result:\nServer: nginx/1.24.0 (Ubuntu)\nX-Powered-By: PHP/8.1.2</pre>"}, {"label": "Artefact 2 — Log line from a web server", "html": "<pre class=\"code\">\"GET / HTTP/1.1\" 200 - \"Mozilla/5.0 (Windows NT 10.0; Win64; x64)\"</pre>"}, {"label": "Artefact 3 — Job posting (open data)", "html": "<pre class=\"code\">'Our mixed fleet still runs some 32-bit laptops\nwith several language packs.'</pre>"}, {"label": "Artefact 4 — Device status page", "html": "<pre class=\"code\">time zone: UTC+02:00</pre>"}, {"label": "Artefact 5 — Script on a compromised website", "html": "<pre class=\"code\">&lt;script&gt; collect(navigator.platform, navigator.language) &lt;/script&gt;</pre>"}], "question": "Match each artefact to the information it gives an attacker.", "left": ["Server: nginx/1.24.0 (Ubuntu)", "User-Agent: ... (Windows NT 10.0; Win64; x64)", "Job posting about 32-bit laptops and language packs", "Status page showing UTC+02:00", "Fingerprint script on a compromised site"], "right": ["Operating system and 64-bit architecture of a visitor", "Web server software and version (a banner)", "Language and fleet details from an open data set", "Time zone of the victim's systems", "Visitor's system details, collected quietly"], "pairs": [1, 0, 2, 3, 4], "hint": "Read each artefact like an attacker: what fact about the victim's systems does it give away?", "explain": "A banner names server software and version. A user agent names the operating system and architecture. Job postings are open data that mention systems. A status page can show a time zone. A fingerprint script on a compromised site collects the visitor's system details. All five feed T1592.004.", "study": "Re-read the intro section 'Collection methods'."}, {"id": "e04", "type": "dnd", "kindLabel": "Drag and drop", "title": "Client configuration or not?", "summary": "Six facts. Sort them into client configuration data versus other victim data.", "scenario": "You build a small poster for your team: 'What an attacker learns with T1592.004.' Before printing, sort the facts correctly.", "question": "Sort each fact into the correct box.", "zones": ["Client configuration information", "Other information about the victim"], "items": ["Operating system: Windows 10", "Architecture: 64-bit", "Language: en-GB", "Time zone: UTC-05:00", "The CEO's home address", "Firewall serial number"], "map": [0, 0, 0, 0, 1, 1], "hint": "ATT&CK lists OS and version, virtualization, 32/64-bit architecture, language and time zone as client configurations.", "explain": "Client configuration data describes the systems: OS and version, architecture, language, time zone, virtualization. A home address is personal data, and a firewall serial number is hardware information (closer to T1592.001 Hardware). Neither is a client configuration.", "study": "Re-read the intro section 'What counts as client configurations'."}, {"id": "e05", "type": "qcm", "kindLabel": "Multiple choice", "title": "Why does the attacker want this?", "summary": "One attacker-goal question.", "scenario": "Your trainee asks: 'I get that attackers collect OS, language and time zone data. But why? What is the payoff?'", "question": "Why does an attacker collect client configuration details?", "options": ["To change the victim's account passwords directly", "To sell the collected data on a public market", "To tailor tools and lures to the victim's systems", "To slow the victim's network during work hours"], "answerIdx": 2, "hint": "Think about tailoring: a 32-bit payload needs a 32-bit target. A lure works better in the victim's language.", "explain": "The collected details let the attacker <b>tailor</b> the attack: the right payload for the architecture, a lure in the victim's language, activity timed with the victim's time zone. ATT&CK says this information feeds other recon, establishing operational resources (Develop or Obtain Capabilities) and initial access. Changing passwords, reselling data or slowing a network all need access or intent the attacker does not have yet.", "study": "Re-read the intro paragraph 'Why it matters' and the theme 'What recon unlocks next'."}, {"id": "e06", "type": "fill", "kindLabel": "Gap fill", "title": "Complete the definition sentence", "summary": "Three gaps about tactic, parent and use.", "scenario": "You finish your team wiki page with this sentence, but three words are missing.", "question": "Pick the right word for each gap.", "template": "T1592.004 belongs to the {0} tactic. It is a sub-technique of {1}. Attackers use the collected details during {2}.", "answers": ["Reconnaissance", "T1592", "targeting"], "bank": ["Reconnaissance", "T1592", "targeting", "Discovery", "M1056", "reporting"], "hint": "First gap: the phase before the attack. Second gap: the parent technique ID. Third gap: what the information is used for.", "explain": "The correct sentence: 'T1592.004 belongs to the <b>Reconnaissance</b> tactic. It is a sub-technique of <b>T1592</b>. Attackers use the collected details during <b>targeting</b>.' Discovery happens inside a compromised network, M1056 is a mitigation ID, and 'reporting' does not fit the ATT&CK meaning here.", "study": "Compare with the first two exercises of this exam."}, {"id": "e07", "type": "qcm", "kindLabel": "Multiple choice", "title": "What comes next?", "summary": "One next-step question after recon succeeds.", "scenario": "An attacker now knows: the victim's staff systems use the en-GB language, the UTC+00:00 time zone, and mixed 32/64-bit laptops.", "question": "What is a typical next step for the attacker?", "options": ["Delete the victim's backup copies before anyone looks", "Write a phishing lure that looks local and trustworthy", "Buy the victim's public IP addresses from a broker", "Turn off the victim's firewall remotely from outside"], "answerIdx": 1, "hint": "Language and time zone make a lure feel local. The attacker cannot touch the victim's systems yet.", "explain": "With language, time zone and architecture known, the attacker can craft a lure that looks local and arrives at a believable local time. Deleting backups, buying IPs and remote firewall changes all need access the attacker does not have during reconnaissance.", "study": "Think about what 'pre-compromise' means: no access yet."}, {"id": "e08", "type": "terminal", "kindLabel": "Guided terminal", "title": "Grab the banner with curl", "summary": "One guided command: show the response headers of a demo web server.", "scenario": "Your mentor says: 'Before you touch any tool, watch what a web server tells about itself. Ask it for its response headers.'", "question": "Show only the response headers of the demo web server.", "briefing": "<b>Tool:</b> <span class=\"mono\">curl</span> — a small program that sends a web request and shows the answer.<br><b>Your task:</b> show the response headers of the demo web server, so you can read its software banner.<br><b>Command shape:</b> <span class=\"mono\">curl -sI &lt;address&gt;</span> (the -s keeps it quiet, the -I asks for headers only).<br><b>Example on a different target:</b> <span class=\"mono\">curl -sI hxxp://shop[.]other[.]example</span><br><b>Expected output looks like:</b> a few lines, starting with <span class=\"mono\">HTTP/1.1 200 OK</span>, then lines like <span class=\"mono\">Server: ...</span>", "prompt": "trainee@lab:~$", "motd": "lab shell — nothing here runs for real. Note: hxxp:// is the defanged form of http://", "elements": [{"name": "tool: curl", "re": "(^| )curl( |$)", "show": "curl"}, {"name": "headers-only option", "re": "(^| )(-s?i|-s -i|--head)( |$)", "show": "-sI (headers only, quiet)"}, {"name": "target address", "re": "demo\\.victim\\.example", "show": "hxxp://demo[.]victim[.]example"}], "wrong": [{"name": "body download option", "re": "(^| )(-o|--output|-O)( |$)", "show": "-o / -O downloads a file instead"}], "canonical": "curl -sI hxxp://demo[.]victim[.]example", "sim": "HTTP/1.1 200 OK\nServer: nginx/1.24.0 (Ubuntu)\nX-Powered-By: PHP/8.1.2\nContent-Type: text/html; charset=UTF-8\nConnection: keep-alive", "canonExpl": ["<span class=\"mono\">curl</span> — sends the web request (defang note: hxxp:// and [.] are safe writing for http:// and dots).", "<span class=\"mono\">-s</span> — silent mode: no progress bar.", "<span class=\"mono\">-I</span> — fetch headers only; this is what reveals the banner.", "<span class=\"mono\">hxxp://demo[.]victim[.]example</span> — the lab target."], "hint": "Type the command shape from the panel, but with the lab address from the scenario.", "explain": "The clean command is <b>curl -sI hxxp://demo[.]victim[.]example</b>. curl sends the request, -s keeps it quiet, -I asks for headers only. The banner (Server and X-Powered-By lines) is exactly the kind of software detail T1592.004 describes. Typing the address without the header flag would download the whole page instead.", "study": "Practise the command shape: tool, then options, then target."}, {"id": "e09", "type": "order", "kindLabel": "Ordering", "title": "Three steps of a simple banner grab", "summary": "Put a minimal recon workflow in order.", "scenario": "A junior asks you: 'How does a banner grab actually work, step by step?' You write the three steps on a card — then shuffle them for this exercise.", "question": "Put the three steps in the right order (top = first).", "items": ["Send a request to the victim's web server", "Read the server banner and version", "Plan the attack around what was learned"], "correctSeq": [0, 1, 2], "hint": "You cannot read a banner before sending a request, and you cannot plan before reading.", "explain": "First the request goes out, then the banner comes back and is read, then the attacker plans. This matches ATT&CK: direct collection actions (active scanning) produce the information, and the information feeds targeting.", "study": "Remember: collection first, use later."}, {"id": "e10", "type": "dnd", "kindLabel": "Drag and drop", "title": "Which header line leaks the version?", "summary": "Four response header lines. Find the one that leaks a software version.", "scenario": [{"label": "Artefact — response headers of a web server", "html": "<pre class=\"code\">Date: Tue, 14 Oct 2025 09:12:44 GMT\nContent-Type: text/html; charset=UTF-8\nConnection: keep-alive\nServer: nginx/1.24.0 (Ubuntu)\nCache-Control: no-cache</pre>"}], "question": "Place the one header line that leaks the software version into the target box.", "zones": ["This line leaks a software version"], "items": ["Server: nginx/1.24.0 (Ubuntu)", "Content-Type: text/html; charset=UTF-8", "Date: Tue, 14 Oct 2025 09:12:44 GMT", "Connection: keep-alive"], "map": [0, 1, 1, 1], "hint": "Look for a line that names a product AND a version number.", "explain": "The <b>Server</b> header names the product and version (nginx 1.24.0). That is the banner. Content-Type, Date and Connection are normal headers that do not name software. Removing or genericizing this line is a classic exposure fix.", "study": "Learn to spot version banners at a glance."}, {"id": "e11", "type": "qcm", "kindLabel": "Multiple choice", "title": "Seen from outside the network", "summary": "One visibility question: what can an attacker see from outside?", "scenario": "A manager asks: 'If the attacker sits outside our company, which of these can they actually see?'", "question": "Which piece of client configuration information is visible from OUTSIDE the network?", "options": ["A response header with a version banner", "A file stored on an employee's laptop", "A password hash from the internal database", "A private chat between two staff members"], "answerIdx": 0, "hint": "The attacker can only ask your public services. What do public services answer with?", "explain": "From outside, the attacker can interact with your public services and read their answers. A version banner in a response header is public by accident. Files, password hashes and private chats need inside access — that comes later in an attack, not during reconnaissance.", "study": "Ask always: does this need access, or is it exposed?"}, {"id": "e12", "type": "match", "kindLabel": "Matching", "title": "Match the tool to its recon job", "summary": "Three tools and their purpose in client-configuration recon.", "scenario": "You prepare a one-page glossary for new SOC joiners: 'Tools an attacker (or your own red team) may use for T1592.004 recon.'", "question": "Match each tool or source to its job.", "left": ["curl", "Job boards and social media", "Shodan-style search engines"], "right": ["Search internet-exposed services and their banners", "Send a web request and read response headers", "Open data where staff mention the systems they use"], "pairs": [1, 2, 0], "hint": "One tool talks to servers, one is a search engine for exposed services, one is public writing by people.", "explain": "curl talks directly to a server and reads headers. Shodan-style search engines index internet-exposed services and banners. Job boards and social media are open data where people mention systems — ATT&CK explicitly lists job postings and resumes as sources.", "study": "Group tools by how they reach the information: direct request, database, open data."}, {"id": "e13", "type": "dnd", "kindLabel": "Drag and drop", "title": "Attacker action or defender action?", "summary": "Four actions. Sort them by side.", "scenario": "You close your training week with a two-column poster: 'This recon has two sides.'", "question": "Sort each action into the correct side.", "zones": ["Attacker action", "Defender action"], "items": ["Fingerprint user agent strings", "Remove version banners", "Read job postings for system details", "Train staff to question odd surveys"], "map": [0, 1, 0, 1], "hint": "Collecting information is the attacker's side. Reducing what is exposed is the defender's side.", "explain": "Fingerprinting user agents and mining job postings collect client-configuration data (attacker). Removing banners and training staff reduce the exposure (defender). This is the mitigation M1056 Pre-compromise idea: minimize what outside parties can learn.", "study": "Every recon technique has a collection side and a reduction side."}, {"id": "e14", "type": "fill", "kindLabel": "Gap fill", "title": "Finish the defence sentence", "summary": "Three gaps about where recon happens and how to respond.", "scenario": "Your GRC teammate drafts a policy line and leaves three gaps for you.", "question": "Complete the policy sentence with the right words.", "template": "Reconnaissance happens {0} the victim's network. The ATT&CK mitigation that fits this technique is {1}. Exposing {2} detail helps the attacker.", "answers": ["outside", "M1056 (Pre-compromise)", "less"], "bank": ["outside", "M1056 (Pre-compromise)", "less", "inside", "M1049 (Antivirus)", "more"], "hint": "Gap 1: not inside. Gap 2: the mitigation ID for pre-attack techniques. Gap 3: less exposure, less help.", "explain": "Recon happens <b>outside</b> the network, so classic inside controls do not stop it. ATT&CK lists <b>M1056 Pre-compromise</b> for this technique: minimize the amount and sensitivity of data available to external parties. Exposing <b>less</b> detail gives the attacker less to use. M1049 Antivirus does not apply — there is no malware yet.", "study": "Re-read the intro section 'Mitigation and controls'."}, {"id": "e15", "type": "logview", "kindLabel": "Log analysis", "title": "Find the visitor that is not a browser", "summary": "Six web log lines. One client is a script, not a browser.", "scenario": [{"label": "Artefact — web server access log (one day, shortened)", "html": "<pre class=\"code\">\"GET /style.css HTTP/1.1\" 200 - \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0\"\n\"GET / HTTP/1.1\" 200 - \"python-requests/2.31\"\n\"GET /favicon.ico HTTP/1.1\" 200 - \"Mozilla/5.0 (iPhone; CPU iPhone OS 17_1 like Mac OS X)\"\n\"GET /contact HTTP/1.1\" 200 - \"Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15) Firefox/121.0\"\n\"GET /logo.png HTTP/1.1\" 200 - \"Mozilla/5.0 (X11; Linux x86_64) Chrome/119.0\"\n\"GET /blog HTTP/1.1\" 200 - \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Edge/120.0\"</pre>"}], "question": "Select the one log line whose client is a script probing the site.", "lines": ["\"GET /style.css HTTP/1.1\" 200 - \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0\"", "\"GET / HTTP/1.1\" 200 - \"python-requests/2.31\"", "\"GET /favicon.ico HTTP/1.1\" 200 - \"Mozilla/5.0 (iPhone; CPU iPhone OS 17_1 like Mac OS X)\"", "\"GET /contact HTTP/1.1\" 200 - \"Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15) Firefox/121.0\"", "\"GET /logo.png HTTP/1.1\" 200 - \"Mozilla/5.0 (X11; Linux x86_64) Chrome/119.0\"", "\"GET /blog HTTP/1.1\" 200 - \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Edge/120.0\""], "correctLines": [1], "hint": "Look at the client name in quotes at the end of each line. Real browsers name a browser product.", "explain": "The line with <b>python-requests/2.31</b> is a script, not a browser. Scripts like this send programmed requests — often to read banners or user agent handling. All other lines name real browser products (Chrome, Firefox, Edge, Safari on iPhone). The user agent string itself is one of the collection examples in the T1592.004 description.", "study": "Scan user agents for non-browser clients: scripts, libraries, scanners."}]};
</script>
<script>
/* ============================================================
   Cyber Pulse Academy exam engine — vanilla JS, no dependencies.
   One instance per file. Config arrives via window.EXAM.
   Implements: timer state machine (RUNNING / PAUSED_MANUAL /
   PAUSED_AUTO_CHECK / ENDED), partial-credit scoring
   max(0,(H-W)/N), hint penalty -0.10, skip + review pool,
   retake with reshuffle, CYBERPULSE score report, handshake.
   ============================================================ */
(function () {
  'use strict';
  var CFG = window.EXAM;
  var $ = function (id) { return document.getElementById(id); };

  /* ---------------- helpers ---------------- */
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function shuffle(arr) {
    var a = arr.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1));
      t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function fmtTime(sec) {
    if (sec < 0) { sec = 0; }
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function scoreExercise(H, W, N) {
    if (N <= 0) { return 0; }
    return Math.max(0, (H - W) / N);
  }
  function normCmd(cmd) {
    return String(cmd || '').trim().replace(/\s+/g, ' ').toLowerCase()
      .replace(/\[/g, '').replace(/\]/g, '').replace(/\/+$/, '');
  }

  /* ---------------- state ---------------- */
  var S = {
    phase: 'intro',            /* intro | exam | review | results */
    idx: 0,
    order: [],                 /* shuffled exercise indexes */
    rt: [],                    /* runtime per exercise */
    timerState: 'IDLE',
    remaining: 0,
    tickHandle: null,
    stateSince: 0,
    pausedManualTotal: 0,
    pausedAutoTotal: 0,
    score: 0,
    answered: 0,
    reported: false,
    reviewReturn: false,
    userInfo: null
  };
  var ADV = { active: false, left: 0, handle: null }; /* advisory per-exercise timer (EXTREMELY HARD terminal) */

  function rt(i) { return S.rt[S.order[i]]; }

  /* ---------------- timer state machine ---------------- */
  var STATE_LABEL = {
    IDLE: ['\u23F8', 'Idle'],
    RUNNING: ['\u25B6', 'Running'],
    PAUSED_MANUAL: ['\u23F8', 'PAUSED — manual (press Resume)'],
    PAUSED_AUTO_CHECK: ['\u23F8', 'PAUSED — reviewing feedback (resumes on Next)'],
    ENDED: ['\u23F9', 'Ended']
  };
  function setState(next) {
    var now = Date.now();
    if (S.timerState === 'PAUSED_MANUAL') { S.pausedManualTotal += (now - S.stateSince); }
    if (S.timerState === 'PAUSED_AUTO_CHECK') { S.pausedAutoTotal += (now - S.stateSince); }
    S.timerState = next;
    S.stateSince = now;
    renderTimerChip();
  }
  function startExamTimer() {
    S.remaining = CFG.minutes * 60;
    setState('RUNNING');
    if (S.tickHandle) { clearInterval(S.tickHandle); }
    S.tickHandle = setInterval(function () {
      if (S.timerState === 'RUNNING') {
        S.remaining -= 1;
        if (ADV.active && ADV.left > 0) {
          ADV.left -= 1;
          renderAdvisory();
          if (ADV.left === 0) { advisoryExpired(); }
        }
        if (S.remaining <= 0) {
          S.remaining = 0;
          setState('ENDED');
          finishExam(true);
        }
        renderTimerChip();
      }
    }, 1000);
    renderTimerChip();
  }
  function renderTimerChip() {
    var chip = $('timer-chip');
    var lab = STATE_LABEL[S.timerState] || STATE_LABEL.IDLE;
    chip.innerHTML = '<span class="t-ico">' + lab[0] + '</span> ' + fmtTime(S.remaining) +
      ' <span class="t-state">' + esc(lab[1]) + '</span>';
    chip.className = 'chip timer-chip state-' + S.timerState;
  }
  function renderAdvisory() {
    var box = $('advisory-chip');
    if (!box) { return; }
    if (!ADV.active) { box.innerHTML = ''; return; }
    var cls = ADV.left <= 30 ? 'adv-crit' : 'adv-warn';
    box.innerHTML = 'Per-exercise timer: <b>' + fmtTime(ADV.left) + '</b>';
    box.className = 'advisory ' + cls;
  }
  function advisoryExpired() {
    var box = $('advisory-chip');
    if (box) {
      box.innerHTML = 'Per-exercise timer expired.';
      box.className = 'advisory adv-crit';
    }
    var cmd = lastTerminalCommand();
    if (cmd && cmd.trim() !== '') { doCheck(); }
  }
  function startAdvisory(sec) {
    ADV.active = true; ADV.left = sec;
    renderAdvisory();
  }
  function stopAdvisory() {
    ADV.active = false; ADV.left = 0;
    renderAdvisory();
  }

  /* ---------------- header / score ---------------- */
  function updateHeader() {
    $('ex-counter').textContent = 'Exercise ' + (S.idx + 1) + ' of ' + S.order.length;
    var pct = S.answered > 0 ? Math.round((S.score / S.answered) * 100) : 0;
    $('score-chip').textContent = 'Score ' + S.score.toFixed(1) + ' / ' + S.answered + ' (' + pct + '%)';
  }
  function renderTimerStateAlways() { renderTimerChip(); }

  /* ---------------- screens ---------------- */
  function show(screen) {
    ['intro', 'exam', 'review', 'results'].forEach(function (s) {
      $('screen-' + s).style.display = (s === screen) ? 'block' : 'none';
    });
    S.phase = screen;
    window.scrollTo(0, 0);
  }

  /* ---------------- intro ---------------- */
  function renderIntro() {
    var greet = '';
    if (S.userInfo && S.userInfo.username) {
      greet = '<p class="greet">Welcome, <b>' + esc(S.userInfo.username) + '</b>. Good luck!</p>';
    }
    var h = '<div class="intro-wrap">' + greet +
      '<h1 class="intro-title">' + esc(CFG.title) + '</h1>' +
      '<div class="meta-row">' +
      '<span class="badge sev-' + CFG.sev + '">' + esc(CFG.sevName) + '</span>' +
      '<span class="chip">' + CFG.exCount + ' exercises</span>' +
      '<span class="chip">' + CFG.minutes + ' minutes</span>' +
      '<span class="chip">Pass mark: 70%</span>' +
      '<span class="chip">Hint: \u221210% of one exercise</span>' +
      '</div>' +
      '<div class="intro-grid">' +
      '<section class="intro-card"><h2>About this practice exam</h2>' + CFG.introHtml + '</section>' +
      '<section class="intro-card"><h2>How this exam works</h2>' +
      '<ul class="rules">' +
      '<li><b>Goal:</b> reach at least <b>70%</b>. Each exercise gives at most 1 point of credit.</li>' +
      '<li><b>Partial credit:</b> exercises with several correct items are scored per item. Wrong items subtract from correct ones (credit = (correct \u2212 wrong) \u00F7 total). A partly right answer still earns part of the point. Selecting everything is never a good idea.</li>' +
      '<li><b>Check = free thinking time:</b> when you press <b>Check</b>, the timer stops by itself. Read the feedback as long as you like. The timer starts again only when you press <b>Next</b>.</li>' +
      '<li><b>Manual pause:</b> the <b>Pause</b> button stops the timer and hides the exercise. Press <b>Resume</b> to continue.</li>' +
      '<li><b>Hints:</b> one hint per exercise. A hint costs 10% of that exercise\u2019s credit.</li>' +
      '<li><b>Skip:</b> every exercise has a <b>Skip</b> button. Skipped exercises go to a review pool. You may return to them until the timer ends. Before you finish, a review screen lists them. Skipped-and-never-answered exercises are excluded from your score \u2014 they count as neither right nor wrong.</li>' +
      '<li><b>Severity:</b> this file is the <b>' + esc(CFG.sevName) + '</b> tier. ' + esc(CFG.sevMeaning) + '</li>' +
      '<li><b>Exercise types:</b> ' + esc(CFG.typeList) + '.</li>' +
      '</ul></section>' +
      '</div>' +
      '<section class="intro-card themes"><h2>Keywords covered \u2014 T1592.004 concept map</h2>' + CFG.themesHtml + '</section>' +
      '<div class="start-row"><button id="btn-start" class="btn primary big">Start the exam</button></div>' +
      '</div>';
    $('screen-intro').innerHTML = h;
    $('btn-start').addEventListener('click', startExam);
  }

  /* ---------------- exam flow ---------------- */
  function startExam() {
    S.order = shuffle(S.order);
    resetRuntime();
    S.idx = 0; S.score = 0; S.answered = 0; S.reported = false;
    S.reviewReturn = false; S.prevAuto = false;
    S.pausedManualTotal = 0; S.pausedAutoTotal = 0;
    startExamTimer();
    show('exam');
    renderExercise();
    updateHeader();
  }
  function resetRuntime() {
    S.rt = [];
    CFG.exercises.forEach(function (ex, i) {
      /* clear per-attempt shuffle caches so retakes reshuffle answer choices */
      delete ex._shufOpts; delete ex._shufRight; delete ex._shufItems;
      delete ex._shufSeq; delete ex._shufBank;
      if (ex.type === 'branch' && Array.isArray(ex.steps)) {
        ex.steps.forEach(function (st) { delete st._shufOpts; });
      }
      S.rt.push({
        def: ex, n: i, done: false, skipped: false, credit: null,
        hintUsed: false, hintShown: false, answer: null, lastCmd: ''
      });
    });
  }

  function scenarioHtml(r) {
    var def = r.def;
    var out = '<div class="blk blk-scenario"><div class="blk-head" id="sc-toggle" role="button" tabindex="0" aria-expanded="true">' +
      '<span class="blk-ico">\u{1F4CB}</span> SCENARIO <span class="blk-toggle" id="sc-state">(collapse)</span></div>';
    out += '<div class="blk-body" id="sc-body">';
    if (def.summary) { out += '<p class="sc-summary">' + esc(def.summary) + '</p>'; }
    if (Array.isArray(def.scenario)) {
      def.scenario.forEach(function (a) {
        out += '<div class="artefact"><div class="artefact-label">' + esc(a.label) + '</div>' +
          '<div class="artefact-body">' + a.html + '</div></div>';
      });
    } else if (def.scenario) {
      out += '<p>' + def.scenario + '</p>';
    }
    out += '</div></div>';
    return out;
  }

  function renderExercise() {
    stopAdvisory();
    var r = rt(S.idx);
    var def = r.def;
    var hb = $('hint-box');
    if (hb) { hb.style.display = 'none'; hb.innerHTML = ''; }
    $('btn-hint').disabled = !!(r.hintShown || r.done);
    var wrap = $('exercise-area');
    var head = '<div class="blk blk-question"><div class="blk-head"><span class="blk-ico">\u2753</span> QUESTION</div>' +
      '<div class="blk-body"><p class="q-text">' + esc(def.question) + '</p></div></div>';
    wrap.innerHTML =
      '<div class="ex-topline"><span class="badge sev-' + CFG.sev + '">' + esc(CFG.sevName) + '</span>' +
      '<span class="ex-title">' + esc(def.title) + '</span>' +
      '<span class="ex-kind">' + esc(def.kindLabel) + '</span></div>' +
      scenarioHtml(r) +
      head +
      '<div class="blk blk-answer"><div class="blk-head"><span class="blk-ico">\u270D</span> YOUR ANSWER</div>' +
      '<div class="blk-body" id="answer-area"></div></div>' +
      '<div id="advisory-chip" class="advisory"></div>' +
      '<div class="action-row">' +
      '<button id="btn-check" class="btn primary">Check</button>' +
      '<button id="btn-next" class="btn" style="display:none">Next</button>' +
      '</div>' +
      '<div id="nudge-msg" class="nudge" role="status"></div>' +
      '<div id="feedback" class="feedback" aria-live="polite"></div>';
    $('sc-toggle').addEventListener('click', toggleScenario);
    $('sc-toggle').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleScenario(); }
    });
    renderers[def.type](r, $('answer-area'));
    $('btn-check').addEventListener('click', doCheck);
    $('btn-next').addEventListener('click', doNext);
    var isLast = (S.idx === S.order.length - 1);
    $('btn-next').textContent = isLast ? 'Final Submit' : 'Next';
    if (def.advisorySec && !r.done) {
      $('advisory-chip').className = 'advisory adv-warn';
      $('advisory-chip').innerHTML = 'This terminal exercise has a reduced per-exercise timer of ' + def.advisorySec + ' seconds. It pauses together with the main timer.';
      if (S.timerState === 'RUNNING') { startAdvisory(def.advisorySec); }
    }
    if (r.done) {
      $('btn-check').style.display = 'none';
      $('btn-next').style.display = '';
      $('btn-skip').disabled = true;
      renderFeedback(r, $('feedback'));
      lockAnswerArea();
    } else {
      $('btn-next').style.display = 'none';
      $('btn-check').style.display = '';
      $('btn-skip').disabled = false;
      $('feedback').innerHTML = '';
    }
    updateHeader();
    window.scrollTo(0, 0);
  }
  function toggleScenario() {
    var body = $('sc-body'), st = $('sc-state'), t = $('sc-toggle');
    var open = body.style.display !== 'none';
    body.style.display = open ? 'none' : 'block';
    t.setAttribute('aria-expanded', open ? 'false' : 'true');
    st.textContent = open ? '(expand \u2014 collapsed: ' + (rt(S.idx).def.summary || '') + ')' : '(collapse)';
  }

  /* ---------------- renderers per type ---------------- */
  var renderers = {
    qcm: function (r, area) {
      var def = r.def;
      var opts = def._shufOpts || (def._shufOpts = shuffle(def.options.map(function (o, i) { return { t: o, i: i }; })));
      var a = r.answer || (r.answer = { sel: -1 });
      var h = '<div class="opt-list" role="radiogroup" aria-label="Answer options">';
      opts.forEach(function (o, k) {
        var letter = String.fromCharCode(65 + k);
        h += '<button type="button" class="opt' + (a.sel === o.i ? ' selected' : '') + '" data-oi="' + o.i + '" role="radio" aria-checked="' + (a.sel === o.i) + '">' +
          '<span class="opt-letter">' + letter + '.</span> <span class="opt-text">' + esc(o.t) + '</span></button>';
      });
      h += '</div>';
      area.innerHTML = h;
      Array.prototype.forEach.call(area.querySelectorAll('.opt'), function (b) {
        b.addEventListener('click', function () {
          a.sel = parseInt(b.getAttribute('data-oi'), 10);
          Array.prototype.forEach.call(area.querySelectorAll('.opt'), function (x) { x.classList.remove('selected'); x.setAttribute('aria-checked', 'false'); });
          b.classList.add('selected'); b.setAttribute('aria-checked', 'true');
        });
      });
    },
    'qcm-multi': function (r, area) {
      var def = r.def;
      var opts = def._shufOpts || (def._shufOpts = shuffle(def.options.map(function (o, i) { return { t: o, i: i }; })));
      var a = r.answer || (r.answer = { sel: {} });
      var h = '<p class="mut">Select all options that apply. Wrong choices subtract.</p><div class="opt-list">';
      opts.forEach(function (o, k) {
        var letter = String.fromCharCode(65 + k);
        h += '<button type="button" class="opt' + (a.sel[o.i] ? ' selected' : '') + '" data-oi="' + o.i + '" role="checkbox" aria-checked="' + (!!a.sel[o.i]) + '">' +
          '<span class="opt-letter">' + letter + '.</span> <span class="opt-text">' + esc(o.t) + '</span></button>';
      });
      h += '</div>';
      area.innerHTML = h;
      Array.prototype.forEach.call(area.querySelectorAll('.opt'), function (b) {
        b.addEventListener('click', function () {
          var oi = parseInt(b.getAttribute('data-oi'), 10);
          a.sel[oi] = !a.sel[oi];
          b.classList.toggle('selected', !!a.sel[oi]);
          b.setAttribute('aria-checked', (!!a.sel[oi]) ? 'true' : 'false');
        });
      });
    },
    match: function (r, area) {
      var def = r.def;
      if (!def._shufRight) {
        def._shufRight = shuffle(def.right.map(function (t, i) { return { t: t, i: i }; }));
      }
      var a = r.answer || (r.answer = { picks: {} });
      var h = '<p class="mut">For each row, pick the matching option. Each correct pair scores.</p><div class="match-list">';
      def.left.forEach(function (L, li) {
        var sel = (a.picks[li] === undefined) ? '' : a.picks[li];
        h += '<div class="match-row"><div class="match-left"><span class="opt-letter">' + (li + 1) + '.</span> ' + esc(L) + '</div>' +
          '<select class="match-sel" data-li="' + li + '" aria-label="Match for row ' + (li + 1) + '">' +
          '<option value="">\u2014 choose \u2014</option>';
        def._shufRight.forEach(function (o) {
          h += '<option value="' + o.i + '"' + (sel === o.i ? ' selected' : '') + '>' + esc(o.t) + '</option>';
        });
        h += '</select></div>';
      });
      h += '</div>';
      area.innerHTML = h;
      Array.prototype.forEach.call(area.querySelectorAll('.match-sel'), function (s) {
        s.addEventListener('change', function () {
          a.picks[s.getAttribute('data-li')] = s.value === '' ? undefined : parseInt(s.value, 10);
        });
      });
    },
    dnd: function (r, area) {
      var def = r.def;
      if (!def._shufItems) { def._shufItems = shuffle(def.items.map(function (t, i) { return { t: t, i: i }; })); }
      var a = r.answer || (r.answer = { placed: {} });
      var single = (def.zones.length === 1);
      var lastFocusOi = null;
      var h = '<p class="mut">' + (single ?
        'Select the one item that belongs in the target, then press the target. A placed item can be sent back.' :
        'Select an item, then press the zone where it belongs. You can also drag items. Selecting everything hurts your score.') + '</p>';
      h += '<div class="dnd-wrap"><div class="dnd-bank"><h4>Items</h4><div id="dnd-bank-list" class="dnd-list"></div></div>';
      def.zones.forEach(function (z, zi) {
        h += '<div class="dnd-zone" data-zi="' + zi + '" tabindex="0" role="button" aria-label="Drop zone: ' + esc(z) + '"><h4>' + esc(z) + '</h4><div class="dnd-list" data-zi="' + zi + '"></div></div>';
      });
      h += '</div>';
      area.innerHTML = h;
      var selItem = null;
      function draw() {
        var bank = area.querySelector('#dnd-bank-list');
        bank.innerHTML = '';
        def._shufItems.forEach(function (o) {
          if (a.placed[o.i] !== undefined) { return; }
          bank.appendChild(dndBtn(o, false));
        });
        if (bank.children.length === 0) { bank.innerHTML = '<span class="mut">(all items placed)</span>'; }
        Array.prototype.forEach.call(area.querySelectorAll('.dnd-list[data-zi]'), function (zl) {
          var zi = parseInt(zl.getAttribute('data-zi'), 10);
          zl.innerHTML = '';
          def._shufItems.forEach(function (o) {
            if (a.placed[o.i] === zi) { zl.appendChild(dndBtn(o, true)); }
          });
        });
        /* keyboard: keep focus on the same item after a re-render */
        if (lastFocusOi !== null) {
          var ref = area.querySelector('.dnd-item[data-oi="' + lastFocusOi + '"]');
          if (ref) { ref.focus(); } else { lastFocusOi = null; }
        }
      }
      function dndBtn(o, placed) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'dnd-item' + (selItem === o.i ? ' selected' : '');
        b.setAttribute('draggable', 'true');
        b.setAttribute('data-oi', o.i);
        b.textContent = o.t;
        b.addEventListener('click', function () {
          lastFocusOi = o.i;
          if (placed) {
            delete a.placed[o.i]; selItem = null; draw();
          } else if (single) {
            a.placed[o.i] = 0; selItem = null; draw();
          } else {
            selItem = (selItem === o.i) ? null : o.i; draw();
          }
        });
        b.addEventListener('dragstart', function (e) {
          e.dataTransfer.setData('text/plain', String(o.i));
        });
        return b;
      }
      Array.prototype.forEach.call(area.querySelectorAll('.dnd-zone'), function (z) {
        var zi = parseInt(z.getAttribute('data-zi'), 10);
        function place(oi) {
          if (single) { a.placed = {}; }
          a.placed[oi] = zi; selItem = null; lastFocusOi = oi; draw();
        }
        z.addEventListener('click', function () {
          if (selItem !== null) { place(selItem); }
        });
        z.addEventListener('keydown', function (e) {
          if ((e.key === 'Enter' || e.key === ' ') && selItem !== null) { e.preventDefault(); place(selItem); }
        });
        z.addEventListener('dragover', function (e) { e.preventDefault(); });
        z.addEventListener('drop', function (e) {
          e.preventDefault();
          place(parseInt(e.dataTransfer.getData('text/plain'), 10));
        });
      });
      draw();
    },
    order: function (r, area) {
      var def = r.def;
      if (!def._shufSeq) { def._shufSeq = shuffle(def.items.map(function (t, i) { return i; })); }
      var a = r.answer || (r.answer = { seq: def._shufSeq.slice() });
      var focusReq = null;
      function draw() {
        var h = '<p class="mut">Put the steps in the right order (top = first). Use the arrows or drag.</p><ol class="order-list">';
        a.seq.forEach(function (oi, pos) {
          h += '<li class="order-item" draggable="true" data-pos="' + pos + '">' +
            '<span class="order-controls">' +
            '<button type="button" class="mini" data-mv="up" data-pos="' + pos + '" aria-label="Move up">\u2191</button>' +
            '<button type="button" class="mini" data-mv="down" data-pos="' + pos + '" aria-label="Move down">\u2193</button>' +
            '</span><span class="order-text">' + esc(def.items[oi]) + '</span></li>';
        });
        h += '</ol>';
        area.innerHTML = h;
        if (focusReq) {
          var fb2 = area.querySelector('.mini[data-mv="' + focusReq.mv + '"][data-pos="' + focusReq.pos + '"]');
          if (fb2) { fb2.focus(); }
          focusReq = null;
        }
        Array.prototype.forEach.call(area.querySelectorAll('.mini'), function (b) {
          b.addEventListener('click', function () {
            var pos = parseInt(b.getAttribute('data-pos'), 10);
            var d = b.getAttribute('data-mv') === 'up' ? -1 : 1;
            var np = pos + d;
            if (np < 0 || np >= a.seq.length) { return; }
            var t = a.seq[pos]; a.seq[pos] = a.seq[np]; a.seq[np] = t;
            focusReq = { mv: b.getAttribute('data-mv'), pos: np };
            draw();
          });
        });
        var dragPos = null;
        Array.prototype.forEach.call(area.querySelectorAll('.order-item'), function (li) {
          li.addEventListener('dragstart', function (e) {
            dragPos = parseInt(li.getAttribute('data-pos'), 10);
            e.dataTransfer.setData('text/plain', String(dragPos));
          });
          li.addEventListener('dragover', function (e) { e.preventDefault(); });
          li.addEventListener('drop', function (e) {
            e.preventDefault();
            var from = parseInt(e.dataTransfer.getData('text/plain'), 10);
            var to = parseInt(li.getAttribute('data-pos'), 10);
            if (isNaN(from) || from === to) { return; }
            var it = a.seq.splice(from, 1)[0];
            a.seq.splice(to, 0, it);
            draw();
          });
        });
      }
      draw();
    },
    fill: function (r, area) {
      var def = r.def;
      if (!def._shufBank) { def._shufBank = shuffle(def.bank); }
      var a = r.answer || (r.answer = { picks: {} });
      var parts = def.template.split(/\{(\d+)\}/);
      var h = '<p class="mut">Pick the right keyword for each gap. The word bank is shuffled.</p><div class="fill-text">';
      var bi = 0;
      for (var p = 0; p < parts.length; p++) {
        if (p % 2 === 0) {
          h += esc(parts[p]);
        } else {
          var n = parseInt(parts[p], 10);
          var sel = (a.picks[n] === undefined) ? '' : a.picks[n];
          h += '<select class="fill-sel" data-n="' + n + '" aria-label="Gap ' + (n + 1) + '"><option value="">\u2014 ? \u2014</option>';
          def._shufBank.forEach(function (w) {
            h += '<option value="' + esc(w) + '"' + (sel === w ? ' selected' : '') + '>' + esc(w) + '</option>';
          });
          h += '</select>';
          bi++;
        }
      }
      h += '</div>';
      area.innerHTML = h;
      Array.prototype.forEach.call(area.querySelectorAll('.fill-sel'), function (s) {
        s.addEventListener('change', function () {
          a.picks[s.getAttribute('data-n')] = s.value === '' ? undefined : s.value;
        });
      });
    },
    terminal: function (r, area) {
      var def = r.def;
      var a = r.answer || (r.answer = { lines: [] });
      var h = '<div class="term-wrap">' +
        (def.briefing ? '<div class="term-brief">' + def.briefing + '</div>' : '') +
        '<div class="term-screen" id="term-screen" aria-live="polite"><div class="term-line term-sys">' + esc(def.motd || 'simulation shell \u2014 nothing here runs for real') + '</div></div>' +
        '<div class="term-input-row"><span class="term-prompt">' + esc(def.prompt || 'analyst@box:~$') + '</span>' +
        '<input id="term-input" class="term-input" type="text" autocomplete="off" spellcheck="false" aria-label="Type your command" placeholder="type a command and press Enter"></div>' +
        '</div>';
      area.innerHTML = h;
      var scr = area.querySelector('#term-screen');
      var inp = area.querySelector('#term-input');
      function run() {
        var cmd = inp.value;
        if (cmd.trim() === '') { return; }
        a.lines.push(cmd);
        r.lastCmd = cmd;
        var line = document.createElement('div');
        line.className = 'term-line term-cmd';
        line.textContent = (def.prompt || 'analyst@box:~$') + ' ' + cmd;
        scr.appendChild(line);
        var norm = normCmd(cmd);
        var firstRe = def.elements[0];
        var toolRe = new RegExp(firstRe.re, 'i');
        var out = document.createElement('div');
        if (toolRe.test(norm)) {
          out.className = 'term-line term-out';
          out.textContent = def.sim;
        } else {
          out.className = 'term-line term-err';
          var tok = norm.split(' ')[0] || '(empty)';
          out.textContent = 'command not found: ' + tok + '   (simulation: only the exercise\u2019s tool set is available)';
        }
        scr.appendChild(out);
        inp.value = '';
        scr.scrollTop = scr.scrollHeight;
      }
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); run(); }
      });
    },
    branch: function (r, area) {
      var def = r.def;
      var a = r.answer || (r.answer = { step: 0, picks: {} });
      function drawStep() {
        var st = def.steps[a.step];
        var total = def.steps.length;
        var opts = st._shufOpts || (st._shufOpts = shuffle(st.options.map(function (o, i) { return { t: o, i: i }; })));
        var h = '<div class="step-badge">STEP ' + (a.step + 1) + ' OF ' + total + '</div>';
        h += '<p class="q-text">' + esc(st.question) + '</p><div class="opt-list" role="radiogroup">';
        opts.forEach(function (o, k) {
          var letter = String.fromCharCode(65 + k);
          h += '<button type="button" class="opt' + (a.picks[a.step] === o.i ? ' selected' : '') + '" data-oi="' + o.i + '" role="radio" aria-checked="' + (a.picks[a.step] === o.i) + '">' +
            '<span class="opt-letter">' + letter + '.</span> <span class="opt-text">' + esc(o.t) + '</span></button>';
        });
        h += '</div><div class="action-row">' +
          '<button id="branch-btn" class="btn primary">' + (a.step === total - 1 ? 'Check' : 'Confirm step') + '</button></div>' +
          '<div id="branch-ack" class="mut"></div>';
        area.innerHTML = h;
        Array.prototype.forEach.call(area.querySelectorAll('.opt'), function (b) {
          b.addEventListener('click', function () {
            a.picks[a.step] = parseInt(b.getAttribute('data-oi'), 10);
            Array.prototype.forEach.call(area.querySelectorAll('.opt'), function (x) { x.classList.remove('selected'); });
            b.classList.add('selected');
          });
        });
        area.querySelector('#branch-btn').addEventListener('click', function () {
          if (a.picks[a.step] === undefined) {
            area.querySelector('#branch-ack').textContent = 'Choose an option first.';
            return;
          }
          if (a.step < total - 1) {
            a.step += 1;
            drawStep();
            var firstOpt = area.querySelector('.opt');
            if (firstOpt) { firstOpt.focus(); }
          } else {
            doCheck();
          }
        });
      }
      drawStep();
    },
    logview: function (r, area) {
      var def = r.def;
      var a = r.answer || (r.answer = { sel: {} });
      var h = '<p class="mut">Use the filter box, then select every log line that the question asks for. Wrong picks subtract.</p>' +
        '<div class="log-filter-row"><label for="log-filter">Filter:</label>' +
        '<input id="log-filter" class="log-filter" type="text" placeholder="type to filter lines\u2026"></div>' +
        '<div class="log-view" id="log-view"></div>';
      area.innerHTML = h;
      var view = area.querySelector('#log-view');
      function draw(f) {
        f = (f || '').toLowerCase();
        view.innerHTML = '';
        def.lines.forEach(function (ln, i) {
          if (f && ln.toLowerCase().indexOf(f) === -1) { return; }
          var d = document.createElement('div');
          d.className = 'log-line' + (a.sel[i] ? ' selected' : '');
          d.setAttribute('role', 'button');
          d.setAttribute('tabindex', '0');
          d.setAttribute('aria-pressed', (!!a.sel[i]) ? 'true' : 'false');
          var num = document.createElement('span');
          num.className = 'log-num';
          num.textContent = String(i + 1).padStart(2, '0');
          var txt = document.createElement('span');
          txt.className = 'log-text';
          txt.textContent = ln;
          d.appendChild(num);
          d.appendChild(txt);
          function toggle() {
            a.sel[i] = !a.sel[i];
            d.classList.toggle('selected', !!a.sel[i]);
            d.setAttribute('aria-pressed', (!!a.sel[i]) ? 'true' : 'false');
          }
          d.addEventListener('click', toggle);
          d.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
          });
          view.appendChild(d);
        });
        if (view.children.length === 0) {
          view.innerHTML = '<div class="mut" style="padding:10px">No lines match this filter.</div>';
        }
      }
      area.querySelector('#log-filter').addEventListener('input', function (e) {
        draw(e.target.value);
      });
      draw('');
    }
  };

  function lastTerminalCommand() {
    var r = rt(S.idx);
    return r && r.lastCmd ? r.lastCmd : '';
  }

  /* ---------------- grading ---------------- */
  function grade(r) {
    var def = r.def, N, H = 0, W = 0, rows = [];
    function row(ok, state, text) { rows.push({ ok: ok, state: state, text: text }); }
    if (def.type === 'qcm') {
      N = 1;
      var sel = r.answer.sel;
      if (sel === def.answerIdx) { H = 1; }
      else if (sel >= 0) { W = 1; }
      def.options.forEach(function (o, i) {
        if (i === def.answerIdx) { row(true, sel === i ? 'correct' : 'missed', 'Correct answer: ' + o); }
        else if (sel === i) { row(false, 'wrong', 'You chose: ' + o); }
      });
    } else if (def.type === 'qcm-multi') {
      N = def.answerIdxs.length;
      def.options.forEach(function (o, i) {
        var isC = def.answerIdxs.indexOf(i) >= 0;
        var isS = !!r.answer.sel[i];
        if (isC && isS) { H++; row(true, 'correct', o); }
        else if (!isC && isS) { W++; row(false, 'wrong', o); }
        else if (isC && !isS) { row(true, 'missed', o); }
      });
    } else if (def.type === 'match') {
      N = def.left.length;
      def.left.forEach(function (L, i) {
        var pick = r.answer.picks[i];
        var rightTxt = def.right[def.pairs[i]];
        if (pick === def.pairs[i]) { H++; row(true, 'correct', L + ' \u2192 ' + rightTxt); }
        else if (pick === undefined) { row(true, 'missed', L + ' \u2192 ' + rightTxt); }
        else { W++; row(false, 'wrong', L + ' \u2192 ' + rightTxt); }
      });
    } else if (def.type === 'dnd') {
      var singleZone = (def.zones.length === 1);
      if (singleZone) {
        N = 1;
        def.items.forEach(function (t, i) {
          var placed = r.answer.placed[i];
          var isTarget = (def.map[i] === 0);
          if (isTarget && placed === 0) { H++; row(true, 'correct', t + ' \u2192 ' + def.zones[0]); }
          else if (isTarget && placed === undefined) { row(true, 'missed', t + ' \u2192 ' + def.zones[0]); }
          else if (!isTarget && placed === 0) { W++; row(false, 'wrong', t + ' (should NOT be placed in the target)'); }
        });
      } else {
        N = def.items.length;
        def.items.forEach(function (t, i) {
          var placed = r.answer.placed[i];
          if (placed === def.map[i]) { H++; row(true, 'correct', t + ' \u2192 ' + def.zones[def.map[i]]); }
          else if (placed === undefined) { row(true, 'missed', t + ' \u2192 ' + def.zones[def.map[i]]); }
          else { W++; row(false, 'wrong', t + ' \u2192 ' + def.zones[placed] + ' (should be: ' + def.zones[def.map[i]] + ')'); }
        });
      }
    } else if (def.type === 'order') {
      N = def.items.length;
      def.items.forEach(function (t, itemIdx) {
        var pos = r.answer.seq.indexOf(itemIdx);
        var want = def.correctSeq.indexOf(itemIdx);
        if (pos === want) { H++; row(true, 'correct', 'Position ' + (want + 1) + ': ' + t); }
        else { W++; row(false, 'wrong', 'Position ' + (want + 1) + ': ' + t + ' (you placed it at ' + (pos + 1) + ')'); }
      });
    } else if (def.type === 'fill') {
      N = def.answers.length;
      def.answers.forEach(function (ans, i) {
        var pick = r.answer.picks[i];
        if (pick === ans) { H++; row(true, 'correct', 'Gap ' + (i + 1) + ': ' + ans); }
        else if (pick === undefined) { row(true, 'missed', 'Gap ' + (i + 1) + ': ' + ans); }
        else { W++; row(false, 'wrong', 'Gap ' + (i + 1) + ': ' + ans + ' (you chose: ' + pick + ')'); }
      });
    } else if (def.type === 'terminal') {
      N = def.elements.length;
      var norm = normCmd(r.lastCmd);
      def.elements.forEach(function (e) {
        var re = new RegExp(e.re, 'i');
        if (re.test(norm)) { H++; row(true, 'correct', e.name + ': ' + (e.show || e.re)); }
        else { row(true, 'missed', e.name + ': ' + (e.show || e.re)); }
      });
      (def.wrong || []).forEach(function (e) {
        var re = new RegExp(e.re, 'i');
        if (re.test(norm)) { W++; row(false, 'wrong', e.name + ': ' + (e.show || e.re)); }
      });
      if (norm === '') { W = N; }
      var dangerHit = null;
      (def.danger || []).forEach(function (d) {
        var re = new RegExp(d.re, 'i');
        if (re.test(norm)) { dangerHit = d; }
      });
      if (dangerHit) { rows.unshift({ ok: false, state: 'danger', text: dangerHit.note }); }
    } else if (def.type === 'branch') {
      N = def.steps.length;
      def.steps.forEach(function (st, i) {
        var pick = r.answer.picks[i];
        if (pick === st.answerIdx) { H++; row(true, 'correct', 'Step ' + (i + 1) + ': ' + st.options[st.answerIdx]); }
        else if (pick === undefined) { row(true, 'missed', 'Step ' + (i + 1) + ': ' + st.options[st.answerIdx]); }
        else { W++; row(false, 'wrong', 'Step ' + (i + 1) + ': ' + st.options[st.answerIdx]); }
      });
    } else if (def.type === 'logview') {
      N = def.correctLines.length;
      def.lines.forEach(function (ln, i) {
        var isC = def.correctLines.indexOf(i) >= 0;
        var isS = !!r.answer.sel[i];
        if (isC && isS) { H++; row(true, 'correct', 'Line ' + (i + 1) + ': ' + ln); }
        else if (!isC && isS) { W++; row(false, 'wrong', 'Line ' + (i + 1) + ': ' + ln); }
        else if (isC && !isS) { row(true, 'missed', 'Line ' + (i + 1) + ': ' + ln); }
      });
    } else {
      N = 1;
    }
    var credit = scoreExercise(H, W, N);
    if (r.hintUsed) { credit = Math.max(0, credit - 0.10); }
    return { credit: credit, rows: rows, H: H, W: W, N: N };
  }

  /* ---------------- feedback ---------------- */
  function labelFor(credit) {
    if (credit >= 1) { return ['\u2714', 'CORRECT', 'ok']; }
    if (credit > 0) { return ['\u2714', 'PARTIALLY CORRECT', 'part']; }
    return ['\u2718', 'INCORRECT', 'bad'];
  }
  function renderFeedback(r, box) {
    var g = grade(r);
    var def = r.def;
    var lab = labelFor(g.credit);
    var h = '<div class="fb-head fb-' + lab[2] + '"><span class="fb-ico">' + lab[0] + '</span> ' + lab[1];
    if (g.N > 1 || g.credit !== Math.round(g.credit)) {
      h += ' \u2014 credit ' + g.credit.toFixed(2) + ' (' + g.H + '/' + g.N + ' items';
      if (g.W > 0) { h += ', ' + g.W + ' wrong'; }
      h += ')';
    }
    if (r.hintUsed) { h += ' <span class="fb-hintnote">(includes \u22120.10 hint cost)</span>'; }
    h += '</div>';
    if (g.rows.length > 1 || (def.type !== 'qcm')) {
      h += '<div class="fb-rows">';
      g.rows.forEach(function (rw) {
        var icon = rw.state === 'correct' ? '\u2714 Correct' : rw.state === 'wrong' ? '\u2718 Wrong' : '\u25CB Missed';
        if (rw.state === 'danger') { icon = '\u26A0 Warning'; }
        h += '<div class="fb-row"><span class="fb-state fb-' + rw.state + '">' + icon + '</span> <span>' + rw.text + '</span></div>';
      });
      h += '</div>';
    }
    h += '<div class="fb-explain"><b>Why:</b> ' + def.explain + '</div>';
    if (def.type === 'terminal') {
      h += '<div class="fb-canonical"><b>Expected command (copyable):</b><pre class="code" id="canon-cmd">' + esc(def.canonical) +
        '</pre><button class="btn mini" id="copy-canon" type="button">Copy</button></div>';
      if (def.canonExpl) {
        h += '<div class="fb-canon-expl"><b>Command parts:</b><ul>' + def.canonExpl.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div>';
      }
    }
    h += '<div class="fb-study"><b>What to study next:</b> ' + (def.study || 'Review the intro panel section about this concept, then retake the exam.') + '</div>';
    box.innerHTML = h;
    var copyBtn = box.querySelector('#copy-canon');
    if (copyBtn) {
      copyBtn.addEventListener('click', function () {
        var txt = def.canonical;
        function copyOk() {
          copyBtn.textContent = 'Copied \u2714';
          setTimeout(function () { copyBtn.textContent = 'Copy'; }, 2500);
        }
        function copyFallback() {
          try {
            var ta = document.createElement('textarea');
            ta.value = txt;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { ta.setSelectionRange(0, txt.length); } catch (e2) {}
            var done = false;
            try { done = document.execCommand('copy'); } catch (e3) {}
            document.body.removeChild(ta);
            copyBtn.textContent = done ? 'Copied \u2714' : 'Select and copy manually';
          } catch (e4) {
            copyBtn.textContent = 'Select and copy manually';
          }
        }
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt).then(copyOk, copyFallback);
          } else {
            copyFallback();
          }
        } catch (e) {
          copyFallback();
        }
      });
    }
  }

  /* ---------------- actions ---------------- */
  function nudgeMsg(msg) {
    var n = $('nudge-msg');
    if (n) { n.textContent = msg || ''; }
  }
  function doCheck() {
    var r = rt(S.idx);
    if (r.done) { return; }
    var def = r.def;
    /* guard: answer present — say so instead of failing silently */
    var a = r.answer || {};
    var empty = false;
    if (def.type === 'qcm') { empty = (a.sel === undefined || a.sel < 0); }
    else if (def.type === 'qcm-multi') { empty = (Object.keys(a.sel || {}).length === 0); }
    else if (def.type === 'match') { empty = (Object.keys(a.picks || {}).length === 0); }
    else if (def.type === 'dnd') { empty = (Object.keys(a.placed || {}).length === 0); }
    else if (def.type === 'fill') { empty = (Object.keys(a.picks || {}).length === 0); }
    else if (def.type === 'logview') { empty = (Object.keys(a.sel || {}).length === 0); }
    else if (def.type === 'terminal') { empty = (!r.lastCmd || r.lastCmd.trim() === ''); }
    else if (def.type === 'branch') { empty = (a.picks === undefined || Object.keys(a.picks).length < def.steps.length); }
    if (empty) {
      nudgeMsg(def.type === 'terminal'
        ? 'Run a command in the terminal first, then press Check.'
        : 'Choose an answer first, then press Check.');
      return;
    }
    nudgeMsg('');

    setState('PAUSED_AUTO_CHECK');
    stopAdvisory();
    var g = grade(r);
    r.done = true;
    r.credit = g.credit;
    S.score += g.credit;
    S.answered += 1;
    $('btn-check').style.display = 'none';
    $('btn-next').style.display = '';
    renderFeedback(r, $('feedback'));
    lockAnswerArea();
    updateHeader();
    var fb = $('feedback');
    fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function lockAnswerArea() {
    var aa = $('answer-area');
    Array.prototype.forEach.call(aa.querySelectorAll('button, select, input'), function (b) {
      b.disabled = true;
    });
  }
  function doNext() {
    if (S.timerState === 'PAUSED_AUTO_CHECK') { setState('RUNNING'); }
    var r = rt(S.idx);
    var isLast = (S.idx === S.order.length - 1);
    if (S.reviewReturn) {
      /* returning from the review-skipped screen: go back to it so the
         student explicitly chooses Final Submit (or keeps reviewing) */
      if (S.timerState === 'ENDED') {
        finishExam(false);
      } else {
        renderReview();
        show('review');
      }
      return;
    }
    if (isLast) {
      var pool = skippedIndexes();
      if (pool.length > 0 && S.timerState !== 'ENDED') {
        S.reviewReturn = true;
        renderReview();
        show('review');
        return;
      }
      finishExam(false);
      return;
    }
    S.idx += 1;
    renderExercise();
  }
  function skippedIndexes() {
    var out = [];
    S.rt.forEach(function (r, i) {
      if (r.skipped && !r.done) { out.push(i); }
    });
    return out;
  }
  function doSkip() {
    var r = rt(S.idx);
    if (r.done) { return; }
    r.skipped = true;
    if (S.reviewReturn) {
      renderReview();
      show('review');
      return;
    }
    var isLast = (S.idx === S.order.length - 1);
    if (isLast) {
      var pool = skippedIndexes();
      if (pool.length > 0 && S.timerState !== 'ENDED') {
        S.reviewReturn = true;
        renderReview();
        show('review');
      } else {
        finishExam(false);
      }
      return;
    }
    S.idx += 1;
    renderExercise();
  }
  function doPause() {
    if (S.timerState === 'RUNNING' || S.timerState === 'PAUSED_AUTO_CHECK') {
      S.prevAuto = (S.timerState === 'PAUSED_AUTO_CHECK');
      setState('PAUSED_MANUAL');
      $('pause-overlay').style.display = 'flex';
    }
  }
  function doResume() {
    if (S.timerState === 'PAUSED_MANUAL') {
      setState(S.prevAuto ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
      $('pause-overlay').style.display = 'none';
    }
  }
  function showHint() {
    var r = rt(S.idx);
    if (r.hintShown || r.done) { return; }
    r.hintShown = true; r.hintUsed = true;
    var box = $('hint-box');
    box.innerHTML = '<b>Hint (this exercise loses 10% of its credit):</b> ' + esc(r.def.hint);
    box.style.display = 'block';
    $('btn-hint').disabled = true;
  }

  /* ---------------- review skipped ---------------- */
  function renderReview() {
    var pool = skippedIndexes();
    var h = '<div class="intro-wrap"><h1 class="intro-title">Review skipped exercises</h1>' +
      '<p class="mut">You have ' + pool.length + ' skipped exercise(s) without an answer. You can answer them now, as many times as you like, until the timer ends. If you submit while some are still unanswered, they are excluded from your score.</p>';
    if (pool.length === 0) {
      h += '<p>All skipped exercises have been answered.</p>';
    } else {
      h += '<div class="review-list">';
      pool.forEach(function (i) {
        var r = S.rt[i];
        h += '<div class="review-row"><span class="review-title">' + esc(r.def.title) + '</span>' +
          '<button class="btn" data-i="' + i + '">Answer this exercise</button></div>';
      });
      h += '</div>';
    }
    h += '<div class="start-row"><button id="btn-final" class="btn primary big">Final Submit</button></div></div>';
    $('screen-review').innerHTML = h;
    Array.prototype.forEach.call($('screen-review').querySelectorAll('button[data-i]'), function (b) {
      b.addEventListener('click', function () {
        if (S.timerState === 'ENDED') {
          /* time is over: no more answering, go straight to results */
          finishExam(false);
          return;
        }
        var i = parseInt(b.getAttribute('data-i'), 10);
        S.idx = S.order.indexOf(i);
        if (S.idx < 0) { S.idx = i; S.order = S.rt.map(function (_, k) { return k; }); S.idx = S.order.indexOf(i); }
        renderExercise();
        show('exam');
      });
    });
    $('btn-final').addEventListener('click', function () { finishExam(false); });
  }

  /* ---------------- results ---------------- */
  function finishExam(fromTimeout) {
    if (S.tickHandle) { clearInterval(S.tickHandle); S.tickHandle = null; }
    setState('ENDED');
    stopAdvisory();
    var full = 0, part = 0, partSum = 0, wrong = 0, skipped = 0;
    S.rt.forEach(function (r) {
      if (r.done) {
        if (r.credit >= 1) { full++; }
        else if (r.credit > 0) { part++; partSum += r.credit; }
        else { wrong++; }
      } else if (r.skipped) {
        skipped++;
      }
    });
    var answered = S.answered;
    var pct = answered > 0 ? Math.round((S.score / answered) * 100) : 0;
    var pass = pct >= 70;
    var h = '<div class="intro-wrap"><h1 class="intro-title">Results \u2014 ' + esc(CFG.title) + '</h1>';
    h += '<div class="result-panel ' + (pass ? 'pass' : 'fail') + '">' +
      (pass ? '<div class="res-ico">\u{1F3C5}</div><h2>PASS \u2014 well done!</h2>' :
        '<div class="res-ico">\u2718</div><h2>Not passed yet</h2><p>You must retake this exam.</p>') +
      '<div class="res-score">' + S.score.toFixed(1) + ' / ' + answered + ' \u2014 ' + pct + '%</div>' +
      '<div class="res-passmark">Pass mark: 70%</div></div>';
    if (fromTimeout) { h += '<p class="mut">\u23F9 Time ended. Unanswered and skipped exercises were excluded from the score.</p>'; }
    h += '<div class="res-grid">' +
      '<div class="res-cell"><b>' + full + '</b> fully correct</div>' +
      '<div class="res-cell"><b>' + part + '</b> partially correct' + (part > 0 ? ' (avg credit ' + (partSum / part).toFixed(2) + ')' : '') + '</div>' +
      '<div class="res-cell"><b>' + wrong + '</b> fully incorrect</div>' +
      '<div class="res-cell"><b>' + skipped + '</b> skipped, not answered (excluded)</div>' +
      '</div>';
    var man = Math.round(S.pausedManualTotal / 1000);
    var auto = Math.round(S.pausedAutoTotal / 1000);
    h += '<div class="res-grid">' +
      '<div class="res-cell">Time paused manually: <b>' + fmtTime(man) + '</b></div>' +
      '<div class="res-cell">Time reviewing feedback: <b>' + fmtTime(auto) + '</b></div>' +
      '</div>';
    h += '<div class="start-row"><button id="btn-retake" class="btn primary big">Retake Exam</button></div></div>';
    $('screen-results').innerHTML = h;
    show('results');
    reportScore(S.score, answered, pct, pass);
    $('btn-retake').addEventListener('click', function () {
      S.reported = false;
      S.idx = 0; S.score = 0; S.answered = 0;
      startExam();
    });
  }
  function reportScore(creditSum, answeredCount, percent, passed) {
    if (S.reported) { return; }
    S.reported = true;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: CFG.topicId,
        batch: CFG.batch,
        score: Math.round(creditSum),
        total: answeredCount,
        percent: percent,
        passed: passed
      }, location.origin);
    } catch (e) {
      /* opened directly, nothing to report to */
    }
  }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) { return; }
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
    S.userInfo = event.data;
    renderIntro();
  });

  /* ---------------- boot ---------------- */
  function boot() {
    S.order = CFG.exercises.map(function (_, i) { return i; });
    S.rt = [];
    CFG.exercises.forEach(function (ex) {
      S.rt.push({ def: ex, done: false, skipped: false, credit: null, hintUsed: false, hintShown: false, answer: null, lastCmd: '' });
    });
    $('sev-badge').textContent = CFG.sevName;
    $('sev-badge').className = 'badge sev-' + CFG.sev;
    $('btn-hint').addEventListener('click', showHint);
    $('btn-pause').addEventListener('click', doPause);
    $('btn-resume').addEventListener('click', doResume);
    $('btn-skip').addEventListener('click', doSkip);
    renderIntro();
    show('intro');
    renderTimerChip();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
