      +'<button type="button" class="copybtn" id="btnCopy">&#128203; Copy</button></div><ul class="howlist" style="margin-top:.4rem">';
    e.term.elems.forEach(function(el2){h+='<li><b>'+esc(el2.d)+'</b></li>'});
    h+='</ul>';
  }
  else if(t==='branch'){h+='<ul class="howlist">';e.branch.steps.forEach(function(st,i){var c=st.opts.filter(function(o){return o.ok})[0];h+='<li>Step '+(i+1)+': '+esc(c.t)+'</li>'});h+='</ul>'}
  else if(t==='hotspot'){h+='<ul class="howlist">';e.hot.lines.forEach(function(ln){if(typeof ln!=='string'&&ln.ok)h+='<li>'+esc(ln.t)+'</li>'});h+='</ul>'}
  h+='</div>';
  return h;
}

function renderFeedback(e){
  var g=e.rt.grade,slot=$('feedslot');if(!slot)return;
  var c=g.credit,lab,cls,ico,word;
  if(c>=0.9999){lab='CORRECT';cls='fh-correct';ico='&#10003;';word='Correct'}
  else if(c>0){lab='PARTIALLY CORRECT';cls='fh-partial';ico='&#10003;';word='Partially correct'}
  else{lab='INCORRECT';cls='fh-incorrect';ico='&#10007;';word='Incorrect'}
  var h='<div class="feedbox" role="alert"><span class="feedhead '+cls+'"><span aria-hidden="true">'+ico+'</span> '+lab+'</span>';
  if(g.danger)h+='<p class="st st-w" style="font-weight:800">&#10007; DANGEROUS &#8212; NEAR MISS: part of your command could have destroyed evidence or changed state.</p>';
  if(g.N>1){
    h+='<p class="credline">credit <b>'+c.toFixed(2)+'</b> &#8212; '+Math.round(g.H)+'/'+g.N+' items &#183; formula (H &#8722; W) / N = ('+Math.round(g.H)+' &#8722; '+Math.round(g.W)+') / '+g.N+(e.rt.hintUsed?' &#183; includes &#8722;0.10 hint penalty':'')+'</p>';
  }else if(e.rt.hintUsed&&c>0){
    h+='<p class="credline">credit <b>'+c.toFixed(2)+'</b> (includes &#8722;0.10 hint penalty)</p>';
  }
  if(g.rows.length&&(g.N>1||c<0.9999)){
    h+='<div class="items">';
    g.rows.forEach(function(r){
      var stcls=r.st==='h'?'st-h':(r.st==='w'?'st-w':'st-m');
      var sttxt=r.st==='h'?'&#10003; Correct':(r.st==='w'?'&#10007; Wrong':'&#9675; Missed');
      h+='<div class="itrow"><span class="st '+stcls+'"><span aria-hidden="true">'+sttxt.split(' ')[0]+'</span> '+sttxt.split(' ').slice(1).join(' ')+'</span><span>'+r.lab+'</span>'+(r.note?'<span class="nt">'+esc(r.note)+'</span>':'')+'</div>';
    });
    h+='</div>';
  }
  h+=answerHtml(e);
  h+='<div class="expl"><h4>Why</h4><p>'+e.expl+'</p></div>';
  if(e.study)h+='<div class="expl"><h4>What to study</h4><p>'+esc(e.study)+'</p></div>';
  if(e.persp)h+='<div class="persp"><p><span class="pr">Attacker view:</span> '+esc(e.persp.red)+'</p><p><span class="pv">Defender view:</span> '+esc(e.persp.blue)+'</p></div>';
  var last=S.cur>=S.exs.length-1;
  var btnLab=(S.mode==='review')?'&#9194; Back to review':(last?(skippedList().length?'&#9194; Next: review skipped':'&#9199; Final Submit'):'&#9194; Next');
  h+='<div class="nextrow"><button id="btnNext" class="btn primary" type="button">'+btnLab+'</button></div></div>';
  slot.innerHTML=h;
  $('btnNext').addEventListener('click',onNext);
  var bc=$('btnCopy');
  if(bc)bc.addEventListener('click',function(){
    var txt=e.term.canon;
    try{
      var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
      document.execCommand('copy');document.body.removeChild(ta);
      bc.textContent='\u2713 Copied';setTimeout(function(){bc.innerHTML='&#128203; Copy'},1200);
    }catch(err){}
  });
}

function onNext(){
  var e=S.exs[S.cur];
  if(e&&e.rt.checked){
    if(S.mode==='review'){
      S.mode='normal';setState('RUNNING');renderReview();return;
    }
    S.cur++;
    if(S.cur>=S.exs.length){
      if(skippedList().length){setState('RUNNING');renderReview()}
      else finalize('submit');
      return;
    }
    setState('RUNNING');renderEx();window.scrollTo(0,0);return;
  }
  S.cur++;
  if(S.cur>=S.exs.length){if(skippedList().length)renderReview();else finalize('submit');return}
  renderEx();window.scrollTo(0,0);
}

/* ---------- header actions ---------- */
function onHint(){

  var slot=$('hintslot');if(!slot)return;

function skippedList(){
  var out=[];S.exs.forEach(function(e,i){if(e.rt.skipped&&!e.rt.checked)out.push(i)});
  return out;

function onSkip(){
  var e=S.exs[S.cur];if(!e||e.rt.checked||S.mode==='review')return;
  e.rt.skipped=true;
  S.cur++;
  if(S.cur>=S.exs.length)renderReview();
  else{renderEx();window.scrollTo(0,0)}
}

/* ---------- review skipped ---------- */
function renderReview(){
  S.view='review';S.mode='normal';
  updateProgress(1);
  var ids=skippedList();
  var h='<div class="card"><h2>Review skipped exercises</h2>'
    +'<p class="sumline">You skipped '+ids.length+' exercise(s). You can answer them now, as many times as you need, while the timer has time left. If you submit now, skipped exercises are excluded from the score: they count as neither correct nor wrong.</p>';
  if(!ids.length)h+='<p>&#10003; All exercises are answered. You can submit.</p>';
  ids.forEach(function(i){
    var e=S.exs[i];
    h+='<div class="revitem"><span class="rico" aria-hidden="true">&#9888;</span><span class="st st-m">Skipped</span><span class="rt">'+esc(e.id)+' &#183; '+esc(e.title)+'</span><button class="btn" type="button" data-i="'+i+'">&#9998; Answer</button></div>';
  });
  h+='<div class="nextrow"><button id="btnFinal" class="btn primary" type="button">&#9199; Final Submit</button></div></div>';
  $('main').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('.revitem button'),function(b){
    b.addEventListener('click',function(){
      S.mode='review';S.cur=+b.getAttribute('data-i');
      setState('RUNNING');renderEx();window.scrollTo(0,0);
    });
  });
  $('btnFinal').addEventListener('click',function(){finalize('submit')});
}

/* ---------- results ---------- */
function finalize(reason){
  if(tickHandle){clearInterval(tickHandle);tickHandle=null}
  setState('ENDED');S.view='results';S.mode='normal';
  updateProgress(1);
  var answered=S.checkedCount,sum=S.creditSum;
  var pct=answered>0?Math.round(sum/answered*100):0;
  var passed=pct>=DATA.meta.passMark;
  var fC=0,pC=0,iC=0,pSum=0;
  S.exs.forEach(function(e){
    if(!e.rt.checked)return;
    var c=e.rt.grade.credit;
    if(c>=0.9999)fC++;
    else if(c>0){pC++;pSum+=c}
    else iC++;
  });
  var skipped=S.exs.length-answered;
  reportScore(sum,answered);
  var h='<div class="cert '+(passed?'pass':'fail')+'"><div class="cl">'+(passed?'&#10003; PASS':'&#10007; FAIL')+'</div>'
    +'<p>'+(passed?'Congratulations &#8212; you reached the pass mark of '+DATA.meta.passMark+'%.':'You did not reach the pass mark of '+DATA.meta.passMark+'%. You must retake this exam.')+'</p>'
    +'<p class="mono" style="font-size:1.2rem"><b>'+sum.toFixed(1)+' / '+answered+'</b> &#183; '+pct+'%</p>'
    +(reason==='timeout'?'<p class="sumline">Time ran out &#8212; the exam was submitted automatically.</p>':'')+'</div>';
  h+='<div class="resgrid">'
    +'<div class="rescell rc-correct"><div class="big">'+fC+'</div><div class="lab">&#10003; Fully correct</div></div>'
    +'<div class="rescell rc-partial"><div class="big">'+pC+'</div><div class="lab">&#10003; Partially correct'+(pC?' &#183; avg '+(pSum/pC).toFixed(2):'')+'</div></div>'
    +'<div class="rescell rc-incorrect"><div class="big">'+iC+'</div><div class="lab">&#10007; Fully incorrect</div></div>'
    +'<div class="rescell rc-skipped"><div class="big">'+skipped+'</div><div class="lab">&#9888; Skipped &#8212; excluded</div></div>'
    +'</div>';
  h+='<div class="card"><h3>How your time was spent</h3><div class="timestats">'
    +'<span class="ifact">Working time (timer running): <b>'+fmt(DATA.timerBudgetSec-S.timer.remain)+'</b></span>'
    +'<span class="ifact">&#9208; Paused for feedback review: <b>'+fmt(S.autoTotal)+'</b></span>'
    +'<span class="ifact">&#9208; Paused manually: <b>'+fmt(S.manualTotal)+'</b></span>'
    +'</div></div>';
  h+='<div class="card"><h3>Exercise strip</h3><div class="strip">';
  S.exs.forEach(function(e){
    var cls='sq s',txt='&#9888; '+(e.rt.skipped&&!e.rt.checked?'excluded':'skipped');
    if(e.rt.checked){
      var c=e.rt.grade.credit;
      if(c>=0.9999){cls='sq h';txt='&#10003; '+c.toFixed(1)}
      else if(c>0){cls='sq p';txt='&#10003; '+c.toFixed(1)}
      else{cls='sq f';txt='&#10007; 0.0'}
    }
    h+='<span class="sq '+cls+'" title="'+esc(e.id)+'">'+esc(e.id)+' '+txt+'</span>';
  });
  h+='</div></div>';
  h+='<div class="nextrow"><button id="btnRetake" class="btn danger" type="button">&#8635; Retake Exam</button></div>';
  $('main').innerHTML=h;
  $('btnRetake').addEventListener('click',renderIntro);
  window.scrollTo(0,0);
}
function reportScore(creditSum,answeredCount){
  if(S.reported)return;
  S.reported=true;
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,
      score:Math.round(creditSum),total:answeredCount,percent:percent,
      passed:percent>=DATA.meta.passMark
    },location.origin);
  }catch(e){}
}

/* ---------- site handshake (dark-only; other fields consumed) ---------- */
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  S.user={name:event.data.username||'',country:event.data.country||'',locale:event.data.locale||''};
  var w=$('whoFor');
  if(w)w.textContent=DATA.sev.label+' exam \u00b7 '+(S.user.name?('Analyst: '+S.user.name):'Practice mode');
});

/* ---------- init ---------- */
function applySevColour(){
  var key=DATA.sev.key==='extremely-hard'?'extreme':DATA.sev.key;
  document.documentElement.style.setProperty('--sev-col','var(--sev-'+key+')');
}
function init(){
  applySevColour();
  renderIntro();
  $('btnPause').addEventListener('click',function(){
    if(S.view!=='exam'&&S.view!=='review')return;
    if(S.timer.state!=='RUNNING'&&S.timer.state!=='PAUSED_AUTO_CHECK')return;
    S.prevState=S.timer.state;setState('PAUSED_MANUAL');
    $('veil').classList.remove('hidden');$('main').setAttribute('aria-hidden','true');
  });
  $('btnResume').addEventListener('click',function(){
    setState(S.prevState||'RUNNING');
    $('veil').classList.add('hidden');$('main').removeAttribute('aria-hidden');
  });
  $('btnHint').addEventListener('click',onHint);
  $('btnSkip').addEventListener('click',onSkip);
  $('main').addEventListener('input',function(ev){
    var inp=ev.target;
    if(inp.id&&inp.id.indexOf('flt-')===0){
      var art=inp.closest('.art'),q=inp.value.toLowerCase();
      Array.prototype.forEach.call(art.querySelectorAll('.ln'),function(l){
        l.parentNode.style.display=(l.textContent.toLowerCase().indexOf(q)>=0)?'':'none';
      });
    }
  });
  document.addEventListener('keydown',function(ev){
    if(S.view!=='exam')return;
    if(ev.key==='Escape'&&S.timer.state==='PAUSED_MANUAL'){$('btnResume').click()}
  });
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();


})();

</script>
</body>
</html>
