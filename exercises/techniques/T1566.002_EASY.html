<style>
:root{
  --bg-page:#0b1020; --bg-surface:#121a2e; --bg-surface-2:#0f1729;
  --border:#243049; --border-soft:#1c2740;
  --text-primary:#e6ecff; --text-secondary:#a9b4d0; --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff; --accent-amber:#ffb454; --accent-green:#57d38c;
  --state-correct:#57d38c; --state-partial:#ffb454; --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0; --state-paused:#9d7bff;
  --bg-log:#0a0f1e; --bg-term:#070b16; --tok-mail:#9dd6ff; --tok-id:#c9a7ff;
  --sev-easy:#57d38c; --sev-medium:#ffb454; --sev-hard:#ff8a3d; --sev-extreme:#ff6b6b;
  --sev:var(--sev-easy);
  --shadow:0 10px 24px rgba(0,0,0,.35);
  --radius:8px;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
html{color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-ui);font-size:16px;line-height:1.55;}
body.sev-easy{--sev:var(--sev-easy);}
body.sev-medium{--sev:var(--sev-medium);}
body.sev-hard{--sev:var(--sev-hard);}
body.sev-extreme{--sev:var(--sev-extreme);}
.wrap{max-width:1020px;margin:0 auto;padding:18px 16px 60px;}
a{color:var(--accent-blue);}
code,.mono{font-family:var(--font-mono);}
button{font-family:var(--font-ui);}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px;}
[hidden]{display:none !important;}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.4px;border:1px solid;}
.badge .dot{width:8px;height:8px;border-radius:50%;background:currentColor;}
.badge-sev{color:var(--sev);border-color:var(--sev);background:color-mix(in srgb,var(--sev) 12%,transparent);}
.badge-correct{color:var(--state-correct);border-color:var(--state-correct);background:color-mix(in srgb,var(--state-correct) 12%,transparent);}
.badge-partial{color:var(--state-partial);border-color:var(--state-partial);background:color-mix(in srgb,var(--state-partial) 12%,transparent);}
.badge-incorrect{color:var(--state-incorrect);border-color:var(--state-incorrect);background:color-mix(in srgb,var(--state-incorrect) 12%,transparent);}
.badge-skipped{color:var(--state-skipped);border-color:var(--state-skipped);background:color-mix(in srgb,var(--state-skipped) 10%,transparent);}
.badge-paused{color:var(--state-paused);border-color:var(--state-paused);background:color-mix(in srgb,var(--state-paused) 12%,transparent);}

/* ---------- header ---------- */
#hdr{position:sticky;top:0;z-index:40;background:var(--bg-surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow);}
#hdr .hrow{max-width:1020px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;}
#hdr .brand{font-weight:800;letter-spacing:.3px;font-size:15px;display:flex;align-items:center;gap:8px;}
#hdr .brand .cid{color:var(--accent-blue);font-family:var(--font-mono);}
#hdr .hitem{display:flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:14px;}
#hdr .hitem b{color:var(--text-primary);font-family:var(--font-mono);font-weight:700;}
#hdr .hspacer{flex:1;}
.hbtn{background:var(--bg-surface-2);border:1px solid var(--border);color:var(--text-primary);padding:9px 14px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;}
.hbtn:hover{border-color:var(--accent-blue);}
.hbtn:disabled{opacity:.45;cursor:not-allowed;}
.hbtn.primary{background:linear-gradient(135deg,color-mix(in srgb,var(--accent-green) 22%,var(--bg-surface-2)),var(--bg-surface-2));border-color:var(--accent-green);color:var(--accent-green);font-weight:800;}
.hbtn.big{font-size:16px;padding:12px 22px;}
#tstate-ind{font-size:13px;font-weight:700;}
.tst-running{color:var(--state-correct);}
.tst-paused{color:var(--state-paused);}
.tst-ended{color:var(--state-incorrect);}
#timer-txt{min-width:64px;text-align:right;}

/* ---------- progress ---------- */
#pbar-wrap{height:6px;background:var(--bg-surface-2);border-bottom:1px solid var(--border);overflow:hidden;}
#pbar{height:100%;width:0%;background:linear-gradient(90deg,var(--sev),color-mix(in srgb,var(--sev) 55%,transparent));position:relative;transition:width .4s ease;}
#pbar::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 2.8s linear infinite;}
@keyframes sheen{0%{transform:translateX(-100%);}60%,100%{transform:translateX(100%);}}

/* ---------- cards & blocks ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.block{margin:16px 0;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-surface);overflow:hidden;}
.block-h{display:flex;align-items:center;gap:8px;padding:9px 14px;font-weight:800;font-size:14px;letter-spacing:1.2px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bc) 10%,var(--bg-surface));}
.block-h .bh-ico{font-size:15px;}
.block-h .bh-txt{color:var(--bc);}
.block.scenario{--bc:var(--accent-blue);}
.block.question{--bc:var(--accent-amber);}
.block.answer{--bc:var(--accent-green);}
.block.scenario .block-h{border-left:4px solid var(--accent-blue);}
.block.question .block-h{border-left:4px solid var(--accent-amber);}
.block.answer .block-h{border-left:4px solid var(--accent-green);}
.block-b{padding:14px 16px;}
.scn-intro{margin:0 0 10px;color:var(--text-primary);}
.artefact{margin:10px 0;border:1px solid var(--border-soft);border-radius:6px;background:var(--bg-surface-2);}
.art-label{font-family:var(--font-mono);font-size:12px;color:var(--accent-blue);padding:6px 10px;border-bottom:1px solid var(--border-soft);letter-spacing:.6px;}
.art-note{padding:10px 12px;color:var(--text-secondary);font-size:14px;}
pre.mono{margin:0;padding:12px;font-family:var(--font-mono);font-size:14px;line-height:1.5;color:var(--text-mono);white-space:pre-wrap;word-break:break-word;background:var(--bg-surface-2);}
.q-text{margin:0;font-size:17px;font-weight:700;color:var(--text-primary);}
.step-chip{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:12px;background:color-mix(in srgb,var(--accent-amber) 15%,transparent);color:var(--accent-amber);border:1px solid var(--accent-amber);vertical-align:middle;}

/* collapsible scenario */
.scn-sum{display:flex;align-items:center;gap:8px;padding:8px 14px;color:var(--text-secondary);font-size:14px;border-bottom:1px dashed var(--border);}
.collapse-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text-secondary);border-radius:6px;padding:6px 10px;cursor:pointer;min-height:44px;font-size:13px;}
.collapse-btn:hover{color:var(--text-primary);border-color:var(--accent-blue);}

/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:12px 14px;margin:8px 0;cursor:pointer;color:var(--text-primary);font-size:15.5px;line-height:1.5;min-height:48px;}
.opt .olab{font-family:var(--font-mono);font-weight:800;color:var(--accent-blue);flex:0 0 auto;}
.opt:hover{background:color-mix(in srgb,var(--accent-blue) 8%,var(--bg-surface-2));border-color:var(--accent-blue);}
.opt.sel{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset,0 0 0 3px color-mix(in srgb,var(--accent-green) 18%,transparent);background:color-mix(in srgb,var(--accent-green) 9%,var(--bg-surface-2));}
.opt .osel-ind{margin-left:auto;color:var(--accent-green);font-weight:800;font-size:13px;white-space:nowrap;}
.opt.lock{cursor:default;}
.opt.right{border-color:var(--state-correct);}
.opt.wrong{border-color:var(--state-incorrect);}
.opt .mini-ic{font-weight:800;font-size:13px;white-space:nowrap;}

/* ---------- word bank / fill ---------- */
.blk-text{font-size:16px;color:var(--text-primary);line-height:1.8;}
select.blank{font-family:var(--font-mono);font-size:14px;background:var(--bg-surface-2);color:var(--text-mono);border:1px solid var(--border);border-radius:5px;padding:6px 8px;margin:0 3px;min-height:44px;}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.chip{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:999px;padding:7px 13px;font-family:var(--font-mono);font-size:13.5px;color:var(--text-mono);cursor:pointer;min-height:44px;}
.chip.sel{border-color:var(--accent-green);color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}

/* ---------- drag & drop ---------- */
.dd-wrap{display:grid;grid-template-columns:1fr 1.2fr;gap:14px;}
.dd-bank,.dd-zone{border:1px dashed var(--border);border-radius:8px;padding:10px;min-height:90px;background:var(--bg-surface-2);}
.dd-zone.hlit{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.dd-zt{font-size:13.5px;font-weight:800;color:var(--accent-blue);margin-bottom:8px;letter-spacing:.4px;}
.dd-item{display:flex;align-items:center;gap:8px;background:var(--bg-surface);border:1px solid var(--border);border-radius:6px;padding:9px 11px;margin:7px 0;font-size:14.5px;cursor:grab;color:var(--text-primary);}
.dd-item .rm{margin-left:auto;border:none;background:transparent;color:var(--state-incorrect);cursor:pointer;font-weight:800;font-size:14px;min-width:44px;min-height:44px;}
.dd-item.sel{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.dd-hintline{font-size:13px;color:var(--text-secondary);margin:4px 0 8px;}

/* ---------- order / rank ---------- */
.ord-list{list-style:none;margin:0;padding:0;}
.ord-item{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:8px 0;}
.ord-item .rk{font-family:var(--font-mono);font-weight:800;color:var(--accent-amber);min-width:30px;text-align:center;}
.ord-item .ot{flex:1;}
.ord-ctrls{display:flex;gap:6px;}
.ord-btn{border:1px solid var(--border);background:var(--bg-surface);color:var(--text-primary);border-radius:5px;min-width:44px;min-height:44px;cursor:pointer;font-size:15px;}
.ord-btn:hover{border-color:var(--accent-blue);}
.ord-item.dragover{border-color:var(--accent-green);}

/* ---------- match ---------- */
.mt-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
.mt-left{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:14.5px;}
.mt-left .mt-q{font-weight:700;}
.mt-slot{margin-top:8px;display:flex;align-items:center;gap:8px;}
.mt-drop{flex:1;border:1px dashed var(--border);border-radius:5px;padding:7px 10px;font-family:var(--font-mono);font-size:13px;color:var(--text-secondary);min-height:38px;background:var(--bg-surface);}
.mt-drop.hlit{border-color:var(--accent-green);}
.mt-drop .fillv{color:var(--text-mono);}
.mt-clear{border:none;background:transparent;color:var(--state-incorrect);font-weight:800;cursor:pointer;min-width:44px;min-height:44px;}

/* ---------- log viewer ---------- */
.logv{border:1px solid var(--border-soft);border-radius:6px;background:var(--bg-log);margin:8px 0;}
.logv-head{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border-soft);}
.logv-src{font-family:var(--font-mono);font-size:12.5px;color:var(--accent-blue);}
.logv-filter{margin-left:auto;flex:0 1 240px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:5px;color:var(--text-mono);font-family:var(--font-mono);font-size:13px;padding:7px 9px;min-height:44px;}
.logv pre{max-height:300px;overflow:auto;margin:0;padding:10px 12px;font-family:var(--font-mono);font-size:13.5px;line-height:1.55;color:var(--text-mono);}
.logv .ln{display:block;white-space:pre-wrap;word-break:break-word;}
.l-ts{color:var(--accent-amber);} .l-ip{color:var(--accent-blue);} .l-url{color:var(--accent-green);} .l-kw{color:var(--state-incorrect);font-weight:700;} .l-mail{color:var(--tok-mail);} .l-id{color:var(--tok-id);} .l-warn{color:var(--state-incorrect);}

/* ---------- terminal ---------- */
.term{background:var(--bg-term);border:1px solid var(--border-soft);border-radius:8px;font-family:var(--font-mono);font-size:14px;}
.term-bar{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border-soft);align-items:center;}
.tdot{width:10px;height:10px;border-radius:50%;}
.term-title{margin-left:8px;color:var(--text-secondary);font-size:12.5px;}
.term-out{padding:10px 12px;max-height:260px;overflow:auto;color:var(--text-mono);line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.term-in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border-soft);align-items:center;}
.term-prompt{color:var(--accent-green);font-weight:700;white-space:nowrap;}
.term-in input{flex:1;background:transparent;border:none;color:var(--text-mono);font-family:var(--font-mono);font-size:14px;padding:8px 2px;min-height:40px;}
.term-in input:focus-visible{outline:1px solid var(--accent-green);}
.syn-panel{border:1px solid var(--border-soft);border-left:4px solid var(--accent-blue);border-radius:6px;background:var(--bg-surface-2);padding:10px 12px;margin:10px 0;}
.syn-panel h5{margin:0 0 6px;font-size:13px;color:var(--accent-blue);letter-spacing:.5px;}
.syn-panel pre{margin:4px 0;font-family:var(--font-mono);font-size:13px;color:var(--text-mono);white-space:pre-wrap;}
.syn-panel .ex{color:var(--text-secondary);}

/* ---------- triage ---------- */
.tri-card{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin:10px 0;}
.tri-title{font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.tri-meta{color:var(--text-secondary);font-size:13.5px;margin-top:3px;font-family:var(--font-mono);}
.tri-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.tri-act{border:1px solid var(--border);background:var(--bg-surface);color:var(--text-primary);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:13.5px;min-height:40px;}
.tri-act.sel{border-color:var(--accent-green);color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.tri-act.sel-tri{border-color:var(--accent-amber);color:var(--accent-amber);}

/* ---------- feedback ---------- */
#fbk{margin:16px 0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
#fbk .fb-h{display:flex;align-items:center;gap:10px;padding:10px 14px;font-weight:800;letter-spacing:.8px;border-bottom:1px solid var(--border);}
.fb-correct{background:color-mix(in srgb,var(--state-correct) 12%,var(--bg-surface));color:var(--state-correct);}
.fb-partial{background:color-mix(in srgb,var(--state-partial) 12%,var(--bg-surface));color:var(--state-partial);}
.fb-incorrect{background:color-mix(in srgb,var(--state-incorrect) 12%,var(--bg-surface));color:var(--state-incorrect);}
.fb-danger{background:color-mix(in srgb,var(--state-incorrect) 18%,var(--bg-surface));color:var(--state-incorrect);}
#fbk .fb-b{padding:14px 16px;}
.item-row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border-soft);border-radius:6px;margin:7px 0;background:var(--bg-surface-2);font-size:14.5px;}
.it-correct{color:var(--state-correct);} .it-wrong{color:var(--state-incorrect);} .it-missed{color:var(--state-skipped);}
.item-row .it-ic{font-weight:800;flex:0 0 auto;}
.item-row .it-tx{color:var(--text-primary);}
.credit-line{font-family:var(--font-mono);font-weight:700;margin-top:6px;}
.study-line{margin-top:10px;padding:9px 12px;border-left:4px solid var(--accent-amber);background:color-mix(in srgb,var(--accent-amber) 8%,transparent);border-radius:0 6px 6px 0;color:var(--text-primary);font-size:14.5px;}
.canon{border:1px solid var(--border-soft);border-radius:6px;background:var(--bg-surface-2);margin:10px 0;}
.canon .canon-h{display:flex;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border-soft);font-family:var(--font-mono);font-size:12.5px;color:var(--accent-green);}
.copy-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text-secondary);border-radius:5px;padding:4px 10px;cursor:pointer;font-size:12px;min-height:44px;}
.copy-btn:hover{color:var(--text-primary);border-color:var(--accent-green);}

/* ---------- nav ---------- */
.nav-row{display:flex;gap:10px;align-items:center;margin:18px 0;}
.nav-note{color:var(--text-secondary);font-size:13.5px;margin-left:auto;}

/* ---------- hint ---------- */
#hint-panel{margin:12px 0;border:1px solid var(--accent-amber);border-left:4px solid var(--accent-amber);border-radius:0 6px 6px 0;background:color-mix(in srgb,var(--accent-amber) 8%,transparent);padding:10px 14px;color:var(--text-primary);font-size:14.5px;}
#hint-panel .hp-h{color:var(--accent-amber);font-weight:800;font-size:13px;letter-spacing:.6px;margin-bottom:4px;}

/* ---------- overlay / pause ---------- */
#overlay{position:fixed;inset:0;background:rgba(5,8,18,.92);z-index:80;display:flex;align-items:center;justify-content:center;}
.ov-card{max-width:460px;margin:20px;text-align:center;padding:30px;border:1px solid var(--state-paused);border-radius:10px;background:var(--bg-surface);box-shadow:var(--shadow);}
.ov-card .ov-ic{font-size:34px;color:var(--state-paused);}
.ov-card h2{color:var(--state-paused);margin:10px 0 6px;}
.ov-card p{color:var(--text-secondary);}

/* ---------- intro ---------- */
.intro-head{padding:18px 20px;}
.intro-title{font-size:24px;font-weight:900;margin:0 0 4px;color:var(--text-primary);}
.intro-sub{color:var(--text-secondary);font-size:15px;margin:0 0 12px;}
.fact-row{display:flex;flex-wrap:wrap;gap:10px;}
.fact{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:10px 14px;min-width:150px;}
.fact .f-l{font-size:12px;color:var(--text-secondary);letter-spacing:.8px;text-transform:uppercase;}
.fact .f-v{font-size:17px;font-weight:800;color:var(--text-primary);font-family:var(--font-mono);}
.kw-theme{border:1px solid var(--border-soft);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin:10px 0;}
.kw-theme h4{margin:0 0 8px;color:var(--accent-blue);font-size:14px;letter-spacing:.5px;}
.kw-list{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none;}
.kw-list li{border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--text-mono);font-family:var(--font-mono);background:var(--bg-surface);}
.how-list{margin:8px 0 0;padding-left:20px;color:var(--text-primary);}
.how-list li{margin:8px 0;}
.learn-p{color:var(--text-primary);}
.role-tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.role-tag{border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--accent-green);background:var(--bg-surface-2);}

/* ---------- review ---------- */
.rv-list{list-style:none;margin:0;padding:0;}
.rv-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin:9px 0;background:var(--bg-surface-2);}
.rv-row .rv-t{flex:1;}
.rv-row .rv-s{font-size:13px;color:var(--text-secondary);}

/* ---------- results ---------- */
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0;}
.res-cell{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:14px;}

window.EXAM_INTRO={"title":"T1566.002 — EASY practice exam","subline":"A beginner-friendly certification exam on the MITRE ATT&CK sub-technique Spearphishing Link.","obj":"T1566.002 — Spearphishing Link","learn":["You will learn about one exact object of the MITRE ATT&amp;CK framework: <b>T1566.002 — Phishing: Spearphishing Link</b>. ATT&amp;CK is a public catalogue of the ways real attackers break into systems. This object is a <b>Sub-Technique</b>. That means it is one specific way of doing a bigger thing — its parent Technique <b>T1566 Phishing</b>. In ATT&amp;CK it sits in the <b>Initial Access</b> tactic (TA0001), the part of an attack where the adversary gets the first foothold.","What does the object describe? Imagine an attacker sends you an email that looks real. The email has <b>no attached file</b>. Instead it carries a <b>link</b>. If you click it, you may land on a fake sign-in page that steals your password, or your browser may download malware. The attacker needs no special rights first — one user click is enough. That is why the technique can reach <b>Windows, macOS, Linux, Office Suite, Google Workspace, SaaS and Identity Providers</b>.","Where do you meet this object at work? A <b>SOC analyst</b> triages mail-gateway and web-proxy alerts after a click. An <b>incident responder</b> resets stolen passwords and hunts the domain. A <b>threat-intel analyst</b> reads reports that name groups — ATT&amp;CK documents APT29, Lazarus, OilRig, Storm-1811 and many others sending links. A <b>detection engineer</b> builds the mail+proxy join rules of ATT&amp;CK detection strategy DET0107. A <b>red teamer</b> may send permitted phishing links to test people. A <b>security-awareness officer</b> runs training and measures who reports emails.","Why does it matter? Spearphishing with a link is one of the most common first steps of real intrusions, because it is cheap, easy to change, and it carries no malware file for email scanners to catch. Understanding this one object gives you the words, the telemetry and the controls that real teams use every day."],"roles":["SOC analyst","Incident responder","Threat-intel analyst","Detection engineer","Red teamer","Awareness officer","GRC analyst"],"kw":[{"theme":"Object identity & lifecycle position","items":["T1566.002 Spearphishing Link","Sub-Technique of T1566 Phishing","Siblings T1566.001 / .003 / .004","Initial Access — TA0001"]},{"theme":"Adversary behaviour","items":["Link in email body, no attachment","Fake sign-in page (credential harvesting)","Malware download after the click","User must actively click — User Execution T1204","Consent phishing (OAuth app approval)"]},{"theme":"Platforms & access needed","items":["Windows / macOS / Linux","Office Suite / Google Workspace / SaaS","Identity Provider","No special rights — only a user click"]},{"theme":"Telemetry basics","items":["Mail gateway log line","Web proxy log line","Defanged IOCs: hxxp:// and domain[.]com"]},{"theme":"Mitigation basics","items":["M1017 User Training","M1021 Restrict Web-Based Content","Report-email button"]},{"theme":"Real-world use","items":["Alert triage","Password reset","IOC blocking","Awareness campaigns"]}],"how":["<b>Pass mark: 70%.</b> Your score is the share of credit you earn over the exercises you actually answer. PASS at 70% or more; below that you must retake.","<b>Exercise types in this file:</b> single-choice, multi-select, matching pairs, drag &amp; drop, ordering, fill-in-the-blank, log reading, and one guided terminal task.","<b>Timer: 30 minutes.</b> It counts down while you work. Press <b>Pause</b> for a break — the exercise hides until you press Resume. When you press <b>Check</b>, the timer stops automatically so you can read the feedback without pressure; it starts again only when you press <b>Next</b>.","<b>Partial credit:</b> exercises with more than one correct item give partial credit. Correct picks count +1, wrong picks count &#8722;1, and the total is capped at zero. One hint per exercise costs 10% of that exercise&#8217;s credit.","<b>Skip:</b> every exercise has a Skip button. Skipped exercises wait in a review list; you can go back and answer them while the timer runs. If you finish with unanswered skips, they are excluded from the score.","Press <b>Start</b> when you are ready. Good luck!"]};
window.EXAMS=[{"id":"E01","type":"qcm","title":"Spot the object in a real email","summary":"One delivered email — which ATT&CK object is this?","scenario":[{"label":"Mail gateway record","kind":"log","src":"mailgw.log","lines":["2026-10-20T08:12:44Z from=billing@vendor-mail[.]example to=j.doe@corp[.]example subj=\"Invoice #77341 - action needed\" url=hxxps://invoice-portal[.]example-id-9930[.]com/pay attach=none action=deliver banner=external-sender"]}],"question":"The email carried no file. It only carried the web address shown after url=. Which ATT&CK object describes exactly this behaviour?","hint":"The behaviour lives in the message body: a clickable web address instead of an attached file.","expl":"T1566.002 — Spearphishing Link is the sub-technique where the email carries a malicious link instead of an attached file. T1566.001 is the attachment variant, T1566.004 uses phone calls, and T1190 is attacking a public server directly — none of those match a delivered link.","study":"Read the intro section 'Object identity & lifecycle position' again: one parent (T1566 Phishing) and its sibling sub-techniques .001, .002, .003, .004.","opts":["T1566.002 — Phishing: Spearphishing Link","T1566.001 — Phishing: Spearphishing Attachment","T1566.004 — Phishing: Spearphishing Voice","T1190 — Exploit Public-Facing Application"],"correct":0},{"id":"E02","type":"drag","title":"Place the techniques in the right tactic","summary":"Four techniques — Initial Access or Execution?","scenario":["The ATT&CK matrix is a grid: tactics are the columns (the attacker's goals) and techniques are the cards inside them. Two goals you will see a lot are Initial Access (TA0001) — how the attacker gets in — and Execution (TA0002) — running their code inside."],"question":"Drag each technique card into the tactic column where ATT&CK lists it.","hint":"Both phishing sub-techniques describe getting the FIRST foothold. The other two run commands on a machine that is already inside.","expl":"T1566.002 and T1566.001 are Initial Access techniques: they deliver the first foothold through a user action. T1059.001 (PowerShell) and T1059.004 (Unix Shell) are Execution techniques — they run code on a machine the attacker already reached.","study":"Open the ATT&CK matrix columns Initial Access and Execution once and read their technique names aloud; the grouping then feels natural.","zones":[{"t":"Initial Access — TA0001"},{"t":"Execution — TA0002"}],"items":[{"t":"T1566.002 — Spearphishing Link","z":0},{"t":"T1566.001 — Spearphishing Attachment","z":0},{"t":"T1059.001 — PowerShell","z":1},{"t":"T1059.004 — Unix Shell","z":1}]},{"id":"E03","type":"match","title":"Match the message to its sub-technique","summary":"Three contact attempts — which sibling is each one?","scenario":["The parent technique T1566 Phishing has four sibling sub-techniques. They differ by HOW the message reaches the target and WHAT the message carries."],"question":"Match each contact attempt to the sub-technique that ATT&CK uses for it.","hint":"Ask yourself: did the victim receive a file, a web address, or a phone call?","expl":"A .zip file attached to the email is T1566.001. A link to a fake sign-in page is T1566.002 — our object. A phone call that pushes the target to a URL is T1566.004, Spearphishing Voice. The delivery channel decides the sub-technique.","study":"Re-read the sibling list in the intro: .001 attachment, .002 link, .003 via service, .004 voice.","left":["An email with invoice.zip attached","An email with a link to a fake sign-in page","A phone call asking the target to visit a web address"],"right":["T1566.001 — Spearphishing Attachment","T1566.002 — Spearphishing Link","T1566.004 — Spearphishing Voice"],"correct":[0,1,2]},{"id":"E04","type":"qcm","title":"Why the attacker prefers a link","summary":"Attacker view: link versus attached malware file","scenario":["You are on a permitted red-team engagement. Your operator asks you to deliver the implant as a link instead of an attached executable."],"question":"From the attacker's side, what is the main advantage of sending a link instead of the malware file itself?","hint":"Think about what the email scanner sees when the message arrives.","expl":"With a link, the email carries no malicious file for mail scanners and antivirus to open at delivery time. The payload is fetched later, from a server the attacker controls, so they can also rotate the target domain when it gets blocked. Message size has nothing to do with trust, and attached files are not delivered faster — filters simply open them on arrival. And a link never removes the user's click: the whole technique still depends on one person pressing it. This is exactly why ATT&CK lists the technique as a distinct sub-technique: it evades defences that inspect attachments.","study":"Re-read the technique idea in the intro: 'no attached file... the browser downloads malware'.","opts":["The email carries no malware file, so scanners have nothing malicious to open at delivery time","Links make the message larger, which looks more trustworthy to filters","Attached files would be delivered faster than links","A link removes the need for any user interaction"],"correct":0},{"id":"E05","type":"qcm","title":"What the attacker needs first","summary":"Access required before a spearphishing link works","scenario":["ATT&CK records what an adversary needs before using a technique. For T1566.002 the answer is short — and that is what makes it so common."],"question":"What does the attacker need on the target side before a spearphishing link can work?","hint":"The whole technique depends on one human action.","expl":"Nothing special. The attacker only needs a user who clicks the link — no admin rights, no stolen account, no physical access. That low entry cost is why the technique appears in so many real campaigns and why ATT&CK places it in Initial Access.","study":"Intro, section 'Platforms & access needed': no special rights — only a user click.","opts":["Only that a user clicks the link — no special rights","Domain administrator rights on the network","A stolen service account password","Physical access to the office building"],"correct":0},{"id":"E06","type":"multi","title":"Platforms of the sub-technique","summary":"Which platforms does ATT&CK list for T1566.002?","scenario":["Each ATT&CK technique lists the platforms where the behaviour can happen. T1566.002 reaches users through email clients and browsers on many systems, and even through cloud tenants."],"question":"Select every platform that ATT&CK lists for T1566.002.","hint":"All listed platforms have users who read email or click links in a browser.","expl":"ATT&CK lists Windows, macOS, Linux, Office Suite, SaaS, Google Workspace and Identity Provider for this sub-technique — anywhere a user can read a message and click a link. Kubernetes and Cisco IOS are infrastructure platforms with no email-click behaviour, so they are not listed.","study":"Intro, section 'Platforms & access needed'.","opts":["Windows","Kubernetes clusters","macOS","Cisco IOS routers","Office Suite"],"correct":[0,2,4],"why":{"1":"Kubernetes runs containers; its users do not read email inside it, so ATT&CK does not list it here.","3":"Cisco IOS is network device firmware; there is no email client or browser click on it."}},{"id":"E07","type":"match","title":"What the click can lead to","summary":"Three link outcomes from the ATT&CK description","scenario":["The ATT&CK description of T1566.002 names several things a victim can be led into. Each outcome has its own name that teams use in tickets and reports."],"question":"Match each outcome to its common name.","hint":"Two outcomes steal something; one asks the user to approve something.","expl":"A fake sign-in page that captures the password is credential harvesting. A page that tricks the browser into fetching an installer is a malware download. A page asking the user to approve a rogue OAuth application is consent phishing — the approval hands the attacker a token that works like a login, which ATT&CK tracks under T1528 Steal Application Access Token.","study":"Intro, section 'Adversary behaviour': the three outcomes of a click.","left":["A page that copies the password the user types","A page that makes the browser fetch an installer","A page asking the user to approve an OAuth application"],"right":["Credential harvesting","Malware download","Consent phishing"],"correct":[0,1,2]},{"id":"E08","type":"fill","title":"Read a defanged IOC","summary":"One proxy line — name the real domain","scenario":[{"label":"Web proxy record","kind":"log","src":"proxy.log","lines":["2026-10-20T09:14:02Z user=j.doe src_ip=10[.]0[.]44[.]17 method=GET url=hxxp://secure-login[.]example-id-2941[.]com/signin status=200 bytes=4821 category=uncategorized"]},"Security teams write indicators defanged: every dot of a domain becomes [.] so the text cannot be clicked by accident. In this line, secure-login[.]example-id-2941[.]com means the real domain secure-login.example-id-2941.com."],"question":"Fill in the blank: type the real destination domain that the browser contacted.","hint":"Replace each [.] with a normal dot — nothing else changes.","expl":"The defanged text secure-login[.]example-id-2941[.]com reads, with real dots, as secure-login.example-id-2941.com. The proxy name proxy-north.corp is the sensor that wrote the log, and signin is only the path on the page. Defanging is a professional habit that stops people and scanners from touching the live site.","study":"Practice reading one defanged URL aloud, replacing [.] with a dot.","template":"The real destination domain the browser contacted is {0}.","bank":["secure-login[.]example-id-2941[.]com","proxy-north[.]corp","signin[.]microsoft[.]com","10[.]0[.]44[.]17"],"correct":[0]},{"id":"E09","type":"fill","title":"Who received the link?","summary":"One mail-gateway line — two facts to extract","scenario":[{"label":"Mail gateway record","kind":"log","src":"mailgw.log","lines":["2026-10-21T08:59:11Z from=billing@vendor-mail[.]example to=j.doe@corp[.]example subj=\"Invoice #77341 overdue\" url=hxxps://invoice-portal[.]example-id-9930[.]com/pay action=deliver banner=external-sender"]}],"question":"Fill in both blanks: the mailbox that received the message, and the domain the link points to.","hint":"The recipient follows to= and the link domain follows url= — remember the dots are written [.] in the link.","expl":"The gateway delivered the message to j.doe@corp[.]example — that is the recipient at risk. The link points to invoice-portal[.]example-id-9930[.]com, which becomes invoice-portal.example-id-9930.com with real dots. billing@vendor-mail[.]example is the claimed sender — spoofed sender names are common, so the recipient and the link domain are the two facts that drive the response.","study":"In mail-gateway lines, from= is claimed, to= is the real internal mailbox, url= is what the user is asked to visit.","template":"The mailbox that received the message is {0}, and the domain the link points to is {1}.","bank":["j.doe@corp[.]example","invoice-portal[.]example-id-9930[.]com","billing@vendor-mail[.]example","mailgw01[.]corp"],"correct":[0,1]},{"id":"E10","type":"qcm","title":"Pick the mitigation that fits","summary":"Fewer clicks — which ATT&CK mitigation is the direct match?","scenario":["ATT&CK lists mitigations against this technique. One of them attacks the human step directly: it teaches people to spot and report suspicious links, and runs fake-phishing drills to measure who is at risk."],"question":"The team wants fewer people to click spearphishing links. Which ATT&CK mitigation is the direct match for that goal?","hint":"Look for the mitigation whose name is about people, not about software.","expl":"M1017 User Training is the direct match: it trains users to recognise social engineering and report it, and it runs simulated phishing to measure progress. M1021 Restrict Web-Based Content acts at the proxy after a click; M1049 Antivirus scans files on disk; M1047 Audit reviews logs and permissions. Those help, but only training targets the click itself.","study":"Intro, section 'Mitigation basics': M1017 trains people, M1021 filters the web.","opts":["M1017 — User Training","M1049 — Antivirus/Antimalware","M1047 — Audit","M1021 — Restrict Web-Based Content"],"correct":0},{"id":"E11","type":"match","title":"Match the action to its mitigation","summary":"Two everyday controls — name their ATT&CK mitigation IDs","scenario":["Your team already does two things: the web proxy blocks known phishing domains, and every external email carries a warning banner while staff get short phishing drills. ATT&CK gives each of these a mitigation ID."],"question":"Match each action to its ATT&CK mitigation.","hint":"One control works at the network gateway; the other one works on people and mail banners.","expl":"Blocking known phishing domains at the gateway is M1021 Restrict Web-Based Content — ATT&CK's text for this mitigation covers URL filtering and DNS-based blocking. Warning banners and phishing drills are part of M1017 User Training — its ATT&CK text explicitly includes email warning banners for external senders and simulated exercises.","study":"Keep two buckets in mind: controls on the network path (M1021) and controls on people (M1017).","left":["Block newly-seen phishing domains on the web proxy","Show an external-sender banner and run phishing drills"],"right":["M1021 — Restrict Web-Based Content","M1017 — User Training"],"correct":[0,1]},{"id":"E12","type":"order","title":"The three steps of the trick","summary":"Order the simple flow of a spearphishing link","scenario":["A spearphishing link works as a short chain of three steps. Put them in the order they really happen."],"question":"Arrange the three steps from first to last.","hint":"The message must exist before anyone can click it.","expl":"First the attacker sends the email with the link — nothing has happened on the target side yet. Then the user clicks, and the browser opens the page. Only then can the fake page capture what the user types. Every incident you will ever triage starts at step one, which is why mail-gateway logs matter so much.","study":"Intro, section 'Adversary behaviour': message, click, outcome.","items":["The attacker sends an email that carries the link","The user clicks the link in their browser","The fake page captures the password the user types"]},{"id":"E13","type":"qcm","title":"The simple next step","summary":"A user already clicked — what now?","scenario":[{"label":"SOC alert","kind":"log","src":"alert.txt","lines":["2026-10-21T09:03:10Z alert=mailclick user=j.doe url=hxxp://pay-slip[.]example-id-77[.]com/login detail=user reports entering corporate password detail2=mail removed from inbox, sample preserved"]}],"question":"The user already clicked and typed the corporate password. As the SOC analyst on shift, what is the simple, correct first step?","hint":"One credential is at risk. Fix that first — the big actions can follow.","expl":"The password is compromised, so the first step is to have the user change it and report the email through the normal channel. Rebuilding the network or cutting everyone's internet is wildly out of proportion, and replying to the attacker is never an option. Calm, proportionate first steps are what real SOC work looks like.","study":"Response order: contain what was stolen first (the credential), then investigate wider.","opts":["Have the user change the password and formally report the email","Rebuild the whole company network","Turn off internet access for the entire company","Reply to the sender and ask if the invoice is real"],"correct":0},{"id":"E14","type":"term","title":"Guided shell: check one link","summary":"Use the urlcheck tool on the link from ticket #4471","scenario":[{"label":"Helpdesk ticket #4471","kind":"note","text":"User reports an email with this link: hxxp://staff-portal[.]example-id-4471[.]com/login — the message pretends to be the staff self-service portal. The user did NOT click. Please verify the link safely."}],"question":"In the analysis shell, run the urlcheck tool on the link from ticket #4471.","hint":"Type the tool name, then a space, then the link exactly as it appears in the ticket.","expl":"urlcheck is the analysis shell's read-only link checker: it looks up the address, follows redirects on paper, and prints a verdict without ever opening the page. You passed it the defanged link from the ticket, and it confirmed a credential-harvesting page on a domain registered two days ago.","study":"Keep using the simulation shell for every link-check exercise — the tool name and the target are all you ever need to type.","termTitle":"soc-workstation — analysis shell (simulation only)","prompt":"analyst@soc:~$","syn":{"title":"Syntax reminder — urlcheck","lines":["urlcheck <url>    prints a safety verdict for one link","    <url>   the address to inspect, copied as written (defanged is fine)","The tool only reads information. It never opens the page in a browser."],"example":"urlcheck hxxps://docs-share[.]example-id-5501[.]com/f/8812"},"sim":{"tool":"urlcheck","banner":"Simulation shell. Nothing here touches a real system. Type the command and press Run.","notFound":"command not found — the analysis shell only offers: urlcheck","out":["resolving  staff-portal[.]example-id-4471[.]com ... ok","registered: 2 days ago  |  category: uncategorized  |  certificate: new","page type : login form (username + password)","verdict   : LIKELY CREDENTIAL HARVESTING — do not open in a browser"]},"elems":[{"label":"the tool urlcheck","all":["urlcheck"]},{"label":"the target link hxxp://staff-portal[.]example-id-4471[.]com/login","all":["hxxp://staff-portal[.]example-id-4471[.]com/login"]}],"noise":[],"danger":[{"pat":"open |curl |wget |rm |del ","why":"Those commands would try to fetch or delete things; urlcheck is the safe read-only checker here."}],"canonical":"urlcheck hxxp://staff-portal[.]example-id-4471[.]com/login","parts":[{"t":"urlcheck","d":"the analysis shell's read-only link checker — it inspects without opening"},{"t":"hxxp://staff-portal[.]example-id-4471[.]com/login","d":"the defanged link copied exactly from ticket #4471"}]},{"id":"E15","type":"multi","title":"Signs of the LINK variant","summary":"Two details prove it was .002, not .001","scenario":["A colleague forwards an email and says: 'this is phishing'. You want to label it with the right ATT&CK sub-technique before you write the ticket."],"question":"Select the two details that show the email used the T1566.002 link variant and not the attachment variant.","hint":"Look for a web address to click — and make sure no file rode along.","expl":"The link variant is defined by two things at once: a web address in the body that the user is pushed to click, and no attached file. A PDF icon at the bottom would point to the attachment variant T1566.001. Company colours are just design — attackers copy branding in every variant.","study":"Ask two questions of every phish: is there a file? is there a link? The answers pick the sub-technique.","opts":["The body contained a web address the user is asked to click","No file was attached to the email","A PDF icon sat at the bottom of the message","The email used the company's logo colours"],"correct":[0,1],"why":{"2":"A PDF icon means a file was attached — that is the T1566.001 attachment variant.","3":"Visual branding appears in every phishing variant; it does not decide the sub-technique."}}];
</script>

function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function letters(i){ return String.fromCharCode(65+i); }
function fmt1(x){ return (Math.round(x*10)/10).toFixed(1); }
function fmtClock(sec){ sec=Math.max(0,sec); var m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }

/* Mandatory scoring formula: exerciseCredit = max(0,(H-W)/N) */
function scoreExercise(H,W,N){ if(N<=0){ return 0; } return Math.max(0,(H-W)/N); }

function setState(st){

  renderHeader();
}
function tick(){
  var now = Date.now(); var dt = Math.round((now - S._lastT)/1000);
  if(dt<=0){ return; }
  S._lastT = now;
  if(S.timerState==='RUNNING'){
    S.remaining -= dt;
    if(S.remaining<=0){ S.remaining=0; setState('ENDED'); onTimeout(); }
  } else if(S.timerState==='PAUSED_AUTO_CHECK'){
    S.autoSecs += dt;

    S.manualSecs += dt;
  }
  renderTimer();
}

  var st=$('tstate-ind'); if(st){ st.innerHTML = timerLabel(); }
}

function answeredCount(){ var n=0; for(var i=0;i<S.answered.length;i++){ if(S.answered[i]){ n++; } } return n; }
function creditSum(){ var s=0; for(var i=0;i<S.credit.length;i++){ if(S.answered[i]){ s+=S.credit[i]; } } return s; }
function percentNow(){ var n=answeredCount(); if(n===0){ return 0; } return Math.round((creditSum()/n)*100); }
function updateProgress(){
  var total = S.order.length;
  var done = 0;
  for(var i=0;i<S.done.length;i++){ if(S.done[i]){ done++; } }

}

/* ---------------- exam lifecycle ---------------- */
function startExam(){
  S.order = shuffle(EX.map(function(e,i){ return i; }));
  S.cur = 0;
  S.credit = EX.map(function(){ return 0; });
  S.answered = EX.map(function(){ return false; });
  S.done = EX.map(function(){ return false; });
  S.hintUsed = EX.map(function(){ return false; });
  S.picks = EX.map(function(){ return null; });
  S.skipped = [];
  S.remaining = BUDGET;
  S.manualSecs = 0; S.autoSecs = 0;
  S.reported = false; S.mode = 'normal';
  $('intro').hidden = true;
  $('results').hidden = true;
  $('review').hidden = true;
  $('exam').hidden = false;
  if(S._tick){ clearInterval(S._tick); }
  S._lastT = Date.now();
  S._tick = setInterval(tick, 1000);
  renderExercise();
  startTimer();
  $('exam').scrollIntoView();
}
function curEx(){ return EX[S.order[S.cur]]; }

function renderExercise(){
  var idx = S.order[S.cur];
  var e = EX[idx];
  if(!S.answered[idx]){ S.done[idx]=false; }
  var h = '<div class="card" style="padding:6px 18px 18px">';
  h += exerciseHTML(e, idx);
  h += '<div id="fbk" hidden></div>';
  h += '<div class="nav-row">';
  h += '  <button id="btn-check" class="hbtn primary">Check answer</button>';
  h += '  <button id="btn-next" class="hbtn" disabled>Next &#8594;</button>';
  h += '  <span class="nav-note" id="nav-note"></span>';
  h += '</div></div>';
  $('ex-area').innerHTML = h;
  $('h-sevbadge').innerHTML = '<span class="badge badge-sev"><span class="dot"></span>'+window.EXAM_SEV_WORD+'</span>';
  bindExercise(e, idx);
  $('btn-check').addEventListener('click', function(){ onCheck(); });
  $('btn-next').addEventListener('click', function(){ onNext(); });
  $('btn-hint').disabled = S.answered[idx] || S.hintUsed[idx];
  if(S.hintUsed[idx] && !S.answered[idx]){ showHintPanel(e); }
  $('btn-pause').disabled = false;
  $('btn-skip').disabled = S.answered[idx];
  renderHeader();
  var last = lastUnansweredPos();
  $('btn-check').textContent = (S.cur===S.order.length-1) ? 'Check answer' : 'Check answer';
  if(S.cur===S.order.length-1){ $('nav-note').textContent = 'This is the last exercise. After Check, use Final Submit.'; }
  updateNavForState();
  window.scrollTo(0,0);
}
function lastUnansweredPos(){
  for(var i=S.order.length-1;i>=0;i--){ var idx=S.order[i]; if(!S.answered[idx]){ return i; } }
  return S.order.length-1;
}
function isLast(){
  /* last exercise position reached AND all later ones are done/skipped */
  for(var i=S.cur+1;i<S.order.length;i++){ var idx=S.order[i]; if(!S.done[idx] && S.skipped.indexOf(idx)===-1){ return false; } }
  return true;
}
function updateNavForState(){
  var idx = S.order[S.cur];
  var checked = S.answered[idx];
  $('btn-check').disabled = checked;
  var nextBtn = $('btn-next');
  nextBtn.innerHTML = (S.mode==='review' && remainingSkipped()>1) ? 'Back to skipped list &#8594;' : (isLast() ? 'Final Submit &#8594;' : 'Next &#8594;');
  nextBtn.disabled = !checked;
}
function onCheck(){
  if(S.timerState==='RUNNING'){ setState('PAUSED_AUTO_CHECK'); }
  gradeCurrent();
}
function onNext(){
  var idx = S.order[S.cur];
  if(S.timerState==='PAUSED_AUTO_CHECK'){ startTimer(); }
  S.done[idx] = true;
  if(S.mode==='review'){
    if(remainingSkipped()>0){
      showReview();
      return;
    } else {
      S.mode='normal';
      finishFlow();
      return;
    }
  }
  if(isLast()){
    finishFlow();
    return;
  }
  var nxt = S.cur+1;
  while(nxt < S.order.length && S.skipped.indexOf(S.order[nxt])!==-1 && S.answered[S.order[nxt]]){ nxt++; }
  if(nxt >= S.order.length){ finishFlow(); return; }
  S.cur = nxt;
  renderExercise();
}
function onSkip(){
  var idx = S.order[S.cur];
  if(S.answered[idx]){ return; }
  if(S.skipped.indexOf(idx)===-1){ S.skipped.push(idx); }
  S.done[idx] = true;
  if(S.mode==='review'){ showReview(); return; }
  var nxt = S.cur+1;
  if(nxt >= S.order.length){
    finishFlow();
    return;
  }
  S.cur = nxt;
  renderExercise();
}
function remainingSkipped(){
  var n=0;
  for(var i=0;i<S.skipped.length;i++){ if(!S.answered[S.skipped[i]]){ n++; } }
  return n;
}
function finishFlow(){
  if(remainingSkipped()>0 && S.timerState!=='ENDED'){
    showReview();
  } else {
    showResults();
  }
}
function onTimeout(){
  if(S._tick){ clearInterval(S._tick); S._tick=null; }
  var open = remainingSkipped();
  if(open>0){ showReview(true); } else { showResults(); }
}
function onHint(){
  var idx = S.order[S.cur];
  if(S.answered[idx] || S.hintUsed[idx]){ return; }
  S.hintUsed[idx] = true;
  var e = EX[idx];
  showHintPanel(e);
  $('btn-hint').disabled = true;
}
function showHintPanel(e){
  var p = $('hint-panel');
  if(!p){
    p = document.createElement('div');
    p.id = 'hint-panel';
    var nav = $('ex-area').querySelector('.nav-row');
    nav.parentNode.insertBefore(p, nav);
  }
  p.innerHTML = '<div class="hp-h">&#128161; HINT (costs 10% of this exercise&#8217;s credit)</div>'+esc(e.hint);
}
function onPause(){
  if(S.timerState==='RUNNING' || S.timerState==='PAUSED_AUTO_CHECK'){
    S.prevState = S.timerState;
    setState('PAUSED_MANUAL');
    $('overlay').hidden = false;
    $('ex-area').style.visibility = 'hidden';
  }
}
function onResume(){
  $('overlay').hidden = true;
  $('ex-area').style.visibility = 'visible';
  setState(S.prevState || 'RUNNING');
  S.prevState = null;
}
function showReview(timeout){
  S.mode = 'review';
  $('exam').hidden = true;
  $('review').hidden = false;
  var list = S.skipped.filter(function(i){ return !S.answered[i]; });
  var h = '<div class="card" style="padding:18px 20px">';
  h += '<h2 style="margin-top:0">&#9888; Skipped exercises &#8212; review before you finish</h2>';
  h += '<p style="color:var(--text-secondary)">'+(timeout
    ? 'Time is over. You cannot answer these any more. They will be excluded from your score: they do not count as correct, wrong, or add to the total.'
    : 'You skipped these. You can go back and answer them now, as many times as you need, while the timer is still running. If you submit with skipped exercises, they are excluded from the score.')+'</p>';
  if(S.timerState!=='ENDED'){
    h += '<div style="margin:8px 0"><b style="color:var(--text-primary)">&#9201; Time left: '+fmtClock(S.remaining)+'</b></div>';
  }
  h += '<ul class="rv-list">';
  for(var i=0;i<list.length;i++){
    var idx=list[i]; var e=EX[idx];
    h += '<li class="rv-row"><span class="badge badge-skipped"><span class="dot"></span>&#9888; Skipped</span><span class="rv-t">'+esc(e.title)+'</span>';
    h += (S.timerState==='ENDED')
      ? '<button class="hbtn" disabled>Time is over</button>'
      : '<button class="hbtn" data-open="'+idx+'">&#8617; Open and answer</button>';
    h += '</li>';
  }
  h += '</ul>';
  h += '<div class="nav-row"><button id="rv-submit" class="hbtn primary big">'+(timeout?'Go to results':'Submit anyway')+'</button></div>';
  h += '</div>';
  $('review').innerHTML = h;
  var btns = $('review').querySelectorAll('[data-open]');
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener('click', function(ev){
      var idx = parseInt(ev.currentTarget.getAttribute('data-open'),10);
      S.cur = S.order.indexOf(idx);
      S.mode = 'review';
      $('review').hidden = true;
      $('exam').hidden = false;
      renderExercise();
    });
  }
  $('rv-submit').addEventListener('click', function(){
    if(S.timerState==='ENDED'){ showResults(); }
    else if(remainingSkipped()>0){ showResults(); }
    else { S.mode='normal'; finishFlow(); }
  });
  window.scrollTo(0,0);
}


/* ---------------- shared render helpers ---------------- */
var HL_RE = /(\d{4}-\d{2}-\d{2}[T ][\d:.]+(?:Z|[+-]\d{2}:?\d{2})?)|((?:\d{1,3}\[\.\]){3}\d{1,3})|((?:hxxps?):\/\/[^\s"',<>()]+)|([A-Za-z0-9._%+-]+@[A-Za-z0-9.\[\]-]+\.[A-Za-z]{2,})|(\b(?:GET|POST|CLICK|CLICKED|OPENED|BLOCK|BLOCKED|DENY|DENIED|ALERT|ALERTED|QUARANTINE|QUARANTINED|REWRITE|REWRITTEN|DELIVERED|DETONATED|FAILED|PASS|WATCHLIST|REPUTATION|MALICIOUS|PHISH)\b)/gi;
function hlLine(line){
  var out=''; var last=0; var m;
  HL_RE.lastIndex=0;
  while((m=HL_RE.exec(line))!==null){
    out += esc(line.slice(last, m.index));
    var t = m[0];
    if(m[1]){ out += '<span class="l-ts">'+esc(t)+'</span>'; }
    else if(m[2]){ out += '<span class="l-ip">'+esc(t)+'</span>'; }
    else if(m[3]){ out += '<span class="l-url">'+esc(t)+'</span>'; }
    else if(m[4]){ out += '<span class="l-mail">'+esc(t)+'</span>'; }
    else { out += '<span class="l-kw">'+esc(t)+'</span>'; }
    last = m.index + t.length;
  }
  out += esc(line.slice(last));
  return out;
}
function logViewerHTML(n, src, lines){
  var h = '<div class="logv" data-lv="'+n+'">';
  h += '<div class="logv-head"><span class="logv-src">&#128196; '+esc(src)+'</span><input class="logv-filter" type="text" placeholder="filter lines..." aria-label="Filter log lines for '+esc(src)+'"></div>';
  h += '<pre>';
  for(var i=0;i<lines.length;i++){ h += '<span class="ln">'+hlLine(lines[i])+'</span>'; }
  h += '</pre></div>';
  return h;
}
function artefactHTML(n, a){
  var h = '<div class="artefact"><div class="art-label">ARTEFACT '+n+' &#8212; '+esc(a.label)+'</div>';
  if(a.kind==='log'){
    h += logViewerHTML('a'+n, a.src || a.label, a.lines);
  } else if(a.kind==='note'){
    h += '<div class="art-note">'+esc(a.text)+'</div>';
  } else {
    h += '<pre class="mono">'+hlLine(a.text)+'</pre>';
  }
  h += '</div>';
  return h;
}
function scenarioHTML(e){
  var h = '<div class="block scenario"><div class="block-h"><span class="bh-ico">&#128270;</span><span class="bh-txt">SCENARIO</span>';
  h += '<button type="button" class="collapse-btn" id="scn-toggle">Collapse &#9662;</button></div>';

function bindScenario(){

/* ---------------- exercise skeleton ---------------- */
function exerciseHTML(e, idx){

}

/* ---------------- grading plumbing ---------------- */
function showFeedback(idx, g){
  var e = EX[idx];
  var credit = Math.max(0, g.credit - (S.hintUsed[idx] ? 0.10 : 0));
  S.credit[idx] = credit; S.answered[idx] = true;
  var si = S.skipped.indexOf(idx);
  if(si !== -1){ S.skipped.splice(si,1); }
  var label, cls, icon;
  if(credit >= 0.999){ label='CORRECT'; cls='fb-correct'; icon='&#10004;'; }
  else if(credit > 0){ label='PARTIALLY CORRECT'; cls='fb-partial'; icon='&#10004;'; }
  else { label='INCORRECT'; cls='fb-incorrect'; icon='&#10007;'; }
  if(g.dangerous){ label='DANGEROUS &#8212; NEAR MISS'; cls='fb-danger'; icon='&#10007;'; }
  var h = '<div class="fb-h '+cls+'"><span style="font-size:18px">'+icon+'</span> '+label;
  if(credit>0 && credit<0.999){ h += ' &#8212; credit '+credit.toFixed(2); }
  h += '</div><div class="fb-b">';
  if(g.creditLine){ h += '<div class="credit-line">'+g.creditLine+'</div>'; }
  if(g.items && g.items.length){
    for(var i=0;i<g.items.length;i++){
      var it=g.items[i];
      h += '<div class="item-row"><span class="it-ic '+it.cls+'">'+it.ic+'</span><span class="it-tx">'+it.tx+'</span></div>';
    }
  }
  h += '<p style="margin:12px 0 0">'+esc(g.expl || e.expl)+'</p>';
  if(g.extraHTML){ h += g.extraHTML; }
  if(!g.dangerous && S.credit[idx] < 1 && e.study){ h += '<div class="study-line">&#128218; <b>What to study:</b> '+esc(e.study)+'</div>'; }
  if(g.dangerous && e.study){ h += '<div class="study-line">&#128218; <b>What to study:</b> '+esc(e.study)+'</div>'; }
  h += '</div>';
  var fb=$('fbk'); fb.innerHTML=h; fb.hidden=false;
  lockWidget();
  renderHeader(); updateNavForState();
  fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function lockWidget(){
  var area=$('answer-area');
  var btns=area.querySelectorAll('button, select, input');
  for(var i=0;i<btns.length;i++){ btns[i].disabled=true; }
  var opts=area.querySelectorAll('.opt');
  for(var j=0;j<opts.length;j++){ opts[j].classList.add('lock'); }
}
function canonicalBlock(cmd){
  return '<div class="canon"><div class="canon-h">&#128203; Canonical command<button class="copy-btn" data-copy="'+esc(cmd)+'">&#128203; Copy</button></div><pre class="mono">'+esc(cmd)+'</pre></div>';
}
function bindCopy(){
  var b=$('fbk').querySelector('[data-copy]');
  if(b){ b.addEventListener('click', function(){
    var txt=b.getAttribute('data-copy');
    try { navigator.clipboard.writeText(txt); b.textContent='Copied'; }
    catch(err){ b.textContent='Select manually'; }
  }); }
}
function gradeCurrent(){
  var idx = S.order[S.cur];
  var e = EX[idx];
  var g = WIDGETS[e.type].grade(e, idx);
  g.expl = g.expl || e.expl;
  if(e.type==='term' && g.extraHTML === undefined && g.canonical){ g.extraHTML = canonicalBlock(g.canonical); }
  showFeedback(idx, g);
  bindCopy();
  $('btn-skip').disabled = true;
}

/* ---------------- widgets ---------------- */
var WIDGETS = {};

/* ==== qcm ==== */
WIDGETS.qcm = {
  html: function(e){ return '<div id="w-qcm"></div>'; },
  bind: function(e, idx){
    var order = shuffle(e.opts.map(function(_,i){ return i; }));
    var st = { order: order, sel: null };
    S.picks[idx] = st;
    var h='';
    for(var i=0;i<order.length;i++){
      var oi=order[i];
      h += '<button type="button" class="opt" data-oi="'+oi+'"><span class="olab">'+letters(i)+'.</span><span>'+esc(e.opts[oi])+'</span></button>';
    }
    $('answer-area').innerHTML = h;
    var btns = $('answer-area').querySelectorAll('.opt');
    for(var b=0;b<btns.length;b++){
      btns[b].addEventListener('click', function(ev){
        var el = ev.currentTarget;
        if(st.sel !== null){ return; }
        st.sel = parseInt(el.getAttribute('data-oi'),10);
        el.classList.add('sel');
        el.insertAdjacentHTML('beforeend','<span class="osel-ind">&#10003; Selected</span>');
      });
    }
  },
  grade: function(e, idx){
    var st=S.picks[idx];
    if(st.sel === null){ return { credit:0, items:[{ic:'&#9888;',cls:'it-missed',tx:'No answer selected.'}] }; }
    var ok = st.sel === e.correct;
    var rows = [];
    for(var i=0;i<e.opts.length;i++){
      var isC = i===e.correct;
      var chosen = st.sel===i;
      if(isC){ rows.push({ic: chosen?'&#10004;':'&#9675;', cls: chosen?'it-correct':'it-missed', tx:(chosen?'&#10004; Correct — ':'&#9675; Missed — ')+'The right answer was: '+e.opts[i]}); }
      else if(chosen){ rows.push({ic:'&#10007;', cls:'it-wrong', tx:'&#10007; Wrong — you chose: '+e.opts[i]}); }
    }
    return { credit: ok?1:0, items: rows };
  }
};

/* ==== multi (multi-select, partial credit) ==== */
WIDGETS.multi = {
  html: function(e){ return '<div id="w-multi"><div class="dd-hintline">Select all that apply. Wrong picks subtract from correct ones (partial credit).</div></div>'; },
  bind: function(e, idx){
    var order = shuffle(e.opts.map(function(_,i){ return i; }));
    var st = { order: order, sel: [] };
    S.picks[idx] = st;
    var h='';
    for(var i=0;i<order.length;i++){
      var oi=order[i];
      h += '<button type="button" class="opt" data-oi="'+oi+'"><span class="olab">'+letters(i)+'.</span><span>'+esc(e.opts[oi])+'</span></button>';
    }
    $('answer-area').insertAdjacentHTML('beforeend', h);
    var btns = $('answer-area').querySelectorAll('.opt');
    for(var b=0;b<btns.length;b++){
      btns[b].addEventListener('click', function(ev){
        var el = ev.currentTarget;
        var oi = parseInt(el.getAttribute('data-oi'),10);
        var at = st.sel.indexOf(oi);
        if(at === -1){ st.sel.push(oi); el.classList.add('sel'); el.insertAdjacentHTML('beforeend','<span class="osel-ind">&#10003; Selected</span>'); }
        else { st.sel.splice(at,1); el.classList.remove('sel'); var ind=el.querySelector('.osel-ind'); if(ind){ ind.remove(); } }
      });
    }
  },
  grade: function(e, idx){

  grade: function(e, idx){
    var st=S.picks[idx];
    if(!st.typed){ return { credit:0, items:[{ic:'&#9888;',cls:'it-missed',tx:'You did not run any command. Type a command in the shell, press Run, then Check.'}] }; }
    var nrm = normCmd(st.typed);
    var toks = nrm.split(' ');
    var dangerous=null;
    for(var dz=0; dz<(e.danger||[]).length; dz++){
      if(new RegExp(e.danger[dz].pat,'i').test(nrm)){ dangerous = e.danger[dz]; break; }
    }
    var H=0; var rows=[];
    var usedToks={};
    for(var el=0; el<e.elems.length; el++){
      var elem=e.elems[el];
      var ok=true;
      for(var t=0;t<elem.all.length;t++){
        var tt=elem.all[t].toLowerCase();
        var found=false;
        for(var k=0;k<toks.length;k++){
          if(toks[k]===tt){ found=true; usedToks[k]=true; }
        }
        if(!found){ ok=false; }
      }
      if(ok){ H++; rows.push({ic:'&#10004;',cls:'it-correct',tx:'&#10004; Correct — '+elem.label}); }
      else { rows.push({ic:'&#9675;',cls:'it-missed',tx:'&#9675; Missed — '+elem.label}); }
    }
    var W=0;
    for(var x=0;x<toks.length;x++){
      if(!usedToks[x] && (e.noise||[]).indexOf(toks[x])===-1 && toks[x]!==''){ W++; rows.push({ic:'&#10007;',cls:'it-wrong',tx:'&#10007; Wrong — extra token &#8220;'+esc(toks[x])+'&#8221; is not part of the expected command'}); }
    }
    var N=e.elems.length;
    var credit = dangerous ? 0 : scoreExercise(H,W,N);
    var g={ credit: credit, dangerous: !!dangerous,
      creditLine: 'Elements: '+H+' correct / '+W+' wrong of N='+N,
      items: rows };
    if(dangerous){ g.expl = 'You ran a command that matches a dangerous pattern: '+dangerous.why+' '+e.expl; }
    g.canonical = e.canonical;
    g.extraHTML = canonicalBlock(e.canonical);
    if(e.parts){
      g.extraHTML += '<div class="syn-panel"><h5>Command explained part by part</h5>';
      for(var p=0;p<e.parts.length;p++){ g.extraHTML += '<pre>'+esc(e.parts[p].t)+'  &#8212;  '+esc(e.parts[p].d)+'</pre>'; }
      g.extraHTML += '</div>';
    }
    return g;
  }
};

/* ==== branch (decision tree; auto-pause only on final decision) ==== */
WIDGETS.branch = {
  html: function(e){ return '<div id="w-branch"></div>'; },
  bind: function(e, idx){
    var st={ step:0, picks:[], locked:false };
    S.picks[idx]=st;
    render();
    function render(){
      var k=st.step;
      var step=e.steps[k];
      var h='<div class="dd-hintline">Decision '+(k+1)+' of '+e.steps.length+(k<e.steps.length-1?' — the timer keeps running while you work through the steps. Only the final decision is graded with Check.':' — this is the final decision. Press Check after you pick.')+'</div>';
      if(step.scn && step.scn.length){
        for(var s2=0;s2<step.scn.length;s2++){ h += '<p class="scn-intro">'+esc(step.scn[s2])+'</p>'; }
      }
      var oOrder = shuffle(step.opts.map(function(_,i){ return i; }));
      st.order=oOrder;
      for(var i=0;i<oOrder.length;i++){
        var oi=oOrder[i];
        h += '<button type="button" class="opt" data-oi="'+oi+'"><span class="olab">'+letters(i)+'.</span><span>'+esc(step.opts[oi].t)+'</span></button>';
      }
      h += '<div id="br-stepfb"></div>';
      $('w-branch').innerHTML=h;
      var btns=$('w-branch').querySelectorAll('.opt');
      for(var b=0;b<btns.length;b++){
        btns[b].addEventListener('click', function(ev){
          var el=ev.currentTarget;
          var oi=parseInt(el.getAttribute('data-oi'),10);
          var all=$('w-branch').querySelectorAll('.opt');
          for(var q=0;q<all.length;q++){ all[q].classList.remove('sel'); }
          el.classList.add('sel');
          st.cur=oi;
          var fb=$('br-stepfb');
          fb.innerHTML='<div class="item-row"><span class="it-ic '+(step.opts[oi].ok?'it-correct':'it-wrong')+'">'+(step.opts[oi].ok?'&#10004;':'&#10007;')+'</span><span class="it-tx">'+(step.opts[oi].ok?'Good call.':'That path has consequences.')+' '+esc(step.opts[oi].note)+'</span></div>';
          fb.innerHTML += '<div class="nav-row"><button type="button" class="hbtn '+(k===e.steps.length-1?'primary':'')+'" id="br-cont">'+(k===e.steps.length-1?'Check final answer':'Continue &#8594;')+'</button></div>';
          $('br-cont').addEventListener('click', function(){
            st.picks[k]=st.cur;
            if(k===e.steps.length-1){
              onCheck();
            } else {
              st.step++;
              render();
            }
          });
        });
      }
    }
  },
  grade: function(e, idx){
    var st=S.picks[idx];
    var N=e.steps.length,H=0,W=0; var rows=[];
    for(var i=0;i<N;i++){
      var pick=st.picks[i];
      if(pick===undefined){ return { credit:0, items:[{ic:'&#9888;',cls:'it-missed',tx:'Not all decisions were made.'}] }; }
      var opt=e.steps[i].opts[pick];
      if(opt.ok){ H++; rows.push({ic:'&#10004;',cls:'it-correct',tx:'&#10004; Decision '+(i+1)+' correct — '+opt.t}); }
      else { W++; rows.push({ic:'&#10007;',cls:'it-wrong',tx:'&#10007; Decision '+(i+1)+' wrong — you chose: '+opt.t+'. Right: '+e.steps[i].opts.filter(function(o){return o.ok;})[0].t}); }
    }
    return { credit: scoreExercise(H,W,N), creditLine: 'Decisions: '+H+' correct / '+W+' wrong of N='+N, items: rows };
  }
};

/* ==== triage (SOC alert queue, partial credit) ==== */
WIDGETS.triage = {
  html: function(e){ return '<div id="w-triage"><div class="dd-hintline">Choose one action for every alert. Correct and wrong picks count per alert (partial credit).</div></div>'; },
  bind: function(e, idx){
    var aOrder = shuffle(e.alerts.map(function(_,i){ return i; }));
    var st={ order:aOrder, sel: e.alerts.map(function(){ return null; }) };
    S.picks[idx]=st;
    var h='';
    for(var i=0;i<aOrder.length;i++){
      var ai=aOrder[i]; var al=e.alerts[ai];
      h += '<div class="tri-card"><div class="tri-title">&#128231; '+esc(al.t)+'</div><div class="tri-meta">'+esc(al.meta)+'</div><div class="tri-actions" data-ai="'+ai+'">';
      for(var a=0;a<e.actions.length;a++){
        h += '<button type="button" class="tri-act" data-aa="'+a+'">'+esc(e.actions[a].t)+'</button>';
      }
      h += '</div></div>';
    }
    $('w-triage').insertAdjacentHTML('beforeend', h);
    var acts=$('w-triage').querySelectorAll('.tri-act');
    for(var b=0;b<acts.length;b++){
      acts[b].addEventListener('click', function(ev){
        var el=ev.currentTarget;
        var wrap=el.parentNode;
        var ai=parseInt(wrap.getAttribute('data-ai'),10);
        var aa=parseInt(el.getAttribute('data-aa'),10);
        st.sel[ai]=aa;
        var btns=wrap.querySelectorAll('.tri-act');
        for(var q=0;q<btns.length;q++){ btns[q].classList.remove('sel'); }
        el.classList.add('sel');
      });
    }
  },
  grade: function(e, idx){
    var st=S.picks[idx];
    var H=0,W=0; var rows=[];
    for(var i=0;i<e.alerts.length;i++){
      var s=st.sel[i];
      var al=e.alerts[i];
      if(s===al.ok){ H++; rows.push({ic:'&#10004;',cls:'it-correct',tx:'&#10004; Correct — '+al.t+': '+e.actions[al.ok].t+'. '+al.why}); }
      else if(s!==null){ W++; rows.push({ic:'&#10007;',cls:'it-wrong',tx:'&#10007; Wrong — '+al.t+': you chose '+e.actions[s].t+'. Right: '+e.actions[al.ok].t+'. '+al.why}); }
      else { rows.push({ic:'&#9675;',cls:'it-missed',tx:'&#9675; Missed — '+al.t+': right action was '+e.actions[al.ok].t+'. '+al.why}); }
    }
    var N=e.alerts.length;
    return { credit: scoreExercise(H,W,N), creditLine: 'Alerts: '+H+' handled right / '+W+' wrong of N='+N, items: rows };
  }
};

/* ---------------- results + report ---------------- */
function showResults(){
  if(S._tick){ clearInterval(S._tick); S._tick=null; }
  setState('ENDED');
  $('exam').hidden = true;
  $('review').hidden = true;
  $('results').hidden = false;
  var full=0, part=0, wrong=0, skipped=0, partSum=0;
  for(var i=0;i<EX.length;i++){
    if(S.answered[i]){
      if(S.credit[i]>=0.999){ full++; }
      else if(S.credit[i]>0){ part++; partSum+=S.credit[i]; }
      else { wrong++; }
    } else { skipped++; }
  }
  var answered=full+part+wrong;
  var sum=creditSum();
  var pct = answered>0 ? Math.round((sum/answered)*100) : 0;
  var pass = pct>=70;
  var h='<div class="card" style="padding:20px">';
  h += '<h2 style="margin-top:0">Results &#8212; '+esc(window.EXAM_TITLE)+'</h2>';
  var vcls = pass ? 'res-verdict res-pass' : 'res-verdict res-fail';
  h += '<div class="'+vcls+'"><div class="v-big">'+(pass?'&#10004; PASS':'&#10007; FAIL')+'</div>';
  h += '<div style="font-family:var(--font-mono);font-size:22px;margin-top:6px;color:var(--text-primary)">'+fmt1(sum)+' / '+answered+' &#8212; '+pct+'%</div>';
  h += '<p>'+(pass?'You reached the 70% pass mark.':'You need at least 70% to pass. Press Retake Exam to try again with reshuffled exercises and options.')+'</p></div>';
  h += '<div class="res-grid">';
  h += '<div class="res-cell"><div class="r-l"><span class="it-correct">&#10004;</span> Fully correct</div><div class="r-v it-correct">'+full+'</div></div>';
  h += '<div class="res-cell"><div class="r-l"><span class="it-wrong" style="color:var(--state-partial)">&#10004;</span> Partially correct</div><div class="r-v" style="color:var(--state-partial)">'+part+(part>0?' <span style="font-size:14px">(avg '+fmt1(partSum/part)+')</span>':'')+'</div></div>';
  h += '<div class="res-cell"><div class="r-l"><span class="it-wrong">&#10007;</span> Fully incorrect</div><div class="r-v it-wrong">'+wrong+'</div></div>';
  h += '<div class="res-cell"><div class="r-l"><span class="it-missed">&#9888;</span> Skipped &#8212; excluded</div><div class="r-v it-missed">'+skipped+'</div></div>';
  h += '</div>';
  h += '<p class="time-note">&#9201; Manual pause total: '+fmtClock(S.manualSecs)+' &#183; Feedback review time (Check auto-pause): '+fmtClock(S.autoSecs)+' &#183; Time left when you finished: '+fmtClock(S.remaining)+'</p>';
  h += '<div class="nav-row"><button id="btn-retake" class="hbtn primary big">&#8635; Retake Exam</button></div></div>';
  $('results').innerHTML=h;
  $('btn-retake').addEventListener('click', function(){
    $('results').hidden=true;
    $('intro').hidden=false;
    window.scrollTo(0,0);
  });
  window.scrollTo(0,0);
  if(!S.reported){ S.reported=true; reportScore(sum, answered); }
}
function reportScore(creditSumF, answeredCountN){
  var percent = answeredCountN>0 ? Math.round((creditSumF/answeredCountN)*100) : 0;
  try {
    /* Strict same-origin targeting; opaque origins (file://, sandboxed iframes)
       serialise to the string "null", which is not a valid targetOrigin, so we
       fall back to "*" — event.origin still identifies the sender unambiguously. */
    var target = (location.origin && location.origin !== 'null' && location.origin !== 'file://') ? location.origin : '*';
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: window.EXAM_TOPIC,
      batch: window.EXAM_BATCH,
      score: Math.round(creditSumF),
      total: answeredCountN,
      percent: percent,
      passed: percent>=70
    }, target);
  } catch(e) { /* opened directly, nothing to report to */ }
}
/* handshake — accepted but the file is dark-only, theme never toggles anything */
window.addEventListener('message', function(event){
  if(!event.data){ return; }
  if(event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT'){ return; }
  /* merge semantics: only fields actually present in the handshake are applied,
     so a CYBERMASTERY_INIT without a username never wipes a previous identity */
  if('username' in event.data){ S.user.username = String(event.data.username || ''); }
  if('country' in event.data){ S.user.country = String(event.data.country || ''); }
  if('locale' in event.data){ S.user.locale = String(event.data.locale || 'en'); }
  renderHeader();
});
function boot(){
  document.body.classList.add(window.EXAM_BODY_CLASS);
  $('h-id').textContent = window.EXAM_ID;
  $('h-sevbadge').innerHTML = '<span class="badge badge-sev"><span class="dot"></span>'+window.EXAM_SEV_WORD+'</span>';
  $('btn-hint').addEventListener('click', onHint);
  $('btn-skip').addEventListener('click', onSkip);
  $('btn-pause').addEventListener('click', onPause);
  $('ov-resume').addEventListener('click', onResume);
  buildIntro();
  S._lastT = Date.now();
  S._tick = setInterval(tick, 1000);
  renderHeader();
}
document.addEventListener('DOMContentLoaded', boot);

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
