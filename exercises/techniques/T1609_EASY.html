var META={"topicId":"t1609","mitreId":"T1609","name":"Container Administration Command","mitreName":"Container Administration Command","objectType":"technique","title":"T1609 Container Administration Command — EASY","difficulty":"easy","severity":"easy","severityLabel":"EASY","batch":1,"questionCount":15,"estimatedMinutes":18,"passMark":70,"protocol":"cpa-staged-v1"};
var INTRO={"learnHtml":"<p><b>Imagine you just joined the cloud security team.<\/b> Your job is to watch the company's container platforms and spot attackers. This exam teaches you <b>T1609 — Container Administration Command<\/b>, a <b>Technique<\/b> in the MITRE ATT&amp;CK framework under the <b>Execution<\/b> tactic, for the <b>Containers<\/b> platform.<\/p><p>Containers are managed by powerful admin services: the <b>Docker daemon<\/b> on every Docker host, the <b>Kubernetes API server<\/b> (port 6443), and the <b>kubelet<\/b> on every node (port 10250). Anyone who can reach these services can run commands inside containers — for example with <b>docker exec<\/b> or <b>kubectl exec<\/b>.<\/p><p>Attackers use these admin commands to get a shell inside containers that <b>already exist<\/b>. That is the key difference from T1610 Deploy Container, which starts <b>new<\/b> containers. In this exam you will learn the admin services, the two exec commands, the famous port numbers, and how to spot exec activity in simple logs — the daily work of a SOC analyst on a container estate.<\/p>","themes":[{"name":"Container admin services","concepts":["container administration service","Docker daemon","docker exec command","entrypoint at deploy","exposed Docker daemon (port 2375)","docker.sock mount","Kubernetes API server (6443)","kubelet (10250) API"]},{"name":"Kubernetes execution basics","concepts":["kubectl exec command","exec-into-existing vs deploy-new (T1610)"]},{"name":"Spotting exec in telemetry","concepts":["unexpected process creation in containers"]}]};
var EXERCISES=[{"id":"EX-01","type":"qcm-single","summary":"What does T1609 say adversaries abuse?","concepts":["container administration service"],"scenario":"<p>Your mentor opens the ATT&amp;CK page for <b>T1609 — Container Administration Command<\/b> and asks you to read the first line aloud: adversaries abuse container administration services to execute commands inside containers.<\/p>","question":"<p>Look at that sentence. What does the attacker abuse?<\/p>","options":["A mobile phone management platform","A container administration service, like the Docker daemon","The company's email security gateway","An office printer management console"],"correct":1,"hint":"The technique name says it: administration of containers.","explanation":"<p>T1609 is about <b>container administration services<\/b> — the tools that manage containers, such as the Docker daemon, the Kubernetes API server, and the kubelet. An attacker who reaches them can run commands inside containers. Phone platforms, email gateways, and print consoles are not container admin services.<\/p>","study":"ATT&CK T1609 'Description', first sentences."},{"id":"EX-02","type":"qcm-single","summary":"Which command opens a shell in a running container?","concepts":["docker exec command","Docker daemon"],"scenario":"<p>On a Docker host, a developer asks you: \"My container <span class=\"mono\">web1<\/span> is already running. I need to open a shell inside it.\" Four commands are on the whiteboard.<\/p>","question":"<p>Look at the commands. Which one opens a shell inside the already-running container?<\/p>","options":["docker build -t web1 .","docker push web1:latest","docker exec -it web1 sh","docker logout"],"correct":2,"hint":"You need the command whose name means 'execute inside an existing container'.","explanation":"<p><b>docker exec<\/b> runs a new command inside a container that already exists; with <span class=\"mono\">-it<\/span> you get an interactive shell. <span class=\"mono\">docker build<\/span> builds an image, <span class=\"mono\">docker push<\/span> uploads an image to a registry, and <span class=\"mono\">docker logout<\/span> removes registry login — none of them puts a shell into the running container.<\/p>","study":"docker exec reference: executing into running containers."},{"id":"EX-03","type":"fill-blank","summary":"Complete the fact: the two admin ports.","concepts":["Kubernetes API server (6443)","kubelet (10250) API"],"scenario":"<p>Fill in the two port numbers for your shift-log cheat-sheet about cluster admin services.<\/p>","question":"<p>Fill the blanks with the two port numbers.<\/p>","template":"Fill the blanks: the Kubernetes API server usually listens on port <input1>, and the kubelet on every node listens on port <input2>.","blanks":[{"answer":"6443","alts":["6443/tcp","port 6443"],"placeholder":"port","width":6},{"answer":"10250","alts":["10250/tcp","port 10250"],"placeholder":"port","width":6}],"hint":"One port is in the 6000s, the other in the 10000s.","explanation":"<p>The <b>Kubernetes API server<\/b> is the cluster's management front door and usually listens on <b>6443<\/b>. The <b>kubelet<\/b> runs on every node and its API listens on <b>10250<\/b>. Both are powerful admin services attackers want to reach. 2375 (Docker remote API) and 5000 (registry) are different services.<\/p>","study":"ATT&CK T1609: the API server and the kubelet and their ports."},{"id":"EX-04","type":"qcm-single","summary":"Exec into an existing container: which technique?","concepts":["exec-into-existing vs deploy-new (T1610)"],"scenario":"<p>A ticket says: \"The intruder got a shell inside the <b>existing<\/b> payments container. No new container was created.\" The ticket template asks for the correct ATT&amp;CK technique.<\/p>","question":"<p>Which technique matches executing commands in a container that already exists?<\/p>","options":["T1610 Deploy Container","T1609 Container Administration Command","T1197 BITS Jobs","T1078 Valid Accounts"],"correct":1,"hint":"Deploy Container would mean something NEW was started.","explanation":"<p>Executing inside a container that already exists is <b>T1609 Container Administration Command<\/b>. <b>T1610 Deploy Container<\/b> is for starting new containers. BITS Jobs and Valid Accounts are unrelated techniques.<\/p>","study":"ATT&CK T1609 vs T1610: exec into running vs deploy new."},{"id":"EX-05","type":"matching","summary":"Match three execution terms to meanings.","concepts":["docker exec command","entrypoint at deploy","kubectl exec command"],"scenario":"<p>Your mentor quizzed you with three index cards about ways code gets executed in containers. Match each term with its meaning.<\/p>","question":"<p>Click an item on the left, then its match on the right.<\/p>","pairs":[{"left":"docker exec","right":"runs a command inside an already-running Docker container"},{"left":"entrypoint","right":"the command a container runs automatically when it starts"},{"left":"kubectl exec","right":"runs a command inside a running pod in the cluster"}],"hint":"One runs at container start, one targets Docker containers, one targets Kubernetes pods.","explanation":"<p><b>docker exec<\/b> puts a command into a running Docker container. The <b>entrypoint<\/b> is what a container runs automatically at start — attackers who control an image abuse this. <b>kubectl exec<\/b> is the Kubernetes version: it targets pods through the API server.<\/p>","study":"ATT&CK T1609: docker exec, entrypoint at deploy, kubectl exec."},{"id":"EX-06","type":"qcm-single","summary":"Why is a shell inside a web container suspicious?","concepts":["unexpected process creation in containers"],"scenario":"<p>A monitoring alert says: \"Process <span class=\"mono\">/bin/sh<\/span> started inside container <span class=\"mono\">shop-frontend<\/span> — a web-server container.\" Your team lead asks why this matters.<\/p>","question":"<p>Look at the alert. Why is a shell inside a web-server container a warning sign?<\/p>","options":["Shells are not allowed in web images","The shell changes the container's port number","Web containers normally run only the web app, so a shell is unexpected process creation","Shells use too much memory in small containers"],"correct":2,"hint":"Ask what the container is built to do — and what it is doing now.","explanation":"<p>A web-server container normally runs just the web app. A shell appearing inside it is <b>unexpected process creation in a container<\/b> — a classic sign that someone executed commands via an admin service such as docker exec or kubectl exec. Ports and memory have nothing to do with it.<\/p>","study":"T1609 detection idea: unexpected process creation inside containers."},{"id":"EX-07","type":"drag-drop","summary":"Sort activity: container admin vs normal workload.","concepts":["container administration service","Docker daemon","docker.sock mount","kubelet (10250) API"],"scenario":"<p>The SOC lead drops four events on your desk and asks you to sort them before the morning briefing.<\/p>","question":"<p>Place each event into the right bucket.<\/p>","bank":["The Docker daemon API answering requests on port 2375","A pod that mounts docker.sock to control the host daemon","kubectl exec into a running pod","A customer browsing the web shop"],"slots":[{"label":"Container administration activity (T1609 surface)","accept":[0,1,2]},{"label":"Normal workload activity","accept":[3]}],"hint":"Admin activity manages containers; browsing is just using the app.","explanation":"<p>Talking to the Docker daemon API, a pod mounting <b>docker.sock<\/b>, and <b>kubectl exec<\/b> are all container administration actions — exactly the surface T1609 abuses. A customer browsing the shop is normal workload traffic.<\/p>","study":"T1609: the admin services and the surfaces they expose."},{"id":"EX-08","type":"line-select","summary":"Spot the docker exec line in the process log.","concepts":["docker exec command","unexpected process creation in containers"],"scenario":"<p>Here is a command log from a Docker host. One line shows someone executing into a running container.<\/p>","question":"<p>Click the <b>one<\/b> line that shows a command being run inside an already-running container with docker exec.<\/p>","logLines":["10:02:11  docker run -d --name cache1 redis:7","10:03:40  docker ps","10:07:02  docker exec -it cache1 sh","10:09:55  docker images","11:15:18  docker version","11:20:03  docker logs cache1 --tail 50"],"badLines":[2],"hint":"Look for the command that starts a shell inside an existing container.","explanation":"<p>Line 3 runs <span class=\"mono\">docker exec -it cache1 sh<\/span> — a shell inside the already-running cache container. The <span class=\"mono\">docker run<\/span> line starts a NEW container (that would be deploying, not exec-ing), and the remaining lines are read-only listings and version checks.<\/p>","study":"docker exec telemetry: shell processes appearing in running containers."}];

EXERCISES.push({"id":"EX-09","type":"qcm-multi","summary":"Which two statements about cluster services are true?","concepts":["kubelet (10250) API","Kubernetes API server (6443)"],"scenario":"<p>You are preparing a short note for new joiners: \"The two cluster admin services you must know.\" Select the two true statements.<\/p>","question":"<p>Select the <b>two<\/b> statements that are true.<\/p>","options":["The kubelet runs on every node and its API can run commands in that node's containers","The kubelet runs only on the control-plane node","The Kubernetes API server is the cluster's management front door","The kubelet's API listens on port 2375"],"correct":[0,2],"hint":"Two true facts: where the kubelet lives, and what the API server is for.","explanation":"<p>True: the <b>kubelet runs on every node<\/b> and its API can run commands in that node's containers; the <b>API server<\/b> is the cluster's management front door. The kubelet is not control-plane-only, and 2375 is the Docker daemon port — the kubelet uses 10250.<\/p>","study":"T1609: kubelet (10250) vs API server (6443)."},
{"id":"EX-10","type":"ordering","summary":"Order the attacker's exec workflow.","concepts":["container administration service","docker exec command"],"scenario":"<p>A trainee asks how an attacker actually abuses an admin service to run commands in a container. Rebuild the workflow for the training notes.<\/p>","question":"<p>Order the steps from first to last.<\/p>","items":["Reach the container admin service (for example an exposed Docker daemon)","Choose the target container that is already running","Run docker exec to start a shell inside it","Operate inside the container: steal data or move further"],"hint":"You need access first, then a target, then the exec command.","explanation":"<p>The workflow is: reach the <b>admin service<\/b>, pick an <b>existing container<\/b>, run <b>docker exec<\/b> inside it, then operate from that shell. Nothing new is deployed — that is what makes it T1609.<\/p>","study":"T1609 description: remote execution via container admin services."},
{"id":"EX-11","type":"fill-blank","summary":"Complete the contrast: entrypoint vs docker exec.","concepts":["entrypoint at deploy","docker exec command"],"scenario":"<p>Complete the sentence for your team wiki page about ways code runs in containers.<\/p>","question":"<p>Fill the blanks: first the container's start command, then the admin command for running containers.<\/p>","template":"Fill the blanks: the <input1> runs automatically when a container starts, while <input2> runs commands in a container that is already running.","blanks":[{"answer":"entrypoint","alts":["entry point","the entrypoint","entrypoint command"],"placeholder":"start command","width":12},{"answer":"docker exec","alts":["docker exec command","exec"],"placeholder":"exec command","width":12}],"hint":"First blank: what runs at start. Second blank: the tool for injecting commands into running containers.","explanation":"<p>The <b>entrypoint<\/b> is executed automatically at container start (attackers who control an image abuse this). <b>docker exec<\/b> instead injects commands into a container that is already up. Both end with attacker code running — but through different doors.<\/p>","study":"T1609: entrypoint at deploy vs exec into a running container."},
{"id":"EX-12","type":"drag-drop","summary":"Sort actions: exec into existing vs deploy new.","concepts":["exec-into-existing vs deploy-new (T1610)","container administration service"],"scenario":"<p>Two techniques, four actions. Sort them for the cheat-sheet wall.<\/p>","question":"<p>Place each action under the technique it matches.<\/p>","bank":["docker exec -it web1 sh","kubectl exec -n app payments-api -- sh","kubectl run miner --image=evil[.]example/xmr","Start a fresh container from a backdoored image"],"slots":[{"label":"T1609 — exec into an EXISTING container","accept":[0,1]},{"label":"T1610 — deploy a NEW container","accept":[2,3]}],"hint":"Two actions reuse containers that already exist; two start brand-new ones.","explanation":"<p><span class=\"mono\">docker exec<\/span> and <span class=\"mono\">kubectl exec<\/span> put commands into containers that already run — T1609. <span class=\"mono\">kubectl run<\/span> with a new image and starting a fresh backdoored container create new workloads — T1610 Deploy Container.<\/p>","study":"T1609 vs T1610: the exec-vs-deploy contrast."},
{"id":"EX-13","type":"matching","summary":"Match each port to its admin service.","concepts":["exposed Docker daemon (port 2375)","Kubernetes API server (6443)","kubelet (10250) API"],"scenario":"<p>A vulnerability scanner flagged three open ports on the cluster network. Match each port to the admin service behind it.<\/p>","question":"<p>Click a port on the left, then its service on the right.<\/p>","pairs":[{"left":"2375","right":"remote Docker daemon API port"},{"left":"6443","right":"Kubernetes API server port"},{"left":"10250","right":"kubelet API port on every node"}],"hint":"Docker's port is the lowest, the API server is in the 6000s, the kubelet in the 10000s.","explanation":"<p><b>2375<\/b> is the Docker daemon's remote API — dangerous when exposed. <b>6443<\/b> is the Kubernetes API server. <b>10250<\/b> is the kubelet on each node. Knowing these ports helps you spot admin-service exposure in scans and firewall logs.<\/p>","study":"T1609: admin service ports 2375, 6443, 10250."},
{"id":"EX-14","type":"line-select","summary":"Spot the exec request in the audit extract.","concepts":["kubectl exec command","unexpected process creation in containers"],"scenario":"<p>Simplified Kubernetes audit lines from the cluster. One line shows a command being executed inside a running pod.<\/p>","question":"<p>Click the <b>one<\/b> line that shows an exec into a running pod.<\/p>","logLines":["verb=get     resource=pods        user=jane        ok","verb=list    resource=pods        user=ci-runner   ok","verb=create  resource=pods/exec   user=jane        pod=payments-api","verb=get     resource=services    user=jane        ok","verb=list    resource=configmaps  user=ci-runner   ok","verb=get     resource=namespaces  user=ci-runner   ok"],"badLines":[2],"hint":"The resource that means 'run a command in a pod' is pods/exec.","explanation":"<p>Line 3 shows <span class=\"mono\">verb=create resource=pods/exec<\/span> — an exec session inside the running <span class=\"mono\">payments-api<\/span> pod, the audit footprint of <b>kubectl exec<\/b>. Reads of pods, services, configmaps and namespaces are normal browsing.<\/p>","study":"k8s audit: verb create on pods/exec = exec into a running pod."},

  /* ---------------- scoring ---------------- */
  function scoreExercise(ex, wstate) {
    var items = [], N = 0, H = 0, W = 0, canon = null;
    function item(state, label) { items.push({ state: state, label: label }); }
    if (ex.type === 'qcm-single') {
      N = 1;
      var sel = wstate.sel && wstate.sel[0];
      if (sel === undefined) { item('mi', 'No option selected'); }
      else if (sel === ex.correct) { H = 1; item('ok', '✓ Correct — ' + strip(ex.options[ex.correct])); }
      else { W = 1; item('no', '✗ You chose: ' + strip(ex.options[sel])); }
      canon = ex.options[ex.correct];
    } else if (ex.type === 'qcm-multi') {
      N = ex.correct.length;
      var selset = wstate.sel || [];
      ex.correct.forEach(function (ci) {
        if (selset.indexOf(ci) >= 0) { H++; item('ok', '✓ Correct: ' + strip(ex.options[ci])); }
        else { item('mi', '○ Missed: ' + strip(ex.options[ci])); }
      });
      selset.forEach(function (si) { if (ex.correct.indexOf(si) < 0) { W++; item('no', '✗ Wrong: ' + strip(ex.options[si])); } });
      canon = ex.correct.map(function (ci) { return strip(ex.options[ci]); }).join(' · ');
    } else if (ex.type === 'fill-blank') {
      N = ex.blanks.length;
      ex.blanks.forEach(function (bl, bi) {
        var v = norm(wstate.vals && wstate.vals[bi]);
        var accept = [norm(bl.answer)].concat((bl.alts || []).map(norm));
        if (!v) { item('mi', '○ Missed blank ' + (bi + 1) + ' — expected: ' + esc(bl.answer)); }
        else if (accept.indexOf(v) >= 0) { H++; item('ok', '✓ Blank ' + (bi + 1) + ': ' + esc(bl.answer)); }
        else { W++; item('no', '✗ Blank ' + (bi + 1) + ' — you typed "' + esc(v) + '", expected: ' + esc(bl.answer)); }
      });
      canon = ex.blanks.map(function (bl) { return bl.answer; }).join(' | ');
    } else if (ex.type === 'drag-drop') {
      N = ex.bank.length;
      Object.keys(wstate.place || {}).forEach(function (k) {
        var bi = parseInt(k, 10), si = wstate.place[k];
        if (ex.slots[si] && ex.slots[si].accept.indexOf(bi) >= 0) { H++; item('ok', '✓ "' + strip(ex.bank[bi]) + '" → ' + esc(ex.slots[si].label)); }
        else { W++; item('no', '✗ "' + strip(ex.bank[bi]) + '" does not belong in ' + esc(ex.slots[si] ? ex.slots[si].label : '?')); }
      });
      ex.bank.forEach(function (t, bi) { if (wstate.place[bi] === undefined) item('mi', '○ Missed: "' + strip(t) + '" → ' + esc(slotLabelFor(ex, bi))); });
      canon = ex.slots.map(function (sl) { return sl.label + ': ' + sl.accept.map(function (bi) { return strip(ex.bank[bi]); }).join(', '); }).join(' | ');
    } else if (ex.type === 'ordering') {
      N = ex.items.length;
      var order = wstate.order || [];
      order.forEach(function (bi, pos) {
        if (bi === pos) { H++; item('ok', '✓ Position ' + (pos + 1) + ': ' + strip(ex.items[pos])); }
        else { W++; item('no', '✗ Position ' + (pos + 1) + ' — you put "' + strip(ex.items[bi]) + '", expected "' + strip(ex.items[pos]) + '"'); }
      });
      canon = ex.items.map(function (t, i) { return (i + 1) + '. ' + strip(t); }).join(' ');
    } else if (ex.type === 'matching') {
      N = ex.pairs.length;
      ex.pairs.forEach(function (p, li) {
        var a = (wstate.assign || {})[li];
        if (a === undefined) item('mi', '○ Missed: "' + strip(p.left) + '" → ' + esc(p.right));
        else if (a === li) { H++; item('ok', '✓ "' + strip(p.left) + '" → ' + esc(p.right)); }
        else { W++; item('no', '✗ "' + strip(p.left) + '" you matched to "' + strip(ex.pairs[a].right) + '", expected "' + esc(p.right) + '"'); }
      });
      canon = ex.pairs.map(function (p) { return strip(p.left) + ' = ' + strip(p.right); }).join(' | ');
    } else if (ex.type === 'terminal') {
      N = ex.elements.length;
      var cmd = norm(wstate.cmd || '');
      ex.elements.forEach(function (el2) {
        var hit = (el2.any || []).some(function (a) { return cmd.indexOf(String(a).toLowerCase()) >= 0; });
        if (hit) { H++; item('ok', '✓ ' + esc(el2.label)); }
        else { item('mi', '○ Missing: ' + esc(el2.label)); }
      });
      if (!cmd) item('mi', '○ Nothing typed — expected: ' + esc(ex.expected));
      canon = ex.expected;
    } else if (ex.type === 'line-select') {
      N = ex.badLines.length;
      var sel2 = wstate.sel || [];
      ex.badLines.forEach(function (li) {
        if (sel2.indexOf(li) >= 0) { H++; item('ok', '✓ Line ' + (li + 1) + ' is indeed the one to flag'); }
        else { item('mi', '○ Missed line ' + (li + 1) + ': ' + esc(shorten(ex.logLines[li], 90))); }
      });
      sel2.forEach(function (li) {
        if (ex.badLines.indexOf(li) < 0) { W++; item('no', '✗ Line ' + (li + 1) + ' is benign: ' + esc(shorten(ex.logLines[li], 80))); }
      });
      canon = ex.badLines.map(function (li) { return 'line ' + (li + 1); }).join(', ');
    } else if (ex.type === 'multi-step') {
      N = ex.steps.length;
      ex.steps.forEach(function (st, si) {
        var p = (wstate.picks || {})[si];
        if (p === undefined) item('mi', '○ Missed step ' + (si + 1) + ' — expected: ' + strip(st.options[st.correct]));
        else if (p === st.correct) { H++; item('ok', '✓ Step ' + (si + 1) + ': ' + strip(st.options[st.correct])); }
        else { W++; item('no', '✗ Step ' + (si + 1) + ' — you chose "' + strip(st.options[p]) + '", expected "' + strip(st.options[st.correct]) + '"'); }
      });
      canon = ex.steps.map(function (st, si) { return (si + 1) + '. ' + strip(st.options[st.correct]); }).join(' ');
    }
    var credit = N > 0 ? Math.max(0, (H - W) / N) : 0;
    if (N === 1) credit = H === 1 ? 1 : 0; /* single-answer: binary */
    if (S.answers[S.current].hintUsed) credit = Math.max(0, credit - 0.10);
    credit = Math.round(credit * 100) / 100;
    return { credit: credit, items: items, N: N, H: H, W: W, canon: canon };
  }
  function strip(s) { return esc(String(s).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim()); }
  function shorten(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function slotLabelFor(ex, bi) { var lbl = ''; ex.slots.forEach(function (sl) { if (sl.accept.indexOf(bi) >= 0) lbl = sl.label; }); return lbl; }

  /* ---------------- exercise screen ---------------- */
  function renderExercise(i) {
    var ex = EXERCISES[i];
    S.current = i;
    var a = S.answers[i];
    var area = $('exerciseArea'); area.innerHTML = '';
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    $('progressBar').style.width = Math.round(((i + 1) / EXERCISES.length) * 100) + '%';
    var tpEl = $('tbPart'); if (tpEl) { tpEl.textContent = 'Exercise ' + (i + 1) + ' of ' + EXERCISES.length; }

    var card = el('div', 'card');
    /* SCENARIO */
    var sc = el('div', 'block blk-scenario');
    var longSc = ex.scenario.length > 380;
    sc.innerHTML = '<div class="block-h"><span aria-hidden="true">📄</span> SCENARIO' + (longSc ? '<button type="button" class="sc-toggle" aria-expanded="true">⇅ collapse</button>' : '') + '</div>' +
      '<div class="block-b" id="scBody">' + ex.scenario + (ex.artifactNote ? '<div class="dd-hint">' + esc(ex.artifactNote) + '</div>' : '') + '</div>';
    card.appendChild(sc);
    if (longSc) {
      var tbtn = sc.querySelector('.sc-toggle'), body = sc.querySelector('#scBody');
      tbtn.addEventListener('click', function () {
        var open = tbtn.getAttribute('aria-expanded') === 'true';
        tbtn.setAttribute('aria-expanded', String(!open));
        tbtn.textContent = open ? '⇅ expand' : '⇅ collapse';
        body.classList.toggle('hidden', open);
      });
    }
    /* QUESTION */
    card.appendChild(el('div', 'block blk-question',
      '<div class="block-h"><span aria-hidden="true">❓</span> QUESTION</div><div class="block-b">' + ex.question + '</div>'));
    /* YOUR ANSWER */
    var answ = el('div', 'block blk-answer', '<div class="block-h"><span aria-hidden="true">✍</span> YOUR ANSWER</div>');
    var abody = el('div', 'block-b'); answ.appendChild(abody); card.appendChild(answ);

    var wstate = a.wstate;
    widgetFor(ex, abody, wstate);

    /* action row */
    var actions = el('div', 'actions');
    var checkBtn = el('button', 'btn btn-primary', '✓ Check');
    checkBtn.type = 'button'; checkBtn.id = 'checkBtn'; checkBtn.setAttribute('aria-label', 'Check your answer');
    checkBtn.addEventListener('click', doCheck);
    var nextBtn = el('button', 'btn btn-blue hidden', (i === EXERCISES.length - 1 || S.reviewMode) ? (S.reviewMode ? '⏭ Back to review' : '⏭ Final submit') : '⏭ Next');
    nextBtn.type = 'button'; nextBtn.id = 'nextBtn';
    nextBtn.addEventListener('click', goNext);
    var hintBtn = el('button', 'btn btn-amber', '💡 Hint (−10%)');
    hintBtn.type = 'button'; hintBtn.setAttribute('aria-label', 'Show hint, costs 10 percent of this exercise credit');
    hintBtn.disabled = a.hintUsed || a.status === 'checked';
    hintBtn.addEventListener('click', function () {
      if (a.hintUsed || a.status === 'checked') return;
      a.hintUsed = true; hintBtn.disabled = true;
      var hb = el('div', 'hintbox', '<div class="hb-h">💡 Hint — this exercise\'s credit is now reduced by 10%</div>' + esc(ex.hint));
      card.insertBefore(hb, actions);
    });
    var skipBtn = el('button', 'btn btn-ghost', '⚠ Skip');
    skipBtn.type = 'button'; skipBtn.setAttribute('aria-label', 'Skip this exercise'); skipBtn.disabled = a.status === 'checked';
    skipBtn.addEventListener('click', doSkip);
    actions.appendChild(checkBtn); actions.appendChild(nextBtn); actions.appendChild(el('span', 'spacer'));
    actions.appendChild(hintBtn); actions.appendChild(skipBtn);
    card.appendChild(actions);
    area.appendChild(card);

    /* manual pause veil (hidden by default) */
    if (S.timerState === 'PAUSED_MANUAL') showPauseVeil();

    /* restore feedback if already checked (should not normally happen) */
    if (a.status === 'checked') { renderFeedback(card, ex, a, true); checkBtn.disabled = true; nextBtn.classList.remove('hidden'); }

    updateScoreBar();
    /* pause button lives in topbar */
    renderTopbarButtons();
  }
  function renderTopbarButtons() {
    var bar = $('topbar');
    var old = document.getElementById('pauseBtn');
    if (old) old.remove();
    if (S.screen !== 'exam') return;
    var b = el('button', 'btn btn-ghost', '⏸ Pause');
    b.type = 'button'; b.id = 'pauseBtn'; b.setAttribute('aria-label', 'Pause the exam (manual pause)');
    b.addEventListener('click', function () {
      if (S.timerState === 'RUNNING' || S.timerState === 'PAUSED_AUTO_CHECK') {
        S.priorState = S.timerState;
        setTimerState('PAUSED_MANUAL'); showPauseVeil();
      } else if (S.timerState === 'PAUSED_MANUAL') {
        hidePauseVeil(); setTimerState(S.priorState || 'RUNNING');
      }
    });
    bar.appendChild(b);
    var oldF = document.getElementById('finishBtn');
    if (oldF) oldF.remove();
    var f = el('button', 'btn btn-ghost', '⏹ Finish');
    f.type = 'button'; f.id = 'finishBtn'; f.setAttribute('aria-label', 'Finish the exam early');
    f.addEventListener('click', function () { finishExam(false); });
    bar.appendChild(f);
  }
  function showPauseVeil() {
    var stage = document.querySelector('.exam-stage');
    var old = stage.querySelector('.pause-veil'); if (old) old.remove();
    var veil = el('div', 'pause-veil',
      '<div class="pv-ic" aria-hidden="true">⏸</div><div class="pv-word">PAUSED — manual</div>' +
      '<div style="color:var(--text-secondary);max-width:420px">The exercise is hidden while you are on a break. The timer is stopped.</div>');
    var r = el('button', 'btn btn-primary', '▶ Resume');
    r.type = 'button'; r.setAttribute('aria-label', 'Resume the exam');
    r.addEventListener('click', function () {
      hidePauseVeil();
      setTimerState(S.priorState === 'PAUSED_AUTO_CHECK' ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
    });
    veil.appendChild(r);
    stage.appendChild(veil);
    $('exerciseArea').querySelector('.card').style.visibility = 'hidden';
  }
  function hidePauseVeil() {
    var v = document.querySelector('.pause-veil'); if (v) v.remove();
    var c = $('exerciseArea').querySelector('.card'); if (c) c.style.visibility = 'visible';
  }

  function doCheck() {
    var i = S.current, ex = EXERCISES[i], a = S.answers[i];
    if (a.status === 'checked') return;
    var res = scoreExercise(ex, a.wstate);
    a.status = 'checked';
    a.credit = res.credit;
    a.result = res;
    a.label = res.credit >= 1 ? 'correct' : (res.credit > 0 ? 'partial' : 'incorrect');
    setTimerState('PAUSED_AUTO_CHECK'); /* check-triggered auto-pause */
    var card = $('exerciseArea').querySelector('.card');
    renderFeedback(card, ex, a, false);
    var cb = document.getElementById('checkBtn'); if (cb) cb.disabled = true;
    var sb = document.querySelector('#exerciseArea .btn-ghost'); /* skip button */ if (sb) sb.disabled = true;
    var hb = document.querySelector('#exerciseArea .btn-amber'); if (hb) hb.disabled = true;
    var nb = document.getElementById('nextBtn'); if (nb) nb.classList.remove('hidden');
    lockWidgets(card);
    updateScoreBar();
  }
  function lockWidgets(card) {
    var abody = card.querySelector('.blk-answer');
    if (!abody) return;
    abody.querySelectorAll('button, input').forEach(function (x) {
      x.disabled = true; x.style.pointerEvents = 'none'; x.readOnly = true;
      if (x.classList.contains('chip')) x.draggable = false;
    });
  }
  function renderFeedback(card, ex, a, restoring) {
    var old = card.querySelector('.fb'); if (old) old.remove();
    var res = a.result;
    var cls = a.label === 'correct' ? 'fb-correct' : (a.label === 'partial' ? 'fb-partial' : 'fb-incorrect');
    var word = a.label === 'correct' ? '✓ CORRECT' : (a.label === 'partial' ? '✓ PARTIALLY CORRECT' : '✗ INCORRECT');
    var fb = el('div', 'fb ' + cls);
    var hh = '<span>' + word + '</span>';
    if (res.N > 1) hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + ' — ' + res.H + '/' + res.N + ' items</span>';
    else hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + '</span>';
    if (a.hintUsed) hh += '<span class="fb-credit">💡 hint −0.10 applied</span>';
    fb.appendChild(el('div', 'fb-h', hh));
    var it = el('div', 'fb-items');
    res.items.forEach(function (im) { it.appendChild(el('div', 'fb-item ' + im.state, '<span class="fi-ic">' + (im.state === 'ok' ? '✓' : im.state === 'no' ? '✗' : '○') + '</span><span>' + im.label + '</span>')); });
    fb.appendChild(it);
    if (res.canon) {
      var c = el('div', 'canon');
      c.appendChild(el('div', 'dd-hint', 'Correct answer:'));
      c.appendChild(el('pre', 'art', esc(res.canon)));
      fb.appendChild(c);
    }
    fb.appendChild(el('div', 'exp', ex.explanation));
    if (a.label !== 'correct' && ex.study) fb.appendChild(el('div', 'study', '📚 What to study: ' + esc(ex.study)));
    var acts = card.querySelector('.actions');
    card.insertBefore(fb, acts);
    fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function doSkip() {
    var i = S.current, a = S.answers[i];
    if (a.status === 'checked') return;
    a.status = 'skipped';
    if (S.skipped.indexOf(i) < 0) S.skipped.push(i);
    /* no auto-pause: timer keeps running */
    advance();
  }
  function goNext() {
    if (S.timerState === 'PAUSED_AUTO_CHECK') setTimerState('RUNNING'); /* resume on Next */
    if (S.reviewMode) { S.reviewMode = false; renderReview(); showScreen('review'); return; }
    advance();
  }
  function advance() {
    var nxt = -1;
    for (var j = S.current + 1; j < EXERCISES.length; j++) { if (S.answers[j].status === 'unanswered') { nxt = j; break; } }
    if (nxt < 0) { /* none forward: go to review or results */
      for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered') { nxt = k; break; } }
    }
    if (nxt >= 0) renderExercise(nxt);
    else finishExam(false);
  }

  /* ---------------- review-skipped screen ---------------- */
  function renderReview() {
    var root = $('screen-review'); root.innerHTML = '';
    var c = el('div', 'card');
    c.appendChild(el('h2', null, '⚠ Review skipped exercises'));
    var open = S.skipped.filter(function (i) { return S.answers[i].status === 'skipped'; });
    if (open.length === 0) {
      c.appendChild(el('p', null, 'No skipped exercises left — everything was answered.'));
    } else {
      c.appendChild(el('p', 'dd-hint', 'You can return to any skipped exercise and answer it while the timer has not ended. Skipped-and-never-answered exercises are excluded from your score.'));
      open.forEach(function (i) {
        var row = el('div', 'rev-item');
        row.appendChild(el('span', 'ri-id', esc(EXERCISES[i].id)));
        row.appendChild(el('span', 'ri-sum', esc(EXERCISES[i].summary)));
        var b = el('button', 'btn btn-blue', '↩ Return to it');
        b.type = 'button'; b.setAttribute('aria-label', 'Return to ' + EXERCISES[i].id);
        b.addEventListener('click', function () { S.reviewMode = true; S.reviewFrom = 'review'; showScreen('exam'); renderExercise(i); });
        row.appendChild(b);
        c.appendChild(row);
      });
    }
    var acts = el('div', 'actions');
    var back = el('button', 'btn btn-ghost', '← Keep working (unanswered exercises)');
    back.type = 'button';
    back.addEventListener('click', function () {
      var u = -1; for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered' && S.skipped.indexOf(k) < 0) { u = k; break; } }
      if (u < 0) u = -1;
      if (u >= 0) { showScreen('exam'); renderExercise(u); } else { finishExam(false); }
    });
    var fin = el('button', 'btn btn-primary', '⏹ Final submit');
    fin.type = 'button'; fin.setAttribute('aria-label', 'Final submit and show results');
    fin.addEventListener('click', function () { finishExam(false); });
    acts.appendChild(back); acts.appendChild(el('span', 'spacer')); acts.appendChild(fin);
    c.appendChild(acts);
    root.appendChild(c);
  }

  /* ---------------- results ---------------- */
  function finishExam(timeout) {
    var anySkippedOpen = S.skipped.some(function (i) { return S.answers[i].status === 'skipped'; });
    if (!timeout && anySkippedOpen && S.timerState !== 'ENDED' && S.screen !== 'review') { renderReview(); showScreen('review'); return; }
    setTimerState('ENDED');
    var r = creditSum();
    var answered = r.n;
    var percent = answered > 0 ? Math.round((r.sum / answered) * 100) : 0;
    var passed = percent >= (META.passMark || 70);
    /* counts */
    var full = 0, part = 0, zero = 0, skipped = 0, partSum = 0;
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status;
      if (st === 'checked') {
        var cr = S.answers[i].credit;
        if (cr >= 1) full++;
        else if (cr > 0) { part++; partSum += cr; }
        else zero++;
      } else if (st === 'skipped') skipped++;
      else skipped++; /* unanswered at submit = excluded */
    });
    var root = $('screen-results'); root.innerHTML = '';
    var hero = el('div', 'card');
    var verdictTxt = passed ? '✓ PASS' : '✗ FAIL';
    hero.appendChild(el('div', 'res-hero',
      '<div><div class="res-score">' + percent + '%<small> · ' + r.sum.toFixed(1) + ' / ' + answered + ' credits</small></div>' +
      '<div class="dd-hint">scored over answered exercises only — skipped and never-answered are excluded</div></div>' +
      '<div class="verdict ' + (passed ? 'pass' : 'fail') + '">' + verdictTxt + '</div>'));
    root.appendChild(hero);
    var grid = el('div', 'res-grid');
    function cell(n, l, cls, ic) { return '<div class="res-cell"><div class="rc-n ' + (cls || '') + '">' + n + '</div><div class="rc-l"><span>' + ic + '</span><span>' + l + '</span></div></div>'; }
    grid.innerHTML =
      cell(full, 'Fully correct', 'ok-c', '✓') +
      cell(part + (part > 0 ? ' <small style="font-size:.8rem;color:var(--text-secondary)">(avg ' + (partSum / part).toFixed(2) + ')</small>' : ''), 'Partially correct', 'no-c', '✓') +
      cell(zero, 'Fully incorrect', 'no-c', '✗') +
      cell(skipped, 'Skipped — excluded', 'mi-c', '⚠');
    var gcard = el('div', 'card'); gcard.appendChild(grid);
    gcard.appendChild(el('div', 'dd-hint', '⏸ Time paused manually: ' + fmtTime(Math.round(S.manualPauseMs / 1000)) + ' · ⏸ Time reviewing feedback (auto-pause): ' + fmtTime(Math.round(S.autoPauseMs / 1000)) + ' · ⏱ Time used: ' + fmtTime((META.estimatedMinutes * 60) - S.remaining) + (timeout ? ' (timer ran out)' : '')));
    /* per-exercise strip */
    var strip = el('div', 'strip');
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status, cr = S.answers[i].credit;
      var cls = st === 'checked' ? (cr >= 1 ? 'st-ok' : cr > 0 ? 'st-pa' : 'st-no') : 'st-sk';
      var ic = st === 'checked' ? (cr >= 1 ? '✓' : cr > 0 ? '±' : '✗') : '⚠';
      var chip = el('span', 'st-chip ' + cls, ic);
      chip.title = ex.id + (st === 'checked' ? ' — credit ' + cr.toFixed(2) : ' — skipped/excluded');
      chip.setAttribute('aria-label', chip.title);
      strip.appendChild(chip);
    });
    gcard.appendChild(strip);
    root.appendChild(gcard);
    var acts = el('div', 'actions');
    var rt = el('button', 'btn btn-primary', '↺ Retake the exam');
    rt.type = 'button'; rt.setAttribute('aria-label', 'Retake the exam');
    rt.addEventListener('click', retake);
    acts.appendChild(rt);
    root.appendChild(el('div', 'card', '')).appendChild(acts);
    showScreen('results');
    /* report exactly once per attempt */
    if (!S.reported) {
      S.reported = true;
      reportScore(r.sum, answered);
    }
  }
  function retake() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    S.skipped = []; S.current = 0; S.reviewMode = false; S.reported = false; S.attempt++;
    S.manualPauseMs = 0; S.autoPauseMs = 0; S.priorState = null;
    buildShuffles();
    setTimerState('RUNNING'); S.remaining = (META.estimatedMinutes || 15) * 60;
    showScreen('exam'); renderExercise(0);
  }
  function reportScore(creditSumV, answeredCount) {
    var percent = answeredCount > 0 ? Math.round((creditSumV / answeredCount) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: META.topicId,
        batch: META.batch,
        score: Math.round(creditSumV),
        total: answeredCount,
        percent: percent,
        passed: percent >= 70
      }, location.origin);
    } catch (e) { /* opened directly rather than inside the site — nothing to report to */ }
  }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) return;
    var type = event.data.type;
    if (type !== 'CYBERPULSE_INIT' && type !== 'CYBERMASTERY_INIT') return;
    try {
      if (event.data.username) {
        var c = $('tbCandidate');
        c.textContent = '👤 ' + String(event.data.username).slice(0, 24);
        c.classList.remove('hidden');
      }
      /* country, locale, topicId, batch are consumed; theme is always 'dark' — this file is dark-only by contract */
    } catch (e) { }
  });

  /* ---------------- boot ---------------- */
  function boot() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    buildShuffles();
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    renderIntro();
    showScreen('intro');
  }
  window.__CP_BOOT__ = boot;
})();
