<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1021 Remote Services — MEDIUM</title>
<style>
:root{
  --bg-page:#070c12;
  --bg-panel:#0d141d;
  --bg-surface:#111a26;
  --bg-surface-2:#0a111a;
  --bg-elev:#172335;
  --ink:#e9eff7;
  --ink-dim:#a9b9cb;
  --ink-faint:#8497ab;
  --line:#1f2b3c;
  --line-soft:#182331;
  --blue:#4aa8e8;   --blue-soft:rgba(74,168,232,.13);
  --amber:#e6aa3c;  --amber-soft:rgba(230,170,60,.13);
  --green:#41c07f;  --green-soft:rgba(65,192,127,.13);
  --red:#ef5a6a;    --red-soft:rgba(239,90,106,.15);
  --sev-easy:#41c07f;
  --sev-medium:#e6aa3c;
  --sev-hard:#f0813c;
  --sev-extreme:#ef5a6a;
  --focus:#4aa8e8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1 0 auto;width:100%;max-width:980px;margin:0 auto;padding:20px 16px 40px}
.foot{flex-shrink:0;margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:12.5px;background:var(--bg-panel)}
.foot b{color:var(--ink-dim);letter-spacing:.08em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-surface-2)}
::-webkit-scrollbar-thumb{background:#24344b;border-radius:6px;border:2px solid var(--bg-surface-2)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(8,13,20,.94);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.14em;font-size:12.5px;color:var(--green)}
.brand small{color:var(--ink-faint);letter-spacing:.05em;font-weight:600}
.tb-sep{width:1px;height:22px;background:var(--line)}
.tb-title{font-weight:700;font-size:13.5px;color:var(--ink-dim);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stat{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;font-weight:600;background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:32px}
.tb-stat .ic{font-size:13px}
.tb-stat.timer{font-family:var(--mono);color:var(--ink)}
.tb-state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px;border:1px solid}
.tb-state.manual{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.tb-state.autocheck{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.tb-btn:hover:not(:disabled){border-color:var(--blue)}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}
.tb-btn.hint{color:var(--amber)}
.tb-btn.skip{color:var(--ink-dim)}
.prog{height:3px;background:var(--line-soft)}
.prog i{display:block;height:100%;background:var(--green);width:0%;transition:width .25s}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 12px;color:#08110b}
.badge::before{content:"●";font-size:9px}
.sev-EASY{background:var(--sev-easy)}
.sev-MEDIUM{background:var(--sev-medium)}
.sev-HARD{background:var(--sev-hard)}
.sev-EXTREMELY_HARD{background:var(--sev-extreme);color:#160407}
.otype{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg-surface)}
/* ---------- intro ---------- */
.intro-head{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--bg-panel),var(--bg-surface-2));padding:26px 26px 20px;margin-bottom:16px}
.intro-head h1{margin:8px 0 4px;font-size:26px;line-height:1.25}
.intro-head .sub{color:var(--ink-dim);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-dim);background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:34px}
.chip .ic{color:var(--ink-faint)}
.cand{margin-top:12px;font-size:13px;color:var(--ink-faint)}
.intro-sec{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;background:var(--bg-panel);padding:18px 22px;margin-bottom:14px}
.intro-sec.learn{border-left-color:var(--blue)}
.intro-sec.keys{border-left-color:var(--amber)}
.intro-sec.how{border-left-color:var(--green)}
.intro-sec h2{margin:0 0 10px;font-size:15px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.intro-sec.learn p{color:var(--ink-dim);margin:0 0 10px}
.intro-sec.learn p:last-child{margin-bottom:0}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kw-card{background:var(--bg-surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 14px}
.kw-card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.kw-card ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:13.5px}
.kw-card li{margin:2px 0}
.rules{margin:0;padding:0;list-style:none}
.rules li{position:relative;padding:7px 0 7px 26px;color:var(--ink-dim);font-size:14px}
.rules li::before{content:"▸";position:absolute;left:4px;color:var(--green)}
.rules li .dim{color:var(--ink-faint)}
/* ---------- exercise card ---------- */
.excard{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--bg-panel);border:1px solid var(--line);border-left:4px solid var(--blk,var(--blue));border-radius:12px;padding:16px 20px}
.blk-scenario{--blk:var(--blue)}
.blk-question{--blk:var(--amber)}
.blk-answer{--blk:var(--green)}
.blk-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--blk,var(--ink));margin-bottom:10px}
.blk-label .dot{width:8px;height:8px;border-radius:50%;background:var(--blk,var(--ink))}
.ex-title{margin:0 0 8px;font-size:16.5px}
.summary{color:var(--ink-faint);font-size:13.5px;font-style:italic;margin:0 0 8px}
.showfull{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;min-height:32px}
.scen-body p{margin:0 0 10px;color:var(--ink-dim)}
.scen-body p:last-child{margin-bottom:0}
details.artef{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin:10px 0 0}
details.artef summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--blue);user-select:none;min-height:40px;display:flex;align-items:center}
details.artef .artbody{padding:0 14px 12px}
.mono{font-family:var(--mono);font-size:13px;line-height:1.5;color:#c8d8e6;background:var(--bg-surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:0}
table.attable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:0}
table.attable th{background:var(--bg-elev);color:var(--ink);text-align:left}
table.attable th,table.attable td{border:1px solid var(--line-soft);padding:6px 10px;color:var(--ink-dim)}
.q-text{margin:0;font-weight:700;font-size:16px;color:var(--ink)}
/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-height:44px;cursor:pointer;color:var(--ink);font-size:14.5px;font-family:var(--sans);margin:0 0 8px}
.opt:last-child{margin-bottom:0}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}
.opt .mark{font-weight:800;flex-shrink:0}
/* ---------- match ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol h4,.obank h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mleft{flex:1;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;min-height:44px;display:flex;align-items:center}
.mzone{flex:1;background:var(--bg-surface-2);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;min-height:44px;color:var(--ink-faint);font-size:13.5px;cursor:pointer;text-align:left;font-family:var(--sans)}
.mzone.filled{border-style:solid;border-color:var(--blue);color:var(--ink)}
.mzone.dragover{border-color:var(--green)}
.mzone.correct{border-color:var(--green);background:var(--green-soft)}
.mzone.wrong{border-color:var(--red);background:var(--red-soft)}
.mbank{display:flex;flex-direction:column}
.mchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;margin-bottom:8px;cursor:grab;color:var(--ink);font-size:13.5px;text-align:left;font-family:var(--sans)}
.mchip:disabled{cursor:default;opacity:.5}
.mchip.selchip{border-color:var(--amber);background:var(--amber-soft)}
.mchip.used{opacity:.35}
.mhintline{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- order ---------- */
.ordlist{list-style:none;margin:0;padding:0;counter-reset:ord}
.orditem{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.orditem.dragover{border-color:var(--green)}
.orditem .num{font-family:var(--mono);color:var(--amber);font-weight:700;min-width:22px;text-align:center}
.orditem .txt{flex:1;font-size:14px}
.orditem.correct{border-color:var(--green)}
.orditem.wrong{border-color:var(--red)}
.ordbtns{display:flex;gap:4px}
.ordbtns button{min-width:34px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);cursor:pointer;font-size:14px}
.ordbtns button:hover{border-color:var(--blue)}
/* ---------- fill ---------- */
.fillwrap{font-size:15.5px;color:var(--ink-dim);line-height:2.1;white-space:pre-wrap}
.fillin{font-family:var(--mono);font-size:13.5px;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 10px;min-height:38px;width:170px;margin:0 3px}
.fillin:focus{border-color:var(--blue);outline:none}
.fillin.correct{border-color:var(--green)}
.fillin.wrong{border-color:var(--red)}
.fbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:38px;font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer}
.fchip:hover{border-color:var(--amber)}
/* ---------- terminal ---------- */
.term{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:8px;background:var(--bg-elev);padding:8px 12px;font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.term-bar .dots{letter-spacing:3px;color:var(--red)}
.term-out{font-family:var(--mono);font-size:13px;line-height:1.55;color:#c8d8e6;padding:12px 14px;min-height:130px;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term-out .tl-dim{color:var(--ink-faint)}
.term-out .tl-danger{color:var(--red);font-weight:700}
.term-out .tl-echo{color:var(--ink)}
.term-line{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding:10px 14px}
.term-prompt{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--mono);font-size:13px;min-height:34px}
.term-in:focus{outline:none}
details.syntax{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin-top:10px}
details.syntax summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--amber);min-height:40px;display:flex;align-items:center}
details.syntax .artbody{padding:0 14px 12px}
/* ---------- logview ---------- */
.logpanel{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log-tools{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-elev);border-bottom:1px solid var(--line-soft)}
.logfilter{flex:1;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 12px;min-height:38px}
.logfilter:focus{border-color:var(--blue);outline:none}
.log-count{font-size:12px;color:var(--ink-faint);font-family:var(--mono);white-space:nowrap}
.loglines{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#bccfe0;padding:12px 14px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.loglines mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}
.wtitle{font-weight:700;margin:14px 0 10px;color:var(--ink)}
/* ---------- decision ---------- */
.dstep{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.dstep.locked{opacity:.9}
.dlabel{display:inline-flex;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue);border-radius:6px;padding:3px 9px;margin-bottom:8px}
.dprompt{font-family:var(--mono);font-size:13px;color:var(--ink-dim);background:var(--bg-surface-2);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 10px;white-space:pre-wrap}
.dq{font-weight:700;margin:0 0 10px}
.drecorded{color:var(--ink-faint);font-size:13px;margin-top:8px}
.dwhy{font-size:13.5px;color:var(--ink-dim);background:var(--bg-surface-2);border-radius:8px;padding:9px 12px;margin-top:8px}
/* ---------- hint ---------- */
.hintbox{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin-top:12px;color:var(--ink-dim)}
.hintbox .hb{color:var(--amber);font-weight:800;font-size:12px;letter-spacing:.1em;display:block;margin-bottom:4px}
.penaltynote{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- feedback ---------- */
.fb{border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.fb.ok{border-color:var(--green)}
.fb.bad{border-color:var(--red)}
.fb.part{border-color:var(--amber)}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 18px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb.ok .fb-head{background:var(--green-soft);color:var(--green)}
.fb.bad .fb-head{background:var(--red-soft);color:var(--red)}
.fb.part .fb-head{background:var(--amber-soft);color:var(--amber)}
.fb-credit{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim);font-weight:600}
.fb-body{padding:14px 18px;background:var(--bg-panel)}
.fi{display:flex;gap:9px;padding:4px 0;font-size:14px;color:var(--ink-dim)}
.fi .ic{flex-shrink:0;font-weight:800}
.fi.ok .ic{color:var(--green)}
.fi.bad .ic{color:var(--red)}
.fi.miss .ic{color:var(--ink-faint)}
.fi.warn .ic{color:var(--red)}
.fi.warn{color:var(--red);font-weight:600}
.fi.note{color:var(--ink-faint)}
.fb-explain{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:12px;color:var(--ink-dim);font-size:14px}
.fb-explain p{margin:0 0 10px}
.fb-explain p:last-child{margin-bottom:0}
.fb-study{margin-top:10px;font-size:13px;color:var(--blue)}
.fb .mono{margin-top:10px}
/* ---------- actions ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:10px 20px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-family:var(--sans)}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:transparent;color:#04120a}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-amber{background:var(--amber);border-color:transparent;color:#1c1204}
.ghost-note{color:var(--ink-faint);font-size:13px}
/* ---------- review ---------- */
.revlist{display:flex;flex-direction:column;gap:10px}
.revrow{display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex-wrap:wrap}
.revrow .rn{font-family:var(--mono);color:var(--amber);font-weight:700}
.revrow .rt{flex:1;color:var(--ink-dim);font-size:14px;min-width:200px}
.revrow .badge-skip{color:var(--ink-faint);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* ---------- results ---------- */
.res-head{border:1px solid var(--line);border-radius:14px;background:var(--bg-panel);padding:26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ring{width:172px;height:172px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--pct)*1%),var(--bg-elev) 0);display:grid;place-items:center;flex-shrink:0}
.ring .rin{width:134px;height:134px;border-radius:50%;background:var(--bg-panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:34px;font-weight:800;font-family:var(--mono)}
.ring .of{font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
.res-verdict{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.res-verdict.pass{color:var(--green)}
.res-verdict.fail{color:var(--red)}
.res-sub{color:var(--ink-dim);font-size:14px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.statcard{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.statcard .sv{font-size:22px;font-weight:800;font-family:var(--mono)}
.statcard .sv.ok{color:var(--green)}
.statcard .sv.part{color:var(--amber)}
.statcard .sv.bad{color:var(--red)}
.statcard .sv.skip{color:var(--ink-faint)}
.statcard .sl{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.pausereport{border:1px solid var(--line);border-radius:10px;background:var(--bg-panel);padding:12px 16px;color:var(--ink-dim);font-size:13.5px;margin-bottom:14px}
.restable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.restable th{background:var(--bg-elev);text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase}
.restable td{padding:8px 12px;border-top:1px solid var(--line-soft);color:var(--ink-dim)}
.restable td.num{font-family:var(--mono)}
.st-ok{color:var(--green);font-weight:700}
.st-part{color:var(--amber);font-weight:700}
.st-bad{color:var(--red);font-weight:700}
.st-skip{color:var(--ink-faint);font-weight:700}
/* ---------- overlay ---------- */

<script type="application/json" id="cm-exercise-meta">{"attackId":"T1021","attackName":"Remote Services","objectType":"technique","severity":"MEDIUM","topicId":"t1021","batch":2,"title":"T1021 Remote Services — MEDIUM","difficulty":"medium","estimatedMinutes":35,"timerMinutes":35,"questionCount":16,"passMark":70,"learn":["You will work with T1021 as a technique: the Remote Services family an adversary uses to log into other hosts with valid accounts and act as that user. This batch focuses on the telemetry those logons leave behind on Windows, Linux, the network and in the cloud.","You will learn the log sources a SOC analyst trusts: Windows Security 4624 with logon types 3 and 10, 4625 failures, TerminalServices-LocalSessionManager session events, Linux auth logs for SSH, firewall and flow records, and cloud sign-in logs such as Entra ID and CloudTrail.","Threat hunters pivot across these sources to find host-to-host sessions that break the baseline. Incident responders stitch them into a timeline. Detection engineers turn them into rules, and CTI analysts match them to what public reporting documents real intruders doing.","You will practise reading exports the way the daily job does: filter first, classify the logon type, then ask what ran after the logon. You will also see how admin shares and WinRM sessions differ from a plain file open, and how to keep a handover note clean.","The risk stays constant: remote services turn one credential into movement across the network. Good telemetry is how you catch that movement while it is still small, and good baselines are how you avoid chasing your own backup jobs."],"keywords":[{"theme":"Windows Telemetry","items":["Security 4624 logon types 3 and 10","Security 4625 failed logon","TerminalServices-LocalSessionManager 21/24/25","event 7045 service install","Sysmon event 3 network connection"]},{"theme":"Cross-Platform & Cloud Sources","items":["Linux auth.log Accepted and Failed sshd lines","firewall flow records","Entra ID sign-in logs","AWS CloudTrail ConsoleLogin","screensharingd and Apple Remote Desktop traces"]},{"theme":"Investigation Workflow","items":["filter before you classify","logon type before severity","correlate logon with process creation","baseline the service account","handover note discipline"]},{"theme":"Services In Scope","items":["SMB admin shares IPC$ and ADMIN$","WinRM PowerShell remoting","SSH publickey logons","cloud portal sign-ins","VNC screen sharing"]}]}</script>

ogin","screensharingd and Apple Remote Desktop traces"]},{"theme":"Investigation Workflow","items":["filter before you classify","logon type before severity","correlate logon with process creation","baseline the service account","handover note discipline"]},{"theme":"Services In Scope","items":["SMB admin shares IPC$ and ADMIN$","WinRM PowerShell remoting","SSH publickey logons","cloud portal sign-ins","VNC screen sharing"]}]};
var EXAMS = [{"id":"e01","type":"mcq","title":"Type 3 or type 10?","summary":"Distinguish network logons from remote desktop logons.","scenario":"Two alerts arrived one minute apart for DB-SQL02. Alert A says event 4624 logon type 3 for svc_report from APP-WEB05. Alert B says event 4624 logon type 10 for adm_l.oritz from IT-JMP01. The on-call runbook says to treat them differently, because one means 'a program connected with credentials' and the other means 'a person is now sitting at a remote desktop'. Your first triage note must name which is which and why severity differs.","question":"Which statement classifies the two alerts correctly?","hint":"Type 10 creates a session somebody can click in; type 3 does not.","explanation":"Type 3 is a network logon: credentials were used by a program across the network — a share mount, a database connection, a remote service call — with no clickable session. Type 10 is RemoteInteractive: a full desktop session, hands on keyboard. That is why alert B jumps the severity ladder: someone can now move files, run tools and reuse the session. Treating both as 'just logons' or both as 'sessions' mis-scores the incident.","study":"Study all Windows logon types and why severity rules key on type 10.","options":["A: remote desktop session by a person; B: network logon by a program","A: network logon by a program; B: remote desktop by a person","A and B: both remote sessions from trusted admin hosts","A and B: both network logons from service accounts"],"correct":1},{"id":"e02","type":"logview","title":"Classify the Security export","summary":"Separate failed logons, network logons and RDP logons.","scenario":"The nightly export from CORE-FS01 sits in the panel: a mix of successful and failed logons plus one type 10 surprise. The baseline says adm_l.oritz logs on remotely only from IT-JMP01, and svc_backup connects over the network from APP-WEB05 each night. The runbook asks you to name the failed-logon event id and the logon type of the 02:10 entry before escalating.","question":"Name the failed-logon event id and the logon type of the 02:10 entry:","hint":"One event id ends in 25; the 02:10 line says Type followed by one digit.","explanation":"4625 is the failed-logon event — two in a row often mean a mistyped password, or a password spray starting. The 02:10 entry is 4624 with logon type 10: a successful remote desktop logon from the sanctioned jump host, matching the baseline. 4624 without a type is meaningless for severity, 4634 is only a logoff, and type 3 belongs to the backup service rows.","study":"Study 4624/4625/4634 as a set and always read the logon type field.","filterable":true,"log":{"header":["time","event","detail"],"lines":["01:58:12  4624  Logon Type 3   user=svc_backup   src=APP-WEB05  host=CORE-FS01","02:03:40  4625  Failed logon   user=adm_l.oritz  src=IT-JMP01   host=CORE-FS01","02:03:41  4625  Failed logon   user=adm_l.oritz  src=IT-JMP01   host=CORE-FS01","02:10:09  4624  Logon Type 10  user=adm_l.oritz  src=IT-JMP01   host=CORE-FS01","02:10:10  4672  Special privileges assigned to adm_l.oritz","02:26:55  4634  Logoff         user=adm_l.oritz  logonid=0x4B2E1","03:15:02  4624  Logon Type 3   user=svc_backup   src=APP-WEB05  host=CORE-FS01"]},"widget":{"type":"fill","question":"Name the failed-logon event id and the logon type of the 02:10 entry:","text":"The failed logons are event ___, and the 02:10 entry carries logon type ___.","blanks":["4625","10"],"bank":["4625","10","4624","4634","3"]}},{"id":"e03","type":"fill","title":"Name the admin shares","summary":"Complete the SMB staging sentence.","scenario":"You are annotating a timeline where a tool appeared on a server before a service started. The responder's note stops mid-sentence because the share names are missing. SMB exposes hidden shares on every Windows host by default, and two of them matter for lateral movement: the one every connection touches first for inter-process communication, and the one that maps to the Windows folder for administrators. Fill both names exactly as tool output shows them.","question":"Complete the responder note with the two share names:","hint":"One share ends in a dollar sign after ADMIN, the other after IPC.","explanation":"ADMIN$ maps to the Windows folder and is where PsExec-style tools stage their binary; IPC$ is the share every SMB client touches first for named pipes such as the service control manager. C$ is the whole drive — sometimes used too, but the note describes the staging share, which is ADMIN$. NETLOGON and SYSVOL are domain shares for policy and scripts, not tool staging.","study":"Study hidden administrative shares and which named pipes service control uses.","text":"The service binary landed on the hidden share ___ and the remote service control calls rode the ___ share, both over SMB.","blanks":["ADMIN$","IPC$"],"bank":["ADMIN$","IPC$","C$","NETLOGON","SYSVOL"]},{"id":"e04","type":"terminal","title":"List SMB sessions on the file server","summary":"See which workstations hold sessions to the server.","scenario":"You are on CORE-FS01 through the console. Users complain the share is slow, and you want to know which machines currently hold SMB sessions before restarting the service. The lab shell knows the tools on the panel. List the sessions read-only: do not delete or disconnect anything, the ticket only asks for a picture of who is connected.","question":"Run the command that lists current SMB sessions on this server:","hint":"One word picks the topic, the second picks the view of connected clients.","explanation":"net session shows every SMB client session the server currently holds: machine, account, open files and idle time. That is the read-only picture the ticket asks for. Adding /delete would disconnect sessions — destructive and unnecessary. qwinsta would list remote desktop sessions instead, which is a different question about a different service.","study":"Study net session versus qwinsta: SMB sessions and RDP sessions are different views.","prompt":"admin@CORE-FS01>","skill":"smb-session-enum","knownTools":["net","qwinsta","quser","wevtutil","openfiles"],"expected":"net session","elements":[{"label":"the net command","any":["net"]},{"label":"the session subcommand","any":["session"]}],"forbidden":[{"any":["/delete"],"why":"/delete disconnects the listed sessions — it destroys the live state you were asked to capture."}],"output":["Computer                       User name      Client Type  Opens Idle time","-------------------------------------------------------------------------","\\\\APP-WEB05                     svc_backup                  3      12","\\\\ENG-WS204                     adm_l.oritz    NT            1       0","\\\\HR-WS112                      k.simmons                   7      31","The command completed successfully."]},{"id":"e05","type":"decision","title":"Decision tree — WinRM at 02:10","summary":"Three steps: verify, attribute, act proportionately.","scenario":"02:10 — the SOC channel pings: DB-SQL02 recorded a remote management session from IT-JMP01 under svc_patch, then a process named install-q3.ps1 appeared. The patch team is awake and says the quarter's window is open, but nobody remembers the script name. Work the three steps in order.","question":"Work through the three decision steps for the 02:10 session:","hint":"Each step has exactly one evidence-based answer; the destructive ones are decoys.","explanation":"Verification uses the logs that actually record remoting — WinRM-Operational and the 4688 process entry. Attribution leans on change management: a ticket plus a hash comparison is cheap and decisive. The final action keeps proportion: a hash mismatch during a live window is a process failure to fix, not a reason to drop a database mid-patch. Note how each decoy either destroys evidence or production uptime.","study":"Study WinRM telemetry sources and change-management checks for service accounts.","steps":[{"label":"STEP 1 OF 3 — verify the channel","prompt":"Alert: WinRM logon from IT-JMP01 to DB-SQL02 as svc_patch at 02:10; PowerShell started install-q3.ps1.","question":"Which evidence confirms this is a real remoting session?","options":["WinRM-Operational log plus 4624 with the matching 4688 process entry","A screenshot of the monitoring dashboard","Restarting DB-SQL02 to see if the alert repeats"],"correct":0,"why":"The WinRM-Operational log plus the 4688 process entry ties the session to a concrete command."},{"label":"STEP 2 OF 3 — attribute","prompt":"The session and the script are confirmed real.","question":"How do you attribute the activity before acting?","options":["Check the change ticket for svc_patch's window and compare the script hash with the package repo","Assume the patch team is right and close the alert","Disable svc_patch immediately for 24 hours"],"correct":0,"why":"The ticket and the script hash separate a sanctioned job from a borrowed service account without breaking the patch run."},{"label":"STEP 3 OF 3 — act","prompt":"The ticket covers tonight's window but the script hash does not match the repo.","question":"Which action fits best right now?","options":["Let the run finish, alert on the mismatch, and require a signed script for the next window","Unplug DB-SQL02 mid-patch","Delete the script and hope the job resumes"],"correct":0,"why":"The mismatch is real but low urgency: watching it finish while flagging the unsigned script keeps production safe and fixes the root cause."}]},{"id":"e06","type":"mcq","title":"Which log records the remoting script?","summary":"Pick the channel that shows script block activity.","scenario":"During the 02:10 review you must show what install-q3.ps1 actually did. One colleague points at the System log, another at the Application log. The detection engineer shakes her head and names the channel that records script blocks and remoting activity on both sides of the connection. She also mentions the companion channel that records the WinRM transport itself.","question":"Which channel records the remoting script's content?","hint":"The channel name starts with the interpreter's name, not the service's.","explanation":"PowerShell/Operational records script blocks (4104) and remoting activity — it shows what the script did, line by line. The WinRM transport lives in its own WinRM-Operational channel. System logs service starts, Application logs crashes, and Security logons say who connected but never what their script executed. Content beats context when you need to prove what ran.","study":"Study PowerShell Operational events 4103 and 4104 and the WinRM-Operational channel.","options":["System service control manager events","PowerShell Operational script-block logs","Application error and crash reports","Security account logon events and nothing else"],"correct":1},{"id":"e07","type":"match","title":"Match event id to meaning","summary":"Four Windows events every triage sheet needs.","scenario":"New analysts keep asking what each number in the triage sheet means. You build a matching card with the four ids that appear in nearly every remote-services case: the successful logon, the failed logon, the special-privilege assignment and the new service installation. The card goes on the wall next to the logon-type table.","question":"Match each event id to its meaning:","hint":"The service-install event sits in the 70xx range.","explanation":"4624 says a logon succeeded, 4625 says credentials were rejected, 4672 flags admin-equivalent rights at logon, and 7045 says something installed a service — the classic artefact when tools ride admin shares. Knowing these four by heart turns a wall of numbers into a story within seconds.","study":"Study the Windows Security shortlist for lateral movement: 4624, 4625, 4672, 4688, 7045.","pairs":[{"left":"4624","right":"Successful account logon"},{"left":"4625","right":"Failed account logon"},{"left":"4672","right":"Special privileges assigned at logon"},{"left":"7045","right":"A new service was installed"}]},{"id":"e08","type":"fill","title":"Name the cloud log sources","summary":"Where cloud portal sign-ins and API calls land.","scenario":"The family includes cloud consoles: an adversary with a valid account can sign into a SaaS or IaaS portal and reach workloads from there. Your team keeps forgetting which tenant log holds the interactive sign-ins and which AWS service records the API trail. Complete the sentence so the next on-call can find both without asking in the channel.","question":"Complete the cloud telemetry sentence:","hint":"The AWS service name rhymes with the trail it follows.","explanation":"Entra ID (Azure AD) sign-in logs record interactive portal authentication, including unfamiliar geography and MFA details; CloudTrail records AWS API calls such as ConsoleLogin, AssumeRole or RunInstances. 'Audit' is the generic word juniors guess, but the product name is CloudTrail. Together the two sources prove the cloud half of the T1021 family.","study":"Study Entra ID sign-in logs and CloudTrail event names for console and role activity.","text":"Interactive portal sign-ins appear in the Entra ID ___ logs, while AWS API activity, including ConsoleLogin events, is recorded in ___.","blanks":["sign-in","CloudTrail"],"bank":["sign-in","CloudTrail","audit","S3","firehose"]},{"id":"e09","type":"multi","title":"What proves hands on keyboard?","summary":"Select the events that show an interactive remote session.","scenario":"The incident commander asks a blunt question: do we have proof somebody was interactively inside the host, or only that credentials were used over the network? Four telemetry rows are on the board. Pick every row that supports an interactive remote session; leave out the rows that only prove a program connected or that a session ended.","question":"Select every row that proves an interactive remote session:","hint":"A network flow and a logoff both happen without a person present.","explanation":"Type 10 plus LocalSessionManager 21 are the interactive pair: one says the logon was RemoteInteractive, the other says a remote session connected on the host. Sysmon event 3 to 445 is only a network connection — programs do that constantly — and 4634 just closes a session. When the commander asks for hands-on-keyboard proof, answer with the interactive pair, not with flows.","study":"Study which events prove interactivity and which only prove connectivity.","options":["4624 with logon type 10 for the account","LocalSessionManager event 21 naming the session","Sysmon event 3 to TCP 445 from the same host","4634 logoff closing the account's session"],"correct":[0,1]},{"id":"e10","type":"logview","title":"SSH trail on the build runner","summary":"Find which source host failed, then succeeded, on SSH.","scenario":"The Linux build runner GIT-BUILD03 exported its authentication log during a credential-reuse investigation. The baseline: deploy accounts connect from GIT-LB01; root never logs in over SSH; no brute-force protection is installed. Read the trail in order: one source host fails repeatedly with passwords, then the same host gets in with a key, then a session opens. Name that source host for the timeline.","question":"Which source host failed four times and then logged in as root?","hint":"Filter for 'Failed password' first, then read the Accepted lines in order.","explanation":"The 10[.]44[.]9[.]7 host burns four password attempts on root, then returns minutes later and gets in with a publickey — password brute force failed, key reuse succeeded. GIT-LB01 only hosts the legitimate svc_ci logon. Root over SSH breaks the baseline on its own, and the disconnect line shows a short, scripted visit rather than an admin's session.","study":"Study Linux auth.log structure: Failed password, Accepted publickey, and session bookkeeping.","filterable":true,"log":{"header":["time","process","message"],"lines":["08:02:11  sshd[3101]: Failed password for root from 10[.]44[.]9[.]7 port 51022 ssh2","08:02:14  sshd[3101]: Failed password for root from 10[.]44[.]9[.]7 port 51022 ssh2","08:02:19  sshd[3102]: Failed password for root from 10[.]44[.]9[.]7 port 51024 ssh2","08:02:24  sshd[3102]: Failed password for root from 10[.]44[.]9[.]7 port 51024 ssh2","08:02:31  sshd[3103]: Accepted publickey for svc_ci from GIT-LB01 port 44912 ssh2","08:04:02  sshd[3110]: Accepted publickey for root from 10[.]44[.]9[.]7 port 51031 ssh2","08:04:03  systemd: Started Session 88 of user root.","08:04:40  sshd[3110]: Received disconnect from 10[.]44[.]9[.]7 port 51031"]},"widget":{"type":"mcq","question":"Which source host failed four times and then logged in as root?","options":["10[.]44[.]9[.]7 — the reconnaissance build host","GIT-LB01 — the sanctioned load balancer","DB-SQL02 — the database server","No host matches the pattern"],"correct":0}},{"id":"e11","type":"terminal","title":"Grep the failed SSH attempts","summary":"Pull only the failed-password lines from the auth log.","scenario":"You are on GIT-BUILD03's rescue shell. The manager wants just the failed password attempts from the auth log, nothing else, to paste into the timeline. The lab shell knows the usual Linux text tools. Match the exact phrase the SSH daemon writes for password failures and point at the standard auth log file. Do not modify the log.","question":"Run the command that prints the failed SSH password lines:","hint":"The daemon literally writes 'Failed password'; give grep that phrase and the file.","explanation":"grep 'Failed password' /var/log/auth.log prints exactly the failure lines — the fastest read-only answer for the timeline. journalctl -u ssh would also work on systemd hosts, but the file path was specified. Piping into anything that rewrites the file, or using shred, destroys evidence and is never part of triage.","study":"Study grep basics and the standard Linux auth log paths across distributions.","prompt":"rescue@GIT-BUILD03:~$","skill":"linux-ssh-log-triage","knownTools":["grep","awk","tail","head","journalctl"],"expected":"grep 'Failed password' /var/log/auth.log","elements":[{"label":"the grep filter","any":["grep"]},{"label":"the failed-password phrase","any":["failed password"]},{"label":"the auth log path","any":["/var/log/auth.log"]}],"forbidden":[{"any":["> /var/log/auth.log","shred","rm -f /var/log"],"why":"Those rewrite or destroy the auth log — the primary evidence on this host."}],"output":["08:02:11 sshd[3101]: Failed password for root from 10[.]44[.]9[.]7 port 51022 ssh2","08:02:14 sshd[3101]: Failed password for root from 10[.]44[.]9[.]7 port 51022 ssh2","08:02:19 sshd[3102]: Failed password for root from 10[.]44[.]9[.]7 port 51024 ssh2","08:02:24 sshd[3102]: Failed password for root from 10[.]44[.]9[.]7 port 51024 ssh2","4 matching lines"]},{"id":"e12","type":"order","title":"Order the triage workflow","summary":"From first filter to tuned rule, in order.","scenario":"The team agrees on a five-step order for every remote-logon alert, so handovers stop losing context. The steps on the cards: classify by logon type, confirm with a second source, check what ran afterwards, decide containment proportionate to proof, and file the tuning note so the rule improves. The runbook is strict about the order, even where two steps look swappable.","question":"Arrange the five triage steps in runbook order:","hint":"You confirm before you collect consequences, and you tune after you act.","explanation":"Classification first keeps severity honest; a type 3 and a type 10 deserve different lanes. A second source (LocalSessionManager or WinRM-Operational) confirms the first. Only then does post-logon activity matter, because context without classification misleads. Containment follows evidence, and the tuning note closes the loop so tomorrow's shift inherits a better rule. Swapping confirm and review is the common error.","study":"Study alert-triage runbooks and why ordering beats memory during incidents.","items":["Classify the 4624 logon type before anything else","Confirm the session with a second log source","Review process and service activity after the logon","Contain only as far as the evidence supports","File the tuning note for the detection that fired"]},{"id":"e13","type":"decision","title":"Decision tree — portal sign-in at 03:04","summary":"Cloud portal access with a valid account: verify, scope, act.","scenario":"03:04 — Entra ID sign-in logs show adm_cloud_ops authenticated to the admin portal from a new country, and CloudTrail shows one new access key created ten minutes later. MFA succeeded. The user is on holiday. Signals conflict: strong authentication, unfamiliar geography, a sensitive change. Work the three steps.","question":"Work through the three decision steps for the cloud portal access:","hint":"MFA success does not equal the real user; scoping decides the action size.","explanation":"Verification compares the session's device and network fingerprints with history — stolen session tokens pass MFA because they skip it. Scoping walks every resource the identity touched, since one key is rarely the whole intrusion. The action matches proof: sessions revoked and account disabled, because a stolen token survives password resets. This is the T1021.007 cloud-services path in practice.","study":"Study session-token theft, Entra ID sign-in properties and CloudTrail forensics.","steps":[{"label":"STEP 1 OF 3 — verify","prompt":"Sign-in succeeded with MFA from an unfamiliar geography; a key was created at 03:14.","question":"What confirms or refutes an adversary at the console?","options":["Compare the session's IP and device id with the user's registered devices and usual sign-ins","Ask the user to change their password and move on","Delete the new access key immediately"],"correct":0,"why":"Device and IP history separate token theft from an unfamiliar but genuine login."},{"label":"STEP 2 OF 3 — scope","prompt":"The device id is unknown; the sign-in came through a legacy mail-flow token path.","question":"What else might the token have reached?","options":["Enumerate resources the role and account touched in the last 24 hours across the tenant","Only check the one key that was created","Assume nothing else changed because MFA held"],"correct":0,"why":"A valid token may have walked other doors; scoping beats single-artefact thinking."},{"label":"STEP 3 OF 3 — act","prompt":"Scope shows the new key plus read access to two storage accounts. The user cannot be reached.","question":"Which action fits the evidence?","options":["Revoke sessions and tokens, disable the account, remove the key, then start the IR bridge","Wait for the user to return from holiday","Only reset the password and keep the key"],"correct":0,"why":"Confirmed account compromise in a cloud control plane demands token revocation, not a password-only reset."}]},{"id":"e14","type":"fill","title":"Complete the screen-sharing note","summary":"VNC port and the macOS remote-management service.","scenario":"A designer's macOS workstation shows a screensharingd process active at an odd hour, and the Mac is enrolled in the company's device-management programme, which enables remote management for the support desk. The note you write must name the classic VNC port and the Apple service that blends VNC-style screen control with SSH for file transfer. Public reporting has documented adversaries abusing exactly this blend on macOS.","question":"Complete the note with the port and the Apple service:","hint":"The Apple service's name is three words; vendor guides abbreviate it to three letters.","explanation":"VNC-compatible viewers speak to TCP 5900, and Apple Remote Desktop (ARD) is the native macOS stack that mixes VNC-style screen control with SSH file transfer — the ATT&CK T1021 page names ARD as a legitimate application that leverages the family. ScreenFlow and TeamViewer are different products, 3389 is RDP, and plain RDP does not run on macOS servers.","study":"Study Apple Remote Desktop components: screensharingd, kickstart, and the VNC port.","text":"VNC-compatible viewers reach the Mac on TCP ___, while Apple's native remote-management stack, ___, uses that protocol for the screen and SSH for file transfer.","blanks":["5900","Apple Remote Desktop"],"bank":["5900","Apple Remote Desktop","ScreenFlow","3389","RDP","TeamViewer"]},{"id":"e15","type":"match","title":"Match source to what it proves","summary":"Four telemetry sources and their exact meaning.","scenario":"A junior asks why the team keeps four different sources when they all 'just show connections'. You build the match card that ends the argument: each source answers a different question, and only together do they prove a remote-services chain. The card pairs each source with the one statement it actually supports, worded so nobody can stretch a source past its meaning.","question":"Match each source to the statement it supports:","hint":"Two sources are Windows, one is Linux, one is cloud — each statement is deliberately narrow.","explanation":"The 4624 row proves the logon type but not the session lifecycle; LocalSessionManager 24 proves a disconnect happened on the host; auth.log proves a key-based SSH logon; Entra sign-in logs prove portal authentication in the tenant. Stretching any single source past its statement is how wrong timelines start. Match the narrow statement, then chain sources for the full story.","study":"Study each source's exact guarantee before chaining them in a timeline.","pairs":[{"left":"Security 4624 type 10","right":"A remote desktop logon succeeded"},{"left":"LocalSessionManager 24","right":"An RDP session disconnected on the host"},{"left":"auth.log Accepted publickey","right":"A key-based SSH logon succeeded"},{"left":"Entra ID sign-in logs","right":"A cloud portal authentication succeeded"}]},{"id":"e16","type":"mcq","title":"The nightly 02:00 RDP that scares juniors","summary":"A scheduled remote logon that matches the baseline — what now?","scenario":"Every night at 02:00, svc_backup logs into CORE-FS01 over remote desktop from the backup server APP-WEB05, runs a pre-backup check, and logs off within four minutes. A new analyst raises a P2: 'service account using RDP at night'. The baseline document — written eight months ago — explicitly lists this exact session as known-good. Nothing else changed: same source, same window, same duration, no new processes.","question":"What is the proportionate handling of this alert?","hint":"The baseline is evidence; the question is whether anything left it.","explanation":"This is the benign-looks-alarming case: service-account RDP at night looks scary but matches a documented baseline in every observable detail. The proportionate action closes it as known-good while keeping the rule that fires only on deviation — new source, new time, new process. Isolation and mid-window password resets would break the backup for no gain, and the blanket 'never' claim is false for many environments.","study":"Study baseline documentation and deviation-based rules instead of blanket bans.","options":["Close as known-good; alert only if the pattern changes","Isolate CORE-FS01 until the backup team explains the session","Reset the service account password mid-backup","Raise a P1 because service accounts must never use RDP"],"correct":0}];

/* ==== utils ==== */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function norm(s){
  return String(s == null ? "" : s).toLowerCase().replace(/\s+/g," ").replace(/[.,;:!]+$/,"").trim();
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function fmt1(n){ return (Math.round(n * 100) / 100).toFixed(1); }
function wordCount(s){ return String(s || "").split(/\s+/).filter(Boolean).length; }
function $(id){ return document.getElementById(id); }
function byClass(root, cls){ return root.getElementsByClassName(cls); }

/* ==== timer ==== */
function setTimerState(next){
  var now = Date.now();
  if(S.tStateAt != null){
    var dt = (now - S.tStateAt) / 1000;
    if(S.tState === "PAUSED_MANUAL") S.pauseManual += dt;
    if(S.tState === "PAUSED_AUTO_CHECK") S.pauseAutoCheck += dt;
  }
  S.tState = next;
  S.tStateAt = now;
  updateHeader();
}
setInterval(function(){
  if(S.tState === "RUNNING"){
    S.remaining -= 1;
    S.elapsed += 1;
    if(S.remaining <= 0){
      S.remaining = 0;
      updateClock();
      finish();
      return;
    }
    updateClock();
  }
}, 1000);
function updateClock(){ var c = $("tb-clock"); if(c) c.textContent = fmtClock(S.remaining); }

function sevClass(){ return "sev-" + META.severity; }
function curPos(){ return S.order[S.idx]; }
function answeredCount(){
  var n = 0;

}

      : ((S.phase === "review") ? ("Review pool: " + pendingSkips().length)
      : ("Exercise " + (S.idx + 1) + " / " + total));
  } else {
    counter.textContent = "Exercises " + done + " / " + total;

  sev.textContent = META.severity.replace("_", " ");

  $("btn-skip").disabled = !inExercise || S.checked[ex] != null || S.phase === "review";
  $("btn-pause").disabled = !(S.tState === "RUNNING" || S.tState === "PAUSED_AUTO_CHECK");
}

/* ==== postMessage integration ==== */
window.addEventListener("message", function(ev){
  var d = ev.data;
  if(!d || typeof d !== "object") return;
  if(d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT"){
    S.init = d;
    var slot = $("candline");
    if(slot && d.username){
      slot.textContent = "Candidate: " + d.username + (d.country ? " · " + d.country : "");
      slot.style.display = "block";
    }
  }
});
function postScore(){
  if(S.scorePosted) return;
  S.scorePosted = true;
  var rounded = Math.round(S.score);
  var total = 0, i;
  for(i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null) total++;
  }
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var msg = {
    type: "CYBERPULSE_SCORE",
    topicId: META.topicId,
    batch: META.batch,
    score: rounded,
    total: total,
    percent: percent,
    passed: passed
  };
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage(msg, location.origin);
    }
  }catch(e){ /* standalone file:// — no parent handshake */ }
}

/* ==== answer defaults ==== */
function defaultAnswer(ex){
  var i, d;
  switch(ex.type){
    case "mcq": return { sel: -1 };
    case "multi": return { sel: [] };
    case "match":
      d = []; for(i = 0; i < ex.pairs.length; i++) d.push(-1); return { assign: d };
    case "order":
      d = []; for(i = 0; i < ex.items.length; i++) d.push(i);
      return { seq: shuffle(d) };
    case "fill":
      d = []; for(i = 0; i < ex.blanks.length; i++) d.push(""); return { vals: d };
    case "terminal": return { cmd: "" };
    case "logview": return { w: defaultAnswer(ex.widget) };
    case "decision":
      d = []; for(i = 0; i < ex.steps.length; i++) d.push(-1); return { steps: d, cursor: 0 };
  }
  return {};
}
function ensureAnswer(ex, i){
  if(S.answers[i] == null) S.answers[i] = defaultAnswer(ex);
  return S.answers[i];
}

function scenInner(ex){
  var out = "";
  var paras = String(ex.scenario).split(/\n\n+/);
  for(var p = 0; p < paras.length; p++) out += "<p>" + esc(paras[p]) + "</p>";
  if(ex.artefacts && ex.artefacts.length){
    for(var a = 0; a < ex.artefacts.length; a++){
      var art = ex.artefacts[a];
      var long = String(art.content || "").split("\n").length > 25;
      out += '<details class="artef"' + (long ? "" : " open") + '><summary>' + esc(art.label) + '</summary><div class="artbody">' + artefactBody(art) + "</div></details>";
    }
  }
  return out;
}
function artefactBody(art){
  if(art.kind === "table"){
    var rows = String(art.content).split("\n");
    var out = '<table class="attable">';
    for(var r = 0; r < rows.length; r++){
      var cells = rows[r].split(" | ");
      out += "<tr>";
      for(var c = 0; c < cells.length; c++){
        out += (r === 0 ? "<th>" : "<td>") + esc(cells[c]) + (r === 0 ? "</th>" : "</td>");
      }
      out += "</tr>";
    }
    return out + "</table>";
  }
  return '<pre class="mono">' + esc(art.content) + "</pre>";
}
function hintHTML(ex){
  return '<div class="hintbox" role="note"><span class="hb">💡 HINT</span>' + esc(ex.hint) +
         '<div class="penaltynote">Hint used — 10% credit penalty applies to this exercise.</div></div>';
}

/* ==== type renderers ==== */
function optionRow(text, idx, chosen, mark, cls){
  return '<button type="button" class="opt ' + (cls || "") + '" data-i="' + idx + '" aria-pressed="' + (chosen ? "true" : "false") + '">' +
    '<span class="mark" aria-hidden="true">' + (mark || "") + "</span><span>" + esc(text) + "</span></button>";
}
function renderByType(ex, area, i, lock, res){
  area.innerHTML = "";
  var ans = ensureAnswer(ex, i);
  var w = document.createElement("div");
  switch(ex.type){
    case "mcq":      renderChoice(ex, w, ans, lock, res, false, ""); break;
    case "multi":    renderChoice(ex, w, ans, lock, res, true, ""); break;
    case "match":    renderMatch(ex, w, ans, lock, res); break;
    case "order":    renderOrder(ex, w, ans, lock, res); break;
    case "fill":     renderFill(ex, w, ans, lock, res, null, ""); break;
    case "terminal": renderTerminal(ex, w, ans, lock, res); break;
    case "logview":  renderLogview(ex, w, ans, lock, res); break;
    case "decision": renderDecision(ex, w, ans, lock, res); break;
  }
  area.appendChild(w);
}
function renderChoice(ex, root, ans, lock, res, isMulti, path){
  var correct = isMulti ? ex.correct : [ex.correct];
  ex.options.forEach(function(opt, oi){
    var chosen = isMulti ? ans.sel.indexOf(oi) !== -1 : ans.sel === oi;
    var mark = "", cls = "";
    if(!lock){
      if(chosen){ mark = isMulti ? "☑" : "◉"; cls = "sel"; }
    } else {
      var isCorr = correct.indexOf(oi) !== -1;
      if(isCorr){ mark = "✓"; cls = "correct"; }
      else if(chosen){ mark = "✗"; cls = "wrong"; }
      else { cls = "dim"; }
    }
    root.insertAdjacentHTML("beforeend", optionRow(opt, oi, chosen, mark, cls));
  });
  var btns = byClass(root, "opt");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      btn.addEventListener("click", function(){
        if(lock) return;
        var oi = parseInt(btn.getAttribute("data-i"), 10);
        if(isMulti){
          var p = ans.sel.indexOf(oi);
          if(p === -1) ans.sel.push(oi); else ans.sel.splice(p, 1);
          btn.classList.toggle("sel");
          btn.setAttribute("aria-pressed", btn.classList.contains("sel") ? "true" : "false");
          btn.querySelector(".mark").textContent = btn.classList.contains("sel") ? "☑" : "";
        } else {
          ans.sel = oi;
          for(var z = 0; z < btns.length; z++){
            btns[z].classList.remove("sel");
            btns[z].setAttribute("aria-pressed", "false");
            var mk = btns[z].querySelector(".mark"); if(mk) mk.textContent = "";
          }
          btn.classList.add("sel");
          btn.setAttribute("aria-pressed", "true");
          btn.querySelector(".mark").textContent = "◉";
        }
      });
    })(btns[b]);
  }
}
function renderMatch(ex, root, ans, lock, res){
  var n = ex.pairs.length;
  var chipSel = -1;
  var html = '<div class="mgrid"><div class="mcol"><h4>Items</h4>';
  for(var z = 0; z < n; z++){
    html += '<div class="mrow"><div class="mleft">' + esc(ex.pairs[z].left) + '</div>' +
            '<button type="button" class="mzone" data-z="' + z + '" aria-label="Assigned value for ' + esc(ex.pairs[z].left) + '">— drop here —</button></div>';
  }
  html += '</div><div class="mbank"><h4>Answer bank</h4>';
  ex.pairs.forEach(function(pr, ri){

/* ==== grading ==== */
function gradeFillLike(text, blanks, vals){
  var items = [], H = 0, W = 0, N = blanks.length;
  for(var k = 0; k < N; k++){
    var v = norm(vals[k]);
    var ok = v !== "" && v === norm(blanks[k]);
    items.push({ ok: ok, state: v === "" ? "miss" : (ok ? "ok" : "bad"),
      text: v === "" ? ('Blank ' + (k + 1) + ' — missed. Correct: "' + blanks[k] + '"')
        : (ok ? ('Blank ' + (k + 1) + ' — correct: "' + blanks[k] + '"')
        : ('Blank ' + (k + 1) + ' — "' + vals[k] + '" is wrong. Correct: "' + blanks[k] + '"')) });
    if(ok) H++; else if(v !== "") W++;
  }
  return { H: H, W: W, N: N, items: items };
}
function gradeChoiceLike(options, correct, sel, isMulti){
  var items = [], H = 0, W = 0, N = correct.length;
  var selArr = isMulti ? (sel || []) : (sel === -1 ? [] : [sel]);
  for(var c = 0; c < correct.length; c++){
    var ci = correct[c];
    if(selArr.indexOf(ci) !== -1){ items.push({ ok: true, state: "ok", text: "✓ You selected the correct option: " + options[ci] }); H++; }
    else items.push({ ok: false, state: "miss", text: "Missed the correct option: " + options[ci] });
  }
  for(var s = 0; s < selArr.length; s++){
    var si = selArr[s];
    if(correct.indexOf(si) === -1){
      items.push({ ok: false, state: "bad", text: "Wrong selection: " + options[si] });
      W++;
    }
  }
  return { H: H, W: W, N: N, items: items };
}
function grade(ex, ans, hintUsed){
  var g, i;
  switch(ex.type){
    case "mcq":
      g = gradeChoiceLike(ex.options, [ex.correct], ans.sel, false);
      break;
    case "multi":
      g = gradeChoiceLike(ex.options, ex.correct, ans.sel, true);
      break;
    case "match":
      g = { H: 0, W: 0, N: ex.pairs.length, items: [] };
      for(i = 0; i < ex.pairs.length; i++){
        var a = ans.assign[i];
        if(a === -1){ g.items.push({ state: "miss", text: 'Missed: "' + ex.pairs[i].left + '" → correct partner: "' + ex.pairs[i].right + '"' }); }
        else if(a === i){ g.H++; g.items.push({ state: "ok", text: '✓ "' + ex.pairs[i].left + '" → "' + ex.pairs[i].right + '"' }); }
        else { g.W++; g.items.push({ state: "bad", text: 'Wrong: "' + ex.pairs[i].left + '" → you placed "' + ex.pairs[a].right + '", correct: "' + ex.pairs[i].right + '"' }); }
      }
      break;
    case "order":
      g = { H: 0, W: 0, N: ex.items.length, items: [] };
      for(i = 0; i < ex.items.length; i++){
        if(ans.seq[i] === i){ g.H++; g.items.push({ state: "ok", text: "Position " + (i + 1) + " — correct: " + ex.items[i] }); }
        else { g.W++; g.items.push({ state: "bad", text: "Position " + (i + 1) + " — you placed \"" + ex.items[ans.seq[i]] + '", correct: "' + ex.items[i] + '"' }); }
      }
      break;
    case "fill":
      g = gradeFillLike(ex.text, ex.blanks, ans.vals);
      break;
    case "terminal": {
      var cmd = String(ans.cmd || "");
      g = { H: 0, W: 0, N: ex.elements.length, items: [], warn: [], canon: null };
      var low = cmd.toLowerCase();
      if(!cmd){
        g.items.push({ state: "miss", text: "No command was run — nothing to grade." });
      } else {
        for(i = 0; i < ex.elements.length; i++){
          var el = ex.elements[i];
          var hit = false;
          for(var v = 0; v < el.any.length; v++){
            if(low.indexOf(String(el.any[v]).toLowerCase()) !== -1){ hit = true; break; }
          }
          if(hit){ g.H++; g.items.push({ state: "ok", text: "✓ Element matched: " + el.label }); }
          else g.items.push({ state: "miss", text: "Missing element: " + el.label });
        }
        (ex.forbidden || []).forEach(function(f){
          for(var v2 = 0; v2 < f.any.length; v2++){
            if(low.indexOf(String(f.any[v2]).toLowerCase()) !== -1){
              g.warn.push("⚠ DANGEROUS — NEAR MISS: " + f.why);
              break;
            }
          }
        });
      }
      if(g.H < g.N) g.canon = ex.expected;
      break;
    }
    case "logview": {
      var wg;
      if(ex.widget.type === "fill") wg = gradeFillLike(ex.widget.text, ex.widget.blanks, ans.w.vals);
      else if(ex.widget.type === "multi") wg = gradeChoiceLike(ex.widget.options, ex.widget.correct, ans.w.sel, true);
      else wg = gradeChoiceLike(ex.widget.options, [ex.widget.correct], ans.w.sel, false);
      g = { H: wg.H, W: wg.W, N: wg.N, items: wg.items.map(function(it){ return it; }) };
      break;
    }
    case "decision":
      g = { H: 0, W: 0, N: ex.steps.length, items: [] };
      for(i = 0; i < ex.steps.length; i++){
        var st = ex.steps[i];
        if(ans.steps[i] === st.correct){ g.H++; g.items.push({ state: "ok", text: (st.label || "Step " + (i + 1)) + " — correct: " + st.options[st.correct] }); }
        else if(ans.steps[i] === -1){ g.items.push({ state: "miss", text: (st.label || "Step " + (i + 1)) + " — not confirmed. Correct: " + st.options[st.correct] }); }
        else { g.W++; g.items.push({ state: "bad", text: (st.label || "Step " + (i + 1)) + " — wrong. Correct: " + st.options[st.correct] + ". " + st.why }); }
      }
      break;
    default:
      g = { H: 0, W: 0, N: 1, items: [] };
  }
  var raw = g.N > 0 ? Math.max(0, (g.H - g.W) / g.N) : 0;
  var penalty = hintUsed ? 0.10 : 0;
  var credit = Math.max(0, raw - penalty);
  var head = raw >= 0.999 ? "ok" : (raw <= 0.001 ? "bad" : "part");
  var headText = head === "ok" ? "✓ Correct" : (head === "bad" ? "✗ Incorrect" : "✓ Partially correct");
  var res = {
    credit: credit, raw: raw, head: head, headText: headText,
    H: g.H, W: g.W, N: g.N,
    items: g.items || [], warn: g.warn || [], canon: g.canon || null,
    itemsByKey: {}
  };
  if(ex.type === "fill"){
    for(var k1 = 0; k1 < (g.items || []).length; k1++) res.itemsByKey["b" + k1] = g.items[k1].state;
  } else if(ex.type === "logview" && ex.widget.type === "fill"){
    for(var k2 = 0; k2 < (g.items || []).length; k2++) res.itemsByKey["wb" + k2] = g.items[k2].state;
  }
  return res;
}

/* ==== check / feedback ==== */
function onCheck(){
  var i = curPos();
  var ex = EXAMS[i];
  if(S.checked[i] != null) return;
  if(S.tState === "RUNNING") setTimerState("PAUSED_AUTO_CHECK");
  var res = grade(ex, ensureAnswer(ex, i), S.hintsUsed[i] === true);
  res.wres = null;
  if(ex.type === "logview"){
    res.wres = { items: res.items, H: res.H, W: res.W, N: res.N };
  }
  S.checked[i] = res;
  S.score += res.credit;
  renderExercise();
}
function renderFeedback(i, res){
  var ex = EXAMS[i];
  var rows = "";
  res.items.forEach(function(it){
    var ic = it.state === "ok" ? "✓" : (it.state === "bad" ? "✗" : "○");
    rows += '<div class="fi ' + it.state + '"><span class="ic" aria-hidden="true">' + ic + '</span><span>' + esc(String(it.text).replace(/^[✓✗○]\s*/, "")) + "</span></div>";
  });
  (res.warn || []).forEach(function(wn){
    rows += '<div class="fi warn"><span class="ic" aria-hidden="true">⚠</span><span>' + esc(wn) + "</span></div>";
  });
  if(S.hintsUsed[i]) rows += '<div class="fi note"><span class="ic" aria-hidden="true">💡</span><span>Hint used on this exercise — credit reduced by 0.10.</span></div>';
  var explain = String(ex.explanation).split(/\n\n+/).map(function(p){ return "<p>" + esc(p) + "</p>"; }).join("");
  var canon = res.canon ? '<div class="mono" role="figure" aria-label="Canonical command">canonical: ' + esc(res.canon) + "</div>" : "";
  $("fbslot").innerHTML = '<div class="fb ' + res.head + '" role="status">' +
    '<div class="fb-head"><span aria-hidden="true">' + (res.head === "ok" ? "✓" : res.head === "bad" ? "✗" : "✓") + "</span><span>" + esc(res.headText.replace(/^[✓✗]\s*/, "")) + '</span><span class="fb-credit">credit ' + res.credit.toFixed(2) + " / 1.00" +
    (res.N > 1 ? " (" + res.H + "✓ " + res.W + "✗ " + (res.N - res.H - res.W) + "○ of " + res.N + ")" : "") + "</span></div>" +
    '<div class="fb-body">' + rows + canon +
    '<div class="fb-explain">' + explain + '<div class="fb-study">📚 ' + esc(ex.study) + "</div></div>" +
    "</div></div>";
  $("btn-check").disabled = true;
  $("btn-check").textContent = "✓ Checked";
  var nb = $("btn-next");
  nb.disabled = false;
  nb.focus();
  var lastMain = S.phase === "main" && S.idx === S.order.length - 1;
  nb.innerHTML = S.phase === "review" ? "Back to review list" : (lastMain ? "Final submit &amp; results" : "Next exercise");
  $("actnote").textContent = "";
  updateHeader();
}

/* ==== flow ==== */
function startExam(){
  S.order = shuffle(EXAMS.map(function(_, i){ return i; }));
  S.idx = 0;
  S.phase = "main";
  setTimerState("RUNNING");
  renderExercise();
}
function onCheckGuard(){ /* reserved */ }
function onNext(){
  if(S.phase === "review"){
    if(S.tState === "PAUSED_AUTO_CHECK") setTimerState("RUNNING");
    showReview();
    return;
  }
  if(S.tState === "PAUSED_AUTO_CHECK") setTimerState("RUNNING");
  if(S.idx < S.order.length - 1){
    S.idx++;
    renderExercise();
  } else {
    if(pendingSkips().length > 0) showReview();
    else finish();
  }
}
function onSkip(){
  if(S.phase === "review") return;
  var i = curPos();
  if(S.checked[i] != null) return;
  if(S.skipList.indexOf(i) === -1) S.skipList.push(i);
  $("actnote") && ($("actnote").textContent = "");
  if(S.idx < S.order.length - 1){
    S.idx++;
    renderExercise();
  } else {
    if(pendingSkips().length > 0) showReview();
    else finish();
  }
  updateHeader();
}
function onHint(){
  var i = curPos();
  var ex = EXAMS[i];
  if(S.checked[i] != null || S.hintsUsed[i]) return;
  S.hintsUsed[i] = true;
  $("hintslot").innerHTML = hintHTML(ex);
  $("btn-hint").disabled = true;
  updateHeader();
}
function showReview(){
  S.screen = "review";
  S.phase = "review";
  S.reviewPos = -1;
  var pend = pendingSkips();
  S.reviewTotal = pend.length;
  var m = $("main");
  if(pend.length === 0){ finish(); return; }
  var rows = pend.map(function(exIdx, k){
    var ex = EXAMS[exIdx];
    return '<div class="revrow"><span class="rn">#' + (k + 1) + '</span><span class="rt"><b>' + esc(ex.title) + "</b> — " + esc(ex.summary) + "</span>" +
      '<span class="badge-skip">⚠ Skipped</span><button class="btn" data-ex="' + exIdx + '" type="button">Answer now</button></div>';
  }).join("");
  m.innerHTML =
    '<section class="blk blk-question" style="--blk:var(--amber)"><div class="blk-label"><span class="dot"></span>REVIEW SKIPPED EXERCISES</div>' +
    '<p class="q-text">You skipped ' + pend.length + ' exercise' + (pend.length > 1 ? "s" : "") + '.</p>' +
    '<p class="scen-body" style="color:var(--ink-dim);margin:8px 0 14px">Answer them now, or leave them — exercises you never answer are excluded from both your score and the total. <span class="dim">The timer is still running.</span></p>' +
    '<div class="revlist">' + rows + "</div>" +
    '<div class="actions" style="margin-top:16px"><button class="btn btn-primary" id="btn-finish" type="button">Finish exam — see results</button></div></section>';
  var btns = byClass(m, "btn");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      if(btn.hasAttribute("data-ex")){
        btn.addEventListener("click", function(){
          S.idx = S.order.indexOf(parseInt(btn.getAttribute("data-ex"), 10));
          S.reviewPos = pendingSkips().indexOf(parseInt(btn.getAttribute("data-ex"), 10));
          renderReviewItem();
        });
      }
    })(btns[b]);
  }
  $("btn-finish").addEventListener("click", function(){ finish(); });
  updateHeader();
}
function renderReviewItem(){
  var exIdx = curPos();
  S.screen = "review";
  renderExercise();
  var nb = $("btn-next");
  nb.innerHTML = "Back to review list";
  updateHeader();
}
function finish(){
  setTimerState("ENDED");
  S.screen = "results";
  var m = $("main");
  var total = 0, full = 0, part = 0, bad = 0, skipped = 0;
  var partSum = 0;
  for(var i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null){
      total++;
      var c = S.checked[i].credit;
      if(c >= 0.999){ full++; }
      else if(c > 0){ part++; partSum += c; }
      else bad++;
    } else skipped++;
  }
  var rounded = Math.round(S.score);
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var pctColor = passed ? "var(--green)" : "var(--red)";
  var verdict = passed
    ? '<span class="res-verdict pass"><span aria-hidden="true">✓</span> PASSED</span>'
    : '<span class="res-verdict fail"><span aria-hidden="true">✗</span> NOT PASSED</span>';
  var avgPart = part > 0 ? (partSum / part) : 0;
  var rows = "";
  for(var q = 0; q < EXAMS.length; q++){
    var qi = S.order[q];
    var exq = EXAMS[qi];
    var st, cls;
    if(S.checked[qi] != null){
      var cc = S.checked[qi].credit;
      if(cc >= 0.999){ st = "✓ Correct"; cls = "st-ok"; }
      else if(cc > 0){ st = "✓ Partially correct"; cls = "st-part"; }
      else { st = "✗ Incorrect"; cls = "st-bad"; }
    } else { st = "⚠ Skipped — not answered"; cls = "st-skip"; }
    rows += "<tr><td>" + (q + 1) + "</td><td>" + esc(TYPE_LABEL[exq.type].name) + "</td><td>" + esc(exq.title) + '</td><td class="num">' +
      (S.checked[qi] != null ? S.checked[qi].credit.toFixed(2) : "—") + '</td><td class="' + cls + '">' + st + "</td></tr>";
  }
  m.innerHTML =
    '<section class="res-head"><div class="ring" style="--pct:' + percent + ";--rc:" + pctColor + '" role="img" aria-label="Final score ' + percent + ' percent"><div class="rin"><div><div class="pct">' + percent + '%</div><div class="of">SCORED</div></div></div></div>' +
    "<div>" + verdict +
      '<div class="res-sub">' + esc(META.attackId + " " + META.attackName + " — " + META.severity.replace("_"," ")) + "</div>" +
      '<div class="res-sub">Points: <b>' + S.score.toFixed(2) + "</b> (posted as " + rounded + ") from <b>" + total + "</b> answered of " + EXAMS.length + " · pass mark " + META.passMark + "%</div>" +
      '<div class="res-sub">Active time: <b>' + fmtClock(S.elapsed) + "</b> · budget " + META.timerMinutes + ":00</div>" +
    "</div></section>" +
    '<div class="statgrid">' +
      '<div class="statcard"><div class="sv ok">' + full + '</div><div class="sl">✓ Fully correct</div></div>' +
      '<div class="statcard"><div class="sv part">' + part + '</div><div class="sl">✓ Partial (avg ' + avgPart.toFixed(2) + ')</div></div>' +
      '<div class="statcard"><div class="sv bad">' + bad + '</div><div class="sl">✗ Fully incorrect</div></div>' +
      '<div class="statcard"><div class="sv skip">' + skipped + '</div><div class="sl">⚠ Skipped, never answered</div></div>' +
    "</div>" +
    '<div class="pausereport">⏱ <b>Pause report</b> — auto-paused during checks: <b>' + fmtClock(S.pauseAutoCheck) + "</b> · manual pauses: <b>" + fmtClock(S.pauseManual) + "</b>. No time passes during pauses.</div>" +
    '<table class="restable"><thead><tr><th>#</th><th>Type</th><th>Exercise</th><th>Credit</th><th>Result</th></tr></thead><tbody>' + rows + "</tbody></table>" +
    '<div class="actions" style="margin-top:18px"><button class="btn btn-primary" id="btn-retake" type="button">↻ Retake exam (reshuffled)</button></div>';
  $("btn-retake").addEventListener("click", retake);
  updateHeader();
  window.scrollTo(0, 0);
  setTimeout(postScore, 600);
}
function retake(){
  S.order = [];
  S.idx = 0;
  S.phase = "main";
  S.skipList = [];
  S.answers = {};
  S.checked = {};
  S.hintsUsed = {};
  S.score = 0;
  S.tState = "IDLE";
  S.tStateAt = null;
  S.pausedFrom = null;
  S.remaining = META.timerMinutes * 60;
  S.elapsed = 0;
  S.pauseManual = 0;
  S.pauseAutoCheck = 0;
  S.scorePosted = false;
  var po = $("pauseoverlay");
  po.classList.add("hidden");
  $("main").classList.remove("hidden");
  showIntro();
}

/* ==== pause / hint / skip wiring ==== */
$("btn-hint").addEventListener("click", onHint);
$("btn-skip").addEventListener("click", onSkip);
$("btn-pause").addEventListener("click", function(){
  if(S.tState === "RUNNING"){
    S.pausedFrom = null;
    setTimerState("PAUSED_MANUAL");
    $("pauseoverlay").classList.remove("hidden");
    $("main").classList.add("hidden");
    $("btn-resume").focus();
  } else if(S.tState === "PAUSED_AUTO_CHECK"){
    S.pausedFrom = "PAUSED_AUTO_CHECK";
    setTimerState("PAUSED_MANUAL");
    $("pauseoverlay").classList.remove("hidden");
    $("main").classList.add("hidden");
    $("btn-resume").focus();
  }
});
$("btn-resume").addEventListener("click", function(){
  $("pauseoverlay").classList.add("hidden");
  $("main").classList.remove("hidden");
  if(S.pausedFrom === "PAUSED_AUTO_CHECK"){
    S.pausedFrom = null;
    setTimerState("PAUSED_AUTO_CHECK");
  } else {
    setTimerState("RUNNING");
  }
});

/* ==== boot ==== */
$("tb-title").textContent = META.attackId + " " + META.attackName;
$("foot-meta").textContent = META.attackId + " · " + META.severity.replace("_", " ") + " · pass " + META.passMark + "%";
showIntro();

/* ==== automation hook (offline lab use) ==== */
function buildCorrectAns(ex){
  var i, a;
  switch(ex.type){
    case "mcq": return { sel: ex.correct };
    case "multi": return { sel: ex.correct.slice() };
    case "match":
      a = []; for(i = 0; i < ex.pairs.length; i++) a.push(i); return { assign: a };
    case "order":
      a = []; for(i = 0; i < ex.items.length; i++) a.push(i); return { seq: a };
    case "fill":
      a = []; for(i = 0; i < ex.blanks.length; i++) a.push(ex.blanks[i]); return { vals: a };
    case "terminal": return { cmd: ex.expected };
    case "logview": return { w: buildCorrectAns(ex.widget) };
    case "decision":
      a = []; for(i = 0; i < ex.steps.length; i++) a.push(ex.steps[i].correct);
      return { steps: a, cursor: ex.steps.length };
  }
  return {};
}
function buildWrongAns(ex){
  var i, a;
  switch(ex.type){
    case "mcq": return { sel: ex.correct === 0 ? 1 : 0 };
    case "multi": {
      var wrong = [];
      for(i = 0; i < ex.options.length && wrong.length < 1; i++){ if(ex.correct.indexOf(i) === -1) wrong.push(i); }
      return { sel: wrong };
    }
    case "match":
      a = []; for(i = 0; i < ex.pairs.length; i++) a.push((i + 1) % ex.pairs.length); return { assign: a };
    case "order":
      a = []; for(i = ex.items.length - 1; i >= 0; i--) a.push(i); return { seq: a };
    case "fill":
      a = []; for(i = 0; i < ex.blanks.length; i++) a.push("zz wrong"); return { vals: a };
    case "terminal": return { cmd: "echo zzz" };
    case "logview": return { w: buildWrongAns(ex.widget) };
    case "decision":
      a = []; for(i = 0; i < ex.steps.length; i++){ var w2 = (ex.steps[i].correct + 1) % ex.steps[i].options.length; a.push(w2); }
      return { steps: a, cursor: ex.steps.length };
  }
  return {};
}
window.__CP = {
  S: S,
  META: META,
  EXAMS: EXAMS,
  start: function(){ startExam(); },
  state: function(){
    return { screen: S.screen, tState: S.tState, remaining: S.remaining, elapsed: S.elapsed,
             score: S.score, idx: S.idx, phase: S.phase, posted: S.scorePosted };
  },
  correctAns: buildCorrectAns,
  wrongAns: buildWrongAns,
  fill: function(ans){ var i = curPos(); S.answers[i] = JSON.parse(JSON.stringify(ans)); renderExercise(); },
  fillIdx: function(idx, ans){ S.answers[idx] = JSON.parse(JSON.stringify(ans)); },
  check: function(){ onCheck(); },
  next: function(){ onNext(); },
  skip: function(){ onSkip(); },
  hint: function(){ onHint(); },
  gradeOne: function(i, ans){ return grade(EXAMS[i], ans, false); },
  pause: function(){ $("btn-pause").click(); },
  resume: function(){ $("btn-resume").click(); },
  finish: function(){ finish(); },
  postScore: postScore
};
</script>
