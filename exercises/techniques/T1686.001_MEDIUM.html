(function(){
'use strict';
var META=JSON.parse(document.getElementById('cm-exercise-meta').textContent);var INTRO={"learn":["This exam is about <b>T1686.001 — Cloud Firewall<\/b>, a <b>sub-technique<\/b> of T1686 — Disable or Modify System Firewall, in the tactic <b>Defense Impairment<\/b> (TA0112), on the <b>IaaS<\/b> platform. At this level you move from “what the name says” to “what the activity looks like in a real account”.","You will practise <b>reading attacker behavior<\/b>: an adversary with suitable cloud permissions adds or changes firewall rules in security groups, creates new wide-open groups, or deletes blocking rules so that their traffic — for example remote access sessions or cryptomining — can flow. You will decide when a rule change points to this sub-technique and when it points to a neighbour, such as the sibling sub-techniques T1686.002 (Network Device Firewall) and T1686.003 (Windows Host Firewall) or T1685.002 (Disable or Modify Cloud Log).","You will also work with the <b>real procedure example<\/b> from the ATT&CK page: Pacu (S1091), an open-source AWS attack framework, can allowlist IP addresses in AWS GuardDuty, blinding a cloud detection service to the attacker’s addresses.","On the <b>defender side<\/b>, you will map CloudTrail-style control-plane events (AuthorizeSecurityGroupIngress, RevokeSecurityGroupIngress, CreateSecurityGroup, DeleteSecurityGroup) to the detection strategy DET0424, separate true attacks from false positives such as infrastructure-as-code deployments, and apply the mitigations M1018 (least-privilege IAM) and M1047 (Audit)."],"keywords":["T1686.001 Cloud Firewall","T1686.002 Network Device Firewall","T1686.003 Windows Host Firewall","T1685.002 Disable or Modify Cloud Log","0[.]0[.]0[.]0/0","Ingress vs egress","Control plane vs data plane","AuthorizeSecurityGroupIngress","CreateSecurityGroup","DeleteSecurityGroup","CloudTrail events","Pacu (S1091)","GuardDuty allowlisting","Least privilege (M1018)","False positives / IaC"],"how":["<b>Goal.<\/b> You need <b>70%<\/b> to pass. The exam has 15 exercises, and your final score is shown as a percent.","<b>Exercise types.<\/b> You will see four kinds of exercises: single-choice, multi-select, drag-and-drop (matching or ordering), and simulated terminal commands. Multi-select and drag-and-drop exercises give <b>partial credit<\/b> for partly correct work.","<b>Timer.<\/b> The timer budget is 28 minutes and counts down while you work. Pressing <b>Check<\/b> auto-pauses the timer while feedback is shown (the header shows “⏳ Feedback pause”); pressing <b>Next<\/b> starts it again. The <b>⏸ Pause<\/b> button freezes the timer yourself at any moment, and <b>Resume<\/b> returns you to the same place.","<b>Hints and scoring.<\/b> A correct answer gives 1.00 credit. Partly correct answers give fractional credit, so scores can be decimals like 0.67. Each opened hint costs 25% of that exercise’s credit.","<b>Skip rules.<\/b> <b>Skip<\/b> moves you past an exercise without an answer or feedback. Before the results you get a review screen where every skipped exercise can be answered or left out; exercises left out never touch your score."]};
var EX=[{"id":"m01","type":"single","persp":"attacker","concept":"Attribution","scenario":"At Meridian Pay, a build server’s API key was stolen. Twenty minutes later the cloud log shows <code>AuthorizeSecurityGroupIngress<\/code> adding “allow TCP 3389 from 0[.]0[.]0[.]0/0” to the finance-app security group. No human user acted.","question":"Which ATT&CK sub-technique best matches the firewall change itself?","options":[["T1686.001 — Cloud Firewall",true],["T1078 — Valid Accounts",false],["T1685.002 — Disable or Modify Cloud Log",false],["T1098.001 — Additional Cloud Credentials",false]],"explanation":"<b>A is correct:<\/b> the observed action is a modification of a cloud firewall (a new ingress rule opening RDP to everyone), which is exactly T1686.001. <b>B is wrong:<\/b> Valid Accounts describes the <b>use of the stolen key<\/b> to log in, which likely preceded the change, but the question asks about the firewall change itself. <b>C is wrong:<\/b> nothing happened to CloudTrail or logging here. <b>D is wrong:<\/b> no new credential was created in this event; the key already existed. In a full report you would chain T1078 → T1686.001, and the rule change itself is T1686.001.","hints":["Ask: which object was touched — an account, a log, or a security group?","The change is an ingress rule on a cloud security group."]},{"id":"m02","type":"single","persp":"defender","concept":"Related objects","scenario":"The network team reports that an on-premises border router had two ACL entries deleted by an attacker who had guessed the device’s admin password.","question":"Which sub-technique covers deleting access-control entries on a network device firewall?","options":[["T1686.002 — Network Device Firewall",true],["T1686.001 — Cloud Firewall",false],["T1686.003 — Windows Host Firewall",false],["T1685 — Disable or Modify Tools",false]],"explanation":"<b>A is correct:<\/b> T1686.002 covers disabling or adding, deleting, or modifying rules on network-device firewalls such as routers. <b>B is wrong:<\/b> T1686.001 is limited to cloud environments (security groups, cloud firewall policies) — IaaS platform. <b>C is wrong:<\/b> T1686.003 is the Windows <b>host<\/b> firewall, not routers. <b>D is wrong:<\/b> T1685 targets security tools such as EDR and logging agents; a router ACL is a network firewall, covered by its own sub-technique.","hints":["Where does the firewall live — in the cloud, on a router, or on a Windows machine?","The device here is a border router, not a cloud security group."]},{"id":"m03","type":"single","persp":"defender","concept":"Related objects","scenario":"During the same Meridian Pay investigation, the attacker later ran <code>cloudtrail stop-logging<\/code> for the main trail.","question":"Stopping the CloudTrail trail matches which sub-technique?","options":[["T1685.002 — Disable or Modify Cloud Log",true],["T1686.001 — Cloud Firewall",false],["T1686.003 — Windows Host Firewall",false],["M1047 — Audit",false]],"explanation":"<b>A is correct:<\/b> disabling cloud logging capabilities is T1685.002 — Disable or Modify Cloud Log. It is a neighbour of T1686.001 and, notably, Pacu can do both. <b>B is wrong:<\/b> no security group or firewall rule was touched in this action. <b>C is wrong:<\/b> the Windows host firewall is unrelated to CloudTrail. <b>D is wrong:<\/b> M1047 is a mitigation (a defensive action), not attacker behavior — ATT&CK technique IDs describe adversaries, M-IDs describe defenses.","hints":["Ask what object changed: a log configuration or a firewall rule?","M-numbers are mitigations — defenders’ actions — so one option can be removed immediately."]},{"id":"m04","type":"terminal","persp":"defender","concept":"Defender skills","scenario":"You are hunting in the Meridian Pay training account for any security group that already admits traffic from the whole internet.","question":"In the simulated shell, type the read-only AWS CLI command that lists security groups filtered to rules allowing 0[.]0[.]0[.]0/0.","shell":{"banner":"CYBERPULSE HUNT LAB — read-only sandbox · account 444455556666 · nothing you type changes the cloud","goal":"List security groups that have an ingress rule allowing 0[.]0[.]0[.]0/0.","syntax":"aws ec2 describe-security-groups --filters Name=&lt;field&gt;,Values=&lt;value&gt;","expected":"{\n  \"SecurityGroups\": [\n    { \"GroupId\": \"sg-0open999\", \"GroupName\": \"finance-app\",\n      \"IpPermissions\": [{ \"IpProtocol\": \"tcp\", \"FromPort\": 3389, \"ToPort\": 3389,\n        \"IpRanges\": [{ \"CidrIp\": \"0[.]0[.]0[.]0/0\" }] }] }\n  ]\n}","prompt":"analyst@meridian-hunt","path":"~/hunt","placeholder":"aws ec2 describe-security-groups --filters …"},"checks":[{"re":"^aws\\s+ec2\\s+describe-security-groups\\b","label":"uses the read-only describe-security-groups command"},{"re":"--filters\\b","label":"narrows results with --filters instead of listing every group"},{"re":"Name\\s*=\\s*ip-permission\\.cidr","label":"filters on the ingress CIDR field (ip-permission.cidr)"},{"re":"Values\\s*=\\s*0\\.0\\.0\\.0/0\\b","label":"looks for the value 0[.]0[.]0[.]0/0"}],"nearMiss":[{"re":"Values\\s*=\\s*0\\.0\\.0\\.0/32\\b","msg":"A /32 is one single address; the hunt wants the “any address” range 0[.]0[.]0[.]0/0."},{"re":"Name\\s*=\\s*group-id","msg":"Filtering by group-id finds one known group; it cannot find all groups with open rules."}],"destructive":null,"canonical":"aws ec2 describe-security-groups --filters Name=ip-permission.cidr,Values=0[.]0[.]0[.]0/0","explanation":"The hunt needs a <b>filter<\/b>, not a group id: <code>describe-security-groups<\/code> (check 1) plus <code>--filters<\/code> (check 2) with the field <code>Name=ip-permission.cidr<\/code> (check 3) and the value <code>Values=0[.]0[.]0[.]0/0<\/code> (check 4) returns exactly the groups whose ingress rules admit every address. Filtering on a single group id would miss all other open groups, and a /32 value matches only one address, so both are near misses. The command stays read-only, so it is safe to run in production accounts too.","hints":["The filter field name contains “ip-permission”.","The value you are hunting for is the range that means “any address”."]},{"id":"m05","type":"single","persp":"both","concept":"Concepts","scenario":"A security group now contains: <code>ingress · tcp · 3389 · from 0[.]0[.]0[.]0/0<\/code>.","question":"What does this rule allow?","options":[["Any address on the internet can attempt an RDP connection to port 3389",true],["Only the cloud provider’s support team can reach port 3389",false],["The instance can send traffic out to port 3389 anywhere",false],["Port 3389 is blocked for everyone",false]],"explanation":"<b>A is correct:<\/b> an <b>ingress<\/b> rule for tcp/3389 from 0[.]0[.]0[.]0/0 admits RDP connection attempts from every possible source address. <b>B is wrong:<\/b> 0[.]0[.]0[.]0/0 is not a provider allowlist; it is “every address”. <b>C is wrong:<\/b> that describes an <b>egress<\/b> rule — direction matters, and this rule is ingress. <b>D is wrong:<\/b> the rule allows rather than blocks; 0[.]0[.]0[.]0/0 widens access to the maximum.","hints":["“Ingress” answers “who may come in?”.","0[.]0[.]0[.]0/0 is the widest possible source range."]},{"id":"m06","type":"dnd","mode":"match","persp":"defender","concept":"Detection","scenario":"You are labelling CloudTrail event names for the DET0424 detection strategy.","question":"Drag each CloudTrail event onto the box that describes what it does to a security group.","bank":["AuthorizeSecurityGroupIngress","RevokeSecurityGroupIngress","CreateSecurityGroup","DeleteSecurityGroup"],"zones":[{"label":"Adds an inbound rule (can open access)","accepts":[0]},{"label":"Removes an inbound rule (can delete a blocking rule)","accepts":[1]},{"label":"Makes a new security group (attackers may build it wide open)","accepts":[2]},{"label":"Removes a whole group and its rules","accepts":[3]}],"explanation":"<b>AuthorizeSecurityGroupIngress<\/b> adds an ingress rule — the classic move for opening a port to 0[.]0[.]0[.]0/0. <b>RevokeSecurityGroupIngress<\/b> removes an ingress rule, which attackers use to delete a rule that was blocking them; defenders use the same call to clean up. <b>CreateSecurityGroup<\/b> births a new group, and the ATT&CK description notes attackers may create new security groups entirely with open rules. <b>DeleteSecurityGroup<\/b> erases a group together with every rule in it. The analytic AN1188 explicitly watches <b>creation, deletion, and modification<\/b> of security groups and firewall rules, so all four events feed the detection.","hints":["“Authorize” adds and “Revoke” removes; “Create” and “Delete” act on the whole group object.","All four event names belong to the same detection strategy — none of them is a false fit."]},{"id":"m07","type":"multi","persp":"defender","concept":"Triage","scenario":"You are triaging five security group changes from the last 24 hours at Meridian Pay and must flag the attacker-like ones.","question":"Select every signal that makes a rule change look attacker-driven. (Pick all that apply.)","options":[["The change has no matching change ticket or deployment record",true],["It opens an atypical port to 0[.]0[.]0[.]0/0 minutes after a new API key was created",true],["The call came from an API key that had never been used before",true],["The change happened inside the documented maintenance window by the network team",false],["The change exactly matches the Terraform plan that CI ran an hour earlier",false]],"explanation":"<b>A, B and C are correct:<\/b> no change record (A), an open rule on an atypical port right after fresh credentials appeared (B), and a never-before-seen API key (C) all match the DET0424 defender view: unexpected rules “often correlated with privileged role or API key activity”. <b>D is wrong:<\/b> a change made by the known network team inside an announced window fits the baseline — that is normal operations. <b>E is wrong:<\/b> matching the IaC plan that CI deployed is exactly the expected explanation; the change has an owner and a record, so it is a likely false positive, not attacker-driven.","hints":["Two options have an owner and paperwork — that is the opposite of suspicious.","Correlate three things: change ticket, timing, and the identity behind the call."]},{"id":"m08","type":"single","persp":"both","concept":"Concepts","scenario":"A trainee asks why firewall changes matter for lateral movement in the cloud.","question":"Which sentence correctly describes the control plane and the data plane here?","options":[["Security group rules are changed through the control plane, and the opened rules let traffic reach the data plane",true],["Security group rules live in the data plane, so changing them needs no API at all",false],["The control plane and data plane are two names for the same service",false],["Opening firewall rules only affects the control plane and can never help reach instances",false]],"explanation":"<b>A is correct:<\/b> rule changes are API calls against the control plane, and the ATT&CK description notes the change helps an adversary “move laterally from the cloud control plane to the data plane” — the opened path reaches actual instances and services. <b>B is wrong:<\/b> rules are managed objects; you cannot change them without the API. <b>C is wrong:<\/b> the control plane manages, the data plane carries traffic — different layers. <b>D is wrong:<\/b> the whole point of opening a rule is to let traffic reach data-plane resources.","hints":["One plane is for managing, the other is for traffic.","The ATT&CK description itself names the movement between the two planes."]},{"id":"m09","type":"terminal","persp":"defender","concept":"Log parsing","scenario":"You exported one hour of Meridian Pay CloudTrail records to <code>trail.json<\/code> and want a quick list of which security-group events happened.","question":"In the simulated shell, type the jq command that prints the eventName of every record in trail.json.","shell":{"banner":"CYBERPULSE LOG LAB — trail.json is in the current directory · read-only analysis","goal":"Print the eventName field of every record in trail.json.","syntax":"jq -r '&lt;filter&gt;' trail.json","expected":"AuthorizeSecurityGroupIngress\nCreateTags\nDescribeInstances\nRevokeSecurityGroupIngress","prompt":"analyst@meridian-hunt","path":"~/logs","placeholder":"jq -r '…' trail.json"},"checks":[{"re":"^jq\\b","label":"uses the jq tool"},{"re":"\\s-r\\b|^jq\\s+-r","label":"asks for raw output with -r (no quotes in the lines)"},{"re":"Records","label":"starts from the Records array"},{"re":"eventName","label":"extracts the eventName field"}],"nearMiss":[{"re":"eventTime","msg":"eventTime prints timestamps; the task wants event names."},{"re":"select\\(","msg":"select() filters records by a condition; here you must list every record’s eventName, not filter."}],"destructive":null,"canonical":"jq -r '.Records[].eventName' trail.json","explanation":"The file is a CloudTrail export, so every event sits in the <code>Records<\/code> array (check 3). <code>jq -r<\/code> (checks 1 and 2) applies the filter <code>.Records[].eventName<\/code> — walk into Records, iterate every element, and print its <code>eventName<\/code> (check 4) — giving one clean event name per line. Using <code>eventTime<\/code> answers a different question, and <code>select()<\/code> would drop records instead of listing them; both are near misses. The <code>[]<\/code> after <code>Records<\/code> is what makes jq visit every record rather than the array as a whole.","hints":["CloudTrail JSON always starts its events under a field called Records.","The [] after a field name makes jq loop over the array."]},{"id":"m10","type":"single","persp":"attacker","concept":"Behavior","scenario":"A reviewer asks why the ATT&CK description of T1686.001 explicitly mentions cryptomining.","question":"Why does the technique description name cryptomining traffic?","options":[["Because attackers remove networking limits so heavy malicious traffic, like mining, can flow freely",true],["Because cloud firewalls are used to mine cryptocurrency by default",false],["Because mining requires turning off all cloud logging first",false],["Because cryptomining is the only thing firewall rules can allow",false]],"explanation":"<b>A is correct:<\/b> the description says attackers “may also remove networking limitations to support traffic associated with malicious activity (such as cryptomining)” — open rules remove bandwidth and connection restrictions for the attacker’s traffic. <b>B is wrong:<\/b> firewalls do not mine anything; they only filter traffic. <b>C is wrong:<\/b> disabling logging is a different sub-technique (T1685.002) and is not required for mining. <b>D is wrong:<\/b> firewall rules can allow any port and protocol; cryptomining is only an example of abusive traffic.","hints":["Firewall rules do not compute hashes — they permit traffic.","The attacker benefits when there is no limit on the traffic they want to send."]},{"id":"m11","type":"multi","persp":"attacker","concept":"Procedures","scenario":"You are reading the procedure table on the T1686.001 ATT&CK page and stop at the Pacu row.","question":"Select every true statement about the Pacu procedure for T1686.001. (Pick all that apply.)","options":[["Pacu is listed as software S1091 in ATT&CK",true],["Pacu can allowlist IP addresses in AWS GuardDuty",true],["Allowlisting its addresses makes GuardDuty stop flagging the attacker’s traffic",true],["Pacu modifies the Windows registry to hide from antivirus",false],["The procedure means Pacu deletes CloudTrail trails",false]],"explanation":"<b>A, B and C are correct:<\/b> the ATT&CK software entry S1091 is Pacu, an open-source AWS exploitation framework; the procedure example under T1686.001 says Pacu <b>can allowlist IP addresses in AWS GuardDuty<\/b>, and a GuardDuty allowlist means the detection service treats those addresses as trusted, so findings about them are suppressed — an impairment of a cloud defense. <b>D is wrong:<\/b> registry tampering against antivirus is host-side behavior, unrelated to this cloud procedure. <b>E is wrong:<\/b> deleting trails would be T1685.002 — Disable or Modify Cloud Log, a different sub-technique.","hints":["The procedure is about a trust list inside a detection service, not about logs or registries.","GuardDuty is a detection service — what does an allowlist do to its alerts?"]},{"id":"m12","type":"dnd","mode":"order","persp":"defender","concept":"Defender workflow","scenario":"Meridian Pay SOC just received the first alert for a suspicious ingress rule and you are writing the runbook steps in order.","question":"Drag the four triage steps into the correct order (first step on top).","bank":["Confirm the rule change in the control-plane log","Identify the API key, role, and source that made the change","Compare the change with tickets, deployments, and IaC plans","Revoke the unauthorized rule and restore the approved baseline"],"zones":[{"label":"Step 1"},{"label":"Step 2"},{"label":"Step 3"},{"label":"Step 4"}],"explanation":"Correct order: <b>(1) Confirm<\/b> — the alert must be verified against the control-plane log before anything else, otherwise you chase noise. <b>(2) Identify<\/b> — the actor (API key, role, source address) tells you whether a human, a pipeline, or a stolen key acted, and it is exactly the correlation the analytic AN1188 asks for. <b>(3) Compare<\/b> — only after knowing who acted do you check tickets, deployments, and IaC plans to separate a false positive from an attack. <b>(4) Revoke<\/b> — containment comes last in triage order once you know the change is unauthorized; revoking first would destroy evidence you needed in steps 1–3 and, if the change was legitimate, would break production.","hints":["You cannot compare against tickets before you know who made the change.","Changing the environment comes after you understand the change."]},{"id":"m13","type":"single","persp":"defender","concept":"Mitigation","scenario":"Meridian Pay wants least privilege for security group changes. Today every developer role can call any <code>ec2:*<\/code> action.","question":"Which IAM design most directly reduces the risk of T1686.001?","options":[["Grant ec2:AuthorizeSecurityGroupIngress and related firewall actions only to a dedicated network-admin role",true],["Grant every role ec2:* but require two people to type the same password",false],["Move all instances into one security group that allows everything",false],["Rotate the build server’s API key once a year",false]],"explanation":"<b>A is correct:<\/b> this is M1018 — User Account Management applied concretely: least privilege means the firewall-mutating actions exist only in the one role that needs them, so a stolen developer key can no longer perform T1686.001. <b>B is wrong:<\/b> double-typing a password does not remove the permission, and IAM has no such shared-password control anyway. <b>C is wrong:<\/b> one allow-everything group maximizes blast radius — the opposite of the goal. <b>D is wrong:<\/b> yearly rotation is good hygiene but does not limit <b>who can change firewalls<\/b>; the over-broad permission remains.","hints":["Least privilege is about which actions an identity may perform.","The fix must remove the firewall-change permission from roles that do not need it."]},{"id":"m14","type":"single","persp":"defender","concept":"False positives","scenario":"Your DET0424 alert fired, but the log shows the change was made by the <code>terraform-ci<\/code> role applying a reviewed plan that adds a standard 443-from-10[.]0[.]0[.]0/8 rule.","question":"Why is this alert most likely a false positive for T1686.001?","options":[["The change is expected infrastructure-as-code activity that matches an approved plan and a known role",true],["Because Terraform cannot change security groups at all",false],["Because 443 is never an interesting port",false],["Because alerts fired on weekends are always false positives",false]],"explanation":"<b>A is correct:<\/b> the change has an owner (terraform-ci role), a reviewed plan, and a rule that fits the approved baseline — every correlation the detection asks for points to normal operations, so the analytic fires on legitimate activity. <b>B is wrong:<\/b> Terraform routinely creates and modifies security groups; that is precisely why it appears in logs. <b>C is wrong:<\/b> the port alone does not decide; context does — port 443 with an approved plan is benign, the same port opened to 0[.]0[.]0[.]0/0 by an unknown key would not be. <b>D is wrong:<\/b> the day of the week is not evidence; attackers use weekends precisely because people assume this.","hints":["A false positive means the activity is real but legitimate — look for an owner and an approved record.","Ask whether every element (role, plan, rule shape) matches the baseline."]},{"id":"m15","type":"single","persp":"attacker","concept":"Behavior","scenario":"An attacker on a cloud instance wants an interactive remote-desktop session back to their own machine, from anywhere, without touching the VPN.","question":"Which firewall change achieves the attacker’s goal in the T1686.001 way?","options":[["Add an ingress rule allowing TCP 3389 (RDP) from 0[.]0[.]0[.]0/0 to the instance’s security group",true],["Add a DNS record pointing the instance to the attacker’s server",false],["Change the instance’s IAM role to AdministratorAccess",false],["Enable CloudTrail for the account",false]],"explanation":"<b>A is correct:<\/b> an ingress rule for tcp/3389 from every address lets the attacker reach RDP from any machine they control — a textbook T1686.001 change that opens the door the platform firewall was keeping shut. <b>B is wrong:<\/b> DNS records belong to another technique area (dynamic resolution / DNS manipulation) and do not open inbound access. <b>C is wrong:<\/b> changing the instance role is privilege escalation via IAM, not a firewall modification. <b>D is wrong:<\/b> enabling CloudTrail is a defender action — the attacker would never switch auditing on.","hints":["The goal is inbound remote access from anywhere.","RDP speaks on TCP port 3389."]}];

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(s){s=Math.max(0,Math.floor(s));var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function norm(s){return String(s||'').replace(/\[\.\]/g,'.').replace(/\[:\]/g,':').replace(/["']/g,'')
  .replace(/\s+/g,' ').trim()}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
var LETTERS='ABCDEFGH';

/* ---------- timer state machine: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED ---------- */
var T={state:'IDLE',remaining:META.timerMinutes*60,tRun:0,tMan:0,tAuto:0,iv:null,enteredAt:0,resumeTo:'RUNNING'};
function tAccount(){
  var now=Date.now();
  if(T.state==='PAUSED_MANUAL'){T.tMan+=Math.max(0,Math.round((now-T.enteredAt)/1000))}
  else if(T.state==='PAUSED_AUTO_CHECK'){T.tAuto+=Math.max(0,Math.round((now-T.enteredAt)/1000))}
}
function timerTick(){
  if(T.state!=='RUNNING')return;
  T.remaining--;T.tRun++;renderTimer();
  if(T.remaining<=0){forceFinish()}
}
function tEnter(st){
  tAccount();T.state=st;T.enteredAt=Date.now();
  if(st==='RUNNING'){if(!T.iv)T.iv=setInterval(timerTick,1000)}
  else if(T.iv){clearInterval(T.iv);T.iv=null}
  renderTimer();
}
function tStart(){T.state='RUNNING';T.enteredAt=Date.now();if(!T.iv)T.iv=setInterval(timerTick,1000);renderTimer()}
function tPauseManual(){if(T.state==='ENDED'||T.state==='PAUSED_MANUAL')return;
  T.resumeTo=(T.state==='PAUSED_AUTO_CHECK')?'PAUSED_AUTO_CHECK':'RUNNING';
  tEnter('PAUSED_MANUAL');$('pause-ov').classList.add('show');document.body.classList.add('blurred')}
function tResumeManual(){if(T.state!=='PAUSED_MANUAL')return;
  tEnter(T.resumeTo||'RUNNING');$('pause-ov').classList.remove('show');document.body.classList.remove('blurred')}
function tAutoPause(){if(T.state==='RUNNING'){tEnter('PAUSED_AUTO_CHECK')}}
function tAutoResume(){if(T.state==='PAUSED_AUTO_CHECK'){tEnter('RUNNING')}}
function tEnd(){tAccount();if(T.iv){clearInterval(T.iv);T.iv=null}T.state='ENDED';renderTimer()}
function renderTimer(){var c=$('timerchip');if(!c)return;var cls='chip timer-run',txt='';
  if(T.state==='RUNNING'){cls='chip timer-run';txt='▶ Running · '+fmt(T.remaining)}
  else if(T.state==='PAUSED_MANUAL'){cls='chip timer-man';txt='⏸ Paused'}
  else if(T.state==='PAUSED_AUTO_CHECK'){cls='chip timer-auto';txt='⏳ Feedback pause'}
  else if(T.state==='ENDED'){cls='chip timer-end';txt='⏱ Ended'}
  c.className=cls;c.textContent=txt;
  c.title=T.state==='PAUSED_MANUAL'?'Paused by you: the countdown is frozen. Resume continues the exam.'
    :(T.state==='PAUSED_AUTO_CHECK'?'Auto-paused while feedback is shown: the countdown is frozen until you press Next.'
    :(T.state==='ENDED'?'The exam has ended.':'Countdown is running.'))}

function dndHTML(e){
  var h='<p class="dnd-hinttext">Drag each item into a box, or click an item and then click a box. Click a placed item to put it back.</p><div class="dnd">';
  h+='<div class="dnd-bank" data-act-zone="-1">';
  S.dndDisp.forEach(function(oi){
    if(S.dndAssign[oi]===undefined||S.dndAssign[oi]===null||S.dndAssign[oi]<0){
      h+='<button type="button" draggable="true" class="dnd-chip'+(S.dndPick===oi?' picked':'')
       +'" data-act="dnd-pick" data-i="'+oi+'">'+e.bank[oi]+'</button>'}});
  h+='</div><div class="dnd-zones">';
  for(var z=0;z<e.zones.length;z++){
    h+='<div class="dnd-zone" data-zone="'+z+'" data-act="dnd-zone" tabindex="0" role="group"><span class="zone-t">'+esc(e.zones[z].label)+'</span>';
    S.dndDisp.forEach(function(oi){
      if(S.dndAssign[oi]===z){
        h+='<button type="button" class="dnd-chip" data-act="dnd-pick" data-i="'+oi+'">'+e.bank[oi]+'</button>'}});
    h+='</div>';
  }
  return h+'</div></div>';
}

   +'<span class="dot dot-g"></span><span>SIMULATED SHELL — sandbox lab, no real cloud access</span></div>'
   +'<div class="shell-body"><div class="shell-banner">'+sh.banner+'</div>'
   +'<div class="shell-goal">'+esc(sh.goal)+'</div>'
   +(sh.syntax?'<div class="shell-syntax">Syntax: '+sh.syntax+'</div>':'')
   +(sh.expected?'<div class="shell-syntax">Expected output shape:<br>'+sh.expected+'</div>':'')
   +'<div class="shell-line"><span class="prompt">'+esc(sh.prompt)+'<span class="punct">:</span><span class="path">'+esc(sh.path)+'</span><span class="punct">$</span></span>'
   +'<input class="shell-in" id="term-in" type="text" autocomplete="off" spellcheck="false" placeholder="'+esc(sh.placeholder||'type the command')+'" '+(S.checked?'disabled':'')+'></div>'
   +'<div class="shell-out" id="term-out"></div></div></div>';
}
function examHTML(){
  var e=cur(),inReview=(S.phase==='review');
  var counter=inReview?('Review skipped '+(S.reviewP+1)+' / '+S.reviewQ.length):('Exercise '+(S.idx+1)+' / '+EX.length);
  var h='<main class="wrap">'+scenBlock(e)+qBlock(e);
  h+=ansOpen();

   +'<button type="button" class="btn" data-act="hint" '+((S.checked||S.curHints>=(e.hints?e.hints.length:0))?'disabled':'')+'>ⓘ Hint</button>'
   +(inReview?'<button type="button" class="btn btn-danger" data-act="review-leave">⚠ Leave unanswered</button>'
             :'<button type="button" class="btn btn-danger" data-act="skip" '+(S.checked?'disabled':'')+'>⚠ Skip →</button>')

  h+='<div class="hint-panel" id="hint-panel"></div>';
  h+='<div class="feedback" id="feedback"></div>';

function barHTML(){
  return '<header class="bar"><div class="brand"><span class="t">'+esc(META.objectName)+'</span>'
   +'<span class="badge '+META.sevClass+'">'+esc(META.sevWord)+'</span></div>'
   +'<div class="tools"><span class="chip" id="counter"></span>'

/* ---------- grading ---------- */
function gradeCurrent(){
  var e=cur();
  if(e.type==='single'||e.type==='multi'){
    if(!S.sel.length)return null;
    var N=0,H=0,W=0,items=[];
    e.options.forEach(function(o){if(o[1])N++});
    e.options.forEach(function(o,i){
      var picked=(S.sel.indexOf(i)>=0);
      if(o[1]&&picked){H++;items.push([i,'ok','✓ Correct'])}
      else if(o[1]&&!picked){items.push([i,'miss','○ Missed'])}
      else if(!o[1]&&picked){W++;items.push([i,'bad','✗ Wrong'])}
      else{items.push([i,'',''])}});
    var base=(e.type==='single')?((H===1&&W===0)?1:0):Math.max(0,(H-W)/N);
    return {base:base,items:items,N:N};
  }
  if(e.type==='dnd'){
    var N2=e.bank.length,H2=0,W2=0,items2=[],cmap=correctMap(e);
    for(var i=0;i<e.bank.length;i++){
      var z=S.dndAssign[i];
      if(z===undefined||z===null||z<0){items2.push([i,'miss','○ Missed — not placed'])}
      else if(z===cmap[i]){H2++;items2.push([i,'ok','✓ Correct'])}
      else{W2++;items2.push([i,'bad','✗ Wrong — '+(e.mode==='order'?('correct position is '+(cmap[i]+1)):('belongs to “'+e.zones[cmap[i]].label+'”'))])}
    }
    return {base:Math.max(0,(H2-W2)/N2),items:items2,N:N2};
  }
  if(e.type==='terminal'){
    var raw=($('term-in')||{}).value||'';
    var inp=norm(raw);
    if(!inp)return null;
    var items3=[],H3=0,W3=0,trap=null,nm=[];
    if(e.destructive&&e.destructive.re&&new RegExp(e.destructive.re,'i').test(inp)){
      trap=e.destructive.msg;
    }
    if(!trap&&e.nearMiss){e.nearMiss.forEach(function(m){
      if(new RegExp(m.re,'i').test(inp))nm.push(m.msg)})}
    e.checks.forEach(function(c){
      var ok=new RegExp(c.re,'i').test(inp);
      if(ok)H3++;
      items3.push([null,ok?'ok':'miss',(ok?'✓ Passed — ':'○ Not met — ')+c.label])});
    W3=nm.length;
    var N3=e.checks.length;
    return {base:trap?0:Math.max(0,(H3-W3)/N3),items:items3,N:N3,trap:trap,nm:nm,inp:inp};
  }
  return null;
}
function correctMap(e){
  var m=[];
  if(e.mode==='order'){for(var i=0;i<e.bank.length;i++)m[i]=i}
  else{for(var i2=0;i2<e.bank.length;i2++)m[i2]=-1;
    e.zones.forEach(function(z,zi){(z.accepts||[]).forEach(function(ii){m[ii]=zi})})}
  return m;
}

/* ---------- feedback ---------- */
function showFeedback(g,credit,status){
  var e=cur(),fb=$('feedback');if(!fb)return;
  var cls=status==='full'?'fb-full':(status==='partial'?'fb-partial':'fb-zero');
  var head=status==='full'?'✓ Correct':(status==='partial'?'✓ Partially correct':'✗ Incorrect');
  var h='<div class="fb-head"><span>'+head+'</span><span class="credit">Credit: '+credit.toFixed(2)+' / 1.00'
   +(S.curHints>0?(' · −'+(HINT_PEN*S.curHints).toFixed(2)+' hint penalty ('+S.curHints+' hint'+(S.curHints>1?'s':'')+' used)'):'')+'</span></div>';
  h+='<ul class="peritem">';
  if(e.type==='single'||e.type==='multi'){
    g.items.forEach(function(it){
      if(it[2])h+='<li><span class="mark-tag '+(it[1]==='ok'?'':it[1])+'" style="color:'+(it[1]==='ok'?'var(--ok)':(it[1]==='bad'?'var(--bad)':'var(--miss)'))+'">'+it[2]+'</span><span><b>'+LETTERS[it[0]]+'.</b> '+e.options[it[0]][0]+'</span></li>'});
  }else if(e.type==='dnd'){
    g.items.forEach(function(it){
      h+='<li><span class="mark-tag" style="color:'+(it[1]==='ok'?'var(--ok)':(it[1]==='bad'?'var(--bad)':'var(--miss)'))+'">'+it[2]+'</span><span>'+e.bank[it[0]]+'</span></li>'});
  }else if(e.type==='terminal'){
    if(g.trap)h+='<li><span class="mark-tag" style="color:var(--bad)">✗ Unsafe action blocked</span><span>'+g.trap+'</span></li>';
    g.nm.forEach(function(m){h+='<li><span class="mark-tag" style="color:var(--warn)">⚠ Near miss</span><span>'+m+'</span></li>'});
    g.items.forEach(function(it){h+='<li><span class="mark-tag" style="color:'+(it[1]==='ok'?'var(--ok)':'var(--miss)')+'">'+it[2]+'</span></li>'});
  }
  h+='</ul><div class="expl"><span class="why">Why</span>'+e.explanation+'</div>';
  fb.className='feedback show '+cls;fb.innerHTML=h;
  var last=(S.phase==='review')?(S.reviewP===S.reviewQ.length-1):(S.idx===EX.length-1);
  var row=document.createElement('div');row.className='actrow';
  var lbl=S.phase==='review'?(last?'Finish review →':'Next skipped →'):(last?'Final Submit →':'Next →');
  row.innerHTML='<button type="button" class="btn btn-green" data-act="next">'+lbl+'</button>';
  fb.parentNode.insertBefore(row,fb.nextSibling);
  document.querySelectorAll('[data-act="check"],[data-act="skip"],[data-act="hint"]').forEach(function(b){b.disabled=true});
  var ti=$('term-in');if(ti)ti.disabled=true;
  markOptions(e,g);
  termOut(e,g);
}
function markOptions(e,g){
  if(!g||!g.items)return;
  if(e.type==='single'||e.type==='multi'){
    g.items.forEach(function(it){var el=document.querySelector('.opt[data-i="'+it[0]+'"]');if(!el)return;
      if(it[1]==='ok')el.classList.add('state-ok');
      else if(it[1]==='bad')el.classList.add('state-bad');
      else if(it[1]==='miss')el.classList.add('state-miss');
      var tag=it[2]?('<span class="mark-tag" style="color:'+(it[1]==='ok'?'var(--ok)':(it[1]==='bad'?'var(--bad)':'var(--miss)'))+'">'+it[2]+'</span>'):'';
      el.insertAdjacentHTML('beforeend',tag)});
  }else if(e.type==='dnd'){
    document.querySelectorAll('.dnd-chip').forEach(function(c){
      var i=parseInt(c.getAttribute('data-i'),10),it=g.items[i];if(!it)return;
      if(it[1]==='ok')c.classList.add('ok');else if(it[1]==='bad')c.classList.add('bad');else if(it[1]==='miss')c.classList.add('miss')});
  }
}
function termOut(e,g){
  if(e.type!=='terminal'||!g)return;
  var out=$('term-out');if(!out)return;
  if(g.trap){out.innerHTML='<span class="out-err">✗ '+esc(g.trap)+'</span>';return}
  if(g.base>=0.999&&e.shell.expected){out.innerHTML='<span class="out-ok">'+e.shell.expected+'</span>';return}
  out.innerHTML='<span class="out-dim">Simulated shell: no output matched the expected action. Check the per-item notes below.</span>';
}

/* ---------- flow ---------- */
function startExam(){S.phase='exam';S.idx=0;prepExercise();renderExam();tStart()}
function prepExercise(){
  S.sel=[];S.dndAssign={};S.dndPick=null;S.checked=false;S.curHints=0;
  var e=cur();
  if(e.type==='dnd'){S.dndDisp=shuffle(e.bank.map(function(_,i){return i}))}
}
function renderExam(){
  var app=$('app');
  app.innerHTML=barHTML()+examHTML();
  $('counter').textContent='Exercise '+(S.idx+1)+' / '+EX.length;
  renderTimer();updateScore();
  var inp=$('term-in');
  if(inp)inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();doCheck()}});
}
function updateScore(){var c=$('scorechip');if(c)c.textContent='★ '+S.score.toFixed(2)+' pts'}
function warn(msg){var w=$('warnline');if(w){w.textContent='⚠ '+msg;w.classList.add('show');
  setTimeout(function(){w.classList.remove('show')},2200)}}
function doCheck(){
  if(S.checked)return;
  var g=gradeCurrent();if(g===null){warn('Select an answer first.');return}
  tAutoPause();
  S.checked=true;
  var credit=Math.max(0,g.base-HINT_PEN*S.curHints);
  S.score+=credit;
  var status=(credit>=0.999)?'full':(credit>0?'partial':'zero');
  var qi=(S.phase==='review')?S.reviewQ[S.reviewP]:S.idx;
  S.results[qi]={status:status,credit:credit,hints:S.curHints};
  updateScore();
  renderExamFeedbackOnly(g,credit,status);
}
function renderExamFeedbackOnly(g,credit,status){
  var fb=$('feedback');
  if(!fb){renderExam();var fb2=$('feedback');paint(g,credit,status,fb2);return}
  paint(g,credit,status,fb);
}
function paint(g,credit,status,fb){showFeedback(g,credit,status)}
function doHint(){
  if(S.checked)return;var e=cur();
  if(!e.hints||S.curHints>=e.hints.length)return;
  S.curHints++;var p=$('hint-panel');
  if(p){p.classList.add('show');p.innerHTML='ⓘ Hint '+S.curHints+' / '+e.hints.length+': '+e.hints[S.curHints-1]}
}
function doNext(){
  if(!S.checked)return;
  tAutoResume();
  if(S.phase==='review'){
    S.reviewP++;
    if(S.reviewP<S.reviewQ.length){prepExercise();renderReview()}
    else showResults();
    return;
  }
  if(S.idx<EX.length-1){S.idx++;prepExercise();renderExam()}
  else finalSubmit();
}
function doSkip(){
  if(S.checked)return;
  var qi=(S.phase==='review')?S.reviewQ[S.reviewP]:S.idx;
  S.results[qi]={status:'skipped',credit:0,hints:0};
  if(S.phase==='review'){
    if(S.skipped.indexOf(qi)<0)S.skipped.push(qi);
    S.reviewP++;
    if(S.reviewP<S.reviewQ.length){prepExercise();renderReview()}
    else showResults();
    return;
  }
  if(S.skipped.indexOf(S.idx)<0)S.skipped.push(S.idx);
  if(S.idx<EX.length-1){S.idx++;prepExercise();renderExam()}
  else finalSubmit();
}
function finalSubmit(){
  S.reviewQ=S.skipped.filter(function(i){return S.results[i]&&S.results[i].status==='skipped'});
  S.reviewP=0;
  if(S.reviewQ.length){S.phase='review';prepExercise();renderReview()}
  else showResults();
}
function renderReview(){
  var app=$('app');app.innerHTML=barHTML()+examHTML();
  $('counter').textContent='Review skipped '+(S.reviewP+1)+' / '+S.reviewQ.length;
  renderTimer();updateScore();
  var inp=$('term-in');
  if(inp)inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();doCheck()}});
}
function forceFinish(){
  if(S.phase==='exam'&&!S.checked){S.results[S.idx]={status:'skipped',credit:0,hints:0};
    if(S.skipped.indexOf(S.idx)<0)S.skipped.push(S.idx)}
  showResults();
}

/* ---------- results + reporting ---------- */
function showResults(){
  S.phase='results';tEnd();
  $('pause-ov').classList.remove('show');document.body.classList.remove('blurred');
  var answered=0,full=0,part=0,zero=0,skipN=0,partSum=0;
  for(var i=0;i<EX.length;i++){var r=S.results[i]||{status:'skipped',credit:0};
    if(r.status==='skipped'){skipN++;continue}
    answered++;
    if(r.status==='full')full++;else if(r.status==='partial'){part++;partSum+=r.credit}else zero++}
  var rounded=Math.round(S.score);
  var percent=answered>0?Math.round(rounded/answered*100):0;
  var passed=percent>=META.passMark;
  var partAvg=part>0?(partSum/part):0;
  var h='<main class="wrap"><section class="card"><h2>Results — '+esc(META.objectName)+'</h2>'
   +'<div class="res-hero"><div class="res-pct '+(passed?'pass':'fail')+'" id="final-pct">0%</div>'
   +'<div><span class="badge '+(passed?'sev-easy':'sev-xhard')+'">'+(passed?'✓ Passed':'✗ Not passed')+'</span>'
   +'<p class="muted">Pass mark: '+META.passMark+'% · Points: '+rounded+' of '+answered+' answered exercise'+(answered===1?'':'s')+' · Skipped-and-never-answered exercises are excluded.</p></div></div>'
   +'<div class="res-grid">'
   +'<div class="res-box b-full"><div class="n">'+full+'</div><div class="t">✓ Fully correct</div></div>'
   +'<div class="res-box b-part"><div class="n">'+part+'</div><div class="t">✓ Partially correct — average partial credit '+partAvg.toFixed(2)+'</div></div>'
   +'<div class="res-box b-zero"><div class="n">'+zero+'</div><div class="t">✗ Fully incorrect</div></div>'
   +'<div class="res-box b-skip"><div class="n">'+skipN+'</div><div class="t">⚠ Skipped &amp; never answered (excluded)</div></div>'
   +'</div>'
   +'<div class="res-time"><span class="chip">▶ Running: '+fmt(T.tRun)+'</span>'
   +'<span class="chip">⏸ Paused by you: '+fmt(T.tMan)+'</span>'
   +'<span class="chip">⏳ Paused for feedback: '+fmt(T.tAuto)+'</span>'
   +'<span class="chip">⏱ Total: '+fmt(T.tRun+T.tMan+T.tAuto)+'</span></div>'
   +'<div class="actrow"><button type="button" class="btn btn-primary" data-act="retake">↻ Retake</button></div>'
   +'</section></main>';
  $('app').innerHTML=h;
  var done=false;
  function settle(){if(done)return;done=true;postReport(rounded,answered,percent,passed)}
  var reduced=false;
  try{reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(err){}
  var el=$('final-pct');
  if(reduced||!el){if(el)el.textContent=percent+'%';settle();return}
  var t0=null,dur=1100;
  requestAnimationFrame(function step(ts){
    if(t0===null)t0=ts;var k=Math.min(1,(ts-t0)/dur);
    el.textContent=Math.round(percent*(1-Math.pow(1-k,3)))+'%';
    if(k<1)requestAnimationFrame(step);else settle();
  });
}
function postReport(score,total,percent,passed){
  if(S.postSent)return;S.postSent=true;
  try{(window.parent===window?window:window.parent).postMessage(
    {type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,difficulty:META.difficulty,
     score:score,total:total,percent:percent,passed:passed},
    S.hostOrigin||location.origin)}catch(e){}
}
function doRetake(){
  S.phase='intro';S.idx=0;S.score=0;S.results=[];S.skipped=[];S.reviewQ=[];S.reviewP=0;
  S.postSent=false;S.sel=[];S.dndAssign={};S.dndPick=null;S.checked=false;S.curHints=0;
  if(T.iv){clearInterval(T.iv);T.iv=null}
  T.state='IDLE';T.remaining=META.timerMinutes*60;T.tRun=0;T.tMan=0;T.tAuto=0;T.resumeTo='RUNNING';
  renderIntro();
}

/* ---------- app ---------- */
function renderIntro(){
  $('app').innerHTML='<main class="wrap">'+introHTML()+'</main>';
  window.scrollTo(0,0);
}
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act');
  if(act==='start'){startExam();window.scrollTo(0,0)}
  else if(act==='sc-toggle'){var b=document.querySelector('.sc-body');
    var open=b.classList.toggle('sc-open');el.textContent=open?'Hide scenario ▴':'Show full scenario ▾'}
  else if(act==='opt'){if(S.checked)return;var i=parseInt(el.getAttribute('data-i'),10);
    var e=cur();
    if(e.type==='single'){S.sel=[i]}
    else{var p=S.sel.indexOf(i);if(p>=0)S.sel.splice(p,1);else S.sel.push(i)}
    document.querySelectorAll('.opt').forEach(function(o){
      var oi=parseInt(o.getAttribute('data-i'),10);
      o.classList.toggle('picked',S.sel.indexOf(oi)>=0);
      o.setAttribute('aria-pressed',S.sel.indexOf(oi)>=0)})}
  else if(act==='check'){doCheck()}
  else if(act==='hint'){doHint()}
  else if(act==='pause'){tPauseManual()}
  else if(act==='resume'){tResumeManual()}
  else if(act==='skip'){doSkip()}
  else if(act==='next'){doNext()}
  else if(act==='review-leave'){doSkip()}
  else if(act==='retake'){doRetake();window.scrollTo(0,0)}
  else if(act==='dnd-pick'){
    if(S.checked)return;
    var di=parseInt(el.getAttribute('data-i'),10);
    if(S.dndAssign[di]!==undefined&&S.dndAssign[di]!==null&&S.dndAssign[di]>=0){
      S.dndAssign[di]=null;S.dndPick=null}
    else{S.dndPick=(S.dndPick===di?null:di)}
    reRenderDnd()}
  else if(act==='dnd-zone'){
    if(S.checked)return;
    var z=parseInt(el.getAttribute('data-zone')||el.closest('[data-zone]').getAttribute('data-zone'),10);
    if(S.dndPick===null){warn('Pick an item first, then click a box.')}
    else{S.dndAssign[S.dndPick]=z;S.dndPick=null;reRenderDnd()}}
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&T.state==='PAUSED_MANUAL'){tResumeManual()}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target&&ev.target.closest&&ev.target.closest('[data-act="dnd-zone"]')){
    ev.preventDefault();
    if(S.checked)return;
    var z=parseInt(ev.target.closest('[data-act="dnd-zone"]').getAttribute('data-zone'),10);
    if(S.dndPick===null){warn('Pick an item first, then click a box.')}
    else{S.dndAssign[S.dndPick]=z;S.dndPick=null;reRenderDnd()}
  }
});
function reRenderDnd(){var e=cur();
  var holder=document.querySelector('.blk-answer');if(!holder)return;
  holder.innerHTML='<div class="lbl">◈ YOUR ANSWER</div>'+dndHTML(e)}
/* drag-and-drop native events */
document.addEventListener('dragstart',function(ev){
  var t=ev.target.closest&&ev.target.closest('.dnd-chip');
  if(t){ev.dataTransfer.setData('text/plain',t.getAttribute('data-i'))}});
document.addEventListener('dragover',function(ev){
  var z=ev.target.closest&&ev.target.closest('.dnd-zone');
  if(z){ev.preventDefault();z.classList.add('over')}});
document.addEventListener('dragleave',function(ev){
  var z=ev.target.closest&&ev.target.closest('.dnd-zone');
  if(z){z.classList.remove('over')}});
document.addEventListener('drop',function(ev){
  var z=ev.target.closest&&ev.target.closest('.dnd-zone');
  if(z){ev.preventDefault();z.classList.remove('over');
    if(S.checked)return;
    var i=parseInt(ev.dataTransfer.getData('text/plain'),10);
    if(!isNaN(i)){S.dndAssign[i]=parseInt(z.getAttribute('data-zone'),10);S.dndPick=null;reRenderDnd()}}});
/* host handshake: CYBERPULSE_INIT and CYBERMASTERY_INIT are both accepted; theme is ignored (dark-only file) */
window.addEventListener('message',function(ev){
  var d=ev.data||{};
  if(d.type==='CYBERPULSE_INIT'||d.type==='CYBERMASTERY_INIT'){
    S.hostOrigin=ev.origin||null;
    try{(window.parent===window?window:window.parent).postMessage(
      {type:'CYBERPULSE_READY',topicId:META.topicId,batch:META.batch,difficulty:META.difficulty},
      S.hostOrigin||location.origin)}catch(e){}
  }
});
document.addEventListener('DOMContentLoaded',function(){renderIntro()});
})();

</script>
