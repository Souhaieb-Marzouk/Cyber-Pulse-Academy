window.__EXAM__={"meta": {"topicId": "t1098.006", "batch": 2, "title": "T1098.006 Account Manipulation: Additional Container Cluster Roles — MEDIUM", "difficulty": "medium", "questionCount": 15, "estimatedMinutes": 35, "passMark": 70}, "sevKey": "medium", "sevWord": "MEDIUM", "objId": "T1098.006", "objName": "Account Manipulation: Additional Container Cluster Roles", "timerMinutes": 35, "estimatedMinutes": 35, "typeList": ["Single-choice questions", "Multi-select with partial credit", "Matching pairs", "Drag & drop into zones", "Fill-in-the-blank (word bank with decoys)", "Ordering (incident-response steps)", "One terminal command — tool named, options are yours"], "intro": {"title": "T1098.006 — MEDIUM practice exam", "subtitle": "Account Manipulation: Additional Container Cluster Roles — two-step reasoning for working analysts", "objType": "Sub-Technique (child of T1098 — Account Manipulation)", "learn": "\n<p>This exam is about <b>T1098.006 — Additional Container Cluster Roles<\/b>, a <b>sub-technique<\/b> of <b>T1098 — Account Manipulation<\/b> in MITRE ATT&CK. You already know the basics; here you connect two ideas at a time, the way a working analyst does. The behaviour: an attacker with enough permissions creates a <b>RoleBinding<\/b> or <b>ClusterRoleBinding<\/b> in a container orchestration system (for example Kubernetes) to give an account they control more roles — or, where <b>ABAC<\/b> is in use, edits the ABAC policy. The goal is <b>Persistence<\/b> and <b>Privilege Escalation<\/b>.<\/p>\n<p>You will practise the tasks that <b>SOC analysts<\/b> and <b>detection engineers<\/b> do with this object every week. You will read <b>Kubernetes API server audit logs<\/b> and decide which fields matter. You will tell sibling sub-techniques apart — <b>T1098.001 Additional Cloud Credentials<\/b>, <b>T1098.003 Additional Cloud Roles<\/b> — because in managed clusters (<b>GKE, EKS, AKS<\/b>) the ATT&CK page says this technique may be used <b>together with T1098.003<\/b>. You will draft report sentences with the right IDs, build a small detection rule, plan first-response steps, and reproduce an attacker command in a safe lab shell so you understand exactly what the alert shows.<\/p>\n<p>The tools and documents of this work: <b>kubectl<\/b>, audit-log pipelines, your SIEM, the ATT&CK detection strategy <b>DET0572<\/b> with its analytic <b>AN1579<\/b> (high-privilege roles assigned <b>outside CI/CD automation<\/b> or from <b>unknown IPs<\/b>), and the mitigations <b>M1018<\/b> and <b>M1032<\/b>. The risk you are defending against: a quiet RBAC backdoor that survives password resets, container restarts and even node replacement, because it lives in the cluster's authorisation layer.<\/p>\n", "keywords": "\n<div class=\"kwtheme\"><h4>🗂 Adversary behaviour &amp; siblings<\/h4><ul>\n<li>Create / patch <span class=\"mono\">RoleBinding<\/span> and <span class=\"mono\">ClusterRoleBinding<\/span>; bind <span class=\"mono\">cluster-admin<\/span><\/li>\n<li>ABAC policy modification where ABAC is in use<\/li>\n<li>Siblings: <span class=\"mono\">T1098.001<\/span> cloud credentials, <span class=\"mono\">T1098.003<\/span> cloud roles — and the managed-cloud pairing note (GKE / EKS / AKS)<\/li>\n<\/ul><\/div>\n<div class=\"kwtheme\"><h4>📡 Telemetry &amp; fields<\/h4><ul>\n<li>API server audit log fields: <span class=\"mono\">user.username<\/span>, <span class=\"mono\">verb<\/span>, <span class=\"mono\">objectRef.resource<\/span>, <span class=\"mono\">requestObject.roleRef<\/span>, <span class=\"mono\">requestObject.subjects<\/span>, <span class=\"mono\">sourceIPs<\/span><\/li>\n<li>Managed-cluster log routing: EKS control-plane logging, GKE Cloud Audit Logs, AKS diagnostics<\/li>\n<\/ul><\/div>\n<div class=\"kwtheme\"><h4>🔍 Detection logic<\/h4><ul>\n<li><b>DET0572 / AN1579<\/b>: high-privilege assignment, outside CI/CD automation, unknown IPs<\/li>\n<li>False-positive profile: GitOps / CI/CD identities, change windows, trusted subnets<\/li>\n<li>Read verbs (get, list, watch) vs write verbs (create, patch)<\/li>\n<\/ul><\/div>\n<div class=\"kwtheme\"><h4>🛡 Mitigations &amp; response<\/h4><ul>\n<li><b>M1018<\/b> least privilege for account management; <b>M1032<\/b> MFA for federated accounts<\/li>\n<li>Incident-response order: preserve evidence, understand, revoke, hunt<\/li>\n<\/ul><\/div>\n", "how": "\n<p><b>Goal:<\/b> reach at least <b>70%<\/b> — that is a PASS. Below that is a FAIL; retaking reshuffles everything.<\/p>\n<p><b>Exercise types in this file:<\/b><\/p>\n<ul class=\"howlist\">\n<li>Single-choice questions with realistic near-miss distractors.<\/li>\n<li>Multi-select — choose all that apply, scored with <b>partial credit<\/b>.<\/li>\n<li>Matching pairs and drag &amp; drop into zones (partial credit per item).<\/li>\n<li>Fill-in-the-blank with a shuffled word bank that contains decoys.<\/li>\n<li>Ordering — put response steps in the right order (partial credit per position).<\/li>\n<li>One terminal exercise: the tool (<span class=\"mono\">kubectl<\/span>) is named, but you choose the options yourself. Nothing real is executed; there is no syntax panel this time.<\/li>\n<\/ul>\n<p><b>Scoring:<\/b> each exercise is worth at most 1 point; multi-part exercises score <code>(H − W) / N<\/code>. One hint per exercise costs 10% of that exercise's credit.<\/p>\n<p><b>Timer:<\/b> <b>35 minutes<\/b>. <b>Check<\/b> pauses the clock automatically for unlimited review; <b>Next<\/b> restarts it. <b>Pause<\/b> hides the exercise for a manual break. <b>Skip<\/b> moves an exercise to the review pool; skipped-and-never-answered exercises are excluded from the final score.<\/p>\n"}, "exercises": [{"id": "m01", "type": "multi", "scen": [{"k": "p", "t": "An audit line from the production cluster. You are building the detection logic, so you must know which fields describe the object that was created — and which fields only describe who and where."}, {"k": "art", "label": "ARTEFACT 1 — API server audit log (1 line)", "kind": "log", "lines": ["{\"level\":\"Metadata\",\"auditID\":\"a1b2c3d4-0001\",\"stage\":\"ResponseComplete\",\"requestURI\":\"/apis/rbac.authorization.k8s.io/v1/clusterrolebindings\",\"verb\":\"create\",\"sourceIPs\":[\"203[.]0[.]113[.]77\"],\"user\":{\"username\":\"dev-sam\",\"groups\":[\"system:authenticated\"]},\"objectRef\":{\"resource\":\"clusterrolebindings\",\"name\":\"stage-admin-2\"},\"requestObject\":{\"roleRef\":{\"kind\":\"ClusterRole\",\"name\":\"cluster-admin\",\"apiGroup\":\"rbac.authorization.k8s.io\"},\"subjects\":[{\"kind\":\"ServiceAccount\",\"name\":\"svc-maint\",\"namespace\":\"default\"}]},\"responseStatus\":{\"code\":201}}"]}], "scenSum": "Which fields show WHAT was created?", "q": "Select every field that shows WHAT was created.", "options": [{"t": "verb is create", "ok": true}, {"t": "objectRef.resource is clusterrolebindings", "ok": true}, {"t": "requestObject.roleRef.name is cluster-admin", "ok": true}, {"t": "requestObject subject is ServiceAccount svc-maint", "ok": true}, {"t": "sourceIPs contains 203[.]0[.]113[.]77", "ok": false}, {"t": "user.groups contains system:authenticated", "ok": false}], "hint": "Two fields say that something was created; two fields say which role and which account the new binding connects. The last two options describe who and from where.", "expl": "The creation story lives in four places: verb=create (an object was made), objectRef.resource=clusterrolebindings (which kind), requestObject.roleRef.name=cluster-admin (which role was granted), and the subjects entry (which account received it). sourceIPs and user.groups describe the WHO and WHERE — they matter for the unknown-IP clause of AN1579, but they do not say what was created.", "study": "Map one audit line to the AN1579 clause list: verb, resource, roleRef, subjects, then identity and IP as context."}, {"id": "m02", "type": "dnd", "scen": [{"k": "p", "t": "Five alerts from the T1098 family arrived overnight. The cloud team and the container team both want correct routing before the morning stand-up."}, {"k": "art", "label": "ARTEFACT 1 — Sibling sub-techniques (ATT&CK excerpt)", "kind": "code", "lines": ["T1098.001  Additional Cloud Credentials", "T1098.003  Additional Cloud Roles", "T1098.006  Additional Container Cluster Roles"]}], "scenSum": "Route five T1098 alerts to the right sub-technique", "q": "Drag each alert to the sub-technique it matches.", "zones": [{"id": "z1", "label": "T1098.006 — container cluster roles"}, {"id": "z2", "label": "T1098.003 — cloud roles"}, {"id": "z3", "label": "T1098.001 — cloud credentials"}], "items": [{"t": "ClusterRoleBinding created in an EKS cluster", "zone": "z1", "why": "A binding on the cluster authorisation layer is the signature of T1098.006."}, {"t": "cluster-admin bound to a ServiceAccount in GKE", "zone": "z1", "why": "Same object family in another managed cluster — still T1098.006."}, {"t": "Global Administrator role assigned in Entra ID", "zone": "z2", "why": "A cloud identity-plane role grant is T1098.003, not the container technique."}, {"t": "AdministratorAccess IAM policy attached to a user", "zone": "z2", "why": "IAM policy attachment is a cloud role change — T1098.003."}, {"t": "New long-term access key created for an IAM user", "zone": "z3", "why": "Adding a credential (a key) to an account is T1098.001."}], "hint": "Container bindings are local Kubernetes objects. Entra ID and IAM policy changes are cloud-side role changes; a new key is a credential.", "expl": "The layer decides the sub-technique: Kubernetes RBAC objects (bindings) are T1098.006; cloud identity roles and policies are T1098.003; new keys or tokens on cloud accounts are T1098.001. In managed clusters the ATT&CK page explicitly notes the container technique may be used in conjunction with Additional Cloud Roles — so expect both alerts in one real incident.", "study": "Keep a one-line definition per T1098 sub-technique; route alerts by the layer the object lives in."}, {"id": "m03", "type": "qcm", "scen": [{"k": "p", "t": "Two lines reached your SIEM rule at the same minute. Your tuning decision today decides which one pages the on-call analyst."}, {"k": "art", "label": "ARTEFACT 1 — Two audit lines", "kind": "log", "lines": ["L1 {\"sourceIPs\":[\"10[.]201[.]4[.]18\"],\"user\":{\"username\":\"system:serviceaccount:ci:deploy-bot\"},\"verb\":\"create\",\"objectRef\":{\"resource\":\"rolebindings\",\"namespace\":\"payments\",\"name\":\"deploy-reader-binding\"},\"requestObject\":{\"roleRef\":{\"kind\":\"Role\",\"name\":\"deploy-reader\"}},\"responseStatus\":{\"code\":201}}", "L2 {\"sourceIPs\":[\"203[.]0[.]113[.]50\"],\"user\":{\"username\":\"svc-backup\"},\"verb\":\"create\",\"objectRef\":{\"resource\":\"clusterrolebindings\",\"name\":\"backup-admin\"},\"requestObject\":{\"roleRef\":{\"kind\":\"ClusterRole\",\"name\":\"cluster-admin\"}},\"responseStatus\":{\"code\":201}}"]}], "scenSum": "Which line should AN1579 prioritise?", "q": "Which line should analytic AN1579 prioritise, and why?", "options": [{"t": "Line B — high-privilege role, no CI/CD context, unknown IP", "ok": true}, {"t": "Line A — RoleBinding is always more serious than ClusterRoleBinding", "ok": false}, {"t": "Line A — payments is a regulated namespace", "ok": false}, {"t": "Both equally — any rolebinding creation is critical", "ok": false}], "hint": "Read the analytic once more: high-privilege role + outside CI/CD automation + unknown IPs. Test each line against all three clauses.", "expl": "Line B hits every clause: the role is cluster-admin, the user is not a known automation identity, and the source IP is external to your ranges. Line A is a low-privilege namespaced binding from the CI subnet by the deploy bot — the definition of expected automation. The two wrong claims are common traps: RoleBinding is not 'always more serious' (scope of the role matters more), and a regulated namespace alone does not raise severity.", "study": "DET0572 / AN1579 wording on the ATT&CK page — tune your rule to its three clauses and you inherit its false-positive profile."}, {"id": "m04", "type": "fill", "scen": [{"k": "p", "t": "You are drafting the CTI note that goes to the CISO with the morning coffee. The style guide forbids vague words — the exact ATT&CK names must appear."}, {"k": "art", "label": "ARTEFACT 1 — Draft with blanks", "kind": "code", "lines": ["CTI note — draft 1", "On 12 May, attackers with access to a compromised [1] account", "created a [2] binding the built-in [3] ClusterRole to their", "ServiceAccount. ATT&CK tracks this behaviour as [4], a", "sub-technique of [5]."]}], "scenSum": "Complete the CTI note with exact ATT&CK names", "q": "Fill every blank in the CTI note using the word bank.", "text": ["CTI note: On 12 May, attackers with access to a compromised ", {"b": 0}, " account created a ", {"b": 1}, " binding the built-in ", {"b": 2}, " ClusterRole to their own ServiceAccount. ATT&CK tracks this behaviour as ", {"b": 3}, ", a sub-technique of ", {"b": 4}, "."], "blanks": ["ServiceAccount", "ClusterRoleBinding", "cluster-admin", "T1098.006", "T1098"], "bank": ["ServiceAccount", "ClusterRoleBinding", "cluster-admin", "T1098.006", "T1098", "T1098.003", "ConfigMap", "Secret"], "hint": "Two blanks are ATT&CK IDs — one is the sub-technique, one is its parent. The account type is the identity workloads use.", "expl": "The identity workloads use is a ServiceAccount; the object that binds across the cluster is a ClusterRoleBinding; the strongest built-in ClusterRole is cluster-admin. ATT&CK IDs: T1098.006 is the sub-technique, T1098 the parent. T1098.003 is a sibling about cloud roles — a tempting but wrong ID in a container-cluster story.", "study": "Write one ATT&CK-style sentence per incident: behaviour, object, ID, parent. Reports and tickets both improve."}, {"id": "m05", "type": "match", "scen": [{"k": "p", "t": "New teammate onboarding day. She asks what the five IDs on the whiteboard mean. Build the matching card for her."}, {"k": "art", "label": "ARTEFACT 1 — IDs on the whiteboard", "kind": "code", "lines": ["T1098.006    DET0572    AN1579    M1018    M1032"]}], "scenSum": "Match the five IDs to their definitions", "q": "Match each ID to its definition.", "lefts": [{"t": "T1098.006", "why": "The sub-technique itself: adding roles or permissions to accounts in a container orchestration system."}, {"t": "DET0572", "why": "The detection strategy: suspicious RoleBinding or ClusterRoleBinding assignment in Kubernetes."}, {"t": "AN1579", "why": "The analytic inside DET0572: high-privilege role assigned outside CI/CD automation or from unknown IPs."}, {"t": "M1018", "why": "User Account Management: low-privileged accounts must not be able to add permissions or update container cluster roles."}, {"t": "M1032", "why": "Multi-factor Authentication: require MFA for accounts integrated via cloud deployments, LDAP or SAML."}], "rights": ["Sub-technique: adding roles to accounts in a container orchestration system", "Detection strategy: suspicious RoleBinding / ClusterRoleBinding assignment", "Analytic: high-privilege assignment outside CI/CD or from unknown IPs", "Mitigation: low-privileged accounts cannot add permissions to accounts", "Mitigation: MFA for accounts integrated via cloud, LDAP or SAML"], "pairs": [[0, 0], [1, 1], [2, 2], [3, 3], [4, 4]], "hint": "T marks a technique, DET a detection strategy, AN the analytic inside it, M a mitigation.", "expl": "The ATT&CK prefix tells you the object family before you read anything else. T1098.006 is the behaviour; DET0572 is the strategy that watches for it; AN1579 is the concrete logic inside that strategy; M1018 and M1032 are the two mitigations the page lists. One sub-technique, one detection strategy, one analytic, two mitigations — that is the whole official map of this object.", "study": "Read ID prefixes on sight: T / DET / AN / M. It speeds up every ATT&CK conversation."}, {"id": "m06", "type": "term", "scen": [{"k": "p", "t": "Red-team awareness drill. The alert from last night showed a RoleBinding being created in the <b>prod<\/b> namespace. You will reproduce exactly that in the training cluster so the team understands the telemetry. The Role is <span class=\"mono\">deploy-manager<\/span>, the ServiceAccount is <span class=\"mono\">release-bot<\/span> (both in prod), and the new binding should be named <span class=\"mono\">release-bot-binding<\/span>."}, {"k": "art", "label": "ARTEFACT 1 — Goal summary", "kind": "code", "lines": ["namespace : prod", "bind Role deploy-manager  ->  ServiceAccount prod/release-bot", "binding name: release-bot-binding"]}], "scenSum": "Reproduce the alerted RoleBinding in the lab", "q": "Type the single kubectl command that creates this RoleBinding, then run it and press Check.", "term": {"prompt": "analyst@lab-jump:~$", "canonical": "kubectl create rolebinding release-bot-binding --role=deploy-manager --serviceaccount=prod:release-bot -n prod", "setup": "context: training-cluster · your user may create rolebindings in prod (lab)", "elements": [{"re": "\\bkubectl\\b", "desc": "the tool: kubectl"}, {"re": "\\bcreate\\b", "desc": "the action: create (not apply, not delete)"}, {"re": "\\brolebinding\\b", "desc": "the object: rolebinding (a RoleBinding, not a ClusterRoleBinding)"}, {"re": "rolebinding\\s+[a-z0-9][a-z0-9-]*", "desc": "names the new binding (release-bot-binding)"}, {"re": "--role=deploy-manager\\b", "desc": "attaches the Role deploy-manager with --role"}, {"re": "--serviceaccount=prod:release-bot\\b", "desc": "binds ServiceAccount prod/release-bot with --serviceaccount=namespace:name"}, {"re": "(-n\\s+prod\\b|--namespace=prod\\b|--namespace\\s+prod\\b)", "desc": "runs inside the prod namespace (-n prod)"}], "danger": ["delete", "drain", "cordon", "taint"], "out": ["rolebinding.rbac.authorization.k8s.io/release-bot-binding created"], "err": "error: required flag(s) not set — a RoleBinding needs the role and the subject"}, "hint": "You need create + rolebinding, attach the Role with --role, the account with --serviceaccount in namespace:name form, and stay inside the prod namespace.", "expl": "Canonical command: kubectl create rolebinding release-bot-binding --role=deploy-manager --serviceaccount=prod:release-bot -n prod. From the attacker perspective this one line is the entire T1098.006 move for a namespaced grant. From the defender perspective the same line appears in the audit log as verb=create on rolebindings with those exact requestObject fields — which is why AN1579-style rules work. Note --role (a namespaced Role) versus --clusterrole; mixing them is the classic mistake.", "study": "kubectl create rolebinding flags: --role, --clusterrole, --serviceaccount, --user, --group, and the -n namespace."}, {"id": "m07", "type": "dnd", "scen": [{"k": "p", "t": "You are turning AN1579 into a real SIEM rule. First decision: which audit-log fields the rule must read. Not everything in a log line deserves a filter."}, {"k": "art", "label": "ARTEFACT 1 — AN1579 (ATT&CK excerpt)", "kind": "code", "lines": ["AN1579: Detects assignment of high-privilege roles to user", "or service accounts via Kubernetes RoleBinding or", "ClusterRoleBinding objects, especially outside of CI/CD", "automation or from unknown IPs."]}], "scenSum": "Which fields does the AN1579 rule actually need?", "q": "Drag each field to the correct side.", "zones": [{"id": "z1", "label": "Needed by the AN1579 rule"}, {"id": "z2", "label": "Not needed for this rule"}], "items": [{"t": "user.username", "zone": "z1", "why": "WHO created the binding — needed to separate automation identities from others."}, {"t": "verb (create / patch)", "zone": "z1", "why": "The rule fires on changes, not reads."}, {"t": "objectRef.resource (rolebindings / clusterrolebindings)", "zone": "z1", "why": "The object family defines the technique."}, {"t": "requestObject.roleRef.name (the role granted)", "zone": "z1", "why": "HIGH-PRIVILEGE is the key word — you must know which role was granted."}, {"t": "sourceIPs (client IP)", "zone": "z1", "why": "The unknown-IPs clause needs the source address."}, {"t": "auditID (unique log record id)", "zone": "z2", "why": "A bookkeeping field — useful to reference the event, useless as a filter."}], "hint": "The rule must know WHO, WHAT action, WHICH object, WHICH role, and FROM WHERE. One field is just a bookkeeping id.", "expl": "Each needed field maps to one clause of AN1579: identity and source IP give the automation and unknown-IP context; verb and resource give the behaviour; roleRef.name decides high-privilege. Fields like auditID, stage or responseStatus.code help later during investigation, but they do not belong in the match logic. Good detection engineering starts by reading the analytic literally.", "study": "Practise translating one analytic sentence into a field list — then into SIEM filters."}, {"id": "m08", "type": "qcm", "scen": [{"k": "p", "t": "GKE incident review. The adversary bound a role inside the cluster AND edited IAM bindings on the Google Cloud side. Your lead asks what ATT&CK says about that combination."}, {"k": "art", "label": "ARTEFACT 1 — ATT&CK note (excerpt)", "kind": "code", "lines": ["...where container orchestration systems are deployed in cloud", "environments, as with Google Kubernetes Engine, Amazon Elastic", "Kubernetes Service, and Azure Kubernetes Service, cloud-based", "RBAC assignments or ABAC policies can often be used in place of", "or in addition to local permission assignments."]}], "scenSum": "Which sibling may be used together with T1098.006 in managed clouds?", "q": "Per the ATT&CK page, which sub-technique may T1098.006 be used together with in managed clouds like GKE?", "options": [{"t": "T1098.003 — Additional Cloud Roles", "ok": true}, {"t": "T1098.004 — SSH Authorized Keys", "ok": false}, {"t": "T1098.005 — Device Registration", "ok": false}, {"t": "None — the techniques are mutually exclusive", "ok": false}], "hint": "The note says cloud-based RBAC can be used in place of or in addition to local assignments. Which sibling covers cloud-based role changes?", "expl": "The page's note is explicit: in GKE, EKS and AKS the attacker can work at both layers — the cluster's own RBAC (T1098.006) and the cloud IAM plane (T1098.003, Additional Cloud Roles). That is why container incidents must include a cloud IAM review. The other siblings cover SSH keys, device registration, and other account manipulations unrelated to this pairing.", "study": "The third paragraph of the T1098.006 description — the managed-cloud note. Quote it in cloud incident reports."}, {"id": "m09", "type": "order", "scen": [{"k": "p", "t": "A rogue ClusterRoleBinding was confirmed twenty minutes ago on the payments cluster. You have five candidate actions in the runbook. The order matters — the first wrong move destroys evidence."}, {"k": "art", "label": "ARTEFACT 1 — Runbook actions to sequence", "kind": "code", "lines": ["A. Remove the binding and revoke the adversary's tokens", "B. Export the relevant Kubernetes API audit logs", "C. Hunt for other rogue bindings across namespaces and clusters", "D. Save the full YAML of the suspicious binding", "E. Check which accounts and tokens the binding gives access to"]}], "scenSum": "Sequence the five response actions", "q": "Put the response steps in the correct order.", "order": [{"t": "Export the relevant Kubernetes API audit logs", "why": "Preserve first: the audit slice is the timeline; it can roll out of retention."}, {"t": "Save the full YAML of the suspicious RoleBinding / ClusterRoleBinding", "why": "Capture the object exactly as it is, including subjects and roleRef."}, {"t": "Check which accounts and tokens the binding gives access to", "why": "Understand the blast radius before you revoke anything."}, {"t": "Remove the binding and revoke the adversary's tokens", "why": "Now contain: cut the access path and evict the identity."}, {"t": "Hunt for other rogue bindings across namespaces and clusters", "why": "Attackers rarely stop at one binding — sweep the estate."}], "hint": "Evidence first, understanding second, removal third, broader hunt last.", "expl": "The order encodes one principle: irreversible actions come after capture. Exports and YAML snapshots are read-only. Checking subjects and tokens tells you what revocation actually covers. Only then do you remove the binding and rotate tokens, and finally sweep for siblings — the same pattern often appears on several clusters, which is also what the managed-cloud note implies.", "study": "Write your team's IR order for RBAC backdoors as five verbs: preserve, capture, understand, revoke, hunt."}, {"id": "m10", "type": "multi", "scen": [{"k": "p", "t": "You are updating the detection-coverage wiki page. One claim needs sourcing: which managed Kubernetes services does the ATT&CK page explicitly name?"}, {"k": "art", "label": "ARTEFACT 1 — ATT&CK description (excerpt)", "kind": "code", "lines": ["...as with Google Kubernetes Engine, Amazon Elastic Kubernetes", "Service, and Azure Kubernetes Service, cloud-based role-based", "access control (RBAC) assignments or ABAC policies can often be", "used in place of or in addition to local permission assignments."]}], "scenSum": "Which platforms does the page explicitly name?", "q": "Select every platform the ATT&CK page explicitly names.", "options": [{"t": "Google Kubernetes Engine (GKE)", "ok": true}, {"t": "Amazon Elastic Kubernetes Service (EKS)", "ok": true}, {"t": "Azure Kubernetes Service (AKS)", "ok": true}, {"t": "OpenShift", "ok": false}, {"t": "Docker Desktop", "ok": false}, {"t": "Rancher", "ok": false}], "hint": "Exactly three names appear in the page's note about cloud environments.", "expl": "The description names GKE, EKS and AKS — the three big managed services. That matters for coverage planning: your detection and mitigation story must cover the cluster layer AND the cloud identity layer on all three. OpenShift, Docker Desktop and Rancher are real platforms but the page does not name them — citing them as 'per ATT&CK' would be wrong in a formal report.", "study": "Quote only what the page states. For unnamed platforms, cite the vendor docs instead."}, {"id": "m11", "type": "qcm", "scen": [{"k": "p", "t": "02:41 UTC. A RoleBinding creation fired your new rule. Check the facts against the change calendar before you page anyone."}, {"k": "art", "label": "ARTEFACT 1 — Audit line", "kind": "log", "lines": ["{\"sourceIPs\":[\"10[.]201[.]4[.]18\"],\"user\":{\"username\":\"system:serviceaccount:ci:deploy-bot\"},\"verb\":\"create\",\"objectRef\":{\"resource\":\"rolebindings\",\"namespace\":\"prod\",\"name\":\"deploy-reader-binding\"},\"requestObject\":{\"roleRef\":{\"kind\":\"Role\",\"name\":\"deploy-reader\"},\"subjects\":[{\"kind\":\"ServiceAccount\",\"name\":\"ci-deploy\",\"namespace\":\"ci\"}]},\"responseStatus\":{\"code\":201}}"]}, {"k": "art", "label": "ARTEFACT 2 — Change calendar", "kind": "code", "lines": ["01:00-03:00 UTC  deploy window #441 (approved, CR-2291)", "deploy-bot       trusted CI identity, subnet 10[.]201[.]4[.]0/24", "deploy-reader    low-privilege read role, used by every deploy"]}], "scenSum": "Benign or suspicious? Judge the CI/CD binding", "q": "What is the best judgement for this alert?", "options": [{"t": "Expected — CI/CD automation, low-privilege role, trusted subnet, approved window", "ok": true}, {"t": "Rogue binding — isolate the production cluster immediately", "ok": false}, {"t": "Wrong technique — this is T1059, not T1098.006", "ok": false}, {"t": "Undecidable — audit logs cannot show RoleBindings", "ok": false}], "hint": "Test the line against each AN1579 clause: privilege, automation context, source reputation. Then look at the calendar.", "expl": "Every clause points to benign: the role deploy-reader is low privilege, the creator is the trusted CI identity, the IP is inside the CI subnet, and the creation sits in an approved change window. This is exactly the false-positive profile AN1579 was written ag /* ===================== ANSWER <-> SCORING ===================== */
function haveAnswer(ex,idx){
  var a=S.answers[idx];
  if(!a) return false;
  switch(ex.type){
    case 'qcm': return a.sel!==undefined;
    case 'multi': return a.sel&&Object.keys(a.sel).length>0;
    case 'match': return a.assign&&Object.keys(a.assign).length>0;
    case 'dnd': return a.place&&Object.keys(a.place).some(function(k){ return a.place[k]; });
    case 'order': return true;
    case 'fill': return a.fills&&Object.keys(a.fills).length>0;
    case 'term': return !!(a.cmd&&a.cmd.trim());
    case 'branch': return Object.keys(a.choices).length===ex.steps.length;
  }
  return false;
}
function grade(ex,idx){
  var a=S.answers[idx]||{};
  var items=[]; var H=0,W=0,N=0;
  switch(ex.type){
    case 'qcm': {
      N=1;
      var pick=a.sel, ok=false;
      if(pick!==undefined){ ok=!!ex.options[pick].ok; H=ok?1:0; }
      items.push({st:pick===undefined?'○ Missed — nothing selected':(ok?'✓ Correct — you picked the right option':'✗ Wrong — that option is not correct'),cls:pick===undefined?'miss':(ok?'ok':'bad')});
      break; }
    case 'multi': {
      var sel=a.sel||{};
      N=ex.options.filter(function(o){return o.ok;}).length;
      ex.options.forEach(function(o,oi){
        var s=!!sel[oi];
        if(o.ok&&s){H++; items.push({st:'✓ Correct — selected: '+o.t,cls:'ok'});}
        else if(!o.ok&&s){W++; items.push({st:'✗ Wrong — selected: '+o.t,cls:'bad'});}
        else if(o.ok&&!s){items.push({st:'○ Missed — correct option not selected: '+o.t,cls:'miss'});}
      });
      break; }
    case 'match': {
      var as=a.assign||{};
      N=ex.pairs.length;
      ex.pairs.forEach(function(pr){
        var li=pr[0], want=pr[1], got=as[li];
        var ltxt=ex.lefts[li].t;
        if(got===undefined){ items.push({st:'○ Missed — '+ltxt+' left unmatched (correct: '+ex.rights[want]+')',cls:'miss',why:ex.lefts[li].why}); }
        else if(got===want){ H++; items.push({st:'✓ Correct — '+ltxt+' → '+ex.rights[want],cls:'ok',why:ex.lefts[li].why}); }
        else { W++; items.push({st:'✗ Wrong — '+ltxt+' → '+ex.rights[got]+' (correct: '+ex.rights[want]+')',cls:'bad',why:ex.lefts[li].why}); }
      });
      break; }
    case 'dnd': {
      var pl=a.place||{};
      N=ex.items.length;
      ex.items.forEach(function(it,ii){
        var want=it.zone, got=pl[ii];
        var zoneName=function(zid){ var z=ex.zones.filter(function(z){return z.id===zid;})[0]; return z?z.label:zid; };
        if(got===undefined||got===null){ items.push({st:'○ Missed — "'+it.t+'" left in the bank (correct zone: '+zoneName(want)+')',cls:'miss',why:it.why}); }
        else if(got===want){ H++; items.push({st:'✓ Correct — "'+it.t+'" in '+zoneName(want),cls:'ok',why:it.why}); }
        else { W++; items.push({st:'✗ Wrong — "'+it.t+'" placed in '+zoneName(got)+' (correct: '+zoneName(want)+')',cls:'bad',why:it.why}); }
      });
      break; }
    case 'order': {
      var seq=a.seq||[];
      N=ex.order.length;
      seq.forEach(function(ii,pos){
        var want=ii, got=pos;
        if(got===want){H++; items.push({st:'✓ Correct at position '+(pos+1)+' — '+ex.order[ii].t,cls:'ok',why:ex.order[ii].why});}
        else {W++; items.push({st:'✗ Wrong position '+(got+1)+' — '+ex.order[ii].t+' belongs at position '+(want+1),cls:'bad',why:ex.order[ii].why});}
      });
      break; }
    case 'fill': {
      var fs=a.fills||{};
      N=ex.blanks.length;
      ex.blanks.forEach(function(want,b){
        var raw=fs[b];
        var got=(raw===undefined||raw===null)?'':String(raw).replace(/\s+/g,' ').trim().toLowerCase();
        var w=String(want).toLowerCase();
        if(got===''){ items.push({st:'○ Missed — blank '+(b+1)+' empty (correct: '+want+')',cls:'miss'}); }
        else if(got===w){ H++; items.push({st:'✓ Correct — blank '+(b+1)+': '+got,cls:'ok'}); }
        else { W++; items.push({st:'✗ Wrong — blank '+(b+1)+': you used "'+got+'", correct is "'+want+'"',cls:'bad'}); }
      });
      break; }
    case 'term': {
      var t=ex.term; var cmd=normCmd(a.cmd||'');
      N=t.elements.length;
      var dangerHit=false;
      t.danger.forEach(function(d){ if(cmd.indexOf(d)>-1) dangerHit=true; });
      t.elements.forEach(function(el){
        var re=new RegExp(el.re,'i');
        if(re.test(cmd)){ H++; items.push({st:'✓ Correct element — '+el.desc,cls:'ok'}); }
        else { items.push({st:'○ Missed element — '+el.desc,cls:'miss'}); }
      });
      var extras=extraTokens(cmd,t);
      extras.forEach(function(x){ W++; items.push({st:'✗ Wrong/extra element — '+x,cls:'bad'}); });
      if(dangerHit) items.push({st:'✗ DANGEROUS — NEAR MISS: your command changes cluster state or destroys evidence. In a real incident this would be the wrong move.',cls:'bad'});
      break; }
    case 'branch': {
      var ch=a.choices||{};
      N=ex.steps.length;
      ex.steps.forEach(function(st,si){
        var got=ch[si], okIdx=st.options.map(function(o,i){return o.ok?i:-1;}).filter(function(x){return x>-1;})[0];
        var okT=st.options[okIdx].t;
        if(got===undefined){ items.push({st:'○ Missed — step '+(si+1)+' never confirmed',cls:'miss',why:st.options[okIdx].why}); }
        else if(got===okIdx){ H++; items.push({st:'✓ Correct at step '+(si+1)+' — '+okT,cls:'ok',why:st.options[okIdx].why}); }
        else { W++; items.push({st:'✗ Wrong at step '+(si+1)+' — you chose: '+st.options[got].t+' | best: '+okT,cls:'bad',why:st.options[got].why+' Best choice: '+st.options[okIdx].why}); }
      });
      break; }
  }
  var credit=scoreExercise(H,W,N);
  if(S.hintUsed[idx]) credit=Math.max(0,credit-0.10);
  return {credit:credit,items:items,N:N,H:H,W:W};
}
function normCmd(c){ return c.replace(/\s+/g,' ').trim().toLowerCase(); }
function extraTokens(cmd,t){
  var out=[];
  var tokens=cmd.split(' ');
  var matchedStr='';
  t.elements.forEach(function(el){
    try{ var m=new RegExp(el.re,'i').exec(cmd); if(m&&m[0]) matchedStr+=' '+m[0]; }catch(e){}
  });
  tokens.forEach(function(tok){
    if(tok.indexOf('-')===0){
      var base=tok.replace(/=.*$/,'');
      var inCanon=t.canonical.toLowerCase().indexOf(base)>-1;
      var inMatched=matchedStr.indexOf(tok)>-1||matchedStr.indexOf(base)>-1;
      if(!inCanon&&!inMatched&&tok!=='-') out.push('unexpected option "'+tok+'"');
    }
  });
  ['delete','remove','drain','cordon','patch','apply','replace','taint'].forEach(function(d){
    if(tokens.indexOf(d)>-1 && t.canonical.toLowerCase().indexOf(d)===-1) out.push('state-changing word "'+d+'" is not part of this read-only task');
  });
  return out.filter(function(v,i,a){ return a.indexOf(v)===i; });
}

/* ===================== FEEDBACK ===================== */
function feedbackHtml(ex,idx){
  var g=S.credits[idx]; if(!g) return '';
  var c=g.credit;
  var label,cls,icon;
  if(c>=0.999){ label='CORRECT'; cls='f-ok'; icon='✓'; }
  else if(c>0){ label='PARTIALLY CORRECT'; cls='f-part'; icon='✓'; }
  else { label='INCORRECT'; cls='f-bad'; icon='✗'; }
  var creditLine='credit '+c.toFixed(2)+' of 1.00'+(g.N>1?(' — '+Math.round(c*g.N)+' of '+g.N+' items, (H−W)/N'):' — single-answer (binary)')+(S.hintUsed[idx]?' · hint penalty applied (−0.10)':' · no hint used');
  var h='<div class="fb '+cls+'" role="region" aria-live="polite" aria-label="Feedback: '+label+'">'+
    '<div class="fbh">'+icon+' '+label+'<span class="credit">'+creditLine+'</span></div><div class="fbb">';
  if(g.N>1){ h+='<div class="items">'+g.items.map(function(it){ return '<div class="item '+it.cls+'"><span class="ic" aria-hidden="true">'+it.st.charAt(0)+'</span><span>'+esc(it.st.slice(2))+(it.why?' — <span class="muted">'+esc(it.why)+'</span>':'')+'</span></div>'; }).join('')+'</div>'; }
  else { h+='<div class="items">'+g.items.map(function(it){ return '<div class="item '+it.cls+'"><span class="ic" aria-hidden="true">'+it.st.charAt(0)+'</span><span>'+esc(it.st.slice(2))+'</span></div>'; }).join('')+'</div>'; }
  if(ex.type==='term'){
    h+='<h5>Canonical command</h5><div class="canon"><code>'+esc(ex.term.canonical)+'</code></div>';
    if(ex.term.canonExpl) h+='<p class="expl">'+ex.term.canonExpl+'</p>';
  }
  h+='<h5>Why</h5><p class="expl">'+ex.expl+'</p>';
  h+='<h5>What to study</h5><p class="study">'+esc(ex.study)+'</p></div></div>';
  return h;
}

/* ===================== NAV / ACTIONS ===================== */
function nextExercise(first){
  S.cur++;
  if(S.cur<TOTAL){ S.idx=S.order[S.cur]; S.fromReview=false; renderExam(); }
  else { S.fromReview=false; afterLast(); }
}
function afterLast(){
  if(S.skipped.length>0&&S.timer.state!=='ENDED'){ renderReview(); }
  else { endTime(); }
}
function doCheck(){
  if(S.inFeedback[S.idx]) return;
  var ex=EX.exercises[S.idx];
  if(!haveAnswer(ex,S.idx)){
    S.notice='⚠ Choose or place at least one answer first — or use Skip if you want to answer later.';
    renderExam();
    return;
  }
  S.notice='';
  setTimerState('PAUSED_AUTO_CHECK');
  var g=grade(ex,S.idx);
  S.credits[S.idx]=g; S.inFeedback[S.idx]=true;
  S.answered++; S.sum+=g.credit;
  renderExam();
}
function doNext(){
  S.notice='';
  setTimerState('RUNNING');
  if(S.fromReview){ S.fromReview=false; renderReview(); return; }
  nextExercise();
}
function doSkip(){
  if(S.inFeedback[S.idx]) return;
  S.notice='';
  if(S.skipped.indexOf(S.idx)===-1) S.skipped.push(S.idx);
  setTimerState('RUNNING');
  if(S.fromReview){ S.fromReview=false; S.skipped=S.skipped.filter(function(i){return i!==S.idx;}); S.skipped.push(S.idx); renderReview(); return; }
  S.cur++;
  if(S.cur<TOTAL){ S.idx=S.order[S.cur]; renderExam(); }
  else { afterLast(); }
}
function doHint(){
  if(S.inFeedback[S.idx]||S.hintUsed[S.idx]) return;
  S.hintUsed[S.idx]=true;
  renderExam();          /* the renderer emits the hint panel for hint-used exercises */
  updateHdr();
}
function doPause(){
  if(S.timer.state==='PAUSED_MANUAL'){ setTimerState(S.prevRunningState==='PAUSED_AUTO_CHECK'?'PAUSED_AUTO_CHECK':'RUNNING'); renderExam(); }
  else if(S.timer.state==='RUNNING'||S.timer.state==='PAUSED_AUTO_CHECK'){ S.prevRunningState=S.timer.state; setTimerState('PAUSED_MANUAL'); renderExam(); }
}
function endTime(auto){
  setTimerState('ENDED');
  renderResults();
}
/* ===================== REVIEW VIEW ===================== */
function renderReview(){
  S.view='review';
  var h='<h2 class="sec" style="color:var(--state-skipped)">⚠ Review skipped exercises</h2>'+
  '<div class="card prose"><p>You skipped '+S.skipped.length+' exercise'+(S.skipped.length===1?'':'s')+'. They are not graded yet. You can answer as many as you want while the timer still runs.</p>'+
  '<p class="muted">If you finish now, skipped exercises stay unanswered and are <b>excluded from the score</b> — they count neither for nor against you.</p></div>';
  S.skipped.forEach(function(idx){
    var ex=EX.exercises[idx];
    var answered=S.inFeedback[idx]!==undefined;
    h+='<div class="revrow"><span style="color:var(--state-skipped);font-weight:800" aria-hidden="true">⚠</span>'+
      '<span class="badge-sev '+SEVCLS+'" role="img" aria-label="Severity '+SEVWORD+'"><span class="dot" aria-hidden="true"></span>'+SEVWORD+'</span>'+
      '<span class="t"><b>Exercise '+(S.order.indexOf(idx)+1)+'</b> — '+esc(ex.scenSum)+'</span>'+
      (answered?'<span class="chip">✓ answered</span>':'<button class="btn sm" data-act="rev" data-i="'+idx+'" aria-label="Answer this skipped exercise">Answer →</button>')+
      '</div>';
  });
  h+='<div class="navrow"><button class="btn primary" data-act="finish" aria-label="Finish exam and see results">Finish exam →</button>'+
    '<span class="note">Timer keeps running during review.</span></div>';
  $('view').innerHTML=h;
  updateHdr();
  window.scrollTo(0,0);
}
/* ===================== RESULTS VIEW ===================== */
function renderResults(){
  S.view='results';
  var full=0,part=0,zero=0,partSum=0;
  Object.keys(S.credits).forEach(function(k){
    var c=S.credits[k].credit;
    if(c>=0.999) full++;
    else if(c>0){ part++; partSum+=c; }
    else zero++;
  });
  var skippedNever=TOTAL-S.answered;   /* exercises never answered (skipped or timeout) — excluded from score */
  var pct=(S.answered>0)?Math.round((S.sum/S.answered)*100):0;
  var passed=pct>=70;
  var h='<div class="card res-hero '+(passed?'pass':'fail')+'">'+
    '<div class="pct" aria-label="Final score '+pct+' percent">'+pct+'%</div>'+
    '<div class="verdict" role="status">'+(passed?'✓ PASS':'✗ FAIL')+'</div>'+
    '<div class="muted" style="margin-top:8px">Final score <b class="mono">'+S.sum.toFixed(1)+' / '+S.answered+'</b> over answered exercises · pass mark 70% · '+SEVWORD+' exam</div>'+
  '</div>';
  h+='<div class="resgrid">'+
    '<div class="rescard ok"><div class="num" aria-label="Fully correct count">'+full+'</div><div class="lab">✓ Fully correct</div></div>'+
    '<div class="rescard part"><div class="num">'+part+'</div><div class="lab">✓ Partially correct'+(part?' — avg '+(partSum/part).toFixed(2):'')+'</div></div>'+
    '<div class="rescard bad"><div class="num">'+zero+'</div><div class="lab">✗ Fully incorrect</div></div>'+
    '<div class="rescard skip"><div class="num">'+(TOTAL-S.answered)+'</div><div class="lab">⚠ Skipped — excluded</div></div>'+
  '</div>';
  h+='<div class="card prose">'+
    '<h3 style="margin-top:0">'+(passed?'🎓 Certificate-style result':'📌 Keep going')+'</h3>'+
    (passed?'<div class="certline">This result shows working knowledge of <b>'+esc(EX.objId)+' — '+esc(EX.objName)+'</b> at <b>'+SEVWORD+'</b> level. You can download or screenshot this panel as your record for this attempt.</div>'
           :'<p>You did not reach the 70% pass mark this time. Review the explanations you saw, then press <b>Retake Exam</b> — the exercise order and answer positions are shuffled again.</p>')+
    '<div class="pauselog" aria-label="Pause accounting">'+
      '<span>⏸ Manual pause time: <b class="mono">'+fmt(S.timer.manualMs/1000)+'</b></span>'+
      '<span>⏸ Feedback review time (auto-pause): <b class="mono">'+fmt(S.timer.autoMs/1000)+'</b></span>'+
      '<span>⏱ Time left at submit: <b class="mono">'+fmt(S.timer.remain)+'</b></span>'+
    '</div>'+
  '</div>';
  h+='<div class="navrow"><button class="btn primary" data-act="retake" aria-label="Retake the exam">↺ Retake Exam</button></div>';
  $('view').innerHTML=h;
  updateHdr();
  window.scrollTo(0,0);
  if(!S.reported){
    S.reported=true;
    reportScore(S.sum,S.answered);
  }
}
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:METACFG.topicId,
      batch:METACFG.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=70
    },location.origin);
  }catch(e){ /* opened directly — nothing to report to */ }
}
/* ===================== EVENTS ===================== */
document.addEventListener('click',function(ev){
  var btn=ev.target.closest('[data-act]');
  if(!btn) return;
  var act=btn.getAttribute('data-act');
  var ex=EX.exercises[S.idx];
  switch(act){
    case 'start': startExam(); break;
    case 'collapse': S.collapsed[S.idx]=!S.collapsed[S.idx]; renderExam(); break;
    case 'check': doCheck(); break;
    case 'next': doNext(); break;
    case 'skip': doSkip(); break;
    case 'hint': doHint(); break;
    case 'pause': doPause(); break;
    case 'retake': startExam(); break;
    case 'finish': endTime(); break;
    case 'rev': {
      var i=parseInt(btn.getAttribute('data-i'),10);
      S.idx=i; S.fromReview=true; setTimerState('RUNNING'); S.view='exam'; renderExam(); break;
    }
    case 'opt': {
      var oi=parseInt(btn.getAttribute('data-i'),10);
      if(!ex) break;
      var a=S.answers[S.idx]||(S.answers[S.idx]={});
      if(ex.type==='qcm'){ a.sel=oi; }
      else { a.sel=a.sel||{}; if(a.sel[oi]) delete a.sel[oi]; else a.sel[oi]=1; }
      renderExam(); break;
    }
    case 'mleft': S.selLeft=parseInt(btn.getAttribute('data-i'),10); S.selRight=null; renderExam(); break;
    case 'mright': {
      if(S.selLeft===null||S.selLeft===undefined) { S.notice='⚠ Pick an item on the left first, then pick its match.'; renderExam(); break; }
      var ri=parseInt(btn.getAttribute('data-i'),10);
      var am=S.answers[S.idx]||(S.answers[S.idx]={assign:{}});
      am.assign[S.selLeft]=ri; S.selRight=ri; S.notice=''; renderExam(); break;
    }
    case 'ditem': S.selItem=parseInt(btn.getAttribute('data-i'),10); renderExam(); break;
    case 'dzone': {
      if(S.selItem===null||S.selItem===undefined){ break; }
      var zid=btn.getAttribute('data-i');
      var ad=S.answers[S.idx]||(S.answers[S.idx]={place:{}});
      ad.place[S.selItem]=zid; S.selItem=null; renderExam(); break;
    }
    case 'dunplace': {
      var ii=parseInt(btn.getAttribute('data-i'),10);
      var ad2=S.answers[S.idx]||(S.answers[S.idx]={place:{}});
      if(S.selItem!==null&&S.selItem!==undefined){
        var zhost=btn.closest('.zone');
        if(zhost) ad2.place[S.selItem]=zhost.getAttribute('data-zone');
        S.selItem=null;
      } else {
        ad2.place[ii]=null;
      }
      renderExam(); break;
    }
    case 'oup': case 'odown': {
      var jj=parseInt(btn.getAttribute('data-i'),10);
      var ao=S.answers[S.idx]||(S.answers[S.idx]={seq:S.perms[S.idx].order.slice()});
      var pos=ao.seq.indexOf(jj);
      var to=act==='oup'?pos-1:pos+1;
      if(to<0||to>=ao.seq.length) break;
      var tmp=ao.seq[pos]; ao.seq[pos]=ao.seq[to]; ao.seq[to]=tmp;
      renderExam(); break;
    }
    case 'wbank': {
      S.selWord=btn.getAttribute('data-w');
      var exf=EX.exercises[S.idx];
      var af=S.answers[S.idx]||(S.answers[S.idx]={fills:{}});
      var target=-1;
      exf.text.forEach(function(seg){ if(typeof seg!=='string'&&target===-1){ var bb=seg.b; if(!af.fills[bb]) target=bb; } });
      if(target>-1){ af.fills[target]=S.selWord; S.selWord=null; }
      renderExam(); break;
    }
    case 'trun': runTerm(); break;
    case 'bopt': {
      var si=parseInt(btn.getAttribute('data-s'),10), boi=parseInt(btn.getAttribute('data-i'),10);
      var ab=S.answers[S.idx]||(S.answers[S.idx]={choices:{},step:0});
      ab.choices[si]=boi; renderExam(); break;
    }
    case 'bconfirm': {
      var ab2=S.answers[S.idx]||(S.answers[S.idx]={choices:{},step:0});
      if(ab2.choices[ab2.step]===undefined){ S.notice='⚠ Choose one option for this step, then confirm.'; renderExam(); break; }
      S.notice='';
      if(ab2.step<ex.steps.length-1){ ab2.step++; renderExam(); }
      else { doCheck(); }
      break;
    }
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t&&t.classList&&t.classList.contains('blankin')){
    var b=parseInt(t.getAttribute('data-b'),10);
    var a=S.answers[S.idx]||(S.answers[S.idx]={fills:{}});
    a.fills[b]=t.value;
    t.classList.toggle('filled', !!t.value);
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.target&&ev.target.id==='termin'&&ev.key==='Enter'){ ev.preventDefault(); runTerm(); }
});
document.addEventListener('dragstart',function(ev){
  var el=ev.target.closest('[draggable="true"]');
  if(!el) return;
  ev.dataTransfer.setData('text/plain',el.getAttribute('data-i')||'');
  el.classList.add('dragging');
});
document.addEventListener('dragend',function(ev){
  var el=ev.target.closest('.dragging'); if(el) el.classList.remove('dragging');
});
document.addEventListener('dragover',function(ev){
  var z=ev.target.closest('.zone');
  if(z){ ev.preventDefault(); z.classList.add('over'); }
});
document.addEventListener('dragleave',function(ev){
  var z=ev.target.closest('.zone'); if(z) z.classList.remove('over');
});
document.addEventListener('drop',function(ev){
  var z=ev.target.closest('.zone');
  if(!z) return;
  ev.preventDefault(); z.classList.remove('over');
  var di=ev.dataTransfer.getData('text/plain');
  if(di==='') return;
  S.selItem=parseInt(di,10);
  var ex=EX.exercises[S.idx];
  var ad=S.answers[S.idx]||(S.answers[S.idx]={place:{}});
  ad.place[S.selItem]=z.getAttribute('data-zone');
  S.selItem=null; renderExam();
});
document.addEventListener('dragstart',function(ev){
  var row=ev.target.closest('.orow');
  if(!row) return;
  ev.dataTransfer.setData('text/orow',row.getAttribute('data-i'));
});
document.addEventListener('dragover',function(ev){
  var row=ev.target.closest('.orow');
  if(row&&ev.dataTransfer.types.indexOf('text/orow')>-1){ ev.preventDefault(); }
});
document.addEventListener('drop',function(ev){
  var row=ev.target.closest('.orow');
  if(!row) return;
  var src=ev.dataTransfer.getData('text/orow');
  if(src==='') return;
  ev.preventDefault();
  var ex=EX.exercises[S.idx];
  var ao=S.answers[S.idx]||(S.answers[S.idx]={seq:S.perms[S.idx].order.slice()});
  var si=parseInt(src,10), ti=parseInt(row.getAttribute('data-i'),10);
  var a=ao.seq.indexOf(si), b=ao.seq.indexOf(ti);
  if(a<0||b<0) return;
  ao.seq.splice(b,0,ao.seq.splice(a,1)[0]);
  renderExam();
});
/* ===================== TERMINAL ===================== */
function runTerm(){
  var ex=EX.exercises[S.idx];
  if(!ex||ex.type!=='term') return;
  var t=ex.term;
  var inp=$('termin'); if(!inp) return;
  var cmd=inp.value;
  if(!cmd.trim()) return;
  var hist=S.termHist[S.idx];
  var a=S.answers[S.idx]||(S.answers[S.idx]={cmd:cmd});
  a.cmd=cmd;
  var n=normCmd(cmd);
  var cls='echo', txt=t.prompt+' '+cmd;
  hist.push({cls:'echo',t:txt});
  var dangerHit=false;
  (t.danger||[]).forEach(function(d){ if(n.indexOf(d)>-1) dangerHit=true; });
  var allOk=t.elements.every(function(el){ return new RegExp(el.re,'i').test(n); });
  if(dangerHit){
    hist.push({cls:'err',t:'error: this would change cluster state or destroy evidence — simulation blocked the real effect'});
  } else if(allOk){
    (t.out||['(ok)']).forEach(function(l){ hist.push({cls:'good',t:l}); });
  } else {
    var toolOk=new RegExp('^kubectl(\\s|$)','i').test(n);
    if(!toolOk){ hist.push({cls:'err',t:'command not found: '+cmd.split(' ')[0]}); }
    else { hist.push({cls:'err',t:(t.err||'error: wrong arguments — the goal needs different options')}); }
  }
  renderExam();
  var sc=$('scr-'+S.idx); if(sc) sc.scrollTop=sc.scrollHeight;
  var ti=$('termin'); if(ti&&!S.inFeedback[S.idx]) ti.focus();
}
/* ===================== HANDSHAKE ===================== */
window.addEventListener('message',function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT') return;
  S.user.name=event.data.username||'';
  S.user.country=event.data.country||'';
  S.user.locale=event.data.locale||'en';
  /* theme is always 'dark'; this file is dark-only by contract — nothing to switch */
  updateHdr();
});
/* ===================== BOOT ===================== */
function boot(){
  var app=document.getElementById('app');
  app.innerHTML='<div id="hdr" class="hdr"></div><div id="view"></div>';
  renderIntro();
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',boot); } else { boot(); }
})();

</script>
