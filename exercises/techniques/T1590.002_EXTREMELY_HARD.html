.rcard .rc-num{font-size:26px;font-weight:800}
.rcard .rc-lab{font-size:13.5px;color:var(--text-secondary);margin-top:4px;letter-spacing:.03em}
.cert{border-radius:12px;padding:20px 22px;margin:16px 0;border:1px solid}
.cert.pass{border-color:var(--state-correct);background:linear-gradient(135deg,var(--tint-green-hero),transparent)}
.cert.fail{border-color:var(--state-incorrect);background:linear-gradient(135deg,var(--tint-red-hero),transparent)}
.cert h2{margin:0 0 6px 0;font-size:22px}
.cert p{margin:6px 0;color:var(--text-primary)}
.pauselog{color:var(--text-secondary);font-size:14px;border-top:1px dashed var(--border);margin-top:12px;padding-top:10px}

/* ---------- manual pause overlay ---------- */
#pauseoverlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.pausecard{max-width:460px;text-align:center;background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:12px;padding:28px}
.pausecard .pico{font-size:38px;color:var(--state-paused)}
.pausecard h2{color:var(--state-paused);margin:8px 0}
.pausecard p{color:var(--text-secondary)}

.term-clock{font-family:var(--font-mono);font-size:13px;color:var(--accent-amber);font-weight:700}
@media (max-width:720px){
  #app{padding:10px 10px 80px}
  .card,.blk-body{padding:13px}
  .topbar{gap:8px}
  .tstate{max-width:100%}
  pre.mono,pre.codeblock,.loglines{font-size:13px}
  .blank-in{width:150px}
}
@media (prefers-reduced-motion:reduce){
  #pbar::after{animation:none}
  *{transition:none !important;animation:none !important}
}
</style>

<script type="application/json" id="cm-exam-data">{"object":{"id":"T1590.002","name":"Gather Victim Network Information: DNS","type":"Sub-Technique","parent":"T1590","tactic":"Reconnaissance (TA0043)","platforms":"PRE"},"learn":["This object is a sub-technique. In MITRE ATT&CK, it describes one specific way to carry out the parent technique T1590, Gather Victim Network Information. Here the target of the gathering is the victim's DNS: the system that turns names like harbourline-freight[.]com into server addresses.","Imagine you work in the SOC of a shipping company. An attacker, sitting somewhere outside your network, quietly asks public DNS servers: 'Which servers handle this company's mail? Which name servers run its zones? What addresses do its subdomains point to?' Each answer is a small clue — mail vendors, cloud providers, live subdomains — and together the clues become a map of your attack surface. That is T1590.002.","You will meet this object as a CTI analyst (profiling how attackers prepare), as a pentester (running the same queries on purpose), as a SOC analyst ( spotting recon in DNS telemetry), and as a detection engineer (writing analytics like ATT&CK detection strategy DET0843 and its analytic AN1975). Tools on both sides: dig and nslookup for direct queries, passive DNS datasets such as CIRCL's, DNS Dumpster-style mapping sites, and your own DNS server logs.","ATT&CK places this sub-technique in the Reconnaissance tactic (TA0043) on the PRE platform — meaning it happens before the attack touches you, often outside your visibility. The page lists one mitigation, M1054 Software Configuration: restrict zone transfers to validated servers only. It also warns that a DNS zone transfer (AXFR) against a misconfigured server can leak every record at once. Detection is hard — high volume, high false positives — so defenders watch for later stages like Initial Access. Real cases on the page include a wrong BIND configuration that exposed a country's TLD records and CISA's warning that AXFR requests may leak domain information."],"kw":["dig","nslookup","host","axfr","nxdomain","mx","txt","soa","ptr","cname","spf","name-server","zone","transfer","recursion","include","all","in","grep","head"],"themes":[{"name":"Recon objective & lifecycle","concepts":["feeds Acquire Infrastructure (T1583)"]},{"name":"DNS record types & what they reveal","concepts":["SOA record"]},{"name":"Collection methods","concepts":["direct DNS queries (active)","Passive DNS datasets","dig / nslookup / host tools"]},{"name":"Zone transfer (AXFR)","concepts":["leaks the full zone","restrict transfers to validated secondaries"]},{"name":"Mitigations & controls","concepts":["M1054 Software Configuration","DNS hardening good practice","minimising exposed DNS data"]},{"name":"Data sources & telemetry","concepts":["zone transfer attempt logs"]},{"name":"Detection logic & analytics","concepts":["DET0843 detection strategy","high false-positive rate","activity outside the victim's visibility","focus on later lifecycle stages (Initial Access)","internal hosts doing external recon"]},{"name":"Attacker value & next steps","concepts":["map mail flow for phishing","discover SaaS/third-party providers","find live subdomains","plan lookalike infrastructure"]}],"exercises":[{"id":"T1590-002-X01","type":"branch","title":"Three AXFR sources, one truth","summary":"Pentest ticket, migration vendor, unknown actor — decide each step.","concepts":["zone transfer attempt logs","restrict transfers to validated secondaries","Passive DNS datasets"],"perspective":"defender","tags":["trap:conflicting-signals","trap:escalate-or-gather"],"scenario":[{"label":"ARTEFACT 1 — AXFR sources (72h)","kind":"text","text":"Source A: 198[.]51[.]100[.]7 — pentest vendor, ticket PT-91, scope 'external DNS', window active. Source B: 203[.]0[.]113[.]88 — new vendor onboarding, ONE successful 214-record pull, no ticket found. Source C: 45[.]33[.]32[.]156 — unknown host, only your zone, SOA/NS pre-queries, three refusals."},{"label":"ARTEFACT 2 — Passive DNS check","kind":"text","text":"A public passive-DNS dataset now lists fin-web-internal.harbourline-freight[.]com — a name that exists only in the internal split-horizon view."}],"question":"Make the four senior decisions in order.","steps":[{"text":"Decision 1 — Source B's successful pull has no ticket but 'new vendor onboarding' was mentioned in a chat. How do you classify it?","options":[{"t":"Suspected control failure — verify the transfer ACL and the onboarding claim before classifying","correct":true,"why":"Correct — a chat mention is not a ticket; verify the ACL state and the claim, then classify on evidence.","outcome":"ACL shows a temporary 'any' line added during onboarding; no written approval exists.","outcomeBad":false},{"t":"Approve it retroactively because onboarding was mentioned","correct":false,"why":"Retroactive approval from chat hearsay is how control failures get buried.","outcome":"The unauthorised pull is laundered into an 'approved' change.","outcomeBad":true},{"t":"Classify it as an attack and block the vendor","correct":false,"why":"Possible, but the onboarding thread may be genuine — verify before accusing a partner.","outcome":"A partner is blocked on hearsay while the ACL hole stays open.","outcomeBad":true}]},{"text":"Decision 2 — The passive-DNS leak of fin-web-internal: which source do you attribute it to first?","options":[{"t":"Source B — the one pull that actually moved 214 records","correct":true,"why":"Correct — only a successful transfer explains an internal name leaving; sources A and C were refused or scoped.","outcome":"Timeline fits: B's pull at 02:03, dataset listing appears 06:00. Attribution: high confidence.","outcomeBad":false},{"t":"Source C — it looked the most suspicious","correct":false,"why":"C was refused every time — intent without capability; it cannot explain the leak.","outcome":"You chase the wrong host while the real exit stays open.","outcomeBad":true},{"t":"Source A — pentests always leak things","correct":false,"why":"A is scoped and refused for the internal view; assumption is not attribution.","outcome":"The pentest vendor is wrongly blamed; contract drama ensues.","outcomeBad":true}]},{"text":"Decision 3 — Source C keeps retrying against the internal view. What now?","options":[{"t":"Keep the refusals flowing, alert on the pattern, and hunt for how C learned the internal names","correct":true,"why":"Correct — refusals hold; the urgent question is C's knowledge source, which points to a second leak.","outcome":"C's pre-queries match names that only the B pull (or an internal host) could have provided.","outcomeBad":false},{"t":"Block C at the firewall and close the case","correct":false,"why":"Blocking one source stops nothing — it rotates; and closing hides the knowledge-source question.","outcome":"C returns from a new address; the case file shows 'resolved'.","outcomeBad":true},{"t":"Publish the internal zone publicly to end the guessing","correct":false,"why":"Absurd on its face — but 'consolidate the views' proposals like this appear under pressure; it mass-discloses everything.","outcome":"Internal naming is now public by policy — the attacker's job is done for them.","outcomeBad":true}]},{"text":"Decision 4 — The CISO wants one line for the board. Which is true?","options":[{"t":"'One unauthorised full-zone pull (control failure, vendor onboarding); internal naming confirmed leaked; two refused actors monitored.'","correct":true,"why":"Correct — it separates the successful failure from the refused noise and states the impact.","outcome":"The board gets an accurate, decision-ready picture.","outcomeBad":false},{"t":"'Attackers stole our DNS.'","correct":false,"why":"Over-broad and wrong: public records were never 'stolen', and precision matters for follow-up.","outcome":"The board approves panic spending on the wrong problem.","outcomeBad":true},{"t":"'Nothing happened — all transfers are controlled.'","correct":false,"why":"Contradicted by the 214-record pull and the dataset listing.","outcome":"A false all-clear; the ACL hole ships to production.","outcomeBad":true}]}],"hint":"Only successful transfers move internal names; refusals show intent. Chat mentions are not tickets.","explain":"The branch forces resolution of three conflicting signals using one rule: what actually left the zone. B explains the leak; C explains the retries; A explains nothing new. Each later decision depends on that first classification.","study":"Attribution across refused vs successful transfer sources."},{"id":"T1590-002-X02","type":"terminal","title":"Extract the transfer history","summary":"Read-only extraction from the DNS audit log for the bridge.","concepts":["zone transfer attempt logs","dig / nslookup / host tools","activity outside the victim's visibility"],"perspective":"defender","tags":["trap:real-cost"],"skill":"log-extraction-pipeline","scenario":[{"label":"ARTEFACT 1 — Environment","kind":"text","text":"You are on the DNS audit host (Linux). Objective: print every line mentioning axfr or xfer from the last rotation's query log, limited to 100 lines, for the incident bridge. Rules: read-only; the log is evidence."}],"question":"Type the command that prints those 100 lines without altering anything.","cmd":{"timeLimit":300,"prompt":"ir@dnsaudit01:~$","canonical":"grep -iE \"axfr|xfer\" /var/log/dnsaudit/queries.log | head -100","nearMiss":"chmod 600 /var/log/dnsaudit/queries.log","outputs":[{"re":"grep\\s+-i?e?\\s*[\\\"']?axfr\\|xfer[\\\"']?\\s+/var/log/dnsaudit/queries\\.log\\s*\\|\\s*head\\s+-?100","lines":["02:03:00 ns1 axfr-allowed harbourline-freight[.]com -> 203[.]0[.]113[.]88 (no ticket)","02:03:41 ns1 xfer-out 214 records to 203[.]0[.]113[.]88","22:10:15 ns1 axfr-refused harbourline-freight[.]com from 45[.]33[.]32[.]156"]}],"unknown":"no matches — check the pattern (axfr|xfer) and the log path.","elements":[{"re":"\\bgrep\\b","label":"grep (read-only search)","why":"Search without modification — the evidence-safe verb."},{"re":"axfr\\|xfer","label":"The pattern 'axfr|xfer'","why":"Both spellings appear in this log family; the alternation catches all."},{"re":"-i","label":"Case-insensitive matching","why":"The log mixes AXFR and Axfr spellings; -i catches both."},{"re":"/var/log/dnsaudit/queries\\.log","label":"The evidence log path","why":"The rotation file holding the query records."},{"re":"\\|","label":"The shell pipe","why":"Feeds matches into the limiter."},{"re":"head\\s+-?100|head\\s+-n\\s*100","label":"head limiting to 100 lines","why":"The bridge asked for a bounded extract."}],"forbidden":[{"re":"\\brm\\b|\\bmv\\b|\\btruncate\\b|>\\s*/var/log|systemctl (restart|stop)","label":"a log-modifying action","why":"Deleting, moving, truncating, or restarting anything destroys evidence — the DANGEROUS near-miss."},{"re":"\\bchmod\\b|\\bchown\\b","label":"a permission change on the log","why":"Altering the evidence file's metadata taints the chain of custody."}]},"hint":"Search both spellings case-insensitively, then bound the output. Nothing may touch the file itself.","explain":"'grep -iE \"axfr|xfer\" <log> | head -100' delivers the bridge extract read-only. The DANGEROUS near-misses — rm/mv/truncate, redirects into the log, service restarts, even permission changes — taint or destroy the evidence.","study":"Evidence-safe log extraction for DNS audit hosts."},{"id":"T1590-002-X03","type":"mcq","title":"Which signal wins the conflict?","summary":"Two signals point opposite ways — resolve them correctly.","concepts":["high false-positive rate","zone transfer attempt logs","internal hosts doing external recon"],"perspective":"attacker","tags":["trap:conflicting-signals"],"scenario":[{"label":"ARTEFACT 1 — Conflicting picture","kind":"text","text":"Signal 1: the actor's queries look identical to your monitoring vendor's documented nightly sweep (same record types, similar timing). Signal 2: the actor's source ASN and the exact subdomain ORDER differ from the vendor's job — and the sweep hits names retired two years ago."}],"question":"Which signal wins, and why?","options":[{"t":"Signal 2 — identity and knowledge of retired names outrank surface similarity","correct":true,"why":"Correct — mimicked patterns are cheap; knowing dead names is not. Content of knowledge beats shape of traffic."},{"t":"Signal 1 — matching the vendor pattern proves it is the vendor","correct":false,"why":"A copycat trap: pattern-mimicry is the first thing a careful attacker does before touching anything."},{"t":"Neither — call the vendor and wait a week","correct":false,"why":"Verification is wise, but retired-name knowledge needs action on its own timeline."},{"t":"Both — declare it benign because signals cancel","correct":false,"why":"Signals do not cancel; one describes appearance, the other describes knowledge."}],"hint":"Ask which signal could only exist if the actor had leaked data.","explain":"Conflicting signals resolve by asking what each can falsify. Surface similarity is trivially faked; knowledge of retired internal names is hard evidence of prior disclosure. Senior triage weighs knowledge over appearance.","study":"Weighing mimicry against knowledge indicators in recon triage."},{"id":"T1590-002-X04","type":"logview","title":"Prove the successful pull","summary":"Multi-select over a noisy transfer log — pick the two proof lines.","concepts":["leaks the full zone","zone transfer attempt logs","Passive DNS datasets"],"perspective":"defender","tags":["trap:conflicting-signals"],"logTitle":"ns1 transfer log, 02:00-02:10 + dataset check","filterPlaceholder":"filter lines...","multi":true,"log":["02:03:00  axfr-req  zone harbourline-freight[.]com  from 203[.]0[.]113[.]88  status: ALLOWED (temp 'any' ACL, onboarding)","02:03:41  xfer-out  214 records  -> 203[.]0[.]113[.]88  complete","02:04:02  axfr-req  zone harbourline-freight[.]com  from 45[.]33[.]32[.]156  status: REFUSED","02:06:33  notify    zone harbourline-freight[.]com -> ns2.provider-dns[.]net (serial 2026100802)","06:00:11  dataset   fin-web-internal.harbourline-freight[.]com observed in public passive-DNS","06:05:44  dataset   www.harbourline-freight[.]com observed (known public record)"],"options":[{"t":"02:03:41 — 214 records transferred out to the unapproved host","correct":true,"why":"Correct — the exit proof: a full record set left to a host with no validated status."},{"t":"06:00:11 — the internal-only name appearing in the public dataset","correct":true,"why":"Correct — the outside confirmation: internal naming that should never be public now is."},{"t":"02:04:02 — the refused attempt","correct":false,"why":"A refusal proves the control for THAT source — it explains retries, not the leak."},{"t":"02:06:33 — the notify to the validated secondary","correct":false,"why":"Standard zone maintenance to a validated partner — routine near-miss."},{"t":"06:05:44 — www observed in the dataset","correct":false,"why":"A public record in a public dataset — true but proves nothing about a leak."}],"question":"Select the TWO lines that together prove the zone leak.","hint":"Exit proof plus outside confirmation — the other lines are refusals, routine maintenance, or public data.","explain":"Exit (214 records out) + confirmation (internal name outside) = proven disclosure. The refused attempt, the notify, and the public-record observation are the three traps that look load-bearing but are not.","study":"Pairing exit logs with outside confirmation for disclosure proof.","scenario":[{"label":"ARTEFACT 1 — ns1 transfer log, 02:00-02:10 + dataset check","kind":"text","text":"You are reviewing this export in the SOC log viewer. Multi-select over a noisy transfer log — pick the two proof lines. Use the filter box to narrow the lines before answering."}]},{"id":"T1590-002-X05","type":"dnd","title":"Build the recon-to-phishing board","summary":"Four artefacts into recon, enabler, legitimate, or post-compromise.","concepts":["map mail flow for phishing","discover SaaS/third-party providers","feeds Acquire Infrastructure (T1583)","minimising exposed DNS data"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Case board columns","kind":"text","text":"PRE-ATTACK RECON EVIDENCE / PHISHING ENABLER / LEGITIMATE ACTIVITY / POST-COMPROMISE INDICATOR. Four artefacts must land once each."}],"question":"Drag each artefact to its column.","zones":[{"name":"PRE-ATTACK RECON EVIDENCE","accepts":[0],"why":"Serial legacy-name enumeration three weeks before the campaign is recon evidence."},{"name":"PHISHING ENABLER","accepts":[1],"why":"The mail-platform map (MX+SPF) is what made the lures land credibly."},{"name":"LEGITIMATE ACTIVITY","accepts":[2],"why":"The ticketed vendor transfer is real, approved work."},{"name":"POST-COMPROMISE INDICATOR","accepts":[3],"why":"An unticketed SPF change pointing at an unknown sender domain suggests hands on the zone."}],"bank":[{"t":"Legacy-name enumeration from one internal host, 3 weeks pre-campaign","whyMiss":"Timing plus targeting = recon evidence."},{"t":"MX+SPF map showing the mail platform and authorised senders","whyMiss":"This is the material the phishing lures were built from."},{"t":"Vendor AXFR under CHG-4188, windowed, 214 records","whyMiss":"Ticketed and windowed — legitimate."},{"t":"SPF 'include:' for invoice-mail[.]example added 02:00, no ticket","whyMiss":"A record change enabling an unknown sender = post-compromise tampering signal."}],"hint":"Ask: did it watch, does it power the lures, was it ticketed, or does it change what mail is allowed?","explain":"The board tells the story in the right order: recon watched, the map enabled the lures, legit work ran alongside, and the SPF change suggests the actor later got write access. Mis-filed artefacts break that narrative.","study":"Connecting DNS recon artefacts to later phishing and tampering stages."},{"id":"T1590-002-X06","type":"terminal","title":"Quietly check the zone serial","summary":"One read-only query — and nothing that could tip the operator.","concepts":["SOA record","dig / nslookup / host tools","direct DNS queries (active)"],"perspective":"defender","tags":["trap:real-cost"],"skill":"quiet-single-query","scenario":[{"label":"ARTEFACT 1 — Bridge request","kind":"text","text":"Question from the bridge: 'Did the zone's serial change since the incident snapshot (2026100802)?' Rules: one read-only query to the authoritative server; do NOT run anything that looks like an enumeration attempt (the actor may still be watching the query logs' shape); no recursion games."}],"question":"Type the single command that reads the zone's SOA record from ns1 without recursion.","cmd":{"timeLimit":300,"prompt":"ir@jump:~$","canonical":"dig @ns1.harbourline-freight[.]com harbourline-freight[.]com soa +norecurse","nearMiss":"dig @ns1.harbourline-freight[.]com harbourline-freight[.]com axfr","outputs":[{"re":"dig\\s+@ns1\\.harbourline-freight\\[.\\]com\\s+harbourline-freight\\[.\\]com\\s+soa\\s+\\+norecurse","lines":[";; ANSWER SECTION:","harbourline-freight[.]com. 3600 IN SOA ns1.harbourline-freight[.]com. hostmaster.harbourline-freight[.]com. 2026100907 7200 3600 1209600 3600",";; note: serial 2026100907 differs from snapshot 2026100802"]}],"unknown":"command not recognised — one server (@), the zone, the record type, and the recursion flag.","elements":[{"re":"\\bdig\\b","label":"Uses dig","why":"A single query — the quietest possible read."},{"re":"@ns1\\.harbourline-freight\\[.\\]com","label":"Asks the authoritative server directly","why":"Authoritative answers avoid resolver caching noise."},{"re":"harbourline-freight\\[.\\]com","label":"Names the zone","why":"SOA is per-zone."},{"re":"(^|\\s)soa(\\s|$)","label":"Reads the SOA record","why":"The serial lives in SOA."},{"re":"\\+norecurse","label":"Sets +norecurse","why":"Reads exactly what the authoritative server holds, per the tasking rules."}],"forbidden":[{"re":"(^|\\s)axfr(\\s|$)","label":"an AXFR attempt","why":"A full-zone attempt from YOUR host mirrors the attacker's behaviour — it tips observers and adds noise: the DANGEROUS near-miss."},{"re":"(^|\\s)ixfr(\\s|$)","label":"an IXFR request","why":"Incremental transfer requests enumerate change history — beyond the tasked single read."},{"re":"\\bclear\\b|\\breload\\b|\\brndc\\b","label":"a server-control command","why":"Server controls can flush or restart zones — far outside a read-only check."}]},"hint":"One record type holds the serial; one flag keeps the query a pure read. Avoid anything that mimics the attacker.","explain":"'dig @ns1 zone soa +norecurse' answers the serial question in one query. The DANGEROUS near-misses (axfr/ixfr from your own host, or server controls) either mimic the attacker's traffic — tipping any observer — or risk state changes.","study":"SOA serials as change evidence; keeping responder queries distinct from attacker traffic."},{"id":"T1590-002-X07","type":"match","title":"What the recon bought them","summary":"Four recon findings and the downstream capability each unlocked.","concepts":["map mail flow for phishing","find live subdomains","feeds External Remote Services (T1133)","plan lookalike infrastructure"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Attacker capability review","kind":"text","text":"For each recon finding, the review asks: what could the actor actually DO because of it?"}],"question":"Match each finding to the capability it unlocked.","left":[{"t":"Full mail-flow map (MX + SPF)","match":0,"why":"The lures looked exactly like real vendor mail — that is why click rates spiked."},{"t":"List of live legacy subdomains","match":1,"why":"The old VPN portal found this way became the External Remote Services target."},{"t":"SaaS inventory from TXT/SPF","match":2,"why":"Invoice-themed lures spoofing the billing SaaS were built from this list."},{"t":"Knowledge of internal naming conventions","match":3,"why":"Lookalike domains mimicking real internal names became near-perfect phishing infrastructure."}],"right":[{"t":"Credible vendor-look phishing lures","why":"Knowing the mail platform makes 'from' patterns trivially realistic."},{"t":"A target for External Remote Services probing","why":"Forgotten live subdomains are unmonitored doors."},{"t":"Business-process spoofing (billing, tickets)","why":"SaaS knowledge enables process-specific lures."},{"t":"Near-perfect lookalike domain names","why":"Internal naming conventions make typosquats believable."}],"hint":"Each finding removes one obstacle the later stage would have hit.","explain":"Recon value is measured in removed obstacles: identity (mail), doors (subdomains), processes (SaaS), and naming (lookalikes). This is why T1590.002 is rated by what it enables, not by the queries themselves.","study":"Mapping recon findings to Initial Access capabilities."},{"id":"T1590-002-X08","type":"multi","title":"Defensible readings of the case","summary":"Which three conclusions survive scrutiny?","concepts":["high false-positive rate","leaks the full zone","DET0843 detection strategy","Passive DNS datasets"],"perspective":"defender","tags":["trap:conflicting-signals"],"scenario":[{"label":"ARTEFACT 1 — Draft conclusions","kind":"text","text":"Facts: one successful 214-record pull (vendor onboarding, no ticket); internal name later seen in a public dataset; one persistent refused actor; pentest vendor active in scope; phishing wave hit 3 weeks after the pull."}],"question":"Select the three defensible conclusions.","options":[{"t":"The onboarding pull is the best-supported source of the internal-name leak","correct":true,"why":"Correct — only a successful transfer moves internal names; timing and content fit."},{"t":"The phishing wave's quality is consistent with the leaked mail map","correct":true,"why":"Correct — lure fidelity matching MX/SPF reality is exactly what the map enables."},{"t":"The persistent refused actor shows continued interest despite the control","correct":true,"why":"Correct — refusals show the control holds AND that intent persists; both things are true."},{"t":"The refused actor proves an active breach of the DNS servers","correct":false,"why":"Refused attempts are external noise or probing — they prove no server compromise."},{"t":"DNS recon means the phishing was inevitable and prevention pointless","correct":false,"why":"Fatalism is false: transfer ACLs and SPF hygiene measurably degraded the campaign's groundwork."},{"t":"The pentest vendor caused the leak because pentests touch everything","correct":false,"why":"Scope and refusals exclude them — assumption is not attribution."}],"hint":"Separate what moved data, what the data enabled, and what the control still held.","explain":"Defensible conclusions tie each claim to its evidence class: movement (the pull), enablement (lure fidelity), and persistence (refused retries). The rejected three each over-read their evidence.","study":"Evidence-class discipline in CTI conclusions."},{"id":"T1590-002-X09","type":"order","title":"Sequence the CTI escalation","summary":"Five steps from correlation to published hardening.","concepts":["DET0843 detection strategy","activity outside the victim's visibility","zone transfer attempt logs","minimising exposed DNS data"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Escalation cards (shuffled)","kind":"text","text":"Cards: 'Correlate the three AXFR sources against tickets and windows' · 'Diff the pentest scope to exclude Source A' · 'Attribute the remainder with stated confidence' · 'Brief the CISO with confidence levels per claim' · 'Publish detection tuning and the transfer-ACL fix backlog'."}],"question":"Order the five escalation steps.","sequence":["Correlate the three AXFR sources against tickets and windows","Diff the pentest scope to exclude Source A","Attribute the remainder with stated confidence","Brief the CISO with confidence levels per claim","Publish detection tuning and the transfer-ACL fix backlog"],"orderWhy":["Correlation assembles the evidence first.","Scope-diffing removes the authorised actor from suspicion.","Only now attribute what remains — with explicit confidence.","The brief carries those confidence levels unchanged.","Hardening and tuning close the loop for the next defender."],"hint":"Correlate, exclude the authorised, attribute the rest, brief with confidence, then harden.","explain":"The sequence keeps attribution honest: no claim precedes the evidence, authorised activity is excluded before attribution, and confidence labels survive into the brief. The fix backlog is the deliverable that outlives the meeting.","study":"CTI escalation workflow for DNS-recon incidents."},{"id":"T1590-002-X10","type":"mcq","title":"The registrar-privacy myth","summary":"Why the popular privacy fix does not stop this recon.","concepts":["minimising exposed DNS data","direct DNS queries (active)","Passive DNS datasets"],"perspective":"defender","tags":["trap:best-practice-wrong"],"scenario":[{"label":"ARTEFACT 1 — Fix proposal","kind":"text","text":"Proposal in the fix-backlog review: 'Enable registrar WHOIS privacy everywhere — that stops DNS reconnaissance.' The CTI lead must correct it."}],"question":"Which correction is right?","options":[{"t":"WHOIS privacy hides registrant contact data; DNS records stay public by design","correct":true,"why":"Correct — the recon here reads DNS answers, not WHOIS; privacy services change nothing about MX/A/TXT visibility."},{"t":"WHOIS privacy also hides MX and TXT records","correct":false,"why":"It cannot: those records must be publicly readable for mail and verification to work at all."},{"t":"Correct as written — privacy stops all recon","correct":false,"why":"The proposal confuses two different public datasets."},{"t":"Only disabling the domain entirely stops this recon","correct":false,"why":"True but self-destructive — and the point is proportionate reduction, not surrender."}],"hint":"Ask which public dataset the proposed fix actually touches.","explain":"The best-practice trap: WHOIS privacy is good hygiene for registrant data but is irrelevant to T1590.002, which reads DNS answers and datasets. The real levers are data minimisation in the zone and transfer ACLs.","study":"What WHOIS privacy does and does not hide, versus zone minimisation."},{"id":"T1590-002-X11","type":"logview","title":"The line that proves the leak's impact","summary":"Which query could only succeed because internal names leaked?","concepts":["leaks the full zone","internal hosts doing external recon","split-horizon exposure"],"perspective":"defender","tags":["trap:conflicting-signals"],"logTitle":"external query log vs internal naming (post-leak)","filterPlaceholder":"filter queries...","log":["A  www.harbourline-freight[.]com      -> answered (public record)","B  mail.harbourline-freight[.]com     -> answered (public record)","C  fin-web-internal.harbourline-freight[.]com -> answered (INTERNAL-ONLY name)","D  vpn-portal.harbourline-freight[.]com -> answered (public record)","E  randomstring7182.harbourline-freight[.]com -> NXDOMAIN"],"options":[{"t":"C — an external host resolving an internal-only name","correct":true,"why":"Correct — that name exists only in the internal view; an outside answer proves the leak's real-world reach."},{"t":"A — the public www record","correct":false,"why":"Public by design; answering it proves nothing about the leak."},{"t":"B — the public mail record","correct":false,"why":"Same as A — expected public behaviour."},{"t":"E — the NXDOMAIN on a random string","correct":false,"why":"A miss proves guessing — the opposite of leaked knowledge; it is the noise floor."}],"question":"Which single line demonstrates that the leaked zone is being USED?","hint":"Only one name should have been impossible to know from the public zone.","explain":"Impact is proven by impossible knowledge: an external resolver answering an internal-only name means the actor reads the internal view — through the leaked zone. Public answers and random misses are the two classic near-misses.","study":"Proving exploitation of leaked internal naming.","scenario":[{"label":"ARTEFACT 1 — external query log vs internal naming (post-leak)","kind":"text","text":"You are reviewing this export in the SOC log viewer. Which query could only succeed because internal names leaked? Use the filter box to narrow the lines before answering."}]},{"id":"T1590-002-X12","type":"fib","title":"Write the timeline finding","summary":"Two words complete the causal finding.","concepts":["map mail flow for phishing","leaks the full zone"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — Report finding 2 (draft)","kind":"text","text":"Draft: 'The actor staged the phishing {b0} before launch by mapping mail flow; the zone leak cut their enumeration {b1} to nearly zero.'"}],"question":"Fill the two blanks of the finding.","template":"The actor staged the phishing {b0} before launch by mapping mail flow; the zone leak cut their enumeration {b1} to nearly zero.","blanks":[{"accept":["weeks","3 weeks","three weeks"],"why":"The case timeline shows recon three weeks ahead of the campaign.","whyMiss":"The staging window in the timeline is weeks, not hours."},{"accept":["effort","cost","time"],"why":"A full-zone pull replaces weeks of guessing — effort collapses.","whyMiss":"The leak removed work (effort/cost/time), not the attacker's need for stealth."}],"hint":"Blank one: the staging window from the timeline. Blank two: what a complete map saves the attacker.","explain":"The finding links timing (weeks of staging) to effect (near-zero enumeration effort). That is the sentence that makes executives fund the transfer-ACL fix.","study":"Writing causal findings that connect recon to campaign quality."},{"id":"T1590-002-X13","type":"triage","title":"The board's four asks","summary":"Comply, gather first, or decline with rationale.","concepts":["minimising exposed DNS data","M1054 Software Configuration","high false-positive rate","Passive DNS datasets"],"perspective":"defender","tags":["trap:escalate-or-gather","trap:real-cost"],"scenario":[{"label":"ARTEFACT 1 — Board asks (Thursday 18:00)","kind":"text","text":"1) 'Turn off the internal DNS view entirely tonight.' 2) 'Publish the attacker's infrastructure.' 3) 'Give us the confidence levels.' 4) 'Will transfer ACLs stop this kind of pull?'"}],"question":"Choose the best response to each ask.","rows":[{"alert":"'Turn off the internal DNS view entirely tonight'","detail":"Finance and HR apps depend on internal naming.","options":["Comply now","Gather more evidence first","Decline with rationale"],"correctIndex":2,"why":"Shutting the internal view tonight breaks core apps for marginal gain — decline and schedule a scoped split-horizon review instead.","whyNot":{"0":"An overnight cutover of internal naming is a self-inflicted outage.","1":"The dependency map, not more evidence, is what this needs."}},{"alert":"'Publish the attacker's infrastructure tonight'","detail":"Attribution is low-confidence; infrastructure is rotating.","options":["Comply now","Gather more evidence first","Decline with rationale"],"correctIndex":1,"why":"Low-confidence attribution plus rotating hosts makes publication premature — gather first, publish when solid.","whyNot":{"0":"Publishing shaky attribution tips the actor and risks accusing innocents.","2":"It is a sequencing issue, not a refusal."}},{"alert":"'Give us the confidence levels'","detail":"Claim-by-claim confidence has been drafted.","options":["Comply now","Gather more evidence first","Decline with rationale"],"correctIndex":0,"why":"The confidence table is complete — deliver it with the evidence list per claim.","whyNot":{"1":"The drafting is done; delay buys nothing.","2":"Transparency about confidence is the whole ask."}},{"alert":"'Will transfer ACLs stop this kind of pull?'","detail":"M1054 is enforced on all authoritative servers.","options":["Comply now (yes, with scope limits)","Gather more evidence first","Decline with rationale"],"correctIndex":0,"why":"Yes for zone pulls — with the honest caveat that record sweeps and dataset reads remain possible.","whyNot":{"1":"The control's behaviour is already measured; no gathering needed.","2":"Declining an answerable technical question erodes trust."}}],"hint":"For each ask: is it answerable now, is disclosure safe, and does complying break something?","explain":"Two asks are answerable now, one needs evidence (publication), one must be declined (overnight internal-DNS shutdown). The pattern: never let pressure convert a scope decision into an outage.","study":"Answering board questions with scoped, honest technical limits."},{"id":"T1590-002-X14","type":"multi","title":"Costs that buy real reduction","summary":"Which two costly actions genuinely reduce the exposure?","concepts":["minimising exposed DNS data","M1054 Software Configuration","DNS hardening good practice"],"perspective":"defender","tags":["trap:real-cost"],"scenario":[{"label":"ARTEFACT 1 — Cost board","kind":"text","text":"The CISO approves only costs that remove a named exposure. Choose the two justified actions."}],"question":"Select the two justified actions.","options":[{"t":"Migrate to a DNS provider with enforced transfer ACLs, during a maintenance window","correct":true,"why":"Correct — the cost (planned migration) removes the 'any' ACL class of failure permanently."},{"t":"Scrub internal-only names from any zone that ever leaves the building, and re-test transfers","correct":true,"why":"Correct — data minimisation removes the crown jewels from the leakable set entirely."},{"t":"Disable the authoritative NS for a day to 'reset' the attackers","correct":false,"why":"A day of dead web/mail buys zero reduction — the records and datasets persist."},{"t":"Buy a threat-intel subscription and nothing else","correct":false,"why":"Visibility without the ACL fix and minimisation does not remove this exposure class."},{"t":"Publish all internal names in one public TXT record 'for transparency'","correct":false,"why":"This is the opposite of reduction — it centralises the leak."}],"hint":"Justified cost names the exposure it removes. Two options do; three do not.","explain":"Provider ACLs remove the failure class; minimisation removes the data. Downtime stunts and transparency stunts remove nothing — the classic real-cost traps.","study":"Cost-justified hardening for DNS exposure."},{"id":"T1590-002-X15","type":"fib","title":"Finish the strategy citation","summary":"Two blanks quote DET0843/AN1975 accurately.","concepts":["DET0843 detection strategy","high false-positive rate","focus on later lifecycle stages (Initial Access)"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Wiki citation line","kind":"text","text":"Draft: 'Per DET0843/AN1975: very high {b0} and associated false positive rate; much activity occurs outside the target's visibility; detection focuses on related stages such as {b1}.'"}],"question":"Fill the two blanks of the citation.","template":"Per DET0843/AN1975: very high {b0} and associated false positive rate; much activity occurs outside the target's visibility; detection focuses on related stages such as {b1}.","blanks":[{"accept":["occurrence"],"why":"The analytic's wording: 'very high occurrence and associated false positive rate'.","whyMiss":"The pair is occurrence + false positives; 'severity' is not in the text."},{"accept":["initial access","initial-access"],"why":"The analytic names Initial Access as the focus stage.","whyMiss":"The cited stage is Initial Access — not Reconnaissance itself."}],"hint":"Blank one is the word paired with 'false positive rate' in the analytic. Blank two is the stage name.","explain":"Accurate citation matters in CTI: occurrence + false positives, outside visibility, Initial Access focus. Paraphrases drift; the exact pair keeps the analytic honest in your wiki.","study":"Quoting AN1975 precisely in detection documentation."}],"severityWord":"EXTREMELY HARD","partLabel":null}</script>
<script>
'use strict';
var DATA = JSON.parse(document.getElementById('cm-exam-data').textContent);
var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var EXS = [];
var S = null;
var T = null; // timer object for current attempt

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function fmtTime(sec){
  sec = Math.max(0, sec|0);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function round1(x){ return Math.round(x*10)/10; }
function letterKey(n){ return String.fromCharCode(65+n); }
function dispKey(ex, origIdx){ return ex._optOrder ? ex._optOrder.indexOf(origIdx) : origIdx; }

var KW = (DATA.kw && DATA.kw.length) ? DATA.kw : ['show','key','log','policy','error'];
var KWRE = new RegExp('(^|[^\\w-])(' + KW.join('|') + ')(?=[^\\w-]|$)','g');
function hl(text){
  var e = esc(text);
  e = e.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g, '<span class="tok-str">$1</span>');
  e = e.replace(/\b\d{1,3}(?:\[\.\]\d{1,3}){3}\b/g, '<span class="tok-ip">$&</span>');
  e = e.replace(KWRE, function(m,p1,p2){ return p1 + '<span class="tok-kw">' + p2 + '</span>'; });
  e = e.replace(/(\s|^)(-{1,2}[A-Za-z][\w-]*)/g, '$1<span class="tok-flag">$2</span>');
  e = e.replace(/\b(\d+)\b(?![^<]*<\/span>)/g, function(m, g1, off, str){
    var before = str.slice(Math.max(0, off-6), off);
    if(before.indexOf('class=') >= 0){ return m; }
    return '<span class="tok-num">'+m+'</span>';
  });
  return e;
}

function scoreExercise(H, W, N){
  if(N <= 0){ return 0; }
  return Math.max(0, (H - W) / N);
}
function normTxt(s){
  return String(s).trim().toLowerCase().replace(/\s+/g,' ').replace(/[.,;]+$/,'');
}

/* ================= timer state machine ================= */
function setTState(st){
  T.state = st;
  var el = $('tstate');
  if(!el){ return; }
  el.className = 'tstate';
  if(st === 'RUNNING'){ el.classList.add('running'); el.innerHTML = '&#9654; RUNNING'; }
  else if(st === 'PAUSED_MANUAL'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; manual (press Resume)'; }
  else if(st === 'PAUSED_AUTO_CHECK'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; reviewing feedback (resumes on Next)'; }
  else if(st === 'ENDED'){ el.classList.add('ended'); el.innerHTML = '&#9632; ENDED'; }
  renderTimerBox();
}
function renderTimerBox(){ var el = $('timerbox'); if(el){ el.textContent = fmtTime(T.remaining); } }
function tick(){
  if(T.state === 'RUNNING'){
    T.remaining -= 1;
    renderTimerBox();
    var tc = $('termclock');
    if(tc && S && (S.screen === 'exam') && curEx() && curEx().type === 'terminal' && !curEx()._checked && curEx()._tleft !== null && curEx()._tleft !== undefined){
      curEx()._tleft -= 1;
      if(curEx()._tleft <= 0){ curEx()._tleft = 0; tc.textContent = '\u23f1 0:00 left — grading now'; curEx()._autoGrade = true; gradeCurrent(); return; }
      tc.textContent = '\u23f1 ' + Math.floor(curEx()._tleft/60) + ':' + (curEx()._tleft%60 < 10 ? '0' : '') + (curEx()._tleft%60) + ' left on this terminal (pauses with the exam timer)';
    }
    if(T.remaining <= 0){
      T.remaining = 0;
      setTState('ENDED');
      finishAttempt(true);
    }
  } else if(T.state === 'PAUSED_MANUAL'){ T.manualTotal += 1; }
  else if(T.state === 'PAUSED_AUTO_CHECK'){ T.autoTotal += 1; }
}

/* ================= intro screen ================= */
function typeLabel(t){
  return {
    mcq:'multiple choice', multi:'multi-select (partial credit)', match:'matching pairs',
    dnd:'drag & drop', order:'timeline ordering', fib:'fill-in-the-blank',
    terminal:'fake terminal command', branch:'branching decision scenario',
    triage:'SOC alert-queue triage', logview:'log viewer analysis'
  }[t] || t;
}
var TYPE_ICONS = {mcq:'A.', multi:'☑', match:'⇄', dnd:'✥', order:'↕', fib:'▁', terminal:'>_ ', branch:'⑃', triage:'▦', logview:'☰'};

function renderIntro(){
  S.screen = 'intro';
  var exTypes = [];
  DATA.exercises.forEach(function(e){ if(exTypes.indexOf(e.type) < 0){ exTypes.push(e.type); } });
  var chips = exTypes.map(function(t){ return '<span class="typechip">'+esc(TYPE_ICONS[t]||'•')+' '+esc(typeLabel(t))+'</span>'; }).join('');
  var themes = DATA.themes.map(function(th){
    return '<div class="themebox"><h4>'+esc(th.name)+'</h4><ul>'+ th.concepts.map(function(c){ return '<li>'+esc(c)+'</li>'; }).join('') +'</ul></div>';
  }).join('');
  var learn = DATA.learn.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('');
  var app = $('app');
  app.innerHTML =
  '<div class="intro-hero card">'+
    '<h1>'+esc(META.title)+'</h1>'+
    '<div class="objline"><b>'+esc(DATA.object.id)+' — '+esc(DATA.object.name)+'</b> &nbsp;·&nbsp; ATT&amp;CK object type: '+esc(DATA.object.type)+' &nbsp;·&nbsp; Tactic: '+esc(DATA.object.tactic)+'</div>'+
    '<div class="objline">Platform(s): '+esc(DATA.object.platforms)+'</div>'+
    '<div class="factrow">'+
      '<span class="badge '+sevClass()+'">'+esc(DATA.severityWord)+'</span>'+
      '<span class="fact">▦ <span><b>'+DATA.exercises.length+'</b> exercises</span></span>'+
      '<span class="fact">⏱ <span>estimated time <b>'+META.estimatedMinutes+' min</b> — the countdown timer gives you the same <b>'+META.timerMinutes+' min</b></span></span>'+
      '<span class="fact">◎ <span>pass mark <b>'+META.passMark+'%</b></span></span>'+
      (S.init && S.init.username ? '<span class="userchip">👤 Analyst: '+esc(S.init.username)+'</span>' : '')+
    '</div>'+
  '</div>'+
  '<section class="card"><h2>What you will learn here</h2>'+learn+'</section>'+
  '<section class="card"><h2>Keywords covered in this exam</h2><div class="themegrid">'+themes+'</div>'+
    '<p class="kw-note">Each keyword above is exercised at least once in this file. Themes follow the structure of the ATT&amp;CK page for '+esc(DATA.object.id)+'.</p></section>'+
  '<section class="card"><h2>How this exam works</h2>'+
    '<div class="typechips">'+chips+'</div>'+
    '<ul class="rulelist">'+
    '<li><span class="rl-ico">◎</span><span><b>Pass mark '+META.passMark+'%.</b> Your score is computed only over the exercises you actually answered (checked). PASS means you scored at least '+META.passMark+'%; FAIL means you should retake the exam.</span></li>'+
    '<li><span class="rl-ico">⚖</span><span><b>Partial credit.</b> Multi-answer exercises are graded per item: credit = max(0, (correct items selected − wrong items selected) ÷ total correct items). Selecting everything is graded 0, not full marks.</span></li>'+
    '<li><span class="rl-ico">💡</span><span><b>Hint costs 10% of the exercise credit.</b> One hint per exercise. The hint gives a nudge, never the answer.</span></li>'+
    '<li><span class="rl-ico">⏱</span><span><b>Timer.</b> A countdown runs for '+META.timerMinutes+' minutes. <b>Pause</b> is manual: it hides the exercise until you press Resume. Pressing <b>Check</b> also pauses the timer automatically while you study the feedback — the exercise stays visible, and the timer resumes only when you press <b>Next</b> (or Final Submit on the last exercise).</span></li>'+
    '<li><span class="rl-ico">⤼</span><span><b>Skip.</b> Every exercise can be skipped without penalty. Skipped exercises go to a review pool. Before you finish, you can return to them as many times as the timer allows. Skipped-and-never-answered exercises are excluded from the score completely.</span></li>'+
    '</ul>'+
    '<div class="btnrow"><button class="btn primary" id="startbtn" onclick="startAttempt()">▶ Start the exam</button></div>'+
  '</section>';
  window.scrollTo(0,0);
}

/* ================= exam flow ================= */
function constrainedShuffle(){
  var isTerm = EXS.map(function(e){ return e.type === 'terminal'; });
  var ord = EXS.map(function(e,i){ return i; });
  for(var tries=0; tries<80; tries++){
    ord = shuffle(EXS.map(function(e,i){ return i; }));
    var ok = true;
    for(var k=1; k<ord.length; k++){ if(isTerm[ord[k]] && isTerm[ord[k-1]]){ ok = false; break; } }
    if(ok){ return ord; }
  }
  return ord;
}
function startAttempt(){
  EXS = DATA.exercises.map(function(e){ return JSON.parse(JSON.stringify(e)); });
  S = {
    screen:'exam', order:[], cur:0, creditSum:0, answered:0, checkedCount:0,
    skipped:[], reported:false, init:S ? S.init : null, reviewing:null
  };
  S.order = shuffle(EXS.map(function(e,i){ return i; }));
  EXS.forEach(function(ex){
    ex._checked = false; ex._credit = 0; ex._hintUsed = false; ex._ans = null; ex._items = null; ex._autoGrade = false;
    if(ex.type === 'mcq' || ex.type === 'multi' || ex.type === 'logview'){ ex._optOrder = shuffle(ex.options.map(function(o,i){ return i; })); }
    if(ex.type === 'match'){ ex._rightOrder = shuffle(ex.right.map(function(r,i){ return i; })); }
    if(ex.type === 'dnd'){ ex._bankOrder = shuffle(ex.bank.map(function(b,i){ return i; })); }
    if(ex.type === 'order'){ ex._seq = shuffle(ex.sequence.slice()); }
    if(ex.type === 'terminal'){ ex._log = []; ex._lastCmd = null; ex._tleft = (ex.cmd && ex.cmd.timeLimit) ? ex.cmd.timeLimit : null; }
    if(ex.type === 'branch'){ ex._step = 0; ex._picks = []; ex._pendingPick = null; }
  });
  T = { remaining: META.timerMinutes*60, state:'RUNNING', iv:null, manualTotal:0, autoTotal:0 };
  if(T.iv){ clearInterval(T.iv); }
  T.iv = setInterval(tick, 1000);
  setTState('RUNNING');
  S.screen = 'exam';
  S.cur = 0;
  S.order = constrainedShuffle();
  LASTKEY = '';
  renderExamShell();
  renderExercise();
}
function curEx(){ return EXS[S.order[S.cur]]; }
function sevClass(){ return 'sev-' + (META.difficulty === 'extremely-hard' ? 'extreme' : META.difficulty); }

function renderExamShell(){
  $('app').innerHTML =
    '<div class="topbar" id="topbar">'+
      '<span class="tb-item" id="tb-counter"></span>'+
      '<span class="tb-item"><span class="badge '+sevClass()+'" id="tb-badge"></span></span>'+
      '<span class="tb-item" id="tb-part"></span>'+
      '<span class="tb-item">⏱ <span class="timerbox" id="timerbox">--:--</span> <span class="tstate" id="tstate"></span></span>'+
      '<span class="tb-item tb-score">◎ Score: <strong id="tb-score">0 / 0</strong> <span id="tb-pct">(0%)</span></span>'+
      (S.init && S.init.username ? '<span class="userchip">👤 '+esc(S.init.username)+'</span>' : '')+
      '<span style="flex:1"></span>'+
      '<button class="btn ghost" id="btn-pause" onclick="pauseManual()">⏸ Pause</button>'+
      '<button class="btn amber" id="btn-hint" onclick="doHint()">💡 Hint <small style="opacity:.8">−10%</small></button>'+
      '<button class="btn ghost" id="btn-skip" onclick="doSkip()">⤼ Skip</button>'+
    '</div>'+
    '<div id="pbarwrap"><div id="pbar"></div></div>'+
    '<div id="exarea"></div>';
  $('tb-badge').textContent = DATA.severityWord;
  $('tb-part').innerHTML = DATA.partLabel ? '<span class="statechip st-skipped">'+esc(DATA.partLabel)+'</span>' : '';
  $('pbar').style.setProperty('--sev', 'var(--sev-' + META.difficulty.replace('extremely-hard','extreme') + ')');
  renderTimerBox();
  setTState(T ? T.state : 'RUNNING');
  updateHeader();
}
function updateHeader(){
  if(!$('tb-counter')){ return; }
  var ex = curEx();
  if(S.screen === 'exam'){
    $('tb-counter').innerHTML = 'Exercise <strong>'+(S.cur+1)+'</strong> of <strong>'+EXS.length+'</strong>';
  } else if(S.screen === 'open'){
    $('tb-counter').innerHTML = '⚠ Reviewing skipped exercise <strong>'+(S.reviewPos+1)+'</strong> of <strong>'+S.skipped.length+'</strong>';
  } else if(S.screen === 'review'){
    $('tb-counter').innerHTML = 'Review skipped exercises';
  }
  $('tb-score').textContent = round1(S.creditSum).toFixed(1) + ' / ' + S.answered;
  var pct = S.answered > 0 ? Math.round((S.creditSum / S.answered) * 100) : 0;
  $('tb-pct').textContent = '(' + pct + '%)';
  var p = Math.round((S.checkedCount / EXS.length) * 100);
  $('pbar').style.width = p + '%';
  var hintDis = S.screen !== 'exam' && S.screen !== 'open';
  hintDis = hintDis || !ex || ex._hintUsed || ex._checked;
  $('btn-hint').disabled = !!hintDis;
  $('btn-skip').disabled = S.screen !== 'exam' || !ex || ex._checked;
  var pb = $('btn-pause'); if(pb){ pb.disabled = !T || T.state === 'ENDED'; }
}

/* ---------- scenario / question blocks ---------- */
function scenarioHtml(ex){
  var arts = (ex.scenario || []).map(function(a, i){
    if(a.kind === 'log' || a.kind === 'code'){
      var lines = a.text.split('\n').map(function(l){ return '<div class="ln">'+hl(l)+'</div>'; }).join('');
      return '<div class="artefact"><span class="art-label">'+esc(a.label)+'</span><div class="art-body"><pre class="mono" style="background:transparent;border:none;padding:0;margin:0">'+lines+'</pre></div></div>';
    }
    return '<div class="artefact"><span class="art-label">'+esc(a.label)+'</span><div class="art-body"><p>'+esc(a.text).replace(/\n/g,'<br>')+'</p></div></div>';
  }).join('');
  var sum = '<div class="blk-body" id="scen-sum" style="border-top:1px dashed var(--border);padding:10px 16px"><span class="art-label" style="padding:0 0 4px 0">⚠ ONE-LINE SUMMARY</span><p style="margin:2px 0">'+esc(ex.summary)+'</p></div>';
  return '<div class="blk scenario" id="blk-scen">'+
    '<div class="blk-head"><span class="blk-ico">🛰</span> SCENARIO'+
      '<span style="flex:1"></span>'+
      '<button class="btn ghost" id="scen-toggle" style="min-height:44px;padding:4px 12px" onclick="toggleScenario()" aria-expanded="true">▲ Collapse</button>'+
    '</div>'+
    '<div class="blk-body" id="scen-body">'+arts+'</div>'+sum+
  '</div>';
}
function toggleScenario(){
  var b = $('scen-body'), t = $('scen-toggle');
  if(!b){ return; }
  var open = !b.classList.contains('hidden');
  b.classList.toggle('hidden', open);
  t.textContent = open ? '▼ Expand' : '▲ Collapse';
  t.setAttribute('aria-expanded', String(!open));
}

/* ---------- answer widgets ---------- */
function optRowHtml(ex, i, kind){
  var o = ex.options[i];
  var dk = dispKey(ex, i);
  var inp = '<input type="'+(kind==='multi'?'checkbox':'radio')+'" name="ans" id="opt-'+i+'" value="'+i+'" onchange="pickOpt()" aria-label="Option '+letterKey(dk)+'">';
  return '<label class="opt" id="optrow-'+i+'">'+inp+'<span class="opt-key">'+letterKey(dk)+'.</span><span class="opt-text">'+esc(o.t)+'</span></label>';
}
function answerHtml(ex){
  var h = '';
  var i;
  if(ex.type === 'mcq'){
    h = '<div class="optlist" id="answidget">' + ex._optOrder.map(function(oi){ return optRowHtml(ex, oi, 'mcq'); }).join('') + '</div>';
  } else if(ex.type === 'logview'){
    var lines0 = ex.log.map(function(l,i){ return '<div class="ln" data-ln="'+i+'">'+hl(l)+'</div>'; }).join('');
    h = '<div id="answidget"><div class="logtool"><div class="logbar"><span class="lg-title">☰ '+esc(ex.logTitle||'log viewer')+'</span><input id="logfilter" placeholder="'+esc(ex.filterPlaceholder||'filter lines...')+'" aria-label="Filter log lines" oninput="logFilter()"></div><div class="loglines" id="loglines">'+lines0+'</div></div>'+
      '<div class="optlist" style="margin-top:12px">' + ex._optOrder.map(function(oi){ return optRowHtml(ex, oi, ex.multi?'multi':'mcq'); }).join('') + '</div></div>';
  } else if(ex.type === 'multi'){
    h = '<div class="optlist" id="answidget">' + ex._optOrder.map(function(oi){ return optRowHtml(ex, oi, 'multi'); }).join('') + '</div>';
  } else if(ex.type === 'match'){
    var rows = ex.left.map(function(L, li){
      var opts = '<option value="">— choose a match —</option>' + ex._rightOrder.map(function(ri){
        var r = ex.right[ri];
        return '<option value="'+ri+'">'+esc(r.t)+'</option>';
      }).join('');
      return '<div class="matchrow"><span class="m-left">'+esc(L.t)+'</span><select class="anssel" id="match-'+li+'" onchange="pickMatch()" aria-label="Match for item '+(li+1)+'">'+opts+'</select></div>';
    }).join('');
    h = '<div id="answidget">'+rows+'<p class="kw-note">⇄ Matching: each correct pair earns its own credit; a wrong pair subtracts.</p></div>';
  } else if(ex.type === 'dnd'){
    var bank = ex._bankOrder.map(function(bi){
      var b = ex.bank[bi];
      return '<button type="button" class="chip" draggable="true" data-bank="'+bi+'" id="chip-'+bi+'" onclick="chipClick('+bi+')" ondragstart="chipDrag(event,'+bi+')">'+esc(b.t)+'</button>';
    }).join('');
    var zones = ex.zones.map(function(z, zi){
      return '<div class="zone" id="zone-'+zi+'" data-zone="'+zi+'" onclick="zoneClick('+zi+')" ondragover="zoneDragOver(event,'+zi+')" ondragleave="zoneDragLeave(event)" ondrop="zoneDrop(event,'+zi+')"><h5>⬇ '+esc(z.name)+'</h5><div class="zone-slot" id="zoneslot-'+zi+'"></div></div>';
    }).join('');
    h = '<div id="answidget"><div class="dndwrap"><div class="dndbank"><h4>✥ ITEM BANK (click a chip, then click a zone — or drag)</h4><div id="bank">'+bank+'</div></div><div class="zones">'+zones+'</div></div><p class="kw-note">✥ Each correctly filled zone earns its own credit; a wrongly filled zone subtracts.</p></div>';
  } else if(ex.type === 'order'){
    h = '<div id="answidget"><ul class="seq" id="seqlist"></ul><p class="kw-note">↕ Put the steps in the correct order. Every step in its correct position earns credit.</p></div>';
  } else if(ex.type === 'fib'){
    var parts = ex.template.split(/\{b(\d+)\}/);
    var htmlp = '';
    for(var k=0;k<parts.length;k++){
      if(k%2===1){ htmlp += '<input class="blank-in" id="blank-'+parts[k]+'" size="'+(ex.blanks[parseInt(parts[k],10)].width||18)+'" autocomplete="off" spellcheck="false" aria-label="Blank '+(parseInt(parts[k],10)+1)+'" oninput="pickFib()">'; }
      else { htmlp += esc(parts[k]); }
    }
    h = '<div id="answidget" class="blanks">'+htmlp+'</div>';
  } else if(ex.type === 'terminal'){
    var panel = '';
    if(ex.cmd.syntaxPanel){ panel = '<div class="syntaxpanel"><span class="sp-title">SYNTAX REMINDER</span><pre class="mono" style="background:transparent;border:none;padding:6px 0 0 0;margin:0">'+hl(ex.cmd.syntaxPanel)+'</pre></div>'; }
    if(ex.cmd.timeLimit){ panel += '<p class="term-clock" id="termclock">⏱ This terminal has its own ' + Math.floor(ex.cmd.timeLimit/60) + ':' + (ex.cmd.timeLimit%60<10?'0':'')+(ex.cmd.timeLimit%60) + ' budget — it pauses with the exam timer.</p>'; }
    h = '<div id="answidget">'+panel+
      '<div class="shell"><div class="scroll" id="shelllog">'+ ex._log.map(function(l){ return '<div class="'+(l.err?'out-err':'out-ok')+'">'+hl(l.t)+'</div>'; }).join('') +'</div>'+
      '<div class="promptline"><span class="prompt">'+esc(ex.cmd.prompt)+'</span><input id="shellin" autocomplete="off" spellcheck="false" aria-label="Terminal input" onkeydown="if(event.key===\'Enter\'){shellRun();}"><button type="button" class="btn ghost answerctl" onclick="shellRun()" style="min-height:44px">↵ Run</button></div>'+
      '</div>'+
      '<div class="btnrow"><button type="button" class="btn green answerctl" id="termcheck" onclick="gradeCurrent()">✓ Check</button></div></div>';
  } else if(ex.type === 'branch'){
    h = '<div id="answidget"></div>';
  } else if(ex.type === 'triage'){
    var rows = ex.rows.map(function(r, ri){
      var opts = '<option value="">— choose a disposition —</option>' + r.options.map(function(o,oi){ return '<option value="'+oi+'">'+esc(o)+'</option>'; }).join('');
      return '<div class="trirrow"><span class="t-alert">'+esc(r.alert)+'</span><select class="anssel" id="tri-'+ri+'" onchange="pickTriage()" aria-label="Disposition for alert '+(ri+1)+'">'+opts+'</select><span class="t-detail">'+esc(r.detail)+'</span></div>';
    }).join('');
    h = '<div id="answidget">'+rows+'</div>';
  }
  return h;
}

/* ---------- ordering list (in-place re-render) ---------- */
function renderSeqList(){
  var ex = curEx();
  var ul = $('seqlist');
  if(!ul){ return; }
  ul.innerHTML = ex._seq.map(function(t, i){
    return '<li id="seqitem-'+i+'"><span class="seq-pos">'+(i+1)+'</span><span class="seq-text">'+esc(t)+'</span><span class="seq-btns">'+
      '<button type="button" class="btn ghost answerctl" onclick="seqMove('+i+',-1)" aria-label="Move item '+(i+1)+' up">▲</button>'+
      '<button type="button" class="btn ghost answerctl" onclick="seqMove('+i+',1)" aria-label="Move item '+(i+1)+' down">▼</button></span></li>';
  }).join('');
}

/* ---------- render one exercise ---------- */
var LASTKEY = '';
function renderExercise(){
  var ex = curEx();
  var q = '<div class="blk question"><div class="blk-head"><span class="blk-ico">❓</span> QUESTION</div><div class="blk-body"><div class="qtext">'+esc(ex.question)+'</div></div></div>';
  var ans = '<div class="blk answer"><div class="blk-head"><span class="blk-ico">✎</span> YOUR ANSWER</div><div class="blk-body">'+
    (ex.type==='terminal' ? '' : '<div class="btnrow" style="margin:0 0 6px 0"><button type="button" class="btn green answerctl" id="checkbtn" onclick="gradeCurrent()">✓ Check</button></div>')+
    answerHtml(ex)+
  '</div></div>';
  var reviewBanner = '';
  if(S.screen === 'open'){
    reviewBanner = '<div class="hintpanel"><span class="hint-tag">⚠ REVIEWING A SKIPPED EXERCISE</span>Answer it and press Check, then press Next to return to the review list. The timer resumes when you leave this exercise.</div>';
  }
  $('exarea').innerHTML = reviewBanner + scenarioHtml(ex) + q + ans + '<div id="fback" role="status" aria-live="polite"></div>';
  if(ex.type === 'terminal'){
    if(ex._log.length === 0 && ex.cmd.banner){ ex._log.push({t: ex.cmd.banner, err:false}); }
    var si = $('shellin'); if(si){ si.focus(); }
    if(ex._tleft !== null && ex._tleft !== undefined && !ex._checked){
      var tc0 = $('termclock');
      if(tc0){ tc0.textContent = '⏱ ' + Math.floor(ex._tleft/60) + ':' + (ex._tleft%60 < 10 ? '0' : '') + (ex._tleft%60) + ' left on this terminal (pauses with the exam timer)'; }
    }
  }
  if(ex.type === 'order'){ renderSeqList(); }
  if(ex.type === 'branch'){ renderBranchStep(); }
  updateCheckState();
  updateHeader();
  flowLockRelease();
  var key = S.screen + ':' + S.cur;
  if(key !== LASTKEY){ LASTKEY = key; window.scrollTo(0,0); }
}
function updateCheckState(){
  var cb = $('checkbtn');
  if(!cb){ return; }
  var ex = curEx();
  if(ex && ex.type === 'branch' && !ex._checked && ex._step < ex.steps.length){
    cb.disabled = true;
    cb.title = 'Confirm every step first — confirming a step does not stop the timer.';
  } else {
    cb.disabled = false;
    cb.title = '';
  }
}
function lockAnswer(){
  var w = $('answidget');
  if(w){ w.classList.add('locked'); w.querySelectorAll('input,select,button').forEach(function(el){ el.disabled = true; }); }
  var cb = $('checkbtn'); if(cb){ cb.disabled = true; }
  var sh = $('shellin'); if(sh){ sh.disabled = true; }
  var tc = $('termcheck'); if(tc){ tc.disabled = true; }
}

/* ---------- answer capture ---------- */
function getMcqSel(){
  var sel = document.querySelector('input[name="ans"]:checked');
  return sel ? parseInt(sel.value,10) : -1;
}
function getMultiSel(){
  var out = [];
  document.querySelectorAll('input[name="ans"]:checked').forEach(function(el){ out.push(parseInt(el.value,10)); });
  return out;
}
function pickOpt(){
  document.querySelectorAll('.opt').forEach(function(r){ r.classList.remove('selected'); });
  document.querySelectorAll('input[name="ans"]:checked').forEach(function(el){
    var row = $('optrow-'+el.value); if(row){ row.classList.add('selected'); }
  });
}

/* ---------- grading ---------- */
function applyHintPenalty(credit, ex){
  if(ex._hintUsed){ return Math.max(0, credit - 0.10); }
  return credit;
}
function gradeCurrent(){
  if(S.screen !== 'exam' && S.screen !== 'open'){ return; }
  var ex = curEx();
  if(ex._checked){ return; }
  if(ex.type === 'branch' && ex._step < ex.steps.length){
    var fb = $('fback');
    if(fb){ fb.innerHTML = '<div class="hintpanel"><span class="hint-tag">⏳ NOT FINISHED YET</span>Confirm every step of this decision first (the timer keeps running while you decide). The Check button unlocks after the final step.</div>'; }
    return;
  }
  var res = gradeEx(ex);
  ex._items = res.items;
  ex._dangerous = res.dangerous || false;
  ex._credit = applyHintPenalty(res.credit, ex);
  ex._checked = true;
  S.creditSum += ex._credit;
  S.answered += 1;
  S.checkedCount += 1;
  var idx = EXS.indexOf(ex);
  var poolIdx = S.skipped.indexOf(idx);
  if(poolIdx >= 0){ S.skipped.splice(poolIdx, 1); }
  if(T.state === 'RUNNING'){ setTState('PAUSED_AUTO_CHECK'); }
  renderFeedback(ex, res);
  lockAnswer();
  updateHeader();
}
function itemRow(state, label, note){
  var ico = state==='correct' ? '✓ Correct' : (state==='wrong' ? '✗ Wrong' : '○ Missed');
  var cls = state==='correct' ? 'st-correct' : (state==='wrong' ? 'st-incorrect' : 'st-skipped');
  return '<li><span class="fi-ico '+cls+'">'+ico+'</span><span><b>'+esc(label)+'</b>'+(note ? '<span class="fi-note">'+esc(note)+'</span>' : '')+'</span></li>';
}
function renderFeedback(ex, res){
  var c = ex._credit;
  var head, cls;
  if(c >= 1){ head = '<span class="statechip st-correct">✓ CORRECT</span>'; cls='f-correct'; }
  else if(c > 0){ head = '<span class="statechip st-partial">✓ PARTIALLY CORRECT</span><span class="creditline">credit '+c.toFixed(2)+' — '+res.h+'/'+res.n+' items'+(ex._hintUsed?' (−0.10 hint penalty)':'')+'</span>'; cls='f-partial'; }
  else { head = '<span class="statechip st-incorrect">✗ INCORRECT</span><span class="creditline">credit 0.00'+(ex._hintUsed?' (−0.10 hint penalty)':'')+'</span>'; cls='f-incorrect'; }
  if(ex._dangerous){ head += '<span class="statechip st-incorrect">✗ DANGEROUS — NEAR MISS</span>'; }
  var correctAnswer = '';
  if(ex.type === 'mcq' || (ex.type === 'logview' && !ex.multi)){
    var ci = ex.options.map(function(o,i){ return o.correct ? i : -1; }).filter(function(i){ return i>=0; })[0];
    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT ANSWER</span>'+esc(letterKey(dispKey(ex,ci))+'. '+ex.options[ci].t)+'</div>';
  } else if(ex.type === 'terminal'){
    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CANONICAL COMMAND</span><div class="copywrap"><pre class="codeblock" style="margin:6px 0 0 0">'+esc(ex.cmd.canonical)+'<button class="btn ghost answerctl" id="copycanon" data-cmd="1" style="min-height:44px;padding:6px 12px;margin-left:10px">⧉ Copy</button></pre></div></div>';
  } else if(ex.type === 'fib'){
    var ca = ex.blanks.map(function(b,i){ return esc(b.accept[0]); }).join(' | ');
    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT ANSWERS</span><span class="mono">'+ca+'</span></div>';
  } else if(ex.type === 'order'){
    var oc = ex.sequence.map(function(s,i){ return (i+1)+'. '+esc(s); }).join('<br>');
    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT ORDER</span>'+oc+'</div>';
  } else if(ex.type === 'match'){
    var mc = ex.left.map(function(L){ return esc(L.t)+' → '+esc(ex.right[L.match].t); }).join('<br>');
    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT PAIRS</span>'+mc+'</div>';
  } else if(ex.type === 'dnd'){
    var dc = ex.zones.map(function(z){ return esc(z.name)+' ← '+esc(ex.bank[z.accepts[0]].t); }).join('<br>');
    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT PLACEMENTS</span>'+dc+'</div>';
  } else if(ex.type === 'triage'){
    var tc = ex.rows.map(function(r,i){ return 'Alert '+(i+1)+': '+esc(r.options[r.correctIndex]); }).join('<br>');
    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT DISPOSITIONS</span>'+tc+'</div>';
  } else if(ex.type === 'multi' || (ex.type === 'logview' && ex.multi)){
    var oc2 = ex.options.map(function(o,i){ return o.correct ? esc(letterKey(dispKey(ex,i))+'. '+o.t) : null; }).filter(Boolean).join('<br>');
    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT ANSWERS</span>'+oc2+'</div>';
  } else if(ex.type === 'branch'){
    var bc = ex.steps.map(function(s,i){ return 'Step '+(i+1)+': '+esc(s.options.filter(function(o){ return o.correct; })[0].t); }).join('<br>');
    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ BEST DECISIONS</span>'+bc+'</div>';
  }
  var items = (ex._items || []).map(function(it){ return itemRow(it.state, it.label, it.note); }).join('');
  var study = (c < 1 && ex.study) ? '<div class="studypointer">📚 <b>What to study:</b> '+esc(ex.study)+'</div>' : '';
  var nextBtn = '<div class="btnrow"><button class="btn primary" onclick="goNext()">'+(isLastGraded() && S.screen==='exam' ? '⏭ Final Submit' : '⏭ Next')+'</button></div>';
  $('fback').innerHTML = '<div class="feedback '+cls+'"><div class="fb-head">'+head+'</div><div class="fb-body">'+
    (ex._autoGrade ? '<p class="creditline">⏱ The terminal budget ran out, so your last command was graded as typed.</p>' : '') +
    correctAnswer +
    '<p>'+esc(ex.explain)+'</p>'+
    (items ? '<ul class="fb-items">'+items+'</ul>' : '')+
    study + nextBtn + '</div></div>';
  var cc = $('copycanon');
  if(cc){ cc.addEventListener('click', function(){ copyCmd(cc, ex.cmd.canonical); }); }
  var fb = $('fback'); if(fb){ fb.scrollIntoView({behavior:'smooth', block:'nearest'}); }
}
function isLastGraded(){
  return S.cur >= EXS.length - 1;
}
function copyCmd(btn, txt){
  var done = function(){ btn.textContent = '✓ Copied'; setTimeout(function(){ btn.textContent = '⧉ Copy'; }, 1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, done);
  } else { done(); }
}

/* ---------- per-type grading ---------- */
function gradeEx(ex){
  var items = [], H=0, W=0, N=0, dangerous=false;
  var i, j;
  if(ex.type === 'mcq'){
    N = 1;
    var sel = getMcqSel();
    var ci = ex.options.map(function(o,k){ return o.correct ? k : -1; }).filter(function(k){ return k>=0; })[0];
    if(sel === ci){ H = 1; items.push({state:'correct', label:'Option '+letterKey(dispKey(ex,ci)), note:ex.options[ci].why}); }
    else if(sel >= 0){ W = 1; items.push({state:'wrong', label:'Option '+letterKey(dispKey(ex,sel)), note:ex.options[sel].why}); }
    else { items.push({state:'missed', label:'Option '+letterKey(dispKey(ex,ci)), note:ex.options[ci].why}); }
  } else if(ex.type === 'multi' || ex.type === 'logview'){
    var sel2 = getMultiSel();
    ex.options.forEach(function(o,k){
      var picked = sel2.indexOf(k) >= 0;
      if(o.correct){
        N += 1;
        if(picked){ H += 1; items.push({state:'correct', label:'Option '+letterKey(dispKey(ex,k)), note:o.why}); }
        else { items.push({state:'missed', label:'Option '+letterKey(dispKey(ex,k)), note:o.why}); }
      } else if(picked){
        W += 1; items.push({state:'wrong', label:'Option '+letterKey(dispKey(ex,k)), note:o.why});
      }
    });
  } else if(ex.type === 'match'){
    N = ex.left.length;
    ex.left.forEach(function(L, li){
      var v = $('match-'+li) ? parseInt($('match-'+li).value,10) : NaN;
      if(v === L.match){ H += 1; items.push({state:'correct', label:L.t+' → '+ex.right[L.match].t, note:L.why}); }
      else if(!isNaN(v) && $('match-'+li).value !== ''){ W += 1; items.push({state:'wrong', label:L.t+' → '+ex.right[v].t, note:(ex.right[v].why || L.whyMiss || 'That pairing is not correct here. '+L.why)}); }
      else { items.push({state:'missed', label:L.t+' → '+ex.right[L.match].t, note:L.why}); }
    });
  } else if(ex.type === 'dnd'){
    N = ex.zones.length;
    ex.zones.forEach(function(z, zi){
      var placed = ex._ans && ex._ans[zi] !== undefined ? ex._ans[zi] : null;
      if(placed !== null && placed === z.accepts[0]){ H += 1; items.push({state:'correct', label:z.name+' ← '+ex.bank[placed].t, note:z.why}); }
      else if(placed !== null){ W += 1; items.push({state:'wrong', label:z.name+' ← '+ex.bank[placed].t, note:(ex.bank[placed].whyMiss || z.why)}); }
      else { items.push({state:'missed', label:z.name+' ← '+ex.bank[z.accepts[0]].t, note:z.why}); }
    });
  } else if(ex.type === 'order'){
    N = ex.sequence.length;
    ex._seq.forEach(function(t, pos){
      var correctHere = (ex.sequence[pos] === t);
      if(correctHere){ H += 1; items.push({state:'correct', label:'Position '+(pos+1)+': '+t, note:ex.orderWhy ? ex.orderWhy[pos] : 'This step belongs in position '+(pos+1)+'.'}); }
      else { W += 1; items.push({state:'wrong', label:'Position '+(pos+1)+': '+t, note:'Expected: '+ex.sequence[pos]+'. '+(ex.orderWhy ? ex.orderWhy[pos] : '')}); }
    });
  } else if(ex.type === 'fib'){
    N = ex.blanks.length;
    ex.blanks.forEach(function(b, bi){
      var el = $('blank-'+bi);
      var val = el ? normTxt(el.value) : '';
      var ok = b.accept.map(normTxt).indexOf(val) >= 0;
      if(ok){ H += 1; items.push({state:'correct', label:'Blank '+(bi+1)+': '+b.accept[0], note:b.why}); }
      else if(val !== ''){ W += 1; items.push({state:'wrong', label:'Blank '+(bi+1)+': '+el.value, note:b.whyMiss || b.why}); }
      else { items.push({state:'missed', label:'Blank '+(bi+1)+': '+b.accept[0], note:b.why}); }
    });
  } else if(ex.type === 'terminal'){
    N = ex.cmd.elements.length;
    var norm = ex._lastCmd || '';
    ex.cmd.elements.forEach(function(el2){
      var re = new RegExp(el2.re);
      if(re.test(norm)){ H += 1; items.push({state:'correct', label:el2.label, note:el2.why}); }
      else { items.push({state:'missed', label:el2.label, note:el2.why}); }
    });
    (ex.cmd.forbidden || []).forEach(function(f){
      var re = new RegExp(f.re);
      if(re.test(norm)){ W += 1; dangerous = true; items.push({state:'wrong', label:'Used: '+f.label, note:f.why}); }
    });
    if(!norm){ items.unshift({state:'missed', label:'No command was submitted', note:'Type the command and press Run, then Check.'}); }
  } else if(ex.type === 'branch'){
    N = ex.steps.length;
    ex.steps.forEach(function(st2, si2){
      var pick = ex._picks[si2];
      var ci2 = st2.options.map(function(o,k){ return o.correct ? k : -1; }).filter(function(k){ return k>=0; })[0];
      if(pick === ci2){ H += 1; items.push({state:'correct', label:'Step '+(si2+1), note:st2.options[ci2].why}); }
      else if(pick !== undefined && pick !== null){ W += 1; items.push({state:'wrong', label:'Step '+(si2+1), note:st2.options[pick].why}); }
      else { items.push({state:'missed', label:'Step '+(si2+1), note:st2.options[ci2].why}); }
    });
  } else if(ex.type === 'triage'){
    N = ex.rows.length;
    ex.rows.forEach(function(r, ri){
      var el3 = $('tri-'+ri);
      var v = el3 && el3.value !== '' ? parseInt(el3.value,10) : null;
      if(v === r.correctIndex){ H += 1; items.push({state:'correct', label:'Alert '+(ri+1), note:r.why}); }
      else if(v !== null){ W += 1; items.push({state:'wrong', label:'Alert '+(ri+1), note:(r.whyNot && r.whyNot[v] ? r.whyNot[v] : r.why)}); }
      else { items.push({state:'missed', label:'Alert '+(ri+1)+': '+r.options[r.correctIndex], note:r.why}); }
    });
  }
  return { credit: scoreExercise(H, W, N), h:H, w:W, n:N, items:items, dangerous:dangerous };
}

/* ---------- interactions per type ---------- */
function pickMatch(){ /* nothing needed pre-check */ }
function pickFib(){ /* nothing needed pre-check */ }
function pickTriage(){ /* nothing needed pre-check */ }
var armedChip = null;
function chipClick(bi){
  if(curEx()._checked){ return; }
  var chip = $('chip-'+bi);
  if(!chip){ return; }
  if(chip.closest('.zone')){ returnToBank(bi); return; }
  if(armedChip === bi){ chip.classList.remove('armed'); armedChip = null; return; }
  document.querySelectorAll('.chip.armed').forEach(function(c){ c.classList.remove('armed'); });
  armedChip = bi;
  chip.classList.add('armed');
  chip.innerHTML = esc(curEx().bank[bi].t) + ' <span class="chip-armprompt">CLICK A ZONE ▸</span>';
}
function zoneClick(zi){
  if(curEx()._checked){ return; }
  if(armedChip === null){ returnToBankFromZone(zi); return; }
  placeChip(armedChip, zi);
  armedChip = null;
}
function placeChip(bi, zi){
  curEx()._ans = curEx()._ans || {};
  var prevZone = null;
  Object.keys(curEx()._ans).forEach(function(k){ if(curEx()._ans[k] === bi){ prevZone = k; } });
  if(prevZone !== null && String(prevZone) !== String(zi)){ delete curEx()._ans[prevZone]; $('zoneslot-'+prevZone).innerHTML = ''; }
  curEx()._ans[zi] = bi;
  $('zoneslot-'+zi).innerHTML = '<span class="chip" data-inzone="'+bi+'">'+esc(curEx().bank[bi].t)+' <small style="color:var(--text-secondary)">✕ remove</small></span>';
  var chip = $('chip-'+bi);
  if(chip){ chip.classList.add('hidden'); chip.classList.remove('armed'); }
}
function returnToBank(bi){
  var ex = curEx();
  Object.keys(ex._ans || {}).forEach(function(k){ if(ex._ans[k] === bi){ delete ex._ans[k]; $('zoneslot-'+k).innerHTML=''; } });
  var chip = $('chip-'+bi); if(chip){ chip.classList.remove('hidden'); }
}
function returnToBankFromZone(zi){
  var ex = curEx();
  var bi = ex._ans && ex._ans[zi];
  if(bi === undefined || bi === null){ return; }
  returnToBank(bi);
}
function chipDrag(ev, bi){ ev.dataTransfer.setData('text/plain', String(bi)); armedChip = bi; }
function zoneDragOver(ev, zi){ ev.preventDefault(); $('zone-'+zi).classList.add('dragover'); }
function zoneDragLeave(ev){ ev.target.classList && ev.target.classList.remove('dragover'); }
function zoneDrop(ev, zi){
  ev.preventDefault();
  $('zone-'+zi).classList.remove('dragover');
  var bi = parseInt(ev.dataTransfer.getData('text/plain'),10);
  if(!isNaN(bi)){ placeChip(bi, zi); armedChip = null; }
}
function seqMove(i, dir){
  var ex = curEx();
  if(ex._checked){ return; }
  var j = i + dir;
  if(j < 0 || j >= ex._seq.length){ return; }
  var t = ex._seq[i]; ex._seq[i] = ex._seq[j]; ex._seq[j] = t;
  renderSeqList();
}
function shellRun(){
  var ex = curEx();
  var inp = $('shellin');
  if(!inp || inp.disabled){ return; }
  var raw = inp.value;
  if(!raw.trim()){ return; }
  var norm = raw.trim().replace(/\s+/g,' ').toLowerCase();
  ex._lastCmd = norm;
  ex._log.push({t: ex.cmd.prompt + ' ' + raw, err:false});
  var out = null;
  (ex.cmd.outputs || []).forEach(function(o){
    if(!out && new RegExp(o.re).test(norm)){ out = o; }
  });
  if(out){ out.lines.forEach(function(l){ ex._log.push({t:l, err:false}); }); }
  else { ex._log.push({t: ex.cmd.unknown || 'command not recognized for this simulation — check spelling and options', err:true}); }
  renderExercise();
  var lg = $('shelllog'); if(lg){ lg.scrollTop = lg.scrollHeight; }
  var si2 = $('shellin'); if(si2 && !si2.disabled){ si2.focus(); }
}
function logFilter(){
  var q = ($('logfilter').value || '').toLowerCase();
  document.querySelectorAll('#loglines .ln').forEach(function(ln){
    ln.style.display = (!q || ln.textContent.toLowerCase().indexOf(q) >= 0) ? '' : 'none';
  });
}
function renderBranchStep(){
  var ex = curEx();
  var area = $('answidget');
  if(!area){ return; }
  var htmlp = '';
  ex.steps.forEach(function(st2, si2){
    if(si2 > ex._step){ return; }
    var opts = st2.options.map(function(o, oi){
      var selCls = (ex._picks[si2] === oi) ? ' selected' : '';
      return '<label class="opt'+selCls+'" style="margin:6px 0"><input type="radio" name="bstep'+si2+'" value="'+oi+'" '+(ex._picks[si2]===oi?'checked':'')+' onchange="branchPick('+si2+','+oi+')"><span class="opt-key">'+String.fromCharCode(65+oi)+'.</span><span class="opt-text">'+esc(o.t)+'</span></label>';
    }).join('');
    var outcome = (ex._picks[si2] !== undefined && ex._picks[si2] !== null && si2 < ex._step) ?
      '<div class="outcome'+((ex._picks[si2]!==undefined && st2.options[ex._picks[si2]].outcomeBad)?' bad':'')+'">▸ '+esc(st2.options[ex._picks[si2]].outcome)+'</div>' : '';
    htmlp += '<div class="step"><span class="step-tag">STEP '+(si2+1)+' OF '+ex.steps.length+'</span><div class="step-text">'+esc(st2.text)+'</div>'+opts+outcome+
