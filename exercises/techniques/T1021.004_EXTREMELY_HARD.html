<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1021.004 SSH — EXTREMELY_HARD</title>
<style>
:root{
  --bg-page:#070c12;
  --bg-panel:#0d141d;
  --bg-surface:#111a26;
  --bg-surface-2:#0a111a;
  --bg-elev:#172335;
  --ink:#e9eff7;
  --ink-dim:#a9b9cb;
  --ink-faint:#8497ab;
  --line:#1f2b3c;
  --line-soft:#182331;
  --blue:#4aa8e8;   --blue-soft:rgba(74,168,232,.13);
  --amber:#e6aa3c;  --amber-soft:rgba(230,170,60,.13);
  --green:#41c07f;  --green-soft:rgba(65,192,127,.13);
  --red:#ef5a6a;    --red-soft:rgba(239,90,106,.15);
  --sev-easy:#41c07f;
  --sev-medium:#e6aa3c;
  --sev-hard:#f0813c;
  --sev-extreme:#ef5a6a;
  --focus:#4aa8e8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1 0 auto;width:100%;max-width:980px;margin:0 auto;padding:20px 16px 40px}
.foot{flex-shrink:0;margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:12.5px;background:var(--bg-panel)}
.foot b{color:var(--ink-dim);letter-spacing:.08em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-surface-2)}
::-webkit-scrollbar-thumb{background:#24344b;border-radius:6px;border:2px solid var(--bg-surface-2)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(8,13,20,.94);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.14em;font-size:12.5px;color:var(--green)}
.brand small{color:var(--ink-faint);letter-spacing:.05em;font-weight:600}
.tb-sep{width:1px;height:22px;background:var(--line)}
.tb-title{font-weight:700;font-size:13.5px;color:var(--ink-dim);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stat{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;font-weight:600;background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:32px}
.tb-stat .ic{font-size:13px}
.tb-stat.timer{font-family:var(--mono);color:var(--ink)}
.tb-state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px;border:1px solid}
.tb-state.manual{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.tb-state.autocheck{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.tb-btn:hover:not(:disabled){border-color:var(--blue)}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}
.tb-btn.hint{color:var(--amber)}
.tb-btn.skip{color:var(--ink-dim)}
.prog{height:3px;background:var(--line-soft)}
.prog i{display:block;height:100%;background:var(--green);width:0%;transition:width .25s}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 12px;color:#08110b}
.badge::before{content:"●";font-size:9px}
.sev-EASY{background:var(--sev-easy)}
.sev-MEDIUM{background:var(--sev-medium)}
.sev-HARD{background:var(--sev-hard)}
.sev-EXTREMELY_HARD{background:var(--sev-extreme);color:#160407}
.otype{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg-surface)}
/* ---------- intro ---------- */
.intro-head{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--bg-panel),var(--bg-surface-2));padding:26px 26px 20px;margin-bottom:16px}
.intro-head h1{margin:8px 0 4px;font-size:26px;line-height:1.25}
.intro-head .sub{color:var(--ink-dim);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-dim);background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:34px}
.chip .ic{color:var(--ink-faint)}
.cand{margin-top:12px;font-size:13px;color:var(--ink-faint)}
.intro-sec{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;background:var(--bg-panel);padding:18px 22px;margin-bottom:14px}
.intro-sec.learn{border-left-color:var(--blue)}
.intro-sec.keys{border-left-color:var(--amber)}
.intro-sec.how{border-left-color:var(--green)}
.intro-sec h2{margin:0 0 10px;font-size:15px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.intro-sec.learn p{color:var(--ink-dim);margin:0 0 10px}
.intro-sec.learn p:last-child{margin-bottom:0}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kw-card{background:var(--bg-surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 14px}
.kw-card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.kw-card ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:13.5px}
.kw-card li{margin:2px 0}
.rules{margin:0;padding:0;list-style:none}
.rules li{position:relative;padding:7px 0 7px 26px;color:var(--ink-dim);font-size:14px}
.rules li::before{content:"▸";position:absolute;left:4px;color:var(--green)}
.rules li .dim{color:var(--ink-faint)}
/* ---------- exercise card ---------- */
.excard{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--bg-panel);border:1px solid var(--line);border-left:4px solid var(--blk,var(--blue));border-radius:12px;padding:16px 20px}
.blk-scenario{--blk:var(--blue)}
.blk-question{--blk:var(--amber)}
.blk-answer{--blk:var(--green)}
.blk-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--blk,var(--ink));margin-bottom:10px}
.blk-label .dot{width:8px;height:8px;border-radius:50%;background:var(--blk,var(--ink))}
.ex-title{margin:0 0 8px;font-size:16.5px}
.summary{color:var(--ink-faint);font-size:13.5px;font-style:italic;margin:0 0 8px}
.showfull{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;min-height:32px}
.scen-body p{margin:0 0 10px;color:var(--ink-dim)}
.scen-body p:last-child{margin-bottom:0}
details.artef{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin:10px 0 0}
details.artef summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--blue);user-select:none;min-height:40px;display:flex;align-items:center}
details.artef .artbody{padding:0 14px 12px}
.mono{font-family:var(--mono);font-size:13px;line-height:1.5;color:#c8d8e6;background:var(--bg-surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:0}
table.attable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:0}
table.attable th{background:var(--bg-elev);color:var(--ink);text-align:left}
table.attable th,table.attable td{border:1px solid var(--line-soft);padding:6px 10px;color:var(--ink-dim)}
.q-text{margin:0;font-weight:700;font-size:16px;color:var(--ink)}
/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-height:44px;cursor:pointer;color:var(--ink);font-size:14.5px;font-family:var(--sans);margin:0 0 8px}
.opt:last-child{margin-bottom:0}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}
.opt .mark{font-weight:800;flex-shrink:0}
/* ---------- match ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol h4,.obank h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mleft{flex:1;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;min-height:44px;display:flex;align-items:center}
.mzone{flex:1;background:var(--bg-surface-2);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;min-height:44px;color:var(--ink-faint);font-size:13.5px;cursor:pointer;text-align:left;font-family:var(--sans)}
.mzone.filled{border-style:solid;border-color:var(--blue);color:var(--ink)}
.mzone.dragover{border-color:var(--green)}
.mzone.correct{border-color:var(--green);background:var(--green-soft)}
.mzone.wrong{border-color:var(--red);background:var(--red-soft)}
.mbank{display:flex;flex-direction:column}
.mchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;margin-bottom:8px;cursor:grab;color:var(--ink);font-size:13.5px;text-align:left;font-family:var(--sans)}
.mchip:disabled{cursor:default;opacity:.5}
.mchip.selchip{border-color:var(--amber);background:var(--amber-soft)}
.mchip.used{opacity:.35}
.mhintline{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- order ---------- */
.ordlist{list-style:none;margin:0;padding:0;counter-reset:ord}
.orditem{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.orditem.dragover{border-color:var(--green)}
.orditem .num{font-family:var(--mono);color:var(--amber);font-weight:700;min-width:22px;text-align:center}
.orditem .txt{flex:1;font-size:14px}
.orditem.correct{border-color:var(--green)}
.orditem.wrong{border-color:var(--red)}
.ordbtns{display:flex;gap:4px}
.ordbtns button{min-width:34px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);cursor:pointer;font-size:14px}
.ordbtns button:hover{border-color:var(--blue)}
/* ---------- fill ---------- */
.fillwrap{font-size:15.5px;color:var(--ink-dim);line-height:2.1;white-space:pre-wrap}
.fillin{font-family:var(--mono);font-size:13.5px;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 10px;min-height:38px;width:170px;margin:0 3px}
.fillin:focus{border-color:var(--blue);outline:none}
.fillin.correct{border-color:var(--green)}
.fillin.wrong{border-color:var(--red)}
.fbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:38px;font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer}
.fchip:hover{border-color:var(--amber)}
/* ---------- terminal ---------- */
.term{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:8px;background:var(--bg-elev);padding:8px 12px;font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.term-bar .dots{letter-spacing:3px;color:var(--red)}
.term-out{font-family:var(--mono);font-size:13px;line-height:1.55;color:#c8d8e6;padding:12px 14px;min-height:130px;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term-out .tl-dim{color:var(--ink-faint)}
.term-out .tl-danger{color:var(--red);font-weight:700}
.term-out .tl-echo{color:var(--ink)}
.term-line{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding:10px 14px}
.term-prompt{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--mono);font-size:13px;min-height:34px}
.term-in:focus{outline:none}
details.syntax{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin-top:10px}
details.syntax summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--amber);min-height:40px;display:flex;align-items:center}
details.syntax .artbody{padding:0 14px 12px}
/* ---------- logview ---------- */
.logpanel{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log-tools{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-elev);border-bottom:1px solid var(--line-soft)}
.logfilter{flex:1;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 12px;min-height:38px}
.logfilter:focus{border-color:var(--blue);outline:none}
.log-count{font-size:12px;color:var(--ink-faint);font-family:var(--mono);white-space:nowrap}
.loglines{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#bccfe0;padding:12px 14px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.loglines mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}
.wtitle{font-weight:700;margin:14px 0 10px;color:var(--ink)}
/* ---------- decision ---------- */
.dstep{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.dstep.locked{opacity:.9}
.dlabel{display:inline-flex;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue);border-radius:6px;padding:3px 9px;margin-bottom:8px}
.dprompt{font-family:var(--mono);font-size:13px;color:var(--ink-dim);background:var(--bg-surface-2);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 10px;white-space:pre-wrap}
.dq{font-weight:700;margin:0 0 10px}
.drecorded{color:var(--ink-faint);font-size:13px;margin-top:8px}
.dwhy{font-size:13.5px;color:var(--ink-dim);background:var(--bg-surface-2);border-radius:8px;padding:9px 12px;margin-top:8px}
/* ---------- hint ---------- */
.hintbox{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin-top:12px;color:var(--ink-dim)}
.hintbox .hb{color:var(--amber);font-weight:800;font-size:12px;letter-spacing:.1em;display:block;margin-bottom:4px}
.penaltynote{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- feedback ---------- */
.fb{border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.fb.ok{border-color:var(--green)}
.fb.bad{border-color:var(--red)}
.fb.part{border-color:var(--amber)}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 18px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb.ok .fb-head{background:var(--green-soft);color:var(--green)}
.fb.bad .fb-head{background:var(--red-soft);color:var(--red)}
.fb.part .fb-head{background:var(--amber-soft);color:var(--amber)}
.fb-credit{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim);font-weight:600}
.fb-body{padding:14px 18px;background:var(--bg-panel)}
.fi{display:flex;gap:9px;padding:4px 0;font-size:14px;color:var(--ink-dim)}
.fi .ic{flex-shrink:0;font-weight:800}
.fi.ok .ic{color:var(--green)}
.fi.bad .ic{color:var(--red)}
.fi.miss .ic{color:var(--ink-faint)}
.fi.warn .ic{color:var(--red)}
.fi.warn{color:var(--red);font-weight:600}
.fi.note{color:var(--ink-faint)}
.fb-explain{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:12px;color:var(--ink-dim);font-size:14px}
.fb-explain p{margin:0 0 10px}
.fb-explain p:last-child{margin-bottom:0}
.fb-study{margin-top:10px;font-size:13px;color:var(--blue)}
.fb .mono{margin-top:10px}
/* ---------- actions ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:10px 20px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-family:var(--sans)}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:transparent;color:#04120a}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-amber{background:var(--amber);border-color:transparent;color:#1c1204}
.ghost-note{color:var(--ink-faint);font-size:13px}
/* ---------- review ---------- */
.revlist{display:flex;flex-direction:column;gap:10px}
.revrow{display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex-wrap:wrap}
.revrow .rn{font-family:var(--mono);color:var(--amber);font-weight:700}
.revrow .rt{flex:1;color:var(--ink-dim);font-size:14px;min-width:200px}
.revrow .badge-skip{color:var(--ink-faint);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* ---------- results ---------- */
.res-head{border:1px solid var(--line);border-radius:14px;background:var(--bg-panel);padding:26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ring{width:172px;height:172px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--pct)*1%),var(--bg-elev) 0);display:grid;place-items:center;flex-shrink:0}
.ring .rin{width:134px;height:134px;border-radius:50%;background:var(--bg-panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:34px;font-weight:800;font-family:var(--mono)}
.ring .of{font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
.res-verdict{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.res-verdict.pass{color:var(--green)}
.res-verdict.fail{color:var(--red)}
.res-sub{color:var(--ink-dim);font-size:14px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.statcard{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.statcard .sv{font-size:22px;font-weight:800;font-family:var(--mono)}
.statcard .sv.ok{color:var(--green)}
.statcard .sv.part{color:var(--amber)}
.statcard .sv.bad{color:var(--red)}
.statcard .sv.skip{color:var(--ink-faint)}
.statcard .sl{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.pausereport{border:1px solid var(--line);border-radius:10px;background:var(--bg-panel);padding:12px 16px;color:var(--ink-dim);font-size:13.5px;margin-bottom:14px}
.restable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.restable th{background:var(--bg-elev);text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase}
.restable td{padding:8px 12px;border-top:1px solid var(--line-soft);color:var(--ink-dim)}
.restable td.num{font-family:var(--mono)}
.st-ok{color:var(--green);font-weight:700}
.st-part{color:var(--amber);font-weight:700}
.st-bad{color:var(--red);font-weight:700}
.st-skip{color:var(--ink-faint);font-weight:700}
/* ---------- overlay ---------- */

<script type="application/json" id="cm-exercise-meta">{"attackId":"T1021.004","attackName":"SSH","objectType":"sub-technique","severity":"EXTREMELY_HARD","topicId":"t1021.004","batch":4,"title":"T1021.004 SSH — EXTREMELY_HARD","difficulty":"extremely-hard","estimatedMinutes":60,"timerMinutes":60,"questionCount":17,"passMark":70,"learn":["You will learn how T1021.004 — the SSH sub-technique of T1021 Remote Services — chains into full intrusions: stolen certificates, hijacked agents, tunnels inside allowed ports and keys planted for persistence.","You will learn to read conflicting evidence: an approved change ticket that hides a planted key, a nightly cron that suddenly has no CRON line, a certificate minted minutes after a CA rotation.","You will learn the tools of the trade: sshd -T, /tmp/ssh-* socket listings, known_hosts audits with awk, ControlMaster checks with ssh -O check, and certificate fields such as serial and principal.","You will learn the daily roles: IR leads preserve sockets before touching hosts, threat hunters correlate agent reuse across hosts, detection engineers watch authorized_keys writes, and GRC reviewers check the SSH certificate policy.","You will learn to say 'do nothing yet' out loud: when evidence is live and the batch window is running, capturing beats killing — and escalation beats heroics."],"keywords":[{"theme":"Chained Attack Concepts","items":["certificate theft plus ProxyJump","forwarded agent hijack to a second hop","reverse tunnel (-R) inside port 443","authorized_keys persistence line","ControlMaster master-session reuse"]},{"theme":"Telemetry & Noise Handling","items":["'Accepted publickey' with certificate ID and serial","'Failed password for invalid user' internet waves","CRON pairs against session-opened lines","SSH_AUTH_SOCK in /proc environments","known_hosts rows outside the CMDB"]},{"theme":"Config & Certificate Hardening","items":["Match blocks override global values","TrustedUserCAKeys and short-lived certificates","AllowTcpForwarding no","ForceCommand internal-sftp","passphrase-protected keys"]},{"theme":"Tooling","items":["sshd -T effective config","ssh -O check against a control socket","awk over known_hosts","ss socket-to-PID mapping","lastlog for dormant accounts"]}]}</script>

al-sftp","passphrase-protected keys"]},{"theme":"Tooling","items":["sshd -T effective config","ssh -O check against a control socket","awk over known_hosts","ss socket-to-PID mapping","lastlog for dormant accounts"]}]};
var EXAMS = [{"id":"e01","type":"mcq","title":"The Match block that said yes","summary":"MCQ: a Match block overrides the baseline.","scenario":"Valta Energy's baseline on archive-oslo-02 is textbook: PasswordAuthentication no at the top of sshd_config, PermitRootLogin no, AllowGroups grid-admins. Yet the 02:00 wave of 'Failed password' for svc-etl produced one accepted login at 02:14, and svc-etl's name is not in grid-admins. The snapshot ends with a Match block nobody remembered: 'Match User svc-etl' with 'PasswordAuthentication yes' and 'PermitTTY no' beneath it.","question":"Which fact explains svc-etl's accepted password login?","hint":"Config parsing has an order; the last word wins for the user it names.","explanation":"A Match block re-opens settings for the users it names, and its values win over the global ones — so PasswordAuthentication yes applied to svc-etl despite the global no.\n\nThe near-misses misread the parser: AllowGroups filters who may try, PermitTTY has nothing to do with authentication, and Match does not merge values, it replaces them for the matched scope.\n\nDefender view: baselines fail at the bottom of the file — review diffs end-to-end, not just the global section, and alert on any Match block that relaxes authentication.","study":"Study sshd_config Match blocks: scope, override semantics and file order.","options":["The Match block overrides the global value for that user","AllowGroups bypasses PasswordAuthentication for service accounts","PermitTTY no disables password checks alongside TTYs","sshd merges Match blocks with an OR, keeping both values"],"correct":0},{"id":"e02","type":"multi","title":"Live signals among the patch noise","summary":"Multi: two findings of agent reuse, three of noise.","scenario":"Tuesday morning on k8s-edge-fra-05, three things happened at once: patching restarted sshd at 04:00, fail2ban banned a scanner, and p.lindqvist's forwarded agent socket appeared in /tmp while an 'ssh-add -l' run as that user listed a gridops key that belongs on the jump host, not here. The shift lead wants the two findings that prove forwarded-agent reuse, not patch noise.","question":"Select the two findings that prove forwarded-agent reuse:","hint":"Patching and bans happen everywhere; a foreign key inside a live socket does not.","explanation":"A live SSH_AUTH_SOCK for a user on a host that never forwards agents, plus an ssh-add listing that shows another host's key, is the hijack-ready pair; together they name the socket and the key inside it.\n\nThe missed items are the noise artefacts on purpose: patch restarts, fail2ban bans and known_hosts churn happen fleet-wide every Tuesday and carry no agent meaning. Correlate the socket PID with the sshd session that forwarded it before touching anything.","study":"Study forwarded agent evidence: SSH_AUTH_SOCK, ssh-add -l and socket-to-session correlation.","options":["ssh-add -l as p.lindqvist lists the gridops jump key","SSH_AUTH_SOCK for p.lindqvist points into /tmp/ssh-*","sshd restarted at 04:00 during the documented patch window","fail2ban banned 192[.]0[.]2[.]99 after six failures","known_hosts gained a row during the patch window"],"correct":[0,1]},{"id":"e03","type":"logview","title":"Certificate serial 77, then svc-etl","summary":"Logview: cert login plus a same-source account switch.","scenario":"The panel holds the night export from archive-oslo-02. p.lindqvist's certificate login at 22:31 is normal — the SOC tracks the serials. What is not normal: minutes later svc-etl arrives with a plain key from the same source, a host where svc-etl holds no job. The shift note is half-written; finish it from the panel and its artefact.","question":"Complete the half-written shift note from the panel:","hint":"The certificate line carries the serial; the switch of account is the finding.","explanation":"Serial 77 matches the tracked certificate, and the same source address returning as svc-etl with a plain key is the chained move — one identity used to reach a second, quieter account.\n\nThe missed items: the CRON line is the nightly archive job (noise on purpose), and the invalid-user wave is internet background. The pairing — not either line alone — is what earns escalation, and the socket artefact shows whose agent answered for the second hop.","study":"Study chained evidence: same-source account switches after a certificate login.","filterable":true,"log":{"header":["time","line"],"lines":["22:31:07 sshd[7712]: Accepted publickey for p.lindqvist from 10[.]77[.]3[.]24 port 44812 ssh2: ED25519-CERT ID p.lindqvist-grid (serial 77) CA ED25519 SHA256:mK2xQ","22:31:08 sshd[7712]: pam_unix(sshd:session): session opened for user p.lindqvist by (uid=0)","22:33:41 systemd-logind: New session 5512 of user p.lindqvist.","22:34:02 sshd[7799]: Accepted publickey for svc-etl from 10[.]77[.]3[.]24 port 44890 ssh2: ED25519 SHA256:Rt9wB","22:34:03 sshd[7799]: pam_unix(sshd:session): session opened for user svc-etl by (uid=0)","22:41:15 sshd[7712]: Received disconnect from 10[.]77[.]3[.]24 port 44812:11: disconnected by user","23:02:00 CRON[7811]: pam_unix(cron:session): session opened for user svc-archive by (uid=0)","23:05:12 sshd[7820]: Failed password for invalid user admin from 192[.]0[.]2[.]44 port 33412 ssh2"]},"artefacts":[{"label":"ARTEFACT — /tmp socket listing, 22:34","kind":"text","content":"/tmp/ssh-Xq7f2K1234/agent.7712  owner=p.lindqvist  (session pid 7712)\nssh-add -l via that socket: gridops@relay-hel-01 ED25519 SHA256:Kv8qR"}],"widget":{"type":"fill","question":"Fill the shift-note blanks about the pairing:","text":"The 22:31 line authenticates p.lindqvist with a certificate, ___ 77; minutes later svc-etl arrives with a plain key from the same source ___ — on a host where svc-etl holds no job, so the note flags the pairing for ___.","blanks":["serial","10[.]77[.]3[.]24","escalation"],"bank":["serial","10[.]77[.]3[.]24","escalation","password","10[.]44[.]9[.]13","closure"]}},{"id":"e04","type":"fill","title":"Reaching the second hop","summary":"Fill: -J, ProxyJump and ProxyCommand.","scenario":"Valta Energy's red-team debrief rewrites the reach-the-jump-host page. The old page predates the modern options and mixes three spellings of the same idea, so the new card names the modern client flag, the config keyword and the legacy escape hatch — each in its own blank, with no synonyms allowed.","question":"Fill the three jump-host spellings from the bank:","hint":"One is a flag, one a keyword, one a catch-all command option.","explanation":"ssh -J is the modern flag, ProxyJump is its config keyword, and ProxyCommand spells the path out as an arbitrary command for legacy stacks.\n\n'ProxyTelnetCommand' never existed for SSH and 'nc' is a tool ProxyCommand might call, not the keyword itself; keeping the three straight matters because audit scripts grep for the keyword form and miss -J usage on the command line.","study":"Study jump-host access: -J flag, ProxyJump keyword, ProxyCommand escape hatch.","text":"Modern clients reach a jump host with the ___ flag or the ___ keyword in ~/.ssh/config, while legacy setups spell the path out as a ___ command.","blanks":["-J","ProxyJump","ProxyCommand"],"bank":["-J","ProxyJump","ProxyCommand","ProxyTelnetCommand","nc","Match"]},{"id":"e05","type":"order","title":"One evening, five moves","summary":"Order: cert theft to reverse tunnel.","scenario":"Public reporting documents chains where a phished operator's SSH certificate does the whole job. Valta Energy replays one in the purple lab: p.lindqvist's unencrypted certificate is lifted from the laptop, the certificate stays valid for hours, and the grid's agent-forwarding habit hands the operator the second hop for free. Rebuild the five moves in play order.","question":"Order the operator's five moves from first to last:","hint":"The certificate has an expiry — move before it lapses; the agent hands you hop two.","explanation":"Steal the unencrypted certificate, ride ProxyJump through the relay while it is valid, hijack the forwarded agent socket instead of hunting another key, plant a second key for persistence, then open a reverse tunnel to keep the path back.\n\nAttacker view: the chain borrows three legitimate habits — jump hosts, agent forwarding, long-lived authorized_keys — so each hop looks like its owner. Defender view: passphrase-protected keys, no agent forwarding and authorized_keys alerts each cut one move out of five.","study":"Study chained T1021.004 moves: certificate theft, agent hijack, persistence, reverse tunnel.","items":["Lift the unencrypted SSH certificate from p.lindqvist's laptop","Ride ProxyJump through relay-hel-01 while the certificate stays valid","Hijack the forwarded agent socket to sign in as gridops","Append a second key to gridops's authorized_keys on archive-oslo-02","Open a reverse tunnel with -R to keep a path back out"]},{"id":"e06","type":"decision","title":"The ticket that covers too much","summary":"Decision: read the ticket, verify, escalate.","scenario":"23:40 — a monitoring diff shows a new line in gridops's authorized_keys on archive-oslo-02. A change ticket 8841 approves 'gridops key rotation' from 23:00 to 01:00, signed by the gridops owner. At 23:52 the panel also shows a live forwarded agent socket for gridops on the same host — a habit the hardening card says was switched off in March. Work the three steps in order.","question":"Step through the three-part decision chain and commit to one choice per step:","hint":"The ticket explains the key; the socket is the part the ticket cannot explain.","explanation":"The ticket closes the key question but not the socket question; splitting 'explained' from 'unexplained' keeps the response proportionate.\n\nThe traps: treating the open ticket as blanket authorisation misses the agent socket; calling intrusion on the key alone over-fires while the socket — the real anomaly — goes unowned. 'Do nothing yet' here still means: capture PID, parent and command line, then escalate to IR with the pair.","study":"Study change-ticket scoping: what a ticket approves, and what it cannot.","steps":[{"label":"STEP 1 OF 3 — read the ticket","prompt":"Ticket 8841 covers a key rotation in the right window and names the owner.","question":"What does the ticket establish?","options":["The key change may be authorised, but it explains nothing else","The socket is authorised because the ticket is open","The key change is definitely an attack"],"correct":0,"why":"A valid ticket covers only the key write; it cannot authorise a forwarded agent socket that the baseline removed in March."},{"label":"STEP 2 OF 3 — verify the mismatch","prompt":"The key's comment matches the ticket's attached fingerprint; the socket has no ticket at all.","question":"Which conclusion fits both facts?","options":["The key looks approved; the live socket needs an owner before anything else","Both artefacts are attack evidence, act as intrusion now","Both artefacts are routine, close the alert"],"correct":0,"why":"Matching the fingerprint closes the key question; the socket stays unexplained, and unexplained beats 'probably fine' on a hardened host."},{"label":"STEP 3 OF 3 — act","prompt":"The batch window runs until 05:00 and the host cannot be disrupted casually.","question":"What is the right move right now?","options":["Record the socket and its PID, escalate to IR, change nothing yet","Delete the socket and the new key line immediately","Reboot the host during the batch window"],"correct":0,"why":"The socket is live evidence attached to a running session; capture its PID and parent, escalate, and let IR decide — destroying it now loses the chain."}]},{"id":"e07","type":"terminal","title":"Audit the trusted host list","summary":"Terminal: dedupe known_hosts host names.","scenario":"Before IR arrives, you need the list of hosts this workstation has ever trusted. The known_hosts file on relay-hel-01 mixes pinned names with bare addresses, and one row must not belong. Print the deduplicated first column, read-only, for the morning review — and leave the file exactly as it is.","question":"Run the read-only command that prints the deduplicated host column:","hint":"Take the first column, then sort it uniquely; nothing else.","explanation":"awk '{print $1}' pulls the host field (names often pair with addresses before the comma) and sort -u deduplicates the list; the bare 203[.]0[.]113[.]77 row is the one with no CMDB owner.\n\nBoth forbidden moves rewrite or erase the file you are auditing — ssh-keygen -R even prints a friendly note, but the live rows are what IR needs. Follow up with stat on the file's mtime against the change system.","study":"Study known_hosts hygiene: host column format, hashed entries, mtime checks.","prompt":"analyst@relay-hel-01:~$","skill":"known-hosts-audit","knownTools":["awk","cut","sort","ssh-keygen"],"expected":"awk '{print $1}' ~/.ssh/known_hosts | sort -u","elements":[{"label":"the first-column extraction","any":["awk '{print $1}'"]},{"label":"the deduplicated sort","any":["sort -u"]}],"forbidden":[{"any":["ssh-keygen -R"],"why":"ssh-keygen -R rewrites known_hosts mid-forensics and destroys the original rows under review"},{"any":["rm -rf","rm -f"],"why":"wiping the file or the ~/.ssh directory deletes the artefact the audit exists to read"}],"output":["archive-oslo-02,10[.]77[.]3[.]10","relay-hel-01","git-mirror-fra-06","203[.]0[.]113[.]77","sftp-partner[.]example"]},{"id":"e08","type":"match","title":"Folder of artefacts","summary":"Match: five finds to their readings.","scenario":"IR lands and hands out folders: one sshd_config excerpt, one process environment dump, one log line, one key line, one startup line. Valta Energy's runbook wants a one-line reading for each before anyone says the word 'breach'. Some are routine; one is not — and the folder is deliberately unordered.","question":"Match each find to its reading:","hint":"One find is a live agent on the wrong box; one is just a daemon doing its job.","explanation":"The unowned root key line needs an owner check, AllowUsers is the allow-list doing its job, the listening line is routine startup, the SSH_AUTH_SOCK inside a process environment is a live forwarded agent, and the invalid-user failure is internet noise.\n\nThe dangerous misread is the opposite one: calling the startup line evidence of a listener attack wastes the first hour, while waving the agent socket off as noise loses the real lead.","study":"Study artefact triage: routine startup noise versus live agent sockets.","pairs":[{"left":"ssh-ed25519 AAAA…Cvbn in root's authorized_keys, no comment","right":"unowned key — owner check before anything else"},{"left":"AllowUsers gridops p.lindqvist in sshd_config","right":"the logon allow-list working as designed"},{"left":"Server listening on 0[.]0[.]0[.]0 port 22","right":"routine sshd startup line"},{"left":"SSH_AUTH_SOCK=/tmp/ssh-Xq7f2K1234/agent.31204 in a /proc environ","right":"a live forwarded agent on this host"},{"left":"Failed password for invalid user admin from 192[.]0[.]2[.]44","right":"internet background noise"}]},{"id":"e09","type":"mcq","title":"Serial 91 after the rotation","summary":"MCQ: who minted a post-rotation certificate?","scenario":"Valta Energy rotates its SSH CA at 02:50 and publishes the revocation list. At 03:04, relay-hel-01 accepts svc-etl with certificate serial 91, signed by the new CA key, with principal svc-etl and a 12-hour validity. The revocation list covers serials up to 84. svc-etl's owner says no job ran at 03:04.","question":"Which reading fits every fact in the panel?","hint":"The serial is above the revocation line and the signature is the new CA's.","explanation":"Serial 91 sits above the revoked range and the signature matches the new CA key, so the certificate was minted after 02:50 — minutes before use, by whoever holds the CA signing path.\n\nThe near-misses die on one fact each: a cached agent identity would not produce a fresh serial; revocation covers serials up to 84, not 91; and a pre-rotation certificate cannot carry the new CA's signature.\n\nAttacker view: stealing the CA key once beats stealing a hundred user keys. Defender view: alert on issuance events, not only on logins.","study":"Study SSH CA operations: serial ranges, revocation lists and issuance logging.","options":["Someone minted a fresh certificate after the rotation window","The login reused an agent identity cached before the rotation","The certificate was revoked, so sshd should have refused it","The serial proves the certificate predates the rotation window"],"correct":0},{"id":"e10","type":"fill","title":"Three quiet artefacts","summary":"Fill: handshake, known_hosts and lastlog.","scenario":"Valta Energy's hardening card explains three artefacts every SSH audit touches: what a ControlMaster socket saves, which file remembers every trusted host, and which tool lists an account's last successful login. Three blanks went into the card on purpose so the reader names each artefact correctly before touching a host.","question":"Fill the three artefact names from the bank:","hint":"One saves the handshake, one remembers hosts, one lists last logins.","explanation":"A ControlMaster master session skips the handshake for later connections, known_hosts remembers every host key the client trusted, and lastlog prints each account's most recent successful login.\n\n'agent' belongs to the forwarding socket story, not here, and 'btmp' holds failures read by lastb; both were decoys. Dormant accounts with fresh lastlog entries are a classic persistence tell.","study":"Study the artefact trio: ControlMaster sockets, known_hosts, lastlog.","text":"A ControlMaster socket lets later sessions skip the ___, the ___ file records every host key the client ever trusted, and ___ lists each account's most recent successful login.","blanks":["handshake","known_hosts","lastlog"],"bank":["handshake","known_hosts","lastlog","agent","btmp","wtmp"]},{"id":"e11","type":"logview","title":"Names that never existed","summary":"Logview: the internet wave against port 22.","scenario":"The 01:00-02:00 export from relay-hel-01 catches an internet wave against port 22, the nightly CI pull, one certificate login and the usual disconnects. The helpdesk keeps paging the wave; the queue wants proof that the wave never touched a real account, so you pick the two lines that say exactly that — and avoid the near-miss that mentions a real name.","question":"Select the two lines that prove the wave used non-existent accounts:","hint":"'Invalid user' is the tell; root, by contrast, does exist.","explanation":"Both 01:04 lines carry 'invalid user admin' — the account never existed on the host. The 01:07 line targets root, which does exist, so it fails the question even though it belongs to the same wave.\n\nThe noise handling: the wave pages the helpdesk because volume is loud, but non-existent accounts prove it never touched a real identity; the certificate line at 01:22 is the quiet line that actually deserves eyes.","study":"Study 'invalid user' semantics and why volume alone misleads.","filterable":true,"log":{"header":["time","line"],"lines":["01:04:11 sshd[9102]: Invalid user admin from 192[.]0[.]2[.]44 port 33002","01:04:13 sshd[9102]: Failed password for invalid user admin from 192[.]0[.]2[.]44 port 33002 ssh2","01:07:29 sshd[9102]: error: maximum authentication attempts exceeded for root from 192[.]0[.]2[.]44 port 33010 ssh2 [preauth]","01:22:08 sshd[9140]: Accepted publickey for gridops from 10[.]77[.]3[.]24 port 50112 ssh2: ED25519-CERT ID gridops-rot-2025 (serial 89) CA ED25519 SHA256:mK2xQ","01:22:09 sshd[9140]: pam_unix(sshd:session): session opened for user gridops by (uid=0)","01:31:44 sshd[9151]: Accepted publickey for svc-etl from 10[.]8[.]40[.]12 port 55210 ssh2: ED25519 SHA256:Rt9wB","01:44:02 sshd[9140]: Received disconnect from 10[.]77[.]3[.]24 port 50112:11: disconnected by user","01:55:03 sshd[9160]: Connection closed by authenticating user root 192[.]0[.]2[.]44 port 33100 [preauth]"]},"widget":{"type":"multi","question":"Select the two lines that show the wave used non-existent accounts:","options":["the 01:04 'Invalid user admin' line","the 01:04 'Failed password for invalid user admin' line","the 01:07 'maximum authentication attempts exceeded for root' line","the 01:22 accepted certificate line for gridops"],"correct":[0,1]}},{"id":"e12","type":"decision","title":"SSH inside port 443","summary":"Decision: banner, batch window, escalation.","scenario":"03:12 — protocol detection flags an SSH banner on a connection from archive-oslo-02 to 198[.]51[.]100[.]44:443. The firewall allows 443 outbound for the vendor updater. The nightly batch writes until 05:00. The socket has been up for two hours and the remote endpoint has no vendor record. Work the three steps in order.","question":"Handle the three decision points in order, choosing the best option at each:","hint":"The batch window limits what you may disturb tonight — not what you may learn.","explanation":"Conflicting signals — an allowed port, a forbidden protocol, a running batch window — resolve by capturing first and escalating with the full picture.\n\nAttacker view: -R on 443 is the quiet half of T1021.004, because defenders stare at port numbers while the banner tells the truth. Defender view: protocol detection on egress plus a 'databases speak no SSH outbound' baseline turns this into a one-evening catch.","study":"Study port and protocol mismatches and read-only capture before containment.","steps":[{"label":"STEP 1 OF 3 — read the shape","prompt":"An SSH banner rides port 443, the port everyone allows.","question":"What does this combination most likely show?","options":["A tunnel hiding SSH inside an allowed port","The vendor updater speaking SSH by design","A database export stream mislabeled as SSH"],"correct":0,"why":"Vendor updaters do not speak SSH on 443, and export streams do not show SSH banners; the pattern is a tunnel wearing an allowed port."},{"label":"STEP 2 OF 3 — tonight's constraint","prompt":"The batch window runs to 05:00; killing the socket now stops the nightly write.","question":"What do you do first?","options":["Capture packets and the owning PID read-only, and let the window finish","Kill the socket immediately and accept the batch loss","Open a change to block all 443 for the subnet tonight"],"correct":0,"why":"Read-only capture keeps evidence growing without breaking the batch; killing the socket is containment that IR should schedule, and a blanket 443 block punishes every host at once."},{"label":"STEP 3 OF 3 — hand it on","prompt":"You hold a packet sample, a PID, a command line 'ssh -R 9000:git-mirror-fra-06:22 …' and no ticket.","question":"Which handover fits?","options":["Escalate to IR with the capture, the PID and the -R command line","Close as vendor traffic — port 443 is allowed","Delete the capture; it contains partner data"],"correct":0,"why":"The -R line turns a suspicion into a named tunnel; IR needs the capture and the process record intact, and 'port allowed' says nothing about the protocol inside it."}]},{"id":"e13","type":"match","title":"Control versus bypass","summary":"Match: five hardening moves to the bypasses they kill.","scenario":"The GRC review asks Valta Energy to defend each SSH hardening line with the attacker bypass it removes, one row each for the register. Five controls, five bypasses — the register fails its audit when a control sits next to a bypass it does not actually stop.","question":"Match each control to the bypass it removes:","hint":"Think keys, agents, shells, expiry and tunnels.","explanation":"Passphrases keep a stolen key file unreadable, disabling agent forwarding keeps sockets off servers, ForceCommand pins service accounts away from shells, short-lived certificates expire without a rotation project, and AllowTcpForwarding no stops tunnels at the jump host.\n\nThe near-miss rows swap neighbours on purpose: certificates do not encrypt the stolen key file and AllowTcpForwarding does not touch agent sockets — each control answers exactly one bypass.","study":"Study control-to-bypass mapping for SSH hardening in GRC registers.","pairs":[{"left":"Passphrase-protected private keys","right":"a stolen id_ed25519 stays unreadable"},{"left":"Agent forwarding disabled in the client profile","right":"no hijackable agent sockets on servers"},{"left":"Match + ForceCommand internal-sftp","right":"service accounts never get a shell"},{"left":"Short-lived certificates from a private CA","right":"stolen credentials expire without rotation"},{"left":"AllowTcpForwarding no on the jump host","right":"tunnels stop at the first hop"}]},{"id":"e14","type":"terminal","title":"Is the master still alive?","summary":"Terminal: check a ControlMaster socket.","scenario":"Before IR touches relay-hel-01, you check whether gridops's multiplexed master session is still alive — a live master means a live authenticated channel worth preserving as evidence. Run the standard check against the control socket, read-only, and paste the answer into the handover notes.","question":"Run the read-only command that checks the control socket state:","hint":"ssh talks to an existing master through -S and asks it with -O check.","explanation":"ssh -O check -S <socket> asks the master process whether it is alive; a running master is a live authenticated channel, and its age tells IR how long the session has been reusable.\n\nThe traps: ssh-keygen -R rewrites host-trust evidence during the handover, removing the socket deletes the live artefact, and -O exit stops the master — the one action that destroys exactly what you were asked to preserve.","study":"Study ControlMaster operation: ControlPath, -O check and -O exit.","prompt":"analyst@relay-hel-01:~$","skill":"control-master-check","knownTools":["ssh","ls","ss","lsof"],"expected":"ssh -S /tmp/cm-gridops@relay-hel-01:22 -O check gridops@relay-hel-01","elements":[{"label":"the control socket path","any":["/tmp/cm-gridops@relay-hel-01:22"]},{"label":"the -O check action","any":["-o check"]}],"forbidden":[{"any":["ssh-keygen -R"],"why":"rewriting known_hosts during the handover destroys host-trust evidence"},{"any":["rm -rf","rm -f"],"why":"removing the control socket deletes the live artefact before IR sees it"},{"any":["-O exit","-O stop"],"why":"an -O exit stops the master and kills the authenticated channel you were asked to preserve"}],"output":["Master running (pid=31204)","socket: /tmp/cm-gridops@relay-hel-01:22","age 01:22:41 — preserve for IR handover"]},{"id":"e15","type":"mcq","title":"The session without a cron line","summary":"MCQ: one missing CRON pair breaks the story.","scenario":"svc-etl opens sessions on archive-oslo-02 every night at 02:00 via the archive job, and each one carries a CRON line a second before 'session opened'. At 02:00 tonight the 'session opened for user svc-etl' line arrives — with no CRON pair, no key acceptance, no anything. The queue's rule matched 'service account, known hour' and closed it.","question":"Which single detail breaks tonight's routine story?","hint":"Compare tonight's line set with every other night's line set.","explanation":"Every genuine svc-etl session pairs with a CRON line; tonight's session-opened record stands alone, which means something logged in without the job — the quiet half of key reuse.\n\nThe near-misses quote what stayed normal (log, allow-list, source module); auto-closures that key on account and hour miss exactly this. Alarming-looks-benign: the missing line is the whole finding.","study":"Study line-pair baselining: expected neighbours around session-opened records.","options":["No CRON line precedes the session-opened record tonight","The record arrives in auth.log in exactly the usual shape","The account svc-etl stays inside the AllowUsers list","The line is written by pam_unix, the usual source"],"correct":0},{"id":"e16","type":"order","title":"Certificate programme rollout","summary":"Order: CA pilot, baseline, pinning, retirement, alerts.","scenario":"Valta Energy's board approves a full SSH modernisation: a private CA, short-lived certificates, and forwarding gone — but the nightly archive write must survive every step, and the audit wants the order documented before the first change lands. Five steps, one calendar, no second chances.","question":"Reorder the five rollout steps so they run from earliest to latest:","hint":"Issue nothing before the server baseline is proven on one canary host.","explanation":"Stand up the CA and the baseline on a canary first, pin service accounts with Match blocks, retire static keys as certificates replace them, then close forwarding and finally alert on key writes — each step leans on the one before.\n\nDefender view: certificates without the baseline just shorten the life of bad settings, and alerts without the baseline page on every legitimate rotation. The archive job survives because its principal migrates with its owner's group inside the pilot's scope.","study":"Study staged SSH certificate rollouts and canary-first change control.","items":["Stand up the private CA and pilot short-lived certificates on a canary","Ship the sshd_config baseline: root off, passwords off, forwarding limits","Pin service accounts with Match blocks and ForceCommand where possible","Retire static keys as accounts migrate to certificate principals","Alert on authorized_keys writes and unexpected agent sockets"]},{"id":"e17","type":"fill","title":"Inside the certificate","summary":"Fill: serial, CA and principal.","scenario":"The helpdesk card explains what an SSH certificate actually carries, so the next 'is serial 91 bad?' question gets a fast answer. Three blanks name the fields that matter when a certificate shows up in auth.log at 03:00 and someone asks whether it should have appeared at all.","question":"Fill the three certificate-field blanks from the bank:","hint":"One field traces the certificate, one signs it, one names the account.","explanation":"Every certificate carries a unique serial for tracing, is signed by the private CA, and names the principal — the account it may log in to.\n\n'Fingerprint' belongs to raw keys, 'MAC' is a transport detail, and 'ticket' is Kerberos vocabulary; the three decoys borrow neighbouring concepts. Serial 91 was suspicious because it was minted after the revocation line, not because serials are bad.","study":"Study SSH certificate fields: serial, validity window, principals, signing CA.","text":"An SSH certificate carries a unique ___ for tracing, is signed by the ops ___, and names the ___ — the account it is allowed to log in to.","blanks":["serial","CA","principal"],"bank":["serial","CA","principal","fingerprint","ticket","MAC"]}];

/* ==== utils ==== */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function norm(s){
  return String(s == null ? "" : s).toLowerCase().replace(/\s+/g," ").replace(/[.,;:!]+$/,"").trim();
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function fmt1(n){ return (Math.round(n * 100) / 100).toFixed(1); }
function wordCount(s){ return String(s || "").split(/\s+/).filter(Boolean).length; }
function $(id){ return document.getElementById(id); }
function byClass(root, cls){ return root.getElementsByClassName(cls); }

/* ==== timer ==== */
function setTimerState(next){
  var now = Date.now();
  if(S.tStateAt != null){
    var dt = (now - S.tStateAt) / 1000;
    if(S.tState === "PAUSED_MANUAL") S.pauseManual += dt;
    if(S.tState === "PAUSED_AUTO_CHECK") S.pauseAutoCheck += dt;
  }
  S.tState = next;
  S.tStateAt = now;
  updateHeader();
}
setInterval(function(){
  if(S.tState === "RUNNING"){
    S.remaining -= 1;
    S.elapsed += 1;
    if(S.remaining <= 0){
      S.remaining = 0;
      updateClock();
      finish();
      return;
    }
    updateClock();
  }
}, 1000);
function updateClock(){ var c = $("tb-clock"); if(c) c.textContent = fmtClock(S.remaining); }

/* ==== header ==== */
function sevClass(){ return "sev-" + META.severity; }
function curPos(){ return S.order[S.idx]; }
function answeredCount(){
  var n = 0;
  for(var k in S.checked){ if(Object.prototype.hasOwnProperty.call(S.checked, k)) n++; }
  return n;
}
function pendingSkips(){
  return S.skipList.filter(function(i){ return !S.checked[i]; });
}
function updateHeader(){
  var counter = $("tb-counter"), stateEl = $("tb-state");
  var total = EXAMS.length, done = answeredCount();
  if(S.screen === "exam" || S.screen === "review"){
    counter.textContent = (S.phase === "review" && S.reviewPos >= 0)
      ? ("Review " + (S.reviewPos + 1) + " / " + (S.reviewTotal || pendingSkips().length))
      : ((S.phase === "review") ? ("Review pool: " + pendingSkips().length)
      : ("Exercise " + (S.idx + 1) + " / " + total));
  } else {
    counter.textContent = "Exercises " + done + " / " + total;
  }
  var sev = $("tb-sev");
  sev.className = "badge " + sevClass();
  sev.textContent = META.severity.replace("_", " ");
  updateClock();
  $("tb-scoreval").textContent = fmt1(S.score);
  $("progbar").style.width = (total ? (done / total * 100) : 0) + "%";
  /* state chip */
  if(S.tState === "PAUSED_MANUAL"){
    stateEl.hidden = false;
    stateEl.className = "tb-state manual";
    stateEl.innerHTML = '<span aria-hidden="true">⏸</span> Paused (manual)';
  } else if(S.tState === "PAUSED_AUTO_CHECK"){
    stateEl.hidden = false;
    stateEl.className = "tb-state autocheck";
    stateEl.innerHTML = '<span aria-hidden="true">⏸</span> Auto-paused — checking';
  } else {
    stateEl.hidden = true;
  }
  /* buttons */
  var ex = curPos();
  var inExercise = (S.screen === "exam" || S.screen === "review") && ex != null && S.tState !== "ENDED";
  $("btn-hint").disabled = !inExercise || S.checked[ex] != null || S.hintsUsed[ex] === true;
  $("btn-skip").disabled = !inExercise || S.checked[ex] != null || S.phase === "review";
  $("btn-pause").disabled = !(S.tState === "RUNNING" || S.tState === "PAUSED_AUTO_CHECK");
}

/* ==== postMessage integration ==== */
window.addEventListener("message", function(ev){
  var d = ev.data;
  if(!d || typeof d !== "object") return;
  if(d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT"){
    S.init = d;
    var slot = $("candline");
    if(slot && d.username){
      slot.textContent = "Candidate: " + d.username + (d.country ? " · " + d.country : "");
      slot.style.display = "block";
    }
  }
});
function postScore(){
  if(S.scorePosted) return;
  S.scorePosted = true;
  var rounded = Math.round(S.score);
  var total = 0, i;
  for(i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null) total++;
  }
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var msg = {
    type: "CYBERPULSE_SCORE",
    topicId: META.topicId,
    batch: META.batch,
    score: rounded,
    total: total,
    percent: percent,
    passed: passed
  };
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage(msg, location.origin);
    }
  }catch(e){ /* standalone file:// — no parent handshake */ }
}

/* ==== answer defaults ==== */
function defaultAnswer(ex){
  var i, d;
  switch(ex.type){
    case "mcq": return { sel: -1 };
    case "multi": return { sel: [] };
    case "match":
      d = []; for(i = 0; i < ex.pairs.length; i++) d.push(-1); return { assign: d };
    case "order":
      d = []; for(i = 0; i < ex.items.length; i++) d.push(i);
      return { seq: shuffle(d) };
    case "fill":
      d = []; for(i = 0; i < ex.blanks.length; i++) d.push(""); return { vals: d };
    case "terminal": return { cmd: "" };
    case "logview": return { w: defaultAnswer(ex.widget) };
    case "decision":
      d = []; for(i = 0; i < ex.steps.length; i++) d.push(-1); return { steps: d, cursor: 0 };
  }
  return {};
}
function ensureAnswer(ex, i){
  if(S.answers[i] == null) S.answers[i] = defaultAnswer(ex);
  return S.answers[i];
}

/* ==== render exercise ==== */

    html += '<p class="summary">' + esc(ex.summary) + '</p><button class="showfull" id="btn-showfull" type="button">▸ Show full scenario</button><div class="scen-body hidden" id="scen-full">' + scenInner(ex) + "</div>";
  } else {
    if(collapsed) html += '<p class="summary">' + esc(ex.summary) + "</p>";

  }

  /* question block */

    '<button class="btn" id="btn-next" type="button"' + (lock ? "" : " disabled") + ">" +
      (S.phase === "review" ? "Back to review list" : (lastMain ? "Final submit &amp; results" : "Next exercise")) +

function scenInner(ex){
  var out = "";
  var paras = String(ex.scenario).split(/\n\n+/);
  for(var p = 0; p < paras.length; p++) out += "<p>" + esc(paras[p]) + "</p>";
  if(ex.artefacts && ex.artefacts.length){
    for(var a = 0; a < ex.artefacts.length; a++){
      var art = ex.artefacts[a];
      var long = String(art.content || "").split("\n").length > 25;
      out += '<details class="artef"' + (long ? "" : " open") + '><summary>' + esc(art.label) + '</summary><div class="artbody">' + artefactBody(art) + "</div></details>";
    }
  }
  return out;
}
function artefactBody(art){
  if(art.kind === "table"){
    var rows = String(art.content).split("\n");

  return '<pre class="mono">' + esc(art.content) + "</pre>";
}

function renderChoice(ex, root, ans, lock, res, isMulti, path){
  var correct = isMulti ? ex.correct : [ex.correct];
  ex.options.forEach(function(opt, oi){
    var chosen = isMulti ? ans.sel.indexOf(oi) !== -1 : ans.sel === oi;
    var mark = "", cls = "";
    if(!lock){
      if(chosen){ mark = isMulti ? "☑" : "◉"; cls = "sel"; }
    } else {
      var isCorr = correct.indexOf(oi) !== -1;
      if(isCorr){ mark = "✓"; cls = "correct"; }
      else if(chosen){ mark = "✗"; cls = "wrong"; }
      else { cls = "dim"; }
    }
    root.insertAdjacentHTML("beforeend", optionRow(opt, oi, chosen, mark, cls));
  });
  var btns = byClass(root, "opt");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      btn.addEventListener("click", function(){
        if(lock) return;
        var oi = parseInt(btn.getAttribute("data-i"), 10);
        if(isMulti){
          var p = ans.sel.indexOf(oi);
          if(p === -1) ans.sel.push(oi); else ans.sel.splice(p, 1);
          btn.classList.toggle("sel");
          btn.setAttribute("aria-pressed", btn.classList.contains("sel") ? "true" : "false");
          btn.querySelector(".mark").textContent = btn.classList.contains("sel") ? "☑" : "";
        } else {
          ans.sel = oi;
          for(var z = 0; z < btns.length; z++){
            btns[z].classList.remove("sel");
            btns[z].setAttribute("aria-pressed", "false");
            var mk = btns[z].querySelector(".mark"); if(mk) mk.textContent = "";
          }
          btn.classList.add("sel");
          btn.setAttribute("aria-pressed", "true");
          btn.querySelector(".mark").textContent = "◉";
        }
      });
    })(btns[b]);
  }
}
function renderMatch(ex, root, ans, lock, res){
  var n = ex.pairs.length;
  var chipSel = -1;
  var html = '<div class="mgrid"><div class="mcol"><h4>Items</h4>';
  for(var z = 0; z < n; z++){
    html += '<div class="mrow"><div class="mleft">' + esc(ex.pairs[z].left) + '</div>' +
            '<button type="button" class="mzone" data-z="' + z + '" aria-label="Assigned value for ' + esc(ex.pairs[z].left) + '">— drop here —</button></div>';
  }
  html += '</div><div class="mbank"><h4>Answer bank</h4>';
  ex.pairs.forEach(function(pr, ri){
    html += '<button type="button" class="mchip" draggable="true" data-r="' + ri + '">' + esc(pr.right) + "</button>";
  });

  function paint(){

        zz.classList.add("filled");

          zz.classList.add(v === z ? "correct" : "wrong");

      }

      chips[c].classList.toggle("used", used);
      if(used) chips[c].classList.remove("selchip");
    }
  }
  function assign(z, r){
    if(r === -1) return;
    for(var k = 0; k < n; k++){ if(ans.assign[k] === r) ans.assign[k] = -1; }
    ans.assign[z] = r;
    chipSel = -1;
    paint();
  }
  for(var zi = 0; zi < zones.length; zi++){
    (function(z){
      var zz = zones[z];
      zz.addEventListener("click", function(){
        if(lock) return;
        if(chipSel !== -1) assign(z, chipSel);
        else if(ans.assign[z] !== -1){ ans.assign[z] = -1; paint(); }
      });
      zz.addEventListener("dragover", function(e){ if(!lock){ e.preventDefault(); zz.classList.add("dragover"); } });
      zz.addEventListener("dragleave", function(){ zz.classList.remove("dragover"); });
      zz.addEventListener("drop", function(e){
        e.preventDefault(); zz.classList.remove("dragover");
        if(lock) return;
        var r = parseInt(e.dataTransfer.getData("text/plain"), 10);
        if(!isNaN(r)) assign(z, r);
      });
    })(zi);
  }
  for(var ci = 0; ci < chips.length; ci++){
    (function(c){
      var cc = chips[c];
      cc.addEventListener("click", function(){
        if(lock) return;
        if(chipSel === c){ chipSel = -1; cc.classList.remove("selchip"); }
        else {
          chipSel = c;
          for(var k = 0; k < chips.length; k++) chips[k].classList.remove("selchip");
          cc.classList.add("selchip");
        }
      });
      cc.addEventListener("dragstart", function(e){
        e.dataTransfer.setData("text/plain", String(c));
        e.dataTransfer.effectAllowed = "copy";
      });
    })(ci);
  }
  paint();
}
function renderOrder(ex, root, ans, lock, res){
  root.innerHTML = '<div class="obank"><h4>Steps — put them in the correct order</h4><ol class="ordlist"></ol>' +
    '<p class="mhintline">Drag a step onto another step, or use ▲ / ▼.</p></div>';
  var list = root.querySelector(".ordlist");
  function paint(){
    list.innerHTML = "";
    ans.seq.forEach(function(itemIdx, pos){
      var li = document.createElement("li");
      li.className = "orditem";
      li.setAttribute("draggable", "true");
      li.setAttribute("data-pos", String(pos));
      var mark = "";
      if(lock) mark = itemIdx === pos ? " ✓" : "";
      li.innerHTML = '<span class="num">' + (pos + 1) + '</span><span class="txt">' + esc(ex.items[itemIdx]) + mark + "</span>" +
        '<span class="ordbtns"><button type="button" data-mv="up" aria-label="Move up" ' + (lock ? "disabled" : "") + ">▲</button>" +
        '<button type="button" data-mv="down" aria-label="Move down" ' + (lock ? "disabled" : "") + ">▼</button></span>";
      if(lock) li.classList.add(itemIdx === pos ? "correct" : "wrong");
      list.appendChild(li);
      li.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", String(pos)); });
      li.addEventListener("dragover", function(e){ if(!lock) e.preventDefault(); });
      li.addEventListener("drop", function(e){
        e.preventDefault();
        if(lock) return;
        var from = parseInt(e.dataTransfer.getData("text/plain"), 10);
        var to = parseInt(li.getAttribute("data-pos"), 10);
        if(!isNaN(from) && !isNaN(to) && from !== to) move(from, to);
      });
    });
    var btns = list.querySelectorAll("button[data-mv]");
    for(var b = 0; b < btns.length; b++){
      (function(btn){
        btn.addEventListener("click", function(){
          if(lock) return;
          var li = btn.closest(".orditem");
          var pos = parseInt(li.getAttribute("data-pos"), 10);
          var dir = btn.getAttribute("data-mv") === "up" ? pos - 1 : pos + 1;
          if(dir < 0 || dir >= ans.seq.length) return;
          move(pos, dir);
        });
      })(btns[b]);
    }
  }
  function move(from, to){
    var it = ans.seq.splice(from, 1)[0];
    ans.seq.splice(to, 0, it);
    paint();
  }
  paint();
}
