var META = {"topicId":"t1098.005","batch":1,"title":"T1098.005 Device Registration — EASY","difficulty":"easy","questionCount":16,"estimatedMinutes":30,"passMark":70,"sevName":"EASY","page_title":"T1098.005 — EASY practice exam"};
var INTRO = {"title":"T1098.005 — EASY practice exam","object":"ATT&CK object: T1098.005 — Account Manipulation: Device Registration (a Sub-Technique)","partLabel":"","learn":["You will learn about one exact entry of the MITRE ATT&amp;CK framework: <b>T1098.005 — Account Manipulation: Device Registration</b>. ATT&amp;CK is a big shared catalogue of the tricks attackers use. This entry is a <b>Sub-Technique</b> — one small, precise behaviour inside the bigger technique <b>T1098, Account Manipulation</b>.","Imagine this: an attacker steals the username and password of one of your colleagues. A login with just a password may be stopped by multi-factor authentication (MFA). So instead of guessing the second factor, the attacker simply <b>adds their own device</b> to the account. They can do this in an MFA app such as <b>Duo</b> or <b>Okta</b>, or in <b>Microsoft Entra ID</b> (Microsoft's cloud identity service) and its device manager, <b>Microsoft Intune</b>. Now the attacker's own laptop or phone is a <b>registered device</b> — it looks trusted, it can receive MFA prompts, and it can pass rules that only allow known devices.","You will also learn why this behaviour matters in real work. <b>SOC analysts</b> triage alerts about new devices appearing in the tenant. <b>Threat hunters</b> search audit logs for self-enrollment that nobody asked for. <b>Incident responders</b> contain rogue devices and revoke their access. <b>Threat intelligence analysts</b> write reports that name T1098.005 — real groups such as <b>APT29</b> and <b>Scattered Spider</b> have used it. <b>Detection engineers</b> build alerts from the Entra ID audit log. <b>Identity and GRC teams</b> write the rules that decide who may register a device at all.","The risks this technique addresses are big: an attacker can <b>keep access</b> (persistence), <b>bypass MFA and conditional access rules</b>, send believable <b>internal spearphishing</b> email from a trusted device, or even flood a tenant by registering huge numbers of devices. In this exam you will learn to recognise the technique, name its tactic, spot its traces in logs, and pick the controls that slow it down."],"keywords":[{"theme":"Technique basics","items":["Device Registration (T1098.005)","MFA self-enrollment (Duo, Okta)","Microsoft Entra ID","Microsoft Intune","Conditional Access bypass","Persistence","Privilege Escalation"]},{"theme":"Platforms & permission needed","items":["Identity Provider","Windows","stolen username and password","self-service enrollment"]},{"theme":"Telemetry & logs","items":["Entra ID audit log","'Register device' event","device management logs","sign-in logs"]},{"theme":"Mitigations & controls","items":["M1032 Multi-factor Authentication","restrict enrollment to trusted locations","temporary access pass","no enrollment for inactive accounts"]},{"theme":"Real-world examples","items":["APT29 (G0016)","Scattered Spider (campaign C0027)","SolarWinds Compromise (C0024)","AADInternals (S0677)"]}],"how":["<b>Pass mark: 70%.</b> PASS means you scored at least 70% of the possible credit over the exercises you answered. FAIL means you should read the explanations again and retake the exam.","<b>16 exercises, one idea each.</b> This EASY file uses these exercise types: single-choice questions, matching, fill-in-the-blank with a word bank, click-to-place drag &amp; drop, timeline ordering, a log viewer where you click the evidence lines, and a small SOC triage queue.","<b>Timer:</b> a 30-minute countdown runs at the top. Use <b>⏸ Pause</b> for a real break — the timer stops and the exercise is hidden until you press Resume.","<b>Check buys free thinking time:</b> the moment you press <b>✓ Check</b>, the timer stops automatically (you will see '⏸ PAUSED — reviewing feedback'). Study the feedback as long as you like. The timer resumes only when you press <b>Next</b>.","<b>Partial credit:</b> exercises with several items (matching, drag &amp; drop, ordering, log clicking, triage) give credit for each correct item: credit = max(0, (H − W) ÷ N). Wrong items subtract, so selecting everything gives zero.","<b>Hint:</b> one hint per exercise, and it costs −10% of that exercise's credit. The hint points at the concept, not the answer.","<b>Skip:</b> every exercise has a Skip button. Skipped exercises move to a review pool — before you finish, you can return and answer them as long as the timer is running. Skipped-and-never-answered exercises are excluded from the score."]};
var EXERCISES = [{"type":"qcm","summary":"Identify T1098.005 from an ATT&CK page excerpt","short":"ATT&CK excerpt — identify the technique","scenario":"You are new in the SOC. A teammate sends you an excerpt from the MITRE ATT&CK website and asks: which technique is this?","artefacts":[{"label":"ATT&CK page excerpt","body":"<pre class=\"logbox\">Account Manipulation: <span class=\"tok-k\">Device Registration</span>\nID: <span class=\"tok-n\">T1098.005</span>\nSub-technique of: T1098\nTactics: Persistence, Privilege Escalation\nPlatforms: Identity Provider, Windows</pre>"}],"question":"Which technique does this ATT&CK entry describe?","options":[{"id":"a","label":"Account Manipulation: Device Registration"},{"id":"b","label":"Account Manipulation: SSH Authorized Keys"},{"id":"c","label":"Account Manipulation: Additional Cloud Roles"},{"id":"d","label":"Account Manipulation: Additional Email Delegate Permissions"}],"correct":["a"],"itemWhy":{"b":"SSH Authorized Keys is T1098.004 — it adds keys to a Unix account, not devices.","c":"Additional Cloud Roles is T1098.003 — it grants roles, not devices.","d":"Additional Email Delegate Permissions is T1098.002 — it shares a mailbox, not devices."},"hint":"Look at the name written in the excerpt header — it is the technique's own name.","explain":"<p>The excerpt shows the ID <b>T1098.005</b> and the name <b>Device Registration</b>. In ATT&amp;CK, the sub-technique ID and name always appear together on the page, so this is the quickest way to identify it. The other three options are real sibling sub-techniques of Account Manipulation, but their IDs and names differ (SSH keys is T1098.004, Additional Cloud Roles is T1098.003, Email Delegate Permissions is T1098.002).</p>","study":"the T1098 Account Manipulation family and its sub-technique IDs."},{"type":"qcm","summary":"Name the tactic of T1098.005","short":"Which tactic does T1098.005 belong to?","scenario":"You open the ATT&CK page for T1098.005 Device Registration. ATT&CK groups every technique under at least one tactic — the attacker's goal the behaviour serves. The page for this sub-technique lists its tactic at the top.","question":"Which tactic is T1098.005 Device Registration listed under?","options":[{"id":"a","label":"Persistence"},{"id":"b","label":"Reconnaissance"},{"id":"c","label":"Collection"},{"id":"d","label":"Impact"}],"correct":["a"],"itemWhy":{"b":"Reconnaissance is gathering information before touching the target — registration happens after the attacker already has an account.","c":"Collection is gathering data such as files and emails — registering a device does not collect anything by itself.","d":"Impact is destroying or disrupting systems — registration does not damage anything."},"hint":"Ask yourself: what does the attacker gain by registering a device? They keep a way back in.","explain":"<p>T1098.005 is listed under <b>Persistence</b> (and, on the current page, also under Privilege Escalation). A registered device is the attacker's own hardware inside your identity system: it keeps working day after day, even if the stolen password is changed in some flows. That long-term foothold is exactly what Persistence means. Reconnaissance, Collection and Impact describe other goals.</p>","study":"what the Persistence tactic means in ATT&CK."},{"type":"dnd","summary":"Sort three behaviours into the right Account Manipulation sub-techniques","short":"Drag behaviours to T1098.004 / T1098.005 / T1098.002","scenario":"You are cataloguing three old incident tickets. Each ticket describes one behaviour. Your lead asks you to file each behaviour under the correct Account Manipulation sub-technique before the team meeting.","question":"Drag each behaviour into the slot with the correct ATT&CK sub-technique.","itemsPool":[{"id":"i1","label":"A new phone was enrolled in the MFA app of a stolen account"},{"id":"i2","label":"A public SSH key was added to authorized_keys on a server"},{"id":"i3","label":"An attacker gave themselves delegate access to a colleague's mailbox"}],"slots":[{"label":"T1098.005 — Device Registration","accept":["i1"],"why":"Enrolling a phone in the MFA app is exactly what Device Registration describes: a new device is attached to an account."},{"label":"T1098.004 — SSH Authorized Keys","accept":["i2"],"why":"Adding an SSH key to authorized_keys is the SSH Authorized Keys sub-technique — a key, not a device."},{"label":"T1098.002 — Additional Email Delegate Permissions","accept":["i3"],"why":"Delegate access to a mailbox is Additional Email Delegate Permissions — mailbox sharing, not devices."}],"hint":"Only one of the three behaviours talks about a phone or a device at all.","explain":"<p>Device Registration (T1098.005) is about <b>devices</b> — laptops, phones, virtual machines — being attached to an account or identity platform. SSH keys (T1098.004) are text keys on servers, and email delegate permissions (T1098.002) are mailbox rights. They all live under Account Manipulation because they all change an account, but only one of them creates a <b>registered device</b>.</p>","study":"the sub-techniques of T1098 Account Manipulation."},{"type":"blank","summary":"Complete the definition of Device Registration","short":"Fill the definition blanks","scenario":"Your team is writing a one-paragraph explainer for the internal wiki. Fill the three gaps using the word bank so the definition of T1098.005 is correct.","question":"Complete the wiki sentence with the words from the bank.","text":"To use T1098.005, an attacker with a stolen username and password adds their own [[0]] to the victim's MFA system (like Duo or Okta) or to Microsoft Entra ID with Intune. The attacker's hardware then counts as a [[1]] device, so it can pass rules that only allow known devices. Because the attacker keeps a working way back in, the main ATT&CK tactic here is [[2]].","blanks":[{"accept":["device"],"why":"The attacker adds their own device — a laptop, phone or virtual machine."},{"accept":["registered"],"why":"Once enrolled, the hardware counts as a registered device and looks trusted."},{"accept":["persistence","persistence (ta0003)","ta0003"],"why":"Keeping a way back in is the definition of Persistence."}],"hint":"This is the technique's name backwards: what is added, how it is called afterwards, and what goal it serves.","explain":"<p>The chain is simple: the attacker adds a <b>device</b>, the device becomes <b>registered</b> (trusted), and the goal is <b>persistence</b> — a durable foothold that survives in the tenant. These three words are the core of T1098.005 and they appear in almost every report about this technique.</p>","study":"the one-sentence definition of Device Registration."},{"type":"match","summary":"Match each identity product to what it does","short":"Match Entra ID / Intune / Duo-Okta","scenario":"A GRC colleague must approve a new identity policy but mixes up the product names. Help them by matching each product to the one-line description used on the T1098.005 ATT&CK page.","question":"Match each product on the left to its correct description on the right.","pairs":[{"left":"Microsoft Entra ID","right":"the cloud identity service where devices can be registered","why":"Entra ID is Microsoft's cloud identity platform; the ATT&CK page describes registering devices or virtual machines to it."},{"left":"Microsoft Intune","right":"the device management system that checks device compliance","why":"Intune is the device management system paired with Entra ID; it manages devices and their compliance state."},{"left":"Duo / Okta","right":"MFA systems where users enroll devices for authentication","why":"The page names Duo and Okta as MFA systems that let users associate devices with their accounts."}],"hint":"One product is about identity, one about managing devices, one about second-factor apps.","explain":"<p>The ATT&amp;CK page separates two worlds: <b>MFA systems</b> (Duo, Okta) where a device is enrolled to complete MFA, and <b>identity + device management</b> (Entra ID with Intune) where a device or virtual machine is registered and managed. Attackers use both paths — that is why the page lists the platform as <b>Identity Provider, Windows</b>.</p>","study":"the difference between MFA self-enrollment and Entra ID / Intune device registration."},{"type":"logview","summary":"Click the two log lines that show a device being registered","short":"Find the registration lines in the audit log","scenario":"You are on the SOC shift. A colleague pastes six lines from this morning's Entra ID audit log. Two of them are evidence that a <b>device was registered</b>. The other four describe unrelated events.","question":"Click every log line that is evidence of device registration, then press Check.","lines":[{"id":"l1","text":"2026-10-19 08:02:11 audit  activityDisplayName='Reset user password'  target=user j.holt@corp.example","related":false,"why":"A password reset is Account Manipulation-adjacent, but no device is involved."},{"id":"l2","text":"2026-10-19 08:11:47 audit  activityDisplayName='Register device'  target=device 'DESKTOP-K4WIN11'  actor=j.holt@corp.example","related":true,"why":"'Register device' is the exact audit event that a new device was attached to the tenant."},{"id":"l3","text":"2026-10-19 08:14:03 signin  sign-in success  user=j.holt@corp.example  app='Outlook'  mfa=satisfied","related":false,"why":"A normal successful sign-in — no new device here."},{"id":"l4","text":"2026-10-19 08:21:29 audit  activityDisplayName='Add delegated permission'  target=mailbox m.reyes@corp.example","related":false,"why":"That is the T1098.002 email delegate behaviour, not a device."},{"id":"l5","text":"2026-10-19 08:26:40 audit  deviceRegistered  deviceId=d-91f2c4  os='Windows 11'  owner=j.holt@corp.example  state=registered","related":true,"why":"deviceRegistered with state=registered is the same evidence expressed by the device management side."},{"id":"l6","text":"2026-10-19 08:31:02 audit  activityDisplayName='Consent to application'  app='Report Builder'","related":false,"why":"App consent is a different technique (OAuth application abuse), not device registration."}],"hint":"Look for the words 'Register device' or 'deviceRegistered' — they name the event itself.","explain":"<p>The two evidence lines are L2 and L5. The Entra ID audit log records a <b>'Register device'</b> activity when a device joins the tenant, and the device-management side records the new device object with a <b>registered</b> state. Password resets, mailbox delegate permissions, app consents and plain sign-ins are other events — useful elsewhere, but not T1098.005 evidence.</p>","study":"what the 'Register device' audit event looks like in an identity platform log."},{"type":"qcm","summary":"Red team view: why does the attacker register their own device?","short":"Why register a device? (attacker view)","scenario":"An attacker has stolen the username and password of j.holt@corp.example from a phishing site. The tenant requires MFA for sign-in. Instead of fighting the MFA prompt, the attacker opens the self-enrollment page and registers their own laptop to the account.","question":"From the attacker's point of view, what is the main gain of registering their own device?","options":[{"id":"a","label":"The device then looks trusted, receives MFA prompts, and can pass device-based rules"},{"id":"b","label":"It lets the attacker read the user's password in plain text"},{"id":"c","label":"It deletes the audit logs of the earlier phishing attack"},{"id":"d","label":"It cracks other users' passwords faster from the cloud"}],"correct":["a"],"itemWhy":{"b":"Passwords are never shown in plain text by enrolling a device — enrollment does not reveal secrets.","c":"Registering a device does not delete or modify any audit logs.","d":"Password cracking speed has nothing to do with device enrollment."},"hint":"Think about what problem the attacker had (MFA blocked them) and what the new device solves.","explain":"<p>On the <b>attacker side</b>, a registered device solves the exact problem they had: MFA and device-based rules no longer block them, because the prompts and the trust now live on hardware they own. On the <b>defender side</b> this is why a brand-new device enrollment on an account that never enrolled one is a high-value alert. This pairing — same event, two views — is the heart of T1098.005.</p>","study":"why attackers enroll devices into MFA systems to bypass initial MFA."},{"type":"qcm","summary":"Blue team view: which control slows device enrollment down?","short":"Which control restricts enrollment? (defender view)","scenario":"Same story, but you sit on the blue team. Several users received MFA enrollment prompts they never started. Management asks: which single control makes it hardest for an attacker with a stolen password to enroll their own device?","question":"Which control directly blocks an attacker from enrolling a device with only a stolen password?","options":[{"id":"a","label":"Require multi-factor authentication (MFA) to register a device, and use temporary access passes"},{"id":"b","label":"Make every user change their password every 10 years"},{"id":"c","label":"Turn off email forwarding for all mailboxes"},{"id":"d","label":"Increase the password length requirement to 20 characters"}],"correct":["a"],"itemWhy":{"b":"A 10-year password rotation barely affects day-to-day risk and does not touch enrollment.","c":"Email forwarding rules are a different technique (T1098.002 territory), not device enrollment.","d":"A longer password helps against guessing, but the attacker already HAS the password — the missing factor is the second one."},"hint":"The attacker already has factor one. What is the missing second factor at enrollment time?","explain":"<p>From the <b>defender side</b>: the attacker holds the password (factor one), so only a <b>second factor at enrollment time</b> stops them. The ATT&amp;CK page lists this exact mitigation under <b>M1032 Multi-factor Authentication</b>: require MFA to register devices, and consider <b>temporary access passes</b> as the initial MFA for enrollment. Password length changes do not help because the password is already stolen.</p>","study":"mitigation M1032 and temporary access passes for device enrollment."},{"type":"dnd","summary":"Place each artefact where it is observed: host vs cloud log","short":"Host artefacts vs cloud artefacts","scenario":"During a walk-through, your mentor shows you two artefacts of device registration and asks where each one lives. One artefact is produced on the Windows machine itself; the other is produced by the cloud identity platform.","question":"Drag each artefact to the place where you observe it.","itemsPool":[{"id":"h1","label":"Running dsregcmd to show the machine's registration state"},{"id":"h2","label":"The 'Register device' entry in the tenant audit log"}],"slots":[{"label":"On the Windows host (endpoint side)","accept":["h1"],"why":"dsregcmd runs on the Windows machine and reports its own registration state — a host-side artefact."},{"label":"In the cloud identity platform (tenant side)","accept":["h2"],"why":"The audit log belongs to the identity platform (Entra ID / MFA system) — a tenant-side artefact."}],"hint":"One tool runs locally on the machine; one log lives in the cloud service.","explain":"<p>Device registration leaves traces on <b>both sides</b>. On the Windows host you can inspect the local registration state with a command-line tool (dsregcmd). In the cloud, the identity platform writes a <b>'Register device'</b> audit event when the device is attached. Detection engineers call these the endpoint-side and tenant-side data sources — good coverage needs both.</p>","study":"host-side vs tenant-side telemetry for device registration."},{"type":"order","summary":"Put the attacker's four steps in the correct order","short":"Order the attacker's four steps","scenario":"A simple attack used T1098.005 from start to finish. Four steps of the story are shuffled below. Put them in the order the attacker performed them.","question":"Click the four steps in the correct time order (first click = first step).","steps":[{"id":"s1","label":"Steal a username and password by phishing","why":"The attacker needs working credentials before they can touch any enrollment page."},{"id":"s2","label":"Sign in to the identity platform with the stolen password","why":"A sign-in establishes the session the enrollment runs in."},{"id":"s3","label":"Register their own device to the account","why":"This is T1098.005 itself — the device is attached while the session is live."},{"id":"s4","label":"Keep using the trusted registered device for access","why":"The registered device is now the durable foothold — the persistence payoff."}],"hint":"Ask first: which step needs nothing but a phishing page? And which step only makes sense once the device already exists?","explain":"<p>The lifecycle is: steal credentials → sign in → <b>register the device</b> (T1098.005) → enjoy trusted access. Device registration sits <b>after</b> initial access: it hardens the foothold the password started. That is why ATT&amp;CK places it under Persistence — the earlier steps got the attacker in, this step keeps them in.</p>","study":"where device registration sits in the attack lifecycle."},{"type":"triage","summary":"Triage three new-device alerts from the SOC queue","short":"SOC triage: 3 device alerts","scenario":"Three alerts about device enrollment are waiting in your queue. For each alert, choose the sensible first action. This is shift work: not every alert is an incident, but none should be guessed.","question":"Choose the best first action for each of the three alerts.","alerts":[{"title":"New device enrolled for user a.okafor (finance)","meta":"Saturday 21:40 · user never enrolled a device before · enrollment from a residential IP in another country","options":[{"id":"o1","label":"Escalate: treat as a possible T1098.005 registration and verify with the user"},{"id":"o2","label":"Close as routine — users enroll phones on weekends all the time"},{"id":"o3","label":"Delete every device in the tenant immediately"}],"correct":"o1","why":"A first-ever enrollment, out of hours, from an unusual network is exactly the pattern the detection strategy warns about — verify, do not close."},{"title":"New device enrolled for user d.silva (IT onboarding)","meta":"Tuesday 09:12 · ticket ONB-2214 'laptop setup for new hire' open and assigned · enrollment from the office IP range","options":[{"id":"o1","label":"Close as expected with the onboarding ticket as the reason"},{"id":"o2","label":"Escalate to incident response and isolate the new hire's laptop"},{"id":"o3","label":"Disable the whole IT department's accounts"}],"correct":"o1","why":"There is a matching change ticket and a trusted network — this is expected enrollment, and closing with a reason is correct triage."},{"title":"Second device enrolled for user m.laurent within one hour","meta":"Friday 17:55 · the first device was enrolled 55 minutes earlier · both enrollments from a VPN exit node","options":[{"id":"o1","label":"Close — maybe the user bought two phones"},{"id":"o2","label":"Escalate: rapid multi-device enrollment through a VPN is a known attacker pattern"},{"id":"o3","label":"Ask the user to enroll a third device to compare"}],"correct":"o2","why":"Two enrollments in an hour through a VPN fits the self-enrollment abuse pattern; escalating is the proportionate response."}],"hint":"For each alert ask: is there a normal business reason written down anywhere?","explain":"<p>Triage is pattern-matching plus context. Alert 1 and Alert 3 have no business reason and carry risk signals (odd hour, unusual network, rapid repeat), so they go up. Alert 2 has a matching onboarding ticket from the office network, so it closes as expected. The ATT&amp;CK detection strategy for T1098.005 exists precisely because <b>self-enrollment portals are abused</b> — your job is to separate the onboarding noise from the attacker pattern.</p>","study":"false-positive profile of device-enrollment alerts (onboarding vs attacker patterns)."},{"type":"qcm","summary":"Which Windows command-line tool shows registration state?","short":"Name the built-in Windows tool","scenario":"You need to check on a Windows 11 machine whether it is registered or joined to the company's Entra ID. Windows ships a built-in command-line tool for exactly this. You only need its name for now.","question":"Which built-in Windows command-line tool shows a machine's device registration state?","options":[{"id":"a","label":"dsregcmd"},{"id":"b","label":"netstat"},{"id":"c","label":"certutil"},{"id":"d","label":"tasklist"}],"correct":["a"],"itemWhy":{"b":"netstat shows network connections — it knows nothing about device identity.","c":"certutil manages certificates — not the device registration state.","d":"tasklist lists running processes — not device identity."},"hint":"The name literally contains 'dsreg' — as in directory services registration.","explain":"<p><b>dsregcmd</b> is the built-in Windows tool for device registration state. Its status mode prints fields such as whether the device is joined to Entra ID and which tenant it belongs to. The other tools do different jobs: netstat (network), certutil (certificates), tasklist (processes). Knowing this one command is enough to start any host-side check of T1098.005.</p>","study":"the dsregcmd tool and its status output on Windows."},{"type":"match","summary":"Match each control to the attack step it stops","short":"Match three enrollment controls to their effect","scenario":"The identity team hardened device enrollment. Three controls were added. Match each control to the attacker step it stops, using the wording of mitigation M1032 on the ATT&CK page.","question":"Match each control on the left to the attack step it blocks.","pairs":[{"left":"Require MFA to register a device","right":"a stolen password alone can no longer enroll anything","why":"M1032: require multi-factor authentication to register devices — factor two is missing for the thief."},{"left":"Disallow enrollment for inactive accounts","right":"a dormant account cannot be woken up by adding a device","why":"The page tells admins to disallow enrolling new devices for inactive accounts — dormant accounts are a favourite door."},{"left":"Restrict enrollment to trusted locations or devices","right":"an attacker from an unknown network is refused at enrollment","why":"Conditional access can limit first-time enrollment to trusted places, with temporary access passes as the initial MFA."}],"hint":"Each control answers one word: which factor, which account state, which place.","explain":"<p>These three controls come straight from mitigation <b>M1032 Multi-factor Authentication</b> on the T1098.005 page: MFA at enrollment, no enrollment for <b>inactive accounts</b>, and <b>conditional access</b> restricting first enrollment to trusted locations or devices (with temporary access passes as the bootstrap). Together they remove the three easiest paths an attacker takes into self-enrollment.</p>","study":"the M1032 mitigation text for device registration."},{"type":"blank","summary":"Complete a mini threat-intel report naming the technique","short":"Fill the report: ATT&CK ID and impact word","scenario":"You draft the first two sentences of a report for the weekly security meeting. The style guide says: name the ATT&CK ID exactly, and state the practical impact in plain words.","question":"Complete the two report sentences with the word bank.","text":"During the review we observed behaviour matching ATT&CK T1098.[[0]], Device Registration: a new device was enrolled in our identity platform without a support ticket. Because the device is now treated as trusted, the attacker can keep [[1]] to our resources even if some passwords are changed.","blanks":[{"accept":["005","005.",".005"],"why":"Device Registration is the sub-technique T1098.005."},{"accept":["access","persistence","a foothold"],"why":"The practical impact is continued access — a foothold that keeps working."}],"hint":"The sub-technique number has three digits after the dot; the impact word is what an attacker keeps.","explain":"<p>Reports should anchor behaviour to the exact ID: <b>T1098.005</b> for Device Registration. The impact sentence should say what the attacker <b>keeps</b>: continued <b>access</b> (persistence) through a device your rules now trust. Clear IDs plus plain impact words make reports usable by every team.</p>","study":"how to reference ATT&CK sub-technique IDs in reports."},{"type":"match","summary":"Match each artefact to what it tells you","short":"Read three artefacts correctly","scenario":"Three artefacts from this week sit in the shared folder. Match each one to the single fact it actually proves, so the intern stops mixing them up.","question":"Match each artefact to the fact it proves.","pairs":[{"left":"Audit event: activityDisplayName = 'Register device'","right":"a new device was attached to the tenant","why":"This audit event is the tenant-side proof that a device registration happened."},{"left":"Device list: a new Windows device with compliance state 'managed'","right":"a device is now managed by the device management system","why":"A managed, compliance-checked device in Intune-style management is the result of enrollment into device management."},{"left":"Mailbox audit: a forward rule was added to another user's mailbox","right":"a different technique — mailbox manipulation, not devices","why":"A forwarding or delegate rule is Additional Email Delegate Permissions (T1098.002), a sibling sub-technique — no device involved."}],"hint":"One artefact is about a device, one about device management, one is the odd one out.","explain":"<p>Reading artefacts correctly keeps reports honest. The <b>'Register device'</b> audit event proves a registration; a device showing up as <b>managed</b> proves enrollment into device management; a mailbox <b>forward rule</b> proves the sibling technique T1098.002, not T1098.005. Same family, different evidence.</p>","study":"telling T1098.005 evidence apart from its sibling sub-techniques."},{"type":"logview","summary":"Click the sign-in lines that used the newly registered device","short":"Find sign-ins from the new device","scenario":"After yesterday's registration, you review today's sign-in log for j.holt@corp.example. Two lines show sign-ins that were trusted <b>because of the registered device</b>. Four lines are ordinary or unrelated.","question":"Click every sign-in line where the registered device itself made the sign-in trusted, then press Check.","lines":[{"id":"g1","text":"09:01:22 signin  user=j.holt  result=success  mfa='push approved on registered device'  device='DESKTOP-K4WIN11'","related":true,"why":"The MFA push was approved on the registered device — the device carries the trust."},{"id":"g2","text":"09:04:56 signin  user=j.holt  result=blocked  reason='bad password'  device=none","related":false,"why":"A blocked sign-in with no device involved proves nothing about registration."},{"id":"g3","text":"09:12:10 signin  user=j.holt  result=success  mfa='phone app push'  device='iPhone-14-holt'","related":true,"why":"A push approved on the enrolled phone again shows the registered device carrying trust."},{"id":"g4","text":"10:02:41 signin  user=j.holt  result=success  mfa='none required (inside office)'","related":false,"why":"Office sign-ins skip MFA by location — not device-based trust."},{"id":"g5","text":"10:15:33 signin  user=svc-backup  result=success  app='backup agent'  type=service principal","related":false,"why":"A service account sign-in is unrelated to the user's device registration."},{"id":"g6","text":"11:40:09 signin  user=j.holt  result=failed  reason='device not compliant'  device='DESKTOP-K4WIN11'","related":false,"why":"This line shows a device failing compliance — it is device-related, but it is a block, not a trusted sign-in."}],"hint":"Look for the words 'registered device' next to an approved factor — and do not pick the line where the device caused a block.","explain":"<p>L1 and L3 show MFA being satisfied <b>on the registered device</b> — the exact benefit the attacker wanted from T1098.005. L6 mentions a device too, but the device made the sign-in <b>fail</b> compliance, so it is not evidence of trusted use. Scanning for 'registered device' plus a success result is the quick pattern; always double-check the result column.</p>","study":"how registered devices appear in sign-in logs."}];
'use strict';
/* CyberPulseAcademy exam engine — shared across all T1098.005 severity files.
 * Expects globals: META, INTRO, EXERCISES (injected before this script). */
(function () {
  var $id = function (i) { return document.getElementById(i); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function shuffle(a) {
    var x = a.slice();
    for (var i = x.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = x[i]; x[i] = x[j]; x[j] = t;
    }
    return x;
  }
  function norm(s) { return String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ' ').trim(); }
  function pct(n) { return Math.round(n * 100); }
  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60, h = Math.floor(m / 60);
    m = m % 60;
    var mm = (h > 0 ? String(m).padStart(2, '0') : String(m));
    var out = (h > 0 ? h + ':' : '') + mm + ':' + String(s).padStart(2, '0');
    return out;
  }
  function scoreHW(H, W, N) { return Math.max(0, (H - W) / N); }

  var SEV_CLASS = { 'easy': 'badge-easy', 'medium': 'badge-medium', 'hard': 'badge-hard', 'extremely-hard': 'badge-extreme' };

  var state = {
    screen: 'intro', mode: 'exam', pos: 0, queue: [],
    answered: {}, credits: {}, results: {}, skipped: [], currentIdx: -1,
    usedHint: {}, hintShown: {},
    shuffles: {}, trans: {},
    timer: { state: 'IDLE', remain: 0, total: 0, lastTs: 0, manualMs: 0, autoMs: 0, autoStart: 0, pauseStart: 0 },
    pauseReturn: 'RUNNING', reported: false, user: { name: '', country: '', locale: '' }
  };
  var tickHandle = null;

  /* ---------------- timer state machine ---------------- */
  // States: IDLE -> RUNNING <-> PAUSED_MANUAL / PAUSED_AUTO_CHECK -> ENDED
  function setTimerState(s) {
    state.timer.state = s;
    if (s === 'RUNNING') { state.timer.lastTs = Date.now(); }
    renderTimerBar();
  }
  function startTimer() {
    state.timer.total = META.estimatedMinutes * 60;
    state.timer.remain = state.timer.total;
    state.timer.manualMs = 0; state.timer.autoMs = 0; state.timer.autoStart = 0;
    setTimerState('RUNNING');
    if (tickHandle) { clearInterval(tickHandle); }
    tickHandle = setInterval(tick, 250);
  }
  function tick() {
    var t = state.timer;
    if (t.state === 'ENDED') { return; }
    var now = Date.now();
    if (t.state !== 'RUNNING') { t.lastTs = now; return; }
    var dt = (now - t.lastTs) / 1000;
    t.lastTs = now;
    t.remain -= dt;
    if (t.remain <= 0) { t.remain = 0; renderTimerBar(); finishExam(true); return; }
    renderTimerBar();
  }
  function renderTimerBar() {
    var t = state.timer;
    $id('timerVal').textContent = fmtTime(t.remain);
    var st = $id('timerState'), box = $id('timerBox');
    var banner = $id('pauseBanner');
    if (t.state === 'RUNNING') {
      st.textContent = '▶ RUNNING'; st.className = 'ts-running';
      box.setAttribute('aria-label', 'Timer running');

      $id('pauseBtn').innerHTML = '<span class="b-ic">⏸</span> Pause';
      document.body.classList.remove('manually-paused');
    } else if (t.state === 'PAUSED_MANUAL') {
      st.textContent = '⏸ PAUSED_MANUAL'; st.className = 'ts-paused';
      box.setAttribute('aria-label', 'Timer paused manually');
      banner.innerHTML = '<span class="ic">⏸</span> PAUSED — manual (press Resume)';
      banner.style.display = 'block';
      $id('pauseBtn').innerHTML = '<span class="b-ic">▶</span> Resume';
    } else if (t.state === 'PAUSED_AUTO_CHECK') {
      st.textContent = '⏸ PAUSED_AUTO_CHECK'; st.className = 'ts-paused';
      box.setAttribute('aria-label', 'Timer paused while reviewing feedback');
      banner.innerHTML = '<span class="ic">⏸</span> PAUSED — reviewing feedback (resumes on Next)';
      banner.style.display = 'block';
      $id('pauseBtn').innerHTML = '<span class="b-ic">⏸</span> Pause';
    } else if (t.state === 'ENDED') {
      st.textContent = '■ ENDED'; st.className = 'ts-ended';
      banner.style.display = 'none';
    } else {
      st.textContent = '— READY'; st.className = 'ts-running';
      banner.style.display = 'none';
    }
  }
  function onPauseBtn() {
    if (state.screen !== 'exam') { return; }
    if (state.timer.state === 'PAUSED_MANUAL') { onResumeBtn(); return; }
    var t = state.timer;
    if (t.state === 'RUNNING') {
      t.pauseStart = Date.now(); state.pauseReturn = 'RUNNING';
      setTimerState('PAUSED_MANUAL');
      document.body.classList.add('manually-paused');
      showPauseCover(true);
    } else if (t.state === 'PAUSED_AUTO_CHECK') {
      t.autoMs += Date.now() - t.autoStart; t.autoStart = 0;
      t.pauseStart = Date.now(); state.pauseReturn = 'PAUSED_AUTO_CHECK';
      setTimerState('PAUSED_MANUAL');
      document.body.classList.add('manually-paused');
      showPauseCover(true);
    }
  }
  function onResumeBtn() {
    var t = state.timer;
    if (t.state !== 'PAUSED_MANUAL') { return; }
    t.manualMs += Date.now() - t.pauseStart; t.pauseStart = 0;
    showPauseCover(false);
    setTimerState(state.pauseReturn || 'RUNNING');
    if ((state.pauseReturn || 'RUNNING') === 'PAUSED_AUTO_CHECK' && !t.autoStart) { t.autoStart = Date.now(); }
    document.body.classList.remove('manually-paused');
  }
  function showPauseCover(on) {
    var c = $id('pauseCover');
    if (!c) { return; }
    if (on) {
      c.classList.remove('hidden');
      c.innerHTML = '<div class="card" style="max-width:520px;margin:60px auto;text-align:center">' +
        '<h2>⏸ PAUSED — manual</h2><p style="color:var(--text-secondary)">The exercise is hidden while you take a break.' +
        ' The countdown is stopped. Press Resume to continue.</p>' +
        '<button class="btn btn-primary" id="resumeBtn2">▶ Resume</button></div>';
      $id('resumeBtn2').addEventListener('click', onResumeBtn);
    } else { c.classList.add('hidden'); c.innerHTML = ''; }
  }

  /* ---------------- scoring core ---------------- */
  function scoreExercise(selectedItems, correctItems) {
    // Mandatory formula: credit = max(0, (H - W) / N)
    var N = correctItems.length, H = 0, W = 0;
    selectedItems.forEach(function (s) { if (correctItems.indexOf(s) >= 0) { H++; } else { W++; } });
    return { N: N, H: H, W: W, credit: scoreHW(H, W, N) };
  }

  /* ---------------- flow ---------------- */
  function startExam() {
    state.screen = 'exam'; state.mode = 'exam';
    state.pos = 0; state.queue = shuffle(EXERCISES.map(function (e, i) { return i; }));
    state.answered = {}; state.credits = {}; state.results = {}; state.skipped = [];
    state.usedHint = {}; state.hintShown = {}; state.shuffles = {}; state.trans = {};
    state.reported = false;
    $id('screen-intro').classList.add('hidden');
    $id('screen-results').classList.add('hidden');
    $id('screen-exam').classList.remove('hidden');
    $id('sevBadge2').className = 'badge ' + SEV_CLASS[META.difficulty];
    $id('sevBadge2').innerHTML = '<span class="b-ic">' + sevIcon() + '</span> ' + esc(META.sevName);
    $id('partLabel').textContent = INTRO.partLabel || '';
    startTimer();
    showExercise();
  }
  function sevIcon() { return META.difficulty === 'extremely-hard' ? '◉' : '◆'; }
  function curEx() { return EXERCISES[state.currentIdx]; }
  function processedCount() {
    var a = 0; Object.keys(state.answered).forEach(function (k) { if (state.answered[k]) { a++; } });
    return a + state.skipped.length;
  }
  function updateProgress() {
    var f = $id('progressFill');
    f.style.width = Math.min(100, (processedCount() / EXERCISES.length) * 100) + '%';
  }
  function updateLiveScore() {
    var sum = 0, n = 0;
    Object.keys(state.answered).forEach(function (k) {
      if (state.answered[k]) { sum += state.credits[k]; n++; }
    });
    $id('scoreVal').textContent = (n > 0 ? (Math.round(sum * 10) / 10) + ' / ' + n + ' (' + pct(sum / n) + '%)' : '0 / 0 (—%)');
  }
  function showExercise() {
    var idx = state.queue[state.pos];
    state.currentIdx = idx;
    $id('exCounter').textContent = 'Exercise ' + (state.pos + 1) + ' of ' + EXERCISES.length;
    renderExercise(idx, state.mode === 'review-item');
    updateProgress(); updateLiveScore();
    $id('checkBtn').classList.remove('hidden');
    $id('checkBtn').disabled = true;
    $id('checkBtn').textContent = '✓ Check';
    $id('nextBtn').classList.add('hidden');
    $id('skipBtn').classList.remove('hidden');
    $id('hintBtn').classList.remove('hidden');
    $id('hintBtn').disabled = false;
    document.getElementById('exerciseArea').scrollTop = 0;
    window.scrollTo(0, 0);
  }
  function onSkip() {
    if (state.screen !== 'exam' || state.currentIdx < 0 || state.answered[state.currentIdx]) { return; }
    var idx = state.currentIdx;
    if (state.skipped.indexOf(idx) < 0) { state.skipped.push(idx); }
    state.currentIdx = -1;
    if (state.mode === 'review-item') { showReview(); return; }
    state.pos++;
    proceedOrFinish(false);
    updateProgress();
  }
  function proceedOrFinish(cameFromCheck) {
    if (state.mode === 'review-item') { showReview(); return; }
    if (state.pos < state.queue.length) {
      showExercise();
    } else {
      var un = state.skipped.filter(function (i) { return !state.answered[i]; });
      if (un.length > 0) { showReview(); } else { finishExam(false); }
    }
  }
  function onCheck() {
    // FIRST action: stop the timer (Check-triggered auto-pause), then grade.
    var t = state.timer;
    if (t.state === 'RUNNING') { t.autoStart = Date.now(); setTimerState('PAUSED_AUTO_CHECK'); }
    var idx = state.currentIdx;
    var res = gradeExercise(curEx(), idx);
    if (state.usedHint[idx]) { res.credit = Math.max(0, res.credit - 0.10); }
    state.answered[idx] = true;
    state.credits[idx] = res.credit;
    state.results[idx] = res;
    var si = state.skipped.indexOf(idx);
    if (si >= 0) { state.skipped.splice(si, 1); }
    renderFeedback(curEx(), idx, res);
    updateLiveScore(); updateProgress();
    $id('checkBtn').classList.add('hidden');
    $id('skipBtn').classList.add('hidden');
    $id('hintBtn').disabled = true;
    var nb = $id('nextBtn');
    nb.classList.remove('hidden');
    if (state.mode === 'review-item') {
      nb.textContent = '⟲ Back to review (timer resumes)';
    } else if (state.pos >= state.queue.length - 1) {
      var un = state.skipped.filter(function (i) { return !state.answered[i]; });
      nb.textContent = un.length > 0 ? '⟲ Review skipped exercises' : '⏹ Final Submit';
    } else {
      nb.textContent = 'Next ▶';
    }
  }
  function onNext() {
    var t = state.timer;
    if (t.state === 'PAUSED_AUTO_CHECK' && t.autoStart) {
      t.autoMs += Date.now() - t.autoStart; t.autoStart = 0;
    }
    if (state.mode === 'review-item') {
      setTimerState('RUNNING');
      showReview(); return;
    }
    if (state.pos >= state.queue.length - 1) {
      var un = state.skipped.filter(function (i) { return !state.answered[i]; });
      if (un.length > 0) { showReview(); } else { finishExam(false); }
      return;
    }
    setTimerState('RUNNING');
    state.pos++;
    showExercise();
  }
  function onHint() {
    var idx = state.currentIdx;
    if (state.usedHint[idx] || state.answered[idx]) { return; }
    state.usedHint[idx] = true;
    state.hintShown[idx] = true;
    var ex = EXERCISES[idx];
    var hp = $id('hintPanel');
    hp.innerHTML = '<span class="ic">💡 Hint</span> ' + esc(ex.hint);
    hp.classList.remove('hidden');
    $id('hintBtn').disabled = true;
  }
  function showReview() {
    state.mode = 'review';
    state.screen = 'exam';
    state.currentIdx = -1;
    setTimerState('RUNNING'); // timer keeps running in review-skipped mode
    $id('exCounter').textContent = 'Review skipped exercises';
    var area = $id('exerciseArea');
    var un = state.skipped.filter(function (i) { return !state.answered[i]; });
    var done = state.skipped.filter(function (i) { return state.answered[i]; });
    var h = '<div class="block"><div class="block-h block-scen" style="color:var(--state-skipped)"><span class="b-ic">⚠</span> REVIEW SKIPPED EXERCISES</div>' +
      '<div class="block-b"><p class="scen-text">You skipped ' + state.skipped.length +
      ' exercise(s). You can return to any of them and answer it now, as long as the timer has not ended.' +
      ' Skipped exercises that stay unanswered are excluded from the score.</p>';
    if (un.length === 0) {
      h += '<p class="scen-text" style="color:var(--state-correct)">✓ All skipped exercises have been answered. You can submit.</p>';
    }
    un.forEach(function (i, k) {
      h += '<div class="review-item"><span class="word">⚠ Skipped</span><span class="sum">Exercise ' +
        (state.queue.indexOf(i) + 1) + ': ' + esc(EXERCISES[i].summary) + '</span>' +
        '<button class="btn btn-amber" data-ans="' + i + '">↩ Answer</button></div>';
    });
    done.forEach(function (i) {
      h += '<div class="review-item"><span class="word" style="color:var(--state-correct)">✓ Answered</span><span class="sum">Exercise ' +
        (state.queue.indexOf(i) + 1) + ': ' + esc(EXERCISES[i].summary) + '</span></div>';
    });
    h += '</div></div>';
    area.innerHTML = h;
    Array.prototype.forEach.call(area.querySelectorAll('[data-ans]'), function (b) {
      b.addEventListener('click', function () {
        state.mode = 'review-item';
        var i = parseInt(b.getAttribute('data-ans'), 10);
        state.pos = state.queue.indexOf(i);
        showExercise();
      });
    });
    $id('checkBtn').classList.add('hidden');
    $id('nextBtn').classList.add('hidden');
    $id('skipBtn').classList.add('hidden');
    $id('hintBtn').classList.add('hidden');
    $id('finalSubmitBtn').classList.remove('hidden');
    updateProgress(); updateLiveScore();
    window.scrollTo(0, 0);
  }
  function onFinishBtn() { finishExam(false); }
  /* ---------------- results ---------------- */
  function finishExam(timedOut) {
    setTimerState('ENDED');
    if (tickHandle) { clearInterval(tickHandle); }
    state.screen = 'results';
    // Skipped-and-never-answered are excluded from both numerator and denominator.
    var sum = 0, n = 0, full = 0, part = 0, partSum = 0, zero = 0, skippedUn = 0;
    EXERCISES.forEach(function (ex, i) {
      if (state.answered[i]) {
        var c = state.credits[i]; sum += c; n++;
        if (c >= 1) { full++; } else if (c > 0) { part++; partSum += c; } else { zero++; }
      } else { skippedUn++; }
    });
    var percent = n > 0 ? Math.round((sum / n) * 100) : 0;
    var passed = percent >= META.passMark;
    $id('screen-exam').classList.add('hidden');
    $id('screen-results').classList.remove('hidden');
    var v = $id('verdictBox');
    v.className = 'verdict ' + (passed ? 'pass' : 'fail');
    v.innerHTML = '<span class="v-ic" aria-hidden="true">' + (passed ? '✓' : '✗') + '</span>' +
      '<div><div class="v-word">' + (passed ? 'PASS' : 'FAIL') + '</div>' +
      '<div class="v-sub">' + (passed ?
        'Congratulations — you reached the pass mark of ' + META.passMark + '%.' :
        'You did not reach the pass mark of ' + META.passMark + '%. Review the explanations below and retake the exam.') +
      '</div></div>' +
      '<div style="margin-left:auto;text-align:right"><div class="v-word" style="font-size:34px">' + percent + '%</div>' +
      '<div class="v-sub mono">' + (Math.round(sum * 10) / 10) + ' / ' + n + ' credits' + (timedOut ? ' · time ran out' : '') + '</div>' +
      (state.user.name ? '<div class="v-sub">Learner: ' + esc(state.user.name) + (state.user.country && state.user.country !== 'ZZ' ? ' (' + esc(state.user.country) + ')' : '') + '</div>' : '') +
      '</div>';
    var avg = part > 0 ? (Math.round((partSum / part) * 100) / 100) : 0;
    var usedSec = state.timer.total - Math.max(0, state.timer.remain);
    $id('resGrid').innerHTML =
      cell('rc-correct', full, '✓ Fully correct') +
      cell('rc-partial', part, '✓ Partially correct' + (part > 0 ? ' — avg ' + avg.toFixed(2) : '')) +
      cell('rc-incorrect', zero, '✗ Fully incorrect') +
      cell('rc-skipped', skippedUn, '⚠ Skipped — excluded') +
      cell('rc-time', fmtTime(usedSec), '▶ Time used') +
      cell('rc-pause', fmtTime((state.timer.manualMs + state.timer.autoMs) / 1000), '⏸ Time paused (manual ' + fmtTime(state.timer.manualMs / 1000) + ' + feedback ' + fmtTime(state.timer.autoMs / 1000) + ')');
    var note = $id('resNote');

      ex.blanks.forEach(function (b, i) {
        var val = norm(tr.sel['b' + i]);
        var ok = b.accept.some(function (a) { return norm(a) === val; });
        if (val === '') { r.items.push({ st: 'm', label: 'Blank ' + (i + 1), why: 'Correct: ' + b.accept[0] + '. ' + b.why }); }
        else if (ok) { H++; r.items.push({ st: 'c', label: 'Blank ' + (i + 1) + ' = ' + val, why: b.why }); }
        else { W++; r.items.push({ st: 'w', label: 'Blank ' + (i + 1) + ' = "' + val + '"', why: b.why + ' Correct: ' + b.accept[0] + '.' }); }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = ex.blanks.map(function (b, i) { return 'Blank ' + (i + 1) + ': <b>' + esc(b.accept[0]) + '</b>'; }).join('; ');
    } else if (t === 'dnd') {
      r.N = ex.slots.length; H = 0; W = 0;
      ex.slots.forEach(function (s, si) {
        var placed = tr.slots[si] || [];
        if (placed.length === 0) { r.items.push({ st: 'm', label: 'Slot: ' + s.label, why: s.why }); return; }
        placed.forEach(function (iid, k) {
          var it = ex.itemsPool.filter(function (x) { return x.id === iid; })[0];
          var lab = it ? it.label : iid;
          if (k === 0 && s.accept.indexOf(iid) >= 0) { H++; r.items.push({ st: 'c', label: 'Slot "' + s.label + '" ← ' + lab, why: s.why }); }
          else { W++; r.items.push({ st: 'w', label: 'Slot "' + s.label + '" ← ' + lab, why: (s.acceptWrong && s.acceptWrong[iid]) ? s.acceptWrong[iid] : 'This item does not belong in this slot. ' + s.why }); }
        });
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = ex.slots.map(function (s) {
        var labels = s.accept.map(function (aid) {
          var it = ex.itemsPool.filter(function (x) { return x.id === aid; })[0];
          return it ? it.label : aid;
        });
        return '"' + esc(s.label) + '" ← <b>' + esc(labels.join(' / ')) + '</b>';
      }).join('; ');
    } else if (t === 'order') {
      r.N = ex.steps.length; H = 0; W = 0;
      ex.steps.forEach(function (s, i) {
        var got = tr.seq[i];
        if (!got) { r.items.push({ st: 'm', label: 'Position ' + (i + 1) + ': ' + s.label, why: s.why }); }
        else if (got === s.id) { H++; r.items.push({ st: 'c', label: 'Position ' + (i + 1) + ': ' + s.label, why: s.why }); }
        else {
          W++;
          var it = ex.steps.filter(function (x) { return x.id === got; })[0];
          r.items.push({ st: 'w', label: 'Position ' + (i + 1) + ': you placed "' + (it ? it.label : got) + '"', why: s.why });
        }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = '<ol style="margin:4px 0 0 18px;padding:0">' + ex.steps.map(function (s) { return '<li>' + esc(s.label) + '</li>'; }).join('') + '</ol>';
    } else if (t === 'term') {
      var cmd = norm(tr.cmd || '');
      r.N = ex.term.elements.length; H = 0; W = 0;
      var rc = termRC(ex);
      if (cmd === '') {
        ex.term.elements.forEach(function (el) { r.items.push({ st: 'm', label: el.label, why: el.why }); });
      } else {
        rc.els.forEach(function (pair) {
          if (pair.re.test(cmd)) { H++; r.items.push({ st: 'c', label: pair.e.label, why: pair.e.why }); }
          else { r.items.push({ st: 'm', label: pair.e.label, why: pair.e.why }); }
        });
        rc.pens.forEach(function (pair) {
          if (pair.re.test(cmd)) { W++; r.items.push({ st: 'w', label: pair.p.label, why: pair.p.why }); }
        });
      }
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = '<div class="codeblock mono" style="background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text-mono);font-size:14.5px">' +
        '<span style="color:#7f8db3"># canonical command (copyable)</span>\n' + esc(ex.term.canonical) + '</div>';
      r.extraHtml = '<p style="margin:8px 0 0;color:var(--text-secondary)"><b style="color:var(--text-primary)">Part by part:</b></p><ul style="margin:6px 0 0 18px;padding:0">' +
        ex.term.parts.map(function (p) { return '<li style="margin-bottom:4px"><code class="inline">' + esc(p.k) + '</code> — ' + p.v + '</li>'; }).join('') + '</ul>';
      var dangerHit = null;
      rc.dan.forEach(function (pair) { if (pair.re.test(cmd)) { dangerHit = pair.d; } });
      if (dangerHit) {
        r.extraHtml = '<div class="fb-danger">✗ DANGEROUS — NEAR MISS: ' + dangerHit.msg + '</div>' + r.extraHtml;
      }
    } else if (t === 'triage') {
      r.N = ex.alerts.length; H = 0; W = 0;
      ex.alerts.forEach(function (a, i) {
        var sel = tr.sel['a' + i];
        var corr = a.options.filter(function (o) { return o.id === a.correct; })[0];
        if (!sel) { r.items.push({ st: 'm', label: 'Alert ' + (i + 1) + ' — correct: ' + corr.label, why: a.why }); }
        else if (sel === a.correct) { H++; r.items.push({ st: 'c', label: 'Alert ' + (i + 1) + ' — ' + corr.label, why: a.why }); }
        else {
          W++;
          var picked = a.options.filter(function (o) { return o.id === sel; })[0];
          r.items.push({ st: 'w', label: 'Alert ' + (i + 1) + ' — you chose "' + picked.label + '"', why: a.why });
        }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = ex.alerts.map(function (a, i) {
        var corr = a.options.filter(function (o) { return o.id === a.correct; })[0];
        return 'Alert ' + (i + 1) + ': <b>' + esc(corr.label) + '</b>';
      }).join('; ');
    } else if (t === 'logview') {
      var rel = ex.lines.filter(function (l) { return l.related; });
      r.N = rel.length; H = 0; W = 0;
      rel.forEach(function (l, i) {
        var sel = !!tr.sel[l.id];
        if (sel) { H++; r.items.push({ st: 'c', label: 'Line L' + (ex.lines.indexOf(l) + 1), why: l.why }); }
        else { r.items.push({ st: 'm', label: 'Line L' + (ex.lines.indexOf(l) + 1), why: l.why }); }
      });
      ex.lines.forEach(function (l) {
        if (!l.related && tr.sel[l.id]) {
          W++; r.items.push({ st: 'w', label: 'Line L' + (ex.lines.indexOf(l) + 1) + ' (not evidence)', why: l.why });
        }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = 'Evidence lines: <b>' + rel.map(function (l) { return 'L' + (ex.lines.indexOf(l) + 1); }).join(', ') + '</b>';
    } else if (t === 'tree') {
      r.N = ex.tree.steps.length; H = 0; W = 0;
      ex.tree.steps.forEach(function (st, i) {
        var got = tr.picks[i];
        var corr = st.options.filter(function (o) { return o.id === st.correct; })[0];
        if (!got) { r.items.push({ st: 'm', label: 'Step ' + (i + 1) + ' — correct: ' + corr.label, why: st.why }); }
        else if (got === st.correct) { H++; r.items.push({ st: 'c', label: 'Step ' + (i + 1) + ' — ' + corr.label, why: st.why }); }
        else {
          W++;
          var picked = st.options.filter(function (o) { return o.id === got; })[0];
          r.items.push({ st: 'w', label: 'Step ' + (i + 1) + ' — you chose "' + picked.label + '"', why: st.why });
        }
      });
      r.H = H; r.W = W; r.credit = scoreHW(H, W, r.N);
      r.answerHtml = ex.tree.steps.map(function (st, i) {
        var corr = st.options.filter(function (o) { return o.id === st.correct; })[0];
        return 'Step ' + (i + 1) + ': <b>' + esc(corr.label) + '</b>';
      }).join('; ');
    }
    return r;
  }
  function strip(html) { var d = document.createElement('div'); d.innerHTML = html; return d.textContent || d.innerText || ''; }
  function termRC(ex) {
    if (!ex._rc) {
      ex._rc = {
        els: (ex.term.elements || []).map(function (e) { return { e: e, re: new RegExp(e.reSrc, 'i') }; }),
        pens: (ex.term.penalties || []).map(function (p) { return { p: p, re: new RegExp(p.reSrc, 'i') }; }),
        dan: (ex.term.danger || []).map(function (d) { return { d: d, re: new RegExp(d.reSrc, 'i') }; })
      };
    }
    return ex._rc;
  }

  /* ---------------- feedback ---------------- */
  function renderFeedback(ex, idx, res) {
    var multi = res.N > 1;
    var cls, word, ic;
    if (res.credit >= 1) { cls = 'fb-correct'; word = 'CORRECT'; ic = '✓'; }
    else if (res.credit > 0) { cls = 'fb-partial'; word = 'PARTIALLY CORRECT'; ic = '✓'; }
    else { cls = 'fb-incorrect'; word = 'INCORRECT'; ic = '✗'; }
    var h = '<div class="feedback" id="feedbackBlock"><div class="fb-head ' + cls + '">' +
      '<span aria-hidden="true" style="font-size:20px">' + ic + '</span> <span>' + word + '</span>' +
      (multi || res.credit < 1 ? '<span class="fb-credit">✓ ' + res.H + '/' + res.N + ' items · credit ' + res.credit.toFixed(2) + '</span>' : '') +
      '</div><div class="fb-b">' +
      '<div class="fb-answer"><b>Correct answer:</b> ' + res.answerHtml + '</div>';
    if (multi) {
      h += '<p style="margin:6px 0 10px;color:var(--text-secondary);font-size:14px">Item-by-item breakdown — credit formula: max(0, (H − W) ÷ N) = max(0, (' + res.H + ' − ' + res.W + ') ÷ ' + res.N + ') = ' + res.credit.toFixed(2) + '</p>';
      h += res.items.map(function (it) {
        var stc = it.st === 'c' ? 'fi-correct' : (it.st === 'w' ? 'fi-wrong' : 'fi-missed');
        var w = it.st === 'c' ? ['✓', 'Correct'] : (it.st === 'w' ? ['✗', 'Wrong'] : ['○', 'Missed']);
        return '<div class="fb-item ' + stc + '"><span class="ic" aria-hidden="true">' + w[0] + '</span>' +
          '<span><span class="word">' + w[1] + '</span> — ' + esc(it.label) + '<span class="why">' + esc(it.why) + '</span></span></div>';
      }).join('');
    }
    h += '<div class="fb-explain">' + ex.explain +
      (res.credit < 1 && ex.study ? '<p class="study">📖 What to study: ' + esc(ex.study) + '</p>' : '') +
      '</div>' + (res.extraHtml || '') + '</div></div>';
    var area = $id('exerciseArea');
    area.insertAdjacentHTML('beforeend', h);
    // disable inputs
    Array.prototype.forEach.call(area.querySelectorAll('.opt, .chip, .slot-drop, [data-seq], [data-unseq], .match-row select, .blank-in, .log-line, .filter-in, [data-treeopt], #treeConfirm, #termRun, .shell-in'), function (el) {
      el.disabled = true;
      el.classList.add('disabled');
      el.style.pointerEvents = 'none';
    });
  }

  /* ---------------- intro ---------------- */
  function renderIntro() {
    $id('introTitle').textContent = INTRO.title;
    $id('introObject').textContent = INTRO.object;
    var b = $id('sevBadge');
    b.className = 'badge ' + SEV_CLASS[META.difficulty];
    b.innerHTML = '<span class="b-ic">' + sevIcon() + '</span> ' + esc(META.sevName);
    $id('introFacts').innerHTML =
      fact('Exercises in this file', String(EXERCISES.length)) +
      fact('Estimated time', META.estimatedMinutes + ' minutes') +
      fact('Timer budget', META.estimatedMinutes + ' min countdown') +
      fact('Pass mark', META.passMark + '%') +
      (INTRO.partLabel ? fact('Batch', INTRO.partLabel) : '');
    $id('learnBody').innerHTML = INTRO.learn.map(function (p) { return '<p>' + p + '</p>'; }).join('');
    $id('kwBody').innerHTML = INTRO.keywords.map(function (k) {
      return '<div class="kw-theme"><h3>' + esc(k.theme) + '</h3><ul class="kw-list">' +
        k.items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    $id('howBody').innerHTML = '<ul class="how-list">' + INTRO.how.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul>';
  }
  function fact(k, v) { return '<span class="fact"><b>' + esc(k) + ':</b> ' + esc(v) + '</span>'; }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) { return; }
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
    // theme field is always 'dark' — the file is dark-only, so appearance does not change.
    state.user.name = event.data.username || '';
    state.user.country = event.data.country || '';
    state.user.locale = event.data.locale || 'en';
  });

  /* ---------------- init ---------------- */
  function init() {
    renderIntro();
    renderTimerBar();
    $id('startBtn').addEventListener('click', startExam);
    $id('checkBtn').addEventListener('click', function () {
      if (state.currentIdx < 0 || state.answered[state.currentIdx]) { return; }
      onCheck();
    });
    $id('nextBtn').addEventListener('click', onNext);
    $id('skipBtn').addEventListener('click', onSkip);
    $id('hintBtn').addEventListener('click', onHint);
    $id('pauseBtn').addEventListener('click', onPauseBtn);
    $id('retakeBtn').addEventListener('click', onRetake);
    $id('finalSubmitBtn').addEventListener('click', onFinishBtn);
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); }
  else { init(); }
})();

</script>
</body>
