*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-ui);font-size:16px;line-height:1.55}

.mono{font-family:var(--font-mono)}
.hidden{display:none !important}

/* ---------- progress bar ---------- */

/* ---------- cards & blocks ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:18px 20px;margin:14px 0}

.blk.scenario .blk-head{color:var(--accent-blue);border-left:4px solid var(--accent-blue)}

.blk.question .blk-head{color:var(--accent-amber);border-left:4px solid var(--accent-amber)}

pre.codeblock .copied{color:var(--state-correct);font-family:var(--font-ui);font-size:13px;margin-left:10px}
.tok-ip{color:var(--accent-amber)}

.tok-str{color:var(--accent-green)}
.tok-kw{color:var(--accent-blue);font-weight:600}

.copywrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- top bar (exam header) ---------- */
.topbar{position:sticky;top:6px;z-index:50;background:var(--topbar-bg);border:1px solid var(--border);border-bottom:2px solid var(--border);border-radius:10px;padding:10px 14px;margin:10px 0 18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;box-shadow:var(--shadow-lg)}
.tb-item{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text-secondary);min-height:34px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:9px 18px;border-radius:8px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-primary);font-size:15px;font-weight:600;cursor:pointer;transition:filter .15s ease,transform .05s ease}

.shell{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;font-family:var(--font-mono);font-size:14.5px;color:var(--text-mono);padding:12px 14px}

.rcard .rc-num{font-size:26px;font-weight:800}
.rcard .rc-lab{font-size:13.5px;color:var(--text-secondary);margin-top:4px;letter-spacing:.03em}
.cert{border-radius:12px;padding:20px 22px;margin:16px 0;border:1px solid}
.cert.pass{border-color:var(--state-correct);background:linear-gradient(135deg,var(--tint-green-hero),transparent)}
.cert.fail{border-color:var(--state-incorrect);background:linear-gradient(135deg,var(--tint-red-hero),transparent)}
.cert h2{margin:0 0 6px 0;font-size:22px}
.cert p{margin:6px 0;color:var(--text-primary)}
.pauselog{color:var(--text-secondary);font-size:14px;border-top:1px dashed var(--border);margin-top:12px;padding-top:10px}

/* ---------- manual pause overlay ---------- */
#pauseoverlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.pausecard{max-width:460px;text-align:center;background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:12px;padding:28px}
.pausecard .pico{font-size:38px;color:var(--state-paused)}
.pausecard h2{color:var(--state-paused);margin:8px 0}
.pausecard p{color:var(--text-secondary)}

.term-clock{font-family:var(--font-mono);font-size:13px;color:var(--accent-amber);font-weight:700}
@media (max-width:720px){
  #app{padding:10px 10px 80px}
  .card,.blk-body{padding:13px}
  .topbar{gap:8px}
  .tstate{max-width:100%}
  pre.mono,pre.codeblock,.loglines{font-size:13px}
  .blank-in{width:150px}
}
@media (prefers-reduced-motion:reduce){
  #pbar::after{animation:none}
  *{transition:none !important;animation:none !important}
}
</style>

<script type="application/json" id="cm-exam-data">{"object":{"id":"T1590.001","name":"Gather Victim Network Information: Domain Properties","type":"Sub-Technique","parent":"T1590","tactic":"Reconnaissance (TA0043)","platforms":"PRE"},"learn":["This object is a sub-technique of T1590, Gather Victim Network Information. It describes attackers collecting facts about the domains a company owns: who registered them, when they expire, which name servers they use, and the contact details attached to them. Think of it as reading the company's public ID card — the one the internet hands out automatically.","Imagine you are a CTI analyst at an energy company called Aldercrest Energy. One morning a brand-new domain appears: 'aldercreast-energy[.]com' — one letter different. It was registered three days ago, behind a privacy service. Someone is preparing to pretend to be your company. Spotting that early is exactly the skill this exam trains.","You will meet this object as a CTI analyst (profiling attacker infrastructure), as a brand-protection or GRC analyst (deciding which company data should be public at all), as a SOC analyst (reading WHOIS/RDAP records and tenant API logs), and as a detection engineer (building analytics like DET0847/AN1979). Tools: WHOIS and RDAP lookups, certificate transparency logs, brand-monitoring feeds, and — for cloud tenants — public Microsoft endpoints called GetUserRealm and autodiscover.","The ATT&CK page gives this sub-technique real procedure examples: the AADInternals PowerShell tool (S0677) gathers a tenant's domain information through public Microsoft APIs, and the Sandworm Team group (G0034) researched an official parliament's internet domain before its 2019 attack. The page lists one mitigation, M1056 Pre-compromise: you cannot really prevent someone reading public records, so you minimise what is there to read. Detection is difficult — high volume, high false positives — so attention turns to later stages such as Initial Access."],"kw":["whois","registrar","registrant","creation","expiry","name-server","zone","dig","soa","ns","grep","head","sort","uniq","autodiscover","getuserrealm"],"themes":[{"name":"Recon objective & lifecycle","concepts":["feeds Phishing (T1566) initial access","feeds Phishing for Information (T1598)"]},{"name":"Domain property types","concepts":["domains the victim owns","registrar and registrant admin data","subdomains","creation and expiry dates"]},{"name":"Collection methods","concepts":["WHOIS / RDAP lookups","public cloud API endpoints","GetUserRealm (Office 365)","autodiscover (Office 365)"]},{"name":"Attacker value","concepts":["craft convincing phishing with real contacts","register lookalike/typosquat domains","learn the mail/tenant platform","validate tenant domain names"]},{"name":"Procedure examples (real)","concepts":["S0677 AADInternals — tenant domain info via public Microsoft APIs","G0034 Sandworm Team — recon of the Parliament of Georgia's domain before the 2019 attack"]},{"name":"Mitigations & control limits","concepts":["M1056 Pre-compromise","minimize externally visible data","review public contact/admin data","monitor for lookalike registrations","registrar lock and privacy services"]},{"name":"Data sources & telemetry","concepts":["WHOIS/RDAP records","historical WHOIS/RDAP snapshots","brand-monitoring alerts on new registrations"]}],"exercises":[{"id":"T1590-001-M01","type":"mcq","title":"Two days old and hidden","summary":"Read two properties together and draw the right conclusion.","concepts":["creation and expiry dates","registrar lock and privacy services","register lookalike/typosquat domains"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — WHOIS extract, aldercreast-energy[.]com","kind":"text","text":"Creation Date: 2026-10-21 (two days ago) · Registrant: Redacted for Privacy (privacy service) · Expiry: 1 year · Registrar: BulkRegister Co · Name servers: ns1.mailsetup[.]example"}],"question":"What is the most defensible reading of these properties together?","options":[{"t":"A fresh, privacy-hidden registration imitating the org name — treat as likely lookalike","correct":true,"why":"Correct — freshness + name imitation + hidden registrant is the classic lookalike signature."},{"t":"A ten-year-old partner domain, clearly safe","correct":false,"why":"The creation date says two days, not ten years — the near-miss ignores the date."},{"t":"A legitimate domain because privacy services are common","correct":false,"why":"Privacy is common — but common plus fresh plus imitative naming changes the reading."},{"t":"A domain the IT team registered for a project","correct":false,"why":"No ticket exists, and IT registrations would not imitate the brand with a typo."}],"hint":"Read both properties — the date and the registrant — before choosing.","explain":"Two properties combine into one judgement: creation two days ago (fresh) plus privacy-hidden registrant plus brand imitation. Freshness is the property that moves this from noise to signal.","study":"Judging newly registered domains from WHOIS properties."},{"id":"T1590-001-M02","type":"multi","title":"Lookalike preparation signals","summary":"Which artefacts indicate a lookalike is being prepared?","concepts":["register lookalike/typosquat domains","learn the mail/tenant platform","brand-monitoring alerts on new registrations","subdomains"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Feed of artefacts","kind":"text","text":"Five artefacts from brand monitoring and DNS feeds."}],"question":"Select every artefact that genuinely indicates lookalike preparation.","options":[{"t":"aldercreast-energy[.]com registered 2 days ago, privacy-hidden","correct":true,"why":"Correct — fresh typo registration of the brand is the core signal."},{"t":"Its MX points to an unrelated bulk-mail provider","correct":true,"why":"Correct — mail infrastructure ready to send is preparation evidence."},{"t":"A 12-year-old sub, aldercrest-energies[.]net, with real history","correct":false,"why":"Age plus real history points to an established (if confusingly named) third party."},{"t":"Your own sub, portal.aldercrest-energy[.]com, renewed","correct":false,"why":"Renewals of your own zone are routine, not lookalike activity."},{"t":"aldercreast-energy[.]com now serving a login page copying your portal","correct":true,"why":"Correct — cloned login content means the lookalike is now in active use."}],"hint":"Fresh + imitative + mail-ready or in use — not age, not your own renewals.","explain":"Three artefacts survive: fresh typo registration, mail infrastructure attached, and cloned login content. Age and your own renewals are the near-misses that keep queues honest.","study":"Corroborating brand-monitoring alerts with mail and content signals."},{"id":"T1590-001-M03","type":"branch","title":"Work the brand alert","summary":"Three decisions from alert to action.","concepts":["monitor for lookalike registrations","WHOIS / RDAP records","feeds Phishing (T1566) initial access"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Alert CTI-2201","kind":"text","text":"Brand monitor: 'aldercreast-energy[.]com registered 2 days ago'. You have WHOIS access and the takedown mailbox."}],"question":"Make the three triage decisions.","steps":[{"text":"Decision 1 — First move?","options":[{"t":"Pull the WHOIS/RDAP record and compare properties against the real domain","correct":true,"why":"Correct — properties (age, registrar, NS) decide whether the alert is real.","outcome":"Record: 2 days old, privacy-hidden, NS at a bulk-mail host. Real lookalike.","outcomeBad":false},{"t":"Ask the whole staff to report any odd emails","correct":false,"why":"Company-wide mail creates noise and tips nothing actionable yet.","outcome":"A hundred 'is this real?' replies; no new facts.","outcomeBad":true},{"t":"Ignore it — lookalikes appear weekly","correct":false,"why":"Volume is a reason for a process, not for ignoring a fresh imitation.","outcome":"The lookalike arms its mail infrastructure unwatched.","outcomeBad":true}]},{"text":"Decision 2 — The record confirms a fresh imitator. What is the proportionate action?","options":[{"t":"Snapshot the record, file the registrar abuse report, add it to monitoring","correct":true,"why":"Correct — evidence, takedown, and watching: the standard proportionate trio.","outcome":"Abuse ticket filed with evidence; the domain enters daily watch.","outcomeBad":false},{"t":"Block your entire partner ASN at the firewall","correct":false,"why":"Massive collateral damage for a domain problem.","outcome":"Partner mail breaks; the lookalike is unaffected.","outcomeBad":true},{"t":"Email the registrant address asking them to stop","correct":false,"why":"You would be telling the attacker exactly who noticed, and getting nothing.","outcome":"The attacker learns they are detected.","outcomeBad":true}]},{"text":"Decision 3 — Two days later it starts sending mail that imitates HR. Next?","options":[{"t":"Escalate to IR with the evidence bundle; alert staff via the security channel","correct":true,"why":"Correct — active use is the escalation trigger, and staff need the exact sender pattern to watch.","outcome":"IR opens a case; staff get a targeted alert with the lookalike address.","outcomeBad":false},{"t":"Wait for the registrar to act before telling anyone","correct":false,"why":"Takedowns take days; active phishing needs same-day defence.","outcome":"Recipients click while the ticket ages.","outcomeBad":true},{"t":"Reply to the phishing mails telling them to stop","correct":false,"why":"It confirms addresses are live and does nothing else.","outcome":"The attacker marks your addresses as engaged.","outcomeBad":true}]}],"hint":"Verify with records, act proportionately, escalate when it becomes active.","explain":"Two linked ideas run the flow: properties decide if it is real, and active use decides if it escalates. Proportionate action (evidence, report, watch) beats both panic blocks and silence.","study":"Brand-alert triage and takedown escalation."},{"id":"T1590-001-M04","type":"terminal","title":"Extract just the registrar","summary":"The tool is known — work out how to show only the registrar line.","concepts":["WHOIS / RDAP lookups","registrar and registrant admin data"],"perspective":"attacker","tags":[],"skill":"whois-filter-pipeline","scenario":[{"label":"ARTEFACT 1 — Tasking note (authorised lab)","kind":"text","text":"Tasking: return only the registrar line for aldercrest-energy[.]com — not the whole record. The tool is whois; you choose how to filter its output on this Linux box."}],"question":"Type the command that prints only the registrar line of the WHOIS record.","cmd":{"prompt":"recon-lab:~$","canonical":"whois aldercrest-energy[.]com | grep -i registrar","nearMiss":"whois aldercrest-energy[.]com > whois.txt","outputs":[{"re":"whois\\s+aldercrest-energy\\[.\\]com\\s*\\|\\s*grep\\s+-i\\s+registrar","lines":["   Registrar: Northgate Registrar Ltd"]}],"unknown":"command not recognised — pipe the whois output into a filter that keeps matching lines.","elements":[{"re":"\\bwhois\\b","label":"Uses whois","why":"The registry lookup is the source."},{"re":"aldercrest-energy\\[.\\]com","label":"Targets the tasked domain","why":"The lookup must name the exact domain."},{"re":"\\|","label":"Pipes the output","why":"The pipe sends the record into the filter."},{"re":"\\bgrep\\b","label":"Uses grep to filter","why":"grep keeps only matching lines — the standard filter."},{"re":"-i","label":"Case-insensitive matching","why":"The field appears as 'Registrar' — -i survives capitalisation."},{"re":"registrar","label":"Filters for the registrar field","why":"That keyword matches exactly the tasked line."}],"forbidden":[{"re":"\\b(rdap)\\b.*\\bgrep\\b","label":"mixing rdap into the grep pipeline","why":"The tasking names whois; swapping tools mid-pipeline is a near-miss."},{"re":">\\s*whois.txt|\\brm\\b","label":"writing files or deleting","why":"Unnecessary state changes in a read-only task."}]},"hint":"You need to see only lines containing one word — pipe the record through the standard filter, case-insensitively.","explain":"'whois <domain> | grep -i registrar' prints the single tasked line. The pipe plus a case-insensitive filter is the everyday pattern for slicing property groups out of records.","study":"Piping whois output through grep for single-property extracts."},{"id":"T1590-001-M05","type":"mcq","title":"What does GetUserRealm tell them?","summary":"The cloud-side property the page highlights.","concepts":["GetUserRealm (Office 365)","learn the mail/tenant platform"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Page excerpt + probe result","kind":"text","text":"Excerpt: 'Where third-party cloud providers are in use, this information may also be exposed through publicly available API endpoints, such as GetUserRealm and autodiscover in Office 365 environments.' Probe result for aldercrest-energy[.]com: '{\"NameSpaceType\": \"Managed\", \"FederationBrandName\": \"Aldercrest Energy\", \"CloudInstance\": \"Microsoft\"}'."}],"question":"What does the attacker learn from this GetUserRealm answer?","options":[{"t":"The domain is a managed Microsoft cloud tenant — the mail platform is confirmed","correct":true,"why":"Correct — the response confirms a managed Microsoft 365 identity namespace for the domain."},{"t":"The CEO's personal mailbox password","correct":false,"why":"Public tenant endpoints never return credentials."},{"t":"That the company has no cloud presence at all","correct":false,"why":"The opposite — the response proves a live Microsoft tenant."},{"t":"The registrant's home address","correct":false,"why":"That lives in the registry record, not in tenant APIs."}],"hint":"This is about which cloud platform serves the domain's mail and identity.","explain":"GetUserRealm validates the tenant: managed namespace, brand, cloud instance. Knowing the platform lets the attacker tailor phishing and pick the right authentication look for lures.","study":"GetUserRealm and autodiscover as public tenant-property sources."},{"id":"T1590-001-M06","type":"fib","title":"Complete the endpoint note","summary":"Two blanks describe the public cloud endpoints.","concepts":["GetUserRealm (Office 365)","autodiscover (Office 365)","public cloud API endpoints"],"perspective":null,"tags":[],"scenario":[{"label":"ARTEFACT 1 — Wiki stub","kind":"text","text":"Draft: 'GetUserRealm and autodiscover are public {b0} endpoints that reveal a tenant's {b1} configuration to anyone who asks.'"}],"question":"Fill the two blanks of the wiki stub.","template":"GetUserRealm and autodiscover are public {b0} endpoints that reveal a tenant's {b1} configuration to anyone who asks.","blanks":[{"accept":["api","api.","rest","http"],"why":"They are public API endpoints — that is the page's wording.","whyMiss":"They are API endpoints, not firewall ports or VPN portals."},{"accept":["mail","email","exchange","microsoft 365","office 365"],"why":"Both endpoints expose mail/identity platform configuration.","whyMiss":"The revealed configuration is the mail/tenant platform — not HR data."}],"hint":"Blank one: what kind of endpoint. Blank two: which platform's configuration they reveal.","explain":"Public API endpoints revealing mail/tenant configuration — that one sentence is why the page lists them as T1590.001 collection methods.","study":"The cloud-endpoint sentence in the T1590.001 description."},{"id":"T1590-001-M07","type":"dnd","title":"Tag the exposure paths","summary":"Four artefacts — registry, cloud API, historical WHOIS snapshots, or internal-only.","concepts":["WHOIS / RDAP records","WHOIS/RDAP records","public cloud API endpoints","historical WHOIS/RDAP snapshots","minimize externally visible data"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Exposure review tray","kind":"text","text":"Four artefacts from an exposure review. Label each with the path an outsider used to get it."}],"question":"Drag each artefact to its exposure path.","zones":[{"name":"Registry (WHOIS/RDAP)","accepts":[0],"why":"Registrant org data comes from the public registry."},{"name":"Cloud API","accepts":[1],"why":"The autodiscover response comes from the tenant's public endpoints."},{"name":"Historical WHOIS/RDAP snapshot","accepts":[2],"why":"Years-old registration records come from WHOIS/RDAP history datasets."},{"name":"Not publicly exposed","accepts":[3],"why":"An internal asset database export should never be reachable externally."}],"bank":[{"t":"Registrant org: Aldercrest Energy Ltd","whyMiss":"Registrant data is registry property — WHOIS/RDAP."},{"t":"autodiscover response listing mail host","whyMiss":"Tenant mail config via public cloud API."},{"t":"2021-2024 registrant history for the portal","whyMiss":"Years-old registration records — WHOIS/RDAP history datasets."},{"t":"CMDB export with internal hostnames","whyMiss":"Internal-only data — if an outsider has it, a leak occurred."}],"hint":"Ask per artefact: registry, cloud, dataset, or 'should not exist outside'.","explain":"Four paths, four labels. M1056's minimise-externally-visible-data goal applies to the first three; the fourth is a leak, not exposure — and needs a different response.","study":"Mapping artefacts to their public exposure paths."},{"id":"T1590-001-M08","type":"order","title":"Order the tenant-recon chain","summary":"Four steps from registry reading to staged phishing.","concepts":["validate tenant domain names","register lookalike/typosquat domains","craft convincing phishing with real contacts"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Chain stubs","kind":"text","text":"Stubs: 'register the lookalike domain' · 'read WHOIS contacts and formats' · 'validate the real tenant via public APIs' · 'stage phishing using both'."}],"question":"Order the attacker's four steps.","sequence":["Read WHOIS contacts and formats","Validate the real tenant via public APIs","Register the lookalike domain","Stage phishing using both"],"orderWhy":["Real contacts and formats come first — they are the template.","Tenant validation confirms the platform the lures must imitate.","The lookalike is registered once the real identity is fully understood.","Only then does staging combine contacts, platform, and domain."],"hint":"Template, platform, domain, then the combination.","explain":"The chain shows why registry and cloud properties are read together: the lure's sender format comes from WHOIS contacts, its look from the tenant platform, and its domain from a fresh registration.","study":"Combining registry and tenant properties into phishing preparation."},{"id":"T1590-001-M09","type":"match","title":"Match property to defensive action","summary":"Three public properties and the proportionate fix for each.","concepts":["review public contact/admin data","minimize externally visible data","registrar lock and privacy services"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — GRC remediation board","kind":"text","text":"Board: three exposed properties, three proportionate remediations."}],"question":"Match each exposed property to its proportionate remediation.","left":[{"t":"Named individual as registrant contact","match":0,"why":"A named person gives phishers a real identity to imitate."},{"t":"Direct phone lines in the record","match":1,"why":"Personal numbers widen vishing and pretexting options."},{"t":"Expired domains still listing the org","match":2,"why":"Dead domains under your name get re-registered by others."}],"right":[{"t":"Swap to a role alias and enable registry privacy","why":"Role aliases + privacy remove the person from the public record."},{"t":"Publish only the switchboard, not direct lines","why":"Keep the business reachable without exposing individuals."},{"t":"Release or defensively register the dead domains","why":"Retire the names properly so nobody inherits your identity."}],"hint":"People, phones, and dead domains — each has one clean fix.","explain":"M1056 in practice: shrink the record to what the business needs. Role aliases, switchboard-only numbers, and proper domain retirement each remove one attacker opportunity.","study":"Turning M1056 guidance into concrete record hygiene."},{"id":"T1590-001-M10","type":"logview","title":"Which registration is the lookalike?","summary":"Two fresh domains — properties decide which one is hostile.","concepts":["register lookalike/typosquat domains","creation and expiry dates","WHOIS / RDAP records","feeds Phishing for Information (T1598)"],"perspective":"defender","tags":["trap:alarming-but-benign"],"logTitle":"two RDAP records, side by side","filterPlaceholder":"filter fields...","log":["DOMAIN A: aldercreast-energy-campaign[.]com","  creation: 3 days ago   registrar: BulkRegister Co","  registrant: Aldercrest Energy Marketing (via privacy svc)","  MX: provider-dns[.]net   note: CHG-3105 marketing campaign ticket","DOMAIN B: aldercreast-energy[.]com","  creation: 3 days ago   registrar: BulkRegister Co","  registrant: Redacted for Privacy","  MX: mailbox-host[.]example (unrelated provider)   no ticket on file"],"options":[{"t":"Domain B — same freshness but no ticket and off-brand mail infrastructure","correct":true,"why":"Correct — freshness with no ticket and an unrelated mail provider is the hostile pattern."},{"t":"Domain A — any domain with 'campaign' in the name is suspicious","correct":false,"why":"A carries the marketing ticket and the organisation's own registrant — the near-miss pattern."},{"t":"Both — identical creation dates mean identical intent","correct":false,"why":"Properties beyond the date (ticket, registrant, MX) separate them."},{"t":"Neither — privacy services make both legitimate","correct":false,"why":"Privacy is common; the ticket and MX differences are what matter."}],"question":"Which domain should go to the takedown queue, and why?","hint":"One has a ticket and the organisation's own registrant; the other has neither.","explain":"Same age, different verdicts: A is the organisation's own ticketed campaign domain (the alarming-but-benign case), B is the hostile lookalike with unexplained mail infrastructure. Properties decide, not dates alone.","study":"Separating legitimate campaign domains from hostile lookalikes.","scenario":[{"label":"ARTEFACT 1 — two RDAP records, side by side","kind":"text","text":"You are reviewing this export in the SOC log viewer. Two fresh domains — properties decide which one is hostile. Use the filter box to narrow the lines before answering."}]},{"id":"T1590-001-M11","type":"mcq","title":"The Sandworm procedure example","summary":"What G0034 did on the ATT&CK page — and why it is listed.","concepts":["G0034 Sandworm Team — recon of the Parliament of Georgia's domain before the 2019 attack","feeds Phishing (T1566) initial access"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Procedure table (T1590.001)","kind":"text","text":"G0034 Sandworm Team: 'conducted technical reconnaissance of the Parliament of Georgia's official internet domain prior to its 2019 attack.'"}],"question":"Why does ATT&CK list this procedure example on T1590.001?","options":[{"t":"A real group demonstrably studied the target's domain before attacking it","correct":true,"why":"Correct — it is documented pre-attack domain recon: the technique in the wild."},{"t":"Because Sandworm invented WHOIS","correct":false,"why":"WHOIS long predates the group; the example is about behaviour, not invention."},{"t":"Because parliament domains are the only targets","correct":false,"why":"The example illustrates the behaviour; targets can be any organisation."},{"t":"Because the 2019 attack used email encryption","correct":false,"why":"The listed behaviour is domain reconnaissance, not encryption choices."}],"hint":"This is about a documented case of the behaviour happening before an attack.","explain":"Procedure examples anchor a technique to reality: Sandworm's pre-attack domain recon of Georgia's parliament (2019) is exactly T1590.001 observed in a real campaign.","study":"The G0034 procedure example on the T1590.001 page."},{"id":"T1590-001-M12","type":"multi","title":"Which endpoints are real?","summary":"Pick the two public Office 365 endpoints the page names.","concepts":["GetUserRealm (Office 365)","autodiscover (Office 365)","public cloud API endpoints"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Quiz","kind":"text","text":"Quiz: 'Which of these are the public Office 365 endpoints named on the ATT&CK page?'"}],"question":"Select the two endpoints named on the page.","options":[{"t":"GetUserRealm","correct":true,"why":"Correct — named on the page as a public API endpoint exposing tenant information."},{"t":"autodiscover","correct":true,"why":"Correct — the second named endpoint, exposing mail configuration."},{"t":"GetDomainListAll","correct":false,"why":"Not named on the page — a plausible-sounding invention."},{"t":"owa-admin-console","correct":false,"why":"Not a public property endpoint and not on the page."},{"t":"ews-ping","correct":false,"why":"Not on the page — a near-miss name for Exchange probing."}],"hint":"Both correct answers appear verbatim in the page's cloud sentence.","explain":"GetUserRealm and autodiscover are the two named public endpoints. Invented names like GetDomainListAll are the near-misses this drill exists for.","study":"The cloud-endpoint sentence on the T1590.001 page."},{"id":"T1590-001-M13","type":"fib","title":"Quote the mitigation","summary":"Two blanks make the M1056 quote accurate.","concepts":["M1056 Pre-compromise","minimize externally visible data"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Policy slide","kind":"text","text":"Draft: 'M1056: this technique cannot be easily {b0}; efforts should focus on {b1} the amount and sensitivity of data available to external parties.'"}],"question":"Fill the two blanks of the slide.","template":"M1056: this technique cannot be easily {b0}; efforts should focus on {b1} the amount and sensitivity of data available to external parties.","blanks":[{"accept":["mitigated"],"why":"The page: 'cannot be easily mitigated with preventive controls'.","whyMiss":"The word is mitigated — detected or prevented misquote the object type."},{"accept":["minimizing","minimising","reducing"],"why":"The page: 'minimizing the amount and sensitivity of data available to external parties'.","whyMiss":"The guidance is minimisation — not publishing or deleting everything."}],"hint":"Blank one: what a mitigation does. Blank two: what you do to the data.","explain":"Accurate quotes keep policy honest: cannot be easily mitigated; minimise what is externally available. Those two phrases justify the whole record-hygiene programme.","study":"Quoting M1056 accurately in policy material."},{"id":"T1590-001-M14","type":"triage","title":"Classify the registration feed","summary":"Three registrations — act, routine, or watch.","concepts":["monitor for lookalike registrations","domains the victim owns","brand-monitoring alerts on new registrations"],"perspective":"defender","tags":[],"scenario":[{"label":"ARTEFACT 1 — Monday registration feed","kind":"text","text":"Three items from the brand monitor. Company: Aldercrest Energy."}],"question":"Classify each item: act now, routine, or watch.","rows":[{"alert":"aldercreast-energy[.]com — 2 days old, privacy-hidden, MX ready","detail":"One letter off the brand.","options":["Act now (takedown queue)","Routine","Watch"],"correctIndex":0,"why":"Fresh typo of the brand with mail infrastructure — the takedown queue is the right home.","whyNot":{"1":"There is nothing routine about a fresh brand imitation.","2":"Watching alone underreacts to a mail-ready lookalike."}},{"alert":"portal.aldercrest-energy[.]com — certificate renewed","detail":"Your own subdomain.","options":["Act now (takedown queue)","Routine","Watch"],"correctIndex":1,"why":"Your own zone's renewal is housekeeping — routine.","whyNot":{"0":"You do not takedown yourself; the zone is yours.","2":"A routine renewal does not need watching."}},{"alert":"aldercrest-energy-review[.]net — 6 days old, registrant 'C. Weber'","detail":"Name contains the brand; no mail setup yet.","options":["Act now (takedown queue)","Routine","Watch"],"correctIndex":2,"why":"Brand-bearing but not yet armed (no MX, real registrant) — watch for mail infrastructure appearing.","whyNot":{"0":"No evidence of use yet; takedowns need more than a name overlap.","1":"It is not routine — it is exactly what monitoring is for."}}],"hint":"Ask per row: is it yours, is it armed, or is it just brand-bearing?","explain":"Armed lookalike → act; own zone → routine; brand-bearing but dormant → watch. The middle categories exist so the queue escalates the right things instead of everything.","study":"Tiering brand-monitoring alerts by arming status."},{"id":"T1590-001-M15","type":"mcq","title":"The AADInternals example","summary":"What S0677 does per the ATT&CK page.","concepts":["S0677 AADInternals — tenant domain info via public Microsoft APIs","public cloud API endpoints"],"perspective":"attacker","tags":[],"scenario":[{"label":"ARTEFACT 1 — Procedure table (T1590.001)","kind":"text","text":"S0677 AADInternals: 'can gather information about a tenant's domains using public Microsoft APIs.'"}],"question":"Which statement matches the page's description of AADInternals?","options":[{"t":"A PowerShell tool that gathers tenant domain information via public Microsoft APIs","correct":true,"why":"Correct — that is exactly how the page describes it."},{"t":"A password-cracking suite for domain admins","correct":false,"why":"The listed behaviour is gathering domain information, not cracking."},{"t":"A Microsoft-supported migration wizard","correct":false,"why":"It is a third-party PowerShell module, not a Microsoft product."},{"t":"A network scanner for open ports","correct":false,"why":"Port scanning is Active Scanning territory; AADInternals works via APIs."}],"hint":"This is about a tool that asks Microsoft's public endpoints about tenant domains.","explain":"AADInternals (S0677) is the page's tooling example: tenant domain info via public Microsoft APIs — T1590.001's cloud half, packaged.","study":"The S0677 procedure example on the T1590.001 page."}],"severityWord":"MEDIUM","partLabel":null}</script>
<script>
'use strict';
var DATA = JSON.parse(document.getElementById('cm-exam-data').textContent);
var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var EXS = [];
var S = null;
var T = null; // timer object for current attempt

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function fmtTime(sec){
  sec = Math.max(0, sec|0);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function round1(x){ return Math.round(x*10)/10; }
function letterKey(n){ return String.fromCharCode(65+n); }
function dispKey(ex, origIdx){ return ex._optOrder ? ex._optOrder.indexOf(origIdx) : origIdx; }

var KW = (DATA.kw && DATA.kw.length) ? DATA.kw : ['show','key','log','policy','error'];
var KWRE = new RegExp('(^|[^\\w-])(' + KW.join('|') + ')(?=[^\\w-]|$)','g');
function hl(text){
  var e = esc(text);
  e = e.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g, '<span class="tok-str">$1</span>');
  e = e.replace(/\b\d{1,3}(?:\[\.\]\d{1,3}){3}\b/g, '<span class="tok-ip">$&</span>');
  e = e.replace(KWRE, function(m,p1,p2){ return p1 + '<span class="tok-kw">' + p2 + '</span>'; });
  e = e.replace(/(\s|^)(-{1,2}[A-Za-z][\w-]*)/g, '$1<span class="tok-flag">$2</span>');
  e = e.replace(/\b(\d+)\b(?![^<]*<\/span>)/g, function(m, g1, off, str){
    var before = str.slice(Math.max(0, off-6), off);
    if(before.indexOf('class=') >= 0){ return m; }
    return '<span class="tok-num">'+m+'</span>';
  });
  return e;
}

function scoreExercise(H, W, N){
  if(N <= 0){ return 0; }
  return Math.max(0, (H - W) / N);
}
function normTxt(s){
  return String(s).trim().toLowerCase().replace(/\s+/g,' ').replace(/[.,;]+$/,'');
}

/* ================= timer state machine ================= */
function setTState(st){
  T.state = st;
  var el = $('tstate');
  if(!el){ return; }
  el.className = 'tstate';
  if(st === 'RUNNING'){ el.classList.add('running'); el.innerHTML = '&#9654; RUNNING'; }
  else if(st === 'PAUSED_MANUAL'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; manual (press Resume)'; }
  else if(st === 'PAUSED_AUTO_CHECK'){ el.classList.add('paused'); el.innerHTML = '&#9208; PAUSED &mdash; reviewing feedback (resumes on Next)'; }
  else if(st === 'ENDED'){ el.classList.add('ended'); el.innerHTML = '&#9632; ENDED'; }
  renderTimerBox();
}
function renderTimerBox(){ var el = $('timerbox'); if(el){ el.textContent = fmtTime(T.remaining); } }
function tick(){
  if(T.state === 'RUNNING'){
    T.remaining -= 1;
    renderTimerBox();
    var tc = $('termclock');
    if(tc && S && (S.screen === 'exam') && curEx() && curEx().type === 'terminal' && !curEx()._checked && curEx()._tleft !== null && curEx()._tleft !== undefined){
      curEx()._tleft -= 1;
      if(curEx()._tleft <= 0){ curEx()._tleft = 0; tc.textContent = '\u23f1 0:00 left — grading now'; curEx()._autoGrade = true; gradeCurrent(); return; }
      tc.textContent = '\u23f1 ' + Math.floor(curEx()._tleft/60) + ':' + (curEx()._tleft%60 < 10 ? '0' : '') + (curEx()._tleft%60) + ' left on this terminal (pauses with the exam timer)';
    }
    if(T.remaining <= 0){
      T.remaining = 0;
      setTState('ENDED');
      finishAttempt(true);
    }
  } else if(T.state === 'PAUSED_MANUAL'){ T.manualTotal += 1; }
  else if(T.state === 'PAUSED_AUTO_CHECK'){ T.autoTotal += 1; }
}

/* ================= intro screen ================= */
function typeLabel(t){
  return {
    mcq:'multiple choice', multi:'multi-select (partial credit)', match:'matching pairs',
    dnd:'drag & drop', order:'timeline ordering', fib:'fill-in-the-blank',
    terminal:'fake terminal command', branch:'branching decision scenario',
    triage:'SOC alert-queue triage', logview:'log viewer analysis'
  }[t] || t;
}
var TYPE_ICONS = {mcq:'A.', multi:'☑', match:'⇄', dnd:'✥', order:'↕', fib:'▁', terminal:'>_ ', branch:'⑃', triage:'▦', logview:'☰'};

function renderIntro(){
  S.screen = 'intro';
  var exTypes = [];
  DATA.exercises.forEach(function(e){ if(exTypes.indexOf(e.type) < 0){ exTypes.push(e.type); } });
  var chips = exTypes.map(function(t){ return '<span class="typechip">'+esc(TYPE_ICONS[t]||'•')+' '+esc(typeLabel(t))+'</span>'; }).join('');
  var themes = DATA.themes.map(function(th){
    return '<div class="themebox"><h4>'+esc(th.name)+'</h4><ul>'+ th.concepts.map(function(c){ return '<li>'+esc(c)+'</li>'; }).join('') +'</ul></div>';
  }).join('');
  var learn = DATA.learn.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('');
  var app = $('app');
  app.innerHTML =
  '<div class="intro-hero card">'+
    '<h1>'+esc(META.title)+'</h1>'+
    '<div class="objline"><b>'+esc(DATA.object.id)+' — '+esc(DATA.object.name)+'</b> &nbsp;·&nbsp; ATT&amp;CK object type: '+esc(DATA.object.type)+' &nbsp;·&nbsp; Tactic: '+esc(DATA.object.tactic)+'</div>'+
    '<div class="objline">Platform(s): '+esc(DATA.object.platforms)+'</div>'+
    '<div class="factrow">'+
      '<span class="badge '+sevClass()+'">'+esc(DATA.severityWord)+'</span>'+
      '<span class="fact">▦ <span><b>'+DATA.exercises.length+'</b> exercises</span></span>'+
      '<span class="fact">⏱ <span>estimated time <b>'+META.estimatedMinutes+' min</b> — the countdown timer gives you the same <b>'+META.timerMinutes+' min</b></span></span>'+
      '<span class="fact">◎ <span>pass mark <b>'+META.passMark+'%</b></span></span>'+
      (S.init && S.init.username ? '<span class="userchip">👤 Analyst: '+esc(S.init.username)+'</span>' : '')+
    '</div>'+
  '</div>'+
  '<section class="card"><h2>What you will learn here</h2>'+learn+'</section>'+
  '<section class="card"><h2>Keywords covered in this exam</h2><div class="themegrid">'+themes+'</div>'+
    '<p class="kw-note">Each keyword above is exercised at least once in this file. Themes follow the structure of the ATT&amp;CK page for '+esc(DATA.object.id)+'.</p></section>'+
  '<section class="card"><h2>How this exam works</h2>'+
    '<div class="typechips">'+chips+'</div>'+
    '<ul class="rulelist">'+
    '<li><span class="rl-ico">◎</span><span><b>Pass mark '+META.passMark+'%.</b> Your score is computed only over the exercises you actually answered (checked). PASS means you scored at least '+META.passMark+'%; FAIL means you should retake the exam.</span></li>'+
    '<li><span class="rl-ico">⚖</span><span><b>Partial credit.</b> Multi-answer exercises are graded per item: credit = max(0, (correct items selected − wrong items selected) ÷ total correct items). Selecting everything is graded 0, not full marks.</span></li>'+
    '<li><span class="rl-ico">💡</span><span><b>Hint costs 10% of the exercise credit.</b> One hint per exercise. The hint gives a nudge, never the answer.</span></li>'+
    '<li><span class="rl-ico">⏱</span><span><b>Timer.</b> A countdown runs for '+META.timerMinutes+' minutes. <b>Pause</b> is manual: it hides the exercise until you press Resume. Pressing <b>Check</b> also pauses the timer automatically while you study the feedback — the exercise stays visible, and the timer resumes only when you press <b>Next</b> (or Final Submit on the last exercise).</span></li>'+
    '<li><span class="rl-ico">⤼</span><span><b>Skip.</b> Every exercise can be skipped without penalty. Skipped exercises go to a review pool. Before you finish, you can return to them as many times as the timer allows. Skipped-and-never-answered exercises are excluded from the score completely.</span></li>'+
    '</ul>'+
    '<div class="btnrow"><button class="btn primary" id="startbtn" onclick="startAttempt()">▶ Start the exam</button></div>'+
  '</section>';
  window.scrollTo(0,0);
}

/* ================= exam flow ================= */
function constrainedShuffle(){
  var isTerm = EXS.map(function(e){ return e.type === 'terminal'; });
  var ord = EXS.map(function(e,i){ return i; });
  for(var tries=0; tries<80; tries++){
    ord = shuffle(EXS.map(function(e,i){ return i; }));
    var ok = true;
    for(var k=1; k<ord.length; k++){ if(isTerm[ord[k]] && isTerm[ord[k-1]]){ ok = false; break; } }
    if(ok){ return ord; }
  }
  return ord;
}
function startAttempt(){
  EXS = DATA.exercises.map(function(e){ return JSON.parse(JSON.stringify(e)); });
  S = {
    screen:'exam', order:[], cur:0, creditSum:0, answered:0, checkedCount:0,
    skipped:[], reported:false, init:S ? S.init : null, reviewing:null
  };
  S.order = shuffle(EXS.map(function(e,i){ return i; }));
  EXS.forEach(function(ex){
    ex._checked = false; ex._credit = 0; ex._hintUsed = false; ex._ans = null; ex._items = null; ex._autoGrade = false;
    if(ex.type === 'mcq' || ex.type === 'multi' || ex.type === 'logview'){ ex._optOrder = shuffle(ex.options.map(function(o,i){ return i; })); }
    if(ex.type === 'match'){ ex._rightOrder = shuffle(ex.right.map(function(r,i){ return i; })); }
    if(ex.type === 'dnd'){ ex._bankOrder = shuffle(ex.bank.map(function(b,i){ return i; })); }
    if(ex.type === 'order'){ ex._seq = shuffle(ex.sequence.slice()); }
    if(ex.type === 'terminal'){ ex._log = []; ex._lastCmd = null; ex._tleft = (ex.cmd && ex.cmd.timeLimit) ? ex.cmd.timeLimit : null; }
    if(ex.type === 'branch'){ ex._step = 0; ex._picks = []; ex._pendingPick = null; }
  });
  T = { remaining: META.timerMinutes*60, state:'RUNNING', iv:null, manualTotal:0, autoTotal:0 };
  if(T.iv){ clearInterval(T.iv); }
  T.iv = setInterval(tick, 1000);
  setTState('RUNNING');
  S.screen = 'exam';
  S.cur = 0;
  S.order = constrainedShuffle();
  LASTKEY = '';
  renderExamShell();
  renderExercise();
}
function curEx(){ return EXS[S.order[S.cur]]; }
function sevClass(){ return 'sev-' + (META.difficulty === 'extremely-hard' ? 'extreme' : META.difficulty); }

function renderExamShell(){
  $('app').innerHTML =
    '<div class="topbar" id="topbar">'+
      '<span class="tb-item" id="tb-counter"></span>'+
      '<span class="tb-item"><span class="badge '+sevClass()+'" id="tb-badge"></span></span>'+
      '<span class="tb-item" id="tb-part"></span>'+
      '<span class="tb-item">⏱ <span class="timerbox" id="timerbox">--:--</span> <span class="tstate" id="tstate"></span></span>'+
      '<span class="tb-item tb-score">◎ Score: <strong id="tb-score">0 / 0</strong> <span id="tb-pct">(0%)</span></span>'+
      (S.init && S.init.username ? '<span class="userchip">👤 '+esc(S.init.username)+'</span>' : '')+
      '<span style="flex:1"></span>'+
      '<button class="btn ghost" id="btn-pause" onclick="pauseManual()">⏸ Pause</button>'+
      '<button class="btn amber" id="btn-hint" onclick="doHint()">💡 Hint <small style="opacity:.8">−10%</small></button>'+
      '<button class="btn ghost" id="btn-skip" onclick="doSkip()">⤼ Skip</button>'+
    '</div>'+
    '<div id="pbarwrap"><div id="pbar"></div></div>'+
    '<div id="exarea"></div>';
  $('tb-badge').textContent = DATA.severityWord;
  $('tb-part').innerHTML = DATA.partLabel ? '<span class="statechip st-skipped">'+esc(DATA.partLabel)+'</span>' : '';
  $('pbar').style.setProperty('--sev', 'var(--sev-' + META.difficulty.replace('extremely-hard','extreme') + ')');
  renderTimerBox();
  setTState(T ? T.state : 'RUNNING');
  updateHeader();
}
function updateHeader(){
  if(!$('tb-counter')){ return; }
  var ex = curEx();
  if(S.screen === 'exam'){
    $('tb-counter').innerHTML = 'Exercise <strong>'+(S.cur+1)+'</strong> of <strong>'+EXS.length+'</strong>';
  } else if(S.screen === 'open'){
    $('tb-counter').innerHTML = '⚠ Reviewing skipped exercise <strong>'+(S.reviewPos+1)+'</strong> of <strong>'+S.skipped.length+'</strong>';
  } else if(S.screen === 'review'){
    $('tb-counter').innerHTML = 'Review skipped exercises';
  }
  $('tb-score').textContent = round1(S.creditSum).toFixed(1) + ' / ' + S.answered;
  var pct = S.answered > 0 ? Math.round((S.creditSum / S.answered) * 100) : 0;
  $('tb-pct').textContent = '(' + pct + '%)';
  var p = Math.round((S.checkedCount / EXS.length) * 100);
  $('pbar').style.width = p + '%';
  var hintDis = S.screen !== 'exam' && S.screen !== 'open';
  hintDis = hintDis || !ex || ex._hintUsed || ex._checked;
  $('btn-hint').disabled = !!hintDis;
  $('btn-skip').disabled = S.screen !== 'exam' || !ex || ex._checked;
  var pb = $('btn-pause'); if(pb){ pb.disabled = !T || T.state === 'ENDED'; }
}

/* ---------- scenario / question blocks ---------- */
function scenarioHtml(ex){
  var arts = (ex.scenario || []).map(function(a, i){
    if(a.kind === 'log' || a.kind === 'code'){
      var lines = a.text.split('\n').map(function(l){ return '<div class="ln">'+hl(l)+'</div>'; }).join('');
      return '<div class="artefact"><span class="art-label">'+esc(a.label)+'</span><div class="art-body"><pre class="mono" style="background:transparent;border:none;padding:0;margin:0">'+lines+'</pre></div></div>';
    }
    return '<div class="artefact"><span class="art-label">'+esc(a.label)+'</span><div class="art-body"><p>'+esc(a.text).replace(/\n/g,'<br>')+'</p></div></div>';
  }).join('');
  var sum = '<div class="blk-body" id="scen-sum" style="border-top:1px dashed var(--border);padding:10px 16px"><span class="art-label" style="padding:0 0 4px 0">⚠ ONE-LINE SUMMARY</span><p style="margin:2px 0">'+esc(ex.summary)+'</p></div>';
  return '<div class="blk scenario" id="blk-scen">'+
    '<div class="blk-head"><span class="blk-ico">🛰</span> SCENARIO'+
      '<span style="flex:1"></span>'+
      '<button class="btn ghost" id="scen-toggle" style="min-height:44px;padding:4px 12px" onclick="toggleScenario()" aria-expanded="true">▲ Collapse</button>'+
    '</div>'+
    '<div class="blk-body" id="scen-body">'+arts+'</div>'+sum+
  '</div>';
}
function toggleScenario(){
  var b = $('scen-body'), t = $('scen-toggle');
  if(!b){ return; }
  var open = !b.classList.contains('hidden');
  b.classList.toggle('hidden', open);
  t.textContent = open ? '▼ Expand' : '▲ Collapse';
  t.setAttribute('aria-expanded', String(!open));
}

/* ---------- answer widgets ---------- */
function optRowHtml(ex, i, kind){
  var o = ex.options[i];
  var dk = dispKey(ex, i);
  var inp = '<input type="'+(kind==='multi'?'checkbox':'radio')+'" name="ans" id="opt-'+i+'" value="'+i+'" onchange="pickOpt()" aria-label="Option '+letterKey(dk)+'">';
  return '<label class="opt" id="optrow-'+i+'">'+inp+'<span class="opt-key">'+letterKey(dk)+'.</span><span class="opt-text">'+esc(o.t)+'</span></label>';
}
function answerHtml(ex){
  var h = '';
  var i;
  if(ex.type === 'mcq'){
    h = '<div class="optlist" id="answidget">' + ex._optOrder.map(function(oi){ return optRowHtml(ex, oi, 'mcq'); }).join('') + '</div>';
  } else if(ex.type === 'logview'){
    var lines0 = ex.log.map(function(l,i){ return '<div class="ln" data-ln="'+i+'">'+hl(l)+'</div>'; }).join('');
    h = '<div id="answidget"><div class="logtool"><div class="logbar"><span class="lg-title">☰ '+esc(ex.logTitle||'log viewer')+'</span><input id="logfilter" placeholder="'+esc(ex.filterPlaceholder||'filter lines...')+'" aria-label="Filter log lines" oninput="logFilter()"></div><div class="loglines" id="loglines">'+lines0+'</div></div>'+
      '<div class="optlist" style="margin-top:12px">' + ex._optOrder.map(function(oi){ return optRowHtml(ex, oi, ex.multi?'multi':'mcq'); }).join('') + '</div></div>';
  } else if(ex.type === 'multi'){
    h = '<div class="optlist" id="answidget">' + ex._optOrder.map(function(oi){ return optRowHtml(ex, oi, 'multi'); }).join('') + '</div>';
  } else if(ex.type === 'match'){
    var rows = ex.left.map(function(L, li){
      var opts = '<option value="">— choose a match —</option>' + ex._rightOrder.map(function(ri){
        var r = ex.right[ri];
        return '<option value="'+ri+'">'+esc(r.t)+'</option>';
      }).join('');
      return '<div class="matchrow"><span class="m-left">'+esc(L.t)+'</span><select class="anssel" id="match-'+li+'" onchange="pickMatch()" aria-label="Match for item '+(li+1)+'">'+opts+'</select></div>';
    }).join('');
    h = '<div id="answidget">'+rows+'<p class="kw-note">⇄ Matching: each correct pair earns its own credit; a wrong pair subtracts.</p></div>';
  } else if(ex.type === 'dnd'){
    var bank = ex._bankOrder.map(function(bi){
      var b = ex.bank[bi];
      return '<button type="button" class="chip" draggable="true" data-bank="'+bi+'" id="chip-'+bi+'" onclick="chipClick('+bi+')" ondragstart="chipDrag(event,'+bi+')">'+esc(b.t)+'</button>';
    }).join('');
    var zones = ex.zones.map(function(z, zi){
      return '<div class="zone" id="zone-'+zi+'" data-zone="'+zi+'" onclick="zoneClick('+zi+')" ondragover="zoneDragOver(event,'+zi+')" ondragleave="zoneDragLeave(event)" ondrop="zoneDrop(event,'+zi+')"><h5>⬇ '+esc(z.name)+'</h5><div class="zone-slot" id="zoneslot-'+zi+'"></div></div>';
    }).join('');
    h = '<div id="answidget"><div class="dndwrap"><div class="dndbank"><h4>✥ ITEM BANK (click a chip, then click a zone — or drag)</h4><div id="bank">'+bank+'</div></div><div class="zones">'+zones+'</div></div><p class="kw-note">✥ Each correctly filled zone earns its own credit; a wrongly filled zone subtracts.</p></div>';
  } else if(ex.type === 'order'){
    h = '<div id="answidget"><ul class="seq" id="seqlist"></ul><p class="kw-note">↕ Put the steps in the correct order. Every step in its correct position earns credit.</p></div>';
  } else if(ex.type === 'fib'){
    var parts = ex.template.split(/\{b(\d+)\}/);
    var htmlp = '';
    for(var k=0;k<parts.length;k++){
      if(k%2===1){ htmlp += '<input class="blank-in" id="blank-'+parts[k]+'" size="'+(ex.blanks[parseInt(parts[k],10)].width||18)+'" autocomplete="off" spellcheck="false" aria-label="Blank '+(parseInt(parts[k],10)+1)+'" oninput="pickFib()">'; }
      else { htmlp += esc(parts[k]); }
    }
    h = '<div id="answidget" class="blanks">'+htmlp+'</div>';
  } else if(ex.type === 'terminal'){
    var panel = '';
    if(ex.cmd.syntaxPanel){ panel = '<div class="syntaxpanel"><span class="sp-title">SYNTAX REMINDER</span><pre class="mono" style="background:transparent;border:none;padding:6px 0 0 0;margin:0">'+hl(ex.cmd.syntaxPanel)+'</pre></div>'; }
    if(ex.cmd.timeLimit){ panel += '<p class="term-clock" id="termclock">⏱ This terminal has its own ' + Math.floor(ex.cmd.timeLimit/60) + ':' + (ex.cmd.timeLimit%60<10?'0':'')+(ex.cmd.timeLimit%60) + ' budget — it pauses with the exam timer.</p>'; }
    h = '<div id="answidget">'+panel+
      '<div class="shell"><div class="scroll" id="shelllog">'+ ex._log.map(function(l){ return '<div class="'+(l.err?'out-err':'out-ok')+'">'+hl(l.t)+'</div>'; }).join('') +'</div>'+
      '<div class="promptline"><span class="prompt">'+esc(ex.cmd.prompt)+'</span><input id="shellin" autocomplete="off" spellcheck="false" aria-label="Terminal input" onkeydown="if(event.key===\'Enter\'){shellRun();}"><button type="button" class="btn ghost answerctl" onclick="shellRun()" style="min-height:44px">↵ Run</button></div>'+
      '</div>'+
      '<div class="btnrow"><button type="button" class="btn green answerctl" id="termcheck" onclick="gradeCurrent()">✓ Check</button></div></div>';
  } else if(ex.type === 'branch'){
    h = '<div id="answidget"></div>';
  } else if(ex.type === 'triage'){
    var rows = ex.rows.map(function(r, ri){
      var opts = '<option value="">— choose a disposition —</option>' + r.options.map(function(o,oi){ return '<option value="'+oi+'">'+esc(o)+'</option>'; }).join('');

    }).join('');
    h = '<div id="answidget">'+rows+'</div>';
  }
  return h;
}

/* ---------- grading ---------- */
function applyHintPenalty(credit, ex){
  if(ex._hintUsed){ return Math.max(0, credit - 0.10); }
  return credit;
}
function gradeCurrent(){
  if(S.screen !== 'exam' && S.screen !== 'open'){ return; }
  var ex = curEx();
  if(ex._checked){ return; }
  if(ex.type === 'branch' && ex._step < ex.steps.length){
    var fb = $('fback');
    if(fb){ fb.innerHTML = '<div class="hintpanel"><span class="hint-tag">⏳ NOT FINISHED YET</span>Confirm every step of this decision first (the timer keeps running while you decide). The Check button unlocks after the final step.</div>'; }
    return;
  }
  var res = gradeEx(ex);
  ex._items = res.items;
  ex._dangerous = res.dangerous || false;
  ex._credit = applyHintPenalty(res.credit, ex);
  ex._checked = true;
  S.creditSum += ex._credit;
  S.answered += 1;
  S.checkedCount += 1;
  var idx = EXS.indexOf(ex);
  var poolIdx = S.skipped.indexOf(idx);
  if(poolIdx >= 0){ S.skipped.splice(poolIdx, 1); }
  if(T.state === 'RUNNING'){ setTState('PAUSED_AUTO_CHECK'); }
  renderFeedback(ex, res);
  lockAnswer();
  updateHeader();
}
function itemRow(state, label, note){

  var cls = state==='correct' ? 'st-correct' : (state==='wrong' ? 'st-incorrect' : 'st-skipped');

}

  } else if(ex.type === 'fib'){
    var ca = ex.blanks.map(function(b,i){ return esc(b.accept[0]); }).join(' | ');

    var oc = ex.sequence.map(function(s,i){ return (i+1)+'. '+esc(s); }).join('<br>');

  } else if(ex.type === 'match'){

    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT PAIRS</span>'+mc+'</div>';
  } else if(ex.type === 'dnd'){
    var dc = ex.zones.map(function(z){ return esc(z.name)+' ← '+esc(ex.bank[z.accepts[0]].t); }).join('<br>');
    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT PLACEMENTS</span>'+dc+'</div>';
  } else if(ex.type === 'triage'){
    var tc = ex.rows.map(function(r,i){ return 'Alert '+(i+1)+': '+esc(r.options[r.correctIndex]); }).join('<br>');
    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT DISPOSITIONS</span>'+tc+'</div>';
  } else if(ex.type === 'multi' || (ex.type === 'logview' && ex.multi)){
    var oc2 = ex.options.map(function(o,i){ return o.correct ? esc(letterKey(dispKey(ex,i))+'. '+o.t) : null; }).filter(Boolean).join('<br>');
    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ CORRECT ANSWERS</span>'+oc2+'</div>';
  } else if(ex.type === 'branch'){
    var bc = ex.steps.map(function(s,i){ return 'Step '+(i+1)+': '+esc(s.options.filter(function(o){ return o.correct; })[0].t); }).join('<br>');
    correctAnswer = '<div class="fb-correct-answer"><span class="fb-ca-tag">✓ BEST DECISIONS</span>'+bc+'</div>';

  var study = (c < 1 && ex.study) ? '<div class="studypointer">📚 <b>What to study:</b> '+esc(ex.study)+'</div>' : '';
  var nextBtn = '<div class="btnrow"><button class="btn primary" onclick="goNext()">'+(isLastGraded() && S.screen==='exam' ? '⏭ Final Submit' : '⏭ Next')+'</button></div>';
  $('fback').innerHTML = '<div class="feedback '+cls+'"><div class="fb-head">'+head+'</div><div class="fb-body">'+
    (ex._autoGrade ? '<p class="creditline">⏱ The terminal budget ran out, so your last command was graded as typed.</p>' : '') +
    correctAnswer +
    '<p>'+esc(ex.explain)+'</p>'+
    (items ? '<ul class="fb-items">'+items+'</ul>' : '')+
    study + nextBtn + '</div></div>';
  var cc = $('copycanon');
  if(cc){ cc.addEventListener('click', function(){ copyCmd(cc, ex.cmd.canonical); }); }
  var fb = $('fback'); if(fb){ fb.scrollIntoView({behavior:'smooth', block:'nearest'}); }

function isLastGraded(){
  return S.cur >= EXS.length - 1;
}
function copyCmd(btn, txt){
  var done = function(){ btn.textContent = '✓ Copied'; setTimeout(function(){ btn.textContent = '⧉ Copy'; }, 1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, done);
  } else { done(); }
}

/* ---------- per-type grading ---------- */
function gradeEx(ex){
  var items = [], H=0, W=0, N=0, dangerous=false;
  var i, j;
  if(ex.type === 'mcq'){
    N = 1;
    var sel = getMcqSel();
    var ci = ex.options.map(function(o,k){ return o.correct ? k : -1; }).filter(function(k){ return k>=0; })[0];
    if(sel === ci){ H = 1; items.push({state:'correct', label:'Option '+letterKey(dispKey(ex,ci)), note:ex.options[ci].why}); }
    else if(sel >= 0){ W = 1; items.push({state:'wrong', label:'Option '+letterKey(dispKey(ex,sel)), note:ex.options[sel].why}); }
    else { items.push({state:'missed', label:'Option '+letterKey(dispKey(ex,ci)), note:ex.options[ci].why}); }
  } else if(ex.type === 'multi' || ex.type === 'logview'){
    var sel2 = getMultiSel();
    ex.options.forEach(function(o,k){
      var picked = sel2.indexOf(k) >= 0;
      if(o.correct){
        N += 1;
        if(picked){ H += 1; items.push({state:'correct', label:'Option '+letterKey(dispKey(ex,k)), note:o.why}); }
        else { items.push({state:'missed', label:'Option '+letterKey(dispKey(ex,k)), note:o.why}); }
      } else if(picked){
        W += 1; items.push({state:'wrong', label:'Option '+letterKey(dispKey(ex,k)), note:o.why});
      }
    });
  } else if(ex.type === 'match'){
    N = ex.left.length;
    ex.left.forEach(function(L, li){
      var v = $('match-'+li) ? parseInt($('match-'+li).value,10) : NaN;
      if(v === L.match){ H += 1; items.push({state:'correct', label:L.t+' → '+ex.right[L.match].t, note:L.why}); }
      else if(!isNaN(v) && $('match-'+li).value !== ''){ W += 1; items.push({state:'wrong', label:L.t+' → '+ex.right[v].t, note:(ex.right[v].why || L.whyMiss || 'That pairing is not correct here. '+L.why)}); }
      else { items.push({state:'missed', label:L.t+' → '+ex.right[L.match].t, note:L.why}); }
    });
  } else if(ex.type === 'dnd'){
    N = ex.zones.length;
    ex.zones.forEach(function(z, zi){
      var placed = ex._ans && ex._ans[zi] !== undefined ? ex._ans[zi] : null;
      if(placed !== null && placed === z.accepts[0]){ H += 1; items.push({state:'correct', label:z.name+' ← '+ex.bank[placed].t, note:z.why}); }
      else if(placed !== null){ W += 1; items.push({state:'wrong', label:z.name+' ← '+ex.bank[placed].t, note:(ex.bank[placed].whyMiss || z.why)}); }
      else { items.push({state:'missed', label:z.name+' ← '+ex.bank[z.accepts[0]].t, note:z.why}); }
    });
  } else if(ex.type === 'order'){
    N = ex.sequence.length;
    ex._seq.forEach(function(t, pos){
      var correctHere = (ex.sequence[pos] === t);
      if(correctHere){ H += 1; items.push({state:'correct', label:'Position '+(pos+1)+': '+t, note:ex.orderWhy ? ex.orderWhy[pos] : 'This step belongs in position '+(pos+1)+'.'}); }
      else { W += 1; items.push({state:'wrong', label:'Position '+(pos+1)+': '+t, note:'Expected: '+ex.sequence[pos]+'. '+(ex.orderWhy ? ex.orderWhy[pos] : '')}); }
    });
  } else if(ex.type === 'fib'){
    N = ex.blanks.length;
    ex.blanks.forEach(function(b, bi){
      var el = $('blank-'+bi);
      var val = el ? normTxt(el.value) : '';
      var ok = b.accept.map(normTxt).indexOf(val) >= 0;
      if(ok){ H += 1; items.push({state:'correct', label:'Blank '+(bi+1)+': '+b.accept[0], note:b.why}); }
      else if(val !== ''){ W += 1; items.push({state:'wrong', label:'Blank '+(bi+1)+': '+el.value, note:b.whyMiss || b.why}); }
      else { items.push({state:'missed', label:'Blank '+(bi+1)+': '+b.accept[0], note:b.why}); }
    });
  } else if(ex.type === 'terminal'){
    N = ex.cmd.elements.length;
    var norm = ex._lastCmd || '';
    ex.cmd.elements.forEach(function(el2){
      var re = new RegExp(el2.re);
      if(re.test(norm)){ H += 1; items.push({state:'correct', label:el2.label, note:el2.why}); }
      else { items.push({state:'missed', label:el2.label, note:el2.why}); }
    });
    (ex.cmd.forbidden || []).forEach(function(f){
      var re = new RegExp(f.re);
      if(re.test(norm)){ W += 1; dangerous = true; items.push({state:'wrong', label:'Used: '+f.label, note:f.why}); }
    });
    if(!norm){ items.unshift({state:'missed', label:'No command was submitted', note:'Type the command and press Run, then Check.'}); }
  } else if(ex.type === 'branch'){
    N = ex.steps.length;
    ex.steps.forEach(function(st2, si2){
      var pick = ex._picks[si2];
      var ci2 = st2.options.map(function(o,k){ return o.correct ? k : -1; }).filter(function(k){ return k>=0; })[0];
      if(pick === ci2){ H += 1; items.push({state:'correct', label:'Step '+(si2+1), note:st2.options[ci2].why}); }
      else if(pick !== undefined && pick !== null){ W += 1; items.push({state:'wrong', label:'Step '+(si2+1), note:st2.options[pick].why}); }
      else { items.push({state:'missed', label:'Step '+(si2+1), note:st2.options[ci2].why}); }
    });
  } else if(ex.type === 'triage'){
    N = ex.rows.length;
    ex.rows.forEach(function(r, ri){
      var el3 = $('tri-'+ri);
      var v = el3 && el3.value !== '' ? parseInt(el3.value,10) : null;
      if(v === r.correctIndex){ H += 1; items.push({state:'correct', label:'Alert '+(ri+1), note:r.why}); }
      else if(v !== null){ W += 1; items.push({state:'wrong', label:'Alert '+(ri+1), note:(r.whyNot && r.whyNot[v] ? r.whyNot[v] : r.why)}); }
      else { items.push({state:'missed', label:'Alert '+(ri+1)+': '+r.options[r.correctIndex], note:r.why}); }
    });
  }
  return { credit: scoreExercise(H, W, N), h:H, w:W, n:N, items:items, dangerous:dangerous };
}

/* ---------- interactions per type ---------- */
function pickMatch(){ /* nothing needed pre-check */ }
function pickFib(){ /* nothing needed pre-check */ }
function pickTriage(){ /* nothing needed pre-check */ }
var armedChip = null;
function chipClick(bi){
  if(curEx()._checked){ return; }
  var chip = $('chip-'+bi);
  if(!chip){ return; }
  if(chip.closest('.zone')){ returnToBank(bi); return; }
  if(armedChip === bi){ chip.classList.remove('armed'); armedChip = null; return; }
  document.querySelectorAll('.chip.armed').forEach(function(c){ c.classList.remove('armed'); });
  armedChip = bi;
  chip.classList.add('armed');
  chip.innerHTML = esc(curEx().bank[bi].t) + ' <span class="chip-armprompt">CLICK A ZONE ▸</span>';
}
function zoneClick(zi){
  if(curEx()._checked){ return; }
  if(armedChip === null){ returnToBankFromZone(zi); return; }
  placeChip(armedChip, zi);
  armedChip = null;
}
function placeChip(bi, zi){
  curEx()._ans = curEx()._ans || {};
  var prevZone = null;
  Object.keys(curEx()._ans).forEach(function(k){ if(curEx()._ans[k] === bi){ prevZone = k; } });
  if(prevZone !== null && String(prevZone) !== String(zi)){ delete curEx()._ans[prevZone]; $('zoneslot-'+prevZone).innerHTML = ''; }
  curEx()._ans[zi] = bi;
  $('zoneslot-'+zi).innerHTML = '<span class="chip" data-inzone="'+bi+'">'+esc(curEx().bank[bi].t)+' <small style="color:var(--text-secondary)">✕ remove</small></span>';
  var chip = $('chip-'+bi);
  if(chip){ chip.classList.add('hidden'); chip.classList.remove('armed'); }
}
function returnToBank(bi){
  var ex = curEx();
  Object.keys(ex._ans || {}).forEach(function(k){ if(ex._ans[k] === bi){ delete ex._ans[k]; $('zoneslot-'+k).innerHTML=''; } });
  var chip = $('chip-'+bi); if(chip){ chip.classList.remove('hidden'); }
}
function returnToBankFromZone(zi){
  var ex = curEx();
  var bi = ex._ans && ex._ans[zi];
  if(bi === undefined || bi === null){ return; }
  returnToBank(bi);
}
function chipDrag(ev, bi){ ev.dataTransfer.setData('text/plain', String(bi)); armedChip = bi; }
function zoneDragOver(ev, zi){ ev.preventDefault(); $('zone-'+zi).classList.add('dragover'); }
function zoneDragLeave(ev){ ev.target.classList && ev.target.classList.remove('dragover'); }
function zoneDrop(ev, zi){
  ev.preventDefault();
  $('zone-'+zi).classList.remove('dragover');
  var bi = parseInt(ev.dataTransfer.getData('text/plain'),10);
  if(!isNaN(bi)){ placeChip(bi, zi); armedChip = null; }
}
function seqMove(i, dir){
  var ex = curEx();
  if(ex._checked){ return; }
  var j = i + dir;
  if(j < 0 || j >= ex._seq.length){ return; }
  var t = ex._seq[i]; ex._seq[i] = ex._seq[j]; ex._seq[j] = t;
  renderSeqList();
}
function shellRun(){
  var ex = curEx();
  var inp = $('shellin');
  if(!inp || inp.disabled){ return; }
  var raw = inp.value;
  if(!raw.trim()){ return; }
  var norm = raw.trim().replace(/\s+/g,' ').toLowerCase();
  ex._lastCmd = norm;
  ex._log.push({t: ex.cmd.prompt + ' ' + raw, err:false});
  var out = null;
  (ex.cmd.outputs || []).forEach(function(o){
    if(!out && new RegExp(o.re).test(norm)){ out = o; }
  });
  if(out){ out.lines.forEach(function(l){ ex._log.push({t:l, err:false}); }); }
  else { ex._log.push({t: ex.cmd.unknown || 'command not recognized for this simulation — check spelling and options', err:true}); }
  renderExercise();
  var lg = $('shelllog'); if(lg){ lg.scrollTop = lg.scrollHeight; }
  var si2 = $('shellin'); if(si2 && !si2.disabled){ si2.focus(); }
}
function logFilter(){
  var q = ($('logfilter').value || '').toLowerCase();
  document.querySelectorAll('#loglines .ln').forEach(function(ln){
    ln.style.display = (!q || ln.textContent.toLowerCase().indexOf(q) >= 0) ? '' : 'none';
  });
}
function renderBranchStep(){
  var ex = curEx();
  var area = $('answidget');
  if(!area){ return; }
  var htmlp = '';
  ex.steps.forEach(function(st2, si2){
    if(si2 > ex._step){ return; }
    var opts = st2.options.map(function(o, oi){
      var selCls = (ex._picks[si2] === oi) ? ' selected' : '';
      return '<label class="opt'+selCls+'" style="margin:6px 0"><input type="radio" name="bstep'+si2+'" value="'+oi+'" '+(ex._picks[si2]===oi?'checked':'')+' onchange="branchPick('+si2+','+oi+')"><span class="opt-key">'+String.fromCharCode(65+oi)+'.</span><span class="opt-text">'+esc(o.t)+'</span></label>';
    }).join('');
    var outcome = (ex._picks[si2] !== undefined && ex._picks[si2] !== null && si2 < ex._step) ?
      '<div class="outcome'+((ex._picks[si2]!==undefined && st2.options[ex._picks[si2]].outcomeBad)?' bad':'')+'">▸ '+esc(st2.options[ex._picks[si2]].outcome)+'</div>' : '';
    htmlp += '<div class="step"><span class="step-tag">STEP '+(si2+1)+' OF '+ex.steps.length+'</span><div class="step-text">'+esc(st2.text)+'</div>'+opts+outcome+
      (si2 === ex._step && ex._picks[si2] === undefined ? '<button class="btn ghost" style="margin-top:8px" onclick="branchConfirm('+si2+')">▸ Confirm step '+(si2+1)+' (does not stop the timer)</button>' : '')+
      '</div>';
  });
  if(ex._step >= ex.steps.length && !ex._checked){
    htmlp += '<div class="btnrow"><button class="btn green" onclick="gradeCurrent()">✓ Check — grade all '+ex.steps.length+' decisions</button></div>';
  }
  area.innerHTML = htmlp;
}
function branchPick(si2, oi){
  var ex = curEx();
  if(ex._checked || si2 !== ex._step){ return; }
  ex._pendingPick = oi;
  document.querySelectorAll('input[name="bstep'+si2+'"]').forEach(function(el){ var r = el.closest('.opt'); if(r){ r.classList.toggle('selected', el.checked); } });
}
function branchConfirm(si2){
  var ex = curEx();
  var picked = ex._pendingPick;
  if(picked === undefined || picked === null){ return; }
  ex._picks[si2] = picked;
  ex._pendingPick = null;
  ex._step = si2 + 1;
  renderBranchStep();
  updateCheckState();
}

/* ---------- flow: pause / skip / hint / next / review / results ---------- */
var flowLock = false;
function flowLockAcquire(){
  if(flowLock){ return false; }
  flowLock = true;
  return true;
}
function flowLockRelease(){ flowLock = false; }
function pauseManual(){
  if(!T || T.state === 'ENDED'){ return; }
  if(T.state === 'PAUSED_MANUAL'){ return; }
  T.prevState = T.state;
  setTState('PAUSED_MANUAL');
  var ov = document.createElement('div');
  ov.id = 'pauseoverlay';
  ov.innerHTML = '<div class="pausecard"><div class="pico">⏸</div><h2>PAUSED — manual</h2><p>The exercise is hidden and the timer is stopped. Press Resume when you are ready to continue.</p><button class="btn primary" id="btn-resume" onclick="resumeManual()">▶ Resume</button></div>';
  document.body.appendChild(ov);
  var ex = $('exarea'); if(ex){ ex.style.visibility = 'hidden'; }
}
function resumeManual(){
  var ov = $('pauseoverlay'); if(ov){ ov.remove(); }
  var ex = $('exarea'); if(ex){ ex.style.visibility = 'visible'; }
  setTState(T.prevState === 'PAUSED_AUTO_CHECK' ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
}
function doHint(){
  if(S.screen !== 'exam' && S.screen !== 'open'){ return; }
  var ex = curEx();
  if(!ex || ex._hintUsed || ex._checked){ return; }
  ex._hintUsed = true;
  var hp = document.createElement('div');
  hp.className = 'hintpanel';
  hp.innerHTML = '<span class="hint-tag">💡 HINT (one per exercise — costs 10% of this exercise\u2019s credit)</span>' + esc(ex.hint);
  var blk = document.querySelector('.blk.answer .blk-body');
  if(blk){ blk.insertBefore(hp, blk.firstChild); }
  $('btn-hint').disabled = true;
}
function doSkip(){
  if(S.screen !== 'exam'){ return; }
  if(!flowLockAcquire()){ return; }
  var ex = curEx();
  if(!ex || ex._checked){ flowLockRelease(); return; }
  var idx = EXS.indexOf(ex);
  if(S.skipped.indexOf(idx) < 0){ S.skipped.push(idx); }
  if(S.cur < EXS.length - 1){ S.cur += 1; renderExercise(); }
  else { flowLockRelease(); openReview(); }
}
function goNext(){
  if(!flowLockAcquire()){ return; }
  if(T.state === 'PAUSED_AUTO_CHECK'){ setTState('RUNNING'); }
  if(S.screen === 'open'){
    S.screen = 'review';
    openReview();
    return;
  }
  if(S.cur < EXS.length - 1){ S.cur += 1; renderExercise(); }
  else { flowLockRelease(); finishAttempt(false); }
}
function openReview(){
  flowLockRelease();
  S.screen = 'review';
  S.reviewing = null;
  if(T.state === 'PAUSED_AUTO_CHECK'){ setTState('RUNNING'); }
  updateHeader();
  var items = S.skipped.map(function(idx, pos){
    var ex = EXS[idx];
    return '<li><span class="statechip st-skipped">⚠ Skipped</span><span class="rv-title">'+esc(ex.title)+'</span><button class="btn primary" onclick="openSkipped('+pos+')">↩ Open and answer</button></li>';
  }).join('');
  $('exarea').innerHTML =
    '<div class="card"><h2>⚠ Review skipped exercises ('+S.skipped.length+')</h2>'+
    '<p style="color:var(--text-secondary)">The timer is still running. You can open each skipped exercise as many times as you need until the timer ends or you submit. If you submit now, every skipped-and-never-answered exercise is excluded from the score — it does not count as correct or wrong.</p>'+
    (S.skipped.length ? '<ul class="reviewlist">'+items+'</ul>' : '<p>Nothing left here — you answered everything.</p>')+
    '<div class="btnrow"><button class="btn danger" onclick="showResults()">⏹ Submit exam now</button></div></div>';
  window.scrollTo(0,0);
}
function openSkipped(pos){
  var idx = S.skipped[pos];
  var ordPos = S.order.indexOf(idx);
  if(ordPos < 0){ ordPos = 0; }
  S.cur = ordPos;
  S.reviewPos = pos;
  S.screen = 'open';
  renderExercise();
}
function finishAttempt(auto){
  if(T.iv){ clearInterval(T.iv); }
  var anySkipped = S.skipped.length > 0;
  if(!auto && anySkipped && S.screen === 'exam'){
    openReview();
    return;
  }
  showResults();
}
function showResults(){
  flowLockRelease();
  if(S.screen === 'results'){ return; }
  if(T.iv){ clearInterval(T.iv); }
  setTState('ENDED');
  S.screen = 'results';
  var fully = 0, partial = 0, partialSum = 0, incorrect = 0, skippedN = 0, answeredN = 0;
  EXS.forEach(function(ex){
    if(ex._checked){
      answeredN += 1;
      if(ex._credit >= 1){ fully += 1; }
      else if(ex._credit > 0){ partial += 1; partialSum += ex._credit; }
      else { incorrect += 1; }
    } else { skippedN += 1; }
  });
  var sum = 0;
  EXS.forEach(function(ex){ if(ex._checked){ sum += ex._credit; } });
  var pct = answeredN > 0 ? Math.round((sum / answeredN) * 100) : 0;
  var passed = pct >= META.passMark && answeredN > 0;
  var avgP = partial > 0 ? round1(partialSum / partial).toFixed(2) : '0.00';
  var mins = Math.floor((META.timerMinutes*60 - T.remaining) / 60);
  var cert = passed ?
    '<div class="cert pass"><h2>✓ PASS</h2><p>You reached <b>'+pct+'%</b>, which is at or above the '+META.passMark+'% pass mark. Your result has been reported to the site.</p></div>' :
    '<div class="cert fail"><h2>✗ FAIL</h2><p>You reached <b>'+pct+'%</b>, below the '+META.passMark+'% pass mark. You must retake the exam to pass.</p></div>';
  $('app').innerHTML =
    '<div class="card"><h1>Results — '+esc(META.title)+'</h1>'+
    '<p style="color:var(--text-secondary)">Score computed over <b>'+answeredN+'</b> answered exercise(s). '+skippedN+' skipped-and-never-answered exercise(s) were excluded from both the score and the maximum.</p>'+
    '<div class="factrow"><span class="fact">◎ <span>Final score: <b>'+sum.toFixed(1)+' / '+answeredN+'</b> — <b>'+pct+'%</b></span></span><span class="fact">⏱ <span>timer used: <b>'+mins+' min</b> of '+META.timerMinutes+'</span></span></div>'+
    '</div>'+
    cert+
    '<div class="resultgrid">'+
    '<div class="rcard"><div class="rc-num st-correct">✓ '+fully+'</div><div class="rc-lab">Fully correct (credit 1.0)</div></div>'+
    '<div class="rcard"><div class="rc-num st-partial">✓ '+partial+'</div><div class="rc-lab">Partially correct (avg credit '+avgP+')</div></div>'+
    '<div class="rcard"><div class="rc-num st-incorrect">✗ '+incorrect+'</div><div class="rc-lab">Fully incorrect (credit 0)</div></div>'+
    '<div class="rcard"><div class="rc-num st-skipped">⚠ '+skippedN+'</div><div class="rc-lab">Skipped — excluded</div></div>'+
    '</div>'+
    '<div class="card"><h2>How your time was spent</h2><p class="pauselog">⏸ Total time paused manually (exercise hidden): <b class="mono">'+T.manualTotal+' s</b><br>⏸ Total time paused for feedback review (Check auto-pause): <b class="mono">'+T.autoTotal+' s</b></p></div>'+
    '<div class="btnrow"><button class="btn primary" id="retakebtn" onclick="retake()">↻ Retake Exam</button></div>';
  window.scrollTo(0,0);
  if(!S.reported){
    S.reported = true;
    reportScore(sum, answeredN);
  }
}
function reportScore(creditSum, answeredCount){
  var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent >= META.passMark
    }, location.origin);
  } catch(e) { /* Opened directly rather than inside the site. */ }
}
function retake(){
  var init = S ? S.init : null;
  startAttempt();
  S.init = init;
  updateHeader();
}

/* ---------- handshake & boot ---------- */
window.addEventListener('message', function (event) {
  if (!event.data) { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  S = S || { init: null };
  S.init = {
    username: event.data.username || '',
    country: event.data.country || '',
    locale: event.data.locale || 'en',
    theme: event.data.theme || 'dark' /* always 'dark'; the file is dark-only, nothing to switch */
  };
  var uc = document.querySelector('.userchip');
  if (S.init.username && !uc) {
    var hero = document.querySelector('.factrow');
    if (hero) {
      var chip = document.createElement('span');
      chip.className = 'userchip';
      chip.textContent = '👤 Analyst: ' + S.init.username;
      hero.appendChild(chip);
    }
  }
});
S = { init: null };
renderIntro();
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
