{i:'branch',
 s:[{t:'ARTEFACT 1 — bastion-prod-2, 23:47 UTC',k:'log',
  lines:["23:47:03 EDR: bash -> echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH7kQ9xV2mJr8sT1wLz' >> /root/.ssh/authorized_keys",
         "23:47:03 auditd: (no events — auditd disabled on this host since baseline drift in March)"]},
  {t:'ARTEFACT 2 — host integrity checks, 23:58 UTC',k:'text',v:'stat counts and directory listings are mutually inconsistent; a kernel module with no package owner is loaded; an engineer notes "ls looks wrong but I cannot say why". Assessment: assume the on-disk view of this host cannot be fully trusted until proven otherwise.'},
  {t:'ARTEFACT 3 — constraints',k:'text',v:'bastion-prod-2 serves 400 engineers. Global markets open 06:00 UTC. The CISO is awake and asking for a decision every 20 minutes.'}],
 steps:[
  {t:'STEP 1 OF 4 — 00:05. On-disk state is suspect. What do you collect FIRST, before changing anything?',opts:[
    'Delete the attacker key from the file — persistence is the emergency',
    'Reboot the host to clear any kernel-level hiding',
    'Capture volatile memory and the live process/socket list, then snapshot the VM'],
   a:2,out:'Recorded. The scenario continues — the timer keeps running until the final Check.'},
  {t:'STEP 2 OF 4 — 00:40. Capture done. The CISO asks: "Rebuild it tonight?" What is the defensible answer?',opts:[
    'Rebuild immediately — a rebuild is the industry best practice and always comes first',
    'Isolate the host on a maintenance VLAN now; rebuild only after disk image and VM snapshot are signed off, because rebuild destroys the running-state evidence the investigation still needs',
    'Keep the bastion serving traffic — 400 engineers log in at 06:00'],
   a:1,out:'Recorded. Two steps left.'},
  {t:'STEP 3 OF 4 — 01:20. Hunting siblings across the estate, you cannot trust per-host file listings. What is reliable?',opts:[
    'Central aggregation: network flow to port 22 plus centrally collected auth events, correlated by key fingerprint and source IP',
    'SSH into every host and read its authorized_keys file',
    'Ask each host admin to confirm their keys by email'],
   a:0,out:'Recorded. Final step.'},
  {t:'STEP 4 OF 4 — 01:55. The board wants one sentence. Which one survives scrutiny?',opts:[
    '"Attacker SSH-key persistence is confirmed on one bastion, which is isolated with evidence captured; rebuild is scheduled behind sign-off; markets open on a redundant bastion; monitoring for sibling keys continues."',
    '"The attacker had full control of the estate; all systems are compromised."',
    '"A key was seen and removed; the incident is closed with no further action."'],
   a:0,out:'Recorded. The final Check now grades all four steps.'}],
 hint:'The constraint repeats at every step: on-disk truth is unavailable, and the business clock is real. Evidence that survives review outranks action that feels decisive.',
 why:'Step 1: with disk untrusted, memory and process state are the only sources an attacker cannot rewrite from ring 0 — capture them before any change; deleting the key or rebooting destroys exactly the evidence that proves scope. Step 2: "rebuild first" is the widely quoted best practice that is wrong here — rebuild wipes the running state, so the correct order is isolate (real cost accepted: engineers re-home to the redundant bastion), snapshot, image, then rebuild behind sign-off. Step 3: when host-side views are untrusted, only centrally collected auth events and network flow survive, correlated by fingerprint. Step 4: a defensible board line states what is known, contained, pending and monitored — no overclaim, no underclaim.',
 att:'ATTACKER PERSPECTIVE: a rootkit plus a re-injection cron means the attacker planned for "remove the key" — only evidence-first containment and central correlation beat that design.',
 def:'DEFENDER PERSPECTIVE: write the capture-before-change rule into the P1 runbook; under pressure, the runbook is the only cool head in the room.'},
/* 3 */
{i:'term',
 s:[{t:'Context',k:'text',v:'You are mid-containment on the isolated bastion. The evidence protocol requires: the attacker-modified file preserved to the mounted evidence share /mnt/evidence WITHOUT altering its metadata (timestamps and permissions may matter in court), and a cryptographic fingerprint of the preserved copy recorded for integrity. You get the goal; the mount is read-write for you; nothing else may change on the host.'}],
 q:'Type one command line that copies /root/.ssh/authorized_keys to /mnt/evidence preserving attributes, then hashes the preserved copy.',
 prompt:'responder@ir-shell:~$ ',
 els:[{l:'uses cp (a byte-for-byte copy, not a re-print into a new file)',r:'^cp\\b'},{l:'preserves mode, ownership and timestamps (-p)',r:'-p\\b'},{l:'copies from /root/.ssh/authorized_keys',r:'/root/\\.ssh/authorized_keys'},{l:'lands on the evidence mount /mnt/evidence',r:'/mnt/evidence'},{l:'records an integrity hash of the preserved copy (sha256sum)',r:'sha256sum'}],
 danger:[{r:'(>|>>|shred|\\brm\\b)[^;]*authorized_keys',m:'This would write into or destroy the original file — the single most valuable artefact in this case. Evidence is read from, never written to.'}],
 canon:'cp -p /root/.ssh/authorized_keys /mnt/evidence/ak_root.txt && sha256sum /mnt/evidence/ak_root.txt',
 canonExpl:['cp — makes a true copy; cat with redirection would rewrite the bytes and destroy original metadata','-p — preserve mode, ownership and timestamps; metadata can prove when the key landed','/root/.ssh/authorized_keys — the original, read but never modified','/mnt/evidence/... — the preserved copy on the evidence share','sha256sum — a fingerprint of the copy; any later change to the copy is then provable'],
 sample:'(no output from a successful cp; sha256sum prints) 9f2c...a41  /mnt/evidence/ak_root.txt',
 hint:'The constraint you may have missed: the protocol says metadata may matter, and the hash must describe the copy, not the original.',
 why:'cp -p answers both protocol requirements in one step: bytes and metadata travel intact. The hash is computed on the preserved copy (hashing the original is useful too, but the protocol binds the chain of custody to the copy). The near-misses are genuinely dangerous here: any >, >>, shred or rm touching authorized_keys destroys the artefact the whole case rests on — and a plain cat > newfile silently loses ownership and timestamps. Note the quiet detail for your report: the command runs on an isolated host, so even this safe command was authorised by the bridge first.',
 att:'ATTACKER PERSPECTIVE: attackers count on responders editing live files in panic; a preserved, hashed copy makes their tampering provable later.',
 def:'DEFENDER PERSPECTIVE: type the evidence command twice a year in a drill; at 02:00 the muscle memory is the control.'},
/* 4 */
{i:'qcm',
 s:[{t:'ARTEFACT 1 — incident bridge, 01:10 UTC',k:'text',v:'The root-cause summary: the intruder held a key for user "deploy" and a second key for root on jump01. The password for root was rotated 40 minutes ago. The 03:00 bridge check shows a fresh "Accepted publickey for root" login from 198[.]51[.]100[.]77.'}],
 q:'The password reset — the reflex "best practice" in every incident — failed. Why, and what is the correct eviction?',
 opts:['Keys are independent of passwords; the reset evicted nothing. Eviction means removing the attacker key lines (verified by fingerprint) and killing the re-injection mechanism',
       'The reset failed because root passwords need 32 characters or more',
       'The login must be a ghost entry; key logins stop when a password changes',
       'The correct eviction is changing the private key of the server (host keys)'],
 a:0,
 hint:'Ask what the attacker actually authenticates with. Then ask which artefact proves they own that artefact.',
 why:'Password authentication and key authentication are separate paths; a key holder never touches the password, so resetting it changes nothing for them — the 03:00 login proves it live. Eviction is artifact-specific: remove the exact attacker key lines (fingerprint-verified, after preservation) and kill whatever re-adds them (the cron job or stolen CI credential in this case). Host keys are the server\'s own identity material — rotating them affects client trust warnings, not user persistence. This is the "best practice is wrong here" trap in its purest form: the action is correct for password-based compromise and useless for key-based persistence.',
 att:'ATTACKER PERSPECTIVE: the attacker deliberately holds both a password path and a key path so that the obvious response resets the useless half.',
 def:'DEFENDER PERSPECTIVE: update the incident checklist: for T1098.004, "reset password" and "evict attacker" are two different lines, and only the second one closes the door.'},
/* 5 */
{i:'drag',
 s:[{t:'Context',k:'text',v:'The full intrusion artifact list is on the table. Route every artefact to its ATT&CK technique so eradication covers each one. Two artefacts are deliberately in here that are NOT key injection.'}],
 q:'Assign every artefact to the technique it belongs to.',
 zones:['T1098.004 — SSH Authorized Keys','T1098.001 — Additional Cloud Credentials','T1098.007 — Local or Domain Groups','T1098.005 — Device Registration','T1053.003 — Cron (Scheduled Task/Job)','T1070.001 — Clear Windows/Linux Logs'],
 items:[{n:'echo attacker key >> /root/.ssh/authorized_keys',z:0},
        {n:'new long-term access key created for IAM user svc-payroll',z:1},
        {n:'usermod -aG wheel deploy',z:2},
        {n:'Entra: device "WIN-GK77" registered from a stolen session',z:3},
        {n:'crontab: hourly job re-appends the key from /usr/lib/.sys/k.sh',z:4},
        {n:'/var/log/auth.log truncated after the root login',z:5}],
 hint:'One artefact keeps the key coming back, one cleans the traces. Those are different techniques from the injection itself — and each needs its own eradication step.',
 why:'The append is T1098.004. The IAM access key is T1098.001 (Additional Cloud Credentials) — the cloud cousin of the key trick. The wheel/sudo group addition is T1098.007. The Entra device is T1098.005. The hourly cron job is T1053.003 — the resilience mechanism, and the artefact that will undo a one-time cleanup. The log truncation is T1070.001. One intrusion, six techniques: the eradication plan must delete the key, revoke the access key, undo the group change, unregister the device, kill the cron job, and treat pre-truncation logging as unreliable — six steps, or the incident returns through whichever door you left open.',
 att:'ATTACKER PERSPECTIVE: layering persistence techniques is deliberate redundancy — each one is cheap, and together they survive partial cleanups.',
 def:'DEFENDER PERSPECTIVE: map every eradication action to a technique ID; any ID without an action is a scheduled re-incident.'},
/* 6 */
{i:'multi',
 s:[{t:'ARTEFACT 1 — conflicting views of the same file, host bastion-prod-2',k:'log',
  lines:["02:11:09 (central auditd relay) AUTHZ_KEYS path=/root/.ssh/authorized_keys op=append exe=/bin/bash",
         "02:30:00 (EDR remote view) file /root/.ssh/authorized_keys sha256 = BASELINE-UNCHANGED",
         "02:40:00 (your preserved copy, hashed on the evidence share) contains the new key line; hash differs from baseline"]}],
 q:'The auditd relay says the file changed; the EDR view says unchanged; your preserved copy proves the change. Select ALL explanations that remain defensible given the artefacts.',
 opts:['The EDR sensor on this host is failing, bypassed or tampered with — sensor health is now an incident question, not an assumption',
       'The host-side view was manipulated (hidden module, namespace or filter tricks), so "unchanged" describes what the sensor was ALLOWED to see',
       'Timestamps are misaligned: the "baseline" hash was actually computed after the write, making "unchanged" an artefact of when the hash ran',
       'The auditd relay fabricated the event, since two sources disagree',
       'authorized_keys can be appended without its hash changing',
       'The file was never modified; auditd matched a different file'],
 a:[0,1,2],
 hint:'You hold one artefact that beats views: the preserved copy. Rank the sources by directness, then test each explanation against the copy.',
 why:'The preserved copy is direct evidence and it contains the key — so the file did change, killing options 5 and 6 outright. That leaves the sensor view and the relay; directness and integrity favour the relay (a passive kernel-level audit stream, corroborated by your own copy), so the EDR view is the one on trial. Sensor failure, evasion/tampering and timestamp misalignment all survive the artefacts — and each has a different follow-up (sensor health check, memory forensics, baseline re-derivation). Fabrication by the relay has no supporting artefact and would require compromising the central logging tier — possible, but nothing here supports it, so it is not defensible from evidence. This is the conflicting-signal resolution the tier demands: the strongest source wins, and the loser becomes an investigation target.',
 att:'ATTACKER PERSPECTIVE: making one sensor blind while leaving another honest is deliberate — the honest source buys patience, the blind one buys doubt.',
 def:'DEFENDER PERSPECTIVE: preserve-then-argue: a hashed copy settles sensor disputes in seconds and keeps the conversation about evidence, not vendor claims.'},
/* 7 */
{i:'rank',
 s:[{t:'Context',k:'text',v:'Containment planning for the isolated bastion, 02:00 UTC. Global markets open 06:00. The CISO has approved an isolated maintenance window but wants the least business damage per unit of security gained. Rank the actions from LEAST destructive/evidence-safest first.'}],
 q:'Rank the five containment actions, least destructive first.',
 items:['Memory and snapshot capture on the isolated segment (no user impact, evidence preserved)',
        'Remove the single attacker key line after copying the file (cuts persistence, minimal blast radius)',
        'Revert PermitRootLogin yes back to no (closes the widened door, no user impact)',
        'Rotate the CI service-account credential used for the injection (kills the injection channel, brief deploy pause)',
        'Fleet-wide SSH restart and key audit during business hours (broad disruption — only if spread is confirmed)'],
 hint:'Two actions cost nothing but goodwill, one costs a deploy pause, one costs an outage window. Evidence value is highest early.',
 why:'Capture first: zero user impact and the highest evidence value — and once it is done, every later action is safe to take. Targeted key removal second: it cuts the confirmed persistence with a one-line change. Config revert third: PermitRootLogin no costs nothing and closes the door the attacker opened. The CI credential rotation fourth: it kills the injection channel but pauses the deploy pipeline — a real cost, scheduled not spontaneous. Fleet-wide restart with audits last: highest disruption, justified only if spread is confirmed — and by then the first four actions will already tell you. The ranking principle is senior-level: order by (evidence value kept) over (business cost paid), never by how decisive an action looks.',
 def:'DEFENDER PERSPECTIVE: this ranked list is the slide the CISO shows the board — containment with a price tag and a reason for every row.'},
/* 8 */
{i:'qcm',
 s:[{t:'ARTEFACT 1 — svc-backup key review, 21:40 UTC',k:'log',
  lines:["21:40:12 file: new key added to /home/svc-backup/.ssh/authorized_keys",
         "21:40:12 session: actor session originated from a known anonymiser exit range; identity claims impossible travel vs. the backup admin's normal home network",
         "21:41:00 CMDB: the key fingerprint matches laptop L-4471, registered to the backup admin, CHG-3310 approved last week"]}],
 q:'Nightly backups start at 22:00 and the estate\'s restore capability depends on svc-backup. What is the senior call?',
 opts:['Escalate to IR with the preserved session logs and keep the key in place but marked — the fingerprint is genuinely ambiguous evidence, and mass revocation now costs the estate its restore capability mid-window',
       'Remove every key from every service account immediately — compromise beats risk',
       'Close as benign — the fingerprint matches a registered laptop, and that settles it',
       'Permanently disable the backup service until the investigation ends'],
 a:0,
 hint:'Two strong signals point in opposite directions, and one action has a business cost you will pay tonight. Name the ambiguity, keep the evidence, and hand the decision to the people authorized to make it.',
 why:'The fingerprint match (benign) and the anonymiser origin with impossible travel (malign) are genuinely contradictory: stolen laptop, stolen session reusing a registered key, or an admin on holiday via a VPN exit are all live hypotheses. Mass revocation is defensible in some worlds — but here it fires at 21:40 against a 22:00 backup window, trading restore capability for a hypothesis, and it torches the monitoring opportunity of watching a marked key. Permanent disablement is the same trade with worse odds. Closing on the fingerprint alone ignores the session anomaly. The senior move is: preserve, mark, escalate with both artefacts, and let IR decide with the business — that is why option A is the correct answer and also why the other three each fail a different duty (evidence, cost, or completeness).',
 att:'ATTACKER PERSPECTIVE: reusing a legitimately registered fingerprint is the highest-value camouflage in this technique — it weaponises your own CMDB against your triage.',
 def:'DEFENDER PERSPECTIVE: pre-agree the "marked key" procedure with IR and the service owner; ambiguity handled in advance stops 21:40 from becoming 02:00.'},
/* 9 */
{i:'spot',
 s:[{t:'ARTEFACT 1 — junior runbook draft for "remove attacker SSH key"',k:'code',
  lines:['1. Notify the bridge and freeze non-essential changes',
         '2. Copy /root/.ssh/authorized_keys and the last hour of auth logs to the evidence share',
         '3. Truncate the live file in place:  > /root/.ssh/authorized_keys',
         '4. Remove only the attacker key line, verified by fingerprint',
         '5. Set owner-only permissions on every authorized_keys path (M1022)']}],
 q:'Click the ONE line that damages the investigation or the host.',
 a:[2],
 hint:'Step 4 is the surgical version of what step 3 tries to do. Ask what step 3 destroys beyond the attacker key.',
 why:'Line 3 truncates the whole file: it destroys the legitimate keys (breaking every engineer\'s access at once), erases the file-level record the case will need, and hands the attacker\'s cron re-injection job a clean slate to rebuild on. Line 4 does the same security job surgically — remove the fingerprint-verified line, leave everything else intact. The other lines are sound: evidence before change, then hardening (M1022). This is the cost trap: truncation feels decisive, is a real command some runbooks still carry, and is wrong here.',
 def:'DEFENDER PERSPECTIVE: put the surgical removal command with its fingerprint check into the runbook verbatim; under pressure, juniors type what they read.'},
/* 10 */
{i:'fill',
 s:[{t:'ARTEFACT 1 — multi-cloud incident note (draft)',k:'log',
  lines:["03:19:11 Azure PATCH virtualMachines/vm-pay-01 keyData=ssh-ed25519 AAAA...Wq81LmZ0 path=/home/azureuser/.ssh/authorized_keys caller=contractor-svc@contoso.example",
         "03:26:44 UAL: contractor-svc created inbox rule 'archive everything from finance@' (separate technique, same identity)"]},
  {t:'Context',k:'text',v:'Complete the note for the joint cloud/IR channel. Words come from the bank; not all are used. One signal is deliberately incomplete: region eu-north-1 has no CloudTrail, so cloud-side coverage there is a gap you must note, not assume.'}],
 q:'Finish the joint cloud/IR incident note.',
 txt:'The VM PATCH installs a key into ___1___ — the cloud-API route of T1098.004, watched by analytic ___2___ . The inbox-rule activity shows the contractor identity performing broader ___3___ manipulation than VMs alone, so scoping must cover the whole identity, not one resource.',
 blanks:{'1':'/home/azureuser/.ssh/authorized_keys','2':'AN0352','3':'account'},
 bank:['/home/azureuser/.ssh/authorized_keys','/etc/ssh/keys-root/authorized_keys','AN0352','AN0354','account','network'],
 hint:'Blank 1 is the path the PATCH body names. Blank 2 is the cloud-push analytic. Blank 3 is the ATT&CK tactic-family word for what T1098 does to identities.',
 why:'The PATCH body names /home/azureuser/.ssh/authorized_keys as the install path — the cloud route, not the ESXi path. The analytic for cloud-API key pushes is AN0352 (AN0354 is the network-device analytic). The inbox rule is account manipulation on the identity, which widens the case from "one VM" to "one identity with multiple techniques" — that is why scoping follows the identity. And the note must carry the coverage gap: with no CloudTrail in eu-north-1, absence of evidence there is not evidence of absence, and the gap goes into the report as a risk, not as a clean result.',
 def:'DEFENDER PERSPECTIVE: notes that name path, analytic and scope-gap are what let the next team continue at 06:00 without re-deriving the case.'},
/* 11 */
{i:'match',
 s:[{t:'Context',k:'text',v:'Control design review with the GRC analyst. She needs each control classified by HOW it acts against T1098.004 — before the fact or after it.'}],
 q:'Match each control to its action class and target.',
 L:['M1018 — restrict instance-metadata/update rights','M1022 — restrictive ACLs on authorized_keys paths','PermitRootLogin no (an M1042 measure)','auditd watch (-k sshkey_inject) on key paths'],
 R:['Detective — stops nothing; fires the event that starts response and evidence collection',
    'Preventive — removes the cloud API key-push route before any key can be pushed',
    'Preventive — makes unauthorized local writes to the key list fail at the filesystem level',
    'Preventive — removes root as a key-login target entirely, so root keys are worthless'],
 a:[3,1,2,0],
 hint:'Three controls prevent, one detects. The detecting one cannot change the outcome of the write — only start the clock on it.',
 why:'M1018 shrinks who can push keys through cloud APIs — prevention of the AN0352 route. M1022 makes the unauthorised append fail at the filesystem — prevention of the AN0350 route. PermitRootLogin no does not stop the write at all; it makes the root-destined key worthless — prevention by removing the target. The auditd watch prevents nothing: the write happens, and the value is the tagged event, the ancestry context and the start of evidence collection — detection. GRC cares because preventive controls belong in change management and architecture reviews, while detective controls belong in monitoring budgets and response SLAs; mislabelling them is how a control gap hides for a year.',
 def:'DEFENDER PERSPECTIVE: the mature posture for this technique is three preventive layers plus one loud detective layer — and the detective layer is what saves you when a preventive one drifts.'},
/* 12 */
{i:'order',
 s:[{t:'Context',k:'text',v:'Eradication plan for the bastion incident, with one hard constraint: the CI service-account credential is live in the deploy pipeline and can only be rotated in the 06:00 window (marked BLOCKED until then). Everything else is executable now. Order the plan correctly — the blocked step still has a correct position.'}],
 q:'Order the six eradication steps, first to last.',
 items:['Host already isolated on the maintenance VLAN (agreed window) — confirm and record',
        'Memory capture and VM snapshot, signed into evidence',
        'Remove the fingerprint-verified attacker key line and revert PermitRootLogin to no',
        'Remove the hourly cron re-injection job and its script from disk',
        'BLOCKED until 06:00: rotate the CI service-account credential (live in the deploy pipeline)',
        'Rebuild the host from the gold image after evidence sign-off'],
 hint:'The blocked step is not skipped — it is sequenced where the pipeline window puts it. Evidence steps precede changes; the rebuild follows sign-off, not hope.',
 why:'Isolation is recorded first (already true, but an unrecorded control is an unaudited one). Capture second — the last moment the running state exists. Key removal and config revert third: after evidence exists, cutting persistence is safe to do. The cron job dies fourth — it is the mechanism that would undo step three within the hour. The CI credential rotation sits fifth: blocked by the deploy pipeline window, not by choice — and note the risk this ordering accepts: until 06:00, the injection channel exists, which is exactly why the cron job and key are already gone and monitoring watches both. The rebuild is last, behind evidence sign-off, because it is irreversible. Sequencing with constraints is the senior skill: blocked steps are placed, not dropped.',
 att:'ATTACKER PERSPECTIVE: the attacker\'s design (cron re-add plus a stolen pipeline credential) forces exactly this ordering — anything else leaves a live path.',
 def:'DEFENDER PERSPECTIVE: mark blocked steps visibly in the plan and pair them with compensating monitoring — a documented gap is a managed gap.'},
/* 13 */
{i:'qcm',
 s:[{t:'ARTEFACT 1 — 22:14 UTC, build02',k:'log',
  lines:["22:14:02 ansible-runner: lineinfile /home/deploy/.ssh/authorized_keys (playbook rotate_keys.yml)",
         "22:14:02 ancestry: svc-ci -> ansible-runner -> python3 (lineinfile module)",
         "22:14:05 CMDB: fingerprint matches CHG-5102 registered key; change window 22:00-23:00, approved"]}],
 q:'Every artefact is owned: ancestry, ticket, window, fingerprint. The rule still alerted because the fingerprint had not been pre-registered. What now?',
 opts:['Do nothing yet operationally: mark the write as expected in the case, register the fingerprint in the CMDB allowlist, and keep watching for any second write outside the window — the second write is the real tripwire',
       'Page the full IR team and isolate build02 now',
       'Remove the key and roll back the automation run',
       'Disable the Ansible key rotation permanently to silence the alert class'],
 a:0,
 hint:'The constraint you may have missed: every artefact is explained and verified. Ask what a response would cost versus what risk remains.',
 why:'With ancestry, ticket, window and fingerprint all verified, the write is documented automation — responding to it spends IR capacity, stops a legitimate deployment and teaches the SOC to ignore its own alerts. The correct action is cheap and keeps the tripwire armed: register the fingerprint (so next time it does not alert) and watch for a second, out-of-window write — which is precisely how the real attacks in this topic behave (a benign write followed by an attacker write in the same file). Disabling the rotation silences a control that works; isolating build02 is the cost answer for unexplained artefacts, not verified ones.',
 att:'ATTACKER PERSPECTIVE: attackers hide inside verified automation; the defence is registering every legitimate fingerprint so the unregistered one stands alone.',
 def:'DEFENDER PERSPECTIVE: allowlist-and-watch beats respond-and-regret for verified writes — but only when the allowlist entry is a fingerprint, never just an account name.'},
/* 14 */
{i:'fill',
 s:[{t:'Context',k:'text',v:'The CISO needs three sentences for the board pack. Choose the missing words from the bank; decoys are mixed in.'}],
 q:'Complete the board summary.',
 txt:'The attacker installed an SSH ___1___ key on a jump host to guarantee ___2___ , which is why the password resets alone could not evict them. Containment preserved evidence before changes and the 06:00 market open was served by the redundant bastion. The control gap that let the injection land — broad, unmanaged ___3___ push rights in our cloud project — is now tracked under mitigation M1018.',
 blanks:{'1':'private','2':'persistence','3':'metadata'},
 bank:['private','public','persistence','discovery','metadata','firewall'],
 hint:'Blank 1: which half of the key pair does the attacker hold? Blank 2: the tactic word this whole topic is named for. Blank 3: the cloud-side right that M1018 governs.',
 why:'The attacker holds the private key — the public half sits in the file. Persistence is the tactic purpose: a durable way back in. Metadata push rights are the cloud control M1018 governs: the rights that allowed a key to be installed through the API instead of a file. The board sentence works because each clause names an artefact, a control and a business outcome — no jargon the board must decode. Firewalls and discovery are decoys from a different layer of the story.',
 def:'DEFENDER PERSPECTIVE: board language for this technique is one sentence: attackers stopped using passwords, so our controls and our incidents must stop assuming passwords.'},
/* 15 */
{i:'match',
 s:[{t:'Context',k:'text',v:'Evidence review before the case handover. The junior packed everything into one folder with no labels. Match each artefact to the purpose it actually serves in the case.'}],
 q:'Match each evidence artefact to its investigative purpose.',
 L:['Hashed copy of authorized_keys (taken 02:40)','Process ancestry logs for the write','Cloud audit log export (30 days)','Fingerprint list from the CMDB'],
 R:['Proves which identity could push keys via API and when — the cloud-route timeline',
     'Turns "unknown key" into a fast allow/deny check for every key seen now and in future reviews',
     'Shows exactly which key lines existed at incident time — the state that must be restored and the artefact the attacker added to',
     'Proves which process wrote the file and what spawned it — the automation-versus-attacker decision'],
 a:[2,1,0,3],
 hint:'Two artefacts answer "what happened", one answers "who could have", one answers "how do we judge the next one quickly".',
 why:'The hashed copy is the file-state truth: what existed, what was added, what restoration means. The ancestry logs are the decision evidence: which process, which parent, automation or attacker. The cloud export is the possibility evidence: every identity that could push a key through an API, on a timeline — it answers "who could have" even when they did not. The CMDB fingerprint list is the triage accelerant: it converts every future key sighting into a lookup. Handing over unlabelled evidence loses exactly these distinctions — and with them, the case\'s ability to answer the two questions every post-incident review asks: what happened, and how do we catch it faster next time.',
 def:'DEFENDER PERSPECTIVE: label evidence by purpose at collection time; the handover is where investigations are won or lost.'},
/* 16 */
{i:'branch',
 s:[{t:'SIMULATION — shift handover, 06:55 UTC',k:'text',v:'Three open threads, one decision each. You are signing the handover sheet; every disposition you record will be acted on by the day shift exactly as written.'}],
 steps:[
  {t:'THREAD 1 OF 3 — 03:12 add-metadata by svc-deployer (not the CI runner), key comment matches no CMDB fingerprint.',opts:[
    'Treat as true positive persistence (T1098.004 cloud route): preserve the audit record, remove the pushed key, investigate the svc-deployer credential',
    'Close as benign — the technique is used by automation all the time',
    'Escalate to the network team — this is a firewall finding'],
   a:0,out:'Recorded. The scenario continues — the timer keeps running until the final Check.'},
  {t:'THREAD 2 OF 3 — 09:00 add-metadata by svc-ci-runner, fingerprint matches the CMDB bastion entry, runbook documents the daily sync.',opts:[
    'Treat as true positive — any add-metadata call is an attack',
    'Close as expected automation — fingerprint and runbook both verify; register nothing further',

function prepare(){

    if(ex.i==='fill'){p.bank=shuffle(ex.bank.slice());}

      var rp=shuffle(ex.R.map(function(_,i){return i;}));

  });
}

function hlLine(raw){

  return e.replace(re,function(m,ip,url,path,fp,kw,kwf,alg){
    if(ip)return '<span class="ln-ip">'+m+'</span>';

/* ============ GRADING ============ */
function grade(ex,p){
  var r={H:0,W:0,N:1,items:[],danger:null};
  if(ex.i==='qcm'){
    r.N=1;
    if(RT.sel===p.a){r.H=1;}else{r.W=1;}
    r.items=[{t:'Your answer: '+(RT.sel>=0?String.fromCharCode(65+RT.sel)+'. '+cut(p.opts[RT.sel],120):'(nothing selected)'),st:r.H===1?'ok':'bad'}];
    if(r.H!==1)r.items.push({t:'Correct answer: '+String.fromCharCode(65+p.a)+'. '+cut(p.opts[p.a],120),st:'ok'});
  }else if(ex.i==='multi'){
    r.N=p.a.length;
    var self=[];
    p.opts.forEach(function(o,i){
      if(RT.sel[i]&&p.a.indexOf(i)>=0){r.H++;self.push({t:String.fromCharCode(65+i)+'. '+o,st:'ok'});}
      else if(RT.sel[i]){r.W++;self.push({t:String.fromCharCode(65+i)+'. '+o,st:'bad'});}
      else if(p.a.indexOf(i)>=0){self.push({t:String.fromCharCode(65+i)+'. '+o,st:'miss'});}
    });
    r.items=self;
  }else if(ex.i==='fill'){
    var keys=Object.keys(ex.blanks);
    r.N=keys.length;
    keys.forEach(function(k){
      var want=ex.blanks[k],got=RT.blanks[k];
      if(got===want)r.H++;
      else if(got!==undefined)r.W++;
      r.items.push({t:'Blank '+k+' — correct: '+want,st:got===want?'ok':(got!==undefined?'bad':'miss')});
    });
  }else if(ex.i==='match'){
    r.N=ex.L.length;
    ex.L.forEach(function(l,i){
      var got=RT.pairs[i],want=p.a[i];
      if(got===want)r.H++;
      else if(got!==undefined)r.W++;
      r.items.push({t:'"'+l+'" ↔ "'+(want!==undefined?p.R[want]:'?')+'"',st:got===want?'ok':(got!==undefined?'bad':'miss')});
    });
  }else if(ex.i==='order'||ex.i==='rank'){
    r.N=ex.items.length;
    RT.cur.forEach(function(itemIx,pos){
      if(itemIx===pos)r.H++;else r.W++;
      r.items.push({t:'Position '+(pos+1)+': '+ex.items[pos],st:itemIx===pos?'ok':'bad'});
    });
  }else if(ex.i==='drag'){
    r.N=ex.items.length;
    ex.items.forEach(function(it,ix){
      if(RT.place[ix]===it.z)r.H++;
      else if(RT.place[ix]!==undefined)r.W++;
      r.items.push({t:it.n,st:RT.place[ix]===it.z?'ok':(RT.place[ix]!==undefined?'bad':'miss')});
    });
  }else if(ex.i==='spot'){
    r.N=ex.a.length;
    Object.keys(RT.sel).forEach(function(i){if(RT.sel[i]){if(ex.a.indexOf(parseInt(i,10))>=0)r.H++;else r.W++;}});
    ex.a.forEach(function(i){if(!RT.sel[i])r.items.push({t:'Missed line '+(i+1)+': '+cut(ex.s[0].lines[i],110),st:'miss'});});
    Object.keys(RT.sel).forEach(function(i){if(RT.sel[i])r.items.push({t:'Line '+(parseInt(i,10)+1),st:ex.a.indexOf(parseInt(i,10))>=0?'ok':'bad'});});
  }else if(ex.i==='term'){
    r.N=ex.els.length;
    var cmd=String($('tin')?$('tin').value:'').trim().replace(/\s+/g,' ');
    RT.cmd=cmd;
    ex.els.forEach(function(e){
      var ok=new RegExp(e.r,'i').test(cmd);
      if(ok)r.H++;
      r.items.push({t:e.l,st:ok?'ok':'miss'});
    });
    if(ex.danger){for(var di=0;di<ex.danger.length;di++){
      if(new RegExp(ex.danger[di].r,'i').test(cmd)){r.danger=ex.danger[di].m;r.H=0;
        r.items=r.items.map(function(it){return {t:it.t,st:'bad'};});break;}
    }}
  }else if(ex.i==='branch'){
    r.N=ex.steps.length;
    ex.steps.forEach(function(st,si){
      var got=RT.choices[si],want=p.stepOpts[si].a;
      if(got===want)r.H++;else r.W++;
      r.items.push({t:'Step '+(si+1)+' — correct: '+cut(st.opts[want],140)+(got!==undefined?' · you chose: '+cut(st.opts[got],140):' (no answer)'),st:got===want?'ok':'bad'});
    });
  }
  return r;
}
function checkButtonLabel(ex){
  if(ex.i==='branch'&&RT.step<ex.steps.length-1)return '✓ Confirm step';
  if(ex.i==='term')return '✓ Run & Check';

    advance(true);

function hasUnansweredSkipped(){

function doCheck(){
  var ex=EX[S.order[S.idx]],p=PRE[S.order[S.idx]];
  if(ex.i==='branch'){
    if(RT.sel<0)return;
    if(RT.step<ex.steps.length-1){
      RT.choices[RT.step]=RT.sel;RT.step++;
      renderBranchStep(ex,p);
      var so=$('step-out');if(so)so.innerHTML='<div class="outcome">Noted. The scenario continues — the timer keeps running until the final Check.</div>';
      window.scrollTo(0,0);return;
    }
    RT.choices[RT.step]=RT.sel;
  }
  if(LOCKED)return;
  if(ex.i==='qcm'&&RT.sel<0)return;
  if(ex.i==='multi'&&Object.keys(RT.sel).every(function(k){return !RT.sel[k];}))return;
  if(ex.i==='fill'&&Object.keys(RT.blanks||{}).length===0)return;
  if(ex.i==='match'&&Object.keys(RT.pairs||{}).length===0)return;
  if(ex.i==='term'&&!String($('tin').value).trim())return;
  var r=grade(ex,p);
  var credit=scoreExercise(r.H,r.W,r.N);
  if(S.hintUsed[S.order[S.idx]])credit=Math.max(0,credit-0.10);
  if(ex.i==='term'){echoTerm(ex,r);}
  LOCKED=true;LASTR={r:r,credit:credit};
  if(ex.i==='qcm'){
    Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){
      var i=parseInt(b.getAttribute('data-i'),10);
      if(i===p.a)b.classList.add('good');
      else if(RT.sel===i)b.classList.add('errz');
    });
  }else if(ex.i==='multi'){
    Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){
      var i=parseInt(b.getAttribute('data-i'),10);
      if(p.a.indexOf(i)>=0)b.classList.add('good');
      else if(RT.sel[i]===true)b.classList.add('errz');
    });
  }
  var ix=S.order[S.idx];
  if(!S.credits.hasOwnProperty(ix)){S.credits[ix]=credit;S.answered++;S.creditSum+=credit;}
  pauseAuto();
  updateScore();
  renderFeedback(ex,p,r,credit);
  var bn=$('btn-next');bn.style.display='';
  var isLast=S.idx>=EX.length-1;
  bn.setAttribute('data-mode',isLast?'final':'next');
  if(!isLast)bn.textContent='Next ▶';
  var bc=$('btn-check');bc.disabled=true;
  var tin=$('tin');if(tin)tin.disabled=true;
}
function echoTerm(ex,r){
  var out=$('tout');
  var txt=out.textContent+'\n\n'+ex.prompt+RT.cmd+'\n';
  if(r.danger){txt+='[simulation] REFUSED — the command matches a destructive pattern. Nothing was executed.';
    if(ex.sample)txt+='\n(expected output shape for the safe command:)\n'+ex.sample;}
  else{
    if(ex.sample)txt+=ex.sample+'\n';
    if(r.H===0){txt+='[simulation] no expected element matched — in a real shell this would be: bash: '+(String(RT.cmd).split(/\s+/)[0]||'?')+': command not found';}
  }

  S.phase='review';

  var h=headerHTML()+'<main id="stage"><div class="card"><h2><span class="hicon">⚠</span>Review skipped exercises</h2>'+
   '<p class="muted">These exercises are not answered yet. They are <b>excluded from your score</b> if they stay unanswered. You may return to any of them now, as long as time remains ('+fmt(T.remain)+' left).</p>'+
   S.skipped.map(function(ix,k){
     var done=S.credits.hasOwnProperty(ix);
     return '<div class="skipitem"><span class="siw">⚠ Skipped</span><span style="flex:1">'+esc(exerciseSummary(EX[ix],k))+'</span>'+
      (done?'<span class="badge ok">✓ answered</span>':'<button class="btn small" data-rx="'+ix+'">✎ Answer now</button>')+'</div>';
   }).join('')+
   '<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">'+
   '<button class="btn primary" id="btn-final">⏹ Submit final answers</button>'+
   '<button class="btn ghost" id="btn-backexam">◀ Keep working</button></div></div></main>';
  APP.innerHTML=h;bindHeader();renderTimer();
  Array.prototype.forEach.call(document.querySelectorAll('[data-rx]'),function(b){
    b.onclick=function(){var ix=parseInt(b.getAttribute('data-rx'),10);
      S.idx=S.order.indexOf(ix);if(S.idx<0)S.idx=0;
      S.returnTo='review';S.phase='exam';LOCKED=false;LASTR=null;RT={};
      APP.innerHTML=headerHTML()+'<main id="stage"></main>';
      bindHeader();renderTimer();renderExercise();window.scrollTo(0,0);};
  });
  $('btn-final').onclick=function(){showResults(false);};
  $('btn-backexam').onclick=function(){
    var next=-1;
    for(var k=0;k<S.order.length;k++){var ix=S.order[k];
      if(!S.credits.hasOwnProperty(ix)&&S.skipped.indexOf(ix)<0){next=k;break;}}
    if(next<0){goReview();return;}
    S.idx=next;S.returnTo='exam';S.phase='exam';LOCKED=false;LASTR=null;RT={};
    APP.innerHTML=headerHTML()+'<main id="stage"></main>';bindHeader();renderTimer();renderExercise();window.scrollTo(0,0);};
}
function exerciseSummary(ex,k){
  var q=ex.q||ex.steps[0].t;
  return 'Exercise '+(k+1)+': '+(q.length>90?q.slice(0,90)+'…':q);
}
/* ============ RESULTS ============ */
function showResults(fromTimeout){
  S.phase='results';
  if(T.iv)clearInterval(T.iv);
  T.state='ENDED';renderTimer();
  var fully=0,partly=0,wrong=0,partSum=0,answered=0,sum=0;
  Object.keys(S.credits).forEach(function(ix){
    var c=S.credits[ix];answered++;sum+=c;
    if(c>=1)fully++;else if(c>0){partly++;partSum+=c;}else wrong++;
  });
  var skippedLeft=EX.length-answered;
  var percent=answered>0?Math.round((sum/answered)*100):0;
  var passed=percent>=70;
  if(!S.reported){reportScore(sum,answered);S.reported=true;}
  var h=headerHTML()+'<main id="stage"><div class="card"><h2><span class="hicon">📊</span>Results — '+esc(CFG.title)+'</h2>'+
   '<p class="muted">'+(fromTimeout?'Time ran out. ':'')+'Scored over the '+answered+' exercise(s) you actually answered. Unanswered or skipped-and-never-answered exercises are excluded.</p>'+
   '<div class="resgrid">'+
   '<div class="rescard ok"><div class="rn">'+fully+'</div><div>✓ Fully correct</div></div>'+
   '<div class="rescard part"><div class="rn">'+partly+'</div><div>✓ Partially correct'+(partly?' — avg '+(partSum/partly).toFixed(2):'')+'</div></div>'+
   '<div class="rescard bad"><div class="rn">'+wrong+'</div><div>✗ Fully incorrect</div></div>'+
   '<div class="rescard skip"><div class="rn">'+skippedLeft+'</div><div>⚠ Skipped — excluded</div></div>'+
   '</div>'+
   '<div class="cert '+(passed?'okc':'failc '+(passed?'':'fail'))+'"><div class="big">'+(passed?'✓ PASS':'✗ FAIL')+'</div>'+
   '<div style="font-size:20px;font-weight:700">'+(Math.round(sum*10)/10)+' / '+answered+' — '+percent+'%</div>'+
   '<div class="muted">'+(passed?'Congratulations — you reached the 70% pass mark.':'You need 70% to pass. Read the lesson again and retake the exam.')+'</div></div>'+
   '<p class="muted small">Time spent paused by you: '+fmt(S.pausedManualSec)+' · Time paused automatically for reading feedback: '+fmt(S.pausedAutoSec)+'</p>'+
   '<div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">'+
   '<button class="btn primary" id="btn-retake" style="min-height:48px">⟲ Retake Exam</button></div></div></main>';
  APP.innerHTML=h;bindHeader();renderTimer();
  $('btn-retake').onclick=startExam;
  window.scrollTo(0,0);
}
/* ============ INIT ============ */
document.addEventListener('click',function(ev){
  var t=ev.target;if(!t||!t.closest)return;
  var b=t.closest('#scenbtn');if(!b)return;
  var blk=document.getElementById('scenblock');if(!blk)return;
  var col=blk.classList.toggle('scen-collapsed');
  b.textContent=col?'▸ Expand scenario':'▾ Collapse scenario';
  b.setAttribute('aria-expanded',col?'false':'true');
});
renderIntro();
</script>
</body>
</html>
