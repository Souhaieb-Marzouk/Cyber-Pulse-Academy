<style>
:root{

  --bg-surface:#121a2e;
  --bg-surface-2:#0f1729;
  --border:#243049;

  --text-secondary:#a9b4d0;

  --accent-blue:#5aa9ff;
  --accent-amber:#ffb454;
  --accent-green:#57d38c;
  --state-correct:#57d38c;
  --state-partial:#ffb454;
  --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0;
  --state-paused:#9d7bff;
  --sev-easy:#57d38c;
  --sev-medium:#ffb454;
  --sev-hard:#ff8a3d;
  --sev-extreme:#ff6b6b;
  --sev-easy-bg:rgba(87,211,140,.13);
  --sev-medium-bg:rgba(255,180,84,.13);
  --sev-hard-bg:rgba(255,138,61,.13);
  --sev-extreme-bg:rgba(255,107,107,.13);
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"Cascadia Code",Consolas,"SF Mono",Menlo,"Liberation Mono","Courier New",monospace;
  /* derived surface + tint tokens (all colour literals live here, once) */
  --btn-bg:#182238;
  --btn-bg-hover:#1c2a48;
  --accent-blue-strong:#7abcff;
  --accent-green-strong:#7ce3ab;
  --on-primary:#06121f;
  --on-green:#05130b;
  --opt-bg-hover:#132038;
  --input-bg:#0b1322;
  --term-bg:#070d1a;
  --hdr-bg:rgba(13,19,36,.97);
  --progress-track:#0d1428;
  --kw-blue:#7fd0ff;
  --tint-green:rgba(87,211,140,.08);
  --tint-green-2:rgba(87,211,140,.09);
  --tint-green-3:rgba(87,211,140,.1);
  --tint-amber:rgba(255,180,84,.08);
  --tint-amber-2:rgba(255,180,84,.06);
  --tint-amber-border:rgba(255,180,84,.45);
  --tint-red:rgba(255,107,107,.1);
  --tint-blue:rgba(90,169,255,.05);
  --tint-overlay:rgba(7,10,22,.88);
  --sheen:rgba(255,255,255,.35);
  --tint-overlay:rgba(7,10,22,.88);
  --sheen:rgba(255,255,255,.35);
  --tint-overlay:rgba(7,10,22,.88);
  --sheen:rgba(255,255,255,.35);
  --shadow-a:0 8px 22px rgba(0,0,0,.28);
  --shadow-b:0 6px 18px rgba(0,0,0,.35);
  --shadow-c:0 6px 16px rgba(0,0,0,.25);
  --shadow-d:0 10px 26px rgba(0,0,0,.4);
}
html,body{margin:0;padding:0;}
html{color-scheme:dark;}
body{
  background:var(--bg-page);
  color:var(--text-primary);
  font-family:var(--font-ui);
  font-size:16px;
  line-height:1.55;
  min-height:100vh;
}
body.sev-easy{--sev:var(--sev-easy);--sev-bg:var(--sev-easy-bg);}
body.sev-medium{--sev:var(--sev-medium);--sev-bg:var(--sev-medium-bg);}
body.sev-hard{--sev:var(--sev-hard);--sev-bg:var(--sev-hard-bg);}
body.sev-extreme{--sev:var(--sev-extreme);--sev-bg:var(--sev-extreme-bg);}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 60px;}
.hidden{display:none !important;}
button{font-family:var(--font-ui);}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px;}
.ic{font-style:normal;font-weight:700;}

/* ---------- sticky exam header ---------- */
#hdr{
  position:sticky;top:0;z-index:40;
  background:var(--hdr-bg);
  border-bottom:1px solid var(--border);
  box-shadow:var(--shadow-b);
}
#hdrIn{
  max-width:1000px;margin:0 auto;padding:10px 16px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
}
.hdr-title{font-weight:700;font-size:15px;color:var(--text-primary);margin-right:4px;}
.hdr-title .mono{font-family:var(--font-mono);}
.sev-badge{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--sev);color:var(--sev);background:var(--sev-bg);
  border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800;letter-spacing:.07em;
  min-height:30px;
}
.sev-badge .dot{width:9px;height:9px;border-radius:50%;background:var(--sev);}
.chipstat{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--border);border-radius:999px;
  background:var(--bg-surface);padding:6px 12px;font-size:13.5px;color:var(--text-primary);
  min-height:34px;
}
.chipstat .lbl{color:var(--text-secondary);}
.chipstat .mono{font-family:var(--font-mono);font-weight:700;}
.chipstat.ts-run{color:var(--text-primary);}
.chipstat.ts-paused{color:var(--state-paused);border-color:var(--state-paused);}
.chipstat.ts-ended{color:var(--state-incorrect);border-color:var(--state-incorrect);}
.score-sum{font-weight:800;}
.hdr-spacer{flex:1;}
.btn{
  min-height:44px;padding:9px 18px;border-radius:6px;cursor:pointer;
  border:1px solid var(--border);background:var(--btn-bg);color:var(--text-primary);
  font-weight:600;font-size:14.5px;transition:background .15s,border-color .15s;
}
.btn:hover{border-color:var(--accent-blue);background:var(--btn-bg-hover);}
.btn.primary{background:var(--accent-blue);border-color:var(--accent-blue);color:var(--on-primary);font-weight:800;}
.btn.primary:hover{background:var(--accent-blue-strong);}
.btn.green{background:var(--accent-green);border-color:var(--accent-green);color:var(--on-green);font-weight:800;}
.btn.green:hover{background:var(--accent-green-strong);}
.btn.ghost{background:transparent;}
.btn.danger{background:transparent;border-color:var(--state-incorrect);color:var(--state-incorrect);}
.btn.danger:hover{background:var(--tint-red);}
.btn.small{min-height:44px;padding:6px 13px;font-size:13.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn .ic{margin-right:4px;}

/* ---------- progress bar ---------- */
#progressWrap{position:sticky;top:57px;z-index:39;height:6px;background:var(--progress-track);border-bottom:1px solid var(--border);}
#progressBar{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--sev),var(--accent-blue));
  border-radius:0 3px 3px 0;position:relative;overflow:hidden;
  transition:width .4s ease;
}
#progressBar::after{
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,var(--sheen),transparent);
  animation:sheen 2.8s linear infinite;
}
@keyframes sheen{to{left:110%;}}

/* ---------- cards / blocks ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-a);}
.blk{background:var(--bg-surface);border:1px solid var(--border);border-left:4px solid var(--accent-blue);border-radius:8px;margin:16px 0;box-shadow:var(--shadow-c);}
.blk.b-q{border-left-color:var(--accent-amber);}
.blk.b-ans{border-left-color:var(--accent-green);}
.blk-head{
  display:flex;align-items:center;gap:9px;padding:10px 14px;
  border-bottom:1px solid var(--border);font-weight:800;font-size:13.5px;letter-spacing:.09em;
}
.b-scen>.blk-head{color:var(--accent-blue);}
.b-q>.blk-head{color:var(--accent-amber);}
.b-ans>.blk-head{color:var(--accent-green);}
.blk-head .ic{font-size:15px;}
.blk-body{padding:14px 16px;}
.ex-meta{color:var(--text-secondary);font-size:13.5px;margin:12px 2px 0;}
.ex-type{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
  border-radius:999px;padding:3px 11px;font-size:12px;color:var(--text-secondary);
  background:var(--bg-surface);letter-spacing:.05em;
}

/* ---------- scenario / artefacts ---------- */
.sc-toggle{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:transparent;border:none;color:var(--text-secondary);
  padding:10px 14px;cursor:pointer;font-size:13.5px;min-height:44px;
}
.sc-toggle:hover{color:var(--text-primary);}
.sc-toggle .sum{flex:1;}
.sc-toggle .state-word{font-size:12px;letter-spacing:.06em;border:1px solid var(--border);border-radius:999px;padding:2px 10px;color:var(--text-secondary);}
.sc-panels{padding:2px 14px 14px;}
.art{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;margin:10px 0;overflow:hidden;}
.art-label{
  font-family:var(--font-mono);font-size:12px;color:var(--accent-blue);
  padding:8px 12px 2px;letter-spacing:.07em;font-weight:700;
}
.art-body{padding:8px 12px 12px;font-size:15px;}
.art-body p{margin:6px 0;}
.prose p{margin:8px 0;}
.mono{font-family:var(--font-mono);}
code.inline{
  font-family:var(--font-mono);font-size:14px;color:var(--text-mono);
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;
}

/* ---------- log viewer ---------- */
.log-tools{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px dashed var(--border);}
.log-filter{
  flex:1;max-width:340px;min-height:44px;background:var(--input-bg);border:1px solid var(--border);
  color:var(--text-mono);font-family:var(--font-mono);font-size:13.5px;border-radius:4px;padding:6px 10px;
}
.log-count{font-size:12.5px;color:var(--text-secondary);font-family:var(--font-mono);}
.log{font-family:var(--font-mono);font-size:13.8px;line-height:1.6;padding:10px 12px;overflow-x:auto;white-space:pre;color:var(--text-mono);}
.logline{display:block;}
.logline.off{display:none;}
.lg-t{color:var(--text-secondary);}
.lg-ev{color:var(--accent-blue);font-weight:700;}
.lg-val{color:var(--accent-amber);}
.lg-str{color:var(--accent-green);}
.lg-kw{color:var(--kw-blue);font-weight:700;}
.lg-warn{color:var(--state-incorrect);font-weight:700;}
.lg-dim{color:var(--text-secondary);}

/* ---------- answer widgets ---------- */
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;
  padding:12px 14px;margin:9px 0;min-height:44px;color:var(--text-primary);
  cursor:pointer;font-size:15.5px;line-height:1.5;transition:border-color .15s,background .15s;
}
.opt:hover{border-color:var(--accent-blue);background:var(--opt-bg-hover);}
.opt .opx{color:var(--text-secondary);font-weight:800;flex:0 0 auto;}
.opt.sel{
  border-color:var(--accent-green);box-shadow:inset 4px 0 0 var(--accent-green);
  background:var(--tint-green);
}
.opt.sel .selmark{margin-left:auto;color:var(--accent-green);font-weight:700;font-size:13px;white-space:nowrap;}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;min-height:52px;}
.chip{
  display:inline-flex;align-items:center;gap:8px;min-height:44px;
  background:var(--bg-surface-2);border:1px dashed var(--border);border-radius:6px;
  padding:8px 14px;color:var(--text-primary);font-size:14.5px;cursor:grab;user-select:none;
}
.chip.sel{border-color:var(--accent-amber);box-shadow:0 0 0 1px var(--accent-amber);}
.chip.dragging{opacity:.45;}
.chip .rm{border:none;background:transparent;color:var(--state-incorrect);cursor:pointer;font-size:15px;padding:2px 4px;min-height:44px;min-width:44px;}
.slots{display:grid;gap:12px;margin-top:6px;}
.slot{
  border:1px dashed var(--border);border-radius:8px;background:var(--tint-blue);
  padding:10px 12px;min-height:60px;transition:border-color .15s,background .15s;
}
.slot.over{border-color:var(--accent-green);background:var(--tint-green-2);border-style:solid;}
.slot-label{font-family:var(--font-mono);font-size:12.5px;color:var(--accent-blue);letter-spacing:.06em;font-weight:700;margin-bottom:6px;display:flex;gap:8px;align-items:center;}
.slot-label .cap{color:var(--text-secondary);font-weight:400;}
.slot .bank{margin:4px 0 0;}
.selrow{
  display:grid;grid-template-columns:1fr minmax(220px,340px);gap:12px;align-items:center;
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;
  padding:10px 12px;margin:9px 0;
}
.selrow .left{font-size:15px;}
.selrow .left .sub{display:block;color:var(--text-secondary);font-size:13px;margin-top:2px;}
select,input[type=text].fillin{
  min-height:44px;background:var(--input-bg);border:1px solid var(--border);color:var(--text-primary);
  border-radius:4px;padding:8px 10px;font-size:14.5px;font-family:var(--font-ui);width:100%;
}
select:focus,input[type=text]:focus{border-color:var(--accent-blue);}
input[type=text].fillin{font-family:var(--font-mono);}
.fill-sent{font-size:16px;line-height:2;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:12px 14px;}
.fill-sent input{width:200px;margin:0 4px;display:inline-block;}
.ord-list{margin:6px 0;}
.ord-item{
  display:flex;gap:10px;align-items:center;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:9px 0;
  min-height:48px;cursor:grab;font-size:15px;
}
.ord-item.dragging{opacity:.4;}
.ord-item.over{border-color:var(--accent-green);border-style:solid;}
.ord-handle{color:var(--text-secondary);font-size:15px;letter-spacing:2px;}
.ord-btns{display:flex;gap:6px;margin-left:auto;}
.ord-btns .btn{min-height:44px;min-width:44px;padding:4px 10px;font-size:14px;}
.step-tag{
  display:inline-flex;gap:6px;align-items:center;border:1px solid var(--accent-amber);
  color:var(--accent-amber);border-radius:999px;font-size:12px;font-weight:800;
  padding:2px 10px;letter-spacing:.07em;margin:4px 0 8px;
}
.branch-step{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:12px 0;background:var(--bg-surface-2);}
.branch-step.done{opacity:.92;border-style:dashed;}
.branch-step .bq{font-weight:700;margin-bottom:8px;}
.alert-card{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:10px 0;}
.alert-card .a-title{display:flex;gap:10px;align-items:center;font-weight:700;}
.alert-card .a-id{font-family:var(--font-mono);color:var(--accent-blue);font-size:13px;}
.alert-card .a-meta{color:var(--text-secondary);font-size:13.5px;margin:6px 0;}
.prio-wrap{display:flex;flex-direction:column;gap:0;}
.rank-badge{
  flex:0 0 30px;height:30px;border-radius:50%;border:1px solid var(--sev);color:var(--sev);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--font-mono);font-size:14px;
}

/* ---------- terminal ---------- */
.term{background:var(--term-bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:10px 0;}
.term-head{
  display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--input-bg);
  border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:12.5px;color:var(--text-secondary);
}
.term-dot{width:10px;height:10px;border-radius:50%;background:var(--border);}
.term-dot.g{background:var(--accent-green);}
.term-scroll{max-height:230px;overflow-y:auto;padding:10px 12px;font-family:var(--font-mono);font-size:14px;color:var(--text-mono);white-space:pre-wrap;word-break:break-word;}
.term-line .p{color:var(--accent-green);font-weight:700;}
.term-line.err{color:var(--state-incorrect);}
.term-line.ok{color:var(--accent-green);}
.term-in{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--border);align-items:center;}
.term-in .p{font-family:var(--font-mono);color:var(--accent-green);font-weight:700;font-size:14px;white-space:nowrap;}
.term-in input{
  flex:1;min-height:44px;background:var(--input-bg);border:1px solid var(--border);color:var(--text-mono);
  font-family:var(--font-mono);font-size:14px;border-radius:4px;padding:8px 10px;
}
.syntax-panel{
  background:var(--bg-surface-2);border:1px solid var(--border);border-left:4px solid var(--accent-blue);
  border-radius:6px;padding:10px 14px;margin:10px 0;font-size:14px;
}
.syntax-panel .sp-title{font-family:var(--font-mono);font-size:12px;color:var(--accent-blue);font-weight:700;letter-spacing:.07em;margin-bottom:6px;}
.syntax-panel code{font-family:var(--font-mono);color:var(--text-mono);font-size:13.5px;display:block;margin:3px 0;}
.syntax-panel .cm{color:var(--text-secondary);}
.codeblock{position:relative;background:var(--term-bg);border:1px solid var(--border);border-radius:6px;margin:10px 0;}
.codeblock code{display:block;font-family:var(--font-mono);font-size:14px;color:var(--text-mono);padding:12px 14px;white-space:pre-wrap;word-break:break-word;}
.codeblock .copy{
  position:absolute;top:6px;right:6px;min-height:44px;min-width:44px;padding:2px 12px;font-size:12px;
  background:var(--bg-surface);border:1px solid var(--border);border-radius:4px;color:var(--text-secondary);cursor:pointer;
}
.codeblock .copy:hover{color:var(--text-primary);border-color:var(--accent-blue);}

/* ---------- hint / feedback ---------- */
.hint-panel{
  border:1px solid var(--tint-amber-border);background:var(--tint-amber);
  border-radius:6px;padding:10px 14px;margin:12px 0;color:var(--text-primary);font-size:15px;
}
.hint-panel .hp-head{color:var(--accent-amber);font-weight:800;font-size:13px;letter-spacing:.07em;display:flex;gap:7px;align-items:center;margin-bottom:4px;}
.fb{border:1px solid var(--border);border-left:5px solid var(--state-correct);border-radius:8px;background:var(--bg-surface);margin:16px 0 0;box-shadow:var(--shadow-c);}
.fb.correct{border-left-color:var(--state-correct);}
.fb.partial{border-left-color:var(--state-partial);}
.fb.incorrect{border-left-color:var(--state-incorrect);}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:800;letter-spacing:.06em;font-size:15px;flex-wrap:wrap;}
.fb.correct .fb-head{color:var(--state-correct);}
.fb.partial .fb-head{color:var(--state-partial);}
.fb.incorrect .fb-head{color:var(--state-incorrect);}
.fb-credit{
  font-family:var(--font-mono);font-size:12.5px;border:1px solid var(--border);
  border-radius:999px;padding:2px 10px;color:var(--text-secondary);font-weight:400;letter-spacing:0;
}
.fb-body{padding:4px 16px 16px;color:var(--text-primary);font-size:15px;}
.fb-body h4{margin:12px 0 6px;font-size:14px;color:var(--text-secondary);letter-spacing:.05em;font-weight:700;}
.itemrow{
  display:flex;gap:10px;align-items:flex-start;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:6px;padding:9px 12px;margin:7px 0;font-size:14.5px;
}
.itemrow .ic{flex:0 0 auto;margin-top:1px;}
.ic-ok{color:var(--state-correct);}
.ic-bad{color:var(--state-incorrect);}
.ic-miss{color:var(--state-skipped);}
.ic-part{color:var(--state-partial);}
.ic-pause{color:var(--state-paused);}
.study{border:1px dashed var(--accent-amber);border-radius:6px;background:var(--tint-amber-2);padding:10px 12px;margin-top:10px;font-size:14.5px;}
.study b{color:var(--accent-amber);}
.actionbar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center;}

/* ---------- pause overlay ---------- */
#pauseOverlay{
  position:fixed;inset:0;z-index:60;background:var(--tint-overlay);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.pauseBox{max-width:460px;width:100%;padding:26px;text-align:center;}
body.paused-blur #exam,body.paused-blur #review{filter:blur(16px);}
body.paused-blur #hdr{filter:blur(4px);}
.pauseBox .big{font-size:40px;color:var(--state-paused);}
.pauseBox h2{margin:8px 0 6px;color:var(--state-paused);letter-spacing:.06em;}
.pauseBox p{color:var(--text-secondary);}

/* ---------- intro screen ---------- */
.intro-hero{padding:22px 24px;margin-top:24px;}
.ih-title{font-size:26px;font-weight:800;margin:0 0 4px;letter-spacing:.01em;}
.ih-obj{color:var(--text-secondary);font-size:15px;margin:0 0 14px;}
.ih-obj .mono{color:var(--accent-blue);}
.facts{display:flex;flex-wrap:wrap;gap:10px;}
.fact{
  border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);
  padding:10px 14px;min-width:130px;
}
.fact .fl{font-size:12px;color:var(--text-secondary);letter-spacing:.07em;font-weight:700;}
.fact .fv{font-size:16.5px;font-weight:800;margin-top:3px;}
.fact .fv .mono{font-size:15.5px;}
.intro-sec{margin-top:18px;padding:20px 24px;}
.sec-h{
  display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;
  color:var(--text-primary);margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--border);
}
.sec-h .ic{color:var(--accent-blue);}
.prose{font-size:15.5px;color:var(--text-primary);}
.prose p{margin:10px 0;}
.kw-theme{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 16px;margin:12px 0;}
.kw-theme h4{margin:0 0 8px;font-size:14px;color:var(--accent-blue);letter-spacing:.06em;display:flex;gap:8px;align-items:center;}
.kw-list{display:flex;flex-wrap:wrap;gap:8px;}
.kw{
  border:1px solid var(--border);border-radius:999px;background:var(--bg-surface);
  color:var(--text-primary);font-size:13.5px;padding:4px 12px;
}
.how-list{margin:8px 0 0;padding:0 0 0 2px;list-style:none;}
.how-list li{
  display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--border);
  font-size:15px;
}
.how-list li:last-child{border-bottom:none;}
.how-list .ic{flex:0 0 auto;margin-top:1px;}
.startrow{margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.startrow .note{color:var(--text-secondary);font-size:13.5px;}

/* ---------- review screen ---------- */
.rev-item{
  display:flex;gap:12px;align-items:center;justify-content:space-between;
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;
  padding:12px 16px;margin:10px 0;flex-wrap:wrap;
}
.rev-item .r-l{display:flex;gap:10px;align-items:center;font-size:15px;}
.rev-item .sk{
  color:var(--state-skipped);font-weight:700;font-size:13px;border:1px solid var(--border);
  border-radius:999px;padding:2px 10px;display:inline-flex;gap:6px;align-items:center;
}

/* ---------- results ---------- */
.res-hero{padding:24px;margin-top:24px;text-align:left;}
.res-pct{font-size:44px;font-weight:800;}
.res-pct .mono{font-size:30px;}
.verdict{
  display:inline-flex;align-items:center;gap:10px;border-radius:10px;padding:10px 20px;
  font-size:22px;font-weight:800;letter-spacing:.08em;margin-top:6px;
}
.verdict.pass{border:1px solid var(--state-correct);color:var(--state-correct);background:var(--tint-green-3);}
.verdict.fail{border:1px solid var(--state-incorrect);color:var(--state-incorrect);background:var(--tint-red);}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:18px;}
.res-cell{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;}
.res-cell .rl{font-size:12.5px;color:var(--text-secondary);font-weight:700;letter-spacing:.06em;display:flex;gap:7px;align-items:center;}
.res-cell .rv{font-size:24px;font-weight:800;margin-top:4px;}
.res-cell .rv small{font-size:13px;color:var(--text-secondary);font-weight:600;}
.res-list{margin-top:14px;}
.res-row{
  display:flex;gap:10px;align-items:center;justify-content:space-between;
  border:1px solid var(--border);border-radius:6px;background:var(--bg-surface-2);
  padding:8px 12px;margin:7px 0;font-size:14px;flex-wrap:wrap;
}
.res-row .rr-cred{font-family:var(--font-mono);font-weight:700;}
.timer-stats{margin-top:16px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 16px;font-size:14.5px;}
.timer-stats .ts-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;flex-wrap:wrap;}
.timer-stats .ts-row .k{color:var(--text-secondary);}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--bg-surface);border:1px solid var(--accent-amber);color:var(--text-primary);
  border-radius:8px;padding:10px 18px;font-size:14.5px;z-index:80;box-shadow:var(--shadow-d);
}

/* ---------- responsive ---------- */
@media (max-width:780px){
  .selrow{grid-template-columns:1fr;}
  select{max-width:100%;}
  .hdr-title{width:100%;}
  #hdrIn{gap:8px;}
  .ih-title{font-size:21px;}
  .blk-body,.intro-sec,.intro-hero{padding:14px;}
}
@media (prefers-reduced-motion:reduce){
  #progressBar{transition:none;}
  #progressBar::after{animation:none;display:none;}
  *{transition:none !important;}
}

</main>

<script>
'use strict';
/* =====================================================================
   T1547.014 — Active Setup · shared dark-theme exam engine
   One file = one batch. Vanilla JS only. No external requests.
   ===================================================================== */
var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var PAYLOAD = {"docTitle": "T1547.014 — EASY practice exam", "sevCls": "sev-easy", "sevName": "EASY", "objId": "T1547.014", "objName": "Boot or Logon Autostart Execution: Active Setup", "objShort": "Active Setup", "budgetSec": 1500, "exercises": [{"id": "E-01", "type": "qcm", "extype": "Multiple choice", "scenario": {"summary": "Kick-off question — a teammate asks what the Windows feature Active Setup is for", "prose": "<p>A teammate asks you: &ldquo;What is this Active Setup thing in Windows?&rdquo; You open the ATT&amp;CK page for T1547.014 and read the description out loud.<\/p>"}, "prompt": "Which sentence describes Active Setup correctly?", "hint": "This is about a Windows mechanism that launches a program at one specific moment: when someone signs in.", "exp": "<p>Active Setup is a <b>Windows logon mechanism<\/b>. Windows keeps a list of components, and each component can carry a command. After a user logs in, Windows runs that command for that user. Attackers abuse it so their own program starts at logon without installing a service.<\/p>", "study": "ATT&amp;CK T1547.014 description — the first two sentences define the whole mechanism.", "opts": [{"t": "A Windows mechanism that runs a program when a user logs in", "ok": true, "why": "Correct. The ATT&amp;CK description says Active Setup is a Windows mechanism used to execute programs when a user logs in."}, {"t": "A Windows firewall rule that blocks unknown programs", "ok": false, "why": "Wrong. Active Setup does not filter network traffic — the Windows Firewall does that."}, {"t": "A Windows backup tool that copies user files at night", "ok": false, "why": "Wrong. Active Setup does not copy files on a schedule; it runs commands at logon."}, {"t": "A Linux service that starts programs at boot", "ok": false, "why": "Wrong. Active Setup exists only on Windows — the ATT&amp;CK page lists the platform as Windows."}]}, {"id": "E-02", "type": "dnd", "extype": "Drag & drop (2 zones)", "scenario": {"summary": "Registry anatomy — name the key and the value that hold an Active Setup command", "prose": "<p>You open <span class='mono'>regedit<\/span> on a lab machine and expand the path <span class='mono'>HKLM\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components<\/span>. One sub-key holds a value whose data is a command line.<\/p>"}, "prompt": "Drag each name onto what it is.", "hint": "One name is the registry key that lists all components; the other is the value inside a component that stores the command.", "exp": "<p><b>Installed Components<\/b> is the registry key that lists every Active Setup component. <b>StubPath<\/b> is the value inside a component; its data is the command line that Windows executes at logon. Attackers plant their program by setting StubPath.<\/p>", "slots": ["The value that stores the command to run", "The key that lists all Active Setup components"], "cap": "one", "bank": [{"t": "StubPath", "slot": 0, "why": "StubPath is the value; its data is the command line executed at logon."}, {"t": "Installed Components", "slot": 1, "why": "Installed Components is the registry key under HKLM\\SOFTWARE\\Microsoft\\Active Setup that lists the components."}]}, {"id": "E-03", "type": "qcm", "extype": "Multiple choice", "scenario": {"summary": "An attacker with admin rights wants every user on the machine to run their program", "prose": "<p>An attacker already has admin rights on a Windows PC. They want a component that applies to every user of that machine. They must write to the <b>machine-wide<\/b> part of Active Setup.<\/p>"}, "prompt": "Which registry hive holds that machine-wide list?", "hint": "The machine-wide hive starts with the letters HKLM. The user-specific mirror starts with HKCU.", "exp": "<p>The machine part lives under <b>HKEY_LOCAL_MACHINE (HKLM)<\/b> in <span class='mono'>SOFTWARE\\Microsoft\\Active Setup\\Installed Components<\/span>. Writing there needs admin rights. Each user also has a personal mirror under <b>HKCU<\/b>, which only records what that profile already ran.<\/p>", "study": "Machine part (HKLM) vs user part (HKCU) — this split is the heart of Active Setup.", "opts": [{"t": "HKLM — HKEY_LOCAL_MACHINE", "ok": true, "why": "Correct. HKLM is the machine-wide hive; the attacker plants the component there for every user."}, {"t": "HKCU — HKEY_CURRENT_USER", "ok": false, "why": "Wrong. HKCU is only the per-user mirror that records what this profile already ran."}, {"t": "HKCR — HKEY_CLASSES_ROOT", "ok": false, "why": "Wrong. HKCR stores file-type and COM-class information, not Active Setup components."}, {"t": "No hive — it is a plain file on disk", "ok": false, "why": "Wrong. Active Setup lives in the registry, not in a normal file."}]}, {"id": "E-04", "type": "fill", "extype": "Fill in the blank", "scenario": {"summary": "How often does the command run for each user profile?", "prose": "<p>A new intern asks: &ldquo;If ten users share this PC, does the StubPath command run ten times?&rdquo; You explain the per-user rule: each profile that has never run the component runs it one time. After that, Windows marks the component as done <i>for that user<\/i>.<\/p>"}, "prompt": "Complete the sentence with one word.", "hint": "Think of the word that means &ldquo;one time only&rdquo;.", "exp": "<p>The command runs <b>once<\/b> per user. Windows notes in the user part that this profile already ran the component, so the next logon for the same user does nothing. A brand-new user on the same machine still gets one run of their own. Attackers can force extra runs by changing the Version value &mdash; that trick is taught in the harder levels.<\/p>", "text": "Each user profile runs the StubPath command ____ per user, the first time that profile logs on after the component exists.", "blanks": [{"a": ["once", "one time", "1 time", "a single time"], "disp": "once", "why": "Active Setup runs a component once per user profile; the per-user marker stops repeats."}]}, {"id": "E-05", "type": "qcm", "extype": "Multiple choice", "scenario": {"summary": "Timing — when in the logon flow does the StubPath command fire?", "prose": "<p>You plant a legitimate test component on a lab machine (with written approval) and reboot. You want to know the exact moment the command will execute.<\/p>"}, "prompt": "When does the StubPath command actually run?", "hint": "The command belongs to the logon process. It does not wait for you to open any program.", "exp": "<p>Windows processes Active Setup <b>during logon, after the user signs in and before the desktop is fully ready<\/b>. That is why a hanging StubPath command can delay or block the desktop. For a defender this timing matters: logon-time process creation is exactly where you should look for the stub running.<\/p>", "study": "Active Setup runs during logon, before Run/RunOnce entries (those are handled by the desktop shell).", "opts": [{"t": "After the user logs in, before the desktop is ready", "ok": true, "why": "Correct. Active Setup is processed as part of logon, before the desktop shell finishes starting."}, {"t": "Only when the user opens the Control Panel", "ok": false, "why": "Wrong. No user action is needed; the command runs as part of logon itself."}, {"t": "Only after the attacker types a password", "ok": false, "why": "Wrong. The attacker is not present. Any user logging on triggers their planted command."}, {"t": "Never — it only writes a log file", "ok": false, "why": "Wrong. The StubPath command is really executed; that is the whole point of the abuse."}]}, {"id": "E-06", "type": "triage", "extype": "SOC alert triage (3 alerts)", "scenario": {"summary": "Your first SOC shift — three alerts about Active Setup are waiting in the queue", "prose": "<p>You are a SOC analyst. Three alerts arrived. For each one, choose the right disposition. Guidance: a real plant usually has a strange command or an unknown creator; a software installer creating components during an approved change is normal.<\/p>"}, "prompt": "Set the correct disposition for each alert.", "hint": "Read each StubPath command. Encoded PowerShell from an unknown creator is a plant; msiexec during an approved change is normal.", "exp": "<p>ALT-01 is the classic plant: a brand-new component whose StubPath runs encoded PowerShell — escalate it. ALT-02 is an installer doing its normal job during an approved change — close it as benign. ALT-03 has nothing to do with Active Setup — close it as unrelated. Reading the StubPath value first is always the fastest triage step.<\/p>", "study": "Always read the StubPath command and the creator before deciding.", "disps": [{"id": "d0", "label": "Close — normal installer activity"}, {"id": "d1", "label": "Escalate — possible Active Setup persistence"}, {"id": "d2", "label": "Close — unrelated to Active Setup"}], "alerts": [{"id": "ALT-01", "title": "New component created on WS-114", "meta": "StubPath = <span class='mono'>cmd.exe /c powershell -w hidden -enc SQBFAFIA<\/span>, creator unknown, 08:55", "ok": "d1", "why": "An encoded PowerShell one-liner planted under Active Setup is a persistence attempt. Escalate."}, {"id": "ALT-02", "title": "New component created on WS-118", "meta": "StubPath = <span class='mono'>msiexec /Fpums {90160000-0011-0000-0000-0000000FF1CE} /Qn<\/span>, created during approved change #2231", "ok": "d0", "why": "An msiexec repair command created during an approved software change is normal installer behaviour."}, {"id": "ALT-03", "title": "Print job flood on PRN-03", "meta": "User printed 40 pages to the office printer", "ok": "d2", "why": "Printing has nothing to do with Active Setup or persistence — close as unrelated."}]}, {"id": "E-07", "type": "match", "extype": "Matching (3 pairs)", "scenario": {"summary": "Vocabulary check — three terms from today's lesson", "prose": "<p>Before the next lesson your mentor asks you to connect three terms to their plain meanings.<\/p>"}, "prompt": "Match each term to its plain meaning.", "hint": "One term is a tactic (an attacker goal), one is a registry value, one is a registry hive.", "exp": "<p><b>Persistence<\/b> is the tactic: the attacker's goal to stay inside the system. <b>StubPath<\/b> is the value that holds the logon command. <b>HKLM<\/b> is the machine-wide hive that needs admin rights to change. These three words appear in almost every Active Setup conversation.<\/p>", "pairs": [["Persistence", "The attacker's goal: staying in the system across reboots and logons", "Persistence is the ATT&amp;CK tactic for keeping access to a system."], ["StubPath", "The value that stores the command Windows runs at logon", "StubPath is the registry value inside an Installed Component whose data is the command line."], ["HKLM", "The machine-wide hive that needs admin rights to change", "HKEY_LOCAL_MACHINE holds machine-wide settings; writing to it requires administrator rights."]]}, {"id": "E-08", "type": "qcm", "extype": "Multiple choice", "scenario": {"summary": "Attacker's gain — why would an adversary bother with Active Setup?", "prose": "<p>Think like an attacker for a moment. Your malware runs once on a workstation. You have admin rights. You want to come back tomorrow, next week, and after every reboot.<\/p>"}, "prompt": "What does an Active Setup entry give the adversary?", "hint": "The attacker wants their program to start again by itself — tomorrow and after every reboot.", "exp": "<p><b>Attacker perspective:<\/b> the planted command runs again at the next logon and after every reboot, so the attacker keeps access without touching services or scheduled tasks. <b>Defender perspective:<\/b> that is exactly why defenders monitor the Active Setup registry path — a new component there means someone may be re-arming a foothold.<\/p>", "study": "Persistence = access that survives reboots. T1547.014 is one Windows way to get it.", "opts": [{"t": "Their program starts again at each relevant logon and survives reboots", "ok": true, "why": "Correct. That is persistence: the command re-runs at logon, so the attacker keeps coming back."}, {"t": "Their program runs faster than other programs", "ok": false, "why": "Wrong. Active Setup is about starting automatically, not about speed."}, {"t": "They instantly get a new administrator password", "ok": false, "why": "Wrong. Planting the key needs admin rights already; it grants no new passwords."}, {"t": "Windows removes all antivirus tools quietly", "ok": false, "why": "Wrong. Active Setup does not touch antivirus tools at all."}]}, {"id": "E-09", "type": "order", "extype": "Timeline ordering (3 steps)", "scenario": {"summary": "A user signs in on a machine with a planted component — order the three moments", "prose": "<p>A user signs in on a machine that carries a planted Active Setup component. Only three moments matter here. Put them in the order they really happen.<\/p>"}, "prompt": "Order the events from first to last.", "hint": "The StubPath command belongs to the logon process itself — it finishes before the desktop appears.", "exp": "<p>First the user authenticates. Then Windows processes Active Setup and runs the StubPath command while the logon is still finishing. Only after that does the desktop appear. This is why users can experience slow logons on a compromised machine — the attacker's command runs synchronously before the desktop is ready.<\/p>", "items": ["The user types their password and logs on", "Active Setup runs the StubPath command", "The desktop appears and the user starts working"], "why": ["Logon comes first — nothing of Active Setup happens before the user authenticates.", "The stub runs during logon processing, before the desktop shell is up.", "The desktop appears last, after Active Setup has finished its work."]}, {"id": "E-10", "type": "fill", "extype": "Fill in the blank", "scenario": {"summary": "Execution context — whose permissions does the command get?", "prose": "<p>The ATT&amp;CK description says the programs run &ldquo;under the context of the user and will have the account's associated permissions level&rdquo;. You must complete this sentence for your team notes.<\/p>"}, "prompt": "Complete the sentence.", "hint": "Whose session is running when the command fires? The person who just signed in.", "exp": "<p>The command runs as the <b>logged-on user<\/b>, with that account's permissions. It does not run as SYSTEM and not as the attacker. Consequence: the planted program can reach whatever that user can reach — files, shares, tokens — which is why &ldquo;normal user&rdquo; workstations are still worth planting when a valuable account logs into them.<\/p>", "text": "The StubPath command executes under the context of the ____ user, with that account's own permission level.", "blanks": [{"a": ["logged-on", "logged on", "loggedon", "logging-in", "signing-in"], "disp": "logged-on", "why": "The command inherits the session of the user who is logging on — not SYSTEM, not the attacker."}]}, {"id": "E-11", "type": "dnd", "extype": "Drag & drop (2 zones)", "scenario": {"summary": "Two quick facts every analyst recites — platform and required rights", "prose": "<p>Your mentor asks two rapid-fire questions about T1547.014. Drag the right fact onto each question.<\/p>"}, "prompt": "Drag each fact to the question it answers.", "hint": "The ATT&amp;CK page lists the platform as one operating system family; writing under HKLM needs elevated rights.", "exp": "<p>T1547.014 is a <b>Windows<\/b> technique — Active Setup does not exist on Linux or macOS. And planting the machine-wide component under HKLM requires <b>Administrator<\/b> rights. Normal users can read the key, but they cannot create components in it. That is why attackers first steal an admin account, then plant persistence.<\/p>", "slots": ["Platform this technique runs on", "Rights needed to write under HKLM"], "cap": "one", "bank": [{"t": "Windows", "slot": 0, "why": "The ATT&amp;CK page lists the platform as Windows only."}, {"t": "Administrator", "slot": 1, "why": "Creating keys under HKLM requires administrator (elevated) rights."}]}, {"id": "E-12", "type": "qcm", "extype": "Multiple choice", "scenario": {"summary": "The page mentions entries that &ldquo;look as if they are associated with legitimate programs&rdquo;", "prose": "<p>The ATT&amp;CK description warns that adversaries may use a specific behaviour to make their registry entries look legitimate — for example by copying the naming style of real components.<\/p>"}, "prompt": "What is this behaviour called?", "hint": "It is the ATT&amp;CK tactic about pretending to be something normal. Its name starts with M.", "exp": "<p>It is called <b>Masquerading<\/b> (ATT&amp;CK tactic TA0005 family, technique T1036): making malicious things look normal. An attacker may name their component like a browser component or point StubPath at a file with a trustworthy-sounding name. For you the lesson is: a friendly name is not evidence of benign intent — the command and the creator matter more.<\/p>", "study": "Masquerading (T1036) — the art of looking legitimate.", "opts": [{"t": "Masquerading", "ok": true, "why": "Correct. Masquerading is making malicious entries look like legitimate programs."}, {"t": "Exfiltration", "ok": false, "why": "Wrong. Exfiltration is stealing data out of the network — unrelated to naming tricks."}, {"t": "Enumeration", "ok": false, "why": "Wrong. Enumeration is discovering information about a system — not faking legitimacy."}, {"t": "Escalation", "ok": false, "why": "Wrong. Escalation means gaining more rights — the described trick is about appearance, not rights."}]}, {"id": "E-13", "type": "dnd", "extype": "Drag & drop (2 racks)", "scenario": {"summary": "Matrix placement — which tactics does T1547.014 belong to?", "prose": "<p>You are building a mini ATT&amp;CK matrix card for T1547.014. The ATT&amp;CK page lists the tactics for this sub-technique in its header. Sort the four chips.<\/p>"}, "prompt": "Drag each chip to the correct rack.", "hint": "The page lists exactly two tactics for this sub-technique. The other two chips belong to other stages of an attack.", "exp": "<p>The ATT&amp;CK page lists <b>Persistence<\/b> and <b>Privilege Escalation<\/b> as the tactics of T1547.014. Persistence is the main goal; Privilege Escalation can also result, for example when a component planted by an admin executes in another privileged user's session. <b>Initial Access<\/b> (getting in) and <b>Exfiltration<\/b> (stealing data) are different lifecycle stages and do not belong to this technique.<\/p>", "slots": ["Tactics of T1547.014", "Different attack stage — not this technique"], "cap": "rack", "bank": [{"t": "Persistence", "slot": 0, "why": "Persistence is the primary tactic: the command re-runs at logon to keep access."}, {"t": "Privilege Escalation", "slot": 0, "why": "The page also lists Privilege Escalation — execution in another user's (possibly privileged) session."}, {"t": "Initial Access", "slot": 1, "why": "Initial Access is how attackers get in first; planting persistence happens later."}, {"t": "Exfiltration", "slot": 1, "why": "Exfiltration is data theft — a different lifecycle stage entirely."}]}, {"id": "E-14", "type": "fill", "extype": "Fill in the blank (from a log line)", "scenario": {"summary": "Read a registry event — name the value that was set", "prose": "<p>Your EDR shows you one registry event. Answer only from the line.<\/p>", "arts": [{"label": "ARTEFACT 1 — EDR registry event", "kind": "log", "lines": ["2026-05-12 08:55:03  Sysmon EID 13  Registry value set", "  User:        CORP\\jwilson", "  TargetObject: HKLM\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components\\{8B7F2A10-3D5C-4E19-9F62-77A0C4D1E8B3}\\StubPath", "  Details:     cmd.exe /c powershell -w hidden -enc SQBFAFIA"]}]}, "prompt": "Look at the TargetObject in the log line. Type the exact registry <b>value name<\/b> that was set.", "hint": "The value name is the last part of the TargetObject path, after the final backslash.", "exp": "<p>The value name is <b>StubPath<\/b>. The TargetObject ends with <span class='mono'>...\\{GUID}\\StubPath<\/span>: the key is a component (the GUID part) and the value being set is StubPath. When you see that pair — a component GUID plus a StubPath write under the Active Setup tree — you are looking at someone arming a logon command.<\/p>", "text": "The registry value name set in this event is ____.", "blanks": [{"a": ["stubpath"], "disp": "StubPath", "why": "StubPath is the final element of the TargetObject — the value whose data is the logon command."}]}, {"id": "E-15", "type": "terminal", "extype": "Terminal command (guided)", "scenario": {"summary": "Your first inspection command — list the Active Setup components on a lab host", "prose": "<p>You are on a Windows lab host (approved exercise). Use the built-in <span class='mono'>reg<\/span> tool. It asks the Windows registry for information. You want to list the Active Setup components stored under HKLM. Type the command in the terminal and press Run, then press Check to grade it.<\/p>"}, "prompt": "In the terminal, list the Active Setup components by querying their registry key.", "hint": "You are told the tool (reg query) and the exact key path — type them as shown in the syntax reminder.", "exp": "<p><span class='mono'>reg query<\/span> reads a registry key and prints its sub-keys and values. Reading is always safe: it changes nothing. With this one command you can already review every component and eyeball each StubPath value for something odd.<\/p>", "study": "reg query is the read-only registry tool — your safest first step in any registry investigation.", "shell": {"caption": "cmd.exe — lab host WS-114 (simulation)", "banner": "Microsoft Windows [Version 10,0,19045,3803]\n(c) simulation only — no real command runs here", "prompt": "C:\\Users\\student>", "panelHtml": "<code class='cm'>Command shape:<\/code><code>reg query \"&lt;key path&gt;\"<\/code><code class='cm'>reg query asks the registry to print a key and its values.<\/code><code class='cm'>Example on a different key:<\/code><code>reg query \"HKCU\\Control Panel\\Desktop\"<\/code><code class='cm'>Expected output shape for your task:<\/code><code>HKEY_LOCAL_MACHINE\\SOFTWARE\\...\\Installed Components\\{GUID}<\/code><code>    StubPath    REG_SZ    &lt;command line&gt;<\/code>", "elements": [{"label": "Uses the read-only tool: reg query", "re": "^\\s*reg\\s+query\\b", "why": "reg query reads registry information without changing anything."}, {"label": "Targets the Active Setup key under HKLM", "re": "hklm(\\\\|/)software(\\\\|/)microsoft(\\\\|/)active\\s+setup(\\\\|/)installed\\s+components", "why": "The component list lives at HKLM\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components."}], "danger": [{"re": "reg\\s+(add|delete|copy|restore|save|load|unload)|(^|\\s)(del|erase|rd|rmdir|format)\\s", "label": "state-changing command"}], "dangerNote": "You typed a command that would change or destroy registry data. Inspection must be read-only — a write command on a live host can destroy evidence and alert the attacker.", "out": "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components\n    {A9C1D4E2-51B7-4C38-9E0F-2D6A83B7C451}    StubPath    REG_SZ    msiexec /Fpums {90160000-0011-0000-0000-0000000FF1CE} /Qn\n    {C4D9F0A7-2E61-4B05-8A33-9C1E5F70B2D8}    StubPath    REG_SZ    cmd.exe /c powershell -w hidden -enc SQBFAFIA\nEnd of key list.", "canonical": "reg query \"HKLM\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components\"", "explain": ["<b>reg query<\/b> — the read-only registry tool; it prints a key's values and sub-keys.", "<b>\"HKLM\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components\"<\/b> — the key that holds every Active Setup component for the machine."]}}], "intro": {"title": "T1547.014 — EASY practice exam", "learn": "<p>You will learn <b>T1547.014 &mdash; Boot or Logon Autostart Execution: Active Setup<\/b>. This is a <b>sub-technique<\/b> in the MITRE ATT&amp;CK framework. ATT&amp;CK is a shared catalogue that describes what real attackers do. A sub-technique is one specific way to do a bigger job. Here the bigger job (the parent technique T1547) is <b>starting programs automatically<\/b> when a computer boots or when a user logs on. Active Setup is one Windows way to do that.<\/p><p>So what is Active Setup? It is a normal Windows feature. Windows keeps a list of small setup components under a registry key called <span class='mono'>Installed Components<\/span>. Each component can hold a command in its <span class='mono'>StubPath<\/span> value. When a user logs in, Windows runs that command for the user &mdash; normally once per user. An attacker with admin rights can add their own component. Then their program starts at logon, again and again, and it survives reboots. They can also give it a friendly name so it looks legitimate (this trick is called Masquerading).<\/p><p>You will meet this object in many real jobs. A <b>SOC analyst<\/b> sees an alert that says &ldquo;new Active Setup component created&rdquo; and must decide if it is a real threat. A <b>threat hunter<\/b> searches all computers for odd StubPath values. An <b>incident responder<\/b> removes the bad key and checks which users already ran it. A <b>detection engineer<\/b> writes the SIEM rule that watches this registry path. A <b>red teamer<\/b> may use the same behaviour in an authorised test. A <b>CTI analyst<\/b> reports incidents using the ID T1547.014 so everyone speaks the same language. The tools around it are simple: registry tools like <span class='mono'>reg query<\/span>, Sysmon or EDR logs, and your SIEM.<\/p><p>By the end of this exam you will know what StubPath is, where the key lives, when the command runs, and what a first simple response looks like. That is the foundation for the harder levels.<\/p>", "themes": [{"name": "Mechanism &amp; Registry Anatomy", "items": ["Active Setup purpose", "Installed Components key", "StubPath value", "HKLM hive (machine part)", "Runs after user logon", "Once per user"]}, {"name": "Tactics &amp; Attack Lifecycle Position", "items": ["Persistence tactic", "Privilege Escalation tactic", "Parent technique T1547", "Survives reboots"]}, {"name": "Adversary Behaviour &amp; Context", "items": ["Admin rights needed to plant", "Runs as the logged-on user", "Masquerading as legitimate programs", "Windows platform"]}, {"name": "Detection &amp; Response Basics", "items": ["Registry monitoring (Sysmon EID 13)", "First step: read the StubPath command", "Real example: PoisonIvy (S0012)"]}], "how": "<ul class='how-list'><li><span class='ic ic-ok'>&#10003;<\/span><span><b>Goal:<\/b> reach at least <b>70%<\/b>. The score comes only from the exercises you actually answer. Skipped-and-never-answered exercises are excluded, not counted as wrong.<\/span><\/li><li><span class='ic ic-part'>&#10003;<\/span><span><b>Exercise types in this file:<\/b> multiple choice, drag &amp; drop, matching, fill in the blank, timeline ordering, SOC alert triage, and one guided terminal command with a syntax reminder panel.<\/span><\/li><li><span class='ic ic-pause'>&#9208;<\/span><span><b>Timer:<\/b> a 25:00 countdown runs while you work. <b>Pause<\/b> is a manual break &mdash; it hides the exercise and stops the clock. Pressing <b>Check<\/b> also stops the clock automatically (&ldquo;reviewing feedback&rdquo; pause) so you can read the explanation without pressure; it resumes only when you press <b>Next<\/b>.<\/span><\/li><li><span class='ic ic-part'>&#10003;<\/span><span><b>Partial credit:<\/b> exercises with several items give part of the point per correct item, but wrong items cancel correct ones: credit = max(0, (H &minus; W) / N).<\/span><\/li><li><span class='ic ic-miss'>&#9888;<\/span><span><b>Skips:<\/b> every exercise has a Skip button. Before you can finish, a review screen lists skipped exercises so you can go back. <b>Hint:<\/b> one per exercise, costs 10% of that exercise's credit.<\/span><\/li><li><span class='ic'>&#8635;<\/span><spa /* ---------------- small utilities ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function shuffle(a){
  var r=a.slice();
  for(var i=r.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=r[i]; r[i]=r[j]; r[j]=t;
  }
  return r;
}
function norm(s){ return String(s).replace(/\s+/g,' ').trim().toLowerCase(); }
function el(tag,cls,html){
  var e=document.createElement(tag);
  if(cls) e.className=cls;
  if(html!==undefined) e.innerHTML=html;
  return e;
}
/* Mandatory scoring formula: credit = max(0,(H-W)/N) */
function scoreExercise(H,W,N){ return Math.max(0,(H-W)/N); }
function fmtClock(ms){
  var s=Math.max(0,Math.floor(ms/1000));
  var m=Math.floor(s/60); s=s%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function fmt1(x){ return (Math.round(x*10)/10).toFixed(1); }
/* Motion helper: honour prefers-reduced-motion for JS-driven scrolling too */
function reducedMotion(){
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}
function scrollToTop(){
  try{ window.scrollTo({top:0,behavior:reducedMotion()?'auto':'smooth'}); }
  catch(e){ window.scrollTo(0,0); }
}
function scrollNearest(elm){
  if(!elm) return;
  try{ elm.scrollIntoView({behavior:reducedMotion()?'auto':'smooth',block:'nearest'}); }
  catch(e){ /* older browsers: no-op */ }
}

/* ---------------- toast ---------------- */
var toastT=null;
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.remove('hidden');
  if(toastT) clearTimeout(toastT);
  toastT=setTimeout(function(){ t.classList.add('hidden'); },2200);
}

/* ---------------- timer state machine ----------------
   States: IDLE -> RUNNING <-> PAUSED_MANUAL / PAUSED_AUTO_CHECK -> ENDED
   Check sets PAUSED_AUTO_CHECK BEFORE feedback is rendered.
   Next / Final Submit / Return-to-review resume the clock.        */
var Timer={
  state:'IDLE', remain:0, iv:null, last:0, mark:0,
  manualMs:0, feedbackMs:0, fromAuto:false,
  begin:function(sec){
    this.remain=sec*1000; this.state='RUNNING'; this.last=Date.now();
    this.manualMs=0; this.feedbackMs=0; this.fromAuto=false;
    if(this.iv) clearInterval(this.iv);
    this.iv=setInterval(function(){ Timer.tick(); },250);
    this.render();
  },
  tick:function(){
    var now=Date.now(), dt=now-this.last; this.last=now;
    if(this.state!=='RUNNING') return;
    this.remain-=dt;
    if(this.remain<=0){ this.remain=0; this.render(); this.end(); return; }
    this.render();
  },
  render:function(){
    var c=$('timerChip');
    if(!c) return;
    var t=fmtClock(this.remain);
    var txt='', cls='chipstat';
    if(this.state==='RUNNING'){ txt='<span class="ic">&#9654;</span> RUNNING <span class="mono">'+t+'</span>'; }
    else if(this.state==='PAUSED_MANUAL'){ cls+=' ts-paused'; txt='<span class="ic">&#9208;</span> PAUSED &mdash; manual (press Resume) <span class="mono">'+t+'</span>'; }
    else if(this.state==='PAUSED_AUTO_CHECK'){ cls+=' ts-paused'; txt='<span class="ic">&#9208;</span> PAUSED &mdash; reviewing feedback (resumes on Next) <span class="mono">'+t+'</span>'; }
    else if(this.state==='ENDED'){ cls+=' ts-ended'; txt='<span class="ic">&#9632;</span> ENDED <span class="mono">'+t+'</span>'; }
    else { txt='<span class="ic">&#9679;</span> READY <span class="mono">'+t+'</span>'; }
    c.className=cls; c.innerHTML=txt;
  },
  pauseManual:function(){
    if(this.state!=='RUNNING' && this.state!=='PAUSED_AUTO_CHECK') return;
    this.fromAuto=(this.state==='PAUSED_AUTO_CHECK');
    this.mark=Date.now(); this.state='PAUSED_MANUAL';
    if(this.iv){ clearInterval(this.iv); this.iv=null; }
    this.render();
  },
  resumeManual:function(){
    if(this.state!=='PAUSED_MANUAL') return;
    this.manualMs+=Date.now()-this.mark;
    if(this.fromAuto){ this.fromAuto=false; this.state='PAUSED_AUTO_CHECK'; }
    else{ this.state='RUNNING'; this.last=Date.now(); if(this.iv)clearInterval(this.iv); this.iv=setInterval(function(){ Timer.tick(); },250); }
    this.render();
  },
  pauseAuto:function(){
    if(this.state==='RUNNING'){ this.mark=Date.now(); this.state='PAUSED_AUTO_CHECK'; }
    if(this.iv){ clearInterval(this.iv); this.iv=null; }
    this.render();
  },
  resumeFromAuto:function(){
    if(this.state!=='PAUSED_AUTO_CHECK') return;
    this.feedbackMs+=Date.now()-this.mark;
    this.state='RUNNING'; this.last=Date.now();
    if(this.iv) clearInterval(this.iv);
    this.iv=setInterval(function(){ Timer.tick(); },250);
    this.render();
  },
  end:function(silent){
    if(this.state==='ENDED') return;
    this.state='ENDED';
    if(this.iv){ clearInterval(this.iv); this.iv=null; }
    this.render();
    if(silent!==true && typeof App!=='undefined' && App.finishByTimeout) App.finishByTimeout();
  }
};

/* ---------------- app state ---------------- */
var App={
  order:[], status:{}, credits:{}, hintUsed:{},
  curIdx:-1, visited:0, reported:false, reviewing:false, lockInputs:false,
  attempt:0, answers:{},

  exById:function(i){ return PAYLOAD.exercises[i]; },
  isTerm:function(ex){ return ex && ex.type==='terminal'; },
  buildOrder:function(){
    var n=PAYLOAD.exercises.length, idxs=[], i, tries=0, ord, bad, j;
    for(i=0;i<n;i++) idxs.push(i);
    for(;;){
      ord=shuffle(idxs); tries++; bad=false;
      for(j=1;j<ord.length;j++){
        if(this.isTerm(this.exById(ord[j])) && this.isTerm(this.exById(ord[j-1]))){ bad=true; break; }
      }
      if(!bad || tries>80) break;
    }
    return ord;
  },
  reset:function(){
    this.status={}; this.credits={}; this.hintUsed={}; this.answers={};
    this.curIdx=-1; this.visited=0; this.reported=false; this.reviewing=false; this.lockInputs=false;
    this.finishing=false; this.attempt++;
    this.order=this.buildOrder();
    for(var i=0;i<this.order.length;i++){ this.status[this.order[i]]='pending'; }
  },
  start:function(){
    this.reset();
    $('intro').classList.add('hidden');
    $('hdr').classList.remove('hidden');
    $('progressWrap').classList.remove('hidden');
    $('exam').classList.remove('hidden');
    Timer.begin(PAYLOAD.budgetSec);
    this.showNext();
  },
  nextPending:function(){
    for(var i=0;i<this.order.length;i++){
      if(this.status[this.order[i]]==='pending') return i;
    }
    return -1;
  },
  skippedIdxs:function(){
    var out=[],i;
    for(i=0;i<this.order.length;i++){ if(this.status[this.order[i]]==='skipped') out.push(this.order[i]); }
    return out;
  },
  pendingCount:function(){ return this.nextPending()===-1 ? 0 : 1; },
  answeredCount:function(){
    var c=0;
    for(var k in this.status){ if(this.status[k]==='answered') c++; }
    return c;
  },
  creditSum:function(){
    var s=0;
    for(var k in this.credits){ s+=this.credits[k]; }
    return s;
  },
  anySkipped:function(){ return this.skippedIdxs().length>0; },
  showNext:function(){
    this.reviewing=false;
    var i=this.nextPending();
    if(i<0){
      if(this.anySkipped()) this.showReview();
      else finishExam(false);
      return;
    }
    renderExercise(i);
  },
  progress:function(){
    var n=PAYLOAD.exercises.length;
    $('progressBar').style.width=Math.round(100*this.visited/Math.max(1,n))+'%';
  },
  updateScoreChip:function(){
    var a=this.answeredCount(), s=this.creditSum();
    var pct=a>0?Math.round(100*s/a):0;
    $('scoreChip').innerHTML='<span class="lbl">Score</span> <span class="score-sum mono">'+fmt1(s)+'</span><span class="mono"> / '+a+'</span> <span class="mono">('+pct+'%)</span>';
  }
};

/* ---------------- site handshake (STEP 6.3) ----------------
   Accepts CYBERPULSE_INIT / CYBERMASTERY_INIT. The theme field is
   always 'dark'; this file is dark-only, so appearance never changes. */
window.addEventListener('message',function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  try{
    if(event.data.username){
      var chip=$('whoChip');
      chip.classList.remove('hidden');
      chip.innerHTML='<span class="lbl">Analyst</span> '+esc(event.data.username);
    }
  }catch(e){ /* handshake is optional */ }
});

/* ---------------- score report (STEP 6.2) ---------------- */
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0 ? Math.round((creditSum/answeredCount)*100) : 0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:META.topicId,
      batch:META.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=70
    },location.origin);
  }catch(e){
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}
