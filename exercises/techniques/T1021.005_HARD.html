<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1021.005 VNC — HARD</title>
<style>
:root{
  --bg-page:#070c12;
  --bg-panel:#0d141d;
  --bg-surface:#111a26;
  --bg-surface-2:#0a111a;
  --bg-elev:#172335;
  --ink:#e9eff7;
  --ink-dim:#a9b9cb;
  --ink-faint:#8497ab;
  --line:#1f2b3c;
  --line-soft:#182331;
  --blue:#4aa8e8;   --blue-soft:rgba(74,168,232,.13);
  --amber:#e6aa3c;  --amber-soft:rgba(230,170,60,.13);
  --green:#41c07f;  --green-soft:rgba(65,192,127,.13);
  --red:#ef5a6a;    --red-soft:rgba(239,90,106,.15);
  --sev-easy:#41c07f;
  --sev-medium:#e6aa3c;
  --sev-hard:#f0813c;
  --sev-extreme:#ef5a6a;
  --focus:#4aa8e8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1 0 auto;width:100%;max-width:980px;margin:0 auto;padding:20px 16px 40px}
.foot{flex-shrink:0;margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:12.5px;background:var(--bg-panel)}
.foot b{color:var(--ink-dim);letter-spacing:.08em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-surface-2)}
::-webkit-scrollbar-thumb{background:#24344b;border-radius:6px;border:2px solid var(--bg-surface-2)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(8,13,20,.94);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.14em;font-size:12.5px;color:var(--green)}
.brand small{color:var(--ink-faint);letter-spacing:.05em;font-weight:600}
.tb-sep{width:1px;height:22px;background:var(--line)}
.tb-title{font-weight:700;font-size:13.5px;color:var(--ink-dim);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stat{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;font-weight:600;background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:32px}
.tb-stat .ic{font-size:13px}
.tb-stat.timer{font-family:var(--mono);color:var(--ink)}
.tb-state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px;border:1px solid}
.tb-state.manual{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.tb-state.autocheck{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.tb-btn:hover:not(:disabled){border-color:var(--blue)}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}
.tb-btn.hint{color:var(--amber)}
.tb-btn.skip{color:var(--ink-dim)}
.prog{height:3px;background:var(--line-soft)}
.prog i{display:block;height:100%;background:var(--green);width:0%;transition:width .25s}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 12px;color:#08110b}
.badge::before{content:"●";font-size:9px}
.sev-EASY{background:var(--sev-easy)}
.sev-MEDIUM{background:var(--sev-medium)}
.sev-HARD{background:var(--sev-hard)}
.sev-EXTREMELY_HARD{background:var(--sev-extreme);color:#160407}
.otype{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg-surface)}
/* ---------- intro ---------- */
.intro-head{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--bg-panel),var(--bg-surface-2));padding:26px 26px 20px;margin-bottom:16px}
.intro-head h1{margin:8px 0 4px;font-size:26px;line-height:1.25}
.intro-head .sub{color:var(--ink-dim);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-dim);background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:34px}
.chip .ic{color:var(--ink-faint)}
.cand{margin-top:12px;font-size:13px;color:var(--ink-faint)}
.intro-sec{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;background:var(--bg-panel);padding:18px 22px;margin-bottom:14px}
.intro-sec.learn{border-left-color:var(--blue)}
.intro-sec.keys{border-left-color:var(--amber)}
.intro-sec.how{border-left-color:var(--green)}
.intro-sec h2{margin:0 0 10px;font-size:15px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.intro-sec.learn p{color:var(--ink-dim);margin:0 0 10px}
.intro-sec.learn p:last-child{margin-bottom:0}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kw-card{background:var(--bg-surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 14px}
.kw-card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.kw-card ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:13.5px}
.kw-card li{margin:2px 0}
.rules{margin:0;padding:0;list-style:none}
.rules li{position:relative;padding:7px 0 7px 26px;color:var(--ink-dim);font-size:14px}
.rules li::before{content:"▸";position:absolute;left:4px;color:var(--green)}
.rules li .dim{color:var(--ink-faint)}
/* ---------- exercise card ---------- */
.excard{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--bg-panel);border:1px solid var(--line);border-left:4px solid var(--blk,var(--blue));border-radius:12px;padding:16px 20px}
.blk-scenario{--blk:var(--blue)}
.blk-question{--blk:var(--amber)}
.blk-answer{--blk:var(--green)}
.blk-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--blk,var(--ink));margin-bottom:10px}
.blk-label .dot{width:8px;height:8px;border-radius:50%;background:var(--blk,var(--ink))}
.ex-title{margin:0 0 8px;font-size:16.5px}
.summary{color:var(--ink-faint);font-size:13.5px;font-style:italic;margin:0 0 8px}
.showfull{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;min-height:32px}
.scen-body p{margin:0 0 10px;color:var(--ink-dim)}
.scen-body p:last-child{margin-bottom:0}
details.artef{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin:10px 0 0}
details.artef summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--blue);user-select:none;min-height:40px;display:flex;align-items:center}
details.artef .artbody{padding:0 14px 12px}
.mono{font-family:var(--mono);font-size:13px;line-height:1.5;color:#c8d8e6;background:var(--bg-surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:0}
table.attable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:0}
table.attable th{background:var(--bg-elev);color:var(--ink);text-align:left}
table.attable th,table.attable td{border:1px solid var(--line-soft);padding:6px 10px;color:var(--ink-dim)}
.q-text{margin:0;font-weight:700;font-size:16px;color:var(--ink)}
/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-height:44px;cursor:pointer;color:var(--ink);font-size:14.5px;font-family:var(--sans);margin:0 0 8px}
.opt:last-child{margin-bottom:0}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}
.opt .mark{font-weight:800;flex-shrink:0}
/* ---------- match ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol h4,.obank h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mleft{flex:1;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;min-height:44px;display:flex;align-items:center}
.mzone{flex:1;background:var(--bg-surface-2);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;min-height:44px;color:var(--ink-faint);font-size:13.5px;cursor:pointer;text-align:left;font-family:var(--sans)}
.mzone.filled{border-style:solid;border-color:var(--blue);color:var(--ink)}
.mzone.dragover{border-color:var(--green)}
.mzone.correct{border-color:var(--green);background:var(--green-soft)}
.mzone.wrong{border-color:var(--red);background:var(--red-soft)}
.mbank{display:flex;flex-direction:column}
.mchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;margin-bottom:8px;cursor:grab;color:var(--ink);font-size:13.5px;text-align:left;font-family:var(--sans)}
.mchip:disabled{cursor:default;opacity:.5}
.mchip.selchip{border-color:var(--amber);background:var(--amber-soft)}
.mchip.used{opacity:.35}
.mhintline{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- order ---------- */
.ordlist{list-style:none;margin:0;padding:0;counter-reset:ord}
.orditem{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.orditem.dragover{border-color:var(--green)}
.orditem .num{font-family:var(--mono);color:var(--amber);font-weight:700;min-width:22px;text-align:center}
.orditem .txt{flex:1;font-size:14px}
.orditem.correct{border-color:var(--green)}
.orditem.wrong{border-color:var(--red)}
.ordbtns{display:flex;gap:4px}
.ordbtns button{min-width:34px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);cursor:pointer;font-size:14px}
.ordbtns button:hover{border-color:var(--blue)}
/* ---------- fill ---------- */
.fillwrap{font-size:15.5px;color:var(--ink-dim);line-height:2.1;white-space:pre-wrap}
.fillin{font-family:var(--mono);font-size:13.5px;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 10px;min-height:38px;width:170px;margin:0 3px}
.fillin:focus{border-color:var(--blue);outline:none}
.fillin.correct{border-color:var(--green)}
.fillin.wrong{border-color:var(--red)}
.fbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:38px;font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer}
.fchip:hover{border-color:var(--amber)}
/* ---------- terminal ---------- */
.term{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:8px;background:var(--bg-elev);padding:8px 12px;font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.term-bar .dots{letter-spacing:3px;color:var(--red)}
.term-out{font-family:var(--mono);font-size:13px;line-height:1.55;color:#c8d8e6;padding:12px 14px;min-height:130px;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term-out .tl-dim{color:var(--ink-faint)}
.term-out .tl-danger{color:var(--red);font-weight:700}
.term-out .tl-echo{color:var(--ink)}
.term-line{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding:10px 14px}
.term-prompt{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--mono);font-size:13px;min-height:34px}
.term-in:focus{outline:none}
details.syntax{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin-top:10px}
details.syntax summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--amber);min-height:40px;display:flex;align-items:center}
details.syntax .artbody{padding:0 14px 12px}
/* ---------- logview ---------- */
.logpanel{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log-tools{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-elev);border-bottom:1px solid var(--line-soft)}
.logfilter{flex:1;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 12px;min-height:38px}
.logfilter:focus{border-color:var(--blue);outline:none}
.log-count{font-size:12px;color:var(--ink-faint);font-family:var(--mono);white-space:nowrap}
.loglines{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#bccfe0;padding:12px 14px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.loglines mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}
.wtitle{font-weight:700;margin:14px 0 10px;color:var(--ink)}
/* ---------- decision ---------- */
.dstep{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.dstep.locked{opacity:.9}
.dlabel{display:inline-flex;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue);border-radius:6px;padding:3px 9px;margin-bottom:8px}
.dprompt{font-family:var(--mono);font-size:13px;color:var(--ink-dim);background:var(--bg-surface-2);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 10px;white-space:pre-wrap}
.dq{font-weight:700;margin:0 0 10px}
.drecorded{color:var(--ink-faint);font-size:13px;margin-top:8px}
.dwhy{font-size:13.5px;color:var(--ink-dim);background:var(--bg-surface-2);border-radius:8px;padding:9px 12px;margin-top:8px}
/* ---------- hint ---------- */
.hintbox{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin-top:12px;color:var(--ink-dim)}
.hintbox .hb{color:var(--amber);font-weight:800;font-size:12px;letter-spacing:.1em;display:block;margin-bottom:4px}
.penaltynote{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- feedback ---------- */
.fb{border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.fb.ok{border-color:var(--green)}
.fb.bad{border-color:var(--red)}
.fb.part{border-color:var(--amber)}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 18px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb.ok .fb-head{background:var(--green-soft);color:var(--green)}
.fb.bad .fb-head{background:var(--red-soft);color:var(--red)}
.fb.part .fb-head{background:var(--amber-soft);color:var(--amber)}
.fb-credit{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim);font-weight:600}
.fb-body{padding:14px 18px;background:var(--bg-panel)}
.fi{display:flex;gap:9px;padding:4px 0;font-size:14px;color:var(--ink-dim)}
.fi .ic{flex-shrink:0;font-weight:800}
.fi.ok .ic{color:var(--green)}
.fi.bad .ic{color:var(--red)}
.fi.miss .ic{color:var(--ink-faint)}
.fi.warn .ic{color:var(--red)}
.fi.warn{color:var(--red);font-weight:600}
.fi.note{color:var(--ink-faint)}
.fb-explain{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:12px;color:var(--ink-dim);font-size:14px}
.fb-explain p{margin:0 0 10px}
.fb-explain p:last-child{margin-bottom:0}
.fb-study{margin-top:10px;font-size:13px;color:var(--blue)}
.fb .mono{margin-top:10px}
/* ---------- actions ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:10px 20px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-family:var(--sans)}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:transparent;color:#04120a}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-amber{background:var(--amber);border-color:transparent;color:#1c1204}
.ghost-note{color:var(--ink-faint);font-size:13px}
/* ---------- review ---------- */
.revlist{display:flex;flex-direction:column;gap:10px}
.revrow{display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex-wrap:wrap}
.revrow .rn{font-family:var(--mono);color:var(--amber);font-weight:700}
.revrow .rt{flex:1;color:var(--ink-dim);font-size:14px;min-width:200px}
.revrow .badge-skip{color:var(--ink-faint);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* ---------- results ---------- */
.res-head{border:1px solid var(--line);border-radius:14px;background:var(--bg-panel);padding:26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ring{width:172px;height:172px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--pct)*1%),var(--bg-elev) 0);display:grid;place-items:center;flex-shrink:0}
.ring .rin{width:134px;height:134px;border-radius:50%;background:var(--bg-panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:34px;font-weight:800;font-family:var(--mono)}
.ring .of{font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
.res-verdict{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.res-verdict.pass{color:var(--green)}
.res-verdict.fail{color:var(--red)}
.res-sub{color:var(--ink-dim);font-size:14px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.statcard{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.statcard .sv{font-size:22px;font-weight:800;font-family:var(--mono)}
.statcard .sv.ok{color:var(--green)}
.statcard .sv.part{color:var(--amber)}
.statcard .sv.bad{color:var(--red)}
.statcard .sv.skip{color:var(--ink-faint)}
.statcard .sl{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.pausereport{border:1px solid var(--line);border-radius:10px;background:var(--bg-panel);padding:12px 16px;color:var(--ink-dim);font-size:13.5px;margin-bottom:14px}
.restable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.restable th{background:var(--bg-elev);text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase}
.restable td{padding:8px 12px;border-top:1px solid var(--line-soft);color:var(--ink-dim)}
.restable td.num{font-family:var(--mono)}
.st-ok{color:var(--green);font-weight:700}
.st-part{color:var(--amber);font-weight:700}
.st-bad{color:var(--red);font-weight:700}
.st-skip{color:var(--ink-faint);font-weight:700}
/* ---------- overlay ---------- */

<script type="application/json" id="cm-exercise-meta">{"attackId":"T1021.005","attackName":"VNC","objectType":"sub-technique","severity":"HARD","topicId":"t1021.005","batch":3,"title":"T1021.005 VNC — HARD","difficulty":"hard","estimatedMinutes":45,"timerMinutes":45,"questionCount":16,"passMark":70,"learn":["T1021.005 is a sub-technique of T1021 Remote Services in the Lateral Movement tactic. This batch goes deeper: VNC authentication weaknesses, reverse connections, and the hardening that stops them.","Classic VNC authentication caps passwords at eight characters and protects them with an old DES challenge-response. Some servers run with SecurityTypes None and ask no password at all. Public reporting documents attackers brute-forcing exactly these setups before taking over the logged-in user's desktop.","You will weigh evidence like an analyst: helpdesk shadowing that looks alarming but is scheduled and ticketed, and an extra listener that looks boring but is genuinely new. Judgement, not port lists, is the skill this batch trains.","Hardening follows a pattern: put VNC behind a VPN or tunnel, force strong authentication with TLS, hand out view-only passwords where full control is not needed, block direct 5900, and remove VNC where nobody uses it.","Incident responders, threat hunters and GRC reviewers all use these skills: responders to size the breach, hunters to find weak auth modes, and GRC to write the rules. You practise all three views in this exam."],"keywords":[{"theme":"Authentication Weaknesses","items":["Eight-character password ceiling","Legacy DES challenge-response key","SecurityTypes None exposure","One shared VNC password across hosts"]},{"theme":"Direction, Tunnels & Exposure","items":["Reverse VNC viewer listening on 5500","Server connects outbound through firewalls","Direct 5900 exposure from outside","TLS-wrapped VNC sessions"]},{"theme":"Hardening & Response","items":["VPN or jump-host front door","View-only delegation for observers","Blocking direct 5900 and removing unused VNC","ultravnc.ini and ~/.vnc artefact review"]}]}</script>

var META = {"attackId":"T1021.005","attackName":"VNC","objectType":"sub-technique","severity":"HARD","topicId":"t1021.005","batch":3,"title":"T1021.005 VNC — HARD","difficulty":"hard","estimatedMinutes":45,"timerMinutes":45,"questionCount":16,"passMark":70,"learn":["T1021.005 is a sub-technique of T1021 Remote Services in the Lateral Movement tactic. This batch goes deeper: VNC authentication weaknesses, reverse connections, and the hardening that stops them.","Classic VNC authentication caps passwords at eight characters and protects them with an old DES challenge-response. Some servers run with SecurityTypes None and ask no password at all. Public reporting documents attackers brute-forcing exactly these setups before taking over the logged-in user's desktop.","You will weigh evidence like an analyst: helpdesk shadowing that looks alarming but is scheduled and ticketed, and an extra listener that looks boring but is genuinely new. Judgement, not port lists, is the skill this batch trains.","Hardening follows a pattern: put VNC behind a VPN or tunnel, force strong authentication with TLS, hand out view-only passwords where full control is not needed, block direct 5900, and remove VNC where nobody uses it.","Incident responders, threat hunters and GRC reviewers all use these skills: responders to size the breach, hunters to find weak auth modes, and GRC to write the rules. You practise all three views in this exam."],"keywords":[{"theme":"Authentication Weaknesses","items":["Eight-character password ceiling","Legacy DES challenge-response key","SecurityTypes None exposure","One shared VNC password across hosts"]},{"theme":"Direction, Tunnels & Exposure","items":["Reverse VNC viewer listening on 5500","Server connects outbound through firewalls","Direct 5900 exposure from outside","TLS-wrapped VNC sessions"]},{"theme":"Hardening & Response","items":["VPN or jump-host front door","View-only delegation for observers","Blocking direct 5900 and removing unused VNC","ultravnc.ini and ~/.vnc artefact review"]}]};
var EXAMS = [{"id":"e01","type":"mcq","title":"Nightly shadowing that is allowed","summary":"Recognise the sanctioned shadowing job behind an alarming alert.","scenario":"An alert fires every night at 02:00: x11vnc starts on render-nix-02 under the svc-render account and listens on 5901. The queue has marked it 'possible intruder' three nights running. Change record 7120 describes exactly this shadowing job for the render window, and the connections arrive nightly from the VPN range only. You must decide what the evidence actually supports.","question":"Which observation best supports treating this as the sanctioned job?","hint":"Compare the alert with the change record, the account and the source range.","explanation":"The evidence for 'sanctioned' is the match with change record 7120: same command, same account, same nightly schedule, VPN-only sources. The other three options all describe actual red flags — random times, guest accounts, no change record, internet exposure — and none of them is present here.\n\nBenign-looking-alarming is a daily SOC reality: the discriminator is always the change record and the source baseline, never the scariness of the tool name.","study":"Study alert triage against change records and source baselines.","options":["It matches the approved change ticket exactly","It runs at a random time under a guest account","It was installed last night with no change record","It listens on 5900 straight from the internet"],"correct":0},{"id":"e02","type":"logview","title":"Brute force then success","summary":"Read the auth log and complete the incident note.","scenario":"The render-nix-02 VNC log for one night is below. The server runs classic VncAuth on its base display. One address fails repeatedly, then succeeds; the session that follows takes full control of the desktop. A cron line for the render job sits in the same log as noise. Filter the panel and complete the note.","question":"Complete the incident note with the two values from the log:","hint":"One value comes from the listening line; the other from the share line after the success.","explanation":"The listening line names display :0 with VncAuth, and after the success the share line says full control — not view-only, so the intruder could type and click, not just watch. Four attempts failed before the success, and the cron line at 02:00 is unrelated render noise.\n\nA brute-force burst followed by a full-control share is the textbook VNC takeover shape.","study":"Study VNC auth logs: failed bursts, then success, then the share mode.","filterable":true,"log":{"header":["time","entry"],"lines":["01:12:04  Xvnc[511]: listening on :0, SecurityTypes VncAuth","01:12:40  Xvnc[511]: connection from 10[.]198[.]7[.]61","01:12:41  Xvnc[511]: SConnection: auth failed (attempt 1)","01:12:46  Xvnc[511]: SConnection: auth failed (attempt 2)","01:12:52  Xvnc[511]: SConnection: auth failed (attempt 3)","01:13:30  Xvnc[511]: SConnection: auth failed (attempt 4)","01:19:02  Xvnc[511]: SConnection: auth succeeded","01:19:05  Xvnc[511]: desktop share started (full control)","01:47:33  Xvnc[511]: client gone","02:00:00  cron[881]: render job started by svc-render"]},"widget":{"type":"fill","question":"Complete the incident note with the two values from the log:","text":"The server ran classic VncAuth on display ___ and the successful session took ___ of the desktop.","blanks":[":0","full control"],"bank":[":0","full control",":1","view-only"]}},{"id":"e03","type":"match","title":"Authentication modes and risk","summary":"Match each VNC authentication mode to its risk.","scenario":"The audit found five VNC configurations across the estate. Before the risk workshop, each mode must carry its honest one-line risk so the owners argue about facts instead of brand names. Two modes are acceptable, two are weak, and one is wide open — the workshop will thank you for the precision.","question":"Match each VNC authentication mode to its honest risk:","hint":"None asks nothing; classic caps the password at eight characters.","explanation":"SecurityTypes None requests no password at all — the worst case. Classic VncAuth caps at eight characters with legacy DES — weak but not open. TLS+VncAuth wraps the same password inside TLS so captured traffic no longer helps. UnixAuth reuses system accounts, and MSLogon checks against Active Directory — both inherit stronger policies.\n\nThe mode decides how the brute-force story in the logs can even happen.","study":"Study VNC SecurityTypes: None, VncAuth, TLS+VncAuth, UnixAuth, MSLogon.","pairs":[{"left":"SecurityTypes None","right":"No password is requested at all"},{"left":"Classic VncAuth","right":"Eight-character ceiling with legacy DES"},{"left":"TLS+VncAuth","right":"Password exchange wrapped in TLS"},{"left":"UnixAuth","right":"Reuses the system's account credentials"},{"left":"MSLogon","right":"UltraVNC logon against Active Directory"}]},{"id":"e04","type":"order","title":"Weak-auth takeover chain","summary":"Order the attacker chain against classic VNC auth.","scenario":"Public reporting documents a repeating chain against VNC servers that still use classic authentication: the eight-character ceiling and the legacy DES key do the heavy lifting for the attacker. The chain has five moves, from finding the door to working inside the network with the victim's own access. Rebuild it in order.","question":"Arrange the takeover chain in the order the attacker performs it:","hint":"Fingerprinting comes before guessing; pivoting comes after control.","explanation":"Scanning finds the doors, fingerprinting confirms which weak lock is behind them, the eight-character ceiling makes brute force cheap, the takeover gives hands on the keyboard, and the pivot reuses everything the logged-in user could reach.\n\nAttacker view: the chain works because classic auth caps the password at eight characters and the DES challenge-response cracks fast offline — one short password stands between the outside and a full desktop.","study":"Study why the eight-character ceiling makes VNC brute force practical.","items":["Scan the office range for open VNC display ports","Fingerprint the server and confirm classic VncAuth","Brute force the eight-character password ceiling","Connect and take full control of the logged-in session","Pivot onward using the victim's own access"]},{"id":"e05","type":"fill","title":"Hardening sentence","summary":"Complete the hardening sentence for the VNC standard.","scenario":"The studio's hardening standard gets one sentence that must hold the three pillars agreed with GRC: hide the port behind a front door, encrypt the session, and limit bystanders to watching. The bank holds six words; exactly three fit, and three are decoys from other eras of security.","question":"Complete the hardening standard with the three terms from the bank:","hint":"The front door is three letters; observers get the restricted password mode.","explanation":"The VPN hides 5900 from direct reach, TLS encrypts the session, and view-only passwords let observers watch without touching anything. WEP is a broken Wi-Fi cipher, SSLv3 is a dead protocol, and full-control is exactly what bystanders should not get.\n\nThese three pillars cover most of the VNC hardening guidance you will meet in audits.","study":"Study VNC hardening: front doors, TLS wrapping, view-only delegation.","text":"Front every VNC server with the ___ so 5900 is never reachable directly, wrap the session in ___ for confidentiality, and hand observers a ___ password when they only need to watch.","blanks":["VPN","TLS","view-only"],"bank":["VPN","TLS","view-only","WEP","SSLv3","full-control"]},{"id":"e06","type":"terminal","title":"Read the shadowing command line","summary":"Show the full command line of x11vnc on the host.","scenario":"render-nix-02 flags an x11vnc process that survived a reboot. You are the responder on the host and must display the full command line of every x11vnc process before you decide anything. The simulator knows the lab toolset, and the processes must keep running while you read them.","question":"Run the command that shows the full command line of any x11vnc process:","hint":"ps with the full flag bundle, piped through grep, keeps only the x11vnc lines.","explanation":"ps aux snapshots every process with full arguments and grep x11vnc keeps the relevant lines. The output is the finding: one x11vnc runs with -nopw — no password at all — while a second runs view-only. That contrast decides the response, and none of it required touching a process.\n\nThe forbidden commands kill, killall and pkill would destroy the live session; capture first, decide later.","study":"Study x11vnc flags: -nopw, -viewonly, -forever and what each means for risk.","prompt":"responder@render-nix-02:~$","skill":"vnc-process-forensics","knownTools":["ps","grep","pgrep","ss","cat"],"expected":"ps aux | grep x11vnc","elements":[{"label":"the ps process snapshot","any":["ps aux"]},{"label":"the grep filter for x11vnc","any":["grep x11vnc"]}],"forbidden":[{"any":["kill -9","killall","pkill"],"why":"Killing the shadowing process mid-triage ends the live session and destroys its volatile evidence."}],"output":["root    2412  0.4  1.1 188432 44120 ?  Ssl  02:00  x11vnc -display :0 -rfbport 5901 -forever -nopw","svc_r   2413  0.2  0.8 122048 30120 ?  S    02:00  x11vnc -display :0 -viewonly -rfbport 5902","Two x11vnc processes: one without a password, one view-only."],"syntaxPanel":"ps aux | grep <pattern>\n  ps       process snapshot\n  a        all users\n  u        user-oriented format\n  x        include daemons\n  example on another host: ps aux | grep sshd","sampleOutput":"root  881  0.3  0.9 155000 38200 ? Ssl 01:10 x11vnc -display :1 -rfbport 5902 -forever"},{"id":"e07","type":"mcq","title":"The boring extra listener","summary":"Find the alarming detail hidden in routine helpdesk traffic.","scenario":"helpdesk-ws-12 uses VNC all day and the SOC has tuned itself to ignore it. The quarterly review pulls the quarter's listening sockets: 5900 with helpdesk viewers, plus one Xvnc bound on 5903 with no ticket, no owner and a start date nobody can explain. Everything else matches the baseline exactly.","question":"Which finding deserves the escalation?","hint":"Which finding has no owner and no ticket?","explanation":"The 5903 listener is the escalation: an owned, ticketed port 5900 is the baseline, but a second display nobody claims is exactly how attackers keep a quiet second door. The daily viewer traffic, the history list and the lunchtime pause all match the known baseline.\n\nAlarming-looking-benign works both ways: routine helpdesk noise hides the one detail that is genuinely new, so reviews must diff against the baseline, not against fear.","study":"Study listener baselining: every display port should have an owner and a ticket.","options":["Helpdesk viewers connecting to 5900 all day","An extra Xvnc listener on 5903 with no ticket","The viewer tool keeping its recent-connections list","Support sessions that pause over lunch"],"correct":1},{"id":"e08","type":"decision","title":"Decision tree — nightly shadowing verdict","summary":"Decide how to handle the sanctioned-but-risky shadowing job.","scenario":"Back to render-nix-02: the 02:00 x11vnc job matches change record 7120, but it keeps running after disconnects and anyone on the VPN range could reach 5901. The queue wants a verdict that keeps the render window working without carrying more risk than the ticket ever approved. Work the three steps in order.","question":"Work through the three decision steps for the shadowing job:","hint":"The job is sanctioned; the question is how much risk it may keep.","explanation":"Sanctioned jobs are proven by lineage and records, not by vibes. The residual risk is real — full control and always-on exposure — so hardening keeps the purpose and drops the danger. Recording the baseline plus a matching rule is what makes tomorrow's alert a non-event.\n\nDefender view: a self-resolving rule only exists because someone wrote down exactly what the sanctioned job looks like, flags included.","study":"Study baselining sanctioned remote-control jobs with flag-level rules.","steps":[{"label":"STEP 1 OF 3 — separate sanctioned from hostile","prompt":"Job matches ticket 7120: same account, same schedule, VPN-only sources.","question":"Which fact most cleanly proves the job is the sanctioned one?","options":["The process lineage and schedule match the change record","The tool name contains the letters vnc","It runs during the night when nobody watches","It listens on 5901 instead of 5900"],"correct":0,"why":"Lineage plus schedule matching the record is proof; the other facts are true of countless jobs, hostile ones included."},{"label":"STEP 2 OF 3 — reduce the residual risk","prompt":"The job stays up after disconnects and any VPN host could reach 5901.","question":"Which hardening keeps the render window working but cuts the risk?","options":["Add -viewonly for observers and stop the listener after idle","Kill the job now; the ticket does not matter","Whitelist the job from all future alerting permanently"],"correct":0,"why":"View-only plus an idle stop keeps the job's purpose while removing both the control and the exposure."},{"label":"STEP 3 OF 3 — record it","prompt":"The owner agrees to the hardening in the next change window.","question":"What do you record so future alerts resolve themselves?","options":["A baseline entry plus a rule that closes once -viewonly appears","Delete ticket 7120 so the next alert looks new","Nothing; baselines are refreshed once a year"],"correct":0,"why":"Baseline plus rule makes the sanctioned shape self-evident for the next shift."}]},{"id":"e09","type":"logview","title":"Viewer history vs scope","summary":"Count the out-of-scope viewer connections.","scenario":"helpdesk-ws-12's viewer history for one day is below. Support scope covers studio-ws-03 and mkt-ws-14 with one ticket number per session. Two other targets appear during the afternoon. Filter the panel and complete the review note for the helpdesk lead, counting carefully before you write.","question":"Complete the review note with the two values from the history:","hint":"Count the lines without a ticket number, then name the first out-of-scope host.","explanation":"Three lines carry 'none': both prod-app-05 connections and the finance-ws-22 connection, so the count is three. The first of them targeted prod-app-05 at 13:02. Two would miss the third line, and finance-ws-22 came later in the day.\n\nOut-of-scope targets with no ticket are the quiet signature of someone using a sanctioned tool outside its purpose — worth a conversation before it becomes an incident.","study":"Study scope checks on viewer history: targets and tickets together.","filterable":true,"log":{"header":["time","target","ticket"],"lines":["07:55:02  studio-ws-03:0   4412","08:31:47  mkt-ws-14:0      4417","09:12:20  studio-ws-03:0   4421","11:40:55  mkt-ws-14:0      4425","13:02:11  prod-app-05:0    none","13:02:15  prod-app-05:0    none","14:26:39  studio-ws-03:0   4430","15:58:44  finance-ws-22:0  none","16:41:03  mkt-ws-14:0      4433"]},"widget":{"type":"fill","question":"Complete the review note with the two values from the history:","text":"The viewer made ___ connections without a ticket, and the first one targeted ___.","blanks":["three","prod-app-05"],"bank":["three","prod-app-05","two","finance-ws-22"]}},{"id":"e10","type":"multi","title":"Why classic auth is weak","summary":"Select every weakness of classic VNC authentication.","scenario":"The audit workshop argues about dropping classic VncAuth everywhere. You list its documented weaknesses. Five claims are on the table; select the ones that are true, and leave the single claim that flatters VNC's cryptography, because the workshop needs the honest picture.","question":"Select every true weakness of classic VncAuth:","hint":"One claim says a modern hash protects the password — check the storage format first.","explanation":"The eight-character trim, the fast-cracking DES key, the password-free None mode and the one-shared-password habit are all documented weaknesses. Bcrypt is wrong — classic VNC stores an obfuscated password under a fixed key, not a modern slow hash.\n\nFour weaknesses and one flattering claim: the audit decision almost writes itself.","study":"Study VncAuth storage and key derivation, and why TLS does not fix the ceiling.","options":["Passwords longer than eight characters are trimmed to eight","Captured challenge pairs crack fast under the tiny DES key","VNC passwords are stored with modern bcrypt hashing","Servers set to SecurityTypes None ask no password at all","One shared password often covers every viewer, server and the host"],"correct":[0,1,3,4]},{"id":"e11","type":"mcq","title":"Meaning of a 5500 listener","summary":"Interpret a listening viewer on a production server.","scenario":"A vulnerability scan reports prod-app-05 with a socket LISTENING on TCP 5500 and an ESTABLISHED flow to 10[.]198[.]44[.]12 on the same port. The scan plugin prints 'unknown service' and moves on. You know the VNC port families, so you read the pairing differently than the plugin does.","question":"What does the combination on prod-app-05 indicate?","hint":"Which side of a reverse VNC session listens on 5500 — and who is connected to it?","explanation":"Port 5500 is the viewer's listening port for reverse connections. A server that listens there and holds an ESTABLISHED flow to an external address is playing the viewer side — meaning some VNC server component dialed out to it. RDP has no business on 5500, an inbound-waiting viewer would not hold an established flow, and DNS has nothing to do with this port.\n\nThis pairing — listener plus established outbound flow — is the cleanest single reverse-VNC indicator.","study":"Study port 5500: the reverse-VNC listener and its established flows.","options":["A reverse VNC session back to a listening viewer","A standard RDP gateway handshake on default ports","A VNC viewer waiting for inbound helpdesk support","A DNS zone transfer that reused the port number"],"correct":0},{"id":"e12","type":"fill","title":"Where VNC keeps things","summary":"Complete the artefact-location note for two platforms.","scenario":"The response playbook lists where VNC artefacts live on the two platforms the studio runs. The sentence needs the Windows configuration file and the Linux directory that holds the password file and the session logs. The bank holds five names; two fit and three are decoys from other subsystems.","question":"Complete the playbook note with the two artefact locations from the bank:","hint":"One is an .ini file on Windows; the other is a dot-directory on Linux.","explanation":"UltraVNC's configuration lives in ultravnc.ini, and Linux VNC desktops keep passwd and per-display logs in the .vnc directory. win.ini is legacy Windows configuration, .ssh holds keys, and hosts is name resolution — none of them VNC's.\n\nKnowing these two paths turns 'find VNC evidence' into a two-command task during response.","study":"Study artefact paths: ultravnc.ini on Windows, ~/.vnc on Linux.","text":"UltraVNC keeps its server configuration in ___, while a Linux VNC desktop keeps its passwd file and session logs under the ___ directory.","blanks":["ultravnc.ini",".vnc"],"bank":["ultravnc.ini",".vnc","win.ini",".ssh","hosts"]},{"id":"e13","type":"match","title":"Verdict per finding","summary":"Give each finding a benign or alarming verdict.","scenario":"Five findings land in one shift handover. Each needs exactly one verdict line so the next shift knows where to look first. Two findings are normal, three are not — and one of the normal-looking findings is the worst of the lot. Tickets, owners and process paths carry the verdicts.","question":"Match each finding to its verdict:","hint":"Tickets and view-only make a session normal; ownerless listeners and Temp-folder processes do not.","explanation":"A ticketed helpdesk session and a view-only session are the sanctioned shapes. An Xvnc on :2 with no change record, an established 5500 flow to the outside and a winvnc.exe running from a Temp folder are the three shapes that get escalated — the Temp-folder one is effectively a planted server.\n\nVerdicts keep handovers short and stop the next shift re-litigating settled evidence.","study":"Study triage verdicts: sanctioned shapes versus escalation shapes.","pairs":[{"left":"Helpdesk viewer to 5900 with ticket 4412","right":"Benign — expected support workflow"},{"left":"Xvnc bound on :2 with no change record","right":"Alarming — an unowned second display"},{"left":"ESTABLISHED 5500 to an external address","right":"Alarming — classic reverse-VNC pattern"},{"left":"Viewer session in view-only mode","right":"Benign — observation-only access"},{"left":"winvnc.exe running from a Temp folder","right":"Alarming — VNC server in a user-writable path"}]},{"id":"e14","type":"order","title":"Hardening rollout","summary":"Order the estate-wide VNC hardening rollout.","scenario":"GRC owns the VNC hardening programme for the whole studio, and the rollout has five stages. Doing them out of order wastes work: you cannot harden what you have not inventoried, you should not alert before the baseline exists, and every stage should shrink the problem for the next one. Put the stages in order.","question":"Arrange the hardening rollout in the correct order:","hint":"Inventory first; alerting last, once the baseline exists.","explanation":"Inventory makes the problem visible, removal shrinks it, strong auth closes the brute-force door, TLS plus the VPN front door closes the wiretap and scan doors, and alerting comes last so it fires on real deviations from a clean baseline.\n\nDefender view: each stage multiplies the next — removal cuts what authentication must protect, and the alerting baseline is only trustworthy because the dirty hosts are already gone.","study":"Study hardening programme order: inventory, remove, authenticate, encrypt, detect.","items":["Inventory every host with a VNC server or viewer installed","Remove VNC from hosts that never need it","Force strong auth: no None mode, rotate shared passwords","Wrap sessions in TLS and allow 5900 only via VPN or tunnel","Alert on new 5900 listeners and outbound 5500 flows"]},{"id":"e15","type":"terminal","title":"Read the UltraVNC configuration","summary":"Query the UltraVNC registry key read-only.","scenario":"On design-ws-07 the audit must document UltraVNC's server settings from the registry before any change is proposed. You are on the host with a responder shell. Reading only — no writes, no deletions, and the audit trail must show a clean read.","question":"Run the command that reads the UltraVNC registry key:","hint":"reg query reads a key path under HKLM; it never writes.","explanation":"reg query HKLM\\SOFTWARE\\UltraVNC prints the server's values without touching anything. The output is damning: SecurityTypes None means no password is ever requested, and FileTransfer stays enabled. A binary Password value exists but is bypassed by the None mode.\n\nreg add and reg delete would write or destroy values — during live response the registry is read-only by policy.","study":"Study UltraVNC registry layout and what SecurityTypes None implies.","prompt":"C:\\Users\\responder>","skill":"vnc-registry-review","knownTools":["reg","sc","tasklist","netstat","findstr"],"expected":"reg query HKLM\\SOFTWARE\\UltraVNC","elements":[{"label":"the reg query read command","any":["reg query"]},{"label":"the UltraVNC key path","any":["hklm\\software\\ultravnc"]}],"forbidden":[{"any":["reg delete","reg add"],"why":"Writing or deleting registry values during live response alters the configuration evidence."}],"output":["HKLM\\SOFTWARE\\UltraVNC","    Password    REG_BINARY    45C00F0E5218E141","    SecurityTypes    REG_SZ    None","    MSLogon    REG_SZ    0","    FileTransfer    REG_SZ    1","The server runs with SecurityTypes None — no password is requested."],"syntaxPanel":"reg query <keypath>\n  reg query   read a registry key and its values\n  HKLM        HKEY_LOCAL_MACHINE hive\n  example on another host: reg query HKLM\\SOFTWARE\\TightVNC\\Server","sampleOutput":"HKLM\\SOFTWARE\\TightVNC\\Server\n    Password    REG_BINARY    3A11C0FFEE5218E1"},{"id":"e16","type":"mcq","title":"The control combination","summary":"Pick the control set that keeps VNC usable and safe.","scenario":"The studio needs remote support to keep working after the hardening programme lands. Four control sets are proposed by four different teams. One keeps support possible and cuts lateral movement; the other three either break support entirely or leave the door wide open for the next brute-force chain.","question":"Which control set keeps support possible while cutting the risk?","hint":"Fewer doors, unique keys, watching hands tied.","explanation":"The VPN front door removes direct 5900 reach, per-host passwords contain a leak to one machine, and view-only defaults mean observers cannot type. One open rule plus one shared password multiplies the attacker's options, hiding display offsets changes nothing about reachability, and None auth invites the brute-force chain you studied.\n\nGood VNC security is boring: fewer doors, unique keys, watching hands tied.","study":"Study control design: front doors, per-host secrets, least privilege.","options":["VPN front door, per-host passwords, view-only","One open 5900 rule for every VLAN, one shared password","Display offsets hidden behind a perimeter firewall","Viewer updates weekly, servers stay on None auth"],"correct":0}];

/* ==== utils ==== */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function norm(s){
  return String(s == null ? "" : s).toLowerCase().replace(/\s+/g," ").replace(/[.,;:!]+$/,"").trim();
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function fmt1(n){ return (Math.round(n * 100) / 100).toFixed(1); }
function wordCount(s){ return String(s || "").split(/\s+/).filter(Boolean).length; }
function $(id){ return document.getElementById(id); }
function byClass(root, cls){ return root.getElementsByClassName(cls); }

function setTimerState(next){
  var now = Date.now();
  if(S.tStateAt != null){
    var dt = (now - S.tStateAt) / 1000;
    if(S.tState === "PAUSED_MANUAL") S.pauseManual += dt;
    if(S.tState === "PAUSED_AUTO_CHECK") S.pauseAutoCheck += dt;
  }
  S.tState = next;
  S.tStateAt = now;
  updateHeader();
}
setInterval(function(){
  if(S.tState === "RUNNING"){
    S.remaining -= 1;
    S.elapsed += 1;
    if(S.remaining <= 0){
      S.remaining = 0;
      updateClock();
      finish();
      return;
    }
    updateClock();
  }
}, 1000);
function updateClock(){ var c = $("tb-clock"); if(c) c.textContent = fmtClock(S.remaining); }

function answeredCount(){

}

/* ==== postMessage integration ==== */
window.addEventListener("message", function(ev){
  var d = ev.data;
  if(!d || typeof d !== "object") return;
  if(d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT"){
    S.init = d;
    var slot = $("candline");
    if(slot && d.username){
      slot.textContent = "Candidate: " + d.username + (d.country ? " · " + d.country : "");
      slot.style.display = "block";
    }
  }
});
function postScore(){
  if(S.scorePosted) return;
  S.scorePosted = true;
  var rounded = Math.round(S.score);
  var total = 0, i;
  for(i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null) total++;
  }
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var msg = {
    type: "CYBERPULSE_SCORE",
    topicId: META.topicId,
    batch: META.batch,
    score: rounded,
    total: total,
    percent: percent,
    passed: passed
  };
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage(msg, location.origin);
    }
  }catch(e){ /* standalone file:// — no parent handshake */ }
}

/* ==== answer defaults ==== */
function defaultAnswer(ex){
  var i, d;
  switch(ex.type){
    case "mcq": return { sel: -1 };
    case "multi": return { sel: [] };
    case "match":
      d = []; for(i = 0; i < ex.pairs.length; i++) d.push(-1); return { assign: d };
    case "order":
      d = []; for(i = 0; i < ex.items.length; i++) d.push(i);
      return { seq: shuffle(d) };
    case "fill":
      d = []; for(i = 0; i < ex.blanks.length; i++) d.push(""); return { vals: d };
    case "terminal": return { cmd: "" };
    case "logview": return { w: defaultAnswer(ex.widget) };
    case "decision":
      d = []; for(i = 0; i < ex.steps.length; i++) d.push(-1); return { steps: d, cursor: 0 };
  }
  return {};
}
function ensureAnswer(ex, i){
  if(S.answers[i] == null) S.answers[i] = defaultAnswer(ex);
  return S.answers[i];
}

function scenInner(ex){
  var out = "";
  var paras = String(ex.scenario).split(/\n\n+/);
  for(var p = 0; p < paras.length; p++) out += "<p>" + esc(paras[p]) + "</p>";
  if(ex.artefacts && ex.artefacts.length){
    for(var a = 0; a < ex.artefacts.length; a++){
      var art = ex.artefacts[a];
      var long = String(art.content || "").split("\n").length > 25;
      out += '<details class="artef"' + (long ? "" : " open") + '><summary>' + esc(art.label) + '</summary><div class="artbody">' + artefactBody(art) + "</div></details>";
    }
  }
  return out;
}
function artefactBody(art){
  if(art.kind === "table"){
    var rows = String(art.content).split("\n");
    var out = '<table class="attable">';
    for(var r = 0; r < rows.length; r++){
      var cells = rows[r].split(" | ");
      out += "<tr>";
      for(var c = 0; c < cells.length; c++){
        out += (r === 0 ? "<th>" : "<td>") + esc(cells[c]) + (r === 0 ? "</th>" : "</td>");
      }
      out += "</tr>";
    }
    return out + "</table>";
  }
  return '<pre class="mono">' + esc(art.content) + "</pre>";
}
function hintHTML(ex){
  return '<div class="hintbox" role="note"><span class="hb">💡 HINT</span>' + esc(ex.hint) +
         '<div class="penaltynote">Hint used — 10% credit penalty applies to this exercise.</div></div>';
}

/* ==== type renderers ==== */
function optionRow(text, idx, chosen, mark, cls){
  return '<button type="button" class="opt ' + (cls || "") + '" data-i="' + idx + '" aria-pressed="' + (chosen ? "true" : "false") + '">' +
    '<span class="mark" aria-hidden="true">' + (mark || "") + "</span><span>" + esc(text) + "</span></button>";
}
function renderByType(ex, area, i, lock, res){
  area.innerHTML = "";
  var ans = ensureAnswer(ex, i);
  var w = document.createElement("div");
  switch(ex.type){
    case "mcq":      renderChoice(ex, w, ans, lock, res, false, ""); break;
    case "multi":    renderChoice(ex, w, ans, lock, res, true, ""); break;
    case "match":    renderMatch(ex, w, ans, lock, res); break;
    case "order":    renderOrder(ex, w, ans, lock, res); break;
    case "fill":     renderFill(ex, w, ans, lock, res, null, ""); break;
    case "terminal": renderTerminal(ex, w, ans, lock, res); break;
    case "logview":  renderLogview(ex, w, ans, lock, res); break;
    case "decision": renderDecision(ex, w, ans, lock, res); break;
  }
  area.appendChild(w);
}
function renderChoice(ex, root, ans, lock, res, isMulti, path){
  var correct = isMulti ? ex.correct : [ex.correct];
  ex.options.forEach(function(opt, oi){
    var chosen = isMulti ? ans.sel.indexOf(oi) !== -1 : ans.sel === oi;
    var mark = "", cls = "";
    if(!lock){
      if(chosen){ mark = isMulti ? "☑" : "◉"; cls = "sel"; }
    } else {
      var isCorr = correct.indexOf(oi) !== -1;
      if(isCorr){ mark = "✓"; cls = "correct"; }
      else if(chosen){ mark = "✗"; cls = "wrong"; }
      else { cls = "dim"; }
    }
    root.insertAdjacentHTML("beforeend", optionRow(opt, oi, chosen, mark, cls));
  });
  var btns = byClass(root, "opt");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      btn.addEventListener("click", function(){
        if(lock) return;
        var oi = parseInt(btn.getAttribute("data-i"), 10);
        if(isMulti){
          var p = ans.sel.indexOf(oi);
          if(p === -1) ans.sel.push(oi); else ans.sel.splice(p, 1);
          btn.classList.toggle("sel");
          btn.setAttribute("aria-pressed", btn.classList.contains("sel") ? "true" : "false");
          btn.querySelector(".mark").textContent = btn.classList.contains("sel") ? "☑" : "";
        } else {
          ans.sel = oi;
          for(var z = 0; z < btns.length; z++){
            btns[z].classList.remove("sel");
            btns[z].setAttribute("aria-pressed", "false");
            var mk = btns[z].querySelector(".mark"); if(mk) mk.textContent = "";
          }
          btn.classList.add("sel");
          btn.setAttribute("aria-pressed", "true");
          btn.querySelector(".mark").textContent = "◉";
        }
      });
    })(btns[b]);
  }
}
function renderMatch(ex, root, ans, lock, res){
  var n = ex.pairs.length;
  var chipSel = -1;
  var html = '<div class="mgrid"><div class="mcol"><h4>Items</h4>';
  for(var z = 0; z < n; z++){
    html += '<div class="mrow"><div class="mleft">' + esc(ex.pairs[z].left) + '</div>' +
            '<button type="button" class="mzone" data-z="' + z + '" aria-label="Assigned value for ' + esc(ex.pairs[z].left) + '">— drop here —</button></div>';
  }
  html += '</div><div class="mbank"><h4>Answer bank</h4>';
  ex.pairs.forEach(function(pr, ri){
    html += '<button type="button" class="mchip" draggable="true" data-r="' + ri + '">' + esc(pr.right) + "</button>";
  });
  html += '</div></div><p class="mhintline">Click a bank item, then click a drop zone — or drag the item onto a zone. Click a filled zone to clear it.</p>';
  root.innerHTML = html;
  var zones = byClass(root, "mzone");
  var chips = byClass(root, "mchip");
  function paint(){
    for(var z = 0; z < n; z++){
      var zz = zones[z];
      var v = ans.assign[z];
      if(v === -1){
        zz.textContent = "— drop here —";
        zz.classList.remove("filled", "correct", "wrong");
      } else {
        zz.textContent = ex.pairs[v].right;
        zz.classList.add("filled");
        if(lock){
          zz.classList.remove("wrong", "correct");
          zz.classList.add(v === z ? "correct" : "wrong");
        }

  function assign(z, r){
    if(r === -1) return;

    })(zi);
  }
  for(var ci = 0; ci < chips.length; ci++){
    (function(c){
      var cc = chips[c];
      cc.addEventListener("click", function(){

/* ==== grading ==== */
function gradeFillLike(text, blanks, vals){
  var items = [], H = 0, W = 0, N = blanks.length;
  for(var k = 0; k < N; k++){
    var v = norm(vals[k]);
    var ok = v !== "" && v === norm(blanks[k]);
    items.push({ ok: ok, state: v === "" ? "miss" : (ok ? "ok" : "bad"),
      text: v === "" ? ('Blank ' + (k + 1) + ' — missed. Correct: "' + blanks[k] + '"')
        : (ok ? ('Blank ' + (k + 1) + ' — correct: "' + blanks[k] + '"')
        : ('Blank ' + (k + 1) + ' — "' + vals[k] + '" is wrong. Correct: "' + blanks[k] + '"')) });
    if(ok) H++; else if(v !== "") W++;
  }
  return { H: H, W: W, N: N, items: items };
}
function gradeChoiceLike(options, correct, sel, isMulti){
  var items = [], H = 0, W = 0, N = correct.length;
  var selArr = isMulti ? (sel || []) : (sel === -1 ? [] : [sel]);
  for(var c = 0; c < correct.length; c++){
    var ci = correct[c];
    if(selArr.indexOf(ci) !== -1){ items.push({ ok: true, state: "ok", text: "✓ You selected the correct option: " + options[ci] }); H++; }
    else items.push({ ok: false, state: "miss", text: "Missed the correct option: " + options[ci] });
  }
  for(var s = 0; s < selArr.length; s++){
    var si = selArr[s];
    if(correct.indexOf(si) === -1){
      items.push({ ok: false, state: "bad", text: "Wrong selection: " + options[si] });
      W++;
    }
  }
  return { H: H, W: W, N: N, items: items };
}
function grade(ex, ans, hintUsed){
  var g, i;
  switch(ex.type){
    case "mcq":
      g = gradeChoiceLike(ex.options, [ex.correct], ans.sel, false);
      break;
    case "multi":
      g = gradeChoiceLike(ex.options, ex.correct, ans.sel, true);
      break;
    case "match":
      g = { H: 0, W: 0, N: ex.pairs.length, items: [] };
      for(i = 0; i < ex.pairs.length; i++){
        var a = ans.assign[i];
        if(a === -1){ g.items.push({ state: "miss", text: 'Missed: "' + ex.pairs[i].left + '" → correct partner: "' + ex.pairs[i].right + '"' }); }
        else if(a === i){ g.H++; g.items.push({ state: "ok", text: '✓ "' + ex.pairs[i].left + '" → "' + ex.pairs[i].right + '"' }); }
        else { g.W++; g.items.push({ state: "bad", text: 'Wrong: "' + ex.pairs[i].left + '" → you placed "' + ex.pairs[a].right + '", correct: "' + ex.pairs[i].right + '"' }); }
      }
      break;
    case "order":
      g = { H: 0, W: 0, N: ex.items.length, items: [] };
      for(i = 0; i < ex.items.length; i++){
        if(ans.seq[i] === i){ g.H++; g.items.push({ state: "ok", text: "Position " + (i + 1) + " — correct: " + ex.items[i] }); }
        else { g.W++; g.items.push({ state: "bad", text: "Position " + (i + 1) + " — you placed \"" + ex.items[ans.seq[i]] + '", correct: "' + ex.items[i] + '"' }); }
      }
      break;
    case "fill":
      g = gradeFillLike(ex.text, ex.blanks, ans.vals);
      break;
    case "terminal": {
      var cmd = String(ans.cmd || "");
      g = { H: 0, W: 0, N: ex.elements.length, items: [], warn: [], canon: null };
      var low = cmd.toLowerCase();
      if(!cmd){
        g.items.push({ state: "miss", text: "No command was run — nothing to grade." });
      } else {
        for(i = 0; i < ex.elements.length; i++){
          var el = ex.elements[i];
          var hit = false;
          for(var v = 0; v < el.any.length; v++){
            if(low.indexOf(String(el.any[v]).toLowerCase()) !== -1){ hit = true; break; }
          }
          if(hit){ g.H++; g.items.push({ state: "ok", text: "✓ Element matched: " + el.label }); }
          else g.items.push({ state: "miss", text: "Missing element: " + el.label });
        }
        (ex.forbidden || []).forEach(function(f){
          for(var v2 = 0; v2 < f.any.length; v2++){
            if(low.indexOf(String(f.any[v2]).toLowerCase()) !== -1){
              g.warn.push("⚠ DANGEROUS — NEAR MISS: " + f.why);
              break;
            }
          }
        });
      }
      if(g.H < g.N) g.canon = ex.expected;
      break;
    }
    case "logview": {
      var wg;
      if(ex.widget.type === "fill") wg = gradeFillLike(ex.widget.text, ex.widget.blanks, ans.w.vals);
      else if(ex.widget.type === "multi") wg = gradeChoiceLike(ex.widget.options, ex.widget.correct, ans.w.sel, true);
      else wg = gradeChoiceLike(ex.widget.options, [ex.widget.correct], ans.w.sel, false);
      g = { H: wg.H, W: wg.W, N: wg.N, items: wg.items.map(function(it){ return it; }) };
      break;
    }
    case "decision":
      g = { H: 0, W: 0, N: ex.steps.length, items: [] };
      for(i = 0; i < ex.steps.length; i++){
        var st = ex.steps[i];
        if(ans.steps[i] === st.correct){ g.H++; g.items.push({ state: "ok", text: (st.label || "Step " + (i + 1)) + " — correct: " + st.options[st.correct] }); }
        else if(ans.steps[i] === -1){ g.items.push({ state: "miss", text: (st.label || "Step " + (i + 1)) + " — not confirmed. Correct: " + st.options[st.correct] }); }
        else { g.W++; g.items.push({ state: "bad", text: (st.label || "Step " + (i + 1)) + " — wrong. Correct: " + st.options[st.correct] + ". " + st.why }); }
      }
      break;
    default:
      g = { H: 0, W: 0, N: 1, items: [] };
  }
  var raw = g.N > 0 ? Math.max(0, (g.H - g.W) / g.N) : 0;
  var penalty = hintUsed ? 0.10 : 0;
  var credit = Math.max(0, raw - penalty);
  var head = raw >= 0.999 ? "ok" : (raw <= 0.001 ? "bad" : "part");
  var headText = head === "ok" ? "✓ Correct" : (head === "bad" ? "✗ Incorrect" : "✓ Partially correct");
  var res = {
    credit: credit, raw: raw, head: head, headText: headText,
    H: g.H, W: g.W, N: g.N,
    items: g.items || [], warn: g.warn || [], canon: g.canon || null,
    itemsByKey: {}
  };
  if(ex.type === "fill"){
    for(var k1 = 0; k1 < (g.items || []).length; k1++) res.itemsByKey["b" + k1] = g.items[k1].state;
  } else if(ex.type === "logview" && ex.widget.type === "fill"){
    for(var k2 = 0; k2 < (g.items || []).length; k2++) res.itemsByKey["wb" + k2] = g.items[k2].state;
  }
  return res;
}

/* ==== check / feedback ==== */
function onCheck(){
  var i = curPos();
  var ex = EXAMS[i];
  if(S.checked[i] != null) return;
  if(S.tState === "RUNNING") setTimerState("PAUSED_AUTO_CHECK");
  var res = grade(ex, ensureAnswer(ex, i), S.hintsUsed[i] === true);
  res.wres = null;
  if(ex.type === "logview"){
    res.wres = { items: res.items, H: res.H, W: res.W, N: res.N };
  }
  S.checked[i] = res;
  S.score += res.credit;
  renderExercise();
}
function renderFeedback(i, res){
  var ex = EXAMS[i];
  var rows = "";
  res.items.forEach(function(it){
    var ic = it.state === "ok" ? "✓" : (it.state === "bad" ? "✗" : "○");
    rows += '<div class="fi ' + it.state + '"><span class="ic" aria-hidden="true">' + ic + '</span><span>' + esc(String(it.text).replace(/^[✓✗○]\s*/, "")) + "</span></div>";
  });
  (res.warn || []).forEach(function(wn){
    rows += '<div class="fi warn"><span class="ic" aria-hidden="true">⚠</span><span>' + esc(wn) + "</span></div>";
  });
  if(S.hintsUsed[i]) rows += '<div class="fi note"><span class="ic" aria-hidden="true">💡</span><span>Hint used on this exercise — credit reduced by 0.10.</span></div>';
  var explain = String(ex.explanation).split(/\n\n+/).map(function(p){ return "<p>" + esc(p) + "</p>"; }).join("");
  var canon = res.canon ? '<div class="mono" role="figure" aria-label="Canonical command">canonical: ' + esc(res.canon) + "</div>" : "";
  $("fbslot").innerHTML = '<div class="fb ' + res.head + '" role="status">' +
    '<div class="fb-head"><span aria-hidden="true">' + (res.head === "ok" ? "✓" : res.head === "bad" ? "✗" : "✓") + "</span><span>" + esc(res.headText.replace(/^[✓✗]\s*/, "")) + '</span><span class="fb-credit">credit ' + res.credit.toFixed(2) + " / 1.00" +
    (res.N > 1 ? " (" + res.H + "✓ " + res.W + "✗ " + (res.N - res.H - res.W) + "○ of " + res.N + ")" : "") + "</span></div>" +
    '<div class="fb-body">' + rows + canon +
    '<div class="fb-explain">' + explain + '<div class="fb-study">📚 ' + esc(ex.study) + "</div></div>" +
    "</div></div>";
  $("btn-check").disabled = true;
  $("btn-check").textContent = "✓ Checked";
  var nb = $("btn-next");
  nb.disabled = false;
  nb.focus();
  var lastMain = S.phase === "main" && S.idx === S.order.length - 1;
  nb.innerHTML = S.phase === "review" ? "Back to review list" : (lastMain ? "Final submit &amp; results" : "Next exercise");
  $("actnote").textContent = "";
  updateHeader();
}

/* ==== flow ==== */
function startExam(){
  S.order = shuffle(EXAMS.map(function(_, i){ return i; }));
  S.idx = 0;
  S.phase = "main";
  setTimerState("RUNNING");
  renderExercise();
}
function onCheckGuard(){ /* reserved */ }
function onNext(){
  if(S.phase === "review"){
    if(S.tState === "PAUSED_AUTO_CHECK") setTimerState("RUNNING");
    showReview();
    return;
  }
  if(S.tState === "PAUSED_AUTO_CHECK") setTimerState("RUNNING");
  if(S.idx < S.order.length - 1){
    S.idx++;
    renderExercise();
  } else {
    if(pendingSkips().length > 0) showReview();
    else finish();
  }
}
function onSkip(){
  if(S.phase === "review") return;
  var i = curPos();
  if(S.checked[i] != null) return;
  if(S.skipList.indexOf(i) === -1) S.skipList.push(i);
  $("actnote") && ($("actnote").textContent = "");
  if(S.idx < S.order.length - 1){
    S.idx++;
    renderExercise();
  } else {
    if(pendingSkips().length > 0) showReview();
    else finish();
  }
  updateHeader();
}
function onHint(){
  var i = curPos();
  var ex = EXAMS[i];
  if(S.checked[i] != null || S.hintsUsed[i]) return;
  S.hintsUsed[i] = true;
  $("hintslot").innerHTML = hintHTML(ex);
  $("btn-hint").disabled = true;
  updateHeader();
}
function showReview(){
  S.screen = "review";
  S.phase = "review";
  S.reviewPos = -1;
  var pend = pendingSkips();
  S.reviewTotal = pend.length;
  var m = $("main");
  if(pend.length === 0){ finish(); return; }
  var rows = pend.map(function(exIdx, k){
    var ex = EXAMS[exIdx];
    return '<div class="revrow"><span class="rn">#' + (k + 1) + '</span><span class="rt"><b>' + esc(ex.title) + "</b> — " + esc(ex.summary) + "</span>" +
      '<span class="badge-skip">⚠ Skipped</span><button class="btn" data-ex="' + exIdx + '" type="button">Answer now</button></div>';
  }).join("");
  m.innerHTML =
    '<section class="blk blk-question" style="--blk:var(--amber)"><div class="blk-label"><span class="dot"></span>REVIEW SKIPPED EXERCISES</div>' +
    '<p class="q-text">You skipped ' + pend.length + ' exercise' + (pend.length > 1 ? "s" : "") + '.</p>' +
    '<p class="scen-body" style="color:var(--ink-dim);margin:8px 0 14px">Answer them now, or leave them — exercises you never answer are excluded from both your score and the total. <span class="dim">The timer is still running.</span></p>' +
    '<div class="revlist">' + rows + "</div>" +
    '<div class="actions" style="margin-top:16px"><button class="btn btn-primary" id="btn-finish" type="button">Finish exam — see results</button></div></section>';
  var btns = byClass(m, "btn");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      if(btn.hasAttribute("data-ex")){
        btn.addEventListener("click", function(){
          S.idx = S.order.indexOf(parseInt(btn.getAttribute("data-ex"), 10));
          S.reviewPos = pendingSkips().indexOf(parseInt(btn.getAttribute("data-ex"), 10));
          renderReviewItem();
        });
      }
    })(btns[b]);
  }
  $("btn-finish").addEventListener("click", function(){ finish(); });
  updateHeader();
}
function renderReviewItem(){
  var exIdx = curPos();
  S.screen = "review";
  renderExercise();
  var nb = $("btn-next");
  nb.innerHTML = "Back to review list";
  updateHeader();
}
function finish(){
  setTimerState("ENDED");
  S.screen = "results";
  var m = $("main");
  var total = 0, full = 0, part = 0, bad = 0, skipped = 0;
  var partSum = 0;
  for(var i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null){
      total++;
      var c = S.checked[i].credit;
      if(c >= 0.999){ full++; }
      else if(c > 0){ part++; partSum += c; }
      else bad++;
    } else skipped++;
  }
  var rounded = Math.round(S.score);
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var pctColor = passed ? "var(--green)" : "var(--red)";
  var verdict = passed
    ? '<span class="res-verdict pass"><span aria-hidden="true">✓</span> PASSED</span>'
    : '<span class="res-verdict fail"><span aria-hidden="true">✗</span> NOT PASSED</span>';
  var avgPart = part > 0 ? (partSum / part) : 0;
  var rows = "";
  for(var q = 0; q < EXAMS.length; q++){
    var qi = S.order[q];
    var exq = EXAMS[qi];
    var st, cls;
    if(S.checked[qi] != null){
      var cc = S.checked[qi].credit;
      if(cc >= 0.999){ st = "✓ Correct"; cls = "st-ok"; }
      else if(cc > 0){ st = "✓ Partially correct"; cls = "st-part"; }
      else { st = "✗ Incorrect"; cls = "st-bad"; }
    } else { st = "⚠ Skipped — not answered"; cls = "st-skip"; }
    rows += "<tr><td>" + (q + 1) + "</td><td>" + esc(TYPE_LABEL[exq.type].name) + "</td><td>" + esc(exq.title) + '</td><td class="num">' +
      (S.checked[qi] != null ? S.checked[qi].credit.toFixed(2) : "—") + '</td><td class="' + cls + '">' + st + "</td></tr>";
  }
  m.innerHTML =
    '<section class="res-head"><div class="ring" style="--pct:' + percent + ";--rc:" + pctColor + '" role="img" aria-label="Final score ' + percent + ' percent"><div class="rin"><div><div class="pct">' + percent + '%</div><div class="of">SCORED</div></div></div></div>' +
    "<div>" + verdict +
      '<div class="res-sub">' + esc(META.attackId + " " + META.attackName + " — " + META.severity.replace("_"," ")) + "</div>" +
      '<div class="res-sub">Points: <b>' + S.score.toFixed(2) + "</b> (posted as " + rounded + ") from <b>" + total + "</b> answered of " + EXAMS.length + " · pass mark " + META.passMark + "%</div>" +
      '<div class="res-sub">Active time: <b>' + fmtClock(S.elapsed) + "</b> · budget " + META.timerMinutes + ":00</div>" +
    "</div></section>" +
    '<div class="statgrid">' +
      '<div class="statcard"><div class="sv ok">' + full + '</div><div class="sl">✓ Fully correct</div></div>' +
      '<div class="statcard"><div class="sv part">' + part + '</div><div class="sl">✓ Partial (avg ' + avgPart.toFixed(2) + ')</div></div>' +
      '<div class="statcard"><div class="sv bad">' + bad + '</div><div class="sl">✗ Fully incorrect</div></div>' +
      '<div class="statcard"><div class="sv skip">' + skipped + '</div><div class="sl">⚠ Skipped, never answered</div></div>' +
    "</div>" +
    '<div class="pausereport">⏱ <b>Pause report</b> — auto-paused during checks: <b>' + fmtClock(S.pauseAutoCheck) + "</b> · manual pauses: <b>" + fmtClock(S.pauseManual) + "</b>. No time passes during pauses.</div>" +
    '<table class="restable"><thead><tr><th>#</th><th>Type</th><th>Exercise</th><th>Credit</th><th>Result</th></tr></thead><tbody>' + rows + "</tbody></table>" +
    '<div class="actions" style="margin-top:18px"><button class="btn btn-primary" id="btn-retake" type="button">↻ Retake exam (reshuffled)</button></div>';
  $("btn-retake").addEventListener("click", retake);
  updateHeader();
  window.scrollTo(0, 0);
  setTimeout(postScore, 600);
}
function retake(){
  S.order = [];
  S.idx = 0;
  S.phase = "main";
  S.skipList = [];
  S.answers = {};
  S.checked = {};
  S.hintsUsed = {};
  S.score = 0;
  S.tState = "IDLE";
  S.tStateAt = null;
  S.pausedFrom = null;
  S.remaining = META.timerMinutes * 60;
  S.elapsed = 0;
  S.pauseManual = 0;
  S.pauseAutoCheck = 0;
  S.scorePosted = false;
  var po = $("pauseoverlay");
  po.classList.add("hidden");
  $("main").classList.remove("hidden");
  showIntro();
}

/* ==== pause / hint / skip wiring ==== */
$("btn-hint").addEventListener("click", onHint);
$("btn-skip").addEventListener("click", onSkip);
$("btn-pause").addEventListener("click", function(){
  if(S.tState === "RUNNING"){
    S.pausedFrom = null;
    setTimerState("PAUSED_MANUAL");
    $("pauseoverlay").classList.remove("hidden");
    $("main").classList.add("hidden");
    $("btn-resume").focus();
  } else if(S.tState === "PAUSED_AUTO_CHECK"){
    S.pausedFrom = "PAUSED_AUTO_CHECK";
    setTimerState("PAUSED_MANUAL");
    $("pauseoverlay").classList.remove("hidden");
    $("main").classList.add("hidden");
    $("btn-resume").focus();
  }
});
$("btn-resume").addEventListener("click", function(){
  $("pauseoverlay").classList.add("hidden");
  $("main").classList.remove("hidden");
  if(S.pausedFrom === "PAUSED_AUTO_CHECK"){
    S.pausedFrom = null;
    setTimerState("PAUSED_AUTO_CHECK");
  } else {
    setTimerState("RUNNING");
  }
});

/* ==== boot ==== */
$("tb-title").textContent = META.attackId + " " + META.attackName;
$("foot-meta").textContent = META.attackId + " · " + META.severity.replace("_", " ") + " · pass " + META.passMark + "%";
showIntro();

/* ==== automation hook (offline lab use) ==== */
function buildCorrectAns(ex){
  var i, a;
  switch(ex.type){
    case "mcq": return { sel: ex.correct };
    case "multi": return { sel: ex.correct.slice() };
    case "match":
      a = []; for(i = 0; i < ex.pairs.length; i++) a.push(i); return { assign: a };
    case "order":
      a = []; for(i = 0; i < ex.items.length; i++) a.push(i); return { seq: a };
    case "fill":
      a = []; for(i = 0; i < ex.blanks.length; i++) a.push(ex.blanks[i]); return { vals: a };
    case "terminal": return { cmd: ex.expected };
    case "logview": return { w: buildCorrectAns(ex.widget) };
    case "decision":
      a = []; for(i = 0; i < ex.steps.length; i++) a.push(ex.steps[i].correct);
      return { steps: a, cursor: ex.steps.length };
  }
  return {};
}
function buildWrongAns(ex){
  var i, a;
  switch(ex.type){
    case "mcq": return { sel: ex.correct === 0 ? 1 : 0 };
    case "multi": {
      var wrong = [];
      for(i = 0; i < ex.options.length && wrong.length < 1; i++){ if(ex.correct.indexOf(i) === -1) wrong.push(i); }
      return { sel: wrong };
    }
    case "match":
      a = []; for(i = 0; i < ex.pairs.length; i++) a.push((i + 1) % ex.pairs.length); return { assign: a };
    case "order":
      a = []; for(i = ex.items.length - 1; i >= 0; i--) a.push(i); return { seq: a };
    case "fill":
      a = []; for(i = 0; i < ex.blanks.length; i++) a.push("zz wrong"); return { vals: a };
    case "terminal": return { cmd: "echo zzz" };
    case "logview": return { w: buildWrongAns(ex.widget) };
    case "decision":
      a = []; for(i = 0; i < ex.steps.length; i++){ var w2 = (ex.steps[i].correct + 1) % ex.steps[i].options.length; a.push(w2); }
      return { steps: a, cursor: ex.steps.length };
  }
  return {};
}
window.__CP = {
  S: S,
  META: META,
  EXAMS: EXAMS,
  start: function(){ startExam(); },
  state: function(){
    return { screen: S.screen, tState: S.tState, remaining: S.remaining, elapsed: S.elapsed,
             score: S.score, idx: S.idx, phase: S.phase, posted: S.scorePosted };
  },
  correctAns: buildCorrectAns,
  wrongAns: buildWrongAns,
  fill: function(ans){ var i = curPos(); S.answers[i] = JSON.parse(JSON.stringify(ans)); renderExercise(); },
  fillIdx: function(idx, ans){ S.answers[idx] = JSON.parse(JSON.stringify(ans)); },
  check: function(){ onCheck(); },
  next: function(){ onNext(); },
  skip: function(){ onSkip(); },
  hint: function(){ onHint(); },
  gradeOne: function(i, ans){ return grade(EXAMS[i], ans, false); },
  pause: function(){ $("btn-pause").click(); },
  resume: function(){ $("btn-resume").click(); },
  finish: function(){ finish(); },
  postScore: postScore
};
</script>
