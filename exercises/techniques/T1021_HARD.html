<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1021 Remote Services — HARD</title>
<style>
:root{
  --bg-page:#070c12;
  --bg-panel:#0d141d;
  --bg-surface:#111a26;
  --bg-surface-2:#0a111a;
  --bg-elev:#172335;
  --ink:#e9eff7;
  --ink-dim:#a9b9cb;
  --ink-faint:#8497ab;
  --line:#1f2b3c;
  --line-soft:#182331;
  --blue:#4aa8e8;   --blue-soft:rgba(74,168,232,.13);
  --amber:#e6aa3c;  --amber-soft:rgba(230,170,60,.13);
  --green:#41c07f;  --green-soft:rgba(65,192,127,.13);
  --red:#ef5a6a;    --red-soft:rgba(239,90,106,.15);
  --sev-easy:#41c07f;
  --sev-medium:#e6aa3c;
  --sev-hard:#f0813c;
  --sev-extreme:#ef5a6a;
  --focus:#4aa8e8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1 0 auto;width:100%;max-width:980px;margin:0 auto;padding:20px 16px 40px}
.foot{flex-shrink:0;margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:12.5px;background:var(--bg-panel)}
.foot b{color:var(--ink-dim);letter-spacing:.08em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-surface-2)}
::-webkit-scrollbar-thumb{background:#24344b;border-radius:6px;border:2px solid var(--bg-surface-2)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(8,13,20,.94);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.14em;font-size:12.5px;color:var(--green)}
.brand small{color:var(--ink-faint);letter-spacing:.05em;font-weight:600}
.tb-sep{width:1px;height:22px;background:var(--line)}
.tb-title{font-weight:700;font-size:13.5px;color:var(--ink-dim);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stat{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;font-weight:600;background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:32px}
.tb-stat .ic{font-size:13px}
.tb-stat.timer{font-family:var(--mono);color:var(--ink)}
.tb-state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px;border:1px solid}
.tb-state.manual{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.tb-state.autocheck{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.tb-btn:hover:not(:disabled){border-color:var(--blue)}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}
.tb-btn.hint{color:var(--amber)}
.tb-btn.skip{color:var(--ink-dim)}
.prog{height:3px;background:var(--line-soft)}
.prog i{display:block;height:100%;background:var(--green);width:0%;transition:width .25s}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 12px;color:#08110b}
.badge::before{content:"●";font-size:9px}
.sev-EASY{background:var(--sev-easy)}
.sev-MEDIUM{background:var(--sev-medium)}
.sev-HARD{background:var(--sev-hard)}
.sev-EXTREMELY_HARD{background:var(--sev-extreme);color:#160407}
.otype{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg-surface)}
/* ---------- intro ---------- */
.intro-head{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--bg-panel),var(--bg-surface-2));padding:26px 26px 20px;margin-bottom:16px}
.intro-head h1{margin:8px 0 4px;font-size:26px;line-height:1.25}
.intro-head .sub{color:var(--ink-dim);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-dim);background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:34px}
.chip .ic{color:var(--ink-faint)}
.cand{margin-top:12px;font-size:13px;color:var(--ink-faint)}
.intro-sec{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;background:var(--bg-panel);padding:18px 22px;margin-bottom:14px}
.intro-sec.learn{border-left-color:var(--blue)}
.intro-sec.keys{border-left-color:var(--amber)}
.intro-sec.how{border-left-color:var(--green)}
.intro-sec h2{margin:0 0 10px;font-size:15px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.intro-sec.learn p{color:var(--ink-dim);margin:0 0 10px}
.intro-sec.learn p:last-child{margin-bottom:0}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kw-card{background:var(--bg-surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 14px}
.kw-card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.kw-card ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:13.5px}
.kw-card li{margin:2px 0}
.rules{margin:0;padding:0;list-style:none}
.rules li{position:relative;padding:7px 0 7px 26px;color:var(--ink-dim);font-size:14px}
.rules li::before{content:"▸";position:absolute;left:4px;color:var(--green)}
.rules li .dim{color:var(--ink-faint)}
/* ---------- exercise card ---------- */
.excard{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--bg-panel);border:1px solid var(--line);border-left:4px solid var(--blk,var(--blue));border-radius:12px;padding:16px 20px}
.blk-scenario{--blk:var(--blue)}
.blk-question{--blk:var(--amber)}
.blk-answer{--blk:var(--green)}
.blk-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--blk,var(--ink));margin-bottom:10px}
.blk-label .dot{width:8px;height:8px;border-radius:50%;background:var(--blk,var(--ink))}
.ex-title{margin:0 0 8px;font-size:16.5px}
.summary{color:var(--ink-faint);font-size:13.5px;font-style:italic;margin:0 0 8px}
.showfull{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;min-height:32px}
.scen-body p{margin:0 0 10px;color:var(--ink-dim)}
.scen-body p:last-child{margin-bottom:0}
details.artef{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin:10px 0 0}
details.artef summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--blue);user-select:none;min-height:40px;display:flex;align-items:center}
details.artef .artbody{padding:0 14px 12px}
.mono{font-family:var(--mono);font-size:13px;line-height:1.5;color:#c8d8e6;background:var(--bg-surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:0}
table.attable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:0}
table.attable th{background:var(--bg-elev);color:var(--ink);text-align:left}
table.attable th,table.attable td{border:1px solid var(--line-soft);padding:6px 10px;color:var(--ink-dim)}
.q-text{margin:0;font-weight:700;font-size:16px;color:var(--ink)}
/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-height:44px;cursor:pointer;color:var(--ink);font-size:14.5px;font-family:var(--sans);margin:0 0 8px}
.opt:last-child{margin-bottom:0}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}
.opt .mark{font-weight:800;flex-shrink:0}
/* ---------- match ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol h4,.obank h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mleft{flex:1;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;min-height:44px;display:flex;align-items:center}
.mzone{flex:1;background:var(--bg-surface-2);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;min-height:44px;color:var(--ink-faint);font-size:13.5px;cursor:pointer;text-align:left;font-family:var(--sans)}
.mzone.filled{border-style:solid;border-color:var(--blue);color:var(--ink)}
.mzone.dragover{border-color:var(--green)}
.mzone.correct{border-color:var(--green);background:var(--green-soft)}
.mzone.wrong{border-color:var(--red);background:var(--red-soft)}
.mbank{display:flex;flex-direction:column}
.mchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;margin-bottom:8px;cursor:grab;color:var(--ink);font-size:13.5px;text-align:left;font-family:var(--sans)}
.mchip:disabled{cursor:default;opacity:.5}
.mchip.selchip{border-color:var(--amber);background:var(--amber-soft)}
.mchip.used{opacity:.35}
.mhintline{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- order ---------- */
.ordlist{list-style:none;margin:0;padding:0;counter-reset:ord}
.orditem{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.orditem.dragover{border-color:var(--green)}
.orditem .num{font-family:var(--mono);color:var(--amber);font-weight:700;min-width:22px;text-align:center}
.orditem .txt{flex:1;font-size:14px}
.orditem.correct{border-color:var(--green)}
.orditem.wrong{border-color:var(--red)}
.ordbtns{display:flex;gap:4px}
.ordbtns button{min-width:34px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);cursor:pointer;font-size:14px}
.ordbtns button:hover{border-color:var(--blue)}
/* ---------- fill ---------- */
.fillwrap{font-size:15.5px;color:var(--ink-dim);line-height:2.1;white-space:pre-wrap}
.fillin{font-family:var(--mono);font-size:13.5px;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 10px;min-height:38px;width:170px;margin:0 3px}
.fillin:focus{border-color:var(--blue);outline:none}
.fillin.correct{border-color:var(--green)}
.fillin.wrong{border-color:var(--red)}
.fbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:38px;font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer}
.fchip:hover{border-color:var(--amber)}
/* ---------- terminal ---------- */
.term{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:8px;background:var(--bg-elev);padding:8px 12px;font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.term-bar .dots{letter-spacing:3px;color:var(--red)}
.term-out{font-family:var(--mono);font-size:13px;line-height:1.55;color:#c8d8e6;padding:12px 14px;min-height:130px;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term-out .tl-dim{color:var(--ink-faint)}
.term-out .tl-danger{color:var(--red);font-weight:700}
.term-out .tl-echo{color:var(--ink)}
.term-line{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding:10px 14px}
.term-prompt{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--mono);font-size:13px;min-height:34px}
.term-in:focus{outline:none}
details.syntax{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin-top:10px}
details.syntax summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--amber);min-height:40px;display:flex;align-items:center}
details.syntax .artbody{padding:0 14px 12px}
/* ---------- logview ---------- */
.logpanel{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log-tools{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-elev);border-bottom:1px solid var(--line-soft)}
.logfilter{flex:1;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 12px;min-height:38px}
.logfilter:focus{border-color:var(--blue);outline:none}
.log-count{font-size:12px;color:var(--ink-faint);font-family:var(--mono);white-space:nowrap}
.loglines{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#bccfe0;padding:12px 14px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.loglines mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}
.wtitle{font-weight:700;margin:14px 0 10px;color:var(--ink)}
/* ---------- decision ---------- */
.dstep{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.dstep.locked{opacity:.9}
.dlabel{display:inline-flex;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue);border-radius:6px;padding:3px 9px;margin-bottom:8px}
.dprompt{font-family:var(--mono);font-size:13px;color:var(--ink-dim);background:var(--bg-surface-2);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 10px;white-space:pre-wrap}
.dq{font-weight:700;margin:0 0 10px}
.drecorded{color:var(--ink-faint);font-size:13px;margin-top:8px}
.dwhy{font-size:13.5px;color:var(--ink-dim);background:var(--bg-surface-2);border-radius:8px;padding:9px 12px;margin-top:8px}
/* ---------- hint ---------- */
.hintbox{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin-top:12px;color:var(--ink-dim)}
.hintbox .hb{color:var(--amber);font-weight:800;font-size:12px;letter-spacing:.1em;display:block;margin-bottom:4px}
.penaltynote{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- feedback ---------- */
.fb{border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.fb.ok{border-color:var(--green)}
.fb.bad{border-color:var(--red)}
.fb.part{border-color:var(--amber)}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 18px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb.ok .fb-head{background:var(--green-soft);color:var(--green)}
.fb.bad .fb-head{background:var(--red-soft);color:var(--red)}
.fb.part .fb-head{background:var(--amber-soft);color:var(--amber)}
.fb-credit{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim);font-weight:600}
.fb-body{padding:14px 18px;background:var(--bg-panel)}
.fi{display:flex;gap:9px;padding:4px 0;font-size:14px;color:var(--ink-dim)}
.fi .ic{flex-shrink:0;font-weight:800}
.fi.ok .ic{color:var(--green)}
.fi.bad .ic{color:var(--red)}
.fi.miss .ic{color:var(--ink-faint)}
.fi.warn .ic{color:var(--red)}
.fi.warn{color:var(--red);font-weight:600}
.fi.note{color:var(--ink-faint)}
.fb-explain{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:12px;color:var(--ink-dim);font-size:14px}
.fb-explain p{margin:0 0 10px}
.fb-explain p:last-child{margin-bottom:0}
.fb-study{margin-top:10px;font-size:13px;color:var(--blue)}
.fb .mono{margin-top:10px}
/* ---------- actions ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:10px 20px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-family:var(--sans)}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:transparent;color:#04120a}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-amber{background:var(--amber);border-color:transparent;color:#1c1204}
.ghost-note{color:var(--ink-faint);font-size:13px}
/* ---------- review ---------- */
.revlist{display:flex;flex-direction:column;gap:10px}
.revrow{display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex-wrap:wrap}
.revrow .rn{font-family:var(--mono);color:var(--amber);font-weight:700}
.revrow .rt{flex:1;color:var(--ink-dim);font-size:14px;min-width:200px}
.revrow .badge-skip{color:var(--ink-faint);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* ---------- results ---------- */
.res-head{border:1px solid var(--line);border-radius:14px;background:var(--bg-panel);padding:26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ring{width:172px;height:172px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--pct)*1%),var(--bg-elev) 0);display:grid;place-items:center;flex-shrink:0}
.ring .rin{width:134px;height:134px;border-radius:50%;background:var(--bg-panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:34px;font-weight:800;font-family:var(--mono)}
.ring .of{font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
.res-verdict{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.res-verdict.pass{color:var(--green)}
.res-verdict.fail{color:var(--red)}
.res-sub{color:var(--ink-dim);font-size:14px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.statcard{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.statcard .sv{font-size:22px;font-weight:800;font-family:var(--mono)}
.statcard .sv.ok{color:var(--green)}
.statcard .sv.part{color:var(--amber)}
.statcard .sv.bad{color:var(--red)}
.statcard .sv.skip{color:var(--ink-faint)}
.statcard .sl{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.pausereport{border:1px solid var(--line);border-radius:10px;background:var(--bg-panel);padding:12px 16px;color:var(--ink-dim);font-size:13.5px;margin-bottom:14px}
.restable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.restable th{background:var(--bg-elev);text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase}
.restable td{padding:8px 12px;border-top:1px solid var(--line-soft);color:var(--ink-dim)}
.restable td.num{font-family:var(--mono)}
.st-ok{color:var(--green);font-weight:700}
.st-part{color:var(--amber);font-weight:700}
.st-bad{color:var(--red);font-weight:700}
.st-skip{color:var(--ink-faint);font-weight:700}
/* ---------- overlay ---------- */

<script type="application/json" id="cm-exercise-meta">{"attackId":"T1021","attackName":"Remote Services","objectType":"technique","severity":"HARD","topicId":"t1021","batch":3,"title":"T1021 Remote Services — HARD","difficulty":"hard","estimatedMinutes":45,"timerMinutes":45,"questionCount":17,"passMark":70,"learn":["You will handle T1021 at procedure level: the Remote Services technique and the concrete ways adversaries use its services — PsExec-style staging over admin shares, WMI and DCOM execution, WinRM shells, SSH keys, VNC sessions and cloud consoles — chained together to move through an estate.","You will learn the toolset that public reporting documents in real intrusions: the Impacket family, Sysinternals PsExec, built-in Windows management shells, and the SSH client turned pivot. You will also learn what each tool leaves behind on the wire and in the logs.","You will practise the defender side: tiered administration, dedicated jump hosts and privileged access workstations, protocol allow-listing on the firewall, LAPS-rotated local admin passwords, and MFA at every remote door.","In daily work, a detection engineer writes the analytics you tune, an IR lead scopes with them, a threat hunter hunts the near-misses, and a red team tests the same doors under written authorisation. This exam makes you read artefacts from every one of those seats.","Expect harder judgement than the earlier batches: benign-but-alarming and alarming-but-benign cases, near-miss answer options, and chains where two or three concepts interact. Argue both sides before you answer, then commit."],"keywords":[{"theme":"Adversary Procedures & Tooling","items":["Impacket smbexec and wmiexec","Sysinternals PsExec PSEXESVC service","DCOM MMC20.Application execution","WinRM Enter-PSSession shells","SSH authorized_keys staging","VNC screen control"]},{"theme":"Hardening Architecture","items":["tiered admin model","PAW privileged access workstation","jump host with RD Gateway","protocol allow-listing on firewalls","LAPS unique local admin passwords","MFA on remote service logons"]},{"theme":"Detection Signals","items":["7045 service install after type 3 logon","network logon followed by uncommon process","DCOM launch over RPC 135","SSH publickey from a new source","server-to-server 3389 flows"]},{"theme":"Judgement Patterns","items":["benign looks alarming","alarming looks benign","near-miss tool selection","proportionate containment"]}]}</script>

 passwords","MFA on remote service logons"]},{"theme":"Detection Signals","items":["7045 service install after type 3 logon","network logon followed by uncommon process","DCOM launch over RPC 135","SSH publickey from a new source","server-to-server 3389 flows"]},{"theme":"Judgement Patterns","items":["benign looks alarming","alarming looks benign","near-miss tool selection","proportionate containment"]}]};
var EXAMS = [{"id":"e01","type":"mcq","title":"Pick the right Impacket tool","summary":"Semi-interactive shell over SMB with reused hashes.","scenario":"Public reporting documents the Impacket toolkit in intrusions across finance and healthcare: responders find its fingerprints when stolen NTLM hashes are reused against admin shares. In a purple-team debrief you must name the member that gives a semi-interactive shell by creating and driving a Windows service over SMB. One option is from the same toolkit but works over WMI, one runs a single scheduled task, and one dumps credentials instead of giving a shell.","question":"Which Impacket tool matches the described procedure?","hint":"The right name starts with the protocol it abuses.","explanation":"smbexec.py drives a service over SMB — the described procedure. wmiexec.py is the same toolkit but the WMI path, a near-miss that changes the telemetry completely. atexec.py gives you one command per run through a scheduled task, and secretsdump.py extracts credentials — it does not hand you a shell. Tool choice decides which logs you must read afterwards, which is why the debrief insists on precision.","study":"Study the Impacket family and how each member's execution path changes telemetry.","options":["smbexec.py — SMB service shell","wmiexec.py — WMI and DCOM shell","atexec.py — one scheduled-task command","secretsdump.py — remote hash dumping"],"correct":0},{"id":"e02","type":"logview","title":"Read the PsExec-style chain","summary":"Logon, share staging, service install — in one export.","scenario":"NUR-WS031 exported Security events around a suspected PsExec-style hop to HIS-APP07. The runbook wants two facts named exactly: the logon type of the inbound connection and the staged service name. The chain in the export is textbook: network logon, share access, service install, privileged assignment, then the service's process doing work.","question":"Name the inbound logon type and the staged service name:","hint":"No type 10 appears — this move never opens a desktop session.","explanation":"Type 3 network logon plus ADMIN$ share access plus a 7045 service install named PSEXESVC is the PsExec pattern end to end — no desktop session ever opens, which is why type 10 and any RDP answer are wrong. The distractor 'PSEXEC' lacks the SVC suffix the real service carries. This is also the alarming-looks-benign shape: admin activity over admin shares is routine, but the service name and the cmd.exe child make it a lateral-movement signature.","study":"Study the PsExec event chain: 4624 type 3, 5140 on ADMIN$, 7045 PSEXESVC, 4688 children.","filterable":true,"log":{"header":["time","event","detail"],"lines":["23:41:02  4624  Logon Type 3     user=adm_j.wells  src=NUR-WS031  host=HIS-APP07","23:41:03  5140  Share access     share=\\\\HIS-APP07\\ADMIN$  user=adm_j.wells","23:41:05  5140  Share access     share=\\\\HIS-APP07\\IPC$  user=adm_j.wells","23:41:07  7045  Service install  name=PSEXESVC  file=C:\\Windows\\PSEXESVC.exe","23:41:08  4672  Special privileges assigned to adm_j.wells","23:41:12  4688  Process create   parent=PSEXESVC.exe  child=cmd.exe","23:44:30  4688  Process create   parent=cmd.exe  child=whoami.exe","23:44:52  4634  Logoff           user=adm_j.wells  logonid=0x6F3A0"]},"widget":{"type":"fill","question":"Name the inbound logon type and the staged service name:","text":"The inbound logon was type ___ and the staged service name was ___.","blanks":["3","PSEXESVC"],"bank":["3","PSEXESVC","10","PSEXEC","2"]}},{"id":"e03","type":"multi","title":"Artefacts of the admin-share hop","summary":"Select the evidence that separates PsExec from a plain logon.","scenario":"The IR lead asks for the artefact set that distinguishes a PsExec-style lateral move from an ordinary administrator's network logon. Four candidate rows are pinned on the board; three belong to the set, one belongs to ordinary share browsing that happens thousands of times a day. Choose the three that together prove staging plus execution.","question":"Select every artefact that belongs to the PsExec-style set:","hint":"Explorer browsing is background noise on any file server.","explanation":"The set is: a service install named for the tool, an ADMIN$ share session that wrote a file, and a file creation inside the Windows folder — together they show staging plus execution, not just access. Explorer drive browsing creates 5140 events too, but on shares like a home directory, with no service install behind it. Missing any of the three weakens attribution to 'possible', which is not enough for containment.","study":"Study 5140 share-access events and how staging plus execution beats access alone.","options":["7045 service install referencing PSEXESVC","5140 share access to ADMIN$ followed by a write","Sysmon 11 file creation inside C:\\Windows\\","User opening a mapped drive in Explorer"],"correct":[0,1,2]},{"id":"e04","type":"terminal","title":"Enumerate the target's shares","summary":"List shares, including hidden ones, on a remote host.","scenario":"During an authorised purple-team exercise you stand in for the adversary's reconnaissance step: enumerate which shares HIS-APP07 exposes before any staging would happen. The exercise rules forbid changing anything on the target. From OPS-JMP02, list all shares including hidden ones. The lab shell only knows the tools on the panel, and disconnecting sessions or mapping drives breaks the rules.","question":"Run the command that lists all shares on HIS-APP07:","hint":"One command word pairs view with the target; the switch adds hidden shares.","explanation":"net view \\\\HIS-APP07 /all answers the recon question in one line and touches nothing. ADMIN$, C$ and IPC$ are default; clinical$ is the department share an adversary would study next. Using /delete in any form breaks the exercise rules by tearing down connections.\n\nAttacker view: the share list decides where a tool can be staged. Defender view: admin shares reachable from ordinary workstations are the misconfiguration this whole family feeds on.","study":"Study net view reconnaissance and why hidden admin shares should not be reachable from workstations.","prompt":"redteam@OPS-JMP02>","skill":"smb-share-enum","knownTools":["net","nltest","qwinsta","dir","netdom"],"expected":"net view \\\\HIS-APP07 /all","elements":[{"label":"the net view query","any":["net view"]},{"label":"the UNC target \\\\HIS-APP07","any":["\\\\his-app07"]},{"label":"the /all switch for hidden shares","any":["/all"]}],"forbidden":[{"any":["net use * /delete","/delete"],"why":"Deleting connections disrupts the exercise target and other users' live sessions."}],"output":["Share name   Type  Used as  Comment","-----------------------------------","ADMIN$       Disk           Remote Admin","C$           Disk           Default share","IPC$         IPC            Remote IPC","clinical$    Disk           Department data","The command completed successfully."]},{"id":"e05","type":"decision","title":"Decision tree — DCOM spawn on the app server","summary":"MMC20.Application launches cmd.exe remotely: three steps.","scenario":"HIS-APP07 logged a DCOM activation from OPS-JMP02 under adm_j.wells that spawned cmd.exe through the MMC20.Application COM object — a procedure public reporting documents as a common alternative to PsExec. The account is a legitimate admin who works from the jump host daily, but this launch method is new for the environment. Work the three steps.","question":"Work through the three decision steps for the DCOM launch:","hint":"The mechanism leaves no desktop session — that absence is your evidence.","explanation":"Confirmation leans on absence: remote DCOM produces RPC activation and a spawned process without a type 10 anywhere. Scoping turns one launch into either an event or a pattern. Hardening narrows activation rights instead of breaking DCOM everywhere — servers run on COM.\n\nAttacker view: DCOM is attractive because it skips admin shares and service installs entirely. Defender view: allow-list which identities may activate remote COM, and alert on shells born from COM objects.","study":"Study DCOM lateral movement and its RPC-based telemetry gap versus PsExec.","steps":[{"label":"STEP 1 OF 3 — confirm the mechanism","prompt":"Parent process: MMC20.Application spawned cmd.exe on HIS-APP07 from OPS-JMP02 over RPC.","question":"Which check confirms a remote DCOM launch rather than a local admin tool?","options":["RPC/DCOM activation events on HIS-APP07 paired with no interactive 4624 type 10 on either host","A screenshot from OPS-JMP02","Restarting HIS-APP07 and watching for a repeat"],"correct":0,"why":"DCOM launches ride RPC without any remote desktop session, so the missing type 10 plus activation events is the tell."},{"label":"STEP 2 OF 3 — scope","prompt":"The mechanism is confirmed remote DCOM under a daily-use admin account.","question":"What decides whether this is one test or a pattern?","options":["Search the last 30 days for MMC20.Application or DCOM shells from any workstation to any server","Ask the admin to stop using the jump host for a week","Only re-check HIS-APP07 tomorrow"],"correct":0,"why":"A 30-day search separates a one-off test from an emerging pattern across hosts."},{"label":"STEP 3 OF 3 — harden","prompt":"History: single occurrence; the admin confirms they tested a new deployment script.","question":"Which action reduces the risk without breaking admin work?","options":["Restrict remote DCOM activation to the admin tier, keep OPS-JMP02 as the only source, and alert on COM-spawned shells","Disable DCOM on every server tonight","Remove the admin from the jump host"],"correct":0,"why":"Narrowing who may activate DCOM remotely keeps the admin path while cutting off the generic abuse route."}]},{"id":"e06","type":"fill","title":"Complete the allow-listing rule","summary":"Firewall base policy and the brokered desktop path.","scenario":"The network team writes the new base policy for lateral-movement ports after the DCOM case. The principle: fail closed, allow the sanctioned admin path only, and broker desktop sessions through the remote desktop gateway rather than exposing 3389 host-by-host. Two words are missing from the policy line that everyone will quote in audits.","question":"Complete the policy line with the two missing words:","hint":"One word is the default action; the other is the two-letter abbreviation on the gateway product.","explanation":"Deny by default is the whole point of allow-listing: everything not on the list fails closed. The RD Gateway brokers RDP over 443 so hosts never expose raw 3389 to workstations. 'Allow' inverts the policy, VPN is remote-user access rather than host-to-host brokering, and SSH is a different protocol entirely. Two words carry the architecture.","study":"Study allow-listing design for 3389/5985 and what RD Gateway changes about exposure.","text":"The base policy is ___ by default: only OPS-JMP02 may reach TCP 3389 and TCP 5985, and workstation desktop sessions are brokered through the ___ gateway.","blanks":["deny","RD"],"bank":["deny","RD","allow","VPN","SSH"]},{"id":"e07","type":"mcq","title":"screensharingd awake at 03:11","summary":"A Mac screen-sharing process at night on a designer's desk.","scenario":"EDR raises a medium: screensharingd active on MAC-DES09 at 03:11, connection from LAB-MAC09, user r.voss. The design team swears nobody works that late, and Screen Sharing is normally disabled by policy. Before you escalate, you check the device-management export: LAB-MAC09 is the new staging laptop for the video team, and it received an approved one-week exception that enables remote management for a render pipeline. The exception ticket is signed and expires in five days.","question":"Which handling fits the evidence?","hint":"A signed exception with an expiry changes the default action.","explanation":"This is the alarming-looks-benign inverse: night-time screen sharing reads hostile, but a signed, expiring exception plus a known source host makes it sanctioned — for five days. The right handling keeps the case open until expiry and alerts if the pattern outlives the ticket, which would flip it back to hostile. Isolation or wiping punishes a documented exception, and a fleet-wide profile change breaks support workflows for everyone.","study":"Study Apple Remote Desktop and screensharingd telemetry, plus exception lifecycle tracking.","options":["Track the exception; alert on drift after expiry","Escalate as a confirmed intrusion and isolate both Macs","Wipe LAB-MAC09; night sharing is always hostile","Disable the management profile fleet-wide"],"correct":0},{"id":"e08","type":"logview","title":"SSH keys on the move","summary":"Find who staged the key and from where it was used.","scenario":"FS-HR02 (Linux HR file server) exported auth and audit lines for one evening. The baseline: svc_hr syncs from HR-APP01 with a password; root never logs in interactively. Somewhere in the noise, a key gets added to root's authorized_keys and is then used from another host. The noise: routine cron, log rotation, a backup pull. Name the staging action and the use source for the timeline.","question":"Which pair names the key-staging action and the key-use source?","hint":"The audit APPEND line and the publickey line belong to the same key.","explanation":"adm_t.reyes used sudo tee to append to root's authorized_keys — the audit APPEND confirms it — and later DEV-WS118 logged in as root with a publickey. That is an SSH-key pivot: stage a key, use it from another host. svc_hr's password logon is baseline, the backup pull is noise, and the cron lines are routine. This one is alarming-looks-benign: an admin account touching SSH config feels routine until root uses it from a workstation.","study":"Study authorized_keys abuse and the sudo plus audit lines that expose it.","filterable":true,"log":{"header":["time","source","message"],"lines":["20:15:02  cron     rotate-logs.sh completed on FS-HR02","21:02:44  sshd     Accepted password for svc_hr from HR-APP01 port 40122","21:03:10  sudo     adm_t.reyes : COMMAND=/usr/bin/tee /root/.ssh/authorized_keys","21:03:12  audit    PATH name=/root/.ssh/authorized_keys op=APPEND","21:04:05  cron     backup-pull from BK-LNX01 finished","22:47:31  sshd     Accepted publickey for root from DEV-WS118 port 51044","22:47:33  systemd  Started Session 214 of user root.","22:51:02  sshd     Received disconnect from DEV-WS118 port 51044","23:00:00  cron     nightly integrity scan started"]},"widget":{"type":"mcq","question":"Which pair names the key-staging action and the key-use source?","options":["adm_t.reyes appended the key; DEV-WS118 used it as root","svc_hr synced the key from HR-APP01 to root","BK-LNX01 staged the key during the backup pull","No key activity appears in this export"],"correct":0}},{"id":"e09","type":"match","title":"Match tool to transport","summary":"Which wire each lateral-movement tool actually uses.","scenario":"The detection catalogue needs a quick card: which transport does each documented tool ride, because the wire decides which sensor sees it. Four tools, four transports — no repeats. The tools come from public reporting and vendor guides; the transports are SMB, RPC, WinRM and SSH tunnelling. Misplacing one pair sends juniors hunting in the wrong log for weeks.","question":"Match each tool to the transport it uses:","hint":"Two tools are Microsoft-native, two come from other toolkits.","explanation":"PsExec stages over SMB and controls services through the service manager; wmiexec.py rides WMI's RPC endpoints with 135 as the broker port; Enter-PSSession is the native WinRM client on 5985; and ssh -L forwards a local port through an SSH tunnel. Pairing a tool with the wrong transport means watching a sensor that will never see the traffic.","study":"Study the tool-transport-telemetry triangle: the transport tells you which sensor to tune.","pairs":[{"left":"PsExec","right":"SMB admin shares plus service control"},{"left":"wmiexec.py","right":"WMI over RPC (TCP 135)"},{"left":"Enter-PSSession","right":"WinRM over TCP 5985"},{"left":"ssh -L 8443","right":"SSH local port forward"}]},{"id":"e10","type":"multi","title":"Controls that break credential reuse","summary":"Select the controls that cut stolen-credential lateral movement.","scenario":"After the DCOM and SSH cases, the hardening board asks which proposed controls actually break the credential-reuse path that remote services depend on. Four of six proposals do; two merely look technical and change nothing about reuse. Choose the four that belong in the plan.","question":"Select every control that actually breaks credential reuse:","hint":"Reuse dies when every host's secret differs, or when a password alone is not enough.","explanation":"LAPS makes one stolen local hash useless elsewhere; tiering stops tier 0 credentials from ever touching lower tiers; MFA means a password alone cannot open the door; SMB signing blocks tampering and relay-style reuse. Password length alone does not stop reuse — the same long password on fifty hosts is still one credential — and jump-host memory is plumbing. This is the core hardening set for the whole T1021 family.","study":"Study LAPS, tiered administration and the mitigations ATT&CK lists for T1021.","options":["LAPS-rotate unique local admin passwords","Tier 0 accounts never log into tier 1 or tier 2","MFA on every remote service logon","Require SMB signing through Group Policy","Double password length for domain admins","Add more memory to the jump hosts"],"correct":[0,1,2,3]},{"id":"e11","type":"terminal","title":"Open the sanctioned remoting session","summary":"Connect the analyst shell to the jump host over WinRM.","scenario":"You are validating the new SOC workflow: analysts may only administer HIS-APP07 through OPS-JMP02, and the validation asks you to open an interactive PowerShell remoting session to the jump host from your PAW. The lab shell knows the native cmdlet. Keep it to the connection itself — no commands that delete or format anything, and no credential flags; the lab is pre-authenticated.","question":"Run the command that opens the remoting session to OPS-JMP02:","hint":"The cmdlet literally says enter and session; point it at the host.","explanation":"Enter-PSSession -ComputerName OPS-JMP02 opens the sanctioned WinRM shell — the workflow's only approved admin path. Invoke-Command runs one script block and exits, a different shape. The forbidden patterns (recursive deletes, volume formats) are the near-miss traps: inside a remoting session they strike remote hosts.\n\nAttacker view: WinRM shells look exactly like admin work, which is why source restrictions matter. Defender view: allow-list which PAWs may open 5985 at all.","study":"Study Enter-PSSession versus Invoke-Command and WinRM listener hardening.","prompt":"PS C:\\Users\\d.engineer>","skill":"winrm-pssession","knownTools":["Enter-PSSession","Invoke-Command","Exit-PSSession","Test-WSMan"],"expected":"Enter-PSSession -ComputerName OPS-JMP02","elements":[{"label":"the Enter-PSSession cmdlet","any":["enter-pssession"]},{"label":"the -ComputerName switch","any":["-computername"]},{"label":"the jump host OPS-JMP02","any":["ops-jmp02"]}],"forbidden":[{"any":["Remove-Item -Recurse","Format-Volume","-ScriptBlock { Remove-Item"],"why":"Destructive pipelines inside a remoting session wreck the target — the one thing validation forbids."}],"output":[" Id  Name            ComputerName    State"," --  ----            ------------    -----","  3  Session3        OPS-JMP02       Opened","[OPS-JMP02]: PS C:\\Users\\d.engineer\\Documents>","Connected over WinRM (TCP 5985)."]},{"id":"e12","type":"decision","title":"Decision tree — the patch sweep with one outlier","summary":"Fifteen normal targets, one host outside the allow-list.","scenario":"02:00 patch window: svc_patch opens WinRM sessions to fifteen servers from OPS-JMP02 — the nightly norm — but session sixteen targets PRINT-DOC03, which is not on the patch allow-list and never had WinRM enabled before. The patch team is mid-run and unreachable; disabling the account mid-window would break the fifteen legitimate sessions. Signals conflict. Work the three steps.","question":"Work through the three decision steps for the patch sweep outlier:","hint":"The outlier is one host; the proportionate action should also be one host.","explanation":"The sweep is alarming-looks-benign at scale — fifteen normal sessions hiding one staging change. Comparison isolates the outlier, persistence checks upgrade or downgrade it, and a single-host block acts without nuking the sanctioned window. Broad disables punish fifteen good sessions for one bad host, and waiting ignores a fresh listener change.\n\nAttacker view: piggyback a scheduled window to blend in. Defender view: alert when a target falls outside the change allow-list.","study":"Study allow-list-aware detections and surgical containment during live windows.","steps":[{"label":"STEP 1 OF 3 — compare","prompt":"Fifteen sessions match the baseline; the sixteenth hits PRINT-DOC03, off the allow-list.","question":"What is the fastest discriminating check?","options":["Compare PRINT-DOC03's listener state and local logons before tonight with the other fifteen hosts","Isolate all sixteen targets at once","Assume the patch tool misread its config and wait"],"correct":0,"why":"One host's before/after listener state shows whether WinRM was newly enabled — a staging sign."},{"label":"STEP 2 OF 3 — watch the outlier","prompt":"PRINT-DOC03 had WinRM enabled at 01:58 by an unknown local change.","question":"Which follow-on artefact would upgrade this to confirmed abuse?","options":["A new local admin account or scheduled task created on PRINT-DOC03 after 02:00","The printer queue clearing itself","A user printing at 09:00"],"correct":0,"why":"Persistence artefacts after a staging change are the upgrade signal; printer noise is not."},{"label":"STEP 3 OF 3 — act without breaking the window","prompt":"No persistence yet; the outlier is contained to one host.","question":"Which action fits?","options":["Block OPS-JMP02 to PRINT-DOC03 only, keep the fifteen live sessions, and page the patch owner","Disable svc_patch immediately, killing the fifteen good sessions","Reboot PRINT-DOC03 and continue the window"],"correct":0,"why":"A surgical block stops the staging path while the legitimate window finishes."}]},{"id":"e13","type":"fill","title":"Complete the port-chain card","summary":"RPC broker port, dynamic range, WinRM default.","scenario":"The DCOM case taught the team that one number brokers everything: the RPC endpoint mapper. The card you are finishing names that broker port, the range where modern Windows lands DCOM's high port, and the WinRM HTTP default for contrast. Fill the three gaps so the card can be printed for the SOC wall.","question":"Complete the port-chain card with the three missing numbers:","hint":"The endpoint mapper is a low, famous number; the dynamic range starts just under fifty thousand.","explanation":"TCP 135 is the RPC endpoint mapper that brokers DCOM activations; the actual service then lands on a high dynamic port, 49152 and above on modern Windows. WinRM keeps a fixed 5985 for HTTP, which is why allow-listing WinRM is easy while DCOM is not. 445 is SMB and 22 is SSH — different services, same family, different rules.","study":"Study the RPC dynamic port range and why DCOM allow-listing is harder than WinRM's.","text":"DCOM activations meet the RPC endpoint mapper on TCP ___, then negotiate a high port in the ___ range, while WinRM's plain HTTP listener stays fixed on TCP ___.","blanks":["135","49152","5985"],"bank":["135","49152","5985","445","50000","22"]},{"id":"e14","type":"logview","title":"Count the sweep before the hop","summary":"How many 445 targets preceded the first 3389 flow.","scenario":"Flow records for NUR-WS031 cover one hour. The pattern public reporting calls 'stage then move' is in there: a burst of SMB contacts across the clinical subnet, then one desktop session. The scanner NOC-SCAN01 also sweeps in the same hour — that noise is exactly why the note needs numbers, not vibes. Count carefully.","question":"Complete the note with the distinct-host count and the first RDP target:","hint":"Count each destination once, and only rows before the 01:03:02 line.","explanation":"Before 01:03:02, NUR-WS031 touched HIS-APP07, FS-HR02, PRINT-DOC03 and DB-SQL02 on 445 — four distinct hosts — then opened 3389 back to HIS-APP07, the first target it probed. The scan rows are noise from NOC-SCAN01 on 443 and 22, a different source entirely. This is the stage-then-move shape: share probing first, desktop session after.","study":"Study NetFlow triage: distinct-destination counts per source and port.","filterable":true,"log":{"header":["time","src","dst","dport"],"lines":["01:02:11  NUR-WS031   HIS-APP07    445","01:02:14  NUR-WS031   FS-HR02      445","01:02:19  NOC-SCAN01  HIS-APP07    443","01:02:31  NUR-WS031   PRINT-DOC03  445","01:02:44  NUR-WS031   DB-SQL02     445","01:03:02  NUR-WS031   HIS-APP07    3389","01:03:20  NOC-SCAN01  FS-HR02      22","01:04:11  NUR-WS031   FS-HR02      445"]},"widget":{"type":"fill","question":"Complete the note with the distinct-host count and the first RDP target:","text":"NUR-WS031 contacted ___ distinct hosts on 445 before its first 3389 flow, which went to ___.","blanks":["4","HIS-APP07"],"bank":["4","HIS-APP07","5","FS-HR02","3"]}},{"id":"e15","type":"fill","title":"Complete the tiering sentence","summary":"Which tiers may never mix, in one training-deck line.","scenario":"The security awareness deck needs one sentence that explains the tiered admin model without jargon. Two tier labels are missing. The rule the sentence must carry: the highest tier never walks downwards, and server-tier credentials never walk onto desks, so one stolen password cannot work everywhere at once.","question":"Complete the tiering sentence for the training deck:","hint":"The highest tier governs the domain; the tier below it governs servers.","explanation":"Tier 0 holds domain-wide assets such as domain controllers, so tier 0 administrators never log into workstations where those credentials would be cached. Tier 1 covers servers, and tier 1 credentials must never sign into tier 2 assets — the workstations — or a compromised desk yields server keys. 'Tier 2' in the first gap inverts the direction, and 'domain' or 'server tier' name assets, not admin tiers.","study":"Study the tier 0 / tier 1 / tier 2 model and credential exposure direction.","text":"A ___ administrator never logs into workstations, and ___ admin accounts never sign into tier 2 assets, so one stolen password cannot walk everywhere.","blanks":["tier 0","tier 1"],"bank":["tier 0","tier 1","tier 2","server tier","domain"]},{"id":"e16","type":"decision","title":"Decision tree — open VNC on the lab host","summary":"Unauthenticated VNC in a segmented lab: three steps.","scenario":"A vulnerability scan flags LAB-PENT02 serving VNC on 5900 with no authentication, reachable only from the lab VLAN. The lab owner says the image is a training target rebuilt weekly. Last week the same scan flagged it, and nothing changed since. Meanwhile the firewall team found one outbound 5900 connection from the lab to a vendor subnet last night, unexplained. Work the three steps.","question":"Work through the three decision steps for the lab VNC finding:","hint":"One signal is benign-by-design, one is unexplained — treat them differently.","explanation":"The unauthenticated VNC is benign-by-design inside a segmented lab, but the outbound flow was the real question — and cheap correlation cleared it against a booking. The durable fixes are small: authenticated VNC images and an egress alert on 5900. Ripping VNC out fleet-wide over-responds to a contained finding; closing without fixes invites the same scare next quarter.","study":"Study segmentation boundaries, egress monitoring on 5900 and finding lifecycle.","steps":[{"label":"STEP 1 OF 3 — verify the boundary","prompt":"VNC unauthenticated on 5900, reachable only inside the lab VLAN per the scan.","question":"What confirms the exposure boundary is real?","options":["Pull the lab VLAN firewall policy and confirm no 5900 rule reaches production or the internet","Trust the lab owner's word alone","Rescan from a production workstation"],"correct":0,"why":"Policy plus a scan from outside proves the boundary instead of trusting one source."},{"label":"STEP 2 OF 3 — chase the outlier","prompt":"The boundary holds, but one outbound 5900 flow to a vendor subnet appeared last night.","question":"What does that outbound flow most likely need?","options":["A check against vendor sessions and the lab booking calendar before calling it hostile","An immediate production-wide VNC ban","Nothing; labs are always noisy"],"correct":0,"why":"One unexplained outbound flow needs one cheap correlation before escalation or dismissal."},{"label":"STEP 3 OF 3 — decide","prompt":"The vendor confirms a scheduled remote-training session; the booking matches the timestamp.","question":"Which action fits?","options":["Record as sanctioned, require VNC authentication in lab images, and alert on any 5900 leaving the lab VLAN","Rip VNC out of every lab image tonight","Close the finding and never rescan"],"correct":0,"why":"Sanctioned-but-fragile: keep the finding, fix the control, and monitor the boundary."}]},{"id":"e17","type":"order","title":"Order the containment workflow","summary":"Scope before you pull the plug — the responder's order.","scenario":"The DCOM case is confirmed: adm_j.wells' credentials were reused from a workstation that is not the jump host. You lead containment for the night. Five cards cover the workflow: know the blast radius, stop the movement, keep the evidence, remove the foothold, then make the door harder next time. The order protects both uptime and the case file.","question":"Arrange the five containment steps in responder order:","hint":"Evidence expires before your memory does — export before you clean.","explanation":"Scoping first defines what 'everything' means; containment then stops new movement without guessing the radius. Preservation comes before eradication because cleanup rotates or overwrites exactly the logs you will need in the review. Eradication removes what the adversary staged, and hardening makes the door they used narrower. Cleaning before exporting is the classic self-inflicted evidence loss.","study":"Study incident-containment ordering and evidence volatility during lateral-movement cases.","items":["Scope: list every host the account touched in 72 hours","Contain: disable the account and block the offending source path","Preserve: export the relevant logs before they rotate","Eradicate: remove staged services, keys and tasks","Harden: tighten remote-service allow-lists and add the alert"]}];

/* ==== utils ==== */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function norm(s){
  return String(s == null ? "" : s).toLowerCase().replace(/\s+/g," ").replace(/[.,;:!]+$/,"").trim();
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function fmt1(n){ return (Math.round(n * 100) / 100).toFixed(1); }
function wordCount(s){ return String(s || "").split(/\s+/).filter(Boolean).length; }
function $(id){ return document.getElementById(id); }
function byClass(root, cls){ return root.getElementsByClassName(cls); }

/* ==== timer ==== */
function setTimerState(next){
  var now = Date.now();
  if(S.tStateAt != null){
    var dt = (now - S.tStateAt) / 1000;
    if(S.tState === "PAUSED_MANUAL") S.pauseManual += dt;
    if(S.tState === "PAUSED_AUTO_CHECK") S.pauseAutoCheck += dt;
  }
  S.tState = next;
  S.tStateAt = now;
  updateHeader();
}
setInterval(function(){
  if(S.tState === "RUNNING"){
    S.remaining -= 1;
    S.elapsed += 1;
    if(S.remaining <= 0){
      S.remaining = 0;
      updateClock();
      finish();
      return;
    }
    updateClock();
  }
}, 1000);
function updateClock(){ var c = $("tb-clock"); if(c) c.textContent = fmtClock(S.remaining); }

function sevClass(){ return "sev-" + META.severity; }
function curPos(){ return S.order[S.idx]; }
function answeredCount(){
  var n = 0;
  for(var k in S.checked){ if(Object.prototype.hasOwnProperty.call(S.checked, k)) n++; }
  return n;
}

  return S.skipList.filter(function(i){ return !S.checked[i]; });

  var counter = $("tb-counter"), stateEl = $("tb-state");

  if(S.screen === "exam" || S.screen === "review"){
    counter.textContent = (S.phase === "review" && S.reviewPos >= 0)
      ? ("Review " + (S.reviewPos + 1) + " / " + (S.reviewTotal || pendingSkips().length))
      : ((S.phase === "review") ? ("Review pool: " + pendingSkips().length)
      : ("Exercise " + (S.idx + 1) + " / " + total));
  } else {
    counter.textContent = "Exercises " + done + " / " + total;
  }
  var sev = $("tb-sev");
  sev.className = "badge " + sevClass();
  sev.textContent = META.severity.replace("_", " ");
  updateClock();
  $("tb-scoreval").textContent = fmt1(S.score);
  $("progbar").style.width = (total ? (done / total * 100) : 0) + "%";
  /* state chip */
  if(S.tState === "PAUSED_MANUAL"){
    stateEl.hidden = false;
    stateEl.className = "tb-state manual";
    stateEl.innerHTML = '<span aria-hidden="true">⏸</span> Paused (manual)';
  } else if(S.tState === "PAUSED_AUTO_CHECK"){
    stateEl.hidden = false;
    stateEl.className = "tb-state autocheck";
    stateEl.innerHTML = '<span aria-hidden="true">⏸</span> Auto-paused — checking';
  } else {
    stateEl.hidden = true;
  }
  /* buttons */
  var ex = curPos();
  var inExercise = (S.screen === "exam" || S.screen === "review") && ex != null && S.tState !== "ENDED";
  $("btn-hint").disabled = !inExercise || S.checked[ex] != null || S.hintsUsed[ex] === true;
  $("btn-skip").disabled = !inExercise || S.checked[ex] != null || S.phase === "review";
  $("btn-pause").disabled = !(S.tState === "RUNNING" || S.tState === "PAUSED_AUTO_CHECK");
}

/* ==== postMessage integration ==== */
window.addEventListener("message", function(ev){
  var d = ev.data;
  if(!d || typeof d !== "object") return;
  if(d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT"){
    S.init = d;
    var slot = $("candline");
    if(slot && d.username){
      slot.textContent = "Candidate: " + d.username + (d.country ? " · " + d.country : "");
      slot.style.display = "block";
    }
  }
});
function postScore(){
  if(S.scorePosted) return;
  S.scorePosted = true;
  var rounded = Math.round(S.score);
  var total = 0, i;
  for(i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null) total++;
  }
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var msg = {
    type: "CYBERPULSE_SCORE",
    topicId: META.topicId,
    batch: META.batch,
    score: rounded,
    total: total,
    percent: percent,
    passed: passed
  };
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage(msg, location.origin);
    }
  }catch(e){ /* standalone file:// — no parent handshake */ }
}

/* ==== answer defaults ==== */
function defaultAnswer(ex){
  var i, d;
  switch(ex.type){
    case "mcq": return { sel: -1 };
    case "multi": return { sel: [] };
    case "match":
      d = []; for(i = 0; i < ex.pairs.length; i++) d.push(-1); return { assign: d };
    case "order":
      d = []; for(i = 0; i < ex.items.length; i++) d.push(i);
      return { seq: shuffle(d) };
    case "fill":
      d = []; for(i = 0; i < ex.blanks.length; i++) d.push(""); return { vals: d };
    case "terminal": return { cmd: "" };
    case "logview": return { w: defaultAnswer(ex.widget) };
    case "decision":
      d = []; for(i = 0; i < ex.steps.length; i++) d.push(-1); return { steps: d, cursor: 0 };
  }
  return {};
}
function ensureAnswer(ex, i){
  if(S.answers[i] == null) S.answers[i] = defaultAnswer(ex);
  return S.answers[i];
}

function scenInner(ex){
  var out = "";
  var paras = String(ex.scenario).split(/\n\n+/);
  for(var p = 0; p < paras.length; p++) out += "<p>" + esc(paras[p]) + "</p>";
  if(ex.artefacts && ex.artefacts.length){
    for(var a = 0; a < ex.artefacts.length; a++){
      var art = ex.artefacts[a];
      var long = String(art.content || "").split("\n").length > 25;
      out += '<details class="artef"' + (long ? "" : " open") + '><summary>' + esc(art.label) + '</summary><div class="artbody">' + artefactBody(art) + "</div></details>";
    }
  }
  return out;
}
function artefactBody(art){
  if(art.kind === "table"){
    var rows = String(art.content).split("\n");

  return '<pre class="mono">' + esc(art.content) + "</pre>";
}

function renderChoice(ex, root, ans, lock, res, isMulti, path){
  var correct = isMulti ? ex.correct : [ex.correct];
  ex.options.forEach(function(opt, oi){
    var chosen = isMulti ? ans.sel.indexOf(oi) !== -1 : ans.sel === oi;
    var mark = "", cls = "";
    if(!lock){
      if(chosen){ mark = isMulti ? "☑" : "◉"; cls = "sel"; }
    } else {
      var isCorr = correct.indexOf(oi) !== -1;
      if(isCorr){ mark = "✓"; cls = "correct"; }
      else if(chosen){ mark = "✗"; cls = "wrong"; }
      else { cls = "dim"; }
    }
    root.insertAdjacentHTML("beforeend", optionRow(opt, oi, chosen, mark, cls));
  });
  var btns = byClass(root, "opt");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      btn.addEventListener("click", function(){
        if(lock) return;
        var oi = parseInt(btn.getAttribute("data-i"), 10);
        if(isMulti){
          var p = ans.sel.indexOf(oi);
          if(p === -1) ans.sel.push(oi); else ans.sel.splice(p, 1);
          btn.classList.toggle("sel");
          btn.setAttribute("aria-pressed", btn.classList.contains("sel") ? "true" : "false");
          btn.querySelector(".mark").textContent = btn.classList.contains("sel") ? "☑" : "";
        } else {
          ans.sel = oi;
          for(var z = 0; z < btns.length; z++){
            btns[z].classList.remove("sel");
            btns[z].setAttribute("aria-pressed", "false");
            var mk = btns[z].querySelector(".mark"); if(mk) mk.textContent = "";
          }
          btn.classList.add("sel");
          btn.setAttribute("aria-pressed", "true");
          btn.querySelector(".mark").textContent = "◉";
        }
      });
    })(btns[b]);
  }
}
function renderMatch(ex, root, ans, lock, res){
  var n = ex.pairs.length;
  var chipSel = -1;
  var html = '<div class="mgrid"><div class="mcol"><h4>Items</h4>';
  for(var z = 0; z < n; z++){
    html += '<div class="mrow"><div class="mleft">' + esc(ex.pairs[z].left) + '</div>' +
            '<button type="button" class="mzone" data-z="' + z + '" aria-label="Assigned value for ' + esc(ex.pairs[z].left) + '">— drop here —</button></div>';
  }
  html += '</div><div class="mbank"><h4>Answer bank</h4>';
  ex.pairs.forEach(function(pr, ri){
    html += '<button type="button" class="mchip" draggable="true" data-r="' + ri + '">' + esc(pr.right) + "</button>";
  });

  function paint(){

        zz.classList.add("filled");

          zz.classList.add(v === z ? "correct" : "wrong");

      }

      chips[c].classList.toggle("used", used);
      if(used) chips[c].classList.remove("selchip");
    }
  }
  function assign(z, r){
    if(r === -1) return;
    for(var k = 0; k < n; k++){ if(ans.assign[k] === r) ans.assign[k] = -1; }
    ans.assign[z] = r;
    chipSel = -1;
    paint();
  }
  for(var zi = 0; zi < zones.length; zi++){
    (function(z){
      var zz = zones[z];
      zz.addEventListener("click", function(){
        if(lock) return;
        if(chipSel !== -1) assign(z, chipSel);
        else if(ans.assign[z] !== -1){ ans.assign[z] = -1; paint(); }
      });
      zz.addEventListener("dragover", function(e){ if(!lock){ e.preventDefault(); zz.classList.add("dragover"); } });
      zz.addEventListener("dragleave", function(){ zz.classList.remove("dragover"); });
      zz.addEventListener("drop", function(e){
        e.preventDefault(); zz.classList.remove("dragover");
        if(lock) return;
        var r = parseInt(e.dataTransfer.getData("text/plain"), 10);
        if(!isNaN(r)) assign(z, r);
      });
    })(zi);
  }
  for(var ci = 0; ci < chips.length; ci++){
    (function(c){
      var cc = chips[c];
      cc.addEventListener("click", function(){
        if(lock) return;
        if(chipSel === c){ chipSel = -1; cc.classList.remove("selchip"); }
        else {
          chipSel = c;
          for(var k = 0; k < chips.length; k++) chips[k].classList.remove("selchip");
          cc.classList.add("selchip");
        }
      });
      cc.addEventListener("dragstart", function(e){
        e.dataTransfer.setData("text/plain", String(c));
        e.dataTransfer.effectAllowed = "copy";
      });
    })(ci);
  }
  paint();
}
function renderOrder(ex, root, ans, lock, res){
  root.innerHTML = '<div class="obank"><h4>Steps — put them in the correct order</h4><ol class="ordlist"></ol>' +
    '<p class="mhintline">Drag a step onto another step, or use ▲ / ▼.</p></div>';
  var list = root.querySelector(".ordlist");
  function paint(){
    list.innerHTML = "";
    ans.seq.forEach(function(itemIdx, pos){
      var li = document.createElement("li");
      li.className = "orditem";
      li.setAttribute("draggable", "true");
      li.setAttribute("data-pos", String(pos));
      var mark = "";
      if(lock) mark = itemIdx === pos ? " ✓" : "";
      li.innerHTML = '<span class="num">' + (pos + 1) + '</span><span class="txt">' + esc(ex.items[itemIdx]) + mark + "</span>" +
        '<span class="ordbtns"><button type="button" data-mv="up" aria-label="Move up" ' + (lock ? "disabled" : "") + ">▲</button>" +
        '<button type="button" data-mv="down" aria-label="Move down" ' + (lock ? "disabled" : "") + ">▼</button></span>";
      if(lock) li.classList.add(itemIdx === pos ? "correct" : "wrong");
      list.appendChild(li);
      li.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", String(pos)); });
      li.addEventListener("dragover", function(e){ if(!lock) e.preventDefault(); });
      li.addEventListener("drop", function(e){
        e.preventDefault();
        if(lock) return;
        var from = parseInt(e.dataTransfer.getData("text/plain"), 10);
        var to = parseInt(li.getAttribute("data-pos"), 10);
        if(!isNaN(from) && !isNaN(to) && from !== to) move(from, to);
      });
    });
    var btns = list.querySelectorAll("button[data-mv]");
    for(var b = 0; b < btns.length; b++){
      (function(btn){
        btn.addEventListener("click", function(){
          if(lock) return;
          var li = btn.closest(".orditem");
          var pos = parseInt(li.getAttribute("data-pos"), 10);
          var dir = btn.getAttribute("data-mv") === "up" ? pos - 1 : pos + 1;
          if(dir < 0 || dir >= ans.seq.length) return;
          move(pos, dir);
        });
      })(btns[b]);
    }
  }
  function move(from, to){
    var it = ans.seq.splice(from, 1)[0];
    ans.seq.splice(to, 0, it);
    paint();
  }
  paint();
}
