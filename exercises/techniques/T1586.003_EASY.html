<script id="cm-exercise-meta" type="application/json">{"topicId":"t1586.003","batch":1,"difficulty":"easy","passMark":70,"questionCount":15,"estimatedMinutes":20}</script>
<script id="exam-data" type="application/json">{"config":{"title":"T1586.003 EASY exam - Compromise Accounts: Cloud Accounts","sevName":"EASY","passMark":70,"estimatedMinutes":20,"budgetSeconds":1200,"introLearn":["T1586.003 is a <b>sub-technique<\/b> in the MITRE ATT&amp;CK framework. ATT&amp;CK is a public catalogue that describes what real attackers do. The full name of this entry is <b>Compromise Accounts: Cloud Accounts<\/b>. It sits in the <b>Resource Development<\/b> tactic. That tactic covers the things attackers prepare before they attack a target.","In this exam you learn what a cloud account is and why attackers want one. You learn the common ways an account gets stolen: phishing pages for passwords, bought passwords, MFA push spam (many approval prompts until a tired user taps Approve), and SIM swaps. You also learn what attackers build with a stolen account: virtual machines, storage buckets, mail sending, and new access keys.","You also learn the defender side. You learn which logs show what a cloud account did, which signs point to a stolen account, and which simple control stops most password phishing. All words are explained in short and simple sentences."],"keywords":["cloud account","Resource Development","phishing","MFA","MFA fatigue","session cookie","access key","CloudTrail","defanged indicator","virtual machine","storage bucket","AWS","Azure"],"introHow":["<b>Passing score.<\/b> You need 70% or more to pass. Each exercise gives 1 point. Exercises with several correct parts give part marks.","<b>Exercise types.<\/b> You will see single-choice questions, multi-select questions, one matching task, and one fill-in-the-blank task.","<b>Timer.<\/b> Your budget is 20 minutes. Press <b>Pause<\/b> to stop the clock at any time; press Resume to continue. When you press <b>Check<\/b>, the clock stops by itself while you read the feedback, and starts again when you press Next. Hint and Skip never stop the clock.","<b>Scoring.<\/b> A multi-part exercise gives a part of the point for each part you get right. A wrong pick can take points away, but your score never goes below zero. If you use the Hint, that exercise loses 10% of its credit.","<b>Skip.<\/b> Press <b>Skip<\/b> to park an exercise for later. Skipped exercises come back on a review screen at the end. Exercises you never answer are not counted in your score.","Press Start when you are ready. Good luck."]},"exercises":[{"id":"e01","type":"qcm-single","label":"Tactic placement","persp":"concept","scenario":"A junior analyst finds the entry <code>T1586.003<\/code> in the MITRE ATT&amp;CK catalogue and reads the name: <i>Compromise Accounts: Cloud Accounts<\/i>. Before reading the page, the analyst wants to guess which tactic the entry belongs to.","question":"Which tactic does T1586.003 belong to?","hint":"Think about the stage where attackers prepare things they will need later.","explain":"T1586.003 sits in <b>Resource Development<\/b>. That tactic covers the things attackers set up <i>before<\/i> an attack, such as accounts, domains and malware. Initial Access is the moment they get inside a target. Execution and Exfiltration happen much later, after they are inside.","options":[{"html":"Execution"},{"html":"Exfiltration"},{"html":"Resource Development"},{"html":"Initial Access"}],"answer":2},{"id":"e02","type":"qcm-single","label":"What the technique says","persp":"concept","scenario":"A student is asked to explain T1586.003 in one sentence during a class on cloud security.","question":"Which sentence describes T1586.003 correctly?","hint":"The technique is about taking over an account at a provider, not about attacking the target network yet.","explain":"T1586.003 means the attacker <b>compromises a cloud account<\/b> (for example at AWS, Azure or Google Cloud) and then uses that account to develop resources for later attacks. Paying cash for a server is buying infrastructure, not compromising an account. Spam from an own server and port scanning do not need a stolen cloud account.","options":[{"html":"An attacker scans a cloud API for open ports."},{"html":"An attacker takes over an account at a cloud provider and uses it to create resources for attacks."},{"html":"An attacker pays cash for a rack server in a data centre."},{"html":"An attacker sends spam from their own mail server at home."}],"answer":1},{"id":"e03","type":"qcm-single","label":"Spot the cloud account","persp":"concept","scenario":"A trainer shows four accounts on a slide and asks the class which one is a <i>cloud account<\/i> in the sense of T1586.003.","question":"Which of these is a cloud account?","hint":"A cloud account lives at a provider that rents compute, storage or software over the internet.","explain":"An AWS account is a <b>cloud account<\/b>: it controls rented compute and storage at a cloud provider. A social network profile is a social media account (that is sub-technique T1586.001). A webmail inbox is an email account (T1586.002). A local Administrator account lives on one laptop, not in the cloud.","options":[{"html":"An AWS account that can start virtual machines"},{"html":"A profile on a social network"},{"html":"A webmail inbox used for phishing"},{"html":"The local Administrator account on an office laptop"}],"answer":0},{"id":"e04","type":"qcm-multi","label":"Ways accounts get stolen","persp":"attacker","scenario":"A security awareness lead writes a short briefing about how cloud accounts end up in criminal hands. The briefing should list the methods that really happen in the wild.","question":"Select <b>all<\/b> the common ways attackers take over cloud accounts.","hint":"Think about stealing passwords, buying passwords, annoying the user with prompts, and stealing a phone number.","explain":"The four real methods are <b>phishing pages<\/b>, <b>bought passwords<\/b>, <b>MFA push spam<\/b> (also called MFA fatigue) and <b>SIM swaps<\/b>. You missed or wrongly picked the last two if you selected them: nobody needs to carry a server out of a building to take over an account, and asking the provider to delete the account only destroys the account, it does not give access.","options":[{"html":"SIM swap so the attacker receives the SMS codes"},{"html":"Physically carrying a data-centre server out of the building"},{"html":"Asking the cloud provider to delete the account"},{"html":"Phishing pages that harvest the sign-in password"},{"html":"Buying stolen passwords from an info-stealer market"},{"html":"Spamming MFA push alerts until the user taps Approve"}],"answer":[3,4,5,0]},{"id":"e05","type":"qcm-single","label":"Why attackers want one","persp":"attacker","scenario":"During Resource Development, an attacker weighs two options: renting infrastructure with a stolen credit card, or taking over a cloud account that already exists.","question":"Why is a compromised cloud account attractive during Resource Development?","hint":"Think about what the account already has: billing, services, and a trusted name.","explain":"A compromised cloud account brings <b>existing billing, services and a trusted identity<\/b>. New resources blend in with normal use, and the victim pays the bill. Antivirus licences, patching the target and switching off firewalls are not things a cloud account gives an attacker.","options":[{"html":"It automatically patches the target network."},{"html":"It switches off the target firewall from the inside."},{"html":"The attacker can create servers, storage and mailboxes that look normal and bill someone else."},{"html":"It gives the attacker free antivirus licences."}],"answer":2},{"id":"e06","type":"qcm-single","label":"Sibling sub-techniques","persp":"concept","scenario":"An analyst studying T1586 opens the technique page and sees three sub-techniques listed under Compromise Accounts.","question":"What are the two sibling sub-techniques of T1586.003 (Cloud Accounts) about?","hint":"One is about profiles on social platforms, the other about mail inboxes.","explain":"The parent technique <b>T1586 Compromise Accounts<\/b> has three sub-techniques: <b>T1586.001 Social Media Accounts<\/b>, <b>T1586.002 Email Accounts<\/b> and <b>T1586.003 Cloud Accounts<\/b>. Bank and crypto accounts, local admins and service accounts are not part of this family.","options":[{"html":"Service accounts and guest accounts"},{"html":"Social media accounts and email accounts"},{"html":"Bank accounts and crypto wallets"},{"html":"Local admin and domain admin accounts"}],"answer":1},{"id":"e07","type":"matching","label":"Match account type to example","persp":"concept","scenario":"A study group makes flash cards for the three account types in the T1586 family. They mix up the cards and want to check the pairs.","question":"Match each account type on the left with the correct example on the right.","hint":"Only one example can start virtual machines and store files.","explain":"<b>Cloud account<\/b> matches the account with virtual machines and files, because cloud providers rent compute and storage. <b>Social media account<\/b> matches the networking-site profile (T1586.001). <b>Email account<\/b> matches the webmail inbox (T1586.002). The keyboard and printer cards were only distractors.","data":{"pairs":[{"left":"Cloud account","right":"An account that can start virtual machines and store files"},{"left":"Social media account","right":"A profile on a business networking site"},{"left":"Email account","right":"A webmail inbox"}],"rights":["An account that can start virtual machines and store files","A profile on a business networking site","A webmail inbox","A keyboard layout setting","A printer driver"]}},{"id":"e08","type":"qcm-single","label":"Which log shows API use","persp":"defender","scenario":"A SOC trainee must find out which AWS access keys were used in the last 24 hours and what they did.","question":"Which log best shows what an AWS account's keys and users did?","hint":"AWS has a service whose whole job is recording API calls.","explain":"<b>AWS CloudTrail<\/b> records API calls in an AWS account: who signed in, which keys were used, and which resources were created. The printer, battery and home router logs say nothing about cloud API activity.","options":[{"html":"The office printer log"},{"html":"The laptop battery log"},{"html":"The home router DNS log"},{"html":"AWS CloudTrail"}],"answer":3},{"id":"e09","type":"qcm-multi","label":"Signs of a stolen account","persp":"defender","scenario":"A security team writes a one-page list called 'signs that a cloud account may be stolen' for their help desk.","question":"Select <b>all<\/b> the signs that can point to a stolen cloud account.","hint":"Think about new places, strange times, and keys nobody created on purpose.","explain":"The four real signs are a <b>new-country sign-in<\/b>, <b>denied MFA prompts at a strange hour<\/b>, a <b>new access key<\/b> nobody made, and <b>many prompts in a short time<\/b> (a sign of push spam). A wallpaper change is normal user behaviour, and a backup finishing on time is a good sign, not a bad one.","options":[{"html":"A new access key that nobody created on purpose"},{"html":"Many MFA push prompts in a short time"},{"html":"The user changed their desktop wallpaper"},{"html":"A scheduled backup finished on time"},{"html":"A sign-in from a country the user never visits"},{"html":"MFA prompts at 3 a.m. that the user denies"}],"answer":[4,5,0,1]},{"id":"e10","type":"fill","label":"Name the MFA trick","persp":"concept","scenario":"A newsletter for IT beginners describes an attack where the phone of an employee receives dozens of MFA approval prompts. The employee finally taps Approve just to make the buzzing stop.","question":"Type the missing word for this trick.","hint":"The word describes being very tired of prompts.","explain":"The trick is called <b>MFA fatigue<\/b> (or push bombing). The attacker spams approval prompts and hopes the user taps Approve. One tap is all the attacker needs.","data":{"template":"Attackers send many MFA push alerts and wait until the tired user taps Approve. This trick is called MFA [[0]].","blanks":[{"answers":["fatigue"],"label":"MFA trick"}]}},{"id":"e11","type":"qcm-single","label":"Defanged domain","persp":"concept","scenario":"An analyst wants to publish a report that mentions a phishing domain. The rules say indicators must be defanged so nobody clicks them by accident.","question":"Which line shows the domain in the standard defanged way?","hint":"The dot in the middle is replaced by something in square brackets.","explain":"The standard defanged form replaces the dot with <code>[.]<\/code>, so it reads <code>login-portal[.]com<\/code>. The other forms are understandable but not standard, and a report style guide usually wants the <code>[.]<\/code> form.","options":[{"html":"<code>login-portal DOT com<\/code>"},{"html":"<code>login-portal[.]com<\/code>"},{"html":"<code>hxxp://login-portal com<\/code>"},{"html":"<code>login-portal[dot]com<\/code>"}],"answer":1},{"id":"e12","type":"qcm-single","label":"Stolen session cookie","persp":"attacker","scenario":"Malware on a laptop copies the session cookie of a user who is signed in to the company cloud console. The attacker uploads the cookie to their own machine.","question":"What can the attacker do with the stolen session cookie?","hint":"The cookie already proves the user signed in.","explain":"A session cookie proves that a sign-in already happened. When the attacker replays it, the cloud opens a session <b>without asking for the password or MFA again<\/b>. This trick is often called pass-the-cookie. It does not touch the phone PIN, phone files or door alarms.","options":[{"html":"Open a new session in the account without the password or MFA"},{"html":"Reset the user's phone PIN"},{"html":"Read files from the user's phone"},{"html":"Switch off the building's door alarms"}],"answer":0},{"id":"e13","type":"qcm-single","label":"First move after access","persp":"attacker","scenario":"An attacker has just taken over a cloud account. Their plan is Resource Development: they want things ready before the real attack starts.","question":"What is a typical first Resource Development step inside the stolen account?","hint":"The technique is about preparing resources, not about attacking anyone yet.","explain":"T1586.003 is a Resource Development technique, so the attacker <b>builds resources<\/b>: a small virtual machine for hosting tools, or a storage bucket for staging files. Emailing customers, deleting the account and installing games do not prepare anything useful for the attacker.","options":[{"html":"Email all company customers an apology"},{"html":"Delete the account"},{"html":"Install a game on the user's phone"},{"html":"Create a small virtual machine or a storage bucket for later use"}],"answer":3},{"id":"e14","type":"qcm-single","label":"Not a reason","persp":"attacker","scenario":"A quiz app asks learners to spot the one answer that is NOT a real reason why attackers compromise cloud accounts.","question":"Which is NOT a typical reason to take over a cloud account in this technique?","hint":"Three options help the attacker; one does nothing for them.","explain":"Attackers use stolen cloud accounts to <b>send phishing from trusted domains<\/b>, <b>host tools on rented VMs<\/b> and <b>store stolen data<\/b>. Cooling a data centre is the provider's own job and does nothing for the attacker, so it is the odd one out.","options":[{"html":"To host attack tools on rented virtual machines"},{"html":"To store stolen data in a cloud bucket"},{"html":"To cool the provider's data centre"},{"html":"To send phishing from a trusted-looking domain"}],"answer":2},{"id":"e15","type":"qcm-single","label":"Cheapest strong control","persp":"defender","scenario":"A small company asks a consultant: 'We can only afford one big change this year. Password phishing keeps working on our staff. What should we buy?'","question":"Which single control blocks most password phishing for cloud sign-ins?","hint":"The control must not depend on the user typing or reading a secret.","explain":"<b>Phishing-resistant MFA<\/b> (a FIDO2 security key or a passkey) checks the real website, so a fake login page cannot use a stolen password. A longer password is still phishable, monitors do not stop the phishing, and turning alerts off only hides the attack.","options":[{"html":"Turning off sign-in alerts to reduce noise"},{"html":"Phishing-resistant MFA, such as a security key or passkey"},{"html":"A longer password rule"},{"html":"More monitors for the SOC team"}],"answer":1}]}</script>
<script>
(function(){
'use strict';
var META=JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var RAW=JSON.parse(document.getElementById('exam-data').textContent);
var CFG=RAW.config, EXS=RAW.exercises;
window.__EXAM__={config:CFG,exercises:EXS,meta:META};
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function elt(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function stripTags(s){var d=elt('div');d.innerHTML=s;return (d.textContent||'').replace(/\s+/g,' ').trim();}
function shortLabel(o){var t=o.short?o.short:stripTags(o.html||o.text||'');return (t||'item').slice(0,52);}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtT(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function fmtD(sec){sec=Math.round(sec);var m=Math.floor(sec/60);return m+'m '+('0'+(sec%60)).slice(-2)+'s';}
function sevClass(){return {EASY:'sev-easy',MEDIUM:'sev-medium',HARD:'sev-hard','EXTREMELY HARD':'sev-extreme'}[CFG.sevName]||'sev-easy';}

/* ---------------- timer state machine ----------------
   States: IDLE, RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED.
   - Check switches to PAUSED_AUTO_CHECK before feedback is rendered.
   - Next / Final Submit switch back to RUNNING (or ENDED on the last exercise).
   - Skip and Hint never change the timer state.
   - Manual Pause works on top of any state and returns to it on Resume. */
var T={state:'IDLE',remaining:CFG.budgetSeconds,since:0,resumeTo:null,acc:{RUNNING:0,PAUSED_MANUAL:0,PAUSED_AUTO_CHECK:0}};
function accrue(){if(T.since&&T.acc[T.state]!=null){T.acc[T.state]+=(Date.now()-T.since)/1000;}T.since=Date.now();}
function setState(s){if(T.state===s){renderTimer();return;}accrue();T.state=s;if(T.acc[s]==null){T.since=0;}renderTimer();}
function hardResetTimer(){T.state='IDLE';T.since=0;T.remaining=CFG.budgetSeconds;T.resumeTo=null;T.acc={RUNNING:0,PAUSED_MANUAL:0,PAUSED_AUTO_CHECK:0};renderTimer();}
setInterval(function(){
  if(T.state!=='RUNNING'){return;}
  T.remaining-=1;
  if(T.remaining<=0){T.remaining=0;renderTimer();finishExam(true);return;}
  renderTimer();
},1000);
var TMETA={RUNNING:['\u25B6','running'],PAUSED_MANUAL:['\u23F8','Paused'],PAUSED_AUTO_CHECK:['\u23F3','Auto-paused \u00B7 checking'],ENDED:['\u25A0','ended'],IDLE:['\u25CB','ready']};
function renderTimer(){
  var ic=$('#t-icon'),tm=$('#t-time'),st=$('#t-state');
  if(!ic||!tm||!st){return;}
  var m=TMETA[T.state]||TMETA.IDLE;
  ic.textContent=m[0];st.textContent=m[1];tm.textContent=fmtT(Math.max(0,T.remaining));
  st.className={RUNNING:'ts-run',PAUSED_MANUAL:'ts-pman',PAUSED_AUTO_CHECK:'ts-pauto',ENDED:'ts-end',IDLE:'ts-end'}[T.state]||'ts-end';
  tm.classList.toggle('low',T.remaining<=60&&T.state==='RUNNING');
  $('#hdr-timer').setAttribute('aria-label','Timer, state '+m[1]+', time left '+fmtT(Math.max(0,T.remaining)));
}

/* ---------------- session state ---------------- */
var S=null;
function resetAttempt(){
  S={screen:'intro',idx:0,mode:'main',credits:{},checked:{},hint:{},skipped:[],cur:null,prevScreen:'exercise',posted:false,timeUp:false,ddSel:null};
}
resetAttempt();
function scoreSum(){var s=0,k;for(k in S.credits){s+=S.credits[k];}return s;}
function exById(id){for(var i=0;i<EXS.length;i++){if(EXS[i].id===id){return EXS[i];}}return null;}

/* ---------------- header ---------------- */
function renderHeader(){
  var hdr=$('#hdr');if(!hdr){return;}
  var inExam=(S.screen==='exercise'||S.screen==='paused'||S.screen==='review');
  hdr.classList.toggle('hidden',!inExam);
  if(!inExam){return;}
  var counter=$('#hdr-counter'),sev=$('#hdr-sev'),scoreEl=$('#hdr-score'),
      hintB=$('#btn-hint'),skipB=$('#btn-skip'),pauseB=$('#btn-pause');
  if(!counter||!sev||!scoreEl||!hintB||!skipB||!pauseB){return;}
  if(S.mode==='review'||S.screen==='review'){counter.textContent='Reviewing skipped \u00B7 '+S.skipped.length+' left';}
  else{counter.textContent='Exercise '+(S.idx+1)+' of '+EXS.length;}
  scoreEl.textContent='Score: '+(Math.round(scoreSum()*10)/10).toFixed(1);
  sev.className='badge '+sevClass();sev.textContent=CFG.sevName;
  var cur=S.cur;
  var onEx=(S.screen==='exercise');
  hintB.disabled=!onEx||!cur||!!cur.graded||!!S.hint[cur.ex.id];
  skipB.disabled=!onEx||!cur||!!cur.graded||S.mode==='review';
  pauseB.textContent=(T.state==='PAUSED_MANUAL')?'\u23F8 Resume':'\u23F8 Pause';
}

/* ---------------- screens ---------------- */
function show(sc){S.screen=sc;render();}
function render(){
  var st=$('#stage');st.innerHTML='';
  if(S.screen==='intro')renderIntro(st);
  else if(S.screen==='exercise')renderExerciseScreen(st);
  else if(S.screen==='paused')renderPaused(st);
  else if(S.screen==='review')renderReview(st);
  else if(S.screen==='results')renderResults(st);
  renderHeader();renderTimer();
}
function renderIntro(st){
  var w=elt('div','intro');
  var strip=elt('div','strip');
  strip.innerHTML='<h1>'+CFG.title+'</h1>'
    +'<div class="chips">'
    +'<span class="chip">'+EXS.length+' exercises</span>'
    +'<span class="badge '+sevClass()+'">'+CFG.sevName+'</span>'
    +'<span class="chip">Estimated time: '+CFG.estimatedMinutes+' min</span>'
    +'<span class="chip">Timer budget: '+fmtT(CFG.budgetSeconds)+'</span>'
    +'<span class="chip">Pass mark: '+CFG.passMark+'%</span>'
    +'</div>';
  w.appendChild(strip);
  var s1=elt('section','i-sec');
  s1.appendChild(elt('h2',null,'What you will learn here'));
  CFG.introLearn.forEach(function(p){s1.appendChild(elt('p',null,p));});
  w.appendChild(s1);
  var s2=elt('section','i-sec');
  s2.appendChild(elt('h2',null,'Keywords covered in this exam'));
  var kc=elt('div','kw');
  CFG.keywords.forEach(function(k){kc.appendChild(elt('span','kw-chip',k));});
  s2.appendChild(kc);
  w.appendChild(s2);
  var s3=elt('section','i-sec');
  s3.appendChild(elt('h2',null,'How this exam works'));
  CFG.introHow.forEach(function(p){s3.appendChild(elt('p',null,p));});
  var b=elt('button','btn primary big','Start');
  b.id='btn-start';b.type='button';
  b.addEventListener('click',startExam);
  s3.appendChild(b);
  w.appendChild(s3);
  st.appendChild(w);
}
function startExam(){
  resetAttempt();
  hardResetTimer();
  S.mode='main';S.idx=0;
  startExercise();
  setState('RUNNING');
}

/* ---------------- exercise flow ---------------- */
function startExercise(){
  var ex=EXS[S.idx];
  S.cur={ex:ex,sel:-1,selM:[],match:{},place:{},order:(ex.data&&ex.data.initial?ex.data.initial.slice():[]),moved:[],vals:[],
         branch:{node:0,picks:[],final:[]},term:{lastRel:{},lines:[]},graded:null};
  S.screen='exercise';
  render();
}
function onCheck(){
  var c=S.cur;if(!c||c.graded)return;
  if(c.ex.type==='branch'&&c.branch.node<c.ex.data.nodes.length)return;
  setState('PAUSED_AUTO_CHECK');       /* auto-pause happens BEFORE feedback is rendered */
  c.graded=grade(c);
  S.credits[c.ex.id]=c.graded.final;
  S.checked[c.ex.id]=true;
  render();
}
function nextLabel(){
  if(S.mode==='review')return (S.skipped.length>1)?'Back to review':'Finish exam';
  if(S.idx<EXS.length-1)return 'Next exercise';
  return S.skipped.length?('Review skipped ('+S.skipped.length+')'):'Final Submit';
}
function onNext(){
  if(S.mode==='review'){
    S.skipped=S.skipped.filter(function(id){return id!==S.cur.ex.id;});
    if(S.skipped.length){S.screen='review';setState('RUNNING');render();}
    else{finishExam(false);}
    return;
  }
  if(S.idx<EXS.length-1){S.idx++;startExercise();setState('RUNNING');}
  else if(S.skipped.length){S.screen='review';setState('RUNNING');render();}
  else{finishExam(false);}
}
function onSkip(){
  var c=S.cur;
  if(!c||c.graded||S.mode==='review'||S.screen!=='exercise')return;
  S.skipped.push(c.ex.id);           /* timer keeps running: no state change */
  if(S.idx<EXS.length-1){S.idx++;startExercise();}
  else{S.screen='review';render();}  /* skipped pool is never empty here */
}
function onHint(){
  var c=S.cur;
  if(!c||c.graded||S.hint[c.ex.id]||S.screen!=='exercise')return;
  S.hint[c.ex.id]=true;              /* timer keeps running: no state change */
  render();
}
function onPause(){
  if(T.state==='PAUSED_MANUAL'){
    var back=T.resumeTo||'RUNNING';
    T.resumeTo=null;
    setState(back);
    show(S.prevScreen);
    return;
  }
  if(T.state==='RUNNING'||T.state==='PAUSED_AUTO_CHECK'){
    T.resumeTo=T.state;
    S.prevScreen=S.screen;
    setState('PAUSED_MANUAL');
    show('paused');
  }
}
function finishExam(timeUp){
  S.timeUp=!!timeUp;
  S.screen='results';
  setState('ENDED');
  render();
  setTimeout(postScore,750);         /* post after the score animation has settled */
}
function postScore(){
  if(S.posted)return;S.posted=true;
  var sum=0,total=0;
  EXS.forEach(function(ex){if(S.checked[ex.id]){sum+=S.credits[ex.id];total++;}});
  sum=Math.round(sum*10)/10;         /* rounding happens only here */
  var percent=total?Math.round(100*sum/total):0;
  var passed=total>0&&percent>=CFG.passMark;
  var msg={type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,score:sum,total:total,percent:percent,passed:passed};
  try{parent.postMessage(msg,location.origin);}catch(e){}
}

/* ---------------- paused + review screens ---------------- */
function renderPaused(st){
  var c=elt('div','pausecard');
  c.innerHTML='<div class="pause-ic">\u23F8</div><h2>Paused</h2><p>The clock is stopped. Your answers are safe.</p>';
  var b=elt('button','btn primary big','Resume');
  b.addEventListener('click',onPause);
  c.appendChild(b);
  st.appendChild(c);
}
function renderReview(st){
  var w=elt('div','review');
  w.appendChild(elt('h2',null,'Review skipped exercises'));
  w.appendChild(elt('p',null,'You skipped '+S.skipped.length+' exercise(s). Answer them now, or finish and leave the rest unanswered. The clock is still running.'));
  var list=elt('div','r-list');
  S.skipped.forEach(function(id){
    var ex=exById(id);
    var row=elt('div','r-row');
    row.appendChild(elt('span','r-lab',ex.label));
    var b=elt('button','btn','Answer');
    b.addEventListener('click',function(){S.mode='review';S.idx=EXS.indexOf(ex);startExercise();});
    row.appendChild(b);
    list.appendChild(row);
  });
  w.appendChild(list);
  var fin=elt('button','btn ghost','Finish and leave the rest unanswered');
  fin.addEventListener('click',function(){finishExam(false);});
  w.appendChild(fin);
  st.appendChild(w);
}

/* ---------------- handshake (dark-only; theme field ignored) ---------------- */
window.addEventListener('message',function(ev){
  var d=ev.data||{};var t=d.type;
  if(t==='CYBERPULSE_INIT'||t==='CYBERMASTERY_INIT'){/* accepted; the exam stays dark in every case */}
});

/* ---------------- debug hooks (read-only, for automated verification) ---------------- */
window.__EXAM_DEBUG__={
  state:function(){return T.state;},
  remaining:function(){return T.remaining;},
  acc:function(){return {RUNNING:Math.round(T.acc.RUNNING),PAUSED_MANUAL:Math.round(T.acc.PAUSED_MANUAL),PAUSED_AUTO_CHECK:Math.round(T.acc.PAUSED_AUTO_CHECK)};},
  credits:function(){return JSON.parse(JSON.stringify(S.credits));},
  skippedCount:function(){return S.skipped.length;},
  checkedCount:function(){return Object.keys(S.checked).length;},
  order:function(){return S.cur&&S.cur.order?S.cur.order.slice():null;},
  moved:function(){return S.cur&&S.cur.moved?S.cur.moved.slice():null;},
  place:function(){return S.cur&&S.cur.place?JSON.parse(JSON.stringify(S.cur.place)):null;},
  screen:function(){return S.screen;},
  setRemaining:function(s){T.remaining=s;}
};


/* ---------------- exercise card ---------------- */
function scenarioBlock(ex){
  var b=elt('div','block block-scenario');
  b.appendChild(elt('div','block-label','SCENARIO'));

function runCmd(c,cmd){
  var d=c.ex.data,L=c.term.lines;
  L.push({cls:'t-cmd',html:escHtml(cmd)});
  var i,dk=null;
  for(i=0;i<(d.dangerous||[]).length;i++){if(re(d.dangerous[i].match).test(cmd)){dk=d.dangerous[i];break;}}
  if(dk){
    L.push({cls:'t-warn',html:'\u26A0 DANGEROUS \u2014 NEAR MISS: '+dk.why});
    (d.tasks||[]).forEach(function(t,ti){if(t.danger&&re(t.danger).test(cmd)){c.term.lastRel[ti]='danger';}});
    render();
    return;
  }
  var sim=null;
  for(i=0;i<(d.sim||[]).length;i++){if(re(d.sim[i].match).test(cmd)){sim=d.sim[i];break;}}
  if(sim){
    String(sim.out).split('\n').forEach(function(ln){L.push({cls:'t-out',html:escHtml(ln)});});
  }else{
    L.push({cls:'t-err',html:'sh: command not found: '+escHtml(cmd)});
  }
  (d.nearmiss||[]).forEach(function(r){
    if(re(r.match).test(cmd))L.push({cls:'t-note',html:'\u26A0 Near miss: '+r.note});
  });
  (d.tasks||[]).forEach(function(t,ti){
    if(!c.term.lastRel[ti]&&re(t.accept).test(cmd)){
      c.term.lastRel[ti]='correct';
      L.push({cls:'t-ok',html:'\u2713 Task '+(ti+1)+' command accepted.'});
    }
  });
  render();
}

/* ---------------- grading ---------------- */
function grade(c){
  var ex=c.ex,type=ex.type,raw=0,items=[],N,H,W,i;
  if(type==='qcm-single'){
    var ok=(c.sel===ex.answer);
    raw=ok?1:0;
    if(ok)items.push({label:shortLabel(ex.options[ex.answer]),state:'hit'});
    else{
      if(c.sel>=0)items.push({label:shortLabel(ex.options[c.sel]),state:'wrong'});
      items.push({label:shortLabel(ex.options[ex.answer]),state:'missed'});
    }
  }else if(type==='qcm-multi'){
    var ans=ex.answer;N=ans.length;H=0;W=0;
    ex.options.forEach(function(o,oi){
      var isA=ans.indexOf(oi)>=0,sel=c.selM.indexOf(oi)>=0;
      if(isA&&sel){H++;items.push({label:shortLabel(o),state:'hit'});}
      else if(!isA&&sel){W++;items.push({label:shortLabel(o),state:'wrong'});}
      else if(isA&&!sel){items.push({label:shortLabel(o),state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='matching'){
    var rights=ex.data.rights;N=ex.data.pairs.length;H=0;W=0;
    ex.data.pairs.forEach(function(p,pi){
      var v=c.match[pi];
      if(v!=null&&rights[v]===p.right){H++;items.push({label:p.left,state:'hit'});}
      else if(v!=null){W++;items.push({label:p.left,state:'wrong'});}
      else{items.push({label:p.left,state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='dragdrop'){
    N=ex.data.items.length;H=0;W=0;
    ex.data.items.forEach(function(it){
      var z=c.place[it.id];
      if(z&&z===it.zone){H++;items.push({label:stripTags(it.html),state:'hit'});}
      else if(z){W++;items.push({label:stripTags(it.html),state:'wrong'});}
      else{items.push({label:stripTags(it.html),state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='order'){
    N=ex.data.items.length;H=0;W=0;
    for(i=0;i<N;i++){
      var itIdx=c.order[i];
      if(itIdx===i){H++;items.push({label:ex.data.items[i],state:'hit'});}
      else if(c.moved.indexOf(itIdx)>=0){W++;items.push({label:ex.data.items[itIdx],state:'wrong'});}
      else{items.push({label:ex.data.items[itIdx],state:'missed'});}
    }
    raw=Math.max(0,(H-W)/N);
  }else if(type==='fill'){
    N=ex.data.blanks.length;H=0;W=0;
    ex.data.blanks.forEach(function(b,bi){
      var v=(c.vals[bi]||'').trim().toLowerCase();
      var good=b.answers.some(function(a){return a.trim().toLowerCase()===v;});
      if(v===''){items.push({label:b.label||('Blank '+(bi+1)),state:'missed'});}
      else if(good){H++;items.push({label:b.label||('Blank '+(bi+1)),state:'hit'});}
      else{W++;items.push({label:b.label||('Blank '+(bi+1)),state:'wrong'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='branch'){
    var fans=ex.data.final.answer;N=fans.length;H=0;W=0;
    ex.data.final.options.forEach(function(o,oi){
      var isA=fans.indexOf(oi)>=0,sel=c.branch.final.indexOf(oi)>=0;
      if(isA&&sel){H++;items.push({label:shortLabel(o),state:'hit'});}
      else if(!isA&&sel){W++;items.push({label:shortLabel(o),state:'wrong'});}
      else if(isA&&!sel){items.push({label:shortLabel(o),state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }else if(type==='terminal'){
    N=(ex.data.tasks||[]).length;H=0;W=0;
    (ex.data.tasks||[]).forEach(function(t,ti){
      var rel=c.term.lastRel[ti];
      if(rel==='correct'){H++;items.push({label:t.label,state:'hit'});}
      else if(rel==='danger'){W++;items.push({label:t.label,state:'wrong'});}
      else{items.push({label:t.label,state:'missed'});}
    });
    raw=Math.max(0,(H-W)/N);
  }
  var hint=!!S.hint[ex.id];
  var fin=Math.max(0,Math.round((raw-(hint?0.10:0))*100)/100);
  var verdict=(fin>=0.999)?'correct':(fin>0?'partial':'incorrect');
  return {raw:raw,final:fin,hint:hint,items:items,verdict:verdict};
}

    if(S.checked[ex.id]){
      var cr=S.credits[ex.id];
      var st=(cr>=0.999)?['res-state','\u2713 Correct','it-hit']:(cr>0)?['res-state','\u2713 Partially correct','it-hit']:['res-state','\u2717 Incorrect','it-wrong'];
      row.appendChild(elt('span',st[0]+' '+st[2],st[1]));
      row.appendChild(elt('span','res-cred',cr.toFixed(2)+(S.hint[ex.id]?' \u00B7 hint used':'')));
    }else{
      row.appendChild(elt('span','res-state it-missed','\u26A0 Skipped \u00B7 not scored'));
      row.appendChild(elt('span','res-cred','\u2014'));
    }
    list.appendChild(row);
  });
  w.appendChild(list);
  var act=elt('div','actions');
  var rb=elt('button','btn primary big','Retake exam');
  rb.id='btn-retake';rb.type='button';
  rb.addEventListener('click',function(){
    resetAttempt();
    hardResetTimer();
    show('intro');
  });
  act.appendChild(rb);
  w.appendChild(act);
  st.appendChild(w);
  /* score animation, then the score is posted by finishExam's timer */
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce||percent===0){
    pct.textContent=percent+'%';
  }else{
    var t0=null,dur=600;
    function step(ts){
      if(t0===null)t0=ts;
      var p=Math.min(1,(ts-t0)/dur);
      pct.textContent=Math.round(percent*(p<1?(1-Math.pow(1-p,3)):1))+'%';
      if(p<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
}

/* ---------------- boot ---------------- */
$('#btn-hint').addEventListener('click',onHint);
$('#btn-skip').addEventListener('click',onSkip);
$('#btn-pause').addEventListener('click',onPause);
show('intro');
})();

</script>
</body>
</html>
