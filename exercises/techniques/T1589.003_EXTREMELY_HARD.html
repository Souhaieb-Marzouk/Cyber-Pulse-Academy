<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1589.003 — EXTREMELY HARD practice exam</title>
<script type="application/json" id="cm-exercise-meta">
{
  "topicId": "t1589.003",
  "batch": 4,
  "title": "T1589.003 Employee Names — EXTREMELY HARD",
  "difficulty": "extremely-hard",
  "questionCount": 16,
  "estimatedMinutes": 75,
  "passMark": 70
}
</script>
<style>
:root{
  --bg-page:#0b1020; --bg-surface:#121a2e; --bg-surface-2:#0f1729; --border:#243049;
  --text-primary:#e6ecff; --text-secondary:#a9b4d0; --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff; --accent-amber:#ffb454; --accent-green:#57d38c;
  --state-correct:#57d38c; --state-partial:#ffb454; --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0; --state-paused:#9d7bff;
  --sev-easy:#57d38c; --sev-medium:#ffb454; --sev-hard:#ff8a3d; --sev-extreme:#ff6b6b;
  --sev:var(--sev-easy);
  --shadow:0 6px 18px rgba(3,8,20,.45);
  --r:8px;
}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:dark}
html,body{margin:0;padding:0}
body{
  background:var(--bg-page); color:var(--text-primary);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono,.code,pre.code,input.term-in,.log-line,.term-out{
  font-family:ui-monospace,SFMono-Regular,"Cascadia Mono","JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace;
}
.wrap{max-width:980px;margin:0 auto;padding:20px 18px 64px}
h1,h2,h3{line-height:1.25;margin:0 0 10px}
h1{font-size:1.45rem} h2{font-size:1.15rem} h3{font-size:1.02rem}
p{margin:.45em 0}
a{color:var(--accent-blue)}
small,.small{font-size:.86rem;color:var(--text-secondary)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}
::selection{background:#2b3f66}

/* ---------- cards & panels ---------- */
.panel{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px 18px;margin:14px 0}
.panel.tight{padding:12px 14px}
.sub{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:10px 0}
.sub-label{font-size:.78rem;letter-spacing:.06em;color:var(--text-secondary);text-transform:uppercase;
  font-family:ui-monospace,Consolas,monospace;margin:0 0 6px}
.hr{border:none;border-top:1px solid var(--border);margin:14px 0}

/* ---------- intro ---------- */
.intro-head{border-left:4px solid var(--sev);padding-left:16px;margin:6px 0 4px}
.factrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;
  padding:7px 12px;font-size:.88rem;color:var(--text-secondary)}
.fact b{color:var(--text-primary);font-weight:600}
.kw-theme{margin:10px 0}
.kw-theme h3{color:var(--accent-blue);font-size:.95rem}
.kw-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.kw{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:20px;
  padding:4px 12px;font-size:.84rem;color:var(--text-primary)}
.rules{list-style:none;margin:8px 0;padding:0}
.rules li{padding:7px 0 7px 30px;position:relative;border-bottom:1px dashed var(--border);color:var(--text-primary)}
.rules li:last-child{border-bottom:none}
.rules li::before{content:"\25B8";position:absolute;left:8px;color:var(--accent-amber)}

/* ---------- chips / badges ---------- */
.badge{display:inline-flex;align-items:center;gap:7px;border-radius:20px;padding:4px 13px;
  font-size:.82rem;font-weight:700;letter-spacing:.05em;border:1px solid}
.badge .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
.b-easy{color:var(--sev-easy);border-color:var(--sev-easy);background:rgba(87,211,140,.09)}
.b-medium{color:var(--sev-medium);border-color:var(--sev-medium);background:rgba(255,180,84,.09)}
.b-hard{color:var(--sev-hard);border-color:var(--sev-hard);background:rgba(255,138,61,.10)}
.b-extreme{color:var(--sev-extreme);border-color:var(--sev-extreme);background:rgba(255,107,107,.10)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:6px;
  background:var(--bg-surface-2);padding:6px 11px;font-size:.84rem;color:var(--text-primary)}
.chip.ok{color:var(--state-correct);border-color:var(--state-correct)}
.chip.warn{color:var(--state-partial);border-color:var(--state-partial)}
.chip.bad{color:var(--state-incorrect);border-color:var(--state-incorrect)}
.chip.skip{color:var(--state-skipped);border-color:var(--border)}
.chip.pause{color:var(--state-paused);border-color:var(--state-paused)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(11,16,32,.96);border-bottom:1px solid var(--border);
  box-shadow:0 4px 14px rgba(3,8,20,.5)}
.topbar-in{max-width:980px;margin:0 auto;padding:9px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:9px}
.tb-count{font-weight:700;font-size:.92rem;white-space:nowrap}
.tb-user{font-size:.8rem;color:var(--text-secondary);white-space:nowrap}
.tb-spacer{flex:1}
.tb-timer{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;font-weight:700;
  font-size:.95rem;color:var(--text-primary)}
.tb-state{font-size:.74rem;letter-spacing:.03em}
.tb-score{font-family:ui-monospace,Consolas,monospace;font-size:.92rem;color:var(--text-primary)}
.tb-score b{color:var(--accent-green)}
.tb-score .pct{color:var(--text-secondary);font-size:.82rem}

/* ---------- progress ---------- */
.pbar{height:8px;background:var(--bg-surface-2);border-bottom:1px solid var(--border);overflow:hidden}
.pbar-in{height:100%;width:0%;
  background:linear-gradient(90deg,var(--sev),var(--accent-blue));
  transition:width .5s ease;position:relative}
.pbar-in::after{content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(230,236,255,.25) 50%,transparent 70%);
  animation:sheen 2.8s linear infinite}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;
  padding:9px 18px;border-radius:6px;border:1px solid var(--border);background:var(--bg-surface-2);
  color:var(--text-primary);cursor:pointer;font-weight:600;font-size:.92rem;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:#1a2440;border-color:#33507e}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn-primary{background:var(--sev);border-color:var(--sev);color:#08101f}
.btn-primary:hover:not(:disabled){background:var(--sev);filter:brightness(1.12)}
.btn-blue{background:#173154;border-color:var(--accent-blue);color:var(--accent-blue)}
.btn-ghost{background:transparent}
.btn-danger{border-color:var(--state-incorrect);color:var(--state-incorrect)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn-lg{font-size:1.02rem;padding:12px 30px}

/* ---------- exercise blocks ---------- */
.ex-head{display:flex;align-items:center;gap:10px;margin:16px 0 8px;flex-wrap:wrap}
.ex-title{font-size:.95rem;color:var(--text-secondary);font-weight:600}
.blk{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
.blk-h{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:.82rem;font-weight:800;
  letter-spacing:.09em;border-bottom:1px solid var(--border);text-transform:uppercase}
.blk-h .ic{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;
  border-radius:5px;font-size:.85rem;background:rgba(90,169,255,.14);color:var(--accent-blue)}
.blk-h .tag{margin-left:auto;font-weight:600;letter-spacing:.02em;font-size:.72rem;color:var(--text-secondary)}
.blk-scenario{border-left:4px solid var(--accent-blue)}
.blk-scenario .blk-h{color:var(--accent-blue)}
.blk-question{border-left:4px solid var(--accent-amber)}
.blk-question .blk-h{color:var(--accent-amber)}
.blk-question .ic{background:rgba(255,180,84,.14);color:var(--accent-amber)}
.blk-answer{border-left:4px solid var(--accent-green)}
.blk-answer .blk-h{color:var(--accent-green)}
.blk-answer .ic{background:rgba(87,211,140,.14);color:var(--accent-green)}
.blk-b{padding:14px 16px}
.scen-p{margin:.5em 0;color:var(--text-primary)}
.q-text{font-weight:700;font-size:1.02rem;margin:0}

/* collapsible scenario */
.collapse-btn{margin-left:auto;background:none;border:1px solid var(--border);border-radius:5px;
  color:var(--text-secondary);cursor:pointer;padding:3px 10px;font-size:.74rem;min-height:44px}
.collapsed .blk-b{display:none}
.collapsum{display:none;padding:8px 14px;font-size:.82rem;color:var(--text-secondary);border-top:1px solid var(--border)}
.collapsed .collapsum{display:block}

/* artefacts & code */
.artefact{margin:12px 0}
pre.code{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;
  color:var(--text-mono);font-size:.86rem;line-height:1.55;padding:11px 13px;margin:6px 0 0;
  overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.tok-k{color:var(--accent-blue);font-weight:700}
.tok-s{color:var(--accent-amber)}
.tok-n{color:var(--sev-hard)}
.tok-c{color:var(--text-secondary);font-style:italic}
.tok-f{color:var(--state-incorrect)}

/* log viewer */
.logview{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.logview-top{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border)}
.logview input{flex:1;background:var(--bg-page);border:1px solid var(--border);border-radius:5px;
  color:var(--text-primary);padding:8px 10px;font-size:.86rem;min-height:38px}
.log-count{font-size:.74rem;color:var(--text-secondary);font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
.log-lines{max-height:300px;overflow:auto;padding:6px 0}
.log-line{padding:3px 12px;font-size:.82rem;color:var(--text-mono);white-space:pre-wrap;word-break:break-word}
.log-line .ts{color:var(--text-secondary)}
.log-line .src{color:var(--accent-blue);font-weight:700}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:6px;padding:11px 13px;cursor:pointer;min-height:44px;
  color:var(--text-primary);transition:background .12s,border-color .12s}
.opt:hover:not(:disabled){background:#182238}
.opt-k{flex:0 0 auto;font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--text-secondary)}
.opt-t{flex:1}
.opt-sel{border-left:4px solid var(--accent-green);box-shadow:0 0 0 1px var(--accent-green),0 0 12px rgba(87,211,140,.25)}
.opt.sel-tag::after{content:"\25CF selected";margin-left:auto;color:var(--accent-green);font-size:.76rem;font-weight:700;white-space:nowrap}
.opt:disabled{cursor:default;opacity:.85}
.opt-correct{border-left:4px solid var(--state-correct)}
.opt-wrong{border-left:4px solid var(--state-incorrect)}

/* fill-in */
.fill-wrap{line-height:2.3;color:var(--text-primary)}
.fill-in{background:var(--bg-page);border:1px solid var(--border);border-bottom:2px solid var(--accent-green);
  border-radius:5px;color:var(--text-mono);padding:6px 10px;font-size:.9rem;min-height:44px;min-width:120px;margin:0 3px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)}
.bank-l{font-size:.78rem;color:var(--text-secondary);width:100%}
.bk{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:16px;padding:3px 11px;
  font-size:.84rem;color:var(--text-mono);font-family:ui-monospace,Consolas,monospace}

/* match */
.match-row{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.match-row:last-child{border-bottom:none}
.match-l{flex:1 1 240px;font-size:.92rem}
.match-row select{flex:1 1 200px;background:var(--bg-page);border:1px solid var(--border);border-radius:5px;
  color:var(--text-primary);padding:9px 10px;font-size:.88rem;min-height:44px}

/* order */
.ord-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.ord-item{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);
  border-radius:6px;padding:8px 11px}
.ord-pos{flex:0 0 30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:5px;
  background:var(--bg-page);border:1px solid var(--border);font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:.85rem}
.ord-t{flex:1}
.ord-btns{display:flex;gap:5px}
.ord-btns button{width:44px;height:44px;border-radius:5px;border:1px solid var(--border);background:var(--bg-page);
  color:var(--text-primary);cursor:pointer;font-size:1rem}
.ord-btns button:hover:not(:disabled){border-color:var(--accent-blue);color:var(--accent-blue)}

/* drag & drop */
.drag-zone{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:9px;border:1px dashed var(--border);
  border-radius:6px;background:var(--bg-page);margin-top:8px}
.drag-zone.over{border-color:var(--accent-green);box-shadow:inset 0 0 0 1px var(--accent-green)}
.chipd{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;
  font-size:.88rem;cursor:grab;color:var(--text-primary);min-height:44px;display:inline-flex;align-items:center;gap:7px}
.chipd.picked{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green)}
.chipd .pick-mark{color:var(--accent-green);font-weight:700;font-size:.78rem}
.buckets{display:grid;gap:10px;margin-top:12px}
.bucket{border:1px solid var(--border);border-radius:6px;background:var(--bg-surface-2);padding:10px}
.bucket-h{font-size:.84rem;font-weight:700;color:var(--accent-blue);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.bucket .drag-zone{margin-top:0;min-height:64px}
.drag-hintline{font-size:.8rem;color:var(--text-secondary);margin-top:8px}

/* terminal */
.term{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.term-bar{display:flex;gap:6px;align-items:center;padding:7px 11px;border-bottom:1px solid var(--border);background:var(--bg-page)}
.term-dot{width:10px;height:10px;border-radius:50%;background:var(--border)}
.term-dot.r{background:var(--state-incorrect)}.term-dot.y{background:var(--state-partial)}.term-dot.g{background:var(--state-correct)}
.term-name{margin-left:6px;font-size:.76rem;color:var(--text-secondary);font-family:ui-monospace,Consolas,monospace}
.term-out{padding:10px 12px;max-height:220px;overflow:auto;font-size:.84rem;color:var(--text-mono);line-height:1.55}
.term-line{white-space:pre-wrap;word-break:break-word}
.term-line .p{color:var(--accent-green);font-weight:700}
.term-in-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--border)}
.term-pr{color:var(--accent-green);font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:.86rem;white-space:nowrap}
input.term-in{flex:1;background:transparent;border:none;color:var(--text-mono);font-size:.88rem;min-height:44px}
.per-timer{display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,Consolas,monospace;
  font-size:.8rem;color:var(--state-partial);border:1px solid var(--state-partial);border-radius:5px;padding:3px 9px}

/* decision tree */
.step-tag{display:inline-flex;align-items:center;gap:7px;background:rgba(90,169,255,.12);border:1px solid var(--accent-blue);
  color:var(--accent-blue);border-radius:5px;padding:4px 11px;font-size:.78rem;font-weight:700;letter-spacing:.05em;margin-bottom:8px}
.step-outcome{border-left:3px solid var(--accent-blue);background:var(--bg-surface-2);border-radius:4px;
  padding:8px 12px;margin:8px 0;font-size:.88rem;color:var(--text-primary)}
.step-outcome.ok{border-left-color:var(--state-correct)}
.step-outcome.bad{border-left-color:var(--state-incorrect)}
.done-steps{margin-bottom:6px}

/* feedback */
.fb{border:1px solid var(--border);border-radius:var(--r);margin:12px 0;overflow:hidden;background:var(--bg-surface);
  box-shadow:var(--shadow)}
.fb-h{display:flex;align-items:center;gap:10px;padding:11px 15px;font-weight:800;letter-spacing:.05em;font-size:.95rem;
  border-bottom:1px solid var(--border)}
.fb-h.ok{color:var(--state-correct);background:rgba(87,211,140,.08)}
.fb-h.part{color:var(--state-partial);background:rgba(255,180,84,.08)}
.fb-h.bad{color:var(--state-incorrect);background:rgba(255,107,107,.08)}
.fb-credit{font-family:ui-monospace,Consolas,monospace;font-size:.88rem;margin-left:auto;white-space:nowrap}
.fb-b{padding:13px 16px}
.fb-correct{background:var(--bg-surface-2);border:1px solid var(--border);border-left:3px solid var(--state-correct);
  border-radius:5px;padding:9px 12px;margin:8px 0;font-size:.9rem}
.fb-correct .mono{color:var(--text-mono)}
.items{margin:10px 0;display:flex;flex-direction:column;gap:6px}
.item-row{display:flex;gap:9px;align-items:flex-start;font-size:.88rem;padding:6px 9px;border-radius:5px;
  background:var(--bg-surface-2);border:1px solid var(--border)}
.item-ic{flex:0 0 auto;font-weight:700}
.item-row.ok .item-ic{color:var(--state-correct)}
.item-row.bad .item-ic{color:var(--state-incorrect)}
.item-row.miss .item-ic{color:var(--state-skipped)}
.fb-exp{color:var(--text-primary);font-size:.92rem;margin-top:8px}
.fb-study{color:var(--accent-amber);font-size:.88rem;margin-top:8px;border-left:3px solid var(--accent-amber);padding-left:10px}
.fb-persp{display:grid;gap:8px;margin-top:10px}
.persp{border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:.88rem;background:var(--bg-surface-2)}
.persp b{color:var(--accent-blue)}
.persp.d b{color:var(--accent-green)}
.fb-note{font-size:.8rem;color:var(--text-secondary);margin-top:9px}

/* review & results */
.rv-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.rv-row:last-child{border-bottom:none}
.rv-t{flex:1;min-width:200px}
.res-sum{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0}
.res-big{font-family:ui-monospace,Consolas,monospace;font-size:2rem;font-weight:800}
.res-pct{font-size:1.2rem;font-weight:700;color:var(--text-secondary)}
.verdict{border-radius:var(--r);border:1px solid;padding:16px 18px;margin:14px 0;font-size:1.05rem;font-weight:700}
.verdict.ok{color:var(--state-correct);border-color:var(--state-correct);background:rgba(87,211,140,.07)}
.verdict.bad{color:var(--state-incorrect);border-color:var(--state-incorrect);background:rgba(255,107,107,.07)}
.res-break{display:grid;gap:8px;margin:12px 0}
.res-row{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);
  border-radius:6px;padding:9px 13px;font-size:.92rem}
.res-row b{margin-left:auto;font-family:ui-monospace,Consolas,monospace}
.pause-stats{font-size:.86rem;color:var(--text-secondary);margin-top:10px;display:grid;gap:4px}

/* overlay for manual pause */
.overlay{position:fixed;inset:0;background:rgba(5,8,18,.9);backdrop-filter:blur(5px);z-index:90;
  display:flex;align-items:center;justify-content:center;padding:20px}
.overlay-card{max-width:440px;width:100%;text-align:center;background:var(--bg-surface);border:1px solid var(--state-paused);
  border-radius:10px;padding:30px 26px;box-shadow:0 0 40px rgba(157,123,255,.25)}
.overlay-card .big{font-size:2.2rem;color:var(--state-paused);margin-bottom:8px}
.hidden{display:none!important}

/* misc */
.notice{border:1px solid var(--border);border-left:4px solid var(--accent-amber);background:var(--bg-surface-2);
  border-radius:5px;padding:9px 12px;font-size:.86rem;margin:10px 0;color:var(--text-primary)}
.tiny-note{font-size:.78rem;color:var(--text-secondary)}

@media (max-width:640px){
  .wrap{padding:14px 10px 50px}
  .blk-b{padding:12px}
  .topbar-in{padding:8px 10px;gap:6px}
  .tb-state{display:none}

<script>
window.__EXAM__ = {"meta":{"topicId":"t1589.003","batch":4,"title":"T1589.003 Employee Names — EXTREMELY HARD","difficulty":"extremely-hard","sevWord":"EXTREMELY HARD","objId":"T1589.003","objName":"Employee Names","questionCount":16,"estimatedMinutes":75,"timerSeconds":4500,"passMark":70,"pageTitle":"T1589.003 — EXTREMELY HARD practice exam"},"intro":{"h1":"T1589.003 — EXTREMELY HARD practice exam","objType":"Sub-technique of T1589 — an ATT&CK 'how they do it' entry inside the Reconnaissance tactic","learnTitle":"What you will learn here","learn":["This is the top tier for <b>T1589.003 — Employee Names<\/b> (sub-technique of <b>T1589 Gather Victim Identity Information<\/b>, tactic <b>Reconnaissance<\/b>, platform <b>PRE<\/b>). The scenarios now chain three or more concepts, hand you artefact sets with <b>noise and gaps<\/b>, and put conflicting signals in front of you. Your job is what a senior analyst's job actually is: decide, under pressure, with an explicit reason for every call.","The source texts still anchor everything. <b>AN1989<\/b> (detection): very high occurrence, very high false-positive rate, mostly outside victim visibility — aim at related stages such as <b>Initial Access<\/b>. <b>M1056<\/b> (mitigation): minimise the amount and sensitivity of staff data available to external parties. The description chains forward to <b>T1593.001<\/b>, <b>T1594<\/b>, <b>T1598<\/b>, <b>T1586<\/b>, <b>T1566<\/b> and <b>T1078<\/b>. And the procedure table names three documented actors — <b>Kimsuky (G0094)<\/b>, <b>Sandworm Team (G0034)<\/b>, <b>Silent Librarian (G0122)<\/b> — which is exactly enough context to make attribution claims carefully, and dangerously little if you make them loudly.","You will make decisions with costs attached: revoking an executive's sessions mid-flight, rejecting a 'best practice' that does not fit this context, choosing to verify instead of block, escalating instead of acting. Several options in every exercise are defensible somewhere — three of them are defensible in some world, and only one is correct in <i>this<\/i> one. One exercise drops you into an evidence-preservation console with a reduced timer, where the safe command and the destructive command differ by a flag.","Complete this tier after EASY, MEDIUM and HARD. If a call feels obvious here, assume the artefacts are hiding something — that instinct is the skill."],"themes":[{"name":"Chained reasoning","items":["recon into access chains","cross-lifecycle best-fit tagging","impossible-travel reconciliation","evidence windows and gaps"]},{"name":"Conflicting signals","items":["user-agent claims vs network truth","named greeting vs sender attestation","visible window vs rotated logs","telemetry vs assumption"]},{"name":"Decisions with costs","items":["revoking executive sessions","rejecting best practice in context","escalate vs act","harm-adjusted exposure priorities"]},{"name":"Attribution discipline","items":["Kimsuky (G0094) — KISA Operation Muzabi","Sandworm Team (G0034) — US v. Andrienko","Silent Librarian (G0122) — US v. Rafatnajad","'consistent with' language","infrastructure evidence over TTP overlap"]},{"name":"Evidence preservation","items":["read-only vs state-changing commands","export before purge","forward-confirmed reverse DNS","retention exports from providers"]},{"name":"Programme thinking","items":["M1056 as a measured programme","role-based aliasing","takedown workflows","dual red/blue rehearsal"]}],"how":["You need <b>70%<\/b> to pass. Score counts only exercises answered with Check; skipped-and-never-answered exercises are excluded from points and total.","This file has <b>16 exercises<\/b>: multi-select, drag-and-drop, matching, ordering, fill-in-the-blank, a log panel with filter, <b>five branching decisions<\/b>, one single-choice question, and <b>one evidence console<\/b> with a reduced per-exercise timer.","Every exercise chains several ideas and most contain at least one ambiguous or incomplete signal. Hints here only restate a constraint — they never point at the answer.","Exercises with several items give <b>partial credit<\/b>: the formula is max(0, (H−W)/N) — correct items add credit, wrong selections subtract it, and the result never drops below zero. Selecting everything does not help you.","The timer starts at <b>75:00<\/b>. <b>Check<\/b> stops the timer for unlimited feedback study; <b>Next<\/b> restarts it. The evidence console also carries its own short timer, announced on screen, which pauses together with the main timer. <b>Pause<\/b> hides the exercise for a manual break.","One <b>hint<\/b> per exercise costs 10% of that exercise's credit. <b>Skip<\/b> files an exercise into the review pool; return until the timer ends. Unanswered skipped exercises are excluded from the score."]},"exercises":[{"id":"X01","title":"Block the bot?","type":"decision","summary":"A scraper claims to be Googlebot — verify or block","scen":[{"label":"CONTEXT","kind":"prose","body":"08:55. The careers site of Meridian Logistics is being read at machine speed, and the web team wants an emergency block before the press call at 10:00. Two artefacts say opposite things about who is reading. Legal has also just walked in."},{"label":"ARTEFACT 1 — access log line","kind":"code","body":"08:41:02  GET /about/team  200\n          \"Mozilla/5.0 (compatible; Googlebot/2.1; +hxxp://google[.]com/bot.html)\"\n08:41:03  GET /about/team  200  (same UA)\n08:41:04  GET /about/team  200  (same UA)  ref=/about/team"},{"label":"ARTEFACT 2 — network note","kind":"code","body":"source IP: 198[.]51[.]100[.]77\nreverse DNS: cust-77.dsl-partner-net[.]example  (does NOT\n  resolve under google[.]com or googlebot[.]com)"},{"label":"ARTEFACT 3 — legal memo (one line)","kind":"code","body":"blocking the partner-network range would break a\ncontractual data feed — confirm ownership first."}],"q":"Make the three calls in order.","steps":[{"q":"Step 1 — Two signals conflict: the UA claims Googlebot, the IP does not resolve to Google. Which wins, and what does that mean right now?","opts":[{"t":"The network truth wins: a UA string is a self-declared claim, so treat the reader as unverified and do not block yet","correct":true,"outcome":"Right: UA strings are free to write; resolution and ownership are evidence. Blocking first would be acting on a claim."},{"t":"The UA wins: it says Googlebot, so let it run","correct":false,"outcome":"The exact spoof every scraper uses — the claim costs the adversary nothing to make."},{"t":"Both are moot: block everything and answer legal later","correct":false,"outcome":"That breaks a contractual feed on the strength of a bot dress-up."},{"t":"Both are moot: the site is public anyway, do nothing at all","correct":false,"outcome":"'Public' explains why reading is legal, not why you should skip verifying who is bulk-reading it."}]},{"q":"Step 2 — What do you run first?","opts":[{"t":"Forward-confirmed reverse DNS: resolve the IP, then resolve the name back and compare","correct":true,"outcome":"Correct: FC rDNS is the standard ownership check for declared crawlers — cheap, read-only, decisive."},{"t":"Block the /24 while you investigate","correct":false,"outcome":"The destructive shortcut again — and it hits the partner feed the memo warned about."},{"t":"Call the ISP for subscriber details","correct":false,"outcome":"Slow, and not something you are entitled to on demand; you can verify ownership yourself in seconds."},{"t":"Ignore it — rate-limit the whole site","correct":false,"outcome":"A blunt control that punishes candidates and staff for one reader's behaviour."}]},{"q":"Step 3 — The check fails: the reader is not Google. What is the right decision package for the 10:00 press call?","opts":[{"t":"Present the failed ownership check, request the partner-feed takedown path for confirmed abuse, and keep the exposure fix moving in parallel","correct":true,"outcome":"Correct: evidence first, a lawful remedy second, and the M1056 work regardless — that is the senior package."},{"t":"Block the IP now and announce the recon is stopped","correct":false,"outcome":"The block is cosmetic — the same pages stay public and the same data sits on other platforms."},{"t":"Say nothing publicly; delete the staff page before the call","correct":false,"outcome":"A rushed, disproportionate action that also destroys the page everyone is discussing."},{"t":"Escalate the whole thing to the national CERT and wait","correct":false,"outcome":"Reporting may be right later, but you hold the evidence and the decision — waiting surrenders both."}]}],"explain":"The chain: a self-declared UA is a claim, network resolution is evidence, and the ownership check decides. The failed check turns 'maybe Google' into a confirmed unverified reader, which supports a documented remedy — not a splashy block. Note what stayed constant through all three steps: the pages remain public, so the exposure work (M1056) proceeds no matter who the reader was. The exercise resolves its conflict the way senior triage does — by asking which signal is checkable and checking it.","study":"Memorise forward-confirmed reverse DNS — it settles almost every declared-crawler dispute.","hint":"The constraint in the memo is about the /24. The claim in the UA is free; the resolution is not."},{"id":"X02","title":"The case file","type":"multi","summary":"Five artefacts, two days of logs missing — what can you conclude","scen":[{"label":"CONTEXT","kind":"prose","body":"The duty folder for the Meridian case has grown to five artefacts. Two facts about the folder itself matter: proxy retention rotated two days ago (those days are gone), and the HR export is partial. Everything else is on the table — conclude only what survives."},{"label":"ARTEFACT 1 — proxy log (staff, not adversary)","kind":"code","body":"09:12  staff laptop  -> linkedin[.]com/company/meridian  200\n09:15  staff laptop  -> linkedin[.]com/company/meridian  200"},{"label":"ARTEFACT 2 — careers-site log","kind":"code","body":"02:11:04-07  GET /about/team 200  python-requests/2.31 (x4)\n02:14:22     GET /about/team 200  python-requests/2.31"},{"label":"ARTEFACT 3 — gateway log (start of wave)","kind":"code","body":"07:02  to 14 finance staff — names + titles in body;\n       sender domain registered 30 hours earlier"},{"label":"ARTEFACT 4 — HR export note","kind":"code","body":"export covers departments A-D only;\ne-mails for departments E-F not yet extracted"},{"label":"ARTEFACT 5 — news snippet (noise check)","kind":"code","body":"\"...recruiting fair on Thursday drew 300 candidates...\""}],"q":"Select every conclusion that survives the folder's gaps.","opts":[{"t":"Scripted staff-page collection is supported on the visible days","correct":true,"why":"The careers log shows it directly; the claim is scoped to the window you can see."},{"t":"The named finance wave reached staff","correct":true,"why":"Gateway log line 07:02 is direct evidence of delivery."},{"t":"The wave's personalisation is consistent with the scraped names","correct":true,"why":"Names plus titles matching public pages — stated with 'consistent with', the calibrated phrase."},{"t":"Staff LinkedIn browsing is part of the adversary's collection","correct":false,"why":"It is staff activity from a staff laptop — realistic noise that belongs to nobody's investigation."},{"t":"Collection began on the first visible day","correct":false,"why":"Two days of proxy and web history are rotated away — the true start is unknowable from this folder."},{"t":"Departments E and F were never targeted","correct":false,"why":"The HR export does not cover them — absence of extraction is not absence of targeting."}],"explain":"Three conclusions survive, and all three are scoped: collection on visible days, delivery of the wave, and a calibrated link between the two. The failures are the three classic gaps — noise dressed as signal (staff LinkedIn), a start-time claim the rotated window cannot support, and a negative claim built on an incomplete export. The folder itself is part of the evidence; a senior analyst reads its holes before reading its lines.","study":"Practise writing 'supported on the visible window' — scoping is what keeps conclusions true.","hint":"Two artefacts are not about the adversary at all, and two lines in the folder are about what is MISSING."},{"id":"X03","title":"Find the personalised wave","type":"multi","summary":"Filter the gateway log and escalate the right lines","scen":[{"label":"CONTEXT","kind":"prose","body":"The gateway exported one hour of traffic around the wave. Some recipient fields are redacted pending privacy review (incomplete information — work with what is visible). Use the filter box, then select the lines that match the personalised-wave signature: a greeting that names the recipient or their role, arriving from infrastructure with no history."},{"label":"ARTEFACT 1 — gateway export (07:00-08:00, filtered export)","kind":"log","body":[{"t":"07:02:11","src":"mail","m":"to m.reyes@ (redacted domain) body \"Hi Marta — as Payroll Manager...\" sender=fresh domain"},{"t":"07:02:14","src":"mail","m":"to j.hartley@ (redacted) body \"Hi Jonas — as AP Lead...\" sender=same fresh domain"},{"t":"07:03:40","src":"mail","m":"to 214 b2b recipients body \"Hello, quarterly offers...\" sender=known bulk host"},{"t":"07:11:08","src":"mail","m":"to s.farid@ (redacted) body \"Hi Samir — quick payroll question...\" sender=same fresh domain"},{"t":"07:15:31","src":"mail","m":"internal HRIS -> all staff: \"Your payslip is ready\" (expected monthly run)"},{"t":"07:22:19","src":"mail","m":"to c.officer@ (redacted) body \"Hi Chloe — the board pack you asked for\" sender=partner domain, 4 years old, DKIM pass"}]}],"q":"Select every line that matches the personalised-wave signature.","opts":[{"t":"07:02:11 — named greeting, fresh domain","correct":true,"why":"Name plus role plus zero-history infrastructure — the signature, first line of the wave."},{"t":"07:02:14 — named greeting, same fresh domain","correct":true,"why":"Second uses of the same infrastructure strengthen the wave reading."},{"t":"07:11:08 — payroll pretext, same fresh domain","correct":true,"why":"Same sender set, personalised pretext — part of the same wave even though the ask differs."},{"t":"07:03:40 — bulk offers to 214 recipients","correct":false,"why":"Generic greeting from a known bulk host — the noise AN1989 predicts."},{"t":"07:15:31 — internal payslip run","correct":false,"why":"Expected internal system on a known schedule; greeting absent entirely."},{"t":"07:22:19 — board pack from the partner","correct":false,"why":"Named greeting, but four-year-old attested infrastructure with passing DKIM — the benign twin."}],"explain":"The filter work shows why the greeting analytic needs a sender-history leg: the wave is three lines that share a fresh sender set, and the noise is three lines that fail exactly that leg — bulk host, internal schedule, attested partner. The redacted domains do not block the call, because the discriminating facts (greeting, sender history) survived the privacy pass. That is working with incomplete information: use the fields that remain decisive.","study":"When a field is redacted, ask which remaining fields still carry the decision — then decide on those.","hint":"The redaction hides who, not how old the sender is. Age of infrastructure is the leg that separates the six."},{"id":"X04","title":"Preserve the evidence","type":"terminal","summary":"Export mail evidence safely — one flag from disaster","scen":[{"label":"CONTEXT","kind":"prose","body":"15:40, IR bridge. The finance wave led to a confirmed login, and counsel wants evidence 'that survives scrutiny'. The mail server console is open, the retention job runs at 16:00, and the CISO needs the export done before it. The console has two verbs: export (read-only) and purge (destructive). One wrong flag destroys what the whole case needs. You have six minutes — the exercise timer below."},{"label":"ARTEFACT 1 — console reference card","kind":"code","body":"mailq export --since <window> --out <path>   read-only\nmailq purge  --since <window>                DESTRUCTIVE\nwindows: 7d, 14d, 30d      paths: /evidence/..."}],"q":"Type the command that exports the last 7 days of mail evidence to /evidence/mail7d.pak, then press Check.","termName":"mail-evidence-console","prompt":"ir@meridian-mail:~$","placeholder":"mailq ...","perTimer":360,"motd":["Meridian mail node — IR console (evidence mode)","retention job at 16:00 — export BEFORE purge would be fatal","counsel requirement: read-only export, full window, evidence path"],"runOutput":"export planned: window=7d out=/evidence/mail7d.pak mode=read-only\nstaged OK — nothing was modified on the store","elements":[{"label":"uses the mailq tool","any":["mailq"],"why":"The console's mail evidence tool is mailq."},{"label":"uses the read-only export verb","any":["export"],"why":"Only export preserves; purge destroys — counsel's requirement rules it out."},{"label":"bounds the window to 7d","any":["since\\s*7d","since 7 d","7d"],"why":"The scoped window keeps the export defensible and small."},{"label":"writes to /evidence/mail7d.pak","any":["evidence\\s*mail7d pak","evidence mail7d","mail7d"],"why":"The evidence path is where counsel expects the artefact."}],"forbidden":[{"re":"\\bpurge\\b|\\bdelete\\b|\\brm\\b|\\bwipe\\b","label":"the destructive verb (purge/delete/rm/wipe)","why":"The destructive verb would have destroyed the very messages counsel needs — the flag away from disaster."}],"canonical":"mailq export --since 7d --out /evidence/mail7d.pak","canonicalNote":"Four elements graded: tool, verb, window, output path. The purge variant would have been marked DANGEROUS — NEAR MISS.","explain":"The senior test here was never typing speed — it was choosing the safe verb under a clock. export with a bounded window and an evidence path is read-only, reproducible and admissible; the purge twin differs by one word and would have deleted the case. This is why evidence consoles gate destructive verbs, and why runbooks print the safe command first.","study":"Rehearse your own one-line rule: on any mail store, export before anything that can remove.","hint":"The reference card lists both verbs — counsel's requirement names which one is acceptable, and the window is 7 days."},{"id":"X05","title":"Best fit across the lifecycle","type":"match","summary":"One event, two questions — tag each with the best fit","scen":[{"label":"CONTEXT","kind":"prose","body":"The case review board asks you to defend five tags. The trick: several events support two tags each, and your job is the best fit for the QUESTION being asked — what the adversary holds, where it came from, what the artefact is. One right-column option is a decoy that fits nothing here."}],"q":"Match each line to its best-fit technique.","left":["What the adversary now HOLDS after reading the staff pages","WHERE those names came from (the victim's own site)","The deceptive chat that extracted the org chart","The lookalike portal the adversary stood up","The VPN session opened with the harvested credentials"],"right":["T1589.003 — Employee Names","T1594 — Search Victim-Owned Websites","T1598 — Phishing for Information","T1583.001 — Acquire Infrastructure: Domains","T1078 — Valid Accounts","T1059 — Command and Scripting Interpreter"],"correct":[0,1,2,3,4],"why":["The held data is the goal — T1589.003, regardless of source.","The source is the victim's own website — T1594 answers the 'where' question.","A deception to extract organisational facts is T1598.","Registering attacker infrastructure is acquisition — T1583.001.","Using the stolen login is T1078; the unused decoy T1059 is execution, which this story never shows."],"explain":"The board's question decides the tag, not the event: one staff-page read supports both 'what they hold' (T1589.003) and 'where from' (T1594), and both tags can appear on the same timeline row for different questions. The lookalike portal is not collection at all — it is acquired infrastructure, T1583.001 — and the VPN login is the moment possession becomes use, T1078. The decoy T1059 fails because the artefacts never show a script or interpreter running on any endpoint.","study":"For every artefact, rehearse the two questions: what does it show them holding, and where did it come from?","hint":"Five left items ask five different questions — holdings, source, trick, staging, use. One right item answers none of them."},{"id":"X06","title":"The response spine","type":"order","summary":"Order five response stages for the confirmed-login case","scen":[{"label":"CONTEXT","kind":"prose","body":"The confirmed login from the finance wave turned the case from phishing to incident. The response spine must be rebuilt — one card is the tempting shortcut ('purge and rotate everything now') that the folder warns against in red ink. The folder's warning: any step that destroys artefacts must come after the steps that need them."}],"q":"Order the five stages from first to last.","items":["Preserve: export mail artefacts, auth logs and the careers-site logs","Scope: recipients, clicks, the authentication event, and the source of personalisation","Contain: reset exposed credentials and revoke active sessions","Eradicate: block sender set and URLs; remove the delivered rules","Brief and fix: warn the named groups; open the M1056 exposure work"],"why":["Everything downstream reads the preserved artefacts — they go first.","Scoping turns artefacts into decisions; containment without scope chases shadows.","Containment acts on the scoped set — proportionate and traceable.","Eradication removes what delivered the access, now that evidence is safe.","The brief closes the human loop and the M1056 work closes the source of the personalisation."],"explain":"The spine is the file's whole argument in five cards: preserve, scope, contain, eradicate, brief-and-fix. The shortcut — purge and rotate everything now — feels decisive and destroys the artefacts that scoping needs, which is why the folder's red-ink warning exists. The last card is the one most often dropped in real incidents: the named groups get warned today, and the public source that personalised the wave becomes measured work under M1056, so the next wave starts from a smaller pool.","persp":{"a":"From the operator's side, every hour the victim spends preserving instead of purging is an hour the operation's artefacts stay useful for attribution later.","d":"From the defender's side, the spine exists precisely because the recon stage left nothing to detect — the response must therefore mine the access stage and then starve the recon stage."},"study":"Say the spine out loud until it survives a 03:00 page: preserve, scope, contain, eradicate, brief-and-fix.","hint":"Two cards consume artefacts, two cards produce them, and the last card is aimed at next month, not tonight."},{"id":"X07","title":"Review the attribution claim","type":"multi","summary":"Critique a report that pins the campaign on Kimsuky","scen":[{"label":"CONTEXT","kind":"prose","body":"A partner firm's report closes with one sentence: 'Based on the TTP overlap — employee-name collection followed by phishing — we attribute this campaign to Kimsuky (G0094).' Your director forwards it with three words: 'Review before sign-off.' The campaign targeted a university library network with bulk staff-name collection."},{"label":"ARTEFACT 1 — the page's actor rows (T1589.003)","kind":"code","body":"G0094 Kimsuky          collected victim employee name\n                         information       [KISA Op Muzabi 2021]\nG0034 Sandworm Team    victim-org research included\n                         employee information [US v. Andrienko 2020]\nG0122 Silent Librarian collected lists of names for\n                         individuals from targeted\n                         organizations  [US v. Rafatnajad 2018]"}],"q":"Select every review point that is valid.","opts":[{"t":"Name collection is documented for three actors — overlap on it is a weak discriminator","correct":true,"why":"The very row the report cites exists for G0034 and G0122 too; a shared row cannot pick one actor."},{"t":"The targeting pattern (university, bulk lists) points the comparison at Silent Librarian first","correct":true,"why":"Targeting is the documented discriminator between the three rows — the report never used it."},{"t":"Request infrastructure evidence — registrar, hosting, certificates — before agreeing","correct":true,"why":"Infrastructure and operational evidence carry attribution far better than one shared behaviour."},{"t":"Keep the language 'consistent with', never 'is', until more evidence lands","correct":true,"why":"Calibrated language survives scrutiny; the flat claim invites the correction that discredits the report."},{"t":"TTP overlap on a verbatim row is sufficient for flat attribution","correct":false,"why":"It is the report's error: the row is verbatim for three actors, so it selects none of them."},{"t":"Attribution never affects response decisions, so drop the sentence entirely","correct":false,"why":"Over-corrected: attribution shapes reporting, takedowns and disclosure — it matters; it must merely be supported."}],"explain":"The report's logic fails at its own cited evidence: the row it leans on is verbatim for three actors, so overlap on it cannot select Kimsuky. The valid review points rebuild the claim properly — use targeting as the discriminator (which points the comparison toward Silent Librarian's documented pattern), demand infrastructure evidence, and hold the calibrated language. Dropping attribution altogether overcorrects: leaders need the uncertainty stated, not the question removed.","study":"Rewrite the partner sentence yourself in one line with 'consistent with' plus the discriminator used.","hint":"One review point defends the report's own logic, one wants to delete the question instead of answering it — both fail."},{"id":"X08","title":"The executive summary","type":"fill","summary":"Four IDs and notes in one tight paragraph","scen":[{"label":"CONTEXT","kind":"prose","body":"The board pack has one paragraph for the whole case, and the style guide enforces exact IDs. Fill the four gaps — two techniques, one detection note, one mitigation. The bank includes two near-miss IDs that belong to other sentences entirely."}],"q":"Complete the executive summary.","text":"Adversaries used publicly exposed staff data ({0}) to build personalised lures ({1}). Per detection note {2}, our monitoring focuses on Initial Access. The exposure programme implements mitigation {3}.","blanks":[{"accept":["t1589.003"],"why":"The collection of employee names is T1589.003."},{"accept":["t1566"],"why":"Delivery of the lures is T1566, Phishing."},{"accept":["an1989","det0857"],"why":"AN1989 is the detection analytic (inside strategy DET0857) — either ID is accepted."},{"accept":["m1056"],"why":"The minimisation programme is M1056, Pre-compromise."}],"bank":["T1589.003","T1566","AN1989","M1056","T1078","T1594"],"explain":"The paragraph names the chain and the two institutional answers: T1589.003 built the personalisation, T1566 delivered it, AN1989 explains where monitoring aims, and M1056 names the programme. T1078 and T1594 are true sentences about this case but wrong sentences for these blanks — one belongs to the use of the login, the other to the channel row of the mapping appendix. Executive summaries fail when near-miss IDs migrate between sentences.","study":"Read your next summary and check every ID against the sentence it sits in, not the case it describes.","hint":"Blank 1 is the collected goal; blank 2 is the delivery. The bank's two leftovers answer other questions."},{"id":"X09","title":"Triage the six findings","type":"drag","summary":"Three buckets: exposure work, access signal, noise","scen":[{"label":"CONTEXT","body":"Monday stand-up. Six findings from the weekend are on the board and the room is split on all of them. You get 90 seconds to place each into the bucket that determines its owner: the exposure programme (M1056 work), the phishing queue (Initial Access signal), or nobody (noise). One finding is an archived copy that looks fresh; one is a mail-merge that looks personal.","kind":"prose"}],"q":"Drag each finding to its bucket.","buckets":[{"id":"expo","t":"Exposure programme (M1056 work)"},{"id":"sig","t":"Phishing queue (Initial Access signal)"},{"id":"noise","t":"Nobody — noise"}],"chips":[{"id":"c1","t":"Old staff page found cached on an archive site","b":"expo","why":"The cache is not fresh recon, but it keeps the names circulating — a takedown/minimisation task."},{"id":"c2","t":"Scraped staff page reposted on a paste site","b":"expo","why":"Exposure with a removal path: request takedown, then shrink the source so the repost ages out."},{"id":"c3","t":"Named-greeting wave to finance from a 30-hour-old domain","b":"sig","why":"The named-lure signature with fresh infrastructure — phishing queue, immediately."},{"id":"c4","t":"Mail to IT quoting internal ticket numbers, no public source identified","b":"sig","why":"Personalisation you cannot explain from public data is the alarming kind — investigate where the details came from."},{"id":"c5","t":"Declared Googlebot on the careers site","b":"noise","why":"Expected crawler behaviour — the alarming-looking entry that costs nobody any work."},{"id":"c6","t":"Vendor newsletter with mail-merged first names","b":"noise","why":"Personal-looking but bulk-sent from a known host — the benign twin of a named lure."}],"explain":"Two assignments are traps in both directions. The archive cache looks like fresh recon but is yesterday's exposure still circulating — exposure work, not the phishing queue. The mail-merge looks personal but its bulk sender and generic body place it in the noise bucket. And the IT mail is the quiet alarm: personalisation with no public source means the data came from somewhere you have not found — which is a signal, not a coincidence. Bucketing by owner is what makes Monday actionable.","study":"Give every finding an owner before lunch; findings without owners become next month's incident.","hint":"Freshness and source explainability decide: archived copies age, mail-merges are bulk, and unexplained personalisation is never noise."},{"id":"X10","title":"The CISO's investment question","type":"qcm","summary":"Best practice in the wrong context","scen":[{"label":"CONTEXT","kind":"prose","body":"Budget round. The CISO opens with: 'We have MFA everywhere and EDR on every endpoint — and the named lures still work. The board asks which investment reduces THIS exposure most. Convince me using the ATT&CK page's own guidance.'"},{"label":"ARTEFACT 1 — the two guidance notes","kind":"code","body":"M1056:  \"Efforts should focus on minimizing the amount and\n          sensitivity of data available to external parties.\"\nAN1989: \"Detection efforts may be focused on related stages\n          of the adversary lifecycle, such as during Initial\n          Access.\""}],"q":"Which answer to the CISO is technically correct for THIS exposure?","opts":[{"t":"Fund the M1056 minimisation programme and the AN1989-aligned greeting analytic","correct":true,"why":"The exposure is the external data pool; M1056 shrinks it and the analytic watches where consequences appear — the page's own two answers."},{"t":"Fund phishing-resistant MFA everywhere again, harder","correct":false,"why":"Genuinely good practice for the login step — and irrelevant to this exposure: the pool of public names stays untouched."},{"t":"Fund more EDR licences to see the recon","correct":false,"why":"Endpoints never see pre-compromise collection; AN1989 says the activity happens outside victim visibility."},{"t":"Fund a domain-blocklist subscription and call the recon handled","correct":false,"why":"Blocklists act on senders after staging; the next wave rotates domains, and the pool still exists."}],"explain":"This is the best-practice trap with stakes: phishing-resistant MFA is the right answer to a different question (hardening logins), and the CISO already bought it. The page's guidance answers the question actually asked — the exposure is a data pool, so fund its reduction (M1056) and watch the stage where the pool converts to attacks (AN1989's Initial Access). A senior analyst names the good practice, then explains why it does not answer this question.","study":"For every budget ask, write the sentence 'this funds stage X' — and check X is the stage with the exposure.","hint":"The artefact quotes two notes; the CISO's existing stack already covers the stage neither of them is about."},{"id":"X11","title":"Impossible travel","type":"decision","summary":"Reconcile the login from the CFO's own IP while she is airborne","scen":[{"label":"CONTEXT","kind":"prose","body":"17:10. The finance wave produced one confirmed authentication to the mail tenant: source IP is the CFO's usual home-office address, but the login happened forty minutes ago — and the CFO is over the Atlantic, her laptop powered down in the hold. Two signals contradict: the trusted IP says 'her', the physics says 'not her'. The legal team is in the room and the CFO lands in seven hours."},{"label":"ARTEFACT 1 — auth record","kind":"code","body":"user: c.officer@ (CFO)\nsource IP: 198[.]51[.]100[.]42 (her usual home-office IP)\nresult: SUCCESS   MFA: satisfied (push approved)\ntime:  17:12 local — mid-flight for the CFO"},{"label":"ARTEFACT 2 — mailbox post-auth telemetry","kind":"code","body":"17:14  new inbox rule created:\n         'move messages containing invoice -> RSS Feeds'\n       forward-to address: acct.rep@notes-exchange[.]example"}],"q":"Make the three calls in order.","steps":[{"q":"Step 1 — Reconcile the signals: what is the defensible reading?","opts":[{"t":"The login is real but almost certainly not the CFO — treat the account as compromised and act accordingly","correct":true,"outcome":"Right: a successful MFA-approved login from a trusted IP during physically impossible conditions, plus a forwarding rule — telemetry wins over the comfortable reading."},{"t":"The trusted IP settles it — it was the CFO, no action needed","correct":false,"outcome":"The reading that avoids all work: she is demonstrably airborne, and the mailbox already wrote a rule."},{"t":"The MFA approval settles it — approved push means the user was present","correct":false,"outcome":"Push fatigue defeats that assumption; approval is a click, not a presence proof."},{"t":"Park it until the CFO lands and can be asked","correct":false,"outcome":"Seven hours of forwarding rule is seven hours of mail leaving the tenant."}]},{"q":"Step 2 — Containment has a real cost. Choose it anyway.","opts":[{"t":"Revoke all CFO sessions and reset credentials now — accept that she lands to a locked account","correct":true,"outcome":"Correct, and costly: the executive is locked out for the night. The cost is real, known, and smaller than the exposure."},{"t":"Global reset of every credential in the tenant","correct":false,"outcome":"The comforting sledgehammer: it costs the whole business tonight and still arrives after the rule was written."},{"t":"Monitor quietly until she lands","correct":false,"outcome":"Monitoring was the right verb in earlier exercises; here an active forwarding rule makes watching complicity."},{"t":"Delete the forwarding rule only, leave sessions alive","correct":false,"outcome":"Removes one symptom while the session that wrote it persists — it simply writes another."}]},{"q":"Step 3 — Before the reset, what must happen to protect the case?","opts":[{"t":"Export the mailbox rules, the auth record and the forwarded-message set to the evidence store","correct":true,"outcome":"Right: the rule and what it forwarded are the case; capture them before the reset changes the world."},{"t":"Reset first — evidence can wait until tomorrow","correct":false,"outcome":"The reset will not destroy everything, but the rule's artefacts are cheapest to capture intact before changes."},{"t":"Screenshot the rule from her laptop when she lands","correct":false,"outcome":"The laptop is in the hold; and screenshots are weak evidence next to an export."},{"t":"Nothing — the platform keeps its own logs forever","correct":false,"outcome":"Retention is finite and the export is seconds of work; hope is not an evidence plan."}]}],"explain":"Three senior calls in order. First, reconciliation: the trusted IP and the approved push both point to 'her', and the physics plus the forwarding rule point away — telemetry with a physical impossibility wins, so treat it as compromise. Second, containment with a named cost: revoking an executive's sessions mid-flight is disruptive, and it is still correct, because the alternative costs more. Third, evidence before state change: the forwarding rule and what it forwarded are the artefacts the case runs on, and the reset is only safe to run once they are exported. The exercise's discipline: name the cost, accept it, and protect the record first.","study":"Practise saying the cost out loud before the action — 'she lands to a locked account, and that is acceptable' — it is what decides the call.","hint":"One signal can be spoofed with a click, one can be spoofed with a string, and one is physics. The forwarding rule is the tell for what matters next."},{"id":"X12","title":"Object-model fluency","type":"match","summary":"Match each ATT&CK row to its object type","scen":[{"label":"CONTEXT","body":"A new analyst on the CTI desk keeps calling everything 'a technique'. The lead hands over four rows from the T1589.003 ecosystem and one instruction: name the object type of each, because report consumers read object types before they read descriptions.","kind":"prose"}],"q":"Match each row to its ATT&CK object type.","left":["M1056 — Pre-compromise","DET0857 — Detection of Employee Names","T1589.003 — Employee Names","T1589 — Gather Victim Identity Information"],"right":["Mitigation","Detection Strategy","Sub-technique","Technique"],"correct":[0,1,2,3],"why":["M-IDs are mitigations — control guidance attached to techniques.","DET-IDs are detection strategies — the family an analytic like AN1989 lives in.","Dotted T-IDs under a parent are sub-techniques.","Undotted T-IDs are techniques — the parent here."],"explain":"Four ID spaces, four object types: M for mitigation, DET for detection strategy (with AN-prefixed analytics inside), dotted T for sub-technique, undotted T for technique. The fluency matters because a report that calls M1056 a 'technique' tells every experienced reader that the author did not read the page. It also changes meaning: mitigations describe what defenders do, techniques describe what adversaries do — the two families must never blur in a board document.","study":"Drill the ID-space map: M / DET+AN / T.dotted / T.undotted.","hint":"Ask for each row: does it describe the adversary, the defence, the control, or the detection?"},{"id":"X13","title":"Harm-adjusted minimisation","type":"order","summary":"Rank five M1056 actions by effect against business harm","scen":[{"label":"CONTEXT","body":"The exposure programme has five candidate actions and a constraint the board added: recruiting depends on staff visibility, and the listing rule requires publishing executive names. Rank the actions by where you start — best effect-per-harm first, the action that harms the business most goes last even if it is the most complete.","kind":"prose"}],"q":"Order the five actions from first to last.","items":["Role-based aliases for public finance and IT contacts","Trim photos and direct dials from the staff page (keep name and department)","Publish social-media guidance for staff (what to post about work)","Quarterly exposure re-scan with a takedown workflow","Full removal of all staff mentions from the public site"],"why":["Highest effect, near-zero harm: aliases break name-to-address derivation for the most-targeted roles.","High effect, low harm: the enrichment that feeds lures goes; the visibility recruiting needs stays.","Medium effect, low harm: staff posts are a real source, and guidance costs little.","Process, not reduction: the re-scan keeps the programme measured — but it removes nothing by itself.","Maximum completeness, maximum harm: it breaks the listing duty and recruiting — the board's constraints make it the last resort, not the first."],"explain":"The ranking encodes two constraints at once: threat effect and business harm. The alias and trim actions come first because they cut the derivation path and the lure material at almost no cost to anyone. The full-removal action — the one 'complete' fix everyone proposes first — ranks last because it collides with both the listing rule and the recruiting dependency, which is exactly the best-practice-wrong pattern this tier tests. A programme that starts at the bottom of this list dies in its first legal review; one that starts at the top ships this quarter.","study":"Write the effect-per-harm ratio for your own top three exposures and defend the order to a sceptic.","hint":"Two actions reduce nothing by themselves, and one action violates a stated constraint — neither starts the list."},{"id":"X14","title":"The ten-minute decision","type":"decision","summary":"Gaps in the timeline — declare, or escalate for the retention export","scen":[{"label":"CONTEXT","kind":"prose","body":"18:20. The CISO needs a decision in ten minutes: 'When did this campaign start, and are we done?' The artefacts you hold: a careers-site log that rotated two days ago, gateway logs for the wave (yesterday), and a note that the SaaS provider holds 30 days of full retention — requestable, but it takes hours and a ticket. Two team members already disagree loudly."},{"label":"ARTEFACT 1 — what the folder shows","kind":"code","body":"careers log: covers last 2 days (older rotated away)\ngateway log: covers yesterday only\nprovider:    30d full retention — export on request\nvisible:     scraping on day-2, wave on day-1"},{"label":"ARTEFACT 2 — the room's two positions","kind":"code","body":"Analyst A: \"Campaign started day-2; we are done.\"\nAnalyst B: \"Campaign may be older; we cannot know.\""}],"q":"Answer both steps before the CISO's clock runs out.","steps":[{"q":"Step 1 — What can the visible window actually establish?","opts":[{"t":"Scraping on day-2 and the wave on day-1 — nothing about anything earlier","correct":true,"outcome":"Right: the window bounds the claims; both analysts' start-date theories exceed what the folder can prove."},{"t":"Analyst A is right — day-2 is the start","correct":false,"outcome":"Day-2 is the first VISIBLE day; rotation ate the earlier record, not the earlier activity."},{"t":"Analyst B is right — assume the campaign is months old","correct":false,"outcome":"The symmetric error: the gap supports no specific age either."},{"t":"The gap means the logs are clean","correct":false,"outcome":"Absence of records is absence of records — nothing more."}]},{"q":"Step 2 — What do you tell the CISO?","opts":[{"t":"State the bounded findings, open the retention-export request, and keep containment measures running meanwhile","correct":true,"outcome":"Correct: the honest answer plus the escalation that can close the gap — decisions continue on what is already known."},{"t":"Declare the campaign timeline closed on A's date","correct":false,"outcome":"A confident, unsupported statement that the 30-day export will embarrass."},{"t":"Declare everything on hold until the export lands","correct":false,"outcome":"The known findings already justify the running measures — freezing them serves nobody."},{"t":"Tell the CISO the logs were deleted and nothing can be known","correct":false,"outcome":"Rotated is not deleted: the provider holds 30 days and the request is a ticket away."}]}],"explain":"Ten-minute decisions are won by scoping. The visible window supports exactly two claims — scraping on day-2, the wave on day-1 — and both analysts' start-date theories exceed it in opposite directions. The correct answer to the CISO combines three moves executives understand: state what is bounded, escalate for the record that can extend it (the provider's 30-day retention), and keep the measures that the known findings already justify. Neither 'declare victory' nor 'freeze everything' survives the export.","study":"Practise the three-part answer: bounded findings, one escalation, measures continue.","hint":"The constraint is the rotation, and the provider note is not decoration — it names the escalation that resolves the dispute."},{"id":"X15","title":"The handover note","type":"multi","summary":"Select what the next shift may rely on","scen":[{"label":"CONTEXT","kind":"prose","body":"22:00 handover. The incoming shift lead will make decisions from your note alone. Six candidate lines are drafted; select the ones the next shift may RELY on — the rest are opinion, noise, or claims the folder cannot support."},{"label":"ARTEFACT 1 — drafted lines","kind":"code","body":"L1  \"Scraping of /about/team observed on the visible\n      days; earlier days rotated.\"\nL2  \"Wave of named-greeting mails to finance from a\n      30-hour-old domain; 14 recipients.\"\nL3  \"One MFA-approved login on the CFO account during\n      physically impossible travel; rule + forwards exported.\"\nL4  \"The adversary is almost certainly Kimsuky.\"\nL5  \"Staff probably ignore these lures anyway.\"\nL6  \"Staff LinkedIn browsing during working hours is part\n      of the collection.\""}],"q":"Select the lines the next shift may rely on.","opts":[{"t":"L1 — scoped scraping claim with the rotation caveat","correct":true,"why":"Bounded, honest about the gap, and decision-ready."},{"t":"L2 — the wave with its infrastructure fact","correct":true,"why":"Direct gateway evidence with the signature named."},{"t":"L3 — the impossible-travel login and the export","correct":true,"why":"The case's pivot fact, stated with its supporting artefacts."},{"t":"L4 — 'almost certainly Kimsuky'","correct":false,"why":"Flat attribution on TTP overlap — the exact claim X07 dismantled; the next shift must not inherit it."},{"t":"L5 — staff 'probably ignore' the lures","correct":false,"why":"Opinion with no artefact behind it — and disproven by the confirmed login."},{"t":"L6 — staff browsing framed as collection","correct":false,"why":"The noise from the case file, reframed as adversary activity."}],"explain":"A handover note is a trust contract: three lines survive because each carries its artefact and its scope; three fail because each would send the next shift chasing an opinion, a rumour, or noise. L4 is the expensive failure — a flat attribution would steer the whole investigation toward one actor before the infrastructure evidence exists. Write handovers as if the reader will act within minutes, because they will.","persp":{"a":"From the operator's side, an inherited flat-attribution line is a gift: it focuses the victim's attention while the real work continues elsewhere.","d":"From the defender's side, every scoped, artefact-backed line in a handover is an hour the next shift does not spend re-deriving the case."},"study":"Audit your last handover: how many lines carry an artefact reference, and how many carry a mood?","hint":"One line names an actor with certainty the folder never earned; two lines are moods wearing evidence clothes."},{"id":"X16","title":"Red move, blue counter","type":"decision","summary":"The dual-perspective rehearsal on the same data","scen":[{"label":"CONTEXT","kind":"prose","body":"Purple-team rehearsal, same board, two chairs. The finance wave was blocked after two hours; the sender set is burned; nothing else changed — the staff page still lists names, roles and direct dials, and the derived addresses still work. You take the red chair first, then the blue chair."},{"label":"ARTEFACT 1 — what survives the block","kind":"code","body":"still public: staff page (names, roles, dials)\nstill valid:  derived first.last@ addresses\nstill true:   blocked sender set is known to the defender"}],"q":"Answer from both chairs.","steps":[{"q":"Step 1 — RED chair: your cheapest effective next move?","opts":[{"t":"Rotate infrastructure and run the same name-derived pattern against the second department","correct":true,"outcome":"Right: the data pool is untouched, the derivation still works, and only the sender set burned — reusing the recon is the cheap move."},{"t":"Abandon the campaign — the recon is spent","correct":false,"outcome":"Nothing about the recon was spent: only the senders were."},{"t":"Switch the operation to endpoint malware deployment","correct":false,"outcome":"A scope leap with no recon support and a completely different risk profile."},{"t":"Re-run the identical wave from the same senders","correct":false,"outcome":"The burned sender set is the one thing the defender is now watching."}]},{"q":"Step 2 — BLUE chair: which counter blunts the reuse of the SAME data across departments?","opts":[{"t":"Shrink the pool: role-based aliases and a trimmed staff page, then keep the greeting analytic watching","correct":true,"outcome":"Correct: the reuse depends on the pool and the derivation — attacking those inputs blunts every department at once."},{"t":"Block the new sender domains as they appear","correct":false,"outcome":"Perpetual whack-a-mole: it answers each wave after it lands and starves nothing upstream."},{"t":"Retrain only the finance team","correct":false,"outcome":"The red plan already named the next department — the defence would guard the last war."},{"t":"Wait for the next wave and study it","correct":false,"outcome":"The pool and the derivation are known inputs; waiting studies what you can already change."}]}],"explain":"The two chairs ask opposite questions of the same artefact set. The red chair reads the board as an operator: the block burned senders, not recon — the pool, the derivation and the playbook all survive, so the cheap move reuses them against the next department. The blue chair must therefore stop answering waves and start attacking inputs: aliases and a trimmed page degrade every future derivation, and the greeting analytic covers what still gets through. That is the dual perspective in one board game — the same public staff data is the attacker's cheapest resource and the defender's only upstream lever.","persp":{"a":"The red read: recon data is a reusable asset; a burned sender set is a round of ammunition, not the war.","d":"The blue read: you cannot block the reading of a page — you can only shrink the page and watch the mail."},"study":"Run this two-chair exercise on any artefact your team owns: what survives the block, and what input feeds the reuse?","hint":"Both chairs read the same three artefact lines — one asks what still works for the operation, the other asks what feeds it."}]};
</script>
<script>

(function(){
'use strict';
var D = window.__EXAM__;
var $ = function(s,r){return (r||document).querySelector(s);};
var EL = document.createElement('div');

function esc(s){ EL.textContent = String(s==null?'':s); return EL.innerHTML; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function fmtT(sec){ sec=Math.max(0,Math.round(sec)); var m=Math.floor(sec/60),s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function scoreExercise(h,w,n){ if(n<=0){return 0;} return Math.max(0,(h-w)/n); }
function normalize(s){ return String(s||'').toLowerCase().replace(/[.,;:!?"'`()\[\]]/g,' ').replace(/\s+/g,' ').trim(); }

/* ---------------- app state ---------------- */
var S = {
  view:'intro', order:[], idx:0,
  checked:{}, skipped:{}, credit:{}, rows:{}, canonical:{}, dangerous:{},
  hintUsed:{}, inReview:false,
  timer:{ state:'IDLE', remaining:0, per:{ active:false, rem:0 } },
  acc:{ manual:0, auto:0 }, sinceManual:null, sinceAuto:null,
  reported:false, user:null
};
var widget = null; /* current exercise widget controller */

/* ---------------- topbar ---------------- */
function sevClass(){ return {easy:'b-easy',medium:'b-medium',hard:'b-hard','extremely-hard':'b-extreme'}[D.meta.difficulty]; }
function topbarHTML(){
  return '<div class="topbar-in">'
   +'<span class="tb-count" id="tb-count"></span>'
   +'<span class="badge '+sevClass()+'"><span class="dot"></span>'+esc(D.meta.sevWord)+'</span>'
   +'<span class="tb-timer" id="tb-timer" aria-label="exam timer">--:--</span>'
   +'<span class="tb-state" id="tb-state"></span>'
   +'<span class="tb-spacer"></span>'
   +'<span class="tb-user" id="tb-user"></span>'
   +'<span class="tb-score" id="tb-score" aria-label="live score"></span>'
   +'<button class="btn btn-ghost" id="bt-hint" title="Reveal one hint (costs 10 percent of this exercise credit)">\u25C9 Hint</button>'
   +'<button class="btn btn-ghost" id="bt-pause" title="Manual pause: hides the exercise and stops the timer">\u23F8 Pause</button>'
   +'<button class="btn btn-ghost" id="bt-skip" title="Skip: move this exercise to the skipped pool">\u26A0 Skip</button>'
   +'</div><div class="pbar"><div class="pbar-in" id="pbar-in"></div></div>';
}
function renderUser(){
  var el = $('#tb-user'); if(!el){return;}
  if(S.user && S.user.username){ el.textContent = 'Analyst: '+S.user.username+(S.user.country && S.user.country!=='ZZ' ? ' ('+S.user.country+')' : ''); }
}
function updateTopbar(){
  var ex = curEx();
  $('#tb-count').textContent = S.view==='exam' ? ('Exercise '+(S.order.indexOf(S.idx)+1)+' of '+S.order.length) : '';
  var t = $('#tb-timer'); var st = $('#tb-state');
  t.textContent = fmtT(S.timer.remaining);
  var btp = $('#bt-pause');
  if(S.timer.state==='RUNNING'){ t.style.color='var(--state-correct)'; st.textContent='\u25B6 RUNNING'; st.style.color='var(--state-correct)'; btp.disabled=false; }
  else if(S.timer.state==='PAUSED_MANUAL'){ t.style.color='var(--state-paused)'; st.textContent='\u23F8 PAUSED \u2014 manual (press Resume)'; st.style.color='var(--state-paused)'; }
  else if(S.timer.state==='PAUSED_AUTO_CHECK'){ t.style.color='var(--state-paused)'; st.textContent='\u23F8 PAUSED \u2014 reviewing feedback (resumes on Next)'; st.style.color='var(--state-paused)'; }
  else if(S.timer.state==='ENDED'){ t.style.color='var(--state-skipped)'; st.textContent='\u25A0 ENDED'; st.style.color='var(--state-skipped)'; }
  else { st.textContent=''; }
  var sum=0, cnt=0;
  for(var k in S.credit){ sum+=S.credit[k]; cnt++; }
  var sc=$('#tb-score');
  if(cnt>0){ var pct=Math.round((sum/cnt)*100); sc.innerHTML='<b>'+sum.toFixed(1)+'</b> / '+cnt+' <span class="pct">\u00B7 '+pct+'%</span>'; }
  else { sc.innerHTML='<b>0.0</b> / 0 <span class="pct">\u00B7 start answering</span>'; }
  var p = S.view==='exam' ? ((S.order.indexOf(S.idx)+1)/S.order.length*100) : (S.view==='results'?100:0);
  $('#pbar-in').style.width = p+'%';
  document.body.setAttribute('data-exact-score', String(sum));
  renderUser();
}

/* ---------------- timer ---------------- */
var lastTick = null;
setInterval(function(){
  var now = Date.now();
  if(lastTick===null){ lastTick=now; return; }
  var dt = now-lastTick; lastTick=now;
  if(S.timer.state==='RUNNING'){
    S.timer.remaining -= dt/1000;
    if(S.timer.per.active){ S.timer.per.rem -= dt/1000;
      var pe=$('#per-timer-v'); if(pe){ pe.textContent = fmtT(S.timer.per.rem);
        if(S.timer.per.rem<=30){ pe.style.color='var(--state-incorrect)'; } }
      if(S.timer.per.rem<=0){ S.timer.per.active=false; if(widget&&widget.autoSubmit){ widget.autoSubmit(); } }
    }
    if(S.timer.remaining<=0){ S.timer.remaining=0; S.timer.state='ENDED'; endExam('timeout'); }
    if(S.view==='exam'||S.view==='review'){ updateTopbar(); }
  }
},250);
function setTimerState(st){
  if(st==='PAUSED_MANUAL'){ S.sinceManual=Date.now(); }
  if(st==='RUNNING'){ if(S.sinceManual){ S.acc.manual+=(Date.now()-S.sinceManual)/1000; S.sinceManual=null; } }
  if(st==='PAUSED_AUTO_CHECK'){ if(!S.sinceAuto){ S.sinceAuto=Date.now(); } }
}
function leaveAuto(){ if(S.sinceAuto){ S.acc.auto+=(Date.now()-S.sinceAuto)/1000; S.sinceAuto=null; } }

/* manual pause (can also be pressed on top of the Check auto-pause) */
function togglePause(){
  var t=S.timer;
  if(t.state==='RUNNING'||t.state==='PAUSED_AUTO_CHECK'){
    if(t.state==='PAUSED_AUTO_CHECK'){
      S.pendingAuto=true;
      if(S.sinceAuto){ S.acc.auto+=(Date.now()-S.sinceAuto)/1000; S.sinceAuto=null; }
    }
    t.state='PAUSED_MANUAL'; S.sinceManual=Date.now(); showPauseOverlay();
  }
  else if(t.state==='PAUSED_MANUAL'){
    hidePauseOverlay();
    if(S.sinceManual){ S.acc.manual+=(Date.now()-S.sinceManual)/1000; S.sinceManual=null; }
    if(S.pendingAuto){ t.state='PAUSED_AUTO_CHECK'; if(!S.sinceAuto){ S.sinceAuto=Date.now(); } }
    else { t.state='RUNNING'; }
  }
  updateTopbar();
}
function showPauseOverlay(){
  var o=document.createElement('div'); o.className='overlay'; o.id='pause-overlay';
  o.innerHTML='<div class="overlay-card"><div class="big">\u23F8</div><h2>PAUSED \u2014 manual break</h2>'
   +'<p>The timer is stopped and the exercise is hidden. Press Resume when you are ready to continue.</p>'
   +'<button class="btn btn-primary btn-lg" id="bt-resume">Resume exam</button></div>';
  document.body.appendChild(o);
  $('#bt-resume').addEventListener('click', togglePause);
}
function hidePauseOverlay(){ var o=$('#pause-overlay'); if(o){ o.remove(); } }

/* ---------------- views ---------------- */
function show(id){ ['view-intro','view-exam','view-review','view-results'].forEach(function(v){ var el=$('#'+v); if(el){ el.classList.add('hidden'); } }); $('#'+id).classList.remove('hidden'); window.scrollTo(0,0); }

function renderIntro(){
  var I=D.intro, m=D.meta;
  var h='<div class="intro-head"><h1>'+esc(I.h1)+'</h1>'
   +'<p class="small">'+esc(m.objId+' \u2014 '+m.objName)+' \u00B7 '+esc(I.objType)+'</p>'
   +'<div class="factrow">'
   +'<span class="badge '+sevClass()+'"><span class="dot"></span>'+esc(m.sevWord)+'</span>'
   +'<span class="fact"><b>'+D.exercises.length+'</b> exercises</span>'
   +'<span class="fact">estimated <b>'+m.estimatedMinutes+' min</b> \u00B7 timer budget <b>'+fmtT(m.timerSeconds)+'</b></span>'
   +'<span class="fact">pass mark <b>'+m.passMark+'%</b></span>'
   +'</div></div>';
  h+='<div class="panel"><h2>'+esc(I.learnTitle)+'</h2>'+I.learn.map(function(p){return '<p>'+p+'</p>';}).join('')+'</div>';
  h+='<div class="panel"><h2>Keywords covered in this exam</h2>';
  I.themes.forEach(function(t){ h+='<div class="kw-theme"><h3>'+esc(t.name)+'</h3><div class="kw-list">'
    +t.items.map(function(x){return '<span class="kw">'+esc(x)+'</span>';}).join('')+'</div></div>'; });
  h+='</div>';
  h+='<div class="panel"><h2>How this exam works</h2><ul class="rules">';
  I.how.forEach(function(r){ h+='<li>'+r+'</li>'; });
  h+='</ul><div class="btn-row"><button class="btn btn-primary btn-lg" id="bt-start">\u25B6 Start the exam</button></div></div>';
  $('#view-intro').innerHTML=h;
  $('#bt-start').addEventListener('click', startExam);
}

/* ---------------- exam flow ---------------- */
function startExam(){
  S.order = shuffle(D.exercises.map(function(e,i){return i;}));
  S.idx = S.order[0]; S.checked={}; S.skipped={}; S.credit={}; S.rows={}; S.canonical={}; S.dangerous={};
  S.hintUsed={}; S.inReview=false; S.pendingAuto=false; S.reported=false; S.postedNow=false;
  S.acc={manual:0,auto:0}; S.sinceManual=null; S.sinceAuto=null;
  S.timer.remaining=D.meta.timerSeconds; S.timer.per={active:false,rem:0};
  S.timer.state='RUNNING';
  S.view='exam'; S.inReview=false; S.pendingReview=false;
  show('view-exam'); renderExercise(S.idx); updateTopbar();
}
function curEx(){ return D.exercises[S.idx]; }
