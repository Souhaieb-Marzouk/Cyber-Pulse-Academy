<style>
:root{
  --bg-page:#0b1020; --bg-surface:#121a2e; --bg-surface-2:#0f1729;
  --border:#243049; --text-primary:#e6ecff; --text-secondary:#a9b4d0; --text-mono:#c8ffd4;

  --state-skipped:#a9b4d0; --state-paused:#9d7bff;

  --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  --radius:8px; --shadow:0 6px 18px var(--shadow-c); --shadow-c:rgba(0,0,0,.35);
  --glow-blue:rgba(90,169,255,.10); --lift-1:rgba(255,255,255,.03); --sheen:rgba(255,255,255,.22);
  --hdr-bg:rgba(11,16,32,.92); --overlay:rgba(7,10,22,.9);
  --ok-dim:rgba(87,211,140,.08); --part-dim:rgba(255,180,84,.08); --bad-dim:rgba(255,107,107,.08);
  --skip-dim:rgba(169,180,208,.08); --pause-dim:rgba(157,123,255,.10);
  --accent-blue-dim:rgba(90,169,255,.14); --accent-amber-dim:rgba(255,180,84,.14); --accent-green-dim:rgba(87,211,140,.14);
  --ok-glow:rgba(87,211,140,.06); --ok-wash:rgba(87,211,140,.07); --bad-wash:rgba(255,107,107,.07);
  --part-border:rgba(255,180,84,.4); --hint-dim:rgba(255,180,84,.07); --hint-border:rgba(255,180,84,.35);
  --chip-k-border:#33415f; --opt-hover:#16203a; --ink-dark:#08101f; --ink-amber:#201503; --row-dash:#202b45;
  --tk-time:#8fd6ff; --tk-ip:#ff8a3d;
  color-scheme:dark;
}
body[data-sev="easy"]{--sev:var(--sev-easy)}
body[data-sev="medium"]{--sev:var(--sev-medium)}
body[data-sev="hard"]{--sev:var(--sev-hard)}
body[data-sev="extremely-hard"]{--sev:var(--sev-extreme)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--text-primary);font-family:var(--font-sans);
  font-size:16px;line-height:1.55;
  background-image:radial-gradient(1100px 420px at 50% -160px,var(--glow-blue),transparent 70%);}
.wrap{max-width:940px;margin:0 auto;padding:14px 16px 60px}
h1,h2,h3{line-height:1.25}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px}
button{font-family:inherit}
a{color:var(--accent-blue)}
.mono{font-family:var(--font-mono);color:var(--text-mono)}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px 18px;margin:14px 0}
.card+.card{margin-top:16px}
.card h2{margin:0 0 10px;font-size:19px}
.sec-note{color:var(--text-secondary);font-size:14px;margin:0 0 10px}
.chip{display:inline-block;border:1px solid var(--border);background:var(--bg-surface-2);

.badge.sev{color:var(--sev);border-color:var(--sev);background:var(--lift-1)}
.badge.ok{color:var(--state-correct);border-color:var(--state-correct);background:var(--ok-dim)}
.badge.part{color:var(--state-partial);border-color:var(--state-partial);background:var(--part-dim)}
.badge.bad{color:var(--state-incorrect);border-color:var(--state-incorrect);background:var(--bad-dim)}
.badge.skip{color:var(--state-skipped);border-color:var(--state-skipped);background:var(--skip-dim)}
.badge.pause{color:var(--state-paused);border-color:var(--state-paused);background:var(--pause-dim)}
/* ---------- sticky exam header ---------- */
#hdr{position:sticky;top:0;z-index:40;background:var(--hdr-bg);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border);padding:8px 14px;display:none}
#hdr .row{max-width:940px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
#hdr .title{font-weight:700;font-size:14px;margin-right:2px}
#hdr .grow{flex:1 1 auto}
.tchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:14px;
  color:var(--text-primary);border:1px solid var(--border);background:var(--bg-surface-2);
  border-radius:6px;padding:4px 10px;min-height:32px}
.tchip .lbl{font-family:var(--font-sans);font-size:12px;color:var(--text-secondary)}
.tchip.paused{color:var(--state-paused);border-color:var(--state-paused)}
.tchip.ended{color:var(--state-incorrect)}
#hdr button{min-height:44px}
#prog{height:6px;background:var(--bg-surface-2);border-bottom:1px solid var(--border);position:relative;overflow:hidden;display:none}
#prog .fill{position:absolute;left:0;top:0;bottom:0;width:0;
  background:linear-gradient(90deg,var(--sev),var(--accent-blue));
  transition:width .5s ease}
#prog .fill::after{content:"";position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 30%,var(--sheen) 50%,transparent 70%);
  transform:translateX(-100%);animation:sheen 3.2s linear infinite}
@keyframes sheen{to{transform:translateX(100%)}}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border-radius:6px;border:1px solid var(--border);background:var(--bg-surface-2);
  color:var(--text-primary);padding:9px 16px;min-height:44px;font-size:15px;transition:filter .15s ease,transform .05s ease}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--sev);border-color:var(--sev);color:var(--ink-dark);font-weight:700}
.btn.green{background:var(--accent-green);border-color:var(--accent-green);color:var(--ink-dark);font-weight:700}
.btn.amber{background:var(--accent-amber);border-color:var(--accent-amber);color:var(--ink-amber);font-weight:700}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.big{font-size:17px;padding:12px 26px}
/* ---------- intro ---------- */
.intro-hdr{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.intro-hdr h1{margin:0;font-size:22px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}
.fact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:8px 12px}
.fact .k{color:var(--text-secondary);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.fact .v{font-size:15px;font-weight:600}
.learn p{margin:9px 0}
.kw-theme{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:10px 0}
.kw-theme h3{margin:0 0 8px;font-size:14px;color:var(--accent-blue)}
.howlist{margin:8px 0;padding-left:0;list-style:none}
.howlist li{margin:7px 0;padding-left:26px;position:relative;color:var(--text-primary)}
.howlist li::before{content:"\25B8";position:absolute;left:6px;color:var(--accent-green)}
/* ---------- exercise blocks ---------- */
.ex-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 4px}
.ex-top .cnt{font-weight:700}
.blk{border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-surface);margin:14px 0;overflow:hidden}
.blk-h{display:flex;align-items:center;gap:8px;padding:9px 14px;font-weight:700;font-size:14px;
  letter-spacing:.8px;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);min-height:44px}
.blk-h .ic{font-size:15px}
.blk-h .sum{font-weight:400;color:var(--text-secondary);font-size:13px;flex:1 1 auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk-h .tgl{font-size:12px;color:var(--text-secondary);font-weight:400}
.blk.scen .blk-h{color:var(--accent-blue);background:linear-gradient(90deg,var(--accent-blue-dim),transparent)}
.blk.q .blk-h{color:var(--accent-amber);background:linear-gradient(90deg,var(--accent-amber-dim),transparent);cursor:default}
.blk.ans .blk-h{color:var(--accent-green);background:linear-gradient(90deg,var(--accent-green-dim),transparent);cursor:default}
.blk .blk-b{padding:13px 15px;background:var(--bg-surface)}
.blk.collapsed .blk-b{display:none}
.blk.q .blk-b{font-weight:700;font-size:16.5px}
.artefact{border:1px solid var(--border);border-radius:6px;margin:10px 0;background:var(--bg-surface-2)}
.artefact .art-lbl{display:block;font-family:var(--font-mono);font-size:12px;color:var(--accent-blue);
  padding:6px 12px;border-bottom:1px solid var(--border);letter-spacing:.5px}
.artefact pre{margin:0;padding:10px 12px;overflow-x:auto;font-family:var(--font-mono);font-size:14px;line-height:1.6;color:var(--text-mono)}
.artefact p{margin:0;padding:10px 12px;color:var(--text-primary)}
pre.code{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;
  font-family:var(--font-mono);font-size:14px;color:var(--text-mono);overflow-x:auto;margin:8px 0}
/* syntax highlight tokens */
.tk-time{color:var(--tk-time)}.tk-path{color:var(--accent-amber)}.tk-ip{color:var(--tk-ip)}.tk-key{color:var(--state-paused)}
.tk-lvl{color:var(--state-incorrect);font-weight:600}.tk-str{color:var(--accent-green)}.tk-file{color:var(--text-mono)}
/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:6px;color:var(--text-primary);padding:11px 13px;
  min-height:44px;font-size:15px;cursor:pointer;transition:background .12s ease}
.opt:hover{background:var(--opt-hover)}
.opt .lt{font-family:var(--font-mono);font-weight:700;color:var(--accent-blue);min-width:22px}
.opt.sel{border-color:var(--sev);box-shadow:inset 3px 0 0 var(--sev),0 0 0 1px var(--sev)}
.opt.sel .tag{color:var(--sev);font-size:12px;font-weight:700;margin-left:auto}
.opt.right{border-color:var(--state-correct)}
.opt.wrong{border-color:var(--state-incorrect)}
.opt.dim{opacity:.75}
/* ---------- matching ---------- */
.matchrow{display:grid;grid-template-columns:1fr 240px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--row-dash)}
.matchrow:last-child{border-bottom:none}
.matchrow .lt{color:var(--text-primary)}
.matchrow select{width:100%;min-height:44px;background:var(--bg-surface-2);color:var(--text-primary);
  border:1px solid var(--border);border-radius:6px;padding:8px;font-size:14px}
.matchrow select:disabled{opacity:.8}
/* ---------- fill ---------- */
.fillwrap .sent{font-size:16px;line-height:2}
.fillwrap input{background:var(--bg-surface-2);border:1px solid var(--border);border-bottom:2px solid var(--accent-green);
  color:var(--text-mono);font-family:var(--font-mono);font-size:15px;border-radius:6px 6px 0 0;
  padding:7px 10px;min-width:110px;min-height:44px;margin:0 4px}
.fillwrap input:disabled{opacity:.85}
/* ---------- dnd / order ---------- */
.dndgrid{display:grid;gap:12px}
.dnd-zones{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.zone{border:1px dashed var(--border);border-radius:6px;background:var(--bg-surface-2);min-height:70px;padding:8px}
.zone.over{border-color:var(--accent-green);background:var(--ok-glow)}
.zone .z-h{font-size:13px;font-weight:700;color:var(--accent-blue);margin:0 0 6px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--bg-surface);border:1px solid var(--border);
  border-radius:999px;padding:6px 12px;margin:3px;cursor:pointer;min-height:44px;font-size:14px;color:var(--text-primary)}
.pill.sel{border-color:var(--sev);box-shadow:0 0 0 1px var(--sev)}
.pill[draggable="true"]{cursor:grab}
.bank{background:var(--bg-surface-2);border:1px dashed var(--border);border-radius:6px;padding:8px;min-height:52px}
.bank .b-h{font-size:12px;color:var(--text-secondary);margin:0 0 4px}
.seq{list-style:none;margin:8px 0 0;padding:0}
.seq li{display:flex;gap:8px;align-items:center;background:var(--bg-surface-2);border:1px solid var(--border);
  border-radius:6px;padding:8px 10px;margin:6px 0;min-height:44px}
.seq .n{font-family:var(--font-mono);color:var(--accent-amber);font-weight:700}
/* ---------- terminal ---------- */
.term{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;
  font-family:var(--font-mono);font-size:14px;color:var(--text-mono)}
.term .scr{min-height:60px;max-height:230px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term .pline{display:flex;gap:8px;align-items:center;margin-top:8px}
.term .pr{color:var(--accent-green);font-weight:700;white-space:nowrap}
.term input{flex:1;background:transparent;border:none;color:var(--text-mono);font-family:var(--font-mono);
  font-size:14px;padding:8px 2px;min-height:44px}
.term .err{color:var(--state-incorrect)}
.term .out{color:var(--text-secondary)}
.synpanel{background:var(--bg-surface-2);border:1px solid var(--border);border-left:3px solid var(--accent-blue);
  border-radius:6px;padding:10px 12px;margin:10px 0;font-size:14px}
.synpanel .h{color:var(--accent-blue);font-weight:700;font-size:13px;margin-bottom:6px}
.synpanel pre{margin:6px 0;font-family:var(--font-mono);font-size:13.5px;color:var(--text-mono)}
.synpanel ul{margin:6px 0 0 18px;padding:0;color:var(--text-secondary);font-size:13.5px}
/* ---------- branch steps ---------- */
.stepchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--border);border-radius:999px;
  padding:4px 10px;font-size:12.5px;margin:2px 6px 2px 0;color:var(--text-secondary);background:var(--bg-surface-2)}
.stepchip.cur{color:var(--accent-amber);border-color:var(--accent-amber);font-weight:700}
/* ---------- feedback ---------- */
.fbk{border:1px solid var(--border);border-left:4px solid var(--text-secondary);border-radius:var(--radius);
  background:var(--bg-surface);margin:16px 0 0;padding:13px 15px}
.fbk.ok{border-left-color:var(--state-correct)}
.fbk.part{border-left-color:var(--state-partial)}
.fbk.bad{border-left-color:var(--state-incorrect)}
.fbk .fbk-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-weight:700;font-size:16px}
.fbk .credit{font-family:var(--font-mono);font-size:14px;color:var(--text-secondary)}
.items{margin:10px 0 0;padding:0;list-style:none}
.items li{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;margin:4px 0;
  background:var(--bg-surface-2);border:1px solid var(--border);font-size:14px}
.items .v{font-weight:700;white-space:nowrap}
.v.ok{color:var(--state-correct)}.v.bad{color:var(--state-incorrect)}.v.miss{color:var(--state-skipped)}.v.danger{color:var(--state-incorrect)}
.fbk .why{color:var(--text-secondary);font-size:14px;margin:9px 0 0}
.fbk .study{margin:9px 0 0;padding:9px 12px;border-radius:6px;background:var(--part-dim);
  border:1px solid var(--part-border);font-size:14px}
.fbk .study .h{color:var(--accent-amber);font-weight:700}
.hintbox{margin:12px 0 0;padding:10px 13px;border-radius:6px;background:var(--hint-dim);
  border:1px solid var(--hint-border);font-size:14px}
.hintbox .h{color:var(--accent-amber);font-weight:700}
.exfoot{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
/* ---------- pause overlay ---------- */
#pauseOverlay{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:var(--overlay);backdrop-filter:blur(3px)}
#pauseOverlay .box{text-align:center;max-width:420px;padding:30px}
#pauseOverlay .big{font-size:44px;color:var(--state-paused)}
#pauseOverlay h2{color:var(--state-paused);margin:10px 0 6px}
#pauseOverlay p{color:var(--text-secondary)}
/* ---------- review & results ---------- */
.revlist{list-style:none;margin:10px 0;padding:0}
.revlist li{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:6px;padding:10px 13px;margin:8px 0}
.revlist .t{flex:1 1 auto;font-weight:600}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:12px 14px}
.stat .n{font-size:26px;font-weight:800;font-family:var(--font-mono)}
.stat .l{color:var(--text-secondary);font-size:13px}
.stat.ok .n{color:var(--state-correct)}.stat.part .n{color:var(--state-partial)}
.stat.bad .n{color:var(--state-incorrect)}.stat.skip .n{color:var(--state-skipped)}
.verdict{border-radius:var(--radius);border:1px solid;padding:18px;margin:16px 0;text-align:center}
.verdict.pass{border-color:var(--state-correct);background:var(--ok-wash)}
.verdict.fail{border-color:var(--state-incorrect);background:var(--bad-wash)}
.verdict .big{font-size:30px;font-weight:800;letter-spacing:1px}
.verdict.pass .big{color:var(--state-correct)}
.verdict.fail .big{color:var(--state-incorrect)}
.verdict p{color:var(--text-secondary);margin:8px 0 0}
.score-line{font-family:var(--font-mono);font-size:17px}
.score-line b{color:var(--sev)}
/* ---------- responsive & motion ---------- */
@media (max-width:640px){
  .matchrow{grid-template-columns:1fr}
  .blk-h .sum{display:none}
  body{font-size:15px}
}
@media (prefers-reduced-motion: reduce){
  #prog .fill::after{animation:none;display:none}
  *{transition:none!important;animation:none!important}
}
</style>
</head>

<script>
window.EXAM = {"meta": {"topicId": "t1547", "batch": 2, "title": "T1547 Boot or Logon Autostart Execution \u2014 MEDIUM", "difficulty": "medium", "questionCount": 16, "estimatedMinutes": 35, "passMark": 70}, "severity": {"key": "medium", "label": "MEDIUM"}, "timer": {"budgetSeconds": 2100}, "intro": {"objectLine": "T1547 - Boot or Logon Autostart Execution - MITRE ATT&CK Technique - Tactics: Persistence, Privilege Escalation - Platforms: Windows, macOS, Linux", "learn": ["This is the second step for T1547 - Boot or Logon Autostart Execution, the ATT&CK technique for making a program start by itself at boot or logon. The easy level gave you the foundations. Here you always combine two facts: you see an artefact, name the sub-technique, and then choose the right next move.", "You will practise the daily work of a SOC analyst: reading Sysmon and EDR events, deciding whether a run key write is a real persistence attempt, and knowing what to collect for the incident team. You will also practise threat-hunting tasks: which registry keys, folders, and ATT&CK data sources you must cover so nothing is missed.", "You will sit in the attacker's chair twice. Understanding why an attacker picks HKCU instead of HKLM - or a print processor instead of a run key - helps you predict where the next persistence will appear. You will also feel the IR side: the safe order to clean a host, and why deleting evidence first is a mistake.", "Finally you will tune an analytic. Legitimate software uses autostart locations constantly, so a detection that fires on everything is useless. The skill you build here is separation: what is normal in your environment, and what is new."], "keywords": [{"t": "Sub-techniques and their host processes", "items": ["T1547.001 Run keys and Startup folders", "T1547.003 Time Providers (W32Time)", "T1547.004 Winlogon Helper DLL", "T1547.005 Security Support Provider (lsass.exe)", "T1547.006 Kernel Modules", "T1547.007 Re-opened Applications", "T1547.009 Shortcut Modification", "T1547.012 Print Processors (spoolsv.exe)", "T1547.013 XDG Autostart Entries"]}, {"t": "Hunting, telemetry and tuning", "items": ["DS0024 registry modification", "DS0022 file creation", "DS0011 module load", "DS0008 kernel module load", "Sysmon EID 1 / 5 / 7 / 11 / 13", "Baselining and new-vs-known alerting", "False-positive reduction"]}, {"t": "Response and control design", "items": ["Containment that preserves evidence", "Evidence-first cleanup order", "Least privilege (User / Privileged Account Management)", "Control review language (GRC)"]}, {"t": "Attacker trade-offs", "items": ["HKCU vs HKLM scope and rights", "No-admin persistence paths", "Choosing a sub-technique to fit the foothold"]}], "how": ["You need 70% to pass. The score counts only the exercises you actually answered.", "This file has 16 exercises: one three-step decision tree, one terminal task, multi-select, matching, drag and drop, fill the blank, ordering, and single choice questions.", "Exercises with several parts give partial credit: each correct part adds credit, each wrong part you select removes credit. Selecting everything can bring your credit to zero.", "The timer counts down from 35 minutes. Press Pause for a real break: the exercise hides and the timer stops until you press Resume.", "When you press Check, the timer stops automatically so you can study the feedback. It starts again when you press Next. Skip and Hint do not stop the timer.", "Skipped exercises go to a review pool you can revisit before finishing. Skipped exercises you never answer are excluded from the score.", "One hint per exercise is allowed. A hint costs 10% of that exercise's credit."]}, "exercises": [{"id": "M01", "type": "branch", "title": "Triage the run key alert", "summary": "Decision tree: triage EDR alert P-8841 (3 steps)", "scenario": [{"p": "You are the on-call SOC analyst. The queue shows EDR alert P-8841 on host FIN-WS-114, user j.rivera."}, {"log": "ARTEFACT 1 - EDR alert P-8841", "lines": ["2026-10-20 09:12:04  ALERT  autostart-persistence (T1547.001 candidate)", "Process: reg.exe (parent WINWORD.EXE)", "Action:   value written  HKCU\\...\\CurrentVersion\\Run\\OneDriveSync", "Data:     %APPDATA%\\SyncAgent\\agent.exe   (hash not in fleet inventory)"]}], "question": "Work the triage: choose the best action for each of the three steps.", "hint": "Answer each step from the facts you have at that moment; later steps assume your earlier choices.", "explain": "Good triage separates the three jobs: identify what wrote the value and what it points to, contain the host while preserving evidence, then collect for the IR handoff. Deleting or rebooting early destroys exactly the data the IR team needs, and dismissing the alert ignores the two anomalies that matter: a document editor spawning reg.exe, and an unsigned binary outside the inventory.", "study": "Practise the triage order: identify, contain (keep power on), collect, then clean.", "steps": [{"q": "STEP 1 - The alert just arrived. What do you establish first?", "options": [{"t": "Which process wrote the value and which binary it points to", "why": "Correct. The writing process and the payload decide everything else."}, {"t": "Delete the run key immediately so the program never runs", "why": "Deleting before identification destroys evidence and may miss other persistence."}, {"t": "Close the alert - sync clients write run keys all the time", "why": "The parent process (WINWORD) and unknown hash are anomalies you must not ignore."}, {"t": "Email the whole finance team about OneDrive problems", "why": "User-wide mail does not belong in first response and alerts the possible attacker."}], "correct": 0}, {"q": "STEP 2 - You confirm: WINWORD.EXE (a document viewer here) wrote the value two minutes after the user opened invoice.docm; the binary is unsigned and new to the fleet. What now?", "options": [{"t": "Isolate the host from the network but keep it powered on", "why": "Correct. Containment stops C2 while memory and disk state stay intact."}, {"t": "Shut the host down right away to stop the attacker", "why": "Power-off destroys volatile memory - a classic early mistake."}, {"t": "Reboot the host to see if the program really starts", "why": "Rebooting runs the payload for the attacker and resets live state."}, {"t": "Wait - Office always drops sync helpers during updates", "why": "Office does not drop unsigned run keys; waiting extends attacker dwell time."}], "correct": 0}, {"q": "STEP 3 - The host is contained. What do you hand to the IR team?", "options": [{"t": "Collect the run key value, the binary, and the parent document", "why": "Correct. Value + payload + dropper is the minimal persistence package."}, {"t": "Delete the run key and the file, then close the alert as resolved", "why": "Cleanup without collection leaves IR blind to scope and root cause."}, {"t": "Reimage the laptop before anyone can look at it", "why": "Reimaging destroys the evidence needed to find how the attacker got in."}, {"t": "Warn the user about opening invoice attachments and stop there", "why": "Awareness is useful later, but it is not evidence collection."}], "correct": 0}]}, {"id": "M02", "type": "qcm", "title": "spoolsv loads a new DLL", "summary": "Image-load event in the print processor directory - which sub-technique?", "scenario": [{"p": "Sysmon on print server PRN-02 raised an image-load event during boot."}, {"log": "ARTEFACT 1 - Sysmon event", "lines": ["2026-10-21 03:40:12  EID 7  Image loaded", "Process:  spoolsv.exe  (Print Spooler service)", "Image:    C:\\Windows\\System32\\spool\\prtprocs\\x64\\prcagent.dll", "Note:     file not present in the gold-image baseline"]}], "question": "Which T1547 sub-technique does this event match?", "hint": "Two sub-techniques involve spoolsv.exe - the directory name in the path tells you which one this is.", "explain": "The path spool\\prtprocs is the print processor directory: spoolsv.exe loads every DLL registered there during boot, which is T1547.012 - Print Processors. Port Monitors also involve spoolsv.exe but load from Control\\Print\\Monitors, so the near-miss hinges on reading the path carefully.", "study": "Compare the T1547.012 and T1547.010 registry and file paths side by side.", "options": [{"t": "T1547.003 - Time Providers", "why": "Time provider DLLs are loaded by the W32Time service, not spoolsv."}, {"t": "T1547.012 - Print Processors", "why": "Correct. prtprocs is the print processor directory loaded at boot by spoolsv."}, {"t": "T1547.010 - Port Monitors", "why": "Close, but port monitors register under Control\\Print\\Monitors, not prtprocs."}, {"t": "T1547.008 - LSASS Driver", "why": "LSASS drivers are loaded by lsass.exe, not the spooler."}], "correct": [1]}, {"id": "M03", "type": "multi", "title": "Locations a run key hunt must cover", "summary": "Select all four locations for a T1547.001 hunt", "scenario": [{"p": "You are building a weekly hunt for T1547.001 on Windows hosts. The hunt must find persistence wherever a run key or Startup folder entry can hide."}], "question": "Select every location the hunt must cover.", "hint": "Two registry hives and two folders. Two of the six options are tempting but belong to other techniques or other data.", "explain": "T1547.001 lives in four places: the Run keys under HKCU and HKLM, and the Startup folders for one user and for all users (ProgramData). The Downloads folder is where payloads land, not where autostart is registered, and RunAsPPL is an LSA protection setting, not an autostart location.", "study": "List the Run, RunOnce, and Startup folder paths from the T1547.001 page.", "options": [{"t": "The user's Downloads folder", "why": "Payloads are often downloaded there, but nothing autostarts from it."}, {"t": "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run", "why": "Correct - the per-user run key."}, {"t": "The DNS server cache", "why": "Name-resolution data, unrelated to autostart registration."}, {"t": "HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run", "why": "Correct - the machine-wide run key."}, {"t": "The per-user Startup folder under AppData\\Roaming", "why": "Correct - files here run at that user's logon."}, {"t": "The common Startup folder under C:\\ProgramData", "why": "Correct - files here run at every user's logon."}], "correct": [1, 3, 4, 5]}, {"id": "M04", "type": "match", "title": "Host process to sub-technique", "summary": "Match five host processes to the sub-technique they execute", "scenario": [{"p": "Each T1547 sub-technique has a host process that loads or runs the attacker's code. Knowing the host tells you which process events to watch. Match each host to its sub-technique."}], "question": "For each host process, choose the sub-technique it executes.", "hint": "winlogon, lsass, the W32Time service, the spooler, and the kernel each play one role here.", "explain": "winlogon.exe runs helper DLLs (T1547.004). lsass.exe loads LSA security packages (T1547.005). The W32Time service inside svchost.exe loads time provider DLLs (T1547.003). spoolsv.exe loads print processors from prtprocs (T1547.012). The Linux kernel itself loads modules (T1547.006). Watching the right host process is how you catch DLL loads that never show up as ordinary programs.", "study": "For each sub-technique, note the host process named in its description.", "pairs": {"left": ["winlogon.exe at user logon", "lsass.exe loading an LSA package", "svchost.exe running the W32Time service", "spoolsv.exe reading the prtprocs directory", "the Linux kernel at boot"], "right": [{"id": "p004", "label": "T1547.004 Winlogon Helper DLL"}, {"id": "p005", "label": "T1547.005 Security Support Provider"}, {"id": "p003", "label": "T1547.003 Time Providers"}, {"id": "p012", "label": "T1547.012 Print Processors"}, {"id": "p006", "label": "T1547.006 Kernel Modules and Extensions"}, {"id": "p001", "label": "T1547.001 Registry Run Keys / Startup Folder"}], "answers": ["p004", "p005", "p003", "p012", "p006"], "whys": ["Winlogon helpers execute inside winlogon.exe at logon.", "LSA packages are DLLs that lsass.exe loads.", "The time service (W32Time) loads time provider DLLs.", "The spooler loads print processor DLLs at boot.", "Loadable kernel modules run in kernel space at boot."]}}, {"id": "M05", "type": "terminal", "title": "Add user-level run key (authorized test)", "summary": "Type the reg add command for HKCU persistence", "scenario": [{"p": "Authorized emulation, isolated lab VM, user account jtest with no admin rights. Your test plan says: 'Add user-level persistence that starts the payload at logon. Value name: OneDriveSync. Payload: %APPDATA%\\sync\\agent.exe.'"}], "question": "Type the reg command that creates this run key value in the hive that needs no admin rights.", "hint": "You need the add verb, the HKCU run key, the /v switch with the value name, and the /d switch with the payload path.", "explain": "reg add with the HKCU run key path creates the value; /v sets the value name OneDriveSync and /d sets the data to the payload path. HKCU needs no admin rights, which is exactly why low-privilege attackers use it. Watch the /t REG_SZ part - it is the default type, so omitting it still works here, but the verb, key, name, and data must all be right.", "study": "Compare reg add against reg query: one writes, one reads - confusing them in an incident changes state.", "term": {"prompt": "PS C:\\Users\\jtest>", "canonical": "reg add \"HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\" /v OneDriveSync /t REG_SZ /d \"%APPDATA%\\sync\\agent.exe\"", "out": ["", "The operation completed successfully."], "elements": [{"all": ["reg", "add"], "desc": "reg.exe with the write verb add", "why": "add creates or overwrites a registry value - the write step of T1547.001."}, {"all": ["hkcu\\software\\microsoft\\windows\\currentversion\\run"], "desc": "the HKCU run key path", "why": "HKCU is the user-writable autostart key; HKLM would need admin."}, {"all": ["/v", "onedrivesync"], "desc": "the /v switch with the value name OneDriveSync", "why": "The value name is what Autoruns and your analytic will display."}, {"all": ["/d", "agent.exe"], "desc": "the /d switch with the payload path", "why": "The data is the program that will start at logon."}], "forbid": [{"any": ["hklm"], "desc": "HKLM as the target hive", "danger": false, "why": "The test plan demands user-level persistence; HKLM needs admin and would hit every user."}, {"any": ["reg delete", "reg save", "reg restore"], "desc": "destructive or state-exporting reg verbs", "danger": true, "why": "The task is to create one value - delete or save verbs damage or move state."}], "syntax": null}}, {"id": "M06", "type": "qcm", "title": "HKCU vs HKLM trade-off", "summary": "Attacker reasoning: why HKCU here?", "scenario": [{"p": "Your emulation lead reviews the test notes from the lab VM and asks why you chose an HKCU run key instead of an HKLM one for that task."}], "question": "Which answer is the correct trade-off?", "hint": "Think about two axes: what rights the write needs, and how many users trigger it.", "explain": "Attacker view: HKCU needs no admin rights, so a low-privilege foothold can still persist; the cost is that it only runs for that user. Defender view: the trade-off tells you where to look - low-privilege attackers leave HKCU artefacts, and your collection must cover every user hive. HKLM is the opposite: stronger persistence for all users, but it needs administrator rights.", "study": "Map the trade-off to the permissions required by each sub-technique you meet.", "options": [{"t": "HKCU needs no admin rights, but the program only starts for that one user", "why": "Correct - low privilege in exchange for single-user scope."}, {"t": "HKCU runs with SYSTEM rights so it is quieter", "why": "HKCU values run with the user's rights, never SYSTEM."}, {"t": "HKLM needs no admin rights and starts for every user", "why": "Half right, half wrong: HKLM does run for every user but needs admin."}, {"t": "HKCU entries are removed by Windows at every reboot", "why": "HKCU run keys persist across reboots - that is their value to attackers."}], "correct": [0]}, {"id": "M07", "type": "dnd", "title": "Log lines to sub-techniques", "summary": "Drag four events to the sub-technique each one matches", "scenario": [{"p": "Four unrelated events landed in your hunting queue from different hosts. Each is a candidate for a different T1547 sub-technique."}], "question": "Drag each event onto the sub-technique it matches.", "hint": "Read the target of each event: an Lsa value, a shortcut target, a .desktop path, a Run key write.", "explain": "The discriminating detail is the target. Writes to Lsa\\Security Packages are T1547.005 because lsass.exe loads those DLLs. A .lnk retargeted to an encoded PowerShell command is T1547.009. A new .desktop file under xdg/autostart is T1547.013. A WINWORD child writing a Run key value is T1547.001.", "study": "Build a mental map: value writes, shortcut targets, .desktop files - each maps to one sub-technique.", "zones": ["T1547.001 Registry Run Keys / Startup Folder", "T1547.005 Security Support Provider", "T1547.009 Shortcut Modification", "T1547.013 XDG Autostart Entries"], "items": [{"txt": "reg.exe wrote HKLM\\...\\Control\\Lsa\\Security Packages += secpkg.dll", "zone": 1, "why": "Security Packages entries are loaded by lsass.exe - T1547.005."}, {"txt": "Desktop shortcut Report.lnk retargeted to powershell.exe -enc JABQ...", "zone": 2, "why": "Shortcut retargeting is T1547.009."}, {"txt": "New file /etc/xdg/autostart/im-daemon.desktop on a Linux laptop", "zone": 3, "why": "XDG autostart .desktop files are T1547.013."}, {"txt": "WINWORD child wrote HKCU\\...\\CurrentVersion\\Run\\OneDriveSync", "zone": 0, "why": "A new Run key value is T1547.001."}]}, {"id": "M08", "type": "fill", "title": "Winlogon value name", "summary": "Fill the blank: the Userinit value at logon", "scenario": [{"p": "At every logon, Windows reads the Winlogon registry key and runs what its values point to. One value normally contains userinit.exe, and attackers append their own program after the comma (T1547.004)."}], "question": "Complete the sentence with the value name.", "hint": "The value is named after the program it starts - the user initialisation program.", "explain": "The value is Userinit. Its normal data is C:\\Windows\\system32\\userinit.exe, and Windows also runs anything appended after a comma. The Shell value (explorer.exe) is the other commonly abused one. Both are watched closely because every interactive logon executes them.", "study": "Read the Winlogon subkeys list on the T1547.004 page: Notify, Userinit, Shell.", "blanks": [{"name": "value", "pre": "At logon, Windows runs userinit.exe plus anything appended after the comma in the Winlogon key's ", "post": " value. Attackers append their own program there (T1547.004).", "answers": ["userinit"], "why": "Userinit is the logon initialisation value under Winlogon.", "width": 12}]}, {"id": "M09", "type": "multi", "title": "Telemetry for a .001 install", "summary": "Select the events an EDR shows during a run key install", "scenario": [{"p": "A threat actor with user-level access installs run key persistence. Your EDR collects process, registry, and file events. Select every event type you should see for this install."}], "question": "Select every event that this install produces.", "hint": "Think of the three steps: a process runs reg.exe, reg.exe writes the value, and the payload file already sits somewhere on disk.", "explain": "The install leaves three signatures: the registry value-set event on the Run key, the file-creation event for the payload, and the process event showing reg.exe with add and the key path on its command line. Network queries and inbound firewall rules are unrelated to the persistence install itself.", "study": "Read the Data Sources table on T1547: registry, file, and process components.", "options": [{"t": "A registry value-set event on a CurrentVersion\\Run key", "why": "Correct - the write itself (Sysmon EID 13)."}, {"t": "A file-creation event for the payload in a user-writable folder", "why": "Correct - the file that the value points to."}, {"t": "A process event for reg.exe with 'add' and the Run key path in the command line", "why": "Correct - the command that performed the write."}, {"t": "A DNS query to the software vendor's update server", "why": "Update traffic is normal noise, not the persistence install."}, {"t": "A firewall rule allowing inbound SMB on port 445", "why": "Inbound SMB relates to file sharing, not autostart registration."}], "correct": [0, 1, 2]}, {"id": "M10", "type": "qcm", "title": "Tuning a noisy run key analytic", "summary": "Choose the right first tuning step for a false-positive storm", "scenario": [{"p": "Your new analytic 'alert on any write to a Run key' fires about 200 times a day. Sync clients, VPN tools, and updaters all legitimately use HKCU Run. Analysts have started ignoring the alert."}], "question": "What is the best first tuning step?", "hint": "The goal is not fewer alerts at any cost - it is alerts that mean something.", "explain": "Baselining is the standard first step: record which entries exist across the fleet, then alert on new or changed values instead of every write. Blocking all writes breaks legitimate software installs, deleting entries causes outages, and alerting only after call-home means you detect the aftermath instead of the persistence.", "study": "Note how the ATT&CK detection guidance describes comparing against historical data and baselines.", "options": [{"t": "Delete every HKCU Run entry on all laptops", "why": "That breaks every legitimate tool that uses autostart."}, {"t": "Block all writes to any Run key, including during software installs", "why": "Installers need these keys; a blanket block causes constant breakage."}, {"t": "Build a baseline of normal entries and alert only on new or changed values", "why": "Correct - baseline first, then alert on the delta."}, {"t": "Alert only after the payload calls its command server", "why": "That misses the persistence step and detects only the aftermath."}], "correct": [2]}, {"id": "M11", "type": "order", "title": "IR cleanup order", "summary": "Put five cleanup steps in the safe order", "scenario": [{"p": "The IR team confirmed run key persistence on one host and approved cleanup. The order matters: evidence first, changes last, verification always."}], "question": "Click the steps in the order the responder should perform them.", "hint": "Contain, capture, then remove - and never skip the final check.", "explain": "Isolation stops the attacker without destroying state. Evidence capture comes before any change, because removing the value or the file destroys artefacts. Then the persistence is removed in reverse order of dependency - value first, then the file - and a final rescan proves the host is clean. Rescanning is not optional: it catches secondary autostarts the first pass missed.", "study": "Remember the responder order: contain, capture, remove, verify.", "items": [{"id": "c3", "txt": "Remove the malicious run key value"}, {"id": "c1", "txt": "Isolate the host from the network"}, {"id": "c5", "txt": "Rescan and confirm nothing starts the program again"}, {"id": "c2", "txt": "Capture the run key value and the payload file as evidence"}, {"id": "c4", "txt": "Delete the payload binary from disk"}], "correct": ["c1", "c2", "c3", "c4", "c5"], "whyPos": ["Containment comes first but keeps the host running.", "Evidence must be captured before anything is changed.", "Remove the autostart so nothing re-runs the payload.", "Only then remove the payload file itself.", "Verification proves the cleanup worked and finds leftovers."]}, {"id": "M12", "type": "match", "title": "Data source to meaning", "summary": "Match four ATT&CK data sources to what they reveal", "scenario": [{"p": "The T1547 page lists several ATT&CK data sources. As a hunter you must know what each source can and cannot tell you. Match each source to the statement it makes true."}], "question": "For each data source, choose what it reveals.", "hint": "Each data source watches a different kind of change: registry values, DLL loads, kernel modules, or files.", "explain": "DS0024 (registry modification) shows changed autostart values. DS0011 (module load) shows spoolsv.exe pulling in an unexpected print processor DLL. DS0008 (kernel module load) catches insert-module operations on Linux. DS0022 (file creation) catches new Startup items and .desktop files. Each source covers one step, so you need all of them for real coverage.", "study": "Read the Detection Information table on the T1547 page and its data source IDs.", "pairs": {"left": ["Windows Registry key modification (DS0024)", "Module load (DS0011) by spoolsv.exe", "Kernel module load (DS0008)", "File creation (DS0022) in an autostart folder"], "right": [{"id": "d1", "label": "A run key value was changed"}, {"id": "d2", "label": "A print processor DLL was loaded"}, {"id": "d3", "label": "A Linux kernel module was inserted"}, {"id": "d4", "label": "A new Startup item or .desktop entry appeared"}, {"id": "d5", "label": "A new Windows service was installed"}], "answers": ["d1", "d2", "d3", "d4"], "whys": ["Registry modification events capture the value write.", "Module-load events catch the DLL being pulled into the spooler.", "Kernel module load is the Linux-specific signal.", "File creation in autostart folders shows the dropped item."]}}, {"id": "M13", "type": "qcm", "title": "macOS reopen artefact", "summary": "Which artefact proves T1547.007 abuse on macOS?", "scenario": [{"p": "A designer's MacBook shows signs of persistence, and one hypothesis is the 'Re-opened Applications' feature (T1547.007), which relaunches apps that were open before a restart."}], "question": "Which artefact would support that hypothesis?", "hint": "The feature stores its app list in a preference list owned by the login window.", "explain": "T1547.007 works through the loginwindow preference list that records which apps to re-open at login; an attacker adds their binary to that list. LaunchDaemons belongs to a different technique (launchd services), and browser lists or boot logs do not record reopen targets.", "study": "Read the T1547.007 page and the artefact its description names.", "options": [{"t": "The LaunchDaemons folder on the disk", "why": "LaunchDaemons is launchd persistence - a different technique."}, {"t": "The loginwindow preference list storing apps to re-open", "why": "Correct - that list is the mechanism of T1547.007."}, {"t": "The Safari downloads history", "why": "Browser history says nothing about reopen behaviour."}, {"t": "The boot session entries in the unified log alone", "why": "Boot logs show the system started, not which apps were reopened."}], "correct": [1]}, {"id": "M14", "type": "fill", "title": "Per-user XDG path", "summary": "Fill the blank: the per-user autostart directory on Linux", "scenario": [{"p": "On Linux, XDG autostart entries (T1547.013) can be machine-wide or per-user. You are writing a hunt that must cover the per-user location, where an attacker without root can still persist."}], "question": "Complete the path with the directory name.", "hint": "The per-user directory sits in the user's .config folder and has the same name the machine-wide folder uses.", "explain": "Per-user XDG autostart entries live in ~/.config/autostart; machine-wide ones live in /etc/xdg/autostart. Both hold .desktop files whose Exec line runs at desktop login. Per-user entries matter because any local user can create them without admin rights.", "study": "Read the file paths listed on the T1547.013 page.", "blanks": [{"name": "dir", "pre": "Per-user XDG autostart entries live in ~/.config/", "post": " as .desktop files; machine-wide ones live in /etc/xdg/autostart.", "answers": ["autostart"], "why": "The per-user directory is ~/.config/autostart.", "width": 14}]}, {"id": "M15", "type": "qcm", "title": "GRC control for autostart writes", "summary": "Which control most directly blocks machine-wide autostart writes?", "scenario": [{"p": "During a control review, the GRC analyst asks which existing control most directly reduces an attacker's ability to add machine-wide (HKLM) autostart entries across the fleet."}], "question": "Which control is the most direct answer?", "hint": "The question is about who can write to protected locations - not about networks, passwords, or disk encryption.", "explain": "Least privilege - administrator rights only for authorised staff - is the direct control: it decides who can write HKLM autostart locations at all. Firewalls, password rotation, and disk encryption are good controls, but none of them stops a standard-user attacker from being unable to write HKLM in the first place. ATT&CK tracks this family of controls as User Account Management and Privileged Account Management.", "study": "Connect least privilege to the permissions-required field of each sub-technique.", "options": [{"t": "Install a host firewall on every laptop", "why": "A firewall filters network traffic; it does not limit registry writes."}, {"t": "Force a password change every 30 days", "why": "Password rotation does not change who holds admin rights."}, {"t": "Encrypt all laptops with full-disk encryption", "why": "Encryption protects data at rest, not registry write access."}, {"t": "Limit administrator rights to authorised staff only", "why": "Correct - least privilege directly restricts who can write HKLM autostarts."}], "correct": [3]}, {"id": "M16", "type": "multi", "title": "Pick the persistence lines", "summary": "Log viewer: select the lines that show persistence steps", "scenario": [{"p": "Seven events from host FIN-WS-114 are in the log viewer below. Filter them if you like, then select every line that shows a T1547-related persistence step."}, {"log": "ARTEFACT 1 - Sysmon events (host   function fact(k, v) { return '<div class="fact"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div></div>'; }

  /* ---------------- exam flow ---------------- */

  function renderAnswer(inst) {

    } else if (ex.type === 'match') {
      ex.pairs.left.forEach(function (lt, i) {

        });
        zc.appendChild(z);
      });
      grid.appendChild(zc);
      w.appendChild(grid);
    } else if (ex.type === 'order') {
      var wr = el('div');
      var bank2 = el('div', 'bank');
      bank2.appendChild(el('div', 'b-h', 'Remaining steps \u2014 click them in the correct order (1st click = position 1)'));
      inst.bank.forEach(function (id) {

      });
      wr.appendChild(bank2);
      var ol = el('ol', 'seq');
      ex.items.forEach(function (it, k) {
        var id = inst.seq[k];
        if (!id) return;
        var li = el('li');
        li.innerHTML = '<span class="n">' + (k + 1) + '.</span><span>' + esc(textOf(ex, id)) + '</span>';
        var rm = el('button', 'btn ghost'); rm.textContent = '\u2715 Remove';
        rm.style.minHeight = '44px'; rm.style.padding = '3px 10px'; rm.style.fontSize = '12px';
        rm.addEventListener('click', function () {

        T.syntax.notes.forEach(function (n) { spHtml += '<li>' + esc(n) + '</li>'; });
        spHtml += '</ul><pre>Example on another target: ' + esc(T.syntax.example) + '</pre>';
        sp.innerHTML = spHtml;
        w.appendChild(sp);
      }
      var t = el('div', 'term');
      if (T.deadline) {

        var dl2 = el('div', 'chip');
        dl2.style.cssText = 'margin:0 0 8px;display:inline-flex;color:var(--state-paused);border-color:var(--state-paused)';
        dl2.innerHTML = '\u23F8 In-scenario deadline: <span id="dlLeft" style="font-family:var(--font-mono);font-weight:700">' +
          fmtTime(inst.deadlineLeft) + '</span>&nbsp;(pauses with the exam timer; does not affect your score)';
        w.appendChild(dl2);
      }
      t.innerHTML = '<div class="scr" id="termScr"></div>' +
        '<div class="pline"><span class="pr">' + esc(T.prompt) + '</span>' +
        '<input id="termIn" autocomplete="off" spellcheck="false" aria-label="Terminal input"></div>';
      w.appendChild(t);
      var scr = t.querySelector('#termScr'), inp = t.querySelector('#termIn');
      inst.lines.forEach(function (L) {
        var d = el('div', L.cls || ''); d.innerHTML = L.html; scr.appendChild(d);
      });
      function submit() {
        var v = inp.value;
        if (!v.trim()) return;

        scr.appendChild(echo); inst.lines.push({ html: echo.innerHTML });

    } else if (ex.type === 'branch') {

  }
  function gradeRaw(ex, cmd) {
    var T = ex.term, c = norm(cmd);
    var ok = T.elements.every(function (e) {
      return e.all.every(function (sub) { return c.indexOf(sub.toLowerCase()) !== -1; });
    });
    var bad = (T.forbid || []).some(function (f) {
      return f.any.some(function (sub) { return c.indexOf(sub.toLowerCase()) !== -1; });
    });
    return ok && !bad;
  }
  function textOf(ex, id) {
    for (var i = 0; i < ex.items.length; i++) if (ex.items[i].id === id) return ex.items[i].txt;
    return '';
  }
  function pillFor(inst, ii) {
    var it = inst.ex.items[ii];
    var p = el('button', 'pill' + (inst.selItem === ii ? ' sel' : ''));
    p.textContent = it.txt; p.draggable = !inst.graded;
    p.setAttribute('data-item', ii);
    p.setAttribute('aria-label', 'Item: ' + it.txt);
    p.addEventListener('click', function () {
      if (inst.graded) return;
      if (inst.place[ii] !== -1) { inst.place[ii] = -1; renderEx(); return; }
      inst.selItem = (inst.selItem === ii) ? null : ii;
      renderEx();
    });
    p.addEventListener('dragstart', function (e) {
      e.dataTransfer.setData('text/plain', String(ii));
    });
    return p;
  }
  function pillForOrder(inst, id) {
    var p = el('button', 'pill');
    p.textContent = textOf(inst.ex, id);
    p.setAttribute('aria-label', 'Step: ' + textOf(inst.ex, id));
    p.addEventListener('click', function () {
      if (inst.graded) return;
      inst.seq.push(id); renderEx();
    });

  }
  function placeItem(inst, zi) {
    if (inst.graded || inst.selItem == null) return;
    inst.place[inst.selItem] = zi;
    inst.selItem = null;
    renderEx();
  }

  /* ---------------- check / next / skip / hint ---------------- */
  function onCheck() {
    var inst = curInst();
    if (!inst || inst.graded) return;
    if (inst.ex.type === 'branch' && inst.step < inst.ex.steps.length - 1) {
      if (inst._pick == null || inst._pickStep !== inst.step) return;
      inst.stepAns[inst.step] = inst._pick;
      inst.step++; inst._pick = null; inst._pickStep = null;
      renderEx(); return;
    }
    setT('PAUSED_AUTO_CHECK');
    if (inst.ex.type === 'branch' && inst._pick != null && inst._pickStep === inst.step && inst.stepAns[inst.step] === -1) {
      /* record the final step's choice before grading (intermediate steps already stored theirs) */
      inst.stepAns[inst.step] = inst._pick;
    }
    var res = grade(inst);
    res.base = res.credit;
    if (S.hints[inst.ex.id]) res.credit = Math.max(0, res.credit - 0.10);
    inst.graded = true; inst.lastRes = res;
    S.credits[inst.ex.id] = res.credit;
    S.bases[inst.ex.id] = res.base;
    S.answered[inst.ex.id] = true;
    delete S.skipped[inst.ex.id];
    renderEx();
  }
  function showFeedback(inst, res, silent) {
    var ex = inst.ex;
    var holder = document.getElementById('fbkHolder');
    holder.innerHTML = '';
    var eff = (res.base == null) ? res.credit : res.base;
    var cls = eff >= 0.999 ? 'ok' : (eff > 0 ? 'part' : 'bad');
    var lbl = eff >= 0.999 ? '\u2713 CORRECT' : (eff > 0 ? '\u2713 PARTIALLY CORRECT' : '\u2717 INCORRECT');
    var f = el('div', 'fbk ' + cls);
    var hh = el('div', 'fbk-h');
    hh.innerHTML = esc(lbl) + ' <span class="credit">credit ' + (Math.round(res.credit * 100) / 100).toFixed(2) + '</span>' +
      (res.danger && res.danger.length ? ' <span class="badge bad">\u2717 DANGEROUS \u2014 NEAR MISS</span>' : '');
    f.appendChild(hh);
    var multi = ['multi', 'match', 'dnd', 'fill', 'order', 'terminal', 'branch'].indexOf(ex.type) !== -1;
    if (multi && res.rows.length) {
      var ul = el('ul', 'items');
      res.rows.forEach(function (r) {
        var li = el('li');
        var vmap = { ok: '\u2713 Correct', bad: '\u2717 Wrong', miss: '\u25CB Missed', danger: '\u2717 Dangerous' };
        li.innerHTML = '<span class="v ' + r.v + '">' + vmap[r.v] + '</span><span><b>' + r.t + '</b>' +
          (r.why ? ' \u2014 ' + esc(r.why) : '') + '</span>';
        ul.appendChild(li);
      });
      f.appendChild(ul);
    } else if (ex.type === 'qcm') {
      var ci = ex.correct[0];
      var p = el('p', 'why');
      p.innerHTML = 'Correct answer: <b>' + esc(ex.options[ci].t) + '</b>';
      f.appendChild(p);
    }
    var why = el('p', 'why'); why.innerHTML = esc(res.explain || ex.explain || '');
    f.appendChild(why);
    if (res.canonical) {
      var cb = el('div');
      cb.innerHTML = '<div class="sec-note">Canonical command (copyable):</div><pre class="code">' + esc(res.canonical) + '</pre>';
      f.appendChild(cb);
      var T = ex.term;
      var ul2 = el('ul', 'items');
      T.elements.forEach(function (e2) {
        var li = el('li');
        li.innerHTML = '<span class="v miss">\u25B8 Part</span><span>' + esc(e2.desc) + (e2.why ? ' \u2014 ' + esc(e2.why) : '') + '</span>';
        ul2.appendChild(li);
      });
      f.appendChild(ul2);
    }
    if (eff < 0.999 && ex.study) {
      var st = el('div', 'study');
      st.innerHTML = '<span class="h">What to study:</span> ' + esc(ex.study);
      f.appendChild(st);
    }
    holder.appendChild(f);
    var bn = document.getElementById('btnNext');
    bn.style.display = 'inline-flex';
    bn.textContent = (S.pos === S.order.length - 1 && !S.reviewReturn)
      ? ((skippedOpen() > 0) ? 'Final Submit \u2192 review skipped' : 'Final Submit \u2192 results')
      : 'Next \u2192';
    var bc = document.getElementById('btnCheck');
    bc.disabled = true;
    renderHdr();
    if (!silent) {
      try { f.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'nearest' }); } catch (e) {}
    }
  }

  /* override: attach explain after grade (kept simple) */
  var _grade = grade;
  grade = function (inst) {
    var r = _grade(inst);
    r.explain = inst.ex.explain;
    return r;
  };

  function onNext() {
    var inst = curInst();
    if (!inst || !inst.graded) return;
    if (S.reviewReturn) { S.reviewReturn = false; showReview(); return; }
    if (S.pos < S.order.length - 1) {
      S.pos++; setT('RUNNING'); renderEx();
      window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
    } else {
      if (skippedOpen() > 0 && S.remain > 0) { showReview(); }
      else { showResults(); }
    }
  }
  function onSkip() {
    var inst = curInst();
    if (!inst || inst.graded) return;
    S.skipped[inst.ex.id] = true;
    if (S.reviewReturn) { S.reviewReturn = false; showReview(); return; }
    if (S.pos < S.order.length - 1) { S.pos++; renderEx(); }
    else if (skippedOpen() > 0) { showReview(); }
    else { showResults(); }
    renderHdr();
  }
  function onHint() {
    var inst = curInst();
    if (!inst || inst.graded || S.hints[inst.ex.id]) return;
    S.hints[inst.ex.id] = true;
    var hb = document.getElementById('hintBox');
    document.getElementById('hintTxt').textContent = inst.ex.hint || '';
    hb.style.display = 'block';
    document.getElementById('btnHint').disabled = true;
  }
  function onPause() {
    if (S.tState === 'RUNNING' || S.tState === 'PAUSED_AUTO_CHECK') {
      S.manualFrom = S.tState;
      setT('PAUSED_MANUAL');
      var ov = document.getElementById('pauseOverlay');
      ov.style.display = 'flex';
    }
  }
  function onResume() {
    var ov = document.getElementById('pauseOverlay');
    ov.style.display = 'none';
    setT(S.manualFrom || 'RUNNING');
    S.manualFrom = null;
  }
  function finishTimeout() {
    stopClock();
    var inst = curInst();
    if (inst && !inst.graded && S.view === 'exam') S.skipped[inst.ex.id] = true;
    S.timeoutHit = true;
    showResults();
  }

  /* ---------------- review skipped ---------------- */
  function showReview() {
    S.view = 'review'; S.reviewReturn = false;
    document.getElementById('examView').style.display = 'none';
    document.getElementById('resultsView').style.display = 'none';
    var v = document.getElementById('reviewView');
    v.style.display = 'block';
    var h = '<div class="card"><h2>\u26A0 Review skipped exercises</h2>' +
      '<p class="sec-note">The timer is still running. You can answer a skipped exercise now, or final-submit and leave it out of the score.</p><ul class="revlist">';
    S.order.forEach(function (idx, pos) {
      var ex = EXS[idx];
      if (S.skipped[ex.id] && !S.answered[ex.id]) {
        h += '<li><span class="badge skip">\u26A0 Skipped</span><span class="t">' + esc(ex.title) + '</span>' +
          '<button class="btn amber" data-pos="' + pos + '">\u2192 Answer now</button></li>';
      }
    });
    h += '</ul><div class="exfoot">' +
      '<button class="btn primary" id="btnFinalGo">\u2713 Final submit anyway (' + skippedOpen() + ' excluded)</button></div></div>';
    v.innerHTML = h;
    v.querySelectorAll('button[data-pos]').forEach(function (b) {
      b.addEventListener('click', function () {
        S.pos = parseInt(b.getAttribute('data-pos'), 10);
        S.reviewReturn = true; S.view = 'exam';
        v.style.display = 'none';
        document.getElementById('examView').style.display = 'block';
        setT('RUNNING'); renderEx();
      });
    });
    document.getElementById('btnFinalGo').addEventListener('click', showResults);
    setT('RUNNING');
    renderHdr();
  }

  /* ---------------- results ---------------- */
  function showResults() {
    if (S.tState !== 'ENDED') { setT('ENDED'); stopClock(); }
    S.view = 'results';
    document.getElementById('examView').style.display = 'none';
    document.getElementById('reviewView').style.display = 'none';
    var v = document.getElementById('resultsView');
    v.style.display = 'block';
    var full = 0, part = 0, bad = 0, skip = 0, partSum = 0;
    EXS.forEach(function (ex) {
      if (S.answered[ex.id]) {
        var b = (S.bases[ex.id] != null) ? S.bases[ex.id] : (S.credits[ex.id] || 0);
        var c = S.credits[ex.id] || 0;
        if (b >= 0.999) full++;
        else if (b > 0) { part++; partSum += c; }
        else bad++;
      } else { skip++; }
    });
    var answered = full + part + bad;
    var sum = 0; EXS.forEach(function (ex) { if (S.answered[ex.id]) sum += (S.credits[ex.id] || 0); });
    var percent = answered ? Math.round(sum / answered * 100) : 0;
    var pass = percent >= CFG.meta.passMark;
    var avg = part ? Math.round(partSum / part * 100) / 100 : 0;
    var h = '<div class="card"><h2>Results \u2014 ' + esc(CFG.meta.title) + '</h2>' +
      '<p class="score-line">Score <b>' + (Math.round(sum * 10) / 10).toFixed(1) + '</b> / ' + answered + ' answered \u2014 <b>' + percent + '%</b> (pass mark ' + CFG.meta.passMark + '%)</p>' +
      (S.timeoutHit ? '<p class="sec-note">\u23F1 Time ran out \u2014 unanswered exercises were excluded from the score.</p>' : '') +
      '<div class="statgrid">' +
      stat(full, '\u2713 Fully correct', 'ok') +
      stat(part, '\u2713 Partially correct' + (part ? ' \u00b7 avg ' + avg : ''), 'part') +
      stat(bad, '\u2717 Fully incorrect', 'bad') +
      stat(skip, '\u26A0 Skipped \u2014 excluded', 'skip') +
      '</div>';
    h += '<p class="sec-note">\u23F8 Time paused manually: ' + fmtTime(S.pauseManualMs / 1000) +
      ' \u00b7 \u23F8 Time reviewing feedback: ' + fmtTime(S.pauseAutoMs / 1000) + '</p>';
    if (pass) {
      h += '<div class="verdict pass"><div class="big">\u2713 PASS</div>' +
        '<p>Certificate-style result: you reached ' + percent + '%, above the ' + CFG.meta.passMark + '% pass mark. Well done \u2014 you can now take the next severity file for ' + esc(CFG.meta.topicId.toUpperCase()) + '.</p></div>';
      h += '<div class="exfoot"><button class="btn primary" id="btnRetake">\u21BA Retake exam (new shuffle)</button></div>';
    } else {
      h += '<div class="verdict fail"><div class="big">\u2717 FAIL</div>' +
        '<p>' + percent + '% is below the ' + CFG.meta.passMark + '% pass mark. You must retake this exam. Study the "What to study" hints, then try again \u2014 the questions and answers will be shuffled.</p></div>';
      h += '<div class="exfoot"><button class="btn primary big" id="btnRetake">\u21BA Retake exam</button></div>';
    }
    h += '</div>';
    v.innerHTML = h;
    document.getElementById('btnRetake').addEventListener('click', startExam);
    renderHdr();
    reportScore(sum, answered, percent, pass);
  }
  function stat(n, l, cls) {
    return '<div class="stat ' + cls + '"><div class="n">' + n + '</div><div class="l">' + esc(l) + '</div></div>';
  }
  function reportScore(sum, answered, percent, pass) {
    if (S.reported) return;
    S.reported = true;
    if (window.parent === window && location.protocol === 'file:') {
      /* Opened directly from disk: parent is this page itself, nothing to report to. */
      return;
    }
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: CFG.meta.topicId,
        batch: CFG.meta.batch,
        score: Math.round(sum),
        total: answered,
        percent: percent,
        passed: percent >= CFG.meta.passMark
      }, location.origin);
    } catch (e) { /* opened directly \u2014 nothing to report to */ }
  }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) return;
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
    S.user = event.data.username || null;
    /* theme field is always 'dark'; the file is dark-only by contract, nothing to switch */
  });

  /* ---------------- wire up ---------------- */
  function boot() {
    renderIntro();
    document.getElementById('btnSkip').addEventListener('click', onSkip);
    document.getElementById('btnHint').addEventListener('click', onHint);
    document.getElementById('btnPause').addEventListener('click', onPause);
    document.getElementById('btnResume').addEventListener('click', onResume);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
