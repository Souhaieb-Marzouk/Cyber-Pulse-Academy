/* ---------------- exam view ---------------- */
function openExercise(idx, fromReview){
  S.screen='exam'; S.cur=idx; renderHeader();
  var ex=E.exercises[idx];
  var scr=document.getElementById('screen');
  var art='';
  if (ex.artefacts && ex.artefacts.length){
    art = ex.artefacts.map(function(a,ai){
      return '<div class="art" data-art="'+ai+'"><span class="art-label">'+esc(a.label)+'</span><div class="art-body">'+renderArt(a)+'</div></div>';
    }).join('');
  }
  var collapsible = (art && ((ex.artefacts&&ex.artefacts.length>1) || art.length>1600)) || (ex.scenario && ex.scenario.length>700);
  var summary = (ex.collapseSummary || ex.question || '').slice(0,90);
  var scnBody = md(ex.scenario) + (art? '<div class="artwrap">'+art+'</div>' : '');
  if (collapsible){ scnBody = '<div class="mut" id="scnsum" style="display:none">'+md(summary)+' — <b>collapsed</b></div><div id="scnbody">'+scnBody+'</div>'; }
  var collapseBtn = collapsible? '<button class="collapse" id="btnCollapse">▾ Collapse scenario</button>' : '';
  var html =
    '<div class="card blk-scn"><div class="blk-h">🛰 SCENARIO '+collapseBtn+'</div><div class="blk-b" id="scnblk">'+scnBody+'</div></div>'+
    '<div class="card blk-qn"><div class="blk-h">❓ QUESTION</div><div class="blk-b">'+md(ex.question)+'</div></div>'+
    '<div class="card blk-ans"><div class="blk-h">✍ YOUR ANSWER</div><div class="blk-b" id="ansblk"></div></div>'+
    '<div id="hintbox" class="hintbox" style="display:none"></div>'+
    '<div id="fbb"></div>'+
    '<div class="toolbar" id="toolbar"></div>';
  scr.innerHTML=html;
  if (collapsible){
    document.getElementById('btnCollapse').addEventListener('click', function(){
      var b=document.getElementById('scnbody'), s2=document.getElementById('scnsum'), btn=this;
      var hidden = b.style.display==='none';
      b.style.display = hidden? '':'none';
      s2.style.display = hidden? 'none':'block';
      btn.textContent = hidden? '▾ Collapse scenario' : '▸ Expand scenario';
      if (hidden){ window.scrollTo(0,0); }
    });
  }
  renderInteractive(ex, idx);
  updateToolbar();
  if (!window.scrollTo0flag){ window.scrollTo(0,0); }
}
function renderArt(a){
  if (a.log) return renderLog(a.log);
  if (a.cmds) return a.cmds.map(function(c){ return '<span class="code">'+hl(c)+'</span>'; }).join('');
  return md(a.body||'');
}
function renderLog(lines){
  var rows = lines.map(function(l,li){
    var lvl = (l.lvl||'info').toLowerCase();
    return '<div class="log-ln" data-l="'+li+'"><span class="lvl lvl-'+esc(lvl)+'">'+esc((l.lvl||'info').toUpperCase().slice(0,4))+'</span><span class="ts">'+esc(l.t)+'</span><span class="src">'+esc(l.s)+'</span><span>'+hl(l.m)+'</span></div>';
  }).join('');
  return '<div class="logt"><div class="log-f"><span class="mut">filter</span><input id="logfilt" type="text" placeholder="type to filter lines…" aria-label="Filter log lines"></div><div class="log-lines" id="loglines">'+rows+'</div></div>';
}
function wireLogFilter(){
  var f=document.getElementById('logfilt'); if(!f) return;
  f.addEventListener('input', function(){
    var q=this.value.toLowerCase();
    var ls=document.querySelectorAll('#loglines .log-ln');
    for (var i=0;i<ls.length;i++){ ls[i].style.display = ls[i].textContent.toLowerCase().indexOf(q)>=0 ? '' : 'none'; }
  });
}
function updateToolbar(){
  var tb=document.getElementById('toolbar'); if(!tb) return;
  var i=S.cur, ex=E.exercises[i], graded=S.ans[i]&&S.ans[i].graded;
  var isLast = nextUnansweredAfter(S.pos)==null && firstUnanswered()==null;
  var btns='';
  if (!graded){
    btns += '<button class="btn primary big" id="btnCheck">✔ Check answer</button>';
  } else {
    var lbl = isLast ? '✔ Final Submit ➜' : 'Next exercise ➜';
    btns += '<button class="btn blue big" id="btnNext">'+lbl+'</button>';
  }
  btns += '<span class="mut" id="tbstate"></span>';
  tb.innerHTML=btns;
  var bstate=document.getElementById('tbstate');
  if (bstate){
    if (S.tstate==='PAUSED_AUTO_CHECK') bstate.textContent='⏸ Timer paused for feedback review — resumes on Next';
    else if (S.tstate==='PAUSED_MANUAL') bstate.textContent='⏸ Manual pause — exercise hidden';
  }
  if (!graded){ document.getElementById('btnCheck').addEventListener('click', onCheck); }
  else { document.getElementById('btnNext').addEventListener('click', onNext); }
  if (graded) { document.getElementById('btnHint').disabled=true; document.getElementById('btnSkip').disabled=true;
    var tk=document.getElementById('tchk')||document.getElementById('bchk'); if (tk) tk.disabled=true;
    var shin=document.getElementById('shin'); if (shin) shin.disabled=true;
    var shrun=document.getElementById('shrun'); if (shrun) shrun.disabled=true;
  }
  else { document.getElementById('btnSkip').disabled=false; document.getElementById('btnHint').disabled = !!S.hint[i] || !ex.hint; }
  updateProgress();
}
function updateProgress(){
  var g=gradedIdxs().length, n=totalEx();
  var pct = Math.round(((S.screen==='review'? g : (S.order.indexOf(S.cur)+1)) / n) * 100);
  var pf=document.getElementById('pfill'); if (pf) pf.style.width = pct+'%';
}
function onCheck(){
  var i=S.cur, ex=E.exercises[i];
  if (S.ans[i] && S.ans[i].graded) return; /* no re-attempt after grading */
  if (!S.sel[i]){ S.sel[i]={empty:true}; }
  var res = grade(ex, i, S.sel[i]);
  if (S.hint[i]) { res.credit = Math.max(0, res.credit - 0.10); res.hintUsed=true; }
  res.credit = Math.max(0, Math.round(res.credit*100)/100);
  res.graded = true;
  S.ans[i]=res;
  /* Check-triggered auto-pause: first action, before rendering feedback */
  if (S.tstate!=='ENDED') setTstate('PAUSED_AUTO_CHECK');
  renderFeedback(ex, res);
  updateToolbar(); renderHeader();
  var fb=document.getElementById('fbb'); if (fb) fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function renderFeedback(ex, res){
  var label, cls;
  if (res.credit>=0.999){ label='✓ CORRECT'; cls='correct'; }
  else if (res.credit>0){ label='✓ PARTIALLY CORRECT'; cls='partial'; }
  else { label='✗ INCORRECT'; cls='incorrect'; }
  var items=(res.perItem||[]).map(function(it){ return statusRow(it.status, it.label, it.note); }).join('');
  var creditLine='';
  if ((res.perItem&&res.perItem.length>1) || res.credit<0.999){
    creditLine='<div class="mut" style="margin:6px 0">credit <b>'+res.credit.toFixed(2)+'</b>'+(res.N!=null? ' — '+res.H+' / '+res.N+' correct items'+(res.W? ', '+res.W+' wrong selected':''):'')+(res.hintUsed?' (includes −0.10 hint penalty)':'')+'</div>';
  }
  var canonical = res.canonical ? '<span class="art-label">EXPECTED COMMAND — copyable</span><code class="code" id="canon">'+esc(res.canonical)+'</code>' : '';
  var dangerNote = res.dangerNote ? '<div class="danger">✗ DANGEROUS — NEAR MISS: '+md(res.dangerNote)+'</div>' : '';
  var html='<div class="fb '+cls+'"><div class="fb-h">'+label+(res.credit<0.999&&res.credit>0? ' — credit '+res.credit.toFixed(2):'')+'</div><div class="fb-b">'+
    '<div><span class="fb-corr">Correct answer:</span> '+md(res.correctText||'')+'</div>'+creditLine+
    (items? '<div style="margin-top:8px"><b>Item-by-item breakdown</b></div>'+items:'')+
    dangerNote+canonical+
    '<div style="margin-top:10px">'+md(res.explain||'')+'</div>'+
    (res.study? '<div class="mut" style="margin-top:8px"><b>What to study:</b> '+md(res.study)+'</div>':'')+
  '</div></div>';
  document.getElementById('fbb').innerHTML=html;
  var c=document.getElementById('canon');
  if (c){ c.setAttribute('tabindex','0'); c.addEventListener('click', function(){ try{ navigator.clipboard.writeText(res.canonical); }catch(e){} }); }
}

/* ---------------- review screen ---------------- */
function showReview(){
  S.screen='review'; renderHeader();
  var scr=document.getElementById('screen');
  var rows='';
  for (var q=0;q<S.order.length;q++){
    var ix=S.order[q];
    if (S.skipped[ix] && !(S.ans[ix]&&S.ans[ix].graded)){
      var ex=E.exercises[ix];
      rows+='<div class="rev-it"><span class="rn">#'+(q+1)+'</span><span style="flex:1">'+md(ex.question.slice(0,110))+'</span><span class="skipped-word">⚠ Skipped</span><button class="btn blue" data-ans="'+ix+'">Answer now</button></div>';
    }
  }
  scr.innerHTML='<h2 class="sec-t">Review skipped exercises</h2>'+
    '<div class="card"><div class="blk-b"><p>These exercises were skipped. You can answer them now — the timer is still running. If you submit without answering them, they are <b>excluded from your score</b> (they do not count for you or against you).</p>'+rows+
    '<div class="toolbar"><button class="btn primary big" id="btnFinal">✔ Final Submit</button></div></div></div>';
  var bs=scr.querySelectorAll('button[data-ans]');
  for (var i=0;i<bs.length;i++){
    bs[i].addEventListener('click', function(){ var ix=parseInt(this.getAttribute('data-ans'),10); S.pos=S.order.indexOf(ix); openExercise(ix,false); });
  }
  document.getElementById('btnFinal').addEventListener('click', function(){ showResults(); });
  document.getElementById('btnHint').disabled=true; document.getElementById('btnSkip').disabled=true; document.getElementById('btnPause').disabled=true;
  window.scrollTo(0,0);
}

/* ---------------- results ---------------- */
function showResults(){
  S.screen='results';
  if (S.tstate!=='ENDED') setTstate('ENDED');
  renderHeader();
  var g=gradedIdxs();
  var fully=0, partial=0, incorrect=0, psum=0, skippedN=0;
  for (var i=0;i<g.length;i++){ var c=S.ans[g[i]].credit; if (c>=0.999) fully++; else if (c>0){ partial++; psum+=c; } else incorrect++; }
  for (var k in S.skipped){ if (S.skipped[k] && !(S.ans[k]&&S.ans[k].graded)) skippedN++; }
  var sum=creditSum();
  var answered=g.length;
  var pct = answered>0 ? Math.round(sum/answered*100) : 0;
  var passed = pct>=70;
  var avgP = partial>0 ? (Math.round(psum/partial*100)/100) : 0;
  var scr=document.getElementById('screen');
  var stats=
    '<div class="res-stats">'+
    '<div class="res-card"><div class="rc-v rc-correct">✓ '+fully+'</div><div class="rc-l">Fully correct (credit 1.0)</div></div>'+
    '<div class="res-card"><div class="rc-v rc-partial">✓ '+partial+'</div><div class="rc-l">Partially correct'+(partial? ' — avg credit '+avgP.toFixed(2):'')+'</div></div>'+
    '<div class="res-card"><div class="rc-v rc-incorrect">✗ '+incorrect+'</div><div class="rc-l">Fully incorrect (credit 0)</div></div>'+
    '<div class="res-card"><div class="rc-v rc-skipped">⚠ '+skippedN+'</div><div class="rc-l">Skipped — excluded from score</div></div>'+
    '</div>';
  var verdict = passed?
    '<div class="cert"><div class="c-t">✓ PASS</div><div class="c-p">'+pct+'%</div><div>You reached the 70% pass mark on '+esc(E.objId)+' — '+esc(E.objName)+' ('+esc(E.sev)+'). Well done — print or screenshot this panel as your practice certificate.</div></div>' :
    '<div class="failbx"><div class="f-t">✗ FAIL</div><div class="c-p">'+pct+'%</div><div>You need 70% to pass. Retake the exam — questions and answer choices will be shuffled.</div></div>';
  var timeStat='<div class="mut" style="margin:10px 0">Time paused manually: '+fmt(S.pausedManualSec)+' · Time paused reviewing feedback: '+fmt(S.pausedAutoSec)+' · Timer budget: '+E.minutes+' min</div>';
  scr.innerHTML='<h2 class="sec-t">Final results — '+esc(E.title)+'</h2>'+
    '<div class="card"><div class="blk-b">'+
    '<div style="font-size:1.15rem"><b>'+ (Math.round(sum*10)/10) +' / '+answered+'</b> <span class="mut">answered exercises · final percentage</span> <b>'+pct+'%</b></div>'+
    stats+verdict+timeStat+
    '<div class="toolbar"><button class="btn blue big" id="btnRetake">↻ Retake exam</button></div>'+
    '</div></div>';
  document.getElementById('btnHint').disabled=true; document.getElementById('btnSkip').disabled=true; document.getElementById('btnPause').disabled=true;
  document.getElementById('btnRetake').addEventListener('click', function(){
    document.getElementById('btnHint').disabled=false; document.getElementById('btnSkip').disabled=false; document.getElementById('btnPause').disabled=false;
    startAttempt();
  });
  if (!S.reported){ reportScore(sum, answered, pct, passed); S.reported=true; }
  window.scrollTo(0,0);
}
function reportScore(creditSum, answeredCount, percent, passed){
  try {
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId: META.topicId || E.topicId,
      batch: META.batch != null ? META.batch : E.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent>=70
    }, location.origin);
  } catch(e){ /* opened directly, nothing to report to */ }
}

/* ============ shared exam engine — exercise types (renderers + graders) ============ */
function renderInteractive(ex, idx){
  var blk=document.getElementById('ansblk');
  if (ex.type==='qcm') return renderQCM(ex, idx, blk, false);
  if (ex.type==='multi') return renderQCM(ex, idx, blk, true);
  if (ex.type==='logview'){ var d=document.createElement('div'); blk.innerHTML=''; blk.appendChild(d); renderQCMInto(ex, idx, d, ex.answer.mode==='multi'); wireLogFilter(); return; }
  if (ex.type==='match') return renderMatch(ex, idx, blk);
  if (ex.type==='dnd') return renderDnD(ex, idx, blk);
  if (ex.type==='fill') return renderFill(ex, idx, blk);
  if (ex.type==='order'||ex.type==='rank') return renderOrder(ex, idx, blk, ex.type==='rank');
  if (ex.type==='terminal') return renderTerminal(ex, idx, blk);
  if (ex.type==='triage') return renderTriage(ex, idx, blk);
  if (ex.type==='branch') return renderBranch(ex, idx, blk);
  blk.innerHTML='<em>Unknown exercise type.</em>';
}
function optRow(letter, text, sel){
  return '<button class="opt'+(sel?' sel':'')+'" role="option" aria-pressed="'+(sel?'true':'false')+'" '+(!sel?'':'')+'><span class="olab">'+letter+'.</span><span style="flex:1">'+md(text)+'</span></button>';
}
/* ---- qcm / multi ---- */
function renderQCM(ex, idx, blk, isMulti){
  var holder=document.createElement('div'); blk.innerHTML=''; blk.appendChild(holder);
  renderQCMInto(ex, idx, holder, isMulti);
}
function renderQCMInto(ex, idx, holder, isMulti){
  var sm=S.smap[idx];
  var opts = ex.options || (ex.answer && ex.answer.options);
  if (!S.sel[idx]) S.sel[idx]= isMulti? {choices:[]} : {choice:null};
  var sel=S.sel[idx];
  var letters='ABCDEFGH';
  var html='<div class="opts" role="listbox" aria-label="Answer options">';
  sm.opts.forEach(function(oi, di){
    var isSel = isMulti? sel.choices.indexOf(oi)>=0 : sel.choice===oi;
    html+=optRow(letters[di], opts[oi], isSel).replace('<button class="opt','<button data-oi="'+oi+'" class="opt');
  });
  html+='</div>'+(isMulti?'<div class="mut" style="margin-top:8px">Select all that apply. Wrong selections subtract from your credit.</div>':'');
  holder.innerHTML=html;
  var bs=holder.querySelectorAll('button[data-oi]');
  for (var i=0;i<bs.length;i++){
    bs[i].addEventListener('click', function(){
      var oi=parseInt(this.getAttribute('data-oi'),10);
      if (S.ans[idx]&&S.ans[idx].graded) return;
      if (isMulti){
        var at=sel.choices.indexOf(oi);
        if (at>=0) sel.choices.splice(at,1); else sel.choices.push(oi);
      } else { sel.choice=oi; }
      renderQCMInto(ex, idx, holder, isMulti);
      var nb=holder.querySelector('button[data-oi="'+oi+'"]');
      if (nb) nb.focus(); /* keep keyboard focus on the option the learner just toggled */
    });
  }
}
/* ---- match ---- */
function renderMatch(ex, idx, blk){
  var sm=S.smap[idx];
  if (!S.sel[idx]) S.sel[idx]={assign:{}, selItem:null};
  var sel=S.sel[idx];
  var letters='12345678';
  var html='<div class="grid2"><div><div class="mut" style="margin-bottom:8px">Items — click one, then click its target (or drag it):</div><div class="rows">';
  sm.items.forEach(function(pi, dli){
    var used = Object.keys(sel.assign).some(function(t){ return sel.assign[t]===pi; });
    html+='<button class="mi'+(sel.selItem===pi?' sel':'')+(used?' done':'')+'" draggable="true" data-item="'+pi+'"><b>'+letters[dli]+'.</b> '+md(ex.pairs[pi].left)+'</button>';
  });
  html+='</div></div><div><div class="mut" style="margin-bottom:8px">Targets:</div><div class="rows">';
  sm.targets.forEach(function(ti){
    var tag = sel.assign[ti]!=null? '<span class="tag">← '+esc(ex.pairs[sel.assign[ti]].left)+'</span>' : '';
    html+='<div class="mt" data-target="'+ti+'" tabindex="0" role="button">'+md(ex.pairs[ti].right)+tag+'</div>';
  });
  html+='</div><div class="mt-hint" style="margin-top:8px">Every item belongs to exactly one target. Each correct pairing earns one item of credit; a wrong pairing subtracts.</div></div></div>';
  blk.innerHTML=html;
  function bindAssign(itemBtn){
    itemBtn.addEventListener('click', function(){
      if (S.ans[idx]&&S.ans[idx].graded) return;
      var pi=parseInt(this.getAttribute('data-item'),10);
      sel.selItem = (sel.selItem===pi)? null : pi;
      renderMatch(ex, idx, blk);
    });
    itemBtn.addEventListener('dragstart', function(ev){ try{ ev.dataTransfer.setData('text/plain', this.getAttribute('data-item')); }catch(e){} });
  }
  var items=blk.querySelectorAll('.mi');
  for (var i=0;i<items.length;i++) bindAssign(items[i]);
  var targets=blk.querySelectorAll('.mt');
  for (var j=0;j<targets.length;j++){
    (function(t){
      t.addEventListener('keydown', function(ev){ if (ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); t.click(); } });
      t.addEventListener('click', function(){
        if (S.ans[idx]&&S.ans[idx].graded) return;
        if (sel.selItem==null) return;
        sel.assign[t.getAttribute('data-target')]=sel.selItem; sel.selItem=null;
        renderMatch(ex, idx, blk);
      });
      t.addEventListener('dragover', function(ev){ ev.preventDefault(); t.classList.add('drop'); });
      t.addEventListener('dragleave', function(){ t.classList.remove('drop'); });
      t.addEventListener('drop', function(ev){
        ev.preventDefault(); t.classList.remove('drop');
        if (S.ans[idx]&&S.ans[idx].graded) return;
        var pi=parseInt(ev.dataTransfer.getData('text/plain'),10);
        if (isNaN(pi)) return;
        sel.assign[t.getAttribute('data-target')]=pi; sel.selItem=null;
        renderMatch(ex, idx, blk);
      });
    })(targets[j]);
  }
}
/* ---- dnd ---- */
function renderDnD(ex, idx, blk){
  var sm=S.smap[idx];
  if (!S.sel[idx]) S.sel[idx]={place:{}, selChip:null};
  var sel=S.sel[idx];
  var html='<div class="mut">Drag each item to the right zone — or click the item, then click a zone:</div><div class="bank" id="dnbank">';
  sm.bank.forEach(function(bi){
    if (sel.place[bi]==null) html+='<button class="chip'+(sel.selChip===bi?' sel':'')+'" draggable="true" data-chip="'+bi+'">'+md(ex.bank[bi])+'</button>';
  });
  html+='</div><div class="grid2">';
  ex.zones.forEach(function(z, zi){
    var inside='';
    sm.bank.forEach(function(bi){ if (sel.place[bi]===zi) inside+='<button class="chip filled" data-chip="'+bi+'" style="margin:3px 4px 0 0">'+md(ex.bank[bi])+'</button>'; });
    html+='<div class="zone" data-zone="'+zi+'" tabindex="0" role="button" aria-label="Drop zone: '+esc(z.name)+'"><div class="zone-h">'+esc(z.name)+'</div>'+inside+'</div>';
  });
  html+='</div><div class="mut" style="margin-top:8px">Click a placed chip to send it back to the bank.</div>';
  blk.innerHTML=html;
  var chips=blk.querySelectorAll('.chip');
  for (var i=0;i<chips.length;i++){
    (function(c){
      c.addEventListener('click', function(){
        if (S.ans[idx]&&S.ans[idx].graded) return;
        var bi=parseInt(c.getAttribute('data-chip'),10);
        if (sel.place[bi]!=null){ delete sel.place[bi]; sel.selChip=null; }
        else sel.selChip=(sel.selChip===bi? null: bi);
        renderDnD(ex, idx, blk);
      });
      c.addEventListener('dragstart', function(ev){ try{ ev.dataTransfer.setData('text/plain', c.getAttribute('data-chip')); }catch(e){} });
    })(chips[i]);
  }
  var zones=blk.querySelectorAll('.zone');
  for (var z=0;z<zones.length;z++){
    (function(zn){
      zn.addEventListener('keydown', function(ev){ if (ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); zn.click(); } });
      zn.addEventListener('click', function(ev){
        if (S.ans[idx]&&S.ans[idx].graded) return;
        if (ev.target.closest('.chip')) return;
        if (sel.selChip==null) return;
        sel.place[sel.selChip]=parseInt(zn.getAttribute('data-zone'),10); sel.selChip=null;
        renderDnD(ex, idx, blk);
      });
      zn.addEventListener('dragover', function(ev){ ev.preventDefault(); zn.classList.add('drop'); });
      zn.addEventListener('dragleave', function(){ zn.classList.remove('drop'); });
      zn.addEventListener('drop', function(ev){
        ev.preventDefault(); zn.classList.remove('drop');
        if (S.ans[idx]&&S.ans[idx].graded) return;
        var bi=parseInt(ev.dataTransfer.getData('text/plain'),10);
        if (isNaN(bi)) return;
        sel.place[bi]=parseInt(zn.getAttribute('data-zone'),10); sel.selChip=null;
        renderDnD(ex, idx, blk);
      });
    })(zones[z]);
  }
}
/* ---- fill ---- */
function renderFill(ex, idx, blk){
  var sm=S.smap[idx];
  if (!S.sel[idx]) S.sel[idx]={put:{}, selWord:null};
  var sel=S.sel[idx];
  var used = Object.keys(sel.put).map(function(k){ return sel.put[k]; });
  var html='<div class="sent">';
  var parts=ex.parts;
  for (var p=0;p<parts.length;p++){
    html+=md(parts[p]);
    if (p<ex.blanks.length){
      var w = sel.put[p]!=null? esc(ex.bank[sel.put[p]]) : '______';
      html+='<button class="bl" data-bl="'+p+'" title="Blank '+(p+1)+'">'+w+'</button>';
    }
  }
  html+='</div><div class="mut" style="margin-top:10px">Word bank — click a word, then click a blank (shuffled; some words are decoys):</div><div class="bank">';
  sm.bank.forEach(function(wi){
    if (used.indexOf(wi)<0) html+='<button class="chip'+(sel.selWord===wi?' sel':'')+'" data-word="'+wi+'">'+md(ex.bank[wi])+'</button>';
  });
  html+='</div>';
  blk.innerHTML=html;
  var ws=blk.querySelectorAll('.chip');
  for (var i=0;i<ws.length;i++){
    (function(c){
      c.addEventListener('click', function(){
        if (S.ans[idx]&&S.ans[idx].graded) return;
        var wi=parseInt(c.getAttribute('data-word'),10);
        sel.selWord=(sel.selWord===wi? null: wi);
        renderFill(ex, idx, blk);
      });
    })(ws[i]);
  }
  var bls=blk.querySelectorAll('.bl');
  for (var b=0;b<bls.length;b++){
    (function(bb){
      bb.addEventListener('click', function(){
        if (S.ans[idx]&&S.ans[idx].graded) return;
        var bi=parseInt(bb.getAttribute('data-bl'),10);
        if (sel.put[bi]!=null){ delete sel.put[bi]; renderFill(ex, idx, blk); return; }
        if (sel.selWord==null) return;
        sel.put[bi]=sel.selWord; sel.selWord=null;
        renderFill(ex, idx, blk);
      });
    })(bls[b]);
  }
}
/* ---- order / rank ---- */
function renderOrder(ex, idx, blk, isRank){
  var sm=S.smap[idx];
  if (!S.sel[idx] || !S.sel[idx].arr || S.sel[idx].arr.length!==ex.items.length){
    if (!S.sel[idx]) S.sel[idx]={};
    S.sel[idx].arr = sm.items.slice();
  }
  var sel=S.sel[idx];
  var html=(isRank?'<div class="mut">Rank from most urgent (top) to least urgent (bottom). Use the arrows or drag:</div>':'<div class="mut">Put the steps in the correct order — use the arrows or drag:</div>')+'<div class="ord" id="ordlist">';
  sel.arr.forEach(function(oi, di){
    html+='<div class="ord-it" draggable="true" data-di="'+di+'"><span class="pos">'+(di+1)+'.</span><span style="flex:1">'+md(ex.items[oi])+'</span><span class="ord-ctl">'+
      '<button data-up="'+di+'" aria-label="Move up">▲</button><button data-down="'+di+'" aria-label="Move down">▼</button></span></div>';
  });
  html+='</div>';
  blk.innerHTML=html;
  function move(d, nd){
    if (nd<0||nd>=sel.arr.length) return;
    var t=sel.arr[d]; sel.arr[d]=sel.arr[nd]; sel.arr[nd]=t;
    renderOrder(ex, idx, blk, isRank);
  }
  var bs=blk.querySelectorAll('button[data-up],button[data-down]');
  for (var i=0;i<bs.length;i++){
    (function(btn){
      btn.addEventListener('click', function(){
        if (S.ans[idx]&&S.ans[idx].graded) return;
        var d=parseInt(btn.getAttribute('data-up')!=null? btn.getAttribute('data-up'):btn.getAttribute('data-down'),10);
        move(d, d+(btn.getAttribute('data-up')!=null? -1:1));
      });
    })(bs[i]);
  }
  var its=blk.querySelectorAll('.ord-it');
  for (var k=0;k<its.length;k++){
    (function(it){
      it.addEventListener('dragstart', function(ev){ try{ ev.dataTransfer.setData('text/plain', it.getAttribute('data-di')); it.classList.add('dragging'); }catch(e){} });
      it.addEventListener('dragend', function(){ it.classList.remove('dragging'); });
      it.addEventListener('dragover', function(ev){ ev.preventDefault(); });
      it.addEventListener('drop', function(ev){
        ev.preventDefault();
        if (S.ans[idx]&&S.ans[idx].graded) return;
        var from=parseInt(ev.dataTransfer.getData('text/plain'),10), to=parseInt(it.getAttribute('data-di'),10);
        if (isNaN(from)||isNaN(to)) return;
        var arr=sel.arr.splice(from,1)[0]; sel.arr.splice(to,0,arr);
        renderOrder(ex, idx, blk, isRank);
      });
    })(its[k]);
  }
}
/* ---- terminal ---- */
function normCmd(c){ return String(c||'').toLowerCase().replace(/\s+/g,' ').trim(); }
function renderTerminal(ex, idx, blk){
  var t=ex.t;
  if (!S.sel[idx]) S.sel[idx]={cmd:''};
  var sel=S.sel[idx];
  var html='';
  if (t.syntaxPanel){
    html+='<div class="art"><span class="art-label">SYNTAX REMINDER — example on a different target</span><div class="art-body"><span class="code">'+hl(t.syntaxPanel)+'</span></div></div>';
  }
  html+='<div class="shell"><div class="sh-out" id="shout">'+hl(t.banner||'')+'\n</div>'+
    '<div class="sh-row"><span class="sh-prompt">'+esc(t.prompt)+'</span><input class="sh-in" id="shin" type="text" spellcheck="false" autocomplete="off" aria-label="Command input"></div>'+
    '<div class="toolbar"><button class="btn blue" id="shrun">⏎ Run</button>'+(t.pexSeconds? '<span class="pex" id="pexchip">⏱ per-exercise budget '+fmt(S.pexLeft[idx]==null? t.pexSeconds : S.pexLeft[idx])+'</span>':'')+'</div>'+
    (t.pexSeconds? '<div class="hintbox" id="pexnote" style="display:none;margin-top:8px">⏸ The per-exercise time budget has elapsed. You may still answer — this is an advisory note, not a penalty.</div>':'')+
    '</div>'+(t.expectedSample? '<div class="mut" style="margin-top:8px">Expected output shape: <span class="code" style="display:inline">'+hl(t.expectedSample)+'</span></div>':'');
  blk.innerHTML=html;
  var inp=document.getElementById('shin'), out=document.getElementById('shout');
  inp.value=sel.cmd||'';
  function run(){
    if (S.ans[idx]&&S.ans[idx].graded) return; /* locked after grading — no answer edits */
    var c=inp.value; sel.cmd=c;
    var n=normCmd(c);
    var echo='\n'+t.prompt+' '+c+'\n';
    if (!n){ echo+='(nothing typed)\n'; }
    else {
      var hit=false;
      for (var i=0;i<t.echoes.length;i++){ if (new RegExp(t.echoes[i].re).test(n)){ echo+=t.echoes[i].out+'\n'; hit=true; break; } }
      if (!hit){ echo+='command not found in this simulation: '+c+'\n(hint: this fake shell only knows the commands this exercise needs)\n'; }
    }
    out.innerHTML=hl(out.textContent+echo);
    out.scrollTop=out.scrollHeight;
    inp.focus();
  }
  document.getElementById('shrun').addEventListener('click', run);
  inp.addEventListener('keydown', function(ev){ if (ev.key==='Enter'){ ev.preventDefault(); run(); } });
  if (S.ans[idx]&&S.ans[idx].graded){ inp.disabled=true; document.getElementById('shrun').disabled=true; }
  if (S.pexDone[idx]){ var pn=document.getElementById('pexnote'); if (pn) pn.style.display='block'; }
  inp.focus();
}
/* ---- triage ---- */
function renderTriage(ex, idx, blk){
  if (!S.sel[idx]) S.sel[idx]={ai:0, picks:ex.alerts.map(function(){return null;})};
  var sel=S.sel[idx];
  var ai=Math.min(sel.ai, ex.alerts.length-1);
  var al=ex.alerts[ai];
  var html='<div class="mut">SOC alert queue — '+ex.alerts.length+' alerts. Choose a response for each; the queue outcome follows your choice. The final Check grades all alerts together.</div>';
  html+='<div class="alertc"><div class="alertc-h">ALERT '+(ai+1)+' OF '+ex.alerts.length+' — '+esc(al.name)+'</div><div style="margin:8px 0">'+md(al.text)+'</div><div class="opts">';
  for (var o=0;o<al.options.length;o++){
    var picked = sel.picks[ai]===o;
    html+='<button class="opt'+(picked?' sel':'')+'" data-o="'+o+'"><span class="olab">'+String.fromCharCode(65+o)+'.</span><span style="flex:1">'+md(al.options[o].label)+'</span></button>';
  }
  html+='</div><div id="tout"></div><div class="toolbar" id="tnav"></div></div>';
  blk.innerHTML=html;
  var bs=blk.querySelectorAll('button[data-o]');
  for (var i=0;i<bs.length;i++){
    (function(btn){
      btn.addEventListener('click', function(){
        if (S.ans[idx]&&S.ans[idx].graded) return;
        var o=parseInt(btn.getAttribute('data-o'),10);
        if (sel.picks[ai]!=null) return;
        sel.picks[ai]=o;
        var outc=al.options[o].outcome;
        document.getElementById('tout').innerHTML='<div class="outcome">'+md(outc)+'</div>';
        var nav=document.getElementById('tnav');
        nav.innerHTML = ai<ex.alerts.length-1? '<button class="btn blue" id="tnext">Next alert ➜</button>' : '<button class="btn primary" id="tchk">✔ Check all alerts</button>';
        if (ai<ex.alerts.length-1){ document.getElementById('tnext').addEventListener('click', function(){ sel.ai=ai+1; renderTriage(ex, idx, blk); }); }
        else { document.getElementById('tchk').addEventListener('click', onCheck); }
      });
    })(bs[i]);
  }
  if (sel.picks[ai]!=null){
    document.getElementById('tout').innerHTML='<div class="outcome">'+md(al.options[sel.picks[ai]].outcome)+'</div>';
    var nav2=document.getElementById('tnav');
    nav2.innerHTML = ai<ex.alerts.length-1? '<button class="btn blue" id="tnext">Next alert ➜</button>' : '<button class="btn primary" id="tchk">✔ Check all alerts</button>';
    if (ai<ex.alerts.length-1){ document.getElementById('tnext').addEventListener('click', function(){ sel.ai=ai+1; renderTriage(ex, idx, blk); }); }
    else { document.getElementById('tchk').addEventListener('click', onCheck); }
  }
}
/* ---- branch ---- */
function renderBranch(ex, idx, blk){
  if (!S.sel[idx]) S.sel[idx]={si:0, picks:ex.steps.map(function(){return null;})};
  var sel=S.sel[idx];
  var si=Math.min(sel.si, ex.steps.length-1);
  var st=ex.steps[si];
  var html='<div><span class="step-head">STEP '+(si+1)+' OF '+ex.steps.length+'</span></div><div style="margin:8px 0">'+md(st.text)+'</div><div class="opts">';
  for (var o=0;o<st.options.length;o++){
    var picked = sel.picks[si]===o;
    html+='<button class="opt'+(picked?' sel':'')+'" data-o="'+o+'"><span class="olab">'+String.fromCharCode(65+o)+'.</span><span style="flex:1">'+md(st.options[o].label)+'</span></button>';
  }
  html+='</div><div id="bout"></div><div class="toolbar" id="bnav"></div>';
  blk.innerHTML=html;
  var bs=blk.querySelectorAll('button[data-o]');
  for (var i=0;i<bs.length;i++){
    (function(btn){
      btn.addEventListener('click', function(){
        if (S.ans[idx]&&S.ans[idx].graded) return;
        var o=parseInt(btn.getAttribute('data-o'),10);
        if (sel.picks[si]!=null) return;
        sel.picks[si]=o;
        document.getElementById('bout').innerHTML='<div class="outcome">'+md(st.options[o].outcome)+'</div>';
        var nav=document.getElementById('bnav');
        nav.innerHTML = si<ex.steps.length-1? '<button class="btn blue" id="bnext">Next step ➜</button>' : '<button class="btn primary" id="bchk">✔ Check all steps</button>';
        if (si<ex.steps.length-1){ document.getElementById('bnext').addEventListener('click', function(){ sel.si=si+1; renderBranch(ex, idx, blk); }); }
        else { document.getElementById('bchk').addEventListener('click', onCheck); }
      });
    })(bs[i]);
  }
  if (sel.picks[si]!=null){
    document.getElementById('bout').innerHTML='<div class="outcome">'+md(st.options[sel.picks[si]].outcome)+'</div>';
    var nav2=document.getElementById('bnav');
    nav2.innerHTML = si<ex.steps.length-1? '<button class="btn blue" id="bnext">Next step ➜</button>' : '<button class="btn primary" id="bchk">✔ Check all steps</button>';
    if (si<ex.steps.length-1){ document.getElementById('bnext').addEventListener('click', function(){ sel.si=si+1; renderBranch(ex, idx, blk); }); }
    else { document.getElementById('bchk').addEventListener('click', onCheck); }
  }
}

/* ================= GRADING ================= */
function grade(ex, idx, sel){
  if (ex.type==='qcm') return gradeQCM(ex, idx, sel, false);
  if (ex.type==='multi') return gradeQCM(ex, idx, sel, true);
  if (ex.type==='logview') return gradeQCM(ex.answer, idx, sel, ex.answer.mode==='multi');
  if (ex.type==='match') return gradeMatch(ex, sel);
  if (ex.type==='dnd') return gradeDnD(ex, sel);
  if (ex.type==='fill') return gradeFill(ex, sel);
  if (ex.type==='order'||ex.type==='rank') return gradeOrder(ex, sel, ex.type==='rank');
  if (ex.type==='terminal') return gradeTerminal(ex, sel);
  if (ex.type==='triage') return gradePicks(ex.alerts.map(function(a){return {options:a.options,note:a.note};}), sel.picks, 'Alert', ex.explain, ex.study);
  if (ex.type==='branch') return gradePicks(ex.steps.map(function(s){return {options:s.options,note:s.note};}), sel.picks, 'Step', ex.explain, ex.study);
  return {credit:0, correctText:'—', explain:''};
}
function gradeQCM(ex, idx, sel, isMulti){
  var opts = ex.options || (ex.answer && ex.answer.options);
  var notes = ex.optionNotes || (ex.answer && ex.answer.optionNotes);
  var corr;
  if (isMulti){
    corr = ex.correct || (ex.answer && ex.answer.correct) || [];
  } else {
    var c0 = (ex.correct!=null) ? ex.correct : (ex.answer && ex.answer.correct);
    corr = [c0];
  }
  corr = isMulti? corr : (Array.isArray(corr)? corr : [corr]);
  /* map original option indices to the letters the learner actually saw on screen */
  var letters='ABCDEFGH';
  var sm=S.smap[idx]||{};
  var disp={};
  if (sm.opts && sm.opts.length===opts.length){ sm.opts.forEach(function(oi,di){ disp[oi]=letters[di]; }); }
  else { for (var z=0;z<opts.length;z++){ disp[z]=letters[z]; } }
  var chosen = isMulti? (sel.choices||[]) : (sel.choice==null? [] : [sel.choice]);
  var r=scoreExercise(chosen, corr);
  var per=[];
  var n=corr.concat(chosen).filter(function(v,i,a){return a.indexOf(v)===i;});
  for (var i=0;i<n.length;i++){
    var oi=n[i];
    var st = (corr.indexOf(oi)>=0)? (chosen.indexOf(oi)>=0?'correct':'missed') : 'wrong';
    per.push({label:disp[oi]+'. '+String(opts[oi]).slice(0,90), status:st, note:notes?notes[oi]:''});
  }
  var correctText = corr.map(function(oi){ return disp[oi]+'. '+opts[oi]; }).join('  ·  ');
  return {credit:r.credit, H:r.H, W:r.W, N:r.N, perItem:per, correctText:correctText, explain: ex.explain, study: ex.study};
}
function gradeMatch(ex, sel){
  var assign=sel.assign||{};
  var H=0,W=0,per=[];
  for (var p=0;p<ex.pairs.length;p++){
    var got=assign[p];
    if (got===p){ H++; per.push({label:ex.pairs[p].left+' → '+ex.pairs[p].right, status:'correct', note:ex.pairs[p].note}); }
    else if (got!=null){ W++; per.push({label:ex.pairs[p].left+' → '+ex.pairs[p].right, status:'wrong', note:ex.pairs[p].note+' (you paired it with "'+ex.pairs[got].right+'")'}); }
    else per.push({label:ex.pairs[p].left+' → '+ex.pairs[p].right, status:'missed', note:ex.pairs[p].note});
  }
  var N=ex.pairs.length;
  return {credit:Math.max(0,(H-W)/N), H:H, W:W, N:N, perItem:per, correctText:ex.pairs.map(function(pr){return pr.left+' → '+pr.right;}).join('  ·  '), explain:ex.explain, study:ex.study};
}
function gradeDnD(ex, sel){
  var place=sel.place||{};
  var H=0,W=0,per=[];
  for (var b=0;b<ex.bank.length;b++){
    var z=place[b];
    if (z===ex.placements[b]){ H++; per.push({label:ex.bank[b]+' → '+ex.zones[ex.placements[b]].name, status:'correct', note:ex.zones[ex.placements[b]].note}); }
    else if (z!=null){ W++; per.push({label:ex.bank[b]+' → '+ex.zones[ex.placements[b]].name, status:'wrong', note:ex.zones[ex.placements[b]].note+' (you placed it in "'+ex.zones[z].name+'")'}); }
    else per.push({label:ex.bank[b]+' → '+ex.zones[ex.placements[b]].name, status:'missed', note:ex.zones[ex.placements[b]].note});
  }
  var N=ex.bank.length;
  return {credit:Math.max(0,(H-W)/N), H:H, W:W, N:N, perItem:per, correctText:ex.zones.map(function(z,zi){ return z.name+': '+ex.bank.filter(function(_,bi){return ex.placements[bi]===zi;}).join(', '); }).join('  ·  '), explain:ex.explain, study:ex.study};
}
function gradeFill(ex, sel){
  var put=sel.put||{};
  var H=0,W=0,per=[];
  for (var b=0;b<ex.blanks.length;b++){
    var w = put[b]!=null? ex.bank[put[b]] : null;
    if (w===ex.blanks[b]){ H++; per.push({label:'Blank '+(b+1)+': '+ex.blanks[b], status:'correct', note:ex.blankNotes?ex.blankNotes[b]:''}); }
    else if (w!=null){ W++; per.push({label:'Blank '+(b+1)+': '+ex.blanks[b], status:'wrong', note:(ex.blankNotes?ex.blankNotes[b]:'')+' (you chose "'+w+'")'}); }
    else per.push({label:'Blank '+(b+1)+': '+ex.blanks[b], status:'missed', note:ex.blankNotes?ex.blankNotes[b]:''});
  }
  var N=ex.blanks.length;
  return {credit:Math.max(0,(H-W)/N), H:H, W:W, N:N, perItem:per, correctText:ex.blanks.join('  ·  '), explain:ex.explain, study:ex.study};
}
function gradeOrder(ex, sel, isRank){
  var arr=sel.arr||[];
  var H=0,W=0,per=[];
  for (var p=0;p<ex.items.length;p++){
    var got=arr[p];
    if (got===p){ H++; per.push({label:'Position '+(p+1)+': '+ex.items[p], status:'correct', note:ex.itemNotes?ex.itemNotes[p]:''}); }
    else if (got!=null){ W++; per.push({label:'Position '+(p+1)+': '+ex.items[p], status:'wrong', note:(ex.itemNotes?ex.itemNotes[p]:'')+' (you placed "'+ex.items[got]+'")'}); }
    else per.push({label:'Position '+(p+1)+': '+ex.items[p], status:'missed', note:ex.itemNotes?ex.itemNotes[p]:''});
  }
  var N=ex.items.length;
  return {credit:Math.max(0,(H-W)/N), H:H, W:W, N:N, perItem:per, correctText:ex.items.map(function(it,i){ return (i+1)+'. '+it; }).join('  '), explain:ex.explain, study:ex.study};
}
function gradeTerminal(ex, sel){
  var t=ex.t;
  var n=normCmd(sel.cmd||'');
  var H=0,W=0,per=[],dangerNote='';
  var Ntot = t.elements.length + (t.absentChecks||[]).length;
  if (!n){ return {credit:0, H:0, W:0, N:Ntot, perItem:t.elements.map(function(el){return {label:el.label,status:'missed',note:el.note};}), correctText:'type the command in the shell', explain:ex.explain, canonical:t.canonical, study:ex.study}; }
  for (var i=0;i<t.elements.length;i++){
    var el=t.elements[i];
    if (new RegExp(el.re).test(n)){ H++; per.push({label:el.label, status:'correct', note:el.note}); }
    else per.push({label:el.label, status:'missed', note:el.note});
  }
  var ab=t.absentChecks||[];
  for (var a=0;a<ab.length;a++){
    if (new RegExp(ab[a].re).test(n)){ per.push({label:ab[a].label, status:'missed', note:ab[a].note}); }
    else { H++; per.push({label:ab[a].label, status:'correct', note:ab[a].note}); }
  }
  for (var d=0;d<(t.dangers||[]).length;d++){
    var dg=t.dangers[d];
    if (new RegExp(dg.re).test(n)){ W++; per.push({label:dg.label, status:'wrong', note:dg.note}); if (!dangerNote) dangerNote=dg.note; }
  }
  return {credit:Math.max(0,(H-W)/Ntot), H:H, W:W, N:Ntot, perItem:per, correctText:t.canonical, canonical:t.canonical, dangerNote:dangerNote, explain:ex.explain, study:ex.study};
}
function gradePicks(units, picks, word, explain, study){
  var H=0,W=0,per=[];
  for (var u=0;u<units.length;u++){
    var p=picks[u];
    var corrIdx=-1;
    for (var o=0;o<units[u].options.length;o++){ if (units[u].options[o].ok) corrIdx=o; }
    if (p==null){ per.push({label:word+' '+(u+1), status:'missed', note:units[u].note}); }
    else if (p===corrIdx){ H++; per.push({label:word+' '+(u+1)+': '+units[u].options[p].label.slice(0,90), status:'correct', note:units[u].note}); }
    else { W++; per.push({label:word+' '+(u+1)+': '+units[u].options[p].label.slice(0,90), status:'wrong', note:units[u].note+' (correct: "'+units[u].options[corrIdx].label+'")'}); }
  }
  var N=units.length;
  return {credit:Math.max(0,(H-W)/N), H:H, W:W, N:N, perItem:per, correctText:units.map(function(un,i){ var ci=un.options.map(function(o){return o.ok?o.label:null;}).filter(Boolean)[0]; return word+' '+(i+1)+': '+ci; }).join('  ·  '), explain:explain||'', study:study||''};
}
