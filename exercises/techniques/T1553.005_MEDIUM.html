.paused-card p{margin:0 0 18px;color:var(--text-secondary);font-size:14.5px}

}

<script type="application/json" id="exam-data">{"topicId":"t1553.005","batch":2,"difficulty":"medium","severity":"MEDIUM","passMark":70,"estimatedMinutes":28,"mitreId":"T1553.005","mitreName":"Mark-of-the-Web Bypass","objectType":"Sub-Technique","intro":{"learn":["This exam is about the MITRE ATT&CK sub-technique T1553.005, called Mark-of-the-Web Bypass. It belongs to the Defense Evasion tactic. In this file you connect two ideas at a time: what the mark causes on Windows, and how attackers remove or avoid it.","Mark-of-the-Web (MOTW) is the note Windows stores in a file's Zone.Identifier stream. A browser download, an Outlook attachment or a chat app save all attach it. Office answers with Protected View and blocked macros, and SmartScreen warns before a marked program runs.","Attackers answer back. They run Unblock-File or Remove-Item with the -Stream parameter, or they hide payloads inside mounted ISO images, where files simply carry no mark. You will read the telemetry these actions leave: Sysmon events, PowerShell logs and the stream data itself.","This maps directly to your work. SOC analysts prioritise which stream alerts matter first. Incident responders read streams before touching evidence. Detection engineers join PowerShell and Sysmon events into one rule, and threat hunters sweep for payloads with no mark at all. Mail security teams filter image attachment types, and administrators push the controls through MDM tools such as Intune."],"keywords":[{"theme":"What the mark triggers","items":["Protected View","macro blocking for internet files","SmartScreen","zone values ZoneId 1 and 3"]},{"theme":"Bypass and removal","items":["ISO image mounted as a drive","payload with no Zone.Identifier","Unblock-File","Remove-Item -Stream"]},{"theme":"Detection","items":["Sysmon event 15","Sysmon event 23","PowerShell events 4103 and 4104","Get-Content -Stream Zone.Identifier"]},{"theme":"Response and mitigation","items":["evidence selection for proof of removal","Attack Surface Reduction rules","mail filtering of attachment types","block macros from the internet policy"]}],"how":["You will answer 15 exercises. You need 70% or more to pass. A pass means you can apply these ideas in real triage work.","Exercise types in this exam: multiple choice, matching pairs, drag and drop, fill-in-the-blank, one branching decision tree, and one simulated PowerShell terminal.","A countdown timer runs for 28 minutes. The Pause button hides the exercise and stops the timer until you press Resume.","When you press Check, the timer stops automatically so you can read the feedback as long as you like. It starts again when you press Next.","Exercises with several items give partial credit: max(0, (correct − wrong) / items). One hint per exercise is allowed; it costs 10% of that exercise's credit.","Skip moves an exercise to a review pool. Near the end you can answer skipped exercises. Skipped exercises you never answer do not count in your score at all. In the terminal you type the command yourself and press Enter to run it."]},"exercises":[{"id":"e01","type":"single","perspective":"defender","scenario":{"summary":"Ticket INC-5012 — what will Word do with this file?","text":["Ticket INC-5012: a user on WKS-ACC-04 saved an attachment named Q3-invoice.docm from external mail and double-clicked it.","Before deciding the response, you read the file's zone data on a copy.","The stream shows the file came from the internet zone."],"artefacts":[{"label":"ARTEFACT 1 — Zone.Identifier stream of Q3-invoice.docm","kind":"code","lines":["[ZoneTransfer]","ZoneId=3","ReferrerUrl=hxxp://cdn[.]mail-attach[.]example[.]com/o2/Q3-invoice.docm","HostUrl=hxxp://cdn[.]mail-attach[.]example[.]com/o2/Q3-invoice.docm"]}]},"question":"How will Word treat this file when it opens?","options":[{"id":"a","text":"Opens in Protected View with macros blocked"},{"id":"b","text":"Opens normally with macros allowed to run"},{"id":"c","text":"Opens in Protected View with macros allowed to run"},{"id":"d","text":"Opens normally with macros blocked by antivirus"}],"correct":["a"],"hint":"Two things happen together for internet files: the read-only open, and the macro decision.","explain":["ZoneId=3 means the internet zone. Office answers twice: the document opens in Protected View (read-only, no editing), and macros from internet files are blocked by default. The two reactions travel together.","Option b ignores the mark completely. Option c misses that the macro block is a separate, additional rule. Option d invents an antivirus role that the Office macro decision does not depend on."]},{"id":"e02","type":"match","perspective":"defender","scenario":{"summary":"Reading the timeline on WKS-ACC-04","text":["You pull the host timeline for ticket INC-5012 from the SIEM. Four event types appear within six minutes.","Match each event to what it tells you about the file and the mark."],"artefacts":[{"label":"ARTEFACT 1 — SIEM export, host WKS-ACC-04, 2025-03-11 (filter box available)","kind":"log","filter":true,"lines":["12:04:11  Sysmon  Event 15  FileCreateStreamHash  Target: C:\\Users\\llang\\Downloads\\Q3-invoice.docm:Zone.Identifier  Hash: OK","12:05:02  Office   Audit     MacroWarning        Document Q3-invoice.docm opened in Protected View","12:06:40  Sysmon  Event 11  FileCreate           Image: C:\\Users\\llang\\AppData\\Roaming\\svchost32.exe","12:07:02  PS       4104      ScriptBlock          Unblock-File -Path C:\\Users\\llang\\AppData\\Roaming\\svchost32.exe","12:07:31  Sysmon  Event 23  FileDelete           Target: C:\\Users\\llang\\AppData\\Roaming\\svchost32.exe:Zone.Identifier"]}]},"question":"Match each event to what it tells you.","pairs":[{"left":"Sysmon Event 15 on …docm:Zone.Identifier","right":"The mark was attached when the file was saved"},{"left":"PowerShell 4104 with Unblock-File","right":"A command removed the mark from a file"},{"left":"Sysmon Event 11 FileCreate of svchost32.exe","right":"A new executable appeared on disk"},{"left":"Sysmon Event 23 on …exe:Zone.Identifier","right":"A file or stream was deleted on the host"}],"hint":"Follow the mark's life cycle: attached, opened, then removed by command.","explain":["Event 15 is Sysmon's stream-creation event with a hash, so it proves the mark existed at save time. Event 4104 records the Unblock-File command text itself.","Event 11 is the plain file-creation event for the dropped executable. Event 23 is the deletion event, here aimed at a Zone.Identifier stream — the actual mark removal on disk."]},{"id":"e03","type":"drag","perspective":"neutral","scenario":{"summary":"Which of these files carry a mark right now?","text":["During triage you collect six files from different hosts and sources.","Sort them by whether a Zone.Identifier stream should exist on them."]},"question":"Sort each file into the correct column.","zones":[{"id":"z1","label":"Zone.Identifier present","accepts":["i1","i3","i5"]},{"id":"z2","label":"Zone.Identifier absent","accepts":["i2","i4","i6"]}],"items":[{"id":"i1","text":"setup.exe saved by Edge from a vendor site"},{"id":"i2","text":"payload.exe taken from a mounted .iso image"},{"id":"i3","text":"notes.docx saved from an Outlook attachment"},{"id":"i4","text":"policy.pdf copied from \\\\fileserver\\hr\\"},{"id":"i5","text":"video.mp4 saved by a chat app to Downloads"},{"id":"i6","text":"tool.msi expanded by an old extractor that does not copy streams"}],"hint":"Two things remove or prevent the mark: where the file was born (inside an image or a share) and who unpacked it.","explain":["Present: the Edge download, the Outlook attachment and the chat app save all arrive from the internet zone, so their Zone.Identifier streams exist.","Absent: files read from a mounted ISO never receive a mark, files copied over an internal SMB share are not marked, and an extractor that ignores streams drops its output without one. All three are ways staging stays invisible to mark-based warnings."]},{"id":"e04","type":"terminal","perspective":"defender","scenario":{"summary":"Read the zone data on the lab copy","text":["Ticket INC-5021: a suspicious invoice.xlsx from external mail is under analysis on the isolated lab host.","The evidence original is sealed in storage. You work on the robocopy acquisition copy in D:\\lab\\INC-5021, which preserves streams. Your current directory is that folder.","Goal: print the zone data attached to invoice.xlsx without changing anything."],"artefacts":[{"label":"ARTEFACT 1 — Lab runbook extract","kind":"text","lines":["Rule 1: read-only commands on lab copies are always allowed.","Rule 2: the sealed original on the evidence share is never touched.","Rule 3: zone data is read with the Get-Content reader aimed at the stream."]}]},"question":"Type the command that prints the zone data of invoice.xlsx.","terminal":{"prompt":"analyst@WKS-LAB-02","banner":["Windows PowerShell — isolated lab host (simulated)","Working folder: D:\\lab\\INC-5021  (robocopy acquisition copy, streams preserved)"],"solution":"Get-Content -Path .\\invoice.xlsx -Stream Zone.Identifier","elements":[{"label":"reader cmdlet Get-Content","re":"^[Gg]et-[Cc]ontent( |$)"},{"label":"-Stream Zone.Identifier","re":"-Stream\\s+Zone\\.Identifier"}],"outputs":[{"re":"-Stream\\s+[Zz]one\\.[Ii]dentifier","lines":["[ZoneTransfer]","ZoneId=3","ReferrerUrl=hxxp://files[.]billing-portal[.]example[.]com/drop/invoice.xlsx","HostUrl=hxxp://files[.]billing-portal[.]example[.]com/drop/invoice.xlsx"]},{"re":"^[Gg]et-","lines":["PK?? ?? ?? ??  [Content_Types].xml … (binary document data continues)","This printed the file body — add -Stream Zone.Identifier to read the mark."]}],"nearMiss":[{"re":"Remove-Item","msg":"Remove-Item would delete the stream — that destroys evidence instead of reading it."},{"re":"^[Uu]nblock-[Ff]ile","msg":"Unblock-File changes the file instead of reading it. Read-only first on evidence."}],"nearMissSample":"Remove-Item -Path .\\invoice.xlsx -Stream Zone.Identifier","partialSample":"Get-Content -Path .\\invoice.xlsx"},"hint":"The runbook names the reader; you choose the stream option that aims at the mark.","explain":["The canonical command is: Get-Content -Path .\\invoice.xlsx -Stream Zone.Identifier. The runbook names Get-Content as the reader; -Stream Zone.Identifier is your choice, and it selects the mark instead of the document body.","Remove-Item with -Stream deletes the stream — evidence gone, so the shell flags it as a near miss. Unblock-File would also change state. The stream shows ZoneId=3 and the download URL, which feeds the timeline in INC-5021."]},{"id":"e05","type":"match","perspective":"attacker","scenario":{"summary":"Red-team debrief — the archive-extractor chain, trace by trace","text":["In a purple-team exercise you replayed an archive-extractor lure against a lab tenant: a direct .zip attachment, a legacy extractor, and a payload that never carries a mark.","The blue team now asks you to map every step of your chain to the trace defenders can query. Match them."]},"question":"Match each step of the chain to the trace it leaves.","pairs":[{"left":"Outlook saves payroll.zip to Downloads","right":"The archive gets its Zone.Identifier at save time"},{"left":"The bundled legacy extractor unpacks it","right":"Extracted files are born with no Zone.Identifier"},{"left":"The extracted .hta is opened","right":"No script warning — the mark is missing"},{"left":"The archive is deleted after extraction","right":"Sysmon deletion event on the .zip's :Zone.Identifier"},{"left":"Defender lists the .hta's streams","right":"Get-Item -Stream * shows :$DATA only"}],"hint":"Follow the mark: attached to the archive, absent from everything the extractor produces, gone from the archive at the end.","explain":["The archive itself arrives from the internet, so Windows marks it at save time — the only mark in this chain. Everything the legacy extractor writes out is born without a stream, so the .hta runs with no warning: the extractor's output is the bypass.","Deleting the archive afterwards removes its mark too, which shows up as a Sysmon deletion event on the :Zone.Identifier path. And listing the .hta's streams shows :$DATA only — proof at file level that this was the extractor escape, not a removed mark, because no creation or deletion event ever touched the .hta."]},{"id":"e06","type":"single","perspective":"defender","scenario":{"summary":"Ticket INC-5078 — the warning that never came","text":["Ticket INC-5078: a user mounted invoice.iso from external mail and opened the program inside it.","The endpoint runs default settings: SmartScreen is enabled and the ISO was not blocked.","The payload executed and no SmartScreen warning appeared. You must explain why in the ticket."]},"question":"Which explanation is correct for the missing SmartScreen warning?","options":[{"id":"a","text":"SmartScreen was disabled by group policy on this host"},{"id":"b","text":"Files read from a mounted ISO never carry the mark"},{"id":"c","text":"The user clicked the Unblock box in file Properties"},{"id":"d","text":"The payload copied itself before Windows could mark it"}],"correct":["b"],"hint":"The mark is attached when a file is saved from the internet — ask where this file was born.","explain":["The payload never existed as a separate download; it was read out of a mounted image. Files inside mounted ISO/IMG/VHD images carry no Zone.Identifier, so SmartScreen has no mark to react to — the format-based form of T1553.005.","The scenario states SmartScreen was on, so a is wrong. No Unblock action is in the timeline, so c is wrong. Windows does not mark files retroactively by copying, so d is wrong."]},{"id":"e07","type":"blank","perspective":"neutral","scenario":{"summary":"What did the attacker type?","text":["PowerShell operational logging captured the command that removed the mark from a payload in AppData.","The command targets the hidden stream instead of the whole file. In the ticket you record the exact parameter that made the difference."],"artefacts":[{"label":"ARTEFACT 1 — PowerShell 4104, WKS-ACC-04 12:07:02","kind":"code","lines":["Remove-Item -Path C:\\Users\\llang\\AppData\\Roaming\\svchost32.exe ______ Zone.Identifier"]}]},"question":"Type the missing parameter in the blank.","blanks":[{"before":"Remove-Item -Path C:\\Users\\llang\\AppData\\Roaming\\svchost32.exe ","after":" Zone.Identifier","answer":["-Stream"],"hint":"the parameter that aims at the hidden stream, not the file itself"}],"hint":"Without this parameter the whole file would have been deleted instead of only the mark.","explain":["The parameter is -Stream. Remove-Item with -Stream Zone.Identifier deletes only the mark and leaves the executable in place — a surgical removal that keeps the payload running.","Without -Stream, Remove-Item would have deleted the entire file. That difference matters for detection: deleting a stream is quiet, deleting a payload in AppData is loud."]},{"id":"e08","type":"multi","perspective":"defender","scenario":{"summary":"Prove the mark was removed — pick the evidence","text":["For ticket INC-5012 you must show that Mark-of-the-Web was deliberately removed, not just absent.","Five artefacts are in the case file. Three of them prove the removal."]},"question":"Select the THREE artefacts that prove the mark was removed.","options":[{"id":"a","text":"PowerShell 4104 text containing Unblock-File with the payload path"},{"id":"b","text":"Sysmon Event 23 targeting the payload's :Zone.Identifier stream"},{"id":"c","text":"PowerShell 4103 module-logging entry for the same command"},{"id":"d","text":"A DNS query to evil[.]example from the same host"},{"id":"e","text":"An Office macro audit event showing macros were enabled"}],"correct":["a","b","c"],"hint":"Two artefacts capture the command itself, one captures the stream deletion; the others prove other things.","explain":["The 4104 script-block text records Unblock-File word for word, the 4103 module-logging entry corroborates the same PowerShell invocation, and Sysmon 23 shows the :Zone.Identifier stream being deleted. Together they prove removal.","The DNS query shows network activity, not mark removal. The macro audit event proves the consequence — macros ran — which is what removal enabled, not the removal itself."]},{"id":"e09","type":"blank","perspective":"defender","scenario":{"summary":"Write the detection rule sentence","text":["Your detection engineer drafts the mark-removal rule for the SIEM catalogue and asks you to fill the two gaps.","The rule watches the PowerShell log that stores command text, and it keys on the cmdlet that unblocks files."]},"question":"Fill both blanks to complete the rule sentence.","blanks":[{"before":"Alert when PowerShell event ","after":" contains the cmdlet ","answer":["4104"],"hint":"the script-block logging event ID"},{"before":"","after":" with a payload path in its text.","answer":["Unblock-File"],"hint":"the cmdlet whose name says it removes the block"}],"hint":"The first gap is a number from the artefacts; the second is the cmdlet you saw in them.","explain":["Event 4104 is PowerShell script-block logging: it stores the command text, which is what makes Unblock-File visible word for word.","Keying the rule on the cmdlet name catches the removal command even when the path changes. Without 4104 telemetry the rule has nothing to read — enable the logging first."]},{"id":"e10","type":"match","perspective":"dual","scenario":{"summary":"Four ways to touch the mark, four traces","text":["The debrief continues: the blue team lists the four removal and avoidance moves they saw, each leaving a different trace.","Match each move to the trace it leaves for defenders."]},"question":"Match each move to its trace.","pairs":[{"left":"Unblock-File in a PowerShell command","right":"PowerShell 4104 script-block log entry"},{"left":"Remove-Item -Stream Zone.Identifier","right":"Sysmon stream or file deletion event"},{"left":"Payload stored inside a mounted .iso","right":"Disk mount event and a payload with no mark"},{"left":"Overwrite the stream with Set-Content -Stream Zone.Identifier","right":"A rewritten stream with attacker-chosen content"}],"hint":"Three actions touch the mark in different ways: remove, avoid, rewrite.","explain":["Unblock-File lands in 4104 script-block logs with the full command text. Remove-Item with -Stream shows up as a Sysmon deletion event on the stream path.","A payload inside a mounted image avoids the mark entirely and leaves a mount event plus a stream-less executable. Overwriting the stream with Set-Content keeps a stream on disk — but with attacker-chosen content, which forensic reading will expose.","Attacker perspective: every move is judged by the trace it leaves — the quietest choice is the mounted image, because there is no mark event to catch at all.","Defender perspective: no single source tells the story, so the rule joins command text (4104) with stream state (Sysmon 15/23/26) and treats a missing or rewritten stream as a question to investigate, not a verdict."]},{"id":"e11","type":"branch","perspective":"defender","scenario":{"summary":"“The document opened without Protected View”","text":["Ticket INC-5102: a user on WKS-ACC-04 says an external invoice document opened without the usual Protected View banner.","Work the decision tree to the final call."]},"question":"Work through the branches and pick the final decision.","branch":{"steps":[{"prompt":"The document opened with no Protected View. What do you check first?","options":[{"id":"a","text":"Check whether the file carries a Zone.Identifier stream"},{"id":"b","text":"Ask the user to download the file again"},{"id":"c","text":"Reboot the workstation and retry"}],"correct":"a","outcome":"You read the streams on a copy: the file arrived by external mail, but no Zone.Identifier exists."},{"prompt":"The mark is missing on a file that arrived by external mail. Which record explains it best?","options":[{"id":"a","text":"PowerShell 4104 showing Unblock-File on that exact path"},{"id":"b","text":"A printer spooler event from the same morning"},{"id":"c","text":"A Wi-Fi roaming event from yesterday"}],"correct":"a","outcome":"The host logged Unblock-File at 12:07:22 with the same path the user opened."}],"final":{"question":"Unblock-File ran on the payload path. What is your decision?","options":[{"id":"a","text":"Isolate the workstation, open an incident, and collect 4104 with Sysmon events"},{"id":"b","text":"Delete the payload to clean the host"},{"id":"c","text":"Ask the user to open the document again"},{"id":"d","text":"Wait for more users to report the same mail"}],"correct":["a"]}},"hint":"Contain and collect in one move. Anything that destroys the payload destroys the case.","explain":["The tree teaches the order: verify the mark's absence first, then find the command that removed it. 4104 naming the exact path turns 'a missing stream' into 'a deliberate bypass'.","The decision combines containment and collection. Deleting the payload destroys evidence, reopening the file risks a live document, and waiting leaves a bypassed control in place."]},{"id":"e12","type":"drag","perspective":"defender","scenario":{"summary":"Sort the mitigations by where they act","text":["Your hardening plan for T1553.005 has five candidate controls.","Sort each control by where it acts: before the file is opened, or when the file tries to run."]},"question":"Sort each control into the correct column.","zones":[{"id":"z1","label":"Acts before the file is opened","accepts":["i1","i5"]},{"id":"z2","label":"Acts when the file runs","accepts":["i2","i3","i4"]}],"items":[{"id":"i1","text":"Mail rule that blocks .iso and .img attachments"},{"id":"i2","text":"ASR rule: block Office applications from creating child processes"},{"id":"i3","text":"Office policy: block macros in files with the mark"},{"id":"i4","text":"SmartScreen kept enabled for downloaded programs"},{"id":"i5","text":"Awareness training: report unexpected invoice attachments"}],"hint":"Mail filtering and training stop the file from being opened at all; the other three act at execution time.","explain":["Delivery-side controls act before any open: the mail rule keeps image lures out of inboxes, and awareness training stops users from opening the ones that arrive.","Execution-side controls act when it matters: the ASR rule stops a Word document from spawning the payload, the macro policy keeps macros dead even if Protected View is bypassed, and SmartScreen challenges programs at first run."]},{"id":"e13","type":"blank","perspective":"defender","scenario":{"summary":"The Sysmon event that watches streams — and what it joins with","text":["Your detection engineer onboards Sysmon stream telemetry for the T1553.005 rule and asks for the event ID that sees the mark being born.","The rule then joins that birth event with the removal side — PowerShell 4104 and the Sysmon deletion events — so the service desk sees a mark's full life cycle in one place.","Pick the ID from the artefact: only one event's rows carry the stream hash."],"artefacts":[{"label":"ARTEFACT 1 — SIEM export, host WKS-ACC-09 (filter box available)","kind":"log","filter":true,"lines":["14:22:03  Sysmon 15  FileCreateStreamHash  C:\\Users\\rbell\\Downloads\\pricing.xlsx:Zone.Identifier  Hash: 3F9A…","14:26:40  PS 4104    ScriptBlock           Remove-Item -Path C:\\Users\\rbell\\Downloads\\pricing.xlsx -Stream Zone.Identifier","14:26:41  Sysmon 23  FileDelete            C:\\Users\\rbell\\Downloads\\pricing.xlsx:Zone.Identifier"]}]},"question":"Type the missing event ID in the blank.","blanks":[{"before":"Alert rule: key on Sysmon event ID ","after":" , the event whose rows carry the stream hash, and join it with PowerShell 4104 and the deletion event for the removal side.","answer":["15"],"hint":"the ID on the artefact rows that carry the stream hash"}],"hint":"Count which rows in the artefact carry the stream hash — the ID you need sits on those rows, not on the removal rows.","explain":["Event 15 is FileCreateStreamHash: it fires when an alternate data stream such as Zone.Identifier is created, and its rows are the only ones in the artefact that carry the stream hash. That is the tell — the removal rows (4104 and 23) describe a command and a deletion, but only event 15 sees the mark being born.","Joining event 15 with PowerShell 4104 and the Sysmon deletion events gives the full life cycle in one rule: creation, removal command, deletion. Without the join, a single event 15 row is just a file that got marked, which happens all day on a healthy network."]},{"id":"e14","type":"single","perspective":"neutral","scenario":{"summary":"ZoneId=1 from the portal — meaning plus corroboration","text":["A user saved a report from the staff portal and its stream shows ZoneId=1. The service desk asks you what to tell the user.","You must also say whether the HostUrl line in the stream backs up the intranet story before the desk closes the ticket."],"artefacts":[{"label":"ARTEFACT 1 — Zone.Identifier stream of report.docx","kind":"code","lines":["[ZoneTransfer]","ZoneId=1","HostUrl=hxxp://staff[.]portal[.]internal[.]example/report.docx"]}]},"question":"What should the service desk be told about the zone value and the HostUrl?","options":[{"id":"a","text":"Intranet origin with fewer warnings; the HostUrl names the intranet portal, so the claim is consistent"},{"id":"b","text":"Internet origin with every warning; the HostUrl proves the file came from outside"},{"id":"c","text":"The stream is corrupt, so Windows ignores it; rebuild the stream before opening"},{"id":"d","text":"Intranet origin with no warnings at all; no further checks are needed"}],"correct":["a"],"hint":"Zone 1 is one step above the internet zone in trust — and read the HostUrl line before you answer the second half.","explain":["ZoneId=1 is the local intranet zone, so Windows shows fewer warnings — often no SmartScreen prompt and a lighter Office experience. The second half checks the story: the HostUrl line names the staff portal on the internal domain, which is what an intranet save should look like, so the claim is consistent.","It is not the internet zone (that is 3), the stream is not corrupt, and 'no warnings at all' overstates zone 1 — Office still applies its own rules. Reading the HostUrl next to the zone value is the habit that later catches forged intranet claims, where the URL names a site the proxy never saw."]},{"id":"e15","type":"single","perspective":"defender","scenario":{"summary":"Why layer the ASR rule with the macro policy?","text":["Your hardening ticket already deploys the Attack Surface Reduction rule that blocks Office applications from creating child processes.","A colleague asks why the Office policy that blocks macros in files carrying the mark should also be enabled."]},"question":"Which reason is correct?","options":[{"id":"a","text":"The macro policy also covers payloads that run without spawning from Office"},{"id":"b","text":"The two rules are alternatives; enabling both doubles logging noise only"},{"id":"c","text":"The macro policy stops the code before Office ever spawns a child process"},{"id":"d","text":"The ASR rule alone cannot work unless every Office policy is enabled"}],"correct":["c"],"hint":"One rule stops the spawn; the other stops the code from ever getting that far.","explain":["The macro policy kills macro code inside the document before any child process exists, so the ASR rule never has to fire. Defence in depth: stop the code early, and stop the spawn if the first layer fails.","Option a is backwards — the macro policy covers only the macro path. Option b ignores that the layers block different steps. Option d is wrong because the ASR rule works on its own."]}]}</script>
<script>
(function () {
  'use strict';

  /* ============================ utilities ============================ */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function mulberry32(seed) {
    var t = seed >>> 0;
    return function () {
      t += 0x6D2B79F5;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffled(arr, rnd) {
    var a = arr.slice(), i, j, tmp;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(rnd() * (i + 1));
      tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function fmt1(n) { return (Math.round(n * 10) / 10).toFixed(1); }
  function fmt2(n) { return (Math.round(n * 100) / 100).toFixed(2); }
  function fmtPct(sum, count) { return count > 0 ? Math.round((sum / count) * 100) : 0; }
  function hashId(s) {
    var h = 0, i;
    for (i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h;
  }
  function exSeed(ex, salt) { return ((S.seed ^ 0x9E3779B9) * 2654435761 + hashId(ex.id) * 97 + salt) >>> 0; }

  /* ============================ data ============================ */
  var DATA = JSON.parse($('exam-data').textContent);
  var EXS = DATA.exercises;
  var TOTAL = EXS.length;
  var BUDGET = (DATA.estimatedMinutes || 25) * 60;
  var PASSMARK = DATA.passMark || 70;
  var SEVCLS = { 'EASY': 'sev-easy', 'MEDIUM': 'sev-medium', 'HARD': 'sev-hard', 'EXTREMELY HARD': 'sev-extreme' };
  var byId = {};
  EXS.forEach(function (e) { byId[e.id] = e; });

  /* ============================ state ============================ */
  var S = {
    screen: 'intro',        // intro | exam | review | results
    attempt: 0,
    order: [],
    pos: 0,
    answers: {},            // exId -> widget state
    results: {},            // exId -> graded result
    skipped: [],            // exIds in the skip pool (never answered yet)
    hintUsed: {},
    creditSum: 0,
    answeredCount: 0,
    state: 'RUNNING',       // RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED
    resumeState: null,
    remaining: BUDGET,
    pauseAccum: { manual: 0, autoCheck: 0 },
    posted: false,
    mode: 'main',           // main | review
    reviewList: [],
    seed: 1,
    checkedId: null,
    exTimer: null,          // { exId, remaining } for per-exercise timed terminal exercises
    handshake: null
  };

  /* ============================ timer ============================ */
  var lastTick = Date.now();
  setInterval(function () {
    var now = Date.now();
    var dt = (now - lastTick) / 1000;
    lastTick = now;
    if (dt < 0 || dt > 2) { dt = 0.25; }
    if (S.state === 'RUNNING') {
      S.remaining -= dt;
      if (S.remaining <= 0) { S.remaining = 0; updateHeader(); endByTimeout(); return; }
      if (S.exTimer && !S.results[S.exTimer.exId] && S.screen === 'exam') {
        S.exTimer.remaining -= dt;
        var et = $('ex-timer-clock');
        if (et) { et.textContent = fmtClock(S.exTimer.remaining); }
        if (S.exTimer.remaining <= 0) { S.exTimer.remaining = 0; doCheck(true); }
      }
      updateTimerClock();
    } else if (S.state === 'PAUSED_MANUAL') {
      S.pauseAccum.manual += dt;
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      S.pauseAccum.autoCheck += dt;
    }
  }, 250);

  function updateTimerClock() {
    var el = $('hdr-clock');
    if (el) { el.textContent = fmtClock(S.remaining); }
  }
  function setState(next) {
    S.state = next;
    renderTimerPill();
    renderPauseOverlay();
  }
  function renderTimerPill() {
    var pill = $('hdr-timer');
    if (!pill) { return; }
    var clock = '<span class="t-clock" id="hdr-clock">' + fmtClock(S.remaining) + '</span>';
    if (S.state === 'RUNNING') {
      pill.className = 'pill pill-timer st-run';
      pill.innerHTML = '<span class="t-state">▶ Running</span>' + clock;
    } else if (S.state === 'PAUSED_MANUAL') {
      pill.className = 'pill pill-timer st-pause';
      pill.innerHTML = '<span class="t-state">⏸ PAUSED — manual (press Resume)</span>' + clock;
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      pill.className = 'pill pill-timer st-pause';
      pill.innerHTML = '<span class="t-state">⏸ PAUSED — reviewing feedback (resumes on Next)</span>' + clock;
    } else {
      pill.className = 'pill pill-timer st-end';
      pill.innerHTML = '<span class="t-state">■ Ended</span>' + clock;
    }
  }

  /* ============================ header ============================ */
  function headerHtml() {
    var sev = DATA.severity;
    var cls = SEVCLS[sev] || 'sev-easy';
    return '<header class="hdr" id="hdr">' +
      '<div class="hdr-row">' +
        '<span class="counter" id="hdr-counter"></span>' +
        '<span class="sev ' + cls + '" id="hdr-sev"><span class="dot" aria-hidden="true"></span>' + esc(sev) + '</span>' +
        '<span class="hdr-spacer"></span>' +
        '<span class="pill pill-timer" id="hdr-timer" role="timer"></span>' +
        '<span class="pill" id="hdr-score" aria-label="Live score"></span>' +
      '</div>' +
      '<div class="hdr-row">' +
        '<button type="button" class="btn" id="btn-hint">? Hint</button>' +
        '<button type="button" class="btn" id="btn-skip">Skip »</button>' +
        '<button type="button" class="btn" id="btn-pause">⏸ Pause</button>' +
        '<div class="progress" role="progressbar" id="hdr-progress" aria-label="Exam progress" aria-valuemin="0" aria-valuemax="' + TOTAL + '" aria-valuenow="0">' +
          '<div class="progress-fill" id="progress-fill"></div>' +
        '</div>' +
      '</div>' +
    '</header>';
  }
  function updateHeader() {
    var ex = currentEx();
    var counter = $('hdr-counter');
    if (counter) {
      if (S.screen === 'results') {
        counter.textContent = 'Exam complete';
      } else {
        var n = S.pos + 1;
        counter.textContent = (S.mode === 'review' ? 'Review · ' : '') + 'Exercise ' + n + ' of ' + TOTAL;
      }
    }
    var score = $('hdr-score');
    if (score) {
      var pct = fmtPct(S.creditSum, S.answeredCount);
      score.innerHTML = 'Score <b>' + fmt1(S.creditSum) + '</b>&nbsp;/&nbsp;' + S.answeredCount + ' · ' + pct + '%';
    }
    var hint = $('btn-hint'), skip = $('btn-skip'), pause = $('btn-pause');
    var answered = ex && !!S.results[ex.id];
    if (hint) {
      hint.disabled = answered || !!S.hintUsed[ex ? ex.id : ''] || S.state !== 'RUNNING' && S.state !== 'PAUSED_AUTO_CHECK';
      hint.setAttribute('aria-label', 'Hint (costs 10% of this exercise credit, one use only)');
    }
    if (skip) {
      skip.disabled = answered || S.state !== 'RUNNING';
      skip.setAttribute('aria-label', 'Skip this exercise and move it to the skipped pool');
    }
    if (pause) {
      var manual = S.state === 'PAUSED_MANUAL';
      pause.innerHTML = manual ? '▶ Resume' : '⏸ Pause';
      pause.disabled = S.state === 'ENDED';
      pause.setAttribute('aria-label', manual ? 'Resume the exam' : 'Pause the exam manually (hides the exercise)');
    }
    var fill = $('progress-fill');
    if (fill) {
      var done = S.answeredCount + S.skipped.length;
      var pctW = TOTAL > 0 ? Math.round((done / TOTAL) * 100) : 0;
      fill.style.width = pctW + '%';
      var pb = $('hdr-progress');
      if (pb) { pb.setAttribute('aria-valuenow', String(done)); }
    }
  }

  /* ============================ intro screen ============================ */
  function renderIntro() {
    S.screen = 'intro';
    var intro = DATA.intro;
    var kw = (intro.keywords || []).map(function (grp) {
      return '<div class="kw-theme"><h3>' + esc(grp.theme) + '</h3><ul>' +
        grp.items.map(function (k) { return '<li>' + esc(k) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    var html =
      '<div class="intro">' +
        '<section class="intro-strip" aria-label="Exam facts">' +
          '<h1>' + esc(DATA.mitreId) + ' — ' + esc(DATA.mitreName) + '</h1>' +
          '<div class="intro-sub">' + esc(DATA.objectType) + ' · MITRE ATT&CK · ' + esc(DATA.severity) + ' practice exam</div>' +
          '<div class="factrow">' +
            '<span class="fact"><b>' + TOTAL + '</b> exercises</span>' +
            '<span class="sev ' + (SEVCLS[DATA.severity] || 'sev-easy') + '"><span class="dot" aria-hidden="true"></span>' + esc(DATA.severity) + '</span>' +
            '<span class="fact">Estimated time: <b>' + DATA.estimatedMinutes + ' min</b></span>' +
            '<span class="fact">Timer budget: <b>' + fmtClock(BUDGET) + '</b></span>' +
            '<span class="fact">Pass mark: <b>' + PASSMARK + '%</b></span>' +
          '</div>' +
        '</section>' +
        '<section class="intro-card"><h2>What you will learn here</h2>' +
          intro.learn.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
        '</section>' +
        '<section class="intro-card"><h2>Keywords covered in this exam</h2>' +
          '<div class="kw-grid">' + kw + '</div>' +
        '</section>' +
        '<section class="intro-card"><h2>How this exam works</h2>' +
          '<ul class="how-list">' + intro.how.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' +
          '<div class="intro-start">' +
            '<button type="button" class="btn btn-primary btn-big" id="btn-start">Start exam</button>' +
            '<span class="start-note">The timer starts when you press Start.</span>' +
          '</div>' +
        '</section>' +
      '</div>';
    var app = $('app');
    app.innerHTML = html;
    $('btn-start').addEventListener('click', startAttempt);
  }

  /* ============================ attempt control ============================ */
  function startAttempt() {
    S.attempt += 1;
    S.seed = 1 + S.attempt * 7919;
    S.order = EXS.map(function (_, i) { return i; });
    if (S.attempt > 1) {
      S.order = shuffled(S.order, mulberry32(S.seed));
    }
    S.pos = 0;
    S.answers = {};
    S.results = {};
    S.skipped = [];
    S.hintUsed = {};
    S.creditSum = 0;
    S.answeredCount = 0;
    S.pauseAccum = { manual: 0, autoCheck: 0 };
    S.posted = false;
    S.mode = 'main';
    S.reviewList = [];
    S.checkedId = null;
    S.exTimer = null;
    S.remaining = BUDGET;
    S.screen = 'exam';
    setState('RUNNING');
    renderExam();
  }
  function currentEx() {
    if (S.screen !== 'exam' && S.screen !== 'results') { return null; }
    if (S.pos < 0 || S.pos >= S.order.length) { return null; }
    return EXS[S.order[S.pos]];
  }

  /* ============================ exercise rendering ============================ */
  function scenarioLong(sc) {
    var chars = (sc.text || []).join(' ').length;
    return chars > 600 || (sc.artefacts && sc.artefacts.length >= 2);
  }
  function artefactHtml(a, idx) {
    var body;
    if (a.kind === 'log' || a.kind === 'code') {
      var lines = (a.lines || []).map(function (ln) {
        return '<span class="ln">' + highlight(ln) + '</span>';
      }).join('');
      var filter = a.filter ? '<input type="text" class="logfilter" data-filter="' + idx + '" placeholder="Filter lines (text match)" aria-label="Filter log lines">' : '';
      body = filter + '<pre class="mono loglines" data-logbody="' + idx + '">' + lines + '</pre>';
    } else {
      body = '<pre class="mono loglines">' + (a.lines || []).map(function (ln) { return esc(ln); }).join('\n') + '</pre>';
    }
    return '<div class="artefact"><div class="artefact-label"><span aria-hidden="true">▤</span>' + esc(a.label) + '</div>' + body + '</div>';
  }
  var SYN_RE = /(&quot;[^&]*?&quot;)|(\bT\d{4}(?:\.\d{3})?\b)|(--?[A-Za-z][\w-]*)|(\b[\w.\-]+(?:[\/\\][\w.\-@]+)+[\/\\]?)|(\b\d{1,3}(?:\[\.\]\d{1,3}){2,3}\b)|(\b(?:allowed|denied|accepted|rejected|granted|denied|quarantine|failed|success|error|warning|blocked|trusted|unblocked|Root|UNTRUSTED|SIGNATURE|PASS|FAIL)\b)/gi;
  function highlight(line) {
    var e = esc(line);
    return e.replace(SYN_RE, function (m, q, mid, flag, path, ip, kw) {
      if (q) { return '<span class="tok-s">' + q + '</span>'; }
      if (mid) { return '<span class="tok-m">' + mid + '</span>'; }
      if (flag) { return '<span class="tok-f">' + flag + '</span>'; }
      if (path) { return '<span class="tok-c">' + path + '</span>'; }
      if (ip) { return '<span class="tok-n">' + ip + '</span>'; }
      if (kw) { return '<span class="tok-k">' + kw + '</span>'; }
      return m;
    });
  }
  function optText(ex, oid) {
    var o = (ex.options || []).find(function (x) { return x.id === oid; });
    return o ? o.text : oid;
  }
  function optsHtml(ex, kind) {
    var rnd = mulberry32(exSeed(ex, 1));
    var ids = ex.options.map(function (o) { return o.id; });
    var view = shuffled(ids, rnd);
    var role = kind === 'single' ? 'radio' : 'checkbox';
    var a = S.answers[ex.id] || {};
    var sel = a.sel || [];
    return '<div class="opts" role="group" aria-label="Answer options">' + view.map(function (oid, i) {
      /* options are shuffled per attempt; correct positions vary */
      var isSel = sel.indexOf(oid) >= 0;
      return '<button type="button" class="opt" data-oid="' + esc(oid) + '" role="' + role + '" aria-checked="' + (kind === 'single' && isSel) + '" aria-pressed="' + (kind === 'multi' && isSel) + '">' +
        '<span class="opt-key">' + String.fromCharCode(65 + i) + '.</span>' +
        '<span class="opt-text">' + esc(optText(ex, oid)) + '</span>' +
        '<span class="opt-mark">' + (isSel ? '● Selected' : '') + '</span>' +
      '</button>';
    }).join('') + '</div>' +
    (kind === 'multi' ? '<p class="note">Select all options that apply. Partial credit is possible.</p>' : '');
  }
  function exerciseHtml(ex) {
    var sc = ex.scenario || {};
    var long = scenarioLong(sc);
    var paras = (sc.text || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
    var arts = (sc.artefacts || []).map(function (a, i) { return artefactHtml(a, i); }).join('');
    var body = '<div class="scen-body" id="scen-body">' + paras + arts + '</div>';
    var html = '';
    if (S.mode === 'review') {
      html += '<div class="review-banner">⚠ Skipped earlier — you are answering it now from the review screen. The timer is running.</div>';
    }
    html += '<section class="block" aria-label="Scenario">' +
      '<div class="block-h h-scenario"><span class="bico" aria-hidden="true">▤</span> SCENARIO<span class="hspacer"></span>' +
        '<button type="button" class="scen-toggle" id="btn-scen" aria-expanded="' + (!long) + '">' + (long ? 'Show scenario' : 'Hide scenario') + '</button></div>' +
      (long ? '<div class="scen-summary" id="scen-summary">' + esc(sc.summary || '') + ' — collapsed</div>' : '') +
      '<div class="block-b">' + body + '</div>' +
    '</section>';
    html += '<section class="block" aria-label="Question">' +
      '<div class="block-h h-question"><span class="bico" aria-hidden="true">❓</span> QUESTION</div>' +
      '<div class="block-b"><p class="q-text">' + esc(ex.question) + '</p></div>' +
    '</section>';
    html += '<section class="block" aria-label="Your answer">' +
      '<div class="block-h h-answer"><span class="bico" aria-hidden="true">✎</span> YOUR ANSWER</div>' +
      '<div class="block-b">' + widgetHtml(ex) + '</div>' +
    '</section>';
    html += '<div id="fb-slot"></div>';
    html += '<div class="actionbar">' +
      '<button type="button" class="btn btn-primary" id="btn-check">Check answer</button>' +
      '<button type="button" class="btn btn-primary" id="btn-next" style="display:none"></button>' +
      '<span class="note">Check stops the timer so you can read the feedback without pressure.</span>' +
    '</div>';
    return html;
  }
  function widgetHtml(ex) {
    var a = S.answers[ex.id] || (S.answers[ex.id] = {});
    var inner = '';
    if (ex.type === 'single') {
      inner = optsHtml(ex, 'single');
    } else if (ex.type === 'multi') {
      inner = optsHtml(ex, 'multi');
    } else if (ex.type === 'match') {
      var rnd = mulberry32(exSeed(ex, 2));
      var rights = shuffled(ex.pairs.map(function (p) { return p.right; }), rnd);
      inner = '<div class="matchrows">' + ex.pairs.map(function (p, i) {
        var cur = a.match ? a.match[i] : '';
        return '<div class="matchrow"><span class="match-left">' + esc(p.left) + '</span>' +
          '<select class="match-sel" data-left="' + i + '" aria-label="Match for: ' + esc(p.left) + '">' +
          '<option value="">— choose —</option>' +
          rights.map(function (r) { return '<option value="' + esc(r) + '"' + (cur === r ? ' selected' : '') + '>' + esc(r) + '</option>'; }).join('') +
          '</select></div>';
      }).join('') + '</div>';
    } else if (ex.type === 'order' || ex.type === 'prioritize') {
      if (!a.arr) {
        var idxs = ex.steps.map(function (_, i) { return i; });
        a.arr = shuffled(idxs, mulberry32(exSeed(ex, 3)));
      }
      var label = ex.type === 'prioritize' ? 'Priority' : 'Step';
      inner = '<ol class="orderlist">' + a.arr.map(function (si, pos) {
        return '<li class="orderitem" data-pos="' + pos + '">' +
          '<span class="rank">' + (pos + 1) + '</span>' +
          '<span class="order-text">' + esc(ex.steps[si]) + '</span>' +
          '<span class="order-btns">' +
            '<button type="button" data-move="up" data-pos="' + pos + '" aria-label="Move up: ' + esc(ex.steps[si]) + '">▲</button>' +
            '<button type="button" data-move="down" data-pos="' + pos + '" aria-label="Move down: ' + esc(ex.steps[si]) + '">▼</button>' +
          '</span></li>';
      }).join('') + '</ol>' +
      '<p class="note">' + label + ' 1 is the first position. Use the arrows to reorder.</p>';
    } else if (ex.type === 'blank') {
      inner = '<p class="blankline">' + ex.blanks.map(function (b, i) {
        var val = a.blanks && a.blanks[i] ? a.blanks[i] : '';
        if (b.choices) {
          return esc(b.before) + '<select class="blank-sel" data-b="' + i + '" aria-label="' + esc(b.hint || 'Blank') + '">' +
            '<option value="">— choose —</option>' +
            b.choices.map(function (c) { return '<option value="' + esc(c) + '"' + (val === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') +
            '</select>' + esc(b.after || '');
        }
        return esc(b.before) + '<input type="text" class="blank-in" data-b="' + i + '" value="' + esc(val) + '" aria-label="' + esc(b.hint || 'Blank') + '" autocomplete="off" spellcheck="false" size="' + Math.max(10, Math.min(40, (b.answer[0] || '').length + 4)) + '">' + esc(b.after || '');
      }).join('') + '</p>';
    } else if (ex.type === 'drag') {
      if (!a.placed) { a.placed = {}; }
      if (!a.bankOrder) { a.bankOrder = shuffled(ex.items.map(function (it) { return it.id; }), mulberry32(exSeed(ex, 4))); }
      var placedIds = Object.keys(a.placed);
      var bankItems = ex.items.filter(function (it) { return placedIds.indexOf(it.id) < 0; });
      var inBank = a.bankOrder.filter(function (iid) { return bankItems.some(function (it) { return it.id === iid; }); });
      inner = '<div class="dnd">' +
        '<div class="bank" id="bank" aria-label="Item bank"><span class="bank-title">Items</span>' +
          inBank.map(function (iid) {
            var it = ex.items.find(function (x) { return x.id === iid; });
            return '<button type="button" class="bankitem" draggable="true" data-iid="' + esc(iid) + '">' + esc(it.text) + '<span class="place-note">Click to select, then click a zone</span></button>';
          }).join('') +
        '</div>' +
        '<div class="zones">' + ex.zones.map(function (z) {
          var inside = ex.items.filter(function (it) { return a.placed[it.id] === z.id; });
          return '<div class="zone" data-zid="' + esc(z.id) + '" tabindex="0" role="button" aria-label="Drop zone: ' + esc(z.label) + '. Select an item, then press Enter to place it.">' +
            '<div class="zone-h">' + esc(z.label) + '</div>' +
            '<div class="zone-items">' + inside.map(function (it) {
              return '<button type="button" class="bankitem" draggable="true" data-iid="' + esc(it.id) + '" data-inzone="' + esc(z.id) + '">' + esc(it.text) + '<span class="place-note">Click to send back to the bank</span></button>';
            }).join('') + '</div></div>';
        }).join('') + '</div></div>';
    } else if (ex.type === 'terminal') {
      if (!a.scroll) {
        a.scroll = (ex.terminal.banner || []).slice();
        a.lastCmd = '';
        a.nearMiss = null;
      }
      var promptTxt = ex.terminal.prompt + ':~$';
      inner = '<div class="shell" role="group" aria-label="Simulated terminal (nothing is executed for real)">' +
        '<div class="shell-head"><span class="dot" aria-hidden="true"></span> simulated shell — offline sandbox, nothing is executed for real</div>' +
        '<div class="shell-out" id="shell-out">' + a.scroll.map(function (ln) { return '<div>' + highlight(ln) + '</div>'; }).join('') + '</div>' +
        '<div class="shell-in"><span class="prompt">' + esc(promptTxt) + '</span>' +
        '<input type="text" class="shell-cmd" id="shell-cmd" aria-label="Type a command and press Enter" autocomplete="off" autocapitalize="off" spellcheck="false"></div></div>' +
        '<div class="shell-note">Type the command and press Enter, then press <strong>Check answer</strong>. Unknown commands are rejected by the sandbox.</div>' +
        (ex.terminal.timeLimit ? '<div class="ex-timer" id="ex-timer">⏱ Exercise timer: <span class="t-clock" id="ex-timer-clock">' + fmtClock(S.exTimer && S.exTimer.exId === ex.id ? S.exTimer.remaining : ex.terminal.timeLimit) + '</span> — this limit applies to this exercise only</div>' : '');
    } else if (ex.type === 'branch') {
      var br = ex.branch;
      var st = a.bstep || 0;
      var stepsTotal = br.steps.length + 1;
      if (st < br.steps.length) {
        var step = br.steps[st];
        inner = '<span class="branch-step">STEP ' + (st + 1) + ' OF ' + stepsTotal + '</span>' +
          '<p class="q-text" style="font-size:15.5px;font-weight:600">' + esc(step.prompt) + '</p>' +
          '<div class="opts" style="margin-top:10px">' + step.options.map(function (o, i) {
            var isSel = a.bsel === o.id;
            return '<button type="button" class="opt" data-boid="' + esc(o.id) + '" role="radio" aria-checked="' + isSel + '">' +
              '<span class="opt-key">' + String.fromCharCode(65 + i) + '.</span><span class="opt-text">' + esc(o.text) + '</span>' +
              '<span class="opt-mark">' + (isSel ? '● Selected' : '') + '</span></button>';
          }).join('') + '</div>' +
          '<div class="branch-confirm"><button type="button" class="btn" id="btn-bconfirm" disabled>Confirm step</button></div>' +
          (a.outcomes && a.outcomes.length ? a.outcomes.map(function (o) { return '<div class="branch-outcome">' + esc(o) + '</div>'; }).join('') : '');
      } else {
        var f = br.final;
        var multi = f.correct.length > 1;
        var fsel = a.fsel || [];
        inner = '<span class="branch-step">FINAL STEP</span>' +
          '<p class="q-text" style="font-size:15.5px;font-weight:600">' + esc(f.question) + '</p>' +
          '<div class="opts" style="margin-top:10px">' + f.options.map(function (o, i) {
            var isSel = fsel.indexOf(o.id) >= 0;
            return '<button type="button" class="opt" data-foid="' + esc(o.id) + '" role="' + (multi ? 'checkbox' : 'radio') + '" aria-checked="' + (!multi && isSel) + '" aria-pressed="' + (multi && isSel) + '">' +
              '<span class="opt-key">' + String.fromCharCode(65 + i) + '.</span><span class="opt-text">' + esc(o.text) + '</span>' +
              '<span class="opt-mark">' + (isSel ? '● Selected' : '') + '</span></button>';
          }).join('') + '</div>' +
          (multi ? '<p class="note">Select all options that apply.</p>' : '') +
          (a.outcomes && a.outcomes.length ? a.outcomes.map(function (o) { return '<div class="branch-outcome">' + esc(o) + '</div>'; }).join('') : '');
      }
    }
    if (S.hintUsed[ex.id]) {
      inner += '<div class="hint-panel" role="note"><div class="hp-h">? Hint — 10% of this exercise credit will be deducted</div>' + esc(ex.hint) + '</div>';
    }
    return '<fieldset class="widget-fs" id="widget-fs">' + inner + '</fieldset>';
  }
  function renderExam() {
    var ex = currentEx();
    if (!ex) { return; }
    S.checkedId = null;
    S.exTimer = null;
    if (ex.terminal && ex.terminal.timeLimit && !S.results[ex.id]) {
      S.exTimer = { exId: ex.id, remaining: ex.terminal.timeLimit };
    }
    var app = $('app');
    app.innerHTML = headerHtml() + '<main class="stage" id="stage">' + exerciseHtml(ex) + '</main>';
    bindExercise(ex);
    updateHeader();
    renderTimerPill();
    var q = document.querySelector('.q-text');
    if (q) { q.setAttribute('tabindex', '-1'); q.focus({ preventScroll: true }); }
    if (ex.type === 'terminal' && !S.results[ex.id]) {
      var inp = $('shell-cmd');
      if (inp) { inp.focus({ preventScroll: true }); }
    }
  }

  /* ============================ widget binding ============================ */
  function bindExercise(ex) {
    var toggle = $('btn-scen');
    if (toggle) {
      toggle.addEventListener('click', function () {
        var body = $('scen-body');
        var collapsed = body.classList.toggle('collapsed');
        toggle.setAttribute('aria-expanded', String(!collapsed));
        toggle.textContent = collapsed ? 'Show scenario' : 'Hide scenario';
        var sum = $('scen-summary');
        if (sum) { sum.style.display = collapsed ? '' : 'none'; }
      });
      if (scenarioLong(ex.scenario || {})) {
        var body = $('scen-body');
        body.classList.add('collapsed');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.textContent = 'Show scenario';
      }
    }
    Array.prototype.forEach.call(document.querySelectorAll('.logfilter'), function (inp) {
      inp.addEventListener('input', function () {
        var q = inp.value.toLowerCase();
        var body = document.querySelector('[data-logbody="' + inp.getAttribute('data-filter') + '"]');
        if (!body) { return; }
        Array.prototype.forEach.call(body.querySelectorAll('.ln'), function (ln) {
          ln.classList.toggle('off', q !== '' && ln.textContent.toLowerCase().indexOf(q) < 0);
        });
      });
    });
    var fs = $('widget-fs');
    var a = S.answers[ex.id];
    if (ex.type === 'single' || ex.type === 'multi') {
      Array.prototype.forEach.call(fs.querySelectorAll('.opt'), function (btn) {
        btn.addEventListener('click', function () {
          if (S.results[ex.id]) { return; }
          var oid = btn.getAttribute('data-oid');
          if (ex.type === 'single') {
            a.sel = oid;
            Array.prototype.forEach.call(fs.querySelectorAll('.opt'), function (b2) {
              b2.setAttribute('aria-checked', String(b2 === btn));
              b2.querySelector('.opt-mark').textContent = b2 === btn ? '● Selected' : '';
            });
          } else {
            var sel = a.sel || (a.sel = []);
            var i = sel.indexOf(oid);
            if (i >= 0) { sel.splice(i, 1); } else { sel.push(oid); }
            btn.setAttribute('aria-pressed', String(i < 0));
            btn.querySelector('.opt-mark').textContent = i < 0 ? '● Selected' : '';
          }
        });
      });
    } else if (ex.type === 'match') {
      Array.prototype.forEach.call(fs.querySelectorAll('.match-sel'), function (selEl) {
        selEl.addEventListener('change', function () {
          if (S.results[ex.id]) { return; }
          a.match = a.match || {};
          a.match[selEl.getAttribute('data-left')] = selEl.value;
        });
      });
    } else if (ex.type === 'order' || ex.type === 'prioritize') {
      Array.prototype.forEach.call(fs.querySelectorAll('[data-move]'), function (btn) {
        btn.addEventListener('click', function () {
          if (S.results[ex.id]) { return; }
          var pos = parseInt(btn.getAttribute('data-pos'), 10);
          var dir = btn.getAttribute('data-move') === 'up' ? -1 : 1;
          var j = pos + dir;
          if (j < 0 || j >= a.arr.length) { return; }
          var tmp = a.arr[pos]; a.arr[pos] = a.arr[j]; a.arr[j] = tmp;
          refreshWidget(ex);
        });
      });
    } else if (ex.type === 'blank') {
      Array.prototype.forEach.call(fs.querySelectorAll('.blank-in'), function (inp) {
        inp.addEventListener('input', function () {
          a.blanks = a.blanks || {};
          a.blanks[inp.getAttribute('data-b')] = inp.value;
        });
      });
      Array.prototype.forEach.call(fs.querySelectorAll('.blank-sel'), function (selEl) {
        selEl.addEventListener('change', function () {
          a.blanks = a.blanks || {};
          a.blanks[selEl.getAttribute('data-b')] = selEl.value;
        });
      });
    } else if (ex.type === 'drag') {
      var selectedId = null;
      function paintSelection() {
        Array.prototype.forEach.call(fs.querySelectorAll('.bankitem'), function (b) {
          b.classList.toggle('sel', b.getAttribute('data-iid') === selectedId);
        });
      }
      Array.prototype.forEach.call(fs.querySelectorAll('.bankitem'), function (b) {
        b.addEventListener('click', function () {
          if (S.results[ex.id]) { return; }
          var iid = b.getAttribute('data-iid');
          if (b.getAttribute('data-inzone')) {
            /* If an item is currently selected, this click bubbles to the zone and places
               the selected item. Only return the placed item to the bank when nothing is selected. */
            if (!selectedId) {
              delete a.placed[iid];
              selectedId = null;
              refreshWidget(ex);
            }
            return;
          }
          selectedId = (selectedId === iid) ? null : iid;
          paintSelection();
        });
        b.addEventListener('dragstart', function (ev) {
          ev.dataTransfer.setData('text/plain', b.getAttribute('data-iid'));
        });
      });
      Array.prototype.forEach.call(fs.querySelectorAll('.zone'), function (z) {
        var zid = z.getAttribute('data-zid');
        z.addEventListener('click', function () {
          if (S.results[ex.id] || !selectedId) { return; }
          a.placed[selectedId] = zid;
          selectedId = null;
          refreshWidget(ex);
        });
        z.addEventListener('keydown', function (ev) {
          if ((ev.key === 'Enter' || ev.key === ' ') && selectedId && !S.results[ex.id]) {
            ev.preventDefault();
            a.placed[selectedId] = zid;
            selectedId = null;
            refreshWidget(ex);
          }
        });
        z.addEventListener('dragover', function (ev) { ev.preventDefault(); z.classList.add('over'); });
        z.addEventListener('dragleave', function () { z.classList.remove('over'); });
        z.addEventListener('drop', function (ev) {
          ev.preventDefault();
          z.classList.remove('over');
          if (S.results[ex.id]) { return; }
          var iid = ev.dataTransfer.getData('text/plain');
          if (iid) { a.placed[iid] = zid; refreshWidget(ex); }
        });
      });
    } else if (ex.type === 'terminal') {
      var input = $('shell-cmd');
      input.addEventListener('keydown', function (ev) {
        if (ev.key !== 'Enter') { return; }
        var cmd = input.value;
        input.value = '';
        if (!cmd.trim()) { return; }
        runShell(ex, a, cmd);
      });
    } else if (ex.type === 'branch') {
      var br = ex.branch;
      var st = a.bstep || 0;
      if (st < br.steps.length) {
        Array.prototype.forEach.call(fs.querySelectorAll('[data-boid]'), function (btn) {
          btn.addEventListener('click', function () {
            if (S.results[ex.id]) { return; }
            a.bsel = btn.getAttribute('data-boid');
            Array.prototype.forEach.call(fs.querySelectorAll('[data-boid]'), function (b2) {
              var on = b2 === btn;
              b2.setAttribute('aria-checked', String(on));
              b2.querySelector('.opt-mark').textContent = on ? '● Selected' : '';
            });
            $('btn-bconfirm').disabled = false;
          });
        });
        $('btn-bconfirm').addEventListener('click', function () {
          if (S.results[ex.id] || !a.bsel) { return; }
          var step = br.steps[a.bstep || 0];
          a.outcomes = a.outcomes || [];
          a.outcomes.push('You chose: “' + optStepText(step, a.bsel) + '”. ' + step.outcome);
          a.bstep = (a.bstep || 0) + 1;
          a.bsel = null;
          refreshWidget(ex);
        });
      } else {
        var f = br.final;
        var multi = f.correct.length > 1;
        Array.prototype.forEach.call(fs.querySelectorAll('[data-foid]'), function (btn) {
          btn.addEventListener('click', function () {
            if (S.results[ex.id]) { return; }
            var oid = btn.getAttribute('data-foid');
            if (multi) {
              a.fsel = a.fsel || [];
              var i = a.fsel.indexOf(oid);
              if (i >= 0) { a.fsel.splice(i, 1); } else { a.fsel.push(oid); }
              btn.setAttribute('aria-pressed', String(i < 0));
              btn.querySelector('.opt-mark').textContent = i < 0 ? '● Selected' : '';
            } else {
              a.fsel = [oid];
              Array.prototype.forEach.call(fs.querySelectorAll('[data-foid]'), function (b2) {
                var on = b2 === btn;
                b2.setAttribute('aria-checked', String(on));
                b2.querySelector('.opt-mark').textContent = on ? '● Selected' : '';
              });
            }
          });
        });
      }
    }
    $('btn-check').addEventListener('click', function () { doCheck(false); });
    var nextBtn = $('btn-next');
    if (nextBtn) { nextBtn.addEventListener('click', onNext); }
    $('btn-hint').addEventListener('click', onHint);
    $('btn-skip').addEventListener('click', onSkip);
    $('btn-pause').addEventListener('click', onPauseToggle);
  }
  function optStepText(step, oid) {
    var o = step.options.find(function (x) { return x.id === oid; });
    return o ? o.text : oid;
  }
  function refreshWidget(ex) {
    var fs = $('widget-fs');
    var tmp = document.createElement('div');
    tmp.innerHTML = widgetHtml(ex);
    fs.innerHTML = tmp.firstElementChild.innerHTML;
    bindExercise(ex);
    updateHeader();
  }

  /* ============================ shell ============================ */
  function runShell(ex, a, cmd) {
    a.scroll.push('$ ' + cmd);
    var norm = cmd.trim().replace(/\s+/g, ' ');
    a.lastCmd = norm;
    a.nearMiss = null;
    var t = ex.terminal;
    var out = $('shell-out');
    function print(line, cls) {
      a.scroll.push(line);
      var d = document.createElement('div');
      if (cls) { d.className = cls; }
      d.textContent = line;
      out.appendChild(d);
      out.scrollTop = out.scrollHeight;
    }
    for (var i = 0; i < (t.nearMiss || []).length; i++) {
      if (new RegExp(t.nearMiss[i].re).test(norm)) {
        a.nearMiss = t.nearMiss[i].msg;
        print('⚠ DANGEROUS — NEAR MISS: ' + t.nearMiss[i].msg, 'shell-warn');
        return;
      }
    }
    for (var j = 0; j < (t.outputs || []).length; j++) {
      if (new RegExp(t.outputs[j].re).test(norm)) {
        (t.outputs[j].lines || []).forEach(function (ln) { print(ln, 'shell-ok'); });
        return;
      }
    }
    var first = norm.split(' ')[0];
    print('command not found: ' + first, 'shell-err');
  }

  /* ============================ grading ============================ */
  function it(state, word, text) { return { state: state, word: word, text: text }; }
  function grade(ex) {
    var a = S.answers[ex.id] || {};
    var res = { credit: 0, H: 0, W: 0, N: 1, items: [], nearMiss: false };
    var t = ex.type, i;
    if (t === 'single') {
      res.N = 1;
      var sel = a.sel || null;
      var ok = sel === ex.correct[0];
      res.H = ok ? 1 : 0;
      res.W = (sel && !ok) ? 1 : 0;
      res.items.push(it(ok ? 'ok' : (sel ? 'bad' : 'miss'), ok ? '✓ Correct' : (sel ? '✗ Wrong' : '○ Missed'), 'Correct answer: ' + optText(ex, ex.correct[0])));
      if (sel && !ok) { res.items.unshift(it('bad', '✗ Wrong', 'Your answer: ' + optText(ex, sel))); }
    } else if (t === 'multi') {
      res.N = ex.correct.length;
      var ms = a.sel || [];
      ex.correct.forEach(function (oid) {
        if (ms.indexOf(oid) >= 0) { res.H += 1; res.items.push(it('ok', '✓ Correct', optText(ex, oid))); }
        else { res.items.push(it('miss', '○ Missed', optText(ex, oid))); }
      });
      ms.forEach(function (oid) {
        if (ex.correct.indexOf(oid) < 0) { res.W += 1; res.items.push(it('bad', '✗ Wrong', optText(ex, oid))); }
      });
    } else if (t === 'match') {
      res.N = ex.pairs.length;
      ex.pairs.forEach(function (p, idx) {
        var v = a.match ? a.match[idx] : '';
        if (!v) { res.items.push(it('miss', '○ Missed', p.left + ' → ' + p.right)); }
        else if (v === p.right) { res.H += 1; res.items.push(it('ok', '✓ Correct', p.left + ' → ' + p.right)); }
        else { res.W += 1; res.items.push(it('bad', '✗ Wrong', p.left + ' — you chose “' + v + '”, expected “' + p.right + '”')); }
      });
    } else if (t === 'order' || t === 'prioritize') {
      res.N = ex.steps.length;
      (a.arr || []).forEach(function (si, pos) {
        if (si === pos) { res.H += 1; res.items.push(it('ok', '✓ Correct', 'Position ' + (pos + 1) + ': ' + ex.steps[pos])); }
        else { res.W += 1; res.items.push(it('bad', '✗ Wrong', 'Position ' + (pos + 1) + ' — you placed “' + ex.steps[si] + '”, expected “' + ex.steps[pos] + '”')); }
      });
    } else if (t === 'blank') {
      res.N = ex.blanks.length;
      ex.blanks.forEach(function (b, idx) {
        var v = (a.blanks && a.blanks[idx] ? a.blanks[idx] : '').trim();
        var okv = v !== '' && b.answer.some(function (acc) { return acc.toLowerCase() === v.toLowerCase(); });
        if (v === '') { res.items.push(it('miss', '○ Missed', 'Blank ' + (idx + 1) + ' — expected: ' + b.answer[0])); }
        else if (okv) { res.H += 1; res.items.push(it('ok', '✓ Correct', 'Blank ' + (idx + 1) + ': ' + v)); }
        else { res.W += 1; res.items.push(it('bad', '✗ Wrong', 'Blank ' + (idx + 1) + ' — you typed “' + v + '”, expected: ' + b.answer.join(' or '))); }
      });
    } else if (t === 'drag') {
      res.N = ex.items.length;
      ex.items.forEach(function (x) {
        var zid = a.placed ? a.placed[x.id] : null;
        if (!zid) {
          res.items.push(it('miss', '○ Missed', 'Not placed: ' + x.text));
          return;
        }
        var z = ex.zones.find(function (zz) { return zz.id === zid; });
        if (z && z.accepts.indexOf(x.id) >= 0) {
          res.H += 1;
          res.items.push(it('ok', '✓ Correct', z.label + ': ' + x.text));
        } else {
          res.W += 1;
          var zok = ex.zones.find(function (zz) { return zz.accepts.indexOf(x.id) >= 0; });
          res.items.push(it('bad', '✗ Wrong', '“' + x.text + '” placed in ' + (z ? z.label : 'unknown zone') + '; belongs in: ' + (zok ? zok.label : '?')));
        }
      });
      ex.zones.forEach(function (z) {
        var anyInside = ex.items.some(function (x) { return a.placed && a.placed[x.id] === z.id; });
        if (!anyInside) { res.items.push(it('miss', '○ Missed', z.label + ' left empty — expected: ' + zoneExpected(ex, z))); }
      });
    } else if (t === 'terminal') {
      var tt = ex.terminal;
      var cmd = a.lastCmd || '';
      if (a.nearMiss) { res.nearMiss = true; }
      res.N = tt.elements.length;
      tt.elements.forEach(function (el) {
        if (!cmd) { res.items.push(it('miss', '○ Missed', el.label)); }
        else if (new RegExp(el.re).test(cmd)) { res.H += 1; res.items.push(it('ok', '✓ Correct', el.label)); }
        else { res.W += 1; res.items.push(it('bad', '✗ Wrong', el.label)); }
      });
      if (res.nearMiss) { res.H = 0; res.W = res.N; }
    } else if (t === 'branch') {
      var f = ex.branch.final;
      var multi = f.correct.length > 1;
      if (multi) {
        res.N = f.correct.length;
        var fs2 = a.fsel || [];
        f.correct.forEach(function (oid) {
          if (fs2.indexOf(oid) >= 0) { res.H += 1; res.items.push(it('ok', '✓ Correct', optFinal(ex, oid))); }
          else { res.items.push(it('miss', '○ Missed', optFinal(ex, oid))); }
        });
        fs2.forEach(function (oid) {
          if (f.correct.indexOf(oid) < 0) { res.W += 1; res.items.push(it('bad', '✗ Wrong', optFinal(ex, oid))); }
        });
      } else {
        res.N = 1;
        var fsel = (a.fsel && a.fsel[0]) || null;
        var fok = fsel === f.correct[0];
        res.H = fok ? 1 : 0;
        res.W = (fsel && !fok) ? 1 : 0;
        res.items.push(it(fok ? 'ok' : (fsel ? 'bad' : 'miss'), fok ? '✓ Correct' : (fsel ? '✗ Wrong' : '○ Missed'), 'Correct final decision: ' + optFinal(ex, f.correct[0])));
        if (fsel && !fok) { res.items.unshift(it('bad', '✗ Wrong', 'Your decision: ' + optFinal(ex, fsel))); }
      }
    }
    res.credit = Math.max(0, (res.H - res.W) / res.N);
    if (res.credit > 0 && S.hintUsed[ex.id]) {
      res.credit = Math.max(0, res.credit - 0.10);
    }
    return res;
  }
  function zoneExpected(ex, z) {
    var names = z.accepts.map(function (iid) {
      var it2 = ex.items.find(function (x) { return x.id === iid; });
      return it2 ? it2.text : iid;
    });
    return names.join(', ');
  }
  function optFinal(ex, oid) {
    var o = ex.branch.final.options.find(function (x) { return x.id === oid; });
    return o ? o.text : oid;
  }

  /* ============================ check / next / skip / hint / pause ============================ */
  function doCheck(auto) {
    if (S.state !== 'RUNNING') { return; }
    var ex = currentEx();
    if (!ex || S.results[ex.id]) { return; }
    setState('PAUSED_AUTO_CHECK');
    var res = grade(ex);
    S.results[ex.id] = res;
    S.creditSum += res.credit;
    S.answeredCount += 1;
    var sk = S.skipped.indexOf(ex.id);
    if (sk >= 0) { S.skipped.splice(sk, 1); }
    renderFeedback(ex, res, auto);
    S.checkedId = ex.id;
    var fs = $('widget-fs');
    if (fs) { fs.disabled = true; }
    var check = $('btn-check');
    if (check) { check.style.display = 'none'; }
    var next = $('btn-next');
    if (next) {
      var isLastMain = S.mode === 'main' && !nextMainIndex();
      next.style.display = '';
      next.textContent = S.mode === 'review' ? 'Back to review' : (isLastMain ? 'Final Submit' : 'Next exercise');
    }
    updateHeader();
    var fb = document.querySelector('.fb');
    if (fb) { fb.setAttribute('tabindex', '-1'); fb.focus({ preventScroll: true }); }
  }
  function nextMainIndex() {
    for (var i = S.pos + 1; i < S.order.length; i++) {
      var ex2 = EXS[S.order[i]];
      if (!S.results[ex2.id] && S.skipped.indexOf(ex2.id) < 0) { return i; }
    }
    return null;
  }
  function renderFeedback(ex, res, auto) {
    var slot = $('fb-slot');
    var cls = res.credit >= 1 ? 'fb-ok' : (res.credit > 0 ? 'fb-part' : 'fb-bad');
    var icon = res.credit >= 1 ? '✓' : (res.credit > 0 ? '✓' : '✗');
    var label;
    if (res.nearMiss) {
      cls = 'fb-bad'; icon = '✗';
      label = 'DANGEROUS — NEAR MISS';
    } else if (res.credit >= 1) { label = 'CORRECT'; }
    else if (res.credit > 0) { label = 'PARTIALLY CORRECT'; }
    else { label = 'INCORRECT'; }
    var creditLine = 'credit ' + fmt2(res.credit);
    if (res.N > 1) {
      creditLine += ' — ' + res.H + '/' + res.N + ' items · formula (H − W) / N = (' + res.H + ' − ' + res.W + ') / ' + res.N;
    }
    if (S.hintUsed[ex.id]) {
      creditLine += ' · includes −0.10 hint penalty';
    }
    var rows = res.items.map(function (x) {
      return '<li><span class="st st-' + x.state + '">' + x.word + '</span><span>' + esc(x.text) + '</span></li>';
    }).join('');
    var missedNames = res.items.filter(function (x) { return x.state === 'miss'; }).map(function (x) { return x.text; });
    var wrongNames = res.items.filter(function (x) { return x.state === 'bad'; }).map(function (x) { return x.text; });
    var extra = '';
    if (missedNames.length) {
      extra += '<p><strong style="color:var(--state-partial)">○ Missed items:</strong> ' + esc(missedNames.join(' · ')) + '</p>';
    }
    if (wrongNames.length) {
      extra += '<p><strong style="color:var(--state-incorrect)">✗ Wrong items:</strong> ' + esc(wrongNames.join(' · ')) + '</p>';
    }
    var explainHtml = (ex.explain || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
    var canon = '';
    if (ex.type === 'terminal') {
      var lastCmd = (S.answers[ex.id] && S.answers[ex.id].lastCmd) || '';
      canon = '<div class="codeblock"><div class="cb-label"><span>Canonical command</span>' +
        '<button type="button" class="cb-copy" id="btn-copy">Copy</button></div>' +
        '<pre class="mono">' + esc(ex.terminal.solution) + '</pre></div>' +
        '<div class="cb-legend">' + ex.terminal.elements.map(function (el) {
          var got = lastCmd !== '' && new RegExp(el.re).test(lastCmd);
          return '<span>' + (got ? '<span class="st-ok">✓</span>' : '<span class="st-bad">✗</span>') + ' ' + esc(el.label) + '</span>';
        }).join('') + '</div>';
    }
    slot.innerHTML = '<section class="fb ' + cls + '" role="status" aria-live="polite">' +
      '<div class="fb-h"><span aria-hidden="true">' + icon + '</span> ' + label +
      '<span class="fb-credit">' + esc(creditLine) + (auto ? ' · auto-submitted (exercise timer expired)' : '') + '</span></div>' +
      '<ul class="fb-items">' + rows + '</ul>' +
      '<div class="fb-explain">' + extra + canon + explainHtml + '</div>' +
      '</section>';
    var copyBtn = $('btn-copy');
    if (copyBtn) {
      copyBtn.addEventListener('click', function () {
        var text = ex.terminal.solution;
        var done = function () { copyBtn.textContent = 'Copied'; };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, function () { copyBtn.textContent = 'Select and copy'; });
          } else { copyBtn.textContent = 'Select and copy'; }
        } catch (e) { copyBtn.textContent = 'Select and copy'; }
      });
    }
  }
  function onNext() {
    if (S.state === 'ENDED') { return; }
    if (S.mode === 'review') {
      setState('RUNNING');
      showReview();
      return;
    }
    var nxt = nextMainIndex();
    if (nxt !== null) {
      S.pos = nxt;
      setState('RUNNING');
      renderExam();
    } else if (S.skipped.length > 0 && S.remaining > 0) {
      setState('RUNNING');
      showReview();
    } else {
      showResults();
    }
  }
  function onSkip() {
    if (S.state !== 'RUNNING') { return; }
    var ex = currentEx();
    if (!ex || S.results[ex.id]) { return; }
    if (S.skipped.indexOf(ex.id) < 0) { S.skipped.push(ex.id); }
    if (S.mode === 'review') {
      setState('RUNNING');
      showReview();
      return;
    }
    var nxt = nextMainIndex();
    if (nxt !== null) {
      S.pos = nxt;
      renderExam();
    } else if (S.skipped.length > 0 && S.remaining > 0) {
      showReview();
    } else {
      showResults();
    }
  }
  function onHint() {
    if (S.state !== 'RUNNING') { return; }
    var ex = currentEx();
    if (!ex || S.results[ex.id] || S.hintUsed[ex.id]) { return; }
    S.hintUsed[ex.id] = true;
    var fs = $('widget-fs');
    var panel = document.createElement('div');
    panel.className = 'hint-panel';
    panel.setAttribute('role', 'note');
    panel.innerHTML = '<div class="hp-h">? Hint — 10% of this exercise credit will be deducted</div>' + esc(ex.hint);
    fs.appendChild(panel);
    var hb = $('btn-hint');
    if (hb) { hb.disabled = true; }
  }
  function onPauseToggle() {
    if (S.state === 'RUNNING') {
      S.resumeState = 'RUNNING';
      setState('PAUSED_MANUAL');
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      S.resumeState = 'PAUSED_AUTO_CHECK';
      setState('PAUSED_MANUAL');
    } else if (S.state === 'PAUSED_MANUAL') {
      setState(S.resumeState || 'RUNNING');
    }
  }
  function renderPauseOverlay() {
    var old = $('paused-ovl');
    if (old) { old.remove(); }
    if (S.state !== 'PAUSED_MANUAL') { return; }
    var ovl = document.createElement('div');
    ovl.className = 'paused-overlay';
    ovl.id = 'paused-ovl';
    ovl.innerHTML = '<div class="paused-card" role="alertdialog" aria-label="Exam manually paused">' +
      '<div class="pico" aria-hidden="true">⏸</div>' +
      '<h2>⏸ PAUSED — manual</h2>' +
      '<p>The exercise is hidden and the timer is stopped. Press Resume when you are ready to continue.</p>' +
      '<button type="button" class="btn btn-primary" id="btn-resume2">▶ Resume</button></div>';
    document.body.appendChild(ovl);
    $('btn-resume2').addEventListener('click', onPauseToggle);
  }

  /* ============================ review screen ============================ */
  function showReview() {
    S.screen = 'review';
    S.mode = 'review';
    S.reviewList = S.skipped.slice();
    var app = $('app');
    var rows = S.reviewList.map(function (exId) {
      var ex = byId[exId];
      var n = S.order.indexOf(EXS.indexOf(ex)) + 1;
      return '<li><span class="st-skip">⚠ Skipped</span>' +
        '<span class="rv-title">Exercise ' + n + ' of ' + TOTAL + ' — ' + esc(ex.scenario && ex.scenario.summary ? ex.scenario.summary : ex.question) + '</span>' +
        '<button type="button" class="btn" data-answer="' + esc(exId) + '">Answer</button></li>';
    }).join('');
    app.innerHTML = headerHtml() +
      '<main class="stage" id="stage"><section class="block">' +
      '<div class="block-h h-skip"><span class="bico" aria-hidden="true">⚠</span> Review skipped exercises</div>' +
      '<div class="block-b">' +
      '<p>You skipped ' + S.reviewList.length + ' exercise' + (S.reviewList.length === 1 ? '' : 's') + '. You can answer them now, as many times as you need, until the timer ends. Skipped exercises you never answer are excluded from the score.</p>' +
      '<ul class="review-list">' + rows + '</ul>' +
      '<div class="actionbar"><button type="button" class="btn btn-primary" id="btn-finish">Submit exam</button>' +
      '<span class="note">Submitting now leaves the remaining skipped exercises out of the score.</span></div>' +
      '</div></section></main>';
    Array.prototype.forEach.call(document.querySelectorAll('[data-answer]'), function (btn) {
      btn.addEventListener('click', function () {
        var exId = btn.getAttribute('data-answer');
        S.pos = S.order.indexOf(EXS.indexOf(byId[exId]));
        S.screen = 'exam';
        renderExam();
      });
    });
    $('btn-finish').addEventListener('click', function () { showResults(); });
    updateHeader();
    renderTimerPill();
  }

  /* ============================ results ============================ */
  function endByTimeout() {
    setState('ENDED');
    showResults();
  }
  function showResults() {
    S.screen = 'results';
    S.mode = 'main';
    var fully = 0, partial = 0, wrong = 0;
    var partialSum = 0;
    Object.keys(S.results).forEach(function (k) {
      var c = S.results[k].credit;
      if (c >= 1) { fully += 1; }
      else if (c > 0) { partial += 1; partialSum += c; }
      else { wrong += 1; }
    });
    var skippedLeft = S.skipped.length;
    var pct = fmtPct(S.creditSum, S.answeredCount);
    var passed = pct >= PASSMARK;
    setState('ENDED');
    var app = $('app');
    var cls = SEVCLS[DATA.severity] || 'sev-easy';
