<script>
/* Cyber Pulse Academy exercise engine — MITRE ATT&CK T1659 Content Injection
   Shared vanilla-JS engine for all four difficulty files. No external requests. */
window.ExamEngine=(function(){
'use strict';
/* ---------------- helpers ---------------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function $(s,r){return (r||document).querySelector(s);}
function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function shuffle(arr){var a=arr.slice(),i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(sec){sec=Math.max(0,Math.floor(sec));var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function words(s){return String(s||'').replace(/<[^>]+>/g,' ').trim().split(/\s+/).filter(function(x){return x;}).length;}
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim();}
/* ---------------- syntax highlight ---------------- */
var KW=['DNS','HTTP','HTTPS','SMB','FTP','GET','POST','PUT','200','302','404','Content-Type','Content-Length','text/html','application/octet-stream','curl','wget','tcpdump','wscript','cscript','Safari','chrome','firefox','msedge','browser','Exec','exec','payload','update','pcap','AN0992','AN0993','AN0994','DET0349','T1659','T1557','T1189','T1105','M1041','M1021','TA0001','TA0011','Windows','Linux','macOS','GET','vsftpd','wupdate','winupdate','Vary','Server','nginx','apache','IDs','TTL','time','date','GET','http'];
var HL_RE=null;
function buildHL(){
  var seen={},ks=[];
  KW.forEach(function(k){if(!seen[k]){seen[k]=1;ks.push(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));}});
  HL_RE=new RegExp('(&quot;[^&]*&quot;|\'[^\']*\')|(\\b\\d[\\d.]*\\b)|(\\b(?:'+ks.join('|')+')\\b)','g');
}
function hl(line){
  var s=esc(line);
  return s.replace(HL_RE,function(m,str,num,kw){
    if(str)return '<span class="hl-s">'+str+'</span>';
    if(num)return '<span class="hl-n">'+num+'</span>';
    return '<span class="hl-k">'+kw+'</span>';
  });
}
/* ---------------- scoring (partial credit contract) ---------------- */
function scoreExercise(sel,correct){
  var N=correct.length,H=0,W=0,i;
  for(i=0;i<sel.length;i++){if(correct.indexOf(sel[i])>=0)H++;else W++;}
  return Math.max(0,(H-W)/N);
}
/* ---------------- timer state machine ---------------- */
var TS={R:'RUNNING',PM:'PAUSED_MANUAL',PA:'PAUSED_AUTO_CHECK',EN:'ENDED'};
var E={d:null,phase:'intro',inst:[],idx:0,skipped:[],hint:{},report:false,username:'',prev:null,deadLeft:null,timeoutHit:false};
function tState(){return E.timer.state;}
function setTS(st){
  E.timer.state=st;
  var c=$('#hTimer');if(!c)return;
  c.classList.remove('st-run','st-pm','st-pa','st-en');
  var txt='',icon='';
  if(st===TS.R){c.classList.add('st-run');icon='&#9654;';txt='RUNNING';}
  else if(st===TS.PM){c.classList.add('st-pm');icon='&#9208;';txt='PAUSED &mdash; manual (press Resume)';}
  else if(st===TS.PA){c.classList.add('st-pa');icon='&#9208;';txt='PAUSED &mdash; reviewing feedback (resumes on Next)';}
  else{c.classList.add('st-en');icon='&#9635;';txt='ENDED';}
  c.innerHTML='<span class="tdot">'+icon+'</span>&nbsp;'+fmt(E.timer.remaining)+' &middot; '+txt;
}
function tick(){
  if(!E||!E.timer)return;
  if(tState()!==TS.R)return;
  if(E.phase!=='exam'&&E.phase!=='review')return;
  E.timer.remaining--;
  var inst=E.inst[E.idx];
  if(E.phase==='exam'&&E.deadLeft!=null&&inst&&inst.deadline&&!inst.checked){
    E.deadLeft--;
    var d=$('#deadChip');
    if(d)d.innerHTML='&#9201; Exercise timer: <span id="deadVal">'+fmt(E.deadLeft)+'</span> &mdash; stops on Check';
    if(E.deadLeft<=0){autoCheck();}
  }
  if(E.timer.remaining<=0){E.timer.remaining=0;setTS(TS.EN);timeUp();return;}
  setTS(tState());
}
function timeUp(){
  E.timeoutHit=true;
  if(E.phase==='exam'||E.phase==='review'){renderResults(true);}
}
/* ---------------- header ---------------- */
function buildHeader(){
  var h=$('#hdr');
  h.innerHTML='<div class="hdr-in">'+
    '<div class="hdr-brand">'+esc(E.d.brand)+'</div>'+
    '<div class="hdr-chip" id="hCounter">Intro</div>'+

/* ---------------- exam flow ---------------- */
function startExam(){
  buildInstances();
  E.report=false;
  E.phase='exam';E.idx=0;E.deadLeft=null;
  setTS(TS.R);
  renderExercise();
}
function buildInstances(){
  E.inst=[];E.skipped=[];E.hint={};E.deadLeft=null;E.timeoutHit=false;
  var order=shuffle(E.d.exercises);
  order.forEach(function(ex){
    var inst={ex:ex,type:ex.type,raw:null,checked:false,credit:0,fromReview:false,deadline:ex.deadlineSec||null,checkedWithHint:false};
    prepare(inst);
    E.inst.push(inst);
  });
}
function prepare(inst){
  var ex=inst.ex;
  if(ex.type==='choice'||ex.type==='multi'){
    inst.opts=shuffle(ex.options.map(function(o){return {id:o.id,text:o.text};}));
  }else if(ex.type==='order'){
    inst.disp=shuffle(ex.items.map(function(i){return i.id;}));
  }else if(ex.type==='match'){
    inst.lefts=shuffle(ex.pairs.map(function(p,i){return {id:'L'+i,text:p.l};}));
    inst.rights=shuffle(ex.pairs.map(function(p,i){return {id:'R'+i,text:p.r};}));
    inst.pairMap={};inst.selL=null;
  }else if(ex.type==='drag'){
    inst.bank=shuffle(ex.bank.map(function(b,i){return {id:'B'+i,text:b.text,ok:b.ok,slot:b.slot};}));
    inst.place={};inst.selChip=null;
  }else if(ex.type==='fill'){
    inst.bankOpts=shuffle(ex.bank.slice());
  }else if(ex.type==='branch'){
    inst.stepRaws=[];
    inst.stepOpts=ex.steps.map(function(s){return shuffle(s.options.map(function(o){return {id:o.id,text:o.text};}));});
    inst.cur=0;
  }
}
function curInst(){return E.inst[E.idx];}

function bindLogViewer(root,lg){

/* choice + multi */
function wChoice(inst,box,multi){
  var ex=inst.ex;inst.raw=multi?[]:null;

/* ordering */
function wOrder(inst,box){
  var ex=inst.ex,list=el('ul','ordlist');
  function rowFor(id,idx){
    var item=null;ex.items.forEach(function(it){if(it.id===id)item=it;});
    var li=el('li','ordrow');
    li.innerHTML='<span class="oh" data-h aria-label="Drag handle">&#8801;</span><span class="ordnum">'+(idx+1)+'.</span><span class="ox">'+esc(item.text)+'</span>';
    var up=el('button','oup','&uarr;');up.type='button';up.setAttribute('aria-label','Move up');
    var dn=el('button','odn','&darr;');dn.type='button';dn.setAttribute('aria-label','Move down');
    up.addEventListener('click',function(){if(inst.checked)return;move(id,-1);});
    dn.addEventListener('click',function(){if(inst.checked)return;move(id,1);});
    li.appendChild(up);li.appendChild(dn);
    li.dataset.id=id;
    dragRow(li,function(){draw();});
    return li;
  }
  function move(id,dir){
    var i=inst.disp.indexOf(id),j=i+dir;
    if(j<0||j>=inst.disp.length)return;
    inst.disp.splice(j,0,inst.disp.splice(i,1)[0]);draw();
  }
  function draw(){
    list.innerHTML='';
    list.__owner=inst;
    inst.disp.forEach(function(id,i){list.appendChild(rowFor(id,i));});
  }
  draw();
  box.appendChild(el('p','small muted','Put the steps in the right order. Use the arrows or drag the handle.'));
  box.appendChild(list);
}
function dragRow(li,after){
  var handle=$('[data-h]',li);
  handle.addEventListener('pointerdown',function(ev){
    var cardEl=li.closest('.excard');
    if(cardEl&&cardEl.__locked)return;
    ev.preventDefault();
    var list=li.parentNode,rows=Array.prototype.slice.call(list.children);
    var startY=ev.clientY,rect=li.getBoundingClientRect(),offY=startY-rect.top;
    li.classList.add('dragging');
    var ghost=li.cloneNode(true);ghost.className='ghost';ghost.style.width=rect.width+'px';
    document.body.appendChild(ghost);
    function pos(y){
      ghost.style.left=rect.left+'px';ghost.style.top=(y-offY)+'px';
      var target=null;
      rows.forEach(function(r){
        if(r===li)return;
        var rr=r.getBoundingClientRect();
        if(y>rr.top-8&&y<rr.bottom+8)target=r;
      });
      if(target){
        var ti=rows.indexOf(target),ci=rows.indexOf(li);
        if(ti>ci)list.insertBefore(li,target.nextSibling);else list.insertBefore(li,target);
        rows=Array.prototype.slice.call(list.children);
      }
    }
    function mv(e){pos(e.clientY);}
    function up(){
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
      ghost.remove();li.classList.remove('dragging');
      var ids=[];Array.prototype.slice.call(list.children).forEach(function(r){ids.push(r.dataset.id);});
      var owner=list.__owner||li.closest('.excard').__inst;
      if(owner)owner.disp=ids;
      after();
    }
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
  });
}
/* matching */
function wMatch(inst,box){
  var ex=inst.ex,wrap=el('div','match-wrap');

    b.innerHTML='<span>'+esc(l.text)+'</span><span class="pairout"></span>';

    });
    $all('.mchip',rc).forEach(function(b){
      var used=false;for(var k in inst.pairMap){if(inst.pairMap[k]===b.dataset.id)used=true;}
      b.classList.toggle('paired',used);
    });
  }
  refresh();
  wrap.appendChild(lc);wrap.appendChild(rc);
  box.appendChild(el('p','small muted','Click one item on the left, then its partner on the right. Click again to change.'));
  box.appendChild(wrap);

/* drag & drop */
function wDrag(inst,box){
  var ex=inst.ex;
  var bank=el('div','bank');bank.dataset.bank='1';
  var slotCount=ex.slots.length;
  var slots=el('div','slots '+(slotCount>=3?'cols-3':'cols-2'));
  ex.slots.forEach(function(s,i){
    var d=el('div','slot');d.dataset.slot=String(i);
    d.innerHTML='<div class="slot-h">'+esc(s.label)+'</div>';
    slots.appendChild(d);
  });
  function chipEl(item){
    var c=el('button','chip');c.type='button';c.dataset.id=item.id;c.textContent=item.text;
    c.addEventListener('click',function(){
      if(inst.checked)return;
      if(c.parentElement&&c.parentElement.classList.contains('slot'))return; /* slot click handler returns it */
      if(inst.selChip===item.id){inst.selChip=null;c.classList.remove('sel');}
      else{inst.selChip=item.id;$all('.chip',box).forEach(function(x){x.classList.remove('sel');});c.classList.add('sel');}
    });
    dragChip(c,bank,slots,function(){draw();});
    return c;
  }
  function placeItem(itemId,slotIdx){
    for(var k in inst.place){if(inst.place[k]===itemId)delete inst.place[k];}
    inst.place[slotIdx]=itemId;
    inst.selChip=null;
    $all('.chip',box).forEach(function(x){x.classList.remove('sel');});
    draw();
  }
  function findSlotOf(itemId){for(var k in inst.place){if(inst.place[k]===itemId)return k;}return null;}
  function draw(){
    bank.innerHTML='';
    inst.bank.forEach(function(item){
      if(findSlotOf(item.id)!=null)return;
      bank.appendChild(chipEl(item));
    });
    $all('.slot',slots).forEach(function(sd){
      var i=sd.dataset.slot,id=inst.place[i];
      $all('.chip',sd).forEach(function(x){x.remove();});
      if(id){
        var item=null;inst.bank.forEach(function(b){if(b.id===id)item=b;});
        sd.appendChild(chipEl(item));
      }
    });
  }
  slots.addEventListener('click',function(ev){
    if(inst.checked)return;
    var chipBtn=ev.target.closest('.chip');
    var sd=ev.target.closest('.slot');if(!sd)return;
    if(chipBtn&&!inst.selChip){
      for(var k in inst.place){if(inst.place[k]===chipBtn.dataset.id)delete inst.place[k];}
      draw();return;
    }
    if(inst.selChip)placeItem(inst.selChip,sd.dataset.slot);
  });
  bank.addEventListener('click',function(ev){
    if(inst.checked)return;
    if(ev.target===bank&&inst.selChip){
      var sid=findSlotOf(inst.selChip);
      if(sid!=null){delete inst.place[sid];inst.selChip=null;draw();}
    }
  });
  draw();
  box.appendChild(el('p','small muted','Drag each item into a slot, or click the item then the slot. Tap a placed item to send it back.'));
  box.appendChild(bank);box.appendChild(slots);
  inst.__draw=draw;
}
function dragChip(chip,bank,slots,after){
  chip.addEventListener('pointerdown',function(ev){
    var cardEl=chip.closest('.excard');
    if(cardEl&&cardEl.__locked)return;
    var inst=cardEl?cardEl.__inst:null;
    ev.preventDefault();
    var rect=chip.getBoundingClientRect(),offX=ev.clientX-rect.left,offY=ev.clientY-rect.top;
    var ghost=chip.cloneNode(true);ghost.className='chip ghost';
    ghost.style.width=rect.width+'px';ghost.style.left=rect.left+'px';ghost.style.top=rect.top+'px';
    document.body.appendChild(ghost);
    var curSlot=null;
    function mv(e){
      ghost.style.left=(e.clientX-offX)+'px';ghost.style.top=(e.clientY-offY)+'px';
      var hit=document.elementFromPoint(e.clientX,e.clientY);
      var sl=hit?hit.closest('.slot'):null;
      if(curSlot&&curSlot!==sl)curSlot.classList.remove('over');
      curSlot=sl;if(sl)sl.classList.add('over');
    }
    function up(e){
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
      ghost.remove();
      if(curSlot)curSlot.classList.remove('over');
      if(!inst||inst.checked){after();return;}
      var hit=document.elementFromPoint(e.clientX,e.clientY);
      var sl=hit?hit.closest('.slot'):null;
      if(sl){
        var i=sl.dataset.slot;
        for(var k in inst.place){if(inst.place[k]===chip.dataset.id)delete inst.place[k];}
        if(inst.place[i]&&inst.place[i]!==chip.dataset.id){delete inst.place[i];}
        inst.place[i]=chip.dataset.id;
      }else{
        var inSlot=chip.parentElement&&chip.parentElement.classList.contains('slot');
        if(inSlot){
          var si=chip.parentElement.dataset.slot;
          if(inst.place[si]===chip.dataset.id)delete inst.place[si];
        }
      }
      inst.selChip=null;
      after();
    }
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
  });
}
/* fill in the blanks */
function wFill(inst,box){

/* terminal */
function wTerminal(inst,box){
  var ex=inst.ex,sh=ex.shell;
  if(sh.support)box.appendChild(el('div','hintbox',sh.support));
  var term=el('div','term');
  term.innerHTML='<div class="term-out" data-out>'+esc(sh.banner||'')+'</div>'+

    (sh.note?'<div class="term-note">'+sh.note+'</div>':'');
  box.appendChild(term);
  var out=$('[data-out]',term),inp=$('[data-cmd]',term);
  inst.lastCmd=null;inst.ran=false;
  inp.addEventListener('keydown',function(ev){
    if(ev.key==='Enter'){
      var cmd=inp.value;inp.value='';
      runCmd(inst,out,cmd);
    }
  });
  if(sh.deadlineNote)box.appendChild(el('p','small muted',sh.deadlineNote));

function runCmd(inst,out,cmd){
  var sh=inst.ex.shell;
  out.textContent+='\n'+sh.prompt+cmd+'\n';
  var n=norm(cmd);
  if(!n){out.scrollTop=out.scrollHeight;return;}
  inst.lastCmd=n;inst.ran=true;
  var dangerous=null;
  (sh.forbidden||[]).forEach(function(f){if(f.re.test(n))dangerous=f;});
  var ok=sh.expectRe?sh.expectRe.test(n):true;
  if(dangerous){out.textContent+='\n'+dangerous.out+'\n';}
  else if(ok){out.textContent+='\n'+(sh.out||'(no output)')+'\n';}
  else{
    var tok=n.split(' ')[0];
    out.textContent+='\n'+(sh.errOut||('bash: '+tok+': command not found'))+'\n';
  }
  out.scrollTop=out.scrollHeight;
}

/* Engine part B — grading, feedback, flow, results, integration */
'use strict';
/* ---------------- grading ---------------- */
function grade(inst){
  var ex=inst.ex,res={items:[],detail:'',cls:'bad',label:'INCORRECT',credit0:0};
  if(inst.type==='choice'){
    var correct=[ex.correct];
    res.credit0=scoreExercise(inst.raw?[inst.raw]:[],correct);
    inst.opts.forEach(function(o){
      if(o.id===ex.correct)res.items.push({st:'ok',t:esc(o.text)+' — correct answer'});
      else if(inst.raw===o.id)res.items.push({st:'bad',t:esc(o.text)+' — your choice'});
    });
  }else if(inst.type==='multi'){
    var sel=inst.raw||[];
    res.credit0=scoreExercise(sel,ex.correct);
    inst.opts.forEach(function(o){
      var isC=ex.correct.indexOf(o.id)>=0,isS=sel.indexOf(o.id)>=0;
      if(isC&&isS)res.items.push({st:'ok',t:esc(o.text)});
      else if(isC)res.items.push({st:'miss',t:esc(o.text)});
      else if(isS)res.items.push({st:'bad',t:esc(o.text)});
    });
  }else if(inst.type==='order'){
    var arr=inst.disp||[],N=arr.length,H=0,W=0;
    arr.forEach(function(id,i){
      var item='';ex.items.forEach(function(it){if(it.id===id)item=it.text;});
      var good=ex.items[i].id===id;
      if(good){H++;res.items.push({st:'ok',t:'Position '+(i+1)+': '+esc(item)});}
      else{W++;res.items.push({st:'bad',t:'Position '+(i+1)+': '+esc(item)+' — should be: '+esc(ex.items[i].text)});}
    });
    res.credit0=Math.max(0,(H-W)/N);
  }else if(inst.type==='match'){
    var cnt=0,Wm=0,N=ex.pairs.length;
    inst.lefts.forEach(function(l){
      var oi=parseInt(l.id.slice(1),10);
      var chosen=inst.pairMap[l.id];
      if(chosen==='R'+oi){cnt++;res.items.push({st:'ok',t:esc(ex.pairs[oi].l)+' → '+esc(ex.pairs[oi].r)});}
      else if(chosen){
        Wm++;
        var txt='';inst.rights.forEach(function(r){if(r.id===chosen)txt=r.text;});
        res.items.push({st:'bad',t:esc(ex.pairs[oi].l)+' → '+esc(txt)+' (wrong partner)'});
      }else res.items.push({st:'miss',t:esc(ex.pairs[oi].l)+' → '+esc(ex.pairs[oi].r)+' (missed)'});
    });
    res.credit0=Math.max(0,(cnt-Wm)/N);
  }else if(inst.type==='drag'){
    var okN=0,Wn=0,N2=ex.slots.length;
    ex.slots.forEach(function(s,i){
      var id=inst.place?inst.place[String(i)]:null;
      var item=null;
      if(id!=null)inst.bank.forEach(function(b){if(b.id===id)item=b;});
      if(item&&item.ok&&String(item.slot)===String(i)){okN++;res.items.push({st:'ok',t:esc(s.label)+': '+esc(item.text)});}
      else if(item){
        Wn++;
        var why=(item.ok&&item.slot!==undefined&&String(item.slot)!==String(i))?' — right idea, wrong slot':' — wrong item here';
        res.items.push({st:'bad',t:esc(s.label)+': '+esc(item.text)+why});
      }
      else{
        var right='';ex.bank.forEach(function(b){if(b.ok&&b.slot===i)right=b.text;});
        res.items.push({st:'miss',t:esc(s.label)+': '+esc(right)+' (missed)'});
      }
    });
    res.credit0=Math.max(0,(okN-Wn)/N2);
  }else if(inst.type==='fill'){
    var vals=inst.raw||[],H2=0,W2=0,N3=ex.answers.length;
    ex.answers.forEach(function(a,i){
      var v=vals[i]||'';
      if(norm(v)===norm(a)){H2++;res.items.push({st:'ok',t:'Blank '+(i+1)+': '+esc(a)});}
      else if(v){W2++;res.items.push({st:'bad',t:'Blank '+(i+1)+': you chose "'+esc(v)+'" — answer is "'+esc(a)+'"'});}
      else res.items.push({st:'miss',t:'Blank '+(i+1)+': '+esc(a)+' (left empty)'});
    });
    res.credit0=Math.max(0,(H2-W2)/N3);
  }else if(inst.type==='terminal'){
    gradeTerminal(inst,res);
  }else if(inst.type==='branch'){
    var N4=ex.steps.length,H3=0,W3=0;
    ex.steps.forEach(function(s,i){
      var got=inst.stepRaws[i];
      if(got===s.correct){H3++;res.items.push({st:'ok',t:'Step '+(i+1)+': '+esc(s.short||'correct')});}
      else{
        if(got)W3++;
        var badTxt='';
        if(got){s.options.forEach(function(o){if(o.id===got)badTxt=o.text;});}
        res.items.push({st:'bad',t:'Step '+(i+1)+': you chose "'+esc(badTxt||'(no answer)')+'" — better: '+esc(s.short||s.correct)});
      }
    });
    res.credit0=Math.max(0,(H3-W3)/N4);
  }
  var used=E.hint[inst.ex.id];
  var credit=Math.max(0,res.credit0-(used?0.10:0));
  inst.credit=credit;
  if(credit>=0.999){res.cls='ok';res.label='CORRECT';}
  else if(credit>0){res.cls='part';res.label='PARTIALLY CORRECT';}
  else{res.cls='bad';res.label='INCORRECT';}
  res.credit=credit;res.hintUsed=used;
  return res;
}
function gradeTerminal(inst,res){
  var sh=inst.ex.shell,els=sh.elements||[];
  var n=inst.lastCmd||'';
  var H=0,W=0;
  els.forEach(function(e){
    if(n&&e.re.test(n)){H++;res.items.push({st:'ok',t:'Element: '+esc(e.label)});}
    else res.items.push({st:'miss',t:'Element: '+esc(e.label)+(n?' (missing)':' (no command run)')});
  });
  var dang=null;
  (sh.forbidden||[]).forEach(function(f){if(n&&f.re.test(n)){W++;dang=f;}});
  if(dang)res.items.push({st:'bad',t:'⚠ '+esc(dang.label)});
  res.credit0=Math.max(0,(H-W)/els.length);
  if(dang)res.detail+='<div class="study">⚠ <b>Close but dangerous:</b> '+dang.warn+'</div>';
  res.detail+='<div class="art canon"><div class="art-l">Canonical command</div>'+
    '<pre class="code" data-canon>'+esc(sh.canon)+'</pre>'+
    '<div class="blk-b"><button type="button" class="btn light copybtn" data-copy>Copy command</button></div></div>'+
    (sh.canonExpl?('<div class="fb-ex">'+sh.canonExpl+'</div>'):'');
}
/* ---------------- check / next / pause / hint / skip ---------------- */
function onCheck(inst,ablk,fbEl,btn){
  var ex=inst.ex;
  if(inst.type==='branch'){inst.stepRaws[inst.cur]=(inst.raw!=null?inst.raw:null);inst.raw=inst.stepRaws.slice();}
  if(inst.type==='order'){
    var list=$('.ordlist',ablk);
    if(list){var ids=[];Array.prototype.slice.call(list.children).forEach(function(r){ids.push(r.dataset.id);});inst.disp=ids;}
  }
  if(inst.type==='drag'&&inst.__draw)inst.__draw();
  /* FIRST action: auto-pause before rendering feedback */
  if(tState()===TS.R)setTS(TS.PA);
  inst.checked=true;
  var res=grade(inst);
  var card=$('.excard',$('#stage'));
  if(card)card.__locked=true;
  disableWidget(ablk);
  renderFeedback(inst,res,fbEl);
  updateHeader();
  /* swap button to Next / Final Submit */
  var last=(E.idx===E.inst.length-1)&&!inst.fromReview;
  btn.textContent=last?'Final Submit':'Next &#9654;';
  btn.innerHTML=last?'Final Submit':'Next &#9654;';
  btn.onclick=function(){onNext(inst,ablk,fbEl,btn);};
  var noteEl=$('.acts .note',ablk);
  if(noteEl)noteEl.textContent=(tState()===TS.PA)?'Timer paused while you study this feedback. Press Next to continue — the timer restarts then.':'';
  syncHeaderButtons();
}
function autoCheck(){
  var inst=curInst();
  if(!inst||inst.checked)return;
  var ablk=ablkOf(inst),fbEl=fbElOf(inst),btn=$('#bCheck');
  if(inst.type==='branch'){inst.stepRaws[inst.cur]=(inst.raw!=null?inst.raw:null);inst.raw=inst.stepRaws.slice();}
  if(tState()===TS.R)setTS(TS.PA);
  inst.checked=true;
  var res=grade(inst);
  var card=$('.excard',$('#stage'));
  if(card)card.__locked=true;
  if(ablk)disableWidget(ablk);
  if(fbEl)renderFeedback(inst,res,fbEl);
  updateHeader();
  if(btn){
    var last=(E.idx===E.inst.length-1)&&!inst.fromReview;
    btn.innerHTML=last?'Final Submit':'Next &#9654;';
    btn.onclick=function(){onNext(inst,ablk,fbEl,btn);};
  }
}
function disableWidget(ablk){
  $all('button, input, select',ablk).forEach(function(x){
    if(x.id==='bCheck')return;
    x.disabled=true;
    x.classList.add('disabled-ui');
  });
}
function markOptions(inst,ablk){
  var ex=inst.ex;
  if(inst.type==='choice'||inst.type==='multi'){
    var opts=$all('.opt',ablk);
    var ids=[];
    inst.opts.forEach(function(o,i){
      var elx=opts[i];
      if(ex.type==='choice'){
        if(o.id===ex.correct)elx.classList.add('state-ok');
        else if(inst.raw===o.id)elx.classList.add('state-bad');
      }else{
        var isC=ex.correct.indexOf(o.id)>=0,isS=(inst.raw||[]).indexOf(o.id)>=0;
        if(isC&&isS)elx.classList.add('state-ok');
        else if(isC)elx.classList.add('state-miss');
        else if(isS)elx.classList.add('state-bad');
      }
    });
  }
}
function renderFeedback(inst,res,fbEl){
  markOptions(inst,$('.excard .b-answer',$('#stage')));
  var creditTxt='';
  var nItems=0;
  if(inst.type==='multi'||inst.type==='order'||inst.type==='match'||inst.type==='drag'||inst.type==='fill'||inst.type==='terminal'||inst.type==='branch'){
    var N=0;
    if(inst.type==='multi')N=inst.ex.correct.length;
    else if(inst.type==='order'||inst.type==='match'||inst.type==='drag'||inst.type==='fill')N=res.items.length;
    else if(inst.type==='terminal')N=inst.ex.shell.elements.length;
    else if(inst.type==='branch')N=inst.ex.steps.length;
    var itemsRight=0,itemsWrong=0;
    res.items.forEach(function(it){if(it.st==='ok')itemsRight++;else if(it.st==='bad')itemsWrong++;});
    creditTxt='<span class="credit-chip">credit '+res.credit.toFixed(2)+(N?' — '+itemsRight+' correct'+(itemsWrong?', '+itemsWrong+' wrong':'')+' of '+N+' items':'')+'</span>';
  }
  var icon=res.cls==='ok'?'&#10003;':(res.cls==='part'?'&#10003;':'&#10007;');
  var html='<div class="fb-h"><span class="fi" style="font-size:18px">'+icon+'</span><span>'+res.label+'</span>'+creditTxt+
    (res.hintUsed?'<span class="credit-chip">hint used: &minus;10% applied</span>':'')+'</div>';
  html+='<div class="fb-b">';
  if(res.items.length)html+='<ul class="fb-items">'+res.items.map(function(it){
    var ic=it.st==='ok'?'<span class="fi ok">&#10003;</span>':(it.st==='bad'?'<span class="fi bad">&#10007;</span>':'<span class="fi miss">&#9675;</span>');
    var w=it.st==='ok'?'Correct':(it.st==='bad'?'Wrong':'Missed');
    return '<li>'+ic+'<span><b>'+w+'</b> — '+it.t+'</span></li>';
  }).join('')+'</ul>';
  html+='<div class="fb-ex">'+inst.ex.explain+'</div>';
  if(res.detail)html+=res.detail;
  html+='</div>';
  fbEl.innerHTML='';
  fbEl.appendChild(el('div','fb '+res.cls,html));
  var cb=$('[data-copy]',fbEl);
  if(cb)cb.addEventListener('click',function(){
    var txt=$('[data-canon]',fbEl).textContent;
    try{navigator.clipboard.writeText(txt);}catch(e){}
    cb.textContent='Copied';
  });
  fbEl.scrollIntoView({behavior:(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)?'auto':'smooth',block:'nearest'});
}
function onNext(inst,ablk,fbEl,btn){
  if(tState()===TS.PA){
    if(E.timer.remaining>0)setTS(TS.R);else setTS(TS.EN);
  }
  var fromReview=inst.fromReview;
  if(fromReview){
    inst.fromReview=false;
    renderReview();
    return;
  }
  if(E.idx<E.inst.length-1){
    E.idx++;renderExercise();
  }else{
    var pending=E.skipped.filter(function(i){return !E.inst[i].checked;});
    if(pending.length>0)renderReview();

/* ---------------- results ---------------- */
function renderResults(timeout){
  E.phase='results';
  if(tState()!==TS.EN)setTS(TS.EN);
  updateHeader();
  var st=$('#stage');
  var answered=0,sum=0,full=0,part=0,zero=0,partSum=0,skipped=0,i;
  for(i=0;i<E.inst.length;i++){
    var inst=E.inst[i];
    if(inst.checked){answered++;sum+=inst.credit;
      if(inst.credit>=0.999)full++;
      else if(inst.credit>0){part++;partSum+=inst.credit;}
      else zero++;
    }else skipped++;
  }
  var pct=answered>0?Math.round((sum/answered)*100):0;
  var passed=pct>=70;
  var d=E.d;
  var sealSvg='<svg class="c-seal" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#b08d3f" stroke-width="4"/><circle cx="50" cy="50" r="38" fill="#2a2413" stroke="#b08d3f" stroke-width="2"/><path d="M32 52 L45 65 L70 38" fill="none" stroke="#e0b95c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var panel=passed?

severity:"EASY",sevClass:"sev-easy",techniqueId:"T1659",techniqueName:"Content Injection",
timerSeconds:24*60,
intro:{
headline:"T1659 — Content Injection — EASY practice exam",
entityTitle:"About MITRE ATT&CK T1659 — Content Injection",
entityHtml:"<p><b>What this object is.</b> T1659 is a <b>Technique</b> in MITRE ATT&CK. ATT&CK is a public catalogue of attacker behaviours. A technique describes one behaviour an attacker can perform. This technique is called <b>Content Injection</b>. It has no sub-techniques. It sits in two tactics: <b>Initial Access</b> (TA0001) and <b>Command and Control</b> (TA0011). The platforms listed are Linux, Windows and macOS.</p>"+
"<p><b>What the attacker does.</b> Imagine you open a website, or your computer asks a server for something. Somewhere on the network path — sometimes at the internet provider — an attacker is listening. When the answer comes back, the attacker adds or replaces content inside it. On the ATT&CK page the attacker can inject <b>from the middle</b>, sitting between you and the real service, or <b>from the side</b>, sending a fake reply that races the real one. The channels named on the page are <b>DNS</b>, <b>HTTP</b> and <b>SMB</b> replies. Your computer trusts the answer, follows it, and may download and run a bad file. Later, the attacker can push more tools through the same channel — that is why ATT&CK also lists this technique under Command and Control.</p>"+
"<p><b>Why it is special.</b> The victim does nothing wrong. There is no bad email and no bad website to avoid. The attacker reaches into a channel the victim already trusts. That is also the difference from drive-by attacks: a drive-by attack makes the victim visit attacker infrastructure; content injection comes to the victim through a normal connection. It is similar to Adversary-in-the-Middle (T1557), but ATT&CK limits T1557 to enterprise environments — T1659 is about online traffic paths, for example at an internet service provider ('lawful interception' systems abused by attackers).</p>"+
"<p><b>How defenders fight it.</b> The page lists two mitigations: <b>M1041 Encrypt Sensitive Information</b> (encrypt traffic, for example with trusted VPNs) and <b>M1021 Restrict Web-Based Content</b> (block uncommon file types). Detection is the strategy <b>DET0349</b> with three analytics: <b>AN0992</b> (Windows: a browser writes a payload to %AppData% or Temp and something runs it), <b>AN0993</b> (Linux: curl or wget saves a payload to /tmp or /var/tmp and it runs; IDS/IPS and packet captures catch injected responses), and <b>AN0994</b> (macOS: unified logs show Safari or another browser spawning a process that loads a script). Real cases on the page: the group <b>MoustachedBouncer</b> (G1019) and its tool <b>Disco</b> (S1088), which spied on foreign diplomats in Belarus using injected DNS, HTTP and SMB replies and a fake Windows Update page.</p>",
workHtml:"<ul>"+
"<li><b>SOC analysts</b> triage the alerts these analytics raise: a browser wrote a file and it executed seconds later. You decide if it is real, and what to do next.</li>"+
"<li><b>Detection engineers</b> own AN0992 / AN0993 / AN0994: they build the rules, watch the temp folders, the parent-child chains, and tune false positives.</li>"+
"<li><b>Threat intel analysts</b> track groups like MoustachedBouncer and tools like Disco, and write reports that cite T1659 with the right IDs.</li>"+
"<li><b>Incident responders</b> preserve network evidence (packet captures) and export dropped payloads when injection is suspected.</li>"+
"<li><b>Network and security engineers</b> implement the mitigations: enforce encryption and trusted VPNs (M1041), block uncommon file types (M1021).</li>"+
"<li><b>GRC and control owners</b> check that these controls exist, are configured, and actually cover the traffic paths.</li></ul>"+
"<p class='small muted'>Every exercise in this exam is built only from the ATT&CK page of T1659 and the concepts tied to it.</p>",
extraNotes:["<b>Terminal exercise:</b> one exercise uses a fake Linux terminal. It names the tool, shows a syntax reminder, and forgives capital letters or extra spaces."]
},
keywords:[
{theme:"Technique identity and framework position",items:["T1659 Content Injection","Technique — no sub-techniques","Initial Access (TA0001)","Command and Control (TA0011)","Platforms: Linux, Windows, macOS"]},

{theme:"Protocols and delivery vectors",items:["DNS replies","HTTP replies","SMB replies","Redirect to malicious download","Fake Windows Update page","Follow-on payloads (Ingress Tool Transfer T1105)"]},
{theme:"Telemetry and data sources",items:["Browser-triggered file creation","Process execution after write","%AppData% and Temp","/tmp and /var/tmp","curl and wget","PCAP","IDS/IPS alerts","Mismatched content types","macOS unified logs","Safari child processes","~/Library/Caches","~/Downloads"]},
{theme:"Detection strategy and analytics",items:["DET0349 Detection Strategy for Content Injection","AN0992 (Windows)","AN0993 (Linux)","AN0994 (macOS)","Network-to-host correlation","False-positive tuning"]},
{theme:"Mitigations and controls",items:["M1041 Encrypt Sensitive Information (trusted VPNs)","M1021 Restrict Web-Based Content (uncommon file types)","Control trade-offs"]},
{theme:"Real-world examples and attribution",items:["Disco (S1088)","MoustachedBouncer (G1019)","Espionage against foreign diplomats in Belarus","Specifically-targeted victims","Public reporting, 2023"]}
]};

window.EXAM_DATA.exercises=[
{id:"e01",type:"choice",title:"Object type",summary:"What kind of ATT&CK object is T1659?",
scenario:{summary:"ATT&CK page header — identify the object type.",
intro:"<p>Warm-up. Here is the top of the ATT&CK entry you are studying:</p>",
artefacts:[{label:"ARTEFACT 1 — ATT&CK page header",code:"ID: T1659\nName: Content Injection\nSub-techniques: No sub-techniques\nTactics: Initial Access, Command and Control\nPlatforms: Linux, Windows, macOS",light:true}]},
question:"Which kind of ATT&CK object is T1659?",
options:[{id:"A",text:"A technique — a behaviour attackers can perform"},{id:"B",text:"A tactic — a goal attackers want to reach"},{id:"C",text:"A mitigation — a control that blocks attacks"},{id:"D",text:"A group — a named team of attackers"}],
correct:"A",
hint:"The page lists an ID starting with T and no sub-techniques. Tactics start with TA, mitigations with M, groups with G.",
explain:"<p>T1659 is a <b>Technique</b>. A technique describes one behaviour an attacker can perform. A tactic is a goal, a mitigation is a defence, a group is a threat actor. The ID prefix helps you remember: techniques start with <b>T</b>, tactics with <b>TA</b>, mitigations with <b>M</b>, groups with <b>G</b>.</p><p class='small muted'>Study: re-read the intro card 'About MITRE ATT&CK T1659'.</p>"},
{id:"e02",type:"drag",title:"Two tactics",summary:"Place T1659 into the tactics the page lists.",
scenario:{summary:"Which tactics does the page list for T1659?",
intro:"<p>The ATT&CK page lists exactly two tactics for Content Injection. Drag the two correct tactic cards into the slots. Two cards are wrong on purpose.</p>"},
question:"Drag the two tactics that the page lists for T1659 into the two slots.",
slots:[{label:"Tactic 1 for T1659"},{label:"Tactic 2 for T1659"}],
bank:[{text:"Initial Access (TA0001)",ok:true,slot:0},{text:"Command and Control (TA0011)",ok:true,slot:1},{text:"Persistence (TA0003)",ok:false},{text:"Execution (TA0002)",ok:false}],
hint:"Think about what the injected channel is used for: a first foothold, and later a way to keep talking to the victim.",
explain:"<p>The page lists <b>Initial Access</b> and <b>Command and Control</b>. The injected content can give the attacker their first foothold, and the same channel can later carry more payloads or commands. Persistence and Execution are other tactics — the page does not list them for T1659.</p>"},
{id:"e03",type:"fill",title:"Plain definition",summary:"Fill the definition of Content Injection.",
scenario:{summary:"Complete the definition from the page.",
intro:"<p>Complete this sentence with the page's own key words. Pick the right word for each blank.</p>"},
question:"Fill both blanks.",
text:"Adversaries may gain access and keep talking with victims by injecting malicious ___ into systems through online network ___.",
answers:["content","traffic"],
bank:["content","traffic","emails","passwords"],
hint:"The attacker changes what flows over the network — not what sits in a mailbox.",
explain:"<p>The page says attackers inject malicious <b>content</b> through online network <b>traffic</b>. It is not about emails or stolen passwords. The network traffic itself is the delivery channel — that is why the traffic path is the thing defenders must protect.</p>"},
{id:"e04",type:"multi",title:"Platforms",summary:"Which platforms does the page list?",
scenario:{summary:"Platforms of T1659.",
intro:"<p>The ATT&CK page lists the platforms where the technique can happen.</p>"},
question:"Which platforms does the ATT&CK page list for T1659?",
selectNote:"Select all that apply. Wrong picks subtract from correct ones.",
options:[{id:"A",text:"Linux"},{id:"B",text:"Windows"},{id:"C",text:"macOS"},{id:"D",text:"Android devices"},{id:"E",text:"Router firmware"}],
correct:["A","B","C"],
hint:"The page lists three operating systems: two desktop systems and the penguin.",
explain:"<p>The page lists <b>Linux, Windows and macOS</b>. Content injection works on any system that speaks the injected protocols on an online path. Android or router firmware are not listed for T1659 — mobile techniques and network-device techniques live in their own lists.</p>"},
{id:"e05",type:"choice",title:"From the middle",summary:"Name the injection position on the path.",
scenario:{summary:"Attacker sits on the path between client and server.",
intro:"<p>An attacker has a position on the network path between a user's browser and the website the user visits. The attacker changes the answers that flow back to the user.</p>"},
question:"What is this injection position called on the ATT&CK page?",
options:[{id:"A",text:"From the middle"},{id:"B",text:"From the side"},{id:"C",text:"From the host"},{id:"D",text:"From the cloud"}],
correct:"A",
hint:"The attacker sits between the client and the server.",
explain:"<p>From the <b>middle</b>: the attacker is in-between the legitimate online client-server communications. The page notes this is similar to Adversary-in-the-Middle (T1557), but T1557 covers only enterprise environments — this position is about the online path. 'From the side' is different: there the attacker is not on the path all the time, they shoot in a racing fake reply.</p>"},
{id:"e06",type:"choice",title:"From the side",summary:"Name the racing fake reply position.",
scenario:{summary:"A fake reply races the real one.",
intro:"<p>Here the attacker does not sit between client and server. They watch the traffic from a spot off the path. When a user asks a server for something, the attacker quickly sends a <b>fake reply</b> that races the real one. If the fake arrives first, the user gets the malicious content.</p>"},
question:"What is this injection position called?",
options:[{id:"A",text:"From the side"},{id:"B",text:"From the middle"},{id:"C",text:"DNS hijacking"},{id:"D",text:"Port mirroring"}],
correct:"A",
hint:"The fake reply races the real one — like two runners to one finish line.",
explain:"<p>From the <b>side</b>: malicious content is injected and races to the client as a fake response to a request of a legitimate online server. The attacker wins the race or loses it — that is the trade-off they accept. From the middle would mean a permanent seat on the path. DNS hijacking is a different technique.</p>"},
{id:"e07",type:"match",title:"What changes per protocol",summary:"Match each protocol reply to what the attacker changes.",
scenario:{summary:"Injected DNS, HTTP and SMB replies.",
intro:"<p>Attackers inject into the replies of common protocols. Match each protocol to what the attacker can change inside its reply.</p>"},
question:"Match each protocol reply to what the attacker changes in it.",
pairs:[{l:"DNS reply",r:"The IP address the victim's computer should use"},{l:"HTTP reply",r:"The web page or file the browser receives"},{l:"SMB reply",r:"The file-share answer the client accepts"}],
hint:"DNS answers say where to go, HTTP answers say what to show, SMB answers carry shared files.",
explain:"<p><b>DNS</b> turns names into IP addresses — an injected reply can point the victim to an attacker's server. <b>HTTP</b> carries pages and downloads — an injected reply can swap the page or the file. <b>SMB</b> moves files on local networks — an injected reply can hand over a bad file. The tool Disco (S1088) injected into exactly these three reply types.</p>"},
{id:"e08",type:"multi",title:"Injection channels",summary:"Which reply channels does the page name?",
scenario:{summary:"Channels named on the page.",
intro:"<p>The ATT&CK page and the Disco example name the channels that were abused for content injection.</p>"},
question:"Which reply channels are named for content injection?",
selectNote:"Select all that apply. Wrong picks subtract from correct ones.",
options:[{id:"A",text:"DNS replies"},{id:"B",text:"HTTP replies"},{id:"C",text:"SMB replies"},{id:"D",text:"RDP sessions"},{id:"E",text:"Email attachments"}],
correct:["A","B","C"],
hint:"Two wrong answers never appear on the page — one is a remote-desktop protocol, one arrives by mail.",
explain:"<p>The page names <b>DNS, HTTP and SMB</b> replies. Disco injected into exactly these three channels. RDP sessions and email attachments belong to other techniques — they are not content injection channels on this page.</p>"},

{id:"e09",type:"drag",title:"Temp folders per OS",summary:"Match each OS to the folders the page names.",

bank:[{text:"%AppData% or Temp",ok:true,slot:0},{text:"/tmp or /var/tmp",ok:true,slot:1},{text:"~/Library/Caches or ~/Downloads",ok:true,slot:2},{text:"/etc or /bin",ok:false}],
hint:"Windows paths use per cent signs, Linux paths start with a slash, macOS hides things in the user Library.",
explain:"<p>Windows payloads land in <b>%AppData% or Temp</b> (AN0992). Linux payloads in <b>/tmp or /var/tmp</b> (AN0993). macOS drops in <b>~/Library/Caches or ~/Downloads</b> (AN0994). <b>/etc or /bin</b> are system folders — the page does not name them as payload drop zones.</p>"},
{id:"e10",type:"order",title:"Payload timeline",summary:"Order the four steps of an injected payload.",
scenario:{summary:"From injected reply to detection.",
intro:"<p>These are the four steps of a typical content injection payload, in a mixed order.</p>"},
question:"Put the four steps in the order they happen.",
items:[{id:"o1",text:"An injected reply tells the browser to download a file"},{id:"o2",text:"The file is written to a temp folder"},{id:"o3",text:"The file runs soon after it was written"},{id:"o4",text:"Analysts correlate the network anomaly with this execution"}],
hint:"First the content arrives, then it is written, then it runs, then defenders connect the dots.",
explain:"<p>1) The injected reply redirects the victim to a download. 2) The payload is written to a temp folder. 3) It executes shortly after — this short write-then-run gap is the key signal. 4) Analysts correlate the network anomaly with the execution.</p><p><b>Attacker view:</b> the short gap between write and run is exactly what the attacker needs to get code running without a user clicking anything suspicious. <b>Defender view:</b> the same gap plus the network anomaly is what makes AN0992, AN0993 and AN0994 fire.</p>"},
{id:"e11",type:"fill",title:"M1041",summary:"Which mitigation encrypts traffic — and its ID?",
scenario:{summary:"The two mitigations on the page.",
intro:"<p>The ATT&CK page lists two mitigations for T1659:</p>",
artefacts:[{label:"ARTEFACT 1 — Mitigations on the ATT&CK page",code:"M1041  Encrypt Sensitive Information\n        Where possible, ensure that online traffic is\n        appropriately encrypted through services such\n        as trusted VPNs.\n\nM1021  Restrict Web-Based Content\n        Consider blocking download/transfer and\n        execution of potentially uncommon file types\n        known to be used in adversary campaigns.",light:true}]},
question:"Complete the two blanks about the encryption mitigation.",
text:"The mitigation that says to encrypt online traffic — for example with trusted ___ — is M___ .",
answers:["VPNs","1041"],
bank:["VPNs","1041","1021","1048","proxies"],
hint:"One blank is the technology the page names; the other is the two-digit number after the M.",
explain:"<p>M1041 = <b>Encrypt Sensitive Information</b>: encrypt online traffic, for example with trusted <b>VPNs</b>. Encryption stops people on the path from reading and changing the content, which is exactly what injection needs. M1021 is the other mitigation: it blocks uncommon file types. M1048 and M1018 are real mitigation IDs, but not for T1659.</p>"},
{id:"e12",type:"drag",title:"Mitigation actions",summary:"Match each mitigation ID to its action.",

intro:"<p>Match each mitigation ID to the action it describes on the page.</p>"},

slots:[{label:"M1041 Encrypt Sensitive Information"},{label:"M1021 Restrict Web-Based Content"}],
bank:[{text:"Encrypt online traffic with trusted VPNs",ok:true,slot:0},{text:"Block uncommon file types in downloads",ok:true,slot:1},{text:"Delete all browser history every week",ok:false}],
hint:"One control is about reading and changing traffic; the other is about file types.",

{id:"e13",type:"fill",title:"MoustachedBouncer case",summary:"Fill the real case facts from the page.",
scenario:{summary:"The group and its fake update page.",

text:"MoustachedBouncer injected content into DNS, HTTP and ___ replies, then sent targeted victims to a fake ___ page to download malware.",

bank:["SMB","Windows Update","Chrome","SSH"],
hint:"One blank is a three-letter file-sharing protocol; the other is Microsoft's monthly patch page.",
explain:"<p>The page says MoustachedBouncer injected into <b>DNS, HTTP and SMB replies</b> and redirected specifically-targeted victims to a fake <b>Windows Update</b> page to download malware. The victim believed they were installing a normal Microsoft update — a strong lure, because updates feel routine and urgent.</p>"},
{id:"e14",type:"fill",title:"T1659 vs T1557",summary:"Complete the page's distinction.",

intro:"<p>Content injection from the middle sounds like Adversary-in-the-Middle. ATT&CK separates the two on purpose.</p>"},
question:"Complete the two blanks with the page's distinction.",
text:"ATT&CK says T1557 describes this behaviour solely within an ___ environment, while T1659 covers injection across online network ___ .",
answers:["enterprise","traffic"],
bank:["enterprise","traffic","home","packets"],
hint:"One blank is the place type the page names for T1557; the other is what flows between systems on the internet.",
explain:"<p>The page says injection from the middle is <b>similar but distinct</b> from Adversary-in-the-Middle: T1557 describes AiTM activity <b>solely within an enterprise environment</b>. T1659 covers injection across <b>online network traffic</b> — often outside the company. That placement matters for scoping: your office sensors may see nothing at all.</p>"},
{id:"e15",type:"match",title:"Analytics per OS",summary:"Match each analytic ID to its platform and signal.",
scenario:{summary:"DET0349 has three analytics.",
intro:"<p>Detection strategy <b>DET0349</b> (Content Injection) has three analytics — one per operating system. Match each ID to its platform and main signal.</p>"},
question:"Match each analytic ID to its operating system and main signal.",
pairs:[{l:"AN0992",r:"Windows — browser writes a payload, then it runs"},{l:"AN0993",r:"Linux — curl/wget saves a payload to /tmp, then it runs"},{l:"AN0994",r:"macOS — Safari spawns a process that loads a script"}],
hint:"92 is Windows paths like %AppData%, 93 is Linux /tmp, 94 is the Mac with Safari.",
explain:"<p>The page maps <b>AN0992 → Windows</b>: suspicious file creations and process executions triggered by browser activity, payloads in %AppData% or Temp. <b>AN0993 → Linux</b>: curl/wget saving executables or scripts to /tmp or /var/tmp, then execution, plus packet captures and IDS/IPS alerts. <b>AN0994 → macOS</b>: unified logs, processes spawned from Safari or other browsers, drops in ~/Library/Caches or ~/Downloads.</p>"},

intro:"<p>You are a SOC analyst on a Linux server. Analytic <b>AN0993</b> watches for payloads saved into <b>/tmp</b> or <b>/var/tmp</b>. A user says they downloaded a file a few minutes ago. You only want to <b>look</b> — investigations read, they do not change things.</p>"},

<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
