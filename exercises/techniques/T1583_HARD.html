var DATA = {"meta": {"topicId": "t1583", "batch": 3, "title": "T1583 Acquire Infrastructure — HARD", "difficulty": "hard", "questionCount": 16, "estimatedMinutes": 45, "passMark": 70}, "severity": "HARD", "sevKey": "hard", "intro": {"hero": "<h1>T1583 — Acquire Infrastructure <span class=\"badge b-hard\">HARD · tier 3<\/span><\/h1><div class=\"sub\">Scenario-based certification exam on one MITRE ATT&amp;CK technique · object type: Technique · tactic: Resource Development (TA0042) · platforms: PRE<\/div><div class=\"chips\"><span class=\"mchip\">16 exercises<\/span><span class=\"mchip\">45 minutes<\/span><span class=\"mchip\">Pass mark: 70%<\/span><span class=\"mchip\">Partial credit scoring<\/span><span class=\"mchip\">ATT&amp;CK v20 data<\/span><\/div>", "entity": "\n<h2>About this ATT&amp;CK object (read before you start)<\/h2>\n<p><b>T1583 — Acquire Infrastructure<\/b> is one object of the MITRE ATT&amp;CK framework.\nIts object type is a <b>Technique<\/b>. A technique describes one clear way an attacker acts.\nIt is not a tactic, not a mitigation, and not a group.<\/p>\n<p>Imagine you want to attack a company. Before you touch that company, you need your own place on the\ninternet: a website name (a domain), a rented server, or an account on a popular website.\nT1583 describes exactly this step. The attacker <b>buys, rents, or registers<\/b> this infrastructure.\nIt sits in the <b>Resource Development<\/b> tactic (TA0042). That tactic is the preparation phase.\nIt happens <b>before<\/b> the attacker sends one phishing email or touches one company computer.\nATT&amp;CK marks its platforms as <b>PRE<\/b> for this reason.<\/p>\n<p>T1583 has <b>eight sub-techniques<\/b>. In plain words: <b>.001 Domains<\/b> — buying a website name;\n<b>.002 DNS Server<\/b> — running your own name servers; <b>.003 Virtual Private Server<\/b> — renting a\ncloud machine; <b>.004 Server<\/b> — buying or renting a real server; <b>.005 Botnet<\/b> — renting a\nnetwork of infected devices; <b>.006 Web Services<\/b> — signing up for sites like GitHub, Dropbox or\nTwitter; <b>.007 Serverless<\/b> — using cloud functions such as Cloudflare Workers or AWS Lambda;\n<b>.008 Malvertising<\/b> — buying online adverts that push malware.<\/p>\n<p><b>Why does an attacker do this?<\/b> Own infrastructure gives them: a place to host fake login pages;\na place to stage malware; servers to receive stolen data (command and control); and traffic that blends\nin with normal cloud or web traffic. They can provision it fast, change it fast, and shut it down fast.\nThey can pay with crypto, use free trials, use private WHOIS, or buy an old domain that already looks\ntrustworthy. All of this makes it hard to tie the infrastructure back to a person.<\/p>\n<p><b>Who uses this object in real work?<\/b> Almost every security role touches it:<\/p>\n<ul>\n<li><b>SOC analysts<\/b> see the results: alerts about new or strange domains and fresh servers.<\/li>\n<li><b>CTI analysts<\/b> track which actor bought what, and write reports naming T1583.<\/li>\n<li><b>Detection engineers<\/b> build watches on WHOIS, passive DNS, certificate logs and scan data\n(DET0895 / AN2027 in ATT&amp;CK).<\/li>\n<li><b>Threat hunters and IR<\/b> pivot on infrastructure: domain age, hosting, certificates.<\/li>\n<li><b>Red teamers<\/b> rent the same services for authorised engagements.<\/li>\n<li><b>GRC and control owners<\/b> accept that this phase cannot be stopped directly — ATT&amp;CK lists\nonly <b>M1056 Pre-compromise<\/b> — so controls focus on the follow-on attack.<\/li>\n<\/ul>\n<p><b>Tools and deliverables<\/b> you will meet: WHOIS lookups, passive DNS, certificate transparency\nlogs, internet-scan services, newly-registered-domain feeds, brand monitoring, takedown requests, and\nATT&amp;CK-mapped threat intel reports. <b>The risks it addresses:<\/b> phishing from lookalike domains,\nmalware hosting, C2 servers, and malicious adverts — all built on acquired infrastructure.<\/p>\n", "themes": [{"name": "Technique identity & matrix position", "items": ["T1583 Acquire Infrastructure", "Technique (not a tactic)", "Tactic: Resource Development (TA0042)", "Platforms: PRE", "Siblings: T1584 Compromise Infrastructure, T1588 Obtain Capabilities", "Feeds Phishing (T1566), Drive-by Compromise (T1189), C2 (T1071/T1102), Proxy (T1090)"]}, {"name": "The eight sub-techniques (acquisition targets)", "items": ["T1583.001 Domains", "T1583.002 DNS Server", "T1583.003 Virtual Private Server", "T1583.004 Server", "T1583.005 Botnet", "T1583.006 Web Services", "T1583.007 Serverless", "T1583.008 Malvertising"]}, {"name": "Adversary motivations & trade-offs", "items": ["Blend in with normal traffic", "Rapidly provision / modify / shut down", "Hard to tie back to the attacker", "Free trial periods", "Bulletproof & minimal-KYC hosting", "Aged / expired domain reputation", "Homoglyphs, typosquats, IDN homograph attacks", "Private WHOIS & varied registrars", "Residential proxy services", "Payment in crypto / prepaid cards"]}, {"name": "Telemetry, data sources & detection strategy", "items": ["Detection Strategy DET0895 (analytic AN2027)", "Internet-scan data: listening services, certificates in use, SSL/TLS negotiation features", "DNS registry data", "Logged DNS data", "WHOIS registration data", "Detection focus on follow-on stages (e.g. Command and Control)"]}, {"name": "Mitigations & control limits", "items": ["M1056 Pre-compromise", "No direct preventive control (outside enterprise visibility)", "Newly-registered-domain feeds", "Brand monitoring & takedowns", "Ad blockers against malvertising follow-on", "Aged-domain evasion of age-based blocks"]}, {"name": "Real-world procedure examples", "items": ["Agrius, Contagious Interview, Ember Bear (commercial VPN services)", "Kimsuky (crypto-funded servers)", "Sandworm Team (resellers, email campaign services)", "Star Blizzard (HubSpot, MailerLite)", "Sea Turtle (VPN networks, adversary-in-the-middle DNS)", "APT41 DUST (Cloudflare Workers)", "Mustard Tempest & Raspberry Robin (malvertising)", "APT5 / HAFNIUM / Ke3chang (ORB networks)"]}, {"name": "Attribution & infrastructure intelligence", "items": ["Infrastructure overlap is a weak signal alone", "Shared registrars & privacy services", "Reseller chains blur ownership", "ORB networks raise defender cost", "Confidence language in CTI reporting"]}], "focus": "This tier makes you discriminate near-miss answers: aged vs fresh domains, homoglyphs vs coincidences, bulletproof hosting, attribution caution, and two hands-on shells.", "rules": "\n<h2>How this exam works<\/h2>\n<ul>\n<li><b>Goal:<\/b> master <b>T1583 — Acquire Infrastructure<\/b> at the <b>HARD<\/b> level.\nSeveral options will look defensible. Only one survives the details.<\/li>\n<li><b>Questions:<\/b> 16 exercises. <b>Pass mark: 70%.<\/b> <b>Timer: 45 minutes.<\/b><\/li>\n<li><b>Exercise types in this tier:<\/b> multi-select correlation, two decision branches, two shells (socket triage and a log pipeline), a log viewer and dense artefact sets.<\/li>\n<li><b>Partial credit:<\/b> some exercises have more than one right part. Each right part earns a share\nof the score. Wrong picks subtract from your score. If you select everything, you get 0 for that\nexercise. A partly right answer still earns part of the credit: credit = (H − W) / N.<\/li>\n<li><b>Check stops the clock:<\/b> when you press <b>Check<\/b>, the timer stops by itself. You can read\nthe notes for as long as you want. The timer starts again only when you press <b>Next<\/b>\n(or Final Submit on the last exercise).<\/li>\n<li><b>Manual pause:<\/b> the Pause button stops the timer and hides the exercise. Press Resume to continue.<\/li>\n<li><b>Hint:<\/b> one hint per exercise. It costs 10% of that exercise's credit. Hints never reveal the answer.<\/li>\n<li><b>Skip:<\/b> every exercise has a Skip button. Skipping does not stop the timer and does not show\nthe answer. Before you finish, you get a screen to return to skipped exercises. Skipped exercises you\nnever answer are excluded from the score — they count as neither right nor wrong.<\/li>\n<li><b>Retake:<\/b> if you fail, you can retake the exam. Questions and answer choices are shuffled again.<\/li>\n<li><b>Defanged indicators:<\/b> this lab writes harmful addresses safely, like\n<code>hxxp://evil[.]example<\/code> and <code>45[.]33[.]10[.]7<\/code>. In terminal exercises, type\ndomains the same defanged way.<\/li>\n<\/ul>\n"}, "exercises": [{"id": "h01", "type": "logq", "sum": "Correlate three artefacts: which contacts were to attacker infrastructure?", "scen": "SOC shift. The proxy log flags three domains with <code>warn<\/code>. A colleague says “block everything that warns”. Before you do, you pull the WHOIS summary and check open tickets. Select the proxy lines that show contact with <b>likely attacker-acquired infrastructure<\/b>.", "arts": [{"label": "WHOIS / ASN summary", "text": "vpn-portal-nw[.]net   created 2026-10-10  privacy service   NS ns1.dns-host[.]net\ninvoice-nwind[.]com   created 2026-10-11  privacy service   NS ns2.dns-host[.]net\nnw-update-status[.]net created 2026-10-09 privacy service   NS ns1.dns-host[.]net\nnw-hr-benefits[.]com  created 2026-10-12  HR agency (matches ticket #8812)\nAll three warn domains resolve into ASN 204601 (small VPS provider)."}, {"label": "Ticket #8812 (excerpt)", "text": "HR confirms: nw-hr-benefits[.]com is owned by our benefits agency.\nCampaign launches this week. Allowlist requested."}], "q": "Select ALL proxy lines that are likely attacker-acquired infrastructure.", "note": null, "hint": "Two signals can defeat the age signal: a matching ticket and a huge shared CDN. The three warns share one VPS ASN and one registrar pattern.", "study": "Clustering (age + privacy + ASN + brand distance) beats single signals; ticket context kills false positives.", "ex": "<p>Each correct line carries the full pattern: days-old age, privacy WHOIS, one small VPS ASN, and a name that imitates something internal. The HR domain is younger than all of them — and fully benign, because a business record explains it. That is the point of correlation: <b>pattern, not age alone<\/b>. Selecting the wrong lines costs credit under the (H−W)/N rule.<\/p>", "log": "09:01:11  10[.]0[.]4[.]15  login.microsoftonline[.]com        AGE 11y   allow\n09:04:02  10[.]0[.]4[.]22  nw-hr-benefits[.]com               AGE 2d    block→allowlisted by #8812\n09:06:37  10[.]0[.]4[.]22  vpn-portal-nw[.]net                AGE 4d    warn\n09:07:12  10[.]0[.]5[.]31  cdn.jsdelivr[.]net                 AGE 8y    allow\n09:09:48  10[.]0[.]5[.]31  invoice-nwind[.]com                AGE 3d    warn\n09:12:20  10[.]0[.]6[.]11  partner-portal.logistics[.]com     AGE 6y    allow\n09:15:53  10[.]0[.]7[.]9   nw-update-status[.]net             AGE 5d    warn\n09:18:31  10[.]0[.]4[.]15  telemetry.office[.]com             AGE 9y    allow", "logLabel": "Proxy log (2026-10-14)", "widget": {"type": "multi", "opts": [{"t": "09:06:37 → vpn-portal-nw[.]net (AGE 4d, ASN 204601)", "c": true}, {"t": "09:09:48 → invoice-nwind[.]com (AGE 3d, ASN 204601)", "c": true}, {"t": "09:15:53 → nw-update-status[.]net (AGE 5d, ASN 204601)", "c": true}, {"t": "09:04:02 → nw-hr-benefits[.]com (AGE 2d)", "c": false}, {"t": "09:07:12 → cdn.jsdelivr[.]net (AGE 8y)", "c": false}, {"t": "09:12:20 → partner-portal.logistics[.]com (AGE 6y)", "c": false}]}}, {"id": "h02", "type": "qcm", "sum": "Least aggressive correct action", "scen": "A brand-new domain <b>hr-benefits-2026[.]com<\/b> appeared in your new-domain feed. It resolves <b>into your own corporate IP range<\/b>, and HR confirms they registered it yesterday for the benefits campaign (ticket #9034). Marketing wants it live today.", "arts": [], "q": "Which action is correct?", "note": null, "hint": "Two facts point the same way: company ownership and a matching ticket.", "study": "Least-aggressive response: verify ownership, allowlist with documentation, keep monitoring.", "ex": "<p>This is the “looks alarming, is benign” trap. A fresh domain resolving internally usually means a new internal project. The ticket removes the doubt. Over-blocking would cost real money and teach the SOC to trust noisy tools. Note the contrast with h01: same look, opposite answer — context decides.<\/p>", "opts": [{"t": "Allowlist the domain with the ticket reference and let the campaign run", "c": true, "why": ["The domain is company-owned, explained, and needed today — the least aggressive correct action."]}, {"t": "Block it at the firewall and page the CISO before anyone else reacts to it", "c": false, "why": ["Blocking your own HR campaign causes real damage; nothing suggests attacker control."]}, {"t": "Sinkhole the domain company-wide and flush all internal DNS caches first", "c": false, "why": ["Sinkholing a legitimate internal name breaks the campaign for everyone."]}, {"t": "Ask HR to postpone the campaign until the domain has aged past 30 days", "c": false, "why": ["Age is not a security requirement for company-owned names."]}]}, {"id": "h03", "type": "branch", "sum": "Dual perspective: a malvertising campaign (red → blue)", "scen": "This branch puts you on both sides of a T1583.008 operation. Red first: you run the adversary playbook. Then blue: you defend against it. ATT&amp;CK’s procedure examples note actors like Mustard Tempest posting fake software ads, and Raspberry Robin delivered through ads that dropped an archive hosted on Discord.", "arts": [], "q": "Choose correctly at each step, first as the attacker, then as the defender.", "note": "Answer each step, then press Check on the last step. Intermediate confirms do not stop the timer.", "hint": "Red: buy placement, then cloak against crawlers. Blue: watch egress after ad clicks, then block-report-review.", "study": "T1583.008 malvertising chain: ad purchase → cloaking → redirectors → payload; response = block + report + review clickers.", "ex": "<p>From the attacker side, the ad is just another acquired resource, and cloaking is how they keep it alive. From the defender side, the tell is <b>timing<\/b>: fresh redirector domains that appear only after ad clicks. Both perspectives meet on the same artefact — the egress log.<\/p>", "steps": [{"add": "RED HAT ON. You want victims from search results with near-zero hosting cost.", "q": "What do you acquire first?", "out": "Ad account funded, ad live: “GPU Driver Update 2026 — official mirror”.", "opts": [{"i": 0, "o": {"t": "Search-engine ads that point to a trojanized installer", "c": true, "why": ["Buying ad placement is T1583.008: the ad is the acquired resource."]}}, {"i": 1, "o": {"t": "A billboard in the city centre", "c": false, "why": ["No targeting, no scale, no click tracking — wrong tool."]}}, {"i": 2, "o": {"t": "The search engine itself", "c": false, "why": ["You cannot buy the platform; you buy placement on it."]}}]}, {"add": "The ad network’s crawlers keep visiting your landing page and complaining.", "q": "According to ATT&amp;CK’s T1583.008 description, how do actors evade the ad network?", "out": "Crawler traffic now gets a clean software page; victims from real ad clicks get the payload.", "opts": [{"i": 0, "o": {"t": "Route crawler/policy-enforcer traffic to a benign page while sending real ad-click victims to the payload", "c": true, "why": ["ATT&amp;CK describes exactly this dynamic routing/cloaking against crawlers."]}}, {"i": 1, "o": {"t": "Pay the crawlers to look away", "c": false, "why": ["Crawlers are not bribeable; the description is about routing."]}}, {"i": 2, "o": {"t": "Turn off the landing page at night", "c": false, "why": ["That reduces reach and does not address crawler detection."]}}]}, {"add": "BLUE HAT ON. Several users clicked a sponsored result yesterday and one laptop now phones home.", "q": "Which telemetry catches the follow-on infrastructure?", "out": "Proxy shows three fresh redirector domains used only right after ad clicks.", "opts": [{"i": 0, "o": {"t": "Proxy + DNS logs showing fresh redirector domains contacted right after ad clicks", "c": true, "why": ["The redirectors are the acquired infra; egress logs are where they surface."]}}, {"i": 1, "o": {"t": "Firewall counters for port 25", "c": false, "why": ["Mail traffic is unrelated to this ad-driven delivery."]}}, {"i": 2, "o": {"t": "Badge access records", "c": false, "why": ["Physical access data cannot show web traffic."]}}]}, {"add": null, "q": "Final blue step — response?", "out": "Redirectors blocked, ad reported, click-forensics opens for the affected laptop.", "opts": [{"i": 0, "o": {"t": "Block the redirectors, report the ad to the platform, forensically review the users who clicked", "c": true, "why": ["Cut the acquired chain, evict the ad, and review exposures — proportional and reversible."]}}, {"i": 1, "o": {"t": "Wipe every laptop in the company", "c": false, "why": ["Massively disproportionate; destroys evidence."]}}, {"i": 2, "o": {"t": "Wait for more victims before doing anything", "c": false, "why": ["One confirmed click is already enough to act."]}}]}]}, {"id": "h04", "type": "match", "sum": "Match each artefact to the sub-technique it evidences", "scen": "Four artefacts landed in the CTI inbox. Match each to the T1583 sub-technique it best evidences.", "arts": [], "q": "Match each artefact to its sub-technique.", "hint": "One is a name, one is rented infected machines, one is code without servers, one is paid placement.", "study": "Artefact-to-technique mapping trains report writing: every claim needs the right T1583.x anchor.", "ex": "<p>Reports become precise when each artefact lands on one sub-technique. The whois card → .001, the booter receipt → .005, the Workers deploy → .007 (compare APT41 DUST using Cloudflare Workers for C2), and the ad spend → .008 (compare Mustard Tempest’s fake software ads).<\/p>", "pairs": [{"l": "Whois card: fresh domain, privacy service, parked nameservers", "r": "T1583.001 — Domains", "why": ["A freshly registered, hidden-ownership domain is the Domains signature."]}, {"l": "Receipt: 12-hour subscription to a booter/stresser service", "r": "T1583.005 — Botnet", "why": ["Booter subscriptions rent a botnet by the hour."]}, {"l": "Deploy log: “function created on Cloudflare Workers (free tier)”", "r": "T1583.007 — Serverless", "why": ["Cloudflare Workers are the named serverless example in ATT&amp;CK."]}, {"l": "Ad platform export: $2,000 spend on “GPU driver update” ads", "r": "T1583.008 — Malvertising", "why": ["Purchased ads pushing a fake download are Malvertising."]}]}, {"id": "h05", "type": "term", "sum": "Socket triage on a forensic copy", "scen": "You receive a read-only forensic copy of a small Linux VPS that a partner seized from a phishing host. You have a root shell on the analysis workstation. Task from the lead: “List every <b>listening TCP<\/b> socket <b>with the owning process<\/b>. Numeric output only — resolve no names.” The image is a minimal Debian; several legacy tools are simply not installed.", "arts": [], "q": "Type the command that lists listening TCP sockets with owning processes, numeric only.", "note": "Type the command, press Enter (or Run), then press Check.", "hint": "One modern tool does socket listing; it needs one letter for TCP, one for listening, one for numeric, one for processes.", "study": "ss flags: -t TCP, -l listening, -n numeric, -p processes; netstat is deprecated and absent here.", "ex": "<p><b>ss -tlnp<\/b> answers all four requirements at once. <b>-t<\/b> limits to TCP, <b>-l<\/b> to listening state, <b>-n<\/b> keeps addresses numeric, <b>-p<\/b> adds the owning process — here python3 running /opt/backup/agent.py on 443, a fake-backup agent on a phishing box. <b>-u<\/b> would drag UDP sockets into a TCP-only answer, and netstat is both deprecated and not installed on this image. On the defender side this is routine post-seizure triage; on the attacker side it is the footprint their C2 leaves the moment it starts listening.<\/p>", "term": {"prompt": "root@analysis:~#", "avail": ["ss", "lsof", "awk", "sort", "head", "grep", "cat"], "canonical": "ss -tlnp", "out": {"ss -tlnp": "State  Recv-Q Send-Q Local Address:Port  Peer Address:Port  Process\nLISTEN 0      128    0[.]0[.]0[.]0:22          0[.]0[.]0[.]0:*          users:((\"sshd\",pid=801,fd=3))\nLISTEN 0      128       [::]:22             [::]:*          users:((\"sshd\",pid=801,fd=4))\nLISTEN 0      511    0[.]0[.]0[.]0:443         0[.]0[.]0[.]0:*          users:((\"python3\",pid=4472,fd=6))\n  -> python3 /opt/backup/agent.py  (unpacked from a 2-day-old deploy)", "ss -tln": "State  Recv-Q Send-Q Local Address:Port  Peer Address:Port\nLISTEN 0      128    0[.]0[.]0[.]0:22          0[.]0[.]0[.]0:*\nLISTEN 0      511    0[.]0[.]0[.]0:443         0[.]0[.]0[.]0:*\n(matches the correct output, but without the owning process)", "ss -tlp": "State  Recv-Q Send-Q Local Address:Port  Peer Address:Port\nLISTEN 0      128    0[.]0[.]0[.]0:22          0[.]0[.]0[.]0:*\nLISTEN 0      511    0[.]0[.]0[.]0:443         0[.]0[.]0[.]0:*\n(names resolved — the lead asked for numeric output)", "ss -tulpn": "State  Recv-Q Send-Q Local Address:Port  Peer Address:Port  Process\nLISTEN 0      128    0[.]0[.]0[.]0:22          0[.]0[.]0[.]0:*          users:((\"sshd\",pid=801,fd=3))\nLISTEN 0      128    0[.]0[.]0[.]0:68          0[.]0[.]0[.]0:*          users:((\"dhclient\",pid=512,fd=7))  <- UDP\nLISTEN 0      511    0[.]0[.]0[.]0:443         0[.]0[.]0[.]0:*          users:((\"python3\",pid=4472,fd=6))"}, "elements": [{"re": "(^| )ss( |$)", "name": "tool: ss", "desc": "The modern socket-statistics tool present on this image."}, {"re": "(^|\\s)-[a-z]*t", "name": "flag: -t (TCP)", "desc": "The task asked for TCP sockets only."}, {"re": "(^|\\s)-[a-z]*l", "name": "flag: -l (listening)", "desc": "Listening state only, not all connections."}, {"re": "(^|\\s)-[a-z]*n", "name": "flag: -n (numeric)", "desc": "No name resolution, as the lead required."}, {"re": "(^|\\s)-[a-z]*p", "name": "flag: -p (process)", "desc": "Show the owning process — the actual goal."}], "forbidden": [{"re": "(^| )netstat", "name": "netstat", "desc": "Not installed on this minimal image, and deprecated on modern distributions — the wrong tool choice."}, {"re": "-u", "name": "flag: -u (UDP)", "desc": "Adds UDP sockets; the task asked for listening TCP only — a near-miss flag that silently changes the answer."}]}, "terminal": true, "avail": ["ss", "lsof", "awk", "sort", "head", "grep", "cat"]}, {"id": "h06", "type": "qcm", "sum": "Attribution caution: infrastructure overlap", "scen": "Two campaigns share one registrar, one hosting ASN and similar certificate patterns. A teammate wants to publish “same group confirmed”. The infra could also belong to the same bulletproof reseller serving several customers.", "arts": [], "q": "Which conclusion is defensible in the report?", "note": null, "hint": "The lead’s habit to train: state confidence, then name the alternative explanation.", "study": "Attribution via infrastructure: overlap suggests, resellers blur, confidence language keeps reports honest.", "ex": "<p>Infrastructure gives <b>suggestive<\/b> evidence. One registrar, one ASN and cert patterns can mean one operator — or one lazy reseller serving many. Professional practice: publish the overlap, grade it <i>moderate<\/i>, and list the reseller hypothesis. ATT&amp;CK’s own group pages keep the same discipline with “associated” instead of “confirmed”.<\/p>", "opts": [{"t": "Moderate confidence of shared operators, noting that a shared reseller can create the same overlap", "c": true, "why": ["Confidence levels plus named alternatives is the defensible standard; resellers blur ownership by design."]}, {"t": "Declare it is definitely the same group, because three independent signals align perfectly", "c": false, "why": ["Infrastructure overlap alone cannot confirm identity; ATT&amp;CK-style reporting avoids overclaims."]}, {"t": "Say infrastructure never proves anything, drop the lead, and stop the analysis here", "c": false, "why": ["Swing from overclaim to dismissal is equally wrong — overlap is evidence, just not proof."]}, {"t": "Blame the hosting company for the attacks and publish the ASN as the threat actor", "c": false, "why": ["The host is a service provider, not the operator; this is not an attribution statement."]}]}, {"id": "h07", "type": "multi", "sum": "Controls that blunt domain-based phishing", "scen": "Your CISO asks which controls actually reduce the impact of phishing built on acquired lookalike domains. Six options are on the table. Select ALL that genuinely help against <b>T1583.001-style lookalike domains<\/b>.", "arts": [], "q": "Select ALL controls that help against lookalike-domain phishing.", "note": "Select <b>ALL<\/b> that apply. Partial credit applies.", "hint": "One option is the classic near-miss: it protects a different name than the one being faked.", "study": "DMARC protects your own domain from spoofing, not lookalikes; NRD feeds, takedowns, training and similarity rules target acquired lookalikes.", "ex": "<p>The near-miss is DMARC — a real best practice for a different problem (direct domain spoofing). The attacker’s lookalike is a legitimately registered domain they own, so DMARC never sees it. The four working controls all target the <b>acquired name<\/b>: catch it fresh, remove it, warn users about it, or flag its mail.<\/p>", "opts": [{"t": "A newly-registered-domain feed with fast blocking", "c": true, "why": ["Fresh lookalikes are exactly what NRD feeds catch; the fresh window is where blocking is safest."]}, {"t": "Brand monitoring plus registrar takedown requests", "c": true, "why": ["Takedowns remove the acquired name at the source — slow but decisive."]}, {"t": "User training that shows real lookalike and homoglyph examples", "c": true, "why": ["Training targets the exact deception the domain performs."]}, {"t": "Mail rules that flag sender domains similar to your brand", "c": true, "why": ["Lookalike-similarity rules catch the deception at the gateway."]}, {"t": "Enforcing DMARC on your own domain", "c": false, "why": ["DMARC stops spoofing of YOUR domain. It does nothing against a lookalike domain the attacker registered."]}, {"t": "Disabling email during every campaign", "c": false, "why": ["Operationally impossible and disproportionate; it is not a control."]}]}, {"id": "h08", "type": "order", "sum": "Order the certificate-transparency hunt", "scen": "You build a repeatable CT-log hunt for lookalike infrastructure. Put the five steps in working order.", "arts": [], "q": "Order the five steps from first to last.", "note": "Put the steps in the correct order. Use the arrows or drag the rows.", "hint": "Collect the raw stream first, narrow it, enrich it, check exposure, then act.", "study": "CT-log hunt pipeline: collect → filter → enrich → check exposure → respond.", "ex": "<p>The order turns raw logs into action: collection gives volume, filtering gives candidates, enrichment gives judgement (age + ASN), exposure-checking gives urgency, and response closes the loop. Every skipped step weakens the next one — blocking without enrichment is how the HR campaigns of the world get broken.<\/p>", "items": [{"t": "Collect certificate-transparency logs for your brand terms"}, {"t": "Filter for lookalikes: typos, homoglyphs, new TLDs"}, {"t": "Enrich survivors with WHOIS age and hosting ASN"}, {"t": "Check proxy and DNS logs for any internal visits"}, {"t": "Escalate, block, and request a takedown"}]}, {"id": "h09", "type": "logq", "sum": "Looks benign but is alarming", "scen": "The DNS log shows one new name that resembles a CDN. No brand match. No ticket. Read the enrichment below the log.", "arts": [], "q": "Which is the strongest reason to escalate assets-cdn-analytics[.]net?", "note": null, "hint": "Compare what a real CDN would look like (big ASNs, aged certs) with what the enrichment shows.", "study": "Dressed-up names inherit no trust: check cert age and ASN before believing a CDN-looking name.", "ex": "<p>This is the “looks benign, is alarming” trap. The name borrows CDN vocabulary, but the enrichment breaks the costume: a 2-day-old domain with a 2-day-old certificate hosted on a small VPS provider that runs no CDN. Real CDNs live on giant, aged networks. Certificates issued at registration time are one of the cleanest acquired-infrastructure signals.<\/p>", "log": ";; DNS resolver log 2026-10-14\n08:12:44  query  assets-cdn-analytics[.]net  A  ->  45[.]61[.]187[.]77\n08:12:45  query  assets-cdn-analytics[.]net  AAAA ->  NXDOMAIN\n08:14:02  query  assets-cdn-analytics[.]net  A  ->  45[.]61[.]187[.]77\n# whois: created 2026-10-12 (2 days), privacy service\n# cert: issued 2026-10-12 to assets-cdn-analytics[.]net, Let's Encrypt\n# ASN 204601: small VPS provider, no CDN business\n# brand match: none; ticket match: none", "logLabel": "DNS resolver log + enrichment (2026-10-14)", "widget": {"type": "qcm", "opts": [{"t": "The certificate was issued the day the domain was registered, and the IP sits in a small VPS range with no CDN business", "c": true, "why": "Cert-at-registration plus a hosting range with no CDN business is the acquired-infrastructure fingerprint."}, {"t": "The name is unusually long for a CDN asset host, which no established operator would ever choose", "c": false, "why": "Name length is cosmetic; real CDNs and attackers both use long names."}, {"t": "It uses a .net name like many real CDNs, so it is clearly impersonating one of the major providers", "c": false, "why": "A TLD choice tells nothing; .net hosts every kind of service, benign and malicious."}, {"t": "It resolved only twice in the whole log, which proves the attacker is still quietly staging the host", "c": false, "why": "Low volume alone is not an escalation reason; caching and staging easily explain two queries."}]}}, {"id": "h10", "type": "qcm", "sum": "Attacker trade-off: the aged auction domain", "scen": "You observe an actor that paid for a 6-year-old domain on an expired-domain auction instead of registering a fresh name. The domain previously hosted a small trucking blog.", "arts": [], "q": "Why would the actor pay for age?", "note": null, "hint": "Think about which defender controls measure age — and what an old name does to them.", "study": "Expired/aged domain acquisition (T1583.001) inherits reputation and defeats fresh-domain controls.", "ex": "<p>ATT&amp;CK’s T1583.001 text is explicit: adversaries repurpose expired domains that may already be allowlisted or trusted based on existing history. The buyer inherits reputation like a used car inherits a clean service book. Defender view: any control keyed on age alone must add reputation, ASN and cert-age signals, or aged purchases sail through.<\/p>", "opts": [{"t": "The domain already has age and reputation, so feeds and filters that key on fresh registrations never fire", "c": true, "why": ["Aged acquisitions defeat age-based controls — exactly the gap in many “block new domains” policies."]}, {"t": "Auction domains always include free hosting and a ready-made website the actor can reuse", "c": false, "why": ["Auctions transfer the name only; hosting is separate."]}, {"t": "Older domain names load their pages faster because of long-established cache entries", "c": false, "why": ["Speed is unaffected by registration age."]}, {"t": "Age physically hides the operator from investigators who trace registrations backwards", "c": false, "why": ["Registration age says nothing about the operator’s location."]}]}, {"id": "h11", "type": "fill", "sum": "Complete the IR timeline entry", "scen": "You are writing the timeline entry for the phishing host. Use the artefacts to fill the four blanks.", "arts": [{"label": "WHOIS card — invoice-nwind[.]com", "text": "Registrar: NameSilo, LLC\nCreation Date: 2026-10-09\nRegistrant: Privacy service, Reykjavik, IS"}, {"label": "Hosting card", "text": "A record: 45[.]61[.]187[.]31\nASN: 204601 (small VPS ure that is “rapidly provisioned, modified, and shut down”.<\/p>", "steps": [{"add": null, "q": "Step 1 — Zero credentials submitted yet. What do you do?", "out": "Watching continues; the takedown evidence pack is prepared but not filed.", "opts": [{"i": 0, "o": {"t": "Monitor with alerting while legal prepares the takedown", "c": true, "why": ["Live infrastructure under watch gives telemetry on victims and the operator — visibility you lose forever once it goes down."]}}, {"i": 1, "o": {"t": "File the takedown immediately", "c": false, "why": ["Takedown removes your visibility and the actor simply redeploys somewhere you cannot see."]}}, {"i": 2, "o": {"t": "Log into the fake page to test it", "c": false, "why": ["Touching attacker infrastructure creates noise and legal exposure."]}}]}, {"add": null, "q": "Step 2 — Four users’ credentials were submitted in the last hour. Now?", "out": "Passwords reset for the four users; domain blocked; takedown filed with the WHOIS and cert evidence.", "opts": [{"i": 0, "o": {"t": "Force resets for the affected accounts, block, and file the takedown", "c": true, "why": ["The cost (brief account downtime, user friction) is now justified by real exposure."]}}, {"i": 1, "o": {"t": "Keep only monitoring — the page is valuable telemetry", "c": false, "why": ["Exposed credentials outweigh visibility; monitoring alone leaves four accounts open to takeover."]}}, {"i": 2, "o": {"t": "Reply to the victims’ emails asking for details", "c": false, "why": ["Victims need action, not questionnaires; also, there were no emails to reply to."]}}]}, {"add": null, "q": "Step 3 — After the takedown, the same page reappears on a new host within a day. Now?", "out": "New host blocked, re-registration watch enabled, registrar network notified with the cluster evidence.", "opts": [{"i": 0, "o": {"t": "Re-takedown, block the new host, and share the cluster evidence with registrars and peers", "c": true, "why": ["Rotation is expected; each round burns attacker money while your evidence grows."]}}, {"i": 1, "o": {"t": "Declare the takedown a failure and stop", "c": false, "why": ["Takedowns work by attrition, not by one-shot wins."]}}, {"i": 2, "o": {"t": "Pay the operator to stop", "c": false, "why": ["Never negotiate; it funds and encourages the operation."]}}]}]}]};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function el(tag,cls,html){var e=document.createElement(tag);if(cls){e.className=cls;}if(html!=null){e.innerHTML=html;}return e;}
function fmtT(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function copyTxt(btn,txt){try{navigator.clipboard.writeText(txt).then(function(){btn.textContent='Copied';setTimeout(function(){btn.textContent='Copy';},1200);},function(){});}catch(e){}}
function hl(text){
  var lines=String(text).split('\n'),out=[];
  for(var i=0;i<lines.length;i++){
    var L=esc(lines[i]);
    L=L.replace(/^(\d{4}-\d{2}-\d{2}[T ][\d:.Z+-]*)/,'<span class="t-ts">$1</span>');
    L=L.replace(/^(\d{2}:\d{2}:\d{2})/,'<span class="t-ts">$1</span>');
    L=L.replace(/(\d{1,3}\[\.\]){3}\d{1,3}/g,'<span class="t-ip">$&</span>');
    L=L.replace(/([a-z0-9][a-z0-9-]*\[\.\])+(com|net|org|io|ru|cn|su|top|xyz|info|biz|online|shop|site|link|live|app|dev|co|uk|de|fr|nl|is|cc|tv|me|gov|edu|mil)\b/gi,'<span class="t-dom">$&</span>');
    L=L.replace(/hxxps?:\/\/[^\s<"'）)]+/g,'<span class="t-url">$&</span>');
    L=L.replace(/\b(GET|POST|DNS|TXT|TLS|SSL|HTTP|HTTPS|OK|FAILED|query|response|53)\b/g,'<span class="t-kw">$&</span>');
    out.push(L);
  }
  return out.join('\n');
}
function artsHTML(exd){

  var h='';
  for(var i=0;i<exd.arts.length;i++){

  return h;
}

/* ================= scoring core (contract) ================= */
/* scoreExercise(selectedItems, correctItems, optTotal) -> credit in [0,1]
   H = |selected & correct|, W = |selected \ correct|, N = optTotal or correct.length
   credit = max(0, (H - W) / N) */
function scoreExercise(selectedItems, correctItems, optTotal){
  var corr={};for(var i=0;i<correctItems.length;i++){corr[correctItems[i]]=true;}
  var H=0,W=0,seen={};
  for(var j=0;j<selectedItems.length;j++){
    var id=selectedItems[j];
    if(seen[id]){continue;}
    seen[id]=true;
    if(corr[id]){H++;}else{W++;}
  }
  var N=(typeof optTotal==='number')?optTotal:correctItems.length;
  if(N<=0){return 0;}
  return Math.max(0,(H-W)/N);
}

/* ================= timer state machine =================
   States: RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED        */
function setState(st){S.tState=st;renderHeader();}
function startTimer(){
  if(S.tick){clearInterval(S.tick);}
  setState('RUNNING');
  S.tick=setInterval(function(){
    if(S.tState!=='RUNNING'){return;}
    S.remaining--;
    if(S.remaining<=0){S.remaining=0;renderHeader();timerEnd();return;}
    renderHeader();
  },1000);
}
function stopTick(){if(S.tick){clearInterval(S.tick);S.tick=null;}}
function pauseAuto(){ /* Check pressed: first action = stop the clock, before feedback renders */
  if(S.tState==='RUNNING'){S.pauseStart=Date.now();setState('PAUSED_AUTO_CHECK');}
}
function pauseManual(){
  if(S.tState==='RUNNING'||S.tState==='PAUSED_AUTO_CHECK'){
    S.pauseStart=Date.now();
    S.resumeTo=(S.tState==='PAUSED_AUTO_CHECK')?'PAUSED_AUTO_CHECK':'RUNNING';
    setState('PAUSED_MANUAL');
    showOverlay(true);
  }
}
function resumeManual(){
  if(S.tState!=='PAUSED_MANUAL'){return;}
  var d=Math.max(0,Math.round((Date.now()-S.pauseStart)/1000));
  if(S.resumeTo==='PAUSED_AUTO_CHECK'){S.autoSec+=d;}else{S.manualSec+=d;}
  showOverlay(false);
  setState(S.resumeTo||'RUNNING');
}
function timerEnd(){stopTick();S.tState='ENDED';renderHeader();endExam(true);}

/* per-exercise reduced timer (EXTREMELY HARD terminal only) */
function startPerEx(sec){
  S.perExRemaining=sec;
  if(S.perExHandle){clearInterval(S.perExHandle);}
  S.perExHandle=setInterval(function(){
    if(S.tState!=='RUNNING'||S.perExHandle===null){return;}
    S.perExRemaining--;
    var c=document.getElementById('perx-time');
    if(c){c.textContent=fmtT(Math.max(0,S.perExRemaining));}
    if(S.perExRemaining<=0){stopPerEx();perExExpire();}
  },1000);
}
function stopPerEx(){if(S.perExHandle){clearInterval(S.perExHandle);S.perExHandle=null;}}

  sb.innerHTML='<div class="blk-h h-scen"><span class="bico" aria-hidden="true">☰</span> SCENARIO'
    +'<button class="tgl" type="button" aria-expanded="true" aria-label="Collapse or expand scenario">▾</button></div>'
    +'<div class="sumline">'+esc(exd.sum)+'</div>'
    +'<div class="blk-b collapsible"><div class="prose">'+exd.scen+'</div>'+artsHTML(exd)+'</div>';
  card.appendChild(sb);
  sb.querySelector('.tgl').addEventListener('click',function(){
    sb.classList.toggle('collapsed');
    this.textContent=sb.classList.contains('collapsed')?'▸':'▾';
    this.setAttribute('aria-expanded',sb.classList.contains('collapsed')?'false':'true');
  });

  /* QUESTION */
  var qb=el('section','blk');
  qb.innerHTML='<div class="blk-h h-q"><span class="bico" aria-hidden="true">?</span> QUESTION</div>'
    +'<div class="blk-b"><b>'+exd.q+'</b>'+(exd.note?'<div class="qnote">'+exd.note+'</div>':'')+'</div>';
  card.appendChild(qb);

  /* YOUR ANSWER */
  var ab=el('section','blk blk-a');
  var abody=el('div','blk-b');
  ab.innerHTML='<div class="blk-h h-a"><span class="bico" aria-hidden="true">✎</span> YOUR ANSWER</div>';
  ab.appendChild(abody);
  card.appendChild(ab);

  var api={
    mark:function(){hasAnswer=true;if(btnCheck){btnCheck.disabled=false;}},
    lock:function(){locked=true;}
  };
  var WIDGETS={qcm:WQCM,multi:WMULTI,match:WMATCH,dd:WDD,order:WORDER,fill:WFILL,term:WTERM,branch:WBRANCH,triage:WTRIAGE};
  var gt=effType(exd);
  if(exd.type==='logq'){renderLogPanel(abody,exd);}
  var wbox=el('div','wbox');
  abody.appendChild(wbox);
  var baseGrade=WIDGETS[gt](wbox,exd.type==='logq'?exd.widget:exd,api);
  curGrade=function(){
    var g=baseGrade();
    if(!g.exHTML){g.exHTML=exd.ex;}
    if(g.dangerHTML==null){g.dangerHTML='';}
    return g;
  };

  var hintBox=el('div','hintbox-slot');
  card.appendChild(hintBox);

  var fbzone=el('div','fbzone');
  fbzone.setAttribute('aria-live','polite');
  card.appendChild(fbzone);

  /* nav */
  var nav=el('div','nav');
  var btnCheck=el('button','btn primary','Check');
  btnCheck.type='button';btnCheck.disabled=!hasAnswer; /* sync initial state (widgets may have marked already) */
  var btnNext=el('button','btn danger');btnNext.type='button';btnNext.style.display='none';
  var isLast=(S.pos>=S.order.length-1);
  nav.appendChild(btnCheck);nav.appendChild(btnNext);
  nav.appendChild(el('div','spacer'));
  card.appendChild(nav);
  main.appendChild(card);

  /* per-exercise reduced timer */
  if(exd.perSec&&!fromReview){
    var px=el('div','perx','<span aria-hidden="true">⏱</span> This exercise has its own reduced timer: <span id="perx-time">'+fmtT(exd.perSec)+'</span> — it does not stop the main exam clock. If it runs out, the exercise is excluded.');
    abody.insertBefore(px,wbox);
    startPerEx(exd.perSec);
  }

  btnCheck.addEventListener('click',function(){
    if(!hasAnswer||locked){return;}
    pauseAuto();                       /* first action: stop the clock before feedback */
    var g=curGrade();
    var pen=S.hint[i]?0.10:0;
    var credit=Math.max(0,g.credit-pen);
    S.credit[i]=credit;S.answered[i]=true;
    if(S.reviewReturn){removeFromSkip(i);}
    renderFeedback(fbzone,exd,g,credit,pen);
    lockWidget(abody);
    btnCheck.disabled=true;
    stopPerEx();
    btnNext.textContent=isLast?'Final Submit':'Next exercise';
    btnNext.style.display='';
    btnNext.focus();
    renderHeader();
  });
  btnNext.addEventListener('click',onNext);
  renderHeader();
}
function lockWidget(abody){
  locked=true;
  var list=abody.querySelectorAll('button,input,select');
  for(var i=0;i<list.length;i++){
    var b=list[i];
    if(b.classList.contains('tgl')){continue;}
    b.disabled=true;
  }
}
function removeFromSkip(i){
  var p=S.skip.indexOf(i);
  if(p>=0){S.skip.splice(p,1);}
  delete S.skipSet[i];
}

/* skip / hint / next */
function onSkip(){
  if(locked){return;}
  if(!S.skipSet[S.cur]){S.skip.push(S.cur);S.skipSet[S.cur]=true;}
  S.reviewReturn=false; /* rejoining the main flow: do not bounce back to the review screen later */
  stopPerEx();
  if(S.pos>=S.order.length-1){
    if(S.skip.length>0){screenReview();}else{endExam(false);}
  }else{
    S.pos++;renderExercise(S.order[S.pos],false);
  }
}
function onHint(){
  if(S.hint[S.cur]||locked){return;}
  S.hint[S.cur]=true;
  var exd=DATA.exercises[S.cur];
  var hb=document.querySelector('.hintbox-slot');
  if(hb){hb.innerHTML='<div class="hintbox"><b>Hint</b> — '+exd.hint+' <span class="hintcost">(costs 10% of this exercise\'s credit)</span></div>';}
  document.getElementById('btn-hint').disabled=true;
}
function onNext(){
  if(S.tState==='PAUSED_AUTO_CHECK'){setState('RUNNING');}
  /* Next is only reachable after Check (it is hidden until then); if it ever
     fires with the current exercise unanswered, do nothing rather than
     silently abandoning the exercise. */
  if(!S.answered[S.cur]){return;}
  var isLast=(S.pos>=S.order.length-1);
  if(S.reviewReturn){S.reviewReturn=false;screenReview();return;}
  if(!isLast){S.pos++;renderExercise(S.order[S.pos],false);}
  else{
    if(S.skip.length>0){screenReview();}else{endExam(false);}
  }
}

/* ================= feedback ================= */
function fbLabel(credit){
  if(credit>=1){return ['ok','✓','CORRECT'];}
  if(credit>0){return ['part','✓','PARTIALLY CORRECT'];}
  return ['bad','✗','INCORRECT'];
}
function renderFeedback(zone,exd,g,credit,pen){
  var L=fbLabel(credit);
  var h='<div class="fb '+L[0]+'"><div class="fb-h"><span aria-hidden="true">'+L[1]+'</span> '+L[2]
    +(pen?'<span class="hintcost">· hint used: −0.10 credit</span>':'')+'</div><div class="fb-b">';
  h+='<div class="fbc">credit '+credit.toFixed(2)+(g.N?' — '+g.H+'/'+g.N+' items · (H − W) / N = ('+g.H+' − '+g.W+') / '+g.N:'')+'</div>';
  if(g.items&&g.items.length){
    h+='<ul class="fb-items">';
    for(var i=0;i<g.items.length;i++){
      var it=g.items[i];
      var ic=it.status==='ok'?'<span class="icook">✓ Correct</span>':it.status==='bad'?'<span class="icbad">✗ Wrong</span>':'<span class="icmiss">○ Missed</span>';
      h+='<li class="'+(it.status==='ok'?'i-ok':it.status==='bad'?'i-bad':'i-miss')+'">'+ic+' — <b>'+it.label+'</b>'+(it.note?'<br>'+it.note:'')+'</li>';
    }
    h+='</ul>';
  }
  if(g.dangerHTML){h+='<div class="danger-note">⚠ '+g.dangerHTML+'</div>';}
  h+='<div class="prose">'+g.exHTML+'</div>';
  h+='<div class="study"><b>What to study:</b> '+exd.study+'</div>';
  h+='</div></div>';
  zone.innerHTML=h;
  if(g.postRender){g.postRender(zone);}
}

/* ================= widgets ================= */
function WQCM(box,exd,api){
  var st={sel:null};
  var opts=exd.opts.map(function(o,i){return {o:o,i:i};});
  opts=shuffle(opts);
  var wrap=el('div','opts');
  var letters=['A','B','C','D','E','F'];
  opts.forEach(function(p,k){
    var b=el('button','opt');
    b.type='button';
    b.innerHTML='<span class="lbl">'+letters[k]+'.</span><span>'+p.o.t+'</span>';
    b.setAttribute('aria-pressed','false');
    b.addEventListener('click',function(){
      st.sel=p.i;
      var all=wrap.querySelectorAll('.opt');
      for(var z=0;z<all.length;z++){all[z].classList.remove('sel');all[z].setAttribute('aria-pressed','false');}
      b.classList.add('sel');b.setAttribute('aria-pressed','true');api.mark();
    });
    wrap.appendChild(b);
  });
  box.appendChild(wrap);
  return function(){
    var correct=-1;
    for(var i=0;i<exd.opts.length;i++){if(exd.opts[i].c){correct=i;break;}}
    var selArr=(st.sel==null)?[]:[st.sel];
    var credit=scoreExercise(selArr,[correct],1);
    var items=[];
    exd.opts.forEach(function(o,i){
      if(i===correct){items.push({label:o.t,status:(st.sel===i)?'ok':'miss',note:o.why||''});}
      else if(st.sel===i){items.push({label:o.t,status:'bad',note:o.why||''});}
    });
    return {credit:credit,H:(st.sel===correct?1:0),W:(st.sel!=null&&st.sel!==correct?1:0),N:1,items:items,exHTML:exd.ex,dangerHTML:null};
  };
}
function WMULTI(box,exd,api){
  var st={sel:{}};
  var opts=shuffle(exd.opts.map(function(o,i){return {o:o,i:i};}));
  var wrap=el('div','opts');
  var letters=['A','B','C','D','E','F','G'];
  opts.forEach(function(p,k){
    var b=el('button','opt');
    b.type='button';
    b.setAttribute('aria-pressed','false');
    b.innerHTML='<span class="box" aria-hidden="true"></span><span class="lbl">'+letters[k]+'.</span><span>'+p.o.t+'</span>';
    b.addEventListener('click',function(){
      st.sel[p.i]=!st.sel[p.i];
      if(!st.sel[p.i]){delete st.sel[p.i];}
      b.classList.toggle('sel',!!st.sel[p.i]);
      b.setAttribute('aria-pressed',st.sel[p.i]?'true':'false');
      api.mark();
    });
    wrap.appendChild(b);
  });
  box.appendChild(wrap);
  return function(){
    var correct=[];
    for(var i=0;i<exd.opts.length;i++){if(exd.opts[i].c){correct.push(i);}}
    var selArr=[];for(var k in st.sel){if(st.sel[k]){selArr.push(parseInt(k,10));}}
    var N=correct.length;
    var corr={};correct.forEach(function(i){corr[i]=true;});
    var H=0,W=0;
    selArr.forEach(function(i){if(corr[i]){H++;}else{W++;}});
    var credit=scoreExercise(selArr,correct,N);

      var picked=!!st.sel[i];

      else if(picked){items.push({label:o.t,status:'bad',note:o.why||'This does not belong in the answer set.'});}
    });
    return {credit:credit,H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:null};
  };
}
function WMATCH(box,exd,api){

function WDD(box,exd,api){
  var zones={};exd.zones.forEach(function(z){zones[z.k]=z;});
  var wrap=el('div','ddwrap');
  var bank=el('div','bank');bank.setAttribute('aria-label','Item bank');
  var zg=el('div','zones');
  exd.zones.forEach(function(z){
    var d=el('div','zone');d.setAttribute('data-zone',z.k);
    d.innerHTML='<div class="zone-h">'+esc(z.n)+'</div>';
    d.appendChild(el('div','zone-items'));
    zg.appendChild(d);
  });
  wrap.appendChild(bank);wrap.appendChild(zg);
  box.appendChild(wrap);
  var st={}; /* item index -> zone key or absent */
  function place(chip,zd){
    zd.querySelector('.zone-items').appendChild(chip);
    st[chip.getAttribute('data-i')]=zd.getAttribute('data-zone');
    chip.classList.remove('picked');
    api.mark();
  }
  var picked=null,drag=null;
  function zoneAt(x,y){
    var els=document.elementsFromPoint?document.elementsFromPoint(x,y):[];
    for(var i=0;i<els.length;i++){if(els[i].classList&&els[i].classList.contains('zone')){return els[i];}}
    return null;
  }
  var ordered=exd.items.map(function(it,i){return {it:it,i:i};});
  var items=shuffle(ordered);
  items.forEach(function(p){
    var c=el('span','chip',esc(p.it.t));
    c.setAttribute('data-i',p.i);
    bank.appendChild(c);
  });
  wrap.addEventListener('pointerdown',function(e){
    var chip=e.target.closest?e.target.closest('.chip'):null;
    if(!chip||locked){return;}
    drag={chip:chip,sx:e.clientX,sy:e.clientY,pid:e.pointerId,ghost:null,moved:false};
    try{chip.setPointerCapture(e.pointerId);}catch(err){}
  });
  wrap.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.pid){return;}
    var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(!drag.moved&&(Math.abs(dx)>7||Math.abs(dy)>7)){
      drag.moved=true;
      var g=drag.chip.cloneNode(true);
      g.className='chip ghost';g.style.width=drag.chip.offsetWidth+'px';
      document.body.appendChild(g);drag.ghost=g;drag.chip.classList.add('src');
    }
    if(drag.moved){
      if(drag.ghost){drag.ghost.style.left=(e.clientX+10)+'px';drag.ghost.style.top=(e.clientY+10)+'px';}
      var z=zoneAt(e.clientX,e.clientY);
      var all=zg.querySelectorAll('.zone.over');
      for(var i=0;i<all.length;i++){all[i].classList.remove('over');}
      if(z){z.classList.add('over');}
      e.preventDefault();
    }
  });
  wrap.addEventListener('pointerup',function(e){
    if(!drag||e.pointerId!==drag.pid){return;}
    if(drag.moved){
      var z=zoneAt(e.clientX,e.clientY);
      var all=zg.querySelectorAll('.zone.over');
      for(var i=0;i<all.length;i++){all[i].classList.remove('over');}
      if(z){place(drag.chip,z);}
      if(drag.ghost){drag.ghost.remove();}
      drag.chip.classList.remove('src');
    }else{
      var ch=drag.chip;
      if(picked===ch){ch.classList.remove('picked');picked=null;}
      else{
        if(picked){picked.classList.remove('picked');}
        if(ch.parentElement&&ch.parentElement.classList&&ch.parentElement.classList.contains('zone-items')){
          bank.appendChild(ch);delete st[ch.getAttribute('data-i')];
        }else{picked=ch;ch.classList.add('picked');}
      }
    }
    drag=null;
  });
  wrap.addEventListener('click',function(e){
    if(!picked||locked){return;}
    var z=e.target.closest?e.target.closest('.zone'):null;
    if(z){place(picked,z);picked.classList.remove('picked');picked=null;}
  });
  return function(){
    var N=exd.items.length;
    var corr=[],selArr=[],items=[];
    exd.items.forEach(function(it,i){
      corr.push('ok:'+i);
      var zname='';
      for(var z=0;z<exd.zones.length;z++){if(exd.zones[z].k===it.z){zname=exd.zones[z].n;break;}}
      var v=st[i]||'';
      if(!v){items.push({label:it.t+' → '+zname,status:'miss',note:it.why||''});}
      else if(v===it.z){selArr.push('ok:'+i);items.push({label:it.t+' → '+zname,status:'ok',note:it.why||''});}
      else{selArr.push('bad:'+i);items.push({label:it.t+' — you placed it in "'+zones[v].n+'", correct is "'+zname+'"',status:'bad',note:it.why||''});}
    });
    var H=0,W=0;
    selArr.forEach(function(x){if(x.indexOf('ok:')===0){H++;}else{W++;}});
    return {credit:scoreExercise(selArr,corr,N),H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:null};
  };
}
function WORDER(box,exd,api){
  var st={};
  st.seq=shuffle(exd.items.map(function(_,i){return i;}));
  var wrap=el('div','olist');
  box.appendChild(wrap);
  function draw(){
    wrap.innerHTML='';
    st.seq.forEach(function(i,pos){
      var row=el('div','orow');row.setAttribute('data-i',i);
      row.innerHTML='<span class="onum">'+(pos+1)+'</span><span class="otxt">'+esc(exd.items[i].t)+'</span>'
        +'<span class="obtns"><button class="obtn" type="button" data-mv="-1" aria-label="Move up">↑</button>'
        +'<button class="obtn" type="button" data-mv="1" aria-label="Move down">↓</button></span>';
      wrap.appendChild(row);
    });
  }
  draw();
  api.mark(); /* the initial (shuffled) order is itself a valid submission state */
  wrap.addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('.obtn'):null;
    if(!b||locked){return;}
    var row=b.closest('.orow');
    var i=st.seq.indexOf(parseInt(row.getAttribute('data-i'),10));
    var d=parseInt(b.getAttribute('data-mv'),10);
    var j=i+d;
    if(j<0||j>=st.seq.length){return;}
    var t=st.seq[i];st.seq[i]=st.seq[j];st.seq[j]=t;
    draw();api.mark();
  });
  var drag=null;
  wrap.addEventListener('pointerdown',function(e){
    if(locked){return;}
    var row=e.target.closest?e.target.closest('.orow'):null;
    if(!row||(e.target.closest&&e.target.closest('.obtn'))){return;}
    drag={row:row,sy:e.clientY,pid:e.pointerId,moved:false};
    try{row.setPointerCapture(e.pointerId);}catch(err){}
  });
  wrap.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.pid){return;}
    if(!drag.moved&&Math.abs(e.clientY-drag.sy)>7){drag.moved=true;drag.row.classList.add('dragging');}
    if(!drag.moved){return;}
    e.preventDefault();
    var rows=wrap.querySelectorAll('.orow');
    for(var i=0;i<rows.length;i++){
      var r=rows[i];
      if(r===drag.row){continue;}
      var rc=r.getBoundingClientRect();
      if(e.clientY>rc.top&&e.clientY<rc.bottom){
        if(e.clientY<rc.top+rc.height/2){wrap.insertBefore(drag.row,r);}
        else{wrap.insertBefore(drag.row,r.nextSibling);}
        break;
      }
    }
  });
  wrap.addEventListener('pointerup',function(e){
    if(!drag||e.pointerId!==drag.pid){return;}
    if(drag.moved){
      drag.row.classList.remove('dragging');
      var newSeq=[];
      var rows=wrap.querySelectorAll('.orow');
      for(var i=0;i<rows.length;i++){newSeq.push(parseInt(rows[i].getAttribute('data-i'),10));}
      st.seq=newSeq;api.mark();
    }
    drag=null;
  });
  return function(){
    var N=exd.items.length;
    var corr=[],selArr=[],items=[];
    st.seq.forEach(function(itemIdx,pos){
      corr.push('ok:'+pos);
      if(itemIdx===pos){selArr.push('ok:'+pos);items.push({label:'Position '+(pos+1)+' — '+exd.items[pos].t,status:'ok'});}
      else{selArr.push('bad:'+pos);items.push({label:'Position '+(pos+1)+' — you put "'+exd.items[itemIdx].t+'", correct is "'+exd.items[pos].t+'"',status:'bad'});}
    });
    var H=0,W=0;
    selArr.forEach(function(x){if(x.indexOf('ok:')===0){H++;}else{W++;}});
    return {credit:scoreExercise(selArr,corr,N),H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:null};
  };
}

      else if(v===sg.a){selArr.push('ok:'+bi);items.push({label:'Blank '+(bi+1)+' → "'+sg.a+'"',status:'ok',note:sg.why||''});}
      else{selArr.push('bad:'+bi);items.push({label:'Blank '+(bi+1)+' — you chose "'+v+'", correct is "'+sg.a+'"',status:'bad',note:sg.why||''});}
      bi++;
    });
    var H=0,W=0;
    selArr.forEach(function(x){if(x.indexOf('ok:')===0){H++;}else{W++;}});
    return {credit:scoreExercise(selArr,corr,N),H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:null};
  };
}
function WTERM(box,exd,api){
  var term=el('div','term');
  var out=el('div','term-out');
  var line=el('div','term-line');
  var inp=document.createElement('input');
  inp.className='tin';inp.type='text';inp.autocomplete='off';inp.spellcheck=false;
  inp.setAttribute('aria-label','Terminal input');
  var run=el('button','btn mini','Run');run.type='button';
  line.innerHTML='<span class="tp">'+esc(exd.term.prompt)+'</span>';
  line.appendChild(inp);line.appendChild(run);
  term.appendChild(out);term.appendChild(line);
  box.appendChild(term);
  var lastCmd='';
  var norm=function(c){return String(c).toLowerCase().replace(/\s+/g,' ').replace(/[\[\]]/g,'').replace(/['"]/g,'').trim();};
  var outMap={};
  var k;
  if(exd.term.out){for(k in exd.term.out){outMap[norm(k)]=exd.term.out[k];}}
  function echo(cmd,n){
    out.appendChild(el('div','tline','<span class="tp">'+esc(exd.term.prompt)+'</span> '+esc(cmd)+(n!==norm(cmd)?'   <span class="t-ts">[normalised: '+esc(n)+']</span>':'')));
  }
  function puts(txt,cls){
    String(txt).split('\n').forEach(function(l){out.appendChild(el('div','tline'+(cls?' '+cls:''),hl(l)));});
  }
  function runCmd(){
    var v=inp.value;
    if(!v.trim()){return;}
    var n=norm(v);
    echo(v,n);
    if(n==='clear'){out.innerHTML='';}
    else if(n==='pwd'){puts('/home/analyst');}
    else if(n==='ls'||n==='ls -la'||n==='ls -l'){puts('cases   evidence   logs   notes.txt');}
    else if(n==='help'){puts('Commands known in this lab: '+(exd.term.avail||[]).join(', ')+', plus pwd / ls / clear / help.');}
    else if(outMap[n]!=null){
      lastCmd=n;
      puts(outMap[n]);
    }else{
      var tok=v.trim().split(/\s+/)[0];
      out.appendChild(el('div','tline t-err','bash: '+esc(tok)+': command not found (this lab only knows: '+(exd.term.avail||[]).join(', ')+')'));
      lastCmd=n; /* wrong tool attempt is graded too */
    }
    inp.value='';
    out.scrollTop=out.scrollHeight;
    api.mark();
  }
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){runCmd();}});
  run.addEventListener('click',runCmd);
  return function(){
    var els=exd.term.elements;
    var forb=exd.term.forbidden||[];
    var N=els.length;
    var corr=[],selArr=[],items=[],danger=[];
    els.forEach(function(e2,i){
      corr.push('ok:'+i);
      var hit=new RegExp(e2.re,'i').test(lastCmd);
      if(hit){selArr.push('ok:'+i);items.push({label:e2.name,status:'ok',note:e2.desc});}
      else{items.push({label:e2.name,status:'miss',note:e2.desc});}
    });
    forb.forEach(function(f){
      if(new RegExp(f.re,'i').test(lastCmd)){
        selArr.push('bad:f'+danger.length);
        items.push({label:f.name,status:'bad',note:f.desc});
        danger.push('<b>'+esc(f.name)+'</b> — '+f.desc);
      }
    });
    var H=0,W=0;
    selArr.forEach(function(x){if(x.indexOf('ok:')===0){H++;}else{W++;}});
    var g={credit:scoreExercise(selArr,corr,N),H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:danger.length?danger.join('<br>'):''};
    g.postRender=function(zone){
      var code=el('div');
      code.innerHTML='<div class="qnote" style="margin-top:10px"><b>Canonical command:</b></div><pre class="codeblk">'+esc(exd.term.canonical)+'</pre>';
      var cb=el('button','btn mini','Copy');cb.type='button';
      cb.addEventListener('click',function(){copyTxt(cb,exd.term.canonical);});
      code.appendChild(cb);
      var parts='';
      for(var i=0;i<exd.term.elements.length;i++){parts+='<li><b>'+esc(exd.term.elements[i].name)+'</b> — '+exd.term.elements[i].desc+'</li>';}
      var expl=el('div');
      expl.innerHTML='<ul>'+parts+'</ul>';
      code.appendChild(expl);
      zone.appendChild(code);
    };
    if(!lastCmd){g.exHTML='<p><b>No command was run.</b> In the fake shell, type a command and press Enter (or press Run), then press Check. This attempt scored 0 because no command could be graded.</p>'+exd.ex;}
    return g;
  };
}
function WBRANCH(box,exd,api){
  var st={step:0,picks:[],done:false};
  var wrap=el('div');
  var prog=el('div','qnote','<b>Progress log</b><ul style="margin:6px 0 0;padding-left:20px" id="blog"></ul>');
  var stepBox=el('div');
  wrap.appendChild(prog);wrap.appendChild(stepBox);
  box.appendChild(wrap);
  var blogEl=wrap.querySelector('#blog');
  function renderStep(){
    var k=st.step;
    var s=exd.steps[k];
    stepBox.innerHTML='';
    var head=el('div');
    var opts=s.opts.map(function(o){return o;});
    opts=shuffle(opts);
    var html='<p><span class="stepchip">STEP '+(k+1)+' OF '+exd.steps.length+'</span></p>';
    if(s.add){html+='<div class="prose" style="margin-top:8px">'+s.add+'</div>';}
    html+='<p style="margin-top:10px"><b>'+s.q+'</b></p><div class="opts">';
    var letters=['A','B','C','D'];
    opts.forEach(function(p,i){
      html+='<button class="opt" type="button" data-i="'+p.i+'"><span class="lbl">'+letters[i]+'.</span><span>'+p.o.t+'</span></button>';
    });
    html+='</div><div style="margin-top:10px"><button class="btn primary" type="button" id="bconfirm" disabled>Confirm step</button></div>';
    head.innerHTML=html;
    stepBox.appendChild(head);
    var selIdx=null;
    var bc=stepBox.querySelector('#bconfirm');
    var ob=stepBox.querySelectorAll('.opt');
    for(var i=0;i<ob.length;i++){
      ob[i].addEventListener('click',function(){
        selIdx=parseInt(this.getAttribute('data-i'),10);
        var all=stepBox.querySelectorAll('.opt');
        for(var z=0;z<all.length;z++){all[z].classList.remove('sel');}
        this.classList.add('sel');
        bc.disabled=false;
      });
    }
    bc.addEventListener('click',function(){
      if(selIdx==null){return;}
      st.picks[k]=selIdx;
      var li=document.createElement('li');
      li.textContent=(k+1)+'. '+s.out;
      blogEl.appendChild(li);
      if(k<exd.steps.length-1){st.step++;renderStep();}
      else{st.done=true;stepBox.innerHTML='<div class="qnote">All steps recorded. Press <b>Check</b> to grade the whole decision chain.</div>';api.mark();}
    });
  }
  renderStep();
  return function(){
    var N=exd.steps.length;
    var corr=[],selArr=[],items=[];
    exd.steps.forEach(function(s,i){
      corr.push('ok:'+i);
      var p=st.picks[i];
      var chosen=null;
      if(p!=null){for(var j=0;j<s.opts.length;j++){if(s.opts[j].i===p){chosen=s.opts[j];break;}}}
      var right=null;
      for(var j2=0;j2<s.opts.length;j2++){if(s.opts[j2].o.c){right=s.opts[j2].o;break;}}
      if(p==null){items.push({label:'Step '+(i+1),status:'miss',note:'No choice recorded. Correct was: "'+right.t+'".'});}
      else if(chosen.o.c){selArr.push('ok:'+i);items.push({label:'Step '+(i+1)+' — '+chosen.o.t,status:'ok',note:chosen.o.why||''});}
      else{selArr.push('bad:'+i);items.push({label:'Step '+(i+1)+' — you chose "'+chosen.o.t+'", best is "'+right.t+'"',status:'bad',note:chosen.o.why||right.why||''});}
    });
    var H=0,W=0;
    selArr.forEach(function(x){if(x.indexOf('ok:')===0){H++;}else{W++;}});
    return {credit:scoreExercise(selArr,corr,N),H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:null};
  };
}
function WTRIAGE(box,exd,api){

  var wrap=el('div');

      else{selArr.push('bad:'+i);items.push({label:'Alert '+(i+1)+' — you chose "'+a.opts[p]+'", correct is "'+a.opts[a.c]+'"',status:'bad',note:a.why||''});}

    var H=0,W=0;
    selArr.forEach(function(x){if(x.indexOf('ok:')===0){H++;}else{W++;}});
    return {credit:scoreExercise(selArr,corr,N),H:H,W:W,N:N,items:items,exHTML:exd.ex,dangerHTML:null};
  };
}

function startExam(){
  S=freshState();
  examShell();
  buildOrder();
  S.pos=0;
  startTimer();
  renderExercise(S.order[0],false);
}
function buildOrder(){
  var ord=shuffle(DATA.exercises.map(function(_,i){return i;}));
  var isT=function(i){return !!DATA.exercises[i].terminal;};
  var guard=0;
  while(guard++<60){
    var fixed=false;
    for(var k=0;k<ord.length-1;k++){
      if(isT(ord[k])&&isT(ord[k+1])){
        var cut=ord.splice(k+1,1)[0];
        var placed=false;
        for(var t=0;t<40&&!placed;t++){
          var p=Math.floor(Math.random()*(ord.length+1));
          var badB=(p>0&&isT(ord[p-1])&&isT(cut));
          var badA=(p<ord.length&&isT(ord[p])&&isT(cut));
          if(!badB&&!badA){ord.splice(p,0,cut);placed=true;}
        }
        if(!placed){
          if(ord.length&&isT(ord[ord.length-1])&&!isT(ord[0])){ord.unshift(cut);}
          else{ord.push(cut);}
        }
        fixed=true;break;
      }
    }
    if(!fixed){break;}
  }
  S.order=ord;
}

function endExam(byTimeout){
  stopTick();stopPerEx();S.tState='ENDED';
  document.getElementById('btn-hint').style.display='none';
  document.getElementById('btn-skip').style.display='none';
  document.getElementById('btn-pause').style.display='none';
  var ids=[];
  S.order.forEach(function(i){if(S.answered[i]){ids.push(i);}});
  var sum=0,full=0,part=0,partSum=0,zero=0;
  ids.forEach(function(i){var c=S.credit[i];sum+=c;if(c>=1){full++;}else if(c>0){part++;partSum+=c;}else{zero++;}});
  var answered=ids.length;
  var skipped=DATA.exercises.length-answered;
  var pct=answered?Math.round(sum/answered*100):0;
  var passed=pct>=70;
  if(!S.reported){
    S.reported=true;
    try{
      parent.postMessage({type:'CYBERPULSE_SCORE',topicId:TOPIC,batch:BATCH,
        score:Math.round(sum),total:answered,percent:pct,passed:passed},location.origin);
    }catch(e){/* opened directly: nothing to report to */}
  }
  var main=document.getElementById('main');
  main.innerHTML='';
  var hero=el('div','res-hero '+(passed?'pass':'fail'));
  hero.innerHTML='<div class="pct">'+pct+'%</div>'
    +'<div style="font-size:19px;font-weight:800">'+(passed?'PASS':'FAIL')+' — '+esc(DATA.meta.title)+'</div>'
    +'<p style="margin:8px 0 0">'+(byTimeout?'The exam timer ended. ':'')+'Score over answered exercises only: '+sum.toFixed(1)+' credits / '+answered+' answered. Pass mark: 70%.</p>';
  main.appendChild(hero);
  if(passed){
    var cert=el('div','cert');
    cert.innerHTML='<b>Certificate of completion</b><br>Topic '+esc(TOPIC)+' — tier '+esc(SEV)
      +'<br>Learner: '+esc(USERNAME||'anonymous learner')
      +'<br>Result: '+pct+'% (pass mark 70%) — '+sum.toFixed(1)+' / '+answered+' credits';
    main.appendChild(cert);
  }else{
    var f=el('div','hero prose');
    f.innerHTML='<p>You did not reach the pass mark of 70%. You must retake this tier. Questions and answers will be shuffled again.</p>';
    main.appendChild(f);
  }
  var grid=el('div','statgrid');
  var rows=[['Fully correct',String(full)],['Partially correct',part?(''+part+' (avg '+(partSum/part).toFixed(2)+')'):'0'],['Fully incorrect',String(zero)],['Skipped — excluded',String(skipped)]];
  for(var i=0;i<rows.length;i++){
    var s=el('div','stat');
    s.innerHTML='<div class="n">'+rows[i][1]+'</div><div class="l">'+rows[i][0]+'</div>';
    grid.appendChild(s);
  }
  main.appendChild(grid);
  var pauseStats=el('div','hero prose');
  pauseStats.innerHTML='<div class="sec-h">How your time was spent</div><ul>'
    +'<li>Time in manual breaks: <b>'+fmtT(S.manualSec)+'</b></li>'
    +'<li>Time reviewing feedback (auto-pause on Check): <b>'+fmtT(S.autoSec)+'</b></li>'
    +'<li>Time left on the exam clock: <b>'+fmtT(S.remaining)+'</b></li></ul>';
  main.appendChild(pauseStats);
  var nav=el('div','nav');
  var rb=el('button','btn primary','Retake exam');rb.type='button';
  rb.addEventListener('click',function(){startExam();});
  nav.appendChild(rb);
  main.appendChild(nav);
  renderHeader();
  window.scrollTo(0,0);
}
