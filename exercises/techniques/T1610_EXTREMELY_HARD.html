var META={"topicId":"t1610","mitreId":"T1610","name":"Deploy Container","mitreName":"Deploy Container","objectType":"technique","title":"T1610 Deploy Container — EXTREMELY HARD","difficulty":"extremely-hard","severity":"extremely-hard","severityLabel":"EXTREMELY HARD","batch":4,"questionCount":15,"estimatedMinutes":28,"passMark":70,"protocol":"cpa-staged-v1"};
var INTRO={"learnHtml":"<p><b>Exam scope:</b> this exam teaches <b>T1610 — Deploy Container</b>, a <b>technique</b> of the MITRE ATT&amp;CK framework. <p><b>EXTREMELY HARD — T1610 Deploy Container, incident-grade.<\/b> This unit simulates live-incident pressure: conflicting signals, incomplete records, and stakeholders demanding actions that would destroy your evidence. You will chain three or more concepts per decision, and at least once the right answer is <b>not to act yet<\/b>.<\/p><p>Ground rules from the field: a <b>privileged<\/b> deployment can be an approved backup; a clean <b>image scan<\/b> proves nothing about runtime behaviour; <b>latest<\/b> tags make yesterday's approval meaningless; a <b>DaemonSet<\/b> turns one hostile manifest into a presence on every node; and the fastest way to lose an incident is to delete the one live thing you can still observe. Real operators in these scenarios: <b>Peirates<\/b>, <b>TeamPCP<\/b>, <b>TeamTNT<\/b> and <b>Salt Typhoon<\/b>.<\/p><p>Every artefact has noise. Every option list has at least two defensible choices. Senior judgement means naming the conflict, resolving it with evidence, and paying the least real cost.<\/p>","themes":[{"name":"Deploying containers: paths and workload objects","concepts":["Docker create/start API","DaemonSet spread","Kubernetes dashboard","Kubeflow"]},{"name":"Evasion by fresh deployment","concepts":["latest tag risk","non-allow-listed image detection"]},{"name":"Privilege & escape precursors","concepts":["--privileged flag","hostPath mount","hostPID and hostNetwork","escape to host precursor"]},{"name":"Detection, defense & response","concepts":["kube-audit create pod event","admission controller","workload identity (non-admin principal)","evidence preservation before containment","create → start → first-action correlation","M1047 audit image scanning","M1035 limit API access","M1030 network segmentation","M1018 user account management"]},{"name":"Real-world operators","concepts":["Peirates node root filesystem pod","TeamPCP privileged DaemonSets","TeamTNT miner deployment","Salt Typhoon guestshell"]}]};
var EXERCISES=[{"id":"EX-01","type":"multi-step","summary":"02:14 privileged pod create in payments — conflicting history","concepts":["kube-audit create pod event","workload identity (non-admin principal)","admission controller","evidence preservation before containment"],"scenario":"<p>Verdant Grid Energy, INC-5090, 02:14. Kube-audit: <span class=\"mono\">create pod ns=payments user=system:serviceaccount:payments-svc:scheduler-tasks image=docker[.]io/library/ubuntu:latest hostPath=/ privileged=true<\/span>. Complications: (a) the same SA has deployed <span class=\"mono\">ubuntu:latest<\/span> pods for two weeks — a pipeline manifest changed on Monday; (b) admission control runs in <b>audit mode<\/b> (logs, does not block); (c) the payments platform owner is awake and demanding deletion. The conflict: known identity plus known image name versus hostile spec plus audit-only admission.<\/p>","question":"<p>Drive the incident, step by step.<\/p>","steps":[{"prompt":"Step 1 — first move, before anything is deleted?","options":["Pull 14 days of audit records for this SA and diff the pipeline manifest history — resolve the identity-versus-spec conflict first","Delete the pod immediately","Reboot the node to clear memory"],"correct":0,"outcome":"Right — the signal conflicts with a two-week benign history; establish the baseline before acting."},{"prompt":"Step 2 — the diff shows the SA never created pods before Monday's change; egress from the new pod to 203[.]0[.]113[.]44:4444 just began; admission is audit-only. What now?","options":["Wait for the next monthly image scan","Escalate to the IR lead, flip admission to enforcing for ns=payments, keep the pod alive under strict egress watch","Delete the pod and close the ticket as resolved"],"correct":1,"outcome":"Correct — escalate, close the gate for the namespace, and keep the one live observation point you have."},{"prompt":"Step 3 — the platform owner: 'delete it now or I page your director.' What do you answer?","options":["Fine — delete it now, audit logs are enough evidence anyway","Deleting now destroys the running evidence and hands the attacker a restart signal; capture costs minutes, downtime costs the investigation","Refuse permanently; the pod must stay forever"],"correct":1,"outcome":"Right — you name the real cost and negotiate a controlled takedown after capture."},{"prompt":"Step 4 — a second create request for the same manifest arrives, authenticated with the dashboard's token from a browser session. Final action set for tonight?","options":["Lower the audit verbosity to reduce noise","Revoke both tokens, force digest-pinned images in the namespace, open a P1 and preserve all artefacts","Delete only the second pod"],"correct":1,"outcome":"Yes — two identities, one manifest: revoke, pin (kill the latest-tag loophole), preserve, escalate."}],"hint":"Step 1: history versus spec. Step 2: containment that preserves observation. Step 3: cost language. Step 4: two identities change the scope.","explanation":"<p>The chain: a <b>kube-audit create pod<\/b> event with escape precursors (T1610 feeding T1611) plus a <b>workload identity<\/b> that changed behaviour on Monday plus <b>audit-only admission<\/b> (no enforcement). The senior resolution is evidence-first: baseline → escalate and enforce → negotiate cost → revoke, pin, preserve. Every premature deletion here would have burned the live foothold and the response state.<\/p>","study":"Incident decision records: write the conflict and its resolution into the timeline."},{"id":"EX-02","type":"line-select","summary":"Clean scan, hostile attributes — resolve the conflict","concepts":["hostPID and hostNetwork","non-allow-listed image detection"],"scenario":"<p>Namespace <span class=\"mono\">ops<\/span>, 03:40–04:05. The build-bot identity is trusted; its registry is allow-listed. One deploy tonight breaks pattern. Image verdicts are attached. (Rows indexed from 0.)<\/p>","question":"<p>Click the <b>two<\/b> lines that prove hostile intent — and be ready to explain why the clean scan does not clear it.<\/p>","logLines":["audit 03:41:02 create pod ns=ops user=build-bot image=registry[.]nw[.]example/ops:7.7.0","audit 03:44:58 create pod ns=ops user=build-bot image=docker[.]io/library/busybox:latest hostPID=true hostNetwork=true","scan  03:45:01 image busybox:latest verdict=clean (no CVEs above threshold)","audit 03:46:12 create pod ns=ops user=build-bot image=registry[.]nw[.]example/canary:0.9.1","fw    03:52:40 pod=busybox-7kd9 -&gt; 10[.]250[.]0[.]11:2375 SYN (docker API port)","audit 03:58:19 get secrets ns=ops user=ci-viewer","fw    04:01:22 pod=canary-0-9-1 -&gt; registry[.]nw[.]example:443 TLS"],"badLines":[1,4],"hint":"The scan verdict covers image content. Which deploy line carries attributes no scan can see, and what did that pod touch next?","explanation":"<p>Line 2 (index 1) deploys <b>busybox:latest<\/b> — non-allow-listed — with <b>hostPID<\/b> and <b>hostNetwork<\/b>: the container now sees every process on the node and shares the node's network stack. Line 5 (index 4) shows its <b>first action<\/b>: probing the Docker API port (2375) on an internal host — recon for further container deployment. The <b>clean scan<\/b> resolves as irrelevant: it speaks to image content, not to runtime attributes or actions. The canary pod's registry egress and the secret read are pattern-consistent noise.<\/p>","study":"hostPID/hostNetwork = node-level visibility; pair them with first-action telemetry."},{"id":"EX-03","type":"qcm-single","summary":"Privileged kube-system pod at 09:00 — resolve via change data","concepts":["--privileged flag","workload identity (non-admin principal)"],"scenario":"<p>09:00, Monday. Alert: a pod create in <span class=\"mono\">kube-system<\/span> with <span class=\"mono\">privileged: true<\/span>, image <span class=\"mono\">registry[.]nw[.]example/cni-plugin:1.9.0<\/span> (digest-pinned, allow-listed), creator <span class=\"mono\">system:serviceaccount:kube-system:platform-cni<\/span>. Change calendar: CHG-3387 'CNI upgrade 1.9.0, privileged DaemonSet, approved Friday'. Everything matches except your gut.<\/p>","question":"<p>Which disposition resolves the ambiguity correctly?<\/p>","options":["Close as expected change; privileged runs in kube-system are normal, no documentation needed","Close as expected change (CHG-3387 matches image, identity and window) and log the correlation into the incident record","Page IR and cordon the node pending investigation","Ask the CNI vendor to confirm via a support ticket before closing"],"correct":1,"hint":"The conflict is resolved by an independent record; the resolution still needs to be written down.","explanation":"<p>The <b>privileged flag<\/b> is alarming; the <b>workload identity<\/b>, digest-pinned allow-listed image, approved change and timing all corroborate. Senior disposition: close as expected change <b>with the correlation documented<\/b> — undocumented closures are how real intrusions hide inside approved-change noise.<\/p>","study":"Privileged-by-design workloads: baseline them, or every Monday becomes an incident."},{"id":"EX-04","type":"drag-drop","summary":"Map four settings to what they enable","concepts":["--privileged flag","hostPath mount","hostPID and hostNetwork","latest tag risk","escape to host precursor"],"scenario":"<p>Board work for the post-incident report: 'what each knob bought the attacker'. Four settings; two consequence buckets.<\/p>","question":"<p>Place each setting in the right bucket.<\/p>","bank":["privileged: true","hostPath: / (node root)","hostNetwork: true","image tag: latest"],"slots":[{"label":"Escape-to-host precursor","accept":[0,1]},{"label":"Other attacker enablers","accept":[2,3]}],"hint":"Two settings are about leaving the container; two are about reach and swap.","explanation":"<p><b>privileged: true<\/b> and <b>hostPath: /<\/b> are the escape precursors — they stage T1611. <b>hostNetwork<\/b> shares the node's network stack (reach node services, dodge pod network policy), and <b>latest<\/b> enables silent payload swap under an approved name — enablers, not escapes yet.<\/p>","study":"Report each attribute by consequence, not by scariness."},{"id":"EX-05","type":"terminal","summary":"Sweep the cluster for hostPath and hostPID pods","concepts":["hostPath mount","hostPID and hostNetwork"],"scenario":"<p>INC-5090 war room, hour two. The IR lead asks for a single line that finds <b>every pod in all namespaces<\/b> whose spec mounts a <b>hostPath volume or sets hostPID<\/b>, emitted as <b>JSON<\/b> and processed by <span class=\"mono\">jq<\/span> to print namespace and name. Read-only; nothing gets mutated. The cluster CLI is configured on your bastion.<\/p>","question":"<p>Type the compound command.<\/p>","shellPrompt":"analyst@bastion-02:~$","expected":"kubectl get pods -A -o json | jq '.items[] | select(.spec.volumes[]?.hostPath or .spec.hostPID) | {ns: .metadata.namespace, name: .metadata.name}'","elements":[{"any":["kubectl"],"label":"the cluster CLI"},{"any":["-o=json","-o json","-ojson"],"label":"JSON output flag"},{"any":["jq"],"label":"the jq processor"},{"any":["hostpath"],"label":"the hostPath filter"},{"any":["hostpid"],"label":"the hostPID filter"}],"hint":"Four graded pieces beyond the CLI: JSON output flag, jq, and the two spec keywords. All-namespace scope.","explanation":"<p>The sweep enumerates every <b>hostPath<\/b> mount and <b>hostPID<\/b> setting cluster-wide — the escape-precursor inventory. In the INC-5090 timeline this is the command that found the payments pod within seconds and proved it was not unique. Scope <span class=\"mono\">-A<\/span> matters: attackers park hostile manifests in namespaces nobody reads.<\/p>","study":"Build a daily scheduled version of this sweep; diff it like a change report."},{"id":"EX-06","type":"fill-blank","summary":"Complete the M1035 hardening note","concepts":["M1035 limit API access"],"scenario":"<p>Finish the hardening note for the infrastructure wiki, based on the ATT&amp;CK mitigation M1035.<\/p>","question":"<p>Fill the blanks: M1035 hardening against remote container deployment means disabling <input1> access to the Docker and Kubernetes APIs and requiring TLS over <input2> channels.<\/p>","template":"Fill the blanks: M1035 hardening against remote container deployment means disabling <input1> access to the Docker and Kubernetes APIs and requiring TLS over <input2> channels.","blanks":[{"answer":"unauthenticated","alts":["anonymous","anon","un-authenticated"],"placeholder":"access type","width":15},{"answer":"managed","alts":["authenticated","secure"],"placeholder":"channel type","width":10}],"hint":"First blank: what TeamTNT-style scanning loves to find. Second blank: the word for centrally controlled.","explanation":"<p><b>M1035<\/b> for containers: no <b>unauthenticated<\/b> Docker/Kubernetes API exposure (the door TeamTNT walked through) and TLS on <b>managed<\/b> channels — deployment becomes an auditable, credentialed act instead of an open socket.<\/p>","study":"ATT&CK T1610 Mitigations: M1035 with M1018 for account hygiene."},{"id":"EX-07","type":"matching","summary":"Match four operators to their T1610 procedures","concepts":["Peirates node root filesystem pod","TeamPCP privileged DaemonSets","TeamTNT miner deployment","Salt Typhoon guestshell"],"scenario":"<p>Final review of the intel annex. Match each operator or tool to its documented T1610 procedure.<\/p>","question":"<p>Click an operator on the left, then its procedure on the right.<\/p>","pairs":[{"left":"Peirates (S0683)","right":"deploys a pod that mounts the node root filesystem, then lands a reverse shell on the node"},{"left":"TeamPCP (G1056)","right":"uses privileged DaemonSets to delete files across clusters"},{"left":"TeamTNT (G0139)","right":"pushed crypto miners into Kubernetes clusters found in local IP ranges"},{"left":"Salt Typhoon (G1045)","right":"enabled Linux containers on network devices via guestshell"}],"hint":"One mounts, one deletes, one mines, one lives in network gear.","explanation":"<p>From the ATT&amp;CK procedure table: <b>Peirates<\/b> — node-root pod mount plus reverse shell; <b>TeamPCP<\/b> — privileged DaemonSets deleting files; <b>TeamTNT<\/b> — miners into clusters in local IP ranges; <b>Salt Typhoon<\/b> — <span class=\"mono\">guestshell enable<\/span> on network devices. Four operators, four deployment motives: escape staging, sabotage, profit, and stealth on exotic platforms.<\/p>","study":"Annex cross-references: S0683, G1056, G0139, G1045 under T1610."},{"id":"EX-08","type":"qcm-multi","summary":"Two actions survive senior review — best practice gets cut","concepts":["evidence preservation before containment","latest tag risk"],"scenario":"<p>INC-5090, hour one. The privileged hostile pod in <span class=\"mono\">payments<\/span> is live; its manifest uses <span class=\"mono\">ubuntu:latest<\/span>; the SA token that created it is still valid. Two of these four proposed actions survive senior review — the other two are the ones 'everyone recommends' and are wrong here.<\/p>","question":"<p>Select the <b>two<\/b> actions that survive review.<\/p>","options":["Delete the pod immediately — a compromised container must always be destroyed on sight","Keep the pod running briefly under strict egress blocking while its first actions are captured","Drain and re-image the affected node before any collection","Revoke the leaked SA token and force digest-pinned images so the latest-tag loophole closes"],"correct":[1,3],"hint":"One cut destroys the live foothold; the other confuses node hygiene with evidence order.","explanation":"<p>Right: (1) <b>observe under egress control<\/b> — <b>evidence preservation before containment<\/b>, keeping the attacker's runtime as your sensor; (2) <b>revoke the token and pin digests<\/b> — kills re-deployment and the <b>latest tag risk<\/b> without touching the pod. Wrong: delete-on-sight burns the evidence and the manifest can redeploy; drain-and-re-image destroys volatile state before collection and is a much later phase.<\/p>","study":"'Delete on sight' is a policy, not an IR plan — know when it is wrong."}];

EXERCISES.push({"id":"EX-09","type":"ordering","summary":"Rank response actions from least to most aggressive","concepts":["evidence preservation before containment","M1030 network segmentation","M1018 user account management"],"scenario":"<p>Post-incident standard: 'we escalate force only when the previous rung fails or the attacker reacts'. Rank the four rungs for a hostile deployed pod.<\/p>","question":"<p>Order the rungs from least to most aggressive.<\/p>","items":["Snapshot the pod spec, logs and image digest into the case folder","Cordon the node and apply a network policy that blocks the pod's egress","Revoke the service account token (M1018) and delete the workload","Drain the node and re-image it"],"hint":"Collection, then fencing, then removal, then rebuilding.","explanation":"<p>The ladder: (1) <b>preserve<\/b> — snapshot spec, logs, digest; (2) <b>fence<\/b> — cordon plus egress block, a <b>segmentation<\/b> (M1030) move that keeps the pod observable but inert; (3) <b>remove access<\/b> — token revocation (<b>M1018<\/b>) and workload deletion; (4) <b>rebuild<\/b> — drain and re-image, destroying evidence and uptime, justified only by confirmed host-level compromise (T1611).<\/p>","study":"Write your cluster IR ladder into the runbook before the incident, not during."},
{"id":"EX-10","type":"multi-step","summary":"Privileged DaemonSet on 12 nodes, records missing","concepts":["TeamPCP privileged DaemonSets","DaemonSet spread","evidence preservation before containment"],"scenario":"<p>Kestrel Analytics, INC-5233, day six of quiet dwell. DaemonSet <span class=\"mono\">node-cleaner<\/span> runs privileged on all 12 nodes: <span class=\"mono\">alpine:latest<\/span>, <span class=\"mono\">hostPath: /<\/span>, command <span class=\"mono\">rm -rf /host/var/log/* &amp;&amp; /x/cleaner<\/span>. Change records for its creation window: missing (retention gap). Log directories on 3 nodes: already emptied. The manifest matches the TeamPCP privileged-DaemonSet pattern. Blue team wants all 12 nodes drained 'before lunch'.<\/p>","question":"<p>Navigate the four decisions.<\/p>","steps":[{"prompt":"Step 1 — change records are missing. What is the defensible starting stance?","options":["Assume benign — it has run quietly for six days","Treat as hostile until proven otherwise; reconstruct intent from registry push history and RBAC bindings","Delete the DaemonSet to stop the log wiping immediately"],"correct":1,"outcome":"Right — a retention gap is not an alibi; rebuild the history you can and treat the object as hostile meanwhile."},{"prompt":"Step 2 — three nodes' /var/log are already gone. What is actually lost, and what remains?","options":["Host file evidence is partly destroyed, but image layers, kube-audit records and 12 live privileged pods remain — capture them now","Nothing is recoverable; close the log-theft line of inquiry","Only the image is lost; logs live forever in the cloud"],"correct":0,"outcome":"Correct — name what is gone, then protect what is left: the runtime objects are your remaining evidence."},{"prompt":"Step 3 — blue team proposes draining all 12 nodes at once. Why is that wrong here?","options":["Draining is never harmful; nodes rejoin in minutes","DaemonSets cannot respawn after deletion","It is a production outage that destroys volatile state, and the DaemonSet simply respawns on new nodes unless the workload object is removed first"],"correct":2,"outcome":"Yes — DaemonSet spread cuts both ways: drain without removing the workload just moves the pods."},{"prompt":"Step 4 — the controlled sequence for tonight?","options":["Report to the IR lead, pull the image from the registry, revoke the deploy token, then remove the DaemonSet in a change window with snapshots taken","Leave everything and monitor for a month","Reboot all 12 nodes simultaneously"],"correct":0,"outcome":"Right — coordinated removal with evidence preservation first: report, strip the image source, revoke identity, then remove the object under change control."}],"hint":"Step 1: silence is not innocence. Step 2: lost versus remaining. Step 3: spread works against you. Step 4: order of operations.","explanation":"<p>The <b>TeamPCP-style privileged DaemonSet<\/b> bought the attacker <b>spread<\/b> (one manifest, 12 nodes) and log destruction. The senior path: treat the retention gap as unknown, inventory what evidence survives, refuse the drain (a costly no-op against a DaemonSet), and sequence report → registry pull → token revocation → controlled removal. The real cost — three nodes of logs already gone — was paid during the dwell, which is the lesson about detection latency.<\/p>","study":"Tabletop: DaemonSet incidents — 'drain' is not the opposite of 'deploy'."},
{"id":"EX-11","type":"line-select","summary":"Trusted build-server IP, wrong identity — resolve it","concepts":["Docker create/start API","workload identity (non-admin principal)","create → start → first-action correlation"],"scenario":"<p>Docker Engine API log, 05:12–06:03, host k8s-wkr-03. The client IP 10[.]44[.]2[.]15 is build-srv-01 — the trusted builder. Team lead: 'it is the build server, close it.' You are not so sure. (Rows indexed from 0.)<\/p>","question":"<p>Click the <b>two<\/b> lines that resolve the IP-versus-identity conflict against hostility.<\/p>","logLines":["05:12:40  POST /containers/create  Image=registry[.]nw[.]example/app:1.8.2  client=10[.]44[.]2[.]15 (build-srv-01)","05:12:41  POST /containers/55ee.../start  client=10[.]44[.]2[.]15","05:12:41  auth  token=sub=system:serviceaccount:build-svc:deployer  valid","05:41:03  POST /containers/create  Image=docker[.]io/library/alpine:latest  Privileged=true  client=10[.]44[.]2[.]15","05:41:03  auth  token=sub=system:serviceaccount:grafana:viewer  valid","05:41:04  POST /containers/88bc.../start","06:02:19  POST /containers/88bc.../exec  Cmd=[/bin/sh]"],"badLines":[3,4],"hint":"Same IP, different credentials. Which pair of lines breaks the pattern the morning deploys set?","explanation":"<p>Line 4 (index 3): a <b>privileged<\/b> create of a non-allow-listed <b>alpine:latest<\/b> — nothing the build pipeline ever requests. Line 5 (index 4): the <b>identity<\/b> is <span class=\"mono\">grafana:viewer<\/span> — a read-only principal with no deployment rights. The IP is the build server, but the <b>token is not the builder's<\/b>: shared or compromised infrastructure, or source-IP spoofing. The <b>create → start → exec<\/b> chain on 88bc completes the story. Conflict resolved: identity beats IP.<\/p>","study":"Attribute by credential, not by source address; correlate to first action."},
{"id":"EX-12","type":"qcm-single","summary":"Which deployment surface explains pod creation with no kubectl?","concepts":["Kubernetes dashboard","Kubeflow"],"scenario":"<p>Forensics: no kubectl binary or kubeconfig on any compromised host; no CI token misuse; DNS logs show browser sessions to an internal jump host that serves the <b>Kubernetes dashboard<\/b> and the ML platform's <b>Kubeflow<\/b> UI. Yet pods were created in two namespaces at 02:31 and 02:44.<\/p>","question":"<p>Which explanation fits the evidence?<\/p>","options":["The pods created themselves via CronJob objects","The nodes were re-imaged from a golden image containing the pods","Direct etcd writes bypassing the API server","The Kubernetes dashboard and Kubeflow were used — both create pods through their own APIs with the caller's token, needing no host-side kubectl"],"correct":3,"hint":"Two options need binaries on hosts, one needs an API-server bypass; the evidence points at web surfaces.","explanation":"<p>The <b>Kubernetes dashboard<\/b> and <b>Kubeflow<\/b> are deployment surfaces with their own APIs: a stolen session or token creates pods from a browser — no kubectl, no kubeconfig, exactly the T1610 path the evidence describes. CronJobs leave scheduled-workload objects; etcd writes would leave different audit gaps.<\/p>","study":"Inventory every pod-creating surface in your cluster; each one needs identity monitoring."},

{"id":"EX-14","type":"terminal","summary":"Capture spec and logs before anyone deletes","concepts":["evidence preservation before containment"],"scenario":"<p>INC-5233 war room, voices raised. The DaemonSet pod <span class=\"mono\">node-cleaner-9xk2<\/span> in <span class=\"mono\">kube-system<\/span> is live. IR lead's instruction, exact: <b>'Nothing gets deleted until the pod's spec and its current logs are on the case disk.'<\/b> Two commands, chained. The cluster CLI is configured on your bastion.<\/p>","question":"<p>Type the compound command: fetch the pod spec as YAML and redirect it to /cases/INC-5233/pod.yaml, then fetch the pod's logs and redirect them to /cases/INC-5233/pod.log.<\/p>","shellPrompt":"analyst@bastion-02:~$","expected":"kubectl get pod node-cleaner-9xk2 -n kube-system -o yaml > /cases/INC-5233/pod.yaml && kubectl logs node-cleaner-9xk2 -n kube-system > /cases/INC-5233/pod.log","elements":[{"any":["get pod","get pods"],"label":"fetching the pod spec"},{"any":["logs"],"label":"capturing the logs"},{"any":[">","tee"],"label":"redirecting to files"}],"hint":"Three graded pieces: the spec fetch, the logs fetch, and the redirect. Chain with two ampersands.","explanation":"<p>Spec plus logs is the minimum evidence set before any destructive action: the spec proves the <b>deployment<\/b> (privileged, hostPath, latest), the logs prove the <b>runtime behaviour<\/b>. The chaining order matters — <span class=\"mono\">&amp;&amp;<\/span> stops the second step if the first capture fails, so a half-preserved state never silently enables deletion. This is the safe alternative to the destructive reflex the IR lead forbade.<\/p>","study":"Alias this capture pattern; make it muscle memory before the next 02:00 page."},

(function () {

    how.appendChild(el('div', 'typlist', '<span class="typ">' + META.questionCount + ' exercises</span><span class="typ">timer ' + fmtTime((META.estimatedMinutes || 15) * 60) + '</span><span class="typ">pass 70%</span><span class="typ">severity: ' + esc(META.severityLabel) + '</span>'));

  /* ---------------- widgets ---------------- */

  function widgetFor(ex, box, wstate) {

      var wrap = el('div', null, '');

        if (wstate.sel.indexOf(i) >= 0) r.classList.add('sel');

          if (S.answers[S.current].status === 'checked') return;

          else { var p = wstate.sel.indexOf(i); if (p >= 0) { wstate.sel.splice(p, 1); r.classList.remove('sel'); } else { wstate.sel.push(i); r.classList.add('sel'); } }
        });

          inp.setAttribute('aria-label', 'Blank ' + (bi + 1));

    } else if (ex.type === 'drag-drop') {

            wstate.activeLeft = (wstate.activeLeft === li ? null : li); drawMatch();

          lcol.appendChild(b);
        });
        S.shuffles[S.current].right.forEach(function (ri, pos) {
          var usedBy = -1; Object.keys(wstate.assign).forEach(function (k) { if (wstate.assign[k] === ri) usedBy = parseInt(k, 10); });
          var b = el('button', 'mchip', (usedBy >= 0 ? '<span class="pairno">' + (usedBy + 1) + '</span>' : '') + esc(ex.pairs[ri].right));
          b.type = 'button';
          if (usedBy >= 0) b.classList.add('paired');
          b.addEventListener('click', function () {
            if (S.answers[S.current].status === 'checked') return;
            if (usedBy >= 0) { delete wstate.assign[usedBy]; drawMatch(); return; }
            if (wstate.activeLeft === null) return;
            wstate.assign[wstate.activeLeft] = ri; wstate.activeLeft = null; drawMatch();
          });
          rcol.appendChild(b);
        });
      }
      drawMatch();
      mw.appendChild(lcol); mw.appendChild(rcol); box.appendChild(mw);
      var un = el('button', 'btn btn-ghost matchundo', '↺ Undo all pairs');
      un.type = 'button';
      un.addEventListener('click', function () { if (S.answers[S.current].status === 'checked') return; wstate.assign = {}; wstate.activeLeft = null; drawMatch(); });
      box.appendChild(un);
    } else if (ex.type === 'terminal') {
      wstate.cmd = wstate.cmd || '';
      var term = el('div', 'term');
      term.appendChild(el('div', 't-bar',
        '<span class="t-dot d-r"></span><span class="t-dot d-a"></span><span class="t-dot d-g"></span><span class="t-title">' + esc(ex.shellPrompt || 'shell') + ' — type the command, then press Enter or Check</span>'));
      var body = el('div', 't-body');
      var hist = el('div', 't-hist'); hist.textContent = wstate.cmd ? wstate.cmd : '';
      var inrow = el('div', 't-in');
      var pr = el('span', 'pr', esc(ex.shellPrompt || '$'));
      var inp = document.createElement('input');
      inp.type = 'text'; inp.value = wstate.cmd; inp.setAttribute('aria-label', 'Terminal command input'); inp.autocomplete = 'off'; inp.spellcheck = false;
      inp.addEventListener('input', function () { wstate.cmd = inp.value; hist.textContent = ''; });
      inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); doCheck(); } });
      inrow.appendChild(pr); inrow.appendChild(inp);
      body.appendChild(hist); body.appendChild(inrow); term.appendChild(body);
      box.appendChild(term);
      if (ex.syntaxPanel) box.appendChild(el('div', 'syntax', ex.syntaxPanel));
      setTimeout(function () { try { inp.focus(); } catch (e) { } }, 60);
    } else if (ex.type === 'line-select') {
      wstate.sel = wstate.sel || [];
      var lv = el('div', 'logview');
      var bar = el('div', 'lv-bar', '<span class="lv-tag">FILTER</span>');
      var finp = document.createElement('input');
      finp.type = 'text'; finp.placeholder = ex.filterable ? 'filter lines… (visual aid only)' : 'visual filter…';
      finp.setAttribute('aria-label', 'Filter log lines');
      bar.appendChild(finp); lv.appendChild(bar);
      var lines = el('div', 'lv-lines');
      function drawLines(f) {
        lines.innerHTML = '';
        ex.logLines.forEach(function (l, i) {
          if (f && l.toLowerCase().indexOf(f.toLowerCase()) < 0) return;
          var row = el('div', 'logline' + (wstate.sel.indexOf(i) >= 0 ? ' sel' : ''));
          row.setAttribute('role', 'button'); row.tabIndex = 0;
          row.setAttribute('aria-label', 'Log line ' + (i + 1) + (wstate.sel.indexOf(i) >= 0 ? ', selected' : ''));
          row.appendChild(el('span', 'ln', String(i + 1)));
          row.appendChild(el('span', null, esc(l)));
          row.addEventListener('click', function () {
            if (S.answers[S.current].status === 'checked') return;
            var p = wstate.sel.indexOf(i); if (p >= 0) { wstate.sel.splice(p, 1); row.classList.remove('sel'); row.setAttribute('aria-label', 'Log line ' + (i + 1)); }
            else { wstate.sel.push(i); row.classList.add('sel'); }
          });
          row.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); row.click(); } });
          lines.appendChild(row);
        });
      }
      drawLines('');
      finp.addEventListener('input', function () { drawLines(finp.value.trim()); });
      lv.appendChild(lines); box.appendChild(lv);
      box.appendChild(el('div', 'dd-hint', 'Click the line(s) that answer the question. The filter box is a visual aid only — filtering does not change your selection.'));
    } else if (ex.type === 'multi-step') {
      wstate.step = wstate.step === undefined ? 0 : wstate.step;
      wstate.picks = wstate.picks || {};
      wstate.stepSel = wstate.stepSel === undefined ? null : wstate.stepSel;
      drawStep();
    }
    function drawStep() {
      var sw = el('div', null, '');
      /* outcomes of already-confirmed intermediate steps */
      for (var done = 0; done < wstate.step; done++) {
        var pk = wstate.picks[done];
        var okv = pk === ex.steps[done].correct;
        sw.appendChild(el('div', 'outcome', (okv ? '✓ ' : '✗ ') + 'Step ' + (done + 1) + ' confirmed — the scenario continues. ' + esc(ex.steps[done].outcome || '') + (done === wstate.step - 1 ? ' <b>Intermediate step: the timer keeps running.</b>' : '')));
      }
      var st = ex.steps[wstate.step];
      sw.appendChild(el('span', 'step-h', '⎘ STEP ' + (wstate.step + 1) + ' OF ' + ex.steps.length));
      sw.appendChild(el('div', 'block-b', st.prompt));
      var confirmBtn = null;
      st.options.forEach(function (o, i) {
        var r = optRow(i, o);
        if (wstate.stepSel === i) r.classList.add('sel');
        r.addEventListener('click', function () {
          if (wstate.picks[wstate.step] !== undefined) return;
          wstate.stepSel = i;
          sw.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); });
          r.classList.add('sel');
          if (confirmBtn) confirmBtn.disabled = false;
        });
        sw.appendChild(r);
      });
      confirmBtn = el('button', 'btn btn-blue', (wstate.step === ex.steps.length - 1 ? '✓ Confirm final step & check' : '→ Confirm step'));
      confirmBtn.type = 'button'; confirmBtn.disabled = wstate.stepSel === null;
      confirmBtn.setAttribute('aria-label', 'Confirm step ' + (wstate.step + 1));
      confirmBtn.addEventListener('click', function () {
        if (wstate.stepSel === null || wstate.picks[wstate.step] !== undefined) return;
        wstate.picks[wstate.step] = wstate.stepSel;
        wstate.stepSel = null;
        if (wstate.step < ex.steps.length - 1) {
          wstate.step++;
          drawStep(); /* intermediate: no auto-pause, timer keeps running */
        } else {

        }
      });
      sw.appendChild(confirmBtn);
      box.innerHTML = '';
      box.appendChild(sw);
    }
  }

  /* ---------------- scoring ---------------- */
  function scoreExercise(ex, wstate) {
    var items = [], N = 0, H = 0, W = 0, canon = null;
    function item(state, label) { items.push({ state: state, label: label }); }
    if (ex.type === 'qcm-single') {
      N = 1;
      var sel = wstate.sel && wstate.sel[0];
      if (sel === undefined) { item('mi', 'No option selected'); }
      else if (sel === ex.correct) { H = 1; item('ok', '✓ Correct — ' + strip(ex.options[ex.correct])); }
      else { W = 1; item('no', '✗ You chose: ' + strip(ex.options[sel])); }
      canon = ex.options[ex.correct];
    } else if (ex.type === 'qcm-multi') {
      N = ex.correct.length;
      var selset = wstate.sel || [];
      ex.correct.forEach(function (ci) {
        if (selset.indexOf(ci) >= 0) { H++; item('ok', '✓ Correct: ' + strip(ex.options[ci])); }
        else { item('mi', '○ Missed: ' + strip(ex.options[ci])); }
      });
      selset.forEach(function (si) { if (ex.correct.indexOf(si) < 0) { W++; item('no', '✗ Wrong: ' + strip(ex.options[si])); } });
      canon = ex.correct.map(function (ci) { return strip(ex.options[ci]); }).join(' · ');
    } else if (ex.type === 'fill-blank') {
      N = ex.blanks.length;
      ex.blanks.forEach(function (bl, bi) {
        var v = norm(wstate.vals && wstate.vals[bi]);
        var accept = [norm(bl.answer)].concat((bl.alts || []).map(norm));
        if (!v) { item('mi', '○ Missed blank ' + (bi + 1) + ' — expected: ' + esc(bl.answer)); }
        else if (accept.indexOf(v) >= 0) { H++; item('ok', '✓ Blank ' + (bi + 1) + ': ' + esc(bl.answer)); }
        else { W++; item('no', '✗ Blank ' + (bi + 1) + ' — you typed "' + esc(v) + '", expected: ' + esc(bl.answer)); }
      });
      canon = ex.blanks.map(function (bl) { return bl.answer; }).join(' | ');
    } else if (ex.type === 'drag-drop') {
      N = ex.bank.length;
      Object.keys(wstate.place || {}).forEach(function (k) {
        var bi = parseInt(k, 10), si = wstate.place[k];
        if (ex.slots[si] && ex.slots[si].accept.indexOf(bi) >= 0) { H++; item('ok', '✓ "' + strip(ex.bank[bi]) + '" → ' + esc(ex.slots[si].label)); }
        else { W++; item('no', '✗ "' + strip(ex.bank[bi]) + '" does not belong in ' + esc(ex.slots[si] ? ex.slots[si].label : '?')); }
      });
      ex.bank.forEach(function (t, bi) { if (wstate.place[bi] === undefined) item('mi', '○ Missed: "' + strip(t) + '" → ' + esc(slotLabelFor(ex, bi))); });
      canon = ex.slots.map(function (sl) { return sl.label + ': ' + sl.accept.map(function (bi) { return strip(ex.bank[bi]); }).join(', '); }).join(' | ');
    } else if (ex.type === 'ordering') {
      N = ex.items.length;
      var order = wstate.order || [];
      order.forEach(function (bi, pos) {
        if (bi === pos) { H++; item('ok', '✓ Position ' + (pos + 1) + ': ' + strip(ex.items[pos])); }
        else { W++; item('no', '✗ Position ' + (pos + 1) + ' — you put "' + strip(ex.items[bi]) + '", expected "' + strip(ex.items[pos]) + '"'); }
      });
      canon = ex.items.map(function (t, i) { return (i + 1) + '. ' + strip(t); }).join(' ');
    } else if (ex.type === 'matching') {
      N = ex.pairs.length;
      ex.pairs.forEach(function (p, li) {
        var a = (wstate.assign || {})[li];
        if (a === undefined) item('mi', '○ Missed: "' + strip(p.left) + '" → ' + esc(p.right));
        else if (a === li) { H++; item('ok', '✓ "' + strip(p.left) + '" → ' + esc(p.right)); }
        else { W++; item('no', '✗ "' + strip(p.left) + '" you matched to "' + strip(ex.pairs[a].right) + '", expected "' + esc(p.right) + '"'); }
      });
      canon = ex.pairs.map(function (p) { return strip(p.left) + ' = ' + strip(p.right); }).join(' | ');
    } else if (ex.type === 'terminal') {
      N = ex.elements.length;
      var cmd = norm(wstate.cmd || '');
      ex.elements.forEach(function (el2) {
        var hit = (el2.any || []).some(function (a) { return cmd.indexOf(String(a).toLowerCase()) >= 0; });
        if (hit) { H++; item('ok', '✓ ' + esc(el2.label)); }
        else { item('mi', '○ Missing: ' + esc(el2.label)); }
      });
      if (!cmd) item('mi', '○ Nothing typed — expected: ' + esc(ex.expected));
      canon = ex.expected;
    } else if (ex.type === 'line-select') {
      N = ex.badLines.length;
      var sel2 = wstate.sel || [];
      ex.badLines.forEach(function (li) {
        if (sel2.indexOf(li) >= 0) { H++; item('ok', '✓ Line ' + (li + 1) + ' is indeed the one to flag'); }
        else { item('mi', '○ Missed line ' + (li + 1) + ': ' + esc(shorten(ex.logLines[li], 90))); }
      });
      sel2.forEach(function (li) {
        if (ex.badLines.indexOf(li) < 0) { W++; item('no', '✗ Line ' + (li + 1) + ' is benign: ' + esc(shorten(ex.logLines[li], 80))); }
      });
      canon = ex.badLines.map(function (li) { return 'line ' + (li + 1); }).join(', ');
    } else if (ex.type === 'multi-step') {
      N = ex.steps.length;
      ex.steps.forEach(function (st, si) {
        var p = (wstate.picks || {})[si];
        if (p === undefined) item('mi', '○ Missed step ' + (si + 1) + ' — expected: ' + strip(st.options[st.correct]));
        else if (p === st.correct) { H++; item('ok', '✓ Step ' + (si + 1) + ': ' + strip(st.options[st.correct])); }
        else { W++; item('no', '✗ Step ' + (si + 1) + ' — you chose "' + strip(st.options[p]) + '", expected "' + strip(st.options[st.correct]) + '"'); }
      });
      canon = ex.steps.map(function (st, si) { return (si + 1) + '. ' + strip(st.options[st.correct]); }).join(' ');
    }
    var credit = N > 0 ? Math.max(0, (H - W) / N) : 0;
    if (N === 1) credit = H === 1 ? 1 : 0; /* single-answer: binary */
    if (S.answers[S.current].hintUsed) credit = Math.max(0, credit - 0.10);
    credit = Math.round(credit * 100) / 100;
    return { credit: credit, items: items, N: N, H: H, W: W, canon: canon };
  }
  function strip(s) { return esc(String(s).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim()); }
  function shorten(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function slotLabelFor(ex, bi) { var lbl = ''; ex.slots.forEach(function (sl) { if (sl.accept.indexOf(bi) >= 0) lbl = sl.label; }); return lbl; }

  /* ---------------- exercise screen ---------------- */
  function renderExercise(i) {
    var ex = EXERCISES[i];
    S.current = i;
    var a = S.answers[i];
    var area = $('exerciseArea'); area.innerHTML = '';
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    $('progressBar').style.width = Math.round(((i + 1) / EXERCISES.length) * 100) + '%';
    var tpEl = $('tbPart'); if (tpEl) { tpEl.textContent = 'Exercise ' + (i + 1) + ' of ' + EXERCISES.length; }

    var card = el('div', 'card');
    /* SCENARIO */
    var sc = el('div', 'block blk-scenario');
    var longSc = ex.scenario.length > 380;
    sc.innerHTML = '<div class="block-h"><span aria-hidden="true">📄</span> SCENARIO' + (longSc ? '<button type="button" class="sc-toggle" aria-expanded="true">⇅ collapse</button>' : '') + '</div>' +
      '<div class="block-b" id="scBody">' + ex.scenario + (ex.artifactNote ? '<div class="dd-hint">' + esc(ex.artifactNote) + '</div>' : '') + '</div>';
    card.appendChild(sc);
    if (longSc) {
      var tbtn = sc.querySelector('.sc-toggle'), body = sc.querySelector('#scBody');
      tbtn.addEventListener('click', function () {

        tbtn.setAttribute('aria-expanded', String(!open));

        body.classList.toggle('hidden', open);
      });
    }
    /* QUESTION */
    card.appendChild(el('div', 'block blk-question',
      '<div class="block-h"><span aria-hidden="true">❓</span> QUESTION</div><div class="block-b">' + ex.question + '</div>'));
    /* YOUR ANSWER */
    var answ = el('div', 'block blk-answer', '<div class="block-h"><span aria-hidden="true">✍</span> YOUR ANSWER</div>');
    var abody = el('div', 'block-b'); answ.appendChild(abody); card.appendChild(answ);

    var wstate = a.wstate;
    widgetFor(ex, abody, wstate);

    /* action row */
    var actions = el('div', 'actions');
    var checkBtn = el('button', 'btn btn-primary', '✓ Check');
    checkBtn.type = 'button'; checkBtn.id = 'checkBtn'; checkBtn.setAttribute('aria-label', 'Check your answer');
    checkBtn.addEventListener('click', doCheck);
    var nextBtn = el('button', 'btn btn-blue hidden', (i === EXERCISES.length - 1 || S.reviewMode) ? (S.reviewMode ? '⏭ Back to review' : '⏭ Final submit') : '⏭ Next');
    nextBtn.type = 'button'; nextBtn.id = 'nextBtn';
    nextBtn.addEventListener('click', goNext);
    var hintBtn = el('button', 'btn btn-amber', '💡 Hint (−10%)');
    hintBtn.type = 'button'; hintBtn.setAttribute('aria-label', 'Show hint, costs 10 percent of this exercise credit');
    hintBtn.disabled = a.hintUsed || a.status === 'checked';
    hintBtn.addEventListener('click', function () {
      if (a.hintUsed || a.status === 'checked') return;
      a.hintUsed = true; hintBtn.disabled = true;
      var hb = el('div', 'hintbox', '<div class="hb-h">💡 Hint — this exercise\'s credit is now reduced by 10%</div>' + esc(ex.hint));
      card.insertBefore(hb, actions);
    });
    var skipBtn = el('button', 'btn btn-ghost', '⚠ Skip');
    skipBtn.type = 'button'; skipBtn.setAttribute('aria-label', 'Skip this exercise'); skipBtn.disabled = a.status === 'checked';
    skipBtn.addEventListener('click', doSkip);
    actions.appendChild(checkBtn); actions.appendChild(nextBtn); actions.appendChild(el('span', 'spacer'));
    actions.appendChild(hintBtn); actions.appendChild(skipBtn);
    card.appendChild(actions);
    area.appendChild(card);

    /* manual pause veil (hidden by default) */
    if (S.timerState === 'PAUSED_MANUAL') showPauseVeil();

    /* restore feedback if already checked (should not normally happen) */
    if (a.status === 'checked') { renderFeedback(card, ex, a, true); checkBtn.disabled = true; nextBtn.classList.remove('hidden'); }

    updateScoreBar();
    /* pause button lives in topbar */
    renderTopbarButtons();
  }
  function renderTopbarButtons() {
    var bar = $('topbar');
    var old = document.getElementById('pauseBtn');
    if (old) old.remove();
    if (S.screen !== 'exam') return;
    var b = el('button', 'btn btn-ghost', '⏸ Pause');
    b.type = 'button'; b.id = 'pauseBtn'; b.setAttribute('aria-label', 'Pause the exam (manual pause)');
    b.addEventListener('click', function () {
      if (S.timerState === 'RUNNING' || S.timerState === 'PAUSED_AUTO_CHECK') {
        S.priorState = S.timerState;
        setTimerState('PAUSED_MANUAL'); showPauseVeil();
      } else if (S.timerState === 'PAUSED_MANUAL') {
        hidePauseVeil(); setTimerState(S.priorState || 'RUNNING');
      }
    });
    bar.appendChild(b);
    var oldF = document.getElementById('finishBtn');
    if (oldF) oldF.remove();
    var f = el('button', 'btn btn-ghost', '⏹ Finish');
    f.type = 'button'; f.id = 'finishBtn'; f.setAttribute('aria-label', 'Finish the exam early');
    f.addEventListener('click', function () { finishExam(false); });

  }
  function showPauseVeil() {
    var stage = document.querySelector('.exam-stage');
    var old = stage.querySelector('.pause-veil'); if (old) old.remove();
    var veil = el('div', 'pause-veil',
      '<div class="pv-ic" aria-hidden="true">⏸</div><div class="pv-word">PAUSED — manual</div>' +
      '<div style="color:var(--text-secondary);max-width:420px">The exercise is hidden while you are on a break. The timer is stopped.</div>');
    var r = el('button', 'btn btn-primary', '▶ Resume');

    r.addEventListener('click', function () {

  function hidePauseVeil() {

  }

  function doCheck() {
    var i = S.current, ex = EXERCISES[i], a = S.answers[i];
    if (a.status === 'checked') return;
    var res = scoreExercise(ex, a.wstate);
    a.status = 'checked';
    a.credit = res.credit;
    a.result = res;
    a.label = res.credit >= 1 ? 'correct' : (res.credit > 0 ? 'partial' : 'incorrect');
    setTimerState('PAUSED_AUTO_CHECK'); /* check-triggered auto-pause */
    var card = $('exerciseArea').querySelector('.card');
    renderFeedback(card, ex, a, false);
    var cb = document.getElementById('checkBtn'); if (cb) cb.disabled = true;
    var sb = document.querySelector('#exerciseArea .btn-ghost'); /* skip button */ if (sb) sb.disabled = true;
    var hb = document.querySelector('#exerciseArea .btn-amber'); if (hb) hb.disabled = true;
    var nb = document.getElementById('nextBtn'); if (nb) nb.classList.remove('hidden');
    lockWidgets(card);
    updateScoreBar();
  }
  function lockWidgets(card) {
    var abody = card.querySelector('.blk-answer');
    if (!abody) return;
    abody.querySelectorAll('button, input').forEach(function (x) {
      x.disabled = true; x.style.pointerEvents = 'none'; x.readOnly = true;
      if (x.classList.contains('chip')) x.draggable = false;
    });
  }
  function renderFeedback(card, ex, a, restoring) {
    var old = card.querySelector('.fb'); if (old) old.remove();
    var res = a.result;
    var cls = a.label === 'correct' ? 'fb-correct' : (a.label === 'partial' ? 'fb-partial' : 'fb-incorrect');
    var word = a.label === 'correct' ? '✓ CORRECT' : (a.label === 'partial' ? '✓ PARTIALLY CORRECT' : '✗ INCORRECT');
    var fb = el('div', 'fb ' + cls);
    var hh = '<span>' + word + '</span>';
    if (res.N > 1) hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + ' — ' + res.H + '/' + res.N + ' items</span>';
    else hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + '</span>';
    if (a.hintUsed) hh += '<span class="fb-credit">💡 hint −0.10 applied</span>';
    fb.appendChild(el('div', 'fb-h', hh));
    var it = el('div', 'fb-items');
    res.items.forEach(function (im) { it.appendChild(el('div', 'fb-item ' + im.state, '<span class="fi-ic">' + (im.state === 'ok' ? '✓' : im.state === 'no' ? '✗' : '○') + '</span><span>' + im.label + '</span>')); });
    fb.appendChild(it);
    if (res.canon) {
      var c = el('div', 'canon');
      c.appendChild(el('div', 'dd-hint', 'Correct answer:'));
      c.appendChild(el('pre', 'art', esc(res.canon)));
      fb.appendChild(c);
    }
    fb.appendChild(el('div', 'exp', ex.explanation));
    if (a.label !== 'correct' && ex.study) fb.appendChild(el('div', 'study', '📚 What to study: ' + esc(ex.study)));
    var acts = card.querySelector('.actions');
    card.insertBefore(fb, acts);
    fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function doSkip() {
    var i = S.current, a = S.answers[i];
    if (a.status === 'checked') return;
    a.status = 'skipped';
    if (S.skipped.indexOf(i) < 0) S.skipped.push(i);
    /* no auto-pause: timer keeps running */
    advance();
  }
  function goNext() {
    if (S.timerState === 'PAUSED_AUTO_CHECK') setTimerState('RUNNING'); /* resume on Next */
    if (S.reviewMode) { S.reviewMode = false; renderReview(); showScreen('review'); return; }
    advance();
  }
  function advance() {
    var nxt = -1;
    for (var j = S.current + 1; j < EXERCISES.length; j++) { if (S.answers[j].status === 'unanswered') { nxt = j; break; } }
    if (nxt < 0) { /* none forward: go to review or results */
      for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered') { nxt = k; break; } }
    }
    if (nxt >= 0) renderExercise(nxt);
    else finishExam(false);
  }

  /* ---------------- review-skipped screen ---------------- */
  function renderReview() {
    var root = $('screen-review'); root.innerHTML = '';
    var c = el('div', 'card');
    c.appendChild(el('h2', null, '⚠ Review skipped exercises'));
    var open = S.skipped.filter(function (i) { return S.answers[i].status === 'skipped'; });
    if (open.length === 0) {
      c.appendChild(el('p', null, 'No skipped exercises left — everything was answered.'));
    } else {
      c.appendChild(el('p', 'dd-hint', 'You can return to any skipped exercise and answer it while the timer has not ended. Skipped-and-never-answered exercises are excluded from your score.'));
      open.forEach(function (i) {
        var row = el('div', 'rev-item');
        row.appendChild(el('span', 'ri-id', esc(EXERCISES[i].id)));
        row.appendChild(el('span', 'ri-sum', esc(EXERCISES[i].summary)));
        var b = el('button', 'btn btn-blue', '↩ Return to it');
        b.type = 'button'; b.setAttribute('aria-label', 'Return to ' + EXERCISES[i].id);
        b.addEventListener('click', function () { S.reviewMode = true; S.reviewFrom = 'review'; showScreen('exam'); renderExercise(i); });
        row.appendChild(b);
        c.appendChild(row);
      });
    }
    var acts = el('div', 'actions');
    var back = el('button', 'btn btn-ghost', '← Keep working (unanswered exercises)');
    back.type = 'button';
    back.addEventListener('click', function () {
      var u = -1; for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered' && S.skipped.indexOf(k) < 0) { u = k; break; } }
      if (u < 0) u = -1;
      if (u >= 0) { showScreen('exam'); renderExercise(u); } else { finishExam(false); }
    });
    var fin = el('button', 'btn btn-primary', '⏹ Final submit');
    fin.type = 'button'; fin.setAttribute('aria-label', 'Final submit and show results');
    fin.addEventListener('click', function () { finishExam(false); });
    acts.appendChild(back); acts.appendChild(el('span', 'spacer')); acts.appendChild(fin);
    c.appendChild(acts);
    root.appendChild(c);
  }

  /* ---------------- results ---------------- */
  function finishExam(timeout) {
    var anySkippedOpen = S.skipped.some(function (i) { return S.answers[i].status === 'skipped'; });
    if (!timeout && anySkippedOpen && S.timerState !== 'ENDED' && S.screen !== 'review') { renderReview(); showScreen('review'); return; }
    setTimerState('ENDED');
    var r = creditSum();
    var answered = r.n;
    var percent = answered > 0 ? Math.round((r.sum / answered) * 100) : 0;
    var passed = percent >= (META.passMark || 70);
    /* counts */
    var full = 0, part = 0, zero = 0, skipped = 0, partSum = 0;
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status;
      if (st === 'checked') {
        var cr = S.answers[i].credit;
        if (cr >= 1) full++;
        else if (cr > 0) { part++; partSum += cr; }
        else zero++;
      } else if (st === 'skipped') skipped++;
      else skipped++; /* unanswered at submit = excluded */
    });
    var root = $('screen-results'); root.innerHTML = '';
    var hero = el('div', 'card');
    var verdictTxt = passed ? '✓ PASS' : '✗ FAIL';
    hero.appendChild(el('div', 'res-hero',
      '<div><div class="res-score">' + percent + '%<small> · ' + r.sum.toFixed(1) + ' / ' + answered + ' credits</small></div>' +
      '<div class="dd-hint">scored over answered exercises only — skipped and never-answered are excluded</div></div>' +
      '<div class="verdict ' + (passed ? 'pass' : 'fail') + '">' + verdictTxt + '</div>'));
    root.appendChild(hero);
    var grid = el('div', 'res-grid');
    function cell(n, l, cls, ic) { return '<div class="res-cell"><div class="rc-n ' + (cls || '') + '">' + n + '</div><div class="rc-l"><span>' + ic + '</span><span>' + l + '</span></div></div>'; }
    grid.innerHTML =
      cell(full, 'Fully correct', 'ok-c', '✓') +
      cell(part + (part > 0 ? ' <small style="font-size:.8rem;color:var(--text-secondary)">(avg ' + (partSum / part).toFixed(2) + ')</small>' : ''), 'Partially correct', 'no-c', '✓') +
      cell(zero, 'Fully incorrect', 'no-c', '✗') +
      cell(skipped, 'Skipped — excluded', 'mi-c', '⚠');
    var gcard = el('div', 'card'); gcard.appendChild(grid);
    gcard.appendChild(el('div', 'dd-hint', '⏸ Time paused manually: ' + fmtTime(Math.round(S.manualPauseMs / 1000)) + ' · ⏸ Time reviewing feedback (auto-pause): ' + fmtTime(Math.round(S.autoPauseMs / 1000)) + ' · ⏱ Time used: ' + fmtTime((META.estimatedMinutes * 60) - S.remaining) + (timeout ? ' (timer ran out)' : '')));
    /* per-exercise strip */
    var strip = el('div', 'strip');
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status, cr = S.answers[i].credit;
      var cls = st === 'checked' ? (cr >= 1 ? 'st-ok' : cr > 0 ? 'st-pa' : 'st-no') : 'st-sk';
      var ic = st === 'checked' ? (cr >= 1 ? '✓' : cr > 0 ? '±' : '✗') : '⚠';
      var chip = el('span', 'st-chip ' + cls, ic);
      chip.title = ex.id + (st === 'checked' ? ' — credit ' + cr.toFixed(2) : ' — skipped/excluded');
      chip.setAttribute('aria-label', chip.title);
      strip.appendChild(chip);
    });
    gcard.appendChild(strip);
    root.appendChild(gcard);
    var acts = el('div', 'actions');
    var rt = el('button', 'btn btn-primary', '↺ Retake the exam');
    rt.type = 'button'; rt.setAttribute('aria-label', 'Retake the exam');
    rt.addEventListener('click', retake);
    acts.appendChild(rt);
    root.appendChild(el('div', 'card', '')).appendChild(acts);
    showScreen('results');
    /* report exactly once per attempt */
    if (!S.reported) {
      S.reported = true;
      reportScore(r.sum, answered);
    }
  }
  function retake() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    S.skipped = []; S.current = 0; S.reviewMode = false; S.reported = false; S.attempt++;
    S.manualPauseMs = 0; S.autoPauseMs = 0; S.priorState = null;
    buildShuffles();
    setTimerState('RUNNING'); S.remaining = (META.estimatedMinutes || 15) * 60;
    showScreen('exam'); renderExercise(0);
  }
  function reportScore(creditSumV, answeredCount) {
    var percent = answeredCount > 0 ? Math.round((creditSumV / answeredCount) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: META.topicId,
        batch: META.batch,
        score: Math.round(creditSumV),
        total: answeredCount,
        percent: percent,
        passed: percent >= 70
      }, location.origin);
    } catch (e) { /* opened directly rather than inside the site — nothing to report to */ }
  }

  /* ---------------- handshake ---------------- */
  window.addEventListener('message', function (event) {
    if (!event.data) return;
    var type = event.data.type;
    if (type !== 'CYBERPULSE_INIT' && type !== 'CYBERMASTERY_INIT') return;
    try {
      if (event.data.username) {
        var c = $('tbCandidate');
        c.textContent = '👤 ' + String(event.data.username).slice(0, 24);
        c.classList.remove('hidden');
      }
      /* country, locale, topicId, batch are consumed; theme is always 'dark' — this file is dark-only by contract */
    } catch (e) { }
  });

  /* ---------------- boot ---------------- */
  function boot() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    buildShuffles();
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    renderIntro();
    showScreen('intro');
  }
  window.__CP_BOOT__ = boot;
})();

</script>
