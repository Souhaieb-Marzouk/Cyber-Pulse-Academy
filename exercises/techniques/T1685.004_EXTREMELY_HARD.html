window.CM_META = {"topicId": "t1685.004", "batch": 4, "title": "T1685.004 Disable or Modify Linux Audit System Log — EXTREMELY HARD", "difficulty": "extremely-hard", "questionCount": 15, "estimatedMinutes": 48, "passMark": 70, "sev": "extreme", "sevName": "EXTREMELY HARD", "sevColor": "#ff6b6b", "objId": "T1685.004", "objName": "Disable or Modify Linux Audit System Log", "objLine": "T1685.004 — Disable or Modify Linux Audit System Log", "objType": "Sub-Technique", "timerMinutes": 48, "timerSeconds": 2880, "partLabel": null, "keywords": [{"theme": "Version & framework awareness", "items": ["ATT&CK version changes and ID renumbering (T1562.012 → T1685.004)", "NIST CSF 2.0 — PR.PS-04, DE.CM-09", "CIS Controls v8 — 8.9, 5.4", "Mitigations M1018 and M1047", "Framework mapping in detection plans"]}, {"theme": "Senior detection & IR decisions", "items": ["Conflicting-signal resolution (EDR vs auth logs)", "Incomplete-information reasoning", "Do-nothing-yet and escalate decisions", "Evidence preservation under pressure", "Blind-window sizing and gap analysis"]}, {"theme": "Real-world campaign context", "items": ["SkidMap (S0628) — audit rule edits on honeypots", "Ebury (S0377) — libaudit hooking precedent", "Crypto-mining and SSH backdoor targeting of Linux servers", "Attribution confidence wording"]}, {"theme": "Evidence, cost & business trade-offs", "items": ["Isolation with real downtime cost", "Destructive vs evidence-safe commands", "Runbook best practice vs live-IR reality", "Executive risk statements"]}, {"theme": "Coverage strategy & compensating controls", "items": ["Per-data-component analytics", "Log-source heartbeat (\"detection of absence\")", "Cross-source correlation (EDR vs audit)", "Immutable audit mode and central forwarding", "Sudo whitelisting after NOPASSWD abuse"]}], "types": ["Branching senior decisions (two separate decision trees)", "Multiple-choice questions with expert-level distractors", "Multi-select strategy sets (partial credit)", "Framework-mapping matching (CIS, NIST CSF, ATT&CK)", "Ordering an evidence-first response sequence", "Sort countermeasures into preventive / detective / compensating bins", "Fill-in-the-blank executive risk statement", "One timed terminal exercise (evidence-safe command under pressure)"], "learnTitle": "What you will learn here", "learnBody": "<p><b>This is the expert tier.</b> The object is <b>T1685.004 — Disable or Modify Linux Audit System Log</b>, the audit-tampering <b>Sub-Technique</b> of <b>T1685 — Disable or Modify Tools</b> under <b>Defense Evasion</b>. Here the exercises chain several concepts, hand you signals that contradict each other, and expect senior-level judgement: which signal wins, what the business cost of each action is, and when the correct move is to <b>gather more evidence</b> rather than act.</p><p>You will decide a live payment-gateway incident where the \"best practice\" answer is wrong, size the blind window a tampering attack creates, map the defences to <b>M1018</b>, <b>M1047</b>, CIS Controls and NIST CSF, and phrase attribution carefully when the trail points at SkidMap-style Linux tooling. One terminal exercise puts you under a visible countdown with a destructive command one keystroke away — exactly as in real live response.</p><p>Take your time inside each exercise: pressing <b>Check</b> stops the clock and gives you unlimited time with the feedback. The timer only paces you between exercises.</p>"};
window.CM_EXERCISES = [{"id": "x-01-conflict-branch", "type": "branch", "tag": "Conflicting signals", "summary": "Four-step decision on a tampering event inside an unapproved-looking change window", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Incident card, gw-pay-01 (payment gateway)", "text": "02:11 — auditctl -D executed via sudo by svc-deploy on gw-pay-01. The change calendar shows \"audit hardening maintenance\" planned for 01:00–03:00. The change repository entry (CHG-2277) exists but its approver field is EMPTY and there is no post-check. A second forwarder on the same host (syslog topic) is shipping normally — only the audit topic went silent. CISO wants a verdict in 10 minutes. The final Check grades all four steps."}, {"k": "log", "label": "ARTEFACT 2 — Forwarder status panel (noise included)", "lines": ["topic=syslog    host=gw-pay-01  status=shipping  lag=2s", "topic=audit     host=gw-pay-01  status=stopped   last_event=02:11:09", "topic=metrics   host=gw-pay-01  status=shipping  lag=4s", "note=host uptime 214 days, no reboot detected"]}], "question": "Work the four decisions in order.", "hint": "Remember what is actually proven: a command ran; a window exists; the approver field is empty. Each step asks what the evidence supports right now.", "explain": "Step 1 — the only defensible reading is \"likely an approved change, but unverified\": the window and executor fit maintenance, yet an empty approver field means nothing is confirmed. Step 2 — the single most probative check is the change repository and the change manager, because approval is the discriminating fact; CPU graphs and reboots answer nothing. Step 3 — an existing-but-unapproved ticket is still unexplained tampering: treat it as an incident until an accountable human confirms it (a plausible-looking ticket is exactly what a prepared attacker creates). Step 4 — escalate to the change manager and IR on-call while preserving state; do not restart, do not edit the ticket, do not silence the analytics.", "study": "Practise wording verdicts that match the evidence: confirmed / probable / unexplained.", "steps": [{"text": "STEP 1 — With the evidence as it stands, which interpretation is best supported?", "options": [{"t": "Probably an approved change, but unverified — the empty approver field forbids closing"}, {"t": "Confirmed approved maintenance — close the alert"}, {"t": "Confirmed intrusion — reimage gw-pay-01 now"}, {"t": "Host outage — the forwarder died"}], "correct": 0, "outcome": "Recorded: you kept the verdict inside what the evidence proves."}, {"text": "STEP 2 — Which single check is most probative right now?", "options": [{"t": "Query the change repository and page the change manager for CHG-2277"}, {"t": "Pull the CPU graph for gw-pay-01"}, {"t": "Reboot the host to reset the forwarders"}, {"t": "Restart auditd to restore the audit topic"}], "correct": 0, "outcome": "Recorded: approval is the discriminating fact — go to its source."}, {"text": "STEP 3 — CHG-2277 exists for \"audit rule refresh\", approver field empty, no post-check. Verdict?", "options": [{"t": "Unexplained until an accountable human confirms — keep treating as an incident"}, {"t": "Ticket exists, therefore benign — close"}, {"t": "Approver field is a formality — close and delete the alert"}, {"t": "Delete CHG-2277 to keep the record clean"}], "correct": 0, "outcome": "Recorded: an unapproved ticket is paper, not approval — attackers stage tickets too."}, {"text": "STEP 4 — The CISO repeats: verdict in 10 minutes. Next action?", "options": [{"t": "Escalate to change manager + IR on-call, preserve host state, report \"unexplained, pending approval check\""}, {"t": "Restart auditd so the topic is green for the CISO screenshot"}, {"t": "Fill in the approver field yourself to close the loop"}, {"t": "Mute the audit analytics for gw-pay-01 until tomorrow"}], "correct": 0, "outcome": "Recorded: escalation with preserved evidence is the senior move under deadline."}]}, {"id": "x-02-version", "type": "mcq", "tag": "Version awareness", "summary": "Resolve the old T1562.012 mapping to the current ID", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Content-migration ticket", "text": "Your detection content was written in 2024 and maps \"Disable or Modify Linux Audit System\" to T1562.012. The new CTI platform ships with current ATT&CK and its parser rejects T1562.012 for this behaviour. Your lead asks what happened and what to do."}, {"k": "code", "label": "ARTEFACT 2 — Platform log", "text": "stix import: attack-pattern T1562.012 not found in enterprise-attack (current)\nhint: behaviour text matches T1685.004 \"Disable or Modify Linux Audit System Log\""}], "question": "What is the correct resolution?", "hint": "ATT&CK reorganised the former Impair Defenses family; the behaviour did not change — only its address.", "explain": "ATT&CK restructured the old T1562 Impair Defenses family in a recent version; the Linux-audit behaviour moved to the new parent T1685 — Disable or Modify Tools and is now T1685.004. The correct action is to re-map the content to T1685.004 and record the old ID as a historical alias. Keeping dead IDs breaks automation, and rewriting the behaviour text to fit the ID backwards is how documentation drifts.", "study": "Skim the ATT&CK release notes each version — renumbering hits detection content, reports and tickets.", "options": [{"t": "Re-map the content to T1685.004 and note T1562.012 as the historical ID", "correct": true}, {"t": "Keep T1562.012 — ATT&CK never renumbers anything", "correct": false}, {"t": "Invent a new ID for the behaviour and register it", "correct": false}, {"t": "Delete the detection content entirely", "correct": false}]}, {"id": "x-03-coverage-plan", "type": "multi", "tag": "Coverage strategy", "summary": "Select the three components of a complete fleet coverage plan", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Detection plan review, Linux fleet (3,400 hosts)", "text": "Plan review for T1685.004 fleet coverage. The reviewer asks: which THREE elements, together, make the plan complete and defensible? Wrong picks subtract."}], "question": "Which THREE elements belong in the complete coverage plan?", "hint": "Watch the mechanism (files), watch the state (service/process), and watch the stream itself go quiet.", "explain": "FIM on /etc/audit/audit.rules and audit.conf covers the file-edit path; service-state plus process-termination telemetry (via EDR or auditd-independent agents) covers stop/disable and kill paths; and a log-source heartbeat catches every path that makes the stream stop, including ones you have not thought of yet. Keeping logs only on the host is the failure mode this technique exploits, disabling ausearch removes a response tool, and Windows-only logging leaves the entire Linux estate uncovered.", "study": "File + state + stream: the triad behind every tampering-coverage plan.", "options": [{"t": "FIM on /etc/audit/audit.rules and audit.conf", "correct": true}, {"t": "Service-state and process-termination telemetry independent of auditd", "correct": true}, {"t": "A log-source heartbeat alerting when audit events stop", "correct": true}, {"t": "Storing audit logs only on the host itself", "correct": false}, {"t": "Disabling ausearch to save disk space", "correct": false}]}, {"id": "x-04-real-cost", "type": "mcq", "tag": "Business cost", "summary": "Decide the action that accepts a real business cost", "scenario": [{"k": "text", "label": "ARTEFACT 1 — CISO bridge, fin-gw-02 (settlement gateway)", "text": "EDR confirms a live intruder with root on fin-gw-02; auditd was stopped 25 minutes ago; the settlement batch window has 40 minutes left and shutting the NIC delays settlements to partner banks (contractual fines). The CISO needs one decision now. Tampering of telemetry plus live root access is confirmed — the attacker is actively working."}], "question": "Which decision do you put on the bridge?", "hint": "Two options look responsible: watch quietly and preserve. One of them assumes the attacker will politely wait — what does active telemetry tampering tell you?", "explain": "Isolate fin-gw-02 now and accept the settlement delay. Confirmed live root plus telemetry tampering means the attacker is actively erasing visibility — quiet monitoring hands them the remaining minutes, and the host sits inside PCI scope. Powering off keeps the data safe but destroys volatile memory evidence, and restarting auditd while the intruder holds root just restarts the chase. The correct answer carries a real, payable cost — and it is still correct.", "study": "Pre-agree isolation authority with the business so the cost conversation happens before the incident.", "options": [{"t": "Isolate fin-gw-02 from the network now — accept the settlement delay", "correct": true}, {"t": "Monitor quietly until the settlement batch finishes", "correct": false}, {"t": "Power the host off immediately to protect data", "correct": false}, {"t": "Restart auditd and keep the gateway serving", "correct": false}]}, {"id": "x-05-terminal-evidence", "type": "terminal", "tag": "Timed terminal — evidence", "summary": "Collect the auditd journal window without touching the live host state", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Evidence order, case 4412 (live host gw-pay-01)", "text": "Legal order: \"We need evidence that will survive scrutiny — the auditd unit journal from 13:20 to 13:55 on 2026-10-20, captured read-only from the live host. Touch nothing that changes service or kernel state; the defence will check command history.\" A destructive mistake here is a court exhibit."}, {"k": "text", "label": "ARTEFACT 2 — Timing note", "text": "This exercise has its own visible 4-minute countdown. It pauses together with the exam timer when you press Check."}], "question": "Type the single read-only command that prints the auditd unit journal for that exact window.", "hint": "The constraint is evidence safety: a read tool with a unit filter and an exact time window. Nothing that restarts, kills or clears anything.", "explain": "journalctl -u auditd --since \"2026-10-20 13:20:00\" --until \"2026-10-20 13:55:00\" prints exactly the auditd unit journal for the ordered window without changing any state — safe for live evidence handling and clean to defend. systemctl restart auditd would alter service state and rotation; auditctl -D would destroy the rule set; piping through shred or redirecting over files destroys evidence. The countdown exists because in real live response this exact decision gets made under pressure — and the safe command is still the fast one.", "study": "Rehearse read-only evidence commands until they are muscle memory — under pressure you type what you practised.", "terminal": {"title": "root@gw-pay-01: ~ (LIVE — evidence collection)", "prompt": "root@gw-pay-01:~#", "canonical": "journalctl -u auditd --since \"2026-10-20 13:20:00\" --until \"2026-10-20 13:55:00\"", "out": "— Logs begin at Sun 2026-10-20 09:00:02 UTC —\nOct 20 13:20:04 gw-pay-01 auditd[1102]: Audit daemon rotating log files\nOct 20 13:41:11 gw-pay-01 systemd[1]: Stopping Audit Service...\nOct 20 13:41:12 gw-pay-01 systemd[1]: Stopped Audit Service.\n— Evidence window complete (read-only) —", "banner": ["LIVE host — legal evidence order in force. Read-only discipline.", "Countdown is visible in the terminal bar. Type the command, then press Check."], "perEx": 240, "elements": [{"re": "\\bjournalctl\\b", "label": "journalctl (read-only journal reader)", "why": "It reads systemd journals without touching state — the evidence-safe tool."}, {"re": "\\s-u\\s+auditd(\\.service)?", "label": "-u auditd (unit filter)", "why": "Filters the journal to the auditd unit — the records legal asked for."}, {"re": "\\s--since(=|\\s)", "label": "--since (window start)", "why": "Bounds the evidence window at 13:20 as ordered."}, {"re": "\\s--until(=|\\s)", "label": "--until (window end)", "why": "Bounds the evidence window at 13:55 as ordered."}], "forbidden": [{"re": "\\b(stop|start|restart|kill)\\b", "label": "a state-changing word", "why": "On a live evidence host this alters service state — a court-visible mistake."}, {"re": "\\s-D(\\s|$)", "label": "-D (rule flush)", "why": "Destroys the kernel rule set — evidence destruction."}, {"re": "\\b(shred|rm\\s|-w\\s+delete)\\b", "label": "a destructive deletion word", "why": "Deleting or shredding anything on the evidence host ends the case."}]}}, {"id": "x-06-bestpractice-wrong", "type": "mcq", "tag": "Best practice — wrong here", "summary": "Explain why the runbook’s \"restore logging immediately\" is wrong in this live IR", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Runbook excerpt vs live case", "text": "Runbook RT-14, \"Telemetry outage on Linux\", step 1: \"Restore logging immediately: systemctl restart auditd; verify heartbeat.\" You are inside live IR case 4412 on gw-pay-01: intruder confirmed with root 25 minutes ago, auditd stopped 23 minutes ago, nothing preserved yet. The runbook is normally excellent. Why is following it wrong right now?"}], "question": "Why is the runbook step the wrong answer in this specific context?", "hint": "The runbook assumes the outage is an accident. What does that assumption change about step 1?", "explain": "The runbook optimises for an accidental outage: restoring logging fast is harmless because nothing is hiding in runtime state. In a live intrusion the restart is itself a state change — it can rotate logs, reset in-memory state and destroy exactly the runtime evidence the case needs, while the intruder still holds root. The correct order is preserve (memory snapshot, config and journal copies) and then restore via change control. A good best practice applied outside its assumptions becomes a mistake.", "study": "For every runbook step, write down the assumptions it silently makes.", "options": [{"t": "It restarts a live-evidence host before preservation — destroying runtime state the case needs", "correct": true}, {"t": "It is wrong because auditd should never be restarted, ever", "correct": false}, {"t": "It is wrong because runbooks are never allowed during incidents", "correct": false}, {"t": "It is wrong because restart requires a maintenance window even in incidents", "correct": false}]}, {"id": "x-07-framework-match", "type": "match", "tag": "Framework mapping", "summary": "Map six controls to their framework entries", "scenario": [{"k": "text", "label": "ARTEFACT 1 — GRC mapping worksheet", "text": "The GRC team is folding the T1685.004 control set into the annual framework report. Match each control to the framework entry it satisfies. Entries are paraphrased in plain words."}], "question": "Match each control to its framework entry.", "hint": "Two CIS controls (centralise logs, restrict privileges), two NIST CSF statements (logs generated and available; monitoring finds adverse events), and the two ATT&CK mitigations.", "explain": "CIS Control 8.9 centralises audit log collection and forwarding; CIS Control 5.4 restricts admin privileges to the minimum needed. NIST CSF 2.0 PR.PS-04 says log records are generated and made available for continuous monitoring; DE.CM-09 covers monitoring computing hardware, software and runtime data for adverse events. M1018 User Account Management limits who can exercise root; M1047 Audit means reviewing the audit settings regularly. One control set, four frameworks — that is how a single technique feeds a GRC report.", "study": "Keep a small mapping table per technique: ATT&CK mitigation → CIS → NIST CSF.", "items": [{"l": "Centralised log forwarding", "r": "CIS Control 8.9 — centralise audit logs"}, {"l": "Sudo whitelisting / least privilege", "r": "CIS Control 5.4 — restrict admin privileges"}, {"l": "Audit logs generated and available for monitoring", "r": "NIST CSF 2.0 — PR.PS-04"}, {"l": "Monitoring finds adverse events on hosts", "r": "NIST CSF 2.0 — DE.CM-09"}, {"l": "Limit who can become root", "r": "M1018 — User Account Management"}, {"l": "Regular reviews of audit settings", "r": "M1047 — Audit"}]}, {"id": "x-08-skidmap-campaign", "type": "branch", "tag": "Campaign analysis", "summary": "Three-step campaign analysis of a SkidMap-style honeypot hit", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Honeypot farm report, lab segment", "text": "Your honeypot farm caught a SkidMap-style campaign: dropper installed a Monero miner, edited /etc/audit/audit.rules adding never rules, stopped the audit service, persisted via cron, all within 9 minutes. Binary hashes have no vendor coverage yet. Answer the three analysis steps; final Check grades all."}, {"k": "log", "label": "ARTEFACT 2 — Honeypot capture summary", "lines": ["T+0:00  initial access via weak SSH credentials (honey account)", "T+1:20  miner payload staged from hxxp://cdn-mirror[.]example/ws.tar", "T+2:05  audit.rules modified: \"-a never,task\" appended", "T+2:31  systemctl stop auditd", "T+3:00  cron persistence installed (/etc/cron.d/ksync)", "T+4:12  miner begins; audit stream already silent"]}], "question": "Answer the three campaign-analysis decisions.", "hint": "Step 1: map the behaviour to techniques, not to malware names. Step 2: attribution follows evidence strength. Step 3: the report line must name a detection, not a rumour.", "explain": "Step 1 — the audit tampering is T1685.004 (rule edit + service stop) and the cron persistence is T1053.003; mapping behaviours to techniques keeps the report useful even before the binary is named. Step 2 — correct attribution wording is \"SkidMap-style tooling, moderate confidence\": TTP and infrastructure overlap support a family call, but with no hash coverage you do not state operator identity as fact. Step 3 — the actionable line names the detections (FIM on audit rules, service-state alerts) and shares sanitised TTPs; publishing unvetted hashes or deleting the honeypot record destroys value and credibility.", "study": "Technique-first reporting keeps intelligence useful while attribution matures.", "steps": [{"text": "STEP 1 — Which ATT&CK mapping best describes the captured behaviour?", "options": [{"t": "T1685.004 for the audit tampering plus T1053.003 (cron) for persistence"}, {"t": "T1070.002 only — everything was log clearing"}, {"t": "T1486 ransomware — the files were encrypted"}, {"t": "No mapping possible without a malware name"}], "correct": 0, "outcome": "Recorded: behaviour-first mapping survives missing binary attribution."}, {"text": "STEP 2 — Vendors have no coverage for the hashes. Attribution wording?", "options": [{"t": "SkidMap-style tooling — moderate confidence, based on TTP and infrastructure overlap"}, {"t": "SkidMap operators confirmed — state as fact"}, {"t": "Attribution is impossible in principle — omit entirely"}, {"t": "Blame the honeypot vendor"}], "correct": 0, "outcome": "Recorded: confidence language matched to evidence strength."}, {"text": "STEP 3 — The intelligence report needs its closing action line. Which one?", "options": [{"t": "Deploy FIM on audit rules and service-state alerts; share sanitised TTPs with peers"}, {"t": "Publish all raw hashes immediately, before any vetting"}, {"t": "Delete the honeypot capture to save storage"}, {"t": "Recommend disabling honeypots because they attract attackers"}], "correct": 0, "outcome": "Recorded: the action line converts intelligence into coverage."}]}, {"id": "x-09-evidence-order", "type": "order", "tag": "Evidence-first sequence", "summary": "Order the six-step senior response to confirmed audit tampering", "scenario": [{"k": "text", "label": "ARTEFACT 1 — Case 4412 all-hands plan", "text": "Confirmed: intruder with root on gw-pay-01 stopped auditd and edited rules; host is live and valuable. The IR lead asks you to put the six-step plan in order. Discipline: scope, preserve, collect, restore, measure, report."}], "question": "Put the six steps in the correct order.", "hint": "Scope before you touch, preserve volatile state before confi /* ---------------- terminal ---------------- */
function normCmd(s) { return String(s).replace(/\s+/g, ' ').trim().toLowerCase(); }
function sameCmd(a, b) {
  if (a === b) return true;
  var ta = a.split(' ').filter(Boolean), tb = b.split(' ').filter(Boolean);
  if (ta.length !== tb.length) return false;
  var oa = ta.filter(function (t) { return t.charAt(0) === '-'; }).sort();
  var ob = tb.filter(function (t) { return t.charAt(0) === '-'; }).sort();
  var pa = ta.filter(function (t) { return t.charAt(0) !== '-'; });
  var pb = tb.filter(function (t) { return t.charAt(0) !== '-'; });
  return oa.join(' ') === ob.join(' ') && pa.join(' ') === pb.join(' ');
}
function termPrint(ex, html, cls) {

  if (!sc) return;
  var d = document.createElement('div');

  sc.scrollTop = sc.scrollHeight;
}

  area.appendChild(box);
  if (t.syntax) {
    var sp = document.createElement('div'); sp.className = 'syntax-panel';
    sp.innerHTML = '<h4>\u2139 Syntax reminder</h4><p><code>' + esc(t.syntax.shape) + '</code></p>' +
      '<ul>' + t.syntax.notes.map(function (n) { return '<li>' + md(n).replace(/^<p>|<\/p>$/g, '') + '</li>'; }).join('') + '</ul>' +
      '<div class="sample">Example on a different unit: <code>' + esc(t.syntax.example) + '</code>' +
      (t.syntax.sample ? '<br>Output looks like:<br><code>' + esc(t.syntax.sample).replace(/\n/g, '<br>') + '</code>' : '') + '</div>';
    area.appendChild(sp);
  }
  (t.banner || []).forEach(function (l) { termPrint(ex, esc(l), 't-info'); });
  var inp = $('term-input');

    else if (n) { termPrint(ex, 'command accepted for review \u2014 press Check to grade your answer.', 't-info'); }
  });
  if (t.perEx) { perExStart(t.perEx); var el = $('perex-chip'); if (el) el.textContent = '\u23F1 ' + mmss(t.perEx) + ' left for this exercise'; }
  inp.focus();

/* ---------------- grading ---------------- */
function scoreExercise(H, W, N) { return Math.max(0, (H - W) / N); }
function grade(ex) {
  var I = S.inter, H, W, N, rows = [], i;
  if (ex.type === 'mcq') {
    N = 1;
    var picked = I.sel.length ? I.disp[I.sel[0]] : -1;
    var ok = picked >= 0 && ex.options[picked].correct;
    H = ok ? 1 : 0; W = ok ? 0 : (picked >= 0 ? 1 : 0);
    if (ok) rows.push({ st: 'ok', text: 'You picked the correct option.' });
    else if (picked >= 0) rows.push({ st: 'bad', text: 'You picked: \u201C' + ex.options[picked].t + '\u201D \u2014 not correct here.' });
    else rows.push({ st: 'bad', text: 'You did not pick any option.' });
    var co = ex.options.filter(function (o) { return o.correct; })[0];
    if (!ok) rows.push({ st: 'miss', text: 'Correct answer: \u201C' + co.t + '\u201D' });
    return { credit: scoreExercise(H, W, N), rows: rows };
  }
  if (ex.type === 'multi') {
    var corr = ex.options.map(function (o, oi) { return o.correct ? oi : -1; }).filter(function (x) { return x >= 0; });
    N = corr.length; H = 0; W = 0;
    ex.options.forEach(function (o, oi) {
      var sel = I.sel.indexOf(I.disp.indexOf(oi)) !== -1;
      if (o.correct && sel) { H++; rows.push({ st: 'ok', text: '\u201C' + o.t + '\u201D \u2014 correct, you selected it.' }); }
      else if (!o.correct && sel) { W++; rows.push({ st: 'bad', text: '\u201C' + o.t + '\u201D \u2014 you selected it, but it does not belong.' }); }
      else if (o.correct && !sel) { rows.push({ st: 'miss', text: '\u201C' + o.t + '\u201D \u2014 you missed this correct item.' }); }
    });
    return { credit: scoreExercise(H, W, N), rows: rows };
  }
  if (ex.type === 'match') {
    N = ex.items.length; H = 0; W = 0;
    ex.items.forEach(function (it, li) {
      var c = I.choices[li];
      if (c === it.r) { H++; rows.push({ st: 'ok', text: '\u201C' + it.l + '\u201D \u2192 \u201C' + it.r + '\u201D \u2014 correct.' }); }
      else if (c) { W++; rows.push({ st: 'bad', text: '\u201C' + it.l + '\u201D \u2192 you chose \u201C' + c + '\u201D. Correct: \u201C' + it.r + '\u201D.' }); }
      else { rows.push({ st: 'miss', text: '\u201C' + it.l + '\u201D \u2014 left unmatched. Correct: \u201C' + it.r + '\u201D.' }); }
    });
    return { credit: scoreExercise(H, W, N), rows: rows };
  }
  if (ex.type === 'fill') {
    N = ex.blanks.length; H = 0; W = 0;
    ex.blanks.forEach(function (b, bi) {
      var p = I.picks[bi];
      if (p === b) { H++; rows.push({ st: 'ok', text: 'Blank ' + (bi + 1) + ': \u201C' + b + '\u201D \u2014 correct.' }); }
      else if (p) { W++; rows.push({ st: 'bad', text: 'Blank ' + (bi + 1) + ': you wrote \u201C' + p + '\u201D. Correct: \u201C' + b + '\u201D.' }); }
      else { rows.push({ st: 'miss', text: 'Blank ' + (bi + 1) + ' left empty. Correct: \u201C' + b + '\u201D.' }); }
    });
    return { credit: scoreExercise(H, W, N), rows: rows };
  }
  if (ex.type === 'assign') {
    N = ex.items.length; H = 0; W = 0;
    ex.items.forEach(function (it) {
      var b = I.place[it.id];
      if (b === it.bucket) { H++; rows.push({ st: 'ok', text: '\u201C' + it.t + '\u201D \u2192 \u201C' + bucketLabel(ex, it.bucket) + '\u201D \u2014 correct.' }); }
      else if (b) { W++; rows.push({ st: 'bad', text: '\u201C' + it.t + '\u201D \u2192 \u201C' + bucketLabel(ex, b) + '\u201D. Correct bin: \u201C' + bucketLabel(ex, it.bucket) + '\u201D.' }); }
      else { rows.push({ st: 'miss', text: '\u201C' + it.t + '\u201D \u2014 left in the bank. Correct bin: \u201C' + bucketLabel(ex, it.bucket) + '\u201D.' }); }
    });
    return { credit: scoreExercise(H, W, N), rows: rows };
  }
  if (ex.type === 'order') {
    N = ex.items.length; H = 0; W = 0; var marks = [];
    for (i = 0; i < N; i++) {
      var okp = I.seq[i] === ex.items[i].id;
      marks.push(okp);
      if (okp) { H++; rows.push({ st: 'ok', text: 'Position ' + (i + 1) + ': \u201C' + itemText(ex, ex.items[i].id) + '\u201D \u2014 correct.' }); }
      else { W++; rows.push({ st: 'bad', text: 'Position ' + (i + 1) + ': you placed \u201C' + itemText(ex, I.seq[i]) + '\u201D. Correct: \u201C' + itemText(ex, ex.items[i].id) + '\u201D.' }); }
    }
    return { credit: scoreExercise(H, W, N), rows: rows, marks: marks };
  }
  if (ex.type === 'branch') {
    N = ex.steps.length; H = 0; W = 0;
    ex.steps.forEach(function (s, si) {
      var di = I.choices[si];
      var oi = (di !== undefined && I.dispStep && I.dispStep[si]) ? I.dispStep[si][di] : -1;
      if (oi === s.correct) { H++; rows.push({ st: 'ok', text: 'Step ' + (si + 1) + ' \u2014 good decision.' }); }
      else { W++; rows.push({ st: 'bad', text: 'Step ' + (si + 1) + ' \u2014 you chose \u201C' + (s.options[oi] ? s.options[oi].t : '(no choice)') + '\u201D. Better: \u201C' + s.options[s.correct].t + '\u201D.' }); }
    });
    return { credit: scoreExercise(H, W, N), rows: rows };
  }
  if (ex.type === 'terminal') {
    var t = ex.terminal;
    var n = normCmd(I.cmd || '');
    N = t.elements.length; H = 0; W = 0;
    t.elements.forEach(function (el) {
      if (el.re.test(n)) { H++; rows.push({ st: 'ok', text: el.label + ' \u2014 found. ' + el.why }); }
      else { rows.push({ st: 'miss', text: el.label + ' \u2014 missing. ' + el.why }); }
    });
    var danger = false;
    (t.forbidden || []).forEach(function (f) {
      if (f.re.test(n)) { W++; danger = true; rows.push({ st: 'bad', text: '\u2717 DANGEROUS \u2014 NEAR MISS: ' + f.label + ' ' + f.why }); }
    });
    if (!n) rows.unshift({ st: 'bad', text: 'You submitted an empty command line.' });
    return { credit: scoreExercise(H, W, N), rows: rows, danger: danger, typed: n };
  }
  return { credit: 0, rows: [] };
}
function bucketLabel(ex, id) {
  var b = ex.buckets.filter(function (x) { return x.id === id; })[0];
  return b ? b.label : id;
}
function itemText(ex, id) {
  if (id === undefined) return '(nothing)';
  var it = ex.items.filter(function (x) { return x.id === id; })[0];
  return it ? it.t : '(nothing)';
}
/* ---------------- check / feedback / flow ---------------- */
function setCheckVisible(v) {
  var c = $('btn-check');
  if (c) c.classList.toggle('hidden', !v);
}
function onCheck() {
  if (S.checked[S.idx]) return;
  var ex = curEx();
  if (ex.type === 'branch') {
    var done = ex.steps.every(function (_, si) { return S.inter.choices[si] !== undefined; });
    if (!done) return; /* final Check only exists once every step is confirmed */
  }
  if (ex.type === 'terminal') { var ti = $('term-input'); if (ti && String(ti.value).trim()) S.inter.cmd = ti.value; }
  setState('PAUSED_AUTO_CHECK');   /* first action, before feedback renders */
  perExStop();
  var g = grade(ex);
  var pen = S.hintUsed[S.idx] ? 0.10 : 0;
  var credit = Math.max(0, g.credit - pen);
  S.checked[S.idx] = true;
  S.answered[S.idx] = credit;
  S.creditsSum += credit;
  S.skipped = S.skipped.filter(function (p) { return p !== S.idx; });
  S.curGraded = { g: g, credit: credit };
  S.locked = true;
  lockUI(ex, g);
  renderFeedback(ex, g, credit);
  var br = $('btn-row');
  br.innerHTML = '';
  var nb = document.createElement('button');
  nb.className = 'btn btn-green'; nb.id = 'btn-next';
  nb.textContent = S.returnTo === 'review' ? '\u21B9 Back to review \u25B6'
    : (S.idx + 1 === EXS.length) ? 'Final Submit \u25B6' : 'Next \u25B6';
  nb.addEventListener('click', onNext);
  br.appendChild(nb);
  var hb = $('btn-hint'); if (hb) hb.disabled = true;
  var sb = $('btn-skip'); if (sb) sb.disabled = true;
  renderHeader();
}
function lockUI(ex, g) {
  var I = S.inter;
  if (ex.type === 'mcq' || ex.type === 'multi') {
    document.querySelectorAll('#blk-ans .opt').forEach(function (b) {
      var di = parseInt(b.getAttribute('data-di'), 10);
      var oi = I.disp[di];
      var sel = I.sel.indexOf(di) !== -1;
      var corr = ex.options[oi].correct;
      b.classList.add('locked');
      var v = document.createElement('span'); v.className = 'verdict';
      if (sel && corr) { b.classList.add('correct'); v.className += ' v-ok'; v.textContent = '\u2713 Correct'; }
      else if (sel && !corr) { b.classList.add('wrong'); v.className += ' v-bad'; v.textContent = '\u2717 Wrong'; }
      else if (!sel && corr && ex.type === 'multi') { b.classList.add('missed'); v.className += ' v-miss'; v.textContent = '\u25CB Missed'; }
      else if (!sel && corr && ex.type === 'mcq') { b.classList.add('missed'); v.className += ' v-miss'; v.textContent = '\u25CB Missed \u2014 this was correct'; }
      b.appendChild(v);
    });
  } else if (ex.type === 'match') {
    document.querySelectorAll('#blk-ans .match-row').forEach(function (row, li) {
      var mk = row.querySelector('.pair-mark');
      var ok = I.choices[li] === ex.items[li].r;
      mk.style.display = '';
      mk.className = 'pair-mark ' + (ok ? 'ok' : (I.choices[li] ? 'bad' : 'miss'));
      mk.textContent = ok ? '\u2713 Correct' : (I.choices[li] ? '\u2717 Wrong' : '\u25CB Missed');
      row.querySelector('select').disabled = true;
    });
  } else if (ex.type === 'fill') {
    var slots = 0;
    document.querySelectorAll('#blk-ans .blank-sel').forEach(function (sel) {
      var bi = slots++;
      var mk = sel.parentElement.querySelector('.pair-mark');
      var ok = I.picks[bi] === ex.blanks[bi];
      mk.style.display = '';
      mk.className = 'pair-mark ' + (ok ? 'ok' : (I.picks[bi] ? 'bad' : 'miss'));
      mk.textContent = ok ? '\u2713' : (I.picks[bi] ? '\u2717' : '\u25CB');
      sel.disabled = true;
    });
  } else if (ex.type === 'assign') {
    document.querySelectorAll('#blk-ans .chip').forEach(function (chip) {
      var iid = chip.getAttribute('data-iid');
      var it = ex.items.filter(function (x) { return x.id === iid; })[0];
      var placed = I.place[iid];
      var v = document.createElement('span');
      if (placed === it.bucket) { v.className = 'chip-verdict v-ok'; v.textContent = '\u2713'; }
      else if (placed) { v.className = 'chip-verdict v-bad'; v.textContent = '\u2717'; }
      else { v.className = 'chip-verdict v-miss'; v.textContent = '\u25CB missed'; }
      chip.appendChild(v);
      var x = chip.querySelector('.x'); if (x) x.remove();
      chip.setAttribute('draggable', 'false');
    });
  } else if (ex.type === 'order') {
    drawOrder(ex, g.marks);
  } else if (ex.type === 'branch') {
    document.querySelectorAll('#blk-ans .step-box').forEach(function (box) {
      var si = parseInt(box.getAttribute('data-step'), 10);
      box.querySelectorAll('.opt').forEach(function (b) {
        var di = parseInt(b.getAttribute('data-di'), 10);
        var oi = I.dispStep[si][di];
        var chosen = I.choices[si] === di;
        var v = document.createElement('span'); v.className = 'verdict';
        if (chosen && oi === ex.steps[si].correct) { b.classList.add('correct'); v.className += ' v-ok'; v.textContent = '\u2713 Correct'; }
        else if (chosen) { b.classList.add('wrong'); v.className += ' v-bad'; v.textContent = '\u2717 Wrong'; }
        else if (oi === ex.steps[si].correct) { b.classList.add('missed'); v.className += ' v-miss'; v.textContent = '\u25CB Missed'; }
        b.appendChild(v);
      });
    });
  } else if (ex.type === 'terminal') {
    var inp = $('term-input'); if (inp) { inp.disabled = true; }
    var t = ex.terminal;
    termPrint(ex, '\u2500 simulator output \u2500', 't-info');
    termPrint(ex, esc(t.out));
  }
}
function renderFeedback(ex, g, credit) {
  var lab, cls, icon;
  if (credit >= 0.9999) { lab = 'CORRECT'; cls = 'f-correct'; icon = '\u2713'; }
  else if (credit <= 0.0001) { lab = 'INCORRECT'; cls = 'f-incorrect'; icon = '\u2717'; }
  else { lab = 'PARTIALLY CORRECT'; cls = 'f-partial'; icon = '\u2713'; }
  var multi = ['multi', 'match', 'fill', 'assign', 'order', 'branch'].indexOf(ex.type) !== -1 || ex.type === 'terminal';
  var creditLine = multi ? '<span class="fb-credit">credit ' + (Math.round(credit * 100) / 100).toFixed(2) + (credit > 0 ? ' \u2014 ' + countPicked(ex, g) : '') + '</span>' : '';
  var h = '<div class="fb-head ' + cls + '"><span aria-hidden="true">' + icon + '</span> ' + lab + creditLine + '</div>';
  var body = '<div class="fb-body"><h4>Why</h4>' + md(ex.explain);
  body += '<h4>Item by item</h4><div class="fb-items">' + g.rows.map(function (r) {
    var mark = r.st === 'ok' ? '<span class="i-mark">\u2713 Correct</span>' : r.st === 'bad' ? '<span class="i-mark">\u2717 Wrong</span>' : '<span class="i-mark">\u25CB Missed</span>';
    return '<div class="fb-item i-' + (r.st === 'ok' ? 'ok' : r.st === 'bad' ? 'bad' : 'miss') + '">' + mark + '<p>' + md(r.text).replace(/^<p>|<\/p>$/g, '') + '</p></div>';
  }).join('') + '</div>';
  if (g.danger) body += '<div class="study-tip danger"><b>\u2717 DANGEROUS \u2014 NEAR MISS:</b> your command would have changed the state of the host or destroyed evidence. In real work, that is a serious mistake even when the goal is right. Read the canonical command below.</div>';
  if (ex.type === 'terminal') {
    var t = ex.terminal;
    body += '<h4>Canonical command</h4><div class="canon-cmd"><button type="button" class="copy-btn" id="btn-copy">\u29C9 Copy</button><pre>' + esc(t.canonical) + '</pre></div>' +
      '<div class="fb-items">' + t.elements.map(function (el) {
        return '<div class="fb-item i-ok"><span class="i-mark">\u2713 Element</span><p><code>' + esc(el.label) + '</code> \u2014 ' + md(el.why).replace(/^<p>|<\/p>$/g, '') + '</p></div>';
      }).join('') + '</div>';
    if ((t.forbidden || []).length) {
      body += '<div class="fb-items">' + t.forbidden.map(function (f) {
        return '<div class="fb-item i-bad"><span class="i-mark">\u2717 Avoid</span><p><code>' + esc(f.label) + '</code> \u2014 ' + md(f.why).replace(/^<p>|<\/p>$/g, '') + '</p></div>';
      }).join('') + '</div>';
    }
  }
  if (ex.dual) {
    body += '<div class="dual-persp"><div class="dp red"><h5>\u25CF Attacker perspective</h5><p>' + md(ex.dual.red).replace(/^<p>|<\/p>$/g, '') + '</p></div>' +
      '<div class="dp blue"><h5>\u25CF Defender perspective</h5><p>' + md(ex.dual.blue).replace(/^<p>|<\/p>$/g, '') + '</p></div></div>';
  }
  if (ex.study) body += '<div class="study-tip"><b>What to study next:</b> ' + md(ex.study).replace(/^<p>|<\/p>$/g, '') + '</div>';
  body += '</div>';
  $('fb-area').innerHTML = h + body;
  var cp = $('btn-copy');
  if (cp) cp.addEventListener('click', function () {
    try {
      navigator.clipboard.writeText(ex.terminal.canonical).then(function () { cp.textContent = '\u2713 Copied'; }, function () { cp.textContent = 'Select & copy manually'; });
    } catch (e) { cp.textContent = 'Select & copy manually'; }
  });
  $('fb-area').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function countPicked(ex, g) {
  var ok = g.rows.filter(function (r) { return r.st === 'ok'; }).length;
  var bad = g.rows.filter(function (r) { return r.st === 'bad' && r.text.indexOf('DANGEROUS') === -1; }).length;
  var miss = g.rows.filter(function (r) { return r.st === 'miss'; }).length;
  var n = ok + bad + miss;
  return ok + '/' + n + ' items';
}
function onNext() {
  if (S.tState === 'PAUSED_AUTO_CHECK') setState('RUNNING');
  if (S.returnTo === 'review') { showReview(); return; }
  if (S.idx + 1 < EXS.length) { S.idx++; renderExercise(); }
  else { maybeReview(); }
}
function onSkip() {
  if (S.locked || S.checked[S.idx]) return;
  if (S.skipped.indexOf(S.idx) === -1) S.skipped.push(S.idx);
  renderHeader();
  if (S.returnTo === 'review') { S.returnTo = null; showReview(); return; }
  if (S.idx + 1 < EXS.length) { S.idx++; renderExercise(); }
  else { maybeReview(); }
}
function onHint() {
  if (S.locked || S.hintUsed[S.idx]) return;
  S.hintUsed[S.idx] = true;
  $('hint-slot').innerHTML = '<div class="hint-panel"><div class="h-head">\u2600 Hint \u2014 costs 10% of this exercise\u2019s credit</div>' + md(curEx().hint) + '</div>';
  $('btn-hint').disabled = true;
}
function onPause() {
  if (S.phase !== 'exam' && S.phase !== 'review') return;
  if (S.tState !== 'RUNNING' && S.tState !== 'PAUSED_AUTO_CHECK') return;
  S.resumeState = S.tState;
  setState('PAUSED_MANUAL');
  $('pause-veil').classList.remove('hidden');
}
function onResume() {
  $('pause-veil').classList.add('hidden');
  setState(S.resumeState === 'PAUSED_AUTO_CHECK' ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
}
function maybeReview() {
  if (S.skipped.length > 0) showReview();
  else showResults();
}
function showReview() {
  S.phase = 'review';
  if (S.tState === 'PAUSED_AUTO_CHECK') setState('RUNNING');
  $('view-exam').classList.add('hidden');
  $('view-results').classList.add('hidden');
  $('view-review').classList.remove('hidden');
  var list = '<div class="rev-item"><span class="r-mark">\u26A0 Skipped</span><span class="r-text">All exercises have been shown. Submit when ready.</span></div>';
  if (S.skipped.length) {
    list = S.skipped.map(function (p) {
      return '<div class="rev-item"><span class="r-mark">\u26A0 Skipped</span><span class="r-text">' + md(EXS[p].summary).replace(/^<p>|<\/p>$/g, '') + '</span>' +
        '<button type="button" class="btn btn-amber" data-pos="' + p + '">\u270E Answer now</button></div>';
    }).join('');
  }
  $('view-review').innerHTML = '<div class="card"><h2>Review skipped exercises</h2>' +
    '<p class="note" style="color:var(--text-secondary)">Exercises you skip and never answer are excluded from your score \u2014 they count neither for you nor against you. You can return to them as many times as you need until the timer ends.</p>' +
    list +
    '<div style="display:flex;gap:12px;justify-content:flex-end;margin-top:16px">' +
    '<button type="button" class="btn btn-green" id="btn-final">\u2713 Submit exam now</button></div></div>';
  $('view-review').querySelectorAll('[data-pos]').forEach(function (b) {
    b.addEventListener('click', function () {
      S.phase = 'exam'; S.idx = parseInt(b.getAttribute('data-pos'), 10); S.returnTo = 'review';
      $('view-review').classList.add('hidden');
      $('view-exam').classList.remove('hidden');
      renderExercise();
    });
  });
  $('btn-final').addEventListener('click', showResults);
  renderHeader();
}
function showResults() {
  S.phase = 'results';
  setState('ENDED');
  $('view-exam').classList.add('hidden');
  $('view-review').classList.add('hidden');
  $('view-results').classList.remove('hidden');
  var answered = Object.keys(S.answered).length;
  var full = 0, part = 0, partSum = 0, wrong = 0;
  Object.keys(S.answered).forEach(function (k) {
    var c = S.answered[k];
    if (c >= 0.9999) full++;
    else if (c > 0.0001) { part++; partSum += c; }
    else wrong++;
  });
  var skippedN = S.skipped.length;
  var pct = answered > 0 ? Math.round((S.creditsSum / answered) * 100) : 0;
  var pass = pct >= META.passMark;
  var avg = part > 0 ? (Math.round(partSum / part * 100) / 100).toFixed(2) : '\u2014';
  $('view-results').innerHTML =
    '<div class="card"><div class="res-hero">' +
    '<div class="res-pct">' + pct + '%</div>' +
    '<div class="res-verdict ' + (pass ? 'pass' : 'fail') + '">' + (pass ? '\u2713 PASS' : '\u2717 FAIL') + '</div>' +
    '<div style="color:var(--text-secondary)">Final score ' + fmt1(S.creditsSum) + ' / ' + answered + ' answered \u00B7 pass mark ' + META.passMark + '%</div>' +
    '</div><div class="res-grid">' +
    '<div class="res-cell ok"><div class="c-k">\u2713 Fully correct</div><div class="c-v">' + full + '</div></div>' +
    '<div class="res-cell part"><div class="c-k">\u2713 Partially correct (avg ' + avg + ')</div><div class="c-v">' + part + '</div></div>' +
    '<div class="res-cell bad"><div class="c-k">\u2717 Fully incorrect</div><div class="c-v">' + wrong + '</div></div>' +
    '<div class="res-cell skip"><div class="c-k">\u26A0 Skipped \u2014 excluded</div><div class="c-v">' + skippedN + '</div></div>' +
    '</div>' +
    (pass ? '<div class="certificate"><h3>\u2713 Certification-style result</h3><p>You reached ' + pct + '%, above the ' + META.passMark + '% pass mark. You have demonstrated a working command of ' + esc(META.objId + ' \u2014 ' + META.objName) + ' at ' + META.sevName + ' level.</p></div>'
      : '<div class="certificate fail"><h3 style="color:var(--state-incorrect)">\u2717 Not passed this time</h3><p>You reached ' + pct + '%, below the ' + META.passMark + '% pass mark. Review the feedback above, study the listed concepts, and retake the exam \u2014 questions and options will be reshuffled.</p></div>') +
    '<div class="pause-log">Time spent paused manually: ' + mmss(S.pauseManualMs / 1000) +
    ' \u00B7 time spent reviewing feedback (auto-pause): ' + mmss(S.pauseAutoMs / 1000) + '</div>' +
    '<div style="display:flex;justify-content:flex-end;margin-top:16px">' +
    '<button type="button" class="btn btn-primary" id="btn-retake">\u21BA Retake exam</button></div></div>';
  $('btn-retake').addEventListener('click', startExam);
  renderHeader();
  if (!S.reported) { S.reported = true; reportScore(S.creditsSum, answered); }
}
function finishAttempt() {
  if (S.phase === 'intro' || S.phase === 'results') return;
  showResults();
}

/* ---------------- site integration ---------------- */
function reportScore(creditSum, answeredCount) {
  var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent >= META.passMark
    }, location.origin);
  } catch (e) { /* opened directly, nothing to report to */ }
}
window.addEventListener('message', function (event) {
  if (!event.data) return;
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  S.hs = {
    username: event.data.username || '',
    country: event.data.country || '',
    locale: event.data.locale || 'en',
    topicId: event.data.topicId || '',
    batch: event.data.batch
  };
});

/* ---------------- boot ---------------- */
document.documentElement.style.setProperty('--sev-current', META.sevColor);
renderIntro();
document.addEventListener('DOMContentLoaded', function () {
  var b = $('btn-pause'); if (b) b.addEventListener('click', onPause);
  var r = $('btn-resume'); if (r) r.addEventListener('click', onResume);
  var h = $('btn-hint'); if (h) h.addEventListener('click', onHint);
  var s = $('btn-skip'); if (s) s.addEventListener('click', onSkip);
  var c = $('btn-check'); if (c) c.addEventListener('click', onCheck);
});
})();



</script>
