<style>
:root{
  --bg-page:#0b1020;
  --bg-surface:#121a2e;
  --bg-surface-2:#0f1729;
  --border:#243049;
  --border-strong:#33415f;
  --border-faint:#3a4a6e;
  --text-primary:#e6ecff;
  --text-secondary:#a9b4d0;
  --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff;
  --accent-amber:#ffb454;
  --accent-green:#57d38c;
  --accent-green-hover:#6fdda0;
  --accent-amber-hover:#ffc477;
  --state-correct:#57d38c;
  --state-partial:#ffb454;
  --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0;
  --state-paused:#9d7bff;
  --sev-easy:#57d38c;
  --sev-medium:#ffb454;
  --sev-hard:#ff8a3d;
  --sev-extreme:#ff6b6b;
  /* derived tints — every derived colour is defined here, once */
  --bg-inset:#0c1222;
  --bg-option:#0e1628;
  --bg-option-hover:#141d33;
  --bg-option-selected:#102419;
  --bg-btn-hover:#182238;
  --bg-seg:#1a2440;
  --bg-terminal:#080d1a;
  --bg-term-row:#0a1020;
  --bg-header-veil:rgba(11,16,32,.96);
  --overlay:rgba(11,16,32,.97);
  --accent-blue-tint:rgba(90,169,255,.08);
  --accent-blue-tint-soft:rgba(90,169,255,.05);
  --accent-amber-tint:rgba(255,180,84,.08);
  --accent-green-tint:rgba(87,211,140,.08);
  --correct-tint:rgba(87,211,140,.07);
  --incorrect-tint:rgba(255,107,107,.06);
  --correct-glow:rgba(87,211,140,.18);
  --veil-strong:rgba(255,255,255,.14);
  --veil-faint:rgba(255,255,255,.02);
  --shadow-card:0 6px 18px rgba(0,0,0,.35);
  --hl-time:#9fb6e8;
  --on-easy:#08120b;
  --on-medium:#1d1204;
  --on-hard:#190b03;
  --on-extreme:#1d0505;
  --on-green:#08120b;
  --on-amber:#1d1204;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{color-scheme:dark;background:var(--bg-page);}
body{
  background:var(--bg-page);
  color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.55;
  min-height:100vh;
}
.mono,.mono-inline,code,kbd,pre,.log-line,.term-input,.term-line{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;
}
.mono-inline{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:4px;padding:0 5px;color:var(--text-mono);font-size:.92em;}
button{font:inherit;color:inherit;cursor:pointer;}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:6px;}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px;}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-card);}
.muted{color:var(--text-secondary);}
.small{font-size:13.5px;}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;letter-spacing:.4px;border:1px solid transparent;min-height:28px;}
.sev-easy{color:var(--on-easy);background:var(--sev-easy);border-color:var(--sev-easy);}
.sev-medium{color:var(--on-medium);background:var(--sev-medium);border-color:var(--sev-medium);}
.sev-hard{color:var(--on-hard);background:var(--sev-hard);border-color:var(--sev-hard);}
.sev-extreme{color:var(--on-extreme);background:var(--sev-extreme);border-color:var(--sev-extreme);}
.state-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;border:1px solid var(--border);background:var(--bg-surface-2);}
.st-correct{color:var(--state-correct);border-color:var(--state-correct);}
.st-partial{color:var(--state-partial);border-color:var(--state-partial);}
.st-incorrect{color:var(--state-incorrect);border-color:var(--state-incorrect);}
.st-skipped{color:var(--state-skipped);}
.st-paused{color:var(--state-paused);border-color:var(--state-paused);}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-primary);padding:10px 18px;min-height:44px;font-weight:600;transition:background .15s ease,border-color .15s ease,transform .05s ease;}
.btn:hover{background:var(--bg-btn-hover);border-color:var(--border-strong);}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.btn-primary{background:var(--accent-green);border-color:var(--accent-green);color:var(--on-green);}
.btn-primary:hover{background:var(--accent-green-hover);border-color:var(--accent-green-hover);}
.btn-amber{background:var(--accent-amber);border-color:var(--accent-amber);color:var(--on-amber);}
.btn-amber:hover{background:var(--accent-amber-hover);border-color:var(--accent-amber-hover);}
.btn-ghost{background:transparent;}
.btn-danger{border-color:var(--state-incorrect);color:var(--state-incorrect);background:transparent;}

/* ---------- intro ---------- */
.intro-hero{padding:22px 22px 18px;}
.intro-hero h1{margin:0 0 6px;font-size:24px;line-height:1.25;}
.intro-facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.fact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13.5px;color:var(--text-secondary);}
.fact b{color:var(--text-primary);}
.section-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin:26px 0 10px;color:var(--text-primary);}
.section-title .dot{width:10px;height:10px;border-radius:3px;background:var(--accent-blue);display:inline-block;}
.section-body{padding:18px 20px;}
.section-body p{margin:0 0 12px;}
.theme-panel{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;margin-bottom:12px;}
.theme-panel h4{margin:0 0 8px;font-size:14px;color:var(--accent-blue);text-transform:uppercase;letter-spacing:.6px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:var(--bg-inset);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--text-primary);}
.rules{margin:0;padding-left:20px;}
.rules li{margin-bottom:9px;}
.type-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px;}
.start-row{display:flex;justify-content:center;padding:6px 0 20px;}
.start-btn{font-size:18px;padding:14px 44px;border-radius:10px;}

/* ---------- sticky header ---------- */
.exam-header{position:sticky;top:0;z-index:50;background:var(--bg-header-veil);border-bottom:1px solid var(--border);backdrop-filter:blur(6px);}
.exam-header-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
.hd-count{font-weight:800;font-size:15px;white-space:nowrap;}
.hd-timer{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:6px 12px;font-weight:700;}
.hd-timer .t{font-variant-numeric:tabular-nums;letter-spacing:1px;}
.hd-score{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:6px 12px;font-weight:700;}
.hd-score .s{color:var(--accent-green);font-variant-numeric:tabular-nums;}
.spacer{flex:1 1 auto;}
.hd-btns{display:flex;gap:8px;flex-wrap:wrap;}
.btn-slim{padding:6px 12px;min-height:44px;font-size:13.5px;}

/* ---------- progress ---------- */
.progress{max-width:980px;margin:0 auto;padding:0 16px 8px;}
.progress-bar{display:flex;gap:3px;height:8px;border-radius:6px;overflow:hidden;background:var(--bg-surface-2);position:relative;}
.seg{flex:1 1 0;background:var(--bg-seg);border-radius:2px;min-width:6px;transition:background .3s ease;}
.seg.ok{background:var(--state-correct);}
.seg.partial{background:var(--state-partial);}
.seg.bad{background:var(--state-incorrect);}
.seg.skipped{background:var(--state-skipped);opacity:.55;}
.seg.cur{background:var(--sev-color,var(--accent-blue));box-shadow:0 0 8px var(--sev-color,var(--accent-blue));}
.progress-bar::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,var(--veil-strong) 50%,transparent 80%);transform:translateX(-100%);animation:sheen 3.2s ease-in-out infinite;pointer-events:none;}
@keyframes sheen{0%{transform:translateX(-100%);}55%{transform:translateX(100%);}100%{transform:translateX(100%);}}

/* ---------- exercise blocks ---------- */
.ex-meta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 4px;}
.block{margin-top:16px;border:1px solid var(--border);border-radius:10px;background:var(--bg-surface);overflow:hidden;}
.block-h{display:flex;align-items:center;gap:10px;padding:9px 14px;font-weight:800;font-size:13.5px;letter-spacing:1.2px;border-bottom:1px solid var(--border);}
.block-h .ic{font-size:15px;}
.bl-scenario .block-h{color:var(--accent-blue);background:var(--accent-blue-tint);}
.bl-question .block-h{color:var(--accent-amber);background:var(--accent-amber-tint);}
.bl-answer .block-h{color:var(--accent-green);background:var(--accent-green-tint);}
.bl-feedback .block-h{background:var(--veil-faint);}
.block-b{padding:14px 16px;}
.block-b p{margin:0 0 10px;}
.collapse-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text-secondary);border-radius:6px;padding:3px 10px;font-size:12px;min-height:36px;}
.summary-line{padding:9px 14px;font-size:13px;color:var(--text-secondary);border-bottom:1px dashed var(--border);}
.artefact{border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);margin:10px 0;overflow:hidden;}
.artefact-h{padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--accent-blue);border-bottom:1px solid var(--border);background:var(--accent-blue-tint-soft);}
.artefact .prose{padding:10px 14px;font-size:14.5px;}
.codeblock{margin:0;padding:10px 12px;overflow-x:auto;white-space:pre;}
.log-line{font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--text-mono);}
.hl-t{color:var(--hl-time);}
.hl-ioc{color:var(--accent-amber);}
.hl-bad{color:var(--state-incorrect);font-weight:700;}
.hl-warn{color:var(--state-partial);}
.hl-cmd{color:var(--accent-green);font-weight:700;}
.hl-flag{color:var(--state-paused);}
.hl-str{color:var(--text-mono);}
.hl-path{color:var(--accent-blue);}
.log-toolbar{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg-surface-2);}
.log-filter{flex:1;background:var(--bg-inset);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);padding:7px 10px;font-size:13.5px;min-height:44px;}
.log-count{font-size:12px;color:var(--text-secondary);white-space:nowrap;}
.log-body{max-height:340px;overflow-y:auto;padding:8px 12px;}
.log-body::-webkit-scrollbar{width:10px;}
.log-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
.log-body::-webkit-scrollbar-track{background:var(--bg-surface-2);}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--bg-option);border:1px solid var(--border);border-radius:8px;padding:12px 14px;min-height:48px;color:var(--text-primary);transition:background .12s ease,border-color .12s ease;}
.opt:hover{background:var(--bg-option-hover);}
.opt .letter{font-weight:800;color:var(--text-secondary);flex:0 0 auto;}
.opt.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset,0 0 10px var(--correct-glow);background:var(--bg-option-selected);}
.opt.selected .sel-mark{color:var(--accent-green);}
.opt.disabled{opacity:.75;cursor:default;}
.sel-mark{margin-left:auto;font-size:12px;font-weight:800;color:var(--text-secondary);white-space:nowrap;}

/* ---------- drag & drop ---------- */
.dd-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:720px){.dd-grid{grid-template-columns:1fr 1fr;}}
.bank{border:1px dashed var(--border-strong);border-radius:8px;padding:10px;min-height:56px;display:flex;flex-wrap:wrap;gap:8px;background:var(--bg-inset);}
.dchip{background:var(--bg-option-hover);border:1px solid var(--border-strong);border-radius:8px;padding:8px 12px;font-size:13.5px;min-height:44px;color:var(--text-primary);}
.dchip.grab{cursor:grab;}
.dchip.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.zone{border:1px solid var(--border);border-radius:8px;background:var(--bg-option);padding:10px;min-height:96px;}
.zone.over{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.zone h5{margin:0 0 8px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-secondary);}
.zone-items{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;}
.bank-label{font-size:12.5px;font-weight:700;letter-spacing:.6px;color:var(--text-secondary);margin:0 0 6px;text-transform:uppercase;}

/* ---------- order ---------- */
.ord-list{display:flex;flex-direction:column;gap:8px;}
.ord-row{display:flex;align-items:center;gap:10px;background:var(--bg-option);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
.ord-pos{flex:0 0 30px;text-align:center;font-weight:800;color:var(--text-secondary);}
.ord-text{flex:1;font-size:14.5px;}
.ord-btns{display:flex;gap:4px;}
.ord-btns button{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;width:44px;height:44px;font-size:14px;}
.ord-row.dragging{opacity:.4;}
.ord-row .handle{cursor:grab;color:var(--text-secondary);font-size:15px;}

/* ---------- match ---------- */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:620px){.match-grid{grid-template-columns:1fr;}}
.match-col{display:flex;flex-direction:column;gap:8px;}
.mitem{background:var(--bg-option);border:1px solid var(--border);border-radius:8px;padding:10px 12px;text-align:left;min-height:46px;color:var(--text-primary);}
.mitem.selected{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green) inset;}
.mitem.used{opacity:.4;pointer-events:none;}
.pairs-list{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
.pair-row{display:flex;align-items:center;gap:8px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13.5px;}
.pair-row .x{margin-left:auto;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--state-incorrect);width:44px;height:44px;min-width:44px;}

/* ---------- fill blank ---------- */
.fb-sentence{font-size:16px;line-height:2;word-break:break-word;}
.blank-btn{display:inline-block;min-width:90px;min-height:44px;background:var(--bg-inset);border:1px dashed var(--border-faint);border-radius:6px;color:var(--text-mono);padding:2px 10px;text-align:center;}
.blank-btn.filled{border-style:solid;border-color:var(--accent-green);color:var(--accent-green);}
.blank-btn.selected{border-color:var(--accent-amber);box-shadow:0 0 0 1px var(--accent-amber) inset;}

/* ---------- terminal ---------- */
.term{background:var(--bg-terminal);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.term-bar{display:flex;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--border);background:var(--bg-surface-2);font-size:12px;color:var(--text-secondary);}
.term-dot{width:10px;height:10px;border-radius:50%;background:var(--border);display:inline-block;}
.term-scroll{max-height:260px;overflow-y:auto;padding:10px 12px;font-size:13.5px;}
.term-line{white-space:pre-wrap;word-break:break-word;color:var(--text-mono);line-height:1.6;}
.term-prompt{color:var(--accent-green);font-weight:700;}
.term-err{color:var(--state-incorrect);}
.term-ok{color:var(--state-correct);}
.term-input-row{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);padding:9px 12px;background:var(--bg-term-row);}
.term-input{flex:1;background:transparent;border:none;color:var(--text-mono);font-size:14px;min-height:44px;}
.term-input:focus{outline:none;}
.syntax-panel{border:1px solid var(--border);border-left:3px solid var(--accent-blue);border-radius:8px;background:var(--bg-surface-2);padding:10px 14px;margin-top:10px;font-size:13.5px;}
.syntax-panel h6{margin:0 0 6px;color:var(--accent-blue);font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;}

/* ---------- branching ---------- */
.step-badge{display:inline-flex;align-items:center;gap:8px;background:var(--bg-surface-2);border:1px solid var(--border);color:var(--accent-amber);border-radius:999px;padding:3px 12px;font-weight:800;font-size:12.5px;letter-spacing:.8px;margin-bottom:10px;}
.step-verdict{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);font-size:14px;}
.step-actions{display:flex;gap:10px;margin-top:12px;}

/* ---------- feedback ---------- */
.fb-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;}
.fb-title{font-size:16px;font-weight:800;}
.fb-credit{font-size:14px;font-weight:700;color:var(--state-partial);}
.item-rows{margin:12px 0;display:flex;flex-direction:column;gap:6px;}
.item-row{display:flex;align-items:flex-start;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;}
.item-row .mk{flex:0 0 auto;font-weight:800;}
.mk-c{color:var(--state-correct);}
.mk-w{color:var(--state-incorrect);}
.mk-m{color:var(--state-skipped);}
.persp{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px;}
@media(min-width:720px){.persp{grid-template-columns:1fr 1fr;}}
.persp .p-card{border:1px solid var(--border);border-radius:8px;padding:10px 14px;background:var(--bg-surface-2);font-size:14px;}
.persp .p-card h6{margin:0 0 6px;font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;}
.p-card.red h6{color:var(--state-incorrect);}
.p-card.blue h6{color:var(--accent-blue);}
.study-tip{margin-top:12px;border:1px solid var(--border);border-left:3px solid var(--accent-amber);border-radius:8px;background:var(--bg-surface-2);padding:9px 12px;font-size:14px;color:var(--text-primary);}
.canon{margin-top:12px;}
.canon h6{margin:0 0 6px;font-size:12.5px;letter-spacing:.8px;color:var(--accent-green);text-transform:uppercase;}
.canon pre{background:var(--bg-terminal);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text-mono);font-size:14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;}
.canon ul{margin:6px 0 0;padding-left:20px;color:var(--text-secondary);font-size:13.5px;}
.canon li{margin-bottom:4px;}

/* ---------- review / results ---------- */
.review-list{display:flex;flex-direction:column;gap:10px;}
.review-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 14px;}
.review-row .q{flex:1;min-width:200px;font-size:14.5px;}
.result-hero{padding:26px 22px;text-align:center;}
.result-pct{font-size:52px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
.pass-panel{border:2px solid var(--state-correct);background:var(--correct-tint);}
.fail-panel{border:2px solid var(--state-incorrect);background:var(--incorrect-tint);}
.res-break{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px;}
@media(min-width:640px){.res-break{grid-template-columns:1fr 1fr;}}
.res-cell{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface-2);padding:12px 14px;font-size:14.5px;}
.res-cell b{font-size:22px;font-variant-numeric:tabular-nums;}
.paused-overlay{position:fixed;inset:0;z-index:100;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:20px;}

"use strict";
var EXAM = {"meta":{"topicId":"t1563.001","batch":1,"title":"T1563.001 Remote Service Session Hijacking: SSH Hijacking — EASY","difficulty":"easy","questionCount":15,"estimatedMinutes":22,"passMark":70,"mitreId":"T1563.001","mitreName":"Remote Service Session Hijacking: SSH Hijacking","objectType":"Sub-Technique","severityLabel":"EASY","partLabel":null},"intro":{"learn":["**SSH hijacking** (T1563.001) means an attacker who already controls a host reuses a **live SSH session or a live ssh-agent** to move to another host. They log in without a password and without the private key.","The **ssh-agent** is a small helper that keeps SSH keys **in memory** and answers signing requests. It never writes the key to disk. Client programs find it through the **SSH_AUTH_SOCK** environment variable, which points to a socket file like `/tmp/ssh-9f2/agent.4183`.","With **agent forwarding**, your agent also becomes reachable on a jump host you connect through — that host is the risk point. **ControlMaster** works in a similar spirit: new SSH sessions can attach to one connection that is already authenticated, and **ControlPath** says where its socket lives.","ATT&CK lists this behaviour on **Linux and macOS**. A process may talk to an agent socket only if it runs as the **same user** as the owner, or as **root**. Simple detection is a **uid-mismatch** check on the socket; the simplest mitigation is to switch **agent forwarding off** where it is not needed."],"keywords":[{"theme":"Agent basics","items":["ssh-agent holds keys in memory","answers signing requests","ssh-add -l lists keys"]},{"theme":"Socket & environment","items":["SSH_AUTH_SOCK","/tmp/ssh-*/agent.<pid>","same uid or root may use it"]},{"theme":"Hijack vs key theft","items":["reuse the live session","no passphrase needed","no key file on disk"]},{"theme":"Forwarding & multiplexing","items":["agent forwarding on jump hosts","ControlMaster shared connection","ControlPath socket"]},{"theme":"Detect & mitigate","items":["uid mismatch on the socket","disable ForwardAgent","auditd socket watch"]}],"types":["Multiple choice","Log analysis","Drag & drop","Timeline ordering","Matching","Fill in the blank","Terminal (fake shell)","Branching scenario"]},"exercises":[{"id":"e01","type":"log-qcm","scenario":{"text":["You are the SOC trainee on the morning shift at Cedar Valley College.","Ticket CVC-221 asks you to review the audit watch on the lab host cvc-lab-04.","The agent socket in the log belongs to the student account lab-s18.","Use the filter box to compare each process uid with the socket owner."]},"log":{"title":"auditd agent-socket watch — cvc-lab-04 (ticket CVC-221)","lines":["09:02:11 proc ssh-agent uid=lab-s18 socket=/tmp/ssh-9f2/agent.4183","09:14:02 audit socket=/tmp/ssh-9f2/agent.4183 pid=5171 uid=lab-s18 result=owner-match","09:20:55 sshd session opened for user lab-s18 by (uid=0)","09:31:47 audit socket=/tmp/ssh-9f2/agent.4183 pid=5310 uid=lab-s04 result=owner-mismatch","09:33:12 audit agent sign-request socket=/tmp/ssh-9f2/agent.4183 uid=lab-s04 key=ED25519","09:41:30 cron (root) CMD run-semester-lab-cleanup.sh"]},"question":"Which line shows a process using an agent socket that is not its own?","answer":{"options":["proc ssh-agent uid=lab-s18 socket=/tmp/ssh-9f2/agent.4183","audit socket=/tmp/ssh-9f2/agent.4183 pid=5171 uid=lab-s18 result=owner-match","audit socket=/tmp/ssh-9f2/agent.4183 pid=5310 uid=lab-s04 result=owner-mismatch","sshd session opened for user lab-s18 by (uid=0)"],"correct":2},"hint":"The socket owner is lab-s18. Find the line where the process uid is a different student.","explanation":["The socket file `/tmp/ssh-9f2/agent.4183` belongs to **lab-s18**, but the process in that line runs as **lab-s04** and still touched it. That uid mismatch is the classic SSH hijack signal.","The first audit line is normal use: the owner touches their own agent. The sshd login and the cron job are routine lab activity, not socket misuse."],"perspectives":{"attacker":"With the socket path, any same-uid process can ask the agent to sign a login to another host.","defender":"Alert when the uid of the accessing process differs from the socket owner's uid."},"study":"Re-read the uid rule for agent sockets in the intro."},{"id":"e02","type":"qcm-single","scenario":{"text":["A lecturer at Cedar Valley College asks you what the term **SSH hijacking** means.","Answer from the SOC point of view."]},"question":"Which sentence describes SSH hijacking (T1563.001) correctly?","answer":{"options":["Brute-forcing the SSH password of the git server","Reusing a live agent or session for new logins","Copying the private key file from the user's home folder","Opening a SOCKS proxy through the college firewall"],"correct":1},"hint":"The attacker is already on the host and borrows something the victim already opened.","explanation":["**SSH hijacking** reuses a **live** agent or session. The attacker authenticates through something the victim already opened, so no new password and no key file are needed.","Brute force is password guessing. Copying the key file is a different technique (T1552.004). A SOCKS proxy is tunnelling, not session hijacking."],"study":"Compare hijacking with key-file theft in the intro."},{"id":"e03","type":"dragdrop","scenario":{"text":["The SOC lead asks you to triage six events from the cvc-lab-04 audit watch before the lab class starts.","Some events are hijack signals and some are routine."]},"question":"Drag each event into the correct zone.","answer":{"zones":[{"name":"Agent-hijack signal"},{"name":"Normal lab activity"}],"items":[{"text":"uid=lab-s04 touches agent.4183 owned by lab-s18","zone":0},{"text":"lab-s18 runs ssh-add -l on her own agent","zone":1},{"text":"a process reads /proc/4183/environ of another user","zone":0},{"text":"root reads all agent sockets during an approved check","zone":1},{"text":"lab-s18 opens a normal SSH session to cvc-git-01","zone":1},{"text":"uid=lab-s07 signs a login using lab-s18's agent","zone":0}]},"hint":"Ask for each event: does the uid of the process match the owner of the socket?","explanation":["A signal appears when a process **crosses the user boundary**: a different student's uid or another account touching a socket it does not own, or reading another user's `/proc` environment.","Owner use, root triage, and an ordinary SSH login are normal lab activity. Root may access any socket on the host, so that event is expected."],"perspectives":{"attacker":"Reading /proc/<pid>/environ is the standard way to steal the agent socket path.","defender":"Treat every cross-uid socket touch as credential-level activity."},"study":"Review the same-uid/root rule for agent sockets."},{"id":"e04","type":"match","scenario":{"text":["New SOC volunteers at Cedar Valley College keep mixing up the SSH agent terms.","Build the cheat sheet for the team wall."]},"question":"Match each term to its job.","answer":{"pairs":[{"left":"ssh-agent","right":"daemon that keeps keys in memory"},{"left":"ssh-add","right":"client that adds or lists agent keys"},{"left":"SSH_AUTH_SOCK","right":"variable that holds the socket path"},{"left":"/tmp/ssh-9f2/agent.4183","right":"the agent socket file itself"}]},"hint":"Two items are programs, one is a variable, and one is a file.","explanation":["**ssh-agent** holds the keys in memory; **ssh-add** is the client that talks to it; **SSH_AUTH_SOCK** tells programs where the socket is; the socket itself is a file like `/tmp/ssh-9f2/agent.4183`.","Together these four pieces let a login be signed without the key ever leaving memory."],"study":"Draw the agent architecture once from memory."},{"id":"e05","type":"qcm-single","scenario":{"text":["During a lab debrief, a Cedar Valley College student asks what the ssh-agent really does when a login happens.","Answer for the class."]},"question":"What does the ssh-agent do when a client needs to authenticate?","answer":{"options":["It asks the user to retype the key passphrase","It writes the private key to a temp file","It signs the request with a key kept in memory","It sends the private key to the remote server"],"correct":2},"hint":"The agent's whole purpose is to sign without ever releasing the key.","explanation":["The agent **signs** authentication requests using keys it keeps **in memory**. The private key is never written to a file and never sent to the remote host.","If the agent asked for the passphrase every time, forwarding could not work — the remote host cannot reach your keyboard."],"study":"Read the agent-basics paragraph in the intro."},{"id":"e06","type":"fillblank","scenario":{"text":["Complete the SOC note about the agent socket found on cvc-lab-04.","The note is attached to ticket CVC-221."]},"question":"Fill every blank with a word from the bank.","answer":{"template":"On cvc-lab-04 the agent socket is `/tmp/ssh-9f2/agent.4183`, and the ___ variable tells client programs where it is. While the agent signs, the private key never touches ___.","blanks":["SSH_AUTH_SOCK","disk"],"bank":["SSH_AUTH_SOCK","SSH_AUTH_PID","disk","memory","BIOS"]},"hint":"The variable name is in the intro and uses capital letters with underscores.","explanation":["**SSH_AUTH_SOCK** holds the path of the agent socket. The agent keeps the key in memory only, so during normal signing the key never touches **disk**.","That is exactly why stealing a key file fails against a loaded agent — the file on disk may be passphrase-protected or not even exist."],"study":"Trace the path from variable to socket to agent."},{"id":"e07","type":"log-qcm","scenario":{"text":["Shift handover at Cedar Valley College: ticket CVC-229 points at the bastion host cvc-bastion-01.","The agent socket in the log belongs to t.nakamura (uid 1001).","Use the filter box on agent.3011 before you answer."]},"log":{"title":"auditd + authd — cvc-bastion-01 (ticket CVC-229)","lines":["10:05:12 sshd[3011] accepted publickey for t.nakamura from 10[.]20[.]8[.]17 port 49310","10:05:12 sshd[3011] session 44 sets SSH_AUTH_SOCK=/tmp/ssh-Kd7/agent.3011","10:22:03 sudo t.nakamura TTY=pts/0 COMMAND=/usr/bin/less /var/log/auth.log","10:26:40 auditd open /tmp/ssh-Kd7/agent.3011 by pid=3410 uid=33 (www-data)","10:26:58 auditd agent sign-request owner=t.nakamura requesting-uid=33","10:31:02 cron (root) CMD rotate-bastion-motd.sh"]},"question":"Compare the socket owner with the uid that opened it. Which line shows the hijack?","answer":{"options":["accepted publickey for t.nakamura from 10[.]20[.]8[.]17 port 49310","open /tmp/ssh-Kd7/agent.3011 by pid=3410 uid=33 (www-data)","session 44 sets SSH_AUTH_SOCK=/tmp/ssh-Kd7/agent.3011","cron (root) CMD rotate-bastion-motd.sh"],"correct":1},"hint":"uid 33 is the web server account, not the socket owner.","explanation":["The socket belongs to **t.nakamura**, but pid 3410 runs as **www-data (uid 33)** and opened it. A web-server account has no reason to touch an SSH agent — that mismatch is the hijack.","The publickey login and the SSH_AUTH_SOCK line are normal session setup. The cron job is scheduled housekeeping."],"study":"Practise filtering audit lines by uid."},{"id":"e08","type":"order","scenario":{"text":["The SOC lead wants the agent-hijack chain drawn in the right order for a class demo.","Each step below happened once on cvc-lab-04."]},"question":"Order the attacker steps from first to last.","answer":{"mode":"timeline","items":["Get a shell on cvc-lab-04 as another student's uid","Read SSH_AUTH_SOCK from the victim's session","Open the agent socket /tmp/ssh-9f2/agent.4183","Ask the agent to sign a login to cvc-git-01"]},"hint":"Nothing works before the attacker has code execution, and nothing is signed before the socket is open.","explanation":["First the attacker needs **code execution** on the host. Then they read the socket path from the environment, open the socket, and only then can the agent **sign** the lateral login.","The agent never sends the key — it only answers the signing request. That is why the last step needs no passphrase."],"study":"Rebuild this chain from memory for the exam report."},{"id":"e09","type":"qcm-single","scenario":{"text":["A SOC briefing at Cedar Valley College compares two attacker behaviours.","One steals the key file, one hijacks the live agent."]},"question":"Why does the hijacker prefer the live agent over stealing the key file?","answer":{"options":["It signs without a passphrase; the key stays in memory","The agent copies the key to the attacker's folder","The agent reboots the host to clear audit logs","The agent forwards the user's browser cookies"],"correct":0},"hint":"Think about what the agent can do that a stolen file cannot: sign, without asking anyone.","explanation":["The live agent **signs immediately** — no passphrase — and the private key never leaves memory as a file. A stolen key file may be passphrase-protected and useless offline.","The agent never copies the key out, so 'copies the key' is wrong. Rebooting and browser cookies are unrelated to SSH agents."],"study":"Contrast T1563.001 with T1552.004 in the intro."},{"id":"e10","type":"dragdrop","scenario":{"text":["The college IT policy group reviews which settings change the agent-hijack risk on shared hosts.","Sort the settings for the policy note."]},"question":"Drag each setting into the correct zone.","answer":{"zones":[{"name":"Raises agent-hijack risk"},{"name":"Lowers agent-hijack risk"}],"items":[{"text":"ForwardAgent yes on the shared jump host","zone":0},{"text":"agent forwarding off unless a lab needs it","zone":1},{"text":"many students sharing one login account","zone":0},{"text":"every student works under their own uid","zone":1},{"text":"SSH sessions left idle open all evening","zone":0},{"text":"idle timeout closes unused SSH sessions","zone":1}]},"hint":"More shared exposure and more forwarded agents mean more risk.","explanation":["Risk rises when **agent forwarding** is on, accounts are shared, and sessions stay open — each is one more live agent an intruder can borrow.","Risk falls when forwarding is off by default, every student has their own uid, and idle sessions time out."],"perspectives":{"attacker":"A shared account with a forwarded agent is the cheapest lateral-movement prize on campus.","defender":"Default-deny ForwardAgent and enforce idle timeouts on shared hosts."},"study":"Review the mitigation list for T1563.001."},{"id":"e11","type":"match","scenario":{"text":["A computing instructor wants one slide that maps SSH features to hijack facts.","Build the pairs for the slide."]},"question":"Match each SSH feature to the fact a defender must know.","answer":{"pairs":[{"left":"ControlMaster","right":"new sessions reuse one live SSH connection"},{"left":"ControlPath","right":"records where the shared-connection socket lives"},{"left":"agent forwarding","right":"exposes your agent on the jump host"},{"left":"T1563.001 platforms","right":"Linux and macOS"}]},"hint":"One feature shares connections, one names the socket, one exports the agent, and one is a platform list.","explanation":["**ControlMaster** lets new SSH sessions attach to an already-authenticated connection, and **ControlPath** says where its socket is. **Agent forwarding** exposes your agent on a jump host you hop through.","ATT&CK lists T1563.001 on **Linux and macOS** platforms."],"study":"Skim the ControlMaster section of the ssh_config manual."},{"id":"e12","type":"terminal","scenario":{"text":["You are on cvc-lab-04 (Linux) during the SOC morning shift.","Your lead asks you to list the SSH keys that your own agent currently holds.","Type the command, then press Check."]},"question":"Type the command that lists the keys held by your agent.","answer":{"shellTitle":"analyst@cvc-lab-04 — simulated bash","prompt":"analyst@cvc-lab-04:~$","shellIntro":["Simulated shell. Type your command and press Enter.","Nothing is executed; this is a training simulation."],"syntaxPanel":{"shape":"ssh-add -l   (list the keys your agent holds)","notes":["ssh-add is the client that talks to the ssh-agent","-l lists fingerprints of all loaded keys","-D would REMOVE keys — not what you want here"],"example":"ssh-add -D   (deletes keys — use on a different host only)"},"elements":[{"desc":"uses ssh-add as the tool","pattern":"\\bssh-add\\b"},{"desc":"requests the key listing flag -l","pattern":"\\s-l\\b"}],"wrongPatterns":[{"desc":"ssh -D opens a SOCKS proxy — it does not list keys","pattern":"(^|\\s)ssh\\s+-D"}],"canonical":"ssh-add -l","canonicalParts":["ssh-add — client for the authentication agent","-l — list fingerprints of all agent keys"],"expectedOutput":["256 SHA256:9tQw2vXrLk4Mn6Yb8Cd0Ef2Gh4Ij6Kl8Op1Rs3Tu5Vw lab-s18@cvc-lab-04 (ED25519)"]},"hint":"The tool is ssh-add and the listing flag is a lowercase L.","explanation":["**ssh-add -l** asks your agent to list the fingerprints of the keys it holds in memory. The agent answers locally; no key material is shown or transmitted.","**ssh -D** is the near-miss: it opens a SOCKS proxy through SSH, which has nothing to do with listing keys."],"study":"Try ssh-add -l and ssh-add -L on the lab image."},{"id":"e13","type":"branching","scenario":{"text":["SOC shift at Cedar Valley College: an alert fired on cvc-bastion-01.","A process under the support account touched the forwarded agent socket of instructor r.eshun and asked it to sign.","Work the case one decision at a time."]},"question":"Work the incident one decision at a time.","steps":[{"continuation":"The alert shows pid 3410 (uid support) reading agent.3011 owned by r.eshun.","question":"What is happening on cvc-bastion-01?","options":["An agent-hijack attempt via the forwarded agent","A scheduled backup touching its own files","An sshd configuration reload in progress","A new firewall rule being tested"],"correct":0},{"continuation":"You confirmed the agent answered a signing request for the wrong account.","question":"Which change do you recommend to the platform team first?","options":["Move the bastion to a new IP range","Increase the SSH banner timeout","Switch agent forwarding off unless a workflow needs it","Disable logging for faster sessions"],"correct":2}],"hint":"Step 1: who owns the socket and who touched it. Step 2: which setting exported the agent to the bastion.","explanation":["A different account touching r.eshun's agent socket is an **agent-hijack attempt** — the alert pairs the uid mismatch with a signing request.","The agent only reached the bastion because **forwarding** exported it. Turning **ForwardAgent off** where it is not needed removes the prize."],"perspectives":{"attacker":"A forwarded agent on a shared bastion is a standing invitation — one socket read unlocks the user's whole key set.","defender":"Default-deny ForwardAgent; alert on cross-uid socket access with sign requests."},"study":"Read the agent-forwarding paragraph in the intro."},{"id":"e14","type":"fillblank","scenario":{"text":["Finish the campus hardening note about who may use an agent socket.","The note will be pinned in the SOC channel."]},"question":"Fill every blank with a word from the bank.","answer":{"template":"The audit rule calls a socket touch normal only when the process runs as the ___ user as the socket owner, or as ___. Every other uid touching the socket is a signal.","blanks":["same","root"],"bank":["same","different","root","guest","remote"]},"hint":"Two cases are allowed: matching the owner, or the most powerful account on the host.","explanation":["The agent socket answers only callers that run as the **same** user as the owner — or as **root**, which may access everything on the host.","Any other uid is a boundary crossing, so the audit rule treats it as a hijack signal."],"study":"Re-read the uid/root rule in the intro."},{"id":"e15","type":"branching","scenario":{"text":["Evening shift at Cedar Valley College: the audit watch on cvc-lab-04 fired twice in one minute.","You are the only analyst on duty.","Work the triage one decision at a time."]},"question":"Work the triage one decision at a time.","steps":[{"continuation":"The watch shows pid 5310 (uid lab-s04) opening agent.4183 owned by lab-s18.","question":"Which check confirms that the socket was really misused?","options":["Compare the process uid with the socket owner uid","Check the free disk space on cvc-lab-04","Restart sshd and watch for the alert again","Count the students logged in to the lab"],"correct":0},{"continuation":"The uid mismatch is confirmed, and the agent answered a signing request.","question":"What is the next simple step?","options":["Delete the audit lines for this socket","Wait for the alert to repeat tomorrow","Email the whole campus mailing list","Isolate cvc-lab-04 and switch agent forwarding off"],"correct":3}],"hint":"Step 1: the rule itself compares two uids. Step 2: contain the host, then remove the exported agent.","explanation":["The detection rule is a **uid comparison**: owner versus caller. A mismatch plus a sign-request confirms misuse.","With confirmation in hand, **contain** the host and remove the misuse path — switching **agent forwarding off** and isolating the machine stops the borrowed key set from signing again."],"perspectives":{"attacker":"A hijacked agent keeps working until the session or the host dies — speed matters.","defender":"Confirm with the uid rule, then contain; do not wait for a second alert."},"study":"Walk through the detection and mitigation list once more."}]};

/* ---------- attempt builder ---------- */
function buildAttempt(reshuffleQuestions){
  var list=EXAM.exercises.map(function(e){return clone(e);});
  if(reshuffleQuestions)list=shuffle(list);
  for(var i=0;i<list.length;i++){prepareExercise(list[i]);}
  return list;
}
function prepareExercise(ex){
  if(ex.type==='qcm-single'||ex.type==='qcm-multi'||ex.type==='log-qcm'){
    var a=ex.answer;
    if(ex.type==='log-qcm'&&typeof a.correct==='number')a.correct=[a.correct];
    var multi=(ex.type==='qcm-multi')||(ex.type==='log-qcm'&&Array.isArray(a.correct)&&a.correct.length>1);
    var order=shuffle(a.options.map(function(_,i){return i;}));
    a._disp=a.options.map(function(o,i){return {text:a.options[order[i]],orig:order[i]};});
    if(!multi){var c0=Array.isArray(a.correct)?a.correct[0]:a.correct;a._corr=order.indexOf(c0);a._multi=false;}
    else{a._corr=a.correct.map(function(c){return order.indexOf(c);});a._multi=true;}
  }
  if(ex.type==='dragdrop'){ex.answer._bank=shuffle(ex.answer.items.map(function(_,i){return i;}));ex.answer._placed={};}
  if(ex.type==='order'){ex.answer._disp=shuffle(ex.answer.items.map(function(_,i){return i;}));}
  if(ex.type==='match'){ex.answer._right=shuffle(ex.answer.pairs.map(function(_,i){return i;}));ex.answer._pairs=[];ex.answer._selLeft=null;}
  if(ex.type==='fillblank'){
    var fa=ex.answer;
    var distr=(fa.bank||[]).filter(function(w){return fa.blanks.indexOf(w)<0;});
    var words=fa.blanks.map(function(w,i){return {t:w,slot:i};}).concat(distr.map(function(w){return {t:w,slot:-1};}));
    fa._words=shuffle(words);
    fa._bank=fa._words.map(function(_,i){return i;});
    fa._filled=fa.blanks.map(function(){return null;});
    fa._selChip=null;
  }
  if(ex.type==='branching'){
    ex._step=0;
    ex.steps.forEach(function(st){
      var order=shuffle(st.options.map(function(_,i){return i;}));
      st._disp=st.options.map(function(o,i){return {text:st.options[order[i]],orig:order[i]};});
      st._corr=order.indexOf(st.correct);
      st._choice=null;
      st._done=false;
    });
  }
  if(ex.type==='terminal'){ex._cmd='';}
}

/* ---------- scoring ---------- */
function scoreExercise(H,W,N){N=Math.max(1,N);return Math.max(0,(H-W)/N);}
function gradeExercise(ex){
  var a=ex.answer,r;
  function rows(){return [];}
  if(ex.type==='qcm-single'){
    var pick=a._choice,H=(pick===a._corr)?1:0,W=0,N=1;
    var items=[{status:H?'correct':'wrong',text:(pick!==null&&pick!==undefined)?'Your answer: '+a._disp[pick].text:'No answer selected.'}];
    if(!H)items.push({status:'missed',text:'Correct answer: '+a._disp[a._corr].text});
    r={H:H,W:W,N:N,items:items,single:true};
  }else if(ex.type==='qcm-multi'||ex.type==='log-qcm'){
    if(!a._multi){
      var pk=a._choice,H1s=(pk===a._corr)?1:0,W1s=0,N1s=1;
      var items1s=[{status:H1s?'correct':'wrong',text:(pk!==null&&pk!==undefined)?'Your answer: '+a._disp[pk].text:'No answer selected.'}];
      if(!H1s)items1s.push({status:'missed',text:'Correct answer: '+a._disp[a._corr].text});
      r={H:H1s,W:W1s,N:N1s,items:items1s,single:true};
    }else{
      var sel=a._sel||[];
      var corr=a._corr;
      var H2=0,W2=0,items2=[];
      corr.forEach(function(ci){
        var chosen=sel.indexOf(ci)>=0;
        if(chosen){H2++;items2.push({status:'correct',text:a._disp[ci].text});}
        else{items2.push({status:'missed',text:a._disp[ci].text});}
      });
      sel.forEach(function(si){
        if(corr.indexOf(si)<0){W2++;items2.push({status:'wrong',text:a._disp[si].text});}
      });
      r={H:H2,W:W2,N:corr.length,items:items2,multi:true};
    }
  }else if(ex.type==='dragdrop'){
    var H3=0,W3=0,items3=[];
    a.items.forEach(function(it,i){
      var z=a._placed[i];
      if(z===undefined||z===null){items3.push({status:'missed',text:it.text+' → correct zone: '+a.zones[it.zone].name});}
      else if(z===it.zone){H3++;items3.push({status:'correct',text:it.text+' → '+a.zones[it.zone].name});}
      else{W3++;items3.push({status:'wrong',text:it.text+' → placed in "'+a.zones[z].name+'", correct zone: "'+a.zones[it.zone].name+'"'});}
    });
    r={H:H3,W:W3,N:a.items.length,items:items3};
  }else if(ex.type==='order'){
    var H4=0,W4=0,items4=[];
    for(var k=0;k<a._disp.length;k++){
      var ok=(a._disp[k]===k);
      if(ok)H4++;else W4++;
      items4.push({status:ok?'correct':'wrong',text:'Position '+(k+1)+': expected "'+a.items[k]+'", you placed "'+a.items[a._disp[k]]+'"'});
    }
    r={H:H4,W:W4,N:a.items.length,items:items4};
  }else if(ex.type==='match'){
    var H5=0,W5=0,items5=[];
    var usedRight={};
    a._pairs.forEach(function(pr){
      var ok=(pr.right===pr.left);
      if(ok)H5++;else W5++;
      usedRight[pr.right]=1;
      items5.push({status:ok?'correct':'wrong',text:a.pairs[pr.left].left+' → you matched: '+a.pairs[pr.right].right});
    });
    a.pairs.forEach(function(p,i){
      if(!usedRight[i]){
        var made=a._pairs.some(function(pr){return pr.left===i;});
        if(!made)items5.push({status:'missed',text:p.left+' → correct match: '+p.right});
      }
    });
    r={H:H5,W:W5,N:a.pairs.length,items:items5};
  }else if(ex.type==='fillblank'){
    var H6=0,W6=0,items6=[];
    a.blanks.forEach(function(b,i){
      var f=a._filled[i];
      if(f===null){items6.push({status:'missed',text:'Blank '+(i+1)+': correct word "'+b+'"'})}
      else{
        var w=a._words[f];
        if(w.slot===i){H6++;items6.push({status:'correct',text:'Blank '+(i+1)+': "'+b+'"'});}
        else{W6++;items6.push({status:'wrong',text:'Blank '+(i+1)+': you used "'+w.t+'", correct word: "'+b+'"'});}
      }
    });
    r={H:H6,W:W6,N:a.blanks.length,items:items6};
  }else if(ex.type==='terminal'){
    var norm=normalizeCmd(ex._cmd);
    var H7=0,W7=0,items7=[],danger=false;
    a.elements.forEach(function(el){
      var ok=new RegExp(el.pattern,'i').test(norm);
      if(ok){H7++;items7.push({status:'correct',text:el.desc});}
      else{items7.push({status:'missed',text:el.desc});}
    });
    (a.wrongPatterns||[]).forEach(function(wp){
      if(new RegExp(wp.pattern,'i').test(norm)){W7++;danger=true;items7.push({status:'wrong',text:wp.desc});}
    });
    if(!norm){W7++;items7.push({status:'wrong',text:'No command was entered.'});}
    r={H:H7,W:W7,N:a.elements.length,items:items7,terminal:true,danger:danger};
  }else if(ex.type==='branching'){
    var H8=0,W8=0,items8=[];
    ex.steps.forEach(function(st,i){
      var ok=(st._choice===st._corr);
      if(ok)H8++;else W8++;
      items8.push({status:ok?'correct':'wrong',text:'Step '+(i+1)+' — '+st.options[st.correct]});
    });
    r={H:H8,W:W8,N:ex.steps.length,items:items8,branching:true};
  }else{r={H:0,W:0,N:1,items:[]};}
  var credit=scoreExercise(r.H,r.W,r.N);
  if(hintUsed[ex.id])credit=Math.max(0,credit-0.10);
  r.credit=credit;
  return r;
}
function normalizeCmd(c){
  return String(c||'').toLowerCase().replace(/\s+/g,' ').trim().replace(/;$/,'').replace(/\/$/,'');
}

/* ---------- rendering helpers ---------- */
function sevBadge(){
  return '<span class="badge '+SEV_CLASS[M.difficulty]+'" role="status">'+(M.difficulty==='extremely-hard'?'&#9888; ':'')+SEV_WORD[M.difficulty]+(M.partLabel?' &middot; '+esc(M.partLabel):'')+'</span>';
}
function blockHead(icon,label,extra){
  return '<div class="block-h"><span class="ic" aria-hidden="true">'+icon+'</span><span>'+esc(label)+'</span>'+((extra!==undefined)?extra:'')+'</div>';
}
function logViewer(ex){
  var lg=ex.log;
  var h='<div class="artefact" style="border-color:#33415f">';
  h+='<div class="artefact-h">LOG VIEWER — '+esc(lg.title||'log excerpts')+' &nbsp;<span style="color:var(--text-secondary)">(live filter)</span></div>';
  h+='<div class="log-toolbar"><input type="text" class="log-filter" id="lf-'+ex.id+'" placeholder="Filter lines… (case-insensitive)" aria-label="Filter log lines"><span class="log-count" id="lc-'+ex.id+'">'+lg.lines.length+' lines</span></div>';
  h+='<div class="log-body" id="lb-'+ex.id+'">';
  lg.lines.forEach(function(l){h+='<div class="log-line" data-lc="'+esc(l.toLowerCase())+'">'+hl(l)+'</div>';});
  h+='</div></div>';
  return h;
}
function scenarioBlock(ex){
  var sc=ex.scenario||{};
  var body='';
  (sc.text||[]).forEach(function(p){body+='<p>'+md(p)+'</p>';});
  if(ex.type==='log-qcm'&&ex.log&&ex.log.lines)body+=logViewer(ex);
  var collapsible=(sc.text&&sc.text.join(' ').length>420)||((sc.artefacts||[]).length>1)||ex.type==='log-qcm';
  (sc.artefacts||[]).forEach(function(art,i){
    var lbl='ARTEFACT '+(i+1)+' — '+art.label;
    if(art.code){body+=codeBlock(art.code.split('\n'),lbl);}
    else{body+='<div class="artefact"><div class="artefact-h">'+esc(lbl)+'</div><div class="prose">'+md(art.text||'')+'</div></div>';}
  });
  var summary='';
  if(sc.text&&sc.text.length){var s0=sc.text[0];summary=s0.length>90?s0.slice(0,90)+'…':s0;}
  var inner='<div class="block-b">'+body+'</div>';
  var collapsedId='scn-body-'+ex.id;
  var h=blockHead('&#128269;','SCENARIO',
    collapsible?'<button type="button" class="collapse-btn" id="scn-toggle-'+ex.id+'" aria-expanded="true" onclick="EXAMUI.toggleScenario(\''+ex.id+'\')">Collapse</button>':'');
  var sumLine=collapsible?'<div class="summary-line" id="scn-sum-'+ex.id+'" style="display:none">'+esc(summary)+' — collapsed</div>':'';
  return '<section class="block bl-scenario" aria-label="Scenario">'+h+sumLine+'<div id="'+collapsedId+'">'+inner+'</div></section>';
}
function questionBlock(ex){
  var h=blockHead('&#10067;','QUESTION');
  var q=ex.question;
  var stepBadge='';
  if(ex.type==='branching'&&ex.steps&&ex.steps[ex._step]){
    var st=ex.steps[ex._step];
    if(st.question)q=st.question;
    stepBadge='<span class="step-badge">STEP '+(ex._step+1)+' OF '+ex.steps.length+'</span> ';
  }
  var body='<div class="block-b"><p style="font-weight:700;margin:0">'+stepBadge+md(q)+'</p>';
  if(ex.type==='branching'&&ex._step>0&&ex.steps[ex._step].continuation){
    body+='<div class="artefact"><div class="artefact-h">UPDATE — what happened next</div><div class="prose">'+md(ex.steps[ex._step].continuation)+'</div></div>';
  }
  body+='</div>';
  return '<section class="block bl-question" aria-label="Question">'+h+body+'</section>';
}
function feedbackBlock(ex,res){
  var label,color,icon,headColor;
  var fullRaw=(res.W===0&&res.H>=res.N);
  if(res.terminal&&res.danger&&res.credit<1){
    label='DANGEROUS — NEAR MISS';color='st-incorrect';icon='&#10007;';headColor='var(--state-incorrect)';
  }
  else if(res.credit>=1){label='CORRECT';color='st-correct';icon='&#10004;';headColor='var(--state-correct)';}
  else if(res.single&&fullRaw){label='CORRECT';color='st-correct';icon='&#10004;';headColor='var(--state-correct)';}
  else if(res.credit>0){label='PARTIALLY CORRECT';color='st-partial';icon='&#10004;';headColor='var(--state-partial)';}
  else{label='INCORRECT';color='st-incorrect';icon='&#10007;';headColor='var(--state-incorrect)';}
  var h='<div class="block-h"><span class="ic">'+icon+'</span><span class="fb-title" style="color:'+headColor+'">'+label+'</span>';
  if(res.N>1||!res.single||hintUsed[ex.id])h+='<span class="fb-credit">credit '+res.credit.toFixed(2)+' — '+res.H+'/'+res.N+' items'+(res.W>0?' · '+res.W+' wrong':'')+(hintUsed[ex.id]?' · hint −0.10':'')+'</span>';
  h+='</div>';
  var b='<div class="block-b">';
  if(res.terminal&&res.danger)b+='<p style="color:var(--state-incorrect);font-weight:700">&#9888; Your command was close — and destructive. Read the warning below before running anything similar on a real host.</p>';
  b+='<div class="item-rows">';
  res.items.forEach(function(it){
    var mk=it.status==='correct'?'<span class="mk mk-c">&#10004; Correct</span>':it.status==='wrong'?'<span class="mk mk-w">&#10007; Wrong</span>':'<span class="mk mk-m">&#9675; Missed</span>';
    b+='<div class="item-row">'+mk+'<span>'+md(it.text)+'</span></div>';
  });
  b+='</div>';
  (ex.explanation||[]).forEach(function(p){b+='<p>'+md(p)+'</p>';});
  if(ex.perspectives&&(ex.perspectives.attacker||ex.perspectives.defender)){
    b+='<div class="persp">';
    if(ex.perspectives.attacker)b+='<div class="p-card red"><h6>&#9876; Attacker perspective</h6>'+md(ex.perspectives.attacker)+'</div>';
    if(ex.perspectives.defender)b+='<div class="p-card blue"><h6>&#128737; Defender perspective</h6>'+md(ex.perspectives.defender)+'</div>';
    b+='</div>';
  }
  if(res.terminal&&ex.answer.canonical){
    b+='<div class="canon"><h6>Canonical command (copyable)</h6><pre id="canon-cmd">'+esc(ex.answer.canonical)+'</pre>';
    if(ex.answer.canonicalParts&&ex.answer.canonicalParts.length){b+='<ul>';ex.answer.canonicalParts.forEach(function(p){b+='<li>'+md(p)+'</li>';});b+='</ul>';}
    if(ex.answer.expectedOutput)b+='<h6 style="margin-top:10px;color:var(--text-secondary)">Expected output shape</h6><pre>'+esc(ex.answer.expectedOutput)+'</pre>';
    b+='</div>';
  }
  if(res.credit<1&&ex.study)b+='<div class="study-tip">&#128161; <b>What to study:</b> '+md(ex.study)+'</div>';
  b+='</div>';
  return '<section class="block bl-feedback" aria-label="Feedback" aria-live="polite">'+h+b+'</section>';
}

/* ---------- widgets ---------- */
var WIDGETS={};
function ansBox(ex,inner){return '<section class="block bl-answer" aria-label="Your answer">'+blockHead('&#9998;','YOUR ANSWER')+'<div class="block-b" id="ans-'+ex.id+'">'+inner+'</div></section>';}

WIDGETS['qcm-single']=WIDGETS['qcm-multi']=WIDGETS['log-qcm']={
  render:function(ex){
    var multi=!!ex.answer._multi;
    var a=ex.answer;
    var note=multi?'<p class="muted small" style="margin-top:0">Select all that apply. Partial credit applies: wrong selections cancel correct ones.</p>':'';
    var opts='<div class="opts" role="'+(multi?'group':'radiogroup')+'" aria-label="Answer options">';
    a._disp.forEach(function(o,i){
      opts+='<button type="button" class="opt" data-i="'+i+'" aria-pressed="false"><span class="letter">'+String.fromCharCode(65+i)+'.</span><span>'+md(o.text)+'</span><span class="sel-mark"></span></button>';
    });
    opts+='</div>';
    return ansBox(ex,note+opts);
  },
  bind:function(ex,root){
    var a=ex.answer;
    root.querySelectorAll('#ans-'+ex.id+' .opt').forEach(function(btn){
      btn.addEventListener('click',function(){
        if(ex.result)return;
        var i=parseInt(btn.getAttribute('data-i'),10);
        if(!a._multi){
          a._choice=i;
          root.querySelectorAll('#ans-'+ex.id+' .opt').forEach(function(b2){b2.classList.remove('selected');b2.setAttribute('aria-pressed','false');b2.querySelector('.sel-mark').textContent='';});
          btn.classList.add('selected');btn.setAttribute('aria-pressed','true');btn.querySelector('.sel-mark').textContent='✓ selected';
        }else{
          a._sel=a._sel||[];
          var k=a._sel.indexOf(i);
          if(k>=0){a._sel.splice(k,1);btn.classList.remove('selected');btn.setAttribute('aria-pressed','false');btn.querySelector('.sel-mark').textContent='';}
          else{a._sel.push(i);btn.classList.add('selected');btn.setAttribute('aria-pressed','true');btn.querySelector('.sel-mark').textContent='✓ selected';}
        }
      });
    });
  },
  lock:function(ex,root){
    root.querySelectorAll('#ans-'+ex.id+' .opt').forEach(function(b){b.classList.add('disabled');b.disabled=true;});
  }
};

WIDGETS['dragdrop']={
  render:function(ex){
    var a=ex.answer;
    var h='<p class="muted small" style="margin-top:0">Drag each item into the correct zone — or click an item, then click a zone. Click a placed item to send it back.</p>';
    h+='<div class="dd-grid"><div><p class="bank-label">&#128203; Item bank</p><div class="bank" id="bank-'+ex.id+'"></div></div>';
    h+='<div>';
    a.zones.forEach(function(z,i){
      h+='<div class="zone" data-z="'+i+'" style="margin-bottom:12px"><h5>&#11015; '+esc(z.name)+'</h5><div class="zone-items" data-zitems="'+i+'"></div></div>';
    });
    h+='</div></div>';
    return ansBox(ex,h);
  },
  bind:function(ex,root){
    var a=ex.answer;
    var bank=$('bank-'+ex.id);
    var selIdx=null;
    function chipEl(i){
      var b=document.createElement('button');
      b.type='button';b.className='dchip grab';b.textContent=a.items[i].text;b.setAttribute('data-i',i);
      b.setAttribute('draggable','true');
      b.setAttribute('aria-label','Item: '+a.items[i].text);
      b.addEventListener('click',function(){
        if(ex.result)return;
        var zi=a._placed[i];
        if(zi!==undefined&&zi!==null){a._placed[i]=null;render();return;}
        if(selIdx===i){selIdx=null;b.classList.remove('selected');return;}
        selIdx=i;
        bank.querySelectorAll('.dchip').forEach(function(c){c.classList.remove('selected');});
        b.classList.add('selected');
      });
      b.addEventListener('dragstart',function(ev){if(ex.result){ev.preventDefault();return;}ev.dataTransfer.setData('text/plain',String(i));});
      return b;
    }
    function render(){
      bank.innerHTML='';
      a._bank.forEach(function(i){
        var p=a._placed[i];
        if(p===undefined||p===null)bank.appendChild(chipEl(i));
      });
      a.zones.forEach(function(z,zi){
        var box=root.querySelector('[data-zitems="'+zi+'"]');
        box.innerHTML='';
        a._bank.forEach(function(i){
          if(a._placed[i]===zi)box.appendChild(chipEl(i));
        });
      });
    }
    root.querySelectorAll('.zone').forEach(function(z){
      var zi=parseInt(z.getAttribute('data-z'),10);
      z.addEventListener('click',function(ev){
        if(ex.result)return;
        if(ev.target.closest('.dchip'))return;
        if(selIdx!==null){a._placed[selIdx]=zi;selIdx=null;render();}
      });
      z.addEventListener('dragover',function(ev){if(!ex.result){ev.preventDefault();z.classList.add('over');}});
      z.addEventListener('dragleave',function(){z.classList.remove('over');});
      z.addEventListener('drop',function(ev){
        ev.preventDefault();z.classList.remove('over');
        if(ex.result)return;
        var i=parseInt(ev.dataTransfer.getData('text/plain'),10);
        if(!isNaN(i)){a._placed[i]=zi;render();}
      });
    });
    render();
  },
  lock:function(ex,root){root.querySelectorAll('#ans-'+ex.id+' .dchip').forEach(function(c){c.disabled=true;});}
};

WIDGETS['order']={
  render:function(ex){
    var a=ex.answer;
    var modeName=a.mode==='rank'?'ranking':'timeline';
    var h='<p class="muted small" style="margin-top:0">Put the items into the correct '+esc(modeName)+' order. Use the arrows, or drag rows. Partial credit: each item in its correct position scores; each item in a wrong position subtracts.</p><div class="ord-list" id="ord-'+ex.id+'"></div>';
    return ansBox(ex,h);
  },
  bind:function(ex,root){
    var a=ex.answer;
    var list=$('ord-'+ex.id);
    function render(){
      list.innerHTML='';
      a._disp.forEach(function(itemIdx,pos){
        var row=document.createElement('div');
        row.className='ord-row';row.setAttribute('draggable','true');
        row.innerHTML='<span class="ord-pos">'+(pos+1)+'</span><span class="handle" aria-hidden="true">&#8942;&#8942;</span><span class="ord-text">'+md(a.items[itemIdx])+'</span>';
        var btns=document.createElement('div');btns.className='ord-btns';
        var up=document.createElement('button');up.type='button';up.textContent='▲';up.setAttribute('aria-label','Move item '+(pos+1)+' up');
        var dn=document.createElement('button');dn.type='button';dn.textContent='▼';dn.setAttribute('aria-label','Move item '+(pos+1)+' down');
        up.addEventListener('click',function(){if(ex.result||pos===0)return;var t=a._disp[pos-1];a._disp[pos-1]=a._disp[pos];a._disp[pos]=t;render();});
        dn.addEventListener('click',function(){if(ex.result||pos===a._disp.length-1)return;var t=a._disp[pos+1];a._disp[pos+1]=a._disp[pos];a._disp[pos]=t;render();});
        btns.appendChild(up);btns.appendChild(dn);row.appendChild(btns);
        row.addEventListener('dragstart',function(ev){if(ex.result){ev.preventDefault();return;}row.classList.add('dragging');ev.dataTransfer.setData('text/plain',String(pos));});
        row.addEventListener('dragend',function(){row.classList.remove('dragging');});
        row.addEventListener('dragover',function(ev){if(!ex.result)ev.preventDefault();});
        row.addEventListener('drop',function(ev){
          ev.preventDefault();if(ex.result)return;
          var from=parseInt(ev.dataTransfer.getData('text/plain'),10);
          if(!isNaN(from)&&from!==pos){var it=a._disp.splice(from,1)[0];a._disp.splice(pos,0,it);render();}
        });
        list.appendChild(row);
      });
    }
    render();
  },
  lock:function(ex,root){root.querySelectorAll('#ans-'+ex.id+' button').forEach(function(b){b.disabled=true;});}
};

    else if(ex.type==='qcm-multi'||ex.type==='log-qcm')hasAnswer=ex.answer._sel&&ex.answer._sel.length>0;
    else if(ex.type==='dragdrop')hasAnswer=Object.keys(a._placed).some(function(k){return a._placed[k]!==null&&a._placed[k]!==undefined;});
    else if(ex.type==='order')hasAnswer=true;
    else if(ex.type==='match')hasAnswer=a._pairs.length>0;
    else if(ex.type==='fillblank')hasAnswer=a._filled.some(function(f){return f!==null;});
    else if(ex.type==='terminal')hasAnswer=ex._cmd.trim().length>0;
    else if(ex.type==='branching')hasAnswer=ex.steps.every(function(st){return st._done;});

function doManualPause(){

    var ov=document.createElement('div');
    ov.className='paused-overlay';ov.id='pause-ov';

    document.body.appendChild(ov);
    $('btn-resume').addEventListener('click',resumeManual);
    $('btn-resume').focus();
  }
}
function resumeManual(){
  var ov=$('pause-ov');if(ov)ov.remove();
  setState(exam.prevState===STATE_AUTO?STATE_AUTO:STATE_RUN);
}function doSkip(){
  var i=exam.current,ex=exam.list[i];
  if(ex.result)return;
  exam.skipped[i]=true;
  var nxt=nextMain(i);
  if(nxt>=0){renderExercise(nxt);}
  else if(Object.keys(exam.skipped).length>0){goReview();}
  else{goResults();}
}
function nextMain(from){
  for(var j=Math.max(0,from+1);j<exam.list.length;j++){
    if(!exam.list[j].result&&!exam.skipped[j])return j;
  }
  return -1;
}
function doCheck(expired){
  var i=exam.current,ex=exam.list[i];
  if(ex.result)return;
  if(ex.type==='terminal'){
    var ti=$('tin-'+ex.id);
    if(ti&&ti.value.trim())ex._cmd=ti.value;
  }
  setState(STATE_AUTO);
  timer.perLimit=0;
  var res=gradeExercise(ex);
  ex.result=res;
  exam.results[i]=res;
  exam.graded++;
  exam.creditSum+=res.credit;
  var fb=feedbackBlock(ex,res);
  $('fb-slot').innerHTML=fb;
  if(WIDGETS[ex.type].lock)WIDGETS[ex.type].lock(ex,document);
  $('btn-check').classList.add('hidden');
  var moreMain=(nextMain(i)>=0);
  var nSkipped=Object.keys(exam.skipped).length;
  var nextBtn=$('btn-next'),finBtn=$('btn-final');
  if(!moreMain&&nSkipped===0){finBtn.classList.remove('hidden');}
  else{
    nextBtn.classList.remove('hidden');
    nextBtn.innerHTML=moreMain?'Next &#8594;':'Review skipped &#9888; &#8594;';
  }
  $('btn-hint').disabled=true;$('btn-skip').disabled=true;
  nextBtn.addEventListener('click',function(){onNext();});
  finBtn.addEventListener('click',function(){goResults();});
  updateSegments();renderHeaderTimer();
  var fbEl=document.querySelector('.bl-feedback');if(fbEl)fbEl.scrollIntoView({behavior:scrollBehavior(),block:'start'});
}
function onNext(){
  var i=exam.current;
  delete exam.skipped[i];
  if(exam.fromReview){exam.fromReview=false;goReview();return;}
  var nxt=nextMain(i);
  if(nxt>=0){setState(STATE_RUN);renderExercise(nxt);}
  else if(Object.keys(exam.skipped).length>0){goReview();}
  else{goResults();}
}

/* ---------- review ---------- */
function goReview(){
  view='review';
  setState(STATE_RUN);
  if(!$('ex-area'))renderExamShell();
  var keys=Object.keys(exam.skipped).map(Number).sort(function(a,b){return a-b;});
  var rows=keys.map(function(i){
    var ex=exam.list[i];
    return '<div class="card review-row"><span class="state-chip st-skipped">&#9888; Skipped</span><span class="q">'+md(ex.question)+'</span><button type="button" class="btn btn-slim btn-amber" data-go="'+i+'">Answer &#8594;</button></div>';
  }).join('');
  var hasMain=(nextMain(-1)>=0);
  var html='<div class="ex-meta-row"><span class="hd-count" style="font-size:18px">Review skipped exercises</span>'+sevBadge()+'</div>'+
    '<p class="muted" style="margin:6px 0 14px">The timer is still running. You can answer as many skipped exercises as you like before you submit. Anything never answered is excluded from the score.</p>';
  if(keys.length){html+='<div class="review-list">'+rows+'</div>';}
  else{html+='<div class="notice">&#10004; No skipped exercises remain — everything has been answered or excluded.</div>';}
  html+='<div class="step-actions" style="margin:18px 0 40px">';
  if(hasMain)html+='<button type="button" class="btn" id="rv-back">&#8592; Back to exam</button>';
  html+='<button type="button" class="btn btn-primary" id="rv-final">Final Submit &#9632;</button></div>';
  $('ex-area').innerHTML=html;
  document.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click',function(){
      exam.fromReview=true;
      setState(STATE_RUN);
      renderExercise(parseInt(b.getAttribute('data-go'),10));
      view='exam';
    });
  });
  var bb=$('rv-back');
  if(bb)bb.addEventListener('click',function(){
    var nxt=nextMain(-1);
    view='exam';
    if(nxt>=0){setState(STATE_RUN);renderExercise(nxt);}else goResults();
  });
  $('rv-final').addEventListener('click',goResults);
  window.scrollTo({top:0,behavior:scrollBehavior()});
}

/* ---------- results ---------- */
function goResults(){
  view='results';
  setState(STATE_END);
  var answered=exam.graded;
  var total=exam.list.length;
  var skippedExcluded=total-answered;
  var creditSum=exam.creditSum;
  var percent=answered>0?Math.round(creditSum/answered*100):0;
  var passed=percent>=PASS_MARK&&answered>0;
  var fully=0,partial=0,incorrect=0,partSum=0;
  exam.results.forEach(function(r){if(!r)return;if(r.credit>=1)fully++;else if(r.credit>0){partial++;partSum+=r.credit;}else incorrect++;});
  var breakdown=
    '<div class="res-break">'+
    '<div class="res-cell" style="border-color:var(--state-correct)"><span class="mk mk-c">&#10004;</span><span><b>'+fully+'</b> &nbsp;Fully correct</span></div>'+
    '<div class="res-cell" style="border-color:var(--state-partial)"><span class="mk" style="color:var(--state-partial)">&#10004;</span><span><b>'+partial+'</b> &nbsp;Partially correct'+(partial>0?' — avg credit '+ (partSum/partial).toFixed(2):'')+'</span></div>'+
    '<div class="res-cell" style="border-color:var(--state-incorrect)"><span class="mk mk-w">&#10007;</span><span><b>'+incorrect+'</b> &nbsp;Fully incorrect</span></div>'+
    '<div class="res-cell"><span class="mk mk-m">&#9888;</span><span><b>'+skippedExcluded+'</b> &nbsp;Skipped — excluded from score</span></div>'+
    '</div>';
  var html='<div class="wrap">'+
    '<div class="card result-hero '+(passed?'pass-panel':'fail-panel')+'">'+
      '<div style="font-size:30px;font-weight:900;margin-bottom:4px;color:'+(passed?'var(--state-correct)':'var(--state-incorrect)')+'">'+(passed?'&#10004; PASS':'&#10007; FAIL')+'</div>'+
      '<div class="result-pct" style="color:'+(passed?'var(--state-correct)':'var(--state-incorrect)')+'">'+percent+'%</div>'+
      '<p class="muted" style="margin-top:8px">Final score: <b style="color:var(--text-primary)">'+fmt1(creditSum)+' / '+answered+'</b> answered · pass mark '+PASS_MARK+'% · '+esc(M.mitreId)+' — '+esc(SEV_WORD[M.difficulty])+'</p>'+
      (passed?'<p style="color:var(--state-correct);font-weight:700">&#127942; Certification-style result achieved. Well done.</p>':'<p style="color:var(--state-incorrect);font-weight:700">You must retake this exam to reach the pass mark.</p>')+
    '</div>'+
    '<div class="card section-body">'+breakdown+
      '<p class="muted small" style="margin-top:14px">&#9208; Time paused manually: '+fmtClock(timer.manualSec)+' · &#9208; Time paused reviewing feedback: '+fmtClock(timer.autoSec)+' · &#9632; Timer ended with '+fmtClock(timer.remain)+' left.</p>'+
    '</div>'+
    '<div class="start-row"><button type="button" class="btn btn-primary start-btn" id="retake-btn">&#8635; Retake Exam</button></div>'+
  '</div>';
  $('app').innerHTML=html;
  $('retake-btn').addEventListener('click',function(){
    view='intro';renderIntro();window.scrollTo({top:0,behavior:scrollBehavior()});
  });
  if(!reported){
    reported=true;
    reportScore(creditSum,answered);
  }
  window.scrollTo({top:0,behavior:scrollBehavior()});
}
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:M.topicId,
      batch:M.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=PASS_MARK
    },location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  learner.name=event.data.username||'';
  learner.country=event.data.country||'';
  learner.locale=event.data.locale||'en';
});

/* ---------- shell ---------- */
window.EXAMUI={
  toggleScenario:function(id){
    var body=$('scn-body-'+id),sum=$('scn-sum-'+id),btn=$('scn-toggle-'+id);
    if(!body)return;
    var hidden=body.classList.toggle('hidden');
    if(sum)sum.style.display=hidden?'block':'none';
    if(btn){btn.textContent=hidden?'Expand':'Collapse';btn.setAttribute('aria-expanded',hidden?'false':'true');}
  }
};
/* Read-only test/diagnostics accessor (used by the site's QA harness; makes no network calls) */
window.CM_DEBUG=function(){
  return {
    view:view,
    timer:{state:timer.state,remain:timer.remain,manualSec:timer.manualSec,autoSec:timer.autoSec,perLimit:timer.perLimit,perRemain:timer.perRemain},
    current:exam.current,graded:exam.graded,creditSum:exam.creditSum,attempt:exam.attempt,
    skipped:Object.keys(exam.skipped).map(Number),
    results:exam.results,
    list:exam.list
  };
};
document.body.style.background='var(--bg-page)';
document.body.style.color='var(--text-primary)';
renderIntro();
})();
</script>
