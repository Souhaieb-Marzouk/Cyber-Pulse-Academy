<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1021 Remote Services — EXTREMELY_HARD</title>
<style>
:root{
  --bg-page:#070c12;
  --bg-panel:#0d141d;
  --bg-surface:#111a26;
  --bg-surface-2:#0a111a;
  --bg-elev:#172335;
  --ink:#e9eff7;
  --ink-dim:#a9b9cb;
  --ink-faint:#8497ab;
  --line:#1f2b3c;
  --line-soft:#182331;
  --blue:#4aa8e8;   --blue-soft:rgba(74,168,232,.13);
  --amber:#e6aa3c;  --amber-soft:rgba(230,170,60,.13);
  --green:#41c07f;  --green-soft:rgba(65,192,127,.13);
  --red:#ef5a6a;    --red-soft:rgba(239,90,106,.15);
  --sev-easy:#41c07f;
  --sev-medium:#e6aa3c;
  --sev-hard:#f0813c;
  --sev-extreme:#ef5a6a;
  --focus:#4aa8e8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1 0 auto;width:100%;max-width:980px;margin:0 auto;padding:20px 16px 40px}
.foot{flex-shrink:0;margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:12.5px;background:var(--bg-panel)}
.foot b{color:var(--ink-dim);letter-spacing:.08em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-surface-2)}
::-webkit-scrollbar-thumb{background:#24344b;border-radius:6px;border:2px solid var(--bg-surface-2)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(8,13,20,.94);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.14em;font-size:12.5px;color:var(--green)}
.brand small{color:var(--ink-faint);letter-spacing:.05em;font-weight:600}
.tb-sep{width:1px;height:22px;background:var(--line)}
.tb-title{font-weight:700;font-size:13.5px;color:var(--ink-dim);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stat{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;font-weight:600;background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:32px}
.tb-stat .ic{font-size:13px}
.tb-stat.timer{font-family:var(--mono);color:var(--ink)}
.tb-state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px;border:1px solid}
.tb-state.manual{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.tb-state.autocheck{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.tb-btn:hover:not(:disabled){border-color:var(--blue)}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}
.tb-btn.hint{color:var(--amber)}
.tb-btn.skip{color:var(--ink-dim)}
.prog{height:3px;background:var(--line-soft)}
.prog i{display:block;height:100%;background:var(--green);width:0%;transition:width .25s}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 12px;color:#08110b}
.badge::before{content:"●";font-size:9px}
.sev-EASY{background:var(--sev-easy)}
.sev-MEDIUM{background:var(--sev-medium)}
.sev-HARD{background:var(--sev-hard)}
.sev-EXTREMELY_HARD{background:var(--sev-extreme);color:#160407}
.otype{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg-surface)}
/* ---------- intro ---------- */
.intro-head{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--bg-panel),var(--bg-surface-2));padding:26px 26px 20px;margin-bottom:16px}
.intro-head h1{margin:8px 0 4px;font-size:26px;line-height:1.25}
.intro-head .sub{color:var(--ink-dim);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-dim);background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:34px}
.chip .ic{color:var(--ink-faint)}
.cand{margin-top:12px;font-size:13px;color:var(--ink-faint)}
.intro-sec{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;background:var(--bg-panel);padding:18px 22px;margin-bottom:14px}
.intro-sec.learn{border-left-color:var(--blue)}
.intro-sec.keys{border-left-color:var(--amber)}
.intro-sec.how{border-left-color:var(--green)}
.intro-sec h2{margin:0 0 10px;font-size:15px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.intro-sec.learn p{color:var(--ink-dim);margin:0 0 10px}
.intro-sec.learn p:last-child{margin-bottom:0}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kw-card{background:var(--bg-surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 14px}
.kw-card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.kw-card ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:13.5px}
.kw-card li{margin:2px 0}
.rules{margin:0;padding:0;list-style:none}
.rules li{position:relative;padding:7px 0 7px 26px;color:var(--ink-dim);font-size:14px}
.rules li::before{content:"▸";position:absolute;left:4px;color:var(--green)}
.rules li .dim{color:var(--ink-faint)}
/* ---------- exercise card ---------- */
.excard{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--bg-panel);border:1px solid var(--line);border-left:4px solid var(--blk,var(--blue));border-radius:12px;padding:16px 20px}
.blk-scenario{--blk:var(--blue)}
.blk-question{--blk:var(--amber)}
.blk-answer{--blk:var(--green)}
.blk-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--blk,var(--ink));margin-bottom:10px}
.blk-label .dot{width:8px;height:8px;border-radius:50%;background:var(--blk,var(--ink))}
.ex-title{margin:0 0 8px;font-size:16.5px}
.summary{color:var(--ink-faint);font-size:13.5px;font-style:italic;margin:0 0 8px}
.showfull{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;min-height:32px}
.scen-body p{margin:0 0 10px;color:var(--ink-dim)}
.scen-body p:last-child{margin-bottom:0}
details.artef{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin:10px 0 0}
details.artef summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--blue);user-select:none;min-height:40px;display:flex;align-items:center}
details.artef .artbody{padding:0 14px 12px}
.mono{font-family:var(--mono);font-size:13px;line-height:1.5;color:#c8d8e6;background:var(--bg-surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:0}
table.attable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:0}
table.attable th{background:var(--bg-elev);color:var(--ink);text-align:left}
table.attable th,table.attable td{border:1px solid var(--line-soft);padding:6px 10px;color:var(--ink-dim)}
.q-text{margin:0;font-weight:700;font-size:16px;color:var(--ink)}
/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-height:44px;cursor:pointer;color:var(--ink);font-size:14.5px;font-family:var(--sans);margin:0 0 8px}
.opt:last-child{margin-bottom:0}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}
.opt .mark{font-weight:800;flex-shrink:0}
/* ---------- match ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol h4,.obank h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mleft{flex:1;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;min-height:44px;display:flex;align-items:center}
.mzone{flex:1;background:var(--bg-surface-2);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;min-height:44px;color:var(--ink-faint);font-size:13.5px;cursor:pointer;text-align:left;font-family:var(--sans)}
.mzone.filled{border-style:solid;border-color:var(--blue);color:var(--ink)}
.mzone.dragover{border-color:var(--green)}
.mzone.correct{border-color:var(--green);background:var(--green-soft)}
.mzone.wrong{border-color:var(--red);background:var(--red-soft)}
.mbank{display:flex;flex-direction:column}
.mchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;margin-bottom:8px;cursor:grab;color:var(--ink);font-size:13.5px;text-align:left;font-family:var(--sans)}
.mchip:disabled{cursor:default;opacity:.5}
.mchip.selchip{border-color:var(--amber);background:var(--amber-soft)}
.mchip.used{opacity:.35}
.mhintline{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- order ---------- */
.ordlist{list-style:none;margin:0;padding:0;counter-reset:ord}
.orditem{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.orditem.dragover{border-color:var(--green)}
.orditem .num{font-family:var(--mono);color:var(--amber);font-weight:700;min-width:22px;text-align:center}
.orditem .txt{flex:1;font-size:14px}
.orditem.correct{border-color:var(--green)}
.orditem.wrong{border-color:var(--red)}
.ordbtns{display:flex;gap:4px}
.ordbtns button{min-width:34px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);cursor:pointer;font-size:14px}
.ordbtns button:hover{border-color:var(--blue)}
/* ---------- fill ---------- */
.fillwrap{font-size:15.5px;color:var(--ink-dim);line-height:2.1;white-space:pre-wrap}
.fillin{font-family:var(--mono);font-size:13.5px;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 10px;min-height:38px;width:170px;margin:0 3px}
.fillin:focus{border-color:var(--blue);outline:none}
.fillin.correct{border-color:var(--green)}
.fillin.wrong{border-color:var(--red)}
.fbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:38px;font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer}
.fchip:hover{border-color:var(--amber)}
/* ---------- terminal ---------- */
.term{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:8px;background:var(--bg-elev);padding:8px 12px;font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.term-bar .dots{letter-spacing:3px;color:var(--red)}
.term-out{font-family:var(--mono);font-size:13px;line-height:1.55;color:#c8d8e6;padding:12px 14px;min-height:130px;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term-out .tl-dim{color:var(--ink-faint)}
.term-out .tl-danger{color:var(--red);font-weight:700}
.term-out .tl-echo{color:var(--ink)}
.term-line{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding:10px 14px}
.term-prompt{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--mono);font-size:13px;min-height:34px}
.term-in:focus{outline:none}
details.syntax{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin-top:10px}
details.syntax summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--amber);min-height:40px;display:flex;align-items:center}
details.syntax .artbody{padding:0 14px 12px}
/* ---------- logview ---------- */
.logpanel{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log-tools{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-elev);border-bottom:1px solid var(--line-soft)}
.logfilter{flex:1;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 12px;min-height:38px}
.logfilter:focus{border-color:var(--blue);outline:none}
.log-count{font-size:12px;color:var(--ink-faint);font-family:var(--mono);white-space:nowrap}
.loglines{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#bccfe0;padding:12px 14px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.loglines mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}
.wtitle{font-weight:700;margin:14px 0 10px;color:var(--ink)}
/* ---------- decision ---------- */
.dstep{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.dstep.locked{opacity:.9}
.dlabel{display:inline-flex;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue);border-radius:6px;padding:3px 9px;margin-bottom:8px}
.dprompt{font-family:var(--mono);font-size:13px;color:var(--ink-dim);background:var(--bg-surface-2);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 10px;white-space:pre-wrap}
.dq{font-weight:700;margin:0 0 10px}
.drecorded{color:var(--ink-faint);font-size:13px;margin-top:8px}
.dwhy{font-size:13.5px;color:var(--ink-dim);background:var(--bg-surface-2);border-radius:8px;padding:9px 12px;margin-top:8px}
/* ---------- hint ---------- */
.hintbox{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin-top:12px;color:var(--ink-dim)}
.hintbox .hb{color:var(--amber);font-weight:800;font-size:12px;letter-spacing:.1em;display:block;margin-bottom:4px}
.penaltynote{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- feedback ---------- */
.fb{border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.fb.ok{border-color:var(--green)}
.fb.bad{border-color:var(--red)}
.fb.part{border-color:var(--amber)}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 18px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb.ok .fb-head{background:var(--green-soft);color:var(--green)}
.fb.bad .fb-head{background:var(--red-soft);color:var(--red)}
.fb.part .fb-head{background:var(--amber-soft);color:var(--amber)}
.fb-credit{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim);font-weight:600}
.fb-body{padding:14px 18px;background:var(--bg-panel)}
.fi{display:flex;gap:9px;padding:4px 0;font-size:14px;color:var(--ink-dim)}
.fi .ic{flex-shrink:0;font-weight:800}
.fi.ok .ic{color:var(--green)}
.fi.bad .ic{color:var(--red)}
.fi.miss .ic{color:var(--ink-faint)}
.fi.warn .ic{color:var(--red)}
.fi.warn{color:var(--red);font-weight:600}
.fi.note{color:var(--ink-faint)}
.fb-explain{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:12px;color:var(--ink-dim);font-size:14px}
.fb-explain p{margin:0 0 10px}
.fb-explain p:last-child{margin-bottom:0}
.fb-study{margin-top:10px;font-size:13px;color:var(--blue)}
.fb .mono{margin-top:10px}
/* ---------- actions ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:10px 20px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-family:var(--sans)}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:transparent;color:#04120a}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-amber{background:var(--amber);border-color:transparent;color:#1c1204}
.ghost-note{color:var(--ink-faint);font-size:13px}
/* ---------- review ---------- */
.revlist{display:flex;flex-direction:column;gap:10px}
.revrow{display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex-wrap:wrap}
.revrow .rn{font-family:var(--mono);color:var(--amber);font-weight:700}
.revrow .rt{flex:1;color:var(--ink-dim);font-size:14px;min-width:200px}
.revrow .badge-skip{color:var(--ink-faint);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* ---------- results ---------- */
.res-head{border:1px solid var(--line);border-radius:14px;background:var(--bg-panel);padding:26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ring{width:172px;height:172px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--pct)*1%),var(--bg-elev) 0);display:grid;place-items:center;flex-shrink:0}
.ring .rin{width:134px;height:134px;border-radius:50%;background:var(--bg-panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:34px;font-weight:800;font-family:var(--mono)}
.ring .of{font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
.res-verdict{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.res-verdict.pass{color:var(--green)}
.res-verdict.fail{color:var(--red)}
.res-sub{color:var(--ink-dim);font-size:14px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.statcard{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.statcard .sv{font-size:22px;font-weight:800;font-family:var(--mono)}
.statcard .sv.ok{color:var(--green)}
.statcard .sv.part{color:var(--amber)}
.statcard .sv.bad{color:var(--red)}
.statcard .sv.skip{color:var(--ink-faint)}
.statcard .sl{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.pausereport{border:1px solid var(--line);border-radius:10px;background:var(--bg-panel);padding:12px 16px;color:var(--ink-dim);font-size:13.5px;margin-bottom:14px}
.restable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.restable th{background:var(--bg-elev);text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase}
.restable td{padding:8px 12px;border-top:1px solid var(--line-soft);color:var(--ink-dim)}
.restable td.num{font-family:var(--mono)}
.st-ok{color:var(--green);font-weight:700}
.st-part{color:var(--amber);font-weight:700}
.st-bad{color:var(--red);font-weight:700}
.st-skip{color:var(--ink-faint);font-weight:700}
/* ---------- overlay ---------- */

<script type="application/json" id="cm-exercise-meta">{"attackId":"T1021","attackName":"Remote Services","objectType":"technique","severity":"EXTREMELY_HARD","topicId":"t1021","batch":4,"title":"T1021 Remote Services — EXTREMELY_HARD","difficulty":"extremely-hard","estimatedMinutes":60,"timerMinutes":60,"questionCount":18,"passMark":70,"learn":["You will run the hardest cases of T1021, the Remote Services technique: multi-hop pivots that chain SSH, WinRM and RDP across trust boundaries, cloud console movement, and direct connections to cloud VMs — the patterns public reporting documents in long, quiet intrusions.","You will build detection engineering judgement: precision and recall of a logon analytics rule, allow-list entries that carry expiry dates, noise artefacts from scanners and patch tools, and the difference between an alert you tune and an incident you escalate.","You will practise forensic reconstruction across sources: Windows Security and Sysmon, Linux auth logs, NetFlow, cloud audit trails and EDR process trees stitched into one attacker path with times you can defend in a review.","In real work, threat hunters own these hunts, IR leads own the chain of custody, CTI maps the chain to ATT&CK, red teams rehearse it under written authorisation, and detection engineers live in the false-positive queue. This exam walks you through each seat.","Expect conflicting signals on purpose: sanctioned maintenance hiding a real hop, scanner noise hiding a sweep, MFA success hiding a stolen token. Several correct answers are 'do nothing yet, escalate instead' — choosing when not to act is the skill being trained.","Take notes as you go. The cases build on each other, and the later judgement questions assume you kept the earlier hops in your head, exactly like a real hunt."],"keywords":[{"theme":"Multi-Hop Pivoting","items":["SSH chains through staging hosts","type 10 then type 3 hop sequences","same account across three hosts in minutes","segmentation boundaries cross var EXAMS = [{"id":"e01","type":"logview","title":"One week, three sources, one chain","summary":"Stitch VPN, Windows and cloud logs into the real chain.","scenario":"Correlation week at Meridian Freight. The hunt pulls three sources for user j.petrov and WORKSTATION-44: the VPN concentrator, Windows Security from two servers, and the cloud admin-portal audit. Most rows are noise: patch jobs, backups, a vulnerability scan. The runbook asks you to name the two lateral hops in order and count the identity-changing cloud events that followed.","question":"Fill the chain summary with the two hop targets and the event count:","hint":"Follow j.petrov only; the backup and the Thursday admin rows are baseline noise.","explanation":"j.petrov's chain: home VPN with approved MFA, then a 02:03 type 10 into OPS-FILE02 from WORKSTATION-44, then a type 3 hop from OPS-FILE02 into APP-ROUTE01 with a cmd.exe child, then the 02:40 ConsoleLogin and a CreateAccessKey. The count asks for identity-changing cloud events — CreateAccessKey changes identity state, ConsoleLogin is only authentication, so the answer is one. IT-JMP02 and svc_backup belong to sanctioned rows. Three sources, one narrative — that is correlation.","study":"Study cross-source correlation: VPN, Windows Security and cloud audit in one timeline.","filterable":true,"log":{"header":["day","time","source","event"],"lines":["Mon 22:14  VPN      j.petrov connected from home line 77[.]91[.]4[.]10","Mon 22:16  VPN      j.petrov MFA push approved","Tue 02:03  WIN-SEC  4624 Type 10  j.petrov from WORKSTATION-44 to OPS-FILE02","Tue 02:09  WIN-SEC  4624 Type 3   j.petrov from OPS-FILE02 to APP-ROUTE01","Tue 02:11  WIN-SEC  4688  cmd.exe spawned by services.exe on APP-ROUTE01","Tue 02:40  CLOUD    ConsoleLogin  j.petrov admin portal, new device","Tue 02:47  CLOUD    CreateAccessKey for j.petrov","Wed 11:00  WIN-SEC  4624 Type 3   svc_backup from BK-CTL01 to OPS-FILE02","Thu 03:12  WIN-SEC  4624 Type 10  adm_r.vance from IT-JMP02 to OPS-FILE02","Fri 09:30  SCAN     vuln scan of OPS-FILE02 from NOC-SCAN01"]},"widget":{"type":"fill","question":"Fill the chain summary with the two hop targets and the event count:","text":"Hop one reached ___ by remote desktop, hop two left that host toward ___ by network logon, and the cloud stage produced exactly ___ identity-changing event.","blanks":["OPS-FILE02","APP-ROUTE01","1"],"bank":["OPS-FILE02","APP-ROUTE01","1","2","0","IT-JMP02"]}},{"id":"e02","type":"decision","title":"Decision tree — the hop that two teams own","summary":"Purple-team authorisation overlaps a real-looking second hop.","scenario":"Friday 20:40. An authorised purple-team engagement is live (ticket PT-1142, end date next Friday). Their plan: SSH from a lab host to APP-GW01, then WinRM to APP-ROUTE01. Your monitoring shows the planned hops — plus one unplanned 4624 type 3 from APP-ROUTE01 into DB-FREIGHT01 under svc_routing, and a 7045 service install named 'svchostt' (double t) on DB-FREIGHT01 at 20:58. The purple team's lead is on a plane. Four steps.","question":"Work through the four decision steps for the overlapping activity:","hint":"Authorisation covers listed actions only; the double-t service is nobody's typo.","explanation":"Scope discipline: PT-1142 legitimises named hops, nothing else. The 'svchostt' install is mimicry — public reporting documents near-name services as a standard hiding trick — so the burden of proof flips to the owner. Containment is surgical to protect the authorised exercise, and the last step hands the case to IR, because an unattributed hop under exercise cover is precisely how real intrusions hide.\n\nAttacker view: exercise cover is the best cover there is; scope lines are the only fence. Defender view: containment that spares the authorised paths proves the fence actually works.","study":"Study engagement scoping, service-name mimicry and IR escalation criteria during live exercises.","steps":[{"label":"STEP 1 OF 4 — separate the streams","prompt":"PT-1142 authorises lab to APP-GW01 to APP-ROUTE01 over SSH then WinRM.","question":"Which attribution statement is defensible right now?","options":["The planned hops are authorised; the hop into DB-FREIGHT01 with service 'svchostt' is outside scope and unattributed","Everything is purple team because PT-1142 is active","Nothing is purple team because the lead is unreachable"],"correct":0,"why":"Scope is per-action, not per-engagement: the extra hop has no authorisation line, so it stays unattributed."},{"label":"STEP 2 OF 4 — read the artefact","prompt":"Service name 'svchostt' with double t installed at 20:58 on DB-FREIGHT01.","question":"What does the double-t spelling suggest?","options":["Deliberate mimicry of svchost to survive a glance — treat as hostile until proven otherwise","A harmless typo by the patch tool","A renderer glitch in the log pipeline"],"correct":0,"why":"Near-name mimicry is a documented hiding trick; the burden shifts to proving it benign."},{"label":"STEP 3 OF 4 — contain without burning the exercise","prompt":"The unplanned hop and service are real; the engagement is still live.","question":"Which action fits?","options":["Block APP-ROUTE01 to DB-FREIGHT01 and quarantine 'svchostt' only; let the planned hops continue","Stop the entire engagement and isolate everything","Change nothing until Monday's stand-up"],"correct":0,"why":"Surgical containment removes the unauthorised path while the authorised work continues."},{"label":"STEP 4 OF 4 — escalate","prompt":"Block is in place; purple lead still unreachable; service quarantined.","question":"Who must own the investigation from here?","options":["Escalate to IR as a possible real intrusion with PT-1142 noted as cover — do not wait for the lead","Close it and email the lead for Monday","Delete the quarantine to unblock the exercise"],"correct":0,"why":"Unauthorised persistence under an exercise window is exactly when you escalate rather than wait."}]},{"id":"e03","type":"fill","title":"Write the analytic's blanks","summary":"Complete the chained-indicator rule definition.","scenario":"Detection engineering drafts the family-level analytic: a remote interactive logon followed by rapid program-style logons onward. The spec template lost two numbers and a threshold when the wiki migration stripped formatting. Restore them: the logon type of the initial session, the type of the onward network logons, and the count of distinct onward hosts that triggers at medium severity instead of low.","question":"Restore the analytic spec with the three missing values:","hint":"The initial session is interactive-remote; the onward ones are not; three hosts beats a pairing.","explanation":"Type 10 opens the interactive beachhead; type 3 onward is how a program, not a person, spreads — the chain that defines lateral movement. Three distinct onward hosts within ten minutes keeps the rule above the noise floor of admin pairing (one-to-one) while catching sweeps. A threshold of 2 fires on routine admin pairs, 5 misses small pivots, and a 30-minute window lets slow scans through.","study":"Study chained-indicator analytics and threshold tuning for logon-type sequences.","text":"Fire when a 4624 logon type ___ is followed within 10 minutes by type ___ logons from the same source to ___ or more distinct onward hosts.","blanks":["10","3","3"],"bank":["10","3","5","2","30"]},{"id":"e04","type":"terminal","title":"Trace the pivot's login history","summary":"Show the newest 20 login records on the staging host.","scenario":"You are on APP-GW01, the SSH staging box from the week's chain. Before the forensic image lands you may run read-only commands, and the lead wants the login history first: the newest twenty records with hostnames as the system's own bookkeeping shows them. The lab shell knows the classic tools; do not touch the login-history file itself.","question":"Run the command that lists the newest 20 login records:","hint":"One tool owns login history; the number flag trims the list.","explanation":"last -n 20 reads the wtmp bookkeeping and prints the newest twenty records — here it extends the week's chain: j.petrov appears on APP-GW01 from WORKSTATION-44 and again from OPS-FILE02, meaning the pivot moved through the gateway. who and w show only present sessions, and journalctl needs unit flags you were not asked for. Truncating wtmp with rm or a redirect erases the very history the image is meant to confirm.","study":"Study wtmp and last, btmp and lastb, and what each preserves about SSH pivots.","prompt":"forensics@APP-GW01:~$","skill":"pivot-login-history","knownTools":["last","who","w","journalctl","ausearch"],"expected":"last -n 20","elements":[{"label":"the last login-history tool","any":["last"]},{"label":"the row limit -n 20","any":["-n 20"]}],"forbidden":[{"any":["rm /var/log/wtmp","> /var/log/wtmp","fuser -k"],"why":"Rewriting or truncating wtmp destroys the login history you were sent to preserve."}],"output":["j.petrov    pts/3  WORKSTATION-44  Tue 02:02 - 02:31  (00:29)","j.petrov    pts/4  OPS-FILE02      Tue 02:33 - 03:05  (00:32)","adm_r.vance pts/1  IT-JMP02        Thu 03:10 - 03:44  (00:34)","svc_backup  pts/2  BK-CTL01        Wed 11:00 - 11:04  (00:04)","wtmp begins Mon 01 06:00:02"]},{"id":"e05","type":"mcq","title":"Close the direct VM doors","summary":"Mitigate direct SSH/RDP to cloud VM interfaces (T1021.008).","scenario":"Meridian's cloud estate grew by forty VMs in a quarter, and the audit found seventeen reachable by SSH or RDP straight on their network interfaces — the ATT&CK T1021.008 pattern of connecting directly to cloud VMs. The platform team proposes four changes. Pick the one that removes the doors rather than locking them softly.","question":"Which proposal removes the direct-connection doors?","hint":"If there is no public address and a broker owns the path, the door is gone, not locked.","explanation":"Direct VM connections die when the VM has no public address and access is brokered through a bastion or jump service — the network path, not the password, is removed. Opening groups to the internet multiplies exposure; password rotation leaves the direct path open; instance size is irrelevant. ATT&CK lists disabling unneeded connection types as the direct mitigation for T1021.008.","study":"Study T1021.008 Direct Cloud VM Connections and bastion-style brokering.","options":["Bastion brokering plus no public IPs on NICs","Security groups opened to the entire internet","Weekly password rotation through consoles","Larger instance family with more memory"],"correct":0},{"id":"e06","type":"logview","title":"Find the real hop in scanner noise","summary":"Two sweeps and a patch job hide one true lateral hop.","scenario":"Thursday night on OPS-FILE02's perimeter: NOC-SCAN01 sweeps the subnet on 443 and 22, the patch tool PATCH-CTL01 opens WinRM to its hosts as it does every Thursday, and somewhere in the same window one workstation crosses a boundary it should never cross. The note for the morning needs the crossing ports in order, plus how many distinct WinRM targets make the patch baseline.","question":"Complete the morning note with the crossing ports and the baseline count:","hint":"The workstation rows are the anomaly; count the patch tool's distinct destinations.","explanation":"The patch baseline is five distinct WinRM targets (OPS-FILE02, APP-ROUTE01, DB-FREIGHT01, HR-FS11, FS-OPS03) — Thursday normal. The scanner rows on 443 and 22 are noise. WORKSTATION-19 first probed the database on 1433, then landed the desktop hop on 3389 — database recon then remote desktop, a boundary workstations never cross. 5985 is the patch port, and 6 is the classic miscount from double-reading DB-FREIGHT01's two rows.","study":"Study baseline-first hunting: count the sanctioned tool's targets before hunting outliers.","filterable":true,"log":{"header":["time","src","dst","dport"],"lines":["23:00:01  NOC-SCAN01     OPS-FILE02    443","23:00:19  NOC-SCAN01     APP-ROUTE01   22","23:04:02  PATCH-CTL01    OPS-FILE02    5985","23:04:11  PATCH-CTL01    APP-ROUTE01   5985","23:04:20  PATCH-CTL01    DB-FREIGHT01  5985","23:05:02  PATCH-CTL01    HR-FS11       5985","23:11:44  WORKSTATION-19 DB-FREIGHT01  1433","23:12:30  WORKSTATION-19 DB-FREIGHT01  3389","23:14:51  PATCH-CTL01    FS-OPS03      5985","23:20:07  NOC-SCAN01     HR-FS11       443"]},"widget":{"type":"fill","question":"Complete the morning note with the crossing ports and the baseline count:","text":"WORKSTATION-19 first probed the database on port ___, then landed the desktop hop on port ___, while the patch baseline counts ___ distinct WinRM targets.","blanks":["1433","3389","5"],"bank":["1433","3389","5","6","5985"]}},{"id":"e07","type":"multi","title":"Signatures of a pivot chain","summary":"Select the patterns that indicate multi-hop movement.","scenario":"The hunt review asks which candidate patterns truly indicate multi-hop pivoting rather than two unrelated daily events. Four of the six candidates qualify; two are ordinary operations. Choose the four that belong in the pivot report.","question":"Select every pattern that belongs in the pivot report:","hint":"Sanctioned tools with stable target lists are the opposite of pivoting.","explanation":"The four pivot patterns share one idea: the access itself is new and it chains — reused credentials with no ticket, an SSH-within-SSH proxy-style chain, a workstation-to-server desktop hop, and a staged key used from a second host. The patch controller's fixed five targets and a single office-hours admin session are daily operations; including them buries the report in noise and burns analyst trust.","study":"Study pivot signatures versus scheduled-job baselines across Windows and Linux.","options":["Same account on three hosts within twelve minutes, no ticket","SSH login that immediately spawns another SSH from the target","A type 10 hop from a user workstation into the server tier","New authorized_keys on a server, then root SSH from elsewhere","Patch controller opening WinRM to its five listed servers","One admin RDP to one server inside office hours"],"correct":[0,1,2,3]},{"id":"e08","type":"match","title":"Match pivot stage to signal","summary":"One card: which signal marks which pivot stage.","scenario":"CTI hands the hunt team a four-stage map of the week's intrusion: initial remote session, onward program-style movement, cloud console entry, and hypervisor-adjacent access. Each stage has exactly one matching signal in the table below. The match must be exact — the hunt report quotes it verbatim.","question":"Match each stage to its signal:","hint":"Interactive, programmatic, portal, virtualisation — in that order.","explanation":"Type 10 marks the interactive beachhead; type 3 en masse marks programmatic onward movement; ConsoleLogin with a fresh device id marks portal entry; vSphere API logins mark the virtualisation control plane. Swapping stages mislabels the narrative — the report's timeline hangs on these four anchors, and CTI maps them to T1021, T1021.007 and the virtualisation detections.","study":"Study stage naming in hunt reports and how each T1021 path leaves its anchor signal.","pairs":[{"left":"initial remote session","right":"4624 type 10 from WORKSTATION-44"},{"left":"onward program movement","right":"type 3 to five hosts with no ticket"},{"left":"cloud console entry","right":"ConsoleLogin from a new device id"},{"left":"hypervisor-adjacent access","right":"vSphere API login to the compute layer"}]},{"id":"e09","type":"decision","title":"Decision tree — shipping the logon-chain rule","summary":"From 300 alerts a day to one trusted analytic in four steps.","scenario":"Your draft rule — type 10 followed by type 3 to three or more hosts in ten minutes — fires 300 times a day across Meridian's estate. The patch controller alone accounts for 240. The manager wants it live by Monday; detection engineering wants it trusted by Friday. Four steps decide its fate.","question":"Work through the four decision steps for shipping the rule:","hint":"Measure, scope the exceptions, demand a consequence, then earn trust gradually.","explanation":"This is detection engineering as a chain: measurement first, because 300 a day is unshippable; scoped, dated allow-lists second, because forever-exemptions rot into blind spots; a consequence condition third, so the rule fires on movement with impact, not motion; monitored rollout last. Every step trades a little latency for trust — the currency that decides whether analysts read your alerts at all.\n\nAttacker view: noisy rules are free cover, because your hop drowns in the patch controller's noise. Defender view: precision is what makes the rule survivable in a busy queue.","study":"Study precision/recall trade-offs, allow-list decay and staged rule rollouts.","steps":[{"label":"STEP 1 OF 4 — measure","prompt":"300 alerts a day; 240 from one patch account; 55 from scanner pairs; 5 unexplained.","question":"Which measurement matters first for precision?","options":["Group the firings by account and source to split sanctioned mass from the unexplained residue","Count total alerts for the quarterly report","Disable the rule for a week and see who complains"],"correct":0,"why":"Per-account grouping turns 300 alerts into a ranked, explainable list."},{"label":"STEP 2 OF 4 — allow-list with expiry","prompt":"The patch account and scanner pair dominate; both are sanctioned.","question":"How is the allow-list written so it cannot rot?","options":["Scope by account, source and target set, and stamp every entry with a review date","Allow-list the patch account forever","Exclude all type 3 events globally"],"correct":0,"why":"Narrow scope plus expiry dates keeps the list from becoming a permanent blind spot."},{"label":"STEP 3 OF 4 — chain a second condition","prompt":"Five unexplained firings remain; none shows follow-on artefacts.","question":"Which upgrade cuts noise without losing signal?","options":["Require a follow-on indicator within 15 minutes: service install, new process chain or new local account","Add a second rule for type 5 logons","Raise the threshold to ten hosts"],"correct":0,"why":"A consequence requirement keeps the rule aimed at movement that actually did something."},{"label":"STEP 4 OF 4 — rollout","prompt":"Tuned rule now fires 0.4 times a day, all explainable.","question":"How does it go live?","options":["Deploy in alert-only mode for two weeks with daily review, then promote to the incident queue","Deploy straight to paging the CISO","Keep it in draft until an incident forces the issue"],"correct":0,"why":"A monitored shakedown proves precision before the rule earns the power to page anyone."}]},{"id":"e10","type":"fill","title":"Complete the staging artefact note","summary":"Sysmon file-create id and the share that carried the tool.","scenario":"The Friday image of DB-FREIGHT01 shows the staging artefact the morning note described: a small executable landing in the Windows folder minutes after a network logon. Your note must cite the Sysmon event id that proves the file creation and the hidden share the T1021.002 pattern stages through. Two gaps, two exact values.","question":"Complete the staging note with the two exact values:","hint":"The file-create id is small; the share ends with a dollar sign and spells admin.","explanation":"Sysmon event 11 is FileCreate — the artefact that proves a file landed, timestamped, where. ADMIN$ is the hidden administrative share the T1021.002 pattern stages binaries through before service execution. Event 3 is a network connection (delivery context, not the file), SYSVOL carries domain policy rather than attacker tools, and type 10 belongs to desktop sessions this chain never opened.","study":"Study Sysmon event 11 and pairing it with share-access and service-install events.","text":"Sysmon event ___ recorded the file creation under C:\\Windows\\, and the staged delivery rode the hidden ___ share named by T1021.002.","blanks":["11","ADMIN$"],"bank":["11","ADMIN$","3","SYSVOL","10"]},{"id":"e11","type":"terminal","title":"Check the auditor's own identity","summary":"Prove which identity your cloud audit session uses.","scenario":"You are auditing Meridian's cloud trail after the j.petrov access-key event. Rule one of cloud forensics: know exactly who you are before you query anything, so your own rows can be excluded later. The lab shell knows the cloud CLI read-only toolset. Return the calling identity for the audit session, and touch nothing — no user changes, no forced deletions.","question":"Run the command that returns the calling identity:","hint":"The security token service answers one question: who am I right now.","explanation":"aws sts get-caller-identity returns the account, user or assumed role behind the current session — the reference you subtract from every later CloudTrail query so your own audit rows vanish from the picture. Delete-style IAM calls mutate the environment under investigation; an auditor's first session must be read-only or the trail loses integrity.","study":"Study STS caller identity and keeping forensic cloud sessions read-only.","prompt":"audit@OPS-JMP02:~$","skill":"cloud-identity-audit","knownTools":["aws","az","gcloud","curl"],"expected":"aws sts get-caller-identity","elements":[{"label":"the aws CLI","any":["aws"]},{"label":"the sts service","any":["sts"]},{"label":"the get-caller-identity call","any":["get-caller-identity"]}],"forbidden":[{"any":["aws iam delete-user","delete-access-key","--force"],"why":"Deleting users or keys during an audit mutates the trail you came to read."}],"output":["{","  \"UserId\": \"AIDA4444EXAMPLE:audit-session-77\",","  \"Account\": \"444455556666\",","  \"Arn\": \"arn:aws:sts::444455556666:assumed-role/AuditReadOnly\"","}"]},{"id":"e12","type":"mcq","title":"Six servers, a ticket, two extras","summary":"The patch ticket lists four servers; six got sessions.","scenario":"03:00 — mstsc sessions connect from WORKSTATION-19 to six servers in the ops tier under adm_r.vance. Ticket NIGHTPATCH-88 exists, is signed by the ops lead, and covers four servers. Two of the six are not on the ticket and never had remote desktop sessions from that workstation before. Everything else about the sessions looks routine: same window, same account, short durations, no persistence artefacts yet. The patch team confirms the four listed servers only.","question":"Which handling fits the conflicting evidence?","hint":"The ticket is evidence for exactly four servers — the other two have no cover.","explanation":"The ticket legitimises four sessions; the two extras inherit no cover and break the workstation's baseline. Partial escalation is the honest reading: the sanctioned window keeps running, IR takes the two unexplained targets, and persistence checks on those two decide the next move. Closing all six rubber-stamps a possible intrusion; isolating six production servers over a ticket mismatch burns uptime the evidence has not earned yet.","study":"Study ticket-bound attribution and partial-escalation handling in live windows.","options":["Sanction the four; escalate the two extras to IR","Close all six sessions as sanctioned by the ticket","Isolate all six and page the CISO immediately","Rebuild WORKSTATION-19 before shift end"],"correct":0},{"id":"e13","type":"multi","title":"Cloud-services movement signals","summary":"Select the T1021.007-aligned signals in the tenant trail.","scenario":"The tenant trail covers a loud week: MFA storms, token refreshes, a sandbox test, and somewhere inside it a genuine cloud-services lateral movement consistent with T1021.007 — valid account, portal access, then movement through cloud-native paths. Choose every signal that belongs in the T1021.007 entry of the report.","question":"Select every signal that belongs in the T1021.007 entry:","hint":"Movement means the account reached somewhere new and kept going.","explanation":"ConsoleLogin plus role chaining, and a fresh key used from an unfamiliar subnet, are movement: an identity reached new territory through cloud-native paths — the T1021.007 shape. Failed MFA storms are authentication noise (annoying, not movement), and a scheduled SAML renewal is lifecycle plumbing. The entry earns its place when an account crosses a boundary it has never crossed before.","study":"Study T1021.007 Cloud Services and separating authentication noise from movement.","options":["ConsoleLogin from a new device plus role chaining","Access key created and used from an unfamiliar subnet","Seven failed MFA prompts from the payroll account","The marketing SAML token renewed on schedule"],"correct":[0,1]},{"id":"e14","type":"logview","title":"Order the process chain","summary":"Read the EDR events and name the hostile chain's order.","scenario":"EDR reconstructed two hosts' activity for Saturday morning. The table lists, in raw time order, the relevant creations. Read carefully: one creation is the patch tool's nightly routine. The rest form a chain: remote session tool, service execution, then a staging write, then persistence. Name the correct order for the timeline.","question":"Which order describes the hostile chain?","hint":"The routine rows bookend the window; inside it, follow the timestamps.","explanation":"Time order: mstsc from the workstation, the type 10 logon, PSEXESVC spawning under services.exe, the staged route.dll via Sysmon 11, its install, then the persistence service. The listed order matches; the patch rows only bookend the window. Any other order contradicts the timestamps — and the staged file arriving after service execution proves delivery by the service, not by hand.","study":"Study EDR event reading: parent, child, and timestamp discipline.","filterable":true,"log":{"header":["time","host","event"],"lines":["03:00:01  OPS-FILE02     PATCH-CTL01 opened WinRM session (routine)","03:02:10  WORKSTATION-19 mstsc.exe connected to DB-FREIGHT01","03:02:41  DB-FREIGHT01   4624 type 10 for adm_r.vance from WORKSTATION-19","03:04:15  DB-FREIGHT01   services.exe spawned PSEXESVC.exe","03:05:02  DB-FREIGHT01   Sysmon 11: C:\\Windows\\route.dll written","03:06:44  DB-FREIGHT01   PSEXESVC spawned cmd.exe /c route.dll install","03:11:20  DB-FREIGHT01   new service 'routehelper' registered","03:20:05  OPS-FILE02     PATCH-CTL01 session closed (routine)"]},"widget":{"type":"mcq","question":"Which order describes the hostile chain?","options":["mstsc session, then service execution, then staged file, then persistence service","Patch session, staged file, desktop session, service execution","Staged file, persistence service, mstsc session, patch session","No hostile chain appears in the events"],"correct":0}},{"id":"e15","type":"order","title":"Order the forensic workflow","summary":"From volatile evidence to the defended timeline.","scenario":"IR hands you the Saturday chain and asks for the investigation workflow order that will survive legal review. Five cards: freeze what fades, gather with custody intact, anchor events in time, walk the hops in order, then brief with the artefact list attached. Misorder any step and the defence counsel smiles.","question":"Arrange the five forensic workflow steps in order:","hint":"What fades first gets frozen first; the brief comes after the hops hold up.","explanation":"Volatility rules the start — RAM and live sessions die first, so they are preserved before anything else. Collection then happens with custody records so every artefact survives challenge. The master timeline anchors events across sources; walking the hops against it corroborates or kills each inference; the brief comes last with the manifest attached. Briefing before corroboration is how wrong timelines become public.","study":"Study evidence volatility ordering and chain-of-custody discipline.","items":["Preserve volatile evidence and images before anything rotates","Collect logs and artefacts with chain-of-custody records","Build the master timeline across Windows, Linux and cloud","Walk each pivot hop against the timeline for corroboration","Brief stakeholders with the timeline and artefact manifest"]},{"id":"e16","type":"decision","title":"Decision tree — the 02:00 sweep that fits","summary":"A weekly pattern that looks hostile and measures benign: four steps.","scenario":"Tuesday 02:00 — alert: one account opened SMB to 310 workstations within eight minutes. The account is svc_configpush, the source is CFG-CTL01, and the pattern has fired every Tuesday at 02:00 for eleven months (the rule is new; the behaviour is not). Tonight one thing differs: the sweep also touched twelve hosts in the guest Wi-Fi VLAN, which it never did before. Four steps.","question":"Work through the four decision steps for the Tuesday sweep:","hint":"The bulk is eleven months old; only tonight's delta is a case — and reach without change is reconnaissance.","explanation":"The sweep is benign-looks-alarming at scale; the delta is the case, and the case ends at 'do nothing further yet' once no consequence appears and the cause is a confirmed misconfiguration. The durable fixes are the dated exception and the boundary alert — not a forever-tune that blinds the rule to the guest VLAN. This is the act-versus-escalate lesson: act on consequence, document the rest.","study":"Study reach-versus-consequence analytics and dated exception handling.","steps":[{"label":"STEP 1 OF 4 — baseline","prompt":"310 workstations on 445 from CFG-CTL01 under svc_configpush, Tuesdays 02:00, eleven months.","question":"What does the baseline tell you about the bulk?","options":["The bulk is the sanctioned config push; only tonight's delta needs eyes","The bulk is hostile because 310 is a big number","The rule should fire on all 310 until someone complains"],"correct":0,"why":"Eleven months of identical rhythm plus a named tool account is baseline, and the delta is the case."},{"label":"STEP 2 OF 4 — the delta","prompt":"Twelve guest-Wi-Fi hosts appear tonight for the first time.","question":"Which check explains the delta fastest?","options":["Ask network ops whether the guest VLAN was re-pooled into the management scope this week","Assume the sweep tool auto-discovered new scopes safely","Ignore the delta because the bulk is sanctioned"],"correct":0,"why":"A scope change is the mundane explanation to rule out before hostile intent is assumed."},{"label":"STEP 3 OF 4 — consequence check","prompt":"No scope change was approved; the twelve hosts were reached anyway.","question":"What upgrades this from odd to incident?","options":["Any write or execution on those twelve hosts after the sweep, such as new services or files","The hosts being online during the sweep","A helpdesk ticket mentioning slow Wi-Fi"],"correct":0,"why":"Movement matters when it changes something; reach alone is reconnaissance."},{"label":"STEP 4 OF 4 — decide","prompt":"No writes or execution on the twelve; a network misconfiguration is confirmed as the cause.","question":"Which close-out fits?","options":["Keep hosts online, fix the scope error, log the exception with an expiry, and alert on future guest-VLAN touch","Isolate the twelve hosts overnight anyway","Tune the rule to ignore the guest VLAN forever"],"correct":0,"why":"Do nothing further yet: the exception is documented and dated, and the boundary gets a watchdog."}]},{"id":"e17","type":"match","title":"Match artefact to meaning","summary":"Four forensic artefacts from the week, four meanings.","scenario":"The IR binder collects four artefacts from the week's chain. Each one answers a different question, and the report cites each by name. The pairs must be exact: two artefacts prove what happened on Windows hosts, one proves a credential pattern, one proves what a human saw on a screen.","question":"Match each artefact to its meaning:","hint":"Two artefacts are files, one is an event pattern, one is ticket telemetry.","explanation":"Prefetch proves execution of the PsExec service binary on that host; a type 3 with no type 10 anywhere proves credentials travelled without a desktop; a 4769 burst marks service-ticket sweeping; fresh bitmap cache proves someone watched a screen — the human-behind-the-keyboard artefact. Each fills a gap the others cannot, which is why the binder cites all four.","study":"Study execution, credential, ticket and viewing artefacts for remote-services cases.","pairs":[{"left":"Prefetch\\PSEXESVC.EXE entries","right":"The tool executed on the host"},{"left":"4624 type 3 with no type 10","right":"Credentials used over the network only"},{"left":"4769 ticket burst from one account","right":"Kerberos service-ticket sweep"},{"left":"updated RDP bitmap cache files","right":"Someone viewed a remote desktop screen"}]},{"id":"e18","type":"fill","title":"Complete the reach-reduction line","summary":"PAW and LAPS in one sentence for the board pack.","scenario":"The board pack needs one sentence that explains how the reach of stolen credentials shrinks. Two names must land exactly: the workstation type reserved for privileged work, and the Microsoft tool that makes every local administrator password unique per host. Get both right and the sentence carries the whole strategy.","question":"Complete the reach-reduction sentence:","hint":"One is a machine type, one is a password-automation tool.","explanation":"A PAW — privileged access workstation — is where tier 0 and tier 1 credentials are allowed to exist at all; LAPS rotates a unique local admin password per host so a single stolen hash cannot replay across the fleet. VPN is remote access, SCCM pushes software, and MFA is additive here but does not answer the reuse question. Together PAW plus LAPS breaks the reuse path that every T1021 procedure feeds on.","study":"Study privileged access workstations and LAPS as the reach-reduction baseline.","text":"Privileged staff work only from a ___ reserved for administration, and ___ gives every workstation a unique, rotated local admin password, so one stolen password cannot walk the fleet.","blanks":["PAW","LAPS"],"bank":["PAW","LAPS","VPN","SCCM","MFA"]}];

/* ==== utils ==== */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function norm(s){
  return String(s == null ? "" : s).toLowerCase().replace(/\s+/g," ").replace(/[.,;:!]+$/,"").trim();
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function fmt1(n){ return (Math.round(n * 100) / 100).toFixed(1); }
function wordCount(s){ return String(s || "").split(/\s+/).filter(Boolean).length; }
function $(id){ return document.getElementById(id); }
function byClass(root, cls){ return root.getElementsByClassName(cls); }

/* ==== timer ==== */
function setTimerState(next){
  var now = Date.now();
  if(S.tStateAt != null){
    var dt = (now - S.tStateAt) / 1000;
    if(S.tState === "PAUSED_MANUAL") S.pauseManual += dt;
    if(S.tState === "PAUSED_AUTO_CHECK") S.pauseAutoCheck += dt;
  }
  S.tState = next;
  S.tStateAt = now;
  updateHeader();
}
setInterval(function(){
  if(S.tState === "RUNNING"){
    S.remaining -= 1;
    S.elapsed += 1;
    if(S.remaining <= 0){
      S.remaining = 0;
      updateClock();
      finish();
      return;
    }
    updateClock();
  }
}, 1000);
function updateClock(){ var c = $("tb-clock"); if(c) c.textContent = fmtClock(S.remaining); }

}

/* ==== postMessage integration ==== */
window.addEventListener("message", function(ev){
  var d = ev.data;
  if(!d || typeof d !== "object") return;
  if(d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT"){
    S.init = d;
    var slot = $("candline");
    if(slot && d.username){
      slot.textContent = "Candidate: " + d.username + (d.country ? " · " + d.country : "");
      slot.style.display = "block";
    }
  }
});
function postScore(){
  if(S.scorePosted) return;
  S.scorePosted = true;
  var rounded = Math.round(S.score);
  var total = 0, i;
  for(i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null) total++;
  }
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var msg = {
    type: "CYBERPULSE_SCORE",
    topicId: META.topicId,
    batch: META.batch,
    score: rounded,
    total: total,
    percent: percent,
    passed: passed
  };
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage(msg, location.origin);
    }
  }catch(e){ /* standalone file:// — no parent handshake */ }
}

/* ==== answer defaults ==== */
function defaultAnswer(ex){
  var i, d;
  switch(ex.type){
    case "mcq": return { sel: -1 };
    case "multi": return { sel: [] };
    case "match":
      d = []; for(i = 0; i < ex.pairs.length; i++) d.push(-1); return { assign: d };
    case "order":
      d = []; for(i = 0; i < ex.items.length; i++) d.push(i);
      return { seq: shuffle(d) };
    case "fill":
      d = []; for(i = 0; i < ex.blanks.length; i++) d.push(""); return { vals: d };
    case "terminal": return { cmd: "" };
    case "logview": return { w: defaultAnswer(ex.widget) };
    case "decision":
      d = []; for(i = 0; i < ex.steps.length; i++) d.push(-1); return { steps: d, cursor: 0 };
  }
  return {};
}
function ensureAnswer(ex, i){
  if(S.answers[i] == null) S.answers[i] = defaultAnswer(ex);
  return S.answers[i];
}

function renderByType(ex, area, i, lock, res){

function renderChoice(ex, root, ans, lock, res, isMulti, path){
  var correct = isMulti ? ex.correct : [ex.correct];
  ex.options.forEach(function(opt, oi){
    var chosen = isMulti ? ans.sel.indexOf(oi) !== -1 : ans.sel === oi;
    var mark = "", cls = "";
    if(!lock){
      if(chosen){ mark = isMulti ? "☑" : "◉"; cls = "sel"; }
    } else {
      var isCorr = correct.indexOf(oi) !== -1;
      if(isCorr){ mark = "✓"; cls = "correct"; }
      else if(chosen){ mark = "✗"; cls = "wrong"; }
      else { cls = "dim"; }
    }
    root.insertAdjacentHTML("beforeend", optionRow(opt, oi, chosen, mark, cls));
  });
  var btns = byClass(root, "opt");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      btn.addEventListener("click", function(){
        if(lock) return;
        var oi = parseInt(btn.getAttribute("data-i"), 10);
        if(isMulti){
          var p = ans.sel.indexOf(oi);
          if(p === -1) ans.sel.push(oi); else ans.sel.splice(p, 1);
          btn.classList.toggle("sel");
          btn.setAttribute("aria-pressed", btn.classList.contains("sel") ? "true" : "false");
          btn.querySelector(".mark").textContent = btn.classList.contains("sel") ? "☑" : "";
        } else {
          ans.sel = oi;
          for(var z = 0; z < btns.length; z++){
            btns[z].classList.remove("sel");
            btns[z].setAttribute("aria-pressed", "false");
            var mk = btns[z].querySelector(".mark"); if(mk) mk.textContent = "";
          }
          btn.classList.add("sel");
          btn.setAttribute("aria-pressed", "true");
          btn.querySelector(".mark").textContent = "◉";
        }
      });
    })(btns[b]);
  }
}
function renderMatch(ex, root, ans, lock, res){
  var n = ex.pairs.length;
  var chipSel = -1;
  var html = '<div class="mgrid"><div class="mcol"><h4>Items</h4>';
  for(var z = 0; z < n; z++){
    html += '<div class="mrow"><div class="mleft">' + esc(ex.pairs[z].left) + '</div>' +
            '<button type="button" class="mzone" data-z="' + z + '" aria-label="Assigned value for ' + esc(ex.pairs[z].left) + '">— drop here —</button></div>';
  }
  html += '</div><div class="mbank"><h4>Answer bank</h4>';
  ex.pairs.forEach(function(pr, ri){
    html += '<button type="button" class="mchip" draggable="true" data-r="' + ri + '">' + esc(pr.right) + "</button>";
  });
  html += '</div></div><p class="mhintline">Click a bank item, then click a drop zone — or drag the item onto a zone. Click a filled zone to clear it.</p>';
  root.innerHTML = html;
  var zones = byClass(root, "mzone");
  var chips = byClass(root, "mchip");
  function paint(){
    for(var z = 0; z < n; z++){
      var zz = zones[z];
      var v = ans.assign[z];
      if(v === -1){
        zz.textContent = "— drop here —";
        zz.classList.remove("filled", "correct", "wrong");
      } else {
        zz.textContent = ex.pairs[v].right;
        zz.classList.add("filled");
        if(lock){
          zz.classList.remove("wrong", "correct");
          zz.classList.add(v === z ? "correct" : "wrong");
        }
      }
    }
    for(var c = 0; c < chips.length; c++){
      var used = ans.assign.indexOf(c) !== -1;
      chips[c].classList.toggle("used", used);
      if(used) chips[c].classList.remove("selchip");
    }
  }
  function assign(z, r){
    if(r === -1) return;
    for(var k = 0; k < n; k++){ if(ans.assign[k] === r) ans.assign[k] = -1; }
    ans.assign[z] = r;
    chipSel = -1;
    paint();
  }
  for(var zi = 0; zi < zones.length; zi++){
    (function(z){
      var zz = zones[z];
      zz.addEventListener("click", function(){
        if(lock) return;
        if(chipSel !== -1) assign(z, chipSel);
        else if(ans.assign[z] !== -1){ ans.assign[z] = -1; paint(); }
      });
      zz.addEventListener("dragover", function(e){ if(!lock){ e.preventDefault(); zz.classList.add("dragover"); } });
      zz.addEventListener("dragleave", function(){ zz.classList.remove("dragover"); });
      zz.addEventListener("drop", function(e){
        e.preventDefault(); zz.classList.remove("dragover");
        if(lock) return;
        var r = parseInt(e.dataTransfer.getData("text/plain"), 10);
        if(!isNaN(r)) assign(z, r);
      });
    })(zi);
  }
  for(var ci = 0; ci < chips.length; ci++){
    (function(c){
      var cc = chips[c];
      cc.addEventListener("click", function(){
        if(lock) return;
        if(chipSel === c){ chipSel = -1; cc.classList.remove("selchip"); }
        else {
          chipSel = c;
          for(var k = 0; k < chips.length; k++) chips[k].classList.remove("selchip");
          cc.classList.add("selchip");
        }
      });
      cc.addEventListener("dragstart", function(e){
        e.dataTransfer.setData("text/plain", String(c));
        e.dataTransfer.effectAllowed = "copy";
      });
    })(ci);
  }
  paint();
}
function renderOrder(ex, root, ans, lock, res){
  root.innerHTML = '<div class="obank"><h4>Steps — put them in the correct order</h4><ol class="ordlist"></ol>' +
    '<p class="mhintline">Drag a step onto another step, or use ▲ / ▼.</p></div>';
  var list = root.querySelector(".ordlist");
  function paint(){
    list.innerHTML = "";
    ans.seq.forEach(function(itemIdx, pos){
      var li = document.createElement("li");
      li.className = "orditem";
      li.setAttribute("draggable", "true");
      li.setAttribute("data-pos", String(pos));
      var mark = "";
      if(lock) mark = itemIdx === pos ? " ✓" : "";
      li.innerHTML = '<span class="num">' + (pos + 1) + '</span><span class="txt">' + esc(ex.items[itemIdx]) + mark + "</span>" +
        '<span class="ordbtns"><button type="button" data-mv="up" aria-label="Move up" ' + (lock ? "disabled" : "") + ">▲</button>" +
        '<button type="button" data-mv="down" aria-label="Move down" ' + (lock ? "disabled" : "") + ">▼</button></span>";
      if(lock) li.classList.add(itemIdx === pos ? "correct" : "wrong");
      list.appendChild(li);
      li.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", String(pos)); });
      li.addEventListener("dragover", function(e){ if(!lock) e.preventDefault(); });
      li.addEventListener("drop", function(e){
        e.preventDefault();
        if(lock) return;
        var from = parseInt(e.dataTransfer.getData("text/plain"), 10);
        var to = parseInt(li.getAttribute("data-pos"), 10);
        if(!isNaN(from) && !isNaN(to) && from !== to) move(from, to);
      });
    });
    var btns = list.querySelectorAll("button[data-mv]");
    for(var b = 0; b < btns.length; b++){
      (function(btn){
        btn.addEventListener("click", function(){
          if(lock) return;
          var li = btn.closest(".orditem");
          var pos = parseInt(li.getAttribute("data-pos"), 10);
          var dir = btn.getAttribute("data-mv") === "up" ? pos - 1 : pos + 1;
          if(dir < 0 || dir >= ans.seq.length) return;
          move(pos, dir);
        });
      })(btns[b]);
    }
  }
  function move(from, to){
    var it = ans.seq.splice(from, 1)[0];
    ans.seq.splice(to, 0, it);
    paint();
  }
  paint();
}

    var rec = ans.hist[ans.hist.length - 1];

    var low = cmd.toLowerCase();

    (ex.forbidden || []).forEach(function(f){
      for(var v = 0; v < f.any.length; v++){

      }

      rec.out.push({ txt: "⚠ DANGEROUS — NEAR MISS: " + danger.why, cls: "danger" });
      printLine("⚠ DANGEROUS — NEAR MISS: " + danger.why, "tl-danger");

        rec.out.push({ txt: msg, cls: "dim" });

      }
    }
    inp.value = "";
  });
