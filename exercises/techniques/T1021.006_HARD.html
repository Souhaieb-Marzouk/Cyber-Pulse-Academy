<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.png" type="image/png">
<title>T1021.006 Windows Remote Management — HARD</title>
<style>
:root{
  --bg-page:#070c12;
  --bg-panel:#0d141d;
  --bg-surface:#111a26;
  --bg-surface-2:#0a111a;
  --bg-elev:#172335;
  --ink:#e9eff7;
  --ink-dim:#a9b9cb;
  --ink-faint:#8497ab;
  --line:#1f2b3c;
  --line-soft:#182331;
  --blue:#4aa8e8;   --blue-soft:rgba(74,168,232,.13);
  --amber:#e6aa3c;  --amber-soft:rgba(230,170,60,.13);
  --green:#41c07f;  --green-soft:rgba(65,192,127,.13);
  --red:#ef5a6a;    --red-soft:rgba(239,90,106,.15);
  --sev-easy:#41c07f;
  --sev-medium:#e6aa3c;
  --sev-hard:#f0813c;
  --sev-extreme:#ef5a6a;
  --focus:#4aa8e8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-page);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1 0 auto;width:100%;max-width:980px;margin:0 auto;padding:20px 16px 40px}
.foot{flex-shrink:0;margin-top:auto;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--ink-faint);font-size:12.5px;background:var(--bg-panel)}
.foot b{color:var(--ink-dim);letter-spacing:.08em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-surface-2)}
::-webkit-scrollbar-thumb{background:#24344b;border-radius:6px;border:2px solid var(--bg-surface-2)}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(8,13,20,.94);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.14em;font-size:12.5px;color:var(--green)}
.brand small{color:var(--ink-faint);letter-spacing:.05em;font-weight:600}
.tb-sep{width:1px;height:22px;background:var(--line)}
.tb-title{font-weight:700;font-size:13.5px;color:var(--ink-dim);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stat{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:13px;font-weight:600;background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:32px}
.tb-stat .ic{font-size:13px}
.tb-stat.timer{font-family:var(--mono);color:var(--ink)}
.tb-state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px;border:1px solid}
.tb-state.manual{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.tb-state.autocheck{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-surface);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.tb-btn:hover:not(:disabled){border-color:var(--blue)}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}
.tb-btn.hint{color:var(--amber)}
.tb-btn.skip{color:var(--ink-dim)}
.prog{height:3px;background:var(--line-soft)}
.prog i{display:block;height:100%;background:var(--green);width:0%;transition:width .25s}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 12px;color:#08110b}
.badge::before{content:"●";font-size:9px}
.sev-EASY{background:var(--sev-easy)}
.sev-MEDIUM{background:var(--sev-medium)}
.sev-HARD{background:var(--sev-hard)}
.sev-EXTREMELY_HARD{background:var(--sev-extreme);color:#160407}
.otype{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg-surface)}
/* ---------- intro ---------- */
.intro-head{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--bg-panel),var(--bg-surface-2));padding:26px 26px 20px;margin-bottom:16px}
.intro-head h1{margin:8px 0 4px;font-size:26px;line-height:1.25}
.intro-head .sub{color:var(--ink-dim);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-dim);background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:34px}
.chip .ic{color:var(--ink-faint)}
.cand{margin-top:12px;font-size:13px;color:var(--ink-faint)}
.intro-sec{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;background:var(--bg-panel);padding:18px 22px;margin-bottom:14px}
.intro-sec.learn{border-left-color:var(--blue)}
.intro-sec.keys{border-left-color:var(--amber)}
.intro-sec.how{border-left-color:var(--green)}
.intro-sec h2{margin:0 0 10px;font-size:15px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.intro-sec.learn p{color:var(--ink-dim);margin:0 0 10px}
.intro-sec.learn p:last-child{margin-bottom:0}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kw-card{background:var(--bg-surface);border:1px solid var(--line-soft);border-radius:10px;padding:10px 14px}
.kw-card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.kw-card ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:13.5px}
.kw-card li{margin:2px 0}
.rules{margin:0;padding:0;list-style:none}
.rules li{position:relative;padding:7px 0 7px 26px;color:var(--ink-dim);font-size:14px}
.rules li::before{content:"▸";position:absolute;left:4px;color:var(--green)}
.rules li .dim{color:var(--ink-faint)}
/* ---------- exercise card ---------- */
.excard{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--bg-panel);border:1px solid var(--line);border-left:4px solid var(--blk,var(--blue));border-radius:12px;padding:16px 20px}
.blk-scenario{--blk:var(--blue)}
.blk-question{--blk:var(--amber)}
.blk-answer{--blk:var(--green)}
.blk-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--blk,var(--ink));margin-bottom:10px}
.blk-label .dot{width:8px;height:8px;border-radius:50%;background:var(--blk,var(--ink))}
.ex-title{margin:0 0 8px;font-size:16.5px}
.summary{color:var(--ink-faint);font-size:13.5px;font-style:italic;margin:0 0 8px}
.showfull{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;min-height:32px}
.scen-body p{margin:0 0 10px;color:var(--ink-dim)}
.scen-body p:last-child{margin-bottom:0}
details.artef{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin:10px 0 0}
details.artef summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--blue);user-select:none;min-height:40px;display:flex;align-items:center}
details.artef .artbody{padding:0 14px 12px}
.mono{font-family:var(--mono);font-size:13px;line-height:1.5;color:#c8d8e6;background:var(--bg-surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:0}
table.attable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:0}
table.attable th{background:var(--bg-elev);color:var(--ink);text-align:left}
table.attable th,table.attable td{border:1px solid var(--line-soft);padding:6px 10px;color:var(--ink-dim)}
.q-text{margin:0;font-weight:700;font-size:16px;color:var(--ink)}
/* ---------- options ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;min-height:44px;cursor:pointer;color:var(--ink);font-size:14.5px;font-family:var(--sans);margin:0 0 8px}
.opt:last-child{margin-bottom:0}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.dim{opacity:.5}
.opt .mark{font-weight:800;flex-shrink:0}
/* ---------- match ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol h4,.obank h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mleft{flex:1;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;min-height:44px;display:flex;align-items:center}
.mzone{flex:1;background:var(--bg-surface-2);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;min-height:44px;color:var(--ink-faint);font-size:13.5px;cursor:pointer;text-align:left;font-family:var(--sans)}
.mzone.filled{border-style:solid;border-color:var(--blue);color:var(--ink)}
.mzone.dragover{border-color:var(--green)}
.mzone.correct{border-color:var(--green);background:var(--green-soft)}
.mzone.wrong{border-color:var(--red);background:var(--red-soft)}
.mbank{display:flex;flex-direction:column}
.mchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;margin-bottom:8px;cursor:grab;color:var(--ink);font-size:13.5px;text-align:left;font-family:var(--sans)}
.mchip:disabled{cursor:default;opacity:.5}
.mchip.selchip{border-color:var(--amber);background:var(--amber-soft)}
.mchip.used{opacity:.35}
.mhintline{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- order ---------- */
.ordlist{list-style:none;margin:0;padding:0;counter-reset:ord}
.orditem{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.orditem.dragover{border-color:var(--green)}
.orditem .num{font-family:var(--mono);color:var(--amber);font-weight:700;min-width:22px;text-align:center}
.orditem .txt{flex:1;font-size:14px}
.orditem.correct{border-color:var(--green)}
.orditem.wrong{border-color:var(--red)}
.ordbtns{display:flex;gap:4px}
.ordbtns button{min-width:34px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);cursor:pointer;font-size:14px}
.ordbtns button:hover{border-color:var(--blue)}
/* ---------- fill ---------- */
.fillwrap{font-size:15.5px;color:var(--ink-dim);line-height:2.1;white-space:pre-wrap}
.fillin{font-family:var(--mono);font-size:13.5px;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 10px;min-height:38px;width:170px;margin:0 3px}
.fillin:focus{border-color:var(--blue);outline:none}
.fillin.correct{border-color:var(--green)}
.fillin.wrong{border-color:var(--red)}
.fbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fchip{background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:38px;font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer}
.fchip:hover{border-color:var(--amber)}
/* ---------- terminal ---------- */
.term{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term-bar{display:flex;align-items:center;gap:8px;background:var(--bg-elev);padding:8px 12px;font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.term-bar .dots{letter-spacing:3px;color:var(--red)}
.term-out{font-family:var(--mono);font-size:13px;line-height:1.55;color:#c8d8e6;padding:12px 14px;min-height:130px;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term-out .tl-dim{color:var(--ink-faint)}
.term-out .tl-danger{color:var(--red);font-weight:700}
.term-out .tl-echo{color:var(--ink)}
.term-line{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding:10px 14px}
.term-prompt{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:700;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;color:var(--ink);font-family:var(--mono);font-size:13px;min-height:34px}
.term-in:focus{outline:none}
details.syntax{border:1px solid var(--line-soft);border-radius:10px;background:var(--bg-surface-2);margin-top:10px}
details.syntax summary{cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--amber);min-height:40px;display:flex;align-items:center}
details.syntax .artbody{padding:0 14px 12px}
/* ---------- logview ---------- */
.logpanel{background:var(--bg-surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log-tools{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-elev);border-bottom:1px solid var(--line-soft)}
.logfilter{flex:1;background:var(--bg-surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 12px;min-height:38px}
.logfilter:focus{border-color:var(--blue);outline:none}
.log-count{font-size:12px;color:var(--ink-faint);font-family:var(--mono);white-space:nowrap}
.loglines{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#bccfe0;padding:12px 14px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.loglines mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px}
.wtitle{font-weight:700;margin:14px 0 10px;color:var(--ink)}
/* ---------- decision ---------- */
.dstep{background:var(--bg-surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.dstep.locked{opacity:.9}
.dlabel{display:inline-flex;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue);border-radius:6px;padding:3px 9px;margin-bottom:8px}
.dprompt{font-family:var(--mono);font-size:13px;color:var(--ink-dim);background:var(--bg-surface-2);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 10px;white-space:pre-wrap}
.dq{font-weight:700;margin:0 0 10px}
.drecorded{color:var(--ink-faint);font-size:13px;margin-top:8px}
.dwhy{font-size:13.5px;color:var(--ink-dim);background:var(--bg-surface-2);border-radius:8px;padding:9px 12px;margin-top:8px}
/* ---------- hint ---------- */
.hintbox{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin-top:12px;color:var(--ink-dim)}
.hintbox .hb{color:var(--amber);font-weight:800;font-size:12px;letter-spacing:.1em;display:block;margin-bottom:4px}
.penaltynote{color:var(--ink-faint);font-size:12.5px;margin-top:4px}
/* ---------- feedback ---------- */
.fb{border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.fb.ok{border-color:var(--green)}
.fb.bad{border-color:var(--red)}
.fb.part{border-color:var(--amber)}
.fb-head{display:flex;align-items:center;gap:10px;padding:12px 18px;font-weight:800;font-size:15px;letter-spacing:.03em}
.fb.ok .fb-head{background:var(--green-soft);color:var(--green)}
.fb.bad .fb-head{background:var(--red-soft);color:var(--red)}
.fb.part .fb-head{background:var(--amber-soft);color:var(--amber)}
.fb-credit{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim);font-weight:600}
.fb-body{padding:14px 18px;background:var(--bg-panel)}
.fi{display:flex;gap:9px;padding:4px 0;font-size:14px;color:var(--ink-dim)}
.fi .ic{flex-shrink:0;font-weight:800}
.fi.ok .ic{color:var(--green)}
.fi.bad .ic{color:var(--red)}
.fi.miss .ic{color:var(--ink-faint)}
.fi.warn .ic{color:var(--red)}
.fi.warn{color:var(--red);font-weight:600}
.fi.note{color:var(--ink-faint)}
.fb-explain{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:12px;color:var(--ink-dim);font-size:14px}
.fb-explain p{margin:0 0 10px}
.fb-explain p:last-child{margin-bottom:0}
.fb-study{margin-top:10px;font-size:13px;color:var(--blue)}
.fb .mono{margin-top:10px}
/* ---------- actions ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:10px 20px;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-family:var(--sans)}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:transparent;color:#04120a}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-amber{background:var(--amber);border-color:transparent;color:#1c1204}
.ghost-note{color:var(--ink-faint);font-size:13px}
/* ---------- review ---------- */
.revlist{display:flex;flex-direction:column;gap:10px}
.revrow{display:flex;align-items:center;gap:12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex-wrap:wrap}
.revrow .rn{font-family:var(--mono);color:var(--amber);font-weight:700}
.revrow .rt{flex:1;color:var(--ink-dim);font-size:14px;min-width:200px}
.revrow .badge-skip{color:var(--ink-faint);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* ---------- results ---------- */
.res-head{border:1px solid var(--line);border-radius:14px;background:var(--bg-panel);padding:26px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ring{width:172px;height:172px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--pct)*1%),var(--bg-elev) 0);display:grid;place-items:center;flex-shrink:0}
.ring .rin{width:134px;height:134px;border-radius:50%;background:var(--bg-panel);display:grid;place-items:center;text-align:center}
.ring .pct{font-size:34px;font-weight:800;font-family:var(--mono)}
.ring .of{font-size:11px;color:var(--ink-faint);letter-spacing:.08em}
.res-verdict{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.res-verdict.pass{color:var(--green)}
.res-verdict.fail{color:var(--red)}
.res-sub{color:var(--ink-dim);font-size:14px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.statcard{background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.statcard .sv{font-size:22px;font-weight:800;font-family:var(--mono)}
.statcard .sv.ok{color:var(--green)}
.statcard .sv.part{color:var(--amber)}
.statcard .sv.bad{color:var(--red)}
.statcard .sv.skip{color:var(--ink-faint)}
.statcard .sl{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.pausereport{border:1px solid var(--line);border-radius:10px;background:var(--bg-panel);padding:12px 16px;color:var(--ink-dim);font-size:13.5px;margin-bottom:14px}
.restable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.restable th{background:var(--bg-elev);text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase}
.restable td{padding:8px 12px;border-top:1px solid var(--line-soft);color:var(--ink-dim)}
.restable td.num{font-family:var(--mono)}
.st-ok{color:var(--green);font-weight:700}
.st-part{color:var(--amber);font-weight:700}
.st-bad{color:var(--red);font-weight:700}
.st-skip{color:var(--ink-faint);font-weight:700}
/* ---------- overlay ---------- */

<script type="application/json" id="cm-exercise-meta">{"attackId":"T1021.006","attackName":"Windows Remote Management","objectType":"sub-technique","severity":"HARD","topicId":"t1021.006","batch":3,"title":"T1021.006 Windows Remote Management — HARD","difficulty":"hard","estimatedMinutes":45,"timerMinutes":45,"questionCount":18,"passMark":70,"learn":["T1021.006 is the Windows Remote Management sub-technique of T1021 in the Lateral Movement tactic. At HARD level three ideas interact: authentication (Kerberos, NTLM, CredSSP), listener and transport hardening, and telemetry that separates an admin's Tuesday from an intruder's Saturday.","You will learn the double-hop problem, why CredSSP parks a credential in an intermediate host's memory, and which safer designs replace it. You will also learn listener hygiene: TCP 5985 versus TCP 5986, certificates, AllowUnencrypted staying false, and what blocking outbound 5985/5986 actually buys.","The scenarios come from a utility SOC where patch systems, monitoring tools and administrators remote in daily — perfect cover for an intruder holding a valid password. Incident responders and threat hunters read 4624/4672 and 4104 text together; red teams rehearse the same paths their own admins use.","Your daily tasks: tune a 'new source host' rule without burying real alerts, decide whether a weekend session is the patch job gone wrong, and pick the least destructive containment that still removes the attacker's road.","The risks: one delegated credential on a jump host reaches a whole server tier, an over-broad TrustedHosts list quietly downgrades trust to NTLM, and a missing certificate keeps a plain listener alive. Each exercise trains one such decision."],"keywords":[{"theme":"Authentication Deep Dive","items":["CredSSP delegation","double-hop problem","resource-based Kerberos delegation","Negotiate selection","NTLM fallback with TrustedHosts"]},{"theme":"Listener & Transport Hardening","items":["HTTPS listener on TCP 5986","server authentication certificate","AllowUnencrypted stays false","block outbound 5985/5986","WSMan:\\localhost\\Listener"]},{"theme":"Detection & Baselines","items":["4624 type 3 plus 4672 pairing","4104 command text correlation","new-source-host alerting","wsmprovhost.exe child processes","4648 explicit credentials"]}]}</script>

pted stays false","block outbound 5985/5986","WSMan:\\localhost\\Listener"]},{"theme":"Detection & Baselines","items":["4624 type 3 plus 4672 pairing","4104 command text correlation","new-source-host alerting","wsmprovhost.exe child processes","4648 explicit credentials"]}]};
var EXAMS = [{"id":"e01","type":"mcq","title":"Saturday on the domain controller","summary":"Daily patch traffic fires the new alert — triage it.","scenario":"Energieversorgung Nordlicht turns on a new rule: 'WinRM logon to DC-NORD01'. It fires instantly for the 07:30 pattern of adm_r.dahm from WS-PATCH03 — 4624 type 3, 4672, then 4104 lines that call Get-Service and install approved updates. The pattern has run every weekday for eleven months and the change calendar lists the patch slot. Tonight the same pattern appears on a Saturday.","question":"What is the best first read of the Saturday hit?","hint":"Check every dimension of the baseline before paging anybody.","explanation":"Host pair, account and command text match the eleven-month weekday baseline; only the weekday moved, and the change calendar explains a Saturday patch run. The proportionate call is to confirm the ticket, keep the alert and note the weekday change — closing the rule would blind the team next month. Isolating a domain controller on a Saturday harms more than it protects, and rotating credentials on baseline traffic is a cost with no evidence behind it.","study":"Study baseline dimensions: host pair, account, time window, command text.","options":["Confirm the ticket, keep the alert, note the weekday change","Isolate DC-NORD01 from the network and page the duty manager","Close the alert, delete the noisy rule, email the floor","Rotate adm_r.dahm's password and freeze the patch system"],"correct":0},{"id":"e02","type":"fill","title":"The double-hop trap","summary":"Complete the CredSSP note with role names and the safer design.","scenario":"A Nordlicht build engineer asks why his script can read a network share on the second hop only when 'that CredSSP flag' is set. You write the wiki note: what the client and server roles do, what lands in the middle host's memory, and the design the security team prefers instead.","question":"Complete the wiki note with values from the bank:","hint":"The roles are spelled like the two ends of the hop; the safe delegation rides on Kerberos.","explanation":"The client role forwards, the server role accepts — both must be set or the second hop still fails. The forwarded credential is readable in the middle host's memory, which is exactly why attackers prize it. Resource-based Kerberos delegation grants the second hop without placing a credential on the middle host, and NTLM or Basic change nothing about the delegation problem.","study":"Study the double-hop problem and resource-based Kerberos delegation as the safer design.","text":"Enable-WSManCredSSP -Role ___ on the client forwards credentials one hop further while the server side needs Role ___ ; because the credential sits in the middle host's memory, Nordlicht prefers designs like resource-based ___ delegation or scheduled tasks.","blanks":["Client","Server","Kerberos"],"bank":["Client","Server","Kerberos","NTLM","CredSSP","Basic"]},{"id":"e03","type":"match","title":"Auth mode, when it applies","summary":"Match each authentication mode to its typical case.","scenario":"Nordlicht documents five authentication modes on one page for the network team. Each mode has a case where it is the right — or at least the typical — answer. Mislabelling them has already caused one false audit finding, so this page must be exact.","question":"Match each mode to the case where it applies:","hint":"Negotiate is the default chooser; the others are forced choices.","explanation":"Default Negotiate tries Kerberos first and falls back to NTLM. Kerberos applies for domain-joined hosts with correct names and SPNs. NTLM plus TrustedHosts is the workgroup or name-mismatch fallback. CredSSP exists for an explicit second hop. Basic over HTTPS is the rare non-domain case where TLS protects the password on the wire.","study":"Study WSMan authentication settings on both client and service side.","pairs":[{"left":"Default (Negotiate)","right":"Tries Kerberos, falls back to NTLM"},{"left":"Kerberos","right":"Domain join with correct SPNs"},{"left":"NTLM + TrustedHosts","right":"Workgroup or name mismatch"},{"left":"CredSSP","right":"Explicit second-hop delegation"},{"left":"Basic over HTTPS","right":"Non-domain case protected by TLS"}]},{"id":"e04","type":"terminal","title":"Review the client allow-list","summary":"Read the TrustedHosts value without changing it.","scenario":"An audit finding claims WS-PATCH03's TrustedHosts list is over-broad. You open the value from the WSMan drive — read-only. The audit needs the exact list; the host needs its configuration untouched. The simulator recognises the tools below.","question":"Run the read-only command that shows the client TrustedHosts value:","hint":"Get-Item on the WSMan path returns the setting; Set-Item would be a change.","explanation":"Get-Item WSMan:\\localhost\\Client\\TrustedHosts prints the current allow-list without touching anything. Set-Item rewrites the list mid-audit and can cut off other admins, and Clear-Item empties it — both are configuration changes, not reviews. winrm enumerate would show listeners, a different configuration section.","study":"Study the WSMan drive: Client\\TrustedHosts, Service\\Auth nodes, Listener container.","prompt":"PS C:\\Users\\adm_r.dahm>","skill":"trustedhosts-review","knownTools":["Get-Item","Set-Item","Clear-Item","winrm","Get-ChildItem"],"expected":"Get-Item WSMan:\\localhost\\Client\\TrustedHosts","elements":[{"label":"the read-only Get-Item cmdlet","any":["get-item"]},{"label":"the WSMan path to the client allow-list","any":["wsman:\\localhost\\client\\trustedhosts"]}],"forbidden":[{"any":["set-item wsman:\\localhost\\client\\trustedhosts","clear-item wsman"],"why":"Rewriting or emptying TrustedHosts mid-audit changes the security posture you were asked to measure."}],"output":["Name          Value","----          ----","TrustedHosts  SRV-BIL02, MON-HUB01, DC-NORD01","[review] read-only; no configuration changed"]},{"id":"e05","type":"logview","title":"Unexplained session in the night log","summary":"Find the session that does not match the patch baseline.","scenario":"SRV-BIL02 takes nightly patch sessions from WS-PATCH03 under svc_deploy at 22:00 — 4624 type 3, 4672, routine 4104 update commands. Tonight the export shows a second pattern. Filter the export and complete the IR note; the monitoring rows are known noise.","question":"Complete the IR note with values from the log:","hint":"The 22:00 and 04:02 rows are documented; look at the third source host.","explanation":"WS-PATCH03 at 22:00 under svc_deploy is the documented patch flow, and MON-HUB01 at 04:02 is the monitoring sweep — both are baseline. The 03:41:07 type 3 logon from WS-GAST04 reuses svc_deploy, a patch account, but from a contractor workstation that has no role on the billing server; its 4104 lines show account and domain-group discovery, not patching. That session is the outlier the note must record.\n\nAttacker view: a contractor workstation with a stolen patch account is ideal cover — the account is trusted, so only the source host and the command text betray the reuse.","study":"Study how a stolen service account appears: same user, wrong source, wrong commands.","filterable":true,"log":{"header":["time","event","detail"],"lines":["22:00:04  4624  Logon Type 3  user=svc_deploy  src=WS-PATCH03  host=SRV-BIL02","22:00:05  4672  Special privileges  user=svc_deploy","22:00:06  4104  ScriptBlock: Install-WindowsUpdate -KbId 5044284  user=svc_deploy","22:07:41  4634  Logoff  user=svc_deploy","03:41:07  4624  Logon Type 3  user=svc_deploy  src=WS-GAST04  host=SRV-BIL02","03:41:08  4672  Special privileges  user=svc_deploy","03:41:09  4104  ScriptBlock: Get-LocalUser  user=svc_deploy","03:41:12  4104  ScriptBlock: net group 'Domain Admins' /domain  user=svc_deploy","03:44:58  4634  Logoff  user=svc_deploy","04:02:00  4624  Logon Type 3  user=svc_mon  src=MON-HUB01  host=SRV-BIL02","04:02:01  4672  Special privileges  user=svc_mon","04:02:05  4104  ScriptBlock: Get-Service | Out-Null  user=svc_mon"]},"widget":{"type":"fill","question":"Fill the IR note from the night export:","text":"The session outside the patch baseline came from host ___ at ___ and the account is ___ .","blanks":["WS-GAST04","03:41:07","svc_deploy"],"bank":["WS-GAST04","03:41:07","svc_deploy","WS-PATCH03","22:00:04","svc_mon"]}},{"id":"e06","type":"mcq","title":"Health check or hand of the intruder?","summary":"A monitoring tool's excuse hides an explicit-credential logon.","scenario":"MON-HUB01 runs health probes over WinRM every quarter hour and the NOC answers every question about it with 'that is the monitoring, ignore it'. This time the Security log on DC-NORD01 shows a 4648 explicit-credential event under svc_mon that names the domain admin account k.sturm, followed by a type 3 logon for k.sturm from MON-HUB01. The NOC repeats: monitoring, ignore.","question":"Which reading fits the evidence?","hint":"Monitoring probes run as their own account; they never need a domain admin's credential.","explanation":"The monitoring baseline authenticates as svc_mon; a 4648 that names a domain admin means someone supplied k.sturm's credentials explicitly — exactly what winrs -u: or -Credential produces. That is not monitoring; that is an intruder reusing a harvested admin account from a host the NOC trusts. The other readings either trust the label 'monitoring' too far or blame the protocol instead of the credential use.","study":"Study 4648 anatomy and why explicit use of an admin account from a service host is an alarm.","options":["An admin credential was supplied explicitly from MON-HUB01 — escalate","The monitoring tool silently upgraded itself to the admin account for this probe","NTLM negotiation broke in the domain and must be fixed","A routine probe that logs more detail than usual — mark as noise"],"correct":0},{"id":"e07","type":"multi","title":"CredSSP claims","summary":"Select every true statement about CredSSP and the double hop.","scenario":"The platform team proposes enabling CredSSP fleet-wide 'to make scripts simpler'. Before the change board meets, you mark which claims in their slide are true; the slide goes out with corrections attached. Fleet defaults apply, nothing has been changed yet.","question":"Select all true statements:","hint":"Two claims praise CredSSP for things it does not do.","explanation":"True: the delegated credential sits in the middle host's memory where a compromised host can read it; missing CredSSP is a classic cause of 'second-hop access denied' errors; and resource-based Kerberos delegation reaches the same goal without parking a credential on the middle host. False: CredSSP does not encrypt the delegated credential against the middle host — the whole point is that the middle host receives it — and plain single-hop Invoke-Command never needs CredSSP at all.","study":"Study the double-hop problem, CredSSP exposure, and RBCD as the safer design.","options":["The delegated credential is readable in the middle host's memory","Without it, second-hop access often fails with access denied","Resource-based Kerberos delegation avoids parking credentials","CredSSP encrypts the credential so the middle host cannot read it","Plain single-hop Invoke-Command requires CredSSP"],"correct":[0,1,2]},{"id":"e08","type":"order","title":"How the road is walked","summary":"Order the intruder's steps from one password to a server tier.","scenario":"Public reporting on intrusions describes a recurring WinRM pattern after a workstation is taken. Nordlicht's red team rebuilds that pattern in a sanctioned exercise so defenders learn to see it. The steps are listed below; the order is scrambled.","question":"Arrange the steps into the order the intruder walks them:","hint":"Reachability is tested before any command is run.","explanation":"First the valid password is obtained — phishing, dumping or reuse. Then TCP 5985 reachability to the target tier is checked, often with a quick Test-WSMan. Invoke-Command lands the first commands under wsmprovhost.exe, discovery runs quietly inside the remote session, and the session's token then opens the next hop. Skipping the reachability check is how noisy, failed logons appear — the disciplined path stays quiet.\n\nAttacker view: everything here uses built-in tools and a valid account, so the only durable signals are the wrong source host and the wrong command text in 4104.","study":"Study ATT&CK T1021.006 as a chain: valid account, network service scanning, remote execution, discovery.","items":["Obtain a valid password for the tier","Test TCP 5985 reachability to the target host","Run Invoke-Command to land the first commands","Run discovery quietly inside the remote session","Reuse the session token to reach the next hop"]},{"id":"e09","type":"fill","title":"HTTPS listener parts","summary":"Complete the migration sentence.","scenario":"Nordlicht migrates the billing tier to certificate-based listeners. The migration note must name what a 5986 listener needs, which port it opens, and which old port should finally disappear. You fill the blanks for the change board.","question":"Complete the migration note with values from the bank:","hint":"One blank is what you install, not the number you install it under.","explanation":"The listener needs a certificate whose subject matches the host name; clients then connect with -UseSSL on TCP 5986. Finishing the migration means removing the 5985 listener so no plain-capable endpoint stays open. A thumbprint identifies a certificate but is not what you install, and 445 or 5987 are ports of other stories entirely.","study":"Study New-WSManInstance or winrm create for HTTPS listeners and the certificate requirements.","text":"A WinRM HTTPS listener needs a server authentication ___ issued for the host name, opens TCP ___ for clients using -UseSSL, and the migration ends by removing the plain listener on TCP ___ .","blanks":["certificate","5986","5985"],"bank":["certificate","5986","5985","thumbprint","445","5987"]},{"id":"e10","type":"mcq","title":"What blocking the ports buys","summary":"Pick the true effect of blocking outbound 5985/5986 from workstations.","scenario":"Nordlicht plans to block outbound TCP 5985 and 5986 from all workstations except the patch host WS-PATCH03 and the jump host. The network lead asks what the control actually buys and what it cannot do. Choose the honest answer.","question":"Which statement describes the control correctly?","hint":"It shapes where remoting can start; it does not fix authentication or logging.","explanation":"Blocking outbound 5985/5986 from workstations stops workstation-to-workstation and workstation-to-server WinRM hopping while documented administration keeps working — the attacker must come from the few allowed sources, which the telemetry watches closely. It does not disable the WinRM service anywhere, does not fix stolen passwords, and does not replace logging; RDP on 3389 is untouched.","study":"Study segmentation for lateral movement: allow-list administration sources, block the rest.","options":["It stops workstation hopping while documented sources keep working","It disables the WinRM service on every workstation at once","It replaces credential hygiene, logging and patching as the main control","It blocks RDP sessions on TCP 3389 as a side effect"],"correct":0},{"id":"e11","type":"match","title":"WSMan paths and their job","summary":"Match each WSMan setting to what it controls.","scenario":"The audit report quotes five WSMan paths with wrong descriptions, so Nordlicht's compliance team rebuilds the mapping table before the next review. Each path below is real and lives on the jump hosts; each description must be exact, because the auditor re-checks every row.","question":"Match each WSMan path to what it actually controls:","hint":"Two paths belong to the client side, three to the service side.","explanation":"Client\\TrustedHosts is the client-side NTLM allow-list. Client\\Auth\\CredSSP switches delegation on the client. Service\\Auth\\Basic allows basic authentication server-side — it should be false. Service\\Auth\\CredSSP accepts delegated credentials server-side. Listener entries define transport and port. Swapping the client and service CredSSP flags is the classic audit error.","study":"Study the WSMan drive tree until you can name each node's job from memory.","pairs":[{"left":"WSMan:\\localhost\\Client\\TrustedHosts","right":"Client-side allow-list for NTLM targets"},{"left":"WSMan:\\localhost\\Client\\Auth\\CredSSP","right":"Client-side delegation switch"},{"left":"WSMan:\\localhost\\Service\\Auth\\Basic","right":"Server-side basic auth, keep false"},{"left":"WSMan:\\localhost\\Service\\Auth\\CredSSP","right":"Server-side acceptance of delegation"},{"left":"WSMan:\\localhost\\Listener","right":"Container defining transports and ports"}]},{"id":"e12","type":"decision","title":"The scan says 'unencrypted WinRM'","summary":"A scanner finding meets reality — decide in three steps.","scenario":"A vulnerability scanner marks 300 servers 'WinRM enabled without encryption'. The NOC drafts a fleet-wide 'disable WinRM' change for Friday. Nordlicht's patching depends on those 5985 sessions, and the scanner's wording came from the listener transport being HTTP, not from AllowUnencrypted being true. Walk the chain.","question":"Walk the three decision steps in order:","hint":"The scanner words are not the same as the setting value.","explanation":"First verify the actual values: AllowUnencrypted stays false on all servers, and message encryption covers Negotiate traffic even on 5985 — the finding is a transport-label finding, not a cleartext one. Second weigh the action: a fleet-wide disable would break patching and monitoring on the same Friday, a cost the finding does not justify. Third do the proportionate thing: plan the HTTPS migration, keep the HTTP listener short-term, and track it as a project.\n\nDefender view: the scanner gives speed, not truth; reading the real setting first is what separates a project from a self-inflicted outage.","study":"Study what AllowUnencrypted really does and why Negotiate encrypts the payload.","steps":[{"label":"STEP 1 OF 3 — verify","prompt":"Scanner: 'WinRM enabled without encryption' on 300 servers.","question":"What do you check first?","options":["The AllowUnencrypted value and listener transport on a sample of hosts","The Friday change calendar for free slots","The scanner vendor's newest signature pack"],"correct":0,"why":"The real setting decides the meaning of the finding; nothing else does."},{"label":"STEP 2 OF 3 — weigh","prompt":"Values: AllowUnencrypted=false everywhere; listeners are HTTP on 5985.","question":"What does the fleet-wide disable on Friday actually risk?","options":["It breaks patching and monitoring, which both remote in","Nothing — WinRM is unused on servers","Only the scanner stops working"],"correct":0,"why":"Patch and monitoring jobs ride the same 5985 sessions; disabling pulls both down."},{"label":"STEP 3 OF 3 — act","prompt":"Costs and benefits are on the table.","question":"Which action is proportionate?","options":["Plan the HTTPS migration, keep 5985 short-term, track it as a project","Disable WinRM fleet-wide on Friday as drafted","Ignore the finding; nothing will ever change"],"correct":0,"why":"The migration removes the transport finding without breaking operations on one Friday."}]},{"id":"e13","type":"logview","title":"A listener appears in the log","summary":"Read the 4104 lines and name the config change.","scenario":"Evening export from SRV-BIL02, PowerShell/Operational only. The admin adm_r.dahm runs his documented evening checks at 22:00. Between 23:10 and 23:12 the same account produces 4104 lines that do not belong to any ticket. Filter and complete the note.","question":"Complete the note about the 23:10 configuration change:","hint":"The 4104 text is the ground truth; the 22:00 rows are the documented baseline.","explanation":"The 23:10:44 line creates a new listener with New-WSManInstance under adm_r.dahm — an endpoint change no ticket covers. The following Set-Item line flips Basic authentication on, which makes it worse. The 22:00 rows are his documented checks and the 23:12 Get-PSSessionConfiguration only reads the endpoints. The account is adm_r.dahm, so either his credential is stolen or he is working off-ticket — both need the incident path, not a ticket update.\n\nDefender view: config writes under WSMan paths are the highest-value 4104 strings to alert on, because normal administration almost never creates listeners by hand.","study":"Study which 4104 strings mark WinRM configuration tampering.","filterable":true,"log":{"header":["time","event","detail"],"lines":["22:00:02  4104  ScriptBlock: Get-Service WinRM, wuauserv  user=adm_r.dahm","22:00:07  4104  ScriptBlock: Get-HotFix | Sort InstalledOn  user=adm_r.dahm","22:00:08  4103  Module: CommandInvocation(Get-HotFix)  user=adm_r.dahm","23:10:44  4103  Module: CommandInvocation(New-WSManInstance)  user=adm_r.dahm","23:10:44  4104  ScriptBlock: New-WSManInstance winrm/config/Listener -SelectorSet @{Address=\"*\";Transport=\"HTTP\"}  user=adm_r.dahm","23:11:02  4104  ScriptBlock: Set-Item WSMan:\\localhost\\Service\\Auth\\Basic -Value $true  user=adm_r.dahm","23:12:31  4104  ScriptBlock: Get-PSSessionConfiguration  user=adm_r.dahm","23:12:40  4103  Module: CommandInvocation(Get-PSSessionConfiguration)  user=adm_r.dahm"]},"widget":{"type":"fill","question":"Name the change and the account from the log:","text":"At 23:10:44 the session created a new WinRM ___ with the command ___ under account ___ .","blanks":["Listener","New-WSManInstance","adm_r.dahm"],"bank":["Listener","New-WSManInstance","adm_r.dahm","svc_deploy","Get-PSSessionConfiguration","Set-Item"]}},{"id":"e14","type":"order","title":"Move the tier to 5986 without breaking it","summary":"Order the five migration steps for HTTPS listeners.","scenario":"Nordlicht migrates the billing tier from 5985 to certificate-based 5986 during two maintenance windows. The sequence must keep svc_deploy's patch job alive throughout: no step may break the running flow before its replacement works. Order the steps.","question":"Arrange the migration steps:","hint":"A new listener must be proven working before the old one is touched.","explanation":"Certificates come first, one per host, issued to the exact host names svc_deploy uses. The HTTPS listener is created while 5985 still runs, then a test client proves -UseSSL connects and the patch job runs over 5986. Only then is the plain listener removed, and the final step watches 4624 type 3 to confirm the traffic really moved and nothing fell back.\n\nDefender view: migrations fail in the last two steps when teams celebrate after step two — the old listener stays, and the port story quietly never changes.","study":"Study staged migrations: parallel run, prove, remove, monitor.","items":["Issue a server certificate per host, subject = host name","Create the HTTPS listener on TCP 5986 alongside 5985","Prove svc_deploy's patch job runs over -UseSSL","Remove the plain HTTP listener on 5985","Watch 4624 type 3 telemetry to confirm nothing fell back"]},{"id":"e15","type":"mcq","title":"The alias that will not remote","summary":"Diagnose a Kerberos name failure.","scenario":"svc_deploy's job remotes to the alias BIL-JOB, a DNS CNAME pointing at SRV-BIL02. Today it fails: 'the WinRM client cannot process the request… the target principal name is incorrect'. The port is open, the account is fine, and yesterday it worked via the real name. The network lead proposes disabling the firewall; the platform lead proposes changing the account.","question":"Which diagnosis fits the error?","hint":"Kerberos checks the name you type against the SPN the machine owns.","explanation":"An alias has no SPN of its own — Kerberos compares the name you connect to with the SPN registered for SRV-BIL02 and fails, which produces exactly that error. The fixes are honest: connect by the real host name, or register an SPN for the alias. TrustedHosts plus NTLM would 'work' but downgrades authentication, and neither the firewall nor the account is the problem.","study":"Study SPNs, host name resolution and WinRM, and why aliases break Kerberos.","options":["The alias lacks an SPN, so Kerberos cannot vouch for it","The firewall silently dropped TCP 5985 traffic during the night","svc_deploy's password expired early this morning","The TLS certificate on SRV-BIL02 has expired"],"correct":0},{"id":"e16","type":"fill","title":"Fields of the night logon","summary":"Complete the 4624 field walk.","scenario":"The IR trainee must describe the 03:41 session to the duty officer in one sentence, using only 4624 field names and values. The sentence below is the template; the values come from the audit you already read. Choose from the bank only.","question":"Complete the template sentence with values from the bank:","hint":"The workstation field points at where the person sat, not at the server.","explanation":"Logon Type is 3 for the WinRM network logon; the Workstation Name field names the client host the session came from; and explicit credentials produce 4648 in addition to the 4624. Type 10 would describe RDP, the target host is the machine being logged into — not what the field names — and 4688 is process creation auditing, a different record.","study":"Study reading a 4624 row aloud: type, workstation, source address, credentials.","text":"In the 03:41 event, Logon Type reads ___ , the workstation field names the ___ , and because the client passed explicit credentials, event ___ appears alongside.","blanks":["3","client host","4648"],"bank":["3","client host","4648","10","target host","4688"]},{"id":"e17","type":"terminal","title":"Query Security for network logons","summary":"Pull the newest 25 logon events with one filtered query.","scenario":"You are on WS-PATCH03 hunting which accounts have collected type 3 logons on the billing tier tonight. The console is a plain PowerShell prompt; the simulator knows the tools below. Read-only — the Security log must survive your shift.","question":"Run the filtered query that returns the 25 newest Security 4624 events:","hint":"One cmdlet, a filter hash table with the log name and the id, then a count limit.","explanation":"Get-WinEvent -FilterHashtable @{LogName=\"Security\";Id=4624} -MaxEvents 25 returns the newest 25 logon events; filtering server-side beats scrolling. Clear-EventLog or wevtutil cl wipes the channel — the fastest way to end both the intrusion case and your career. -Newest is a Get-EventLog parameter and does not exist on Get-WinEvent.","study":"Study FilterHashtable syntax: LogName, Id, StartTime — and log every query you run on an incident.","prompt":"PS C:\\Users\\adm_r.dahm>","skill":"type3-logon-hunt","knownTools":["Get-WinEvent","Get-EventLog","wevtutil","whoami"],"expected":"Get-WinEvent -FilterHashtable @{LogName=\"Security\";Id=4624} -MaxEvents 25","elements":[{"label":"the Get-WinEvent cmdlet","any":["get-winevent"]},{"label":"the filter hash table","any":["-filterhashtable"]},{"label":"the event id filter for logons","any":["id=4624"]},{"label":"the 25-event cap","any":["-maxevents 25"]}],"forbidden":[{"any":["clear-eventlog","wevtutil cl"],"why":"Clearing the Security log destroys the intrusion record — evidence destruction is the one unforgivable triage move."}],"output":["03:41:07  4624  Type 3  user=svc_deploy   src=WS-GAST04","04:02:00  4624  Type 3  user=svc_mon       src=MON-HUB01","22:00:04  4624  Type 3  user=svc_deploy   src=WS-PATCH03","[query] 25 newest events requested; 3 shown"]},{"id":"e18","type":"decision","title":"Same account, a Saturday again","summary":"One Saturday pattern repeats across two hosts — decide.","scenario":"Saturday 03:11: SRV-BIL02 and SRV-KPI03 both show svc_deploy type 3 logons from WS-PATCH03, with 4104 text identical to the 22:00 weekday patch pattern. svc_deploy has never run on a Saturday in fourteen months, and no ticket exists. Take the three steps.","question":"Take the three decision steps:","hint":"The command text and the source host decide whether this is the patch job or its mimic.","explanation":"Diffing the Saturday 4104 text against the weekday patch script comes first: matching text means the job or its schedule moved, added discovery commands mean the account is borrowed. The source host check comes second — WS-PATCH03 is documented, any other host is a verdict by itself. With a foreign source, the proportionate response is rotating svc_deploy and hunting, not a mass shutdown that hides the next move.\n\nAttacker view: reusing the patch account with its own script text is the cheapest cover there is; only time and source deviate.","study":"Study deviation analysis: same account, changed time, changed source, changed text — rank the signals.","steps":[{"label":"STEP 1 OF 3 — compare text","prompt":"Saturday 03:11: svc_deploy on SRV-BIL02 and SRV-KPI03 from WS-PATCH03.","question":"What separates the patch job from its mimic first?","options":["Diff the 4104 text of Saturday against the weekday script","Reboot both servers to clear the sessions","Email the whole SOC and wait"],"correct":0,"why":"Command text is the fastest fingerprint: patch commands versus discovery commands."},{"label":"STEP 2 OF 3 — check the source","prompt":"The text matches the weekday script byte for byte.","question":"Which remaining check decides the case?","options":["Which source host opened the Saturday sessions","Rotate every service account in the domain","Disable WinRM on the two servers"],"correct":0,"why":"A trusted account from the trusted host with trusted text is a moved schedule; a foreign source is something else."},{"label":"STEP 3 OF 3 — respond","prompt":"The Saturday sessions came from WS-GAST04 — a contractor workstation, not the patch host.","question":"Which response fits?","options":["Rotate /* ==== utils ==== */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function norm(s){
  return String(s == null ? "" : s).toLowerCase().replace(/\s+/g," ").replace(/[.,;:!]+$/,"").trim();
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function fmt1(n){ return (Math.round(n * 100) / 100).toFixed(1); }
function wordCount(s){ return String(s || "").split(/\s+/).filter(Boolean).length; }
function $(id){ return document.getElementById(id); }
function byClass(root, cls){ return root.getElementsByClassName(cls); }

/* ==== timer ==== */
function setTimerState(next){
  var now = Date.now();
  if(S.tStateAt != null){
    var dt = (now - S.tStateAt) / 1000;
    if(S.tState === "PAUSED_MANUAL") S.pauseManual += dt;
    if(S.tState === "PAUSED_AUTO_CHECK") S.pauseAutoCheck += dt;
  }
  S.tState = next;
  S.tStateAt = now;
  updateHeader();
}
setInterval(function(){
  if(S.tState === "RUNNING"){
    S.remaining -= 1;
    S.elapsed += 1;
    if(S.remaining <= 0){
      S.remaining = 0;
      updateClock();
      finish();
      return;
    }
    updateClock();
  }
}, 1000);
function updateClock(){ var c = $("tb-clock"); if(c) c.textContent = fmtClock(S.remaining); }

  $("btn-pause").disabled = !(S.tState === "RUNNING" || S.tState === "PAUSED_AUTO_CHECK");
}

/* ==== postMessage integration ==== */
window.addEventListener("message", function(ev){
  var d = ev.data;
  if(!d || typeof d !== "object") return;
  if(d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT"){
    S.init = d;
    var slot = $("candline");
    if(slot && d.username){
      slot.textContent = "Candidate: " + d.username + (d.country ? " · " + d.country : "");
      slot.style.display = "block";
    }
  }
});
function postScore(){
  if(S.scorePosted) return;
  S.scorePosted = true;
  var rounded = Math.round(S.score);
  var total = 0, i;
  for(i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null) total++;
  }
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var msg = {
    type: "CYBERPULSE_SCORE",
    topicId: META.topicId,
    batch: META.batch,
    score: rounded,
    total: total,
    percent: percent,
    passed: passed
  };
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage(msg, location.origin);
    }
  }catch(e){ /* standalone file:// — no parent handshake */ }
}

/* ==== answer defaults ==== */
function defaultAnswer(ex){
  var i, d;
  switch(ex.type){
    case "mcq": return { sel: -1 };
    case "multi": return { sel: [] };
    case "match":
      d = []; for(i = 0; i < ex.pairs.length; i++) d.push(-1); return { assign: d };
    case "order":
      d = []; for(i = 0; i < ex.items.length; i++) d.push(i);
      return { seq: shuffle(d) };
    case "fill":
      d = []; for(i = 0; i < ex.blanks.length; i++) d.push(""); return { vals: d };
    case "terminal": return { cmd: "" };
    case "logview": return { w: defaultAnswer(ex.widget) };
    case "decision":
      d = []; for(i = 0; i < ex.steps.length; i++) d.push(-1); return { steps: d, cursor: 0 };
  }
  return {};
}
function ensureAnswer(ex, i){
  if(S.answers[i] == null) S.answers[i] = defaultAnswer(ex);
  return S.answers[i];
}

function scenInner(ex){
  var out = "";
  var paras = String(ex.scenario).split(/\n\n+/);
  for(var p = 0; p < paras.length; p++) out += "<p>" + esc(paras[p]) + "</p>";
  if(ex.artefacts && ex.artefacts.length){
    for(var a = 0; a < ex.artefacts.length; a++){
      var art = ex.artefacts[a];
      var long = String(art.content || "").split("\n").length > 25;
      out += '<details class="artef"' + (long ? "" : " open") + '><summary>' + esc(art.label) + '</summary><div class="artbody">' + artefactBody(art) + "</div></details>";
    }
  }
  return out;
}
function artefactBody(art){
  if(art.kind === "table"){
    var rows = String(art.content).split("\n");
    var out = '<table class="attable">';
    for(var r = 0; r < rows.length; r++){
      var cells = rows[r].split(" | ");

      }

  }
  return '<pre class="mono">' + esc(art.content) + "</pre>";
}

function renderChoice(ex, root, ans, lock, res, isMulti, path){
  var correct = isMulti ? ex.correct : [ex.correct];
  ex.options.forEach(function(opt, oi){
    var chosen = isMulti ? ans.sel.indexOf(oi) !== -1 : ans.sel === oi;
    var mark = "", cls = "";
    if(!lock){
      if(chosen){ mark = isMulti ? "☑" : "◉"; cls = "sel"; }
    } else {
      var isCorr = correct.indexOf(oi) !== -1;
      if(isCorr){ mark = "✓"; cls = "correct"; }
      else if(chosen){ mark = "✗"; cls = "wrong"; }
      else { cls = "dim"; }
    }
    root.insertAdjacentHTML("beforeend", optionRow(opt, oi, chosen, mark, cls));
  });
  var btns = byClass(root, "opt");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      btn.addEventListener("click", function(){
        if(lock) return;
        var oi = parseInt(btn.getAttribute("data-i"), 10);

          if(p === -1) ans.sel.push(oi); else ans.sel.splice(p, 1);

          btn.querySelector(".mark").textContent = btn.classList.contains("sel") ? "☑" : "";

            btns[z].setAttribute("aria-pressed", "false");
            var mk = btns[z].querySelector(".mark"); if(mk) mk.textContent = "";
          }
          btn.classList.add("sel");
          btn.setAttribute("aria-pressed", "true");
          btn.querySelector(".mark").textContent = "◉";

function renderOrder(ex, root, ans, lock, res){

      });
    });

/* ==== grading ==== */
function gradeFillLike(text, blanks, vals){
  var items = [], H = 0, W = 0, N = blanks.length;
  for(var k = 0; k < N; k++){
    var v = norm(vals[k]);
    var ok = v !== "" && v === norm(blanks[k]);
    items.push({ ok: ok, state: v === "" ? "miss" : (ok ? "ok" : "bad"),
      text: v === "" ? ('Blank ' + (k + 1) + ' — missed. Correct: "' + blanks[k] + '"')
        : (ok ? ('Blank ' + (k + 1) + ' — correct: "' + blanks[k] + '"')
        : ('Blank ' + (k + 1) + ' — "' + vals[k] + '" is wrong. Correct: "' + blanks[k] + '"')) });
    if(ok) H++; else if(v !== "") W++;
  }
  return { H: H, W: W, N: N, items: items };
}
function gradeChoiceLike(options, correct, sel, isMulti){
  var items = [], H = 0, W = 0, N = correct.length;
  var selArr = isMulti ? (sel || []) : (sel === -1 ? [] : [sel]);
  for(var c = 0; c < correct.length; c++){
    var ci = correct[c];
    if(selArr.indexOf(ci) !== -1){ items.push({ ok: true, state: "ok", text: "✓ You selected the correct option: " + options[ci] }); H++; }
    else items.push({ ok: false, state: "miss", text: "Missed the correct option: " + options[ci] });
  }
  for(var s = 0; s < selArr.length; s++){
    var si = selArr[s];
    if(correct.indexOf(si) === -1){
      items.push({ ok: false, state: "bad", text: "Wrong selection: " + options[si] });
      W++;
    }
  }
  return { H: H, W: W, N: N, items: items };
}
function grade(ex, ans, hintUsed){
  var g, i;
  switch(ex.type){
    case "mcq":
      g = gradeChoiceLike(ex.options, [ex.correct], ans.sel, false);
      break;
    case "multi":
      g = gradeChoiceLike(ex.options, ex.correct, ans.sel, true);
      break;
    case "match":
      g = { H: 0, W: 0, N: ex.pairs.length, items: [] };
      for(i = 0; i < ex.pairs.length; i++){
        var a = ans.assign[i];
        if(a === -1){ g.items.push({ state: "miss", text: 'Missed: "' + ex.pairs[i].left + '" → correct partner: "' + ex.pairs[i].right + '"' }); }
        else if(a === i){ g.H++; g.items.push({ state: "ok", text: '✓ "' + ex.pairs[i].left + '" → "' + ex.pairs[i].right + '"' }); }
        else { g.W++; g.items.push({ state: "bad", text: 'Wrong: "' + ex.pairs[i].left + '" → you placed "' + ex.pairs[a].right + '", correct: "' + ex.pairs[i].right + '"' }); }
      }
      break;
    case "order":
      g = { H: 0, W: 0, N: ex.items.length, items: [] };
      for(i = 0; i < ex.items.length; i++){
        if(ans.seq[i] === i){ g.H++; g.items.push({ state: "ok", text: "Position " + (i + 1) + " — correct: " + ex.items[i] }); }
        else { g.W++; g.items.push({ state: "bad", text: "Position " + (i + 1) + " — you placed \"" + ex.items[ans.seq[i]] + '", correct: "' + ex.items[i] + '"' }); }
      }
      break;
    case "fill":
      g = gradeFillLike(ex.text, ex.blanks, ans.vals);
      break;
    case "terminal": {
      var cmd = String(ans.cmd || "");
      g = { H: 0, W: 0, N: ex.elements.length, items: [], warn: [], canon: null };
      var low = cmd.toLowerCase();
      if(!cmd){
        g.items.push({ state: "miss", text: "No command was run — nothing to grade." });
      } else {
        for(i = 0; i < ex.elements.length; i++){
          var el = ex.elements[i];
          var hit = false;
          for(var v = 0; v < el.any.length; v++){
            if(low.indexOf(String(el.any[v]).toLowerCase()) !== -1){ hit = true; break; }
          }
          if(hit){ g.H++; g.items.push({ state: "ok", text: "✓ Element matched: " + el.label }); }
          else g.items.push({ state: "miss", text: "Missing element: " + el.label });
        }
        (ex.forbidden || []).forEach(function(f){
          for(var v2 = 0; v2 < f.any.length; v2++){
            if(low.indexOf(String(f.any[v2]).toLowerCase()) !== -1){
              g.warn.push("⚠ DANGEROUS — NEAR MISS: " + f.why);
              break;
            }
          }
        });
      }
      if(g.H < g.N) g.canon = ex.expected;
      break;
    }
    case "logview": {
      var wg;
      if(ex.widget.type === "fill") wg = gradeFillLike(ex.widget.text, ex.widget.blanks, ans.w.vals);
      else if(ex.widget.type === "multi") wg = gradeChoiceLike(ex.widget.options, ex.widget.correct, ans.w.sel, true);
      else wg = gradeChoiceLike(ex.widget.options, [ex.widget.correct], ans.w.sel, false);
      g = { H: wg.H, W: wg.W, N: wg.N, items: wg.items.map(function(it){ return it; }) };
      break;
    }
    case "decision":
      g = { H: 0, W: 0, N: ex.steps.length, items: [] };
      for(i = 0; i < ex.steps.length; i++){
        var st = ex.steps[i];
        if(ans.steps[i] === st.correct){ g.H++; g.items.push({ state: "ok", text: (st.label || "Step " + (i + 1)) + " — correct: " + st.options[st.correct] }); }
        else if(ans.steps[i] === -1){ g.items.push({ state: "miss", text: (st.label || "Step " + (i + 1)) + " — not confirmed. Correct: " + st.options[st.correct] }); }
        else { g.W++; g.items.push({ state: "bad", text: (st.label || "Step " + (i + 1)) + " — wrong. Correct: " + st.options[st.correct] + ". " + st.why }); }
      }
      break;
    default:
      g = { H: 0, W: 0, N: 1, items: [] };
  }
  var raw = g.N > 0 ? Math.max(0, (g.H - g.W) / g.N) : 0;
  var penalty = hintUsed ? 0.10 : 0;
  var credit = Math.max(0, raw - penalty);
  var head = raw >= 0.999 ? "ok" : (raw <= 0.001 ? "bad" : "part");
  var headText = head === "ok" ? "✓ Correct" : (head === "bad" ? "✗ Incorrect" : "✓ Partially correct");
  var res = {
    credit: credit, raw: raw, head: head, headText: headText,
    H: g.H, W: g.W, N: g.N,
    items: g.items || [], warn: g.warn || [], canon: g.canon || null,
    itemsByKey: {}
  };
  if(ex.type === "fill"){
    for(var k1 = 0; k1 < (g.items || []).length; k1++) res.itemsByKey["b" + k1] = g.items[k1].state;
  } else if(ex.type === "logview" && ex.widget.type === "fill"){
    for(var k2 = 0; k2 < (g.items || []).length; k2++) res.itemsByKey["wb" + k2] = g.items[k2].state;
  }
  return res;
}

/* ==== check / feedback ==== */
function onCheck(){
  var i = curPos();
  var ex = EXAMS[i];
  if(S.checked[i] != null) return;
  if(S.tState === "RUNNING") setTimerState("PAUSED_AUTO_CHECK");
  var res = grade(ex, ensureAnswer(ex, i), S.hintsUsed[i] === true);
  res.wres = null;
  if(ex.type === "logview"){
    res.wres = { items: res.items, H: res.H, W: res.W, N: res.N };
  }
  S.checked[i] = res;
  S.score += res.credit;
  renderExercise();
}
function renderFeedback(i, res){
  var ex = EXAMS[i];
  var rows = "";
  res.items.forEach(function(it){
    var ic = it.state === "ok" ? "✓" : (it.state === "bad" ? "✗" : "○");
    rows += '<div class="fi ' + it.state + '"><span class="ic" aria-hidden="true">' + ic + '</span><span>' + esc(String(it.text).replace(/^[✓✗○]\s*/, "")) + "</span></div>";
  });
  (res.warn || []).forEach(function(wn){
    rows += '<div class="fi warn"><span class="ic" aria-hidden="true">⚠</span><span>' + esc(wn) + "</span></div>";
  });
  if(S.hintsUsed[i]) rows += '<div class="fi note"><span class="ic" aria-hidden="true">💡</span><span>Hint used on this exercise — credit reduced by 0.10.</span></div>';
  var explain = String(ex.explanation).split(/\n\n+/).map(function(p){ return "<p>" + esc(p) + "</p>"; }).join("");
  var canon = res.canon ? '<div class="mono" role="figure" aria-label="Canonical command">canonical: ' + esc(res.canon) + "</div>" : "";
  $("fbslot").innerHTML = '<div class="fb ' + res.head + '" role="status">' +
    '<div class="fb-head"><span aria-hidden="true">' + (res.head === "ok" ? "✓" : res.head === "bad" ? "✗" : "✓") + "</span><span>" + esc(res.headText.replace(/^[✓✗]\s*/, "")) + '</span><span class="fb-credit">credit ' + res.credit.toFixed(2) + " / 1.00" +
    (res.N > 1 ? " (" + res.H + "✓ " + res.W + "✗ " + (res.N - res.H - res.W) + "○ of " + res.N + ")" : "") + "</span></div>" +
    '<div class="fb-body">' + rows + canon +
    '<div class="fb-explain">' + explain + '<div class="fb-study">📚 ' + esc(ex.study) + "</div></div>" +
    "</div></div>";
  $("btn-check").disabled = true;
  $("btn-check").textContent = "✓ Checked";
  var nb = $("btn-next");
  nb.disabled = false;
  nb.focus();
  var lastMain = S.phase === "main" && S.idx === S.order.length - 1;
  nb.innerHTML = S.phase === "review" ? "Back to review list" : (lastMain ? "Final submit &amp; results" : "Next exercise");
  $("actnote").textContent = "";
  updateHeader();
}

/* ==== flow ==== */
function startExam(){
  S.order = shuffle(EXAMS.map(function(_, i){ return i; }));
  S.idx = 0;
  S.phase = "main";
  setTimerState("RUNNING");
  renderExercise();
}
function onCheckGuard(){ /* reserved */ }
function onNext(){
  if(S.phase === "review"){
    if(S.tState === "PAUSED_AUTO_CHECK") setTimerState("RUNNING");
    showReview();
    return;
  }
  if(S.tState === "PAUSED_AUTO_CHECK") setTimerState("RUNNING");
  if(S.idx < S.order.length - 1){
    S.idx++;
    renderExercise();
  } else {
    if(pendingSkips().length > 0) showReview();
    else finish();
  }
}
function onSkip(){
  if(S.phase === "review") return;
  var i = curPos();
  if(S.checked[i] != null) return;
  if(S.skipList.indexOf(i) === -1) S.skipList.push(i);
  $("actnote") && ($("actnote").textContent = "");
  if(S.idx < S.order.length - 1){
    S.idx++;
    renderExercise();
  } else {
    if(pendingSkips().length > 0) showReview();
    else finish();
  }
  updateHeader();
}
function onHint(){
  var i = curPos();
  var ex = EXAMS[i];
  if(S.checked[i] != null || S.hintsUsed[i]) return;
  S.hintsUsed[i] = true;
  $("hintslot").innerHTML = hintHTML(ex);
  $("btn-hint").disabled = true;
  updateHeader();
}
function showReview(){
  S.screen = "review";
  S.phase = "review";
  S.reviewPos = -1;
  var pend = pendingSkips();
  S.reviewTotal = pend.length;
  var m = $("main");
  if(pend.length === 0){ finish(); return; }
  var rows = pend.map(function(exIdx, k){
    var ex = EXAMS[exIdx];
    return '<div class="revrow"><span class="rn">#' + (k + 1) + '</span><span class="rt"><b>' + esc(ex.title) + "</b> — " + esc(ex.summary) + "</span>" +
      '<span class="badge-skip">⚠ Skipped</span><button class="btn" data-ex="' + exIdx + '" type="button">Answer now</button></div>';
  }).join("");
  m.innerHTML =
    '<section class="blk blk-question" style="--blk:var(--amber)"><div class="blk-label"><span class="dot"></span>REVIEW SKIPPED EXERCISES</div>' +
    '<p class="q-text">You skipped ' + pend.length + ' exercise' + (pend.length > 1 ? "s" : "") + '.</p>' +
    '<p class="scen-body" style="color:var(--ink-dim);margin:8px 0 14px">Answer them now, or leave them — exercises you never answer are excluded from both your score and the total. <span class="dim">The timer is still running.</span></p>' +
    '<div class="revlist">' + rows + "</div>" +
    '<div class="actions" style="margin-top:16px"><button class="btn btn-primary" id="btn-finish" type="button">Finish exam — see results</button></div></section>';
  var btns = byClass(m, "btn");
  for(var b = 0; b < btns.length; b++){
    (function(btn){
      if(btn.hasAttribute("data-ex")){
        btn.addEventListener("click", function(){
          S.idx = S.order.indexOf(parseInt(btn.getAttribute("data-ex"), 10));
          S.reviewPos = pendingSkips().indexOf(parseInt(btn.getAttribute("data-ex"), 10));
          renderReviewItem();
        });
      }
    })(btns[b]);
  }
  $("btn-finish").addEventListener("click", function(){ finish(); });
  updateHeader();
}
function renderReviewItem(){
  var exIdx = curPos();
  S.screen = "review";
  renderExercise();
  var nb = $("btn-next");
  nb.innerHTML = "Back to review list";
  updateHeader();
}
function finish(){
  setTimerState("ENDED");
  S.screen = "results";
  var m = $("main");
  var total = 0, full = 0, part = 0, bad = 0, skipped = 0;
  var partSum = 0;
  for(var i = 0; i < EXAMS.length; i++){
    if(S.checked[i] != null){
      total++;
      var c = S.checked[i].credit;
      if(c >= 0.999){ full++; }
      else if(c > 0){ part++; partSum += c; }
      else bad++;
    } else skipped++;
  }
  var rounded = Math.round(S.score);
  var percent = total > 0 ? Math.round(rounded / total * 100) : 0;
  var passed = percent >= META.passMark;
  var pctColor = passed ? "var(--green)" : "var(--red)";
  var verdict = passed
    ? '<span class="res-verdict pass"><span aria-hidden="true">✓</span> PASSED</span>'
    : '<span class="res-verdict fail"><span aria-hidden="true">✗</span> NOT PASSED</span>';
  var avgPart = part > 0 ? (partSum / part) : 0;
  var rows = "";
  for(var q = 0; q < EXAMS.length; q++){
    var qi = S.order[q];
    var exq = EXAMS[qi];
    var st, cls;
    if(S.checked[qi] != null){
      var cc = S.checked[qi].credit;
      if(cc >= 0.999){ st = "✓ Correct"; cls = "st-ok"; }
      else if(cc > 0){ st = "✓ Partially correct"; cls = "st-part"; }
      else { st = "✗ Incorrect"; cls = "st-bad"; }
    } else { st = "⚠ Skipped — not answered"; cls = "st-skip"; }
    rows += "<tr><td>" + (q + 1) + "</td><td>" + esc(TYPE_LABEL[exq.type].name) + "</td><td>" + esc(exq.title) + '</td><td class="num">' +
      (S.checked[qi] != null ? S.checked[qi].credit.toFixed(2) : "—") + '</td><td class="' + cls + '">' + st + "</td></tr>";
  }
  m.innerHTML =
    '<section class="res-head"><div class="ring" style="--pct:' + percent + ";--rc:" + pctColor + '" role="img" aria-label="Final score ' + percent + ' percent"><div class="rin"><div><div class="pct">' + percent + '%</div><div class="of">SCORED</div></div></div></div>' +
    "<div>" + verdict +
      '<div class="res-sub">' + esc(META.attackId + " " + META.attackName + " — " + META.severity.replace("_"," ")) + "</div>" +
      '<div class="res-sub">Points: <b>' + S.score.toFixed(2) + "</b> (posted as " + rounded + ") from <b>" + total + "</b> answered of " + EXAMS.length + " · pass mark " + META.passMark + "%</div>" +
      '<div class="res-sub">Active time: <b>' + fmtClock(S.elapsed) + "</b> · budget " + META.timerMinutes + ":00</div>" +
    "</div></section>" +
    '<div class="statgrid">' +
      '<div class="statcard"><div class="sv ok">' + full + '</div><div class="sl">✓ Fully correct</div></div>' +
      '<div class="statcard"><div class="sv part">' + part + '</div><div class="sl">✓ Partial (avg ' + avgPart.toFixed(2) + ')</div></div>' +
      '<div class="statcard"><div class="sv bad">' + bad + '</div><div class="sl">✗ Fully incorrect</div></div>' +
      '<div class="statcard"><div class="sv skip">' + skipped + '</div><div class="sl">⚠ Skipped, never answered</div></div>' +
    "</div>" +
    '<div class="pausereport">⏱ <b>Pause report</b> — auto-paused during checks: <b>' + fmtClock(S.pauseAutoCheck) + "</b> · manual pauses: <b>" + fmtClock(S.pauseManual) + "</b>. No time passes during pauses.</div>" +
    '<table class="restable"><thead><tr><th>#</th><th>Type</th><th>Exercise</th><th>Credit</th><th>Result</th></tr></thead><tbody>' + rows + "</tbody></table>" +
    '<div class="actions" style="margin-top:18px"><button class="btn btn-primary" id="btn-retake" type="button">↻ Retake exam (reshuffled)</button></div>';
  $("btn-retake").addEventListener("click", retake);
  updateHeader();
  window.scrollTo(0, 0);
  setTimeout(postScore, 600);
}
function retake(){
  S.order = [];
  S.idx = 0;
  S.phase = "main";
  S.skipList = [];
  S.answers = {};
  S.checked = {};
  S.hintsUsed = {};
  S.score = 0;
  S.tState = "IDLE";
  S.tStateAt = null;
  S.pausedFrom = null;
  S.remaining = META.timerMinutes * 60;
  S.elapsed = 0;
  S.pauseManual = 0;
  S.pauseAutoCheck = 0;
  S.scorePosted = false;
  var po = $("pauseoverlay");
  po.classList.add("hidden");
  $("main").classList.remove("hidden");
  showIntro();
}

/* ==== pause / hint / skip wiring ==== */
$("btn-hint").addEventListener("click", onHint);
$("btn-skip").addEventListener("click", onSkip);
$("btn-pause").addEventListener("click", function(){
  if(S.tState === "RUNNING"){
    S.pausedFrom = null;
    setTimerState("PAUSED_MANUAL");
    $("pauseoverlay").classList.remove("hidden");
    $("main").classList.add("hidden");
    $("btn-resume").focus();
  } else if(S.tState === "PAUSED_AUTO_CHECK"){
    S.pausedFrom = "PAUSED_AUTO_CHECK";
    setTimerState("PAUSED_MANUAL");
    $("pauseoverlay").classList.remove("hidden");
    $("main").classList.add("hidden");
    $("btn-resume").focus();
  }
});
$("btn-resume").addEventListener("click", function(){
  $("pauseoverlay").classList.add("hidden");
  $("main").classList.remove("hidden");
  if(S.pausedFrom === "PAUSED_AUTO_CHECK"){
    S.pausedFrom = null;
    setTimerState("PAUSED_AUTO_CHECK");
  } else {
    setTimerState("RUNNING");
  }
});

/* ==== boot ==== */
$("tb-title").textContent = META.attackId + " " + META.attackName;
$("foot-meta").textContent = META.attackId + " · " + META.severity.replace("_", " ") + " · pass " + META.passMark + "%";
showIntro();

/* ==== automation hook (offline lab use) ==== */
function buildCorrectAns(ex){
  var i, a;
  switch(ex.type){
    case "mcq": return { sel: ex.correct };
    case "multi": return { sel: ex.correct.slice() };
    case "match":
      a = []; for(i = 0; i < ex.pairs.length; i++) a.push(i); return { assign: a };
    case "order":
      a = []; for(i = 0; i < ex.items.length; i++) a.push(i); return { seq: a };
    case "fill":
      a = []; for(i = 0; i < ex.blanks.length; i++) a.push(ex.blanks[i]); return { vals: a };
    case "terminal": return { cmd: ex.expected };
    case "logview": return { w: buildCorrectAns(ex.widget) };
    case "decision":
      a = []; for(i = 0; i < ex.steps.length; i++) a.push(ex.steps[i].correct);
      return { steps: a, cursor: ex.steps.length };
  }
  return {};
}
function buildWrongAns(ex){
  var i, a;
  switch(ex.type){
    case "mcq": return { sel: ex.correct === 0 ? 1 : 0 };
    case "multi": {
      var wrong = [];
      for(i = 0; i < ex.options.length && wrong.length < 1; i++){ if(ex.correct.indexOf(i) === -1) wrong.push(i); }
      return { sel: wrong };
    }
    case "match":
      a = []; for(i = 0; i < ex.pairs.length; i++) a.push((i + 1) % ex.pairs.length); return { assign: a };
    case "order":
      a = []; for(i = ex.items.length - 1; i >= 0; i--) a.push(i); return { seq: a };
    case "fill":
      a = []; for(i = 0; i < ex.blanks.length; i++) a.push("zz wrong"); return { vals: a };
    case "terminal": return { cmd: "echo zzz" };
    case "logview": return { w: buildWrongAns(ex.widget) };
    case "decision":
      a = []; for(i = 0; i < ex.steps.length; i++){ var w2 = (ex.steps[i].correct + 1) % ex.steps[i].options.length; a.push(w2); }
      return { steps: a, cursor: ex.steps.length };
  }
  return {};
}
window.__CP = {
  S: S,
  META: META,
  EXAMS: EXAMS,
  start: function(){ startExam(); },
  state: function(){
    return { screen: S.screen, tState: S.tState, remaining: S.remaining, elapsed: S.elapsed,
             score: S.score, idx: S.idx, phase: S.phase, posted: S.scorePosted };
  },
  correctAns: buildCorrectAns,
  wrongAns: buildWrongAns,
  fill: function(ans){ var i = curPos(); S.answers[i] = JSON.parse(JSON.stringify(ans)); renderExercise(); },
  fillIdx: function(idx, ans){ S.answers[idx] = JSON.parse(JSON.stringify(ans)); },
  check: function(){ onCheck(); },
  next: function(){ onNext(); },
  skip: function(){ onSkip(); },
  hint: function(){ onHint(); },
  gradeOne: function(i, ans){ return grade(EXAMS[i], ans, false); },
  pause: function(){ $("btn-pause").click(); },
  resume: function(){ $("btn-resume").click(); },
  finish: function(){ finish(); },
  postScore: postScore
};
</script>
