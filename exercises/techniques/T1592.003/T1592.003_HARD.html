020, which the ATT&amp;CK page cites.<\/div>\n<div class=\"prose\" style=\"margin-top:8px\"><b>Who works with this in a real job?<\/b> A <b>SOC analyst<\/b> triages alerts and must judge why odd device reads matter. A <b>threat-intelligence analyst<\/b> writes behaviour reports using IDs like T1592.003 as a shared language. A <b>detection engineer<\/b> builds rules and learns from analytic AN1950 that this activity is noisy and largely invisible, so detection focuses on later stages such as Initial Access. A <b>threat hunter<\/b> diffs SNMP walks against the NMS baseline. An <b>incident responder<\/b> reconstructs what an attacker learned before the break-in. A <b>red teamer<\/b> plays the same steps in sanctioned tests. A <b>GRC or control owner<\/b> maps mitigation M1056: you cannot fully prevent pre-compromise recon, so you <b>minimise the firmware data the outside world can see<\/b>.<\/div>\n<div class=\"prose\" style=\"margin-top:8px\"><b>Tools and documents you will meet:<\/b> the ATT&amp;CK site and Navigator, asset inventories, vendor advisories, SNMP tooling (snmpwalk), command-line readers (dmidecode, sysfs), web-console logs, and short reports. In this exam you will read logs, sort artefacts, build commands in a safe fake shell, and make small decisions - like the real job. All addresses in the exercises are defanged on purpose (written like 10[.]20[.]5[.]31), a professional reporting habit.<\/div>\n", "rules": [{"icon": "◉", "title": "Goal and pass mark", "body": "Answer exercises, earn credits. Your score is the sum of credits over the exercises you answered, divided by how many you answered. <b>Pass mark: 70%.<\/b>"}, {"icon": "∑", "title": "Partial credit", "body": "Exercises with several correct items are scored per item: each right item adds credit, each wrong pick subtracts. A partly right answer still earns partial credit - but selecting everything can cancel your credit to zero."}, {"icon": "⏸", "title": "Check buys unlimited thinking time", "body": "Pressing <b>Check<\/b> stops the timer automatically. Study the feedback as long as you want - the timer runs again only when you press <b>Next<\/b> (or <b>Final Submit<\/b> on the last exercise)."}, {"icon": "❚❚", "title": "Manual pause", "body": "The <b>Pause<\/b> button stops the timer and hides the exercise for a real break. Press <b>Resume<\/b> to continue where you were."}, {"icon": "⏭", "title": "Skip and come back", "body": "Every exercise has <b>Skip<\/b>. Skipped exercises wait in a pool; before finishing you can return to them as often as you like while the timer is running. Skipped-and-never-answered exercises are simply excluded from your score."}, {"icon": "○", "title": "One hint per exercise", "body": "A hint costs <b>10% of that exercise's credit<\/b> and pushes you in the right direction - it never gives the answer away."}, {"icon": "⏱", "title": "Timer", "body": "The timer is tuned to this file's difficulty and length. Watch its state in the header: running, paused manually, paused for feedback, or ended."}, {"icon": "⚑", "title": "Retake", "body": "Fail the pass mark and you can retake the exam - questions and answer positions are shuffled again."}, {"icon": "⚑", "title": "This file's severity", "body": "This is the <b>HARD<\/b> file: near-miss answers, correlated artefacts, and traps - things that look alarming but are routine, and routine-looking things that are not. Exercise types you will meet: single and multi-answer questions, drag-and-drop sorting, matching, gap-fill sentences, ordering and ranking, clickable spot-the-flaw, a safe fake terminal, and branching decision scenarios."}], "meta": "Site integration: topicId t1592.003 - batch 3 - pass mark 70 - 16 exercises - about 55 minutes.", "foot": "All indicators are defanged. Nothing in this file contacts the network."}, "keywords": [{"theme": "Analytics and tuning", "chips": ["Detection Strategy DET0818", "Analytic AN1950", "False-positive profile", "Baseline vs anomaly", "Delta-based alerting"]}, {"theme": "Telemetry sources", "chips": ["SNMP logs", "NetFlow", "Web console access logs", "PCAP", "NMS inventory", "Attack-surface management"]}, {"theme": "Lifecycle chains", "chips": ["T1596 Search Open Technical Databases", "T1587 Develop Capabilities", "T1190 Exploit Public-Facing Application", "T1195 Supply Chain Compromise", "Focus on Initial Access"]}, {"theme": "Exposure channels and leaks", "chips": ["Assessment reports", "Purchase invoices", "Resumes", "Leaked design material (Intel 20 GB dump, Aug 2020)", "Accessible data sets"]}, {"theme": "Realistic discrimination", "chips": ["NMS polling vs attacker walk", "T1046 Network Service Discovery", "T1018 Remote System Discovery", "Sibling near-misses"]}], "exercises": [{"id": "H1", "type": "multi", "summary": "Separate the attacker's walk from routine polling", "scenario": ["You review an overnight capture on the device-management VLAN. Artefact 1 is the NMS baseline; artefact 2 is the overnight capture.", {"label": "ARTEFACT 1 - NMS baseline (documented)", "mono": true, "text": "06:00:01  10[.]20[.]1[.]10 -> 10[.]20[.]5[.]31  SNMP GET sysDescr.0   (nms-01, scheduled)\n06:00:04  10[.]20[.]1[.]10 -> 10[.]20[.]5[.]32  SNMP GET sysDescr.0   (nms-01, scheduled)"}, {"label": "ARTEFACT 2 - overnight capture", "mono": true, "text": "02:14:11  198[.]51[.]100[.]77 -> 10[.]20[.]5[.]31  SNMP GETNEXT sysDescr.0\n02:14:12  198[.]51[.]100[.]77 -> 10[.]20[.]5[.]31  SNMP GET sysUpTime.0\n02:14:13  198[.]51[.]100[.]77 -> 10[.]20[.]5[.]31  SNMP GET sysContact.0\n02:41:05  10[.]20[.]1[.]10   -> 10[.]20[.]5[.]31  SNMP GET sysDescr.0   (nms-01, ad-hoc)\n02:58:44  198[.]51[.]100[.]77 -> 10[.]20[.]5[.]33  SNMP GET sysDescr.0"}], "question": "Select every capture line that shows likely attacker firmware recon (T1592.003). Wrong picks subtract credit.", "options": ["02:14:11 external GETNEXT sysDescr.0 -> .31", "02:14:12 external GET sysUpTime.0 -> .31", "02:14:13 external GET sysContact.0 -> .31", "02:41:05 nms-01 ad-hoc GET sysDescr.0 -> .31", "02:58:44 external GET sysDescr.0 -> .33"], "correct": [0, 4], "hint": "Firmware recon reads firmware-bearing strings. Then ask: who is allowed to poll this VLAN, and who isn't?", "explain": "Lines 1 and 5 come from an external, unmanaged source and read sysDescr.0 - the firmware-bearing object - on two devices: clear T1592.003 behaviour. Line 2 (sysUpTime) and line 3 (sysContact) are host facts but not firmware, so they fail the technique match even though the same actor sent them. Line 4 is the registered NMS working ad-hoc - looks alarming, is routine: the source is known and managed.", "study": "Two tests per line: does it carry a firmware string, and is the source expected?", "perItem": {"o1": {"ok": "", "no": "sysUpTime reveals uptime, not firmware - host info, but not T1592.003."}, "o2": {"ok": "", "no": "sysContact reveals a contact record - not a firmware string."}, "o3": {"ok": "", "no": "nms-01 is the registered NMS on this VLAN - alarming-looking, but routine."}}}, {"id": "H2", "type": "qcm", "summary": "Console log: which line is the recon evidence?", "scenario": ["The edge gateway's web console keeps access logs. Three known actors and one unknown appear.", {"label": "ARTEFACT 1 - gateway console access log", "mono": true, "text": "10[.]20[.]8[.]44    GET  /admin/firmware/upgrade   200   (admin workstation)\n198[.]51[.]100[.]77 GET  /admin/firmware/          200   (unknown)\n198[.]51[.]100[.]77 POST /admin/firmware/upgrade   403\n10[.]20[.]1[.]10    GET  /admin/firmware/          200   (nms-01 monitoring job)"}], "question": "Which single line is clear evidence of T1592.003 reconnaissance - not administration and not monitoring?", "options": ["The unknown IP reading /admin/firmware/ (200)", "The admin workstation calling the upgrade page (200)", "The NMS job reading the firmware page (200)", "The 403 response to the upgrade POST"], "correct": [0], "hint": "Two readers are known and expected. One reader is unknown - and reading, not writing.", "explain": "The unknown source successfully reading the firmware page is exactly 'gather firmware information about the victim'. The admin and the NMS are legitimate, documented readers of the same page - proof that the artefact alone is not enough without source context. The 403 POST is a blocked state-changing attempt - alarming, but that is an exploitation or tampering attempt, not reconnaissance.", "study": "Same artefact, different actors: the source and its expectation decide the mapping.", "perItem": {}}, {"id": "H3", "type": "qcm", "summary": "Why ATT&CK cites the 2020 Intel material dump", "scenario": ["Your CTI lead asks why the T1592.003 page carries this reference.", {"label": "ARTEFACT 1 - reference from the ATT&CK page", "mono": true, "text": "Goodin, D. & Salter, J. (2020, August 6).\nMore than 20GB of Intel source code and proprietary data dumped online."}], "question": "Why does ATT&CK cite this case for T1592.003?", "options": ["Leaked design material can expose firmware and host details as an accessible data set", "Intel released emergency firmware patches that every router must install", "The dump contained working passwords that opened victim laptops", "It proves one specific group used T1592.003 against Intel in 2020"], "correct": [0], "hint": "The page's description says firmware info may be exposed via 'online or other accessible data sets'.", "explain": "The reporting documents a large accidental exposure of proprietary material - precisely the 'accessible data set' channel the sub-technique describes: attackers do not need to touch the victim when the victim's own material is public. The citation is about the exposure channel, not about patches, stolen passwords, or a group attribution - the page lists no procedure example for this technique.", "study": "Note how ATT&CK cites references: they support the description's claims, nothing more.", "perItem": {}}, {"id": "H4", "type": "dnd", "summary": "Four-way sort: T1592.003, T1592.002, T1046, T1018", "scenario": ["Six artefacts from a hunt need precise ATT&CK labels before the report goes out. Near-misses are intentional."], "question": "Drag each artefact to the technique it maps to.", "items": [{"id": "a1", "text": "SNMP GET sysDescr.0 returns 'Firmware 8.2.4'"}, {"id": "a2", "text": "Inventory job lists 'Python 3.10.4' on the host"}, {"id": "a3", "text": "Ping sweep across the /24 reports live hosts"}, {"id": "a4", "text": "Full TCP port scan on one host lists open services"}, {"id": "a5", "text": "Web console read: 'UEFI 2.17, Secure Boot on'"}, {"id": "a6", "text": "Patch report lists 'OpenSSL 1.1.1k' in use"}], "zones": [{"id": "z1", "label": "T1592.003 Firmware"}, {"id": "z2", "label": "T1592.002 Software"}, {"id": "z3", "label": "T1018 Remote System Discovery"}, {"id": "z4", "label": "T1046 Network Service Discovery"}], "hint": "Two lines expose firmware strings. Two lines are scans: one finds hosts, one finds services. Two lines list installed software.", "explain": "sysDescr firmware strings and the UEFI console read map to T1592.003. Python and OpenSSL versions are installed-software facts - T1592.002. The sweep that asks 'which hosts exist' is Remote System Discovery (T1018); the deep scan that asks 'which ports are open' is Network Service Discovery (T1046). The two scan techniques are the classic near-miss for host-information recon.", "study": "Host-information techniques read facts about a host; discovery techniques map the environment.", "perItem": {"a3": {"ok": "", "no": "A sweep that enumerates live hosts is T1018 - it learns existence, not firmware facts."}, "a4": {"ok": "", "no": "A port scan listing services is T1046 - no firmware or software version disclosed."}}, "correct": {"a1": "z1", "a2": "z2", "a3": "z3", "a4": "z4", "a5": "z1", "a6": "z2"}}, {"id": "H5", "type": "terminal", "summary": "One read-only command for the BIOS version (Windows host)", "scenario": ["Case IR-2311. You sit on a recovered shell of a compromised Windows workstation called ws-4471. The responder lead needs the host's BIOS/firmware version. Rules of engagement: nothing may be written to disk, the device stays online, and you may run exactly one command. No tool is named for you."], "question": "Type one read-only command that prints the BIOS/firmware version of this Windows host.", "terminal": {"prompt": "C:\\> ", "banner": "Live-response shell on COMPROMISED host. One command. No writes.", "canonical": "wmic bios get smbiosbiosversion", "elements": [{"re": "\\bwmic\\b", "label": "the wmic tool (the Windows WMI command line)"}, {"re": "\\bbios\\b", "label": "the BIOS alias"}, {"re": "\\bget\\b", "label": "the get verb (reads, never sets)"}, {"re": "smbiosbiosversion", "label": "the SMBIOSBIOSVersion property"}], "forbidden": [{"re": ">\\s*\\S+", "label": "redirecting output into a file", "why": "the rules forbid writes", "danger": true, "dangerMsg": "Redirecting the output writes a file onto a compromised disk and can change timestamps. Print to the screen and note the value in your log instead."}, {"re": "/append:|/output:|/record:", "label": "wmic switches that write files", "why": "the rules forbid writes", "danger": true, "dangerMsg": "/append:, /output: and /record: make wmic write files on the compromised disk - a state change the rules of engagement forbid."}, {"re": "\\bshutdown\\b|\\breboot\\b", "label": "shutdown or reboot", "why": "the device must stay online", "danger": true, "dangerMsg": "Rebooting destroys volatile state and can alter firmware-adjacent evidence."}], "successOut": "SMBIOSBIOSVersion  \n2.14.0", "failOut": "ERROR: Description = Invalid query - check the alias, the verb, and the property name", "explainParts": [{"part": "wmic", "why": "the classic Windows command line for WMI, which exposes firmware facts"}, {"part": "bios", "why": "the WMI alias that maps to the Win32_BIOS class holding firmware data"}, {"part": "get", "why": "a read-only verb: it only prints properties, it never changes state"}, {"part": "smbiosbiosversion", "why": "the exact property that carries the BIOS/firmware version string"}]}, "hint": "Windows exposes firmware facts through WMI. Pick the class alias for BIOS data and the verb that only reads.", "explain": "wmic bios get smbiosbiosversion answers the question in one read-only line: wmic is the WMI command line, bios is the alias for the BIOS class, get only prints, and smbiosbiosversion holds the firmware string. The near-misses all violate the rules of engagement: redirection and the /append:, /output: and /record: switches write to the compromised disk, and a reboot destroys volatile state. HARD terms: no tool was named, and every tempting state-changing variant is a trap.", "study": "Windows probe: wmic bios get smbiosbiosversion. Its Linux twin: dmidecode -s bios-version.", "perItem": {}}, {"id": "H6", "type": "branch", "summary": "Dual perspective: SNMP exposure, red then blue (3 steps)", "scenario": ["Sanctioned lab, one scenario, two hats. The NMS segment holds a legacy SNMP v2c read community. The gateway answers sysDescr with its firmware string."], "question": "Play each side in turn. The chain is graded at the final check.", "steps": [{"question": "RED: You hold a valid SNMP read community on the NMS segment. Which single object best reveals firmware strings?", "options": ["SNMPv2-MIB::sysDescr", "IF-MIB::ifNumber", "SNMPv2-MIB::sysUpTime", "HOST-RESOURCES-MIB::hrStorageSize"], "correct": 0, "outcome": "sysDescr is the device's business card: model and firmware version.", "whyOk": "sysDescr.0 typically carries model plus firmware version - the T1592.003 payload.", "whyNo": "Interface counts, uptime, and storage size are useful recon, but none carries the firmware string."}, {"question": "RED: The string shows the gateway runs end-of-life firmware. Best next recon move?", "options": ["Immediately brute-force the gateway's login page with a wordlist", "Wipe the NMS inventory database to hide your lab access", "Search open technical databases for that version's flaws (T1596)", "Post the finding immediately on the company's public chat"], "correct": 2, "outcome": "You stay in recon and build capability knowledge before any touch.", "whyOk": "The version is a search key; T1596 turns it into vulnerability knowledge with zero contact.", "whyNo": "Brute force makes noise and creates events; wiping destroys your own access; posting burns the op."}, {"question": "BLUE: Same environment, your turn as defender. Which single change most reduces this exposure?", "options": ["Rename the NMS server so scans stop recognising it", "Move to SNMPv3 and restrict read communities to the NMS VLAN", "Disable all logging on the gateway to hide it from attackers", "Add more devices to the same community to simplify management"], "correct": 1, "outcome": "The easy read path closes: authenticated SNMP, restricted sources.", "whyOk": "SNMPv3 removes plaintext communities, and source restriction kills walks from anywhere else.", "whyNo": "Renaming changes nothing; less logging blinds you; more devices on one community widens the exposure."}], "hint": "Step 1: which MIB object is the device's business card? Step 3: remove the read path itself.", "explain": "Attacker perspective: sysDescr gives the firmware fact, T1596 turns it into flaw knowledge, all without touching the victim beyond allowed reads. Defender perspective: the durable fix is protocol and network design - SNMPv3 plus source restriction - not renaming or log removal. This is the dual view of the same exposure: one side reads it, the other side removes it.", "study": "For every recon path you can play, write the one control that removes the read path.", "perItem": {}}, {"id": "H7", "type": "clickwrong", "summary": "Find the flaws in the analytic draft", "scenario": ["A detection engineer drafted an analytic for T1592.003. Review the six draft lines before it reaches the SIEM."], "question": "Select every flawed line. Selecting a sound line subtracts credit.", "lines": [{"text": "Analytic draft (SNMP firmware recon) - v0", "mono": true, "flawed": false}, {"text": "alert on any SNMP packet containing the string 'Firmware' or 'BIOS'", "mono": true, "flawed": true}, {"text": "index=snmp, search the raw payload for 'Firmware'", "mono": true, "flawed": true}, {"text": "compare every walk source against the NMS inventory before alerting", "mono": true, "flawed": false}, {"text": "alert when a non-NMS source requests sysDescr.0", "mono": true, "flawed": false}, {"text": "auto-block the source IP on the perimeter firewall, no validation", "mono": true, "flawed": true}], "hint": "The AN1950 warning is about noise: two lines alert on traffic that is normal all day. One line reacts before validation.", "explain": "Lines 2 and 3 keyword-match on strings that routine NMS polls carry constantly - the high-occurrence, high-false-positive trap AN1950 describes; they will flood the queue. Line 6 automates blocking with no validation - the least-aggressive principle says validate first, since a wrong block against a managed source has real business cost. Lines 4 and 5 are the sound core: source-based baseline and a targeted non-NMS alert.", "study": "Turn AN1950's warning into design rules: baseline, delta, validate - never bare keywords.", "perItem": {"l1": {"ok": "Raw-payload keyword search has the same noise problem as line 2.", "no": "Raw SNMP payload search is exactly the high-noise approach AN1950 warns about."}, "l5": {"ok": "Blocking before validation can cut off a managed source - costly and often wrong.", "no": "Auto-blocking without validation is the aggressive move; validate scope and source first."}}}, {"id": "H8", "type": "qcm", "summary": "Benign-looking poll that is actually alarming", "scenario": ["Your new SNMP analytic fired. The polled object is sysDescr.0 across 40 devices.", {"label": "ARTEFACT 1 - alert detail", "mono": true, "text": "source: 10[.]20[.]1[.]99  (NOT in NMS inventory)\nobjects: sysDescr.0 x 40 devices\nwindow:  03:00-03:04\ninventory says the only NMS is 10[.]20[.]1[.]10"}], "question": "Why is this alert alarming despite looking like routine polling?", "options": ["The source is not the registered NMS and the poll window is odd", "sysDescr.0 is classified data that never leaves devices", "SNMP GET responses always mean data theft", "03:00 polls are illegal under the security policy"], "correct": [0], "hint": "Compare the source with the inventory. Then ask whether the time fits normal polling.", "explain": "The two deltas from baseline decide it: the source is unmanaged (the inventory names 10[.]20[.]1[.]10 as the only NMS), and the window matches no schedule. An internal-looking address that is not an asset suggests spoofing or an unknown foothold - both worse than an external scan. sysDescr is ordinary data, GET responses are how polling works, and no policy makes 03:00 illegal per se - the deltas carry the signal.", "study": "Alert on source-and-schedule deltas, not on the polled object itself.", "perItem": {}}, {"id": "H9", "type": "dnd", "summary": "Coverage gaps in the Reconnaissance column", "scenario": ["Your control matrix covers part of the Reconnaissance column. Place each row into the right zone so the gap review can start.", {"label": "ARTEFACT 1 - control matrix excerpt", "mono": true, "text": "T1595 Active Scanning ......... covered: IDS signatures\nT1592.001 Hardware ............ covered: CMDB audit\nT1592.002 Software ............ covered: patch report diff\nT1592.003 Firmware ............ (no control listed)\nT1598 Phishing for Information  (no control listed)\nT1592.004 Client Configs ...... covered: endpoint baseline"}], "question": "Drag each technique to its coverage zone.", "items": [{"id": "g1", "text": "T1595 Active Scanning"}, {"id": "g2", "text": "T1592.001 Hardware"}, {"id": "g3", "text": "T1592.002 Software"}, {"id": "g4", "text": "T1592.003 Firmware"}, {"id": "g5", "text": "T1598 Phishing for Information"}, {"id": "g6", "text": "T1592.004 Client Configurations"}], "zones": [{"id": "z1", "label": "Covered by a listed control"}, {"id": "z2", "label": "Gap - needs a firmware-exposure control (T1592.003)"}, {"id": "z3", "label": "Gap - needs an elicitation control (T1598)"}], "hint": "Two rows have no control listed in the artefact. Each gap gets its own zone.", "explain": "Four rows have named controls and are covered. T1592.003 and T1598 are the two gaps. The natural compensating controls: for T1592.003, an exposure-minimisation program (scrub reports, postings, and portals per M1056) plus SNMPv3 and source restrictions; for T1598, awareness training and reporting channels for suspicious surveys. Funding starts with the gap that matches your real exposure.", "study": "Gap reviews end with a named compensating control per gap - never with the word 'gap' alone.", "perItem": {}, "correct": {"g1": "z1", "g2": "z1", "g3": "z1", "g4": "z2", "g5": "z3", "g6": "z1"}}, {"id": "H10", "type": "blank", "summary": "Fill the threat-intel report (IDs and platform)", "scenario": ["Your report INT-2026-04 needs its ATT&CK references filled before review."], "question": "Pick one item for each gap.", "segments": ["Report INT-2026-04: The adversary used ", {"id": "b1"}, " to collect host firmware details. The activity belongs to the ", {"id": "b2"}, " tactic and runs on the ", {"id": "b3"}, " platform. Because pre-compromise activity resists direct prevention (", {"id": "b4"}, "), we recommend minimising firmware data in public sources and watching Initial Access channels."], "bank": ["T1592.003", "Reconnaissance", "PRE", "M1056", "TA0043", "T1046", "M1032"], "blanks": {"b1": ["T1592.003"], "b2": ["Reconnaissance", "TA0043"], "b3": ["PRE"], "b4": ["M1056"]}, "hint": "The sub-technique ID starts with T1592. The mitigation on the page starts with M105.", "explain": "The report names the sub-technique (T1592.003), its tactic (Reconnaissance - TA0043 is equally correct as the tactic ID), the PRE platform, and mitigation M1056. T1046 is a discovery scan and M1032 is multi-factor authentication - both plausible-looking, both wrong here.", "study": "In reports, pair every T-ID with its tactic and platform; reviewers check exactly those fields.", "perItem": {"b2": {"ok": "", "no": "The tactic is Reconnaissance; its tactic ID TA0043 is also accepted."}, "b4": {"ok": "", "no": "The page's mitigation is M1056 Pre-compromise - M1032 is multi-factor authentication."}}, "blanksOrder": ["b1", "b2", "b3", "b4"]}, {"id": "H11", "type": "order", "summary": "Build the IR timeline, exclude the noise entry", "scenario": ["Case IR-2311, day one. Six entries sit in the intake folder; one is planned maintenance with no attacker link.", {"label": "ARTEFACT 1 - intake entries", "text": "A. 08:12 unknown IP reads the gateway firmware info page\nB. 08:30 same IP walks sysDescr on 3 edge devices\nC. 09:04 spearphish referencing the exact gateway model\nD. 11:47 exploit attempt against the gateway (blocked)\nE. 13:20 SOC opens case IR-2311\nF. 14:00 documented maintenance reboot (planned weeks ago)"}], "question": "Order the five case entries and move the unrelated entry to the exclude box.", "items": [{"id": "e1", "text": "A - 08:12 gateway firmware page read"}, {"id": "e2", "text": "B - 08:30 sysDescr walk on 3 devices"}, {"id": "e3", "text": "C - 09:04 spearphish citing the gateway model"}, {"id": "e4", "text": "D - 11:47 blocked exploit attempt"}, {"id": "e5", "text": "E - 13:20 case opened"}, {"id": "e6", "text": "F - 14:00 planned maintenance reboot"}], "excludedId": "e6", "hint": "The timestamps order the attack chain; the maintenance entry has no attacker link at all.", "explain": "The chain runs page read, then walk, then targeted phish, then blocked exploit, then case opening - collection before access attempts, exactly the pre-compromise pattern. The maintenance reboot is documented, planned, and unrelated: putting it in the chain (or treating it as attacker activity) is the classic shortcut error. Note how the walk at 08:30 proves recon before any exploit attempt - evidence that the adversary studied the victim first.", "study": "A timeline without an exclusion step invites noise into the narrative.", "perItem": {"e6": {"ok": "Planned maintenance with no attacker link stays out of the timeline.", "no": "The maintenance reboot is documented and planned - it is noise, not part of the chain."}}, "correct": ["e1", "e2", "e3", "e4", "e5"]}, {"id": "H12", "type": "qcm", "summary": "Least aggressive correct action", "scenario": ["The firewall team wants to hard-block the attacker's /24 immediately. The gateway is a shared service for 800 users. You hold PCAP of read-only SNMP walks and nothing else."], "question": "Which action is correct and least aggressive, given the evidence you hold?", "options": ["Keep the gateway online, restrict SNMP sources, and keep capturing", "Power off the gateway and keep it down until the attacker is caught", "Reboot the gateway right away to clear its ARP cache and sessions", "Delete the SNMP logs so the attacker cannot learn from any leak"], "correct": [0], "hint": "The walks only read. Which option keeps business running and preserves evidence?", "explain": "The evidence shows reads only - recon, not intrusion. The proportionate move closes the read path (source restriction) while keeping the service and the capture running; it also preserves the option to watch for the next step. Powering off blinds 800 users and ends your visibility; rebooting destroys volatile state for no gain; deleting logs destroys evidence - the one unforgivable move in an open case.", "study": "Match response strength to evidence strength; aggressive options need intrusion evidence.", "perItem": {}}, {"id": "H13", "type": "match", "summary": "Match detection opportunities to data sources", "scenario": ["Your detection roadmap needs sources per opportunity. Two decoys are in the list - do not force them."], "question": "For each opportunity, pick the data source that actually records it.", "left": [{"id": "l1", "text": "External SNMP walk of device firmware strings"}, {"id": "l2", "text": "Console firmware page read from outside"}, {"id": "l3", "text": "Our UEFI versions listed in a public report"}, {"id": "l4", "text": "Unmanaged BMC login page exposed to the internet"}], "right": [{"id": "r1", "text": "NetFlow / SNMP telemetry diffed against the NMS inventory"}, {"id": "r2", "text": "Web server access logs of the console"}, {"id": "r3", "text": "Open-source monitoring / brand watch"}, {"id": "r4", "text": "Attack-surface management scanning"}, {"id": "r5", "text": "Endpoint EDR process logs"}, {"id": "r6", "text": "DNS query logs of the corporate resolver"}], "hint": "Think where each signal physically appears: the walk shows in flow data, the page read in web logs.", "explain": "Each signal lives in one place: the walk in flow/SNMP telemetry (diffed against the inventory), the page read in the console's access logs, the public document in open-source monitoring, and the exposed BMC in attack-surface scans. EDR process logs and DNS resolver logs are the decoys - pre-compromise device reads and public documents leave no endpoint process and no resolver query behind.", "study": "A detection without its true data source is a wish, not a control.", "perItem": {"r4": {"ok": "", "no": "EDR logs record processes on endpoints - not walks, page reads, public posts, or internet exposure."}, "r5": {"ok": "", "no": "Resolver logs record DNS queries - none of these four signals is a DNS lookup."}}, "correct": {"l1": "r1", "l2": "r2", "l3": "r3", "l4": "r4"}}, {"id": "H14", "type": "terminal", "summary": "Read-only PCAP analysis for SNMP walks", "scenario": ["You have a full capture, nms-cap.pcap, taken at the core switch and mounted read-only. The lead asks which SNMP objects the external host 198[.]51[.]100[.]77 actually read. No tool is named; the evidence copy must stay untouched."], 'use strict';
/* CyberPulseAcademy practice exam engine - T1592.003 batch files.
   Self-contained: vanilla JS only, no external requests. */
var D = null;            /* exam data injected per file */
var S = null;            /* runtime state */
var TICK = null;

var T_RUNNING = 'RUNNING';
var T_MANUAL = 'PAUSED_MANUAL';
var T_AUTOCHECK = 'PAUSED_AUTO_CHECK';
var T_ENDED = 'ENDED';

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmtTime(sec){ var m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function fmtSum(x){ return (Math.round(x*10)/10).toFixed(1); }

/* Partial-credit scoring (mandatory formula): max(0, (H - W) / N), returned as a real number in [0, 1] */
function scoreExercise(selectedItems, correctItems){
  return scoreDetail(selectedItems, correctItems).credit;
}
function scoreDetail(selectedItems, correctItems){
  var cs = {};
  for (var i=0;i<correctItems.length;i++){ cs[correctItems[i]] = true; }
  var H = 0, W = 0;
  for (var j=0;j<selectedItems.length;j++){ if (cs[selectedItems[j]]) { H++; } else { W++; } }
  var N = correctItems.length;
  var missed = [];
  for (var k=0;k<correctItems.length;k++){ if (selectedItems.indexOf(correctItems[k]) < 0){ missed.push(correctItems[k]); } }
  return { credit: Math.max(0, (H - W) / N), H: H, W: W, N: N, missed: missed };
}

/* ---------- timer state machine ---------- */
function setState(newState){
  if (!S) return;
  var now = Date.now();
  var dt = Math.round((now - S.stateSince)/1000);
  if (S.state === T_RUNNING){ S.timeRunning += dt; }
  else if (S.state === T_MANUAL){ S.timeManualPause += dt; }
  else if (S.state === T_AUTOCHECK){ S.timeFeedbackPause += dt; }
  S.state = newState;
  S.stateSince = now;
  paintTimer();
}
function paintTimer(){
  if (!S) return;
  var el = $('hdrTimer'); if (!el) return;
  var label = '', cls = '';
  if (S.state === T_RUNNING){ label = '\u25B6 RUNNING \u00B7 ' + fmtTime(S.secondsLeft); cls = 't-run'; }
  else if (S.state === T_MANUAL){ label = '\u23F8 PAUSED \u2014 manual (press Resume) \u00B7 ' + fmtTime(S.secondsLeft); cls = 't-manual'; }
  else if (S.state === T_AUTOCHECK){ label = '\u23F8 PAUSED \u2014 reviewing feedback (resumes on Next) \u00B7 ' + fmtTime(S.secondsLeft); cls = 't-auto'; }
  else { label = '\u23F9 ENDED \u00B7 ' + fmtTime(S.secondsLeft); cls = 't-end'; }
  el.className = 'chip timer ' + cls;
  el.innerHTML = esc(label);
  var pb = $('btnPause');
  if (pb){
    if (S.state === T_MANUAL){ pb.textContent = '\u25B6 Resume'; pb.setAttribute('aria-label','Resume timer'); }
    else { pb.textContent = '\u23F8 Pause'; pb.setAttribute('aria-label','Pause timer'); }
    pb.disabled = (S.state === T_ENDED);
  }
}
function tick(){
  if (!S || S.state !== T_RUNNING) return;
  S.secondsLeft -= 1;
  if (S.secondsLeft <= 0){ S.secondsLeft = 0; setState(T_ENDED); endByTimeout(); return; }
  paintTimer();
}
function startTimer(){
  if (TICK) clearInterval(TICK);
  TICK = setInterval(tick, 1000);
}

/* ---------- exam data preparation ---------- */
function prepareExercises(){
  var order = shuffle(D.exercises.map(function(e,i){ return i; }));
  S.order = order;
  S.byId = {};
  D.exercises.forEach(function(ex){ S.byId[ex.id] = ex; });
  S.view = order.map(function(ix){ return D.exercises[ix]; });
  S.answered = {}; S.credits = {}; S.skipped = []; S.hintUsed = {};
  S.pos = 0; S.reviewing = false; S.currentView = null; S.fromReview = false;
  S.answerLog = [];
  S.view.forEach(function(ex, vi){
    prepareOne(ex, vi);
  });
}
function prepareOne(ex, vi){
  var p = { perm: {} };
  if (ex.type === 'qcm' || ex.type === 'multi'){
    var idxs = ex.options.map(function(o,i){ return i; });
    p.optOrder = shuffle(idxs);
    p.correctSet = ex.correct.slice();
  } else if (ex.type === 'dnd'){
    p.itemOrder = shuffle(ex.items.map(function(it){ return it.id; }));
  } else if (ex.type === 'match'){
    p.rightOrder = shuffle(ex.right.map(function(r){ return r.id; }));
  } else if (ex.type === 'blank'){
    p.bankOrder = shuffle(ex.bank);
  } else if (ex.type === 'order'){
    p.cur = shuffle(ex.items.map(function(it){ return it.id; }));
    p.excluded = [];
  } else if (ex.type === 'branch'){
    p.step = 0;
    p.stepOpts = ex.steps.map(function(st){
      var idxs = st.options.map(function(o,i){ return i; });
      return shuffle(idxs);
    });
    p.picks = [];
  } else if (ex.type === 'clickwrong'){
    p.lineOrder = shuffle(ex.lines.map(function(l,i){ return i; }));
  } else if (ex.type === 'terminal'){
    p.lastCmd = '';
  }
  S.answered[ex.id] = false;
  S.credits[ex.id] = 0;
  S.hintUsed[ex.id] = false;
  S['perm_' + ex.id] = p;
}

/* ---------- boot & intro ---------- */
function boot(data){

/* ---------- header ---------- */
function renderHeader(){
  var h = '';
  h += '<header class="hdr" id="examHdr">';
  h += '<div class="brand"><span class="mid">' + esc(D.examLabel) + '</span>' + severityBadge(D.severity) + '</div>';
  h += '<span class="chip" id="hdrCount">Exercise \u2013 of \u2013</span>';

  h += '<button class="hbtn warn" id="btnSkip">Skip</button>';
  h += '<button class="hbtn" id="btnPause">\u23F8 Pause</button>';
  h += '</header>';

function paintCount(){
  var el = $('hdrCount');
  if (!el) return;
  if (S.reviewing || S.currentView === null){ el.textContent = 'Review / skipped pool'; return; }
  var done = 0;
  D.exercises.forEach(function(ex){ if (S.answered[ex.id]) done++; });
  var cur = S.currentView;
  if (cur && S.answered[cur.id]){ el.textContent = 'Exercise ' + done + ' of ' + S.view.length + ' (answered)'; }
  else { el.textContent = 'Exercise ' + (done + 1) + ' of ' + S.view.length; }
}
function paintScore(){
  var el = $('hdrScore'); if (!el) return;
  var sum = 0, n = 0;
  D.exercises.forEach(function(ex){
    if (S.answered[ex.id]){ sum += S.credits[ex.id]; n += 1; }
  });
  var pct = n > 0 ? Math.round((sum / n) * 100) : 0;
  el.textContent = 'Score ' + fmtSum(sum) + ' / ' + n + ' (' + pct + '%)';
}
function togglePause(){
  if (!S || S.state === T_ENDED) return;
  if (S.state === T_MANUAL){
    setState(S.stateBeforeManual || T_RUNNING);
    var bx = $('exBody');
    if (bx) bx.classList.remove('hidden');
  } else {
    S.stateBeforeManual = S.state;
    setState(T_MANUAL);
    var b = $('exBody');
    if (b) b.classList.add('hidden');
  }
  paintTimer();
}

/* ---------- flow ---------- */
function startExam(){
  S = { state: T_RUNNING, stateSince: Date.now(), secondsLeft: D.timerSeconds,
        timeRunning: 0, timeManualPause: 0, timeFeedbackPause: 0, stateBeforeManual: null,
        startedAt: Date.now(), attempt: (S && S.attempt ? S.attempt + 1 : 1) };
  S.fromReview = false;

  renderHeader();
  startTimer();
  setState(T_RUNNING);
  showExercise(0);
  window.scrollTo(0,0);
}
function showExercise(pos){
  S.pos = pos;
  S.currentView = S.view[pos];
  S.reviewing = false;
  paintCount(); paintScore();
  renderExercise();
}
function advance(){
  var i = S.pos + 1;
  while (i < S.view.length && (S.answered[S.view[i].id] || S.skipped.indexOf(S.view[i].id) >= 0)){ i++; }
  if (i < S.view.length){
    showExercise(i);
  } else {

  }
}
function skipEx(){
  if (S.reviewing) return;
  if (!S.currentView || S.answered[S.currentView.id]) return;

  var ex = S.currentView;
  if (S.skipped.indexOf(ex.id) < 0){ S.skipped.push(ex.id); }   /* never duplicate pool entries */
  if (S.fromReview){ S.fromReview = false; openReviewSkipped(); return; }
  advance();
}
function useHint(){
  if (S.reviewing) return;
  if (S.state === T_MANUAL) return;         /* header actions are locked during a manual break */
  var ex = S.currentView;
  if (!ex || S.answered[ex.id] || S.hintUsed[ex.id]) return;
  S.hintUsed[ex.id] = true;
  var box = $('hintBox');
  if (box){
    box.classList.remove('hidden');
    box.innerHTML = '<b><span aria-hidden="true">\u25CB</span> Hint (\u221210% of this exercise credit):</b> ' + esc(ex.hint);

function hl(text){

function renderScenario(ex){
  var collapsed = false;
  var h = '<div class="blk scen" id="blkScen">';
  h += '<div class="blk-head"><span class="ico" aria-hidden="true">\uD83D\uDCCB</span> SCENARIO';
  h += '<span class="scen-sum" id="scenSum">' + esc(ex.summary) + '</span>';
  h += '<button class="collapse-btn" id="btnCollapse" aria-expanded="true" aria-controls="scenBody" title="Collapse or expand the scenario">(\u2013)</button></div>';
  h += '<div class="blk-body" id="scenBody"' + (collapsed ? ' style="display:none"' : '') + '>';
  (ex.scenario || []).forEach(function(a, i){
    if (typeof a === 'string'){
      h += '<p class="prose">' + esc(a) + '</p>';
    } else {
      h += '<div class="artefact">';
      if (a.label){ h += '<div class="art-label">' + esc(a.label) + '</div>'; }
      if (a.mono){ h += '<div class="art-body mono">' + hl(a.text) + '</div>'; }
      else { h += '<div class="art-body prose">' + esc(a.text) + '</div>'; }
      h += '</div>';
    }
  });
  h += '</div></div>';
  return h;
}
function scenarioSummaryOnly(ex){
  var first = '';
  (ex.scenario || []).forEach(function(a){ if (!first){ first = (typeof a === 'string') ? a : (a.label || a.text); } });
  return ex.summary + ' \u2014 ' + String(first).slice(0, 70);
}

/* ---------- widget builders ---------- */
function optRows(ex, p){
  var multi = (ex.type === 'multi');
  var h = '<div class="opts" role="group" aria-label="Answer options">';
  p.optOrder.forEach(function(oi, di){
    var lab = String.fromCharCode(65 + di);
    h += '<label class="opt" id="optRow' + oi + '">';
    h += '<input type="' + (multi ? 'checkbox' : 'radio') + '" name="optSel" value="' + oi + '" data-oi="' + oi + '">';
    h += '<span class="lab">' + lab + '.</span><span>' + esc(ex.options[oi]) + '</span></label>';
  });
  h += '</div>';
  return h;
}
function wQCM(ex, p){
  return optRows(ex, p);
}
function wDND(ex, p){
  var h = '<div class="z-hint">Drag a card to a zone, or click a card and then click a zone. Click a placed card to send it back.</div>';
  h += '<div class="bank" id="bank" aria-label="Item bank" data-zone="__bank"></div>';
  h += '<div class="zones">';
  ex.zones.forEach(function(z){
    h += '<div class="zone" data-zone="' + esc(z.id) + '" role="group" aria-label="' + esc(z.label) + '">';
    h += '<div class="z-lab"><span aria-hidden="true">\u25A3</span> ' + esc(z.label) + '</div><div class="z-drop"></div></div>';
  });
  h += '</div>';
  return h;
}
function chipHTML(it){
  return '<button type="button" class="chip-it" draggable="true" data-item="' + esc(it.id) + '">' + esc(it.text) + '</button>';
}
function wMATCH(ex, p){
  var h = '<div class="z-hint">For each row, pick the matching item.</div>';
  ex.left.forEach(function(l){
    h += '<div class="mrow"><span class="m-left">' + esc(l.text) + '</span>';
    h += '<select class="m-sel" data-left="' + esc(l.id) + '" aria-label="Match for ' + esc(l.text) + '">';
    h += '<option value="">\u2014 choose \u2014</option>';
    p.rightOrder.forEach(function(rid){
      var r = ex.right.filter(function(x){ return x.id === rid; })[0];
      h += '<option value="' + esc(rid) + '">' + esc(r.text) + '</option>';
    });
    h += '</select></div>';
  });
  return h;
}
function wBLANK(ex, p){
  var h = '<div class="z-hint">Pick one word for each gap.</div><div class="blanksent">';
  ex.segments.forEach(function(seg){
    if (typeof seg === 'string'){ h += esc(seg); }
    else { h += '<select class="blank-sel" data-blank="' + esc(seg.id) + '" aria-label="gap ' + esc(seg.id) + '"><option value="">\u2014</option>';
      p.bankOrder.forEach(function(w){ h += '<option value="' + esc(w) + '">' + esc(w) + '</option>'; });
      h += '</select>'; }
  });
  h += '</div>';
  return h;
}
function wORDER(ex, p){
  var hasExcl = !!ex.excludedId;
  var h = '<div class="z-hint">Use the arrows to set the correct order' + (hasExcl ? ', and move the item that does not belong to the exclude box' : '') + '.</div>';
  h += '<ol class="ordlist" id="ordList"></ol>';
  if (hasExcl){ h += '<div class="zone ord-excl" id="ordExcl" data-zone="__excl"><div class="z-lab"><span aria-hidden="true">\u26D4</span> Not part of the workflow (exclude)</div><div class="z-drop"></div></div>'; }
  return h;
}
function wCLICKWRONG(ex, p){
  var h = '<div class="z-hint">Select every flawed line. Selecting a line that is not flawed counts against you.</div>';
  p.lineOrder.forEach(function(li){
    var ln = ex.lines[li];
    h += '<button type="button" class="cw-line' + (ln.mono ? ' mono-l' : '') + '" data-line="' + li + '" aria-pressed="false">';
    h += '<span class="tick" aria-hidden="true">[ ]</span><span>' + (ln.mono ? hl(ln.text) : esc(ln.text)) + '</span></button>';
  });
  return h;
}
function wTERMINAL(ex, p){
  var t = ex.terminal;
  var h = '<div class="term" role="group" aria-label="Terminal emulator">';
  h += '<div class="scr" id="termScr">' + esc(t.banner || 'Simulated shell. Type your command and press Enter, then press Check.') + '\n</div>';
  h += '<div class="promptline"><span class="pr">' + esc(t.prompt) + '</span>';
  h += '<input id="termIn" type="text" autocomplete="off" spellcheck="false" aria-label="Terminal input">';
  h += '<button type="button" class="obtn" id="termRun" aria-label="Run command" title="Run command">\u21B5</button></div></div>';
  if (t.syntax){ h += '<div class="synpanel"><div class="sp-t">Syntax reminder</div><div class="mono">' + esc(t.syntax) + '</div>';
    (t.syntaxNotes || []).forEach(function(n){ h += '<div class="z-hint">' + esc(n) + '</div>'; }); h += '</div>'; }
  if (t.shape){ h += '<div class="synpanel"><div class="sp-t">Expected output shape</div><div class="mono">' + hl(t.shape) + '</div></div>'; }
  if (t.recommendedSeconds){
    h += '<div class="z-hint" id="termWin" role="timer">\u23F1 Recommended window: ' + fmtTime(t.recommendedSeconds) + ' \u2014 advisory only. The graded clock stays the main timer.</div>';
  }
  return h;
}
function wBRANCH(ex, p){
  return '<div id="brSteps"></div>';
}

/* ---------- widget wiring ---------- */
function wireWidget(ex, p){
  if (ex.type === 'dnd'){ wireDND(ex, p); }
  else if (ex.type === 'order'){ paintOrder(ex, p); wireOrder(ex, p); }
  else if (ex.type === 'branch'){ paintBranch(ex, p); }
  else if (ex.type === 'terminal'){ wireTerminal(ex, p); }
  else if (ex.type === 'clickwrong'){ wireClickWrong(ex, p); }
}
function wireClickWrong(ex, p){
  document.querySelectorAll('.cw-line').forEach(function(b){
    b.addEventListener('click', function(){
      if (S.answered[ex.id]) return;
      b.classList.toggle('sel');
      var on = b.classList.contains('sel');
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      var t = b.querySelector('.tick');
      if (t){ t.textContent = on ? '[x]' : '[ ]'; }
    });
  });
}
function wireDND(ex, p){
  var bank = $('bank');
  var zones = document.querySelectorAll('.zone[data-zone]');
  function placeIn(zoneEl, itemId){
    var chip = document.querySelector('.chip-it[data-item="' + itemId + '"]');
    if (!chip) return;
    zoneEl.querySelector('.z-drop').appendChild(chip);
    chip.classList.remove('picked');
    p.pickedItem = null;
  }
  p.itemOrder.forEach(function(iid){
    var it = ex.items.filter(function(x){ return x.id === iid; })[0];
    bank.insertAdjacentHTML('beforeend', chipHTML(it));
  });
  bank.addEventListener('click', function(ev){
    var chip = ev.target.closest('.chip-it');
    if (!chip) return;
    if (bank.contains(chip)){ togglePick(chip); }
    else { bank.appendChild(chip); }
  });
  function togglePick(chip){
    var was = chip.classList.contains('picked');
    document.querySelectorAll('.chip-it.picked').forEach(function(c){ c.classList.remove('picked'); });
    p.pickedItem = was ? null : chip.getAttribute('data-item');
    if (!was){ chip.classList.add('picked'); }
  }
  zones.forEach(function(z){
    z.addEventListener('click', function(ev){
      if (ev.target.closest('.chip-it')){ return; }
      if (p.pickedItem){ placeIn(z, p.pickedItem); }
    });
    z.addEventListener('dragover', function(ev){ ev.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', function(){ z.classList.remove('over'); });
    z.addEventListener('drop', function(ev){
      ev.preventDefault(); z.classList.remove('over');
      var id = ev.dataTransfer.getData('text/plain');
      if (id){ placeIn(z, id); }
    });
  });
  document.addEventListener('dragstart', function(ev){
    var chip = ev.target.closest ? ev.target.closest('.chip-it') : null;
    if (chip){ ev.dataTransfer.setData('text/plain', chip.getAttribute('data-item')); }
  });
}
function paintOrder(ex, p){
  var list = $('ordList');
  var html = '';
  p.cur.forEach(function(iid, ix){
    var it = ex.items.filter(function(x){ return x.id === iid; })[0];
    html += '<li class="ord-it" data-oi="' + iid + '"><span class="pos" aria-label="position">' + (ix + 1) + '</span>';
    html += '<span class="ord-txt">' + esc(it.text) + '</span>';
    html += '<button type="button" class="obtn" data-up="' + iid + '" aria-label="move up">\u2191</button>';
    html += '<button type="button" class="obtn" data-down="' + iid + '" aria-label="move down">\u2193</button>';
    if (ex.excludedId){ html += '<button type="button" class="obtn" data-excl="' + iid + '" aria-label="exclude this item">\u26D4</button>'; }
    html += '</li>';
  });
  list.innerHTML = html;
  if (ex.excludedId){
    var zd = document.querySelector('#ordExcl .z-drop');
    zd.innerHTML = '';
    p.excluded.forEach(function(iid){
      var it = ex.items.filter(function(x){ return x.id === iid; })[0];
      zd.insertAdjacentHTML('beforeend', '<button type="button" class="chip-it" data-item="' + iid + '">' + esc(it.text) + ' \u00B7 click to restore</button>');
    });
    document.querySelectorAll('#ordExcl .chip-it').forEach(function(c){
      c.addEventListener('click', function(){
        var iid = c.getAttribute('data-item');
        var k = p.excluded.indexOf(iid);
        if (k >= 0){ p.excluded.splice(k, 1); p.cur.push(iid); }
        paintOrder(ex, p);
      });
    });
  }
}
function wireOrder(ex, p){
  var list = $('ordList');
  list.addEventListener('click', function(ev){
    var up = ev.target.getAttribute('data-up');
    var down = ev.target.getAttribute('data-down');
    var exc = ev.target.getAttribute('data-excl');
    if (up){ moveOrd(p, up, -1); paintOrder(ex, p); }
    else if (down){ moveOrd(p, down, 1); paintOrder(ex, p); }
    else if (exc){
      var k = p.cur.indexOf(exc);
      if (k >= 0){ p.cur.splice(k, 1); p.excluded.push(exc); }
      paintOrder(ex, p);
    }
  });
}
function moveOrd(p, iid, dir){
  var ix = p.cur.indexOf(iid);
  var nx = ix + dir;
  if (ix < 0 || nx < 0 || nx >= p.cur.length) return;
  var tmp = p.cur[ix]; p.cur[ix] = p.cur[nx]; p.cur[nx] = tmp;
}
function paintBranch(ex, p){
  var box = $('brSteps');
  var h = '';
  for (var i = 0; i <= p.step && i < ex.steps.length; i++){
    var st = ex.steps[i];
    var isLast = (i === ex.steps.length - 1);
    h += '<div class="step-lab">STEP ' + (i + 1) + ' OF ' + ex.steps.length + '</div>';
    h += '<p class="prose" style="font-weight:700">' + esc(st.question) + '</p>';
    h += '<div class="opts">';
    p.stepOpts[i].forEach(function(oi, di){
      var dis = (p.picks[i] !== undefined) || (i < p.step);
      var checked = (p.picks[i] === oi);
      h += '<label class="opt' + (dis ? ' dis' : '') + '"><input type="radio" name="br' + i + '" value="' + oi + '"' + (checked ? ' checked' : '') + (dis ? ' disabled' : '') + '>';
      h += '<span class="lab">' + String.fromCharCode(65 + di) + '.</span><span>' + esc(st.options[oi]) + '</span></label>';
    });
    h += '</div>';
    if (p.picks[i] !== undefined && st.outcome){
      h += '<div class="step-note">' + esc(st.outcome) + '</div>';
    }
    h += '<hr class="divider" style="margin:12px 0">';
  }
  box.innerHTML = h;
  var cur = p.step;
  if (cur < ex.steps.length){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn primary';
    btn.id = 'brConfirm';
    var isLast = (cur === ex.steps.length - 1);
    btn.textContent = isLast ? 'Check final answer' : 'Confirm step and continue';
    box.appendChild(btn);
    btn.addEventListener('click', function(){
      if (ex.type === 'branch' && cur < ex.steps.length){
        var sel = document.querySelector('input[name="br' + cur + '"]:checked');
        if (!sel){ return; }
        p.picks[cur] = parseInt(sel.value, 10);
        p.step = cur + 1;
        paintBranch(ex, p);
        var st = ex.steps[cur];
        if (p.step >= ex.steps.length){
          var note = document.createElement('div');
          note.className = 'step-note';
          note.textContent = 'All steps are locked in \u2014 your feedback is below.';
          box.appendChild(note);
        }
        if (isLast){ doCheck(); }
      }
    });
  }
}
function wireTerminal(ex, p){
  var input = $('termIn');
  if (ex.terminal.recommendedSeconds){
    var winEl = $('termWin');
    var left = ex.terminal.recommendedSeconds;
    if (window.__termWinInt){ clearInterval(window.__termWinInt); }
    window.__termWinInt = setInterval(function(){
      if (!S || S.state !== T_RUNNING) return;   /* the advisory window pauses with the main timer */
      left -= 1;
      if (!winEl){ if (window.__termWinInt){ clearInterval(window.__termWinInt); } return; }
      if (left > 0){
        winEl.textContent = '\u23F1 Recommended window: ' + fmtTime(left) + ' \u2014 advisory only. The graded clock stays the main timer.';
      } else {
        winEl.textContent = '\u26A0 Recommended window elapsed. Take the time you need \u2014 the graded clock stays the main timer.';
        winEl.className = 'z-hint it-no';
        if (window.__termWinInt){ clearInterval(window.__termWinInt); window.__termWinInt = null; }
      }
    }, 1000);
  }
  function run(){
    var cmd = input.value;
    if (!cmd.trim()) return;
    p.lastCmd = cmd;
    var scr = $('termScr');
    scr.innerHTML += '<span class="cmd">' + esc(ex.terminal.prompt + cmd) + '</span>\n';
    var res = judgeTerminalQuiet(ex, cmd);
    if (res.allOk){ scr.innerHTML += esc(ex.terminal.successOut) + '\n'; }
    else { scr.innerHTML += esc(ex.terminal.failOut) + '\n'; }
    scr.scrollTop = scr.scrollHeight;
    input.value = '';
  }
  $('termRun').addEventListener('click', run);
  input.addEventListener('keydown', function(ev){ if (ev.key === 'Enter'){ run(); } });
}
function normCmd(c){
  c = String(c || '').trim().replace(/\s+/g, ' ').toLowerCase();
  c = c.replace(/^\s*sudo\s+/, '');
  c = c.replace(/\[\.\]/g, '.');
  return c;
}
function judgeTerminalQuiet(ex, cmd){
  var n = normCmd(cmd);
  var okReq = 0, bad = 0;
  ex.terminal.elements.forEach(function(el){ if (el._re.test(n)){ okReq++; } });
  (ex.terminal.forbidden || []).forEach(function(f){ if (f._re.test(n)){ bad++; } });
  return { allOk: (okReq === ex.terminal.elements.length && bad === 0), okReq: okReq, bad: bad };
}

/* ---------- collect answers ---------- */
function collectAnswer(ex, p){
  if (ex.type === 'qcm' || ex.type === 'multi'){
    var sel = [];
    document.querySelectorAll('input[name="optSel"]:checked').forEach(function(i){ sel.push(i.getAttribute('data-oi')); });
    return sel.length ? sel : null;
  }
  if (ex.type === 'dnd'){
    var placed = {};
    var any = false;
    ex.items.forEach(function(it){
      var chip = document.querySelector('.chip-it[data-item="' + it.id + '"]');
      var z = chip.closest('[data-zone]');
      var zid = z ? z.getAttribute('data-zone') : '__bank';
      if (zid !== '__bank'){ placed[it.id] = zid; any = true; }
    });
    return any ? placed : null;
  }
  if (ex.type === 'match'){
    var pairs = {}; var anyM = false;
    document.querySelectorAll('.m-sel').forEach(function(s){
      var v = s.value;
      if (v){ pairs[s.getAttribute('data-left')] = v; anyM = true; }
    });
    return anyM ? pairs : null;
  }
  if (ex.type === 'blank'){
    var b = {}; var anyB = false;
    document.querySelectorAll('.blank-sel').forEach(function(s){
      if (s.value){ b[s.getAttribute('data-blank')] = s.value; anyB = true; }
    });
    return anyB ? b : null;
  }
  if (ex.type === 'order'){
    var st = {};
    p.cur.forEach(function(iid, ix){ st[iid] = ix; });
    p.excluded.forEach(function(iid){ st[iid] = '__excl'; });
    return st;
  }
  if (ex.type === 'branch'){
    return p.picks.length ? { picks: p.picks.slice(0, p.step) } : null;
  }
  if (ex.type === 'clickwrong'){
    var selL = [];
    document.querySelectorAll('.cw-line.sel').forEach(function(b){ selL.push(parseInt(b.getAttribute('data-line'), 10)); });
    return selL.length ? selL : null;
  }
  if (ex.type === 'terminal'){
    return p.lastCmd ? { cmd: p.lastCmd } : null;
  }
  return null;
}
/* ---------- grading ---------- */
function row(icon, cls, txt){
  return { icon: icon, cls: cls, text: txt };
}
function perTxt(ex, key, ok){
  var pi = ex.perItem && ex.perItem[key];
  if (!pi) return '';
  return ok ? (pi.ok || '') : (pi.no || '');
}
function grade(ex, ans, p){
  var R = { rows: [], canonical: null, danger: [] };
  if (ex.type === 'qcm' || ex.type === 'multi'){
    var corr = ex.correct.map(function(c){ return String(c); });
    var r = scoreExercise(ans, corr);
    ex.correct.forEach(function(ci){
      var k = String(ci);
      if (ans.indexOf(k) >= 0){ R.rows.push(row('\u2713','it-ok','Correct: ' + ex.options[ci] + ' ' + perTxt(ex,'o'+k,true))); }
      else { R.rows.push(row('\u25CB','it-miss','Missed: ' + ex.options[ci] + ' ' + perTxt(ex,'o'+k,true))); }
    });
    ans.forEach(function(k){
      if (ex.correct.indexOf(parseInt(k,10)) < 0){
        R.rows.push(row('\u2717','it-no','Wrong: ' + ex.options[parseInt(k,10)] + ' ' + perTxt(ex,'o'+k,false)));
      }
    });
    R.credit = r.credit;
    return R;
  }
  if (ex.type === 'dnd'){
    var items = ex.items.map(function(it){ return it.id; });
    var okP = 0, badP = 0;
    ex.items.forEach(function(it){
      var zid = ans[it.id];
      var okz = ex.correct[it.id];
      if (zid === okz){ okP++; R.rows.push(row('\u2713','it-ok','Correct: "' + it.text + '" ' + zoneName(ex, zid) + perTxt(ex, it.id, true))); }
      else if (zid){ badP++; R.rows.push(row('\u2717','it-no','Wrong: "' + it.text + '" belongs in ' + zoneName(ex, okz) + perTxt(ex, it.id, false))); }
      else { R.rows.push(row('\u25CB','it-miss','Missed: "' + it.text + '" belongs in ' + zoneName(ex, okz) + perTxt(ex, it.id, true))); }
    });
    /* mandatory formula: H = correctly placed items, W = wrongly placed items, N = all items */
    R.credit = Math.max(0, (okP - badP) / items.length);
    return R;
  }
  if (ex.type === 'match'){
    var lids = ex.left.map(function(l){ return l.id; });
    var pairsOk = 0, pairsBad = 0;
    lids.forEach(function(lid){
      var chosen = ans[lid];
      var want = ex.correct[lid];
      var ltxt = ex.left.filter(function(x){ return x.id === lid; })[0].text;
      var rtxt = function(rid){ var rr = ex.right.filter(function(x){ return x.id === rid; })[0]; return rr ? rr.text : ''; };
      if (chosen === want){ pairsOk++; R.rows.push(row('\u2713','it-ok','Correct pair: ' + ltxt + ' \u2192 ' + rtxt(want) + ' ' + perTxt(ex, lid, true))); }
      else if (chosen){ pairsBad++; R.rows.push(row('\u2717','it-no','Wrong pair: ' + ltxt + ' \u2192 ' + rtxt(chosen) + ' ' + perTxt(ex, lid, false))); }
      else { R.rows.push(row('\u25CB','it-miss','Missed: ' + ltxt + ' \u2192 ' + rtxt(want) + ' ' + perTxt(ex, lid, true))); }
    });
    /* mandatory formula: H = correct pairs made, W = wrong pairs made, N = all pairs */
    R.credit = Math.max(0, (pairsOk - pairsBad) / lids.length);
    return R;
  }
  if (ex.type === 'blank'){
    var bids = ex.blanksOrder || Object.keys(ex.blanks);
    var fillsOk = 0, fillsBad = 0;
    bids.forEach(function(bid){
      var v = ans[bid];
      var want = ex.blanks[bid];
      var wlist = Array.isArray(want) ? want : [want];
      var okv = v && wlist.map(function(w){ return w.toLowerCase(); }).indexOf(String(v).toLowerCase()) >= 0;
      var wantTxt = wlist[0];
      if (okv){ fillsOk++; R.rows.push(row('\u2713','it-ok','Correct gap: ' + wantTxt + ' ' + perTxt(ex, bid, true))); }
      else if (v){ fillsBad++; R.rows.push(row('\u2717','it-no','Wrong gap: you picked "' + v + '", the answer is "' + wantTxt + '" ' + perTxt(ex, bid, false))); }
      else { R.rows.push(row('\u25CB','it-miss','Missed gap: the answer is "' + wantTxt + '" ' + perTxt(ex, bid, true))); }
    });
    /* mandatory formula: H = correctly filled gaps, W = wrongly filled gaps, N = all gaps */
    R.credit = Math.max(0, (fillsOk - fillsBad) / bids.length);
    return R;
  }
  if (ex.type === 'order'){
    var posOk = 0, posBad = 0;
    ex.correct.forEach(function(id, wantPos){
      var got = ans[id];
      var it = ex.items.filter(function(x){ return x.id === id; })[0];
      if (got === wantPos){ posOk++; R.rows.push(row('\u2713','it-ok','Position ' + (wantPos + 1) + ' is right: ' + it.text)); }
      else if (got === null || got === undefined){ R.rows.push(row('\u25CB','it-miss','Missed: "' + it.text + '" goes at position ' + (wantPos + 1))); }
      else { posBad++; R.rows.push(row('\u2717','it-no','Wrong position: "' + it.text + '" belongs at position ' + (wantPos + 1))); }
    });
    if (ex.excludedId){
      var itx = ex.items.filter(function(x){ return x.id === ex.excludedId; })[0];
      if (ans[ex.excludedId] === '__excl'){ posOk++; R.rows.push(row('\u2713','it-ok','Correctly excluded: ' + itx.text)); }
      else { posBad++; R.rows.push(row('\u2717','it-no','Wrong: "' + itx.text + '" does not belong in the workflow ' + perTxt(ex, ex.excludedId, false))); }
    }
    /* mandatory formula: H = items placed correctly (or correctly excluded), W = items placed wrongly, N = all items */
    var nOrd = ex.correct.length + (ex.excludedId ? 1 : 0);
    R.credit = Math.max(0, (posOk - posBad) / nOrd);
    return R;
  }
  if (ex.type === 'branch'){
    var steps = ex.steps;
    var stepsOk = 0, stepsBad = 0;
    steps.forEach(function(st, i){
      var pick = ans.picks[i];
      var okt = (pick === st.correct);
      if (pick === undefined){ R.rows.push(row('\u25CB','it-miss','Missed step ' + (i + 1) + ': ' + (st.whyOk || '') )); }
      else if (okt){ stepsOk++; R.rows.push(row('\u2713','it-ok','Step ' + (i + 1) + ' correct: ' + st.options[st.correct] + ' ' + (st.whyOk || perTxt(ex,'s'+i,true)))); }
      else { stepsBad++; R.rows.push(row('\u2717','it-no','Step ' + (i + 1) + ' wrong: you chose "' + st.options[pick] + '". Better: "' + st.options[st.correct] + '" ' + (st.whyNo || perTxt(ex,'s'+i,false)))); }
    });
    /* mandatory formula: H = steps answered correctly, W = steps answered wrongly, N = all steps */
    R.credit = Math.max(0, (stepsOk - stepsBad) / steps.length);
    return R;
  }
  if (ex.type === 'clickwrong'){
    var flawed = [], selF = [], cw = 0;
    ex.lines.forEach(function(l, i){
      if (l.flawed){ flawed.push('l' + i); if (ans.indexOf(i) >= 0){ selF.push('l' + i); } }
    });
    ans.forEach(function(i){ if (!ex.lines[i].flawed){ cw++; } });
    var rc = scoreExercise(selF, flawed);
    R.credit = Math.max(0, (rc.H - cw) / rc.N);
    ex.lines.forEach(function(l, i){
      var isF = !!l.flawed;
      var wasSel = ans.indexOf(i) >= 0;
      if (isF && wasSel){ R.rows.push(row('\u2713','it-ok','Rightly flagged: ' + short(l.text) + ' ' + perTxt(ex,'l'+i,true))); }
      else if (isF){ R.rows.push(row('\u25CB','it-miss','Missed flaw: ' + short(l.text) + ' ' + perTxt(ex,'l'+i,true))); }
      else if (wasSel){ R.rows.push(row('\u2717','it-no','Not a flaw: ' + short(l.text) + ' ' + perTxt(ex,'l'+i,false))); }
    });
    return R;
  }
  if (ex.type === 'terminal'){
    var n = normCmd(ans.cmd);
    var selT = [], corT = [], forb = [];
    ex.terminal.elements.forEach(function(el, i){
      corT.push('t' + i);
      if (el._re.test(n)){ selT.push('t' + i); }
    });
    (ex.terminal.forbidden || []).forEach(function(f, i){
      if (f._re.test(n)){
        forb.push(f);
        selT.push('f' + i);
      }
    });
    var rt = scoreExercise(selT, corT);
    R.credit = rt.credit;
    ex.terminal.elements.forEach(function(el, i){
      if (el._re.test(n)){ R.rows.push(row('\u2713','it-ok','Found: ' + el.label)); }
      else { R.rows.push(row('\u25CB','it-miss','Missing: ' + el.label)); }
    });
    (ex.terminal.forbidden || []).forEach(function(f, i){
      if (f._re.test(n)){
        R.rows.push(row('\u2717','it-no','Wrong / risky part: ' + f.label + ' ' + (f.why || '')));
        if (f.danger){ R.danger.push(f.dangerMsg || f.why || 'This command would change state.'); }
      }
    });
    R.canonical = ex.terminal.canonical;
    R.parts = ex.terminal.explainParts || [];
    return R;
  }
  R.credit = 0;
  return R;
}
function zoneName(ex, zid){
  var z = ex.zones.filter(function(x){ return x.id === zid; })[0];
  return z ? ('"' + z.label + '"') : '';
}
function short(t){ t = String(t); return t.length > 90 ? t.slice(0, 87) + '...' : t; }

/* ---------- exercise rendering ---------- */
function renderExercise(){
  var ex = S.currentView;
  var p = S['perm_' + ex.id];
  var h = '<div id="exBody">';
  h += renderScenario(ex);
  h += '<div class="blk quest"><div class="blk-head"><span class="ico" aria-hidden="true">\u2753</span> QUESTION</div>';
  h += '<div class="blk-body"><p class="prose" style="font-weight:800">' + esc(ex.question) + '</p></div></div>';
  h += '<div class="blk ans"><div class="blk-head"><span class="ico" aria-hidden="true">\u270D</span> YOUR ANSWER</div>';
  h += '<div class="blk-body">';
  h += widgetHTML(ex, p);
  h += '<div id="hintBox" class="synpanel hidden" role="note"></div>';
  h += '</div></div>';
  h += '<div class="actrow" id="actRow"><button class="btn primary" id="btnCheck">Check</button><span id="checkNote" class="it-no" role="alert"></span></div>';
  h += '<div id="fdbRoot"></div>';
  h += '</div>';
  $('app').innerHTML = h;
  if (window.__termWinInt){ clearInterval(window.__termWinInt); window.__termWinInt = null; }
  wireWidget(ex, p);
  $('btnCheck').addEventListener('click', doCheck);
  $('btnCollapse').addEventListener('click', toggleScenario);
  var hb = $('btnHint');
  if (hb) hb.disabled = !!S.hintUsed[ex.id];   /* hint already spent on a previous visit stays spent */
  var sb = $('btnSkip');
  if (sb) sb.disabled = S.answered[ex.id] || S.reviewing;
  window.scrollTo(0,0);
}
function widgetHTML(ex, p){
  if (ex.type === 'qcm' || ex.type === 'multi') return wQCM(ex, p);
  if (ex.type === 'dnd') return wDND(ex, p);
  if (ex.type === 'match') return wMATCH(ex, p);
  if (ex.type === 'blank') return wBLANK(ex, p);
  if (ex.type === 'order') return wORDER(ex, p);
  if (ex.type === 'clickwrong') return wCLICKWRONG(ex, p);
  if (ex.type === 'terminal') return wTERMINAL(ex, p);
  if (ex.type === 'branch') return wBRANCH(ex, p);
  return '';
}
function toggleScenario(){
  var b = $('scenBody');
  var btn = $('btnCollapse');
  if (!b) return;
  var show = (b.style.display === 'none');
  b.style.display = show ? '' : 'none';
  btn.textContent = show ? '(\u2013)' : '(+)';
  btn.setAttribute('aria-expanded', show ? 'true' : 'false');
}
function doCheck(){
  var ex = S.currentView;
  if (!ex || S.answered[ex.id]) return;
  var p = S['perm_' + ex.id];
  if (ex.type === 'branch' && p.picks.length < ex.steps.length){
    $('checkNote').textContent = 'Confirm every step first (use the button inside the last step).';
    return;
  }
  var ans = collectAnswer(ex, p);
  if (!ans){
    $('checkNote').textContent = 'Choose an answer first, or press Skip.';
    return;
  }
  setState(T_AUTOCHECK);           /* mandatory: Check stops the timer before feedback renders */
  var R = grade(ex, ans, p);
  var base = R.credit;
  var finalC = Math.max(0, base - (S.hintUsed[ex.id] ? 0.10 : 0));
  S.answered[ex.id] = true;
  S.credits[ex.id] = finalC;
  paintScore();
  renderFeedback(ex, R, base, finalC);
  var act = $('actRow');
  var isLast = (S.pos + 1 >= S.view.length) && !S.reviewing && !S.fromReview;
  var nh = '';
  if (S.reviewing || S.fromReview){ nh += '<button class="btn primary" id="btnNext">Return to review</button>'; }
  else if (isLast){ nh += '<button class="btn primary" id="btnNext">Final Submit</button>'; }
  else { nh += '<button class="btn primary" id="btnNext">Next</button>'; }
  act.innerHTML = nh;
  $('btnNext').addEventListener('click', onNext);
  var hb = $('btnHint'); if (hb) hb.disabled = true;
  var sb = $('btnSkip'); if (sb) sb.disabled = true;
  document.querySelectorAll('#exBody input, #exBody button.chip-it, #exBody .obtn, #exBody select, #exBody .cw-line, #exBody .btn').forEach(function(el){
    if (el.id === 'btnCollapse' || el.id === 'btnCopy' || el.id === 'btnNext') return;
    el.disabled = true;
  });
  var fb = $('fdbRoot');
  if (fb && fb.scrollIntoView){
    var smooth = true;
    try { if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) smooth = false; } catch (e) {}
    try { fb.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'nearest' }); } catch (e) {}
  }
}
function onNext(){
  if (S.fromReview){
    S.fromReview = false;
    setState(T_RUNNING);
    openReviewSkipped();
    return;
  }
  if (S.reviewing){
    setState(T_RUNNING);
    openReviewSkipped();
    return;
  }
  setState(T_RUNNING);
  var i = S.pos + 1;
  while (i < S.view.length && (S.answered[S.view[i].id] || S.skipped.indexOf(S.view[i].id) >= 0)){ i++; }
  if (i < S.view.length){ showExercise(i); }
  else { openReviewSkipped(); }   /* the review screen keeps the timer running; ENDED comes only with the results */
}
function renderFeedback(ex, R, base, finalC){
  var cls = finalC >= 1 ? 'ok' : (finalC > 0 ? 'part' : 'no');
  var lab = finalC >= 1 ? '\u2713 CORRECT' : (finalC > 0 ? '\u2713 PARTIALLY CORRECT' : '\u2717 INCORRECT');
  var N = R.rows.length || 1;
  var h = '';
  h += '<div class="fdb ' + cls + '" role="region" aria-label="Feedback">';
  h += '<div class="fdb-head"><span aria-hidden="true">' + (finalC >= 1 ? '\u2713' : (finalC > 0 ? '\u2713' : '\u2717')) + '</span> ' + lab;
  if (finalC < 1){
    h += '<span style="font-weight:600"> \u2014 credit ' + finalC.toFixed(2) + '</span>';
  }
  if (S.hintUsed[ex.id]){
    h += '<span style="font-weight:600"> (base credit ' + base.toFixed(2) + ' \u2212 0.10 hint penalty)</span>';
  }
  h += '</div><div class="fdb-body">';
  if (R.rows.length > 1){
    h += '<div class="itemgrid">';
    R.rows.forEach(function(r){
      h += '<div class="it-row"><span class="st ' + r.cls + '" aria-hidden="true">' + r.icon + '</span><span class="' + r.cls + '">' + esc(r.text) + '</span></div>';
    });
    h += '</div>';
  }
  h += '<div class="prose">' + esc(ex.explain) + '</div>';
  if (R.canonical){
    h += '<div class="synpanel"><div class="sp-t">Canonical command</div>';
    h += '<div class="copyline"><div class="mono" id="canCmd">' + esc(R.canonical) + '</div>';
    h += '<button type="button" class="obtn" id="btnCopy" aria-label="Copy canonical command">\u29C9</button></div>';
    h += '<div class="itemgrid">';
    R.parts.forEach(function(pt){
      h += '<div class="it-row"><span class="st it-ok" aria-hidden="true">\u203A</span><span><b>' + esc(pt.part) + '</b> \u2014 ' + esc(pt.why) + '</span></div>';
    });
    h += '</div></div>';
  }
  if (R.danger && R.danger.length){
    R.danger.forEach(function(d){
      h += '<div class="whatstudy" style="border-color:#6a1f1b;background:#321c1a"><b><span aria-hidden="true">\u26A0</span> Careful \u2014 this command was risky</b>' + esc(d) + '</div>';
    });
  }
  if (finalC < 1 && ex.study){
    h += '<div class="whatstudy"><b><span aria-hidden="true">\u25A6</span> What to study</b>' + esc(ex.study) + '</div>';
  }
  h += '</div></div>';
  $('fdbRoot').innerHTML = h;
  var cp = $('btnCopy');
  if (cp){
    cp.addEventListener('click', function(){
      var txt = R.canonical;
      function fallback(){
        var ta = document.createElement('textarea');
        ta.value = txt; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).catch(fallback); }
        else { fallback(); }
      } catch (e) { fallback(); }
    });
  }
}

/* ---------- results ---------- */
function showResults(byTimeout){
  if (TICK) clearInterval(TICK);
  if (S.state !== T_ENDED){ setState(T_ENDED); }
  var answered = 0, sum = 0, full = 0, part = 0, zero = 0, partSum = 0;
  var skippedOpen = 0;
  D.exercises.forEach(function(ex){
    if (S.answered[ex.id]){
      answered += 1;
      var c = S.credits[ex.id];
      sum += c;
      if (c >= 1){ full += 1; }
      else if (c > 0){ part += 1; partSum += c; }
      else { zero += 1; }
    } else if (S.skipped.indexOf(ex.id) >= 0){ skippedOpen += 1; }
  });
  var percent = answered > 0 ? Math.round((sum / answered) * 100) : 0;
  var passed = percent >= 70;
  var totalMin = Math.round((Date.now() - S.startedAt) / 60000);
  var h = '';
  h += '<div class="intro-hero"><h1>Results \u2014 ' + esc(D.examLabel) + '</h1>';
  h += '<div class="sub">' + severityBadge(D.severity) + '</div>';
  h += '<div class="pct ' + (passed ? 'pass' : 'fail') + '">' + percent + '%</div>';
  h += '<div style="font-weight:700;font-size:18px" class="' + (passed ? 'pass' : 'fail') + '">' + (passed ? '\u2713 PASS' : '\u2717 FAIL \u2014 you must retake this exam (pass mark 70%)') + '</div>';
  if (passed){
    var today = new Date();
    var iso = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    h += '<div class="certpanel" role="note">';
    h += '<div class="cp-t">\u2713 Certificate of completion</div>';
    h += '<div class="cp-n">' + esc(D.meta.title || D.examLabel) + '</div>';
    h += '<div class="cp-s">Result: ' + percent + '% \u00B7 pass mark 70% \u00B7 ' + iso + '</div>';
    h += '<div class="cp-s">Completed exercises: ' + answered + ' of ' + D.exercises.length + '</div>';
    h += '</div>';
  }
  if (byTimeout){ h += '<div class="step-note">The timer ended while exercises were still open. Unanswered exercises were excluded from the score.</div>'; }
  h += '<div class="resgrid">';
  h += '<div class="resbox"><div class="n">' + fmtSum(sum) + ' / ' + answered + '</div><div class="t">Sum of credits / answered exercises</div></div>';
  h += '<div class="resbox"><div class="n">' + full + '</div><div class="t">Fully correct</div></div>';
  h += '<div class="resbox"><div class="n">' + part + '</div><div class="t">Partially correct' + (part ? ' (avg ' + (partSum / part).toFixed(2) + ')' : '') + '</div></div>';
  h += '<div class="resbox"><div class="n">' + zero + '</div><div class="t">Fully incorrect</div></div>';
  h += '<div class="resbox"><div class="n">' + skippedOpen + '</div><div class="t">Skipped, never answered \u2014 NOT ANSWERED, EXCLUDED</div></div>';
  h += '</div>';
  h += '<div class="resgrid">';
  h += '<div class="resbox"><div class="n">' + totalMin + ' min</div><div class="t">Total time on this attempt</div></div>';
  h += '<div class="resbox"><div class="n">' + Math.round(S.timeRunning / 60) + ' min</div><div class="t">Timer running</div></div>';
  h += '<div class="resbox"><div class="n">' + Math.round(S.timeManualPause / 60) + ' min</div><div class="t">Paused manually (breaks)</div></div>';
  h += '<div class="resbox"><div class="n">' + Math.round(S.timeFeedbackPause / 60) + ' min</div><div class="t">Paused reviewing feedback</div></div>';
  h += '</div>';
  h += '<div class="actrow"><button class="btn green" id="btnRetake">Retake Exam</button></div>';
  h += '</div>';
  $('app').innerHTML = h;
  $('btnRetake').addEventListener('click', startExam);
  reportScore(sum, answered, percent, passed);
  window.scrollTo(0,0);
}

/* ---------- site integration (CyberPulseAcademy) ---------- */
var siteInit = {};
function reportScore(creditSum, answeredCount, percent, passed){
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: D.meta.topicId,
      batch: D.meta.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: passed
    }, location.origin);
  } catch (e) {
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}
window.addEventListener('message', function (event) {
  if (!event.data || typeof event.data !== 'object') { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  siteInit = { username: event.data.username || '', country: event.data.country || '', theme: event.data.theme || 'light', locale: event.data.locale || 'en' };
});

boot(EXAM_DATA);

</script>
