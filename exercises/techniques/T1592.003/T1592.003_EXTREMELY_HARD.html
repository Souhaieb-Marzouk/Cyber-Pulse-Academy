var EXAM_DATA = {"examLabel": "T1592.003 Firmware", "severity": "extremely-hard", "timerSeconds": 4500, "meta": {"topicId": "t1592.003", "batch": 4, "title": "T1592.003 Gather Victim Host Information: Firmware — EXTREMELY HARD", "difficulty": "extremely-hard", "questionCount": 16, "estimatedMinutes": 75, "passMark": 70}, "intro": {"title": "T1592.003 - Gather Victim Host Information: Firmware", "subtitle": "EXTREMELY HARD tier practice exam - 16 exercises - about 75 minutes", "about": "\n<h2 style=\"margin-top:0\">The ATT&CK object you will master<\/h2>\n<div class=\"prose\">This exam teaches one part of the <b>MITRE ATT&amp;CK<\/b> framework: the sub-technique <b>T1592.003 - Gather Victim Host Information: Firmware<\/b>. MITRE ATT&amp;CK is a public knowledge base that lists the tricks real attackers use, and each trick has an ID. This one is a <b>sub-technique<\/b> - a child of the bigger technique T1592 (Gather Victim Host Information) - and it sits in the <b>Reconnaissance<\/b> tactic (TA0043) on the <b>PRE<\/b> platform.<\/div>\n<div class=\"prose\" style=\"margin-top:8px\"><b>What does it describe?<\/b> Firmware is the small piece of software that lives inside a device and makes it work - the BIOS or UEFI that starts a laptop, or the code inside a printer, router, or camera. T1592.003 describes an attacker collecting the <b>type and version<\/b> of that firmware. With it, the attacker can infer how old a device is, how well it is patched, what it is used for, and which known weaknesses it may have.<\/div>\n<div class=\"prose\" style=\"margin-top:8px\"><b>Where does the attacker look?<\/b> Often not at your network at all. ATT&amp;CK says firmware facts can be gathered by asking people trick questions (Phishing for Information, T1598) or by reading open information - <b>job postings, network maps, assessment reports, resumes, and purchase invoices<\/b> - and sometimes organisations leak such data by accident, like the more than 20 GB of Intel source code and proprietary data dumped online in August 2020, which the ATT&amp;CK page cites.<\/div>\n<div class=\"prose\" style=\"margin-top:8px\"><b>Who works with this in a real job?<\/b> A <b>SOC analyst<\/b> triages alerts and must judge why odd device reads matter. A <b>threat-intelligence analyst<\/b> writes behaviour reports using IDs like T1592.003 as a shared language. A <b>detection engineer<\/b> builds rules and learns from analytic AN1950 that this activity is noisy and largely invisible, so detection focuses on later stages such as Initial Access. A <b>threat hunter<\/b> diffs SNMP walks against the NMS baseline. An <b>incident responder<\/b> reconstructs what an attacker learned before the break-in. A <b>red teamer<\/b> plays the same steps in sanctioned tests. A <b>GRC or control owner<\/b> maps mitigation M1056: you cannot fully prevent pre-compromise recon, so you <b>minimise the firmware data the outside world can see<\/b>.<\/div>\n<div class=\"prose\" style=\"margin-top:8px\"><b>Tools and documents you will meet:<\/b> the ATT&amp;CK site and Navigator, asset inventories, vendor advisories, SNMP tooling (snmpwalk), command-line readers (dmidecode, sysfs), web-console logs, and short reports. In this exam you will read logs, sort artefacts, build commands in a safe fake shell, and make small decisions - like the real job. All addresses in the exercises are defanged on purpose (written like 10[.]20[.]5[.]31), a professional reporting habit.<\/div>\n", "rules": [{"icon": "◉", "title": "Goal and pass mark", "body": "Answer exercises, earn credits. Your score is the sum of credits over the exercises you answered, divided by how many you answered. <b>Pass mark: 70%.<\/b>"}, {"icon": "∑", "title": "Partial credit", "body": "Exercises with several correct items are scored per item: each right item adds credit, each wrong pick subtracts. A partly right answer still earns partial credit - but selecting everything can cancel your credit to zero."}, {"icon": "⏸", "title": "Check buys unlimited thinking time", "body": "Pressing <b>Check<\/b> stops the timer automatically. Study the feedback as long as you want - the timer runs again only when you press <b>Next<\/b> (or <b>Final Submit<\/b> on the last exercise)."}, {"icon": "❚❚", "title": "Manual pause", "body": "The <b>Pause<\/b> button stops the timer and hides the exercise for a real break. Press <b>Resume<\/b> to continue where you were."}, {"icon": "⏭", "title": "Skip and come back", "body": "Every exercise has <b>Skip<\/b>. Skipped exercises wait in a pool; before finishing you can return to them as often as you like while the timer is running. Skipped-and-never-answered exercises are simply excluded from your score."}, {"icon": "○", "title": "One hint per exercise", "body": "A hint costs <b>10% of that exercise's credit<\/b> and pushes you in the right direction - it never gives the answer away."}, {"icon": "⏱", "title": "Timer", "body": "The timer is tuned to this file's difficulty and length. Watch its state in the header: running, paused manually, paused for feedback, or ended."}, {"icon": "⚑", "title": "Retake", "body": "Fail the pass mark and you can retake the exam - questions and answer positions are shuffled again."}, {"icon": "⚑", "title": "This file's severity", "body": "This is the <b>EXTREMELY HARD<\/b> file: chains of decisions, conflicting signals, real costs, and senior-level judgement calls under pressure. Exercise types you will meet: single and multi-answer questions, drag-and-drop sorting, matching, gap-fill sentences, ordering and ranking, clickable spot-the-flaw, a safe fake terminal, and branching decision scenarios."}], "meta": "Site integration: topicId t1592.003 - batch 4 - pass mark 70 - 16 exercises - about 75 minutes.", "foot": "All indicators are defanged. Nothing in this file contacts the network."}, "keywords": [{"theme": "Senior decisions", "chips": ["Conflicting evidence", "Source authority", "Cost acceptance", "Escalation", "Proportionate response"]}, {"theme": "Program-level mitigation", "chips": ["M1056 Pre-compromise", "Data minimisation", "Attack-surface reduction", "Change control", "Vendor advisory discipline"]}, {"theme": "Hypothesis testing", "chips": ["Timeline reconstruction", "Noise vs signal", "Incomplete information", "Confidence levels", "Competing hypotheses"]}, {"theme": "Reporting quality", "chips": ["Defanged IOCs", "CISO briefing", "Correct ATT&CK mapping", "Behaviour-level reporting", "Chain of custody"]}, {"theme": "Dual perspective", "chips": ["Baseline blending (red)", "Baseline diffing (blue)", "Read-only evidence handling"]}], "exercises": [{"id": "X1", "type": "branch", "summary": "CMDB vs live device: resolve and decide (4 steps)", "scenario": ["The CISO needs a decision in 10 minutes. Five artefacts just arrived and two of them disagree.", {"label": "ARTEFACT 1 - CMDB export", "mono": true, "text": "FW-EDGE-01 | model GW-800 (EOL 2027)\nfirmware: 9.1.2 | last audit: 2024-11"}, {"label": "ARTEFACT 2 - SNMP answer, external source 198[.]51[.]100[.]77", "mono": true, "text": "sysDescr.0 = \"GW-900, Firmware 8.1.9\""}, {"label": "ARTEFACT 3 - vendor firmware table", "mono": true, "text": "GW-900 8.1.9 - vulnerable (CVE-2025-1337, pre-auth RCE)\nfixed in 8.2.4. GW-800 models not affected."}, {"label": "ARTEFACT 4 - change ticket CHG-8812", "mono": true, "text": "Hardware swap GW-800 to GW-900 completed 3 weeks ago.\nCMDB update was scheduled but never executed."}, {"label": "ARTEFACT 5 - NMS log (noise)", "mono": true, "text": "06:00 printer PR-7 polled sysDescr by NMS (scheduled)."}], "question": "Walk the IC's decision chain. Every step is graded at the final check.", "steps": [{"question": "CMDB says GW-800 (not affected). The live device answers as GW-900 8.1.9. Which source wins for the exposure question?", "options": ["The CMDB, because it is the asset database of record and audited", "The NMS scheduled poll, because it is the newest log entry", "Neither one; wait for the yearly asset audit to settle it", "The live device's own answer, corroborated by the change ticket"], "correct": 3, "outcome": "Direct observation plus the change ticket explains the disagreement.", "whyOk": "Evidence that observes the device directly outranks a stale database, and CHG-8812 explains exactly why the CMDB is stale.", "whyNo": "A database of record can be wrong; the noise poll and the audit wait both leave the exposure open."}, {"question": "Is the device exploitable per the vendor table?", "options": ["Yes - GW-900 8.1.9 matches the vulnerable range", "No - the CMDB still says GW-800, and the CMDB is authoritative", "Only if attackers already hold a valid user account on it", "Unknown until the next patch cycle confirms the version"], "correct": 0, "outcome": "Pre-auth RCE on the true model and version: exploitable without any account.", "whyOk": "The vendor table keys on the true model and exact version, both now established.", "whyNo": "The CMDB is stale, the CVE is pre-auth, and the patch cycle is not a source of truth."}, {"question": "The gateway serves 800 users. What do you do in the next 30 minutes?", "options": ["Reboot the gateway right now to clear its memory and any injected code", "Escalate to the incident commander; propose patch or temporary ACL via change control", "Post the CVE number and the gateway's address in the all-company chat now", "Do nothing at all for now; recon-only traffic is harmless by itself here"], "correct": 1, "outcome": "Proportionate, controllable mitigation with the right owner - in 10 minutes.", "whyOk": "Escalation plus a targeted, change-controlled fix matches the evidence and the business stakes.", "whyNo": "A reboot destroys state for no gain; a chat post leaks detail; doing nothing ignores a pre-auth exposure."}, {"question": "The IC asks what to do about the CMDB entry itself.", "options": ["Edit the CMDB right now during the incident to match the device", "Ignore the CMDB from now on and work from live reads only", "Raise a correction task and fix inventory drift after containment", "Delete the asset record so the drift cannot mislead anyone"], "correct": 2, "outcome": "The drift is documented, the record is preserved, the fix is scheduled.", "whyOk": "The record is also incident evidence; correction is a process task that follows containment.", "whyNo": "Editing mid-incident corrupts the record and the audit trail; ignoring or deleting keeps the drift forever."}], "hint": "One artefact explains why two sources disagree. Evidence that observes the device directly outranks a stale database.", "explain": "The chain tests senior discipline: resolve the conflict with the best-corroborated source (live answer plus change ticket), key the vulnerability on the true model and version, escalate with a proportionate and change-controlled mitigation, and treat the CMDB drift as a process defect to fix after containment. Two signals contradicted; the resolution principle - direct observation over stale records - decided it.", "study": "Practise stating, per conflict: which source wins, and why it wins here.", "perItem": {}}, {"id": "X2", "type": "terminal", "summary": "Evidence-safe firmware read under legal scrutiny", "scenario": ["Legal wants firmware evidence from host ws-4471 that will survive scrutiny. The forensic image is still running; the live-response window is short. Nothing may be written to the compromised disk, firmware state may not change, and the host must stay up. The lead has already exported RAM.", {"label": "ARTEFACT 1 - lead's constraint note", "text": "Read the BIOS version from the SMBIOS tables exposed by the kernel (sysfs). One command, screen output only. Any state change voids the evidence plan. Recommended window: 4 minutes."}], "question": "Type the single read-only command that prints the BIOS version from the sysfs DMI tables.", "terminal": {"prompt": "root@ws-4471:~# ", "banner": "Live response on COMPROMISED host. No writes. No state change.", "canonical": "cat /sys/class/dmi/id/bios_version", "recommendedSeconds": 240, "elements": [{"re": "\\b(cat|less|more|head|nl)\\b", "label": "a plain read-only file reader (cat, less, more, head)"}, {"re": "/sys/class/dmi/id/bios_version", "label": "the sysfs path /sys/class/dmi/id/bios_version"}], "forbidden": [{"re": "dd\\s+if=/dev/(mtd|mem|mmcblk|nvme)", "label": "dd against raw devices", "why": "raw reads can hang the box, and any of= writes evidence-destroying data", "danger": true, "dangerMsg": "dd against raw flash or memory can hang the live host, and redirecting its output writes over evidence-relevant storage. The sysfs file gives you the same fact safely."}, {"re": "efivar\\s+(-w|--write)|efivar\\s+.*-w", "label": "writing UEFI variables", "why": "changes firmware state on an evidence host", "danger": true, "dangerMsg": "Writing UEFI variables modifies firmware state - the one thing legal asked you not to touch."}, {"re": "dmidecode\\s+--dump-bin|>\\s*/\\S*|\\btee\\s", "label": "dumping or redirecting to disk", "why": "the disk must receive nothing during live response", "danger": true, "dangerMsg": "A dump or redirect writes onto the compromised disk - exactly what the evidence plan forbids."}, {"re": "\\breboot\\b|\\bshutdown\\b|systemctl\\s+reboot", "label": "reboot into firmware setup", "why": "kills volatile state and the running image job", "danger": true, "dangerMsg": "Rebooting destroys volatile evidence and interrupts the forensic image that is still running."}], "successOut": "2.14.0", "failOut": "cat: wrong path - look under /sys/class/dmi/id/", "explainParts": [{"part": "cat (or less, more, head)", "why": "a plain reader that prints the file and writes nothing anywhere"}, {"part": "/sys/class/dmi/id/bios_version", "why": "the kernel's read-only view of the SMBIOS BIOS version - first-hand firmware data with zero state change"}]}, "hint": "The lead's note already names the source: sysfs. The only decision left is which reader touches nothing.", "explain": "cat /sys/class/dmi/id/bios_version reads the kernel's own view of the SMBIOS data: first-hand, read-only, no state change (any plain reader such as less or more is equally safe). Every attractive alternative fails the constraints: dd against /dev/mtd0 or /dev/mem risks a hang and writes, efivar -w changes firmware state, --dump-bin and redirects land on the compromised disk, and a reboot into BIOS setup destroys the volatile evidence the image is collecting. The command was the easy part; accepting the constraint was the test.", "study": "Live-response drill: for every fact, find the read-only path that changes nothing.", "perItem": {}}, {"id": "X3", "type": "qcm", "summary": "The standard playbook that is wrong here", "scenario": ["SOC leadership proposes the standard playbook: isolate every endpoint that touched recon indicators. Here that means cutting 40 edge devices off the network at once."], "question": "Why is mass isolation the wrong call in this pre-compromise case?", "options": ["There is nothing inside to isolate; the recon ran outside, and mass cuts only cost observability and uptime", "Isolation at this scale is illegal without a written warrant signed by legal counsel first", "Edge devices cannot be isolated at all, because their firmware has no isolation mode", "Isolation only ever works for managed laptops, never for network appliances like these"], "correct": [0], "hint": "Ask what isolation buys when the adversary never touched the devices.", "explain": "A widely used best practice fails here because the premise is different: T1592.003 is pre-compromise, so there is no foothold to cut off. Mass isolation costs observability (you lose the very telemetry that would catch the next stage) and business function, while the adversary simply continues from outside. Targeted measures - SNMP source restrictions, exposure scrubs, focused captures - match the evidence.", "study": "Playbooks encode assumptions; check the tactic phase before applying them.", "perItem": {}}, {"id": "X4", "type": "qcm", "summary": "Two sources disagree on the version: which wins?", "scenario": ["Scanner banner: 'Firmware 2.14'. Vendor matrix: 2.14.0 is fixed, 2.13.9 is not. Inventory: the model runs either 2.13.x or 2.14.x."], "question": "Which signal wins for the vulnerability decision, and why?", "options": ["The vendor's authoritative table, read with exact version strings - banners can truncate", "The scanner, because it reads the device directly and its data is the freshest", "The inventory, because netops maintains it and reviews it every quarter", "None of them; treat the device as fixed for now to avoid alert fatigue"], "correct": [0], "hint": "Which source defines what '2.14' even means for vulnerability status?", "explain": "Two signals contradicted; the winner is the authoritative source read with exact strings. A banner regex that keeps three fields cannot distinguish 2.14.0 (fixed) from 2.13.9 (vulnerable) once truncation or rounding is in play - the scanner still helps, but it does not decide. The inventory is secondary context, and declaring the device fixed to silence an alert is how exposures survive.", "study": "Version discipline: exact strings from the authoritative table, every time.", "perItem": {}}, {"id": "X5", "type": "match", "summary": "Match each gap to the control that best compensates", "scenario": ["Budget review: three gaps, three proposed controls, one pairing each. Near-misses are intentional."], "question": "For each control, pick the gap it best compensates.", "left": [{"id": "l1", "text": "SNMPv3 plus source ACLs on the device VLAN"}, {"id": "l2", "text": "Scrub firmware details from public documents and portals"}, {"id": "l3", "text": "Awareness training on suspicious surveys and questionnaires"}], "right": [{"id": "r1", "text": "Best for: external SNMP walks reading firmware strings"}, {"id": "r2", "text": "Best for: firmware facts leaking via accessible data sets"}, {"id": "r3", "text": "Best for: elicitation of firmware details from staff (T1598-style)"}], "hint": "Each control kills one read path: the wire, the document, the person.", "explain": "SNMPv3 with source ACLs closes the wire path that walks use. Scrubbing public documents closes the accessible-data-set path the ATT&CK page describes. Awareness closes the human path that phishing-for-information rides. Each pairing matches the control to the channel it removes - the discipline M1056 asks for when prevention must become minimisation.", "study": "For every recon channel, name the control that removes that channel - not a neighbour.", "perItem": {}, "correct": {"l1": "r1", "l2": "r2", "l3": "r3"}}, {"id": "X6", "type": "branch", "summary": "SOC lead chain: scope, evidence, reporting (3 steps)", "scenario": ["You are the SOC lead. Overnight, one external IP walked sysDescr on several edge devices. The business is watching.", {"label": "ARTEFACT 1 - flow summary", "mono": true, "text": "198[.]51[.]100[.]77 -> sysDescr.0 on 3 of 40 edge devices\nwindow 02:14-02:19, read-only, no write attempts"}], "question": "Lead the response. Every step is graded at the final check.", "steps": [{"question": "The director asks: how many devices are in scope?", "options": ["All 40 devices - assume compromise everywhere and isolate immediately", "Zero devices - scheduled walks like this one are completely normal", "3 devices, from flow records - confirmed scope for now, pending deeper review", "Only the printer, because it also answered the scheduled walk"], "correct": 2, "outcome": "Scope is evidence-based and stated with its caveat.", "whyOk": "Flow records give a defensible scope; the caveat keeps the door open for more data.", "whyNo": "Assuming breach everywhere burns trust and resources; zero ignores the capture; the printer is a distractor."}, {"question": "The IC asks how to get firmware evidence from the production gateway this week, but ops refuses any downtime without approval.", "options": ["Reboot the gateway tonight without approval; the case justifies the risk", "Collect read-only live data now; schedule the offline image for an approved window", "Image the firmware over the network now, during peak traffic hours", "Tell legal the CMDB entry is enough evidence of what the device runs"], "correct": 1, "outcome": "Evidence keeps flowing within the constraints; the image follows through change control.", "whyOk": "Read-only live capture adds evidence without unapproved state changes, and the approved window protects both the business and the case.", "whyNo": "An unapproved reboot is an uncontrolled state change; peak-hour network imaging is unreliable and risky; the CMDB is not evidence - step one just proved it."}, {"question": "The CISO wants an update in 10 minutes. What do you send?", "options": ["A one-page note: scope, decision taken, evidence plan, confidence, caveats", "A 40-page forensic dump with the full PCAP set as an email attachment", "Nothing at all until the attacker has been arrested and charged", "The raw PCAP files by email so the executives can judge themselves"], "correct": 0, "outcome": "Decision-grade information, with confidence stated honestly.", "whyOk": "Executives need findings, decisions, and caveats - one page, traceable.", "whyNo": "Dumps and raw PCAP are not decisions; silence transfers the risk to the business."}], "hint": "Each step asks for judgement, not heroics: scope what you can prove, work within the constraints, report decisions.", "explain": "The chain mirrors a senior lead's day: scope from evidence with caveats, keep evidence flowing inside the constraints (read-only live data now, the offline image through an approved window), and report at decision altitude with confidence stated. Forcing an unapproved reboot and declaring the CMDB sufficient are the two tempting extremes here, and both are wrong.", "study": "Practise the one-page format: findings, decisions, evidence plan, confidence, caveats.", "perItem": {}}, {"id": "X7", "type": "blank", "summary": "Fill the CISO briefing (five references)", "scenario": ["Your one-pager needs its references before the CISO meeting."], "question": "Pick one item for each gap.", "segments": ["Briefing: The actor used ", {"id": "b1"}, " (firmware recon) in the ", {"id": "b2"}, " tactic. The activity is ", {"id": "b3"}, " (platform PRE), so we saw little of it. Per ", {"id": "b4"}, ", we are minimising firmware data in public sources. Our best detection hope remains watching ", {"id": "b5"}, " channels."], "bank": ["T1592.003", "Reconnaissance", "pre-compromise", "M1056", "Initial Access", "T1486", "post-compromise", "M1021"], "blanks": {"b1": ["T1592.003"], "b2": ["Reconnaissance", "TA0043"], "b3": ["pre-compromise"], "b4": ["M1056"], "b5": ["Initial Access"]}, "hint": "Five blanks: an ID starting with T1592, a tactic, a word starting with 'pre', an M-number from the page, and the later tactic where detection can focus.", "explain": "The briefing names the sub-technique, its tactic, the PRE (pre-compromise) platform, the M1056 minimisation guidance, and the Initial Access focus from AN1950. T1486 (encryption for impact) and M1021 (restrict web-based traffic) are plausible-looking but belong to other parts of the framework; 'post-compromise' contradicts the platform.", "study": "Executives remember one-liners; make every reference field exact.", "perItem": {"b3": {"ok": "", "no": "PRE means pre-compromise - before the break-in."}, "b4": {"ok": "", "no": "The page's mitigation is M1056 Pre-compromise."}, "b5": {"ok": "", "no": "AN1950 points defenders at Initial Access as the stage to watch."}}, "blanksOrder": ["b1", "b2", "b3", "b4", "b5"]}, {"id": "X8", "type": "order", "summary": "Two hypotheses, one timeline - order it and exclude the noise", "scenario": ["Two hypotheses compete: an external actor doing pre-compromise recon, or routine internal churn. Six intake entries below; one has no actor link.", {"label": "ARTEFACT 1 - intake entries", "text": "A. Public resume mentions the firm's UEFI fleet\nB. Job posting repeats the BIOS environment detail\nC. VPS IP walks sysDescr on 3 edge devices\nD. Spearphish cites the exact gateway model\nE. VPN probe from a residential proxy\nF. Documented patch installed on the office printer"}], "question": "Order the five actor-linked entries and move the unrelated entry to the exclude box.", "items": [{"id": "h1", "text": "A - resume mentions the UEFI fleet"}, {"id": "h2", "text": "B - posting repeats the BIOS detail"}, {"id": "h3", "text": "C - VPS walks sysDescr on 3 devices"}, {"id": "h4", "text": "D - spearphish cites the gateway model"}, {"id": "h5", "text": "E - VPN probe from a residential proxy"}, {"id": "h6", "text": "F - documented printer patch"}], "excludedId": "h6", "hint": "Open-source breadcrumbs come before the walk; the walk before targeted contact; probing last. One entry has no link to the actor.", "explain": "The external-recon hypothesis explains the order: cheap open-source reads (resume, posting), then the device walk, then contact that uses the collected detail, then probing. Each step consumes the previous one - the branching signature of chain reasoning. The documented printer patch supports the churn hypothesis but has no actor link, so it stays out of the timeline; the incomplete information (who wrote the resume) is acknowledged, not invented.", "study": "Build timelines under one hypothesis, then test the excluded entries against the others.", "perItem": {"h6": {"ok": "Documented, planned, and unrelated to the actor.", "no": "A documented patch has no actor link - it is noise for this hypothesis."}}, "correct": ["h1", "h2", "h3", "h4", "h5"]}, {"id": "X9", "type": "qcm", "summary": "The attribution claim you cannot make", "scenario": ["The walk tooling matches a commodity framework used by many actors. Your manager wants a specific APT name in tonight's report."], "question": "Which conclusion can you defend?", "options": ["Low confidence: the technique alone cannot attribute; keep behaviour-level reporting", "High confidence: this tool is used by exactly one group, and we can name it", "No report may mention ATT&CK techniques, because that would burn our sources", "Attribution is proven by the target's industry, which fits this actor's profile"], "correct": [0], "hint": "How many actors share commodity tooling and the same technique?", "explain": "Technique and tooling overlap are shared currency; attribution needs converging, distinctive evidence. The defensible line is behaviour-level reporting with low confidence on actors. 'The tool belongs to one group' overstates commodity tooling, industry alone proves nothing, and ATT&CK language belongs in reports - it is the shared vocabulary that keeps them precise.", "study": "State confidence per claim; never let a tool name stand in for an actor.", "perItem": {}}, {"id": "X10", "type": "branch", "summary": "Dual perspective: blend in, then catch the blend (2 steps)", "scenario": ["Same lab, same exposure, expert level. The NMS baseline is rich, and both sides know it."], "question": "Play both sides. The chain is graded at the final check.", "steps": [{"question": "RED: Your next enumeration must look like routine NMS traffic. Best approach?", "options": ["Walk all 40 devices in one second from the same VPS again", "Walk from a host that already legitimately polls the NMS, same window", "Walk from your personal VPS at 03:00 again, with a new community", "Collect telnet banners from the visitor car park overnight"], "correct": 1, "outcome": "Blending into the baseline is the red teamer's edge - and the defender's nightmare.", "whyOk": "Same source class, same community, same window: the walk hides inside the documented pattern.", "whyNo": "The VPS burst, the odd hour, and the car park all create deltas that a tuned baseline catches."}, {"question": "BLUE: Which pivot catches the blended walk best?", "options": ["Search all traffic for the word 'firmware' to catch the walks", "Disable SNMP on every device, permanently, starting today", "Alert on every SNMP GET response the devices send back", "Diff source, objects, and timing against the NMS inventory and schedule"], "correct": 3, "outcome": "The delta survives blending: inventory plus schedule beats keyword noise.", "whyOk": "Even a careful blend drifts on source identity, object set, or micro-timing - the diff surfaces it.", "whyNo": "Keyword search is the AN1950 false-positive trap; killing SNMP and alerting on GETs are blanket moves with real costs."}], "hint": "Both sides answer the same question: what does normal look like, and what sits just outside it?", "explain": "Red perspective: the best evasion is to inherit the baseline's legitimacy - source, community, window. Blue perspective: the durable counter is the three-way diff (source, objects, timing) against inventory and schedule, because perfect blending is impossible in practice. The pair shows why keyword alerts lose and baseline discipline wins.", "study": "Write your baseline down to three fields - source, objects, window - and diff against it weekly.", "perItem": {}}, {"id": "X11", "type": "qcm", "summary": "Thin signal: act now or gather more?", "scenario": ["You find an unknown IP reading sysDescr.0 on one lab gateway. PCAP shows reads only, no writes. The device is low-value, and the source has no other history."], "question": "What is the best next move?", "options": ["Watchlist the IP, extend PCAP retention, and verify asset ownership before acting", "Wipe and reflash the gateway firmware tonight to purge any tampering", "Silence the alert and close the case to keep the queue clean", "Email the source's ISP your full case file and demand action today"], "correct": [0], "hint": "The signal is thin. Which option buys information without cost?", "explain": "With one read on a low-value device and no history, the proportionate move is to buy information: watchlist the source, keep the captures, and resolve the asset question - unmanaged devices change the whole picture. Wiping destroys state and evidence for a thin signal; silencing the alert deletes the only thread you have; contacting an ISP with an unvetted case file is a disclosure decision that is not yours to make alone.", "study": "Match escalation to signal strength; 'gather more evidence' is a real answer.", "perItem": {}}, {"id": "X12", "type": "dnd", "summary": "Confidence triage: confirmed, suspected, or unrelated", "scenario": ["Seven artefacts for the case file. The review board wants confidence zones, not a flat list."], "question": "Drag each artefact to the confidence zone it deserves.", "items": [{"id": "c1", "text": "PCAP: external GET of sysDescr.0 returning 'Firmware 8.2.4'"}, {"id": "c2", "text": "Console access log: unknown IP fetched the firmware info page"}, {"id": "c3", "text": "Public resume mentioning the company's BIOS fleet"}, {"id": "c4", "text": "Purchase invoice listing a firmware support contract, published by accident"}, {"id": "c5", "text": "Internal NMS scheduled poll of sysDescr"}, {"id": "c6", "text": "Unknown IP tried admin passwords on the gateway"}, {"id": "c7", "text": "Job posting asking for 'UEFI experience'"}], "zones": [{"id": "z1", "label": "Confirmed T1592.003 - direct read of firmware data"}, {"id": "z2", "label": "Suspected T1592.003 - indirect exposure of firmware facts"}, {"id": "z3", "label": "Unrelated to this technique"}], "hint": "Direct reads of firmware data confirm. Public documents that merely expose firmware facts are indirect. Routine polls and password attacks are other techniques.", "explain": "Confirmed: the PCAP GET that returned a firmware string, and the console page fetch - firmware data moved on the wire. Suspected: the resume, the leaked invoice, and the posting - each exposes firmware facts about the victim without a direct read, matching the accessible-data-set clause. Unrelated: the scheduled NMS poll is routine, and the password attempts are credential attacks, not firmware recon. Confidence zones keep the report honest.", "study": "Confirm needs a read on the wire; documents only ever support 'suspected'.", "perItem": {"c5": {"ok": "Routine, scheduled, registered source - not attacker behaviour.", "no": "A scheduled NMS poll is the baseline, not a technique hit."}, "c6": {"ok": "Credential attacks are a different technique family.", "no": "Password attempts do not read firmware facts - different technique."}}, "correct": {"c1": "z1", "c2": "z1", "c3": "z2", "c4": "z2", "c5": "z3", "c6": "z3", "c7": "z2"}}, {"id": "X13", "type": "qcm", "summary": "Approve the outage: cost acceptance in practice", "scenario": ["The only way to image the production gateway's firmware is a 15-minute outage. Ops offers tonight 02:00 with rollback ready. Legal needs the image 'soon' for the case."], "question": "What do you approve?", "options": ["The 15-minute outage in tonight's window, with rollback ready", "No outage ever; write a memo recommending the image next quarter", "A reboot right now, during peak traffic, to finish an hour sooner", "Skip the image and cite the CMDB entry as firmware evidence"], "correct": [0], "hint": "Which option balances evidence quality, business cost, and the legal need?", "explain": "Approving the bounded outage accepts a real, known cost to gain first-hand, defensible firmware evidence - the trade senior responders make explicit. 'Never' fails the legal need with no benefit; peak-hour reboots accept an unbounded cost; and a CMDB field is not evidence of what the device actually runs - as this very case showed.", "study": "Say the cost out loud, pick the window, and sign off - that is cost acceptance.", "perItem": {}}, {"id": "X14", "type": "clickwrong", "summary": "Fix the hunting report before it ships", "scenario": ["A junior analyst's hunting report is due. The board will check defanging, mapping, confidence, and mitigation logic."], "question": "Select every flawed line. Selec 'use strict';
/* CyberPulseAcademy practice exam engine - T1592.003 batch files.
   Self-contained: vanilla JS only, no external requests. */
var D = null;            /* exam data injected per file */
var S = null;            /* runtime state */
var TICK = null;

var T_RUNNING = 'RUNNING';
var T_MANUAL = 'PAUSED_MANUAL';
var T_AUTOCHECK = 'PAUSED_AUTO_CHECK';
var T_ENDED = 'ENDED';

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmtTime(sec){ var m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function fmtSum(x){ return (Math.round(x*10)/10).toFixed(1); }

/* Partial-credit scoring (mandatory formula): max(0, (H - W) / N), returned as a real number in [0, 1] */
function scoreExercise(selectedItems, correctItems){
  return scoreDetail(selectedItems, correctItems).credit;
}
function scoreDetail(selectedItems, correctItems){
  var cs = {};
  for (var i=0;i<correctItems.length;i++){ cs[correctItems[i]] = true; }
  var H = 0, W = 0;
  for (var j=0;j<selectedItems.length;j++){ if (cs[selectedItems[j]]) { H++; } else { W++; } }
  var N = correctItems.length;
  var missed = [];
  for (var k=0;k<correctItems.length;k++){ if (selectedItems.indexOf(correctItems[k]) < 0){ missed.push(correctItems[k]); } }
  return { credit: Math.max(0, (H - W) / N), H: H, W: W, N: N, missed: missed };
}

/* ---------- timer state machine ---------- */
function setState(newState){
  if (!S) return;
  var now = Date.now();
  var dt = Math.round((now - S.stateSince)/1000);
  if (S.state === T_RUNNING){ S.timeRunning += dt; }
  else if (S.state === T_MANUAL){ S.timeManualPause += dt; }
  else if (S.state === T_AUTOCHECK){ S.timeFeedbackPause += dt; }
  S.state = newState;
  S.stateSince = now;
  paintTimer();
}
function paintTimer(){
  if (!S) return;
  var el = $('hdrTimer'); if (!el) return;
  var label = '', cls = '';
  if (S.state === T_RUNNING){ label = '\u25B6 RUNNING \u00B7 ' + fmtTime(S.secondsLeft); cls = 't-run'; }
  else if (S.state === T_MANUAL){ label = '\u23F8 PAUSED \u2014 manual (press Resume) \u00B7 ' + fmtTime(S.secondsLeft); cls = 't-manual'; }
  else if (S.state === T_AUTOCHECK){ label = '\u23F8 PAUSED \u2014 reviewing feedback (resumes on Next) \u00B7 ' + fmtTime(S.secondsLeft); cls = 't-auto'; }
  else { label = '\u23F9 ENDED \u00B7 ' + fmtTime(S.secondsLeft); cls = 't-end'; }
  el.className = 'chip timer ' + cls;
  el.innerHTML = esc(label);
  var pb = $('btnPause');
  if (pb){
    if (S.state === T_MANUAL){ pb.textContent = '\u25B6 Resume'; pb.setAttribute('aria-label','Resume timer'); }
    else { pb.textContent = '\u23F8 Pause'; pb.setAttribute('aria-label','Pause timer'); }
    pb.disabled = (S.state === T_ENDED);
  }
}
function tick(){
  if (!S || S.state !== T_RUNNING) return;
  S.secondsLeft -= 1;
  if (S.secondsLeft <= 0){ S.secondsLeft = 0; setState(T_ENDED); endByTimeout(); return; }
  paintTimer();
}
function startTimer(){
  if (TICK) clearInterval(TICK);
  TICK = setInterval(tick, 1000);
}

/* ---------- exam data preparation ---------- */
function prepareExercises(){
  var order = shuffle(D.exercises.map(function(e,i){ return i; }));
  S.order = order;
  S.byId = {};
  D.exercises.forEach(function(ex){ S.byId[ex.id] = ex; });
  S.view = order.map(function(ix){ return D.exercises[ix]; });
  S.answered = {}; S.credits = {}; S.skipped = []; S.hintUsed = {};
  S.pos = 0; S.reviewing = false; S.currentView = null; S.fromReview = false;
  S.answerLog = [];
  S.view.forEach(function(ex, vi){
    prepareOne(ex, vi);
  });
}
function prepareOne(ex, vi){
  var p = { perm: {} };
  if (ex.type === 'qcm' || ex.type === 'multi'){
    var idxs = ex.options.map(function(o,i){ return i; });
    p.optOrder = shuffle(idxs);
    p.correctSet = ex.correct.slice();
  } else if (ex.type === 'dnd'){
    p.itemOrder = shuffle(ex.items.map(function(it){ return it.id; }));
  } else if (ex.type === 'match'){
    p.rightOrder = shuffle(ex.right.map(function(r){ return r.id; }));
  } else if (ex.type === 'blank'){
    p.bankOrder = shuffle(ex.bank);
  } else if (ex.type === 'order'){
    p.cur = shuffle(ex.items.map(function(it){ return it.id; }));
    p.excluded = [];
  } else if (ex.type === 'branch'){
    p.step = 0;
    p.stepOpts = ex.steps.map(function(st){
      var idxs = st.options.map(function(o,i){ return i; });
      return shuffle(idxs);
    });
    p.picks = [];
  } else if (ex.type === 'clickwrong'){
    p.lineOrder = shuffle(ex.lines.map(function(l,i){ return i; }));
  } else if (ex.type === 'terminal'){
    p.lastCmd = '';
  }
  S.answered[ex.id] = false;
  S.credits[ex.id] = 0;
  S.hintUsed[ex.id] = false;
  S['perm_' + ex.id] = p;
}

/* ---------- boot & intro ---------- */
function boot(data){
  D = data;
  D.exercises.forEach(function(ex){
    if (ex.type === 'terminal'){
      (ex.terminal.elements || []).forEach(function(el){ el._re = new RegExp(el.re, 'i'); });

}

/* ---------- header ---------- */
function renderHeader(){
  var h = '';
  h += '<header class="hdr" id="examHdr">';
  h += '<div class="brand"><span class="mid">' + esc(D.examLabel) + '</span>' + severityBadge(D.severity) + '</div>';
  h += '<span class="chip" id="hdrCount">Exercise \u2013 of \u2013</span>';
  h += '<span class="chip timer t-run" id="hdrTimer" role="status">\u25B6 RUNNING</span>';
  h += '<span class="chip" id="hdrScore" aria-live="polite">Score 0.0 / 0 (0%)</span>';
  h += '<span class="spacer"></span>';
  h += '<button class="hbtn" id="btnHint">\u25CB Hint</button>';
  h += '<button class="hbtn warn" id="btnSkip">Skip</button>';
  h += '<button class="hbtn" id="btnPause">\u23F8 Pause</button>';
  h += '</header>';
  var old = $('examHdr');
  if (old){ old.remove(); }
  document.body.insertAdjacentHTML('afterbegin', h);
  $('btnHint').addEventListener('click', useHint);
  $('btnSkip').addEventListener('click', skipEx);
  $('btnPause').addEventListener('click', togglePause);
}
function paintCount(){
  var el = $('hdrCount');
  if (!el) return;
  if (S.reviewing || S.currentView === null){ el.textContent = 'Review / skipped pool'; return; }
  var done = 0;
  D.exercises.forEach(function(ex){ if (S.answered[ex.id]) done++; });
  var cur = S.currentView;
  if (cur && S.answered[cur.id]){ el.textContent = 'Exercise ' + done + ' of ' + S.view.length + ' (answered)'; }
  else { el.textContent = 'Exercise ' + (done + 1) + ' of ' + S.view.length; }
}
function paintScore(){
  var el = $('hdrScore'); if (!el) return;
  var sum = 0, n = 0;
  D.exercises.forEach(function(ex){
    if (S.answered[ex.id]){ sum += S.credits[ex.id]; n += 1; }
  });
  var pct = n > 0 ? Math.round((sum / n) * 100) : 0;
  el.textContent = 'Score ' + fmtSum(sum) + ' / ' + n + ' (' + pct + '%)';
}
function togglePause(){
  if (!S || S.state === T_ENDED) return;
  if (S.state === T_MANUAL){
    setState(S.stateBeforeManual || T_RUNNING);
    var bx = $('exBody');
    if (bx) bx.classList.remove('hidden');
  } else {
    S.stateBeforeManual = S.state;
    setState(T_MANUAL);
    var b = $('exBody');
    if (b) b.classList.add('hidden');
  }
  paintTimer();
}

/* ---------- flow ---------- */
function startExam(){
  S = { state: T_RUNNING, stateSince: Date.now(), secondsLeft: D.timerSeconds,
        timeRunning: 0, timeManualPause: 0, timeFeedbackPause: 0, stateBeforeManual: null,
        startedAt: Date.now(), attempt: (S && S.attempt ? S.attempt + 1 : 1) };
  S.fromReview = false;
  prepareExercises();
  renderHeader();
  startTimer();
  setState(T_RUNNING);
  showExercise(0);
  window.scrollTo(0,0);
}
function showExercise(pos){
  S.pos = pos;
  S.currentView = S.view[pos];
  S.reviewing = false;
  paintCount(); paintScore();
  renderExercise();
}
function advance(){
  var i = S.pos + 1;
  while (i < S.view.length && (S.answered[S.view[i].id] || S.skipped.indexOf(S.view[i].id) >= 0)){ i++; }
  if (i < S.view.length){
    showExercise(i);

  }
}
function skipEx(){
  if (S.reviewing) return;
  if (!S.currentView || S.answered[S.currentView.id]) return;
  if (S.state === T_MANUAL) return;         /* header actions are locked during a manual break */
  var ex = S.currentView;
  if (S.skipped.indexOf(ex.id) < 0){ S.skipped.push(ex.id); }   /* never duplicate pool entries */
  if (S.fromReview){ S.fromReview = false; openReviewSkipped(); return; }
  advance();
}
function useHint(){
  if (S.reviewing) return;
  if (S.state === T_MANUAL) return;         /* header actions are locked during a manual break */
  var ex = S.currentView;
  if (!ex || S.answered[ex.id] || S.hintUsed[ex.id]) return;
  S.hintUsed[ex.id] = true;
  var box = $('hintBox');
  if (box){
    box.classList.remove('hidden');
    box.innerHTML = '<b><span aria-hidden="true">\u25CB</span> Hint (\u221210% of this exercise credit):</b> ' + esc(ex.hint);

}

/* ---------- widget wiring ---------- */
function wireWidget(ex, p){
  if (ex.type === 'dnd'){ wireDND(ex, p); }
  else if (ex.type === 'order'){ paintOrder(ex, p); wireOrder(ex, p); }
  else if (ex.type === 'branch'){ paintBranch(ex, p); }
  else if (ex.type === 'terminal'){ wireTerminal(ex, p); }
  else if (ex.type === 'clickwrong'){ wireClickWrong(ex, p); }
}
function wireClickWrong(ex, p){
  document.querySelectorAll('.cw-line').forEach(function(b){
    b.addEventListener('click', function(){
      if (S.answered[ex.id]) return;
      b.classList.toggle('sel');
      var on = b.classList.contains('sel');
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      var t = b.querySelector('.tick');
      if (t){ t.textContent = on ? '[x]' : '[ ]'; }
    });
  });
}
function wireDND(ex, p){
  var bank = $('bank');
  var zones = document.querySelectorAll('.zone[data-zone]');
  function placeIn(zoneEl, itemId){
    var chip = document.querySelector('.chip-it[data-item="' + itemId + '"]');
    if (!chip) return;
    zoneEl.querySelector('.z-drop').appendChild(chip);
    chip.classList.remove('picked');
    p.pickedItem = null;
  }
  p.itemOrder.forEach(function(iid){
    var it = ex.items.filter(function(x){ return x.id === iid; })[0];
    bank.insertAdjacentHTML('beforeend', chipHTML(it));
  });
  bank.addEventListener('click', function(ev){
    var chip = ev.target.closest('.chip-it');
    if (!chip) return;
    if (bank.contains(chip)){ togglePick(chip); }
    else { bank.appendChild(chip); }
  });
  function togglePick(chip){
    var was = chip.classList.contains('picked');
    document.querySelectorAll('.chip-it.picked').forEach(function(c){ c.classList.remove('picked'); });
    p.pickedItem = was ? null : chip.getAttribute('data-item');
    if (!was){ chip.classList.add('picked'); }
  }
  zones.forEach(function(z){
    z.addEventListener('click', function(ev){
      if (ev.target.closest('.chip-it')){ return; }
      if (p.pickedItem){ placeIn(z, p.pickedItem); }
    });
    z.addEventListener('dragover', function(ev){ ev.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', function(){ z.classList.remove('over'); });
    z.addEventListener('drop', function(ev){
      ev.preventDefault(); z.classList.remove('over');
      var id = ev.dataTransfer.getData('text/plain');
      if (id){ placeIn(z, id); }
    });
  });
  document.addEventListener('dragstart', function(ev){
    var chip = ev.target.closest ? ev.target.closest('.chip-it') : null;
    if (chip){ ev.dataTransfer.setData('text/plain', chip.getAttribute('data-item')); }
  });
}
function paintOrder(ex, p){
  var list = $('ordList');
  var html = '';
  p.cur.forEach(function(iid, ix){
    var it = ex.items.filter(function(x){ return x.id === iid; })[0];
    html += '<li class="ord-it" data-oi="' + iid + '"><span class="pos" aria-label="position">' + (ix + 1) + '</span>';
    html += '<span class="ord-txt">' + esc(it.text) + '</span>';
    html += '<button type="button" class="obtn" data-up="' + iid + '" aria-label="move up">\u2191</button>';
    html += '<button type="button" class="obtn" data-down="' + iid + '" aria-label="move down">\u2193</button>';
    if (ex.excludedId){ html += '<button type="button" class="obtn" data-excl="' + iid + '" aria-label="exclude this item">\u26D4</button>'; }
    html += '</li>';
  });
  list.innerHTML = html;
  if (ex.excludedId){
    var zd = document.querySelector('#ordExcl .z-drop');
    zd.innerHTML = '';
    p.excluded.forEach(function(iid){
      var it = ex.items.filter(function(x){ return x.id === iid; })[0];
      zd.insertAdjacentHTML('beforeend', '<button type="button" class="chip-it" data-item="' + iid + '">' + esc(it.text) + ' \u00B7 click to restore</button>');
    });
    document.querySelectorAll('#ordExcl .chip-it').forEach(function(c){
      c.addEventListener('click', function(){
        var iid = c.getAttribute('data-item');
        var k = p.excluded.indexOf(iid);
        if (k >= 0){ p.excluded.splice(k, 1); p.cur.push(iid); }
        paintOrder(ex, p);
      });
    });
  }
}
function wireOrder(ex, p){
  var list = $('ordList');
  list.addEventListener('click', function(ev){
    var up = ev.target.getAttribute('data-up');
    var down = ev.target.getAttribute('data-down');
    var exc = ev.target.getAttribute('data-excl');
    if (up){ moveOrd(p, up, -1); paintOrder(ex, p); }
    else if (down){ moveOrd(p, down, 1); paintOrder(ex, p); }
    else if (exc){
      var k = p.cur.indexOf(exc);
      if (k >= 0){ p.cur.splice(k, 1); p.excluded.push(exc); }
      paintOrder(ex, p);
    }
  });
}
function moveOrd(p, iid, dir){
  var ix = p.cur.indexOf(iid);
  var nx = ix + dir;
  if (ix < 0 || nx < 0 || nx >= p.cur.length) return;
  var tmp = p.cur[ix]; p.cur[ix] = p.cur[nx]; p.cur[nx] = tmp;
}
function paintBranch(ex, p){
  var box = $('brSteps');
  var h = '';
  for (var i = 0; i <= p.step && i < ex.steps.length; i++){
    var st = ex.steps[i];
    var isLast = (i === ex.steps.length - 1);
    h += '<div class="step-lab">STEP ' + (i + 1) + ' OF ' + ex.steps.length + '</div>';
    h += '<p class="prose" style="font-weight:700">' + esc(st.question) + '</p>';
    h += '<div class="opts">';
    p.stepOpts[i].forEach(function(oi, di){
      var dis = (p.picks[i] !== undefined) || (i < p.step);
      var checked = (p.picks[i] === oi);
      h += '<label class="opt' + (dis ? ' dis' : '') + '"><input type="radio" name="br' + i + '" value="' + oi + '"' + (checked ? ' checked' : '') + (dis ? ' disabled' : '') + '>';
      h += '<span class="lab">' + String.fromCharCode(65 + di) + '.</span><span>' + esc(st.options[oi]) + '</span></label>';
    });
    h += '</div>';
    if (p.picks[i] !== undefined && st.outcome){
      h += '<div class="step-note">' + esc(st.outcome) + '</div>';
    }
    h += '<hr class="divider" style="margin:12px 0">';
  }
  box.innerHTML = h;
  var cur = p.step;
  if (cur < ex.steps.length){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn primary';
    btn.id = 'brConfirm';
    var isLast = (cur === ex.steps.length - 1);
    btn.textContent = isLast ? 'Check final answer' : 'Confirm step and continue';
    box.appendChild(btn);
    btn.addEventListener('click', function(){
      if (ex.type === 'branch' && cur < ex.steps.length){
        var sel = document.querySelector('input[name="br' + cur + '"]:checked');
        if (!sel){ return; }
        p.picks[cur] = parseInt(sel.value, 10);
        p.step = cur + 1;
        paintBranch(ex, p);
        var st = ex.steps[cur];
        if (p.step >= ex.steps.length){
          var note = document.createElement('div');
          note.className = 'step-note';
          note.textContent = 'All steps are locked in \u2014 your feedback is below.';
          box.appendChild(note);
        }
        if (isLast){ doCheck(); }
      }
    });
  }
}
function wireTerminal(ex, p){
  var input = $('termIn');
  if (ex.terminal.recommendedSeconds){
    var winEl = $('termWin');
    var left = ex.terminal.recommendedSeconds;
    if (window.__termWinInt){ clearInterval(window.__termWinInt); }
    window.__termWinInt = setInterval(function(){
      if (!S || S.state !== T_RUNNING) return;   /* the advisory window pauses with the main timer */
      left -= 1;
      if (!winEl){ if (window.__termWinInt){ clearInterval(window.__termWinInt); } return; }
      if (left > 0){
        winEl.textContent = '\u23F1 Recommended window: ' + fmtTime(left) + ' \u2014 advisory only. The graded clock stays the main timer.';
      } else {
        winEl.textContent = '\u26A0 Recommended window elapsed. Take the time you need \u2014 the graded clock stays the main timer.';
        winEl.className = 'z-hint it-no';
        if (window.__termWinInt){ clearInterval(window.__termWinInt); window.__termWinInt = null; }
      }
    }, 1000);
  }
  function run(){
    var cmd = input.value;
    if (!cmd.trim()) return;
    p.lastCmd = cmd;
    var scr = $('termScr');
    scr.innerHTML += '<span class="cmd">' + esc(ex.terminal.prompt + cmd) + '</span>\n';
    var res = judgeTerminalQuiet(ex, cmd);
    if (res.allOk){ scr.innerHTML += esc(ex.terminal.successOut) + '\n'; }
    else { scr.innerHTML += esc(ex.terminal.failOut) + '\n'; }
    scr.scrollTop = scr.scrollHeight;
    input.value = '';
  }
  $('termRun').addEventListener('click', run);
  input.addEventListener('keydown', function(ev){ if (ev.key === 'Enter'){ run(); } });
}
function normCmd(c){
  c = String(c || '').trim().replace(/\s+/g, ' ').toLowerCase();
  c = c.replace(/^\s*sudo\s+/, '');
  c = c.replace(/\[\.\]/g, '.');
  return c;
}
function judgeTerminalQuiet(ex, cmd){
  var n = normCmd(cmd);
  var okReq = 0, bad = 0;
  ex.terminal.elements.forEach(function(el){ if (el._re.test(n)){ okReq++; } });
  (ex.terminal.forbidden || []).forEach(function(f){ if (f._re.test(n)){ bad++; } });
  return { allOk: (okReq === ex.terminal.elements.length && bad === 0), okReq: okReq, bad: bad };
}

/* ---------- collect answers ---------- */
function collectAnswer(ex, p){
  if (ex.type === 'qcm' || ex.type === 'multi'){
    var sel = [];
    document.querySelectorAll('input[name="optSel"]:checked').forEach(function(i){ sel.push(i.getAttribute('data-oi')); });
    return sel.length ? sel : null;
  }
  if (ex.type === 'dnd'){
    var placed = {};
    var any = false;
    ex.items.forEach(function(it){
      var chip = document.querySelector('.chip-it[data-item="' + it.id + '"]');
      var z = chip.closest('[data-zone]');
      var zid = z ? z.getAttribute('data-zone') : '__bank';
      if (zid !== '__bank'){ placed[it.id] = zid; any = true; }
    });
    return any ? placed : null;
  }
  if (ex.type === 'match'){
    var pairs = {}; var anyM = false;
    document.querySelectorAll('.m-sel').forEach(function(s){
      var v = s.value;
      if (v){ pairs[s.getAttribute('data-left')] = v; anyM = true; }
    });
    return anyM ? pairs : null;
  }
  if (ex.type === 'blank'){
    var b = {}; var anyB = false;
    document.querySelectorAll('.blank-sel').forEach(function(s){
      if (s.value){ b[s.getAttribute('data-blank')] = s.value; anyB = true; }
    });
    return anyB ? b : null;
  }
  if (ex.type === 'order'){
    var st = {};
    p.cur.forEach(function(iid, ix){ st[iid] = ix; });
    p.excluded.forEach(function(iid){ st[iid] = '__excl'; });
    return st;
  }
  if (ex.type === 'branch'){
    return p.picks.length ? { picks: p.picks.slice(0, p.step) } : null;
  }
  if (ex.type === 'clickwrong'){
    var selL = [];
    document.querySelectorAll('.cw-line.sel').forEach(function(b){ selL.push(parseInt(b.getAttribute('data-line'), 10)); });
    return selL.length ? selL : null;
  }
  if (ex.type === 'terminal'){
    return p.lastCmd ? { cmd: p.lastCmd } : null;
  }
  return null;
}
/* ---------- grading ---------- */
function row(icon, cls, txt){
  return { icon: icon, cls: cls, text: txt };
}
function perTxt(ex, key, ok){
  var pi = ex.perItem && ex.perItem[key];
  if (!pi) return '';
  return ok ? (pi.ok || '') : (pi.no || '');
}
function grade(ex, ans, p){
  var R = { rows: [], canonical: null, danger: [] };
  if (ex.type === 'qcm' || ex.type === 'multi'){
    var corr = ex.correct.map(function(c){ return String(c); });
    var r = scoreExercise(ans, corr);
    ex.correct.forEach(function(ci){
      var k = String(ci);
      if (ans.indexOf(k) >= 0){ R.rows.push(row('\u2713','it-ok','Correct: ' + ex.options[ci] + ' ' + perTxt(ex,'o'+k,true))); }
      else { R.rows.push(row('\u25CB','it-miss','Missed: ' + ex.options[ci] + ' ' + perTxt(ex,'o'+k,true))); }
    });
    ans.forEach(function(k){
      if (ex.correct.indexOf(parseInt(k,10)) < 0){
        R.rows.push(row('\u2717','it-no','Wrong: ' + ex.options[parseInt(k,10)] + ' ' + perTxt(ex,'o'+k,false)));
      }
    });
    R.credit = r.credit;
    return R;
  }
  if (ex.type === 'dnd'){
    var items = ex.items.map(function(it){ return it.id; });
    var okP = 0, badP = 0;
    ex.items.forEach(function(it){
      var zid = ans[it.id];
      var okz = ex.correct[it.id];
      if (zid === okz){ okP++; R.rows.push(row('\u2713','it-ok','Correct: "' + it.text + '" ' + zoneName(ex, zid) + perTxt(ex, it.id, true))); }
      else if (zid){ badP++; R.rows.push(row('\u2717','it-no','Wrong: "' + it.text + '" belongs in ' + zoneName(ex, okz) + perTxt(ex, it.id, false))); }
      else { R.rows.push(row('\u25CB','it-miss','Missed: "' + it.text + '" belongs in ' + zoneName(ex, okz) + perTxt(ex, it.id, true))); }
    });
    /* mandatory formula: H = correctly placed items, W = wrongly placed items, N = all items */
    R.credit = Math.max(0, (okP - badP) / items.length);
    return R;
  }
  if (ex.type === 'match'){
    var lids = ex.left.map(function(l){ return l.id; });
    var pairsOk = 0, pairsBad = 0;
    lids.forEach(function(lid){
      var chosen = ans[lid];
      var want = ex.correct[lid];
      var ltxt = ex.left.filter(function(x){ return x.id === lid; })[0].text;
      var rtxt = function(rid){ var rr = ex.right.filter(function(x){ return x.id === rid; })[0]; return rr ? rr.text : ''; };
      if (chosen === want){ pairsOk++; R.rows.push(row('\u2713','it-ok','Correct pair: ' + ltxt + ' \u2192 ' + rtxt(want) + ' ' + perTxt(ex, lid, true))); }
      else if (chosen){ pairsBad++; R.rows.push(row('\u2717','it-no','Wrong pair: ' + ltxt + ' \u2192 ' + rtxt(chosen) + ' ' + perTxt(ex, lid, false))); }
      else { R.rows.push(row('\u25CB','it-miss','Missed: ' + ltxt + ' \u2192 ' + rtxt(want) + ' ' + perTxt(ex, lid, true))); }
    });
    /* mandatory formula: H = correct pairs made, W = wrong pairs made, N = all pairs */
    R.credit = Math.max(0, (pairsOk - pairsBad) / lids.length);
    return R;
  }
  if (ex.type === 'blank'){
    var bids = ex.blanksOrder || Object.keys(ex.blanks);
    var fillsOk = 0, fillsBad = 0;
    bids.forEach(function(bid){
      var v = ans[bid];
      var want = ex.blanks[bid];
      var wlist = Array.isArray(want) ? want : [want];
      var okv = v && wlist.map(function(w){ return w.toLowerCase(); }).indexOf(String(v).toLowerCase()) >= 0;
      var wantTxt = wlist[0];
      if (okv){ fillsOk++; R.rows.push(row('\u2713','it-ok','Correct gap: ' + wantTxt + ' ' + perTxt(ex, bid, true))); }
      else if (v){ fillsBad++; R.rows.push(row('\u2717','it-no','Wrong gap: you picked "' + v + '", the answer is "' + wantTxt + '" ' + perTxt(ex, bid, false))); }
      else { R.rows.push(row('\u25CB','it-miss','Missed gap: the answer is "' + wantTxt + '" ' + perTxt(ex, bid, true))); }
    });
    /* mandatory formula: H = correctly filled gaps, W = wrongly filled gaps, N = all gaps */
    R.credit = Math.max(0, (fillsOk - fillsBad) / bids.length);
    return R;
  }
  if (ex.type === 'order'){
    var posOk = 0, posBad = 0;
    ex.correct.forEach(function(id, wantPos){
      var got = ans[id];
      var it = ex.items.filter(function(x){ return x.id === id; })[0];
      if (got === wantPos){ posOk++; R.rows.push(row('\u2713','it-ok','Position ' + (wantPos + 1) + ' is right: ' + it.text)); }
      else if (got === null || got === undefined){ R.rows.push(row('\u25CB','it-miss','Missed: "' + it.text + '" goes at position ' + (wantPos + 1))); }
      else { posBad++; R.rows.push(row('\u2717','it-no','Wrong position: "' + it.text + '" belongs at position ' + (wantPos + 1))); }
    });
    if (ex.excludedId){
      var itx = ex.items.filter(function(x){ return x.id === ex.excludedId; })[0];
      if (ans[ex.excludedId] === '__excl'){ posOk++; R.rows.push(row('\u2713','it-ok','Correctly excluded: ' + itx.text)); }
      else { posBad++; R.rows.push(row('\u2717','it-no','Wrong: "' + itx.text + '" does not belong in the workflow ' + perTxt(ex, ex.excludedId, false))); }
    }
    /* mandatory formula: H = items placed correctly (or correctly excluded), W = items placed wrongly, N = all items */
    var nOrd = ex.correct.length + (ex.excludedId ? 1 : 0);
    R.credit = Math.max(0, (posOk - posBad) / nOrd);
    return R;
  }
  if (ex.type === 'branch'){
    var steps = ex.steps;
    var stepsOk = 0, stepsBad = 0;
    steps.forEach(function(st, i){
      var pick = ans.picks[i];
      var okt = (pick === st.correct);
      if (pick === undefined){ R.rows.push(row('\u25CB','it-miss','Missed step ' + (i + 1) + ': ' + (st.whyOk || '') )); }
      else if (okt){ stepsOk++; R.rows.push(row('\u2713','it-ok','Step ' + (i + 1) + ' correct: ' + st.options[st.correct] + ' ' + (st.whyOk || perTxt(ex,'s'+i,true)))); }
      else { stepsBad++; R.rows.push(row('\u2717','it-no','Step ' + (i + 1) + ' wrong: you chose "' + st.options[pick] + '". Better: "' + st.options[st.correct] + '" ' + (st.whyNo || perTxt(ex,'s'+i,false)))); }
    });
    /* mandatory formula: H = steps answered correctly, W = steps answered wrongly, N = all steps */
    R.credit = Math.max(0, (stepsOk - stepsBad) / steps.length);
    return R;
  }
  if (ex.type === 'clickwrong'){
    var flawed = [], selF = [], cw = 0;
    ex.lines.forEach(function(l, i){
      if (l.flawed){ flawed.push('l' + i); if (ans.indexOf(i) >= 0){ selF.push('l' + i); } }
    });
    ans.forEach(function(i){ if (!ex.lines[i].flawed){ cw++; } });
    var rc = scoreExercise(selF, flawed);
    R.credit = Math.max(0, (rc.H - cw) / rc.N);
    ex.lines.forEach(function(l, i){
      var isF = !!l.flawed;
      var wasSel = ans.indexOf(i) >= 0;
      if (isF && wasSel){ R.rows.push(row('\u2713','it-ok','Rightly flagged: ' + short(l.text) + ' ' + perTxt(ex,'l'+i,true))); }
      else if (isF){ R.rows.push(row('\u25CB','it-miss','Missed flaw: ' + short(l.text) + ' ' + perTxt(ex,'l'+i,true))); }
      else if (wasSel){ R.rows.push(row('\u2717','it-no','Not a flaw: ' + short(l.text) + ' ' + perTxt(ex,'l'+i,false))); }
    });
    return R;
  }
  if (ex.type === 'terminal'){
    var n = normCmd(ans.cmd);
    var selT = [], corT = [], forb = [];
    ex.terminal.elements.forEach(function(el, i){
      corT.push('t' + i);
      if (el._re.test(n)){ selT.push('t' + i); }
    });
    (ex.terminal.forbidden || []).forEach(function(f, i){
      if (f._re.test(n)){
        forb.push(f);
        selT.push('f' + i);
      }
    });
    var rt = scoreExercise(selT, corT);
    R.credit = rt.credit;
    ex.terminal.elements.forEach(function(el, i){
      if (el._re.test(n)){ R.rows.push(row('\u2713','it-ok','Found: ' + el.label)); }
      else { R.rows.push(row('\u25CB','it-miss','Missing: ' + el.label)); }
    });
    (ex.terminal.forbidden || []).forEach(function(f, i){
      if (f._re.test(n)){
        R.rows.push(row('\u2717','it-no','Wrong / risky part: ' + f.label + ' ' + (f.why || '')));
        if (f.danger){ R.danger.push(f.dangerMsg || f.why || 'This command would change state.'); }
      }
    });
    R.canonical = ex.terminal.canonical;
    R.parts = ex.terminal.explainParts || [];
    return R;
  }
  R.credit = 0;
  return R;
}
function zoneName(ex, zid){
  var z = ex.zones.filter(function(x){ return x.id === zid; })[0];
  return z ? ('"' + z.label + '"') : '';
}
function short(t){ t = String(t); return t.length > 90 ? t.slice(0, 87) + '...' : t; }

/* ---------- exercise rendering ---------- */
function renderExercise(){
  var ex = S.currentView;
  var p = S['perm_' + ex.id];
  var h = '<div id="exBody">';
  h += renderScenario(ex);
  h += '<div class="blk quest"><div class="blk-head"><span class="ico" aria-hidden="true">\u2753</span> QUESTION</div>';
  h += '<div class="blk-body"><p class="prose" style="font-weight:800">' + esc(ex.question) + '</p></div></div>';
  h += '<div class="blk ans"><div class="blk-head"><span class="ico" aria-hidden="true">\u270D</span> YOUR ANSWER</div>';
  h += '<div class="blk-body">';
  h += widgetHTML(ex, p);
  h += '<div id="hintBox" class="synpanel hidden" role="note"></div>';
  h += '</div></div>';
  h += '<div class="actrow" id="actRow"><button class="btn primary" id="btnCheck">Check</button><span id="checkNote" class="it-no" role="alert"></span></div>';
  h += '<div id="fdbRoot"></div>';
  h += '</div>';
  $('app').innerHTML = h;
  if (window.__termWinInt){ clearInterval(window.__termWinInt); window.__termWinInt = null; }
  wireWidget(ex, p);
  $('btnCheck').addEventListener('click', doCheck);
  $('btnCollapse').addEventListener('click', toggleScenario);
  var hb = $('btnHint');
  if (hb) hb.disabled = !!S.hintUsed[ex.id];   /* hint already spent on a previous visit stays spent */
  var sb = $('btnSkip');
  if (sb) sb.disabled = S.answered[ex.id] || S.reviewing;
  window.scrollTo(0,0);
}
function widgetHTML(ex, p){
  if (ex.type === 'qcm' || ex.type === 'multi') return wQCM(ex, p);
  if (ex.type === 'dnd') return wDND(ex, p);
  if (ex.type === 'match') return wMATCH(ex, p);
  if (ex.type === 'blank') return wBLANK(ex, p);
  if (ex.type === 'order') return wORDER(ex, p);
  if (ex.type === 'clickwrong') return wCLICKWRONG(ex, p);
  if (ex.type === 'terminal') return wTERMINAL(ex, p);
  if (ex.type === 'branch') return wBRANCH(ex, p);
  return '';
}
function toggleScenario(){
  var b = $('scenBody');
  var btn = $('btnCollapse');
  if (!b) return;
  var show = (b.style.display === 'none');
  b.style.display = show ? '' : 'none';
  btn.textContent = show ? '(\u2013)' : '(+)';
  btn.setAttribute('aria-expanded', show ? 'true' : 'false');
}
function doCheck(){
  var ex = S.currentView;
  if (!ex || S.answered[ex.id]) return;
  var p = S['perm_' + ex.id];
  if (ex.type === 'branch' && p.picks.length < ex.steps.length){
    $('checkNote').textContent = 'Confirm every step first (use the button inside the last step).';
    return;
  }
  var ans = collectAnswer(ex, p);
  if (!ans){
    $('checkNote').textContent = 'Choose an answer first, or press Skip.';
    return;
  }
  setState(T_AUTOCHECK);           /* mandatory: Check stops the timer before feedback renders */
  var R = grade(ex, ans, p);
  var base = R.credit;
  var finalC = Math.max(0, base - (S.hintUsed[ex.id] ? 0.10 : 0));
  S.answered[ex.id] = true;
  S.credits[ex.id] = finalC;
  paintScore();
  renderFeedback(ex, R, base, finalC);
  var act = $('actRow');
  var isLast = (S.pos + 1 >= S.view.length) && !S.reviewing && !S.fromReview;
  var nh = '';
  if (S.reviewing || S.fromReview){ nh += '<button class="btn primary" id="btnNext">Return to review</button>'; }
  else if (isLast){ nh += '<button class="btn primary" id="btnNext">Final Submit</button>'; }
  else { nh += '<button class="btn primary" id="btnNext">Next</button>'; }
  act.innerHTML = nh;
  $('btnNext').addEventListener('click', onNext);
  var hb = $('btnHint'); if (hb) hb.disabled = true;
  var sb = $('btnSkip'); if (sb) sb.disabled = true;
  document.querySelectorAll('#exBody input, #exBody button.chip-it, #exBody .obtn, #exBody select, #exBody .cw-line, #exBody .btn').forEach(function(el){
    if (el.id === 'btnCollapse' || el.id === 'btnCopy' || el.id === 'btnNext') return;
    el.disabled = true;
  });
  var fb = $('fdbRoot');
  if (fb && fb.scrollIntoView){
    var smooth = true;
    try { if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) smooth = false; } catch (e) {}
    try { fb.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'nearest' }); } catch (e) {}
  }
}
function onNext(){
  if (S.fromReview){
    S.fromReview = false;
    setState(T_RUNNING);
    openReviewSkipped();
    return;
  }
  if (S.reviewing){
    setState(T_RUNNING);
    openReviewSkipped();
    return;
  }
  setState(T_RUNNING);
  var i = S.pos + 1;
  while (i < S.view.length && (S.answered[S.view[i].id] || S.skipped.indexOf(S.view[i].id) >= 0)){ i++; }
  if (i < S.view.length){ showExercise(i); }
  else { openReviewSkipped(); }   /* the review screen keeps the timer running; ENDED comes only with the results */
}
function renderFeedback(ex, R, base, finalC){
  var cls = finalC >= 1 ? 'ok' : (finalC > 0 ? 'part' : 'no');
  var lab = finalC >= 1 ? '\u2713 CORRECT' : (finalC > 0 ? '\u2713 PARTIALLY CORRECT' : '\u2717 INCORRECT');
  var N = R.rows.length || 1;
  var h = '';
  h += '<div class="fdb ' + cls + '" role="region" aria-label="Feedback">';
  h += '<div class="fdb-head"><span aria-hidden="true">' + (finalC >= 1 ? '\u2713' : (finalC > 0 ? '\u2713' : '\u2717')) + '</span> ' + lab;
  if (finalC < 1){
    h += '<span style="font-weight:600"> \u2014 credit ' + finalC.toFixed(2) + '</span>';
  }
  if (S.hintUsed[ex.id]){
    h += '<span style="font-weight:600"> (base credit ' + base.toFixed(2) + ' \u2212 0.10 hint penalty)</span>';
  }
  h += '</div><div class="fdb-body">';
  if (R.rows.length > 1){
    h += '<div class="itemgrid">';
    R.rows.forEach(function(r){
      h += '<div class="it-row"><span class="st ' + r.cls + '" aria-hidden="true">' + r.icon + '</span><span class="' + r.cls + '">' + esc(r.text) + '</span></div>';
    });
    h += '</div>';
  }
  h += '<div class="prose">' + esc(ex.explain) + '</div>';
  if (R.canonical){
    h += '<div class="synpanel"><div class="sp-t">Canonical command</div>';
    h += '<div class="copyline"><div class="mono" id="canCmd">' + esc(R.canonical) + '</div>';
    h += '<button type="button" class="obtn" id="btnCopy" aria-label="Copy canonical command">\u29C9</button></div>';
    h += '<div class="itemgrid">';
    R.parts.forEach(function(pt){
      h += '<div class="it-row"><span class="st it-ok" aria-hidden="true">\u203A</span><span><b>' + esc(pt.part) + '</b> \u2014 ' + esc(pt.why) + '</span></div>';
    });
    h += '</div></div>';
  }
  if (R.danger && R.danger.length){
    R.danger.forEach(function(d){
      h += '<div class="whatstudy" style="border-color:#6a1f1b;background:#321c1a"><b><span aria-hidden="true">\u26A0</span> Careful \u2014 this command was risky</b>' + esc(d) + '</div>';
    });
  }
  if (finalC < 1 && ex.study){
    h += '<div class="whatstudy"><b><span aria-hidden="true">\u25A6</span> What to study</b>' + esc(ex.study) + '</div>';
  }
  h += '</div></div>';
  $('fdbRoot').innerHTML = h;
  var cp = $('btnCopy');
  if (cp){
    cp.addEventListener('click', function(){
      var txt = R.canonical;
      function fallback(){
        var ta = document.createElement('textarea');
        ta.value = txt; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).catch(fallback); }
        else { fallback(); }
      } catch (e) { fallback(); }
    });
  }
}

/* ---------- results ---------- */
function showResults(byTimeout){
  if (TICK) clearInterval(TICK);
  if (S.state !== T_ENDED){ setState(T_ENDED); }
  var answered = 0, sum = 0, full = 0, part = 0, zero = 0, partSum = 0;
  var skippedOpen = 0;
  D.exercises.forEach(function(ex){
    if (S.answered[ex.id]){
      answered += 1;
      var c = S.credits[ex.id];
      sum += c;
      if (c >= 1){ full += 1; }
      else if (c > 0){ part += 1; partSum += c; }
      else { zero += 1; }
    } else if (S.skipped.indexOf(ex.id) >= 0){ skippedOpen += 1; }
  });
  var percent = answered > 0 ? Math.round((sum / answered) * 100) : 0;
  var passed = percent >= 70;
  var totalMin = Math.round((Date.now() - S.startedAt) / 60000);
  var h = '';
  h += '<div class="intro-hero"><h1>Results \u2014 ' + esc(D.examLabel) + '</h1>';
  h += '<div class="sub">' + severityBadge(D.severity) + '</div>';
  h += '<div class="pct ' + (passed ? 'pass' : 'fail') + '">' + percent + '%</div>';
  h += '<div style="font-weight:700;font-size:18px" class="' + (passed ? 'pass' : 'fail') + '">' + (passed ? '\u2713 PASS' : '\u2717 FAIL \u2014 you must retake this exam (pass mark 70%)') + '</div>';
  if (passed){
    var today = new Date();
    var iso = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    h += '<div class="certpanel" role="note">';
    h += '<div class="cp-t">\u2713 Certificate of completion</div>';
    h += '<div class="cp-n">' + esc(D.meta.title || D.examLabel) + '</div>';
    h += '<div class="cp-s">Result: ' + percent + '% \u00B7 pass mark 70% \u00B7 ' + iso + '</div>';
    h += '<div class="cp-s">Completed exercises: ' + answered + ' of ' + D.exercises.length + '</div>';
    h += '</div>';
  }
  if (byTimeout){ h += '<div class="step-note">The timer ended while exercises were still open. Unanswered exercises were excluded from the score.</div>'; }
  h += '<div class="resgrid">';
  h += '<div class="resbox"><div class="n">' + fmtSum(sum) + ' / ' + answered + '</div><div class="t">Sum of credits / answered exercises</div></div>';
  h += '<div class="resbox"><div class="n">' + full + '</div><div class="t">Fully correct</div></div>';
  h += '<div class="resbox"><div class="n">' + part + '</div><div class="t">Partially correct' + (part ? ' (avg ' + (partSum / part).toFixed(2) + ')' : '') + '</div></div>';
  h += '<div class="resbox"><div class="n">' + zero + '</div><div class="t">Fully incorrect</div></div>';
  h += '<div class="resbox"><div class="n">' + skippedOpen + '</div><div class="t">Skipped, never answered \u2014 NOT ANSWERED, EXCLUDED</div></div>';
  h += '</div>';
  h += '<div class="resgrid">';
  h += '<div class="resbox"><div class="n">' + totalMin + ' min</div><div class="t">Total time on this attempt</div></div>';
  h += '<div class="resbox"><div class="n">' + Math.round(S.timeRunning / 60) + ' min</div><div class="t">Timer running</div></div>';
  h += '<div class="resbox"><div class="n">' + Math.round(S.timeManualPause / 60) + ' min</div><div class="t">Paused manually (breaks)</div></div>';
  h += '<div class="resbox"><div class="n">' + Math.round(S.timeFeedbackPause / 60) + ' min</div><div class="t">Paused reviewing feedback</div></div>';
  h += '</div>';
  h += '<div class="actrow"><button class="btn green" id="btnRetake">Retake Exam</button></div>';
  h += '</div>';
  $('app').innerHTML = h;
  $('btnRetake').addEventListener('click', startExam);
  reportScore(sum, answered, percent, passed);
  window.scrollTo(0,0);
}

/* ---------- site integration (CyberPulseAcademy) ---------- */
var siteInit = {};
function reportScore(creditSum, answeredCount, percent, passed){
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: D.meta.topicId,
      batch: D.meta.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: passed
    }, location.origin);
  } catch (e) {
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}
window.addEventListener('message', function (event) {
  if (!event.data || typeof event.data !== 'object') { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  siteInit = { username: event.data.username || '', country: event.data.country || '', theme: event.data.theme || 'light', locale: event.data.locale || 'en' };
});

boot(EXAM_DATA);

</script>
