  .stage{padding:14px 10px 48px}
  .hdr{padding:8px 10px}
  .fact{font-size:12.5px}
}

  .progress-fill{transition:none}
  .progress-fill::after{animation:none;display:none}
  .btn,.opt,.bankitem,.order-btns button,.zone,.match-sel{transition:none}
  *{scroll-behavior:auto!important}
}

<script type="application/json" id="exam-data">{"topicId":"t1553.005","batch":1,"difficulty":"easy","severity":"EASY","passMark":70,"estimatedMinutes":20,"mitreId":"T1553.005","mitreName":"Mark-of-the-Web Bypass","objectType":"Sub-Technique","intro":{"learn":["This exam is about the MITRE ATT&CK sub-technique T1553.005, called Mark-of-the-Web Bypass. A sub-technique is one specific way attackers reach a goal. This one belongs to the Defense Evasion tactic: attackers use it to remove or avoid a security warning, so their file can run quietly on Windows.","Mark-of-the-Web (MOTW) is a small note that Windows attaches to files that arrive from the internet or from email. The note is stored in a hidden extra data stream named Zone.Identifier on the file. When you open a file that carries the note, Windows reacts: SmartScreen checks downloaded programs before they run, and Office opens documents in Protected View with macros blocked.","You will use this knowledge in real work. SOC analysts read alerts when a warning never appeared. Incident responders check whether someone removed the note from a file. Detection engineers build rules from PowerShell and Sysmon logs, and threat hunters search endpoints for files whose mark vanished. Mail security teams filter dangerous attachment types. Awareness teams teach users what the warnings mean, and administrators enforce the settings through MDM tools such as Intune.","Imagine a user downloads a fake invoice document from a website. This exam teaches you what the file carries, what Windows does because of it, and what an attacker does to make the warnings disappear."],"keywords":[{"theme":"MOTW basics","items":["Mark-of-the-Web (MOTW)","Zone.Identifier stream","who writes MOTW","the five zone numbers 0 to 4"]},{"theme":"What MOTW triggers","items":["SmartScreen warning","Protected View","macro blocking","Unblock checkbox in file Properties"]},{"theme":"Removal and checks","items":["Unblock-File","Get-Item -Stream *","reading a stream","triage order"]},{"theme":"Tactic context","items":["Defense Evasion","T1553.005 sub-technique"]}],"how":["You will answer 15 exercises. You need 70% or more to pass. A pass means you can use these ideas in your daily work.","Exercise types in this exam: multiple choice (single answer and one select-two), matching pairs, ordering steps, sorting cards into zones (drag and drop), and fill-in-the-blank.","A countdown timer runs for 20 minutes. The Pause button hides the exercise and stops the timer until you press Resume.","When you press Check, the timer stops automatically so you can read the feedback as long as you like. It starts again when you press Next.","Exercises with several items give partial credit: max(0, (correct − wrong) / items). One hint per exercise is allowed; it costs 10% of that exercise's credit.","Skip moves an exercise to a review pool. Near the end you can answer skipped exercises. Skipped exercises you never answer do not count in your score at all."]},"exercises":[{"id":"e01","type":"single","perspective":"neutral","scenario":{"summary":"A new colleague asks what Mark-of-the-Web is","text":["You are onboarding as a SOC analyst in a team that monitors Windows endpoints. A colleague asks you: “What does Mark-of-the-Web actually do?”","You remember the Windows security training you took last week."]},"question":"Which sentence describes Mark-of-the-Web correctly?","options":[{"id":"a","text":"A note Windows attaches to files that arrive from the internet"},{"id":"b","text":"A virus scanner that removes malware from every download"},{"id":"c","text":"A firewall that blocks unsafe websites at work"},{"id":"d","text":"A backup copy Windows keeps of every downloaded file"}],"correct":["a"],"hint":"It is not a program that runs. It is a note attached to the file itself.","explain":["Mark-of-the-Web is a note, not a program. Windows attaches it to files that arrive from outside, such as browser downloads and mail attachments. The note lets Windows decide how carefully to treat the file.","It is not a virus scanner, a firewall, or a backup. Windows has other features for those jobs. The note is the trigger that later causes warnings like the SmartScreen prompt."]},{"id":"e02","type":"blank","perspective":"defender","scenario":{"summary":"Where the mark is stored on disk","text":["During your shift you review a file a user saved on the Desktop. The file is called invoice.xlsx.","A senior analyst explains: on NTFS disks, the mark is not inside the document text. It is stored in a hidden extra stream that sits next to the file's normal content."]},"question":"Type the missing part of the stream name in the blank.","blanks":[{"before":"The hidden stream is named ","after":" on an NTFS volume.","answer":["Zone.Identifier"],"hint":"two words joined by a dot: the word Zone and the word Identifier"}],"hint":"The name combines the word Zone with the word Identifier.","explain":["The stream is called Zone.Identifier. It is an NTFS alternate data stream, so the document itself looks unchanged but one extra stream travels with the file.","You can list it with Get-Item -Stream * and read it with Get-Content -Stream Zone.Identifier. Removing only this stream removes the mark."]},{"id":"e03","type":"single","perspective":"neutral","scenario":{"summary":"Which programs attach the mark","text":["A teammate asks which programs actually attach Mark-of-the-Web to a file.","Four people guess in the team chat. Only one answer is right."]},"question":"Which answer about who attaches the mark is correct?","options":[{"id":"a","text":"Only web browsers can attach it, never mail tools"},{"id":"b","text":"Browsers, Outlook and chat apps when they save files"},{"id":"c","text":"Only the antivirus engine when it scans a file"},{"id":"d","text":"Only Windows Update when it installs a monthly patch"}],"correct":["b"],"hint":"Think of every app that brings a file in from outside the computer.","explain":["Browsers, Outlook and chat apps all save files from outside, so they all attach the mark when you save or download. The mark marks the origin, not danger.","It is not only browsers, and the antivirus or Windows Update do not add it. Any app that copies a file in from the internet zone can write the note."]},{"id":"e04","type":"match","perspective":"neutral","scenario":{"summary":"Cheat-sheet: the five zones","text":["Your team keeps a cheat-sheet that maps zone numbers to zone names.","The numbers come from the ZoneId value inside the Zone.Identifier stream of a file."]},"question":"Match each zone number to its zone name.","pairs":[{"left":"ZoneId=0","right":"Local machine zone"},{"left":"ZoneId=1","right":"Local intranet zone"},{"left":"ZoneId=2","right":"Trusted sites zone"},{"left":"ZoneId=3","right":"Internet zone"},{"left":"ZoneId=4","right":"Restricted sites zone"}],"hint":"0 is the most trusted (your own machine) and 4 is the least trusted.","explain":["The zones run from 0 to 4, from most trusted to least trusted: 0 local machine, 1 local intranet, 2 trusted sites, 3 internet, 4 restricted sites.","A normal web download carries ZoneId=3. The zone value decides how many warnings Windows shows when the file is opened."]},{"id":"e05","type":"drag","perspective":"defender","scenario":{"summary":"Which files carry the mark","text":["You prepare a short induction slide for new analysts: which files normally carry Mark-of-the-Web?","Sort the four files into the two columns."]},"question":"Sort each file into the correct column.","zones":[{"id":"z1","label":"Mark normally added","accepts":["i1","i3"]},{"id":"z2","label":"No mark expected","accepts":["i2","i4"]}],"items":[{"id":"i1","text":"A .zip file saved from a webmail attachment"},{"id":"i2","text":"A .dll produced by the company build server"},{"id":"i3","text":"An .exe downloaded from a software website"},{"id":"i4","text":"A .txt file the user typed in Notepad"}],"hint":"Ask one question per file: did it arrive from outside the computer, or was it created here?","explain":["Files that arrive from outside get the mark: the webmail attachment and the downloaded program both carry the Zone.Identifier stream.","Files created on the computer do not: the build server output and the Notepad file were born locally, so no mark exists and no download warning applies to them."]},{"id":"e06","type":"single","perspective":"neutral","scenario":{"summary":"What the user sees when the mark is present","text":["A user double-clicks a program called invoice_viewer.exe that was downloaded from a website.","The file still carries Mark-of-the-Web. Windows reacts before the program starts."]},"question":"What does Windows show because the file carries the mark?","options":[{"id":"a","text":"A SmartScreen warning that asks if you trust the file"},{"id":"b","text":"A blue screen and the computer restarts"},{"id":"c","text":"A request to buy a Windows licence"},{"id":"d","text":"Nothing — the program starts silently"}],"correct":["a"],"hint":"It is the full-screen warning that names the unrecognized app before it runs.","explain":["SmartScreen reads the mark and warns before a downloaded program runs for the first time. The user can dismiss it, but the warning appears while the mark is present.","There is no blue screen and no licence request. And it is not silent: silence is exactly what the mark's removal causes, which is the core of T1553.005."]},{"id":"e07","type":"order","perspective":"neutral","scenario":{"summary":"From download to warning","text":["A user downloads a document named budget_2025.docm from a website.","The three events below are shuffled. Put them in the order Windows performs them."]},"question":"Put the three events in the correct order.","steps":["The browser saves budget_2025.docm to the Downloads folder","Windows adds the Zone.Identifier stream to the file","Word opens the document in Protected View"],"hint":"First the file must arrive, then Windows can mark it, then the warning appears.","explain":["The download happens first. While saving, the browser lets Windows attach the Zone.Identifier stream to the new file.","Only then does the mark exist, so only then can Office react with Protected View. Remove the middle event and the last one changes too — that is the whole bypass."]},{"id":"e08","type":"blank","perspective":"attacker","scenario":{"summary":"Command found in a captured attack script","text":["You study a captured attack in a purple-team exercise. The attacker downloaded a fake tool and ran one PowerShell command before the user opened it.","The command removed the mark, so Windows showed no warning when the tool started."]},"question":"Type the missing cmdlet name in the blank.","blanks":[{"before":"The attacker ran:  ","after":" -Path C:\\Users\\sam\\Downloads\\tool.exe","answer":["Unblock-File"],"hint":"the PowerShell cmdlet whose name says what it does: unblock"}],"hint":"The cmdlet name says what it does to the file: it unblocks it.","explain":["The cmdlet is Unblock-File. It deletes the Zone.Identifier stream from the file, so Windows no longer treats it as a file from the internet.","After this command, SmartScreen stays quiet and Office skips Protected View. On a real incident the same command in PowerShell event 4104 is a strong detection signal for T1553.005."]},{"id":"e09","type":"match","perspective":"defender","scenario":{"summary":"Warning decoder for the service desk","text":["The service desk collected three Windows messages that confuse users, plus one settings line.","Match each line to what it really tells you."]},"question":"Match each line to its meaning.","pairs":[{"left":"“Windows protected your PC”","right":"SmartScreen blocked a file that carries the mark"},{"left":"“PROTECTED VIEW — Be careful…” in Word","right":"Office opened a marked document in read-only mode"},{"left":"“Macros have been disabled” in Excel","right":"Office blocked macros because the file came from the internet"},{"left":"“Unblock” tick box in file Properties","right":"A manual switch that removes the mark from the file"}],"hint":"Two messages are warnings that appear while the mark is present; the tick box removes it.","explain":["SmartScreen protects programs at first run, Protected View opens marked documents read-only, and the macros message is Office refusing macros from internet files. All three exist because the mark is still there.","The Unblock checkbox is different: it is the manual way to delete the mark. Attackers can reach the same result with Unblock-File, which is why defenders care who unblocks what."]},{"id":"e10","type":"order","perspective":"attacker","scenario":{"summary":"Reconstructed attack timeline","text":["A user ran a fake PDF-merge tool from a download site (hxxp://pdf-merge[.]example[.]com/get).","The SOC reconstructed the attacker's steps, but the three steps below arrived shuffled."]},"question":"Put the attacker's steps in the correct order.","steps":["Deliver the trojanized tool through the poisoned download link","Strip the mark with Unblock-File before the user opens it","Run the tool with no SmartScreen warning"],"hint":"The file must arrive first; the strip only helps while the mark is still there.","explain":["The attacker delivers first, because the mark only exists after the download. Then a small command removes the mark.","The launch comes last: with the mark gone, SmartScreen never appears. The order matters because stripping before delivery would do nothing."]},{"id":"e11","type":"blank","perspective":"defender","scenario":{"summary":"Listing every stream on a file","text":["A responder inspects a suspect file on an isolated analysis machine.","Before touching anything, she lists all the extra data streams attached to the file. PowerShell lists streams with the -Stream parameter and a wildcard."]},"question":"Type the missing part of the command in the blank.","blanks":[{"before":"She runs:  Get-Item -Path .\\setup.exe -Stream ","after":"","answer":["*"],"hint":"the wildcard that means every stream"}],"hint":"It is the single wildcard character that means everything.","explain":["The wildcard is the star: Get-Item -Path .\\setup.exe -Stream *. It lists every stream, so a missing Zone.Identifier is visible at a glance.","Reading first and changing nothing is the golden rule on evidence. Listing streams is read-only, which is why triage starts here."]},{"id":"e12","type":"drag","perspective":"dual","scenario":{"summary":"Slide for the awareness briefing","text":["You build one slide for a security awareness briefing: who does what around Mark-of-the-Web?","Sort the four cards into the two columns."]},"question":"Sort each card into the correct column.","zones":[{"id":"z1","label":"Defender mitigation","accepts":["i1","i3"]},{"id":"z2","label":"Attacker behaviour","accepts":["i2","i4"]}],"items":[{"id":"i1","text":"Keep SmartScreen turned on for all workstations"},{"id":"i2","text":"Remove the Zone.Identifier stream from a downloaded file"},{"id":"i3","text":"Teach users to respect the SmartScreen warning"},{"id":"i4","text":"Send invoice documents that open with macros enabled"}],"hint":"Does the card protect users, or does it try to make a warning disappear?","explain":["Attacker perspective: the attacker removes the Zone.Identifier stream so warnings disappear, and ships documents designed to open with macros live.","Defender perspective: keeping SmartScreen on and training users to respect its warning keep the mark meaningful and catch the moment a file feels wrong.","The same feature — the mark — is a shield for one side and an obstacle for the other."]},{"id":"e13","type":"multi","perspective":"neutral","scenario":{"summary":"True statements about the mark","text":["A junior analyst wrote four statements about Mark-of-the-Web for the team wiki.","Two statements are true. Two are wrong."]},"question":"Select the TWO statements that are true.","options":[{"id":"a","text":"The mark is stored in a separate stream, not inside the document text"},{"id":"b","text":"Only web browsers can attach the mark, never mail programs"},{"id":"c","text":"A file with the mark may open in Protected View in Office"},{"id":"d","text":"Deleting the file is the only way to remove the mark"}],"correct":["a","c"],"hint":"One wrong statement limits who writes the mark; the other says removal is impossible.","explain":["Statement a is true: the mark lives in the extra Zone.Identifier stream, so the document text itself is untouched. Statement c is true: Office reacts to the mark with Protected View.","Statement b is wrong because Outlook and chat apps attach the mark too. Statement d is wrong because Unblock-File and the Properties checkbox remove the stream without deleting the file."]},{"id":"e14","type":"order","perspective":"defender","scenario":{"summary":"Triage steps for a marked file","text":["A user forwarded a suspicious file named tax_form_2025.docm that was downloaded from hxxp://tax-forms[.]example[.]com/get.","You triage the file on an isolated analysis machine. The three steps below are shuffled."]},"question":"Put your triage steps in the correct order.","steps":["Copy the file to the analysis workspace and keep the original untouched","List the file's streams with Get-Item -Stream *","Read the Zone.Identifier stream with Get-Content -Stream Zone.Identifier"],"hint":"Protect the original first, then look at what is attached, then read the contents.","explain":["First you work on a copy, so the original keeps its evidence value. Then you list all streams to see what is attached.","Finally you read the Zone.Identifier stream to learn the claimed origin. This read-only order never destroys evidence and answers the origin question first."]},{"id":"e15","type":"single","perspective":"neutral","scenario":{"summary":"Which tactic does this belong to","text":["You tag an alert in the SIEM. The alert shows an attacker removed Mark-of-the-Web from a payload so it would run without warnings.","The ATT&CK sub-technique is T1553.005."]},"question":"Which ATT&CK tactic does T1553.005 belong to?","options":[{"id":"a","text":"Credential Access"},{"id":"b","text":"Defense Evasion"},{"id":"c","text":"Collection"},{"id":"d","text":"Impact"}],"correct":["b"],"hint":"The goal was to avoid a security warning, not to steal or destroy anything.","explain":["T1553.005 sits in the Defense Evasion tactic. Removing the mark does not steal data or damage anything — it hides the payload from a security check.","It is one sub-technique of the T1553 family (bypassing security features). Knowing the tactic helps you pivot: after the evasion, execution and other tactics usually follow."]}]}</script>
<script>
(function () {
  'use strict';

  /* ============================ utilities ============================ */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function mulberry32(seed) {
    var t = seed >>> 0;
    return function () {
      t += 0x6D2B79F5;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffled(arr, rnd) {
    var a = arr.slice(), i, j, tmp;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(rnd() * (i + 1));
      tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function fmt1(n) { return (Math.round(n * 10) / 10).toFixed(1); }
  function fmt2(n) { return (Math.round(n * 100) / 100).toFixed(2); }
  function fmtPct(sum, count) { return count > 0 ? Math.round((sum / count) * 100) : 0; }
  function hashId(s) {
    var h = 0, i;
    for (i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h;
  }
  function exSeed(ex, salt) { return ((S.seed ^ 0x9E3779B9) * 2654435761 + hashId(ex.id) * 97 + salt) >>> 0; }

  /* ============================ data ============================ */
  var DATA = JSON.parse($('exam-data').textContent);
  var EXS = DATA.exercises;
  var TOTAL = EXS.length;
  var BUDGET = (DATA.estimatedMinutes || 25) * 60;
  var PASSMARK = DATA.passMark || 70;
  var SEVCLS = { 'EASY': 'sev-easy', 'MEDIUM': 'sev-medium', 'HARD': 'sev-hard', 'EXTREMELY HARD': 'sev-extreme' };
  var byId = {};
  EXS.forEach(function (e) { byId[e.id] = e; });

  /* ============================ state ============================ */
  var S = {
    screen: 'intro',        // intro | exam | review | results
    attempt: 0,
    order: [],
    pos: 0,
    answers: {},            // exId -> widget state
    results: {},            // exId -> graded result
    skipped: [],            // exIds in the skip pool (never answered yet)
    hintUsed: {},
    creditSum: 0,
    answeredCount: 0,
    state: 'RUNNING',       // RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED
    resumeState: null,
    remaining: BUDGET,
    pauseAccum: { manual: 0, autoCheck: 0 },
    posted: false,
    mode: 'main',           // main | review
    reviewList: [],
    seed: 1,
    checkedId: null,
    exTimer: null,          // { exId, remaining } for per-exercise timed terminal exercises
    handshake: null
  };

  /* ============================ timer ============================ */
  var lastTick = Date.now();
  setInterval(function () {
    var now = Date.now();
    var dt = (now - lastTick) / 1000;
    lastTick = now;
    if (dt < 0 || dt > 2) { dt = 0.25; }
    if (S.state === 'RUNNING') {
      S.remaining -= dt;
      if (S.remaining <= 0) { S.remaining = 0; updateHeader(); endByTimeout(); return; }
      if (S.exTimer && !S.results[S.exTimer.exId] && S.screen === 'exam') {
        S.exTimer.remaining -= dt;
        var et = $('ex-timer-clock');
        if (et) { et.textContent = fmtClock(S.exTimer.remaining); }
        if (S.exTimer.remaining <= 0) { S.exTimer.remaining = 0; doCheck(true); }
      }
      updateTimerClock();
    } else if (S.state === 'PAUSED_MANUAL') {
      S.pauseAccum.manual += dt;
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      S.pauseAccum.autoCheck += dt;
    }
  }, 250);

  function updateTimerClock() {
    var el = $('hdr-clock');
    if (el) { el.textContent = fmtClock(S.remaining); }
  }
  function setState(next) {
    S.state = next;
    renderTimerPill();
    renderPauseOverlay();
  }
  function renderTimerPill() {
    var pill = $('hdr-timer');
    if (!pill) { return; }
    var clock = '<span class="t-clock" id="hdr-clock">' + fmtClock(S.remaining) + '</span>';
    if (S.state === 'RUNNING') {
      pill.className = 'pill pill-timer st-run';
      pill.innerHTML = '<span class="t-state">▶ Running</span>' + clock;
    } else if (S.state === 'PAUSED_MANUAL') {
      pill.className = 'pill pill-timer st-pause';
      pill.innerHTML = '<span class="t-state">⏸ PAUSED — manual (press Resume)</span>' + clock;
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      pill.className = 'pill pill-timer st-pause';
      pill.innerHTML = '<span class="t-state">⏸ PAUSED — reviewing feedback (resumes on Next)</span>' + clock;
    } else {
      pill.className = 'pill pill-timer st-end';
      pill.innerHTML = '<span class="t-state">■ Ended</span>' + clock;
    }
  }

  /* ============================ header ============================ */
  function headerHtml() {
    var sev = DATA.severity;
    var cls = SEVCLS[sev] || 'sev-easy';
    return '<header class="hdr" id="hdr">' +
      '<div class="hdr-row">' +
        '<span class="counter" id="hdr-counter"></span>' +
        '<span class="sev ' + cls + '" id="hdr-sev"><span class="dot" aria-hidden="true"></span>' + esc(sev) + '</span>' +
        '<span class="hdr-spacer"></span>' +
        '<span class="pill pill-timer" id="hdr-timer" role="timer"></span>' +
        '<span class="pill" id="hdr-score" aria-label="Live score"></span>' +
      '</div>' +
      '<div class="hdr-row">' +
        '<button type="button" class="btn" id="btn-hint">? Hint</button>' +
        '<button type="button" class="btn" id="btn-skip">Skip »</button>' +
        '<button type="button" class="btn" id="btn-pause">⏸ Pause</button>' +
        '<div class="progress" role="progressbar" id="hdr-progress" aria-label="Exam progress" aria-valuemin="0" aria-valuemax="' + TOTAL + '" aria-valuenow="0">' +
          '<div class="progress-fill" id="progress-fill"></div>' +
        '</div>' +
      '</div>' +
    '</header>';
  }
  function updateHeader() {
    var ex = currentEx();
    var counter = $('hdr-counter');
    if (counter) {
      if (S.screen === 'results') {
        counter.textContent = 'Exam complete';
      } else {
        var n = S.pos + 1;
        counter.textContent = (S.mode === 'review' ? 'Review · ' : '') + 'Exercise ' + n + ' of ' + TOTAL;
      }
    }
    var score = $('hdr-score');
    if (score) {
      var pct = fmtPct(S.creditSum, S.answeredCount);
      score.innerHTML = 'Score <b>' + fmt1(S.creditSum) + '</b>&nbsp;/&nbsp;' + S.answeredCount + ' · ' + pct + '%';
    }
    var hint = $('btn-hint'), skip = $('btn-skip'), pause = $('btn-pause');
    var answered = ex && !!S.results[ex.id];
    if (hint) {
      hint.disabled = answered || !!S.hintUsed[ex ? ex.id : ''] || S.state !== 'RUNNING' && S.state !== 'PAUSED_AUTO_CHECK';
      hint.setAttribute('aria-label', 'Hint (costs 10% of this exercise credit, one use only)');
    }
    if (skip) {
      skip.disabled = answered || S.state !== 'RUNNING';
      skip.setAttribute('aria-label', 'Skip this exercise and move it to the skipped pool');
    }
    if (pause) {
      var manual = S.state === 'PAUSED_MANUAL';
      pause.innerHTML = manual ? '▶ Resume' : '⏸ Pause';
      pause.disabled = S.state === 'ENDED';
      pause.setAttribute('aria-label', manual ? 'Resume the exam' : 'Pause the exam manually (hides the exercise)');
    }
    var fill = $('progress-fill');
    if (fill) {
      var done = S.answeredCount + S.skipped.length;
      var pctW = TOTAL > 0 ? Math.round((done / TOTAL) * 100) : 0;
      fill.style.width = pctW + '%';
      var pb = $('hdr-progress');
      if (pb) { pb.setAttribute('aria-valuenow', String(done)); }
    }
  }

  /* ============================ intro screen ============================ */
  function renderIntro() {
    S.screen = 'intro';
    var intro = DATA.intro;
    var kw = (intro.keywords || []).map(function (grp) {
      return '<div class="kw-theme"><h3>' + esc(grp.theme) + '</h3><ul>' +
        grp.items.map(function (k) { return '<li>' + esc(k) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    var html =
      '<div class="intro">' +
        '<section class="intro-strip" aria-label="Exam facts">' +
          '<h1>' + esc(DATA.mitreId) + ' — ' + esc(DATA.mitreName) + '</h1>' +
          '<div class="intro-sub">' + esc(DATA.objectType) + ' · MITRE ATT&CK · ' + esc(DATA.severity) + ' practice exam</div>' +
          '<div class="factrow">' +
            '<span class="fact"><b>' + TOTAL + '</b> exercises</span>' +
            '<span class="sev ' + (SEVCLS[DATA.severity] || 'sev-easy') + '"><span class="dot" aria-hidden="true"></span>' + esc(DATA.severity) + '</span>' +

  /* ============================ attempt control ============================ */
  function startAttempt() {
    S.attempt += 1;
    S.seed = 1 + S.attempt * 7919;
    S.order = EXS.map(function (_, i) { return i; });
    if (S.attempt > 1) {
      S.order = shuffled(S.order, mulberry32(S.seed));
    }
    S.pos = 0;
    S.answers = {};
    S.results = {};
    S.skipped = [];
    S.hintUsed = {};

    S.answeredCount = 0;

    S.mode = 'main';
    S.reviewList = [];

  function currentEx() {

  /* ============================ exercise rendering ============================ */
  function scenarioLong(sc) {

  function artefactHtml(a, idx) {
    var body;

  var SYN_RE = /(&quot;[^&]*?&quot;)|(\bT\d{4}(?:\.\d{3})?\b)|(--?[A-Za-z][\w-]*)|(\b[\w.\-]+(?:[\/\\][\w.\-@]+)+[\/\\]?)|(\b\d{1,3}(?:\[\.\]\d{1,3}){2,3}\b)|(\b(?:allowed|denied|accepted|rejected|granted|denied|quarantine|failed|success|error|warning|blocked|trusted|unblocked|Root|UNTRUSTED|SIGNATURE|PASS|FAIL)\b)/gi;
  function highlight(line) {

  }
  function optText(ex, oid) {

  function optsHtml(ex, kind) {

  function widgetHtml(ex) {

    } else if (ex.type === 'blank') {
      inner = '<p class="blankline">' + ex.blanks.map(function (b, i) {
        var val = a.blanks && a.blanks[i] ? a.blanks[i] : '';
        if (b.choices) {
          return esc(b.before) + '<select class="blank-sel" data-b="' + i + '" aria-label="' + esc(b.hint || 'Blank') + '">' +
            '<option value="">— choose —</option>' +
            b.choices.map(function (c) { return '<option value="' + esc(c) + '"' + (val === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') +
            '</select>' + esc(b.after || '');
        }
        return esc(b.before) + '<input type="text" class="blank-in" data-b="' + i + '" value="' + esc(val) + '" aria-label="' + esc(b.hint || 'Blank') + '" autocomplete="off" spellcheck="false" size="' + Math.max(10, Math.min(40, (b.answer[0] || '').length + 4)) + '">' + esc(b.after || '');
      }).join('') + '</p>';
    } else if (ex.type === 'drag') {
      if (!a.placed) { a.placed = {}; }
      if (!a.bankOrder) { a.bankOrder = shuffled(ex.items.map(function (it) { return it.id; }), mulberry32(exSeed(ex, 4))); }
      var placedIds = Object.keys(a.placed);
      var bankItems = ex.items.filter(function (it) { return placedIds.indexOf(it.id) < 0; });
      var inBank = a.bankOrder.filter(function (iid) { return bankItems.some(function (it) { return it.id === iid; }); });
      inner = '<div class="dnd">' +
        '<div class="bank" id="bank" aria-label="Item bank"><span class="bank-title">Items</span>' +
          inBank.map(function (iid) {

            return '<button type="button" class="bankitem" draggable="true" data-iid="' + esc(iid) + '">' + esc(it.text) + '<span class="place-note">Click to select, then click a zone</span></button>';
          }).join('') +
        '</div>' +
        '<div class="zones">' + ex.zones.map(function (z) {
          var inside = ex.items.filter(function (it) { return a.placed[it.id] === z.id; });
          return '<div class="zone" data-zid="' + esc(z.id) + '" tabindex="0" role="button" aria-label="Drop zone: ' + esc(z.label) + '. Select an item, then press Enter to place it.">' +
            '<div class="zone-h">' + esc(z.label) + '</div>' +

            }).join('') + '</div></div>';
        }).join('') + '</div></div>';
    } else if (ex.type === 'terminal') {
      if (!a.scroll) {

      var promptTxt = ex.terminal.prompt + ':~$';
      inner = '<div class="shell" role="group" aria-label="Simulated terminal (nothing is executed for real)">' +
        '<div class="shell-head"><span class="dot" aria-hidden="true"></span> simulated shell — offline sandbox, nothing is executed for real</div>' +
        '<div class="shell-out" id="shell-out">' + a.scroll.map(function (ln) { return '<div>' + highlight(ln) + '</div>'; }).join('') + '</div>' +
        '<div class="shell-in"><span class="prompt">' + esc(promptTxt) + '</span>' +
        '<input type="text" class="shell-cmd" id="shell-cmd" aria-label="Type a command and press Enter" autocomplete="off" autocapitalize="off" spellcheck="false"></div></div>' +
        '<div class="shell-note">Type the command and press Enter, then press <strong>Check answer</strong>. Unknown commands are rejected by the sandbox.</div>' +
        (ex.terminal.timeLimit ? '<div class="ex-timer" id="ex-timer">⏱ Exercise timer: <span class="t-clock" id="ex-timer-clock">' + fmtClock(S.exTimer && S.exTimer.exId === ex.id ? S.exTimer.remaining : ex.terminal.timeLimit) + '</span> — this limit applies to this exercise only</div>' : '');
    } else if (ex.type === 'branch') {
      var br = ex.branch;
      var st = a.bstep || 0;

      if (st < br.steps.length) {

          '<p class="q-text" style="font-size:15.5px;font-weight:600">' + esc(step.prompt) + '</p>' +
          '<div class="opts" style="margin-top:10px">' + step.options.map(function (o, i) {

              '<span class="opt-key">' + String.fromCharCode(65 + i) + '.</span><span class="opt-text">' + esc(o.text) + '</span>' +
              '<span class="opt-mark">' + (isSel ? '● Selected' : '') + '</span></button>';
          }).join('') + '</div>' +
          '<div class="branch-confirm"><button type="button" class="btn" id="btn-bconfirm" disabled>Confirm step</button></div>' +
          (a.outcomes && a.outcomes.length ? a.outcomes.map(function (o) { return '<div class="branch-outcome">' + esc(o) + '</div>'; }).join('') : '');
      } else {

          '<p class="q-text" style="font-size:15.5px;font-weight:600">' + esc(f.question) + '</p>' +
          '<div class="opts" style="margin-top:10px">' + f.options.map(function (o, i) {
            var isSel = fsel.indexOf(o.id) >= 0;
            return '<button type="button" class="opt" data-foid="' + esc(o.id) + '" role="' + (multi ? 'checkbox' : 'radio') + '" aria-checked="' + (!multi && isSel) + '" aria-pressed="' + (multi && isSel) + '">' +
              '<span class="opt-key">' + String.fromCharCode(65 + i) + '.</span><span class="opt-text">' + esc(o.text) + '</span>' +
              '<span class="opt-mark">' + (isSel ? '● Selected' : '') + '</span></button>';
          }).join('') + '</div>' +
          (multi ? '<p class="note">Select all options that apply.</p>' : '') +
          (a.outcomes && a.outcomes.length ? a.outcomes.map(function (o) { return '<div class="branch-outcome">' + esc(o) + '</div>'; }).join('') : '');
      }
    }
    if (S.hintUsed[ex.id]) {
      inner += '<div class="hint-panel" role="note"><div class="hp-h">? Hint — 10% of this exercise credit will be deducted</div>' + esc(ex.hint) + '</div>';
    }
    return '<fieldset class="widget-fs" id="widget-fs">' + inner + '</fieldset>';
  }
  function renderExam() {
    var ex = currentEx();
    if (!ex) { return; }
    S.checkedId = null;
    S.exTimer = null;
    if (ex.terminal && ex.terminal.timeLimit && !S.results[ex.id]) {
      S.exTimer = { exId: ex.id, remaining: ex.terminal.timeLimit };
    }

    app.innerHTML = headerHtml() + '<main class="stage" id="stage">' + exerciseHtml(ex) + '</main>';
    bindExercise(ex);
    updateHeader();
    renderTimerPill();
    var q = document.querySelector('.q-text');
    if (q) { q.setAttribute('tabindex', '-1'); q.focus({ preventScroll: true }); }

      var inp = $('shell-cmd');
      if (inp) { inp.focus({ preventScroll: true }); }

  }

  /* ============================ widget binding ============================ */
  function bindExercise(ex) {
    var toggle = $('btn-scen');
    if (toggle) {
      toggle.addEventListener('click', function () {
        var body = $('scen-body');
        var collapsed = body.classList.toggle('collapsed');
        toggle.setAttribute('aria-expanded', String(!collapsed));
        toggle.textContent = collapsed ? 'Show scenario' : 'Hide scenario';
        var sum = $('scen-summary');
        if (sum) { sum.style.display = collapsed ? '' : 'none'; }
      });
      if (scenarioLong(ex.scenario || {})) {
        var body = $('scen-body');
        body.classList.add('collapsed');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.textContent = 'Show scenario';
      }
    }
    Array.prototype.forEach.call(document.querySelectorAll('.logfilter'), function (inp) {
      inp.addEventListener('input', function () {
        var q = inp.value.toLowerCase();
        var body = document.querySelector('[data-logbody="' + inp.getAttribute('data-filter') + '"]');
        if (!body) { return; }
        Array.prototype.forEach.call(body.querySelectorAll('.ln'), function (ln) {
          ln.classList.toggle('off', q !== '' && ln.textContent.toLowerCase().indexOf(q) < 0);
        });
      });
    });
    var fs = $('widget-fs');
    var a = S.answers[ex.id];
    if (ex.type === 'single' || ex.type === 'multi') {
      Array.prototype.forEach.call(fs.querySelectorAll('.opt'), function (btn) {
        btn.addEventListener('click', function () {
          if (S.results[ex.id]) { return; }
          var oid = btn.getAttribute('data-oid');
          if (ex.type === 'single') {
            a.sel = oid;
            Array.prototype.forEach.call(fs.querySelectorAll('.opt'), function (b2) {
              b2.setAttribute('aria-checked', String(b2 === btn));
              b2.querySelector('.opt-mark').textContent = b2 === btn ? '● Selected' : '';
            });
          } else {
            var sel = a.sel || (a.sel = []);
            var i = sel.indexOf(oid);
            if (i >= 0) { sel.splice(i, 1); } else { sel.push(oid); }
            btn.setAttribute('aria-pressed', String(i < 0));
            btn.querySelector('.opt-mark').textContent = i < 0 ? '● Selected' : '';
          }
        });
      });
    } else if (ex.type === 'match') {
      Array.prototype.forEach.call(fs.querySelectorAll('.match-sel'), function (selEl) {
        selEl.addEventListener('change', function () {
          if (S.results[ex.id]) { return; }
          a.match = a.match || {};
          a.match[selEl.getAttribute('data-left')] = selEl.value;
        });
      });
    } else if (ex.type === 'order' || ex.type === 'prioritize') {
      Array.prototype.forEach.call(fs.querySelectorAll('[data-move]'), function (btn) {
        btn.addEventListener('click', function () {
          if (S.results[ex.id]) { return; }
          var pos = parseInt(btn.getAttribute('data-pos'), 10);
          var dir = btn.getAttribute('data-move') === 'up' ? -1 : 1;
          var j = pos + dir;
          if (j < 0 || j >= a.arr.length) { return; }
          var tmp = a.arr[pos]; a.arr[pos] = a.arr[j]; a.arr[j] = tmp;
          refreshWidget(ex);
        });
      });
    } else if (ex.type === 'blank') {
      Array.prototype.forEach.call(fs.querySelectorAll('.blank-in'), function (inp) {
        inp.addEventListener('input', function () {
          a.blanks = a.blanks || {};
          a.blanks[inp.getAttribute('data-b')] = inp.value;
        });
      });
      Array.prototype.forEach.call(fs.querySelectorAll('.blank-sel'), function (selEl) {
        selEl.addEventListener('change', function () {
          a.blanks = a.blanks || {};
          a.blanks[selEl.getAttribute('data-b')] = selEl.value;
        });
      });
    } else if (ex.type === 'drag') {
      var selectedId = null;
      function paintSelection() {
        Array.prototype.forEach.call(fs.querySelectorAll('.bankitem'), function (b) {
          b.classList.toggle('sel', b.getAttribute('data-iid') === selectedId);
        });
      }
      Array.prototype.forEach.call(fs.querySelectorAll('.bankitem'), function (b) {
        b.addEventListener('click', function () {
          if (S.results[ex.id]) { return; }
          var iid = b.getAttribute('data-iid');
          if (b.getAttribute('data-inzone')) {
            /* If an item is currently selected, this click bubbles to the zone and places
               the selected item. Only return the placed item to the bank when nothing is selected. */
            if (!selectedId) {
              delete a.placed[iid];
              selectedId = null;
              refreshWidget(ex);
            }
            return;
          }
          selectedId = (selectedId === iid) ? null : iid;
          paintSelection();
        });
        b.addEventListener('dragstart', function (ev) {
          ev.dataTransfer.setData('text/plain', b.getAttribute('data-iid'));
        });
      });
      Array.prototype.forEach.call(fs.querySelectorAll('.zone'), function (z) {
        var zid = z.getAttribute('data-zid');
        z.addEventListener('click', function () {
          if (S.results[ex.id] || !selectedId) { return; }
          a.placed[selectedId] = zid;
          selectedId = null;
          refreshWidget(ex);
        });
        z.addEventListener('keydown', function (ev) {
          if ((ev.key === 'Enter' || ev.key === ' ') && selectedId && !S.results[ex.id]) {
            ev.preventDefault();
            a.placed[selectedId] = zid;
            selectedId = null;
            refreshWidget(ex);
          }
        });
        z.addEventListener('dragover', function (ev) { ev.preventDefault(); z.classList.add('over'); });
        z.addEventListener('dragleave', function () { z.classList.remove('over'); });
        z.addEventListener('drop', function (ev) {
          ev.preventDefault();
          z.classList.remove('over');
          if (S.results[ex.id]) { return; }
          var iid = ev.dataTransfer.getData('text/plain');
          if (iid) { a.placed[iid] = zid; refreshWidget(ex); }
        });
      });
    } else if (ex.type === 'terminal') {
      var input = $('shell-cmd');
      input.addEventListener('keydown', function (ev) {
        if (ev.key !== 'Enter') { return; }
        var cmd = input.value;
        input.value = '';
        if (!cmd.trim()) { return; }
        runShell(ex, a, cmd);
      });
    } else if (ex.type === 'branch') {
      var br = ex.branch;
      var st = a.bstep || 0;
      if (st < br.steps.length) {
        Array.prototype.forEach.call(fs.querySelectorAll('[data-boid]'), function (btn) {
          btn.addEventListener('click', function () {
            if (S.results[ex.id]) { return; }
            a.bsel = btn.getAttribute('data-boid');
            Array.prototype.forEach.call(fs.querySelectorAll('[data-boid]'), function (b2) {
              var on = b2 === btn;
              b2.setAttribute('aria-checked', String(on));
              b2.querySelector('.opt-mark').textContent = on ? '● Selected' : '';
            });
            $('btn-bconfirm').disabled = false;
          });
        });
        $('btn-bconfirm').addEventListener('click', function () {
          if (S.results[ex.id] || !a.bsel) { return; }
          var step = br.steps[a.bstep || 0];
          a.outcomes = a.outcomes || [];
          a.outcomes.push('You chose: “' + optStepText(step, a.bsel) + '”. ' + step.outcome);
          a.bstep = (a.bstep || 0) + 1;
          a.bsel = null;
          refreshWidget(ex);
        });
      } else {
        var f = br.final;
        var multi = f.correct.length > 1;
        Array.prototype.forEach.call(fs.querySelectorAll('[data-foid]'), function (btn) {
          btn.addEventListener('click', function () {
            if (S.results[ex.id]) { return; }
            var oid = btn.getAttribute('data-foid');
            if (multi) {
              a.fsel = a.fsel || [];
              var i = a.fsel.indexOf(oid);
              if (i >= 0) { a.fsel.splice(i, 1); } else { a.fsel.push(oid); }
              btn.setAttribute('aria-pressed', String(i < 0));
              btn.querySelector('.opt-mark').textContent = i < 0 ? '● Selected' : '';
            } else {
              a.fsel = [oid];
              Array.prototype.forEach.call(fs.querySelectorAll('[data-foid]'), function (b2) {
                var on = b2 === btn;
                b2.setAttribute('aria-checked', String(on));
                b2.querySelector('.opt-mark').textContent = on ? '● Selected' : '';
              });
            }
          });
        });
      }
    }
    $('btn-check').addEventListener('click', function () { doCheck(false); });
    var nextBtn = $('btn-next');
    if (nextBtn) { nextBtn.addEventListener('click', onNext); }
    $('btn-hint').addEventListener('click', onHint);
    $('btn-skip').addEventListener('click', onSkip);
    $('btn-pause').addEventListener('click', onPauseToggle);
  }
  function optStepText(step, oid) {
    var o = step.options.find(function (x) { return x.id === oid; });
    return o ? o.text : oid;
  }
  function refreshWidget(ex) {
    var fs = $('widget-fs');
    var tmp = document.createElement('div');
    tmp.innerHTML = widgetHtml(ex);
    fs.innerHTML = tmp.firstElementChild.innerHTML;
    bindExercise(ex);
    updateHeader();
  }

  /* ============================ shell ============================ */
  function runShell(ex, a, cmd) {
    a.scroll.push('$ ' + cmd);
    var norm = cmd.trim().replace(/\s+/g, ' ');
    a.lastCmd = norm;
    a.nearMiss = null;
    var t = ex.terminal;
    var out = $('shell-out');
    function print(line, cls) {
      a.scroll.push(line);
      var d = document.createElement('div');
      if (cls) { d.className = cls; }
      d.textContent = line;
      out.appendChild(d);
      out.scrollTop = out.scrollHeight;
    }
    for (var i = 0; i < (t.nearMiss || []).length; i++) {
      if (new RegExp(t.nearMiss[i].re).test(norm)) {
        a.nearMiss = t.nearMiss[i].msg;
        print('⚠ DANGEROUS — NEAR MISS: ' + t.nearMiss[i].msg, 'shell-warn');
        return;
      }
    }
    for (var j = 0; j < (t.outputs || []).length; j++) {
      if (new RegExp(t.outputs[j].re).test(norm)) {
        (t.outputs[j].lines || []).forEach(function (ln) { print(ln, 'shell-ok'); });
        return;
      }
    }
    var first = norm.split(' ')[0];
    print('command not found: ' + first, 'shell-err');
  }

  /* ============================ grading ============================ */
  function it(state, word, text) { return { state: state, word: word, text: text }; }
  function grade(ex) {
    var a = S.answers[ex.id] || {};
    var res = { credit: 0, H: 0, W: 0, N: 1, items: [], nearMiss: false };
    var t = ex.type, i;
    if (t === 'single') {
      res.N = 1;
      var sel = a.sel || null;
      var ok = sel === ex.correct[0];
      res.H = ok ? 1 : 0;
      res.W = (sel && !ok) ? 1 : 0;
      res.items.push(it(ok ? 'ok' : (sel ? 'bad' : 'miss'), ok ? '✓ Correct' : (sel ? '✗ Wrong' : '○ Missed'), 'Correct answer: ' + optText(ex, ex.correct[0])));
      if (sel && !ok) { res.items.unshift(it('bad', '✗ Wrong', 'Your answer: ' + optText(ex, sel))); }
    } else if (t === 'multi') {
      res.N = ex.correct.length;
      var ms = a.sel || [];
      ex.correct.forEach(function (oid) {
        if (ms.indexOf(oid) >= 0) { res.H += 1; res.items.push(it('ok', '✓ Correct', optText(ex, oid))); }
        else { res.items.push(it('miss', '○ Missed', optText(ex, oid))); }
      });
      ms.forEach(function (oid) {
        if (ex.correct.indexOf(oid) < 0) { res.W += 1; res.items.push(it('bad', '✗ Wrong', optText(ex, oid))); }
      });
    } else if (t === 'match') {
      res.N = ex.pairs.length;
      ex.pairs.forEach(function (p, idx) {
        var v = a.match ? a.match[idx] : '';
        if (!v) { res.items.push(it('miss', '○ Missed', p.left + ' → ' + p.right)); }
        else if (v === p.right) { res.H += 1; res.items.push(it('ok', '✓ Correct', p.left + ' → ' + p.right)); }
        else { res.W += 1; res.items.push(it('bad', '✗ Wrong', p.left + ' — you chose “' + v + '”, expected “' + p.right + '”')); }
      });
    } else if (t === 'order' || t === 'prioritize') {
      res.N = ex.steps.length;
      (a.arr || []).forEach(function (si, pos) {
        if (si === pos) { res.H += 1; res.items.push(it('ok', '✓ Correct', 'Position ' + (pos + 1) + ': ' + ex.steps[pos])); }
        else { res.W += 1; res.items.push(it('bad', '✗ Wrong', 'Position ' + (pos + 1) + ' — you placed “' + ex.steps[si] + '”, expected “' + ex.steps[pos] + '”')); }
      });
    } else if (t === 'blank') {
      res.N = ex.blanks.length;
      ex.blanks.forEach(function (b, idx) {
        var v = (a.blanks && a.blanks[idx] ? a.blanks[idx] : '').trim();
        var okv = v !== '' && b.answer.some(function (acc) { return acc.toLowerCase() === v.toLowerCase(); });
        if (v === '') { res.items.push(it('miss', '○ Missed', 'Blank ' + (idx + 1) + ' — expected: ' + b.answer[0])); }
        else if (okv) { res.H += 1; res.items.push(it('ok', '✓ Correct', 'Blank ' + (idx + 1) + ': ' + v)); }
        else { res.W += 1; res.items.push(it('bad', '✗ Wrong', 'Blank ' + (idx + 1) + ' — you typed “' + v + '”, expected: ' + b.answer.join(' or '))); }
      });
    } else if (t === 'drag') {
      res.N = ex.items.length;
      ex.items.forEach(function (x) {
        var zid = a.placed ? a.placed[x.id] : null;
        if (!zid) {
          res.items.push(it('miss', '○ Missed', 'Not placed: ' + x.text));
          return;
        }
        var z = ex.zones.find(function (zz) { return zz.id === zid; });
        if (z && z.accepts.indexOf(x.id) >= 0) {
          res.H += 1;
          res.items.push(it('ok', '✓ Correct', z.label + ': ' + x.text));
        } else {
          res.W += 1;
          var zok = ex.zones.find(function (zz) { return zz.accepts.indexOf(x.id) >= 0; });
          res.items.push(it('bad', '✗ Wrong', '“' + x.text + '” placed in ' + (z ? z.label : 'unknown zone') + '; belongs in: ' + (zok ? zok.label : '?')));
        }
      });
      ex.zones.forEach(function (z) {
        var anyInside = ex.items.some(function (x) { return a.placed && a.placed[x.id] === z.id; });
        if (!anyInside) { res.items.push(it('miss', '○ Missed', z.label + ' left empty — expected: ' + zoneExpected(ex, z))); }
      });
    } else if (t === 'terminal') {
      var tt = ex.terminal;
      var cmd = a.lastCmd || '';
      if (a.nearMiss) { res.nearMiss = true; }
      res.N = tt.elements.length;
      tt.elements.forEach(function (el) {
        if (!cmd) { res.items.push(it('miss', '○ Missed', el.label)); }
        else if (new RegExp(el.re).test(cmd)) { res.H += 1; res.items.push(it('ok', '✓ Correct', el.label)); }
        else { res.W += 1; res.items.push(it('bad', '✗ Wrong', el.label)); }
      });
      if (res.nearMiss) { res.H = 0; res.W = res.N; }
    } else if (t === 'branch') {
      var f = ex.branch.final;
      var multi = f.correct.length > 1;
      if (multi) {
        res.N = f.correct.length;
        var fs2 = a.fsel || [];
        f.correct.forEach(function (oid) {
          if (fs2.indexOf(oid) >= 0) { res.H += 1; res.items.push(it('ok', '✓ Correct', optFinal(ex, oid))); }
          else { res.items.push(it('miss', '○ Missed', optFinal(ex, oid))); }
        });
        fs2.forEach(function (oid) {
          if (f.correct.indexOf(oid) < 0) { res.W += 1; res.items.push(it('bad', '✗ Wrong', optFinal(ex, oid))); }
        });
      } else {
        res.N = 1;
        var fsel = (a.fsel && a.fsel[0]) || null;
        var fok = fsel === f.correct[0];
        res.H = fok ? 1 : 0;
        res.W = (fsel && !fok) ? 1 : 0;
        res.items.push(it(fok ? 'ok' : (fsel ? 'bad' : 'miss'), fok ? '✓ Correct' : (fsel ? '✗ Wrong' : '○ Missed'), 'Correct final decision: ' + optFinal(ex, f.correct[0])));
        if (fsel && !fok) { res.items.unshift(it('bad', '✗ Wrong', 'Your decision: ' + optFinal(ex, fsel))); }
      }
    }
    res.credit = Math.max(0, (res.H - res.W) / res.N);
    if (res.credit > 0 && S.hintUsed[ex.id]) {
      res.credit = Math.max(0, res.credit - 0.10);
    }
    return res;
  }
  function zoneExpected(ex, z) {
    var names = z.accepts.map(function (iid) {
      var it2 = ex.items.find(function (x) { return x.id === iid; });
      return it2 ? it2.text : iid;
    });
    return names.join(', ');
  }
  function optFinal(ex, oid) {
    var o = ex.branch.final.options.find(function (x) { return x.id === oid; });
    return o ? o.text : oid;
  }

  /* ============================ check / next / skip / hint / pause ============================ */
  function doCheck(auto) {
    if (S.state !== 'RUNNING') { return; }
    var ex = currentEx();
    if (!ex || S.results[ex.id]) { return; }
    setState('PAUSED_AUTO_CHECK');
    var res = grade(ex);
    S.results[ex.id] = res;
    S.creditSum += res.credit;
    S.answeredCount += 1;
    var sk = S.skipped.indexOf(ex.id);
    if (sk >= 0) { S.skipped.splice(sk, 1); }
    renderFeedback(ex, res, auto);
    S.checkedId = ex.id;
    var fs = $('widget-fs');
    if (fs) { fs.disabled = true; }
    var check = $('btn-check');
    if (check) { check.style.display = 'none'; }
    var next = $('btn-next');
    if (next) {
      var isLastMain = S.mode === 'main' && !nextMainIndex();
      next.style.display = '';
      next.textContent = S.mode === 'review' ? 'Back to review' : (isLastMain ? 'Final Submit' : 'Next exercise');
    }
    updateHeader();
    var fb = document.querySelector('.fb');
    if (fb) { fb.setAttribute('tabindex', '-1'); fb.focus({ preventScroll: true }); }
  }
  function nextMainIndex() {
    for (var i = S.pos + 1; i < S.order.length; i++) {
      var ex2 = EXS[S.order[i]];
      if (!S.results[ex2.id] && S.skipped.indexOf(ex2.id) < 0) { return i; }
    }
    return null;
  }
  function renderFeedback(ex, res, auto) {
    var slot = $('fb-slot');
    var cls = res.credit >= 1 ? 'fb-ok' : (res.credit > 0 ? 'fb-part' : 'fb-bad');
    var icon = res.credit >= 1 ? '✓' : (res.credit > 0 ? '✓' : '✗');
    var label;
    if (res.nearMiss) {
      cls = 'fb-bad'; icon = '✗';
      label = 'DANGEROUS — NEAR MISS';
    } else if (res.credit >= 1) { label = 'CORRECT'; }
    else if (res.credit > 0) { label = 'PARTIALLY CORRECT'; }
    else { label = 'INCORRECT'; }
    var creditLine = 'credit ' + fmt2(res.credit);
    if (res.N > 1) {
      creditLine += ' — ' + res.H + '/' + res.N + ' items · formula (H − W) / N = (' + res.H + ' − ' + res.W + ') / ' + res.N;
    }
    if (S.hintUsed[ex.id]) {
      creditLine += ' · includes −0.10 hint penalty';
    }
    var rows = res.items.map(function (x) {
      return '<li><span class="st st-' + x.state + '">' + x.word + '</span><span>' + esc(x.text) + '</span></li>';
    }).join('');
    var missedNames = res.items.filter(function (x) { return x.state === 'miss'; }).map(function (x) { return x.text; });
    var wrongNames = res.items.filter(function (x) { return x.state === 'bad'; }).map(function (x) { return x.text; });
    var extra = '';
    if (missedNames.length) {
      extra += '<p><strong style="color:var(--state-partial)">○ Missed items:</strong> ' + esc(missedNames.join(' · ')) + '</p>';
    }
    if (wrongNames.length) {
      extra += '<p><strong style="color:var(--state-incorrect)">✗ Wrong items:</strong> ' + esc(wrongNames.join(' · ')) + '</p>';
    }
    var explainHtml = (ex.explain || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
    var canon = '';
    if (ex.type === 'terminal') {
      var lastCmd = (S.answers[ex.id] && S.answers[ex.id].lastCmd) || '';
      canon = '<div class="codeblock"><div class="cb-label"><span>Canonical command</span>' +
        '<button type="button" class="cb-copy" id="btn-copy">Copy</button></div>' +
        '<pre class="mono">' + esc(ex.terminal.solution) + '</pre></div>' +
        '<div class="cb-legend">' + ex.terminal.elements.map(function (el) {
          var got = lastCmd !== '' && new RegExp(el.re).test(lastCmd);
          return '<span>' + (got ? '<span class="st-ok">✓</span>' : '<span class="st-bad">✗</span>') + ' ' + esc(el.label) + '</span>';
        }).join('') + '</div>';
    }
    slot.innerHTML = '<section class="fb ' + cls + '" role="status" aria-live="polite">' +
      '<div class="fb-h"><span aria-hidden="true">' + icon + '</span> ' + label +
      '<span class="fb-credit">' + esc(creditLine) + (auto ? ' · auto-submitted (exercise timer expired)' : '') + '</span></div>' +
      '<ul class="fb-items">' + rows + '</ul>' +
      '<div class="fb-explain">' + extra + canon + explainHtml + '</div>' +
      '</section>';
    var copyBtn = $('btn-copy');
    if (copyBtn) {
      copyBtn.addEventListener('click', function () {
        var text = ex.terminal.solution;
        var done = function () { copyBtn.textContent = 'Copied'; };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, function () { copyBtn.textContent = 'Select and copy'; });
          } else { copyBtn.textContent = 'Select and copy'; }
        } catch (e) { copyBtn.textContent = 'Select and copy'; }
      });
    }
  }
  function onNext() {
    if (S.state === 'ENDED') { return; }
    if (S.mode === 'review') {
      setState('RUNNING');
      showReview();
      return;
    }
    var nxt = nextMainIndex();
    if (nxt !== null) {
      S.pos = nxt;
      setState('RUNNING');
      renderExam();
    } else if (S.skipped.length > 0 && S.remaining > 0) {
      setState('RUNNING');
      showReview();
    } else {
      showResults();
    }
  }
  function onSkip() {
    if (S.state !== 'RUNNING') { return; }
    var ex = currentEx();
    if (!ex || S.results[ex.id]) { return; }
    if (S.skipped.indexOf(ex.id) < 0) { S.skipped.push(ex.id); }
    if (S.mode === 'review') {
      setState('RUNNING');
      showReview();
      return;
    }
    var nxt = nextMainIndex();
    if (nxt !== null) {
      S.pos = nxt;
      renderExam();
    } else if (S.skipped.length > 0 && S.remaining > 0) {
      showReview();
    } else {
      showResults();
    }
  }
  function onHint() {
    if (S.state !== 'RUNNING') { return; }
    var ex = currentEx();
    if (!ex || S.results[ex.id] || S.hintUsed[ex.id]) { return; }
    S.hintUsed[ex.id] = true;
    var fs = $('widget-fs');
    var panel = document.createElement('div');
    panel.className = 'hint-panel';
    panel.setAttribute('role', 'note');
    panel.innerHTML = '<div class="hp-h">? Hint — 10% of this exercise credit will be deducted</div>' + esc(ex.hint);
    fs.appendChild(panel);
    var hb = $('btn-hint');
    if (hb) { hb.disabled = true; }
  }
  function onPauseToggle() {
    if (S.state === 'RUNNING') {
      S.resumeState = 'RUNNING';
      setState('PAUSED_MANUAL');
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      S.resumeState = 'PAUSED_AUTO_CHECK';
      setState('PAUSED_MANUAL');
    } else if (S.state === 'PAUSED_MANUAL') {
      setState(S.resumeState || 'RUNNING');
    }
  }
  function renderPauseOverlay() {
    var old = $('paused-ovl');
    if (old) { old.remove(); }
    if (S.state !== 'PAUSED_MANUAL') { return; }
    var ovl = document.createElement('div');
    ovl.className = 'paused-overlay';
    ovl.id = 'paused-ovl';
    ovl.innerHTML = '<div class="paused-card" role="alertdialog" aria-label="Exam manually paused">' +
      '<div class="pico" aria-hidden="true">⏸</div>' +
      '<h2>⏸ PAUSED — manual</h2>' +
      '<p>The exercise is hidden and the timer is stopped. Press Resume when you are ready to continue.</p>' +
      '<button type="button" class="btn btn-primary" id="btn-resume2">▶ Resume</button></div>';
    document.body.appendChild(ovl);
    $('btn-resume2').addEventListener('click', onPauseToggle);
  }

  /* ============================ review screen ============================ */
  function showReview() {
    S.screen = 'review';
    S.mode = 'review';
    S.reviewList = S.skipped.slice();
    var app = $('app');
    var rows = S.reviewList.map(function (exId) {

      '<div class="block-b">' +
      '<p>You skipped ' + S.reviewList.length + ' exercise' + (S.reviewList.length === 1 ? '' : 's') + '. You can answer them now, as many times as you need, until the timer ends. Skipped exercises you never answer are excluded from the score.</p>' +
      '<ul class="review-list">' + rows + '</ul>' +
      '<div class="actionbar"><button type="button" class="btn btn-primary" id="btn-finish">Submit exam</button>' +
      '<span class="note">Submitting now leaves the remaining skipped exercises out of the score.</span></div>' +

    Array.prototype.forEach.call(document.querySelectorAll('[data-answer]'), function (btn) {
      btn.addEventListener('click', function () {

    $('btn-finish').addEventListener('click', function () { showResults(); });

    renderTimerPill();
  }

  /* ============================ results ============================ */
  function endByTimeout() {
    setState('ENDED');
    showResults();
  }
  function showResults() {
    S.screen = 'results';
    S.mode = 'main';
    var fully = 0, partial = 0, wrong = 0;
    var partialSum = 0;
    Object.keys(S.results).forEach(function (k) {
      var c = S.results[k].credit;
      if (c >= 1) { fully += 1; }
      else if (c > 0) { partial += 1; partialSum += c; }
      else { wrong += 1; }
    });
    var skippedLeft = S.skipped.length;
    var pct = fmtPct(S.creditSum, S.answeredCount);
    var passed = pct >= PASSMARK;
    setState('ENDED');
    var app = $('app');
    var cls = SEVCLS[DATA.severity] || 'sev-easy';
    var candidate = S.handshake && S.handshake.username ? '<div class="res-sub">Candidate: ' + esc(S.handshake.username) + '</div>' : '';
    app.innerHTML = headerHtml() +
      '<main class="stage" id="stage"><section class="block res-panel">' +
      '<div class="block-h h-answer"><span class="bico" aria-hidden="true">■</span> RESULTS</div>' +
      '<div class="block-b">' +
      '<div class="res-head ' + (passed ? 'pass' : 'fail') + '"><span aria-hidden="true">' + (passed ? '✓' : '✗') + '</span> ' + (passed ? 'PASS' : 'FAIL') + ' — ' + pct + '% (pass mark ' + PASSMARK + '%)</div>' +
      '<div class="res-big">' + pct + '%</div>' +
      '<div class="res-sub">Final score: <b>' + fmt1(S.creditSum) + '</b> over ' + S.answeredCount + ' answered exercise' + (S.answeredCount === 1 ? '' : 's') + ' of ' + TOTAL + '.' + (skippedLeft ? ' ' + skippedLeft + ' skipped exercise' + (skippedLeft === 1 ? '' : 's') + ' excluded from the score.' : '') + '</div>' +
      candidate +
      '<ul class="res-rows">' +
        '<li><span class="st st-ok">✓ Fully correct</span><span class="rval">' + fully + '</span></li>' +
        '<li><span class="st st-warn">✓ Partially correct</span><span>avg credit ' + (partial ? fmt2(partialSum / partial) : '—') + '</span><span class="rval">' + partial + '</span></li>' +
        '<li><span class="st st-bad">✗ Fully incorrect</span><span class="rval">' + wrong + '</span></li>' +
        '<li><span class="st st-miss">⚠ Skipped — excluded</span><span class="rval">' + skippedLeft + '</span></li>' +
      '</ul>' +
      '<div class="res-times">' +
        '<div>⏱ Active time: <b class="mono">' + fmtClock(BUDGET - S.remaining) + '</b> of a ' + fmtClock(BUDGET) + ' budget</div>' +
        '<div>⏸ Time paused while reviewing feedback: <b class="mono">' + fmtClock(S.pauseAccum.autoCheck) + '</b></div>' +
        '<div>⏸ Time paused manually: <b class="mono">' + fmtClock(S.pauseAccum.manual) + '</b></div>' +
      '</div>' +
      '<div class="actionbar"><button type="button" class="btn btn-primary btn-big" id="btn-retake">↻ Retake Exam</button>' +
      '<span class="note">A retake shuffles the exercises and answers and resets the timer.</span></div>' +
      '</div></section></main>';
    $('btn-retake').addEventListener('click', function () {
      renderIntro();
    });
    updateHeader();
    renderTimerPill();
    setTimeout(function () {
      if (S.posted) { return; }
      S.posted = true;
      reportScore(S.creditSum, S.answeredCount);
    }, 350);
  }
  function reportScore(creditSum, answeredCount) {
    var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
    try {
      /* Opened directly (parent === window): there is nothing to report to, per the site contract. */
      if (parent && parent !== window) {
        parent.postMessage({
          type: 'CYBERPULSE_SCORE',
          topicId: DATA.topicId,
          batch: DATA.batch,
          score: Math.round(creditSum),
          total: answeredCount,
          percent: percent,
          passed: percent >= PASSMARK
        }, location.origin);
      }
    } catch (e) {
      /* Opened directly rather than inside the site. Nothing to report to. */
    }
  }
  window.addEventListener('message', function (event) {
    if (!event.data || typeof event.data !== 'object') { return; }
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
    S.handshake = {
      username: event.data.username || '',
      country: event.data.country || '',
      locale: event.data.locale || '',
      topicId: event.data.topicId || '',
      batch: event.data.batch,
      theme: event.data.theme || 'dark'
    };
    /* The file is dark-only by contract: the handshake theme field never changes the appearance. */
  });

  /* ============================ debug hook (read-only) ============================ */
  Object.defineProperty(window, '__CM', {
    value: {
      get state() { return S.state; },
      get screen() { return S.screen; },
      get remaining() { return S.remaining; },
      get creditSum() { return S.creditSum; },
      get answeredCount() { return S.answeredCount; },
      get skipped() { return S.skipped.slice(); },
      get results() { return Object.keys(S.results).slice(); },
      get pauseAccum() { return { manual: S.pauseAccum.manual, autoCheck: S.pauseAccum.autoCheck }; },
      get order() { return S.order.slice(); },
      get pos() { return S.pos; },
      data: DATA
    },
    configurable: false, writable: false
  });

  /* ============================ boot ============================ */
  renderIntro();
})();
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
