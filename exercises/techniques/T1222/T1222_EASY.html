var INTRO = {"learn": "<p><b>Imagine you are a junior SOC analyst.</b> An alert shows the command <span class='mono'>attrib +h report.exe</span> on a user laptop. What was the attacker trying to do? In this exam you will learn exactly that.</p><p><b>You will learn what T1222 is.</b> T1222 is a <b>Technique</b> in the MITRE ATT&amp;CK framework. A technique is a &ldquo;how&rdquo;: it describes one way attackers do something. T1222 describes how attackers <b>change the permissions of files and folders</b> so they can hide, lock people out, or open doors for later steps. It lives in the <b>Defense Evasion</b> tactic — the part of an attack where the attacker tries to stay unseen and unblocked.</p><p><b>You will learn the attacker's tools.</b> On Windows: <span class='mono'>attrib</span> (set a hidden flag), <span class='mono'>icacls</span> (edit folder permissions, called ACLs), <span class='mono'>takeown</span> (become the owner of a file), and the older <span class='mono'>cacls</span>. On Linux and macOS: <span class='mono'>chmod</span> (change read/write/execute rights), <span class='mono'>chown</span> (change the owner), <span class='mono'>chattr</span> (set flags like &ldquo;immutable&rdquo;, which means nobody can change the file), and <span class='mono'>chflags</span> (the macOS version of those flags).</p><p><b>You will learn how defenders see it.</b> Every time one of these tools runs, it leaves traces: a process log with the command line, and a change to the file's metadata. You will learn which data sources show those traces, and why controls like <b>M1022 — Restrict File and Directory Permissions</b> and <b>M1026 — Privileged Account Management</b> make this technique harder.</p><p><b>Where you will use this at work:</b> SOC analysts triage these alerts every day; threat hunters search for wide-scope permission changes; incident responders check for locked or hidden files on every case; CTI analysts map intrusions to this technique; red teamers use the same commands in authorised tests; detection engineers build rules on the command lines; GRC analysts audit who is allowed to change permissions. The risk it addresses is simple: an attacker who can change permissions can hide from you and lock you out of your own systems.</p>", "keywords": [{"theme": "The technique and its place in ATT&CK", "items": ["T1222 — File and Directory Permissions Modification (a Technique)", "Defense Evasion tactic (TA0005)", "T1222.001 — the Windows version of the technique", "T1222.002 — the Linux and Mac version of the technique"]}, {"theme": "The attacker's tools (Windows)", "items": ["attrib — set the hidden flag on a file", "icacls — view and edit Windows ACLs (permissions lists)", "takeown — take ownership of a file", "cacls — the older permission tool"]}, {"theme": "The attacker's tools (Linux and macOS)", "items": ["chmod — change read/write/execute rights (modes)", "chown — change the owner of a file", "chattr — set flags, for example the immutable flag (+i)", "chflags — the macOS flag tool (for example: hidden)"]}, {"theme": "How defenders see it", "items": ["Data sources: Command Execution, File Metadata, Process Creation", "M1022 — Restrict File and Directory Permissions", "M1026 — Privileged Account Management", "Why hidden and immutable flags matter in an incident"]}], "how": "<ul class='howlist'><li><b>Goal:</b> score at least <b>70%</b> to pass. This is a practice certification exam with 16 exercises.</li><li><b>Exercise types in this file:</b> single-choice questions, multi-select (partial credit), matching, drag &amp; drop, fill-in-the-blank, an ordering task, and one guided fake terminal.</li><li><b>Timer:</b> a 35:00 countdown runs in the header. You can press <b class='pz'>&#9208; Pause</b> for a real break — the exercise is hidden while paused. When you press <b>Check</b>, the clock stops by itself (you will see <b class='pz'>&#9208; PAUSED — reviewing feedback</b>) so you can read the explanation without pressure; it starts again only when you press <b>Next</b>.</li><li><b>Partial credit:</b> exercises with several correct items give <span class='ok'>partial credit</span> — each correct item counts, each wrong pick subtracts. Formula: (H &minus; W) &divide; N. Selecting everything &ldquo;to be safe&rdquo; gives you 0.</li><li><b>Hints:</b> one hint per exercise, shown next to the question. A hint costs 10% of that exercise's credit.</li><li><b>Skipping:</b> every exercise has a <b class='sk'>&#9888; Skip</b> button. Skipped exercises come back at the end on a review screen, as long as the clock allows. If you never answer them, they are excluded from the score — they neither help nor hurt.</li><li><b>Feedback:</b> after every Check you get a clear explanation at the bottom — why the answer is right, and what to study if you missed it.</li></ul>"};
var EXERCISES = [{"id": "e01", "type": "multi", "reviewLabel": "Which commands belong to the Linux and Mac sub-technique?", "scenario": "<p>You are reading the MITRE ATT&amp;CK page for <b>T1222.002 — Linux and Mac File and Directory Permissions Modification</b> during your first week in the SOC. Your team lead asks you to memorise which command-line tools belong to this sub-technique before you take alert triage.</p>", "scenarioShort": "Which commands belong to T1222.002?", "question": "Select <b>all</b> commands that belong to T1222.002 (Linux and Mac).", "hint": "Two of these tools only exist on Windows. Think about which ones a Linux admin would type.", "explain": "<p>T1222.002 covers permission tools on Linux and macOS. <span class='mono'>chmod</span> changes read/write/execute rights, <span class='mono'>chattr</span> sets special flags on Linux (like the immutable flag), and <span class='mono'>chflags</span> does the same job on macOS. <span class='mono'>icacls</span> and <span class='mono'>takeown</span> are Windows tools — they belong to T1222.001, the Windows sub-technique.</p><div class='dualview'><span class='rv'>Red view:</span> an attacker on a Linux box reaches for chmod/chattr first. <span class='bv'>Blue view:</span> watch command lines for exactly these tool names on your Linux and macOS hosts.</div>", "study": "the ATT&amp;CK sub-technique pages T1222.001 (Windows) and T1222.002 (Linux and Mac), and the tool list on each.", "data": {"options": [{"t": "chmod", "correct": true, "why": "chmod sets read/write/execute rights — the core Linux and Mac permission tool."}, {"t": "icacls", "why": "icacls edits Windows ACLs, so it belongs to T1222.001, not to the Linux and Mac sub-technique."}, {"t": "chattr", "correct": true, "why": "chattr sets Linux file flags like immutable (+i)."}, {"t": "takeown", "why": "takeown makes you the owner of a file on Windows — T1222.001 again."}, {"t": "chflags", "correct": true, "why": "chflags is the macOS flag tool (for example: chflags hidden)."}]}}, {"id": "e02", "type": "drag", "reviewLabel": "Sort six commands into the two T1222 sub-techniques", "scenario": "<p>A CTI analyst sends you a short list of commands seen in two different incidents — one on a Windows file server, one on a Linux web host. Before the incident call, you want the list sorted by ATT&amp;CK sub-technique so the notes are clean.</p>", "scenarioShort": "Sort commands by T1222.001 vs T1222.002", "question": "Drag each command onto the sub-technique where it belongs.", "hint": "Windows tools: attrib, icacls, takeown. Linux/macOS tools: chmod, chattr, chflags.", "explain": "<p>The Windows sub-technique <b>T1222.001</b> covers <span class='mono'>attrib</span>, <span class='mono'>icacls</span> and <span class='mono'>takeown</span> (plus the older <span class='mono'>cacls</span>). The Linux and Mac sub-technique <b>T1222.002</b> covers <span class='mono'>chmod</span>, <span class='mono'>chattr</span> and <span class='mono'>chflags</span> (plus <span class='mono'>chown</span>). Knowing the split by heart makes alert triage much faster.</p>", "study": "the two sub-technique pages and their tool lists.", "data": {"slots": [{"id": "w", "label": "T1222.001 — Windows"}, {"id": "l", "label": "T1222.002 — Linux and Mac"}], "items": [{"id": "i1", "t": "attrib +h"}, {"id": "i2", "t": "chmod 777"}, {"id": "i3", "t": "icacls /grant"}, {"id": "i4", "t": "chattr +i"}, {"id": "i5", "t": "takeown /f"}, {"id": "i6", "t": "chflags hidden"}], "correct": {"i1": "w", "i2": "l", "i3": "w", "i4": "l", "i5": "w", "i6": "l"}, "why": {"i1": "attrib sets the hidden attribute — Windows only.", "i2": "chmod changes POSIX modes — Linux and Mac.", "i3": "icacls edits Windows ACLs.", "i4": "chattr sets Linux flags like immutable.", "i5": "takeown changes ownership on Windows.", "i6": "chflags sets macOS flags like hidden."}}}, {"id": "e03", "type": "qcm", "reviewLabel": "Which tactic does T1222 belong to?", "scenario": "<p>Your mentor shows you the ATT&amp;CK matrix. Techniques are grouped in columns called <b>tactics</b> — the attacker's goal at that moment. She points at T1222 and asks you a simple question to check your basics.</p>", "scenarioShort": "Which tactic column holds T1222?", "question": "Which tactic does <b>T1222</b> belong to?", "hint": "T1222 is about changing permissions to hide and to keep defenders out. Which goal is that?", "explain": "<p>T1222 sits in the <b>Defense Evasion</b> tactic (TA0005). The goal there is to avoid being seen or blocked. Changing permissions does exactly that: a hidden file does not show up in normal views, and a locked file can resist cleanup or antivirus. It can also help Persistence steps, but its ATT&amp;CK home is Defense Evasion.</p>", "study": "the ATT&amp;CK matrix layout: tactics are columns, techniques are the cells inside them.", "data": {"options": [{"t": "Defense Evasion", "correct": true, "why": "Hiding and locking files is a way to avoid defences — that is the Defense Evasion goal."}, {"t": "Discovery", "why": "Discovery is about learning the environment (users, shares, networks) — not changing permissions."}, {"t": "Collection", "why": "Collection is gathering data like files or screen input — not this."}, {"t": "Credential Access", "why": "That tactic steals passwords and keys — changing file flags is not that."}]}}, {"id": "e04", "type": "qcm", "reviewLabel": "What does attrib +h do?", "scenario": "<p>EDR shows this command on a workstation: <span class='mono'>attrib +h C:\\Users\\Public\\report.exe</span>. The ticket asks: &ldquo;what did this actually change?&rdquo; WannaCry used this exact trick to hide some of its files.</p>", "scenarioShort": "What did attrib +h change?", "question": "What does <b>attrib +h</b> do to the file?", "hint": "attrib does not encrypt or delete. It flips a flag. Which one?", "explain": "<p><span class='mono'>attrib +h</span> sets the <b>hidden</b> attribute. The file stays on disk and still works — but it disappears from normal folder views and from a plain <span class='mono'>dir</span> listing. Attackers like WannaCry use it so users and quick checks do not spot their files. A defender sees the change if they collect file metadata or run <span class='mono'>attrib.exe</span> itself with no flag.</p>", "study": "Windows file attributes (hidden, system, read-only) and how EDR reports attribute changes.", "data": {"options": [{"t": "It hides the file from normal folder views", "correct": true, "why": "The +h flag marks the file hidden; Explorer and plain dir stop showing it."}, {"t": "It encrypts the file content", "why": "attrib never encrypts anything — it only flips attributes."}, {"t": "It deletes the file after reboot", "why": "Nothing is deleted; the file stays on disk."}, {"t": "It makes the file read-only for everyone", "why": "Read-only is the +r flag, not +h."}]}}, {"id": "e05", "type": "match", "reviewLabel": "Match each tool to its operating system", "scenario": "<p>You are preparing flash cards for your SOC onboarding test. One card set is &ldquo;tool &rarr; operating system&rdquo; for the T1222 family, because knowing the platform tells you which sub-technique an alert maps to.</p>", "scenarioShort": "Match tools to operating systems", "question": "For each tool, choose the operating system where it is used.", "hint": "chflags is the odd one out — it is the macOS version of chattr.", "explain": "<p><span class='mono'>attrib</span> and <span class='mono'>takeown</span> are Windows commands. <span class='mono'>chmod</span> exists on Linux and macOS. <span class='mono'>chflags</span> is macOS-specific — Linux uses <span class='mono'>chattr</span> for the same job. Matching the tool to the platform is the first step of mapping an alert to T1222.001 or T1222.002.</p>", "study": "T1222.001 and T1222.002 platform rows on the ATT&amp;CK pages.", "data": {"left": [{"t": "attrib", "r": 0, "why": "attrib is a Windows command."}, {"t": "chmod", "r": 1, "why": "chmod is the classic Unix permission tool, present on Linux and macOS."}, {"t": "chflags", "r": 2, "why": "chflags is macOS-only — Linux uses chattr instead."}, {"t": "takeown", "r": 0, "why": "takeown is a Windows admin tool."}], "right": ["Windows", "Linux and macOS", "macOS only"]}}, {"id": "e06", "type": "fill", "reviewLabel": "Complete the SOC note about locking a file", "scenario": "<p>Copy this SOC note into your training log. A Linux host was hit: the attacker first removed all access to a password database, then made sure nobody could unlock it. Your note must use the right values.</p>", "scenarioShort": "Complete the note: chmod ___ then ___", "question": "Pick the correct words for both blanks.", "hint": "000 removes every right. The flag that makes a file unchangeable is the immutable flag.", "explain": "<p><span class='mono'>chmod 000</span> removes read, write and execute for owner, group and others — normal users cannot open the file at all. <span class='mono'>chattr +i</span> sets the <b>immutable</b> flag: even root cannot modify or delete the file until the flag is removed with <span class='mono'>chattr -i</span>. Attackers use this pair to lock defenders out. Rocke used a similar trick — changing permissions so files could not be modified.</p>", "study": "POSIX mode numbers (000, 600, 755, 777) and the chattr immutable flag.", "data": {"template": "The malware ran 'chmod {{0}} secret.kdbx' so nobody could open it, then used '{{1}}' to make the file unchangeable.", "blanks": [{"correct": "000", "why": "Mode 000 = no rights for anyone (owner, group, others)."}, {"correct": "chattr +i", "why": "chattr +i sets the immutable flag — the file can no longer be changed or deleted."}], "bank": ["000", "777", "600", "chattr +i", "icacls", "ls -la"]}}, {"id": "e07", "type": "qcm", "reviewLabel": "What does takeown do?", "scenario": "<p>In an incident you see <span class='mono'>takeown /f C:\\Windows\\Temp\\svc.exe</span>. WastedLocker and BitPaymer both used takeown on their way to locking down or resetting files. The trainee next to you asks what it does.</p>", "scenarioShort": "What does takeown do?", "question": "What does <b>takeown</b> do?", "hint": "Ownership is the top level of power over a file's permissions.", "explain": "<p><span class='mono'>takeown</span> makes the current user the <b>owner</b> of the file. The owner can always change the file's permissions afterwards (with icacls). That is why ransomware families like WastedLocker and BitPaymer run takeown first — ownership unlocks full control, then icacls resets or grants rights. Defenders should alert on takeown against system files.</p>", "study": "Windows file ownership and how takeown + icacls are chained by ransomware (BitPaymer, WastedLocker).", "data": {"options": [{"t": "It makes you the owner of the file", "correct": true, "why": "Ownership gives the power to change its permissions next."}, {"t": "It copies the file to your profile", "why": "takeown does not copy anything."}, {"t": "It locks the file so nobody can read it", "why": "Locking is done by icacls /deny or chmod — takeown only changes the owner."}, {"t": "It shows who owns the file", "why": "That is a read action — takeown changes the owner."}]}}, {"id": "e08", "type": "order", "reviewLabel": "Order the attacker's hiding steps", "scenario": "<p>A simple attacker script on a Windows host does three things to hide a new tool. Put the steps in the order they happened, based on how such scripts always work: place first, then hide, then lock.</p>", "scenarioShort": "Order: copy, hide, lock", "question": "Click the three steps in the correct order (first click = step 1).", "hint": "You cannot hide or lock a file that is not on the disk yet.", "explain": "<p>First the file must exist: the payload is copied to a public folder. Then <span class='mono'>attrib +h</span> hides it from normal views (Defense Evasion — this is T1222). Finally <span class='mono'>icacls /deny</span> makes it hard for defenders to touch or remove. This place &rarr; hide &rarr; lock pattern is the simplest version of what ransomware does at scale.</p>", "study": "how T1222 supports the Defense Evasion goal right after a payload lands.", "data": {"items": [{"t": "Copy the payload to C:\\Users\\Public", "why": "The file must be on disk before anything can be done to it."}, {"t": "Run attrib +h on the payload", "why": "Hide it from normal views — the T1222 defence evasion step."}, {"t": "Run icacls /deny Everyone on its folder", "why": "Lock defenders out so cleanup tools cannot touch it."}]}}, {"id": "e09", "type": "drag", "reviewLabel": "Match ATT&CK IDs to their names", "scenario": "<p>Your ticket notes are full of IDs. To write a clean incident summary you must place each ID on the right label — the parent technique, its two sub-techniques, and the tactic they live in.</p>", "scenarioShort": "Place T1222 / T1222.001 / T1222.002 / TA0005", "question": "Drag each ATT&amp;CK ID onto its correct label.", "hint": "Sub-techniques keep the parent ID plus a dot and three digits: T1222.001 and T1222.002.", "explain": "<p><b>T1222</b> is the parent technique (File and Directory Permissions Modification). Its two sub-techniques split it by platform: <b>T1222.001</b> for Windows and <b>T1222.002</b> for Linux and Mac. <b>TA0005</b> is the ID of the Defense Evasion tactic — the column where all of them sit. Using exact IDs in tickets and reports lets tools and teammates link to the right page.</p>", "study": "ATT&amp;CK ID grammar: TAxxxx = tactic, Txxxx = technique, Txxxx.xxx = sub-technique.", "data": {"slots": [{"id": "p", "label": "Parent technique"}, {"id": "w", "label": "Windows sub-technique"}, {"id": "l", "label": "Linux and Mac sub-technique"}, {"id": "t", "label": "The tactic they live in"}], "items": [{"id": "i1", "t": "T1222"}, {"id": "i2", "t": "T1222.001"}, {"id": "i3", "t": "T1222.002"}, {"id": "i4", "t": "TA0005"}], "correct": {"i1": "p", "i2": "w", "i3": "l", "i4": "t"}, "why": {"i1": "T1222 is the parent technique.", "i2": "T1222.001 is the Windows version.", "i3": "T1222.002 is the Linux and Mac version.", "i4": "TA0005 is Defense Evasion."}}}, {"id": "e10", "type": "multi", "reviewLabel": "What traces does an icacls run leave?", "scenario": "<p>An analyst ran <span class='mono'>icacls D:\\Reports /grant Everyone:F</span> on a server (for this exercise, assume it was the attacker). Your team wants to know what evidence this single command leaves behind.</p>", "scenarioShort": "What evidence does icacls leave?", "question": "Select <b>all</b> traces this command leaves on the system.", "hint": "Two things always happen: a process ran with a command line, and a file's permission data changed.", "explain": "<p>Two traces are certain. First, <b>process creation</b>: Windows logs a process start for icacls.exe including the full command line (Sysmon Event ID 1, or your EDR's process log) — that is the Command Execution data source. Second, the file's <b>metadata</b> changes: its DACL (the permissions list) now grants Everyone full control — that is the File Metadata data source. No DNS lookup, no encryption, no new account is involved in this command.</p><div class='dualview'><span class='rv'>Red view:</span> icacls is quiet — no file content changes, so antivirus sees nothing. <span class='bv'>Blue view:</span> that is why command-line logging matters: the command itself is the evidence.</div>", "study": "the ATT&amp;CK data sources for T1222: Command Execution, File Metadata, Process Creation.", "data": {"options": [{"t": "A process log entry with the full command line", "correct": true, "why": "Process creation logging records icacls.exe and its arguments — the Command Execution source."}, {"t": "A change to the file's permission metadata (its DACL)", "correct": true, "why": "The permissions list is metadata of the file — it changed."}, {"t": "A DNS lookup to the attacker's server", "why": "This command is purely local — nothing touches the network."}, {"t": "An encrypted copy of the file", "why": "Granting rights never encrypts anything."}, {"t": "A new user account called Everyone", "why": "Everyone is a built-in group, not a new account."}]}}, {"id": "e11", "type": "drag", "reviewLabel": "Sort artefacts into ATT&CK data sources", "scenario": "<p>You collected three artefacts from one host. Sort each one into the ATT&amp;CK <b>data source</b> that would capture it — this is how detection engineers decide what telemetry to collect for T1222.</p>", "scenarioShort": "Artefacts → data sources", "question": "Drag each artefact onto the data source that captures it.", "hint": "A log about a process that started is one source; a note about a file attribute is the other.", "explain": "<p><b>Process Creation</b> captures that a new process started (cmd.exe spawning icacls.exe). <b>Command Execution</b> captures the command line that was run (chmod 000 /tmp/x). <b>File Metadata</b> captures changes to the file itself — like the hidden flag being set. T1222's detection pages build on exactly these three sources, and each one alone can catch part of the behaviour.</p>", "study": "the three data sources listed on T1222 and what each one records.", "data": {"slots": [{"id": "pc", "label": "Process Creation"}, {"id": "ce", "label": "Command Execution"}, {"id": "fm", "label": "File Metadata"}], "items": [{"id": "a1", "t": "Log: cmd.exe started icacls.exe"}, {"id": "a2", "t": "EDR note: hidden flag set on tool.exe"}, {"id": "a3", "t": "Command line recorded: chmod 000 /tmp/x"}], "correct": {"a1": "pc", "a2": "fm", "a3": "ce"}, "why": {"a1": "A process starting is the Process Creation source.", "a2": "An attribute change on the file is File Metadata.", "a3": "The recorded command line is the Command Execution source."}}}, {"id": "e12", "type": "qcm", "reviewLabel": "Which control is M1022?", "scenario": "<p>Your GRC analyst maps controls to ATT&amp;CK mitigations. She asks the room: &ldquo;M1022 — who can name it?&rdquo; It is one of the two mitigations listed on the T1222 page.</p>", "scenarioShort": "Name mitigation M1022", "question": "M1022 is the ATT&amp;CK mitigation called&hellip;", "hint": "It is the mitigation that says: set tight permissions on files and folders.", "explain": "<p><b>M1022 — Restrict File and Directory Permissions</b> means setting tight permissions so attackers cannot change ACLs or reach files they should never touch. The other mitigation on the T1222 page is <b>M1026 — Privileged Account Management</b> — fewer powerful accounts means fewer people (and attackers) who can change permissions at all.</p>", "study": "the Mitigations table on the T1222 page: M1022 and M1026.", "data": {"options": [{"t": "Restrict File and Directory Permissions", "correct": true, "why": "Tight permissions stop attackers from modifying access control lists."}, {"t": "Privileged Account Management", "why": "That is M1026 — the second mitigation on the page, not M1022."}, {"t": "Network Segmentation", "why": "A real mitigation, but about networks — not file permissions."}, {"t": "Disable or Remove Feature or Program", "why": "A real mitigation, but about removing tools — not this."}]}}, {"id": "e13", "type": "fill", "reviewLabel": "Complete the summary card for T1222", "scenario": "<p>Finish your study card so you can recite it in the team stand-up tomorrow. It names the tactic and one sub-technique.</p>", "scenarioShort": "Fill the summary card", "question": "Pick the correct words for both blanks.", "hint": "One blank is a tactic name, the other is an ID that starts with T1222.", "explain": "<p>T1222 sits in the <b>Defense Evasion</b> tactic. Its Windows sub-technique is <b>T1222.001</b>; the Linux and Mac one is <b>T1222.002</b>. TA0005 is the ID <i>of the tactic itself</i>, and T1046 belongs to Network Service Discovery — a completely different area. Getting these IDs right keeps reports consistent across the team.</p>", "study": "the header block of the T1222 ATT&amp;CK page (ID, name, tactic).", "data": {"template": "T1222 sits in the {{0}} tactic of MITRE ATT&CK, and its Windows sub-technique is {{1}}.", "blanks": [{"correct": "Defense Evasion", "why": "Defense Evasion (TA0005) is the tactic column that holds T1222."}, {"correct": "T1222.001", "why": "T1222.001 is the Windows sub-technique."}], "bank": ["Defense Evasion", "T1222.001", "Persistence", "T1046", "Discovery", "TA0005"]}}, {"id": "e14", "type": "terminal", "reviewLabel": "Terminal: hide a file with attrib (guided)", "scenario": "<p>Training lab — a safe copy of an attacker's behaviour. You are on a Windows lab box. The file <b>report.exe</b> is in <b>C:\\temp</b>. Your task: hide it with the <b>attrib</b> command, exactly like WannaCry hides some of its files.</p><div class='artefact'><span class='artlabel'>Syntax reminder (example on a different file)</span><div class='artbody'>attrib +h &lt;path&gt;   — sets the hidden flag\nexample:  attrib +h C:\\temp\\notes.txt\nresult:   the file stops showing in normal folder views</div></div>", "scenarioShort": "Lab: hide report.exe with attrib", "question": "Type the command that hides <b>C:\\temp\\report.exe</b>, then press Run and Check.", "hint": "Start with the tool name, then the +h flag, then the full path.", "explain": "<p><span class='mono'>attrib +h C:\\temp\\report.exe</span> — three parts: the tool (<b>attrib</b>), the flag (<b>+h</b> sets hidden), and the target path. Remove the flag later with <span class='mono'>attrib -h</span>. In the real world a defender would catch this from the command line in the process log, and from the attribute change on the file.</p>", "study": "attrib flags: +h/-h hidden, +s/-s system, +r/-r read-only.", "data": {"title": "simulated Windows shell — lab only, nothing real is touched", "banner": ["Microsoft Windows [Version 10.0.19045]", "(c) Microsoft Corporation. Training lab — simulated.", ""], "prompt": "C:\\temp>", "okRe": "^attrib", "notFound": "'attrib' requires the full command — try: attrib + /* ============ T1222 exam engine — vanilla JS, self-contained ============ */
(function(){
'use strict';
/* ---------- tiny dom helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function pad(n){return (n<10?'0':'')+n;}
function mmss(s){s=Math.max(0,s|0);return pad(Math.floor(s/60))+':'+pad(s%60);}
function score(H,W,N){return Math.max(0,(H-W)/N);}
function lockArea(root){var ns=root.querySelectorAll('button,select,input');for(var i=0;i<ns.length;i++){ns[i].disabled=true;}var os=root.querySelectorAll('.opt,.chipitem');for(var k=0;k<os.length;k++){os[k].classList.add('lock');}}

/* ---------- global state ---------- */
var S={};
function freshState(){
  return {phase:'intro',order:[],pos:0,seen:0,cur:null,curEx:null,rec:{},skipped:[],creditSum:0,answered:0,
    tState:'IDLE',remaining:0,tickId:null,manualTotal:0,autoTotal:0,stateSince:0,beforeManual:null,
    fromReview:false,reported:false,user:null,country:null,locale:null,perLimit:0,perLeft:0,checked:false,stepIdx:0,stepAns:null,picked:null,
    stageMode:'intro',pausedStage:null,lastResult:null};
}
/* ---------- timer state machine: RUNNING / PAUSED_MANUAL / PAUSED_AUTO_CHECK / ENDED ---------- */
function tSetState(st){
  var now=Date.now();
  if(S.tState==='PAUSED_MANUAL'){S.manualTotal+=Math.round((now-S.stateSince)/1000);}
  if(S.tState==='PAUSED_AUTO_CHECK'){S.autoTotal+=Math.round((now-S.stateSince)/1000);}
  S.tState=st;S.stateSince=now;updateHeader();
}
function tStart(){if(S.tickId)clearInterval(S.tickId);S.tickId=setInterval(tick,1000);}
function tick(){
  if(S.tState!=='RUNNING')return;
  S.remaining--;
  if(S.perLimit>0&&S.perLeft>0){S.perLeft--;var pl=$('#perclock');if(pl)pl.textContent=mmss(S.perLeft);
    if(S.perLeft<=0){doCheck(true);return;}}
  if(S.remaining<=0){S.remaining=0;updateHeader();timeUp();return;}
  updateHeader();
}
function timeUp(){tSetState('ENDED');if(S.tickId){clearInterval(S.tickId);S.tickId=null;}showResults();}
/* ---------- header ---------- */
function stateChip(){
  if(S.tState==='RUNNING')return '<span class="badge st-run" aria-label="Timer running">&#9654; RUNNING</span>';
  if(S.tState==='PAUSED_MANUAL')return '<span class="badge st-paused" aria-label="Timer paused manually">&#9208; PAUSED &mdash; manual (press Resume)</span>';
  if(S.tState==='PAUSED_AUTO_CHECK')return '<span class="badge st-paused" aria-label="Timer paused for feedback review">&#9208; PAUSED &mdash; reviewing feedback (resumes on Next)</span>';
  return '<span class="badge st-ended" aria-label="Timer ended">&#9209; ENDED</span>';
}
function updateHeader(){
  var t=$('#tval');if(t)t.textContent=mmss(S.remaining);
  var st=$('#tstate');if(st)st.innerHTML=stateChip();
  var sc=$('#scoreval');if(sc){var pct=S.answered>0?Math.round(S.creditSum/S.answered*100):0;
    sc.innerHTML='<b>'+S.creditSum.toFixed(1)+' / '+S.answered+'</b>&nbsp;('+pct+'%)';}
  var cnt=$('#counter');if(cnt){
    if(S.phase==='exam')cnt.textContent='Exercise '+S.seen+' of '+META.questionCount;
    else if(S.phase==='review')cnt.textContent='Review skipped — '+S.skipped.length+' left';
    else cnt.textContent=META.questionCount+' exercises';}
  var pb=$('#pbar');if(pb){var done=S.answered+S.skipped.length;var pct2=Math.min(100,Math.round(done/META.questionCount*100));

}
function buildTopbar(){

    '<span class="badge '+META.sevClass+'" aria-label="Severity '+esc(META.sevWord)+'"><span class="dot"></span>'+esc(META.sevWord)+'</span>'+
    '<span class="chip" id="counter">Exercise 1 of '+META.questionCount+'</span>'+

    (S.user?'<span class="chip" aria-label="Learner">&#128100; '+esc(S.user)+'</span>':'')+
    '<button class="btn btn-ghost" id="btn-hint" title="Hint (costs 10% of this exercise credit)">&#128161; Hint</button>'+
    '<button class="btn btn-ghost" id="btn-pause" title="Manual pause">&#9208; Pause</button>'+
    '<button class="btn btn-ghost" id="btn-skip" title="Skip — comes back at the end">&#9888; Skip</button>';
  return tb;
}
function wireTopbar(){
  $('#btn-hint').onclick=doHint;$('#btn-pause').onclick=doPause;$('#btn-skip').onclick=doSkip;
  updateHintBtn();
}
function updateHintBtn(){
  var b=$('#btn-hint');if(!b)return;
  var r=S.rec[S.cur];

  b.disabled=false;

/* ---------- intro ---------- */
function renderIntro(){
  S.phase='intro';document.title=META.pageTitle;

  for(var i=0;i<INTRO.keywords.length;i++){var k=INTRO.keywords[i];
    kw+='<div class="kwpanel"><h4>'+k.theme+'</h4><ul>';

    kw+='</ul></div>';}
  kw+='</div>';c2.innerHTML=kw;app.appendChild(c2);
  var c3=el('div','card');
  c3.innerHTML='<div class="sechead"><span class="si">&#9881;</span>How this exam works</div>'+INTRO.how+
    '<div class="btn-row"><button class="btn btn-primary" id="btn-start" style="min-width:170px">&#9654; Start the exam</button></div>';
  app.appendChild(c3);
  $('#btn-start').onclick=startExam;
}
function buildIntroTop(){
  var c=el('div','card');
  c.innerHTML='<div class="intro-title">'+esc(META.title)+'</div>'+
    '<div class="intro-sub">MITRE ATT&amp;CK object: <b>'+esc(META.objId)+' — '+esc(META.objName)+'</b> &nbsp;&middot;&nbsp; '+esc(META.objKind)+'</div>'+
    '<div class="factstrip">'+
    '<div class="fact"><span class="fl">Severity</span><span class="fv"><span class="badge '+META.sevClass+'"><span class="dot"></span>'+esc(META.sevWord)+'</span></span></div>'+
    '<div class="fact"><span class="fl">Exercises in this file</span><span class="fv">'+META.questionCount+'</span></div>'+
    '<div class="fact"><span class="fl">Estimated time</span><span class="fv">'+META.estimatedMinutes+' min</span></div>'+
    '<div class="fact"><span class="fl">Timer budget</span><span class="fv">'+mmss(META.timerMinutes*60)+'</span></div>'+
    '<div class="fact"><span class="fl">Pass mark</span><span class="fv">'+META.passMark+'%</span></div>'+
    '</div>';
  return c;
}
/* ---------- exam flow ---------- */
function startExam(){
  resetToExam();
  for(var z=0;z<EXERCISES.length;z++){var e=EXERCISES[z];delete e._view;delete e._ans;delete e._seq;delete e._bank;delete e._place;delete e._items;delete e._norm;}
  var idxs=[];for(var i=0;i<EXERCISES.length;i++)idxs.push(i);
  S.order=shuffle(idxs);
  for(var k=0;k<EXERCISES.length;k++){S.rec[k]={status:'pending',credit:0,hintUsed:false};}
  S.remaining=META.timerMinutes*60;
  S.phase='exam';S.tState='RUNNING';S.stateSince=Date.now();
  renderExamShell();
  tStart();
  showExercise(S.order[0],false);
}
function resetToExam(){ /* full reset but keep handshake user */
  var u=S.user;S=freshState();S.user=u;
}
function renderExamShell(){
  var app=$('#app');app.innerHTML='';
  app.appendChild(buildTopbar());wireTopbar();
  var pr=el('div','progress');pr.innerHTML='<i id="pbar" style="width:0%"></i>';app.appendChild(pr);
  var stage=el('div','','');stage.id='stage';app.appendChild(stage);
  updateHeader();
}
function nextPending(afterPos){
  for(var i=afterPos+1;i<S.order.length;i++){var ix=S.order[i];if(S.rec[ix].status==='pending')return i;}
  return -1;
}
function showExercise(exIdx,fromReview){
  /* Next (or entering from the review screen) ends the Check auto-pause: timer returns to RUNNING */
  if(S.tState!=='ENDED'&&S.tState!=='RUNNING')tSetState('RUNNING');
  S.stageMode='exercise';
  var sb=$('#btn-skip');if(sb)sb.disabled=(S.phase!=='exam');
  S.cur=exIdx;S.curEx=EXERCISES[exIdx];S.fromReview=!!fromReview;S.checked=false;S.picked=null;S.stepIdx=0;S.stepAns=null;
  S.perLimit=(S.curEx.data&&S.curEx.data.timerSec)?S.curEx.data.timerSec:0;S.perLeft=S.perLimit;
  if(!fromReview){S.seen++;if(S.rec[exIdx].status==='pending')S.rec[exIdx].status='active';}
  var ex0=S.curEx;ex0._ans=[];ex0._seq=null;ex0._bank=null;ex0._view=null;ex0._place=null;ex0._items=null;
  var st=$('#stage');st.innerHTML='';
  renderBlocks(st,S.curEx);
  updateHeader();
  updateHintBtn();
  window.scrollTo(0,0);
}
function renderBlocks(root,ex){
  /* SCENARIO */
  var sc=el('div','blk blk-scenario');
  sc.innerHTML='<div class="blk-h">&#129517; SCENARIO</div>';
  var body=el('div','blk-b');body.innerHTML=ex.scenario;sc.appendChild(body);
  if(ex.collapsible){
    var tog=el('button','sc-collapse');
    tog.innerHTML='&#9650; Hide scenario &nbsp;&mdash;&nbsp; summary: '+esc(ex.scenarioShort);
    tog.onclick=function(){var open=body.style.display!=='none';
      body.style.display=open?'none':'';tog.innerHTML=open?'&#9660; Show scenario &nbsp;&mdash;&nbsp; summary: '+esc(ex.scenarioShort):'&#9650; Hide scenario &nbsp;&mdash;&nbsp; summary: '+esc(ex.scenarioShort);};
    sc.appendChild(tog);
  }
  root.appendChild(sc);
  /* QUESTION */
  var q=el('div','blk blk-question');
  var qb='<div class="blk-h">&#10067; QUESTION</div><div class="blk-b">';
  if(ex.type==='branch'){
    var si=Math.min(S.stepIdx,ex.data.steps.length-1);
    qb+='<div class="chip" style="margin-bottom:8px">&#128304; STEP '+(si+1)+' OF '+ex.data.steps.length+'</div>';
    qb+='<div class="qtext">'+ex.data.steps[si].q+'</div>';
    if(S.stepIdx>=ex.data.steps.length){qb+='<div class="hintbox" style="margin-top:8px"><b>&#128304; All '+ex.data.steps.length+' steps are recorded.</b> Press Check below to submit the whole chain.</div>';}
  }
  else{qb+='<div class="qtext">'+ex.question+'</div>';
    if(S.checked){qb+='<div class="hintbox" style="margin-top:8px"><b>&#9208; PAUSED &mdash; reviewing feedback (resumes on Next).</b> Your answer is graded below. The clock resumes when you press Next.</div>';}}
  qb+='</div>';
  q.innerHTML=qb;root.appendChild(q);
  /* YOUR ANSWER */
  var a=el('div','blk blk-answer');
  a.innerHTML='<div class="blk-h">&#9997; YOUR ANSWER</div>';
  var ab=el('div','blk-b');ab.id='ansarea';
  if(S.perLimit>0){ab.appendChild(el('div','hintbox','<b>&#9201; Per-exercise limit: '+mmss(S.perLimit)+'</b> — this terminal has its own clock: <b class="timerbox" id="perclock">'+mmss(S.perLeft)+'</b>. It pauses when the main timer pauses and grades what you typed when it expires.'));}
  renderAnswer(ab,ex);
  a.appendChild(ab);root.appendChild(a);
  /* button row */
  var br=el('div','btn-row');br.id='btrow';
  var stepsLeft=(ex.type==='branch'&&S.stepIdx<ex.data.steps.length);
  br.innerHTML='<button class="btn btn-primary" id="btn-check"'+(stepsLeft?' disabled title="Confirm every step first &mdash; Check grades the whole chain"':'')+'>&#10004; Check</button>';
  root.appendChild(br);
  $('#btn-check').onclick=function(){doCheck(false);};
}
function renderAnswer(area,ex){
  if(ex.type==='qcm')rChoice(area,ex,false);
  else if(ex.type==='multi')rChoice(area,ex,true);
  else if(ex.type==='match')rMatch(area,ex);
  else if(ex.type==='order')rOrder(area,ex);
  else if(ex.type==='fill')rFill(area,ex);
  else if(ex.type==='drag')rDrag(area,ex);
  else if(ex.type==='terminal')rTerminal(area,ex);
  else if(ex.type==='branch')rBranch(area,ex);
}
/* ---------- qcm & multi ---------- */
function rChoice(area,ex,isMulti){
  var opts=shuffle(ex.data.options.map(function(o,i){return {t:o.t,why:o.why||'',correct:!!o.correct,i:i};}));
  ex._view=opts;
  var wrap=el('div','opts');wrap.setAttribute('role',isMulti?'group':'radiogroup');
  var letters='ABCDEF';
  opts.forEach(function(o,k){
    var row=el('div','opt');row.setAttribute('role',isMulti?'checkbox':'radio');row.tabIndex=0;
    row.innerHTML='<span class="tag">'+letters[k]+'.</span><span class="txt">'+o.t+'</span><span class="selmark">&#9679; Selected</span>';
    row.__k=k;
    var pick=function(){if(S.checked)return;
      if(isMulti){row.classList.toggle('selected');row.setAttribute('aria-checked',row.classList.contains('selected')?'true':'false');}
      else{var rs=wrap.querySelectorAll('.opt');for(var z=0;z<rs.length;z++){rs[z].classList.remove('selected');rs[z].setAttribute('aria-checked','false');}
        row.classList.add('selected');row.setAttribute('aria-checked','true');}
    };
    row.onclick=pick;row.onkeydown=function(ev){if(ev.key===' '||ev.key==='Enter'){ev.preventDefault();pick();}};
    wrap.appendChild(row);
  });
  area.appendChild(wrap);
}
/* ---------- match ---------- */
function rMatch(area,ex){
  var rights=shuffle(ex.data.right.map(function(r,i){return {t:r,i:i};}));
  ex._view=rights;
  var g=el('div','matchgrid');
  ex.data.left.forEach(function(L,li){
    var left=el('div','mrow');
    var l=el('div','mleft',L.t);left.id='ml-'+li;
    var sel=el('select');sel.id='ms-'+li;sel.setAttribute('aria-label','Match for: '+L.t.replace(/<[^>]*>/g,''));
    sel.appendChild(el('option','', '&#8212; choose the match &mdash;')).value='';
    rights.forEach(function(R){var o=el('option','',R.t);o.value=String(R.i);sel.appendChild(o);});
    sel.__li=li;
    var rw=el('div');rw.appendChild(sel);
    left.appendChild(l);left.appendChild(rw);g.appendChild(left);
  });
  area.appendChild(g);
}
/* ---------- order ---------- */
function rOrder(area,ex){
  ex._bank=shuffle(ex.data.items.map(function(it,i){return {t:it.t,i:i};}));
  ex._seq=[];
  var bank=el('div','bank-inline');bank.id='obank';
  var hint=el('div','','<div class="fcredit">Click the items below in the correct order (first click = step 1). Click a placed item to send it back.</div>');
  area.appendChild(hint);
  var seq=el('div','seq');seq.id='oseq';
  area.appendChild(seq);
  area.appendChild(el('div','fcredit','Item bank:'));
  area.appendChild(bank);
  var draw=function(){
    bank.innerHTML='';seq.innerHTML='';
    ex._bank.forEach(function(b,k){
      var c=el('button','chipitem','<span class="ck">+'+(k+1)+'</span> '+b.t);
      c.onclick=function(){if(S.checked)return;ex._seq.push(b);ex._bank.splice(k,1);draw();};
      bank.appendChild(c);
    });
    ex._seq.forEach(function(b,k){
      var c=el('button','chipitem','<span class="ck">'+(k+1)+'</span> '+b.t);
      c.onclick=function(){if(S.checked)return;ex._bank.push(b);ex._seq.splice(k,1);draw();};
      seq.appendChild(c);
    });
    if(!ex._bank.length&&!ex._seq.length)bank.appendChild(el('span','fcredit','All items placed.'));
  };
  draw();
}
/* ---------- fill ---------- */
function rFill(area,ex){
  var bank=shuffle(ex.data.bank.map(function(b){return b;}));
  ex._view=bank;
  var parts=ex.data.template.split(/\{\{\s*(\d+)\s*\}\}/g);
  var line=el('div','fillline');
  for(var i=0;i<parts.length;i++){
    if(i%2===0){line.appendChild(document.createTextNode(parts[i]));}
    else{var bi=parseInt(parts[i],10);
      var sel=el('select');sel.id='fb-'+bi;sel.setAttribute('aria-label','Blank '+(bi+1));
      sel.appendChild(el('option','','&#8212; pick a word &mdash;')).value='';
      bank.forEach(function(w){var o=el('option','',w);o.value=w;sel.appendChild(o);});
      line.appendChild(sel);}
  }
  area.appendChild(line);
}
/* ---------- drag & drop ---------- */
function rDrag(area,ex){
  ex._items=shuffle(ex.data.items.map(function(it){return {id:it.id,t:it.t};}));
  ex._place={};
  var hint=el('div','fcredit','Pick an item, then click its slot (or drag it). Click a placed item to send it back.');
  area.appendChild(hint);
  var slotsWrap=el('div','slots');
  ex.data.slots.forEach(function(sl){
    var s=el('div','slot');s.id='slot-'+sl.id;
    s.innerHTML='<span class="slab">'+sl.label+'</span>';
    s.__sid=sl.id;
    s.tabIndex=0;s.setAttribute('role','button');
    s.setAttribute('aria-label','Drop zone: '+sl.label.replace(/<[^>]*>/g,'')+' — pick an item, then press Enter here to place it');
    s.onkeydown=function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();if(S.checked)return;dropTo(sl.id);}};
    s.onclick=function(ev){if(S.checked)return;var t=ev.target;
      if(t.classList&&t.classList.contains('chipitem')){sendBack(t.getAttribute('data-id'));return;}
      dropTo(sl.id);};
    s.ondragover=function(ev){ev.preventDefault();s.classList.add('over');};
    s.ondragleave=function(){s.classList.remove('over');};
    s.ondrop=function(ev){ev.preventDefault();s.classList.remove('over');var id=ev.dataTransfer.getData('text/plain');if(id){pick(id);dropTo(sl.id);}};
    slotsWrap.appendChild(s);
  });
  area.appendChild(slotsWrap);
  area.appendChild(el('div','fcredit','Item bank:'));
  var bank=el('div','bank');bank.id='dbank';area.appendChild(bank);
  function pick(id){var it=null;for(var i=0;i<ex._items.length;i++){if(ex._items[i].id===id)it=ex._items[i];}
    if(!it)return;var prev=ex._place[id];if(prev){var ps=$('#slot-'+prev);var pc=ps.querySelector('[data-id="'+id+'"]');if(pc)ps.removeChild(pc);delete ex._place[id];}
    return it;}
  function sendBack(id){if(S.checked)return;pick(id);drawBank();}
  function dropTo(sid){if(S.checked||!S.picked)return;ex._place[S.picked]=sid;
    var s=$('#slot-'+sid);var it=null;for(var i=0;i<ex._items.length;i++){if(ex._items[i].id===S.picked)it=ex._items[i];}
    var c=el('button','chipitem',it.t);c.setAttribute('data-id',S.picked);c.setAttribute('draggable','false');
    c.onclick=function(ev){ev.stopPropagation();sendBack(S.picked);};
    s.appendChild(c);S.picked=null;drawBank();}
  function drawBank(){bank.innerHTML='';ex._items.forEach(function(it){
    if(ex._place[it.id])return;
    var c=el('button','chipitem',it.t);c.setAttribute('data-id',it.id);c.setAttribute('draggable','true');
    c.onclick=function(){if(S.checked)return;var all=document.querySelectorAll('.chipitem.picked');for(var z=0;z<all.length;z++)all[z].classList.remove('picked');c.classList.add('picked');S.picked=it.id;};
    c.ondragstart=function(ev){ev.dataTransfer.setData('text/plain',it.id);c.classList.add('dragging');S.picked=it.id;};
    c.ondragend=function(){c.classList.remove('dragging');};
    bank.appendChild(c);});
    if(!bank.children.length)bank.appendChild(el('span','fcredit','All items placed — click a placed item to move it back.'));}
  drawBank();
}
/* ---------- terminal ---------- */
function rTerminal(area,ex){
  var term=el('div','term');
  term.innerHTML='<div class="term-bar"><i></i><i></i><i></i><span>'+esc(ex.data.title||'simulated shell — nothing here touches a real system')+'</span></div>'+
    '<div class="term-out" id="tout">'+ex.data.banner.map(function(l){return '<span class="c">'+l+'</span>';}).join('\n')+'</div>'+
    '<div class="term-in"><span class="pr">'+ex.data.prompt+'</span><input id="tin" type="text" autocomplete="off" spellcheck="false" aria-label="Type the command"></div>';
  area.appendChild(term);
  var row=el('div','termrow');
  row.innerHTML='<button class="btn btn-blue" id="btn-run">&#9654; Run</button>'+
    '<span class="fcredit">Type the command, press Run to see simulated output, then Check to grade it. Nothing real is executed.</span>';
  area.appendChild(row);
  function norm(c){return c.trim().replace(/\s+/g,' ').toLowerCase();}
  ex._norm=norm;
  function run(){
    if(S.checked)return;
    var v=$('#tin').value;var out=$('#tout');var n=norm(v);
    out.textContent+='\n'+ex.data.prompt+' '+v+'\n';
    if(!n){out.textContent+='(no command typed)\n';}
    else{
      var ok=false,dang=false;
      try{ok=new RegExp(ex.data.okRe,'i').test(n);}catch(e){ok=false;}
      try{dang=ex.data.dangerRe?new RegExp(ex.data.dangerRe,'i').test(n):false;}catch(e){dang=false;}
      if(dang){ex.data.dangerOut.forEach(function(l){out.textContent+=l+'\n';});}
      else if(ok){ex.data.output.forEach(function(l){out.textContent+=l+'\n';});}
      else{out.textContent+=(ex.data.notFound||('command not found: '+n.split(' ')[0]))+'\n';}
    }
    out.scrollTop=out.scrollHeight;
    $('#tin',area).focus();
  }
  $('#btn-run',area).onclick=run;
  $('#tin',area).onkeydown=function(ev){if(ev.key==='Enter'){ev.preventDefault();run();}};
  setTimeout(function(){var t=$('#tin',area);if(t)t.focus();},80);
}
/* ---------- branch ---------- */
function rBranch(area,ex){
  if(!ex._ans)ex._ans=[];
  if(!ex._view)ex._view=[];
  var si=Math.min(S.stepIdx,ex.data.steps.length-1);
  var wrap=el('div','opts');
  var step=ex.data.steps[si];
  /* shuffle each step's options once per attempt so the correct answer is not always in the same position */
  if(!ex._view[si])ex._view[si]=shuffle(step.options.map(function(o,k){return {o:o,k:k};}));
  ex._view[si].forEach(function(v,k){
    var o=v.o;
    var row=el('div','opt');row.tabIndex=0;row.setAttribute('role','radio');row.setAttribute('aria-checked','false');
    row.innerHTML='<span class="tag">'+'ABCDEF'[k]+'.</span><span class="txt">'+o.t+'</span><span class="selmark">&#9679; Selected</span>';
    row.onclick=function(){if(S.checked)return;var rs=wrap.querySelectorAll('.opt');
      for(var z=0;z<rs.length;z++){rs[z].classList.remove('selected');rs[z].setAttribute('aria-checked','false');}
      row.classList.add('selected');row.setAttribute('aria-checked','true');};
    wrap.appendChild(row);
  });
  area.appendChild(wrap);
  var br=el('div','btn-row');
  if(S.stepIdx>=ex.data.steps.length){
    lockArea(area);
  }else{
  br.innerHTML='<button class="btn btn-blue" id="btn-step">&#9998; Confirm step '+(S.stepIdx+1)+'</button>'+
    '<span class="fcredit">Your choice is locked in and hidden until the final Check — the timer keeps running between steps.</span>';
  area.appendChild(br);
  $('#btn-step',area).onclick=function(){
    if(S.checked)return;
    var sel=wrap.querySelector('.opt.selected');if(!sel)return;
    var k=Array.prototype.indexOf.call(wrap.querySelectorAll('.opt'),sel);
    ex._ans[S.stepIdx]=ex._view[S.stepIdx][k].k;S.stepIdx++;
    var stg=$('#stage');
    if(S.stepIdx<ex.data.steps.length){stg.innerHTML='';renderBlocks(stg,ex);}
    else{ /* final step recorded -> show Check */
      stg.innerHTML='';renderBlocks(stg,ex);
      var note=el('div','hintbox','<b>&#128304; All '+ex.data.steps.length+' steps recorded.</b> Your choices are hidden. Press Check to submit the whole chain and see the outcome.');
      $('#ansarea').appendChild(note);
      lockArea($('#ansarea'));
    }
    window.scrollTo(0,0);
  };
  }
}
/* ---------- grading ---------- */
function itemRow(kind,txt,why){
  var ic=kind==='correct'?'&#10004; Correct':(kind==='wrong'?'&#10008; Wrong':'&#9675; Missed');
  var cls=kind==='correct'?'i-correct':(kind==='wrong'?'i-wrong':'i-missed');
  return '<div class="itemrow '+cls+'"><span class="ic">'+ic+'</span><span><b>'+txt+'</b>'+(why?' — '+why:'')+'</span></div>';
}
function grade(ex){
  var r={credit:0,items:null,H:0,W:0,N:1,label:'',explain:ex.explain,danger:null};
  var t=ex.type;
  if(t==='qcm'){
    var sel=$('#ansarea').querySelector('.opt.selected');
    var k=sel?Array.prototype.indexOf.call($('#ansarea').querySelectorAll('.opt'),sel):-1;
    r.N=1;r.H=(k>=0&&ex._view[k].correct)?1:0;r.W=0;
    var o=k>=0?ex._view[k]:null;
    var correctOpt=ex._view.filter(function(x){return x.correct;})[0];
    r.items=itemRow(r.H?'correct':'wrong',o?('Your choice: '+o.t.replace(/<[^>]*>/g,'')):'No option selected',o?(o.correct?o.why:('Not correct here. Correct answer: '+correctOpt.t.replace(/<[^>]*>/g,'')+' &mdash; '+correctOpt.why)):'Nothing was selected, so the exercise scores 0.');
  }
  else if(t==='multi'){
    var rows=$('#ansarea').querySelectorAll('.opt');
    var picked={};rows.forEach(function(row,i){picked[i]=row.classList.contains('selected');});
    var its=[];var n=0,h=0,w=0;
    ex._view.forEach(function(o,i){
      if(o.correct){n++;if(picked[i]){h++;its.push(itemRow('correct','Selected: '+o.t.replace(/<[^>]*>/g,''),o.why));}
        else its.push(itemRow('missed','Missed: '+o.t.replace(/<[^>]*>/g,''),o.why));}
      else if(picked[i]){w++;its.push(itemRow('wrong','Wrong pick: '+o.t.replace(/<[^>]*>/g,''),o.why));}
    });
    r.N=n;r.H=h;r.W=w;r.items=its.join('');
  }
  else if(t==='match'){
    var its2=[];var n2=ex.data.left.length,h2=0,w2=0;
    ex.data.left.forEach(function(L,li){
      var s=$('#ms-'+li);var v=s?s.value:'';
      if(v===''){its2.push(itemRow('missed','No match chosen for: '+L.t.replace(/<[^>]*>/g,''),L.why));}
      else if(parseInt(v,10)===L.r){h2++;its2.push(itemRow('correct',L.t.replace(/<[^>]*>/g)+' &#8594; '+ex.data.right[L.r],L.why));}
      else{w2++;its2.push(itemRow('wrong',L.t.replace(/<[^>]*>/g)+' &#8594; '+ex.data.right[parseInt(v,10)],L.why));}
    });
    r.N=n2;r.H=h2;r.W=w2;r.items=its2.join('');
  }
  else if(t==='order'){
    var its3=[],n3=ex.data.items.length,h3=0,w3=0;
    for(var i=0;i<n3;i++){
      var placed=ex._seq[i];
      if(!placed){its3.push(itemRow('missed','Position '+(i+1)+' — '+ex.data.items[i].t,'Left empty. This step belongs here.'));}
      else if(placed.i===i){h3++;its3.push(itemRow('correct','Position '+(i+1)+' — '+placed.t,ex.data.items[i].why));}
      else{w3++;its3.push(itemRow('wrong','Position '+(i+1)+' — you placed: '+placed.t,ex.data.items[i].why));}
    }
    r.N=n3;r.H=h3;r.W=w3;r.items=its3.join('');
  }
  else if(t==='fill'){
    var its4=[],n4=ex.data.blanks.length,h4=0,w4=0;
    ex.data.blanks.forEach(function(b,bi){
      var s=$('#fb-'+bi);var v=s?s.value:'';
      if(v===''){its4.push(itemRow('missed','Blank '+(bi+1)+' left empty — answer: '+b.correct,b.why));}
      else if(v===b.correct){h4++;its4.push(itemRow('correct','Blank '+(bi+1)+': '+v,b.why));}
      else{w4++;its4.push(itemRow('wrong','Blank '+(bi+1)+': you chose '+v+' — answer: '+b.correct,b.why));}
    });
    r.N=n4;r.H=h4;r.W=w4;r.items=its4.join('');
  }
  else if(t==='drag'){
    var its5=[],n5=ex.data.items.length,h5=0,w5=0;
    ex.data.items.forEach(function(it){
      var dest=ex._place[it.id];
      if(!dest){its5.push(itemRow('missed','Still in bank: '+it.t,(ex.data.why&&ex.data.why[it.id])||'It belongs in: '+slotLabel(ex.data,ex.data.correct[it.id])));}
      else if(dest===ex.data.correct[it.id]){h5++;its5.push(itemRow('correct',it.t+' &#8594; '+slotLabel(ex.data,dest),(ex.data.why&&ex.data.why[it.id])||''));}
      else{w5++;its5.push(itemRow('wrong',it.t+' &#8594; '+slotLabel(ex.data,dest)+' — belongs in: '+slotLabel(ex.data,ex.data.correct[it.id]),(ex.data.why&&ex.data.why[it.id])||''));}
    });
    r.N=n5;r.H=h5;r.W=w5;r.items=its5.join('');
  }
  else if(t==='terminal'){
    var v=$('#tin')?$('#tin').value:'';
    var n=ex._norm?ex._norm(v):v.trim().toLowerCase();
    var its6=[];var h6=0,w6=0;
    ex.data.required.forEach(function(req){
      var hit=false;try{hit=new RegExp(req.re,'i').test(n);}catch(e){}
      if(hit){h6++;its6.push(itemRow('correct','Element present: '+req.label,req.why));}
      else its6.push(itemRow('missed','Element missing: '+req.label,req.why+' Expected something like: '+req.match));
    });
    if(ex.data.forbidden){ex.data.forbidden.forEach(function(f){
      var hit=false;try{hit=new RegExp(f.re,'i').test(n);}catch(e){}
      if(hit){w6++;its6.push(itemRow('wrong','Dangerous element present: '+f.label,f.why));}});}
    r.N=ex.data.required.length;r.H=h6;r.W=w6;r.items=its6.join('');
    if(w6>0){r.danger='&#10008; DANGEROUS — NEAR MISS: the command you typed would change or destroy state in a real incident ('+esc(ex.data.dangerWhy||'it alters the system you are investigating')+') . In live response, read-only or evidence-preserving commands come first.';}
  }
  else if(t==='branch'){
    var its7=[],n7=ex.data.steps.length,h7=0,w7=0;
    ex.data.steps.forEach(function(stp,si){
      var chosen=ex._ans?ex._ans[si]:-1;
      var opt=chosen>=0?stp.options[chosen]:null;
      if(opt&&opt.correct){h7++;its7.push(itemRow('correct','Step '+(si+1)+': '+opt.t.replace(/<[^>]*>/g,''),opt.why));}
      else if(opt){w7++;var co=stp.options.filter(function(x){return x.correct;})[0];
        its7.push(itemRow('wrong','Step '+(si+1)+': '+opt.t.replace(/<[^>]*>/g,''),opt.why+' Better: '+co.t.replace(/<[^>]*>/g,'')+' — '+co.why));}
      else its7.push(itemRow('missed','Step '+(si+1)+' — no choice recorded','This decision point was left empty.'));
    });
    r.N=n7;r.H=h7;r.W=w7;r.items=its7.join('');
  }
  r.credit=score(r.H,r.W,r.N);
  return r;
}
function slotLabel(d,sid){for(var i=0;i<d.slots.length;i++){if(d.slots[i].id===sid)return d.slots[i].label;}return sid;}
/* ---------- actions ---------- */
function doHint(){
  if(S.checked)return;var r=S.rec[S.cur];if(!r||r.hintUsed)return;
  r.hintUsed=true;updateHintBtn();
  var q=$('#stage .blk-question .blk-b');var h=el('div','hintbox','<b>&#128161; Hint</b> — using one costs 10% of this exercise&rsquo;s credit: '+S.curEx.hint);
  if(q)q.appendChild(h);
}
function doPause(){
  if(S.tState==='ENDED'||S.phase==='intro'||S.phase==='results')return;
  if(S.tState==='PAUSED_MANUAL')return;
  S.beforeManual=S.tState;S.pausedStage=S.stageMode;tSetState('PAUSED_MANUAL');
  var st=$('#stage');
  st.innerHTML='<div class="pausepanel"><div class="big">&#9208; PAUSED — manual</div><p>The exercise is hidden while you take a break. The clock is stopped.</p><button class="btn btn-blue" id="btn-resume">&#9654; Resume</button></div>';
  $('#btn-resume').onclick=doResume;
}
function doResume(){
  var back=S.beforeManual||'RUNNING';
  /* manual pause taken on top of the review-skipped screen returns to that screen */
  if(S.pausedStage==='list'){tSetState(back);showReview();window.scrollTo(0,0);return;}
  var st=$('#stage');st.innerHTML='';renderBlocks(st,S.curEx);
  if(S.checked&&S.lastResult){renderFeedback(S.lastResult);} /* restore graded view after manual pause on top of auto-pause */
  tSetState(back);
  window.scrollTo(0,0);
}
function doSkip(){
  if(S.checked||S.phase!=='exam')return;
  if(S.rec[S.cur].status!=='skipped'){S.rec[S.cur].status='skipped';S.skipped.push(S.cur);}
  advance();
}
function advance(){
  var np=nextPending(S.order.indexOf(S.cur));
  if(np>=0){showExercise(S.order[np],false);return;}
  if(S.skipped.length){showReview();return;}
  showResults();
}
function doCheck(auto){
  if(S.checked||S.tState==='ENDED')return;
  if(!auto){var need=false;
    if(S.curEx.type==='branch'&&S.stepIdx<S.curEx.data.steps.length)return; /* confirm steps first */
  }
  tSetState('PAUSED_AUTO_CHECK'); /* FIRST ACTION per spec */
  S.checked=true;
  var r=grade(S.curEx);
  if(S.rec[S.cur].hintUsed){r.credit=Math.max(0,r.credit-0.10);}
  S.rec[S.cur].credit=r.credit;S.rec[S.cur].status='done';S.answered++;S.creditSum+=r.credit;
  var sk=S.skipped.indexOf(S.cur);if(sk>=0)S.skipped.splice(sk,1); /* answered during review */
  S.lastResult=r;
  renderFeedback(r);
  updateHeader();
}
function renderFeedback(r){
  lockArea($('#ansarea'));

  if(r.credit>=1){lab='&#10004; CORRECT';cls='f-correct';}
  else if(r.credit>0){lab='&#10004; PARTIALLY CORRECT';cls='f-partial';}
  else{lab='&#10008; INCORRECT';cls='f-incorrect';}
  var fb=el('div','feedback '+cls);
  var creditLine=(r.N>1||r.credit<1)?'<div class="fcredit">Credit <b>'+r.credit.toFixed(2)+'</b> — '+Math.round(r.H)+' correct / '+Math.round(r.W)+' wrong / '+r.N+' items &nbsp;(formula: (H &minus; W) &divide; N)'+(S.rec[S.cur].hintUsed?' &nbsp;&middot;&nbsp; includes &minus;0.10 hint penalty':'')+'</div>':'';
  var canon='';
  if(ex.type==='terminal'){
    canon='<div class="canon"><div class="fcredit" style="margin:8px 0 4px">Canonical command (copyable):</div><code id="canontext">'+esc(ex.data.canonical)+'</code>'+
      '<div class="btn-row"><button class="btn btn-ghost" id="btn-copy">&#128203; Copy</button></div></div>';
  }
  fb.innerHTML='<div class="fhead">'+lab+'</div>'+creditLine+
    (r.danger?'<div class="danger">'+r.danger+'</div>':'')+
    (r.items?'<div class="items">'+r.items+'</div>':'')+
    '<div class="fexplain">'+r.explain+'</div>'+canon+
    '<div class="study">&#128218; What to study next: '+ex.study+'</div>';
  $('#stage').appendChild(fb);
  var cp=$('#btn-copy');
  if(cp)cp.onclick=function(){var txt=ex.data.canonical;
    try{navigator.clipboard.writeText(txt).then(function(){cp.textContent='&#128203; Copied';},function(){fallbackCopy(txt);cp.textContent='&#128203; Copied';});}
    catch(e){fallbackCopy(txt);cp.textContent='&#128203; Copied';}};
  /* next button */
  var br=$('#btrow');
  var lastOne=!(nextPending(S.order.indexOf(S.cur))>=0)&&S.skipped.length===0;
  br.innerHTML='';
  var nb=el('button','btn btn-blue',lastOne&&S.skipped.length===0?'&#10148; Final Submit':'Next &#9654;');
  nb.onclick=function(){
    var np=nextPending(S.order.indexOf(S.cur));
    if(np>=0){showExercise(S.order[np],false);return;}
    if(S.skipped.length){showReview();return;}
    showResults();
  };
  br.appendChild(nb);
}
function fallbackCopy(t){try{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}catch(e){}}
/* ---------- review skipped ---------- */
function showReview(){
  S.phase='review';S.stageMode='list';

  if(S.tState!=='ENDED'&&S.tState!=='RUNNING')tSetState('RUNNING');

  });

    '<p class="intro-sub">These '+S.skipped.length+' exercise(s) are still unanswered. Answer as many as the clock allows — anything you leave now is excluded from the score (it counts neither for you nor against you). The clock is still running.</p>'+rows+
    '<div class="btn-row" style="margin-top:14px"><button class="btn btn-primary" id="btn-finish">&#10148; Submit final results</button></div>';
  st.appendChild(card);

  for(var i=0;i<bs.length;i++){bs[i].onclick=function(){var ix=parseInt(this.getAttribute('data-rv'),10);showExercise(ix,true);};}
  $('#btn-finish').onclick=showResults;
  window.scrollTo(0,0);
}
/* ---------- results ---------- */
function showResults(){
  if(S.tickId){clearInterval(S.tickId);S.tickId=null;}
  tSetState('ENDED');S.phase='results';S.stageMode='results';
  var sb=$('#btn-skip');if(sb)sb.disabled=true;
  var full=0,part=0,zero=0,partSum=0;
  for(var k in S.rec){var r=S.rec[k];if(r.status!=='done')continue;
    if(r.credit>=1)full++;else if(r.credit>0){part++;partSum+=r.credit;}else zero++;}
  var left=S.skipped.length;
  var pct=S.answered>0?Math.round(S.creditSum/S.answered*100):0;
  var passed=pct>=META.passMark;
  var st=$('#stage');st.innerHTML='';
  var card=el('div','card');
  card.innerHTML='<div class="result-head '+(passed?'pass':'fail')+'">'+(passed?'&#10004; PASS':'&#10008; FAIL')+'</div>'+
    '<div class="scorebig">'+pct+'%</div>'+
    '<div class="intro-sub">'+S.creditSum.toFixed(1)+' credit points over '+S.answered+' answered exercise(s) — pass mark '+META.passMark+'%. '+(passed?'Well done. ':'Below the pass mark — retake the exam to improve. ')+'Skipped-and-never-answered exercises are excluded from both the points and the total.</div>'+
    '<div class="statgrid">'+
    '<div class="stat s-c"><span class="sl">&#10004; Fully correct</span><span class="sv">'+full+'</span></div>'+
    '<div class="stat s-p"><span class="sl">&#10004; Partially correct</span><span class="sv">'+part+'</span><span class="sl">'+(part?'avg '+(partSum/part).toFixed(2)+' credit':'')+'</span></div>'+
    '<div class="stat s-w"><span class="sl">&#10008; Fully incorrect</span><span class="sv">'+zero+'</span></div>'+
    '<div class="stat s-s"><span class="sl">&#9888; Skipped — excluded</span><span class="sv">'+left+'</span></div>'+
    '</div>'+
    '<div class="pauselog">&#9201; Time log — paused manually: <b>'+mmss(S.manualTotal)+'</b> &middot; paused for feedback review: <b>'+mmss(S.autoTotal)+'</b> &middot; clock remaining: <b>'+mmss(S.remaining)+'</b></div>'+
    (passed?'<div class="certificate">&#127942; <b>Certificate note:</b> you passed the '+esc(META.sevWord)+' certification exam for '+esc(META.objId)+' — '+esc(META.objName)+'. Your score has been reported to the platform.</div>':'')+
    '<div class="btn-row" style="margin-top:14px"><button class="btn btn-amber" id="btn-retake">&#8635; Retake exam</button></div>';
  st.appendChild(card);
  $('#btn-retake').onclick=function(){startExam();};
  reportScore(S.creditSum,S.answered,pct);
  window.scrollTo(0,0);
}
function reportScore(creditSum,answeredCount,percent){
  if(S.reported)return;S.reported=true;
  try{
    parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,batch:META.batch,
      score:Math.round(creditSum),total:answeredCount,percent:percent,passed:percent>=META.passMark},location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}
/* ---------- handshake ---------- */
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  S.user=event.data.username||null;
  S.country=event.data.country||null;S.locale=event.data.locale||null; /* consumed — the file stays dark-only regardless of theme */
  var tb=document.querySelector('.topbar');
  if(S.user&&tb&&!tb.querySelector('.u-chip')){
    var c=el('span','chip u-chip','&#128100; '+esc(S.user));tb.insertBefore(c,document.getElementById('btn-hint'));
  }
});
/* ---------- init ---------- */
function init(){S=freshState();renderIntro();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();


</script>
</body>
