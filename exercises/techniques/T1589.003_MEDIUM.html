<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>T1589.003 — MEDIUM practice exam</title>
<script type="application/json" id="cm-exercise-meta">
{

  "passMark": 70
}

<style>
:root{
  --bg-page:#0b1020; --bg-surface:#121a2e; --bg-surface-2:#0f1729; --border:#243049;
  --text-primary:#e6ecff; --text-secondary:#a9b4d0; --text-mono:#c8ffd4;
  --accent-blue:#5aa9ff; --accent-amber:#ffb454; --accent-green:#57d38c;
  --state-correct:#57d38c; --state-partial:#ffb454; --state-incorrect:#ff6b6b;
  --state-skipped:#a9b4d0; --state-paused:#9d7bff;
  --sev-easy:#57d38c; --sev-medium:#ffb454; --sev-hard:#ff8a3d; --sev-extreme:#ff6b6b;
  --sev:var(--sev-easy);
  --shadow:0 6px 18px rgba(3,8,20,.45);
  --r:8px;
}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:dark}
html,body{margin:0;padding:0}
body{
  background:var(--bg-page); color:var(--text-primary);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono,.code,pre.code,input.term-in,.log-line,.term-out{
  font-family:ui-monospace,SFMono-Regular,"Cascadia Mono","JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace;
}
.wrap{max-width:980px;margin:0 auto;padding:20px 18px 64px}
h1,h2,h3{line-height:1.25;margin:0 0 10px}
h1{font-size:1.45rem} h2{font-size:1.15rem} h3{font-size:1.02rem}
p{margin:.45em 0}
a{color:var(--accent-blue)}
small,.small{font-size:.86rem;color:var(--text-secondary)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}
::selection{background:#2b3f66}

/* ---------- cards & panels ---------- */
.panel{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px 18px;margin:14px 0}
.panel.tight{padding:12px 14px}
.sub{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:10px 0}
.sub-label{font-size:.78rem;letter-spacing:.06em;color:var(--text-secondary);text-transform:uppercase;
  font-family:ui-monospace,Consolas,monospace;margin:0 0 6px}
.hr{border:none;border-top:1px solid var(--border);margin:14px 0}

/* ---------- intro ---------- */
.intro-head{border-left:4px solid var(--sev);padding-left:16px;margin:6px 0 4px}
.factrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fact{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;
  padding:7px 12px;font-size:.88rem;color:var(--text-secondary)}
.fact b{color:var(--text-primary);font-weight:600}
.kw-theme{margin:10px 0}
.kw-theme h3{color:var(--accent-blue);font-size:.95rem}
.kw-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.kw{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:20px;
  padding:4px 12px;font-size:.84rem;color:var(--text-primary)}
.rules{list-style:none;margin:8px 0;padding:0}
.rules li{padding:7px 0 7px 30px;position:relative;border-bottom:1px dashed var(--border);color:var(--text-primary)}
.rules li:last-child{border-bottom:none}
.rules li::before{content:"\25B8";position:absolute;left:8px;color:var(--accent-amber)}

/* ---------- chips / badges ---------- */
.badge{display:inline-flex;align-items:center;gap:7px;border-radius:20px;padding:4px 13px;
  font-size:.82rem;font-weight:700;letter-spacing:.05em;border:1px solid}
.badge .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
.b-easy{color:var(--sev-easy);border-color:var(--sev-easy);background:rgba(87,211,140,.09)}
.b-medium{color:var(--sev-medium);border-color:var(--sev-medium);background:rgba(255,180,84,.09)}
.b-hard{color:var(--sev-hard);border-color:var(--sev-hard);background:rgba(255,138,61,.10)}
.b-extreme{color:var(--sev-extreme);border-color:var(--sev-extreme);background:rgba(255,107,107,.10)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:6px;
  background:var(--bg-surface-2);padding:6px 11px;font-size:.84rem;color:var(--text-primary)}
.chip.ok{color:var(--state-correct);border-color:var(--state-correct)}
.chip.warn{color:var(--state-partial);border-color:var(--state-partial)}
.chip.bad{color:var(--state-incorrect);border-color:var(--state-incorrect)}
.chip.skip{color:var(--state-skipped);border-color:var(--border)}
.chip.pause{color:var(--state-paused);border-color:var(--state-paused)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(11,16,32,.96);border-bottom:1px solid var(--border);
  box-shadow:0 4px 14px rgba(3,8,20,.5)}
.topbar-in{max-width:980px;margin:0 auto;padding:9px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:9px}
.tb-count{font-weight:700;font-size:.92rem;white-space:nowrap}
.tb-user{font-size:.8rem;color:var(--text-secondary);white-space:nowrap}
.tb-spacer{flex:1}
.tb-timer{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;font-weight:700;
  font-size:.95rem;color:var(--text-primary)}
.tb-state{font-size:.74rem;letter-spacing:.03em}
.tb-score{font-family:ui-monospace,Consolas,monospace;font-size:.92rem;color:var(--text-primary)}
.tb-score b{color:var(--accent-green)}
.tb-score .pct{color:var(--text-secondary);font-size:.82rem}

/* ---------- progress ---------- */
.pbar{height:8px;background:var(--bg-surface-2);border-bottom:1px solid var(--border);overflow:hidden}
.pbar-in{height:100%;width:0%;
  background:linear-gradient(90deg,var(--sev),var(--accent-blue));
  transition:width .5s ease;position:relative}
.pbar-in::after{content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(230,236,255,.25) 50%,transparent 70%);
  animation:sheen 2.8s linear infinite}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;
  padding:9px 18px;border-radius:6px;border:1px solid var(--border);background:var(--bg-surface-2);
  color:var(--text-primary);cursor:pointer;font-weight:600;font-size:.92rem;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:#1a2440;border-color:#33507e}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn-primary{background:var(--sev);border-color:var(--sev);color:#08101f}
.btn-primary:hover:not(:disabled){background:var(--sev);filter:brightness(1.12)}
.btn-blue{background:#173154;border-color:var(--accent-blue);color:var(--accent-blue)}
.btn-ghost{background:transparent}
.btn-danger{border-color:var(--state-incorrect);color:var(--state-incorrect)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn-lg{font-size:1.02rem;padding:12px 30px}

/* ---------- exercise blocks ---------- */
.ex-head{display:flex;align-items:center;gap:10px;margin:16px 0 8px;flex-wrap:wrap}
.ex-title{font-size:.95rem;color:var(--text-secondary);font-weight:600}
.blk{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
.blk-h{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:.82rem;font-weight:800;
  letter-spacing:.09em;border-bottom:1px solid var(--border);text-transform:uppercase}
.blk-h .ic{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;
  border-radius:5px;font-size:.85rem;background:rgba(90,169,255,.14);color:var(--accent-blue)}
.blk-h .tag{margin-left:auto;font-weight:600;letter-spacing:.02em;font-size:.72rem;color:var(--text-secondary)}
.blk-scenario{border-left:4px solid var(--accent-blue)}
.blk-scenario .blk-h{color:var(--accent-blue)}
.blk-question{border-left:4px solid var(--accent-amber)}
.blk-question .blk-h{color:var(--accent-amber)}
.blk-question .ic{background:rgba(255,180,84,.14);color:var(--accent-amber)}
.blk-answer{border-left:4px solid var(--accent-green)}
.blk-answer .blk-h{color:var(--accent-green)}
.blk-answer .ic{background:rgba(87,211,140,.14);color:var(--accent-green)}
.blk-b{padding:14px 16px}
.scen-p{margin:.5em 0;color:var(--text-primary)}
.q-text{font-weight:700;font-size:1.02rem;margin:0}

/* collapsible scenario */
.collapse-btn{margin-left:auto;background:none;border:1px solid var(--border);border-radius:5px;
  color:var(--text-secondary);cursor:pointer;padding:3px 10px;font-size:.74rem;min-height:44px}
.collapsed .blk-b{display:none}
.collapsum{display:none;padding:8px 14px;font-size:.82rem;color:var(--text-secondary);border-top:1px solid var(--border)}
.collapsed .collapsum{display:block}

/* artefacts & code */
.artefact{margin:12px 0}
pre.code{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;
  color:var(--text-mono);font-size:.86rem;line-height:1.55;padding:11px 13px;margin:6px 0 0;
  overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.tok-k{color:var(--accent-blue);font-weight:700}
.tok-s{color:var(--accent-amber)}
.tok-n{color:var(--sev-hard)}
.tok-c{color:var(--text-secondary);font-style:italic}
.tok-f{color:var(--state-incorrect)}

/* log viewer */
.logview{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.logview-top{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border)}
.logview input{flex:1;background:var(--bg-page);border:1px solid var(--border);border-radius:5px;
  color:var(--text-primary);padding:8px 10px;font-size:.86rem;min-height:38px}
.log-count{font-size:.74rem;color:var(--text-secondary);font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
.log-lines{max-height:300px;overflow:auto;padding:6px 0}
.log-line{padding:3px 12px;font-size:.82rem;color:var(--text-mono);white-space:pre-wrap;word-break:break-word}
.log-line .ts{color:var(--text-secondary)}
.log-line .src{color:var(--accent-blue);font-weight:700}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:var(--bg-surface-2);
  border:1px solid var(--border);border-radius:6px;padding:11px 13px;cursor:pointer;min-height:44px;
  color:var(--text-primary);transition:background .12s,border-color .12s}
.opt:hover:not(:disabled){background:#182238}
.opt-k{flex:0 0 auto;font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--text-secondary)}
.opt-t{flex:1}
.opt-sel{border-left:4px solid var(--accent-green);box-shadow:0 0 0 1px var(--accent-green),0 0 12px rgba(87,211,140,.25)}
.opt.sel-tag::after{content:"\25CF selected";margin-left:auto;color:var(--accent-green);font-size:.76rem;font-weight:700;white-space:nowrap}
.opt:disabled{cursor:default;opacity:.85}
.opt-correct{border-left:4px solid var(--state-correct)}
.opt-wrong{border-left:4px solid var(--state-incorrect)}

/* fill-in */
.fill-wrap{line-height:2.3;color:var(--text-primary)}
.fill-in{background:var(--bg-page);border:1px solid var(--border);border-bottom:2px solid var(--accent-green);
  border-radius:5px;color:var(--text-mono);padding:6px 10px;font-size:.9rem;min-height:44px;min-width:120px;margin:0 3px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)}
.bank-l{font-size:.78rem;color:var(--text-secondary);width:100%}
.bk{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:16px;padding:3px 11px;
  font-size:.84rem;color:var(--text-mono);font-family:ui-monospace,Consolas,monospace}

/* match */
.match-row{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.match-row:last-child{border-bottom:none}
.match-l{flex:1 1 240px;font-size:.92rem}
.match-row select{flex:1 1 200px;background:var(--bg-page);border:1px solid var(--border);border-radius:5px;
  color:var(--text-primary);padding:9px 10px;font-size:.88rem;min-height:44px}

/* order */
.ord-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.ord-item{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);
  border-radius:6px;padding:8px 11px}
.ord-pos{flex:0 0 30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:5px;
  background:var(--bg-page);border:1px solid var(--border);font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:.85rem}
.ord-t{flex:1}
.ord-btns{display:flex;gap:5px}
.ord-btns button{width:44px;height:44px;border-radius:5px;border:1px solid var(--border);background:var(--bg-page);
  color:var(--text-primary);cursor:pointer;font-size:1rem}
.ord-btns button:hover:not(:disabled){border-color:var(--accent-blue);color:var(--accent-blue)}

/* drag & drop */
.drag-zone{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:9px;border:1px dashed var(--border);
  border-radius:6px;background:var(--bg-page);margin-top:8px}
.drag-zone.over{border-color:var(--accent-green);box-shadow:inset 0 0 0 1px var(--accent-green)}
.chipd{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;
  font-size:.88rem;cursor:grab;color:var(--text-primary);min-height:44px;display:inline-flex;align-items:center;gap:7px}
.chipd.picked{border-color:var(--accent-green);box-shadow:0 0 0 1px var(--accent-green)}
.chipd .pick-mark{color:var(--accent-green);font-weight:700;font-size:.78rem}
.buckets{display:grid;gap:10px;margin-top:12px}
.bucket{border:1px solid var(--border);border-radius:6px;background:var(--bg-surface-2);padding:10px}
.bucket-h{font-size:.84rem;font-weight:700;color:var(--accent-blue);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.bucket .drag-zone{margin-top:0;min-height:64px}
.drag-hintline{font-size:.8rem;color:var(--text-secondary);margin-top:8px}

/* terminal */
.term{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.term-bar{display:flex;gap:6px;align-items:center;padding:7px 11px;border-bottom:1px solid var(--border);background:var(--bg-page)}
.term-dot{width:10px;height:10px;border-radius:50%;background:var(--border)}
.term-dot.r{background:var(--state-incorrect)}.term-dot.y{background:var(--state-partial)}.term-dot.g{background:var(--state-correct)}
.term-name{margin-left:6px;font-size:.76rem;color:var(--text-secondary);font-family:ui-monospace,Consolas,monospace}
.term-out{padding:10px 12px;max-height:220px;overflow:auto;font-size:.84rem;color:var(--text-mono);line-height:1.55}
.term-line{white-space:pre-wrap;word-break:break-word}
.term-line .p{color:var(--accent-green);font-weight:700}
.term-in-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--border)}
.term-pr{color:var(--accent-green);font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:.86rem;white-space:nowrap}
input.term-in{flex:1;background:transparent;border:none;color:var(--text-mono);font-size:.88rem;min-height:44px}
.per-timer{display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,Consolas,monospace;
  font-size:.8rem;color:var(--state-partial);border:1px solid var(--state-partial);border-radius:5px;padding:3px 9px}

/* decision tree */
.step-tag{display:inline-flex;align-items:center;gap:7px;background:rgba(90,169,255,.12);border:1px solid var(--accent-blue);
  color:var(--accent-blue);border-radius:5px;padding:4px 11px;font-size:.78rem;font-weight:700;letter-spacing:.05em;margin-bottom:8px}
.step-outcome{border-left:3px solid var(--accent-blue);background:var(--bg-surface-2);border-radius:4px;
  padding:8px 12px;margin:8px 0;font-size:.88rem;color:var(--text-primary)}
.step-outcome.ok{border-left-color:var(--state-correct)}
.step-outcome.bad{border-left-color:var(--state-incorrect)}
.done-steps{margin-bottom:6px}

/* feedback */
.fb{border:1px solid var(--border);border-radius:var(--r);margin:12px 0;overflow:hidden;background:var(--bg-surface);
  box-shadow:var(--shadow)}
.fb-h{display:flex;align-items:center;gap:10px;padding:11px 15px;font-weight:800;letter-spacing:.05em;font-size:.95rem;
  border-bottom:1px solid var(--border)}
.fb-h.ok{color:var(--state-correct);background:rgba(87,211,140,.08)}
.fb-h.part{color:var(--state-partial);background:rgba(255,180,84,.08)}
.fb-h.bad{color:var(--state-incorrect);background:rgba(255,107,107,.08)}
.fb-credit{font-family:ui-monospace,Consolas,monospace;font-size:.88rem;margin-left:auto;white-space:nowrap}
.fb-b{padding:13px 16px}
.fb-correct{background:var(--bg-surface-2);border:1px solid var(--border);border-left:3px solid var(--state-correct);
  border-radius:5px;padding:9px 12px;margin:8px 0;font-size:.9rem}
.fb-correct .mono{color:var(--text-mono)}
.items{margin:10px 0;display:flex;flex-direction:column;gap:6px}
.item-row{display:flex;gap:9px;align-items:flex-start;font-size:.88rem;padding:6px 9px;border-radius:5px;
  background:var(--bg-surface-2);border:1px solid var(--border)}
.item-ic{flex:0 0 auto;font-weight:700}
.item-row.ok .item-ic{color:var(--state-correct)}
.item-row.bad .item-ic{color:var(--state-incorrect)}
.item-row.miss .item-ic{color:var(--state-skipped)}
.fb-exp{color:var(--text-primary);font-size:.92rem;margin-top:8px}
.fb-study{color:var(--accent-amber);font-size:.88rem;margin-top:8px;border-left:3px solid var(--accent-amber);padding-left:10px}
.fb-persp{display:grid;gap:8px;margin-top:10px}
.persp{border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:.88rem;background:var(--bg-surface-2)}
.persp b{color:var(--accent-blue)}
.persp.d b{color:var(--accent-green)}
.fb-note{font-size:.8rem;color:var(--text-secondary);margin-top:9px}

/* review & results */
.rv-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.rv-row:last-child{border-bottom:none}
.rv-t{flex:1;min-width:200px}
.res-sum{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0}
.res-big{font-family:ui-monospace,Consolas,monospace;font-size:2rem;font-weight:800}
.res-pct{font-size:1.2rem;font-weight:700;color:var(--text-secondary)}
.verdict{border-radius:var(--r);border:1px solid;padding:16px 18px;margin:14px 0;font-size:1.05rem;font-weight:700}
.verdict.ok{color:var(--state-correct);border-color:var(--state-correct);background:rgba(87,211,140,.07)}
.verdict.bad{color:var(--state-incorrect);border-color:var(--state-incorrect);background:rgba(255,107,107,.07)}
.res-break{display:grid;gap:8px;margin:12px 0}
.res-row{display:flex;align-items:center;gap:10px;background:var(--bg-surface-2);border:1px solid var(--border);
  border-radius:6px;padding:9px 13px;font-size:.92rem}
.res-row b{margin-left:auto;font-family:ui-monospace,Consolas,monospace}
.pause-stats{font-size:.86rem;color:var(--text-secondary);margin-top:10px;display:grid;gap:4px}

/* overlay for manual pause */
.overlay{position:fixed;inset:0;background:rgba(5,8,18,.9);backdrop-filter:blur(5px);z-index:90;
  display:flex;align-items:center;justify-content:center;padding:20px}
.overlay-card{max-width:440px;width:100%;text-align:center;background:var(--bg-surface);border:1px solid var(--state-paused);
  border-radius:10px;padding:30px 26px;box-shadow:0 0 40px rgba(157,123,255,.25)}
.overlay-card .big{font-size:2.2rem;color:var(--state-paused);margin-bottom:8px}
.hidden{display:none!important}

/* misc */
.notice{border:1px solid var(--border);border-left:4px solid var(--accent-amber);background:var(--bg-surface-2);
  border-radius:5px;padding:9px 12px;font-size:.86rem;margin:10px 0;color:var(--text-primary)}
.tiny-note{font-size:.78rem;color:var(--text-secondary)}

@media (max-width:640px){
  .wrap{padding:14px 10px 50px}
  .blk-b{padding:12px}
  .topbar-in{padding:8px 10px;gap:6px}
  .tb-state{display:none}
  .buckets{grid-template-columns:1fr!important}
}

<script>
window.__EXAM__ = {"meta":{"topicId":"t1589.003","batch":2,"title":"T1589.003 Employee Names — MEDIUM","difficulty":"medium","sevWord":"MEDIUM","objId":"T1589.003","objName":"Employee Names","questionCount":16,"estimatedMinutes":40,"timerSeconds":2400,"passMark":70,"pageTitle":"T1589.003 — MEDIUM practice exam"},"intro":{"h1":"T1589.003 — MEDIUM practice exam","objType":"Sub-technique of T1589 — an ATT&CK 'how they do it' entry inside the Reconnaissance tactic","learnTitle":"What you will learn here","learn":["This exam takes you one level deeper into <b>T1589.003 — Employee Names<\/b>, a sub-technique of <b>T1589 Gather Victim Identity Information<\/b> in the <b>Reconnaissance<\/b> tactic. At EASY level you learned to recognise the object. Here you will learn to <i>combine<\/i> it with its neighbours: the channels the names come from, the stage the behaviour feeds, and the controls that respond.","The ATT&amp;CK description gives you the two ideas this file will keep connecting. First, names are used <b>to derive email addresses<\/b> and <b>craft more-believable lures<\/b> — so T1589.003 is upstream of <b>Phishing for Information (T1598)<\/b> and <b>Phishing (T1566)<\/b>. Second, the names are <b>readily available on social media and victim-owned websites<\/b> — so T1589.003 shares its sources with <b>Social Media (T1593.001)<\/b> and <b>Search Victim-Owned Websites (T1594)<\/b>.","In real work this object sits on several desks at once. A <b>CTI analyst<\/b> maps a report's sentence to the right ID without over-claiming. A <b>detection engineer<\/b> reads the linked detection strategy <b>DET0857 / analytic AN1989<\/b>, accepts that the collection itself is mostly invisible and noisy, and aims telemetry at the <b>Initial Access<\/b> stage instead. A <b>web administrator<\/b> knows the careers site <i>is<\/i> partially visible — scrapers hit server logs. A <b>GRC or privacy analyst<\/b> implements <b>M1056 Pre-compromise<\/b> as a minimisation programme, not a product.","You will also work with the three documented procedure examples — <b>Kimsuky (G0094)<\/b>, <b>Sandworm Team (G0034)<\/b> and <b>Silent Librarian (G0122)<\/b> — and practise what they teach: real actors collect employee names and lists while preparing campaigns. Expect two-step questions: identify the behaviour, then choose the correct mapping, control, or next action."],"themes":[{"name":"Mapping evidence to ATT&CK IDs","items":["T1589.003 — Employee Names","Parent: T1589","T1593.001 — Social Media","T1594 — Search Victim-Owned Websites","T1598 — Phishing for Information","T1566 — Phishing","T1586 — Compromise Accounts","T1078 — Valid Accounts"]},{"name":"Real procedure examples","items":["Kimsuky (G0094) — collected victim employee name information","Sandworm Team (G0034) — victim-org research included employee information","Silent Librarian (G0122) — collected lists of names from targeted organisations"]},{"name":"Telemetry & visibility","items":["AN1989 — high occurrence, high false positives","activity outside victim visibility","web access logs for victim-owned sites","scrapers vs real crawlers"]},{"name":"Detection strategy","items":["DET0857 — Detection of Employee Names","focus on Initial Access","personalised-greeting telemetry","tuning against generic spam"]},{"name":"Mitigation & control design","items":["M1056 — Pre-compromise","minimise external data","role-based addresses","preventive vs detective vs administrative controls"]},{"name":"Dual perspective","items":["red collection plan","blue exposure reduction","lure credibility vs staff awareness"]}],"how":["You need <b>70%<\/b> to pass. The score counts only exercises you answered with Check; skipped-and-never-answered exercises are excluded from both points and total.","This file has <b>16 exercises<\/b> of these types: multi-select, drag-and-drop buckets, matching, ordering and risk ranking, fill-in-the-blank, a log-triage panel with a filter box, branching decisions, and a few single-choice questions.","Most exercises combine <b>two ideas<\/b> — for example identify the behaviour, then pick the control. Multi-answer exercises are scored with <b>partial credit<\/b>: correct selections add, wrong selections subtract, using max(0, (H−W)/N).","The timer starts at <b>40:00<\/b>. Pressing <b>Check<\/b> stops the timer so you can study the feedback without pressure; the timer restarts when you press <b>Next<\/b>. The <b>Pause<\/b> button is a manual break that hides the exercise.","One <b>hint<\/b> per exercise costs 10% of that exercise's credit. <b>Skip<\/b> files an exercise into a review pool; before finishing you can return to skipped exercises until the timer ends."]},"exercises":[{"id":"M01","title":"Map the report, nothing more","type":"multi","summary":"Select only the mappings the paragraph actually supports","scen":[{"label":"CONTEXT","kind":"prose","body":"You are the CTI analyst on duty. A vendor report lands in your queue and you must tag it with ATT&CK IDs before the morning briefing. The rule in your team: tag only what the text proves, not what you assume happened next."},{"label":"ARTEFACT 1 — threat report excerpt","kind":"code","body":"\"In March the actor scraped 412 staff profiles from\nthe victim's own careers site, then built first.last@\naddresses and sent tailored phishing emails that greeted\neach recipient by name and job title.\""}],"q":"Select every ATT&CK mapping this paragraph directly supports.","opts":[{"t":"T1589.003 — the actor collected employee names","correct":true,"why":"412 staff profiles scraped from the careers site is exactly employee-name collection."},{"t":"T1594 — the actor searched a victim-owned website","correct":true,"why":"The careers site is the victim's own website, the named source of T1594."},{"t":"T1566 — the actor sent phishing messages for initial access","correct":true,"why":"Tailored phishing emails that push the recipient to act are Phishing (T1566)."},{"t":"T1589.001 — the actor harvested staff passwords","correct":false,"why":"No password or secret appears anywhere in the paragraph."},{"t":"T1078 — the actor used valid accounts to log in","correct":false,"why":"Using an account is never stated; the mails were sent, no login happened yet."},{"t":"T1595 — the actor scanned the victim's IP ranges","correct":false,"why":"There is no scanning in the text — a scraper reads pages, it does not sweep ports."}],"explain":"The paragraph proves three behaviours: names taken from the victim's own site, addresses derived, phishing sent. That maps to T1589.003, T1594 and T1566. The other three IDs are tempting because they are neighbours of this story — credentials, valid accounts and scanning — but the text never shows them. Over-tagging is the most common CTI mapping error, and your rule exists to stop it.","study":"Practise the two-pass method: list the behaviours you can quote, then map each to one ID.","hint":"For each option, ask: can I put my finger on the exact words in the artefact that prove it?"},{"id":"M02","title":"Visibility of the sources","type":"drag","summary":"Sort six name sources by what defenders could see","scen":[{"label":"CONTEXT","kind":"prose","body":"AN1989 says collection of employee names is largely invisible to defenders, with a very high false-positive rate. But 'largely' is not 'completely'. Your team is drawing a visibility map for the sources adversaries use when collecting staff names."},{"label":"ARTEFACT 1 — detection note AN1989 (excerpt)","kind":"code","body":"\"Much of this activity may have a very high occurrence and\nassociated false positive rate, as well as potentially taking\nplace outside the visibility of the target organization,\nmaking detection difficult for defenders.\""}],"q":"Drag each source into the bucket that matches your team's real visibility.","buckets":[{"id":"third","t":"Third-party platforms — invisible to us"},{"id":"own","t":"Victim-owned or victim-facing — partially visible"}],"chips":[{"id":"c1","t":"Browsing staff profiles on LinkedIn","b":"third","why":"LinkedIn is a third-party platform; the browsing never reaches your estate."},{"id":"c2","t":"Buying a staff list from a data broker","b":"third","why":"The transaction happens on the broker's platform — you see nothing."},{"id":"c3","t":"An industry-body conference site listing your speakers","b":"third","why":"The list lives on somebody else's website; you can request changes, not log visits."},{"id":"c4","t":"A script scraping your public careers site","b":"own","why":"The requests hit your web servers, so the visits appear in your access logs."},{"id":"c5","t":"Sign-ups on your own newsletter form harvesting names","b":"own","why":"The form is yours; the submissions land in your systems and logs."},{"id":"c6","t":"A 'recruiter' emailing HR to ask for the org chart","b":"own","why":"The email transits your mail gateway, which can capture and flag it."}],"explain":"The split is ownership: if the data lives on a platform you do not run, you cannot log the collection; if the request or message passes through your own web or mail systems, you at least have a chance to see it. This is why AN1989 still says 'much of this activity' is invisible — the biggest sources are third-party — and why it redirects detection effort toward stages that do touch your telemetry.","study":"Draw this map for your own organisation: list where staff names sit and mark each as 'theirs' or 'ours'.","hint":"Ask for each card: whose server handles this activity — theirs or ours?"},{"id":"M03","title":"Procedure examples to report tags","type":"match","summary":"Match each actor to its documented employee-name behaviour","scen":[{"label":"CONTEXT","kind":"prose","body":"Your CTI team keeps a one-line cheat sheet that pairs each documented actor with the exact procedure wording on the T1589.003 page, so junior analysts tag reports consistently. Rebuild the cheat sheet from the artefact."},{"label":"ARTEFACT 1 — ATT&CK procedure examples (T1589.003)","kind":"code","body":"G0094  Kimsuky          has collected victim employee\n                          name information\nG0034  Sandworm Team    research of potential victim\n                          organizations included the\n                          identification and collection of\n                          employee information\nG0122  Silent Librarian has collected lists of names for\n                          individuals from targeted\n                          organizations"}],"q":"Match each actor to its documented behaviour.","left":["Kimsuky (G0094)","Sandworm Team (G0034)","Silent Librarian (G0122)","T1594 (technique, not a group)"],"right":["collected victim employee name information","victim-org research included identification and collection of employee information","collected lists of names from targeted organizations","searching the victim's own websites where names sit exposed"],"correct":[0,1,2,3],"why":["Kimsuky's row is the short one: collected victim employee name information.","Sandworm's row frames name collection as part of victim-organisation research.","Silent Librarian's row mentions lists of names from targeted organisations.","The fourth row is not an actor at all — T1594 is the source technique for victim-owned websites."],"explain":"Procedure examples are the ATT&CK page's evidence table: each row ties a group to observed behaviour, worded precisely. Sandworm's wording shows employee-name collection as one part of broader victim research, Silent Librarian's shows bulk name lists, Kimsuky's is plain name collection. Keeping the wording with the actor stops teams from blending three different operational pictures into one.","study":"Re-read the Procedure Examples table and note how each description differs in scope.","hint":"One of the four left items is not a group — match it to the description that talks about websites, not actors."},{"id":"M04","title":"The full pre-access chain","type":"order","summary":"Order four stages from names to first access","scen":[{"label":"CONTEXT","kind":"prose","body":"A case retrospective describes how a phishing campaign against a logistics firm was built. The four stage cards below fell out of the folder. ATT&CK's own description of T1589.003 points forward to reconnaissance (T1593/T1598), establishing resources (T1586) and initial access (T1566, T1078) — use that logic to order the cards."}],"q":"Order the four stages from earliest to latest.","items":["Collect staff names from public sources (T1589.003)","Guide further recon: check which names hold risky roles (T1593 / T1598 groundwork)","Derive addresses and craft the personalised lure","Deliver the lure to gain first access (T1566)"],"why":["Names come first — T1589.003 is pre-compromise reconnaissance with no access needed.","The names then steer further recon: who is finance, who is IT, who answers to whom.","Only after targeting do addresses and lure text make sense.","Delivery is Initial Access — the first tactic that touches the victim's estate."],"explain":"The chain mirrors ATT&CK's lifecycle: Reconnaissance feeds Reconnaissance, then feeds Initial Access. T1589.003 is the first card because names cost nothing and unlock everything else. Jumping straight to delivery is what generic spam looks like; the personalised chain is what makes the lure land. When you read an incident backwards, this is the order you reconstruct.","persp":{"a":"For the attacker, each card is a cheap multiplier: a name becomes an address, an address becomes a credible sender target, and credibility becomes a click.","d":"For the defender, only the last card reliably touches your telemetry — which is exactly why AN1989 aims detection at Initial Access."},"study":"Re-read the third paragraph of the T1589.003 description and note every linked technique.","hint":"Two cards can only happen after names exist; one card can only happen inside the mail flow. Order by dependency."},{"id":"M05","title":"The 30-second briefing","type":"fill","summary":"Three blanks for the morning briefing slide","scen":[{"label":"ARTEFACT 1 — ATT&CK card for T1589.003","kind":"code","body":"ID:        T1589.003  Employee Names\nParent:    T1589      Gather Victim Identity Information\nTactic:    TA0043     (blank 1)\nPlatforms: (blank 2)\nDetection: DET0857 / AN1989 — mostly invisible; focus\n           detection on (blank 3)"}],"q":"Complete the briefing slide with the three missing values.","text":"T1589.003 sits in tactic {0}, runs on platform {1}, and because the collection is mostly invisible, AN1989 tells defenders to focus detection on {2}.","blanks":[{"accept":["reconnaissance","ta0043 reconnaissance"],"why":"TA0043 is the Reconnaissance tactic."},{"accept":["pre","pre (pre-compromise)","pre-compromise"],"why":"PRE marks pre-compromise techniques."},{"accept":["initial access"],"why":"AN1989: 'such as during Initial Access'."}],"bank":["Reconnaissance","PRE","Initial Access","TA0001"],"explain":"Three facts every consumer of your briefing needs: the tactic (Reconnaissance, TA0043), the platform marker (PRE — pre-compromise), and the detection guidance (focus Initial Access). TA0001 is the trap: it is the tactic ID of Initial Access itself, which is where detection goes, not where the technique lives.","study":"Memorise the pair TA0043 (Recon) / PRE, and the pointer to Initial Access.","hint":"The platform is three letters. The tactic is the one whose column holds T1589.003."},{"id":"M06","title":"Triage the careers-site log","type":"multi","summary":"Select the lines consistent with staff-page scraping","scen":[{"label":"CONTEXT","kind":"prose","body":"You are triaging last night's access log for the careers site of Meridian Logistics. Staff profiles live under /about/team. Genuine search-engine crawlers are allowed and expected. Select only the lines that fit automated staff-page scraping — the user-agent alone is not enough; look at what was fetched and how fast."},{"label":"ARTEFACT 1 — careers-site access log (filtered view)","kind":"log","body":[{"t":"09:02:11","src":"web","m":"GET /about/team 200 \"Mozilla/5.0 (compatible; Googlebot/2.1)\""},{"t":"09:02:12","src":"web","m":"GET /about/team 200 \"python-requests/2.31\""},{"t":"09:02:12","src":"web","m":"GET /about/team 200 \"python-requests/2.31\" ref=/about/team"},{"t":"09:02:13","src":"web","m":"GET /about/team?staff=all 200 \"python-requests/2.31\""},{"t":"09:05:40","src":"web","m":"GET /careers 200 \"Mozilla/5.0 (Windows NT 10.0; Win64) Firefox/126.0\""},{"t":"09:05:55","src":"web","m":"GET /careers/apply 200 \"Mozilla/5.0 (Windows NT 10.0; Win64) Firefox/126.0\""},{"t":"09:06:01","src":"web","m":"GET /wp-admin 404 \"python-requests/2.31\""},{"t":"09:06:02","src":"web","m":"GET /.env 404 \"python-requests/2.31\""}]}],"q":"Select every log line that fits automated scraping of the staff pages.","opts":[{"t":"Line 2, 3 and 4 — python-requests hitting /about/team within two seconds","correct":true,"why":"Same script UA, rapid repeats, team pages including a staff=all variant — classic scraping of names."},{"t":"Line 1 — the Googlebot request","correct":false,"why":"Declared search-engine crawler on a normal fetch; benign and expected, not your target."},{"t":"Line 5 and 6 — the Firefox visitor on /careers","correct":false,"why":"Human-pattern browsing: sparse timing and a natural click path to /apply."},{"t":"Line 7 and 8 — the 404 probes for /wp-admin and /.env","correct":false,"why":"Same UA as the scraper but a different job: opportunistic vulnerability probing, not name collection."}],"explain":"The decision needs two steps: identify automation (UA plus rate), then identify intent (target). Lines 2-4 are a script walking the team pages — that is staff-name collection touching your logs. Lines 7-8 share the UA but attack paths, not people, so they belong to a different story. Line 1 is a search engine doing its job; blocking it would hurt the business for no security gain.","study":"When triaging, pair 'how' (UA, rate) with 'what' (the URLs) before you call anything scraping.","hint":"Two python-requests lines here are NOT scraping staff pages — check the URL path of each line."},{"id":"M07","title":"The named invoice phish","type":"decision","summary":"Three-step triage of a personalised lure","scen":[{"label":"CONTEXT","kind":"prose","body":"09:40 — A finance employee forwards a message to the SOC. Text: 'Hi Sarah, as our new Payroll Director you'll want this invoice update — review it here before month-end.' The greeting uses Sarah's correct name and her exact new job title, which was announced internally only last week and is also on the company's public 'new hires' page."},{"label":"ARTEFACT 1 — message header summary","kind":"code","body":"From: billing@meridian-invoices[.]example  (new domain, first mail 09:38)\nTo:   sarah.oconnell@meridian-logistics[.]example\nSubj: Invoice update — action before month-end\nLink: hxxps://meridian-portal[.]example/login"}],"q":"Work the triage: answer all three steps in order.","steps":[{"q":"Step 1 — What most plausibly preceded this message?","opts":[{"t":"Employee-names recon (T1589.003) feeding address derivation and lure text","correct":true,"outcome":"Right: correct name, correct title, derived address — the exact outputs ATT&CK attributes to employee-name collection."},{"t":"A random, untargeted spam wave","correct":false,"outcome":"Random spam does not know names, titles, or last week's announcement."},{"t":"A leak of the payroll database (T1589.001)","correct":false,"outcome":"No credential or database material appears; public-page data explains everything observed."},{"t":"An insider reading the payroll system","correct":false,"outcome":"The insider theory adds assumptions the evidence does not need — public sources cover it."}]},{"q":"Step 2 — Which ATT&CK stage does the lure itself belong to?","opts":[{"t":"Initial Access (T1566)","correct":true,"outcome":"Correct: the mail pushes Sarah toward a login — that is Phishing for initial access."},{"t":"Reconnaissance (T1598 — phishing for information)","correct":false,"outcome":"Close, but nothing in the mail asks for information; it asks for a login. T1598 is when the phish itself harvests answers."},{"t":"Persistence (T1505)","correct":false,"outcome":"Persistence needs a foothold; the message is the first touch."},{"t":"Collection (T1114)","correct":false,"outcome":"Collection is post-compromise; this message is pre-compromise delivery."}]},{"q":"Step 3 — What is the best next SOC action?","opts":[{"t":"Pull all recipients of similar mails, block the domain and URL, and brief payroll on the pattern","correct":true,"outcome":"Correct: scope first, then block, then warn the targeted group — all reversible, evidence-safe steps."},{"t":"Wipe Sarah's mailbox immediately","correct":false,"outcome":"Destructive before scoping: you would delete evidence needed to find the other recipients."},{"t":"Ignore it — one mail is not a campaign","correct":false,"outcome":"The personalisation is the signal; one named lure is how campaigns start."},{"t":"Disable all staff accounts as a precaution","correct":false,"outcome":"Business-stopping and disproportionate; the mail was reported, not clicked yet."}]}],"explain":"Step 1: name, title and derived address point to employee-name recon — public pages alone explain the personalisation. Step 2: the lure demands a login, which is Initial Access (T1566), not information gathering (T1598). Step 3: scope, block, brief — reversible actions that preserve evidence. The exercise chains the two ideas this file teaches: the recon that built the lure, and the stage where the lure finally becomes visible.","study":"Practise separating T1566 (phish for access) from T1598 (phish for information) by what the message asks for.","hint":"The greeting tells you what happened before; the link tells you what stage the message itself is; triage order is scope, block, brief."},{"id":"M08","title":"Where the analytic lives","type":"qcm","summary":"Apply AN1989 to a detection-engineering plan","scen":[{"label":"CONTEXT","kind":"prose","body":"You are the detection engineer. A colleague proposes building an analytic that alerts whenever any external visitor opens the public staff page, citing T1589.003. You pull up the linked detection note before answering."},{"label":"ARTEFACT 1 — AN1989 (excerpt)","kind":"code","body":"\"...very high occurrence and associated false positive rate,\nas well as potentially taking place outside the visibility of\nthe target organization... Detection efforts may be focused\non related stages of the adversary lifecycle, such as during\nInitial Access.\""}],"q":"Following AN1989, where should your detection effort go?","opts":[{"t":"Related stages that touch our telemetry, such as Initial Access","correct":true,"why":"AN1989 says it directly: focus detection on related lifecycle stages like Initial Access."},{"t":"Alerting on every visit to the public staff page","correct":false,"why":"That is the colleague's idea — AN1989 warns such an analytic is high-volume and high-false-positive."},{"t":"Blocking all traffic from cloud-hosted sources","correct":false,"why":"Indiscriminate blocking breaks crawlers, partners and staff, and still misses third-party collection."},{"t":"Watching for staff-name searches inside the network","correct":false,"why":"The collection happens outside; internal search monitoring answers a different question."}],"explain":"Two steps: read the analytic (high noise, mostly invisible), then apply it (aim where evidence exists). Initial Access — for example a wave of personalised mails — is the first point where the adversary's preparation touches systems you control, so that is where the analytic effort pays off. The colleague's proposal fails on the false-positive profile AN1989 explicitly warns about.","study":"Turn AN1989's two sentences into two detection-planning rules and keep them on your desk.","hint":"The artefact's last sentence is the answer; the first sentences explain why the tempting option is wrong."},{"id":"M09","title":"Rank the exposures","type":"order","summary":"Rank four public exposures by usefulness to a name collector","scen":[{"label":"CONTEXT","kind":"prose","body":"Your attack-surface review found four public exposures, all live today. The GRC lead asks you to rank them by how useful each would be to an adversary doing exactly T1589.003 — collecting employee names for targeting. Most useful goes first."}],"q":"Rank the four exposures from most to least useful for employee-name collection.","items":["Staff page with full names, roles and photos","Last year's conference attendee list with names and employers","Press release quoting two named employees","Partner logos page with no staff names"],"why":["Names plus roles plus photos in one place — the richest single source for both names and lure detail.","Names with employers still tie people to your firm, but roles and currency are weaker.","Only two names, and both chose to be quoted — a thin slice with context.","No people at all — useless for T1589.003 by definition."],"explain":"Ranking exposures is a two-step judgement: how many names, and how much context per name. The staff page wins because it bundles names with roles and faces — everything a lure needs. The attendee list is broader but stale and roleless. The press release gives depth on two people only. The logos page has no identity data, so for this technique it ranks last no matter how pretty it looks.","persp":{"a":"An adversary works the same list top-down and stops when the marginal gain gets small.","d":"A defender fixes the same list top-down: the staff page is the M1056 work with the best return."},"study":"In your own exposure review, score each source on: number of names, role detail, freshness.","hint":"Ask two questions per item: how many names, and how much does each name come with?"},{"id":"M10","title":"Channel or goal?","type":"match","summary":"Separate the collection channels from the collection goal","scen":[{"label":"CONTEXT","kind":"prose","body":"A junior analyst keeps tagging every step of a recon story as 'T1589.003'. Your coaching rule: the channel is WHERE the names came from, the goal is WHAT was collected. The four actions below come from one incident timeline — tag each with the ID that fits best."}],"q":"Match each action to the technique that fits it best.","left":["Browsing the victim's LinkedIn company page for engineers","Reading the victim's own staff directory page","Mailing HR while posing as a recruiter to obtain the org chart","Collecting the staff names found on that directory"],"right":["T1593.001 — Social Media","T1594 — Search Victim-Owned Websites","T1598 — Phishing for Information","T1589.003 — Employee Names"],"correct":[0,1,2,3],"why":["LinkedIn is social media — the channel technique for social platforms is T1593.001.","The directory lives on the victim's own website — that is T1594.","Pretending to be a recruiter to extract data is phishing aimed at information — T1598.","The goal itself — holding employee names — is T1589.003, whatever the channel was."],"explain":"ATT&CK splits the story neatly: T1593.001, T1594 and T1598 describe where or how the adversary looked, and T1589.003 describes what the adversary ended up with — the names themselves. A timeline can legitimately carry both kinds of tags, one per row. Tagging every row as T1589.003 erases exactly the distinction your coaching rule is about.","study":"For any recon artefact, tag the channel once and the collected data once.","hint":"Three options describe a place or a trick; one option describes the thing that was collected."},{"id":"M11","title":"True or false: detection edition","type":"drag","summary":"Sort four statements into correct and incorrect","scen":[{"label":"CONTEXT","kind":"prose","body":"During a brown-bag session about T1589.003, four statements are written on the whiteboard. The session ends with a sorting exercise: which statements match the ATT&CK page, and which are myths?"}],"q":"Drag each statement to the correct bucket.","buckets":[{"id":"ok","t":"Matches the ATT&CK page"},{"id":"myth","t":"Myth — does not match"}],"chips":[{"id":"c1","t":"MFA helps after a lure works, but it does not stop the collection of names","b":"ok","why":"MFA acts on logins — the collection happened earlier, outside the estate; the statement matches M1056's logic."},{"id":"c2","t":"PRE means the technique runs before any compromise","b":"ok","why":"That is exactly what the PRE platform marker means."},{"id":"c3","t":"EDR process logs are the primary detection for the collection itself","b":"myth","why":"AN1989 says the activity mostly happens outside victim visibility — there are no processes to log."},{"id":"c4","t":"Names are only useful for spam, not targeted attacks","b":"myth","why":"The description says names guide recon and make lures believable — the essence of targeted attacks."}],"explain":"Two statements rest on the page's core logic: MFA operates at login, while name collection is pre-compromise (hence PRE); and the description explicitly ties names to targeted lures. The two myths fail in opposite directions — one invents endpoint telemetry for an activity that never touches an endpoint, the other shrinks a targeting tool down to spam. Both myths are common in real team discussions, which is why the whiteboard drill exists.","study":"Pair every claim about this technique with either M1056, AN1989, or the PRE marker.","hint":"For each card ask: where does this happen — on our endpoints, or out on the open internet?"},{"id":"M12","title":"Red plan, blue answer","type":"match","summary":"Pair each red-team step with the blue-team counterpart","scen":[{"label":"CONTEXT","kind":"prose","body":"A purple-team workshop uses one scenario from both sides. The red team is authorised to test Meridian Logistics with a personalised phish. The blue team lists what it would do about each red step. Your job: pair the red steps with the blue responses so the workshop slide is complete."}],"q":"Match each red-team step to its blue-team counterpart.","left":["RED: collect names from the victim's public pages","RED: derive first.last@ addresses from the names","RED: greet recipients by name and title in the lure"],"right":["BLUE: trim the public staff page — it is the free source (M1056 work)","BLUE: publish role-based addresses instead of named ones where possible","BLUE: train staff that correct-name mail is not proof of trust; tune the gateway on greeting patterns"],"correct":[0,1,2],"why":["If the page is the source, shrinking the page attacks the source.","If the address pattern is guessable, breaking the pattern breaks the derivation.","If credibility comes from the greeting, awareness and gateway logic must stop rewarding the greeting."],"explain":"Read as a whole, the slide teaches the two perspectives of T1589.003 in one glance. The attacker's chain is names, addresses, greeting — each step cheap and silent. The defender's answer attacks the same chain at its input: less public data, less guessable addresses, less automatic trust in a correct greeting. Notice that only the last blue card is detection; the first two are minimisation, exactly as M1056 prescribes.","persp":{"a":"The red chain needs no exploit, no malware and no touch on the estate — only patience and public pages.","d":"The blue answer cannot prevent the looking, but it can starve the looking of material and blunt the lure's credibility."},"study":"For any technique you teach, build the red chain first, then attack each link on the input side.","hint":"Each blue card should answer the same link of the chain as its red card — match the links, not the words."},{"id":"M13","title":"Classify the control","type":"qcm","summary":"What kind of control is M1056 in practice","scen":[{"label":"CONTEXT","kind":"prose","body":"You are the GRC analyst writing a control memo. A reviewer asks: 'If we accept M1056 Pre-compromise as our control for T1589.003, what exactly are we buying — a firewall rule, a product, or something else?' You re-read the mitigation text before answering."},{"label":"ARTEFACT 1 — M1056 (excerpt)","kind":"code","body":"\"...cannot be easily mitigated with preventive controls...\nEfforts should focus on minimizing the amount and\nsensitivity of data available to external parties.\""}],"q":"Which sentence about M1056 belongs in your memo?","opts":[{"t":"A minimisation strategy delivered by policy and site changes, not by a single box","correct":true,"why":"M1056 prescribes reducing external data — implemented through web policy, staff guidance and content reviews."},{"t":"A perimeter rule that blocks scrapers by IP address","correct":false,"why":"Scrapers rotate, sources are third-party platforms, and the mitigation text points elsewhere."},{"t":"An EDR profile that blocks name-scraping processes","correct":false,"why":"The collection runs on other people's machines; no endpoint process exists to block."},{"t":"A SIEM rule that alerts on public staff-page visits","correct":false,"why":"That would be a detection, and AN1989 warns it is high-noise; M1056 is about the data, not the visits."}],"explain":"M1056 is not a product you deploy — it is a direction: shrink the pool of staff data that strangers can read. In practice that means policy (what we publish), site changes (trim the org chart, role-based addresses) and staff guidance (what individuals post). Classifying it correctly in the memo prevents the classic mistake of buying a tool and calling the technique mitigated.","study":"Write one line for your memo: what M1056 is, what implements it, and what it explicitly is not.","hint":"The artefact names the effort (minimise external data). Which of the options is that effort?"},{"id":"M14","title":"Name the two ideas","type":"fill","summary":"Two blanks: derivation and personalisation","scen":[{"label":"ARTEFACT 1 — staff names found public","kind":"code","body":"Priya Nair   — Finance Director\nTom Becker   — IT Support"}],"q":"Complete the sentence with the two concepts.","text":"Turning 'Priya Nair' into a working mailbox is address {0}; writing a lure that quotes her real title is lure {1} — and both are exactly what ATT&CK says employee names are for.","blanks":[{"accept":["derivation","address derivation"],"why":"Deriving addresses from names is the first documented use."},{"accept":["personalisation","personalization","personalised","personalized"],"why":"The believable lure is a personalised lure — the second documented use."}],"bank":["derivation","personalisation","encryption","validation"],"explain":"The ATT&CK description uses both ideas: names are used to derive email addresses, and to craft more-believable lures — personalisation. 'Encryption' and 'validation' belong to other worlds entirely. If you can name these two ideas quickly, you can also spot them in incident reviews: any lure that greets by name is downstream evidence of both.","study":"Attach the two verbs to T1589.003: derive and personalise.","hint":"First blank: making an address FROM a name. Second blank: making a lure FEEL personal."},{"id":"M15","title":"The 08:50 alert queue","type":"decision","summary":"Pick the signal, then the first action","scen":[{"label":"CONTEXT","kind":"prose","body":"You inherit the morning queue. Three alerts are pending, and one intern asks which one actually matters for the T1589.003 story the team has been hunting — collection of staff names followed by targeted approach."},{"label":"ARTEFACT 1 — alert queue (08:50)","kind":"code","body":"A1  mail  newsletter to 'all-staff', generic text,\n         external sender, no personalisation\nA2  mail  sent to 3 payroll staff; correct names and\n         job titles in body; sender domain registered 2 days ago\nA3  web   internal staff browser opened the public\n         careers page of our own site"}],"q":"Answer both triage steps.","steps":[{"q":"Step 1 — Which alert most suggests employee-name recon followed by a targeted approach?","opts":[{"t":"A2 — three named payroll staff, correct titles, fresh sender domain","correct":true,"outcome":"Correct: names plus titles plus a new domain is the personalised pattern the hunt was for."},{"t":"A1 — the generic newsletter","correct":false,"outcome":"No names, no targeting — that is the noise AN1989 warns about."},{"t":"A3 — the staff browser visit","correct":false,"outcome":"An internal visit to our own page is routine; the adversary is external."},{"t":"None of them","correct":false,"outcome":"A2 is a textbook personalised lure — dismissing it repeats the false-negative the team feared."}]},{"q":"Step 2 — What is the first action on the alert you picked?","opts":[{"t":"Retrieve the full message and check who else received a similar one","correct":true,"outcome":"Correct: scope the campaign first — every later step depends on knowing the size."},{"t":"Reply to the sender asking who they are","correct":false,"outcome":"Never engage the sender; it confirms a live address and burns the trail."},{"t":"Delete the message from all mailboxes at once","correct":false,"outcome":"Deletion destroys per-recipient evidence before scoping is done."},{"t":"Escalate to the CISO and stop working the queue","correct":false,"outcome":"Escalation may come, but scoping is your job first — an unscoped escalation wastes the hour."}]}],"explain":"Step 1: A2 carries the signature — correct names and titles against a freshly registered domain; A1 is the generic noise AN1989 predicts, and A3 is an internal visit. Step 2: scoping comes first because every other action (block, purge, brief) needs the recipient list, and premature deletion destroys the very evidence scoping needs. This is the Initial Access stage doing the talking for an invisible recon stage.","study":"Drill the triage order: scope, preserve, act — never engage the sender.","hint":"One alert has names in it; one alert has nobody in it. Then remember what must survive your first action: the evidence."},{"id":"M16","title":"Build the M1056 plan","type":"drag","summary":"Sort six controls: reduces exposure vs different job","scen":[{"label":"CONTEXT","kind":"prose","body":"Your security committee collected six proposed actions after a briefing on T1589.003 and M1056. Before the budget vote, sort them: which actions actually reduce the staff data available to external parties (the M1056 work), and which are good security but a different job?"}],"q":"Drag each action into the correct bucket.","buckets":[{"id":"m1056","t":"Reduces external staff data (M1056 work)"},{"id":"other","t":"Good control, different job"}],"chips":[{"id":"c1","t":"Replace named contacts on public pages with role-based ones","b":"m1056","why":"Fewer named staff outside directly shrinks the collection pool."},{"id":"c2","t":"Remove names and photos from the public org chart","b":"m1056","why":"Same logic: less identity data available to strangers."},{"id":"c3","t":"Privacy training on what staff post publicly","b":"m1056","why":"Staff posts are a major source; guidance reduces future external data."},{"id":"c4","t":"Enforce MFA on remote access","b":"other","why":"Valuable, but it acts at login — after any lure works, not on the data pool."},{"id":"c5","t":"Deploy DMARC/DKIM/SPF on our domains","b":"other","why":"It stops spoofing of our domain in lures; it does not reduce the published names."},{"id":"c6","t":"Deploy EDR on all endpoints","b":"other","why":"Endpoint telemetry has no view of the pre-compromise collection at all."}],"explain":"M1056's test is simple: does this action shrink what strangers can read about our staff? Three actions pass it — role-based contacts, a trimmed org chart, and privacy guidance. The other three are worth their budget, but each answers a different attack step: MFA answers the login, DMARC answers spoofing, EDR answers post-compromise execution. Presenting the plan in these two buckets keeps the M1056 money honest.","study":"In budget meetings, run the M1056 test out loud: 'does this shrink the external data pool?'","hint":"Two buckets, one question: does the action change what a stranger can read about our staff today?"}]};
</script>
<script>

(function(){
'use strict';
var D = window.__EXAM__;
var $ = function(s,r){return (r||document).querySelector(s);};
var EL = document.createElement('div');

function esc(s){ EL.textContent = String(s==null?'':s); return EL.innerHTML; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function fmtT(sec){ sec=Math.max(0,Math.round(sec)); var m=Math.floor(sec/60),s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function scoreExercise(h,w,n){ if(n<=0){return 0;} return Math.max(0,(h-w)/n); }
function normalize(s){ return String(s||'').toLowerCase().replace(/[.,;:!?"'`()\[\]]/g,' ').replace(/\s+/g,' ').trim(); }

/* ---------------- app state ---------------- */
var S = {
  view:'intro', order:[], idx:0,
  checked:{}, skipped:{}, credit:{}, rows:{}, canonical:{}, dangerous:{},
  hintUsed:{}, inReview:false,
  timer:{ state:'IDLE', remaining:0, per:{ active:false, rem:0 } },
  acc:{ manual:0, auto:0 }, sinceManual:null, sinceAuto:null,
  reported:false, user:null
};
var widget = null; /* current exercise widget controller */

/* ---------------- topbar ---------------- */
function sevClass(){ return {easy:'b-easy',medium:'b-medium',hard:'b-hard','extremely-hard':'b-extreme'}[D.meta.difficulty]; }
function topbarHTML(){
  return '<div class="topbar-in">'
   +'<span class="tb-count" id="tb-count"></span>'
   +'<span class="badge '+sevClass()+'"><span class="dot"></span>'+esc(D.meta.sevWord)+'</span>'
   +'<span class="tb-timer" id="tb-timer" aria-label="exam timer">--:--</span>'
   +'<span class="tb-state" id="tb-state"></span>'
   +'<span class="tb-spacer"></span>'
   +'<span class="tb-user" id="tb-user"></span>'
   +'<span class="tb-score" id="tb-score" aria-label="live score"></span>'
   +'<button class="btn btn-ghost" id="bt-hint" title="Reveal one hint (costs 10 percent of this exercise credit)">\u25C9 Hint</button>'
   +'<button class="btn btn-ghost" id="bt-pause" title="Manual pause: hides the exercise and stops the timer">\u23F8 Pause</button>'
   +'<button class="btn btn-ghost" id="bt-skip" title="Skip: move this exercise to the skipped pool">\u26A0 Skip</button>'
   +'</div><div class="pbar"><div class="pbar-in" id="pbar-in"></div></div>';
}
function renderUser(){
  var el = $('#tb-user'); if(!el){return;}
  if(S.user && S.user.username){ el.textContent = 'Analyst: '+S.user.username+(S.user.country && S.user.country!=='ZZ' ? ' ('+S.user.country+')' : ''); }
}
function updateTopbar(){
  var ex = curEx();
  $('#tb-count').textContent = S.view==='exam' ? ('Exercise '+(S.order.indexOf(S.idx)+1)+' of '+S.order.length) : '';
  var t = $('#tb-timer'); var st = $('#tb-state');
  t.textContent = fmtT(S.timer.remaining);
  var btp = $('#bt-pause');
  if(S.timer.state==='RUNNING'){ t.style.color='var(--state-correct)'; st.textContent='\u25B6 RUNNING'; st.style.color='var(--state-correct)'; btp.disabled=false; }
  else if(S.timer.state==='PAUSED_MANUAL'){ t.style.color='var(--state-paused)'; st.textContent='\u23F8 PAUSED \u2014 manual (press Resume)'; st.style.color='var(--state-paused)'; }
  else if(S.timer.state==='PAUSED_AUTO_CHECK'){ t.style.color='var(--state-paused)'; st.textContent='\u23F8 PAUSED \u2014 reviewing feedback (resumes on Next)'; st.style.color='var(--state-paused)'; }
  else if(S.timer.state==='ENDED'){ t.style.color='var(--state-skipped)'; st.textContent='\u25A0 ENDED'; st.style.color='var(--state-skipped)'; }
  else { st.textContent=''; }
  var sum=0, cnt=0;
  for(var k in S.credit){ sum+=S.credit[k]; cnt++; }
  var sc=$('#tb-score');
  if(cnt>0){ var pct=Math.round((sum/cnt)*100); sc.innerHTML='<b>'+sum.toFixed(1)+'</b> / '+cnt+' <span class="pct">\u00B7 '+pct+'%</span>'; }
  else { sc.innerHTML='<b>0.0</b> / 0 <span class="pct">\u00B7 start answering</span>'; }
  var p = S.view==='exam' ? ((S.order.indexOf(S.idx)+1)/S.order.length*100) : (S.view==='results'?100:0);
  $('#pbar-in').style.width = p+'%';
  document.body.setAttribute('data-exact-score', String(sum));
  renderUser();
}

/* ---------------- timer ---------------- */
var lastTick = null;
setInterval(function(){
  var now = Date.now();
  if(lastTick===null){ lastTick=now; return; }
  var dt = now-lastTick; lastTick=now;
  if(S.timer.state==='RUNNING'){
    S.timer.remaining -= dt/1000;
    if(S.timer.per.active){ S.timer.per.rem -= dt/1000;
      var pe=$('#per-timer-v'); if(pe){ pe.textContent = fmtT(S.timer.per.rem);
        if(S.timer.per.rem<=30){ pe.style.color='var(--state-incorrect)'; } }
      if(S.timer.per.rem<=0){ S.timer.per.active=false; if(widget&&widget.autoSubmit){ widget.autoSubmit(); } }
    }
    if(S.timer.remaining<=0){ S.timer.remaining=0; S.timer.state='ENDED'; endExam('timeout'); }
    if(S.view==='exam'||S.view==='review'){ updateTopbar(); }
  }
},250);
function setTimerState(st){
  if(st==='PAUSED_MANUAL'){ S.sinceManual=Date.now(); }
  if(st==='RUNNING'){ if(S.sinceManual){ S.acc.manual+=(Date.now()-S.sinceManual)/1000; S.sinceManual=null; } }
  if(st==='PAUSED_AUTO_CHECK'){ if(!S.sinceAuto){ S.sinceAuto=Date.now(); } }
}
function leaveAuto(){ if(S.sinceAuto){ S.acc.auto+=(Date.now()-S.sinceAuto)/1000; S.sinceAuto=null; } }

/* manual pause (can also be pressed on top of the Check auto-pause) */
function togglePause(){
  var t=S.timer;
  if(t.state==='RUNNING'||t.state==='PAUSED_AUTO_CHECK'){
    if(t.state==='PAUSED_AUTO_CHECK'){
      S.pendingAuto=true;
      if(S.sinceAuto){ S.acc.auto+=(Date.now()-S.sinceAuto)/1000; S.sinceAuto=null; }
    }
    t.state='PAUSED_MANUAL'; S.sinceManual=Date.now(); showPauseOverlay();
  }
  else if(t.state==='PAUSED_MANUAL'){
    hidePauseOverlay();
    if(S.sinceManual){ S.acc.manual+=(Date.now()-S.sinceManual)/1000; S.sinceManual=null; }
    if(S.pendingAuto){ t.state='PAUSED_AUTO_CHECK'; if(!S.sinceAuto){ S.sinceAuto=Date.now(); } }
    else { t.state='RUNNING'; }
  }
  updateTopbar();
}
function showPauseOverlay(){
  var o=document.createElement('div'); o.className='overlay'; o.id='pause-overlay';
  o.innerHTML='<div class="overlay-card"><div class="big">\u23F8</div><h2>PAUSED \u2014 manual break</h2>'
   +'<p>The timer is stopped and the exercise is hidden. Press Resume when you are ready to continue.</p>'
   +'<button class="btn btn-primary btn-lg" id="bt-resume">Resume exam</button></div>';
  document.body.appendChild(o);
  $('#bt-resume').addEventListener('click', togglePause);
}
function hidePauseOverlay(){ var o=$('#pause-overlay'); if(o){ o.remove(); } }

/* ---------------- views ---------------- */
function show(id){ ['view-intro','view-exam','view-review','view-results'].forEach(function(v){ var el=$('#'+v); if(el){ el.classList.add('hidden'); } }); $('#'+id).classList.remove('hidden'); window.scrollTo(0,0); }

function renderIntro(){
  var I=D.intro, m=D.meta;
  var h='<div class="intro-head"><h1>'+esc(I.h1)+'</h1>'
   +'<p class="small">'+esc(m.objId+' \u2014 '+m.objName)+' \u00B7 '+esc(I.objType)+'</p>'
   +'<div class="factrow">'
   +'<span class="badge '+sevClass()+'"><span class="dot"></span>'+esc(m.sevWord)+'</span>'
   +'<span class="fact"><b>'+D.exercises.length+'</b> exercises</span>'
   +'<span class="fact">estimated <b>'+m.estimatedMinutes+' min</b> \u00B7 timer budget <b>'+fmtT(m.timerSeconds)+'</b></span>'
   +'<span class="fact">pass mark <b>'+m.passMark+'%</b></span>'
   +'</div></div>';
  h+='<div class="panel"><h2>'+esc(I.learnTitle)+'</h2>'+I.learn.map(function(p){return '<p>'+p+'</p>';}).join('')+'</div>';
  h+='<div class="panel"><h2>Keywords covered in this exam</h2>';
  I.themes.forEach(function(t){ h+='<div class="kw-theme"><h3>'+esc(t.name)+'</h3><div class="kw-list">'
    +t.items.map(function(x){return '<span class="kw">'+esc(x)+'</span>';}).join('')+'</div></div>'; });
  h+='</div>';
  h+='<div class="panel"><h2>How this exam works</h2><ul class="rules">';
  I.how.forEach(function(r){ h+='<li>'+r+'</li>'; });
  h+='</ul><div class="btn-row"><button class="btn btn-primary btn-lg" id="bt-start">\u25B6 Start the exam</button></div></div>';
  $('#view-intro').innerHTML=h;
  $('#bt-start').addEventListener('click', startExam);
}

/* ---------------- exam flow ---------------- */
function startExam(){
  S.order = shuffle(D.exercises.map(function(e,i){return i;}));
  S.idx = S.order[0]; S.checked={}; S.skipped={}; S.credit={}; S.rows={}; S.canonical={}; S.dangerous={};
  S.hintUsed={}; S.inReview=false; S.pendingAuto=false; S.reported=false; S.postedNow=false;
  S.acc={manual:0,auto:0}; S.sinceManual=null; S.sinceAuto=null;
  S.timer.remaining=D.meta.timerSeconds; S.timer.per={active:false,rem:0};
  S.timer.state='RUNNING';
  S.view='exam'; S.inReview=false; S.pendingReview=false;
  show('view-exam'); renderExercise(S.idx); updateTopbar();
}
function curEx(){ return D.exercises[S.idx]; }
function posOf(i){ return S.order.indexOf(i); }
function nextUnchecked(from){
  var start=(from===undefined? posOf(S.idx)+1 : from);
  for(var p=start;p<S.order.length;p++){ var i=S.order[p]; if(!S.checked[i]&&!S.skipped[i]){ return i; } }
  return -1;
}
function hasSkips(){ for(var k in S.skipped){ if(!S.checked[k]){ return true; } } return false; }

function renderExercise(i){
  S.idx=i; S.inReview=!!S.pendingReview; var ex=D.exercises[i];
  var inRev=S.inReview;
  var h='<div class="ex-head"><span class="tb-count">Exercise '+(posOf(i)+1)+' of '+S.order.length+'</span>'
   +'<span class="ex-title">'+esc(ex.title)+'</span>'
   +(inRev?'<span class="chip skip">\u26A0 Skipped \u2014 review mode</span>':'')+'</div>';
  /* SCENARIO */
  h+='<div class="blk blk-scenario" id="blk-scen"><div class="blk-h"><span class="ic">\u25A4</span> SCENARIO'
   +'<span class="tag">'+esc(ex.summary)+'</span>'
   +'<button class="collapse-btn" id="bt-collapse" aria-expanded="true">collapse</button></div><div class="blk-b">';
  ex.scen.forEach(function(a,idx){
    if(a.kind==='code'){ h+='<div class="artefact"><p class="sub-label">'+esc(a.label)+'</p><pre class="code">'+hlCode(a.body)+'</pre></div>'; }
    else if(a.kind==='log'){ h+='<div class="artefact"><p class="sub-label">'+esc(a.label)+'</p>'+logViewer(a.body)+'</div>'; }
    else { h+='<div class="artefact"><p class="sub-label">'+esc(a.label||('CONTEXT '+(idx+1)))+'</p>'+a.body.split('\n\n').map(function(p){return '<p class="scen-p">'+esc(p)+'</p>';}).join('')+'</div>'; }
  });
  h+='</div><div class="collapsum">'+esc(ex.summary)+'</div></div>';
  /* QUESTION */
  h+='<div class="blk blk-question"><div class="blk-h"><span class="ic">?</span> QUESTION'
   +(ex.perTimer?'<span class="tag per-timer" style="margin-left:auto">\u23F1 <span id="per-timer-v">'+fmtT(ex.perTimer)+'</span> exercise timer</span>':'')
   +'</div><div class="blk-b"><p class="q-text">'+esc(ex.q)+'</p>'
   +(ex.perTimer?'<p class="tiny-note">This exercise has its own reduced timer. It stops and starts together with the main timer. If it runs out, your current input is submitted automatically.</p>':'')
   +'</div></div>';
  /* YOUR ANSWER */
  h+='<div class="blk blk-answer"><div class="blk-h"><span class="ic">\u270E</span> YOUR ANSWER</div><div class="blk-b" id="ans-slot"></div></div>';
  /* actions */
  h+='<div class="btn-row" id="action-row">'
   +'<button class="btn btn-primary" id="bt-check" disabled>\u2713 Check answer</button>'
   +'<button class="btn btn-ghost" id="bt-next" disabled>'+(inRev?'\u2190 Back to review':'Next exercise')+'</button>'
   +'<span class="tb-spacer"></span>'
   +(inRev?'':'<button class="btn btn-ghost" id="bt-skip2">\u26A0 Skip this exercise</button>')
   +'</div>';
  $('#exam-body').innerHTML=h;
  $('#bt-collapse').addEventListener('click', function(){ var b=$('#blk-scen'); b.classList.toggle('collapsed');
    this.setAttribute('aria-expanded', b.classList.contains('collapsed')?'false':'true');
    this.textContent = b.classList.contains('collapsed') ? 'show' : 'hide'; });
  if($('#bt-skip2')){ $('#bt-skip2').addEventListener('click', doSkip); }
  var checkBt=$('#bt-check'), nextBt=$('#bt-next');
  checkBt.addEventListener('click', function(){ onCheck(ex,i); });
  nextBt.addEventListener('click', function(){ onNext(ex,i); });
  widget = buildWidget(ex, $('#ans-slot'), function(){ checkBt.disabled=false; });
  if(ex.perTimer){ S.timer.per={active:true, rem:ex.perTimer}; }
  if(S.hintUsed[i]){ showHint(ex); }
  var pb=$('#bt-pause'); pb.disabled = false;
  updateTopbar();
}

function useHint(ex,i){
  if(S.hintUsed[i]||S.checked[i]){ return; }
  S.hintUsed[i]=true; showHint(ex); updateTopbar();
}
function showHint(ex){
  var slot=$('#ans-slot'); if(!slot){ return; }
  var old=$('#hint-panel'); if(old){ old.remove(); }
  var d=document.createElement('div');
  d.className='notice'; d.id='hint-panel'; d.setAttribute('role','note');
  d.innerHTML='<b>\u25C9 Hint (this hint costs \u221210% of this exercise credit):</b> '+esc(ex.hint);
  slot.parentNode.insertBefore(d, slot);
}

function doSkip(){
  if(S.checked[S.idx]){ return; }
  S.skipped[S.idx]=true;
  var n=nextUnchecked();
  if(n>=0){ renderExercise(n); }
  else { showReview(); }
  updateTopbar();
}

/* ---------------- grading ---------------- */
function onCheck(ex,i){
  if(S.checked[i]){ return; }
  if(widget.preCheck){
    var pre=widget.preCheck();
    if(pre==='advance'||pre==='block'){ return; } /* decision intermediate step: timer keeps running, no auto-pause */
  }
  var r = widget.read();
  if(r===null){ return; } /* not ready */
  var credit = scoreExercise(r.h, r.w, r.n);
  if(S.hintUsed[i]){ credit=Math.max(0,credit-0.10); }
  S.credit[i]=credit; S.rows[i]=r.rows; S.canonical[i]=r.correctHtml||''; S.dangerous[i]=!!r.dangerous;
  S.checked[i]=true; S.pendingAuto=true;
  delete S.skipped[i];
  S.timer.state='PAUSED_AUTO_CHECK'; setTimerState('PAUSED_AUTO_CHECK');
  renderFeedback(ex,i,r,credit);
  updateTopbar();
}
function labelFor(credit,r){
  var h=r.h||0, n=r.n||0, w=r.w||0;
  if(n>0&&h>=n&&w===0){ return {cls:'ok',ic:'\u2713',word:'CORRECT'}; }
  if(h>0){ return {cls:'part',ic:'\u2713',word:'PARTIALLY CORRECT'}; }
  return {cls:'bad',ic:'\u2717',word:'INCORRECT'};
}
function renderFeedback(ex,i,r,credit){
  var L=labelFor(credit,r);
  var fb='<div class="fb"><div class="fb-h '+L.cls+'"><span>'+L.ic+'</span> '+L.word
   +'<span class="fb-credit">credit '+credit.toFixed(2)+' \u2014 '+Math.round(credit*r.n)+'/'+r.n+' items</span>'
   +'</div><div class="fb-b">';
  if(S.hintUsed[i]){ fb+='<p class="fb-note">\u25C9 Hint used: \u221210% credit adjustment applied to this exercise.</p>'; }
  if(r.dangerous){ fb+='<p class="fb-study">\u2717 DANGEROUS \u2014 NEAR MISS: the command or action you entered is close to a state-changing or evidence-destroying variant. Read the canonical safe version below and make the difference explicit in your runbook.</p>'; }
  if(r.correctHtml){ fb+='<div class="fb-correct"><b>Correct answer:</b><br>'+r.correctHtml+'</div>'; }
  if(r.rows&&r.rows.length){ fb+='<div class="items">'+r.rows.map(function(row){
    var cls=row.st==='ok'?'ok':(row.st==='bad'?'bad':'miss');
    var ic=row.st==='ok'?'\u2713':(row.st==='bad'?'\u2717':'\u25CB');
    var word=row.st==='ok'?'Correct':(row.st==='bad'?'Wrong':'Missed');
    return '<div class="item-row '+cls+'"><span class="item-ic">'+ic+'</span><span><b>'+word+'</b> \u2014 '+esc(row.label)+(row.note?'<br><span class="tiny-note">'+esc(row.note)+'</span>':'')+'</span></div>';
  }).join('')+'</div>'; }
  fb+='<div class="fb-exp">'+(r.explainHtml||'')+'</div>';
  if(ex.persp){ fb+='<div class="fb-persp"><div class="persp"><b>\u25B8 Attacker perspective:</b> '+esc(ex.persp.a)+'</div>'
    +'<div class="persp d"><b>\u25B8 Defender perspective:</b> '+esc(ex.persp.d)+'</div></div>'; }
  if(ex.study&&credit<1){ fb+='<div class="fb-study"><b>What to study:</b> '+esc(ex.study)+'</div>'; }
  fb+='</div></div>';
  var fbWrap=document.createElement('div'); fbWrap.innerHTML=fb;
  $('#action-row').parentNode.insertBefore(fbWrap.firstChild, $('#action-row'));
  var checkBt=$('#bt-check'), nextBt=$('#bt-next');
  checkBt.disabled=true;
  nextBt.disabled=false;
  nextBt.className='btn btn-blue';
  var isLast = nextUnchecked()===-1;
  if(S.inReview){ nextBt.innerHTML='\u2190 Back to review'; }
  else if(isLast){ nextBt.innerHTML=hasSkips()?'\u26A0 Review skipped exercises':'\u25B6 Final Submit'; }
  else { nextBt.innerHTML='Next exercise \u2192'; }
  fbWrap.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function onNext(ex,i){
  if(!S.checked[i]){ return; }
  leaveAuto(); S.pendingAuto=false;
  if(S.timer.state==='PAUSED_AUTO_CHECK'){ S.timer.state='RUNNING'; }
  updateTopbar();
  if(S.inReview){ S.inReview=false; S.pendingReview=false; showReview(); return; }
  var n=nextUnchecked();
  if(n>=0){ renderExercise(n); }
  else if(hasSkips()){ S.timer.state='RUNNING'; showReview(); }
  else { endExam('submitted'); }
}

/* ---------------- review skipped ---------------- */
function showReview(){
  S.view='review'; show('view-review');
  var ids=[]; for(var k in S.skipped){ if(!S.checked[k]){ ids.push(parseInt(k,10)); } }
  ids.sort(function(a,b){ return posOf(a)-posOf(b); });
  var h='<h1>\u26A0 Review skipped exercises</h1>'
   +'<p>You skipped '+ids.length+' exercise'+(ids.length===1?'':'s')+'. You can return to any of them and answer it as long as the timer has not ended. Answered exercises stay graded. When you finish, unanswered skipped exercises are <b>excluded from the score</b>.</p>';
  if(S.timer.state==='ENDED'){ h+='<div class="notice">The timer has ended. You can no longer answer skipped exercises \u2014 they will be excluded from the score.</div>'; }
  h+='<div class="panel">';
  if(ids.length===0){ h+='<p class="small">No skipped exercises remain unanswered.</p>'; }
  ids.forEach(function(i){ var ex=D.exercises[i];
    h+='<div class="rv-row"><span class="chip skip">\u26A0 Skipped</span><span class="rv-t">'+esc(ex.title)+'</span>'
     +(S.timer.state==='ENDED'?'':'<button class="btn btn-blue" data-ri="'+i+'">Return to exercise</button>')+'</div>';
  });
  h+='</div><div class="btn-row"><button class="btn btn-primary btn-lg" id="bt-finish">\u25B6 Finish and see results</button></div>';
  $('#view-review').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('[data-ri]'), function(b){
    b.addEventListener('click', function(){ S.pendingReview=true; S.view='exam'; show('view-exam'); renderExercise(parseInt(b.getAttribute('data-ri'),10)); });
  });
  $('#bt-finish').addEventListener('click', function(){ endExam('submitted'); });
  updateTopbar();
}

/* ---------------- results ---------------- */
function endExam(reason){
  leaveAuto(); S.sinceManual=null; S.pendingAuto=false;
  hidePauseOverlay();
  S.timer.state='ENDED';
  var answered=[], full=0, part=0, wrong=0, partSum=0, skipped=0;
  D.exercises.forEach(function(e,i){
    if(S.checked[i]){ answered.push(i); var c=S.credit[i];
      if(c>=1){ full++; } else if(c>0){ part++; partSum+=c; } else { wrong++; } }
    else if(S.skipped[i]){ skipped++; }
  });
  var sum=0; answered.forEach(function(i){ sum+=S.credit[i]; });
  var cnt=answered.length;
  var percent = cnt>0 ? Math.round((sum/cnt)*100) : 0;
  var passed = percent>=D.meta.passMark;
  S.view='results'; show('view-results');
  var h='<h1>\u25A0 Exam results \u2014 '+esc(D.meta.title)+'</h1>';
  if(reason==='timeout'){ h+='<div class="notice">The timer ended. Exercises you did not answer are excluded from the score.</div>'; }
  h+='<div class="panel"><div class="res-sum"><span class="res-big">'+sum.toFixed(1)+'</span>'
   +'<span class="res-pct">\u2192 '+percent+'% (pass mark '+D.meta.passMark+'%)</span></div>'
   +'<p class="small">Score computed over answered exercises only: '+cnt+' of '+D.exercises.length+' answered'+(skipped?', '+skipped+' skipped and excluded':'')+'.</p>';
