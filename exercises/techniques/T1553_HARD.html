var EXAM = {"topicId":"t1553","mitreId":"T1553","objectName":"Subvert Trust Controls","objectType":"Technique","severity":"HARD","timerMinutes":40,"estimatedMinutes":40,"passMark":70,"learnIntro":["You will work T1553 Subvert Trust Controls, a parent Technique in the Defense Evasion tactic, TA0005. Trust controls either warn users about untrusted activity or prevent untrusted code from running: certificate warnings, Gatekeeper, mark-of-the-web, root stores, and signature validation. An adversary who subverts them makes malicious code run with borrowed trust or silences the warnings an analyst would otherwise see. The technique has six sub-techniques, and at this level you must tell the near-miss neighbours — signing, root installs, and trust-provider hijacking — apart with confidence.","You will work a shift at Halvern Insurance Group, an insurer running Windows claims workstations, macOS laptops, and Linux bastion and build servers. You will drive threat hunts on the DET0452 analytics AN1246, AN1247 and AN1248, run an incident bridge on a hijacked trust provider, collect read-only evidence in two simulated shells, and defend GRC funding choices for M1038, M1028, M1026 and M1024. The procedure examples G0001 Axiom and S9008 Shai-Hulud are woven into the scenarios.","You will practise the HARD judgement calls: choosing the least aggressive response that is still adequate, spotting root installs that look alarming but are ticketed and benign, spotting green builds that look benign but suppress every warning, and stating the honest limit that prevention here is partial — M1038 and M1026 work as a pair, never as a single switch.","Everything is simulated. Tickets, hosts, certificates, analysts and domains are invented for this exam, and every indicator is defanged. Nothing you type into a terminal is ever executed."],"keywords":[{"theme":"Detection and analytics","items":["DET0452","AN1246","AN1247","AN1248","correlation logic","certificate history","trust-provider registry keys","module load paths"]},{"theme":"Sub-techniques in play","items":["T1553.001 Gatekeeper Bypass","T1553.002 Code Signing","T1553.003 SIP and Trust Provider Hijacking","T1553.004 Install Root Certificate","T1553.005 Mark-of-the-Web Bypass","T1553.006 Code Signing Policy Modification"]},{"theme":"Mitigations","items":["M1038 Execution Prevention","M1028 Operating System Configuration","M1026 Privileged Account Management","M1024 Restrict Registry Permissions","M1054 Software Configuration","least privilege"]},{"theme":"Trust vocabulary","items":["root store","quarantine flag","xattr","mark-of-the-web","Gatekeeper","SIP","add-trusted-cert","spctl","protected roots","exit code 0"]},{"theme":"Procedure examples","items":["G0001 Axiom","S9008 Shai-Hulud","Operation SMN (Novetta)"]}]};
var EXERCISES = [{"id":"e01","type":"match","perspective":"defender","scenario":{"title":"HUNT-4411 — teaching the DET0452 family cheat-sheet","blocks":[{"kind":"text","body":"You are l.hartmann, detection engineer at Halvern Insurance Group. After the quarterly detection review, the SOC asks for a cheat-sheet that explains how DET0452 and its three analytics split the work of catching trust subversion. Two analysts treated AN1247 and AN1248 as interchangeable last week, and one silenced a genuine macOS hit because of it, so the wording must make the platform and artefact split obvious. Build the cheat-sheet by matching each identifier to the description its logic actually implements."},{"kind":"artefact","label":"ARTEFACT 1 — data-source families behind DET0452","body":"certificate history and certificate data\nfile metadata, including extended attributes\nprocess creation and module loads\nWindows registry modifications"}]},"question":"Match each identifier on the left to the description that its logic actually implements.","answer":{"left":[{"id":"l1","text":"DET0452"},{"id":"l2","text":"AN1246"},{"id":"l3","text":"AN1247"},{"id":"l4","text":"AN1248"}],"right":[{"id":"r1","text":"Correlates root or code-signing certificate changes, trust-provider registry keys, module loads from non-standard locations, and unsigned executables appearing together with persistence artefacts"},{"id":"r2","text":"Watches xattr manipulation, new roots landing in /etc/ssl or /usr/local/share/ca-certificates, and unexpected execution of package managers or custom certificate utilities"},{"id":"r3","text":"Watches Gatekeeper and quarantine flags, new trust certificates inserted via security add-trusted-cert, and xattr stripping that lets downloaded binaries evade trust"},{"id":"r4","text":"The strategy that ties certificate, registry, and attribute manipulation into one correlated view of trust subversion"}],"correct":{"l1":"r4","l2":"r1","l3":"r2","l4":"r3"}},"explanation":"DET0452 is the umbrella strategy, so it owns the one-line summary that ties all three families together. AN1246 is the certificate-plus-registry correlation: trust-provider keys, odd module loads, and unsigned executables joined with persistence artefacts. AN1247 is the Linux-flavoured analytic — the /etc/ssl and /usr/local/share/ca-certificates paths give it away. AN1248 is the macOS analytic: Gatekeeper flags, add-trusted-cert inserts, and xattr quarantine stripping. Mixing AN1247 with AN1248 hides real hits because their data sources live on different platforms.","study":"Detection strategy DET0452 and analytics AN1246 to AN1248 in the T1553 pack.","hint":"Pair the two platform-flavoured analytics first: one names Linux trust-store paths, the other names macOS tools — that removes the wrong pairing before you place the umbrella."},{"id":"e02","type":"multi","perspective":"defender","scenario":{"title":"INC-44012 — AN1246 fires on CLAIM-WS-07","blocks":[{"kind":"text","body":"You are e.farid on the Halvern threat-hunt desk. The SIEM raised HUNT-4411, a DET0452 correlation, on CLAIM-WS-07, a claims workstation that handles customer PII. AN1246 does not alert on one weak signal; it fires when certificate, registry, module-load, and persistence facts appear together. Read the correlated feed, then decide which three facts the analytic actually joined into this single detection."},{"kind":"log","label":"ARTEFACT 1 — CLAIM-WS-07 correlated event feed (excerpt)","lines":["2026-03-04T01:58:33Z  AUTH  CLAIM-WS-07  logon_type=2  user=halvern\\k.brandt  result=success","2026-03-04T02:14:09Z  REG   CLAIM-WS-07  op=create_key  path=HKLM\\SOFTWARE\\Microsoft\\Cryptography\\OID\\EncodingType 0\\CryptSIPDll\\{9f3c7d21}  proc=regsvr32.exe","2026-03-04T02:14:26Z  MOD   CLAIM-WS-07  module=sigverify.dll  path=C:\\Users\\Public\\cache\\sigverify.dll  loaded_into=wintrust","2026-03-04T02:15:02Z  PROC  CLAIM-WS-07  proc=setup_helper.exe  signature=INVALID  parent=explorer.exe  user=halvern\\k.brandt","2026-03-04T02:15:02Z  ALERT CLAIM-WS-07  rule=unsigned-exe-bypassed-trust-prompt  verdict=allowed","2026-03-04T02:16:47Z  REG   CLAIM-WS-07  op=set_value  path=HKCU\\...\\Run  data=C:\\Users\\Public\\cache\\setup_helper.exe","2026-03-04T02:18:10Z  NET   CLAIM-WS-07  dst=203[.]0[.]113[.]88:443  proc=setup_helper.exe  verdict=allowed","2026-03-04T02:30:01Z  SYS   CLAIM-WS-07  uptime_days=41  last_patch=2026-01-19"]},{"kind":"artefact","label":"ARTEFACT 2 — hunter's note on AN1246","body":"AN1246 joins: abnormal root or code-signing certificate changes; creation or modification of suspicious trust-provider registry keys; unusual module loads from non-standard locations; unsigned or improperly signed executables bypassing trust prompts, combined with persistence artefacts.\nNetwork telemetry and patch age are NOT data sources of this analytic."}]},"question":"Select the three facts that AN1246 correlates into this single detection.","answer":{"options":["A new key created under the CryptSIPDll trust-provider path","A module loaded from C:\\Users\\Public — a non-standard location","An unsigned executable that bypassed a trust prompt and then wrote a Run-key artefact","The TLS connection to 203[.]0[.]113[.]88","The 41 days of uptime and the January patch level","The interactive logon by halvern\\k.brandt"],"correct":[0,1,2]},"explanation":"AN1246 joins trust-provider registry creation, module loads from non-standard locations, and unsigned executables bypassing prompts when persistence artefacts appear — the feed shows all three within four minutes. The TLS callback and the logon are useful context but belong to other analytics, and patch age is hygiene noise, not a correlated family. Correlation across these families is exactly what makes the analytic hard to defeat with one quiet step.","study":"AN1246 correlation families in the T1553 knowledge pack, section 6.","hint":"One tempting answer is pure network telemetry — the analytic's data-source families simply do not include it."},{"id":"e03","type":"qcm","perspective":"attacker","scenario":{"title":"ENG-8842 debrief — which sub-technique was actually used?","blocks":[{"kind":"text","body":"You are the red-team lead closing engagement ENG-8842 for Halvern's insurance client. Your operator bought a code-signing certificate from a public reseller for the lookalike company Brightlane Digital Ltd, and Clearline Public CA-3 issued it after standard vetting. The implant was signed, it ran on the target, and no root store on any target machine was touched. A junior operator insists this was T1553.004 because 'certificates and roots are the same thing'. The debrief must correct the label before the report ships."},{"kind":"artefact","label":"ARTEFACT 1 — signing record","body":"signer: Brightlane Digital Ltd\nissuer: Clearline Public CA-3 (public CA)\nchain: ends at a pre-trusted public root\nroots installed on targets: none\nSIP or trust-provider changes: none\npolicy changes (testsigning, csrutil): none"}]},"question":"Which sub-technique does the debrief record for this signing operation?","answer":{"options":["T1553.003 SIP and Trust Provider Hijacking","T1553.004 Install Root Certificate","T1553.002 Code Signing","T1553.006 Code Signing Policy Modification"],"correctIndex":2},"explanation":"The certificate came from a public CA, so the chain already ended at a root the system trusted; nothing had to be installed, which rules out T1553.004. Nothing was done to SIP DLLs or trust providers, so T1553.003 is wrong, and no policy such as testsigning was modified, so T1553.006 is wrong. Signing malware with a created, acquired, or stolen certificate so it carries a valid signature is exactly T1553.002 Code Signing.","study":"T1553.002 versus T1553.004 in the T1553 knowledge pack, section 3.","hint":"Ask what the system had to be changed with for the signature to validate — here the honest answer is 'nothing'."},{"id":"e04","type":"dragdrop","perspective":"defender","scenario":{"title":"HUNT-4411 tuning — route six hunt hits to the right analytic","blocks":[{"kind":"text","body":"Your DET0452 deployment produced six raw hits across the Halvern estate during the March hunt. Before you tune thresholds, l.hartmann asks you to prove you know which analytic owns which artefact family, because hits misrouted today get silenced for the wrong reason next month. Each observation below names its artefact and platform. Drag each observation into the bucket of the analytic that watches it."},{"kind":"artefact","label":"ARTEFACT 1 — routing reminder","body":"Every analytic binds to the data-source families behind DET0452: certificate data, extended attributes, process and module events, and registry modifications. Silencing a hit before it lands in the right bucket is how AN1247 and AN1248 got confused last quarter."}]},"question":"Drag each observation into the analytic bucket that monitors it.","answer":{"buckets":[{"id":"b1","label":"AN1246"},{"id":"b2","label":"AN1247"},{"id":"b3","label":"AN1248"}],"items":[{"id":"i1","text":"Trust-provider key created under Cryptography\\OID on CLAIM-WS-07"},{"id":"i2","text":"sigverify.dll loaded from C:\\Users\\Public\\cache into wintrust"},{"id":"i3","text":"New root written to /usr/local/share/ca-certificates on SRV-LIN-BAST-03"},{"id":"i4","text":"Custom certificate utility executed on a Linux build node"},{"id":"i5","text":"com.apple.quarantine attribute stripped from a downloaded binary"},{"id":"i6","text":"security add-trusted-cert inserts a root into the System keychain"}],"correct":{"i1":"b1","i2":"b1","i3":"b2","i4":"b2","i5":"b3","i6":"b3"}},"explanation":"AN1246 owns the correlation of trust-provider registry keys and unusual module loads from non-standard paths. AN1247 owns the Linux trust stores — /etc/ssl and /usr/local/share/ca-certificates — together with the package managers and certificate utilities that feed them. AN1248 owns the macOS side: quarantine flags, add-trusted-cert inserts, and xattr stripping. Routing each artefact to the right analytic keeps the underlying data source visible when you tune, which is what protects coverage.","study":"AN1246/AN1247/AN1248 data sources in the T1553 knowledge pack, section 6.","hint":"The two items naming Linux paths share a bucket, and the two naming macOS attributes share another — that removes the mixed pairings."},{"id":"e05","type":"terminal","perspective":"defender","scenario":{"title":"INC-44012 step 2 — who can write the trust-provider key?","blocks":[{"kind":"text","body":"Containment of INC-44012 continues on CLAIM-WS-07, the claims workstation where AN1246 correlated a CryptSIPDll key creation with a suspicious module load. Before anyone changes anything, IR lead c.mbwangi wants the key's permissions recorded, because a widened write grant would confirm the hijack path and name the account that used it. You are in an elevated PowerShell session on the IR jump host attached to CLAIM-WS-07. Print the security descriptor of the key HKLM:\\SOFTWARE\\Microsoft\\Cryptography\\OID\\EncodingType 0\\CryptSIPDll — the full ACL, not just the values."},{"kind":"artefact","label":"ARTEFACT 1 — evidence goal","body":"Record: Owner, every Access entry, and any non-standard WriteKey or WriteDacl grant.\nThis is a read-only evidence step under the IR plan for INC-44012. Inspection only — never modify the artefact you are investigating."}]},"question":"Type the command that prints the ACL of that trust-provider key.","answer":{"prompt":"PS C:\\> (CLAIM-WS-07 — read-only IR session)","termTitle":"simulated PowerShell — nothing real is executed","required":[{"desc":"uses Get-Acl, the cmdlet that reads security descriptors","re":"^get-acl"},{"desc":"targets the HKLM drive path","re":"hklm:"},{"desc":"targets the CryptSIPDll trust-provider key","re":"cryptsipdll"}],"forbidden":[{"desc":"rewriting the ACL with Set-Acl","re":"set-acl","danger":true,"note":"Set-Acl modifies permissions in place and destroys the evidence of who widened the grant. M1024 hygiene is restored only after capture."},{"desc":"writing or deleting keys with reg.exe","re":"reg\\s+(add|delete|restore|copy)","danger":true,"note":"reg add or reg delete would change the very key under investigation — read-only evidence first, remediation later."}],"canonical":"Get-Acl \"HKLM:\\SOFTWARE\\Microsoft\\Cryptography\\OID\\EncodingType 0\\CryptSIPDll\" | Format-List","output":["","Path   : Microsoft.PowerShell.Core\\Registry::HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Cryptography\\OID\\EncodingType 0\\CryptSIPDll","Owner  : BUILTIN\\Administrators","","Access : NT AUTHORITY\\SYSTEM            Allow  FullControl","Access : BUILTIN\\Administrators          Allow  FullControl","Access : BUILTIN\\Users                   Allow  ReadKey","Access : HALVERN\\svc-billing             Allow  WriteKey   \u003c-- non-standard grant","","Audit  : SDDL audit on WriteKey enabled by IR at 2026-03-04T09:00:00Z"]},"explanation":"Get-Acl reads a key's security descriptor, which is what an ACL question needs; the reg.exe family reads values, not permissions, so it cannot answer this. The output shows a WriteKey grant for HALVERN\\svc-billing — a non-standard entry that matches the AN1246 hijack pattern and names the credential to pivot on. Set-Acl or reg add would modify the artefact under investigation, so both are forbidden here: capture first, remediate after.","study":"M1024 Restrict Registry Permissions and trust-provider component keys in the T1553 pack.","hint":"The reg.exe family only exposes values — permissions live on the security descriptor, and PowerShell reads those with a different cmdlet."},{"id":"e06","type":"multi","perspective":"attacker","scenario":{"title":"ENG-8842 planning — G0001 Axiom briefing","blocks":[{"kind":"text","body":"You are a red-team operator building the trust-subversion module for a follow-on engagement against Halvern's client. Your CTI lead briefs G0001 Axiom, documented by Novetta during Operation SMN, as the canonical example of delivering malware under digital certificates. Your emulation plan must mirror the documented behaviour — not borrow tricks from other actors or other sub-techniques — and it must predict what Halvern's blue team will hunt. Choose the three planning points that follow from the Axiom playbook."},{"kind":"artefact","label":"ARTEFACT 1 — CTI brief extract","body":"G0001 Axiom — used digital certificates to deliver malware (Operation SMN, Novetta).\nWhat blue teams watch after such operations: certificate history and certificate data.\nNearest family: T1553.002 Code Signing — valid signature, untrusted software."}]},"question":"Select the three planning points that follow from the documented Axiom behaviour.","answer":{"options":["Deliver the payload under a digital certificate so trust checks pass","Plan for defenders to pivot on certificate history and signer metadata","Close out and rotate acquired signing material after use to blunt that pivot","Install a rogue root CA on each target so your certificates chain locally","Suppress build-tool warnings so every error exits with code 0","Strip quarantine attributes from your own tooling before delivery"],"correct":[0,1,2]},"explanation":"Axiom's documented behaviour is delivering malware under digital certificates, so the plan signs the payload, expects the defender's pivot on certificate history, and rotates signing material afterwards to blunt that pivot. Installing a rogue root is the T1553.004 pattern, not Axiom; warning suppression with exit code 0 is the S9008 Shai-Hulud pattern; and quarantine stripping is the macOS .001-family trick that AN1248 watches. Borrowing an undocumented trick breaks the emulation contract and muddies the report.","study":"Procedure example G0001 Axiom in the T1553 knowledge pack, section 7.","hint":"Two of the wrong options belong to other actors or other sub-techniques — check every line against the Axiom entry in the brief."},{"id":"e07","type":"match","perspective":"defender","scenario":{"title":"INC-44012 review — three cases and one near-miss to label","blocks":[{"kind":"text","body":"IR lead c.mbwangi reviews four cases from the quarter, because the team keeps conflating signing, root installs, and trust-provider hijacking — and once they nearly escalated a scheduled PKI change as an intrusion. The quarterly report must carry the exact sub-technique for each genuine case, and the honest benign verdict for the one that is not T1553 at all. Match each case summary to its correct label."},{"kind":"artefact","label":"ARTEFACT 1 — case summaries","body":"CASE A: implant signed with a reseller certificate; chain ends at a pre-trusted public root; no store changes on targets.\nCASE B: wintrust accepts attacker files after a CryptSIPDll entry is repointed to a hostile DLL on CLAIM-WS-07.\nCASE C: attacker TLS and code certificates only validate after StellarAnchor Root CA appears in the machine root store.\nCASE D: p.krol installs Halvern-Internal-Root-G2 under approved change CHG-44190 during the quarterly PKI rotation."}]},"question":"Match each case to the correct label.","answer":{"left":[{"id":"l1","text":"CASE A — reseller-signed implant on a public chain"},{"id":"l2","text":"CASE B — CryptSIPDll entry repointed to a hostile DLL"},{"id":"l3","text":"CASE C — machine accepts StellarAnchor Root CA chains"},{"id":"l4","text":"CASE D — approved install of Halvern-Internal-Root-G2"}],"right":[{"id":"r1","text":"T1553.004 Install Root Certificate"},{"id":"r2","text":"Benign change — record under CHG-44190, not T1553"},{"id":"r3","text":"T1553.002 Code Signing"},{"id":"r4","text":"T1553.003 SIP and Trust Provider Hijacking"}],"correct":{"l1":"r3","l2":"r4","l3":"r1","l4":"r2"}},"explanation":"CASE A is plain T1553.002: a valid signature from an acquired certificate, with no local trust change needed. CASE B subverts the validation component itself, which is T1553.003. CASE C is T1553.004 — the root install is what made attacker-issued certificates validate. CASE D looks alarming in a certificate feed, but a ticketed, internal-CA, rotation-window install is the benign lookalike that must be recorded and closed, not escalated as T1553.","study":"Near-miss discrimination between .002, .003 and .004 in the T1553 knowledge pack, section 3.","hint":"One case carries a change ticket, an internal CA, and a rotation window — that combination removes the 'intrusion' label for it."},{"id":"e08","type":"triage","perspective":"defender","scenario":{"title":"INC-44031 — SOC morning queue, four trust alerts","blocks":[{"kind":"text","body":"You run the Halvern SOC morning queue with r.tanaka. Four trust alerts are pending, and the on-call director is watching the noise budget: over-reaction costs the team credibility, under-reaction costs the client. Triage each alert with exactly one action, and always choose the least aggressive response that is still adequate. Escalate means hand to IR with artefacts attached."}]},"question":"Choose one response for every alert in the queue.","answer":{"alerts":[{"id":"a1","title":"New root certificate on FIN-LT-44","detail":"Root Halvern-Internal-Root-G2 installed into the machine store at 04:11Z. Installer is the PKI deployment service; change CHG-44190 covers the window and the asset list.","actions":["Record as approved change and close with the ticket attached","Escalate to IR and re-image FIN-LT-44 tonight","Disable certificate validation on the finance VLAN","Ask the user to reinstall the certificate themselves"]},{"id":"a2","title":"Unknown root on OPS-WKS-17","detail":"Root StellarAnchor Root CA added at 02:47Z by certutil -addstore from a user temp folder. No change ticket exists and no PKI rollout is scheduled; the host is in Finance.","actions":["Close — roots install themselves during patch cycles","Escalate to IR: remove the root, then hunt certificates it issued","Isolate the entire finance subnet for a week","Turn off TLS certificate validation on OPS-WKS-17"]},{"id":"a3","title":"Protected View did not fire on CLAIM-LT-19","detail":"invoice_batch.xlsx opened with no MOTW banner. The file was copied from an internal file share to a USB stick, then opened — internal files legitimately carry no Zone.Identifier.","actions":["Close — no internet-zone origin means no MOTW is expected","Escalate as a T1553.005 MOTW-stripping incident","Re-image the laptop and destroy the USB stick","Disable Excel Protected View across the fleet"]},{"id":"a4","title":"Gatekeeper warning dismissed on MAC-CLM-12","detail":"User l.mercer dismissed the unsigned-app warning twice for QuickConf.app downloaded from hxxp://macro-tools[.]example. The download link arrived by email from outside the company.","actions":["Close — users dismiss Gatekeeper prompts every day","Contain the host and verify whether the quarantine flag was stripped","Revoke the vendor's corporate certificate","Add QuickConf.app to the macOS allowlist"]}],"correct":{"a1":0,"a2":1,"a3":0,"a4":1}},"explanation":"a1 has a ticket, an internal CA, and a matching window, so recording and closing is the least aggressive adequate action — escalating an approved PKI rotation burns credibility. a2 has no ticket and a temp-folder installer; a rogue root breaks machine trust, so escalate, remove, and hunt what it issued. a3 is benign: internal copies never carry MOTW, so the missing banner proves nothing about T1553.005. a4 looks like daily user friction, but an unsigned app from an external link with repeated dismissals is exactly the Gatekeeper-bypass path — contain and verify the quarantine flag.","study":"Benign lookalikes for T1553.004 and MOTW behaviour in the T1553 knowledge pack.","hint":"Two alerts should close, one must escalate, and one is containment — match each to its evidence rather than to how scary it looks."},{"id":"e09","type":"fill","perspective":"defender","scenario":{"title":"CHG-44203 — GRC control narrative for trust subversion","blocks":[{"kind":"text","body":"GRC owner s.vidal drafts the control narrative after the INC-44012 bridge. PKI admin p.krol points out that application control alone would not have stopped the rogue root, because the installer already held elevated credentials. Finish the narrative with the exact mitigation IDs and the honest coverage word."},{"kind":"artefact","label":"ARTEFACT 1 — bridge minutes extract","body":"p.krol: 'AppLocker was green all quarter — it never saw the installer's credential.'\ns.vidal: 'Then the narrative pairs execution limits with privilege limits, and it never promises total prevention.'\nAction: write the sentence into CHG-44203 with the exact mitigation IDs."}]},"question":"Fill the three blanks with the best items from the bank.","answer":{"segments":["Execution Prevention (",") restricts which binaries may run, but it says nothing about who holds the elevated rights a rogue-root install needs; Privileged Account Management (",") closes that gap by managing the creation, use, and permissions of privileged accounts. Together the two controls give strong — though never "," — prevention of trust subversion."],"blanks":[{"accept":["M1038"],"note":"Execution Prevention is M1038 — app control such as AppLocker or Device Guard."},{"accept":["M1026"],"note":"Privileged Account Management is M1026 — the elevated-rights gate."},{"accept":["complete","total"],"note":"Prevention for the parent technique is partial; layered controls are the honest wording."}],"bank":["M1038","M1026","M1028","M1024","M1054","complete","instant","optional"],"mode":"select"},"explanation":"The narrative must pair M1038 with M1026: app control limits what runs, while privileged-account management limits who can reach the elevation that trust subversion needs. M1028 hardens the root store and M1024 hardens registry permissions, so both are tempting in a trust story, but the sentence names execution and privilege. And the honest coverage word is that prevention stays partial — no control stack here is ever complete.","study":"Partial-prevention reality: M1038 plus M1026 in the T1553 knowledge pack, section 5.","hint":"Two blanks are the IDs printed next to the control names in the sentence itself — and no honest control narrative promises perfection."},{"id":"e10","type":"branch","perspective":"dual","scenario":{"title":"INC-44026 — the StellarAnchor chain, seen from both sides","blocks":[{"kind":"text","body":"One incident, two desks. Red side: you are the operator who installed StellarAnchor Root CA on OPS-WKS-17 during the engagement window. Blue side: you are c.mbwangi leading the response as the DET0452 analytics start correlating. The bridge alternates between the operator's chair and the defender's chair; each decision must be one a professional on that side would defend afterwards."},{"kind":"artefact","label":"ARTEFACT 1 — bridge facts","body":"Root: StellarAnchor Root CA — installed 2026-03-05T02:47Z on OPS-WKS-17.\nLeaf certificates: 3 issued and chaining to the rogue root.\nRun key: C:\\Users\\Public\\cache\\setup_helper.exe.\nAN1246 status: firing on registry, module-load, and unsigned-executable facts."}]},"question":"Work through the four decision steps.","answer":{"steps":[{"text":"RED — The root is installed and your leaf certificates now validate on OPS-WKS-17. Which follow-up keeps you inside the T1553.004 pattern while staying quietest?","options":["Mint leaf certificates only as needed and leave the root untouched","Also repoint the CryptSIPDll entries to your own DLL","Strip MOTW from every staged file on the host","Delete the machine root store to cover your tracks"],"correctIndex":0},{"text":"BLUE — AN1246 fires: trust-provider key created, module loaded from C:\\Users\\Public, unsigned executable with a fresh Run key. What is the least aggressive first move?","options":["Re-image OPS-WKS-17 immediately","Disable SIP protections fleet-wide to stop the bleeding","Capture read-only evidence: key contents, module hash, binary copy","Delete the Run key and close the alert as noise"],"correctIndex":2},{"text":"RED — The blue team removes the root within the hour. Which residual artefact still betrays you?","options":["Nothing — removing the root erases the whole story","Leaf certificates and files that still chain to StellarAnchor Root CA","The MOTW flags you carefully preserved","The uptime counter on OPS-WKS-17"],"correctIndex":1},{"text":"BLUE — Final remediation call for the bridge. Which option is least aggressive yet genuinely adequate?","options":["Remove the root, block its leaf certificates, and hunt StellarAnchor-issued trust fleet-wide","Re-image every endpoint in the company","Disable certificate validation until the audit ends","Rotate all user passwords and stop there"],"correctIndex":0}]},"explanation":"The operator's quietest path is to keep using the installed root: every extra mechanism, from SIP hijacking to MOTW stripping, adds its own detection surface under different analytics. The defender's least aggressive adequate moves are evidence-first capture, then scoped remediation — remove the root, block what it signed, and hunt the chain fleet-wide. Removing the root alone never erases the certificates and files that already chain to it, which is why the scoped hunt outranks re-imaging everything.","study":"T1553.004 chain behaviour and least-aggressive response planning in the T1553 pack.","hint":"The two blue steps both reward the option an auditor would call proportionate — scan for the choice that collects evidence instead of destroying it."},{"id":"e11","type":"qcm","perspective":"attacker","scenario":{"title":"ENG-8842 debrief — which control gap let the root install through?","blocks":[{"kind":"text","body":"During ENG-8842 your operator used a compromised local administrator credential to install StellarAnchor Root CA into the machine store of OPS-WKS-17 with certutil -addstore. Halvern's control estate had AppLocker publisher baselines (M1038) enforced and ProtectedRoots Flags=1 (M1028) applied to non-admin users. The client wants to know which control gap actually let the install through, and the debrief must name it precisely, because the remediation budget follows the finding."},{"kind":"artefact","label":"ARTEFACT 1 — control state at time of install","body":"M1038 Execution Prevention: AppLocker publisher rules enforced\nM1028 OS Configuration: ProtectedRoots Flags=1 for non-admin users\nM1026 Privileged Account Management: local admin reused across 30 hosts, no JIT elevation\nM1024 Restrict Registry Permissions: default ACLs on trust-provider keys\ncredential used: halvern\\svc-billing (local admin)"}]},"question":"Which finding does the debrief record as the gap that enabled the install?","answer":{"options":["M1026 — a standing local admin credential was available and unmonitored","M1028 — ProtectedRoots Flags=1 failed to block the root","M1038 — AppLocker should have blocked certutil.exe","M1024 — trust-provider registry permissions were left at default"],"correctIndex":0},"explanation":"ProtectedRoots Flags=1 stops non-admin users from adding roots to their own store, so it never applied to an elevated credential — blaming M1028 is the classic near-miss. AppLocker publisher rules did not cover certutil usage, and trust-provider registry permissions are a different artefact family from the root store. The enabling gap is M1026: a standing local admin credential, reused across thirty hosts and unmonitored, is exactly what privileged-account management exists to remove. Pairing M1038 with M1026 is what closes this path.","study":"M1026 and M1028 scope in the T1553 knowledge pack, section 5.","hint":"Read the Flags=1 line carefully — it binds one class of user only, and the credential in the artefact belongs to the other class."},{"id":"e12","type":"dragdrop","perspective":"defender","scenario":{"title":"CHG-44203 — map the hardening measures to their mitigation IDs","blocks":[{"kind":"text","body":"The GRC bridge agrees to fund four hardening workstreams against trust subversion, one per mitigation family. Before the change board meets, s.vidal asks you to sort the eight drafted measures into the right M-ID buckets, because a measure funded under the wrong ID cannot be audited against its own family. Drag each measure into the mitigation bucket it belongs to."},{"kind":"artefact","label":"ARTEFACT 1 — funding rule extract","body":"Every measure must be justified by the artefact family it removes: what executes, what the store trusts, who holds privilege, or what the registry allows. Wrong-bucket funding has hidden two gaps in previous audits."}]},"question":"Drag each measure into the mitigation bucket it belongs to.","answer":{"buckets":[{"id":"b1","label":"M1038 Execution Prevention"},{"id":"b2","label":"M1028 Operating System Configuration"},{"id":"b3","label":"M1026 Privileged Account Management"},{"id":"b4","label":"M1024 Restrict Registry Permissions"}],"items":[{"id":"i1","text":"AppLocker policy allowing only approved publishers to run"},{"id":"i2","text":"Block executables that did not arrive through the approved software portal"},{"id":"i3","text":"ProtectedRoots Flags=1 so non-admin users cannot add roots"},{"id":"i4","text":"Group Policy baseline for corporate root-store management"},{"id":"i5","text":"Just-in-time elevation with approval for every admin session"},{"id":"i6","text":"Quarterly review and removal of standing local-admin rights"},{"id":"i7","text":"Tightened ACLs on Cryptography\\OID trust-provider keys"},{"id":"i8","text":"Remove the BUILTIN\\Users WriteKey grant found on DC-02"}],"correct":{"i1":"b1","i2":"b1","i3":"b2","i4":"b2","i5":"b3","i6":"b3","i7":"b4","i8":"b4"}},"explanation":"M1038 covers controls that decide what may execute, so the AppLocker publisher rules and the portal-only install block belong there. M1028 is operating-system configuration of the trust store itself: ProtectedRoots Flags=1 and the Group Policy root baseline. M1026 governs privileged accounts — just-in-time elevation and removing standing local admin. M1024 is registry-hive hygiene: the ACLs on trust-provider keys and revoking the stray Users WriteKey grant on DC-02. Funding a measure under the wrong ID hides its real cost and leaves its family unowned.","study":"Mitigation IDs M1038, M1028, M1026, M1024 in the T1553 knowledge pack, section 5.","hint":"Two buckets decide what or who may act, and two buckets harden stores — split the eight measures that way first."},{"id":"e13","type":"terminal","perspective":"defender","scenario":{"title":"INC-44031 follow-up — is the quarantine flag still there?","blocks":[{"kind":"text","body":"MAC-CLM-12 is contained after the Gatekeeper dismissals on QuickConf.app. Before c.mbwangi decides between user coaching and a full IR case, the evidence must show whether the com.apple.quarantine attribute is still present on the staged file or was already stripped — a stripped flag is the AN1248 bypass artefact. You hold a read-only IR session in Terminal on MAC-CLM-12. Print the extended attributes of /Users/l.mercer/Downloads/QuickConf.app so the record shows exactly which attributes remain. Inspection only: never delete or rewrite attributes, and never weaken the trust policy to 'test' the app."},{"kind":"artefact","label":"ARTEFACT 1 — evidence goal","body":"The listing itself is the evidence: the WhereFroms record and the presence or absence of com.apple.quarantine go straight into INC-44031. Any write or delete against the file's attributes would tamper with the artefact."}]},"question":"Type the command that lists the file's extended attributes.","answer":{"prompt":"ir-readonly@mac-clm-12:~$","termTitle":"simulated macOS shell — nothing real is executed","required":[{"desc":"uses the xattr tool","re":"^xattr"},{"desc":"uses a read mode flag (-l lists all, -p prints one)","re":"\\s(-l|-p)\\s"},{"desc":"targets QuickConf.app in the Downloads folder","re":"quickconf\\.app"}],"forbidden":[{"desc":"deleting or writing attributes (evidence tampering)","re":"\\s-d\\s|\\s-w\\s|-d\\s+com\\.apple|-w\\s+com\\.apple","danger":true,"note":"Deleting or writing the quarantine attribute destroys the bypass evidence and tampers with the artefact."},{"desc":"weakening the trust policy instead of inspecting","re":"master-disable|csrutil disable","danger":true,"note":"Disabling Gatekeeper or SIP to 'see what happens' is self-inflicted trust subversion — never on a contained host."}],"canonical":"xattr -l /Users/l.mercer/Downloads/QuickConf.app","output":["com.apple.metadata:kMDItemWhereFroms:","    hxxp://macro-tools[.]example/dl/QuickConf.app","com.apple.lastuseddate#PS: 6BD2 98A1 0000 0000","","(listing complete)","### ir-note: com.apple.quarantine ABSENT — stripped at 2026-03-05T08:41Z per unified log"]},"explanation":"xattr is the macOS tool for extended attributes; -l lists them all and -p prints one named attribute, and both are read-only. The listing shows the WhereFroms record but no com.apple.quarantine line, so the quarantine flag was stripped — the AN1248 bypass artefact that turns user friction into evidence. Deleting or writing attributes would destroy that evidence, and disabling Gatekeeper would weaken the very control under investigation.","study":"AN1248 and quarantine stripping in the T1553 knowledge pack, section 6.","hint":"You are collecting evidence, so your flag must only read — the delete and write flags are the wrong path, and so is weakening the policy."},{"id":"e14","type":"multi","perspective":"defender","scenario":{"title":"HUNT-4411 extension — exit code 0 on every failure, BUILD-NIX-07","blocks":[{"kind":"text","body":"A Halvern developer complains that 'the build is always green', yet packages installed from the mirror behave oddly. e.farid pulls the wrapper around npm on BUILD-NIX-07 and compares it with the verbose log. Trust-related warnings should reach the user; a build that cannot fail is a build that cannot warn. Choose the three facts that indicate deliberate warning suppression in the S9008 style rather than a healthy build."},{"kind":"artefact","label":"ARTEFACT 1 — wrapper excerpt (BUILD-NIX-07)","body":"process.on('uncaughtException', function () {\n  process[\"exit\"](0x0);\n});\n// every error exits with code 0"},{"kind":"artefact","label":"ARTEFACT 2 — verbose log excerpt","body":"npm WARN integrity mismatch: lodash-4.17.19.tgz\nnpm ERR! peer dep conflict: types-node\nnpm ERR! audit: 2 high severity advisories\nexit status: 0\ndeploy pipeline: PASSED"}]},"question":"Select the three facts that indicate deliberate warning suppression.","answer":{"options":["The wrapper routes every uncaught exception to process[\"exit\"](0x0)","Integrity and audit warnings print, yet the exit status is 0","Trust and dependency warnings never block or reach the user","The deploy pipeline marked the run PASSED","The mirror is internal and pinned","Node is version-pinned by .nvmrc"],"correct":[0,1,2]},"explanation":"S9008 Shai-Hulud suppressed victim NPM warnings with process[\"exit\"](0x0): all errors exit with code 0, so the user never sees trust-related warnings. The wrapper line, the zero exit despite printed warnings, and the silenced warnings are the three suppression facts. The green pipeline is the attacker's intended benign-looking outcome, not evidence of the mechanism, and the mirror pin and Node pin are ordinary hygiene.","study":"Procedure example S9008 Shai-Hulud in the T1553 knowledge pack, section 7.","hint":"One option describes the outcome the attacker wants you to see — evidence of suppression is what makes it happen, not the green tick itself."},{"id":"e15","type":"order","perspective":"attacker","scenario":{"title":"ENG-8842 plan review — order the rogue-root campaign stages","blocks":[{"kind":"text","body":"The red-team review board asks you to present the rogue-root emulation as an ordered chain, because the order determines which control meets which stage. The chain must reflect how trust subversion actually unfolds on a Windows target: privilege first, then the trust change, then the borrowed trust, then the deepening. Order the five stages from first to last."},{"kind":"artefact","label":"ARTEFACT 1 — board constraint","body":"Presentation rule: a stage may only appear after the stage it depends on. Name the sub-technique or mitigation each stage rides on, so the board can map controls to stages."}]},"question":"Order the five stages from first to last.","answer":{"items":[{"id":"o1","text":"Abuse a standing privileged credential to reach elevation (M1026 gate)"},{"id":"o2","text":"Install StellarAnchor Root CA into the machine trust store (T1553.004)"},{"id":"o3","text":"Issue leaf certificates that now chain to the trusted rogue root"},{"id":"o4","text":"Sign and run payloads, or intercept TLS, with the borrowed trust"},{"id":"o5","text":"Repoint trust-provider registry entries to deepen the foothold (T1553.003)"}],"correctOrder":["o1","o2","o3","o4","o5"]},"explanation":"Every stage rides on the one before it: trust subversion needs elevation first, which is exactly the gate M1026 guards. Only then does the root install make attacker-issued leaf certificates validate, and the borrowed trust is spent on signed payloads or interception. Repointing trust providers is a deepening step that layers T1553.003 artefacts on top of the .004 base. AN1246 is built for this: it correlates the registry, certificate, and module-load facts that stages two, three, and five leave behind.","study":"T1553.004 to T1553.003 escalation path and M1026 in the T1553 knowledge pack.","hint":"Nothing trust-related can happen before elevation, and the deepest registry change comes last — the middle three follow the chain of what validates what."},{"id":"e16","type":"triage","perspective":"defender","scenario":{"title":"INC-44026 bridge — four calls for the containment queue","blocks":[{"kind":"text","body":"The INC-44026 containment bridge runs late. Four items wait for one decision each, and the CIO has asked for the least aggressive response that is genuinely adequate, because Halvern paid for an over-broad re-image last year. Two items are ticketed and quiet, two are hostile or harmful, and one request comes from above. Answer with the best action per item."}]},"question":"Choose the best action for each item.","answer":{"alerts":[{"id":"a1","title":"Linux root insert, matches change window","detail":"AN1247 flags a new root in /usr/local/share/ca-certificates on SRV-LIN-BAST-03. The config-management log shows the Ansible run belongs to approved change CHG-44203.","actions":["Record as approved configuration and close with the change attached","Escalate to IR and quarantine the bastion","Disable certificate validation on all Linux servers","Ask the vendor to reissue the certificate"]},{"id":"a2","title":"Quarantine stripping on fourteen mac hosts","detail":"AN1248 correlates com.apple.quarantine stripped from staging apps on 14 macOS hosts, one WhereFroms domain, no notarization tickets.","actions":["Close as a macOS housekeeping artefact","Escalate to IR — fleet-wide stripping is active subversion","Revoke all developer certificates immediately","Ask users to re-download the apps from the same domain"]},{"id":"a3","title":"Users WriteKey grant on DC-02 trust-provider key","detail":"ACL audit shows BUILTIN\\Users holding WriteKey on a Cryptography\\OID trust-provider key. No use of the grant is logged yet.","actions":["Snapshot the key, remove the grant, then hunt for who used it","Rebuild the forest from bare metal tonight","Ignore it — standard users rarely log on to DCs","Turn off signature validation on DC-02"]},{"id":"a4","title":"CIO asks to disable certificate warnings company-wide","detail":"Under audit pressure the CIO proposes disabling certificate validation and warnings fleet-wide until the audit ends, to stop the noise.","actions":["Refuse; propose scoped monitoring plus M1038 and M1026 hardening","Approve the fleet-wide disable for the audit period","Approve it for the finance department only","Defer the decision to the next quarterly review"]}],"correct":{"a1":0,"a2":1,"a3":0,"a4":0}},"explanation":"a1 is a ticketed configuration run, so recording it is adequate — otherwise AN1247 just teaches the team to ignore Linux trust alerts. a2 is active, correlated, fleet-wide bypass behaviour and needs IR, not re-downloads from the same domain. a3 calls for capture-then-scoped-fix: the grant is dangerous but unused, which is exactly when removal is cheap and quiet, and a forest rebuild is wildly disproportionate. a4 must be refused: disabling validation removes the warning layer the attacker needs to defeat, and the durable answer is layered M1038 and M1026 hardening with scoped monitoring — prevention here is partial, never a switch you flip off.","study":"Partial prevention (M1038 plus M1026) and least-aggressive containment in the T1553 knowledge pack.","hint":"One item is ticketed and two are genuinely hostile or harmful — and the executive request is the option that helps the attacker most."}];

/* ================= tiny utilities ================= */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffleArr(arr, rng){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(rng() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function range(n){ var a = []; for(var i = 0; i < n; i++){ a.push(i); } return a; }
function fmtClock(sec){
  sec = Math.max(0, Math.floor(sec));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  var mm = (m < 10 ? "0" : "") + m, ss = (s < 10 ? "0" : "") + s;
  return h > 0 ? h + ":" + mm + ":" + ss : mm + ":" + ss;
}
function shortTxt(s, n){ s = String(s); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
var LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

var SEV_CLASS = {"EASY":"sev-easy","MEDIUM":"sev-medium","HARD":"sev-hard","EXTREMELY HARD":"sev-extreme"};
var SEV_VAR = {"EASY":"var(--sev-easy)","MEDIUM":"var(--sev-medium)","HARD":"var(--sev-hard)","EXTREMELY HARD":"var(--sev-extreme)"};
