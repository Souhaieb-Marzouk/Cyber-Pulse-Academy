window.__EXAM_META__={"topicId": "t1688", "batch": 2, "title": "T1688 — MEDIUM practice exam", "sevWord": "MEDIUM", "difficulty": "medium", "estimatedMinutes": 35, "timerSeconds": 2100, "passMark": 70, "intro": {"title": "T1688 Safe Mode Boot — MEDIUM practice exam", "object": "MITRE ATT&CK object: Technique T1688 — Safe Mode Boot (Enterprise, Windows, tactic Defense Impairment TA0112)", "learnTitle": "What you will learn here", "learn": "<p>You will work one level deeper on <b>T1688 — Safe Mode Boot<\/b> than a first-day introduction. This is still a <b>technique<\/b> in the MITRE ATT&CK catalogue: it describes one attacker behaviour on <b>Windows<\/b> — forcing a host into <b>safe mode<\/b>, where only a limited set of drivers and services start, so third-party security software such as EDR (endpoint detection and response) may not start.<\/p><p>At this level you will connect two facts at a time. You will link the technique to its tactic (<b>Defense Impairment, TA0112<\/b>), link the procedure examples — Black Basta, AvosLocker, Qilin, RansomHub — to their exact behaviours, and link the two ATT&CK mitigations (M1026, M1054) to the right gaps. You will read two artefacts together, work an alert triage queue step by step, filter a log viewer, and type one command yourself in a training shell.<\/p><p><b>Where you use this at work:<\/b> a SOC analyst sees a bcdedit alert and must decide in minutes whether it is an admin or an attacker; a threat hunter correlates boot changes with SafeBoot registry edits just like detection strategy DET0116 prescribes; an incident responder checks whether the EDR outage was caused by a safe-mode reboot before ransomware; a CTI analyst maps observed commands to T1688 in a report. Every exercise here mirrors one of those moments, at a moderate difficulty: two connected ideas, no traps yet.<\/p>", "keywords": [{"theme": "Technique and placement", "items": ["T1688::Safe Mode Boot", "TA0112::Defense Impairment", "Windows::only platform", "Safe Mode vs Safe Mode with Networking::two variants", "T1112::Modify Registry (related)"]}, {"theme": "Attack mechanics", "items": ["BCD store modification::forces next boot into safe mode", "bcdedit /set safeboot::the key command", "SafeBoot registry keys::services allowed in safe mode", "COM objects::can load in safe mode", "msconfig.exe::graphical boot selection", "bootcfg.exe::legacy boot editor"]}, {"theme": "Real procedures", "items": ["Black Basta::bcdedit /set safeboot network", "AvosLocker::restarts machine in safe mode", "Qilin::reboot to avoid detection", "RansomHub::reboot prior to encryption"]}, {"theme": "Detection and mitigation", "items": ["DET0116 / AN0323::detection strategy", "Process creation telemetry::bcdedit.exe, bootcfg.exe", "Registry telemetry::SafeBoot writes", "M1026::Privileged Account Management", "M1054::Software Configuration — EDR runs in safe mode"]}], "exTypes": ["<li><b>Exercise types in this file:<\/b> choice questions, multi-select with partial credit, matching pairs, drag-and-drop, fill-in-the-blank, ordering, log viewer with filter, one branching alert-triage scenario, and one terminal command.<\/li>"]}};
window.__EXERCISES__=[{"id": "m01", "type": "choice", "title": "Name the technique and tactic", "summary": "Mapping — from a raw log line to technique + tactic", "perspective": "defender", "scenario": "<p>You are on the late shift at Arcline Logistics. The SIEM shows one process-creation event from a workstation. Nothing else is known yet. Use the artefact and pick the mapping a CTI analyst would write in the alert ticket.<\/p>", "artifacts": [{"label": "SIEM event — WS-4471", "code": "2026-06-04T02:14:07Z  Sysmon EID 1  Process Create\nImage:        C:\\Windows\\System32\\bcdedit.exe\nCommandLine:  bcdedit /set {current} safeboot network\nUser:         ARCLINE\\svc_patch  (member of Administrators)\nParentImage:  C:\\Windows\\System32\\winrm.exe"}], "question": "Which technique-and-tactic mapping belongs in the ticket?", "options": [{"id": "A", "text": "T1688 (Safe Mode Boot) — tactic Defense Impairment (TA0112)", "plain": "T1688 / TA0112", "why": "Correct — forcing a safe-mode boot via bcdedit is exactly T1688, and the goal is weakening defences, which is Defense Impairment."}, {"id": "B", "text": "T1112 (Modify Registry) — tactic Defense Impairment (TA0112)", "plain": "T1112 / TA0112", "why": "Wrong — no registry value was touched in this event; the behaviour is a boot-configuration change, which is T1688. T1112 becomes relevant later, for SafeBoot edits."}, {"id": "C", "text": "T1688 (Safe Mode Boot) — tactic Execution (TA0002)", "plain": "T1688 / TA0002", "why": "Wrong technique-tactic pair. T1688 is correct, but it sits under Defense Impairment, not Execution."}, {"id": "D", "text": "T1562 (Impair Defenses) — tactic Impact (TA0040)", "plain": "T1562 / TA0040", "why": "Wrong — T1562 is a different technique family, and Impact is not the tactic here; the boot change itself is the T1688 behaviour under Defense Impairment."}], "correctId": "A", "hint": "Two steps: first name the behaviour in the command line, then name the goal the behaviour serves.", "explain": "Step one: the command line sets the next boot to safe mode — that is technique T1688, Safe Mode Boot. Step two: the purpose of the trick is that security software may not start in safe mode — weakening defences, so the tactic is Defense Impairment (TA0112). The winrm parent is a hint that the command came in remotely, which matters for the mitigation discussion later.", "study": "How to map a command line to a technique first and a tactic second."}, {"id": "m02", "type": "match", "title": "Who did what", "summary": "Procedure examples — family to observed behaviour", "perspective": "neutral", "scenario": "<p>The CTI team pasted four lines from different incident reports into one table. Each line describes one ransomware family's use of safe mode. Match each family to its observed behaviour.<\/p>", "artifacts": [{"label": "CTI report snippets", "code": "\"...reboot victim machines in safe mode with networking\n           via bcdedit /set safeboot network\"\n\"...can restart a compromised machine in safe mode\"\n\"...can reboot targeted systems in safe mode to avoid detection\"\n\"...can reboot targeted systems into Safe Mode prior to encryption\""}], "question": "Match each family to the behaviour reported for it.", "lefts": [{"id": "l1", "label": "Black Basta", "why": "Black Basta is the family reported using the bcdedit /set safeboot network command."}, {"id": "l2", "label": "AvosLocker", "why": "AvosLocker is reported restarting a compromised machine in safe mode."}, {"id": "l3", "label": "Qilin", "why": "Qilin reboots targeted systems in safe mode to avoid detection."}, {"id": "l4", "label": "RansomHub", "why": "RansomHub reboots targeted systems into Safe Mode prior to encryption."}], "rights": [{"id": "r1", "label": "bcdedit /set safeboot network"}, {"id": "r2", "label": "reboot in safe mode to avoid detection"}, {"id": "r3", "label": "restart a compromised machine in safe mode"}, {"id": "r4", "label": "reboot into Safe Mode prior to encryption"}], "correct": {"l1": "r1", "l2": "r3", "l3": "r2", "l4": "r4"}, "hint": "Only one family is linked to the exact bcdedit command; the others differ in wording of when and why.", "explain": "Black Basta is tied to the concrete command 'bcdedit /set safeboot network'. AvosLocker restarts a compromised machine in safe mode. Qilin's stated reason is avoiding detection, and RansomHub's is timing — before encryption. Keeping the exact reported behaviour with the exact family is a core CTI habit: your detections and briefings must quote procedures precisely.", "study": "The procedure examples table on the T1688 page: AvosLocker S1053, Black Basta S1070, Qilin S1242, RansomHub S1212."}, {"id": "m03", "type": "choice", "title": "Read two events together", "summary": "Correlation — reboot request plus boot-config change", "perspective": "defender", "scenario": "<p>Two events arrive five minutes apart on host FS-12. Read them together and choose the assessment that best fits both.<\/p>", "artifacts": [{"label": "Windows System event", "code": "02:03:55  EID 1074  user32\nProcess wininit initiated the restart of computer FS-12\nReason: Operating System: Upgrade (Planned)"}, {"label": "Sysmon EID 1", "code": "01:58:12  Process Create\nImage:       C:\\Windows\\System32\\bcdedit.exe\nCommandLine: bcdedit /set {default} safeboot minimal\nUser:        ARCLINE\\admin_rv   (Administrators)"}], "question": "What is the most defensible reading of these two artefacts together?", "options": [{"id": "A", "text": "A boot-config change to safe mode was made minutes before a restart — treat as suspected T1688 until proven planned.", "plain": "safeboot change + restart = suspected T1688", "why": "Correct — the sequence matches the technique: force safe mode, then reboot to activate it."}, {"id": "B", "text": "Nothing to review: EID 1074 proves a normal patch reboot.", "plain": "patch reboot, ignore", "why": "Wrong — EID 1074 shows a restart happened, but the stated reason is just a string anyone can set; the bcdedit change five minutes earlier is the stronger signal."}, {"id": "C", "text": "The host was infected by boot-sector malware.", "plain": "boot-sector malware", "why": "Wrong — nothing here touches the boot sector; the BCD store was modified by a user-mode tool, which is the T1688 pattern, not a bootkit."}, {"id": "D", "text": "The EDR crashed and rebooted the host by itself.", "plain": "EDR crash reboot", "why": "Wrong — no EDR event supports this; a bcdedit safeboot change does not come from an EDR crash."}], "correctId": "A", "hint": "Ask what each artefact proves on its own, then what they prove together.", "explain": "Artefact 2 shows the preparation (bcdedit forces safe mode at next boot); artefact 1 shows the activation (the restart). Together they are the T1688 chain. The 'Planned / Upgrade' reason string in EID 1074 is set by whoever triggers the reboot, so it cannot clear the alert on its own — that is exactly why detection strategy AN0323 correlates boot-configuration changes with restarts instead of trusting one event.", "study": "Detection strategy DET0116 / AN0323: correlate boot configuration changes with reboots."}, {"id": "m04", "type": "fill", "title": "SafeBoot registration", "summary": "Mechanics — how a tool survives inside safe mode", "perspective": "attacker", "scenario": "<p>You are writing the internal wiki page for T1688. The 'mechanics' paragraph is missing two values. The page quotes the technique description about registry values and safe mode.<\/p>", "artifacts": [{"label": "ATT&CK excerpt (wiki source)", "code": "Adversaries may also add their malicious applications to the\nlist of minimal services that start in safe mode by modifying\nrelevant Registry values (i.e. Modify Registry)."}], "question": "Complete the wiki paragraph with the two missing values.", "segments": [{"t": "txt", "v": "A tool that must survive inside safe mode is registered under the "}, {"t": "blank", "id": "b1", "name": "registry key"}, {"t": "txt", "v": " key, so that Windows "}, {"t": "blank", "id": "b2", "name": "behaviour"}, {"t": "txt", "v": " it during a safe-mode start."}], "bank": ["SafeBoot", "starts", "Deletes", "ignores", "BootLoader"], "blanks": [{"id": "b1", "name": "registry key", "correct": "SafeBoot", "why": "The SafeBoot key (HKLM\\SYSTEM\\CurrentControlSet\\Control\\SafeBoot) lists what may start in safe mode."}, {"id": "b2", "name": "behaviour", "correct": "starts", "why": "Entries under SafeBoot are services Windows starts during a safe-mode boot."}], "hint": "First blank: the key family named in the detection strategy. Second blank: what Windows does with entries listed there.", "explain": "Services listed under the SafeBoot registry key are started by Windows during a safe-mode boot. The technique description says attackers add their malicious applications to that list of minimal services — that is why detection strategy AN0323 watches registry persistence under the SafeBoot keys, and why it correlates those writes with boot-configuration changes.", "study": "The SafeBoot registry keys and the sentence about adding malicious applications as minimal services."}, {"id": "m05", "type": "branch", "title": "Alert queue: WS-4471", "summary": "Branching triage — three decisions on one alert", "perspective": "defender", "scenario": "<p>A new alert lands in the queue. You will make three decisions; each choice shapes the next step. The exam scores the three sub-answers together when you press Check at the end.<\/p>", "artifacts": [{"label": "Alert ticket #6188", "code": "02:14  bcdedit /set {current} safeboot network  on WS-4471\nParent: winrm.exe   User: svc_patch (Administrators)\nNo change ticket is linked to this host."}], "question": "Work the three triage steps and confirm each one.", "steps": [{"id": "s1", "label": "Step 1 — first action", "prompt": "No change ticket is linked to WS-4471. What is your first action?", "options": [{"id": "s1_o1", "text": "Check for a legitimate change record and interview the service account owner", "why": "Correct — a missing ticket is not proof of attack; ruling planned work in or out comes first."}, {"id": "s1_o2", "text": "Immediately reimage WS-4471", "why": "Too aggressive for step one — you would destroy the evidence you need."}, {"id": "s1_o3", "text": "Close the alert as a false positive", "why": "Wrong — a remote, ticket-less boot change is not closable without verification."}], "correctId": "s1_o1"}, {"id": "s2", "label": "Step 2 — the owner answers", "prompt": "The service-account owner says: 'I did not run bcdedit — that account is used by automation only, and no automation task touches bcdedit.' What now?", "options": [{"id": "s2_o1", "text": "Treat as confirmed suspicious: correlate with reboot events and check whether EDR stopped after the next restart", "why": "Correct — with planned work excluded, the T1688 chain (bcdedit, then restart, then missing EDR) is what you correlate."}, {"id": "s2_o2", "text": "Keep waiting for more alerts before doing anything", "why": "Wrong — you already have the preparation signal; waiting wastes the early-warning window before encryption."}, {"id": "s2_o3", "text": "Delete the service account to stop the attacker", "why": "Wrong — deleting the account burns your only lead and may alert the attacker; containment comes after scoping."}], "correctId": "s2_o1"}, {"id": "s3", "label": "Step 3 — escalation", "prompt": "EDR telemetry on WS-4471 stopped right after the restart. What is the right escalation?", "options": [{"id": "s3_o1", "text": "Escalate as a probable T1688 defense impairment and open an incident for ransomware preparation", "why": "Correct — safe-mode boot plus EDR silence is the known ransomware preparation pattern on the ATT&CK page."}, {"id": "s3_o2", "text": "Escalate as a hardware failure", "why": "Wrong — the bcdedit change and the account denial are not hardware facts."}, {"id": "s3_o3", "text": "Escalate as an HR case against the account owner", "why": "Wrong — nothing points at a person yet; the automation account was abused, not necessarily its owner."}], "correctId": "s3_o1"}], "hint": "First rule out planned work; then treat unexplained silence of EDR after a forced reboot as the key signal.", "explain": "The triage order matters: verify planned work first, escalate the moment planned work is excluded and the T1688 chain completes. Step scores: each correct decision is one item; a wrong decision subtracts. This mirrors real queue work — the analyst who reimages first destroys evidence; the analyst who waits forever loses the pre-encryption window.", "study": "Alert triage workflow for boot-configuration alerts, and the value of the pre-encryption window."}, {"id": "m06", "type": "choice", "title": "Why before encryption", "summary": "Two-step reasoning — order and purpose of the reboot", "perspective": "attacker", "scenario": "<p>A junior asks: 'Why would ransomware reboot to safe mode <i>before<\/i> encrypting, instead of just encrypting right away?' Build the two-part answer from what you know.<\/p>", "artifacts": [{"label": "Reminder card", "code": "safe mode: limited set of drivers and services\nthird-party security software such as EDR tools may not start"}], "question": "Which answer correctly combines the two facts?", "options": [{"id": "A", "text": "In safe mode the EDR may not start, so the encryption stage runs without being watched or blocked.", "plain": "EDR absent, encryption unwatched", "why": "Correct — missing watcher (fact 1) means the destructive stage is unobserved (fact 2)."}, {"id": "B", "text": "Safe mode makes the disk faster, so encryption finishes quicker.", "plain": "faster disk", "why": "Wrong — safe mode does not speed up disks; the gain is the absence of security tooling."}, {"id": "C", "text": "Safe mode deletes the security logs, hiding the encryption.", "plain": "deletes logs", "why": "Wrong — safe mode does not delete logs; fewer services start, which is different."}, {"id": "D", "text": "Safe mode blocks all user logins so nobody interrupts the encryption.", "plain": "blocks logins", "why": "Wrong — users can still log in inside safe mode; the point is what services start."}], "correctId": "A", "hint": "Fact one: what does not start. Fact two: what the ransomware wants to do undisturbed.", "explain": "The two facts chain: safe mode starts a limited set of services, so third-party security software may not start; with the watcher gone, the encryption stage faces no EDR. That is why the procedure examples place the reboot 'prior to encryption' (RansomHub) and 'to avoid detection' (Qilin).", "study": "The link between the limited safe-mode start and the ransomware kill chain."}, {"id": "m07", "type": "dnd", "title": "Force it or live in it", "summary": "Classification — force safe boot vs operate inside safe mode", "perspective": "attacker", "scenario": "<p>Two different attacker goals hide inside T1688: <b>forcing<\/b> the machine into safe mode, and <b>operating inside<\/b> safe mode once it is there. Sort the four actions below.<\/p>", "artifacts": [{"label": "Actions seen in incidents", "code": "A. bcdedit /set {current} safeboot minimal\nB. msconfig: Boot tab, Safe boot selected, then restart\nC. add a service entry under SafeBoot\\Minimal\nD. register a COM object that loads in safe mode"}], "question": "Drag each action onto the goal it serves.", "items": [{"id": "a1", "label": "A. bcdedit /set ... safeboot minimal", "why": "Changing the BCD forces the next boot into safe mode."}, {"id": "a2", "label": "B. msconfig Safe boot selected", "why": "The graphical tool reaches the same boot-selection change."}, {"id": "a3", "label": "C. service entry under SafeBoot\\Minimal", "why": "Registering under SafeBoot makes the tool start inside the safe-mode session."}, {"id": "a4", "label": "D. COM object registered for safe mode", "why": "A COM object registered for safe mode also loads inside the limited start."}], "buckets": [{"id": "force", "label": "Force the next boot into safe mode", "hint": "These change how the machine boots.", "accepts": ["a1", "a2"]}, {"id": "live", "label": "Operate inside the safe-mode session", "hint": "These add the tool to what starts in safe mode.", "accepts": ["a3", "a4"]}], "hint": "Boot selection tools (bcdedit, msconfig) are about the restart; SafeBoot entries and COM objects are about what runs after it.", "explain": "bcdedit and msconfig both modify boot selection, so they force the next boot into safe mode. SafeBoot service entries and COM-object registration do not change the boot — they add the attacker's code to the list of things that start inside safe mode. Detection strategy AN0323 covers both halves: boot-configuration changes plus registry persistence under SafeBoot keys.", "study": "The two halves of the technique description: forcing safe mode vs operating within it."}, {"id": "m08", "type": "terminal", "title": "Lab shell — force a test boot", "summary": "Terminal — build the safeboot command for a sanctioned lab clone", "perspective": "neutral", "scenario": "<p>You are in the sanctioned training lab, on a disposable clone named LAB-CLONE-09 (a simulation — nothing real changes). The tool is known: <span class=\"mono\">bcdedit<\/span>. Your goal: make the clone boot into <b>Safe Mode with Networking<\/b> at the next restart. No syntax panel this time — you know the tool, now work out the options.<\/p>", "artifacts": [{"label": "Lab sheet", "code": "Goal:  next boot = Safe Mode with Networking\nStore: default system store is fine\nTool:  bcdedit (already available)"}], "question": "Type the bcdedit command that sets the next boot to Safe Mode with Networking.", "canonical": "bcdedit /set {current} safeboot network", "prompt": "LAB-CLONE-09&gt;", "banner": "Sanctioned lab clone. Type the command, press Enter, then Check.", "elements": [{"re": "\\bbcdedit\\b", "label": "Tool: bcdedit", "why": "bcdedit is the boot configuration editor you were told to use."}, {"re": "/set", "label": "Operation: /set", "why": "You are setting a boot entry value, so the operation is /set."}, {"re": "safeboot", "label": "Setting: safeboot", "why": "safeboot is the boot entry value that selects a safe-mode start."}, {"re": "network", "label": "Value: network", "why": "The value network selects Safe Mode with Networking; minimal would select plain Safe Mode."}], "dangerous": [{"re": "/deletevalue", "label": "state-changing /deletevalue", "why": "/deletevalue removes a value — the opposite of the lab goal."}], "simOutput": ["(simulated) The operation completed successfully."], "correctId": null, "hint": "Shape: tool, /set, the value name safeboot, then the variant word for 'with networking'. The {current} store argument is optional.", "explain": "Canonical command: <span class=\"mono\">bcdedit /set {current} safeboot network<\/span> — the {current} store argument may be omitted because bcdedit defaults to the system store. This is exactly the command reported for Black Basta (S1070) in the procedure examples. In the real world this command is state-changing: never run it on a live host without authorisation — that is why this exercise runs in a sanctioned lab clone.", "study": "bcdedit /set safeboot values: minimal vs network; and the Black Basta procedure example."}, {"id": "m09", "type": "click", "title": "Log viewer hunt", "summary": "Log viewer — filter, then click the one line that matters", "perspective": "defender", "scenario": "<p>Seven process-creation events from host FS-12 sit in the viewer below. Use the filter box to narrow the noise, then click the <b>one<\/b> line that shows the safe-mode boot being forced.<\/p>", "artifacts": [], "filterable": true, "paragraphs": [{"line": "02:58:11 chrome.exe commandline --new-tab arcline-intranet", "tokens": [{"v": "02:58:11 chrome.exe --new-tab arcline-intranet"}]}, {"line": "01:12:40 Teams.exe -processstart", "tokens": [{"v": "01:12:40 Teams.exe started"}]}, {"line": "01:58:12 bcdedit.exe /set {default} safeboot minimal", "tokens": [{"v": "01:58:12 bcdedit.exe /set {default} safeboot minimal", "id": "hit1"}]}, {"line": "02:01:33 Notepad.exe C:\\notes\\patch-window.txt", "tokens": [{"v": "02:01:33 Notepad.exe C:\\notes\\patch-window.txt", "id": "hit2"}]}, {"line": "02:03:55 wininit.exe restart initiated", "tokens": [{"v": "02:03:55 wininit.exe restart initiated (EID 1074)", "id": "hit3"}]}, {"line": "02:04:02 svchost.exe -k netsvcs -p", "tokens": [{"v": "02:04:02 svchost.exe -k netsvcs -p"}]}, {"line": "02:59:00 wuauclt.exe /reportnow", "tokens": [{"v": "02:59:00 wuauclt.exe /reportnow"}]}], "clickInstruction": "Click the single line that forces the next boot into safe mode.", "correctTokens": ["hit1"], "tokenInfo": {"hit1": {"label": "01:58:12 bcdedit.exe /set {default} safeboot minimal", "why": "Correct — this is the boot-configuration change that forces safe mode at the next restart; everything else is routine activity."}, "hit2": {"label": "02:01:33 Notepad.exe C:\\notes\\patch-window.txt", "why": "Wrong — Notepad opening a notes file is routine user activity; it changes nothing about how the next boot starts."}, "hit3": {"label": "02:03:55 wininit.exe restart initiated (EID 1074)", "why": "Wrong — a plain restart does not force safe mode. Without a safeboot entry in the BCD store the machine comes back in normal mode."}}, "correctId": null, "question": "Click the one log line that shows the safe-mode boot being forced.", "hint": "Filter for the boot editor's name; only one line runs it with a state-changing operation.", "explain": "The line 'bcdedit.exe /set {default} safeboot minimal' is the T1688 preparation event. The restart at 02:03:55 then activates it. The other lines are ordinary workstation noise — exactly why the filter box (and in real life, the detection rule) matters: strategy AN0323 keys on boot-configuration utilities, not on generic process noise.", "study": "AN0323: watch boot configuration utilities — bcdedit.exe and bootcfg.exe — in process telemetry."}, {"id": "m10", "type": "choice", "title": "Which mitigation closes this gap", "summary": "Mitigation mapping — remote forcing of safe mode", "perspective": "defender", "scenario": "<p>The WS-4471 case showed the command arriving over a remote channel using a service account that is a member of Administrators. The CISO asks which ATT&CK mitigation for T1688 targets exactly this entry path.<\/p>", "artifacts": [{"label": "Mitigations (T1688)", "code": "M1026 Privileged Account Management\n  Restrict administrator accounts to as few individuals as\n  possible, following least privilege principles, that may be\n  abused to remotely boot a machine in safe mode.\nM1054 Software Configuration\n  Ensure that endpoint defenses run in safe mode."}], "question": "Which mitigation directly targets the remote-admin path seen in the case?", "options": [{"id": "A", "text": "M1026 Privileged Account Management", "plain": "M1026", "why": "Correct — M1026 restricts admin accounts to as few people as possible, attacking the path that was abused."}, {"id": "B", "text": "M1054 Software Configuration", "plain": "M1054", "why": "Wrong — M1054 keeps defences alive in safe mode; it does not remove the admin path used to force the reboot."}, {"id": "C", "text": "M1037 Filter Network Traffic", "plain": "M1037", "why": "Wrong — that mitigation blocks traffic patterns; it is not listed for T1688 and does not touch the admin-rights problem."}, {"id": "D", "text": "M1018 User Account Management", "plain": "M1018", "why": "Wrong — close in name, but the page lists M1026 for T1688, whose text names remote safe-mode boots explicitly."}], "correctId": "A", "hint": "One mitigation's own text on the page mentions 'remotely boot a machine in safe mode'.", "explain": "M1026 Privileged Account Management is the fit: its T1688 text literally warns about accounts 'that may be abused to remotely boot a machine in safe mode'. M1054 matters for the other half — surviving the safe-mode boot — but it does not stop the forcing. Matching the gap to the mitigation whose text names that gap is the skill here.", "study": "The two T1688 mitigations and which half of the attack each one addresses."}, {"id": "m11", "type": "click", "title": "Spot the rule mistake", "summary": "Detection tuning — a rule that fires on the wrong operation", "perspective": "defender", "scenario": "<p>A colleague's new SIEM rule fires 'critical: safe mode attack' on every bcdedit event. In the last week it fired 41 times; every one was an admin listing settings. Click the part of the rule that is wrong.<\/p>", "artifacts": [], "paragraphs": [{"tokens": [{"v": "RULE", "id": "r1"}, {"v": "safe_mode_attack:"}, {"v": "WHEN"}, {"v": "process.name", "id": "r2"}, {"v": "=="}, {"v": "bcdedit.exe"}, {"v": "THEN"}, {"v": "severity=Critical"}]}, {"tokens": [{"v": "# intent:", "id": "r3"}, {"v": "catch"}, {"v": "state-changing"}, {"v": "safe-mode"}, {"v": "setup"}]}], "clickInstruction": "Click the token that makes the rule fire on harmless events. Click again to unselect.", "correctTokens": ["r3"], "tokenInfo": {"r3": {"label": "the rule's intent line vs its condition", "why": "Correct — the rule matches EVERY bcdedit run, but its intent is to catch state-changing use; the missing piece is a condition on the command line (for example /set with safeboot), not on /enum."}, "r2": {"label": "process.name == bcdedit.exe", "why": "Keying on the process name is right — bcdedit is the utility named by detection strategy AN0323."}, "r1": {"label": "the rule header", "why": "The rule name is fine; the problem is what the condition omits."}}, "correctId": null, "question": "Click the token that best identifies why the rule misfires.", "hint": "The 41 false hits were all read-only listings. Which part of the rule fails to separate reads from writes?", "explain": "The rule watches the process name only, so read-only listings (bcdedit /enum) trip it just like state-changing /set commands. The fix is a second condition on the command line — strategy AN0323 targets abuse: boot-configuration modification with safeboot values, not the tool's mere presence. Read-only checks are legitimate admin work.", "study": "Detection quality: separate read-only use (/enum) from state-changing use (/set safeboot)."}, {"id": "m12", "type": "fill", "title": "Quote the detection strategy", "summary": "DET0116 / AN0323 — the three watched signals", "perspective": "defender", "scenario": "<p>Your detection engineer left a half-finished sentence describing ATT&CK detection strategy DET0116 for T1688. Complete it from the word bank.<\/p>", "artifacts": [{"label": "Draft wiki sentence", "code": "DET0116 watches abuse of safe mode via\n  ____ modification, boot configuration utilities\n  (____), and registry persistence under SafeBoot keys."}], "question": "Complete the two blanks describing what the strategy watches.", "segments": [{"t": "txt", "v": "DET0116 watches abuse of safe mode via "}, {"t": "blank", "id": "b1", "name": "first signal"}, {"t": "txt", "v": " modification, boot configuration utilities ("}, {"t": "blank", "id": "b2", "name": "utility"}, {"t": "txt", "v": "), and registry persistence under SafeBoot keys."}], "bank": ["BCD", "bcdedit.exe", "bootcfg.exe", "EDR", "GPO"], "blanks": [{"id": "b1", "name": "first signal", "correct": "BCD", "why": "The strategy keys on Boot Configuration Data store modification — the file that manages boot application settings."}, {"id": "b2", "name": "utility", "correct": "bcdedit.exe", "why": "bcdedit.exe is the boot configuration utility named in the analytic; bootcfg.exe is the legacy helper also listed on the page."}], "hint": "First blank: three letters, the store that manages boot settings. Second blank: the modern boot editor's exe name.", "explain": "Detection strategy DET0116 / analytic AN0323 watches BCD store modification, boot-configuration utilities (bcdedit.exe, and the legacy bootcfg.exe), and registry persistence under the SafeBoot keys. Those are the three signals your detections and hunts should cover for T1688.", "study": "The analytic description on the T1688 page: BCD modification, bcdedit.exe / bootcfg.exe, SafeBoot keys."}, {"id": "m13", "type": "match", "title": "What starts in each variant", "summary": "Variants — what loads in Minimal, Network, AlternateShell", "perspective": "neutral", "scenario": "<p>Knowing what actually starts in each safe-mode variant tells you what still works for the attacker — and what still works for you. Match each start-up selection to what it loads.<\/p>", "artifacts": [], "question": "Match each boot selection to what it starts.", "lefts": [{"id": "l1", "label": "Safe boot: minimal", "why": "Minimal starts the fewest drivers and services — no network stack."}, {"id": "l2", "label": "Safe boot: network", "why": "Network adds the network drivers and services on top of minimal."}, {"id": "l3", "label": "Safe boot: AlternateShell", "why": "AlternateShell is Safe Mode with Command Prompt — a command prompt replaces the graphical shell."}], "rights": [{"id": "r1", "label": "Command prompt instead of the graphical desktop"}, {"id": "r2", "label": "Fewest drivers and services, no network stack"}, {"id": "r3", "label": "The small set plus network drivers and services"}], "correct": {"l1": "r2", "l2": "r3", "l3": "r1"}, "hint": "One variant talks to the network, one is the most reduced, one swaps the desktop for a prompt.", "explain": "Minimal = fewest drivers and services; network = the small set plus network support (which is why Black Basta and REvil used it — their tooling still needs connectivity); AlternateShell = Safe Mode with Command Prompt, a real Windows safe-mode variant. The ATT&CK page names the two main versions and notes extra services can start later; the AlternateShell selection is part of the same safeboot value space your detections watch.", "study": "The safeboot value space: minimal, network, and AlternateShell (Safe Mode with Command Prompt)."}, {"id": "m14", "type": "order", "title": "Defender workflow order", "summary": "Response ordering — from alert to verified recovery", "perspective": "defender", "scenario": "<p>After the WS-4471 confirmation, your team writes the standard response workflow for T1688 alerts. Put the four actions in the order they should run.<\/p>", "artifacts": [], "question": "Order the four response actions from first to last.", "items": [{"id": "d1", "label": "Confirm the boot change and check the ticket trail", "why": "First verify: is the safeboot change real, and is there any legitimate change record?"}, {"id": "d2", "label": "Contain the host (network isolation) and preserve the boot configuration as evidence", "why": "With suspicion confirmed, contain and capture — evidence before changes."}, {"id": "d3", "label": "Remove the safeboot value so the next boot is normal", "why": "Only after evidence is captured: bcdedit /deletevalue {current} safeboot undoes the forced safe mode."}, {"id": "d4", "label": "Verify the EDR service starts again after the controlled reboot", "why": "Last, confirm recovery: the watcher must be back before the host returns to production."}], "hint": "Verify, contain and preserve, repair, then prove recovery — in that order.", "explain": "The order is: verify the change, contain and preserve evidence, remove the safeboot value, then verify the EDR is back. Doing step three first destroys evidence; skipping step four leaves you blind. This mirrors incident-response fundamentals applied to this specific technique.", "study": "Incident response for boot-configuration tampering: evidence before repair, recovery verification last."}, {"id": "m15", "type": "multi", "title": "Select the two real reasons", "summary": "Multi-select — two facts that make safe mode attractive", "perspective": "attacker", "scenario": "<p>The threat-assessment meeting wants the two facts — and only two — that make safe mode attractive to ransomware operators, taken from the technique's own description. Choose exactly two.<\/p>", "artifacts": [], "question": "Select the two facts that come from the T1688 description itself.", "options": [{"id": "o1", "text": "Third-party security software such as EDR tools may not start after a safe-mode boot.", "plain": "EDR may not start", "why": "Correct — this is the core sentence of the description."}, {"id": "o2", "text": "Attackers can add their applications to the list of services that start in safe mode.", "plain": "tools can be registered for safe mode", "why": "Correct — the description says malicious applications can be added as minimal services, and COM objects can load too."}, {"id": "o3", "text": "Safe mode removes all login requirements for administrators.", "plain": "no admin logins", "why": "Wrong — safe mode does not remove authentication; this fact is invented."}, {"id": "o4", "text": "Safe mode permanently deletes Windows event logs.", "plain": "deletes event logs", "why": "Wrong — nothing in the description or Windows behaviour deletes logs in safe mode."}, {"id": "o5", "text": "Safe mode re-installs a clean copy of Windows.", "plain": "re-installs Windows", "why": "Wrong — safe mode is just a reduced start of the installed system, not a reinstall."}], "correctIds": ["o1", "o2"], "hint": "Both correct facts are quoted almost word-for-word on the technique page.", "explain": "The two page-grounded facts are: security software such as EDR may not start, and attackers can add their applications to the services that start in safe mode (plus COM objects that load there). The other three options sound plausible but describe behaviour that safe mode does not have.", "study": "Stick to what the source states: the EDR sentence and the service-registration sentence."}, {"id": "m16", "type": "fill", "title": "CTI report wording", "summary": "Reporting — procedure to ID in a briefing sentence", "perspective": "defender", "scenario": "<p>Your CTI brief on the last incident must name the command and the technique ID. Fill the two blanks from the word bank so the sentence is precise.<\/p>", "artifacts": [{"label": "Brief draft", "code": "Black Basta forced Safe Mode with Networking using\n  \"____\" — behaviour tracked under technique ____."}], "question": "Complete the briefing sentence with the exact command and the technique ID.", "segments": [{"t": "txt", "v": "Black Basta forced Safe Mode with Networking using \""}, {"t": "blank", "id": "b1", "name": "command"}, {"t": "txt", "v": "\" — behaviour tracked under technique "}, {"t": "blank", "id": "b2", "name": "ID"}, {"t": "txt", "v": "."}], "bank": ["bcdedit /set safeboot network", "T1688", "bootcfg /raw safeboot", "TA0112", "msconfig /safeboot:network"], "blanks": [{"id": "b1", "name": "command", "correct": "bcdedit /set safeboot network", "why": "That is the command reported for Black Basta in the procedure examples."}, {"id": "b2", "name": "ID", "correct": "T1688", "why": "Safe Mode Boot is technique T1688; TA0112 is its tactic, not its ID."}], "hint": "The command is quoted on the T1688 page for Black Basta; the technique ID starts with T and has four digits.", "explain": "The precise wording is: Black Basta forced Safe Mode with Networking using 'bcdedit /set safeboot network' — behaviour tracked under technique T1688. Reports that quote the exact procedure let other teams build detections without re-interpreting, and the T-number links the report to ATT&CK data (mitigations, detection strategy, software entries).", "study": "Quoting procedures verbatim and using canonical ATT&CK IDs in CTI deliverables."}, {"id": "m17", "type": "choice", "title": "First check on msconfig", "summary": "Triage decision — GUI tool observed, what to check first", "perspective": "defender", "scenario": "<p>EDR shows <span class=\"mono\">msconfig.exe<\/span> starting on server FS-12 through a terminal session — no bcdedit involved yet. msconfig is the graphical tool whose Boot tab can select a safe-mode start. What do you check <i>first<\/i> to decide whether this is T1688 preparation?<\/p>", "artifacts": [], "question": "Which first check best separates an admin from a T1688 preparation?", "options": [{"id": "A", "text": "Whether a safe-boot selection is being set in the msconfig boot options", "plain": "safe-boot selection being set", "why": "Correct — the T1688-relevant fact is the boot selection change; msconfig without a safe-boot change is ordinary troubleshooting."}, {"id": "B", "text": "Whether msconfig was started from the Start menu or from Run", "plain": "how msconfig was launched", "why": "Wrong — the launch path of the GUI does not tell you what change, if any, is being made."}, {"id": "C", "text": "Whether the user has used msconfig before", "plain": "user history with msconfig", "why": "Wrong — history hints at habit but does not decide whether a safe-mode change is happening now."}, {"id": "D", "text": "Whether the server has enough free disk space", "plain": "disk space", "why": "Wrong — irrelevant to whether a boot selection change is occurring."}], "correctId": "A", "hint": "The technique is about a specific setting inside the tool, not about the tool itself.", "explain": "The technique-relevant fact is whether a safe-boot selection is being made. msconfig is also used for service trimming and general troubleshooting, so its presence alone proves nothing; the safe-boot selection does. This is why GUI boot changes are a known detection gap for rules that only watch bcdedit — and why the BCD store itself is the better source of truth.", "study": "GUI paths (msconfig) reach the same safeboot change; watch the setting, not only the tool."}, {"id": "m18", "type": "dnd", "title": "Which telemetry catches it", "summary": "Data sources — artefact to telemetry type", "perspective": "defender", "scenario": "<p>Your detection engineer maps each observable from an incident to the telemetry that captures it. Sort the three artefacts.<\/p>", "artifacts": [{"label": "Observables from case #6188", "code": "O1: bcdedit.exe /set {current} safeboot network\nO2: write to HKLM\\...\\Control\\SafeBoot\\Minimal\\evil.sys\nO3: restart of FS-12 at 02:03:55 (EID 1074)"}], "question": "Drag each observable onto the telemetry that captures it.", "items": [{"id": "o1", "label": "O1: bcdedit /set safeboot", "why": "A command execution is captured by process-creation telemetry (command line included)."}, {"id": "o2", "label": "O2: SafeBoot registry write", "why": "A registry value write is captured by registry-modification telemetry."}, {"id": "o3", "label": "O3: restart at 02:03:55", "why": "Restarts land in Windows system event logs (EID 1074 and friends)."}], "buckets": [{"id": "t1", "label": "Process creation telemetry", "hint": "Sysmon-style EID 1 events.", "accepts": ["o1"]}, {"id": "t2", "label": "Registry modification telemetry", "hint": "Sysmon-style EID 13 events.", "accepts": ["o2"]}, {"id": "t3", "label": "Windows system event logs", "hint": "Restart and shutdown events.", "accepts": ["o3"]}], "hint": "One observable is a command, one is a registry write, one is a system restart.", "explain": "Command executions come from process-creation telemetry, SafeBoot writes from registry-modification telemetry, and restarts from Windows system event logs. DET0116's power comes from correlating these three streams — boot-configuration change, SafeBoot persistence, and the restart that activates the mode — rather than trusting any single source.", "study": "The data sources behind detection strategy DET0116 / AN0323."}];

(function(){
'use strict';
var M = window.__EXAM_META__;
var EXS = window.__EXERCISES__;
var app = document.getElementById('app');

/* ---------- helpers ---------- */
function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmtTime(s){ s=Math.max(0,s); var m=Math.floor(s/60), r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
function letters(i){ return String.fromCharCode(65+i); }
function scoreExercise(h,w,n){ if(n<=0) return 0; return Math.max(0,(h-w)/n); }
function normText(v){ return String(v).toLowerCase().replace(/\s+/g,' ').trim(); }
function fmtDur(ms){ var s=Math.round(ms/1000); var m=Math.floor(s/60); s=s%60; return (m>0? m+'m ':'')+s+'s'; }
function scrollNow(node){ var rm=false; try{ rm=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(err){}
  node.scrollIntoView({behavior:rm?'auto':'smooth',block:'start'}); }
function shuffledOrder(){
  var ids=EXS.map(function(e){ return e.id; });
  var isTerm={}; EXS.forEach(function(e){ isTerm[e.id]=(e.type==='terminal'); });
  for(var tries=0;tries<80;tries++){
    var o=shuffle(ids), ok=true;
    for(var i=1;i<o.length;i++){ if(isTerm[o[i]]&&isTerm[o[i-1]]){ ok=false; break; } }
    if(ok) return o;
  }
  return shuffle(ids);
}

/* ---------- state ---------- */
var S = {
  screen:'intro', order:[], idx:0, mode:'exam', reviewFrom:null,
  credits:{}, answered:{}, skipped:[], hintUsed:{}, feedbackShown:{},
  answers:{}, lastRes:{},
  timer:{ budget:M.timerSeconds, remaining:M.timerSeconds, state:'IDLE' },
  pauseLog:{ manualMs:0, autoMs:0, pauseStart:0, autoStart:0 },
  prevTimerState:null, reported:false, endedBy:'unfinished'
};

function exById(id){ for(var i=0;i<EXS.length;i++){ if(EXS[i].id===id) return EXS[i]; } return null; }
function curEx(){ return exById(S.order[S.idx]); }

/* ---------- timer state machine ---------- */
var T = {
  tick:null,
  start:function(){ this.stopTick(); var self=this; this.tick=setInterval(function(){ self.onTick(); },1000); },
  stopTick:function(){ if(this.tick){ clearInterval(this.tick); this.tick=null; } },
  onTick:function(){
    if(S.timer.state!=='RUNNING') return;
    S.timer.remaining--;
    if(S.timer.remaining<=0){ S.timer.remaining=0; S.timer.state='ENDED'; this.stopTick(); onTimeout(); }
    renderHeader();
  },
  setState:function(st){
    var prev=S.timer.state;
    if(prev===st) return;
    /* close any open pause interval logs */
    var now=Date.now();
    if(prev==='PAUSED_MANUAL'){ S.pauseLog.manualMs+=now-S.pauseLog.pauseStart; }
    if(prev==='PAUSED_AUTO_CHECK'){ S.pauseLog.autoMs+=now-S.pauseLog.autoStart; }
    if(st==='PAUSED_MANUAL'){ S.pauseLog.pauseStart=now; }
    if(st==='PAUSED_AUTO_CHECK'){ S.pauseLog.autoStart=now; }
    S.timer.state=st;
    if(st==='RUNNING'){ T.start(); } else { T.stopTick(); }
    if(st==='ENDED'){ T.stopTick(); }
    renderHeader();
  }
};

function onTimeout(){
  S.screen='results'; render();
}

/* ---------- score report ---------- */
function reportScore(){
  var answeredIds=S.order.filter(function(id){ return S.answered[id]; });
  var creditSum=0; answeredIds.forEach(function(id){ creditSum+=S.credits[id]||0; });
  var count=answeredIds.length;
  var percent=count>0?Math.round((creditSum/count)*100):0;
  S.reported=true;
  try{
    /* opened directly: there is no integrator to report to (self-post would be a no-op
       and would log an origin warning in some engines), so stay silent. */
    if(window.parent && window.parent!==window){
      /* Strict targeting on the real site (https: parent origin === location.origin).
         On opaque/file origins (sandbox, offline preview) strict targeting cannot match,
         so fall back to '*' — there is no cross-origin boundary to protect there. */
      var org=String(location.origin||'');
      var safe=(org && org!=='null' && org.indexOf('file://')!==0)?org:'*';
      parent.postMessage({
        type:'CYBERPULSE_SCORE', topicId:M.topicId, batch:M.batch,
        score:Math.round(creditSum), total:count, percent:percent, passed:percent>=M.passMark
      }, safe);
    }
  }catch(e){ /* opened directly; nothing to report to */ }
}

/* ---------- handshake ---------- */
var OPERATOR='';
window.addEventListener('message',function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  OPERATOR = event.data.username || '';
  var hi=document.getElementById('operator-hello');
  if(hi && OPERATOR){ hi.innerHTML='Operator signed in: <b>'+esc(OPERATOR)+'</b>'; }
});

/* ---------- header ---------- */
function timerStateLabel(){
  switch(S.timer.state){
    case 'RUNNING': return '<span class="tstate-running">&#9654; RUNNING</span>';
    case 'PAUSED_MANUAL': return '<span class="tstate-paused">&#9208; PAUSED &mdash; manual (press Resume)</span>';
    case 'PAUSED_AUTO_CHECK': return '<span class="tstate-paused">&#9203; AUTO-PAUSED &mdash; reading feedback (Next resumes)</span>';
    case 'ENDED': return '<span class="tstate-ended">&#9632; ENDED</span>';
    default: return '<span class="muted">&#9679; STANDBY</span>';
  }
}
function renderHeader(){
  var h=document.getElementById('examhead'); if(!h) return;
  var liveSum=0, liveCount=0;
  S.order.forEach(function(id){ if(S.answered[id]){ liveSum+=S.credits[id]||0; liveCount++; } });
  var pct=liveCount>0?Math.round((liveSum/liveCount)*100):0;
  var cur=curEx();
  var hintOff=(!cur)||S.hintUsed[cur.id]||S.feedbackShown[cur.id]||S.screen==='review';
  var reviewMode=(S.screen==='review');
  h.innerHTML =
    '<div class="left">'+
      '<div class="hstat"><span class="k">Exercise</span><span class="v">'+Math.min(S.idx+1,S.order.length)+' of '+S.order.length+'</span></div>'+
      '<span class="badge sev-badge" aria-label="Severity '+esc(M.sevWord)+'"><span class="dot"></span>'+esc(M.sevWord)+'</span>'+
      '<div class="hstat"><span class="k">Timer</span><span class="v mono">'+fmtTime(S.timer.remaining)+'</span></div>'+
      '<div class="hstat"><span class="k">Clock state</span><span class="v">'+timerStateLabel()+'</span></div>'+
      '<div class="hstat"><span class="k">Live score</span><span class="v"><span class="score-em">'+liveSum.toFixed(1)+'</span> / '+liveCount+' &nbsp;('+pct+'%)</span></div>'+
    '</div>'+
    '<div class="right">'+
      '<button class="btn ghost" id="btn-hint"'+(hintOff?' disabled':'')+' aria-label="Hint costs 10 percent of this exercise credit">&#128161; Hint (&minus;10%)</button>'+
      '<button class="btn ghost" id="btn-pause"'+(reviewMode?' disabled':'')+' aria-label="Pause exam manually">&#9208; Pause</button>'+
      '<button class="btn ghost" id="btn-skip"'+(reviewMode?' disabled':'')+' aria-label="Skip exercise">&#9888; Skip</button>'+
    '</div>';
  document.getElementById('btn-hint').onclick=onHint;
  document.getElementById('btn-pause').onclick=onManualPause;
  document.getElementById('btn-skip').onclick=onSkip;
  updateProgress();
}
function updateProgress(){
  var p=document.getElementById('progressbar'); if(!p) return;
  var done=0; S.order.forEach(function(id){ if(S.answered[id]||S.skipped.indexOf(id)>=0) done++; });
  p.style.width=Math.round((done/S.order.length)*100)+'%';
}

/* ---------- screens ---------- */
function render(){
  if(S.screen==='intro') renderIntro();
  else if(S.screen==='exam') renderExam();
  else if(S.screen==='review') renderReview();
  else if(S.screen==='results') renderResults();
}

    kw+='<div class="kwgroup"><h4>'+esc(g.theme)+'</h4>'+g.items.map(function(c){ return '<span class="chip"><b>'+esc(c.split('::')[0])+'</b>'+esc(c.indexOf('::')>=0?' :: '+c.split('::')[1]:'')+'</span>'; }).join('')+'</div>';
  });
  var types=I.exTypes.map(function(t){ return t; }).join('');
  app.innerHTML =
  '<div class="card">'+
    '<div class="intro-head">'+

      (OPERATOR?'<div class="small muted" id="operator-hello" style="margin-top:6px">Operator signed in: <b>'+esc(OPERATOR)+'</b></div>':'<div id="operator-hello"></div>')+
      '</div>'+
      '<span class="badge sev-badge" aria-label="Severity '+esc(M.sevWord)+'"><span class="dot"></span>'+esc(M.sevWord)+'</span>'+
    '</div>'+
    '<div class="fact-grid">'+
      '<div class="fact"><div class="k">Exercises</div><div class="v">'+EXS.length+'</div></div>'+
