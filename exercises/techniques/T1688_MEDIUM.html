      '<div class="fact"><div class="k">Timer budget</div><div class="v mono">'+fmtTime(M.timerSeconds)+'</div></div>'+
      '<div class="fact"><div class="k">Pass mark</div><div class="v">70%</div></div>'+
    '</div>'+
  '</div>'+
  '<div class="card"><h2>'+esc(I.learnTitle)+'</h2>'+I.learn+'</div>'+
  '<div class="card"><h2>Keywords covered in this exam</h2>'+kw+'</div>'+
  '<div class="card"><h2>How this exam works</h2>'+
    '<ul class="rules">'+
      '<li><b>Pass mark: 70%.</b> PASS means you scored at least 70% of the credit over the exercises you answered. FAIL means you should retake this exam after restudying.</li>'+
      types+
      '<li><b>Timer.</b> A countdown runs from '+fmtTime(M.timerSeconds)+'. Press <b>Pause</b> for a real break: the timer stops and the exercise is hidden. Press <b>Check</b> and the timer stops automatically so you can read the feedback without pressure; it starts again only when you press <b>Next</b>.</li>'+
      '<li><b>Partial credit.</b> Exercises with two or more correct items give partial credit: <span class="mono">credit = max(0, (H &minus; W) / N)</span>. Selecting extra wrong items cancels correct ones. One hint per exercise costs 10% of that exercise\'s credit.</li>'+
      '<li><b>Skips.</b> Every exercise has Skip. Skipped exercises wait in a review pool; you can return to them until the timer ends. A skipped exercise that is never answered is excluded from the score &mdash; it does not count for or against you.</li>'+
    '</ul>'+
    '<div class="btnrow center"><button class="btn primary" id="btn-start">&#9654; Start the exam</button></div>'+
  '</div>';
  document.getElementById('btn-start').onclick=function(){ startExam(); };
}

function startExam(){
  S.order=shuffledOrder();
  S.idx=0; S.credits={}; S.answered={}; S.skipped=[]; S.hintUsed={};
  S.feedbackShown={};
  S.answers={}; S.lastRes={}; S.pauseLog={manualMs:0,autoMs:0,pauseStart:0,autoStart:0};
  S.timer.budget=M.timerSeconds; S.timer.remaining=M.timerSeconds;
  S.prevTimerState=null; S.endedBy='unfinished';
  S.reported=false; S.screen='exam'; S.mode='exam';
  T.setState('RUNNING');
  render();
}

/* ----- exam ----- */
function renderExam(){
  var e=curEx(); if(!e){ nextAfterLast(); return; }
  var head='<div class="exam-head" id="examhead"></div>'+
    '<div class="progress" role="progressbar" aria-label="Exam progress"><div class="bar" id="progressbar"></div></div>';
  if(S.timer.state==='PAUSED_MANUAL'){
    /* MANUAL PAUSE: the exercise is removed from the DOM, not just veiled */
    app.innerHTML=head+'<div id="exzone" class="pausedveil">'+
      '<div class="veil"><div class="big">&#9208; PAUSED &mdash; manual</div><div class="muted">Press Resume to continue.</div><button class="btn primary" id="btn-resume">&#9654; Resume</button></div>'+
      '</div>';
    renderHeader();
    var rr=document.getElementById('btn-resume'); if(rr) rr.onclick=onManualResume;
    return;
  }
  app.innerHTML=head+'<div id="exzone"><div id="exbody"></div></div>';
  renderHeader();
  renderExercise(e);
  /* feedback persists across Pause/Resume and re-entry into an answered exercise */
  if(S.feedbackShown[e.id] && S.lastRes[e.id]){
    renderFeedback(e, S.credits[e.id]||0, S.lastRes[e.id]);
  }
  var zone=document.getElementById('exzone');
  scrollNow(zone);
}

function onManualPause(){
  if(S.timer.state!=='RUNNING' && S.timer.state!=='PAUSED_AUTO_CHECK') return;
  S.prevTimerState=S.timer.state;
  T.setState('PAUSED_MANUAL');
  renderExam();
}
function onManualResume(){
  T.setState(S.prevTimerState==='PAUSED_AUTO_CHECK'?'PAUSED_AUTO_CHECK':'RUNNING');
  renderExam();
}

function onHint(){
  var e=curEx(); if(!e) return;
  if(S.hintUsed[e.id]) return;
  if(S.feedbackShown[e.id]) return;
  S.hintUsed[e.id]=true;
  var hp=document.getElementById('hintpanel');
  if(hp){ hp.classList.remove('hidden'); hp.setAttribute('aria-hidden','false'); }
  var b=document.getElementById('btn-hint'); if(b){ b.disabled=true; }
}

function onSkip(){
  var e=curEx(); if(!e) return;
  if(S.feedbackShown[e.id]){ /* already graded: Skip acts as Next */
    if(S.timer.state==='PAUSED_AUTO_CHECK'){ T.setState('RUNNING'); }
    var last=(S.idx===S.order.length-1);
    if(last){ if(S.skipped.length>0){ S.screen='review'; render(); } else finishExam(); }
    else advance(true);
    return;
  }
  if(S.skipped.indexOf(e.id)<0){ S.skipped.push(e.id); }
  advance(false);
}

/* advance: from Next or Skip. checked=true when moving past a checked exercise */
function advance(checked){
  var e=curEx();
  if(checked && e){
    var p=S.skipped.indexOf(e.id);
    if(p>=0){ S.skipped.splice(p,1); }
  }
  S.idx++;
  if(S.idx>=S.order.length){
    if(S.skipped.length>0){ S.screen='review'; render(); }
    else { nextAfterLast(); }
    return;
  }
  render();
}
function nextAfterLast(){
  /* safety net: anything never visited and unanswered joins the review pool */
  S.order.forEach(function(id){
    if(!S.answered[id] && S.skipped.indexOf(id)<0){ S.skipped.push(id); }
  });
  if(S.skipped.length>0){ S.screen='review'; render(); }
  else finishExam();
}
function finishExam(){
  S.timer.state='ENDED'; T.stopTick();
  S.screen='results'; render();
}

/* ---------- exercise renderers ---------- */
function renderExercise(e){
  var body=document.getElementById('exbody');
  body.innerHTML='';
  var card=el('div','card');
  card.setAttribute('data-ex',e.id);
  var already = S.feedbackShown[e.id];
  var sumline=e.summary||e.title;
  var scen='<div class="collhead"><div><h2 style="font-size:16px;letter-spacing:.4px">SCENARIO</h2>'+
    '<div class="sumline">'+esc(sumline)+(already?' &mdash; collapsed':'')+'</div></div>'+
    '<button class="ct" id="colltoggle" aria-expanded="true">Collapse</button></div>'+
    '<div class="collbody" id="collbody">'+e.scenario;
  (e.artifacts||[]).forEach(function(a,i){
    scen+='<div class="artefact"><div class="alabel"><span>ARTEFACT '+(i+1)+' &mdash; '+esc(a.label)+'</span></div><pre class="code">'+a.code+'</pre></div>';
  });
  scen+='</div>';
  card.innerHTML=scen;

  var ab=el('div','block block-question');
  ab.innerHTML='<div class="bh">&#10067; QUESTION</div><div class="qtext">'+e.question+'</div>';
  if(e.hint){
    ab.appendChild(el('div','hintpanel hidden','<div class="hh">&#128161; Hint (one only &mdash; 10% of this exercise credit)</div><div>'+e.hint+'</div>'));
    ab.lastChild.id='hintpanel'; ab.lastChild.setAttribute('aria-hidden','true');
  }
  card.appendChild(ab);

  var answ=el('div','block block-answer');
  answ.innerHTML='<div class="bh">&#9999; YOUR ANSWER</div>';
  var widget=el('div'); widget.id='widget'; answ.appendChild(widget);
  card.appendChild(answ);
  body.appendChild(card);

  /* collapsible behaviour */
  var ctog=card.querySelector('#colltoggle'), cbody=card.querySelector('#collbody');
  ctog.onclick=function(){
    var hid=cbody.classList.toggle('hidden');
    ctog.textContent=hid?'Expand':'Collapse';
    ctog.setAttribute('aria-expanded',hid?'false':'true');
  };

  RENDER[e.type](e,widget);

  /* nav row */
  var nav=el('div','btnrow');
  if(already){
    nav.innerHTML='<button class="btn primary" id="btn-next">'+(S.idx===S.order.length-1?'Final Submit &#10140;':'Next &#10140;')+'</button>';
  }else{
    nav.innerHTML='<button class="btn primary" id="btn-check">&#10003; Check</button>';
  }
  body.appendChild(nav);
  if(already){ bindNext(); } else { document.getElementById('btn-check').onclick=function(){ onCheck(e); }; }
}
function bindNext(){
  var b=document.getElementById('btn-next'); if(!b) return;
  b.onclick=function(){
    if(S.timer.state==='PAUSED_AUTO_CHECK'){ T.setState('RUNNING'); }
    if(S.mode==='review'){
      /* returning from a review answer: back to the review list */
      var cur=curEx();
      if(cur){ var pp=S.skipped.indexOf(cur.id); if(pp>=0){ S.skipped.splice(pp,1); } }
      if(S.skipped.length>0){ S.screen='review'; render(); }
      else finishExam();
      return;
    }
    var last=(S.idx===S.order.length-1);
    if(last){
      if(S.skipped.length>0){ S.screen='review'; render(); }
      else finishExam();
    } else {
      advance(true);
    }
  };
}

function onCheck(e){
  var res=GRADER[e.type](e);
  if(res===null){ /* nothing answered yet: nudge */
    var w=document.getElementById('widget');
    var nudge=w.querySelector('.nudge');
    if(!nudge){ nudge=el('div','small','<span style="color:var(--state-partial)">&#9888;</span> Choose an answer first, then press Check.'); w.insertBefore(nudge,w.firstChild); }
    return;
  }
  var credit=res.credit;
  if(S.hintUsed[e.id]) credit=Math.max(0,credit-0.10);
  credit=Math.round(credit*10000)/10000;
  S.credits[e.id]=credit; S.answered[e.id]=true; S.feedbackShown[e.id]=true;
  S.lastRes[e.id]=res;
  /* CHECK-TRIGGERED AUTO-PAUSE: first action, before rendering feedback */
  if(S.timer.state==='RUNNING'){ T.setState('PAUSED_AUTO_CHECK'); }
  renderHeader();
  renderExercise(e);
  renderFeedback(e,credit,res);
  var zone=document.getElementById('exzone'); if(zone) scrollNow(zone);
}

function renderFeedback(e,credit,res){
  var old=document.getElementById('fbzone'); if(old) old.remove();
  var zone=document.getElementById('exbody');
  var cls,lab,icon;
  if(credit>=0.999){ cls='fb-correct'; lab='CORRECT'; icon='&#10003;'; }
  else if(credit>0){ cls='fb-partial'; lab='PARTIALLY CORRECT'; icon='&#10003;'; }
  else { cls='fb-incorrect'; lab='INCORRECT'; icon='&#10007;'; }
  var fb=el('div','fb '+cls); fb.id='fbzone';
  var head='<div class="fbh"><span>'+icon+'</span> '+lab;
  if(res.n>1) head+=' <span class="credit">credit '+credit.toFixed(2)+' &mdash; '+res.h+' / '+res.n+' items</span>';
  if(res.dangerous) head+=' <span class="pill" style="color:var(--state-incorrect);border-color:var(--state-incorrect)">&#10007; DANGEROUS &mdash; NEAR MISS</span>';
  head+='</div>';
  var rows='';
  (res.rows||[]).forEach(function(r){
    var ic,cl;
    if(r.state==='ok'){ ic='&#10003; Correct'; cl='ic-ok'; }
    else if(r.state==='bad'){ ic='&#10007; Wrong'; cl='ic-bad'; }
    else if(r.state==='miss'){ ic='&#9675; Missed'; cl='ic-miss'; }
    else { ic='&#9679; Info'; cl='ic-part'; }
    rows+='<div class="itemrow"><span class="ic '+cl+'">'+ic+'</span><span><b>'+r.label+'</b>'+(r.why?' &mdash; '+r.why:'')+'</span></div>';
  });
  var study='';
  if(credit<0.999 && e.study) study='<div class="study"><b>What to study:</b> '+e.study+'</div>';
  var canon='';
  if(e.type==='terminal' && e.canonical){
    canon='<div class="artefact"><div class="alabel"><span>CANONICAL COMMAND &mdash; copyable</span>'+
      '<button type="button" class="ct" id="copycanon" aria-label="Copy canonical command">Copy</button></div>'+
      '<pre class="code" id="cmdcanon">'+esc(e.canonical)+'</pre></div>';
  }
  fb.innerHTML=head+canon+rows+'<div class="explain">'+e.explain+'</div>'+study;
  var copyBtn=fb.querySelector('#copycanon');
  if(copyBtn){ copyBtn.onclick=function(){
    var txt=e.canonical;
    try{ navigator.clipboard.writeText(txt); copyBtn.textContent='Copied'; }catch(err){ copyBtn.textContent='Select & copy'; }
    setTimeout(function(){ copyBtn.textContent='Copy'; },1500);
  }; }
  var navzone=zone.querySelector('.btnrow');
  zone.insertBefore(fb,navzone);
}

/* ----- render + grade per type ----- */
var RENDER={}; var GRADER={};

/* choice */
RENDER.choice=function(e,w){
  var order=shuffle(e.options.map(function(o){return o.id;}));
  S.answers[e.id+'_order']=order;
  var wrap=el('div','opts');
  order.forEach(function(oid,i){
    var o=e.options.filter(function(x){return x.id===oid;})[0];
    var b=el('button','opt'); b.type='button'; b.setAttribute('data-oid',oid);
    b.innerHTML='<span class="olabel">'+letters(i)+'.</span><span>'+o.text+' <span class="selmark">&#9679; selected</span></span>';
    b.onclick=function(){
      if(S.feedbackShown[e.id]) return;
      wrap.querySelectorAll('.opt').forEach(function(x){ x.classList.remove('selected'); });
      b.classList.add('selected'); b.setAttribute('aria-pressed','true');
      S.answers[e.id]=oid;
      var n=w.querySelector('.nudge'); if(n) n.remove();
    };
    wrap.appendChild(b);
  });
  w.appendChild(wrap);
};
GRADER.choice=function(e){
  var pick=S.answers[e.id];
  if(!pick) return null;
  var ok=(pick===e.correctId);
  var rows=e.options.map(function(o){
    if(o.id===e.correctId) return {label:o.plain,state:ok&&pick===o.id?'ok':'miss',why:o.why};
    if(o.id===pick) return {label:o.plain,state:'bad',why:o.why};
    return null;
  }).filter(Boolean);
  return {credit:ok?1:0,h:ok?1:0,n:1,rows:rows};
};

/* multi */
RENDER.multi=function(e,w){
  var order=shuffle(e.options.map(function(o){return o.id;}));
  S.answers[e.id+'_order']=order;
  var wrap=el('div','opts');
  order.forEach(function(oid,i){
    var o=e.options.filter(function(x){return x.id===oid;})[0];
    var b=el('button','opt'); b.type='button'; b.setAttribute('data-oid',oid);
    b.innerHTML='<span class="olabel">'+letters(i)+'.</span><span>'+o.text+' <span class="selmark">&#9679; selected</span></span>';
    b.onclick=function(){
      if(S.feedbackShown[e.id]) return;
      var on=b.classList.toggle('selected');
      b.setAttribute('aria-pressed',on?'true':'false');
      var set=S.answers[e.id]||[]; set=on?set.concat([oid]):set.filter(function(x){return x!==oid;});
      S.answers[e.id]=set;
      var n=w.querySelector('.nudge'); if(n&&set.length) n.remove();
    };
    wrap.appendChild(b);
  });
  w.appendChild(wrap);
};
GRADER.multi=function(e){
  var pick=S.answers[e.id]; if(!pick||!pick.length) return null;
  var h=0,wr=0,rows=[];
  e.options.forEach(function(o){
    var sel=pick.indexOf(o.id)>=0, corr=e.correctIds.indexOf(o.id)>=0;
    if(sel&&corr){ h++; rows.push({label:o.plain,state:'ok',why:o.why}); }
    else if(sel&&!corr){ wr++; rows.push({label:o.plain,state:'bad',why:o.why}); }
    else if(!sel&&corr){ rows.push({label:o.plain,state:'miss',why:o.why}); }
  });
  return {credit:scoreExercise(h,wr,e.correctIds.length),h:h,n:e.correctIds.length,rows:rows};
};

/* dnd (click-to-place + HTML5 drag) */
RENDER.dnd=function(e,w){
  var items=shuffle(e.items.map(function(x){return x.id;}));
  S.answers[e.id]={placed:{},sel:null};
  var bank=el('div','bank'); bank.id='bank_'+e.id;
  items.forEach(function(iid){
    var it=e.items.filter(function(x){return x.id===iid;})[0];
    var d=el('button','ditem'); d.type='button'; d.draggable=true; d.setAttribute('data-iid',iid);
    d.innerHTML='&#8942;&#8942; '+it.label;
    d.onclick=function(){ if(S.feedbackShown[e.id])return;
      bank.querySelectorAll('.ditem').forEach(function(x){x.classList.remove('sel');});
      d.classList.add('sel'); S.answers[e.id].sel=iid; };
    d.ondragstart=function(ev){ ev.dataTransfer.setData('text/plain',iid); d.classList.add('dragging'); };
    d.ondragend=function(){ d.classList.remove('dragging'); };
    bank.appendChild(d);
  });
  w.appendChild(el('div','small muted','Click an item, then click the right panel. You can also drag the items. Return an item with its &times; button.'));
  w.appendChild(bank);
  var bwrap=el('div','buckets');
  e.buckets.forEach(function(b){
    var bd=el('div','bucket'); bd.setAttribute('data-bid',b.id);
    bd.innerHTML='<h5>'+b.label+'</h5>'+(b.hint?'<div class="bhint">'+b.hint+'</div>':'')+'<div class="chips"></div>';
    bd.onclick=function(){
      var sel=S.answers[e.id].sel; if(!sel||S.feedbackShown[e.id]) return;
      place(e,sel,bd); S.answers[e.id].sel=null;
      bank.querySelectorAll('.ditem').forEach(function(x){x.classList.remove('sel');});
    };
    bd.ondragover=function(ev){ ev.preventDefault(); bd.classList.add('over'); };
    bd.ondragleave=function(){ bd.classList.remove('over'); };
    bd.ondrop=function(ev){ ev.preventDefault(); bd.classList.remove('over');
      if(S.feedbackShown[e.id])return; place(e,ev.dataTransfer.getData('text/plain'),bd); };
    bwrap.appendChild(bd);
  });
  w.appendChild(bwrap);
  function place(e2,iid,bd){
    if(!iid) return;
    var it=e2.items.filter(function(x){return x.id===iid;})[0];
    var src=document.getElementById('bank_'+e2.id).querySelector('[data-iid="'+iid+'"]');
    if(!src) return; /* already placed: move back to bank first */
    src.remove();
    var chip=el('div','chipx'); chip.setAttribute('data-iid',iid);
    chip.innerHTML='<span>'+it.label+'</span>';
    var x=el('button','','&times;'); x.setAttribute('aria-label','Return item '+iid);
    x.onclick=function(ev){ ev.stopPropagation();
      if(S.feedbackShown[e2.id])return;
      chip.remove(); delete S.answers[e2.id].placed[iid];
      document.getElementById('bank_'+e2.id).appendChild(src);
    };
    chip.appendChild(x); bd.querySelector('.chips').appendChild(chip);
    S.answers[e2.id].placed[iid]=bd.getAttribute('data-bid');
  }
};
GRADER.dnd=function(e){
  var a=S.answers[e.id]||{placed:{}};
  var placedCount=Object.keys(a.placed).length;
  if(placedCount===0) return null;
  var h=0,wr=0,rows=[];
  e.items.forEach(function(it){
    var got=a.placed[it.id];
    var good=e.buckets.filter(function(b){return b.id===got;})[0];
    var goodBucket=good&&good.accepts.indexOf(it.id)>=0;
    if(got&&goodBucket){ h++; rows.push({label:it.label+' &rarr; '+good.label,state:'ok',why:it.why}); }
    else if(got){ wr++; var g2=e.buckets.filter(function(b){return b.id===got;})[0];
      rows.push({label:it.label+' &rarr; '+(g2?g2.label:'?'),state:'bad',why:it.why}); }
    else { rows.push({label:it.label+' (not placed)',state:'miss',why:it.why}); }
  });
  return {credit:scoreExercise(h,wr,e.items.length),h:h,n:e.items.length,rows:rows};
};

/* match */
RENDER.match=function(e,w){
  var rights=shuffle(e.rights.map(function(x){return x.id;}));
  S.answers[e.id]={pairs:{},selLeft:null};
  w.appendChild(el('div','small muted','Click one card on the left, then its partner on the right. Click a made pair to undo it.'));
  var wrap=el('div','matchwrap');
  var lcol=el('div','mcol'), rcol=el('div','mcol');
  e.lefts.forEach(function(l){
    var b=el('button','ditem'); b.type='button'; b.setAttribute('data-lid',l.id);
    b.innerHTML='&#9635; '+l.label;
    b.onclick=function(){
      if(S.feedbackShown[e.id])return;
      lcol.querySelectorAll('.ditem').forEach(function(x){x.classList.remove('sel');});
      b.classList.add('sel'); S.answers[e.id].selLeft=l.id;
    };
    lcol.appendChild(b);
  });
  rights.forEach(function(rid){
    var r=e.rights.filter(function(x){return x.id===rid;})[0];
    var b=el('button','ditem'); b.type='button'; b.setAttribute('data-rid',rid);
    b.innerHTML=r.label;
    b.onclick=function(){
      if(S.feedbackShown[e.id])return;
      var lid=S.answers[e.id].selLeft; if(!lid) return;
      var lb=lcol.querySelector('[data-lid="'+lid+'"]');
      lb.classList.remove('sel'); S.answers[e.id].selLeft=null;
      /* if this right card already paired, unpair it */
      var prev=Object.keys(S.answers[e.id].pairs).filter(function(k){return S.answers[e.id].pairs[k]===rid;})[0];
      if(prev!==undefined){ delete S.answers[e.id].pairs[prev]; unpairLine(e,prev); }
      if(S.answers[e.id].pairs[lid]){ unpairLine(e,lid); }
      S.answers[e.id].pairs[lid]=rid;
      var pl=document.getElementById('pairs_'+e.id);
      var line=el('div','pairline'); line.id='pair_'+lid;
      var lt=e.lefts.filter(function(x){return x.id===lid;})[0];
      line.innerHTML='&#8594; <b>'+lt.label+'</b> matched with <b>'+r.label+'</b> <button type="button" style="background:none;border:none;color:var(--text-secondary);cursor:pointer" aria-label="Undo pair">&times;</button>';
      line.querySelector('button').onclick=function(){ if(S.feedbackShown[e.id])return; unpair(e,lid); };
      pl.appendChild(line);
      var n=w.querySelector('.nudge'); if(n&&Object.keys(S.answers[e.id].pairs).length) n.remove();
    };
    rcol.appendChild(b);
  });
  wrap.appendChild(lcol); wrap.appendChild(rcol); w.appendChild(wrap);
  w.appendChild(el('div','','<div id="pairs_'+e.id+'" style="margin-top:10px"></div>'));
  function unpairLine(e2,lid){ var ln=document.getElementById('pair_'+lid); if(ln) ln.remove(); }
  function unpair(e2,lid){ delete S.answers[e2.id].pairs[lid]; unpairLine(e2,lid); }
};
GRADER.match=function(e){
  var a=S.answers[e.id]||{pairs:{}};
  if(Object.keys(a.pairs).length===0) return null;
  var h=0,wr=0,rows=[];
  e.lefts.forEach(function(l){
    var got=a.pairs[l.id];
    var r=got?e.rights.filter(function(x){return x.id===got;})[0]:null;
    if(got&&got===e.correct[l.id]){ h++; rows.push({label:l.label+' &rarr; '+r.label,state:'ok',why:l.why}); }
    else if(got){ wr++; rows.push({label:l.label+' &rarr; '+r.label,state:'bad',why:l.why}); }
    else { rows.push({label:l.label+' (unpaired)',state:'miss',why:l.why}); }
  });
  return {credit:scoreExercise(h,wr,e.lefts.length),h:h,n:e.lefts.length,rows:rows};
};

/* order / rank */
RENDER.order=function(e,w){
  var items=shuffle(e.items.map(function(x){return x.id;}));
  S.answers[e.id]=items;
  w.appendChild(el('div','small muted','Put the items in the right order. Use the arrows or drag an item onto another item.'));
  var list=el('div','orderlist'); list.id='olist_'+e.id;
  w.appendChild(list);
  function draw(){
    list.innerHTML='';
    S.answers[e.id].forEach(function(iid,i){
      var it=e.items.filter(function(x){return x.id===iid;})[0];
      var row=el('div','oitem'); row.draggable=true; row.setAttribute('data-iid',iid);
      row.innerHTML='<span class="onum">'+(i+1)+'</span><span class="otxt">'+it.label+'</span>'+
        '<span class="mv"><button type="button" data-d="-1" aria-label="Move up">&#9650;</button><button type="button" data-d="1" aria-label="Move down">&#9660;</button></span>';
      row.querySelector('[data-d="-1"]').onclick=function(){ if(S.feedbackShown[e.id])return; move(i,-1); };
      row.querySelector('[data-d="1"]').onclick=function(){ if(S.feedbackShown[e.id])return; move(i,1); };
      row.ondragstart=function(ev){ ev.dataTransfer.setData('text/plain',String(i)); };
      row.ondragover=function(ev){ ev.preventDefault(); };
      row.ondrop=function(ev){ ev.preventDefault(); if(S.feedbackShown[e.id])return;
        var from=parseInt(ev.dataTransfer.getData('text/plain'),10); if(isNaN(from))return;
        var arr=S.answers[e.id]; var m=arr.splice(from,1)[0]; arr.splice(i,0,m); draw(); };
      list.appendChild(row);
    });
  }
  function move(i,d){
    var arr=S.answers[e.id]; var j=i+d; if(j<0||j>=arr.length) return;
    var t=arr[i]; arr[i]=arr[j]; arr[j]=t; draw();
  }
  draw();
};
GRADER.order=function(e){
  var a=S.answers[e.id]; if(!a||!a.length) return null;
  var h=0,wr=0,rows=[];
  a.forEach(function(iid,pos){
    var it=e.items.filter(function(x){return x.id===iid;})[0];
    if(e.items[pos].id===iid){ h++; rows.push({label:'Position '+(pos+1)+': '+it.label,state:'ok',why:it.why}); }
    else { wr++; rows.push({label:'Position '+(pos+1)+': '+it.label,state:'bad',why:it.why+' (correct here: '+e.items[pos].label+')'}); }
  });
  return {credit:scoreExercise(h,wr,e.items.length),h:h,n:e.items.length,rows:rows};
};

/* fill (typed blanks; graded case-insensitive with whitespace normalised) */
RENDER.fill=function(e,w){
  S.answers[e.id]={};
  var line=el('div','fillline');
  e.segments.forEach(function(seg){
    if(seg.t==='txt'){ line.appendChild(document.createTextNode(seg.v)); }
    else {
      var s=el('input','fillblank'); s.type='text'; s.setAttribute('data-bid',seg.id);
      s.setAttribute('aria-label','Blank '+seg.id+' ('+seg.name+')');
      s.placeholder='type here'; s.autocomplete='off'; s.spellcheck=false;
      s.oninput=function(){ S.answers[e.id][seg.id]=s.value; var n=w.querySelector('.nudge'); if(n&&s.value)n.remove(); };
      line.appendChild(s);
    }
  });
  w.appendChild(line);
  if(e.bank&&e.bank.length){
    w.appendChild(el('div','small muted','Word bank for reference (some entries are decoys): '+e.bank.map(esc).join(' &middot; ')));
  }
};
GRADER.fill=function(e){
  var a=S.answers[e.id]||{};
  var any=e.blanks.some(function(b){ return a[b.id]&&String(a[b.id]).trim()!==''; });
  if(!any) return null;
  var h=0,wr=0,rows=[];
  e.blanks.forEach(function(b){
    var raw=(a[b.id]!==undefined)?String(a[b.id]):'';
    if(raw.trim()&&normText(raw)===normText(b.correct)){ h++; rows.push({label:'Blank "'+b.name+'": '+esc(raw),state:'ok',why:b.why}); }
    else if(raw.trim()){ wr++; rows.push({label:'Blank "'+b.name+'": '+esc(raw),state:'bad',why:b.why+' (correct: '+esc(b.correct)+')'}); }
    else { rows.push({label:'Blank "'+b.name+'" (left empty)',state:'miss',why:b.why}); }
  });
  return {credit:scoreExercise(h,wr,e.blanks.length),h:h,n:e.blanks.length,rows:rows};
};

/* tag (log lines tagged with chips) */
RENDER.tag=function(e,w){
  var lines=shuffle(e.lines.map(function(x){return x.id;}));
  S.answers[e.id]={};
  w.appendChild(el('div','small muted','Give every line the right tag from the buttons on its right. Tags: '+e.tags.map(function(t){return t.label;}).join(' · ')));
  lines.forEach(function(lid){
    var l=e.lines.filter(function(x){return x.id===lid;})[0];
    var row=el('div','tagline');
    row.innerHTML='<code>'+l.text+'</code>';
    var btns=el('div','tagbtns');
    e.tags.forEach(function(t){
      var b=el('button','tagbtn'); b.type='button'; b.textContent=t.label; b.setAttribute('data-t',t.id);
      b.onclick=function(){
        if(S.feedbackShown[e.id])return;
        row.querySelectorAll('.tagbtn').forEach(function(x){x.classList.remove('on');});
        b.classList.add('on'); S.answers[e.id][lid]=t.id;
        var n=w.querySelector('.nudge'); if(n)n.remove();
      };
      btns.appendChild(b);
    });
    row.appendChild(btns); w.appendChild(row);
  });
};
GRADER.tag=function(e){
  var a=S.answers[e.id]||{};
  var any=e.lines.some(function(l){ return a[l.id]; });
  if(!any) return null;
  var h=0,wr=0,rows=[];
  e.lines.forEach(function(l){
    var got=a[l.id];
    var correctTag=null; e.tags.forEach(function(t){ if(t.accepts.indexOf(l.id)>=0) correctTag=t.id; });
    var correctLabel=correctTag?e.tags.filter(function(t){return t.id===correctTag;})[0].label:'?';
    var gotLabel=got?e.tags.filter(function(t){return t.id===got;})[0].label:'—';
    if(got&&got===correctTag){ h++; rows.push({label:'Line "'+l.short+'": '+gotLabel,state:'ok',why:l.why}); }
    else if(got){ wr++; rows.push({label:'Line "'+l.short+'": '+gotLabel,state:'bad',why:l.why+' (correct: '+correctLabel+')'}); }
    else { rows.push({label:'Line "'+l.short+'" (untagged)',state:'miss',why:l.why}); }
  });
  return {credit:scoreExercise(h,wr,e.lines.length),h:h,n:e.lines.length,rows:rows};
};

/* click (click the meaningful tokens/lines) */
RENDER.click=function(e,w){
  S.answers[e.id]=[];
  if(e.filterable){
    var fwrap=el('div','synpanel');
    fwrap.innerHTML='<div class="sp-h">Log viewer &mdash; filter</div><input id="logfilter" class="ddsel" style="width:100%" type="text" placeholder="type to filter lines (e.g. bcdedit)" aria-label="Filter log lines">';
    w.appendChild(fwrap);
  }
  var wrap=el('div','clickwrap');
  e.paragraphs.forEach(function(p){
    var pel=el('p');
    if(e.filterable){ pel.className='fline'; pel.setAttribute('data-f',(p.line||'')); pel.style.padding='6px 8px'; pel.style.borderBottom='1px dashed var(--border)'; }
    p.tokens.forEach(function(tok){
      var s=el('span','tok'); s.textContent=' '+tok.v+' ';
      s.setAttribute('data-tid',tok.id||'');
      if(tok.id){
        s.onclick=function(){ if(S.feedbackShown[e.id])return;
          var on=s.classList.toggle('sel');
          var set=S.answers[e.id];
          if(on){ if(set.indexOf(tok.id)<0) set.push(tok.id); } else { set=set.filter(function(x){return x!==tok.id;}); }
          S.answers[e.id]=set;
          var n=w.querySelector('.nudge'); if(n&&set.length)n.remove();
        };
      } else { s.style.cursor='default'; }
      pel.appendChild(s);
    });
    wrap.appendChild(pel);
  });
  w.appendChild(wrap);
  w.appendChild(el('div','small muted',e.clickInstruction||'Click the parts that answer the question. Click again to unselect.'));
  if(e.filterable){
    var fi=wrap.ownerDocument.getElementById('logfilter');
    fi.addEventListener('input',function(){
      var q=fi.value.toLowerCase();
      wrap.querySelectorAll('.fline').forEach(function(ln){
        var hay=(ln.getAttribute('data-f')||ln.textContent).toLowerCase();
        ln.style.display=(hay.indexOf(q)>=0)?'':'none';
      });
    });
  }
};
GRADER.click=function(e){
  var a=S.answers[e.id]||[]; if(!a.length) return null;
  var h=0,wr=0,rows=[];
  e.correctTokens.forEach(function(ct){
    var lbl=e.tokenInfo[ct].label, why=e.tokenInfo[ct].why;
    if(a.indexOf(ct)>=0){ h++; rows.push({label:lbl,state:'ok',why:why}); }
    else { rows.push({label:lbl,state:'miss',why:why}); }
  });
  a.forEach(function(t){
    if(e.correctTokens.indexOf(t)<0){
      wr++; rows.push({label:e.tokenInfo[t].label,state:'bad',why:e.tokenInfo[t].why});
    }
  });
  return {credit:scoreExercise(h,wr,e.correctTokens.length),h:h,n:e.correctTokens.length,rows:rows};
};

/* terminal */
RENDER.terminal=function(e,w){
  S.answers[e.id]={last:''};
  if(e.syntaxPanel){
    w.appendChild(el('div','synpanel','<div class="sp-h">Syntax reminder</div>'+e.syntaxPanel));
  }
  if(e.expectedOutput){
    w.appendChild(el('div','synpanel','<div class="sp-h">Expected output shape</div><pre class="code">'+e.expectedOutput+'</pre>'));
  }
  var term=el('div','term');
  term.innerHTML='<div class="tscroll" id="tsc_'+e.id+'"></div>'+
    '<div class="tin"><span class="tprompt">'+e.prompt+'</span><input id="tin_'+e.id+'" type="text" autocomplete="off" spellcheck="false" aria-label="Type your command">'+
    '<button type="button" class="btn ghost" id="run_'+e.id+'" aria-label="Run command">&#9166; Run</button></div>';
  w.appendChild(term);
  var sc=term.querySelector('.tscroll');
  function push(html){ var l=el('div','tline'); l.innerHTML=html; sc.appendChild(l); sc.scrollTop=sc.scrollHeight; }
  push('<span class="cmt">'+esc(e.banner||'Simulation shell. Type the command you judge correct, then press Check to grade it.')+'</span>');
  var inp=term.querySelector('input');
  function run(){
      var v=inp.value; inp.value='';
      push('<span class="tprompt">'+esc(e.prompt)+'</span>'+esc(v));
      S.answers[e.id].last=v;
      var norm=normalise(v);
      var matched=e.dangerous.some(function(d){ return RX(d.re).test(norm); });
      var expected=e.elements.every(function(elx){ return RX(elx.re).test(norm); });
      if(expected){ push('<span class="okv">[simulated] command accepted \u2014 simulated output below.</span>');
        (e.simOutput||[]).forEach(function(o){ push(esc(o)); }); }
      else if(matched){ push('<span class="errv">[simulated] command executed \u2014 WARNING: this changes state on a live system.</span>'); }
      else { push('<span class="errv">command not recognised in this simulation</span>'); }
  }
  inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter'){ run(); } });
  term.querySelector('#run_'+e.id).addEventListener('click',function(){ run(); });
};
function normalise(cmd){
  return String(cmd).toLowerCase().replace(/\s+/g,' ').trim();
}
function RX(r){
  if(r instanceof RegExp) return r;
  try{ return new RegExp(r,'i'); }catch(e){ return { test:function(){ return false; } }; }
}
GRADER.terminal=function(e){
  var a=S.answers[e.id]||{last:''};
  if(!a.last) return null;
  var norm=normalise(a.last);
  var h=0,wr=0,rows=[];
  e.elements.forEach(function(elx){
    if(RX(elx.re).test(norm)){ h++; rows.push({label:elx.label,state:'ok',why:elx.why}); }
    else { rows.push({label:elx.label,state:'miss',why:elx.why}); }
  });
  e.dangerous.forEach(function(d){
    if(RX(d.re).test(norm)){ wr++; rows.push({label:'DANGEROUS element: '+d.label,state:'bad',why:d.why}); }
  });
  var n=e.elements.length;
  return {credit:scoreExercise(h,wr,n),h:h,n:n,rows:rows,dangerous:wr>0};
};

/* branch (multi-step decision tree) */
RENDER.branch=function(e,w){
  S.answers[e.id]={};
  var holder=el('div');
  w.appendChild(holder);
  e.steps.forEach(function(st,si){
    var sb=el('div','block block-question'); sb.style.margin='10px 0';
    sb.innerHTML='<div class="bh">STEP '+(si+1)+' OF '+e.steps.length+'</div><div class="qtext" style="font-weight:600;font-size:15.5px">'+st.prompt+'</div>';
    var ow=el('div','opts');
    shuffle(st.options.map(function(o){return o.id;})).forEach(function(oid,i){
      var o=st.options.filter(function(x){return x.id===oid;})[0];
      var b=el('button','opt'); b.type='button'; b.setAttribute('data-oid',oid);
      b.innerHTML='<span class="olabel">'+letters(i)+'.</span><span>'+o.text+' <span class="selmark">&#9679; selected</span></span>';
      b.onclick=function(){
        if(S.feedbackShown[e.id])return;
        ow.querySelectorAll('.opt').forEach(function(x){x.classList.remove('selected'); x.removeAttribute('aria-pressed');});
        b.classList.add('selected'); b.setAttribute('aria-pressed','true');
        S.answers[e.id][st.id]=oid;
        var n=w.querySelector('.nudge'); if(n)n.remove();
      };
      ow.appendChild(b);
    });
    sb.appendChild(ow); holder.appendChild(sb);
  });
};
GRADER.branch=function(e){
  var a=S.answers[e.id]||{};
  var any=e.steps.some(function(s){ return a[s.id]; });
  if(!any) return null;
  var h=0,wr=0,rows=[];
  e.steps.forEach(function(s){
    var got=a[s.id];
    var co=s.options.filter(function(o){return o.id===s.correctId;})[0];
    if(got&&got===s.correctId){ h++; rows.push({label:s.label,state:'ok',why:co.why}); }
    else if(got){ var wo=s.options.filter(function(o){return o.id===got;})[0];
      wr++; rows.push({label:s.label,state:'bad',why:wo.why+' (best action: '+co.why+')'}); }
    else { rows.push({label:s.label+' (not answered)',state:'miss',why:co.why}); }
  });
  return {credit:scoreExercise(h,wr,e.steps.length),h:h,n:e.steps.length,rows:rows};
};

/* ---------- review skipped ---------- */
function renderReview(){
  var list='';
  S.skipped.forEach(function(id){
    var e=exById(id);
    list+='<div class="skipcard"><span class="sk">&#9888; Skipped</span><span class="stit">'+esc(e.title)+'</span>'+
      '<button class="btn" data-ans="'+id+'">Answer now</button></div>';
  });
  app.innerHTML=
  '<div class="exam-head" id="examhead"></div>'+
  '<div class="progress" role="progressbar"><div class="bar" id="progressbar"></div></div>'+
  '<div class="card"><h2>Review skipped exercises</h2>'+
  '<p class="sub">These exercises were skipped. You can return to any of them now and answer it. You can do this as many times as you need while the timer is still running. If you submit now, the exercises below are excluded from the score.</p>'+
  list+
  '<div class="btnrow"><button class="btn primary" id="btn-finish">Final Submit &#10140;</button></div></div>';
  renderHeader();
  app.querySelectorAll('[data-ans]').forEach(function(b){
    b.onclick=function(){
      S.idx=S.order.indexOf(b.getAttribute('data-ans'));
      S.screen='exam'; S.mode='review'; render();
    };
  });
  document.getElementById('btn-finish').onclick=function(){ finishExam(); };
  document.getElementById('btn-hint').disabled=true;
  document.getElementById('btn-skip').disabled=true;
}

/* ---------- results ---------- */
function renderResults(){
  var answeredIds=S.order.filter(function(id){ return S.answered[id]; });
  var creditSum=0; answeredIds.forEach(function(id){ creditSum+=S.credits[id]||0; });
  var count=answeredIds.length;
  var percent=count>0?Math.round((creditSum/count)*100):0;
  var passed=percent>=M.passMark;
  var full=0,partial=0,partialAvg=0,zero=0,skippedN=0;
  answeredIds.forEach(function(id){
    var c=S.credits[id]||0;
    if(c>=0.999) full++;
    else if(c>0){ partial++; partialAvg+=c; }
    else zero++;
  });
  /* skipped-and-never-answered = everything in the running order that has no credit */
  S.order.forEach(function(id){ if(!S.answered[id]) skippedN++; });
  if(partial>0) partialAvg=Math.round((partialAvg/partial)*100)/100;
  if(!S.reported) reportScore();
  app.innerHTML=
  '<div class="card center"><h1>Results &mdash; '+esc(M.title)+'</h1>'+
    '<div class="cert '+(passed?'pass':'fail')+'">'+
      '<div class="cl">'+(passed?'&#10003; PASS':'&#10007; FAIL')+'</div>'+
      '<div class="cs">'+creditSum.toFixed(1)+' / '+count+' ('+percent+'%)</div>'+
      '<div class="sub">Computed only over the '+count+' exercises you answered. Pass mark: '+M.passMark+'%.</div>'+
    '</div>'+
    '<div class="result-grid">'+
      '<div class="rescard"><div class="rk" style="color:var(--state-correct)">&#10003; Fully correct</div><div class="rv">'+full+'</div><div class="rn">credit 1.00 each</div></div>'+
      '<div class="rescard"><div class="rk" style="color:var(--state-partial)">&#10003; Partially correct</div><div class="rv">'+partial+'</div><div class="rn">average credit '+(partial>0?partialAvg.toFixed(2):'&mdash;')+'</div></div>'+
      '<div class="rescard"><div class="rk" style="color:var(--state-incorrect)">&#10007; Fully incorrect</div><div class="rv">'+zero+'</div><div class="rn">credit 0.00</div></div>'+
      '<div class="rescard"><div class="rk" style="color:var(--state-skipped)">&#9888; Skipped &mdash; excluded</div><div class="rv">'+skippedN+'</div><div class="rn">not counted in score</div></div>'+
    '</div>'+
    '<div class="pausestats">'+
      '<span>&#9208; Manual pause time: <b>'+fmtDur(S.pauseLog.manualMs)+'</b></span>'+
      '<span>&#9203; Feedback review time (auto-pause): <b>'+fmtDur(S.pauseLog.autoMs)+'</b></span>'+
      '<span>&#9203; Time left when finished: <b>'+fmtTime(S.timer.remaining)+'</b></span>'+
    '</div>'+
    (passed
      ?'<p class="sub" style="margin-top:14px">You passed. Keep the certificate feeling: revisit any exercise explanation by retaking, or move to the next severity tier of this topic.</p>'
      :'<p class="sub" style="margin-top:14px">You did not reach 70%. Restudy the "What to study" pointers, then retake the exam. Questions and options are shuffled on every attempt.</p>')+
    '<div class="btnrow center"><button class="btn primary" id="btn-retake">&#8635; Retake Exam</button></div>'+
  '</div>';
  document.getElementById('btn-retake').onclick=function(){ startExam(); };
  window.scrollTo(0,0);
}

/* ---------- boot ---------- */
render();
/* test/debug handle: introspection for automated QA (contains no scoring logic) */
window.__EXAM_DEBUG__={ S:S, T:T, M:M, EXS:EXS };
})();

</script>
