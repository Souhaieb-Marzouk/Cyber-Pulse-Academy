<style>

.blk-q { background: linear-gradient(180deg, rgba(255,180,84,0.06), transparent 60%), var(--bg-surface); }

@media (max-width: 760px) {

@media (prefers-reduced-motion: reduce) {
  .progress i { transition: none; }
  .progress i::after { animation: none; display: none; }
  * { transition: none !important; }
}

<script type="application/json" id="exam-data">{"meta": {"id": "T1601.001", "name": "Patch System Image", "parent": "T1601 Modify System Image", "domain": "Enterprise", "tactic": "Defense Impairment", "platform": "Network Devices", "topicId": "t1601.001", "version": "2.0", "updated": "12 May 2026", "estMin": 55, "budgetSec": 3300, "siteTitle": "T1601.001 Patch System Image — HARD", "title_tag": "T1601.001 — HARD practice exam", "sev": "HARD", "sevClass": "sev-hard", "sevVar": "var(--sev-hard)", "difficulty": "hard", "batch": 3, "passMark": 70}, "learn": "\n<p>This is the <b>HARD<\/b> tier for <b>T1601.001 — Patch System Image<\/b>, the sub-technique of <b>T1601 — Modify System Image<\/b> where an attacker changes the single-file operating system of a <b>network device<\/b>. At this level the exercises stop holding your hand. Scenarios give you what a stakeholder wants — never a hint about which line to read. Distractors are <b>near misses<\/b>: answers that are correct in a different case but wrong here.<\/p>\n<p>The work you will simulate is senior work. A <b>SOC analyst on an IR bridge<\/b> separates an approved change from an implant under time pressure. A <b>detection engineer<\/b> turns analytic <b>DET0469 / AN1293<\/b> into a tuned SIEM rule. An <b>incident responder<\/b> preserves evidence on an HA pair without dropping traffic. A <b>red teamer<\/b> weighs which patch path survives tonight's reload. A <b>GRC analyst<\/b> defends one control choice against four defensible ones.<\/p>\n<p>Expect three artefacts to read together: TACACS+ accounting, syslog, config diffs, hash tables. Expect the obvious answer to be wrong in a third of the exercises. Every Check gives you unlimited review time — use it; the item-by-item feedback is where the learning happens.<\/p>\n", "keywords": [{"theme": "Discrimination drills", "items": ["Approved change vs T1601.001 implant", "Storage-patch evidence vs memory-patch absence", "Device CLI output vs independent hash", "TACACS+ gap interpretation"]}, {"theme": "Chain & persistence", "items": ["Upload → boot variable → reload chain", "Storage patch survives reboot", "Memory-only patch lost on reboot", "ROMMONkit (T1542.004) bootloader persistence", "T1601.002 downgrade combo", "T1542.005 TFTP Boot"]}, {"theme": "Detection engineering", "items": ["DET0469 / AN1293 rule logic", "Window & ticket correlation", "Baseline hash verification", "Data components DC0064 / DC0061 / DC0004", "False CLI output (patched show version)"]}, {"theme": "Response & evidence", "items": ["Evidence before state change", "OOB isolation on HA pairs", "Rebuild from vendor-signed golden image", "Post-rebuild verification"]}, {"theme": "Controls under budget", "items": ["M1046 Boot Integrity vs already-deployed M1045", "M1032 TACACS+/RADIUS MFA", "M1026 Privileged Account Management", "Vendor-signed golden images"]}], "howExtra": "<li><b>HARD rules of engagement:<\/b> expect near-miss answers that are right in another case, one 'looks alarming but is benign' row, one 'looks benign but is alarming' row, and at least one exercise where the obvious answer is wrong. Hints remove one wrong path — they never name the answer.<\/li>", "exercises": [{"id": "H01", "type": "logview", "persp": "def", "summary": "Separate the approved push from the implant", "scenario": "<p>02:00–09:00 shift, IR bridge already warming up. Approved change <b>CM-2481<\/b> allows image work on <b>border-rtr-03<\/b> between <b>22:00 and 02:00<\/b>. Three artefacts below. State the anomaly precisely.<\/p>", "artefacts": [{"label": "Artefact 1 — TACACS+ command accounting", "filter": true, "code": "Nov 08 23:10:44 acct: user=netops on border-rtr-03 (vty0): copy scp://10[.]44[.]9[.]200/golden/ios-17.9.5a.bin flash:\nNov 08 23:12:02 acct: user=netops on border-rtr-03 (vty0): verify /md5 flash:ios-17.9.5a.bin\n!!Nov 09 02:47:19 acct: user=svc_backup on border-rtr-03 (vty3, 10[.]52[.]8[.]7): copy tftp://10[.]52[.]8[.]7/ios-image.bin flash:\n!!Nov 09 02:48:55 acct: user=svc_backup on border-rtr-03 (vty3): conf t\n!!Nov 09 02:49:10 acct: user=svc_backup on border-rtr-03 (vty3): boot system flash:ios-image.bin\nNov 09 02:58:41 acct: user=svc_backup on border-rtr-03 (vty3): reload"}, {"label": "Artefact 2 — Transfer log", "code": "Nov 08 23:10:12 scp-server: netops fetched ios-17.9.5a.bin (signed build, ticket CM-2481)\n!!Nov 09 02:46:58 tftp-daemon: PUT ios-image.bin from 10[.]52[.]8[.]7 (guest-vlan-40 lease)"}, {"label": "Artefact 3 — CMDB note", "code": "10[.]52[.]8[.]7 = unmanaged lab laptop, guest VLAN 40, no service account 'svc_backup' assigned\nChange window CM-2481: 22:00-02:00 only; no svc_backup activity authorised"}], "question": "Which host and action is the true T1601.001 anomaly?", "options": [{"t": "svc_backup TFTP push at 02:47 from the guest VLAN", "ok": true, "why": "Outside the window, from an unmanaged host, under an unassigned service account, followed by boot-variable change and reload — the full storage-patch chain."}, {"t": "netops SCP push at 23:10", "ok": false, "why": "Inside the window, ticketed, from the golden-image server, verified with /md5 — the near miss that punishes people who stop at 'image transfer = bad'."}, {"t": "The verify /md5 run at 23:12", "ok": false, "why": "Verification is a defender action performed by the approved operator."}, {"t": "The guest-VLAN DHCP lease renewal at 02:44", "ok": false, "why": "A lease renewal is background noise; it only matters because of what followed at 02:47."}], "hint": "Window, ticket, source host, and account — the approved push passes all four checks. One row fails them.", "explain": "Four signals separate the rows: change window (22:00–02:00), ticket coverage, source host trust, and account assignment. The 23:10 SCP push passes all; the 02:47 TFTP push fails all four and completes the chain (copy → boot system → reload). Reading only 'an image moved' flags the benign row and misses the implant — that is exactly the near-miss HARD exists to train.", "study": "Change-management correlation; the AN1293 chain (upload → boot param → reload)."}, {"id": "H02", "type": "multi", "persp": "def", "summary": "Select what truly supports a storage patch", "scenario": "<p>IR lead asks you to defend the classification <b>storage patch on border-rtr-04 (standby)<\/b> using only positive evidence. Five candidate items below; some are absence-of-evidence or noise.<\/p>", "artefacts": [{"label": "Candidate evidence items", "code": "A) startup-config boot variable now points to flash:ios-image.bin (diff vs 7-day baseline)\nB) out-of-band MD5 of flash:ios-image.bin differs from vendor value\nC) unscheduled reload at 02:58 logged by syslog on the standby member\nD) no 'debug' commands appear anywhere in TACACS+ accounting\nE) NTP resync succeeded at 03:00 on both HA members"}], "question": "Select ALL items that positively support the storage-patch classification.", "options": [{"t": "A — boot variable re-pointed to a new flash file", "ok": true, "why": "A changed boot variable is a positive storage-patch signal: the device is aimed at a new file."}, {"t": "B — flash hash differs from the vendor value", "ok": true, "why": "Integrity mismatch between the flash file and the vendor baseline is the core positive signal."}, {"t": "C — unscheduled reload right after the changes", "ok": true, "why": "Reload completes the upload → boot change → activation chain the analytic describes."}, {"t": "D — no debug commands in accounting", "ok": false, "why": "Absence of memory commands weakly suggests 'not memory patch' but proves nothing positive about storage."}, {"t": "E — NTP resync at 03:00", "ok": false, "why": "Clock sync is noise; it appears in every incident and supports nothing."}], "hint": "Ask each item: does it positively place a modified file in the boot path, or is it just nearby?", "explain": "A, B, C are positive chain evidence; D is the classic absence-of-evidence trap and E is ambient noise. On an HA pair this matters operationally: positive storage evidence on the standby means rebuild from signed image, while a memory-only story would allow a reboot decision — two different playbooks, so classification discipline pays.", "study": "Positive vs negative indicators; the AN1293 chain components."}, {"id": "H03", "type": "terminal", "persp": "def", "summary": "Copy the running config to evidence storage", "scenario": "<p>Environment: <b>border-rtr-03<\/b>, IOS 15, privileged CLI, evidence SCP server 10[.]44[.]9[.]200 reachable. Objective: get the current running configuration off the device <b>unchanged<\/b> for the evidence vault. Nothing on the device may be altered. You choose the tool, the source, and the destination.<\/p>", "question": "Type the CLI command that copies the running configuration to the SCP evidence server, then press Enter.", "term": {"prompt": "border-rtr-03#", "shellName": "network device CLI", "canonical": "copy running-config scp:", "canonicalWhy": "'copy' is the tool; 'running-config' is the source to preserve; 'scp:' sends it to the evidence server over SSH.", "outputs": [{"re": "copy.*running|running.*scp|scp", "out": "Address or name of remote host [10[.]44[.]9[.]200]?\nWriting running-config !1193 bytes copied in 0.3 secs"}], "defaultOut": "", "requires": [{"re": "\\bcopy\\b", "label": "the copy tool", "why": "copy moves files and configs on IOS."}, {"re": "running-config", "label": "source = running-config", "why": "The live configuration is the evidence you must capture."}, {"re": "scp:", "label": "destination = scp:", "why": "The vault is an SCP server; scp also protects the transfer."}], "forbid": [{"re": "copy\\s+scp:\\s+running-config", "label": "copy scp: running-config (direction reversed)", "why": "That pulls a file FROM the server ONTO the device, overwriting the running config — evidence destroyed and state changed."}, {"re": "\\breload\\b|write erase", "label": "reload / write erase", "why": "State-changing commands have no place in evidence capture."}]}, "hint": "Source first, destination second. The reverse order is not a typo — it is an overwrite.", "explain": "Canonical: copy running-config scp:. The near miss here is genuinely dangerous: copy scp: running-config would overwrite the device's live configuration from the server, destroying evidence and possibly stability. HARD means you pick tool, direction, source, and destination yourself — and direction is where seniors and juniors split.", "study": "IOS copy command source/destination grammar; evidence-capture discipline."}, {"id": "H04", "type": "dnd", "persp": "def", "summary": "Six rows, two buckets, no mercy", "scenario": "<p>Triage backlog before the 09:00 standup. Six rows collected around <b>border-rtr-03/04<\/b>. Sort them; two rows are designed to look like the other bucket.<\/p>", "question": "Drag each row into Benign (change-managed) or Suspicious (T1601.001 profile).", "banks": [{"label": "Benign — change-managed"}, {"label": "Suspicious — T1601.001 profile"}], "items": [{"t": "SCP push 23:10 by netops, ticket CM-2481, vendor hash match", "bank": 0, "why": "Ticketed, in-window, hash-verified: the definition of a managed change."}, {"t": "TFTP push 02:47 from guest VLAN by unassigned account svc_backup", "bank": 1, "why": "No ticket, untrusted source, unassigned account, then boot-variable change: implant profile."}, {"t": "Unsigned image hash mismatch on the standby member", "bank": 1, "why": "A flash hash that fails the vendor comparison is a direct integrity alarm."}, {"t": "Vendor-signed image hash match during the window", "bank": 0, "why": "Positive verification of a signed build inside the approved window."}, {"t": "Console session 23:30 by vendor engineer, badge log matches, ticket CM-2481 says 'supervised install'", "bank": 0, "why": "Looks alarming (night console) but badge + ticket + supervision make it managed — the alarming-but-benign row."}, {"t": "debug memory session on the standby device from a jump host not in the CMDB", "bank": 1, "why": "Runtime memory manipulation from an unknown host is the firmware:runtime signal of the analytic."}], "hint": "Two rows wear a costume: one night-time row is fully ticketed; one quiet 'backup' row is the implant.", "explain": "Every row maps to the analytic's signals, but two invert expectations: the 23:30 vendor console session (alarming but ticketed and badged) is benign, while svc_backup's quiet 'backup-like' TFTP push is the implant entry. Triage by evidence triplet — ticket, source trust, integrity — never by gut reaction to hour or protocol.", "study": "Correlating CMDB, badge logs and change tickets with device telemetry."}, {"id": "H05", "type": "tree", "persp": "dual", "summary": "Four decisions on a border HA pair", "question": "Take the four decisions in order — each one shapes the next.", "scenario": "<p><b>border-rtr-03<\/b> (active) and <b>border-rtr-04<\/b> (standby) carry production transit. Artefacts: standby flash hash mismatch vs vendor; standby <code>show version<\/code> prints the expected string; TACACS+ accounting gap 02:10–02:40 on both members; jump host 10[.]52[.]8[.]7 authenticated at 02:31. Four decisions.<\/p>", "steps": [{"text": "The standby's version output and its hash disagree. Which signal do you trust?", "options": [{"t": "The independent hash — CLI output may be patched", "ok": true, "outcome": "You proceed on hash evidence. The version string is now treated as attacker-controllable.", "why": "The description says patched images can fake command output; an out-of-band hash is independent of that."}, {"t": "show version — it matches the CMDB", "ok": false, "outcome": "You 'confirm' a healthy device that is actually patched. The implant keeps running.", "why": "The liar cannot certify itself; a patched CLI is exactly what the page warns about."}, {"t": "Neither — wait for more data", "ok": false, "outcome": "You lose hours while a border device runs attacker code.", "why": "The hash already is decisive evidence; waiting adds risk, not certainty."}]}, {"text": "Which device do you treat as compromised?", "options": [{"t": "border-rtr-04 (standby) — the evidence sits there", "ok": true, "outcome": "Scope: standby only. The active member stays under enhanced watch, not blanket suspicion.", "why": "Evidence-scoped decisions avoid both under- and over-reaction; the active member has no positive signal yet."}, {"t": "Both members — assume the worst", "ok": false, "outcome": "You quarantine a healthy active border router; transit fails over and the business feels it for nothing proven.", "why": "Defensible in some worlds, but here it has real cost with zero supporting evidence on the active unit."}, {"t": "Neither — the TACACS gap explains the hash", "ok": false, "outcome": "The mismatch is rationalised away and the implant survives.", "why": "A logging gap explains missing lines, not a changed file hash."}]}, {"text": "First operational action, keeping transit up?", "options": [{"t": "Drain the standby from rotation, isolate via OOB management, preserve TACACS logs", "ok": true, "outcome": "Transit flows through the active unit; the standby is frozen with evidence intact.", "why": "Least aggressive effective action: remove from trust, keep running, keep evidence."}, {"t": "Reload the standby to clear the implant", "ok": false, "outcome": "The reload activates whatever the flash file holds and destroys runtime evidence.", "why": "If the patch is in storage, rebooting is the attacker's plan, not yours."}, {"t": "Power off the active router to be safe", "ok": false, "outcome": "You drop production transit on a device with no evidence against it.", "wrong_note": true, "why": "Maximum business impact, wrong target, no evidence — the opposite of proportionate."}]}, {"text": "What goes into the 09:00 report?", "options": [{"t": "Standby confirmed compromised (hash + chain); active clean so far; peer-hunt scheduled", "ok": true, "outcome": "Leadership gets scope, evidence, and a next step. The bridge moves to rebuild planning.", "why": "State exactly what is proven, what is not, and the next hunt — that is an IR report."}, {"t": "Full breach of the border pair declared", "ok": false, "outcome": "Panic without evidence; the active unit is sacrificed in the story, not in the data.", "why": "Over-claiming destroys the report's credibility for every later statement."}, {"t": "Closed as vendor image bug", "ok": false, "outcome": "The vendor has no such advisory and the boot-variable change remains unexplained.", "why": "An unverified theory that conveniently ends the investigation is not a finding."}]}], "hint": "Trust independent evidence, scope to the evidence, act with the least aggression that contains it, report only what is proven.", "explain": "Four chained decisions: evidence hierarchy (hash over CLI), scoping (standby, not the pair), proportionate containment (drain + OOB isolate, never reload), and honest reporting. Attacker perspective: the implant wanted a reload or a panic power-off — you gave it neither. Defender perspective: the HA design is your friend; use rotation and OOB, not the power switch.", "study": "Evidence hierarchy; HA containment patterns; IR reporting discipline."}, {"id": "H06", "type": "order", "persp": "def", "summary": "Order the integrity-validation runbook", "scenario": "<p>Your runbook header says: <i>reference, measure, compare, document, escalate<\/i>. Under pressure people skip steps — do not.<\/p>", "question": "Drag the five steps into the runbook order.", "steps": ["Pull the vendor-published hash for the exact image build and filename", "Freeze the evidence: snapshot TACACS+ accounting and the config archive before touching anything", "Compute the flash file hash out-of-band, away from the device's own CLI", "Document the comparison: hashes, timestamps, ticket checks, and the chain of events", "Escalate to IR with the evidence package and a proposed, approved maintenance slot"], "hint": "Nothing can be compared before a reference exists; nothing should change state before evidence is frozen.", "explain": "Reference first, evidence frozen before any active step, independent measurement, documentation, then escalation with a slot that was approved. Two near-miss orders tempt people: measuring before the reference exists (you cannot compare) and escalating before freezing evidence (IR arrives to a changed scene).", "study": "Runbook design: ordering rules for validation workflows."}, {"id": "H07", "type": "fill", "persp": "def", "summary": "Complete the tuned SIEM rule", "question": "Complete the four blanks of the SIEM rule with words from the bank.", "scenario": "<p>You are writing the production rule from analytic AN1293. Complete the four blanks; four words are decoys.<\/p>", "text": "ALERT on any {0} transfer toward a network device outside approved windows; CORRELATE with a {1} variable change within 10 minutes; CORRELATE with a {2} within 30 minutes; VERIFY the flash hash against the {3} value before closing.", "bank": ["image", "boot system", "reload", "vendor", "printer", "SNMP", "ACL", "NTP"], "blanks": [{"ok": "image", "accept": ["^image"], "why": "The rule keys on image-file transfers (TFTP/SCP/FTP) toward devices."}, {"ok": "boot system", "accept": ["^boot( system)?$"], "why": "The boot variable change is the correlation anchor within 10 minutes."}, {"ok": "reload", "accept": ["^reload$|^reboot$"], "why": "The reload within 30 minutes completes the activation chain."}, {"ok": "vendor", "accept": ["^vendor"], "why": "Closure requires the vendor baseline comparison, not the device's own claim."}], "hint": "The blanks follow the chain: what arrives, what gets aimed, what activates, what reference closes it.", "explain": "The rule encodes the chain (transfer → boot change → reload) plus the closure condition (vendor hash). Two near misses: writing 'TFTP' in blank 1 narrows the rule and misses SCP pushes; writing 'baseline' in blank 4 inverts the trust model — the baseline is compared AGAINST the vendor value, and the vendor is the root of trust.", "study": "Turning analytic AN1293 into window- and ticket-aware SIEM logic."}, {"id": "H08", "type": "qcm", "persp": "def", "summary": "Budget for exactly one control", "scenario": "<p>Reality check on <b>fw-edge-11<\/b>-class devices: vendor-signed images are deployed and verified at install time (M1045 effectively live). Secure boot is NOT enabled. Threat model: an attacker with privileged CLI writes an unsigned image and re-points the boot variable. Budget buys ONE control this quarter.<\/p>", "question": "Which control most directly blocks this exact path?", "options": [{"t": "M1046 Boot Integrity — verify the image signature at every boot", "ok": true, "why": "The attack lives in 'boot an unsigned file'; signature checks at boot make that file refuse to run."}, {"t": "M1045 Code Signing — deploy only signed images", "ok": false, "why": "The near miss: already deployed. The gap is not deploy-time trust, it is boot-time enforcement."}, {"t": "M1032 Multi-factor Authentication on TACACS+", "ok": false, "why": "Good control, different layer: it reduces access paths but does not stop an attacker who already has CLI."}, {"t": "M1027 Password Policies per NIST", "ok": false, "why": "Baseline hygiene; the modelled attacker is already past passwords."}], "hint": "Read the threat model again: the attacker already HAS privileged CLI. Which remaining step does the control kill?", "explain": "The 'obvious' image answer is M1045 — and it is already there. The open step in the kill chain is booting the unsigned file, which is precisely what M1046 protects. This is the HARD pattern: three options are defensible in other contexts, one is correct in this one, and the context (existing controls, threat-model step) decides.", "study": "Mapping threat-model steps to the mitigation that removes them."}, {"id": "H09", "type": "match", "persp": "def", "summary": "Five artefacts, five ATT&CK objects", "scenario": "<p>CTI asks you to tag last night's artefacts with ATT&amp;CK objects for the hunt matrix. Two names are decoys.<\/p>", "question": "Match each artefact to the object it evidences.", "left": ["Flash hash mismatch + boot variable re-point", "sysDescr reports 15.4(3)M8 after the fleet moved to 17.9.5a", "Bootloader checksum changed; unknown ROMMON version", "Device boots its image from 10[.]51[.]3[.]9 at every startup", "Strong ciphers replaced by NULL-SHA after the patch"], "right": ["T1601.001 Patch System Image", "T1601.002 Downgrade System Image", "T1542.004 ROMMONkit", "T1542.005 TFTP Boot", "T1600 Weaken Encryption", "Data from Cloud Storage Object", "Phishing"], "hint": "Storage file change, version going backwards, bootloader layer, network-loaded image, broken crypto — one each.", "explain": "The five artefacts span the family: patch (T1601.001), downgrade (T1601.002), bootloader implant (T1542.004 ROMMONkit), network-loaded image (T1542.005 TFTP Boot), and the crypto weakening the patch enables (T1600 Weaken Encryption). One incident, five objects — this is why T1601.001 detections feed a whole hunt matrix, and why the decoys (cloud collection, phishing) do not fit any artefact.", "study": "The neighbouring objects named around T1601.001 in ATT&CK."}, {"id": "H10", "type": "triage", "persp": "def", "summary": "Four alerts, three possible actions each", "question": "Assign one action per alert: Close benign, Investigate, or Escalate to IR.", "scenario": "<p>You hold the IR bridge for the border pair. Assign exactly one action per alert. Actions: <i>Close benign<\/i>, <i>Investigate<\/i>, <i>Escalate to IR<\/i>.<\/p>", "alerts": [{"title": "SCP push to border-rtr-03, ticket CM-2481, vendor hash match", "meta": "23:10, inside approved window, operator netops (badge-in recorded)", "options": [{"t": "Close benign", "ok": true, "why": "All four checks pass: window, ticket, operator, integrity."}, {"t": "Investigate", "ok": false, "why": "Investigating a fully verified change burns bridge time during a live incident."}, {"t": "Escalate to IR", "ok": false, "why": "Escalation without an integrity failure weakens the signal budget."}]}, {"title": "Flash hash mismatch on the internet-facing router, boot variable changed", "meta": "02:47–02:58 chain complete, no ticket, source host unmanaged", "options": [{"t": "Escalate to IR", "ok": true, "why": "Confirmed integrity failure plus chain evidence: this is the incident."}, {"t": "Close benign", "ok": false, "why": "Closing a confirmed mismatch is how implants survive audits."}, {"t": "Investigate", "ok": false, "why": "The evidence is already decisive; investigation would only repeat it."}]}, {"title": "debug memory session by vendor support on dist-sw-05", "meta": "Ticket CM-2495 says 'memory diagnostics'; vendor engineer badge-in recorded at 23:30", "options": [{"t": "Investigate — verify ticket scope and session transcript", "ok": true, "why": "Debug sessions can patch memory; the ticket and badge make it plausible but the session content decides."}, {"t": "Close benign", "ok": false, "why": "'Looks legit' is not integrity evidence for a memory-level session."}, {"t": "Escalate to IR", "ok": false, "why": "No positive T1601.001 evidence yet; verify first, escalate on mismatch."}]}, {"title": "Older image booted after unscheduled reload; CLI prints the new version string", "meta": "sysDescr shows 15.4(3)M8; fleet baseline is 17.9.5a; version output contradicts boot file", "options": [{"t": "Escalate to IR", "ok": true, "why": "Downgrade-plus-false-output is the combined pattern the page describes; IR scope now."}, {"t": "Close benign", "ok": false, "why": "An old image with a fake version string is the opposite of benign."}, {"t": "Investigate", "ok": false, "why": "The contradiction (old image, new version claim) is already decisive."}]}], "hint": "Decisive integrity evidence escalates; plausible-but-unverified investigates; fully verified closes.", "explain": "Alert 1 closes (all checks pass), alert 2 escalates (decisive mismatch), alert 3 investigates (plausible cover, unverified content), alert 4 escalates (the downgrade+fake-version combo). The near misses are alert 3 — closing it trusts a ticket instead of evidence — and alert 4 — investigating what is already proven. Action must match evidence strength, not alert loudness.", "study": "Evidence-strength-based triage; the downgrade + false-output combination."}, {"id": "H11", "type": "terminal", "persp": "def", "summary": "Produce the hash on the forensics workstation", "scenario": "<p>Environment: Linux forensics workstation, file <code>ios-image.bin<\/code> already copied from the standby unit into the evidence folder. The vendor publishes an <b>MD5<\/b> for this build. Objective: produce the value to compare. Nothing else is given.<\/p>", "question": "Type the shell command that produces the comparison value for ios-image.bin, then press Enter.", "term": {"prompt": "forensics@ir-ws:~/evidence$", "shellName": "Linux shell", "canonical": "md5sum ios-image.bin", "canonicalWhy": "'md5sum' computes the MD5 digest the vendor publishes; 'ios-image.bin' is the evidence file.", "outputs": [{"re": "md5sum", "out": "9f2c47be5d1a6e08c3f4a1d2b3e4f5a6  ios-image.bin"}], "defaultOut": "", "requires": [{"re": "\\bmd5sum\\b", "label": "the md5sum tool", "why": "The vendor publishes MD5; only md5sum produces a comparable digest."}, {"re": "ios-image\\.bin", "label": "the evidence file ios-image.bin", "why": "The digest must be computed over the copied image file."}], "forbid": [{"re": "\\bsha1sum\\b|\\bsha256sum\\b", "label": "sha1sum / sha256sum", "why": "Wrong algorithm: the vendor published MD5, so any other digest cannot be compared and wastes the window."}]}, "hint": "Match the algorithm to what the vendor publishes — nothing more, nothing less.", "explain": "Canonical: md5sum ios-image.bin. Two near misses: sha-family tools produce unfusable digests (wrong algorithm, wasted window), and hashing the wrong file proves nothing. This is the offline twin of the device-side verify /md5 — when the device CLI is untrusted, the hash happens elsewhere.", "study": "Linux digest tools; matching hash algorithm to the vendor reference."}, {"id": "H12", "type": "multi", "persp": "def", "summary": "Coverage of the artefact set", "scenario": "<p>Coverage review before you claim the analytic is 'fed'. The collected set contains: TACACS+ accounting lines (copy, boot system, reload), a config-archive diff (boot variable), and nothing from any runtime/firmware sensor.<\/p>", "question": "Select ALL statements that are TRUE about this artefact set's coverage of the analytic's data components.", "options": [{"t": "Command Execution (DC0064) is covered", "ok": true, "why": "The TACACS+ accounting lines are exactly the networkdevice:cli channel."}, {"t": "File Modification (DC0061) is covered", "ok": true, "why": "The config-archive diff is the networkdevice:config channel."}, {"t": "Firmware Modification (DC0004) is covered", "ok": false, "why": "No runtime or firmware sensor data exists in the set — the channel is empty, not covered."}, {"t": "All three components of the analytic are covered", "ok": false, "why": "Two of three channels are present; claiming full coverage would hide the memory-patch blind spot."}], "hint": "Count the channels you can actually see evidence from, then subtract from three.", "explain": "The set covers two of three channels. The missing firmware:runtime channel means an in-memory patch (debug commands, runtime manipulation) would pass unseen — the exact blind spot ROMMONkit-style persistence exploits. Coverage honesty is a detection-engineering duty: state the gap, then add the sensor or a compensating hunt.", "study": "Data-component coverage reasoning; compensating controls for missing channels."}, {"id": "H13", "type": "qcm", "persp": "att", "summary": "Red team: survive tonight's reload", "scenario": "<p>Authorised red-team engagement, rules of engagement signed. You hold privileged CLI on <b>rtr-lab-12<\/b> for 10 minutes inside an approved window. Facts: vendor signs images; secure boot is NOT enabled; a scheduled reload runs at midnight; you may change one file plus its boot reference; detection watches config diffs closely but not flash contents. Goal: your implant survives the midnight reload with the smallest detection surface.<\/p>", "question": "Which approach best achieves the goal under these constraints?", "options": [{"t": "Replace the image file in flash and re-point the boot variable to it", "ok": true, "why": "With secure boot off, a storage patch survives the reload and touches only what the detections ignore."}, {"t": "Apply a debug-command memory patch only", "ok": false, "why": "Near miss: memory patches die at the midnight reload — the goal fails on persistence."}, {"t": "Hide the implant in the startup-config and wait", "ok": false, "why": "The startup-config is not the OS image; it does not execute implant code at boot."}, {"t": "Downgrade the image first, then patch it", "ok": false, "why": "Two loud changes for zero benefit here; the downgrade signature is exactly what defenders diff for."}], "hint": "The midnight reload is the deadline. Which method reads its code from flash at every boot?", "explain": "Persistence semantics decide it: only the flash file comes back at boot, and with secure boot off nothing verifies its signature. Attacker perspective: minimal changes, aligned with detection blind spots (flash contents). Defender perspective: this exercise is the argument for M1046 — with boot-time signature checks, the chosen path fails and the memory path dies at midnight anyway.", "study": "The persistence paragraph of the description; mitigation M1046."}, {"id": "H14", "type": "qcm", "persp": "def", "summary": "Spot the mistake in the post-change config", "scenario": "<p>Change <b>CM-2501<\/b>: “Memory upgrade on dist-sw-05 — no image work authorised.” The operator saved this config and closed the ticket:<\/p>", "artefacts": [{"label": "Post-change running-config (relevant lines)", "code": "archive path scp://10[.]44[.]9[.]200/configs/$h\nip ssh version 2\n!!boot system flash:ios-image-2026.bin\nservice timestamps log datetime msec"}], "question": "What is the mistake?", "options": [{"t": "The boot system line points at a new image although the ticket allows no image work", "ok": true, "why": "The boot variable now aims at 'ios-image-2026.bin' — an image change hidden inside a memory ticket."}, {"t": "ip ssh version 2 is wrong and must be removed", "ok": false, "why": "SSH v2 is the correct, recommended setting — a healthy line wearing a suspicious costume."}, {"t": "The archive path must not use SCP", "ok": false, "why": "SCP config archival is good practice; the near miss blames a control instead of the anomaly."}, {"t": "Timestamps in msec make logs unreadable", "ok": false, "why": "Millisecond timestamps help correlation; they are irrelevant to the ticket scope."}], "hint": "Read the ticket's scope, then read each line against that scope — not against general best practice.", "explain": "The mistake is scope: a memory ticket hid an image-work change. The two healthy lines (SSH v2, SCP archive) are the near misses that punish pattern-blaming. Defenders catch this with ticket-to-diff correlation: every config line must map to the approved scope, and a boot variable never survives a 'memory only' ticket.", "study": "Ticket-to-config diff correlation as a T1601.001 control."}, {"id": "H15", "type": "order", "persp": "def", "summary": "Containment order for the HA pair", "scenario": "<p>Confirmed storage patch on <b>border-rtr-04<\/b> (standby). Transit must stay up. Order the containment plan the IR lead will actually sign.<\/p>", "question": "Drag the five actions into the correct order.", "steps": ["Preserve evidence: export TACACS+ accounting, config archive diff, and the hash report", "Remove the standby from the HA rotation so no traffic or sync flows through it", "Isolate the standby through the out-of-band management plane (no reload)", "Rebuild the standby from the vendor-signed golden image in the approved window", "Verify the rebuild — signed boot passes, hash matches — then return it to rotation"], "hint": "Evidence first, then remove from trust, then cut access, then rebuild, then prove the rebuild.", "explain": "The order encodes three rules: evidence before state change; isolation without reload (a reload would activate the stored patch and burn evidence); and no return to rotation without proof (signed boot + hash). The near-miss sequences all start with the rebuild — fast, satisfying, and evidence-destroying.", "study": "IR containment ordering on redundant infrastructure."}, {"id": "H16", "type": "fill", "persp": "def", "summary": "Insert the right keywords in the intel report", "question": "Insert the four load-bearing keywords into the report text.", "scenario": "<p>Your CTI report goes to leadership and the vendor. Four keywords are load-bearing; the bank has four decoys.<\/p>", "text": "The implant on border-rtr-04 matches the T1601.001 {0} pattern; the closest real-world case is {1} (S0519). Detection was mapped to strategy {2}; remediation adds {3} verification at boot (M1046).", "bank": ["patch system image", "SYNful Knock", "DET0469", "signature", "T1059.001", "G0007", "reboot", "phishing"], "blanks": [{"ok": "patch system image", "accept": ["patch system image"], "why": "The technique name keeps the report ATT&CK-traceable."}, {"ok": "SYNful Knock", "accept": ["synful knock"], "why": "S0519 SYNful Knock is the page's procedure example for this technique."}, {"ok": "DET0469", "accept": ["det0469"], "why": "The detection strategy ID anchors the rule to the ATT&CK object."}, {"ok": "signature", "accept": ["signature|boot integrity"], "why": "M1046 Boot Integrity works through signature verification at boot time."}], "hint": "One technique name, one malware family, one detection-strategy ID, one control mechanism.", "explain": "Reports earn trust by precision: the technique (T1601.001 Patch System Image), the precedent (S0519 SYNful Knock, which Mandiant found implanted via patched IOS images), the detection anchor (DET0469), and the control mechanism (signature checks at boot, M1046). The decoys come from unrelated families — dropping them into an image-patch report is how false attribution starts.", "study": "Writing ATT&CK-traceable CTI reports; the Procedure Examples table."}]}</script>
<script>

(function () {
  'use strict';
  var EXAM = JSON.parse(document.getElementById('exam-data').textContent);
  var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
  var EXS = EXAM.exercises;
  var LETTERS = 'ABCDEFGHIJ';

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function shuffle(arr) {
    var a = arr.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1));
      t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(s) { s = Math.max(0, s | 0); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
  function normCmd(s) {
    return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/[?]+$/, '');
  }

  /* ---------- state ---------- */
  var S = {
    view: 'intro', order: [], i: 0,
    shuffle: {}, answers: {}, results: {}, checked: {}, hintUsed: {},
    collapsed: {}, skipped: [], phase: 'main',
    pauseManualSec: 0, pauseAutoSec: 0,
    reported: false, finalPercent: 0, handshake: null,
    focusTerm: false
  };
  var T = { state: 'IDLE', remaining: EXAM.meta.budgetSec, resumeTo: null };

  /* ---------- scoring (spec contract) ---------- */
  function scoreExercise(selectedItems, correctItems) {
    var ok = {}, i, H = 0, W = 0;
    for (i = 0; i < correctItems.length; i++) ok[correctItems[i]] = true;
    for (i = 0; i < selectedItems.length; i++) { if (ok[selectedItems[i]]) H++; else W++; }
    var N = correctItems.length;
    return { credit: (N ? Math.max(0, (H - W) / N) : 0), H: H, W: W, N: N };
  }

  /* ---------- timer state machine: RUNNING / PAUSED_MANUAL / PAUSED_AUTO_CHECK / ENDED ---------- */
  function setTimer(st) { T.state = st; renderTimerChip(); }
  function tick() {
    if (T.state === 'RUNNING') {
      T.remaining -= 1;
      renderTimerChip();
      if (T.remaining <= 0) { T.remaining = 0; endExam('timeout'); return; }
    } else if (T.state === 'PAUSED_MANUAL') { S.pauseManualSec += 1; }
    else if (T.state === 'PAUSED_AUTO_CHECK') { S.pauseAutoSec += 1; }
  }
  setInterval(tick, 1000);

  function curKey() { return S.order[S.i]; }
  function curEx() { return EXS[curKey()]; }

  /* ---------- per-exercise presentation shuffles ---------- */
  function initExerciseState(key) {
    var ex = EXS[key], sh = {}, i;
    if (ex.type === 'qcm' || ex.type === 'multi' || ex.type === 'logview') {
      sh.opts = [];
      for (i = 0; i < ex.options.length; i++) sh.opts.push(i);
      sh.opts = shuffle(sh.opts);
    } else if (ex.type === 'match') {
      sh.rights = shuffle(ex.right.map(function (w, i) { return i; }));
    } else if (ex.type === 'dnd') {
      sh.chips = shuffle(ex.items.map(function (w, i) { return i; }));
    } else if (ex.type === 'order') {
      sh.chips = shuffle(ex.steps.map(function (w, i) { return i; }));
    } else if (ex.type === 'fill') {
      sh.bank = shuffle(ex.bank.map(function (w, i) { return i; }));
    } else if (ex.type === 'tree') {
      sh.opts = ex.steps.map(function (st) { return shuffle(st.options.map(function (o, i) { return i; })); });
    } else if (ex.type === 'triage') {
      sh.alerts = ex.alerts.map(function (a) { return shuffle(a.options.map(function (o, i) { return i; })); });
    }
    S.shuffle[key] = sh;
    resetAnswer(key);
  }
  function resetAnswer(key) {
    var ex = EXS[key], i, a = {};
    if (ex.type === 'qcm' || ex.type === 'logview') { a = { sel: [] }; }
    else if (ex.type === 'multi') { a = { sel: [] }; }
    else if (ex.type === 'match') { a = { map: {}, picked: null }; }
    else if (ex.type === 'dnd') { a = { place: {}, picked: null }; }
    else if (ex.type === 'order') { a = { slots: [], picked: null }; }
    else if (ex.type === 'fill') { a = { vals: [] }; for (i = 0; i < ex.blanks.length; i++) a.vals.push(''); }
    else if (ex.type === 'terminal') { a = { lines: [] }; }
    else if (ex.type === 'tree') { a = { step: 0, choices: [] }; }
    else if (ex.type === 'triage') { a = { pick: {} }; }
    S.answers[key] = a;
  }
  function canCheck(ex, a) {
    var i;
    if (ex.type === 'qcm' || ex.type === 'multi' || ex.type === 'logview') return a.sel && a.sel.length > 0;
    if (ex.type === 'match') { for (i in a.map) { return true; } return false; }
    if (ex.type === 'dnd') { for (i in a.place) { if (a.place[i].length) return true; } return false; }
    if (ex.type === 'order') { for (i = 0; i < a.slots.length; i++) { if (a.slots[i] != null) return true; } return false; }
    if (ex.type === 'fill') { for (i = 0; i < a.vals.length; i++) { if (a.vals[i].trim()) return true; } return false; }
    if (ex.type === 'terminal') return a.lines && a.lines.length > 0;
    if (ex.type === 'tree') return a.choices.length === ex.steps.length;
    if (ex.type === 'triage') { for (i in a.pick) { return true; } return false; }
    return false;
  }

  /* ---------- log highlighter ---------- */
  var KWX = /\b(copy|tftp|scp|ftp|boot system|boot|debug|verify|reload|show|version|flash|running-config|startup-config|md5|rommon|firmware|image|deny|permit|audit|tacacs|radius|enable|secret|username|snmp|syslog|port|shutdown)\b/g;
  function hlLine(ln) {
    var e = esc(ln);
    if (/^!!/.test(ln)) return '<span class="b">' + esc(ln.replace(/^!!/, '').replace(/^\s/, '')) + '</span>';
    if (/^\s*[!#]/.test(ln)) return '<span class="c">' + e + '</span>';
    e = e.replace(/&quot;[^&]*?&quot;/g, function (m) { return '<span class="s">' + m + '</span>'; });
    e = e.replace(KWX, function (m) { return '<span class="k">' + m + '</span>'; });
    e = e.replace(/\b\d[\d[\].:]*\b/g, function (m) { return '<span class="n">' + m + '</span>'; });
    return e;
  }
  function hl(code) {
    return String(code || '').split('\n').map(hlLine).join('\n');
  }
  function artefactHTML(a, idx) {
    var id = 'lg' + idx + '_' + curKey();
    var rows = String(a.code).split('\n');
    var inner;
    if (a.filter) {
      inner = '<div class="logview-tools"><input type="text" aria-label="filter log lines" placeholder="filter lines..." ' +
        'oninput="Z.logFilter(this.value,\'' + id + '\')"><span class="logview-count" id="' + id + 'c">' + rows.length + ' lines</span></div>' +
        '<pre class="log" id="' + id + '">' + rows.map(function (ln) {
          return '<span class="lg-row" data-t="' + esc(ln.toLowerCase()) + '">' + hlLine(ln) + '\n</span>';
        }).join('') + '</pre>';
    } else {
      inner = '<pre class="log">' + rows.map(hlLine).join('\n') + '</pre>';
    }
    return '<div class="artefact"><span class="artefact-label">' + esc(a.label) + '</span>' + inner + '</div>';
  }
  function artefactsHTML(ex) {
    if (!ex.artefacts) return '';
    var h = '';
    for (var i = 0; i < ex.artefacts.length; i++) h += artefactHTML(ex.artefacts[i], i);
    return h;
  }

  /* ---------- shared header ---------- */
  function sevBadge() {
    var m = EXAM.meta;
    return '<span class="badge ' + m.sevClass + '" aria-label="Severity ' + esc(m.sev) + '">● ' + esc(m.sev) + '</span>';
  }
  function timerChip() {
    var txt, lab;
    if (T.state === 'IDLE') { txt = '⏱ READY'; lab = 'Timer ready'; }
    else if (T.state === 'RUNNING') { txt = '▶ RUNNING'; lab = 'Timer running'; }
    else if (T.state === 'PAUSED_MANUAL') { txt = '⏸ PAUSED — manual (press Resume)'; lab = 'Timer paused manually'; }
    else if (T.state === 'PAUSED_AUTO_CHECK') { txt = '⏸ PAUSED — reviewing feedback (resumes on Next)'; lab = 'Timer paused for feedback review'; }
    else { txt = '■ ENDED'; lab = 'Timer ended'; }
    return '<span class="chipstate tstate ok-z" aria-label="' + lab + ': ' + fmt(T.remaining) + '">' + txt + ' <b>' + fmt(T.remaining) + '</b></span>';
  }
  function renderTimerChip() {
    var el = $('tchip');
    if (el) el.outerHTML = '<span id="tchip">' + timerChip() + '</span>';
  }
  function scoreChip() {
    var sum = 0, n = 0, k;
    for (k in S.results) { if (S.checked[k]) { sum += S.results[k].credit; n++; } }
    var pct = n ? Math.round((sum / n) * 100) : 0;
    return '<span class="chipstate xscore" aria-label="Live score">Score <b>' + sum.toFixed(1) + ' / ' + n + '</b> · ' + pct + '%</span>';
  }
  function headerHTML() {
    var ex = curEx();
    var key = curKey();
    var m = EXAM.meta;
    var counter;
    if (S.phase === 'review') counter = '⚠ Reviewing a skipped exercise — ' + (S.i + 1) + ' of ' + S.order.length;
    else counter = 'Exercise ' + (S.i + 1) + ' of ' + S.order.length;
    var hintDis = (S.checked[key] || S.hintUsed[key]) ? ' disabled' : '';
    var skipDis = (S.phase === 'review' || S.checked[key] || T.state === 'ENDED') ? ' disabled' : '';
    var h = '<div class="xhead"><div class="wrap xhead-in">' +
      '<span class="xcount">' + counter + '</span>' + sevBadge() +
      '<span class="chipstate small dim mono">' + esc(m.id) + ' ' + esc(m.name) + '</span>' +
      '<span id="tchip">' + timerChip() + '</span>' +
      '<span id="schip">' + scoreChip() + '</span>' +
      '<div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn btn-amber" onclick="Z.onHint()"' + hintDis + ' aria-label="Hint: costs 10 percent of this exercise credit">💡 Hint −10%</button>' +
      '<button class="btn btn-ghost" onclick="Z.onSkip()"' + skipDis + ' aria-label="Skip this exercise">⚠ Skip</button>' +
      '<button class="btn btn-ghost" onclick="Z.onPause()" aria-label="Manual pause: hides the exercise">⏸ Pause</button>' +
      '</div></div>' +
      '<div class="wrap"><div class="progress" aria-hidden="true"><i style="width:' + progPct() + '%"></i></div></div></div>';
    return h;
  }
  function progPct() {
    var answered = 0, k;
    for (k in S.checked) { if (S.checked[k]) answered++; }
    return Math.round((answered / S.order.length) * 100);
  }

  /* ---------- intro view (exactly four sections) ---------- */
  function viewIntro() {
    var m = EXAM.meta;
    var hs = '<div class="card" style="border-top:3px solid var(--sev-col,' + m.sevVar + ')">' +
      '<h1 style="margin:0 0 4px;font-size:1.35rem">' + esc(m.id) + ' — ' + esc(m.sev) + ' practice exam</h1>' +
      '<p class="dim" style="margin:0 0 8px">' + esc(m.id) + ' — ' + esc(m.name) + ' · sub-technique of ' + esc(m.parent) +
      ' · Tactic: ' + esc(m.tactic) + ' · Platform: ' + esc(m.platform) + ' · Domain: ' + esc(m.domain) + '</p>' +
      sevBadge() +
      '<div class="facts">' +
      '<div><b>Exercises in this file</b><span>' + EXS.length + '</span></div>' +
      '<div><b>Estimated time</b><span>' + m.estMin + ' minutes</span></div>' +
      '<div><b>Timer budget</b><span>' + fmt(m.budgetSec) + ' (countdown)</span></div>' +
      '<div><b>Pass mark</b><span>' + m.passMark + '%</span></div>' +
      '<div><b>ATT&amp;CK version</b><span>v' + esc(m.version) + ' · ' + esc(m.updated) + '</span></div>' +
      '</div>' +
      (S.handshake && S.handshake.username ? '<p class="small dim" style="margin:10px 0 0">Learner: ' + esc(S.handshake.username) +
        (S.handshake.country && S.handshake.country !== 'ZZ' ? ' · ' + esc(S.handshake.country) : '') + '</p>' : '') +
      '</div>';
    var learn = '<div class="card"><h2>What you will learn here</h2>' + EXAM.learn + '</div>';
    var kw = '<div class="card"><h2>Keywords covered in this exam</h2>';
    for (var i = 0; i < EXAM.keywords.length; i++) {
      var g = EXAM.keywords[i];
      kw += '<div class="kw-theme"><h3>' + esc(g.theme) + '</h3><div class="kw-items">';
      for (var j = 0; j < g.items.length; j++) kw += '<span>' + esc(g.items[j]) + '</span>';
      kw += '</div></div>';
    }
    kw += '</div>';
    var types = {};
    EXS.forEach(function (e) { types[e.type] = true; });
    var typeList = Object.keys(types).map(function (t) { return TYPE_LABELS[t]; }).join(', ');
    var how = '<div class="card"><h2>How this exam works</h2><ul class="rules">' +
      '<li><b>Passing score: ' + m.passMark + '%.</b> Your percentage is computed only over exercises you actually answered. PASS means you scored at least ' + m.passMark + '%; FAIL means you should retake the exam.</li>' +
      '<li><b>Exercise types in this file:</b> ' + esc(typeList) + '.</li>' +
      '<li><b>Timer:</b> a ' + fmt(m.budgetSec) + ' countdown runs while you work. The <b>Pause</b> button stops the timer and hides the exercise (a real break). The moment you press <b>Check</b>, the timer also stops — you can study the feedback for as long as you like, and it resumes only when you press <b>Next</b>.</li>' +
      '<li><b>Partial credit:</b> exercises with several correct items score <code>max(0, (H − W) / N)</code> — correct items minus wrong items, divided by the number of items. You can earn 0.60 of an exercise, for example.</li>' +
      '<li><b>Hint:</b> one hint per exercise. It reveals a nudge, never the answer, and costs 10% of that exercise\u2019s credit.</li>' +
      '<li><b>Skip:</b> every exercise has a Skip button. Before you can finish, a review screen lists everything you skipped, so you can go back while the timer still runs. Skipped-and-never-answered exercises are excluded from the score — they count neither for nor against you.</li>' +
      (EXAM.howExtra || '') +
      '</ul><button class="btn btn-primary" style="min-width:180px;min-height:48px" onclick="Z.onStart()">▶ Start the exam</button></div>';
    return hs + learn + kw + how;
  }
  var TYPE_LABELS = {
    qcm: 'multiple choice (single answer)', multi: 'multi-select with partial credit',
    match: 'matching pairs', dnd: 'drag &amp; drop into categories', order: 'timeline ordering',
    fill: 'fill-in-the-blank with a word bank', terminal: 'typed terminal command',
    tree: 'branching decision scenario', triage: 'SOC alert-queue triage',
    logview: 'log analysis with a live filter'
  };

  /* ---------- answer widget renderers ---------- */
  function chipHTML(txt, picked, clickJs, dragJs, retJs) {

  function dragAttrs() {

  function optsHTML(ex, key, a) {

    S.shuffle[key].rights.forEach(function (r) {

    if (!anyPool) h += '<span class="empty-hint">All items placed.</span>';

        + ' ondragover="Z.dragOver(event)" ondragleave="Z.dragLeave(event)" ondrop="Z.matchDrop(event,' + i + ')"'
        + ' onclick="Z.matchSlot(' + i + ')"'
        + ' onkeydown="Z.slotKey(event,\'matchSlot\',' + i + ')">'
        + '<span class="slot-lab">' + esc(L) + '</span>'

  function dndHTML(ex, key, a) {
    var placed = {}, b, k;
    for (b in a.place) { a.place[b].forEach(function (it) { placed[it] = +b; }); }
    var h = '<div class="dnd"><div class="pool"><div class="pool-h">Item bank — drag or click to place</div><div class="pool-box" ondragover="Z.dragOver(event)" ondragleave="Z.dragLeave(event)" ondrop="Z.dndDrop(event,-1)">';
    var anyPool = false;
    S.shuffle[key].chips.forEach(function (it) {
      if (!(it in placed)) { anyPool = true; h += chipHTML(esc(ex.items[it].t), a.picked === it, 'Z.dndPick(' + it + ')', 'Z.dragStart(event,' + it + ')', false); }
    });
    if (!anyPool) h += '<span class="empty-hint">All items placed.</span>';

  function orderHTML(ex, key, a) {
    var n = ex.steps.length;
    if (!a.slots || a.slots.length !== n) { a.slots = []; for (var q = 0; q < n; q++) a.slots.push(null); }
    var placed = {}, i;
    for (i = 0; i < a.slots.length; i++) { if (a.slots[i] != null) placed[a.slots[i]] = i; }
    var h = '<div class="dnd"><div class="pool"><div class="pool-h">Item bank — build the sequence</div><div class="pool-box" ondragover="Z.dragOver(event)" ondragleave="Z.dragLeave(event)" ondrop="Z.orderDrop(event,-1)">';
    var anyPool = false;
    S.shuffle[key].chips.forEach(function (it) {
      if (!(it in placed)) { anyPool = true; h += chipHTML(esc(ex.steps[it]), a.picked === it, 'Z.orderPick(' + it + ')', 'Z.dragStart(event,' + it + ')', false); }
    });
    if (!anyPool) h += '<span class="empty-hint">All items placed.</span>';
    h += '</div></div><div class="bank"><div class="bank-h">Timeline — first line on top</div>';
    for (i = 0; i < n; i++) {
      var it = a.slots[i];
      h += '<div class="slot-row"><div class="slot' + (it != null ? ' slot-filled' : '') + '" tabindex="0" role="button" aria-label="position ' + (i + 1) + '"'
        + ' ondragover="Z.dragOver(event)" ondragleave="Z.dragLeave(event)" ondrop="Z.orderDrop(event,' + i + ')"'
        + ' onclick="Z.orderSlot(' + i + ')"'
        + ' onkeydown="Z.slotKey(event,\'orderSlot\',' + i + ')">'
        + '<span class="slot-lab">' + (i + 1) + '.</span>'

        + '</div><div class="seq-btns">'
        + '<button aria-label="move up" onclick="Z.orderMove(' + i + ',-1)">▲</button>'
        + '<button aria-label="move down" onclick="Z.orderMove(' + i + ',1)">▼</button>'
