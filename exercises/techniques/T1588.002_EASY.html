.fb-why { color: var(--text-primary); }

/* ============ Skipped review ============ */
.skip-list { list-style: none; padding: 0; margin: 0; }

}

/* ============ Results ============ */
.results-hero { text-align: center; padding: 26px 20px 18px; }
.results-hero .pct { font-size: 52px; font-weight: 900; font-family: var(--font-mono); line-height: 1; }
.results-hero .verdict { font-size: 24px; font-weight: 900; letter-spacing: 2px; margin-top: 8px; display: inline-flex; align-items: center; gap: 10px; }

.verdict.fail { color: var(--state-incorrect); }
.cert-panel {
  border: 2px solid var(--state-correct); border-radius: var(--radius);

  padding: 18px 22px; margin: 16px 0; text-align: center;
}
.cert-panel .cert-title { font-size: 20px; font-weight: 800; color: var(--state-correct); letter-spacing: 1px; }
.cert-panel p { color: var(--text-secondary); margin: 6px 0 0; }
.res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 16px 0; }
.res-cell { background: var(--bg-surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.res-cell .r-no { font-size: 26px; font-weight: 800; font-family: var(--font-mono); }
.res-cell .r-label { color: var(--text-secondary); font-size: 13.5px; display: flex; gap: 6px; align-items: center; margin-top: 4px; }
.res-cell.fully .r-no { color: var(--state-correct); }
.res-cell.partial .r-no { color: var(--state-partial); }
.res-cell.incorrect .r-no { color: var(--state-incorrect); }
.res-cell.skipped .r-no { color: var(--state-skipped); }
.res-meta { color: var(--text-secondary); font-size: 14px; margin: 12px 0; }
.res-meta b { color: var(--text-primary); }
.results-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }

<script>
"use strict";
window.__CPA_INTRO__ = {"intro":{"partLine":null,"learn":["\u003cp\u003e\u003cb\u003eT1588.002 — Tool\u003c/b\u003e is a sub-technique of \u003cb\u003eT1588 Obtain Capabilities\u003c/b\u003e, which sits in the \u003cb\u003eResource Development\u003c/b\u003e tactic (TA0042). It covers adversaries that \u003cb\u003ebuy, steal, or download\u003c/b\u003e software tools they plan to use during targeting — usually before an intrusion starts.\u003c/p\u003e","\u003cp\u003eA \u003cb\u003etool\u003c/b\u003e is not malware: it was not written to be malicious. PsExec, Nmap and similar dual-use programs have honest admin and testing uses; an adversary simply turns them to other ends. ATT&CK draws the boundary by the author's \u003cb\u003eoriginal intent\u003c/b\u003e, and a few well-known utilities are documented on both the Malware and the Tool pages.\u003c/p\u003e","\u003cp\u003eDo not confuse obtaining with building: \u003cb\u003edownloading\u003c/b\u003e someone else's C2 framework is T1588.002, while \u003cb\u003ewriting your own\u003c/b\u003e is T1587.002 (Develop Capabilities). Tools range from free open-source downloads to commercial products that need a licence, such as Cobalt Strike.\u003c/p\u003e","\u003cp\u003eYou will meet this topic in several roles: CTI maps actor toolsets, the SOC separates admin use from abuse, detection engineering hunts default configurations, red-team governance manages licences, and asset management spots unlicensed software on the estate.\u003c/p\u003e","\u003cp\u003eYou cannot patch this behaviour away. Acquisition happens outside the victim's network, so M1056 marks it \u003cb\u003ePre-compromise\u003c/b\u003e — it cannot be mitigated directly. Detection effort therefore lands on \u003cb\u003epost-compromise\u003c/b\u003e evidence such as default beacon settings and watermarks.\u003c/p\u003e"],"keywords":[{"theme":"Boundaries & definitions","items":["Tool vs malware (original intent)","Obtain vs develop (T1587.002)","Free vs commercial spectrum"]},{"theme":"Dual-use toolkit categories","items":["C2 frameworks","Credential tools","Lateral movement","Scanning & remote access"]},{"theme":"Licence acquisition channels","items":["Free open-source download","Zero-cost acquisition of offensive tools"]},{"theme":"Detection & mitigation","items":["M1056 Pre-compromise","Post-compromise detection focus"]}],"types":"multiple choice, multi-select, matching, ordering, fill-in-the-blank, drag & drop","howExtra":[]},"parentId":"T1588","parentName":"Obtain Capabilities"};
window.__EX_A__ = [{"id":"EX-01","type":"qcm","concepts":["C01"],"scenario":"You are onboarding at the Northgate Utilities SOC. Onboarding ticket #2210 asks a warm-up question: an adversary buys hacking tools several weeks before touching any victim network. Which ATT&CK tactic does that activity belong to?","question":"Which tactic covers an adversary buying or downloading tools before an intrusion?","hint":"Tactics are matrix columns ordered by phase — which column holds preparation that happens before any victim is touched?","explanation":"Buying, stealing or downloading tools is capability-building. ATT&CK places it in Resource Development, tactic TA0042. It happens before the intrusion, outside the victim's estate. Execution, Persistence and Reconnaissance all describe actions against a target, and this purchase happens first, off the victim's network.","study":"MITRE ATT&CK T1588.002 — Tool (sub-technique of T1588 Obtain Capabilities, TA0042).","options":[{"id":"A","text":"Execution (TA0002), because tools get run on victims"},{"id":"B","text":"Resource Development (TA0042), before the intrusion begins"},{"id":"C","text":"Persistence (TA0003), because the tools stay behind"},{"id":"D","text":"Reconnaissance (TA0043), because it gathers target information"}],"correct":"B","optionWhy":{"A":"Execution is running code on the victim — the purchase happens earlier and off-estate.","C":"Persistence is keeping access on a victim — nothing is deployed yet.","D":"Reconnaissance is gathering information about the target, not acquiring software."}},{"id":"EX-02","type":"qcm","concepts":["C02"],"scenario":"A CTI trainee at Helvetia Freight sorts a software list into 'malware' and 'tool'. The rule from the class: a tool was not written to be malicious, even though attackers use it. Look at the four items and pick the one that is a tool.","question":"Which item is a tool rather than malware?","hint":"Look at original intent: was the software written to be malicious, or written for admins and later repurposed?","explanation":"PsExec is a legitimate administrator utility from Sysinternals. Attackers obtain and repurpose it, but its author wrote it for remote administration — that is the definition of a tool in T1588.002. The other three items were written from the start to harm victims, so they are malware.","study":"ATT&CK T1588.002 description: unlike malware, tools were not intended to be malicious (ex: PsExec).","options":[{"id":"A","text":"A custom backdoor written by the intrusion crew"},{"id":"B","text":"A purpose-built ransomware payload sold by a crew"},{"id":"C","text":"PsExec, a remote-administration utility"},{"id":"D","text":"An infostealer written to harvest saved passwords"}],"correct":"C","optionWhy":{"A":"It was written to be malicious from the start — that is malware.","B":"Ransomware exists to harm and extort — malware, not a tool.","D":"An infostealer was built to steal — malware, even if it looks small."}},{"id":"EX-03","type":"qcm","concepts":["C03"],"scenario":"In a training drill at Bramble Cyber, one actor downloads the Sliver C2 framework from its public repository. In a second case, a different actor writes its own bespoke C2 from scratch. Match each case to the right sub-technique.","question":"Which pairing of case and sub-technique is correct?","hint":"Obtaining ready-made software is not the same as developing your own — T1588.002 vs T1587.002.","explanation":"Downloading Sliver means the actor obtains an existing tool: T1588.002, Obtain Capabilities: Tool. Writing a bespoke C2 in-house means the actor develops a capability: T1587.002, Develop Capabilities: Tool. The other pairings swap the boundary or claim both cases are the same, which they are not.","study":"T1588.002 (obtain) vs T1587.002 (develop) — the obtain/build boundary.","options":[{"id":"A","text":"Downloading Sliver is T1588.002; writing a bespoke C2 is T1587.002"},{"id":"B","text":"Downloading Sliver is T1587.002; writing a bespoke C2 is T1588.002"},{"id":"C","text":"Both cases are T1588.002 — obtaining and developing are equivalent"},{"id":"D","text":"Both cases are T1587.002 — any C2 work counts as development"}],"correct":"A","optionWhy":{"B":"This swaps the boundary: downloading is obtaining, building is developing.","C":"The sub-techniques are distinct — obtain is not develop.","D":"Downloading a public framework involves no development at all."}},{"id":"EX-04","type":"match","concepts":["C04"],"scenario":"An intro class on ATT&CK boundaries discusses how the same software can be classed as tool, malware, or both. Match each software name to the classification note that explains it.","question":"Match each software name to its classification note.","hint":"The boundary is the author's original intent — and some dual-use software appears on both ATT&CK pages.","explanation":"PsExec is a tool: it was written as an admin utility. A crew's custom backdoor is malware: it was written to do harm. Mimikatz shows the nuance: ATT&CK documents it as malware, yet it also appears on the Tool page because so many groups obtain it like a tool. The two leftover notes do not fit any item.","study":"T1588.002 vs T1588.001 — dual-use software can appear under either page.","left":[{"id":"L1","text":"PsExec"},{"id":"L2","text":"A crew's custom backdoor"},{"id":"L3","text":"Mimikatz"}],"right":[{"id":"R1","text":"Tool — written as a legitimate admin utility, later repurposed"},{"id":"R2","text":"Malware — written from the start to do harm"},{"id":"R3","text":"Dual-use — documented as malware, yet also listed on the Tool page"},{"id":"R4","text":"Exploit — a bug used to gain access (T1588.005)"},{"id":"R5","text":"Neither — ordinary office productivity software"}],"map":{"L1":"R1","L2":"R2","L3":"R3"},"why":{"L1":"PsExec's author wrote an admin utility; attackers merely repurpose it, so it is a tool.","L2":"The backdoor existed only to harm victims — malware by original intent.","L3":"Mimikatz is a credential dumper, but ATT&CK's group pages also record it as an obtained tool — dual-use software can be classed either way."}},{"id":"EX-05","type":"fill","concepts":["C05"],"scenario":"A briefing slide shows a spectrum of software. At one end sits Nmap, at the other sits Cobalt Strike. Complete the sentence with the missing terms.","question":"Complete the sentence with the two missing terms.","hint":"Think about each author's licence model: who distributes their work for free, and who sells licences?","explanation":"Nmap is free open-source software: anyone can download it, read its source and use it without paying. Cobalt Strike is commercial software: a team must buy a licence. Together they show the spectrum — tools can be open or closed source, free or commercial.","study":"T1588.002: tools can be open or closed source, free or commercial.","template":"Nmap is {{1}} software: anyone can download it and read its source code without paying. Cobalt Strike is {{2}} software: a team must buy a licence before using it.","blanks":[{"accept":["free open-source","free open source","open-source","open source","free"],"display":"free open-source","why":"Nmap is distributed under an open licence at no cost — the free open-source end of the spectrum."},{"accept":["commercial","closed-source","closed source","commercial closed-source"],"display":"commercial","why":"Cobalt Strike is sold as a licensed commercial product — the commercial end of the spectrum."}]},{"id":"EX-06","type":"qcm","concepts":["C06"],"scenario":"While reading a prep notebook, you learn that an actor downloaded a C2 framework and then ran its payloads against a trial antivirus/EDR suite, months before any intrusion. Look again at the two purposes of tool acquisition. What does the EDR part show?","question":"Which purpose of tool acquisition does the EDR testing show?","hint":"Remember the second purpose of tool acquisition: testing payloads against antivirus/EDR.","explanation":"ATT&CK's Tool page names two purposes: supporting post-compromise behaviour, and testing — for example evaluating malware against commercial antivirus or EDR products. Running payloads against a trial EDR suite before an operation is exactly that second purpose. Nothing here involves developing code, persisting, or moving between hosts.","study":"T1588.002: tools may be leveraged for testing, e.g. evaluating malware against commercial AV/EDR.","options":[{"id":"A","text":"Developing malware, because the crew prepared new code"},{"id":"B","text":"Lateral movement, because the tools touched many hosts"},{"id":"C","text":"Persistence, because the framework stayed on a host"},{"id":"D","text":"Testing malware against antivirus/EDR before an operation"}],"correct":"D","optionWhy":{"A":"Nothing was written — an existing framework was only run in a lab.","B":"No victim hosts were touched; the testing happened on the actor's side.","C":"A trial EDR lab is not a persistence mechanism."}},{"id":"EX-07","type":"match","concepts":["C08"],"scenario":"A study card lists four C2 and post-exploitation frameworks that groups obtain again and again. Match each framework to the one-line trait that describes it.","question":"Match each framework to its one-line trait.","hint":"Think about what each framework is famous for: commercial beacons, PowerShell, Meterpreter, and the Go language.","explanation":"Cobalt Strike is the commercial framework famous for its beacon and Malleable C2 profiles. Empire is built around PowerShell and Python agents. Metasploit is the long-established exploitation framework with Meterpreter. Sliver is a modern open-source C2 framework written in Go. The web-app testing note matches none of them.","study":"Post-exploitation/C2 frameworks on the T1588.002 page: Cobalt Strike, Empire, Metasploit, Sliver.","left":[{"id":"L1","text":"Cobalt Strike"},{"id":"L2","text":"Empire"},{"id":"L3","text":"Metasploit"},{"id":"L4","text":"Sliver"}],"right":[{"id":"R1","text":"Commercial framework known for beacons and Malleable C2 profiles"},{"id":"R2","text":"Post-exploitation framework built around PowerShell and Python agents"},{"id":"R3","text":"Long-established exploitation framework with the Meterpreter payload"},{"id":"R4","text":"Open-source C2 framework written in Go"},{"id":"R5","text":"Browser automation framework used to test web applications"}],"map":{"L1":"R1","L2":"R2","L3":"R3","L4":"R4"},"why":{"L1":"Cobalt Strike is sold commercially and is best known for its beacon and malleable C2 profiles.","L2":"Empire's agents are classic PowerShell (and later Python) post-exploitation tooling.","L3":"Metasploit is the classic exploitation framework and ships the Meterpreter payload.","L4":"Sliver is an open-source C2 framework written in Go, used by several groups."}},{"id":"EX-08","type":"dd","concepts":["C09"],"scenario":"A mentor asks you to sort five tools from the study cards into 'credential tools' and 'not credential tools'. Credential tools grab passwords and secrets from a system. Drag each tool into the right bin.","question":"Sort the five tools into the correct bins.","hint":"Ask what each tool's core job is: grabbing secrets, scanning a network, or remote control.","explanation":"Mimikatz, Windows Credential Editor and gsecdump all exist to extract passwords, hashes or secrets from Windows systems — the credential bin. Nmap scans networks and AnyDesk gives remote control, so neither touches the credential job. Knowing this binning helps you predict what a tool's use means in an incident.","study":"Credential tools on the T1588.002 page: Mimikatz, Windows Credential Editor, gsecdump, pwdump, WebBrowserPassView.","bins":[{"id":"B1","text":"Credential tools"},{"id":"B2","text":"Not credential tools"}],"items":[{"id":"T1","text":"Mimikatz","bin":"B1"},{"id":"T2","text":"Windows Credential Editor","bin":"B1"},{"id":"T3","text":"gsecdump","bin":"B1"},{"id":"T4","text":"Nmap","bin":"B2"},{"id":"T5","text":"AnyDesk","bin":"B2"}],"why":{"T1":"Mimikatz extracts passwords, hashes and tickets from memory — a credential tool.","T2":"Windows Credential Editor dumps login credentials — a credential tool.","T3":"gsecdump extracts hashes and secrets from Windows — a credential tool.","T4":"Nmap is a network scanner; it looks for hosts and services, not secrets.","T5":"AnyDesk is remote-control software; it shows a screen, it does not dump credentials."}}];
</script>

<script>
window.__EX_B__ = [{"id":"EX-09","type":"match","concepts":["C10"],"scenario":"The next study card covers lateral-movement tools — software that runs commands on other machines. Match each tool to the mechanism it uses to do that.","question":"Match each lateral-movement tool to its mechanism.","hint":"These tools all run commands on other machines — think SMB services, Linux-to-Windows access, and multi-protocol support.","explanation":"PsExec runs programs remotely by creating or using a service over SMB. Winexe runs commands on Windows hosts from a Linux system over SMB — it is a standalone utility, not part of the Impacket suite. CrackMapExec is the multi-protocol swiss-army knife that validates credentials and runs commands at scale. The ransom note describes a different capability entirely.","study":"Lateral-movement tools on the T1588.002 page: PsExec, Impacket/Winexe, CrackMapExec.","left":[{"id":"L1","text":"PsExec"},{"id":"L2","text":"Winexe"},{"id":"L3","text":"CrackMapExec"}],"right":[{"id":"R1","text":"Runs programs remotely by creating or using services over SMB"},{"id":"R2","text":"Executes commands on Windows hosts from a Linux system over SMB"},{"id":"R3","text":"Validates credentials and runs commands across many hosts over SMB and other protocols"},{"id":"R4","text":"Encrypts a victim's files and demands a payment"}],"map":{"L1":"R1","L2":"R2","L3":"R3"},"why":{"L1":"PsExec's signature behaviour is remote service creation and execution over SMB (the admin share).","L2":"Winexe lets an operator drive Windows command execution from a Linux box over SMB.","L3":"CrackMapExec works across SMB and other protocols to check credentials and run commands at fleet scale."}},{"id":"EX-10","type":"dd","concepts":["C11"],"scenario":"Now sort five more tools into 'network discovery' and 'remote access'. Discovery tools look around a network; remote-access tools give an operator a session on a machine. Drag each one into the correct bin.","question":"Sort the five tools into the correct bins.","hint":"Discovery tools look around the network; remote-access tools give you a session.","explanation":"RustScan, SoftPerfect Network Scanner and SNScan all find hosts, ports or services — the discovery bin. AnyDesk and PuTTY give an operator interactive access to a machine — the remote-access bin. Groups such as BlackTech have been reported obtaining SNScan, and PuTTY turns up in toolsets precisely because it is a session tool.","study":"Scanning/recon tools on the T1588.002 page: Nmap, RustScan, SoftPerfect, SNScan; remote access: AnyDesk, PuTTY.","bins":[{"id":"B1","text":"Network discovery / scanning"},{"id":"B2","text":"Remote access"}],"items":[{"id":"T1","text":"RustScan","bin":"B1"},{"id":"T2","text":"SoftPerfect Network Scanner","bin":"B1"},{"id":"T3","text":"SNScan","bin":"B1"},{"id":"T4","text":"AnyDesk","bin":"B2"},{"id":"T5","text":"PuTTY","bin":"B2"}],"why":{"T1":"RustScan is a fast port scanner — pure discovery.","T2":"SoftPerfect Network Scanner sweeps subnets for hosts and shares — discovery.","T3":"SNScan hunts for SNMP-enabled devices — discovery.","T4":"AnyDesk gives interactive remote control of a desktop — remote access.","T5":"PuTTY opens terminal sessions to other machines — remote access."}},{"id":"EX-11","type":"fill","concepts":["C22"],"scenario":"A report line reads: 'The actor pulled its whole toolset straight from a public code hosting site.' Nothing was bought, stolen or written. Complete the sentence about this acquisition channel.","question":"Complete the sentence with the two missing terms.","hint":"Ask where each program comes from and under what licence it is distributed.","explanation":"Downloading open-source tools from a public code site costs nothing, so the channel is a free download of open-source software. This is the most common acquisition route on the ATT&CK page: many groups simply pull public tools from code hosting sites. It is still T1588.002 — obtaining, not developing.","study":"T1588.002 acquisition channels: free download of open-source tools (e.g. from code hosting sites).","template":"The actor pulled the tools straight from a public code hosting site, so the acquisition channel was a {{1}} download of {{2}} software.","blanks":[{"accept":["free","zero-cost","no-cost","zero cost","no cost"],"display":"free","why":"Open-source tools on public code sites cost nothing to obtain."},{"accept":["open-source","open source"],"display":"open-source","why":"The licence lets anyone read, reuse and redistribute the code — open-source software."}]},{"id":"EX-12","type":"qcm","concepts":["C34"],"scenario":"A GRC reviewer at Northgate Utilities asks the SOC quiz panel a pointed question: 'If we harden our firewall, will that stop an adversary from buying or downloading their toolkit?' Choose the honest answer.","question":"Which answer about stopping tool acquisition is honest?","hint":"Ask where the behaviour happens relative to the victim's estate — inside their controls, or before them?","explanation":"Acquisition happens on the attacker's side, before the intrusion, so no victim-side control can prevent it — M1056 marks T1588.002 as Pre-compromise, not directly mitigable. From the attacker's view the purchase is invisible; from the defender's view the honest move is to prepare: watch for post-compromise evidence such as default beacon settings and watermarks. Claims that a firewall or IPS rule blocks a purchase are wrong.","study":"M1056 Pre-compromise — this technique cannot be easily mitigated with preventive controls.","options":[{"id":"A","text":"Yes — a firewall rule blocking downloads stops all tool acquisition"},{"id":"B","text":"Yes — blocking the vendor's website prevents any licence purchase"},{"id":"C","text":"No — the behaviour happens before the intrusion, outside enterprise controls (M1056)"},{"id":"D","text":"No — but an IPS rule can still block the purchase halfway"}],"correct":"C","optionWhy":{"A":"The adversary downloads on their own infrastructure — your firewall never sees it.","B":"The vendor's site is on the attacker's side of the wire; you cannot block it.","D":"An IPS inspects victim traffic; a purchase made elsewhere never crosses it."}},{"id":"EX-13","type":"order","concepts":["C06","C08"],"scenario":"A fictional crew with call-sign 'Larkspur' prepares a Cobalt Strike toolkit for an operation. The steps were noted on a whiteboard during a training exercise. Put the four preparation steps in the order an operator would normally do them.","question":"Order the four preparation steps from first to last.","hint":"First get the licence, last deploy the beacon — the middle steps prepare and test.","explanation":"Preparation starts with obtaining the commercial licence, because the framework cannot be used without it. Configuration comes next: the operator loads and adjusts the Malleable C2 profile. Testing against a trial antivirus/EDR suite then shows what detections fire. Deployment of the beacon is the final, operational step — everything before it exists to make that step work.","study":"Tool acquisition supports later operations: obtain, configure, test, deploy.","items":[{"id":"I1","text":"Buy a Cobalt Strike licence from a reseller"},{"id":"I2","text":"Load and adjust a Malleable C2 profile in the framework"},{"id":"I3","text":"Run the beacon payload against a trial antivirus/EDR suite"},{"id":"I4","text":"Deploy the beacon during the operation"}],"why":{"I1":"Nothing can be configured or tested before the licence and framework are obtained.","I2":"With the framework in hand, the operator shapes its traffic and behaviour with the profile.","I3":"Testing happens after configuration so the exact payload that will be used is the one measured.","I4":"Deployment is the operational goal — the last step of preparation and the first of the operation."}},{"id":"EX-14","type":"match","concepts":["C02","C04"],"scenario":"A revision quiz gives you four software names. Judge each by what it was originally written to be — not by how an attacker might use it. Match each name to its verdict.","question":"Match each software name to its tool-or-malware verdict.","hint":"Judge by what the software was originally written to be, not by how it is used.","explanation":"PsExec was written as a Sysinternals admin utility — a tool. SDelete was written as a secure-delete utility for administrators — also a tool. A banking trojan was built to steal money and credentials — malware. A keygen is a cracking utility: unlawful to use, but not malware by intent. The claim that anything used in an attack is malware is the trap — original intent decides.","study":"The tool/malware boundary is the author's original intent (ex: PsExec).","left":[{"id":"L1","text":"PsExec"},{"id":"L2","text":"SDelete"},{"id":"L3","text":"A banking trojan"},{"id":"L4","text":"A keygen for a design suite"}],"right":[{"id":"R1","text":"Tool — a legitimate admin utility, however it is used"},{"id":"R2","text":"Tool — a secure-delete utility written for administrators"},{"id":"R3","text":"Malware — built to steal money and credentials"},{"id":"R4","text":"Tool — a cracking utility; unlawful use, but not malware by intent"},{"id":"R5","text":"Malware — anything used during an attack counts as malware"}],"map":{"L1":"R1","L2":"R2","L3":"R3","L4":"R4"},"why":{"L1":"PsExec's original purpose is remote administration — a tool even when abused.","L2":"SDelete securely deletes files for admins; attackers obtain it for cleanup — still a tool.","L3":"A banking trojan was written to steal — malware by original intent.","L4":"A keygen was written to defeat licence checks — a cracking utility, not a harmful program by design."}},{"id":"EX-15","type":"multi","concepts":["C08","C09"],"scenario":"A quick-fire quiz shows five tools from your study cards. Select the TWO credential tools — the ones built to grab passwords and secrets.","question":"Select the two credential tools.","hint":"Two of these five grab credentials from memory and storage; the others scan, tunnel or give access.","explanation":"Mimikatz and gsecdump both extract passwords, hashes or secrets from Windows systems — that is the credential bin. Nmap scans networks, Tor hides traffic, and PuTTY opens terminal sessions; none of them collects credentials. If you can bin a tool by its core job, you can predict what its use means in an incident.","study":"Credential tools: Mimikatz, gsecdump, Windows Credential Editor, pwdump, WebBrowserPassView.","options":[{"id":"A","text":"Nmap"},{"id":"B","text":"PuTTY"},{"id":"C","text":"Mimikatz"},{"id":"D","text":"Tor"},{"id":"E","text":"gsecdump"}],"correct":["C","E"],"optionWhy":{"A":"Nmap is a network scanner — it finds hosts and ports, not passwords.","B":"PuTTY opens terminal sessions — remote access, not credential collection.","D":"Tor hides the origin of traffic — an anonymity tool, not a credential tool."}}];

/* ============ CyberPulseAcademy exam engine (vanilla JS, self-contained) ============ */
(function () {

    if (attrs) {

  /* ---------------- data ---------------- */
  var META = JSON.parse(document.getElementById("cm-exercise-meta").textContent);
  var __intro = (window.__CPA_INTRO__ || {});
  var DATA = {
    intro: __intro.intro || {},
    parentId: __intro.parentId || null,

  /* ---------------- scoring (single source of truth) ---------------- */
  function scoreExercise(selectedItems, correctItems) {
    var N = correctItems.length;
    if (!N) return 0;
    var set = {};
    correctItems.forEach(function (c) { set[c] = true; });
    var H = 0, W = 0;
    selectedItems.forEach(function (s) { if (set[s]) H++; else W++; });
    return Math.max(0, (H - W) / N);
  }

  /* ---------------- timer state machine ---------------- */
  var TS = { RUNNING: "RUNNING", PAUSED_MANUAL: "PAUSED_MANUAL", PAUSED_AUTO_CHECK: "PAUSED_AUTO_CHECK", ENDED: "ENDED" };
  var Timer = {
    state: TS.RUNNING,
    remaining: META.timerSeconds,
    prevState: null,
    int: null,
    manualMs: 0,
    autoMs: 0,
    stamp: 0,
    setState: function (s) {
      if (this.state === s) return;
      var now = Date.now();
      if (this.state === TS.PAUSED_MANUAL) this.manualMs += now - this.stamp;
      if (this.state === TS.PAUSED_AUTO_CHECK) this.autoMs += now - this.stamp;
      if (s === TS.PAUSED_MANUAL || s === TS.PAUSED_AUTO_CHECK) this.stamp = now;
      this.prevState = this.state;
      this.state = s;
      renderHeaderState();
      if (s === TS.RUNNING && !this.int) {
        this.int = setInterval(tick, 1000);
      }
      if (s === TS.PAUSED_MANUAL || s === TS.PAUSED_AUTO_CHECK) {
        if (this.int) { clearInterval(this.int); this.int = null; }
      }
      if (s === TS.ENDED && this.int) { clearInterval(this.int); this.int = null; }
    },
    start: function () {
      this.setState(TS.RUNNING);
      if (!this.int) this.int = setInterval(tick, 1000);
    },
    onCheck: function () {
      /* First action of Check: auto-pause before feedback renders. */
      if (this.state === TS.RUNNING) this.setState(TS.PAUSED_AUTO_CHECK);
    },
    onNext: function () {
      if (this.state === TS.PAUSED_AUTO_CHECK) {
        this.setState(Attempt.reviewMode ? TS.RUNNING : TS.RUNNING);
      } else if (this.state === TS.PAUSED_MANUAL) {
        this.setState(this.prevState === TS.PAUSED_AUTO_CHECK ? TS.PAUSED_AUTO_CHECK : TS.RUNNING);
      }
    },
    manualPause: function () {
      if (this.state === TS.ENDED) return;
      if (this.state === TS.PAUSED_MANUAL) {
        this.setState(this.prevState === TS.PAUSED_AUTO_CHECK ? TS.PAUSED_AUTO_CHECK : TS.RUNNING);
        $("#pause-cover").classList.add("hidden");
        $("#btn-pause").textContent = "⏸ Pause";
        $("#btn-pause").setAttribute("aria-label", "Pause exam (hides exercise)");
      } else {
        this.setState(TS.PAUSED_MANUAL);
        $("#pause-cover").classList.remove("hidden");
        $("#btn-pause").textContent = "▶ Resume";
        $("#btn-pause").setAttribute("aria-label", "Resume exam");
      }
    }
  };
  function tick() {
    if (Timer.state !== TS.RUNNING) return;
    Timer.remaining -= 1;
    if (Timer.remaining <= 0) {
      Timer.remaining = 0;
      renderTimer();
      endByTimeout();
      return;
    }
    renderTimer();
  }

  /* ---------------- attempt state ---------------- */
  var Attempt = {
    no: 1,
    order: [],
    pos: 0,
    credits: {},
    answered: {},
    hintUsed: {},
    skipped: [],
    reviewMode: false,
    reported: false,
    optionOrders: {},
    currentIdx: function () { return this.order[this.pos]; },
    creditSum: function () {
      var s = 0;
      Object.keys(this.credits).forEach(function (k) { s += this.credits[k]; }, this);
      return s;
    },
    answeredCount: function () { return Object.keys(this.answered).length; }
  };

  /* ---------------- screens ---------------- */
  var screens = ["#screen-intro", "#screen-exam", "#screen-skipped", "#screen-results"];
  function showScreen(id) {
    screens.forEach(function (s) { $(s).classList.toggle("hidden", s !== id); });
    window.scrollTo(0, 0);
  }

  /* ---------------- handshake (site -> exam) ---------------- */
  var handshake = { user: "", country: "", locale: "en" };
  window.addEventListener("message", function (event) {
    if (!event.data || typeof event.data.type !== "string") return;
    var t = event.data.type;
    if (t !== "CYBERPULSE_INIT" && t !== "CYBERMASTERY_INIT" && t !== "CYBERMASTERMASTERY_INIT") return;
    handshake.user = event.data.username || handshake.user;
    handshake.country = event.data.country || handshake.country;
    if (event.data.locale) handshake.locale = event.data.locale;
  });

  /* ---------------- score report (exam -> site) ---------------- */
  function reportScore(creditSum, answeredCount) {
    var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
    if (!window.parent || window.parent === window) {
      /* Opened directly rather than inside the site. Nothing to report to — and no
         postMessage target-origin warning on file:// or sandboxed previews. */
      return;
    }
    try {
      parent.postMessage({
        type: "CYBERPULSE_SCORE",
        topicId: META.topicId,
        batch: META.batch,
        score: Math.round(creditSum),
        total: answeredCount,
        percent: percent,
        passed: percent >= META.passMark
      }, location.origin);
    } catch (e) {
      /* Cross-origin or closed parent: nothing to report to. */
    }
  }

  /* ================= INTRO SCREEN ================= */
  function renderIntro() {
    var root = $("#screen-intro");
    root.innerHTML = "";
    var head = el("div", { class: "intro-head" }, [
      el("p", { class: "kicker", text: "CyberPulseAcademy — Certification Exam" }),
      el("h1", { text: META.title + partLabel }),
      el("p", { class: "muted", html: "<b style='color:var(--text-primary)'>" + esc(META.mitreId) + " — " + esc(META.objectName) + "</b> · MITRE ATT&CK " + esc(META.objectType) + (META.parentName ? " (sub-technique of " + esc(META.parentId) + " " + esc(META.parentName) + ")" : "") }),
      el("div", { class: "intro-facts" }, [
        el("span", { class: "fact", html: "🧩 Exercises: <b>" + META.questionCount + "</b>" }),
        el("span", { class: "fact sev-fact", html: "<span class='badge sev-badge' style='color:" + sev.color + ";border-color:" + sev.color + "'>◈ " + sev.label + "</span>" }),
        el("span", { class: "fact", html: "⏱ Estimated time: <b>" + META.estimatedMinutes + " min</b> · timer budget <b>" + Math.round(META.timerSeconds / 60) + " min</b>" }),
        el("span", { class: "fact", html: "🎯 Pass mark: <b>" + META.passMark + "%</b>" })
      ])
    ]);
    var learn = el("section", { class: "intro-section", "aria-labelledby": "h-learn" }, [
      el("h2", { id: "h-learn", html: "<span class='sec-ico'>📘</span> What you will learn here" })
    ]);
    if (DATA.intro.partLine) learn.appendChild(el("p", { class: "muted", html: "<b>" + esc(DATA.intro.partLine) + "</b>" }));
    DATA.intro.learn.forEach(function (p) { learn.appendChild(el("div", { class: "scenario-body", html: p })); });

    var kw = el("section", { class: "intro-section", "aria-labelledby": "h-kw" }, [
      el("h2", { id: "h-kw", html: "<span class='sec-ico'>🔑</span> Keywords covered in this exam" })
    ]);
    DATA.intro.keywords.forEach(function (th) {
      kw.appendChild(el("div", { class: "theme-panel" }, [
        el("h3", { text: th.theme }),
        el("ul", {}, th.items.map(function (i) { return el("li", { text: i }); }))
      ]));
    });

    var how = el("section", { class: "intro-section", "aria-labelledby": "h-how" }, [
      el("h2", { id: "h-how", html: "<span class='sec-ico'>⚙️</span> How this exam works" })
    ]);
    var rules = [];
    rules.push(["🎯", "You need <b>" + META.passMark + "%</b> to pass. A <b>PASS</b> confirms you master this topic. A <b>FAIL</b> means you should retake the exam after studying."]);
    rules.push(["🧩", "<b>" + META.questionCount + " exercises</b> in this exam. Types used: " + esc(DATA.intro.types) + "."]);
    rules.push(["⏱", "The countdown starts at <b>" + Math.round(META.timerSeconds / 60) + " minutes</b>. The timer paces the exam — it is not a race."]);
    rules.push(["⏸", "<b>Manual Pause</b> button: the timer stops and the exercise is hidden while you take a break. Press Resume to continue."]);
    rules.push(["⏸", "<b>Check pauses the timer automatically.</b> When you press Check, the timer stops so you can read the feedback with no time pressure. It resumes only when you press Next (or Final Submit on the last exercise)."]);
    rules.push(["📊", "<b>Partial credit:</b> exercises with several correct items give credit per item: credit = max(0, (correct − wrong) / items). Selecting everything is not a strategy — wrong items cancel correct ones."]);
    rules.push(["💡", "<b>Hint:</b> one hint per exercise. A hint costs −10% of that exercise's credit (clamped at 0)."]);
    rules.push(["⏭", "<b>Skip:</b> you may skip an exercise and review it at the end. Skipped-and-never-answered exercises are excluded from your score."]);
    rules.push(["🔁", "<b>Retake:</b> you can retake the exam; questions and answer choices are shuffled again."]);
    rules.push(["🛡", "All indicators of compromise in this exam are <b>defanged</b> (for example 10[.]0[.]0[.]1 and hxxp[:]//). Nothing here is live."]);
    if (DATA.intro.howExtra) DATA.intro.howExtra.forEach(function (r) { rules.push(["➕", r]); });
    var ul = el("ul", { class: "intro-rules" });
    rules.forEach(function (r) {
      ul.appendChild(el("li", {}, [el("span", { class: "rule-ico", text: r[0] }), el("span", { html: r[1] })]));
    });
    how.appendChild(ul);
    var startWrap = el("div", { class: "intro-start" }, [
      el("button", { class: "btn btn-primary btn-large", id: "btn-start", text: "▶ Start exam", "aria-label": "Start the exam" }),
      el("span", { class: "note", text: "When you press Start, the timer begins. Good luck!" })
    ]);
    how.appendChild(startWrap);
    root.appendChild(head); root.appendChild(learn); root.appendChild(kw); root.appendChild(how);
    $("#btn-start").addEventListener("click", startExam);
  }

  /* ================= EXAM HEADER ================= */
  function renderHeaderState() {
    var chip = $("#hdr-state");
    if (!chip) return;
    chip.className = "hdr-chip";
    if (Timer.state === TS.RUNNING) {
      chip.classList.add("state-running");
      chip.innerHTML = "<span aria-hidden='true'>▶</span> <span>Timer <b>RUNNING</b></span>";
      chip.setAttribute("aria-label", "Timer running");
    } else if (Timer.state === TS.PAUSED_MANUAL) {
      chip.classList.add("state-paused-manual");
      chip.innerHTML = "<span aria-hidden='true'>⏸</span> <span>PAUSED — manual (press Resume)</span>";
      chip.setAttribute("aria-label", "Timer paused manually, press Resume");
    } else if (Timer.state === TS.PAUSED_AUTO_CHECK) {
      chip.classList.add("state-paused-auto");
      chip.innerHTML = "<span aria-hidden='true'>⏸</span> <span>PAUSED — reviewing feedback (resumes on Next)</span>";
      chip.setAttribute("aria-label", "Timer paused for feedback review, resumes on Next");
    } else {
      chip.classList.add("state-ended");
      chip.innerHTML = "<span aria-hidden='true'>■</span> <span>Timer <b>ENDED</b></span>";
      chip.setAttribute("aria-label", "Timer ended");

  }
  function renderTimer() { var t = $("#hdr-timer b"); if (t) t.textContent = fmtClock(Timer.remaining); }
  function renderScore() {
    var sum = Attempt.creditSum(), n = Attempt.answeredCount();
    var pct = n ? Math.round((sum / n) * 100) : 0;
    var chip = $("#hdr-score");
    if (chip) chip.innerHTML = "Score <b>" + (Math.round(sum * 10) / 10) + " / " + n + "</b> · " + pct + "%";

    if (fill) fill.style.width = Math.round((Attempt.pos / Math.max(1, Attempt.order.length)) * 100) + "%";
  }
  function buildHeader() {
    var h = $("#exam-header");
    var pc = $("#pause-cover");

    var row = el("div", { class: "hdr-row" }, [
      el("div", { class: "hdr-title" }, [
        el("span", { class: "badge sev-badge", style: "color:" + sev.color + ";border-color:" + sev.color, html: "◈ " + sev.label + (partLabel ? " <span class='sr-only'>split part</span>" : "") }),
        el("span", { class: "t", text: META.mitreId + " — " + META.objectName + (partLabel ? " · Part " + META.part + " of " + META.partsTotal : "") })
      ]),
      el("span", { class: "hdr-chip", id: "hdr-count", html: "Exercise <b>–</b>" }),
      el("span", { class: "hdr-chip timer", id: "hdr-timer", html: "⏱ <b>--:--</b>" }),
      el("span", { class: "hdr-chip", id: "hdr-state", html: "" }),

      el("div", { class: "hdr-btns" }, [
        el("button", { class: "btn", id: "btn-hint", text: "💡 Hint", "aria-label": "Show hint (costs 10 percent of this exercise credit)" }),
        el("button", { class: "btn", id: "btn-pause", text: "⏸ Pause", "aria-label": "Pause exam (hides exercise)" }),

      ])
    ]);
    h.appendChild(row);
    h.appendChild(el("div", { id: "progress-track", role: "progressbar", "aria-label": "Exam progress" }, [el("div", { id: "progress-fill", class: "sheen", style: "background:linear-gradient(90deg, var(--accent-blue), " + sev.color + ")" })]));
    $("#btn-hint").addEventListener("click", useHint);
    $("#btn-pause").addEventListener("click", Timer.manualPause.bind(Timer));
    $("#btn-skip").addEventListener("click", skipExercise);
    var coverBtn = $("#btn-resume-cover");
    if (coverBtn) coverBtn.addEventListener("click", Timer.manualPause.bind(Timer));
    renderHeaderState();
  }

  /* ================= EXERCISE RENDER ================= */
  function artefactNode(a, n) {
    var kind = a.kind || "text";
    var label = "ARTEFACT " + n + " — " + a.title;
    var body = el("div", { class: "art-body" });
    if (kind === "log") {
      var lines = a.lines || String(a.body || "").split("\n");
      var wrap = el("div", { class: "logviewer" });
      var flt = el("input", { class: "log-filter", type: "search", placeholder: "filter…", "aria-label": "Filter log lines" });
      var cnt = el("span", { class: "log-count", text: lines.length + " lines" });
      var list = el("div", { class: "log-lines", role: "log" });
      function draw() {
        var q = (flt.value || "").toLowerCase();
        list.innerHTML = "";
        var shown = 0;
        lines.forEach(function (ln, i) {
          if (q && ln.toLowerCase().indexOf(q) === -1) return;
          shown++;
          var c = el("span", { class: "lc" });
          c.innerHTML = highlightLog(ln);
          list.appendChild(el("div", { class: "log-line" }, [el("span", { class: "ln", text: String(i + 1) }), c]));
        });
        cnt.textContent = shown + " / " + lines.length + " lines";
      }
      flt.addEventListener("input", draw);
      wrap.appendChild(el("div", { class: "log-toolbar" }, [el("label", { text: "filter" }), flt, cnt]));
      wrap.appendChild(list);
      body.appendChild(wrap);
      draw();
    } else if (kind === "code") {
      body.appendChild(el("div", { class: "codeblock", html: highlightCode(a.body || "") }));
    } else if (kind === "table") {
      var t = el("table", { class: "items-table" });
      (a.rows || []).forEach(function (r) {
        t.appendChild(el("tr", {}, r.map(function (c, i) { return el(i === 0 ? "th" : "td", { text: c, style: i === 0 ? "white-space:nowrap;color:var(--text-secondary);text-align:left" : "" }); })));
      });

  function typeName(t) {

  function widgetChoice(ex, idx, disp) {

    }
    disp.forEach(function (oid, i) {

  function buildOptionItems(ex, sel, isMulti) {

  function dispOrderFor(ex) {

  function widgetMatch(ex, idx, disp) {

  function widgetOrder(ex, idx, disp) {
    var node = el("div", { class: "widget" });
    node.appendChild(el("p", { class: "widget-note", text: "Put the items in the correct order. Use the arrow buttons or drag the rows. Each item in its correct position earns credit; each misplaced item subtracts." }));
    var list = el("ul", { class: "order-list" });

        });

  function widgetFill(ex, idx) {
