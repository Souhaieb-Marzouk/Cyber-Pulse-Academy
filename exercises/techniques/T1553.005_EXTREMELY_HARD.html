.paused-overlay{position:fixed;inset:0;z-index:100;background:var(--bg-page);display:flex;align-items:center;justify-content:center;padding:20px}
.paused-card{background:var(--bg-surface);border:1px solid var(--state-paused);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 30px;max-width:440px;text-align:center}
.paused-card .pico{font-size:34px;color:var(--state-paused)}
.paused-card h2{margin:10px 0 6px;font-size:19px;color:var(--state-paused)}
.paused-card p{margin:0 0 18px;color:var(--text-secondary);font-size:14.5px}
/* ---------- responsive ---------- */
@media (max-width:760px){
  .dnd{grid-template-columns:1fr}
  .matchrow{grid-template-columns:1fr}
  .intro{padding:16px 12px 40px}
  .stage{padding:14px 10px 48px}
  .hdr{padding:8px 10px}
  .fact{font-size:12.5px}
}
@media (prefers-reduced-motion: reduce){
  .progress-fill{transition:none}
  .progress-fill::after{animation:none;display:none}
  .btn,.opt,.bankitem,.order-btns button,.zone,.match-sel{transition:none}
  *{scroll-behavior:auto!important}
}

<script type="application/json" id="exam-data">{"topicId":"t1553.005","batch":4,"difficulty":"extremely-hard","severity":"EXTREMELY HARD","passMark":70,"estimatedMinutes":45,"mitreId":"T1553.005","mitreName":"Mark-of-the-Web Bypass","objectType":"Sub-Technique","intro":{"learn":["This exam is about the MITRE ATT&CK sub-technique T1553.005, called Mark-of-the-Web Bypass, a Defense Evasion member of the T1553 family. This file is the expert tier: three or more concepts are chained, and at least one signal in every chain contradicts another.","The full picture you must hold at once: the Zone.Identifier stream and its five zone values; what SmartScreen, Protected View and the Office macro block do with the mark; the removal and rewrite moves (Unblock-File, Remove-Item -Stream, Set-Content -Stream); the format-based escapes through mounted ISO/IMG/VHD images and stream-less staging; and the telemetry that watches it all — Sysmon 15/23/26, PowerShell 4103/4104, Office audit and EDR events.","The conflicting signal you will meet most: a stream that claims the intranet (ZoneId=1) against proxy evidence of an internet download. You must decide which record wins, say why, and accept what the loss of certainty does to your response options.","This is senior work: SOC leads defend a triage decision to the CISO, incident responders refuse the deletion that would feel satisfying, detection engineers tune controls that survive the design team's legitimate mounting workflow, threat hunters separate noise from signal, mail security teams balance filtering against the business, and administrators push the agreed settings through MDM tools such as Intune. The first terminal is timed — four minutes, as in a real escalation."],"keywords":[{"theme":"Conflicting evidence","items":["ZoneId=1 intranet claim versus proxy logs","which signal wins and why","incomplete 4104 records","realistic background noise"]},{"theme":"Chained tradecraft","items":["Remove-Item -Stream deletion","Set-Content -Stream rewrite","IcedID VHD lure chain","mounted-image delivery with no mark"]},{"theme":"Evidence discipline","items":["read-only stream reads","stream-preserving acquisition","cost-of-action decisions","evidence destruction as a trap"]},{"theme":"Proportionate response","items":["escalate or gather more evidence","compensating detection instead of blanket blocks","Attack Surface Reduction rules","mail filtering with business exceptions"]}],"how":["You will answer 15 exercises. You need 70% or more to pass. A pass means a senior reviewer would sign off on your decisions.","Exercise types in this exam: multiple choice, matching pairs, drag and drop, fill-in-the-blank, one branching decision tree, and two simulated PowerShell terminals. The FIRST terminal has its own 4-minute limit (240 seconds) shown on screen before it starts.","A countdown timer runs for 45 minutes. The Pause button hides the exercise and stops the timer until you press Resume.","When you press Check, the timer stops automatically so you can read the feedback as long as you like. It starts again when you press Next. The 4-minute terminal limit also stops during the Check pause.","Exercises with several items give partial credit: max(0, (correct − wrong) / items). One hint per exercise is allowed; it costs 10% of that exercise's credit. Hints here only restate a constraint — they will not point at the answer.","Skip moves an exercise to a review pool. Near the end you can answer skipped exercises. Skipped exercises you never answer do not count in your score at all. In the terminals you type the command yourself and press Enter to run it."]},"exercises":[{"id":"e01","type":"single","perspective":"defender","scenario":{"summary":"INC-4402 — the stream says intranet, the proxy says internet","text":["INC-4402: jmonroe on WKS-FIN-07 opened inv0347.xlsx from 'accounting'. The file's stream claims the intranet. The proxy disagrees.","The IR lead needs one line in the report: which record decides the file's origin, and why."],"artefacts":[{"label":"ARTEFACT 1 — Zone.Identifier stream of inv0347.xlsx","kind":"code","lines":["[ZoneTransfer]","ZoneId=1","HostUrl=hxxp://staff[.]portal[.]internal[.]example/dl/inv0347.xlsx"]},{"label":"ARTEFACT 2 — Proxy log, WKS-FIN-07 (filter box available)","kind":"log","filter":true,"lines":["09:12:03  GET  widget[.]corp-banner[.]example/telemetry  category=commerce  user=jmonroe  (desktop widget heartbeat)","09:57:58  GET  hxxp://files[.]portal-share[.]example[.]com/dl/inv0347.xlsx  category=internet  user=jmonroe  → 198[.]51[.]100[.]24","(no request to staff[.]portal[.]internal[.]example anywhere in the 09:00–10:10 window)"]},{"label":"ARTEFACT 3 — Sysmon, WKS-FIN-07","kind":"log","filter":false,"lines":["09:58:12  Event 15  FileCreateStreamHash  C:\\Users\\jmonroe\\Downloads\\inv0347.xlsx:Zone.Identifier","10:02:44  Event 26  FileDeleteDetected   C:\\Users\\jmonroe\\Downloads\\inv0347.xlsx:Zone.Identifier","10:06:02  Event 11  FileCreate            C:\\Users\\jmonroe\\AppData\\Roaming\\wupd32.exe"]},{"label":"ARTEFACT 4 — PowerShell 4104 at 10:02:43 (incomplete)","kind":"text","lines":["Record truncated by log rotation: “…-Path C:\\Users\\jmonroe\\Downl” — the cmdlet name and the rest of the path are missing."]}]},"question":"Which record decides the file's origin, and why?","options":[{"id":"a","text":"The proxy log wins: the zone value is file content anyone can write, the network record is independent"},{"id":"b","text":"The stream wins: Windows writes Zone.Identifier itself and it cannot be altered"},{"id":"c","text":"Neither wins: the truncated 4104 proves the zone value was rewritten"},{"id":"d","text":"The stream wins: ZoneId=1 always means the internal portal served the file"}],"correct":["a"],"hint":"One of the two records travels inside a file that an attacker can rewrite at will.","explain":["The stream is attacker-writable file content — tools can set any ZoneId, which is exactly what a forged intranet claim looks like. The proxy record lives outside the file, on a device the attacker did not control, so it wins: the file arrived from the internet.","Option b and d both trust a writable claim, and d adds a false absolute about zone values. Option c over-reads a truncated record: incompleteness is not proof of rewriting — it is a gap to fill with better records, not a finding."]},{"id":"e02","type":"match","perspective":"defender","scenario":{"summary":"Weigh the five rows of INC-4402","text":["Before the escalation call, the IR lead asks you to state what each row of the case file is worth as evidence.","Match each row to its evidential weight."]},"question":"Match each row to its evidential weight.","pairs":[{"left":"ZoneId=1 written in the stream at 09:58","right":"A file-content claim, not proof of intranet origin"},{"left":"Proxy GET from an internet host at 09:57:58","right":"Independent network evidence of internet origin"},{"left":"Event 26 on the stream at 10:02:44","right":"The mark was removed about a minute after landing"},{"left":"Weather-widget fetch at 09:12","right":"Unrelated background noise — ignore it"},{"left":"4104 record truncated at 10:02:43","right":"An incomplete datum — query the warm tier before quoting it"}],"hint":"Two rows carry the conflict, one row carries the removal, and two rows must not be over-read.","explain":["The conflict pair: a writable stream claim against an independent network record — the network record carries the origin conclusion. Event 26 then proves the mark was deleted at 10:02:44.","The widget fetch is the realistic noise item that every real log carries. The truncated 4104 is incomplete evidence: quote it as a gap and close the gap from the warm tier, never as a finding."]},{"id":"e03","type":"terminal","perspective":"defender","scenario":{"summary":"Timed: show the recovered removal command before the CISO call","text":["The CISO joins in four minutes. She wants the removal proof on screen: the exact 4104 command text that the SIEM analyst recovered from the warm tier after log rotation truncated the online copy.","The recovered record is exported to D:\\ir\\4402\\warm\\4104-recovered.txt on your response workstation. Print the recovered line; change nothing — the export feeds the case file afterwards."],"artefacts":[{"label":"ARTEFACT 1 — IR lead note","kind":"text","lines":["Answer in 4 minutes. Read-only. Quote the recovered row, not a retype."]}]},"question":"Type the command that prints the recovered 4104 line.","terminal":{"prompt":"analyst@WKS-IR-01","banner":["Windows PowerShell — IR response workstation (simulated)","Recovered export: D:\\ir\\4402\\warm\\4104-recovered.txt  (SIEM warm tier)","⏱ 4-minute exercise limit — the CISO is waiting"],"solution":"Select-String -Path D:\\ir\\4402\\warm\\4104-recovered.txt -Pattern 'Zone.Identifier'","elements":[{"label":"search cmdlet Select-String","re":"^[Ss]elect-[Ss]tring( |$)"},{"label":"-Path to the warm-tier export","re":"4104-recovered\\.txt"},{"label":"the mark pattern Zone.Identifier","re":"[Zz]one\\.[Ii]dentifier"}],"outputs":[{"re":"4104-recovered\\.txt","lines":["10:02:43  PS 4104  ScriptBlock  Remove-Item -Path C:\\Users\\jmonroe\\Downloads\\inv0347.xlsx -Stream Zone.Identifier","1 match in 4104-recovered.txt — quote this row in the CISO pack."]},{"re":"^[Ss]elect-[Ss]tring","lines":["Select-String ran without the export path — give -Path D:\\ir\\4402\\warm\\4104-recovered.txt.","Without the file, nothing useful prints for the CISO pack."]}],"nearMiss":[{"re":"Remove-Item","msg":"Remove-Item deletes files or streams — the classic destructive typo while the clock runs; the export is evidence, read it and never change it."},{"re":"^[Ss]et-[Cc]ontent","msg":"Set-Content would write to the export — a state change on case evidence."}],"nearMissSample":"Remove-Item -Path D:\\ir\\4402\\warm\\4104-recovered.txt","partialSample":"Select-String -Pattern 'Zone.Identifier'","timeLimit":240},"hint":"The clock is the constraint; the search cmdlet, the export path, and the mark pattern are the three graded elements.","explain":["The canonical command is: Select-String -Path D:\\ir\\4402\\warm\\4104-recovered.txt -Pattern 'Zone.Identifier' — a read-only search that prints the recovered removal command word for word, fast enough for the CISO clock.","Remove-Item and Set-Content both change state on the export, so the sandbox flags them as dangerous near misses. Dropping -Path leaves the search running against the wrong location: two of the three graded elements, one third of the credit, and nothing useful on screen."]},{"id":"e04","type":"drag","perspective":"defender","scenario":{"summary":"Sort the six proposed actions for INC-4402","text":["Six actions are on the war-room board for INC-4402. Some alter nothing, some must wait, one class ends the case.","Sort them by when the playbook allows them."]},"question":"Sort each action into the correct column.","zones":[{"id":"z1","label":"Do now — alters nothing","accepts":["i1","i2"]},{"id":"z2","label":"After evidence is preserved","accepts":["i3","i4"]},{"id":"z3","label":"Never — destroys or alters evidence","accepts":["i5","i6"]}],"items":[{"id":"i1","text":"Read the stream on the working copy"},{"id":"i2","text":"Pull the proxy records for the 09:00–10:10 window"},{"id":"i3","text":"Remove the payload from the host"},{"id":"i4","text":"Re-image the workstation"},{"id":"i5","text":"Delete inv0347.xlsx to 'remove the MOTW risk'"},{"id":"i6","text":"Clear the mark on the original in the user's Downloads folder"}],"hint":"Two of the six cannot be undone once done.","explain":["Reading the stream and pulling proxy records alter nothing, so they run immediately — they are also the actions that decide everything else.","Removing the payload and re-imaging wipe the artefacts, so they wait until memory and a stream-preserving image are in hand. Deleting the file 'to remove the MOTW risk' and clearing the mark on the original are the cost-of-action traps: both destroy the evidence that proves T1553.005 was used."]},{"id":"e05","type":"branch","perspective":"defender","scenario":{"summary":"The escalation call, step by step","text":["You are on the INC-4402 escalation call. Each answer commits the next step of the response. Choose with the evidence discipline the case demands."],"artefacts":[{"label":"ARTEFACT 1 — SIEM warm tier, recovered 4104 at 10:02:43","kind":"log","filter":true,"lines":["10:02:43  PS 4104  ScriptBlock  Remove-Item -Path C:\\Users\\jmonroe\\Downloads\\inv0347.xlsx -Stream Zone.Identifier"]},{"label":"ARTEFACT 2 — Preservation note","kind":"text","lines":["Host WKS-FIN-07: powered on, memory captured 10:19, stream-preserving image started 10:21."]}]},"question":"Work through the escalation call to the final call.","branch":{"steps":[{"prompt":"The stream says ZoneId=1; the proxy says internet. What goes in the report?","options":[{"id":"a","text":"Origin = internet; record the stream claim as untrusted file content"},{"id":"b","text":"Origin = intranet; Windows wrote the stream itself"},{"id":"c","text":"Leave the origin blank until someone confesses"}],"correct":"a","outcome":"The report reads: internet origin, stream claim recorded as untrusted."},{"prompt":"Event 26 shows the stream deleted at 10:02:44 and 4104 was truncated. Next move?","options":[{"id":"a","text":"Query the SIEM warm tier for the full 4104 record"},{"id":"b","text":"Attribute the intrusion to a named crime group now"},{"id":"c","text":"Delete the file so it cannot run on anyone else"}],"correct":"a","outcome":"The warm tier returns the full command: Remove-Item with -Stream on the inv0347.xlsx mark."},{"prompt":"The host is still live and the user is working. The proportionate move?","options":[{"id":"a","text":"Preserve memory and a stream-preserving image, host stays powered on"},{"id":"b","text":"Reboot now to clear volatile infection"},{"id":"c","text":"Do nothing until Monday's change window"}],"correct":"a","outcome":"Preservation completes: memory at 10:19, image writing from 10:21."}],"final":{"question":"The CISO wants one call, right now. What do you say?","options":[{"id":"a","text":"Escalate to the IR lead with the preserved timeline; scope check starts tonight"},{"id":"b","text":"Close the case — the stream looked like the intranet, so it was the intranet"},{"id":"c","text":"Wipe the host before the finance close to be safe"},{"id":"d","text":"Email all staff a warning about spreadsheet attachments and move on"}],"correct":["a"]}},"hint":"Every step you choose must leave the host's memory intact.","explain":["The chain: resolve the conflict with the network record, recover the truncated command from the warm tier, preserve before anything destructive. Only then is an escalation call defensible.","The wipe option destroys a powered-on host full of volatile evidence for zero gain, the blame-the-stream close ignores two contradicting records, and a mass mail warns everyone but investigates nothing. Escalation with a preserved timeline is the call that survives scrutiny."]},{"id":"e06","type":"blank","perspective":"defender","scenario":{"summary":"Codify the mount-correlation rule for the estate","text":["The INC-4402 findings leave one lane open: the design team keeps mounting client media, so mark-based warnings stay blind there. The committee funds a compensating correlation rule instead of a mount ban.","The rule fires when a payload is born with no mark history: Sysmon's file-creation event for a new executable in user-writable space, with no stream-creation event ever logged for that file.","Fill the two event IDs in the rule text. Both numbers appeared in the case artefacts you have already read."]},"question":"Fill both blanks in the rule text.","blanks":[{"before":"Alert when Sysmon event ","after":" (FileCreate) records a new executable in user-writable space, and ","answer":["11"],"hint":"the Sysmon file-creation ID from the case timeline"},{"before":"","after":" (FileCreateStreamHash) never fired for that same file — a payload born with no mark.","answer":["15"],"hint":"the stream-creation ID, used here by its absence"}],"hint":"One ID sees any file being created; the other sees the mark being written. Both have appeared in this case's artefacts.","explain":["Sysmon event 11 is the plain file-creation event — it fires for every new file, which is why the rule scopes it to executables in user-writable space. Sysmon event 15 is FileCreateStreamHash, the event that fires when a mark is written. The correlation is the absence: event 11 with no event 15 behind it means the payload was born without a mark.","That is the mounted-image tell in one rule: files read out of mounted ISO/IMG/VHD images never receive a Zone.Identifier, so there is no stream event to find. Scoping to user-writable executables keeps the alert volume survivable across the estate, and the absence form protects the design team's sanctioned mounting lane without banning it. A rewritten stream would not fire here — Set-Content keeps a stream alive, so the rewrite case stays with the content checks."]},{"id":"e07","type":"match","perspective":"defender","scenario":{"summary":"The lab's command-verdict matrix","text":["After a near miss during INC-4402, the lab printed a command-verdict matrix next to every terminal: read the exact command, give the exact verdict.","Match each proposed command to the verdict the matrix records."]},"question":"Match each command to its verdict.","pairs":[{"left":"Get-Item -Path 'E:\\WKS-FIN-07\\Users\\jmonroe\\Downloads\\inv0347.xlsx' -Stream *","right":"Safe — a read-only inventory on the mount"},{"left":"Unblock-File -Path C:\\Lab\\INC-4402\\detonation-copy.docm","right":"Allowed — the runbook's sanctioned lab write"},{"left":"Unblock-File -Path E:\\Evidence\\INC-4402\\inv0347.xlsx","right":"Forbidden — writes to the evidence of record"},{"left":"Remove-Item -Path D:\\ir\\4402\\work\\inv0347-copy.xlsx -Stream Zone.Identifier","right":"Forbidden — deletes the stream the case file needs"},{"left":"Set-Content -Path D:\\ir\\4402\\work\\inv0347-copy.xlsx -Stream Zone.Identifier","right":"Forbidden — rewrites the mark's text instead of reading it"}],"hint":"The verb decides the class — read, sanctioned write, or alter/destroy — and the path decides whether a write is sanctioned at all.","explain":["Reads stay safe wherever they run: an inventory on the read-only mount changes nothing. Unblock-File is a real state change, so it is only allowed on the sanctioned lab copy — the same cmdlet against the evidence original is the write the case rule forbids.","On the working copy, Remove-Item with the stream parameter deletes the very stream the case file still needs, and Set-Content rewrites the mark's text — alteration is its own failure mode, distinct from deletion. The matrix exists because the near miss during INC-4402 came from the right verb on the wrong path."]},{"id":"e08","type":"multi","perspective":"defender","scenario":{"summary":"Two conclusions the INC-4402 evidence supports","text":["The IR lead allows exactly two sentences about origin in the report. Five candidate sentences are on the whiteboard; two are supported.","Choose the two the evidence actually supports."]},"question":"Select the TWO conclusions the evidence supports.","options":[{"id":"a","text":"The file arrived from the internet despite the ZoneId=1 claim"},{"id":"b","text":"The stream content was forged or rewritten after download"},{"id":"c","text":"The intranet portal served the file, exactly as the stream says"},{"id":"d","text":"The proxy row belongs to a different download because the timestamps differ by seconds"},{"id":"e","text":"The mark is irrelevant here because it only applies to executables"}],"correct":["a","b"],"hint":"The network record does not live inside the file.","explain":["The proxy shows the internet download; the stream claims intranet. Both supported sentences follow: the file came from the internet, and the writable stream claim was therefore forged or rewritten — there is no third option that fits both records.","The portal story is contradicted by the proxy window. A seconds-wide gap between download and save is exactly what a normal save looks like, so d misreads the clock. And the mark applies to documents and archives as much as to executables, so e is simply false."]},{"id":"e09","type":"match","perspective":"dual","scenario":{"summary":"Red-team debrief — the VHD chain, trace by trace","text":["Your emulation reproduced the documented IcedID-style VHD lure: a 'scanned fax' container, a disguised shortcut, a stream-less loader, then the second stage.","The blue team wants each step matched to the trace they can actually query."]},"question":"Match each step of the VHD chain to its trace.","pairs":[{"left":"Mail delivers Document_0442.vhd as a 'scanned fax'","right":"Gateway log shows the VHD attachment"},{"left":"User mounts the VHD and Windows opens it as a disk","right":"Mount event with a new drive letter"},{"left":"The .lnk disguised as a PDF is double-clicked","right":"Process creation with the mounted path as parent"},{"left":"Loader drops to %APPDATA% with no mark","right":"Sysmon Event 11 for a stream-less executable"},{"left":"Second stage fetched from hxxp://cdn[.]update-svc[.]example[.]top","right":"Outbound TLS from the loader process"}],"hint":"Match where the file was born and how it moved — not what it later did on the network.","explain":["The chain leaves five queryable traces: the attachment at the gateway, the mount event, the child process from the mounted path, and the stream-less drop — the mounted-image escape that leaves no mark to warn with.","The last row separates file biography from network behaviour: the TLS fetch is the second stage's own trace. Joining the stream-less drop with the mount event is how defenders recognise this chain as T1553.005-adjacent staging.","Attacker perspective: the VHD chain buys a loader that no zone warning ever names — after the mount, every click lives outside the mark's reach.","Defender perspective: the two traces to join are the mount event and the stream-less file creation; the gateway row and the TLS fetch bracket the chain, but neither proves the bypass on its own."]},{"id":"e10","type":"single","perspective":"defender","scenario":{"summary":"The committee's blanket mount ban meets the design team","text":["After INC-4402 the security committee proposes blocking all ISO/IMG/VHD mounting for every account.","The design team mounts client-supplied .iso media daily for legitimate deliveries; the pipeline owner confirms a total block breaks their contractually agreed workflow. The CIO wants a decision that survives both constraints."]},"question":"Which decision survives both constraints?","options":[{"id":"a","text":"Block all mounting everywhere — security outweighs the design workflow"},{"id":"b","text":"Allow mounting everywhere and rely on awareness training alone"},{"id":"c","text":"Filter image mail except the design alias; detect stream-less payloads after each mount"},{"id":"d","text":"Skip controls; re-image the design machines every week instead"}],"correct":["c"],"hint":"One proposal keeps the delivery pipeline alive and still closes the lure lane.","explain":["The committee's blanket ban is the best-practice-wrong-here trap: it stops the lure, but it also stops a contracted workflow. The compensating pattern survives both: filter image attachments where the risk lives (mail), keep the approved alias open, and detect the tell — a stream-less payload executing right after a mount event.","Option b removes the one lane the lure actually uses. Option d accepts weekly disruption and still misses mail-borne lures for everyone else. Option c is the least disruptive control set that cuts T1553.005 risk without breaking the workflow."]},{"id":"e11","type":"match","perspective":"defender","scenario":{"summary":"INC-4402 review — what each row bought","text":["The post-incident review walks the INC-4402 timeline once more, row by row.","Match each row to what it bought the case."]},"question":"Match each row to what it bought.","pairs":[{"left":"Word opens with no Protected View at 10:03","right":"Proof that no mark remained at open time"},{"left":"ASR event: WINWORD.EXE child process blocked","right":"The Office child-process rule stopped part of the chain"},{"left":"Only Event 26 on the stream — no Event 23 row","right":"The deletion was detected but not archived by Sysmon"},{"left":"Sysmon Event 15 at 09:58:12 on the Downloads file","right":"The mark existed from save until the 10:02:44 deletion"},{"left":"Mail gateway blocked the .iso for most users","right":"Delivery control worked where it was deployed"}],"hint":"Two rows bracket the mark's life, two rows show controls biting, one row shows what the bypass achieved.","explain":["Event 15 and Event 26 bracket the mark's life on the file: attached at save, deleted minutes later — and because only the detected-deletion event fired, Sysmon logged the removal without archiving the file, a detail the case review should note. That bracket is the spine of the T1553.005 finding.","The banner-less open shows what the bypass achieved. The ASR block and the gateway block show layered controls biting — the case had friction even though one user's document got through."]},{"id":"e12","type":"terminal","perspective":"defender","scenario":{"summary":"Case review prep — inventory every stream on the image","text":["The stream-preserving image of WKS-FIN-07 is mounted read-only at E:\\ on the forensic workstation. Tomorrow's case review wants the full stream inventory of the user's downloaded file, not just one stream.","Inventory every stream on E:\\WKS-FIN-07\\Users\\jmonroe\\Downloads\\inv0347.xlsx."],"artefacts":[{"label":"ARTEFACT 1 — Case review note","kind":"text","lines":["Mount is READ-ONLY. The review wants the complete stream list with sizes."]}]},"question":"Type the command that lists every stream on the file.","terminal":{"prompt":"analyst@SRV-FORENSIC-01","banner":["Windows PowerShell — forensic workstation (simulated)","E:\\  = stream-preserving image of WKS-FIN-07, mounted READ-ONLY"],"solution":"Get-Item -Path 'E:\\WKS-FIN-07\\Users\\jmonroe\\Downloads\\inv0347.xlsx' -Stream *","elements":[{"label":"inventory cmdlet Get-Item","re":"^[Gg]et-[Ii]tem( |$)"},{"label":"-Stream * (all streams)","re":"-Stream\\s+\\*"}],"outputs":[{"re":"-Stream\\s+\\*","lines":["  Name: inv0347.xlsx","  Stream: :$DATA            Length: 24612","  Stream: Zone.Identifier   Length: 158"]},{"re":"^[Gg]et-[Ii]tem","lines":["  Directory: E:\\WKS-FIN-07\\Users\\jmonroe\\Downloads","  inv0347.xlsx  24612 bytes  (file body listed — add -Stream * for the inventory)"]}],"nearMiss":[{"re":"Remove-Item","msg":"Remove-Item on a mounted image deletes from the case copy of record — never on evidence media."},{"re":"^[Uu]nblock-[Ff]ile","msg":"Unblock-File writes to the image; the mount is read-only and must stay that way."}],"nearMissSample":"Remove-Item -Path 'E:\\WKS-FIN-07\\Users\\jmonroe\\Downloads\\inv0347.xlsx' -Stream Zone.Identifier","partialSample":"Get-Item -Path 'E:\\WKS-FIN-07\\Users\\jmonroe\\Downloads\\inv0347.xlsx'"},"hint":"The mount is read-only; the review wants the inventory, not one stream.","explain":["The canonical command is: Get-Item -Path 'E:\\WKS-FIN-07\\Users\\jmonroe\\Downloads\\inv0347.xlsx' -Stream * — the inventory cmdlet plus the all-streams wildcard gives the review every stream with sizes, including whether Zone.Identifier still exists on the image copy.","Remove-Item and Unblock-File both write to or delete from evidence media — flagged as dangerous. Get-Item without -Stream * lists the file body only: one graded element of two, zero credit, and the review gets half an answer."]},{"id":"e13","type":"single","perspective":"defender","scenario":{"summary":"The CISO asks for an org-wide claim tonight","text":["The CISO drafts the board note: 'T1553.005 is being used against us org-wide.' Current evidence: one host, one file, one removal command. The estate-wide sweep of PowerShell 4104 is still running and returns tomorrow morning.","She asks you to bless the wording before she sends it."]},"question":"Which response do you give?","options":[{"id":"a","text":"Report one confirmed host; escalate; wait for the estate sweep before any wider claim"},{"id":"b","text":"Bless the org-wide wording — one confirmed bypass always means a campaign"},{"id":"c","text":"Close it as a one-off user mistake; no report or escalation needed"},{"id":"d","text":"Publish the file hash on the wallboard tonight and call it handled"}],"correct":["a"],"hint":"The estate-wide sweep has not returned yet.","explain":["One host is a data point, not a campaign. The defensible line names what is proven (one confirmed bypass, preserved timeline), escalates ownership to the IR lead, and waits for the sweep that either widens or bounds the finding.","Blessing the org-wide claim overstates the evidence and risks panic; closing it as a user mistake ignores a removed mark on a finance host; a wallboard hash is notification, not investigation. 'Do nothing yet — gather more evidence' is the senior answer."]},{"id":"e14","type":"blank","perspective":"attacker","scenario":{"summary":"How the intranet claim got there — for the report","text":["The review asks for one paragraph on HOW a stream can claim the intranet without the intranet being involved.","Complete the two facts from the tooling side."]},"question":"Fill both blanks for the report paragraph.","blanks":[{"before":"Overwriting the mark on disk needs only ","after":" with new stream text — no admin rights required.","answer":["Set-Content"],"hint":"the PowerShell write cmdlet"},{"before":"A forged intranet claim is written as ZoneId= ","after":" inside the stream — the value the trust model then believes.","answer":["1"],"hint":"the intranet zone digit"}],"hint":"One blank is a cmdlet name, the other is a single digit.","explain":["Set-Content with the -Stream parameter rewrites the Zone.Identifier content in place — the mark survives as a stream, but now carries attacker-chosen text, which is why rewritten streams must be read forensically rather than trusted.","ZoneId=1 is the intranet value; writing it makes Windows apply intranet-level trust to an internet file. Both facts belong in the report because they show the trust model's input is user-writable data."]},{"id":"e15","type":"multi","perspective":"defender","scenario":{"summary":"Fund the controls that survive the design constraint","text":["With the mount ban off the table, the committee funds the control set that reduces T1553.005 risk while the design team keeps mounting client media daily.","Five proposals remain; three are funded."]},"question":"Select the THREE proposals that get funded.","options":[{"id":"a","text":"Mail-gateway filtering of .iso/.img/.vhd for everyone except the approved design alias"},{"id":"b","text":"Detection that fires when an executable runs with no mark shortly after a mount event"},{"id":"c","text":"Attack Surface Reduction rule blocking Office applications from creating child processes"},{"id":"d","text":"Blocking all disk mounting for every account, including the design workflow"},{"id":"e","text":"Disabling SmartScreen prompts to cut alert fatigue"}],"correct":["a","b","c"],"hint":"Each funded control must leave the design team's daily mounting intact.","explain":["The gateway filter closes the mail lane that every documented lure uses while the alias keeps the business running. The mount-correlation detection catches stream-less payloads the moment they run — the compensating control for the lane that stays open. The ASR rule stops the macro-to-child-process step that turns a document into execution.","The blanket mount ban is the proposal the committee already rejected, and disabling SmartScreen removes a protection the mark exists to trigger — both fail the constraint or worsen the risk."]}]}</script>
<script>
(function () {
  'use strict';

  /* ============================ utilities ============================ */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function mulberry32(seed) {
    var t = seed >>> 0;
    return function () {
      t += 0x6D2B79F5;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffled(arr, rnd) {
    var a = arr.slice(), i, j, tmp;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(rnd() * (i + 1));
      tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function fmt1(n) { return (Math.round(n * 10) / 10).toFixed(1); }
  function fmt2(n) { return (Math.round(n * 100) / 100).toFixed(2); }
  function fmtPct(sum, count) { return count > 0 ? Math.round((sum / count) * 100) : 0; }
  function hashId(s) {
    var h = 0, i;
    for (i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h;
  }
  function exSeed(ex, salt) { return ((S.seed ^ 0x9E3779B9) * 2654435761 + hashId(ex.id) * 97 + salt) >>> 0; }

  /* ============================ data ============================ */
  var DATA = JSON.parse($('exam-data').textContent);
  var EXS = DATA.exercises;
  var TOTAL = EXS.length;
  var BUDGET = (DATA.estimatedMinutes || 25) * 60;
  var PASSMARK = DATA.passMark || 70;
  var SEVCLS = { 'EASY': 'sev-easy', 'MEDIUM': 'sev-medium', 'HARD': 'sev-hard', 'EXTREMELY HARD': 'sev-extreme' };
  var byId = {};
  EXS.forEach(function (e) { byId[e.id] = e; });

  /* ============================ state ============================ */
  var S = {
    screen: 'intro',        // intro | exam | review | results
    attempt: 0,
    order: [],
    pos: 0,
    answers: {},            // exId -> widget state
    results: {},            // exId -> graded result
    skipped: [],            // exIds in the skip pool (never answered yet)
    hintUsed: {},
    creditSum: 0,
    answeredCount: 0,
    state: 'RUNNING',       // RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED
    resumeState: null,
    remaining: BUDGET,
    pauseAccum: { manual: 0, autoCheck: 0 },
    posted: false,
    mode: 'main',           // main | review
    reviewList: [],
    seed: 1,
    checkedId: null,
    exTimer: null,          // { exId, remaining } for per-exercise timed terminal exercises
    handshake: null
  };

  /* ============================ timer ============================ */
  var lastTick = Date.now();
  setInterval(function () {
    var now = Date.now();
    var dt = (now - lastTick) / 1000;
    lastTick = now;
    if (dt < 0 || dt > 2) { dt = 0.25; }
    if (S.state === 'RUNNING') {
      S.remaining -= dt;
      if (S.remaining <= 0) { S.remaining = 0; updateHeader(); endByTimeout(); return; }
      if (S.exTimer && !S.results[S.exTimer.exId] && S.screen === 'exam') {
        S.exTimer.remaining -= dt;
        var et = $('ex-timer-clock');
        if (et) { et.textContent = fmtClock(S.exTimer.remaining); }
        if (S.exTimer.remaining <= 0) { S.exTimer.remaining = 0; doCheck(true); }
      }
      updateTimerClock();
    } else if (S.state === 'PAUSED_MANUAL') {
      S.pauseAccum.manual += dt;
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      S.pauseAccum.autoCheck += dt;
    }
  }, 250);

  function updateTimerClock() {
    var el = $('hdr-clock');
    if (el) { el.textContent = fmtClock(S.remaining); }
  }
  function setState(next) {
    S.state = next;
    renderTimerPill();
    renderPauseOverlay();
  }
  function renderTimerPill() {
    var pill = $('hdr-timer');
    if (!pill) { return; }
    var clock = '<span class="t-clock" id="hdr-clock">' + fmtClock(S.remaining) + '</span>';
    if (S.state === 'RUNNING') {
      pill.className = 'pill pill-timer st-run';
      pill.innerHTML = '<span class="t-state">▶ Running</span>' + clock;
    } else if (S.state === 'PAUSED_MANUAL') {
      pill.className = 'pill pill-timer st-pause';
      pill.innerHTML = '<span class="t-state">⏸ PAUSED — manual (press Resume)</span>' + clock;
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      pill.className = 'pill pill-timer st-pause';
      pill.innerHTML = '<span class="t-state">⏸ PAUSED — reviewing feedback (resumes on Next)</span>' + clock;
    } else {
      pill.className = 'pill pill-timer st-end';
      pill.innerHTML = '<span class="t-state">■ Ended</span>' + clock;
    }
  }

  /* ============================ header ============================ */
  function headerHtml() {
    var sev = DATA.severity;
    var cls = SEVCLS[sev] || 'sev-easy';
    return '<header class="hdr" id="hdr">' +
      '<div class="hdr-row">' +
        '<span class="counter" id="hdr-counter"></span>' +
        '<span class="sev ' + cls + '" id="hdr-sev"><span class="dot" aria-hidden="true"></span>' + esc(sev) + '</span>' +
        '<span class="hdr-spacer"></span>' +
        '<span class="pill pill-timer" id="hdr-timer" role="timer"></span>' +
        '<span class="pill" id="hdr-score" aria-label="Live score"></span>' +
      '</div>' +
      '<div class="hdr-row">' +
        '<button type="button" class="btn" id="btn-hint">? Hint</button>' +
        '<button type="button" class="btn" id="btn-skip">Skip »</button>' +
        '<button type="button" class="btn" id="btn-pause">⏸ Pause</button>' +
        '<div class="progress" role="progressbar" id="hdr-progress" aria-label="Exam progress" aria-valuemin="0" aria-valuemax="' + TOTAL + '" aria-valuenow="0">' +
          '<div class="progress-fill" id="progress-fill"></div>' +
        '</div>' +
      '</div>' +
    '</header>';
  }
  function updateHeader() {
    var ex = currentEx();
    var counter = $('hdr-counter');
    if (counter) {
      if (S.screen === 'results') {
        counter.textContent = 'Exam complete';
      } else {
        var n = S.pos + 1;
        counter.textContent = (S.mode === 'review' ? 'Review · ' : '') + 'Exercise ' + n + ' of ' + TOTAL;
      }
    }
    var score = $('hdr-score');
    if (score) {
      var pct = fmtPct(S.creditSum, S.answeredCount);
      score.innerHTML = 'Score <b>' + fmt1(S.creditSum) + '</b>&nbsp;/&nbsp;' + S.answeredCount + ' · ' + pct + '%';
    }
    var hint = $('btn-hint'), skip = $('btn-skip'), pause = $('btn-pause');
    var answered = ex && !!S.results[ex.id];
    if (hint) {
      hint.disabled = answered || !!S.hintUsed[ex ? ex.id : ''] || S.state !== 'RUNNING' && S.state !== 'PAUSED_AUTO_CHECK';
      hint.setAttribute('aria-label', 'Hint (costs 10% of this exercise credit, one use only)');
    }
    if (skip) {
      skip.disabled = answered || S.state !== 'RUNNING';
      skip.setAttribute('aria-label', 'Skip this exercise and move it to the skipped pool');
    }
    if (pause) {
      var manual = S.state === 'PAUSED_MANUAL';
      pause.innerHTML = manual ? '▶ Resume' : '⏸ Pause';
      pause.disabled = S.state === 'ENDED';
      pause.setAttribute('aria-label', manual ? 'Resume the exam' : 'Pause the exam manually (hides the exercise)');
    }
    var fill = $('progress-fill');
    if (fill) {
      var done = S.answeredCount + S.skipped.length;
      var pctW = TOTAL > 0 ? Math.round((done / TOTAL) * 100) : 0;
      fill.style.width = pctW + '%';
      var pb = $('hdr-progress');
      if (pb) { pb.setAttribute('aria-valuenow', String(done)); }
    }
  }

  /* ============================ intro screen ============================ */
  function renderIntro() {
    S.screen = 'intro';
    var intro = DATA.intro;
    var kw = (intro.keywords || []).map(function (grp) {
      return '<div class="kw-theme"><h3>' + esc(grp.theme) + '</h3><ul>' +
        grp.items.map(function (k) { return '<li>' + esc(k) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    var html =
      '<div class="intro">' +
        '<section class="intro-strip" aria-label="Exam facts">' +
          '<h1>' + esc(DATA.mitreId) + ' — ' + esc(DATA.mitreName) + '</h1>' +
          '<div class="intro-sub">' + esc(DATA.objectType) + ' · MITRE ATT&CK · ' + esc(DATA.severity) + ' practice exam</div>' +
          '<div class="factrow">' +
            '<span class="fact"><b>' + TOTAL + '</b> exercises</span>' +
            '<span class="sev ' + (SEVCLS[DATA.severity] || 'sev-easy') + '"><span class="dot" aria-hidden="true"></span>' + esc(DATA.severity) + '</span>' +
            '<span class="fact">Estimated time: <b>' + DATA.estimatedMinutes + ' min</b></span>' +
            '<span class="fact">Timer budget: <b>' + fmtClock(BUDGET) + '</b></span>' +
            '<span class="fact">Pass mark: <b>' + PASSMARK + '%</b></span>' +
          '</div>' +
        '</section>' +
        '<section class="intro-card"><h2>What you will learn here</h2>' +
          intro.learn.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
        '</section>' +
        '<section class="intro-card"><h2>Keywords covered in this exam</h2>' +
          '<div class="kw-grid">' + kw + '</div>' +
        '</section>' +
        '<section class="intro-card"><h2>How this exam works</h2>' +
          '<ul class="how-list">' + intro.how.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' +
          '<div class="intro-start">' +
            '<button type="button" class="btn btn-primary btn-big" id="btn-start">Start exam</button>' +
            '<span class="start-note">The timer starts when you press Start.</span>' +
          '</div>' +
        '</section>' +
      '</div>';
    var app = $('app');
    app.innerHTML = html;
    $('btn-start').addEventListener('click', startAttempt);
  }

  /* ============================ attempt control ============================ */
  function startAttempt() {
    S.attempt += 1;
    S.seed = 1 + S.attempt * 7919;
    S.order = EXS.map(function (_, i) { return i; });
    if (S.attempt > 1) {
      S.order = shuffled(S.order, mulberry32(S.seed));
    }
    S.pos = 0;
    S.answers = {};
    S.results = {};
    S.skipped = [];
    S.hintUsed = {};
    S.creditSum = 0;
    S.answeredCount = 0;
    S.pauseAccum = { manual: 0, autoCheck: 0 };
    S.posted = false;
    S.mode = 'main';
    S.reviewList = [];
    S.checkedId = null;
    S.exTimer = null;
    S.remaining = BUDGET;
    S.screen = 'exam';
    setState('RUNNING');
    renderExam();
  }
  function currentEx() {
    if (S.screen !== 'exam' && S.screen !== 'results') { return null; }
    if (S.pos < 0 || S.pos >= S.order.length) { return null; }
    return EXS[S.order[S.pos]];
  }

  /* ============================ exercise rendering ============================ */
  function scenarioLong(sc) {
    var chars = (sc.text || []).join(' ').length;
    return chars > 600 || (sc.artefacts && sc.artefacts.length >= 2);
  }
  function artefactHtml(a, idx) {
    var body;
    if (a.kind === 'log' || a.kind === 'code') {
      var lines = (a.lines || []).map(function (ln) {
        return '<span class="ln">' + highlight(ln) + '</span>';
      }).join('');
      var filter = a.filter ? '<input type="text" class="logfilter" data-filter="' + idx + '" placeholder="Filter lines (text match)" aria-label="Filter log lines">' : '';
      body = filter + '<pre class="mono loglines" data-logbody="' + idx + '">' + lines + '</pre>';
    } else {
      body = '<pre class="mono loglines">' + (a.lines || []).map(function (ln) { return esc(ln); }).join('\n') + '</pre>';
    }
    return '<div class="artefact"><div class="artefact-label"><span aria-hidden="true">▤</span>' + esc(a.label) + '</div>' + body + '</div>';
  }
  var SYN_RE = /(&quot;[^&]*?&quot;)|(\bT\d{4}(?:\.\d{3})?\b)|(--?[A-Za-z][\w-]*)|(\b[\w.\-]+(?:[\/\\][\w.\-@]+)+[\/\\]?)|(\b\d{1,3}(?:\[\.\]\d{1,3}){2,3}\b)|(\b(?:allowed|denied|accepted|rejected|granted|denied|quarantine|failed|success|error|warning|blocked|trusted|unblocked|Root|UNTRUSTED|SIGNATURE|PASS|FAIL)\b)/gi;
  function highlight(line) {
    var e = esc(line);
    return e.replace(SYN_RE, function (m, q, mid, flag, path, ip, kw) {
      if (q) { return '<span class="tok-s">' + q + '</span>'; }
      if (mid) { return '<span class="tok-m">' + mid + '</span>'; }
      if (flag) { return '<span class="tok-f">' + flag + '</span>'; }
      if (path) { return '<span class="tok-c">' + path + '</span>'; }
      if (ip) { return '<span class="tok-n">' + ip + '</span>'; }
      if (kw) { return '<span class="tok-k">' + kw + '</span>'; }
      return m;
    });
  }
  function optText(ex, oid) {
    var o = (ex.options || []).find(function (x) { return x.id === oid; });
    return o ? o.text : oid;
  }
  function optsHtml(ex, kind) {
    var rnd = mulberry32(exSeed(ex, 1));
    var ids = ex.options.map(function (o) { return o.id; });
    var view = shuffled(ids, rnd);
    var role = kind === 'single' ? 'radio' : 'checkbox';
    var a = S.answers[ex.id] || {};
    var sel = a.sel || [];
    return '<div class="opts" role="group" aria-label="Answer options">' + view.map(function (oid, i) {
      /* options are shuffled per attempt; correct positions vary */
      var isSel = sel.indexOf(oid) >= 0;
      return '<button type="button" class="opt" data-oid="' + esc(oid) + '" role="' + role + '" aria-checked="' + (kind === 'single' && isSel) + '" aria-pressed="' + (kind === 'multi' && isSel) + '">' +
        '<span class="opt-key">' + String.fromCharCode(65 + i) + '.</span>' +
        '<span class="opt-text">' + esc(optText(ex, oid)) + '</span>' +
        '<span class="opt-mark">' + (isSel ? '● Selected' : '') + '</span>' +
      '</button>';
    }).join('') + '</div>' +
    (kind === 'multi' ? '<p class="note">Select all options that apply. Partial credit is possible.</p>' : '');
  }
  function exerciseHtml(ex) {
    var sc = ex.scenario || {};
    var long = scenarioLong(sc);
    var paras = (sc.text || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
    var arts = (sc.artefacts || []).map(function (a, i) { return artefactHtml(a, i); }).join('');
    var body = '<div class="scen-body" id="scen-body">' + paras + arts + '</div>';
    var html = '';
    if (S.mode === 'review') {
      html += '<div class="review-banner">⚠ Skipped earlier — you are answering it now from the review screen. The timer is running.</div>';
    }
    html += '<section class="block" aria-label="Scenario">' +
      '<div class="block-h h-scenario"><span class="bico" aria-hidden="true">▤</span> SCENARIO<span class="hspacer"></span>' +
        '<button type="button" class="scen-toggle" id="btn-scen" aria-expanded="' + (!long) + '">' + (long ? 'Show scenario' : 'Hide scenario') + '</button></div>' +
      (long ? '<div class="scen-summary" id="scen-summary">' + esc(sc.summary || '') + ' — collapsed</div>' : '') +
      '<div class="block-b">' + body + '</div>' +
    '</section>';
    html += '<section class="block" aria-label="Question">' +
      '<div class="block-h h-question"><span class="bico" aria-hidden="true">❓</span> QUESTION</div>' +
      '<div class="block-b"><p class="q-text">' + esc(ex.question) + '</p></div>' +
    '</section>';
    html += '<section class="block" aria-label="Your answer">' +
      '<div class="block-h h-answer"><span class="bico" aria-hidden="true">✎</span> YOUR ANSWER</div>' +
      '<div class="block-b">' + widgetHtml(ex) + '</div>' +
    '</section>';
    html += '<div id="fb-slot"></div>';
    html += '<div class="actionbar">' +
      '<button type="button" class="btn btn-primary" id="btn-check">Check answer</button>' +
      '<button type="button" class="btn btn-primary" id="btn-next" style="display:none"></button>' +
      '<span class="note">Check stops the timer so you can read the feedback without pressure.</span>' +
    '</div>';
    return html;
  }
  function widgetHtml(ex) {
    var a = S.answers[ex.id] || (S.answers[ex.id] = {});
    var inner = '';
    if (ex.type === 'single') {
      inner = optsHtml(ex, 'single');
    } else if (ex.type === 'multi') {
      inner = optsHtml(ex, 'multi');
    } else if (ex.type === 'match') {
      var rnd = mulberry32(exSeed(ex, 2));
      var rights = shuffled(ex.pairs.map(function (p) { return p.right; }), rnd);
      inner = '<div class="matchrows">' + ex.pairs.map(function (p, i) {
        var cur = a.match ? a.match[i] : '';
        return '<div class="matchrow"><span class="match-left">' + esc(p.left) + '</span>' +
          '<select class="match-sel" data-left="' + i + '" aria-label="Match for: ' + esc(p.left) + '">' +
          '<option value="">— choose —</option>' +
          rights.map(function (r) { return '<option value="' + esc(r) + '"' + (cur === r ? ' selected' : '') + '>' + esc(r) + '</option>'; }).join('') +
          '</select></div>';
      }).join('') + '</div>';
    } else if (ex.type === 'order' || ex.type === 'prioritize') {
      if (!a.arr) {
        var idxs = ex.steps.map(function (_, i) { return i; });
        a.arr = shuffled(idxs, mulberry32(exSeed(ex, 3)));
      }
      var label = ex.type === 'prioritize' ? 'Priority' : 'Step';
      inner = '<ol class="orderlist">' + a.arr.map(function (si, pos) {
        return '<li class="orderitem" data-pos="' + pos + '">' +
          '<span class="rank">' + (pos + 1) + '</span>' +
          '<span class="order-text">' + esc(ex.steps[si]) + '</span>' +
          '<span class="order-btns">' +
            '<button type="button" data-move="up" data-pos="' + pos + '" aria-label="Move up: ' + esc(ex.steps[si]) + '">▲</button>' +
            '<button type="button" data-move="down" data-pos="' + pos + '" aria-label="Move down: ' + esc(ex.steps[si]) + '">▼</button>' +

    } else if (ex.type === 'blank') {

    } else if (ex.type === 'branch') {

  function renderExam() {
