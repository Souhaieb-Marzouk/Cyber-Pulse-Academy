  /* ============================ widget binding ============================ */
  function bindExercise(ex) {
    var toggle = $('btn-scen');
    if (toggle) {
      toggle.addEventListener('click', function () {
        var body = $('scen-body');
        var collapsed = body.classList.toggle('collapsed');
        toggle.setAttribute('aria-expanded', String(!collapsed));
        toggle.textContent = collapsed ? 'Show scenario' : 'Hide scenario';
        var sum = $('scen-summary');
        if (sum) { sum.style.display = collapsed ? '' : 'none'; }
      });
      if (scenarioLong(ex.scenario || {})) {
        var body = $('scen-body');
        body.classList.add('collapsed');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.textContent = 'Show scenario';
      }
    }
    Array.prototype.forEach.call(document.querySelectorAll('.logfilter'), function (inp) {
      inp.addEventListener('input', function () {
        var q = inp.value.toLowerCase();
        var body = document.querySelector('[data-logbody="' + inp.getAttribute('data-filter') + '"]');
        if (!body) { return; }
        Array.prototype.forEach.call(body.querySelectorAll('.ln'), function (ln) {
          ln.classList.toggle('off', q !== '' && ln.textContent.toLowerCase().indexOf(q) < 0);
        });
      });
    });
    var fs = $('widget-fs');
    var a = S.answers[ex.id];
    if (ex.type === 'single' || ex.type === 'multi') {
      Array.prototype.forEach.call(fs.querySelectorAll('.opt'), function (btn) {
        btn.addEventListener('click', function () {
          if (S.results[ex.id]) { return; }
          var oid = btn.getAttribute('data-oid');
          if (ex.type === 'single') {
            a.sel = oid;
            Array.prototype.forEach.call(fs.querySelectorAll('.opt'), function (b2) {
              b2.setAttribute('aria-checked', String(b2 === btn));
              b2.querySelector('.opt-mark').textContent = b2 === btn ? '● Selected' : '';
            });
          } else {
            var sel = a.sel || (a.sel = []);
            var i = sel.indexOf(oid);
            if (i >= 0) { sel.splice(i, 1); } else { sel.push(oid); }
            btn.setAttribute('aria-pressed', String(i < 0));
            btn.querySelector('.opt-mark').textContent = i < 0 ? '● Selected' : '';
          }
        });
      });
    } else if (ex.type === 'match') {
      Array.prototype.forEach.call(fs.querySelectorAll('.match-sel'), function (selEl) {
        selEl.addEventListener('change', function () {
          if (S.results[ex.id]) { return; }
          a.match = a.match || {};
          a.match[selEl.getAttribute('data-left')] = selEl.value;
        });
      });
    } else if (ex.type === 'order' || ex.type === 'prioritize') {
      Array.prototype.forEach.call(fs.querySelectorAll('[data-move]'), function (btn) {
        btn.addEventListener('click', function () {
          if (S.results[ex.id]) { return; }
          var pos = parseInt(btn.getAttribute('data-pos'), 10);
          var dir = btn.getAttribute('data-move') === 'up' ? -1 : 1;
          var j = pos + dir;
          if (j < 0 || j >= a.arr.length) { return; }
          var tmp = a.arr[pos]; a.arr[pos] = a.arr[j]; a.arr[j] = tmp;
          refreshWidget(ex);
        });
      });
    } else if (ex.type === 'blank') {
      Array.prototype.forEach.call(fs.querySelectorAll('.blank-in'), function (inp) {
        inp.addEventListener('input', function () {
          a.blanks = a.blanks || {};
          a.blanks[inp.getAttribute('data-b')] = inp.value;
        });
      });
      Array.prototype.forEach.call(fs.querySelectorAll('.blank-sel'), function (selEl) {
        selEl.addEventListener('change', function () {
          a.blanks = a.blanks || {};
          a.blanks[selEl.getAttribute('data-b')] = selEl.value;
        });
      });
    } else if (ex.type === 'drag') {
      var selectedId = null;
      function paintSelection() {
        Array.prototype.forEach.call(fs.querySelectorAll('.bankitem'), function (b) {
          b.classList.toggle('sel', b.getAttribute('data-iid') === selectedId);
        });
      }
      Array.prototype.forEach.call(fs.querySelectorAll('.bankitem'), function (b) {
        b.addEventListener('click', function () {
          if (S.results[ex.id]) { return; }
          var iid = b.getAttribute('data-iid');
          if (b.getAttribute('data-inzone')) {
            /* If an item is currently selected, this click bubbles to the zone and places
               the selected item. Only return the placed item to the bank when nothing is selected. */
            if (!selectedId) {
              delete a.placed[iid];
              selectedId = null;
              refreshWidget(ex);
            }
            return;
          }
          selectedId = (selectedId === iid) ? null : iid;
          paintSelection();
        });
        b.addEventListener('dragstart', function (ev) {
          ev.dataTransfer.setData('text/plain', b.getAttribute('data-iid'));
        });
      });
      Array.prototype.forEach.call(fs.querySelectorAll('.zone'), function (z) {
        var zid = z.getAttribute('data-zid');
        z.addEventListener('click', function () {
          if (S.results[ex.id] || !selectedId) { return; }
          a.placed[selectedId] = zid;
          selectedId = null;
          refreshWidget(ex);
        });
        z.addEventListener('keydown', function (ev) {
          if ((ev.key === 'Enter' || ev.key === ' ') && selectedId && !S.results[ex.id]) {
            ev.preventDefault();
            a.placed[selectedId] = zid;
            selectedId = null;
            refreshWidget(ex);
          }
        });
        z.addEventListener('dragover', function (ev) { ev.preventDefault(); z.classList.add('over'); });
        z.addEventListener('dragleave', function () { z.classList.remove('over'); });
        z.addEventListener('drop', function (ev) {
          ev.preventDefault();
          z.classList.remove('over');
          if (S.results[ex.id]) { return; }
          var iid = ev.dataTransfer.getData('text/plain');
          if (iid) { a.placed[iid] = zid; refreshWidget(ex); }
        });
      });
    } else if (ex.type === 'terminal') {
      var input = $('shell-cmd');
      input.addEventListener('keydown', function (ev) {
        if (ev.key !== 'Enter') { return; }
        var cmd = input.value;
        input.value = '';
        if (!cmd.trim()) { return; }
        runShell(ex, a, cmd);
      });
    } else if (ex.type === 'branch') {
      var br = ex.branch;
      var st = a.bstep || 0;
      if (st < br.steps.length) {
        Array.prototype.forEach.call(fs.querySelectorAll('[data-boid]'), function (btn) {
          btn.addEventListener('click', function () {
            if (S.results[ex.id]) { return; }
            a.bsel = btn.getAttribute('data-boid');
            Array.prototype.forEach.call(fs.querySelectorAll('[data-boid]'), function (b2) {
              var on = b2 === btn;
              b2.setAttribute('aria-checked', String(on));
              b2.querySelector('.opt-mark').textContent = on ? '● Selected' : '';
            });
            $('btn-bconfirm').disabled = false;
          });
        });
        $('btn-bconfirm').addEventListener('click', function () {
          if (S.results[ex.id] || !a.bsel) { return; }
          var step = br.steps[a.bstep || 0];
          a.outcomes = a.outcomes || [];
          a.outcomes.push('You chose: “' + optStepText(step, a.bsel) + '”. ' + step.outcome);
          a.bstep = (a.bstep || 0) + 1;
          a.bsel = null;
          refreshWidget(ex);
        });
      } else {
        var f = br.final;
        var multi = f.correct.length > 1;
        Array.prototype.forEach.call(fs.querySelectorAll('[data-foid]'), function (btn) {
          btn.addEventListener('click', function () {
            if (S.results[ex.id]) { return; }
            var oid = btn.getAttribute('data-foid');
            if (multi) {
              a.fsel = a.fsel || [];
              var i = a.fsel.indexOf(oid);
              if (i >= 0) { a.fsel.splice(i, 1); } else { a.fsel.push(oid); }
              btn.setAttribute('aria-pressed', String(i < 0));
              btn.querySelector('.opt-mark').textContent = i < 0 ? '● Selected' : '';
            } else {
              a.fsel = [oid];
              Array.prototype.forEach.call(fs.querySelectorAll('[data-foid]'), function (b2) {
                var on = b2 === btn;
                b2.setAttribute('aria-checked', String(on));
                b2.querySelector('.opt-mark').textContent = on ? '● Selected' : '';
              });
            }
          });
        });
      }
    }
    $('btn-check').addEventListener('click', function () { doCheck(false); });
    var nextBtn = $('btn-next');
    if (nextBtn) { nextBtn.addEventListener('click', onNext); }
    $('btn-hint').addEventListener('click', onHint);
    $('btn-skip').addEventListener('click', onSkip);
    $('btn-pause').addEventListener('click', onPauseToggle);
  }
  function optStepText(step, oid) {
    var o = step.options.find(function (x) { return x.id === oid; });
    return o ? o.text : oid;
  }
  function refreshWidget(ex) {
    var fs = $('widget-fs');
    var tmp = document.createElement('div');
    tmp.innerHTML = widgetHtml(ex);
    fs.innerHTML = tmp.firstElementChild.innerHTML;
    bindExercise(ex);
    updateHeader();
  }

  /* ============================ shell ============================ */
  function runShell(ex, a, cmd) {
    a.scroll.push('$ ' + cmd);
    var norm = cmd.trim().replace(/\s+/g, ' ');
    a.lastCmd = norm;
    a.nearMiss = null;
    var t = ex.terminal;
    var out = $('shell-out');
    function print(line, cls) {
      a.scroll.push(line);
      var d = document.createElement('div');
      if (cls) { d.className = cls; }
      d.textContent = line;
      out.appendChild(d);
      out.scrollTop = out.scrollHeight;
    }
    for (var i = 0; i < (t.nearMiss || []).length; i++) {
      if (new RegExp(t.nearMiss[i].re).test(norm)) {
        a.nearMiss = t.nearMiss[i].msg;
        print('⚠ DANGEROUS — NEAR MISS: ' + t.nearMiss[i].msg, 'shell-warn');
        return;
      }
    }
    for (var j = 0; j < (t.outputs || []).length; j++) {
      if (new RegExp(t.outputs[j].re).test(norm)) {
        (t.outputs[j].lines || []).forEach(function (ln) { print(ln, 'shell-ok'); });
        return;
      }
    }
    var first = norm.split(' ')[0];
    print('command not found: ' + first, 'shell-err');
  }

  /* ============================ grading ============================ */
  function it(state, word, text) { return { state: state, word: word, text: text }; }
  function grade(ex) {
    var a = S.answers[ex.id] || {};
    var res = { credit: 0, H: 0, W: 0, N: 1, items: [], nearMiss: false };
    var t = ex.type, i;
    if (t === 'single') {
      res.N = 1;
      var sel = a.sel || null;
      var ok = sel === ex.correct[0];
      res.H = ok ? 1 : 0;
      res.W = (sel && !ok) ? 1 : 0;
      res.items.push(it(ok ? 'ok' : (sel ? 'bad' : 'miss'), ok ? '✓ Correct' : (sel ? '✗ Wrong' : '○ Missed'), 'Correct answer: ' + optText(ex, ex.correct[0])));
      if (sel && !ok) { res.items.unshift(it('bad', '✗ Wrong', 'Your answer: ' + optText(ex, sel))); }
    } else if (t === 'multi') {
      res.N = ex.correct.length;
      var ms = a.sel || [];
      ex.correct.forEach(function (oid) {
        if (ms.indexOf(oid) >= 0) { res.H += 1; res.items.push(it('ok', '✓ Correct', optText(ex, oid))); }
        else { res.items.push(it('miss', '○ Missed', optText(ex, oid))); }
      });
      ms.forEach(function (oid) {
        if (ex.correct.indexOf(oid) < 0) { res.W += 1; res.items.push(it('bad', '✗ Wrong', optText(ex, oid))); }
      });
    } else if (t === 'match') {
      res.N = ex.pairs.length;
      ex.pairs.forEach(function (p, idx) {
        var v = a.match ? a.match[idx] : '';
        if (!v) { res.items.push(it('miss', '○ Missed', p.left + ' → ' + p.right)); }
        else if (v === p.right) { res.H += 1; res.items.push(it('ok', '✓ Correct', p.left + ' → ' + p.right)); }
        else { res.W += 1; res.items.push(it('bad', '✗ Wrong', p.left + ' — you chose “' + v + '”, expected “' + p.right + '”')); }
      });
    } else if (t === 'order' || t === 'prioritize') {
      res.N = ex.steps.length;
      (a.arr || []).forEach(function (si, pos) {
        if (si === pos) { res.H += 1; res.items.push(it('ok', '✓ Correct', 'Position ' + (pos + 1) + ': ' + ex.steps[pos])); }
        else { res.W += 1; res.items.push(it('bad', '✗ Wrong', 'Position ' + (pos + 1) + ' — you placed “' + ex.steps[si] + '”, expected “' + ex.steps[pos] + '”')); }
      });
    } else if (t === 'blank') {
      res.N = ex.blanks.length;
      ex.blanks.forEach(function (b, idx) {
        var v = (a.blanks && a.blanks[idx] ? a.blanks[idx] : '').trim();
        var okv = v !== '' && b.answer.some(function (acc) { return acc.toLowerCase() === v.toLowerCase(); });
        if (v === '') { res.items.push(it('miss', '○ Missed', 'Blank ' + (idx + 1) + ' — expected: ' + b.answer[0])); }
        else if (okv) { res.H += 1; res.items.push(it('ok', '✓ Correct', 'Blank ' + (idx + 1) + ': ' + v)); }
        else { res.W += 1; res.items.push(it('bad', '✗ Wrong', 'Blank ' + (idx + 1) + ' — you typed “' + v + '”, expected: ' + b.answer.join(' or '))); }
      });
    } else if (t === 'drag') {
      res.N = ex.items.length;
      ex.items.forEach(function (x) {
        var zid = a.placed ? a.placed[x.id] : null;
        if (!zid) {
          res.items.push(it('miss', '○ Missed', 'Not placed: ' + x.text));
          return;
        }
        var z = ex.zones.find(function (zz) { return zz.id === zid; });
        if (z && z.accepts.indexOf(x.id) >= 0) {
          res.H += 1;
          res.items.push(it('ok', '✓ Correct', z.label + ': ' + x.text));
        } else {
          res.W += 1;
          var zok = ex.zones.find(function (zz) { return zz.accepts.indexOf(x.id) >= 0; });
          res.items.push(it('bad', '✗ Wrong', '“' + x.text + '” placed in ' + (z ? z.label : 'unknown zone') + '; belongs in: ' + (zok ? zok.label : '?')));
        }
      });
      ex.zones.forEach(function (z) {
        var anyInside = ex.items.some(function (x) { return a.placed && a.placed[x.id] === z.id; });
        if (!anyInside) { res.items.push(it('miss', '○ Missed', z.label + ' left empty — expected: ' + zoneExpected(ex, z))); }
      });
    } else if (t === 'terminal') {
      var tt = ex.terminal;
      var cmd = a.lastCmd || '';
      if (a.nearMiss) { res.nearMiss = true; }
      res.N = tt.elements.length;
      tt.elements.forEach(function (el) {
        if (!cmd) { res.items.push(it('miss', '○ Missed', el.label)); }
        else if (new RegExp(el.re).test(cmd)) { res.H += 1; res.items.push(it('ok', '✓ Correct', el.label)); }
        else { res.W += 1; res.items.push(it('bad', '✗ Wrong', el.label)); }
      });
      if (res.nearMiss) { res.H = 0; res.W = res.N; }
    } else if (t === 'branch') {
      var f = ex.branch.final;
      var multi = f.correct.length > 1;
      if (multi) {
        res.N = f.correct.length;
        var fs2 = a.fsel || [];
        f.correct.forEach(function (oid) {
          if (fs2.indexOf(oid) >= 0) { res.H += 1; res.items.push(it('ok', '✓ Correct', optFinal(ex, oid))); }
          else { res.items.push(it('miss', '○ Missed', optFinal(ex, oid))); }
        });
        fs2.forEach(function (oid) {
          if (f.correct.indexOf(oid) < 0) { res.W += 1; res.items.push(it('bad', '✗ Wrong', optFinal(ex, oid))); }
        });
      } else {
        res.N = 1;
        var fsel = (a.fsel && a.fsel[0]) || null;
        var fok = fsel === f.correct[0];
        res.H = fok ? 1 : 0;
        res.W = (fsel && !fok) ? 1 : 0;
        res.items.push(it(fok ? 'ok' : (fsel ? 'bad' : 'miss'), fok ? '✓ Correct' : (fsel ? '✗ Wrong' : '○ Missed'), 'Correct final decision: ' + optFinal(ex, f.correct[0])));
        if (fsel && !fok) { res.items.unshift(it('bad', '✗ Wrong', 'Your decision: ' + optFinal(ex, fsel))); }
      }
    }
    res.credit = Math.max(0, (res.H - res.W) / res.N);
    if (res.credit > 0 && S.hintUsed[ex.id]) {
      res.credit = Math.max(0, res.credit - 0.10);
    }
    return res;
  }
  function zoneExpected(ex, z) {
    var names = z.accepts.map(function (iid) {
      var it2 = ex.items.find(function (x) { return x.id === iid; });
      return it2 ? it2.text : iid;
    });
    return names.join(', ');
  }
  function optFinal(ex, oid) {
    var o = ex.branch.final.options.find(function (x) { return x.id === oid; });
    return o ? o.text : oid;
  }

  /* ============================ check / next / skip / hint / pause ============================ */
  function doCheck(auto) {
    if (S.state !== 'RUNNING') { return; }
    var ex = currentEx();
    if (!ex || S.results[ex.id]) { return; }
    setState('PAUSED_AUTO_CHECK');
    var res = grade(ex);
    S.results[ex.id] = res;
    S.creditSum += res.credit;
    S.answeredCount += 1;
    var sk = S.skipped.indexOf(ex.id);
    if (sk >= 0) { S.skipped.splice(sk, 1); }
    renderFeedback(ex, res, auto);
    S.checkedId = ex.id;
    var fs = $('widget-fs');
    if (fs) { fs.disabled = true; }
    var check = $('btn-check');
    if (check) { check.style.display = 'none'; }
    var next = $('btn-next');
    if (next) {
      var isLastMain = S.mode === 'main' && !nextMainIndex();
      next.style.display = '';
      next.textContent = S.mode === 'review' ? 'Back to review' : (isLastMain ? 'Final Submit' : 'Next exercise');
    }
    updateHeader();
    var fb = document.querySelector('.fb');
    if (fb) { fb.setAttribute('tabindex', '-1'); fb.focus({ preventScroll: true }); }
  }
  function nextMainIndex() {
    for (var i = S.pos + 1; i < S.order.length; i++) {
      var ex2 = EXS[S.order[i]];
      if (!S.results[ex2.id] && S.skipped.indexOf(ex2.id) < 0) { return i; }
    }
    return null;
  }
  function renderFeedback(ex, res, auto) {
    var slot = $('fb-slot');
    var cls = res.credit >= 1 ? 'fb-ok' : (res.credit > 0 ? 'fb-part' : 'fb-bad');
    var icon = res.credit >= 1 ? '✓' : (res.credit > 0 ? '✓' : '✗');
    var label;
    if (res.nearMiss) {
      cls = 'fb-bad'; icon = '✗';
      label = 'DANGEROUS — NEAR MISS';
    } else if (res.credit >= 1) { label = 'CORRECT'; }
    else if (res.credit > 0) { label = 'PARTIALLY CORRECT'; }
    else { label = 'INCORRECT'; }
    var creditLine = 'credit ' + fmt2(res.credit);
    if (res.N > 1) {
      creditLine += ' — ' + res.H + '/' + res.N + ' items · formula (H − W) / N = (' + res.H + ' − ' + res.W + ') / ' + res.N;
    }
    if (S.hintUsed[ex.id]) {
      creditLine += ' · includes −0.10 hint penalty';
    }
    var rows = res.items.map(function (x) {
      return '<li><span class="st st-' + x.state + '">' + x.word + '</span><span>' + esc(x.text) + '</span></li>';
    }).join('');
    var missedNames = res.items.filter(function (x) { return x.state === 'miss'; }).map(function (x) { return x.text; });
    var wrongNames = res.items.filter(function (x) { return x.state === 'bad'; }).map(function (x) { return x.text; });
    var extra = '';
    if (missedNames.length) {
      extra += '<p><strong style="color:var(--state-partial)">○ Missed items:</strong> ' + esc(missedNames.join(' · ')) + '</p>';
    }
    if (wrongNames.length) {
      extra += '<p><strong style="color:var(--state-incorrect)">✗ Wrong items:</strong> ' + esc(wrongNames.join(' · ')) + '</p>';
    }
    var explainHtml = (ex.explain || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
    var canon = '';
    if (ex.type === 'terminal') {
      var lastCmd = (S.answers[ex.id] && S.answers[ex.id].lastCmd) || '';
      canon = '<div class="codeblock"><div class="cb-label"><span>Canonical command</span>' +
        '<button type="button" class="cb-copy" id="btn-copy">Copy</button></div>' +
        '<pre class="mono">' + esc(ex.terminal.solution) + '</pre></div>' +
        '<div class="cb-legend">' + ex.terminal.elements.map(function (el) {
          var got = lastCmd !== '' && new RegExp(el.re).test(lastCmd);
          return '<span>' + (got ? '<span class="st-ok">✓</span>' : '<span class="st-bad">✗</span>') + ' ' + esc(el.label) + '</span>';
        }).join('') + '</div>';
    }
    slot.innerHTML = '<section class="fb ' + cls + '" role="status" aria-live="polite">' +
      '<div class="fb-h"><span aria-hidden="true">' + icon + '</span> ' + label +
      '<span class="fb-credit">' + esc(creditLine) + (auto ? ' · auto-submitted (exercise timer expired)' : '') + '</span></div>' +
      '<ul class="fb-items">' + rows + '</ul>' +
      '<div class="fb-explain">' + extra + canon + explainHtml + '</div>' +
      '</section>';
    var copyBtn = $('btn-copy');
    if (copyBtn) {
      copyBtn.addEventListener('click', function () {
        var text = ex.terminal.solution;
        var done = function () { copyBtn.textContent = 'Copied'; };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, function () { copyBtn.textContent = 'Select and copy'; });
          } else { copyBtn.textContent = 'Select and copy'; }
        } catch (e) { copyBtn.textContent = 'Select and copy'; }
      });
    }
  }
  function onNext() {
    if (S.state === 'ENDED') { return; }
    if (S.mode === 'review') {
      setState('RUNNING');
      showReview();
      return;
    }
    var nxt = nextMainIndex();
    if (nxt !== null) {
      S.pos = nxt;
      setState('RUNNING');
      renderExam();
    } else if (S.skipped.length > 0 && S.remaining > 0) {
      setState('RUNNING');
      showReview();
    } else {
      showResults();
    }
  }
  function onSkip() {
    if (S.state !== 'RUNNING') { return; }
    var ex = currentEx();
    if (!ex || S.results[ex.id]) { return; }
    if (S.skipped.indexOf(ex.id) < 0) { S.skipped.push(ex.id); }
    if (S.mode === 'review') {
      setState('RUNNING');
      showReview();
      return;
    }
    var nxt = nextMainIndex();
    if (nxt !== null) {
      S.pos = nxt;
      renderExam();
    } else if (S.skipped.length > 0 && S.remaining > 0) {
      showReview();
    } else {
      showResults();
    }
  }
  function onHint() {
    if (S.state !== 'RUNNING') { return; }
    var ex = currentEx();
    if (!ex || S.results[ex.id] || S.hintUsed[ex.id]) { return; }
    S.hintUsed[ex.id] = true;
    var fs = $('widget-fs');
    var panel = document.createElement('div');
    panel.className = 'hint-panel';
    panel.setAttribute('role', 'note');
    panel.innerHTML = '<div class="hp-h">? Hint — 10% of this exercise credit will be deducted</div>' + esc(ex.hint);
    fs.appendChild(panel);
    var hb = $('btn-hint');
    if (hb) { hb.disabled = true; }
  }
  function onPauseToggle() {
    if (S.state === 'RUNNING') {
      S.resumeState = 'RUNNING';
      setState('PAUSED_MANUAL');
    } else if (S.state === 'PAUSED_AUTO_CHECK') {
      S.resumeState = 'PAUSED_AUTO_CHECK';
      setState('PAUSED_MANUAL');
    } else if (S.state === 'PAUSED_MANUAL') {
      setState(S.resumeState || 'RUNNING');
    }
  }
  function renderPauseOverlay() {
    var old = $('paused-ovl');
    if (old) { old.remove(); }
    if (S.state !== 'PAUSED_MANUAL') { return; }
    var ovl = document.createElement('div');
    ovl.className = 'paused-overlay';
    ovl.id = 'paused-ovl';
    ovl.innerHTML = '<div class="paused-card" role="alertdialog" aria-label="Exam manually paused">' +
      '<div class="pico" aria-hidden="true">⏸</div>' +
      '<h2>⏸ PAUSED — manual</h2>' +
      '<p>The exercise is hidden and the timer is stopped. Press Resume when you are ready to continue.</p>' +
      '<button type="button" class="btn btn-primary" id="btn-resume2">▶ Resume</button></div>';
    document.body.appendChild(ovl);
    $('btn-resume2').addEventListener('click', onPauseToggle);
  }

  /* ============================ review screen ============================ */
  function showReview() {
    S.screen = 'review';
    S.mode = 'review';
    S.reviewList = S.skipped.slice();
    var app = $('app');
    var rows = S.reviewList.map(function (exId) {
      var ex = byId[exId];
      var n = S.order.indexOf(EXS.indexOf(ex)) + 1;
      return '<li><span class="st-skip">⚠ Skipped</span>' +
        '<span class="rv-title">Exercise ' + n + ' of ' + TOTAL + ' — ' + esc(ex.scenario && ex.scenario.summary ? ex.scenario.summary : ex.question) + '</span>' +
        '<button type="button" class="btn" data-answer="' + esc(exId) + '">Answer</button></li>';
    }).join('');
    app.innerHTML = headerHtml() +
      '<main class="stage" id="stage"><section class="block">' +
      '<div class="block-h h-skip"><span class="bico" aria-hidden="true">⚠</span> Review skipped exercises</div>' +
      '<div class="block-b">' +
      '<p>You skipped ' + S.reviewList.length + ' exercise' + (S.reviewList.length === 1 ? '' : 's') + '. You can answer them now, as many times as you need, until the timer ends. Skipped exercises you never answer are excluded from the score.</p>' +
      '<ul class="review-list">' + rows + '</ul>' +
      '<div class="actionbar"><button type="button" class="btn btn-primary" id="btn-finish">Submit exam</button>' +
      '<span class="note">Submitting now leaves the remaining skipped exercises out of the score.</span></div>' +
      '</div></section></main>';
    Array.prototype.forEach.call(document.querySelectorAll('[data-answer]'), function (btn) {
      btn.addEventListener('click', function () {
        var exId = btn.getAttribute('data-answer');
        S.pos = S.order.indexOf(EXS.indexOf(byId[exId]));
        S.screen = 'exam';
        renderExam();
      });
    });
    $('btn-finish').addEventListener('click', function () { showResults(); });
    updateHeader();
    renderTimerPill();
  }

  /* ============================ results ============================ */
  function endByTimeout() {
    setState('ENDED');
    showResults();
  }
  function showResults() {
    S.screen = 'results';
    S.mode = 'main';
    var fully = 0, partial = 0, wrong = 0;
    var partialSum = 0;
    Object.keys(S.results).forEach(function (k) {
      var c = S.results[k].credit;
      if (c >= 1) { fully += 1; }
      else if (c > 0) { partial += 1; partialSum += c; }
      else { wrong += 1; }
    });
    var skippedLeft = S.skipped.length;
    var pct = fmtPct(S.creditSum, S.answeredCount);
    var passed = pct >= PASSMARK;
    setState('ENDED');
    var app = $('app');
    var cls = SEVCLS[DATA.severity] || 'sev-easy';
    var candidate = S.handshake && S.handshake.username ? '<div class="res-sub">Candidate: ' + esc(S.handshake.username) + '</div>' : '';
    app.innerHTML = headerHtml() +
      '<main class="stage" id="stage"><section class="block res-panel">' +
      '<div class="block-h h-answer"><span class="bico" aria-hidden="true">■</span> RESULTS</div>' +
      '<div class="block-b">' +
      '<div class="res-head ' + (passed ? 'pass' : 'fail') + '"><span aria-hidden="true">' + (passed ? '✓' : '✗') + '</span> ' + (passed ? 'PASS' : 'FAIL') + ' — ' + pct + '% (pass mark ' + PASSMARK + '%)</div>' +
      '<div class="res-big">' + pct + '%</div>' +
      '<div class="res-sub">Final score: <b>' + fmt1(S.creditSum) + '</b> over ' + S.answeredCount + ' answered exercise' + (S.answeredCount === 1 ? '' : 's') + ' of ' + TOTAL + '.' + (skippedLeft ? ' ' + skippedLeft + ' skipped exercise' + (skippedLeft === 1 ? '' : 's') + ' excluded from the score.' : '') + '</div>' +
      candidate +
      '<ul class="res-rows">' +
        '<li><span class="st st-ok">✓ Fully correct</span><span class="rval">' + fully + '</span></li>' +
        '<li><span class="st st-warn">✓ Partially correct</span><span>avg credit ' + (partial ? fmt2(partialSum / partial) : '—') + '</span><span class="rval">' + partial + '</span></li>' +
        '<li><span class="st st-bad">✗ Fully incorrect</span><span class="rval">' + wrong + '</span></li>' +
        '<li><span class="st st-miss">⚠ Skipped — excluded</span><span class="rval">' + skippedLeft + '</span></li>' +
      '</ul>' +
      '<div class="res-times">' +
        '<div>⏱ Active time: <b class="mono">' + fmtClock(BUDGET - S.remaining) + '</b> of a ' + fmtClock(BUDGET) + ' budget</div>' +
        '<div>⏸ Time paused while reviewing feedback: <b class="mono">' + fmtClock(S.pauseAccum.autoCheck) + '</b></div>' +
        '<div>⏸ Time paused manually: <b class="mono">' + fmtClock(S.pauseAccum.manual) + '</b></div>' +
      '</div>' +
      '<div class="actionbar"><button type="button" class="btn btn-primary btn-big" id="btn-retake">↻ Retake Exam</button>' +
      '<span class="note">A retake shuffles the exercises and answers and resets the timer.</span></div>' +
      '</div></section></main>';
    $('btn-retake').addEventListener('click', function () {
      renderIntro();
    });
    updateHeader();
    renderTimerPill();
    setTimeout(function () {
      if (S.posted) { return; }
      S.posted = true;
      reportScore(S.creditSum, S.answeredCount);
    }, 350);
  }
  function reportScore(creditSum, answeredCount) {
    var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
    try {
      /* Opened directly (parent === window): there is nothing to report to, per the site contract. */
      if (parent && parent !== window) {
        parent.postMessage({
          type: 'CYBERPULSE_SCORE',
          topicId: DATA.topicId,
          batch: DATA.batch,
          score: Math.round(creditSum),
          total: answeredCount,
          percent: percent,
          passed: percent >= PASSMARK
        }, location.origin);
      }
    } catch (e) {
      /* Opened directly rather than inside the site. Nothing to report to. */
    }
  }
  window.addEventListener('message', function (event) {
    if (!event.data || typeof event.data !== 'object') { return; }
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
    S.handshake = {
      username: event.data.username || '',
      country: event.data.country || '',
      locale: event.data.locale || '',
      topicId: event.data.topicId || '',
      batch: event.data.batch,
      theme: event.data.theme || 'dark'
    };
    /* The file is dark-only by contract: the handshake theme field never changes the appearance. */
  });

  /* ============================ debug hook (read-only) ============================ */
  Object.defineProperty(window, '__CM', {
    value: {
      get state() { return S.state; },
      get screen() { return S.screen; },
      get remaining() { return S.remaining; },
      get creditSum() { return S.creditSum; },
      get answeredCount() { return S.answeredCount; },
      get skipped() { return S.skipped.slice(); },
      get results() { return Object.keys(S.results).slice(); },
      get pauseAccum() { return { manual: S.pauseAccum.manual, autoCheck: S.pauseAccum.autoCheck }; },
      get order() { return S.order.slice(); },
      get pos() { return S.pos; },
      data: DATA
    },
    configurable: false, writable: false
  });

  /* ============================ boot ============================ */
  renderIntro();
})();
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
