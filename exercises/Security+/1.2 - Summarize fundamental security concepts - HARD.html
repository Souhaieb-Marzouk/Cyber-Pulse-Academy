signing. The artefacts do not separate those cases, and reading it as proof of post-signing editing too early sends the case the wrong way.","2":"The reconcile job signed a different payload in its own log line. Nothing here shows that it touched the manifest file, and assuming a second job is innocent is exactly the assumption the shared key removes.","3":"No collision or weakness is shown for the digest. Changing the algorithm leaves the shared-key problem in place, so it is a real change with no effect on this finding."},"hint":"Three different jobs appear as <code>job=</code> in the signing log. Ask what one signature can prove when every one of those jobs can request it.","why":"The mismatch is only the symptom. The config lines show one key shared by three jobs and a signing endpoint that never checks who is calling. So a valid signature proves only that the key was used, not which process used it, and legal weight of that evidence drops. The repair is to give each job its own key, demand caller authentication, and count or approve every use.","kw":["integrity","hashing and checksums","digital signature","audit trail integrity","non-repudiation","separation of duties","proof of origin"]},{"id":"H02","type":"mcq","theme":"Data protection","points":10,"scenario":"Ticketing platform Northgate Events keeps four backups: a nightly encrypted tape, a weekly write-once cloud copy, a read-only replica in the same rack, and a nightly snapshot of the production volume. A restructure deleted two entire production volumes on the same morning.","question":"The company wants one guarantee: that a single bad action cannot remove both the live data and every recovery copy. Which change delivers that guarantee?","opts":["Add erasure coding to the production volume so a deleted volume can be rebuilt from parity blocks","Move the read-only replica into a second rack with its own power feed and administrators","Keep the nightly snapshot and schedule it twice a day, so at most twelve hours of work can be lost","Send the production encryption key to the same key vault that holds the backup encryption key"],"correct":[1],"whyEach":{"0":"Erasure coding spreads blocks of the volume across one storage system. A delete command aimed at the volume travels with it, so nothing is left to rebuild from.","1":"<b>Correct.</b> The failure here was one action reaching every copy. A separate rack with its own power and its own admins breaks that single path, which is fault tolerance rather than another copy inside the same blast radius.","2":"More frequent snapshots narrow the window of lost work. They do not stop one delete command from removing the snapshot too, because it lives in the same place as the volume.","3":"One vault holding both keys means one compromise or one wrong deletion removes your ability to read anything, including the backups you still hold."},"hint":"Ask what the four copies have in common. The answer is about what one person, one account or one power failure can reach at the same time.","why":"Availability is lost when one failure reaches every copy at once. Copies that share a rack, a key store or an administrator account are one copy for this purpose. This is redundancy and fault tolerance: separate location, separate power, separate identity. Encryption protects confidentiality and is worth keeping, but it is not the control that saves you here.","kw":["availability","redundancy and fault tolerance","backup and restoration","encryption at rest","defense in depth","separation of duties","data classification and PII"]},{"id":"H03","type":"classify","theme":"AAA","points":10,"scenario":"Audit week at Helio Energy. You pull the access evidence for a single workday from four systems and sort every line into the part of AAA it actually belongs to. The point of the exercise is to notice that a successful login is not the same thing as a permitted action.","art":{"kind":"log","title":"One workday of access evidence (five systems)","lines":["07:58:02 sso-gw event=LOGIN user=r.adeyemi method=fido2 key=YubiKey-5C result=SUCCESS","08:12:44 sso-gw event=LOGIN user=r.adeyemi method=password result=FAILED reason=bad_credential","08:20:03 app-claims event=READ user=r.adeyemi object=claim-88213 result=ALLOW rule=policy-14","08:31:20 app-claims event=UPDATE user=r.adeyemi object=claim-88213 result=DENY rule=policy-14","09:04:11 vault event=CHECKOUT user=r.adeyemi secret=db-prod-ro ttl=15m result=SUCCESS","09:19:55 vault event=CHECKIN user=r.adeyemi secret=db-prod-ro ttl=15m result=SUCCESS","11:40:07 pam-gw event=SSH user=r.adeyemi target=bas-01 session=rec-4471 result=SUCCESS","11:58:39 pam-gw event=SSH user=r.adeyemi target=bas-01 session=rec-4471 duration=18m result=CLOSED"]},"question":"Place each event in the AAA function it performs.","buckets":["Authentication","Authorization","Accounting"],"items":["FIDO2 sign-in for r.adeyemi accepted at the gateway","Password sign-in for the same user rejected for a bad credential","Read of claim-88213 allowed by policy-14","Update of the same claim denied by the same rule","Database secret checked out with a 15 minute time to live","Secret returned at the end of the time to live","Recorded SSH session rec-4471 opened to host bas-01","The same session closed after 18 minutes and written to the record"],"answer":[0,0,1,1,1,2,2,2],"whyEach":["The gateway tested an identity claim and accepted it, which is authentication.","A rejected login is still an authentication event. It records a failed attempt to prove identity.","A read being allowed is an authorization decision made by rule policy-14.","A deny is also an authorization decision. The same rule produced both decisions, so the object and the action decide the outcome.","Issuing a secret with a time to live limits what the identity may use and for how long, which is authorization plus a strong record.","The return of the secret closes the authorized window. It is a state change of the grant, not a new proof of identity.","Opening and recording a session is accounting: who did what, where and when. Nothing was proven and nothing was permitted here.","The closure of the session with a duration keeps the record of activity complete, which is accounting."],"hint":"Authentication proves who you are, authorization decides what you may do, accounting records what you did. A deny is never an authentication event.","why":"The three A's answer three different questions. Authentication proves identity, so both the accepted and the rejected login belong there. Authorization decides whether a named action on a named object is permitted, so allows and denies are both authorization. Accounting writes the record of activity: sessions, durations, secret use. Auditors need all three, because a clean login log cannot show that an action was inside policy, and a policy cannot show what actually happened.","kw":["authentication","authorization","accounting","authentication factors (know, have, are)","privileged access management (PAM)","session logging and session replay","just-in-time (JIT) access","audit trail integrity","policy-driven access control","least privilege"]},{"id":"H04","type":"match","theme":"Non-repudiation","points":10,"scenario":"A settlement dispute at Corvid Legal turns on who can prove what. Your partner asks you to label each piece of evidence with the exact claim it supports and nothing more.","question":"Match each piece of evidence with the one claim it actually supports.","pairs":[["A signature that validates against the sender certificate","The holder of that private key signed this exact file"],["A countersignature from the receiving mail gateway","The receiving side confirmed it accepted this file"],["A signed record held in write-once storage","The record has not been altered since it was filed"],["A time value signed by a third-party time authority","The signature existed no later than that moment"],["A hash of the file taken when it was first received","This file is byte-for-byte the file that was hashed"]],"hint":"One line is about identity of the signer, one about the other side answering, one about storage, one about a clock you do not control, and one about the bytes themselves.","why":"Non-repudiation needs several independent facts, and each piece of evidence supplies only one of them. A validating signature ties a private key to a file, so its holder cannot later deny signing it. A countersignature shows the other side accepted the item, which is proof of delivery. Write-once storage with a hash chain shows the record was not edited afterwards. A trusted timestamp from a third party fixes the moment, because your own clock proves nothing to an outsider. A stored hash catches any later change to the bytes. Repudiation happens when one of these facts is missing and the other side walks through the gap.","kw":["non-repudiation","repudiation","proof of origin","proof of delivery or receipt","audit trail integrity","trusted timestamping","private key signing","PKI and certificate authority","log immutability and retention"]},{"id":"H05","type":"order","theme":"Non-repudiation","points":10,"scenario":"Corvid Legal will not rely on email headers again. For every delivery notice that may end up in court, the firm wants a receipt that a third party could check years later.","question":"Order the five steps of that counter-signed delivery process.","items":["The sender computes a digest of the exact payload that will be sent","The sender signs that digest with the sender private key and attaches the certificate","The receiving gateway validates the certificate chain and the signature before it accepts the payload","The receiving gateway signs back the sender digest, its own receipt and a time value from a third-party authority","The firm files the payload, both signatures and the validation report in write-once storage"],"hint":"You cannot sign a digest before you have one, and you cannot counter-sign a digest the other side has not sent you.","why":"Each step depends on the one before it. A digest must exist before anything can be signed. The sender signature must exist before the receiver has anything to check. The receiver validates the chain first, because a countersignature over a signature that does not validate proves nothing. Only then can the receipt carry a time value from a third party, which is the piece the firm cannot fake on its own. Filing the whole set with a validation report in write-once storage keeps the evidence whole. Miss any step and the other side can claim the file changed, the clock was wrong, or the signature was never checked.","kw":["non-repudiation","proof of delivery or receipt","trusted timestamping","digital signature","hashing and checksums","PKI and certificate authority","audit trail integrity","log immutability and retention","encryption in transit (TLS)"]},{"id":"H06","type":"match","theme":"AAA","points":10,"scenario":"Corvid Legal is replacing the last of its direct sign-in paths. The platform team asks you to label five services with the job each one actually performs in the access chain.","question":"Match each service with the job it performs in the access chain.","pairs":[["One sign-in that opens several internal applications","Single sign-on"],["A partner company signs its staff into your portal with accounts it still owns","Federation"],["A service that carries group, role and attribute claims between a portal and an application","SAML"],["A service that lets an application call a resource with a limited token instead of a password","OAuth"],["A service that adds an identity layer on top of that token so the caller profile can be read","OpenID Connect"],["A service that centralises network sign-in for switches, wireless and virtual private network users","RADIUS"],["A service that centralises administration of network devices and commands each device separately","TACACS+"]],"hint":"Two entries are about one login covering many applications, and two are about how a request travels with a token rather than a password. The last two both centralise network sign-in but differ in what they command.","why":"These seven services are easy to confuse because they all move identity around. Single sign-on removes repeated prompts inside one organisation. Federation goes further: another organisation keeps ownership of the account and your portal trusts its claims. SAML carries those claims as signed assertions between a portal and an application, which is why it is common in web sign-in. OAuth is not a sign-in at all: it issues a limited token so an application can call a resource on your behalf, and OpenID Connect layers a small, readable identity profile on top of that same token flow. The two network services split by purpose: RADIUS performs authentication, authorization and accounting for network access in one exchange, while TACACS+ separates the three and encrypts the whole payload, which is why device administration uses it.","kw":["single sign-on and federation","SAML, OAuth and OpenID Connect","RADIUS","TACACS+","authentication","authorization","accounting","identity and access management (IAM)","session logging and session replay","identity proofing"]},{"id":"H07","type":"branch","theme":"Non-repudiation","points":10,"scenario":"Corvid Legal paid 240,000 to Torrance Fabrication against a signed statement of work. Torrance now says the signed copy cannot be trusted. You keep the technical record for the case.","question":"Work the dispute. Each step records the choice you click.","hint":"Separate the tool that sent the value from the person who signed, and keep asking what a third party could check without trusting either side.","steps":[{"sit":"Step 1 - Torrance states that anyone at the firm could have used the signing laptop, so the signature proves nothing about who agreed.","opts":["Open the statement, add a note listing the clauses Torrance now disputes, and save it again","Preserve the signed statement, its certificate details and the validation report, then hash it","Email Torrance to withdraw the payment demand while the dispute is open, so the clock stops running","Ask the signatory to confirm by telephone that the statement is theirs, and note the call"],"correct":1,"res":["Any edit changes the file that the signature covers, which gives Torrance the argument that the copy is not the signed one.","Correct. The evidence is kept untouched and hashed so any later change is visible. Nothing is repaired by editing the file.","Withdrawing a demand does not touch the technical question and weakens the position on the deadline.","A telephone note is weak evidence. It is easy to deny and it proves nothing about the file or the key."]},{"sit":"Step 2 - Torrance now says the signing key was stolen and used by someone else, so the firm should not be bound by it.","opts":["Ask Torrance for its internal access logs and accept whatever they provide","Take the file to a second law firm for a fresh review of the wording","Ask the certificate issuer for the revocation records current at the time","Ask the signatory to sign a new statement that replaces the disputed one"],"correct":2,"res":["The firm that claims its own key was stolen also controls its logs, so those logs answer nothing.","A wording review costs money and does not test the cryptographic claim.","Correct. The issuer is a third party both sides already trust, and its revocation record settles whether the certificate was still valid at that moment.","A new statement hides the dispute instead of settling it, and it gives up the evidence you already hold."]},{"sit":"Step 3 - the file carries a time value from a third-party authority, while the sender mail log shows an earlier send time.","opts":["Treat the third-party value as the defensible moment, and note the host clock drift","Treat the earlier mail log line as correct, because the sending host sits closest to the event","Average the two times and record the midpoint on the case file as the signing time","Ignore both times and rely on the sentence in the statement that names the payment date"],"correct":0,"res":["Correct. A value signed by a third party is checkable by anyone, while the sending host clock is under the control of one side.","The sending host clock can be wrong or changed, and it is controlled by the party that wants the earlier time.","Averaging produces a number that is provably wrong at both ends and helps nobody in a hearing.","The stated payment date is part of the disputed text, so it cannot settle when the signature was made."]}],"why":"The three steps are containment, third-party evidence and the clock. Evidence is set aside untouched and hashed, because a single edit breaks the tie between the file and the signature. When one side claims its key was taken, only a record held by a party both sides accept can settle validity: the certificate issuer revocation data. And when two clocks disagree, the value signed by an independent time authority is the one a third party can check, because the sending host clock belongs to the side that benefits from the earlier time.","kw":["non-repudiation","repudiation","digital signature","private key signing","PKI and certificate authority","trusted timestamping","proof of origin","audit trail integrity","time synchronization (NTP)","legal and ethical limits"]},{"id":"H08","type":"dual","theme":"Non-repudiation","points":10,"scenario":"A change freeze at Northgate Events ran from 00:00 to 05:00. A firewall rule that opened a management port was signed off inside that window, and the approver now says the approval was made much earlier.","art":{"kind":"log","title":"Evidence pack for the disputed approval","lines":["sig-verify 02:11:04Z file=CR-2214.approval.der status=VALID signer=n.okonkwo serial=0x4f21a9","tsa-receipt 02:11:06Z digest=8be1...c2 source=time.corvid-trust.example status=TSA_VALID","approval-app 01:40:12Z user=n.okonkwo action=unlock_key token=HW-3312 result=SUCCESS","approval-app 01:41:02Z user=n.okonkwo action=sign_document doc=CR-2214 token=HW-3312","approval-app 02:10:58Z user=n.okonkwo action=sign_document doc=CR-2214 token=HW-3312","change-freeze policy window=00:00-05:00 rule=no_firewall_changes action=block_apply","firewall-01 apply 02:14:37Z rule=mgmt-allow-8443 source=CR-2214 actor=svc_change"]},"question":"Answer for both sides: first the review board, then the approver.","hint":"The approver unlocked a hardware token well before the signature. Ask what the application log can prove about the device behind the key.","q1":{"q":"Change board: what does this pack establish about the approved time?","opts":["The signed approval belongs to 02:11, inside the freeze, and the token trace names who held the key","The approval belongs to 01:40, because the token was unlocked before any signing action took place","The approval time cannot be established at all, because the application writes local time without a time zone","The approval is void because the change job applied the rule at 02:14 without waiting for a second approver"],"correct":[0]},"q2":{"q":"Approver: which argument for an earlier approval is still worth putting to the board?","opts":["The unlock event at 01:40 proves the signature existed by then, so the recorded time must be wrong","The change job applied the rule, not the approver, so the freeze never applied to this person","The 01:41 attempt shows intent formed before the freeze, though the accepted signature came later","The document identifier is the same in both attempts, so the two events must be one event recorded twice"],"correct":[2]},"why":"A signature carries the moment it was made, and a trusted time receipt makes that moment checkable. The unlock event only shows that a hardware token was opened; it says nothing about the document. Two signing actions on the same file, one at 01:41 and one at 02:10, are two separate events, and only the accepted one is the approval. So the board is right on the facts, and the approver's only honest argument is about intention, not about the clock. That distinction matters, because accepting the weaker argument would set a precedent that unlocks the freeze window for anyone who starts work early.","kw":["non-repudiation","repudiation","trusted timestamping","digital signature","proof of origin","audit trail integrity","time synchronization (NTP)"]},{"id":"H09","type":"mcq","theme":"Identity and access","points":10,"scenario":"Sable Insurance signs its monthly payment release with a code-signing certificate that expires on the last day of the month. The release on 31 March was signed at 23:58 local time. The build was retried at 00:04 on 1 April from the same pipeline, and that copy is the one that reached production.","art":{"kind":"log","title":"Release signing record","lines":["release-31 2026-03-31T23:58:11Z run=1188 artifact=payments-9.4.1.jar signer=cert-CS-2211 result=SIGNED","release-31 2026-03-31T23:58:14Z run=1188 publish=staging result=SUCCESS","release-31 2026-04-01T00:04:02Z run=1189 artifact=payments-9.4.1.jar signer=cert-CS-2211 result=SIGNED","release-31 2026-04-01T00:04:05Z run=1189 publish=production result=SUCCESS","ca-record cert-CS-2211 notBefore=2025-04-01T00:00:00Z notAfter=2026-04-01T00:00:00Z status=never_revoked","verifier 2026-04-01T00:04:09Z run=1189 status=VALID chain=ok"]},"question":"The verifier accepted run 1189. What is the correct reading of that acceptance?","opts":["The acceptance settles the question, because the certificate was never revoked and the chain check passed cleanly","The earlier staging run is the release that counts, so production must carry the 23:58 artefact","The verifier only tested the chain and missed that the certificate had expired, so acceptance proves little","The pipeline should have extended the certificate before midnight, so this is only a scheduling failure"],"correct":[2],"whyEach":{"0":"Revocation and validity are separate tests. A certificate can be valid at the issuer and useless for a signature made after its end date.","1":"The staged copy was never published to production, so swapping it in would replace a real artefact with one that has no release record.","2":"<b>Correct.</b> A chain check confirms trust up to a known issuer. It does not test whether the signing moment sat inside the certificate validity period, and 00:04 on 1 April is outside a certificate that ends at 00:00.","3":"Renewal timing was poor, but the defect is the missing validity check in the verifier, which will accept the same case every month."},"hint":"Read <code>notAfter</code> and the timestamp of run 1189 side by side, then ask what a chain check actually tests.","why":"Signature validation is a set of tests, not one. The chain test answers whether the certificate came from a trusted issuer. A separate test asks whether the signing moment fell between the start and the end of the certificate validity period. A third asks whether the certificate had been revoked at that moment. Run 1189 was signed four minutes after the certificate ended, so the artifact cannot be attributed to that certificate even though the chain is fine. The repair is to make the build fail when the signing certificate is inside its last hours, and to require the verifier to test validity and revocation as well as the chain.","kw":["digital signature","PKI and certificate authority","non-repudiation","proof of origin","integrity","patching and update management","audit trail integrity"]},{"id":"H10","type":"calc","theme":"CIA triad","points":10,"scenario":"Helio Energy signed an availability contract with a payment processor: 99.9 percent of the minutes in each calendar month. March has 30 days. Two outages were logged against that service in March: a bot-network traffic flood that saturated the provider link for 25 minutes, and a database failover that took 21 minutes. The processor reported the month as compliant.","question":"By how many minutes did the total outage time exceed the allowance for the month?","answerNum":2.8,"tol":0.5,"unit":"minutes","hint":"Turn 30 days into minutes first, then work out the sliver of that total which 0.1 percent represents. Compare the two outages against that sliver.","why":"Thirty days is 43,200 minutes. The contract allows the service to be unavailable for 0.1 percent of that time, which is 43.2 minutes in total, not per incident. The two outages add up to 46 minutes, so the month is 2.8 minutes over the allowance. The interesting part is the reasoning, not the arithmetic: an operator who treats the allowance as a limit per outage will report a comfortable month, while the contract tests the sum. It also matters which outage you count. A traffic flood is a denial of service event, and the failover was a redundancy control that shortened the second outage rather than preventing it. Availability figures only mean something when you know the period, the measurement point and whether small outages count, which is why the service level wording matters as much as the monitoring.","kw":["availability","denial of service (DoS) and DDoS resilience","redundancy and fault tolerance"]},{"id":"H11","type":"classify","theme":"Zero trust","points":10,"scenario":"Atlas Retail is six weeks into a zero trust programme and the steering group wants the evidence behind each decision. You pull the policy rule, the device report and the user state for one case: a warehouse supervisor asking for the stock adjustment console at 07:41.","art":{"kind":"log","title":"Policy inputs for one access request","lines":["pe-decision 07:41:02Z subject=e.mabuza device=LT-8841 app=stock-adjust result=DENY rule=ZT-042","pe-rule ZT-042 conditions=identity_verified:true AND device_compliant:true AND risk_alerts:none","posture 07:40:55Z device=LT-8841 disk_encryption=on patch_level=2026-03 state=MISSING_ENDPOINT_AGENT","idp 07:41:00Z user=e.mabuza mfa=fido2 assurance=high group=warehouse-supervisors","pa-session 07:41:03Z session=none reason=policy_denied","ticket HD-77120 07:44:10Z user=e.mabuza request=exception text='installing the agent myself takes an hour, please grant access just for today'","pe-log 07:41:02Z east_west_attempt=app-stock to db-stock port=1433 result=DENY zone=stock-zone","policy-owner 07:45:00Z note='no exception path is published for device posture, only for identity'"]},"question":"Place each policy input in the zero trust part it belongs to.","buckets":["Policy engine","Policy administrator","Policy enforcement point","Device posture and identity signals","Policy-driven access control"],"items":["The stored rule ZT-042 and its three conditions","The denial decision taken for the request at 07:41:02","The short-lived session that would have carried the request","The reason recorded as policy_denied with no session created","The recorded block of the stock app reaching the stock database","The zone value stock-zone seen on that blocked connection","The report showing the endpoint agent is missing from LT-8841","The hardware key sign-in that produced a high assurance value","The conditions that combine identity, device and risk into one outcome"],"answer":[0,0,1,1,2,2,3,3,4],"whyEach":["A stored rule with conditions is the policy the engine evaluates, so it sits in the engine.","The deny itself is the engine decision, produced by reading the rule and the current signals.","A session is built by the administrator once the engine has returned a decision.","Recording that no session was created is the administrator reflecting the engine outcome.","The network block on the wire is enforced by the enforcement point, which is where traffic meets policy.","The zone label seen on a blocked flow is enforcement metadata about the connection attempt.","A device compliance report is an input signal, and a missing agent is exactly what posture checks are for.","A hardware key sign-in is the strongest identity signal, and it feeds the request instead of being decided by it.","Combining identity, device and risk into one allow or deny is policy-driven access control."],"hint":"The rule and the decision are not the same thing, and a session only exists after a decision. Traffic that was actually stopped on the wire belongs somewhere else.","why":"Zero trust separates the decision from the enforcement and from the signals. Signals arrive from identity and from the device. The policy engine reads a stored rule and returns allow or deny. The policy administrator turns an allow into a narrow, short-lived session, and records a refusal when the answer is deny. The enforcement point sits in the path of the traffic and is the only part that can actually stop a connection. Here the request was refused because the endpoint agent was missing, which is a posture signal, so the rule worked as designed. The user asked for an exception, and the artefacts show there is no published path for a posture exception, which is the real gap the steering group should fix.","kw":["zero trust","policy engine","policy administrator","policy enforcement point","policy-driven access control","device posture","adaptive identity","microsegmentation","secured zones","east-west traffic","never trust, always verify","continuous verification"]},{"id":"H12","type":"match","theme":"Zero trust","points":10,"scenario":"A hospital group at Vantage Health has replaced its site VPN with per-application access. Five questions arrive from the network team, and you must name the concept that settles each one.","question":"Match each question with the zero trust concept that answers it.","pairs":[["Why did the session end after eleven minutes when the request was allowed?","Continuous verification"],["Why can the imaging app reach only one database and nothing else?","Microsegmentation"],["Why is the warehouse device checked again on every request instead of once a day?","Never trust, always verify"],["Why do we hunt for signs of an intruder inside our own network as if one is already here?","Assume breach"],["Why does the contractor see one application instead of the whole subnet?","Threat scope reduction"],["Why did the same user with the same password score differently on Tuesday?","Adaptive identity"]],"hint":"One question is about time, one about the size of the network path, one about how often you check, one about a plan for when policy fails, one about limiting reach, and one about the context around the same person.","why":"These six ideas are often confused because they all sound like caution. Continuous verification is about time: a decision made at 07:41 can be withdrawn at 07:52 when a new signal arrives. Microsegmentation is about how much network a single workload can reach. Never trust, always verify is about the check happening per request, not once a day. Assume breach says design as if the attacker is already inside, which is why the rollout keeps a fallback for a bad rule set. Threat scope reduction limits what one access grant can reach, so a contractor sees one application. Adaptive identity lets the same person score differently as context changes, which is why the same password can be enough on one day and not the next.","kw":["continuous verification","microsegmentation","never trust, always verify","assume breach","threat scope reduction","adaptive identity","zero trust","zero trust network access (ZTNA)","third-party and contractor access","defense in depth","secured zones"]},{"id":"H13","type":"order","theme":"Zero trust","points":10,"scenario":"Atlas Retail runs a 90-second verification cycle on warehouse consoles. A console session was cut off eleven minutes after it started. You must put the six events of that cut-off session in the order in which they happened.","question":"Order the six events from the request to the session end.","items":["The console sends a request for the stock adjustment application with its identity and device signals","The policy engine, whose master rule database holds every stored rule, matches the rule and returns allow with a low risk value","The policy administrator builds a narrow, short-lived session and passes it to the enforcement point","The enforcement point, one of the devices that sit in the path of the traffic, opens the single application path","A new signal arrives from the endpoint showing a change to the disk encryption state","The policy engine re-evaluates the session and withdraws it, so the enforcement point closes the path"],"hint":"Nothing can be decided before the request arrives, nothing can be opened before a session exists, and the withdrawal comes from a fresh signal rather than from the clock alone.","why":"Continuous verification turns a one-off login into a repeating decision. The request carries identity and device signals, the engine decides, and the administrator builds a session with a narrow scope and a short life. The parts behind those steps have names: the master rule database and the decision logic form the control plane, which is where policy is written and evaluated, while the enforcement points that actually touch the traffic form the data plane. The important part is the last two steps: a session ends because a new signal changed the evaluation, not only because a timer ran out. That is why a data plane device must be able to withdraw an active path on the instruction of the control plane, and why long sessions with a single check at the start quietly rebuild the old perimeter model inside a new product name.","kw":["zero trust","continuous verification","control plane","data plane","policy engine","policy administrator","policy enforcement point","device posture","zero trust network access (ZTNA)","microsegmentation","session logging and session replay","never trust, always verify"]},{"id":"H14","type":"match","theme":"Deception and disruption","points":10,"scenario":"The security team at Kestrel Freight reviews its deception and disruption tooling after a scanner spent a weekend crawling the booking site. Legal and the incident lead both sit in the meeting, and every claim must be accurate.","question":"Match each capability with the outcome it can honestly promise.","pairs":[["A low-interaction decoy that answers a login just enough to log attempts","Early warning of scanning with very little risk of harm"],["A high-interaction decoy running a real operating system for weeks","Detailed attacker behaviour under close legal and ethical limits"],["A honeynet of four decoy hosts on one isolated segment","A picture of how an intruder moves between hosts"],["Three decoy accounts named like service administrators","Activity that is easy to trace back to the intruder"],["A canary token placed in a database dump that should never be read","A trigger that fires when an insider reads the wrong file"],["A DNS sinkhole for known malicious lookups","Resolution stopped for a known bad domain and the attempt recorded"]],"hint":"Ask what each item can prove, how long it can run safely, and who has to approve it before it goes live.","why":"Deception gives you warning and behaviour, and disruption gives you time or a blocked path. A low-interaction decoy is cheap and safe because it does not run a real service. A high-interaction decoy shows real technique but needs isolation and legal review, because an attacker inside it is still on a system you own. A honeynet shows movement between hosts. Decoy credentials are traceable because nobody legitimate should ever use them. A canary token in data that is never read legitimately converts a single read into an alert. A sinkhole stops name resolution for known bad domains and records the attempt, which is disruption rather than deception. None of these replaces real controls, and each carries a false positive risk that has to be triaged like any other alert.","kw":["deception technology","disruption technology","low-interaction honeypot","high-interaction honeypot","honeynet","decoy credentials and fake data","honeytoken and canary token","DNS sinkhole","legal and ethical limits","false positive risk of decoys","attacker attribution","deception monitoring and alerting"]},{"id":"H15","type":"classify","theme":"Identity and access","points":10,"scenario":"Vantage Health has to sign off a workforce sign-in standard. Each statement below is taken from the draft, and each one has to sit in the place where it actually does its work.","question":"Place each statement in the control area where it belongs.","buckets":["Multi-factor authentication","Passwordless and FIDO2","Session logging and replay","Privileged access management","Access review and recertification","Identity proofing"],"items":["A nurse enters a password and then a code from an app on a registered phone","A warehouse scanner user presses a finger on the glass and enters a short device pin","An engineer taps a hardware security key that checks the site name before it answers","A helpdesk operator confirms the caller identity before issuing a new security key","A recorded privileged session that can be replayed when a change is questioned","A ticket that keeps the full command output of every administrative session","A vault that releases the datacentre root secret for 15 minutes after approval","A quarterly list signed by each system owner that removes unused accounts"],"answer":[0,0,1,5,2,2,3,4],"whyEach":["A password plus a code from something the user holds is two different factor types, so it is multi-factor authentication rather than a stronger single factor.","A fingerprint plus a device pin also uses two factor types, so the pair is multi-factor even though one factor is short.","A hardware key that verifies the site name binds the credential to the origin, which is the phishing-resistant part of passwordless sign-in.","Identity proofing before a new key is issued protects the enrolment step, because a key handed to the wrong person defeats every later check.","Recording a privileged session so it can be played back is accounting for administrative work.","Keeping complete command output with the ticket is the same idea at the session level rather than at the keystroke level.","Holding a root secret and releasing it for a short approved window is privileged access management with just-in-time access.","A signed quarterly removal of unused accounts is an access review, which is the only one of these that fixes entitlement drift."],"hint":"Three of the statements describe two factor types used together. Two describe a record of administrative work. One is about how a secret is held, one is about checking a person before enrolment, and one is about tidying up accounts that should be gone.","why":"These areas answer different problems. Multi-factor authentication raises the cost of a stolen password. Passwordless and FIDO2 remove the shared secret and bind the credential to the real site, which also removes the phishing step. A body feature adds a factor that cannot be written down or shared, and the sensor behind it has to be tuned: a stricter setting lowers the false acceptance rate (FAR) and raises the false rejection rate (FRR), and the crossover error rate (CER) is the setting where the two are equal and sensors can be compared. Identity proofing protects the enrolment step, because a key handed to the wrong person defeats every check that follows it. Session logging and replay make administrative work reviewable after the event. Privileged access management keeps standing access out of human hands and issues it briefly. Access review is the slow, boring control that removes what nobody uses any more. A programme that buys only the first three still leaves accounts that were never removed, which is how most long-term access is kept.","kw":["multi-factor authentication (MFA)","passwordless and FIDO2","authentication factors (know, have, are)","session logging and session replay","privileged access management (PAM)","access review and recertification","identity proofing","just-in-time (JIT) access","biometrics (FAR, FRR, CER)"]},{"id":"H16","type":"mcq","theme":"Identity and access","points":10,"scenario":"Helio Energy sends a quarterly fraud report to its regulator. For a light-penetration test, the red team walked into a site and tried to read a restricted project folder from an unattended workstation on the engineering floor. After two failed tries the account locked, the user's badge was the only way in, and no data was copied.","question":"Which measurement set should the report use, and why?","opts":["Report the number of rules written in the quarter and the share approved by the security team","Report the hours spent testing and the number of findings, so effort is easy to compare across quarters","Report the mean time from the test to the first alert, because the regulator asks for that figure","Count the successful and failed attempts and the lockouts, because the report compares control results"],"correct":[3],"whyEach":{"0":"Rule counts measure effort inside the team. They say nothing about whether the control stopped the attempt at the workstation.","1":"Hours and finding counts describe the test itself. They are useful for planning the next test but they are not the control result.","2":"Alert time is a detective control figure. Nothing here shows that an alert fired, and detection is not what stopped this attempt.","3":"<b>Correct.</b> Successful and failed attempts measure how often the control was exercised, and a successful lockout shows it held. Those are the figures the agreed target was written against."},"hint":"The control that mattered here stopped the third attempt. Think about which figures show whether a control held, rather than how much work the team did.","why":"Accounting is only useful when it measures the control you claim to have. This test exercised account lockout, so the report needs attempts, both outcomes, and the lockout result. Flagging every test as a finding, or reporting team effort, produces a document that cannot be compared with the target or with the previous quarter. Deciding what to count is part of the accounting design: a number nobody agreed on in advance cannot prove anything later.","kw":["accounting","authentication","authorization"]},{"id":"H17","type":"match","theme":"Zero trust","points":10,"scenario":"Atlas Retail has finished moving contractors from a site VPN to per-application access. The programme board wants every improvement labelled with the zero trust term that names it.","question":"Match each improvement with the term that names it.","pairs":[["A new contractor sees one claims application on the first day","Third-party and contractor access"],["The payer portal is split from the claims zone by one policy boundary","Secured zones"],["A connection between two internal services is logged and checked like any other","East-west traffic"],["A device that fails its check cannot reach any protected application","Device posture"],["A user who signs in at 02:00 from a new country meets a second check","Adaptive identity"],["The steering group records every retired trusted network path","Implicit trust zone"]],"hint":"Two of these are about who is connecting, two are about where a connection may go, and one is about a network range that used to be trusted simply because it was internal.","why":"Zero trust is easier to argue about once the words are fixed. Contractor access describes a class of user whose reach must be limited by default. Secured zones are the boundaries that make a policy boundary real rather than a diagram. East-west traffic is machine-to-machine flow inside the estate, and it needs the same decision as traffic that arrives from outside. Device posture is the state of the endpoint at that moment. Adaptive identity means the same person can meet a different bar as context changes. An implicit trust zone is a range that older designs trusted because of where it sat, and naming it in a decision record is how a programme keeps those ranges from quietly returning.","kw":["third-party and contractor access","secured zones","east-west traffic","device posture","adaptive identity","implicit trust zone","microsegmentation","zero trust network access (ZTNA)","castle-and-moat perimeter","threat scope reduction"]},{"id":"H18","type":"dual","theme":"Deception and disruption","points":10,"scenario":"A red team engagement at Kestrel Freight left a decoy administrator account named svc-adm-backup on the booking database, with a canary token in a table that no legitimate job ever reads. Eleven days later the account was used at 03:14 from a jump host, and the canary fired.","art":{"kind":"log","title":"Deception console, eleven days after deployment","lines":["decoysvc 2026-03-02T09:00:00Z deploy account=svc-adm-backup owner=redteam review=2026-06-01","decoysvc 2026-03-02T09:00:04Z deploy canary=table-billing-shadow rows=400","canary 2026-03-13T03:14:07Z table-billing-shadow read_rows=400 reader=svc-adm-backup result=ALERT","authz 2026-03-13T03:14:06Z user=svc-adm-backup source=jump-03 action=SELECT result=ALLOW","soc-ticket 2026-03-13T03:14:22Z queue=soc-l1 note='decoy account, ticket closed as test traffic'","soc-ticket 2026-03-13T03:15:00Z status=CLOSED disposition=no_action"]},"question":"Answer for both sides: first the blue team lead, then the red team lead.","hint":"The account was created on purpose, and the alert was closed in sixteen seconds. Separate the tool that worked from the process that failed.","q1":{"q":"Blue team: what is the most serious weakness shown by these six lines?","opts":["The decoy account was created eleven days before the engagement, so the review date was set too far away","A decoy alert was closed as test traffic with no check of the source host, so the detection was wasted","The canary table held only 400 rows, which is too small to look interesting to an intruder","The account name is too obvious for a decoy, so a real intruder would never have used it"],"correct":[1]},"q2":{"q":"Red team: which observation about the decoy is the strongest finding in your report?","opts":["The decoy account reused a naming pattern that already exists elsewhere in the estate, so it looked less realistic","The canary fired on a read rather than on a write, so the detection was weaker than it could have been","The decoy raised a clean alert that the monitoring process could not act on, so the value was never realised","The decoy lived on the booking database rather than on a separate host, so it was easier to find"],"correct":[2]},"why":"Deception only pays when someone acts on the alert. The account and the canary both worked: a use of an account that no legitimate process touches is one of the cleanest signals available, and the eleven day gap is normal. The failure is at 03:14:22, where a first line analyst read the word decoy and closed the ticket in sixteen seconds without asking which host made the connection. Both sides score that the same way, which is why deception must be paired with a triage rule that bans closing a decoy alert without a source check and a short written note.","kw":["deception technology","decoy credentials and fake data","honeytoken and canary token","deception monitoring and alerting","false positive risk of decoys","attacker attribution","SIEM correlation and alerting","session logging and session replay","accounting"]},{"id":"H19","type":"order","theme":"Deception and disruption","points":10,"scenario":"At 02:40 the Kestrel Freight deception console reports that a decoy account on the booking database was used from jump-03, and that a canary token in the billing shadow table was read in the same second. Nothing is confirmed yet.","question":"Order the six steps you take, from the alert to the legal position.","items":["Open an incident, pull the connection record for jump-03 and find whether the account exists anywhere else","Confirm the account was created as a decoy and has no legitimate user, then record that confirmation in the ticket","Isolate jump-03 from the network without wiping it, and keep its memory and disk for review","Scope the same account and the same source across every other database and directory","Start the legal hold notice and brief counsel before anyone publishes the source address outside the incident","Ask whether the case supports an attribution claim, and write down what is proven and what is only suspected"],"hint":"You cannot contain a host you have not confirmed is involved, and you cannot run a legal hold after the host has been cleaned.","why":"The order protects both the case and the business. Confirming that the account is a decoy stops the team from isolating the wrong host or from treating a decoy alert as noise. Scoping next shows whether this is one host or a campaign. Isolation without wiping keeps memory and disk, which is the only evidence of how the attacker arrived. The legal hold and the counsel brief must come before any public statement or any countermeasure aimed at the source address, because acting on the attacker's system crosses a legal line. Attribution is the last step, and it is a careful note about what the evidence supports, not a conclusion. A short artefact can decide this whole sequence: the same account used from a jump host that also appears in the decoy deployment record means the alert is real.","kw":["deception monitoring and alerting","attacker attribution","legal and ethical limits","false positive risk of decoys","deception technology","session logging and session replay","audit trail integrity","log immutability and retention"]},{"id":"H20","type":"fill","theme":"AAA","points":10,"scenario":"You are rewriting three sentences in the forensic standard at Corvid Legal. Each sentence was written loosely, and the auditor rejected it twice.","question":"Fill the four gaps so each sentence is precise.","parts":["To prove that a named person took an action, the record must link an authenticated identity, the ",{"b":0}," that permitted the action, and a ",{"b":1}," that fixes the order of events across hosts. When an action is later disputed, the person who took it may try ",{"b":2},". Evidence of that kind is only tested against ",{"b":3}," held by a party that neither side controls."],"answers":["authorization decision","trusted timestamp","repudiation","PKI and certificate authority"],"extras":["hash algorithm","audit policy","encryption key","session replay record"],"hint":"One gap is the decision that allowed the action, one is the thing that fixes when it happened, one names the denial of an action, and one is the third party that issues signing material.","why":"A useful audit record has three parts: who, what was allowed, and when. Authentication alone gives only the first, which is why an action can be denied after the fact even though the login is confirmed. A timestamp from a source outside the organisation is what makes the order of events checkable, because every host clock is controlled by one of the two sides. Repudiation is the denial itself, and the standard should name it so that the reader knows what is being defended against. The evidence for that defence rests on a certificate issuer, because a signature chain is only worth something when the issuer is independent and its revocation records can be read afterwards.","kw":["accounting","authorization","authentication","repudiation","non-repudiation","trusted timestamping","PKI and certificate authority","time synchronization (NTP)","audit trail integrity"]},{"id":"H21","type":"terminal","theme":"Identity and access","points":10,"scenario":"At Northgate Events the authorization service closed ticket AUTH-2211 last night. For the audit file you need a short table of the refusals recorded at the gateway between midnight and 06:00, one row per account and the number of its refused requests. The case folder on the analyst host is /cases/AUTH-2211.","question":"Type the single command that builds that table and files it.","hint":"The record you need lives in the authorization service log, where each refusal names the account and carries a time. The result must be small enough to attach to the ticket.","parts":[{"re":{"source":"\\bgrep\\b|\\bawk\\b|\\bsed\\b","flags":""},"label":"selects the refusal lines from the authorization log"},{"re":{"source":"\\bDENY\\b","flags":""},"label":"matches the refused decisions"},{"re":{"source":"\\bawk\\b","flags":""},"label":"pulls out the account field"},{"re":{"source":"\\bsort\\b","flags":""},"label":"groups equal accounts together"},{"re":{"source":"\\buniq\\b|\\bsort\\s+-c","flags":""},"label":"counts the grouped lines"},{"re":{"source":"\\/cases\\/AUTH-2211","flags":""},"label":"writes the result into the case folder"}],"solution":"grep DENY /var/log/authz.log | awk '{print $4}' | sort | uniq -c > /cases/AUTH-2211/denied-by-account.txt","why":"The audit question is about refusals, so the pattern must select the denial outcome and nothing else. Counting by account turns a long log into a short table, and that table is what shows whether one account was behind every refusal or whether many accounts were refused once each. Writing the table into the case folder keeps the working file with the ticket. A raw refusal line is easy to misread, because a single denied request can look like an attack when it is really a stale entitlement, and the count is what separates the two.","kw":["accounting","authentication","authorization","rule-based access control","session logging and session replay","audit trail integrity","SIEM correlation and alerting"]},{"id":"H22","type":"classify","theme":"Data protection","points":10,"scenario":"A records officer at Bayview Clinic lists eight facts about one document: a patient referral that is stored in the clinical archive, sent to a specialist, and opened for a review meeting. Every fact belongs somewhere in the protection model.","question":"Place each fact in the protection area it belongs to.","buckets":["Encryption at rest","Encryption in transit","Audit trail and log retention","Data classification and retention"],"items":["The archive volume that holds the referral is encrypted with a key held in the clinic key vault","A nightly backup of that volume is written to write-once storage and kept for seven years","The referral leaves the clinic inside a mutually authenticated session to the specialist portal","The receiving portal rejects any session that presents a certificate the clinic does not trust","Every open and every download of the referral is written to a log that ordinary administrators cannot delete","The same log is held for six years so a later complaint can still be answered","The referral is marked as special category data with a lawful basis and a defined destruction date","Clinical staff may see referrals only for the patients on their own team list"],"answer":[0,0,1,1,2,2,3,3],"whyEach":["A volume encrypted with a stored key protects the file while it sits still, which is encryption at rest.","A write-once backup copy of that volume is the same protection applied to the offline copy.","A mutually authenticated session protects the file while it moves, which is encryption in transit.","Checking the other side certificate before accepting a session is the identity half of transport protection.","A log that administrators cannot delete is the immutability half of an audit trail.","Keeping that log for six years is the retention half of the same control.","A label, a lawful basis and a destruction date are the core of data classification and retention.","Limiting who may see the record is part of handling the class of data, and it depends on the label being right."],"hint":"Ask where the document is when the control acts: sitting still, moving, being recorded, or being judged by its label.","why":"Four different questions are often answered with one word, encryption. Encryption at rest protects a file on a disk or in a backup. Encryption in transit protects it on the wire, and mutual authentication makes sure both ends are the parties you expect. An audit trail with retention answers who touched it and keeps that answer long enough to be useful. Classification and retention determine how long you may keep the record at all, and who may see it. A clinic that only encrypts still fails an inspection if nobody can say why the record is held, for how long, or who looked at it.","kw":["encryption at rest","encryption in transit (TLS)","confidentiality","data classification and PII","audit trail integrity","log immutability and retention","need to know","least privilege","PKI and certificate authority"]},{"id":"H23","type":"fill","theme":"Identity and access","points":10,"scenario":"You are reviewing the tier one support workflow at Northgate Events. A change to the customer refund screen needs a second pair of eyes at every step, and the current runbook has already failed one audit.","question":"Fill the five gaps in the corrected workflow.","parts":["Access to the refund screen is granted through ",{"b":0}," so each person holds only the entitlements their role needs, and the operations manager cannot also be the person who ",{"b":1}," the change. Before the refund screen is opened, the operator proves identity with a ",{"b":2}," that binds the credential to the real site. The production refund limit is held in a ",{"b":3}," vault and released for 15 minutes after an approved request, which is ",{"b":4}," access."],"answers":["role-based access control (RBAC)","approves","FIDO2 security key","privileged access management (PAM)","just-in-time (JIT)"],"extras":["mandatory access control (MAC)","writes the runbook","one-time code by text message","honeytoken and canary token","discretionary access control (DAC)"],"hint":"One gap is the model that gives access by job title, one makes two people share a decision, one is a phishing-resistant sign-in, one is the vault, and one is about how long the secret lives.","why":"The five gaps describe one chain. Roles decide what a job needs, which is the practical shape of least privilege. Two different people must request and approve a change, which is separation of duties, and it only works when the approver is not the requester. A hardware key that checks the site name gives the strongest sign-in available today, because a copied password or a relayed code cannot be replayed against the real site. Standing administrator rights are replaced by a vault that releases a secret for a short window, which is just-in-time access. Any workflow that skips one of these steps still works on paper and fails in an audit or an incident.","kw":["role-based access control (RBAC)","separation of duties","least privilege","privileged access management (PAM)","just-in-time (JIT) access","passwordless and FIDO2","multi-factor authentication (MFA)","identity and access management (IAM)","authentication factors (know, have, are)"]},{"id":"H24","type":"spot","theme":"Identity and access","points":10,"scenario":"Bayview Clinic must keep emergency access to its clinical records system working when the single sign-on service is down. You review the break-glass design before the next audit.","art":{"kind":"code","title":"break-glass design note","pick":true,"lines":["design: 24 accounts, one per clinical site, disabled by default","design: account names do not follow the standard staff naming pattern","design: credentials are printed once and held in a sealed safe at each site","design: use of a break-glass account raises an alert to the on-call security phone","review: the account opens the clinical record system directly, with no sign-on service in the path","design: the account is a member of the clinical records administrators group for the whole estate","control: each use is reviewed within 72 hours and the password is rotated after every use","control: the account is excluded from every conditional access rule so it works during an outage","control: sign-ins for the account are written to the security log with full audit detail"]},"question":"Click the two lines that make this design fail its own purpose.","bad":[5,7],"whyEach":["Disabled by default is right. Emergency access must not be usable by accident.","An unusual name is right, because a standard name would hide in the normal account inventory.","A sealed safe at each site is a reasonable way to hold a credential the attacker cannot reach from the network.","An alert on every use is right. Emergency access should be loud rather than silent.","Direct access with no dependency on the sign-on service is the whole point of an emergency account.","This line is a flaw. Estate-wide administrator rights make the account far more valuable than the task requires, so the blast radius of one stolen safe is the whole clinical estate.","Fast review and password rotation after use are correct, and the rotation must happen before the account is used again.","This line is a flaw. Excluding the account from every rule means no device, location or risk signal is ever checked, which is exactly the standing trust that zero trust design removes. The alternative is a narrow exclusion with its own monitoring.","Full audit detail for every sign-in is correct: an emergency account with no record is worse than no emergency account."],"hint":"Both flaws come from making the account more convenient than the task needs: one about how much it can reach, and one about which signals still apply to it.","why":"A break-glass account is a deliberate exception, so its power and its monitoring must stay in balance. Two mistakes break that balance here. Estate-wide administrator rights mean a single credential opens every clinical system, which turns an emergency path into the most valuable account in the organisation. A blanket exclusion from every access rule means no signal is ever evaluated, so anyone who learns the credential has unlimited use from anywhere. Good designs narrow the account to a small set of emergency actions, keep a documented exclusion with its own alerting, monitor every sign-in, and rotate the credential after each use.","kw":["authentication","authorization","privileged access management (PAM)","just-in-time (JIT) access","least privilege","continuous verification","device posture","audit trail integrity","session logging and session replay"]},{"id":"H25","type":"classify","theme":"Deception and disruption","points":10,"scenario":"Helio Energy runs a deception programme and a disruption programme side by side. The analyst handbook needs each item placed in the programme where it actually operates.","question":"Place each item in the deception or the disruption programme.","buckets":["Deception","Disruption"],"items":["A fake payment file with realistic account numbers left in a shared finance folder","A decoy intranet page that only an insider would know how to reach","A canary token hidden in a source control config file that no build should read","A decoy in the billing database whose rows no legitimate job ever selects","A name resolution block for a list of domains seen in recent phishing mail","A slow response handler that answers a password spray with a twenty second delay","A connection limit that caps the number of requests one source may make each minute","A block that drops traffic to a known command and control domain and records the attempt"],"answer":[0,0,0,0,1,1,1,1],"whyEach":["A realistic but false payment file is fake data placed to be found, so it is deception.","A decoy page that only an insider would locate is the same idea applied to an internal audience.","A canary token in a config file is a tripwire: no honest process reads it, so any read is a signal.","Fake rows in a real table are decoy data, and the alert is the product.","A resolution block stops a lookup from succeeding, which is disruption with a useful record.","A deliberate delay against a spray costs the attacker time and produces a clear log line, so it is disruption.","A rate limit is the same idea expressed as a threshold rather than a delay.","Dropping the traffic and recording it removes a working path from the attacker, which is disruption."],"hint":"One programme places things that are not real in the hope that somebody touches them. The other one changes what the attacker can do right now.","why":"The two programmes have different products. Deception produces information: false data, decoy pages and tokens are all designed so that an honest user never touches them, which makes any touch a signal. Disruption produces time and lost capability: a sinkhole, a tarpit and a rate limit make the attacker spend longer and get less, and they usually leave a clear record. Both need honest limits: a decoy in data that legitimate staff really use creates false positives, and a delay applied to paying customers is an outage with a nicer name.","kw":["deception technology","disruption technology","honeyfile","honeypot","honeynet","honeytoken and canary token","decoy credentials and fake data","breadcrumb","DNS sinkhole","tarpit","false positive risk of decoys","deception monitoring and alerting"]},{"id":"H26","type":"branch","theme":"Deception and disruption","points":10,"scenario":"A suspicious file was found in a shared folder at Vantage Health, and a decoy record in the clinical archive fired at the same time. You work the case step by step.","question":"Work the incident. Each step records the choice you click.","hint":"A decoy alert is a signal, not a verdict. Decide what you need to see before you act on a host, and keep the answer proportionate.","steps":[{"sit":"Step 1 - the sharing platform reports that a file named patient-costings.xlsx was opened by a staff account that has no clinical role.","opts":["Delete the decoy file straight away, so that no other member of staff can open it","Confirm the file is a decoy, then pull the account activity for the last thirty days","Suspend the staff account on the spot and tell the line manager before looking at the file","Close the alert, because the file is a decoy and decoy files exist to be opened"],"correct":1,"res":["Deleting the file destroys the evidence and the tripwire, and the reading still has not happened.","Correct. You first confirm what the file is, then read the account history, which shows whether this is curiosity or a pattern.","Suspending a staff account on an unconfirmed reading costs trust, and you still have no idea what happened.","The file exists to warn you, not to be ignored. Closing on the file name alone throws the signal away."]},{"sit":"Step 2 - the account history shows three other decoy files opened in six weeks, all from the same workstation, all outside the user's role.","opts":["Isolate that workstation and wipe it, because four decoy reads prove deliberate data hunting","Change the user password and close the case, since no patient data left the building","Keep the account live under monitoring, preserve the records, and open a case with HR","Publish the user name in the internal security channel so that other staff are warned"],"correct":2,"res":["Wiping destroys the only copy of the browsing and file records that a disciplinary or legal process would need.","No data left the building is an assumption, not a finding, and a password change does not answer the pattern.","Correct. A pattern plus preserved records supports a case, and the people who own the employment consequences must be in the room.","Publishing a name before any finding is a privacy breach and can end the case in the user's favour."]}],"why":"A decoy works only if the team treats it as evidence. Step one is always to confirm that the file or account is a decoy in the deception register, because a real work file and a decoy file look identical to the person who just opened one. The second fact you need is a pattern over time, which is why thirty days of account activity matters more than a single read. Once a pattern exists, the case belongs to a process with rules, which is HR and the data protection officer. Destroying the workstation, changing a password, or naming the person each destroy something the case needs. This is the point of deception: it converts quiet curiosity into a dated, reviewable signal.","kw":["deception technology","deception monitoring and alerting","decoy credentials and fake data","false positive risk of decoys","honeyfile","attacker attribution","legal and ethical limits","honeytoken and canary token","SIEM correlation and alerting","session logging and session replay"]},{"id":"H27","type":"spot","theme":"Data protection","points":10,"scenario":"You are reviewing the central logging standard at Kestrel Freight after an auditor found that a week of authentication records could not be produced for two hosts. The draft below is what the team proposed.","art":{"kind":"log","title":"Logging standard, draft 4","pick":true,"lines":["scope: all authentication, authorization and administrative events are forwarded to the central platform","transport: agents queue events while the network is down and flush the queue in arrival order","time: each host records its own local clock; only the domain controllers use the shared source","integrity: each event carries a hash chain value and the platform verifies it on receipt","retention: authentication events are kept for twelve months and administrative events for three years","storage: events are held in a searchable index that service desk level two administrators can delete","access: read access to the platform is granted by the security team through a weekly approval list","review: the security team reviews failed sign-in patterns for the whole estate each morning"]},"question":"Click the line that defeats the purpose of the whole standard, and the line that will silently make the record order wrong.","bad":[5,2],"whyEach":["Forwarding three event classes centrally is correct: authentication, authorization and administrative events are the core of an evidence trail.","Queueing events while the network is down is normal, and flushing the queue in arrival order keeps the sequence intact.","This line is a flaw. Only the domain controllers use the shared time source, so every other host records a clock that drifts, and two events from different hosts can be placed in the wrong order during an incident. Synchronisation has to cover every host and the offset has to be monitored.","A hash chain verified on receipt is the right integrity control, and it is what makes later editing detectable.","Twelve months and three years are reasonable retention values, provided they match the data protection policy.","This line is a flaw. An administrator who can delete a record can also delete the record of an action they took, which removes the audit trail exactly when it matters. Deletion must need a separate, logged role and a legal hold must override it.","Weekly approval of read access keeps access under review, though a standing read list should be recertified more often.","A daily review of failed sign-in patterns is a reasonable detective routine for the whole estate."],"hint":"One flaw is about the accuracy of the timestamps, and one is about who can make a record disappear.","why":"An audit trail is only as strong as its two weakest properties: time and immutability. Every host clock drifts, and if only the domain controllers use the shared source, the other hosts write times that disagree, so two events from different hosts can be written in the wrong order. That is what turns a break-in into a mystery. The second weakness is deletion: a log that a service desk administrator can delete is a log that an intruder with that account can clear, and evidence can also be lost to a well-meaning clean-up. Separation of duties, a logged delete role and a legal hold that blocks deletion are the usual fixes, and the retention periods have to match the data protection policy rather than being chosen for storage cost.","kw":["audit trail integrity","log immutability and retention","time synchronization (NTP)","SIEM correlation and alerting","session logging and session replay","accounting","separation of duties"]},{"id":"H28","type":"mcq","theme":"AAA","points":10,"scenario":"A quarterly review at Bayview Clinic found 41 accounts with standing clinical administrator rights, 19 of them belonging to staff who changed roles during the year. The platform team proposes four fixes.","question":"Which fix addresses the cause of the finding rather than a symptom of it?","opts":["Give each account rights through time-limited role assignments tied to the current job title","Require a longer and more complex password for every account that holds administrator rights","Add a second approval step to the existing monthly rights spreadsheet before anybody files it","Send a monthly report of administrator accounts to the security team to watch the trend"],"correct":[0],"whyEach":{"0":"<b>Correct.</b> The finding is entitlement drift: rights that outlived the role. Binding rights to a time-limited role tied to the current job title removes the cause, because a role change ends the entitlement instead of adding to it.","1":"A stronger password protects the account from being guessed. It does nothing about 19 people holding rights they no longer need.","2":"Another approval step on a spreadsheet slows the process and leaves the same rights in place, so the finding returns next quarter.","3":"Watching a trend is detection without correction, and it is exactly what produced this quarter's finding."},"hint":"Ask why the rights were still there. The answer is about how rights are granted and how they end.","why":"Access review finds the rights that should not exist, but it does not stop them from appearing. The durable fix is to make the grant follow the job: rights come from a role, the role has an end date, and the human resources system is the source of the job title. Then a role change removes the old entitlement instead of leaving it behind. Reviews still matter, because no automated link is perfect, but a review without a change to how rights are issued is a recurring cost. That distinction between correcting a cause and detecting a symptom is what the exam usually tests.","kw":["access review and recertification","role-based access control (RBAC)","least privilege","identity and access management (IAM)","privileged access management (PAM)","just-in-time (JIT) access","need to know","accounting"]},{"id":"H29","type":"classify","theme":"AAA","points":10,"scenario":"You are mapping the access model of a document platform at Corvid Legal. The owners describe it in five sentences, and each sentence has to sit under the model it describes.","question":"Place each sentence under the model it describes. Each model is used once.","buckets":["Role-based access control (RBAC)","Attribute-based access control (ABAC)","Mandatory access control (MAC)","Discretionary access control (DAC)","Rule-based access control"],"items":["A new paralegal signs in and can open exactly the matter folders that the paralegal role can open","A request is allowed when the user clearance, the matter label and the office location all fit the stored policy","Every document carries a sensitivity label, and no user can lower that label or read above their clearance","The lawyer who created a matter folder decides which colleague may read it","Every request is tested against a fixed condition: no access to case files from outside the country"],"answer":[0,1,2,3,4],"whyEach":["Rights that follow a job title are role-based access control. It is simple to run and it drifts as people change roles.","A decision that combines several attributes of the user, the object and the context is attribute-based access control.","Labels that users cannot change and clearances that cannot be waived are mandatory access control.","An owner who grants access to a resource they own is discretionary access control. It is flexible and it depends on every owner making good choices.","A single fixed condition applied to every request regardless of who asks is rule-based access control."],"hint":"One model follows the job title, one combines several facts about the request, one fixes labels nobody may lower, one lets an owner decide, and one is a single condition that always applies.","why":"These five models differ in who decides. Role-based control decides from the job title, so it is easy to run and slow to notice a role that should have ended. Attribute-based control decides from several facts at once, which is powerful but needs clean data about people, objects and context. Mandatory control decides from labels and clearances that no user can change, which is what regulated material needs. Discretionary control lets the owner of a resource decide, which is flexible and inconsistent. Rule-based control applies one condition to everyone. Real platforms mix them, and the interesting governance question is always which model produced a given allow.","kw":["role-based access control (RBAC)","attribute-based access control (ABAC)","mandatory and discretionary access control (MAC, DAC)","rule-based access control","authorization","least privilege","need to know","data classification and PII"]},{"id":"H30","type":"terminal","theme":"Non-repudiation","points":10,"scenario":"The case folder for a disputed delivery at Corvid Legal holds a signed bundle from 14 March 2026, and the other side now says the bundle was altered after it was received. You must put the record of its current digest in that folder, in a form the other side can recompute, and state which digest function was used. The folder on the analyst host is /cases/SEC-9914.","question":"Type the single command that produces that record.","hint":"The other side must be able to run the same function themselves, so the function you choose has to be named and widely available.","parts":[{"re":{"source":"\\bsha256sum\\b|\\bshasum\\b|openssl\\s+dgst\\s+-sha256|Get-FileHash","flags":""},"label":"computes a SHA-256 digest of the bundle"},{"re":{"source":"northgate-bundle\\.tar","flags":""},"label":"targets the signed bundle in the case"},{"re":{"source":"\\/cases\\/SEC-9914","flags":""},"label":"writes the record into the case folder"}],"solution":"sha256sum northgate-bundle.tar > /cases/SEC-9914/bundle-sha256.txt","why":"A digest is not proof by itself, but it is the cheapest way to show that a file changed after a given moment. The function must be one both sides can run and agree on, which is why a named standard hash is the right choice rather than a proprietary tool or a compression checksum. Writing the result into the case folder turns it into a dated record that sits with the evidence. The value of the digest comes from where it is stored: a digest kept only on the machine that holds the file proves nothing, while a digest in a case folder, or better still in a signed record, lets a third party recompute it years later and see whether the bytes still match.","kw":["hashing and checksums","non-repudiation","integrity","audit trail integrity","repudiation","proof of delivery or receipt"]},{"id":"H31","type":"order","theme":"Deception and disruption","points":10,"scenario":"Kestrel Freight will deploy a high-interaction decoy from its deception programme for the first time. Four weeks before go-live, the programme lead asks you to put the preparation steps in the right order.","question":"Order the six preparation steps before the decoy goes live.","items":["Write down the question the decoy must answer, and the action the team will take when an alert fires","Agree the legal and ethical limits with counsel, including what the decoy may never collect","Place the decoy on its own segment with no route to production data or to the management network","Add an alert that names the decoy, the source host and the account, with an owner for every alert","Test the alert path end to end, including
