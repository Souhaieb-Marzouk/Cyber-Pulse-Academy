window.EXAM_QUESTIONS = [{"id":"M01","type":"mcq","theme":"Change governance and approval","points":10,"scenario":"You are the change coordinator at Northwind Retail. A normal change sits in tonight's queue. Ticket CHG-4471 asks to upgrade the firmware on the core switch fw-core-01, which carries the store network. The extract below is everything the ticket holds.","art":{"title":"CHG-4471 - change record extract","kind":"code","lines":["TICKET     CHG-4471","TYPE       normal","OWNER      L. Brandt (network team)","TARGET     fw-core-01 (production, store network)","WINDOW     Friday 22:00-23:30","IMPACT     impact analysis attached: up to 25 minutes of downtime","TEST       lab switch lab-sw-02: passed","BACKOUT    (empty)","APPROVERS  required: 2   received: 0"]},"question":"The window opens in six hours. What is the correct next action for you as change coordinator?","opts":["Approve it now, because the lab test passed and the window is short.","Hold it until the freeze ends, then raise it again as a fresh ticket.","Return it to the change owner, because it has no tested backout plan.","Approve it now, but have the team write the backout plan in the window."],"correct":[2],"whyEach":["Wrong. A short test on the lab switch does not replace a backout plan. If the upgrade fails at 23:10 there is no approved way back.","Wrong. A freeze is not the reason to hold this change. The real gap is the missing backout plan, and that must be fixed before the window opens.","Correct. An impact analysis and a passing lab test are not enough. A normal change also needs a backout plan that was tested, or the team cannot undo a failure inside the window.","Wrong. A backout plan written during the window is useless at the moment of failure. It is a promise, not a plan."],"hint":"Ask what the team will do at 23:10 if the upgrade fails and the switch does not come back. Which line of the extract answers that question?","why":"Change management exists to make a failure survivable. The approval process checks three things before a normal change may run: the impact analysis, the test results, and a tested backout plan. This ticket has the first two and is missing the third, so it goes back to the change owner. The owner adds and tests the backout plan, and only then can the two approvers sign it.","kw":["change request (RFC)","approval process","Change Advisory Board (CAB)","backout plan","change owner","test results","impact analysis","downtime"]},{"id":"M02","type":"classify","theme":"Change types and urgency","points":10,"scenario":"Falcon Logistics has just rewritten its change policy. The service desk sends you six requests and asks you to label each one with the change type that fits it best.","question":"Put every request under the change type that fits it best.","buckets":["Standard change","Normal change","Emergency change"],"items":["Monthly antivirus definition refresh, pre-approved, no user impact","New firewall rule for the payroll system, reviewed by the board","Vendor patch for a flaw that attackers are exploiting tonight","Password reset for one user through the approved self-service tool","Database schema migration with two hours of downtime and a backout plan","Disable the exposed remote desktop service on the internet gateway after an alert"],"answer":[0,1,2,0,1,2],"whyEach":["A standard change is pre-approved, low risk and repeats on a schedule, like a definition refresh.","A normal change needs a review by the board because it changes a security rule and affects a business service.","An emergency change fixes an active problem. The flaw is exploited now, so the clock is very short.","A password reset through the approved tool is a routine standard change with no downtime.","A schema migration with downtime and a rollback plan is a normal change: planned, tested and reviewed.","The service is exposed and the risk is live, so this is an emergency change."],"hint":"Ask three things for each request: how much risk it carries, how much review it needs, and how fast it must happen.","why":"Change types decide how much approval a change needs and how fast it may run. A standard change is low risk, repeats often and is pre-approved. A normal change is planned and reviewed by the board. An emergency change repairs an active problem and needs an approver outside the normal meeting. The type is not about how clever the work is; it is about risk and speed.","kw":["standard, normal and emergency changes","approval process","Change Advisory Board (CAB)","maintenance window","patch management","backout plan"]},{"id":"M03","type":"match","theme":"Change governance and approval","points":10,"scenario":"You are training two new analysts at Northwind Health. They keep mixing up the words the change policy uses, so you ask them to match each term to the description that fits it.","question":"Match each change management term to its description.","pairs":[["Impact analysis","A study of what the change affects, who is affected and what can break."],["Backout plan","The tested steps that return the system to its previous state if the change fails."],["Maintenance window","The agreed period when the change may run and downtime is allowed."],["Standard operating procedure (SOP)","The written, step-by-step way the team performs a routine task."],["Change owner","The named person who is accountable for the change from request to review."],["Stakeholders","The people and teams who must be told or consulted about the change."]],"hint":"Two of these are documents, one is a period of time, one is a study, one is a person and one is a group of people.","why":"The change policy uses these words in a fixed way. The impact analysis says what the change can break. The backout plan says how to undo it. The maintenance window says when it may run. The SOP says how the team does the work. The change owner is the accountable person, and the stakeholders are the people who must be told. When everyone uses the same words, the approval decision is faster and safer.","kw":["impact analysis","backout plan","maintenance window","standard operating procedure (SOP)","change owner","stakeholders"]},{"id":"M04","type":"order","theme":"Change governance and approval","points":10,"scenario":"Northwind Retail wants one picture of how a normal change travels from the first request to the final review. The manager asks you to place the steps in the right order for the team handbook.","question":"Put the eight steps of the change lifecycle in the correct order, from first to last.","items":["The change owner raises the change request","The team completes the impact analysis","The change is tested in the test environment and the results are attached","The Change Advisory Board reviews the request and approves it","The change runs inside the agreed maintenance window","The team checks that the service is healthy after the change","The network diagram and the runbook are updated","The post-implementation review is held and the ticket is closed"],"hint":"Nothing may run before it is approved, and nothing may be approved before the impact and the test results exist.","why":"A normal change follows the same path every time: request, impact analysis, test, approval, implementation inside the window, validation, documentation and review. Each step produces something that the next step needs. The board cannot approve without the impact analysis and the test results, and the team cannot run the change before the board approves it. The last steps matter as much as the first: the records are updated and the review happens while the memory of the work is still fresh.","kw":["change request (RFC)","impact analysis","test results","Change Advisory Board (CAB)","maintenance window","post-change validation and monitoring","network and architecture diagrams","runbook","post-implementation review (PIR)"]},{"id":"M05","type":"classify","theme":"Change types and urgency","points":10,"scenario":"Northwind Retail is inside its peak trading freeze. The freeze rule says: only emergency changes, or changes with a written risk acceptance signed by the business owner, may run. You triage tonight's queue with the duty manager.","art":{"title":"Tonight's change queue","kind":"log","lines":["TKT-8801 normal    cosmetic banner text on the intranet | CAB approved | no risk acceptance | backout tested","TKT-8802 normal    firewall rule for the payroll launch  | CAB approved | risk accepted: signed by business owner | backout tested","TKT-8803 normal    schema change on pay-db-01           | CAB pending  | backout (empty) | test (empty)","TKT-8804 emergency exploited flaw on the VPN gateway     | approved by on-call manager 01:12 | backout tested","TKT-8805 standard  quarterly report template refresh     | catalogue item | no user impact","TKT-8806 normal    legacy billing host patch             | CAB approved | backout (missing)"]},"question":"Sort the six tickets into the three outcomes for tonight.","buckets":["Runs tonight","Held until the freeze ends","Returned to the change owner"],"items":["TKT-8801 cosmetic banner text on the intranet","TKT-8802 firewall rule for the payroll launch, risk accepted in writing","TKT-8803 schema change with no board decision, no test and no backout plan","TKT-8804 emergency fix for an exploited flaw on the VPN gateway","TKT-8805 quarterly report template refresh from the catalogue","TKT-8806 legacy billing host patch with no backout plan"],"answer":[1,0,2,0,1,2],"whyEach":["The cosmetic change is tidy work, but it fixes nothing and it has no signed risk acceptance, so the freeze holds it.","The firewall rule has a board approval and a written risk acceptance signed by the business owner, which is exactly what the freeze rule allows.","A ticket with no decision, no test results and no backout plan is not ready for the board. It goes back to the change owner.","An exploited flaw is an active problem, and the on-call manager approved the emergency change, so it runs.","A catalogue item with no user impact is low risk, but the freeze stops work that is not urgent.","The ticket carries a board approval, yet a backout plan is still missing, so the change owner must complete it first."],"hint":"Read the freeze rule again. A ticket that is refused by the freeze is not the same as a ticket that is not ready to be approved.","why":"A freeze does not mean that nothing may change. It means that the business accepts change only when the risk of changing is lower than the risk of waiting. Emergency work and work with a signed risk acceptance fit that rule. Everything else waits. A ticket that is simply incomplete is a different case: it fails the normal approval test, so the change owner must finish it before any freeze decision matters.","kw":["change freeze","risk acceptance by the business owner","Change Advisory Board (CAB)","backout plan","test results","audit trail","firewall rule change","legacy application"]},{"id":"M06","type":"mcq","theme":"Change governance and approval","points":10,"multi":true,"scenario":"A junior engineer at Northwind Health sends you a nine page draft change request for a database upgrade. The board will not review a request until the four essentials are present.","question":"Which four items must the request contain before it can go to the board?","opts":["The impact analysis, naming the services and users the change can affect","The purchase order number for the storage hardware and its budget line","The test results from the test environment, stamped with the test date","The tested backout plan and the point where the team decides to roll back","The marketing launch date that the business would prefer for the feature","The name of the change owner and of the person who implements the work"],"correct":[0,2,3,5],"whyEach":["Correct. Without the impact analysis the board cannot judge what the change can break or who will feel it.","Wrong. A purchase order is a budget document. It says nothing about risk, testing or recovery.","Correct. Test results show that the change works somewhere other than production, and the date shows how fresh the evidence is.","Correct. The backout plan and the rollback decision point tell the board how the team gets out of trouble.","Wrong. A launch date is a business wish, not evidence of control. It may influence scheduling, but it never replaces the essentials.","Correct. The board must know who is accountable and who will do the work. These should not be the same person who approves it."],"hint":"Ask what the board needs in order to make a safe decision: what can break, what was proven, how to undo it, and who is responsible.","why":"A change request is a decision document, not a description of the work. The board needs four things before it can say yes: the impact analysis, the test results, the tested backout plan with its rollback decision point, and the names of the change owner and the implementer. Budget papers and preferred launch dates are useful context, but they are not evidence that the change is safe. Keeping approval and implementation in different hands is part of the same control.","kw":["change request (RFC)","impact analysis","test results","backout plan","rollback decision point","change owner","segregation of duties","approval process"]},{"id":"M07","type":"terminal","theme":"Frameworks and audit","points":10,"scenario":"You are the change auditor for the quarter at Northwind Retail. The change log is a CSV file at /var/audit/changes.csv. The last column must hold the backout plan reference, and empty values must go back to their owners.","question":"Use a grep command to list the records in the CSV whose last field is empty. Type the full command.","sample":"$ grep ... /var/audit/changes.csv\nCHG-4402,2025-11-04,L. Brandt,normal,\nCHG-4409,2025-11-18,R. Iqbal,normal,\n2 records with an empty backout field","parts":[{"re":"^\\s*(sudo\\s+)?grep\\b","label":"the command is grep","flags":"i"},{"re":",\\$|,\\s*['\"]?\\$","label":"the pattern matches a line that ends with a comma"},{"re":"changes\\.csv","label":"the command reads the change log file"}],"solution":"grep -E ',$' /var/audit/changes.csv","hint":"An empty last column means the line stops right after a comma. Use grep with the extended pattern flag, and remember that the end of the line is written as a dollar sign.","why":"The empty field sits at the end of each line, so the line ends with a comma. The pattern for the end of a line is the dollar sign, and grep needs the extended pattern flag to treat it that way. Naming the file closes the command. The list you produce is the audit trail of tickets that are missing a required part of the change record, and each one goes back to its change owner.","kw":["backout plan","audit trail","change request (RFC)","change owner"]},{"id":"M08","type":"fill","theme":"Change governance and approval","points":10,"scenario":"Northwind Health is rewriting the one page summary of its change procedure for new starters. Four words are missing from the summary.","question":"Complete the procedure with the correct terms.","parts":["Our change ",{"b":0}," says that every normal change needs two approvals from the ",{"b":1}," before it runs. The work happens only inside the agreed ",{"b":2},". If the change fails, the engineer follows the ",{"b":3}," and records the result in the ticket."],"answers":["standard operating procedure (SOP)","Change Advisory Board (CAB)","maintenance window","backout plan"],"extras":["change freeze","deny list","release notes"],"hint":"One gap names the written procedure itself, one names the group that approves, one names a period of time, and one names the recovery steps.","why":"This summary links four ideas that always travel together. The SOP is the written procedure that the team follows. The board gives the approval that lets the change run. The maintenance window is the agreed time when downtime is allowed. The backout plan is the tested way to undo the work. A new starter who can say these four things in order already understands how a normal change is controlled.","kw":["standard operating procedure (SOP)","Change Advisory Board (CAB)","maintenance window","backout plan","audit trail","approval process"]},{"id":"M09","type":"spot","theme":"Change governance and approval","points":10,"scenario":"You review the record of CHG-4512, a password policy change on the domain controller dc-01, before it is closed. One line breaks a core control of change management.","art":{"title":"CHG-4512 - closing checklist","kind":"code","pick":true,"lines":["CHG-4512  password policy change  target: dc-01","Impact analysis: attached (28 November)","Test: applied to lab-dc-02, users can still sign in","Raised by: D. Okafor (infrastructure engineer)","Approved by: D. Okafor (infrastructure engineer)","Backout plan: restore the system state from 01:00","Maintenance window: Sunday 03:00-04:00","Implementation: D. Okafor and R. Iqbal"]},"bad":[4],"whyEach":["The ticket number and the target are correct and complete.","The impact analysis exists and is dated, which is what the board needs.","The change was tested outside production and the test result is recorded.","Naming the person who raised the change is correct practice.","This line is the problem. The same person raised the change and approved it, so nobody checked the work.","A backout plan with a restore point is present and specific.","The window is agreed and outside business hours.","Two named engineers will implement the change, which is normal practice."],"question":"Click the line that breaks a core change management control.","hint":"Look at who raised the change and who signed it off. Ask whether one person should do both jobs.","why":"Approval only has value when it comes from someone other than the person who wants the change. Here D. Okafor both raised and approved CHG-4512, so the control that should catch a bad idea did nothing. This is why segregation of duties matters: the requester, the approver and the implementer should not collapse into one name. The fix is simple: a second, independent approver signs the record.","kw":["segregation of duties","approval process","change owner","audit trail"]},{"id":"M10","type":"order","theme":"Change types and urgency","points":10,"scenario":"Four changes are waiting for tonight at Northwind Retail. The duty manager asks you to rank them by urgency before the windows are booked.","question":"Rank the four changes from most urgent to least urgent.","items":["A critical remote code flaw in the internet-facing VPN, exploited in the wild, patch tested and ready","A log server at 92 percent disk use, projected to stop writing in five days","A firewall rule cleanup that removes three unused rules, with no user impact","A new logo on the intranet home page"],"hint":"Rank by the harm of waiting, not by how easy or how pleasant the work is.","why":"Urgency comes from the harm that waiting causes. A flaw that attackers already use must be fixed at once, even if the work is awkward. A disk that fills in five days is serious but not instant, so it takes the next free window. Cleaning up unused firewall rules reduces risk later and can wait a little. A new logo changes nothing about safety, so it goes last. Ranking in this order keeps the biggest risk inside the shortest time.","kw":["patch management","standard, normal and emergency changes","downtime","impact analysis"]},{"id":"M11","type":"classify","theme":"Technical implications","points":10,"scenario":"Northwind Health is tightening the controls around its finance laptops and its core switch. The security team sends you six control statements and asks you to label each one.","question":"Label each statement as an allow list, a deny list, or a restricted activity.","buckets":["Allow list","Deny list","Restricted activity"],"items":["Only applications from the signed internal catalogue may run on finance laptops","Known malware hashes are blocked by the endpoint agent","No other change may touch fw-core-01 while the migration runs","Kiosk browsers may reach six named sites only","Backups may not run during the database migration window","The old file sharing protocol SMBv1 is blocked on every host"],"answer":[0,1,2,0,2,1],"whyEach":["An allow list names what is permitted and refuses everything else, so only catalogue applications run.","A deny list names what is forbidden. Blocking known malware hashes is a deny list.","This is a restricted activity: a task that is banned during a particular period, here during the migration.","Six named sites is a short allow list. Everything outside the six is refused.","Banning backups during the migration window restricts an activity for a period of time.","Blocking a specific old protocol on every host is a deny list entry."],"hint":"An allow list says what may happen, a deny list says what may not happen, and a restricted activity bans a task during a period of time.","why":"These three ideas protect a change in different ways. An allow list is the strictest: only the named items work, and everything else is refused. A deny list blocks the items you already know are bad, so it is quicker but less complete. A restricted activity does not block software at all; it stops people from doing a task, such as running a backup, while a sensitive change is in progress. Most change plans use all three at the same time.","kw":["allow list","deny list","restricted activity","firewall rule change","maintenance window"]},{"id":"M12","type":"match","theme":"Technical implications","points":10,"scenario":"Before a large storage migration, the change owner at Falcon Logistics lists the technical implications of the work. You must match each implication to the precaution that answers it.","question":"Match each technical implication to the precaution that fits it.","pairs":[["Downtime of 40 minutes","Book a maintenance window and tell the service desk and the users in advance."],["Restart of the authentication service","Check that the services which depend on it and the health checks come back clean."],["Application restart on the web tier","Warn users to save their work and confirm that the sessions recover."],["Legacy billing application","Keep the old version running, because the vendor no longer releases updates."],["Upstream and downstream dependencies","List the services that call this one before you change its interface."],["Privileged access to production","Use time-limited access with an approval and a session recording."]],"hint":"Each precaution answers one specific worry: time, restarts, an old system, other systems that rely on it, or who may touch production.","why":"A change plan is only realistic when it names the technical effects of the work. Downtime needs a window and a warning. A restart needs a check that the dependent services recover. An old application needs care because nobody will fix it for you. Dependencies must be mapped before an interface changes. And everyone who touches production should hold privileged access for a short, approved and recorded time only. Naming the effect makes the precaution obvious.","kw":["downtime","service restart","application restart","legacy application","upstream and downstream dependencies","privileged access to production","maintenance window"]},{"id":"M13","type":"fill","theme":"Documentation and version control","points":10,"scenario":"A new engineer at Northwind Retail must record a firewall change in the team repository. The four commands below are missing one word each, and the comments explain what every step does.","question":"Complete the four commands so the change is recorded and released properly.","parts":["git ",{"b":0}," -b rule-freeze-2025<br>","git ",{"b":1}," -m \"add the new deny rule\"<br>","git ",{"b":2}," origin rule-freeze-2025<br>","git ",{"b":3}," v1.4.0"],"answers":["checkout","commit","push","tag"],"extras":["clone","rebase","stash"],"hint":"One word starts a new branch, one saves a step with a message, one sends the branch to the shared repository, and one marks a released version.","why":"Version control is what makes a change provable later. The engineer starts a branch so the main line stays clean. Each step is saved as a commit with a message that explains the reason. The branch is pushed so a second person can review it and merge it. When the release is deployed, a tag marks that exact code, so anyone can find which version ran in production. Together these four words give the auditor the history of the change.","kw":["version control","branch and merge request","release tag and commit history","version numbering"]},{"id":"M14","type":"mcq","theme":"Automation and pipelines","points":10,"multi":true,"scenario":"Northwind Retail deploys its storefront through a pipeline. The change board asks why the last deployment went to production without a review, and gives you the pipeline log for release 9.3.0.","art":{"title":"Pipeline log - release 9.3.0","kind":"log","lines":["01:58:02  job=build    branch=main          result=success","01:58:14  stage=test   result=skipped  reason=no test stage defined","01:59:40  stage=deploy target=production  result=success  approver=(none)","02:00:11  scan=secrets result=2 findings  files=.env.production","02:00:30  job=deploy   commit=9f2c1a4  merge_request=(none)","02:01:02  notify=chat  channel=releases result=sent"]},"question":"Which three findings show that the change process was not followed?","opts":["The pipeline wrote straight to the main branch with no review at all","The deployment to production ran with no approver recorded anywhere","The pipeline sent a notification to the release channel afterwards","The build job finished before the deployment job started, as designed","The commit short hash is set to only seven characters in the log","The secret scan found two credential files and the release continued"],"correct":[0,1,5],"whyEach":["Correct. A change must be reviewed before it reaches the main branch. A merge request is the record of that review.","Correct. Production is the environment that needs a recorded approval. An empty approver field means nobody accepted the risk.","Wrong. A notification is normal communication. It is not a change control failure.","Wrong. The order of the jobs is expected. Build before deploy is the design of the pipeline.","Wrong. The length of the short hash is set by the tool, not by the team. It has nothing to do with control.","Correct. Files that hold secrets must never enter the repository. Two findings means the pipeline moved credentials into the history."],"hint":"Look for the three missing controls in a deployment: a review before the merge, an approval before production, and a scan that should have stopped the release.","why":"A pipeline is a machine that follows a script, so the controls must be written into the script. Here the code went straight to the main branch, which removed peer review. The production stage needed no approver, which removed the approval step. The secret scan found two files and the release continued, which means the pipeline reported a problem instead of stopping it. The notification and the job order are normal behaviour. Writing review, approval and a blocking scan into the pipeline turns a fast tool into a controlled one.","kw":["infrastructure as code (IaC)","separation of environments (dev, test, production)","secrets in the repository","test results","branch and merge request","approval process","version control"]},{"id":"M15","type":"fill","theme":"Technical implications","points":10,"scenario":"Northwind Health still runs its billing application on an operating system that no longer receives security fixes. You write the risk note that will be attached to every change that touches the application.","question":"Complete the risk note with the correct terms.","parts":["The billing application runs on an operating system that no longer receives security fixes, so ",{"b":0}," cannot protect it. It stays reachable only through a strict ",{"b":1},", and any change to it needs a longer ",{"b":2}," because the restart is slow. Every change also needs a tested ",{"b":3}," before it starts."],"answers":["patch management","allow list","maintenance window","backout plan"],"extras":["changelog and release notes","release tag","deny list"],"hint":"One gap names the activity that installs fixes, one names the control that limits what can reach the host, one names time, and one names the recovery steps.","why":"An unsupported system cannot be patched, so the usual defence of patch management is missing. The team compensates with a strict allow list, which lets only the known services and addresses reach the host. Because the restart is slow, the change needs a longer maintenance window than a modern system. And because the old software is fragile, a tested backout plan matters even more than usual. Writing these four points down turns an uncomfortable situation into a managed risk.","kw":["legacy application","patch management","allow list","maintenance window","backout plan","downtime"]},{"id":"M16","type":"match","theme":"Documentation and version control","points":10,"scenario":"After an audit finding, the document owner at Falcon Logistics must decide what triggers an update of each artefact. You match each artefact to the trigger.","question":"Match each documentation artefact to the event that must trigger its update.","pairs":[["Network and architecture diagrams","Update them whenever a rule, a route or a host in the picture changes."],["Runbook","Update it as soon as the recovery steps or the commands change."],["Change policy and procedures","The document owner reviews them on a fixed cycle, or after a major incident."],["Changelog and release notes","Add an entry for every released version that users must know about."],["Version numbering","Give each release a clear number, such as 3.4.1, so the exact build is known."]],"hint":"Think about what each document is for: a picture of the estate, recovery steps, the rules themselves, the record of releases, or the label of a build.","why":"Documentation only has value when it matches reality. A diagram that still shows a removed host will mislead the next engineer during an incident. A runbook with old recovery commands is worse than no runbook. The policy needs an owner and a review cycle, because it is the document the auditor reads first. The changelog and the release notes tell users what changed. Clear version numbers tie a name to an exact build, so the team can always say which code is running.","kw":["network and architecture diagrams","runbook","policy and procedure update","changelog and release notes","version numbering","document owner and review cadence"]},{"id":"M17","type":"mcq","theme":"Change governance and approval","points":10,"multi":true,"scenario":"The core switch firmware change finished at 23:05 on Friday. The switch is up and the stores are trading. The change ticket CHG-4471 is still open, and the board asks you what must happen before it can be closed.","question":"Which four tasks close this change properly?","opts":["Close the ticket instantly, because the service is running once again","Run the post-change health checks and record the results in the ticket","Turn off monitoring on the switch for a week to avoid false alerts","Update the network diagram with the new firmware version and the date","Record the outcome, the start time and the end time in the change ticket","Hold the post-implementation review and write down what to improve"],"correct":[1,3,4,5],"whyEach":["Wrong. A running service is necessary but not sufficient. Without validation and records the change is not closed.","Correct. Validation proves that the change worked and gives the board evidence for the closure.","Wrong. Turning off monitoring hides the evidence that the change is stable, and it removes a detective control.","Correct. The diagram is the shared picture of the estate, so it must match the new firmware version.","Correct. The ticket is the audit trail. It needs the times, the result and any deviation from the plan.","Correct. The review turns one difficult night into a better plan for the next time."],"hint":"A change is closed when it is proven, recorded, documented and reviewed, not when the service happens to run.","why":"Closing a change is a control of its own. Validation checks that the service really is healthy, not just reachable. The ticket records what happened, including any surprise, which is what the auditor will read months later. The diagram and the change record must agree with the estate, or the next engineer starts from a false picture. The post-implementation review is where the team decides whether the window, the test and the backout plan were good enough. Skipping any of these leaves the change open in substance even after the ticket is shut. The change record and the estate record must agree, which is why the ticket and the configuration management database are updated together.","kw":["post-change validation and monitoring","network and architecture diagrams","audit trail","post-implementation review (PIR)","configuration management database (CMDB)","change owner"]},{"id":"M18","type":"spot","theme":"Technical implications","points":10,"scenario":"The configuration management database must match the estate. A junior analyst exports the record for the edge firewall fw-edge-01 and compares it with the live device after the weekend change CHG-4471.","art":{"title":"CMDB record and live check for fw-edge-01","kind":"code","pick":true,"lines":["CMDB record fw-edge-01 (exported 12 December)","  firmware:     7.2.4","  rule count:   214","  owner:        network team","  last change:  CHG-4471","Live device fw-edge-01 (checked today)","  firmware:     7.4.1","  rule count:   231","  owner:        network team","  last change:  CHG-4471"]},"bad":[1,2],"whyEach":["The record heading names the device and the export date, which is normal.","This line is stale. The device now runs 7.4.1, so the recorded firmware version is wrong.","This line is stale. The device holds 231 rules, not 214, so the record understates the rule set.","The owner is the same on both sides, so this line is correct.","Both sides show the same ticket as the last change, so this line is correct.","The live heading identifies the device and the date of the check.","This is the live firmware version, which is the truth after the change.","This is the live rule count.","The live owner matches the record.","The live last change matches the record."],"question":"Click the two record lines that no longer match the live device.","hint":"Compare the two blocks field by field. The question is about the record that has fallen behind, not about the device.","why":"The device changed and the record did not, so the estate now drifts away from its configuration baseline. Two fields are wrong: the firmware version and the rule count. Configuration drift is dangerous because the next change is planned from the record, not from the device. An engineer who trusts the record may plan a window for the wrong version or miss the extra rules. The fix is small and immediate: update the record as part of the change, and verify it during post-change validation. The record also carries the ticket number of the last change, which is how the audit trail links a device to an approved request.","kw":["configuration management database (CMDB)","configuration drift","configuration baseline","post-change validation and monitoring","audit trail"]},{"id":"M19","type":"terminal","theme":"Documentation and version control","points":10,"scenario":"An auditor asks who last changed the firewall configuration at Northwind Retail. The file firewall.conf lives in the team repository.","question":"Use a git command to show the most recent commit that touched firewall.conf, with its author. Type the command.","sample":"commit 4c1b90e2a7f3d18b0c55e2aa19c7d4f6081b2e33\nAuthor: L. Brandt <l.brandt@northwind.example>\nDate:   Mon Dec 8 22:14:02 2025 +0000\n\n    add the deny rule for the legacy segment\n\n1 file changed, 1 insertion(+)\nfirewall.conf","parts":[{"re":"^\\s*git\\b","label":"the version control tool is used","flags":"i"},{"re":"\\blog\\b","label":"the command asks for the commit history"},{"re":"(-1\\b|-n\\s*1\\b|--max-count=1\\b)","label":"the output is limited to the newest commit"},{"re":"firewall\\.conf","label":"the file firewall.conf is named"}],"solution":"git log -1 -- firewall.conf","hint":"The history command is git log. Limit it to a single commit with the flag -1, and separate the file name with two dashes so git knows it is a path.","why":"The auditor needs to connect a file to a person. git log lists the commit history, -1 keeps only the newest entry, and the two dashes tell git that everything after them is a file path. The author line in that commit is the change owner for that edit. This small command is how a version controlled configuration produces an audit trail that a paper process can only imitate.","kw":["version control","release tag and commit history","audit trail","change owner","firewall rule change"]},{"id":"M20","type":"branch","theme":"Emergency change handling","points":10,"scenario":"You are the on-call security engineer at Northwind Retail. A critical flaw in the internet-facing VPN is being exploited, and the vendor patch is signed and ready.","question":"Work through the emergency change. Pick the best action at each step; the next step appears after you choose.","steps":[{"sit":"It is 01:40 and the business is closed. The flaw is exploited now and the patch is ready.","opts":["Apply the patch straight away and write the ticket up in the morning","Raise an emergency change, get the on-call approver and log the decision","Wait for the next scheduled board meeting on Thursday and keep watching"],"correct":1,"res":["Risky. If the patch fails at 02:00, nobody approved a backout plan and nothing is recorded.","Correct. The clock is short, but the approval and the record are still part of the change.","The flaw is exploited tonight. Waiting three days leaves the door open."]},{"sit":"The on-call manager approves. The patch needs a restart of the VPN service, and a few staff are still connected.","opts":["Restart the service now and inform the connected users afterwards","Delay the patch until the next quiet weekend and keep watching","Announce a short maintenance window and restart the service in it"],"correct":2,"res":["Poor. A silent restart drops live sessions and leaves the service desk with no explanation to give.","That leaves an exploited flaw open for days, which is far worse than a short restart.","Correct. A short window with a warning keeps the work visible and protects the users who are working."]},{"sit":"The patch is applied and the service is healthy at 02:20. The ticket is still open.","opts":["Record the fix, the times and the approval, then book the review","Close the ticket now, because the service is working once again","Leave the ticket open and finish the write up next week sometime"],"correct":0,"res":["Correct. The record is what turns a rushed night into an approved emergency change.","Weak. Without the times, the approval and the review, the change cannot be defended in an audit.","An open ticket is an unfinished control, and the details fade within days."]}],"hint":"An emergency change moves fast, but it still needs an approver, a warning to the users, and a record that can be read later.","why":"An emergency change is a shortcut in time, not a shortcut in control. The work still needs one named approver, a warning to anyone affected, and a record that shows what was done and when. Because the change is rushed, a tested backout plan and a short maintenance window matter even more. The post-implementation review closes the loop and tells the team what to prepare in advance, so the next emergency is shorter and calmer.","kw":["standard, normal and emergency changes","approval process","backout plan","service restart","maintenance window","audit trail","post-implementation review (PIR)"]},{"id":"M21","type":"branch","theme":"Rollback and recovery","points":10,"scenario":"You are the database change owner at Northwind Health. It is 03:40 and the orders migration is in its maintenance window.","question":"Work through the decisions. Pick the best action at each step; the next step appears after you choose.","steps":[{"sit":"The migration started at 03:00 and is 60 percent complete. The window ends at 04:00, and the database must be online at 04:15 for the morning shift. The tested backout plan takes 20 minutes.","opts":["Let the migration finish and hope it takes under twenty minutes","Start the tested backout plan now, so the database is up on time","Extend the window and ask the morning shift to start a bit later"],"correct":1,"res":["A hope is not a plan. If the last 40 percent takes 25 minutes, the shift starts with no database.","Correct. The backout plan fits inside the time you have, and the service promise is kept.","Extending the window breaks the availability promise and it is not yours to change at 03:40."]},{"sit":"The rollback completes at 04:05 and the database is online. The migration team asks to try again tonight with the same script.","opts":["Agree, because the same script already reached sixty percent","Refuse any further migration attempts for this whole quarter","Agree, but only once the script is changed and the timing tested"],"correct":2,"res":["The script is the thing that failed. Repeating it repeats the failure.","That is too harsh. The change is needed; it just needs a better script and a realistic window.","Correct. The script failed for a reason, and the reason must be found and tested before a retry."]},{"sit":"The retry is booked for the next window. The ticket must show what really happened tonight.","opts":["Record the rollback, its cause and the script change, then review it","Mark the change as a success, because the database is online again","Remove the failed attempt from the ticket to keep the record tidy"],"correct":0,"res":["Correct. The rollback and its cause are part of the change record, and the review will improve the next attempt.","That is untrue. The change failed, and a false success hides the reason from the next engineer.","Removing a failed attempt from the record destroys the audit trail."]}],"hint":"Compare the time you still have with the time the tested backout needs, and remember that a rollback is a success, not a failure, when it protects the service.","why":"A rollback decision point is a time, not a mood. You decide before the window closes whether the work can still finish inside the promised service time. Here the backout fits and the service comes back, so the rollback is the right call. The migration is then repaired and tested before another attempt, because repeating a failed script is not a plan. Finally, the record must show the rollback and its cause, and the review must feed the next window.","kw":["backout plan","rollback decision point","test results","maintenance window","availability and service level agreement (SLA)","audit trail","forward fix"]},{"id":"M22","type":"dual","theme":"Technical implications","points":10,"scenario":"Northwind Retail has just pushed an operating system patch to 400 hosts through its management tool. The tool reports 400 successes. You look at the same rollout from two sides.","question":"Answer the blue team question and the red team question about the patch rollout.","q1":{"q":"Blue team: which single check tells you that the patch is really active on the estate?","opts":["A daily count of failed sign-in attempts on the domain controllers","A nightly comparison of key configuration files with the baseline","A weekly report of the endpoint antivirus alerts from all hosts"],"correct":[1]},"q2":{"q":"Red team: the patch closed your entry path, but your access must survive. Which gap in a rushed rollout is most useful to you?","opts":["The hosts that were rebooted inside the maintenance window tonight","The report that lists the patch version of every host in the estate","The hosts that were offline during the rollout and never got patched"],"correct":[2]},"hint":"The tool reports what it asked for, not what is running. Think about the hosts that never answered at all.","why":"The management tool holds privileged access to production, and it can only report on the hosts that answered it. A success message is therefore evidence about the tool, not about the estate. The blue team confirms the patch by comparing the running version with the approved baseline. The red team looks for the same blind spot from the other side: hosts that were offline, powered down or disconnected keep the old version and keep the old vulnerability. Checking the baseline closes both the doubt and the gap. Hosts that were offline keep the old version, which is measurable configuration drift away from the approved baseline.","kw":["patch management","post-change validation and monitoring","configuration baseline","privileged access to production","configuration drift","maintenance window"]},{"id":"M23","type":"order","theme":"Rollback and recovery","points":10,"scenario":"Northwind Health wants a single backout procedure that any engineer can follow at 03:00. You place the steps in the order the team must perform them.","question":"Put the eight steps of the backout procedure in the correct order.","items":["Notice that the change failed its health checks","Stop the change and freeze any further steps","Decide whether a rollback is possible or a forward fix is needed","Run the tested backout steps and restore the previous version","Check that the service is healthy again","Tell the service desk and the stakeholders what happened","Record the rollback, the times and the cause in the ticket","Hold the post-implementation review and improve the plan"],"hint":"Nothing can be restored before the failing work stops, and nothing can be reported before the service is checked.","why":"A backout procedure works because the order is fixed. The team first notices the failure through its health checks, then stops the work so nothing else changes. Only then does the rollback decision point matter: can the previous version be restored, or is a forward fix the only way out? The restore comes next, then the check that the service is really healthy. Telling the service desk comes after the service is up, because that is when the message is true. The record and the review make the next failure shorter.","kw":["backout plan","rollback decision point","forward fix","post-change validation and monitoring","stakeholders","audit trail","post-implementation review (PIR)"]},{"id":"M24","type":"match","theme":"Frameworks and audit","points":10,"scenario":"Northwind Retail is preparing for three audits in one year. The compliance analyst asks you to match each framework or standard to the change management requirement it places on the company.","question":"Match each framework or standard to its change management requirement.","pairs":[["ITIL change enablement","It sorts changes into types and gives each type its own approval path."],["ISO/IEC 27001 change control","It requires a documented procedure for changes to information systems."],["NIST SP 800-128 configuration management","It asks for a plan, configuration baselines and records of every change."],["SOC 2 change criteria (CC8.1)","It asks the auditor to see that changes are authorised, designed, tested and approved."],["PCI DSS change control","It requires controlled and tested changes to the systems that handle card data."]],"hint":"One framework is a service management practice, one is an international standard, one is a government guide, one is an audit report, and one is a payment card standard.","why":"Frameworks overlap, but each one asks for something slightly different. ITIL change enablement gives the language of change types and approval paths. ISO/IEC 27001 wants the written procedure and the records that prove you follow it. NIST SP 800-128 focuses on configuration management: a plan, baselines and change records. SOC 2 CC8.1 is written for the auditor, who must see authorisation, design, testing and approval. PCI DSS adds the payment angle, where changes to systems that handle card data must be controlled and tested. One good change process usually satisfies all of them.","kw":["ITIL change enablement","ISO/IEC 27001 change control","NIST SP 800-128 configuration management","SOC 2 change criteria (CC8.1)","PCI DSS change control","configuration baseline","test results"]},{"id":"M25","type":"classify","theme":"Change management scope","points":10,"scenario":"A new project manager at Falcon Logistics asks what belongs under change management. You give six items from a real change record and ask her to sort them.","question":"Sort each item into the part of change management it belongs to.","buckets":["Business process","Technical implication","Documentation"],"items":["Two approvers signed the change record","The new firmware needs a service restart","The runbook now shows the new rollback command","The change owner finished the impact analysis","The legacy billing application cannot start on the new operating system","The architecture diagram shows the new jump host"],"answer":[0,1,2,0,1,2],"whyEach":["Approval and signatures are part of the process the people follow, not a technical effect.","A service restart is a technical effect of the change on the running system.","A runbook is a document, so this belongs to documentation.","The impact analysis is a process step with a named owner.","The old application refusing to start is a technical limit of the estate.","A diagram is a document that describes the estate."],"hint":"Ask what kind of thing each item is: a step that people perform, an effect on the running system, or a document that describes it.","why":"Change management has three faces. The business process covers the request, the approval and the review, and it is owned by people. The technical implications cover what the change does to the running estate, such as downtime, restarts and old software. The documentation keeps the record and the pictures true, so the next change starts from facts. The same change always produces all three, which is why a good change record has process entries, technical notes and updated documents.","kw":["approval process","service restart","runbook","impact analysis","legacy application","network and architecture diagrams","change owner"]},{"id":"M26","type":"fill","theme":"Emergency change handling","points":10,"scenario":"Northwind Health is writing the paragraph of its change policy that covers emergency work, because auditors keep asking how urgent changes are controlled.","question":"Complete the emergency change paragraph with the correct terms.","parts":["An ",{"b":0}," change may skip the weekly board meeting, but one named approver must still agree and the decision must be written in the ",{"b":1},". The change owner holds the ",{"b":2}," within five working days, and the ",{"b":3}," is reviewed at that meeting."],"answers":["emergency","audit trail","post-implementation review (PIR)","backout plan"],"extras":["change freeze","maintenance window","release notes"],"hint":"One gap names the change type itself, one names the record that proves the decision, one names the meeting after the work, and one names the recovery steps.","why":"Emergency work is allowed to move fast, and the policy says exactly how fast. One named approver replaces the board meeting, because waiting for a meeting defeats the purpose. The decision must be written into the audit trail, so the exception is visible. The post-implementation review follows within five working days, while the details are fresh. The backout plan is reviewed there, because a rushed change often reveals that the recovery steps were the weakest part.","kw":["standard, normal and emergency changes","audit trail","post-implementation review (PIR)","backout plan","approval process","change owner"]},{"id":"M27","type":"mcq","theme":"Change types and urgency","points":10,"multi":true,"scenario":"Northwind Retail is inside its peak trading freeze, from 20 December to 2 January. The freeze rule says that only work which fixes an active problem or protects the business may run, and every exception needs the duty manager's approval.","question":"Which four activities may run during the freeze?","opts":["A routine library upgrade that the team has already prepared fully","A tested patch for a flaw that attackers are exploiting right now","Renaming the production database to a much tidier and shorter name","Restoring a failed payment service to last night's good version","Adding a firewall rule that blocks the source range of the attack","Read-only monitoring and log review by the security team on shift"],"correct":[1,3,4,5],"whyEach":["Wrong. A prepared library upgrade is still a routine change with no active problem behind it.","Correct. The flaw is exploited now, so this is an active problem and the fix protects the business.","Wrong. Renaming a production database is a risky change with no benefit that justifies it.","Correct. Restoring a failed service is a recovery action, and the known-good version is the safest target.","Correct. Blocking the attacker protects the business, and the rule can be reversed easily.","Correct. Watching and reading change nothing, so monitoring is always allowed."],"hint":"Ask of each activity: does it fix something broken or stop an attack right now? If not, the freeze holds it.","why":"A freeze is a risk decision, not a ban on work. The business accepts a change when waiting would cost more than changing. An exploited flaw, a failed service and a blocked attack all pass that test. Monitoring changes nothing and simply must continue. A prepared library upgrade and a cosmetic rename are ordinary improvements, and the whole point of the freeze is to keep ordinary improvements out of the busiest weeks of the year.","kw":["change freeze","restricted activity","rollback decision point","firewall rule change","post-change validation and monitoring","patch management"]},{"id":"M28","type":"match","theme":"Technical implications","points":10,"scenario":"A junior change owner at Northwind Health keeps booking windows before the work has been proven anywhere. You coach her with five planned changes and the preparation each one needs first.","question":"Match each planned change to the preparation it must have before the window is booked.","pairs":[["Change the format of the API response","Keep the old field for two releases so older clients still work."],["Update the database schema","Run the migration against a restored copy of production data in test."],["Change a rule on the core switch","Keep a console or out-of-band path open in case the change cuts your session."],["Patch the domain controller","Plan a separate window and a reboot order for the copies."],["Deploy a new version of the web application","Watch the error dashboard and run the smoke tests after the deployment."]],"hint":"Each check answers a different worry: old clients, real data, losing your own connection, the copies of a service, or proof that the new version is healthy.","why":"The preparation decides whether the window is realistic at all. An interface change needs the old field kept so that older clients keep working. A schema change must meet real data in a copy, never in production. A network change needs a way back in if it cuts your own session. A domain controller patch needs a planned reboot order for its copies. And a new application version needs a watch afterwards, not just a successful deployment message. Booking the window before the preparation exists is how a short change turns into a long outage.","kw":["backward compatibility","separation of environments (dev, test, production)","test results","service restart","downtime","post-change validation and monitoring"]},{"id":"M29","type":"spot","theme":"Documentation and version control","points":10,"scenario":"Northwind Retail is about to release version 4.2.0 of its customer portal. You review the release checklist before the team starts. One line must not go ahead.","art":{"title":"Release checklist - version 4.2.0","kind":"code","pick":true,"lines":["Create a branch for the fix and open a merge request","Ask a second engineer to review the change before the merge","Copy .env.production into the repository so the pipeline can read the database password","Wait for the pipeline to pass before the merge","Tag the release 4.2.0 and write the release notes","Deploy 4.2.0 to production inside the maintenance window"]},"bad":[2],"whyEach":["A branch and a merge request give the change a review and a record, which is correct practice.","A second pair of eyes on the change is exactly what the review step is for.","This line must not go ahead. A production secret would live in the repository history forever.","Waiting for the pipeline keeps a failing build out of the main branch.","A tag and the release notes tie the version number to the exact code, which the auditor needs.","Deploying inside the agreed window is correct."],"question":"Click the line that must not go ahead.","hint":"One line moves something into the repository that should never be stored there, because removing it later is almost impossible.","why":"A repository keeps every version of every file, so a secret that is committed once stays in the history even after it is deleted from the newest version. Passing a database password to a pipeline through a file in the repository is therefore a permanent leak. The safe pattern is to keep secrets in a secret store and let the pipeline read them at run time. The other lines are good practice: review, pipeline gates, tagging and a controlled deployment window. The checklist is part of the release procedure, so the bad line is removed from the procedure itself and not only from tonight's plan.","kw":["secrets in the repository","version control","branch and merge request","release tag and commit history","changelog and release notes","policy and procedure update"]},{"id":"M30","type":"classify","theme":"Frameworks and audit","points":10,"scenario":"An auditor asks Northwind Health for proof that last quarter's changes were controlled. The change coordinator collects six items from the archive and asks you which ones will satisfy the auditor.","question":"Sort the six items into strong evidence and weak evidence.","buckets":["Strong evidence","Weak evidence"],"items":["A timestamped approval inside the change ticket, with the approver's name","A screenshot with no date, no ticket number and no name","Board minutes that quote the ticket number and the decision","An email that says the team always does it this way","A release tag and a commit hash linked to the change ticket","A verbal approval given in a corridor"],"answer":[0,1,0,1,0,1],"whyEach":["A named approver with a timestamp inside the ticket is exactly the record the auditor looks for.","Without a date, a ticket number or a name, the screenshot proves nothing about this change.","Minutes that quote the ticket number link the decision to the work, which is strong evidence.","A habit is not a record. It shows no decision about this change.","A tag and a commit hash tie the running code to the approved ticket and to a version number.","A verbal approval leaves no trail, so it cannot be checked later."],"hint":"Strong evidence connects a decision to a person, a time and a specific change. Anything missing one of those three links is weak.","why":"Audit evidence has to answer four questions: who decided, when, what exactly was changed, and where the record lives. A named and timestamped approval inside the ticket answers the first two. A release tag with a commit hash answers the third, and the ticket itself answers the fourth. Screenshots without context, habits and corridor agreements fail because they cannot be tied to a single change. The same standard applies to every change, which is why the record is written while the work happens.","kw":["auditor evidence and approval records","audit trail","release tag and commit history","version control","post-implementation review (PIR)","approval process"]},{"id":"M31","type":"calc","theme":"Change planning","points":10,"scenario":"Northwind Health is planning the maintenance window for an orders migration. The work has four steps: backup 18 minutes, schema change 22 minutes, data copy 35 minutes and validation 12 minutes. The window runs from 02:00 to 04:00, and the service must be back 10 minutes before the window ends so that the smoke tests can run.","question":"How many minutes of the window are still free after the four steps and the smoke tests? Give the number of minutes.","answerNum":23,"unit":"minutes","tol":0.5,"hint":"Add the four steps, add the ten minutes you must keep for the smoke tests, then take that total away from the length of the window.","why":"A window is a budget of time. The four steps need 87 minutes: 18 plus 22 plus 35 plus 12. The smoke tests need another 10 minutes before the window ends. The window itself is 120 minutes long, from 02:00 to 04:00. That leaves 23 minutes of slack. Slack is not wasted time: it absorbs a slow step or an unplanned restart without pushing the service past its promised return time.","kw":["maintenance window","downtime","availability and service level agreement (SLA)","post-change validation and monitoring","test results"]}];
(function () {

  /* ---------------- metadata and data ---------------- */
