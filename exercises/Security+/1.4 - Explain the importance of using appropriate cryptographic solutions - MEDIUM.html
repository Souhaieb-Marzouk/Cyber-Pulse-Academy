<script>
(function(){
"use strict";

/* =========================================================================
   DATA — 30 MEDIUM exercises for CompTIA Security+ Chapter 1.4
   Cryptographic solutions: PKI, encryption, obfuscation, hashing,
   digital signatures, blockchain.
   ========================================================================= */
var EX = [
{id:"m1",t:"MS",pts:1,theme:"Symmetric Encryption",
 s:"08:12. Your shift starts with a design review ticket. A developer pasted the encryption call used by the new patient-portal file store. The ticket asks you to approve the design before code freeze tonight.",
 a:"$ openssl enc -aes-256-gcm -salt -pbkdf2 -in study.bin -out study.enc\nAlgorithm : id-aes256-GCM\nKey size  : 256 bits\nTag size  : 128 bits\nRejected earlier: AES-256 in ECB mode, RC4 as a fallback\nAlso rejected: MD5 and SHA-1 pre-hashing for the integrity check",
 q:"Which TWO statements about this design are correct?",
 instr:"CHOOSE TWO",
 o:["The data is protected with a 256-bit symmetric key here","The algorithm runs in an authenticated mode rather than ECB","The same shared key would also be usable for RSA signatures","The tag size of 128 bits makes an extra key exchange unnecessary","ECB would have been safer because it hides repeated blocks"],
 k:["a","b"],
 why:"AES is a symmetric block cipher and AES-256 uses a 256-bit key, so both correct statements describe the call. GCM is an authenticated mode: it protects secrecy and integrity and produces a 128-bit tag, which is why it was chosen over the rejected ECB and RC4 options. ECB would map equal plaintext blocks to equal ciphertext blocks, revealing patterns, so it is the opposite of safe here, and MD5 or SHA-1 pre-hashing would add a collision risk for no benefit. AES is symmetric, so it cannot create RSA signatures, and a GCM tag never replaces key exchange between two parties.",
 h:"AES is one shared key for two parties. GCM is about integrity, not about handing out keys."},

{id:"m2",t:"DND",pts:5,theme:"Symmetric Encryption",
 s:"08:45. A junior analyst is building the approved-algorithm list for the new backup platform. Internal policy says: one shared secret key, fast on large volumes.",
 a:"Approved algorithm list (draft)\nAES-256\nChaCha20\nRSA-2048\nECC P-256\n3DES",
 q:"Drag each algorithm into the correct family. Five items, one slot each.",
 instr:"DRAG EACH ALGORITHM (click a chip, then click a slot)",
 bank:["AES-256","ChaCha20","RSA-2048","ECC P-256","3DES"],
 slots:[{l:"Symmetric",a:"AES-256"},{l:"Symmetric (stream cipher)",a:"ChaCha20"},{l:"Asymmetric",a:"RSA-2048"},{l:"Asymmetric (elliptic curve)",a:"ECC P-256"},{l:"Legacy symmetric",a:"3DES"}],
 why:"Symmetric algorithms use one shared secret key: AES-256, ChaCha20 (a stream cipher that is strong on mobile CPUs) and 3DES (legacy, 168-bit key, 64-bit block, replaced by AES). Asymmetric algorithms use a key pair: RSA-2048 and ECC P-256. Knowing the family tells you where the key comes from and what the algorithm is good at.",
 h:"Ask one question per item: does it need one key shared by both sides, or a key pair?"},

{id:"m3",t:"INP",pts:1,theme:"Protocols and Controls",
 s:"08:40. An outside scan of your public web server captured the handshake. Your baseline allows TLS 1.2 or better with strong ciphers, and the scanning party now reports a weak suite on port 443.",
 a:"ClientHello cipher offer:\n  TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384\n  TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA\n  TLS_RSA_WITH_AES_128_GCM_SHA256\nServerHello selected:\n  TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA\nProtocol: TLS 1.2",
 q:"Name the two weaknesses in the selected suite precisely enough to fix them. One item per box.",
 instr:"TYPE THE MISSING TERMS",
 fields:[{l:"Mode of operation used by the selected suite, which gives no built-in authentication",ph:"three letters or the mode name",acc:["cbc","cbc mode","cipher block chaining"],disp:"CBC mode"},{l:"Hash the selected suite uses for integrity, which is now deprecated",ph:"hash name",acc:["sha-1","sha1","sha 1","sha-1 hash"],disp:"SHA-1"}],
 why:"The server selected TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA. CBC mode encrypts without authenticating, so it is linked to padding-oracle attacks, and SHA-1 is deprecated for collision resistance. The other two suites in the offer were stronger, so the fix is to reorder or restrict the server cipher preference. AES-256 is a healthy key length and ECDHE is a strong key exchange, so neither of those is the problem.",
 h:"Read the middle word and the last word of the selected suite name."},

{id:"m4",t:"INP",pts:1,theme:"Symmetric Encryption",
 s:"09:05. A partner bank must send you a 900 GB data extract tonight. Both sides have RSA key pairs and validated certificates. The transfer window closes at 23:00, so throughput decides the design. The architecture board also asks whether the same design survives a future post-quantum attacker, because the extract must stay secret for ten years.",
 a:"Design constraints\n- 900 GB in one window\n- Both parties hold RSA key pairs and valid certificates\n- CPU on both sides is already busy\n- The design must not depend on one server key pair\n- The algorithms must be replaceable later without redesigning the service\n- The bulk payload must not be tied to the RSA key pair at all",
 q:"Type the correct term in each box to finish the design note. Three boxes.",
 instr:"TYPE THE MISSING TERMS",
 fields:[{l:"Family of algorithm that must protect the bulk 900 GB",ph:"one word",acc:["symmetric","symmetric encryption","symmetric key","secret key"],disp:"symmetric"},{l:"Asymmetric step that agrees the shared session secret",ph:"algorithm or family name",acc:["diffie-hellman","diffie hellman","key exchange","key agreement","dh","ecdhe"],disp:"key agreement (Diffie-Hellman)"},{l:"Scheme that combines both families in one design",ph:"one word",acc:["hybrid","hybrid encryption","hybrid cryptosystem"],disp:"hybrid"},{l:"Property that lets the algorithms be replaced later without redesign",ph:"two words",acc:["crypto agility","cryptographic agility","agility"],disp:"crypto agility"}],
 why:"Symmetric encryption must protect the bulk data payload, because RSA is far too slow for 900 GB. Asymmetric cryptography is used only for the key step: ephemeral Diffie-Hellman agrees a shared session secret, so the data is not tied to one long-lived server key pair. A design that uses both families together is called hybrid encryption, and crypto agility is the property that lets those algorithms be swapped for post-quantum ones later. Encoding with base64 would hide nothing, because it needs no key at all.",
 h:"Bulk data needs the fast family; the slow family only handles the key."},

{id:"m5",t:"DND",pts:5,theme:"Symmetric Encryption",
 s:"10:20. The storage team must encrypt a 40 TB cold archive on a NAS. The old archive server is being decommissioned next month. Data must stay readable after that server is gone, and CPU cost must stay low.",
 a:"Constraints\n- 40 TB, mostly cold reads\n- Old server decommissioned in 30 days\n- No measurable CPU increase under load\n- Key material must not live on the retired server",
 q:"Drag one option into each answer slot. Five slots, one option each.",
 instr:"DRAG EACH ANSWER (click a chip, then click a slot)",
 bank:["AES-256-GCM with the key held in an HSM and served over KMIP","RSA-4096 encryption of every file with the old server key","A single shared passphrase typed by operators at each backup","3DES with a 112-bit effective key and a 64-bit block","ECDHE so the session key comes from a one-time key pair","Plain storage with file permissions only and no encryption"],
 slots:[{l:"Encryption at rest",a:"AES-256-GCM with the key held in an HSM and served over KMIP"},{l:"Why not RSA",a:"RSA-4096 encryption of every file with the old server key"},{l:"Why not shared passphrase",a:"A single shared passphrase typed by operators at each backup"},{l:"Why not 3DES",a:"3DES with a 112-bit effective key and a 64-bit block"},{l:"Forward secrecy",a:"ECDHE so the session key comes from a one-time key pair"},{l:"Why not permissions only",a:"Plain storage with file permissions only and no encryption"}],
 why:"AES-256-GCM gives fast, authenticated encryption for bulk data, and it also protects data in transit on the link between the archive and its users. Keeping the key in a hardware security module (HSM) and serving it over KMIP means the retired server holds no key material and the data stays readable. RSA-4096 on 40 TB is far too slow and ties the data to one server. A shared passphrase is weak and unauditable. 3DES is legacy (112-bit effective key, 64-bit block). File permissions are not encryption at rest.",
 h:"Pick the fastest option, then keep the key separate from the machine being retired."},

{id:"m6",t:"INP",pts:1,theme:"Key Exchange",
 s:"11:00. A design document has blanks in the key-agreement section. The requirement is a shared secret over an untrusted network where a later theft of the long-term private key must not expose yesterday's sessions.",
 a:"Key agreement section (draft)\nTwo parties derive a shared secret using ____ key exchange,\nwhich gives ____ secrecy. The ephemeral keys are then ____.",
 q:"Type the algorithm and the two properties. One item per box.",
 instr:"TYPE THE MISSING TERMS",
 fields:[{l:"Algorithm that derives a shared secret (one word or hyphenated)",ph:"algorithm name",acc:["diffie-hellman","diffie hellman","dh"],disp:"Diffie-Hellman"},{l:"Property that protects past sessions after a key leak",ph:"property name",acc:["forward secrecy","perfect forward secrecy","pfs"],disp:"forward secrecy"},{l:"What happens to the ephemeral keys after the session",ph:"one or two words",acc:["discarded","deleted","destroyed","erased","wiped"],disp:"discarded"}],
 why:"Diffie-Hellman lets two parties compute a shared secret without sending it. When the keys are ephemeral (used once), the design gains forward secrecy: an attacker who steals the long-term private key later still cannot decrypt past sessions, because the one-time keys are gone.",
 h:"The algorithm is named after two people. The property is about the future not unlocking the past."},

{id:"m7",t:"ORD",pts:3,theme:"Key Exchange",
 s:"11:30. A new engineer asks how forward secrecy limits damage when a server private key is stolen later. You walk them through one session step by step.",
 a:"Steps (not in order)\nThe client generates an ephemeral key pair for this session\nA long-term key is stolen a year later, but this session stays safe\nThe two sides derive a shared secret with ephemeral Diffie-Hellman\nThe server sends its certificate and proves its identity\nBoth sides discard the one-time keys when the session ends",
 q:"Order the steps that show why a later key theft cannot unlock this session.",
 instr:"USE THE ARROW BUTTONS TO REORDER",
 items:["The server sends its certificate and proves its identity","The client generates an ephemeral key pair for this session","The two sides derive a shared secret with ephemeral Diffie-Hellman","Both sides discard the one-time keys when the session ends","A long-term key is stolen a year later, but this session stays safe"],
 why:"Identity comes first: the server proves who it is with its certificate. The client then creates a one-time (ephemeral) key pair for this session only, and both sides derive the shared secret with ephemeral Diffie-Hellman. When the session ends, the one-time keys are discarded. A theft of the long-term private key a year later cannot reconstruct the discarded session keys, which is exactly what forward secrecy buys you. Key and certificate lifecycle management uses the same idea: a shorter certificate lifetime limits how long a compromised key stays useful.",
 h:"Identity is proved first, and the one-time keys must be gone before the theft happens."},

{id:"m8",t:"MATCH",pts:5,theme:"Key Exchange",
 s:"13:00. You are writing the key-exchange comparison table for the architecture board. Five rows, five options.",
 a:"Candidates\nA) Ephemeral Diffie-Hellman\nB) RSA key transport\nC) Elliptic Curve Diffie-Hellman\nD) Static Diffie-Hellman\nE) Certificate-based key agreement",
 q:"Match each candidate to its correct property.",
 instr:"CHOOSE ONE OPTION PER ROW",
 rows:[{l:"A) Ephemeral Diffie-Hellman"},{l:"B) RSA key transport"},{l:"C) Elliptic Curve Diffie-Hellman"},{l:"D) Static Diffie-Hellman"},{l:"E) Certificate-based key agreement"}],
 opts:[{v:"a",l:"New key pair per session, so past sessions stay secret"},{v:"b",l:"Session key is wrapped with the server key; a later leak exposes sessions"},{v:"c",l:"Forward secrecy with much smaller keys and lower CPU cost"},{v:"d",l:"Long-lived key pair is reused, so forward secrecy is absent"},{v:"e",l:"The certificate binds a public key to a verified identity"}],
 ans:{r1:"a",r2:"b",r3:"c",r4:"d",r5:"e"},
 why:"Ephemeral Diffie-Hellman and ECDHE both create a fresh key pair per session, which gives forward secrecy; ECDHE does it with smaller keys and less CPU. RSA key transport wraps the session key with the server's long-term public key, so stealing that key later unlocks recorded traffic. Static DH reuses a long-lived pair and has no forward secrecy. A certificate binds a public key to a verified identity; it does not, by itself, provide forward secrecy.",
 h:"Look for the words ephemeral (one-time) versus static (long-lived)."},

{id:"m9",t:"INP",pts:6,theme:"Key Management",
 s:"14:10. You must finish the key-management policy before the auditor arrives. Six blanks are open.",
 a:"Key management policy (draft)\n- All key material is generated and stored inside a ____ (three words).\n- To limit exposure, every data key is replaced on a fixed schedule. This is called key ____.\n- To recover data if the owner leaves, the company keeps a copy of the key in a key ____.\n- No single person may both create and approve a key. This is ____.\n- At end of life the key is destroyed in a documented key ____ step. The certificate lifetime for the service is limited in the same way.\n- The key server will expose a standard interface, ____ (four letters).\n- A device that seals keys to its own hardware on a laptop is a ____ (three letters).",
 q:"Type the missing term in each box.",
 instr:"TYPE THE MISSING TERMS",
 fields:[{l:"Hardware device that stores and uses keys (3 words)",ph:"three words",acc:["hardware security module","hsm"],disp:"hardware security module"},{l:"Replacing a key on a fixed schedule",ph:"one word",acc:["rotation","rolling","rollover"],disp:"rotation"},{l:"Copy kept for recovery",ph:"one word",acc:["escrow","backup"],disp:"escrow"},{l:"Splitting create and approve duties",ph:"three words",acc:["separation of duties","segregation of duties","split knowledge"],disp:"separation of duties"},{l:"Final, documented removal step",ph:"one word",acc:["destruction","destroy","zeroization","zeroisation"],disp:"destruction"},{l:"Standard key-management interface (4 letters)",ph:"four letters",acc:["kmip"],disp:"KMIP"},{l:"Chip that seals keys to the device hardware (3 letters)",ph:"three letters",acc:["tpm","tpm chip"],disp:"TPM"}],
 why:"A hardware security module (HSM) generates and stores keys so they never sit in plain files. Rotation limits how much data one key can expose, and the same idea applies to certificate lifetime. Escrow keeps a recovery copy, which is not the same as a casual backup. Separation of duties stops one person from creating and approving the same key; split knowledge divides a secret between people. Destruction (zeroization) ends the key's life in a documented way. KMIP is the standard protocol for talking to a key server. A TPM is the chip on a laptop or server that seals keys to that specific hardware, so the key cannot simply be copied to another machine.",
 h:"One blank is a four-letter standard, one is a three-word hardware device."},

{id:"m10",t:"INP",pts:3,theme:"PKI and Certificates",
 s:"15:00. A laptop reports that the intranet site portal.corp.example uses a certificate it does not trust. You pull the leaf certificate and the chain, and then you must write down the checks the client performs.",
 a:"Certificate:\n  Subject: CN=portal.corp.example, O=Corp, C=US\n  Issuer: CN=Corp Issuing CA 2, O=Corp\n  Validity: Not Before 2024-03-01, Not After 2025-03-01\n  Serial: 0x4a91\n  Extensions: keyUsage=digitalSignature, extendedKeyUsage=serverAuth\n  OCSP: hxxp://ocsp[.]corp[.]example\nChain: leaf <- Corp Issuing CA 2 <- Corp Root CA\nClient note: certificate pinning is enabled for this internal app",
 q:"Type the missing term in each of the three boxes.",
 instr:"TYPE THE MISSING TERMS",
 fields:[{l:"The trusted root certificate at the top of the chain is called the trust ____",ph:"one word",acc:["anchor","trust anchor","root","anchor point"],disp:"anchor"},{l:"The check that compares the two validity dates with the current time",ph:"two words",acc:["validity window","validity period","expiry check","expiration check","expiry date check","date check"],disp:"validity window"},{l:"Live service named in the certificate that answers revocation queries",ph:"four letters",acc:["ocsp","ocsp responder"],disp:"OCSP"}],
 why:"Trust needs three things: the chain must end at a trusted root, which is the trust anchor; the certificate must be inside its validity window when compared with the current time; and it must not be revoked, which is checked through a CRL or a live OCSP responder. The serial number is only an identifier and its format proves nothing, and the order of the extension list has no security meaning. Certificate pinning is a different control: it makes the client accept only one expected certificate or key. Tokenisation and data masking are also different: they hide or replace values inside a data store and do nothing to validate a certificate.",
 h:"A certificate can be genuine and still be unusable. What could still be wrong?"},

{id:"m11",t:"ORD",pts:5,theme:"PKI and Certificates",
 s:"15:35. A new engineer must install the right certificate order on the load balancer. A wrong order causes trust errors in browsers.",
 a:"Files on disk\ncorp-root-ca.crt\nleaf-portal.crt\ncorp-issuing-ca-2.crt\ncorp-issuing-ca-1.crt\ncorp-policy-ca.crt",
 q:"Put the chain in the correct order, from the trust anchor down to the end-entity certificate.",
 instr:"USE THE ARROW BUTTONS TO REORDER",
 items:["corp-root-ca.crt","corp-issuing-ca-1.crt","corp-policy-ca.crt","corp-issuing-ca-2.crt","leaf-portal.crt"],
 why:"PKI chains flow from the trust anchor to the end entity: root CA, then each intermediate in the path (corp-issuing-ca-1, then corp-policy-ca, then corp-issuing-ca-2), and finally the leaf certificate for the host. Each certificate is signed by the one above it, so a broken order breaks chain building even when every file is genuine.",
 h:"Each certificate is signed by the one above it. Start where trust begins."},

{id:"m12",t:"DND",pts:4,theme:"PKI and Certificates",
 s:"16:10. The intranet TLS certificate for portal.corp.example leaked from a backup. The team plans to replace the file tomorrow morning. No revocation information has been published today.",
 a:"Incident notes\n- The private key for portal.corp.example was copied from an unencrypted backup\n- A replacement certificate file can be installed tomorrow at 09:00\n- No revocation information has been published yet\n- Clients still trust the leaked certificate today",
 q:"Drag one item into each of the four slots.",
 instr:"DRAG EACH ANSWER (click a chip, then click a slot)",
 bank:["Revoke the leaked certificate immediately and publish the revocation","Publish the revocation through a CRL and an OCSP responder","Anyone who holds the leaked key can still be trusted by clients","Install a second certificate for the same name on another port","A new certificate file tomorrow fixes the problem by itself","The serial number of the certificate must be kept secret","The common name should be shortened to reduce the exposure","Reissue only after the replacement file is installed tomorrow"],
 slots:[{l:"Immediate action",a:"Revoke the leaked certificate immediately and publish the revocation"},{l:"How clients learn",a:"Publish the revocation through a CRL and an OCSP responder"},{l:"Risk until then",a:"Anyone who holds the leaked key can still be trusted by clients"},{l:"Wrong assumption",a:"A new certificate file tomorrow fixes the problem by itself"}],
 why:"A leaked private key lets an attacker impersonate the site or decrypt traffic, so the certificate must be revoked at once and the revocation must be published through a CRL and an OCSP responder, because that is how clients learn about it. Until then, clients keep trusting the stolen key, so replacing the file tomorrow is not enough even with HSTS in front of the site: HSTS prevents a protocol downgrade or SSL stripping attack on a new connection, but it does not un-trust a stolen key, and inspecting traffic with TLS inspection would not change that either. A second certificate on another port, a shorter common name and a secret serial number all leave the leaked key trusted.",
 h:"Ask what clients check before they trust the certificate today."},

{id:"m13",t:"MATCH",pts:5,theme:"PKI and Certificates",
 s:"16:40. A new analyst joins the PKI team. You give them a matching exercise as part of onboarding.",
 a:"Components\nA) Certificate authority\nB) Registration authority\nC) Certificate revocation list\nD) OCSP responder\nE) Certificate pinning",
 q:"Match each component to the job it does.",
 instr:"CHOOSE ONE OPTION PER ROW",
 rows:[{l:"A) Certificate authority"},{l:"B) Registration authority"},{l:"C) Certificate revocation list"},{l:"D) OCSP responder"},{l:"E) Certificate policy"}],
 opts:[{v:"a",l:"Signs and issues certificates and monitors transparency logs"},{v:"b",l:"Proofs the identity of the requester before any certificate is issued"},{v:"c",l:"A signed list of certificates that are no longer valid"},{v:"d",l:"Answers a live question about one certificate status"},{v:"e",l:"States what a CA will issue, to whom, and under which rules"}],
 ans:{r1:"a",r2:"b",r3:"c",r4:"d",r5:"e"},
 why:"The CA signs certificates and is the root of trust, and watching a public certificate transparency log is how a rogue or mis-issued certificate for your own domain is spotted early. The RA proofs the requester identity first. A CRL is a signed list of revoked certificates; an OCSP responder gives a live per-certificate answer, which avoids downloading a whole list. The certificate policy states what a CA will issue, to whom and under which rules, so it is the document that decides whether a wildcard or a short-lived certificate is allowed at all.",
 h:"One component checks identity before issue. One answers a live status question."},

{id:"m14",t:"DND",pts:4,theme:"PKI and Certificates",
 s:"17:20. A finance application is failing TLS handshakes. The application log shows the verification error, and you must name the cause and the fix.",
 a:"$ cat app.log\nERROR tls: x509: certificate has expired or is not yet valid\n  notBefore=2024-11-01 notAfter=2024-11-30\n  now(local host clock)=2042-06-14T09:12Z\n  subject=CN=payments.corp.example\n$ timedatectl\n  System clock: 2042-06-14 09:12:44 UTC\n  NTP: inactive",
 q:"Drag one item into each of the four slots. Each slot has exactly one correct item.",
 instr:"DRAG EACH ANSWER (click a chip, then click a slot)",
 bank:["Correct the host clock and re-enable NTP","Run the application with administrator rights","Disable certificate verification for this app","The certificate is expired from the client point of view","Register the service account with the registration authority","The host clock is wrong, not the certificate here","Nothing at all: the CA must resign the root","Replace the certificate with a wildcard certificate","Increase every RSA key size in the chain to 8192 bits"],
 slots:[{l:"Immediate action",a:"Correct the host clock and re-enable NTP"},{l:"Never do this",a:"Disable certificate verification for this app"},{l:"Actual cause",a:"The host clock is wrong, not the certificate here"},{l:"Not the cause",a:"The certificate is expired from the client point of view"}],
 why:"The clock says 2042 while the certificate is valid in 2024, so the certificate looks not-yet-valid and then expired to the client. The cause is the host clock (NTP inactive), not the certificate. Fix the clock and re-enable NTP, then verify again. Disabling verification removes the protection, and a registration authority is only involved when an identity is proofed before issue, so it cannot fix a wrong clock. Trusting a self-signed certificate, replacing with a wildcard or a new root does not fix a wrong clock either.",
 h:"Compare the two dates in the log. Which side is wrong?"},

{id:"m15",t:"INP",pts:2,theme:"PKI and Certificates",
 s:"18:05. The monitoring platform shows two TLS alerts from the load balancer. You must name the cause of each one precisely enough to fix it.",
 a:"ALERT ssl_verify_fail depth=0 serial=0x4a91 subject=CN=api.corp.example\n  reason: unable to get local issuer certificate\nALERT ssl_verify_fail depth=0 serial=0x77c2 subject=CN=cdn.partner.example\n  reason: certificate revoked (OCSP response: revoked at 2025-01-11T04:00Z)\nINFO  stapling: OCSP response attached by cdn.partner.example",
 q:"Type the correct term in each of the four boxes.",
 instr:"TYPE THE MISSING TERMS",
 fields:[{l:"What the client cannot build in the first alert (two words)",ph:"two words",acc:["certificate chain","chain of trust","trust chain","cert chain","chain"],disp:"certificate chain"},{l:"File the load balancer must send to fix the first alert (two words)",ph:"two words",acc:["intermediate ca","intermediate certificate","issuing ca","intermediate"],disp:"intermediate CA"},{l:"Live status service that reported the second certificate",ph:"four letters",acc:["ocsp","ocsp responder"],disp:"OCSP"},{l:"Correct action for a revoked certificate (one word)",ph:"one word",acc:["revoke","revocation","reissue","renew","replace","distrust"],disp:"revoke / reissue"}],
 why:"The first alert means the server did not send its intermediate CA, so the client cannot build the certificate chain up to a trusted root; loading the intermediate fixes it. The second alert is a real revocation reported by an OCSP responder, so that host must stop being trusted until it is reissued. OCSP stapling improves checking, so disabling it would hide evidence rather than fix the fault.",
 h:"One alert is a missing file in the chain. The other is a live status answer."},

{id:"m16",t:"DND",pts:4,theme:"PKI and Trust",
 s:"18:40. The build team asks which trust model fits each situation. You must match the model to the description.",
 a:"Trust models\nPinned key or certificate\nWeb of trust\nCertificate authority chain\nSelf-signed certificate",
 q:"Drag the correct model description into each slot. Four slots, four items.",
 instr:"DRAG EACH ANSWER (click a chip, then click a slot)",
 bank:["The client accepts one hard-coded key and rejects all others","Trust is built from person-to-person key signatures","A hierarchy of CAs signs certificates down to the leaf","The same entity signs its own certificate with no check","Certificates are optional when TLS 1.3 is in use","A blockchain replaces the certificate authority","Only web browsers are able to use this model","Revocation lists hold long-lived symmetric keys"],
 slots:[{l:"Build server, one known host key",a:"The client accepts one hard-coded key and rejects all others"},{l:"Distributed developer community",a:"Trust is built from person-to-person key signatures"},{l:"Public web service",a:"A hierarchy of CAs signs certificates down to the leaf"},{l:"Lab appliance, no PKI",a:"The same entity signs its own certificate with no check"}],
 why:"Pinning accepts one known key or certificate, which is very strict and good for fixed build or API endpoints. A web of trust grows from key signatures between people. A CA hierarchy is the normal model for public web services. A self-signed certificate is signed by its own owner, so it carries no outside assurance and must be trusted manually, which fits only lab or internal cases. Trust is never optional, blockchains do not replace CAs for web TLS, and CRLs do not store symmetric keys.",
 h:"Ask who did the checking before the certificate was accepted."},

{id:"m17",t:"DUAL",pts:2,theme:"Obfuscation",
 s:"19:10. A user reports that a sales file behaves oddly. A byte-frequency review shows a short message hidden in the least significant bits of an image that travels with the file.",
 a:"Red team view: a covert channel hides text in image bits and ships it with a normal file.\nBlue team view: the same image is noticed during a data-review workflow.",
 q:"Answer both sides of the same case. One selection per side.",
 instr:"ONE ANSWER PER SIDE",
 groups:[{l:"Red team: which technique is being used?",opts:["Least significant bit steganography of text","Base64 encoding applied to the whole image","AES-256 encryption applied to the file name","A digital signature placed over the image"],k:["a"]},
 {l:"Blue team: which control best detects this next time?",opts:["Steganalysis and content inspection of images leaving","A longer password policy for the sales team","Faster full-disk encryption on the laptops","A larger asymmetric key size for the site"],k:["a"]}],
 why:"Hiding data inside another file is steganography, and the least significant bit method changes pixel values so slightly that the picture looks normal. The same idea appears in malware that is packed or encrypted so static tools see nothing useful. Detection needs steganalysis and content inspection, with DLP and CASB controls watching what leaves the network, not identity or disk controls. Base64 would make the file obviously larger and unreadable as an image; encryption of a file name protects a name, not a payload; a signature proves origin and integrity but does not reveal hidden content.",
 h:"The file still opens as a normal image. What kind of hiding keeps the carrier usable?"},

{id:"m18",t:"DND",pts:4,theme:"Obfuscation",
 s:"20:00. During an egress review you find a long-lived DNS pattern from one workstation to a single external name server. You must say what it is and what to do.",
 a:"query 2025-02-03T20:11:02Z 10[.]20[.]4[.]77 -> 203[.]0[.]113[.]9 A aGVsbG8tcGF5bG9hZA.evil[.]example\nquery 2025-02-03T20:11:03Z 10[.]20[.]4[.]77 -> 203[.]0[.]113[.]9 A c2VjcmV0LXBhcnQtMg.evil[.]example\nquery 2025-02-03T20:11:04Z 10[.]20[.]4[.]77 -> 203[.]0[.]113[.]9 A ZmlsZS1jaHVuay0z.evil[.]example\nstats: 412 queries in 12 minutes, every answer 0[.]0[.]0[.]0, average label length 44",
 q:"Drag one item into each of the four slots.",
 instr:"DRAG EACH ANSWER (click a chip, then click a slot)",
 bank:["DNS tunneling that carries data out inside encoded labels","Block the egress DNS traffic and sinkhole the domain, then investigate the host","Add DNS logging and egress filtering so only approved resolvers answer","A normal software update check that repeats very often","An encrypted tunnel that must be decrypted to be understood","Ignore it, because outbound DNS is allowed by our policy","The domain is safe because every answer is 0[.]0[.]0[.]0"],
 slots:[{l:"What is happening",a:"DNS tunneling that carries data out inside encoded labels"},{l:"Immediate action",a:"Block the egress DNS traffic and sinkhole the domain, then investigate the host"},{l:"Preventive control",a:"Add DNS logging and egress filtering so only approved resolvers answer"},{l:"What it is not",a:"A normal software update check that repeats very often"}],
 why:"Very long random-looking labels, one external resolver and hundreds of queries build a covert channel: data is encoded (often base64) into DNS labels so it leaves through an allowed port. Block and sinkhole, then investigate the host, and add DNS logging with egress filtering so only approved resolvers can answer. An update check uses short, stable names, and 0[.]0[.]0[.]0 answers are a sinkhole sign, not a safety sign.",
 h:"Look at the label length and how often the queries repeat."},

{id:"m19",t:"MCQ",pts:1,theme:"Blockchain and Ledger",
 s:"20:35. A supplier sent a duplicate shipment record to your supply-chain blockchain ledger. Two entries now claim 500 units each, but only 500 units were shipped. The ledger is append-only.",
 q:"What is the correct way to correct the record?",
 instr:"CHOOSE ONE",
 o:["Delete the wrong block and rebuild the chain from that point","Edit the fields of the wrong block directly in place","Append a correcting transaction that reverses the entry","Move the ledger data into a shared spreadsheet file"],
 k:["c"],
 why:"Blockchain design is append-only and immutable: each block hashes the previous one, so editing or deleting a block breaks every later block. The correct practice is to append a corrective transaction, which keeps a full audit trail of both the error and the fix. Spreadsheets lose the shared, tamper-evident history, and in-place edits destroy trust in the ledger.",
 h:"Think about what a hash pointer to the previous block does if you edit history."},

{id:"m20",t:"MATCH",pts:5,theme:"Blockchain and Ledger",
 s:"21:00. Eight manufacturers want one shared ledger. Each member must be able to write records, but no member may read another member's private pricing. Nobody wants to depend on a single company. The architecture board also asks how ledger properties and the newer hidden-data controls differ.",
 a:"Candidates\nA) Public blockchain\nB) Permissioned blockchain\nC) Single-hosted database\nD) Emailed spreadsheet\nE) Smart contract with an owner key",
 q:"Match each candidate to its correct property.",
 instr:"CHOOSE ONE OPTION PER ROW",
 rows:[{l:"A) Public blockchain"},{l:"B) Permissioned blockchain"},{l:"C) Single-hosted database"},{l:"D) Emailed spreadsheet"},{l:"E) Smart contract with an owner key"}],
 opts:[{v:"a",l:"Every participant can read all state, so no privacy between members"},{v:"b",l:"Access control plus immutability, with private channels for members"},{v:"c",l:"One party controls the data, which the members rejected"},{v:"d",l:"No shared tamper-evident history and no access control"},{v:"e",l:"Privileged action without consensus, so immutability is weakened"}],
 ans:{r1:"a",r2:"b",r3:"c",r4:"d",r5:"e"},
 why:"A permissioned blockchain limits who can join, write and read, so members share a tamper-evident ledger while keeping private data in private channels. A public chain exposes every record to all participants, so it fails the privacy requirement. A single-hosted database or an emailed spreadsheet creates one point of control or no control at all, and neither gives a shared tamper-evident history. Tokenisation and data masking are useful for hiding values inside such a ledger, but they do not change who controls it. A smart contract with a unilateral owner key can change recorded state without consensus, which weakens immutability.",
 h:"The members need one shared ledger AND privacy between members, and no single owner."},

{id:"m21",t:"DUAL",pts:2,theme:"Digital Signatures",
 s:"21:30. A vendor later claims they never sent a purchase order for 4,200 units. You have the signed order, the vendor's certificate, and the audit log.",
 a:"Vendor position: the signature is not ours, the order was invented.\nYour position: the order was signed with the vendor's key.",
 q:"Answer both sides of the same dispute. One selection per side.",
 instr:"ONE ANSWER PER SIDE",
 groups:[{l:"Which evidence proves the order came from the vendor and was not changed?",opts:["The signature, verified with the vendor public key, over the order hash","The order file creation date shown in the directory listing","The fact that the purchase order used company letterhead","The total size of the order file measured in kilobytes"],k:["a"]},
 {l:"What does a valid digital signature NOT give you here?",opts:["Non-repudiation, because only the key holder could sign","Confidentiality, because the order was never encrypted","Integrity, because any change breaks the signature check","Authenticity, because the key belongs to the vendor"],k:["b"]}],
 why:"A digital signature is created with the sender's private key and verified with the sender's public key over a hash of the content. This proves who signed (authenticity), that nothing changed (integrity) and that the signer cannot plausibly deny it (non-repudiation). A signature does not encrypt anything, so it gives no confidentiality: anyone with the file can read it. File dates and letterhead can be faked and prove nothing.",
 h:"Ask what the private key proves, and what it does not hide."},

{id:"m22",t:"MCQ",pts:1,theme:"Digital Signatures",
 s:"22:00. A vendor sends a software release plus a detached signature file. Your build pipeline must decide whether to deploy.",
 q:"What must the pipeline verify before deploying the release?",
 instr:"CHOOSE ONE",
 o:["That the release hash matches once checked with the vendor public key","That the release file is smaller than the previous shipped version","That the vendor signed the licence agreement in the same quarter","That the release file was downloaded over a secure HTTPS channel"],
 k:["a"],
 why:"Verification hashes the release, then checks that signature with the vendor's public key. A match proves the file came from the holder of the private key and was not altered. File size, contract timing and transport security alone cannot prove the file is genuine: a secure channel can still deliver a tampered file if the source was compromised.",
 h:"You confirmed the sender. Now confirm nothing changed on the way."},

{id:"m23",t:"INP",pts:2,theme:"Hashing and Integrity",
 s:"22:30. A junior developer stores password hashes in a new user table. You inspect the code and the table, then write the two findings.",
 a:"CREATE TABLE users (id INT, email TEXT, pw_hash CHAR(64));\nINSERT ... VALUES (1,'a@corp.example', SHA2('Summer2025!',256));\nNote: identical passwords produce identical pw_hash values.\nColumn comment: unsalted, unslow, single pass of SHA-256.\nLegacy rows were migrated from an older MD5 and SHA-1 column.",
 q:"Type the correct answer in each box. Two boxes.",
 instr:"TYPE THE MISSING TERMS",
 fields:[{l:"The weakness that lets an attacker reuse precomputed tables",ph:"two words",acc:["rainbow table","rainbow tables","precomputed table","precomputed hash table"],disp:"rainbow table"},{l:"The fix that makes identical passwords hash differently",ph:"one word",acc:["salt","salting","a salt"],disp:"salt"}],
 why:"Fast password hashes such as MD5 and SHA-1 without a salt are identical for identical passwords, so an attacker can use precomputed tables (rainbow tables) or crack one value and learn every account that shares it. Adding a unique random salt per account forces separate work for every hash, and a deliberately slow password hash such as bcrypt, scrypt or Argon2 makes each guess expensive.",
 h:"Identical passwords must not produce identical stored values."},

{id:"m31",t:"INP",pts:2,theme:"PKI and Certificates",
 s:"02:50. The PKI team is onboarding a new internal service. You must finish the request so the certificate authority can issue the certificate without a follow-up call. The intermediate CA that will sign it also carries a name constraints extension.",
 a:"Onboarding form (draft)\n- The public key is sent to the CA inside a ____ (three words).\n- The subject field carries CN=reports.corp.example so the name matches the host.\n- The certificate policy decides the allowed lifetime and whether a wildcard name is permitted.\n- The intermediate CA carries a name constraints extension, so only the permitted name space can be signed.\n- The private key is generated on the server and never sent anywhere.",
 q:"Type the missing term in each box. Two boxes.",
 instr:"TYPE THE MISSING TERMS",
 fields:[{l:"The signed-by-the-requester request sent to the CA (three words)",ph:"three words",acc:["certificate signing request","signing request","csr"],disp:"certificate signing request"},{l:"Component of a PKI that proofs the requester identity before issue",ph:"two words",acc:["registration authority","ra"],disp:"registration authority"}],
 why:"The requester generates a key pair locally and sends only a certificate signing request (CSR) to the CA. The CSR contains the public key and the requested subject, including the common name that must match the host. The registration authority proofs the requester identity before the CA issues anything, and the certificate policy decides the allowed lifetime and whether names such as wildcards are permitted. A name constraints extension on the intermediate CA restricts which names it may sign at all. The private key never leaves the server.",
 h:"One item is the request file. One item is the team that checks the identity."},

{id:"m24",t:"ORD",pts:4,theme:"Protocols and Controls",
 s:"23:05. The build server logged a TLS handshake for an artefact download. Your baseline for outbound TLS allows 1.2 or 1.3 only, and it requires forward secrecy.",
 a:"Handshake events (not in order)\nServerHello selects the suite and sends its certificate\nApplication data flows inside the session\nClientHello offers supported versions and cipher suites\nClient validates the chain status through OCSP\nFinished messages complete the handshake and keys are agreed",
 q:"Order the handshake events from the first to the last.",
 instr:"USE THE ARROW BUTTONS TO REORDER",
 items:["ClientHello offers supported versions and cipher suites","ServerHello selects the suite and sends its certificate","Client validates the chain status through OCSP","Finished messages complete the handshake and keys are agreed","Application data flows inside the session"],
 why:"The client offers versions and cipher suites first. The server selects one and sends its certificate chain. The client then validates the chain and checks revocation status through OCSP. Finished messages complete the handshake and both sides agree session keys. Only then does application data flow inside the encrypted session. With the ECDHE suite the session key came from a fresh ephemeral pair, which is what gives forward secrecy; the RSA step only authenticates the server, and OCSP only reports revocation status.",
 h:"Nothing moves in secret until the handshake is finished."},

{id:"m25",t:"ORD",pts:5,theme:"Protocols and Controls",
 s:"23:30. A junior analyst has to explain what happens when a browser opens an HTTPS site. Put the steps in the right order.",
 a:"Events (not in order)\nServerHello with the chosen cipher suite\nClientHello with supported versions and ciphers\nApplication data over the established session\nCertificate chain validation by the client\nFinished messages, session keys agreed",
 q:"Order the events from the first to the last.",
 instr:"USE THE ARROW BUTTONS TO REORDER",
 items:["ClientHello with supported versions and ciphers","ServerHello with the chosen cipher suite","Certificate chain validation by the client","Finished messages, session keys agreed","Application data over the established session"],
 why:"The client offers its versions and cipher suites (ClientHello). The server picks one and sends its certificate with the chain (ServerHello). The client validates the chain to a trusted root and checks revocation. Both sides finish the handshake and agree session keys. Only then does application data flow inside the encrypted session.",
 h:"Nothing is exchanged in secret until both sides finish the handshake."},

{id:"m26",t:"MATCH",pts:5,theme:"Symmetric Encryption",
 s:"23:55. The security architecture team asks for a short table that maps each control to what it really provides.",
 a:"Controls\nA) AES-256-GCM\nB) SHA-256\nC) RSA-3072\nD) HMAC-SHA256\nE) bcrypt",
 q:"Match each control to its correct purpose.",
 instr:"CHOOSE ONE OPTION PER ROW",

 opts:[{v:"a",l:"Bulk encryption plus integrity using one shared key"},{v:"b",l:"A fixed-length digest used to detect any change"},{v:"c",l:"A key pair used for key transport and signatures"},{v:"d",l:"A keyed digest that proves integrity and origin"},{v:"e",l:"A deliberately slow password hash with built-in salt"}],
 ans:{r1:"a",r2:"b",r3:"c",r4:"d",r5:"e"},
 why:"AES-256-GCM encrypts bulk data and adds an integrity tag with one shared key. SHA-256 produces a digest that shows whether data changed. RSA-3072 is asymmetric: a key pair for key transport and signatures. HMAC-SHA256 is a keyed hash, so it proves the message was not changed by anyone without the key. bcrypt is built for passwords: slow by design and salted.",

{id:"m27",t:"MCQ",pts:1,theme:"Hashing and Integrity",
 s:"00:20. A device build must prove that an uploaded firmware image is authentic and unchanged. The device has a shared secret key but no certificate and no reliable clock.",
 q:"Which algorithm fits best?",
 instr:"CHOOSE ONE",
 o:["AES-256 used in Galois Counter Mode","HMAC-SHA256 over the image bytes","ECC P-384 with a self-signed certificate","MD5 over the image bytes and the header"],
 k:["b"],
 why:"HMAC is a keyed hash: both sides share one secret key, so the device can verify integrity and origin with no certificate and no clock. AES-GCM encrypts data but needs a nonce and both sides' keys for encryption, not a detached authenticity check. A self-signed certificate gives no outside trust and needs time handling. MD5 is broken for collision resistance.",
 h:"No certificate, no clock. What can a shared secret prove by itself?"},

 s:"00:50. New hires must learn that key length means different things for different algorithms. You build a sorting exercise.",
 a:"Key sizes\n3DES: 168-bit key, 112-bit effective\nAES-128\nAES-256\nECC P-256\nRSA-3072",
 q:"Drag each item into the correct slot. Five slots, one item each.",
 instr:"DRAG EACH ANSWER (click a chip, then click a slot)",

 why:"3DES has a 168-bit key but only about 112 bits of effective strength because of meet-in-the-middle analysis, and it is deprecated. AES-128 is an accepted baseline and AES-256 adds margin. Elliptic curve cryptography reaches strong security with small keys, so P-256 is roughly comparable to a large RSA key. RSA needs much larger keys for the same strength, which is why ECC is preferred on constrained devices.",
 h:"One item is legacy. Two items are asymmetric with very different key sizes."},
