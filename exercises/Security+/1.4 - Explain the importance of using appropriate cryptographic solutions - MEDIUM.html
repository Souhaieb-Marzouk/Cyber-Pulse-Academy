   FRAMEWORK — written once, drives every exercise above.
   ========================================================================= */
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var META={topicId:"security-plus",chapter:1.4,title:"Cryptographic Solutions",difficulty:"medium",questionCount:31,estimatedMinutes:78,passMark:70};
try{var raw=$("#cm-exercise-meta");if(raw){META=JSON.parse(raw.textContent);}}catch(e){}
var PASS=META.passMark||70, TOTMETA=META.estimatedMinutes||78;
var main=$("#main"),tLeft=$("#tLeft"),scNow=$("#scNow"),qNow=$("#qNow"),pFill=$("#pFill"),pauseInd=$("#pauseInd"),btnPause=$("#btnPause");
var USER={name:"",country:"ZZ",theme:"dark"};
var S=null,armed=null,armedCls=null;

function esc(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(s){s=Math.max(0,Math.round(s));var m=Math.floor(s/60),r=s%60;return (m<10?"0":"")+m+":"+(r<10?"0":"")+r;}
function r1(n){return Math.round(n*10)/10;}
function norm(v){return String(v||"").toLowerCase().replace(/\s+/g," ").trim();}
var LETTERS=["A","B","C","D","E","F","G","H"];

/* ---------- preparation: shuffle answers once per attempt ---------- */
function prepare(){
  S.views=EX.map(function(ex,i){
    var v={ex:ex,idx:i,i:ex.id,t:ex.t,pts:ex.pts||1,theme:ex.theme||"General"};
    v.parts=[];
    if(ex.t==="MCQ"||ex.t==="MS"){
      v.order=shuffle((ex.o||[]).map(function(_,idx){return idx;}));
      (ex.k||[]).forEach(function(letter){
        var orig=letter.charCodeAt(0)-97,pos=v.order.indexOf(orig);
        v.parts.push({id:"c"+orig,label:"choice "+LETTERS[pos],pts:1,
          ok:function(){return !!S.cv[v.i].sel["c"+orig];},
          detail:(ex.o||[])[orig]});
      });
      v.maxParts=(ex.k||[]).length||1;
    } else if(ex.t==="DND"){
      v.bank=(ex.bank||[]).map(function(text,idx){return {text:text,idx:idx};});
      v.bankOrder=shuffle(v.bank.map(function(b){return b.idx;}));
      v.slots=ex.slots;
      v.slots.forEach(function(sl,si){
        v.parts.push({id:"s"+si,label:sl.l,pts:1,
          ok:function(){var b=v.bank[parseInt(S.cv[v.i].pick[si],10)];return !!b&&b.text===sl.a;},
          detail:"should be: "+sl.a});
      });
      v.maxParts=v.parts.length;
    } else if(ex.t==="CLASS"){
      v.cats=ex.cats;
      v.bank=(ex.bank||[]).map(function(b,idx){return {text:b.l,c:b.c,idx:idx};});
      v.bankOrder=shuffle(v.bank.map(function(b){return b.idx;}));
      v.parts=v.bank.map(function(b,bi){
        return {id:"b"+bi,label:b.text,pts:1,
          ok:function(){return S.cv[v.i].pick["b"+bi]===b.c;},
          detail:"role: "+(((ex.cats||[]).filter(function(c){return c.id===b.c;})[0]||{}).l||"")};
      });
      v.maxParts=v.parts.length;
    } else if(ex.t==="MATCH"){
      v.rows=ex.rows;
      v.opts=shuffle((ex.opts||[]).map(function(o,idx){return {v:o.v,l:o.l,idx:idx};}));
      v.parts=v.rows.map(function(row,ri){
        var good=ex.ans["r"+(ri+1)];
        return {id:"r"+(ri+1),label:row.l,pts:1,
          ok:function(){return S.cv[v.i].pick["r"+(ri+1)]===good;},
          detail:"correct option: "+optText(v,good)};
      });
      v.maxParts=v.rows.length;
    } else if(ex.t==="ORD"){
      v.items=ex.items.slice();
      v.start=shuffle(v.items.map(function(_,i){return i;}));
      v.parts=v.items.map(function(text,i){
        return {id:"p"+i,label:text,pts:1,ok:function(){return S.cv[v.i].ord[i]===i;},detail:"position "+(i+1)};
      });
      v.maxParts=v.items.length;
    } else if(ex.t==="INP"){
      v.fields=ex.fields;
      v.parts=v.fields.map(function(f,fi){
        return {id:"f"+fi,label:f.l,pts:1,
          ok:function(){var val=norm(S.cv[v.i].txt[fi]);return (f.acc||[]).some(function(a){return norm(a)===val;});},
          detail:"accepted: "+f.disp};
      });
      v.maxParts=v.fields.length;
    } else if(ex.t==="TERM"){
      v.terms=ex.terms;
      v.parts=v.terms.map(function(tm,ti){
        return {id:"t"+ti,label:tm.l,pts:1,
          ok:function(){var val=norm(S.cv[v.i].txt[ti]);return !!(val&&tm.re.test(val));},
          detail:tm.disp};
      });
      v.maxParts=v.terms.length;
    } else if(ex.t==="DUAL"){
      v.groups=ex.groups;
      v.groups.forEach(function(g,gi){
        (g.k||[]).forEach(function(letter){
          var orig=letter.charCodeAt(0)-97;
          v.parts.push({id:"g"+gi+"_"+orig,label:g.l,pts:1,
            ok:function(){return !!S.cv[v.i].sel["g"+gi+"_"+orig];},
            detail:g.opts[orig]});
        });
      });
      v.maxParts=v.parts.length;
    }
    v.maxParts=v.maxParts||1;
    v.perPart=v.pts/v.maxParts;
    return v;
  });
}
function optText(v,val){var f=(v.opts||[]).filter(function(o){return o.v===val;})[0];return f?f.l:val;}

function newState(){
  var order=EX.map(function(_,i){return i;});
  shuffle(order);
  S={order:order,pos:0,cv:{},locked:{},revising:{},skipped:{},
     manual:false,checkPause:false,tLeft:TOTMETA*60,tick:null,finished:false,results:null};
  EX.forEach(function(ex){S.cv[ex.id]={sel:{},pick:{},txt:[],ord:[],hint:false};});
  S.views.forEach(function(v){
    if(v.t==="ORD")S.cv[v.i].ord=v.start.slice();
    if(v.t==="INP"||v.t==="TERM")S.cv[v.i].txt=(v.ex.fields||v.ex.terms||[]).map(function(){return "";});
  });
}
function view(){return S.views.filter(function(v){return v.i===EX[S.order[S.pos]].id;})[0];}
function editing(v){return !S.locked[v.i]||!!S.revising[v.i];}

function itemScores(v){
  var cv=S.cv[v.i],c=0;
  v.parts.forEach(function(p){if(p.ok())c++;});
  var earned=c*v.perPart;
  if(cv.hint)earned=earned*0.9;
  return {correct:c,earned:r1(earned),max:v.pts,
          label:c===v.parts.length?"full":(c>0?"partial":"zero")};
}
function totals(){
  var earned=0,max=0,answered=0,skipped=[],denied=0;
  S.views.forEach(function(v){
    if(S.skipped[v.i]&&!S.locked[v.i]){skipped.push(v.idx+1);return;}
    var sc=itemScores(v);
    earned+=sc.earned;max+=sc.max;answered++;
  });
  S.views.forEach(function(v){if(S.cv[v.i].hint)denied+=v.pts*0.10;});
  earned=Math.max(0,earned-denied);
  var pct=max>0?Math.round((earned/max)*100):0;
  return {earned:r1(earned),max:max,answered:answered,skipped:skipped,pct:pct,denied:r1(denied)};
}
function refreshHud(){
  tLeft.textContent=fmt(S.tLeft);
  var t=totals();
  scNow.textContent=t.earned.toFixed(1)+" / "+t.max;
  qNow.textContent=(S.pos+1)+" / "+S.order.length;
  pFill.style.width=((S.pos+1)/S.order.length*100)+"%";
  pFill.parentNode.classList.toggle("amber",totals().skipped.length>0);
  var parts=[];
  if(S.manual)parts.push("Paused (manual)");
  if(S.checkPause)parts.push("Timer paused — review mode");
  pauseInd.textContent=parts.length?parts.join(" + "):"Timer running";
  pauseInd.className="pill"+(parts.length?" on":"");
  btnPause.setAttribute("aria-pressed",S.manual?"true":"false");
  btnPause.textContent=S.manual?"Resume":"Pause";
  $("#hdSev").textContent="Timer "+fmt(TOTMETA*60)+" · pass "+PASS+"%";
}
function tick(){
  if(!S||S.finished)return;
  if(!S.manual&&!S.checkPause){
    S.tLeft-=1;
    if(S.tLeft<=0){S.tLeft=0;refreshHud();finish(true);return;}
  }
  refreshHud();
}
function startTimer(){if(S.tick)clearInterval(S.tick);S.tick=setInterval(tick,1000);}

/* ---------- rendering ---------- */
function blockArt(v){
  var ex=v.ex,a=ex.a||"";
  if(ex.t==="LOGV"){
    return '<div class="blk art"><span class="lbl">Evidence</span>'+
      '<div class="filter" style="margin-bottom:8px"><label class="sr" for="flt-'+esc(v.i)+'">Filter the evidence lines</label>'+
      '<input id="flt-'+esc(v.i)+'" type="text" placeholder="Filter evidence lines (for example: revoked, OCSP, 0[.]0[.]0[.]0)" data-flt="'+esc(v.i)+'"></div>'+
      '<pre id="pre-'+esc(v.i)+'">'+a.split("\n").map(function(l){return '<span class="logline">'+esc(l)+'</span>';}).join("\n")+'</pre></div>';
  }
  return '<div class="blk art"><span class="lbl">Evidence</span><pre>'+esc(a)+'</pre></div>';
}
function optionsHtml(v,group){
  var ex=v.ex,g=(v.t==="DUAL")?v.groups[group]:null;
  var arr=g?g.opts:ex.o;
  var order=(v.t==="DUAL")?arr.map(function(_,i){return i;}):v.order;
  var sel=(v.t==="DUAL")?("g"+group+"_"):"c";
  var type=(v.t==="MS"||v.t==="DUAL")?"checkbox":"radio";
  var lock=!editing(v);
  var html="";
  order.forEach(function(orig,pos){
    var id=sel+orig,on=!!S.cv[v.i].sel[id];
    var correct=(v.t==="DUAL")?((g.k||[]).indexOf(String.fromCharCode(97+orig))>=0)
                              :((ex.k||[]).indexOf(String.fromCharCode(97+orig))>=0);
    var cls="opt";
    if(lock){
      if(correct&&on)cls+=" good";
      else if(correct&&!on)cls+=" miss";
      else if(!correct&&on)cls+=" err";
    }
    var mark=lock?('<span class="chip-in '+(correct?"ok":"bad")+'">'+(correct?"correct":"wrong")+'</span>'):"";
    html+='<label class="'+cls+'"><input type="'+type+'" name="g-'+esc(v.i)+'-'+group+'" data-sel="'+esc(id)+'" '+(on?"checked":"")+' '+(lock?"disabled":"")+'>'+
      '<span class="k">'+LETTERS[pos]+'</span><span>'+esc(arr[orig])+mark+'</span></label>';
  });
  return html;
}
function renderAnswer(v){
  var ex=v.ex,html="",lock=!editing(v);
  if(ex.t==="MCQ"||ex.t==="MS"){html+=optionsHtml(v,0);}
  else if(ex.t==="DUAL"){
    html+='<div class="two">';
    v.groups.forEach(function(g,gi){html+='<div><h3>'+esc(g.l)+'</h3>'+optionsHtml(v,gi)+'</div>';});
    html+='</div>';
  }
  else if(ex.t==="DND"){
    html+='<p class="note">Click a chip to select it, then click a slot. Keyboard: tab to a chip, press Enter, then tab to the slot and press Enter. You can also drag with the mouse. A slot always shows the item it holds.</p>';
    html+='<div class="pool">'+v.bankOrder.map(function(bi){
      return '<button type="button" class="chip" data-bank="'+bi+'" aria-pressed="false" '+(lock?"disabled":"")+'>'+esc(v.bank[bi].text)+'</button>';
    }).join("")+'</div>';
    v.slots.forEach(function(sl,si){
      var pick=S.cv[v.i].pick[si];
      var txt=(pick!==undefined&&pick!=="")?v.bank[parseInt(pick,10)].text:"(empty)";
      var cls="drop",mark="";
      if(lock){
        var ok=v.parts[si].ok();
        cls+=(ok?" good":" bad");
        mark='<span class="chip-in '+(ok?"ok":"bad")+'">'+(ok?"correct":"wrong")+'</span>';
        if(!ok)mark+='<span class="chip-in miss">expected: '+esc(sl.a)+'</span>';
      }
      html+='<div class="slot"><span class="sn">'+esc(sl.l)+'</span>'+
        '<div class="'+cls+'" data-slot="'+si+'" tabindex="0" role="button" aria-label="Slot '+esc(sl.l)+'">'+esc(txt)+mark+'</div>'+
        (lock?"":'<button type="button" class="btn sm" data-clear="'+si+'">Clear</button>')+'</div>';
    });
  }
  else if(ex.t==="CLASS"){
    html+='<p class="note">Click an item, then click the role. Keyboard: tab to the item, press Enter, then tab to the role and press Enter.</p>';
    html+='<div class="pool">'+v.bankOrder.map(function(bi){
      var b=v.bank[bi],picked=S.cv[v.i].pick["b"+bi]||null,cls="chip";
      if(lock)cls+=(picked===b.c?" good":" bad");
      var tag=picked?('<span class="chip-in mut">'+(lock?(picked===b.c?"correct":"wrong"):"assigned")+'</span>'):"";
      return '<button type="button" class="'+cls+'" data-cls="'+bi+'" aria-pressed="'+(picked?"true":"false")+'" '+(lock?"disabled":"")+'>'+esc(b.text)+tag+'</button>';
    }).join("")+'</div><div class="two">';
    v.cats.forEach(function(c){
      var kids=v.bank.filter(function(b){return S.cv[v.i].pick["b"+b.idx]===c.id;});
      html+='<div class="slot" style="display:block"><div class="sn" style="flex:none">'+esc(c.l)+'</div>'+
        '<div class="drop" data-cat="'+esc(c.id)+'" tabindex="0" role="button" aria-label="'+esc(c.l)+'">'+
        (kids.length?kids.map(function(b){return '<span class="chip-in mut">'+esc(b.text)+'</span>';}).join(" "):"(empty)")+'</div></div>';
    });
    html+='</div>';
  }
  else if(ex.t==="MATCH"){
    v.rows.forEach(function(row,ri){
      var id="r"+(ri+1),pick=S.cv[v.i].pick[id]||"",cls="rw";
      if(lock)cls+=(v.parts[ri].ok()?" good":" bad");
      var opts='<option value="">-- choose --</option>'+v.opts.map(function(o){
        return '<option value="'+esc(o.v)+'"'+(pick===o.v?" selected":"")+'>'+esc(o.l)+'</option>';
      }).join("");
      html+='<div class="'+cls+'"><span class="rl">'+esc(row.l)+'</span>'+
        '<label class="sr" for="m-'+esc(v.i)+'-'+ri+'">Answer for '+esc(row.l)+'</label>'+
        '<select id="m-'+esc(v.i)+'-'+ri+'" data-match="'+id+'" '+(lock?"disabled":"")+'>'+opts+'</select>'+
        (lock?'<span class="chip-in '+(v.parts[ri].ok()?"ok":"bad")+'">'+(v.parts[ri].ok()?"correct":"wrong")+'</span>':"")+'</div>';
    });
  }
  else if(ex.t==="ORD"){
    html+='<p class="note">Use the up and down buttons to change the order.</p>';
    S.cv[v.i].ord.forEach(function(itemIdx,pos){
      var cls="ord";
      if(lock)cls+=(S.cv[v.i].ord[pos]===pos?" good":" bad");
      html+='<div class="'+cls+'"><span class="pos">'+(pos+1)+'</span><span class="tx">'+esc(v.items[itemIdx])+'</span>'+
        '<button type="button" class="btn sm" data-mv="up" data-p="'+pos+'" '+(lock||pos===0?"disabled":"")+' aria-label="Move this item up">&#9650;</button>'+
        '<button type="button" class="btn sm" data-mv="down" data-p="'+pos+'" '+(lock||pos===S.cv[v.i].ord.length-1?"disabled":"")+' aria-label="Move this item down">&#9660;</button></div>';
    });
  }
  else if(ex.t==="INP"||ex.t==="TERM"){
    (ex.fields||ex.terms).forEach(function(f,fi){
      var cls="rw";
      if(lock)cls+=(v.parts[fi].ok()?" good":" bad");
      html+='<div class="'+cls+'"><span class="rl">'+esc(f.l)+'</span>'+
        '<label class="sr" for="i-'+esc(v.i)+'-'+fi+'">'+esc(f.l)+'</label>'+
        '<input id="i-'+esc(v.i)+'-'+fi+'" class="mini" style="flex:1 1 260px" type="text" data-txt="'+fi+'" placeholder="'+esc(f.ph||"")+'" value="'+esc(S.cv[v.i].txt[fi]||"")+'" '+(lock?"disabled":"")+'>'+
        (lock?'<span class="chip-in '+(v.parts[fi].ok()?"ok":"bad")+'">'+(v.parts[fi].ok()?"correct":"wrong")+'</span>':"")+'</div>';
    });
  }
  return html;
}
function render(){
  if(!S||S.finished)return;
  armed=null;armedCls=null;
  var v=view(),ex=v.ex,lock=S.locked[v.i]&&!S.revising[v.i];
  var h='<section class="card">';
  h+='<div class="row" style="justify-content:space-between"><div class="row">'+
     '<span class="tag acc">Exercise '+(v.idx+1)+' of '+S.order.length+'</span>'+
     '<span class="tag">'+esc(v.theme)+'</span>'+
     '<span class="tag">'+v.pts+' point'+(v.pts>1?"s":"")+'</span>'+
     (v.maxParts>1?'<span class="tag warn">'+v.maxParts+' correct elements &middot; partial credit</span>'
                  :'<span class="tag">single answer &middot; all or nothing</span>')+
     '</div>';
  if(S.skipped[v.i]&&!S.locked[v.i])h+='<span class="tag skip">&#9193; skipped</span>';
  if(S.locked[v.i])h+='<span class="tag '+(S.revising[v.i]?"warn":"ok")+'">'+(S.revising[v.i]?"&#9998; revising":"&#10003; checked")+'</span>';
  h+='</div>';
  h+='<div class="blk scen"><span class="lbl">Scenario</span><p style="margin:0">'+esc(ex.s)+'</p></div>';
  h+=blockArt(v);
  h+='<div class="blk qst"><span class="lbl">Question</span><p style="margin:0">'+esc(ex.q)+'</p></div>';
  h+='<div class="blk ans'+(lock?" locked":"")+'"><span class="lbl">'+esc(ex.instr)+'</span>'+renderAnswer(v)+'</div>';
  if(S.revising[v.i])h+='<div class="hintbox">You are revising an answer that was already checked. Old marks are hidden. Press <strong>Check</strong> to validate and lock the new answer again.</div>';
  h+='<div class="fb hide" id="fb-'+esc(v.i)+'" role="status" aria-live="polite"></div>';
  h+='<div class="hintbox hide" id="hb-'+esc(v.i)+'"></div>';
  h+='<div class="bar">';
  h+='<button class="btn p" id="btnCheck" type="button">Check</button>';
  if(S.locked[v.i])h+='<button class="btn q" id="btnRevise" type="button">'+(S.revising[v.i]?"Cancel revise":"Revise")+'</button>';
  else h+='<button class="btn" id="btnHint" type="button">Hint (&minus;10% of this question)</button>';
  h+='<button class="btn w" id="btnSkip" type="button">Skip &#9193;</button>';
  h+='<button class="btn q" id="btnPrev" type="button" '+(S.pos===0?"disabled":"")+'>&#8592; Previous</button>';
  h+='<button class="btn g" id="btnNext" type="button">'+(S.pos===S.order.length-1?"Finish &#10003;":"Next &#8594;")+'</button>';
  h+='<button class="btn" id="btnSubmit" type="button">Submit exam</button>';
  h+='</div>';
  h+='<div class="legend"><span class="tag ok">&#10003; answered</span><span class="tag acc">&#10003; checked</span><span class="tag skip">&#9193; skipped</span><span class="tag">current</span><span>Skipped exercises are removed from the final score.</span></div>';
  h+='<div class="qa">'+S.order.map(function(oi,pos){
    var vv=S.views.filter(function(x){return x.i===EX[oi].id;})[0];
    var st="none",mark="";
    if(S.skipped[vv.i]&&!S.locked[vv.i]){st="skip";mark="&#9193;";}
    else if(S.locked[vv.i]){st="checked";mark="&#10003;";}
    else if(answered(vv)){st="done";mark="&#9679;";}
    if(pos===S.pos)st+=" cur";
    return '<button class="qb" type="button" data-go="'+pos+'" data-st="'+st+'" aria-label="Go to exercise '+(pos+1)+'">'+(pos+1)+'<span class="mk">'+mark+'</span></button>';
  }).join("")+'</div>';
  h+='</section>';
  main.innerHTML=h;
  bind(v);
  if(S.locked[v.i]&&!S.revising[v.i])showFeedback(v);
  if(S.cv[v.i].hint)showHint(v);
  refreshHud();
}
function answered(v){
  var cv=S.cv[v.i];
  if(v.t==="MCQ"||v.t==="MS"||v.t==="DUAL")return Object.keys(cv.sel).some(function(k){return cv.sel[k];});
  if(v.t==="DND"||v.t==="CLASS"||v.t==="MATCH")return Object.keys(cv.pick).length>0;
  if(v.t==="ORD")return true;
  if(v.t==="INP"||v.t==="TERM")return cv.txt.some(function(t){return norm(t);});
  return false;
}
function bind(v){
  $$('[data-sel]',main).forEach(function(el){
    el.addEventListener("change",function(){
      S.cv[v.i].sel[el.getAttribute("data-sel")]=el.checked;refreshHud();
    });
  });
  $$('[data-txt]',main).forEach(function(el){
    el.addEventListener("input",function(){S.cv[v.i].txt[parseInt(el.getAttribute("data-txt"),10)]=el.value;});
  });
  $$('[data-match]',main).forEach(function(el){
    el.addEventListener("change",function(){S.cv[v.i].pick[el.getAttribute("data-match")]=el.value;refreshHud();});
  });
  $$('[data-mv]',main).forEach(function(el){
    el.addEventListener("click",function(){
      var p=parseInt(el.getAttribute("data-p"),10),dir=el.getAttribute("data-mv"),arr=S.cv[v.i].ord,q=(dir==="up")?p-1:p+1;
      if(q<0||q>=arr.length)return;
      var t=arr[p];arr[p]=arr[q];arr[q]=t;render();
    });
  });
  $$('[data-clear]',main).forEach(function(el){
    el.addEventListener("click",function(){delete S.cv[v.i].pick[el.getAttribute("data-clear")];render();});
  });
  /* drag and drop pool chips: click to arm, then click a slot (works with keyboard too) */
  $$('.chip[data-bank]',main).forEach(function(chip){
    var bi=parseInt(chip.getAttribute("data-bank"),10);
    chip.addEventListener("click",function(){
      if(armed===bi){armed=null;chip.setAttribute("aria-pressed","false");return;}
      armed=bi;
      $$('.chip[data-bank]',main).forEach(function(c){c.setAttribute("aria-pressed",c===chip?"true":"false");});
    });
    chip.addEventListener("dragstart",function(ev){
      armed=bi;
      try{ev.dataTransfer.setData("text/plain",String(bi));ev.dataTransfer.effectAllowed="move";}catch(e){}
    });
  });
  $$('.chip[data-cls]',main).forEach(function(chip){
    var bi=parseInt(chip.getAttribute("data-cls"),10);
    chip.addEventListener("click",function(){
      if(armedCls===bi){armedCls=null;chip.setAttribute("aria-pressed","false");return;}
      armedCls=bi;
      $$('.chip[data-cls]',main).forEach(function(c){c.setAttribute("aria-pressed",c===chip?"true":"false");});
    });
  });
  $$('[data-slot]',main).forEach(function(slot){
    var si=slot.getAttribute("data-slot");
    slot.addEventListener("click",function(){
      if(armed===null||!editing(v))return;
      S.cv[v.i].pick[si]=String(armed);render();
    });
    slot.addEventListener("keydown",function(ev){
      if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();slot.click();}
    });
    slot.addEventListener("dragover",function(ev){ev.preventDefault();slot.classList.add("over");});
    slot.addEventListener("dragleave",function(){slot.classList.remove("over");});
    slot.addEventListener("drop",function(ev){
      ev.preventDefault();slot.classList.remove("over");
      if(!editing(v))return;
      var b="";
      try{b=ev.dataTransfer.getData("text/plain");}catch(e){}
      if(b!==""){S.cv[v.i].pick[si]=b;render();}
    });
  });
  $$('[data-cat]',main).forEach(function(cat){
    var cid=cat.getAttribute("data-cat");
    cat.addEventListener("click",function(){
      if(armedCls===null||!editing(v))return;
      S.cv[v.i].pick["b"+armedCls]=cid;render();
    });
    cat.addEventListener("keydown",function(ev){
      if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();cat.click();}
    });
    cat.addEventListener("dragover",function(ev){ev.preventDefault();cat.classList.add("over");});
    cat.addEventListener("dragleave",function(){cat.classList.remove("over");});
    cat.addEventListener("drop",function(ev){
      ev.preventDefault();cat.classList.remove("over");
      if(!editing(v))return;
      var b="";
      try{b=ev.dataTransfer.getData("text/plain");}catch(e){}
      var n=parseInt(b,10);
      if(!isNaN(n)&&b!==""){S.cv[v.i].pick["b"+n]=cid;render();}
    });
  });
  /* log viewer filter */
  $$('[data-flt]',main).forEach(function(inp){
    inp.addEventListener("input",function(){
      var q=inp.value.toLowerCase();
      $$('#'+CSS.escape("pre-"+v.i)+' .logline',main).forEach(function(ln){
        ln.style.display=(q===""||ln.textContent.toLowerCase().indexOf(q)>=0)?"":"none";
      });
    });
  });
  $("#btnCheck").addEventListener("click",function(){
    S.revising[v.i]=false;S.locked[v.i]=true;delete S.skipped[v.i];
    S.checkPause=true;render();
  });
  var hintBtn=$("#btnHint");
  if(hintBtn)hintBtn.addEventListener("click",function(){useHint(v);});
  var revBtn=$("#btnRevise");
  if(revBtn)revBtn.addEventListener("click",function(){
    if(S.revising[v.i]){delete S.revising[v.i];}
    else{S.revising[v.i]=true;S.checkPause=true;}
    render();
  });
  $("#btnSkip").addEventListener("click",function(){
    if(S.locked[v.i]){S.checkPause=false;goto(S.pos+1);return;}
    S.skipped[v.i]=true;S.checkPause=false;goto(S.pos+1);
  });
  $("#btnPrev").addEventListener("click",function(){S.checkPause=false;goto(S.pos-1);});
  $("#btnNext").addEventListener("click",function(){
    S.checkPause=false;
    if(S.pos===S.order.length-1)submit();else goto(S.pos+1);
  });
  $("#btnSubmit").addEventListener("click",function(){submit();});
  $$('[data-go]',main).forEach(function(b){
    b.addEventListener("click",function(){goto(parseInt(b.getAttribute("data-go"),10));});
  });
}
var goto=function(p){if(p<0||p>=S.order.length)return;S.pos=p;render();};

function showFeedback(v){
  var fb=$("#fb-"+v.i);if(!fb)return;
  var sc=itemScores(v),ex=v.ex;
  var cls=(sc.correct===v.parts.length)?"good":(sc.correct>0?"part":"bad");
  var head=(sc.correct===v.parts.length)?"Correct — full points":(sc.correct>0?"Partly correct":"Not correct yet");
  var h='<h3>'+head+' &middot; <span class="pts">'+sc.earned.toFixed(1)+' / '+sc.max+' points</span></h3>';
  h+='<div class="row"><span class="tag '+(sc.correct===v.parts.length?"ok":"warn")+'">'+sc.correct+' of '+v.parts.length+' correct elements</span>';
  if(S.cv[v.i].hint)h+='<span class="tag warn">hint used: &minus;'+(v.pts*0.1).toFixed(1)+' point</span>';
  h+='</div>';
  h+='<div class="exp"><strong>Why:</strong> '+esc(ex.why)+'</div>';
  if(v.maxParts>1){
    h+='<div class="exp"><strong>Element by element:</strong><ul>'+v.parts.map(function(p){
      var icon=p.ok()?"&#10003; correct":"&#10007; wrong";
      return '<li>'+icon+' &mdash; '+esc(p.label)+(p.ok()?"":' <em>('+esc(p.detail)+')</em>')+'</li>';
    }).join("")+'</ul></div>';
  }
  if(sc.correct<v.parts.length)h+='<div class="exp"><strong>Focus on:</strong> '+esc(ex.h)+'</div>';
  fb.className="fb "+cls;fb.innerHTML=h;
}
function useHint(v){
  if(S.locked[v.i]&&!S.revising[v.i])return;
  S.cv[v.i].hint=true;showHint(v);refreshHud();
}
function showHint(v){
  var hb=$("#hb-"+v.i);if(!hb)return;
  hb.className="hintbox";
  hb.innerHTML='<strong>Hint (&minus;10% of this question):</strong> '+esc(v.ex.h)+
    '<div class="note">A hint costs 10% of this question\'s points if you score on it. The timer keeps running.</div>';
}

/* ---------- finish ---------- */
function finish(auto){
  if(S.finished)return;
  var t=totals();
  if(t.answered===0&&!auto){alert("You skipped every exercise. Answer at least one before submitting.");return;}
  S.finished=true;
  if(S.tick)clearInterval(S.tick);
  S.checkPause=false;S.manual=false;S.results=t;
  showResults(auto);
}
function submit(){finish(false);}
function showResults(auto){
  var t=S.results,pass=t.pct>=PASS;
  var h='<section class="card">';
  h+='<h1>Final results — Chapter 1.4 Cryptographic Solutions (MEDIUM)</h1>';
  if(auto)h+='<p class="note">Time ran out, so the exam was submitted automatically.</p>';
  h+='<div class="'+(pass?"cert":"failbox")+'"><h2>'+(pass?"PASS":"FAIL")+'</h2>';
  h+='<div class="big">'+t.pct+'%</div>';
  h+='<p>'+(pass?"You reached the pass mark. Well done.":"You did not reach the pass mark of "+PASS+"%. Retake the exam when you are ready.")+'</p>';
  h+='<p class="note">Points scored '+t.earned.toFixed(1)+' of '+t.max+' possible, over '+t.answered+' counted exercise'+(t.answered===1?"":"s")+'. Pass mark '+PASS+'%.</p>';
  if(t.denied>0)h+='<p class="note">Hint cost applied: &minus;'+t.denied.toFixed(1)+' point in total.</p>';
  h+='</div>';
  h+='<div class="row" style="margin-top:12px"><button class="btn p" id="btnAgain" type="button">Retake Exam</button>'+
     '<button class="btn" id="btnReview" type="button">Open detailed report</button></div><div id="report"></div></section>';
  main.innerHTML=h;
  $("#btnAgain").addEventListener("click",function(){begin();});
  $("#btnReview").addEventListener("click",function(){
    var r=document.getElementById("report");if(r)r.scrollIntoView({block:"start"});
  });
  buildReport();
  reportScore(Math.round(t.earned),Math.round(t.max));
  window.scrollTo(0,0);
}
function reportScore(score,total){
  var percent=total>0?Math.round((score/total)*100):0;
  try{
    parent.postMessage({
      type:"CYBERPULSE_SCORE",
      topicId:META.topicId,
      score:score,
      total:total,
      percent:percent,
      passed:percent>=PASS
    },location.origin);
  }catch(e){}
}
function buildReport(){
  var h='<h2 style="margin-top:16px">Detailed report</h2>';
  if(S.results.skipped.length){
    h+='<div class="fb part"><h3>Skipped exercises &mdash; excluded from scoring</h3><div class="miss-list">'+
      S.results.skipped.map(function(n){return '<span class="tag skip">Exercise '+n+'</span>';}).join("")+
      '</div><p class="note">These exercises were skipped and never checked, so they are removed from both the points you earned and the points possible. They still appear below with their explanations so you can learn from them.</p></div>';
  } else {
    h+='<p class="note">No exercise was skipped, so every exercise counted towards the score.</p>';
  }
  h+='<table><thead><tr><th>#</th><th>Theme</th><th>Type</th><th>Your answer</th><th>Correct answer</th><th class="num">Points</th><th>Result</th></tr></thead><tbody>';
  S.views.forEach(function(v){
    var sc=itemScores(v),skipped=S.results.skipped.indexOf(v.idx+1)>=0;
    var label=skipped?"skipped":sc.label;
    var cls=skipped?"skip":(sc.label==="full"?"ok":(sc.label==="partial"?"warn":"bad"));
    h+='<tr><td class="num">'+(v.idx+1)+'</td><td>'+esc(v.theme)+'</td><td>'+esc(v.t)+'</td>'+
       '<td>'+give(v)+'</td><td>'+want(v)+'</td>'+
       '<td class="num">'+(skipped?"not counted":sc.earned.toFixed(1)+" / "+v.pts)+'</td>'+
       '<td><span class="tag '+cls+'">'+label+'</span></td></tr>';
  });
  h+='</tbody></table><h2 style="margin-top:16px">Explanations</h2>';
  S.views.forEach(function(v){
    var sc=itemScores(v),skipped=S.results.skipped.indexOf(v.idx+1)>=0;
    h+='<div class="card"><h3>Exercise '+(v.idx+1)+' &mdash; '+esc(v.theme)+' '+
       (skipped?'<span class="tag skip">skipped</span>'
               :'<span class="tag '+(sc.label==="full"?"ok":(sc.label==="partial"?"warn":"bad"))+'">'+sc.label+' '+sc.earned.toFixed(1)+' / '+v.pts+'</span>')+'</h3>';
    h+='<p style="margin:4px 0"><strong>Scenario:</strong> '+esc(v.ex.s)+'</p>';
    h+='<p style="margin:4px 0"><strong>Question:</strong> '+esc(v.ex.q)+'</p>';
    h+='<p style="margin:4px 0"><strong>Correct:</strong> '+want(v)+'</p>';
    h+='<p style="margin:4px 0"><strong>Why:</strong> '+esc(v.ex.why)+'</p>';
    if(sc.correct<v.parts.length)h+='<p style="margin:4px 0"><strong>Focus on:</strong> '+esc(v.ex.h)+'</p>';
    h+='</div>';
  });
  var r=$("#report");if(r)r.innerHTML=h;
}
function give(v){
  var cv=S.cv[v.i],ex=v.ex;
  if(ex.t==="MCQ"||ex.t==="MS"){
    var p=v.order.map(function(o,pos){return cv.sel["c"+o]?LETTERS[pos]:null;}).filter(Boolean);
    return p.length?esc(p.join(", ")):'<span class="tag">no answer</span>';
  }
  if(ex.t==="DUAL"){
    return v.groups.map(function(g,gi){
      var p=g.opts.map(function(_,oi){return cv.sel["g"+gi+"_"+oi]?LETTERS[oi]:null;}).filter(Boolean);
      return esc(g.l.split(":")[0])+": "+(p.length?p.join(", "):"none");
    }).join(" | ");
  }
  if(ex.t==="DND")return esc(v.slots.map(function(sl,si){
    var pk=cv.pick[si];
    return (pk!==undefined&&pk!=="")?v.bank[parseInt(pk,10)].text:"(empty)";
  }).join(" | "));
  if(ex.t==="CLASS")return esc(v.bank.map(function(b){return cv.pick["b"+b.idx]?b.text:"(not assigned)";}).join(" | "));
  if(ex.t==="MATCH")return esc(v.rows.map(function(row,ri){
    return cv.pick["r"+(ri+1)]?optText(v,cv.pick["r"+(ri+1)]):"(empty)";
  }).join(" | "));
  if(ex.t==="ORD")return esc(cv.ord.map(function(i){return (i+1);}).join(" > "));
  return esc((v.terms||v.fields).map(function(_,i){return cv.txt[i]||"(empty)";}).join(" | "));
}
function want(v){
  var ex=v.ex;
  if(ex.t==="MCQ"||ex.t==="MS")return esc((ex.k||[]).map(function(l){return LETTERS[v.order.indexOf(l.charCodeAt(0)-97)];}).join(", "));
  if(ex.t==="DUAL")return esc(v.groups.map(function(g){
    return g.l.split(":")[0]+": "+(g.k||[]).map(function(l){return LETTERS[l.charCodeAt(0)-97];}).join(", ");
  }).join(" | "));
  if(ex.t==="DND")return esc(v.slots.map(function(sl){return sl.a;}).join(" | "));
  if(ex.t==="CLASS")return esc(v.bank.map(function(b){
    return b.text+" = "+((v.cats.filter(function(c){return c.id===b.c;})[0]||{}).l||"");
  }).join(" | "));
  if(ex.t==="MATCH")return esc(v.rows.map(function(row,ri){return row.l+" = "+optText(v,ex.ans["r"+(ri+1)]);}).join(" | "));
  if(ex.t==="ORD")return esc(v.items.join(" > "));
  return esc((v.terms||v.fields).map(function(f){return f.disp;}).join(" | "));
}

/* ---------- screens ---------- */
function kwPanel(){
  var map={};
  EX.forEach(function(ex){var k=ex.theme||"General";map[k]=map[k]||[];map[k].push(ex.id);});
  var h='<div class="card intro"><h1>Cryptographic solutions &mdash; keywords covered</h1>'+
    '<p class="note">Every keyword from CompTIA Security+ chapter 1.4 is exercised in this file. The same keyword families appear again in the HARD file, but through completely different scenarios and artefacts.</p><div class="kw">';
  Object.keys(map).forEach(function(k){
    h+='<div><h3>'+esc(k)+'</h3><p>'+map[k].length+' exercise'+(map[k].length===1?"":"s")+' in this file</p></div>';
  });
  h+='</div></div>';
  return h;
}
function begin(){
  S.views=[];prepare();newState();
  S.finished=false;
  main.innerHTML='<section class="card">'+
   '<h1>CompTIA Security+ &mdash; Chapter 1.4 Cryptographic Solutions</h1>'+
   '<p><span class="tag sev-med">MEDIUM severity</span> <span class="tag acc">'+META.questionCount+' exercises</span> '+
   '<span class="tag">'+TOTMETA+' minutes</span> <span class="tag ok">pass mark '+PASS+'%</span> <span class="tag">'+esc(META.topicId)+'</span></p>'+
   '<h2>What this exam is</h2>'+
   '<p>A practical, scenario-based exam on cryptographic solutions: PKI, encryption, hashing, digital signatures, obfuscation and blockchain. The exercises look like real work: a design review, a TLS handshake report, a key-management policy, a SOC evidence review and a certificate chain check. Questions and answer choices are shuffled on every attempt.</p>'+
   '<h2>How to answer</h2>'+
   '<ul>'+
   '<li><strong>Check</strong> validates your answer, marks every element and pauses the timer in <em>review mode</em>. The exercise and the explanation stay visible so you can study them. The clock starts again only when you press <strong>Next</strong>.</li>'+
   '<li><strong>Revise</strong> appears after a Check. It unlocks the answer so you can change it, and your next Check validates and locks it again.</li>'+
   '<li><strong>Skip</strong> moves on and marks the exercise as skipped. You can return to it later while time remains. Skipped exercises are removed from the score: the final percentage is earned points divided by the points of the exercises you did not skip.</li>'+
   '<li><strong>Pause</strong> is different from review mode: it blurs and hides the exercise so you cannot work while the clock is frozen. If both pauses are active, the timer resumes only when both are cleared.</li>'+
   '<li><strong>Hint</strong> shows a nudge and costs 10% of that question\'s points. It never pauses the timer.</li>'+
   '<li>Multi-answer exercises give <strong>partial credit for each correct element</strong>. A wrong element never subtracts points; it simply earns none.</li>'+
   '<li>Every indicator in this exam is defanged, for example hxxp:// and 10[.]0[.]0[.]1.</li>'+
   '</ul>'+
   '<div class="row" style="margin-top:12px"><button class="btn p" id="btnStart" type="button">Start exam</button></div>'+
   '</section>'+kwPanel();
  $("#btnStart").addEventListener("click",function(){
    S.tLeft=TOTMETA*60;startTimer();render();
  });
}

/* ---------- controls ---------- */
btnPause.addEventListener("click",function(){
  if(!S||S.finished)return;
  S.manual=!S.manual;
  main.classList.toggle("blurred",S.manual);
  main.setAttribute("aria-hidden",S.manual?"true":"false");
  refreshHud();
});
document.addEventListener("keydown",function(ev){
  if(!S||S.finished)return;
  var tag=ev.target.tagName;
  if(tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA")return;
  if(ev.key==="ArrowRight"&&S.pos<S.order.length-1){goto(S.pos+1);}
  if(ev.key==="ArrowLeft"&&S.pos>0){goto(S.pos-1);}
});
window.addEventListener("message",function(event){
  if(!event.data)return;
  if(event.data.type!=="CYBERPULSE_INIT"&&event.data.type!=="CYBERMASTERY_INIT")return;
  var d=event.data;
  USER.name=d.username||"";USER.country=d.country||"ZZ";USER.theme=d.theme||"dark";
  if(USER.name){var t=$("#hdTitle");if(t)t.textContent="Security+ · 1.4 · MEDIUM · "+USER.name;}
  document.body.setAttribute("data-theme",USER.theme);
});
begin();
})();
</script>
