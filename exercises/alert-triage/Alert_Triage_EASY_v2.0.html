<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Alert Triage - EASY certification exam</title>
<style>

:root{
  --bg:#070d18; --bg2:#0c1526; --panel:#101c31; --panel2:#15234033;
  --line:#22334f; --line2:#2c4266;
  --txt:#e6eefc; --muted:#93a7c4; --dim:#6d80a0;
  --acc:#38bdf8; --acc2:#a78bfa;
  --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; --skip:#eab308;
  --easy:#22c55e; --med:#38bdf8; --hard:#f59e0b; --xh:#ef4444;
  --mono:"Cascadia Mono","Consolas","SFMono-Regular","Menlo",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 12% -10%,#12294a 0%,transparent 60%),
    radial-gradient(900px 500px at 105% 0%,#2a1b4d 0%,transparent 55%),
    var(--bg);
  color:var(--txt);
  font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.5; min-height:100vh;
}
h1,h2,h3,h4{margin:0 0 .5rem 0;line-height:1.25}
h1{font-size:1.5rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:.45rem 0}
a{color:var(--acc)}
.small{font-size:.85rem}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)} .acc{color:var(--acc)}
code,kbd{font-family:var(--mono);font-size:.86em;background:#0a1424;border:1px solid var(--line);
  border-radius:6px;padding:.08rem .35rem;color:#bde3ff}
hr{border:0;border-top:1px solid var(--line);margin:1rem 0}

/* ---------- top bar ---------- */
#topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,#0b1424f2,#0b1424d0);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px);
  padding:.6rem 1rem;
}
.tbrow{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;
  max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:.6rem;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04101f;
  display:grid;place-items:center;font-weight:800;font-size:.95rem}
.brand .tt{font-weight:700;font-size:.98rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .st{font-size:.76rem;color:var(--muted)}
.hud{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.pill{border:1px solid var(--line2);background:#0d1a2e;border-radius:999px;
  padding:.25rem .7rem;font-size:.85rem;display:flex;align-items:center;gap:.4rem}
.pill b{font-variant-numeric:tabular-nums}
.pill.timer.low{border-color:var(--bad);color:#ffd7d7;animation:pulse 1.2s infinite}
.pill.timer.warn{border-color:var(--warn);color:#ffe9c2}
.pill.bump{animation:bump .45s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14);border-color:var(--acc)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.sev{display:inline-flex;align-items:center;gap:.32rem;font-size:.68rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;border-radius:999px;padding:.1rem .5rem;border:1px solid currentColor;
  background:#0b1525;white-space:nowrap;vertical-align:middle}
.sev::before{content:"";width:.4rem;height:.4rem;border-radius:50%;background:currentColor;flex:0 0 auto}
.sev.easy{color:var(--easy)} .sev.medium{color:var(--med)}
.sev.hard{color:var(--hard)} .sev.xhard{color:var(--xh)}
.progwrap{height:8px;background:#0a1526;border:1px solid var(--line);border-radius:999px;overflow:hidden;
  max-width:1280px;margin:.55rem auto 0}
#hudProg{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .45s ease}

/* ---------- layout ---------- */
main{max-width:1280px;margin:1.1rem auto 4rem;padding:0 1rem}
.card{background:linear-gradient(180deg,var(--panel),#0d1728);border:1px solid var(--line);
  border-radius:16px;padding:1.1rem 1.2rem;box-shadow:0 10px 30px #0008}
.card + .card{margin-top:1rem}
.exam-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:1rem;align-items:start}
@media (max-width:960px){.exam-grid{grid-template-columns:1fr}.side{order:2}}
.qcard{min-width:0}
.side{position:sticky;top:96px}
@media (max-width:960px){.side{position:static}}

/* ---------- intro ---------- */
.eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:.92rem;margin:.15rem 0 .7rem;max-width:80ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.6rem;margin-top:.9rem}
.tile{border:1px solid var(--line);background:#0b1525;border-radius:12px;padding:.55rem .75rem}
.tile .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tile .v{font-size:1.05rem;font-weight:700;margin-top:.2rem;font-variant-numeric:tabular-nums}
.btn.lg{padding:.65rem 1.25rem;font-size:1rem}
.legendline{display:flex;align-items:center;gap:.45rem;font-size:.85rem;color:var(--muted);margin:.15rem 0 .8rem}
.legendline .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--acc);flex:0 0 auto}
.hero{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:flex-start}
.hero .kw{font-size:1.9rem;font-weight:800;line-height:1.15}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.9rem}
.box{border:1px solid var(--line);background:#0c1729;border-radius:12px;padding:.85rem .95rem}
.box h4{color:var(--acc);font-size:.95rem;text-transform:uppercase;letter-spacing:.05em}
ul.tight{margin:.35rem 0 .2rem 1.1rem;padding:0}
ul.tight li{margin:.2rem 0}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.8rem}
.theme{border:1px solid var(--line);border-radius:12px;padding:.7rem .85rem;background:#0b1525}
.theme.used{border-color:#31527a;background:#0c1a2c;box-shadow:inset 3px 0 0 var(--acc)}
.theme h4{display:flex;align-items:center;gap:.45rem}
.theme .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--acc);flex:0 0 auto}
.theme h4{font-size:.88rem;color:var(--acc2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.35rem}
.tags{display:flex;flex-wrap:wrap;gap:.3rem}
.tag{font-size:.76rem;border:1px solid var(--line2);background:#101f36;border-radius:999px;padding:.12rem .5rem;color:#cfe2ff}
.tag.strong{border-color:var(--acc);color:#d8f2ff}

/* ---------- buttons ---------- */
.btn{font:inherit;font-size:.92rem;cursor:pointer;border-radius:10px;padding:.5rem .95rem;
  border:1px solid var(--line2);background:#132340;color:var(--txt);transition:.15s}
.btn:hover{background:#1a2f52;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--acc),#2563eb);color:#04101f;font-weight:700;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.warn{border-color:#7c5a10;color:#ffe1a8;background:#2a2008}
.btn.bad{border-color:#7f1d1d;background:#2a0f12;color:#ffc9c9}
.btn.small{font-size:.82rem;padding:.3rem .6rem}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.qactions{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1rem}

/* ---------- question ---------- */
.qmeta{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin-bottom:.6rem}
.badge{font-size:.75rem;border-radius:999px;padding:.16rem .6rem;border:1px solid var(--line2);color:#cfe2ff;background:#101f36}
.badge.theme{border-color:var(--acc2);color:#e3d9ff}
.badge.type{border-color:#3f6f5a;color:#c8ffe4}
.brief{font-family:var(--mono);font-size:.8rem;color:#9fd0ff;border-left:3px solid var(--acc);
  padding:.25rem .6rem;background:#0a1a2c;border-radius:0 8px 8px 0;margin-bottom:.6rem}
.qtitle{font-size:1.18rem;font-weight:700}
.scenario{background:#0a1322;border:1px solid var(--line);border-radius:12px;padding:.8rem .95rem;margin:.7rem 0}
.scenario p{margin:.4rem 0}
.promptline{font-weight:600;margin:.7rem 0 .5rem}

/* ---------- artifacts ---------- */
.artifact{border:1px solid var(--line2);border-radius:12px;overflow:hidden;margin:.7rem 0;background:#08111f}
.artifact .ahead{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:space-between;align-items:center;
  background:#0e1c31;padding:.45rem .7rem;border-bottom:1px solid var(--line);font-size:.85rem}
.artifact .ahead .aname{font-family:var(--mono);color:#bfe4ff}
.artifact .abody{padding:.6rem .7rem;font-family:var(--mono);font-size:.82rem;overflow-x:auto}
.logline{white-space:pre-wrap;word-break:break-word;padding:.1rem .25rem;border-left:3px solid transparent}
.logline .lv{display:inline-block;min-width:4.4em;font-weight:700}
.lv-ERR,.lv-CRIT{color:#ff9b9b} .logline.lvline-ERR,.logline.lvline-CRIT{border-left-color:var(--bad);background:#2a0f1210}
.lv-WARN{color:#ffd08a} .logline.lvline-WARN{border-left-color:var(--warn);background:#2a200810}
.lv-INFO{color:#9fd0ff}
.lv-OK{color:#9cf0bd} .logline.lvline-OK{border-left-color:var(--ok);background:#0e2a1a10}
.logline:hover{background:#12233c}
.logfilter{width:100%;margin:0 0 .5rem 0;padding:.35rem .55rem;background:#0a1526;border:1px solid var(--line2);
  border-radius:8px;color:var(--txt);font-family:var(--mono);font-size:.82rem}
.docbody{padding:.75rem .9rem;font-size:.88rem;white-space:pre-wrap;font-family:"Segoe UI",Roboto,sans-serif}
.docbody .h{color:var(--acc);font-weight:700}
.docbody em{color:var(--warn);font-style:normal}
table.art{width:100%;border-collapse:collapse;font-size:.84rem}
table.art th,table.art td{border:1px solid var(--line);padding:.35rem .5rem;text-align:left;vertical-align:top}
table.art th{background:#0e1c31;color:#bfe4ff;font-weight:600}
table.art tr:nth-child(even) td{background:#0b1524}
.emailbody{padding:.75rem .9rem;font-size:.88rem}
.emailbody .subj{color:var(--warn);font-weight:600;margin-bottom:.3rem}

/* ---------- options ---------- */
.opts{display:grid;gap:.5rem;margin:.5rem 0}
.opt{display:flex;gap:.6rem;align-items:flex-start;border:1px solid var(--line);background:#0c1729;
  border-radius:10px;padding:.55rem .7rem;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--acc);background:#102138}
.opt input{margin-top:.25rem;accent-color:var(--acc)}
.opt .mk{min-width:1.1em;font-weight:800}
.opt.ok{border-color:var(--ok);background:#0d2a1a}
.opt.bad{border-color:var(--bad);background:#2a0f12}
.opt.chosen{box-shadow:inset 0 0 0 1px #ffffff22}
.opts.locked .opt{cursor:default}

/* ---------- sorting / order / rank ---------- */
.sortlist{list-style:none;margin:.5rem 0;padding:0;display:grid;gap:.45rem}
.sortlist li{display:flex;gap:.55rem;align-items:center;border:1px solid var(--line);background:#0c1729;
  border-radius:10px;padding:.5rem .65rem;cursor:grab}
.sortlist li.dragging{opacity:.4}
.sortlist li.over{border-color:var(--acc);background:#102138}
.sortlist .grip{color:var(--dim);cursor:grab}
.sortlist .txt{flex:1;min-width:0}
.sortlist .mv{display:flex;flex-direction:column;gap:.1rem}
.sortlist .mv button{font-size:.62rem;line-height:1;padding:.15rem .3rem;border-radius:6px;border:1px solid var(--line2);
  background:#132340;color:var(--txt);cursor:pointer}
.ranklabel{font-family:var(--mono);font-size:.75rem;color:var(--dim);text-align:center;min-width:1.6em}
.rank .sortlist li{border-left:3px solid var(--acc)}

/* ---------- buckets / classify ---------- */
.bank{display:flex;flex-wrap:wrap;gap:.4rem;border:1px dashed var(--line2);border-radius:12px;
  padding:.55rem;min-height:52px;background:#0a1424}
.chip{border:1px solid var(--line2);background:#132340;border-radius:999px;padding:.32rem .7rem;font-size:.86rem;
  cursor:grab;user-select:none;transition:.15s}
.chip:hover{border-color:var(--acc)}
.chip.sel{border-color:var(--acc);background:#1b3557;box-shadow:0 0 0 2px #38bdf855}
.chip.placed{background:#16283f}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.65rem;margin-top:.7rem}
.bucket{border:1px solid var(--line2);border-radius:12px;background:#0b1525;padding:.5rem}
.bucket h4{font-size:.86rem;color:var(--acc2);margin-bottom:.4rem}
.bucket .drop{display:flex;flex-wrap:wrap;gap:.35rem;min-height:48px;border-radius:8px;padding:.25rem}
.bucket.hot .drop{background:#12233c;outline:1px dashed var(--acc)}
.bucket.ok{border-color:var(--ok)} .bucket.bad{border-color:var(--bad)}

/* ---------- fill in the blank ---------- */
.filltext{font-size:1.02rem;background:#0a1322;border:1px solid var(--line);border-radius:12px;padding:.85rem .95rem}
.slot{display:inline-block;min-width:110px;text-align:center;border-bottom:2px dashed var(--acc);
  padding:.1rem .45rem;margin:.1rem .15rem;border-radius:6px;cursor:pointer;color:#bde3ff;font-weight:600}
.slot.empty{color:var(--dim);font-weight:400}
.slot:hover{background:#12233c}
.slot.filled{border-bottom-style:solid}
.blankok{border-bottom-color:var(--ok)!important;color:#b9f6ce}
.blankbad{border-bottom-color:var(--bad)!important;color:#ffc2c2;text-decoration:line-through}

/* ---------- matching ---------- */
table.match{width:100%;border-collapse:collapse;font-size:.88rem;margin:.5rem 0}
table.match td{border-bottom:1px solid var(--line);padding:.45rem .5rem;vertical-align:middle}
table.match td.l{width:46%}
table.match select{width:100%;padding:.35rem .45rem;background:#0a1526;color:var(--txt);
  border:1px solid var(--line2);border-radius:8px;font:inherit;font-size:.86rem}
table.match tr.ok td{border-bottom-color:var(--ok)} table.match tr.bad td{border-bottom-color:var(--bad)}

/* ---------- terminal ---------- */
.term{background:#05090f;border:1px solid #1d3350;border-radius:12px;overflow:hidden;margin:.6rem 0}
.term .tbar{background:#0c1729;padding:.35rem .6rem;font-size:.78rem;color:var(--muted);display:flex;
  justify-content:space-between;border-bottom:1px solid #1d3350}
.term-out{padding:.6rem .7rem;font-family:var(--mono);font-size:.83rem;max-height:320px;overflow:auto;white-space:pre-wrap}
.term-out .tl{color:#dbe9ff} .term-out .tp{color:#67e8f9}
.term-out .to{color:#9fb4d0;padding-left:.2rem} .term-out .okout{color:#9cf0bd} .term-out .errout{color:#ff9b9b}
.term-goal{padding:.45rem .7rem;background:#0b1525;border-top:1px solid #1d3350;font-size:.84rem}
.term-line{display:flex;gap:.5rem;align-items:center;padding:.5rem .7rem;border-top:1px solid #1d3350;background:#070d18}
.term-line input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#dbe9ff;font-family:var(--mono);font-size:.86rem}
.term-line .ps1{color:#67e8f9;font-family:var(--mono);font-size:.83rem;white-space:nowrap}

/* ---------- branch ---------- */
.branchnode{border:1px solid var(--line2);border-radius:12px;padding:.8rem .95rem;background:#0b1525;margin:.5rem 0}
.bnum{font-size:.78rem;color:var(--acc);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.35rem}
.bopts{display:grid;gap:.45rem;margin-top:.6rem}
.bopt{text-align:left;font:inherit;font-size:.9rem;cursor:pointer;border:1px solid var(--line2);
  background:#101d33;color:var(--txt);border-radius:10px;padding:.55rem .7rem}
.bopt:hover{border-color:var(--acc);background:#152a48}
.bopt.dead{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.bfb{margin-top:.6rem;border-radius:10px;padding:.55rem .7rem;font-size:.88rem;display:none}
.bfb.okfb{display:block;background:#0d2a1a;border:1px solid var(--ok)}
.bfb.badfb{display:block;background:#2a0f12;border:1px solid var(--bad)}

/* ---------- feedback / locked ---------- */
.locked{margin-top:.8rem;border-radius:12px;padding:.85rem .95rem;border:1px solid var(--line2);background:#0c1729}
.locked.good{border-color:var(--ok);background:linear-gradient(180deg,#0d2a1a,#0b1525)}
.locked.bad{border-color:var(--bad);background:linear-gradient(180deg,#2a0f12,#0b1525)}
.locked h3{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.exp{margin:.5rem 0}
.ansline{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.6rem;margin-top:.6rem}
.ansline > div{border:1px solid var(--line);border-radius:10px;padding:.5rem .65rem;background:#0a1424;font-size:.86rem}
.lbl{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.25rem}
.tip{margin-top:.7rem;border-left:3px solid var(--warn);background:#2a2008;border-radius:0 10px 10px 0;padding:.5rem .7rem;font-size:.88rem}
.hintbox{margin-top:.7rem;border-left:3px solid var(--acc2);background:#1a1233;border-radius:0 10px 10px 0;padding:.55rem .7rem;font-size:.88rem}
.flash{margin-top:.6rem;color:#ffd08a;font-size:.88rem}
.ansSummary table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.4rem}
.ansSummary th,.ansSummary td{border:1px solid var(--line);padding:.3rem .5rem;text-align:left}
.ansSummary th{background:#0e1c31;color:#bfe4ff}

/* ---------- side panel ---------- */
.side .chips{display:flex;flex-wrap:wrap;gap:.3rem;margin:.4rem 0 .7rem}
.chipbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:#101d33;color:var(--txt);
  font:inherit;font-size:.85rem;cursor:pointer}
.chipbtn.cur{outline:2px solid var(--acc);outline-offset:1px}
.chipbtn.good{background:#0d3320;border-color:var(--ok)}
.chipbtn.bad{background:#33121a;border-color:var(--bad)}
.chipbtn.skip{background:#33280a;border-color:var(--skip)}
.legend{display:grid;gap:.25rem;font-size:.8rem;color:var(--muted);margin-bottom:.7rem}
.legend span i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.4rem}

/* ---------- review skipped ---------- */
.skipList{list-style:none;padding:0;margin:.6rem 0;display:grid;gap:.5rem}
.skipList li{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;align-items:center;
  border:1px solid var(--line);border-left:4px solid var(--skip);background:#1a1508;border-radius:10px;padding:.6rem .8rem}

/* ---------- results ---------- */
.resulthead{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:center}
.bigscore{font-size:3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.cert{border:2px solid var(--acc);border-radius:16px;padding:1.1rem 1.3rem;margin-top:1rem;
  background:linear-gradient(135deg,#0b1f36,#141033);text-align:center}
.cert .ct{font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.cert .cn{font-size:1.5rem;font-weight:800;margin:.3rem 0}
.cert .cs{font-size:1rem;color:#cfe2ff}
.bars{display:grid;gap:.5rem;margin-top:.6rem}
.bar{display:grid;grid-template-columns:200px 1fr 90px;gap:.6rem;align-items:center;font-size:.85rem}
@media (max-width:640px){.bar{grid-template-columns:130px 1fr 70px}}
.bar .track{height:10px;background:#0a1526;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));width:0;transition:width .5s}
.report{display:grid;gap:.8rem;margin-top:.7rem}
.rep{border:1px solid var(--line);border-radius:12px;padding:.75rem .9rem;background:#0b1525}
.rep.good{border-left:4px solid var(--ok)} .rep.bad{border-left:4px solid var(--bad)} .rep.na{border-left:4px solid var(--skip)}
.rep .rhead{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:space-between;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin-top:.8rem}
.stat{border:1px solid var(--line);border-radius:12px;padding:.6rem .75rem;background:#0b1525}
.stat .n{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat .k{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* ---------- pause overlay ---------- */
body.paused #stage{filter:blur(14px);pointer-events:none;user-select:none}
.pauseov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;
  background:#050a12cc;backdrop-filter:blur(3px);padding:1rem}
.pausepanel{max-width:520px;border:1px solid var(--acc);border-radius:16px;background:#0b1525;padding:1.2rem 1.3rem;text-align:center}

footer{max-width:1280px;margin:0 auto;padding:0 1rem 2rem;color:var(--dim);font-size:.8rem}

/* ---------- alert queue (triage type) ---------- */
.triage{display:grid;gap:.7rem;margin:.6rem 0}

var EXERCISES = [{"id": "EASY-01", "type": "triage", "theme": "Triage Core & Workflow", "concepts": ["alert queue and worklist", "alert validation before escalation", "severity levels SEV1-SEV4 and priority vs severity"], "title": "The 06:00 queue at a retail bank", "brief": "Shift A 06:00-14:00 · L1 worklist · 3 open alerts", "scenario": "<p>You start the early shift in the SOC of a retail bank. Three alerts are waiting in the L1 worklist. Your SOP is the same for every alert:</p><ul><li>Open the alert and read the raw evidence in the console that sent it.</li><li>Compare the evidence with a second source: a log, the CMDB asset list, or the user.</li><li>Then either escalate the ticket to L2 or close it with a short note.</li></ul><p>Never close an alert you have not opened. The 06:00 handover says the branch network is quiet and the card platform is stable.</p>", "prompt": "Choose one action for each alert in the queue.", "queueName": "L1 worklist - shift A 06:00-14:00 (retail bank SOC)", "alerts": [{"id": "INC-4417", "sev": "MEDIUM", "src": "EMAIL GATEWAY", "title": "User forwards an unpaid invoice mail", "detail": "07:12 user m.okafor, branch 214, forwards a mail from billing@supply-portal[.]example. The mail has a button with the defanged link hxxps://portal-verify[.]example/login. The gateway log shows three recipients. The user wrote: I did not click.", "actions": ["Close it as a false positive because the user never clicked the link.", "Delete the mail and tell the user to watch for more invoice mails.", "Check the gateway log for other receivers, then escalate it to L2."], "answer": 2, "outcome": "The gateway log shows three recipients and the same unknown link, so this is a real phishing campaign. L2 blocks the link and adds the domain to the block list."}, {"id": "INC-4418", "sev": "LOW", "src": "IDENTITY LOG", "title": "Failed sign-in burst for a backup account", "detail": "07:26 twelve failed sign-ins for svc-backup from 10[.]0[.]42[.]19, then one success. The CMDB says 10[.]0[.]42[.]19 is the internal vulnerability scanner, asset VULN-SCAN-01.", "actions": ["Block the source address at the firewall and reset the service password.", "Escalate to L2 as a brute-force attack on a service account.", "Check the identity log to confirm the scanner, then close the ticket."], "answer": 2, "outcome": "The identity log confirms the scanner account with an old password list. You close the alert as a known internal scanner and ask the vulnerability team to update its scan account."}, {"id": "INC-4419", "sev": "HIGH", "src": "EDR", "title": "Encoded PowerShell started by Word on a finance laptop", "detail": "07:41 fin-ws-14, user j.tan. winword.exe started powershell.exe with an encoded command. No network connection seen yet. Rule EDR-SUSP-014 fired once.", "actions": ["Wait for the user to call the help desk before touching the laptop.", "Close it because the antivirus did not block the script, so it is clean.", "Open the process tree in the EDR console and escalate it to L2."], "answer": 2, "outcome": "The process tree shows an encoded command that wrote a file in the temp folder. L2 isolates the laptop and finds the same file on two other finance hosts."}], "explain": "All three rows follow the same SOP: open the alert, check a second source, then decide. The invoice mail has three receivers and an unknown link. That makes it a real campaign, so it goes to L2. Closing it because one user did not click throws away the evidence. The failed sign-ins come from the internal scanner. One check in the identity log shows the alert is a known benign event, so you close it. Blocking the scanner would break the vulnerability scans. The EDR alert is high: read the process tree before anything else. Waiting for the user wastes the minutes when the host can still be contained.", "tip": "Memorise the three-step SOP: read the raw evidence, check a second source, then escalate or close with a note.", "hint": "For every row ask: what does the alert already tell me, and which second source can confirm it?"}, {"id": "EASY-02", "type": "mcq", "theme": "Telemetry & Alert Sources", "concepts": ["SIEM platform (Splunk, Elastic, Sentinel)", "EDR and XDR endpoint telemetry"], "title": "Which console shows the process tree", "brief": "Ticket #INC-4420 · 07:58 · four consoles open on the wall screen", "scenario": "<p>An alert says a script started from a document on the laptop <code>hr-ws-08</code>. The rule lives in the SIEM and forwards only one summary line: <i>“suspicious script behaviour on hr-ws-08”</i>.</p><p>To decide whether this is an attack, you must see the full process tree: which program started which program, the command line, and which file was written.</p>", "prompt": "Which console do you open to see the full process tree of the laptop?", "options": ["The email gateway console, which holds the delivered mails and attachments.", "The proxy log viewer, which holds the web pages the laptop opened today.", "The EDR console, which holds the endpoint process tree and command line.", "The SIEM search head, which holds the detection rules and alert summaries."], "correct": [2], "explain": "The EDR sensor runs on the laptop itself, so it records the process tree: the parent process, the child process, the command line and the file writes. The SIEM keeps the rules and the correlated alert summaries, not every process of every host. The email gateway sees the mail, and the proxy sees the web traffic; neither of them can show that Word started PowerShell. Knowing which console owns which evidence saves the time you would spend searching in the wrong tool.", "tip": "Learn one line per console: EDR = processes and files, SIEM = rules and correlation, gateway = mail, proxy = web.", "hint": "Which system is installed on the laptop itself and watches programs while they start?"}, {"id": "EASY-03", "type": "classify", "theme": "Telemetry & Alert Sources", "concepts": ["IDS and IPS alerts", "firewall, proxy and DNS logs", "email gateway and phishing reports", "identity and authentication logs"], "title": "Sort eight alerts into the right source", "brief": "Shift A · 08:15 · training queue for a new analyst", "scenario": "<p>The night shift left eight alert titles without a source tag. Before you can triage them you must put each title in the right source box, because every source has its own console and its own rule set.</p>", "prompt": "Drag each alert title into the source box it comes from.", "buckets": ["IDS / IPS sensor", "Firewall, proxy and DNS logs", "Email gateway", "Identity and authentication logs"], "items": [{"text": "Suricata signature 2100498 matched: SMB scan from the internal range", "bucket": "IDS / IPS sensor"}, {"text": "IPS blocked an exploit attempt against the web server on TCP 8443", "bucket": "IDS / IPS sensor"}, {"text": "Proxy blocked a download of invoice_2025[.]zip from a new domain", "bucket": "Firewall, proxy and DNS logs"}, {"text": "DNS query for a long random label of dns-tunnel[.]example", "bucket": "Firewall, proxy and DNS logs"}, {"text": "Email gateway quarantined a message with a spoofed display name", "bucket": "Email gateway"}, {"text": "User reported a mail that asks to change a supplier bank account", "bucket": "Email gateway"}, {"text": "Twelve failed sign-ins for p.novak inside four minutes", "bucket": "Identity and authentication logs"}, {"text": "MFA prompt accepted from a new country at 03:10 local time", "bucket": "Identity and authentication logs"}], "explain": "Each source sees a different part of an attack. An IDS or IPS sensor matches network signatures, so scans and exploit attempts land there. The firewall, proxy and DNS logs record connections and lookups, so a blocked download or a strange DNS label lands there. The email gateway sees the messages themselves, including a spoofed display name or a payment-change request. Identity logs hold sign-ins, MFA prompts and failures. The words of the title usually name the source: signature, blocked download, message, sign-in. If you send an alert to the wrong box, it reaches a team that holds no evidence for it.", "tip": "Learn four keywords: signature = IDS/IPS, download or lookup = proxy and DNS, message = email gateway, sign-in = identity.", "hint": "Ask what the sensor really saw: a network signature, a connection, a mail message, or a login attempt."}, {"id": "EASY-04", "type": "log", "theme": "Telemetry & Alert Sources", "concepts": ["firewall, proxy and DNS logs", "false positive suppression and allowlisting"], "title": "Which proxy line is already allowed", "brief": "Ticket #INC-4421 · 08:40 · rule NEW-DOMAIN-04 fired 40 times", "scenario": "<p>The rule <code>NEW-DOMAIN-04</code> fired 40 times for the marketing subnet. The rule warns when a host contacts a domain that the company has never seen before.</p><p>Your team lead says: <i>“Check the proxy log. If the traffic is normal business traffic that we have already allowed, close the alert as a benign true positive and write the allowlist rule name in the note.”</i></p><p>The SOC allowlist for the marketing team covers the analytics domain <code>cdn-metrics[.]example</code> under the rule <code>ALLOW-MKT-ANALYTICS</code>.</p>", "artifact": {"kind": "log", "title": "proxy-mkt-2025-06-11.log", "meta": "proxy console export · level-tagged · filter enabled", "lines": [["INFO", "2025-06-11 09:01:02 host=mkt-ws-03 user=k.adeyemi dst=intranet[.]bank-example[.]local rule=BASE-WEB-01 action=allowed"], ["INFO", "2025-06-11 09:02:11 host=mkt-ws-07 user=l.moreau dst=cdn-metrics[.]example rule=ALLOW-MKT-ANALYTICS action=allowed"], ["WARN", "2025-06-11 09:03:40 host=mkt-ws-11 user=a.silva dst=invoice-portal[.]example rule=NEW-DOMAIN-04 action=blocked"], ["WARN", "2025-06-11 09:04:12 host=mkt-ws-04 user=r.iyer dst=upload-share[.]example rule=DLP-WATCH-02 action=allowed size=420MB"], ["INFO", "2025-06-11 09:05:02 host=mkt-ws-09 user=s.klein dst=tracker-ads[.]example rule=NEW-DOMAIN-04 action=allowed"], ["WARN", "2025-06-11 09:06:44 host=mkt-ws-11 user=a.silva dst=x7f2q91[.]dns-tunnel[.]example rule=DNS-LONG-LABEL action=alerted"]]}, "prompt": "Which log line shows normal marketing traffic that the allowlist already covers?", "options": ["09:06:44 mkt-ws-11 -> x7f2q91[.]dns-tunnel[.]example, DNS-LONG-LABEL, alerted", "09:02:11 mkt-ws-07 -> cdn-metrics[.]example, ALLOW-MKT-ANALYTICS, allowed", "09:03:40 mkt-ws-11 -> invoice-portal[.]example, NEW-DOMAIN-04, blocked", "09:04:12 mkt-ws-04 -> upload-share[.]example, DLP-WATCH-02, allowed 420 MB"], "correct": [1], "explain": "The team lead named one allowlist entry, and the line at 09:02:11 carries exactly that rule name, ALLOW-MKT-ANALYTICS, for the analytics domain. That makes the alert a benign true positive. The traffic is real, but it is normal and already approved. So you close the alert and note the rule that covers it. The blocked invoice portal is a new domain that the proxy stopped. The 420 MB upload is a data-loss watch for a file-sharing site. The long random DNS label looks like tunnelling traffic and needs a real look, not a close.", "tip": "Before you close a proxy alert, find the allowlist rule name in the log line. The rule name is your proof.", "hint": "The team lead named one allowlist rule. Find the log line that carries that exact rule name."}, {"id": "EASY-05", "type": "order", "theme": "Triage Core & Workflow", "concepts": ["alert validation before escalation", "triage playbook / SOP / runbook", "shift handover and ticket notes"], "title": "The six steps of the L1 triage SOP", "brief": "Onboarding · SOP-TRI-01 · L1 analyst handbook, page 4", "scenario": "<p>It is your first week in the SOC. Your buddy asks you to put the six steps of the L1 triage SOP in the right order before you take your first alert alone.</p><p>The queue is calm this morning and your buddy will check your order before the 09:00 standup. The shift lead then signs off your first solo alert.</p>", "prompt": "Put the six triage steps in the correct order (the step you do first goes on top).", "items": ["The alert arrives in the L1 worklist with the severity label given by the detection rule.", "The analyst takes the ticket, sets the status to in progress and opens the raw evidence.", "The analyst validates the alert: the host, the user and the rule that fired are checked.", "The analyst enriches the evidence with the approved tools, for example a hash or a domain lookup.", "The analyst writes the verdict and either escalates the ticket to L2 or closes it with a reason.", "The analyst records the action in the ticket and writes one line in the shift handover note."], "explain": "Triage is a short ladder. The alert arrives. You take the ticket and read the raw evidence. You validate it against a second source. You enrich it with the approved tools. You decide and either escalate or close. At the end you record what you did. Escalating before validation sends noise to L2. Closing before enrichment can hide a real incident. Skipping the last step means the next shift sees a ticket with no story and has to start again.", "tip": "Remember the six words in order: arrive, read, validate, enrich, decide, record.", "hint": "You cannot write a verdict before you have read and checked the evidence, and the note comes after the decision."}, {"id": "EASY-06", "type": "fill", "theme": "Triage Core & Workflow", "concepts": ["triage playbook / SOP / runbook", "SLA and OLA response targets"], "title": "Complete the L1 response rules", "brief": "SOP-TRI-01 extract · rules 3.1 to 3.4 · audit copy", "scenario": "<p>The service desk asks you to check the response rules before the next audit. Five words are missing from the policy extract. Choose them from the bank.</p><p>The audit is on Friday, so the extract must be complete. The service desk owner is s.haas and she keeps the signed copy.</p>", "prompt": "Complete the four response rules with the right words.", "text": "Rule 3.1: the L1 analyst must [[0]] the alert before any escalation. Rule 3.2: the acknowledgement, which is the first response to the alert, must be written in the [[1]] within [[2]] minutes. Rule 3.3: every alert needs a [[3]]: true positive, benign true positive or false positive. Rule 3.4: only the shift lead may [[4]] a SEV1 or SEV2 ticket to L2.", "blanks": ["validate", "ticket", "15", "verdict", "escalate"], "bank": ["escalate", "verdict", "15", "ticket", "validate", "close", "60", "owner"], "explain": "To validate means to check that the alert is real before you send it anywhere. The acknowledgement is the first reply to the alert and it must be written in the ticket inside the SLA time, here 15 minutes. The verdict is the short conclusion: true positive, benign true positive or false positive. Escalating a major ticket is a decision that the shift lead signs. The other words in the bank are real SOC words but they do not fit. Closing comes after the verdict. The owner is a person and not a timer. Also, 60 minutes would miss the response target.", "tip": "Learn four rule words by heart: validate, acknowledge in the ticket, verdict, escalate.", "hint": "Two blanks are actions, one is the place where you write, one is a number of minutes and one is the short conclusion."}, {"id": "EASY-07", "type": "match", "theme": "Detection, Enrichment & Threat Context", "concepts": ["SIEM platform (Splunk, Elastic, Sentinel)", "EDR and XDR endpoint telemetry", "IOC enrichment and reputation lookups", "sandbox detonation"], "title": "Which tool answers which question", "brief": "Ticket #INC-4422 · 09:20 · enrichment step of the SOP", "scenario": "<p>Five questions are open on ticket INC-4422 and five tools are available to you. Your SOP says: ask the right tool for the fact before you write the verdict.</p><p>The ticket opened at 09:20 and the SLA gives you until 12:00 to finish this enrichment step. Shift A owns the ticket.</p>", "prompt": "Match each question with the tool that answers it.", "pairs": [{"left": "Is the attached file malicious?", "right": "Sandbox detonation in an isolated virtual machine"}, {"left": "Who else in the company contacted this address?", "right": "SIEM search over the proxy and DNS logs"}, {"left": "What ran on the laptop before the alert?", "right": "EDR timeline with the process tree"}, {"left": "Is this domain already known as malicious?", "right": "Reputation lookup against the threat intel feeds"}, {"left": "How often did this detection rule fire this week?", "right": "SIEM search on the rule name with a count"}], "explain": "Every tool keeps one kind of evidence. A sandbox runs the file in an isolated machine. It shows what the file tries to do. That is the only safe way to answer a question about a file. The SIEM keeps the long history of network events, so it can say who else contacted an address and how often a rule fired. The EDR keeps the endpoint timeline: processes, parents and files. A reputation service holds threat intel and can say whether a domain is already known as bad. Asking a tool for evidence it does not keep gives you an empty answer, and an empty answer written as a verdict becomes a mistake.", "tip": "Before each question, name the system that stores that evidence: file behaviour, network history, endpoint timeline, or threat intel.", "hint": "A sandbox answers questions about a file; a reputation service answers questions about a name or an address."}, {"id": "EASY-08", "type": "terminal", "theme": "Detection, Enrichment & Threat Context", "concepts": ["SIEM platform (Splunk, Elastic, Sentinel)", "IOC enrichment and reputation lookups", "defanging IOCs and safe handling"], "title": "Find, enrich and record one indicator", "brief": "soc-sh-01 · analyst session · ticket INC-4430", "scenario": "<p>You work on ticket <code>INC-4430</code>. The alert says a marketing laptop contacted the domain <code>pixel-collect[.]example</code>; the indicator is defanged here so that nobody opens it by accident, and you must keep it defanged in every note you write.</p><p>Three things must happen: find the alert in the SIEM, enrich the domain with the reputation tool, and write the verdict into the case. Type the command for each step.</p>", "prompt": "Type the commands in the terminal. The goal of the step you are working on is printed below.", "console": "soc-sh-01 - analyst shell", "consoleMode": "interactive SIEM search head", "steps": [{"goal": "Query the SIEM index alerts for alert id INC-4430 in the last 24 hours.", "accept": ["index\\s*=\\s*alerts.*inc-4430", "inc-4430.*index\\s*=\\s*alerts"], "out": "1 event matched - host=mkt-ws-12 - rule=NEW-DOMAIN-04 - dst=pixel-collect[.]example", "err": "No index matched. A SIEM search needs an index and the alert id.", "example": "index=alerts INC-4430 earliest=-24h"}, {"goal": "Look up the defanged domain pixel-collect[.]example in the reputation service.", "accept": ["rep\\s+domain\\s+pixel-collect\\[\\.\\]example", "reputation\\s+domain\\s+pixel-collect\\[\\.\\]example"], "out": "pixel-collect[.]example | category: advertising | feeds: 0/62 | first seen 2024-11-02 | verdict: unknown", "err": "That command does not look up a domain in the reputation service.", "example": "rep domain pixel-collect[.]example"}, {"goal": "Record the verdict benign true positive in case INC-4430 with the shift A owner.", "accept": ["case\\s+(note|update)\\s+inc-4430.*benign", "case\\s+note\\s+--id\\s+inc-4430.*benign"], "out": "Case INC-4430 updated: verdict=benign true positive | note saved by shift A | SLA clock stopped", "err": "That command does not write a verdict into the case.", "example": "case note INC-4430 --verdict benign true positive"}], "explain": "This is the standard enrichment path of the SOP. First you find the event: the SIEM search needs an index and the alert id. Then you look up the indicator. The reputation service returns the category and the feed score. Here the domain is unknown, not known as malicious, and that supports the benign true positive verdict. Then you write the verdict in the case so the next shift and the auditor can read it. Pasting an indicator into a search engine, or opening it in a browser, breaks the safe-handling rule. It would also tell the attacker that the domain is live.", "tip": "Keep the command order in mind: find the event, enrich the indicator, record the verdict. Keep every indicator defanged.", "hint": "Each command starts with a tool word: the index for the search, rep for the reputation lookup, case for the verdict."}, {"id": "EASY-09", "type": "mcq", "theme": "Attack Patterns & Threat Types", "concepts": ["email gateway and phishing reports", "phishing and BEC alerts"], "title": "The safe check on a reported mail", "brief": "Ticket #INC-4423 · 10:05 · user report from branch 118", "scenario": "<p>At 10:05 a branch user writes to the service desk: <i>“I received a mail that says our payroll details must be updated today. It looks strange, but the address looks like ours.”</i> The service desk opens ticket INC-4423 and forwards the mail to the SOC.</p><p>The mail comes from <code>payroll@bank-example[.]secure-hr[.]example</code> and holds a button with the defanged link <code>hxxps://hr-portal-verify[.]example/login</code>. Two other employees received the same mail.</p>", "prompt": "What is the correct check to do before anything else on this reported mail?", "options": ["Reply to the sender from your mailbox and ask whether the message is genuine.", "Delete the mail from the three mailboxes and close the ticket as a false positive.", "Check the gateway log and compare the sender, the return-path and the link.", "Click the link from your own workstation to see if the page asks for a password."], "correct": [2], "explain": "The gateway log holds the facts of the message: the real sender, the return-path, the link and the list of receivers. Comparing them is safe and takes a minute, and it is exactly what the SOP asks for. Clicking the link confirms nothing new and can expose your session to the attacker. Replying tells the attacker that the mailbox is live and that a person is reading. Deleting the mail destroys the evidence, and two other employees received the same message, so it is not one false alarm to close.", "tip": "For a reported mail: read the header, compare sender and return-path, check the link in the gateway log. Never click, reply or delete first.", "hint": "The safe evidence for a mail is written in the gateway log, not in the browser or in the user mailbox."}, {"id": "EASY-10", "type": "multi", "theme": "Triage Core & Workflow", "concepts": ["alert validation before escalation", "alert fatigue", "SLA and OLA response targets"], "title": "Which alerts go to L2 now", "brief": "Ticket #SOC-1184 · 10:30 · L1 queue review before the 11:00 standup", "scenario": "<p>Five alerts are open in the L1 queue. The L2 team is already busy, so only the alerts that really need a deeper look go up now. Read the queue table, then use your written rule:</p><p>Escalate when the evidence shows real harm, or a real threat to many hosts, or when the SLA of a major alert is about to expire with no explanation. Close or hold when the activity is expected, already agreed, or only noise.</p>", "artifact": {"kind": "table", "title": "L1 queue - 11 June 2025 10:30", "meta": "case management export · 5 open alerts", "head": ["Alert", "Sev", "What the evidence shows", "SLA left"], "rows": [["INC-4424", "SEV2", "The card payment API fails for one customer in five", "20 min"], ["INC-4425", "SEV1", "A script from a document deleted the shadow copies on a file server", "35 min"], ["INC-4426", "SEV3", "The nightly backup job uploaded 3 GB to the approved cloud archive", "4 h"], ["INC-4427", "SEV3", "A decommissioned test host sent 400 duplicate alerts from one rule", "6 h"], ["INC-4428", "SEV2", "The pentest team booked this port scan of the branch range for today", "1 h"]]}, "prompt": "Select every alert that must be escalated to L2 now.", "options": ["INC-4424 - escalate it now: card payments are failing for real customers.", "INC-4425 - escalate it now: a script deleted the shadow copies on a server.", "INC-4426 - close it: the nightly backup job used the approved cloud archive.", "INC-4427 - close it: a decommissioned host sent 400 duplicate alerts.", "INC-4428 - close it: the pentest team booked this port scan for today."], "correct": [0, 1], "explain": "Escalate the two alerts that show real harm or a real threat. Failing card payments touch customer money and the response clock is short. Deleted shadow copies on a file server is a classic first move of a ransomware attack, so L2 must see it at once. The other three have an explanation. The backup upload matches the approved archive. The 400 alerts come from one rule on a host that no longer exists. The port scan was announced by the pentest team in their own ticket. Sending those three up would push the two real alerts down the L2 queue and add to alert fatigue.", "tip": "Before escalating, ask two questions: does the evidence show real harm or a real threat, and did somebody already confirm this activity?", "hint": "Two rows show harm or a threat to the business. The other three are expected, agreed in advance, or pure noise."}, {"id": "EASY-11", "type": "rank", "theme": "Triage Core & Workflow", "concepts": ["alert queue and worklist", "severity levels SEV1-SEV4 and priority vs severity", "SLA and OLA response targets"], "title": "Rank the queue by impact and SLA", "brief": "Ticket #SOC-1186 · 11:00 · priority list for the standup", "scenario": "<p>The 11:00 standup needs a priority list. Your team works with this written rule, and the rule says that the severity label alone is not the priority:</p><ul><li>Work that touches customer money, customer data or patient care comes before everything else.</li><li>After that, a threat that can spread to other hosts comes before local noise.</li><li>Inside the same group, the alert with the least SLA time left comes first.</li></ul>", "prompt": "Rank the five alerts, from the one to work on first to the one to work on last.", "items": ["SEV2 - the card payment API is failing for some customers - 15 min of SLA left", "SEV3 - possible malware on a finance payment workstation - 40 min of SLA left", "SEV2 - failed sign-ins on an internal test server - 2 h of SLA left", "SEV3 - phishing report from a branch user, link not clicked - 3 h of SLA left", "SEV4 - software update alert on a marketing laptop - 8 h of SLA left"], "explain": "The rule puts business impact before the label. Card payments failing touches customer money, so that alert is worked on first. Possible malware on a payment workstation is next, because malware can spread to other hosts. The last three are local and no harm is confirmed, so the SLA clock decides. The test server has two hours left, then the phishing report with three hours, then the marketing laptop with eight hours. Ranking by the raw label would put the two SEV2 alerts on top, but the test server has no business impact while the payment API does.", "tip": "Learn the difference between severity (how bad an alert looks) and priority (what you do first). Priority uses business impact and the SLA clock.", "hint": "Which alert can cost a customer money right now? Which one can still spread to other machines?"}, {"id": "EASY-12", "type": "log", "theme": "Triage Core & Workflow", "concepts": ["shift handover and ticket notes", "triage playbook / SOP / runbook"], "title": "Which closed note is complete", "brief": "Shift handover · 14:00 · shift A hands over to shift B", "scenario": "<p>Shift A ends at 14:00 and you must hand the morning work to shift B.</p><p>The SOP says: <i>“A closed ticket note is complete when it holds four things: the verdict, the evidence, the action taken, and the owner of the ticket. If one of the four is missing, the next shift cannot follow the case.”</i></p><p>You read the handover file and check the notes written this morning.</p>", "artifact": {"kind": "doc", "title": "handover-shiftA-2025-06-11.txt", "meta": "case management export · shift A closes at 14:00", "lines": ["## Shift handover - shift A to shift B - 11 June 2025", "## SOP 4.2 - a complete closed note holds: verdict, evidence, action taken, owner", "INC-4402 | closed | verdict: false positive | evidence: proxy line ALLOW-BRANCH-WEB for portal[.]bank-example[.]local | action: closed and the allowlist note updated | owner: shift A, l.moreau", "INC-4407 | closed | verdict: benign true positive | evidence: the patch server scanned the branch range at 02:00", "INC-4411 | escalated to L2 | evidence: EDR encoded PowerShell on hr-ws-21 | action: host isolated", "INC-4414 | closed | verdict: false positive | action: closed after 4 minutes"]}, "prompt": "Which ticket note is complete enough for shift B to follow the case?", "options": ["INC-4414 - the verdict and the closing time are written, so the note is complete enough.", "INC-4402 - the verdict, the evidence, the action and the owner are all written.", "INC-4407 - the verdict and the evidence are written, and nothing else is needed.", "INC-4411 - the evidence and the action are written, so the note counts as complete."], "correct": [1], "explain": "The SOP names four parts, and INC-4402 carries all four. It has the verdict (false positive) and the evidence (the proxy line and its rule name). It also has the action (closed and the allowlist note updated) and the owner (shift A, l.moreau). INC-4407 stops after the evidence and never says what was done or who owned it. INC-4411 names the action but no owner, so nobody knows who to ask. INC-4414 has a verdict and a time, but no evidence and no action. A note with a missing part costs the next shift time and the case may be reopened.", "tip": "Check every closed ticket note for four parts: verdict, evidence, action taken, owner.", "hint": "Read the SOP line in the file again, then count how many of the four parts each note holds."}];
var INTRO_HTML = "\n<div class=\"card\">\n  <div class=\"eyebrow\">Standalone certification exam · scenario-based · one keyword, four severity levels</div>\n  <h1 class=\"kw\" style=\"margin:.3rem 0 .2rem\">Alert Triage</h1>\n  <p class=\"sub\" style=\"font-size:1rem;color:var(--txt)\">Foundational level. One alert and one decision at a time: read the evidence, check the source, then close the ticket or pass it to the next line.</p>\n  <div class=\"tiles\">\n    <div class=\"tile\"><div class=\"k\">Severity of this file</div><div class=\"v\"><span class=\"sev easy\">EASY</span></div></div>\n    <div class=\"tile\"><div class=\"k\">Passing score</div><div class=\"v\">80% of answered exercises</div></div>\n    <div class=\"tile\"><div class=\"k\">Time limit</div><div class=\"v\">32 minutes, pausable</div></div>\n    <div class=\"tile\"><div class=\"k\">Workload</div><div class=\"v\">12 exercises · 120 points</div></div>\n  </div>\n</div>\n\n\n<div class=\"card\">\n  <h2>First, what is alert triage?</h2>\n  <p class=\"sub\">Your keyword, explained in plain words. Short sentences, common words, no hard jargon.</p>\n  <p>Security tools watch computers, accounts and networks all day. When a tool sees something strange,\n  it writes an <b>alert</b>. One tool can write thousands of alerts in a day. Humans cannot fix thousands of\n  things, so somebody must look at each alert and decide three simple questions:\n  <b>Is this real? How bad is it? Who must act, and how fast?</b> That work is <b>alert triage</b>.</p>\n  <p>Imagine you are a new analyst on the morning shift. You open the alert queue - a list of alerts waiting\n  for a human. You take the first one, read the evidence, and you decide. That is the whole job, repeated\n  with care. Triage is the door between “a tool made noise” and “the company responds”.</p>\n\n  <h3>The three answers you must produce</h3>\n  <ul class=\"tight\">\n    <li><b>Is it real?</b> A <b>true positive</b> is a real problem. A <b>false positive</b> is noise: the rule\n    was wrong. A <b>benign true positive</b> is real activity that is allowed, like the nightly backup that looks\n    like a big data transfer.</li>\n    <li><b>How bad is it?</b> You score the alert with the <b>asset</b> (which machine or account?), the\n    <b>data</b> (what could be lost?) and the <b>stage</b> (is the attacker only knocking, or already inside?).</li>\n    <li><b>Who acts, and how fast?</b> Small and clear cases you close with a note. Real and serious cases you\n    <b>escalate</b> to level 2, to incident response, or to the on-call engineer.</li>\n  </ul>\n\n  <h3>Where you meet alert triage at work</h3>\n  <ul class=\"tight\">\n    <li><b>SOC analyst (level 1):</b> the queue owner. Validates alerts, closes noise, escalates the real ones,\n    writes ticket notes. This is where nearly every security career starts.</li>\n    <li><b>SOC analyst (level 2 / level 3):</b> receives escalations, does deeper analysis, hunts related\n    activity, decides on containment.</li>\n    <li><b>Incident response:</b> receives the confirmed incident and runs the response. Good triage gives them a\n    clean timeline instead of a pile of raw alerts.</li>\n    <li><b>Threat hunting:</b> takes the cases triage could not explain, and looks for what the rules missed.</li>\n    <li><b>Detection engineering:</b> tunes the rules so triage gets fewer false positives and fewer misses.</li>\n    <li><b>GRC and management:</b> read the numbers - how many alerts, how fast we answer, how many are real -\n    and ask why they move.</li>\n    <li><b>Red team:</b> studies which of their actions produced alerts and which produced nothing; that\n    knowledge comes back to triage as new detections.</li>\n  </ul>\n\n  <h3>The tools in front of you</h3>\n  <p>A <b>SIEM</b> (the platform that collects logs from everywhere and runs the rules - for example Splunk,\n  Elastic or Microsoft Sentinel), an <b>EDR</b> (the agent on the laptop or server that shows processes,\n  connections and files), the <b>ticketing or case tool</b> (ServiceNow, Jira, TheHive) where the work is\n  recorded, a <b>reputation service</b> for files, domains and addresses, a <b>sandbox</b> that opens a file in a\n  safe room and reports what it does, and often a <b>SOAR</b> that runs the boring steps for you.</p>\n\n  <h3>The papers and screens you produce</h3>\n  <p>A <b>ticket note</b> with the verdict, the evidence and the action; an <b>escalation handoff</b> to the next\n  level with everything they need; a <b>shift handover line</b> so the next shift knows what is still open; and\n  sometimes a short summary for the <b>daily or weekly numbers</b>.</p>\n\n  <h3>Why it matters</h3>\n  <p>If triage is slow, the attacker works for free. If triage is careless, real alarms are closed as noise.\n  If triage is noisy, analysts get tired - this is <b>alert fatigue</b> - and they start clicking “close”\n  without reading. Triage is the control that keeps all three dangers away.</p>\n\n  <p class=\"muted\">In one sentence: alert triage is how a security team turns thousands of tool messages into a\n  small number of correct decisions.</p>\n</div>\n\n\n<div class=\"card\">\n  <h2>How this certification exam runs</h2>\n  <p class=\"sub\">The rules, the timer, the skip system and the exercise types. Read this once, then start whenever you are ready.</p>\n  <div class=\"grid2\">\n    <div class=\"box\">\n      <h4>Scoring</h4>\n      <ul class=\"tight\">\n        <li>Every exercise is worth <b>10 points</b>.</li>\n        <li>A correct answer gives <b>10 points</b>. A wrong answer gives <b>0 points</b>.</li>\n        <li>A hint costs <b>10% of that exercise</b> (1 point). A hint gives a nudge, never the answer.</li>\n        <li>In a <b>terminal exercise</b>, every wrong command also costs 1 point (10%), exactly like a hint.\n        You can always finish the exercise and keep the remaining points.</li>\n        <li>In a <b>branching exercise</b> or an <b>alert queue</b>, every decision or queue row must be right\n        for the exercise to score.</li>\n        <li>The percentage is computed <b>only over the exercises you actually answered</b>.</li>\n        <li>Passing score: <b>80%</b>. Below that, you retake the exam.</li>\n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Timer and breaks</h4>\n      <ul class=\"tight\">\n        <li>Total time for this file: <b>32 minutes</b>.</li>\n        <li>The countdown is always visible at the top of the screen.</li>\n        <li>Use <b>Pause</b> (or press <code>Esc</code>) when you take a break. While paused, the exercises are\n        hidden and blurred and the timer is stopped, so you cannot read the questions during the break.</li>\n        <li>When the time reaches zero, the exam is submitted automatically. Exercises left unanswered are excluded\n        from the score.</li>\n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Skip and review</h4>\n      <ul class=\"tight\">\n        <li><b>Every exercise has a Skip button.</b> Skipping is free, and it never shows the answer.</li>\n        <li>A skipped exercise goes to the <b>Skipped pool</b> (Exercise map, amber squares).</li>\n        <li>Before the exam can finish, you get a <b>“Review skipped exercises”</b> screen that lists every\n        skipped exercise and lets you go back to it.</li>\n        <li>You may return to skipped exercises as many times as you want, until the timer ends or you submit.</li>\n        <li>If you submit while an exercise is still unanswered, it is <b>excluded from the score</b>: not correct,\n        not wrong, and its points are not added to the total possible points.</li>\n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Exercise types in this file</h4>\n      <ul class=\"tight small\"><li>Alert queue simulation - choose the right action for every alert</li><li>Drag each card into the correct box</li><li>Drag the alerts to rank them by priority</li><li>Drag the steps into the right order</li><li>Fill in the blanks of a real document from a shuffled word bank</li><li>Interactive terminal where you type the real command</li><li>Log, table, e-mail or document analysis with a filter box</li><li>Match each item to the right answer</li><li>Multi-select question - several correct answers</li><li>Single-choice question on a realistic artefact</li></ul>\n      <p class=\"muted small\">Some exercises ask you to drag cards (mouse) - on a tablet you can also\n      tap a card and then tap the target box. Answers are shuffled at every attempt, and the whole exercise\n      order is shuffled again when you retake the exam.</p>\n    </div>\n    <div class=\"box\">\n      <h4>Words you will see (plain meanings)</h4>\n      <ul class=\"tight small\">\n        <li><b>alert</b> - a message from a security tool that something needs a human look.</li>\n        <li><b>triage</b> - sorting alerts: is it real, how bad, who acts and how fast.</li>\n        <li><b>SIEM</b> - the platform that collects logs and runs detection rules. <b>EDR</b> - the agent that\n        watches one endpoint and shows its processes and connections.</li>\n        <li><b>true positive / false positive / benign true positive</b> - a real problem / noise / real but allowed.</li>\n        <li><b>IOC</b> - indicator of compromise: a file hash, domain or address linked to an attack.\n        <b>TTP</b> - the way an attacker works.</li>\n        <li><b>enrichment</b> - adding context to an alert (who owns the host, is the file known bad).</li>\n        <li><b>escalation</b> - passing the case to a higher level with the facts it needs.</li>\n        <li><b>containment</b> - stopping the spread: isolate a host, disable an account, block a domain.</li>\n        <li><b>blast radius</b> - how far the attacker can reach from the first foothold.</li>\n        <li><b>SLA / OLA</b> - the promised response times, to the business and between internal teams.</li>\n        <li><b>MTTD / MTTA / MTTR</b> - mean time to detect / to acknowledge / to resolve.</li>\n        <li><b>SOAR</b> - software that runs the repetitive triage steps automatically.\n        <b>DLP</b> - a tool that watches for data leaving the company.</li>\n        <li><b>ATT&CK</b> - MITRE's public list of attacker tactics and techniques.\n        <b>kill chain</b> - the stages of an intrusion, from recon to exfiltration.</li>\n        <li><b>chain of custody</b> - the record of who handled evidence, when and why.</li>\n        <li><b>PIR</b> - post-incident review: the meeting that turns a case into improvements.</li>\n      </ul>\n    </div>\n    <div class=\"box\" style=\"border-color:#31527a\">\n      <h4>What the severity level means here</h4>\n      <p class=\"muted small\" style=\"margin-bottom:.4rem\">\n        <span class=\"sev easy\">EASY</span>\n      </p>\n      <p class=\"muted small\">EASY - Foundational. Every exercise tests one triage idea and the wording guides you through it. The wrong answers are the weak reflexes of a new analyst, so each explanation says why the right move wins and why the near-miss choices lose. Every fact you need is written in the scenario or the artefact.</p>\n    </div>\n  </div>\n  <div class=\"qactions\">\n    <button class=\"btn primary lg\" onclick=\"startExam()\">Start the exam ▸</button>\n  </div>\n</div>\n\n<div class=\"box\"><h4>What this file tests - the keyword concept map</h4><p class=\"muted small\">The complete concept map of the keyword <b>Alert Triage</b>, grouped by theme. Every concept in this map is exercised in at least one of the four severity files of this exam set, so that no single file carries everything alone.</p><div class=\"legendline\"><span class=\"dot\"></span> Themes marked with the blue bar are covered by this exam file; the grey themes belong to the other severity levels.</div><div class=\"themes\"><div class=\"theme used\"><h4><span class=\"dot\"></span>Triage Core & Workflow</h4><div class=\"tags\"><span class=\"tag\">alert queue and worklist</span><span class=\"tag\">SLA and OLA response targets</span><span class=\"tag\">true positive vs false positive vs benign true positive</span><span class=\"tag\">alert fatigue</span><span class=\"tag\">deduplication and alert correlation</span><span class=\"tag\">triage playbook / SOP / runbook</span><span class=\"tag\">shift handover and ticket notes</span><span class=\"tag\">severity levels SEV1-SEV4 and priority vs severity</span><span class=\"tag\">alert validation before escalation</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Telemetry & Alert Sources</h4><div class=\"tags\"><span class=\"tag\">SIEM platform (Splunk, Elastic, Sentinel)</span><span class=\"tag\">EDR and XDR endpoint telemetry</span><span class=\"tag\">IDS and IPS alerts</span><span class=\"tag\">firewall, proxy and DNS logs</span><span class=\"tag\">cloud detection services</span><span class=\"tag\">identity and authentication logs</span><span class=\"tag\">email gateway and phishing reports</span><span class=\"tag\">DLP alert data</span><span class=\"tag\">honeypot and deception alerts</span><span class=\"tag\">log parsing and normalization</span><span class=\"tag\">log source health and pipeline latency</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Detection, Enrichment & Threat Context</h4><div class=\"tags\"><span class=\"tag\">IOC enrichment and reputation lookups</span><span class=\"tag\">sandbox detonation</span><span class=\"tag\">MITRE ATT&CK mapping</span><span class=\"tag\">cyber kill chain stages</span><span class=\"tag\">detection rule logic and tuning</span><span class=\"tag\">threat intel platform, MISP, STIX/TAXII</span><span class=\"tag\">vulnerability context (CVE, CVSS, exploitability)</span><span class=\"tag\">defanging IOCs and safe handling</span><span class=\"tag\">false positive suppression and allowlisting</span></div></div><div class=\"theme\"><h4>Prioritization, Risk & Metrics</h4><div class=\"tags\"><span class=\"tag\">asset criticality and CMDB context</span><span class=\"tag\">risk scoring and prioritization models</span><span class=\"tag\">blast radius and lateral movement assessment</span><span class=\"tag\">SOC metrics MTTD, MTTA, MTTR and false positive rate</span><span class=\"tag\">order of volatility for evidence</span></div></div><div class=\"theme\"><h4>Response & Containment</h4><div class=\"tags\"><span class=\"tag\">escalation matrix and on-call rota</span><span class=\"tag\">host isolation and containment</span><span class=\"tag\">containment authority and approval</span><span class=\"tag\">blocking at firewall, proxy and DNS sinkhole</span><span class=\"tag\">email quarantine and purge</span><span class=\"tag\">credential reset, session and token revocation</span><span class=\"tag\">evidence preservation and integrity</span><span class=\"tag\">chain of custody</span><span class=\"tag\">SOAR playbooks and automation</span></div></div><div class=\"theme\"><h4>Case Management & Handoff</h4><div class=\"tags\"><span class=\"tag\">ticketing and case management (ServiceNow, Jira, TheHive)</span><span class=\"tag\">handoff to threat hunting</span><span class=\"tag\">stakeholder communication and war room</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Attack Patterns & Threat Types</h4><div class=\"tags\"><span class=\"tag\">phishing and BEC alerts</span><span class=\"tag\">ransomware alerts</span><span class=\"tag\">brute force and credential stuffing</span><span class=\"tag\">C2 beaconing</span><span class=\"tag\">data exfiltration</span><span class=\"tag\">LOLBins and living off the land</span><span class=\"tag\">insider threat</span><span class=\"tag\">web shell and server compromise</span><span class=\"tag\">privilege escalation</span><span class=\"tag\">port scanning and reconnaissance</span><span class=\"tag\">account takeover and impossible travel</span><span class=\"tag\">supply chain and third-party compromise</span></div></div><div class=\"theme\"><h4>Governance, Frameworks & Improvement</h4><div class=\"tags\"><span class=\"tag\">NIST SP 800-61 incident handling lifecycle</span><span class=\"tag\">ISO/IEC 27035 incident management</span><span class=\"tag\">breach notification duties (GDPR 72h, NIS2)</span><span class=\"tag\">post-incident review and lessons learned</span><span class=\"tag\">purple team feedback and detection gaps</span></div></div></div></div>\n\n<div class=\"card\">\n  <h2>Before you start</h2>\n  <p class=\"sub\">One professional habit, and what happens after you submit.</p>\n  <div class=\"grid2\">\n    \n<div class=\"box\"><h4>Safety habit - defanged indicators</h4>\n<p class=\"muted small\">All addresses, domains and indicators in this exam are <b>defanged</b> - written in a\nsafe form, for example <code>hxxp://evil[.]example</code> or <code>10[.]0[.]0[.]1</code>. This is a normal\nprofessional habit: it stops a copy-paste from becoming a live link.</p></div>\n\n    <div class=\"box\"><h4>After submitting</h4>\n      <p class=\"muted small\">You get a full report: score, percentage, per-theme result, PASS or FAIL,\n      and an explanation for <b>every</b> exercise - including why the wrong answers are wrong and what to\n      revise. If you fail, a <b>Retake exam</b> button resets everything with new random orders.</p>\n    </div>\n  </div>\n  <div class=\"qactions\">\n    <button class=\"btn primary lg\" onclick=\"startExam()\">Start the exam ▸</button>\n  </div>\n</div>\n";

/* =========================================================================
   Alert Triage - standalone certification exam engine
   Vanilla JS. No libraries. Mouse + touch (click) support.
   Types: mcq, multi, log, order, rank, classify, match, fill, terminal,
          branch, triage (alert queue), dual (blue team / red team).
   ========================================================================= */
var MAXPTS = 10;               /* points per exercise */
var HINTCOST = 1;              /* hint = -10% of the exercise = 1 point */
var S = {pool:[], idx:0, res:{}, hints:{}, skipped:[], time:0, tid:null,
         paused:false, done:false, timeover:false, started:false};

/* ------------------------------- helpers ------------------------------- */
function $(sel, root){ return (root||document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function shuffle(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];
  });
}
function fmt(sec){
  sec = Math.max(0, sec|0);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}

/* --------------------------- exercise preparation ---------------------- */
function prepare(ex){
  var x = JSON.parse(JSON.stringify(ex));
  x._hint = 0;
  x._opts = null; x._display = null; x._items = null; x._bank = null; x._pool = null;
  if(x.type==='mcq' || x.type==='multi' || x.type==='log'){
    x._opts = shuffle(x.options.map(function(t,i){ return {t:t, ok:x.correct.indexOf(i)>=0}; }));
  }
  if(x.type==='classify'){
    x._items = shuffle(x.items.map(function(it){ return {text:it.text, bucket:it.bucket}; }));
  }
  if(x.type==='match'){
    var rights = x.pairs.map(function(p){ return p.right; }).filter(function(v,i,a){ return a.indexOf(v) === i; });
    x._pool = shuffle(rights);
  }
  if(x.type==='fill'){
    x._bank = shuffle(x.bank.slice());
  }
  if(x.type==='order' || x.type==='rank'){
    x._display = shuffle(x.items.slice());
  }
  if(x.type==='branch'){
    x._node = 0; x._firstTry = true; x._wrongPicks = 0;
    /* shuffle the options of every decision node so the correct choice is never in a fixed position */
    x.nodes = x.nodes.map(function(n){
      var nn = JSON.parse(JSON.stringify(n));
      nn.options = shuffle(nn.options);
      return nn;
    });
  }
  if(x.type==='terminal'){
    x._step = 0;
    x._wrong = 0;
    x._log = ['<div class="to">'+esc(x.console || 'soc-console 4.2 - analyst workstation')+' - session started</div>',
              '<div class="to">Type the command for the requested step, then press Enter.</div>'];
  }
  if(x.type==='triage'){
    /* shuffle the actions of every queue row so the correct action is never in a fixed slot */
    x._q = x.alerts.map(function(a){
      return {id:a.id, sev:a.sev, src:a.src, title:a.title, detail:a.detail, outcome:a.outcome,
              actions:shuffle(a.actions.map(function(t,i){ return {t:t, ok:i===a.answer}; }))};
    });
  }
  if(x.type==='dual'){
    x._parts = x.parts.map(function(p){
      return {role:p.role, prompt:p.prompt, explain:p.explain,
              options:shuffle(p.options.map(function(t,i){ return {t:t, ok:i===p.answer}; }))};
    });
  }
  return x;
}

/* --------------------------------- timer ------------------------------- */
function startExam(){
  S.pool   = shuffle(EXERCISES.slice()).map(prepare);
  S.idx    = 0;
  S.res    = {};
  S.hints  = {};
  S.skipped= [];
  S.done   = false;
  S.reported = false;   /* score bridge: one report per attempt */
  S.paused = false;
  S.timeover = false;
  S.started = true;
  S.time   = EXAM.minutes*60;
  document.body.classList.remove('paused');
  var ov = $('#pauseOv'); if(ov){ ov.style.display='none'; }
  if(S.tid){ clearInterval(S.tid); }
  S.tid = setInterval(tick, 1000);
  renderExam();
}
function tick(){
  if(S.paused || S.done){ return; }
  S.time--;
  if(S.time <= 0){ S.time = 0; updateHUD(); timeUp(); return; }
  updateHUD();
}
function timeUp(){
  S.timeover = true;
  S.done = true;
  if(S.tid){ clearInterval(S.tid); S.tid = null; }
  document.body.classList.remove('paused');
  var ov = $('#pauseOv'); if(ov){ ov.style.display='none'; }
  showResults();
}
function togglePause(){
  if(S.done || !S.started){ return; }
  S.paused = !S.paused;
  document.body.classList.toggle('paused', S.paused);
  var ov = $('#pauseOv');
  if(!ov){ ov = document.createElement('div'); ov.id='pauseOv'; ov.className='pauseov'; document.body.appendChild(ov); }
  if(S.paused){
    ov.innerHTML = '<div class="pausepanel"><h2>Timer paused</h2>'+
      '<p class="muted">The exercises are hidden and blurred while the timer is paused, so you cannot read them during the break.</p>'+
      '<p class="muted small">The countdown is stopped.</p>'+
      '<button class="btn primary" onclick="togglePause()">Resume exam</button></div>';
    ov.style.display = 'flex';
  } else {
    ov.style.display = 'none';
  }
  updateHUD();
}

/* ------------------------------ statistics ----------------------------- */
function stats(){
  var answered=0, correct=0, wrong=0, earned=0, possible=0, skippedLeft=0;
  S.pool.forEach(function(x){
    var r = S.res[x.id];
    if(!r || r.status==='skipped'){ skippedLeft++; return; }
    answered++; possible += MAXPTS; earned += r.earned;
    if(r.status==='correct'){ correct++; } else { wrong++; }
  });
  return {answered:answered, correct:correct, wrong:wrong, earned:earned,
          possible:possible, skipped:skippedLeft, total:S.pool.length};
}
function updateHUD(){
  var st = stats();
  var t = $('#hudTime');
  if(t){
    t.textContent = fmt(S.time);
    var pill = t.parentNode;
    pill.className = 'pill timer';
    if(S.time <= 60){ pill.className = 'pill timer low'; }
    else if(S.time <= EXAM.minutes*60*0.25){ pill.className = 'pill timer warn'; }
  }
  var sc = $('#hudScore');
  if(sc){
    var newText = st.earned + ' / ' + st.possible + ' pts';
    if(sc.textContent !== newText){
      sc.textContent = newText;
      var pill = sc.parentNode;
      if(pill && pill.classList){
        pill.classList.remove('bump');
        void pill.offsetWidth;
        pill.classList.add('bump');
      }
    }
  }
  var pct = st.total ? Math.round((st.answered/st.total)*100) : 0;
  var pr = $('#hudProg'); if(pr){ pr.style.width = pct + '%'; }
  var pc = $('#hudPct'); if(pc){ pc.textContent = pct + '% done'; }
  var sk = $('#hudSkip'); if(sk){ sk.textContent = st.skipped + ' skipped'; }
  var pb = $('#pauseBtn'); if(pb){ pb.textContent = S.paused ? '▶ Resume' : '⏸ Pause'; }
}
