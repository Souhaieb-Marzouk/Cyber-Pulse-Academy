var EXERCISES = [{"id": "MED-01", "type": "log", "theme": "Telemetry & Alert Sources", "title": "Three hosts, one address, one beacon", "brief": "Ticket #SOC-20413 · 07:42 shift A · L2 queue · proxy and DNS export", "concepts": ["firewall, proxy and DNS logs", "asset criticality and CMDB context", "C2 beaconing"], "scenario": "<p>You are the L2 analyst on shift A. Three internal hosts contacted the same external domain in the last 30 minutes. The duty manager asks which one is most likely beaconing to a command-and-control server, and why the other two are normal business traffic.</p><p>The proxy and DNS export is in the viewer below.</p>", "artifact": {"kind": "log", "title": "proxy-dns-0714.log", "meta": "SIEM export · proxy + DNS · filter enabled", "lines": [["INFO", "2025-06-11 07:14:02 host=fin-ws-22 user=r.okafor dst=203[.]0[.]113[.]44 dns=a7f3c2[.]cdn-metric[.]example bytes_out=512"], ["INFO", "2025-06-11 07:19:01 host=fin-ws-22 user=r.okafor dst=203[.]0[.]113[.]44 dns=a7f3c2[.]cdn-metric[.]example bytes_out=512"], ["INFO", "2025-06-11 07:24:02 host=fin-ws-22 user=r.okafor dst=203[.]0[.]113[.]44 dns=a7f3c2[.]cdn-metric[.]example bytes_out=512"], ["INFO", "2025-06-11 07:29:01 host=fin-ws-22 user=r.okafor dst=203[.]0[.]113[.]44 dns=a7f3c2[.]cdn-metric[.]example bytes_out=512"], ["INFO", "2025-06-11 07:14:10 host=hr-ws-04 user=j.tan dst=203[.]0[.]113[.]44 dns=cdn-metric[.]example bytes_out=4180000 verdict=allowed rule=proxy-policy-4.2"], ["WARN", "2025-06-11 07:14:11 host=hr-ws-04 note=update client ran on its daily schedule 07:10, allowlist entry EXP-118 owner IT service desk"], ["INFO", "2025-06-11 07:15:04 host=mktg-ws-11 user=s.diaz dst=198[.]51[.]100[.]7 dns=cdn-metric[.]example bytes_out=2048 note=corporate telemetry agent heartbeat"], ["WARN", "2025-06-11 06:58:10 host=fin-ws-22 edr=process started C:\\Users\\Public\\svc-host.exe unsigned=yes parent=explorer.exe"], ["INFO", "2025-06-11 07:30:01 totals filter=cdn-metric -> fin-ws-22 12 connections, hr-ws-04 1 connection, mktg-ws-11 1 connection"], ["INFO", "CMDB extract: fin-ws-22 finance workstation criticality HIGH; hr-ws-04 HR laptop; mktg-ws-11 marketing laptop"]]}, "prompt": "Which host is most likely beaconing, and what makes the other two hosts normal?", "options": ["fin-ws-22: it calls the same address every five minutes with a small fixed upload, while hr-ws-04 matches the allowlisted updater and mktg-ws-11 runs the named telemetry agent.", "hr-ws-04: it is the only host that sends a large upload, while fin-ws-22 sends small keep-alive packets that match the approved proxy policy entry and mktg-ws-11 sends no proxy traffic.", "mktg-ws-11: it sends the smallest upload of the three hosts, while the other two hosts push far more data to the same domain and are owned by two business teams.", "fin-ws-22: it is the only host that resolves a name in this window, while the other two hosts connect straight to the address and never touch the DNS service."], "correct": [0], "explain": "A beacon is regular: the same destination, the same small size, the same short interval, and no business reason. The four fin-ws-22 lines repeat every five minutes with 512 bytes out. The EDR line also shows an unsigned program that started ten minutes before the first call. That combination is not a browser. The artefact itself explains the other two hosts. <b>hr-ws-04</b> sends one large upload at 07:14. That client is named in an allowlist entry with an owner, which is how a software updater behaves. <b>mktg-ws-11</b> sends a small heartbeat, and the log calls it a corporate telemetry agent. All three use the same vendor domain, so the domain alone proves nothing. The near-miss answers use one true detail in the wrong place. A large upload is normal for an updater. A small upload is normal for an agent. Nearly every program also resolves a name before it connects.", "tip": "Learn the shape of beaconing: same destination, same small size, regular interval, no owner and no business reason in the CMDB.", "hint": "Read the interval and the byte count of each host. Then ask one question per host: who asked for this traffic?"}, {"id": "MED-02", "type": "branch", "theme": "Attack Patterns & Threat Types", "title": "02:00 internal SMB scan on shift B", "brief": "Ticket #SOC-20418 · IDS alert 02:04 shift B · on-call IR rota week 24", "concepts": ["IDS and IPS alerts", "escalation matrix and on-call rota", "port scanning and reconnaissance"], "scenario": "<p>02:04, shift B. The IDS reports an internal host scanning the office network on port 445. Two analysts are on shift, the vulnerability scanner runs every day at 02:00, and the on-call IR engineer is at home.</p><p>Work through the decision path. Only one option at each step is defensible.</p>", "intro": "IDS alert IDS-77120: source 10[.]20[.]5[.]31 scanned 254 internal addresses on port 445 in 90 seconds. Severity in the tool: MEDIUM. The alert is four minutes old.", "prompt": "Work through the decision path. Only one option at each step is defensible.", "nodes": [{"text": "The alert is four minutes old. What do you do first?", "options": [{"t": "Ask the firewall team to block the whole 10[.]20[.]5[.]0/24 range first, before the scan reaches another floor.", "ok": false, "why": "That range holds the finance floor. Blocking it in the middle of the night buys you a business outage and still does not tell you who is scanning."}, {"t": "Close the alert as a false positive, because port 445 traffic inside an office network is only file sharing.", "ok": false, "why": "File sharing opens a few connections to a few servers. It does not touch 254 addresses in 90 seconds, so this is a real event that will come back."}, {"t": "Open the raw alert and check the signature, the source address, the destination range and the packet count.", "ok": true, "why": "Two minutes of validation tells you whether this is the scheduled 02:00 scan or an unknown host looking for open shares. Every later decision depends on that answer."}]}, {"text": "The source is not the scan appliance. What do you check next?", "options": [{"t": "Ask the network team to explain the scan, and wait for their answer before you do anything else.", "ok": false, "why": "The network team may answer in an hour. Waiting stops the case, and the SLA clock runs while the scan continues."}, {"t": "Look up the source and the destination in the CMDB to see which assets and which owners are involved.", "ok": true, "why": "Asset role decides the impact. A lab PC scanning servers is a different case from a server scanning the finance subnet, and the CMDB gives you the owner to call."}, {"t": "Start a full packet capture immediately, before you know which assets are on the two ends.", "ok": false, "why": "A capture of an unknown range fills the disk with data nobody asked for, and the case still has no owner. First the assets, then the evidence you need."}]}, {"text": "The CMDB shows an unmanaged lab PC scanning servers at 02:10. What is the correct escalation?", "options": [{"t": "Wait until 09:00 and put the case in the daily review list for the security manager on duty.", "ok": false, "why": "Six hours of scanning is enough time to find an open share. A possible intrusion does not wait for office hours, and the SLA target for SEV2 is far shorter."}, {"t": "Send one email to the security mailbox, then go back to the queue and let the morning shift read it.", "ok": false, "why": "An email is not an escalation. Nobody is accountable, nobody answers, and the next shift finds an open case with no decision in it."}, {"t": "Call the on-call IR engineer now, keep the case at SEV2 and record the time of the call in the ticket.", "ok": true, "why": "The escalation matrix exists for exactly this hour. A live scan from an unmanaged host is a possible intrusion, so the person who owns IR decisions must be woken, and the call must be in the record."}]}, {"text": "The engineer takes over. What must your handover contain?", "options": [{"t": "The alert id, the raw evidence, everything you checked, the current status and the next step you agreed.", "ok": true, "why": "A handover is a small case file. With those five items the next analyst can continue without repeating your work or asking you questions at 03:00."}, {"t": "A short verbal summary at the shift handover meeting, because the engineer can read the tool later.", "ok": false, "why": "The engineer is at home, not in the meeting, and a tool view shows events but not your reasoning. Verbal handovers disappear."}, {"t": "A new ticket for the incident team, and you close the alert to keep the L1 queue clean.", "ok": false, "why": "Closing the alert breaks the link between the IDS event and the investigation, and the metrics then show a closed alert instead of an open intrusion case."}]}], "explain": "An internal scan at 02:00 is either the daily vulnerability scanner or a real reconnaissance step. The path is always the same. Validate the alert against raw evidence, then understand which assets are involved. Escalate to the person who owns incident response at that hour. Then hand over a case that the next analyst can continue alone. The common mistakes at this severity are easy to name. One is acting before validating, for example blocking a whole subnet. Another is guessing a verdict without evidence, such as closing the alert as file sharing. A third is treating an email or a verbal note as an escalation. Attacker steps on the way to an intrusion often start with quiet internal scanning, so a scan from an unmanaged host is worth a phone call.", "tip": "Revise validation before escalation: read the raw alert, check the assets in the CMDB, then follow the escalation matrix for the hour you are working.", "hint": "At each step ask what you must know before the next decision is even possible."}, {"id": "MED-03", "type": "match", "theme": "Detection, Enrichment & Threat Context", "title": "Match the detection to the attack step", "brief": "Rule tuning ticket #DET-1180 · five noisy rules · ATT&CK review 14:00", "concepts": ["MITRE ATT&CK mapping", "detection rule logic and tuning", "LOLBins and living off the land", "ransomware alerts", "privilege escalation"], "scenario": "<p>The detection team meets at 14:00 to tune five noisy rules. Your job is to label every rule with the attacker goal it really detects, so that the backlog can be sorted. Several goals look alike on the screen.</p>", "prompt": "Match each detection rule with the attacker goal it detects.", "pairs": [{"left": "Office document macro starts an encoded PowerShell command", "right": "Execution"}, {"left": "New service installed by a non-admin process with an unsigned binary", "right": "Persistence"}, {"left": "Unsigned tool reads the memory of lsass.exe on a workstation", "right": "Credential Access"}, {"left": "vssadmin deletes the shadow copies of a file server at 03:10", "right": "Impact"}, {"left": "Remote service creation on a host that never answers SMB", "right": "Lateral Movement"}], "explain": "An attacker goal describes what the attacker wants at that moment. A macro that starts a command is the moment code runs, so the goal is <b>execution</b>. A service stays on the machine after a reboot, so its goal is <b>persistence</b>; it is not privilege escalation, because the rule shows no new rights. Reading lsass memory steals passwords, so the goal is <b>credential access</b>, not discovery, because the attacker takes secrets and not information about the network. Deleting shadow copies destroys the recovery path, so the goal is <b>impact</b>, which is what ransomware tools do before encryption. Creating a service on a second machine moves the attacker sideways, so the goal is <b>lateral movement</b>, not execution, because the code runs somewhere else. Labels decide tuning: a rule labelled with the wrong goal gets the wrong severity and the wrong response.", "tip": "Revise the attacker goals with one example each, and ask of every detection: does this run code, keep access, steal secrets, move hosts, or destroy data?", "hint": "For each rule ask one question: what does the attacker get out of this action, right now?"}, {"id": "MED-04", "type": "multi", "theme": "Triage Core & Workflow", "title": "Twelve alerts, one case to merge", "brief": "Ticket #SOC-20431 · queue snapshot 09:10 shift A · correlation review", "concepts": ["deduplication and alert correlation", "alert queue and worklist", "SOC metrics MTTD, MTTA, MTTR and false positive rate"], "scenario": "<p>Twelve alerts arrived between 07:50 and 09:10. The duty manager wants one case per incident, because the weekly metrics count every separate ticket and the numbers are growing. Your rule is: merge the alerts that share the same <b>host</b>, the same <b>user</b> and the same <b>15-minute window</b>.</p>", "artifact": {"kind": "table", "title": "queue-0910-shiftA.csv", "meta": "SIEM queue export · filter enabled", "head": ["Alert", "Time", "Host", "User", "Rule", "Source"], "rows": [["AL-9911", "09:02", "office-lap-14", "j.moreau", "Impossible travel sign-in", "identity"], ["AL-9912", "09:03", "office-lap-14", "j.moreau", "Office macro spawned PowerShell", "EDR"], ["AL-9913", "09:05", "office-lap-14", "j.moreau", "Connection to a known C2 domain", "proxy"], ["AL-9914", "09:04", "fin-ws-22", "r.okafor", "Impossible travel sign-in", "identity"], ["AL-9915", "09:06", "fin-ws-22", "r.okafor", "New scheduled task created", "EDR"], ["AL-9916", "08:12", "mktg-ws-11", "s.diaz", "Connection to a known C2 domain", "proxy"], ["AL-9917", "09:08", "hr-ws-04", "j.tan", "Office macro spawned PowerShell", "EDR"], ["AL-9918", "08:40", "vpn-gw-01", "n/a", "Brute force from three countries", "identity"], ["AL-9919", "09:01", "kiosk-02", "n/a", "USB storage device blocked", "EDR"], ["AL-9920", "08:55", "fin-ws-22", "r.okafor", "Large upload to a personal cloud", "DLP"], ["AL-9921", "07:50", "mail-gw-01", "n/a", "Phishing report from a user", "mail"], ["AL-9922", "09:07", "dev-ws-03", "k.novak", "LSASS memory read by an unsigned tool", "EDR"]]}, "prompt": "Select every alert that belongs to the same incident and must be merged into one case.", "options": ["AL-9914 · fin-ws-22 · r.okafor · Impossible travel sign-in", "AL-9916 · mktg-ws-11 · s.diaz · Connection to a known C2 domain", "AL-9917 · hr-ws-04 · j.tan · Office macro spawned PowerShell", "AL-9911 · office-lap-14 · j.moreau · Impossible travel sign-in", "AL-9912 · office-lap-14 · j.moreau · Office macro spawned PowerShell", "AL-9913 · office-lap-14 · j.moreau · Connection to a known C2 domain"], "correct": [3, 4, 5], "explain": "Correlation uses the three keys in the stated rule: same host, same user and same 15-minute window. AL-9911, AL-9912 and AL-9913 all sit on <b>office-lap-14</b> with user <b>j.moreau</b>, between 09:02 and 09:05. They are one incident, so they must be merged into a single case. The other options are near-misses built to look familiar. AL-9914 and AL-9916 repeat a rule name from the case, but for a different host and a different user. AL-9916 is also 53 minutes earlier. AL-9917 repeats the macro rule on another laptop. Merging by rule name alone hides two separate events inside one ticket. Both investigations then slow down, and the metrics show one long case instead of two clear ones.", "tip": "Revise correlation keys: host, user and time window first, tool or rule name last.", "hint": "Write the host and the user of every candidate next to its time. Only one group of three lines agrees on all of them."}, {"id": "MED-05", "type": "classify", "theme": "Telemetry & Alert Sources", "title": "Sort nine identity alerts into three boxes", "brief": "Ticket #SOC-20438 · 06:20 shift A · identity alert mini-queue", "concepts": ["identity and authentication logs", "risk scoring and prioritization models", "account takeover and impossible travel"], "scenario": "<p>Nine identity alerts wait in the mini-queue at 06:20. The written rule for this queue is: <b>P1 - act now</b> means the attacker already has access; <b>P2 - same shift</b> means a strong attack signal with no successful access yet; <b>P3 - close after a check</b> means a routine check that can wait until the queue is calm.</p>", "prompt": "Drag each identity alert into the correct box.", "buckets": ["P1 - act now", "P2 - same shift", "P3 - close after a check"], "items": [{"text": "Successful sign-in from Kyiv at 08:39 while the user sits in the Paris office and says it is not theirs", "bucket": "P1 - act now"}, {"text": "Sign-in over a legacy protocol from outside the company range, correct password, no MFA required", "bucket": "P1 - act now"}, {"text": "One refresh token used from two different countries inside five minutes", "bucket": "P1 - act now"}, {"text": "Password spray: 300 failed sign-ins on 40 accounts, no successful login in the same window", "bucket": "P2 - same shift"}, {"text": "Ten MFA push prompts refused by the same user inside two minutes", "bucket": "P2 - same shift"}, {"text": "New device enrolled at 03:00 for the finance director from an unrecognised city", "bucket": "P2 - same shift"}, {"text": "Impossible travel already blocked by conditional access for a user who reported the trip to the desk", "bucket": "P3 - close after a check"}, {"text": "Four failed sign-ins from the office network during a password reset the user asked for", "bucket": "P3 - close after a check"}, {"text": "Vendor support account signed in from the vendor office inside the approved maintenance window", "bucket": "P3 - close after a check"}], "explain": "The three boxes answer one question: does the attacker have access right now? A sign-in that <b>succeeded</b> from another country means the attacker is inside. So does a legacy protocol that skips MFA, and so does a token used from two countries. All three go to P1, where the clock is measured in minutes. Failed sprays, refused MFA prompts and a new device enrolment are serious attack signals. But no session was created, so a careful analyst works them in the same shift. The analyst also watches for the first success. The last group is explained by business context. The trip was reported, the reset was requested and the maintenance window is approved. So each one needs a short check and then a close. Sorting by how alarming a name sounds, instead of by whether access was gained, is the mistake this rule punishes.", "tip": "Revise the difference between an attack attempt and a successful access: only the second one is P1.", "hint": "For every card ask one question: did a session actually open for the attacker?"}, {"id": "MED-06", "type": "triage", "theme": "Attack Patterns & Threat Types", "title": "Four credential alerts before 09:00", "brief": "Queue export 09:00 shift A · identity and EDR · SLA 30 min for SEV1", "concepts": ["brute force and credential stuffing", "credential reset, session and token revocation", "account takeover and impossible travel"], "scenario": "<p>Four credential alerts are open on the same morning. Choose one action per alert. The queue rule says: stop an attacker who is already inside first, keep access closed, and never break a business service without a reason.</p>", "queueName": "SIEM identity queue - shift A 06:00-14:00", "prompt": "Choose the best action for every alert, then check your answer.", "alerts": [{"id": "INC-20511", "sev": "HIGH", "src": "Identity Protection", "title": "Distributed password spray still running", "detail": "1,842 failed sign-ins since 06:12 | 640 user names tried | 214 source addresses in 9 countries | no successful login so far | still active", "actions": ["Close the alert without further work, because failed sign-ins never cause any damage and this is pure noise in the queue.", "Add the top source ranges to the deny list in the identity provider and keep the case open at P2.", "Disable every account that was targeted until the user calls the service desk to restore it.", "Reset the password of every targeted user before the attacker guesses one of them."], "answer": 1, "outcome": "The spray stops for those ranges within 12 minutes, no account was accessed, and the case stays open at P2. Resetting 640 passwords would have sent hundreds of people to the service desk for nothing."}, {"id": "INC-20514", "sev": "CRITICAL", "src": "Identity Protection", "title": "Successful sign-in after the spray", "detail": "user a.fischer | 06:41 sign-in from 45[.]153[.]22[.]19 (Netherlands) | correct password | MFA satisfied by an existing session | inbox rule created 06:43", "actions": ["Leave the session open for one more hour so that you can collect evidence of what the attacker tries to do next.", "Close the case: a correct password plus a satisfied MFA prompt means that the real user signed in.", "Send the user an email and wait for the reply before you change anything on the account.", "Reset the password, revoke the sessions and refresh tokens, force a new MFA registration and check the mailbox rules."], "answer": 3, "outcome": "Sessions and tokens die within four minutes, the attacker loses the mailbox, the created inbox rule is removed, and the user re-registers MFA at the service desk. Waiting for an email reply would have left a live session in the mailbox."}, {"id": "INC-20517", "sev": "MEDIUM", "src": "EDR", "title": "Slow brute force against a service account", "detail": "account svc-backup | 480 failed RDP attempts over three weeks | source 10[.]20[.]5[.]44 internal | lockout threshold not reached | nightly backup job runs fine", "actions": ["Disable the svc-backup account at once: a service account must never be attacked.", "Reset the service account password and paste the new one into the ticket for the backup team.", "Close the alert as a false positive: every attempt failed, so nothing happened to the account.", "Isolate the internal source host and find which process on it is trying to log in as the service account."], "answer": 3, "outcome": "The source is a forgotten test script on a lab machine that kept an old password in a config file. The script is removed, the attempts stop, and the backup job was never touched."}, {"id": "INC-20521", "sev": "HIGH", "src": "Identity + VPN", "title": "Impossible travel on an active VPN session", "detail": "user m.dubois | 08:05 Paris office sign-in with MFA | 08:39 VPN session from 91[.]203[.]44[.]7 | user is in the office and says the session is not theirs | service desk called at 08:52", "actions": ["Ask the user to choose a new password the next time they log in to the office network.", "Rebuild the laptop from the standard image straight away, and check the identity logs after the rebuild.", "End the VPN session, revoke the user's tokens, reset the password and keep the laptop online for the endpoint check.", "Block the whole country at the firewall for every user and close the ticket as contained."], "answer": 2, "outcome": "The active session is killed, the tokens are revoked and the password is reset, while the endpoint team checks the laptop that stayed online. Blocking a country would have punished every traveller and still left the live session open."}], "explain": "Two of these rows are about access that already exists, and two are about access that is only being attempted, so the response is different. A distributed spray with no success is handled by cutting the loudest sources and watching. Mass password resets would create a service desk wave without closing any attacker session. A successful sign-in after a spray is an account takeover. The fastest fix is to revoke sessions and refresh tokens, then reset the password. You also force a new MFA registration and clean up what the attacker created. A slow brute force on a service account from an inside address needs the source host investigated, not the service disabled. Disabling the account would stop the nightly backup. Impossible travel with a live VPN session needs that session ended and the credentials changed. Blocking a country, waiting for the user to act, or reimaging the laptop first all leave the attacker's access open. They can also destroy evidence.", "tip": "Revise the difference between stopping an active session and hardening an account: revoke first when somebody is inside.", "hint": "For each row, ask whether the attacker has a live session right now. That decides the urgency and the tool."}, {"id": "MED-07", "type": "dual", "theme": "Attack Patterns & Threat Types", "title": "Supplier invoice change from a lookalike domain", "brief": "Ticket #SOC-20444 · BEC case INC-20444 · blue and red desks", "concepts": ["phishing and BEC alerts", "email quarantine and purge"], "scenario": "<p>A business email compromise case is open on two desks. The blue team must protect the money and keep the evidence. The red team must say what the attacker does next.</p><p>The case is INC-20444 and the finance cut-off for today's payments is 15:00. The mailbox owner is j.tan, who is still at his desk.</p>", "caseText": "From: accounts@supp1ier-billing[.]example | Subject: Updated bank details for invoice INV-88213 | Delivered to three mailboxes: ap@, finance.lead@, j.tan@ | j.tan replied at 09:14: 'Please confirm the new IBAN' | One link to hxxps://supp1ier-billing[.]example/invoice, no attachment | Gateway verdict: clean, first-seen domain, SPF pass (the domain is not spoofed)", "prompt": "Answer the blue team part and the red team part of the same case.", "parts": [{"role": "Blue team - what do you do first?", "prompt": "The message sits in three mailboxes and one reply has already left. Which first action protects the money and keeps the evidence?", "options": ["Reply to the message from the finance mailbox and ask the sender to prove the new bank details by email.", "Send a warning to all staff and leave the message in the mailboxes so that people can see this example.", "Quarantine the message and purge it from all three mailboxes, then collect the headers, the gateway log and the reply as evidence.", "Block the lookalike sender address in the gateway and wait for the real supplier to call the finance desk before you act."], "answer": 2, "explain": "Money moves when a human presses send, so the message must leave the mailboxes now: quarantine and purge on all three. Evidence collection costs nothing and happens in the same step, because headers, the gateway log and the reply are copied, not moved. Blocking one address leaves the delivered mail in place and the lookalike domain can simply send from another address. Answering the attacker tips them off and produces nothing you can use later. Leaving the mail in place as a training example risks a second click and a payment."}, {"role": "Red team - what is the next move?", "prompt": "The attacker still has access to the mailbox of j.tan. Which next move stays unnoticed longest?", "options": ["Create a hidden inbox rule that moves invoice replies to an archive folder, then delete the sent items.", "Send a new invoice email to every finance user from the mailbox of the compromised account.", "Change the mailbox password and the MFA phone number so that the attacker keeps the account.", "Export the whole mailbox to an external cloud drive in one large upload during the night."], "answer": 0, "explain": "A quiet attacker hides the conversation instead of starting one: a hidden inbox rule moves the replies away from the user's view and deleted sent items remove the trace of the answer. Mass mailing from the mailbox is loud and the gateway normally catches it. Changing the password and the MFA phone number locks the real user out immediately, which is the fastest way to be detected. A single large export to a cloud drive is a data transfer that DLP rules are built to alert on. The lesson for the blue team is that the mailbox must be checked for hidden rules, not only for the original message."}], "explain": "Both parts describe the same event from two sides. The blue team wins by removing the message from the mailboxes and keeping a copy of the evidence, because a payment can be authorised in minutes. The red team survives by staying quiet. Hidden rules and deleted sent items keep the conversation invisible. A new mass email, a forced password change or a large export each produce a loud signal.", "tip": "Revise BEC response order: purge from all mailboxes, collect headers and gateway logs, then check for hidden inbox rules.", "hint": "Ask what stops the money first, and what a quiet attacker would avoid doing."}, {"id": "MED-08", "type": "fill", "theme": "Response & Containment", "title": "Complete the containment note", "brief": "Ticket #SOC-20449 · INC-20449 · 11:05 shift A · finance laptop", "concepts": ["host isolation and containment", "escalation matrix and on-call rota"], "scenario": "<p>An EDR alert on a finance laptop was validated at 11:02. A payment batch is still running on the laptop. Complete the containment note with the four words that make the decision auditable.</p><p>The payment batch must reach the 11:30 cut-off, so the approval call cannot wait. Ticket INC-20449 belongs to shift A.</p>", "prompt": "Complete the containment note.", "text": "At 11:02 the EDR alert on the finance laptop was validated. The first containment step is to [[0]] the laptop from the network, but the payment batch needs 20 more minutes, so the analyst must call the [[1]] security engineer for approval before the machine goes offline. The note also records that the user's [[2]] access was closed, so the attacker cannot return through the office VPN, and that the laptop stays powered on and offline, because the [[3]] held in memory is lost when the machine restarts.", "blanks": ["isolate", "on-call", "network", "evidence"], "bank": ["on-call", "evidence", "reimage", "isolate", "notify", "network", "eradicate"], "explain": "Containment means cutting the attacker's path while keeping the company running, so the first word is <b>isolate</b>: the host loses the network and keeps its memory. Because the laptop is doing paid work, the decision needs the right approval. Outside office hours, that approval comes from the <b>on-call</b> security engineer named in the escalation matrix. Closing the user's <b>network</b> access removes the second path in, the VPN, which isolation alone does not close. The machine stays powered on because the <b>evidence</b> in memory disappears at shutdown. The bank words are the near-misses: reimage and eradicate are later stages that destroy evidence, and notify is communication, which is not containment.", "tip": "Revise the containment vocabulary: isolate the host, close the access, keep the memory, and get approval from the on-call rota.", "hint": "Two blanks are actions on the machine and on the account, one is a person, and one is what you must not destroy."}, {"id": "MED-09", "type": "rank", "theme": "Prioritization, Risk & Metrics", "title": "Rank five alerts with the CMDB open", "brief": "Ticket #SOC-20456 · 13:40 shift A · L2 queue · SLA clocks running", "concepts": ["risk scoring and prioritization models", "asset criticality and CMDB context", "SLA and OLA response targets"], "scenario": "<p>Five alerts arrive inside 20 minutes and every one of them has an SLA clock. The written queue rule is: <b>crown-jewel assets first (criticality 1)</b>, then criticality 2, then criticality 3; inside one criticality band, the alert with the least time left on its clock goes first.</p><p>The CMDB extract is in the table below.</p>", "artifact": {"kind": "table", "title": "cmdb-queue-1340.csv", "meta": "CMDB and SLA export · filter enabled", "head": ["Alert", "Asset", "CMDB criticality", "SLA clock left", "Business note"], "rows": [["A1 Kerberoasting attempt", "srv-dc-01 domain controller", "1 - crown jewel", "40 min", "authentication for all staff"], ["A2 C2 beaconing to a known address", "fin-lap-22 finance laptop", "2 - critical", "25 min", "user can approve payments"], ["A3 Suspicious admin login at 13:12", "srv-db-prod customer database", "1 - crown jewel", "1 h 50 min", "production customer data"], ["A4 Malware signature blocked", "dev-lap-07 developer laptop", "3 - standard", "15 min", "no production data"], ["A5 Phishing report from a user", "mktg-lap-11 marketing laptop", "3 - standard", "2 h 05 min", "no local admin rights"]]}, "prompt": "Drag the five alerts into priority order (highest priority on top).", "items": ["A1 Kerberoasting attempt on srv-dc-01", "A3 Suspicious admin login on srv-db-prod", "A2 C2 beaconing on fin-lap-22", "A4 Malware signature on dev-lap-07", "A5 Phishing report on mktg-lap-11"], "explain": "The rule has two keys and their order is the whole exercise. Asset criticality comes first, so both criticality 1 alerts are handled before anything else. Inside that band the clock decides: A1 has 40 minutes left, A3 has 1 hour 50. Criticality 2 follows with A2, the finance laptop that can approve payments. The last band is criticality 3, again ordered by the clock: A4 with 15 minutes and then A5 with 2 hours 5. The near-miss is to sort by the clock alone. That would put A4 on top, even though it is a standard developer laptop with a blocked signature. The second trap is to rank by how alarming the alert name sounds. A blocked malware signature sounds urgent, but it is the least important asset in the list.", "tip": "Revise two-key ranking: asset criticality first, SLA clock second, alert name never.", "hint": "Group the five alerts by CMDB criticality before you look at any clock."}, {"id": "MED-10", "type": "terminal", "theme": "Response & Containment", "title": "Close the sessions, then the laptop", "brief": "Ticket #SOC-20461 · INC-20461 · account takeover · 15:20", "concepts": ["credential reset, session and token revocation", "host isolation and containment", "EDR and XDR endpoint telemetry"], "scenario": "<p>An account takeover is confirmed at 15:20. The user works on a finance laptop and the attacker still holds a live session. You have the identity console and the EDR console in one shell. Complete the three steps in the terminal.</p>", "prompt": "Type the commands in the terminal. The goal of the current step is written under the terminal window.", "console": "soc-tools - identity and endpoint workbench", "consoleMode": "interactive session", "steps": [{"goal": "List the active sessions and refresh tokens of the user a.fischer in the identity platform.", "accept": ["^idp\\s+sessions?\\s+list\\s+(--user\\s+)?a\\.fischer$", "^idp\\s+sessions?\\s+list\\s+(--user\\s+)?a\\.fischer\\s+--active$", "^idp\\s+sessions?\\s+list\\s+--active\\s+(--user\\s+)?a\\.fischer$"], "out": "2 active sessions for a.fischer | par-office-ws-31 08:41 | unknown-device 08:39 source outside company range | refresh tokens: 4", "err": "That command does not list the sessions of one user. Name the user and the tool.", "example": "idp sessions list --user a.fischer"}, {"goal": "Revoke every refresh token of a.fischer.", "accept": ["^idp\\s+tokens?\\s+revoke\\s+(--user\\s+)?a\\.fischer\\s+--all$", "^idp\\s+tokens?\\s+revoke\\s+--all\\s+(--user\\s+)?a\\.fischer$", "^idp\\s+tokens?\\s+revoke\\s+(--user\\s+)?a\\.fischer\\s+--refresh$"], "out": "4 refresh tokens revoked for a.fischer | access tokens expire within 5 minutes | user must sign in again", "err": "That command does not revoke the tokens of that user. The step needs the revoke action, the user and all tokens.", "example": "idp tokens revoke --user a.fischer --all"}, {"goal": "Isolate the endpoint lap-fin-22 in the EDR console.", "accept": ["^edr\\s+(isolate|contain)\\s+(host\\s+)?lap-fin-22$", "^edr\\s+(isolate|contain)\\s+(host\\s+)?lap-fin-22\\s+--network-only$"], "out": "lap-fin-22 isolated from the network | process list and memory kept for collection | user notified by the service desk", "err": "That command does not isolate one endpoint. Ask the EDR console and name the host.", "example": "edr isolate lap-fin-22"}], "explain": "The order matters because the attacker is live. First you look at what exists. The two sessions show a sign-in from the office and one from an unknown device. That is the proof of the takeover. Then you take the access away. Revoking the refresh tokens is what really ends the attacker's stay. A stolen access token dies on its own in minutes, but a refresh token can rebuild the session again and again. Isolation of the endpoint comes after that. It needs the paid work on the laptop to stop, and it keeps the memory for the endpoint team. A reset password alone would not remove the tokens, and isolation alone would leave the identity path open.", "tip": "Revise the difference between an access token and a refresh token, then learn the identity and EDR commands used in a takeover.", "hint": "Three tools, three nouns: sessions, tokens, host."}, {"id": "MED-11", "type": "mcq", "theme": "Prioritization, Risk & Metrics", "title": "Which shift has the alert-fatigue problem", "brief": "Ticket #SOC-20468 · weekly SOC review pack · week 24", "concepts": ["SOC metrics MTTD, MTTA, MTTR and false positive rate", "alert fatigue"], "scenario": "<p>The weekly SOC review is at 16:00 and the manager says: <i>“One of the two shifts is showing alert fatigue. Show me the numbers.”</i> The table compares the two shifts for week 24.</p><p>Both shifts have four analysts. The queue owner is the SOC manager, and the review pack must be ready before the 16:00 call.</p>", "artifact": {"kind": "table", "title": "soc-metrics-week24.csv", "meta": "SOC dashboard export · filter enabled", "head": ["Metric", "Shift A", "Shift B"], "rows": [["Analysts on shift", "4", "4"], ["Alerts per analyst per shift", "38", "96"], ["True-positive rate", "31%", "6%"], ["Mean time to acknowledge (MTTA)", "6 min", "41 min"], ["Mean time to close (MTTR)", "52 min", "38 min"], ["Escalations to the second line per shift", "9", "2"], ["Alerts closed without review", "0%", "34%"], ["Overtime hours in the week", "3", "22"]]}, "prompt": "Which reading of the table describes alert fatigue correctly?", "options": ["Shift A: 22 overtime hours in the week against 3 in Shift B shows which team carries the heavier load.", "Shift B: 34% of alerts closed without review shows that the team is fast, and speed is what removes fatigue.", "Shift A: 9 escalations and 52 minutes to close show a queue that is clearly too heavy for one shift team.", "Shift B: 96 alerts per analyst, a 6% true-positive rate and 41 minutes to acknowledge is alert fatigue."], "correct": [3], "explain": "Alert fatigue is a volume problem with a quality problem inside it. Shift B sees 96 alerts per analyst, more than twice Shift A, and only 6% of them are real, so most of the work produces nothing. A slow acknowledge time of 41 minutes and 34% of alerts closed without review are the visible results. The other options use real numbers in the wrong place. Overtime is 22 hours for Shift B and 3 for Shift A, so the hours are read backwards. A fast close time does not remove fatigue, and closing without review hides alerts instead of handling them. Shift A's longer close time and nine escalations are what careful work looks like on a smaller, cleaner queue.", "tip": "Revise the SOC metric pair that detects fatigue: low alerts per analyst is good, low true-positive rate with a long acknowledge time is not.", "hint": "Compare volume per analyst and the true-positive rate first. Then check which shift those two numbers belong to."}, {"id": "MED-12", "type": "order", "theme": "Response & Containment", "title": "Put the takeover response in order", "brief": "Ticket #SOC-20473 · INC-20473 · 16:05 · next shift starts 22:00", "concepts": ["host isolation and containment", "escalation matrix and on-call rota", "shift handover and ticket notes"], "scenario": "<p>An account takeover on a finance laptop is confirmed at 16:05 and the next shift starts at 22:00. Put the six response steps in the correct order so that the case can be handed over cleanly.</p><p>The ticket is INC-20473 and shift A owns it. Shift A ends at 22:00 and the endpoint team is on call all night.</p>", "prompt": "Put the six steps in the correct order (the step you do first on top).", "items": ["Confirm with the user that the sign-in from the second country was not theirs, and note the answer in the ticket.", "Revoke every active session and refresh token of the account in the identity platform.", "Reset the password and force a new MFA registration at the next sign-in.", "Isolate the laptop from the network and ask the endpoint team to collect the evidence.", "Inform the on-call incident manager and the business owner, following the escalation matrix.", "Write the handover line for the next shift: status, what is contained, open questions and the next step."], "explain": "Confirmation comes before containment because a wrong containment locks out an employee who is travelling and creates a second incident for the service desk. Once the takeover is confirmed, the live attacker is stopped fastest by revoking sessions and tokens, which costs the user nothing but a new sign-in. The password reset and the new MFA registration close the way back in. Only then does the laptop go offline, because isolation stops paid work and needs the endpoint team ready to collect the memory. Communication comes after containment, so the message to the incident manager and the business owner describes what is already true. The handover line is written last, because it must describe the state after every action, not the state before them.", "tip": "Revise the takeover sequence: confirm, revoke, reset, isolate, communicate, hand over.", "hint": "Ask which step must be true before the next one can even start, and which one can only be written at the end."}];
var INTRO_HTML = "\n<div class=\"card\">\n  <div class=\"eyebrow\">Standalone certification exam · scenario-based · one keyword, four severity levels</div>\n  <h1 class=\"kw\" style=\"margin:.3rem 0 .2rem\">Alert Triage</h1>\n  <p class=\"sub\" style=\"font-size:1rem;color:var(--txt)\">Intermediate level. Every exercise mixes two ideas: read the artefact, then apply one triage rule. Distractors look reasonable, so slow down on the numbers and the timestamps.</p>\n  <div class=\"tiles\">\n    <div class=\"tile\"><div class=\"k\">Severity of this file</div><div class=\"v\"><span class=\"sev med\">MEDIUM</span></div></div>\n    <div class=\"tile\"><div class=\"k\">Passing score</div><div class=\"v\">80% of answered exercises</div></div>\n    <div class=\"tile\"><div class=\"k\">Time limit</div><div class=\"v\">42 minutes, pausable</div></div>\n    <div class=\"tile\"><div class=\"k\">Workload</div><div class=\"v\">12 exercises · 120 points</div></div>\n  </div>\n</div>\n\n\n<div class=\"card\">\n  <h2>Alert triage, one step deeper</h2>\n  <p class=\"sub\">Your keyword, in plain words. If you read this carefully, you can pass this file.</p>\n  <p><b>Alert triage</b> is the work of deciding what each alert really means and what must happen next.\n  At the easy level you asked “is this real?”. At this level you must also <b>connect alerts to each other</b>,\n  <b>understand the entity behind them</b> (a person, a service account, a server, a cloud role) and choose the\n  <b>right action at the right speed</b>.</p>\n  <p>Imagine you are the level 1 analyst on a Tuesday morning. Your queue holds four alerts that look unrelated:\n  a failed-login burst, a successful login from a new country, a mailbox rule that forwards invoices, and a\n  malware alert on a laptop. Your job is not to solve four problems. Your job is to see whether they are\n  <b>one</b> problem, and to say how urgent that problem is.</p>\n\n  <h3>What changes at this level</h3>\n  <ul class=\"tight\">\n    <li><b>Correlation.</b> The same user, host, address or time window can turn four medium alerts into one\n    high incident. Grouping them saves hours and shows the real story.</li>\n    <li><b>Severity is not priority.</b> Severity says how bad the event is. Priority says what you do first,\n    which depends on the asset, the data and the business clock. A medium alert on the payment database may\n    outrank a high alert on an empty test machine.</li>\n    <li><b>Containment choices.</b> Disable the account, reset the password, revoke the sessions and tokens,\n    isolate the endpoint, block the address, quarantine the mail. Every one of these has a cost, so you must\n    know which one fits the case.</li>\n    <li><b>Data sources grow.</b> Identity logs (Entra ID, Okta, Active Directory), cloud detection services,\n    proxies, DNS, email gateways and DLP all feed your queue, and each one speaks its own language.</li>\n  </ul>\n\n  <h3>Where this work happens</h3>\n  <ul class=\"tight\">\n    <li><b>SOC shifts:</b> the queue, the SLA clocks, the handover. The team works against a target time to\n    acknowledge and to close.</li>\n    <li><b>Incident response:</b> receives your escalation with a first timeline, an affected-asset list and a\n    recommendation.</li>\n    <li><b>Identity and cloud teams:</b> they own the accounts and the cloud roles you want to contain, so they\n    receive your request and act on it.</li>\n    <li><b>Detection engineering:</b> takes your false positives and your misses and tunes the rules.</li>\n    <li><b>Management:</b> reads the metrics - mean time to detect, to acknowledge and to resolve, and the\n    false-positive rate - and compares them with the service targets.</li>\n  </ul>\n\n  <h3>What good triage produces</h3>\n  <p>A ticket with a clear verdict and the evidence that supports it; a handoff that lets the next analyst\n  continue without re-reading everything; a containment action that stops the damage without breaking the\n  business; and honest numbers that show where the detection rules need work.</p>\n\n  <p class=\"muted\">In one sentence: at this level triage is about relationships - between alerts, between\n  alerts and assets, and between a decision and its cost.</p>\n</div>\n\n\n<div class=\"card\">\n  <h2>How this certification exam runs</h2>\n  <p class=\"sub\">The rules, the timer, the skip system and the exercise types. Read this once, then start whenever you are ready.</p>\n  <div class=\"grid2\">\n    <div class=\"box\">\n      <h4>Scoring</h4>\n      <ul class=\"tight\">\n        <li>Every exercise is worth <b>10 points</b>.</li>\n        <li>A correct answer gives <b>10 points</b>. A wrong answer gives <b>0 points</b>.</li>\n        <li>A hint costs <b>10% of that exercise</b> (1 point). A hint gives a nudge, never the answer.</li>\n        <li>In a <b>terminal exercise</b>, every wrong command also costs 1 point (10%), exactly like a hint.\n        You can always finish the exercise and keep the remaining points.</li>\n        <li>In a <b>branching exercise</b> or an <b>alert queue</b>, every decision or queue row must be right\n        for the exercise to score.</li>\n        <li>The percentage is computed <b>only over the exercises you actually answered</b>.</li>\n        <li>Passing score: <b>80%</b>. Below that, you retake the exam.</li>\n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Timer and breaks</h4>\n      <ul class=\"tight\">\n        <li>Total time for this file: <b>42 minutes</b>.</li>\n        <li>The countdown is always visible at the top of the screen.</li>\n        <li>Use <b>Pause</b> (or press <code>Esc</code>) when you take a break. While paused, the exercises are\n        hidden and blurred and the timer is stopped, so you cannot read the questions during the break.</li>\n        <li>When the time reaches zero, the exam is submitted automatically. Exercises left unanswered are excluded\n        from the score.</li>\n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Skip and review</h4>\n      <ul class=\"tight\">\n        <li><b>Every exercise has a Skip button.</b> Skipping is free, and it never shows the answer.</li>\n        <li>A skipped exercise goes to the <b>Skipped pool</b> (Exercise map, amber squares).</li>\n        <li>Before the exam can finish, you get a <b>“Review skipped exercises”</b> screen that lists every\n        skipped exercise and lets you go back to it.</li>\n        <li>You may return to skipped exercises as many times as you want, until the timer ends or you submit.</li>\n        <li>If you submit while an exercise is still unanswered, it is <b>excluded from the score</b>: not correct,\n        not wrong, and its points are not added to the total possible points.</li>\n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Exercise types in this file</h4>\n      <ul class=\"tight small\"><li>Alert queue simulation - choose the right action for every alert</li><li>Branching decision scenario - each choice unlocks the next step</li><li>Drag each card into the correct box</li><li>Drag the alerts to rank them by priority</li><li>Drag the steps into the right order</li><li>Dual perspective - the same case from the blue team and the red team</li><li>Fill in the blanks of a real document from a shuffled word bank</li><li>Interactive terminal where you type the real command</li><li>Log, table, e-mail or document analysis with a filter box</li><li>Match each item to the right answer</li><li>Multi-select question - several correct answers</li><li>Single-choice question on a realistic artefact</li></ul>\n      <p class=\"muted small\">Some exercises ask you to drag cards (mouse) - on a tablet you can also\n      tap a card and then tap the target box. Answers are shuffled at every attempt, and the whole exercise\n      order is shuffled again when you retake the exam.</p>\n    </div>\n    <div class=\"box\">\n      <h4>Words you will see (plain meanings)</h4>\n      <ul class=\"tight small\">\n        <li><b>alert</b> - a message from a security tool that something needs a human look.</li>\n        <li><b>triage</b> - sorting alerts: is it real, how bad, who acts and how fast.</li>\n        <li><b>SIEM</b> - the platform that collects logs and runs detection rules. <b>EDR</b> - the agent that\n        watches one endpoint and shows its processes and connections.</li>\n        <li><b>true positive / false positive / benign true positive</b> - a real problem / noise / real but allowed.</li>\n        <li><b>IOC</b> - indicator of compromise: a file hash, domain or address linked to an attack.\n        <b>TTP</b> - the way an attacker works.</li>\n        <li><b>enrichment</b> - adding context to an alert (who owns the host, is the file known bad).</li>\n        <li><b>escalation</b> - passing the case to a higher level with the facts it needs.</li>\n        <li><b>containment</b> - stopping the spread: isolate a host, disable an account, block a domain.</li>\n        <li><b>blast radius</b> - how far the attacker can reach from the first foothold.</li>\n        <li><b>SLA / OLA</b> - the promised response times, to the business and between internal teams.</li>\n        <li><b>MTTD / MTTA / MTTR</b> - mean time to detect / to acknowledge / to resolve.</li>\n        <li><b>SOAR</b> - software that runs the repetitive triage steps automatically.\n        <b>DLP</b> - a tool that watches for data leaving the company.</li>\n        <li><b>ATT&CK</b> - MITRE's public list of attacker tactics and techniques.\n        <b>kill chain</b> - the stages of an intrusion, from recon to exfiltration.</li>\n        <li><b>chain of custody</b> - the record of who handled evidence, when and why.</li>\n        <li><b>PIR</b> - post-incident review: the meeting that turns a case into improvements.</li>\n      </ul>\n    </div>\n    <div class=\"box\" style=\"border-color:#31527a\">\n      <h4>What the severity level means here</h4>\n      <p class=\"muted small\" style=\"margin-bottom:.4rem\">\n        <span class=\"sev med\">MEDIUM</span>\n      </p>\n      <p class=\"muted small\">MEDIUM - Intermediate. Most exercises need two steps: first read the log, table or queue correctly, then apply a rule such as correlation, asset criticality, SLA order or containment order. The wrong answers are close to the right one and often contain a true statement used in the wrong place. A careful beginner who read the explanation above can pass this file.</p>\n    </div>\n  </div>\n  <div class=\"qactions\">\n    <button class=\"btn primary lg\" onclick=\"startExam()\">Start the exam ▸</button>\n  </div>\n</div>\n\n<div class=\"box\"><h4>What this file tests - the keyword concept map</h4><p class=\"muted small\">The complete concept map of the keyword <b>Alert Triage</b>, grouped by theme. Every concept in this map is exercised in at least one of the four severity files of this exam set, so that no single file carries everything alone.</p><div class=\"legendline\"><span class=\"dot\"></span> Themes marked with the blue bar are covered by this exam file; the grey themes belong to the other severity levels.</div><div class=\"themes\"><div class=\"theme used\"><h4><span class=\"dot\"></span>Triage Core & Workflow</h4><div class=\"tags\"><span class=\"tag\">alert queue and worklist</span><span class=\"tag\">SLA and OLA response targets</span><span class=\"tag\">true positive vs false positive vs benign true positive</span><span class=\"tag\">alert fatigue</span><span class=\"tag\">deduplication and alert correlation</span><span class=\"tag\">triage playbook / SOP / runbook</span><span class=\"tag\">shift handover and ticket notes</span><span class=\"tag\">severity levels SEV1-SEV4 and priority vs severity</span><span class=\"tag\">alert validation before escalation</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Telemetry & Alert Sources</h4><div class=\"tags\"><span class=\"tag\">SIEM platform (Splunk, Elastic, Sentinel)</span><span class=\"tag\">EDR and XDR endpoint telemetry</span><span class=\"tag\">IDS and IPS alerts</span><span class=\"tag\">firewall, proxy and DNS logs</span><span class=\"tag\">cloud detection services</span><span class=\"tag\">identity and authentication logs</span><span class=\"tag\">email gateway and phishing reports</span><span class=\"tag\">DLP alert data</span><span class=\"tag\">honeypot and deception alerts</span><span class=\"tag\">log parsing and normalization</span><span class=\"tag\">log source health and pipeline latency</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Detection, Enrichment & Threat Context</h4><div class=\"tags\"><span class=\"tag\">IOC enrichment and reputation lookups</span><span class=\"tag\">sandbox detonation</span><span class=\"tag\">MITRE ATT&CK mapping</span><span class=\"tag\">cyber kill chain stages</span><span class=\"tag\">detection rule logic and tuning</span><span class=\"tag\">threat intel platform, MISP, STIX/TAXII</span><span class=\"tag\">vulnerability context (CVE, CVSS, exploitability)</span><span class=\"tag\">defanging IOCs and safe handling</span><span class=\"tag\">false positive suppression and allowlisting</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Prioritization, Risk & Metrics</h4><div class=\"tags\"><span class=\"tag\">asset criticality and CMDB context</span><span class=\"tag\">risk scoring and prioritization models</span><span class=\"tag\">blast radius and lateral movement assessment</span><span class=\"tag\">SOC metrics MTTD, MTTA, MTTR and false positive rate</span><span class=\"tag\">order of volatility for evidence</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Response & Containment</h4><div class=\"tags\"><span class=\"tag\">escalation matrix and on-call rota</span><span class=\"tag\">host isolation and containment</span><span class=\"tag\">containment authority and approval</span><span class=\"tag\">blocking at firewall, proxy and DNS sinkhole</span><span class=\"tag\">email quarantine and purge</span><span class=\"tag\">credential reset, session and token revocation</span><span class=\"tag\">evidence preservation and integrity</span><span class=\"tag\">chain of custody</span><span class=\"tag\">SOAR playbooks and automation</span></div></div><div class=\"theme\"><h4>Case Management & Handoff</h4><div class=\"tags\"><span class=\"tag\">ticketing and case management (ServiceNow, Jira, TheHive)</span><span class=\"tag\">handoff to threat hunting</span><span class=\"tag\">stakeholder communication and war room</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Attack Patterns & Threat Types</h4><div class=\"tags\"><span class=\"tag\">phishing and BEC alerts</span><span class=\"tag\">ransomware alerts</span><span class=\"tag\">brute force and credential stuffing</span><span class=\"tag\">C2 beaconing</span><span class=\"tag\">data exfiltration</span><span class=\"tag\">LOLBins and living off the land</span><span class=\"tag\">insider threat</span><span class=\"tag\">web shell and server compromise</span><span class=\"tag\">privilege escalation</span><span class=\"tag\">port scanning and reconnaissance</span><span class=\"tag\">account takeover and impossible travel</span><span class=\"tag\">supply chain and third-party compromise</span></div></div><div class=\"theme\"><h4>Governance, Frameworks & Improvement</h4><div class=\"tags\"><span class=\"tag\">NIST SP 800-61 incident handling lifecycle</span><span class=\"tag\">ISO/IEC 27035 incident management</span><span class=\"tag\">breach notification duties (GDPR 72h, NIS2)</span><span class=\"tag\">post-incident review and lessons learned</span><span class=\"tag\">purple team feedback and detection gaps</span></div></div></div></div>\n\n<div class=\"card\">\n  <h2>Before you start</h2>\n  <p class=\"sub\">One professional habit, and what happens after you submit.</p>\n  <div class=\"grid2\">\n    \n<div class=\"box\"><h4>Safety habit - defanged indicators</h4>\n<p class=\"muted small\">All addresses, domains and indicators in this exam are <b>defanged</b> - written in a\nsafe form, for example <code>hxxp://evil[.]example</code> or <code>10[.]0[.]0[.]1</code>. This is a normal\nprofessional habit: it stops a copy-paste from becoming a live link.</p></div>\n\n    <div class=\"box\"><h4>After submitting</h4>\n      <p class=\"muted small\">You get a full report: score, percentage, per-theme result, PASS or FAIL,\n      and an explanation for <b>every</b> exercise - including why the wrong answers are wrong and what to\n      revise. If you fail, a <b>Retake exam</b> button resets everything with new random orders.</p>\n    </div>\n  </div>\n  <div class=\"qactions\">\n    <button class=\"btn primary lg\" onclick=\"startExam()\">Start the exam ▸</button>\n  </div>\n</div>\n";

/* =========================================================================
   Alert Triage - standalone certification exam engine
   Vanilla JS. No libraries. Mouse + touch (click) support.
   Types: mcq, multi, log, order, rank, classify, match, fill, terminal,
          branch, triage (alert queue), dual (blue team / red team).
   ========================================================================= */
var MAXPTS = 10;               /* points per exercise */
var HINTCOST = 1;              /* hint = -10% of the exercise = 1 point */
var S = {pool:[], idx:0, res:{}, hints:{}, skipped:[], time:0, tid:null,
         paused:false, done:false, timeover:false, started:false};

/* ------------------------------- helpers ------------------------------- */
function $(sel, root){ return (root||document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function shuffle(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];
  });
}
function fmt(sec){
  sec = Math.max(0, sec|0);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function flash(msg){
  var f = $('#flashBox');
  if(!f){ return; }
  f.textContent = msg;
  f.style.display='block';
  setTimeout(function(){ f.style.display='none'; }, 4000);
}
function scrollTop(){ try{ window.scrollTo({top:0, behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); } }

/* --------------------------- exercise preparation ---------------------- */
function prepare(ex){
  var x = JSON.parse(JSON.stringify(ex));
  x._hint = 0;
  x._opts = null; x._display = null; x._items = null; x._bank = null; x._pool = null;
  if(x.type==='mcq' || x.type==='multi' || x.type==='log'){
    x._opts = shuffle(x.options.map(function(t,i){ return {t:t, ok:x.correct.indexOf(i)>=0}; }));
  }
  if(x.type==='classify'){
    x._items = shuffle(x.items.map(function(it){ return {text:it.text, bucket:it.bucket}; }));
  }
  if(x.type==='match'){
    var rights = x.pairs.map(function(p){ return p.right; }).filter(function(v,i,a){ return a.indexOf(v) === i; });
    x._pool = shuffle(rights);
  }
  if(x.type==='fill'){
    x._bank = shuffle(x.bank.slice());
  }
  if(x.type==='order' || x.type==='rank'){
    x._display = shuffle(x.items.slice());
  }
  if(x.type==='branch'){
    x._node = 0; x._firstTry = true; x._wrongPicks = 0;
    /* shuffle the options of every decision node so the correct choice is never in a fixed position */
    x.nodes = x.nodes.map(function(n){
      var nn = JSON.parse(JSON.stringify(n));
      nn.options = shuffle(nn.options);
      return nn;
    });
  }
  if(x.type==='terminal'){
    x._step = 0;
    x._wrong = 0;
    x._log = ['<div class="to">'+esc(x.console || 'soc-console 4.2 - analyst workstation')+' - session started</div>',
              '<div class="to">Type the command for the requested step, then press Enter.</div>'];
  }
  if(x.type==='triage'){
    /* shuffle the actions of every queue row so the correct action is never in a fixed slot */
    x._q = x.alerts.map(function(a){
      return {id:a.id, sev:a.sev, src:a.src, title:a.title, detail:a.detail, outcome:a.outcome,
              actions:shuffle(a.actions.map(function(t,i){ return {t:t, ok:i===a.answer}; }))};
    });
  }
  if(x.type==='dual'){
    x._parts = x.parts.map(function(p){
      return {role:p.role, prompt:p.prompt, explain:p.explain,
              options:shuffle(p.options.map(function(t,i){ return {t:t, ok:i===p.answer}; }))};
    });
  }
  return x;
}

/* --------------------------------- timer ------------------------------- */
function startExam(){
  S.pool   = shuffle(EXERCISES.slice()).map(prepare);
  S.idx    = 0;
  S.res    = {};
  S.hints  = {};
  S.skipped= [];
  S.done   = false;
  S.reported = false;   /* score bridge: one report per attempt */
  S.paused = false;
  S.timeover = false;
  S.started = true;
  S.time   = EXAM.minutes*60;
  document.body.classList.remove('paused');
  var ov = $('#pauseOv'); if(ov){ ov.style.display='none'; }
  if(S.tid){ clearInterval(S.tid); }
  S.tid = setInterval(tick, 1000);
  renderExam();
}
function tick(){
  if(S.paused || S.done){ return; }
  S.time--;
  if(S.time <= 0){ S.time = 0; updateHUD(); timeUp(); return; }
  updateHUD();
}
function timeUp(){
  S.timeover = true;
  S.done = true;
  if(S.tid){ clearInterval(S.tid); S.tid = null; }
  document.body.classList.remove('paused');
  var ov = $('#pauseOv'); if(ov){ ov.style.display='none'; }
  showResults();
}
function togglePause(){
  if(S.done || !S.started){ return; }
  S.paused = !S.paused;
  document.body.classList.toggle('paused', S.paused);
  var ov = $('#pauseOv');
  if(!ov){ ov = document.createElement('div'); ov.id='pauseOv'; ov.className='pauseov'; document.body.appendChild(ov); }
  if(S.paused){
    ov.innerHTML = '<div class="pausepanel"><h2>Timer paused</h2>'+
      '<p class="muted">The exercises are hidden and blurred while the timer is paused, so you cannot read them during the break.</p>'+
      '<p class="muted small">The countdown is stopped.</p>'+
      '<button class="btn primary" onclick="togglePause()">Resume exam</button></div>';
    ov.style.display = 'flex';
  } else {
    ov.style.display = 'none';
  }
  updateHUD();
}

/* ------------------------------ statistics ----------------------------- */
function stats(){
  var answered=0, correct=0, wrong=0, earned=0, possible=0, skippedLeft=0;
  S.pool.forEach(function(x){
    var r = S.res[x.id];
    if(!r || r.status==='skipped'){ skippedLeft++; return; }
    answered++; possible += MAXPTS; earned += r.earned;
    if(r.status==='correct'){ correct++; } else { wrong++; }
  });
  return {answered:answered, correct:correct, wrong:wrong, earned:earned,
          possible:possible, skipped:skippedLeft, total:S.pool.length};
}
function updateHUD(){
  var st = stats();
  var t = $('#hudTime');
  if(t){
    t.textContent = fmt(S.time);
    var pill = t.parentNode;
    pill.className = 'pill timer';
    if(S.time <= 60){ pill.className = 'pill timer low'; }
    else if(S.time <= EXAM.minutes*60*0.25){ pill.className = 'pill timer warn'; }
  }
  var sc = $('#hudScore');
  if(sc){
    var newText = st.earned + ' / ' + st.possible + ' pts';
    if(sc.textContent !== newText){
      sc.textContent = newText;
      var pill = sc.parentNode;
      if(pill && pill.classList){
        pill.classList.remove('bump');
        void pill.offsetWidth;
        pill.classList.add('bump');
      }
    }
  }
  var pct = st.total ? Math.round((st.answered/st.total)*100) : 0;
  var pr = $('#hudProg'); if(pr){ pr.style.width = pct + '%'; }
  var pc = $('#hudPct'); if(pc){ pc.textContent = pct + '% done'; }
  var sk = $('#hudSkip'); if(sk){ sk.textContent = st.skipped + ' skipped'; }
  var pb = $('#pauseBtn'); if(pb){ pb.textContent = S.paused ? '▶ Resume' : '⏸ Pause'; }
}

/* ------------------------------ artifacts ------------------------------ */
function artifactHTML(x){
  var a = x.artifact;
  if(!a){ return ''; }
  var h = '<div class="artifact">';
  h += '<div class="ahead"><span class="aname">'+esc(a.title||'artifact')+'</span>';
  h += '<span class="muted small">'+esc(a.meta||a.kind||'')+'</span></div>';
  if(a.kind==='log'){
    h += '<div class="abody"><input class="logfilter" placeholder="filter lines (like Kibana / Splunk) ..." oninput="filterLog(this)" />';
    h += '<div id="logbox">';
    (a.lines||[]).forEach(function(ln){
      var lv = ln[0]||'', txt = ln[1]||'';
      h += '<div class="logline lvline-'+esc(lv)+'" data-t="'+esc((lv+' '+txt).toLowerCase())+'">';
      if(lv){ h += '<span class="lv lv-'+esc(lv)+'">'+esc(lv)+'</span>'; }
      h += esc(txt)+'</div>';
    });
    h += '</div></div>';
  } else if(a.kind==='table'){
    h += '<div class="abody"><input class="logfilter" placeholder="filter rows (like a governance dashboard) ..." oninput="filterRows(this)" />';
    h += '<table class="art"><thead><tr>';
    (a.head||[]).forEach(function(c){ h += '<th>'+esc(c)+'</th>'; });
    h += '</tr></thead><tbody>';
    (a.rows||[]).forEach(function(r){
      h += '<tr data-t="'+esc(r.join(' ').toLowerCase())+'">';
      r.forEach(function(c){ h += '<td>'+esc(c)+'</td>'; });
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  } else if(a.kind==='email'){
    h += '<div class="emailbody">';
    (a.lines||[]).forEach(function(ln,i){
      h += '<div class="'+(i===0?'subj':'')+'">'+esc(ln)+'</div>';
    });
    h += '</div>';
  } else if(a.kind==='doc' || a.kind==='minutes'){
    h += '<div class="docbody">';
    (a.lines||[]).forEach(function(ln){
      var cls = (String(ln).indexOf('##')===0) ? 'h' : '';
      h += '<div class="'+cls+'">'+esc(String(ln).replace(/^##\s*/,''))+'</div>';
    });
    h += '</div>';
  } else {
    h += '<div class="abody">';
    (a.lines||[]).forEach(function(ln){ h += '<div class="logline">'+esc(ln)+'</div>'; });
    h += '</div>';
  }
  h += '</div>';
  return h;
}
function filterLog(inp){
  var q = inp.value.toLowerCase().trim();
  $$('#logbox .logline').forEach(function(el){
    var hit = !q || (el.getAttribute('data-t')||'').indexOf(q) >= 0;
    el.style.display = hit ? '' : 'none';
  });
}
function filterRows(inp){
  var q = inp.value.toLowerCase().trim();
  $$('table.art tbody tr').forEach(function(tr){
    var hit = !q || (tr.getAttribute('data-t')||'').indexOf(q) >= 0;
    tr.style.display = hit ? '' : 'none';
  });
}

/* --------------------------- shared UI blocks -------------------------- */
function qHeader(x, n){
  return '<div class="qmeta">'+
    '<span class="badge">Exercise '+n+' / '+S.pool.length+'</span>'+
    '<span class="badge theme">'+esc(x.theme)+'</span>'+
    '<span class="badge type">'+esc(String(x.type).toUpperCase())+'</span>'+
    (x.points ? '<span class="badge">'+x.points+'</span>' : '')+
  '</div>';
}
function scenarioHTML(x){
  if(!x.scenario){ return ''; }
  return '<div class="brief">'+esc(x.brief||'')+'</div>'+
         '<h2 class="qtitle">'+esc(x.title)+'</h2>'+
         '<div class="scenario">'+x.scenario+'</div>';
}
function sidePanel(){
  var h = '<aside class="side card"><h3>Exercise map</h3><div class="chips">';
  S.pool.forEach(function(x,i){
    var r = S.res[x.id], c = 'chipbtn';
    if(i===S.idx){ c += ' cur'; }
    if(r && r.status==='correct'){ c += ' good'; }
    else if(r && r.status==='wrong'){ c += ' bad'; }
    else if(S.skipped.indexOf(x.id) >= 0){ c += ' skip'; }
    h += '<button class="'+c+'" onclick="gotoIdx('+i+')" title="'+esc(x.title)+'">'+(i+1)+'</button>';
  });
  h += '</div>';
  h += '<div class="legend">'+
       '<span><i style="background:var(--ok)"></i>answered and correct</span>'+
       '<span><i style="background:var(--bad)"></i>answered and wrong</span>'+
       '<span><i style="background:var(--skip)"></i>skipped (in review pool)</span>'+
       '<span><i style="background:#101d33;border:1px solid #2c4266"></i>not answered yet</span>'+
       '</div>';
  h += '<div class="qactions" style="flex-direction:column">';
  h += '<button class="btn small" onclick="finishFlow()">Review skipped &amp; finish</button>';
  h += '<button class="btn small ghost" onclick="togglePause()">'+(S.paused?'Resume timer':'Pause timer')+'</button>';
  h += '</div>';
  h += '<p class="muted small" style="margin-top:.6rem">Passing score: <b>'+EXAM.passScore+'%</b> of the answered exercises. '+
       'Skipped exercises that stay unanswered are excluded from the score.</p>';
  return h + '</aside>';
}

/* ------------------------ interactive type renders --------------------- */
function optHTML(x){
  var multi = (x.correct && x.correct.length>1) || x.type==='multi';
  var h = '<div class="opts">';
