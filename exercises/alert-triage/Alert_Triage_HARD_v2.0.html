<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Alert Triage - HARD certification exam</title>
<style>

:root{
  --bg:#070d18; --bg2:#0c1526; --panel:#101c31; --panel2:#15234033;
  --line:#22334f; --line2:#2c4266;
  --txt:#e6eefc; --muted:#93a7c4; --dim:#6d80a0;
  --acc:#38bdf8; --acc2:#a78bfa;
  --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; --skip:#eab308;
  --easy:#22c55e; --med:#38bdf8; --hard:#f59e0b; --xh:#ef4444;
  --mono:"Cascadia Mono","Consolas","SFMono-Regular","Menlo",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 12% -10%,#12294a 0%,transparent 60%),
    radial-gradient(900px 500px at 105% 0%,#2a1b4d 0%,transparent 55%),
    var(--bg);
  color:var(--txt);
  font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.5; min-height:100vh;
}
h1,h2,h3,h4{margin:0 0 .5rem 0;line-height:1.25}
h1{font-size:1.5rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:.45rem 0}
a{color:var(--acc)}
.small{font-size:.85rem}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)} .acc{color:var(--acc)}
code,kbd{font-family:var(--mono);font-size:.86em;background:#0a1424;border:1px solid var(--line);
  border-radius:6px;padding:.08rem .35rem;color:#bde3ff}
hr{border:0;border-top:1px solid var(--line);margin:1rem 0}

/* ---------- top bar ---------- */
#topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,#0b1424f2,#0b1424d0);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px);
  padding:.6rem 1rem;
}
.tbrow{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;
  max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:.6rem;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04101f;
  display:grid;place-items:center;font-weight:800;font-size:.95rem}
.brand .tt{font-weight:700;font-size:.98rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .st{font-size:.76rem;color:var(--muted)}
.hud{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.pill{border:1px solid var(--line2);background:#0d1a2e;border-radius:999px;
  padding:.25rem .7rem;font-size:.85rem;display:flex;align-items:center;gap:.4rem}
.pill b{font-variant-numeric:tabular-nums}
.pill.timer.low{border-color:var(--bad);color:#ffd7d7;animation:pulse 1.2s infinite}
.pill.timer.warn{border-color:var(--warn);color:#ffe9c2}
.pill.bump{animation:bump .45s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14);border-color:var(--acc)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.sev{display:inline-flex;align-items:center;gap:.32rem;font-size:.68rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;border-radius:999px;padding:.1rem .5rem;border:1px solid currentColor;
  background:#0b1525;white-space:nowrap;vertical-align:middle}
.sev::before{content:"";width:.4rem;height:.4rem;border-radius:50%;background:currentColor;flex:0 0 auto}
.sev.easy{color:var(--easy)} .sev.medium{color:var(--med)}
.sev.hard{color:var(--hard)} .sev.xhard{color:var(--xh)}
.progwrap{height:8px;background:#0a1526;border:1px solid var(--line);border-radius:999px;overflow:hidden;
  max-width:1280px;margin:.55rem auto 0}
#hudProg{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .45s ease}

/* ---------- layout ---------- */
main{max-width:1280px;margin:1.1rem auto 4rem;padding:0 1rem}
.card{background:linear-gradient(180deg,var(--panel),#0d1728);border:1px solid var(--line);
  border-radius:16px;padding:1.1rem 1.2rem;box-shadow:0 10px 30px #0008}
.card + .card{margin-top:1rem}
.exam-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:1rem;align-items:start}
@media (max-width:960px){.exam-grid{grid-template-columns:1fr}.side{order:2}}
.qcard{min-width:0}
.side{position:sticky;top:96px}
@media (max-width:960px){.side{position:static}}

/* ---------- intro ---------- */
.eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:.92rem;margin:.15rem 0 .7rem;max-width:80ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.6rem;margin-top:.9rem}
.tile{border:1px solid var(--line);background:#0b1525;border-radius:12px;padding:.55rem .75rem}
.tile .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tile .v{font-size:1.05rem;font-weight:700;margin-top:.2rem;font-variant-numeric:tabular-nums}
.btn.lg{padding:.65rem 1.25rem;font-size:1rem}
.legendline{display:flex;align-items:center;gap:.45rem;font-size:.85rem;color:var(--muted);margin:.15rem 0 .8rem}
.legendline .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--acc);flex:0 0 auto}
.hero{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:flex-start}
.hero .kw{font-size:1.9rem;font-weight:800;line-height:1.15}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.9rem}
.box{border:1px solid var(--line);background:#0c1729;border-radius:12px;padding:.85rem .95rem}
.box h4{color:var(--acc);font-size:.95rem;text-transform:uppercase;letter-spacing:.05em}
ul.tight{margin:.35rem 0 .2rem 1.1rem;padding:0}
ul.tight li{margin:.2rem 0}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.8rem}
.theme{border:1px solid var(--line);border-radius:12px;padding:.7rem .85rem;background:#0b1525}
.theme.used{border-color:#31527a;background:#0c1a2c;box-shadow:inset 3px 0 0 var(--acc)}
.theme h4{display:flex;align-items:center;gap:.45rem}
.theme .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--acc);flex:0 0 auto}
.theme h4{font-size:.88rem;color:var(--acc2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.35rem}
.tags{display:flex;flex-wrap:wrap;gap:.3rem}
.tag{font-size:.76rem;border:1px solid var(--line2);background:#101f36;border-radius:999px;padding:.12rem .5rem;color:#cfe2ff}
.tag.strong{border-color:var(--acc);color:#d8f2ff}

/* ---------- buttons ---------- */
.btn{font:inherit;font-size:.92rem;cursor:pointer;border-radius:10px;padding:.5rem .95rem;
  border:1px solid var(--line2);background:#132340;color:var(--txt);transition:.15s}
.btn:hover{background:#1a2f52;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--acc),#2563eb);color:#04101f;font-weight:700;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.warn{border-color:#7c5a10;color:#ffe1a8;background:#2a2008}
.btn.bad{border-color:#7f1d1d;background:#2a0f12;color:#ffc9c9}
.btn.small{font-size:.82rem;padding:.3rem .6rem}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.qactions{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1rem}

/* ---------- question ---------- */
.qmeta{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin-bottom:.6rem}
.badge{font-size:.75rem;border-radius:999px;padding:.16rem .6rem;border:1px solid var(--line2);color:#cfe2ff;background:#101f36}
.badge.theme{border-color:var(--acc2);color:#e3d9ff}
.badge.type{border-color:#3f6f5a;color:#c8ffe4}
.brief{font-family:var(--mono);font-size:.8rem;color:#9fd0ff;border-left:3px solid var(--acc);
  padding:.25rem .6rem;background:#0a1a2c;border-radius:0 8px 8px 0;margin-bottom:.6rem}
.qtitle{font-size:1.18rem;font-weight:700}
.scenario{background:#0a1322;border:1px solid var(--line);border-radius:12px;padding:.8rem .95rem;margin:.7rem 0}
.scenario p{margin:.4rem 0}
.promptline{font-weight:600;margin:.7rem 0 .5rem}

/* ---------- artifacts ---------- */
.artifact{border:1px solid var(--line2);border-radius:12px;overflow:hidden;margin:.7rem 0;background:#08111f}
.artifact .ahead{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:space-between;align-items:center;
  background:#0e1c31;padding:.45rem .7rem;border-bottom:1px solid var(--line);font-size:.85rem}
.artifact .ahead .aname{font-family:var(--mono);color:#bfe4ff}
.artifact .abody{padding:.6rem .7rem;font-family:var(--mono);font-size:.82rem;overflow-x:auto}
.logline{white-space:pre-wrap;word-break:break-word;padding:.1rem .25rem;border-left:3px solid transparent}
.logline .lv{display:inline-block;min-width:4.4em;font-weight:700}
.lv-ERR,.lv-CRIT{color:#ff9b9b} .logline.lvline-ERR,.logline.lvline-CRIT{border-left-color:var(--bad);background:#2a0f1210}
.lv-WARN{color:#ffd08a} .logline.lvline-WARN{border-left-color:var(--warn);background:#2a200810}
.lv-INFO{color:#9fd0ff}
.lv-OK{color:#9cf0bd} .logline.lvline-OK{border-left-color:var(--ok);background:#0e2a1a10}
.logline:hover{background:#12233c}
.logfilter{width:100%;margin:0 0 .5rem 0;padding:.35rem .55rem;background:#0a1526;border:1px solid var(--line2);
  border-radius:8px;color:var(--txt);font-family:var(--mono);font-size:.82rem}
.docbody{padding:.75rem .9rem;font-size:.88rem;white-space:pre-wrap;font-family:"Segoe UI",Roboto,sans-serif}
.docbody .h{color:var(--acc);font-weight:700}
.docbody em{color:var(--warn);font-style:normal}
table.art{width:100%;border-collapse:collapse;font-size:.84rem}
table.art th,table.art td{border:1px solid var(--line);padding:.35rem .5rem;text-align:left;vertical-align:top}
table.art th{background:#0e1c31;color:#bfe4ff;font-weight:600}
table.art tr:nth-child(even) td{background:#0b1524}
.emailbody{padding:.75rem .9rem;font-size:.88rem}
.emailbody .subj{color:var(--warn);font-weight:600;margin-bottom:.3rem}

/* ---------- options ---------- */
.opts{display:grid;gap:.5rem;margin:.5rem 0}
.opt{display:flex;gap:.6rem;align-items:flex-start;border:1px solid var(--line);background:#0c1729;
  border-radius:10px;padding:.55rem .7rem;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--acc);background:#102138}
.opt input{margin-top:.25rem;accent-color:var(--acc)}
.opt .mk{min-width:1.1em;font-weight:800}
.opt.ok{border-color:var(--ok);background:#0d2a1a}
.opt.bad{border-color:var(--bad);background:#2a0f12}
.opt.chosen{box-shadow:inset 0 0 0 1px #ffffff22}
.opts.locked .opt{cursor:default}

/* ---------- sorting / order / rank ---------- */
.sortlist{list-style:none;margin:.5rem 0;padding:0;display:grid;gap:.45rem}
.sortlist li{display:flex;gap:.55rem;align-items:center;border:1px solid var(--line);background:#0c1729;
  border-radius:10px;padding:.5rem .65rem;cursor:grab}
.sortlist li.dragging{opacity:.4}
.sortlist li.over{border-color:var(--acc);background:#102138}
.sortlist .grip{color:var(--dim);cursor:grab}
.sortlist .txt{flex:1;min-width:0}
.sortlist .mv{display:flex;flex-direction:column;gap:.1rem}
.sortlist .mv button{font-size:.62rem;line-height:1;padding:.15rem .3rem;border-radius:6px;border:1px solid var(--line2);
  background:#132340;color:var(--txt);cursor:pointer}
.ranklabel{font-family:var(--mono);font-size:.75rem;color:var(--dim);text-align:center;min-width:1.6em}
.rank .sortlist li{border-left:3px solid var(--acc)}

/* ---------- buckets / classify ---------- */
.bank{display:flex;flex-wrap:wrap;gap:.4rem;border:1px dashed var(--line2);border-radius:12px;
  padding:.55rem;min-height:52px;background:#0a1424}
.chip{border:1px solid var(--line2);background:#132340;border-radius:999px;padding:.32rem .7rem;font-size:.86rem;
  cursor:grab;user-select:none;transition:.15s}
.chip:hover{border-color:var(--acc)}
.chip.sel{border-color:var(--acc);background:#1b3557;box-shadow:0 0 0 2px #38bdf855}
.chip.placed{background:#16283f}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.65rem;margin-top:.7rem}
.bucket{border:1px solid var(--line2);border-radius:12px;background:#0b1525;padding:.5rem}
.bucket h4{font-size:.86rem;color:var(--acc2);margin-bottom:.4rem}
.bucket .drop{display:flex;flex-wrap:wrap;gap:.35rem;min-height:48px;border-radius:8px;padding:.25rem}
.bucket.hot .drop{background:#12233c;outline:1px dashed var(--acc)}
.bucket.ok{border-color:var(--ok)} .bucket.bad{border-color:var(--bad)}

/* ---------- fill in the blank ---------- */
.filltext{font-size:1.02rem;background:#0a1322;border:1px solid var(--line);border-radius:12px;padding:.85rem .95rem}
.slot{display:inline-block;min-width:110px;text-align:center;border-bottom:2px dashed var(--acc);
  padding:.1rem .45rem;margin:.1rem .15rem;border-radius:6px;cursor:pointer;color:#bde3ff;font-weight:600}
.slot.empty{color:var(--dim);font-weight:400}
.slot:hover{background:#12233c}
.slot.filled{border-bottom-style:solid}
.blankok{border-bottom-color:var(--ok)!important;color:#b9f6ce}
.blankbad{border-bottom-color:var(--bad)!important;color:#ffc2c2;text-decoration:line-through}

/* ---------- matching ---------- */
table.match{width:100%;border-collapse:collapse;font-size:.88rem;margin:.5rem 0}
table.match td{border-bottom:1px solid var(--line);padding:.45rem .5rem;vertical-align:middle}
table.match td.l{width:46%}
table.match select{width:100%;padding:.35rem .45rem;background:#0a1526;color:var(--txt);
  border:1px solid var(--line2);border-radius:8px;font:inherit;font-size:.86rem}
table.match tr.ok td{border-bottom-color:var(--ok)} table.match tr.bad td{border-bottom-color:var(--bad)}

/* ---------- terminal ---------- */
.term{background:#05090f;border:1px solid #1d3350;border-radius:12px;overflow:hidden;margin:.6rem 0}
.term .tbar{background:#0c1729;padding:.35rem .6rem;font-size:.78rem;color:var(--muted);display:flex;
  justify-content:space-between;border-bottom:1px solid #1d3350}
.term-out{padding:.6rem .7rem;font-family:var(--mono);font-size:.83rem;max-height:320px;overflow:auto;white-space:pre-wrap}
.term-out .tl{color:#dbe9ff} .term-out .tp{color:#67e8f9}
.term-out .to{color:#9fb4d0;padding-left:.2rem} .term-out .okout{color:#9cf0bd} .term-out .errout{color:#ff9b9b}
.term-goal{padding:.45rem .7rem;background:#0b1525;border-top:1px solid #1d3350;font-size:.84rem}
.term-line{display:flex;gap:.5rem;align-items:center;padding:.5rem .7rem;border-top:1px solid #1d3350;background:#070d18}
.term-line input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#dbe9ff;font-family:var(--mono);font-size:.86rem}
.term-line .ps1{color:#67e8f9;font-family:var(--mono);font-size:.83rem;white-space:nowrap}

/* ---------- branch ---------- */
.branchnode{border:1px solid var(--line2);border-radius:12px;padding:.8rem .95rem;background:#0b1525;margin:.5rem 0}
.bnum{font-size:.78rem;color:var(--acc);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.35rem}
.bopts{display:grid;gap:.45rem;margin-top:.6rem}
.bopt{text-align:left;font:inherit;font-size:.9rem;cursor:pointer;border:1px solid var(--line2);
  background:#101d33;color:var(--txt);border-radius:10px;padding:.55rem .7rem}
.bopt:hover{border-color:var(--acc);background:#152a48}
.bopt.dead{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.bfb{margin-top:.6rem;border-radius:10px;padding:.55rem .7rem;font-size:.88rem;display:none}
.bfb.okfb{display:block;background:#0d2a1a;border:1px solid var(--ok)}
.bfb.badfb{display:block;background:#2a0f12;border:1px solid var(--bad)}

/* ---------- feedback / locked ---------- */
.locked{margin-top:.8rem;border-radius:12px;padding:.85rem .95rem;border:1px solid var(--line2);background:#0c1729}
.locked.good{border-color:var(--ok);background:linear-gradient(180deg,#0d2a1a,#0b1525)}
.locked.bad{border-color:var(--bad);background:linear-gradient(180deg,#2a0f12,#0b1525)}
.locked h3{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.exp{margin:.5rem 0}
.ansline{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.6rem;margin-top:.6rem}
.ansline > div{border:1px solid var(--line);border-radius:10px;padding:.5rem .65rem;background:#0a1424;font-size:.86rem}
.lbl{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.25rem}
.tip{margin-top:.7rem;border-left:3px solid var(--warn);background:#2a2008;border-radius:0 10px 10px 0;padding:.5rem .7rem;font-size:.88rem}
.hintbox{margin-top:.7rem;border-left:3px solid var(--acc2);background:#1a1233;border-radius:0 10px 10px 0;padding:.55rem .7rem;font-size:.88rem}
.flash{margin-top:.6rem;color:#ffd08a;font-size:.88rem}
.ansSummary table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.4rem}
.ansSummary th,.ansSummary td{border:1px solid var(--line);padding:.3rem .5rem;text-align:left}
.ansSummary th{background:#0e1c31;color:#bfe4ff}

/* ---------- side panel ---------- */
.side .chips{display:flex;flex-wrap:wrap;gap:.3rem;margin:.4rem 0 .7rem}
.chipbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:#101d33;color:var(--txt);
  font:inherit;font-size:.85rem;cursor:pointer}
.chipbtn.cur{outline:2px solid var(--acc);outline-offset:1px}
.chipbtn.good{background:#0d3320;border-color:var(--ok)}
.chipbtn.bad{background:#33121a;border-color:var(--bad)}
.chipbtn.skip{background:#33280a;border-color:var(--skip)}
.legend{display:grid;gap:.25rem;font-size:.8rem;color:var(--muted);margin-bottom:.7rem}
.legend span i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.4rem}

/* ---------- review skipped ---------- */
.skipList{list-style:none;padding:0;margin:.6rem 0;display:grid;gap:.5rem}
.skipList li{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;align-items:center;
  border:1px solid var(--line);border-left:4px solid var(--skip);background:#1a1508;border-radius:10px;padding:.6rem .8rem}

/* ---------- results ---------- */
.resulthead{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:center}
.bigscore{font-size:3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.cert{border:2px solid var(--acc);border-radius:16px;padding:1.1rem 1.3rem;margin-top:1rem;
  background:linear-gradient(135deg,#0b1f36,#141033);text-align:center}
.cert .ct{font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.cert .cn{font-size:1.5rem;font-weight:800;margin:.3rem 0}
.cert .cs{font-size:1rem;color:#cfe2ff}
.bars{display:grid;gap:.5rem;margin-top:.6rem}
.bar{display:grid;grid-template-columns:200px 1fr 90px;gap:.6rem;align-items:center;font-size:.85rem}
@media (max-width:640px){.bar{grid-template-columns:130px 1fr 70px}}
.bar .track{height:10px;background:#0a1526;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));width:0;transition:width .5s}
.report{display:grid;gap:.8rem;margin-top:.7rem}
.rep{border:1px solid var(--line);border-radius:12px;padding:.75rem .9rem;background:#0b1525}
.rep.good{border-left:4px solid var(--ok)} .rep.bad{border-left:4px solid var(--bad)} .rep.na{border-left:4px solid var(--skip)}
.rep .rhead{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:space-between;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin-top:.8rem}
.stat{border:1px solid var(--line);border-radius:12px;padding:.6rem .75rem;background:#0b1525}
.stat .n{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat .k{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* ---------- pause overlay ---------- */
body.paused #stage{filter:blur(14px);pointer-events:none;user-select:none}
.pauseov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;
  background:#050a12cc;backdrop-filter:blur(3px);padding:1rem}
.pausepanel{max-width:520px;border:1px solid var(--acc);border-radius:16px;background:#0b1525;padding:1.2rem 1.3rem;text-align:center}

footer{max-width:1280px;margin:0 auto;padding:0 1rem 2rem;color:var(--dim);font-size:.8rem}

/* ---------- alert queue (triage type) ---------- */
.triage{display:grid;gap:.7rem;margin:.6rem 0}
