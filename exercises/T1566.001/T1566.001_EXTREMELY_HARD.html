<script>
window.EXAM = {"meta": {"topicId": "t1566.001", "batch": 4, "title": "T1566.001 Phishing: Spearphishing Attachment — EXTREMELY HARD", "difficulty": "extremely-hard", "questionCount": 12, "estimatedMinutes": 55, "passMark": 70}, "timerSec": 3300, "difficultyLabel": "EXTREMELY HARD", "subtitle": "CyberPulseAcademy practice exam — batch 4 of 4 • everything loads from this one file", "themes": [{"name": "Technique Identity & Family", "chips": ["T1566.001 Spearphishing Attachment", "Parent T1566 Phishing", "T1566.002 Spearphishing Link", "T1566.003 Spearphishing via Service", "T1566.004 Spearphishing Voice", "Initial Access TA0001", "ATT&CK Enterprise v2.2"]}, {"name": "Adversary Behaviour & Lure Craft", "chips": ["Plausible pretext", "Enable-content prompt", "ZIP password in email body", "Extension & icon manipulation", "Exploit or direct execution", "Archive types ZIP / RAR / ISO / CHM / HWP / LNK"]}, {"name": "Lifecycle Position & Next Steps", "chips": ["First foothold", "User Execution T1204", "Exploitation for Client Execution T1203", "PowerShell T1059.001", "Ingress Tool Transfer T1105", "Attachment vs link vs service trade-offs"]}, {"name": "Platforms & Execution Context", "chips": ["Linux", "Windows", "macOS", "User permission required", "One chosen target at a time"]}, {"name": "Data Sources & Telemetry", "chips": ["Email gateway logs", "File creation on disk", "Process execution (Office spawning shells)", "Outbound network flow", "User mail directories", "Mail.app logs (macOS)"]}, {"name": "Detection Logic & Analytics", "chips": ["DET0236 Detection Strategy", "AN0655 Windows correlation", "AN0656 Linux correlation", "AN0657 macOS correlation", "Detonation / sandboxing", "Mark-of-the-Web", "False-positive tuning"]}, {"name": "Mitigations & Controls", "chips": ["M1049 Antivirus/Antimalware", "M1047 Audit", "M1031 Network Intrusion Prevention", "M1021 Restrict Web-Based Content", "M1054 Software Configuration", "M1018 User Account Management", "M1017 User Training"]}, {"name": "Threat Actor Usage & Real-World Work", "chips": ["APT28 G0007", "APT29 G0016", "APT37 G0067", "APT-C-36 G0099", "Cobalt Group G0080", "Kimsuky G0094", "Emotet S0367", "SOC triage", "IR evidence", "CTI reporting", "Awareness training", "Red-team emulation"]}], "introExpl": "\n<h3>What you will learn<\/h3>\n<p>This exam is about one MITRE ATT&amp;CK object: <b>T1566.001 &mdash; Phishing: Spearphishing Attachment<\/b>.<\/p>\n<p><b>What kind of object is this?<\/b> T1566.001 is a <b>sub-technique<\/b>. A sub-technique is one specific way to do a bigger thing. The bigger thing here is the technique <b>T1566 &mdash; Phishing<\/b>. Phishing has four sub-techniques: a malicious file attached to an email (T1566.001), a bad link inside an email (T1566.002), phishing through a trusted service (T1566.003), and phishing by phone call (T1566.004). This exam is only about the <b>attachment<\/b> form. In the ATT&amp;CK matrix it sits in the tactic <b>Initial Access (TA0001)<\/b> &mdash; the first step of an attack.<\/p>\n<p><b>What does the attacker do?<\/b> Imagine you get an email that looks normal. It says: &ldquo;Your invoice is attached.&rdquo; A file is attached: a Word document, a PDF, an archive like ZIP or RAR, or an executable. The email gives you a believable reason to open the file. Sometimes it even tells you how to unlock it &mdash; for example, a ZIP password written in the email. That trick helps the attacker slip past email scanners, because a scanner cannot open a password-protected archive. When you open the file, hidden code runs. Sometimes the file uses a bug in the program (an exploit). Sometimes it only asks you to click &ldquo;Enable content&rdquo;. Attackers also fake file names and icons, so a program looks like a simple document.<\/p>\n<p><b>Where is this used at work?<\/b> You will meet T1566.001 in many roles. A <b>SOC analyst<\/b> triages alerts from the mail gateway and the endpoint. An <b>incident responder<\/b> collects the attachment and the evidence on the machine. A <b>detection engineer<\/b> builds analytics like ATT&amp;CK&rsquo;s <b>DET0236<\/b>: it links email delivery, file creation, and abnormal process execution &mdash; for example Word spawning PowerShell or CMD. A <b>threat-intel analyst<\/b> tracks the many groups that use it: APT28, APT29, APT37, APT-C-36, Cobalt Group, Kimsuky, and malware like Emotet. An <b>awareness trainer<\/b> teaches staff to report invoice and shipping lures. A <b>red teamer<\/b> imitates this attack to test the mail defences. A <b>GRC or control owner<\/b> maps the mitigations &mdash; M1049, M1021, M1054, M1017 and others &mdash; to this risk.<\/p>\n<p><b>Why does it matter?<\/b> The spearphishing attachment is one of the most common first steps of a real intrusion. Ransomware gangs, spies and e-crime groups all start here. If you can stop it, you stop the whole attack before it starts.<\/p>\n", "introThemes": "<div class=\"kwgroup\"><h5>Technique Identity & Family<\/h5><div class=\"themechips\"><span>T1566.001 Spearphishing Attachment<\/span><span>Parent T1566 Phishing<\/span><span>T1566.002 Spearphishing Link<\/span><span>T1566.003 Spearphishing via Service<\/span><span>T1566.004 Spearphishing Voice<\/span><span>Initial Access TA0001<\/span><span>ATT&CK Enterprise v2.2<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Adversary Behaviour & Lure Craft<\/h5><div class=\"themechips\"><span>Plausible pretext<\/span><span>Enable-content prompt<\/span><span>ZIP password in email body<\/span><span>Extension & icon manipulation<\/span><span>Exploit or direct execution<\/span><span>Archive types ZIP / RAR / ISO / CHM / HWP / LNK<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Lifecycle Position & Next Steps<\/h5><div class=\"themechips\"><span>First foothold<\/span><span>User Execution T1204<\/span><span>Exploitation for Client Execution T1203<\/span><span>PowerShell T1059.001<\/span><span>Ingress Tool Transfer T1105<\/span><span>Attachment vs link vs service trade-offs<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Platforms & Execution Context<\/h5><div class=\"themechips\"><span>Linux<\/span><span>Windows<\/span><span>macOS<\/span><span>User permission required<\/span><span>One chosen target at a time<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Data Sources & Telemetry<\/h5><div class=\"themechips\"><span>Email gateway logs<\/span><span>File creation on disk<\/span><span>Process execution (Office spawning shells)<\/span><span>Outbound network flow<\/span><span>User mail directories<\/span><span>Mail.app logs (macOS)<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Detection Logic & Analytics<\/h5><div class=\"themechips\"><span>DET0236 Detection Strategy<\/span><span>AN0655 Windows correlation<\/span><span>AN0656 Linux correlation<\/span><span>AN0657 macOS correlation<\/span><span>Detonation / sandboxing<\/span><span>Mark-of-the-Web<\/span><span>False-positive tuning<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Mitigations & Controls<\/h5><div class=\"themechips\"><span>M1049 Antivirus/Antimalware<\/span><span>M1047 Audit<\/span><span>M1031 Network Intrusion Prevention<\/span><span>M1021 Restrict Web-Based Content<\/span><span>M1054 Software Configuration<\/span><span>M1018 User Account Management<\/span><span>M1017 User Training<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Threat Actor Usage & Real-World Work<\/h5><div class=\"themechips\"><span>APT28 G0007<\/span><span>APT29 G0016<\/span><span>APT37 G0067<\/span><span>APT-C-36 G0099<\/span><span>Cobalt Group G0080<\/span><span>Kimsuky G0094<\/span><span>Emotet S0367<\/span><span>SOC triage<\/span><span>IR evidence<\/span><span>CTI reporting<\/span><span>Awareness training<\/span><span>Red-team emulation<\/span><\/div><\/div>", "introRules": "\n<p><b>Goal:<\/b> master the ATT&amp;CK sub-technique <b>T1566.001 Spearphishing Attachment<\/b> at <b>EXTREMELY HARD<\/b> level. This tier mirrors a senior analyst&rsquo;s day: three or more concepts chained per exercise, <b>conflicting signals you must resolve out loud<\/b>, irrelevant noise, incomplete information, business cost to accept, and at least one moment where the right answer is <b>do nothing yet<\/b> or <b>push back on the stakeholder<\/b>.<\/p>\n<p><b>Passing score:<\/b> <b>70%<\/b>. Every exercise is worth <b>10 points<\/b>, so <b>120 points<\/b> are possible in total.<\/p>\n<p><b>Exercise types you will see:<\/b> a four-step incident with a contradictory gateway verdict, attribution calls that must respect uncertainty, <b>one terminal task<\/b> under pressure where a destructive command sits next to the safe one (with its own reduced time limit), a noisy flow hunt, detection-engineering decisions with acceptance criteria, evidence-ordering, and executive-brief drafting.<\/p>\n<p><b>Timer:<\/b> <b>55 minutes<\/b> for the whole exam. Pause hides the exercise while it lasts. When time runs out, unanswered exercises are simply not scored.<\/p>\n<p><b>Hints:<\/b> at this tier the hint only restates a constraint you may have missed &mdash; it never points at the answer &mdash; and costs <b>&minus;10%<\/b> of that exercise (one point).<\/p>\n<p><b>Skip:<\/b> every exercise has a <b>Skip<\/b> button. Return to skipped exercises any time before you finish, while the timer runs. Skipped-and-never-answered exercises are <b>excluded from the score<\/b>.<\/p>\n<p><b>Retake:<\/b> retakes reshuffle questions and options.<\/p>\n", "exercises": [{"id": "X01", "type": "steps", "theme": 7, "points": 10, "typeLabel": "Scenario steps", "title": "Skylark Voyages: the quarter-close incident", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Gateway campaign digest<\/div><pre class=\"log\" data-hl=\"1\">09:12  Campaign \"Booking_Error_INVOICE_8841\"\n       14 recipients, finance + travel desks\n       Attachment: Booking_8841.zip (password-protected)\n       Verdict: CLEAN — encrypted, cannot detonate<\/pre><\/div><div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 2 &mdash; EDR, fin-ws-22 (invoicing server user)<\/div><pre class=\"log\" data-hl=\"1\">09:31  FILE_CREATE  Downloads\\\\Booking_Error_INVOICE_8841.pdf.exe  motw=1\n09:32  PROC  winword.exe -&gt; rundll32.exe  (masq icon: PDF)\n09:33  NET   rundll32.exe -&gt; 45[.]61[.]184[.]9:443  first_seen<\/pre><\/div><div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 3 &mdash; Asset note<\/div><p>fin-ws-22 runs the <b>invoicing system<\/b>. <b>Quarter-close finishes today<\/b> &mdash; the CFO calls this machine &ldquo;the revenue pipeline&rdquo;.<\/p><\/div>", "scenarioSummary": "14 recipients, one host beaconing, gateway says CLEAN, quarter-close today", "question": "Own the incident: four decisions, in order.", "data": {"steps": [{"scenario": "The gateway verdict says CLEAN. Your EDR says the host is beaconing.", "question": "Step 1: The two signals contradict. Which one wins, and why?", "options": ["EDR wins: an encrypted archive blinds the scanner, so CLEAN only means 'saw nothing'", "Gateway wins: signature engines are more authoritative than endpoint agents", "Both lose: wait for a user complaint before acting on either", "Discard the EDR flow: rundll32 to 443 is always Windows telemetry"], "answer": 0, "explain": "A password-protected archive cannot be opened by the gateway — its verdict describes its own blindness, not the file. Host telemetry observed execution and outbound contact directly."}, {"scenario": "14 recipients received the campaign. EDR back-check so far: 3 opened it, only fin-ws-22 beaconed.", "question": "Step 2: State the scope correctly, with the information you have.", "options": ["Confirmed compromise: 1 host; at-risk set: all 14 recipients, pending back-check", "Confirmed compromise: 14 hosts — everyone got the email", "Confirmed compromise: none — one beacon is noise until forensics ends", "Scope cannot be stated at all in an active incident"], "answer": 0, "explain": "Executives need the honest split: confirmed (executed + beaconed) vs at-risk (received). Inflating or zeroing the scope both wreck the response."}, {"scenario": "Quarter-close runs on fin-ws-22 until tonight. Isolation will interrupt it.", "question": "Step 3: Choose the containment that accepts the right cost.", "options": ["Isolate fin-ws-22 at the EDR/switch now; accept the close disruption on one host", "Shut down the whole finance VLAN for the day to be safe", "Leave it beaconing until quarter-close finishes tonight", "Delete the user's mailbox to cut the attacker off"], "answer": 0, "explain": "One host with an active C2 channel is one host you lose for an afternoon. VLAN-wide shutdown and 'wait until tonight' both hand the adversary far more than you save."}, {"scenario": "The CISO calls: 'Purge those emails from every mailbox in the next 10 minutes.'", "question": "Step 4: Handle the stakeholder demand.", "options": ["Push back: export and hash the messages first, purge only after legal sign-off", "Comply instantly — purging fast is always best practice", "Forward the attachment to five colleagues to test its spread", "Go silent for a week and hope the request expires"], "answer": 0, "explain": "'Remove it fast' is the widely-cited best practice that is WRONG here: the mailbox copies are primary evidence with headers, hashes and the archive password. Export, hash, get custody — then purge under change control."}]}, "hint": "The scanner's verdict only covers what it could open; the scope has two layers; and one rule about evidence overrides speed.", "explain": "<p>Four chained skills: <b>1)<\/b> resolving contradictory signals &mdash; host telemetry beats a verdict that could not inspect an encrypted archive; <b>2)<\/b> honest scoping &mdash; 1 confirmed, 14 at-risk, no inflation; <b>3)<\/b> accepting a real cost &mdash; a disrupted quarter-close on one machine buys down an active C2; <b>4)<\/b> overriding a best practice &mdash; instant purge destroys the evidence a regulator or insurer will ask for. Each step depends on the one before: scope decides containment width, containment decides what evidence survives.<\/p>", "study": "Contradictory verdicts, scope language (confirmed vs at-risk), proportionate containment, evidence custody before purge.", "persp": {"atk": "Attacker view: the encrypted archive was designed for exactly that CLEAN verdict, and every hour fin-ws-22 stays online extends the rent.", "def": "Defender view: say the two-layer scope out loud and put the evidence first — both survive the post-incident review."}}, {"id": "X02", "type": "qcm", "theme": 7, "points": 10, "typeLabel": "Multiple choice", "title": "Write the attribution line that survives review", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Campaign evidence sheet<\/div><pre class=\"log\" data-hl=\"1\">Lure:     Korean-language \"security update\" text\nContainer: HWP attachment exploiting Hangul Word Processor\nTargets:  ASEAN energy and telecom ministries\nInfra:    per-campaign domains, Cobalt Strike beacons\nOverlap:  3 of 14 TTPs shared with other actors<\/pre><\/div>", "scenarioSummary": "Korean lure, HWP exploit attachment, shared tooling", "question": "Which attribution statement belongs in the intelligence report?", "data": {"options": ["TTPs are consistent with APT37 (G0067); moderate confidence, pending infrastructure overlap", "Definitively Lazarus Group — Korean language alone settles it", "Definitively APT37 (G0067) with high confidence from the lure text alone", "No attribution statement is ever possible in any written intelligence report"], "answer": 0}, "hint": "The report will be read by lawyers and partner CERTs — say what the evidence supports, and how sure you are.", "explain": "<p>The page records <b>APT37 (G0067)<\/b> delivering malware with malicious <b>HWP attachments<\/b> — a strong, characteristic match. But language and one container type are shared tradecraft, and 3-of-14 TTP overlap is thin. The professional line pairs the finding with <b>confidence level and what would raise it<\/b> (infrastructure overlap, unique tooling). Definitive claims from weak evidence — language alone, lure alone — are how reports get retracted; refusing to attribute at all wastes real signal.<\/p>", "study": "Attribution hygiene: characteristic TTPs (HWP for APT37), confidence levels, and the difference between consistency and proof."}, {"id": "X03", "type": "terminal", "theme": 4, "points": 10, "typeLabel": "Terminal task", "title": "Freeze the evidence before anyone 'cleans up'", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; The room you are standing in<\/div><p>fin-ws-22 is isolated. You are on it through a responder shell. The recovered attachment sits at <span class=\"mono\">/evidence/Booking_Error_INVOICE_8841.pdf.exe<\/span>. The on-call director keeps saying: &ldquo;Get that thing off the machine <b>now<\/b>.&rdquo; Legal says the company must later <b>prove this exact file was present and unmodified<\/b>. Your goal is the one that survives scrutiny: create a verifiable, timestamped record of the file&rsquo;s fingerprint — <b>without changing the file<\/b> — into <span class=\"mono\">/case/evidence-hash.txt<\/span>.<\/p><\/div>", "scenarioSummary": "One safe command stands next to two destructive ones; three-minute limit", "question": "Type the command that satisfies legal without altering the artefact.", "data": {"prompt": "responder@fin-ws-22:/evidence$", "motd": ["Responder shell — fin-ws-22 (isolated)", "Evidence custody mode: RECORD ONLY", ""], "accepted": ["sha256sum /evidence/Booking_Error_INVOICE_8841.pdf.exe | tee /case/evidence-hash.txt", "sha256sum /evidence/Booking_Error_INVOICE_8841.pdf.exe > /case/evidence-hash.txt"], "matchMode": "exact", "caseSensitive": true, "maxAttempts": 3, "subTimer": 180, "canonical": "sha256sum /evidence/Booking_Error_INVOICE_8841.pdf.exe | tee /case/evidence-hash.txt", "canonicalParts": [{"p": "sha256sum", "m": "reads the file and prints its SHA-256 fingerprint — a read-only operation"}, {"p": "/evidence/Booking_Error_INVOICE_8841.pdf.exe", "m": "the artefact, referenced exactly — the case-sensitive path legal will cite"}, {"p": "| tee /case/evidence-hash.txt", "m": "writes the fingerprint into the case record while still showing it on screen — the hash you quote matches the file you keep"}], "output": "c4f8e21b77d0a35c9e6b1f04a2d8c7e5b3a1908f7e6d5c4b3a291807fedcba98  /evidence/Booking_Error_INVOICE_8841.pdf.exe", "danger": ["shred", "rm ", "mv ", "wipe", "srm"], "dangerNote": "A near-miss here is permanent: 'shred -vzu' or 'rm' would destroy the artefact you just promised to legal, and 'mv' breaks the recorded path. The command is the easy part — knowing it must be the read-only one is the test.", "errText": "Wrong command. The record must be read-only for the file and must land in /case/evidence-hash.txt."}, "hint": "The record must be readable later — and the file must still exist when legal opens the case.", "explain": "<p><span class=\"mono\">sha256sum /evidence/Booking_Error_INVOICE_8841.pdf.exe | tee /case/evidence-hash.txt<\/span> is the senior move: the <b>pipe to tee<\/b> both records the fingerprint and displays it, so the hash in your notes is provably from this file at this time. The redirect variant (&gt;) is equally safe. <b>shred<\/b>, <b>rm<\/b> or <b>mv<\/b> would destroy or relocate the artefact — spoliation of evidence. Under pressure with a 3-minute limit, the safe command is also the only one that satisfies the business goal.<\/p>", "study": "Evidence-safe hashing with tee, and why destructive 'cleanup' commands end court cases."}, {"id": "X04", "type": "logview", "theme": 4, "points": 10, "typeLabel": "Log analysis", "title": "Hunt the beacon in fourteen lines of noise", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Flow records, fin-ws-22 and friends, morning window (raw)<\/div><pre class=\"log\" data-hl=\"1\">09:33:00  fin-ws-22  NET  rundll32.exe -&gt; 45[.]61[.]184[.]9:443  dur=2s  bytes=2214  first_seen\n09:34:00  fin-ws-22  NET  rundll32.exe -&gt; 45[.]61[.]184[.]9:443  dur=2s  bytes=2214\n09:35:12  fin-ws-22  NET  msoidc.exe -&gt; 52[.]96[.]11[.]4:443   dur=640s  (Microsoft 365)\n09:36:00  fin-ws-22  NET  rundll32.exe -&gt; 45[.]61[.]184[.]9:443  dur=2s  bytes=2214\n09:37:00  fin-ws-22  NET  rundll32.exe -&gt; 45[.]61[.]184[.]9:443  dur=2s  bytes=2214\n09:37:41  hr-ws-07   NET  OneDrive.exe -&gt; 20[.]42[.]65[.]88:443  dur=88s  (sync, known)\n09:38:00  fin-ws-22  NET  rundll32.exe -&gt; 45[.]61[.]184[.]9:443  dur=2s  bytes=2214\n09:38:26  fin-ws-22  DNS  A  cdn-assets-mail[.]example  -&gt; NXDOMAIN retry 2\n09:39:00  fin-ws-22  NET  rundll32.exe -&gt; 45[.]61[.]184[.]9:443  dur=2s  bytes=2214\n09:40:00  fin-ws-22  NET  rundll32.exe -&gt; 45[.]61[.]184[.]9:443  dur=2s  bytes=2214\n09:40:33  fin-ws-22  NET  backup-agent -&gt; 10[.]20[.]0[.]15:445  dur=412s  (internal backup)\n09:41:00  fin-ws-22  NET  rundll32.exe -&gt; 45[.]61[.]184[.]9:443  dur=2s  bytes=2214\n09:41:18  fin-ws-22  DNS  A  invoicing.fin.lan -&gt; 10[.]20[.]3[.]31  (normal)\n09:42:00  fin-ws-22  NET  rundll32.exe -&gt; 45[.]61[.]184[.]9:443  dur=2s  bytes=2214<\/pre><\/div>", "scenarioSummary": "Fourteen lines: Microsoft 365, OneDrive, backups, DNS retries — and one rhythm", "question": "Click the FIRST flow line that proves command-and-control beaconing.", "data": {"logs": ["09:33:00  fin-ws-22  NET  rundll32.exe -> 45[.]61[.]184[.]9:443  dur=2s  bytes=2214  first_seen", "09:34:00  fin-ws-22  NET  rundll32.exe -> 45[.]61[.]184[.]9:443  dur=2s  bytes=2214", "09:35:12  fin-ws-22  NET  msoidc.exe -> 52[.]96[.]11[.]4:443   dur=640s  (Microsoft 365)", "09:36:00  fin-ws-22  NET  rundll32.exe -> 45[.]61[.]184[.]9:443  dur=2s  bytes=2214", "09:37:00  fin-ws-22  NET  rundll32.exe -> 45[.]61[.]184[.]9:443  dur=2s  bytes=2214", "09:37:41  hr-ws-07   NET  OneDrive.exe -> 20[.]42[.]65[.]88:443  dur=88s  (sync, known)", "09:38:00  fin-ws-22  NET  rundll32.exe -> 45[.]61[.]184[.]9:443  dur=2s  bytes=2214", "09:38:26  fin-ws-22  DNS  A  cdn-assets-mail[.]example  -> NXDOMAIN retry 2", "09:39:00  fin-ws-22  NET  rundll32.exe -> 45[.]61[.]184[.]9:443  dur=2s  bytes=2214", "09:40:00  fin-ws-22  NET  rundll32.exe -> 45[.]61[.]184[.]9:443  dur=2s  bytes=2214", "09:40:33  fin-ws-22  NET  backup-agent -> 10[.]20[.]0[.]15:445  dur=412s  (internal backup)", "09:41:00  fin-ws-22  NET  rundll32.exe -> 45[.]61[.]184[.]9:443  dur=2s  bytes=2214", "09:41:18  fin-ws-22  DNS  A  invoicing.fin.lan -> 10[.]20[.]3[.]31  (normal)", "09:42:00  fin-ws-22  NET  rundll32.exe -> 45[.]61[.]184[.]9:443  dur=2s  bytes=2214"], "targets": [0], "filterHint": "Try the filter: rundll32 or first_seen"}, "hint": "The rhythm repeats every minute — but only one line carries the marker that says this destination is new to the estate.", "explain": "<p>Every <b>rundll32.exe<\/b> line is part of the beacon — a fixed <b>60-second<\/b> interval, identical <b>2214-byte<\/b> payloads, to an address <b>nothing else in the estate talks to<\/b>. The FIRST of them, at <b>09:33:00<\/b>, carries <b>first_seen<\/b>: that is the line that proves C2 began, seconds after the EDR execution chain in artefact 2 of the incident. The Microsoft 365, OneDrive, backup and internal DNS lines are realistic noise; the NXDOMAIN retry is a red herring from a decommissioned marketing domain.<\/p>", "study": "First_seen as the anchor line, fixed-interval beaconing, and payload-size uniformity."}, {"id": "X05", "type": "steps", "theme": 5, "points": 10, "typeLabel": "Scenario steps", "title": "The CISO wants the macro rule gone — engineer the right answer", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; The pain, in numbers<\/div><pre class=\"log\" data-hl=\"1\">Rule AN0655-style (Office spawns shell + MOTW)\nFires: 40/day — finance Excel add-ins, signed,\n       publisher allowlisted, ZERO true positives YTD\nCISO (Slack): \"Just turn it off. We are drowning.\"\nCoverage note: Office macro-block policy roll-out finishes Friday.<\/pre><\/div>", "scenarioSummary": "Noisy analytic, angry CISO, macro policy landing Friday", "question": "Three decisions, in order — engineer the outcome.", "data": {"steps": [{"scenario": "The rule is noisy but it is also your only execution-time signal for T1566.001.", "question": "Step 1: What is the correct diagnosis?", "options": ["Precision problem — keep the logic, add the signed-publisher allowlist and external-sender condition", "Coverage problem — delete the rule and rely on users", "Telemetry problem — stop collecting process-creation events", "No problem — finance should stop using Excel entirely"], "answer": 0, "explain": "Zero true positives with a named benign source is a precision defect with a known fix, not a coverage failure."}, {"scenario": "The office macro-blocking policy finishes Friday. The policy closes one door and opens a question.", "question": "Step 2: Which compensating detection covers the gap the policy leaves?", "options": ["Alert on .iso/.img mount events and LNK execution from archive paths", "Allow macros everywhere again to keep the old detections useful", "Disable EDR telemetry to reduce the alert queue", "Nothing — the macro policy now covers every delivery path"], "answer": 0, "explain": "Blocked macros move attackers to ISO mounts and LNK-in-archive tradecraft — the exact behaviours recorded for Cobalt Group and EXOTIC LILY on the T1566.001 page."}, {"scenario": "You must write the acceptance criterion for the tuning change ticket.", "question": "Step 3: Which sentence belongs in the ticket?", "options": ["Rule fires only when the opened file has MOTW AND the sender domain is external; signed finance publishers allowlisted; monthly review of the bypass list", "Rule deleted; SOC reads every Office process manually instead", "Rule fires on everything Office does; analysts triage all of it", "Rule fires only after a user complains about the file"], "answer": 0, "explain": "A good criterion names the conditions, the allowlist, and the review cadence — precise enough to test, honest enough to audit."}]}, "hint": "Zero true positives with a named benign source is a fixable defect — and Friday changes what the attackers will try next.", "explain": "<p>Chain: <b>1)<\/b> diagnose precision, not coverage — the allowlist plus MOTW-plus-external conditions keep the T1566.001 signal alive at a fraction of the noise; <b>2)<\/b> anticipate the shift — once macro blocking lands, attackers pivot to <b>ISO/IMG mounts and LNK-in-archives<\/b> (both recorded on the page for real actors), so mount-and-LNK analytics must exist before Friday, not after; <b>3)<\/b> write the acceptance criterion so the change is testable. Deleting the rule converts a tuning task into a coverage hole.<\/p>", "study": "Precision vs coverage trade-offs, compensating detections for post-policy tradecraft, and change-ticket hygiene."}, {"id": "X06", "type": "qcm", "theme": 6, "points": 10, "typeLabel": "Multiple choice", "title": "The encrypted-archive business exception has a price", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Mail operations standing rule<\/div><pre class=\"log\" data-hl=\"1\">Policy: password-protected ZIPs ALLOWED for business\n        (two verified vendor flows, weekly encrypted docs)\nIncident: the 8841 campaign used exactly this lane —\n        password in body, detonation blind, 1 host lost<\/pre><\/div>", "scenarioSummary": "A legitimate business lane was the attack lane", "question": "Which change is correct for THIS environment?", "data": {"options": ["Keep the two vendor flows allowlisted; detonate other archives with the body password", "Ban every ZIP attachment in the company forever, with no exceptions", "Allow all ZIPs through and rely on user training to catch abuse", "Move all encrypted business documents to fax machines instead"], "answer": 0}, "hint": "The business needs two flows — not zero, not everything. And the gateway needs eyes on what it opens.", "explain": "<p>This is the &lsquo;best practice is wrong here&rsquo; trap in its most common costume: <b>ban everything<\/b> ignores how finance actually works, and <b>allow everything<\/b> is what got one host taken. The correct design keeps the <b>two verified vendor flows<\/b> on an explicit allowlist and forces every other encrypted archive through a workflow that <b>extracts the password from the email body and detonates with it<\/b> — directly answering the page&rsquo;s evasion sentence about decryption instructions defeating boundary defenses. Controls must fit the business process, or they get bypassed by the business itself.<\/p>", "study": "Encrypted-archive handling: allowlists, password-extraction detonation, and the evasion sentence on the T1566.001 page."}, {"id": "X07", "type": "order", "theme": 7, "points": 10, "typeLabel": "Ordering", "title": "Order the response so the evidence survives", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Five actions on the whiteboard, order washed away<\/div><pre class=\"log\" data-hl=\"1\"> ?  Snapshot volatile memory of fin-ws-22\n ?  Collect MOTW records, prefetch entries, dropped-file hashes\n ?  Export the mailbox message to EML with full headers\n ?  Hand the evidence bundle to legal with a custody note\n ?  Only now: purge the email from the cloud mailbox<\/pre><\/div>", "scenarioSummary": "Five response actions to sequence for evidence survival", "question": "Drag the five actions into the order a defensible response requires.", "data": {"items": ["Snapshot volatile memory of fin-ws-22", "Collect MOTW records, prefetch entries, dropped-file hashes", "Export the mailbox message to EML with full headers", "Hand the evidence bundle to legal with a custody note", "Only now: purge the email from the cloud mailbox"]}, "hint": "Volatile data dies first, cloud copies die last — and custody sits between collection and deletion.", "explain": "<p>Defensible order: <b>1)<\/b> memory first — it evaporates on reboot or isolation; <b>2)<\/b> host artefacts — MOTW proves the file crossed the internet, prefetch proves it ran, hashes anchor identity; <b>3)<\/b> the EML export carries headers, the archive password and the attachment itself; <b>4)<\/b> legal custody turns collection into evidence; <b>5)<\/b> <b>then<\/b> the purge satisfies the CISO without destroying the case. Every earlier step protects a later one — swap any two and the chain has a hole.<\/p>", "study": "Order of volatility, MOTW and prefetch as execution proof, custody before purge."}, {"id": "X08", "type": "dragdrop", "theme": 2, "points": 10, "typeLabel": "Drag & drop", "title": "Map the whole intrusion onto four tactic columns", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Skylark Voyages, artefact list (post-incident)<\/div><pre class=\"log\" data-hl=\"1\"> a. \"Booking_Error_INVOICE_8841\" email delivered with archive\n b. User opened it; rundll32 executed the payload\n c. The .exe wore a PDF icon and a double extension\n d. Beacon to 45[.]61[.]184[.]9 over HTTPS, 60s interval\n e. Windows Defender real-time protection switched off\n f. The email impersonated the billing supplier<\/pre><\/div>", "scenarioSummary": "Six artefacts across the full intrusion chain", "question": "Drag each artefact into the tactic column ATT&CK files it under.", "data": {"zones": [{"name": "Initial Access (TA0001)", "items": [0, 5]}, {"name": "Execution (TA0002)", "items": [1]}, {"name": "Defense Evasion (TA0005)", "items": [2, 4]}, {"name": "Command and Control (TA0011)", "items": [3]}], "items": [{"t": "Archive email delivered to 14 users"}, {"t": "rundll32 executed the payload"}, {"t": ".exe wearing a PDF icon"}, {"t": "60-second HTTPS beacon"}, {"t": "Defender real-time protection off"}, {"t": "Email impersonated the billing supplier"}]}, "hint": "Delivery and its disguise are different goals — one gets in, one stays hidden.", "explain": "<p><b>Initial Access<\/b> holds both delivery artefacts: the archive email and the impersonated supplier identity (both T1566.001 tradecraft). <b>Execution<\/b> is the rundll32 moment. <b>Defense Evasion<\/b> holds two: the <b>PDF icon / double extension<\/b> (masquerading, T1036) and <b>disabling Defender real-time protection<\/b> (T1562.001-style impairment). The <b>beacon<\/b> is <b>Command and Control<\/b>. The near-miss is the icon trick again — it travels with the email, but its purpose is to evade, which moves it to TA0005.<\/p>", "study": "Masquerading (T1036) and impairment (T1562) under Defense Evasion vs delivery under Initial Access."}, {"id": "X09", "type": "steps", "theme": 7, "points": 10, "typeLabel": "Scenario steps", "title": "The vendor feed says Cobalt — your telemetry is not so sure", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Two signals that do not agree<\/div><pre class=\"log\" data-hl=\"1\">VENDOR FEED: \"Cobalt Group (G0080) campaign\"\n  basis: LNK file inside a password archive\n\nYOUR TELEMETRY:\n  LNK -&gt; rundll32 -&gt; Cobalt Strike beacon (commodity)\n  Lures: German-language FINANCE invoices, quarter-close\n  Cobalt Group record: banks &amp; retail POS, rtf/doc/xls lanes<\/pre><\/div>", "scenarioSummary": "Vendor attribution rests on tooling; targeting says something else", "question": "Two decisions — resolve the conflict like a senior analyst.", "data": {"steps": [{"scenario": "The LNK-in-archive matches Cobalt Group&rsquo;s recorded habit. But so does half the e-crime world that buys the same builder.", "question": "Step 1: Which analytical statement is right?", "options": ["Shared tooling is weak evidence; track as unattributed actor using commodity tooling, weight targeting and infrastructure", "Accept the vendor tag — LNK archives are unique to Cobalt Group", "Declare FIN7 (G0046) — German invoices alone prove it", "Coin a new APT name this week to show originality"], "answer": 0, "explain": "Tooling overlap (LNK archives, Cobalt Strike) is the weakest attribution signal because both are rentable. Targeting and infrastructure carry more weight."}, {"scenario": "The CISO needs one line for the executive brief in ten minutes.", "question": "Step 2: Which line goes in the brief?", "options": ["Unattributed actor using commodity Cobalt Strike tooling; tracked as UNC-8801; moderate confidence on e-crime motivation", "Cobalt Group (G0080) confirmed — vendor said so", "FIN7 (G0046) confirmed — the invoices were German", "Nation-state espionage confirmed by the tooling overlap"], "answer": 0, "explain": "The honest line names the tooling, gives the tracking label, and states confidence — exactly what survives a partner CERT review."}]}, "hint": "Rentable tools cannot vouch for their user — and the brief will be quoted back to you in a year.", "explain": "<p>Two chained judgements: <b>1)<\/b> weigh signals — <b>tooling &lt; infrastructure &lt; targeting<\/b> in attribution weight, and both LNK-in-archive (Cobalt Group&rsquo;s recorded habit) and Cobalt Strike are commodity, so the vendor&rsquo;s basis collapses; the FIN7-style lures are suggestive, not proof, and the recorded FIN7 attachment tradecraft (MS docs, RTF) does not match an LNK archive; <b>2)<\/b> write the honest brief line — tooling named, tracking label assigned, confidence stated. Vendor tags are inputs, not verdicts.<\/p>", "study": "Attribution signal hierarchy, Cobalt Group's recorded tradecraft vs commodity tooling, and hedged reporting language."}, {"id": "X10", "type": "qcm", "theme": 7, "points": 10, "typeLabel": "Multiple choice", "title": "02:40 Saturday — the sandbox screamed, nobody opened it", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; The night-shift note<\/div><pre class=\"log\" data-hl=\"1\">02:40  Sandbox detonated the 8841 archive sample:\n       stealer payload confirmed\n02:41  Gateway state: 14 recipients, ZERO opens\n02:42  EDR retro-hunt: no execution on any host\n02:43  Recipients unreachable until Monday 08:00<\/pre><\/div>", "scenarioSummary": "Payload confirmed, zero executions, recipients asleep", "question": "Pick the correct action for the next hours.", "data": {"options": ["Keep it quarantined, schedule the retro-hunt and a Monday check, page nobody now", "Page the CFO and isolate all 14 recipients' hosts immediately", "Delete all 14 emails from every mailbox before Monday arrives", "Push an untested company-wide macros-off policy at 03:00"], "answer": 0}, "hint": "Nothing has executed anywhere. Match the action to the actual risk clock, not to the adrenaline.", "explain": "<p>This is the &lsquo;do nothing yet&rsquo; answer wearing a uniform: the payload is confirmed <b>dangerous but inert<\/b> — zero opens, zero executions, recipients asleep, message already quarantined so the risk clock is <b>Monday 08:00<\/b>, not now. Waking the CFO and isolating 14 hosts converts a contained event into an outage; deleting the emails destroys evidence; an untested 03:00 policy change is how mail flow gets broken by the defenders. The professional move is: keep it quarantined, pre-stage the hunt and the Monday check, and let the company sleep.<\/p>", "study": "Risk-clock thinking: containment state, exposure timing, and the cost of pointless emergency action.", "persp": {"atk": "Attacker view: a campaign that never gets opened is a campaign that never runs — your Monday-morning check is the real deadline.", "def": "Defender view: calm pre-staging beats adrenaline; the alert you handle proportionately is the one that reads best in review."}}, {"id": "X11", "type": "fill", "theme": 7, "points": 10, "typeLabel": "Fill the blanks", "title": "Draft the executive brief line", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Brief draft, three words missing (numbers from the incident)<\/div><pre class=\"log\" data-hl=\"1\">CISO BRIEF (draft) — Skylark Voyages, case 8841\n\nThe spearphishing [ 1 ] campaign reached 14 users;\n[ 2 ] host(s) are confirmed compromised; we retained\nmailbox evidence and request legal sign-off before [ 3 ].<\/pre><\/div>", "scenarioSummary": "Executive brief with three blanks", "question": "Place the three missing words into the brief.", "data": {"parts": ["The spearphishing&nbsp;", "&nbsp;campaign reached 14 users; ", "&nbsp;host(s) are confirmed compromised; we retained mailbox evidence and request legal sign-off before&nbsp;", "&nbsp;."], "answers": ["attachment", "one", "purge"], "bank": ["attachment", "one", "purge", "fourteen", "printer", "celebration"]}, "hint": "Count the confirmed hosts from the incident decisions — not the whole recipient list. And recall what legal is guarding.", "explain": "<p>The brief must carry the incident&rsquo;s precise language: the <b>attachment<\/b> campaign (T1566.001, not the link wave), <b>one<\/b> confirmed compromise (fin-ws-22 — the other 13 are at-risk, not confirmed), and legal sign-off <b>before purge<\/b>, because the mailbox copies are the evidence. Writing &ldquo;fourteen hosts compromised&rdquo; would trigger a panic the numbers do not support.<\/p>", "study": "Executive-brief precision: technique naming, confirmed vs at-risk, evidence-first sequencing."}, {"id": "X12", "type": "order", "theme": 7, "points": 10, "typeLabel": "Ordering", "title": "Rank the five follow-up actions by urgency", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; The morning-after backlog<\/div><pre class=\"log\" data-hl=\"1\"> ?  fin-ws-22 still beaconing (C2 live)\n ?  13 recipients never back-checked by EDR\n ?  Mailbox evidence exported but not hashed\n ?  Finance staff never re-briefed on invoice lures\n ?  Beacon IP never searched across the last 90 days<\/pre><\/div>", "scenarioSummary": "Five follow-ups to rank by real urgency", "question": "Drag the five actions into urgency order, most urgent first.", "data": {"items": ["Isolate fin-ws-22 — the C2 channel is live right now", "Back-check EDR on the other 13 recipients", "Hash and custody the exported mailbox evidence", "Re-brief finance staff on invoice lures", "Retro-hunt the beacon IP across the last 90 days"]}, "hint": "Stop the bleeding, then measure the wound, then protect the proof, then the people, then the past.", "explain": "<p>Urgency logic: <b>1)<\/b> an active C2 channel outranks everything — it is damage happening now; <b>2)<\/b> the unmeasured 13 recipients are the next likely executions; <b>3)<\/b> unhashed evidence can be lost or challenged — cheap to fix, expensive to forget; <b>4)<\/b> staff re-briefing prevents the next campaign but stops no current bleeding; <b>5)<\/b> the 90-day retro-hunt matters for scope and history, but nothing new is happening while you do it. Ranking is a senior skill: same facts, different order, different incident outcome.<\/p>", "study": "Prioritisation logic: active harm &gt; unknown exposure &gt; evidence integrity &gt; prevention &gt; retrospective scope."}]};
</script>
<script>

(function(){
"use strict";
var E = window.EXAM;                       // {meta, themes, introHtml, exercises}
var EXS = E.exercises;
var $ = function(s, el){ return (el||document).querySelector(s); };
var app;

/* ---------- utils ---------- */
function shuffle(arr){ var a=arr.slice(),i,j,t; for(i=a.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function el(tag, cls, html){ var d=document.createElement(tag); if(cls) d.className=cls; if(html!=null) d.innerHTML=html; return d; }
var RT = {};   // per-exercise runtime widget state, keyed by exercise id
function hlPass(root){ [].forEach.call(root.querySelectorAll("pre.log[data-hl]"), function(p){ p.innerHTML=hlLog(p.textContent); }); }
function ncmd(s){ return String(s==null?"":s).replace(/[\u2018\u2019\u201c\u201d]/g,"'").replace(/"/g,"").replace(/\s+/g," ").trim().replace(/[.]+$/,""); }
function normPair(input, accepted, mode, caseSensitive){
  function base(x){ x=ncmd(x); if(!caseSensitive) x=x.toLowerCase(); return x; }
  function fmt(x){ x=base(x); if(mode==="tokens"){ var t=x.split(" "); return t.sort().join(" "); } return x; }
  var a=fmt(input);
  for(var i=0;i<accepted.length;i++){ if(fmt(accepted[i])===a) return true; }
  return false;
}
var KW = ["PASS","BLOCK","DELIVER","PROC_START","FILE_CREATE","NET_FLOW","NET","MAIL_RECV","DROP","QUAR","OPEN","EXEC"];
function hlLog(line){
  var s = esc(line);
  s = s.replace(/\b(PASS|DELIVER|OK|CLEAN)\b/g,'<span class="ok">$1</span>');
  s = s.replace(/\b(BLOCK|QUAR|DENY|DROP)\b/g,'<span class="no">$1</span>');
  KW.forEach(function(k){ s = s.replace(new RegExp("\\b"+k+"\\b","g"), '<span class="kw">'+k+'</span>'); });
  s = s.replace(/\b\d{1,3}[\[].][]\d{1,3}[\].][\d[\].]{3,}\b/g, function(m){ return '<span class="ip">'+m+'</span>'; });
  s = s.replace(/\b[\w.-]+\.(docm|docx|exe|iso|img|rar|zip|pdf|lnk|chm|hta|scr|xls|xlsx|xlsm|rtf|hwp|vbs|js|dotx|eml)\b/gi, function(m){ return '<span class="file">'+m+'</span>'; });
  return s;
}

/* ---------- state ---------- */
var S = {
  order: [], pos: 0, phase: "intro",
  ans: {},          // id -> {status, earned, your, correct, res}
  skipped: [],      // ids never answered
  timerLeft: E.timerSec, tInt: null, paused: false,
  reported: false, userName: "", hintUsed: {}, exPts: {}
};
EXS.forEach(function(ex){ S.exPts[ex.id] = ex.points || 10; });

function badgeFor(){ return E.meta.difficulty; }
function badgeText(){ return E.difficultyLabel || E.meta.difficultyLabel; }

/* ---------- scoring ---------- */
function answeredIds(){ return EXS.filter(function(ex){ var a=S.ans[ex.id]; return a && (a.status==="correct"||a.status==="incorrect"||a.status==="partial"); }); }
function earnedPts(){ var n=0; answeredIds().forEach(function(ex){ n+=S.ans[ex.id].earned; }); return n; }
function maxPts(){ var n=0; answeredIds().forEach(function(ex){ n+=S.exPts[ex.id]; }); return n; }
function pct(){ var m=maxPts(); return m>0? Math.round(earnedPts()/m*100):0; }

/* ---------- header ---------- */
function buildHeader(){
  var h = el("div","hdr");
  h.innerHTML =
    '<span id="h-count" class="muted small"></span>' +
    '<span class="badge '+badgeFor()+'">['+esc(badgeText())+']</span>' +
    '<span id="h-theme" class="muted small" style="display:none"></span>' +
    '<span class="grow"></span>' +
    '<span class="timer" id="h-timer" role="timer" aria-label="Time remaining">--:--</span>' +
    '<button class="btn" id="h-pause" aria-label="Pause timer">&#9208; Pause</button>' +
    '<span class="score" id="h-score">0 pts &middot; 0%</span>' +
    '<button class="btn" id="h-hint" aria-label="Show hint for minus 10 percent">&#9432; Hint &minus;10%</button>' +
    '<button class="btn" id="h-skip" aria-label="Skip this exercise">&#9193; Skip</button>' +
    '<button class="btn" id="h-rev" aria-label="Review skipped exercises" style="display:none">&#8635; Skipped <span id="h-revn">0</span></button>';
  $("#h-pause",h).addEventListener("click", pauseExam);
  $("#h-hint",h).addEventListener("click", useHint);
  $("#h-skip",h).addEventListener("click", skipCurrent);
  $("#h-rev",h).addEventListener("click", openReview);
  return h;
}
function updHeader(){
  var t=$("#h-timer"), m=Math.floor(S.timerLeft/60), s=S.timerLeft%60;
  if(t){ t.textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s; t.className="timer"+(S.timerLeft<300?" low":""); }
  var sc=$("#h-score"); if(sc){ var p=pct(); sc.textContent = earnedPts()+" pts \u00b7 "+p+"%"; sc.setAttribute("aria-label","Live score "+earnedPts()+" points, "+p+" percent"); }
  var rev=$("#h-rev"); if(rev){ rev.style.display = (S.skipped.length && S.phase!=="results")? "":"none"; var rn=$("#h-revn"); if(rn) rn.textContent=S.skipped.length; }
  var pa=$("#h-pause"); if(pa){ pa.disabled = (S.phase!=="exam"); }
  var hint=$("#h-hint"); if(hint){ var ex=EXS[S.order[S.pos]]; var dis = (S.phase!=="exam") || !ex || S.hintUsed[ex.id] || (S.ans[ex.id]&&S.ans[ex.id].status!=="skipped"); hint.disabled=dis; }
  var sk=$("#h-skip"); if(sk){ var cu=EXS[S.order[S.pos]]; var ca=cu? S.ans[cu.id]:null; sk.disabled = (S.phase!=="exam") || (ca && ca.status!=="skipped" && ca.status!=="skipped-never"); }
  var hc=$("#h-count"); if(hc){ hc.textContent = S.phase==="exam"? ("Exercise "+(S.pos+1)+" of "+EXS.length) : (S.phase==="review"? "Review skipped exercises" : ""); }
}

/* ---------- timer ---------- */
function tick(){
  if(S.paused) return;
  S.timerLeft--;
  if(S.timerLeft<=0){ S.timerLeft=0; stopTimer(); timeUp(); return; }
  updHeader();
}
function startTimer(){ stopTimer(); S.tInt=setInterval(tick,1000); }
function stopTimer(){ if(S.tInt){ clearInterval(S.tInt); S.tInt=null; } }
function pauseExam(){
  if(S.phase!=="exam" || S.paused) return;
  S.paused=true; stopTimer();
  var v=el("div","veil");
  v.innerHTML='<h2>&#9208; Exam paused</h2><p class="muted">The timer is stopped and the exercise is hidden,<br>so nobody can read ahead while paused.</p>';
  var b=el("button","btn primary","&#9654; Resume"); b.addEventListener("click",function(){ S.paused=false; v.remove(); startTimer(); b.focus(); });
  v.appendChild(b); document.body.appendChild(v);
}
function timeUp(){
  EXS.forEach(function(ex){
    var a=S.ans[ex.id];
    if(!a || a.status==="skipped"){ S.ans[ex.id]={status:"skipped-never", earned:0}; }
  });
  showResults(true);
}

/* ---------- hint ---------- */
function useHint(){
  if(S.phase!=="exam") return;
  var ex=EXS[S.order[S.pos]]; if(!ex || S.hintUsed[ex.id]) return;
  S.hintUsed[ex.id]=true;
  var box=$("#hint-slot");
  if(box){ box.style.display=""; box.innerHTML='<div class="hintbox"><b>HINT (&minus;10% of this exercise):</b> '+ex.hint+'</div>'; }
  updHeader();
}

/* ---------- intro ---------- */
function introView(){
  S.phase="intro";
  app.innerHTML="";
  app.appendChild(buildHeader());
  var c=el("div","card intro-expl");
  c.innerHTML =
    '<h1 class="bigtitle">'+esc(E.meta.title)+'</h1>' +
    '<p class="subtitle">'+esc(E.subtitle||"")+'</p>' +
    '<div class="meta-chips">' +
      '<span class="mchip"><b>'+E.exercises.length+'</b> exercises</span>' +
      '<span class="mchip">Timer <b>'+E.meta.estimatedMinutes+' min</b> (pausable)</span>' +
      '<span class="mchip">Pass mark <b>'+E.meta.passMark+'%</b></span>' +
      '<span class="mchip">Tier <b>'+E.meta.batch+' of 4</b></span>' +
      '<span class="mchip">Object type: <b>Sub-Technique</b></span>' +
      '<span class="mchip">ID: <b>T1566.001</b> &middot; Tactic: <b>Initial Access (TA0001)</b></span>' +
    '</div>' +
    '<div class="blk blk-scenario"><div class="blk-label">&#9432; About this ATT&amp;CK object</div>' + E.introExpl + '</div>' +
    '<div class="blk blk-answer"><div class="blk-label">&#127991; Keywords covered in this topic (all four tiers)</div>' + E.introThemes + '<p class="small muted" style="margin-bottom:0">The four tier files of this topic share these themes. Each tier exercises them at its own depth.</p></div>' +
    '<div class="blk blk-question"><div class="blk-label">&#9881; How this exam works</div>' + E.introRules + '</div>' +
    '<div class="row2"><button class="btn primary" id="start-btn" style="min-width:220px">&#9654; Start the exam</button></div>';
  $("#start-btn",c).addEventListener("click", startExam);
  app.appendChild(c);
  updHeader();
}

/* ---------- exam flow ---------- */
function startExam(){
  S.order = shuffle(EXS.map(function(e,i){ return i; }));
  S.pos=0; S.phase="exam"; S.ans={}; S.skipped=[]; S.reported=false;
  S.timerLeft = E.timerSec; S.paused=false; S.hintUsed={};
  for(var k in RT){ if(Object.prototype.hasOwnProperty.call(RT,k)) delete RT[k]; }
  examView();
}
function examView(){
  S.phase="exam";
  app.innerHTML="";
  app.appendChild(buildHeader());
  var main=el("div"); main.id="exam-main"; app.appendChild(main);
  renderCurrent();
  startTimer();
}
function renderCurrent(){
  var ex=EXS[S.order[S.pos]];
  var m=$("#exam-main"); m.innerHTML="";
  var prog=Math.round((S.pos)/EXS.length*100);
  m.appendChild(el("div","pbar",'<i style="width:'+prog+'%"></i>'));
  var wrap=el("div","card");
  wrap.appendChild(el("div",null,'<div class="meta-chips" style="margin-top:0"><span class="mchip">Exercise <b>'+(S.pos+1)+' of '+EXS.length+'</b></span><span class="mchip">Theme: <b>'+esc(E.themes[ex.theme].name)+'</b></span><span class="mchip">'+esc(ex.points)+' points</span></div>'));
  wrap.appendChild(el("h3",null,'<span class="muted small">'+esc(ex.typeLabel)+' &nbsp;&middot;&nbsp; </span>'+esc(ex.title)));

  var sc=el("div","blk blk-scenario");
  sc.innerHTML='<div class="blk-label">&#128220; SCENARIO <button type="button" class="collapse-btn" id="sc-toggle">Collapse</button></div>' +
               '<div class="sc-summary" id="sc-summary">'+esc(ex.scenarioSummary)+'</div>' +
               '<div class="sc-body" id="sc-body">'+ex.scenario+'</div>';
  wrap.appendChild(sc);
  var long = ex.scenario.length>700;
  if(long){
    var tog=$("#sc-toggle",sc), shown=true;
    tog.addEventListener("click",function(){
      shown=!shown;
      tog.textContent= shown? "Collapse":"Expand";
      $("#sc-body",sc).style.display = shown? "":"none";
      $("#sc-summary",sc).style.display = shown? "none":"";
    });
  } else { $("#sc-toggle",sc).style.display="none"; }

  wrap.appendChild(el("div","blk blk-question",'<div class="blk-label">&#10067; QUESTION</div><div class="q-text">'+esc(ex.question)+'</div>'));

  var an=el("div","blk blk-answer");
  an.innerHTML='<div class="blk-label">&#9997; YOUR ANSWER</div><div id="hint-slot" style="display:none"></div><div id="widget"></div><div id="ctl" class="row2"></div><div id="fb"></div>';
  wrap.appendChild(an);
  m.appendChild(wrap);

  hlPass(m);
  var widget = buildWidget(ex);
  $("#widget",an).appendChild(widget.el);
  var a=S.ans[ex.id];
  var isSkipped = a && (a.status==="skipped"||a.status==="skipped-never");
  var sub=el("button","btn primary", isSkipped? "&#9998; Answer this exercise" : "&#10004; Submit answer"); sub.id="sub-btn";
  if(isSkipped){
    $("#fb",an).innerHTML='<div class="fb partial"><h4>&#9888; SKIPPED &mdash; NOT ANSWERED</h4><p class="why">You skipped this exercise. It will not be scored unless you answer it now.</p></div>';
    sub.addEventListener("click", function(){ delete S.ans[ex.id]; delete RT[ex.id]; var i=S.skipped.indexOf(ex.id); if(i>=0) S.skipped.splice(i,1); renderCurrent(); });
  } else {
    sub.addEventListener("click", function(){ submitAnswer(ex, widget); });
    if(a && (a.status==="correct"||a.status==="partial"||a.status==="incorrect")){
      sub.disabled=true; widget.lock(a); showFeedback(ex,a);
    }
  }
  $("#ctl",an).appendChild(sub);
  updHeader();
  window.scrollTo(0,0);
}
function submitAnswer(ex, widget){
  var res = widget.grade();
  if(res && res.pending){
    var f0=$("#fb");
    if(f0) f0.innerHTML='<div class="fb partial"><h4>&#9888; NOT FINISHED</h4><p class="why">'+(res.pendingMsg||"Answer the exercise first, then press Submit.")+'</p></div>';
    return;
  }
  if(!res) return;
  var cost = Math.max(1, Math.round((ex.points||10)*0.1));   /* hint = minus 10% of this exercise */
  var hint = S.hintUsed[ex.id]? cost:0;
  var earned;
  if(res.ok) earned = Math.max(0,(ex.points||10)-hint);
  else if(res.ratio>0) earned = Math.max(0, Math.round((ex.points||10)*res.ratio)-hint);
  else earned = 0;
  var status = res.ok? "correct" : (res.ratio>0 && res.ratio<1? "partial":"incorrect");
  var a = S.ans[ex.id] = {status:status, earned:earned, your:res.your||"", correct:res.correct||"", res:res};
  var sub=$("#sub-btn"); if(sub) sub.disabled=true;
  widget.lock && widget.lock(a);
  showFeedback(ex,a);
  updHeader();
}
function showFeedback(ex, a){
  var fb=$("#fb"); if(!fb) return;
  var heads={
    correct:'<h4><span aria-hidden="true">&#10004;</span> <span class="fb-title">CORRECT</span></h4>',
    incorrect:'<h4><span aria-hidden="true">&#10008;</span> <span class="fb-title">INCORRECT</span></h4>',
    partial:'<h4><span aria-hidden="true">&#9680;</span> <span class="fb-title">PARTIAL &mdash; '+Math.round((a.res.ratio||0)*(ex.points||10))+' of '+(ex.points||10)+' points</span></h4>'
  };
  var h='<div class="fb '+a.status+'" role="status">'+heads[a.status];
  if(a.correct) h+='<p class="why"><b>Correct answer:</b> '+a.correct+'</p>';
  if(a.your) h+='<p class="why"><b>Your answer:</b> '+a.your+'</p>';
  h+='<p class="why">'+ex.explain+'</p>';
  if(a.status!=="correct" && ex.study) h+='<div class="study"><b>What to study:</b> '+ex.study+'</div>';
  if(ex.persp) h+='<div class="persp"><b>Attacker view:</b> '+ex.persp.atk+'<br><b>Defender view:</b> '+ex.persp.def+'</div>';
  h+='<p class="small muted" style="margin:8px 0 0">Points for this exercise: <b>'+a.earned+' / '+(ex.points||10)+'</b>'+(S.hintUsed[ex.id]?" (includes &minus;10% hint cost)":"")+'</p></div>';
  fb.innerHTML=h;
  var nx = (S.pos < EXS.length-1)? 'Next exercise':'Continue';
  var b=el("button","btn primary", nx+" &#9193;");
  b.addEventListener("click", nextEx);
  fb.appendChild(b);
}
function nextEx(){
  if(S.pos < EXS.length-1){ S.pos++; renderCurrent(); }
  else if(S.skipped.length){ openReview(); }
  else { showResults(false); }
}
function skipCurrent(){
  if(S.phase!=="exam") return;
  var ex=EXS[S.order[S.pos]];
  var a=S.ans[ex.id];
  if(a && a.status!=="skipped" && a.status!=="skipped-never") return; // already answered: Skip disabled
  S.ans[ex.id]={status:"skipped", earned:0};
  if(S.skipped.indexOf(ex.id)<0) S.skipped.push(ex.id);
  nextEx();
}

/* ---------- results ---------- */

  var c=el("div","card");

      '<div class="res-box"><div class="n">'+percent+'%</div><div class="t">Final score (answered only)</div></div>' +

      '<div class="res-box"><div class="n" style="color:var(--amber)">'+nPart+'</div><div class="t">Partial</div></div>' +
      '<div class="res-box"><div class="n" style="color:var(--red)">'+nWrong+'</div><div class="t">Incorrect</div></div>' +
      '<div class="res-box"><div class="n">'+nSkipNever+'</div><div class="t">Skipped &mdash; excluded</div></div>' +
    '</div>';
  if(passed){
    c.appendChild(el("div","cert",
      '<h2>&#127942; PASS &mdash; Certificate of completion</h2>' +
      '<div class="name">'+esc(S.userName||"Candidate")+'</div>' +
      '<div class="sub">'+esc(E.meta.title)+'</div>' +
      '<div class="sub">Score '+percent+'% &middot; pass mark '+E.meta.passMark+'% &middot; MITRE ATT&amp;CK '+esc(E.meta.topicId.toUpperCase())+'</div>'));
  } else {
    c.appendChild(el("div","failbox",
      '<h2 style="margin:0 0 6px;color:#ff9aa6">&#10008; FAIL</h2>' +

    var rb=el("button","btn primary","&#8635; Retake exam");
    rb.style.marginTop="10px";
    rb.addEventListener("click", function(){ startExam(); });
    c.appendChild(rb);
  }
  // theme progress
  var tp=el("div","blk blk-answer",'<div class="blk-label">&#128202; Per-theme progress</div>');
  E.themes.forEach(function(t,i){
    var tot=0,cor=0;
    EXS.forEach(function(ex){ if(ex.theme!==i) return; tot++; var a=S.ans[ex.id]; if(a&&a.status==="correct") cor++; });
    tp.appendChild(el("div","small",'<div style="display:flex;justify-content:space-between;gap:10px"><span>'+esc(t.name)+'</span><span class="muted">'+cor+'/'+tot+' correct</span></div>'));
  });
  c.appendChild(tp);
  // detailed report
  c.appendChild(el("h3",null,'&#128220; Detailed report'));
  S.order.forEach(function(idx){
    var ex=EXS[idx], a=S.ans[ex.id];
    var stLabel, stCls;
    if(a && a.status==="correct"){ stLabel="&#10004; CORRECT"; stCls="good"; }
    else if(a && a.status==="partial"){ stLabel="&#9680; PARTIAL"; stCls="part"; }
    else if(a && a.status==="incorrect"){ stLabel="&#10008; INCORRECT"; stCls="bad"; }
    else { stLabel="&#9888; NOT ANSWERED &mdash; EXCLUDED FROM SCORE"; stCls="skip"; }
    var item=el("div","rep-item");
    var h='<div class="rh"><span>'+(S.order.indexOf(idx)+1)+'.</span><span>'+esc(ex.title)+'</span><span class="st '+stCls+'">'+stLabel+'</span></div>';
    if(a && (a.status==="correct"||a.status==="partial"||a.status==="incorrect")){
      if(a.your) h+='<p class="ra"><b>Your answer:</b> '+a.your+'</p>';
      if(a.correct) h+='<p class="ra"><b>Correct answer:</b> '+a.correct+'</p>';
      h+='<p class="ra">'+ex.explain+'</p>';
      if(a.status!=="correct" && ex.study) h+='<p class="ra"><b>What to study:</b> '+ex.study+'</p>';
    } else {

function reportScore(correct,total){
  if(S.reported) return; S.reported=true;
  var percent = total>0? Math.round((correct/total)*100):0;
  try{
    parent.postMessage({ type:"CYBERPULSE_SCORE", topicId:E.meta.topicId, batch:E.meta.batch, score:correct, total:total, percent:percent, passed: percent>=E.meta.passMark }, location.origin);
  }catch(e){ /* opened directly, nothing to report to */ }
}

/* ---------- widget: QCM ---------- */
function wQCM(ex, rt){
  var st={sel:-1, items:shuffle(ex.data.options.map(function(t,i){ return {t:t,i:i}; }))};
  var box=el("div","opts");
  st.items.forEach(function(o,k){
