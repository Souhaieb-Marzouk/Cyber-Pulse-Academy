<script>
window.EXAM = {"meta": {"topicId": "t1566.001", "batch": 3, "title": "T1566.001 Phishing: Spearphishing Attachment — HARD", "difficulty": "hard", "questionCount": 12, "estimatedMinutes": 45, "passMark": 70}, "timerSec": 2700, "difficultyLabel": "HARD", "subtitle": "CyberPulseAcademy practice exam — batch 3 of 4 • everything loads from this one file", "themes": [{"name": "Technique Identity & Family", "chips": ["T1566.001 Spearphishing Attachment", "Parent T1566 Phishing", "T1566.002 Spearphishing Link", "T1566.003 Spearphishing via Service", "T1566.004 Spearphishing Voice", "Initial Access TA0001", "ATT&CK Enterprise v2.2"]}, {"name": "Adversary Behaviour & Lure Craft", "chips": ["Plausible pretext", "Enable-content prompt", "ZIP password in email body", "Extension & icon manipulation", "Exploit or direct execution", "Archive types ZIP / RAR / ISO / CHM / HWP / LNK"]}, {"name": "Lifecycle Position & Next Steps", "chips": ["First foothold", "User Execution T1204", "Exploitation for Client Execution T1203", "PowerShell T1059.001", "Ingress Tool Transfer T1105", "Attachment vs link vs service trade-offs"]}, {"name": "Platforms & Execution Context", "chips": ["Linux", "Windows", "macOS", "User permission required", "One chosen target at a time"]}, {"name": "Data Sources & Telemetry", "chips": ["Email gateway logs", "File creation on disk", "Process execution (Office spawning shells)", "Outbound network flow", "User mail directories", "Mail.app logs (macOS)"]}, {"name": "Detection Logic & Analytics", "chips": ["DET0236 Detection Strategy", "AN0655 Windows correlation", "AN0656 Linux correlation", "AN0657 macOS correlation", "Detonation / sandboxing", "Mark-of-the-Web", "False-positive tuning"]}, {"name": "Mitigations & Controls", "chips": ["M1049 Antivirus/Antimalware", "M1047 Audit", "M1031 Network Intrusion Prevention", "M1021 Restrict Web-Based Content", "M1054 Software Configuration", "M1018 User Account Management", "M1017 User Training"]}, {"name": "Threat Actor Usage & Real-World Work", "chips": ["APT28 G0007", "APT29 G0016", "APT37 G0067", "APT-C-36 G0099", "Cobalt Group G0080", "Kimsuky G0094", "Emotet S0367", "SOC triage", "IR evidence", "CTI reporting", "Awareness training", "Red-team emulation"]}], "introExpl": "\n<h3>What you will learn<\/h3>\n<p>This exam is about one MITRE ATT&amp;CK object: <b>T1566.001 &mdash; Phishing: Spearphishing Attachment<\/b>.<\/p>\n<p><b>What kind of object is this?<\/b> T1566.001 is a <b>sub-technique<\/b>. A sub-technique is one specific way to do a bigger thing. The bigger thing here is the technique <b>T1566 &mdash; Phishing<\/b>. Phishing has four sub-techniques: a malicious file attached to an email (T1566.001), a bad link inside an email (T1566.002), phishing through a trusted service (T1566.003), and phishing by phone call (T1566.004). This exam is only about the <b>attachment<\/b> form. In the ATT&amp;CK matrix it sits in the tactic <b>Initial Access (TA0001)<\/b> &mdash; the first step of an attack.<\/p>\n<p><b>What does the attacker do?<\/b> Imagine you get an email that looks normal. It says: &ldquo;Your invoice is attached.&rdquo; A file is attached: a Word document, a PDF, an archive like ZIP or RAR, or an executable. The email gives you a believable reason to open the file. Sometimes it even tells you how to unlock it &mdash; for example, a ZIP password written in the email. That trick helps the attacker slip past email scanners, because a scanner cannot open a password-protected archive. When you open the file, hidden code runs. Sometimes the file uses a bug in the program (an exploit). Sometimes it only asks you to click &ldquo;Enable content&rdquo;. Attackers also fake file names and icons, so a program looks like a simple document.<\/p>\n<p><b>Where is this used at work?<\/b> You will meet T1566.001 in many roles. A <b>SOC analyst<\/b> triages alerts from the mail gateway and the endpoint. An <b>incident responder<\/b> collects the attachment and the evidence on the machine. A <b>detection engineer<\/b> builds analytics like ATT&amp;CK&rsquo;s <b>DET0236<\/b>: it links email delivery, file creation, and abnormal process execution &mdash; for example Word spawning PowerShell or CMD. A <b>threat-intel analyst<\/b> tracks the many groups that use it: APT28, APT29, APT37, APT-C-36, Cobalt Group, Kimsuky, and malware like Emotet. An <b>awareness trainer<\/b> teaches staff to report invoice and shipping lures. A <b>red teamer<\/b> imitates this attack to test the mail defences. A <b>GRC or control owner<\/b> maps the mitigations &mdash; M1049, M1021, M1054, M1017 and others &mdash; to this risk.<\/p>\n<p><b>Why does it matter?<\/b> The spearphishing attachment is one of the most common first steps of a real intrusion. Ransomware gangs, spies and e-crime groups all start here. If you can stop it, you stop the whole attack before it starts.<\/p>\n", "introThemes": "<div class=\"kwgroup\"><h5>Technique Identity & Family<\/h5><div class=\"themechips\"><span>T1566.001 Spearphishing Attachment<\/span><span>Parent T1566 Phishing<\/span><span>T1566.002 Spearphishing Link<\/span><span>T1566.003 Spearphishing via Service<\/span><span>T1566.004 Spearphishing Voice<\/span><span>Initial Access TA0001<\/span><span>ATT&CK Enterprise v2.2<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Adversary Behaviour & Lure Craft<\/h5><div class=\"themechips\"><span>Plausible pretext<\/span><span>Enable-content prompt<\/span><span>ZIP password in email body<\/span><span>Extension & icon manipulation<\/span><span>Exploit or direct execution<\/span><span>Archive types ZIP / RAR / ISO / CHM / HWP / LNK<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Lifecycle Position & Next Steps<\/h5><div class=\"themechips\"><span>First foothold<\/span><span>User Execution T1204<\/span><span>Exploitation for Client Execution T1203<\/span><span>PowerShell T1059.001<\/span><span>Ingress Tool Transfer T1105<\/span><span>Attachment vs link vs service trade-offs<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Platforms & Execution Context<\/h5><div class=\"themechips\"><span>Linux<\/span><span>Windows<\/span><span>macOS<\/span><span>User permission required<\/span><span>One chosen target at a time<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Data Sources & Telemetry<\/h5><div class=\"themechips\"><span>Email gateway logs<\/span><span>File creation on disk<\/span><span>Process execution (Office spawning shells)<\/span><span>Outbound network flow<\/span><span>User mail directories<\/span><span>Mail.app logs (macOS)<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Detection Logic & Analytics<\/h5><div class=\"themechips\"><span>DET0236 Detection Strategy<\/span><span>AN0655 Windows correlation<\/span><span>AN0656 Linux correlation<\/span><span>AN0657 macOS correlation<\/span><span>Detonation / sandboxing<\/span><span>Mark-of-the-Web<\/span><span>False-positive tuning<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Mitigations & Controls<\/h5><div class=\"themechips\"><span>M1049 Antivirus/Antimalware<\/span><span>M1047 Audit<\/span><span>M1031 Network Intrusion Prevention<\/span><span>M1021 Restrict Web-Based Content<\/span><span>M1054 Software Configuration<\/span><span>M1018 User Account Management<\/span><span>M1017 User Training<\/span><\/div><\/div><div class=\"kwgroup\"><h5>Threat Actor Usage & Real-World Work<\/h5><div class=\"themechips\"><span>APT28 G0007<\/span><span>APT29 G0016<\/span><span>APT37 G0067<\/span><span>APT-C-36 G0099<\/span><span>Cobalt Group G0080<\/span><span>Kimsuky G0094<\/span><span>Emotet S0367<\/span><span>SOC triage<\/span><span>IR evidence<\/span><span>CTI reporting<\/span><span>Awareness training<\/span><span>Red-team emulation<\/span><\/div><\/div>", "introRules": "\n<p><b>Goal:<\/b> master the ATT&amp;CK sub-technique <b>T1566.001 Spearphishing Attachment<\/b> at <b>HARD<\/b> level. HARD means: two to three interacting ideas per exercise, realistic artefact sets that must be correlated, near-miss answers that are defensible in another context but wrong here, and traps &mdash; something alarming that is benign, something benign-looking that is not, and at least one moment where the correct action is the <b>least aggressive<\/b> one.<\/p>\n<p><b>Passing score:<\/b> <b>70%<\/b>. Every exercise is worth <b>10 points<\/b>, so <b>120 points<\/b> are possible in total.<\/p>\n<p><b>Exercise types you will see:<\/b> a two-log correlation viewer with a filter, decision QCMs, artefact-to-tactic mapping, <b>one unsupervised terminal task<\/b> (no tool is named for you &mdash; near-miss flags exist), a three-step incident decision, detection-engineering choices, procedure-example matching, and detection rule drafting.<\/p>\n<p><b>Timer:<\/b> <b>45 minutes<\/b> for the whole exam. Pause is available and hides the exercise. When time runs out, unanswered exercises are simply not scored.<\/p>\n<p><b>Hints:<\/b> the Hint button removes one wrong path &mdash; it never names the concept &mdash; and costs <b>&minus;10%<\/b> of that exercise (one point).<\/p>\n<p><b>Skip:<\/b> every exercise has a <b>Skip<\/b> button. Return to skipped exercises any time before you finish, while the timer runs. Skipped-and-never-answered exercises are <b>excluded from the score<\/b>.<\/p>\n<p><b>Retake:<\/b> retakes reshuffle questions and options.<\/p>\n", "exercises": [{"id": "H01", "type": "logview", "theme": 4, "points": 10, "typeLabel": "Log analysis", "title": "Prove which attachment actually executed", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Gateway log, morning window<\/div><pre class=\"log\" data-hl=\"1\">08:58:11  gw03  DELIVER from=partner@velocorp[.]example  subj=\"Signed Q3 pricing\"  att=Q3_Pricing.pdf  verdict=clean\n09:01:47  gw03  DELIVER from=billing@voyage-support[.]example  subj=\"Invoice #8841 - FINAL NOTICE\"  att=Invoice_8841.docm  verdict=clean (no sig match)<\/pre><\/div><div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 2 &mdash; EDR lines, three hosts<\/div><pre class=\"log\" data-hl=\"1\">09:02:20  fin-ws-22   PROC  winword.exe -&gt; powershell.exe -enc SQBFAF...   doc=Invoice_8841.docm  motw=1\n09:02:44  fin-ws-22   FILE_CREATE  %APPDATA%\\\\svchost32.exe\n09:05:01  hr-ws-07    PROC  winword.exe -&gt; cmd.exe /c it_template_sync.cmd   sig=ACME-IT(cert valid)  motw=0\n09:05:02  hr-ws-07    FILE_CREATE  \\\\\\\\fileserver\\\\it\\\\templates\\\\cache\\\\style.dotx\n09:07:52  fin-ws-31   PROC  acrord32.exe -&gt; cmd.exe /c help_0815.cmd   doc=Q3_Pricing.pdf  motw=1<\/pre><\/div><div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 3 &mdash; Ticket note from your lead<\/div><p>&ldquo;Board wants one line: which attachment <b>executed<\/b>? Q3_Pricing went to the whole company, Invoice went to one accountant. Give me the first EDR line that <b>proves execution<\/b> of the phishing payload &mdash; not noise.&rdquo;<\/p><\/div>", "scenarioSummary": "Two delivered emails, three hosts with Office-spawned shells &mdash; one is benign IT automation", "question": "Click the EDR line that first proves the spearphishing attachment achieved code execution.", "data": {"logs": ["08:58:11  gw03  DELIVER from=partner@velocorp[.]example  subj=\"Signed Q3 pricing\"  att=Q3_Pricing.pdf  verdict=clean", "09:01:47  gw03  DELIVER from=billing@voyage-support[.]example  subj=\"Invoice #8841 - FINAL NOTICE\"  att=Invoice_8841.docm  verdict=clean (no sig match)", "09:02:20  fin-ws-22   PROC  winword.exe -> powershell.exe -enc SQBFAF...   doc=Invoice_8841.docm  motw=1", "09:02:44  fin-ws-22   FILE_CREATE  %APPDATA%\\svchost32.exe", "09:05:01  hr-ws-07    PROC  winword.exe -> cmd.exe /c it_template_sync.cmd   sig=ACME-IT(cert valid)  motw=0", "09:05:02  hr-ws-07    FILE_CREATE  \\\\fileserver\\it\\templates\\cache\\style.dotx", "09:07:52  fin-ws-31   PROC  acrord32.exe -> cmd.exe /c help_0815.cmd   doc=Q3_Pricing.pdf  motw=1"], "targets": [2], "filterHint": "Try the filter: PROC or motw"}, "hint": "One of the two Office-spawned shells runs a file that never crossed the internet &mdash; and one PDF is doing something PDFs should not.", "explain": "<p>Correlate the artefacts. <b>09:02:20<\/b>: Word spawned <b>encoded PowerShell<\/b> from <b>Invoice_8841.docm<\/b> with <b>MOTW=1<\/b> (came from the internet) &mdash; that is the phishing payload executing, seconds after its own delivery line. <b>09:05:01<\/b> looks identical (Word spawns cmd) but it is signed IT automation, <b>MOTW=0<\/b>, pushing templates &mdash; alarming to the eye, benign in fact. <b>09:07:52<\/b> is the reverse trap: a quiet PDF spawning a script is <b>also<\/b> execution &mdash; but it happened <b>later<\/b>, and the lead asked for the first proof tied to the phishing email. The FILE_CREATE lines alone prove storage, not execution.<\/p>", "study": "MOTW as a discriminator, signed-parent context, and &lsquo;first proof of execution&rsquo; vs later artefacts.", "persp": {"atk": "Attacker view: your payload only exists in the timeline if something executed &mdash; a dropped file nobody ran is invisible.", "def": "Defender view: MOTW + external-sender context separates the phishing shell from signed IT automation."}}, {"id": "H02", "type": "qcm", "theme": 7, "points": 10, "typeLabel": "Multiple choice", "title": "02:00 alert on the CFO laptop — benign or malicious?", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Alert<\/div><pre class=\"log\" data-hl=\"1\">02:03  cfo-lt-01  PROC  winword.exe -&gt; powershell.exe -nop -enc SQBFAF...\n       doc=\"AMC_Bank_Recon_Macro.xlsm\"  motw=1<\/pre><\/div><div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 2 &mdash; Corroborating records<\/div><pre class=\"log\" data-hl=\"1\">CHG-2291 (approved): asset-management pilot deployed\n  AMC_Bank_Recon_Macro.xlsm to finance laptops YESTERDAY\nFile hash matches pilot build 002  |  vendor cert: valid\nSender domain bank-amc[.]example: registered 2019, SPF pass<\/pre><\/div>", "scenarioSummary": "Encoded PowerShell from Office on the CFO laptop &mdash; plus a matching change record", "question": "Which assessment is correct for the 02:00 alert?", "data": {"options": ["Benign: workbook matches approved change CHG-2291, hash matches pilot build, cert valid", "Malicious: MOTW together with encoded PowerShell outweighs any change record", "Benign: the CFO is a high-value user and would never open a phishing file", "Malicious: anything running at 02:00 at night is an attack by definition"], "answer": 0}, "hint": "Two artefacts must be read together &mdash; the alert alone tells only half the story.", "explain": "<p>This is the &ldquo;alarming but benign&rdquo; trap. Encoded PowerShell from Office <b>is<\/b> the T1566.001 execution pattern &mdash; on its own it deserves a page. But two independent artefacts corroborate a legitimate story: an <b>approved change<\/b> (CHG-2291) deployed this exact workbook yesterday, and the <b>hash matches<\/b> the pilot build. The MOTW flag simply records that the file arrived by download. Correct assessment: benign, with the pilot owner contacted to close the loop. Position and seniority of the user prove nothing; neither does the clock.<\/p>", "study": "Corroborating EDR alerts with change records and file hashes before judging.", "persp": {"atk": "Attacker view: a real pilot deployment is free camouflage &mdash; mimicking sanctioned macro activity is the perfect costume.", "def": "Defender view: hash-match to an approved build is the fastest benign-verdict you can defend in a report."}}, {"id": "H03", "type": "dragdrop", "theme": 2, "points": 10, "typeLabel": "Drag & drop", "title": "Map the six artefacts onto the ATT&CK columns", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Incident artefacts, case 8841<\/div><pre class=\"log\" data-hl=\"1\"> a. \"Invoice #8841\" email spoofed as supplier billing\n b. Invoice_8841.docm arrives as the attached file\n c. User enables macros; payload code starts running\n d. winword.exe spawns powershell.exe -enc ...\n e. ATT&CK T1036-style: .exe wearing a PDF icon\n f. Beacon to 45[.]61[.]184[.]9 every 60 seconds<\/pre><\/div>", "scenarioSummary": "Six artefacts to map onto three tactic columns", "question": "Drag each artefact into the tactic column where ATT&CK files it.", "data": {"zones": [{"name": "Initial Access (TA0001)", "items": [0, 1]}, {"name": "Execution (TA0002)", "items": [2, 3]}, {"name": "Command and Control (TA0011)", "items": [5]}, {"name": "Defense Evasion (TA0005)", "items": [4]}], "items": [{"t": "Email spoofed as supplier billing"}, {"t": "Invoice_8841.docm arrives attached"}, {"t": "User enables macros; code starts"}, {"t": "Word spawns powershell -enc"}, {"t": ".exe wearing a PDF icon"}, {"t": "Beacon every 60 seconds"}]}, "hint": "Ask what each artefact achieves for the adversary, not where the file sits on disk.", "explain": "<p>Two artefacts are <b>Initial Access<\/b>: the spoofed lure and the delivered attachment (both are T1566.001 tradecraft). Two are <b>Execution<\/b>: the macro enable and the Word-spawns-PowerShell moment. The <b>PDF icon on an .exe<\/b> is <b>Defense Evasion<\/b> &mdash; ATT&amp;CK calls that masquerading (T1036); it evades human and filter inspection. The <b>beacon<\/b> is <b>Command and Control<\/b>. The near-miss is icon-spoofing: it happens at delivery time, but its purpose is evasion, not access.<\/p>", "study": "Masquerading (T1036) under Defense Evasion, vs delivery artefacts under Initial Access."}, {"id": "H04", "type": "terminal", "theme": 4, "points": 10, "typeLabel": "Terminal task", "title": "List what the user wrote, newest first — tool is your choice", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; IR lead&rsquo;s instructions<\/div><p>You are on the live host <b>fin-ws-22<\/b> in a Windows <b>cmd.exe<\/b> session as local admin (PowerShell is unavailable on this box). The user opened the phishing attachment 3 days ago. The lead needs: <b>every file under the user profile that the user WROTE or MODIFIED in the last days, newest first, with full paths<\/b> &mdash; so the droppers surface. No tool is named. Choose the command and its flags carefully: several near-miss switches exist.<\/p><\/div>", "scenarioSummary": "cmd.exe only — recurse the profile, sort by write time, full paths", "question": "Type the command that meets the lead's requirement exactly.", "data": {"prompt": "C:\\Users\\k.reddy>", "motd": ["Microsoft Windows [Version 10.0.22631]", "(c) Microsoft Corporation. All rights reserved.", ""], "accepted": ["dir C:\\Users\\k.reddy /s /b /o-d /t:w"], "matchMode": "tokens", "caseSensitive": false, "maxAttempts": 3, "canonical": "dir C:\\Users\\k.reddy /s /b /o-d /t:w", "canonicalParts": [{"p": "dir", "m": "the directory listing tool (you chose it yourself)"}, {"p": "C:\\Users\\k.reddy", "m": "the user profile to inspect"}, {"p": "/s", "m": "recurse into every subfolder of the profile"}, {"p": "/b", "m": "bare output = full paths, nothing decorative"}, {"p": "/o-d", "m": "order by date, newest first (d = date, minus = reversed)"}, {"p": "/t:w", "m": "use the LAST-WRITTEN timestamp — the lead asked what the user WROTE"}], "output": "C:\\Users\\k.reddy\\AppData\\Roaming\\svchost32.exe\nC:\\Users\\k.reddy\\AppData\\Roaming\\s.vbs\nC:\\Users\\k.reddy\\Downloads\\Invoice_8841.docm\nC:\\Users\\k.reddy\\Documents\\Q3_notes.docx\nC:\\Users\\k.reddy\\Downloads\\...", "dangerNote": "Near-miss: /t:c would list CREATION time instead of last-written &mdash; defensible in another case, wrong for this instruction. /o-n sorts by name. Dropping /s misses the AppData droppers.", "errText": "The requirement is: recurse the profile, bare full paths, newest first, by last-written time. Re-check each switch."}, "hint": "&lsquo;Written or modified&rsquo; has its own timestamp switch on every directory tool &mdash; and it is not the default sort key.", "explain": "<p><span class=\"mono\">dir C:\\Users\\k.reddy /s /b /o-d /t:w<\/span> answers all four requirements at once: recurse (<b>/s<\/b>), full paths (<b>/b<\/b>), newest first (<b>/o-d<\/b>), and <b>last-written<\/b> time (<b>/t:w<\/b>). The classic near-miss <b>/t:c<\/b> reads creation time &mdash; clever, wrong: the lead asked what was written. Missing <b>/s<\/b> hides the AppData droppers; <b>/o-n<\/b> sorts alphabetically and buries the timeline.<\/p>", "study": "dir switches /s /b /o-d /t:w and the difference between written and creation time."}, {"id": "H05", "type": "steps", "theme": 7, "points": 10, "typeLabel": "Scenario steps", "title": "The user forwarded the lure to 11 colleagues", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Gateway summary, one hour later<\/div><pre class=\"log\" data-hl=\"1\">09:14  Original delivery: 1 recipient (k.reddy)\n09:41  k.reddy FORWARDs the email to DL \"finance-team\"\n       Gateway records 12 deliveries total (11 new)\n10:02  EDR back-check so far: 2 of 12 users opened it<\/pre><\/div>", "scenarioSummary": "One forwarded email became 12 deliveries; 2 opens known", "question": "Work the three decisions in order.", "data": {"steps": [{"scenario": "Your queue shows the same attachment on 12 mailboxes now.", "question": "Step 1: What did the forwarding actually change?", "options": ["The possible victim set grew, and the thread is now evidence", "Nothing: forwarding sanitises attachments automatically", "Only the original sender is now affected", "The gateway re-detained every copy on its own"], "answer": 0, "explain": "Forwarding multiplies the attack surface and makes the original thread part of the case record."}, {"scenario": "You must act without overreacting. Two of twelve users opened the file.", "question": "Step 2: Choose the least aggressive correct action right now.", "options": ["Search gateway and EDR for opens across all 12, isolate only hosts that executed", "Shut down the mail system company-wide until further notice", "Force a password reset for every employee immediately", "Wipe all 12 mailboxes before the payload spreads further"], "answer": 0, "explain": "Blast-radius-first: measure who actually executed, then isolate exactly those hosts."}, {"scenario": "Helpdesk asks: may we purge the message from all mailboxes now?", "question": "Step 3: What do you tell helpdesk about the emails themselves?", "options": ["Preserve them; do not delete or purge anything yet", "Purge every copy from every folder instantly", "Reply-all to ask who opened it", "Print them and store the paper copies"], "answer": 0, "explain": "The messages are evidence with headers and attachment hashes. Purge only after collection, under change control."}]}, "hint": "Scope grew, evidence must survive, and the response must match the real blast radius.", "explain": "<p>The near-miss is the <b>benign-looking<\/b> forward: a helpful colleague quietly turned one target into twelve. Correct handling: <b>1)<\/b> the victim set and the evidence set both grew; <b>2)<\/b> measure execution across all 12 and isolate only what executed &mdash; the least aggressive action that still contains; <b>3)<\/b> preserve the messages &mdash; they carry headers, hashes and the attachment your CTI report needs. Mass resets, mail shutdown and mailbox wipes cost more than the incident has so far.<\/p>", "study": "Scope expansion after user forwarding, and evidence-preserving containment choices."}, {"id": "H06", "type": "qcm", "theme": 5, "points": 10, "typeLabel": "Multiple choice", "title": "Tune the Office-spawns-shell analytic without losing coverage", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; SIEM metric for analytic AN0655-style rule<\/div><pre class=\"log\" data-hl=\"1\">Rule: Office app spawns PowerShell / CMD\nFires: 38 alerts/day\nTrue positives last quarter: 2 (both T1566.001)\nBenign source: finance Excel add-ins, signed,\n                internal, no MOTW, on 6 hosts<\/pre><\/div>", "scenarioSummary": "High-noise analytic with two true positives last quarter", "question": "Which tuning keeps T1566.001 coverage with the fewest false positives?", "data": {"options": ["Keep the logic; require MOTW on the file and an external email sender", "Alert on every winword.exe launch and let analysts sort the rest", "Delete the analytic because finance noise makes it useless", "Delay every alert by 24 hours so analysts see more context first"], "answer": 0}, "hint": "Do not lose the signal &mdash; add the two conditions that only phishing documents carry.", "explain": "<p>The analytic is <b>precious<\/b>: two true T1566.001 executions last quarter. The noise is specific too: signed, internal, no-MOTW add-ins. So add the two conditions that separate phishing documents from those add-ins &mdash; <b>Mark-of-the-Web<\/b> on the opened file and an <b>external sender<\/b> in the delivery record. That is exactly the spirit of AN0655 (correlate email delivery with abnormal execution). Deleting the rule burns your only execution-time signal; alerting on every Word launch is noise maximisation; a 24-hour delay hides real intrusions.<\/p>", "study": "Precision vs recall in detection tuning, and the correlation idea behind DET0236/AN0655."}, {"id": "H07", "type": "match", "theme": 7, "points": 10, "typeLabel": "Matching pairs", "title": "Match the malware families to their attachment tradecraft", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Procedure examples from the T1566.001 page (shuffled)<\/div><pre class=\"log\" data-hl=\"1\"> S0367 Emotet        ?\n S0080 Cobalt Group  ?\n S0499 Hancitor      ?\n G0094 Kimsuky       ?<\/pre><\/div>", "scenarioSummary": "Four recorded actors, four attachment habits", "question": "Match each actor to the attachment behaviour ATT&CK records for it.", "data": {"pairs": [["Emotet (S0367)", "Delivered by phishing emails containing attachments, as macro loaders"], ["Cobalt Group (G0080)", "Archives holding LNK files, and password-protected archives with .exe and .scr"], ["Hancitor (S0499)", "Phishing emails with malicious Word document attachments"], ["Kimsuky (G0094)", "Word, Excel and HWP documents, plus ZIPs holding disguised LNK files"]]}, "hint": "Cobalt loves archives with shortcuts inside; Emotet rides plain macro documents; Kimsuky mixes Korean formats.", "explain": "<p>From the page&rsquo;s procedure table: <b>Emotet<\/b> is &ldquo;delivered by phishing emails containing attachments&rdquo; &mdash; the classic macro loader. <b>Cobalt Group<\/b> used .rtf, .doc, .xls, <b>archives containing LNK files<\/b>, and <b>password-protected archives containing .exe and .scr<\/b>. <b>Hancitor<\/b> rode malicious Word documents. <b>Kimsuky<\/b> mixed Word, Excel and <b>HWP<\/b> and shipped ZIPs with <b>disguised LNK<\/b> files. Two families touching the same container type does not make them the same actor.<\/p>", "study": "Procedure examples on the T1566.001 page for Emotet, Cobalt Group, Hancitor and Kimsuky."}, {"id": "H08", "type": "qcm", "theme": 7, "points": 10, "typeLabel": "Multiple choice", "title": "Board call in ten minutes — choose the proportionate action", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; The situation, verbatim from the queue<\/div><pre class=\"log\" data-hl=\"1\">10:58  Sandbox match: PDF opened by the CFO matches\n       a known stealer family (high confidence)\n       ONE host involved. DCs patched last week.\n11:00  Board call starts. CISO unreachable for 10 min.<\/pre><\/div>", "scenarioSummary": "One confirmed host, ten minutes, no CISO", "question": "Choose the proportionate next action.", "data": {"options": ["Isolate the CFO laptop, start host triage, let the board call proceed", "Take the whole domain offline as a precaution", "Close the alert until after the board call finishes", "Reboot every finance laptop immediately to clear memory"], "answer": 0}, "hint": "Match the response to the confirmed blast radius &mdash; one host is one decision, not a domain decision.", "explain": "<p>The correct action is the <b>least aggressive<\/b> one that still contains: isolate the single confirmed host and triage it, while the business continues. A domain-wide outage punishes 10,000 people for one confirmed endpoint; ignoring the alert hands the stealer its window; mass reboots destroy volatile memory &mdash; the best evidence you own. Proportionality is a HARD skill: your response should match the blast radius you have actually proven.<\/p>", "study": "Proportionate containment: isolate confirmed hosts, keep the business running, preserve volatile evidence.", "persp": {"atk": "Attacker view: your payload hopes for exactly two responses &mdash; panic shutdown (kills your access but not your job) or nothing (kills nothing).", "def": "Defender view: calm, scoped containment plus triage is the response that survives the post-mortem."}}, {"id": "H09", "type": "fill", "theme": 5, "points": 10, "typeLabel": "Fill the blanks", "title": "Draft the high-value detection rule", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Rule draft, three words missing<\/div><pre class=\"log\" data-hl=\"1\">DETECTION RULE (draft) — high value\n\nHIGH: an Office application (winword, excel,\npowerpnt) spawns [ 1 ] or [ 2 ] , and the opened\ndocument carried Mark-of-the-Web from an\n[ 3 ] sender.<\/pre><\/div>", "scenarioSummary": "Detection rule with three blanks", "question": "Place the three missing terms into the rule.", "data": {"parts": ["HIGH: an Office application (winword, excel, powerpnt) spawns&nbsp;", "&nbsp;or&nbsp;", "&nbsp;, and the opened document carried Mark-of-the-Web from an&nbsp;", "&nbsp;sender."], "answers": ["powershell.exe", "cmd.exe", "external"], "bank": ["powershell.exe", "cmd.exe", "external", "internal", "notepad.exe", "msiexec.exe"]}, "hint": "Two blanks are the shells Office should never start. One blank describes where the email came from.", "explain": "<p>The high-fidelity core of AN0655: <b>Office spawning powershell.exe or cmd.exe<\/b>, restricted to documents with <b>Mark-of-the-Web<\/b> from an <b>external<\/b> sender. MOTW plus external sender are the two conditions that make the rule specific to T1566.001-style delivery instead of every internal macro tool. notepad.exe and msiexec.exe are not the shells this analytic hunts; &ldquo;internal&rdquo; would drown the rule in finance add-ins again.<\/p>", "study": "AN0655's behaviour chain and why MOTW + external sender are the two magic conditions."}, {"id": "H10", "type": "logview", "theme": 4, "points": 10, "typeLabel": "Log analysis", "title": "Find the beacon among the business traffic", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Network flows, fin-ws-22, one hour<\/div><pre class=\"log\" data-hl=\"1\">09:03:15  NET_FLOW  45[.]61[.]184[.]9:443   dur=1s    proc=svchost32.exe  first_seen=yes\n09:04:15  NET_FLOW  45[.]61[.]184[.]9:443   dur=1s    proc=svchost32.exe\n09:04:40  NET_FLOW  52[.]96[.]11[.]4:443    dur=780s  proc=msoidc     (Microsoft 365)\n09:05:15  NET_FLOW  45[.]61[.]184[.]9:443   dur=1s    proc=svchost32.exe\n09:06:03  NET_FLOW  13[.]107[.]42[.]14:443  dur=221s  proc=Teams.exe  (Microsoft Teams)\n09:06:15  NET_FLOW  45[.]61[.]184[.]9:443   dur=1s    proc=svchost32.exe\n09:07:15  NET_FLOW  45[.]61[.]184[.]9:443   dur=1s    proc=svchost32.exe\n09:08:15  NET_FLOW  45[.]61[.]184[.]9:443   dur=1s    proc=svchost32.exe\n09:08:52  NET_FLOW  23[.]44[.]51[.]8:443    dur=96s   proc=chrome.exe (CDN)\n09:09:15  NET_FLOW  45[.]61[.]184[.]9:443   dur=1s    proc=svchost32.exe<\/pre><\/div>", "scenarioSummary": "Ten flows &mdash; one rhythm does not belong", "question": "Click the flow line that matches command-and-control beaconing after the attachment executed.", "data": {"logs": ["09:03:15  NET_FLOW  45[.]61[.]184[.]9:443   dur=1s    proc=svchost32.exe  first_seen=yes", "09:04:15  NET_FLOW  45[.]61[.]184[.]9:443   dur=1s    proc=svchost32.exe", "09:04:40  NET_FLOW  52[.]96[.]11[.]4:443    dur=780s  proc=msoidc     (Microsoft 365)", "09:05:15  NET_FLOW  45[.]61[.]184[.]9:443   dur=1s    proc=svchost32.exe", "09:06:03  NET_FLOW  13[.]107[.]42[.]14:443  dur=221s  proc=Teams.exe  (Microsoft Teams)", "09:06:15  NET_FLOW  45[.]61[.]184[.]9:443   dur=1s    proc=svchost32.exe", "09:07:15  NET_FLOW  45[.]61[.]184[.]9:443   dur=1s    proc=svchost32.exe", "09:08:15  NET_FLOW  45[.]61[.]184[.]9:443   dur=1s    proc=svchost32.exe", "09:08:52  NET_FLOW  23[.]44[.]51[.]8:443    dur=96s   proc=chrome.exe (CDN)", "09:09:15  NET_FLOW  45[.]61[.]184[.]9:443   dur=1s    proc=svchost32.exe"], "targets": [0], "filterHint": "Try the filter: 45[.]61 or first_seen"}, "hint": "Two signals together: a process name that pretends to be Windows, and a rhythm no business app keeps.", "explain": "<p>The beacon is a <b>fixed 60-second rhythm<\/b>, <b>1 second<\/b> long, to one fresh address, from <b>svchost32.exe<\/b> &mdash; a name that imitates the real Windows service host (svchost.exe). That triple is C2. The Microsoft 365, Teams and CDN flows are long-lived or irregular business traffic to known estates. The first line even says <b>first_seen=yes<\/b>: the destination appeared right after the attachment executed, which is the last stage of the DET0236 behaviour chain (outbound network activity).<\/p>", "study": "Beacon patterns (interval, duration, jitter), process masquerading, and first_seen as a triage anchor."}, {"id": "H11", "type": "dragdrop", "theme": 6, "points": 10, "typeLabel": "Drag & drop", "title": "Which control stops which payload, and where the gap is", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Four payload deliveries seen this quarter<\/div><pre class=\"log\" data-hl=\"1\"> a. VBA macro inside a .docm downloaded from the web\n b. Bare .exe attached directly to the email\n c. Password-protected RAR the business policy ALLOWS\n d. Macro-free PDF exploiting a reader vulnerability<\/pre><\/div>", "scenarioSummary": "Four deliveries, three control buckets", "question": "Drag each delivery onto the control that stops it, or into the gap.", "data": {"zones": [{"name": "M1049 Antivirus/Antimalware stops it", "items": [0]}, {"name": "M1021 Restrict Web-Based Content stops it", "items": [1]}, {"name": "Neither directly — detection-led (DET0236)", "items": [2, 3]}], "items": [{"t": "VBA macro in a .docm from the internet"}, {"t": "Bare .exe attached to the email"}, {"t": "Password-protected RAR the policy allows"}, {"t": "Macro-free PDF exploiting a reader bug"}]}, "hint": "One delivery dies to the endpoint scanner, one to the mail filter. The other two walk past both — and must be caught by watching.", "explain": "<p><b>M1049<\/b> is the antivirus/antimalware control: it scans and quarantines the malicious macro document &mdash; that kills the .docm. <b>M1021<\/b> lets the gateway block dangerous attachment types by default (.exe, .scr, .pif, .cpl) &mdash; that kills the bare .exe. But a <b>password-protected RAR the business allows<\/b> cannot be opened by the scanner without the body password, and a <b>macro-free exploit PDF<\/b> (the T1203-style route: it attacks a reader bug, not a macro setting) carries nothing for a policy to block: both land in the <b>detection-led<\/b> bucket, where DET0236-style analytics (execution and outbound flow) must catch them. Coverage-gap thinking: every control leaves a remainder, and the remainder needs telemetry.<\/p>", "study": "Mitigation coverage gaps on the T1566.001 page, and compensating detections for encrypted archives and exploits."}, {"id": "H12", "type": "qcm", "theme": 1, "points": 10, "typeLabel": "Multiple choice", "title": "Perfect headers, ugly attachment — which signal wins?", "scenario": "<div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 1 &mdash; Envelope<\/div><pre class=\"log\" data-hl=\"1\">From: logistics@eurohaul-partners[.]example\nSPF: pass   DKIM: pass   DMARC: pass\nDomain age: 6 years   TLS: valid<\/pre><\/div><div class=\"artefact\"><div class=\"artefact-label\">ARTEFACT 2 &mdash; Attachment<\/div><pre class=\"log\" data-hl=\"1\">Delivery_note_8841.zip  containing Delivery_note_8841.iso\nPassword in email body: \"8841\"\nISO content: .exe with a PDF icon<\/pre><\/div>", "scenarioSummary": "Authenticated sender, but archive-in-archive with a body password", "question": "Which assessment is correct for this message?", "data": {"options": ["Malicious: archive tricks and icon spoofing outweigh header reputation", "Clean: passing SPF, DKIM and DMARC prove the message is safe", "Clean: a six-year-old domain would never be used to send malware", "Hold forever in quarantine: classification is impossible here"], "answer": 0}, "hint": "Headers describe the envelope. The file describes the attack. One of them is lying.", "explain": "<p>Headers can be perfect because mail was <b>relayed<\/b> or the sender account was compromised &mdash; authentication proves the message really came from that domain, not that the domain is trustworthy. The attachment side reads straight from the T1566.001 page: instructions to <b>decrypt an archive to evade email boundary defenses<\/b>, and <b>file extensions and icons manipulated<\/b> so an executable looks like a document. Behaviour beats reputation: classify malicious, then report the compromised or spoofed sender to the real partner.<\/p>", "study": "Why SPF/DKIM/DMARC pass is not a clean bill of health, and the page's evasion sentences."}]};
</script>
<script>

(function(){
"use strict";
var E = window.EXAM;                       // {meta, themes, introHtml, exercises}
var EXS = E.exercises;
var $ = function(s, el){ return (el||document).querySelector(s); };
var app;

/* ---------- utils ---------- */
function shuffle(arr){ var a=arr.slice(),i,j,t; for(i=a.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function el(tag, cls, html){ var d=document.createElement(tag); if(cls) d.className=cls; if(html!=null) d.innerHTML=html; return d; }
var RT = {};   // per-exercise runtime widget state, keyed by exercise id
function hlPass(root){ [].forEach.call(root.querySelectorAll("pre.log[data-hl]"), function(p){ p.innerHTML=hlLog(p.textContent); }); }
function ncmd(s){ return String(s==null?"":s).replace(/[\u2018\u2019\u201c\u201d]/g,"'").replace(/"/g,"").replace(/\s+/g," ").trim().replace(/[.]+$/,""); }
function normPair(input, accepted, mode, caseSensitive){
  function base(x){ x=ncmd(x); if(!caseSensitive) x=x.toLowerCase(); return x; }
  function fmt(x){ x=base(x); if(mode==="tokens"){ var t=x.split(" "); return t.sort().join(" "); } return x; }
  var a=fmt(input);
  for(var i=0;i<accepted.length;i++){ if(fmt(accepted[i])===a) return true; }
  return false;
}
var KW = ["PASS","BLOCK","DELIVER","PROC_START","FILE_CREATE","NET_FLOW","NET","MAIL_RECV","DROP","QUAR","OPEN","EXEC"];
function hlLog(line){
  var s = esc(line);
  s = s.replace(/\b(PASS|DELIVER|OK|CLEAN)\b/g,'<span class="ok">$1</span>');
  s = s.replace(/\b(BLOCK|QUAR|DENY|DROP)\b/g,'<span class="no">$1</span>');
  KW.forEach(function(k){ s = s.replace(new RegExp("\\b"+k+"\\b","g"), '<span class="kw">'+k+'</span>'); });
  s = s.replace(/\b\d{1,3}[\[].][]\d{1,3}[\].][\d[\].]{3,}\b/g, function(m){ return '<span class="ip">'+m+'</span>'; });
  s = s.replace(/\b[\w.-]+\.(docm|docx|exe|iso|img|rar|zip|pdf|lnk|chm|hta|scr|xls|xlsx|xlsm|rtf|hwp|vbs|js|dotx|eml)\b/gi, function(m){ return '<span class="file">'+m+'</span>'; });
  return s;
}

/* ---------- state ---------- */
var S = {
  order: [], pos: 0, phase: "intro",
  ans: {},          // id -> {status, earned, your, correct, res}
  skipped: [],      // ids never answered
  timerLeft: E.timerSec, tInt: null, paused: false,
  reported: false, userName: "", hintUsed: {}, exPts: {}
};
EXS.forEach(function(ex){ S.exPts[ex.id] = ex.points || 10; });

function badgeFor(){ return E.meta.difficulty; }
function badgeText(){ return E.difficultyLabel || E.meta.difficultyLabel; }

/* ---------- scoring ---------- */
function answeredIds(){ return EXS.filter(function(ex){ var a=S.ans[ex.id]; return a && (a.status==="correct"||a.status==="incorrect"||a.status==="partial"); }); }
function earnedPts(){ var n=0; answeredIds().forEach(function(ex){ n+=S.ans[ex.id].earned; }); return n; }
function maxPts(){ var n=0; answeredIds().forEach(function(ex){ n+=S.exPts[ex.id]; }); return n; }
function pct(){ var m=maxPts(); return m>0? Math.round(earnedPts()/m*100):0; }

/* ---------- header ---------- */
function buildHeader(){
  var h = el("div","hdr");
  h.innerHTML =
    '<span id="h-count" class="muted small"></span>' +
    '<span class="badge '+badgeFor()+'">['+esc(badgeText())+']</span>' +
    '<span id="h-theme" class="muted small" style="display:none"></span>' +
    '<span class="grow"></span>' +
    '<span class="timer" id="h-timer" role="timer" aria-label="Time remaining">--:--</span>' +
    '<button class="btn" id="h-pause" aria-label="Pause timer">&#9208; Pause</button>' +
    '<span class="score" id="h-score">0 pts &middot; 0%</span>' +
    '<button class="btn" id="h-hint" aria-label="Show hint for minus 10 percent">&#9432; Hint &minus;10%</button>' +
    '<button class="btn" id="h-skip" aria-label="Skip this exercise">&#9193; Skip</button>' +
    '<button class="btn" id="h-rev" aria-label="Review skipped exercises" style="display:none">&#8635; Skipped <span id="h-revn">0</span></button>';
  $("#h-pause",h).addEventListener("click", pauseExam);
  $("#h-hint",h).addEventListener("click", useHint);
  $("#h-skip",h).addEventListener("click", skipCurrent);
  $("#h-rev",h).addEventListener("click", openReview);
  return h;
}
function updHeader(){
  var t=$("#h-timer"), m=Math.floor(S.timerLeft/60), s=S.timerLeft%60;
  if(t){ t.textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s; t.className="timer"+(S.timerLeft<300?" low":""); }
  var sc=$("#h-score"); if(sc){ var p=pct(); sc.textContent = earnedPts()+" pts \u00b7 "+p+"%"; sc.setAttribute("aria-label","Live score "+earnedPts()+" points, "+p+" percent"); }
  var rev=$("#h-rev"); if(rev){ rev.style.display = (S.skipped.length && S.phase!=="results")? "":"none"; var rn=$("#h-revn"); if(rn) rn.textContent=S.skipped.length; }
  var pa=$("#h-pause"); if(pa){ pa.disabled = (S.phase!=="exam"); }
  var hint=$("#h-hint"); if(hint){ var ex=EXS[S.order[S.pos]]; var dis = (S.phase!=="exam") || !ex || S.hintUsed[ex.id] || (S.ans[ex.id]&&S.ans[ex.id].status!=="skipped"); hint.disabled=dis; }
  var sk=$("#h-skip"); if(sk){ var cu=EXS[S.order[S.pos]]; var ca=cu? S.ans[cu.id]:null; sk.disabled = (S.phase!=="exam") || (ca && ca.status!=="skipped" && ca.status!=="skipped-never"); }
  var hc=$("#h-count"); if(hc){ hc.textContent = S.phase==="exam"? ("Exercise "+(S.pos+1)+" of "+EXS.length) : (S.phase==="review"? "Review skipped exercises" : ""); }
}

/* ---------- timer ---------- */
function tick(){
  if(S.paused) return;
  S.timerLeft--;
  if(S.timerLeft<=0){ S.timerLeft=0; stopTimer(); timeUp(); return; }
  updHeader();
}
function startTimer(){ stopTimer(); S.tInt=setInterval(tick,1000); }
function stopTimer(){ if(S.tInt){ clearInterval(S.tInt); S.tInt=null; } }
function pauseExam(){
  if(S.phase!=="exam" || S.paused) return;
  S.paused=true; stopTimer();
  var v=el("div","veil");
  v.innerHTML='<h2>&#9208; Exam paused</h2><p class="muted">The timer is stopped and the exercise is hidden,<br>so nobody can read ahead while paused.</p>';
  var b=el("button","btn primary","&#9654; Resume"); b.addEventListener("click",function(){ S.paused=false; v.remove(); startTimer(); b.focus(); });
  v.appendChild(b); document.body.appendChild(v);
}
function timeUp(){
  EXS.forEach(function(ex){
    var a=S.ans[ex.id];
    if(!a || a.status==="skipped"){ S.ans[ex.id]={status:"skipped-never", earned:0}; }
  });
  showResults(true);
}

/* ---------- hint ---------- */
function useHint(){
  if(S.phase!=="exam") return;
  var ex=EXS[S.order[S.pos]]; if(!ex || S.hintUsed[ex.id]) return;
  S.hintUsed[ex.id]=true;
  var box=$("#hint-slot");
  if(box){ box.style.display=""; box.innerHTML='<div class="hintbox"><b>HINT (&minus;10% of this exercise):</b> '+ex.hint+'</div>'; }
  updHeader();
}

/* ---------- intro ---------- */
function introView(){
  S.phase="intro";
  app.innerHTML="";
  app.appendChild(buildHeader());
  var c=el("div","card intro-expl");
  c.innerHTML =
    '<h1 class="bigtitle">'+esc(E.meta.title)+'</h1>' +
    '<p class="subtitle">'+esc(E.subtitle||"")+'</p>' +
    '<div class="meta-chips">' +
      '<span class="mchip"><b>'+E.exercises.length+'</b> exercises</span>' +
      '<span class="mchip">Timer <b>'+E.meta.estimatedMinutes+' min</b> (pausable)</span>' +
      '<span class="mchip">Pass mark <b>'+E.meta.passMark+'%</b></span>' +
      '<span class="mchip">Tier <b>'+E.meta.batch+' of 4</b></span>' +
      '<span class="mchip">Object type: <b>Sub-Technique</b></span>' +
      '<span class="mchip">ID: <b>T1566.001</b> &middot; Tactic: <b>Initial Access (TA0001)</b></span>' +
    '</div>' +
    '<div class="blk blk-scenario"><div class="blk-label">&#9432; About this ATT&amp;CK object</div>' + E.introExpl + '</div>' +
    '<div class="blk blk-answer"><div class="blk-label">&#127991; Keywords covered in this topic (all four tiers)</div>' + E.introThemes + '<p class="small muted" style="margin-bottom:0">The four tier files of this topic share these themes. Each tier exercises them at its own depth.</p></div>' +
    '<div class="blk blk-question"><div class="blk-label">&#9881; How this exam works</div>' + E.introRules + '</div>' +
    '<div class="row2"><button class="btn primary" id="start-btn" style="min-width:220px">&#9654; Start the exam</button></div>';
  $("#start-btn",c).addEventListener("click", startExam);
  app.appendChild(c);
  updHeader();
}

/* ---------- exam flow ---------- */
function startExam(){
  S.order = shuffle(EXS.map(function(e,i){ return i; }));
  S.pos=0; S.phase="exam"; S.ans={}; S.skipped=[]; S.reported=false;
  S.timerLeft = E.timerSec; S.paused=false; S.hintUsed={};
  for(var k in RT){ if(Object.prototype.hasOwnProperty.call(RT,k)) delete RT[k]; }
  examView();
}
function examView(){
  S.phase="exam";
  app.innerHTML="";
  app.appendChild(buildHeader());
  var main=el("div"); main.id="exam-main"; app.appendChild(main);
  renderCurrent();
  startTimer();
}
function renderCurrent(){
  var ex=EXS[S.order[S.pos]];
  var m=$("#exam-main"); m.innerHTML="";
  var prog=Math.round((S.pos)/EXS.length*100);
  m.appendChild(el("div","pbar",'<i style="width:'+prog+'%"></i>'));
  var wrap=el("div","card");
  wrap.appendChild(el("div",null,'<div class="meta-chips" style="margin-top:0"><span class="mchip">Exercise <b>'+(S.pos+1)+' of '+EXS.length+'</b></span><span class="mchip">Theme: <b>'+esc(E.themes[ex.theme].name)+'</b></span><span class="mchip">'+esc(ex.points)+' points</span></div>'));
  wrap.appendChild(el("h3",null,'<span class="muted small">'+esc(ex.typeLabel)+' &nbsp;&middot;&nbsp; </span>'+esc(ex.title)));

  var sc=el("div","blk blk-scenario");
  sc.innerHTML='<div class="blk-label">&#128220; SCENARIO <button type="button" class="collapse-btn" id="sc-toggle">Collapse</button></div>' +
               '<div class="sc-summary" id="sc-summary">'+esc(ex.scenarioSummary)+'</div>' +
               '<div class="sc-body" id="sc-body">'+ex.scenario+'</div>';
  wrap.appendChild(sc);
  var long = ex.scenario.length>700;
  if(long){
    var tog=$("#sc-toggle",sc), shown=true;
    tog.addEventListener("click",function(){
      shown=!shown;
      tog.textContent= shown? "Collapse":"Expand";
      $("#sc-body",sc).style.display = shown? "":"none";
      $("#sc-summary",sc).style.display = shown? "none":"";
    });
  } else { $("#sc-toggle",sc).style.display="none"; }

  wrap.appendChild(el("div","blk blk-question",'<div class="blk-label">&#10067; QUESTION</div><div class="q-text">'+esc(ex.question)+'</div>'));

  var an=el("div","blk blk-answer");
  an.innerHTML='<div class="blk-label">&#9997; YOUR ANSWER</div><div id="hint-slot" style="display:none"></div><div id="widget"></div><div id="ctl" class="row2"></div><div id="fb"></div>';
  wrap.appendChild(an);
  m.appendChild(wrap);

  hlPass(m);
  var widget = buildWidget(ex);
  $("#widget",an).appendChild(widget.el);
  var a=S.ans[ex.id];
  var isSkipped = a && (a.status==="skipped"||a.status==="skipped-never");
  var sub=el("button","btn primary", isSkipped? "&#9998; Answer this exercise" : "&#10004; Submit answer"); sub.id="sub-btn";
  if(isSkipped){
    $("#fb",an).innerHTML='<div class="fb partial"><h4>&#9888; SKIPPED &mdash; NOT ANSWERED</h4><p class="why">You skipped this exercise. It will not be scored unless you answer it now.</p></div>';
    sub.addEventListener("click", function(){ delete S.ans[ex.id]; delete RT[ex.id]; var i=S.skipped.indexOf(ex.id); if(i>=0) S.skipped.splice(i,1); renderCurrent(); });
  } else {
    sub.addEventListener("click", function(){ submitAnswer(ex, widget); });
    if(a && (a.status==="correct"||a.status==="partial"||a.status==="incorrect")){
      sub.disabled=true; widget.lock(a); showFeedback(ex,a);
    }
  }
  $("#ctl",an).appendChild(sub);
  updHeader();
  window.scrollTo(0,0);
}
function submitAnswer(ex, widget){
  var res = widget.grade();
  if(res && res.pending){
    var f0=$("#fb");
    if(f0) f0.innerHTML='<div class="fb partial"><h4>&#9888; NOT FINISHED</h4><p class="why">'+(res.pendingMsg||"Answer the exercise first, then press Submit.")+'</p></div>';
    return;
  }
  if(!res) return;
  var cost = Math.max(1, Math.round((ex.points||10)*0.1));   /* hint = minus 10% of this exercise */
  var hint = S.hintUsed[ex.id]? cost:0;
  var earned;
  if(res.ok) earned = Math.max(0,(ex.points||10)-hint);
  else if(res.ratio>0) earned = Math.max(0, Math.round((ex.points||10)*res.ratio)-hint);
  else earned = 0;
  var status = res.ok? "correct" : (res.ratio>0 && res.ratio<1? "partial":"incorrect");
  var a = S.ans[ex.id] = {status:status, earned:earned, your:res.your||"", correct:res.correct||"", res:res};
  var sub=$("#sub-btn"); if(sub) sub.disabled=true;
  widget.lock && widget.lock(a);
  showFeedback(ex,a);
  updHeader();
}
function showFeedback(ex, a){
  var fb=$("#fb"); if(!fb) return;
  var heads={
    correct:'<h4><span aria-hidden="true">&#10004;</span> <span class="fb-title">CORRECT</span></h4>',
    incorrect:'<h4><span aria-hidden="true">&#10008;</span> <span class="fb-title">INCORRECT</span></h4>',
    partial:'<h4><span aria-hidden="true">&#9680;</span> <span class="fb-title">PARTIAL &mdash; '+Math.round((a.res.ratio||0)*(ex.points||10))+' of '+(ex.points||10)+' points</span></h4>'
  };
  var h='<div class="fb '+a.status+'" role="status">'+heads[a.status];
  if(a.correct) h+='<p class="why"><b>Correct answer:</b> '+a.correct+'</p>';
  if(a.your) h+='<p class="why"><b>Your answer:</b> '+a.your+'</p>';
  h+='<p class="why">'+ex.explain+'</p>';
  if(a.status!=="correct" && ex.study) h+='<div class="study"><b>What to study:</b> '+ex.study+'</div>';
  if(ex.persp) h+='<div class="persp"><b>Attacker view:</b> '+ex.persp.atk+'<br><b>Defender view:</b> '+ex.persp.def+'</div>';
  h+='<p class="small muted" style="margin:8px 0 0">Points for this exercise: <b>'+a.earned+' / '+(ex.points||10)+'</b>'+(S.hintUsed[ex.id]?" (includes &minus;10% hint cost)":"")+'</p></div>';
  fb.innerHTML=h;
  var nx = (S.pos < EXS.length-1)? 'Next exercise':'Continue';
  var b=el("button","btn primary", nx+" &#9193;");
  b.addEventListener("click", nextEx);
  fb.appendChild(b);
}
function nextEx(){
  if(S.pos < EXS.length-1){ S.pos++; renderCurrent(); }
  else if(S.skipped.length){ openReview(); }
  else { showResults(false); }
}
function skipCurrent(){
  if(S.phase!=="exam") return;
  var ex=EXS[S.order[S.pos]];
  var a=S.ans[ex.id];
  if(a && a.status!=="skipped" && a.status!=="skipped-never") return; // already answered: Skip disabled
  S.ans[ex.id]={status:"skipped", earned:0};
  if(S.skipped.indexOf(ex.id)<0) S.skipped.push(ex.id);
  nextEx();
}

/* ---------- review skipped ---------- */
function openReview(){

    m.appendChild(el("p",null,'<i class="muted">Nothing skipped &mdash; well done.</i>'));
  }

    var card=el("div","rev-card");

    var b=el("button","btn","&#9998; Answer this");

  });

  var back=el("button","btn","&#8592; Back");

  m.appendChild(back);

}
function examViewAt(){ examView(); }


/* ---------- results ---------- */
function showResults(timeUpFlag){
  stopTimer(); S.phase="results";
  var answered=answeredIds(), earned=earnedPts(), maxp=maxPts();
  var percent = maxp>0? Math.round(earned/maxp*100):0;
  var passed = percent>=E.meta.passMark && maxp>0;
  var nCorrect=0,nWrong=0,nPart=0;
  answered.forEach(function(ex){ var st=S.ans[ex.id].status; if(st==="correct")nCorrect++; else if(st==="partial")nPart++; else nWrong++; });
  var nSkipNever=EXS.filter(function(ex){ var a=S.ans[ex.id]; return !a || a.status==="skipped-never" || a.status==="skipped"; }).length;

  app.innerHTML="";
  app.appendChild(buildHeader());
  var c=el("div","card");
  c.innerHTML='<h2 class="bigtitle" style="font-size:24px">'+(timeUpFlag?'&#9200; Time is up &mdash; final results':'&#127937; Final results')+'</h2>' +
    '<div class="res-grid">' +
      '<div class="res-box"><div class="n">'+percent+'%</div><div class="t">Final score (answered only)</div></div>' +
      '<div class="res-box"><div class="n">'+earned+'/'+maxp+'</div><div class="t">Points</div></div>' +
      '<div class="res-box"><div class="n" style="color:var(--green)">'+nCorrect+'</div><div class="t">Correct</div></div>' +
      '<div class="res-box"><div class="n" style="color:var(--amber)">'+nPart+'</div><div class="t">Partial</div></div>' +
      '<div class="res-box"><div class="n" style="color:var(--red)">'+nWrong+'</div><div class="t">Incorrect</div></div>' +
      '<div class="res-box"><div class="n">'+nSkipNever+'</div><div class="t">Skipped &mdash; excluded</div></div>' +
    '</div>';
  if(passed){
    c.appendChild(el("div","cert",
      '<h2>&#127942; PASS &mdash; Certificate of completion</h2>' +
      '<div class="name">'+esc(S.userName||"Candidate")+'</div>' +
      '<div class="sub">'+esc(E.meta.title)+'</div>' +
      '<div class="sub">Score '+percent+'% &middot; pass mark '+E.meta.passMark+'% &middot; MITRE ATT&amp;CK '+esc(E.meta.topicId.toUpperCase())+'</div>'));
  } else {
    c.appendChild(el("div","failbox",
      '<h2 style="margin:0 0 6px;color:#ff9aa6">&#10008; FAIL</h2>' +
      '<p style="margin:0">You scored '+percent+'%. You need '+E.meta.passMark+'% to pass. You must retake this exam.</p>'));
    var rb=el("button","btn primary","&#8635; Retake exam");
    rb.style.marginTop="10px";
    rb.addEventListener("click", function(){ startExam(); });
    c.appendChild(rb);
  }
  // theme progress
  var tp=el("div","blk blk-answer",'<div class="blk-label">&#128202; Per-theme progress</div>');
  E.themes.forEach(function(t,i){
    var tot=0,cor=0;
    EXS.forEach(function(ex){ if(ex.theme!==i) return; tot++; var a=S.ans[ex.id]; if(a&&a.status==="correct") cor++; });
    tp.appendChild(el("div","small",'<div style="display:flex;justify-content:space-between;gap:10px"><span>'+esc(t.name)+'</span><span class="muted">'+cor+'/'+tot+' correct</span></div>'));
  });
  c.appendChild(tp);
  // detailed report
  c.appendChild(el("h3",null,'&#128220; Detailed report'));
  S.order.forEach(function(idx){
    var ex=EXS[idx], a=S.ans[ex.id];
    var stLabel, stCls;
    if(a && a.status==="correct"){ stLabel="&#10004; CORRECT"; stCls="good"; }
    else if(a && a.status==="partial"){ stLabel="&#9680; PARTIAL"; stCls="part"; }
    else if(a && a.status==="incorrect"){ stLabel="&#10008; INCORRECT"; stCls="bad"; }
    else { stLabel="&#9888; NOT ANSWERED &mdash; EXCLUDED FROM SCORE"; stCls="skip"; }
    var item=el("div","rep-item");
    var h='<div class="rh"><span>'+(S.order.indexOf(idx)+1)+'.</span><span>'+esc(ex.title)+'</span><span class="st '+stCls+'">'+stLabel+'</span></div>';
    if(a && (a.status==="correct"||a.status==="partial"||a.status==="incorrect")){
      if(a.your) h+='<p class="ra"><b>Your answer:</b> '+a.your+'</p>';
      if(a.correct) h+='<p class="ra"><b>Correct answer:</b> '+a.correct+'</p>';
      h+='<p class="ra">'+ex.explain+'</p>';
      if(a.status!=="correct" && ex.study) h+='<p class="ra"><b>What to study:</b> '+ex.study+'</p>';
    } else {
      h+='<p class="ra"><i class="muted">You skipped this exercise and never answered it. It does not count in your score.</i></p>';
    }
    item.innerHTML=h;
    c.appendChild(item);
  });
  var rb2=el("button","btn","&#8635; Retake exam (questions and options are reshuffled)");
  rb2.addEventListener("click", function(){ startExam(); });
  rb2.style.marginTop="8px";
  c.appendChild(rb2);
  app.appendChild(c);
  updHeader();
  reportScore(earned, maxp);
}
function reportScore(correct,total){
  if(S.reported) return; S.reported=true;
  var percent = total>0? Math.round((correct/total)*100):0;
  try{
    parent.postMessage({ type:"CYBERPULSE_SCORE", topicId:E.meta.topicId, batch:E.meta.batch, score:correct, total:total, percent:percent, passed: percent>=E.meta.passMark }, location.origin);
  }catch(e){ /* opened directly, nothing to report to */ }
}

/* ---------- widget: QCM ---------- */
function wQCM(ex, rt){
  var st={sel:-1, items:shuffle(ex.data.options.map(function(t,i){ return {t:t,i:i}; }))};
  var box=el("div","opts");
