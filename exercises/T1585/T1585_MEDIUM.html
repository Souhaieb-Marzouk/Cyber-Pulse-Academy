<style>

*{box-sizing:border-box}

/* ---------- chips & badges ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:.8rem;white-space:nowrap}

.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--card2);border:1px solid var(--line);font-size:.78rem;color:var(--muted)}

.pairList{margin-top:10px;display:flex;flex-direction:column;gap:6px}

.ordList{display:flex;flex-direction:column;gap:8px}

.termWrap{border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#070d1a}
.termHead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card2);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.termHead .dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
.termHead .dot.y{background:var(--warn)} .termHead .dot.g{background:var(--ok)}

.synPanel{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}
.synPanel h4{margin:0 0 6px;font-size:.85rem;color:var(--cyan)}
.synPanel ul{margin:0;padding-left:1.2em;font-size:.88rem;color:var(--muted)}
.synPanel code{background:#0a1120;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:#9ae6b4}
.redTimer{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-weight:700;color:var(--sev-extreme);border:1px solid var(--sev-extreme);background:rgba(239,68,68,.1);padding:4px 10px;border-radius:8px;font-size:.85rem}

/* ---------- log viewer ---------- */
.lvFilter{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}

.lvTableWrap{border:1px solid var(--line2);border-radius:10px;overflow:auto;max-height:320px;background:#0a1120}

.revList{display:flex;flex-direction:column;gap:10px}

.resHero{border-radius:14px;padding:26px 24px;border:1px solid var(--line);text-align:center;margin-bottom:16px}

.pct{font-size:2.6rem;font-weight:800;font-family:var(--mono)}

.resCell{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}

.repRow .hd .t{font-weight:700;font-size:.93rem}
.repRow .bd{margin-top:8px;font-size:.9rem;color:#d7e1f3;border-top:1px dashed var(--line);padding-top:8px}
.repRow .bd .lbl{color:var(--cyan);font-weight:700}
.repRow.exc{opacity:.75}
.verdict{font-weight:800;font-size:.8rem;padding:2px 9px;border-radius:999px;white-space:nowrap}
.v-ok{color:var(--ok);border:1px solid var(--ok)} .v-bad{color:var(--bad);border:1px solid var(--bad)}
.v-mid{color:var(--warn);border:1px solid var(--warn)} .v-exc{color:var(--faint);border:1px solid var(--faint)}

.themeStrip{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tChip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);font-size:.85rem;color:var(--muted);min-height:36px}

.tChip.t-miss{color:var(--bad);border-color:var(--bad);background:rgba(239,68,68,.07)}

.pauseOverlay{position:fixed;inset:0;z-index:200;background:rgba(7,11,20,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
.pauseOverlay h2{margin:0}
.pauseOverlay p{color:var(--muted);max-width:460px}
.hidden{display:none !important}

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;scroll-behavior:auto !important}
}
/* responsive */
@media(max-width:640px){
  .wrap{padding:10px 10px 50px}
  .exCard{padding:14px}
  .exambar .row{gap:7px}
  .chip{font-size:.72rem}
  .btn{padding:9px 14px}
}

  object: { id: 'T1585', name: 'Establish Accounts' },
  intro: {
    objectHtml: '<p><b>Quick refresher.</b> T1585 — Establish Accounts is a <b>Technique</b> in the MITRE ATT&amp;CK tactic <b>Resource Development</b>. It means: the adversary <b>creates and cultivates accounts</b> on online services so they can be used during targeting. The accounts build a <b>persona</b> — a fake identity with public information, presence, history and affiliations. A persona can be fully invented, or it can impersonate a real person.</p>' +
      '<p>The persona may live on one site or across many sites — ATT&amp;CK names Facebook, LinkedIn, Twitter, Google, GitHub and Docker Hub as examples. Cultivation takes time: filling profile information, growing a social network, adding photos. Email accounts may be created to send Phishing for Information or Phishing, and to register for other services. Cloud accounts may be created to host files or to acquire servers — and ATT&amp;CK notes that creating cloud accounts often requires creating email accounts first.</p>' +
      '<p>The three sub-techniques are <b>T1585.001 Social Media Accounts</b>, <b>T1585.002 Email Accounts</b> and <b>T1585.003 Cloud Accounts</b>. The platform is <b>PRE</b>: all of this happens before the intrusion. This tier goes one step further than EASY: every exercise joins <b>two ideas</b> — for example \u201Cwhich sub-technique is this, and which next stage does it feed?\u201D</p>',
    workHtml: '<p>At MEDIUM level you practise the two-step reasoning that real work demands:</p>' +
      '<ul>' +
      '<li><b>CTI analysts</b> read a report and map the behaviour to T1585 plus its sub-technique, then say what the adversary is preparing next.</li>' +
      '<li><b>SOC analysts</b> connect an employee report (\u201Csomeone claiming to be from HR added me\u201D) to detection strategy DET0851: monitor social media activity about the organisation, especially recently created accounts sending many connection requests.</li>' +
      '<li><b>Detection engineers</b> accept that M1056 Pre-compromise cannot block this behaviour with preventive controls, so they build detections for the <i>next</i> lifecycle stages (Initial Access, C2, exfiltration).</li>' +
      '<li><b>Cloud administrators</b> link tenant sign-ups to T1585.003 and check what those accounts were registered for.</li>' +
      '</ul>' +
      '<p><b>The risk addressed:</b> a persona that was built weeks ago makes the first malicious message look like a message from a normal colleague or recruiter. Two ideas joined together — the account and its later use — are exactly what you must keep in mind on the job.</p>',
    rulesHtml: '<ul>' +
      '<li><b>Pass mark: 70%.</b> Score is computed only over exercises you actually answered.</li>' +
      '<li><b>Exercise types:</b> multiple choice, multi-select, matching, drag-and-drop into tactic columns, timeline ordering, fill the gaps, scenario steps, and one simulated terminal.</li>' +
      '<li><b>Timer:</b> 30 minutes. Pause hides the exercise. Timer expiry submits the exam automatically.</li>' +
      '<li><b>Hints:</b> \u221210% of that exercise, nudge only — the hint narrows the direction, it does not name the answer.</li>' +
      '<li><b>Skip:</b> free to use. Before submitting you get a review screen; exercises still unanswered there are excluded from score and total.</li>' +
      '<li><b>Retake:</b> reshuffles exercises and options.</li>' +
      '</ul>',
    severityNote: 'two connected ideas per exercise. The goal is stated, but the path is not — you decide what to look at first.'
  },

    out = out.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g, '<span class="s">$1</span>');
    out = out.replace(/\b(\d{4}-\d{2}-\d{2}[T ][\d:.]+Z?|\d{2}:\d{2}:\d{2})\b/g, '<span class="n">$1</span>');
    out = out.replace(/(^|\s)((?:[a-z_]+(?:\[\.\])?):)/gi, '$1<span class="k">$2</span>');
    return out;
  }
  function logBlock(text, cls) {
    var pre = el('pre', 'log' + (cls ? ' ' + cls : ''));
    var lines = String(text).split('\n');
    pre.innerHTML = lines.map(hl).join('\n');

  /* ---------- EXAM SHELL ---------- */
  function startExam() {
    S.order = shuffle(EX.exercises.map(function (_, i) { return i; }));
    S.idx = 0; S.pool = []; S.res = {}; S.hintUsed = {};
    S.answeredCount = 0; S.reported = false;
    S.timer.remain = EX.meta.estimatedMinutes * 60;
    S.timer.paused = false;
    S.screen = 'exam';
    buildShell();
    startTimer();
    renderExerciseAt(S.order[S.idx]);
  }

  function buildShell() {
    clearRoot();
    var root = screenRoot();
    var bar = el('div', 'exambar');
    var inner = el('div', 'wrap');
    inner.style.paddingBottom = '10px';
    var row = el('div', 'row');
    row.appendChild(el('span', 'counter', 'Exercise <b id="exNum">1</b> of <b>' + EX.exercises.length + '</b>'));
    var badge = el('span', 'badge ' + sev.cls, '<span class="dot"></span>' + esc(sev.label));
    row.appendChild(badge);
    row.appendChild(el('span', 'grow'));
    var tBtn = el('button', 'btn btn-sm btn-ghost', '\u23F8 <span aria-hidden="true">Pause</span>');
    tBtn.id = 'pauseBtn'; tBtn.setAttribute('aria-label', 'Pause timer (hides exercise content)');
    tBtn.addEventListener('click', togglePause);
    var timer = el('span', 'timer', '\u23F1 <span id="timerTxt">' + fmtTime(S.timer.remain) + '</span>');
    timer.id = 'timerChip'; timer.setAttribute('role', 'timer'); timer.setAttribute('aria-label', 'Time remaining');
    var score = el('span', 'scorechip', '\u25CF Score: <span id="scoreTxt">\u2014</span>');
    score.id = 'scoreChip'; score.setAttribute('aria-label', 'Live score');
    var hint = el('button', 'btn btn-sm', '\u25CF Hint \u221210%');
    hint.id = 'hintBtn'; hint.setAttribute('aria-label', 'Show hint (costs 10 percent of this exercise)');
    hint.addEventListener('click', useHint);
    var skip = el('button', 'btn btn-sm btn-ghost', '\u21B7 Skip');
    skip.id = 'skipBtn'; skip.setAttribute('aria-label', 'Skip exercise and return to it later');
    skip.addEventListener('click', skipCurrent);
    row.appendChild(timer); row.appendChild(tBtn); row.appendChild(score); row.appendChild(hint); row.appendChild(skip);
    inner.appendChild(row);
    var prog = el('div', 'progress', '<div id="progFill"></div>');
    prog.setAttribute('aria-hidden', 'true');
    inner.appendChild(prog);
    bar.appendChild(inner);
    root.appendChild(bar);
    var main = el('div', 'wrap');
    main.id = 'examMain';
    root.appendChild(main);
    updateChrome();
  }

  function updateChrome() {
    var nEl = $('#exNum'), fEl = $('#progFill'), sEl = $('#scoreTxt');
    if (nEl) nEl.textContent = String(Math.min(S.idx + 1, EX.exercises.length));
    if (fEl) fEl.style.width = Math.round(100 * S.answeredCount / EX.exercises.length) + '%';
    if (sEl) {
      var agg = aggScore();
      sEl.textContent = agg.answered ? (agg.pct + '%') : '\u2014';
    }
    var inExam = S.screen === 'exam' && S.idx < S.order.length && !!S.cur;
    var h = $('#hintBtn'), k = $('#skipBtn');
    if (h) h.disabled = !inExam || !!S.hintUsed[curIdx()] || (S.res[curIdx()] && S.res[curIdx()].answered);
    if (k) k.disabled = !inExam || !!(S.res[curIdx()] && S.res[curIdx()].answered);
  }

  function aggScore() {
    var earned = 0, max = 0, answered = 0;
    Object.keys(S.res).forEach(function (k) {
      var r = S.res[k];
      if (r.answered) { earned += r.earned; max += r.max; answered++; }
    });
    return { earned: earned, max: max, answered: answered, pct: max ? Math.round(100 * earned / max) : 0 };
  }

  /* ---------- timer ---------- */
  function startTimer() {
    stopTimer();
    S.timer.int = setInterval(tick, 1000);
  }
  function stopTimer() { if (S.timer.int) { clearInterval(S.timer.int); S.timer.int = null; } }
  function tick() {
    if (S.timer.paused) return;
    S.timer.remain--;
    var tEl = $('#timerTxt'), chip = $('#timerChip');
    if (tEl) tEl.textContent = fmtTime(S.timer.remain);
    if (chip) chip.className = 'timer' + (S.timer.remain <= 120 ? ' low' : '');
    if (S.timer.remain <= 0) {
      stopTimer();
      toast('\u23F1 Time is over — the exam is submitted automatically.');
      finishExam(true);
    }
  }
  function togglePause() {
    if (S.screen !== 'exam' && S.screen !== 'review') return;
    S.timer.paused = !S.timer.paused;
    var btn = $('#pauseBtn');
    var ov = $('#pauseOverlay');
    if (S.timer.paused) {
      if (btn) btn.innerHTML = '\u25B6 <span aria-hidden="true">Resume</span>';
      ov = el('div', 'pauseOverlay');
      ov.id = 'pauseOverlay';
      ov.setAttribute('role', 'alertdialog');
      ov.setAttribute('aria-label', 'Exam paused');
      ov.appendChild(el('h2', null, '\u23F8 Exam paused'));
      ov.appendChild(el('p', null, 'The timer is stopped and the exercise is hidden so you cannot look at it while on break. Your progress is kept.'));
      var r = el('button', 'btn btn-primary', '\u25B6 Resume exam');
      r.addEventListener('click', togglePause);
      ov.appendChild(r);
      document.body.appendChild(ov);
      var m = $('#examMain'); if (m) m.classList.add('hidden');
      if (S.redTimer.int) { clearInterval(S.redTimer.int); S.redTimer.int = null; }
    } else {
      if (btn) btn.innerHTML = '\u23F8 <span aria-hidden="true">Pause</span>';
      if (ov) ov.remove();
      var m2 = $('#examMain'); if (m2) m2.classList.remove('hidden');
    }
  }

  /* ---------- hint / skip ---------- */
  function curIdx() { return S.order[S.idx]; }
  function useHint() {
    if (S.screen !== 'exam' || S.idx >= S.order.length) return;
    var i = curIdx();
    if (S.hintUsed[i] || (S.res[i] && S.res[i].answered)) return;
    var ex = EX.exercises[i];
    S.hintUsed[i] = true;
    updateChrome();
    toast('\u25CF Hint used — this exercise is now worth 10% less.');
    var fb = $('#fbArea');
    if (fb) {
      var n = el('div', 'notice blue');
      n.innerHTML = '<b>Hint (\u221210% on this exercise):</b> ' + esc(ex.hint || 'Read the artefacts once more — the wording of the question tells you what to weigh.');
      fb.insertBefore(n, fb.firstChild);
    }
  }
  function skipCurrent() {
    if (S.screen !== 'exam' || S.idx >= S.order.length) return;
    var i = curIdx();
    if (S.res[i] && S.res[i].answered) return;
    if (S.pool.indexOf(i) === -1) S.pool.push(i);
    S.res[i] = { answered: false, skipped: true, earned: 0, max: exMax(i), verdict: 'skipped' };
    toast('\u21B7 Skipped — you can return to it before you submit.', false);
    advance();
  }
  function exMax(i) {
    var ex = EX.exercises[i];
    var m = ex.points || 10;
    if (S.hintUsed[i]) m = Math.max(1, Math.round(m * 0.9));
    return m;
  }

  /* ---------- navigation ---------- */
  function advance() {
    S.idx++;
    if (S.idx >= S.order.length) {
      if (S.pool.length) renderReview();
      else finishExam(false);
    } else {
      renderExerciseAt(S.order[S.idx]);
    }
  }
  function gotoExercise(i) {
    var p = S.pool.indexOf(i);
    if (p !== -1) S.pool.splice(p, 1);
    var pos = S.order.indexOf(i);
    if (pos !== -1 && pos < S.order.length - S.pool.length) {
      /* exercise already passed; run it out-of-band: swap into current slot */
      S.order.splice(S.order.indexOf(i), 1);
      S.order.splice(S.idx, 0, i);
    }
    delete S.res[i];
    renderExerciseAt(i);
  }

  /* ---------- exercise rendering ---------- */
  function renderExerciseAt(i) {
    S.cur = EX.exercises[i];
    S.curWidget = null;
    var main = $('#examMain');
    main.innerHTML = '';
    var card = el('div', 'exCard');
    card.id = 'exCard';

    var top = el('div', 'row');
    top.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px';
    top.appendChild(el('span', 'tag', esc(S.cur.typeLabel || 'Exercise')));
    top.appendChild(el('span', 'tag', (S.cur.points || 10) + ' points'));
    if (S.hintUsed[i]) top.appendChild(el('span', 'tag', '\u25CF hint used (\u221210%)'));
    card.appendChild(top);

    if (S.cur.type === 'steps') {
      S.stepState = { n: S.cur.steps.length, step: 0, fracs: [], your: [], corr: [] };
      renderStepStrip(card);
      renderStep(card, 0);
    } else {
      if (S.cur.scenario) card.appendChild(buildScenario(S.cur.scenario));
      var q = el('div', 'block question');
      q.appendChild(blockHead('b-question', '\u2756', 'Question'));
      q.appendChild(el('div', 'qText', esc(S.cur.question)));
      card.appendChild(q);
      var a = el('div', 'block answer');
      a.appendChild(blockHead('b-answer', '\u270E', 'Your answer'));
      var holder = el('div');
      a.appendChild(holder);
      S.curWidget = buildWidget(S.cur.widget, holder);
      card.appendChild(a);
    }

    var fb = el('div', null);
    fb.id = 'fbArea';
    card.appendChild(fb);

    var act = el('div', 'actions');
    act.id = 'actRow';
    var submit = el('button', 'btn btn-primary', '\u2713 Submit answer');
    submit.id = 'submitBtn';
    submitHook = submitAnswer;
    submit.addEventListener('click', submitAnswer);
    act.appendChild(submit);
    var next = el('button', 'btn btn-ok hidden', 'Next exercise \u2192');
    next.id = 'nextBtn';
    next.addEventListener('click', advance);
    act.appendChild(next);

    main.appendChild(card);
    updateChrome();
    window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });

  function blockHead(cls, ic, label) {
    return el('div', 'blockHead ' + cls, '<span class="ic" aria-hidden="true">' + ic + '</span>' + label);
  }

  function renderStepStrip(card) {
    var strip = el('div', 'stepStrip');
    strip.id = 'stepStrip';
    for (var s = 0; s < S.stepState.n; s++) {
      var cls = 'st';
      if (s < S.stepState.fracs.length) cls += S.stepState.fracs[s] >= 1 ? ' done-ok' : (S.stepState.fracs[s] > 0 ? ' done-ok' : ' done-bad');
      strip.appendChild(el('span', cls, 'STEP ' + (s + 1) + ' OF ' + S.stepState.n + (s < S.stepState.fracs.length ? (S.stepState.fracs[s] >= 1 ? ' \u2713' : ' \u2717') : '')));
    }
    card.appendChild(strip);
  }
  function refreshStrip() {
    var old = $('#stepStrip');
    if (old) { old.remove(); renderStepStrip($('#exCard')); }
  }

  function renderStep(card, n) {
    var old = $('#stepBody');
    if (old) old.remove();
    var body = el('div');
    body.id = 'stepBody';
    var st = S.cur.steps[n];
    if (st.scenario) body.appendChild(buildScenario(st.scenario));
    var q = el('div', 'block question');
    q.appendChild(blockHead('b-question', '\u2756', 'Question'));
    q.appendChild(el('span', 'stepPill', 'STEP ' + (n + 1) + ' OF ' + S.stepState.n));
    q.appendChild(el('div', 'qText', esc(st.question)));
    body.appendChild(q);
    var a = el('div', 'block answer');
    a.appendChild(blockHead('b-answer', '\u270E', 'Your answer'));
    var holder = el('div');
    a.appendChild(holder);
    S.curWidget = buildWidget(st.widget, holder);
    body.appendChild(a);
    var act = el('div', 'actions');
    act.id = 'actRow';
    var sub = el('button', 'btn btn-primary', n + 1 < S.stepState.n ? '\u2713 Submit step ' + (n + 1) : '\u2713 Submit final step');
    sub.id = 'submitBtn';
    submitHook = submitStep;
    sub.addEventListener('click', submitStep);
    act.appendChild(sub);
    var nxt = el('button', 'btn btn-ok hidden', n + 1 < S.stepState.n ? 'Continue \u2192' : 'Finish exercise \u2192');
    nxt.id = 'nextBtn';
    nxt.addEventListener('click', function () {
      if (S.stepState.step + 1 < S.stepState.n) {
        S.stepState.step++;
        refreshStrip();
        renderStep($('#exCard'), S.stepState.step);
        updateChrome();
        window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
      } else {
        finishStepsExercise();
      }
    });
    act.appendChild(nxt);
    body.appendChild(act);
    var fb = el('div');
    fb.id = 'fbArea';
    body.appendChild(fb);
    card.appendChild(body);
  }

  function buildScenario(sc) {
    var wrap = el('div', 'block scenario');
    wrap.appendChild(blockHead('b-scenario', '\u270E', 'Scenario'));
    var btn = el('button', 'scToggle');
    btn.setAttribute('aria-expanded', 'true');
    btn.innerHTML = '<span>' + esc(sc.title || 'Scenario') + '</span><span class="sum">' + esc(sc.summary || '') + '</span><span class="caret" aria-hidden="true">\u25BE</span>';
    var body = el('div', 'scBody');
    btn.addEventListener('click', function () {
      var open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!open));
      body.classList.toggle('hidden', open);
    });
    (sc.parts || []).forEach(function (p) {
      var ap = el('div', 'artPanel');
      ap.appendChild(el('div', 'artLabel', esc(p.label || 'Artefact')));
      if (p.kind === 'log' || p.kind === 'code') ap.appendChild(logBlock(p.text));
      else ap.appendChild(el('div', 'prose', p.html ? p.html : '<p>' + esc(p.text) + '</p>'));
      body.appendChild(ap);
    });
    wrap.appendChild(btn);
    wrap.appendChild(body);
    if (sc.collapsed) { btn.setAttribute('aria-expanded', 'false'); body.classList.add('hidden'); }
    return wrap;
  }

  /* ---------- grading flow ---------- */
  function submitAnswer() {
    if (!S.curWidget) return;
    var g = S.curWidget.grade();
    finalizeExercise(g);
  }
  function submitStep() {
    if (!S.curWidget) return;
    var g = S.curWidget.grade();
    var n = S.stepState.step;
    S.stepState.fracs[n] = g.frac;
    S.stepState.your[n] = g.yourAnswer;
    S.stepState.corr[n] = g.correctAnswer;
    refreshStrip();
    var st = S.cur.steps[n];
    showFeedback(g, st.explain, st.study, false);
    $('#submitBtn').disabled = true;
    var nb = $('#nextBtn');
    nb.classList.remove('hidden');
    nb.focus();
  }
  function finishStepsExercise() {
    var sum = 0;
    S.stepState.fracs.forEach(function (f) { sum += f; });
    var frac = sum / S.stepState.n;
    finalizeExercise({ frac: frac, yourAnswer: S.stepState.your.map(function (y, i2) { return 'Step ' + (i2 + 1) + ': ' + y; }).join('<br>'), correctAnswer: S.stepState.corr.map(function (c, i2) { return 'Step ' + (i2 + 1) + ': ' + c; }).join('<br>') });
  }
  function finalizeExercise(g) {
    var i = curIdx();
    var baseMax = S.cur.type === 'steps' ? (S.cur.points || 10) : (S.cur.points || 10);
    var max = exMax(i);
    var earned = Math.round(baseMax * (g.frac || 0) * (max / baseMax));
    var verdict = (g.frac >= 0.999) ? 'correct' : (g.frac > 0 ? 'partial' : 'incorrect');
    S.res[i] = { answered: true, earned: earned, max: max, verdict: verdict };
    S.answeredCount = Object.keys(S.res).filter(function (k) { return S.res[k].answered; }).length;
    var expl = S.cur.type === 'steps' ? S.cur.steps[S.stepState.step].explain : S.cur.explain;
    var stdy = S.cur.type === 'steps' ? S.cur.steps[S.stepState.step].study : S.cur.study;
    showFeedback(g, expl, stdy, true);
    var sb = $('#submitBtn'); if (sb) sb.disabled = true;
    var nb = $('#nextBtn');
    if (S.cur.type === 'steps' && nb) {
      var nn = nb.cloneNode(false);
      nn.id = 'nextBtn';
      nn.className = 'btn btn-ok';
      nn.textContent = 'Next exercise \u2192';
      nn.addEventListener('click', advance);
      nb.parentNode.replaceChild(nn, nb);
      nb = nn;
    }
    if (nb) { nb.classList.remove('hidden'); nb.focus(); }
    updateChrome();
  }

  function showFeedback(g, explain, study, isFinal) {
    var area = $('#fbArea');
    var old = area.querySelector('.fb'); if (old) old.remove();
    var cls = g.frac >= 0.999 ? 'ok' : (g.frac > 0 ? 'mid' : 'bad');
    var head = g.frac >= 0.999 ? '\u2713 CORRECT' : (g.frac > 0 ? '\u25D0 PARTIAL \u2014 not fully correct' : '\u2717 INCORRECT');
    var fb = el('div', 'fb ' + cls);
    fb.setAttribute('aria-live', 'polite');
    var agg = aggScore();
    var pts = '';
    if (isFinal) {
      var r = S.res[curIdx()];
      pts = r.earned + ' / ' + r.max + ' pts';
    }
    fb.appendChild(el('div', 'fbHead', '<span>' + head + '</span>' + (pts ? '<span class="ptsNote">' + esc(pts) + '</span>' : '')));
    if (g.detail) fb.appendChild(g.detail);
    if (g.yourAnswer) { fb.appendChild(el('h5', null, 'Your answer')); fb.appendChild(el('p', null, g.yourAnswer)); }
    if (g.correctAnswer) { fb.appendChild(el('h5', null, 'Correct answer')); fb.appendChild(el('p', null, g.correctAnswer)); }
    fb.appendChild(el('h5', null, 'Why'));
    fb.appendChild(el('p', null, explain || ''));
    if (g.canon) {
      var cw = el('div', 'canon');
      var pre = el('pre', 'log', esc(g.canon));
      cw.appendChild(pre);
      var cb = el('button', 'btn btn-sm copyBtn', 'Copy');
      cb.addEventListener('click', function () {
        try { navigator.clipboard.writeText(g.canon); toast('Copied.', true); } catch (e) { toast('Copy blocked by browser — select the text manually.'); }
      });
      cw.appendChild(cb);
      fb.appendChild(el('h5', null, 'Canonical command'));
      fb.appendChild(cw);
    }
    if (g.dangerNote) fb.appendChild(el('div', 'warnBox', '\u26A0 ' + g.dangerNote));
    if (study) { fb.appendChild(el('div', 'study', '<b>What to study next:</b> ' + esc(study))); }
    area.appendChild(fb);
  }

  /* ---------- widgets ---------- */
  var submitHook = null;
  function buildWidget(w, root) {
    if (w.kind === 'mcq') return mkMcq(w, root);
    if (w.kind === 'multi') return mkMulti(w, root);
    if (w.kind === 'order') return mkOrder(w, root);
    if (w.kind === 'wordbank') return mkWordbank(w, root);
    if (w.kind === 'match') return mkMatch(w, root);
    if (w.kind === 'categorize') return mkCategorize(w, root);
    if (w.kind === 'terminal') return mkTerminal(w, root);
    if (w.kind === 'logview') return mkLogview(w, root);
    return mkMcq({ options: ['(broken widget)'], correct: 0 }, root);
  }

  function mkMcq(w, root) {
    var opts = shuffle(w.options.map(function (t, i) { return { t: t, i: i }; }));
    var sel = -1;
    var box = el('div', 'opts');
    box.setAttribute('role', 'radiogroup');
    box.setAttribute('aria-label', 'Answer options');
    var letters = 'ABCDEF';
    opts.forEach(function (o, n) {

  function mkWordbank(w, root) {

      });
      slots.push(sb);

    }
    root.appendChild(textEl);
    var bankBtns = {};

    return {
      grade: function () {

        var frac = hits / w.slots.length;
        return {
          frac: frac,
          yourAnswer: filled.map(function (f, k) { return (k + 1) + ' \u2192 ' + esc(f < 0 ? '(empty)' : w.bank[f]); }).join(' | '),

        };

    };

  function mkMatch(w, root) {
    var selL = -1;

      b.addEventListener('click', function () {

        b.classList.add('sel');
      });
      lBox.appendChild(b);
    });
    shuffle(w.right.map(function (t, i) { return { t: t, i: i }; })).forEach(function (o) {

      b.addEventListener('click', function () {
        if (b.disabled || selL < 0) { if (selL < 0) toast('Pick an item on the left first, then its match here.'); return; }
        var lt = w.left[selL];
        var usedL = pairs.some(function (p) { return p.l === selL; });
        if (usedL) { toast('That item is already paired — it is listed below.'); return; }
        pairs.push({ l: selL, r: o.i });
        b.disabled = true; b.classList.add('dis');
        b.innerHTML = esc(o.t) + '<span class="used">\u2713 linked</span>';
        Array.prototype.forEach.call(lBox.querySelectorAll('.mItem'), function (c, n) { if (n === selL) { c.disabled = true; c.classList.add('dis'); } });
        selL = -1;

    var plist = el('div', 'pairList');

      plist.innerHTML = '';
      pairs.forEach(function (p) {
        var row = el('div', 'pairRow', '<span>' + esc(w.left[p.l]) + '</span><span aria-hidden="true">\u2194</span><span>' + esc(w.right[p.r]) + '</span>');
        var rm = el('button', 'btn btn-sm btn-ghost rm', '\u2715');
        rm.setAttribute('aria-label', 'Remove pair');
        rm.addEventListener('click', function () {
          pairs = pairs.filter(function (q) { return q !== p; });
          Array.prototype.forEach.call(lBox.querySelectorAll('.mItem'), function (c, n) { if (n === p.l) { c.disabled = false; c.classList.remove('dis'); } });
          Array.prototype.forEach.call(rBox.querySelectorAll('.mItem'), function (c) { if (Number(c.dataset.r) === p.r) { c.disabled = false; c.classList.remove('dis'); c.innerHTML = esc(w.right[p.r]); } });
          drawPairs();

      });

    root.appendChild(wrapEl);

    return {
      grade: function () {
        var hits = 0, fp = 0;
        pairs.forEach(function (p) {
          var ok = w.pairs.some(function (q) { return q[0] === p.l && q[1] === p.r; });
          if (ok) hits++; else fp++;
        });
        var frac = Math.max(0, (hits - fp)) / w.pairs.length;
        return {
          frac: frac,
          yourAnswer: pairs.length ? pairs.map(function (p) { return esc(w.left[p.l]) + ' \u2194 ' + esc(w.right[p.r]); }).join('<br>') : '(no pairs made)',
          correctAnswer: w.pairs.map(function (q) { return esc(w.left[q[0]]) + ' \u2194 ' + esc(w.right[q[1]]); }).join('<br>')

  function mkCategorize(w, root) {

    var zones = [];

        e.preventDefault(); z.classList.remove('over');

        }
      });
    });
    var selItem = null;
    /* shuffle keeps original indices — grading compares against w.items[originalIndex] */
    shuffle(w.items.map(function (t, i) { return { label: t.label, zone: t.zone, i: i }; })).forEach(function (o) {
      var b = el('button', 'mItem', esc(o.label));

      b.draggable = true;
      b.dataset.id = o.i;
      b.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', String(o.i)); });
      b.addEventListener('click', function () {
        if (selItem === b) { b.classList.remove('sel'); selItem = null; return; }
        if (selItem) selItem.classList.remove('sel');
        selItem = b; b.classList.add('sel');
      });
      bankEl.appendChild(b);
    });
    function place(item, zone) {
      item.classList.remove('sel'); selItem = null;
      zone.appendChild(item);
      item.classList.add('dis'); /* visual only — the chip stays interactive (tap to move, dblclick to remove) */
    }
    root.appendChild(bankEl);
    root.appendChild(zwrap);
    root.appendChild(el('p', 'bankNote', 'Every item belongs to exactly one zone. Drag items, or tap an item then tap its zone. To move an item again, tap it and then tap another zone — or double-click it to send it back to the bank.'));
    /* allow removal from zones for self-correction; chips stay enabled so the events fire */
    zones.forEach(function (z) {
      z.setAttribute('tabindex', '0');
      z.setAttribute('role', 'button');
      z.setAttribute('aria-label', 'Drop zone: ' + z.querySelector('.zName').textContent + ' — place the selected item here');
      z.addEventListener('dblclick', function (e) {
        var chip = e.target.closest('.mItem');
        if (chip) {
          chip.classList.remove('dis');
          bankEl.appendChild(chip);
        }
      });
    });
    return {
      grade: function () {
        var hits = 0;
        var placed = [];
        zones.forEach(function (z) {
          Array.prototype.forEach.call(z.querySelectorAll('.mItem'), function (chip) {
            var n = Number(chip.dataset.id);
            placed.push({ label: w.items[n].label, zone: w.zones[Number(z.dataset.z)] });
            if (w.items[n].zone === Number(z.dataset.z)) hits++;
          });
        });
        var frac = hits / w.items.length;
        return {
          frac: frac,
          yourAnswer: placed.length ? placed.map(function (p) { return esc(p.label) + ' \u2192 ' + esc(p.zone); }).join('<br>') : '(nothing placed)',
          correctAnswer: w.items.map(function (it) { return esc(it.label) + ' \u2192 ' + esc(w.zones[it.zone]); }).join('<br>')
        };
      }
    };
  }

  function mkTerminal(w, root) {
    var wrap = el('div', 'termWrap');
    var head = el('div', 'termHead', '<span class="dot" aria-hidden="true"></span><span class="dot y" aria-hidden="true"></span><span class="dot g" aria-hidden="true"></span><span>&nbsp;safe simulated shell \u2014 nothing real runs here</span>');
    wrap.appendChild(head);
    var scroll = el('div', 'termScroll');
    scroll.id = 'termScroll';
    scroll.setAttribute('role', 'log');
    scroll.setAttribute('aria-label', 'Terminal output');
    wrap.appendChild(scroll);
    var inRow = el('div', 'termInputRow');
    inRow.appendChild(el('span', 'pr', esc(w.prompt || 'analyst@lab:~$')));
    var input = document.createElement('input');
    input.type = 'text';
    input.id = 'termInput';
    input.setAttribute('aria-label', 'Type your command here');
    input.autocomplete = 'off';
    input.spellcheck = false;
    inRow.appendChild(input);
    wrap.appendChild(inRow);
    root.appendChild(wrap);

    var sub = el('button', 'btn btn-ok', '\u2713 Grade my last command');
    sub.id = 'termGrade';
    sub.style.marginTop = '10px';
    sub.addEventListener('click', function () { if (submitHook) submitHook(); });
    root.appendChild(sub);

    if (w.syntax) {
      var sp = el('div', 'synPanel');
      sp.appendChild(el('h4', null, esc(w.syntax.title || 'Syntax reminder')));
      var ul = el('ul');
      (w.syntax.notes || []).forEach(function (n) { ul.appendChild(el('li', null, n)); });
      sp.appendChild(ul);
      if (w.syntax.example) sp.appendChild(el('p', null, '<b>Example on a different target:</b><br><code>' + esc(w.syntax.example) + '</code>'));
      root.appendChild(sp);
    }
    if (w.outputNote) root.appendChild(el('p', 'bankNote', 'Expected output starts like: <code>' + esc(w.outputNote) + '</code>'));

    var banner = null, lastCmd = '', result = null, ranDangerous = false, dangerNote = '';
    if (w.reduceTimerSec) {
      banner = el('div', 'redTimer', '\u23F1 Reduced timer for this exercise: <span id="redTxt">' + fmtTime(w.reduceTimerSec) + '</span> \u2014 starts when you first type in the shell');
      root.insertBefore(banner, root.firstChild);
    }
    function out(text, cls) {
      var l = el('div', 'termLine ' + (cls || ''), esc(text));
      scroll.appendChild(l);
      scroll.scrollTop = scroll.scrollHeight;
    }
    out('CyberPulse lab shell \u2014 simulation only. Type a command and press Enter.', 'sys');
    function run() {
      var cmd = input.value;
      if (!norm(cmd)) return;
      lastCmd = cmd;
      out((w.prompt || 'analyst@lab:~$') + ' ' + cmd, 'in');
      input.value = '';
      var simmed = false;
      (w.sim || []).forEach(function (s) {
        if (!simmed && rx(s.p).test(norm(cmd))) { s.o.split('\n').forEach(function (l) { out(l); }); simmed = true; }
      });
      if (!simmed) {
        var known = (w.accepted || []).some(function (a) { return rx(a).test(norm(cmd)); });
        var danger = (w.dangerous || []).some(function (d) { if (rx(d.p).test(norm(cmd))) { ranDangerous = true; dangerNote = d.n; return true; } return false; });
        if (danger) out('simulation: command rejected by the lab guard \u2014 it would change or destroy state in a real system.', 'err');
        else if (known) out('OK', 'sys');
        else out(w.notFound || 'command not found: ' + cmd.split(' ')[0] + ' \u2014 this lab only understands the commands needed for this task.', 'err');
      }
      startRedTimer();
    }
    function startRedTimer() {
      if (!w.reduceTimerSec || S.redTimer.int) return;
      S.redTimer.remain = w.reduceTimerSec;
      S.redTimer.int = setInterval(function () {
        S.redTimer.remain--;
        var t = $('#redTxt');
        if (t) t.textContent = fmtTime(S.redTimer.remain);
        if (S.redTimer.remain <= 0) {
          clearInterval(S.redTimer.int); S.redTimer.int = null;
          toast('\u23F1 Reduced timer expired \u2014 the command is graded as-is (empty counts as wrong).');
          if (S.curWidget) submitHook();
        }
      }, 1000);
    }
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { run(); startRedTimer(); }
    });
    function compute(timeout) {
      if (result) return result;
      var cmd = lastCmd || '';
      var n = norm(cmd);
      var isDanger = (w.dangerous || []).some(function (d) { return rx(d.p).test(n); });
      var ok = (w.accepted || []).some(function (a) { return rx(a).test(n); });
      input.disabled = true;
      sub.disabled = true;
      if (S.redTimer.int) { clearInterval(S.redTimer.int); S.redTimer.int = null; }
      if (!n) out('no command submitted', 'sys');
      result = {
        frac: ok ? 1 : 0,
        yourAnswer: cmd ? '<code>' + esc(cmd) + '</code>' : (timeout ? '(no command submitted before the reduced timer ended)' : '(no command submitted)'),
        correctAnswer: '<code>' + esc(w.canonical) + '</code>',
        canon: w.canonical,
        dangerNote: isDanger || ranDangerous ? (dangerNote || (w.dangerous && w.dangerous[0] ? w.dangerous[0].n : null)) : null
      };
      return result;
    }
    return { grade: function () { return compute(false); }, isTerminal: true };
  }

          correctAnswer: w.correct.map(function (n) { return 'row ' + (n + 1) + ' \u2014 ' + esc(w.rows[n].slice(0, 3).join(' | ')); }).join('<br>')

    card.appendChild(el('h2', null, '\u21B7 Review skipped exercises'));
    card.appendChild(el('p', 'sub', 'The timer keeps running. You can return to every skipped exercise as many times as you need. When you submit, any exercise still not answered is simply excluded from your score.'));
    var list = el('div', 'revList');
    S.pool.forEach(function (i) {
      var ex = EX.exercises[i];
      var row = el('div', 'revRow');
      row.appendChild(el('span', 'qn', '#' + (i + 1)));
      row.appendChild(el('span', 't', esc(ex.typeLabel || 'Exercise') + ' \u2014 ' + esc(ex.scenario && ex.scenario.summary ? ex.scenario.summary : (ex.question || '').slice(0, 80))));
      var b = el('button', 'btn btn-sm btn-primary', 'Answer now');
      b.addEventListener('click', function () {
        var pos = S.order.indexOf(i);
        if (pos !== -1) S.order.splice(pos, 1);
        S.order.push(i);            /* always re-run it as the last exercise */
        S.idx = S.order.length - 1; /* and point the cursor at it — S.idx may have been past the end */
        S.pool.splice(S.pool.indexOf(i), 1);
        delete S.res[i];
        S.screen = 'exam';
        renderExerciseAt(i);
      });
      row.appendChild(b);
      list.appendChild(row);
    });
    card.appendChild(list);
    var act = el('div', 'actions');
    var fin = el('button', 'btn btn-primary', 'Submit exam \u2192');
    fin.addEventListener('click', function () { finishExam(false); });
    act.appendChild(fin);
    card.appendChild(act);
    main.appendChild(card);
  }

  /* ---------- results ---------- */
  function finishExam(auto) {
    stopTimer();
    if (S.redTimer.int) { clearInterval(S.redTimer.int); S.redTimer.int = null; }
    S.screen = 'results';
    var agg = aggScore();
    var score = Math.round(agg.earned), total = Math.round(agg.max);
    var percent = total ? Math.round(100 * score / total) : 0;
    var passed = total > 0 && percent >= EX.meta.passMark;
    if (!S.reported) { S.reported = true; reportScore(score, total); }
    var main = $('#examMain');
    main.innerHTML = '';
    var hero = el('div', 'resHero ' + (passed ? 'pass' : 'fail'));
    if (auto) hero.appendChild(el('p', null, '\u23F1 Time ran out \u2014 the exam was submitted automatically.'));
    hero.appendChild(el('h1', null, passed ? '\u2713 PASSED' : '\u2717 FAILED \u2014 retake needed'));
    hero.appendChild(el('div', 'pct', percent + '%'));
    hero.appendChild(el('p', 'sub', passed ? 'You reached the pass mark of ' + EX.meta.passMark + '% for this tier.' : 'The pass mark is ' + EX.meta.passMark + '%. Study the report below, then retake the exam.'));
    if (passed && S.user) hero.appendChild(el('div', 'certLine', 'Certificate of completion \u2014 ' + esc(EX.meta.title) + ' \u2014 candidate: ' + esc(S.user)));
    var nCorrect = 0, nWrong = 0;
    Object.keys(S.res).forEach(function (k) { var r = S.res[k]; if (r.answered) { if (r.verdict === 'correct') nCorrect++; else nWrong++; } });
    var grid = el('div', 'resGrid');
    [['Score', score + ' / ' + total], ['Correct', String(nCorrect)], ['Incorrect', String(nWrong)], ['Answered', agg.answered + ' of ' + EX.exercises.length], ['Skipped & not answered', (EX.exercises.length - agg.answered)], ['Pass mark', EX.meta.passMark + '%']].forEach(function (c) {
      var cell = el('div', 'resCell');
      cell.appendChild(el('div', 'v', esc(String(c[1]))));
      cell.appendChild(el('div', 'l', esc(c[0])));
      grid.appendChild(cell);
    });
    hero.appendChild(grid);
    hero.appendChild(el('p', 'certLine', 'Skipped exercises that stayed unanswered are excluded from the score \u2014 from both points and total.'));
    main.appendChild(hero);

    /* per-theme progress (spec STEP 3) */
    var themesState = {};
    EX.exercises.forEach(function (ex, i) {
      if (typeof ex.theme !== 'number' || !EX.keywords[ex.theme]) return;
      var r = S.res[i];
      var st = themesState[ex.theme] = themesState[ex.theme] || { answered: 0, ok: 0 };
      if (r && r.answered) { st.answered++; if (r.earned >= r.max) st.ok++; }
    });
    var themeKeys = Object.keys(themesState);
    if (themeKeys.length) {
      var themeCard = el('div', 'exCard');
      themeCard.appendChild(el('h2', null, '\u25C8 Progress by theme'));
      themeCard.appendChild(el('p', 'sub', 'Green: answered fully correct. Red: answered with mistakes. Grey: not answered \u2014 the theme is still open.'));
      var strip = el('div', 'themeStrip');
      EX.keywords.forEach(function (k, t) {
        if (!themesState[t]) return;
        var stt = themesState[t];
        var cls = stt.answered ? (stt.ok ? ' t-ok' : ' t-miss') : ' t-na';
        var icon = stt.answered ? (stt.ok ? '\u2713' : '\u2717') : '\u25CB';
        strip.appendChild(el('span', 'tChip' + cls, '<b aria-hidden="true">' + icon + '</b> ' + esc(k.t)));
      });
      themeCard.appendChild(strip);
      main.appendChild(themeCard);
    }

    var repCard = el('div', 'exCard');
    repCard.appendChild(el('h2', null, 'Detailed report'));
    var rep = el('div', 'report');
    EX.exercises.forEach(function (ex, i) {
      var r = S.res[i];
      var row = el('div', 'repRow' + (r && r.answered ? '' : ' exc'));
      var hd = el('div', 'hd');
      hd.appendChild(el('span', 'qn', '#' + (i + 1)));
      hd.appendChild(el('span', 't', esc(ex.typeLabel || 'Exercise') + ' \u2014 ' + esc(ex.scenario && ex.scenario.summary ? ex.scenario.summary : (ex.question || '').slice(0, 70))));
      if (!r || !r.answered) hd.appendChild(el('span', 'verdict v-exc', '\u26A0 Not answered \u2014 excluded from score'));
      else if (r.verdict === 'correct') hd.appendChild(el('span', 'verdict v-ok', '\u2713 Correct'));
      else if (r.verdict === 'partial') hd.appendChild(el('span', 'verdict v-mid', '\u25D0 Partial'));
      else hd.appendChild(el('span', 'verdict v-bad', '\u2717 Incorrect'));
      row.appendChild(hd);
      var bd = el('div', 'bd');
      if (r && r.answered) {
        bd.appendChild(el('p', null, '<span class="lbl">Points:</span> ' + r.earned + ' / ' + r.max));
        var expl = ex.type === 'steps' ? ex.steps.map(function (st) { return st.explain; }).join(' ') : ex.explain;
        var corr = exCorrect(ex);
        bd.appendChild(el('p', null, '<span class="lbl">Correct answer:</span> ' + corr));
        bd.appendChild(el('p', null, '<span class="lbl">Why:</span> ' + esc(expl)));
        if (ex.study) bd.appendChild(el('p', null, '<span class="lbl">Study:</span> ' + esc(ex.study)));
      } else {
        bd.appendChild(el('p', null, 'You skipped this exercise and never answered it. It does not count as correct or wrong, and its points are not in your total.'));
      }
      row.appendChild(bd);
      rep.appendChild(row);
    });
    repCard.appendChild(rep);
    var act = el('div', 'actions');
    var ret = el('button', 'btn btn-primary', '\u21BA Retake exam');
    ret.addEventListener('click', startExam);
    act.appendChild(ret);
    repCard.appendChild(act);
    main.appendChild(repCard);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function exCorrect(ex) {
    if (ex.type === 'steps') return ex.steps.map(function (st, n) { return 'Step ' + (n + 1) + ': ' + stCorrect(st); }).join('<br>');
    return stCorrect(ex);
    function stCorrect(st) {
      var w = st.widget || st;
      if (w.kind === 'mcq') return esc(w.options[w.correct]);
      if (w.kind === 'multi') return w.correct.map(function (k) { return esc(w.options[k]); }).join(' + ');
      if (w.kind === 'order') return esc(w.items.join(' \u2192 '));
      if (w.kind === 'wordbank') return esc(w.slots.join(' | '));
      if (w.kind === 'match') return esc(w.pairs.map(function (q) { return w.left[q[0]] + ' \u2194 ' + w.right[q[1]]; }).join('; '));
      if (w.kind === 'categorize') return esc(w.items.map(function (it) { return it.label + ' \u2192 ' + w.zones[it.zone]; }).join('; '));
      if (w.kind === 'terminal') return '<code>' + esc(w.canonical) + '</code>';
      if (w.kind === 'logview') return 'rows ' + w.correct.map(function (n) { return n + 1; }).join(', ');
      return '';
    }
  }

  /* ---------- site integration ---------- */
  function reportScore(score, total) {
    var percent = total ? Math.round((score / total) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: EX.meta.topicId,
        batch: EX.meta.batch,
        score: score,
        total: total,
        percent: percent,
        passed: percent >= EX.meta.passMark
      }, location.origin);
    } catch (e) {
      /* opened directly as a file — nothing to report to */
    }
  }
  window.addEventListener('message', function (event) {
    if (!event.data) return;
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
    try {
      S.user = event.data.username || null;
      var b = $('#startBtnLabel');
      if (b) b.textContent = S.user ? 'Start exam, ' + S.user : 'Start exam';
    } catch (e) { /* keep the exam usable no matter what */ }
  });

  /* ---------- boot ---------- */
  var booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    if (!window.EXAM) { document.body.innerHTML = '<p>Missing exam data.</p>'; return; }
    renderIntro();
  }
  document.addEventListener('DOMContentLoaded', boot);
  if (document.readyState !== 'loading') boot();

  window.__engineReady = true;
})();

</script>
</body>
</html>
