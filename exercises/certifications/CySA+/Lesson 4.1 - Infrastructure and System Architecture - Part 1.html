<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNSF-101 — Cloud-Native Security Foundations Certification Exam</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#0e1830; --panel:#111c33; --panel2:#0f1830;
    --border:#1e2c4a; --border2:#2b3f63;
    --text:#e2e8f0; --muted:#8ba0c0; --dim:#5b708f;
    --cyan:#22d3ee; --violet:#a78bfa; --pink:#f472b6;
    --ok:#34d399; --err:#f87171; --warn:#fbbf24;
    --mono:'Cascadia Mono','JetBrains Mono',Consolas,'Courier New',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(34,211,238,.08), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(167,139,250,.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    font-size:15px; line-height:1.55;
  }
  #app{max-width:1060px; margin:0 auto; padding:14px 18px 60px;}

  /* ---------- top bar ---------- */
  #topbar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:linear-gradient(180deg,#101b31,#0d1628);
    border:1px solid var(--border); border-radius:14px;
    padding:10px 16px; position:sticky; top:8px; z-index:40;
    box-shadow:0 8px 30px rgba(0,0,0,.45);
  }
  .brand{font-weight:700; letter-spacing:.5px; white-space:nowrap;}
  .brand .code{color:var(--cyan); font-family:var(--mono);}
  .brand .sub{color:var(--muted); font-weight:400; font-size:12.5px; margin-left:8px;}
  .tb-item{display:flex; align-items:center; gap:8px;}
  .timer{font-family:var(--mono); font-size:17px; color:var(--cyan); background:#0a1424;
    border:1px solid var(--border2); padding:5px 10px; border-radius:8px;}
  .timer.low{color:var(--err); border-color:var(--err); animation:pulseRed 1s infinite;}
  @keyframes pulseRed{50%{box-shadow:0 0 12px rgba(248,113,113,.55);}}
  .score{font-family:var(--mono); font-size:14px; color:var(--ok);}
  .score b{font-size:16px;}
  .btn{
    background:linear-gradient(180deg,#123056,#0e2444); color:var(--text);
    border:1px solid var(--border2); border-radius:8px; padding:7px 14px;
    font-size:13.5px; cursor:pointer; transition:.18s; font-family:inherit;
  }
  .btn:hover{filter:brightness(1.25); border-color:var(--cyan);}
  .btn:disabled{opacity:.4; cursor:not-allowed; filter:none;}
  .btn.primary{
    background:linear-gradient(180deg,#0e7490,#0b5a72); border-color:#0e7490; font-weight:600;
    padding:11px 26px; font-size:15px; box-shadow:0 0 18px rgba(34,211,238,.25);
  }
  .btn.primary:hover{box-shadow:0 0 26px rgba(34,211,238,.45);}
  .btn.danger{background:linear-gradient(180deg,#7f1d1d,#5f1616); border-color:#7f1d1d;}

  /* ---------- progress ---------- */
  #progressWrap{height:8px; background:#0a1322; border:1px solid var(--border); border-radius:99px;
    margin-top:10px; overflow:hidden;}
  #progressBar{height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg,var(--cyan),var(--violet));
    box-shadow:0 0 12px rgba(34,211,238,.6); transition:width .5s ease;}
  #themeProgress{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .tchip{font-size:11.5px; padding:3px 9px; border-radius:99px; border:1px solid var(--border2);
    color:var(--muted); background:#0c1626;}
  .tchip .dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px;}
  .tchip b{color:var(--text);}

  /* ---------- cards ---------- */
  .card{background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:22px 24px; margin-top:16px; box-shadow:0 10px 34px rgba(0,0,0,.35);}
  @keyframes slideIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
  .q-card{animation:slideIn .4s ease;}
  .q-meta{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
  .q-num{font-family:var(--mono); color:var(--cyan); font-size:13px; background:#0a1424;
    border:1px solid var(--border2); padding:3px 9px; border-radius:7px;}
  .chip{border-radius:99px; padding:3px 10px; font-size:12px; border:1px solid;}
  .pts{font-family:var(--mono); color:var(--warn); font-size:12.5px;}
  .hintbtn{margin-left:auto; font-size:12.5px;}
  .q-prompt{font-size:16px; color:#f1f5f9; margin-bottom:6px;}
  .q-prompt .scenario{color:var(--muted); font-size:14px; display:block; margin-bottom:10px;
    border-left:3px solid var(--border2); padding-left:12px;}
  .q-body{position:relative; margin-top:14px;}
  .veil{position:absolute; inset:0; z-index:6; border-radius:8px; display:none;}
  .submitted .veil{display:block; background:rgba(11,18,32,.35);}

  /* ---------- choices ---------- */
  .choices{display:flex; flex-direction:column; gap:9px; margin-top:6px;}
  .option{display:flex; gap:10px; align-items:flex-start; background:#0d1830; border:1px solid var(--border);
    padding:11px 13px; border-radius:10px; cursor:pointer; transition:.15s;}
  .option:hover{border-color:var(--border2); background:#101f3a;}
  .option input{margin-top:3px; accent-color:var(--cyan); flex:none; width:15px; height:15px;}
  .option .optletter{font-family:var(--mono); color:var(--cyan); flex:none; margin-top:0;}
  .option.good{border-color:var(--ok); background:rgba(52,211,153,.08);}
  .option.bad{border-color:var(--err); background:rgba(248,113,113,.08);}
  .option .tick{margin-left:auto; font-weight:700; flex:none;}
  .submitted .option{cursor:default;}
  .submitted .option.good .tick::after{content:"✓"; color:var(--ok);}
  .submitted .option.bad .tick::after{content:"✗"; color:var(--err);}

  /* ---------- feedback ---------- */
  .feedback{margin-top:16px; border-radius:12px; padding:14px 16px; border:1px solid var(--border2);
    background:#0c1626; animation:slideIn .35s ease;}
  .feedback.ok{border-color:var(--ok); background:rgba(52,211,153,.07);}
  .feedback.part{border-color:var(--warn); background:rgba(251,191,36,.07);}
  .feedback.bad{border-color:var(--err); background:rgba(248,113,113,.07);}
  .fb-head{font-weight:700; font-size:15px; margin-bottom:6px;}
  .feedback.ok .fb-head{color:var(--ok);}
  .feedback.part .fb-head{color:var(--warn);}
  .feedback.bad .fb-head{color:var(--err);}
  .fb-exp{color:#cbd5e1; font-size:14px;}
  .fb-focus{margin-top:10px; font-size:13.5px; color:var(--warn); border-left:3px solid var(--warn);
    padding-left:10px;}
  .hintbox{margin-top:12px; border:1px dashed var(--border2); border-radius:10px; padding:10px 13px;
    color:var(--violet); font-size:13.5px; background:rgba(167,139,250,.06);}
  .q-actions{display:flex; gap:10px; margin-top:18px; align-items:center; flex-wrap:wrap;}
  .msg-amber{color:var(--warn); font-size:13.5px; margin-top:10px;}

  /* ---------- code / terminal / logs ---------- */
  pre.code{
    background:#070d18; border:1px solid var(--border); border-radius:10px;
    padding:14px 16px; font-family:var(--mono); font-size:13px; line-height:1.7;
    color:#b8c7de; overflow-x:auto; margin:10px 0;
  }
  pre.code .ln{color:#33507a; user-select:none; margin-right:12px;}
  pre.code .k{color:var(--cyan);} pre.code .c{color:#5b708f; font-style:italic;}
  pre.code .s{color:var(--ok);} pre.code .bad-tok{color:var(--err);}
  .terminal{background:#04070d; border:1px solid #14304f; border-radius:10px;
    font-family:var(--mono); font-size:13.5px; overflow:hidden; margin-top:12px;}
  .term-title{background:#0a1424; color:var(--muted); padding:6px 12px; font-size:11.5px;
    border-bottom:1px solid #14304f; letter-spacing:1px;}
  .term-out{min-height:190px; max-height:290px; overflow-y:auto; padding:12px 14px; color:#9fe8c8;}
  .term-out .cmdline{color:#7dd3fc;} .term-out .sys{color:#5b708f;}
  .term-out .goodline{color:var(--ok);} .term-out .badline{color:var(--err);}
  .term-in{display:flex; align-items:center; gap:8px; border-top:1px solid #14304f;
    padding:8px 12px; background:#060b14;}
  .term-prompt{color:var(--ok); font-weight:700; white-space:nowrap;}
  .term-in input{flex:1; background:transparent; border:none; outline:none; color:#e2e8f0;
    font-family:var(--mono); font-size:13.5px; caret-color:var(--ok);}
  .logview{background:#070d18; border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-top:12px;}
  .log-toolbar{display:flex; align-items:center; gap:10px; padding:9px 12px; background:#0a1424;
    border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .log-toolbar label{color:var(--muted); font-size:12px;}
  .log-toolbar input{flex:1; min-width:180px; background:#050a13; color:#cbd5e1; border:1px solid var(--border2);
    border-radius:7px; padding:6px 10px; font-family:var(--mono); font-size:13px; outline:none;}
  .log-toolbar input:focus{border-color:var(--cyan);}
  .log-count{font-family:var(--mono); font-size:12px; color:var(--muted);}
  .log-scroll{max-height:250px; overflow:auto;}
  .logline{display:flex; gap:10px; padding:3px 12px; font-family:var(--mono); font-size:12.5px;
    border-bottom:1px solid #0b1424; white-space:nowrap;}
  .logline .ts{color:#44577c;}
  .logline .m{color:#7dd3fc;} .logline .p{color:var(--violet);} .logline .ip{color:#5b708f;}
  .code2{color:var(--ok); font-weight:700;} .code4{color:var(--warn); font-weight:700;}
  .code5{color:var(--err); font-weight:700;}
  .locked-wrap{opacity:.45; pointer-events:none; filter:grayscale(.4);}
  .locknote{font-size:13px; color:var(--warn); margin-top:10px;}

  /* ---------- drag / match / order ---------- */
  .tilepool,.zonepool{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;}
  .tile,.zone{padding:10px 14px; border-radius:10px; border:1px solid var(--border2);
    background:#0d1830; cursor:grab; font-size:13.5px; user-select:none; transition:.15s; touch-action:none;}
  .tile:hover,.tile.sel{border-color:var(--cyan); box-shadow:0 0 10px rgba(34,211,238,.3);}
  .tile.sel{outline:2px solid var(--cyan);}
  .zone{border-style:dashed; cursor:pointer; min-width:190px; flex:1; color:var(--muted);}
  .zone.over{border-color:var(--ok); background:rgba(52,211,153,.08);}
  .zone.filled{border-style:solid; border-color:var(--ok); color:var(--text); background:rgba(52,211,153,.09); cursor:default;}
  .tile.placed{opacity:.35; pointer-events:none;}
  .zone.shake,.tile.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:none;}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .matchcols{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:12px;}
  @media (max-width:760px){.matchcols{grid-template-columns:1fr;}}
  .mcol-title{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px;}
  .m-item{padding:10px 13px; border-radius:10px; border:1px solid var(--border2); background:#0d1830;
    margin-bottom:8px; cursor:pointer; font-size:13.5px; transition:.15s; user-select:none;}
  .m-item:hover{border-color:var(--border2);}
  .m-item.sel{outline:2px solid var(--cyan); background:#12264a;}
  .m-item.matched{border-color:var(--ok); background:rgba(52,211,153,.09); cursor:default; color:var(--ok);}
  .m-item.burned{border-color:var(--err);}
  .ord-item{display:flex; align-items:center; gap:10px; background:#0d1830; border:1px solid var(--border2);
    border-radius:10px; padding:9px 12px; margin-bottom:8px; cursor:grab; user-select:none;}
  .ord-item .grip{color:#3b537d; font-size:16px; cursor:grab;}
  .ord-item .ordpos{font-family:var(--mono); color:var(--cyan); background:#0a1424; border:1px solid var(--border2);
    border-radius:6px; padding:1px 8px; font-size:12.5px; flex:none;}
  .ord-item .ordtext{flex:1; font-size:13.5px;}
  .ord-btns{display:flex; gap:4px;}
  .ord-btns button{background:#0a1424; color:var(--muted); border:1px solid var(--border2); border-radius:6px;
    width:26px; height:26px; cursor:pointer; font-size:11px;}
  .ord-btns button:hover{color:var(--cyan); border-color:var(--cyan);}
  .ord-item.dragging{opacity:.45;}
  .ord-item.over{border-color:var(--ok); box-shadow:0 0 8px rgba(52,211,153,.35);}
  .drag-hint{font-size:12px; color:var(--dim); margin-top:8px;}
  .strip-legend{display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-top:8px;}
  .hinttag{color:var(--warn); font-size:12.5px;}

  /* ---------- blanks ---------- */
  .fblank{display:inline-block; min-width:150px; text-align:center; border-bottom:2px dashed var(--border2);
    color:var(--cyan); font-family:var(--mono); padding:2px 10px; margin:0 4px; cursor:pointer;
    background:transparent; font-size:13.5px; transition:.15s;}
  .fblank.filled{border-bottom-color:var(--ok); color:var(--ok); background:rgba(52,211,153,.07);}
  .fblank:hover{border-bottom-color:var(--cyan);}
  .sentence{font-size:14.5px; line-height:2.4; color:#cbd5e1;}
  .wordbank{display:flex; flex-wrap:wrap; gap:9px; margin-top:14px; padding-top:12px;
    border-top:1px dashed var(--border);}
  .wchip{background:#0d1830; border:1px solid var(--border2); color:var(--text); border-radius:9px;
    padding:8px 14px; font-size:13.5px; cursor:pointer; font-family:var(--mono); transition:.15s;}
  .wchip:hover,.wchip.sel{border-color:var(--cyan); box-shadow:0 0 10px rgba(34,211,238,.3);}
  .wchip.sel{outline:2px solid var(--cyan);}

  /* ---------- alert cards ---------- */
  .alertcards{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
  .alertcard{display:flex; gap:12px; align-items:flex-start; border:1px solid var(--border); background:#0d1830;
    border-radius:11px; padding:12px 14px; cursor:pointer; transition:.15s;}
  .alertcard:hover{border-color:var(--border2);}
  .alertcard input{margin-top:4px; accent-color:var(--cyan);}
  .sev{font-family:var(--mono); font-size:11.5px; font-weight:700; padding:2px 9px; border-radius:99px; flex:none;}
  .sev.crit{background:rgba(248,113,113,.15); color:var(--err); border:1px solid var(--err);}
  .sev.high{background:rgba(251,146,60,.15); color:#fb923c; border:1px solid #fb923c;}
  .sev.med{background:rgba(251,191,36,.15); color:var(--warn); border:1px solid var(--warn);}
  .alertid{font-family:var(--mono); color:var(--cyan); font-size:13px;}

  /* ---------- branch ---------- */
  .branch-step{border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-top:14px;
    background:#0d1830;}
  .branch-step .bstep-tag{font-family:var(--mono); font-size:11.5px; color:var(--violet); letter-spacing:1px;}
  .branch-step.locked{opacity:.38; pointer-events:none; filter:grayscale(.5);}
  .branch-step .step-fb{margin-top:10px; font-size:13.5px; border-left:3px solid; padding-left:10px;}
  .branch-step .step-fb.ok{color:var(--ok); border-color:var(--ok);}
  .branch-step .step-fb.bad{color:var(--err); border-color:var(--err);}
  .ctx-note{margin-top:8px; font-size:13px; color:var(--warn);}

  /* ---------- intro ---------- */
  .hero{text-align:center; padding:30px 10px 10px;}
  .hero h1{font-size:30px; letter-spacing:.5px;}
  .hero h1 .grad{background:linear-gradient(90deg,var(--cyan),var(--violet)); -webkit-background-clip:text;
    background-clip:text; color:transparent;}
  .hero .subtitle{color:var(--muted); margin-top:8px; font-size:15px;}
  .statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-top:22px;}
  .stat{background:#0d1830; border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center;}
  .stat .v{font-size:22px; font-weight:700; font-family:var(--mono);}
  .stat .k{font-size:12px; color:var(--muted); margin-top:3px;}
  .kwinfo{text-align:left;}
  .kwinfo h3{font-size:13px; letter-spacing:1px; text-transform:uppercase; margin:16px 0 8px; display:flex;
    align-items:center; gap:8px;}
  .kwinfo h3 .bar{width:8px; height:14px; border-radius:3px; display:inline-block;}
  .kwchips{display:flex; flex-wrap:wrap; gap:6px;}
  .kwchip{font-size:12px; padding:3px 10px; border-radius:99px; border:1px solid var(--border2);
    color:#cbd5e1; background:#0d1830; font-family:var(--mono);}
  .typelist{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px;}
  .typechip{font-size:12.5px; padding:6px 12px; border-radius:99px; background:#0d1830;
    border:1px solid var(--border2); color:#cbd5e1;}
  .startwrap{text-align:center; margin-top:26px;}

  /* ---------- results ---------- */
  .result-hero{text-align:center; padding:16px 0 4px;}
  .bigpct{font-size:58px; font-weight:800; font-family:var(--mono);}
  .verdict{display:inline-block; margin-top:8px; font-size:17px; font-weight:700; padding:8px 26px;
    border-radius:99px; letter-spacing:1px;}
  .verdict.pass{color:#052e21; background:linear-gradient(180deg,#6ee7b7,#34d399); box-shadow:0 0 30px rgba(52,211,153,.4);}
  .verdict.fail{color:#450a0a; background:linear-gradient(180deg,#fca5a5,#f87171); box-shadow:0 0 30px rgba(248,113,113,.4);}
  .cert{max-width:640px; margin:22px auto; border:2px solid var(--warn); border-radius:16px; padding:26px 30px;
    background:linear-gradient(180deg,#141b14,#0d1410); position:relative; text-align:center;
    box-shadow:0 0 40px rgba(251,191,36,.15);}
  .cert .ribbon{position:absolute; top:-13px; left:50%; transform:translateX(-50%);
    background:linear-gradient(90deg,#b45309,#f59e0b); color:#1c0a00; font-weight:800; font-size:11.5px;
    letter-spacing:1.5px; padding:4px 18px; border-radius:99px; white-space:nowrap;}
  .cert .seal{width:58px; height:58px; margin:8px auto 10px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fde68a, #f59e0b 70%);
    display:flex; align-items:center; justify-content:center; font-size:26px; color:#451a03; font-weight:900;
    box-shadow:0 0 22px rgba(245,158,11,.5);}
  .cert h2{font-size:22px; letter-spacing:1px; color:#fef3c7;}
  .cert .certsub{color:#b9a15f; font-family:var(--mono); font-size:13px; margin-top:3px;}
  .cert .certline{color:#cbd5e1; font-size:13.5px; margin-top:12px;}
  .cert input{background:#0a0f08; border:1px solid #4d3b12; color:#fde68a; text-align:center;
    font-size:20px; font-family:'Georgia',serif; font-style:italic; border-radius:8px; padding:5px 16px;
    margin-top:10px; width:80%; max-width:380px; outline:none;}
  .cert input:focus{border-color:var(--warn);}
  .cert-grid{display:flex; justify-content:space-around; margin-top:18px; flex-wrap:wrap; gap:10px;}
  .cert-grid .g{font-size:12px; color:var(--muted);} .cert-grid .g b{display:block; color:#fef3c7;
    font-family:var(--mono); font-size:13.5px; margin-top:2px;}
  .report-item{display:flex; gap:14px; border:1px solid var(--border); border-radius:12px; padding:14px 16px;
    margin-top:10px; background:#0d1830;}
  .report-item .ri-icon{font-size:20px; flex:none; width:30px; text-align:center;}
  .report-item.ok{border-left:4px solid var(--ok);}
  .report-item.part{border-left:4px solid var(--warn);}
  .report-item.bad{border-left:4px solid var(--err);}
  .report-item.na{border-left:4px solid var(--dim);}
  .ri-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .ri-title{font-weight:700; font-size:14.5px;}
  .ri-pts{font-family:var(--mono); font-size:12.5px; color:var(--muted); margin-left:auto;}
  .ri-summary{font-size:13px; color:#b6c4d9; margin-top:6px;}
  .ri-exp{font-size:13.5px; color:#cbd5e1; margin-top:8px; background:#0a1424; border-radius:8px; padding:9px 12px;}
  .ri-focus{font-size:13px; color:var(--warn); margin-top:8px;}

  /* ---------- pause overlay ---------- */
  #pauseOverlay{position:fixed; inset:0; z-index:100; background:rgba(4,8,16,.75);
    backdrop-filter:blur(14px); display:flex; align-items:center; justify-content:center; text-align:center;}
  #pauseOverlay .pbox{border:1px solid var(--border2); background:#0d1830; border-radius:18px; padding:36px 44px;
    box-shadow:0 0 60px rgba(0,0,0,.6);}
  #pauseOverlay .picon{font-size:46px; color:var(--warn);}
  #pauseOverlay h2{margin-top:10px; font-size:22px;}
  #pauseOverlay p{color:var(--muted); margin-top:8px; max-width:420px; font-size:14px;}
  #pauseOverlay .btn{margin-top:18px;}
  .hidden{display:none !important;}

  .footnote{color:var(--dim); font-size:12px; text-align:center; margin-top:30px;}

<script>
'use strict';
/* ============================================================
   CNSF-101 — Cloud-Native Security Foundations Certification
   Single-file exam. Vanilla JS only.

/* ---------------- helpers ---------------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function $(sel, root){ return (root||document).querySelector(sel); }
function $$(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function norm(s){ return String(s).trim().toLowerCase().replace(/\s+/g,' '); }
function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}
function round2(x){ return Math.round(x*100)/100; }

/* ---------------- themes & keywords ---------------- */
const THEMES = [
  {id:'cv',  name:'Cloud & Virtualization',       color:'#38bdf8'},
  {id:'at',  name:'Architecture & Trust',         color:'#a78bfa'},
  {id:'api', name:'API Security & Exposure',      color:'#f472b6'},
  {id:'seg', name:'Segmentation & Access Control',color:'#34d399'},
  {id:'mon', name:'Visibility & Monitoring',      color:'#fbbf24'},
  {id:'ana', name:'Analyst Skills & Testing',     color:'#fb7185'}
];
const themeById = id => THEMES.find(t=>t.id===id);

const KEYWORDS = [
  {theme:'cv',  words:['cloud-native systems','on-premises','virtual machines (VMs)','containers','isolated workloads','shared hardware','dynamic, scalable components','virtualized architecture','foundational technologies']},
  {theme:'at',  words:['distributed architecture','API-driven architecture','trust boundaries']},
  {theme:'api', words:['APIs (Application Programming Interfaces)','exposing critical data and functions','Internet exposure']},
  {theme:'seg', words:['network segmentation','segmentation','access control']},
  {theme:'mon', words:['continuous monitoring','visibility into configurations','multiple providers','CSPM']},
  {theme:'ana', words:['cybersecurity analyst','safe testing']}
];

/* ---------------- question data ---------------- */
/* Types: qcm | multi | fill | match | order | rank | drag | terminal |
          log | branch | spot | dual | triage */
const QUESTIONS = [

/* ---------- Theme: Cloud & Virtualization ---------- */
{ id:'q1', theme:'cv', type:'qcm', label:'Isolation: VM vs container', points:4,
  prompt:'A bank runs the same application two ways: on VMware virtual machines (VMs) in its own data center (on-premises) and as containers in a public cloud. A colleague says: "Containers and VMs give the same level of isolation." Which answer correctly explains the difference?',
  choices:[
    {t:'A hypervisor separates VMs at the hardware level; containers share the host kernel and need extra isolation controls.', c:true},
    {t:'VMs share the host kernel just like containers; the hypervisor only manages network traffic.', c:false},
    {t:'Containers run their own full guest operating system, so they are isolated at the hardware level like VMs.', c:false},
    {t:'Isolation is identical because both run on the same shared hardware, so the risk is equal.', c:false}
  ],
  explanation:'A VM acts like a separate small computer. The hypervisor (a program that runs VMs) gives each VM its own slice of the hardware, including its own operating system. Containers share the kernel — the core of the host operating system. If an attacker escapes one container, the other containers on that host are in danger. That is why containers need extra controls: run as non-root, use network policies, and patch the host fast.',
  hint:'Think about what each technology shares: VMs share physical hardware, containers share the operating system kernel.',
  focus:'Review how the hypervisor isolates VMs at the hardware level, and why containers share the host kernel.' },

{ id:'q2', theme:'cv', type:'qcm', label:'Dynamic components & visibility', points:4,
  prompt:'A cloud-native application adds and removes its own servers in seconds (auto-scaling). The analyst opens the asset inventory and it is already out of date. Why do these dynamic, scalable components create a monitoring problem?',
  choices:[
    {t:'Assets appear and disappear constantly, so visibility must be continuous, not a monthly scan.', c:true},
    {t:'Auto-scaling deletes all logs by default, so nothing can ever be audited.', c:false},
    {t:'Dynamic components can only be monitored from inside the network, which is impossible in the cloud.', c:false},
    {t:'Scalable systems stop sending metrics as soon as they grow past ten servers.', c:false}
  ],
  explanation:'Cloud systems change size all the time. A new server appears and an old one disappears within minutes. A check that runs once a month misses almost everything. You need continuous monitoring: a system that watches all the time and reports changes the moment they happen.',
  hint:'The problem is not logs or metrics. The problem is that the list of assets changes every minute.',
  focus:'Study why cloud assets are short-lived (ephemeral) and why monitoring must be continuous.' },

{ id:'q4', theme:'cv', type:'match', label:'Components: what they share', points:4,
  prompt:'Match each component with the thing it shares or exposes.',
  left:['Virtual machine (VM)','Container','API','Bare-metal server'],
  right:['Shares the host kernel with other workloads','Has its own guest OS, isolated by a hypervisor','Exposes functions and data over the network','Runs directly on the hardware, no hypervisor layer'],
  pairs:[[0,1],[1,0],[2,2],[3,3]],
  explanation:'A VM has its own guest operating system, and the hypervisor keeps VMs apart. A container shares the kernel of the host, so its isolation is weaker and needs extra controls. An API is a network interface, so it exposes functions and data to whoever can reach it. A bare-metal server runs directly on the physical hardware with no hypervisor at all.',
  hint:'One word per item: VM = own OS, container = shared kernel, API = network, bare metal = no hypervisor.',
  focus:'Remember the isolation model: VM = hardware-level, container = kernel-level, bare metal = none.' },

{ id:'q7', theme:'cv', type:'terminal', label:'Terminal: container triage', points:4,
  prompt:'<span class="scenario">02:14 AM. The monitoring dashboard shows CPU at 98% on host <b>prod-cn-04</b>. You suspect one container. You are logged in as the analyst on that host\'s shell. Type the two commands: first list the running containers, then read the logs of the suspicious container named <b>web-api</b>.</span>',
  intro:'Night shift. Host prod-cn-04 is on fire (CPU 98%). You have a shell on the host. Type "help" if you are stuck.',
  steps:[
    { promptLine:'analyst@prod-cn-04:~$',
      accept: s => /^(sudo\s+)?(docker|podman)(\s+(container\s+)?ls|\s+ps)(\s+-a)?$/.test(s),
      success:'3 containers running: web-api (CPU 98%), db-proxy, log-shipper. web-api is the problem.',
      failMsg:'Not recognized, or not the right command. You want to LIST running containers.' },
    { promptLine:'analyst@prod-cn-04:~$',
      accept: s => { const t = s.replace(/^(sudo\s+)/,''); return /^(docker|podman)(\s+container)?\s+logs\b/.test(t) && /\bweb-api\b/.test(t); },
      success:'Log flood: thousands of requests to /v1/export from one IP. Now you know what to report to L2.',
      failMsg:'Not the right one. You want to READ THE LOGS of the container named web-api.' }
  ],
  helpText:'Step 1: a one-word tool to list running containers. Step 2: the same tool, subcommand "logs", then the container name.',
  explanation:'"docker ps" (or "docker container ls") lists running containers with their names, images and status. "docker logs web-api" prints the logs of that container. Logs are the fastest way to see what a misbehaving container is doing. These two commands are the basic triage drill for any containerized host.',
  hint:'The tool is docker. First list containers, then read logs using the container name.',
  focus:'Practice the docker basics: ps / container ls, logs, inspect, top, stats.' },

{ id:'q23', theme:'cv', type:'match', label:'Problems & mitigations', points:4,
  prompt:'Match each problem found in the environment with its best mitigation.',
  left:['API key exposed in a public repository','Container escapes to the host','Cloud configurations drift from policy','VM sprawl: nobody knows which VMs exist'],
  right:['Rotate the key and move secrets to a vault','Run containers as non-root and patch the kernel','CSPM continuous checks against a baseline','Automatic inventory via provider APIs and tagging'],
  pairs:[[0,0],[1,1],[2,2],[3,3]],
  explanation:'A leaked key must be rotated (changed) right away, and a secret vault keeps keys out of source code. A container escape is stopped by running as non-root and keeping the kernel patched. Configuration drift is caught by continuous CSPM checks against a known-good baseline. VM sprawl is solved by an automatic inventory — you cannot protect machines you do not know exist.',
  hint:'Pair each problem with the fix that attacks its root cause, not its symptom.',
  focus:'Memorize: leaked secret → rotate + vault; escape → non-root + patch; drift → baseline checks; sprawl → inventory.' },

/* ---------- Theme: Architecture & Trust ---------- */
{ id:'q5', theme:'at', type:'qcm', label:'Where trust boundaries moved', points:4,
  prompt:'Ten years ago, the application was one program on one server inside the office network. Today it is distributed: many small services on virtualized servers, talking through APIs across several clouds. How did the trust boundaries change?',
  choices:[
    {t:'The network perimeter is no longer the main boundary; trust now lives around each component, its identity, and each API call.', c:true},
    {t:'Trust boundaries disappeared because the cloud provider handles all security automatically.', c:false},
    {t:'The trust boundary is still exactly the office firewall, and everything behind it is trusted.', c:false},
    {t:'Trust moved to the hardware layer; anyone with physical access to a server is automatically trusted.', c:false}
  ],
  explanation:'In the old model, one firewall guarded the office network and everything inside was trusted. Today parts of the app live in different clouds and talk over the Internet. One firewall cannot protect that. So we build small trust boundaries around each part: every service, every identity, and every API call must prove it is allowed. This is the core of zero-trust thinking.',
  hint:'If the app now lives in many places at once, can one firewall still be the single boundary?',
  focus:'Study zero-trust design and why trust moved from the network perimeter to components and identities.' },

{ id:'q19', theme:'at', type:'multi', label:'Trust boundaries (multi-select)', points:4,
  prompt:'Which statements are TRUE about trust boundaries in a distributed, API-driven architecture? Select all that apply.',
  choices:[
    {t:'Every API call crosses a trust boundary and must be authenticated and authorized.', c:true},
    {t:'Trust boundaries can sit between services, between a service and its data, and between clouds.', c:true},
    {t:'A trust boundary is always a physical firewall appliance.', c:false},
    {t:'Once a request is inside the network, it can be fully trusted.', c:false},
    {t:'The boundary between a public API and the Internet is one of the highest-risk boundaries.', c:true}
  ],
  explanation:'A trust boundary is a line between two places that trust each other differently. In a distributed system there are many small boundaries: between services, between a service and its database, between two clouds. Every API call crosses a boundary, so it needs authentication (who are you?) and authorization (what are you allowed to do?). The public-Internet boundary is the most dangerous, because anyone on the planet can reach it. A boundary is a concept, not a physical box.',
  hint:'A trust boundary is a concept, not hardware. Count how many statements describe a line between two places with different trust.',
  focus:'Think of trust boundaries as "lines you must not cross without a check".' },

{ id:'q24', theme:'at', type:'qcm', label:'Why foundations matter', points:4,
  prompt:'Why must a cybersecurity analyst understand foundational technologies — VMs, containers, APIs — and not only security tools?',
  choices:[
    {t:'Because those technologies define the trust boundaries and the attack surface, so the analyst can choose and place the right controls.', c:true},
    {t:'Because security tools can only be installed by the developers who wrote the application.', c:false},
    {t:'Because VMs, containers, and APIs are the only technologies that exist in modern companies.', c:false},
    {t:'Because the analyst must rewrite all application code by hand.', c:false}
  ],
  explanation:'Security tools are not magic. An analyst must understand how VMs, containers, and APIs work: what they share, what they expose, and where they trust each other. Only then can the analyst pick the right controls — network segmentation, access control, continuous monitoring — and put them in the right place.',
  hint:'Think about what the analyst must decide every day: which control, and where.',
  focus:'Foundation knowledge turns security tools into informed decisions.' },

/* ---------- Theme: API Security & Exposure ---------- */
{ id:'q6', theme:'api', type:'spot', label:'API gateway config review', points:4,
  prompt:'You review this API gateway configuration before it goes live. Click EVERY mistake you find.',
  code:`api_gateway:
  endpoint: /admin
  auth: none
  rate_limit: disabled
  log_level: info

security_group:
  ingress: 0.0.0.0/0 -> 443

response_body: 'return full user records with password_hash'`,
  checks:[
    {t:'The /admin endpoint has no authentication (auth: none).', c:true},
    {t:'The security group opens the API to the whole Internet (0.0.0.0/0).', c:true},
    {t:'The response returns password hashes — critical data — to the client.', c:true},
    {t:'The gateway uses port 443.', c:false},
    {t:'The gateway logs at info level.', c:false}
  ],
  explanation:'Three mistakes. (1) "auth: none" means anyone can use the admin API — access control is missing. (2) "0.0.0.0/0" means every computer on the Internet can reach it — the API is exposed to the whole world. (3) Sending password hashes back to clients exposes critical data; hashes can be cracked with modern hardware. Port 443 is good practice — it is encrypted HTTPS. Logging at info level is normal.',
  hint:'Look for three things: missing access control, network exposure, and dangerous data inside the response.',
  focus:'Practice API config reviews: check authentication, ingress rules, and sensitive data in responses.' },

{ id:'q9', theme:'api', type:'dual', label:'Dual view: exposed API', points:4,
  prompt:'<span class="scenario">Authorized penetration test. You find the public endpoint <b>/v2/users?role=admin</b>. It returns the full list of users with names and emails. No authentication is required. Answer both sides of the same problem.</span>',
  red:{ label:'🥷 Red team — you are the attacker',
    q:'What is the most useful NEXT step?',
    choices:[
      {t:'Change parameter values and enumerate other endpoints to map the API and pull more data (IDOR).', c:true},
      {t:'Delete the /v2/users endpoint so nobody else can find it.', c:false},
      {t:'Send the data to the national CERT as a courtesy.', c:false},
      {t:'Restart the API server to cause a denial of service.', c:false}
    ]},
  blue:{ label:'👮 Blue team — you are the defender',
    q:'Which TWO changes fix the root cause?',
    multi:true,
    choices:[
      {t:'Require authentication and check authorization on every API request.', c:true},
      {t:'Add rate limiting and anomaly monitoring to detect mass data pulls.', c:true},
      {t:'Rename the endpoint from /v2/users to /v2/people.', c:false},
      {t:'Put a warning banner on the login page.', c:false}
    ]},
  explanation:'Red team: the API does not check who is asking, and it trusts the values the client sends. Changing values to map other endpoints is IDOR (Insecure Direct Object Reference) — the attacker enumerates data the system forgot to protect. Blue team: authentication proves who you are, authorization checks what you are allowed to do — every API call needs both. Rate limiting slows mass collection, and monitoring detects unusual request volumes.',
  hint:'Red team: you want more data without being stopped. Blue team: fix who can ask, and watch how much they ask for.',
  focus:'Study IDOR and the difference between authentication (who) and authorization (allowed to do what).' },

{ id:'q10', theme:'api', type:'qcm', label:'Why APIs are dangerous', points:4,
  prompt:'Why is a public API often more dangerous than a public website, when it ends up exposing critical data and functions?',
  choices:[
    {t:'APIs expose machine-readable data and functions, so attacks can be automated at scale.', c:true},
    {t:'Websites use HTTPS, but APIs cannot use encryption at all.', c:false},
    {t:'APIs are always written in JavaScript, which is easier to hack.', c:false},
    {t:'Websites have no vulnerabilities; only APIs do.', c:false}
  ],
  explanation:'A website is built for humans with a browser. An API is built for programs, and it returns clean, machine-readable data such as JSON. An attacker can write a script that calls the API thousands of times per minute. Humans are slow; scripts are fast. That means one small API mistake can leak a huge amount of data very quickly.',
  hint:'Think about who uses the interface: people, or programs?',
  focus:'Understand the API attack surface: automation, enumeration, and mass data extraction.' },

{ id:'q11', theme:'api', type:'branch', label:'Branching: leaked API key', points:5,
  prompt:'<span class="scenario">Monday 09:00. A public code repository shows a leaked API key for your payment provider (leak page: hxxps://github[.]com/org/repo — defanged). The key has full permissions and was created 6 months ago. Work the incident step by step.</span>',
  steps:[
    { tag:'STEP 1 · First action', points:1.5,
      q:'What is the FIRST action you take?',
      choices:[
        {t:'Revoke (disable) the leaked key immediately.', c:true, fb:'Good. The key is a live door. You closed it first — the attacker can no longer use it.', next:'The key was closed fast. Now measure the damage.'},
        {t:'First check what data the key accessed, then revoke it.', c:false, fb:'While you investigate, the key is still live and the attacker keeps using it. Always close the door first, then investigate.', next:'Because the key stayed alive during your investigation, measuring the damage is now even more urgent.'},
        {t:'Set the repository to private and wait for the next leak scan.', c:false, fb:'The code is already copied by the attacker. Hiding the repo does nothing while the key still works.', next:'The key stayed alive. Every minute counts now.'},
        {t:'Email the attacker and ask them to delete the copy.', c:false, fb:'Attackers do not respond to polite requests. The only real fix is revoking the key.', next:'The key stayed alive. Every minute counts now.'}
      ]},
    { tag:'STEP 2 · Damage assessment', points:1.5,
      q:'After revoking, what do you check next?',
      choices:[
        {t:'Provider audit logs: what the key accessed between its creation and its revocation.', c:true, fb:'Correct. You must look at the whole lifetime of the key — it existed for 6 months, not just today.', next:''},
        {t:'Reboot all servers and hope the attacker left.', c:false, fb:'Rebooting does not tell you what was taken and does not stop the attacker from coming back.', next:''},
        {t:'Delete the repository and close the ticket.', c:false, fb:'Closing the ticket without measuring the damage leaves the business blind about what leaked.', next:''},
        {t:'Only check the logs from today, because older logs are gone.', c:false, fb:'Cloud audit logs often go back months. The key is 6 months old — check its entire history.', next:''}
      ]},
    { tag:'STEP 3 · Permanent fixes', points:2, multi:true,
      q:'Which TWO permanent fixes prevent this from happening again?',
      choices:[
        {t:'Store keys in a secret manager and give each service least-privilege access control.', c:true, fb:'A secret manager keeps keys out of source code, and least privilege limits what a stolen key can do.', next:''},
        {t:'Enable secret scanning on repositories and continuous monitoring for public leaks.', c:true, fb:'Scanning finds leaks fast, and monitoring alerts you the moment a key appears in public.', next:''},
        {t:'Put all keys in one shared text file that everyone on the team can read.', c:false, fb:'That makes the leak bigger, not smaller. Keys must live in a vault, not in files.', next:''},
        {t:'Stop using APIs entirely.', c:false, fb:'The business cannot run without APIs. The fix is to secure them, not remove them.', next:''}
      ]},
    { tag:'STEP 4 · Handover note', points:0, final:true,
      q:'Final note to the team (no points — it is the summary of your choices).' }
  ],
  explanation:'The playbook for a leaked credential: (1) revoke first — a live key is a live door; (2) measure damage with audit logs over the whole lifetime of the key, not just today; (3) fix the root cause — a secret manager removes keys from code, least-privilege access control limits what a stolen key can do, and secret scanning plus continuous monitoring catch leaks fast.',
  hint:'The key is still working right now. Close it before anything else. For the fixes, think about where keys should live and who should find leaks.',
  focus:'Study the leaked-credential playbook: revoke, scope the damage, rotate, harden, monitor.' },

/* ---------- Theme: Segmentation & Access Control ---------- */
{ id:'q12', theme:'seg', type:'fill', label:'Firewall rule builder', points:4,
  prompt:'Write the two-line firewall rule: allow ONLY the monitoring subnet to reach the database API, over encrypted HTTPS, and deny everything else.',
  template:`<div class="sentence">Line 1 — allow the traffic:<br>
  <code>permit tcp <span class="fblank" data-blank="0">______</span> <span class="fblank" data-blank="1">______</span> <span class="fblank" data-blank="2">______</span></code><br>
  Line 2 — default action:<br>
  <code><span class="fblank" data-blank="3">______</span></code></div>`,
  bank:['10[.]0[.]10[.]0/24','10[.]0[.]20[.]5','443','deny ip any any','80','22'],
  correct:{
    0:['10[.]0[.]10[.]0/24'],
    1:['10[.]0[.]20[.]5'],
    2:['443'],
    3:['deny ip any any']
  },
  explanation:'The monitoring subnet is 10[.]0[.]10[.]0/24 — it is the only source allowed. The database API host is 10[.]0[.]20[.]5. Port 443 is HTTPS (encrypted); port 80 is plain HTTP and must not be used here. The last line "deny ip any any" blocks everything else — this is a default-deny rule. This is network segmentation: you split the network into zones and allow only the traffic that is strictly needed.',
  hint:'Encrypted web traffic is port 443, not 80. The second line must block everything that line 1 does not allow.',
  focus:'Practice writing firewall rules: least-privilege source, destination, port — and always end with default-deny.' },

{ id:'q13', theme:'seg', type:'fill', label:'Policy drafting (GRC)', points:3,
  prompt:'You are a GRC analyst. Complete the three sentences of the new cloud security policy. Each word is used once; two words are distractors.',
  template:`<div class="sentence">1. "To stop attackers from moving freely between application tiers, we enforce <span class="fblank" data-blank="0">______</span> between all tiers."<br>
  2. "Every user and service must prove its identity and receive only the rights it needs — this is <span class="fblank" data-blank="1">______</span>."<br>
  3. "Because cloud settings change every day, we require <span class="fblank" data-blank="2">______</span> to detect drift and misconfiguration."</div>`,
  bank:['network segmentation','access control','continuous monitoring','encryption at rest','data loss prevention'],
  correct:{
    0:['network segmentation'],
    1:['access control'],
    2:['continuous monitoring']
  },
  explanation:'Network segmentation splits the network into zones, so an attacker cannot jump from one zone to another freely. Access control means proving identity (authentication) and limiting rights (least privilege). Continuous monitoring watches the settings all the time and alerts on changes — a monthly check is too slow for the cloud.',
  hint:'Match each sentence to its job: moving between systems, proving rights, detecting changes.',
  focus:'Memorize what each core control actually DOES, not just its name.' },

{ id:'q14', theme:'seg', type:'qcm', label:'East-west segmentation', points:4,
  prompt:'In a cloud-native environment, why is perimeter-only segmentation not enough?',
  choices:[
    {t:'Most traffic is east-west between workloads, so segmentation must also control traffic inside the environment.', c:true},
    {t:'Cloud-native environments have no perimeter at all, so segmentation is useless.', c:false},
    {t:'A perimeter is enough if you also buy one hardware firewall.', c:false},
    {t:'East-west traffic does not exist in cloud-native environments.', c:false}
  ],
  explanation:'North-south traffic goes in and out of your network — that is what a perimeter firewall sees. East-west traffic goes between your own servers inside the network. In cloud-native systems, most traffic is east-west: services constantly talk to each other. If you only guard the border, an attacker who gets in can move freely. Segmentation must also control internal traffic (this is why microsegmentation exists).',
  hint:'Which direction is internal traffic? And which direction does a perimeter firewall actually see?',
  focus:'Learn the difference between north-south and east-west traffic, and why microsegmentation exists.' },

{ id:'q15', theme:'seg', type:'drag', label:'Controls on layers', points:4,
  prompt:'Drag each control onto the architecture layer where it belongs best. Click a control, then click a zone (touch friendly).',
  tiles:[
    {t:'Rate limiting + OAuth tokens', target:'api'},
    {t:'Microsegmentation policies', target:'cnet'},
    {t:'Hypervisor patch management', target:'vmhost'},
    {t:'CSPM configuration checks', target:'multi'}
  ],
  zones:[
    {id:'api',  label:'API gateway'},
    {id:'cnet', label:'Container network'},
    {id:'vmhost', label:'VM host'},
    {id:'multi', label:'Multi-cloud estate'}
  ],
  explanation:'The API gateway is the front door: rate limiting stops mass requests and OAuth tokens prove identity — access control at the API. Containers talk to each other over an internal network, so microsegmentation controls that east-west traffic. The VM host runs the hypervisor; an unpatched hypervisor is a serious risk, so patch management belongs there. CSPM watches the configurations of all cloud providers from one place.',
  hint:'Think about what each layer is: the front door, the internal network, the host software, all providers together.',
  focus:'Map each control to the layer it actually protects.' },

{ id:'q21', theme:'seg', type:'spot', label:'Cloud config mistakes', points:4,
  prompt:'Click EVERY security mistake in this cloud configuration file.',
  code:`vm_web:
  rdp_exposed: 0.0.0.0/0

container_payment:
  privileged: true
  image: payment:3.2

api_config:
  api_key: "sk-live-EXAMPLE9f8a7b6c"   # stored in plaintext

monitoring:
  enabled: false`,
  checks:[
    {t:'RDP is open to the whole Internet (0.0.0.0/0).', c:true},
    {t:'The payment container runs privileged (near-root host access).', c:true},
    {t:'A live API key is stored in plaintext in the config file.', c:true},
    {t:'Monitoring is disabled, so nobody will notice any of this.', c:true},

/* ---------------- state ---------------- */
const state = {
  order: [], idx: 0, started:false, finished:false, paused:false,
  timeLeft:0, timerId:null,
  perQ: {}   // id -> {earned, max, correct, summaryHtml, answered:true}
};
const TIME_PER_Q = 80; // seconds — challenging difficulty
const PASS_PCT = 80;

function totalPoints(){ return QUESTIONS.reduce((s,q)=>s+q.points,0); }

/* ---------------- choice rendering ---------------- */
function renderChoiceGroup(q, body, name, multi){
  const opts = shuffle(q.choices.map((c,i)=>({t:c.t, c:c.c, orig:i})));
  const wrap = document.createElement('div');
  wrap.className = 'choices';
  opts.forEach((o,i)=>{
    const lab = document.createElement('label');
    lab.className = 'option';
    lab.innerHTML = '<input type="'+(multi?'checkbox':'radio')+'" name="'+name+'" value="'+o.orig+'">'+
      '<span class="optletter">'+String.fromCharCode(65+i)+'.</span><span>'+esc(o.t)+'</span><span class="tick"></span>';
    wrap.appendChild(lab);
  });
  body.appendChild(wrap);
  return {
    opts,
    read(){ return opts.filter(o=>{
      const inp = body.querySelector('input[name="'+name+'"][value="'+o.orig+'"]');
      return inp && inp.checked;
    }); }
  };
}
function correctSetOf(choices){
  const s = new Set();
  choices.forEach((c,i)=>{ if(c.c) s.add(i); });
  return s;
}
function markChoices(body, name, correctSet){
  $$('input[name="'+name+'"]', body).forEach(inp=>{
    const o = inp.closest('.option');
    const orig = +inp.value;
    if(correctSet.has(orig)){ o.classList.add('good'); }
    else if(inp.checked){ o.classList.add('bad'); }
  });
}
function multiEarn(selected, correctCount, points){
  const c = selected.filter(o=>o.c).length;
  const w = selected.filter(o=>!o.c).length;
  return Math.max(0, c - w) / Math.max(1,correctCount) * points;
}

/* ---------------- builders ---------------- */
function buildQcm(q, body){
  const g = renderChoiceGroup(q, body, 'g', false);
  return {
    grade(){
      const sel = g.read();
      if(sel.length===0) return null;
      const good = sel[0].c;
      const summary = good ? 'Your answer was correct.' :
        'Your answer: <b>'+esc(sel[0].t)+'</b><br>Correct answer: <b>'+esc(q.choices.find(c=>c.c).t)+'</b>';
      return {earned: good? q.points:0, allCorrect: good, summaryHtml: summary, mark(){ markChoices(body,'g', correctSetOf(q.choices)); }};
    }
  };
}
function buildMulti(q, body){
  const g = renderChoiceGroup(q, body, 'g', true);
  const correctCount = q.choices.filter(c=>c.c).length;
  return {
    grade(){
      const sel = g.read();
      if(sel.length===0) return null;
      const earned = round2(multiEarn(sel, correctCount, q.points));
      const allCorrect = earned >= q.points;
      const correctTexts = q.choices.filter(c=>c.c).map(c=>'<i>'+esc(c.t)+'</i>').join('<br>');
      const summary = '<b>You selected:</b><br>'+(sel.length? sel.map(o=>esc(o.t)).join('<br>'):'<i>nothing</i>')+
        '<br><b>Correct choices:</b><br>'+correctTexts;
      return {earned, allCorrect, summaryHtml: summary, mark(){ markChoices(body,'g', correctSetOf(q.choices)); }};
    }
  };
}
function buildFill(q, body){
  body.innerHTML = q.template;
  const bankEl = document.createElement('div');
  bankEl.className = 'wordbank';
  body.appendChild(bankEl);
  const placed = {};
  let selectedWord = null;
  let bank = shuffle(q.bank.slice());
  function renderBank(){
    bankEl.innerHTML = '';
    bank.forEach(w=>{
      const b = document.createElement('button');
      b.type='button'; b.className='wchip'; b.textContent = w;
      b.onclick = ()=>{ selectedWord = w;
        $$('.wchip', bankEl).forEach(x=>x.classList.toggle('sel', x===b)); };
      bankEl.appendChild(b);
    });
  }
  function renderBlanks(){
    $$('.fblank', body).forEach(sp=>{
      const k = sp.dataset.blank;
      sp.textContent = placed[k] || '______';
      sp.classList.toggle('filled', !!placed[k]);
    });
  }
  $$('.fblank', body).forEach(sp=>{
    sp.onclick = ()=>{
      const k = sp.dataset.blank;
      if(placed[k]){ bank.push(placed[k]); delete placed[k]; renderBank(); renderBlanks(); }
      else if(selectedWord){
        placed[k] = selectedWord;
        bank = bank.filter(w=>w!==selectedWord);
        selectedWord = null;
        renderBank(); renderBlanks();
      }
    };
  });
  renderBank(); renderBlanks();
  return {
    grade(){
      let earned = 0; let okCount = 0;
      const per = q.points / Object.keys(q.correct).length;
      Object.keys(q.correct).forEach(k=>{
        const v = placed[k];
        const ok = v && q.correct[k].map(norm).includes(norm(v));
        if(ok){ earned += per; okCount++; }
      });
      earned = round2(earned);
      const summary = '<b>You placed:</b> '+Object.keys(q.correct).map(k=>{
        const v = placed[k];
        const ok = v && q.correct[k].map(norm).includes(norm(v));
        return (ok?'✓':'✗')+' blank '+(+k+1)+': <b>'+(v? esc(v):'empty')+'</b>';
      }).join(' · ')+'<br><b>Correct:</b> '+Object.keys(q.correct).map(k=>'blank '+(+k+1)+' → <b>'+esc(q.correct[k][0])+'</b>').join(', ');
      return {earned, allCorrect: okCount===Object.keys(q.correct).length, summaryHtml: summary};
    }
  };
}
function buildMatch(q, body){
  body.innerHTML = '<div class="matchcols"><div><div class="mcol-title">Items</div><div class="mleft"></div></div>'+
    '<div><div class="mcol-title">Definitions</div><div class="mright"></div></div></div>';
  const leftEl = $('.mleft', body), rightEl = $('.mright', body);
  const rightOrder = shuffle(q.right.map((t,i)=>({t, orig:i})));
  const errors = {}; // per left orig
  const done = {};   // left orig -> right orig
  let selLeft = null;
  rightOrder.forEach(r=>{
    const d = document.createElement('div');
    d.className = 'm-item'; d.dataset.r = r.orig; d.textContent = r.t;
    d.onclick = ()=>{
      if(d.classList.contains('matched')) return;
      if(selLeft===null) return;
      const li = +selLeft.dataset.l;
      const pair = q.pairs.find(p=>p[0]===li);
      if(pair && pair[1]===r.orig){
        done[li] = r.orig;
        selLeft.classList.add('matched'); selLeft.textContent = selLeft.textContent + ' ✓';
        d.classList.add('matched');
        selLeft.classList.remove('sel'); selLeft = null;
      } else {
        errors[li] = (errors[li]||0)+1;
        d.classList.add('burned');
        setTimeout(()=>d.classList.remove('burned'), 500);
        selLeft.classList.remove('sel');
        selLeft = null;
      }
    };
    rightEl.appendChild(d);
  });
  q.left.forEach((t,i)=>{
    const d = document.createElement('div');
    d.className = 'm-item'; d.dataset.l = i; d.textContent = t;
    d.onclick = ()=>{
      if(d.classList.contains('matched')) return;
      $$('.m-item', leftEl).forEach(x=>x.classList.remove('sel'));
      selLeft = d; d.classList.add('sel');
    };
    leftEl.appendChild(d);
  });
  return {
    grade(){
      const per = q.points / q.left.length;
      let earned = 0;
      q.left.forEach((t,i)=>{
        if(done[i]!==undefined) earned += Math.max(0, 1 - 0.5*(errors[i]||0)) * per;
      });
      earned = round2(earned);
      const summary = '<b>Your matches:</b><br>'+q.left.map((t,i)=>{
        const ok = done[i]!==undefined;
        return (ok?'✓':'✗')+' '+esc(t)+' → '+(ok? esc(q.right[done[i]]) : '<i>not matched</i>');
      }).join('<br>');
      return {earned, allCorrect: earned>=q.points, summaryHtml: summary};
    }
  };
}
function buildOrderLike(q, body, rank){
  body.innerHTML = '<div class="ordlist"></div><div class="drag-hint">Drag with the handle ⠿ or use the ▲▼ buttons. '+
    (rank? 'Position 1 = most severe.':'Position 1 = first action.')+'</div>';
  const list = $('.ordlist', body);
  let items = shuffle(q.items.map((t,i)=>({t, orig:i})));
  function render(){
    list.innerHTML='';
    items.forEach((it,idx)=>{
      const d = document.createElement('div');
      d.className = 'ord-item'; d.draggable = true; d.dataset.idx = idx;
      d.innerHTML = '<span class="grip">⠿</span><span class="ordpos">'+(idx+1)+'</span>'+
        '<span class="ordtext">'+esc(it.t)+'</span>'+
        '<span class="ord-btns"><button data-mv="up" title="Move up">▲</button><button data-mv="down" title="Move down">▼</button></span>';
      d.addEventListener('dragstart', e=>{ d.classList.add('dragging'); e.dataTransfer.setData('text/plain', String(idx)); e.dataTransfer.effectAllowed='move'; });
      d.addEventListener('dragend', ()=>{ d.classList.remove('dragging'); });
      d.addEventListener('dragover', e=>{ e.preventDefault(); d.classList.add('over'); });
      d.addEventListener('dragleave', ()=>d.classList.remove('over'));
      d.addEventListener('drop', e=>{
        e.preventDefault(); d.classList.remove('over');
        const from = +e.dataTransfer.getData('text/plain');
        const to = +d.dataset.idx;
        if(from!==to && !isNaN(from)){
          const mv = items.splice(from,1)[0];
          items.splice(to,0,mv);
          render();
        }
      });
      list.appendChild(d);
    });
  }
  list.addEventListener('click', e=>{
    const btn = e.target.closest('button[data-mv]');
    if(!btn) return;
    const item = btn.closest('.ord-item');
    const idx = +item.dataset.idx;
    const mv = btn.dataset.mv;
    const j = mv==='up'? idx-1 : idx+1;
    if(j<0 || j>=items.length) return;
    [items[idx], items[j]] = [items[j], items[idx]];
    render();
  });
  render();
  return {
    grade(){
      let correct = 0;
      items.forEach((it,i)=>{ if(it.orig===i) correct++; });
      const earned = round2(q.points * correct / q.items.length);
      const summary = '<b>Your order:</b><br>'+items.map((it,i)=>(i+1)+'. '+esc(it.t)).join('<br>')+
        '<br><b>Correct order:</b><br>'+q.items.map((t,i)=>(i+1)+'. '+esc(t)).join('<br>');
      return {earned, allCorrect: correct===q.items.length, summaryHtml: summary};
    }
  };
}
function buildDragTargets(q, body){
  body.innerHTML = '<div class="tilepool"></div><div class="zonepool"></div>'+
    '<div class="drag-hint">Click a control to select it, then click a zone. Mouse users can also drag &amp; drop.</div>';
  const pool = $('.tilepool', body), zones = $('.zonepool', body);
  const tiles = shuffle(q.tiles.slice());
  const zoneOrder = shuffle(q.zones.slice());
  const errors = {}; const placed = {};
  let selTile = null;
  zoneOrder.forEach(z=>{
    const d = document.createElement('div');
    d.className = 'zone'; d.dataset.z = z.id; d.textContent = z.label;
    d.addEventListener('dragover', e=>{ e.preventDefault(); d.classList.add('over'); });
    d.addEventListener('dragleave', ()=>d.classList.remove('over'));
    d.addEventListener('drop', e=>{
      e.preventDefault(); d.classList.remove('over');
      const ti = +e.dataTransfer.getData('text/plain');
      attempt(ti, z.id, d);
    });
    d.onclick = ()=>{ if(selTile) attempt(+selTile.dataset.t, z.id, d); };
    zones.appendChild(d);
  });
  function attempt(ti, zid, zoneEl){
    const t = q.tiles[ti];
    const d = pool.querySelector('.tile[data-t="'+ti+'"]');
    if(placed[ti]) return;
    if(t.target===zid){
      placed[ti] = true;
      zoneEl.classList.add('filled');
      zoneEl.textContent = '✓ ' + t.t;
      d.classList.add('placed');
      selTile = null;
    } else {
      errors[ti] = (errors[ti]||0)+1;
      zoneEl.classList.add('shake'); setTimeout(()=>zoneEl.classList.remove('shake'), 450);
      if(d){ d.classList.add('shake'); setTimeout(()=>d.classList.remove('shake'), 450); }
      selTile = null;
    }
  }
  tiles.forEach((t,i)=>{
    const d = document.createElement('div');
    d.className = 'tile'; d.draggable = true; d.dataset.t = i; d.textContent = t.t;
    d.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', String(i)); e.dataTransfer.effectAllowed='move'; });
    d.onclick = ()=>{ if(!placed[i]){ $$('.tile', pool).forEach(x=>x.classList.remove('sel')); selTile = d; d.classList.add('sel'); } };
    pool.appendChild(d);
  });
  return {
    grade(){
      const per = q.points / q.tiles.length;
      let earned = 0;
      q.tiles.forEach((t,i)=>{
        if(placed[i]) earned += Math.max(0, 1 - 0.5*(errors[i]||0)) * per;
      });
      earned = round2(earned);
      const summary = '<b>Your placements:</b><br>'+q.tiles.map((t,i)=>{
        return (placed[i]? '✓':'✗')+' '+esc(t.t)+' → '+esc(q.zones.find(z=>z.id===t.target).label);
      }).join('<br>');
      return {earned, allCorrect: earned>=q.points, summaryHtml: summary};
    }
  };
}
function buildTerminal(q, body){
  body.innerHTML = '<div class="terminal"><div class="term-title">SSH — prod-cn-04 (analyst)</div>'+
    '<div class="term-out"></div><div class="term-in"><span class="term-prompt"></span><input autocomplete="off" spellcheck="false"></div></div>';
  const out = $('.term-out', body), inp = $('.term-in input', body), prompt = $('.term-prompt', body);
  let stepIdx = 0, wrongs = [];
  q.steps.forEach(()=>wrongs.push(0));
  function print(cls, html){ const d = document.createElement('div'); d.className = cls||''; d.innerHTML = html; out.appendChild(d); out.scrollTop = out.scrollHeight; }
  function setPrompt(){ prompt.textContent = q.steps[Math.min(stepIdx, q.steps.length-1)].promptLine; }
  function run(){
    const raw = inp.value; inp.value='';
    if(!raw.trim()) return;
    print('cmdline', esc((q.steps[Math.min(stepIdx, q.steps.length-1)].promptLine||'$ ')+' '+raw));
    const s = norm(raw);
    if(s==='help'){ print('sys', esc(q.helpText)); return; }
    if(s==='clear'){ out.innerHTML=''; return; }
    if(stepIdx >= q.steps.length){ print('sys','All commands completed. Scroll up to review your session.'); return; }
    const st = q.steps[stepIdx];
    if(st.accept(s)){
      print('goodline','✓ '+esc(st.success));
      stepIdx++;
      if(stepIdx < q.steps.length){ setPrompt(); }
      else { print('sys','— session complete —'); prompt.textContent=''; }
    } else {
      wrongs[stepIdx]++;
      print('badline','✗ '+esc(st.failMsg||'Command not recognized.'));
    }
  }
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') run(); });
  body.addEventListener('click', e=>{ if(!e.target.closest('.term-in')) inp.focus(); });
  print('sys', esc(q.intro));
  setPrompt();
  inp.focus();
  return {
    grade(){
      let earned = 0;
      q.steps.forEach((st,i)=>{ if(i < stepIdx) earned += (wrongs[i]===0? 2 : 1); });
      const summary = '<b>Session result:</b><br>'+q.steps.map((st,i)=>{
        if(i < stepIdx) return (wrongs[i]===0? '✓':'⚠')+' Step '+(i+1)+' solved ('+(wrongs[i]===0? '2':'1 (after retries)')+' pts)';
        return '✗ Step '+(i+1)+' not completed (0 pts)';
      }).join('<br>');
      return {earned: round2(earned), allCorrect: stepIdx===q.steps.length && wrongs.every(w=>w===0), summaryHtml: summary, lock(){ inp.disabled = true; }};
    }
  };
}
function buildLog(q, body){
  body.innerHTML = '<div class="logview"><div class="log-toolbar">'+
    '<label>🔎 Filter:</label><input class="logfilter" placeholder="e.g. 401" spellcheck="false">'+

  return {

      if(!filter.value.trim().toLowerCase().includes(q.gate)) return {blocked:true, msg:'Use the filter box first — isolate the failed requests by status code to unlock the analysis.'};
      const sel = g.read();

        'Your answer: <b>'+esc(sel[0].t)+'</b><br>Correct answer: <b>'+esc(q.qcm.choices.find(c=>c.c).t)+'</b>';
      return {earned: good? q.points:0, allCorrect: good, summaryHtml: summary, mark(){ markChoices(ansWrap,'g', correctSetOf(q.qcm.choices)); }};
    }
  };
}
function buildBranch(q, body){
  const stepEls = [];
  const stepStates = []; // {earned, done, summary}
  q.steps.forEach(st=>{ stepEls.push(null); stepStates.push({earned:0, done:false, summary:''}); });
  function makeStep(i){
    const st = q.steps[i];
    const wrap = document.createElement('div');
    wrap.className = 'branch-step';
    wrap.innerHTML = '<div class="bstep-tag">'+(st.tag||('STEP '+(i+1)))+'</div>'+
      '<div class="q-prompt" style="margin-top:8px;">'+st.q+'</div>';
    if(st.final){
      wrap.innerHTML += '<div style="border-left:3px solid #22d3ee;padding-left:10px;color:#22d3ee;font-size:13.5px;margin-top:10px;">Case closed. Review your step results below, then press Submit answer.</div>';
      stepStates[i].done = true;
      return wrap;
    }
    const g = renderChoiceGroup(st, wrap, 'g'+i, !!st.multi);
    const fb = document.createElement('div');
    fb.className = 'step-fb'; fb.style.display='none';
    wrap.appendChild(fb);
    const btn = document.createElement('button');
    btn.type='button'; btn.className='btn'; btn.style.marginTop='12px';
    btn.textContent = 'Confirm step';
    btn.onclick = ()=>{
      const sel = g.read();
      if(sel.length===0){ wrap.classList.add('shake'); setTimeout(()=>wrap.classList.remove('shake'),450); return; }
      const correctCount = st.choices.filter(c=>c.c).length;
      const earned = st.multi? round2(multiEarn(sel, correctCount, st.points)) : (sel[0].c? st.points : 0);
      stepStates[i] = {earned, done:true, summary: sel.map(o=>(o.c?'✓':'✗')+' '+esc(o.t)).join(' · ')};
      const ok = earned >= st.points;
      const fbText = st.multi? sel.map(o=>o.fb).filter(Boolean).join(' ') : (sel[0].fb || '');
      fb.style.display='block';
      fb.className = 'step-fb '+(ok? 'ok':'bad');
      fb.innerHTML = '<b>'+(ok? 'Correct':'Not correct')+'</b> — '+esc(fbText || (ok? 'Good.':''))+
        (st.next? '<div class="ctx-note">➡ '+esc(st.next)+'</div>':'');
      markChoices(wrap, 'g'+i, correctSetOf(st.choices));
      btn.disabled = true; btn.textContent = 'Locked ✓';
      unlockNext();
    };
    wrap.appendChild(btn);
    return wrap;
  }
  function unlockNext(){
    const nx = stepStates.findIndex(s=>!s.done);
    if(nx===-1) return;
    const ph = stepEls[nx];
    if(ph && ph.parentNode){
      const real = makeStep(nx);
      ph.replaceWith(real);
      stepEls[nx] = real;
    }
  }
  q.steps.forEach((st,i)=>{
    if(i===0){ stepEls[0] = makeStep(0); body.appendChild(stepEls[0]); }
    else {
      const wrap = document.createElement('div');
      wrap.className = 'branch-step locked';
      wrap.innerHTML = '<div class="bstep-tag">'+(st.tag||('STEP '+(i+1)))+'</div>'+
        '<div style="color:var(--muted);font-size:13.5px;margin-top:8px;">🔒 Complete the previous step to unlock.</div>';
      body.appendChild(wrap);
      stepEls[i] = wrap;
    }
  });
  return {
    grade(){
      const openIdx = stepStates.findIndex(s=>!s.done);
      if(openIdx!==-1){ return {blocked:true, msg:'Complete every step (each has its own Confirm button) before submitting.'}; }
      const earned = round2(stepStates.reduce((s,x)=>s+x.earned, 0));
      const summary = '<b>Step results:</b><br>'+stepStates.map((s,i)=>s.summary? (s.earned>= (q.steps[i].points||0)? '✓':'✗')+' '+s.summary : '').join('<br>');
      return {earned, allCorrect: earned>=q.points, summaryHtml: summary};
    }
  };
}
function buildSpot(q, body){
  const pre = document.createElement('pre');
  pre.className = 'code';
  pre.textContent = q.code;
  body.appendChild(pre);
  const g = renderChoiceGroup({choices: q.checks}, body, 'g', true);
  const correctCount = q.checks.filter(c=>c.c).length;
  return {
    grade(){
      const sel = g.read();
      if(sel.length===0) return null;
      const earned = round2(multiEarn(sel, correctCount, q.points));
      const allCorrect = earned >= q.points;
      const correctTexts = q.checks.filter(c=>c.c).map(c=>'<i>'+esc(c.t)+'</i>').join('<br>');
      const summary = '<b>You flagged:</b><br>'+(sel.length? sel.map(o=>esc(o.t)).join('<br>'):'<i>nothing</i>')+
        '<br><b>Real mistakes:</b><br>'+correctTexts;
      return {earned, allCorrect, summaryHtml: summary, mark(){ markChoices(body,'g', correctSetOf(q.checks)); }};
    }
  };
}
function buildDual(q, body){
  const redWrap = document.createElement('div');
  redWrap.innerHTML = '<div class="mcol-title" style="color:var(--pink);">'+q.red.label+'</div><div style="font-size:14px;margin-bottom:4px;">'+q.red.q+'</div>';
  body.appendChild(redWrap);
  const redG = renderChoiceGroup(q.red, redWrap, 'gr', false);
  const blueWrap = document.createElement('div');
  blueWrap.style.marginTop = '18px';
  blueWrap.innerHTML = '<div class="mcol-title" style="color:var(--cyan);">'+q.blue.label+'</div><div style="font-size:14px;margin-bottom:4px;">'+q.blue.q+'</div>';
  body.appendChild(blueWrap);
  const blueG = renderChoiceGroup(q.blue, blueWrap, 'gb', true);
  const blueCorrect = q.blue.choices.filter(c=>c.c).length;
  return {
    grade(){
      const rs = redG.read(), bs = blueG.read();
      if(rs.length===0 || bs.length===0) return null;
      const rEarn = rs[0].c? 2:0;
      const bEarn = round2(multiEarn(bs, blueCorrect, 2));
      const earned = round2(rEarn + bEarn);
      const summary = '<b>Red team:</b> '+(rs[0].c?'✓ correct':'✗ wrong — correct: '+esc(q.red.choices.find(c=>c.c).t))+
        '<br><b>Blue team:</b> '+(bEarn>=2?'✓ correct':('partial/wrong — correct: '+q.blue.choices.filter(c=>c.c).map(c=>esc(c.t)).join(' + ')));
      return {earned, allCorrect: earned>=q.points, summaryHtml: summary,
        mark(){ markChoices(redWrap,'gr', correctSetOf(q.red.choices)); markChoices(blueWrap,'gb', correctSetOf(q.blue.choices)); }};
    }
  };
}
function buildTriage(q, body){
  const cards = document.createElement('div');
  cards.className = 'alertcards';
  shuffle(q.alerts.slice()).forEach(a=>{
    const lab = document.createElement('label');
    lab.className = 'alertcard';

      '<span class="sev '+a.cls+'">'+a.sev+'</span><div><div class="alertid">'+esc(a.id)+'</div><div style="font-size:13.5px;">'+esc(a.text)+'</div></div>';
    cards.appendChild(lab);

  body.appendChild(cards);

  rw.innerHTML = '<div class="q-prompt">'+q.reason.q+'</div>';

    grade(){

      const rsel = g.read();
      if(!cardSel || rsel.length===0) return null;
      const cOk = cardSel.value===q.correctAlert;

      const earned = (cOk?2:0) + (rOk?2:0);
      const summary = '<b>First alert chosen:</b> '+(cOk? '✓':'✗')+' '+esc(cardSel.value)+
        (cOk? '':' (correct: '+q.correctAlert+')')+
        '<br><b>Reasoning:</b> '+(rOk?'✓ correct':'✗ wrong — correct: '+esc(q.reason.choices.find(c=>c.c).t));
      return {earned, allCorrect: earned>=q.points, summaryHtml: summary,
        mark(){
          $$('input[name="triage"]', body).forEach(inp=>{
            const card = inp.closest('.alertcard');
            if(inp.checked) card.style.borderColor = inp.value===q.correctAlert? 'var(--ok)':'var(--err)';
            else if(inp.value===q.correctAlert) card.style.borderColor = 'var(--ok)';
          });
          markChoices(rw,'gr', correctSetOf(q.reason.choices));
        }};
    }
  };
}

function startExam(){
  state.order = shuffle(QUESTIONS.map(q=>q.id));
  state.idx = 0;
  state.perQ = {};
  state.started = true; state.finished = false; state.paused = false;
  state.timeLeft = TIME_PER_Q * QUESTIONS.length;
  $('#pauseOverlay').classList.add('hidden');
  clearInterval(state.timerId);
  state.timerId = setInterval(tick, 1000);
  updateTopbar();
  renderQuestion();
}

function tick(){
  if(state.paused || state.finished) return;
  state.timeLeft--;
  if(state.timeLeft <= 0){
    state.timeLeft = 0;
    clearInterval(state.timerId);
    finishExam(true);
    return;
  }
  const tb = $('#timerBox');
  tb.textContent = '⏱ ' + fmtTime(state.timeLeft);
  tb.classList.toggle('low', state.timeLeft <= 300);
}

function togglePause(){
  if(!state.started || state.finished) return;
  state.paused = !state.paused;
  $('#pauseOverlay').classList.toggle('hidden', !state.paused);
  updateTopbar();
}

function currentQ(){ return QUESTIONS.find(q=>q.id===state.order[state.idx]); }

function submitCurrent(){
  const q = currentQ();
  const res = currentBuilder.grade();
  if(res && res.blocked){
    const fb = $('#feedback');
    fb.classList.remove('hidden','ok','part','bad');
    fb.innerHTML = '<div class="msg-amber">⚠ '+(res.msg||'Finish the required interaction first.')+'</div>';
    fb.scrollIntoView({behavior:'smooth', block:'nearest'});
    return;
  }
  if(!res){
    const fb = $('#feedback');
    fb.classList.remove('hidden','ok','part','bad');
    fb.innerHTML = '<div class="msg-amber">⚠ Select an answer (or complete the interaction) before submitting.</div>';
    fb.scrollIntoView({behavior:'smooth', block:'nearest'});
    return;
  }
  let earned = res.earned;
  const hintUsed = !!(state.perQ[q.id] && state.perQ[q.id].hintUsed);
  if(hintUsed){ earned = Math.max(0, round2(earned - hintCost(q))); }
  earned = round2(Math.min(earned, q.points));
  const full = res.allCorrect;
  const st = {
    answered:true,
    earned,
    max:q.points,
    correct: res.earned >= q.points,
    summaryHtml: res.summaryHtml,
    hintUsed
  };
  state.perQ[q.id] = st;
  if(res.mark) res.mark();
  if(res.lock) res.lock();
  const card = $('#qBody').parentElement;
  card.classList.add('submitted');
  $('#submitBtn').disabled = true;
  const fb = $('#feedback');
  fb.classList.remove('hidden');
  const cls = full? 'ok' : (earned>0? 'part':'bad');
  fb.classList.add(cls);
  const hintNote = hintUsed? ' <span class="hinttag">(hint −'+round2(hintCost(q))+' pts)</span>' : '';
  const head = full? '✔ Correct! +'+earned+' / '+q.points+' pts'+hintNote
    : (earned>0? '◐ Partial credit: +'+earned+' / '+q.points+' pts'+hintNote
    : '✘ Incorrect — 0 / '+q.points+' pts'+hintNote);
  fb.innerHTML =
    '<div class="fb-head">'+head+'</div>'+
    '<div class="fb-exp">'+q.explanation+'</div>'+
    (!full? '<div class="fb-focus">🎯 What to focus on: '+q.focus+'</div>':'');
  renderStrip(card);
  $('#nextBtn').classList.remove('hidden');
  $('#nextBtn').textContent = state.idx === state.order.length-1? 'Finish exam 🏁':'Next ▶';
  updateTopbar();
  fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function renderSummary(id, showNext){
  const q = QUESTIONS.find(x=>x.id===id);
  const st = state.perQ[id];
  const t = themeById(q.theme);
  const card = document.createElement('div');
  card.className = 'card q-card';
  const cls = st? (st.correct? 'ok':(st.earned>0? 'part':'bad')) : 'na';
  const actions =
    (showNext? '' : '<button class="btn primary" id="backBtn">← Back to current question</button>')+
    (showNext? '<button class="btn" id="sumNextBtn">'+(state.idx === state.order.length-1? 'Finish exam 🏁':'Next ▶')+'</button>' : '');
  card.innerHTML =
    '<div class="q-meta">'+
      '<span class="q-num">Q'+(state.order.indexOf(id)+1)+' / '+QUESTIONS.length+'</span>'+
      '<span class="chip" style="color:'+t.color+';border-color:'+t.color+'44;">'+t.name+'</span>'+
      '<span class="pts">'+q.points+' pts</span>'+
    '</div>'+
    '<div class="q-prompt">'+q.label+'</div>'+
    '<div class="ri-pts">'+(st? 'Earned '+st.earned+' / '+q.points+' pts' : 'Not answered — 0 pts')+'</div>'+
    (st? '<div class="ri-summary">'+st.summaryHtml+'</div>' : '<div class="ri-summary"><i>You did not answer this question.</i></div>')+
    '<div class="ri-exp">💡 '+q.explanation+'</div>'+
    (!st || !st.correct ? '<div class="ri-focus">🎯 Focus: '+q.focus+'</div>' : '')+
    '<div class="q-actions">'+actions+'</div>';
  main.innerHTML = '';
  main.appendChild(card);
  if(showNext){
    $('#sumNextBtn').onclick = ()=>{
      if(state.idx < state.order.length-1){ state.idx++; renderQuestion(); }
      else finishExam(false);
    };
  } else {
    $('#backBtn').onclick = ()=>renderCurrent();
  }
}

function finishExam(timeUp){
  state.finished = true;
  clearInterval(state.timerId);
  updateTopbar();
  const total = totalPoints();
  let earned = 0;
  state.order.forEach(id=>{
    const s = state.perQ[id];
    if(s && s.answered) earned += s.earned;
  });
  earned = round2(earned);
  const pct = Math.round(earned/total*1000)/10;
  const passed = pct >= PASS_PCT;
  const examId = 'CNSF-101-'+Math.floor(1000+Math.random()*9000);
  const today = new Date().toISOString().slice(0,10);
  let cert = '';
  if(passed){
    cert =
    '<div class="cert">'+
      '<div class="ribbon">PASSED · '+PASS_PCT+'% THRESHOLD MET</div>'+
      '<div class="seal">✓</div>'+
      '<h2>Certificate of Achievement</h2>'+
      '<div class="certsub">CNSF-101 · Cloud-Native Security Foundations</div>'+
      '<div class="certline">This certifies that</div>'+
      '<input id="certName" value="Your Name" maxlength="60">'+
      '<div class="certline">demonstrated mastery of cloud-native architecture, virtualization, API security, segmentation, and continuous monitoring by passing this certification exam.</div>'+
      '<div class="cert-grid">'+
        '<div class="g">Score<b>'+pct+'% ('+earned+'/'+total+' pts)</b></div>'+
        '<div class="g">Date<b>'+today+'</b></div>'+
        '<div class="g">Exam ID<b>'+examId+'</b></div>'+
      '</div>'+
    '</div>';
  }
  let report = '';
  state.order.forEach((id,i)=>{
    const q = QUESTIONS.find(x=>x.id===id);
    const s = state.perQ[id];
    const t = themeById(q.theme);
    const cls = s? (s.correct? 'ok':(s.earned>0? 'part':'bad')) : 'na';
    const icon = s? (s.correct? '✅':(s.earned>0? '⚠️':'❌')) : '⏭';
    report +=
    '<div class="report-item '+cls+'">'+
      '<div class="ri-icon">'+icon+'</div>'+
      '<div style="flex:1;">'+
        '<div class="ri-head"><span class="ri-title">Q'+(i+1)+' — '+q.label+'</span>'+
        '<span class="chip" style="color:'+t.color+';border-color:'+t.color+'44;font-size:11px;">'+t.name+'</span>'+
        '<span class="ri-pts">'+(s? s.earned+' / '+q.points+' pts' : '0 / '+q.points+' pts · not answered')+'</span></div>'+
        (s? '<div class="ri-summary">'+s.summaryHtml+'</div>' : '<div class="ri-summary"><i>No answer submitted.</i></div>')+
        '<div class="ri-exp">💡 '+q.explanation+'</div>'+
        (!s || !s.correct ? '<div class="ri-focus">🎯 What to focus on: '+q.focus+'</div>' : '')+
      '</div>'+
    '</div>';
  });
  const hintsUsed = Object.values(state.perQ).filter(s=>s.hintUsed).length;
  main.innerHTML =
  '<div class="card q-card"><div class="result-hero">'+
    '<div class="bigpct" style="color:'+(passed? 'var(--ok)':'var(--err)')+';">'+pct+'%</div>'+
    '<div class="verdict '+(passed?'pass':'fail')+'">'+(passed? '✔ PASS':'✘ FAIL — retake required')+'</div>'+
    '<div style="color:var(--muted);margin-top:10px;">'+
      (timeUp? '<span style="color:var(--warn);">⏱ Time expired — unanswered questions count as 0.</span><br>':'')+
      'Final score: <b>'+earned+' / '+total+' pts</b> · Passing score: '+PASS_PCT+'% (≥ '+Math.ceil(total*PASS_PCT/100)+' pts) · Hints used: '+hintsUsed+'</div>'+
    '</div>'+
    cert+
    '<div style="margin-top:26px;"><h3 style="font-size:15px;letter-spacing:1px;">📋 Detailed report — every question, explained</h3></div>'+
    report+
    '<div class="startwrap">'+
      '<button class="btn primary" id="retakeBtn">🔄 Retake exam (reshuffles everything)</button>'+
    '</div></div>';
  $('#retakeBtn').onclick = ()=>{
    clearInterval(state.timerId);
    state.perQ = {};
    state.finished = false;
    state.paused = false;
    state.timeLeft = TIME_PER_Q * QUESTIONS.length;
    $('#pauseOverlay').classList.add('hidden');
    renderIntro();
    updateTopbar();
  };
}

/* ---------------- init ---------------- */
$('#pauseBtn').onclick = togglePause;
$('#resumeBtn').onclick = togglePause;
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && state.started && !state.finished){ togglePause(); }
});
updateTopbar();
renderIntro();
</script>
</body>
</html>
