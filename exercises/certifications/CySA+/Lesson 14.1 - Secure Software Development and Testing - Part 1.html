  byId('actions').innerHTML='<button class="btn primary" onclick="nextQuestion()">'+(last?'Finish exam and see results':'Next question')+'</button>';
  if(byId('qhost')){byId('qhost').scrollIntoView({behavior:'smooth',block:'start'});}
  updateDash();
}

function correctText(q){
  if(q.type==='mcq'){
    return q.options.filter(function(o){return q.correct.indexOf(o.id)>=0;}).map(function(o){return esc(o.t);}).join(' &nbsp;+&nbsp; ');
  }
  if(q.type==='order'||q.type==='rank'){
    return '<div class="mono small">'+q.items.map(function(i,k){return (k+1)+'. '+esc(i.t);}).join('<br>')+'</div>';
  }
  if(q.type==='drop'){
    var out={};q.buckets.forEach(function(b){out[b.id]=[];});
    q.chips.forEach(function(c){out[c.b].push(c.t);});
    return '<div class="mono small">'+q.buckets.map(function(b){return '<b>'+esc(b.label)+':</b> '+out[b.id].map(function(x){return esc(x);}).join('; ');}).join('<br>')+'</div>';
  }
  if(q.type==='fill'){
    return '<span class="mono">'+q.answers.map(function(a,i){return '['+(i+1)+'] '+esc(a);}).join(' &nbsp; ')+'</span>';
  }
  if(q.type==='spot')return '<span class="mono">Line(s) '+q.correct.join(', ')+'</span>';
  if(q.type==='terminal')return '<span class="mono">'+esc(q.solution)+'</span>';
  if(q.type==='branch'){
    return '<div class="mono small">'+q.steps.map(function(s,k){
      var m=s.opts[0];s.opts.forEach(function(o){if(o.pts>m.pts)m=o;});
      return (k+1)+'. '+esc(m.t);
    }).join('<br>')+'</div>';
  }
  return '';
}

function nextQuestion(){
  if(ST.idx>=ST.qs.length-1){finishExam();return;}
  ST.idx++;
  renderQuestion();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============================ RESULTS ============================ */
function finishExam(){
  if(ST.timerId){clearInterval(ST.timerId);ST.timerId=null;}
  ST.paused=false;
  byId('pauseOverlay').classList.add('hide');
  byId('examContent').classList.remove('blurred');
  var earned=0,total=0;
  ST.qs.forEach(function(q){total+=q.base;var r=ST.results[q.id];if(r)earned+=r.earned;});
  var pct=total?Math.round(earned/total*100):0;
  var pass=pct>=80;
  var themes={};
  ST.qs.forEach(function(q){
    if(!themes[q.theme])themes[q.theme]={e:0,t:0};
    themes[q.theme].t+=q.base;
    var r=ST.results[q.id];if(r)themes[q.theme].e+=r.earned;
  });
  var h='';
  if(pass){
    h+='<div class="card pass"><h2 style="color:#22c55e">PASS — certification earned</h2><div class="bigscore" id="bigScore">0%</div><p style="color:#9fbdd1">You scored '+earned+' of '+total+' points. The pass mark is 80%.</p></div>';
    h+='<div class="cert"><div class="certseal">&#10003;</div><h2 style="color:#fbbf24;margin-top:8px">Certificate of Completion</h2>';
    h+='<div class="certname">'+esc(ST.name)+'</div>';
    h+='<div style="color:#e8f5e0">has passed the Secure SDLC &amp; AppSec Defense Certification Exam</div>';
    h+='<div class="certmeta">Score: '+pct+'% &nbsp;•&nbsp; Points: '+earned+'/'+total+' &nbsp;•&nbsp; Pass mark: 80%</div>';
    h+='<div class="certmeta">'+new Date().toLocaleDateString()+' &nbsp;•&nbsp; '+ST.qs.length+' exercises completed</div></div>';
  }else{
    h+='<div class="card fail"><h2 style="color:#ef4444">FAIL — retake required</h2><div class="bigscore" id="bigScore">0%</div><p style="color:#9fbdd1">You scored '+earned+' of '+total+' points. The pass mark is 80%. Review the detailed report below, study the focus tips, then retake the exam. Questions and answers are shuffled each time.</p></div>';
  }
  h+='<div class="card"><h2>Score by theme</h2><div class="tbl">';
  Object.keys(themes).forEach(function(k){
    var m=themes[k];var p=m.t?Math.round(m.e/m.t*100):0;
    var col=p>=80?'#22c55e':(p>=50?'#f59e0b':'#ef4444');
    h+='<div class="tcell"><div class="tl">'+esc(k)+'</div><div class="tsv" style="color:'+col+'">'+p+'%</div><div class="tl">'+m.e+' / '+m.t+' points</div></div>';
  });
  h+='</div></div>';
  h+='<div class="card"><h2>Detailed report</h2>';
  ST.qs.forEach(function(q,i){
    var r=ST.results[q.id];
    var frac=r?r.frac:0;
    var cls=frac>=0.999?'ok':(frac>0?'part':'bad');
    var label=frac>=0.999?'Correct':(frac>0?'Partly correct':'Incorrect');
    h+='<div class="repitem '+cls+'">';
    h+='<div class="rephead"><span>Q'+(i+1)+' — '+esc(q.theme)+' — '+label+(q.logview?' (log viewer)':(q.type==='branch'?' (scenario)':''))+'</span><span class="sc">'+(r?r.earned:0)+' / '+q.base+' pts</span></div>';
    h+='<div class="repq">'+esc(q.q)+'</div>';
    h+='<div class="repans"><b>Your answer:</b> '+esc(r?r.summary:'Not answered')+'</div>';
    h+='<div class="repans"><b>Correct answer:</b> '+correctText(q)+'</div>';
    h+='<div class="repexp"><b>Explanation:</b> '+esc(q.explain)+'</div>';
    if(frac<0.999)h+='<div class="repfocus"><b>Focus on:</b> '+esc(q.focus)+'</div>';
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="card" style="text-align:center"><button class="btn primary" onclick="retake()">Retake Exam</button> <button class="btn" onclick="window.scrollTo({top:0,behavior:\'smooth\'})">Back to top</button></div>';
  byId('screenResults').innerHTML=h;
  byId('screenExam').classList.add('hide');
  byId('screenResults').classList.remove('hide');
  animateScore(pct);
  window.scrollTo(0,0);
}

function retake(){
  ST={};
  renderIntro();
  window.scrollTo(0,0);
}

/* ============================ BOOT ============================ */
renderIntro();
</script>
