<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure SDLC &amp; AppSec Defense — Certification Exam</title>
<style>
:root{
  --bg:#060b11; --panel:#0f1a25; --panel2:#152432; --line:#20384a;
  --txt:#dce9f4; --mut:#7f9cb2; --acc:#22d3ee; --acc2:#8b5cf6;
  --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; --shadow:0 10px 34px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(1100px 620px at 15% -12%,#10283a 0%,#060b11 62%);color:var(--txt);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;font-size:15px}
.hide{display:none !important}
.mono{font-family:Consolas,"Courier New",monospace}
.small{font-size:12.5px}
b{color:#fff}
h1,h2,h3{margin:0 0 8px;line-height:1.25}
p{margin:0 0 10px}
.screen{max-width:1080px;margin:0 auto;padding:22px 16px 80px}
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px 16px;font-size:14px;cursor:pointer;transition:.18s;font-weight:600}
.btn:hover{border-color:var(--acc);color:#fff;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#0891b2,#0e7490);border-color:#22d3ee;color:#eafcff}
.btn.primary:hover{box-shadow:0 0 18px rgba(34,211,238,.45)}
.btn.small{padding:6px 11px;font-size:12.5px}
.btn.warn{background:#3a2a08;border-color:#f59e0b;color:#fde68a}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.card{background:linear-gradient(180deg,rgba(21,36,50,.92),rgba(15,26,37,.92));border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.hero h1{font-size:27px;background:linear-gradient(90deg,#67e8f9,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{color:var(--mut)}
.pill{display:inline-block;background:#0b1a24;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;color:#a9c6da;margin:3px 5px 3px 0}
.pill.hot{border-color:#7c3aed;color:#c4b5fd}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:780px){.grid2{grid-template-columns:1fr}}
.kwcard{background:#0c1620;border:1px solid var(--line);border-radius:11px;padding:12px}
.kwt{font-weight:700;color:var(--acc);font-size:13.5px;margin-bottom:7px;letter-spacing:.3px}
.kw{display:inline-block;background:#122230;border:1px solid #1d3446;border-radius:7px;padding:3px 8px;margin:3px 4px 0 0;font-size:12px;color:#bcd6e8}
.rules li{margin-bottom:6px;color:#c3d7e6}
.namebox{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{background:#0a141d;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px 12px;font-size:14px;min-width:230px}
input[type=text]:focus{outline:none;border-color:var(--acc)}
/* dashboard */
.dash{position:sticky;top:0;z-index:20;background:rgba(8,15,22,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;max-width:1080px;margin:0 auto}
.dtitle{font-size:13px;color:#bfe6f2;font-weight:700}
.dbar{height:8px;background:#0b1620;border-radius:99px;overflow:hidden;border:1px solid #1b3040;margin:6px 0 4px;width:min(430px,52vw)}
.dfill{height:100%;background:linear-gradient(90deg,#22d3ee,#8b5cf6);transition:width .5s ease}
.dsub{font-size:11.5px;color:var(--mut)}
.dright{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stat{text-align:center;min-width:58px}
.sl{display:block;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.sv{display:block;font-size:16px;font-weight:800;color:#e6f6ff}
.sv.g{color:var(--ok)}
.timer.low .sv{color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.themes{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tbadge{font-size:10.5px;color:#9fbdd1;background:#0c1a25;border:1px solid #1d3446;border-radius:99px;padding:2px 8px}
.tbadge.done{border-color:#22543d;color:#86efac}
/* question */
.examwrap{max-width:1080px;margin:0 auto;padding:18px 16px 80px;transition:.25s}
.examwrap.blurred{filter:blur(13px);pointer-events:none;user-select:none}
.qcard{background:linear-gradient(180deg,rgba(21,36,50,.96),rgba(13,23,33,.96));border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.qnum{font-weight:800;color:#8ee9fb;font-size:14px}
.tag{font-size:11px;background:#0d2430;border:1px solid #1f4a5c;color:#9fe6f5;border-radius:99px;padding:3px 10px}
.tag.pts{border-color:#5b4a12;color:#fcd34d;background:#241c05}
.qtext{font-size:16.5px;color:#eaf4fb;margin-bottom:14px;font-weight:600}
.hintline{font-size:12.5px;color:var(--mut);margin-top:9px;font-style:italic}
.panel{border-radius:11px;padding:13px;margin-bottom:14px;font-size:13.5px;border:1px solid var(--line);background:#0a141d}
.panel .ptitle{font-weight:800;color:#fca5a5;margin-bottom:7px;font-size:13px}
.pline{font-family:Consolas,monospace;font-size:12.5px;color:#cfe3f0;padding:2px 0}
pre.code{background:#060d14;border:1px solid #1c3446;border-radius:11px;padding:12px;overflow:auto;margin:0 0 12px;font-size:13px;line-height:1.55}
pre.code.static{color:#b7e2f5}
.codeline{display:flex;gap:10px;padding:1px 6px;border-radius:6px;cursor:pointer;transition:.15s}
.codeline:hover{background:#0f2230}
.codeline .ln{color:#557188;min-width:22px;text-align:right;user-select:none}
.codeline .lc{white-space:pre;color:#cfe6f5}
.codeline.picked{background:#3a1010;box-shadow:inset 0 0 0 1px #ef4444}
.codeline.picked .lc{color:#fecaca}
/* options */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;background:#0d1a24;border:1px solid var(--line);border-radius:10px;padding:12px 13px;color:var(--txt);cursor:pointer;font-size:14.5px;transition:.15s;font-family:inherit}
.opt:hover{border-color:#3f7d94;background:#10222f}
.opt .mark{width:19px;height:19px;border:2px solid #3c5a6e;border-radius:50%;flex:0 0 auto;margin-top:1px;position:relative}
.opt.multi .mark{border-radius:5px}
.opt.sel{border-color:var(--acc);background:#0b2a34;box-shadow:0 0 0 1px rgba(34,211,238,.35)}
.opt.sel .mark{background:var(--acc);border-color:var(--acc)}
.opt.locked{pointer-events:none}
.opt.correct{border-color:var(--ok);background:#0c2418}
.opt.wrong{border-color:var(--bad);background:#2a1010}
/* chips / zones */
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:14px}
.zone{border:1.5px dashed #2b4d63;border-radius:11px;padding:10px;background:#0a141d;min-height:96px;transition:.15s}
.zone.hot{border-color:var(--acc);background:#0c2531}
.zlabel{font-weight:800;font-size:13px;color:#a5e8f8;margin-bottom:2px}
.zsub{font-size:11.5px;color:var(--mut);margin-bottom:7px}
.zlist{display:flex;flex-direction:column;gap:6px;min-height:38px}
.pool{display:flex;flex-wrap:wrap;gap:8px;background:#091119;border:1px solid #1b3040;border-radius:11px;padding:11px;min-height:56px}
.poollabel{font-size:12px;color:var(--mut);margin:6px 0}
.chip{background:#12313e;border:1px solid #2a6076;color:#d9f2fb;border-radius:9px;padding:7px 11px;font-size:13px;cursor:grab;user-select:none;transition:.13s;max-width:100%}
.chip:hover{border-color:var(--acc)}
.chip.sel{border-color:var(--acc);background:#0b3a48;box-shadow:0 0 0 2px rgba(34,211,238,.4)}
.chip.dragging{opacity:.4}
.chip.small{font-size:11.5px;padding:5px 8px}
/* fill */
.fillwrap{background:#060d14;border:1px solid #1c3446;border-radius:11px;padding:14px;white-space:pre-wrap;font-family:Consolas,monospace;font-size:13.5px;line-height:2.05;margin-bottom:14px;color:#cfe6f5}
.blank{display:inline-flex;min-width:118px;height:30px;border-bottom:2px solid var(--acc);vertical-align:middle;margin:0 4px;align-items:center;padding:0 3px;border-radius:6px 6px 0 0}
.blank.hot{background:#0c2531}
.blank .chip{margin:0;font-size:12.5px;padding:4px 8px}
/* order */
.olist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.oitem{display:flex;align-items:center;gap:11px;background:#0d1a24;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:grab;font-size:14px}
.oitem:hover{border-color:#3f7d94}
.oitem .drag{color:#4d6b80;font-weight:800;letter-spacing:-1px}
.oitem .ot{flex:1}
.oitem .mv{display:flex;flex-direction:column;gap:2px}
.oitem .mv button{background:#14293a;border:1px solid #23445a;color:#9fd6e8;border-radius:5px;cursor:pointer;font-size:9px;line-height:1;padding:3px 6px}
.oitem .mv button:hover{background:#1c3b50}
/* terminal */
.term{background:#04090e;border:1px solid #1d3648;border-radius:11px;overflow:hidden;margin-bottom:12px}
.termbar{background:#0d1a24;padding:7px 12px;font-size:12px;color:#7fb4c9;border-bottom:1px solid #1d3648}
.termout{padding:12px;font-family:Consolas,monospace;font-size:13px;color:#a7f3d0;white-space:pre-wrap;line-height:1.6;max-height:230px;overflow:auto}
.termin{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid #1d3648;background:#071019}
.termin .ps1{color:#22d3ee;font-family:Consolas,monospace}
.termin input{flex:1;background:transparent;border:none;outline:none;color:#e6fffb;font-family:Consolas,monospace;font-size:13.5px}
.termout .err{color:#fca5a5}
.termout .dim{color:#6b8ba0}
/* feedback */
.fb{border-radius:11px;padding:14px;margin-top:14px;border:1px solid var(--line);animation:fade .3s ease}
.fb.ok{border-color:#1f7a44;background:#0b2416}
.fb.part{border-color:#a16207;background:#2a1f06}
.fb.bad{border-color:#a11d1d;background:#2a0d0d}
.fbtitle{font-weight:800;margin-bottom:7px;font-size:14.5px}
.fb.ok .fbtitle{color:#86efac}
.fb.part .fbtitle{color:#fcd34d}
.fb.bad .fbtitle{color:#fca5a5}
.fbtext{color:#d8e8f3;font-size:14px}
.fbans{margin-top:9px;padding-top:9px;border-top:1px dashed #2b4557;font-size:13.5px;color:#9fe6f5}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hintbox{margin-top:12px;background:#2a1f06;border:1px solid #a16207;border-radius:10px;padding:12px;font-size:13.5px;color:#fde68a}
/* pause */
.pause{position:fixed;inset:0;z-index:60;background:rgba(3,7,11,.93);display:flex;align-items:center;justify-content:center;padding:20px}
.pausepanel{max-width:460px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
/* results */
.bigscore{font-size:52px;font-weight:900;line-height:1}
.pass .bigscore{color:var(--ok)} .fail .bigscore{color:var(--bad)}
.cert{border:2px solid #b8860b;border-radius:16px;padding:24px;text-align:center;background:linear-gradient(180deg,#141a0e,#0b1005);box-shadow:0 0 34px rgba(34,197,94,.28)}
.certseal{font-size:44px;color:#fbbf24}
.certname{font-size:26px;font-weight:900;color:#fff;margin:10px 0;letter-spacing:.5px}
.certmeta{color:#d0e8c4;font-size:13.5px;margin-top:10px}
.tbl{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;margin-top:12px}
.tcell{background:#0b1620;border:1px solid var(--line);border-radius:10px;padding:11px}
.tcell .tl{font-size:11.5px;color:var(--mut)}
.tcell .tsv{font-size:15px;font-weight:800;color:#e6f6ff}
.repitem{border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:11px;background:#0b1620;border-left:5px solid #334}
.repitem.ok{border-left-color:var(--ok)}
.repitem.part{border-left-color:var(--warn)}
.repitem.bad{border-left-color:var(--bad)}
.rephead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:800;font-size:13.5px;margin-bottom:6px}
.rephead .sc{color:#9fe6f5}
.repq{font-size:13.5px;color:#cfe3f0;margin-bottom:7px}
.repans{font-size:13px;color:#a9c6da;margin-bottom:7px}
.repexp{font-size:13.5px;color:#d8e8f3;background:#08131c;border-radius:8px;padding:10px;margin-bottom:7px}
.repfocus{font-size:13px;color:#fde68a}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.logbar{display:flex;gap:10px;align-items:center;background:#0d1a24;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:10px}
.logbar .ll{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.logbar input{flex:1;background:#0a141d;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:13px;font-family:Consolas,monospace}
.logview{background:#060d14;border:1px solid #1c3446;border-radius:11px;padding:8px;max-height:330px;overflow:auto;margin-bottom:8px}
.logline{display:flex;gap:10px;padding:3px 6px;border-radius:6px;cursor:pointer;font-family:Consolas,monospace;font-size:12.5px;transition:.12s}
.logline:hover{background:#0f2230}
.logline .ln{color:#557188;min-width:22px;text-align:right;user-select:none}
.logline .lc{white-space:pre-wrap;color:#cfe6f5}
.logline.picked{background:#3a1010;box-shadow:inset 0 0 0 1px #ef4444}
.logline.picked .lc{color:#fecaca}
.lk{color:#67e8f9}.lv{color:#fcd34d}.lh{color:#fca5a5}
.codeline.isright,.logline.isright{background:#0c2418;box-shadow:inset 0 0 0 1px #22c55e}
.codeline.isright .lc,.logline.isright .lc{color:#bbf7d0}
</style>
</head>
<body>
<div id="screenIntro" class="screen"></div>
<div id="screenExam">
  <div id="dash" class="dash"></div>
  <div id="examContent" class="examwrap"><div id="qhost" class="qcard"></div></div>
  <div id="pauseOverlay" class="pause hide">
    <div class="pausepanel">
      <h2>Exam paused</h2>
      <p style="color:#9fbdd1">Your timer is stopped. The question is blurred and unreadable on purpose, so pausing cannot be used to study the question.</p>
      <button class="btn primary" onclick="togglePause()">Resume exam</button>
    </div>
  </div>
</div>
<div id="screenResults" class="screen hide"></div>

<script>
/* ============================ KEYWORDS ============================ */
var KEYWORDS=[
 {theme:"Secure Software Development", words:["secure software development","secure SDLC","secure coding practices","shift-left","security requirements","abuse cases","threat modeling","code review","developer-analyst collaboration"]},
 {theme:"Application Weaknesses & Attacks", words:["weak input validation","injection","SQL injection","broken authentication","insecure session handling","session fixation","cross-site scripting (XSS)","output encoding","insecure direct object reference (IDOR)","application-layer attacks","exploitable vulnerabilities","OWASP Top 10","parameterized queries","hardcoded secrets"]},
 {theme:"Logging, Telemetry & Detection", words:["logs","error logging","poor error logging","actionable telemetry","structured logging","sensitive data in logs","SIEM","detection rule","alerts","alert triage","false positive","threat hunting"]},
 {theme:"Incident Response & Investigation", words:["incident investigation","evidence preservation","chain of custody","containment","eradication","recovery","root cause analysis","indicators of compromise"]},
 {theme:"Vulnerability Management & Assurance", words:["vulnerability scan","penetration test","findings","remediation validation","retest","CVSS","CWE","SAST","DAST","SCA","WAF","patch management","risk ranking","compensating control","risk acceptance","security regression","production release gate"]},
 {theme:"Standards & Compliance", words:["NIST SSDF","OWASP Top 10","PCI DSS","ISO 27001"]}
];

var TIME={mcq:60,order:100,drop:110,fill:90,terminal:80,branch:120,spot:90,rank:80};

/* ============================ QUESTIONS ============================ */
var QUESTIONS=[
{id:"q1",type:"order",theme:"Secure SDLC",base:6,
 q:"Northwind Bank is rebuilding its online banking API. You are the AppSec lead. Put these secure-development activities in the order they happen in a shift-left SDLC.",
 items:[
  {id:"a",t:"Write security requirements and abuse cases with the product owner"},
  {id:"b",t:"Threat-model the API design and rank the design risks"},
  {id:"c",t:"Develop with secure coding: allowlist input validation and parameterized queries"},
  {id:"d",t:"Run code review and SAST in the CI pipeline on every pull request"},
  {id:"e",t:"Run DAST and a penetration test in the staging environment"},
  {id:"f",t:"Validate every finding: retest it and confirm the fix closes it"},
  {id:"g",t:"Release to production with monitoring and alerting switched on"}],
 hint:"Design work happens before code, and proving a fix happens before shipping. Ask what must be true before each next phase.",
 explain:"Shift-left moves security work earlier. First you agree on the security requirements and abuse cases. Then you threat-model the design before code exists. Then you build with secure coding. Code review and SAST catch flaws inside the pipeline. DAST and a penetration test attack the running app in staging. Remediation validation proves the fixes work. Only then does the build reach production, where monitoring watches it.",
 focus:"Learn the phases of a secure SDLC and the meaning of shift-left."},

{id:"q2",type:"mcq",theme:"Application Security",base:5,
 q:"Pentest ticket PT-2041 says: the login API answers \"no such user\" for unknown accounts and \"wrong password\" for known ones, and it never blocks repeated attempts. Which pair of fixes closes both problems?",
 panel:{kind:"ticket",title:"PT-2041 — Login API (severity: High)",
  lines:["POST /api/v1/login  ->  200 with body {\"error\":\"no such user\"}","POST /api/v1/login  ->  200 with body {\"error\":\"wrong password\"}","No lockout after 5,000 failed attempts from one source.","Authentication succeeds with a valid username and password only."]},
 options:[
  {id:"o1",t:"Parameterized queries and full input allowlists"},
  {id:"o2",t:"Rate limiting and generic error replies"},
  {id:"o3",t:"Session ID rotation and HttpOnly cookie flags"},
  {id:"o4",t:"Log redaction and alert threshold tuning"}],
 correct:["o2"],
 hint:"Two separate weaknesses are named: one is about what the API tells the attacker, the other is about how many times the attacker may try.",
 explain:"Broken authentication here has two parts. First, different error texts let an attacker list valid usernames. The fix is one generic message such as \"invalid username or password\". Second, unlimited attempts allow password guessing and credential stuffing. The fix is rate limiting and lockout. Parameterized queries stop SQL injection, cookie flags protect sessions, and log tuning is detection work. None of them fixes this finding.",
 focus:"Separate the fix for username enumeration from the fix for brute force."},

{id:"q3",type:"drop",theme:"Secure SDLC",base:6,
 q:"Classify each activity into the SDLC phase where it belongs. Northwind wants every control placed where it works best.",
 buckets:[
  {id:"b1",label:"Design",sub:"Before code is written"},
  {id:"b2",label:"Build",sub:"While code is written and merged"},
  {id:"b3",label:"Run & Detect",sub:"While the app serves real traffic"}],
 chips:[
  {id:"c1",t:"Threat modeling the new payment flow",b:"b1"},
  {id:"c2",t:"Writing abuse cases with the product owner",b:"b1"},
  {id:"c3",t:"Allowlist input validation in the invoice API",b:"b2"},
  {id:"c4",t:"Peer code review before merge",b:"b2"},
  {id:"c5",t:"Tuning WAF rules for the login endpoint",b:"b3"},
  {id:"c6",t:"A detection rule for failed-login bursts",b:"b3"}],
 hint:"Threat modeling and abuse cases happen before any code. WAF rules and detection rules need live traffic.",
 explain:"Design-time work prevents flaws: threat modeling and abuse cases find risks before code exists. Build-time work removes flaws: allowlist input validation and code review catch unsafe code before merge. Run-time work detects attacks on live traffic: WAF rules block or log HTTP attacks, and detection rules alert analysts when the app is abused.",
 focus:"Map each secure development control to the lifecycle phase where it is strongest."},

{id:"q4",type:"spot",theme:"Application Vulnerabilities",base:6,
 q:"Northwind's invoice service. Click every line that creates or leaks a vulnerability. There are two.",
 lines:[
  "app.get('/invoice', (req, res) => {",
  "  const pageSize = 25;",
  "  const id = req.query.id;",
  "  const sql = 'SELECT * FROM invoices WHERE id=' + id;",
  "  db.query(sql, (err, rows) => {",
  "    if (err) { console.log(req.headers); res.status(500).send(err.message); }",
  "    res.json(rows);",
  "  });",
  "});"],
 correct:[4,6],
 hint:"One line builds a query from user input. One line sends internal details out to the user.",
 explain:"Line 4 joins untrusted input (req.query.id) into a SQL string. This is SQL injection: weak input validation plus string concatenation. The fix is a parameterized query, for example db.query('... WHERE id = ?', [id]). Line 6 both writes request headers, which can contain cookies and tokens, into a log, and returns the raw database error to the browser. That leaks internals and is poor error logging. Line 3 only reads the value; the safe or unsafe use happens on line 4.",
 focus:"Learn to separate the source of untrusted data from the line where the vulnerability is created."},

{id:"q5",type:"mcq",theme:"Application Security",base:6,multi:true,
 q:"You receive a scan report on the payments app. Select every entry that is a real, directly exploitable application vulnerability, not a hardening note.",
 options:[
  {id:"o1",t:"User input reflected into the page with no encoding"},
  {id:"o2",t:"The session cookie is missing its HttpOnly flag"},
  {id:"o3",t:"The server banner shows the exact web server version"},
  {id:"o4",t:"A changed URL id shows another customer's invoice"},
  {id:"o5",t:"Port 8443 is open but no service answers on it"}],
 correct:["o1","o4"],
 hint:"A real vulnerability has a path an attacker can walk to steal data, take over an account or run code. The rest is only information.",
 explain:"Reflected user input with no output encoding is cross-site scripting (XSS). It runs attacker script in a victim's browser, so it is directly exploitable. A changed URL id that shows another customer's invoice is an insecure direct object reference (IDOR): the app never checks that the object belongs to the user, so one customer reads another's data. The other three entries are hardening notes. A cookie without HttpOnly is easier to steal, but by itself it grants nothing. A version banner and an unused open port help an attacker plan, yet neither can be used to take data or run code.",
 focus:"Tell a directly exploitable vulnerability apart from a hardening note in a scan report."},

{id:"q6",type:"drop",theme:"Application Vulnerabilities",base:6,
 q:"Map each concrete flaw to the control family that fixes it.",
 buckets:[
  {id:"b1",label:"Input handling",sub:"Validate and encode"},
  {id:"b2",label:"Authentication",sub:"Prove who the user is"},
  {id:"b3",label:"Session management",sub:"Keep the logged-in state safe"},
  {id:"b4",label:"Logging & errors",sub:"Record facts, hide secrets"}],
 chips:[
  {id:"c1",t:"Building a SQL query by string concatenation",b:"b1"},
  {id:"c2",t:"Writing user input into HTML with no output encoding",b:"b1"},
  {id:"c3",t:"No rate limit or lockout on the login endpoint",b:"b2"},
  {id:"c4",t:"Different error text for unknown user vs wrong password",b:"b2"},
  {id:"c5",t:"Session ID stays the same after a successful login",b:"b3"},
  {id:"c6",t:"Session cookie is sent without the Secure flag",b:"b3"},
  {id:"c7",t:"Raw stack traces are returned to the browser",b:"b4"},
  {id:"c8",t:"Passwords are written to app.log in clear text",b:"b4"}],
 hint:"Ask who owns the flaw: the way data enters, the way identity is proven, the way the login is remembered, or the way events are recorded.",
 explain:"Input handling controls cover injection and cross-site scripting: use allowlist validation, parameterized queries and output encoding. Authentication controls cover login: rate limiting, lockout and generic error messages that stop username enumeration. Session management controls cover the logged-in state: rotate the session ID after login and add Secure and HttpOnly to the cookie. Logging and error controls cover what leaves the app and what is stored: no raw stack traces to the user, and never write passwords or tokens into logs.",
 focus:"Learn which control family owns each common application flaw."},

{id:"q7",type:"order",theme:"Incident Response",base:6,
 q:"A SIEM alert fires at 02:14 about suspicious authentication on a customer portal. Put the analyst actions in the right order.",
 items:[
  {id:"a",t:"Acknowledge the alert and read the raw logs behind it"},
  {id:"b",t:"Establish scope: which accounts, hosts and data are involved"},
  {id:"c",t:"Preserve evidence: copy logs and start the chain-of-custody record"},
  {id:"d",t:"Contain the threat: disable the account and block the source"},
  {id:"e",t:"Eradicate the cause: patch the broken authentication flaw"},
  {id:"f",t:"Recover: restore normal service and watch for a second attack"},
  {id:"g",t:"Write the root-cause analysis and improve the detection rule"}],
 hint:"Think about what you must confirm and protect before you change anything, and what you owe the team once the service is back.",
 explain:"First you acknowledge the alert and read the raw logs, because an alert is only a hint. Next you find the scope: which accounts, hosts and data are touched. Then you preserve evidence before you change anything, using a chain of custody so the evidence stays usable. Containment stops the damage: disable the account and block the source. Eradication removes the cause, for example by patching the broken authentication flaw and checking other hosts for the same gap. Recovery returns the service and watches for a second attack. Finally, root-cause analysis explains what happened, and the detection rule is improved so the same thing is caught faster next time.",
 focus:"Memorise the incident response flow: verify, scope, preserve, contain, eradicate, recover, learn."},

{id:"q8",type:"terminal",theme:"Logging & Detection",base:5,
 q:"auth.log is on the SIEM host. Count the failed SSH logins that come from 10[.]0[.]0[.]42 in /var/log/auth.log. Type the command and press Enter.",
 host:"analyst@siem-host:/var/log",
 intro:"Last login: Tue 02:10 from 10[.]0[.]0[.]7\ntip: grep -c counts matching lines.\n",
 expected:[/grep/,"-c|--count",/10\[\.\]0\[\.\]0\[\.\]42|10\.0\.0\.42/,"auth\\.log"],
 solution:"grep -c \"10[.]0[.]0[.]42\" /var/log/auth.log",
 simout:"42",
 hint:"You need three things: the grep command, a count flag, and the IP plus the file name.",
 explain:"grep reads the file line by line and prints the lines that match. The -c flag prints only the number of matching lines instead of the lines themselves. So grep -c on the IP, pointed at /var/log/auth.log, answers \"how many times did this address fail?\" in one step. That number tells you if the source is a single noisy host or part of a wider attack.",
 focus:"Practise grep flags: -c counts, -i ignores case, -r searches a directory."},

{id:"q9",type:"drop",theme:"Logging & Detection",base:6,
 q:"You are tuning the portal log pipeline. Sort each log line into the right bucket.",
 buckets:[
  {id:"b1",label:"Actionable telemetry",sub:"An analyst can act on this"},
  {id:"b2",label:"Noise",sub:"Safe to drop or sample"},
  {id:"b3",label:"Sensitive-data leak",sub:"Must be fixed now"}],
 chips:[
  {id:"c1",t:"ts=02:14:07 evt=login_fail user=svc_backup src=10[.]0[.]0[.]42 reason=bad_password",b:"b1"},
  {id:"c2",t:"ts=02:14:09 evt=login_success user=svc_backup src=10[.]0[.]0[.]42",b:"b1"},
  {id:"c3",t:"ts=02:14:10 evt=healthcheck path=/ping status=200",b:"b2"},
  {id:"c4",t:"ts=02:14:11 evt=http status=200 bytes=412 path=/favicon.ico",b:"b2"},
  {id:"c5",t:"ts=02:14:12 evt=login_fail user=alice password=Summer2024! src=10[.]0[.]0[.]42",b:"b3"},
  {id:"c6",t:"ts=02:14:13 evt=error msg=SQLSTATE[42000] trace=/srv/app/db.js:77 token=eyJhbGci...",b:"b3"}],
 hint:"Actionable lines name an actor, an action and a result. Noise is routine and expected. A leak puts a secret into the log.",
 explain:"Actionable telemetry has the fields an analyst needs: a stable event name, the actor, the source and the result. A failed login followed one second later by a success for the same service account is exactly the pattern a detection rule needs. Health checks and favicon requests are routine noise and can be sampled. Logging a password in clear text is never acceptable, and an error line that contains a stack trace path plus a bearer token gives an attacker the keys if the log is ever read. Those two lines are sensitive-data leaks and must be fixed in the code.",
 focus:"Learn which log fields make a line actionable, and which fields must never be logged."},

{id:"q10",type:"mcq",theme:"Logging & Detection",base:5,
 q:"Your application logs are noisy and analysts cannot act on them. Which single change turns them into actionable telemetry for application-layer attacks?",
 options:[
  {id:"o1",t:"Add a stable event name, actor, source IP and object touched"},
  {id:"o2",t:"Raise the log level from info to debug on every single request"},
  {id:"o3",t:"Write the full request body, including passwords, into the log file"},
  {id:"o4",t:"Send every log line to the on-call analysts by email in real time"}],
 correct:["o1"],
 hint:"Actionable does not mean more volume. It means the right fields in a fixed shape.",
 explain:"Actionable telemetry is structured logging: every event uses the same field names, so a detection rule can match it and an analyst can pivot on it. The four key fields are what happened (event), who did it (actor), from where (source IP) and to what (object). Debug on every request creates volume without meaning. Logging passwords creates a sensitive-data leak. Emailing every line buries the signal and burns out the team.",
 focus:"Learn the fields of structured, actionable logs."},

{id:"q11",type:"fill",theme:"Application Security",base:6,
 q:"Complete the vulnerability report. Drag a word into each gap.",
 text:"Finding F-118\nTitle: /reset is affected by broken {{0}}.\nRoot cause: weak {{1}} on the token parameter.\nImpact: an attacker can guess {{2}} tokens and take over accounts.\nFix: issue a {{3}} random token, store only its hash, and expire it after one use.",
 answers:["authentication","input validation","session","cryptographically"],
 bank:["authentication","input validation","session","cryptographically","authorization","encryption","network","hashing"],
 hint:"The endpoint proves identity, the token arrives as input, the token represents a login, and the token must be unguessable.",
 explain:"Broken authentication means the app fails to prove identity correctly. The root cause here is weak input validation: the reset token from the request is trusted without checking its shape or length. The token represents a session, so a guessable token lets an attacker take over the session of another user. The deep fix is a cryptographically random token, stored as a hash and valid only once, so guessing is not practical.",
 focus:"Learn how authentication, input validation and session handling connect in a real finding."},

{id:"q12",type:"branch",theme:"Incident Response",base:8,
 q:"Night shift in the Northwind SOC. Work the alert step by step. Each choice gives feedback before the next stage.",
 steps:[
  {sit:"02:14 — Alert: user alice logged in from 10[.]0[.]0[.]42 (Frankfurt) four minutes after a login from 192[.]0[.]2[.]15 (Chicago). MFA was satisfied both times. What is your first move?",
   opts:[
    {t:"Open the raw auth and web logs for both sessions and compare the session IDs",pts:2,fb:"Correct. An alert is a lead, not a fact. Confirming the session IDs tells you whether this is one stolen session or two real logins."},
    {t:"Disable alice's account immediately",pts:1,fb:"Containment is a good instinct, but you acted before you verified. You might lock out a traveller and destroy the evidence you need."},
    {t:"Close the alert as a false positive because MFA passed",pts:0,fb:"Dangerous. MFA can be relayed, and a session can be stolen after login. MFA passing does not prove the session is legitimate."}]},
  {sit:"The logs show both sessions use the same session cookie value. The cookie is set without the Secure and HttpOnly flags. What does this prove?",
   opts:[
    {t:"Insecure session handling: one session ID was reused across two sources",pts:2,fb:"Correct. One session ID used from two IPs at once is session hijacking. Missing Secure and HttpOnly made the theft easier."},
    {t:"Weak input validation on the login form",pts:0,fb:"No. Nothing here shows untrusted input being trusted. The problem is the session, not the input parsing."},
    {t:"A firewall misconfiguration between the two offices",pts:0,fb:"No. A firewall does not hand the same session ID to two locations. This is an application session flaw."}]},
  {sit:"Confirmed: the session was hijacked. You must contain the incident now. Which action set is correct?",
   opts:[
    {t:"Kill both sessions, force a password reset, and block the source address",pts:2,fb:"Correct. You remove the attacker's access, reset the credential and cut the path the attacker used."},
    {t:"Only block the source address and keep watching",pts:1,fb:"Partly right. You cut one path, but the stolen session stays alive, so the attacker can return from another address."},
    {t:"Wait for the developer to patch the app before doing anything",pts:0,fb:"No. The attacker is active now. Contain first, then fix the code."}]},
  {sit:"Containment is done. What evidence truly proves the code fix works?",
   opts:[
    {t:"Retest the login flow and show the session ID now rotates and carries Secure and HttpOnly",pts:2,fb:"Correct. This is remediation validation: replay the original attack path and prove it is closed."},
    {t:"The developer says the code is fixed and merged",pts:0,fb:"No. A statement is not evidence. Always retest the attack path yourself."},
    {t:"The alert stops firing because you muted the rule",pts:0,fb:"No. Muting detection hides the problem. It never proves a fix."}]}],
 hint:"Follow the analyst flow: verify the alert, name the flaw, contain the threat, then prove the fix.",
 explain:"A real triage follows a chain. Verify the alert with raw logs before you act. Name the weakness precisely: here it is insecure session handling, with a reused session ID and missing cookie flags. Contain by killing sessions, resetting the credential and blocking the source. Then validate the fix by retesting the original attack, not by trusting a statement or by silencing the alert.",
 focus:"Practise the verify, identify, contain, validate rhythm of alert triage."},

{id:"q13",type:"rank",theme:"Vulnerability Management",base:5,
 q:"Five findings are open on the payments platform. Drag them so the most urgent sits at the top. Urgency means real impact plus how easily it can be used.",
 items:[
  {id:"a",t:"Remote code execution in the public payment API. Exploit code is public and no login is needed."},
  {id:"b",t:"IDOR that lets any logged-in user read every other customer's invoices"},
  {id:"c",t:"Stored XSS in an internal admin page that few staff can reach"},
  {id:"d",t:"Session cookie missing the HttpOnly flag on the customer portal"},
  {id:"e",t:"Server version banner discloses the web server build number"}],
 hint:"Ask two questions for each finding: how bad is the impact, and how easy is it to reach and use?",
 explain:"Urgency combines impact and reachability. Remote code execution on a public, unauthenticated endpoint with public exploit code is the top risk: it can be used now by anyone and can compromise the host. The invoice IDOR leaks private data of all customers and needs only a basic account, so it is next. Stored XSS in a rarely used admin page is serious but the audience is small. A missing HttpOnly flag makes an existing flaw easier to exploit, so it is a real risk but not immediate. A version banner is a low-severity information leak.",
 focus:"Practise risk ranking by combining impact, exposure and ease of exploitation."},

{id:"q14",type:"drop",theme:"Vulnerability Management",base:6,
 q:"Match each security tool to the job it actually does.",
 buckets:[
  {id:"b1",label:"SAST",sub:"Static analysis"},
  {id:"b2",label:"DAST",sub:"Dynamic analysis"},
  {id:"b3",label:"SCA",sub:"Composition analysis"},
  {id:"b4",label:"Vulnerability scan",sub:"Hosts and services"},
  {id:"b5",label:"SIEM",sub:"Correlate and detect"},
  {id:"b6",label:"WAF",sub:"In-line HTTP control"},
  {id:"b7",label:"Penetration test",sub:"Human, goal-driven"}],
 chips:[
  {id:"c1",t:"Reads source code and flags flaws without running the app",b:"b1"},
  {id:"c2",t:"Attacks a running app from the outside like a real attacker",b:"b2"},
  {id:"c3",t:"Lists known CVEs inside third-party libraries",b:"b3"},
  {id:"c4",t:"Checks hosts and services and reports known missing patches",b:"b4"},
  {id:"c5",t:"Collects and correlates logs from many systems for detection",b:"b5"},
  {id:"c6",t:"Blocks or logs HTTP attacks in line before the application",b:"b6"},
  {id:"c7",t:"A human team chains several flaws to reach a real objective",b:"b7"}],
 hint:"Think about the input each tool reads: source, running app, dependencies, hosts, logs, live HTTP, or a human plan.",
 explain:"SAST reads source code with no running system. DAST attacks a running app from outside. SCA examines third-party libraries for known CVEs. A vulnerability scan checks hosts and services for missing patches and weak settings. A SIEM collects and correlates logs so detection rules can fire. A WAF sits in front of the app and blocks or logs HTTP attacks in line. A penetration test is human work: a team chains flaws to reach a goal. They support each other, but they are not interchangeable.",
 focus:"Learn what each security testing and monitoring tool reads and produces."},

{id:"q15",type:"terminal",theme:"Vulnerability Management",base:5,
 q:"A developer says the session cookie is now Secure and HttpOnly. Type a curl command that fetches only the response headers from the portal login page, so you can read the Set-Cookie line.",
 host:"analyst@workstation:~",
 intro:"The lab DNS resolves hxxps://portal[.]northwind[.]example/ on this host.\n",
 expected:[/curl/,"-I|--head|-i|--include","portal"],
 solution:"curl -I hxxps://portal[.]northwind[.]example/login",
 simout:"HTTP/2 200\nset-cookie: sid=8f3a...c21; Path=/; Secure; HttpOnly; SameSite=Lax\ncache-control: no-store\nx-content-type-options: nosniff",
 hint:"curl has one flag that asks for headers only. You also need the full URL of the portal login page.",
 explain:"The -I flag asks curl for response headers only (a HEAD request). Reading the Set-Cookie line proves the flags are really present on the live service, not just in the source code. Secure means the cookie is only sent over HTTPS. HttpOnly means JavaScript cannot read it, so XSS cannot steal the session. This is remediation validation: you test the running system, not the promise.",
 focus:"Learn to verify cookie flags on the live service instead of trusting the code review."},

{id:"q16",type:"mcq",theme:"Vulnerability Management",base:5,
 q:"Finding F-090 was \"broken authentication: the password reset token is predictable\". The developer pushes a fix. Which evidence truly closes the finding?",
 options:[
  {id:"o1",t:"A retest that creates many tokens and shows they are random and used once"},
  {id:"o2",t:"A code comment that states the reset token is now generated randomly"},
  {id:"o3",t:"A scan that no longer lists the endpoint as missing a security header"},
  {id:"o4",t:"A pipeline that passes the new unit tests the developer added for the token"}],
 correct:["o1"],
 hint:"Closing a finding means proving the original attack no longer works, on the running system.",
 explain:"Remediation validation means replaying the original attack path. For predictable tokens, you generate many tokens and check two things: they are unpredictable, and each one works only once. A code comment is a claim. A scan about a missing header is a different issue. New unit tests are useful, but the developer wrote them and they may not cover the real attack. Independent retesting is the proof.",
 focus:"Distinguish evidence from assurance: only an independent retest of the attack path closes a finding."},

{id:"q17",type:"fill",theme:"Standards & Compliance",base:6,
 q:"Complete the governance paragraph for the secure development programme.",
 text:"Northwind maps its programme to the {{0}} Secure Software Development Framework. Every weakness class gets a {{1}} identifier, so developers and analysts share one name for each flaw. Web weaknesses are tracked against the {{2}} Top 10. Severity is scored with {{3}}. Systems that store cardholder data must also follow {{4}} requirements.",
 answers:["NIST","CWE","OWASP","CVSS","PCI DSS"],
 bank:["NIST","CWE","OWASP","CVSS","PCI DSS","ISO 27001","GDPR","SOX","HIPAA"],
 hint:"One is a US framework, one names weakness types, one is a web risk list, one scores severity, one covers card data.",
 explain:"NIST SSDF is a framework of secure development practices. CWE gives each weakness class a shared identifier, such as CWE-89 for SQL injection, so everyone uses the same name. The OWASP Top 10 lists the most critical web application risks. CVSS is the common score for severity. PCI DSS is the standard for systems that handle cardholder data. ISO 27001, GDPR and SOX are real standards too, but they do not fill these specific roles.",
 focus:"Learn what each standard or framework is for, not just the acronym."},

{id:"q18",type:"drop",theme:"Application Security",base:6,
 q:"Same weakness, two points of view. The app does not rotate the session ID after login. Split the cards between the blue team and the red team.",
 buckets:[
  {id:"b1",label:"Blue team — detect and respond",sub:"What the analyst sees and does"},
  {id:"b2",label:"Red team — exploit and evade",sub:"What the attacker does next"}],
 chips:[
  {id:"c1",t:"Alert when one session ID is used from two different source IPs",b:"b1"},
  {id:"c2",t:"Hunt the auth logs for a successful login that reuses the pre-login session ID",b:"b1"},
  {id:"c3",t:"Add a detection rule for many logins from one source in a short window",b:"b1"},
  {id:"c4",t:"Share the reused session ID with the IR team as an indicator of compromise",b:"b1"},
  {id:"c5",t:"Fix the victim's session ID before login and keep the same value after login",b:"b2"},
  {id:"c6",t:"Stay logged in without re-authenticating so the stolen session stays valid",b:"b2"},
  {id:"c7",t:"Copy the victim's user agent and headers to blend into normal traffic",b:"b2"}],
 hint:"Blue work collects evidence and builds detections. Red work uses the flaw and hides inside normal behaviour.",
 explain:"The blue side turns the weakness into detection and response: correlate one session ID across two IPs, hunt logs for a reused pre-login session, alert on login bursts, and share the session ID as an indicator of compromise so the IR team can search for it. The red side uses the flaw: session fixation forces a known session ID so the attacker already holds the session, staying authenticated avoids a fresh login challenge, and copying the victim's headers and user agent makes the session look normal. The same bug teaches both teams.",
 focus:"Practise looking at one weakness from both the detection and the exploitation side."},

{id:"q19",type:"branch",theme:"Secure Engineering",base:8,
 q:"Release night. Work the production release gate with the release manager.",
 steps:[
  {sit:"A critical SQL injection finding in the checkout service is still open. The release manager asks you to sign off. What do you do?",
   opts:[
    {t:"Block the release, or require the fix plus a retest before shipping",pts:2,fb:"Correct. A critical, exploitable flaw in a payment path is a stop sign. The gate exists for exactly this moment."},
    {t:"Ship it and add a WAF rule as the only control",pts:1,fb:"Partly right. A WAF rule reduces risk but it is a compensating control, not a fix. The code is still vulnerable to bypasses."},
    {t:"Ship it because the internal firewall hides the service",pts:0,fb:"No. A network control is not a fix for an application flaw, and one exposed path defeats the whole argument."}]},
  {sit:"The business decides to accept the risk and ship anyway. What must the record contain?",
   opts:[
    {t:"A written risk acceptance, a compensating control and a named owner with a date",pts:2,fb:"Correct. A real acceptance names who owns the risk, what temporary control is in place, and when it will be fixed."},
    {t:"A chat message from the release manager saying it is fine",pts:0,fb:"No. A chat message is not a risk record. It names no owner, no control and no date."},
    {t:"Nothing, because a WAF rule already exists",pts:0,fb:"No. A control does not replace accountability. The accepted risk still needs a document and an owner."}]},
  {sit:"The service ships with a WAF rule as a temporary control. Which telemetry proves the control works and the app is still attacked?",
   opts:[
    {t:"WAF block events plus application logs that show parameterized queries in the new build",pts:2,fb:"Correct. You combine the control's own events with the app's own evidence, so you can see both attempts and the real fix."},
    {t:"Only the WAF dashboard block count",pts:1,fb:"Partly right. The count shows attacks, but it cannot show whether the app itself is fixed."},
    {t:"The developer's unit test report from the last sprint",pts:0,fb:"No. A unit test report is not runtime telemetry for a live control."}]}],
 hint:"At a release gate, separate the code fix from the temporary control, and name the owner of any accepted risk.",
 explain:"A production release gate balances risk and business pressure, but the record always matters. A critical exploitable flaw in a payment path stops the release unless the business formally accepts the risk. That acceptance must name an owner, a compensating control and a fix date. After shipping, you prove the control works with actionable telemetry: WAF events for blocked attempts plus application logs that show the code now uses parameterized queries. Detection without the code fix only buys time.",
 focus:"Learn how compensating controls, risk acceptance and production telemetry fit together."},

{id:"q20",type:"spot",theme:"Logging & Detection",base:6,
 q:"Code review: this logger writes too much. Click every line that logs a secret. There are three.",
 lines:[
  "const logger = require('pino')({ level: 'debug' });",
  "logger.info({ msg: 'login attempt', user: req.body.user });",
  "logger.debug({ msg: 'auth', headers: req.headers });",
  "logger.info({ msg: 'reset', token: req.query.token });",
  "logger.info({ msg: 'ok', requestId: req.id });",
  "logger.info({ msg: 'session', sid: req.session.id });",
  "logger.error({ msg: 'db fail', err: err });"],
 correct:[3,4,6],
 hint:"Ask what an attacker gains if they can read the log file. Cookies, tokens and live session IDs all qualify.",
 explain:"Line 3 logs all request headers, which include cookies and bearer tokens. Line 4 logs the password reset token, which is enough to take over an account. Line 6 logs the live session ID, so anyone who reads the logs can hijack the session. Line 2 logs a username and line 7 logs an error object, and both are normal audit data. This is why structured logging matters: you log named fields you choose, and you redact secrets before they reach the log.",
 focus:"Learn to spot secrets in logs: credentials, tokens, session IDs and full headers."},

{id:"q21",type:"terminal",theme:"Logging & Detection",base:5,
 q:"Threat hunt: in the SIEM, auth events sit in index=auth with fields user, src_ip and action. Write a search for successful logins from 10[.]0[.]0[.]42. Type it and press Enter.",
 host:"hunt@siem-console:~",
 intro:"Available fields: index, user, src_ip, action (success|fail), _time\n",
 expected:["index\\s*=\\s*auth",/10\[\.\]0\[\.\]0\[\.\]42|10\.0\.0\.42/,"success"],
 solution:"index=auth src_ip=10[.]0[.]0[.]42 action=success",
 simout:"3 events\n02:14:09  user=svc_backup  src_ip=10[.]0[.]0[.]42  action=success\n02:31:44  user=svc_backup  src_ip=10[.]0[.]0[.]42  action=success\n03:02:18  user=deploy_bot  src_ip=10[.]0[.]0[.]42  action=success",
 hint:"A hunt needs three parts: the data set, the address, and the outcome you are looking for.",
 explain:"Threat hunting starts from a question, not an alert. Here the question is: did a strange address ever log in successfully? The search names the data set (index=auth), the field and value (src_ip=10[.]0[.]0[.]42) and the outcome (action=success). The result turns a vague worry into three concrete events with users and times, which you can escalate or close. Hunting is how you find what no rule was written for yet.",
 focus:"Learn to write a targeted SIEM search with a data set, a field and an outcome."},

{id:"q22",type:"mcq",theme:"Secure SDLC",base:5,
 q:"You must report a SQL injection finding to the developer who wrote the code. Which message is best?",
 options:[
  {id:"o1",t:"Line 88 joins user input into the query. Use a parameterized query (CWE-89)."},
  {id:"o2",t:"This code is insecure. Rewrite the whole database layer before the next release."},
  {id:"o3",t:"The scanner found something on the invoice page. Please take a look when you can."},
  {id:"o4",t:"Security issue, see ticket. Fix it or we will block the Friday production release."}],
 correct:["o1"],
 hint:"Think about what a busy developer needs in order to act, and how they would like to be spoken to.",
 explain:"Developer-analyst collaboration works when the report is exact and kind. Line 88 plus the exact fix, a parameterized query, plus the shared CWE-89 reference lets the developer act in minutes and learn the pattern. A vague report wastes time, and a hostile or threatening report makes developers hide problems instead of fixing them. The goal is fewer flaws in production, not winning an argument.",
 focus:"Learn to write a precise, blame-free finding report that developers can act on."},

{id:"q23",type:"order",theme:"Vulnerability Management",base:6,
 q:"A penetration test produced 14 findings. Put the remediation workflow in the correct order.",
 items:[
  {id:"a",t:"Triage and rank each finding with CVSS and business context"},
  {id:"b",t:"Report the finding to the development team with clear reproduction steps"},
  {id:"c",t:"Fix the code, or apply the vendor patch through patch management"},
  {id:"d",t:"Retest the original attack path to confirm the fix"},
  {id:"e",t:"Check the rest of the app for a security regression"},
  {id:"f",t:"Close the finding and update the threat model and detection rules"}],
 hint:"You cannot act on fourteen findings at once, and you never close one without proof. Where does the side-effect check belong?",
 explain:"Findings are ranked first, because you cannot fix everything at once and business context decides the order. Then the finding goes to the developers with reproduction steps. The fix follows: code changes, or a vendor patch handled through patch management. Then you retest the original attack path to prove it is closed. Next you check for a security regression, because a fix can open a new hole. Finally you close the finding and feed the lesson back into the threat model and the detection rules, so the same class of flaw is caught earlier next time.",
 focus:"Learn the full remediation lifecycle from triage to retest to regression check."},

{id:"q24",type:"fill",theme:"Secure Engineering",base:6,
 q:"Complete the secure code. Drag the right token into each gap.",
 text:"const email = req.body.email;\ndb.query('SELECT * FROM users WHERE email = {{0}}', {{1}}, cb);\nres.cookie('sid', sid, { httpOnly: true, {{2}}: true, sameSite: 'lax' });",
 answers:["?","[email]","secure"],
 bank:["?","[email]","secure","+ email","$email","httpOnly","encrypt","domain"],
 hint:"Keep the data separate from the query text. The cookie must not travel over plain HTTP.",
 explain:"Parameterized queries separate the query text from the data. The database receives the query with a placeholder and the values as a separate list, so user input can never change the query structure. This is the real fix for SQL injection, not escaping by hand. On the cookie, the secure flag means the browser sends it only over HTTPS, so it cannot leak on a plain HTTP request. Together with httpOnly, this protects the session from two common attacks.",
 focus:"Learn the exact shape of a parameterized query and of hardened cookie options."},

{id:"q25",type:"spot",theme:"Secure Engineering",base:6,
 q:"Session configuration review for the customer portal. Click every line that carries a security flaw. There are three.",
 lines:[
  "app.use(session({",
  "  secret: 'northwind-secret-2024',",
  "  resave: false,",
  "  saveUninitialized: true,",
  "  cookie: { httpOnly: true, secure: false, sameSite: 'none' }",
  "}));",
  "app.use('/admin', requireAuth);"],
 correct:[2,4,5],
 hint:"Think about where the secret comes from, when a session is created, and how the cookie must travel.",
 explain:"Line 2 hardcodes the signing secret in source code. Anyone with repository access can forge a session. The secret belongs in a secret manager and must be rotated. Line 4 sets saveUninitialized to true, so every anonymous visitor gets a session, which expands the attack surface and feeds session fixation. Line 5 sets secure to false, so the cookie can travel over plain HTTP, and sameSite none allows cross-site sending. On a customer portal the cookie should be secure and SameSite=Lax or Strict.",
 focus:"Learn the safe values for session secrets, session creation and cookie flags."},

{id:"q26",type:"spot",theme:"Logging & Detection",base:6,logview:true,
 q:"Web access log for the billing app, streamed from the SIEM. Use the filter box, then click every line that shows a SQL injection attempt. There are two.",
 lines:[
  '10[.]0[.]0[.]42 - - [12/Mar/2026:02:14:07] "GET /catalog?cat=shoes HTTP/1.1" 200 412',
  '10[.]0[.]0[.]42 - - [12/Mar/2026:02:14:09] "GET /item?id=1%27%20OR%20%271%27%3D%271 HTTP/1.1" 500 198',
  '10[.]0[.]0[.]42 - - [12/Mar/2026:02:14:11] "GET /item?id=1%20UNION%20SELECT%20user,pass%20FROM%20users HTTP/1.1" 200 8821',
  '10[.]0[.]0[.]42 - - [12/Mar/2026:02:14:13] "GET /search?q=%3Cscript%3Ealert(1)%3C%2Fscript%3E HTTP/1.1" 200 460',
  '10[.]0[.]0[.]42 - - [12/Mar/2026:02:14:15] "GET /health HTTP/1.1" 200 12',
  '10[.]0[.]0[.]42 - - [12/Mar/2026:02:14:17] "POST /login HTTP/1.1" 302 0'],
 correct:[2,3],
 hint:"A SQL injection probe puts SQL syntax into a parameter. A cross-site scripting probe puts HTML tags there instead.",
 explain:"Line 2 sends id=1%27%20OR%20%271%27%3D%271. Decoded, it puts a single quote, then OR, then a second test into the id parameter. This is the classic boolean SQL injection probe: weak input validation lets the quote break out of the query string, and the server answers 500. Line 3 sends a UNION SELECT that tries to read the user table through the same parameter. Its answer is 200 with 8,821 bytes, so the query likely succeeded: this is a successful attack, not only a probe. Line 4 is also malicious, but it is cross-site scripting (XSS), not SQL injection. Lines 1, 5 and 6 are normal traffic.",
 focus:"Learn to read URL-encoded attacks inside an access log, and to tell injection from XSS."}
];

/* ============================ STATE ============================ */
var ST={};
var selChip=null;

function byId(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmtTime(s){if(s<0)s=0;var m=Math.floor(s/60);var r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
function hl(s){
  var e=esc(s);
  e=e.replace(/([a-z_]+)=/g,'<span class="lk">$1=</span>');
  e=e.replace(/(10\[\.\]0\[\.\]0\[\.\]42)/g,'<span class="lh">$1</span>');
  return e;
}
function animateScore(target){
  var el=byId('bigScore');if(!el)return;
  var cur=0;var step=Math.max(1,Math.round(target/40));
  var t=setInterval(function(){cur+=step;if(cur>=target){cur=target;clearInterval(t);}el.textContent=cur+'%';},26);
}

/* ============================ INTRO ============================ */
function renderIntro(){
  var kws=KEYWORDS.map(function(g){
    return '<div class="kwcard"><div class="kwt">'+esc(g.theme)+'</div><div>'+g.words.map(function(w){return '<span class="kw">'+esc(w)+'</span>';}).join('')+'</div></div>';
  }).join('');
  var types=[
    ["Scenario simulations","Work a live SOC alert queue and branching incidents, step by step."],
    ["Drag &amp; drop","Move cards into the correct control family, phase or bucket."],
    ["Timelines &amp; ranking","Reorder SDLC phases, response steps and findings by urgency."],
    ["Log &amp; code analysis","Filter a live log viewer and read real code, then click the flawed lines."],
    ["Terminal emulator","Type real grep, curl and SIEM commands in a safe fake shell."],
    ["Fill in the blank","Complete findings, policies and secure code from a shuffled bank."],
    ["QCM (limited)","Only five multiple-choice questions, with close distractors."]
  ];
  var t=types.map(function(x){return '<li><b>'+x[0]+'</b> — '+x[1]+'</li>';}).join('');
  var mins=Math.round(QUESTIONS.reduce(function(s,q){return s+TIME[q.type];},0)/60);
  var html='';
  html+='<div class="card hero">';
  html+='<h1>Secure SDLC &amp; AppSec Defense — Certification Exam</h1>';
  html+='<p class="sub">A hands-on certification exam built from the source material on secure software development and its effect on the work of a cybersecurity analyst.</p>';
  html+='<span class="pill">'+QUESTIONS.length+' exercises</span><span class="pill">Pass mark: 80%</span><span class="pill">Time limit: ~'+mins+' minutes</span><span class="pill">Hints cost 10% each</span><span class="pill hot">Difficulty: hard to extreme</span>';
  html+='</div>';
  html+='<div class="card"><h2>How this exam works</h2><ul class="rules">'+t+'</ul>';
  html+='<p style="color:#9fbdd1;margin-top:10px">Every answer is graded at once, with a clear explanation. A hint lowers that question score by 10%. The timer can be paused, but while it is paused the question is hidden so you cannot read it.</p>';
  html+='<div class="legend"><span><i class="dot" style="background:#22c55e"></i>correct</span><span><i class="dot" style="background:#f59e0b"></i>partly correct</span><span><i class="dot" style="background:#ef4444"></i>wrong</span></div></div>';
  html+='<div class="card"><h2>Keywords covered by this exam</h2><div class="grid2">'+kws+'</div></div>';
  html+='<div class="card"><h2>Start</h2><div class="namebox"><input type="text" id="nameInput" placeholder="Your name (printed on the certificate)" maxlength="40"><button class="btn primary" onclick="startExam()">Start exam</button></div></div>';
  byId('screenIntro').innerHTML=html;
  byId('screenIntro').classList.remove('hide');
  byId('screenExam').classList.add('hide');
  byId('screenResults').classList.add('hide');
}

/* ============================ EXAM ============================ */
function startExam(){
  var nm=(byId('nameInput')&&byId('nameInput').value.trim())||'Anonymous Analyst';
  ST={name:nm,qs:shuffle(QUESTIONS.slice()),optOrder:{},itemOrder:{},results:{},hints:{},idx:0,paused:false,timerId:null,branchData:null};
  ST.totalBase=ST.qs.reduce(function(s,q){return s+q.base;},0);
  ST.maxTime=ST.qs.reduce(function(s,q){return s+(TIME[q.type]||90);},0);
  ST.timeLeft=ST.maxTime;
  byId('screenIntro').classList.add('hide');
  byId('screenResults').classList.add('hide');
  byId('screenExam').classList.remove('hide');
  updateDash();
  renderQuestion();
  startTimer();
  window.scrollTo(0,0);
}

function startTimer(){
  if(ST.timerId)clearInterval(ST.timerId);
  ST.timerId=setInterval(function(){
    if(ST.paused)return;
    ST.timeLeft--;
    tickTimer();
    if(ST.timeLeft<=0){clearInterval(ST.timerId);ST.timerId=null;finishExam();}
  },1000);
}

function togglePause(){
  if(!ST||!ST.qs)return;
  ST.paused=!ST.paused;
  byId('pauseOverlay').classList.toggle('hide',!ST.paused);
  byId('examContent').classList.toggle('blurred',ST.paused);
  updateDash();
}

function themeBadges(){
  var map={};
  ST.qs.forEach(function(q){ if(!map[q.theme])map[q.theme]={t:0,d:0}; map[q.theme].t++; if(ST.results[q.id])map[q.theme].d++; });
  return Object.keys(map).map(function(k){
    var m=map[k];
    return '<span class="tbadge'+(m.d===m.t?' done':'')+'">'+esc(k)+' '+m.d+'/'+m.t+'</span>';
  }).join('');
}

function updateDash(){
  var answered=0,earned=0;
  ST.qs.forEach(function(q){var r=ST.results[q.id];if(r){answered++;earned+=r.earned;}});
  var pct=ST.totalBase?Math.round(earned/ST.totalBase*100):0;
  var prog=Math.round(answered/ST.qs.length*100);
  var low=ST.timeLeft<=120;
  var h='';
  h+='<div><div class="dtitle">Secure SDLC &amp; AppSec Defense — Certification Exam</div>';
  h+='<div class="dbar"><div class="dfill" style="width:'+prog+'%"></div></div>';
  h+='<div class="dsub">'+answered+' of '+ST.qs.length+' answered &nbsp;•&nbsp; pass mark 80%</div>';
  h+='<div class="themes">'+themeBadges()+'</div></div>';
  h+='<div class="dright">';
  h+='<div class="stat"><span class="sl">Score</span><span class="sv'+(pct>=80?' g':'')+'">'+pct+'%</span></div>';
  h+='<div class="stat"><span class="sl">Points</span><span class="sv">'+earned+'/'+ST.totalBase+'</span></div>';
  h+='<div class="stat timer'+(low?' low':'')+'"><span class="sl">Time</span><span class="sv" id="timeVal">'+fmtTime(ST.timeLeft)+'</span></div>';
  h+='<button class="btn small" onclick="togglePause()">'+(ST.paused?'Resume':'Pause')+'</button>';
  h+='</div>';
  byId('dash').innerHTML=h;
}

function panelHtml(p){
  if(p.kind==='ticket')return '<div class="panel"><div class="ptitle">'+esc(p.title)+'</div>'+p.lines.map(function(l){return '<div class="pline">'+esc(l)+'</div>';}).join('')+'</div>';
  return '';
}

function tickTimer(){
  var el=byId('timeVal');
  if(!el)return;
  el.textContent=fmtTime(ST.timeLeft);
  var box=el.parentNode;
  if(ST.timeLeft<=120)box.classList.add('low');else box.classList.remove('low');
}

function renderQuestion(){
  var q=ST.qs[ST.idx];
  var h='';
  h+='<div class="qhead"><span class="qnum">Question '+(ST.idx+1)+' / '+ST.qs.length+'</span><span class="tag">'+esc(q.theme)+'</span><span class="tag pts">'+q.base+' pts</span></div>';
  h+='<div class="qtext">'+esc(q.q)+'</div>';
  if(q.panel)h+=panelHtml(q.panel);
  h+='<div id="qbody">'+bodyHtml(q)+'</div>';
  h+='<div id="hintbox"></div>';
  h+='<div id="feedback"></div>';
  if(q.type==='branch'){
    h+='<div class="actions" id="actions"><button class="btn warn" id="hintBtn" onclick="useHint()">Hint (-10%)</button></div>';
  }else{
    h+='<div class="actions" id="actions"><button class="btn warn" id="hintBtn" onclick="useHint()">Hint (-10%)</button><button class="btn primary" id="submitBtn" onclick="submitCurrent()">Submit answer</button></div>';
  }
  byId('qhost').innerHTML=h;
  if(q.type==='branch'){ST.branchData={i:0,pts:[],picks:[]};renderBranchStep();}
}

function bodyHtml(q){
  if(q.type==='mcq')return bodyMcq(q);
  if(q.type==='drop')return bodyDrop(q);
  if(q.type==='fill')return bodyFill(q);
  if(q.type==='order'||q.type==='rank')return bodyOrder(q);
  if(q.type==='spot')return bodySpot(q);
  if(q.type==='terminal')return bodyTerm(q);
  if(q.type==='branch')return '';
  return '';
}

function chipHtml(id,text,word){
  return '<div class="chip" draggable="true" data-chip="'+esc(id)+'"'+(word?' data-word="'+esc(word)+'"':'')+' ondragstart="dragStart(event,this)" onclick="tapChip(this)">'+esc(text)+'</div>';
}

function bodyMcq(q){
  if(!ST.optOrder[q.id])ST.optOrder[q.id]=shuffle(q.options.map(function(o){return o.id;}));
  var h='<div class="opts">';
  ST.optOrder[q.id].forEach(function(oid){
    var o=q.options.filter(function(x){return x.id===oid;})[0];
    h+='<div class="opt'+(q.multi?' multi':'')+'" data-oid="'+o.id+'" onclick="pickOpt(this)"><span class="mark"></span><span class="ot">'+esc(o.t)+'</span></div>';
  });
  h+='</div>';
  if(q.multi)h+='<div class="hintline">Select all that apply. Partial credit is possible, and wrong picks cancel right ones.</div>';
  return h;
}

function bodyDrop(q){
  var h='<div class="zones">';
  q.buckets.forEach(function(b){
    h+='<div class="zone" data-zone="'+b.id+'" ondragover="zoneOver(event,this)" ondragleave="zoneLeave(this)" ondrop="dropChip(event,this)" onclick="tapZone(this)">';
    h+='<div class="zlabel">'+esc(b.label)+'</div>';
    if(b.sub)h+='<div class="zsub">'+esc(b.sub)+'</div>';
    h+='<div class="zlist" data-list="'+b.id+'"></div></div>';
  });
  h+='</div>';
  h+='<div class="poollabel">Drag a card into a column, or tap the card and then tap the column. Tap a placed card to send it back.</div>';
  h+='<div class="pool" data-zone="__pool" data-list="__pool" ondragover="zoneOver(event,this)" ondrop="dropChip(event,this)" onclick="tapZone(this)">';
  shuffle(q.chips.slice()).forEach(function(c){h+=chipHtml(c.id,c.t);});
  h+='</div>';
  return h;
}

function bodyFill(q){
  var parts=q.text.split(/\{\{(\d+)\}\}/);
  var h='<div class="fillwrap">';
  for(var i=0;i<parts.length;i++){
    if(i%2===0){h+=esc(parts[i]);}
    else{h+='<span class="blank zone" data-zone="bl_'+parts[i]+'" data-blank="'+parts[i]+'" ondragover="zoneOver(event,this)" ondragleave="zoneLeave(this)" ondrop="dropChip(event,this)" onclick="tapZone(this)"></span>';}
  }
  h+='</div>';
  h+='<div class="poollabel">Drag a word into a gap, or tap the word and then tap the gap. Tap a placed word to send it back.</div>';
  h+='<div class="pool" data-zone="__pool" data-list="__pool" ondragover="zoneOver(event,this)" ondrop="dropChip(event,this)" onclick="tapZone(this)">';
  shuffle(q.bank.slice()).forEach(function(w,ix){h+=chipHtml('w'+ix,w,w);});
  h+='</div>';
  return h;
}

function bodyOrder(q){
  if(!ST.itemOrder[q.id]){
    var ids=q.items.map(function(i){return i.id;});
    var sh=shuffle(ids.slice());
    var same=true;for(var i=0;i<ids.length;i++)if(ids[i]!==sh[i])same=false;
    if(same)sh=shuffle(ids.slice());
    ST.itemOrder[q.id]=sh;
  }
  var items=q.items;
  var h='<div class="olist" ondragover="event.preventDefault()" ondrop="dropOrder(event,this)">';
  ST.itemOrder[q.id].forEach(function(iid){
    var it=items.filter(function(x){return x.id===iid;})[0];
    h+='<div class="oitem" draggable="true" data-chip="'+it.id+'" ondragstart="dragStart(event,this)" ondrop="dropOrder(event,this)">';
    h+='<span class="drag">::</span><span class="ot">'+esc(it.t)+'</span>';
    h+='<span class="mv"><button type="button" onclick="moveItem(this,-1)">UP</button><button type="button" onclick="moveItem(this,1)">DN</button></span></div>';
  });
  h+='</div>';
  h+='<div class="hintline">Drag to reorder, or use the UP and DN buttons. Position 1 is the top.</div>';
  return h;
}

function bodySpot(q){
  if(q.logview)return bodyLogView(q);
  var h='<pre class="code">';
  q.lines.forEach(function(l,i){
    h+='<div class="codeline" data-line="'+(i+1)+'" onclick="toggleLine(this)"><span class="ln">'+(i+1)+'</span><span class="lc">'+esc(l)+'</span></div>';
  });
  h+='</pre>';
  h+='<div class="hintline">Click a line to mark it, and click again to undo.</div>';
  return h;
}

function bodyLogView(q){
  var h='<div class="logbar"><span class="ll">Filter</span><input type="text" id="logfilter" placeholder="type to filter, e.g. id= or UNION" oninput="filterLog()" autocomplete="off" spellcheck="false"></div>';
  h+='<div class="logview" id="logview">';
  q.lines.forEach(function(l,i){
    h+='<div class="logline" data-line="'+(i+1)+'" onclick="toggleLine(this)"><span class="ln">'+(i+1)+'</span><span class="lc">'+hl(l)+'</span></div>';
  });
  h+='</div>';
  h+='<div class="hintline">Filter the view, then click every line that shows a SQL injection attempt. Click again to undo.</div>';
  return h;
}

function filterLog(){
  var el=byId('logfilter');if(!el)return;
  var v=(el.value||'').toLowerCase();
  var ls=document.querySelectorAll('#logview .logline');
  for(var i=0;i<ls.length;i++){
    var t=ls[i].textContent.toLowerCase();
    ls[i].style.display=(!v||t.indexOf(v)>=0)?'':'none';
  }
}

function bodyTerm(q){
  var h='<div class="term">';
  h+='<div class="termbar">'+esc(q.host||'analyst@host')+' — simulated shell (nothing leaves your browser)</div>';
  h+='<div class="termout" id="termout"><span class="dim">'+esc(q.intro||'')+'</span></div>';
  h+='<div class="termin"><span class="ps1">$</span><input type="text" id="terminput" autocomplete="off" spellcheck="false" placeholder="type the command and press Enter" onkeydown="if(event.key===\'Enter\'){event.preventDefault();runCmd();}"></div>';
  h+='</div>';
  h+='<div class="hintline">Press Enter to run the command. Submit the answer when your command looks right.</div>';
  return h;
}

/* ============================ INTERACTIONS ============================ */
function pickOpt(el){
  var q=ST.qs[ST.idx];
  if(q.multi){el.classList.toggle('sel');}
  else{
    var all=el.parentNode.querySelectorAll('.opt');
    for(var i=0;i<all.length;i++)all[i].classList.remove('sel');
    el.classList.add('sel');
  }
}

function clearSel(){
  selChip=null;
  var c=document.querySelectorAll('#qbody .chip.sel');
  for(var i=0;i<c.length;i++)c[i].classList.remove('sel');
}

function tapChip(el){
  var inPool=el.parentNode&&el.parentNode.classList.contains('pool');
  if(!inPool){poolEl().appendChild(el);clearSel();return;}
  if(selChip===el){clearSel();return;}
  clearSel();
  selChip=el;el.classList.add('sel');
}

function tapZone(el){
  if(!selChip)return;
  var list=el.classList.contains('pool')?el:(el.querySelector('.zlist')||el);
  placeChip(selChip,list);
}

function poolEl(){return document.querySelector('#qbody .pool');}

function placeChip(chip,list){
  if(list.getAttribute('data-blank')!==null){
    var ex=list.querySelector('.chip');
    if(ex)poolEl().appendChild(ex);
  }
  list.appendChild(chip);
  clearSel();
}

function dragStart(e,el){
  e.dataTransfer.setData('text/plain',el.getAttribute('data-chip'));
  e.dataTransfer.effectAllowed='move';
  el.classList.add('dragging');
  var self=el;
  setTimeout(function(){self.classList.remove('dragging');},0);
}

function zoneOver(e,el){e.preventDefault();el.classList.add('hot');}
function zoneLeave(el){el.classList.remove('hot');}

function dropChip(e,el){
  e.preventDefault();
  el.classList.remove('hot');
  var id=e.dataTransfer.getData('text/plain');if(!id)return;
  var chip=document.querySelector('#qbody .chip[data-chip="'+id+'"]');if(!chip)return;
  if(el.classList.contains('pool')){el.appendChild(chip);clearSel();return;}
  var list=el.querySelector('.zlist')||el;
  placeChip(chip,list);
}

function dropOrder(e,el){
  e.preventDefault();
  e.stopPropagation();
  var id=e.dataTransfer.getData('text/plain');if(!id)return;
  var chip=document.querySelector('#qbody .oitem[data-chip="'+id+'"]');if(!chip)return;
  var list=document.querySelector('#qbody .olist');
  if(el.classList.contains('oitem'))list.insertBefore(chip,el);else list.appendChild(chip);
}

function moveItem(btn,dir){
  var item=btn.closest('.oitem');
  if(!item)return;
  if(dir<0&&item.previousElementSibling)item.parentNode.insertBefore(item,item.previousElementSibling);
  if(dir>0&&item.nextElementSibling)item.parentNode.insertBefore(item.nextElementSibling,item);
}

function toggleLine(el){el.classList.toggle('picked');}

function runCmd(){
  var q=ST.qs[ST.idx];
  var inp=byId('terminput');if(!inp)return;
  var v=inp.value.trim();
  var out=byId('termout');
  if(!v)return;
  out.innerHTML+='\n<span class="dim">$ </span>'+esc(v);
  var ok=true;
  for(var i=0;i<q.expected.length;i++){
    var rx=q.expected[i];
    if(rx instanceof RegExp){ if(!rx.test(v))ok=false; }
    else{ if(!(new RegExp(rx,'i')).test(v))ok=false; }
  }
  if(ok)out.innerHTML+='\n<span>'+esc(q.simout)+'</span>';
  else out.innerHTML+='\n<span class="err">No result in this simulation. Check the command, the flags and the file name.</span>';
  out.scrollTop=out.scrollHeight;
}

function useHint(){
  var q=ST.qs[ST.idx];
  if(ST.results[q.id])return;
  if(ST.hints[q.id])return;
  ST.hints[q.id]=true;
  byId('hintbox').innerHTML='<div class="hintbox"><b>Hint (-10% of this question):</b> '+esc(q.hint)+'</div>';
  byId('hintBtn').disabled=true;
  byId('hintBtn').textContent='Hint used';
}

/* ============================ BRANCH ============================ */
function renderBranchStep(){
  var q=ST.qs[ST.idx],i=ST.branchData.i,st=q.steps[i];
  var h='<div class="bstage" style="color:#7fb4c9;font-size:12px;font-weight:800;margin-bottom:6px">STAGE '+(i+1)+' OF '+q.steps.length+'</div>';
  h+='<div class="bsit" style="background:#0a141d;border:1px solid #1c3446;border-radius:10px;padding:12px;margin-bottom:12px">'+esc(st.sit)+'</div>';
  h+='<div class="opts">';
  st.opts.forEach(function(o,k){
    h+='<div class="opt" onclick="branchPick('+k+')"><span class="ot">'+esc(o.t)+'</span></div>';
  });
  h+='</div>';
  byId('qbody').innerHTML=h;
}

function branchPick(k){
  var q=ST.qs[ST.idx],i=ST.branchData.i,st=q.steps[i],o=st.opts[k];
  ST.branchData.pts.push(o.pts);
  ST.branchData.picks.push(o.t);
  var maxp=0;st.opts.forEach(function(x){if(x.pts>maxp)maxp=x.pts;});
  var cls=(o.pts===maxp)?'ok':(o.pts>0?'part':'bad');
  var title=(o.pts===maxp)?'Best choice':(o.pts>0?'Partly right':'Not the right move');
  var h='<div style="background:#0a141d;border:1px solid #1c3446;border-radius:10px;padding:12px;margin-bottom:12px">'+esc(st.sit)+'</div>';
  h+='<div class="fb '+cls+'"><div class="fbtitle">'+title+' (+'+o.pts+' / '+maxp+')</div><div class="fbtext">'+esc(o.fb)+'</div></div>';
  h+='<div class="actions"><button class="btn primary" onclick="branchNext()">'+(i===q.steps.length-1?'See result':'Continue')+'</button></div>';
  byId('qbody').innerHTML=h;
}

function branchNext(){
  var q=ST.qs[ST.idx];
  ST.branchData.i++;
  if(ST.branchData.i>=q.steps.length)finishBranch();
  else renderBranchStep();
}

function finishBranch(){
  var q=ST.qs[ST.idx];
  var pts=0;ST.branchData.pts.forEach(function(p){pts+=p;});
  var max=0;q.steps.forEach(function(s){var m=0;s.opts.forEach(function(o){if(o.pts>m)m=o.pts;});max+=m;});
  recordResult(q,pts/max,ST.branchData.picks);
  lockBody();
  showFeedbackAndNext(q);
}

/* ============================ GRADING ============================ */
function recordResult(q,frac,summary){
  var hintPen=ST.hints[q.id]?Math.round(q.base*0.1):0;
  var raw=Math.round(q.base*frac);
  var earned=Math.max(0,raw-hintPen);
  ST.results[q.id]={base:q.base,frac:frac,raw:raw,earned:earned,hintPen:hintPen,summary:summary};
}

function gradeQuestion(q){
  if(q.type==='mcq'){
    var sel=[];var opts=document.querySelectorAll('#qbody .opt.sel');
    for(var i=0;i<opts.length;i++)sel.push(opts[i].getAttribute('data-oid'));
    var tp=0,fp=0;
    sel.forEach(function(x){if(q.correct.indexOf(x)>=0)tp++;else fp++;});
    var frac=q.multi?Math.max(0,tp-fp)/q.correct.length:((tp===q.correct.length&&fp===0)?1:0);
    var names=sel.map(function(x){return q.options.filter(function(o){return o.id===x;})[0].t;});
    return {frac:Math.min(1,frac),summary:names.length?names.join(' | '):'No answer given'};
  }
  if(q.type==='drop'){
    var map={};
    q.buckets.forEach(function(b){
      var list=document.querySelector('#qbody .zlist[data-list="'+b.id+'"]');
      var chips=list.querySelectorAll('.chip');
      for(var j=0;j<chips.length;j++)map[chips[j].getAttribute('data-chip')]=b.id;
    });
    var good=0,bad=0;var parts=[];
    q.chips.forEach(function(c){
      var where=map[c.id];
      if(where===c.b){good++;parts.push(c.t+' -> '+bucketLabel(q,c.b));}
      else if(where){bad++;parts.push(c.t+' -> WRONG');}
      else parts.push(c.t+' -> unplaced');
    });
    return {frac:Math.max(0,good-bad)/q.chips.length,summary:parts.join(' ;; ')};
  }
  if(q.type==='fill'){
    var ok=0;var pr=[];
    q.answers.forEach(function(ans,idx){
      var bl=document.querySelector('#qbody .blank[data-blank="'+idx+'"]');
      var chip=bl?bl.querySelector('.chip'):null;
      var word=chip?chip.getAttribute('data-word'):'';
      if(word===ans)ok++; 
      pr.push('['+(idx+1)+'] '+(word||'(empty)'));
    });
    return {frac:ok/q.answers.length,summary:pr.join('  ')};
  }
  if(q.type==='order'||q.type==='rank'){
    var list=document.querySelector('#qbody .olist');
    var seq=[];for(var k=0;k<list.children.length;k++)seq.push(list.children[k].getAttribute('data-chip'));
    var good2=0;var pr2=[];
    for(var n=0;n<q.items.length;n++){
      if(seq[n]===q.items[n].id)good2++;
      var nm=seq[n]?q.items.filter(function(x){return x.id===seq[n];})[0].t:'(empty)';
      pr2.push((n+1)+'. '+nm);
    }
    return {frac:good2/q.items.length,summary:pr2.join(' ;; ')};
  }
  if(q.type==='spot'){
    var picked=[];var lines=document.querySelectorAll('#qbody [data-line].picked');
    for(var m=0;m<lines.length;m++)picked.push(parseInt(lines[m].getAttribute('data-line'),10));
    var tp2=0,fp2=0;
    picked.forEach(function(l){if(q.correct.indexOf(l)>=0)tp2++;else fp2++;});
    return {frac:Math.max(0,tp2-fp2)/q.correct.length,summary:picked.length?('Marked line(s) '+picked.join(', ')):'No lines marked'};
  }
  if(q.type==='terminal'){
    var inp=byId('terminput');var v=inp?inp.value.trim():'';
    var hit=0;
    q.expected.forEach(function(rx){
      if(rx instanceof RegExp){if(rx.test(v))hit++;}
      else{if((new RegExp(rx,'i')).test(v))hit++;}
    });
    return {frac:hit/q.expected.length,summary:v?('$ '+v):'No command typed'};
  }
  return {frac:0,summary:'No answer'};
}

function bucketLabel(q,id){
  var b=q.buckets.filter(function(x){return x.id===id;})[0];
  return b?b.label:id;
}

function submitCurrent(){
  var q=ST.qs[ST.idx];
  if(ST.results[q.id])return;
  var g=gradeQuestion(q);
  recordResult(q,g.frac,g.summary);
  var opts=document.querySelectorAll('#qbody .opt');
  for(var i=0;i<opts.length;i++){
    opts[i].classList.add('locked');
    var oid=opts[i].getAttribute('data-oid');
    if(oid&&q.correct&&q.correct.indexOf(oid)>=0)opts[i].classList.add('correct');
    else if(opts[i].classList.contains('sel'))opts[i].classList.add('wrong');
  }
  var marks=document.querySelectorAll('#qbody [data-line]');
  for(var m2=0;m2<marks.length;m2++){
    var ln=parseInt(marks[m2].getAttribute('data-line'),10);
    if(q.correct&&q.correct.indexOf(ln)>=0){marks[m2].classList.remove('picked');marks[m2].classList.add('isright');}
  }
  lockBody();
  showFeedbackAndNext(q);
}

function lockBody(){var qb=byId('qbody');if(qb)qb.style.pointerEvents='none';}

function showFeedbackAndNext(q){
  var r=ST.results[q.id];
  var cls=r.frac>=0.999?'ok':(r.frac>0?'part':'bad');
  var title=r.frac>=0.999?'Correct':(r.frac>0?'Partly correct':'Incorrect');
  var h='<div class="fb '+cls+'"><div class="fbtitle">'+title+' — '+r.earned+' / '+r.base+' points'+(r.hintPen?' (hint penalty: -'+r.hintPen+')':'')+'</div>';
  h+='<div class="fbtext">'+esc(q.explain)+'</div>';
  h+='<div class="fbans"><b>Correct answer:</b> '+correctText(q)+'</div></div>';
  byId('feedback').innerHTML=h;
  var last=ST.idx===ST.qs.length-1;
