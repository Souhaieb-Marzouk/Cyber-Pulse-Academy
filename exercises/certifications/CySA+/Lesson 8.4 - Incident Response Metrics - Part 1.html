<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Cyber Metrics &amp; KPIs — Certification Exam v2.0</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#070d18;--panel:#0e1729;--panel2:#0a1222;--line:#1e2b45;
  --txt:#dce7f7;--mut:#8ea3c4;--acc:#22d3ee;--acc2:#a78bfa;
  --ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--pink:#f472b6;
}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--txt);
  font-family:"Segoe UI",Roboto,system-ui,Arial,sans-serif;
  background-image:radial-gradient(900px 520px at 12% -10%,rgba(34,211,238,.12),transparent),
                   radial-gradient(820px 520px at 100% 0,rgba(167,139,250,.12),transparent);
  min-height:100vh;line-height:1.5;
}
h1,h2,h3,h4{margin:0 0 .5rem}
#hud{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 18px;background:rgba(10,18,34,.92);
  border-bottom:1px solid var(--line);backdrop-filter:blur(8px);
}
.brand{display:flex;align-items:center;gap:10px;font-size:20px}
.bt{font-weight:700;font-size:15px;letter-spacing:.3px}
.bs{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.hudmid{flex:1;min-width:220px}
.hudrow{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:5px}
.bar{height:9px;background:#0a1526;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .45s ease}
.hudright{display:flex;align-items:center;gap:10px}
.timer{font-family:Consolas,Menlo,monospace;font-size:20px;font-weight:700;color:var(--acc);
  background:#08111f;border:1px solid var(--line);border-radius:10px;padding:4px 12px;min-width:86px;text-align:center}
.timer.warn{color:var(--warn);border-color:#5a4212}
.timer.crit{color:var(--bad);border-color:#5a1a1a;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
#stage{max-width:1000px;margin:22px auto 70px;padding:0 16px}
.card{background:linear-gradient(180deg,rgba(18,27,46,.95),rgba(10,18,34,.95));
  border:1px solid var(--line);border-radius:16px;padding:22px}
.btn{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#132039;color:var(--txt);
  padding:10px 16px;font-size:14px;font-weight:600;transition:.18s;font-family:inherit}
.btn:hover{transform:translateY(-1px);border-color:var(--acc)}
.btn.primary{background:linear-gradient(90deg,#0e7490,#7c3aed);border:none;color:#fff}
.btn.ok{background:linear-gradient(90deg,#15803d,#22c55e);border:none;color:#03210f}
.btn.ghost{background:transparent}
.btn.big{padding:14px 26px;font-size:16px}
.btn.small{padding:6px 10px;font-size:12px}
.hidden{display:none!important}
.intro h1{font-size:30px;line-height:1.2}
.intro h1 span{color:var(--acc)}
.ver{display:inline-block;font-size:11px;letter-spacing:1px;text-transform:uppercase;
  border:1px solid var(--acc2);color:var(--acc2);border-radius:99px;padding:2px 10px;margin-bottom:10px}
.lede{color:var(--mut);max-width:760px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0}
.fact{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.fv{font-size:24px;font-weight:800;color:var(--acc)}
.fl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
.rulesbox{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--acc2);
  border-radius:12px;padding:14px 18px;margin:14px 0}
.rulesbox ul{margin:.4rem 0 0;padding-left:1.1rem;color:var(--mut)}
.rulesbox li{margin:.28rem 0}
.kwtitle{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}
.kwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.kwgroup{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kwgroup h4{font-size:12px;color:var(--acc);text-transform:uppercase;letter-spacing:.7px}
.kwchips{display:flex;flex-wrap:wrap;gap:6px}
.kw{font-size:11px;background:#0c1b30;border:1px solid #1c3352;color:#a9c2e6;border-radius:99px;padding:3px 9px}
.qcard{background:linear-gradient(180deg,rgba(18,27,46,.97),rgba(10,18,34,.97));
  border:1px solid var(--line);border-radius:16px;padding:20px 22px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.badge{font-size:11px;text-transform:uppercase;letter-spacing:.7px;border-radius:99px;padding:3px 10px;border:1px solid var(--line)}
.badge.theme{background:#0d2a33;color:var(--acc);border-color:#134e5a}
.badge.type{background:#241a3d;color:var(--acc2);border-color:#3b2a63}
.badge.pts{background:#2a2412;color:var(--warn);border-color:#4d3f14}
.scenario{margin-bottom:14px}
.scn{color:var(--mut);font-size:14px;border-left:3px solid #1f3b5c;padding-left:12px;margin-bottom:12px}
.prm{font-size:15px;font-weight:600}
.subq{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.sublabel{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;
  border-radius:99px;padding:2px 10px;margin-bottom:8px;background:#0d2a33;color:var(--acc)}
.subq:nth-child(2) .sublabel{background:#3a1020;color:var(--pink)}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;margin:8px 0;cursor:pointer;transition:.15s;font-size:14px}
.opt:hover{border-color:var(--acc);background:#0f1e35}
.opt input{margin-top:4px;accent-color:var(--acc)}
.opt:has(input:checked){border-color:var(--acc2);background:#161f3a;box-shadow:0 0 0 1px var(--acc2) inset}
.hintline{font-size:12px;color:var(--warn);margin-bottom:8px}
.qfoot{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.grow{flex:1}
.fb{border-radius:12px;padding:13px 15px;margin-top:16px;font-size:14px;border:1px solid}
.fb.ok{background:rgba(34,197,94,.09);border-color:var(--ok)}
.fb.warn{background:rgba(245,158,11,.09);border-color:var(--warn)}
.fb.bad{background:rgba(239,68,68,.09);border-color:var(--bad)}
.fbttl{font-weight:700;margin-bottom:8px}
.fbrow{margin:6px 0;color:#c7d6ee}
.fbrow b{color:var(--acc)}
.fbrow.tip{background:rgba(245,158,11,.08);border-left:3px solid var(--warn);padding:8px 10px;border-radius:8px}
.lockedbox{pointer-events:none;opacity:.86}
.logwrap{margin-bottom:12px}
.logfilter{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--line);
  background:#060d18;color:var(--txt);font-family:Consolas,monospace;font-size:13px;margin-bottom:8px}
.loglegen{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.lg{font-size:11px;border-radius:99px;padding:2px 9px;border:1px solid var(--line)}
.lg.lok{color:#86efac}.lg.lbad{color:#fca5a5}.lg.lwarn{color:#fcd34d}
.logbox{background:#050b14;border:1px solid var(--line);border-radius:10px;padding:10px;
  max-height:280px;overflow:auto;font-family:Consolas,Menlo,monospace;font-size:12.5px}
.logline{display:flex;gap:10px;padding:2px 4px;border-radius:5px}
.logline:hover{background:#0c1a2e}
.logline .lt{color:#6f86a8;white-space:nowrap}
.logline .lm{color:#bcd3f0;word-break:break-word}
.logline.lbad .lm{color:#fca5a5}
.logline.lok .lm{color:#86efac}
.logline.lwarn .lm{color:#fcd34d}
.matchgrid{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mleft{font-size:13.5px;font-weight:600;color:#cfe0f7}
select.mselect,select.fselect{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
  background:#08111f;color:var(--txt);font-family:inherit;font-size:13px}
.filltext{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:2}
.filltext select{display:inline-block;width:auto;min-width:130px;margin:0 4px}
.calcrow{display:flex;align-items:center;gap:10px}
#calcIn{padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:#08111f;color:var(--txt);font-size:16px;width:200px;font-family:Consolas,monospace}
.unit{color:var(--mut)}
.term{background:#050b14;border:1px solid #1d3a2a;border-radius:10px;padding:12px;font-family:Consolas,monospace}
.termbar{color:var(--ok);font-size:13px;margin-bottom:6px}
.termin{width:100%;background:transparent;border:none;outline:none;color:#a9f5c8;font-family:Consolas,monospace;font-size:14px}
.sortable{list-style:none;margin:0;padding:0;counter-reset:step}
.sortable li{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;margin:8px 0;cursor:grab;font-size:14px}
.sortable li.dragging{opacity:.4;border-style:dashed}
.sortable .num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:50%;background:#0d2a33;color:var(--acc);font-size:12px;font-weight:700;flex:none}
.sortable .txt{flex:1}
.mv{display:flex;gap:4px}
.mv button{background:#0c1b30;border:1px solid var(--line);color:var(--txt);border-radius:6px;
  width:26px;height:26px;cursor:pointer;font-size:11px}
.mv button:hover{border-color:var(--acc)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;background:#08111f;border:1px dashed var(--line);
  border-radius:10px;padding:10px;margin-bottom:14px}
.chip{background:linear-gradient(180deg,#15294a,#0e1e37);border:1px solid #27456e;border-radius:9px;
  padding:8px 12px;font-size:13px;cursor:grab;user-select:none;transition:.15s}
.chip:hover{border-color:var(--acc)}
.chip.sel{border-color:var(--acc2);box-shadow:0 0 0 2px rgba(167,139,250,.45)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bucket{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:110px}
.bucket h4{font-size:12px;color:var(--acc);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
.bucket.over{border-color:var(--acc)}
.bucket .drop{display:flex;flex-direction:column;gap:7px;min-height:70px}
.bnode .bprompt{font-size:14.5px;font-weight:600;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;margin-bottom:10px}
.bchoices{display:grid;gap:8px}
.bchoice{text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:11px 13px;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s}
.bchoice:hover{border-color:var(--acc);background:#0f1e35}
.branchEnd{background:rgba(34,197,94,.09);border:1px solid var(--ok);border-radius:10px;padding:12px;font-size:14px}
.branchlog{margin-top:12px;font-size:12.5px;color:var(--mut)}
.spotline{display:flex;gap:10px;background:#050b14;border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;margin:7px 0;cursor:pointer;font-family:Consolas,monospace;font-size:13px;transition:.15s}
.spotline:hover{border-color:var(--acc)}
.spotline.sel{border-color:var(--bad);background:rgba(239,68,68,.12)}
.sl-num{color:#5f7ba3;flex:none}
.sl-t{color:#bcd3f0;word-break:break-word}
.results h1{font-size:28px}
.verdict{border-radius:16px;padding:22px;text-align:center;margin-bottom:20px;border:2px solid}
.verdict.pass{background:linear-gradient(180deg,rgba(34,197,94,.16),rgba(10,18,34,.6));border-color:var(--ok)}
.verdict.fail{background:linear-gradient(180deg,rgba(239,68,68,.16),rgba(10,18,34,.6));border-color:var(--bad)}
.vscore{font-size:52px;font-weight:900;line-height:1}
.verdict.pass .vscore{color:var(--ok)}
.verdict.fail .vscore{color:var(--bad)}
.vsub{color:var(--mut);margin-top:6px}
.cert{margin-top:14px;background:#071120;border:1px dashed var(--acc);border-radius:12px;padding:16px}
.cert .ct{font-size:19px;font-weight:800;color:var(--acc);letter-spacing:.5px}
.cert .cn{font-size:13px;color:var(--mut);margin-top:4px}
.themebars{margin:18px 0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
.trow{display:grid;grid-template-columns:210px 1fr 50px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.tname{color:#c6d7ef}
.tbar{height:10px;background:#08111f;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.tfill{height:100%;border-radius:99px;transition:width .6s ease}
.tpct{text-align:right;color:var(--mut);font-family:Consolas,monospace}
.rep{border:1px solid var(--line);border-left:4px solid var(--mut);border-radius:10px;margin:9px 0;background:var(--panel2)}
.rep.ok{border-left-color:var(--ok)}
.rep.warn{border-left-color:var(--warn)}
.rep.bad{border-left-color:var(--bad)}
.rep summary{display:flex;gap:10px;align-items:center;padding:11px 13px;cursor:pointer;font-size:13.5px;flex-wrap:wrap}
.repn{font-weight:800;color:var(--acc);min-width:34px}
.rept{flex:1;color:#c6d7ef}
.reps{font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:2px 9px;border-radius:99px}
.reps.ok{background:rgba(34,197,94,.16);color:var(--ok)}
.reps.warn{background:rgba(245,158,11,.16);color:var(--warn)}
.reps.bad{background:rgba(239,68,68,.16);color:var(--bad)}
.repp{font-family:Consolas,monospace;color:var(--mut)}
.repb{padding:4px 14px 14px;font-size:13.5px;color:#c7d6ee;border-top:1px solid var(--line)}
.rrow{margin:8px 0}
.rrow b{color:var(--acc)}
.rrow.tip{background:rgba(245,158,11,.08);border-left:3px solid var(--warn);padding:8px 10px;border-radius:8px}
#pauseOverlay{position:fixed;inset:0;z-index:90;background:#040810;display:flex;align-items:center;justify-content:center;padding:20px}
.pausebox{max-width:460px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px}
.pauseic{font-size:52px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--bad);color:#fff;
  padding:10px 18px;border-radius:99px;font-size:13px;z-index:120;box-shadow:0 8px 24px rgba(0,0,0,.5)}
@media(max-width:640px){
  .mrow{grid-template-columns:1fr}
  .trow{grid-template-columns:120px 1fr 44px}
  #hud{gap:8px;padding:8px 12px}
  .timer{font-size:17px;min-width:74px}
  .intro h1{font-size:23px}
}
</style>
</head>
<body>

<header id="hud">
  <div class="brand">🛡️
    <div><div class="bt">Cyber Metrics &amp; KPIs</div><div class="bs">Certification Exam v2.0</div></div>
  </div>
  <div class="hudmid">
    <div class="hudrow"><span id="qcount">—</span><span id="scoreLbl">0 pts</span></div>
    <div class="bar"><div id="bar" class="fill"></div></div>
  </div>
  <div class="hudright">
    <div id="timer" class="timer">00:00</div>
    <button id="pauseBtn" class="btn small ghost">⏸ Pause</button>
  </div>
</header>

<main id="stage"></main>

<div id="pauseOverlay" class="hidden">
  <div class="pausebox">
    <div class="pauseic">⏸</div>
    <h2>Exam Paused</h2>
    <p>The current question is hidden and the timer is stopped.</p>
    <button id="resumeBtn" class="btn primary big">Resume Exam</button>
  </div>
</div>

<script>
/* ============================ KEYWORDS ============================ */
const KW = {
  "Metrics & KPIs":["Metrics","Key Performance Indicators (KPIs)","Key Risk Indicator (KRI)","Established goals","Progress tracking","Benchmarking","Industry averages","Baseline","Leading indicator","Lagging indicator","Resource allocation","Dashboard","Trend analysis","Balanced scorecard","SMART goals"],
  "Detection & Response Measurement":["Security incidents","Detection time","Mean Time to Detect (MTTD)","Mean Time to Acknowledge (MTTA)","Mean Time to Respond (MTTR)","Dwell time","False positive","False negative","Alert fatigue","Detection rate","Service Level Agreement (SLA)","SLO"],
  "SOC & Incident Response":["Security Operations Center (SOC)","Alert queue","Triage","Escalation","Playbook","Runbook","Shift handover","Case management","Threat hunting","Containment","Eradication","Recovery","Lessons learned","Post-incident review"],
  "Frameworks, Standards & GRC":["NIST CSF","NIST SP 800-137","NIST SP 800-61","ISO/IEC 27001","ISO/IEC 27004","CIS Controls","CIS Benchmarks","MITRE ATT&CK","MITRE D3FEND","PCI DSS","GDPR","HIPAA","SOC 2","COBIT","Governance","Compliance","Audit","Evidence","Gap analysis","Maturity model","Risk register","Risk appetite","Residual risk"],
  "Risk & Vulnerability":["Risk","Likelihood","Impact","CVSS","CVE","Vulnerability management","Patch management","Penetration testing","Zero-day","Threat landscape","Exposure"],
  "Threats & Attacks":["Phishing","Ransomware","Malware","DDoS","Insider threat","Advanced Persistent Threat (APT)","Supply chain attack","Social engineering","Credential stuffing","Brute force","Lateral movement","Data exfiltration","Living off the land"],
  "Controls & Architecture":["Firewall","IDS/IPS","EDR","XDR","SIEM","SOAR","MFA","Least privilege","Zero Trust","Network segmentation","DMZ","VPN","DNS","Honeypot","Deception","Sandboxing","NetFlow","Packet capture"]
};

/* ============================ QUESTIONS ============================ */
const QUESTIONS = [
{
 id:"Q1",theme:"Metrics & KPIs",type:"mcq",time:75,points:10,
 scenario:"Northwind Bank runs a story with its CISO every Monday. This line sits in the security strategy document: \"Cut mean time to detect (MTTD) from 4 hours to 30 minutes by Q4.\" A GRC analyst must label this line.",
 prompt:"What is this line?",
 options:[
  "A KPI that tracks this week's progress",
  "A metric that states the program goal",
  "A key risk indicator (KRI) of future loss",
  "An industry average used for benchmarking"
 ],
 correct:[1],multi:false,
 hint:"Ask yourself: does this line say where we want to go, or where we are right now?",
 sol:"A metric that states the program goal.",
 explain:"A metric is the goal. It is the place you want to reach. Here the goal is 30 minutes. A KPI, or Key Performance Indicator, is the number you watch to see if you are getting close, such as today's MTTD. The line names a target, so it is a metric, not the tracking number.",
 tip:"Learn the difference between a goal (metric) and the tracker of that goal (KPI). This pair appears in almost every security report."
},
{
 id:"Q2",theme:"Metrics & KPIs",type:"mcq",time:80,points:10,
 scenario:"The board asks the CISO why the SOC compares its MTTD with the average MTTD of other banks in the same country.",
 prompt:"What is the main value of this comparison?",
 options:[
  "It removes the need to collect internal KPIs.",
  "It proves that most alerts are false positives.",
  "It shows gaps against industry averages.",
  "It sets the yearly security budget by itself."
 ],
 correct:[2],multi:false,
 hint:"Think about benchmarking: comparing your numbers with the numbers of your peers.",
 sol:"It shows strengths and gaps against industry averages.",
 explain:"Benchmarking means comparing your numbers with industry averages. It shows where you do better and where you are behind. It does not replace your own KPIs, and it does not decide the budget alone. It feeds the discussion about the threat landscape and where to invest.",
 tip:"Remember what benchmarking can and cannot do. It is a compass, not the destination."
},
{
 id:"Q3",theme:"Detection & Response Measurement",type:"match",time:130,points:10,
 scenario:"You are writing definitions for the new SOC metrics wiki page. Match each term with the correct meaning.",
 prompt:"Each left item is a term. Choose the matching definition for every row.",
 pairs:[
  {l:"Mean time to detect (MTTD)",r:"Average time from the real start of an incident until the SOC detects it"},
  {l:"Mean time to acknowledge (MTTA)",r:"Average time from an alert arriving until an analyst starts working on it"},
  {l:"Mean time to respond (MTTR)",r:"Average time from detection until the threat is contained and the case is closed"},
  {l:"Dwell time",r:"Total time an attacker stays hidden inside the network before being found"},
  {l:"False positive",r:"An alert that fires but is not a real attack"}
 ],
 hint:"Acknowledge is the moment an analyst picks up the ticket. Detect is the moment the tool or human sees the incident.",
 sol:"MTTD = real start to detection. MTTA = alert arrival to analyst start. MTTR = detection to containment and closure. Dwell time = how long the attacker stays hidden. False positive = a harmless alert.",
 explain:"MTTD measures how fast you see the attack. MTTA measures how fast the analyst starts. MTTR covers the full fix, including the time to contain. Dwell time is measured from the attacker's side and is usually much longer. A false positive is noise and leads to alert fatigue. A false negative is worse: a real attack that nobody sees.",
 tip:"If you confuse MTTD, MTTA and MTTR, draw a small timeline. Mark each stop on the line."
},
{
 id:"Q4",theme:"Detection & Response Measurement",type:"calc",time:90,points:10,
 scenario:"Monday shift. Five real security incidents were detected with these detection times: INC-1001 = 14 min, INC-1002 = 26 min, INC-1003 = 20 min, INC-1004 = 40 min, INC-1005 = 10 min.",
 prompt:"What is the MTTD in minutes? (number only)",
 answer:22,tol:0.5,unit:"minutes",
 hint:"Add all detection times, then divide by the number of incidents.",
 sol:"22 minutes.",
 explain:"14 + 26 + 20 + 40 + 10 = 110. Then 110 / 5 = 22 minutes. Warning: one average can hide outliers. INC-1004 took 40 minutes, so also watch the worst case and the trend analysis over time.",
 tip:"Always check for an outlier after you compute an average. The average alone can hide a slow incident."
},
{

/* ============================ HELPERS ============================ */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function typeName(t){
  var m={mcq:"Multiple choice",dual:"Dual perspective",match:"Matching",fill:"Fill the blank",
  calc:"KPI calculation",terminal:"Terminal task",logviewer:"Log analysis",spot:"Spot the mistake",
  order:"Timeline / order",rank:"Priority ranking",dragdrop:"Drag and drop",branch:"Branching scenario"};
  return m[t]||t;
}
function logClass(m){
  if(/Failed|denied|error|invalid/i.test(m))return 'lbad';
  if(/Accepted|session opened/i.test(m))return 'lok';
  if(/POST|upload/i.test(m))return 'lwarn';
  return '';
}
function flash(msg){
  var d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);
  setTimeout(function(){d.remove();},1800);
}
function renderTimer(){
  var el=document.getElementById('timer');if(!el)return;

  el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  el.classList.toggle('warn',S.timeLeft<300);
  el.classList.toggle('crit',S.timeLeft<60);
}

  var done=S.i+(S.locked?1:0);

  renderTimer();
}

/* ============================ START ============================ */
function startExam(){
  S.seq=shuffle(QUESTIONS.map(function(q,i){return i;}));

  S.totalTime=QUESTIONS.reduce(function(a,q){return a+q.time;},0);

    if(S.paused)return;

    if(S.timeLeft<=0){S.timeLeft=0;renderTimer();endExam();return;}
    renderTimer();
  },1000);
  renderTimer();

}

/* ---------- body builders ---------- */
function renderMCQ(q){
  var items=q.options.map(function(t,i){return {t:t,ok:q.correct.indexOf(i)>-1};});
  items=shuffle(items);S.cur.data.items=items;
  var type=q.multi?'checkbox':'radio';
  return items.map(function(it,di){
    return '<label class="opt"><input type="'+type+'" name="mcq" value="'+di+'"><span>'+esc(it.t)+'</span></label>';
  }).join('');
}
function renderDual(q){
  return q.sub.map(function(s,si){
    var items=s.options.map(function(t,i){return {t:t,ok:s.correct.indexOf(i)>-1};});
    items=shuffle(items);S.cur.data['s'+si]=items;
    return '<div class="subq"><div class="sublabel">'+esc(s.label)+'</div><div class="prm">'+esc(s.prompt)+'</div>'+
      items.map(function(it,di){
        return '<label class="opt"><input type="radio" name="sub'+si+'" value="'+di+'"><span>'+esc(it.t)+'</span></label>';
      }).join('')+'</div>';
  }).join('');
}
function renderMatch(q){
  var rights=shuffle(q.pairs.map(function(p){return p.r;}));
  S.cur.data.rights=rights;
  return '<div class="matchgrid">'+q.pairs.map(function(p,i){
    return '<div class="mrow"><div class="mleft">'+esc(p.l)+'</div><select class="mselect" data-li="'+i+'">'+
      '<option value="">— choose —</option>'+
      rights.map(function(r){return '<option value="'+esc(r)+'">'+esc(r)+'</option>';}).join('')+
    '</select></div>';
  }).join('')+'</div>';
}
function renderFill(q){
  var bank=shuffle(q.bank);S.cur.data.bank=bank;
  var parts=q.text.split(/(\{\d+\})/),html='';
  parts.forEach(function(p){
    var m=p.match(/^\{(\d+)\}$/);
    if(m){
      var bi=+m[1];
      html+='<select class="fselect" data-bi="'+bi+'"><option value="">— choose —</option>'+
        bank.map(function(w){return '<option value="'+esc(w)+'">'+esc(w)+'</option>';}).join('')+'</select>';
    }else{html+=esc(p);}
  });
  return '<div class="filltext">'+html+'</div>';
}
function renderCalc(q){
  return '<div class="calcrow"><input id="calcIn" type="number" step="any" placeholder="Your answer"><span class="unit">'+esc(q.unit||'')+'</span></div>';
}
function renderTerminal(q){
  return '<div class="term"><div class="termbar">analyst@soc-host:~#</div>'+
    '<input id="termIn" class="termin" autocomplete="off" spellcheck="false" placeholder="type a command and press Enter"></div>';
}
function renderLog(q){

function renderSpot(q){

function renderOrder(q){

function renderBranch(q){

function branchNodeHTML(){
  var d=S.cur.data,q=S.cur.q;
  if(d.node==='end'){
    return '<div class="branchEnd">✅ Your response path is complete. Review it, then lock in.</div>'+
      '<div class="branchlog">Your path: '+esc(d.path.join(' → '))+'</div>';
  }
  var node=q.nodes[d.node];
  return '<div class="bnode"><div class="bprompt">'+esc(node.p)+'</div><div class="bchoices">'+

/* ---------- wiring ---------- */
function wireQuestion(q){
  var t=q.type;
  document.getElementById('hintBtn').onclick=useHint;
  document.getElementById('lockBtn').onclick=lockIn;
  document.getElementById('nextBtn').onclick=nextQ;
  if(t==='logviewer'){
    var f=document.getElementById('logFilter');
    f.oninput=function(){
      var v=f.value.toLowerCase();
      document.querySelectorAll('#logbox .logline').forEach(function(line){
        line.style.display=line.textContent.toLowerCase().indexOf(v)>-1?'':'none';
      });
    };
  }
  if(t==='terminal'){
    var ti=document.getElementById('termIn');
    ti.focus();
    ti.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();if(!S.locked)lockIn();}});
  }
  if(t==='spot'){
    document.querySelectorAll('.spotline').forEach(function(el){
      el.onclick=function(){el.classList.toggle('sel');};
    });
  }
  if(t==='order'||t==='rank')wireSortable();
  if(t==='dragdrop')wireDrag();
  if(t==='branch')wireBranch();
}
function wireSortable(){
  var list=document.getElementById('sortable');
  var dragEl=null;
  function renum(){list.querySelectorAll('li').forEach(function(li,i){li.querySelector('.num').textContent=i+1;});}
  renum();
  list.querySelectorAll('li').forEach(function(li){
    li.addEventListener('dragstart',function(){dragEl=li;li.classList.add('dragging');});
    li.addEventListener('dragend',function(){li.classList.remove('dragging');dragEl=null;renum();});
    li.addEventListener('dragover',function(e){
      e.preventDefault();
      if(!dragEl||dragEl===li)return;
      var r=li.getBoundingClientRect();
      var after=(e.clientY-r.top)>r.height/2;
      list.insertBefore(dragEl,after?li.nextSibling:li);
    });
    li.querySelector('.up').onclick=function(){if(li.previousElementSibling){list.insertBefore(li,li.previousElementSibling);renum();}};
    li.querySelector('.down').onclick=function(){if(li.nextElementSibling){list.insertBefore(li.nextElementSibling,li);renum();}};
  });
}
function wireDrag(){
  var selected=null;
  var chips=document.querySelectorAll('.chip');
  function clearSel(){chips.forEach(function(c){c.classList.remove('sel');});selected=null;}
  chips.forEach(function(c){
    c.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',c.dataset.id);});
    c.onclick=function(){if(selected===c){clearSel();}else{clearSel();selected=c;c.classList.add('sel');}};
  });
  function allowDrop(zone){
    zone.addEventListener('dragover',function(e){e.preventDefault();zone.classList.add('over');});
    zone.addEventListener('dragleave',function(){zone.classList.remove('over');});
    zone.addEventListener('drop',function(e){
      e.preventDefault();zone.classList.remove('over');
      var id=e.dataTransfer.getData('text/plain');
      var chip=document.querySelector('.chip[data-id="'+id+'"]');
      if(chip)(zone.querySelector('.drop')||zone).appendChild(chip);
      clearSel();
    });
    zone.onclick=function(e){
      if(e.target.classList.contains('chip'))return;
      if(selected){(zone.querySelector('.drop')||zone).appendChild(selected);clearSel();}
    };
  }
  document.querySelectorAll('.bucket').forEach(allowDrop);
  var pool=document.getElementById('pool');
  pool.addEventListener('dragover',function(e){e.preventDefault();});
  pool.addEventListener('drop',function(e){
    e.preventDefault();
    var id=e.dataTransfer.getData('text/plain');
    var chip=document.querySelector('.chip[data-id="'+id+'"]');
    if(chip)pool.appendChild(chip);
    clearSel();
  });
}
function wireBranch(){
  function bind(){
    document.querySelectorAll('.bchoice').forEach(function(b){
      b.onclick=function(){
        var d=S.cur.data,node=S.cur.q.nodes[d.node];
        var c=node.c[+b.dataset.i];
        d.steps++;if(c.ok)d.ok++;
        d.path.push(c.t);
        d.node=c.next;
        document.getElementById('branchBox').innerHTML=branchNodeHTML();
        bind();
      };
    });
  }
  bind();
}

/* ---------- hint, answer, grading ---------- */
function useHint(){
  if(S.locked||S.cur.hint)return;
  S.cur.hint=true;
  document.getElementById('hintBtn').style.display='none';
  var q=S.cur.q;
  var box=document.createElement('div');
  box.className='fb warn';
  box.innerHTML='<div class="fbttl">💡 Hint (−10%)</div><div class="fbrow">'+esc(q.hint)+'</div>';
  document.getElementById('qbody').appendChild(box);
}
function isAnswered(){
  var q=S.cur.q,t=q.type,d=S.cur.data;
  if(t==='mcq'||t==='logviewer')return document.querySelector('input[name=mcq]:checked')!==null;
  if(t==='dual'){for(var i=0;i<q.sub.length;i++){if(!document.querySelector('input[name=sub'+i+']:checked'))return false;}return true;}
  if(t==='match')return Array.prototype.every.call(document.querySelectorAll('select.mselect'),function(s){return s.value;});
  if(t==='fill')return Array.prototype.every.call(document.querySelectorAll('select.fselect'),function(s){return s.value;});
  if(t==='calc')return document.getElementById('calcIn').value!=='';
  if(t==='terminal')return document.getElementById('termIn').value.trim()!=='';
  if(t==='spot')return document.querySelectorAll('.spotline.sel').length>0;
  if(t==='order'||t==='rank')return true;
  if(t==='dragdrop')return document.querySelectorAll('#pool .chip').length===0;
  if(t==='branch')return d&&d.node==='end';
  return true;
}
function answerSummary(){
  var q=S.cur.q,t=q.type,d=S.cur.data;
  if(t==='mcq'||t==='logviewer'){
    var sel=Array.prototype.map.call(document.querySelectorAll('input[name=mcq]:checked'),function(x){return +x.value;});
    return sel.length?sel.map(function(i){return d.items[i].t;}).join(' | '):'(none)';
  }
  if(t==='dual'){
    return q.sub.map(function(s,si){
      var sel=document.querySelector('input[name=sub'+si+']:checked');
      var items=d['s'+si];
      return s.label+': '+(sel?items[+sel.value].t:'(none)');
    }).join('  ||  ');
  }
  if(t==='match')return Array.prototype.map.call(document.querySelectorAll('select.mselect'),function(s){return s.value||'(none)';}).join(' | ');
  if(t==='fill')return Array.prototype.map.call(document.querySelectorAll('select.fselect'),function(s){return s.value||'(none)';}).join(' | ');
  if(t==='calc')return (document.getElementById('calcIn').value||'(none)')+(q.unit?' '+q.unit:'');
  if(t==='terminal')return document.getElementById('termIn').value||'(none)';
  if(t==='spot'){
    var s=Array.prototype.map.call(document.querySelectorAll('.spotline.sel'),function(x){return +x.dataset.i+1;});
    return s.length?('Lines '+s.join(', ')):'(none)';
  }
  if(t==='order'||t==='rank'){
    return Array.prototype.map.call(document.querySelectorAll('#sortable li'),function(li){return li.querySelector('.txt').textContent;}).join(' → ');
  }
  if(t==='dragdrop'){
    return Array.prototype.map.call(document.querySelectorAll('.chip'),function(c){
      var b=c.closest('.bucket');
      return c.textContent+' → '+(b?b.dataset.bucket:'(not placed)');
    }).join(' | ');
  }
  if(t==='branch')return d.path?d.path.join(' → '):'(none)';
  return '';
}
function gradeCur(){
  var q=S.cur.q,t=q.type,d=S.cur.data;
  if(t==='mcq'||t==='logviewer'){
    var sel=Array.prototype.map.call(document.querySelectorAll('input[name=mcq]:checked'),function(x){return +x.value;});
    if(!sel.length)return 0;
    if(q.multi){
      var tot=q.correct.length;
      var good=sel.filter(function(i){return d.items[i].ok;}).length;
      var bad=sel.filter(function(i){return !d.items[i].ok;}).length;
      return Math.max(0,(good-bad)/tot);
    }
    return d.items[sel[0]].ok?1:0;
  }
  if(t==='dual'){
    var sc=0;
    q.sub.forEach(function(sq,si){
      var sel=document.querySelector('input[name=sub'+si+']:checked');
      if(sel&&d['s'+si][+sel.value].ok)sc++;
    });
    return sc/q.sub.length;
  }
  if(t==='match'){
    var ok=0;
    document.querySelectorAll('select.mselect').forEach(function(s){
      if(s.value===q.pairs[+s.dataset.li].r)ok++;
    });
    return ok/q.pairs.length;
  }
  if(t==='fill'){
    var ok2=0;
    document.querySelectorAll('select.fselect').forEach(function(s){
      if(s.value===q.blanks[+s.dataset.bi])ok2++;
    });
    return ok2/q.blanks.length;
  }
  if(t==='calc'){
    var v=parseFloat(document.getElementById('calcIn').value);
    return (Math.abs(v-q.answer)<=q.tol)?1:0;
  }
  if(t==='terminal')return q.check(document.getElementById('termIn').value)?1:0;
  if(t==='spot'){
    var sel2=Array.prototype.map.call(document.querySelectorAll('.spotline.sel'),function(x){return +x.dataset.i;});
    var goodList=q.lines.map(function(_,i){return i;}).filter(function(i){return q.bad.indexOf(i)<0;});
    var c=sel2.filter(function(i){return q.bad.indexOf(i)>-1;}).length;
    var w=sel2.filter(function(i){return q.bad.indexOf(i)<0;}).length;
    return Math.max(0,(c/q.bad.length)-(w/goodList.length));
  }
  if(t==='order'||t==='rank'){
    var lis=document.querySelectorAll('#sortable li');var c2=0;
    Array.prototype.forEach.call(lis,function(li,p){if(+li.dataset.orig===p)c2++;});
    return c2/lis.length;
  }
  if(t==='dragdrop'){
    var chips=document.querySelectorAll('.chip');var c3=0;
    Array.prototype.forEach.call(chips,function(ch){
      var b=ch.closest('.bucket');
      if(b&&b.dataset.bucket===ch.dataset.b)c3++;
    });
    return c3/chips.length;
  }
  if(t==='branch')return d.steps?d.ok/d.steps:0;
  return 0;
}
function lockIn(){
  if(S.locked)return;
  if(!isAnswered()){flash('Complete the task before locking in.');return;}
  var q=S.cur.q;
  var summary=answerSummary();
  var frac=gradeCur();
  var max=q.points;
  var earned=Math.max(0,Math.round(frac*max*10)/10);
  if(S.cur.hint)earned=Math.max(0,Math.round((earned-max*0.1)*10)/10);
  S.answered[S.cur.qi]={frac:frac,earned:earned,max:max,hint:S.cur.hint,summary:summary};
  S.locked=true;
  document.getElementById('qbody').classList.add('lockedbox');
  document.getElementById('hintBtn').style.display='none';
  document.getElementById('lockBtn').style.display='none';
  var nb=document.getElementById('nextBtn');
  nb.style.display='inline-flex';
  nb.textContent=(S.i>=S.seq.length-1)?'Finish Exam →':'Next Question →';
  var good=frac>=0.999,partial=(!good&&frac>0);
  var fb=document.getElementById('fb');
  fb.innerHTML='<div class="fb '+(good?'ok':(partial?'warn':'bad'))+'">'+
    '<div class="fbttl">'+(good?'✅ Correct':(partial?'⚠ Partly correct':'❌ Incorrect'))+' — '+earned+' / '+max+' pts'+(S.cur.hint?' (hint used)':'')+'</div>'+
    '<div class="fbrow"><b>Why:</b> '+q.explain+'</div>'+
    '<div class="fbrow"><b>Model answer:</b> '+esc(q.sol)+'</div>'+
    (!good?'<div class="fbrow tip"><b>Focus on:</b> '+esc(q.tip)+'</div>':'')+
  '</div>';
  updateHUD();
}
function nextQ(){
  if(S.i>=S.seq.length-1){endExam();return;}
  S.i++;renderQuestion();
}

/* ============================ RESULTS ============================ */
function endExam(){
  if(S.ended)return;
  S.ended=true;
  clearInterval(S.tick);
  var maxTotal=QUESTIONS.reduce(function(a,q){return a+q.points;},0);
  var earned=0;
  for(var k in S.answered)earned+=S.answered[k].earned;
  var pct=Math.round((earned/maxTotal)*1000)/10;
  var pass=pct>=80;
  var correctCount=0;
  for(var k2 in S.answered){if(S.answered[k2].frac>=0.999)correctCount++;}
  var themes={};
  S.seq.forEach(function(qi){
    var q=QUESTIONS[qi];
    if(!themes[q.theme])themes[q.theme]={e:0,m:0};
    themes[q.theme].m+=q.points;
    if(S.answered[qi])themes[q.theme].e+=S.answered[qi].earned;
  });
  var themeHtml=Object.keys(themes).map(function(t){
    var v=themes[t],p=Math.round(v.e/v.m*100);
    var col=p>=80?'var(--ok)':(p>=50?'var(--warn)':'var(--bad)');
    return '<div class="trow"><div class="tname">'+esc(t)+'</div><div class="tbar"><div class="tfill" style="width:'+p+'%;background:'+col+'"></div></div><div class="tpct">'+p+'%</div></div>';
  }).join('');
  var reportHtml=S.seq.map(function(qi,idx){
    var q=QUESTIONS[qi],r=S.answered[qi];
    var cls='bad',st='Not answered';
    if(r){ if(r.frac>=0.999){cls='ok';st='Correct';} else if(r.frac>0){cls='warn';st='Partly correct';} else {cls='bad';st='Incorrect';} }
    var open=(r&&r.frac<0.999)?' open':'';
    return '<details class="rep '+cls+'"'+open+'><summary><span class="repn">Q'+(idx+1)+'</span>'+
      '<span class="rept">'+esc(q.theme)+'</span><span class="reps '+cls+'">'+st+'</span>'+
      '<span class="repp">'+(r?r.earned:0)+'/'+q.points+'</span></summary>'+
      '<div class="repb">'+
        '<div class="rrow"><b>Your answer:</b> '+esc(r?r.summary:'(none)')+'</div>'+
        '<div class="rrow"><b>Model answer:</b> '+esc(q.sol)+'</div>'+
        '<div class="rrow"><b>Why:</b> '+q.explain+'</div>'+
        ((!r||r.frac<0.999)?'<div class="rrow tip"><b>Focus on:</b> '+esc(q.tip)+'</div>':'')+
      '</div></details>';
  }).join('');
  document.getElementById('pauseBtn').style.display='none';
  var verdict='<div class="verdict '+(pass?'pass':'fail')+'">'+
    '<div class="vscore">'+pct+'%</div>'+
    '<div class="vsub">'+earned+' of '+maxTotal+' points · '+correctCount+' of '+QUESTIONS.length+' exercises fully correct · passing score 80%</div>'+
    '<h1 style="margin-top:14px">'+(pass?'PASS — Certified':'NOT YET — Retake required')+'</h1>'+
    '<p class="vsub">'+(pass?'You can measure a security program, read its KPIs, and turn numbers into action.':'Review the report below. Then retake the exam. The questions and the answer choices will be shuffled.')+'</p>'+
    (pass?'<div class="cert"><div class="ct">Certificate of Completion</div><div class="cn">Cyber Metrics &amp; Key Performance Indicators — Security Measurement Analyst</div><div class="cn">Score: '+pct+'% · Threshold: 80% · Issued by the SOC Training Board</div></div>':'')+
    '<div style="margin-top:16px"><button id="retakeBtn" class="btn primary big">'+(pass?'Retake Exam (new shuffle)':'Retake Exam')+'</button></div>'+
  '</div>';
  stage.innerHTML='<div class="results">'+verdict+
    '<div class="themebars"><h3>Performance by theme</h3>'+themeHtml+'</div>'+
    '<h3>Detailed report</h3><p class="vsub">Every exercise is listed in the order you saw it.</p>'+reportHtml+
    '<div style="margin-top:20px"><button id="retakeBtn2" class="btn primary big">Retake Exam</button></div>'+
  '</div>';
  document.getElementById('retakeBtn').onclick=startExam;
  document.getElementById('retakeBtn2').onclick=startExam;
  updateHUD();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============================ BOOT ============================ */
document.getElementById('pauseBtn').onclick=function(){
  if(!S.tick)return;
  S.paused=true;
  document.getElementById('pauseOverlay').classList.remove('hidden');
};
document.getElementById('resumeBtn').onclick=function(){
  S.paused=false;
  document.getElementById('pauseOverlay').classList.add('hidden');
};
renderIntro();
</script>
