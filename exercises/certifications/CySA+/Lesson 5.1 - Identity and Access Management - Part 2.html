<!DOCTYPE html>
<!-- CSAI-101 · Secure Access & Identity — Certification Exam · BUILD v2.0 -->
<!-- v2.0: content review passed (99/99 keywords exercised, answer keys verified, IOCs defanged), timer privacy hardened, touch drag & drop enabled. Single self-contained file — no external resources. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>CSAI-101 · Secure Access &amp; Identity — Certification Exam</title>
<style>
:root{
  --bg:#05080f;--panel:#0e1626;--panel2:#121d33;--line:#1e2c4a;
  --txt:#d9e3f7;--dim:#8ea3c8;--acc:#22d3ee;--acc2:#a78bfa;
  --good:#34d399;--bad:#f87171;--warn:#fbbf24;--gold:#e7c86a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(167,139,250,.12), transparent 60%),
    radial-gradient(900px 500px at -10% 20%, rgba(34,211,238,.10), transparent 55%),
    var(--bg);
  color:var(--txt);min-height:100vh;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(rgba(148,163,184,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.045) 1px,transparent 1px);
  background-size:42px 42px;}
#app{position:relative;z-index:1}
.hidden{display:none!important}
code{font-family:ui-monospace,Menlo,Consolas,'Courier New',monospace}
/* ---------- top bar ---------- */
#topbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:12px 18px;background:rgba(7,11,20,.86);backdrop-filter:blur(10px);border-bottom:1px solid #14203a}
.brand{display:flex;gap:11px;align-items:center}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#0e7490,#6d28d9);display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:0 0 40px}
.btitle b{display:block;font-size:13px;letter-spacing:1px}
.btitle span{font-size:11px;color:var(--dim);font-family:ui-monospace,Menlo,monospace}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.timer{font-family:ui-monospace,Menlo,monospace;font-size:16px;color:var(--acc);border:1px solid #1c2a49;background:#0a1120;border-radius:8px;padding:6px 12px;min-width:78px;text-align:center}
.timer.low{color:var(--bad);border-color:rgba(248,113,113,.5);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.scorebox{display:flex;flex-direction:column;align-items:flex-end;font-family:ui-monospace,Menlo,monospace}
.scorebox span:first-child{font-size:12.5px;color:var(--txt)}
.pct{font-size:11px;color:var(--acc)}
/* ---------- buttons ---------- */
.btn{border:1px solid #2c3f6b;background:#101c36;color:var(--txt);border-radius:10px;padding:11px 18px;font-size:14px;cursor:pointer;transition:.15s;font-weight:600;font-family:inherit}
.btn:hover:not(:disabled){border-color:var(--acc);color:#fff}
.btn.primary{background:linear-gradient(135deg,#0ea5b7,#2563eb);border-color:transparent}
.btn.danger{background:#3d1420;border-color:#7f2c3f;color:#ffb4b4}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn.xl{padding:15px 30px;font-size:16px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* ---------- intro ---------- */
.hero{max-width:940px;margin:0 auto;padding:40px 18px 70px}
.badge{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;letter-spacing:2px;color:var(--acc);border:1px solid rgba(34,211,238,.4);border-radius:999px;padding:6px 14px;background:rgba(34,211,238,.06)}
.hero h1{font-size:clamp(26px,4.5vw,42px);margin:16px 0 10px;line-height:1.15}
.hero h1 span{color:var(--acc2)}
.lead{color:#b7c7e6;font-size:16px;line-height:1.6;max-width:760px}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
.mchip{background:#0c1526;border:1px solid #22335a;border-radius:10px;padding:9px 14px;display:flex;flex-direction:column}
.mchip b{font-size:17px;color:var(--acc)}
.mchip span{font-size:11px;color:var(--dim)}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0 24px}
.rules>div{background:#0c1526;border:1px solid #1c2a49;border-radius:12px;padding:16px;font-size:13.5px;line-height:1.65;color:#c3d2ee}
.rules b{color:var(--txt);display:block;margin-bottom:8px}
.rules ul{margin:0;padding-left:18px}
.types{list-style:square}
.kwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin:10px 0 14px}
.tcard{background:#0c1526;border:1px solid #1c2a49;border-radius:12px;padding:14px;border-top:3px solid var(--acc)}
.tcard.c-T1{border-top-color:#22d3ee}.tcard.c-T2{border-top-color:#a78bfa}.tcard.c-T3{border-top-color:#60a5fa}
.tcard.c-T4{border-top-color:#fb923c}.tcard.c-T5{border-top-color:#34d399}.tcard.c-T6{border-top-color:#f472b6}.tcard.c-T7{border-top-color:#f87171}
.tchead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}
.tchead b{font-size:13.5px}
.tchead span{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--dim);white-space:nowrap}
.kchips{display:flex;flex-wrap:wrap;gap:6px}
.kchip{font-size:11.5px;color:#b9c9e8;background:#101d38;border:1px solid #22335a;border-radius:999px;padding:3px 9px}
.defang{color:var(--dim);font-size:12.5px;margin:6px 0 20px}
.defang code{color:#f2c069}
/* ---------- exam layout ---------- */
.examwrap{max-width:980px;margin:0 auto;padding:18px 16px 70px}
.pbar{height:6px;background:#101b32;border-radius:99px;overflow:hidden;margin-bottom:14px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#a78bfa);border-radius:99px;transition:width .5s;position:relative;overflow:hidden}
.pfill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);animation:shim 2.2s linear infinite}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{width:30px;height:30px;border-radius:8px;border:1px solid #22335a;background:#0c1526;color:var(--dim);font-family:ui-monospace,Menlo,monospace;font-size:12px;cursor:pointer}
.pill:hover{border-color:var(--acc)}
.pill.p-ok{background:rgba(52,211,153,.15);border-color:var(--good);color:var(--good)}
.pill.p-part{background:rgba(251,191,36,.13);border-color:var(--warn);color:var(--warn)}
.pill.p-zero{background:rgba(248,113,113,.12);border-color:var(--bad);color:var(--bad)}
.pill.p-cur{outline:2px solid var(--acc);color:var(--txt)}
.tstrip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tchip{display:flex;align-items:center;gap:7px;background:#0c1526;border:1px solid #1c2a49;border-radius:999px;padding:4px 10px 4px 9px;font-size:11px;color:var(--dim)}
.tchip b{color:var(--txt);font-weight:600;font-size:11px}
.tbar{width:46px;height:5px;border-radius:99px;background:#16223d;overflow:hidden}
.tbar i{display:block;height:100%;width:0;background:var(--acc);border-radius:99px;transition:width .5s}
.tchip em{font-style:normal;font-family:ui-monospace,Menlo,monospace;font-size:10.5px}
.card{background:linear-gradient(180deg,#0f1930,#0c1424);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.exhead{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{font-size:11px;letter-spacing:.4px;padding:4px 10px;border-radius:999px;border:1px solid;font-weight:600}
.c-T1{color:#22d3ee;border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.07)}
.c-T2{color:#c4b0fb;border-color:rgba(167,139,250,.45);background:rgba(167,139,250,.07)}
.c-T3{color:#8fbbfc;border-color:rgba(96,165,250,.45);background:rgba(96,165,250,.07)}
.c-T4{color:#fdba8c;border-color:rgba(251,146,60,.45);background:rgba(251,146,60,.07)}
.c-T5{color:#6fe3ae;border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.07)}
.c-T6{color:#f9a8d4;border-color:rgba(244,114,182,.45);background:rgba(244,114,182,.07)}
.c-T7{color:#ffa3a3;border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.07)}
.diff-c{color:#ffd76b;border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.06)}
.diff-e{color:#ff9c9c;border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.07)}
.pts{color:var(--dim);border-color:#22335a;background:#0c1526}
.warnchip{color:var(--warn);border-color:rgba(251,191,36,.4)}
.extitle{font-size:21px;margin:2px 0 4px;font-weight:700}
.exbody{margin-top:4px}
.card.locked .exbody{pointer-events:none}
.qtext{font-size:15.5px;margin:12px 0 10px;font-weight:600;line-height:1.5}
.scenario{background:#0a1120;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:12px 14px;color:#c6d4ef;font-size:14px;line-height:1.6;margin:10px 0}
.scenario.badfall{border-left-color:var(--bad)}
/* ---------- choices ---------- */
.opts{display:grid;gap:9px;margin-top:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#0d1830;border:1px solid #22335a;border-radius:10px;padding:11px 12px;color:var(--txt);cursor:pointer;transition:.15s;font-size:14px;line-height:1.5;font-family:inherit;width:100%}
.opt:hover{border-color:var(--acc)}
.okey{flex:0 0 24px;height:24px;border-radius:6px;background:#152544;display:grid;place-items:center;font-size:12px;color:var(--acc);font-family:ui-monospace,Menlo,monospace}
.otxt{flex:1}
.opt.sel{border-color:var(--acc);background:#10233f;box-shadow:0 0 0 1px var(--acc) inset}
.opt.good{border-color:var(--good);background:rgba(52,211,153,.10)}
.opt.bad{border-color:var(--bad);background:rgba(248,113,113,.10)}
.opt.dim{opacity:.55}
/* ---------- ordering ---------- */
.olist{display:grid;gap:8px;margin-top:8px}
.order-item{display:flex;align-items:center;gap:10px;background:#0d1830;border:1px solid #22335a;border-radius:10px;padding:10px 12px;cursor:grab}
.order-item.good{border-color:var(--good);background:rgba(52,211,153,.08)}
.order-item.off{border-color:var(--warn);background:rgba(251,191,36,.06)}
.grab{color:var(--dim);font-size:15px;flex:0 0 auto}
.pos{flex:0 0 26px;height:26px;border-radius:8px;background:#152544;display:grid;place-items:center;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--acc2)}
.otxt{flex:1;font-size:14px;line-height:1.45}
.mv{display:flex;gap:6px}
.mini{background:#152544;border:1px solid #22335a;color:var(--txt);border-radius:6px;width:26px;height:24px;cursor:pointer;font-size:13px}
.mini:hover{border-color:var(--acc)}
/* ---------- matching / word bank ---------- */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;background:#0a1120;border:1px dashed #2a3c66;border-radius:10px;padding:10px;margin:10px 0}
.pool-label{font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;flex-basis:100%}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:8px}
.bucket{background:#0c1526;border:1px solid #22335a;border-radius:10px;padding:10px;min-height:86px;transition:.15s}
.bucket.drop-hot,.pool.drop-hot{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.bname{font-size:12.5px;color:var(--acc2);font-weight:700;margin-bottom:8px;line-height:1.4}
.bitems{display:flex;flex-wrap:wrap;gap:7px}
.bchip,.wchip{background:#152544;border:1px solid #2c3f6b;color:var(--txt);border-radius:8px;padding:6px 10px;font-size:13px;cursor:grab}
.bchip.sel,.wchip.sel{border-color:var(--acc);background:#123055}
.bchip.good,.wchip.good{border-color:var(--good);color:var(--good)}
.bchip.bad,.wchip.bad{border-color:var(--bad);color:var(--bad)}
.bchip.dim,.wchip.dim{opacity:.5}
.banktext{font-size:14.5px;line-height:2.1}
.blank{display:inline-block;min-width:130px;border-bottom:2px dashed #3b5486;margin:0 3px;padding:0 8px;text-align:center;color:var(--acc);font-weight:600;cursor:pointer}
.blank.filled{border-bottom-style:solid;border-color:var(--acc)}
.blank.good{color:var(--good);border-color:var(--good)}
.blank.bad{color:var(--bad);border-color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:8px;background:#0a1120;border:1px dashed #2a3c66;border-radius:10px;padding:10px;margin-top:12px}
/* ---------- spot the flaw ---------- */
.codeblock{background:#070c17;border:1px solid #1c2a49;border-radius:10px;padding:8px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;margin:10px 0}
.cline{display:flex;flex-wrap:wrap;gap:10px;width:100%;text-align:left;background:none;border:none;color:#c8d6f2;padding:3px 12px;cursor:pointer;font:inherit;line-height:1.55}
.cline:hover{background:#0e1830}
.cline .lnum{color:#4f648f;flex:0 0 24px;text-align:right;user-select:none}
.cline.sel{background:#123055;box-shadow:inset 2px 0 0 var(--acc)}
.cline.good{background:rgba(52,211,153,.12);box-shadow:inset 2px 0 0 var(--good)}
.cline.bad{background:rgba(248,113,113,.12);box-shadow:inset 2px 0 0 var(--bad)}
.cnote{color:var(--warn);font-size:12px;padding:2px 12px 2px 46px;font-family:'Segoe UI',system-ui,sans-serif;flex:1 1 100%}
/* ---------- log viewer ---------- */
.logbar{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
.lfilter{flex:1;max-width:340px;background:#0a1120;border:1px solid #22335a;border-radius:8px;color:var(--txt);padding:8px 10px;font-family:ui-monospace,Menlo,monospace;font-size:13px;outline:none}
.lfilter:focus{border-color:var(--acc)}
.lcount{color:var(--dim);font-size:12px;font-family:ui-monospace,Menlo,monospace}
.loglist{background:#060b15;border:1px solid #1c2a49;border-radius:10px;padding:8px 0;max-height:340px;overflow:auto}
.log-line{font-family:ui-monospace,Menlo,monospace;font-size:12.2px;line-height:1.55;padding:1.5px 12px;white-space:pre-wrap;border-left:3px solid transparent}
.log-line:hover{background:#0c1526}
.lg-ok{color:#57d99e}.lg-info{color:#9fb3d9}.lg-warn{color:#f2c069}.lg-err{color:#f8756f}.lg-dim{color:#64789c}
/* ---------- terminal ---------- */
.term{background:#04070d;border:1px solid #1c2a49;border-radius:10px;margin-top:10px;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
.termhead{padding:7px 12px;border-bottom:1px solid #14203a;color:#7d90b5;font-size:11px;letter-spacing:1px}
.tout{padding:12px 14px;max-height:300px;overflow:auto;font-size:13px;line-height:1.55}
.tline{white-space:pre-wrap}
.t-in{color:#e5edff}.t-ok{color:#43d694}.t-err{color:#f8756f}.t-dim{color:#64789c}
.tin{display:flex;gap:8px;padding:10px 14px;border-top:1px solid #14203a}
.tprompt{color:var(--acc);white-space:nowrap}
.tin input{flex:1;background:none;border:none;outline:none;color:#d7ffde;font-family:inherit;font-size:13px}
.tin input:disabled{opacity:.5}
.tasklist{display:grid;gap:6px;margin:10px 0}
.task{display:flex;gap:10px;align-items:center;background:#0c1526;border:1px solid #22335a;border-radius:8px;padding:8px 12px;font-size:13.5px}
.tdot{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid #31456f}
.task.done{border-color:rgba(52,211,153,.5)}
.task.done .tdot{background:var(--good);border-color:var(--good)}
/* ---------- dual perspective ---------- */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.duocard{background:#0c1526;border:1px solid #22335a;border-radius:12px;padding:14px}
.duotag{font-size:11px;font-weight:800;letter-spacing:1px;padding:3px 8px;border-radius:6px;display:inline-block;margin-bottom:8px}
.duotag.blue{background:rgba(96,165,250,.15);color:#7fb3ff;border:1px solid rgba(96,165,250,.4)}
.duotag.red{background:rgba(248,113,113,.12);color:#ff9c9c;border:1px solid rgba(248,113,113,.4)}
.duocard .qtext{font-size:14px}
.duocard .opt{font-size:13px;padding:9px 10px}
/* ---------- staged scenarios ---------- */
.stagehead{font-size:12px;color:var(--dim);letter-spacing:1px;margin:12px 0 8px;font-family:ui-monospace,Menlo,monospace}
.alertcard{background:#0a1120;border:1px solid #22335a;border-radius:12px;padding:14px;margin-bottom:4px}
.ahead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.atag{font-family:ui-monospace,Menlo,monospace;color:var(--acc);font-size:12.5px}
.atime{font-family:ui-monospace,Menlo,monospace;color:var(--dim);font-size:12px}
.sev{font-size:10.5px;font-weight:800;letter-spacing:.8px;padding:2px 8px;border-radius:5px}
.sev-CRITICAL{background:rgba(248,113,113,.15);color:#ff9c9c;border:1px solid rgba(248,113,113,.45)}
.sev-HIGH{background:rgba(251,146,60,.13);color:#fca56b;border:1px solid rgba(251,146,60,.45)}
.sev-MEDIUM{background:rgba(251,191,36,.12);color:#ffd76b;border:1px solid rgba(251,191,36,.45)}
.sev-LOW{background:rgba(148,163,184,.12);color:#b7c4da;border:1px solid rgba(148,163,184,.4)}
.atitle{font-weight:700;margin:2px 0 6px;font-size:15px}
.abody{color:#c6d4ef;font-size:13.8px;line-height:1.6}
.abtns{display:grid;gap:9px;margin-top:12px}
.outcome{border-radius:10px;padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.55}
.oc-ok{background:rgba(52,211,153,.09);border:1px solid rgba(52,211,153,.4)}
.oc-bad{background:rgba(248,113,113,.09);border:1px solid rgba(248,113,113,.4)}
.oc-next{margin-top:10px}
/* ---------- feedback ---------- */
.fb{margin-top:16px;display:grid;gap:10px}
.fbhead{padding:10px 14px;border-radius:10px;font-size:14.5px}
.fbhead.good{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.45);color:#6fe3ae}
.fbhead.mid{background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.45);color:#ffd76b}
.fbhead.bad{background:rgba(248,113,113,.09);border:1px solid rgba(248,113,113,.45);color:#ff9c9c}
.kv{background:#0a1120;border:1px solid #1c2a49;border-radius:8px;padding:9px 12px;font-size:13.5px;line-height:1.55}
.kv span{display:block;color:var(--dim);font-size:11px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:3px}
.repdetail{display:grid;gap:7px}
.dline{background:#0a1120;border:1px solid #1c2a49;border-left:3px solid #31456f;border-radius:8px;padding:9px 12px;font-size:13.5px;line-height:1.5}
.dline span{display:block;color:var(--dim);margin-top:3px}
.dl-ok{border-left-color:var(--good)}
.dl-bad{border-left-color:var(--bad)}
.expbox{background:#0d1830;border:1px solid #22335a;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.6;color:#c9d7f3}
.tipbox{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.35);border-radius:10px;padding:11px 14px;font-size:13.5px;line-height:1.55;color:#f4d78f}
.exnav{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.mut{color:var(--dim);font-weight:400;font-size:12px}
/* ---------- overlay / pause ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(4,7,13,.72);backdrop-filter:blur(14px);display:grid;place-items:center}
.ovcard{background:#0d1626;border:1px solid #22335a;border-radius:16px;padding:30px 34px;text-align:center;max-width:430px}
.ovcard h2{margin:8px 0}
.ovcard h3{margin:8px 0;font-size:20px}
.ovcard p{color:var(--dim);font-size:14px;line-height:1.55}
.ovrow{display:flex;gap:10px;justify-content:center;margin-top:16px}
.ovlock{font-family:ui-monospace,Menlo,monospace;font-size:24px;color:var(--warn);letter-spacing:4px}
.blurme{filter:blur(20px) saturate(.6);pointer-events:none;user-select:none}
/* ---------- results ---------- */
.results{max-width:920px;margin:0 auto;padding:30px 18px 70px}
.rhead{display:flex;gap:26px;align-items:center;flex-wrap:wrap;background:#0c1526;border:1px solid #1c2a49;border-radius:16px;padding:22px}
.rwrap{position:relative;width:150px;height:150px;flex:0 0 150px}
.ringsvg{width:150px;height:150px;transform:rotate(-90deg)}
.rbg{fill:none;stroke:#15223d;stroke-width:11}
.rfg{fill:none;stroke:var(--acc);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.22,1,.36,1)}
.rfg.okk{stroke:var(--good)}
.rfg.badd{stroke:var(--bad)}
.rnum{position:absolute;inset:0;display:grid;place-items:center;font-family:ui-monospace,Menlo,monospace;font-size:25px;font-weight:700}
.rstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;flex:1;min-width:260px}
.stat{background:#0a1120;border:1px solid #1c2a49;border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:18px;font-family:ui-monospace,Menlo,monospace}
.stat span{font-size:11px;color:var(--dim)}
.verdict{margin:16px 0}
.cert{background:linear-gradient(160deg,#101d36,#0b1222);border:2px solid var(--gold);border-radius:18px;padding:6px;box-shadow:0 0 50px rgba(231,200,106,.12)}
.certin{border:1px solid rgba(231,200,106,.4);border-radius:12px;padding:30px 26px;text-align:center}
.ctop{font-family:ui-monospace,Menlo,monospace;letter-spacing:4px;font-size:12px;color:var(--gold);margin-bottom:10px}
.cert h2{font-size:24px;margin:6px 0}
.cert p{color:#c3d2ee;font-size:14.5px}
.cmeta{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--dim);margin-top:14px}
.cseal{display:inline-block;margin-top:16px;border:2px solid var(--good);color:var(--good);border-radius:999px;padding:7px 22px;font-weight:800;letter-spacing:3px;font-size:13px}
.failbox{background:rgba(248,113,113,.06);border:2px solid rgba(248,113,113,.5);border-radius:18px;padding:30px;text-align:center}
.failbox h2{margin:6px 0}
.failbox p{color:#e7b8b8;line-height:1.6}
.tstatgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:16px 0}
.tstat{background:#0c1526;border:1px solid #1c2a49;border-radius:10px;padding:11px 13px}
.tstat b{font-size:12.5px;display:block;margin-bottom:6px}
.tstat .tbar{width:100%}
.tstat em{font-style:normal;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim)}
.report{display:grid;gap:10px;margin-top:8px}
.rep{background:#0c1526;border:1px solid #1c2a49;border-radius:12px;overflow:hidden}
.rep summary{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;list-style:none}
.rep summary::-webkit-details-marker{display:none}
.rep summary:hover{background:#0e1830}
.dot{width:11px;height:11px;border-radius:50%;flex:0 0 11px}
.st-ok .dot{background:var(--good);box-shadow:0 0 8px var(--good)}
.st-part .dot{background:var(--warn)}
.st-zero .dot{background:var(--bad)}
.repn{font-family:ui-monospace,Menlo,monospace;color:var(--dim);font-size:12.5px}
.rept{flex:1;font-weight:600;font-size:14.5px}
.repscore{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--dim)}
.repbody{padding:12px 16px 16px;display:grid;gap:9px;border-top:1px solid #14203a}
h3.rsec{margin:22px 0 8px;font-size:16px}
/* ---------- misc ---------- */
.fadein{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.drag-ghost{position:fixed;z-index:999;opacity:.92;pointer-events:none;box-shadow:0 14px 34px rgba(0,0,0,.5);transform:rotate(1.5deg);margin:0}
.drag{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
@media(max-width:860px){
  .rules{grid-template-columns:1fr}
  .duo{grid-template-columns:1fr}
  .hud{gap:6px}
  .btitle span{display:none}
  .card{padding:15px}
  .exnav .btn{flex:1}
  .rhead{gap:14px}
}
</style>

<script>
/* ===== CSAI-101 exam data — part 1 (E1–E8) ===== */
const THEMES={
  T1:'Authentication & Protocols',
  T2:'Authorization & Access Models',
  T3:'IAM Lifecycle & Governance',
  T4:'Privileged Access (PAM)',
  T5:'Secrets Management',
  T6:'Cloud-Native Identity',
  T7:'Detection, Attacks & Response'
};
const KEYWORDS={
  T1:['authentication','authentication factors (know / have / are)','MFA','TOTP','push notification','number matching','phishing-resistant MFA','FIDO2 / WebAuthn','passwordless','SSO','IdP','identity federation','SAML 2.0','OAuth 2.0','OpenID Connect (OIDC)','PKCE','JWT / ID token','OAuth scopes','Kerberos','KDC','TGT','service ticket (TGS)','KRBTGT','NTLM','LDAP','SCIM'],
  T2:['authorization','RBAC','ABAC','DAC','MAC','least privilege','segregation of duties','broken access control','IDOR','privilege escalation','IAM policy','SCP (Service Control Policy)','zero trust','PDP / PEP','Conditional Access'],
  T3:['IAM','identity lifecycle (JML)','provisioning','deprovisioning','orphaned accounts','directory services','Active Directory','Microsoft Entra ID','IGA','access review / recertification','service account'],
  T4:['PAM','privileged account','credential vaulting','just-in-time (JIT) access','PIM','break-glass account','session recording / broker','standing privilege','tiered admin model (Tier 0/1/2)','Credential Guard','LAPS'],
  T5:['secrets management','vault','secret rotation','dynamic secrets','API key','hardcoded secret','token','CI/CD pipeline secrets','KMS / HSM','encryption at rest','workload identity','OIDC federation for CI/CD'],
  T6:['cloud-native','CIEM','Kubernetes service account','namespace','blast radius','shared responsibility','ZTNA','defense in depth'],
  T7:['pass-the-hash','golden ticket','Kerberoasting','credential stuffing','password spraying','brute force','push bombing / MFA fatigue','impossible travel','legacy authentication','account lockout','anomalous sign-in','audit logging','Event IDs 4624 / 4625 / 4740 / 4768 / 4769','lateral movement','containment','IR playbook']
};
const EX=[
{id:'E1',type:'qcm',theme:'T1',diff:'CHALLENGING',time:120,title:'The 23:47 push storm',
hint:'Ask yourself what a plain push prompt lets the user actually verify. Then recall the three authentication factors.',
scenario:`Friday, 23:47. Nora Lindqvist, finance director at Vantor Freight, calls the service desk. Her phone has shown <b>42 Microsoft Authenticator push prompts in ten minutes</b>. Tired of the noise, she taps <b>Approve</b> on one of them. The attacker — who already had her password from a phishing site — is now inside her mailbox. He never touched her phone and never saw a one-time code.`,
prompt:'Which weakness did this attack (push bombing / MFA fatigue) actually exploit?',
options:[
 {t:'Her TOTP codes expired before she could type them.',ok:false,why:'TOTP codes were not used here. The attacker used push approvals, not typed codes, so code expiry could not have helped.'},
 {t:'The push prompt asked for a blind tap, with no number to match.',ok:true,why:'A plain "tap to approve" prompt gives the user nothing to verify. Number matching forces the user to type a number shown on the login screen, so a blind tap fails.'},
 {t:'The authenticator app stored its seed key without encryption at rest.',ok:false,why:'Storage encryption is a real topic, but the attacker never read the app. He flooded the user with prompts.'},
 {t:'Password reuse on a breached forum exposed her second factor.',ok:false,why:'Reuse exposed her <b>first</b> factor (the password). The second factor failed because a tired human approved a blind prompt.'}],
explain:'Push bombing works because a simple "Approve" push notification gives the user nothing to check. Number matching, or phishing-resistant MFA like FIDO2, removes that blind trust. And after one approval you treat it as a real compromise: revoke sessions, reset the password, and find out how the password was stolen in the first place.',
tip:'Focus on authentication factors: something you know (password), something you have (phone), something you are (biometrics). A blind tap skips the "verify" step of the "have" factor.'},

{id:'E2',type:'triage',theme:'T7',diff:'EXTREME',time:240,title:'NOC shift: clear the alert queue',
hint:'For each alert ask: which single action cuts attacker access fastest without breaking production? Match the response to the attack type — pass-the-hash, golden ticket and Kerberoasting each need a different move.',
intro:`02:00–04:00, SOC of Vantor Freight. You are the only analyst on shift and your IR playbook is open. Five alerts wait. For each one, pick the best action — every choice has consequences.`,
stages:[
 {tag:'SIEM-4411',sev:'HIGH',time:'02:04',title:'Impossible travel — j.mensah',
  body:'Sign-in from Lagos, Nigeria at 09:12 UTC, then from Toronto, Canada at 09:19 UTC — an anomalous sign-in (impossible travel). Both say "MFA satisfied". The Toronto session came in over <b>IMAP with legacy basic authentication</b> (no modern token).',
  actions:[
   {t:'Mark as false positive — geo-location data often drifts.',ok:false,out:'The attacker keeps reading the mailbox.',why:'Two continents in seven minutes over basic auth is not drift. Legacy protocols are the number one MFA bypass.',fallout:'The "false positive" label sticks. The attacker forwards every new mail to an outside address — and the queue keeps moving.'},
   {t:'Revoke all refresh tokens, block legacy authentication, reset the password, and check mailbox forwarding rules.',ok:true,out:'Good call. The session dies and a hidden forwarding rule is found and removed.',why:'Basic auth on IMAP cannot do real MFA, so "MFA satisfied" is itself a red flag. Token revocation kills the live session; mailbox rules are the classic persistence trick.'},
   {t:'Block TCP 993 for the whole company at the perimeter firewall.',ok:false,out:'You cut mail sync for 4,000 users — and the attacker just switches to another legacy protocol.',why:'A network block is blunt and breaks service. Fix the identity problem: revoke tokens and disable legacy auth for the account, then tenant-wide.',fallout:'TCP 993 is closed company-wide. 4,000 users lost mail sync, the attacker moves to POP3, and the NOC is paging you.'}]},
 {tag:'SIEM-4412',sev:'CRITICAL',time:'02:31',title:'NTLM logon to a Tier-0 service account',
  body:'svc_backup (Tier-0, domain-wide rights) does its normal NTLM logon on BKPOOL-01 at 02:00. Four minutes later the <b>same NTLM challenge-response</b> authenticates svc_backup on WS-HELP-07 — an intern workstation.',
  actions:[
   {t:'Close the alert — backup jobs often retry from other servers.',ok:false,out:'By 03:30 the attacker has dumped credentials from two domain controllers.',why:'A retry would come from backup servers, not from an intern workstation. "Often" is not evidence.',fallout:'The alert is closed. By 03:30 the attacker\u2019s tooling holds hashes from two domain controllers.'},
   {t:'Ask the intern to change his own password.',ok:false,out:'Nothing changes for the attacker.',why:'The intern password is not the issue. The captured svc_backup credential is.',fallout:'The intern picks a new password. The stolen svc_backup hash still works everywhere else.'},
   {t:'Isolate WS-HELP-07, disable svc_backup, rotate its vaulted password, and start a lateral-movement hunt.',ok:true,out:'Containment holds. The hunt shows the attacker only reached two file shares.',why:'Replaying captured NTLM traffic is pass-the-hash. Tier-0 means domain-wide blast radius: contain the host, kill the account, rotate the secret, then hunt.'}]},
 {tag:'SIEM-4413',sev:'HIGH',time:'03:02',title:'Push storm on a helpdesk agent',
  body:'38 Microsoft Authenticator push prompts to d.silva (service desk) in 4 minutes. All denied. The user says the prompts started after he entered his password on a "Proxy-IT-Portal" link from an SMS. No approval yet.',
  actions:[
   {t:'Suspend the account, revoke sessions, re-enrol MFA factors, and rotate the password.',ok:true,out:'Clean. No approval happened and the attacker-registered device is removed.',why:'The SMS link means the password is stolen and push bombing is running. Suspending stops an accidental approve; re-enrolment evicts any device the attacker registered.'},
   {t:'Switch the tenant to report-only mode for Conditional Access.',ok:false,out:'The attacker keeps trying. One tired tap is all he needs.',why:'Report-only only watches, it does not block. The account is under active attack right now.',fallout:'Report-only mode watches quietly — and one tired agent approves prompt #41. The attacker is in.'},
   {t:'Raise the push retry limit so prompts stop repeating.',ok:false,out:'The storm continues, now quieter.',why:'That hides the symptom and fatigues the user even more. The password is already stolen.',fallout:'The storm slows to a drizzle. Then a tired agent finally approves one prompt.'}]},
 {tag:'SIEM-4414',sev:'MEDIUM',time:'03:27',title:'RC4 ticket requests for MSSQL_PROD',
  body:'Six Event 4769 TGS requests for SPN MSSQL_PROD within two minutes, from six hosts that never touched this SPN before. Encryption type: RC4 (0x17). The service account password dates from 2019.',
  actions:[
   {t:'Disable the MSSQL_PROD account immediately.',ok:false,out:'Production SQL goes down — and the attacker still cracks the ticket he already holds, offline.',why:'The ticket was already handed out; disabling the account only breaks the service. The cracking happens on the attacker machine.',fallout:'MSSQL_PROD is down and order processing has stopped. The attacker still holds the ticket he already pulled.'},
   {t:'Rotate the KRBTGT password twice right now.',ok:false,out:'You cause a domain-wide authentication storm for nothing.',why:'KRBTGT rotation is the response to a <b>golden ticket</b>, not to Kerberoasting.',fallout:'KRBTGT rotation #1 invalidates every ticket in the domain — production services included. Phones ring everywhere.'},
   {t:'Alert on the pattern, keep the service running, plan a gMSA with a long random password, and review the six source hosts.',ok:true,out:'The six hosts turn out to be a red-team exercise. Detection stays; the ticket is kept as evidence.',why:'This is Kerberoasting recon: someone pulled tickets to crack offline. The account is not compromised yet, so do not break production — rotate to a strong managed secret instead.'}]},
 {tag:'SIEM-4415',sev:'CRITICAL',time:'03:55',title:'Unapproved Tier-0 change',
  body:'PIM activation: helpdesk-admin elevated to Global Admin at 03:55 and created new app credentials for the HR-Sync service principal. No change ticket exists. The activation came from the admin\u2019s usual IP and device.',
  actions:[
   {t:'Treat as routine PIM activation — the IP and device match.',ok:false,out:'The attacker adds a second backdoor while you watch.',why:'Matching context means nothing if the session token was stolen. A no-ticket Global Admin change is always a page.'},
   {t:'Wait for Monday change advisory board to review it.',ok:false,out:'48 hours of free access for the attacker.',why:'A CAB review is for planned changes, not for live suspected compromise.'},
   {t:'Contain: revoke sessions, remove the new credentials, preserve audit logs, open an IR bridge.',ok:true,out:'The HR-Sync credentials had been silently added two days ago via a phishing victim. IR starts with a complete timeline.',why:'Hands on Tier-0 means hands on the identity plane. Revoke first, then preserve evidence — audit logging is part of operational integrity.'}]}],
explain:'Triage order: protect identity first (revoke, disable, rotate), then preserve evidence, then hunt. Match the response to the attack: pass-the-hash means isolate and rotate; MFA fatigue means suspend and re-enrol; Kerberoasting means rotate service secrets without breaking the service; a golden ticket means the KRBTGT double rotation.',
tip:'For each alert ask two things: what is the blast radius, and which single action cuts attacker access without breaking production?'},

{id:'E3',type:'order',theme:'T1',diff:'CHALLENGING',time:150,title:'Rebuild the Kerberos handshake',
hint:'AS comes before TGS: the user proves who they are first, then asks for one specific service. Two ticket types, two trips to the KDC.',
prompt:'Six steps of a Kerberos logon in an Active Directory domain are shuffled. Drag them into the correct order (or use the arrow buttons).',
items:[
 'Client sends AS-REQ to the KDC, proving identity with its long-term key.',
 'KDC answers AS-REP with a TGT encrypted with the KRBTGT key.',
 'Client sends TGS-REQ: it presents the TGT and asks for one specific service.',
 'KDC answers TGS-REP with a service ticket for that service.',
 'Client presents the service ticket to the target server (AP-REQ).',
 'Server validates the ticket with its own key and grants access.'],
explain:'Two tickets, two purposes: the TGT proves who you are to the KDC; the service ticket proves you to one service. The user password never crosses the network — only keys and tickets do. That design is why Kerberos beats sending passwords around, and why the KRBTGT key is so precious to attackers.',
tip:'Memorize the pattern: AS → TGT → TGS → service ticket → AP. "AS" authenticates the user; "TGS" targets a single service.'},

{id:'E4',type:'match',theme:'T7',diff:'CHALLENGING',time:150,title:'Attack → the control that hurts it most',
hint:'Think about where each attack gets its power: a stolen hash, a weak service password, a blind tap, a breached password list, the KRBTGT key, or a stolen code.',
prompt:'Drag each attack onto the single control that hurts it most.',
buckets:[
 'Credential Guard + unique local admin passwords (LAPS)',
 'gMSA: managed service account with a 240+ character auto-rotated password',
 'Number matching + phishing-resistant FIDO2',
 'Breached-password screening + login throttling',
 'KRBTGT double rotation after compromise',
 'Short-lived tokens + PKCE on OAuth apps'],
items:[
 {t:'Pass-the-Hash',b:0,why:'PTH reuses stolen NTLM hashes. Credential Guard keeps hashes out of reach; unique local admin passwords mean one hash opens one machine, not the fleet.'},
 {t:'Kerberoasting',b:1,why:'Kerberoasting cracks the service account password offline. A gMSA password is long, random and auto-rotated, so offline cracking dies.'},
 {t:'Push bombing / MFA fatigue',b:2,why:'The attack abuses blind taps. Number matching and FIDO2 demand shared context, so a blind tap fails.'},
 {t:'Credential stuffing',b:3,why:'Stuffing replays passwords from breach dumps. Screening against breach lists plus throttling kills most replays.'},
 {t:'Golden Ticket',b:4,why:'A golden ticket is forged with the KRBTGT key. Rotating KRBTGT twice (per vendor guidance) invalidates every forged ticket.'},
 {t:'OAuth code theft via open redirect',b:5,why:'A short token life shrinks the window, and PKCE binds the code to one client, so a stolen code is useless.'}],
explain:'Good defense matches the control to the attack mechanic, not to the buzzword. Each of these six attacks fails for a different reason — hash reuse, weak offline-crackable secrets, blind human trust, breached passwords, a leaked signing key, or a replayable code — so each needs its own counter-move.',
tip:'When you see an attack name, ask: what exactly does the attacker reuse? The reused thing tells you which control to pick.'},

{id:'E5',type:'logview',theme:'T7',diff:'EXTREME',time:240,title:'Read the Windows authentication log',
hint:'Count accounts versus attempts per account to tell spray from brute force. Then remember: 4768 = TGT request, 4769 = service ticket request, logon type 9 = NewCredentials.',
logIntro:`You are on shift at Vantor Freight. This export from domain controller VANTOR-FW-DC01 is your only context. Use the filter box like a real SIEM, then answer the questions below.`,
logs:[
 {t:'01:02:11  EVT 4768  TGT requested            user: a.wolf        src: 10[.]0[.]12[.]44',c:'lg-info'},
 {t:'01:07:03  EVT 4625  Logon FAILED (type 3, NTLM)  user: ajones      src: 203[.]0[.]113[.]77',c:'lg-warn'},
 {t:'01:07:31  EVT 4625  Logon FAILED (type 3, NTLM)  user: bsmith      src: 203[.]0[.]113[.]77',c:'lg-warn'},
 {t:'01:08:12  EVT 4625  Logon FAILED (type 3, NTLM)  user: c.lee       src: 203[.]0[.]113[.]77',c:'lg-warn'},
 {t:'01:11:26  EVT 4625  Logon FAILED (type 3, NTLM)  user: d.dubois    src: 203[.]0[.]113[.]77',c:'lg-warn'},
 {t:'01:14:02  EVT 4625  Logon FAILED (type 3, NTLM)  user: svc_reports src: 203[.]0[.]113[.]77',c:'lg-warn'},
 {t:'01:15:02  EVT 4768  TGT requested            user: a.wolf        src: 10[.]0[.]12[.]44',c:'lg-info'},
 {t:'01:18:47  EVT 4625  Logon FAILED (type 3, NTLM)  user: admin       src: 203[.]0[.]113[.]77',c:'lg-warn'},
 {t:'01:19:10  EVT 4740  ACCOUNT LOCKED OUT: svc_reports (threshold reached)',c:'lg-err'},
 {t:'01:21:33  EVT 4625  Logon FAILED (type 3, NTLM)  user: e.torres    src: 203[.]0[.]113[.]77',c:'lg-warn'},
 {t:'01:24:58  EVT 4769  TGS requested: MSSQL_PROD   etype: RC4(0x17)  src: 10[.]0[.]19[.]88',c:'lg-info'},
 {t:'01:28:04  EVT 4624  Logon OK (type 10, RDP)      user: a.wolf      src: 10[.]0[.]12[.]44',c:'lg-ok'},
 {t:'01:31:40  EVT 4625  Logon FAILED (type 3, NTLM)  user: f.mueller   src: 203[.]0[.]113[.]77',c:'lg-warn'},
 {t:'01:33:19  EVT 4624  Logon OK (type 9 NewCredentials, NTLM) user: svc_backup src: 10[.]0[.]12[.]44',c:'lg-warn'},
 {t:'01:35:12  EVT 4625  x9 failures in 60s           user: sa_sql      src: 10[.]0[.]19[.]88',c:'lg-err'},
 {t:'01:38:00  EVT 4634  Logoff                       user: a.wolf      src: 10[.]0[.]12[.]44',c:'lg-dim'}],
subs:[
 {q:'The 4625 events from 203[.]0[.]113[.]77 show one classic pattern. Which one?',
  options:[
   {t:'Brute force: hundreds of tries against the single admin account.',ok:false,why:'Brute force pounds one account. Here many different accounts were tried, a few times each.'},
   {t:'Password spraying: few tries per name, many different names, one source.',ok:true,why:'That is exactly the spray shape: one source, many usernames, 1–2 attempts each — built to stay under per-account lockout thresholds.'},
   {t:'Kerberoasting: many TGS requests for one SPN.',ok:false,why:'Kerberoasting shows up as 4769 TGS requests, not as 4625 failed logons.'},
   {t:'Pass-the-hash replay from a stolen NTLM hash.',ok:false,why:'A replayed hash produces successful type-3 logons, not a wall of failures.'}]},
 {q:'You must prove when a user first asked the KDC for a TGT. Which Event ID do you filter for?',
  options:[
   {t:'4769',ok:false,why:'4769 is a service ticket (TGS) request — one step later in the flow.'},
   {t:'4624',ok:false,why:'4624 is a successful logon, not a ticket request.'},
   {t:'4768',ok:true,why:'4768 = TGT request to the KDC. It fires before any service ticket (4769).'},
   {t:'4740',ok:false,why:'4740 means an account was locked out.'}]},
 {q:'svc_reports got locked out (4740). Given the log, the most likely cause is —',
  options:[
   {t:'The user typed the wrong password three times at the office.',ok:false,why:'The failures for svc_reports came from the external spray IP, not from an office workstation.'},
   {t:'The spray from 203[.]0[.]113[.]77 hit its lockout threshold.',ok:true,why:'The spray touched svc_reports too; enough failures triggered 4740. Lockouts on service accounts are a spray side effect.'},
   {t:'A planned password change by the service owner.',ok:false,why:'A change would be ticketed and would not line up with the spray window.'},
   {t:'A forged ticket was rejected by the KDC.',ok:false,why:'Forged tickets do not cause 4625 failures or 4740 lockouts.'}]},
 {q:'Line 01:33:19 (4624 type 9 NewCredentials with NTLM) is best read as —',
  options:[
   {t:'A normal RDP session from the finance VLAN.',ok:false,why:'RDP is logon type 10, not 9.'},
   {t:'A runas /netonly style logon — also the fingerprint of pass-the-hash tooling.',ok:true,why:'Type 9 NewCredentials means a new set of credentials was used for network access — exactly what runas /netonly and PTH tools produce.'},
   {t:'A backup job using stored credentials.',ok:false,why:'The backup window was 02:00 on the backup servers; this line is out of pattern.'},
   {t:'An automated account lockout response.',ok:false,why:'Lockout responses write 4740 events, not 4624 type 9.'}]},
 {q:'The ×9 failures on sa_sql from an internal host (10[.]0[.]19[.]88) look like —',
  options:[
   {t:'Password spraying across many accounts.',ok:false,why:'All nine attempts hit one account — that is not spraying.'},
   {t:'Kerberoasting from a compromised host.',ok:false,why:'Kerberoasting produces 4769 TGS requests, not 4625 logon failures.'},
   {t:'Brute force on one account — the mirror image of the external spray.',ok:true,why:'Many tries against one account = brute force. Same family as the spray, different target shape.'},
   {t:'Normal user typos.',ok:false,why:'Nine failures in 60 seconds on a SQL service account is not a human mistyping.'}]}],
explain:'Spray = one source, many accounts, few tries each — designed to stay under lockout limits. Brute force = many tries on one account. Event 4768 asks for a TGT; 4769 asks for a service ticket; type 9 NewCredentials with NTLM is the classic pass-the-hash trace. Response: block the source, protect the targeted accounts, and keep lockout thresholds smart — never drop them to 1, or attackers will lock out your whole directory on purpose.',
tip:'Filter by source IP first, then by Event ID. Counting accounts vs attempts per account separates spray from brute force in seconds.'},

{id:'E6',type:'qcm',theme:'T1',diff:'CHALLENGING',time:120,title:'Tokens for a browser app',
hint:'One flow adds a one-time secret that is bound to the client making the request. Implicit is deprecated; the password grant touches raw passwords; client credentials needs a stored secret.',
scenario:'Your team ships a React single-page app that calls an API. Security review says: <b>no client secret may live in the browser</b>, and <b>tokens must never travel in a URL</b> — URLs end up in proxy and history logs.',
prompt:'Which OAuth 2.0 / OpenID Connect setup passes the review?',
options:[
 {t:'Implicit flow with the access token in the URL fragment.',ok:false,why:'Implicit was designed for this once, but it cannot protect the token and is now deprecated. The fragment still leaks to history and logs.'},
 {t:'Resource owner password grant with a custom login form.',ok:false,why:'Your app then touches the raw password — the worst trust position — and it breaks MFA and federation.'},
 {t:'Authorization code flow with PKCE, tokens arriving in the response body.',ok:true,why:'PKCE adds a one-time verifier to the code exchange, so an intercepted code is useless without it. No client secret lives in the browser, and tokens never sit in a URL.'},
 {t:'Client credentials grant with the SPA own client ID.',ok:false,why:'Client credentials is for machine-to-machine calls and requires a secret. A browser cannot keep a secret.'}],
explain:'PKCE (Proof Key for Code Exchange) is the modern answer for public clients: the app creates a one-time verifier, and only that verifier can exchange the code for tokens. Implicit flow is deprecated, the password grant gives the app your raw password, and client credentials is for servers, not browsers.',
tip:'For any public client (SPA, mobile): authorization code + PKCE. If tokens appear in a URL, the design fails the review.'},

{id:'E7',type:'qcm',theme:'T1',diff:'CHALLENGING',time:120,title:'Federation for a government partner',
hint:'Compare POST binding with Redirect binding: where does the assertion physically travel?',
scenario:'A government agency must get SSO into your SaaS. Hard requirements: the assertion must be <b>signed</b>, <b>no identity data may ever appear in a URL</b>, and your identity provider is AD FS.',
prompt:'Which design do you pick?',
options:[
 {t:'SAML 2.0 with signed XML assertions using POST binding.',ok:true,why:'POST binding carries the signed assertion in the message body, never in a URL. Signed SAML assertions are the standard for enterprise and government federation.'},
 {t:'OIDC hybrid flow with the code in the query string.',ok:false,why:'Query strings leak into server logs and browser history. The requirement says nothing in a URL.'},
 {t:'SAML 2.0 with HTTP-Redirect binding for the response.',ok:false,why:'Redirect binding puts the (compressed, signed) assertion into the URL. It fails the "nothing in a URL" rule — and URLs get logged everywhere.'},
 {t:'OAuth 2.0 implicit flow through AD FS.',ok:false,why:'Implicit puts tokens in the URL fragment and signs nothing in the SAML sense. Deprecated for good reason.'}],
explain:'SAML 2.0 with POST binding is the classic enterprise federation answer: the signed XML assertion travels in the body of an auto-submitted form, so it never lands in a URL, a log line, or a Referer header. Identity federation lets your IdP vouch for users to the partner app without sharing passwords.',
tip:'Whenever a requirement says "nothing in a URL", eliminate redirect-style flows first — that usually leaves POST-bound SAML or code-flow OIDC.'},

{id:'E8',type:'spot',theme:'T5',diff:'CHALLENGING',time:150,title:'The pipeline that leaked for 14 months',
hint:'One line holds a literal credential string. Variables and flags are habits; a literal key is an incident.',
prompt:'This deploy job has been pushing to production for 14 months. Click the line that holds the <b>most urgent</b> secrets-management failure.',
lines:[
 {t:'deploy:'},
 {t:'  image: node:20'},
 {t:'  variables:'},
 {t:'    AWS_KEY_ID: "$CI_AWS_KEY_ID"   # stored in CI/CD variables',note:'The variable reference is the right pattern — keep it.'},
 {t:'  script:'},
 {t:'    - export AWS_SECRET_ACCESS_KEY="wJalrXUtnFEMI/K7bXY5zEXAMPLEkey12345"',bad:true},
 {t:'    - npm run build'},
 {t:'    - aws s3 sync ./dist s3://vantor-static-prod --acl public-read',note:'Public-read on a prod bucket is a real finding — exposure, not a leaked secret. Flag it to the app team too.'}],
explain:'A hardcoded secret in a pipeline file lives forever in git history, and bots find it within minutes of a push. The fix has an order: revoke and rotate the key now, purge it from history, and then replace static keys with short-lived federated tokens (OIDC workload identity) for CI/CD so the next leak cannot happen the same way.',
tip:'Anything that looks like a literal credential in code is rotation priority number one. CI/CD pipeline secrets belong in protected variables, a vault, or short-lived federated tokens — never in the job file.'}
];
/* ===== CSAI-101 exam data — part 2 (E9–E16) ===== */
EX.push(
{id:'E9',type:'bank',theme:'T3',diff:'CHALLENGING',time:150,title:'Finish the access governance policy',
hint:'Walk the timeline: joiner → rights → risky task pairs → quarterly check → leaver → what remains if you skip the last step.',
prompt:'Drag each term into the right blank. The word bank is shuffled and contains decoys that fit nowhere.',
text:'POL-ACC-014 — When a new employee joins, [[0]] builds the account from the HR record. Rights must follow [[1]], so each role holds only the access it actually needs. Sensitive task pairs (create a vendor + pay a vendor) must be split across people to enforce [[2]]. Every quarter, managers run an access [[3]] to confirm each right is still needed. When staff leave, [[4]] must happen the same day — otherwise the company accumulates [[5]] that attackers love to find.',
blanks:['provisioning','least privilege','segregation of duties','review','deprovisioning','orphaned accounts'],
decoys:['encryption at rest','firewall rules','penetration testing','credential vaulting'],
explain:'Joiner → provisioning. Rights → least privilege. Risky pairs → segregation of duties. Every quarter → review (recertification). Leaver → deprovisioning. Skip that last step and you get orphaned accounts: active logins with no owner — a favorite backdoor for attackers and a guaranteed audit finding.',
tip:'Link each term to a moment in the identity lifecycle (joiner–mover–leaver, JML) timeline. The lifecycle is the memory trick.'},

{id:'E10',type:'branch',theme:'T5',diff:'EXTREME',time:240,title:'The payments token woke up',
hint:'Live credential first, scope second, replace static secrets third, evidence last.',
intro:`04:10. Your CIEM console pages: the Kubernetes service-account token of namespace <b>payments</b> — which can read secrets <b>cluster-wide</b> — was just used from an unknown IP in a hosting ASN. Four decisions. Choose well.`,
stages:[
 {tag:'STEP 1',sev:'CRITICAL',time:'04:10',title:'Stop the bleeding',
  body:'The token is live right now and is being used from the internet.',
  actions:[
   {t:'Delete the pod that used the token.',ok:false,out:'The pod restarts with the same token, and the attacker was calling from off-cluster anyway.',why:'Deleting a pod changes nothing about a credential that still works.',fallout:'04:12 — the pod restarts with the same token. The unknown IP is still reading secrets.'},
   {t:'Revoke the token and its bound sessions, then issue a fresh one from the vault.',ok:true,out:'The unknown IP starts getting 401s. Bleeding stopped at 04:14.',why:'A live credential beats every other concern. Revoke first — everything else can wait the two minutes it takes.'},
   {t:'Ask the team channel who ran kubectl at 04:00.',ok:false,out:'Two opinions, zero containment.',why:'Curiosity costs minutes while the token still works. Forensics comes after revocation.',fallout:'04:13 — three theories and two memes in the channel. Zero containment. The token is still live.'}]},
 {tag:'STEP 2',sev:'HIGH',time:'04:26',title:'Shrink the blast radius',
  body:'Even after rotation, a replacement token with the same rights would recreate the same risk.',
  actions:[
   {t:'Rename the service account.',ok:false,out:'Attacker tooling does not care about names.',why:'Cosmetic. Names carry no permissions.',fallout:'The service account has a new name — and exactly the same cluster-wide rights.'},
   {t:'Replace cluster-wide rights with a namespaced Role (payments only) and add a TTL.',ok:true,out:'Next quarter a similar leak reads 3 secrets, not 400.',why:'Least privilege: a scoped, short-lived token turns the next leak into a small incident instead of a cluster compromise.'},
   {t:'Move the secret values into a ConfigMap.',ok:false,out:'You just made the secrets easier to read.',why:'ConfigMaps are not encrypted or access-controlled like secrets. That is a downgrade, not a fix.',fallout:'04:30 — the "secrets" now sit in a plain ConfigMap that any pod in the namespace can read.'}]},
 {tag:'STEP 3',sev:'HIGH',time:'04:52',title:'Fix the pipe',
  body:'Root cause: the token was pasted into the CI system last year by a departing engineer.',
  actions:[
   {t:'Store a long-lived kubeconfig as a masked CI variable instead.',ok:false,out:"The next intern's fork reuses the same token.",why:'Masking only hides it in logs. It is still a static key that leaks with the repo or the runner.',fallout:'The token is masked in logs — and still valid, still static, still sitting in the pipeline.'},
   {t:'Use OIDC federation for CI/CD (workload identity): each job gets a short-lived token, no static secret at all.',ok:true,out:'CI/CD now holds no long-lived secret. The attack class is retired.',why:'Federated, per-job tokens remove the permanent credential that leaks in the first place.'},
   {t:'Allowlist the CI IPs on the API server.',ok:false,out:'Better — but the static token still exists and proxies hop IPs.',why:'A useful extra layer, but one control standing alone is not defense in depth.',fallout:'The allowlist is on. An hour later the attacker hops through an open proxy and carries on.'}]},
 {tag:'STEP 4',sev:'MEDIUM',time:'05:30',title:'Keep the record straight',
  body:'Before cleanup: what does operational integrity demand?',
  actions:[
   {t:'Delete the audit logs so the mistake stays internal.',ok:false,out:'Integrity failed harder than the token did.',why:'Tampering with evidence is the fastest way to fail the audit — and it is illegal in many places.'},
   {t:'Reboot the control plane to clear state.',ok:false,out:'Dashboards go red; the timeline is gone.',why:'Rebooting destroys volatile evidence and fixes nothing.'},
   {t:'Snapshot the audit logs and token-use records into the case file.',ok:true,out:'The timeline is complete: what the token read, from where, for how long.',why:'You need the record for the incident report, the client letter and the postmortem. Preserving it is part of operational integrity.'}]}],
explain:'The sequence that works: revoke the live credential, shrink the blast radius with least privilege, replace static secrets with federated short-lived tokens, and preserve the evidence. Notice how each step removes a different class of risk — active access, blast radius, root cause, and accountability.',
tip:'In cloud-native incidents, the credential lifecycle is the incident. Find what is live, kill it, then make the same leak impossible.'},

{id:'E11',type:'terminal',theme:'T7',diff:'EXTREME',time:240,title:'Hands on the keyboard: WS-FIN-042',
hint:'Three reflexes: read the tickets, kill the tickets, list the privileges. The help command lists the shell vocabulary — the rest is standard Windows IR knowledge.',
intro:`You are an IR analyst on Windows host WS-FIN-042 (elevated PowerShell). User f.nakamura worked here before going offline, and a pass-the-hash alert fired. Complete the <b>three tasks</b> by typing real commands. Type <b>help</b> to list the shell vocabulary.`,
prompt:'PS C:\\Users\\ir-analyst>',
tasks:[
 {desc:'Display the Kerberos ticket cache of this session.',
  accept:['klist','klist.exe','klist tickets'],
  short:'klist — ticket cache displayed',
  okMsg:'Current LogonId is 0:0x1a4b9c\n\nCached Tickets: (3)\n\n#0>  Client: f.nakamura @ VANTOR.LOCAL\n     Server: krbtgt/VANTOR.LOCAL @ VANTOR.LOCAL\n     KerbTicket Encryption Type: AES-256\n     End Time: 10/8/2026 4:31:00\n\n#1>  Client: f.nakamura @ VANTOR.LOCAL\n     Server: MSSQL_PROD/VSQL-01.vantor.local @ VANTOR.LOCAL\n     KerbTicket Encryption Type: RC4'},
 {desc:'Purge all Kerberos tickets so any stolen ticket dies on this host.',
  accept:['klist purge'],
  short:'klist purge — tickets destroyed',
  okMsg:'Current LogonId is 0:0x1a4b9c\nDeleting all tickets:\nTicket(s) purged successfully.'},
 {desc:'List the privileges held by the current user.',
  accept:['whoami /priv','whoami -priv'],
  short:'whoami /priv — privileges listed',
  okMsg:'PRIVILEGES INFORMATION\n----------------------\nPrivilege Name                Description                       State\nSeBackupPrivilege             Back up files and directories     Disabled\nSeDebugPrivilege              Debug programs                    Enabled\nSeImpersonatePrivilege        Impersonate a client after auth   Enabled'}],
facts:{'whoami':'vantor\\f.nakamura','hostname':'WS-FIN-042',
 'ipconfig':'Ethernet adapter Ethernet0:\n   IPv4 Address. . . : 10[.]0[.]44[.]12\n   Subnet Mask . . . : 255[.]255[.]255[.]0\n   Default Gateway . . : 10[.]0[.]44[.]1',
 'net user':'User accounts for \\\\WS-FIN-042\n-----------------------------------------\nf.nakamura   ir-analyst   svc_backup\nAdministrator  Guest        krbtgt\nThe command completed successfully.'},
helpText:'Vocabulary: whoami · hostname · ipconfig · net user · cls — plus whatever the tasks require. (Think like a Windows IR analyst.)',
explain:'klist reads the Kerberos ticket cache; klist purge destroys the tickets held in the session — standard after credential theft, so stolen TGT and service tickets stop working on the spot. whoami /priv shows what the current session could do: SeDebugPrivilege, for example, is a prize an attacker would love.',
tip:'Windows IR reflexes on a suspect box: klist, klist purge, whoami /priv. Each answers one question: what identity is here, what can it still touch, and what power does it hold?'},

{id:'E12',type:'multi',theme:'T4',diff:'CHALLENGING',time:120,title:'Build the pass-the-hash defense',
hint:'Two options make things worse or fix a different attack. WDigest caches in clear text; KRBTGT belongs to ticket forgery, not hash reuse.',
prompt:'You are hardening a 4,000-endpoint estate against pass-the-hash. Select every control that genuinely helps.',
options:[
 {t:'Windows Credential Guard on endpoints',ok:true,why:'It seals NTLM hashes and Kerberos keys behind virtualization, so memory-dumping tools come back empty.'},
 {t:'Enable WDigest caching for faster re-authentication',ok:false,why:'The opposite direction: WDigest keeps credentials in clear text in memory. It is the first thing defenders disable.'},
 {t:'Unique, rotated local admin passwords (LAPS-style)',ok:true,why:'One stolen hash then opens one machine, not the fleet.'},
 {t:'Tiered admin model — Tier-0 accounts never log on to lower tiers',ok:true,why:'Privileged credentials only appear where they are needed. Logon exposure is exactly what PTH eats.'},
 {t:'Rotate the KRBTGT key once',ok:false,why:'KRBTGT rotation answers golden tickets, not PTH — and even for golden tickets a single rotation is not the full fix (it takes two).'},
 {t:'Disable or restrict NTLM wherever possible',ok:true,why:'No NTLM challenge-response in play means no hash to replay. Kerberos with AES-only is far harder to reuse.'}],
explain:'Pass-the-hash lives on NTLM hash reuse, standing privilege, and privileged account credentials appearing on machines they should never touch. Credential Guard, unique local admin passwords, strict tiering and restricting NTLM all cut that supply. WDigest does the reverse, and KRBTGT rotation belongs to the golden-ticket playbook.',
tip:'For any "select all that apply" on defenses: find the options that make the attacker impossible, and the ones that quietly help the attacker or fix a different attack.'},

{id:'E13',type:'order',theme:'T3',diff:'CHALLENGING',time:150,title:'Offboard without leaving a door',
hint:'What can still be used while it exists? Sessions first, then everything he knew, then what he owned, then the proof.',
prompt:'T. Okafor leaves Vantor Freight today. He knew team vault codes and owned two pipelines. Order the offboarding steps.',
items:[
 'Disable the account and revoke active sessions and tokens.',
 'Rotate every shared secret he knew (vault codes, pipeline credentials).',
 'Reassign owned resources; strip role groups and entitlements.',
 'Export mailbox and files into the retention archive.',
 'Keep the 30-day grace hold, then delete the account.',
 'Run an IGA check that shows zero orphaned entitlements; close the ticket.'],
explain:'Sessions die before anything else — a disabled account with a live refresh token is still an open door. Rotation follows, because knowledge does not expire with the account. Stripping entitlements and archiving data come next, and the IGA check is the proof that nothing was missed — the proof is exactly what an auditor asks for.',
tip:'Disable → rotate → strip → archive → delete → verify. Verification closes the loop; that is operational integrity.'},

{id:'E14',type:'match',theme:'T3',diff:'CHALLENGING',time:150,title:'Who does what in the identity stack',
hint:'One is an IdP, one sends MFA pushes, one brokers admin sessions, one leases machine secrets, one runs recertification campaigns, one is the directory with Conditional Access.',
prompt:'Drag each platform onto the job it is famous for.',
buckets:[
 'SSO identity provider (IdP) for workforce apps',
 'MFA prompts and device trust checks',
 'Vault, rotate and broker privileged sessions (PAM)',
 'Dynamic, short-lived machine secrets (API keys, DB creds)',
 'Access reviews and certification campaigns (IGA)',
 'Directory plus Conditional Access policies'],
items:[
 {t:'Okta',b:0,why:'Okta sits in front of apps as the SSO identity provider, speaking SAML and OIDC.'},
 {t:'Duo',b:1,why:'Duo is the classic push-based MFA and device trust verification layer.'},
 {t:'CyberArk',b:2,why:'PAM suites like CyberArk vault privileged credentials, let admins check them out for just-in-time (JIT) access, and record every session.'},
 {t:'HashiCorp Vault',b:3,why:'Vault issues dynamic, leased secrets to machines and pipelines — database creds and API keys that expire by themselves.'},
 {t:'SailPoint',b:4,why:'IGA platforms run recertification campaigns: managers approve or revoke every right on a schedule.'},
 {t:'Microsoft Entra ID',b:5,why:'Entra ID (formerly Azure AD) is the cloud directory and the Conditional Access policy engine.'}],
explain:'The identity stack has layers: directory (Entra ID), federation and SSO (Okta), step-up verification (Duo), privileged access with session recording (CyberArk), machine secrets (Vault) and governance (SailPoint). Knowing which layer a tool owns tells you where a finding belongs — and which team gets the ticket.',
tip:'Group by object: humans sign in through IdP+MFA, admins are brokered by PAM, machines lease secrets, and IGA audits all of it.'},

{id:'E15',type:'spot',theme:'T2',diff:'CHALLENGING',time:150,title:'The policy that says yes to everything',
hint:'Read the statement as Allow → Action → Resource → Condition. Which single line removes all limits on what may be done?',
prompt:'An AWS IAM policy attached to the reports role. Click the single line that grants <b>every action</b>.',
lines:[
 {t:'{'},
 {t:'  "Version": "2012-10-17",'},
 {t:'  "Statement": [{'},
 {t:'    "Sid": "ReportsAccess",'},
 {t:'    "Effect": "Allow",'},
 {t:'    "Action": "*",',bad:true},
 {t:'    "Resource": "*",',note:'Resource * without Action * is still bad hygiene — but Action * is what grants everything.'},
 {t:'    "Condition": {"IpAddress": {"aws:SourceIp": "10[.]0[.]0[.]0/8"}}',note:'An IP condition is a real control — but it does not shrink what the role may do.'},
 {t:'  }]}',note:''},
 {t:'}'}],
explain:'"Action": "*" with Effect Allow means the role can do anything the account can do — least privilege is gone, and one phished session key becomes full account takeover. Scope the actions (for example s3:GetObject on one bucket prefix), keep the condition, and add SCP guardrails at the organization level so a mistake like this cannot even attach.',
tip:'Read policies as Allow + Action + Resource + Condition. Any Allow with Action * is an automatic finding, no matter what conditions sit next to it.'},

{id:'E16',type:'qcm',theme:'T4',diff:'CHALLENGING',time:120,title:'Design the break-glass account',
hint:'They must work when everything else is down — but never quietly.',
scenario:'You keep two emergency admin accounts in case the identity provider or the MFA service dies completely. Leadership asks how they are designed.',
prompt:'Which design is right?',
options:[
 {t:'Used daily so the password stays memorable.',ok:false,why:'Daily use turns them into ordinary, exposed credentials — exactly what break-glass accounts must never be.'},
 {t:'Vaulted credentials, exempt from Conditional Access, every use alarms the SOC, monthly review.',ok:true,why:'They must work when everything else is dead, so they sit outside CA — but they can never be used quietly: vaulting controls the secret, alarms watch the use, reviews catch drift.'},
 {t:'Excluded from logging so they never trigger noise.',ok:false,why:'Silence is the attacker dream. Emergency accounts should be the loudest accounts you own.'},
 {t:'Password stored in the team wiki, protected by MFA.',ok:false,why:'If the IdP is down, the wiki is down too. And a wiki is not a vault.'}],
explain:'A break-glass account has one job: work when the identity plane is burning. That means vaulted credentials and Conditional Access exemption — paired with loud alarms on every use and a post-use review. Anything that makes the account quieter or more ordinary destroys its purpose.',
tip:'Emergency access trades convenience for certainty: exempt, vaulted, alarmed, reviewed. Four words, four controls.'}
);
/* ===== CSAI-101 exam data — part 3 (E17–E24) ===== */
EX.push(
{id:'E17',type:'qcm',theme:'T2',diff:'CHALLENGING',time:120,title:'Who may see this patient?',
hint:'The decision needs ward + shift + care relationship, and all three change per request. What do you call trusting a client-side parameter?',
scenario:"St. Adrian's Hospital. A nurse must see only patients of her <b>current ward on her current shift</b>. A covering doctor needs her ward's patients tonight only. In a test, changing the URL to patientId=99117 returned another ward's record.",
prompt:'Which access model fits, and what is the URL trick?',
options:[
 {t:'RBAC by job title; the URL issue is a browser bug.',ok:false,why:'Titles are too coarse: "nurse" does not say which ward or shift. And the URL issue is missing server-side authorization, not a browser bug.'},
 {t:'DAC: each patient record owner decides who to share with.',ok:false,why:'In healthcare, owners sharing freely breaks ward boundaries and privacy law.'},
 {t:'ABAC on ward, shift and care-relationship attributes, re-checked on every request.',ok:true,why:'ABAC decides from attributes of each request — who, where, when, relation to the patient. Re-checking server-side on every request is exactly what kills IDOR.'},
 {t:'MAC with registrar-cleared security labels.',ok:false,why:'Military-style labels fit clearance levels, not "this nurse, this ward, this shift". Too rigid here.'}],
explain:'RBAC grants rights by role; ABAC evaluates attributes of each request and fits fine-grained rules like ward and shift. The URL-parameter trick is IDOR — a broken access control flaw where the server trusted client input. The fix is never trusting the client: authorize on the server, for every request.',
tip:'If access depends on context that changes per request (ward, shift, relation), you are in ABAC territory. If a URL parameter can swap the object, you have IDOR.'},

{id:'E18',type:'dual',theme:'T7',diff:'EXTREME',time:240,title:'Kerberoasting — both sides of the glass',
hint:'Blue: which event ID, which crypto, which volume, which source novelty? Red: where does the cracking happen in a quiet attack?',
scenario:"Vantor's domain: SPN <b>MSSQL_PROD</b> on VSQL-01, password set in 2019, RC4 encryption still allowed for that account.",
parts:[
 {label:'BLUE — detect',tag:'blue',
  prompt:'Which signal confirms Kerberoasting (not normal ticket traffic)?',
  options:[
   {t:'A single 4768 TGT request at sign-in time.',ok:false,why:'Everyone asks for a TGT when they log on. One request is noise.'},
   {t:'Hundreds of 4625 failures against one user.',ok:false,why:'That is password brute force at the logon screen — a different attack with a different log signature.'},
   {t:'A burst of 4769 requests, RC4 (0x17), for one SPN, from hosts that never asked before.',ok:true,why:'Normal users request a service ticket once per service. Many requests, weak old crypto, and new source hosts means someone is pulling tickets to crack offline.'},
   {t:'Event 4670 changing permissions on the SPN object.',ok:false,why:'4670 records a permission change — related to tampering, not to ticket pulling.'}]},
 {label:'RED — next move',tag:'red',
  prompt:'You now hold the RC4 ticket hash of MSSQL_PROD. Your best next move for stealth?',
  options:[
   {t:'Request tickets for every SPN in the domain, repeatedly.',ok:false,why:'That is volume noise, and blue teams alert on exactly that. An operational security failure.'},
   {t:'Leave the network alone and crack the hash offline.',ok:true,why:"Kerberoasting's power is that cracking happens offline — no packets after the pull, nothing to detect while you work."},
   {t:'Spray passwords against the KDC to help the crack.',ok:false,why:'Online guessing is loud and has nothing to do with the ticket you already hold.'},
   {t:'Enable RC4 domain-wide to collect faster next time.',ok:false,why:'You do not control the domain — yet — and such a change would be loud and instantly visible.'}]}],
explain:'Blue looks for 4769 bursts with RC4 encryption from new sources; red values the silence that follows, because cracking happens offline. One move defeats both sides: gMSA-style long random passwords and AES-only for service accounts. Then RC4 becomes a wall instead of a door.',
tip:'Crypto downgrades (AES to RC4) are an easy, reliable detection. Weak crypto on a privileged SPN deserves a page.'},

{id:'E19',type:'order',theme:'T6',diff:'EXTREME',time:150,title:'Rank the CIEM findings',
hint:'Public exposure with instant exploitation goes first; standing Tier-0 without MFA next; fleet-wide reuse next; slow-burn staleness last.',
prompt:'Vantor runs a cloud-native estate and your CIEM console shows five findings. Drag them from MOST urgent to LEAST urgent (exploitability × blast radius).',
items:[
 'Root-style AWS access key committed to a public GitHub repo.',
 'HashiCorp Vault service principal with standing Global Admin, no MFA, password unchanged since 2021.',
 'Identical local admin password on 400 workstations.',
 'Orphaned account of an ex-employee, still active, production read.',
 'Read-only service account untouched for 90 days.'],
explain:'Number 1 is public, root-powered, and already indexed by bots — exploitation is minutes away. Number 2 is one phish away from total cloud compromise: standing Tier-0 rights with no MFA. Number 3 enables lateral movement and local privilege escalation across the fleet. Number 4 is a real but slower burn — it needs someone to attempt the login. Number 5 has the lowest blast radius and belongs in the normal cycle.',
tip:'Score findings as exploitability × blast radius. Public exposure and Tier-0 standing rights sit on top; low-privilege staleness sits at the bottom.'},

{id:'E20',type:'bank',theme:'T6',diff:'CHALLENGING',time:150,title:'Write the Conditional Access policy',
hint:'Legacy protocols cannot do modern MFA. Report-only is the safe first step; emergency accounts stay outside the rules but under alarms.',
prompt:'Drag each term into the right blank. The word bank is shuffled and contains decoys.',
text:'CA-04 — Apply to all users. Block [[0]] protocols (IMAP, POP, SMTP AUTH) tenant-wide: they cannot perform modern MFA. Require [[1]] for all cloud apps. For admin roles, additionally require a [[2]] device (managed and healthy). Roll out in [[3]] mode first to measure who would be blocked. Keep two [[4]] accounts excluded — and alert on every one of their sign-ins. Review the policy every [[5]].',
blanks:['legacy authentication','MFA','compliant device','report-only','break-glass','quarter'],
decoys:['hardcoded token','ACL rule','ZTNA tunnel','guest invite'],
explain:'Legacy authentication is the MFA-less back door, so it dies first. MFA for everyone; compliant device checks for admins. Report-only shows the blast radius before you enforce. Break-glass accounts stay outside the rules but under alarms. Quarterly review keeps the policy honest as the estate changes. This is defense in depth on the identity plane — a core zero-trust move, and your side of the cloud shared responsibility model.',
tip:'Enforcement order matters: legacy auth off → MFA on → device checks for admins — always report-only before enforce.'},

subs:[
 {q:'The 02:55–03:12 failures are —',
  options:[
   {t:'Brute force on the root account.',ok:false,why:'Root was tried once. Many usernames, few tries each — that is the opposite shape.'},
   {t:'Password spraying: one source, many usernames, few tries each.',ok:true,why:'Spray tries common passwords across many names to stay under lockout limits. The log shows exactly that cadence.'},
   {t:'A fail2ban test run.',ok:false,why:'fail2ban blocks after failures — and nothing here suggests a sanctioned test.'},
   {t:'Key-based authentication failures.',ok:false,why:'The lines say "Failed password", not "Failed publickey".'}]},

  options:[

explain:'Spray: few tries per name across many names. The 03:12 failure has no "invalid user" prefix — that is how the spray found a real account, "deploy". The 03:14 success exposes the real issue — password SSH still enabled on a service-style account. The useradd of svcadm plus the authorized_keys write is textbook persistence (new account + attacker key). Containment: isolate, block the source, keys-only SSH, disable both accounts — then sweep every other host for the same pattern.',

{id:'E22',type:'match',theme:'T1',diff:'CHALLENGING',time:150,title:'Pin each protocol to its job',
hint:'Think transport and payload: tickets, XML, JSON ID tokens, provisioning payloads, device-bound keys, directory queries, org policy JSON, scope strings.',
prompt:'Drag each protocol or standard onto the job it actually does.',
buckets:[
 'Ticket-based mutual authentication inside a Windows domain',
 'Signed XML assertions for enterprise SSO',
 'Identity layer on top of OAuth 2.0 — issues signed ID tokens (JWTs)',
 'Automated provisioning of users into applications',
 'Phishing-resistant, passwordless sign-in',
 'Query protocol for directory services',
 'Organization-level guardrails on cloud subscriptions',
 'Limits on what an OAuth app may do'],
items:[
 {t:'Kerberos',b:0,why:'Kerberos issues tickets (TGT, service tickets) through the KDC for mutual authentication inside the domain.'},
 {t:'SAML 2.0',b:1,why:'SAML moves signed XML assertions between IdP and service provider for enterprise federation.'},
 {t:'OpenID Connect (OIDC)',b:2,why:'OIDC adds identity on top of OAuth 2.0 and returns ID tokens (JWTs) that prove who the user is.'},
 {t:'SCIM',b:3,why:'SCIM automates provisioning and deprovisioning of users between the IdP and apps.'},
 {t:'FIDO2 / WebAuthn',b:4,why:'Device-bound key pairs make sign-in phishing-resistant and passwordless.'},
 {t:'LDAP',b:5,why:'LDAP is the query protocol for directory services such as Active Directory.'},
 {t:'SCP',b:6,why:'A Service Control Policy sets maximum permissions for accounts in a cloud organization — guardrails, not grants.'},
 {t:'OAuth scopes',b:7,why:'Scopes cap what the delegated app may do on the user\u2019s behalf.'}],
explain:'Each protocol answers one question: Kerberos — who are you inside the domain; SAML and OIDC — who are you across organizations; SCIM — who should exist in this app; FIDO2 — prove it without a password; LDAP — look the identity up; SCP — the ceiling of what any account can do; scopes — the ceiling of what this one app can do.',
