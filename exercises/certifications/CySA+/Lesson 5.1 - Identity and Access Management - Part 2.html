{id:'E23',type:'qcm',theme:'T2',diff:'CHALLENGING',time:120,title:'Where the zero-trust decision lands',
hint:'Deciding and blocking are different jobs. Which component stands in the traffic path?',
scenario:'Your zero-trust design: a policy decision point (PDP) evaluates identity, device health and context for <b>every request</b> to the finance API.',
prompt:'Where must the decision actually be enforced?',
options:[
 {t:'In the policy enforcement point (PEP) in front of the resource.',ok:true,why:'The PDP only decides; the PEP stands between client and resource and blocks what the PDP refuses. Without a PEP in the path you have dashboards, not zero trust.'},
 {t:'In the PDP itself, next to the engine.',ok:false,why:'Close, but the PDP has no power to stop traffic — it only answers allow or deny. Separation of decision and enforcement is core to NIST SP 800-207.'},
 {t:'In the IdP, once, at first login.',ok:false,why:'Zero trust is per-request evaluation. One check at the front door is the castle-and-moat model you are replacing. The same idea powers ZTNA: the broker checks every connection.'},
 {t:'In the SIEM, via correlation rules.',ok:false,why:'The SIEM sees and alerts; it does not stand in the data path. Detection is not enforcement.'}],
explain:'In zero trust (NIST SP 800-207), the PDP decides and the PEP enforces — and enforcement happens for every request, not once per session. The IdP proves identity; the SIEM watches; but only the PEP standing in the path actually stops a request.',
tip:'Ask of every architecture: which box can physically drop the packet or the API call? That box is your enforcement point.'},

{id:'E24',type:'multi',theme:'T5',diff:'CHALLENGING',time:120,title:'Secrets hygiene audit',
hint:'Short life, one owner, hardware-backed, logged. Anything shared, static, or root-shaped is wrong.',
prompt:'Audit of the platform team secrets practices. Select every CORRECT practice.',
options:[
 {t:'One shared API key per environment for easy debugging',ok:false,why:'Shared keys destroy attribution ("who did this?") and multiply blast radius.'},
 {t:'Secret rotation on a schedule, and after every staff change',ok:true,why:'Rotation shrinks the value of any leaked copy, and staff changes are a known leak moment.'},
 {t:'Commit a .env file to the repo as a backup',ok:false,why:'Git history is forever, and repos go public by accident. Backups belong in the vault, not the repo.'},
 {t:'Dynamic secrets: short-lived, issued per service or session',ok:true,why:'A credential that dies in 60 minutes has almost nothing left to steal. Vault-style dynamic leases are the gold standard.'},
 {t:'Keep a long-lived root token in the pipeline for speed',ok:false,why:'Root tokens bypass all policy, and pipelines leak. Use short-lived federated tokens per job instead.'},
 {t:'One central vault, KMS/HSM-backed, with audit logging of every read',ok:true,why:'Hardware-backed storage plus a read trail gives you both strong protection (encryption at rest) and evidence.'}],
explain:'Good secrets hygiene shares four traits: short life (rotation, dynamic leases), single ownership (no shared keys), strong storage (KMS/HSM-backed vault with encryption at rest), and a full read trail (audit logging). Anything static, shared, or root-shaped fails the test — including pipeline root tokens.',
tip:'For CI/CD specifically: replace static cloud keys with OIDC-federated workload identity, so the pipeline holds no long-lived secret at all.'}

/* ===== engine part 1: helpers + exercise builders ===== */
'use strict';
const $=s=>document.querySelector(s);
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=r[i];r[i]=r[j];r[j]=t;}return r;}

/* pointer-based drag & drop (mouse + touch) */
function makeDrag(el,opts){
  el.classList.add('drag');
  el.addEventListener('pointerdown',ev=>{
    if(opts.enabled&&!opts.enabled())return;
    if(ev.target.closest&&ev.target.closest('button'))return;
    if(ev.pointerType==='mouse'&&ev.button!==0)return;
    ev.preventDefault();
    const rect=el.getBoundingClientRect();
    const ghost=el.cloneNode(true);
    ghost.className=el.className+' drag-ghost';
    ghost.style.width=rect.width+'px';
    ghost.style.left=rect.left+'px';ghost.style.top=rect.top+'px';
    document.body.appendChild(ghost);
    const dx=ev.clientX-rect.left,dy=ev.clientY-rect.top;
    let hot=null,moved=false;
    const move=e=>{
      moved=true;
      ghost.style.left=(e.clientX-dx)+'px';ghost.style.top=(e.clientY-dy)+'px';
      const t=document.elementFromPoint(e.clientX,e.clientY);
      let tg=t?t.closest(opts.dropSel):null;
      if(tg===el)tg=null;
      if(hot&&hot!==tg)hot.classList.remove('drop-hot');
      if(tg)tg.classList.add('drop-hot');
      hot=tg;
    };
    const done=e=>{
      window.removeEventListener('pointermove',move);
      if(hot)hot.classList.remove('drop-hot');
      ghost.remove();
      if(hot&&moved)opts.onDrop(el,hot,e.clientX,e.clientY);
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',done,{once:true});
    window.addEventListener('pointercancel',done,{once:true});
  });
}

/* ---- QCM (single choice) ---- */
function buildChoice(d){
  const opts=shuffle(d.options.map((o,i)=>({t:o.t,ok:!!o.ok,why:o.why||'',_i:i})));
  const st={sel:-1,locked:false,btns:[]};
  function render(el){
    st.root=el;el.innerHTML='';
    if(d.scenario)el.appendChild(h('div','scenario',d.scenario));
    el.appendChild(h('div','qtext',d.prompt));
    const list=h('div','opts');st.btns=[];
    opts.forEach((o,idx)=>{
      const b=h('button','opt'+(st.sel===idx?' sel':''),'<span class="okey">'+String.fromCharCode(65+idx)+'</span><span class="otxt">'+o.t+'</span>');
      b.type='button';
      b.onclick=()=>{if(st.locked)return;st.sel=idx;opts.forEach((_,j)=>st.btns[j].classList.toggle('sel',j===idx));};
      st.btns.push(b);list.appendChild(b);
    });
    el.appendChild(list);
  }
  function mark(){
    st.btns.forEach((b,idx)=>{
      b.classList.remove('sel','dim');
      if(opts[idx].ok)b.classList.add('good');
      else if(idx===st.sel)b.classList.add('bad');
      else b.classList.add('dim');
    });
  }
  return{render,
    grade(){
      const ok=st.sel>=0&&opts[st.sel].ok;
      return{frac:ok?1:0,
        your:st.sel>=0?opts[st.sel].t:'(no answer)',
        correct:opts.find(o=>o.ok).t,
        detail:(st.sel>=0&&!ok)?'<div class="dline dl-bad"><b>Why your pick fails:</b><span>'+opts[st.sel].why+'</span></div>':''};
    },
    lock(){st.locked=true;mark();}};
}

/* ---- multi-select with partial credit ---- */
function buildMulti(d){
  const opts=shuffle(d.options.map((o,i)=>({t:o.t,ok:!!o.ok,why:o.why||'',_i:i})));
  const st={sel:new Set(),locked:false,btns:[]};
  function render(el){
    st.root=el;el.innerHTML='';
    el.appendChild(h('div','qtext',d.prompt));
    const list=h('div','opts');st.btns=[];
    opts.forEach((o,idx)=>{
      const b=h('button','opt'+(st.sel.has(idx)?' sel':''),'<span class="okey">'+(st.sel.has(idx)?'✓':String.fromCharCode(65+idx))+'</span><span class="otxt">'+o.t+'</span>');
      b.type='button';
      b.onclick=()=>{
        if(st.locked)return;
        if(st.sel.has(idx))st.sel.delete(idx);else st.sel.add(idx);
        b.classList.toggle('sel',st.sel.has(idx));
        b.querySelector('.okey').textContent=st.sel.has(idx)?'✓':String.fromCharCode(65+idx);
      };
      st.btns.push(b);list.appendChild(b);
    });
    el.appendChild(list);
  }
  function mark(){
    st.btns.forEach((b,idx)=>{
      b.classList.remove('sel','dim');
      if(opts[idx].ok)b.classList.add('good');
      else if(st.sel.has(idx))b.classList.add('bad');
      else b.classList.add('dim');
      b.querySelector('.okey').textContent=opts[idx].ok?'✓':String.fromCharCode(65+idx);
    });
  }
  return{render,
    grade(){
      let g=0,b=0;st.sel.forEach(i=>{opts[i].ok?g++:b++;});
      const n=opts.filter(o=>o.ok).length;
      const frac=Math.max(0,(g-b)/n);
      const your=st.sel.size?[...st.sel].map(i=>opts[i].t).join(' · '):'(nothing selected)';
      const correct=opts.filter(o=>o.ok).map(o=>o.t).join(' · ');
      let det='';
      st.sel.forEach(i=>{if(!opts[i].ok)det+='<div class="dline dl-bad"><b>'+opts[i].t+'</b><span>'+opts[i].why+'</span></div>';});
      opts.forEach((o,i)=>{if(o.ok&&!st.sel.has(i))det+='<div class="dline dl-ok"><b>You missed:</b> '+o.t+'<span>'+o.why+'</span></div>';});
      return{frac,your,correct,detail:det};
    },
    lock(){st.locked=true;mark();}};
}

/* ---- drag to reorder ---- */
function buildOrder(d){
  const n=d.items.length;
  const st={order:shuffle(d.items.map((_,i)=>i)),locked:false};
  function render(el){
    st.root=el;el.innerHTML='';
    el.appendChild(h('div','qtext',d.prompt));
    const list=h('div','olist');
    st.order.forEach((key,pos)=>{
      const item=h('div','order-item','<span class="grab">⠿</span><span class="pos">'+(pos+1)+'</span><span class="otxt">'+d.items[key]+'</span><span class="mv"><button class="mini up" type="button">↑</button><button class="mini dn" type="button">↓</button></span>');
      item.dataset.key=key;
      makeDrag(item,{dropSel:'.order-item',enabled:()=>!st.locked,onDrop:(drag,target,x,y)=>{
        const r=target.getBoundingClientRect();
        const before=y<r.top+r.height/2;
        if(before)list.insertBefore(drag,target);else list.insertBefore(drag,target.nextSibling);
        st.order=[...list.children].map(c=>+c.dataset.key);
        render(el);
      }});
      item.querySelector('.up').onclick=()=>{if(st.locked||pos===0)return;const t=st.order[pos];st.order[pos]=st.order[pos-1];st.order[pos-1]=t;render(el);};
      item.querySelector('.dn').onclick=()=>{if(st.locked||pos===n-1)return;const t=st.order[pos];st.order[pos]=st.order[pos+1];st.order[pos+1]=t;render(el);};
      list.appendChild(item);
    });
    el.appendChild(list);
    st.listEl=list;
  }
  function mark(){
    [...st.listEl.children].forEach((c,pos)=>{
      c.classList.remove('off');
      if(st.order[pos]===pos)c.classList.add('good');else c.classList.add('off');
    });
  }
  return{render,
    grade(){
      const m=st.order.reduce((s,k,i)=>s+(k===i?1:0),0);
      return{frac:m/n,
        your:st.order.map((k,i)=>(i+1)+'. '+d.items[k]).join('<br>'),
        correct:d.items.map((t,i)=>(i+1)+'. '+t).join('<br>'),
        detail:''};
    },
    lock(){st.locked=true;if(st.listEl)mark();}};
}

/* ---- drag items into buckets (matching) ---- */
function buildMatch(d){
  const items=shuffle(d.items.map((it,i)=>({t:it.t,b:it.b,why:it.why||'',_i:i})));
  const st={place:items.map(()=>-1),sel:null,locked:false,chipEls:{}};
  function render(el){
    st.root=el;el.innerHTML='';
    el.appendChild(h('div','qtext',d.prompt));
    const pool=h('div','pool','<span class="pool-label">Drag from here — or click a chip, then click a box</span>');
    const buckets=h('div','buckets');
    const chipFor=i=>{
      const c=h('span','bchip'+(st.sel===i?' sel':'')+' '+(st.locked?(st.place[i]===items[i].b?'good':'bad'):''),items[i].t);
      c.dataset.i=i;
      makeDrag(c,{dropSel:'.bucket,.pool',enabled:()=>!st.locked,onDrop:(chipEl,target)=>{
        const id=+chipEl.dataset.i;
        st.place[id]=target.classList.contains('pool')?-1:+target.dataset.b;
        st.sel=null;render(el);
      }});
      c.onclick=()=>{if(st.locked)return;st.sel=st.sel===i?null:i;render(el);};
      st.chipEls[i]=c;return c;
    };
    items.forEach((it,i)=>{if(st.place[i]===-1)pool.appendChild(chipFor(i));});
    d.buckets.forEach((bname,bi)=>{
      const bk=h('div','bucket');bk.dataset.b=bi;
      bk.appendChild(h('div','bname',bname));
      const bi2=h('div','bitems');
      items.forEach((it,i)=>{if(st.place[i]===bi)bi2.appendChild(chipFor(i));});
      bk.appendChild(bi2);
      bk.onclick=e=>{
        if(st.locked||e.target.closest('.bchip'))return;
        if(st.sel!=null){st.place[st.sel]=bi;st.sel=null;render(el);}
      };
      buckets.appendChild(bk);
    });
    pool.onclick=e=>{
      if(st.locked||e.target.closest('.bchip'))return;
      if(st.sel!=null){st.place[st.sel]=-1;st.sel=null;render(el);}
    };
    el.appendChild(pool);el.appendChild(buckets);
  }
  return{render,
    grade(){
      const good=items.reduce((s,it,i)=>s+(st.place[i]===it.b?1:0),0);
      let det=items.map((it,i)=>{
        const ok=st.place[i]===it.b;
        return '<div class="dline '+(ok?'dl-ok':'dl-bad')+'"><b>'+it.t+'</b> → '+d.buckets[it.b]+(ok?'':'<span>You placed it in: '+(st.place[i]>=0?d.buckets[st.place[i]]:'(left in pool)')+' — '+it.why+'</span>')+'</div>';
      }).join('');
      return{frac:good/items.length,
        your:good+' of '+items.length+' placed in the right box',
        correct:'See the item-by-item verdict below',detail:det};
    },
    lock(){st.locked=true;st.sel=null;render(st.root);}};
}

/* ---- word bank fill-in-the-blanks ---- */
function buildBank(d){
  const words=shuffle(d.blanks.concat(d.decoys).map(w=>w));
  const st={fill:d.blanks.map(()=>null),sel:null,locked:false};
  function norm(x){return (x||'').toLowerCase().trim();}
  function render(el){
    st.root=el;el.innerHTML='';
    el.appendChild(h('div','qtext',d.prompt));
    const para=h('div','banktext');
    const parts=d.text.split(/\[\[(\d+)\]\]/);
    parts.forEach(p=>{
      const m=p.match(/^\d+$/);
      if(m){
        const k=+p;
        const fi=st.fill[k];
        const word=fi!=null?words[fi]:'&nbsp;';
        const b=h('span','blank'+(fi!=null?' filled':''),word);
        b.dataset.k=k;
        b.onclick=()=>{
          if(st.locked)return;
          if(st.fill[k]!=null&&st.sel==null){st.fill[k]=null;render(el);}
          else if(st.sel!=null){st.fill[k]=st.sel;st.sel=null;render(el);}
        };
        makeDrag(b,{dropSel:'.blank',enabled:()=>!st.locked,onDrop:(wEl,tgt)=>{
          const wi=wEl.dataset.w!=null?+wEl.dataset.w:null;
          if(wi==null)return;
          const tk=+tgt.dataset.k;
          st.fill[tk]=wi;st.sel=null;render(el);
        }});
        para.appendChild(b);
      }else if(p)para.appendChild(document.createTextNode(p));
    });
    el.appendChild(para);
    const bank=h('div','bank');
    words.forEach((w,wi)=>{
      const used=st.fill.indexOf(wi);
      if(used>=0&&st.locked)return;
      if(used>=0)return;
      const c=h('span','wchip'+(st.sel===wi?' sel':'')+' '+(st.locked?'dim':''),w);
      c.dataset.w=wi;
      makeDrag(c,{dropSel:'.blank',enabled:()=>!st.locked,onDrop:(chipEl,tgt)=>{
        st.fill[+tgt.dataset.k]=+chipEl.dataset.w;st.sel=null;render(el);
      }});
      c.onclick=()=>{if(st.locked)return;st.sel=st.sel===wi?null:wi;render(el);};
      bank.appendChild(c);
    });
    el.appendChild(bank);
    st.blankEls=[...para.querySelectorAll('.blank')];
  }
  function mark(){
    st.blankEls.forEach(b=>{
      const k=+b.dataset.k;
      const fi=st.fill[k];
      b.classList.remove('filled');
      if(fi!=null&&norm(words[fi])===norm(d.blanks[k]))b.classList.add('good');
      else if(fi!=null)b.classList.add('bad');
    });
  }
  return{render,
    grade(){
      const good=st.fill.reduce((s,fi,k)=>s+(fi!=null&&norm(words[fi])===norm(d.blanks[k])?1:0),0);
      const your=st.fill.map((fi,k)=>'Blank '+(k+1)+': '+(fi!=null?words[fi]:'(empty)')).join(' · ');
      const correct=d.blanks.map((w,k)=>'Blank '+(k+1)+': '+w).join(' · ');
      return{frac:good/d.blanks.length,your,correct,detail:''};
    },
    lock(){st.locked=true;st.sel=null;render(st.root);mark();}};
}

/* ---- spot the flaw (click a line) ---- */
function buildSpot(d){
  const st={sel:-1,locked:false,lineEls:[]};
  function render(el){
    st.root=el;el.innerHTML='';
    el.appendChild(h('div','qtext',d.prompt));
    const box=h('div','codeblock');st.lineEls=[];
    d.lines.forEach((ln,i)=>{
      const row=h('button','cline'+(st.sel===i?' sel':''),'<span class="lnum">'+String(i+1).padStart(2,'0')+'</span><span>'+escapeHtml(ln.t)+'</span>');
      row.type='button';
      row.onclick=()=>{if(st.locked)return;st.sel=i;st.lineEls.forEach((r,j)=>r.classList.toggle('sel',j===i));};
      st.lineEls.push(row);box.appendChild(row);
      if(st.locked&&ln.note)row.appendChild(h('span','cnote','↳ '+ln.note));
    });
    el.appendChild(box);
  }
  function mark(){
    st.lineEls.forEach((r,i)=>{
      r.classList.remove('sel');
      if(d.lines[i].bad)r.classList.add('good');
      else if(i===st.sel)r.classList.add('bad');
    });
  }
  return{render,
    grade(){
      const ok=st.sel===d.lines.findIndex(l=>l.bad);
      const badLine=d.lines.find(l=>l.bad).t;
      const your=st.sel>=0?d.lines[st.sel].t:'(nothing clicked)';
      let det='';
      if(st.sel>=0&&!ok&&d.lines[st.sel].note)det='<div class="dline dl-bad"><b>You flagged:</b> '+escapeHtml(d.lines[st.sel].t)+'<span>'+d.lines[st.sel].note+'</span></div>';
      return{frac:ok?1:0,your,correct:badLine,detail:det};
    },
    lock(){st.locked=true;if(st.root){render(st.root);mark();}}};
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ---- log viewer with filter + sub-questions ---- */

      const det=d.subs.map((s,qi)=>{

      }).join('');
      return{frac:good/d.subs.length,
        your:good+' of '+d.subs.length+' sub-questions right',
        correct:'All sub-answers marked green above',detail:det};
    },
    lock(){st.locked=true;mark();}};
}

/* ---- staged scenario (SOC triage / branching) ---- */
function buildStages(d,api){
  const st={i:0,picks:[],locked:false};
  function render(el){
    st.root=el;el.innerHTML='';
    if(d.intro)el.appendChild(h('div','scenario',d.intro));
    if(st.locked){
      el.appendChild(h('div','qtext','Scenario complete — recap:'));
      return;
    }
    const sIdx=st.i,s=d.stages[sIdx];
    if(sIdx>0){
      const pa=d.stages[sIdx-1].actions[st.picks[sIdx-1]];
      if(pa&&pa.fallout)el.appendChild(h('div','scenario badfall','<b>Fallout from your last call:</b> '+pa.fallout));
    }
    el.appendChild(h('div','stagehead','STEP '+(sIdx+1)+' / '+d.stages.length));
    const card=h('div','alertcard');
    const head=h('div','ahead','<span class="atag">'+s.tag+'</span><span class="sev sev-'+s.sev+'">'+s.sev+'</span><span class="atime">'+s.time+'</span>');
    card.appendChild(head);
    card.appendChild(h('div','atitle',s.title));
    card.appendChild(h('div','abody',s.body));
    el.appendChild(card);
    const pick=st.picks[sIdx];
    if(pick==null){
      const btns=h('div','abtns');
      s.actions.forEach((a,ai)=>{
        const b=h('button','opt','<span class="okey">'+String.fromCharCode(65+ai)+'</span><span class="otxt">'+a.t+'</span>');
        b.type='button';
        b.onclick=()=>{
          if(st.picks[sIdx]!=null)return;
          st.picks[sIdx]=ai;
          render(el);
          if(sIdx===d.stages.length-1){/* last step: show verdict button */}
        };
        btns.appendChild(b);
      });
      el.appendChild(btns);
    }else{
      const a=s.actions[pick];
      const oc=h('div','outcome '+(a.ok?'oc-ok':'oc-bad'),
        '<b>'+(a.ok?'✔ Good move — this is the playbook answer.':'✘ This made it worse.')+'</b><br>'+a.out+'<br><span class="mut">'+a.why+'</span>');
      el.appendChild(oc);
      const nb=h('button','btn primary oc-next');
      nb.type='button';
      nb.textContent=sIdx===d.stages.length-1?'See verdict →':'Next step →';
      nb.onclick=()=>{
        if(sIdx===d.stages.length-1){st.locked=true;render(el);api.submit(true);}
        else{st.i++;render(el);}
      };
      el.appendChild(nb);
    }
  }
  return{render,
    grade(){
      const good=st.picks.reduce((g,ai,i)=>g+(d.stages[i].actions[ai]&&d.stages[i].actions[ai].ok?1:0),0);
      const det=d.stages.map((s,i)=>{
        const ai=st.picks[i],a=s.actions[ai];
        const best=s.actions.find(x=>x.ok);
        const ok=a&&a.ok;
        return '<div class="dline '+(ok?'dl-ok':'dl-bad')+'"><b>'+s.tag+' — '+s.title+'</b><span>'+(ok?'✔ ':'✘ ')+ (a?a.t:'(no choice)') + (ok?' — '+a.why:' | Best: '+best.t+' — '+best.why)+'</span></div>';
      }).join('');
      return{frac:good/d.stages.length,
        your:good+' of '+d.stages.length+' best actions chosen',
        correct:'The best action at every step (see recap)',detail:det};
    },
    lock(){st.locked=true;render(st.root);}};
}

/* ---- terminal emulator ---- */
function buildTerm(d){
  const st={done:new Set(),lines:[],cur:'',locked:false};
  st.lines.push('Microsoft PowerShell — IR session (elevated) on WS-FIN-042');
  st.lines.push("Type 'help' to list the shell vocabulary.");
  function push(txt,cls){String(txt).split('\n').forEach(t=>st.lines.push({t:t,cls:cls||''}));}
  function render(el){
    st.root=el;el.innerHTML='';
    el.appendChild(h('div','scenario',d.intro));
    const tl=h('div','tasklist');
    d.tasks.forEach((t,i)=>{
      tl.appendChild(h('div','task'+(st.done.has(i)?' done':''),'<span class="tdot"></span><span>Task '+(i+1)+': '+t.desc+'</span>'));
    });
    el.appendChild(tl);
    const term=h('div','term');
    term.appendChild(h('div','termhead','WS-FIN-042 — PowerShell'));
    const out=h('div','tout');
    st.lines.slice(-60).forEach(l=>{
      out.appendChild(h('div','tline '+(l.cls||''),escapeHtml(typeof l==='string'?l:l.t)));
    });
    term.appendChild(out);
    const row=h('div','tin');
    row.appendChild(h('span','tprompt',d.prompt));
    const inp=h('input');inp.value=st.cur;inp.autocomplete='off';inp.spellcheck=false;if(st.locked)inp.disabled=true;
    inp.oninput=()=>{st.cur=inp.value;};
    inp.onkeydown=e=>{if(e.key==='Enter'){exec(inp.value);}};
    row.appendChild(inp);
    term.appendChild(row);
    el.appendChild(term);
    st.inpEl=inp;st.outEl=out;
    setTimeout(()=>{if(!st.locked&&st.inpEl)st.inpEl.focus();},50);
    out.scrollTop=out.scrollHeight;
  }
  function exec(raw){
    st.cur='';
    push(d.prompt+' '+raw,'t-in');
    const c=raw.trim().toLowerCase().replace(/\s+/g,' ');
    if(!c){render(st.root);return;}
    if(st.locked){push('Shell locked — answer already submitted.','t-dim');render(st.root);return;}
    if(c==='cls'||c==='clear'){st.lines=[];}
    else if(c==='help'){push(d.helpText,'t-dim');}
    else if(d.facts[c]){push(d.facts[c]);}
    else{
      const ti=d.tasks.findIndex(t=>t.accept.indexOf(c)>=0);
      if(ti<0){push(raw+' : The term is not recognized. Type help.','t-err');}
      else if(st.done.has(ti)){push('Task '+(ti+1)+' already completed.','t-dim');}
      else{st.done.add(ti);push(d.tasks[ti].okMsg);push('✔ Task '+(ti+1)+' complete: '+d.tasks[ti].short,'t-ok');}
    }
    render(st.root);
  }
  return{render,
    grade(){
      const your=d.tasks.filter((t,i)=>st.done.has(i)).map(t=>t.short).join(' · ')||'(no task completed)';
      const correct=d.tasks.map(t=>t.accept[0]).join(' · ');
      return{frac:st.done.size/d.tasks.length,your,correct,detail:''};
    },
    lock(){st.locked=true;render(st.root);}};
}

/* ---- dual perspective (blue/red) ---- */
function buildDual(d){
  const parts=d.parts.map(p=>({opts:shuffle(p.options.map(o=>({t:o.t,ok:!!o.ok,why:o.why||''}))),sel:-1}));
  const st={locked:false};
  function render(el){
    st.root=el;el.innerHTML='';
    if(d.scenario)el.appendChild(h('div','scenario',d.scenario));
    const duo=h('div','duo');
    d.parts.forEach((p,pi)=>{
      const card=h('div','duocard');
      card.appendChild(h('span','duotag '+p.tag,p.label));
      card.appendChild(h('div','qtext',p.prompt));
      const wrap=h('div','opts');
      const btns=[];
      parts[pi].opts.forEach((o,oi)=>{
        const b=h('button','opt'+(parts[pi].sel===oi?' sel':''),'<span class="okey">'+String.fromCharCode(65+oi)+'</span><span class="otxt">'+o.t+'</span>');
        b.type='button';
        b.onclick=()=>{
          if(st.locked)return;
          parts[pi].sel=oi;
          btns.forEach((x,j)=>x.classList.toggle('sel',j===oi));
        };
        btns.push(b);wrap.appendChild(b);
      });
      card.appendChild(wrap);
      duo.appendChild(card);
      st['btns'+pi]=btns;
    });
    el.appendChild(duo);
  }
  function mark(){
    d.parts.forEach((p,pi)=>{
      const btns=st['btns'+pi];
      parts[pi].opts.forEach((o,oi)=>{
        btns[oi].classList.remove('sel');
        if(o.ok)btns[oi].classList.add('good');
        else if(oi===parts[pi].sel)btns[oi].classList.add('bad');
        else btns[oi].classList.add('dim');
      });
    });
  }
  return{render,
    grade(){
      const det=d.parts.map((p,pi)=>{
        const s=parts[pi];
        const ok=s.sel>=0&&s.opts[s.sel].ok;
        const okOpt=s.opts.find(o=>o.ok);
        return '<div class="dline '+(ok?'dl-ok':'dl-bad')+'"><b>'+p.label+'</b><span>'+(s.sel>=0?'Your pick: '+s.opts[s.sel].t+' — ':'(no answer) ')+(ok?'correct. '+okOpt.why:'correct: '+okOpt.t+' — '+okOpt.why)+'</span></div>';
      }).join('');
      const good=parts.reduce((g,s)=>g+(s.sel>=0&&s.opts[s.sel].ok?1:0),0);
      return{frac:good/2,your:good+' of 2 perspectives right',correct:'Both best answers marked green',detail:det};
    },
    lock(){st.locked=true;mark();}};
}

/* ---------- exam ---------- */
function startExam(){
  built={};hints={};
  S={order:shuffle(EX.map((_,i)=>i)),cur:0,ans:{},score:0,finished:false,paused:false,tLeft:timeTotal(),tick:null,elapsed:0};
  document.getElementById('topbar').classList.remove('hidden');
  document.getElementById('stage').innerHTML=
    '<div class="examwrap">'+
    '<div class="pbar"><div class="pfill" id="pfill"></div></div>'+
    '<div class="qnav" id="qnav"></div>'+
    '<div class="tstrip" id="tstrip"></div>'+
    '<section class="card" id="excard"></section>'+
    '<div class="exnav">'+
      '<button class="btn ghost" id="prevBtn">← Prev</button>'+
      '<button class="btn ghost" id="hintBtn">Hint (−10%)</button>'+
      '<button class="btn primary" id="submitBtn">Submit answer</button>'+
      '<button class="btn ghost" id="nextBtn">Next →</button>'+
    '</div></div>';
  document.getElementById('prevBtn').onclick=()=>{if(S.cur>0)go(S.cur-1);};
  document.getElementById('nextBtn').onclick=()=>{if(S.cur<EX.length-1)go(S.cur+1);else askFinish();};
  document.getElementById('hintBtn').onclick=useHint;
  document.getElementById('submitBtn').onclick=()=>submitCurrent(false);
  updateHUD();paintStrip();go(0);
  clearInterval(S.tick);
  S.tick=setInterval(()=>{if(!S.paused&&!S.finished){S.tLeft--;S.elapsed++;paintTimer();if(S.tLeft<=0)timeUp();}},1000);
  paintTimer();
}

function go(pos){
  S.cur=pos;
  renderPills();
  const i=S.order[pos],d=EX[i];
  const inst=built[i]||(built[i]=BUILDERS[d.type](d,{submit:a=>submitCurrent(a)}));
  const card=document.getElementById('excard');
  card.classList.remove('fadein');void card.offsetWidth;card.classList.add('fadein');
  card.innerHTML='';
  card.appendChild(h('h2','extitle',d.title));
  card.appendChild(h('div','exhead',
    '<span class="chip c-'+d.theme+'">'+THEMES[d.theme]+'</span>'+
    '<span class="chip '+(d.diff==='EXTREME'?'diff-e':'diff-c')+'">'+d.diff+'</span>'+
    '<span class="chip pts">Question '+(pos+1)+' / '+EX.length+'</span>'+
    '<span class="chip pts">10 pts</span>'));
  const body=h('div','exbody');card.appendChild(body);
  inst.render(body);
  const hasAns=!!S.ans[i];
  const autoType=(d.type==='triage'||d.type==='branch');
  document.getElementById('submitBtn').classList.toggle('hidden',hasAns||autoType);
  document.getElementById('hintBtn').classList.toggle('hidden',hasAns||hints[i]);
  document.getElementById('hintBtn').textContent=hints[i]?'Hint used (−10%)':'Hint (−10%)';
  const fb=h('div','fb');fb.id='fb';card.appendChild(fb);
  if(hints[i]&&!hasAns)card.insertBefore(h('div','tipbox','<b>Hint (−10% of this question):</b>'+d.hint),fb);
  if(hasAns)paintFeedback(fb,i);
  card.classList.toggle('locked',hasAns);
  document.getElementById('prevBtn').disabled=pos===0;
  document.getElementById('nextBtn').textContent=pos===EX.length-1?'Finish & grade →':'Next →';
  window.scrollTo({top:0,behavior:'smooth'});
}

function useHint(){
  if(!S||S.finished)return;
  const i=S.order[S.cur];
  if(S.ans[i]||hints[i])return;
  hints[i]=true;
  const d=EX[i];
  const hb=h('div','tipbox','<b>Hint (−10% of this question):</b>'+d.hint);
  const card=document.getElementById('excard');
  card.insertBefore(hb,document.getElementById('fb'));
  const b=document.getElementById('hintBtn');
  b.textContent='Hint used (−10%)';
  b.classList.add('hidden');
}

function submitCurrent(auto){
  if(!S||S.finished)return;
  const pos=S.cur,i=S.order[pos],d=EX[i],inst=built[i];
  if(S.ans[i])return;
  const res=inst.grade();
  const max=hints[i]?9:10;
  const earned=Math.round(max*res.frac*10)/10;
  S.ans[i]={frac:res.frac,earned:earned,max:max,your:res.your,correct:res.correct,detail:res.detail||'',auto:!!auto};
  S.score+=earned;
  inst.lock();
  const card=document.getElementById('excard');
  card.classList.add('locked');
  const fb=document.getElementById('fb');
  if(fb)paintFeedback(fb,i);
  document.getElementById('submitBtn').classList.add('hidden');
  document.getElementById('hintBtn').classList.add('hidden');
  updateHUD();renderPills();paintStrip();
  if(fb)fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function paintFeedback(fb,i){
  const d=EX[i],a=S.ans[i];
  fb.innerHTML='';
  const cls=a.frac>=1?'good':(a.frac>0?'mid':'bad');
  const verdict=a.frac>=1?'Correct':(a.frac>0?'Partially correct':'Incorrect');
  fb.appendChild(h('div','fbhead '+cls,'<b>'+verdict+'</b> — '+a.earned+' / '+a.max+' pts'+(a.auto?' <span class="mut">(graded automatically)</span>':'')));
  fb.appendChild(h('div','kv','<span>Your answer</span><div>'+a.your+'</div>'));
  if(a.frac<1&&a.correct)fb.appendChild(h('div','kv','<span>Correct answer</span><div>'+a.correct+'</div>'));
  if(a.detail)fb.appendChild(h('div','repdetail',a.detail));
  fb.appendChild(h('div','expbox','<b>Why:</b> '+d.explain));
  if(a.frac<1&&d.tip)fb.appendChild(h('div','tipbox','<b>Focus next:</b> '+d.tip));
}

function updateHUD(){
  const pts=Math.round(S.score*10)/10;
  document.getElementById('scorePts').textContent=pts+' / '+ptsTotal()+' pts';
  document.getElementById('scorePct').textContent=Math.round(S.score/ptsTotal()*100)+'%';
  const answered=Object.keys(S.ans).length;
  document.getElementById('pfill').style.width=(answered/EX.length*100)+'%';
}

function renderPills(){
  const nav=document.getElementById('qnav');
  nav.innerHTML='';
  S.order.forEach((idx,pos)=>{
    let c='pill';
    const a=S.ans[idx];
    if(a)c+=a.frac>=1?' p-ok':(a.frac>0?' p-part':' p-zero');
    if(pos===S.cur)c+=' p-cur';
    const p=h('button',c,String(pos+1));
    p.type='button';
    p.onclick=()=>go(pos);
    nav.appendChild(p);
  });
}

function paintStrip(){
  const strip=document.getElementById('tstrip');
  strip.innerHTML='';
  Object.keys(THEMES).forEach(t=>{
    const te=themeEarn(t);
    strip.appendChild(h('div','tchip','<b>'+THEMES[t]+'</b><div class="tbar"><i style="width:'+(te.m?te.e/te.m*100:0)+'%"></i></div><em>'+te.e+'/'+te.m+'</em>'));
  });
}

function paintTimer(){
  const t=document.getElementById('timer');
  t.textContent=S.paused?'PAUSED':fmt(S.tLeft);
  t.classList.toggle('low',!S.paused&&S.tLeft<300);
}

/* ---------- pause ---------- */
function setPause(on){
  if(!S||S.finished)return;
  S.paused=on;
  document.getElementById('overlay').classList.toggle('hidden',!on);
  document.getElementById('stage').classList.toggle('blurme',on);
  paintTimer();
}

/* ---------- finish / time up ---------- */
function askFinish(){
  const un=EX.filter((_,i)=>!S.ans[i]).length;
  document.getElementById('modalTxt').textContent=un
    ?un+' question(s) are unanswered — they score 0. Grade the exam now?'
    :'All questions answered. Grade the exam now?';
  document.getElementById('modal').classList.remove('hidden');
}

function finishExam(expired){
  clearInterval(S.tick);S.finished=true;
  EX.forEach((_,i)=>{
    if(!S.ans[i])S.ans[i]={frac:0,earned:0,max:hints[i]?9:10,your:expired?'(unanswered — time expired)':'(skipped — no answer submitted)',correct:'',detail:'',auto:false};
  });
  renderResults(expired);
}

function timeUp(){finishExam(true);}

/* ---------- results ---------- */
function renderResults(expired){
  document.getElementById('topbar').classList.add('hidden');
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('modal').classList.add('hidden');
  document.getElementById('stage').classList.remove('blurme');
  const total=ptsTotal();
  const pctRaw=S.score/total*100;
  const pct=Math.round(pctRaw*10)/10;
  const pass=S.score>=passPts();
  const fullCount=EX.filter((_,i)=>S.ans[i]&&S.ans[i].frac>=1).length;
  const partCount=EX.filter((_,i)=>S.ans[i]&&S.ans[i].frac>0&&S.ans[i].frac<1).length;
  const zeroCount=EX.length-fullCount-partCount;
  const hintCount=Object.keys(hints).length;
  const dateStr=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  const certId='CSAI-'+Math.floor(1000+Math.random()*9000);
  let tstat='';
  Object.keys(THEMES).forEach(t=>{
    const te=themeEarn(t);
    tstat+='<div class="tstat"><b>'+THEMES[t]+'</b><div class="tbar"><i style="width:'+(te.m?te.e/te.m*100:0)+'%"></i></div><em>'+te.e+' / '+te.m+' pts</em></div>';
  });
  const report=S.order.map((idx,n)=>{
    const d=EX[idx],a=S.ans[idx];
    const stc=a.frac>=1?'st-ok':(a.frac>0?'st-part':'st-zero');
    return '<details class="rep '+stc+'">'+
      '<summary><span class="dot"></span><span class="repn">'+(n+1)+'.</span><span class="rept">'+d.title+'</span><span class="repscore">'+a.earned+' / '+a.max+' pts</span></summary>'+
      '<div class="repbody">'+
        '<div class="exhead"><span class="chip c-'+d.theme+'">'+THEMES[d.theme]+'</span><span class="chip '+(d.diff==='EXTREME'?'diff-e':'diff-c')+'">'+d.diff+'</span>'+(hints[idx]&&S.ans[idx]?'<span class="chip warnchip">hint used · −10%</span>':'')+'</div>'+
        '<div class="kv"><span>Your answer</span><div>'+a.your+'</div></div>'+
        (a.frac<1&&a.correct?'<div class="kv"><span>Correct answer</span><div>'+a.correct+'</div></div>':'')+
        (a.detail?'<div class="repdetail">'+a.detail+'</div>':'')+
        '<div class="expbox"><b>Why:</b> '+d.explain+'</div>'+
        (a.frac<1&&d.tip?'<div class="tipbox"><b>Focus next:</b> '+d.tip+'</div>':'')+
      '</div></details>';
  }).join('');
  const verdict=pass
    ?'<div class="cert"><div class="certin"><div class="ctop">CERTIFICATE OF ACHIEVEMENT</div><h2>Certified — Secure Access &amp; Identity</h2><p>Exam CSAI-101 · passed with a final score of <b>'+Math.round(S.score*10)/10+' / '+total+' ('+pct+'%)</b></p><div class="cmeta">Awarded '+dateStr+' · Certificate ID '+certId+' · Pass threshold '+passPts()+'/'+total+'</div><div class="cseal">VERIFIED PASS</div></div></div>'
    :'<div class="failbox"><h2>Below the '+Math.round(PASS_RATIO*100)+'% threshold — retake required</h2><p>You scored '+Math.round(S.score*10)/10+' / '+total+' ('+pct+'%). The pass mark is '+passPts()+' points.<br>Study the report below — every wrong answer has a focused tip. Then hit retake: the questions and answer choices will be reshuffled.</p></div>';
  document.getElementById('stage').innerHTML=
  '<div class="results fadein">'+
    '<div class="rhead">'+
      '<div class="rwrap"><svg class="ringsvg" viewBox="0 0 120 120"><circle class="rbg" cx="60" cy="60" r="52"/><circle class="rfg '+(pass?'okk':'badd')+'" id="rfg" cx="60" cy="60" r="52"/></svg><div class="rnum" id="rnum">0%</div></div>'+
      '<div class="rstats">'+
        '<div class="stat"><b>'+Math.round(S.score*10)/10+'/'+total+'</b><span>final score</span></div>'+
        '<div class="stat"><b>'+fullCount+'</b><span>fully correct</span></div>'+
        '<div class="stat"><b>'+partCount+'</b><span>partially correct</span></div>'+
        '<div class="stat"><b>'+zeroCount+'</b><span>wrong / skipped</span></div>'+
        '<div class="stat"><b>'+hintCount+'</b><span>hints used</span></div>'+
        '<div class="stat"><b>'+fmt(S.elapsed)+'</b><span>time used'+(expired?' (expired)':'')+'</span></div>'+
      '</div>'+
    '</div>'+
    '<div class="verdict">'+verdict+'</div>'+
    '<h3 class="rsec">Per-theme mastery</h3><div class="tstatgrid">'+tstat+'</div>'+
    '<h3 class="rsec">Detailed report — every exercise explained</h3><div class="report">'+report+'</div>'+
    '<div class="exnav" style="justify-content:center;margin-top:24px">'+
      '<button class="btn primary xl" id="retakeBtn">↺ Retake exam (reshuffled)</button>'+
    '</div>'+
  '</div>';
  const C=2*Math.PI*52;
  const rfg=document.getElementById('rfg');
  rfg.style.strokeDasharray=C;
  rfg.style.strokeDashoffset=C;
  setTimeout(()=>{rfg.style.strokeDashoffset=C*(1-Math.min(1,pctRaw/100));},80);
  const rnum=document.getElementById('rnum');
  const t0=performance.now();
  (function cnt(now){
    const p=Math.min(1,(now-t0)/1300);
    rnum.textContent=Math.round(pct*p)+'%';
    if(p<1)requestAnimationFrame(cnt);
  })(t0);
  document.getElementById('retakeBtn').onclick=()=>startExam();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- wire static chrome ---------- */
document.getElementById('pauseBtn').onclick=()=>setPause(true);
document.getElementById('resumeBtn').onclick=()=>setPause(false);
document.getElementById('mNo').onclick=()=>document.getElementById('modal').classList.add('hidden');
document.getElementById('mYes').onclick=()=>{document.getElementById('modal').classList.add('hidden');finishExam(false);};

renderIntro();
</script>
</body>
</html>
