<!DOCTYPE html>
<!-- CDPP-101 Exam Simulator v2.0 — single self-contained file, vanilla JS, no external dependencies -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDPP-101 — Certified Data Protection Practitioner — Exam Simulator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#070b12; --panel:#0e1520; --panel2:#121b29; --panel3:#0a1018;
  --line:#1e2a3d; --line2:#27395a;
  --text:#dbe4f0; --muted:#8ba0b8; --dim:#5b6b82;
  --cyan:#22d3ee; --green:#34d399; --red:#f87171; --amber:#fbbf24; --purple:#a78bfa;
  --mono:'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace;
}
html{scroll-behavior:smooth}
body{
  font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh; line-height:1.55;
  background-image:
    radial-gradient(1000px 500px at 15% -10%, rgba(34,211,238,.10), transparent 60%),
    radial-gradient(900px 500px at 110% 15%, rgba(167,139,250,.09), transparent 60%),
    linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
  background-size:auto,auto,44px 44px,44px 44px;
}
.wrap{max-width:1160px;margin:0 auto;padding:20px 18px 70px}
.dim{color:var(--dim)} .mut{color:var(--muted)}
b{color:#f1f6fc}
/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:60;background:rgba(7,11,18,.94);backdrop-filter:blur(9px);border-bottom:1px solid var(--line)}
.hud-in{max-width:1160px;margin:0 auto;padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:210px}
.brand .logo{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:14px;letter-spacing:.5px;line-height:1.15}
.brand span.sub{font-size:11px;color:var(--muted)}
.hud-mid{flex:1;display:flex;align-items:center;gap:12px;min-width:230px}
.qcount{font-family:var(--mono);font-size:13px;color:var(--cyan);white-space:nowrap}
.pbar{height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.pbar>div{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .6s cubic-bezier(.2,.8,.2,1);border-radius:99px;box-shadow:0 0 12px rgba(34,211,238,.6)}
.hud-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--cyan);background:var(--panel2);border:1px solid var(--line);padding:5px 13px;border-radius:9px;min-width:96px;text-align:center;transition:color .3s}
.timer.warn{color:var(--amber)} .timer.danger{color:var(--red);animation:pulse 1s infinite}
.scorebox{font-family:var(--mono);font-size:13px;color:var(--text);background:var(--panel2);border:1px solid var(--line);padding:8px 12px;border-radius:9px;white-space:nowrap;transition:transform .2s}
.scorebox.bump{transform:scale(1.08);border-color:var(--cyan)}
.hud-themes{max-width:1160px;margin:0 auto;padding:0 18px 8px;display:flex;gap:7px;flex-wrap:wrap}
.theme-chip{font-size:11px;font-family:var(--mono);color:var(--muted);border:1px solid var(--line);background:var(--panel3);border-radius:99px;padding:2px 10px;white-space:nowrap}
.theme-chip b{color:var(--cyan);font-weight:600}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0;border-radius:10px;padding:11px 22px;font-size:14.5px;font-weight:600;color:#04222b;background:linear-gradient(135deg,#67e8f9,#22d3ee);box-shadow:0 4px 18px rgba(34,211,238,.28);transition:transform .15s,box-shadow .15s,filter .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(34,211,238,.4)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--line2);box-shadow:none}
.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:none}
.btn-warn{background:transparent;color:var(--amber);border:1px dashed var(--amber);box-shadow:none;font-weight:600}
.btn-warn:hover{background:rgba(251,191,36,.08);transform:translateY(-1px)}
.btn-danger{background:linear-gradient(135deg,#fb7185,#ef4444);color:#2a0505}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn-big{padding:15px 34px;font-size:16.5px}
/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 10px 34px rgba(0,0,0,.35);margin:16px 0}
.qcard{position:relative;animation:fadeUp .45s ease}
.badge{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:1px;padding:3px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);text-transform:uppercase}
.badge.extreme{color:#fda4af;border-color:#7f1d1d;background:rgba(248,113,113,.08)}
.badge.challenging{color:#fcd34d;border-color:#78350f;background:rgba(251,191,36,.07)}
.badge.theme{color:var(--cyan);border-color:#155e75;background:rgba(34,211,238,.06)}
.scenario{background:var(--panel3);border:1px solid var(--line);border-left:3px solid var(--cyan);padding:14px 16px;border-radius:10px;margin:14px 0;font-size:14.5px}
.scenario.red{border-left-color:var(--red)}
.scenario.blue{border-left-color:var(--cyan)}
.scenario table{border-collapse:collapse;margin-top:8px;width:100%;font-size:13px}
.scenario td{border:1px solid var(--line);padding:5px 9px;vertical-align:top}
.scenario td:first-child{color:var(--muted);white-space:nowrap}
.prompt{font-size:16.5px;font-weight:600;margin:16px 0 10px;color:#eef5fb}
.kbd{font-family:var(--mono);background:var(--panel3);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:.92em;color:#a5f3fc}
/* ---------- options ---------- */
.opt{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin:9px 0;cursor:pointer;background:var(--panel2);transition:border-color .18s,background .18s,transform .18s;user-select:none}
.opt:hover{border-color:var(--cyan);transform:translateX(3px)}
.opt.sel{border-color:var(--cyan);background:rgba(34,211,238,.09)}
.opt.correct{border-color:var(--green);background:rgba(52,211,153,.13)}
.opt.wrong{border-color:var(--red);background:rgba(248,113,113,.12)}
.opt input{margin-top:4px;accent-color:var(--cyan);flex:none}
.opt .k{font-family:var(--mono);color:var(--cyan);font-weight:700;flex:none}
.graded .opt{pointer-events:none}
.graded .opts,.graded .dz,.graded .chip,.graded .ord-item,.graded .spotline,.graded .bopt,.graded select,.graded .term-line{pointer-events:none}
/* ---------- chips / dropzones ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:7px 13px;border:1px solid var(--line2);border-radius:99px;background:linear-gradient(180deg,#16233a,#101a2c);cursor:grab;user-select:none;touch-action:none;transition:border-color .15s,box-shadow .15s,transform .15s;max-width:100%}
.chip:hover{border-color:var(--cyan);box-shadow:0 0 10px rgba(34,211,238,.25)}
.chip.sel{border-color:var(--amber);background:rgba(251,191,36,.1);box-shadow:0 0 12px rgba(251,191,36,.3)}
.chip.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.95;transform:rotate(2deg);box-shadow:0 14px 30px rgba(0,0,0,.5);cursor:grabbing;margin:0}
.chip.src-drag{opacity:.35}
.chip.hit{border-color:var(--green);background:rgba(52,211,153,.14)}
.chip.miss{border-color:var(--red);background:rgba(248,113,113,.14)}
.chipbank{min-height:52px}
.dz{border:2px dashed var(--line2);border-radius:10px;min-height:46px;padding:7px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;background:rgba(255,255,255,.015);transition:border-color .15s,background .15s,box-shadow .15s}
.dz.hot{border-color:var(--cyan);background:rgba(34,211,238,.09);box-shadow:inset 0 0 20px rgba(34,211,238,.18)}
.dz.filled{border-style:solid}
.dz.ok{border-color:var(--green)} .dz.ko{border-color:var(--red)}
.binrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.bin{display:flex;flex-direction:column}
.bin .binh{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.5px;padding:8px 11px;border:1px solid var(--line2);border-bottom:0;border-radius:10px 10px 0 0;background:var(--panel2);color:var(--cyan)}
.bin .dz{min-height:130px;border-radius:0 0 10px 10px;flex-direction:column;align-items:stretch}
.bin .dz .chip{border-radius:10px;justify-content:flex-start}
.blank{display:inline-flex;min-width:130px;min-height:30px;border-bottom:2px dashed var(--cyan);margin:2px 3px;padding:2px 8px;vertical-align:middle;align-items:center;flex-wrap:wrap}
.blank.filled{border-style:solid;border-color:var(--line2)}
.blank.ok{border-color:var(--green);background:rgba(52,211,153,.08)}
.blank.ko{border-color:var(--red);background:rgba(248,113,113,.08)}
.matchrow{display:flex;align-items:stretch;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.matchrow .ml{flex:1;display:flex;align-items:center;font-size:14px;padding:8px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:9px}
.matchrow .mslot{flex:1}
.helper{font-size:12px;color:var(--dim);margin:8px 0;font-style:italic}
/* ---------- order/rank ---------- */
.ord-item{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:grab;touch-action:none;user-select:none;transition:border-color .15s}
.ord-item:hover{border-color:var(--line2)}
.ord-item.dragging{opacity:.45;border-style:dashed;border-color:var(--cyan)}
.ord-item .pos{font-family:var(--mono);color:var(--dim);font-size:12px;min-width:22px;text-align:center}
.ord-item .grip{color:var(--dim);font-family:var(--mono);letter-spacing:-1px;cursor:grab}
.ord-item .otxt{flex:1;font-size:14px}
.ord-item .arrows{display:flex;gap:5px}
.ord-item .arrows button{background:var(--panel3);border:1px solid var(--line);color:var(--muted);border-radius:6px;width:26px;height:24px;cursor:pointer;font-size:11px}
.ord-item .arrows button:hover{color:var(--cyan);border-color:var(--cyan)}
.ord-item.pos-ok{border-color:var(--green)} .ord-item.pos-ko{border-color:var(--red)}
/* ---------- spot ---------- */
.spotline{font-family:var(--mono);font-size:12.8px;padding:7px 11px;border:1px solid transparent;border-left:3px solid var(--line);border-radius:7px;cursor:pointer;display:flex;gap:11px;margin:4px 0;background:var(--panel3);user-select:none}
.spotline:hover{border-color:var(--cyan)}
.spotline.sel{border-color:var(--amber);background:rgba(251,191,36,.09)}
.spotline.hit{border-color:var(--green);background:rgba(52,211,153,.13)}
.spotline.miss{border-color:var(--red);background:rgba(248,113,113,.11)}
.spotline .ln{color:var(--dim);min-width:24px;text-align:right;flex:none}
.spot-wrap{background:#05080d;border:1px solid #132033;border-radius:11px;padding:11px;margin:10px 0;overflow-x:auto}
/* ---------- terminal ---------- */
.term{background:#05080d;border:1px solid #132033;border-radius:11px;font-family:var(--mono);font-size:13.3px;margin:12px 0;overflow:hidden}
.term-title{background:#0a121d;padding:7px 13px;font-size:11.5px;color:var(--dim);border-bottom:1px solid #132033;display:flex;justify-content:space-between}
.term-out{padding:12px 14px;max-height:250px;overflow:auto;color:#9fe8b8;white-space:pre-wrap;word-break:break-word}
.term-out .cmd{color:#7dd3fc}
.term-out .err{color:#f87171}
.term-out .okline{color:#34d399;font-weight:700}
.term-line{display:flex;gap:9px;padding:9px 14px;border-top:1px solid #132033;align-items:center}
.term-line .ps1{color:#34d399;white-space:nowrap}
.term-line input{flex:1;background:transparent;border:0;color:#d7ffe6;font-family:var(--mono);font-size:13.3px;outline:none}
.tasklist{list-style:none;margin:10px 0}
.tasklist li{display:flex;gap:9px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;font-size:13.5px;background:var(--panel2)}
.tasklist li .st{font-family:var(--mono);color:var(--dim);flex:none}
.tasklist li.done{border-color:var(--green)} .tasklist li.done .st{color:var(--green)}
/* ---------- log viewer ---------- */
.logview{background:#05080d;border:1px solid #132033;border-radius:11px;font-family:var(--mono);font-size:12.3px;margin:12px 0;overflow:hidden}
.logbar{display:flex;gap:8px;padding:9px 12px;border-bottom:1px solid #132033;align-items:center;flex-wrap:wrap}
.logbar input{flex:1;min-width:170px;background:#0a1018;border:1px solid #1c2c44;color:var(--text);padding:7px 11px;border-radius:8px;font-family:var(--mono);font-size:12.5px;outline:none}
.logbar input:focus{border-color:var(--cyan)}
.qf{font-size:11px;font-family:var(--mono);color:var(--cyan);background:rgba(34,211,238,.07);border:1px solid #155e75;border-radius:99px;padding:3px 10px;cursor:pointer}
.qf:hover{background:rgba(34,211,238,.16)}
.logcount{font-size:11px;color:var(--dim);white-space:nowrap}
.loglines{padding:9px 12px;max-height:330px;overflow:auto}
.logline{padding:2px 6px;white-space:nowrap}
.logline .num{color:#33435c;display:inline-block;width:28px;user-select:none}
.t-dim{color:#5b6b82}.t-time{color:#6ee7f9}.t-user{color:#c4b5fd}.t-bad{color:#f87171;font-weight:700}.t-warn{color:#fbbf24}
/* ---------- branch ---------- */
.branch-step{margin:14px 0}
.outcome{margin-top:10px;padding:11px 14px;border-radius:9px;background:rgba(167,139,250,.07);border:1px dashed var(--purple);font-size:13.8px;color:#e6e2fb;animation:fadeUp .35s ease}
.bopt{width:100%;text-align:left;display:flex;gap:11px;align-items:flex-start}
/* ---------- feedback ---------- */
.explain{margin-top:16px;border-radius:12px;padding:15px 17px;border:1px solid var(--line);border-left:4px solid var(--cyan);background:rgba(34,211,238,.05);animation:fadeUp .4s ease;font-size:14.3px}
.explain.good{border-left-color:var(--green);background:rgba(52,211,153,.06)}
.explain.bad{border-left-color:var(--red);background:rgba(248,113,113,.05)}
.explain.part{border-left-color:var(--amber);background:rgba(251,191,36,.05)}
.explain h4{margin-bottom:8px;font-size:15.5px}
.explain .vr-good{color:var(--green)} .explain .vr-bad{color:var(--red)} .explain .vr-part{color:var(--amber)}
.yr{display:grid;grid-template-columns:1fr;gap:6px;margin:10px 0;font-size:13.5px}
.yr .row{padding:8px 12px;border-radius:8px;background:var(--panel3);border:1px solid var(--line);margin:6px 0;font-size:13.5px}
.yr .row b.lab{color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:1px;display:block;margin-bottom:2px}
.tipbox{margin-top:11px;padding:10px 13px;border-radius:9px;background:rgba(251,191,36,.07);border:1px dashed rgba(251,191,36,.55);color:#fde68a;font-size:13.5px}
.hintbox{margin-top:11px;padding:10px 13px;border-radius:9px;background:rgba(167,139,250,.08);border:1px dashed rgba(167,139,250,.6);color:#ddd6fe;font-size:13.5px;animation:fadeUp .3s ease}
.navrow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
/* ---------- intro ---------- */
.hero{text-align:center;padding:44px 8px 18px}
.hero .tagline{font-family:var(--mono);color:var(--cyan);font-size:12.5px;letter-spacing:3px;text-transform:uppercase}
.hero h1{font-size:36px;margin:10px 0 6px;letter-spacing:.5px;background:linear-gradient(90deg,#67e8f9,#a5b4fc 55%,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{color:var(--muted);max-width:760px;margin:0 auto;font-size:15px}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin:24px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.stat b{font-size:21px;color:var(--cyan);display:block;font-family:var(--mono)}
.stat span{font-size:12px;color:var(--muted)}
h3.sect{font-size:15px;letter-spacing:1.5px;text-transform:uppercase;color:var(--cyan);margin:26px 0 12px;font-family:var(--mono);display:flex;align-items:center;gap:10px}
h3.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.kwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:12px}
.kwcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
.kwcard h4{color:var(--cyan);margin-bottom:8px;font-size:13.5px}
.kwtag{display:inline-block;font-size:12px;padding:3px 10px;border:1px solid var(--line2);border-radius:99px;margin:3px 2px;background:var(--panel2);color:var(--muted)}
.typechips{display:flex;flex-wrap:wrap;gap:7px}
.typechips .kwtag{color:#9db4cc}
.rules{list-style:none;margin-top:6px}
.rules li{padding:7px 0 7px 26px;position:relative;font-size:14.2px;color:var(--text);border-bottom:1px dashed rgba(30,42,61,.7)}
.rules li::before{content:"▸";position:absolute;left:6px;color:var(--cyan)}
/* ---------- results ---------- */
.pct{font-size:58px;font-weight:800;font-family:var(--mono);line-height:1}
.banner-pass,.banner-fail{border-radius:13px;padding:16px 22px;margin:14px 0;font-size:16px;font-weight:600}
.banner-pass{background:rgba(52,211,153,.09);border:1px solid rgba(52,211,153,.5);color:#a7f3d0}
.banner-fail{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.5);color:#fecaca}
.cert{border:3px double var(--cyan);outline:1px solid rgba(34,211,238,.35);outline-offset:7px;border-radius:6px;padding:36px 28px;text-align:center;margin:24px 0;position:relative;background:radial-gradient(600px 300px at 50% 0%,rgba(34,211,238,.09),transparent 70%),var(--panel3);animation:fadeUp .6s ease}
.cert .ctitle{font-family:Georgia,'Times New Roman',serif;font-size:30px;color:#f8fafc;letter-spacing:1px}
.cert .csub{font-family:var(--mono);color:var(--cyan);letter-spacing:3px;font-size:11px;text-transform:uppercase;margin-top:4px}
.cert .cname{font-family:Georgia,'Times New Roman',serif;font-size:26px;color:#fde68a;border-bottom:1px dashed var(--line2);display:inline-block;padding:0 26px 4px;margin:16px 0 4px;min-width:280px;outline:none}
.cert .cmeta{color:var(--muted);font-size:13px;margin-top:10px}
.seal{width:92px;height:92px;border-radius:50%;border:2px solid var(--amber);box-shadow:0 0 0 5px rgba(251,191,36,.12);display:flex;align-items:center;justify-content:center;margin:16px auto 4px;color:var(--amber);font-weight:800;font-size:11px;text-align:center;transform:rotate(-8deg);line-height:1.3;font-family:var(--mono)}
.rbar{height:11px;background:var(--panel3);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.rbar>div{height:100%;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1);border-radius:99px}
.trow{display:grid;grid-template-columns:210px 1fr 62px;gap:12px;align-items:center;margin:9px 0;font-size:13.5px}
.trow .tn{color:var(--text)} .trow .tv{font-family:var(--mono);color:var(--muted);text-align:right}
.rep-card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--dim);border-radius:12px;padding:16px 18px;margin:12px 0;animation:fadeUp .4s ease}
.rep-card.ok{border-left-color:var(--green)} .rep-card.ko{border-left-color:var(--red)} .rep-card.part{border-left-color:var(--amber)}
.rep-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.rep-head .rq{font-family:var(--mono);color:var(--dim);font-size:12px}
.rep-head .rt{font-weight:700;font-size:14.5px;flex:1}
.filterbar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.fbtn{font-size:12.5px;font-family:var(--mono);padding:7px 15px;border-radius:99px;border:1px solid var(--line2);background:transparent;color:var(--muted);cursor:pointer}
.fbtn.on{color:#04222b;background:var(--cyan);border-color:var(--cyan);font-weight:700}
/* ---------- pause overlay ---------- */
#pauseOverlay{position:fixed;inset:0;background:rgba(4,7,12,.9);backdrop-filter:blur(6px);z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:20px}
#pauseOverlay h2{font-family:var(--mono);letter-spacing:6px;font-size:26px;color:var(--amber)}

<script>
'use strict';
/* ================= utils ================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function el(tag, cls, html){ const d = document.createElement(tag); if(cls) d.className = cls; if(html !== undefined) d.innerHTML = html; return d; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(arr){ const a = arr.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function fmtT(sec){ sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; const mm = (h ? String(m).padStart(2,'0') : String(m)); return (h ? h + ':' + mm : m) + ':' + String(s).padStart(2,'0'); }
function letters(i){ return String.fromCharCode(65 + i); }

/* ================= themes & keywords ================= */
const THEMES = {
  T1:{ name:'Data Protection Fundamentals', short:'Fundamentals' },
  T2:{ name:'CIA Triad & Core Safeguards', short:'CIA Triad' },
  T3:{ name:'Access, Backup & Monitoring Ops', short:'Operations' },
  T4:{ name:'Compliance: GDPR & PCI-DSS', short:'Compliance' },
  T5:{ name:'Lifecycle, Classification & Encryption States', short:'Lifecycle' }
};
const KEYWORDS = {
  T1:['data protection','sensitive information','unauthorized access','data loss','data corruption','data misuse','security policies','security controls','strategies'],
  T2:['confidentiality','integrity','availability','CIA triad','3-2-1 backup rule','RPO / RTO'],
  T3:['access controls','least privilege','need-to-know','backup and recovery','monitoring','DLP','SOC triage','incident containment'],
  T4:['compliance','regulations','GDPR','72-hour breach notification','right to erasure','DPO','PCI-DSS','cardholder data environment','CVV storage rule','ASV scans','network segmentation'],
  T5:['data classification','data lifecycle','encryption','data at rest','data in transit','data in use','TLS','secure destruction','integrity checksum']
};

/* ================= generic drag & drop engine (mouse + touch via pointer events, plus tap-to-place) ================= */
const Drag = (() => {
  let cur = null;   /* active pointer drag */
  let sel = null;   /* tap-selected chip */
  function inGraded(n){ const q = n.closest('.qbody'); return q ? q.classList.contains('graded') || q.closest('.graded') : false; }
  function down(e){
    const chip = e.target.closest ? e.target.closest('.chip') : null;
    if(!chip || inGraded(chip)) return;
    if(e.button !== undefined && e.button !== 0) return;
    cur = { chip, x0: e.clientX, y0: e.clientY, ghost: null, moved: false };
    e.preventDefault();
  }
  function dzUnder(x, y){
    const els = document.elementsFromPoint(x, y);
    for(const n of els){ const z = n.closest ? n.closest('.dz') : null; if(z && !inGraded(z)) return z; }
    return null;
  }
  function move(e){
    if(!cur) return;
    const dx = e.clientX - cur.x0, dy = e.clientY - cur.y0;
    if(!cur.moved && Math.hypot(dx, dy) > 7){
      cur.moved = true;
      const r = cur.chip.getBoundingClientRect();
      const g = cur.chip.cloneNode(true);
      g.classList.remove('sel'); g.classList.add('ghost');
      g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
      document.body.appendChild(g);
      cur.ghost = g; cur.chip.classList.add('src-drag');
    }
    if(cur.ghost){
      cur.ghost.style.left = (e.clientX - cur.ghost.offsetWidth / 2) + 'px';
      cur.ghost.style.top = (e.clientY - 19) + 'px';
      $$('.dz.hot').forEach(z => z.classList.remove('hot'));
      const z = dzUnder(e.clientX, e.clientY);
      if(z) z.classList.add('hot');
      e.preventDefault();
    }
  }
  function up(e){
    if(!cur) return;
    const c = cur; cur = null;
    $$('.dz.hot').forEach(z => z.classList.remove('hot'));
    if(c.ghost){
      c.ghost.remove(); c.chip.classList.remove('src-drag');
      const z = dzUnder(e.clientX, e.clientY);
      if(z) place(c.chip, z);
    } else {
      /* tap gesture */
      if(inGraded(c.chip)) return;
      if(sel === c.chip){ sel.classList.remove('sel'); sel = null; }
      else { if(sel) sel.classList.remove('sel'); sel = c.chip; c.chip.classList.add('sel'); }
    }
  }
  function clickHandler(e){
    const dz = e.target.closest ? e.target.closest('.dz') : null;
    if(!dz || inGraded(dz) || !sel) return;
    if(sel.parentElement === dz && dz.classList.contains('chip-bank')){ sel.classList.remove('sel'); sel = null; return; }
    place(sel, dz);
    sel.classList.remove('sel'); sel = null;
  }
  function place(chip, dz){
    if(dz.classList.contains('chip-bank')){ dz.appendChild(chip); refresh(dz.closest('.qbody')); return; }
    const occ = Array.from(dz.children).find(n => n.classList.contains('chip'));
    if(occ && occ !== chip){
      const bank = (chip.closest('.qbody') || document).querySelector('.chip-bank');
      if(bank) bank.appendChild(occ);
    }
    dz.appendChild(chip);
    refresh(dz.closest('.qbody'));
  }
  function refresh(qbody){
    if(!qbody) return;
    qbody.querySelectorAll('.dz').forEach(z => z.classList.toggle('filled', !!z.querySelector('.chip')));
  }
  document.addEventListener('pointerdown', down, true);
  document.addEventListener('pointermove', move, { passive:false });
  document.addEventListener('pointerup', up, true);
  document.addEventListener('click', clickHandler, true);
  return { deselect(){ if(sel){ sel.classList.remove('sel'); sel = null; } } };
})();

/* ================= order / rank list (drag to reorder + arrow buttons) ================= */
function initOrderList(list){
  let drag = null;
  list.addEventListener('pointerdown', e => {
    if(list.closest('.graded')) return;
    const item = e.target.closest('.ord-item');
    if(!item || !list.contains(item)) return;
    if(e.target.closest('button')) return;
    drag = { item, y0: e.clientY, moved: false };
    e.preventDefault();
  });
  window.addEventListener('pointermove', e => {
    if(!drag) return;
    if(!drag.moved && Math.abs(e.clientY - drag.y0) > 6){ drag.moved = true; drag.item.classList.add('dragging'); }
    if(!drag.moved) return;
    const items = $$('.ord-item').filter(i => i.parentElement === list && i !== drag.item);
    let next = null;
    for(const it of items){ const r = it.getBoundingClientRect(); if(e.clientY < r.top + r.height / 2){ next = it; break; } }
    if(next) list.insertBefore(drag.item, next); else list.appendChild(drag.item);
    e.preventDefault();
  });
  window.addEventListener('pointerup', () => { if(drag){ drag.item.classList.remove('dragging'); drag = null; } });
}

/* --- Q3 --- */
{
  id:'q3', theme:'T1', diff:'EXTREME', type:'bins', time:210,

  title:'Match requirement to framework',

    { l:'PCI-DSS — sensitive auth data', r:'Never store CVV or PIN after payment authorization' },

  explain:`<p>The policy walks the protection lifecycle in order: classify first, then protect <b>at rest</b> (stored on disk — encryption), then protect <b>in transit</b> (moving over networks — TLS), then govern <b>access</b> with least privilege ("need-to-know") and periodic review, then guarantee <b>backup and recovery</b> with a measured recovery time objective.</p>

/* --- Q10 --- */
{
  id:'q10', theme:'T4', diff:'EXTREME', type:'spot', time:150,
  title:'Spot the mistake: backup script',
  scenario:`A QSA (Qualified Security Assessor) is reviewing your nightly backup script for the cardholder database. Several lines look suspicious, but the assessment writes up only the <b>most serious</b> PCI-DSS violation — the one that leaves cardholder data readable on disk.`,
  prompt:`Click the ONE line that creates the most serious PCI-DSS finding.`,
  lines:[
    '# crontab — root — db01 (PCI cardholder environment)',
    '0 2 * * * /opt/scripts/card_backup.sh',
    'pg_dump -U backup_app -h localhost -F c billing > /backup/billing_$(date +%F).dump',
    'chmod 750 /backup && chown backup_app:backup /backup',
    'gpg --yes --symmetric --output /backup/billing_$(date +%F).dump.gpg /backup/billing_$(date +%F).dump',
    'shred -u /backup/billing_$(date +%F).dump',
    'aws s3 cp /backup/ s3://corp-backups-eu/ --recursive --sse AES256',
    '# retention: 90 days, then delete'
  ],
  answer:2,
  explain:`<p>Line 3 writes a <b>full plaintext cardholder dump</b> to disk. Even though line 5 encrypts it and line 6 shreds the plaintext, there is a real window where the whole cardholder data environment sits unencrypted on a general-purpose backup directory. PCI-DSS requires stored account data to be rendered unreadable — a "we encrypt it later" step does not satisfy that. The fix is to pipe the dump straight into encryption so plaintext never touches disk.</p>
  <p>The other lines are correct practice: restrictive permissions (750), shredding the plaintext, and uploading only the encrypted archive. The SSE-S3 upload is acceptable, though SSE-KMS with a customer-managed key would be stronger — a hardening suggestion, not the finding.</p>`,
  tip:`Focus on: PCI-DSS cares about cardholder data being readable on disk at ANY moment — even a short window is a finding.`,
  hints:[
    `PCI-DSS cares about cardholder data being readable on disk at any moment in time.`,
    `Look at what exists on disk between the dump step and the encryption step.`
  ]
},

{
  id:'q11', theme:'T5', diff:'EXTREME', type:'terminal', time:300,
  title:'Terminal: harden the export',
  scenario:`You are on a staging node that holds <span class="kbd">payment_export.csv</span> (fake card data used for testing). Before you leave today, three hardening steps must be done <b>in order</b>, using the shell. Type the real commands.`,
  prompt:`Complete all three tasks in the terminal below, then press Check Answers.`,
  tasks:[
    { label:'Record a SHA-256 integrity baseline of payment_export.csv', re:'\\bsha256sum\\b[^;|&]*payment_export', ok:'Checksum recorded — any later change to the file will be detectable.' },
    { label:'Encrypt the file symmetrically with GPG (protect it at rest)', re:'\\bgpg\\b[^;|&]*(?:-c\\b|--symmetric\\b)[^;|&]*payment_export', ok:'payment_export.csv.gpg created — the data at rest is now unreadable without the passphrase.' },
    { label:'Set permissions so ONLY the owner can read/write the encrypted file', re:'\\bchmod\\s+0?600\\b[^;|&]*payment_export', ok:'Permissions set to 600 — owner read/write, everyone else locked out.' }
  ],
  files:{ base:['notes.txt','payment_export.csv','README.md'] },
  cat:`411111******1111,Jane Roe,jane[.]roe[.]example,49.99,EU
411111******2222,Mark Poe,mark[.]poe[.]example,129.50,EU
555555******4444,Ali Nouri,ali[.]nouri[.]example,12.00,EU`,
  explain:`<p>Three classic commands. <b>sha256sum</b> prints an integrity checksum — a fingerprint of the file. If even one byte changes later, the fingerprint changes, so corruption or tampering becomes detectable (integrity). <b>gpg -c</b> (same as --symmetric) encrypts the file with a passphrase so the stored copy is unreadable (confidentiality at rest). <b>chmod 600</b> removes every permission except the owner read/write (access control).</p>
  <p>Together they cover all three protection ideas: prove it has not changed, hide it, and lock who can touch it.</p>`,
  tip:`Focus on: sha256sum = integrity baseline; gpg -c = symmetric encryption at rest; chmod 600 = owner-only access.`,
  hints:[

{
  id:'q14a', theme:'T5', diff:'EXTREME', type:'mcq', time:150, pair:'q14',
  title:'Dual perspective — BLUE view',
  scenario:`<b>Shared scenario (read for both parts):</b> FinCorp protects its data with a CASB (Cloud Access Security Broker) at the internet edge. It reads the <b>content</b> of uploads to personal cloud drives, detects payment-card patterns (16-digit numbers), and blocks any file labeled Restricted. All work happens on <b>managed laptops</b>, and the CASB performs TLS inspection, so it sees plaintext content.`,
  prompt:`<b>BLUE TEAM:</b> An insider renames <span class="kbd">customers.csv</span> to <span class="kbd">cute_cat.jpg</span> and uploads it to a personal drive. Which control still catches it?`,
  options:[
    { t:'The content-based DLP inspection engine inside the CASB', correct:true },
    { t:'A file-extension blocklist applied to every upload at the internet edge', correct:false },
    { t:'A SHA-256 hash blocklist of files that are already known to be malicious', correct:false },
    { t:'Blocking all USB storage devices on every managed company laptop', correct:false }
  ],
  explain:`<p>Content-based DLP does not care about the file name or extension — it reads what is <b>inside</b>. The 16-digit card patterns survive the rename, so the CASB still matches and blocks.</p>
  <p>The decoys fail for clear reasons: the extension blocklist is defeated by exactly this rename; a hash blocklist fails because changing even one byte (or one space) produces a completely different hash; USB control is irrelevant because the upload went over the network. When you design detection, always ask: "what does this control actually look at?"</p>`,
  tip:`Focus on: content inspection beats format tricks. Signatures (hashes) die the moment the file changes by even one byte.`,
  hints:[
    `The CASB reads file content, not file names.`,
    `Changing the extension does not change the credit-card digits inside the file.`
  ]
},

/* --- Q16 --- */
{
  id:'q16', theme:'T5', diff:'CHALLENGING', type:'mcq', time:120,
  title:'The three states of data',
  scenario:`A payment file is (1) stored encrypted on disk, (2) moved over TLS to an analytics service, and (3) finally processed in plaintext inside a confidential-computing enclave (a protected CPU area). A colleague claims "we are safe — everything is encrypted everywhere."`,
  prompt:`Which statement about the three data states is TRUE?`,
  options:[
    { t:'While the CPU processes the rows the data is "in use" — the hardest state; confidential computing (TEE) targets it.', correct:true },
    { t:'Full-disk encryption also keeps protecting the data even while the CPU is actively loading and processing it in memory.', correct:false },
    { t:'TLS protects the data end to end on the wire, including while it sits stored inside the analytics database.', correct:false },
    { t:'Data "in use" means any file that an employee has currently opened from a USB stick or a network drive.', correct:false }
  ],
  explain:`<p>Data lives in three states. <b>At rest</b>: on disk or in a database — protected by full-disk or database encryption. <b>In transit</b>: moving over a network — protected by TLS. <b>In use</b>: loaded in memory while the CPU works on it — it must be plaintext for the CPU, and this is the hardest state.</p>
  <p>Full-disk encryption only helps when the disk is idle; the moment the file is opened, the OS decrypts it for the CPU. TLS has finished its job once data arrives. Confidential computing (a trusted execution environment) is the emerging answer for the in-use state: the CPU processes data inside a hardware-protected enclave that even the host admin cannot read.</p>`,
  tip:`Focus on: match the control to the state — disk encryption = at rest, TLS = in transit, enclave/TEE = in use.`,
  hints:[
    `Match each state to where the data is: on disk, on the network, or inside the CPU and memory.`,
    `Full-disk encryption only helps while the machine is off or the disk is idle — not while data sits in memory being processed.`
  ]
},

{
  id:'q17', theme:'T3', diff:'CHALLENGING', type:'multi', time:150,
  title:'Least privilege under pressure',
  scenario:`A contractor needs read-only access to ONE reporting folder for a two-week engagement. The project manager pushes you in chat: "Just give them domain admin for the folder, we can clean up later, the deadline is Friday."`,
  prompt:`Select ALL actions that follow least privilege and need-to-know.`,
  options:[
    { t:'Grant read-only ACL on that specific folder, with an expiry date', correct:true },
    { t:'Add the contractor to the All-Staff group so the folder inherits access', correct:false },
    { t:'Grant domain admin "to avoid permission issues"', correct:false },
    { t:'Grant modify rights so they can fix things if needed', correct:false },
    { t:'Log and monitor access to the folder during the engagement', correct:true },
    { t:'Revoke access automatically at the end date and confirm removal', correct:true }
  ],
  explain:`<p>Least privilege = <b>smallest rights, shortest time, watched closely</b>. The three correct actions say exactly that: read-only (not modify), one folder (not inherited groups), an expiry date plus automatic revocation with confirmation (shortest time), and monitoring (because contractor access is a high-risk window).</p>
  <p>The wrong answers are the standard failure patterns: All-Staff inheritance gives need-to-know away to everyone; domain admin is the opposite of least privilege and survives "cleanup later" far too often; modify rights exceed the stated need — "fix things if needed" is how contractors end up owning production data.</p>`,
  tip:`Focus on: least privilege = minimum permission + expiry + monitoring + verified revocation. "Later" never comes.`,
  hints:[
    `Least privilege = the smallest rights, for the shortest time, and watch the access.`,
    `"Domain admin to avoid issues" is the exact opposite of least privilege.`
  ]
},

{

/* ================= normalization ================= */
(function normalize(){
  BANK.forEach(q => {
    q.points = q.diff === 'EXTREME' ? 120 : 100;
    if(q.type === 'mcq' || q.type === 'logq'){
      q.options = q.options.map((o,i) => ({ key:'o'+i, t:o.t, correct:!!o.correct }));
    }
    if(q.type === 'multi'){
      q.options = q.options.map((o,i) => ({ key:'o'+i, t:o.t, correct:!!o.correct }));
    }
    if(q.type === 'triage'){
      q.options = q.options.map((t,i) => ({ key:'o'+i, t:t }));
      q.alerts = q.alerts.map((t,i) => ({ key:'a'+i, t:t }));
    }
    if(q.type === 'order' || q.type === 'rank'){
      q.solution = q.items.map((_,i) => 'k'+i);
    }
    if(q.type === 'match'){
      q.rights = q.pairs.map((p,i) => ({ key:'r'+i, t:p.r }));
    }
    if(q.type === 'terminal'){
      q.tasks = q.tasks.map(t => ({ label:t.label, re:new RegExp(t.re,'i'), ok:t.ok }));
    }
  });
})();
const BANKBY = {};
BANK.forEach(q => BANKBY[q.id] = q);

/* ================= renderers & graders ================= */
function scenarioHtml(q){ return q.scenario ? '<div class="scenario">' + q.scenario + '</div>' : ''; }
function setCheckEnabled(b){ const c = $('#checkBtn'); if(c) c.disabled = !b; }

/* --- mcq (also used by logq) --- */
function renderMcq(q, box){
  box.innerHTML = scenarioHtml(q) + '<div class="prompt">' + q.prompt + '</div><div class="opts"></div>';
  const wrap = box.querySelector('.opts');
  shuffle(q.options).forEach(o => {
    wrap.appendChild(el('label','opt','<input type="radio" name="'+q.id+'" value="'+o.key+'"><span>'+o.t+'</span>'));
  });
}
function gradeMcq(q, box){
  const sel = box.querySelector('input[type=radio]:checked');
  const chosen = sel ? q.options.find(o => o.key === sel.value) : null;
  const ok = !!(chosen && chosen.correct);
  box.querySelectorAll('.opt').forEach(l => {
    const o = q.options.find(x => x.key === l.querySelector('input').value);
    if(o.correct) l.classList.add('correct');
    else if(sel && l.querySelector('input').checked) l.classList.add('wrong');
  });
  return { frac: ok ? 1 : 0, your: chosen ? chosen.t : 'No answer selected', right: q.options.find(o => o.correct).t };
}

/* --- multi-select --- */
function renderMulti(q, box){
  box.innerHTML = scenarioHtml(q) + '<div class="prompt">' + q.prompt + '</div><div class="opts"></div>';
  const wrap = box.querySelector('.opts');
  shuffle(q.options).forEach(o => {
    wrap.appendChild(el('label','opt','<input type="checkbox" name="'+q.id+'" value="'+o.key+'"><span>'+o.t+'</span>'));
  });
}
function gradeMulti(q, box){
  const checks = Array.from(box.querySelectorAll('input:checked'));
  let hits = 0;
  checks.forEach(c => { if(q.options.find(o => o.key === c.value).correct) hits++; });
  const totalCorrect = q.options.filter(o => o.correct).length;
  const misses = checks.length - hits;
  const frac = Math.max(0, (hits - misses) / totalCorrect);
  box.querySelectorAll('.opt').forEach(l => {
    const o = q.options.find(x => x.key === l.querySelector('input').value);
    if(o.correct) l.classList.add('correct');
    else if(l.querySelector('input').checked) l.classList.add('wrong');
  });
  const your = checks.length ? checks.map(c => q.options.find(o => o.key === c.value).t).join('<br>') : 'No answer selected';
  const right = q.options.filter(o => o.correct).map(o => o.t).join('<br>');
  return { frac, your, right };
}

/* --- bins (drag chips into category bins) --- */
function renderBins(q, box){
  box.innerHTML = scenarioHtml(q) + '<div class="prompt">' + q.prompt + '</div>' +
    '<div class="chip-bank dz" style="margin-top:10px"></div>' +
    '<div class="helper">Drag chips into a bin — or tap a chip, then tap a bin. Tap a placed chip, then the bank, to take it back.</div>' +
    '<div class="binrow"></div>';
  const bank = box.querySelector('.chip-bank');
  shuffle(q.items.map((it,i) => ({ it:it, i:i }))).forEach(o => {
    const c = el('span','chip', esc(o.it.t));
    c.dataset.key = 'i'+o.i; c.dataset.bin = o.it.bin;
    bank.appendChild(c);
  });
  const row = box.querySelector('.binrow');
  q.bins.forEach(b => {
    const col = el('div','bin','<div class="binh">'+b.label+'</div>');
    const dz = el('div','dz'); dz.dataset.bin = b.id;
    col.appendChild(dz); row.appendChild(col);
  });
}
function gradeBins(q, box){
  let ok = 0; const yA = [], rA = [];
  const binLabel = id => { const b = q.bins.find(x => x.id === id); return b ? esc(b.label) : 'not placed'; };
  q.items.forEach((it,i) => {
    const chip = box.querySelector('.chip[data-key="i'+i+'"]');
    const dz = chip ? chip.closest('.dz') : null;
    const parentBin = (dz && dz.dataset.bin) ? dz.dataset.bin : null;
    const good = parentBin === it.bin;
    chip.classList.add(good ? 'hit' : 'miss');
    if(good) ok++;
    yA.push(esc(it.t) + ' → ' + (parentBin ? binLabel(parentBin) : 'not placed'));
    rA.push(esc(it.t) + ' → ' + binLabel(it.bin));
  });
  return { frac: ok / q.items.length, your: yA.join('<br>'), right: rA.join('<br>') };
}

/* --- matching --- */

  box.innerHTML = scenarioHtml(q) + '<div class="prompt">' + q.prompt + '</div>' +

    '<div class="helper">Drag a card from the bank onto the row it belongs to — or tap the card, then the row.</div>' +

    const c = el('span','chip', esc(r.t)); c.dataset.key = r.key;

function gradeMatch(q, box){
  let ok = 0; const yA = [], rA = [];
  q.pairs.forEach((p,i) => {
    const slot = box.querySelector('.mslot[data-slot="'+i+'"]');
    const chip = slot ? slot.querySelector('.chip') : null;
    const good = chip && chip.dataset.key === 'r'+i;
    if(chip) chip.classList.add(good ? 'hit' : 'miss');
    if(good) ok++;
    const rt = q.rights.find(x => x.key === 'r'+i);
    yA.push(esc(p.l) + ' → ' + (chip ? esc(chip.textContent) : 'no answer'));
    rA.push(esc(p.l) + ' → ' + esc(rt.t));
  });
  return { frac: ok / q.pairs.length, your: yA.join('<br>'), right: rA.join('<br>') };

/* --- ordering / ranking (same mechanics) --- */
function updateOrdPositions(list){
  Array.from(list.children).forEach((row,i) => { const p = row.querySelector('.pos'); if(p) p.textContent = (i+1); });
}
function renderOrder(q, box){
  const hint = q.type === 'rank' ? 'Highest priority on TOP.' : 'First lifecycle stage on TOP.';
  box.innerHTML = scenarioHtml(q) + '<div class="prompt">' + q.prompt + '</div>' +
    '<div class="ordlist"></div><div class="helper">Drag rows to reorder (or use the arrow buttons). ' + hint + '</div>';
  const list = box.querySelector('.ordlist');
  shuffle(q.items.map((t,i) => ({ t:t, i:i }))).forEach(o => {
    const row = el('div','ord-item','<span class="pos"></span><span class="grip">⠿</span><span class="otxt">'+esc(o.t)+'</span><span class="arrows"><button type="button" data-mv="-1">▲</button><button type="button" data-mv="1">▼</button></span>');
    row.dataset.key = 'k'+o.i;
    list.appendChild(row);
  });
  initOrderList(list);
  list.addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b || list.closest('.graded')) return;
    const row = b.closest('.ord-item');
    if(b.dataset.mv === '-1' && row.previousElementSibling) list.insertBefore(row, row.previousElementSibling);
    if(b.dataset.mv === '1' && row.nextElementSibling) list.insertBefore(row.nextElementSibling, row);
    updateOrdPositions(list);
  });
  list.addEventListener('pointerup', () => updateOrdPositions(list));
  updateOrdPositions(list);
}
function gradeOrder(q, box){
  const rows = Array.from(box.querySelectorAll('.ord-item'));
  let ok = 0; const yA = [], rA = [];
  rows.forEach((row,pos) => {
    const key = row.dataset.key, want = q.solution[pos];
    const good = key === want;
    row.classList.remove('pos-ok','pos-ko'); row.classList.add(good ? 'pos-ok' : 'pos-ko');
    if(good) ok++;
    yA.push((pos+1) + '. ' + esc(q.items[parseInt(key.slice(1),10)]));
    rA.push((pos+1) + '. ' + esc(q.items[parseInt(want.slice(1),10)]));
  });
  return { frac: ok / rows.length, your: yA.join('<br>'), right: rA.join('<br>') };
}

    const opts = shuffle(q.choices[n].opts.map((t,i) => ({ t:t, i:i })));
    sel.innerHTML = '<option value="">— choose —</option>' + opts.map(o => '<option value="'+o.i+'">'+esc(o.t)+'</option>').join('');
    sel.style.cssText = 'background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:13.5px;outline:none';
  });
}
function gradeDropdown(q, box){
  let ok = 0; const yA = [], rA = [];
  q.choices.forEach((ch,i) => {
    const sel = box.querySelector('select[data-d="'+i+'"]');
    const v = sel.value;
    const good = v !== '' && +v === ch.c;
    sel.style.borderColor = good ? 'var(--green)' : (v === '' ? 'var(--line2)' : 'var(--red)');
    if(!good) sel.title = ch.opts[ch.c];
    if(good) ok++;
    yA.push('Gap '+(i+1)+': ' + (v === '' ? 'no choice' : esc(ch.opts[+v])));
    rA.push('Gap '+(i+1)+': ' + esc(ch.opts[ch.c]));
  });
  return { frac: ok / q.choices.length, your: yA.join('<br>'), right: rA.join('<br>') };
}

/* --- spot the mistake (click a line) --- */
function renderSpot(q, box){
  box.innerHTML = scenarioHtml(q) + '<div class="prompt">' + q.prompt + '</div><div class="spot-wrap"></div>';
  const w = box.querySelector('.spot-wrap');
  q.lines.forEach((l,i) => {
    const d = el('div','spotline','<span class="ln">'+(i+1)+'</span><span>'+esc(l)+'</span>');
    d.dataset.i = i;
    d.addEventListener('click', () => {
      if(d.closest('.qbody').classList.contains('graded')) return;
      w.querySelectorAll('.spotline').forEach(x => x.classList.remove('sel'));
      d.classList.add('sel');
    });
    w.appendChild(d);
  });
}
function gradeSpot(q, box){
  const sel = box.querySelector('.spotline.sel');
  const pick = sel ? +sel.dataset.i : -1;
  const ok = pick === q.answer;
  box.querySelectorAll('.spotline')[q.answer].classList.add('hit');
  if(sel && !ok) sel.classList.add('miss');
  const y = pick >= 0 ? ('Line '+(pick+1)+': '+esc(q.lines[pick])) : 'No line selected';
  const r = 'Line '+(q.answer+1)+': '+esc(q.lines[q.answer]);
  return { frac: ok ? 1 : 0, your: y, right: r };
}

/* --- terminal emulator --- */
function renderTerminal(q, box){
  box.innerHTML = scenarioHtml(q) + '<div class="prompt">' + q.prompt + '</div>' +
    '<ul class="tasklist">' + q.tasks.map((t,i) => '<li data-t="'+i+'"><span class="st">[ ]</span><span>'+t.label+'</span></li>').join('') + '</ul>' +
    '<div class="term"><div class="term-title"><span>ops_analyst@stg-node-01 — authorized access only</span><span>bash</span></div>' +
    '<div class="term-out"><div>Welcome to stg-node-01. Type "help" for available commands.</div></div>' +
    '<div class="term-line"><span class="ps1">ops_analyst@stg-node-01:~$</span><input type="text" spellcheck="false" autocomplete="off" placeholder="type a command and press Enter"></div></div>';
  const out = box.querySelector('.term-out');
  const input = box.querySelector('.term-line input');
  const st = { enc:false, perm:'644' };
  const print = (t, cls) => { const d = el('div', cls || '', t); out.appendChild(d); out.scrollTop = out.scrollHeight; };
  const solve = i => {
    const li = box.querySelector('.tasklist li[data-t="'+i+'"]');
    if(li.classList.contains('done')) return;
    li.classList.add('done'); li.querySelector('.st').textContent = '[x]';
    print('&gt;&gt; TASK '+(i+1)+' COMPLETE: '+q.tasks[i].ok, 'okline');
  };
  input.addEventListener('keydown', e => {
    if(e.key !== 'Enter') return;
    const cmd = input.value.trim(); input.value = '';
    if(!cmd) return;
    print('<span class="cmd">$ '+esc(cmd)+'</span>');
    const lc = cmd.toLowerCase();
    if(lc === 'help'){ print('Available: ls, ls -l, cat <file>, sha256sum <file>, gpg -c <file>, chmod 600 <file>, whoami, clear, help'); }
    else if(lc === 'clear'){ out.innerHTML = ''; }
    else if(lc === 'whoami'){ print('ops_analyst'); }
    else if(lc === 'ls'){ print(q.files.base.join('  ') + (st.enc ? '  payment_export.csv.gpg' : '')); }
    else if(lc === 'ls -l' || lc === 'ls -la'){
      const names = q.files.base.slice();
      if(st.enc) names.push('payment_export.csv.gpg');
      names.forEach(f => print((st.perm === '600' && f === st.permFile ? '-rw-------' : '-rw-r--r--') + ' 1 ops_analyst ops  20480 Oct 07 02:31 ' + f));
    }
    else if(/\bsha256sum\b[^;|&]*payment_export/i.test(cmd)){ print('3f7a1c9e52b8d4f6a0c3e7b1d9f4a2c6e8b0d3f5a7c9e1b3d5f7a9c1e3b5d7f9  payment_export.csv'); solve(0); }
    else if(/\bgpg\b[^;|&]*(-c\b|--symmetric\b)[^;|&]*payment_export/i.test(cmd)){ st.enc = true; print('gpg: symmetric encryption with AES256'); print('File created: payment_export.csv.gpg'); solve(1); }
    else if(/\bchmod\s+0?600\b[^;|&]*payment_export/i.test(cmd)){ st.perm = '600'; st.permFile = /gpg/i.test(cmd) ? 'payment_export.csv.gpg' : 'payment_export.csv'; print('permissions updated: -rw-------'); solve(2); }
    else if(/^cat\s+/i.test(cmd)){
      const f = cmd.replace(/^cat\s+/i,'').trim();
      if(f.indexOf('payment_export.csv.gpg') === 0) print('&lt;binary&gt; encrypted content — use your passphrase to decrypt');
      else if(f.indexOf('payment_export.csv') === 0) print(esc(q.cat));
      else print('cat: ' + esc(f) + ': No such file or directory', 'err');
    }
    else { print('bash: ' + esc(cmd.split(' ')[0]) + ': command not found (try "help")', 'err'); }
  });
}
function gradeTerminal(q, box){
  let ok = 0; const yA = [];
  const cmds = ['sha256sum payment_export.csv','gpg -c payment_export.csv','chmod 600 payment_export.csv.gpg'];
  q.tasks.forEach((t,i) => {
    const li = box.querySelector('.tasklist li[data-t="'+i+'"]');
    const done = li.classList.contains('done');
    if(done) ok++;
    yA.push((done ? 'Done — ' : 'Not done — ') + t.label);
  });
  const rA = q.tasks.map((t,i) => 'Task '+(i+1)+': <span class="kbd">'+cmds[i]+'</span>');
  return { frac: ok / q.tasks.length, your: yA.join('<br>'), right: rA.join('<br>') };
}

/* --- log viewer with filter --- */
function hlLog(s){
  let x = s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  x = x.replace(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})/, '<span class="t-time">$1</span>');
  x = x.replace(/(user=\S+)/, '<span class="t-user">$1</span>');
  x = x.replace(/hxxps?:\/\/\S+/g, m => '<span class="' + (m.indexOf('evil') > -1 ? 't-bad' : 't-warn') + '">' + m + '</span>');
  x = x.replace(/(^|[\s=])(evil\[.\]example\S*)/g, (m, p1, p2) => p1 + '<span class="t-bad">' + p2 + '</span>');
  x = x.replace(/(bytes_out=\d+)/g, m => parseInt(m.split('=')[1],10) > 1000000 ? '<span class="t-bad">'+m+'</span>' : '<span class="t-dim">'+m+'</span>');
  x = x.replace(/(action=allow)/g, '<span class="t-dim">$1</span>');
  return x;
}
function renderLogq(q, box){
  box.innerHTML = scenarioHtml(q) + '<div class="prompt">' + q.prompt + '</div>' +
    '<div class="logview"><div class="logbar"><input type="text" placeholder="filter (plain text, case-insensitive) — try: evil"><span class="logcount"></span></div><div class="loglines"></div></div>' +
    '<div class="opts"></div>';
  const lc = box.querySelector('.loglines');
  const items = q.logs.map((raw,i) => {
    const d = el('div','logline','<span class="num">'+(i+1)+'</span>' + hlLog(raw));
    d.dataset.raw = raw.toLowerCase();
    lc.appendChild(d);
    return d;
  });
  const inp = box.querySelector('.logbar input');
  const cnt = box.querySelector('.logcount');
  const apply = () => {
    const f = inp.value.trim().toLowerCase();
    let shown = 0;
    items.forEach(d => { const m = !f || d.dataset.raw.indexOf(f) > -1; d.style.display = m ? '' : 'none'; if(m) shown++; });
    cnt.textContent = shown + ' / ' + items.length + ' lines';
  };
  inp.addEventListener('input', apply);
  apply();
  const wrap = box.querySelector('.opts');
  shuffle(q.options).forEach(o => {
    wrap.appendChild(el('label','opt','<input type="radio" name="'+q.id+'" value="'+o.key+'"><span>'+o.t+'</span>'));
  });
}

/* --- SOC triage queue --- */
function renderTriage(q, box){
  box.innerHTML = scenarioHtml(q) + '<div class="prompt">' + q.prompt + '</div><div class="triagewrap"></div>';
  const wrap = box.querySelector('.triagewrap');
  const opts = shuffle(q.options);
  q.alerts.forEach((a,i) => {
    const card = el('div','card','<div style="font-family:var(--mono);font-size:12.5px;color:var(--cyan);margin-bottom:4px">'+a.t+'</div>');
    card.style.margin = '10px 0'; card.style.padding = '14px 16px';
    opts.forEach(o => {
      card.appendChild(el('label','opt','<input type="radio" name="'+q.id+'_'+i+'" value="'+o.key+'"><span>'+o.t+'</span>'));
    });
    wrap.appendChild(card);
  });
}
function gradeTriage(q, box){
  let ok = 0; const yA = [], rA = [];
  q.alerts.forEach((a,i) => {
    const sel = box.querySelector('input[name="'+q.id+'_'+i+'"]:checked');
    const key = sel ? sel.value : null;
    const good = key === ('o'+q.correctArr[i]);
    box.querySelectorAll('input[name="'+q.id+'_'+i+'"]').forEach(inp => {
      const lab = inp.closest('.opt');
      if(inp.value === ('o'+q.correctArr[i])) lab.classList.add('correct');
      else if(inp.checked) lab.classList.add('wrong');
    });
    if(good) ok++;
    yA.push('<b>'+a.t+'</b> → ' + (key ? q.options.find(o => o.key === key).t : 'no response'));
    rA.push('<b>'+a.t+'</b> → ' + q.options[q.correctArr[i]].t);
  });
  return { frac: ok / q.alerts.length, your: yA.join('<br>'), right: rA.join('<br>') };
}

/* --- branching scenario --- */
function renderBranch(q, box){
  box.innerHTML = scenarioHtml(q) + '<div class="prompt">' + q.prompt + '</div><div class="steps"></div>';
  const steps = box.querySelector('.steps');
  q.steps.forEach((st,i) => {
    const d = el('div','branch-step');
    if(i > 0) d.style.display = 'none';
    d.innerHTML = '<div class="scenario">'+st.intro+'</div><div class="prompt">'+st.prompt+'</div><div class="bopts"></div><div class="outcome" style="display:none"></div>';
    const bo = d.querySelector('.bopts');
    shuffle(st.options.map((o,oi) => oi)).forEach((oi,pos) => {
      const o = st.options[oi];
      const b = el('button','opt bopt','<span class="k">'+letters(pos)+'</span><span>'+o.t+'</span>');
      b.type = 'button'; b.dataset.oi = String(oi);
      b.addEventListener('click', () => {
        if(d.dataset.done !== undefined) return;
        d.dataset.done = String(oi);
        bo.querySelectorAll('.bopt').forEach(x => x.classList.remove('sel'));
        b.classList.add('sel');
        const oc = d.querySelector('.outcome');
        oc.style.display = ''; oc.innerHTML = '<b>What happens next:</b> ' + o.outcome;
        const nx = steps.children[i+1];
        if(nx){ nx.style.display = ''; nx.scrollIntoView({ behavior:'smooth', block:'nearest' }); }
        else setCheckEnabled(true);
      });
      bo.appendChild(b);
    });
    steps.appendChild(d);
  });
  setCheckEnabled(false);
}
function gradeBranch(q, box){
  let ok = 0; const yA = [], rA = [];
  q.steps.forEach((st,i) => {
    const d = box.querySelectorAll('.branch-step')[i];
    const pick = d.dataset.done !== undefined ? +d.dataset.done : -1;
    const chosen = pick >= 0 ? st.options[pick] : null;
    const good = !!(chosen && chosen.correct);
    d.querySelectorAll('.bopt').forEach(b => {
      const oi = +b.dataset.oi;
      if(st.options[oi].correct) b.classList.add('correct');
      else if(oi === pick) b.classList.add('wrong');
    });
    if(good) ok++;
    yA.push('Step '+(i+1)+': ' + (chosen ? esc(chosen.t) : 'no choice'));
    rA.push('Step '+(i+1)+': ' + esc(st.options.find(o => o.correct).t));
  });
  return { frac: ok / q.steps.length, your: yA.join('<br>'), right: rA.join('<br>') };
}

const RENDER = { mcq:renderMcq, multi:renderMulti, bins:renderBins, match:renderMatch, order:renderOrder, rank:renderOrder, fill:renderFill, dropdown:renderDropdown, spot:renderSpot, terminal:renderTerminal, logq:renderLogq, triage:renderTriage, branch:renderBranch };
const GRADE  = { mcq:gradeMcq,  multi:gradeMulti,  bins:gradeBins,  match:gradeMatch,  order:gradeOrder,  rank:gradeOrder,  fill:gradeFill,  dropdown:gradeDropdown,  spot:gradeSpot,  terminal:gradeTerminal,  logq:gradeMcq,   triage:gradeTriage,   branch:gradeBranch };

</script>

<script>
'use strict';
/* ================= state & flow ================= */
let exam = null;
function newExam(){
  const total = BANK.reduce((s,q) => s + q.time, 0);
  const order = shuffle(BANK.map(q => q.id));
  /* Paired exercises must stay adjacent and in narrative order (blue view before red view). */
  const groups = {};
  BANK.forEach(q => { if(q.pair){ (groups[q.pair] = groups[q.pair] || []).push(q.id); } });
  Object.values(groups).forEach(ids => {
    for(let k = 1; k < ids.length; k++){
      const anchor = order.indexOf(ids[k-1]), me = order.indexOf(ids[k]);
      if(anchor > -1 && me > -1 && me !== anchor + 1){
        order.splice(me, 1);
        order.splice(order.indexOf(ids[k-1]) + 1, 0, ids[k]);
      }
    }
  });
  return { order: order, idx: 0, results: {}, hintsUsed: {}, paused: false, remaining: total, total: total, timerId: null };
}

function showIntro(){
  if(exam && exam.timerId) clearInterval(exam.timerId);
  document.body.classList.remove('exam-live');
  $('#hud').style.display = 'none';
  $('#pauseOverlay').style.display = 'none';
  const totalSec = BANK.reduce((s,q) => s + q.time, 0);
  const types = ['SOC alert triage','branching incidents','drag & drop classification','timeline ordering','matching','fill-in-the-blank word bank','terminal emulator','log viewer + SIEM filter','risk ranking','spot the mistake','policy drafting','MCQ + multi-select','dual blue/red perspective'];
  let html = '<div class="hero"><div class="tagline">Scenario-based certification exam</div><h1>CDPP-101 — Certified Data Protection Practitioner</h1>' +
    '<p class="sub">A realistic exam built entirely on the source material: data protection, the CIA triad, access controls, backup and recovery, GDPR, PCI-DSS, data classification, monitoring, encryption, and the data lifecycle (at rest, in transit, in use). Every exercise mirrors real on-the-job work — SOC triage, incident response, compliance review, and hardening.</p></div>';
  html += '<div class="statrow"><div class="stat"><b>'+BANK.length+'</b><span>exercises</span></div><div class="stat"><b>'+Object.keys(THEMES).length+'</b><span>themes</span></div><div class="stat"><b>'+fmtT(totalSec)+'</b><span>time budget (auto)</span></div><div class="stat"><b>80%</b><span>passing score</span></div><div class="stat"><b>−10%</b><span>score per hint</span></div></div>';
  html += '<h3 class="sect">Keywords covered</h3><div class="kwgrid">';
  Object.keys(KEYWORDS).forEach(t => { html += '<div class="kwcard"><h4>'+THEMES[t].name+'</h4>' + KEYWORDS[t].map(k => '<span class="kwtag">'+k+'</span>').join('') + '</div>'; });
  html += '</div><p class="dim" style="margin:-4px 0 16px;font-size:12.5px">Every keyword above is exercised at least once — most of them several times.</p>';
  html += '<div class="card"><h3 class="sect" style="margin-top:0">How this exam works</h3><ul class="rules">' +
    '<li>Every exercise is <b>challenging to extreme</b>: near-miss answers, subtle distractors, and multi-step reasoning. There are no gift questions.</li>' +
    '<li>Score is live and uses <b>partial credit</b> on multi-part exercises. Each hint costs 10% of that exercise value (max 2 hints each) — a hint is a nudge, never the answer.</li>' +
    '<li>The timer runs across the whole exam and is calculated from the number and difficulty of exercises. <b>Pause</b> stops the clock — but it blurs, hides, and locks the current exercise, so you cannot read or interact with it while paused.</li>' +
    '<li>If the timer reaches zero, the exam auto-submits and anything unanswered scores zero.</li>' +
    '<li>After every answer you lock it in and get a full explanation in plain English. Wrong or partial answers get a focused tip on exactly what to review.</li>' +
    '<li>Final screen: pass at <b>80%</b> for a printable-style certificate, or retake — questions and all answer choices are reshuffled every attempt.</li>' +
    '<li>All malicious indicators are defanged (<span class="kbd">hxxp://</span>, <span class="kbd">10[.]0[.]0[.]1</span>) as a professional habit.</li></ul></div>';
  html += '<h3 class="sect">Exercise formats</h3><div class="card"><div class="typechips">' + types.map(t => '<span class="kwtag">'+t+'</span>').join('') + '</div></div>';
  html += '<div style="text-align:center;margin:30px 0"><button class="btn btn-big" id="startBtn">Start Exam</button><p class="dim" style="margin-top:12px;font-size:12.5px">The timer starts immediately. Good luck, analyst.</p></div>';
  $('#screen').innerHTML = html;
  $('#startBtn').addEventListener('click', startExam);
  window.scrollTo({ top:0 });
}

function startExam(){
  if(exam && exam.timerId) clearInterval(exam.timerId);
  exam = newExam();
  document.body.classList.add('exam-live');
  $('#hud').style.display = 'block';
  $('#pauseOverlay').style.display = 'none';
  $('#pauseBtn').textContent = 'Pause';
  $('#screen').innerHTML = '<div class="card qcard" id="qcard"><div class="rep-head" id="qmeta"></div><div class="qbody" id="qbox"></div><div id="fbArea"></div><div class="navrow" id="navRow"></div></div>';
  buildThemeStrip();
  showQuestion(0);
  startTimer();
  window.scrollTo({ top:0 });
}

function showQuestion(i){
  exam.idx = i;
  const q = BANKBY[exam.order[i]];
  const card = $('#qcard');
  card.classList.remove('shake');
  $('#qmeta').innerHTML = '<span class="badge theme">'+THEMES[q.theme].name+'</span><span class="badge '+q.diff.toLowerCase()+'">'+q.diff+'</span>' +
    '<span class="rq" style="margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)">Question '+(i+1)+' / '+BANK.length+' · '+q.points+' pts · about '+fmtT(q.time)+'</span>';
  const box = $('#qbox');
  box.classList.remove('graded');
  box.innerHTML = '';
  const nav = $('#navRow');
  nav.innerHTML = '';
  const hb = el('button','btn-warn btn','Hint (−10%)'); hb.type = 'button';
  if((exam.hintsUsed[q.id]||0) >= (q.hints ? q.hints.length : 0)) hb.disabled = true;
  hb.addEventListener('click', () => useHint(q, hb));
  const cb = el('button','btn','Check Answers'); cb.type = 'button'; cb.id = 'checkBtn';
  cb.addEventListener('click', () => onCheck(q));
  nav.appendChild(hb); nav.appendChild(cb);
  (RENDER[q.type])(q, box);
  $('#fbArea').innerHTML = '';
  Drag.deselect();
  updateHUD();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function useHint(q, btn){
  if(!exam) return;
  const n = exam.hintsUsed[q.id] || 0;
  if(n >= q.hints.length){ btn.disabled = true; return; }
  exam.hintsUsed[q.id] = n + 1;
  $('#fbArea').appendChild(el('div','hintbox','<b>Hint '+(n+1)+' — costs 10% of this exercise:</b> ' + q.hints[n]));
  if(n + 1 >= q.hints.length) btn.disabled = true;
}

function onCheck(q){
  const box = $('#qbox');
  if(box.classList.contains('graded')) return;
  const res = (GRADE[q.type])(q, box);
  const hints = exam.hintsUsed[q.id] || 0;
  const mult = Math.max(0, 1 - 0.1 * hints);
  res.points = q.points; res.hints = hints;
  res.earned = Math.round(res.frac * q.points * mult);
  exam.results[q.id] = res;
  box.classList.add('graded');
  box.querySelectorAll('input,select,button,textarea').forEach(n => n.setAttribute('disabled',''));
  Drag.deselect();
  showFeedback(q, res);
  if(res.frac < 0.5){ $('#qcard').classList.add('shake'); }
  updateHUD();
  const nav = $('#navRow');
  nav.innerHTML = '';
  const last = exam.idx === exam.order.length - 1;
  const nb = el('button','btn', last ? 'Finish Exam' : 'Next Question'); nb.type = 'button';
  nb.addEventListener('click', () => { if(last) finish(false); else showQuestion(exam.idx + 1); });
  nav.appendChild(nb);
  nav.appendChild(el('span','dim','Answer locked — score updated.'));
}

function showFeedback(q, res){
  const full = res.frac >= 1, zero = res.frac <= 0;
  const cls = full ? 'good' : (zero ? 'bad' : 'part');
  const v = full ? 'Correct — full credit' : (zero ? 'Incorrect' : 'Partial credit');
  const d = el('div','explain ' + cls);
  d.innerHTML = '<h4><span class="'+(full?'vr-good':(zero?'vr-bad':'vr-part'))+'">'+v+'</span> — '+res.earned+' / '+res.points+' pts' +
    (res.hints ? ' <span class="dim">(includes −'+(10*res.hints)+'% hint penalty)</span>' : '') + '</h4>' +
    '<div class="yr"><div class="row"><b class="lab">YOUR ANSWER</b>'+res.your+'</div>' +
    '<div class="row"><b class="lab">CORRECT ANSWER</b>'+res.right+'</div></div>' +
    '<b>Why:</b>' + q.explain +
    (res.frac < 1 ? '<div class="tipbox"><b>Focus on:</b> ' + q.tip.replace(/^Focus on: /,'') + '</div>' : '');
  $('#fbArea').appendChild(d);
}

/* ================= HUD & timer ================= */
function updateHUD(){
  const done = Object.keys(exam.results).length;
  $('#qcount').textContent = 'Q ' + Math.min(exam.idx + 1, BANK.length) + '/' + BANK.length;
  $('#pbarFill').style.width = (done / BANK.length * 100) + '%';
  let earned = 0, poss = 0;
  BANK.forEach(q => { poss += q.points; if(exam.results[q.id]) earned += exam.results[q.id].earned; });
  const sb = $('#scoreBox');
  sb.textContent = earned + ' / ' + poss + ' pts · ' + Math.round(earned / poss * 100) + '%';
  sb.classList.add('bump'); setTimeout(() => sb.classList.remove('bump'), 260);
  buildThemeStrip();
}
function buildThemeStrip(){
  const strip = $('#themeStrip');
  strip.innerHTML = '';
  Object.keys(THEMES).forEach(t => {
    const qs = BANK.filter(q => q.theme === t);
    const done = qs.filter(q => exam.results[q.id]).length;
    strip.appendChild(el('span','theme-chip', THEMES[t].short + ' <b>' + done + '/' + qs.length + '</b>'));
  });
}
function startTimer(){
  renderTimer();
  exam.timerId = setInterval(() => {
    if(exam.paused) return;
    exam.remaining--;
    if(exam.remaining <= 0){ exam.remaining = 0; renderTimer(); finish(true); return; }
    renderTimer();
  }, 1000);
}
function renderTimer(){
  const t = $('#timerVal');
  t.textContent = fmtT(exam.remaining);
  t.classList.toggle('warn', exam.remaining <= exam.total * 0.2 && exam.remaining > exam.total * 0.1);
  t.classList.toggle('danger', exam.remaining <= exam.total * 0.1);
}
function togglePause(force){
  if(!exam) return;
  exam.paused = force !== undefined ? force : !exam.paused;
  $('#pauseOverlay').style.display = exam.paused ? 'flex' : 'none';
  const qc = $('#qcard');
  qc.classList.toggle('paused-blur', exam.paused);
  if(exam.paused){
    qc.setAttribute('inert','');
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  } else {
    qc.removeAttribute('inert');
  }
  $('#pauseBtn').textContent = exam.paused ? 'Resume' : 'Pause';
}
function finish(auto){
  if(exam.timerId) clearInterval(exam.timerId);
  const curQ = BANKBY[exam.order[exam.idx]];
  if(auto && !exam.results[curQ.id]){
    exam.results[curQ.id] = { frac:0, earned:0, points:curQ.points, hints:exam.hintsUsed[curQ.id]||0, your:'Not answered — time expired', right:'—' };
  }
  exam.paused = false;
  $('#pauseOverlay').style.display = 'none';
  renderResults();
}

/* ================= results ================= */
function confetti(){
  const colors = ['#22d3ee','#34d399','#fbbf24','#f87171','#a78bfa'];
  for(let i = 0; i < 80; i++){
    const s = el('span','confetti');
    const size = 6 + Math.random() * 10;
    s.style.left = (Math.random() * 100) + 'vw';
    s.style.width = size + 'px'; s.style.height = size * 0.6 + 'px';
    s.style.background = colors[i % colors.length];
    if(i % 3 === 0) s.style.borderRadius = '50%';
    s.style.animationDuration = (2.6 + Math.random() * 2.6) + 's';
    s.style.animationDelay = (Math.random() * 1.4) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 7500);
  }
}
function renderResults(){
  if(exam.timerId) clearInterval(exam.timerId);
  $('#hud').style.display = 'none';
  $('#pauseOverlay').style.display = 'none';
  document.body.classList.remove('exam-live');
  let earned = 0, poss = 0, full = 0, hints = 0;
  BANK.forEach(q => { poss += q.points; const r = exam.results[q.id]; if(r){ earned += r.earned; if(r.frac >= 1) full++; hints += r.hints; } });
  const pct = Math.round(earned / poss * 100);
  const pass = pct >= 80;
  const timeUsed = exam.total - exam.remaining;
  let html = '<div class="hero"><div class="tagline">CDPP-101 · Final Report</div>' +
    '<div class="pct" style="color:'+(pass ? 'var(--green)' : 'var(--red)')+'">'+pct+'%</div>' +
    '<h1 style="font-size:26px">'+(pass ? 'Certification passed' : 'Not this time — retake required')+'</h1></div>';
  html += '<div class="'+(pass ? 'banner-pass' : 'banner-fail')+'">' + (pass ? 'You scored '+pct+'% — above the 80% passing threshold. All themes assessed.' : 'You scored '+pct+'%. The passing score is 80%. Study the report below, then retake — everything reshuffles.') + '</div>';
  html += '<div class="statrow"><div class="stat"><b>'+earned+' / '+poss+'</b><span>points</span></div><div class="stat"><b>'+full+' / '+BANK.length+'</b><span>fully correct</span></div><div class="stat"><b>'+hints+'</b><span>hints used</span></div><div class="stat"><b>'+fmtT(timeUsed)+'</b><span>time used</span></div></div>';
  if(pass){
    html += '<div class="cert"><div class="csub">Certificate of achievement</div><div class="ctitle">Certified Data Protection Practitioner</div>' +
      '<div class="dim">Exam CDPP-101 — scenario-based certification</div>' +
      '<div class="cname" contenteditable="true" spellcheck="false" title="Click to type your name">Cybersecurity Candidate</div>' +
      '<div class="cmeta">Score <b>'+pct+'%</b> · passed on '+new Date().toLocaleDateString('en-GB',{ day:'numeric', month:'long', year:'numeric' })+'</div>' +
      '<div class="seal">CDPP<br>VERIFIED</div>' +
      '<div class="cmeta dim">Data protection · CIA triad · access controls · backup & recovery · GDPR · PCI-DSS · classification · encryption states</div></div>';
  } else {
    html += '<div class="card" style="text-align:center"><p class="mut" style="max-width:660px;margin:0 auto 16px">Every wrong answer in the report below has a tip saying exactly what to focus on. When you are ready, retake — the questions and all answer choices are reshuffled.</p><button class="btn btn-big" id="retakeBtn">Retake Exam</button></div>';
  }
  html += '<h3 class="sect">Theme mastery</h3><div class="card">';
  Object.keys(THEMES).forEach(t => {
    const qs = BANK.filter(q => q.theme === t);
    let e = 0, p = 0;
    qs.forEach(q => { p += q.points; if(exam.results[q.id]) e += exam.results[q.id].earned; });
    const pc = Math.round(e / p * 100);
    const col = pc >= 80 ? 'var(--green)' : (pc >= 50 ? 'var(--amber)' : 'var(--red)');
    html += '<div class="trow"><span class="tn">'+THEMES[t].name+'</span><div class="rbar"><div data-w="'+pc+'" style="width:0;background:'+col+'"></div></div><span class="tv">'+pc+'%</span></div>';
  });
  html += '</div>';
  html += '<h3 class="sect">Keywords covered</h3><div class="card"><div class="kwgrid">';
  Object.keys(KEYWORDS).forEach(t => {
    html += '<div class="kwcard"><h4>'+THEMES[t].name+'</h4>' + KEYWORDS[t].map(k => '<span class="kwtag">'+k+'</span>').join('') + '</div>';
  });
  html += '</div><p class="dim" style="margin-top:10px;font-size:12.5px">Every keyword above appears in at least one exercise you completed.</p></div>';
  html += '<h3 class="sect">Detailed report — every exercise</h3><div class="filterbar"><button class="fbtn on" data-f="all">All</button><button class="fbtn" data-f="review">Needs review</button><button class="fbtn" data-f="ok">Fully correct</button></div><div id="reportList"></div>';
  html += '<div style="text-align:center;margin:26px 0"><button class="btn btn-big" id="retakeBtn2">Retake Exam (reshuffled)</button></div>';
  $('#screen').innerHTML = html;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $$('#screen .rbar>div').forEach(b => { b.style.width = b.dataset.w + '%'; });
  }));
  if(pass) confetti();
  const drawRep = f => {
    const list = $('#reportList');
    list.innerHTML = '';
    exam.order.forEach((qid,i) => {
      const q = BANKBY[qid], r = exam.results[qid] || { frac:0, earned:0, hints:0, your:'Not answered', right:'—' };
      if(f === 'review' && r.frac >= 1) return;
      if(f === 'ok' && r.frac < 1) return;
      const cls = r.frac >= 1 ? 'ok' : (r.frac <= 0 ? 'ko' : 'part');
      const icon = r.frac >= 1 ? '✓' : (r.frac <= 0 ? '✗' : '△');
      const col = r.frac >= 1 ? 'var(--green)' : (r.frac <= 0 ? 'var(--red)' : 'var(--amber)');
      const card = el('div','rep-card ' + cls);
      card.innerHTML = '<div class="rep-head"><span style="color:'+col+';font-weight:800;font-size:16px">'+icon+'</span><span class="rt">'+(i+1)+'. '+q.title+'</span>' +
        '<span class="badge theme">'+THEMES[q.theme].short+'</span><span class="badge '+q.diff.toLowerCase()+'">'+q.diff+'</span>' +
        '<span class="rq">'+Math.round(r.frac*100)+'% · '+r.earned+'/'+q.points+' pts'+(r.hints ? ' · '+r.hints+' hint(s)' : '')+'</span></div>' +
        '<div class="yr"><div class="row"><b class="lab">YOUR ANSWER</b>'+r.your+'</div>' +
        '<div class="row"><b class="lab">CORRECT ANSWER</b>'+r.right+'</div></div>' +
        '<div style="font-size:13.8px;margin-top:8px"><b>Why:</b>' + q.explain + '</div>' +
        (r.frac < 1 ? '<div class="tipbox"><b>Focus on:</b> ' + q.tip.replace(/^Focus on: /,'') + '</div>' : '');
      list.appendChild(card);
    });
    if(!list.children.length) list.innerHTML = '<p class="dim">Nothing in this filter.</p>';
  };
  drawRep('all');
  $$('.fbtn').forEach(b => b.addEventListener('click', () => { $$('.fbtn').forEach(x => x.classList.remove('on')); b.classList.add('on'); drawRep(b.dataset.f); }));
  const retake = () => startExam();
  const r1 = $('#retakeBtn'); if(r1) r1.addEventListener('click', retake);
  $('#retakeBtn2').addEventListener('click', retake);
  window.scrollTo({ top:0 });
}

/* ================= init ================= */
$('#pauseBtn').addEventListener('click', () => togglePause());
$('#resumeBtn').addEventListener('click', () => togglePause(false));
$('#restartBtn').addEventListener('click', () => {
  if(confirm('Abandon this attempt and restart with a new shuffle?')) showIntro();
});
/* While paused, block all keyboard interaction with the hidden exercise (no typing into the terminal, etc.). */
document.addEventListener('keydown', e => {
  if(exam && exam.paused && e.target && e.target.closest && e.target.closest('#qcard')) e.preventDefault();
}, true);
showIntro();
</script>
</body>
</html>
