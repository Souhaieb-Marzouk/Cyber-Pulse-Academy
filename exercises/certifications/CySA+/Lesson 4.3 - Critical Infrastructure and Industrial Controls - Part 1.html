<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="OTSC-1 v2.0 — a single-file, interactive ICS/SCADA security certification exam with 32 scenario-based exercises.">
<title>OTSC-1 v2.0 — ICS / SCADA Security Certification Exam</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#070c12; --panel:#101a25; --panel2:#16232f; --panel3:#1b2b39;
  --line:#1e2f40; --line2:#2b4358;
  --txt:#dbe8f5; --mut:#8aa3bb; --dim:#61798f;
  --acc:#22d3ee; --acc2:#0ea5e9; --vio:#a78bfa;
  --ok:#22c55e; --okb:#0e3a22; --okl:#123f26;
  --bad:#ef4444; --badb:#41161b; --badl:#4a1a20;
  --warn:#f59e0b; --warnb:#3d2b08; --warnl:#4a3409;
}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--txt); font-family:"Segoe UI",Roboto,-apple-system,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.5;
  background-image:radial-gradient(900px 480px at 8% -12%, #0c2637 0%, transparent 62%),
                   radial-gradient(820px 460px at 108% -4%, #1b1033 0%, transparent 58%);
  background-attachment:fixed;
}
.hidden{display:none !important}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 90px}

/* ---------- top bar ---------- */
#topbar{position:sticky;top:0;z-index:40;background:rgba(9,15,22,.93);backdrop-filter:blur(9px);
  border-bottom:1px solid var(--line);}
#topbar .inner{max-width:1180px;margin:0 auto;padding:9px 18px}
.tbrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.4px;font-size:14px;color:var(--txt);white-space:nowrap}
.brand span{color:var(--acc)}
.spacer{flex:1}
.tstat{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 9px;white-space:nowrap}
.tstat b{color:var(--txt);font-variant-numeric:tabular-nums;font-size:13.5px}
#timerBox.warn{border-color:var(--warn);color:var(--warn)}
#timerBox.warn b{color:var(--warn)}
#timerBox.crit{border-color:var(--bad);color:var(--bad);animation:pulse 1s infinite}
#timerBox.crit b{color:var(--bad)}
@keyframes pulse{50%{background:rgba(239,68,68,.13)}}
#scoreBox b{color:var(--acc)}
#barOuter{height:6px;background:#0b141d;border-radius:6px;overflow:hidden;margin-top:9px;border:1px solid #16232f}
#barFill{height:100%;width:0%;border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1);
  background:linear-gradient(90deg,#0891b2,#22d3ee,#67e8f9)}
.themerail{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tm{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mut);
  background:#0d1620;border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 8px}
.tmdot{width:7px;height:7px;border-radius:50%;flex:none}
.tmbar{width:44px;height:4px;background:#16232f;border-radius:4px;overflow:hidden}
.tmbar i{display:block;height:100%;width:0;transition:width .4s;border-radius:4px}
.tm b{color:var(--txt);font-variant-numeric:tabular-nums}

/* ---------- generic ---------- */
.card{background:linear-gradient(180deg,var(--panel) 0%,#0e1721 100%);border:1px solid var(--line);
  border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 10px 30px -18px #000}
h1{font-size:26px;margin:0 0 8px;letter-spacing:-.3px}
h2{font-size:19px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px;color:var(--acc)}
p{margin:0 0 10px}
.mut{color:var(--mut)}
.dim{color:var(--dim)}
.small{font-size:13px}
.mono{font-family:"Cascadia Mono",Consolas,"Courier New",monospace}
.btn{font:inherit;font-size:14px;cursor:pointer;border-radius:9px;padding:9px 16px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--txt);transition:.16s;font-weight:600}
.btn:hover{background:var(--panel3);border-color:var(--acc)}
.btn:disabled{opacity:.42;cursor:not-allowed;border-color:var(--line);background:var(--panel)}
.btn:disabled:hover{background:var(--panel);border-color:var(--line)}
.btn-primary{background:linear-gradient(180deg,#0891b2,#0e7490);border-color:#22d3ee;color:#00151b}
.btn-primary:hover{background:linear-gradient(180deg,#22d3ee,#0891b2);border-color:#67e8f9}
.btn-warn{background:var(--warnb);border-color:var(--warn);color:#ffd98a}
.btn-warn:hover{background:#54390b}
.btn-ghost{background:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  padding:3px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--mut);background:#0d1620}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--okb)}
.pill.bad{color:var(--bad);border-color:var(--bad);background:var(--badb)}
.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--warnb)}
.pill.acc{color:var(--acc);border-color:var(--acc);background:#062a33}
.pill.part{color:var(--warn);border-color:var(--warn);background:var(--warnb)}

/* ---------- intro ---------- */
.kwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.kwbox{background:#0c151e;border:1px solid var(--line);border-radius:11px;padding:13px 14px;border-left-width:3px}
.kwbox h4{margin:0 0 8px;font-size:13.5px;letter-spacing:.2px}
.kwlist{display:flex;flex-wrap:wrap;gap:6px}
.kwtag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:#111d29;
  border:1px solid #1f3346;color:#a9c2d8}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:6px}
.rule{background:#0c151e;border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.rule b{display:block;color:var(--acc);font-size:13px;margin-bottom:3px}
.exlist{columns:2;column-gap:22px;font-size:13.5px;color:var(--mut)}
.exlist div{break-inside:avoid;margin-bottom:3px}
@media(max-width:720px){.exlist{columns:1}}

/* ---------- question ---------- */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.qnum{font-size:12px;color:var(--dim);font-weight:700;letter-spacing:1px}
.qtitle{font-size:19px;font-weight:700;margin:2px 0 10px}
.scenario{background:#0b141d;border:1px solid var(--line);border-left:3px solid var(--acc);
  border-radius:9px;padding:12px 14px;margin-bottom:14px;font-size:14px;color:#c3d6e8}
.scenario .lbl{display:block;font-size:11px;letter-spacing:1px;color:var(--acc);text-transform:uppercase;margin-bottom:5px;font-weight:700}
.task{font-weight:600;margin:0 0 12px}

/* options */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;font:inherit;font-size:14px;
  background:#0d1720;border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--txt);
  cursor:pointer;transition:.15s;width:100%}
.opt:hover{border-color:var(--acc);background:#101d28}
.opt .mark{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:flex;
  align-items:center;justify-content:center;font-size:12px;margin-top:1px;color:var(--dim)}
.opt.multi .mark{border-radius:5px}
.opt.sel{border-color:var(--acc);background:#0a2b35;box-shadow:0 0 0 1px #164e5c inset}
.opt.sel .mark{border-color:var(--acc);background:var(--acc);color:#00151b}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.ok .mark{border-color:var(--ok);background:var(--ok);color:#00150a}
.opt.bad{border-color:var(--bad);background:var(--badb)}
.opt.bad .mark{border-color:var(--bad);background:var(--bad);color:#1b0000}
.opt.miss{border-color:var(--warn);background:var(--warnb)}
.opt.miss .mark{border-color:var(--warn);color:var(--warn)}
.opt:disabled{cursor:default}
.opt:disabled:hover{background:inherit}
.opt.ok:disabled:hover{background:var(--okb)}
.opt.bad:disabled:hover{background:var(--badb)}
.opt.miss:disabled:hover{background:var(--warnb)}

/* buckets / drag */
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;background:#0b141d;border:1px dashed var(--line2);
  border-radius:10px;padding:10px}
.tray.over{border-color:var(--acc);background:#0a2029}
.chip{display:inline-flex;align-items:center;flex-wrap:wrap;gap:7px;font-size:13px;background:#152633;border:1px solid #29455c;
  border-radius:8px;padding:6px 11px;cursor:grab;user-select:none;transition:.14s;max-width:100%}
.chip:hover{border-color:var(--acc);background:#1a3040}
.chip.sel{border-color:var(--acc);background:#0a3a47;box-shadow:0 0 0 2px #10404d}
.chip.dragging{opacity:.4}
.chip.ok{border-color:var(--ok);background:var(--okb)}
.chip.bad{border-color:var(--bad);background:var(--badb)}
.chip .mini{font-size:10.5px;color:var(--warn);display:block;width:100%;line-height:1.35;margin-top:3px}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px;margin-top:12px}
.bucket{background:#0c1620;border:1px solid var(--line);border-radius:11px;padding:10px}
.bucket h4{margin:0 0 8px;font-size:12.5px;color:#9fb8ce;letter-spacing:.3px;border-bottom:1px solid var(--line);padding-bottom:6px}
.bucket .drop{display:flex;flex-direction:column;gap:6px;min-height:56px;border-radius:8px;padding:5px;transition:.15s}
.bucket .drop.over{background:#0a2a34;outline:1px dashed var(--acc)}
.bucket .drop .chip{width:100%}

/* order list */
.orderlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.orderlist li{display:flex;align-items:center;gap:10px;background:#0d1720;border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;cursor:grab;transition:.14s}
.orderlist li:hover{border-color:var(--acc)}
.orderlist li.dragging{opacity:.4}
.orderlist li.ok{border-color:var(--ok);background:var(--okb)}
.orderlist li.bad{border-color:var(--bad);background:var(--badb)}
.orderlist .rk{flex:none;width:26px;height:26px;border-radius:7px;background:#16283a;color:var(--acc);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.orderlist .tx{flex:1;font-size:13.5px}
.mvb{display:flex;flex-direction:column;gap:2px}
.mvb button{width:26px;height:18px;font-size:9px;line-height:1;padding:0;border-radius:5px;cursor:pointer;
  background:#16283a;border:1px solid var(--line2);color:var(--mut)}
.mvb button:hover{border-color:var(--acc);color:var(--acc)}

/* pair */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.pairs{grid-template-columns:1fr}}
.pcol h4{margin:0 0 8px;font-size:12px;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
.prow{display:flex;flex-direction:column;gap:4px;background:#0d1720;border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;margin-bottom:8px;cursor:pointer;transition:.14s}
.prow:hover{border-color:var(--acc)}
.prow.sel{border-color:var(--acc);box-shadow:0 0 0 2px #10404d inset}
.prow.ok{border-color:var(--ok);background:var(--okb)}
.prow.bad{border-color:var(--bad);background:var(--badb)}
.prow .pl{font-size:13.5px;font-weight:600}
.prow .pa{font-size:12px;color:var(--acc);border-top:1px dashed #24384b;padding-top:5px;margin-top:2px}
.prow .pa.empty{color:var(--dim);font-style:italic}
.popt{background:#0d1720;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;
  font-size:13px;cursor:pointer;transition:.14s}
.popt:hover{border-color:var(--acc);background:#101d28}
.popt.used{opacity:.34;cursor:default}
.popt.used:hover{border-color:var(--line);background:#0d1720}
.popt.ok{border-color:var(--ok);background:var(--okb);opacity:1}
.popt.bad{border-color:var(--bad);background:var(--badb)}
.popt.ok:hover,.popt.bad:hover{border-color:inherit}

/* fill */
.filltext{background:#0b141d;border:1px solid var(--line);border-radius:11px;padding:16px;font-size:14.5px;
  line-height:2.35;color:#c8dbec}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:112px;min-height:28px;
  border:1px dashed var(--line2);border-radius:7px;padding:1px 9px;margin:0 4px;cursor:pointer;
  background:#0f1a24;font-size:13px;vertical-align:middle;transition:.14s;color:var(--txt)}
.blank:hover{border-color:var(--acc)}
.blank.empty{color:var(--dim);font-size:11.5px}
.blank.over{border-color:var(--acc);background:#0a2a34}
.blank.sel{border-color:var(--acc);box-shadow:0 0 0 2px #10404d}
.blank.ok{border-style:solid;border-color:var(--ok);background:var(--okb);color:#b8f5cf}
.blank.bad{border-style:solid;border-color:var(--bad);background:var(--badb);color:#ffc9c9}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px;background:#0b141d;border:1px dashed var(--line2);
  border-radius:10px;padding:11px;min-height:50px}
.bank.over{border-color:var(--acc);background:#0a2029}

/* terminal */
.term{border:1px solid #24425a;border-radius:11px;overflow:hidden;background:#04090d;
  box-shadow:0 0 0 1px #0a1a24 inset, 0 12px 30px -20px #000}
.termhead{display:flex;align-items:center;gap:6px;background:#101d28;padding:7px 11px;border-bottom:1px solid #1c3143}
.termhead .dot{width:10px;height:10px;border-radius:50%}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.termtitle{margin-left:8px;font-size:12px;color:var(--mut);font-family:"Cascadia Mono",Consolas,monospace}
.termbody{padding:12px 13px;font-family:"Cascadia Mono",Consolas,"Courier New",monospace;font-size:13px;
  height:290px;overflow-y:auto;color:#b9f0d0}
.tl{white-space:pre-wrap;word-break:break-word;margin-bottom:2px}
.tl.cmd{color:#e8f6ff}
.tl.err{color:#ff8b8b}
.tl.ok{color:#7ff0a8}
.tl.warn{color:#ffce6a}
.tl.dim{color:#5c7f95}
.terminline{display:flex;align-items:center;gap:8px;border-top:1px solid #16283a;padding:9px 13px;background:#08121a}
.tprompt{color:#4fd1c5;font-family:"Cascadia Mono",Consolas,monospace;font-size:12.5px;white-space:nowrap}
#tIn{flex:1;background:transparent;border:0;outline:0;color:#dff7e6;font-family:"Cascadia Mono",Consolas,monospace;font-size:13px}
.reqs{display:flex;flex-direction:column;gap:5px;margin-top:11px;font-size:13px}
.req{display:flex;gap:8px;align-items:flex-start;background:#0d1720;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.req .ic{flex:none;width:17px;font-weight:700}
.req.ok{border-color:var(--ok);background:var(--okb)}
.req.bad{border-color:var(--bad);background:var(--badb)}

/* logs */
.logpanel{border:1px solid #24425a;border-radius:11px;overflow:hidden;background:#050b11}
.logbar{display:flex;gap:8px;align-items:center;background:#101d28;padding:8px 11px;border-bottom:1px solid #1c3143;flex-wrap:wrap}
.logbar input[type=text]{flex:1;min-width:150px;background:#0a141d;border:1px solid var(--line2);border-radius:7px;
  padding:6px 10px;color:var(--txt);font-family:"Cascadia Mono",Consolas,monospace;font-size:12.5px;outline:0}
.logbar input[type=text]:focus{border-color:var(--acc)}
.logbar select{background:#0a141d;border:1px solid var(--line2);border-radius:7px;padding:6px 8px;color:var(--mut);
  font-family:inherit;font-size:12.5px;outline:0}
.logbody{max-height:330px;overflow-y:auto;padding:9px 11px;font-family:"Cascadia Mono",Consolas,monospace;font-size:12.3px}
.logline{display:flex;gap:9px;padding:3px 4px;border-radius:5px;white-space:pre-wrap;word-break:break-word}
.logline:hover{background:#0c1a24}
.logline .lt{color:#6791ad;flex:none}
.logline .ls{color:#c9a8ff;flex:none;min-width:104px}
.logline .lv{flex:none;font-weight:700;min-width:56px}
.logline .lm{color:#bcd3e6;flex:1}
.lv-INFO{color:#5fd0e8}.lv-WARN{color:#ffce6a}.lv-ALERT{color:#ff7a7a}
.lv-ALLOW{color:#83d9a0}.lv-DENY{color:#ff8b8b}.lv-GOOSE{color:#c9a8ff}.lv-UNSOL{color:#ffa86a}
.logline mark{background:#f59e0b;color:#20160a;border-radius:3px;padding:0 2px}
.logline.hidden{display:none}
.logcount{font-size:11.5px;color:var(--dim);white-space:nowrap}

/* post-answer feedback */
.fb{margin-top:16px;border-radius:12px;border:1px solid var(--line);overflow:hidden;animation:rise .32s ease}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.fbhead{padding:10px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.fb.ok .fbhead{background:var(--okb);color:#a9f3c4;border-bottom:1px solid #1d5c39}
.fb.part .fbhead{background:var(--warnb);color:#ffdc9a;border-bottom:1px solid #6b4d09}
.fb.bad .fbhead{background:var(--badb);color:#ffc0c0;border-bottom:1px solid #6d2429}
.fbbody{padding:13px 15px;background:#0c151e;font-size:13.8px;color:#c9dbec}
.fbbody b{color:#eaf4ff}
.fbbody ul{margin:6px 0 10px;padding-left:20px}
.fbbody li{margin-bottom:5px}
.focusbox{margin-top:11px;background:#1c1405;border:1px solid #6b4d09;border-left:3px solid var(--warn);
  border-radius:8px;padding:10px 12px;font-size:13.2px;color:#ffdca6}
.answerline{margin-top:10px;background:#0a1a24;border:1px solid #1d3a4d;border-radius:8px;padding:9px 12px;font-size:13px;color:#a8c6dc}
.hintbox{background:#101d33;border:1px solid #2c4a7a;border-left:3px solid var(--vio);border-radius:9px;
  padding:11px 13px;margin-bottom:13px;font-size:13.4px;color:#cfd8ff;animation:rise .3s ease}
.hintbox b{color:#c9b6ff}

/* nav */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(9,15,22,.95);backdrop-filter:blur(9px);
  border-top:1px solid var(--line);padding:10px 18px}
.navinner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qdots{display:flex;gap:3px;flex-wrap:wrap;flex:1;min-width:120px}
.qdot{width:13px;height:13px;border-radius:4px;background:#16232f;border:1px solid #22384b;cursor:pointer;transition:.15s}
.qdot:hover{transform:scale(1.22)}
.qdot.cur{border-color:var(--acc);box-shadow:0 0 0 2px #10404d}
.qdot.ok{background:var(--ok);border-color:var(--ok)}
.qdot.part{background:var(--warn);border-color:var(--warn)}
.qdot.bad{background:var(--bad);border-color:var(--bad)}

/* pause */
#pauseOverlay{position:fixed;inset:0;z-index:90;background:rgba(4,8,12,.9);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px}
.pausebox{text-align:center;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:34px 40px;max-width:460px}
.pausebox h2{font-size:24px;color:var(--warn);letter-spacing:2px}
#stageWrap.blurred{filter:blur(26px) saturate(.12) brightness(.5);pointer-events:none;user-select:none}

/* results */
.verdict{text-align:center;border-radius:16px;padding:26px;margin-bottom:16px;border:1px solid var(--line)}
.verdict.pass{background:linear-gradient(180deg,#0d2f1e,#0a1a14);border-color:#1f7a45;box-shadow:0 0 60px -25px #22c55e}
.verdict.fail{background:linear-gradient(180deg,#33131a,#180a0d);border-color:#8a2b34;box-shadow:0 0 60px -25px #ef4444}
.verdict h1{font-size:34px;letter-spacing:7px;margin:4px 0 6px}
.verdict.pass h1{color:#4ade80;text-shadow:0 0 26px #22c55e}
.verdict.fail h1{color:#f87171;text-shadow:0 0 26px #ef4444}
.bigscore{font-size:60px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.seal{display:inline-flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--acc);border-radius:50%;
  width:112px;height:112px;justify-content:center;color:var(--acc);font-size:11px;letter-spacing:1px;margin:8px}
.seal b{font-size:30px;letter-spacing:0}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-top:14px}
.stat{background:#0c151e;border:1px solid var(--line);border-radius:11px;padding:12px 14px;text-align:center}
